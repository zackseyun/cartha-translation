reference: Job 6:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עַ֭תָּה הֱיִ֣יתֶם לא תִּֽרְא֥וּ חֲ֝תַ֗ת וַ/תִּירָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
  footnotes:
  - marker: a
    text: Hebrew literally reads something like 'you have become not.' Many understand the sense as 'you have become nothing' or 'you have become like it,' that is, like the unreliable streams in the preceding verses.
    reason: textual_variant
  - marker: b
    text: Or 'you see calamity and are afraid.' The noun can denote terror, dismay, or a shattering disaster.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 이제 여러분은 아무것도 아니게 되었습니다[a]. 여러분은 공포를 보고 두려워합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “여러분은 ‘아니’가 되었습니다”에 가깝습니다. 이를 “아무것도 아니게 되었습니다”로 이해하기도 하고, 앞 절의 비유를 따라 “믿을 수 없는 시내들처럼 되었습니다”로 이해하기도 합니다.
    reason: textual_variant
  - marker: b
    text: 또는 “재앙을 보고 두려워합니다.” 이 명사는 공포, 당혹, 또는 무너뜨리는 재난을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  english_pob_choice: For now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 지금으로서는
  lexicon: HALOT
  rationale: 현재 상황을 앞선 비유와 대조하는 시간 부사로 옮기되, 한국어에서는 원인 접속의 뉘앙스보다 현시점 강조가 더 자연스럽습니다.
- source_word: הֱיִיתֶם לא
  english_pob_choice: you have become nothing
  chosen_korean: 아무것도 아니게 되었습니다
  alternatives_korean:
  - 아무것도 되지 않았습니다
  - 없게 되었습니다
  - 아무것도 아닌 존재가 되었습니다
  lexicon: HALOT
  rationale: 히브리어의 שינוי 상태를 살리면서, 문맥상 '쓸모없게/아무것도 아니게 됨'이라는 의미를 한국어로 자연스럽게 전달합니다.
- source_word: חֲתַת
  english_pob_choice: terror
  chosen_korean: 재앙
  alternatives_korean:
  - 공포
  - 두려움
  - 참사
  lexicon: HALOT
  rationale: 본문의 명사에는 공포와 재난의 의미 범위가 있으므로, 앞선 문맥의 무너짐·파멸을 살리는 '재앙'을 택했습니다.
- source_word: וַתִּירָאוּ
  english_pob_choice: and you are afraid
  chosen_korean: 두려워합니다
  alternatives_korean:
  - 무서워합니다
  - 두려워하게 됩니다
  - 겁을 냅니다
  lexicon: HALOT
  rationale: אָ라/ירא의 기본 의미를 따라 현재적 반응으로 자연스럽게 옮기되, 문어체 합쇼체에 맞게 정리했습니다.
theological_decisions:
- issue: 욥이 친구들을 '아무것도 아니게 되었다'고 말하는 직설성
  chosen_reading: 친구들이 신뢰할 수 없는 시내처럼 실질적 도움을 주지 못한 상태를 강하게 책망하는 표현으로 유지했습니다.
  alternative_readings:
  - 더 완곡하게 '쓸모없게 되었습니다'로 옮김
  - 관용적으로 '헛된 사람이 되었습니다'로 옮김
  rationale: 본문의 수사적 비난을 약화시키지 않으면서도, 한국어로 이해 가능한 상태 변화 표현을 선택했습니다.
  doctrine_reference: 욥기의 시적 논증과 친구들에 대한 책망
- issue: חֲתַת의 의미 범위
  chosen_reading: 주석에 따라 '재앙'을 본 결과로 '두려워합니다'를 병치해, 공포와 파괴의 이중 의미를 드러냈습니다.
  alternative_readings:
  - '''공포''로 직역해 감정 중심으로만 처리'
  - '''참사''로 직역해 사건 중심으로만 처리'
  rationale: 단일어로는 의미 범위를 다 담기 어려워, 본문과 영어 POB의 해설을 반영해 자연스럽게 분산 표현했습니다.
  doctrine_reference: 히브리 시어의 다의성 보존
