id: JOB.6.9
reference: Job 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֹאֵ֣ל אֱ֭לוֹהַּ וִֽ/ידַכְּאֵ֑/נִי יַתֵּ֥ר יָ֝ד֗/וֹ וִֽ/יבַצְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/009.yaml
  text: that God would be willing to crush me[c][b][a], that he would let loose his hand and cut me off.
  footnotes:
  - marker: a
    text: Or 'that God would please to crush me.' The Hebrew verb expresses willingness or consent.
    reason: lexical_alternative
  - marker: b
    text: Literally 'let loose his hand,' an idiom for removing restraint in order to strike.
    reason: cultural_note
  - marker: c
    text: Or 'sever me' or 'finish me off.' The Hebrew conveys decisive, final destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 기꺼이[a] 나를 부수시고, 손을 풀어[b] 나를 끊어 버리시기를[c] 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원하시다’, ‘동의하시다’. 히브리어 동사는 기꺼이 하려는 의지나 동의를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손을 풀어’. 제약을 풀고 치기 위해 손을 놓아주는 것을 가리키는 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나를 잘라 내시기를’, ‘나를 끝내시기를’. 히브리어는 결정적이고 최종적인 파괴를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל אֱלוֹהַּ
  english_pob_choice: would be willing / God
  chosen_korean: 하나님께서 나를 부수시기를 원하시고
  alternatives_korean:
  - 하나님께서 나를 부수시기를 기뻐하시고
  - 하나님께서 나를 부수시기를 원의하시고
  lexicon: HALOT
  rationale: יואל의 뜻은 ‘기꺼이 하다, 원하다, 동의하다’이므로, Job의 탄원 맥락에서는 ‘원하시다’가 의지의 뉘앙스를 자연스럽게 살립니다. אֱלוֹהַּ는 욥기에서의 ‘하나님’으로 옮기는 것이 직접적입니다.
- source_word: וִידַכְּאֵנִי
  english_pob_choice: crush me
  chosen_korean: 나를 부수시기를
  alternatives_korean:
  - 나를 짓누르시기를
  - 나를 짓부수시기를
  lexicon: HALOT
  rationale: דכא의 강한 파괴성을 살려 ‘부수다’로 옮겼습니다. ‘짓누르다’보다 파괴와 절박함이 더 분명하게 드러납니다.
- source_word: יַתֵּר יָדוֹ
  english_pob_choice: let loose his hand
  chosen_korean: 손을 놓아
  alternatives_korean:
  - 손을 풀어
  - 손을 거두어
  lexicon: HALOT
  rationale: 직역하면 ‘손을 풀다/놓다’이지만, 영어 POB가 주석한 것처럼 제약을 거두고 치는 관용구이므로 한국어에서도 ‘손을 놓아’로 옮겨 몸의 손 이미지와 관용적 의미를 함께 살렸습니다.
- source_word: וִיבַצְּעֵנִי
  english_pob_choice: cut me off
  chosen_korean: 나를 끊어 버리시기를 바랍니다
  alternatives_korean:
  - 나를 잘라 내시기를 바랍니다
  - 나를 끝내시기를 바랍니다
  lexicon: HALOT
  rationale: בצע는 단순히 ‘죽이다’보다 단호하게 ‘자르다/끊다’의 종결성을 가지므로, 욥의 절망적 소망을 반영해 ‘끊어 버리다’로 번역했습니다.
theological_decisions:
- issue: 하나님의 손이라는 의인화 표현
  chosen_reading: ‘손을 놓아’로 직역적 이미지를 유지해, 하나님의 행위를 추상화하지 않았습니다.
  alternative_readings:
  - 그분의 능력을 풀어
  - 그분의 심판을 내리어
  rationale: 히브리어는 신적 행위를 구체적 신체 이미지로 표현합니다. 이를 보존하면 욥의 탄원의 격정과 긴박성이 살아나며, 본문의 관용구적 성격도 유지됩니다.
  doctrine_reference: Translation philosophy §1, §3
