source:
  edition: WLC
  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
  footnotes:
  - marker: a
    text: Or 'If only my request would come, and God would give my hope.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내 소원이 이루어지기를 바라며, 내 희망을 하나님께서 주시기 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아, 내 요청이 이루어지고 하나님께서 내 희망을 주시기 바랍니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that
  chosen_korean: 아, ...되기를 바라며
  alternatives_korean:
  - 오, ...되기를
  - 누가 ...주겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구 מִי יִתֵּן은 문자적 질문이 아니라 간절한 소망을 드러내는 감탄이므로, 한국어에서도 기도·탄식의 어조를 살려 ‘아, ...되기를 바라며’로 옮겼습니다.
- source_word: שֶׁאֱלָתִי
  english_pob_choice: my request
  chosen_korean: 내 소원
  alternatives_korean:
  - 내 요청
  - 내 간구
  lexicon: HALOT
  rationale: 문맥상 욥의 절박한 바람을 가리키므로, 비교적 자연스럽고 간결한 ‘소원’이 요청의 의미를 담으면서도 탄식의 정서를 유지합니다.
- source_word: וְתִקְוָתִי
  english_pob_choice: and that my hope
  chosen_korean: 내 희망
  alternatives_korean:
  - 내 소망
  - 내 기대
  lexicon: HALOT
  rationale: תִקְוָה는 일반적으로 ‘희망/기대’의 뜻이므로, 본문 병행 구조를 살려 ‘내 희망’으로 직역에 가깝게 유지했습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님이
  - 하나님께
  lexicon: HALOT
  rationale: אֱלוֹהַּ는 욥기에서 쓰이는 ‘하나님’의 일반 명칭이므로, 한국어 표준 신학 용례에 맞춰 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 희망/소망을 ‘주시다’로 옮길지, 청원의 응답으로 볼지
  chosen_reading: 여기서는 욥의 ‘희망’ 자체가 하나님께서 이루어 주시는 청원의 대상이라는 점을 드러내기 위해 ‘주시기 바랍니다’로 옮겼습니다.
  alternative_readings:
  - ‘내 희망을 하나님께서 주시기를 바랍니다’
  - ‘하나님께서 내 희망을 이루어 주시기를 바랍니다’
  rationale: 원문은 요청과 희망을 병렬로 두며, 둘 다 하나님이 응답하시는 대상으로 제시합니다. 한국어에서는 ‘주다/주시다’가 추상 명사와 결합할 때 다소 어색할 수 있어, 간결한 청원형으로 다듬었습니다.
  doctrine_reference: 탄식시/지혜문학의 간구 표현
- issue: 감탄사 ‘Oh’의 정서 보존
  chosen_reading: 감탄적 소망을 ‘아,’로 시작해 유지했습니다.
  alternative_readings:
  - ‘오,’
  - 생략
  rationale: 본문의 첫머리는 단순 진술이 아니라 강한 열망의 표지이므로, 한국어에서도 감탄형을 유지하는 것이 원문의 정서와 잘 맞습니다.
  doctrine_reference: 히브리어 시적 관용구
