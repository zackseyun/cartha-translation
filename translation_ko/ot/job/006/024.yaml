lexical_decisions:
- source_word: הוֹרוּנִי
  english_pob_choice: Teach me
  chosen_korean: 가르쳐 주십시오
  alternatives_korean:
  - 가르쳐 주시기 바랍니다
  - 알려 주십시오
  - 가르침을 주십시오
  lexicon: HALOT
  rationale: Hiphil형의 요청을 자연스럽고 직접적인 명령형으로 살렸고, ‘가르치다’가 교정과 훈계의 의미를 함께 담아 문맥에 맞습니다.
- source_word: אַחֲרִישׁ
  english_pob_choice: will be silent
  chosen_korean: 잠잠하겠습니다
  alternatives_korean:
  - 침묵하겠습니다
  - 조용히 있겠습니다
  - 말하지 않겠습니다
  lexicon: HALOT
  rationale: 단순히 소리를 내지 않는다는 뜻보다, 변론을 멈추고 입을 닫는 정중하고 격식 있는 뉘앙스를 살렸습니다.
- source_word: שָׁגִיתִי
  english_pob_choice: I have gone astray
  chosen_korean: 제가 무엇을 잘못했는지
  alternatives_korean:
  - 제가 어디서 잘못했는지
  - 제가 어떤 점에서 빗나갔는지
  - 제가 잘못한 바를
  lexicon: HALOT
  rationale: 영어 POB의 설명을 따라 ‘길에서 벗어남’의 은유를 한국어에서 자연스럽게 풀어, 어떤 잘못인지 특정해 달라는 요청으로 옮겼습니다.
- source_word: הָבִינוּ לִי
  english_pob_choice: make me understand
  chosen_korean: 저에게 깨닫게 해 주십시오
  alternatives_korean:
  - 저에게 이해시켜 주십시오
  - 저에게 설명해 주십시오
  - 저로 알게 해 주십시오
  lexicon: HALOT
  rationale: 히필형의 인과적 의미를 살리되, 현대 한국어에서 가장 자연스러운 ‘깨닫게 해 주십시오’로 옮겼습니다.
theological_decisions:
- issue: 욥의 태도와 발화의 등록(register)
  chosen_reading: 원문의 간청을 살려, 상대를 ‘가르쳐 주십시오’라고 정중하게 요청하는 합쇼체로 옮겼습니다.
  alternative_readings:
  - 좀 더 직설적인 ‘가르쳐 보십시오’
  - 완곡한 ‘알려 주십시오’
  rationale: 욥이 자신의 오류를 지적받고자 하는 진지한 항변이므로, 현대 한국어의 공손한 요청형이 원문의 절박함과 예의 바른 논쟁적 분위기를 함께 전달합니다.
  doctrine_reference: 문맥상 지혜 문학의 논쟁적 발화(register) 보존
