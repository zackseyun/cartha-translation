translation:
  language: ko
  text: 정직한 말이 얼마나 힘이 있습니까! 그러나 여러분에게서 나온 책망이 무엇을 증명합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정직한 말은 얼마나 아픕니까! 그러나 여러분의 논박이 무엇을 증명합니까?” 히브리어는 첫 절에서 ‘아프다’, ‘설득력이 있다’, ‘힘이 있다’ 등의 뉘앙스를, 둘째 절에서 ‘논박’ 또는 ‘책망’의 뉘앙스를 허용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: How
  chosen_korean: 보십시오, ... 얼마나
  alternatives_korean:
  - 얼마나
  - 어찌
  - 참으로
  lexicon: HALOT
  rationale: 여기서 מַה는 단순 정보 질문이 아니라 감탄형 정도 표현이므로, 한국어에서는 ‘얼마나’로 그 감탄의 세기를 살렸습니다.
- source_word: נִּמְרְצוּ אִמְרֵי יֹשֶׁר
  english_pob_choice: forceful are upright words
  chosen_korean: 바른 말은 얼마나 힘이 있습니까
  alternatives_korean:
  - 정직한 말은 얼마나 힘이 있습니까
  - 의로운 말은 얼마나 힘이 있습니까
  - 바른 말은 얼마나 강합니까
  lexicon: HALOT
  rationale: נמרצו의 힘/강함의 뉘앙스를 ‘힘이 있다’로 옮기고, יֹשֶׁר는 직선성·도덕적 바름을 함께 담는 ‘바른’으로 간결하게 살렸습니다.
- source_word: הוֹכֵחַ
  english_pob_choice: reproof
  chosen_korean: 책망
  alternatives_korean:
  - 꾸지람
  - 책려
  - 변론
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서 그대로 재현하기는 어렵기 때문에, 의미상 가장 자연스러운 ‘책망’을 택해 재판적/훈계적 성격을 드러냈습니다.
- source_word: מִכֶּם
  english_pob_choice: from you
  chosen_korean: 여러분의
  alternatives_korean:
  - 여러분에게서
  - 여러분으로부터
  - 당신들의
  lexicon: HALOT
  rationale: מן+대명사는 출처를 나타내므로 직역하면 ‘여러분에게서’가 가능하지만, 문맥상 ‘여러분의 책망’으로 자연스럽게 압축해도 출처 관계는 유지됩니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 욥은 친구들의 책망이 실제로 아무 증명도 하지 못한다고 반문합니다.
  alternative_readings:
  - 그들의 말이 단지 아프기만 하다는 뜻일 수 있습니다.
  - 그들의 논쟁이 설득력 없다는 점을 지적하는 말일 수 있습니다.
  rationale: 히브리어 두 절 모두 수사적 반문으로 기능하므로, 한국어도 단정적 설명보다 반문 형식으로 긴장감을 유지했습니다.
  doctrine_reference: 문맥 주해
