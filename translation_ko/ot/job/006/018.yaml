  to: 그들의 길은 굽이쳐 방향을 바꾸고, 황무지로 올라가 사라집니다.[a]
  rationale: 한국어에서 어색한 ‘길의 오솔길’을 집합적 표현인 ‘그들의 길’로 바꾸고, ‘오솔길’이 덧붙이던 좁은 길의 의미를 제거했습니다. ‘굽이쳐 방향을 바꾸고’는 원문의 비틀림·방향 전환을 자연스럽게 반영합니다. 황무지로 올라가 사라지는 난해한 이미지는 본문에서 보존했으며, 대상 행렬 해석은 각주에 제한했습니다.
  reviewer_model: gpt-5.6-terra
