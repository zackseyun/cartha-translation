id: JOB.6.18
reference: Job 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִ֭לָּ֣פְתוּ אָרְח֣וֹת דַּרְכָּ֑/ם יַעֲל֖וּ בַ/תֹּ֣הוּ וְ/יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
  footnotes:
  - marker: a
    text: Or 'The caravan tracks turn aside; they go up into the waste and vanish.' The Hebrew imagery is difficult, and some understand the verse to speak of caravans rather than the paths or channels themselves.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 길의 오솔길은 빗나가고, 그들은 황무지로 올라가서 사라집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이미지는 해석이 어렵습니다. 어떤 이들은 이 절을 길이나 수로보다 대상의 행렬, 곧 대상의 이동로로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  english_pob_choice: wind away
  chosen_korean: 빗나가고
  alternatives_korean:
  - 돌아서고
  - 굽이치고
  - 비켜가고
  lexicon: HALOT
  rationale: פעל의 뉘앙스를 길이 제 방향에서 벗어나 '비껴나감/굽음'으로 이해해, 한국어에서는 짧고 자연스러운 동사구 '빗나가고'로 원이미지를 살렸습니다.
- source_word: אָרְחוֹת דַּרְכָּם
  english_pob_choice: paths of their course
  chosen_korean: 그들의 길의 오솔길
  alternatives_korean:
  - 그들의 길의 길들
  - 그들의 길의 흔적
  - 그들의 노정
  lexicon: HALOT
  rationale: אָרְחוֹת는 '오솔길/길목'보다 '길들·흔적'로도 갈 수 있으나, POB의 'paths'와 평행을 이루도록 길이 남긴 통로의 이미지를 살려 '오솔길'로 옮겼습니다.
- source_word: בַּתֹּהוּ
  english_pob_choice: into wasteland
  chosen_korean: 황무지로
  alternatives_korean:
  - 공허로
  - 황폐한 곳으로
  - 텅 빈 곳으로
  lexicon: HALOT
  rationale: תֹהוּ의 핵심은 황폐함과 텅 빔이지만, 이 절의 사막적 이미지에는 '황무지'가 가장 자연스럽고 직관적입니다.
- source_word: וְיֹאבֵדוּ
  english_pob_choice: and perish
  chosen_korean: 사라집니다
  alternatives_korean:
  - 멸망합니다
  - 없어집니다
  - 망합니다
  lexicon: HALOT
  rationale: אבד는 '멸망하다'도 가능하지만, 여기서는 물길이 사막에서 흔적 없이 없어지는 이미지를 따라 '사라집니다'가 가장 적절합니다.
