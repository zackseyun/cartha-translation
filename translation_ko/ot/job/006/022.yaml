id: JOB.6.22
reference: Job 6:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
  footnotes:
  - marker: a
    text: Or “From your resources, bribe for me.” The Hebrew כֹּחַ literally means “strength,” but here likely refers to one’s means or wealth.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered “pay a bribe” is related to the noun for “bribe/gift.” Some understand it more generally as providing a payment or inducement on Job’s behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 언제라도 ‘내게 주십시오’ 또는 ‘당신들의 재물에서 내 편에 뇌물을 주십시오’라고 말한 적이 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 כאן의 כֹּחַ를 문맥상 경제적 수단으로 이해한 번역입니다. 직역하면 ‘힘’이지만, 여기서는 보상이나 조달을 가리키는 말로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 편에 뇌물을 주십시오’는 בַעֲדִי의 대표·대변 의미를 살린 번역입니다. 직역하면 ‘나를 위해/내 대신’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  english_pob_choice: Have I ever said
  chosen_korean: 내가 언제라도 …라고 말한 적이 있습니까?
  alternatives_korean:
  - 내가 말한 적이 있습니까?
  - 내가 한 번이라도 …라고 했습니까?
  lexicon: HALOT
  rationale: 히브리어의 반문적 질문을 한국어에서 자연스러운 되물음으로 살리되, אָמַרְתִּי의 기본 의미인 ‘말하다’를 유지했습니다.
- source_word: הָבוּ לִי
  english_pob_choice: Give to me
  chosen_korean: ‘내게 주십시오’
  alternatives_korean:
  - ‘주십시오’
  - ‘내게 주시지요’
  lexicon: HALOT
  rationale: 복수 명령형의 직접성을 살리면서도 현대 합쇼체로 옮겼습니다. ‘내게’는 לִי의 방향성을 드러냅니다.
- source_word: מִכֹּחֲכֶם
  english_pob_choice: From your strength / wealth
  chosen_korean: ‘당신들의 재물에서’
  alternatives_korean:
  - ‘당신들의 힘에서’
  - ‘당신들의 자원에서’
  - ‘당신들의 능력에서’
  lexicon: HALOT
  rationale: כֹּחַ의 기본뜻은 ‘힘’이지만, 여기서는 보상이나 조달을 전제한 문맥상 ‘재물/자원’의 뜻이 자연스럽습니다. English audit trail의 lexical tension을 반영해 경제적 의미를 우선했습니다.
- source_word: שִׁחֲדוּ בַעֲדִי
  english_pob_choice: pay a bribe on my behalf
  chosen_korean: ‘내 편에 뇌물을 주십시오’
  alternatives_korean:
  - ‘내 대신 뇌물을 바치십시오’
  - ‘나를 위해 뇌물을 주십시오’
  - ‘내 편에서 뇌물을 써 주십시오’
  lexicon: HALOT
  rationale: שִׁחֲדוּ는 שֹׁחַד 계열로 ‘뇌물을 주다/바치다’의 거래적 의미를 지닙니다. בַעֲדִי는 대표·대변의 의미를 살려 ‘내 편에’로 옮겼습니다.
theological_decisions:
- issue: 욥의 부정문이 친구들의 지원 요청이 아니라, 실제로 그런 요구를 하지 않았음을 강하게 부인하는 수사
  chosen_reading: 반문형 질문으로 욥의 결백한 항변을 직접화했습니다.
  alternative_readings:
  - 단순 평서형 부정으로 완화하는 번역
  - 요청 자체보다 일반적 기대를 부정하는 번역
  rationale: 본문은 친구들에게 경제적 제공이나 정치적 로비를 요구한 적이 있느냐는 수사적 반문입니다. 이를 약화하지 않고 그대로 드러내는 것이 문맥과 논지를 보존합니다.
  doctrine_reference: 문맥적 해석(욥기 6장 발언의 دفاع/항변)
