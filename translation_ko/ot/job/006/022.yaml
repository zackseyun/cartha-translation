base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
  footnotes:
  - marker: a
    text: Or “From your resources, bribe for me.” The Hebrew כֹּחַ literally means “strength,” but here likely refers to one’s means or wealth.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered “pay a bribe” is related to the noun for “bribe/gift.” Some understand it more generally as providing a payment or inducement on Job’s behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 언제 ‘내게 주십시오’라고, 또는 ‘당신들의 재물로[a] 나를 위하여[b] 뇌물을 주십시오’라고 말한 적이 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 여기서 כֹּחַ를 문맥상 경제적 수단으로 이해한 번역입니다. 직역하면 ‘힘’이지만, 여기서는 재력이나 자원을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 위하여’는 בַעֲדִי를 옮긴 말입니다. 이 말은 ‘나를 위해’ 또는 ‘나를 대신하여’라는 뜻입니다. ‘뇌물을 주십시오’는 שִׁחֲדוּ의 거래적 의미를 따른 번역이며, 더 넓게는 나를 위해 대가나 유인을 제공하라는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
