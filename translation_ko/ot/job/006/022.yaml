  source_fidelity: 반문형의 אָמַרְתִּי, 두 복수 명령(הָבוּ, שִׁחֲדוּ), 그리고 בַעֲדִי의 ‘나를 위하여/나를 대신하여’ 의미는 유지되어 있습니다. 다만 ‘내 편에’는 בַעֲדִי를 자연스럽게 옮기지 못하며, ‘재물에서’도 한국어 조사 결합이 부자연스럽습니다.
  naturalness: ‘내 편에 뇌물을 주십시오’는 현대 표준 한국어에서 어색하고 의미도 ‘나를 지지하는 쪽에’로 기울 수 있습니다. ‘당신들의 재물로 나를 위하여 뇌물을 주십시오’가 원문의 통사와 합쇼체 문체를 자연스럽게 반영합니다.
  terminology: כֹּחַ는 직역상 ‘힘’이나 이 문맥에서는 재력·자원을 가리킬 수 있으므로 ‘재물’은 가능한 해석입니다. שִׁחֲדוּ는 ‘뇌물을 주다’로 유지하고, בַעֲדִי는 ‘나를 위하여’로 옮기는 것이 적절합니다. 기존 각주의 히브리어 지시어 ‘כאן’은 한국어 문장 안에서 부적절하므로 ‘여기서’로 바로잡아야 합니다.
