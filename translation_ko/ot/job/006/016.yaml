lexical_decisions:
- source_word: הַקֹּדְרִים
  english_pob_choice: which are dark
  chosen_korean: 검어졌고
  alternatives_korean:
  - 어두워졌고
  - 컴컴해졌고
  - 탁해졌고
  lexicon: HALOT
  rationale: קדר의 기본 의미는 ‘어두워지다/검어지다’이므로, 겨울 물줄기의 시각적 상태를 자연스럽게 살리기 위해 ‘검어졌고’로 옮겼습니다.
- source_word: מִנִּי קָרַח
  english_pob_choice: from ice
  chosen_korean: 얼음 때문에
  alternatives_korean:
  - 얼음으로부터
  - 서리 때문에
  - 얼음으로 인하여
  lexicon: HALOT
  rationale: 미니는 원인/출처를 나타내므로, 여기서는 얼음이 물줄기를 어둡게 만든 원인을 드러내는 ‘때문에’가 가장 자연스럽습니다.
- source_word: יִתְעַלֶּם שָׁלֶג
  english_pob_choice: the snow conceals itself
  chosen_korean: 눈이 자신을 숨깁니다
  alternatives_korean:
  - 눈이 스스로 가립니다
  - 눈이 자신을 감춥니다
  - 눈이 숨겨집니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살려 수동문보다 ‘자신을 숨깁니다’로 옮겼습니다. POB의 ‘conceals itself’와도 맞닿습니다.
