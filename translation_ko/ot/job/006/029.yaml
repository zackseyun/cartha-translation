translation:
  language: ko
  text: 돌아오십시오[a], 부디. 불의가 없게 하십시오. 다시 돌아오십시오. 내 의는 아직 그 안에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
