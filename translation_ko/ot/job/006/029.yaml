lexical_decisions:
- source_word: שֻֽׁבוּ
  english_pob_choice: Turn back
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 되돌아오십시오
  - 돌이키십시오
  - 돌아가십시오
  lexicon: HALOT
  rationale: 문맥상 욥이 친구들에게 판단을 거두고 입장을 바꾸라고 촉구하는 것이므로, 단순한 물리적 이동보다 방향 전환의 뉘앙스를 살리는 ‘돌아오십시오’가 가장 자연스럽습니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  - 이제
  lexicon: HALOT
  rationale: 완곡하게 요청하는 입자를 현대 한국어로 옮길 때 ‘부디’가 합쇼체와 잘 맞고, 정중한 간청의 톤을 살립니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 죄악
  - 잘못
  lexicon: HALOT
  rationale: 히브리어의 추상명사를 그대로 살리면서도, 이 논쟁 문맥에서의 부당한 판단과 왜곡된 처리를 포괄하는 한국어로 ‘불의’가 적절합니다.
- source_word: צִדְקִי
  english_pob_choice: my righteousness
  chosen_korean: 내 의
  alternatives_korean:
  - 내 정당함
  - 내 의로움
  - 내 정당한 권리
  lexicon: HALOT
  rationale: צדק의 어휘 קשר을 보존하면서도, 이 구절에서 욥이 주장하는 자신의 정당성/무죄성을 간결하게 드러내는 표현은 ‘내 의’입니다.
theological_decisions:
- issue: 욥의 צדק(의) 주장 범위
  chosen_reading: 욥은 완전무결함을 주장하는 것이 아니라, 논쟁 중인 사안에서 자신의 의로운 근거와 정당성이 여전히 남아 있다고 말합니다.
  alternative_readings:
  - 내 사건에서 내 권리는 아직 남아 있습니다
  - 내가 이 일에서 여전히 옳습니다
  rationale: 문맥은 친구들의 판단에 대한 항변이므로, ‘의’를 보존하되 도덕적 완전성으로 과도하게 확대하지 않도록 번역했습니다.
  doctrine_reference: Translation philosophy §3, §5
