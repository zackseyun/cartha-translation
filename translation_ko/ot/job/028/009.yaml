  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּֽ֭/חַלָּמִישׁ שָׁלַ֣ח יָד֑/וֹ הָפַ֖ךְ מִ/שֹּׁ֣רֶשׁ הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/009.yaml
  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
  footnotes:
  - marker: a
    text: Or 'against the flint' / 'on the flinty rock.' The Hebrew may describe laying the hand upon hard rock in mining work.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the root of mountains'; the English plural 'their roots' reflects the collective sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 부싯돌에[a] 손을 대고, 산들을 뿌리째[b] 뒤엎습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부싯돌에’ 외에 ‘부싯돌 위에’ 또는 ‘부싯돌에 맞대어’라는 뜻으로도 이해할 수 있습니다. 광부가 단단한 바위를 다루는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘산들의 뿌리에서’입니다. 한국어에서는 집합적인 뜻과 철저함을 살려 ‘뿌리째’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  english_pob_choice: to the flint / against the flint / on the flinty rock
  chosen_korean: 부싯돌에
  alternatives_korean:
  - 부싯돌 위에
  - 단단한 바위에
  - 부싯돌을 향해
  lexicon: HALOT
  rationale: חַלָּמִישׁ는 매우 단단한 돌, 곧 부싯돌이나 부싯돌 같은 바위를 가리키므로, 작업 대상을 자연스럽게 드러내는 ‘부싯돌에’로 옮겼습니다.
- source_word: שָׁלַח יָדוֹ
  english_pob_choice: He puts his hand
  chosen_korean: 손을 대고
  alternatives_korean:
  - 손을 내밀고
  - 손을 얹고
  - 손을 뻗어
  lexicon: HALOT
  rationale: ‘손을 내밀다/뻗다’보다 여기서는 무엇인가에 실제로 손을 대는 작업 동작이 핵심이므로, POB의 의미를 살려 ‘손을 대고’로 풀었습니다.
- source_word: הָפַךְ
  english_pob_choice: he overturns
  chosen_korean: 뒤엎습니다
  alternatives_korean:
  - 뒤집습니다
  - 엎어 버립니다
  - 뒤엎어 버립니다
  lexicon: HALOT
  rationale: הָפַךְ는 뒤집다, 뒤엎다, 전복하다의 뜻이 있으며, 산을 뿌리째 흔드는 과장된 시적 이미지를 살리기에 ‘뒤엎습니다’가 가장 직접적입니다.
- source_word: מִשֹּׁרֶשׁ הָרִים
  english_pob_choice: from their roots
  chosen_korean: 뿌리째
  alternatives_korean:
  - 산의 뿌리에서
  - 뿌리로부터
  - 산뿌리에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘산들의 뿌리에서’이지만, 한국어에서는 결과 상태를 강조하는 관용적 표현인 ‘뿌리째’가 원문의 강도를 잘 전달합니다.
