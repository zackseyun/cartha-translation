  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
  footnotes:
  - marker: a
    text: Or 'He binds up the seepage of the rivers'; the Hebrew term rendered 'sources' is rare and may evoke 'weeping' or trickling water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 강들의 샘을 막으시고, 숨겨진 것을 빛 가운데로 끌어내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강들의 샘’으로 옮긴 히브리어는 희귀합니다. 문맥상 물이 스며 나오거나 졸졸 흐르는 곳을 가리킬 수 있으며, ‘울음’의 이미지를 불러일으킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  english_pob_choice: the sources of
  chosen_korean: 강들의 샘
  alternatives_korean:
  - 강들의 스며나옴
  - 강들의 흐름
  - 강들의 물줄기
  lexicon: HALOT
  rationale: 이 어근은 희귀하고 문맥상 ‘눈물’보다 물의 샘솟음이나 스며나옴을 가리킬 가능성이 크므로, POB의 ‘sources of the rivers’ 취지를 살려 자연스럽게 ‘강들의 샘’으로 옮겼습니다.
- source_word: חִבֵּשׁ
  english_pob_choice: dams up
  chosen_korean: 막으시고
  alternatives_korean:
  - 둑을 쌓으시고
  - 가두시고
  - 막아 두시고
  lexicon: HALOT
  rationale: 동사는 묶다/억누르다의 뜻을 가지며, 이 절의 광산·수리 통제 맥락에서는 물의 흐름을 실제로 차단하는 행위를 뜻하므로 간결하게 ‘막으시고’로 표현했습니다.
- source_word: תַּעֲלֻמָהּ
  english_pob_choice: what is hidden
  chosen_korean: 숨겨진 것
  alternatives_korean:
  - 감추어진 것
  - 숨은 것
  - 숨은 보물
  lexicon: HALOT
  rationale: 명사는 ‘숨겨진 것, 감추어진 것’의 넓은 의미를 가지므로, 특정한 ‘보물’로 좁히지 않고 문맥을 살리는 일반 표현으로 옮겼습니다.
- source_word: אוֹר
  english_pob_choice: to the light
  chosen_korean: 빛으로
  alternatives_korean:
  - 빛 가운데로
  - 밝은 데로
  - 드러내어
  lexicon: HALOT
  rationale: 히브리어의 대조 구조인 ‘숨김’과 ‘빛’의 대비를 살리기 위해, 목적어격을 가진 자연스러운 한국어 표현 ‘빛으로’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위가 숨겨진 것을 드러내는 방식
  chosen_reading: ‘숨겨진 것’을 ‘빛으로 끌어내신다’는 표현으로, 단순한 물리적 이동을 넘어 감추어진 실재를 드러내시는 하나님의 지혜를 살렸습니다.
  alternative_readings:
  - ‘감추어진 것을 드러내십니다’
  - ‘숨겨진 것을 밖으로 내십니다’
  rationale: 문맥은 창조 세계와 지혜의 비밀을 아시는 하나님의 주권을 강조하므로, 단순 서술보다 ‘빛’의 이미지가 신학적 대조를 분명히 드러냅니다.
  doctrine_reference: 하나님의 지혜와 계시
