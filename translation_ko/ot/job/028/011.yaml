  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
  footnotes:
  - marker: a
    text: Or 'He binds up the seepage of the rivers'; the Hebrew term rendered 'sources' is rare and may evoke 'weeping' or trickling water.
