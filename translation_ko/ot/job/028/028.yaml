id: JOB.28.28
reference: Job 28:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
  footnotes:
  - marker: a
    text: Or ‘to humankind.’ The Hebrew אָדָם is singular ‘man’ used representatively for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 사람에게 말씀하셨습니다. “보라, 주를 두려워하는 것이 지혜입니다. 그리고 악에서 떠나는 것이 깨달음입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간에게’. 히브리어 אָדָם은 대표적으로 사용된 단수형으로, 인류 일반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말씀하셨습니다
  - 그리고 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 연결을 살리기 위해 앞의 וַ를 반영해 ‘그리고’로 시작하고, 하나님/주체의 발화를 격식 있게 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: לָאָדָם
  english_pob_choice: to man
  chosen_korean: 사람에게
  alternatives_korean:
  - 인간에게
  - 사람에게
  lexicon: HALOT
  rationale: אָדָם의 대표적 인간 일반 용법을 자연스러운 현대 한국어로 옮기되, 남성 전용으로 좁히지 않도록 ‘사람’으로 표현했습니다.
- source_word: יִרְאַת אֲדֹנָי
  english_pob_choice: the fear of the Lord
  chosen_korean: 주를 두려워하는 것
  alternatives_korean:
  - 주에 대한 경외
  - 주를 경외하는 것
  lexicon: HALOT
  rationale: 지혜문맥의 יִרְאָה는 단순한 존중보다 두려움과 경외를 함께 담으므로, 의미를 약화시키지 않는 ‘두려워하는 것’으로 살렸습니다.
- source_word: בִּינָה
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  lexicon: HALOT
  rationale: 평행법상 חָכְמָה와 짝을 이루는 בינה를 한국어 지혜문학의 감각에 맞는 ‘깨달음’으로 옮겨, 단순 인지보다 분별된 통찰을 드러냈습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 처리
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 히브리어 본문의 신적 호칭을 그대로 드러내기 위해 ‘주’를 사용했고, 문맥상 ‘주를 두려워하는 것’으로 유지했습니다.
  doctrine_reference: POB divine-title default for אֲדֹנָי / κύριος
