  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא הִדְרִיכֻ֥/הוּ בְנֵי שָׁ֑חַץ לֹֽא עָדָ֖ה עָלָ֣י/ו שָֽׁחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
  footnotes:
  - marker: a
    text: Literally, 'the sons of pride.' The phrase likely refers to proud wild beasts, especially predators.
    reason: lexical_alternative
translation:
  language: ko
  text: 교만한 짐승들[a]도 그 길을 밟아 다니지 않았고, 사자도 그 길을 지나가지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘교만의 아들들’입니다. 문맥상 교만한 야생 짐승들, 특히 포식자를 가리키는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי שָׁחַץ
  english_pob_choice: the proud beasts
  chosen_korean: 사람을 자랑하는 짐승들
  alternatives_korean:
  - 교만한 짐승들
  - 자랑스러운 짐승들
  - 사자 같은 자랑스러운 짐승들
  lexicon: HALOT
  rationale: 히브리어 직역은 '교만의 아들들'이지만, 영어 POB처럼 야생 포식자를 가리키는 관용적 표현으로 이해하는 것이 문맥에 맞습니다. 한국어에서는 '사람을 자랑하는'보다 '교만한'이 더 자연스러우므로, 짐승의 성격을 드러내는 방향으로 옮겼습니다.
- source_word: הִדְרִיכֻהוּ
  english_pob_choice: have not trodden it
  chosen_korean: 밟아 지나가지 않았습니다
  alternatives_korean:
  - 다니지 않았습니다
  - 밟지 않았습니다
  - 걸어 다니지 않았습니다
  lexicon: HALOT
  rationale: 동사 דרך의 히필형은 여기서 '인도하다'가 아니라 길 위를 실제로 밟고 지나가다라는 뜻이므로, '밟아 지나가다'로 옮겨 길을 실제로 지나간다는 뉘앙스를 살렸습니다.
- source_word: עָדָה עָלָיו
  english_pob_choice: has not passed over it
  chosen_korean: 그 위를 지나가지 않았습니다
  alternatives_korean:
  - 그 위를 건너지 않았습니다
  - 그 위를 통과하지 않았습니다
  - 그 위로 지나간 적이 없습니다
  lexicon: HALOT
  rationale: על과 결합한 עָדָה는 '건너다/지나다'의 공간적 이동을 나타내므로, 앞의 '밟아 지나가다'와 평행을 이루도록 '그 위를 지나가지 않았다'로 옮겼습니다.
- source_word: שָׁחַל
  english_pob_choice: the lion
  chosen_korean: 사자
  alternatives_korean:
  - 맹수
  - 사나운 사자
  - 암사자
  lexicon: HALOT
  rationale: שׁחל은 시적 표현의 '사자'이므로 가장 분명한 한국어 대응을 택했습니다. 문맥상 별도의 '사나운' 수식은 본문이 이미 포식자 이미지를 갖고 있어 덧붙이지 않았습니다.
