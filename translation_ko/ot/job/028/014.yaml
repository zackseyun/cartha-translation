base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''she is not in me.'' The feminine pronoun refers to wisdom, personified as feminine in the surrounding context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 깊은 물이 말합니다. “내 안에 있지 않습니다.” 바다가 말합니다. “나와 함께 있지 않습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “그녀는 내 안에 없다”입니다. 여기의 여성형 대명사는 앞문맥에서 의인화된 지혜를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊은 물
  alternatives_korean:
  - 깊음
  - 심연
  - 깊은 곳
  lexicon: HALOT
  rationale: תְּהוֹם은 원초적 심연을 가리킬 수 있지만, 이 구절의 평행법과 바다와의 병행을 살려 과도한 신화적 뉘앙스를 피하는 표현으로 옮겼습니다.
- source_word: אָמַר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말합니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 시적 의인화 속 현재형 진술을 살려 한국어에서도 생생한 현재 시제로 옮겼습니다.
- source_word: לֹא בִי הִיא
  english_pob_choice: It is not in me
  chosen_korean: 내 안에 있지 않다
  alternatives_korean:
  - 그것은 내 안에 있지 않다
  - 그녀는 내 안에 있지 않다
  - 여기 내게 있지 않다
  lexicon: HALOT
  rationale: 비인칭적 ‘it’과 여성형 대명사 הִיא 사이의 긴장을 그대로 노출하기보다, 지혜를 가리키는 대상을 한국어에서 자연스럽게 살리는 쪽으로 ‘내 안에 있지 않다’라고 옮겼습니다.
- source_word: אֵין עִמָּדִי
  english_pob_choice: It is not with me
  chosen_korean: 나와 함께 있지 않다
  alternatives_korean:
  - 내 곁에 있지 않다
  - 내게 있지 않다
  - 나와 함께하지 않는다
  lexicon: HALOT
  rationale: 직역의 ‘내게 없다’보다, 존재 부재와 동반 부재를 함께 담는 ‘나와 함께 있지 않다’가 히브리어의 공간적-관계적 뉘앙스를 더 잘 반영합니다.
theological_decisions:
- issue: 지혜를 가리키는 여성형 대명사 הִיא의 처리
  chosen_reading: 한국어 본문에는 대상의 성별을 드러내지 않고 ‘그것’의 부자연스러움을 피하면서도, 지혜가 앞문맥에 의인화되어 있다는 점은 번역 선택으로 보존했습니다.
  alternative_readings:
  - ‘그녀는 내 안에 있지 않다’
  - ‘그것은 내 안에 있지 않다’
  rationale: 한국어에서 대상이 지혜임을 이미 알 수 있는 문맥이므로, 성별이 드러나는 표현을 억지로 삽입하면 오히려 원문의 시적 자연성을 해칠 수 있습니다.
  doctrine_reference: 지혜 문학의 의인화와 문맥적 대명사 해석
- issue: 의인화된 깊음과 바다가 ‘말한다’는 표현
  chosen_reading: 무생물에 대한 의인화를 유지해, 탐구가 결국 자연 세계에서도 지혜를 찾지 못한다는 시적 논지를 드러냈습니다.
  alternative_readings:
  - ‘말하였다’
  - 의인화를 약화해 설명적으로 처리
  rationale: 본문은 수사적 의인화를 통해 인간의 한계를 강조하므로, 이를 평이한 설명문으로 바꾸지 않는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 시적 의인법과 지혜 탐구의 한계
