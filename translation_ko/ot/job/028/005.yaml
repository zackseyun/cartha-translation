  verdict: revise
  source_fidelity: The draft correctly renders אֶרֶץ as ‘땅,’ preserves the concrete ‘빵’ for לֶחֶם, and represents the contrast between the productive surface and the transformed region beneath. However, ‘불에 뒤집힌 것처럼 뒤집혀 있습니다’ redundantly states ‘turned over’ twice and makes the simile syntactically awkward. The Hebrew כְּמוֹ אֵשׁ remains genuinely ambiguous between comparison with fire and transformation as by fire; the main text and note should retain that openness.
  naturalness: ‘땅에서는 빵이 나옵니다’ is natural modern formal Korean. Revising the latter clause to ‘불에 뒤집힌 듯합니다’ removes the tautology and reads idiomatically in 합쇼체.
  terminology: ‘땅’ and ‘빵’ are suitable and source-sensitive. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The phrase ‘마치 불에 뒤집힌 것처럼 뒤집혀 있습니다’ is tautological and unnatural.
    rationale: It renders נֶהְפַּךְ both within ‘불에 뒤집힌’ and again as the predicate ‘뒤집혀 있습니다.’ Korean can express the simile naturally with ‘불에 뒤집힌 듯합니다,’ while the footnote preserves the alternative ‘불처럼.’
  revised_text: 땅에서는 빵이 나옵니다. 그러나 그 아래는 불에 뒤집힌 듯합니다.[a]
