base_translation:
  language: en
  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
  footnotes:
  - marker: a
    text: Or 'and beneath it is overturned like fire.' The Hebrew comparison may describe either the manner ('as by fire') or simply likeness ('like fire').
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에서는 빵이 나옵니다. 그러나 그 아래는 마치 불에 뒤집힌 것처럼 뒤집혀 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 아래는 불처럼 뒤집혀 있습니다.’ 히브리어의 비교는 방식(‘불에 의해’)일 수도 있고 단순한 유사성(‘불처럼’)일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지면
  - 땅덩이
  lexicon: HALOT
  rationale: 문맥상 특정 지역이 아니라 먹을 것이 나오는 표면과 그 아래를 대비하는 물리적 ‘땅’의 의미이므로, 자연스럽고 구체적인 표준어인 ‘땅’으로 옮겼습니다.
- source_word: מִמֶּנָּה יֵצֵא לָחֶם
  english_pob_choice: from it bread comes out
  chosen_korean: 빵이 나옵니다
  alternatives_korean:
  - 먹을 것이 나옵니다
  - 빵이 나옵니다
  - 양식이 나옵니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 이미지를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘빵이 나옵니다’로 옮겼습니다. ‘빵’은 원문의 구체성을 유지하면서도 일반적인 양식의 이미지를 전달합니다.
- source_word: וְתַחְתֶּיהָ נֶהְפַּךְ
  english_pob_choice: but underneath it is turned up
  chosen_korean: 그러나 그 아래는 … 뒤집혀 있습니다
  alternatives_korean:
  - 그리고 그 아래는 뒤집혀 있습니다
  - 그 아래는 뒤집혀 있습니다
  - 그 아래는 뒤집혀 있습니다
  lexicon: HALOT
  rationale: 대조를 분명히 하기 위해 ‘그러나’로 옮겼고, נֶהְפַּךְ의 ‘뒤집히다/뒤집다’ 의미를 살려 지하가 파헤쳐지고 전도된 상태를 표현했습니다.
- source_word: כְּמוֹ אֵשׁ
  english_pob_choice: as by fire / like fire
  chosen_korean: 마치 불에 … 것처럼
  alternatives_korean:
  - 불처럼
  - 불에 의해
  - 불같이
  lexicon: HALOT
  rationale: 영어 본문의 주석이 허용하는 범위 안에서, 비교 표현의 모호함을 보존하면서도 한국어로는 ‘마치 … 것처럼’이 가장 무난하게 시사점을 전달하므로 그렇게 옮겼습니다.
theological_decisions:
- issue: 지하가 ‘불에 뒤집힌 것처럼’ 된다는 비교의 성격
  chosen_reading: 직접적인 화재 묘사로 단정하지 않고, 땅 아래가 불의 작용을 입은 것 같은 격렬한 변형으로 읽었습니다.
  alternative_readings:
  - 실제 불로 타오르는 장면
  - 단순히 ‘뒤집힌 것처럼’이라는 형태적 비교
  rationale: 영어 POB 주석이 비교의 방식이 ‘as by fire’인지 ‘like fire’인지 열어 두므로, 한국어도 불의 효과를 연상시키되 단정적 서술은 피했습니다.
  doctrine_reference: 문학적-지혜문학적 비유 해석
