  lexicon: HALOT
  rationale: 문맥상 특정 지역이 아니라 먹을 것이 나오는 표면과 그 아래를 대비하는 물리적 ‘땅’의 의미이므로, 자연스럽고 구체적인 표준어인 ‘땅’으로 옮겼습니다.
