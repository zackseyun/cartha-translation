  rationale: 본문은 모든 동사가 가리키는 대상을 일관되게 보이도록 고쳤고, ספר의 본문 선택은 영어 POB의 ‘declared it’ 및 문맥의 지혜를 공적으로 제시·확정하는 흐름에 맞춰 ‘그것을 선포하시고’로 옮겼습니다. 각주는 해당 동사의 어휘적 범위를 정확한 한국어 대안으로 보존했습니다.
