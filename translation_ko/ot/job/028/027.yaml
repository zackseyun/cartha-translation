id: JOB.28.27
reference: Job 28:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז רָ֭אָ/הּ וַֽ/יְסַפְּרָ֑/הּ הֱ֝כִינָ֗/הּ וְ/גַם חֲקָרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
  footnotes:
  - marker: a
    text: Or 'counted it,' 'recounted it,' or 'set it forth.' The Hebrew verb can carry senses of numbering or declaring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그분께서 그것을 보시고 그것을 선포하시고, 그것을 세우시고 또 그것을 깊이 살피셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 헤아리셨다’, ‘그것을 말씀하셨다’, ‘그것을 드러내셨다’로도 옮길 수 있습니다. 히브리어 동사는 수량을 세거나 말하거나 선포하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 시간적 순서를 나타내는 התחלת 접속 부사로, 시적 흐름을 자연스럽게 살리면서도 앞뒤 행위의 연속을 보여 주기 위해 ‘그때’로 옮겼습니다.
- source_word: רָאָהּ
  english_pob_choice: he saw it
  chosen_korean: 그것을 보시고
  alternatives_korean:
  - 그것을 보았습니다
  - 그것을 살펴보셨습니다
  lexicon: HALOT
  rationale: 직접적인 ‘보다’의 의미를 유지하되, 뒤의 동작들과 병렬을 이루도록 연결형으로 처리했습니다. 주어가 하나님으로 이해되는 문맥에 맞춰 존대 표현을 사용했습니다.
- source_word: וַיְסַפְּרָהּ
  english_pob_choice: declared it
  chosen_korean: 말하셨으며
  alternatives_korean:
  - 선포하셨으며
  - 전하셨으며
  - 세어 보셨으며
  lexicon: HALOT
  rationale: ספר는 ‘세다/기록하다/말하다’의 범위를 가지며, POB의 ‘declared it’처럼 단순 계산보다 드러내어 말하거나 공표하는 뜻을 살리는 쪽이 문맥에 더 적합합니다. 한국어에서는 시적 병렬을 위해 ‘말하셨으며’로 옮겼습니다.
- source_word: הֱכִינָהּ
  english_pob_choice: he established it
  chosen_korean: 세우셨고
  alternatives_korean:
  - 확립하셨고
  - 정하셨고
  - 견고하게 하셨고
  lexicon: HALOT
  rationale: כון의 히필은 ‘세우다/굳게 하다/정하다’의 뜻이 있으므로, 존재와 질서를 확정하는 뉘앙스를 간결하게 담는 ‘세우셨고’를 선택했습니다.
- source_word: חֲקָרָהּ
  english_pob_choice: searched it out
  chosen_korean: 살펴보셨습니다
  alternatives_korean:
  - 찾아내셨습니다
  - 깊이 살피셨습니다
  - 탐구하셨습니다
  lexicon: HALOT
  rationale: חקר는 면밀히 조사하고 탐구하는 의미이므로, 한국어에서 가장 자연스럽게 그 강도를 담는 ‘살펴보셨습니다’로 옮겼습니다. 앞의 ‘보셨고/말하셨으며’와도 어조가 잘 맞습니다.
theological_decisions:
- issue: 지시 대상인 여성형 접미사의 처리
  chosen_reading: 모든 목적어 접미사는 문맥상 ‘지혜’를 가리키는 것으로 보고, 한국어에서는 중성적 ‘그것’을 사용했습니다.
  alternative_readings:
  - ‘지혜를’로 반복해 명시할 수 있음
  - 의인화하여 ‘그녀’를 사용할 수 있음
  rationale: 히브리어는 지혜를 여성형으로 받지만, 한국어에서 이를 인위적으로 성별화하면 문맥의 자연스러움을 해칠 수 있습니다. POB의 audit trail처럼 지혜를 지시하는 점은 유지하되, 한국어는 과도한 의인화를 피했습니다.
  doctrine_reference: Translation philosophy §3 — 신학적 긴장을 해소하지 말고 보존
