  text: 분명히 은을 캐는 광산이 있고[a], 금을 제련하는 곳이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광산’은 히브리어 מוֹצָא의 기본 의미인 ‘나오는 곳, 근원, 산출처’를 이 문맥의 채굴 장면에 따라 구체적으로 옮긴 것입니다. 또는 ‘은의 산출처’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제련하다’는 히브리어 동사 זקק의 가능한 의미를 반영합니다. 이 동사는 ‘정련하다’ 또는 ‘녹여 정제하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
