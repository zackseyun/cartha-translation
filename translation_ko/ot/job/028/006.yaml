translation:
  language: ko
  text: 그 땅의 돌들은 사파이어가 나는 곳이며, 그곳에는 금가루가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사파이어’는 전통적 번역어입니다. 히브리어 ‘사피르’가 가리키는 고대 보석의 정확한 종류는 불확실하며, ‘라피스라줄리’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  english_pob_choice: the place of
  chosen_korean: 자리
  alternatives_korean:
  - 장소
  - 있음의 자리
  - 곳
  lexicon: HALOT
  rationale: 문맥상 광맥과 산지의 ‘위치’를 가리키므로, 한국어에서는 소유 관계를 풀어내기보다 간결한 ‘자리’로 옮겨 원문의 장소 이미지를 살렸습니다.
- source_word: סַפִּיר
  english_pob_choice: sapphire
  chosen_korean: 사파이어
  alternatives_korean:
  - 청옥
  - 라피스 라줄리
  lexicon: HALOT
  rationale: 전통적 번역어는 ‘사파이어’이며, 고대의 정확한 보석명이 불확실하다는 점은 영어 POB의 각주 취지대로 유지하는 것이 적절합니다.
- source_word: עַפְרֹת
  english_pob_choice: dust
  chosen_korean: 먼지
  alternatives_korean:
  - 흙
  - 가루
  - 광물 가루
  lexicon: HALOT
  rationale: 금과 연결된 미세한 입자를 가리키는 시적 표현이므로, 일반어 ‘먼지’가 가장 직관적으로 원문의 물질감을 전달합니다.
- source_word: לוֹ
  english_pob_choice: it has
  chosen_korean: 거기에는
  alternatives_korean:
  - 그것에게는
  - 그 안에는
  - 그것이 가지고 있습니다
  lexicon: HALOT
  rationale: 히브리어의 비서술적 소유/귀속 표현을 한국어 시적 문장으로 자연스럽게 풀어, ‘금의 먼지’가 그곳에 있다는 뜻을 유지했습니다.
theological_decisions:
- issue: 하이브루 시적 병렬에서 대상의 의인화 정도
  chosen_reading: ‘그 돌들은… 거기에는…’로 두 절을 병렬로 살려, 땅/광맥의 물질적 풍요를 의인화 과장 없이 표현했습니다.
  alternative_readings:
  - ‘그것의 돌들은…’처럼 직접적 소유를 살리는 번역
  - ‘사파이어가 나는 곳이며…’처럼 해석을 보태는 번역
  rationale: 본문은 광산 지형의 풍요를 묘사하는 시어이므로, 해석적 확장을 줄이고 병렬 구조를 살리는 쪽이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 시편적 지혜문학의 비유적 묘사 원리
