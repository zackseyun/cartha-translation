  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
  footnotes:
  - marker: a
    text: Or 'her way ... her place,' reflecting the feminine grammatical form of 'wisdom' in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 그 길을 아시며, 그분은 그 자리도 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서는 ‘그 길’과 ‘그 자리’의 주어가 문법상 여성형으로 되어 있어, 문맥상 지혜를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 단수 동사와 함께 쓰여 한 분 하나님을 가리키므로, 한국어 성경의 일반적이고 분명한 대응인 ‘하나님’을 사용했습니다.
- source_word: הֵבִין
  english_pob_choice: understands
  chosen_korean: 아십니다
  alternatives_korean:
  - 이해하십니다
  - 분별하십니다
  - 알아보십니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘이해하다/분별하다’에 해당하지만, 시적 문맥에서 하나님의 완전한 인지와 통찰을 자연스럽게 드러내는 한국어로는 ‘아십니다’가 가장 간결합니다.
- source_word: דַּרְכָּהּ
  english_pob_choice: its way
  chosen_korean: 그 길
  alternatives_korean:
  - 그 방식
  - 그 길을
  lexicon: HALOT
  rationale: ‘길’은 히브리어 ‘way’를 직접적으로 살리면서도 한국어에서 시적·비유적 표현으로 자연스럽습니다. 문맥의 지혜를 암시하되, 영어 POB처럼 인칭화된 ‘그녀의’는 쓰지 않았습니다.
- source_word: מְקוֹמָהּ
  english_pob_choice: its place
  chosen_korean: 그 자리
  alternatives_korean:
  - 그곳
  - 그 위치
  lexicon: HALOT
  rationale: ‘place/location’의 기본 의미를 살리되, 반복되는 ‘길’과의 균형을 위해 한국어에서 더 시적인 ‘자리’를 선택했습니다.
theological_decisions:
- issue: 지혜의 여성형 접미사 처리
  chosen_reading: 히브리어의 여성형은 유지하되, 한국어에서는 무생물적 대상에 대한 자연스러운 지시어인 ‘그’와 ‘하나님은’ 구조로 옮겼습니다.
  alternative_readings:
  - ‘그녀의 길… 그녀의 자리’로 번역
  - 지혜를 명시적으로 덧붙여 ‘지혜의 길… 지혜의 자리’로 번역
  rationale: 본문의 여성형은 문맥상 지혜를 가리키지만, 한국어에서 ‘그녀’는 과도한 인격화를 낳을 수 있습니다. 영어 POB의 판단처럼 의미는 보존하되, 현대 한국어의 자연스러움을 우선했습니다.
  doctrine_reference: Translation philosophy §5–6 (문맥상 인격화는 유지하되 과잉 의인화는 피함)
