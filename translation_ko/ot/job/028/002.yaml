  text: 철은 흙에서 얻어지고, 구리는 돌에서 제련됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְחוּשָׁה는 문맥에 따라 ‘구리’ 또는 ‘청동’을 뜻할 수 있습니다. 여기서는 채굴과 제련의 맥락을 따라 ‘구리’로 옮겼습니다.
    reason: lexical_alternative
