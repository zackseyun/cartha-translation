  rationale: 이 구절은 돌에서 금속을 얻는 광산·제련 이미지를 말하므로, 단순히 ‘붓다’보다 정련 과정을 드러내는 ‘녹여집니다’가 원문의 의미를 더 잘 전달합니다. ‘구리’는 제련 대상 금속을 한국어로 직접 옮긴 것입니다.
