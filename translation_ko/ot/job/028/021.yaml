source:
  edition: WLC
  text: וְֽ֭/נֶעֶלְמָה מֵ/עֵינֵ֣י כָל חָ֑י וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם נִסְתָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
  footnotes:
  - marker: a
    text: Or 'from the birds of the sky.' The Hebrew literally says 'the birds of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 모든 살아 있는 것의 눈에 숨겨져 있고, 하늘의 새들에게도 가려져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘의 새들’입니다. 영어 POB는 이를 ‘birds of the sky’로도 옮길 수 있다고 주석합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  english_pob_choice: It is hidden
  chosen_korean: 숨겨져 있습니다
  alternatives_korean:
  - 숨겨져 있습니다
  - 감추어져 있습니다
  - 가려져 있습니다
  lexicon: HALOT
  rationale: 니팔 완료형의 결과 상태를 자연스러운 수동 표현으로 옮겼습니다. 문맥상 대상은 앞절의 지혜이므로, 한국어에서는 주어를 받는 대명사 없이도 ‘그것은’으로 이어 주었습니다.
- source_word: מֵעֵינֵי
  english_pob_choice: from the eyes of
  chosen_korean: …의 눈에
  alternatives_korean:
  - …의 시야에서
  - …의 눈앞에서
  - …의 보기에
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 직역에 가깝게 살리면서도 한국어에서 자연스럽게 읽히도록 ‘눈에’로 옮겼습니다.
- source_word: כָל חָי
  english_pob_choice: every living thing
  chosen_korean: 모든 살아 있는 것
  alternatives_korean:
  - 모든 생명체
  - 모든 살아 있는 존재
  - 모든 생물
  lexicon: HALOT
  rationale: 포괄적 범위를 유지하기 위해 인간과 비인간을 모두 포함하는 일반적 표현을 선택했습니다.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  english_pob_choice: and from the birds of the heavens
  chosen_korean: 하늘의 새들에게도
  alternatives_korean:
  - 하늘의 새들에게도
  - 하늘의 날짐승들에게도
  - 하늘의 새들로부터도
  lexicon: HALOT
  rationale: ‘the heavens’의 직역 가능성을 살리되, 한국어에서 가장 자연스럽고 시적인 대응은 ‘하늘의 새들’입니다. 부사격 조사 ‘도’를 붙여 앞 구와의 병렬을 유지했습니다.
theological_decisions:
- issue: 시적 평행구에서 동일 의미 반복을 어떻게 처리할지
  chosen_reading: ‘숨겨져 있습니다 / 가려져 있습니다’로 유사 의미를 구분해 반복을 피했습니다.
  alternative_readings:
  - ‘숨겨져 있습니다 / 숨겨져 있습니다’
  - ‘감추어져 있습니다 / 감추어져 있습니다’
  rationale: 히브리어는 두 동사를 평행시키지만, 한국어에서는 같은 동사를 반복하면 시적 대비가 약해집니다. 의미는 유지하면서 표현을 분화했습니다.
  doctrine_reference: 시적 평행법의 재현 원칙
