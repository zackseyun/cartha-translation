lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그는
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 앞절의 진술을 설명하는 접속이지만, 한국어에서는 직역형 접속사보다 주어를 앞세운 매끄러운 진술이 자연스럽습니다.
- source_word: לִקְצוֹת הָאָרֶץ
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
