translation:
  language: ko
  text: 그는 땅의 끝까지 보시며, 하늘 아래의 모든 것을 살피십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 끝까지’는 ‘땅의 가장 먼 경계들까지’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘하늘들’의 복수형을 써서 ‘하늘 아래의 모든 것’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그는
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 앞절의 진술을 설명하는 접속이지만, 한국어에서는 직역형 접속사보다 주어를 앞세운 매끄러운 진술이 자연스럽습니다.
- source_word: לִקְצוֹת הָאָרֶץ
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅의 끝들까지
  - 땅의 가장 먼 곳까지
  - 땅의 극변까지
  lexicon: HALOT
  rationale: ‘끝들’의 복수성을 살리면서도 한국어 관용에 맞게 ‘땅의 끝까지’로 옮겨, 지상의 가장 먼 경계를 가리키는 뜻을 유지했습니다.
- source_word: יַבִּיט
  english_pob_choice: looks
  chosen_korean: 보시며
  alternatives_korean:
  - 바라보시며
  - 보십니다
  - 유심히 보시며
  lexicon: HALOT
  rationale: 하나님을 가리키는 문맥이므로 높임말을 쓰되, ‘looks’의 기본 의미를 과장하지 않고 ‘보시며’로 옮겼습니다.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  english_pob_choice: under all the heavens
  chosen_korean: 하늘 아래의 모든 것
  alternatives_korean:
  - 하늘 아래의 모든 하늘 아래
  - 모든 하늘 아래
  - 모든 하늘 아래에 있는 것
  lexicon: HALOT
  rationale: 히브리어의 ‘하늘들’ 복수성과 포괄성을 한국어에서 자연스럽게 드러내기 위해, 공간적 표현을 ‘하늘 아래의 모든 것’으로 풀어 옮겼습니다.
- source_word: יִרְאֶה
  english_pob_choice: he sees
  chosen_korean: 살피십니다
  alternatives_korean:
  - 보십니다
  - 굽어보십니다
  - 살펴보십니다
  lexicon: HALOT
  rationale: 앞의 ‘보시며’와 반복을 피하면서, 전칭적 관찰과 세밀한 인식을 함께 드러내는 동사로 ‘살피십니다’를 택했습니다.
theological_decisions:
- issue: 신적 주어에 대한 높임 표현과 시제 감각
  chosen_reading: 하나님을 가리키는 동사에는 높임말을 사용해 현재적·지속적 관찰을 표현했습니다.
  alternative_readings:
  - 그는 ... 봅니다
  - 그는 ... 보십니다
  rationale: 본문은 하나님의 전면적 시야를 진술하므로, 한국어 합쇼체의 높임을 통해 신적 주어를 분명히 하되 과도한 해석을 더하지 않았습니다.
  doctrine_reference: 하나님의 전지와 섭리
