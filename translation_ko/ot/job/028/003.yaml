  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֵ֤ץ שָׂ֤ם לַ/חֹ֗שֶׁךְ וּֽ/לְ/כָל תַּ֭כְלִית ה֣וּא חוֹקֵ֑ר אֶ֖בֶן אֹ֣פֶל וְ/צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the stone of gloom and the shadow of death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 어둠에 끝을 두시고, 모든 극한까지 살피십니다. 곧 흑암의 돌과 깊은 어둠의 돌까지도 살피십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘흑암의 돌과 죽음의 그림자.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵץ
  english_pob_choice: an end
  chosen_korean: 끝
  alternatives_korean:
  - 한계
  - 극한
  lexicon: HALOT
  rationale: קֵץ는 ‘끝, 종말, 한계’를 뜻하므로 ‘끝’이 שָׂם과 자연스럽게 결합하면서 경계 설정의 구체성을 살립니다.
- source_word: שָׂם
  english_pob_choice: sets
  chosen_korean: 두시고
  alternatives_korean:
  - 놓으시고
  - 정하십니다
  lexicon: HALOT
  rationale: שָׂם의 기본 뜻인 ‘두다/놓다/설정하다’를 살려 ‘두시고’로 옮겨, 어둠에 경계를 세우는 동작성을 보존했습니다.
- source_word: וּלְכָל תַּכְלִית
  english_pob_choice: to every limit
  chosen_korean: 모든 극한까지
  alternatives_korean:
  - 모든 한계까지
  - 모든 끝까지
  - 모든 경계까지
  lexicon: HALOT
  rationale: תַּכְלִית는 여기서 ‘완성’이 아니라 ‘극한, 끝지점’이므로, ‘모든 극한까지’로 옮겨 채굴자가 끝까지 파고드는 뉘앙스를 살렸습니다.
- source_word: חֹקֵר
  english_pob_choice: searches out
  chosen_korean: 살피십니다
  alternatives_korean:
  - 샅샅이 찾으십니다
  - 탐구하십니다
  lexicon: HALOT
  rationale: חקר는 철저히 조사하고 찾아내는 뜻이지만, 한국어에서는 광산 문맥에서 ‘살피다’가 지나치게 약하지 않으면서도 자연스럽게 탐사 의미를 담습니다.
- source_word: אֶבֶן אֹפֶל וְצַלְמָוֶת
  english_pob_choice: the stones of gloom and deep darkness
  chosen_korean: 흑암의 돌과 깊은 어둠의 돌
  alternatives_korean:
  - 흑암의 돌과 죽음의 그림자의 돌
  - 어둠의 돌과 깊은 어둠의 돌
  lexicon: HALOT
  rationale: אֶבֶן은 광산 이미지 속에서 집합적으로 ‘돌들’로 읽는 것이 자연스럽고, אֹפֶל과 צַלְמָוֶת의 반복 구조를 한국어에서도 살리기 위해 두 구를 대칭적으로 옮겼습니다.
theological_decisions:
- issue: צַלְמָוֶת의 의미 범위
  chosen_reading: ‘깊은 어둠’으로 본문에 반영하고, 전통적 ‘죽음의 그림자’ 해석은 본문 밖에서 유보합니다.
  alternative_readings:
  - 죽음의 그림자
  - 죽음의 어둠
  rationale: 이 구절은 죽음 자체보다 지하의 극심한 어둠을 가리키는 문맥이 강하므로, 본문에는 문맥적 의미를 반영하되 전통 번역의 긴장은 손실되지 않도록 보존합니다.
  doctrine_reference: Translation philosophy §3 (해석 긴장 보존)
