revisions:
- from: 그분은 어둠에 끝을 두시고, 모든 극한까지 살피십니다. 곧 흑암의 돌과 깊은 어둠의 돌까지도 살피십니다.[a]
  to: 사람은 어둠에 끝을 정하고, 모든 끝을 샅샅이 살피며, 흑암과 깊은 어둠 속의 돌을 찾아냅니다.[a]
  rationale: 인간 채굴자를 가리키는 문맥과 원문의 비존칭 서술을 반영하여 ‘사람은’과 합쇼체 비존칭 종결을 사용했습니다. 탐색 행위를 하나의 문장으로 유지하고, אֶבֶן을 집합적 의미로 자연스럽게 ‘돌’로 옮겼습니다. צַלְמָוֶת의 문맥적 의미인 ‘깊은 어둠’은 본문에, 전통적 ‘죽음의 그림자’는 각주에 보존했습니다.
