id: JOB.28.19
reference: Job 28:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יַ֭עַרְכֶ/נָּה פִּטְדַת כּ֑וּשׁ בְּ/כֶ֥תֶם טָ֝ה֗וֹר לֹ֣א תְסֻלֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
  footnotes:
  - marker: a
    text: Or 'the chrysolite of Cush' or 'the peridot of Cush'; the exact identification of פִּטְדָה is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 구스의 토파즈도 그것에 비길 수 없고, 순금으로도 그것의 값을 매길 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘피트다’(פִּטְדָה)가 가리키는 정확한 보석은 확실하지 않습니다. 토파즈, 크리솔라이트, 페리도트 등으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  english_pob_choice: cannot equal it
  chosen_korean: 같지 못하며
  alternatives_korean:
  - 비길 수 없으며
  - 견줄 수 없으며
  - 동등하지 못하며
  lexicon: HALOT
  rationale: 가치와 비교의 문맥에서 ערך의 비교 불가능성을 자연스러운 한국어로 옮기기 위해 ‘같지 못하다’를 택했습니다.
- source_word: פִּטְדַת כּוּשׁ
  english_pob_choice: the topaz of Cush
  chosen_korean: 구스의 황옥
  alternatives_korean:
  - 구스의 토파즈
  - 구스의 크리솔라이트
  - 구스의 페리도트
  lexicon: HALOT
  rationale: פִּטְדָה의 정확한 광물 식별이 불확실하므로, POB의 각주 취지를 살려 전통적이면서도 한국어에서 이해되는 ‘황옥’을 사용하고, 구스는 고유명사로 음역했습니다.
- source_word: בְּכֶתֶם טָהוֹר
  english_pob_choice: in pure gold
  chosen_korean: 순금으로도
  alternatives_korean:
  - 정금으로도
  - 깨끗한 금으로도
  - 순수한 금으로도
  lexicon: HALOT
  rationale: כֶּתֶם טָהוֹר의 ‘정련되고 순수한 금’이라는 뜻을 한국어 관용 표현인 ‘순금’으로 응축했고, 앞의 ב는 비교·평가의 맥락에 맞게 ‘~으로도’로 살렸습니다.
- source_word: תְסֻלֶּה
  english_pob_choice: it cannot be valued
  chosen_korean: 값어치가 매겨지지 않습니다
  alternatives_korean:
  - 값이 매겨지지 않습니다
  - 평가될 수 없습니다
  - 값을 매길 수 없습니다
  lexicon: HALOT
  rationale: 단순한 물리적 ‘무게 재기’보다 가치 산정의 뜻이 중심이므로, 한국어에서 자연스럽게 비교 가치의 불가함을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 지혜의 가치가 어떤 보석과 금으로도 환산되지 않는다는 시적 강조
  chosen_reading: 비교 불가능성과 비가격성을 함께 드러내는 번역을 유지했습니다.
  alternative_readings:
  - 보석과 금에 비길 수 없다는 식으로만 옮기는 방식
  - 값을 매길 수 없다는 식으로만 옮기는 방식
  rationale: 문맥은 지혜의 절대적 우월성을 노래하므로, 비교와 평가 두 층위를 모두 보존해야 시적 논지가 약화되지 않습니다.
  doctrine_reference: 욥기 28장 지혜 찬가의 문맥적 신학
- issue: פִּטְדָה의 보석 명칭 불확실성
  chosen_reading: 주본문에는 ‘황옥’을 두되, 별도 각주 없이도 과도한 특정 광물 동일시를 피하는 방향을 택했습니다.
  alternative_readings:
  - 토파즈
  - 크리솔라이트
  - 페리도트
  rationale: 원어의 식별이 확정되지 않았으므로, 현대 독자에게 익숙하면서도 단정적 동일시를 피하는 번역이 가장 안전합니다.
  doctrine_reference: 원문 불확실성에 대한 번역 윤리
