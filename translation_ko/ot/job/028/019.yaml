  source_fidelity: 첫째 절반의 ערך는 단순한 동일성보다 비교·대등의 불가능을 뜻하므로, ‘같지 못하며’보다 ‘비길 수 없고’가 원문의 가치 비교를 더 정확히 드러냅니다. 둘째 절반은 순금을 가치 산정의 기준으로 삼을 수 없다는 뜻이며, ‘순금으로도 값을 매길 수 없습니다’가 이를 자연스럽고 충실하게 옮깁니다.
  naturalness: ‘구스의 황옥도 그것과는 같지 못하며’는 보석과 지혜를 문자적으로 동일시하는 듯하여 현대 한국어에서 다소 어색합니다. ‘그것에 비길 수 없고’가 자연스럽습니다. ‘토파즈’는 현대 독자에게 통용되는 보석명이며, 각주로 광물 식별의 불확실성을 보존할 수 있습니다.
  terminology: ‘구스’는 고유명사 음역으로 적절합니다. פִּטְדָה의 광물학적 식별은 확정되지 않았으므로 본문의 ‘토파즈’를 잠정적·전통적 명칭으로 두고 각주에서 크리솔라이트 및 페리도트 가능성을 밝혀야 합니다. ‘순금’은 כֶּתֶם טָהוֹר에 적절합니다.
  issues:
