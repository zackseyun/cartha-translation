    issue: ‘같지 못하며’가 비교·가치의 뜻을 충분히 드러내지 못하고 한국어로도 다소 부자연스럽습니다.
    rationale: יַעַרְכֶנָּה는 이 문맥에서 지혜와 대등하게 비교되거나 맞설 수 없다는 뜻입니다. ‘비길 수 없고’가 해당 의미와 시적 병행을 보존합니다.
