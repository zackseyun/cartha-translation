base_translation:
  language: en
  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
  footnotes:
  - marker: a
    text: Or 'streams' or 'canals'; the Hebrew term can denote watercourses, but here likely refers to channels cut in rock in the mining imagery of the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'every valuable thing' or 'every precious ore.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바위 사이로 수로를 뚫고, 그의 눈은 모든 귀한 것을 봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 물길, 수로, 운하를 가리킬 수 있지만, 여기서는 문맥상 바위에 판 통로를 뜻하는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘귀한 것’은 값진 것, 보물, 귀한 광석까지도 아우를 수 있는 넓은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  english_pob_choice: through the rocks
  chosen_korean: 바위 사이로
  alternatives_korean:
  - 바위 속으로
  - 바위를 통해
  - 바위들 사이로
  lexicon: HALOT
  rationale: צור는 단단한 바위나 절벽을 가리키므로, 광산 이미지를 살리면서도 자연스러운 한국어로 '바위 사이로'를 택했습니다.
- source_word: יְאֹרִים
  english_pob_choice: channels
  chosen_korean: 수로
  alternatives_korean:
  - 물길
  - 운하
  - 개천
  lexicon: HALOT
  rationale: 여기서는 자연 하천보다 암석에 뚫은 인공 통로의 이미지가 강하므로, '수로'가 지나치게 특정하지 않으면서도 통로의 성격을 잘 드러냅니다.
- source_word: בִּקֵּעַ
  english_pob_choice: cuts
  chosen_korean: 뚫고
  alternatives_korean:
  - 가르고
  - 쪼개고
  - 내고
  lexicon: HALOT
  rationale: בקע의 핵심은 갈라 열고 통로를 만드는 동작이므로, 광산적 맥락에 맞게 '뚫고'로 옮겼습니다.
- source_word: יְקָר
  english_pob_choice: every precious thing
  chosen_korean: 모든 귀한 것
  alternatives_korean:
  - 모든 값진 것
  - 모든 보물
  - 모든 귀중한 것
  lexicon: HALOT
  rationale: יְקָר는 귀하고 값진 것을 넓게 가리키므로, 광물로 좁히지 않고 의미를 보존하는 '귀한 것'을 택했습니다.
theological_decisions:
- issue: 의인화된 ‘눈’ 표현의 보존
  chosen_reading: 그의 눈은… 봅니다
  alternative_readings:
  - 그는… 봅니다
  - 그의 눈이… 살핍니다
  rationale: 히브리어의 '그의 눈'이라는 생생한 의인화를 유지해, 단순한 '그는 본다'로 평준화하지 않았습니다.
  doctrine_reference: 시적 의인화 보존
- issue: 광산 문맥의 해석 범위
  chosen_reading: 수로를 뚫고
  alternative_readings:
  - 샤프트를 뚫고
  - 통로를 파고
  rationale: 본문은 문자적으로 물길/수로를 뜻할 수 있으나, 문맥상 광산 채굴의 비유를 살리되 특정 구조물로 과도하게 한정하지 않았습니다.
  doctrine_reference: 시적 문맥
