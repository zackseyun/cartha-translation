translation:
  language: ko
  text: 그는 바위에 수로를 내고[a], 그의 눈은 모든 귀한 것을 봅니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수로’는 물길이나 운하로도 옮길 수 있습니다. 여기서는 문맥상 바위에 낸 수로나 통로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘귀한 것’은 값진 것, 보물, 귀한 광석 등을 아우를 수 있는 넓은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
