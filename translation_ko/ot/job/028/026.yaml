lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  english_pob_choice: when he made
  chosen_korean: 정하시고
  alternatives_korean:
  - 만드실 때
  - 만드셨을 때
  - 만드시는 가운데
  lexicon: HALOT
  rationale: 문맥상 창조 질서의 설정을 가리키므로 단순한 ‘만들다’보다 규례를 세우는 동사를 택해, 시적 병행 속에서 하나님의 질서 부여를 드러냈습니다.
- source_word: לַמָּטָר חֹק
  english_pob_choice: a decree for the rain
  chosen_korean: 비를 위한 규례
  alternatives_korean:
  - 비를 위한 법도
  - 비를 위한 정하신 한계
  - 비에 대한 규례
  lexicon: HALOT
  rationale: חֹק은 법률 조문보다 ‘정해진 규례/질서’에 가깝기에, 하늘의 현상에 부여된 정해진 질서를 살려 ‘규례’로 옮겼습니다.
- source_word: לַחֲזִיז קֹלוֹת
  english_pob_choice: the thunderbolt of the storms
  chosen_korean: 번개를 위한 길과 천둥의 소리를 위한 길
  alternatives_korean:
  - 번개를 위한 길과 폭풍의 천둥을 위한 길
  - 번개와 천둥의 길
  - 벼락과 천둥소리를 위한 길
  lexicon: HALOT
  rationale: חֲזִיז는 시적 문맥에서 번개/벼락을 뜻할 수 있고, קֹלוֹת는 문자적으로는 ‘소리들’이지만 폭풍 맥락에서 천둥을 가리킬 수 있으므로, 본문이 말하는 자연현상의 이중 이미지를 살려 두 요소를 분리해 표현했습니다.
theological_decisions:
- issue: 하나님의 창조 질서 설정
  chosen_reading: 이 절을 하나님이 비와 폭풍 현상에 정해진 질서를 부여하셨다는 진술로 읽고, 이를 ‘규례’와 ‘길’의 이미지로 보존했습니다.
  alternative_readings:
  - 섭리적 통제라는 교리적 표현을 더 분명히 드러내는 읽기
  - 자연현상 일반에 대한 은유로 완화하는 읽기
  rationale: 히브리어의 시적 병행이 강조하는 것은 자연에 대한 하나님의 질서 부여이지, 체계신학적 설명이 아니므로 그 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 창조 질서, 섭리
