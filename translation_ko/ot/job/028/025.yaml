translation:
  language: ko
  text: 그분께서 바람의 무게를 정하시고 물의 분량을 재셨을 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정하시고’는 히브리어 부정사구를 문맥상 자연스러운 시간 연결로 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘바람’은 כאן의 רוּחַ를 자연현상으로 읽은 번역입니다. 이 절에서는 ‘영’이나 ‘숨’보다 물과의 병렬이 우선합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  english_pob_choice: when he gave
  chosen_korean: 정하시고
  alternatives_korean:
  - 만드시고
  - 하실 때
  - 재정하시고
  lexicon: HALOT
  rationale: 히브리어 부정사구가 앞 절의 하나님의 질서 세우는 행위를 시간적으로 이어 주므로, 한국어에서는 단순한 부정사보다 문맥상 자연한 서술형 연결로 옮겼습니다.
- source_word: לָרוּחַ
  english_pob_choice: the wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  - 바람
  lexicon: HALOT
  rationale: 이 절은 물과 병렬되는 창조 질서의 맥락이므로 רוּחַ는 ‘영’이나 ‘숨’이 아니라 자연현상인 ‘바람’으로 옮기는 것이 원문 의도를 가장 잘 드러냅니다.
- source_word: מִשְׁקָל
  english_pob_choice: its weight
  chosen_korean: 무게
  alternatives_korean:
  - 무게값
  - 저울질
  - 분량
  lexicon: HALOT
  rationale: מִשְׁקָל은 ‘무게/달아 봄’을 뜻하므로, 바람에 ‘무게를 정하다’는 표현으로 하나님의 정밀한 질서 부여를 살렸습니다.
- source_word: תִּכֵּן בְּמִדָּה
  english_pob_choice: measured ... by measure
  chosen_korean: 분량을 재셨습니다
  alternatives_korean:
  - 척도로 정하셨습니다
  - 한도에 맞추셨습니다
  - 측량하셨습니다
  lexicon: HALOT
  rationale: תִּכֵּן과 בְּמִדָּה의 중복된 계량 이미지를 한국어에서는 ‘분량을 재다’로 간결하게 묶어, 시적 평행과 정밀한 측정의 뜻을 유지했습니다.
theological_decisions:
- issue: 주어의 생략과 문맥상 보충
  chosen_reading: 주어를 ‘그분께서’로 보충해, 앞뒤 문맥의 하나님을 계속 가리키게 했습니다.
  alternative_readings:
  - 생략형으로 ‘바람의 무게를 정하시고 물의 분량을 재셨을 때’
  - ‘그가’로 직역
  rationale: 히브리어는 앞 문맥의 하나님을 이어 받는 생략 구조이므로, 한국어에서는 가독성을 위해 주어를 드러내되 해석을 과장하지 않았습니다.
  doctrine_reference: 문맥 추론에 의한 대명사 보충
