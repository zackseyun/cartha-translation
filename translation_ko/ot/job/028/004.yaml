  naturalness: ‘발에 잊힌 그곳에서 그것들은’은 현대 한국어로 부자연스럽고 지시 대상이 모호합니다. ‘사람의 발길이 닿지 않는 곳에서’는 히브리어의 압축 표현을 자연스럽게 풀어 주면서도 의미를 보존합니다. ‘매달린 채 흔들립니다’는 광산의 현수된 움직임을 매끄럽게 전달합니다.
  terminology: ‘갱도’는 문맥적 번역으로 사용할 수 있으나, נחל의 일반적 의미가 수로·골짜기라는 점은 각주에서 유지되어야 합니다. ‘사람들’은 אֱנוֹשׁ의 일반적 인간을 무리 없이 나타냅니다.
