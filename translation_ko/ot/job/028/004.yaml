id: JOB.28.4
reference: Job 28:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
  footnotes:
  - marker: a
    text: Or 'He breaks open a channel/torrent-bed away from where a sojourner is.' The Hebrew is difficult, especially the words נחל and גר; many understand the line in light of the chapter's mining imagery and so render נחל as 'shaft.'
    reason: alternative_reading
  - marker: b
    text: Literally 'forgotten from/by foot.' The sense is that this place or these workers are beyond the notice or reach of those walking above.
    reason: lexical_alternative
  - marker: c
    text: Or 'they are lowered' or 'they dangle.' The Hebrew verb can suggest being suspended or let down, likely by ropes in a mine.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 사는 곳에서 멀리 떨어진 곳에 갱도를 뚫습니다[a]. 사람의 발길이 닿지 않는 곳에서[b], 그들은 사람들에게서 멀리 떨어져 매달린 채[c] 흔들립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 나그네가 있는 곳에서 수로/개울바닥을 파냅니다.’ 히브리어 נחל과 גר의 뜻은 어렵습니다. 많은 이들은 이 절을 광산 이미지로 이해하여 נחל을 ‘갱도’로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘발로부터 잊힌’입니다. 위를 걷는 사람들의 눈과 발길이 닿지 않는 곳이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 내려집니다’ 또는 ‘그들은 매달려 있습니다.’ 히브리어 동사는 끈이나 밧줄에 의해 늘어지거나 내려진 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  english_pob_choice: breaks open
  chosen_korean: 갱도를 뚫습니다
  alternatives_korean:
  - 터뜨립니다
  - 깨뜨려 엽니다
  - 파고 엽니다
  lexicon: HALOT
  rationale: 광산 이미지에서 פָּרַץ의 ‘뚫고 열다/파헤쳐 열다’는 힘을 살리되, 한국어로는 대상이 분명한 ‘갱도’를 보충해 자연스럽게 옮겼습니다.
- source_word: נַחַל
  english_pob_choice: shaft
  chosen_korean: 갱도
  alternatives_korean:
  - 수직갱
  - 굴
  - 수로
  lexicon: HALOT
  rationale: 문맥상 강바닥보다 채굴 장면이 우세하므로, POB의 ‘shaft’에 해당하는 광산 용어 ‘갱도’를 택했습니다.
- source_word: מִנִּי רָגֶל
  english_pob_choice: forgotten by the foot
  chosen_korean: 발에 잊힌
  alternatives_korean:
  - 발에서 잊힌
  - 사람 발에 닿지 않는
  - 발길이 잊은
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 살려 직역에 가깝게 유지하되, 한국어에서 이해되는 짧은 표현으로 옮겼습니다.
- source_word: דָּלוּ
  english_pob_choice: they hang
  chosen_korean: 매달리고
  alternatives_korean:
  - 매달려 있고
  - 늘어지고
  - 달려 있고
  lexicon: HALOT
  rationale: 채굴 현장에서 로프로 내려진 상태를 떠올리게 하는 동사라서, ‘매달리다’가 가장 자연스럽고 이미지도 잘 전달합니다.
- source_word: נָעוּ
  english_pob_choice: they sway
  chosen_korean: 흔들립니다
  alternatives_korean:
  - 흔들거립니다
  - 이리저리 움직입니다
  - 흔들리며 있습니다
  lexicon: HALOT
  rationale: 매달린 상태에서의 움직임을 한국어로는 ‘흔들리다’가 가장 간결하고 정확하게 나타냅니다.
theological_decisions:
- issue: 문장 첫 부분의 주어와 행위 주체
  chosen_reading: 광산 작업을 시작하는 인간의 행동을 묘사하는 서술로 이해해, 문장 전체를 비신학적 서술로 유지했습니다.
  alternative_readings:
  - 하나님이 자연의 틈을 여시는 장면
  - 광부 일반의 행위를 묘사하는 장면
  rationale: 본문은 지혜문학의 광산 비유로 읽히며, 신적 행위로 과도하게 해석할 근거가 약하므로 서술적 의미를 보존했습니다.
  doctrine_reference: 문맥 우선 해석 원칙
