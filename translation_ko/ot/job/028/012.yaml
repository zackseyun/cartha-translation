    rationale: מֵאַיִן은 ‘어디에서/어디로부터’이지만, ‘어디에서부터’는 한국어로 부자연스럽습니다. 원문의 수사적 미완료형도 ‘발견되겠는가’처럼 옮기는 편이 더 가깝습니다.
