lexical_decisions:
- source_word: וְהַחָכְמָה
  english_pob_choice: But wisdom
  chosen_korean: 그러나 지혜는
  alternatives_korean:
  - 그리고 지혜는
  - 또 지혜는
  lexicon: HALOT
  rationale: 문맥상 앞의 광산 재물 열거에서 지혜의 근원 문제로 전환하는 대조가 핵심이므로, 한국어에서는 ‘그러나’로 담아 자연스러운 문맥 전환을 살렸습니다.
- source_word: מֵאַיִן תִּמָּצֵא
  english_pob_choice: where can ... be found
  chosen_korean: 어디에서 찾을 수 있으며
  alternatives_korean:
  - 어디에서 발견될 수 있으며
  - 어디에서 있을 수 있으며
  lexicon: HALOT
  rationale: 문자적으로는 ‘어디에서 발견될 수 있나’에 가깝지만, 시적 질문의 가능·소재 의미를 한국어로 자연스럽게 전달하기 위해 ‘찾을 수 있다’를 택했습니다.
- source_word: בִּינָה
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  lexicon: HALOT
  rationale: 지혜문학의 병렬구문에서 בִּינָה는 단순 지적 이해보다 분별된 통찰을 가리키므로, 한국어에서는 ‘깨달음’이 시어로서의 울림과 의미 범위를 잘 반영합니다.
theological_decisions:
- issue: 시적 수사에서의 질문 형식
  chosen_reading: 두 절은 실제 정보 요청이라기보다, 인간이 지혜의 출처를 스스로 찾을 수 없다는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 위치 질문으로 읽음
  - 일반적인 철학적 탐구 문장으로 읽음
  rationale: 욥기 28장의 문맥 전체가 인간의 한계와 지혜의 비가시적 근원을 강조하므로, 한국어도 질문의 수사성을 유지하는 것이 적절합니다.
  doctrine_reference: 욥기 28장 지혜 찬가의 문맥적 해석
