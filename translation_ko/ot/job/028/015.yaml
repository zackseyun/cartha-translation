base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
  footnotes:
  - marker: a
    text: Or 'pure gold' for 'fine gold.'
    reason: lexical_alternative
  - marker: b
    text: That is, silver cannot be weighed out to pay its price; the verse speaks of wisdom's inestimable value in the surrounding context.
    reason: cultural_note
  - marker: c
    text: Or 'It cannot be given in exchange for fine gold'.
    reason: previous_rendering
translation:
  language: ko
  text: 정금은 그것과 바꾸어 줄 수 없고, 은은 그 값을 치르려고 달아 낼 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정금’은 여기서 ‘순금’ 또는 ‘좋은 금’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 은을 무게로 달아 그 값을 치를 수 없다는 뜻입니다. 앞뒤 문맥은 지혜의 헤아릴 수 없는 가치를 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: סְגוֹר
  english_pob_choice: fine gold
  chosen_korean: 정금
  alternatives_korean:
  - 순금
  - 좋은 금
  lexicon: HALOT
  rationale: 시적·지혜문맥에서 값비싼 정련 금을 가리키므로, 구체적 금속 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘정금’으로 옮겼습니다.
- source_word: תַּחְתֶּיהָ
  english_pob_choice: in exchange for it
  chosen_korean: 그것의 값으로는
  alternatives_korean:
  - 그것을 대신해서는
  - 그것과 바꿔서는
  lexicon: HALOT
  rationale: תחת+대명사 접미사는 ‘대신하여/교환하여’의 값을 뜻하므로, 상업적 교환 의미를 분명히 드러내는 표현을 택했습니다.
- source_word: יִשָּׁקֵל כֶּסֶף
  english_pob_choice: silver can be weighed
  chosen_korean: 은도 … 달 수 없습니다
  alternatives_korean:
  - 은도 … 저울질할 수 없습니다
  - 은도 … 재어 낼 수 없습니다
  lexicon: HALOT
  rationale: 고대의 은 지급 관행은 무게로 값을 치르는 것이므로, ‘달다’로 옮겨 무게로 치르는 금전적 행위를 자연스럽게 살렸습니다.
- source_word: מְחִירָהּ
  english_pob_choice: its price
  chosen_korean: 그 가격
  alternatives_korean:
  - 그 값
  - 그 대가
  lexicon: HALOT
  rationale: מְחִיר은 가격·대가를 뜻하므로, 앞의 교환 문맥과 맞는 ‘가격’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 지혜의 값을 매길 수 없다는 시적 진술의 보존
  chosen_reading: 이 절은 지혜의 절대적 가치를 상업적 교환 언어로 부정하는 문장으로 유지했습니다.
  alternative_readings:
  - 정금과 은을 강조하는 일반적 부의 무가치 진술로 완화
  - 지혜의 값어치를 도덕적 비유로만 처리
  rationale: 원문은 실제 교환·저울질 이미지를 통해 지혜의 비가측성을 말하므로, 그 긴장을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 지혜문학의 수사적 과장과 가치 부정 표현
