lexical_decisions:
- source_word: אֲבַדּוֹן
  english_pob_choice: Abaddon
  chosen_korean: 아바돈
  alternatives_korean:
  - 멸망
  lexicon: HALOT
  rationale: POB가 고유명/의인화된 존재로 처리한 점을 따라, 추상명사 ‘멸망’보다 음역 ‘아바돈’으로 두어 인격화된 병렬을 살렸습니다.
- source_word: וָמָוֶת
  english_pob_choice: and Death
  chosen_korean: 죽음
  alternatives_korean:
  - 사망
  - 죽음
  lexicon: HALOT
  rationale: 의인화된 병렬 구조를 한국어에서도 유지하되, 자연스러운 대응으로 대문자 의인화 효과는 조사와 문맥으로만 드러내고 ‘죽음’으로 옮겼습니다.
- source_word: בְּאָזְנֵינוּ
  english_pob_choice: With our ears
  chosen_korean: 우리 귀로
  alternatives_korean:
  - 우리 귀로
  - 우리의 귀에
  lexicon: HALOT
  rationale: 직역투를 과도하게 살린 ‘우리 귀에’보다, 원문의 도구/매체 감각을 보존하는 ‘우리 귀로’가 한국어에서 더 자연스럽고 이미지도 유지합니다.
- source_word: שִׁמְעָהּ
  english_pob_choice: a report of it
  chosen_korean: 그에 대한 소문
  alternatives_korean:
  - 그에 대한 보고
  - 그 소문
  lexicon: HALOT
  rationale: 지혜를 직접 아는 것이 아니라 전해 들은 말이라는 뉘앙스를 살리기 위해 ‘소문’을 택했고, 여성형 대명사 접미사의 지시대상은 문맥상 ‘지혜’로 이해됩니다.
theological_decisions:
- issue: Abaddon and Death의 의인화
  chosen_reading: 두 존재를 실제로 말하고 듣는 의인화된 화자들로 번역합니다.
  alternative_readings:
  - ‘멸망’과 ‘죽음’이라는 추상 개념으로 처리함
  rationale: 히브리어 동사 ‘말합니다/들었습니다’가 둘 모두에 적용되어 있어, 추상화하면 시적 긴장과 인격화 효과가 약해집니다.
  doctrine_reference: 원문 시어의 의인화를 유지하고, 존재론적으로 더 강한 결론은 내리지 않습니다.
