translation:
  language: ko
  text: “아바돈과 죽음이 말합니다[a] — ‘우리 귀로 그에 대한 소문을 들었습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망과 죽음이 말했습니다. “우리는 그것에 대한 소문을 들었습니다.”’
