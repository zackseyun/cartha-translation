  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אפרח/ו יְעַלְעוּ דָ֑ם וּ/בַ/אֲשֶׁ֥ר חֲ֝לָלִ֗ים שָׁ֣ם הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
  footnotes:
  - marker: a
    text: Or 'Its chicks lap up blood.' The Hebrew verb is vivid and may suggest sucking, gulping, or lapping.
    reason: lexical_alternative
  - marker: b
    text: Or 'where the corpses are, there it is.' The Hebrew says 'the slain,' emphasizing violent death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 새끼들은 피를 빨아먹습니다[a]. 그리고 시체들이 있는 곳에 그가 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 새끼들은 피를 핥아먹습니다.’ 히브리어 동사는 빨아들이거나 들이키거나 핥는 듯한 매우 생생한 동작을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽임당한 자들이 있는 곳에, 거기에 그가 있습니다.’ 히브리어는 ‘죽은 시체들’보다 폭력적으로 죽임당한 자들을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  english_pob_choice: its young ones
  chosen_korean: 그 새끼들
  alternatives_korean:
  - 그 새끼새들
  - 그 어린 것들
  - 그 병아리들
  lexicon: HALOT
  rationale: 맹금류의 새끼를 가리키는 표현으로, ‘새끼들’은 자연스러우면서도 번식한 어린 개체라는 의미를 넓게 보존합니다.
- source_word: יְעַלְעוּ
  english_pob_choice: suck up
  chosen_korean: 피를 빨아먹습니다
  alternatives_korean:
  - 피를 빨아들입니다
  - 피를 들이켜습니다
  - 피를 핥아먹습니다
  lexicon: HALOT
  rationale: 동사의 강한 흡입·섭취 이미지를 한국어에서 가장 직접적으로 드러내는 표현으로, ‘빨아먹다’가 시각적·감각적 긴장을 잘 살립니다.
- source_word: חֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 시체들
  alternatives_korean:
  - 죽임당한 자들
  - 쓰러진 자들
  - 죽은 자들
  lexicon: HALOT
  rationale: 영어 POB가 주석에서 ‘corpses’ 대안을 제시한 점을 반영해, 히브리어의 폭력적 죽음보다 장면의 물질성을 드러내는 번역을 본문에 두었습니다.
- source_word: שָׁם הוּא
  english_pob_choice: there it is
  chosen_korean: 그가 있습니다
  alternatives_korean:
  - 그것이 있습니다
  - 거기 있습니다
  - 그 새가 있습니다
  lexicon: HALOT
  rationale: 문맥상 독수리/맹금류를 가리키므로 한국어에서는 생물 일반 지시대명사보다 인칭화된 ‘그’가 더 자연스럽고, 반복되는 포식 장면의 종결감을 살립니다.
theological_decisions:
- issue: 포식 장면의 직설성 유지
  chosen_reading: 피를 빨아먹습니다 / 시체들이 있는 곳에 그가 있습니다
  alternative_readings:
  - 피를 마십니다
  - 죽은 곳에 그가 있습니다
  rationale: 본문의 야생적·잔혹한 묘사를 완화하지 않고, 창조 질서 안에서 맹금의 본성을 그대로 드러내는 쪽이 히브리어 시구에 더 충실합니다.
  doctrine_reference: 시적 묘사와 창조 질서의 현실성
