  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
  footnotes:
  - marker: a
    text: Or 'Its chicks lap up blood.' The Hebrew verb is vivid and may suggest sucking, gulping, or lapping.
    reason: lexical_alternative
  - marker: b
    text: Or 'where the corpses are, there it is.' The Hebrew says 'the slain,' emphasizing violent death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 새끼들은 피를 빨아먹습니다[a]. 죽임당한 자들이 있는 곳에는 그 새가 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 새끼들은 피를 핥습니다.’ 히브리어 동사는 빨아들이거나 들이키거나 핥는 듯한 생생한 동작을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시체들이 있는 곳에는 그 새가 있습니다.’ 히브리어는 ‘죽임당한 자들’을 뜻하며, 폭력적인 죽음을 강조합니다.
    reason: lexical_alternative
