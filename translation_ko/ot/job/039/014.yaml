  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
  footnotes:
  - marker: a
    text: Or 'abandons her eggs to the earth.' The Hebrew verb can carry a stronger sense than simply 'leaves,' but the following line suggests exposure on the ground rather than absolute desertion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그녀가 그 알을 땅에 내버려 두고, 흙 위에서 덥히기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 그 알을 땅에 버리기 때문입니다.’ 히브리어 동사는 단순히 ‘두다’보다 강하게 ‘버리다’ 또는 ‘내버려 두다’를 뜻할 수 있습니다. 다음 구절은 알이 땅 위에 놓여 있음을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲזֹב
  english_pob_choice: leaves
  chosen_korean: 버려두고
  alternatives_korean:
  - 떠나고
  - 남겨 두고
  - 버리고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘두다’보다 더 강한 유기 뉘앙스를 살리되, 바로 뒤의 ‘덥힙니다’가 있어 완전한 절연보다 방치에 가까운 의미를 담기 위해 ‘버려두고’로 옮겼습니다.
- source_word: לָאָרֶץ
  english_pob_choice: to the earth
  chosen_korean: 땅에
  alternatives_korean:
  - 땅으로
  - 대지에
  lexicon: HALOT
  rationale: 히브리어의 직역적 공간 표지를 자연스러운 한국어로 풀어 ‘땅에’로 옮기면서, 다음 행의 ‘흙’과 병렬되는 구체성을 유지했습니다.
- source_word: בֵּצֶיהָ
  english_pob_choice: her eggs
  chosen_korean: 자기 알
  alternatives_korean:
  - 그녀의 알
  - 그 알
  - 암컷의 알
  lexicon: HALOT
  rationale: 본문의 3인칭 여성형 소유를 살리되, 한국어 성서 문체에서 짐승에 대해 ‘그녀의’보다 자연스러운 ‘자기’를 사용해 오해를 줄였습니다.
- source_word: וְעַל עָפָר
  english_pob_choice: on the dust
  chosen_korean: 흙 위에서
  alternatives_korean:
  - 먼지 위에서
  - 티끌 위에서
  - 흙 위에
  lexicon: HALOT
  rationale: עָפָר를 단순한 ‘먼지’보다 땅바닥의 가루진 표면으로 읽어 ‘흙’으로 옮겼고, 전치사구는 동작의 위치를 살려 ‘위에서’로 자연화했습니다.
- source_word: תְּחַמֵּם
  english_pob_choice: warms them
  chosen_korean: 덥힙니다
  alternatives_korean:
  - 따뜻하게 합니다
  - 데웁니다
  - 품어 덥힙니다
  lexicon: HALOT
  rationale: Piel형의 ‘따뜻하게 하다/덥히다’를 직접 반영해 과도한 기술어 ‘부화하다’를 피하고, 짐승의 몸으로 알을 덮어 열을 전한다는 그림을 간결하게 살렸습니다.
theological_decisions:
- issue: 수사적 이미지의 강도
  chosen_reading: 알을 ‘버려두고’ 흙 위에서 ‘덥히는’ 모습으로, 본문의 놀람을 약화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 단순히 ‘두고’
  - ‘보살피지 않고’
  rationale: 본문은 오스트리치의 비상식적 행동을 묘사하는 수사적 대비가 핵심이므로, 도덕적 해석을 덧씌우지 않고 관찰적 표현을 유지했습니다.
  doctrine_reference: 창조 세계에 대한 지혜문학적 관찰
