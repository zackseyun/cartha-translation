theological_decisions:
- issue: 하나님의 주권적 배정이 피조물의 서식지를 정하신다는 표현
  chosen_reading: 하나님이 들나귀에게 광야와 소금땅을 ‘주셨다’는 서술을 유지했습니다.
  alternative_readings:
  - 정해 주셨습니다
  - 배정하셨습니다
  - 마련하셨습니다
  rationale: 본문은 단순한 지리 묘사가 아니라 창조주가 짐승의 거처를 주권적으로 정하신다는 점을 강조하므로, ‘주었습니다’가 그 뉘앙스를 가장 직접적으로 드러냅니다.
  doctrine_reference: 창조 섭리 / 하나님의 주권
