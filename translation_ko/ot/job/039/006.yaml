  yaml_path: translation/ot/job/039/006.yaml
  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
  footnotes:
  - marker: a
    text: Or 'the wilderness' or 'the steppe' for 'the desert' (עֲרָבָה).
    reason: lexical_alternative
  - marker: b
    text: Or 'the salt flat' or 'the salt waste' for 'the salt land' (מְלֵחָה).
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his dwellings' is plural; the translation renders it as singular 'his dwelling place' for natural English, understanding the plural as poetic/intensive.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그에게 광야를 그의 집으로 주었고, 소금땅을 그의 거처로 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광야’는 ‘사막’ 또는 ‘들판/초원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소금땅’은 ‘소금 벌판’ 또는 ‘소금기 많은 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 복수형 ‘그의 거처들’이지만, 한국어에서는 단수로 옮겨 자연스럽게 했습니다.
    reason: lexical_alternative
lexical_decisions:
