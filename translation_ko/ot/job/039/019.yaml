translation:
  language: ko
  text: 당신께서 말에게 힘을 주십니까? 그 목에 갈기를 입히십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천둥’으로 옮길 수 있습니다. 이는 רַעְמָה에 대한 오래된 해석 전통을 따른 것이지만, 여기서는 말의 목을 입힌다는 바로 앞의 이미지 때문에 ‘갈기’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  english_pob_choice: Do you give
  chosen_korean: 말이 힘을 받게 하시는 것이 당신이십니까?
  alternatives_korean:
  - 당신이 말을 힘 있게 하십니까?
  - 당신이 말을 주십니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문문을 한국어로 자연스럽게 옮기되, 단순한 '주다'보다 문맥상 말에게 힘을 부여하는 행위를 드러내도록 했습니다.
- source_word: לַסּוּס
  english_pob_choice: the horse
  chosen_korean: 말
  alternatives_korean:
  - 그 말
  - 한 말
  lexicon: HALOT
  rationale: 정관사는 종 전체를 가리키는 일반적 용법이므로 한국어에서는 품종·종류를 나타내는 '말'로 옮기는 것이 자연스럽습니다.
- source_word: גְּבוּרָה
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강한 힘
  - 기력
  - 강건함
  lexicon: HALOT
  rationale: 여기서는 말의 신체적 강인함을 가리키므로 '힘'이 가장 간결하고 문맥에 맞습니다.
- source_word: רַעְמָה
  english_pob_choice: a mane
  chosen_korean: 갈기
  alternatives_korean:
  - 갈기털
  - 터럭
  lexicon: HALOT
  rationale: 영어 POB가 본문 문맥에 따라 'mane'을 채택한 점을 따라, 말의 목을 덮는 이미지에 맞는 표준 한국어 '갈기'를 사용했습니다.
theological_decisions:
- issue: 수사 의문문의 직설성 유지
  chosen_reading: 하나님께서 말의 힘과 장식을 주권적으로 주신다는 도전적 의미를 살리기 위해, 질문 형식을 그대로 유지했습니다.
  alternative_readings:
  - 평서문으로 완화하여 번역
  - 완곡한 가능형으로 바꾸기
  rationale: 본문은 욥에게 창조주만이 할 수 있는 일을 묻는 수사 의문이므로, 부드럽게 바꾸면 논증의 긴장이 약해집니다.
  doctrine_reference: 창조주 하나님의 주권과 피조물의 한계
