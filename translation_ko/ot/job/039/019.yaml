  - 한 말
  lexicon: HALOT
  rationale: 정관사는 종 전체를 가리키는 일반적 용법이므로 한국어에서는 품종·종류를 나타내는 '말'로 옮기는 것이 자연스럽습니다.
- source_word: גְּבוּרָה
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강한 힘
  - 기력
  - 강건함
  lexicon: HALOT
  rationale: 여기서는 말의 신체적 강인함을 가리키므로 '힘'이 가장 간결하고 문맥에 맞습니다.
- source_word: רַעְמָה
  english_pob_choice: a mane
  chosen_korean: 갈기
  alternatives_korean:
  - 갈기털
  - 터럭
  lexicon: HALOT
  rationale: 영어 POB가 본문 문맥에 따라 'mane'을 채택한 점을 따라, 말의 목을 덮는 이미지에 맞는 표준 한국어 '갈기'를 사용했습니다.
theological_decisions:
- issue: 수사 의문문의 직설성 유지
  chosen_reading: 하나님께서 말의 힘과 장식을 주권적으로 주신다는 도전적 의미를 살리기 위해, 질문 형식을 그대로 유지했습니다.
  alternative_readings:
  - 평서문으로 완화하여 번역
  - 완곡한 가능형으로 바꾸기
  rationale: 본문은 욥에게 창조주만이 할 수 있는 일을 묻는 수사 의문이므로, 부드럽게 바꾸면 논증의 긴장이 약해집니다.
  doctrine_reference: 창조주 하나님의 주권과 피조물의 한계
