  yaml_path: translation/ot/job/039/019.yaml
  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
  footnotes:
  - marker: a
    text: Or possibly 'with thunder,' following an older interpretive tradition for רַעְמָה; here it is rendered 'mane' because the immediate image is of clothing the horse's neck.
