base_translation:
  language: en
  yaml_path: translation/ot/job/039/019.yaml
  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
  footnotes:
  - marker: a
    text: Or possibly 'with thunder,' following an older interpretive tradition for רַעְמָה; here it is rendered 'mane' because the immediate image is of clothing the horse's neck.
    reason: lexical_alternative
translation:
  language: ko
  text: 말이 힘을 받게 하시는 것이 당신이십니까? 그 목을 갈기로 입히시는 것이 당신이십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천둥’일 수 있습니다. רַעְמָה에 대한 더 오래된 해석 전통을 따른 번역이지만, 바로 앞의 ‘목을 입히다’라는 이미지 때문에 여기서는 ‘갈기’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  english_pob_choice: Do you give
  chosen_korean: 말이 힘을 받게 하시는 것이 당신이십니까?
  alternatives_korean:
  - 당신이 말을 힘 있게 하십니까?
  - 당신이 말을 주십니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문문을 한국어로 자연스럽게 옮기되, 단순한 '주다'보다 문맥상 말에게 힘을 부여하는 행위를 드러내도록 했습니다.
- source_word: לַסּוּס
  english_pob_choice: the horse
  chosen_korean: 말
  alternatives_korean:
