  source_fidelity: 히브리어의 두 수사 의문문, ‘말에게 힘을 주다’와 ‘그 목에 갈기를 입히다’라는 병행 구조를 유지해야 합니다. 초안의 ‘말이 힘을 받게 하시는 것’은 נתן의 직접 목적어·여격 구문을 불필요하게 우회합니다.
  naturalness: ‘말이 힘을 받게 하시는 것이 당신이십니까?’는 한국어에서 다소 장황하고 부자연스럽습니다. ‘당신께서 말에게 힘을 주십니까?’가 현대 표준어 합쇼체에서 직접적이고 자연스럽습니다. 둘째 절도 ‘목을 갈기로 입히다’보다 ‘목에 갈기를 입히다’가 한국어 결합상 매끄럽습니다.
