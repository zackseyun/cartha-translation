id: JOB.39.1
reference: Job 39:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'the wild goats of the rock'; the Hebrew refers to mountain-dwelling wild goats, possibly ibexes.
    reason: lexical_alternative
  - marker: b
    text: Or 'the does' or 'the hinds.'
    reason: lexical_alternative
  - marker: c
    text: The verb can also mean 'observe' or 'keep watch over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산 바위의 염소들이 새끼를 낳는 때를 네가 아느냐? 네가 사슴이 산고하는 것을 살펴보느냐?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바위의 염소들’을 가리키며, 산지에 사는 야생 염소, 곧 아이벡스류를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사슴’은 ‘암사슴들’ 또는 ‘암사슴 새끼를 밴 암사슴들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 ‘관찰하다’ 또는 ‘지켜보다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  english_pob_choice: Do you know
  chosen_korean: 네가 아느냐
  alternatives_korean:
  - 네가 알고 있느냐
  - 아느냐
  lexicon: HALOT
  rationale: הֲ가 붙은 2인칭 남성 단수 완료형을 반문으로 처리해, 욥에게 던지는 수사적 질문의 힘을 한국어에서도 자연스럽게 살렸습니다.
- source_word: יַעֲלֵי סָלַע
  english_pob_choice: the mountain goats
  chosen_korean: 산 바위의 염소들
  alternatives_korean:
  - 산 염소들
  - 바위의 야생 염소들
  - 산악 염소들
  lexicon: HALOT
  rationale: 직역하면 ‘바위의 염소들’이므로, 산악 서식의 야생 염소라는 뜻을 드러내되 한국어에서 자연스럽게 읽히도록 ‘산 바위의 염소들’로 옮겼습니다.
- source_word: חֹלֵל
  english_pob_choice: in labor
  chosen_korean: 산고하는 것
  alternatives_korean:
  - 해산하는 것
  - 해산의 고통을 겪는 것
  - 몸부림치는 것
  lexicon: HALOT
  rationale: 이 동사는 출산의 진통/해산 고통을 가리킬 수 있으므로, 단순한 관찰보다 출산 과정의 고통을 드러내는 ‘산고하다’를 택했습니다.
- source_word: אַיָּלוֹת
  english_pob_choice: the deer
  chosen_korean: 사슴
  alternatives_korean:
  - 암사슴들
  - 들사슴들
  - 노루들
  lexicon: HALOT
  rationale: אַיָּלוֹת는 암컷 사슴류를 가리키지만, 한국어에서는 일반 독자에게 ‘사슴’이 가장 자연스럽고, 문맥상 출산 중인 암사슴의 의미도 충분히 전달됩니다.
- source_word: תִּשְׁמֹר
  english_pob_choice: Do you watch over
  chosen_korean: 살펴보느냐
  alternatives_korean:
  - 지켜보느냐
  - 감시하느냐
  - 돌보느냐
  lexicon: HALOT
  rationale: שׁמר는 여기서 돌봄보다 관찰/주목의 의미가 강하므로, 영어 POB의 최종 선택과 맞추어 ‘살펴보다’로 옮겨 과도한 보호 뉘앙스를 피했습니다.
theological_decisions:
- issue: 하나님의 질문 형식이 인간 지혜의 한계를 드러내는가
  chosen_reading: 본문은 출산의 때와 과정을 아는 것이 인간에게 불가능하다는 점을 통해, 피조물인 인간의 한계를 드러내는 하나님의 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 자연 관찰 질문
  - 동물 돌봄에 대한 실제 책임 질문
  rationale: 욥기 38–39장의 연속된 질문들은 창조 세계에 대한 하나님의 주권과 욥의 무지/유한함을 드러내는 방식이므로, 본문도 그 큰 흐름 안에서 이해하는 것이 타당합니다.
  doctrine_reference: 욥기 38–39장 전체의 창조주-피조물 구도
