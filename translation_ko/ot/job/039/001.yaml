  source_fidelity: 첫 절의 יַעֲלֵי־סָלַע는 ‘산 바위의 염소들’보다 바위산에 사는 야생 염소를 뜻하는 표현으로 옮기는 것이 정확하고 자연스럽습니다. 둘째 절은 암사슴들이 출산 과정에 있는 모습을 ‘지켜보다/관찰하다’라는 뜻이며, 보호하거나 돌본다는 뜻으로 한정하지 않는 것이 좋습니다.
  naturalness: ‘산 바위의 염소들’은 현대 표준어에서 어색하므로 ‘바위산의 야생 염소들’로 고쳤습니다. ‘사슴이 산고하는 것’도 다소 문어적이고 성별 정보가 흐려지므로, ‘암사슴들이 새끼를 낳는 것을’으로 자연스럽게 옮겼습니다. 문체는 현대 합쇼체의 수사 의문문으로 유지했습니다.
  terminology: יַעֲלֵי־סָלַע의 야생 산지 염소라는 의미와 אַיָּלוֹת의 여성형(암사슴들)을 반영했습니다. חֹלֵל은 출산 진통을 내포하지만, 문맥상 ‘새끼를 낳는 것’이 무리 없이 전달하며 각주에서 대안을 제시했습니다.
