translation:
  language: ko
  text: 바위산의 야생 염소들이 새끼를 낳는 때를 네가 아느냐? 암사슴들이 새끼를 낳는 것을 네가 지켜보느냐?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바위의 염소들’을 가리키며, 산지에 사는 야생 염소, 곧 아이벡스류를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사슴들’ 또는 ‘암사슴들’. 히브리어는 암컷 사슴을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지켜보다’로 옮긴 동사는 ‘관찰하다’ 또는 ‘살펴보다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
