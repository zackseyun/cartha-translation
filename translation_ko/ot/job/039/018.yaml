  yaml_path: translation/ot/job/039/018.yaml
  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
  footnotes:
  - marker: a
    text: Or 'When she spreads her wings on high' or 'When she flaps herself aloft.' The Hebrew verb likely refers to rising upward, but the exact nuance is debated.
    reason: lexical_alternative
  - marker: b
    text: '''Laughs at'' can also carry the sense ''mocks'' or ''scorns.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 높이 치솟을 때[a], 말과 그 말을 탄 자를 비웃습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘높이 오르다’를 뜻할 가능성이 크지만, 정확한 뉘앙스에는 논란이 있습니다. ‘높은 곳에서 날개를 펴다’ 또는 ‘날갯짓하며 공중으로 오르다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비웃다’는 ‘조롱하다’ 또는 ‘멸시하다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
