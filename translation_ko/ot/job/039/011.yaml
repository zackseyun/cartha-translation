    text: 또는 ‘수고’. 히브리어는 노동 자체와 그 노동의 결과를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  english_pob_choice: Will you trust him
  chosen_korean: 그를 신뢰하시겠습니까?
  alternatives_korean:
  - 그를 믿으시겠습니까?
  - 그를 의지하시겠습니까?
  lexicon: HALOT
  rationale: בטח의 핵심 의미를 한국어의 자연스러운 ‘신뢰하다’로 옮기되, 반문 형식도 살렸습니다.
- source_word: כִּי רַב כֹּחוֹ
  english_pob_choice: because his strength is great
  chosen_korean: 그의 힘이 매우 크다고 해서
  alternatives_korean:
  - 그의 힘이 크기 때문에
  - 그의 힘이 매우 크므로
  lexicon: HALOT
  rationale: כִּי의 원인/근거 관계를 자연스러운 한국어로 풀어, ‘힘이 크다’는 근거만으로 신뢰할 수 있느냐는 뉘앙스를 드러냈습니다.
- source_word: וְתַעֲזֹב אֵלָיו
  english_pob_choice: and leave ... to him
  chosen_korean: 당신의 노동을 그에게 맡기시겠습니까?
  alternatives_korean:
  - 당신의 노동을 그에게 맡기시겠습니까?
  - 당신의 일을 그에게 맡기시겠습니까?
  lexicon: HALOT
  rationale: עזב는 문자적으로 ‘떠나다/내버려두다’이지만, 일감을 짐승에게 맡기는 문맥에서는 ‘맡기다’가 의미를 가장 분명하게 전달합니다.
- source_word: יְגִיעֶךָ
  english_pob_choice: your labor
  chosen_korean: 당신의 노동
  alternatives_korean:
  - 당신의 수고
  - 당신의 toil
  lexicon: HALOT
  rationale: יְגִיעַ는 노동 자체와 그 결과를 모두 가리킬 수 있으나, 여기서는 실제로 맡기는 대상인 인간의 일을 가리키는 것으로 보아 ‘노동’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 아니라 야생소에 대한 수사적 질문이라는 문맥 유지
  chosen_reading: 질문은 하나님이 아니라 야생소(들짐승)의 힘을 근거로 인간의 노동을 맡길 수 있느냐는 반문입니다.
  alternative_readings:
  - 일반적인 신뢰의 교훈으로 완화하는 읽기
  - 짐승을 의인화해 우호적 신뢰로 읽는 방식
  rationale: 문맥상 이 구절은 창조세계의 야성적 힘을 강조하며, 인간이 그 힘을 실제로 부릴 수 있는지 묻는 수사적 질문입니다.
  doctrine_reference: 욥기 38–41장 문맥 주해
