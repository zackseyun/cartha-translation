theological_decisions:
- issue: 수사적 질문의 주체를 드러내는 방식
  chosen_reading: 하나님이 창조세계의 야생 동물을 완전히 자유롭게 하신 주권적 행위를 묻는 수사적 질문으로 처리했습니다.
  alternative_readings:
  - 문장만 중립적으로 옮겨 창조주적 함의를 약화시키는 읽기
  - 단순 정보 질문처럼 옮기는 읽기
  rationale: 문맥상 이 구절은 하나님이 하신 일을 묻는 연속 수사 질문이므로, 한국어에서도 그 압박감과 주권성을 유지해야 합니다.
  doctrine_reference: 욥기 38–39장의 창조주 주권 강조
