  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִשָּׁ֣/הּ אֱל֣וֹהַּ חָכְמָ֑ה וְ/לֹא חָ֥לַק לָ֝֗/הּ בַּ/בִּינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/017.yaml
  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
  footnotes:
  - marker: a
    text: Or 'because God has made her forget wisdom' or 'because God has caused wisdom to be lacking to her.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'has not apportioned to her in understanding,' that is, has not given her a share in understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하나님이 그녀에게서 지혜를 빼앗으시고 이해에 몫을 주지 않으셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빼앗으시고’는 히필 동사의 인과적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이해에 몫을 주지 않으셨기’는 직역하면 ‘이해 안에서 그녀에게 몫을 나누지 않으셨다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 그래서
  - 왜냐하면
  lexicon: HALOT
  rationale: 문맥상 앞 절의 이유를 밝히는 인과를 자연스럽게 풀어 주되, 본문의 논리 관계를 유지했습니다.
- source_word: הִשָּׁהּ
  english_pob_choice: has deprived her of
  chosen_korean: 그녀에게서 지혜를 빼앗으시고
  alternatives_korean:
  - 그녀에게서 지혜를 잊게 하시고
  - 그녀에게서 지혜가 없게 하시고
  lexicon: HALOT
  rationale: 히필의 원인적 뉘앙스를 살려 하나님이 지혜의 결핍을 일으키셨음을 드러내면서, 한국어에서는 ‘빼앗다’가 가장 직접적이고 자연스럽습니다.
- source_word: חָלַק לָהּ בַּבִּינָה
  english_pob_choice: has not given her a share in understanding
  chosen_korean: 이해에 몫을 주지 않으셨기
  alternatives_korean:
  - 이해를 나누어 주지 않으셨기
  - 이해를 배분하지 않으셨기
  lexicon: HALOT
  rationale: חלק의 ‘나누어 주다/할당하다’라는 분배 이미지를 살려 ‘몫을 주다’로 옮겼고, בינה는 지혜와 구별되는 인지적 능력으로서 ‘이해’가 적절합니다.
theological_decisions:
- issue: 하나님을 원인 주어로 직접 제시하는 표현
  chosen_reading: 하나님이 그녀의 지혜 부족과 이해의 결핍을 직접 일으키신 것으로 옮겼습니다.
  alternative_readings:
  - 그녀는 본래 지혜가 부족합니다
  - 하나님이 허락하지 않으셨습니다
  rationale: 히브리어 본문이 하나님을 두 동사의 주어로 명시하므로, 신학적 긴장을 완화하지 않고 그대로 반영했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
