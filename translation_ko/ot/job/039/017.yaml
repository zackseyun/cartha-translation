  lexicon: HALOT
  rationale: 히필의 원인적 뉘앙스를 살려 하나님이 지혜의 결핍을 일으키셨음을 드러내면서, 한국어에서는 ‘빼앗다’가 가장 직접적이고 자연스럽습니다.
- source_word: חָלַק לָהּ בַּבִּינָה
