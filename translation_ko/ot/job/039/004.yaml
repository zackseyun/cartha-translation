  rationale: 본문이 동물 문맥이므로 성별이 드러나는 ‘아들들’보다, 출생한 새끼를 가리키는 ‘새끼들’이 의미를 더 정확히 전달합니다.
- source_word: בַּבָּר
  english_pob_choice: in the open field
  chosen_korean: 들판에서
  alternatives_korean:
  - 들에서
  - 야생에서
  - 넓은 들에서
  lexicon: HALOT
  rationale: ‘בָּר’의 열린 자연 환경을 한국어로 간결하게 살리되, ‘야생’보다 시적 문맥에 더 자연스러운 ‘들판’으로 옮겼습니다.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  english_pob_choice: and do not return to them
  chosen_korean: 나가서는 그들에게 돌아오지 않습니다
  alternatives_korean:
  - 나가서는 그들에게 돌아오지 않습니다
  - 그리고는 그들에게 되돌아오지 않습니다
  - 나간 뒤 다시 돌아오지 않습니다
  lexicon: HALOT
  rationale: ‘돌아오다’가 יצא/שוב의 이동과 귀환 대립을 가장 सीधे하게 드러내며, 대상을 가리키는 ‘그들에게’를 유지해 부모 짐승을 분명히 했습니다.
theological_decisions:
- issue: 동물 새끼를 가리키는 표현의 문체
  chosen_reading: 동물 문맥을 유지해 ‘새끼들’로 번역했습니다.
  alternative_readings:
  - ‘자녀들’
  - ‘자손들’
  rationale: 본문은 사람 자녀가 아니라 짐승의 새끼를 말하므로, 일반화된 인칭 표현으로 바꾸지 않고 원문의 관찰적 묘사를 보존해야 합니다.
  doctrine_reference: 문맥 충실성
