  lexicon: HALOT
  rationale: 동물의 새끼가 번성하고 기운차게 자라는 뜻을 자연스러운 현대 한국어로 옮기기 위해 ‘강해집니다’를 택했습니다.
- source_word: בְּנֵיהֶם
  english_pob_choice: their young ones
  chosen_korean: 그들의 새끼들
