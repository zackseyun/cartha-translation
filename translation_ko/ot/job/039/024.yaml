  - marker: a
    text: Or 'he does not hold back at the sound of the trumpet,' reflecting an idiomatic sense of the verb often rendered more literally as 'believe.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'swallows the ground,' a vivid image for the horse's speed and eagerness in charging forward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사나움과 격노로 땅을 집어삼키며[a], 나팔 소리가 들리면 가만히 서 있지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅을 삼킨다’는 뜻으로, 돌진하면서 지면을 빨아들이듯 빠르게 달리는 모습을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가만히 서 있지 못합니다’는 여기서 ‘믿다’의 일반적 뜻보다 ‘버티다/굳게 서다’의 관용적 의미를 반영한 번역입니다.
    reason: lexical_alternative
