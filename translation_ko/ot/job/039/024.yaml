theological_decisions:
- issue: 전투마의 묘사에서 동사와 이미지의 직역성 유지
  chosen_reading: 말의 난폭한 질주와 나팔 소리에 대한 본능적 반응을 과장 없이 생생하게 유지했습니다.
  alternative_readings:
  - 부드럽게 의역하여 단순히 빨리 달린다고 표현
  - 의미를 약화시켜 일반적인 말의 성질로 처리
  rationale: 이 절은 하나님의 창조 질서 안에서 말의 위력을 묘사하는 시적 본문이므로, 이미지의 강도를 약화하지 않는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 창조 세계의 질서와 피조물의 본성 묘사
