  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
  footnotes:
  - marker: a
    text: Or 'at the sound of the trumpet'; the Hebrew idiom בְּדֵי שֹׁפָר marks the occasion of the trumpet's sounding.
    reason: lexical_alternative
  - marker: b
    text: '''Aha!'' is an exclamation of eager excitement, depicting the horse''s readiness for battle.'
    reason: cultural_note
  - marker: c
    text: Or 'the roar of commanders and the shouting'; רַעַם is literally 'thunder,' used metaphorically for loud battle noise, and תְּרוּעָה can denote a battle shout or signal blast.
    reason: lexical_alternative
translation:
  language: ko
  text: 뿔나팔 소리에 그는 “아하!” 하고 말합니다. 멀리서부터 전쟁을 냄새 맡으니 — 지휘관들의 우렛소리와 전쟁의 함성입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뿔나팔이 울릴 때”; 히브리어 관용구 בְּדֵי שֹׁפָר는 나팔이 울리는 순간을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: “아하!”는 전쟁을 앞둔 들뜬 흥분을 나타내며, 말의 전투 준비 상태를 그립니다.
    reason: cultural_note
  - marker: c
    text: 또는 “지휘관들의 우레와 함성”; רַעַם은 문자적으로는 “우렛소리”이지만, 여기서는 전장의 큰 소리를 비유적으로 가리키고, תְרוּעָה는 전투 함성이나 신호 나팔을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  english_pob_choice: At the blast of the trumpet
  chosen_korean: 뿔나팔 소리에
  alternatives_korean:
  - 뿔나팔이 울릴 때
  - 나팔 소리에
  - 나팔이 울리는 순간에
  lexicon: HALOT
  rationale: שֹׁפָר의 군사적 신호 기능을 살리면서, 한국어에서는 '소리에'로 자연스럽게 순간/계기 의미를 드러냈습니다.
- source_word: הֶאָח
  english_pob_choice: Aha!
  chosen_korean: “아하!”
  alternatives_korean:
  - “하!”
  - “아!”
  lexicon: HALOT
  rationale: 전쟁에 대한 들뜬 반응을 나타내는 감탄사이므로, 짧고 생생한 '아하!'가 가장 가깝습니다.
- source_word: יָרִיחַ מִלְחָמָה
  english_pob_choice: he smells the battle
  chosen_korean: 전쟁을 냄새 맡으니
  alternatives_korean:
  - 전쟁 냄새를 맡으니
  - 전쟁을 맡으니
  - 전쟁의 냄새를 맡으니
  lexicon: HALOT
  rationale: 히필형 ריח의 구체적 감각 이미지를 살리기 위해 직역을 유지하되, 한국어 어순은 자연스럽게 다듬었습니다.
- source_word: רַעַם שָׂרִים וּתְרוּעָה
  english_pob_choice: the thunder of commanders and the war cry
  chosen_korean: 지휘관들의 우렛소리와 전쟁의 함성
  alternatives_korean:
  - 지휘관들의 천둥 같은 소리와 전쟁 함성
  - 지휘관들의 포효와 함성
  - 지휘관들의 우레와 전투 함성
  lexicon: HALOT
  rationale: רַעַם의 문자적 '우렛소리'를 살려 전장의 굉음을 보존했고, תְרוּעָה는 전투 맥락에 맞게 '전쟁의 함성'으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 말의 반응을 어떻게 처리할지
  chosen_reading: 말이 전쟁의 기운을 감지하고 응답하는 장면으로, 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 말이 주인의 신호를 알아듣는 비유로 완화
  - 전투 준비가 된 말의 본능적 반응으로 설명
  rationale: 본문은 시적 의인화를 통해 전장의 긴장과 말의 사나운 흥분을 묘사하므로, 이를 해설적으로 약화하지 않았습니다.
  doctrine_reference: 시적 묘사 보존 원칙
