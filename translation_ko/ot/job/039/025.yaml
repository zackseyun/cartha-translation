revisions:
- from: 뿔나팔 소리에 그는 “아하!” 하고 말합니다. 멀리서부터 전쟁을 냄새 맡으니 — 지휘관들의 우렛소리와 전쟁의 함성입니다.[a][b][c]
  to: 나팔 소리가 울리면[a] 그는 “아하!” 하고 말합니다[b]. 그는 멀리서 전쟁의 냄새를 맡고, 지휘관들의 우렛소리와 전투 함성을 감지합니다[c].
  rationale: 원문의 시적 의인화와 감각 이미지는 유지하되, 후반부를 설명문으로 바꾸었던 통사를 바로잡았습니다. ‘전쟁의 냄새를 맡고’는 ריח의 구체적 이미지를 보존하고, 뒤따르는 큰 소리와 외침은 ‘감지합니다’로 자연스럽게 병렬 처리했습니다. 각주 표지도 해당 표현 바로 뒤로 옮겼습니다.
