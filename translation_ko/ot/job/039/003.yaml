lexical_decisions:
- source_word: תִּ֭כְרַעְנָה
  english_pob_choice: they crouch down
  chosen_korean: 몸을 웅크리고
  alternatives_korean:
  - 몸을 낮추고
  - 무릎을 꿇고
  lexicon: HALOT
  rationale: כרע의 물리적 굽힘/웅크림을 자연스럽게 살리되, 출산 장면에 어울리는 동물 묘사로 읽히도록 했습니다.
- source_word: יַלְדֵי/הֶ֣ן
  english_pob_choice: their young
  chosen_korean: 새끼
  alternatives_korean:
  - 그들의 자녀
  - 자손
  lexicon: HALOT
  rationale: 본문의 동물 맥락에서 ילד의 명사형은 사람 자녀보다 ‘새끼’가 가장 정확하고 자연스럽습니다.
- source_word: תְּפַלַּ֑חְנָה
  english_pob_choice: they bring forth
  chosen_korean: 낳으며
  alternatives_korean:
  - 생산하며
  - 해산하며
  lexicon: HALOT
  rationale: 출산을 뜻하는 동사로, 시적 문맥에서는 ‘낳다’가 간결하면서도 의미를 분명하게 드러냅니다.
- source_word: חֶבְלֵי/הֶ֥ם
  english_pob_choice: their labor pains
  chosen_korean: 해산의 고통
  alternatives_korean:
  - 산통
  - 산고
  - 진통
  lexicon: HALOT
  rationale: חבל의 이 맥락상 뜻을 살려 ‘해산의 고통’으로 옮겨, 단순한 통증이 아니라 출산의 고통이라는 점을 분명히 했습니다.
- source_word: תְּשַׁלַּֽחְנָה
  english_pob_choice: they cast off
  chosen_korean: 벗어버립니다
  alternatives_korean:
  - 내버립니다
  - 놓아버립니다
  - 털어버립니다
  lexicon: HALOT
  rationale: שלח의 ‘내보내다/놓아주다’ 뉘앙스를 출산 후 고통이 사라지는 이미지로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시적 본문에서 동물의 출산 묘사 어휘 선택
  chosen_reading: 직설적이되 완곡하지 않은 출산 표현을 유지해, 본문의 관찰적·시적 힘을 살렸습니다.
  alternative_readings:
  - ‘낳아 놓습니다’처럼 더 완곡하게 옮기는 방식
  - ‘해산 통증을 풀어버립니다’처럼 설명적으로 옮기는 방식
  rationale: 이 절은 피조세계의 생생한 출산 장면을 묘사하므로, 의미를 흐리지 않는 범위에서 직접적인 생물학적 표현을 유지하는 편이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 욥기 39장의 창조 질서와 하나님의 섭리에 대한 시적 진술
