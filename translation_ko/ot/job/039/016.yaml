base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
  footnotes:
  - marker: a
    text: Or, more literally, 'She hardens her children against herself, as though not hers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자기 새끼들을 마치 자기 것이 아닌 듯 매정하게 대합니다.[a] 그녀는 자기 수고가 헛되어도 두려워하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 가깝게 옮기면, ‘그녀는 자기 새끼들을 자기에게 속하지 않은 듯 굳게 합니다’입니다. 이는 새끼들을 냉혹하거나 매정하게 대한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  english_pob_choice: treats ... harshly
  chosen_korean: 강하게 대하며
  alternatives_korean:
  - 혹독하게 대하며
  - 냉정하게 대하며
  - 거칠게 대하며
  lexicon: HALOT
  rationale: 히필형의 ‘굳게 하다/가혹하게 대하다’는 뜻을 한국어에서 자연스럽게 살려, 동물의 행동을 어색하게 의인화하지 않으면서도 harshly의 강도를 유지했습니다.
- source_word: בָּנֶיהָ
  english_pob_choice: her young
  chosen_korean: 새끼들
  alternatives_korean:
  - 자녀들
  - 아들들
  - 새끼 새들
  lexicon: HALOT
  rationale: 문맥이 타조의 새끼를 가리키므로, 문자적 ‘아들들’보다 동물 문맥에 맞는 ‘새끼들’이 원문의 뜻을 가장 분명하게 드러냅니다.
- source_word: לְלֹא לָהּ
  english_pob_choice: as if they were not hers
  chosen_korean: 마치 자기 것이 아닌 것처럼
  alternatives_korean:
  - 마치 자기 것이 아닌 듯
  - 자기에게 속하지 않은 것처럼
  - 자기 소유가 아닌 것처럼
  lexicon: HALOT
  rationale: 직역형 ‘자기 것이 아닌’의 비교적 의미를 살리되, 한국어에서 자연스럽게 읽히도록 ‘마치 … 것처럼’으로 풀었습니다.
- source_word: לְרִיק יְגִיעָהּ
  english_pob_choice: her labor is in vain
  chosen_korean: 그 수고는 헛되고
  alternatives_korean:
  - 그 노력은 헛되고
  - 그 노고는 헛되고
  - 그 수고는 무익하고
  lexicon: HALOT
  rationale: לְרִיק의 ‘헛되이/무익하게’라는 의미를 간결하게 반영해, 뒤의 ‘두려움도 없습니다’와 병렬 구조를 이루도록 했습니다.
- source_word: בְּלִי פָחַד
  english_pob_choice: without fear
  chosen_korean: 두려움도 없습니다
  alternatives_korean:
  - 두려움 없이
  - 걱정도 없습니다
  - 염려도 없습니다
  lexicon: HALOT
  rationale: 직역의 ‘없이’도 가능하지만, 이 절의 종결부를 한국어 문장으로 매끄럽게 마무리하면서 fear의 핵심 의미를 유지했습니다.
theological_decisions:
- issue: 타조의 비정상적 양육 행위를 묘사하는 의인화 수준
  chosen_reading: 동물의 행동을 인간적 도덕평가로 과도하게 확대하지 않고, 본문이 말하는 냉혹함과 무관심을 그대로 드러냈습니다.
  alternative_readings:
  - ‘학대합니다’처럼 강한 도덕판정을 전면화하는 번역
  - ‘무시합니다’처럼 약화된 번역
  rationale: 이 절은 창조세계 안에서 관찰되는 타조의 특성을 서술하는 맥락이므로, source가 주는 ‘거칠게 대하고 자기 것이 아닌 듯 여김’의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 욥기 39장의 창조 관찰 문맥
