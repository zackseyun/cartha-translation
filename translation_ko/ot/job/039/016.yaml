  source_fidelity: 첫 문장의 ‘자기에게서 멀어지게’는 히브리어에 없는 ‘멀어지게 하다’라는 의미를 더합니다. הִקְשִׁיחַ은 여기서 새끼를 자기에게서 떼어 놓는 행동이라기보다 새끼를 냉혹하거나 매정하게 대하는 태도를 나타냅니다. 후반절은 그녀가 자기 수고가 헛되는 일을 두려워하지 않는다는 뜻으로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘자기에게서 멀어지게 강하게 대하며’는 한국어 결합이 어색하고 의미도 불명확합니다. ‘마치 자기 것이 아닌 듯 매정하게 대합니다’는 동물 문맥에서 자연스럽고, 원문의 냉혹한 뉘앙스를 보존합니다.
  terminology: 동물 문맥의 בָּנֶיהָ는 ‘자기 새끼들’이 적절합니다. הִקְשִׁיחַ에는 ‘매정하게 대하다’를 사용하여 과도한 도덕적 판정인 ‘학대하다’는 피하면서도 ‘강하게’보다 정확하게 옮겼습니다. בְּלִי פָחַד는 ‘두려워하지 않습니다’로 유지했습니다.
