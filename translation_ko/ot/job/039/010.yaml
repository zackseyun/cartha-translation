  - 골라내겠느냐
  - 밭을 갈겠느냐
  lexicon: HALOT
  rationale: 이 동사는 단순한 쟁기질보다 흙을 고르고 다듬는 농작업을 가리키므로, 현대 한국어에서 그 기능을 전달하는 ‘써갈다’ 계열 표현을 택했습니다.
theological_decisions:
- issue: 수사적 질문의 어조
  chosen_reading: 하나님이 욥에게 던지는 반문 형식을 살려 ‘-겠느냐’로 끝내, 무력한 인간과 창조주의 대비를 드러냈습니다.
  alternative_readings:
  - -할 수 있겠느냐
  - -하겠느냐
  rationale: 본문은 정보 전달보다 도전적 반문이 핵심이므로, 한국어에서도 직접적인 반문 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 욥기의 하나님의 말씀 방식과 창조 질서에 대한 인간의 한계를 강조하는 문맥
- issue: ‘아하르레카’의 방향성
  chosen_reading: ‘네 뒤에서’로 옮겨, 소가 인간을 따라 작업하는 종속적 방향을 분명히 했습니다.
  alternative_readings:
  - 네 뒤를 따라
  - 너를 뒤따라
  rationale: אַחֲרֶיךָ는 단순한 위치가 아니라 인도받아 뒤따르는 순서를 나타내므로, 농경 장면의 종속 관계를 분명히 하는 표현이 필요합니다.
  doctrine_reference: 창조주와 피조물의 위계, 인간의 통제 한계
