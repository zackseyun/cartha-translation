source:
  edition: WLC
  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
  footnotes:
  - marker: a
    text: Or 'the aurochs' or 'the wild bull.' The Hebrew רֵים denotes a strong wild bovine, not the mythical 'unicorn' of older translations.
    reason: lexical_alternative
  - marker: b
    text: Or 'will it plow the valleys behind you?' The Hebrew verb likely refers more specifically to soil-working such as harrowing or leveling.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 들소[a]를 그 밧줄로 고랑에 매어 두겠느냐? 그것이 네 뒤를 따라 골짜기들을 써레질하겠느냐?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들소’로 옮긴 히브리어 רֵים은 강한 야생 소과 동물을 가리킵니다. ‘오록스’ 또는 ‘들황소’로도 옮길 수 있으며, 전통 번역의 ‘유니콘’은 이 히브리어 낱말의 뜻을 반영하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단순히 밭을 가는 일보다 흙을 고르거나 평탄하게 하는 작업, 곧 써레질을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
