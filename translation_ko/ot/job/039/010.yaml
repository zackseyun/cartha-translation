  - 쟁기 고랑에
  - 밭고랑에
  lexicon: HALOT
  rationale: תלם은 밭을 갈아 만든 고랑이므로, 장소를 나타내는 조사와 함께 ‘고랑에’로 옮겨 농경 이미지를 살렸습니다.
- source_word: יְשַׂדֵּד
  english_pob_choice: will it harrow
  chosen_korean: 써갈겠느냐
  alternatives_korean:
