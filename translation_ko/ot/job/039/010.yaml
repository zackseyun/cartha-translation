    issue: ‘밭을’이 עֲמָקִים의 복수 및 기본 뜻을 축소합니다.
    rationale: עֲמָקִים은 기본적으로 ‘골짜기들, 저지대들’입니다. 경작지를 뜻한다고 보는 해석 가능성은 있으나, 본문에서는 ‘골짜기들’을 유지하고 농작업 동사로 문맥을 보완하는 편이 안전합니다.
  - severity: medium
    issue: ‘써갈다’는 현대 표준어에서 어색하며 농경 작업을 명료하게 전달하지 못합니다.
    rationale: שׂדד는 이 문맥에서 흙을 고르거나 써레질하는 작업을 가리키는 것으로 이해될 수 있습니다. ‘써레질하다’가 자연스럽고 구체적입니다.
  - severity: low
    issue: ‘그 줄’보다 ‘그 밧줄’이 עֲבֹתוֹ의 구체성을 더 잘 살립니다.
    rationale: עֲבֹת는 묶는 데 쓰는 줄·끈·밧줄을 뜻합니다. ‘밧줄’은 동물을 매는 장면에서 자연스럽습니다.
