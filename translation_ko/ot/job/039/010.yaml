  lexicon: HALOT
  rationale: רֵים은 길들지 않은 강한 들짐승 소과 동물을 가리키므로, 한국어로는 생동감 있고 이해하기 쉬운 ‘들소’가 가장 적절합니다.
- source_word: בְּתֶלֶם
  english_pob_choice: in the furrow
