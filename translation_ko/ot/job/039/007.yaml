  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִ֭שְׂחַק לַ/הֲמ֣וֹן קִרְיָ֑ה תְּשֻׁא֥וֹת נ֝וֹגֵ֗שׂ לֹ֣א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
  footnotes:
  - marker: a
    text: Or 'the noise of the city.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the shouts of the taskmaster' or 'overseer.' The Hebrew term can refer more broadly to one who drives or exacts labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 도시의 떠드는 소리를 비웃으며, 몰아대는 자의 고함을 듣지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시의 소음’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노동을 부리는 자의 고함’ 혹은 ‘감독의 외침’. 히브리어는 더 넓게 사람이나 짐승을 몰아대는 자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  english_pob_choice: he laughs
  chosen_korean: 비웃으며
  alternatives_korean:
  - 웃습니다
  - 조롱합니다
  lexicon: HALOT
  rationale: 야생 당나귀의 반응을 단순한 웃음보다 더 자연스럽게 드러내기 위해 ‘비웃다’를 택했습니다. 문맥상 무시하고 깔아보는 뉘앙스를 유지합니다.
- source_word: לַהֲמוֹן קִרְיָה
  english_pob_choice: at the tumult of the city
  chosen_korean: 도시의 떠드는 소리
  alternatives_korean:
  - 도시의 소란
  - 도시의 떠들썩함
  lexicon: HALOT
  rationale: הָמוֹן의 ‘소란/떠듦’과 קִרְיָה의 ‘도시’를 함께 살리되, 한국어로는 청각적 이미지가 살아나는 ‘떠드는 소리’가 가장 직접적입니다.
- source_word: תְּשֻׁאוֹת נֹגֵשׂ
  english_pob_choice: the shouts of the driver
  chosen_korean: 몰아대는 자의 고함
  alternatives_korean:
  - 채찍질하는 자의 소리
  - 감독의 외침
  - 관리자의 고함
  lexicon: HALOT
  rationale: נֹגֵשׂ는 단순 직책명보다 ‘몰아대다/압박하다/몰아붙이다’의 동사적 힘이 강하므로, 문맥의 동물 이미지에 맞게 ‘몰아대는 자’로 옮겼습니다. תְּשֻׁאוֹת은 ‘고함’으로 옮겨 소리의 강도를 드러냈습니다.
- source_word: לֹא יִשְׁמָע
  english_pob_choice: he does not hear
  chosen_korean: 듣지 않습니다
  alternatives_korean:
  - 들리지 않습니다
  - 귀 기울이지 않습니다
  lexicon: HALOT
  rationale: 원문은 ‘듣다’의 직접적 진술이므로, 의미를 심리적으로 확장한 ‘귀 기울이다’보다 ‘듣지 않다’를 유지했습니다.
theological_decisions:
- issue: 야생 동물의 자유와 인간 도시 질서의 대비
  chosen_reading: 본문의 비유적 대비를 유지해, 도시의 소란과 노동 강요가 야생 당나귀에게 아무 권위도 미치지 못한다는 점을 드러냈습니다.
  alternative_readings:
  - 문학적으로 완만하게 ‘도시의 소음을 개의치 않는다’로 정리하는 방식
  rationale: 이 구절은 단순한 성격 묘사가 아니라 창조 세계 안에서 인간 질서의 한계를 드러내는 이미지이므로, 강한 대비를 약화하지 않았습니다.
  doctrine_reference: 창조 질서와 인간 통제의 한계
