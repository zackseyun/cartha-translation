  - 그의 눈은 멀리서 살핍니다
  lexicon: HALOT
  rationale: 히브리어는 눈이 주어가 되어 ‘멀리서’ 대상을 응시하는 그림을 그리므로, 시각적 강도를 살려 ‘바라봅니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시적 이미지의 직역성과 자연스러운 한국어 사이의 균형
  chosen_reading: ‘먹이를 찾아냅니다’로 옮겨, 매의 포식적 통찰과 능동성을 드러냈습니다.
  alternative_readings:
  - ‘먹이를 찾습니다’
  - ‘먹이를 살핍니다’
  rationale: 본문은 단순 시선이 아니라 먼 거리에서 먹이를 탐지하는 시적 묘사이므로, 한국어에서도 그 예리한 사냥 이미지를 유지하는 것이 적절합니다.
  doctrine_reference: 창조 질서의 시적 묘사
