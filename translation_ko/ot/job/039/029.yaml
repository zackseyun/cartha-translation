lexical_decisions:
- source_word: מִשָּׁם
  english_pob_choice: From there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기에서
  - 그 자리에서
  lexicon: HALOT
  rationale: 장소를 가리키는 부사구를 자연스러운 현대 한국어로 옮기되, 원문의 출발점·시점 의미를 유지했습니다.
