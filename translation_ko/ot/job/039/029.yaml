  lexicon: HALOT
  rationale: 히브리어는 눈이 주어가 되어 ‘멀리서’ 대상을 응시하는 그림을 그리므로, 시각적 강도를 살려 ‘바라봅니다’로 자연스럽게 옮겼습니다.
