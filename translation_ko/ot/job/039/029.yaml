  - 식물
  lexicon: HALOT
  rationale: 일반적인 ‘음식’보다 새가 사냥해 취하는 대상이라는 문맥에 맞춰 ‘먹이’로 옮겼습니다.
- source_word: לְמֵרָחוֹק / עֵינָיו יַבִּיטוּ
  english_pob_choice: his eyes look from far away
  chosen_korean: 그의 눈은 멀리서 바라봅니다
