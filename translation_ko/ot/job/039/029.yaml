  rationale: 문맥상 매를 가리켜 먹이를 집요하게 탐지하는 동작이므로, 단순한 ‘파다’보다 목표물을 발견해 내는 뜻을 살린 표현을 택했습니다.
- source_word: אֹכֶל
  english_pob_choice: food
  chosen_korean: 먹이
