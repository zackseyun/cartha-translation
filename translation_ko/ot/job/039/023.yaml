  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָ֭לָי/ו תִּרְנֶ֣ה אַשְׁפָּ֑ה לַ֖הַב חֲנִ֣ית וְ/כִידֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/023.yaml
  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
  footnotes:
  - marker: a
    text: Or 'against him the quiver rings out.' The Hebrew preposition and verb can be rendered with slightly different spatial and auditory nuance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the flame/blade of the spear and javelin,' a poetic expression for their flashing brightness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 위로 화살통이 덜그럭거리고, 번쩍이는 창과 단창이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 전치사와 동사는 ‘그를 향해’ 또는 ‘그 위에서’처럼 약간 다른 공간·청각 뉘앙스로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘창과 단창의 불꽃/날’로, 무기들이 번쩍이는 모습을 가리키는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  english_pob_choice: over him
  chosen_korean: 그의 위로
  alternatives_korean:
  - 그에게
  - 그를 향해
  - 그 위에서
  lexicon: HALOT
  rationale: עַל + 3인칭 남성 단수 접미사는 여기서 대상 위에/맞은편에 놓인 상태를 나타내므로, ‘그의 위로’가 공간적 이미지를 자연스럽게 살립니다.
- source_word: תִּרְנֶה
  english_pob_choice: rattles
  chosen_korean: 덜그럭거리고
  alternatives_korean:
  - 울리고
  - 쨍쨍 울리고
  - 달그락거리고
  lexicon: HALOT
  rationale: 화살통이 주어인 시적 문맥에서 소리의 울림과 흔들림을 함께 전하는 구어적 감각이 필요하므로, ‘덜그럭거리고’로 옮겼습니다.
- source_word: לַהַב
  english_pob_choice: the flashing
  chosen_korean: 번쩍이는
  alternatives_korean:
  - 불꽃 같은
  - 빛나는
  - 섬광의
  lexicon: HALOT
  rationale: 직역하면 ‘불꽃/날’이지만, 여기서는 창과 결합한 시적 수식이므로 무기의 번뜩임을 드러내는 형용사로 처리했습니다.
- source_word: כִידוֹן
  english_pob_choice: javelin
  chosen_korean: 단창
  alternatives_korean:
  - 재블린
  - 창
  - 투창
  lexicon: HALOT
  rationale: חֲנִית와 구별되는 더 가벼운 던지는 무기이므로, 한국어로는 ‘단창’이 의미 차이를 가장 잘 보존합니다.
