  lexicon: HALOT
  rationale: אֶבְרָה는 전체 날개보다 더 구체적인 ‘깃날개/날개깃’에 가깝고, וְנֹצָה는 ‘깃털’이므로 두 항목의 병렬을 살렸습니다.
