  rationale: 본문은 단순 정보 전달이 아니라 비교를 통해 타조의 특이함을 드러내는 수사적 질문이므로, 한국어에서도 그 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 시적 수사 유지
