lexical_decisions:
- source_word: כְּנַף
  english_pob_choice: wings
  chosen_korean: 날개
  alternatives_korean:
  - 날갯죽지
  - 깃
  lexicon: HALOT
  rationale: 히브리어 כְּנַף는 여기서 새의 신체 부위를 가리키므로, 한국어로는 가장 자연스러운 ‘날개’로 옮겼습니다.
- source_word: רְנָנִים
  english_pob_choice: of the ostrich
  chosen_korean: 타조의
  alternatives_korean:
  - 타조의 것
  - 우는 자들의
  lexicon: HALOT
  rationale: 문맥상 동물들의 묘사이며, 이 형태는 여기서 타조를 가리키는 용례이므로 ‘타조의’로 분명하게 번역했습니다.
- source_word: נֶעֱלָסָה
  english_pob_choice: flap joyfully
  chosen_korean: 기뻐서 퍼덕입니다
  alternatives_korean:
  - 기쁘게 퍼덕입니다
  - 자랑스럽게 펄럭입니다
  lexicon: HALOT
  rationale: 동작의 물리적 의미와 활기찬 뉘앙스를 함께 살리기 위해 ‘퍼덕입니다’를 쓰고, 감정적 뉘앙스는 ‘기뻐서’로 반영했습니다.
- source_word: אֶבְרָה חֲסִידָה וְנֹצָה
  english_pob_choice: the pinions and plumage of the stork
  chosen_korean: 황새의 깃날개와 깃털
  alternatives_korean:
  - 황새의 날개깃과 깃털
  - 황새의 큰 날개와 깃털
  lexicon: HALOT
  rationale: אֶבְרָה는 전체 날개보다 더 구체적인 ‘깃날개/날개깃’에 가깝고, וְנֹצָה는 ‘깃털’이므로 두 항목의 병렬을 살렸습니다.
theological_decisions:
- issue: 수사적 질문으로서의 אִם 처리
  chosen_reading: 직역형 의문문으로 유지해, 타조의 날개와 황새의 날개를 대비하는 수사적 비교를 드러냈습니다.
  alternative_readings:
  - ‘과연 …입니까’로 완곡화
  - ‘…인가요’로 구어화
  rationale: 본문은 단순 정보 전달이 아니라 비교를 통해 타조의 특이함을 드러내는 수사적 질문이므로, 한국어에서도 그 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 시적 수사 유지
