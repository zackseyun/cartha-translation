translation:
  language: ko
  text: 당신의 명령으로 독수리가 높이 날며 자기 둥지를 높이 올립니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “치솟으며”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 직역은 “당신의 입 위에”로, 여기서는 “당신의 명령으로”라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘독수리’는 이 문맥에서 큰 맹금류를 가리킬 수 있어, 경우에 따라 ‘수리’보다 넓은 의미로 이해될 수 있습니다.
    reason: lexical_alternative
