  source_fidelity: 첫 절의 수사 의문문과 ‘당신의 명령’이라는 관용적 의미는 잘 반영되었습니다. 그러나 יָרִים קִנּוֹ는 새가 둥지 자체를 들어 올리는 동작이라기보다 둥지를 높은 곳에 두거나 트는 뜻으로 옮기는 것이 문맥과 한국어 표현에 더 충실합니다.
