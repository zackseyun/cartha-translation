    text: 또는 “그를 메뚜기처럼 우레치게 할 수 있습니까?” 히브리어 동사는 흔들게 하다, 떨게 하다, 또는 격렬하게 움직이게 하다는 뜻을 띨 수 있습니다. 이 비유는 소리뿐 아니라 움직임의 이미지도 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  english_pob_choice: Can you make him leap
  chosen_korean: 그가 메뚜기처럼 펄쩍 뛰게 할 수 있습니까?
  alternatives_korean:
  - 그를 메뚜기처럼 흔들게 할 수 있습니까?
  - 그를 메뚜기처럼 우레치게 할 수 있습니까?
  - 그를 메뚜기처럼 튀어 오르게 할 수 있습니까?
  lexicon: HALOT
  rationale: 동사 רעשׁ의 ‘흔들다/떨게 하다’ 계열 의미를 반영하되, 메뚜기와의 비교 속에서 말의 재빠른 도약 이미지를 살려 한국어 자연문으로 옮겼습니다.
- source_word: כָּאַרְבֶּה
  english_pob_choice: like the locust
