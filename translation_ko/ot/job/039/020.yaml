  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
  footnotes:
  - marker: a
    text: Or, 'Can you make him thunder like the locust?' The Hebrew verb can suggest causing to shake, quake, or move violently; some take the image to emphasize sound as well as motion.
