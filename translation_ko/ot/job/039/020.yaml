  alternatives_korean:
  - 한 메뚜기처럼
  - 메뚜기같이
  lexicon: HALOT
  rationale: 히브리어의 비교구를 한국어 관용에 맞게 ‘-처럼’으로 처리했고, 집합적 종 이미지가 살아나도록 단수적 관사 느낌은 생략했습니다.
- source_word: הוֹד
  english_pob_choice: The majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄함
  - 영광
  - 당당함
  lexicon: HALOT
  rationale: 말의 자세와 소리에서 풍기는 위압적 품격을 나타내는 말로 ‘위엄’이 가장 간결하고 본문 맥락에 맞습니다.
- source_word: נַחְרוֹ
  english_pob_choice: of his snorting
  chosen_korean: 코 고는 소리의
  alternatives_korean:
  - 콧김의
  - 코 고는 숨결의
  - 코에서 내는 소리의
  lexicon: HALOT
  rationale: 말의 콧구멍을 통해 거칠게 내뿜는 소리를 한국어로는 ‘코 고는 소리’로 옮기는 것이 음향적 효과를 가장 잘 전달합니다.
- source_word: אֵימָה
  english_pob_choice: is terrifying
  chosen_korean: 두렵습니다
  alternatives_korean:
  - 무섭습니다
  - 공포스럽습니다
  - 소름 끼칩니다
  lexicon: HALOT
  rationale: 명사 ‘두려움/공포’의 서술적 용법을 한국어 상태술로 옮겨, 소리 자체가 불러일으키는 압도적 위협을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 수사적 질문의 유지
  chosen_reading: 하나님이 욥에게 던지는 반문형을 그대로 살려, 말의 통제 불가능성과 창조 질서의 위력을 드러냈습니다.
  alternative_readings:
  - 평서문으로 완화해 옮김
  - 직설적 명령형으로 재구성
  rationale: 본문은 설명보다 도전적 질문을 통해 의미를 형성하므로, 질문형을 유지하는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 욥기 38–41장 하나님의 연설 구조
- issue: 말의 소리와 동작의 중첩
  chosen_reading: 동사의 동작성은 ‘펄쩍 뛰게’로, 명사구는 ‘코 고는 소리의 위엄’으로 나누어 소리와 움직임의 이중 이미지를 함께 보존했습니다.
  alternative_readings:
  - 소리 쪽을 강조해 ‘우레치게’로 통일
  - 동작 쪽만 강조해 ‘튀어 오르게’로 단순화
  rationale: 영어 POB 주석이 소리와 움직임 둘 다를 허용하므로, 둘 중 하나로만 좁히지 않도록 균형 있게 처리했습니다.
  doctrine_reference: 창조 세계의 생동성과 시적 병행법
