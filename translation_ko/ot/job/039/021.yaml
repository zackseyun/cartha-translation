  terminology: ‘골짜기’, ‘힘’, ‘무기’는 적절합니다. 전쟁 말의 동작은 ‘발굽’으로 명시하는 편이 문맥과 어휘 의미를 더 정확히 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 배치하여 참조 대상을 분명히 했습니다.
