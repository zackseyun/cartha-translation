  source_fidelity: 핵심 의미는 대체로 충실합니다. חפר의 말 발굽 동작을 ‘발로 땅을 차고’로 옮긴 것은 가능한 해석이나, ‘파다’라는 원뜻과 긁어 파는 동작을 더 잘 보존하려면 ‘발굽으로 땅을 파헤치며’가 적절합니다. לִקְרַאת נָשֶׁק은 무기(무장)를 향해 나아가 맞닥뜨리는 뜻이며, ‘무기를 맞으러’는 한국어에서 무기에 맞는다는 뜻으로도 읽힐 수 있습니다.
