base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
  footnotes:
  - marker: a
    text: Or 'digs in the valley' or 'paws the ground in the valley.' The Hebrew verb is literally 'dig,' used here of a war horse's hoofing action.
    reason: lexical_alternative
  - marker: b
    text: Or 'to meet the battle.' The Hebrew noun can denote weaponry or arms collectively, and by extension the armed conflict itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 골짜기에서 발굽으로 땅을 파헤치며[a] 자기 힘을 기뻐하고, 무기를 마주하러 나갑니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘골짜기에서 판다’, ‘골짜기에서 발굽으로 땅을 긁는다’. 히브리어 동사는 문자적으로 ‘파다’이며, 여기서는 전쟁 말이 발굽으로 땅을 파헤치거나 긁는 동작을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전투를 맞으러’. 이 히브리어 명사는 무기들 또는 무장을 통틀어 가리키며, 문맥에 따라 무장한 싸움 전체를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  english_pob_choice: paws
  chosen_korean: 발로 땅을 차고
  alternatives_korean:
  - 파헤치고
  - 발로 긁고
  - 발굽으로 땅을 차고
  lexicon: HALOT
  rationale: 문자적으로는 ‘파다’이지만, 말의 행동을 가리킬 때는 발굽으로 땅을 긁거나 차는 동작이므로 한국어에서는 구체적 행동을 드러내는 표현이 가장 자연스럽습니다.
- source_word: בָעֵמֶק
  english_pob_choice: in the valley
  chosen_korean: 골짜기에서
  alternatives_korean:
  - 계곡에서
  - 들판에서
  - 평야에서
  lexicon: HALOT
  rationale: עֵמֶק은 기본적으로 골짜기/저지대를 뜻하므로, 직접적인 지형 이미지를 살려 ‘골짜기에서’로 옮겼습니다.
- source_word: וְיָשִׂישׂ בְּכֹחַ
  english_pob_choice: and rejoices in its strength
  chosen_korean: 자기의 힘을 기뻐하며
  alternatives_korean:
  - 힘을 자랑하며
  - 힘 속에서 기뻐하며
  - 힘으로 즐거워하며
  lexicon: HALOT
  rationale: בְּכֹחַ는 단순히 ‘힘으로’보다 말이 자기의 힘을 누리고 즐기는 상태를 나타내므로, 시적 의미를 살려 ‘자기의 힘을 기뻐하며’로 번역했습니다.
- source_word: לִקְרַאת נָשֶׁק
  english_pob_choice: to meet the weapons
  chosen_korean: 무기를 맞으러
  alternatives_korean:
  - 무기를 향해
  - 무기를 만나러
  - 전투를 맞으러
  lexicon: HALOT
  rationale: נָשֶׁק은 무기들/무장한 싸움을 가리킬 수 있으나, 본문은 말이 무장한 적대에 맞서는 장면이므로 ‘무기를 맞으러’로 구체성과 긴장을 함께 살렸습니다.
