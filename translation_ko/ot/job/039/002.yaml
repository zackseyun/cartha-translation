  lexicon: HALOT
  rationale: 원문의 능동형을 단순 수동으로 바꾸기보다, 임신 기간이 '차오른다'는 완결의 이미지를 살려 번역했습니다.
- source_word: לִדְתָּנָה
  english_pob_choice: when they give birth
  chosen_korean: 해산할 때를
  alternatives_korean:
