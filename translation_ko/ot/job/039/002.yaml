  - 셀 수 있습니까
  lexicon: HALOT
  rationale: 수사적 질문으로서 단순한 계산보다 '헤아리다'가 자연스럽고, 심문하는 어조를 살리면서도 현대 한국어에서 매끄럽습니다.
- source_word: יְרָחִים
