  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Do you count the months until they are completed?' The Hebrew uses an active verb, literally 'they fulfill [the months],' referring to the completion of gestation.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그들이 임신 기간을 채우는 달수를 헤아리십니까[a]? 그들이 새끼를 낳을 때를 아십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그들이 채우는 달들을 세십니까?’ 히브리어는 암컷 동물들이 달들을 ‘채운다’고 능동적으로 표현하며, 임신 기간이 다 차는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  english_pob_choice: Do you count
  chosen_korean: 헤아리십니까
  alternatives_korean:
