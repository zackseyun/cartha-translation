  rationale: מִרְעֶה는 ‘풀 뜯는 곳, 목초지’를 뜻하므로 문맥상 먹이를 찾는 장소를 살려 ‘풀밭’으로 자연스럽게 옮겼습니다.
- source_word: יָרוֹק
