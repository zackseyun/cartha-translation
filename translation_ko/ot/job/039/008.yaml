  - 산지
  lexicon: HALOT
  rationale: 히브리어 정관사를 한국어에서는 과도하게 드러내지 않고, 복수의 산이라는 기본 의미를 간결하게 살렸습니다.
- source_word: מִרְעֵהוּ
  english_pob_choice: his pasture
  chosen_korean: 자기의 풀밭으로
  alternatives_korean:
  - 자기의 목초지로
  - 자기의 풀먹는 곳으로
  - 자기의 초장으로
  lexicon: HALOT
  rationale: מִרְעֶה는 ‘풀 뜯는 곳, 목초지’를 뜻하므로 문맥상 먹이를 찾는 장소를 살려 ‘풀밭’으로 자연스럽게 옮겼습니다.
- source_word: יָרוֹק
  english_pob_choice: green thing
  chosen_korean: 푸른 것
  alternatives_korean:
  - 푸른 풀
  - 푸른 식물
  - 초록의 것
  lexicon: HALOT
  rationale: 단순한 색채 형용사라기보다 새싹이 돋은 초목 전반을 가리키므로, 너무 좁히지 않으면서도 한국어로 자연스러운 ‘푸른 것’을 택했습니다.
