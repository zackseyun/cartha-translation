lexical_decisions:
- source_word: יְתוּר
  english_pob_choice: explores
  chosen_korean: 두루 살피며
  alternatives_korean:
  - 탐색하며
  - 두루 돌아다니며
  - 살피며
  lexicon: HALOT
  rationale: תור의 핵심인 ‘둘러 살피다/탐색하다’ 의미를 살리되, 들짐승의 자유로운 이동을 자연스럽게 드러내기 위해 ‘두루 살피며’로 옮겼습니다.
- source_word: הָרִים
