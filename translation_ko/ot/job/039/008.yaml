  language: ko
  text: 그는 산들을 자기의 풀밭으로 두루 살피며, 모든 푸른 것을 찾아다닙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘푸른 것’은 풀이 무성한 초목이나 새로 돋은 식생을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산들’은 들나귀가 먹이를 찾아 자유롭게 오가는 지형을 가리킵니다.
