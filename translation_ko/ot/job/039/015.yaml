  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/תִּשְׁכַּח כִּי רֶ֣גֶל תְּזוּרֶ֑/הָ וְ/חַיַּ֖ת הַ/שָּׂדֶ֣ה תְּדוּשֶֽׁ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/015.yaml
  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
  footnotes:
  - marker: a
    text: Literally, 'a foot may crush her/it ... a wild animal may trample her/it'; the feminine singular suffix likely refers collectively to the eggs or young left behind.
    reason: lexical_alternative
  - marker: b
    text: Or 'the beast of the field,' a more formal rendering of the Hebrew expression for a wild land animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 발이 그것들을 밟아 으깨고 들짐승이 그것들을 짓밟을 수 있다는 것을 잊습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 여성 단수 접미사는 앞에서 남겨진 알이나 새끼를 집합적으로 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: ‘들짐승’은 직역하면 ‘들의 짐승’에 해당하는 히브리어 표현을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  english_pob_choice: and she forgets
  chosen_korean: 잊어버립니다
  alternatives_korean:
  - 잊습니다
  - 잊어버리고 맙니다
  lexicon: HALOT
  rationale: 과거형 서술을 현재형으로 풀어낸 POB의 흐름을 따라, 이어지는 묘사에 맞는 현재 서술로 옮겼습니다.
- source_word: כִּי רֶגֶל תְּזוּרֶהָ
  english_pob_choice: that a foot may crush them
  chosen_korean: 그의 발이 그것들을 밟아 으깨고
  alternatives_korean:
  - 발이 그것들을 짓밟고
  - 한 발이 그것들을 으깨고
  lexicon: HALOT
  rationale: רֶגֶל은 구체적 이미지인 ‘발’로 살리고, תְּזוּרֶהָ는 단순한 ‘밟다’보다 결과를 드러내는 ‘밟아 으깨다’가 문맥에 더 가깝습니다.
- source_word: וְחַיַּת הַשָּׂדֶה
  english_pob_choice: and a wild animal
  chosen_korean: 들짐승이
  alternatives_korean:
  - 야생동물이
  - 들의 짐승이
  lexicon: HALOT
  rationale: 직역형인 ‘들판의 짐승’보다 한국어에서 자연스럽고 문맥의 거친 야생성을 분명히 드러내는 ‘들짐승’을 택했습니다.
- source_word: תְּדוּשֶׁהָ
  english_pob_choice: may trample them
  chosen_korean: 짓밟을 것임을
  alternatives_korean:
  - 밟아댈 것을
  - 뭉갤 것을
  lexicon: HALOT
  rationale: דושׁ의 ‘밟아 짓누르다’는 의미를 한국어의 ‘짓밟다’로 옮겨 앞 절의 이미지와 평행을 이루게 했습니다.
theological_decisions:
- issue: 지시 대명사들의 수용 방식
  chosen_reading: 히브리어의 여성 단수 접미사는 앞에서 남겨진 알이나 새끼를 집합적으로 가리키는 것으로 보고 ‘그것들’로 옮겼습니다.
  alternative_readings:
  - 그것
  - 그들
  rationale: 영어 POB의 해설처럼 문맥상 단수 접미사는 남겨진 대상 전체를 가리키므로, 한국어에서는 집합적 복수를 써 의미를 분명히 했습니다.
  doctrine_reference: 문맥-기반 지시어 해석
- issue: 시적 현재시제 처리
  chosen_reading: 히브리어 wayyiqtol의 연속 묘사를 한국어 현재형으로 옮겨 장면의 생생함을 살렸습니다.
  alternative_readings:
  - 과거형으로 옮김
  - 완료형으로 옮김
  rationale: 이 단락은 서술적 회상보다 시적 현장감을 강조하므로, 한국어 현재형이 원문의 진행성을 가장 잘 반영합니다.
  doctrine_reference: 히브리어 시가체 서술 관례
