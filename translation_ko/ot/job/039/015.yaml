  - 잊어버리고 맙니다
  lexicon: HALOT
  rationale: 과거형 서술을 현재형으로 풀어낸 POB의 흐름을 따라, 이어지는 묘사에 맞는 현재 서술로 옮겼습니다.
- source_word: כִּי רֶגֶל תְּזוּרֶהָ
  english_pob_choice: that a foot may crush them
  chosen_korean: 그의 발이 그것들을 밟아 으깨고
