  text: סֶ֣לַע יִ֭שְׁכֹּן וְ/יִתְלֹנָ֑ן עַֽל שֶׁן סֶ֝֗לַע וּ/מְצוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
  footnotes:
  - marker: a
    text: Or 'and lodges there' or 'and stays overnight there.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on the tooth of the crag,' a Hebrew image for a sharp rocky projection or peak.
    reason: cultural_note
  - marker: c
    text: Or 'fortress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 절벽, 곧 바위의 뾰족한 봉우리[b]와 요새[c]에 살며 밤을 지냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “묵습니다”, “밤을 새웁니다”.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “바위의 이빨”로, 날카로운 바위 돌출부나 봉우리를 가리키는 히브리어 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “견고한 피난처”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  english_pob_choice: cliff / crag
  chosen_korean: 절벽 / 바위
  alternatives_korean:
  - 바위
  - 낭떠러지
  - 암벽
  lexicon: HALOT
  rationale: 첫 번째 סֶלַע는 독수리의 서식처를 가리키는 높은 바위 절벽으로 보아 ‘절벽’이 자연스럽고, 뒤의 반복은 ‘바위’로 처리해 시적 병행과 반복을 살렸습니다.
- source_word: יִשְׁכֹּן
  english_pob_choice: dwells
  chosen_korean: 거하며
  alternatives_korean:
  - 살며
  - 머물며
  - 거주하며
  lexicon: HALOT
  rationale: שׁכן의 기본 의미인 ‘거하다/머물다’를 살리되, 시어로서의 격식을 유지하기 위해 ‘거하며’를 선택했습니다.
- source_word: וְיִתְלֹנָן
  english_pob_choice: and spends the night there
  chosen_korean: 그곳에서 밤을 보내며
  alternatives_korean:
  - 그곳에 머물며
  - 그곳에서 묵으며
  - 그곳에서 밤새며
  lexicon: HALOT
  rationale: לון/לין 계열의 ‘밤을 지내다’라는 시간적 뉘앙스를 분명히 하기 위해, 장소를 보충한 한국어 표현으로 옮겼습니다.
- source_word: שֶׁן סֶלַע
  english_pob_choice: the tooth of the crag
  chosen_korean: 바위의 뾰족한 끝
  alternatives_korean:
  - 바위의 이빨
  - 바위의 뾰족한 돌기
  - 바위의 날카로운 모서리
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지는 ‘이빨’이지만, 한국어에서 직역하면 의미가 거칠어질 수 있어, 본래의 날카로운 돌출부 이미지를 살리면서도 읽기 자연스러운 ‘뾰족한 끝’으로 옮겼습니다.
- source_word: וּמְצוּדָה
  english_pob_choice: the stronghold
  chosen_korean: 산성
  alternatives_korean:
  - 요새
  - 산성지
  - 강한 보루
  lexicon: HALOT
  rationale: מְצוּדָה는 견고한 피난처/요새를 뜻하므로, 절벽 위의 접근하기 어려운 지형을 자연스럽게 떠올리게 하는 ‘산성’이 문맥상 가장 적절합니다.
