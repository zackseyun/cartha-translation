  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׂחַ֣ק לְ֭/פַחַד וְ/לֹ֣א יֵחָ֑ת וְ/לֹֽא יָ֝שׁ֗וּב מִ/פְּנֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
  footnotes:
  - marker: a
    text: Or 'He mocks fear.' The Hebrew verb can carry a nuance of derision as well as laughter.
    reason: lexical_alternative
  - marker: b
    text: Or 'he does not retreat from the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 두려움을 비웃고 겁내지 않으며, 칼 앞에서 물러서지도 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려움을 조롱합니다.’ 히브리어 동사는 웃음과 조롱의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘칼에서 물러서지 않습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  english_pob_choice: laughs
  chosen_korean: 비웃고
  alternatives_korean:
  - 웃고
  - 조롱하고
  - 경멸하고
  lexicon: HALOT
  rationale: 말 그대로의 ‘웃다’보다 이 전투적 문맥에서는 두려움을 향한 담대함과 경멸의 뉘앙스를 함께 살리는 ‘비웃고’가 본문의 힘을 더 잘 드러냅니다.
- source_word: לְפַחַד
  english_pob_choice: at fear
  chosen_korean: 두려움을
  alternatives_korean:
  - 공포를
  - 무서움을
  - 전율을
  lexicon: HALOT
  rationale: לְפַחַד는 ‘두려움/공포’를 가리키므로, 한국어에서는 목적어처럼 자연스럽게 ‘두려움을 비웃고’로 옮겨 원문의 간결한 구조를 살렸습니다.
- source_word: יֵחָת
  english_pob_choice: is dismayed
  chosen_korean: 겁내지 않으며
  alternatives_korean:
  - 낙심하지 않으며
  - 두려워하지 않으며
  - 무너지지 않으며
  lexicon: HALOT
  rationale: נִפְעַל חתת는 ‘놀라 겁먹다, 움츠러들다, 기가 꺾이다’의 뜻이 있어, 여기서는 전투 상황의 심리적 위축을 드러내는 ‘겁내지 않으며’가 가장 자연스럽습니다.
- source_word: יָשׁוּב מִפְּנֵי חָרֶב
  english_pob_choice: does not turn back from the sword
  chosen_korean: 칼 앞에서 물러서지도 않습니다
  alternatives_korean:
  - 칼 앞에서 돌아서지도 않습니다
  - 칼을 보고 후퇴하지도 않습니다
  - 칼 앞에서 물러나지도 않습니다
  lexicon: HALOT
  rationale: מִפְּנֵי는 ‘~앞에서/맞서서’의 의미를 가지며, 군사적 맥락에서 ‘turn back’는 단순한 회귀보다 후퇴를 뜻하므로 ‘칼 앞에서 물러서지도 않습니다’가 직관적이고 원문에 충실합니다.
theological_decisions:
- issue: 전쟁 시적 묘사에서 말의 인격화 수준
  chosen_reading: 말의 용맹을 과장 없이 생생한 시어로 살려, 두려움과 칼 앞에서의 태도를 인간적 감정어로 옮겼습니다.
  alternative_readings:
  - 직역에 가까운 ‘웃습니다/낙심하지 않습니다’
  - 더 해석적인 ‘두려움을 조롱합니다/후퇴하지 않습니다’
  rationale: 본문은 전쟁 말의 담대함을 시적으로 묘사하므로, 지나친 평이화보다 원문의 긴장감과 이미지를 유지하는 번역이 적절합니다.
  doctrine_reference: 시적 묘사와 문학적 형상 유지
