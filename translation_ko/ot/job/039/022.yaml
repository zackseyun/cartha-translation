  source_fidelity: 핵심 번역은 히브리어의 세 병렬 진술을 충실히 반영합니다. 다만 יִשְׂחַק의 기본 비유인 ‘웃다’를 본문에서는 ‘비웃다’로 다소 강화했으므로, 대안을 각주로 유지하되 본문은 더 직접적인 표현으로 다듬는 편이 안전합니다. מִפְּנֵי חָרֶב는 적대적 위협 앞에서 물러서지 않는다는 뜻으로 ‘칼 앞에서’가 적절합니다.
  naturalness: ‘두려움을 웃고’는 한국어에서 부자연스러우므로 ‘두려움을 비웃고’는 자연스럽습니다. 문장 전체의 합쇼체와 시적 병렬은 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두어 적용 범위를 분명히 해야 합니다.
