source:
  edition: WLC
  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
  footnotes:
  - marker: a
    text: Or 'riches' for 'wealth' (חַיִל).
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says 'belly,' preserving the image of swallowed gain being forcibly expelled.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 재산을[a] 삼켰으나, 도로 토해 낼 것입니다. 하나님께서 그의 배에서[b] 그것을 몰아내실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַיִל은 여기서 ‘재산’이나 ‘부’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘배’라고 하여, 삼킨 재산이 강제로 배출되는 생생한 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  english_pob_choice: wealth
  chosen_korean: 재산
  alternatives_korean:
  - 부
  - 부유함
  - 부귀
  lexicon: HALOT
  rationale: 문맥상 의인이 아니라 악인이 불의하게 취한 물질적 축적을 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘재산’이 ‘wealth’의 의미를 잘 살립니다.
- source_word: בָּלַע
  english_pob_choice: swallowed
  chosen_korean: 삼켰지만
  alternatives_korean:
  - 삼켰는데
  - 집어삼켰지만
  - 먹어 치웠지만
  lexicon: HALOT
  rationale: ‘삼키다’는 원문의 구체적 섭취 이미지를 그대로 유지하며, 뒤의 ‘토해 내다’와 짝을 이루어 감각적 대조를 형성합니다.
- source_word: וַיְקִאֶנּוּ
  english_pob_choice: but he will vomit it up
  chosen_korean: 다시 토해 낼 것입니다
  alternatives_korean:
  - 토해 낼 것입니다
  - 도로 뱉어 낼 것입니다
  - 다시 게워 낼 것입니다
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘토하다/게우다’이므로 이를 직접 살리고, 앞에서 삼킨 것을 되돌려 내는 반전은 ‘다시’로 자연스럽게 드러냈습니다.
- source_word: מִבִּטְנֹו
  english_pob_choice: out of his belly
  chosen_korean: 그의 배에서
  alternatives_korean:
  - 그의 배 속에서
  - 그의 창자에서
  - 그의 속에서
  lexicon: HALOT
  rationale: 히브리어 בֶּטֶן의 신체적 이미지를 살리되 한국어에서 가장 자연스러운 표현은 ‘배’입니다. 너무 해부학적인 ‘창자’보다 시적 대응이 좋습니다.
- source_word: יוֹרִשֶׁנּוּ
  english_pob_choice: will drive it out
  chosen_korean: 그것을 끌어내실 것입니다
  alternatives_korean:
  - 그것을 몰아내실 것입니다
  - 그것을 내쫓으실 것입니다
  - 그것을 빼앗아 가실 것입니다
  lexicon: HALOT
  rationale: 히필형의 인과적 ‘내보내다/몰아내다’ 의미를 반영하면서, 앞뒤의 신체적 은유와 잘 어울리게 ‘끌어내다’로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  - 하느님
  - 전능하신 하나님
  lexicon: HALOT
  rationale: אֵל은 여기서 하나님의 일반 호칭이므로 한국어 성서 표준에 맞게 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 악인의 재산 상실을 직접 일으키는 주체로 제시됨
  chosen_reading: 하나님께서 그 재산을 그의 배에서 끌어내시는 분으로 분명히 표현했습니다.
  alternative_readings:
  - 단순한 인과적 결과로 완곡하게 표현
  - 주어를 흐려 재앙의 자연스런 결과처럼 표현
  rationale: 히브리어는 אֵל을 분명한 주어로 두므로, 하나님의 적극적 심판 행위를 희석하지 않고 드러내는 것이 원문에 충실합니다.
  doctrine_reference: Original-language primacy; preserve explicit divine agency in judgment
