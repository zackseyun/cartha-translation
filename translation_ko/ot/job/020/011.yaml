base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
  footnotes:
  - marker: a
    text: Or 'His bones were full of his youth'; the Hebrew term can denote youth itself or the strength associated with youth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뼈는 젊음의 기력으로 가득하지만, 그 기력은 그와 함께 티끌 위에 누울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 뼈는 그의 젊음으로 가득하다.’ 히브리어 말은 젊음 자체 또는 젊음에서 오는 힘을 뜻할 수 있습니다. 또한 ‘누울 것입니다’의 주어는 히브리어에서 명시되지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  english_pob_choice: his bones
  chosen_korean: 그의 뼈
  alternatives_korean:
  - 그의 골격
  - 그의 몸뼈
  lexicon: HALOT
  rationale: 히브리어 עֶצֶם의 기본 뜻은 ‘뼈’이므로, 구체적이고 직설적인 이미지를 살려 옮겼습니다.
- source_word: מָלְאוּ
  english_pob_choice: were full of
  chosen_korean: 가득 찼으나
  alternatives_korean:
  - 가득 차 있었으나
  - 충만했으나
  lexicon: HALOT
  rationale: 완료형의 서술을 자연스러운 과거 진술로 살리되, 시적 병렬을 위해 ‘가득 찼으나’로 간결하게 표현했습니다.
- source_word: עֲלוּמָיו
  english_pob_choice: his youthful vigor
  chosen_korean: 젊음의 기력
  alternatives_korean:
  - 젊음
  - 젊은 시절의 힘
  - 청춘의 힘
  lexicon: HALOT
  rationale: 해당 어근은 단순한 나이보다 젊은 시절의 힘과 생기까지 포함할 수 있으므로, 영어 POB의 판단을 따라 ‘기력’으로 구체화했습니다.
- source_word: עַל־עָפָר תִּשְׁכָּב
  english_pob_choice: it will lie down in the dust
  chosen_korean: 그것은 … 흙에 눕게 될 것입니다
  alternatives_korean:
  - 그것은 … 먼지 속에 눕게 될 것입니다
  - 그것은 … 티끌 속에 누울 것입니다
  lexicon: HALOT
  rationale: ‘dust’를 한국어 관용에만 기대지 않고 ‘흙’으로 옮겨 죽음/매장 이미지를 직접 드러냈고, 동사 שׁכב의 ‘눕다’를 유지했습니다.
theological_decisions:
- issue: 무생물적/추상적 주어의 인칭 처리
  chosen_reading: ‘젊음의 기력’을 앞의 여성형/집합적 개념으로 보고 대명사 ‘그것’을 유지했습니다.
  alternative_readings:
  - ‘그는 그와 함께 눕게 될 것입니다’처럼 인칭 주어로 흡수
  - ‘그 기력은 그와 함께 흙에 묻히게 될 것입니다’처럼 의역
  rationale: 히브리어는 앞선 추상명사를 뒤따르는 동사 주어로 삼아 시적 대구를 만들고 있으므로, 그 긴장을 풀어 인격화하지 않고 유지했습니다.
  doctrine_reference: 시적 의인화와 추상명사 주어 처리
