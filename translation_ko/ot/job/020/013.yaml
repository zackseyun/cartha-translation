lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  english_pob_choice: He spares it
  chosen_korean: 그는 그것을 아끼고
  alternatives_korean:
  - 그는 그것을 불쌍히 여기고
  - 그는 그것을 아깝게 여기고
  - 그는 그것을 남겨 두고
  lexicon: HALOT
  rationale: חמל은 일반적으로 ‘불쌍히 여기다/아끼다/사면하다’의 뜻이지만, 여기서는 악을 달콤한 것으로 붙드는 문맥이므로 ‘아끼고’가 감정적 애착과 보유의 뉘앙스를 함께 살립니다.
- source_word: לֹא יַעַזְבֶנָּה
  english_pob_choice: does not let it go
  chosen_korean: 놓아주지 않으며
  alternatives_korean:
  - 버리지 않으며
  - 떠나보내지 않으며
  - 내버려두지 않으며
  lexicon: HALOT
  rationale: עזב는 ‘떠나다/버리다/내버려두다’가 가능하지만, 이 시적 비유에서는 손에서 놓지 않는 적극적 거부가 핵심이므로 ‘놓아주지 않으며’가 가장 자연스럽고 구체적입니다.
- source_word: יִמְנָעֶנָּה בְּתוֹךְ חִכּוֹ
  english_pob_choice: holds it in his mouth
  chosen_korean: 입 안에 간직합니다
  alternatives_korean:
  - 입천장에 둡니다
  - 입 안에 둡니다
  - 입천장 안에 간직합니다
  lexicon: HALOT
  rationale: חך는 문자적으로 ‘입천장/구개’이지만, 한국어에서는 ‘입 안에 간직합니다’가 원문의 맛을 보존하면서도 과도하게 해부학적이지 않은 표현입니다. POB의 ‘in his mouth’도 이 자연스러운 방향을 지지합니다.
theological_decisions:
- issue: 악을 단맛처럼 붙들고 버리지 않는 비유의 유지
  chosen_reading: 원문이 그리는 ‘악을 입 안의 단것처럼 오래 머금는’ 이미지를 직접적으로 살렸습니다.
  alternative_readings:
  - ‘좋아하여 붙든다’처럼 심리화하는 번역
  - ‘삼키지 않고 숨긴다’처럼 의미를 과도하게 확장하는 번역
  rationale: 문맥상 단순한 소유가 아니라 감각적으로 음미하며 놓지 않는 태도이므로, 표현을 완화하지 않고 보존하는 것이 해석상 더 정직합니다.
  doctrine_reference: 시적 수사와 문맥 기반 의미 보존
