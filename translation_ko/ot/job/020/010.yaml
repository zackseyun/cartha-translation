  text: 그의 아들들은 가난한 이들의 호의를 구할 것이며[a], 그의 손은 그의 재산을[b] 돌려줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들은 가난한 이들을 달래려 할 것입니다’; 히브리어 동사는 ‘호의를 구하다’ 또는 잘못을 당한 이들을 ‘달래다, 회유하다’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 소유물을’ 또는 ‘그의 힘을’; 히브리어 명사는 재산, 소유물, 또는 힘을 가리킬 수 있으나, 여기서는 문맥상 ‘재산’이 가장 알맞습니다.
    reason: lexical_alternative
