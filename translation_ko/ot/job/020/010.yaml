  lexicon: HALOT
  rationale: 이 동사는 여기서 단순한 부탁보다 관계 회복을 위한 ‘호의를 구함/환심을 삼’의 뉘앙스가 강하므로, 현대 한국어로는 이 표현이 가장 자연스럽습니다.
- source_word: דַלִּים
  english_pob_choice: the poor
  chosen_korean: 가난한 사람들
  alternatives_korean:
