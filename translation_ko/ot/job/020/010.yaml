  text: בָּ֭נָי/ו יְרַצּ֣וּ דַלִּ֑ים וְ֝/יָדָ֗י/ו תָּשֵׁ֥בְנָה אוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
  footnotes:
  - marker: a
    text: Or 'His sons will appease the poor'; the Hebrew verb can carry the sense of seeking favor or placating those who were wronged.
    reason: lexical_alternative
  - marker: b
    text: Or 'his hands will restore his substance' or 'his vigor'; the Hebrew noun can refer to wealth, possessions, or strength, though 'wealth' best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들은 가난한 사람들의 환심을 사려 할 것이며, 그의 손은 자기 재산을 돌려줄 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들은 가난한 사람들을 달래려 할 것입니다’; 히브리어 동사는 ‘호의를 구하다’와 ‘달래다/회유하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 손은 그의 재산을 돌려줄 것입니다’ 혹은 ‘그의 손은 그의 힘을 돌려줄 것입니다’; 히브리어 명사는 재산, 소유, 힘을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형에 3인칭 남성 단수 접미사가 붙어 있어, 성별이 드러나는 ‘아들들’이 원문에 더 가깝습니다.
- source_word: יְרַצּוּ
  english_pob_choice: will seek the favor of
  chosen_korean: 환심을 사려 할 것입니다
  alternatives_korean:
