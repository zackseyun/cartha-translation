  - 빈곤한 사람들
  - 궁핍한 사람들
  lexicon: HALOT
  rationale: 문맥상 사회적으로 약하고 궁핍한 사람들을 가리키므로, 가장 직관적인 ‘가난한 사람들’로 옮겼습니다.
- source_word: אוֹנוֹ
  english_pob_choice: his wealth
  chosen_korean: 자기 재산
  alternatives_korean:
  - 그의 재산
  - 그의 힘
  - 그의 소유
  lexicon: HALOT
  rationale: 이 명사는 ‘재산, 소유, 힘’의 범위를 가지지만, 여기서는 약자를 상대로 한 부의 상실과 보상 맥락이므로 ‘재산’이 가장 잘 맞습니다.
