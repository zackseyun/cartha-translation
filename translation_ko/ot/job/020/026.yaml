id: JOB.20.26
reference: Job 20:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
  footnotes:
  - marker: a
    text: Or 'All darkness is stored up for him'; the Hebrew phrase involving 'his hidden things/treasures' is difficult and may refer either to calamity reserved for him or to what is hidden among his stores.
    reason: alternative_reading
  - marker: b
    text: '''A fire not blown'' may mean a fire not kindled or fanned by human breath, implying a divinely sent or otherwise inextinguishable fire.'
    reason: lexical_alternative
  - marker: c
    text: Or 'it will harm the survivor in his tent' / 'it will consume the remnant in his tent.'
    reason: alternative_reading
translation:
  language: ko
  text: 온갖 어둠이 그가 숨겨 둔 것들을 위하여 쌓여 있습니다[a]. 사람이 불어 지피지 않은 불[b]이 그를 삼키고, 그의 장막에 남아 있는 것을 해칠 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온갖 어둠이 그를 위하여 쌓여 있다’; ‘그가 숨겨 둔 것들’에 해당하는 히브리어 표현은 어렵습니다. 이는 그에게 예비된 재앙을 가리킬 수도 있고, 그가 감추어 둔 저장물이나 보물을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘부채질하지 않은 불’. 이는 사람이 숨을 불어 지피지 않은 불을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 장막의 남은 자를 해칠 것입니다’ / ‘그의 장막에 남아 있는 것을 삼킬 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  english_pob_choice: All darkness
  chosen_korean: 온갖 어둠
  alternatives_korean:
  - 모든 어둠
  - 온통 어둠
  lexicon: HALOT
  rationale: כָּל의 포괄성과 חֹשֶׁךְ의 심판적 이미지를 살리되, 한국어에서는 ‘온갖 어둠’이 시적이면서도 축적된 재앙의 뉘앙스를 자연스럽게 전달합니다.
- source_word: טָמוּן לִצְפּוּנָיו
  english_pob_choice: is hidden up for his treasures
  chosen_korean: 그의 보물들[a]을 위해 감추어져 있습니다
  alternatives_korean:
  - 그의 숨겨진 것들을 위해 감추어져 있습니다
  - 그를 위하여 쌓여 있습니다
  lexicon: HALOT
  rationale: צפן 계열의 ‘감추다/쌓아 두다’와 소유격의 어려운 결합을 살려, ‘감추어져 있습니다’로 보관·예비의 뜻을 함께 담았습니다.
- source_word: לֹא נֻפָּח
  english_pob_choice: a fire not blown
  chosen_korean: 불어 넣지 않은 불
  alternatives_korean:
  - 부채질하지 않은 불
  - 사람의 숨결로 지피지 않은 불
  lexicon: HALOT
  rationale: נפח의 ‘불어 넣다/부채질하다’ 이미지를 직역에 가깝게 옮겨, 인간의 손이 닿지 않은 초자연적 심판의 불이라는 효과를 유지했습니다.
- source_word: יֵרַע שָׂרִיד
  english_pob_choice: it will feed on what remains
  chosen_korean: 그의 장막에 남은 것을 먹어 치울 것입니다[c]
  alternatives_korean:
  - 그의 장막에 남은 자를 해칠 것입니다
  - 그의 장막의 남은 것을 삼킬 것입니다
  lexicon: HALOT
  rationale: יֵרַע는 일반적으로 ‘악하다/해치다’의 뜻이지만, 불이 주어인 문맥에서는 파괴적 작용을 뜻하므로 한국어에서 ‘먹어 치우다’로 불의 이미지와 파괴성을 함께 살렸습니다.
theological_decisions:
- issue: 어둠/불의 심판 이미지 보존
  chosen_reading: ‘어둠’과 ‘불’의 이미지를 설명적으로 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 재앙
  - 환난
  - 심판의 불
  rationale: 본문은 욥기 문맥의 응보적 경고를 시적으로 압축합니다. 해석을 앞서기보다 원문 이미지가 독자에게 주는 긴장을 유지하는 것이 더 적절합니다.
  doctrine_reference: 욥기 20장 문맥의 시적 응보 진술
- issue: ‘그의 보물들’의 의미 불확실성
  chosen_reading: 본문의 중의성을 따라 ‘보물들’로 두고 각주로 대안을 제시했습니다.
  alternative_readings:
  - 숨겨둔 것들
  - 비축물
  - 감춘 것들
  rationale: 히브리어는 숨겨진 저장물/보물/예비된 것들 사이의 뜻이 겹칩니다. 단정적 해석으로 좁히지 않고 원문과 POB 각주를 반영했습니다.
  doctrine_reference: 히브리어 טָמוּן / צפון의 의미 범위
