    rationale: 문맥상 파괴를 뜻하지만, 이 동사는 ‘먹다/삼키다’가 아닙니다. 바로 앞의 ‘삼키고’와도 구별하여 ‘해칠 것입니다’가 원문에 더 충실합니다.
