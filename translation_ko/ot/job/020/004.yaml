  source_fidelity: 히브리어의 수사 의문문, 지속된 앎, 그리고 ‘사람이 땅 위에 놓인 때’로부터라는 시간 기점을 충실히 반영합니다. מִנִּי עַד와 מִנִּי שִׂים …의 병렬·동격적 시간 표현은 ‘곧’으로 자연스럽게 드러냈습니다.
  naturalness: 초안의 ‘…때부터 말입니다?’는 의문문 안에서 다소 설명조이고 시간 부사가 중복되어 어색합니다. 시간절을 앞에 두고 ‘곧 예로부터’로 연결하면 현대 표준 한국어 합쇼체로 더 자연스럽습니다.
  terminology: אָֽדָם의 일반적 단수 용법은 ‘사람’으로 유지했습니다. 원문의 עֲלֵי אָרֶץ는 ‘땅 위에’로 옮겨 위치 관계를 분명히 했습니다. 각주 표지는 대안이 적용되는 ‘사람’에 직접 붙였습니다.
  issues:
