lexical_decisions:
- source_word: הֲ/זֹאת
  english_pob_choice: this
  chosen_korean: 이것
  alternatives_korean:
  - 이 일
  - 그런 것
  lexicon: HALOT
  rationale: 지시대명사로 시작하는 수사 의문문이므로, 내용을 가리키는 중립적 표현인 「이것」이 가장 직접적입니다.
- source_word: יָדַעְתָּ
  english_pob_choice: have you known
  chosen_korean: 알고 계셨습니까
  alternatives_korean:
  - 알고 있었습니까
  - 아셨습니까
  lexicon: HALOT
  rationale: 현재완료형의 지속된 인지 상태를 한국어 의문으로 옮기되, 상대를 향한 직접 질문의 힘을 살리기 위해 「알고 계셨습니까」로 표현했습니다.
- source_word: מִנִּי עַד
  english_pob_choice: from of old
  chosen_korean: 예로부터
  alternatives_korean:
  - 옛적부터
  - 오래전부터
  lexicon: HALOT
  rationale: 원문의 오래된 기원을 가리키는 관용구로, 한국어에서는 간결하고 성경적 문맥에 자연스러운 「예로부터」가 적절합니다.
- source_word: מִנִּי שִׂים אָדָם
  english_pob_choice: since man was placed
  chosen_korean: 사람이 … 놓인 때부터
  alternatives_korean:
  - 사람이 … 세워진 때부터
  - 사람이 … 정해진 때부터
  lexicon: HALOT
  rationale: שׂים의 ‘두다/놓다’ 의미를 살려, אדם이 땅 위에 놓인 사건을 시간의 기점으로 표현했습니다. 영어 POB의 「was placed」와도 대응됩니다.
theological_decisions:
- issue: אָדָם의 보편적 인류 지칭을 어떻게 드러낼지
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 인간
  rationale: 히브리어는 단수형 אָדָם을 일반명사로 사용하므로, 대표적이고 성중립적인 한국어 「사람」이 원문의 일반적 인류 지칭을 가장 무리 없이 살립니다. 영어 POB의 footnote처럼 더 포괄적인 의미도 열어 둡니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
