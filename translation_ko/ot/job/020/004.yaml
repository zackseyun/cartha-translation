- from: 이것을 예로부터 알고 계셨습니까[a], 사람이 땅에 놓인 때부터 말입니다?
  to: 사람[a]이 땅 위에 놓인 때부터, 곧 예로부터 이것을 알고 계셨습니까?
  rationale: 원문의 두 시간 표현을 삭제하거나 하나로 축소하지 않고, ‘사람이 땅 위에 놓인 때부터, 곧 예로부터’로 자연스럽게 보존했습니다. 문장 끝의 설명조 표현을 제거하고, אדם의 대안적 일반 인류 지칭에만 각주가 걸리도록 표지를 이동했습니다.
