id: JOB.20.12
reference: Job 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם תַּמְתִּ֣יק בְּ/פִ֣י/ו רָעָ֑ה יַ֝כְחִידֶ֗/נָּה תַּ֣חַת לְשׁוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
  footnotes:
  - marker: a
    text: Or “If evil is sweet in his mouth.” The Hebrew particle can be read conditionally ('if') or concessively ('though'); the context favors a concessive sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 악이 그의 입에서 달콤할지라도, 그는 그것을 자기 혀 아래에 숨깁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “만일 악이 그의 입에서 달콤하다면, 그는 그것을 자기 혀 아래에 숨깁니다.” 히브리어 입자는 조건문(‘만일’)으로도, 양보문(‘비록’)으로도 읽을 수 있는데, 문맥상 양보로 보는 것이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Though
  chosen_korean: 비록 … 할지라도
  alternatives_korean:
  - 만일 … 한다면
  - 만약 … 이라면
  lexicon: HALOT
  rationale: 문맥상 단순 조건이 아니라 양보를 나타내므로, 한국어에서도 양보 연결 표현으로 자연스럽게 옮겼습니다.
- source_word: תַּמְתִּיק
  english_pob_choice: is sweet
  chosen_korean: 달콤할
  alternatives_korean:
  - 달게 할
  - 달게 느껴질
  lexicon: HALOT
  rationale: 히필형의 ‘달게 하다’보다, 여기서는 ‘악’이 주어가 되어 실제로 달게 여겨지는 상태를 나타내므로 상태 서술로 처리했습니다.
- source_word: יַכְחִידֶנָּה
  english_pob_choice: he hides it
  chosen_korean: 숨깁니다
  alternatives_korean:
  - 감춥니다
  - 은닉합니다
  lexicon: HALOT
  rationale: כחד의 핵심 의미인 ‘숨기다/감추다’를 살리되, 한국어에서는 간결하고 자연스러운 동사 ‘숨기다’를 선택했습니다.
theological_decisions:
- issue: 악을 즐기는 자의 내적 태도를 드러내는 비유를 어떻게 처리할지
  chosen_reading: ‘입에서 달콤하다’와 ‘혀 아래에 숨기다’를 직역에 가깝게 살려, 악을 음미하고 은밀히 간직하는 이미지를 보존했습니다.
  alternative_readings:
  - ‘악을 좋아한다’처럼 의미를 풀어 쓰는 방식
  - ‘악이 달다’로 축약하는 방식
  rationale: 이 절은 죄를 맛보듯 즐기고 숨겨 두는 혐오스러운 이미지를 통해 악인의 내면을 드러내므로, 이미지 자체를 유지하는 것이 본문의 힘을 가장 잘 전달합니다.
  doctrine_reference: 욥기 20:12의 지혜문학적 수사와 악인의 내적 왜곡 묘사
