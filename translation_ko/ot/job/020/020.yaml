  lexicon: HALOT
  rationale: מלט의 기본 의미는 ‘빠져나가다/피하다’이므로, 문맥상 소유물로 위기를 모면하지 못한다는 뜻을 살려 자연스러운 예측형으로 옮겼습니다.
- source_word: לֹא יָדַע
  english_pob_choice: he knew no
  chosen_korean: 알지 못하였고
