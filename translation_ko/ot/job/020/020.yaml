    text: 또는 ‘자기 배 속에서 편안함을 알지 못하였고; 자기가 기뻐하는 것으로도 자신을 구하지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו / בְּבִטְנוֹ
  english_pob_choice: quiet in his belly
  chosen_korean: 자기 배 속에서 평안을 알지 못하였고
  alternatives_korean:
  - 자기 배 속에서 고요함을 알지 못하였고
  - 자기 뱃속에서 편안함을 알지 못하였고
  lexicon: HALOT
  rationale: שָׁלֵו의 ‘quiet/ease’와 בֶּטֶן의 구체적 신체 이미지를 함께 살려, 내면의 안식이 아니라 몸 안의 불안까지 드러내는 표현으로 옮겼습니다.
- source_word: בַּחֲמוּדוֹ
  english_pob_choice: with his desirable things
  chosen_korean: 자기의 탐스러운 것들로도
  alternatives_korean:
  - 자기의 귀한 것들로도
  - 자기가 탐내는 것들로도
  - 자기의 보배로운 것들로도
  lexicon: HALOT
  rationale: חֲמוּדָה는 ‘탐스러운/바람직한 것’의 의미가 있어, 재물로 지나치게 좁히지 않으면서도 욕망의 대상을 드러내는 ‘탐스러운 것들’이 본문에 가깝습니다.
- source_word: לֹא יְמַלֵּט
  english_pob_choice: he will not escape
  chosen_korean: 피하지 못할 것입니다
  alternatives_korean:
  - 도망하지 못할 것입니다
  - 벗어나지 못할 것입니다
  - 구원받지 못할 것입니다
  lexicon: HALOT
  rationale: מלט의 기본 의미는 ‘빠져나가다/피하다’이므로, 문맥상 소유물로 위기를 모면하지 못한다는 뜻을 살려 자연스러운 예측형으로 옮겼습니다.
- source_word: לֹא יָדַע
  english_pob_choice: he knew no
  chosen_korean: 알지 못하였고
  alternatives_korean:
  - 알지 못했고
  - 알아 본 적도 없고
  lexicon: HALOT
  rationale: 히브리어의 부정된 완료형을 한국어 과거 서술로 받아, 이미 확정된 상태를 간결하게 표현했습니다.
theological_decisions:
- issue: 본문의 형상 언어(배 속, 탐스러운 것들)를 얼마나 직설적으로 옮길지
  chosen_reading: 직설적 신체·소유 이미지 그대로 유지해, 악인의 내적 불안과 소유물의 무력함을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘마음속에서 평안을 알지 못하였고’로 옮길 수 있음
  - ‘귀한 재물’로 구체화할 수 있음
  rationale: 지혜문학의 비유적 긴장을 약화시키지 않기 위해, 해석을 과도하게 심리화하거나 재물로 단정하지 않았습니다.
  doctrine_reference: 지혜문학의 시적 이미지와 악인의 심판 묘사
