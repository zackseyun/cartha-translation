  rationale: 지혜문학의 비유적 긴장을 약화시키지 않기 위해, 해석을 과도하게 심리화하거나 재물로 단정하지 않았습니다.
  doctrine_reference: 지혜문학의 시적 이미지와 악인의 심판 묘사
