  - 씻겨 내려갈
  - 쓸려갈
  lexicon: HALOT
  rationale: נגר의 ‘흘러가다/쏟아지다’ 이미지를 살려, 재산이 마치 물처럼 빠져나가는 느낌을 전달했습니다.
- source_word: בְּיוֹם אַפּוֹ
  english_pob_choice: in the day of his anger
  chosen_korean: 분노의 날에
  alternatives_korean:
