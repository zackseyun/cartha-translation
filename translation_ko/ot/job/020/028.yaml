theological_decisions:
- issue: ‘his anger’의 지시 대상
  chosen_reading: 본문의 모호성을 살려 ‘분노’로 두되, 한국어 본문에서는 하나님을 직접 보충하지 않았습니다.
  alternative_readings:
  - ‘그의 분노’
  - ‘하나님의 분노’
  rationale: 히브리어는 지시 대상을 명시하지 않으므로, 본문 자체의 긴장을 보존하는 것이 더 적절합니다. 문맥상 하나님의 심판을 암시하지만, 본문에는 그 대상을 덧붙이지 않았습니다.
  doctrine_reference: 문맥적 암시를 인정하되, 본문이 말하지 않은 주어를 확정하지 않음
