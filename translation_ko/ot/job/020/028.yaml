  - 끌려가고
  - 사로잡혀 가고
  lexicon: HALOT
  rationale: גלה의 제거·유배 뉘앙스를 한국어에서 직접 살리면서, 재화가 집에서 밀려나 사라지는 장면을 자연스럽게 나타냅니다.
- source_word: יְבוּל
  english_pob_choice: produce
  chosen_korean: 소산
  alternatives_korean:
