  text: יִ֭גֶל יְב֣וּל בֵּית֑/וֹ נִ֝גָּר֗וֹת בְּ/י֣וֹם אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
  footnotes:
  - marker: a
    text: Or 'will go into exile'; the verb can denote going away or being removed, here of the wealth or produce of the wicked man's house.
    reason: lexical_alternative
  - marker: b
    text: Likely referring to God's anger, though the Hebrew leaves the referent implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 집의 소산은 쫓겨나고, 분노의 날에 흘러가 버릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유배되어 갈 것이다’. 이 동사는 떠나가거나 옮겨지는 뜻을 띠며, 여기서는 악인의 집 소산이나 재산이 제거되는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 하나님의 분노를 가리키는 것으로 보이지만, 히브리어 본문은 그 지시 대상을 분명히 밝히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: יִגֶל
  english_pob_choice: will be carried away
  chosen_korean: 쫓겨나고
  alternatives_korean:
