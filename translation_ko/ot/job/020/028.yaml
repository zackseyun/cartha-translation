  rationale: 집이나 땅이 내는 산물이라는 뜻을 살리되, 재산 전체를 포괄할 수 있는 고전적이면서도 이해 가능한 표현을 선택했습니다.
- source_word: נִגָּרוֹת
  english_pob_choice: flowing away
