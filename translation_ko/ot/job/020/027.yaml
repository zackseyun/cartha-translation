source:
  edition: WLC
  text: יְגַלּ֣וּ שָׁמַ֣יִם עֲוֺנ֑/וֹ וְ֝/אֶ֗רֶץ מִתְקוֹמָ֘מָ֥ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
  footnotes:
  - marker: a
    text: Or 'his guilt'; the Hebrew word can denote either moral wrongdoing or the guilt attached to it.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land,' though 'the earth' better matches the parallel with 'the heavens' in this poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘들이 그의 죄악을 드러내고, 땅이 그를 거슬러 일어섭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄악’은 히브리어 עָוֹן이 문맥에 따라 ‘죄책’ 또는 그에 따른 ‘유죄성’을 뜻할 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘들’은 히브리어 복수형을 살린 표현입니다. 한국어에서는 단수 ‘하늘’도 가능하지만, 시적 장엄함과 병렬 구조를 위해 복수형을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  english_pob_choice: will reveal
  chosen_korean: 드러내고
  alternatives_korean:
  - 밝히고
  - 드러낼 것입니다
  lexicon: HALOT
  rationale: 시적 병렬에서 미래 의미를 현재형 서술로 자연스럽게 살리되, ‘드러내다’로 숨겨진 죄를 폭로하는 의미를 보존했습니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘이
  lexicon: HALOT
  rationale: 히브리어 복수형의 시적 장엄함을 살려 직역 성격을 유지하되, 한국어에서는 ‘하늘들’로 의인화된 우주 증인의 뉘앙스를 반영했습니다.
- source_word: עֲוֺנוֹ
  english_pob_choice: his iniquity
  chosen_korean: 그의 죄악
  alternatives_korean:
  - 그의 죄
  - 그의 죄책
  - 그의 악행
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 비뚤어짐과 유죄성을 함께 담기 위해 ‘죄악’을 택했고, 단순한 ‘죄’보다 더 무거운 책망의 의미를 유지했습니다.
- source_word: וְאֶרֶץ מִתְקוֹמָמָה לוֹ
  english_pob_choice: and the earth will rise up against him
  chosen_korean: 땅이 그를 거슬러 일어섭니다
  alternatives_korean:
  - 땅이 그에게 맞서 일어섭니다
  - 땅이 그를 대적하여 일어섭니다
  lexicon: HALOT
  rationale: לוֹ의 적대적 용법을 ‘거슬러’로 풀어, 단순한 ‘그에게’가 아니라 반대·적대의 방향성을 한국어 관용으로 드러냈습니다.
theological_decisions:
- issue: 우주적 증언의 의인화
  chosen_reading: 하늘들과 땅을 인격적 증인처럼 번역해, 죄가 우주 앞에 폭로되는 장면을 살렸습니다.
  alternative_readings:
  - 하늘과 땅이
  - 하늘이… 땅이…
  rationale: 본문의 시적 병렬과 법정적 고발 이미지를 약화시키지 않기 위해, 자연 현상을 단순 배경이 아니라 증언하는 주체로 유지했습니다.
  doctrine_reference: 시적 의인화 및 보응 사상
