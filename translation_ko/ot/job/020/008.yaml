translation:
  language: ko
  text: 그는 꿈처럼 날아가 아무도 그를 찾지 못하며[a], 밤의 환상처럼[b] 쫓겨납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 찾지 못하며.’ 히브리어는 주어를 특정하지 않는 복수 동사와 목적어 접미사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘밤에 보이는 환상처럼.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  english_pob_choice: Like a dream
  chosen_korean: 꿈같이
  alternatives_korean:
  - 꿈처럼
  - 꿈같은 듯이
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 직역의 느낌을 유지하면서, 현대 한국어에서 자연스러운 부사형으로 옮겼습니다.
- source_word: יָעוּף
  english_pob_choice: he flies away
  chosen_korean: 날아가
  alternatives_korean:
  - 날아갑니다
  - 사라집니다
  lexicon: HALOT
  rationale: ‘날다’의 동작 이미지를 살려, 단순한 소멸보다 급작스러운 사라짐을 보여 주는 표현으로 옮겼습니다.
- source_word: וְלֹא יִמְצָאֻהוּ
  english_pob_choice: and is not found
  chosen_korean: 사라져서 찾을 수 없고
  alternatives_korean:
  - 그를 찾지 못하고
  - 아무도 그를 찾지 못하고
  lexicon: HALOT
  rationale: 히브리어는 비인칭적 복수 표현이지만, 한국어에서는 결과 상태를 드러내는 수동적 의미가 자연스러워 ‘찾을 수 없다’로 처리했습니다.
- source_word: כְּחֶזְיוֹן לָיְלָה
  english_pob_choice: like a vision of the night
  chosen_korean: 밤의 환상처럼
  alternatives_korean:
  - 밤의 환상과 같이
  - 밤 환상처럼
  lexicon: HALOT
  rationale: חֶזְיוֹן의 ‘환상/계시적 환영’ 뉘앙스를 살리되, ‘밤의 환상’이라는 시적 결합을 간결하게 유지했습니다.
