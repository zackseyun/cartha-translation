  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
  footnotes:
  - marker: a
    text: Or 'and they do not find him.' The Hebrew uses an indefinite plural verb with object suffix.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a night vision.'
    reason: lexical_alternative
translation:
  language: ko
  text: 꿈같이 그는 날아가 사라져서 찾을 수 없고[b][a], 밤의 환상처럼 쫓겨납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어를 특정하지 않는 복수 동사형으로도 읽을 수 있어, ‘그를 찾지 못하고’와 같은 능동 번역도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘밤의 환상처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  english_pob_choice: Like a dream
  chosen_korean: 꿈같이
  alternatives_korean:
