  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 직역의 느낌을 유지하면서, 현대 한국어에서 자연스러운 부사형으로 옮겼습니다.
- source_word: יָעוּף
  english_pob_choice: he flies away
  chosen_korean: 날아가
