  - 밤 환상처럼
  lexicon: HALOT
  rationale: חֶזְיוֹן의 ‘환상/계시적 환영’ 뉘앙스를 살리되, ‘밤의 환상’이라는 시적 결합을 간결하게 유지했습니다.
