id: JOB.20.23
reference: Job 20:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
  footnotes:
  - marker: a
    text: Or 'and rain it upon him as his food.' The final phrase is difficult; the Hebrew may connect the raining judgment more directly with his food rather than with the time of eating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 배를 채우려 할 때[a], 하나님께서는 자신의 진노의 불길을 그에게 보내시고, 그것을 그의 먹을거리로 그에게 비처럼 내리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 먹는 동안 그에게 비처럼 내리신다.’ 마지막 어구는 어렵습니다. 히브리어는 심판을 그의 먹을거리와 직접 연결할 수도 있고, 먹는 때에 심판이 내린다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִ֤י לְ/מַלֵּ֬א
  english_pob_choice: When he is about to fill
  chosen_korean: 그가 배를 채우려 할 때
  alternatives_korean:
  - 그가 배를 채우기 시작할 때
  - 그가 배를 가득 채우려 할 때
  - 그가 만족하려 할 때
  lexicon: HALOT
  rationale: יְהִי + לְמַלֵּא는 단순 미래보다 ‘채우려는 시점’의 상황을 여는 표현이므로, 한국어도 시간적 국면을 드러내는 말로 옮겼습니다.
- source_word: בִטְנ֗וֹ
  english_pob_choice: his belly
  chosen_korean: 배
  alternatives_korean:
  - 복부
  - 배속
  - 창자
  lexicon: HALOT
  rationale: 문맥상 탐식과 충족의 몸 이미지를 살리기 위해 ‘배’가 가장 자연스럽고 직설적입니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: the burning of his anger
  chosen_korean: 자기 진노의 불길
  alternatives_korean:
  - 그의 진노의 불타는 열기
  - 그의 분노의 뜨거움
  - 진노의 불꽃
  lexicon: HALOT
  rationale: 직역 구조를 유지하면서도, חֲרוֹן אַף의 불붙은 분노 이미지를 한국어에서 생생하게 드러내기 위해 ‘불길’을 택했습니다.
- source_word: וְיַמְטֵר
  english_pob_choice: and rain
  chosen_korean: 비처럼 내리십니다
  alternatives_korean:
  - 비를 내리십니다
  - 내리쳐 주십니다
  - 쏟아부으십니다
  lexicon: HALOT
  rationale: מטר의 ‘비 내리다’ 이미지를 유지하되, 한국어에서는 목적어를 자연스럽게 받아 ‘비처럼 내리다’로 풀어 폭력적 심판의 장면을 살렸습니다.
- source_word: בִּ/לְחוּמֽוֹ
  english_pob_choice: while he is eating / as his food
  chosen_korean: 그가 먹는 것 위에
  alternatives_korean:
  - 먹을거리로
  - 음식 위에
  - 먹는 중에
  lexicon: HALOT
  rationale: 이 어구는 해석이 어려워 ‘먹는 중에’와 ‘그의 먹을거리로’ 사이의 긴장이 있습니다. 본문 흐름을 해치지 않으면서도 음식과 심판의 충돌을 살리기 위해 중립적으로 처리했습니다.
theological_decisions:
- issue: 심판의 주체와 ‘그의 진노’의 지시 대상
  chosen_reading: 주체를 하나님으로 분명히 밝혔고, ‘자기 진노’는 하나님 자신의 진노로 이해했습니다.
  alternative_readings:
  - 주체를 암시적으로 두는 번역
  - 인칭을 덜 드러내는 수동적 번역
  rationale: 욥기 20장의 문맥은 악인에 대한 하나님의 보응이며, ‘그의 진노’의 소유격도 가장 자연스럽게 하나님을 가리킵니다. 한국어에서는 오해를 줄이기 위해 주체를 명시했습니다.
  doctrine_reference: Translation philosophy §1, §3
