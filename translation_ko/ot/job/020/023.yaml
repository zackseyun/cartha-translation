review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그 위에’는 히브리어 עָלֵימוֹ(문맥상 ‘그에게/그 위에,’ 즉 악인에게)를 먹을거리 쪽으로 잘못 연결합니다. 또한 בִּלְחוּמוֹ는 난해하지만, 본문에서는 ‘그의 먹을거리로/그의 음식 가운데’라는 연관을 보존하는 편이 ‘그가 먹는 것 위에’보다 원문에 가깝습니다.
  naturalness: 합쇼체와 문장 흐름은 대체로 자연스럽습니다. 다만 ‘그가 먹는 것 위에 그것을 비처럼 내리십니다’는 무엇이 무엇 위에 내리는지 지시 관계가 어색하고 의미가 뒤바뀔 수 있습니다. ‘그에게 … 비처럼 내리십니다’로 수혜/대상 관계를 분명히 하는 것이 자연스럽습니다.
  terminology: ‘배’, ‘진노’, ‘불길’은 문맥과 현대 표준어에 적절합니다. 하나님의 주체를 명시하는 것은 문맥상 가능하되, ‘자기 진노’보다 ‘자신의 진노’가 현대 공식 문체에서 더 자연스럽습니다.
  issues:
  - severity: high
    issue: עָלֵימוֹ의 대상이 ‘그 위에’로 옮겨져 먹을거리로 오해될 수 있습니다.
    rationale: 이 대명사는 문맥상 악인에게 내리는 심판의 대상입니다. 먹을거리 위에 비를 내린다는 뜻으로 고정하면 원문의 관계를 왜곡합니다.
  - severity: medium
    issue: 각주 대안문 ‘그의 먹을거리로 그 위에 내리신다’도 동일하게 ‘그 위에’의 지시 대상을 불명확하게 합니다.
    rationale: 난해한 בִּלְחוּמוֹ의 대안을 제시하더라도, 심판을 받는 대상이 악인임을 유지해야 합니다.
  revised_text: 그가 배를 채우려 할 때[a], 하나님께서는 자신의 진노의 불길을 그에게 보내시고, 그것을 그의 먹을거리로 그에게 비처럼 내리십니다.
  revised_footnotes:
