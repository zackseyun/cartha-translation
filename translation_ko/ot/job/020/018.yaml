id: JOB.20.18
reference: Job 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵשִׁ֣יב יָ֭גָע וְ/לֹ֣א יִבְלָ֑ע כְּ/חֵ֥יל תְּ֝מוּרָת֗/וֹ וְ/לֹ֣א יַעֲלֹֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
  footnotes:
  - marker: a
    text: Or 'He restores his toil and does not consume it; as for the wealth gained by exchange, he does not exult.' The Hebrew of the second line is compact and admits several closely related renderings.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 수고하여 얻은 것을 돌려주고 그것을 삼키지 않으며, 그가 교환하여 얻은 재물로는 기뻐하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 교환의 재물에 따라 그는 크게 기뻐하지 않는다’입니다. 히브리어 둘째 행은 매우 압축되어 있어, ‘그가 교환하여 얻은 재물로는 기뻐하지 않는다’ 또는 ‘그의 재물의 교환에 상응하여 기뻐하지 않는다’ 등으로 가깝게 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  english_pob_choice: gives back
  chosen_korean: 돌려주고
  alternatives_korean:
  - 되돌려주고
  - 돌려보내고
  - 갚고
  lexicon: HALOT
  rationale: 사역형 동사 שוב의 의미를 자연스럽게 살리면서, 악인이 얻은 것을 다시 내놓게 된다는 뜻을 한국어로 간결하게 드러냅니다.
- source_word: יָגָע
  english_pob_choice: what he labored for
  chosen_korean: 수고한 것
  alternatives_korean:
  - 노동의 열매
  - 수고의 대가
  - 애써 얻은 것
  lexicon: HALOT
  rationale: 여기서는 ‘수고/노력의 결과물’이라는 물질적 의미가 문맥에 맞으므로, 추상적 ‘수고’보다 결과를 드러내는 표현을 택했습니다.
- source_word: וְלֹא יִבְלָע
  english_pob_choice: and does not swallow it down
  chosen_korean: 그것을 삼키지 못하며
  alternatives_korean:
  - 그것을 삼키지 않으며
  - 그것을 소비하지 못하며
  - 그것을 누리지 못하며
  lexicon: HALOT
  rationale: בָּלַע의 직유를 살려 ‘삼키다’로 옮기되, 부정문이므로 ‘못하며’로 자연스럽게 처리했습니다.
- source_word: תְּמוּרָה
  english_pob_choice: exchange
  chosen_korean: 교환으로 얻은
  alternatives_korean:
  - 맞바꿈으로 얻은
  - 교환의
  - 대가로 받은
  lexicon: HALOT
  rationale: תְּמוּרָה의 핵심인 ‘교환/맞바꿈’ 의미를 유지하면서, 뒤의 재물과 연결되도록 한국어 문장을 매끈하게 만들었습니다.
- source_word: וְלֹא יַעֲלֹס
  english_pob_choice: does not rejoice
  chosen_korean: 즐거워하지 않습니다
  alternatives_korean:
  - 기뻐하지 않습니다
  - 환호하지 않습니다
  - 흥겹게 여기지 않습니다
  lexicon: HALOT
  rationale: עלס의 기본 뜻인 기쁨과 들뜸을 현대 한국어의 일반 독자에게 분명하게 전달하는 표현을 선택했습니다.
theological_decisions:
- issue: 두 번째 행의 압축된 히브리어 구조
  chosen_reading: ‘그의 교환으로 얻은 재물에 따라’로 옮겨, ‘교환’과 ‘재물’의 관계를 열어 둔 채 문맥상 악인의 부정한 획득물을 가리키게 했습니다.
  alternative_readings:
  - ‘그의 교환의 재물에 따라’
  - ‘교환으로 얻은 부에 따라’
  - ‘그의 재물의 대가에 따라’
  rationale: 히브리어는 매우 압축되어 있어 단일한 해석으로 과도하게 좁히지 않는 것이 좋습니다. POB의 주석처럼 ‘교환’이 무엇을 가리키든, 여기서는 결국 그가 얻은 부가 참된 즐거움이 되지 못한다는 점을 보존해야 합니다.
  doctrine_reference: 잠언적·지혜문학의 보응 관점, 문맥상 악인의 허무한 획득에 대한 묘사
