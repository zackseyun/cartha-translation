  source_fidelity: 첫 행의 ‘삼키지 못하며’는 히브리어 직설법 미완료형 יִבְלָע(‘삼키지 않으며/삼키지 않는다’)를 능력의 결핍으로 바꾸므로 수정이 필요합니다. 둘째 행은 כְּחֵיל תְּמוּרָתוֹ의 결속과 כְּ의 기능이 압축되어 있어, ‘교환으로 얻은 재물’이라는 해석은 가능하되 주석으로 대안을 보존하는 것이 적절합니다.
  naturalness: ‘그의 교환으로 얻은 재물에 따라 그는 즐거워하지 않습니다’는 한국어에서 ‘재물에 따라 즐거워하다’의 관계가 다소 부자연스럽습니다. 주어를 한 번만 제시하고 ‘재물로는 기뻐하지 않습니다’로 옮기면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘돌려주다’, ‘수고하여 얻은 것’, ‘삼키다’, ‘재물’, ‘기뻐하다’는 본문의 경제적·비유적 어휘와 지혜문학의 문체에 잘 맞습니다. עלס의 강한 기쁨의 뉘앙스는 ‘기뻐하다’와 주석의 ‘크게 기뻐하다’로 충분히 반영됩니다.
