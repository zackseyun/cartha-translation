  source_fidelity: 현 번역은 꿀과 엉긴 젖이 흐르는 대상으로서의 ‘시내들’을 반복하고, 히브리어의 병렬 명사(물줄기/강/시내)를 어순상 불명확하게 처리했습니다. 세 병렬 수로 이미지를 모두 명료하게 보존할 필요가 있습니다. אַל + 미완료형은 이 문맥에서 악인이 풍요를 보거나 누리지 못한다는 미래의 결과 진술로 옮기는 것이 적절합니다.
  naturalness: ‘시내들과 … 강들, 시내들을’은 중복 및 수식 범위의 혼란 때문에 자연스럽지 않습니다. ‘꿀과 엉긴 젖이 흐르는 물줄기와 강과 시내’를 한 병렬구조로 제시하면 현대 표준 한국어로 자연스럽습니다.
  terminology: נַחֲלֵי는 문맥상 ‘시내’로 옮길 수 있으나 ‘건천’이라는 지리적 대안도 가능하므로 각주에 보존했습니다. חֶמְאָה의 ‘엉긴 젖’은 고대 목축 산물의 이미지를 적절히 전달합니다. 시각 동사는 과도하게 함축적인 ‘바라보다’보다 원문의 기본 의미를 따르는 ‘보다’가 적합합니다.
