  text: אַל יֵ֥רֶא בִ/פְלַגּ֑וֹת נַהֲרֵ֥י נַ֝חֲלֵ֗י דְּבַ֣שׁ וְ/חֶמְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
  footnotes:
  - marker: a
    text: Or 'He will not see the channels, the rivers, the wadis of honey and curds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 시내들과 꿀과 엉긴 젖이 흐르는 강들, 시내들을 바라보지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 시내들, 곧 꿀과 엉긴 젖이 흐르는 강들과 건천들을 보지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל / יֵרֶא
  english_pob_choice: will not look upon
  chosen_korean: 바라보지 못할 것입니다
  alternatives_korean:
  - 보지 못할 것입니다
  - 쳐다보지 못할 것입니다
  lexicon: HALOT
  rationale: 부정과 미완료형의 결합을 미래적 부정으로 자연스럽게 옮기되, 단순 시각이 아니라 누리지 못하는 뉘앙스를 살리기 위해 ‘바라보다’를 택했습니다.
- source_word: בִּפְלַגּוֹת
  english_pob_choice: streams
  chosen_korean: 시내들
  alternatives_korean:
  - 물줄기들
  - 갈래진 물길들
  lexicon: HALOT
  rationale: פְּלַגּוֹת는 물줄기나 시내를 가리키므로, 현대 한국어에서 자연스럽고 이미지가 잘 살아나는 ‘시내들’로 옮겼습니다.
- source_word: נַהֲרֵי
  english_pob_choice: rivers
  chosen_korean: 강들
  alternatives_korean:
  - 하천들
  - 강물들
  lexicon: HALOT
  rationale: 히브리어의 복수 병렬을 살려 별도의 어휘층으로 ‘강들’을 두어 풍요의 이미지가 겹쳐지는 효과를 유지했습니다.
- source_word: נַחֲלֵי דְּבַשׁ וְחֶמְאָה
  english_pob_choice: the brooks flowing with honey and curds
  chosen_korean: 꿀과 엉긴 젖이 흐르는 시내들
  alternatives_korean:
  - 꿀과 엉긴 젖이 흐르는 개울들
  - 꿀과 버터가 흐르는 시내들
  lexicon: HALOT
  rationale: נַחֲלֵי는 건천/시내/개울의 범위를 가지지만, 문맥상 풍요의 상징이므로 ‘흐르는 시내들’로 풀어 영어 audit의 의미를 반영했습니다. חֶמְאָה는 ‘버터’보다 고대 목축 이미지에 더 가까운 ‘엉긴 젖’을 택했습니다.
theological_decisions:
- issue: 부정의 화자의 미래 진술을 금지문처럼 옮길지 여부
  chosen_reading: 예언적 금지문보다 결과 진술로 읽어 ‘~하지 못할 것입니다’라고 옮겼습니다.
  alternative_readings:
  - 그는 보지 못할 것입니다
  - 그가 보지 못하게 하소서
  rationale: אַל + 미완료형은 여기서 도덕적 금지보다 악인이 누릴 수 없는 상실을 말하므로, 독자가 본문 의도를 오해하지 않도록 결과 진술로 표현했습니다.
  doctrine_reference: 문맥상 악인의 운명에 대한 시적 진술
