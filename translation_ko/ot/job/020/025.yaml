id: JOB.20.25
reference: Job 20:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁלַף֮ וַ/יֵּצֵ֪א מִ/גֵּ֫וָ֥ה וּ֭/בָרָק מִֽ/מְּרֹרָת֥/וֹ יַהֲלֹ֗ךְ עָלָ֥י/ו אֵמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/025.yaml
  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
  footnotes:
  - marker: a
    text: Or 'the gleaming blade comes from his gallbladder'; the Hebrew uses vivid bodily imagery and may refer to the flashing weapon point as it emerges.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그것을 뽑아 내니, 그것이 그의 몸에서 나오고, 번쩍이는 칼끝[a]이 그의 쓸개에서 나오며, 공포가 그에게 닥칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 쓸개에서 번쩍이는 칼날이 나온다’로 옮길 수 있습니다. 히브리어는 생생한 신체 이미지를 사용하며, 무기의 번쩍이는 끝이 빠져나오는 장면을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  english_pob_choice: He pulls it out
  chosen_korean: 그것을 뽑아 내면
  alternatives_korean:
  - 그것을 끌어내면
  - 그것을 빼내면
  lexicon: HALOT
  rationale: 무기나 날붙이를 몸에서 '뽑아 내다/빼내다'는 의미를 살리되, 한국어에서 자연스러운 동작 표현을 택했습니다. 주어가 생략된 히브리어의 동작상도 반영했습니다.
- source_word: מִגֵּוָה
  english_pob_choice: from his body
  chosen_korean: 그의 몸에서
  alternatives_korean:
  - 그의 몸통에서
  - 그의 배에서
  lexicon: HALOT
  rationale: גֵּוָה는 몸/몸통을 가리키므로, 현대 한국어에서는 가장 분명한 '몸'으로 옮겼습니다. 해부학적으로 과도하게 특정하는 표현은 피했습니다.
- source_word: וּבָרָק
  english_pob_choice: a flashing point
  chosen_korean: 한 번쩍이는 칼끝
  alternatives_korean:
  - 번쩍이는 점
  - 번쩍이는 칼날
  lexicon: HALOT
  rationale: 문맥상 몸에서 빠져나오는 무기와 연결되는 시각적 이미지이므로, 단순한 '번쩍임'보다 무기의 끝을 드러내는 표현이 적절합니다. 영어 POB의 'flashing point'를 한국어에서 자연스럽게 구체화했습니다.
- source_word: מִמְּרֹרָתוֹ
  english_pob_choice: from his gall
  chosen_korean: 그의 쓸개에서
  alternatives_korean:
  - 그의 담낭에서
  - 그의 쓴 데에서
  lexicon: HALOT
  rationale: 이 구절은 신체적 상처의 맥락이므로, 추상적 '쓴맛/쓰라림'보다 해부학적 의미가 우선합니다. 한국어 성경 전통에서 '쓸개'가 이 비유를 전달하는 데 가장 압축적입니다.
- source_word: יַהֲלֹךְ עָלָיו אֵמִים
  english_pob_choice: terrors come upon him
  chosen_korean: 공포가 그에게 닥칩니다
  alternatives_korean:
  - 두려움이 그를 덮칩니다
  - 공포가 그 위에 임합니다
  lexicon: HALOT
  rationale: הלך + עליו는 '덮치다/닥치다/임하다'의 뉘앙스를 가지므로, 한국어에서는 순간적이고 압도적인 도래를 나타내는 '닥치다'를 택했습니다. אֵמִים의 복수적 강도는 집합명사적 '공포'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시각적·신체적 비유의 보존
  chosen_reading: '''한 번쩍이는 칼끝''과 ''그의 쓸개''를 유지해, 고통스럽고 적나라한 신체 이미지가 완화되지 않도록 했습니다.'
  alternative_readings:
  - 더 완곡한 '번쩍이는 무언가'
  - 해부학적으로 중립적인 '몸속'
  rationale: 이 절은 의도적으로 충격적인 신체적 비유를 사용하므로, 한국어에서도 그 긴장감과 잔혹성을 보존하는 것이 원문의 효과를 살립니다.
  doctrine_reference: 시적 지혜문학의 수사적 강도 보존
