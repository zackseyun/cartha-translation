id: JOB.20.21
reference: Job 20:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/021.yaml
  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
  footnotes:
  - marker: a
    text: Or, more formally, 'There was no survivor for his eating,' that is, nothing remained from what he consumed.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'will endure' is difficult; alternatives include 'will last' or, less likely here, 'will prosper.'
    reason: lexical_alternative
translation:
  language: ko
  text: 삼킬 것이 아무것도 남지 않았습니다[a]; 그러므로 그의 번영은 오래 지속되지 못할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘그의 먹을 것에 대해 도망쳐 남은 자가 없었다’는 뜻으로, 그가 삼킨 것 가운데 남은 것이 없다는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 의미가 어려워 ‘지속되지 않다’, ‘오래 가지 않다’ 또는 덜 가능하게는 ‘번영하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד לְאָכְלוֹ
  english_pob_choice: Nothing was left for him to devour
  chosen_korean: 삼킬 것이 아무것도 남지 않았습니다
  alternatives_korean:
  - 먹을 것이 아무것도 남지 않았습니다
  - 그의 먹이로 남은 것이 아무것도 없었습니다
  - 삼킬 대상이 하나도 남지 않았습니다
  lexicon: HALOT
  rationale: אֵין의 부정 존재문과 שָׂרִיד+לְאָכְלוֹ의 의미를 함께 살려, 단순히 ‘남지 않았다’보다 ‘삼킬 것이’라고 풀어 본문의 포식적 이미지를 드러냈습니다.
- source_word: לְאָכְלוֹ
  english_pob_choice: for him to devour / his devouring
  chosen_korean: 삼킬 것이
  alternatives_korean:
  - 먹을 것이
  - 그가 삼킬 몫
  - 그의 먹어 치움
  lexicon: HALOT
  rationale: לְ+부정사구의 목적/귀결 의미를 자연스럽게 옮기되, 욥기의 문맥상 탐욕적 섭취를 나타내므로 ‘삼킬’로 번역했습니다.
- source_word: טוּבוֹ
  english_pob_choice: his prosperity
  chosen_korean: 그의 번영
  alternatives_korean:
  - 그의 좋은 것
  - 그의 재산
  - 그의 복리
  lexicon: HALOT
  rationale: 직역하면 ‘그의 טוב’이지만, 문맥상 악인의 형통과 재물의 지속성을 가리키므로 한국어로는 ‘번영’이 가장 자연스럽고 의미를 보존합니다.
- source_word: יָחִיל
  english_pob_choice: will endure
  chosen_korean: 오래 지속되지 못할 것입니다
  alternatives_korean:
  - 지속되지 않을 것입니다
  - 계속되지 않을 것입니다
  - 견디지 못할 것입니다
  lexicon: HALOT
  rationale: 의미가 어려운 동사이므로, POB의 ‘will endure’ 취지를 따라 지속성의 부정으로 옮겨 장래 형통이 이어지지 못함을 표현했습니다.
theological_decisions:
- issue: 악인의 형통이 영속하지 않는다는 결말 표현
  chosen_reading: ‘그의 번영은 오래 지속되지 못할 것입니다’로 번역해, 단순한 상실이 아니라 심판 아래서의 종말적 비지속성을 드러냈습니다.
  alternative_readings:
  - ‘그의 번영은 계속되지 않을 것입니다’
  - ‘그의 좋은 것은 오래 가지 않을 것입니다’
  rationale: 본문은 도덕적 경고와 심판의 결론을 이끄는 표현이므로, 형통의 일시성과 붕괴를 분명하게 드러내는 쪽이 원문의 힘을 잘 살립니다.
  doctrine_reference: 잠언적/지혜문학의 보응 구조
