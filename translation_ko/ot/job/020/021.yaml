translation:
  language: ko
  text: 그가 먹어 치울 것이 하나도 남지 않았습니다[a]. 그러므로 그의 번영은 오래 지속되지 못할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘그의 먹음에 남은 자가 없었다.’ 여기서 ‘남은 자’는 그가 먹어 치운 것 가운데 남은 것이 없었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사의 의미는 불확실합니다. ‘지속되지 않다’, ‘오래가지 않다’로 이해할 수 있으며, 덜 가능하게는 ‘번영하다’로 이해하기도 합니다.
    reason: lexical_alternative
