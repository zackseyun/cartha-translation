  text: יִ֭בְרַח מִ/נֵּ֣שֶׁק בַּרְזֶ֑ל תַּ֝חְלְפֵ֗/הוּ קֶ֣שֶׁת נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/024.yaml
  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
  footnotes:
  - marker: a
    text: Or 'an iron weapon.' The Hebrew נשק can denote weaponry more broadly.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a bow of bronze will pass through him.' The Hebrew verb may be rendered more formally as 'pass through him'; 'pierce him through' expresses the likely sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 철 무기를 피해 달아나겠고, 청동 활이 그를 꿰뚫을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘철 무기’로 옮겼습니다. 히브리어 נשק은 여기서 특정 무기 한 종류보다 무기류를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘청동 활이 그를 통과할 것입니다’입니다. 히브리어 동사는 문맥상 ‘그를 꿰뚫다’라는 뜻을 드러내는 것이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  english_pob_choice: he will flee
  chosen_korean: 도망하겠고
  alternatives_korean:
  - 달아나겠고
  - 도망칠 것입니다
  lexicon: HALOT
  rationale: 시적 문맥에서 ברח의 미래적 의미를 살려 장차 일어날 도피를 나타냈습니다.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  english_pob_choice: from an iron weapon
  chosen_korean: 철 무기에서
  alternatives_korean:
  - 철로 된 무기에서
  - 철병기에서
  - 쇠 무기에서
  lexicon: HALOT
  rationale: נשק을 넓은 의미의 무기류로 보고, בַּרְזֶל을 직역해 재질을 드러내되 자연스러운 현대 한국어로 옮겼습니다.
- source_word: תַּחְלְפֵהוּ
  english_pob_choice: will pierce him through
  chosen_korean: 그를 꿰뚫을 것입니다
  alternatives_korean:
  - 그를 관통할 것입니다
  - 그를 지나칠 것입니다
  lexicon: HALOT
  rationale: 문맥상 활에서 나온 화살이 그를 관통하는 뜻이므로, 단순한 ‘지나감’보다 결과를 분명히 하는 ‘꿰뚫다’를 택했습니다.
- source_word: נְחוּשָׁה
