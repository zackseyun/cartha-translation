  chosen_korean: 청동
  alternatives_korean:
  - 놋
  - 구리 합금
  lexicon: HALOT
  rationale: 고대 무기 이미지에서 נחושה는 청동이 가장 자연스러운 대응어이므로 표준적 역사어를 사용했습니다.
