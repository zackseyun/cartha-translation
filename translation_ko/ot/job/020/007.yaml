  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּֽ֭/גֶלֲל/וֹ לָ/נֶ֣צַח יֹאבֵ֑ד רֹ֝אָ֗י/ו יֹאמְר֥וּ אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
  footnotes:
  - marker: a
    text: Or, 'Like his own refuse' or 'Like his own excrement, he will perish forever.' The Hebrew uses a deliberately humiliating image.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 배설물처럼 그는 영원히 사라질 것이니, 그를 보던 자들이 말하기를 「어디 있느냐?」 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 오물처럼’, ‘그의 배설물처럼’. 히브리어는 의도적으로 모욕적인 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  english_pob_choice: Like his own dung
  chosen_korean: 자기 배설물처럼
  alternatives_korean:
  - 자기 똥처럼
  - 자기 오물처럼
  - 자기 배설물 같아서
  lexicon: HALOT
  rationale: גֶּלֶל은 문자적으로 배설물/오물을 가리킬 수 있으므로, 한국어에서는 직설적이되 품위를 과도하게 떨어뜨리지 않는 「배설물」이 원문의 모욕적 이미지를 가장 분명하게 드러냅니다.
- source_word: לָנֶצַח
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: נֶצַח의 지속적·영속적 의미를 한국어에서 가장 자연스럽게 담는 표준어 표현은 「영원히」입니다.
- source_word: יֹאבֵד
  english_pob_choice: he will perish
  chosen_korean: 사라질 것이니
  alternatives_korean:
  - 멸망할 것이니
  - 망할 것이니
  - 죽을 것이니
  lexicon: HALOT
  rationale: 문맥상 완전한 소멸과 굴욕적 소멸을 함께 드러내기 위해 「사라지다」를 택했으며, 시적 문맥에서 영어 POB의 perish가 주는 강한 소멸감을 전달합니다.
- source_word: רֹאָיו
  english_pob_choice: those who saw him
  chosen_korean: 그를 보던 자들이
  alternatives_korean:
  - 그를 본 사람들은
  - 그를 보았던 이들은
  - 그를 지켜보던 이들이
  lexicon: HALOT
  rationale: 분사형+접미사의 ‘그를 보던/본 자들’ 의미를 살리면서, בעבר의 명성과 몰락을 대비시키는 뉘앙스를 유지하기에 「그를 보던 자들」이 적절합니다.
- source_word: אַיּוֹ
  english_pob_choice: Where is he?
  chosen_korean: 어디 있느냐?
  alternatives_korean:
  - 어디 있습니까?
  - 그가 어디 있느냐?
  - 어디 갔느냐?
  lexicon: HALOT
  rationale: 위치 질문의 직접성을 살리기 위해 「어디 있느냐?」로 옮겼고, 인용문 내부의 짧고 냉랭한 조소를 보존합니다.
theological_decisions:
- issue: 극도로 굴욕적인 비유의 수위
  chosen_reading: כְּגֶלֲלוֹ를 완곡화하지 않고 배설물 이미지로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘오물처럼’으로 완화
  - ‘찌꺼기처럼’으로 순화
  rationale: 이 구절은 의도적으로 수치와 멸시를 극대화하는 판단적 비유이므로, 원문의 정서적 충격을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시적 심판 선언의 수사 보존
