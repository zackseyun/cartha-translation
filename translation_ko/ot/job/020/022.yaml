  rationale: sufficient/abundant의 의미를 담으면서 현대 한국어에서 자연스럽고 문맥상 부의 상태를 잘 드러내는 말로 선택했습니다.
- source_word: יֵצֶר לוֹ
  english_pob_choice: distress will come upon him
  chosen_korean: 그에게 환난이 닥칠 것이며
  alternatives_korean:
  - 그는 곤경에 처할 것이며
  - 그에게 압박이 올 것이며
