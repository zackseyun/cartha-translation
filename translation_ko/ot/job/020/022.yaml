  lexicon: HALOT
  rationale: 히브리어의 ‘좁아짐/압박’ 이미지를 직접 풀어 ‘닥치다’로 옮겨, 외부에서 불시에 덮치는 재앙의 뉘앙스를 살렸습니다.
- source_word: עָמֵל
  english_pob_choice: the miserable
  chosen_korean: 비참한 자
  alternatives_korean:
