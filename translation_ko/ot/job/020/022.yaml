  - 고생하는 자
  - 수고하는 자
  lexicon: HALOT
  rationale: 이 어휘는 단순한 노동자보다 고난·비참함에 놓인 사람을 가리키는 쪽이 문맥에 더 잘 맞으므로, POB의 선택을 따라 ‘비참한 자’로 옮겼습니다.
- source_word: תְּבוֹאֶנּוּ
  english_pob_choice: will come against him
  chosen_korean: 그에게 맞서 올 것입니다
  alternatives_korean:
