  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
  footnotes:
  - marker: a
    text: Or 'In the fullness of his sufficiency, he will be in distress.' The Hebrew is compact, and both the noun for prosperity ('sufficiency/abundance') and the verb for distress ('be in straits') admit slightly different English renderings.
    reason: lexical_alternative
  - marker: b
    text: '''Every hand of the afflicted'' may also be rendered ''every hand of the toiler'' or ''every hand of those in misery.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 풍족함의 한가운데서 그에게 환난이 닥칠 것이며, 비참한 자의 모든 손이 그에게 맞서 올 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍족함’은 POB 영어의 abundance를 따른 것으로, 히브리어의 sufficiency/abundance 폭을 현대 한국어에서 자연스럽게 압축한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비참한 자’는 POB의 miserable을 따른 번역이며, 본문은 단순한 노동자를 뜻한다기보다 고난 속에 있는 사람들을 가리키는 표현으로 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  english_pob_choice: In the fullness of
  chosen_korean: 한가운데서
