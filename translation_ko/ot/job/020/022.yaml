  - 그에게 이르게 될 것입니다
  lexicon: HALOT
  rationale: ‘오다’의 기본 의미를 유지하되, ‘모든 손’의 적대적 작용을 분명히 하기 위해 ‘맞서 오다’로 옮겼습니다.
theological_decisions:
- issue: 의인/악인에 대한 보응의 문맥에서 재난의 주체성 표현
  chosen_reading: 재난이 단순히 발생하는 것이 아니라 그를 향해 ‘닥치고’ ‘맞서 오게’ 된다고 옮겼습니다.
  alternative_readings:
  - 중립적으로 ‘그에게 올 것입니다’
  - 더 완곡하게 ‘그에게 이르게 될 것입니다’
  rationale: 히브리어의 압박·적대 이미지를 약화시키지 않기 위해, 문맥상 심판적·대적적 방향성을 분명히 유지했습니다.
  doctrine_reference: wisdom literature; divine retribution context
