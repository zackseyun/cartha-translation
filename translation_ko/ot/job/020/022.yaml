  lexicon: HALOT
  rationale: 시간·상황을 함께 드러내는 전치사적 표현으로, 문맥의 전환 지점을 자연스럽게 살리기 위해 ‘한가운데서’로 옮겼습니다.
- source_word: שִׂפְקוֹ
