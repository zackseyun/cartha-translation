  text: 그는 코브라들의 독[a][b]을 빱니다. 독사의 혀가 그를 죽입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֹאשׁ는 문자적으로 ‘머리’이지만, 여기서는 문맥상 ‘독’ 또는 ‘독액’을 뜻합니다.
