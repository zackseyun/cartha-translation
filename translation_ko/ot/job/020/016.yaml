source:
  edition: WLC
  text: רֹאשׁ פְּתָנִ֥ים יִינָ֑ק תַּֽ֝הַרְגֵ֗/הוּ לְשׁ֣וֹן אֶפְעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
  footnotes:
  - marker: a
    text: Or 'poison of cobras'; Hebrew 'head/poison of cobras,' with 'head' used idiomatically for venom in this context.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, 'asps' instead of 'cobras.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 뱀들의 독을 빨아들입니다. 독사의 혀가 그를 죽입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֹאשׁ는 여기서 ‘머리’가 아니라 문맥상 ‘독/독액’의 관용적 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: פְּתָנִים은 전통적으로 ‘아스프들’로도 옮기지만, 현대 독자에게는 ‘독사들’보다 ‘코브라들’이나 ‘뱀들’이 더 직관적일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: venom
  chosen_korean: 독
  alternatives_korean:
  - 독액
  - 독성
  - 머리
  lexicon: HALOT
  rationale: 히브리어 רֹאשׁ는 문자적으로는 ‘머리’이지만, 여기서는 코브라의 독을 뜻하는 관용적 용법으로 보이므로 한국어도 의미를 풀어 ‘독’으로 옮기는 것이 자연스럽습니다.
- source_word: פְּתָנִים
  english_pob_choice: cobras
  chosen_korean: 뱀들
  alternatives_korean:
  - 코브라들
  - 독사들
  - 아스프들
  lexicon: HALOT
  rationale: פֶּתֶן은 맥락상 맹독성 뱀을 가리키지만, 한국어에서 ‘코브라’는 종(species) 느낌이 강해 시적 일반성을 약화시킬 수 있어, 본절의 병행과 이미지에 맞게 ‘뱀들’로 넓게 옮겼습니다.
- source_word: יִינָק
  english_pob_choice: sucks
  chosen_korean: 빨아들입니다
  alternatives_korean:
  - 빱니다
  - 마십니다
  - 마셔들입니다
  lexicon: HALOT
  rationale: ינק의 ‘빨다/젖먹다’라는 동작성을 살리기 위해 ‘빨아들입니다’를 택해, 단순히 ‘마신다’보다 더 강한 신체적 이미지를 유지했습니다.
- source_word: לְשׁוֹן אֶפְעֶה
  english_pob_choice: the tongue of a viper
  chosen_korean: 독사의 혀
  alternatives_korean:
  - 살무사의 혀
  - 독사의 이빨
  - 살무사의 침
  lexicon: HALOT
  rationale: 히브리어는 실제로 ‘혀’를 말하므로, 해석적 치환인 ‘이빨’보다 직역적 이미지를 살린 ‘혀’를 유지했습니다. אֶפְעֶה는 현대 한국어에서 통용성이 높은 ‘독사’로 옮겼습니다.
