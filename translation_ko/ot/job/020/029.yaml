reference: Job 20:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
  footnotes:
  - marker: a
    text: Or "the inheritance of his word from God"; the Hebrew term can be read more literally as "his word/utterance," but here it likely refers to what God has spoken or decreed for him.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 하나님께서 악인에게 정하신 몫이며, 전능하신 분께서 그에게 정해 주신 유산입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하여 ‘그의 말[말씀/선언]의 유산’이라고 할 수 있습니다. 히브리어 אִמְרוֹ는 문자적으로 ‘그의 말/발언’을 뜻할 수 있으나, 여기서는 하나님께서 그에게 말씀으로 정하신 몫, 곧 그에게 정해진 결과를 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  english_pob_choice: This is
  chosen_korean: 이것은
  alternatives_korean:
  - 이것
  lexicon: HALOT
  rationale: 지시어로 시작하는 선언문이므로 한국어에서는 서술어를 자연스럽게 보완해 ‘이것은’으로 옮겼습니다.
- source_word: חֵלֶק
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 분깃
  - 배당
  lexicon: HALOT
  rationale: 여기서는 악인에게 돌아가는 배정된 결과를 가리키므로, 단순한 ‘부분’보다 분배·할당의 뉘앙스가 있는 ‘몫’이 적절합니다.
- source_word: אָדָם רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 사악한 사람
  - 악한 사람
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 일반표현이지만, 한국어에서는 관용적으로 ‘악인’이 간결하고 문맥의 법정적·지혜문학적 어조를 잘 살립니다.
- source_word: אִמְרוֹ
  english_pob_choice: decreed for him
  chosen_korean: 그에게 정해진
  alternatives_korean:
  - 그의 말
  - 그의 발언
  - 그에게 선포된
  lexicon: HALOT
  rationale: 직역하면 ‘그의 말/발언’이지만, 문맥상 하나님이 그에게 선고하신 몫과 평행을 이루므로 ‘정해진’으로 풀어 자연스럽게 옮겼습니다. 의미의 긴장도 살리기 위해 발언 가능성은 주석 없이 본문에서는 과도하게 드러내지 않았습니다.
- source_word: מֵאֵל
  english_pob_choice: from the Mighty One
  chosen_korean: 전능하신 분에게서
  alternatives_korean:
  - 전능자에게서
  - 엘에게서
  lexicon: HALOT
  rationale: 시적 변형으로서 אֵל의 의미를 살리되, 한국어 성경에서 널리 이해되는 신적 칭호 ‘전능하신 분’으로 옮겨 평행성을 유지했습니다.
theological_decisions:
- issue: אִמְרוֹ의 해석 범위
  chosen_reading: ‘그에게 정해진’으로 옮겨, 하나님이 악인에게 선고하신 배정이라는 의미를 본문에 반영했습니다.
  alternative_readings:
  - ‘그의 말’
  - ‘그의 발언’
  - ‘그에게 선포된’
  rationale: 문자적으로는 ‘말/발언’이 가능하지만, 여기서는 ‘몫/유산’과의 평행이 강하므로 결과·선고의 의미가 우세합니다. 다만 히브리어 어휘의 다의성은 번역문에서 과도하게 평탄화하지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy 3, 6
- issue: אָדָם רָשָׁע의 일반명사 처리
  chosen_reading: ‘악인’으로 일반적이고 대표적인 단수로 처리했습니다.
  alternative_readings:
  - ‘악한 사람’
  - ‘사악한 사람’
  rationale: 히브리어의 남성 단수는 대표적 일반화를 띠므로, 한국어에서도 성중립화보다 본문의 압축된 경구성을 살리는 표현을 택했습니다.
  doctrine_reference: Translation philosophy 4
