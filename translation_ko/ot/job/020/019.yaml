review_pass:
  verdict: revise
  source_fidelity: ‘다시 세우다’는 히브리어 בנה에 없는 ‘다시’의 의미를 더합니다. 본문은 그가 빼앗은 집을 ‘세우지 않을 것’이라고 할 뿐, 그 집이 이전에 파괴되었거나 재건 대상이었다고 명시하지 않습니다. 또한 כִּי의 이유·설명 기능을 한국어 본문에 드러내는 편이 좋습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘짓밟고 저버리다’는 폭력과 유기의 병렬을 유지하며, ‘빼앗은 집을 세우다’는 목적대명사의 지시 대상을 명료하게 합니다.
  terminology: דלים은 ‘가난한 사람들’, רצץ는 ‘짓밟다’, עזב는 ‘저버리다’, גזל은 ‘빼앗다’로 옮겨 원문의 폭력성과 사회적 취약성을 보존했습니다. ‘세우다’는 בנה의 건축 이미지를 보존하되 ‘재건’이라는 추가 의미를 피합니다.
  issues:
  - severity: medium
    issue: ‘다시 세우지 않을 것입니다’에 ‘다시’가 추가됨
    rationale: וְלֹא יִבֶנֵהוּ에는 재건을 뜻하는 접두 요소가 없습니다. 문맥상 ‘재건’으로 해석될 가능성은 있어도, 본문 번역에 이를 확정적으로 넣기보다 ‘세우다’로 두는 것이 안전합니다.
  - severity: low
    issue: 본문에서 כִּי의 설명적 기능이 명시되지 않음
    rationale: 이 절은 앞선 심판 진술의 근거를 제시하므로, ‘이는 … 때문입니다’로 연결하면 원문의 논리 관계가 드러납니다.
  revised_text: 이는 그가 가난한 사람들을 짓밟고 저버렸으며, 빼앗은 집을 세우지 않을 것이기 때문입니다[a]
