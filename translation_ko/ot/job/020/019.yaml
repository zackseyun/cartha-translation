  text: כִּֽי רִ֭צַּץ עָזַ֣ב דַּלִּ֑ים בַּ֥יִת גָּ֝זַ֗ל וְ/לֹ֣א יִבֶנֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
  footnotes:
  - marker: a
    text: Or 'Because he crushed and forsook the poor; he stole a house and will not rebuild it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가난한 사람들을 짓밟고 버렸습니다[a]; 집을 빼앗아 놓고는 다시 세우지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 가난한 사람들을 짓밟고 저버렸기 때문입니다; 집을 빼앗고는 다시 세우지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּץ
  english_pob_choice: has crushed
  chosen_korean: 짓밟고
  alternatives_korean:
  - 부수고
  - 압제하고
  lexicon: HALOT
  rationale: רצץ의 폭력적·물리적 이미지를 살리기 위해 추상적인 ‘압제하고’보다 ‘짓밟고’를 택했습니다.
- source_word: עָזַב דַּלִּים
  english_pob_choice: abandoned the poor
  chosen_korean: 가난한 사람들을 … 버렸습니다
  alternatives_korean:
  - 가난한 이들을 … 저버렸습니다
  - 가난한 자들을 … 버렸습니다
  lexicon: HALOT
  rationale: דלִּים은 사회적으로 취약한 이들을 가리키므로, 현대 한국어에서 가장 مستقیم하고 자연스러운 ‘가난한 사람들’로 옮겼습니다.
- source_word: גָּזַל בַּיִת
  english_pob_choice: has seized a house
  chosen_korean: 집을 빼앗아 놓고는
  alternatives_korean:
  - 집을 강탈해 놓고는
  - 집을 훔쳐 놓고는
  lexicon: HALOT
  rationale: גזל은 단순 취득이 아니라 강제로 빼앗는 행위이므로, 대상이 물건이 아니라 주거라는 점을 살려 ‘집을 빼앗아’로 번역했습니다.
- source_word: וְלֹא יִבֶנֵהוּ
  english_pob_choice: and will not build it up
  chosen_korean: 다시 세우지 않을 것입니다
  alternatives_korean:
  - 세우지 않을 것입니다
  - 복구하지 않을 것입니다
  lexicon: HALOT
  rationale: בנה는 여기서 빼앗은 집을 다시 세우거나 회복하는 뜻으로 읽히므로, 직역의 어색함을 피하면서도 재건의 이미지를 유지하는 ‘다시 세우지 않을 것입니다’를 택했습니다.
theological_decisions:
- issue: 시제와 선언적 톤
  chosen_reading: 현재 완료적 악행과 미래적 판결을 한국어에서 ‘-고 … 않을 것입니다’로 연결했습니다.
  alternative_readings:
  - -했습니다 … -하지 않을 것입니다
  - -해 왔습니다 … -하지 않을 것입니다
  rationale: 히브리어 완료형의 서술적 성격과 마지막 미래 부정의 대비를 살리면서, 욥기의 심판 진술처럼 단정적인 어조를 유지하기 위해서입니다.
  doctrine_reference: 시적 지혜문학의 보응/심판 진술
