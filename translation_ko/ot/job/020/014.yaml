id: JOB.20.14
reference: Job 20:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ֭חְמ/וֹ בְּ/מֵעָ֣י/ו נֶהְפָּ֑ךְ מְרוֹרַ֖ת פְּתָנִ֣ים בְּ/קִרְבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/014.yaml
  text: his food in his belly is turned[a]; it is the venom of cobras within him.
  footnotes:
  - marker: a
    text: Or 'his bread in his inward parts is turned; it is the gall of asps within him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 음식은 그의 뱃속에서 변하여, 그의 속에서는 코브라들의 독이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 빵은 그의 속에서 변하며, 그의 속에서는 아스프들의 쓸개즙이 됩니다.’
    reason: ‘음식’(빵), ‘뱃속’(속), ‘독’(쓸개즙), ‘코브라’(아스프)에 대한 어휘적 대안입니다.
lexical_decisions:
- source_word: לַחְמוֹ
  english_pob_choice: his food
  chosen_korean: 그의 음식
  alternatives_korean:
  - 그의 빵
  - 그의 양식
  lexicon: HALOT
  rationale: 문맥상 실제로 먹은 것이 배 속에서 변한다는 이미지이므로, 문자적인 ‘빵’보다 포괄적인 ‘음식’이 자연스럽고 원문 의도도 살립니다.
- source_word: בְּמֵעָיו
  english_pob_choice: in his belly
  chosen_korean: 그의 뱃속에서
  alternatives_korean:
  - 그의 내장 속에서
  - 그의 속에서
  - 그의 창자 속에서
  lexicon: HALOT
  rationale: 내장/창자라는 신체 이미지를 현대 한국어에서 가장 직관적으로 전달하는 표현으로 ‘뱃속’이 적절합니다.
- source_word: נֶהְפָּךְ
  english_pob_choice: is turned
  chosen_korean: 뒤집어지며
  alternatives_korean:
  - 바뀌며
  - 변하여
  - 전도되어
  lexicon: HALOT
  rationale: 상태가 안에서 다른 것으로 ‘뒤집히는’ 동적 이미지를 살리기 위해, 단순한 ‘변하다’보다 ‘뒤집어지다’가 원문의 은유를 더 잘 반영합니다.
- source_word: מְרוֹרַת פְּתָנִים
  english_pob_choice: the venom of cobras
  chosen_korean: 코브라의 독
  alternatives_korean:
  - 독사들의 독
  - 뱀의 독
  - 아스프의 쓸개
  lexicon: HALOT
  rationale: 이 결합은 비유적 ‘쓴 것’보다 실제 독성 이미지를 가리키므로, POB의 ‘venom’ 판단에 따라 ‘독’으로 옮겼고 פְּתָנִים은 현대 독자가 알아보기 쉬운 ‘코브라’로 처리했습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: within him
  chosen_korean: 그 안의
  alternatives_korean:
  - 그의 속에 있는
  - 그의 중심에 있는
  - 그의 내면에 있는
  lexicon: HALOT
  rationale: 직전 구절과 이어지는 내부 위치를 간결하게 되살리기 위해 ‘그 안의’로 옮겼습니다.
theological_decisions:
- issue: 신체 내부의 파괴적 이미지와 직설성 유지
  chosen_reading: ‘뱃속’과 ‘독’의 직설적 표현을 유지해, 죄인의 내면 상태를 완화하지 않고 드러내는 쪽을 택했습니다.
  alternative_readings:
  - ‘배 속’이나 ‘속’처럼 완화된 표현
  - ‘쓴맛’ 중심의 비유적 번역
  rationale: 이 절은 음식이 독으로 바뀐다는 신체적·도덕적 붕괴의 이미지를 강조하므로, 전통적 완곡어보다 원문의 충격을 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 욥기 20장의 악인 심판 묘사
- issue: ‘코브라’ 표기의 현대화
  chosen_reading: פְּתָנִים을 ‘코브라’로 옮겨 현대 독자에게 즉시 독사 이미지를 전달했습니다.
  alternative_readings:
  - ‘아스프’
  - ‘독사’
  rationale: 히브리어의 독사 명칭을 현대 독자에게 분명하게 전달하면서도, 고대 이미지의 실재성을 약화하지 않는 번역입니다.
  doctrine_reference: 창조 세계의 실제 생물 이미지를 통한 시적 심판 진술
