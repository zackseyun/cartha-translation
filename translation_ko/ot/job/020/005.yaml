id: JOB.20.5
reference: Job 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
  footnotes:
  - marker: a
    text: Or 'the joy of the hypocrite lasts only a moment.' The Hebrew חָנֵף can mean 'hypocrite,' but here 'godless' better reflects the broader sense of an irreligious person in Job.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 악인들의 기쁨은 잠깐이며, 하나님을 두려워하지 않는 자의 즐거움은 한순간에 지나기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위선자의 즐거움은 한순간에 지나기 때문입니다.’ 히브리어 חָנֵף는 ‘위선자’를 뜻할 수 있지만, 여기서는 욥기의 넓은 문맥상 ‘하나님을 두려워하지 않는 자’가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִנְנַת רְשָׁעִים
  english_pob_choice: the rejoicing of the wicked
  chosen_korean: 악인들의 기쁨
  alternatives_korean:
  - 악인들의 환호
  - 악인들의 즐거운 외침
  lexicon: HALOT
  rationale: רִנְנַת는 기쁨의 소리나 환호를 가리키지만, 시적 평행 속에서 한국어로는 ‘기쁨’이 의미를 자연스럽게 살리면서 과도한 음성성을 피합니다.
- source_word: מִקָּרוֹב
  english_pob_choice: is brief
  chosen_korean: 잠깐
  alternatives_korean:
  - 가깝다
  - 짧다
  - 얼마 못 간다
  lexicon: HALOT
  rationale: 문맥상 공간적 ‘가까움’이 아니라 지속 시간의 짧음을 뜻하므로, ‘잠깐’으로 옮겨 ‘brief’의 시간적 의미를 반영했습니다.
- source_word: חָנֵף
  english_pob_choice: the godless
  chosen_korean: 하나님을 두려워하지 않는 자
  alternatives_korean:
  - 위선자
  - 경건하지 않은 자
  - 불경한 자
  lexicon: HALOT
  rationale: POB의 ‘godless’를 한국어로 풀어, 단순한 위선보다 하나님에 대한 불경과 무관심을 드러내는 넓은 의미를 살렸습니다.
- source_word: עֲדֵי רָגַע
  english_pob_choice: lasts only a moment
  chosen_korean: 한순간에 지나기
  alternatives_korean:
  - 순간만 지속되기
  - 잠깐뿐이기
  lexicon: HALOT
  rationale: עֲדֵי는 한계까지의 지속을, רָגַע는 아주 짧은 시간을 나타내므로, 한국어에서는 ‘한순간에 지나기’로 짧음과 소멸감을 함께 표현했습니다.
theological_decisions:
- issue: חָנֵף의 의미 범위
  chosen_reading: ‘하나님을 두려워하지 않는 자’로 옮겨, 단순한 외식보다 신앙적 무관심과 불경을 함께 드러냈습니다.
  alternative_readings:
  - ‘위선자’
  - ‘불경한 자’
  rationale: 욥기에서 חָנֵף는 때로 ‘위선자’로 번역되지만, 이 절에서는 악인과 평행을 이루며 종교적 실체가 없는 사람을 가리키는 넓은 의미가 더 적절합니다.
  doctrine_reference: 욥기 20:5의 평행법과 חָנֵף의 어휘 범위
- issue: 시적 평행을 살린 종결 방식
  chosen_reading: ‘…기 때문입니다’로 앞 절의 진술을 설명하는 결론형으로 정리했습니다.
  alternative_readings:
  - 단순 병렬형
  - 두 절을 완전히 분리한 형식
  rationale: כִּי의 설명적 기능을 살리면서, 한국어에서 자연스러운 문장 흐름과 히브리 시의 평행을 함께 유지하기 위한 선택입니다.
  doctrine_reference: 히브리 시문에서 כִּי의 인과/설명 기능
