  text: The eye that saw him will not see him again[a], and his place will no longer see him.
  footnotes:
  - marker: a
    text: Or 'The eye that gazed on him will not do so again.' The Hebrew uses the singular 'eye' poetically and personifies 'his place' in the second line.
