  yaml_path: translation/ot/job/020/009.yaml
  text: The eye that saw him will not see him again[a], and his place will no longer see him.
  footnotes:
  - marker: a
    text: Or 'The eye that gazed on him will not do so again.' The Hebrew uses the singular 'eye' poetically and personifies 'his place' in the second line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 보던 눈은 다시 그를 보지 못하고, 그의 자리도 그를 다시 바라보지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 보던 눈’은 히브리어의 단수 ‘눈’을 시적으로 의인화한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘그의 자리도 그를 다시 바라보지 못합니다’는 원문의 의인화된 병행법을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: עַיִן
  english_pob_choice: The eye
  chosen_korean: 눈
  alternatives_korean:
  - 그 눈
  - 한 눈
  lexicon: HALOT
  rationale: 히브리어 단수 ‘눈’을 시적으로 유지하되, 한국어에서는 자연스럽게 ‘눈’으로 옮겨 집합적·의인화된 효과를 살렸습니다.
- source_word: שְׁזָפַתּוּ
  english_pob_choice: that saw him
  chosen_korean: 그를 보던
  alternatives_korean:
  - 그를 본
  - 그를 바라보던
  lexicon: HALOT
  rationale: 동작의 지속적·서술적 뉘앙스를 살리기 위해 ‘보던’을 택했고, POB의 ‘saw/ gazed’ 계열 의미를 반영했습니다.
- source_word: וְלֹא תוֹסִיף
  english_pob_choice: will not see him again
  chosen_korean: 다시 그를 보지 못하고
  alternatives_korean:
  - 그를 다시 보지 못하고
  - 더는 그를 보지 못하고
  lexicon: HALOT
  rationale: ‘다시/더는’으로 ‘더 이상 ~하지 않다’의 부정을 자연스럽게 풀되, 반복의 소멸이라는 원뜻을 유지했습니다.
- source_word: מְקוֹמוֹ
  english_pob_choice: his place
  chosen_korean: 그의 자리
  alternatives_korean:
  - 그의 장소
  - 그가 있던 곳
  lexicon: HALOT
  rationale: 직역하면 ‘그의 자리/장소’이며, 원문의 의인화를 살리기 위해 ‘자리’를 택해 그곳이 그를 ‘바라본다’는 표현을 유지했습니다.
