  - marker: b
    text: ‘그의 자리도 더 이상 그를 보지 못할 것입니다’는 그가 있던 곳을 그를 보는 주체처럼 표현한 원문의 의인화를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: עַיִן
  english_pob_choice: The eye
  chosen_korean: 눈
  alternatives_korean:
  - 그 눈
  - 한 눈
  lexicon: HALOT
  rationale: 히브리어 단수 ‘눈’을 시적으로 유지하되, 한국어에서는 자연스럽게 ‘눈’으로 옮겨 집합적·의인화된 효과를 살렸습니다.
- source_word: שְׁזָפַתּוּ
  english_pob_choice: that saw him
