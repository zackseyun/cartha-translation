  text: 그를 본 눈은 다시는 그를 보지 못할 것이며, 그의 자리도 더 이상 그를 보지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 본 눈’은 히브리어의 단수 ‘눈’을 시적으로 사용한 표현입니다.
