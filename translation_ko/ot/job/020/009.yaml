  lexicon: HALOT
  rationale: ‘다시/더는’으로 ‘더 이상 ~하지 않다’의 부정을 자연스럽게 풀되, 반복의 소멸이라는 원뜻을 유지했습니다.
- source_word: מְקוֹמוֹ
  english_pob_choice: his place
  chosen_korean: 그의 자리
  alternatives_korean:
