    rationale: 각주는 ‘손자들’이 문자적으로 ‘아들들의 아들들’이라는 점을 설명하므로 해당 낱말 바로 뒤에 두는 것이 적절합니다.
  revised_text: 그 후 욥은 백사십 년을 더 살았고, 그의 아들들과 손자들[a], 곧 네 세대에 이르는 자손을 보았습니다.
