  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “lived to see his sons and his grandsons.” The Hebrew reads more literally, “saw his sons and his sons’ sons.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후 욥은 백사십 년을 더 살았고, 그의 아들들과 손자들[a], 곧 네 세대에 이르는 자손을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘그의 아들들과 그의 아들들의 아들들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 더 살았고
  alternatives_korean:
  - 살았고
  - 살아갔고
  - 계속 살았고
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol of חיה는 단순 생존이 아니라 그 이후의 지속된 생애를 나타내므로, 한국어에서는 자연스러운 ‘더 살았고’로 옮겨 계속된 생애를 드러냈습니다.
- source_word: אַחֲרֵי זֹאת
  english_pob_choice: After this
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일 후에
  - 그 뒤에
  - 이후에
  lexicon: HALOT
  rationale: 이 관용구는 앞선 사건 뒤의 시간 순서를 표시하므로, 간결하고 자연스러운 ‘그 후에’가 적합합니다.
- source_word: בָּנָיו וְאֶת בְּנֵי בָנָיו
  english_pob_choice: his sons and his sons’ sons
  chosen_korean: 자기 아들들과 자기 손자들
  alternatives_korean:
  - 자기 아들들과 자기 아들들의 아들들
  - 자기 아들과 손자들
  - 자기 자손들
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그의 아들들 그리고 그의 아들들의 아들들’이지만, 한국어에서는 의미를 그대로 살리면서도 자연스럽게 들리는 ‘손자들’이 가장 적절합니다.
- source_word: אַרְבָּעָה דֹּרוֹת
  english_pob_choice: four generations
  chosen_korean: 사 대에 이르렀습니다
  alternatives_korean:
  - 네 세대를 보았습니다
  - 사 대를 보았습니다
  - 네 대를 보았습니다
  lexicon: HALOT
  rationale: 문맥상 욥이 자신의 후손의 넓이를 보았다는 뜻이므로, 결과를 풀어 주는 ‘사 대에 이르렀습니다’가 본문의 의미를 잘 전달합니다.
theological_decisions:
- issue: ‘saw his sons and his grandsons, four generations’의 의미를 직역할지, 결과를 풀어 자연화할지
  chosen_reading: ‘보고, 사 대에 이르렀습니다’로 옮겨 후손을 실제로 보았다는 점과 세대의 범위를 함께 드러냈습니다.
  alternative_readings:
  - ‘자기 아들들과 자기 손자들을, 사 대를 보았습니다’
  - ‘자기 아들들과 자기 손자들을 보았습니다, 사 대까지’
  rationale: 히브리어는 문자적으로 ‘그의 아들들, 그의 아들들의 아들들, 네 세대’를 말하지만, 한국어에서는 욥이 네 세대의 후손을 보았다는 종결적 의미를 자연스럽게 전달하는 편이 더 분명합니다.
  doctrine_reference: 서술의 의미 보존과 자연스러운 목표 언어 표현 원칙
