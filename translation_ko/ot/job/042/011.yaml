  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
  footnotes:
  - marker: a
    text: Or 'all his former acquaintances.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ate bread,' a common expression for sharing a meal.
    reason: cultural_note
  - marker: c
    text: The Hebrew term qesitah refers to an ancient unit or piece of value; its exact equivalent is uncertain.
    reason: cultural_note
  - marker: d
    text: Or 'one gold nose-ring'; the Hebrew word can refer to a ring worn in the nose or ear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그의 형제들과 누이들, 그리고 전에 그를 알던 모든 사람이[a] 그에게 와서 그의 집에서 그와 함께 빵을 먹었습니다.[b] 그들은 그를 동정하고, 야훼께서 그에게 닥치게 하신 모든 재앙 때문에 그를 위로하였습니다. 그리고 각 사람이 그에게 케시타 한 개[c]와 금고리 하나[d]를 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 옛 지인들’.
    reason: lexical_alternative
  - marker: b
    text: ‘빵을 먹다’는 함께 식사한다는 흔한 히브리어 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 케시타는 고대의 화폐 또는 가치 단위로, 정확한 현대 대응값은 확정하기 어렵습니다.
    reason: cultural_note
  - marker: d
    text: 히브리어 נֶזֶם은 코나 귀에 끼는 고리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  english_pob_choice: all his brothers, all his sisters
  chosen_korean: 그의 형제들과 누이들
  alternatives_korean:
  - 그의 남자 형제들과 여자 형제들
  - 그의 형제자매들
  lexicon: HALOT
  rationale: 히브리어의 남성형·여성형 반복을 자연스럽게 살리면서도, 한국어에서는 ‘형제자매들’보다 구체적인 대구가 유지되도록 옮겼습니다.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  english_pob_choice: and all who had known him before
  chosen_korean: 그리고 전에 그를 알던 모든 사람
  alternatives_korean:
  - 그리고 그의 옛 지인들
  - 그리고 예전에 그를 알던 모든 사람들
  lexicon: HALOT
  rationale: יֹדְעָיו의 ‘알던 사람들’과 לְפָנִים의 ‘이전/예전’이라는 시간 표지를 함께 드러냈습니다.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  english_pob_choice: they ate bread with him
  chosen_korean: 그의 집에서 그와 함께 빵을 먹었습니다
  alternatives_korean:
  - 그와 함께 식사했습니다
  - 그의 집에서 그와 함께 떡을 먹었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘빵을 먹다’를 너무 평이하게 풀지 않으면서도, 현대 한국어 독자에게 자연스럽게 들리도록 직역성을 유지했습니다.
- source_word: עַל כָּל הָרָעָה אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  english_pob_choice: for all the calamity that Yahweh had brought upon him
  chosen_korean: 야훼께서 그에게 가져오신 모든 재앙 때문에
  alternatives_korean:
  - 야훼께서 그에게 일으키신 모든 재난 때문에
  - 야훼께서 그에게 가져오신 모든 불행 때문에
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 실제로 닥친 재앙/불행이므로 ‘재앙’으로 옮겼고, הֵבִיא עַל의 직접적 귀속을 살렸습니다.
- source_word: וַיִּתְּנוּ ל֗וֹ אִישׁ קְשִׂיטָה אֶחָת וְאִישׁ נֶזֶם זָהָב אֶחָד
  english_pob_choice: And each one gave him one qesitah and one gold ring
  chosen_korean: 그리고 각 사람이 그에게 한 케시타와 한 금고리를 주었습니다
  alternatives_korean:
  - 그리고 각 사람이 그에게 한 케시타와 한 금반지를 주었습니다
  - 그리고 각 사람이 그에게 한 화폐 단위와 한 금고리를 주었습니다
  lexicon: HALOT
  rationale: קְשִׂיטָה는 정확한 금액이 불확실한 고대 가치 단위이므로 음역을 유지했고, נֶזֶם זָהָב은 특정 착용 부위를 단정하지 않고 ‘금고리’로 번역했습니다.
theological_decisions:
- issue: 야훼의 고난 부여에 대한 직접 귀속
  chosen_reading: 야훼께서 그에게 가져오신 모든 재앙
  alternative_readings:
  - 야훼께서 그에게 허락하신 모든 재앙
  - 야훼께서 그에게 닥치게 하신 모든 재앙
  rationale: 히브리어는 고난을 야훼가 ‘가져오신’ 것으로 직접 진술하므로, 이를 완화하지 않고 본문이 가진 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension; Job 42:11 source clause הֵבִיא יְהוָה עָלָיו'
- issue: 직설적 서술 속 감정 동사의 뉘앙스
  chosen_reading: 그들은 그를 동정하고, ... 그를 위로하였습니다
  alternative_readings:
  - 그들은 그에게 공감하고...
  - 그들은 그를 위로하고 동정하였습니다
  rationale: וַיָּנֻדוּ לוֹ는 동정/연민의 몸짓을 포함하므로, 단순한 감정보다 관계적 위로 행동을 드러내는 표현을 택했습니다.
  doctrine_reference: Lexical-pragmatic rendering of נוד + נחם in a lament/comfort context
