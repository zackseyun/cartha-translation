  source_fidelity: 수정이 필요합니다. 초안의 ‘내게 바르게 말하지 않았다’는 히브리어 אֵלַי의 문자적 방향을 보존하지만, 이 문맥에서는 하나님에 관하여 한 말의 내용이 평가되고 있으므로 본문은 ‘나에 대하여 옳게 말하지 않았다’가 더 정확합니다. 문자적 ‘내게’는 각주에서 보존합니다. 또한 첫 문장의 ‘그 일이 일어났습니다’는 뒤따르는 ‘뒤에’와 연결이 어색하고, 원문의 시간적 전환을 한국어 문장 안에서 자연스럽게 처리하는 편이 낫습니다.
  naturalness: ‘엘리바스를 향하여 말씀하셨습니다’보다 ‘엘리바스에게 말씀하셨습니다’가 현대 표준 한국어에 자연스럽습니다. 비교절은 ‘내 종 욥은 그렇게 말하였다’로 풀어, 원문의 대조를 분명하고 자연스럽게 나타냈습니다. 모든 발화는 현대 합쇼체로 유지했습니다.
  terminology: 신명은 프로젝트 기본값인 ‘야훼’를 유지했습니다. ‘내 종 욥’과 ‘데만 사람 엘리바스’도 보존했습니다. ‘분노가 타오릅니다’는 חָרָה אַפִּי의 생생한 관용 표현을 적절히 반영합니다.
