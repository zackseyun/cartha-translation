source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
  footnotes:
  - marker: a
    text: Or 'you have not spoken to me what is right, as my servant Job has.' The Hebrew preposition is literally 'to me,' but in context it likely means 'about me' or 'concerning me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 일어났습니다[a]. 야훼께서 욥에게 이 말씀들을 하신 뒤에, 야훼께서 데만 사람 엘리바스를 향하여 말씀하셨습니다. “내 분노가 너와 너의 두 친구에게 타오릅니다. 너희가 내게 바르게 말하지 않았기 때문입니다. 내 종 욥이 말한 것처럼 말하지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 내게 옳은 말을 하지 않았다, 내 종 욥처럼.’ 히브리어 전치사는 문자적으로 ‘내게(to me)’이지만, 문맥상 ‘내에 대하여/about me’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר
  english_pob_choice: And it happened, after
  chosen_korean: 그 일이 일어났습니다
  alternatives_korean:
  - 그리고 … 후에
  - 그 뒤에 일어났습니다
  lexicon: WLC/HALOT
  rationale: 서술 전환을 자연스러운 현대 한국어로 살리되, 히브리어의 이야기 도입 공식을 과도하게 풀지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default / WLC
  rationale: 프로젝트 기본값을 따라 신성명은 야훼로 옮겼습니다.
- source_word: חָרָה אַפִּי
  english_pob_choice: My anger burns
  chosen_korean: 내 분노가 타오릅니다
  alternatives_korean:
  - 내 분노가 불탑니다
  - 내 진노가 타오릅니다
  lexicon: HALOT
  rationale: ‘코/분노가 타오르다’라는 히브리어 관용을 살려, 하나님의 감정 상태를 완화하지 않고 한국어로도 생생하게 표현했습니다.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  english_pob_choice: against you and against your two friends
  chosen_korean: 너와 너의 두 친구에게
  alternatives_korean:
  - 너와 너의 두 친구를 향하여
  - 너와 너의 두 친구에게
  lexicon: HALOT
  rationale: 화가 누구를 향하는지 한국어 조사로 드러냈습니다. ‘대하여’보다 자연스럽고, ‘against’의 방향성을 유지합니다.
- source_word: אֵלַי נְכוֹנָה
  english_pob_choice: have not spoken rightly about me
  chosen_korean: 내게 바르게 말하지 않았습니다
  alternatives_korean:
  - 내게 옳게 말하지 않았습니다
  - 내게 바른 말을 하지 않았습니다
  lexicon: HALOT
  rationale: אֵלַי를 직역한 ‘내게’를 유지하되, 본문 문맥상 발화 내용의 정당성을 나타내는 ‘바르게’로 옮겼습니다. ‘나에 관하여’는 가능하지만 한국어에서는 덜 간결합니다.
- source_word: כְּעַבְדִּי אִיּוֹב
  english_pob_choice: as my servant Job has
  chosen_korean: 내 종 욥이 말한 것처럼
  alternatives_korean:
  - 내 종 욥처럼
  - 내 종 욥이 한 것처럼
  lexicon: HALOT
  rationale: 비교 구문을 한국어로 자연스럽게 풀면서, ‘내 종’이라는 중요한 칭호를 보존했습니다.
theological_decisions:
- issue: ‘내게’로 옮긴 אֵלַי의 의미 범위
  chosen_reading: 내게 바르게 말하지 않았습니다
  alternative_readings:
  - 내에 대하여 바르게 말하지 않았습니다
  - 내에 관하여 바르게 말하지 않았습니다
  rationale: 히브리어는 문자적으로 ‘to me’이지만, 문맥상 욥기 논쟁에서 하나님에 대한 발언의 내용이 문제입니다. 한국어에서는 ‘내게’가 가장 간결하면서도 그 대상을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 신적 분노 표현의 강도
  chosen_reading: 내 분노가 타오릅니다
  alternative_readings:
  - 내가 화가 났습니다
  - 내 진노가 일어납니다
  rationale: 원문의 관용어는 단순 감정 진술보다 더 강한 심판적 긴장을 담습니다. 이를 약화시키지 않도록 ‘타오릅니다’를 택했습니다.
  doctrine_reference: Translation philosophy §3
