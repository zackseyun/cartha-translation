translation:
  language: ko
  text: 그리고 온 땅[a] 어디에서도 욥의 딸들만큼 아름다운 여인들은 발견되지 않았습니다. 그들의 아버지는 그 딸들에게 그들의 형제들과 함께 유산을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온 세상에서”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹ֨א נִמְצָ֜א
  english_pob_choice: were found
  chosen_korean: 발견되지 않았습니다
  alternatives_korean:
  - 없었습니다
  - 찾아볼 수 없었습니다
  lexicon: HALOT
  rationale: נמצא의 수동 의미를 자연스러운 현대 한국어로 옮기되, 단순한 존재 부정보다 ‘발견되다’가 비교의 결과를 더 잘 드러냅니다.
- source_word: נָשִׁ֥ים יָפ֛וֹת
  english_pob_choice: women ... as beautiful
  chosen_korean: 아름다운 여인들
  alternatives_korean:
  - 아름다운 여자들
  - 아리따운 여인들
  lexicon: HALOT
  rationale: נָשִׁים은 여기서 일반적인 ‘여자들/여인들’로 이해하는 것이 자연스럽고, יפות는 외형적 아름다움을 가리켜 ‘아름다운’으로 옮겼습니다.
- source_word: בְּ/כָל הָ/אָ֑רֶץ
  english_pob_choice: in all the land
  chosen_korean: 이 땅 어디에서도
  alternatives_korean:
  - 온 땅에서
  - 그 땅 전체에서
  lexicon: HALOT
  rationale: הָאָרֶץ를 문맥상 ‘땅’으로 옮겨, 과장 없이도 최상급의 범위를 살리는 한국어 표현으로 다듬었습니다.
- source_word: וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶם
  english_pob_choice: their father gave them an inheritance among their brothers
  chosen_korean: 그들의 아버지는 자기 형제들 가운데서 그들에게도 유산을 주었습니다
  alternatives_korean:
  - 그들의 아버지는 형제들 사이에서 그들에게 상속분을 주었습니다
  - 그들의 아버지는 오빠들 가운데서 그들에게 몫을 주었습니다
  lexicon: HALOT
  rationale: נחלה는 ‘유산/상속 재산’의 뜻이므로 간결하게 ‘유산’으로 옮겼고, בְּתוֹךְ אֲחֵיהֶם은 남성 복수 ‘형제들’의 성별을 유지했습니다.
theological_decisions:
- issue: 딸들에게도 유산을 준다는 사회적·서사적 강조
  chosen_reading: 그들에게도 유산을 주었습니다
  alternative_readings:
  - 그들에게 유산을 주었습니다
  - 그들에게도 상속분을 주었습니다
  rationale: 본문은 딸들이 형제들과 함께 상속을 받았다는 이례적 장면을 강조하므로, ‘도’로 그 포괄성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
