  - severity: low
    issue: 각주 표지가 문장 끝에 놓여 대안어의 범위가 불분명합니다.
    rationale: 각주는 הָאָרֶץ(‘땅’)의 ‘earth’ 대안을 위한 것이므로 ‘땅’에 직접 붙이는 편이 정확합니다.
