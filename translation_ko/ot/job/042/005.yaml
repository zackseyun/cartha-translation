  text: לְ/שֵֽׁמַע אֹ֥זֶן שְׁמַעְתִּ֑י/ךָ וְ֝/עַתָּ֗ה עֵינִ֥/י רָאָֽתְ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
  footnotes:
  - marker: a
    text: Or 'by hearsay'; the Hebrew literally says 'by the hearing of the ear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전에 귀로만 당신에 대하여 들었지만, 이제는 제 눈이 당신을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘귀의 들음으로’입니다. 여기서는 ‘간접적으로 들은 바’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  english_pob_choice: by the hearing of the ear
  chosen_korean: 귀로만 들은 바
  alternatives_korean:
  - 귀의 들음으로
  - 귀가 듣는 것으로
  - 소문으로
  lexicon: HALOT
  rationale: 히브리어의 직역적 관용구를 살리면서도 한국어에서 자연스럽게 ‘간접적으로 들은 것’을 나타내도록 ‘귀로만 들은 바’로 옮겼습니다. 영어 POB의 직접-간접 대비도 유지합니다.
- source_word: שְׁמַעְתִּיךָ
  english_pob_choice: I had heard of you
  chosen_korean: 당신에 대하여 들었습니다
  alternatives_korean:
  - 당신을 들었습니다
  - 당신을 들어 보았습니다
  - 당신에 대해 들어 왔습니다
  lexicon: HALOT
  rationale: 2인칭 목적어를 그대로 ‘당신을’로 옮기면 한국어에서 어색하므로, 문맥상 ‘당신에 대하여’라는 간접 지식을 분명히 했습니다. 이는 영어 POB의 ‘heard of you’와 같은 의미입니다.
- source_word: וְעַתָּה
  english_pob_choice: but now
  chosen_korean: 하지만 이제는
  alternatives_korean:
  - 그리고 이제는
  - 이제는
  - 그런데 이제는
  lexicon: HALOT
  rationale: 앞선 간접적 지식과 뒤의 직접적 시각 사이의 강한 대조를 살리기 위해 역접을 분명히 했습니다.
- source_word: עֵינִי
  english_pob_choice: my eye
  chosen_korean: 제 눈이
  alternatives_korean:
  - 나의 눈이
  - 내 눈이
  - 눈이
  lexicon: HALOT
  rationale: 히브리어 단수형의 시적 표현을 한국어에서도 단수 감각이 드러나도록 ‘제 눈이’로 옮겼습니다. 너무 장중한 표현보다 본문의 개인적 고백을 자연스럽게 살립니다.
theological_decisions:
- issue: 하나님을 ‘보았다’는 표현의 처리
  chosen_reading: ‘보았습니다’로 직역해, 이전의 듣기와 지금의 보기 사이의 대비를 그대로 남겼습니다.
  alternative_readings:
  - 알아보았습니다
  - 직접 만났습니다
  - 체험했습니다
  rationale: 본문은 지식의 방식이 간접에서 직접으로 바뀌는 대조를 말하므로, 이를 해석적으로 완화하지 않았습니다. 시각적 표현 자체가 가진 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
