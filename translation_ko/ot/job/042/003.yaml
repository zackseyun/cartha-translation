id: JOB.42.3
reference: Job 42:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'Who is this who darkens counsel without knowledge?' Job's wording here differs from Job 38:2 in Hebrew.
    reason: lexical_alternative
  - marker: b
    text: Or 'things beyond me' or 'wonders beyond me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「지식도 없이 뜻을 감추는 자가 누구입니까?」[a] 그러므로 저는 깨닫지 못한 것을 말했습니다. 그것들은 제게 너무도 놀라운 일들, 곧 제가 알지 못했던 일들이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘지식도 없이 뜻을 어둡게 하는 자가 누구입니까?’로 옮기기도 합니다. 42:3의 히브리어는 38:2와 어휘가 다릅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 넘어서는 일들’ 또는 ‘내 능력에 지나친 놀라운 일들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְלִים
  english_pob_choice: hides
  chosen_korean: 가리는가
  alternatives_korean:
  - 숨기는가
  - 가리는 자가 누구인가
  - 은폐하는가
  lexicon: HALOT
  rationale: Hifil의 ‘감추다/숨기다’ 의미를 살리되, 한국어에서는 ‘지식 없이 조언을 가리는가’가 더 자연스럽고 책망의 뉘앙스도 유지합니다.
- source_word: עֵצָה
  english_pob_choice: counsel
  chosen_korean: 조언
  alternatives_korean:
  - 계획
  - 의논
  - 책략
  lexicon: HALOT
  rationale: 여기서는 하나님의 지혜로운 ‘상담/결의’의 뜻이므로, ‘조언’이 문맥상 가장 무난하게 대응합니다. 전통적인 ‘모략’은 현대어에서 너무 협소할 수 있습니다.
- source_word: בְּלִי דָעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이
  alternatives_korean:
  - 지식도 없이
  - 알지 못한 채
  - 깨달음 없이
  lexicon: HALOT
  rationale: ‘דעת’를 직접 반영해 ‘지식’으로 옮기고, 한국어 어순에서는 앞쪽에 붙여 ‘지식 없이’로 처리해 원문의 무지 비판을 분명히 했습니다.
- source_word: נִפְלָאוֹת מִמֶּנִּי
  english_pob_choice: things too wonderful for me
  chosen_korean: 내게는 너무 놀라운 일들
  alternatives_korean:
  - 내가 감당할 수 없는 놀라운 일들
  - 나를 넘는 놀라운 일들
  - 내게 지나치게 기이한 일들
  lexicon: HALOT
  rationale: ‘נפלאות’의 ‘놀라운/경이로운’ 의미를 살리되, ‘ממני’의 ‘나를 넘어서는’ 감각은 주석에 맡기고 본문은 자연스러운 합쇼체로 다듬었습니다.
- source_word: וְלֹא אֵדָע
  english_pob_choice: which I did not know
  chosen_korean: 내가 알지 못했던 일들입니다
  alternatives_korean:
  - 내가 알지 못했습니다
  - 내가 몰랐던 것들입니다
  - 내가 알 수 없었던 일들입니다
  lexicon: HALOT
  rationale: 마지막 절은 앞의 ‘일들’을 받는 관계절로 자연스럽게 이어지므로, 한국어에서는 ‘일들입니다’로 마무리해 문장 구조를 분명하게 했습니다.
theological_decisions:
- issue: Job 42:3의 첫 질문을 38:2의 전통적 표현과 맞출 것인지
  chosen_reading: 본문에 실제로 있는 ‘지식 없이 조언을 가리는가’를 따르고, 38:2의 전통적인 ‘캄캄하게 하는’ 표현으로 평준화하지 않았습니다.
  alternative_readings:
  - 지식 없이 조언을 캄캄하게 하는가
  - 지식 없이 조언을 어둡게 하는가
  rationale: 42:3은 38:2와 유사하지만 동일하지 않으므로, 히브리어 어휘 차이를 보존하는 것이 원문 우선 원칙에 더 충실합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
