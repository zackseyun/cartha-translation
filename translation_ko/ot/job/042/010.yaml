base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
  footnotes:
  - marker: a
    text: Or 'turned Job’s captivity' / 'turned Job’s fortunes.' The Hebrew idiom refers to restoring a person’s condition, not necessarily release from literal captivity.
    reason: lexical_alternative
  - marker: b
    text: Or 'on behalf of his friends.'
    reason: lexical_alternative
  - marker: c
    text: Or 'gave Job twice as much as he had before.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 욥이 친구들을 위해 기도할 때, 욥의 형편을 회복시키셨습니다.[a][b] 야훼께서는 욥에게 전에 있던 모든 것의 두 배를 주셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '욥의 포로 상태를 돌이키셨다' / '욥의 형편을 돌이키셨다'. 이 히브리어 관용구는 문자적 포로 해방이라기보다 사람의 처지나 상태를 회복시키는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 친구들을 위하여' / '그의 친구들을 대신하여'.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '욥에게 전에 있던 모든 것을 두 배로 더하셨습니다'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה / יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 표기
  rationale: 본문의 여호와성호를 기존 POB 기준에 따라 음역해, 원문 신명호를 가리고 일반 호칭으로 완화하지 않았습니다.
- source_word: שָׁב אֶת שבית
  english_pob_choice: restored Job’s fortunes
  chosen_korean: 욥의 형편을 회복해 주셨고
  alternatives_korean:
  - 욥의 포로 상태를 돌이키셨고
  - 욥의 번영을 회복해 주셨고
  - 욥의 운명을 되돌려 주셨고
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적 포로 석방보다 상태·형편의 회복을 뜻하므로, 자연스러운 한국어로 '형편을 회복하다'를 택했습니다.
- source_word: בְּהִתְפַּלְלוֹ בְּעַד רֵעֵהוּ
  english_pob_choice: when he prayed for his friends
  chosen_korean: 그의 친구들을 위해 기도할 때
  alternatives_korean:
  - 그의 친구들을 위하여 기도했을 때
  - 그의 친구들을 대신하여 기도할 때
  - 그의 친구들을 위해 중보할 때
  lexicon: HALOT
  rationale: בְּ + 부정사구의 시간적 용법을 따라 '…할 때'로 옮기고, בְּעַד는 중보적 '위해'의 뜻을 살려 직역 과장을 피했습니다.
- source_word: לְמִשְׁנֶה
  english_pob_choice: twice as much as he had before
  chosen_korean: 전보다 갑절이나 더해 주셨습니다
  alternatives_korean:
  - 두 배로 더해 주셨습니다
  - 전보다 두 배를 더 주셨습니다
  - 전보다 갑절을 주셨습니다
  lexicon: HALOT
  rationale: לְמִשְׁנֶה의 중복·배가 의미를 한국어 관용 표현 '갑절'로 살리되, 문맥상 결과를 분명히 하기 위해 '더해 주셨습니다'를 붙였습니다.
theological_decisions:
- issue: 욥의 기도와 야훼의 회복 사이의 관계
  chosen_reading: 시간적 연결을 드러내는 '기도할 때'로 옮기되, 보상 원리처럼 보이는 인과를 추가하지 않았습니다.
  alternative_readings:
  - 그가 기도했기 때문에
  - 그가 기도하는 동안
  rationale: 히브리어 בְּ + 부정사구는 시간·상황을 나타낼 수 있으므로, 본문이 말하는 연결은 유지하되 신학적 인과를 과도하게 규정하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고 기도의 중보성과 회복의 관계를 해석적으로 좁히지 않음.
