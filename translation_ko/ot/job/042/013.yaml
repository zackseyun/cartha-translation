  text: He also had seven sons and three daughters.
translation:
  language: ko
  text: 그에게도 일곱 아들과 세 딸이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ל֛וֹ
  english_pob_choice: He also had
  chosen_korean: 그에게도 ...이 있었습니다
  alternatives_korean:
  - 그가 ...을 두었습니다
  - 그에게 ...이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘וַיְהִי לוֹ’는 단순 서술보다 소유 관계를 나타내므로, 한국어에서는 ‘...이 있습니다’로 자연스럽게 풀어 옮겼습니다. ‘도’를 넣어 앞선 회복 서술의 연속성을 반영했습니다.
- source_word: שִׁבְעָנָה בָנִים
  english_pob_choice: seven sons
  chosen_korean: 일곱 아들
  alternatives_korean:
  - 일곱 아들들
  - 일곱 아들 자녀
  lexicon: HALOT
  rationale: 수사와 남성 자녀를 가리키는 명사를 그대로 살려 ‘일곱 아들’로 옮겼습니다. ‘자녀’로 중화하지 않아 원문의 성별 표지를 유지했습니다.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  english_pob_choice: and three daughters
  chosen_korean: 세 딸
  alternatives_korean:
  - 그리고 세 딸
  - 세 여자아이
  lexicon: HALOT
  rationale: 히브리어는 여성 자녀를 뜻하는 ‘딸들’을 사용하므로, 현대 한국어에서 가장 자연스러운 복수 표현인 ‘세 딸’로 옮겼습니다.
theological_decisions:
- issue: 회복 이후의 자녀 수를 단순 정보가 아니라 축복의 증거로 제시하는 서술의 톤
  chosen_reading: 직설적 서술을 유지하되, 앞선 문맥의 회복을 암시하는 ‘도’를 더해 이야기의 흐름을 살렸습니다.
  alternative_readings:
  - 그에게 일곱 아들과 세 딸이 있었습니다
  - 그에게도 일곱 아들과 세 딸이 있었습니다
  rationale: 본문은 설명이나 해설 없이 결과를 간명하게 기록합니다. 한국어에서도 과장하지 않고, 회복의 연속성을 최소한의 연결어로만 드러내는 것이 원문에 가깝습니다.
  doctrine_reference: 서술문맥의 보존
