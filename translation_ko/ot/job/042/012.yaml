  lexicon: HALOT
  rationale: אַחֲרִית를 ‘마지막’보다 범위가 넓은 ‘나중 형편’으로 옮겨, 단지 임종 시점이 아니라 이전과 대비되는 후반의 상태를 살렸습니다.
- source_word: צֶמֶד בָּקָר
