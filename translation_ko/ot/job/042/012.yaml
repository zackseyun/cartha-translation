base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the latter end of Job more than his beginning.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'a thousand pairs of cattle' or 'a thousand teams of oxen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 욥의 나중 형편에 처음보다 더 큰 복을 주셨습니다[a]. 그에게는 양 만사천 마리와 낙타 육천 마리, 소 천 겨리[b], 그리고 암나귀 천 마리가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘욥의 나중을 그의 시작보다 더 [복하셨다].’'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소 천 쌍’.
    reason: lexical_alternative
