  lexicon: HALOT
  rationale: צֶמֶד은 ‘멍에’ 아래 묶인 한 쌍/한 짝을 가리키므로, 농경적 관용을 살린 ‘소의 멍에 천 개’로 옮겼습니다.
- source_word: אֲתוֹנוֹת
  english_pob_choice: female donkeys
  chosen_korean: 암나귀
  alternatives_korean:
