  naturalness: ‘욥의 나중 형편을 처음보다 더 복 주셨습니다’는 비교의 대상과 ‘복 주다’의 결합이 다소 어색합니다. ‘나중 형편에 처음보다 더 큰 복을 주셨습니다’가 현대 표준어 합쇼체에서 자연스럽고 의미도 정확합니다.
  terminology: 신명은 프로젝트 결정 및 원문에 따라 ‘야훼’로 유지했습니다. ‘암나귀’는 אֲתוֹנוֹת의 성별을 적절히 보존합니다. צֶמֶד בָּקָר은 한국어 농경 단위인 ‘겨리’로 옮기는 것이 적합합니다.
