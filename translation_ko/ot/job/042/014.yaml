theological_decisions:
- issue: 고유명사 ‘Keren-happuch’의 의미를 본문에 풀어 쓸지 여부
  chosen_reading: 본문에는 음역만 두고, 의미적 투명성은 주석으로 처리했습니다.
  alternative_readings:
  - ‘뿔 화장용기’로 번역
  - ‘뿔 눈화장’으로 번역
  rationale: 이 표현은 사람 이름으로 기능하므로, 본문에서 번역해 버리면 이름의 고유성을 약화시킵니다. 의미 정보는 각주에서 보존하는 것이 원문 구조에 더 충실합니다.
  doctrine_reference: 고유명사 처리 원칙
