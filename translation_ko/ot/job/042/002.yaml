base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
  footnotes:
  - marker: a
    text: Or 'no plan of yours can be hindered.' The Hebrew noun can mean 'plan' or 'purpose,' and the verb can carry the sense of being withheld, prevented, or frustrated.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 알기로는, 주님께서는 모든 것을 하실 수 있고, 주님의 목적은 막을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 계획은 방해받을 수 없습니다.’ 히브리어 명사는 ‘계획’이나 ‘목적’이 될 수 있고, 동사는 ‘가로막히다, 저지되다, 좌절되다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  english_pob_choice: I know
  chosen_korean: 제가 알기로는
  alternatives_korean:
  - 저는 압니다
  - 알고 있습니다
  lexicon: HALOT
  rationale: 욥의 현재 고백을 자연스러운 현대 한국어로 살리되, 하나님께 직접 말하는 맥락의 확신을 담기 위해 ‘제가 알기로는’으로 옮겼습니다.
- source_word: כֹל תּוּכָל
  english_pob_choice: you can do all things
  chosen_korean: 주님께서는 모든 것을 하실 수 있고
  alternatives_korean:
  - 주님께서는 모든 일을 하실 수 있고
  - 주님께서는 모든 것을 하실 수 있습니다
  lexicon: HALOT
  rationale: ‘모든 것’의 포괄성을 유지하면서, 히브리어의 능력 진술을 한국어에서 자연스럽게 풀어 ‘하실 수 있고’로 옮겼습니다.
- source_word: יִבָּצֵר
  english_pob_choice: can be thwarted
  chosen_korean: 막을 수 없습니다
  alternatives_korean:
  - 좌절될 수 없습니다
  - 가로막힐 수 없습니다
  - 방해받을 수 없습니다
  lexicon: HALOT
  rationale: 문맥상 하나님의 의도가 좌절되거나 저지되지 않는다는 뜻이므로, ‘thwarted’의 동적 의미를 현대 한국어로 간결하게 재현했습니다.
- source_word: מְזִמָּה
  english_pob_choice: purpose
  chosen_korean: 목적
  alternatives_korean:
  - 계획
  - 뜻
  - 구상
  lexicon: HALOT
  rationale: 하나님께 대해 사용될 때 부정적 뉘앙스의 ‘계책/꾀’는 피하고, 의도와 목적을 자연스럽게 드러내는 ‘목적’을 택했습니다.
theological_decisions:
- issue: 하나님의 전능과 뜻의 불가항성 표현
  chosen_reading: 주님께서는 모든 것을 하실 수 있고, 주님의 목적은 막을 수 없습니다.
  alternative_readings:
  - 주님께서는 모든 일을 하실 수 있고, 주님의 계획은 방해받을 수 없습니다.
  - 주님께서는 모든 것을 하실 수 있고, 주님의 뜻은 좌절될 수 없습니다.
  rationale: 본문은 하나님의 능력의 전면성과 그 목적의 저지 불가능성을 함께 진술하므로, 이를 직접적이되 과장 없이 한국어로 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
