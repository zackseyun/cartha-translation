base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
  footnotes:
  - marker: a
    text: Job here echoes the LORD's earlier words in Job 38:3 and 40:7 almost verbatim.
    reason: cross_reference
  - marker: b
    text: Or 'and declare to me'; literally, 'and make me know.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「들으십시오, 내가 말하겠습니다. 내가 당신에게 묻겠으니, 나에게 알려 주십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 욥은 여기서 여호와의 앞선 말씀(욥 38:3; 40:7)을 거의 그대로 되풀이합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그리고 나에게 알려 주십시오’; 문자적으로는 ‘그리고 나에게 알게 하십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע נָא
  english_pob_choice: Hear, please
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어 주십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형을 공손한 직설 명령으로 살렸습니다. נָא는 현대 한국어에서는 별도 대응보다 문맥상 공손한 명령으로 흡수하는 편이 자연스럽습니다.
- source_word: וְאָנֹכִי אֲדַבֵּר
  english_pob_choice: and I will speak
  chosen_korean: 그러면 내가 말하겠습니다
  alternatives_korean:
  - 그리고 내가 말하겠습니다
  - 내가 말하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 단순 접속과 이어지는 의지 표명을 한국어에서는 결과·순서를 드러내는 ‘그러면’으로 자연스럽게 옮겼습니다.
- source_word: אֶשְׁאָלְךָ
  english_pob_choice: I will ask you
  chosen_korean: 내가 당신에게 묻겠으니
  alternatives_korean:
  - 내가 당신을 질문하겠으니
  - 내가 당신에게 물을 것이며
  lexicon: HALOT
  rationale: שאל의 기본 뜻을 따라 ‘묻다’로 옮기고, 뒤 절과의 병행을 살리기 위해 미래 의지의 연결형으로 처리했습니다.
- source_word: וְהוֹדִיעֵנִי
  english_pob_choice: and you make it known to me
  chosen_korean: 당신은 나에게 알려 주십시오
  alternatives_korean:
  - 당신은 나에게 알게 하십시오
  - 당신은 나에게 선언하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘나로 알게 하다’인 사역형을 한국어의 자연스러운 공손 명령 ‘알려 주십시오’로 옮겨, 사역적 의미를 보존했습니다.
theological_decisions:
- issue: 욥이 여호와의 말을 거의 그대로 되풀이하는 상호본문성
  chosen_reading: 본문 안에 설명을 덧붙이지 않고, 직접 인용처럼 읽히도록 번역합니다.
  alternative_readings:
  - ‘당신이 말씀하신 대로’ 같은 설명을 본문에 삽입하기
  - 명시적 인용 표지 없이 서술문으로 풀기
  rationale: 히브리어는 여호와의 이전 도전(욥 38:3; 40:7)을 거의 그대로 반향합니다. 본문을 늘리지 않고도 이 긴장을 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
