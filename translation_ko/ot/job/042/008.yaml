source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Now take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
  footnotes:
  - marker: a
    text: Literally, 'for only his face I will lift up,' a Hebrew idiom meaning 'I will accept him' or 'show favor to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that I may not do with you a disgraceful thing.' The Hebrew noun can denote folly or outrageous disgrace.
    reason: lexical_alternative
  - marker: c
    text: Or 'you have not spoken rightly to me.' The Hebrew may be understood as 'to me' or, by sense in context, 'about me.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 너희는 수소 일곱과 숫양 일곱을 가져다가, 내 종 욥에게 가서 너희를 위해 번제물을 드리십시오. 내 종 욥이 너희를 위해 기도할 것이니, 내가 그를 받아들일 것입니다. 그래야 내가 너희에게 disgracefully 하지는 않을 것입니다. 너희는 내 종 욥과 같이 나에 대해 바르게 말하지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오직 그의 얼굴만 내가 들어 올리겠다’는 관용구로, 여기서는 ‘그를 받아들이다’ 또는 ‘그에게 호의를 베풀다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 수치스러운 일을 하지 않도록’입니다. 히브리어 명사는 어리석음이나 난폭한 수치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나에게 바르게 말하지 않았다’입니다. 문맥상 ‘나에 대해’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ לָכֶם
  english_pob_choice: take for yourselves
  chosen_korean: 가져다가
  alternatives_korean:
  - 가서 가져오십시오
  - 너희 자신을 위해 가져가십시오
  lexicon: HALOT
  rationale: 명령형의 수령·준비 뉘앙스를 살리면서 한국어에서 가장 자연스럽게 제의 준비를 지시하는 동사로 옮겼습니다.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  english_pob_choice: seven bulls and seven rams
  chosen_korean: 수소 일곱과 숫양 일곱
  alternatives_korean:
  - 황소 일곱과 숫양 일곱
  - 어린 수소 일곱과 숫양 일곱
  lexicon: HALOT
  rationale: פָרִים과 אֵילִים의 기본 पश물 명칭을 직역하되, 제의 문맥에서 한국어 성경체에 자연스러운 ‘수소/숫양’을 택했습니다.
- source_word: עַבְדִּי אִיּוֹב
  english_pob_choice: my servant Job
  chosen_korean: 내 종 욥
  alternatives_korean:
  - 내 종, 욥
  - 나의 종 욥
  lexicon: HALOT
  rationale: עֶבֶד는 여기서 신분적 ‘노예’보다 하나님께 속한 충성된 ‘종’의 호칭으로 기능하므로, POB의 기본 선택을 따랐습니다.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  english_pob_choice: offer up a burnt offering
  chosen_korean: 번제물을 드리십시오
  alternatives_korean:
  - 번제물을 바치십시오
  - 번제를 올리십시오
  lexicon: HALOT
  rationale: ‘번제’를 제의 용어로 유지하되, 동사 העלה의 제의적 ‘드리다/바치다’ 의미를 한국어 공손체로 자연스럽게 반영했습니다.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  english_pob_choice: for I will accept him
  chosen_korean: 내가 그를 받아들일 것입니다
  alternatives_korean:
  - 내가 그에게 호의를 보일 것입니다
  - 내가 그의 얼굴을 들어줄 것입니다
  lexicon: HALOT
  rationale: ‘얼굴을 들어 올리다’라는 관용구를 한국어 관용인 ‘받아들이다’로 옮겨 수용·인정의 의미를 분명히 했습니다.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  english_pob_choice: you have not spoken rightly about me
  chosen_korean: 나에 대해 바르게 말하지 않았습니다
  alternatives_korean:
  - 나에게 바르게 말하지 않았습니다
  - 내가 누구인지 바르게 말하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 친구들의 말은 하나님 자신에 대한 진술이므로 POB의 ‘about me’ 해석을 따라 ‘나에 대해’로 옮겼습니다.
theological_decisions:
- issue: כִּי אִם פָּנָיו אֶשָּׂא의 관용구 처리
  chosen_reading: 하나님이 욥을 받아들이신다는 뜻을 분명히 드러내되, 제의적·관계적 수용의 의미를 유지했습니다.
  alternative_readings:
  - 얼굴을 들어주다를 직역하여 남기는 방식
  - 호의를 보이다로 완화하는 방식
  rationale: 이 표현은 문자적으로는 낯설지만, 본문 흐름에서 욥의 중보와 연결된 수용 선언이므로 한국어로는 ‘받아들이다’가 가장 정확하고 오해를 줄입니다.
  doctrine_reference: Translation philosophy §3
- issue: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה의 한국어 처리
  chosen_reading: 본문의 ‘수치스러운/무분별한 행위’ 가능성을 의식하되, 문맥상 하나님의 징계를 직접적으로 나타내는 문장 구조를 보존했습니다.
  alternative_readings:
  - 너희에게 disgracefully 하지 않도록
  - 너희에게 어리석은 일을 하지 않도록
  rationale: 현재 본문은 POB audit의 보수적 처리에 따라 의미를 다소 유보해야 하므로, 번역문에서는 과도한 해석을 피하고 어색한 영어 잔재가 남지 않도록 조정했습니다.
  doctrine_reference: Affirmations; Translation philosophy §1
