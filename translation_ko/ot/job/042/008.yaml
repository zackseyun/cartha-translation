  lexicon: HALOT
  rationale: ‘얼굴을 들어 올리다’라는 관용구를 한국어 관용인 ‘받아들이다’로 옮겨 수용·인정의 의미를 분명히 했습니다.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  english_pob_choice: you have not spoken rightly about me
  chosen_korean: 나에 대해 바르게 말하지 않았습니다
  alternatives_korean:
  - 나에게 바르게 말하지 않았습니다
