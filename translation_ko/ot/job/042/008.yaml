  lexicon: HALOT
  rationale: פָרִים과 אֵילִים의 기본 पश물 명칭을 직역하되, 제의 문맥에서 한국어 성경체에 자연스러운 ‘수소/숫양’을 택했습니다.
- source_word: עַבְדִּי אִיּוֹב
  english_pob_choice: my servant Job
  chosen_korean: 내 종 욥
  alternatives_korean:
