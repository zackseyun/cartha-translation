  lexicon: HALOT
  rationale: 문맥상 친구들의 말은 하나님 자신에 대한 진술이므로 POB의 ‘about me’ 해석을 따라 ‘나에 대해’로 옮겼습니다.
theological_decisions:
- issue: כִּי אִם פָּנָיו אֶשָּׂא의 관용구 처리
  chosen_reading: 하나님이 욥을 받아들이신다는 뜻을 분명히 드러내되, 제의적·관계적 수용의 의미를 유지했습니다.
  alternative_readings:
  - 얼굴을 들어주다를 직역하여 남기는 방식
  - 호의를 보이다로 완화하는 방식
  rationale: 이 표현은 문자적으로는 낯설지만, 본문 흐름에서 욥의 중보와 연결된 수용 선언이므로 한국어로는 ‘받아들이다’가 가장 정확하고 오해를 줄입니다.
  doctrine_reference: Translation philosophy §3
- issue: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה의 한국어 처리
  chosen_reading: 본문의 ‘수치스러운/무분별한 행위’ 가능성을 의식하되, 문맥상 하나님의 징계를 직접적으로 나타내는 문장 구조를 보존했습니다.
  alternative_readings:
  - 너희에게 disgracefully 하지 않도록
  - 너희에게 어리석은 일을 하지 않도록
  rationale: 현재 본문은 POB audit의 보수적 처리에 따라 의미를 다소 유보해야 하므로, 번역문에서는 과도한 해석을 피하고 어색한 영어 잔재가 남지 않도록 조정했습니다.
  doctrine_reference: Affirmations; Translation philosophy §1
