  english_pob_choice: did as Yahweh had spoken to them
  chosen_korean: 야훼께서 그들에게 말씀하신 대로 행하였고
  alternatives_korean:
  - 야훼께서 그들에게 말씀하신 대로 하였고
  - 야훼께서 그들에게 말씀하신 것처럼 행하였고
  lexicon: HALOT
  rationale: עשה + כַאֲשֶׁר의 관용구를 ‘행하다’로 옮겨 명령 수행의 뉘앙스를 살렸고, ‘말씀하신 대로’로 선행한 신적 말씀의 권위를 분명히 했습니다.
- source_word: וַ/יִּשָּׂא יְהוָ֖ה אֶת פְּנֵ֥י אִיּוֹב
  english_pob_choice: Yahweh accepted Job
  chosen_korean: 야훼께서 욥을 받아들이셨습니다
  alternatives_korean:
  - 야훼께서 욥에게 호의를 베푸셨습니다
  - 야훼께서 욥의 얼굴을 들어 주셨습니다
  lexicon: HALOT
  rationale: פָּנִים을 직접 옮기기보다, 해당 관용구가 뜻하는 ‘호의롭게 받아들이다’의 의미를 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: יהוה (YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명사 יהוה를 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֶת־פְּנֵי אִיּוֹב의 관용적 의미
  chosen_reading: 욥을 받아들이셨습니다
  alternative_readings:
  - 욥에게 호의를 베푸셨습니다
  - 욥의 얼굴을 들어 주셨습니다
  rationale: 문맥은 하나님이 욥을 호의적으로 인정하고 받아들이셨다는 뜻이므로, 신학적 의미를 과장하지 않으면서도 관용적 의미를 직접 전달하는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
