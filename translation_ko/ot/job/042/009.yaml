base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the LORD lifted up the face of Job,'' an idiom meaning that he showed favor to or accepted him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 데만 사람 엘리바스와 수아 사람 빌닷과 나아마 사람 소발이 가서, 야훼께서 그들에게 말씀하신 대로 행하였고, 야훼께서 욥을 받아들이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘욥의 얼굴을 들어 주셨다’이며, 이는 그에게 호의를 보이시거나 받아들이셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
