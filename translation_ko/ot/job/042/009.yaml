source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the LORD lifted up the face of Job,'' an idiom meaning that he showed favor to or accepted him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 데만 사람 엘리바스와 수아 사람 빌닷과 나아마 사람 소발이 가서, 야훼께서 그들에게 말씀하신 대로 행하였고, 야훼께서 욥을 받아들이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘욥의 얼굴을 들어 주셨다’이며, 이는 그에게 호의를 보이시거나 받아들이셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 이어지는 행동의 연속을 자연스럽게 살리면서도, 문맥상 목적지를 향한 이동을 간결하게 드러내는 합쇼체 표현으로 옮겼습니다.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  english_pob_choice: the Temanite / the Shuhite / the Naamathite
  chosen_korean: 데만 사람 / 수아 사람 / 나아마 사람
  alternatives_korean:
  - 데만인 / 수아인 / 나아마인
  - 데만 출신 / 수아 출신 / 나아마 출신
  lexicon: HALOT
  rationale: 이들은 지명에서 온 민족명·출신 표지이므로, 한국어 성경에서 읽기 자연스러운 ‘사람’ 구성을 택해 고유명사적 성격을 유지했습니다.
- source_word: וַיַּעֲשׂוּ כַּ/אֲשֶׁר דִּבֶּר אֲלֵי/הֶם
  english_pob_choice: did as Yahweh had spoken to them
  chosen_korean: 야훼께서 그들에게 말씀하신 대로 행하였고
  alternatives_korean:
  - 야훼께서 그들에게 말씀하신 대로 하였고
  - 야훼께서 그들에게 말씀하신 것처럼 행하였고
  lexicon: HALOT
  rationale: עשה + כַאֲשֶׁר의 관용구를 ‘행하다’로 옮겨 명령 수행의 뉘앙스를 살렸고, ‘말씀하신 대로’로 선행한 신적 말씀의 권위를 분명히 했습니다.
- source_word: וַ/יִּשָּׂא יְהוָ֖ה אֶת פְּנֵ֥י אִיּוֹב
  english_pob_choice: Yahweh accepted Job
  chosen_korean: 야훼께서 욥을 받아들이셨습니다
  alternatives_korean:
  - 야훼께서 욥에게 호의를 베푸셨습니다
  - 야훼께서 욥의 얼굴을 들어 주셨습니다
  lexicon: HALOT
  rationale: פָּנִים을 직접 옮기기보다, 해당 관용구가 뜻하는 ‘호의롭게 받아들이다’의 의미를 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: יהוה (YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명사 יהוה를 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֶת־פְּנֵי אִיּוֹב의 관용적 의미
  chosen_reading: 욥을 받아들이셨습니다
  alternative_readings:
  - 욥에게 호의를 베푸셨습니다
  - 욥의 얼굴을 들어 주셨습니다
  rationale: 문맥은 하나님이 욥을 호의적으로 인정하고 받아들이셨다는 뜻이므로, 신학적 의미를 과장하지 않으면서도 관용적 의미를 직접 전달하는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
