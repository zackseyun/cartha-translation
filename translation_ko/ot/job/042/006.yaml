  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
  footnotes:
  - marker: a
    text: Or, 'Therefore I recant, and I relent concerning dust and ashes.' The Hebrew is concise and debated, especially the implied object of 'I despise/reject' and the nuance of 'I repent/relent/am comforted.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 저는 스스로를 업신여기며, 티끌과 재 가운데서 회개합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그러므로 저는 철회하며, 티끌과 재에 관하여 돌이킵니다.” 히브리어는 매우 간결하며, ‘업신여기다/거부하다’의 목적어와 ‘회개하다/돌이키다/위로받다’의 뉘앙스가 학계에서 논쟁됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그렇기 때문에
  lexicon: HALOT
  rationale: 앞선 하나님의 말씀들과 42:5의 고백을 잇는 결론 표지이므로, 현대 문어에서 자연스러운 추론 연결어인 “그러므로”로 옮겼습니다.
- source_word: אֶמְאַס
  english_pob_choice: I despise myself
  chosen_korean: 저는 스스로를 업신여기며
  alternatives_korean:
  - 저는 저 자신을 미워하며
  - 저는 자신을 거부하며
  - 저는 자신을 업신여기며
  lexicon: HALOT
  rationale: 히브리어는 목적어가 생략되어 있어 직역이 어렵지만, 문맥상 자기 비하와 굴복을 나타내므로 한국어에서는 “스스로를 업신여기며”로 간결하게 살렸습니다.
- source_word: וְנִחַמְתִּי
  english_pob_choice: and I repent
  chosen_korean: 회개합니다
  alternatives_korean:
  - 뉘우칩니다
  - 유감스럽게 여깁니다
  - 마음을 돌립니다
  lexicon: HALOT
  rationale: נחם의 의미 범위가 넓지만, 여기서는 하나님의 현현 앞에서의 회한과 돌이킴이 핵심이므로 “회개합니다”를 택했습니다.
- source_word: עַל עָפָר וָאֵפֶר
  english_pob_choice: in dust and ashes
  chosen_korean: 티끌과 재 가운데서
  alternatives_korean:
  - 티끌과 재 위에서
  - 티끌과 재 속에서
  - 티끌과 재에 대하여
  lexicon: HALOT
  rationale: ‘티끌과 재’는 죽을 존재의 비천함과 애도의 관용구이므로, 전치사 עַל의 공간적 의미를 살리면서도 한국어 관용에 맞는 “가운데서”로 옮겼습니다.
theological_decisions:
- issue: אֶמְאַס와 וְנִחַמְתִּי의 해석 — 자기비하/회개인가, 철회/유보인가
  chosen_reading: 문맥상 욥이 하나님의 말씀 앞에서 자신을 낮추며 회개하는 고백으로 읽었습니다.
  alternative_readings:
  - “저는 제 말을 철회합니다”처럼 재고/철회를 강조하는 읽기
  - “티끌과 재에 관하여 제가 돌이킵니다”처럼 동사 נחם의 완곡한 의미를 살리는 읽기
  rationale: 히브리어가 간결하고 논쟁적이므로 해석을 완전히 해소하지 않았습니다. 다만 42:5의 직접적 종결 응답과 이어지는 겸비의 어조를 고려해 회개 표현을 본문에 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
