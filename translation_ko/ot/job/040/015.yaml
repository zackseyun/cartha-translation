base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
  footnotes:
  - marker: a
    text: Or 'the beast'; many interpreters understand 'Behemoth' as the name/designation of a specific great creature, while others identify it with the hippopotamus or another large animal.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 내가 당신과 함께 만든 베헤못[a]은 풀을 소처럼 먹습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 짐승’. 많은 해석자들은 베헤못을 특정한 큰 피조물의 이름이나 명칭으로 이해하지만, 다른 이들은 하마나 다른 큰 동물로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·명령 표현으로, 현대 한국어에서는 ‘보십시오’가 자연스럽게 즉시성을 살리면서도 공손한 합쇼체를 유지합니다.
- source_word: בְהֵמוֹת
  english_pob_choice: Behemoth
  chosen_korean: 베헤못
  alternatives_korean:
  - 그 짐승
  - 짐승
  lexicon: HALOT
  rationale: 본문이 특정 거대한 피조물을 지칭하는 문학적 명칭으로 제시하므로, 본문 고유의 긴장과 불확실성을 살리기 위해 음역했습니다.
- source_word: עִמָּךְ
  english_pob_choice: along with you
  chosen_korean: 당신과 함께
  alternatives_korean:
  - 당신과 더불어
  - 당신과 함께하여
  lexicon: HALOT
  rationale: 동시적 창조를 나타내는 전치사 구로 보고, ‘함께’로 간결하고 자연스럽게 옮겼습니다.
- source_word: כַּבָּקָר
  english_pob_choice: like an ox
  chosen_korean: 소처럼
  alternatives_korean:
  - 황소처럼
  - 가축처럼
  lexicon: HALOT
  rationale: 비유 대상은 단수 일반 의미의 가축이 아니라 소이며, 한국어에서는 관용적이고 생생한 ‘소처럼’이 가장 적절합니다.
theological_decisions:
- issue: 베헤못의 정체를 본문에서 확정할 것인지
  chosen_reading: 주석 없이 본문에서는 음역만 유지하고, 특정 동물로 동일시하지 않았습니다.
  alternative_readings:
  - 하마로 번역
  - 그 짐승으로 일반화
  rationale: 히브리어 형식과 욥기의 시적 문맥은 정체를 단정하기보다 독자가 신비성을 그대로 인식하도록 요구하므로, 번역문에서도 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; preserve interpretive tension rather than resolve it.'
