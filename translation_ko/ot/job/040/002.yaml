id: JOB.40.2
reference: Job 40:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ֭/רֹב עִם שַׁדַּ֣י יִסּ֑וֹר מוֹכִ֖יחַ אֱל֣וֹהַּ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
  footnotes:
  - marker: a
    text: Or 'Will the faultfinder with the Almighty instruct/reprove him?' The Hebrew combines legal-disputational and corrective language.
    reason: lexical_alternative
  - marker: b
    text: Or 'let him answer this' or 'let him answer him.' The Hebrew suffix may point to the matter raised rather than directly to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 전능하신 분과 다투는 사람이 그분을 바로잡을 수 있겠습니까? 하나님과 논쟁하는 그가 그것에 대답하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투는 사람’은 ‘송사하는 사람/논쟁하는 사람’의 뜻을 함께 담아, משפט적·대결적 뉘앙스를 보존한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 ‘그것’은 본문에 제기된 논제나 쟁점을 가리킬 수 있으며, 직접적으로 하나님만을 가리킨다고 단정할 수 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  english_pob_choice: Will one who contends
  chosen_korean: 다투는 사람
  alternatives_korean:
  - 논쟁하는 사람
  - 시비하는 사람
  - 송사하는 사람
  lexicon: HALOT
  rationale: ריב의 법정적·논쟁적 의미를 살리되, 현대 한국어에서는 ‘다투다’가 가장 자연스럽게 그 대립성을 드러냅니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샷대이
  lexicon: HALOT
  rationale: 욥기에서의 신칭을 직역해 존칭형으로 옮겼으며, ‘전능하신 분’이 품위와 의미를 함께 살립니다.
- source_word: יִסּוֹר
  english_pob_choice: correct him
  chosen_korean: 바로잡을 수 있겠습니까
  alternatives_korean:
  - 훈계할 수 있겠습니까
  - 질책할 수 있겠습니까
  - 가르칠 수 있겠습니까
  lexicon: HALOT
  rationale: יסר의 교정·훈계 의미를 살리되, 여기서는 사람이 하나님을 교정하려 든다는 뉘앙스가 핵심이므로 ‘바로잡다’가 가장 적절합니다.
- source_word: יַעֲנֶנָּה
  english_pob_choice: answer it
  chosen_korean: 그것에 대답하게 하십시오
  alternatives_korean:
  - 그에게 대답하게 하십시오
  - 이 일에 대답하게 하십시오
  lexicon: HALOT
  rationale: 여성 단수 접미사가 직접 하나님보다 앞선 논제/쟁점을 가리킬 수 있다는 점을 반영해 ‘그것’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 대명사의 지시 대상
  chosen_reading: ‘그것’은 하나님 자신보다 앞선 논쟁의 쟁점/논제에 더 가깝게 읽었습니다.
  alternative_readings:
  - 그에게 대답하게 하십시오
  - 이 일에 대답하게 하십시오
  rationale: 히브리어의 여성 단수 접미사는 압축적이며, 영어 POB도 ‘answer it’로 이 가능성을 보존합니다. 따라서 한국어도 대상이 하나님으로 단정되지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
