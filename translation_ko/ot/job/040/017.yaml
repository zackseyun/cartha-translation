  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַחְפֹּ֣ץ זְנָב֣/וֹ כְמוֹ אָ֑רֶז גִּידֵ֖י פחד/ו יְשֹׂרָֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
  footnotes:
  - marker: a
    text: Or 'the sinews of his loins' or, more specifically, 'the muscles/sinews of his genitals'; the Hebrew term is uncertain and debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 꼬리를 백향목처럼 뻣뻣하게 세우고, 허벅지의 힘줄들은 서로 얽혀 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 허리의 힘줄들’, 더 구체적으로는 ‘그의 생식기의 근육/힘줄들’로도 옮길 수 있습니다. 히브리어 용어는 불확실하며 논쟁적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  english_pob_choice: makes ... stiff
  chosen_korean: 뻣뻣하게 세우고
  alternatives_korean:
  - 굳게 하고
  - 곧추 세우고
  - 강하게 하고
  lexicon: HALOT
  rationale: 동사 חפץ는 여기서 감정적 ‘기뻐하다’가 아니라 꼬리의 물리적 상태를 묘사하므로, 백향목과의 비교에 맞게 ‘뻣뻣하게 세우다’로 옮겼습니다.
- source_word: זְנָבוֹ
  english_pob_choice: his tail
  chosen_korean: 자기 꼬리
  alternatives_korean:
  - 그의 꼬리
  - 꼬리
  lexicon: HALOT
  rationale: 3인칭 소유격을 자연스럽게 살리되 한국어 문장에서는 ‘자기’가 가장 매끄럽고 문맥상 분명합니다.
- source_word: כְמוֹ אָרֶז
  english_pob_choice: like a cedar
  chosen_korean: 백향목처럼
  alternatives_korean:
  - 삼나무처럼
  - 삼나무 같이
  lexicon: HALOT
  rationale: 문학적이고 성경적인 한국어에서 ‘백향목’이 크고 단단한 이미지를 가장 잘 보존합니다.
- source_word: גִּידֵי פַחֲדוֹ
  english_pob_choice: the sinews of his thighs
  chosen_korean: 허벅지의 힘줄들
  alternatives_korean:
  - 넓적다리의 힘줄들
  - 허리의 힘줄들
  lexicon: HALOT
  rationale: גִּידֵי는 ‘힘줄/힘줄들’로 옮기고, פַחֲדוֹ는 이 문맥에서 신체의 넓적다리·허벅지 부위를 가리키는 것으로 이해해 가장 분명한 ‘허벅지’로 번역했습니다.
- source_word: יְשֹׂרָגוּ
  english_pob_choice: are knit together
  chosen_korean: 서로 얽혀 있습니다
  alternatives_korean:
  - 서로 짜여 있습니다
  - 서로 맞물려 있습니다
  - 엉켜 있습니다
  lexicon: HALOT
  rationale: ‘엮다/짜다’의 결을 살리면서도 한국어에서 자연스럽고, 힘줄이 촘촘히 얽힌 이미지를 전달합니다.
theological_decisions:
- issue: 신체 은유의 수위와 직역성
  chosen_reading: 문맥이 동물의 체형을 묘사하는 시적 표현이므로, 불필요하게 완곡하거나 도덕화하지 않고 신체 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 풀어 쓰기
  - 상징적으로 해석하기
  rationale: 본문은 위엄과 힘을 드러내는 묘사이므로, 원문의 감각적 힘을 보존하는 것이 청중 이해에 더 충실합니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
- issue: פַחֲדוֹ의 의미 불확실성
  chosen_reading: 본문에는 ‘허벅지’로 두되, 히브리어 단어가 해부학적으로 다의적임을 각주로 남길 수 있도록 처리했습니다.
  alternative_readings:
  - 허리
  - 사타구니
  - 생식기
  rationale: 영어 POB가 ‘thighs’를 본문으로 두고 더 구체적인 가능성을 각주로 처리하므로, 한국어도 같은 긴장을 유지하는 것이 가장 투명합니다.
  doctrine_reference: 본문 비평 및 어휘 불확실성의 투명성
