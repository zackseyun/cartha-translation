source:
  edition: WLC
  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
  footnotes:
  - marker: a
    text: Or 'Scatter the overflowings of your wrath.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'everyone proud'; the singular object in 'bring him low' treats each proud person individually.
    reason: lexical_alternative
  - marker: c
    text: Or 'Pour out the outbursts'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 분노의 넘침을 쏟으시고, 교만한 사람을 모두 살펴보시며 그를 낮추십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분노의 넘침들을 흩으십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘교만한 모든 사람’이며, ‘그를 낮추십시오’의 단수 목적어는 각 사람을 개별적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘분노의 폭발들을 쏟으십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: הָפֵץ
  english_pob_choice: Pour out / Scatter
  chosen_korean: 쏟으시고
  alternatives_korean:
  - 흩으시고
  - 퍼부으시고
  - 쏟아내시고
  lexicon: HALOT
  rationale: 동사 פוץ 계열의 강한 방출·확산 이미지를 한국어에서 자연스럽게 살리면서, 뒤의 분노 이미지와도 잘 맞는 표현으로 ‘쏟다’를 택했습니다.
- source_word: עֶבְרוֹת
  english_pob_choice: outbursts / overflowings
  chosen_korean: 분노의 넘침
  alternatives_korean:
  - 분노의 폭발
  - 진노의 넘침
  - 격분의 분출
  lexicon: HALOT
  rationale: 복수형이 담는 격렬한 감정의 겹침을 살리기 위해 단수 ‘분노’보다 ‘넘침’을 더해, POB의 플럴랄 강세를 반영했습니다.
- source_word: וּרְאֵה
  english_pob_choice: and look on
  chosen_korean: 살펴보시며
  alternatives_korean:
  - 보시고
  - 주시하고
  - 바라보시고
  lexicon: HALOT
  rationale: 단순 인지보다 대상에 대한 적극적 주목을 뜻하므로, 뒤의 ‘낮추다’와 연결되는 동작성을 살려 ‘살펴보다’로 옮겼습니다.
- source_word: גֵּאֶה
  english_pob_choice: who is proud
  chosen_korean: 교만한 사람
  alternatives_korean:
  - 오만한 사람
  - 교만한 자
  - 거만한 사람
  lexicon: HALOT
  rationale: 형용사적 명사를 한국어에서는 사람으로 풀어 주어 분배적 의미를 자연스럽게 드러내되, ‘교만’의 도덕적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 하나님께 대한 명령형의 높임말 처리
  chosen_reading: 직접적으로 하나님을 향해 말하는 문맥이므로 ‘쏟으시고… 살펴보시며… 낮추십시오’처럼 높임 종결을 사용했습니다.
  alternative_readings:
  - 평서형으로 옮김
  - 기도체 어미를 사용함
  rationale: 욥기의 시적 논변 속에서도 화자가 하나님께 직접 말하고 있으므로, 한국어 합쇼체로 경외를 보존하는 것이 문맥에 가장 적합합니다.
  doctrine_reference: 문맥상 화자-하나님 직접 대화에 대한 한국어 경어 관행
