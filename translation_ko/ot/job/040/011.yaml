    reason: lexical_alternative
  - marker: c
    text: Or 'Pour out the outbursts'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 격렬한 분노를 쏟아 내시고, 교만한 자마다 보시고 그를 낮추십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 격렬한 분노를 흩으십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘교만한 자마다’이며, ‘그를 낮추십시오’의 단수 목적어는 각 사람을 개별적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주님의 분노의 분출들을 쏟아 내십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: הָפֵץ
  english_pob_choice: Pour out / Scatter
  chosen_korean: 쏟으시고
  alternatives_korean:
