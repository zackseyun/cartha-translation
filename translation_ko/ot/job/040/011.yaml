  lexicon: HALOT
  rationale: 동사 פוץ 계열의 강한 방출·확산 이미지를 한국어에서 자연스럽게 살리면서, 뒤의 분노 이미지와도 잘 맞는 표현으로 ‘쏟다’를 택했습니다.
- source_word: עֶבְרוֹת
