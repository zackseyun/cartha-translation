source:
  edition: WLC
  text: הֲ/יַרְבֶּ֣ה אֵ֭לֶי/ךָ תַּחֲנוּנִ֑ים אִם יְדַבֵּ֖ר אֵלֶ֣י/ךָ רַכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
  footnotes:
  - marker: a
    text: Or 'supplications' for 'pleas.' The Hebrew term refers to earnest requests for favor or mercy.
    reason: lexical_alternative
  - marker: b
    text: Or 'gentle words' for 'soft words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 당신에게 많은 간청을 하겠습니까, 아니면 당신에게 부드러운 말을 하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간청’은 히브리어가 가리키는 ‘호의나 자비를 구하는 간절한 요청’을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부드러운 말’은 히브리어의 ‘온화하고 부드러운 말’을 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יַרְבֶּה
  english_pob_choice: Will he make many
  chosen_korean: 많은 간청을 하겠습니까
  alternatives_korean:
  - 많이 하겠습니까
  - 여러 번 간청하겠습니까
  - 간청을 많이 하겠습니까
  lexicon: HALOT
  rationale: 히필 형태의 ‘많게 하다/늘리다’라는 의미를 한국어 질문문에서는 ‘많은 간청을 하다’로 자연스럽게 살려, 대상에게 거듭 요청하는 뉘앙스를 유지했습니다.
- source_word: תַּחֲנוּנִים
  english_pob_choice: pleas
  chosen_korean: 간청
  alternatives_korean:
  - 간구
  - 탄원
  - 애원
  lexicon: HALOT
  rationale: 이 명사는 호의나 자비를 구하는 간절한 요청을 뜻하므로, 현대 한국어에서 의미가 또렷한 ‘간청’이 가장 적절합니다.
- source_word: אִם
  english_pob_choice: or
  chosen_korean: 아니면
  alternatives_korean:
  - 혹은
  - 또는
  - 만일
  lexicon: HALOT
  rationale: 두 번째 절은 조건문이 아니라 대조적 선택 질문이므로, 한국어에서도 ‘아니면’으로 옮겨 병렬 구조를 드러냈습니다.
- source_word: רַכּוֹת
  english_pob_choice: soft words
  chosen_korean: 부드러운 말
  alternatives_korean:
  - 온화한 말
  - 다정한 말
  - 유순한 말
  lexicon: HALOT
  rationale: 형용사 ‘부드러운/연한’의 기본 의미를 살려, 과도한 해석이 덜한 ‘부드러운 말’로 옮겼습니다.
theological_decisions:
- issue: 욥기의 수사적 질문 톤과 직설성
  chosen_reading: 하나님이 욥에게 던지는 수사적 반문을 그대로 살려, 완곡하게 풀지 않고 질문의 압박감을 유지했습니다.
  alternative_readings:
  - 더 부드러운 진술형 표현으로 완화
  - 설명형으로 재구성
  rationale: 본문은 엘리후의 논박 문맥에서 짐승의 반응을 수사적으로 묻는 말이므로, 원문의 도전적 효과를 보존하는 것이 중요합니다.
  doctrine_reference: 욥기 40장 문맥의 수사적 심문
