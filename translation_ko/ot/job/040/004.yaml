  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
  footnotes:
  - marker: a
    text: Or, 'I am of little account'; traditionally, 'I am vile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 저는 하잘것없습니다. 제가 어떻게 주께 대답하겠습니까? 제 손을 제 입에 갖다 댔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저는 보잘것없습니다'; 전통적으로 '저는 비천합니다'로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 대화의 전환을 여는 주의 환기 표현으로, 현대 한국어 합쇼체에서 자연스럽고 직접적인 호소력을 유지합니다.
- source_word: קַלֹּתִי
  english_pob_choice: I am insignificant
  chosen_korean: 하잘것없습니다
  alternatives_korean:
  - 미천합니다
  - 보잘것없습니다
  - 하찮습니다
  lexicon: HALOT
  rationale: 문맥상 하나님 앞에서의 낮아짐과 보잘것없음을 드러내되, 전통 번역의 도덕적 뉘앙스인 '비천하다/사악하다'로 과도하게 밀어가지 않도록 했습니다.
- source_word: אֲשִׁיבֶךָּ
  english_pob_choice: can I answer you
  chosen_korean: 어떻게 주께 대답하겠습니까
  alternatives_korean:
  - 무엇으로 주께 대답하겠습니까
  - 제가 주께 어떻게 대답할 수 있겠습니까
  lexicon: HALOT
  rationale: 이 동사는 여기서 '대답하다/응답하다'의 관용구로 쓰이므로, 단순 정보 질문이 아니라 무력한 응답 불가를 드러내는 수사적 질문으로 옮겼습니다.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  english_pob_choice: I put my hand over my mouth
  chosen_korean: 제 손을 제 입에 갖다 댔습니다
  alternatives_korean:
  - 제 손으로 제 입을 가렸습니다
  - 제 손을 입 위에 얹었습니다
  lexicon: HALOT
  rationale: 직역의 몸짓 이미지를 살리면서도 한국어에서 자연스러운 '입을 가리다' 관용을 과하게 고정하지 않도록 표현했습니다.
theological_decisions:
- issue: 'קַלֹּתִי의 신학적 강도: 도덕적 타락 고백인가, 하나님 앞에서의 비천함인가'
  chosen_reading: 하나님 앞에서 자신을 낮추는 '하잘것없음'으로 옮기고, 도덕적 부패를 명시적으로 덧씌우지 않았습니다.
  alternative_readings:
  - 비천합니다
  - 저는 비열합니다
  - 저는 악합니다
  rationale: 히브리어와 POB의 판단처럼 본문은 욥의 겸손과 무력함을 말하지, 여기서 직접적인 도덕적 악함을 확정하지 않습니다. 따라서 번역은 원문의 긴장을 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통이 본문 이상의 신학적 판단을 덧붙이지 않도록 함.
