base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
  footnotes:
  - marker: a
    text: Or 'pull in Leviathan with a hook.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sink his tongue with a cord' or 'hold down his tongue with a rope.' The Hebrew imagery is difficult and may refer to subduing the creature by the mouth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그대가 낚시바늘로 리워야단을 끌어낼 수 있겠으며, 밧줄로 그의 혀를 눌러 내릴 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈고리로 리워야단을 끌어낼 수 있겠느냐’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 혀를 줄로 가라앉히다’ 혹은 ‘그의 혀를 밧줄로 눌러 두다’라는 뜻입니다. 히브리어의 비유는 어렵고, 입을 통해 그 생물을 제압하는 장면을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  english_pob_choice: draw out
  chosen_korean: 끌어낼 수 있겠으며
  alternatives_korean:
  - 당겨낼 수 있겠으며
  - 끌어올 수 있겠으며
  - 잡아끌 수 있겠으며
  lexicon: HALOT
  rationale: 낚시로 거대한 존재를 ‘draw out’한다는 도전적 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 질문체에 맞는 표현으로 옮겼습니다.
- source_word: לִוְיָתָן
  english_pob_choice: Leviathan
  chosen_korean: 리워야단
  alternatives_korean:
  - 레비아탄
  - 리바이어던
  lexicon: 고유명사 음역
  rationale: 전통적 교회어 ‘리바이어던’보다 원음에 더 가까운 음역을 택해, 고유명사성을 살렸습니다.
- source_word: בְּחַכָּה
  english_pob_choice: with a fishhook
  chosen_korean: 낚시바늘로
  alternatives_korean:
  - 갈고리로
  - 낚싯바늘로
  - 낚시갈고리로
  lexicon: HALOT
  rationale: 어류를 낚는 도구라는 점을 분명히 하면서도, 한국어에서 가장 즉각적으로 떠오르는 도구명으로 자연스럽게 옮겼습니다.
- source_word: וּבְחֶבֶל תַּשְׁקִיעַ לְשֹׁנוֹ
  english_pob_choice: or press down his tongue with a rope
  chosen_korean: 밧줄로 그의 혀를 눌러 내릴 수 있겠습니까
  alternatives_korean:
  - 밧줄로 그의 혀를 내리눌러 놓을 수 있겠습니까
  - 끈으로 그의 혀를 눌러둘 수 있겠습니까
  - 밧줄로 그의 입을 눌러 막을 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어가 말하는 것은 ‘혀’를 눌러 내리는 구체적 이미지이므로 ‘입’으로 순화하지 않고, rope의 강한 물질감을 살리는 ‘밧줄’과 ‘눌러 내리다’를 선택했습니다.
theological_decisions:
- issue: 욥기 40:25의 도전적 수사와 자연물 통제 불가능성
  chosen_reading: 수사학적 질문을 그대로 유지해, 사람이 리워야단을 다룰 수 없다는 본문의 조롱과 무력감의 강도를 살렸습니다.
  alternative_readings:
  - 서술문처럼 완화된 표현
  - 단순한 가능 여부 질문으로 약화된 표현
  rationale: 본문은 실제 조작법을 설명하기보다 인간의 한계를 드러내는 도전이므로, 질문형과 구체 이미지를 보존하는 것이 원문 의도에 가장 충실합니다.
  doctrine_reference: 욥기 38–41장의 하나님의 창조주권과 인간의 한계
