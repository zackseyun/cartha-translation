  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
  footnotes:
  - marker: a
    text: Or 'under the shady trees.' The exact species denoted by the Hebrew term is uncertain; 'lotus trees' reflects a common contextual identification.
