base_translation:
  language: en
  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
  footnotes:
  - marker: a
    text: Or 'under the shady trees.' The exact species denoted by the Hebrew term is uncertain; 'lotus trees' reflects a common contextual identification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 연꽃나무 아래에 누워 있고, 갈대와 늪의 그늘 속에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘연꽃나무’는 문맥상 자주 제안되는 식별을 따른 번역이며, 정확한 수종은 확정되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: Under
  chosen_korean: 아래에
  alternatives_korean:
  - 밑에
  - 아래
  lexicon: HALOT
  rationale: 위치를 나타내는 전치사로, 현대 한국어에서는 자연스럽고 직설적인 ‘아래에’가 원문의 공간 관계를 잘 살립니다.
- source_word: צֶאֱלִים
  english_pob_choice: the lotus trees
  chosen_korean: 연꽃나무
  alternatives_korean:
  - 그늘나무
  - 로터스나무
  lexicon: HALOT
  rationale: 이 어휘는 정확한 수종이 불확실하지만 문맥상 물가의 그늘을 만드는 나무를 가리키므로, English POB의 “lotus trees”에 맞춰 ‘연꽃나무’로 옮기고 영어의 불확실성은 별도 주석 없이 유지 가능한 범위로 처리했습니다.
- source_word: בְּסֵתֶר
  english_pob_choice: in the shelter
  chosen_korean: 그늘 속에
  alternatives_korean:
  - 보호 아래에
  - 숨은 곳에
  - 은밀한 곳에
  lexicon: HALOT
  rationale: סֵתֶר는 ‘숨김/보호/은폐’의 뜻이지만, 뒤의 갈대와 늪 이미지와 함께 자연스러운 한국어로는 ‘그늘 속에’가 보호받는 위치감을 가장 잘 전달합니다.
- source_word: קָנֶה
  english_pob_choice: the reeds
  chosen_korean: 갈대
  alternatives_korean:
  - 갈대들
  - 갈대밭
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 집합적으로 쓰였으므로 한국어에서는 자연스럽게 ‘갈대’로 옮겼습니다.
- source_word: וּבִצָּה
  english_pob_choice: and the marsh
  chosen_korean: 늪
  alternatives_korean:
  - 늪지
  - 습지
  - 진흙탕
  lexicon: HALOT
  rationale: בִּצָּה는 물기가 많은 늪지대를 뜻하므로, 문맥상 지나치게 좁거나 거친 뉘앙스를 피하는 ‘늪’이 가장 적절합니다.
theological_decisions:
- issue: 해당 구절의 3인칭 지시 대상과 시적 현재의 처리
  chosen_reading: ‘그는 … 누워 있고’로 번역해, 본문의 묘사적 현재감을 살리면서도 한국어 서술의 자연스러움을 유지했습니다.
  alternative_readings:
  - ‘그는 … 누웁니다’
  - ‘그는 … 누워 있습니다’
  rationale: 이 구절은 특정 인물의 현재 행위를 묘사하는 시적 진술이므로, ‘누워 있고’가 상태 묘사와 진행감 사이의 균형을 가장 잘 잡습니다.
  doctrine_reference: 시적 묘사에서의 상(Aspect) 전달
