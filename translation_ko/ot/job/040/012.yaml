lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Look on
  chosen_korean: 보시고
  alternatives_korean:
  - 살피시고
  - 바라보시고
  lexicon: HALOT
  rationale: 직접 명령형의 시선을 요구하는 표현이므로, 단순한 ‘보다’보다 심판적 응시를 담는 ‘보시고’가 자연스럽고 문맥에도 맞습니다.
- source_word: כָל גֵּאֶה
  english_pob_choice: everyone who is proud
  chosen_korean: 교만한 사람을 모두
  alternatives_korean:
  - 모든 교만한 자를
  - 교만한 자마다
  lexicon: HALOT
  rationale: 분배적 의미를 살리면서 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הַכְנִיעֵהוּ
  english_pob_choice: humble him
  chosen_korean: 그를 낮추십시오
  alternatives_korean:
  - 그를 겸손하게 하십시오
  - 그를 굴복시키십시오
  lexicon: HALOT
  rationale: 히필 사역의 ‘낮추다/굴복시키다’ 뜻을 유지하되, 한국어에서 ‘교만-낮춤’ 대비가 분명한 ‘낮추십시오’를 택했습니다.
- source_word: וַהֲדֹךְ
  english_pob_choice: tread down / crush
  chosen_korean: 짓밟으십시오
  alternatives_korean:
  - 쳐부수십시오
  - 눌러 밟으십시오
  lexicon: HALOT
  rationale: 폭력적이고 निर्ण정적인 심판 동작을 나타내는 동사로, ‘짓밟다’가 원문의 강도를 잘 살립니다.
- source_word: תַּחְתָּם
  english_pob_choice: where they stand / in their place
  chosen_korean: 그들이 있는 자리에서
  alternatives_korean:
  - 제자리에
  - 그들 자리에
  lexicon: HALOT
  rationale: תחת의 관용적 의미를 한국어로 풀어, ‘그 자리에서’라는 즉각성과 위치성을 함께 드러냈습니다.
theological_decisions:
- issue: 하나님의 심판을 수행하는 명령이 실제 위임인지 여부
  chosen_reading: 이 문장은 욥에게 실제 권한을 부여한다기보다, 하나님만의 심판 행위를 열거하는 도전적 명령으로 옮겼습니다.
  alternative_readings:
  - 욥에게 실제 심판 권한을 주는 명령
  - 완전히 가정적인 불가능한 과제로만 읽는 해석
  rationale: 문맥상 하나님의 주권적 심판을 부각하는 도전이므로, 번역은 명령의 형식을 유지하되 위임 교리를 덧씌우지 않도록 했습니다.
  doctrine_reference: 하나님의 주권과 인간의 한계 유지
