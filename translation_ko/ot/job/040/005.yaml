  text: אַחַ֣ת דִּ֭בַּרְתִּי וְ/לֹ֣א אֶֽעֱנֶ֑ה וּ֝/שְׁתַּ֗יִם וְ/לֹ֣א אוֹסִֽיף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
  footnotes:
  - marker: a
    text: Or, 'I spoke once, but I will not answer; twice, but I will proceed no further.' The Hebrew idiom 'add' can mean to continue or repeat an action.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 번 말했습니다만, 대답하지 않겠습니다. 두 번 말했지만, 더 보태지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘더하지 않겠습니다’입니다. 히브리어 יסף는 여기서 ‘계속하다, 반복하다’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת ... דִּבַּרְתִּי
  english_pob_choice: I have spoken once
  chosen_korean: 한 번 말했습니다
  alternatives_korean:
  - 한 가지를 말했습니다
  - 한 번 말씀드렸습니다
  lexicon: HALOT
  rationale: אַחַת은 여기서 수량 ‘하나’가 아니라 부사적으로 ‘한 번’의 뜻으로 쓰였고, דִּבַּרְתִּי는 완료된 발화를 가리키므로 한국어도 자연스럽게 과거 완료 느낌의 ‘말했습니다’로 옮겼습니다.
- source_word: וְלֹא אֶעֱנֶה
  english_pob_choice: and I will not answer
  chosen_korean: 대답하지 않겠습니다
  alternatives_korean:
  - 답하지 않겠습니다
  - 대꾸하지 않겠습니다
  lexicon: HALOT
  rationale: ענה의 기본 의미는 ‘대답하다/응답하다’이므로, 항의나 토론을 이어 가지 않겠다는 뉘앙스를 살려 ‘대답하지 않겠습니다’로 옮겼습니다.
- source_word: וּשְׁתַּיִם ... וְלֹא אוֹסִיף
  english_pob_choice: twice ... and I will add nothing more
  chosen_korean: 두 번 말했지만, 더 보태지 않겠습니다
  alternatives_korean:
  - 두 번 말했지만, 더하지 않겠습니다
  - 두 번 말했지만, 더 이어 가지 않겠습니다
  lexicon: HALOT
  rationale: ‘더하다/보태다’는 יסף의 히필이 지닌 ‘추가하다, 계속하다’의 비유를 한국어로 살리며, 문맥상 ‘말을 더 보태지 않겠다’는 의미가 분명하므로 ‘더 보태지 않겠습니다’로 번역했습니다.
theological_decisions:
- issue: 욥의 자기 절제와 항복의 어조
  chosen_reading: 이 절은 욥이 더 이상 하나님께 맞서 변론하지 않겠다는 결심을 드러내는 말로 읽었습니다.
  alternative_readings:
  - 단순히 말을 멈추겠다는 의미
  - 하나님께 대한 무조건적 동의로 읽는 해석
  rationale: 문맥상 ‘답하지 않겠다’와 ‘더 보태지 않겠다’는 말은 말문을 닫는 행위 이상으로, 하나님의 말씀 앞에서 자신의 발화를 접는 태도를 나타냅니다. 다만 본문 자체가 논쟁의 종결을 말할 뿐, 여기서 완전한 신학적 동의까지 명시하지는 않습니다.
  doctrine_reference: 욥기 40장 문맥의 신정론적 대화
