  lexicon: HALOT
  rationale: לְחִי의 ‘뺨/턱’ 중, 갈고리를 걸어 제어한다는 이미지에는 ‘턱’이 더 강하고 분명합니다.
theological_decisions:
- issue: 수사적 도전문의 직설성
  chosen_reading: 신의 힘으로 리워야단을 제어할 수 있는지 묻는 도전적 수사문을 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘할 수 있습니까’로 낮추는 번역
  - 설명적으로 풀어 쓰는 번역
  rationale: 이 절은 하나님의 창조권 앞에서 인간의 무력함을 드러내는 논박이므로, 한국어도 직설적 수사문을 유지해야 원문의 압박감이 살아납니다.
  doctrine_reference: 욥기 40장 문맥상 하나님의 주권과 인간의 한계를 드러내는 신학
