  text: הֲ/תָשִׂ֣ים אַגְמ֣וֹן בְּ/אַפּ֑/וֹ וּ֝/בְ/ח֗וֹחַ תִּקּ֥וֹב לֶֽחֱי/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/026.yaml
  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
  footnotes:
  - marker: a
    text: Or 'a reed in his nose'; the Hebrew אַגְמוֹן literally refers to a reed or rush, but here likely means a cord made from rushes.
    reason: lexical_alternative
  - marker: b
    text: Or 'his cheek' for 'his jaw.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 그의 코에 줄을 꿸 수 있느냐, 또는 갈고리로 그의 턱을 뚫을 수 있느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄’은 אַגְמוֹן의 문자적 ‘갈대/골풀’보다 여기서의 기능적 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘턱’은 לֶחִי의 가능한 뜻 ‘뺨/볼’ 가운데, 붙잡아 제어하는 장면에 더 알맞은 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  english_pob_choice: Can you put
  chosen_korean: 네가 … 꿸 수 있느냐
  alternatives_korean:
  - 네가 … 넣을 수 있느냐
  - 네가 … 두를 수 있느냐
  lexicon: HALOT
  rationale: 수사적 질문의 도전적 뉘앙스를 살리면서, 줄을 구멍에 넣는 동작에 자연스러운 ‘꿰다’를 선택했습니다.
- source_word: אַגְמוֹן
  english_pob_choice: a rope
  chosen_korean: 줄
  alternatives_korean:
  - 밧줄
  - 갈대줄
  - 갈대
  lexicon: HALOT
  rationale: 직역상의 ‘갈대/골풀’보다, 이 문맥에서 바다짐승을 제어하는 기능을 드러내는 ‘줄’이 한국어로 더 자연스럽고, 영어 POB의 기능적 해석과도 맞습니다.
- source_word: בְּאַפּוֹ
  english_pob_choice: through his nose
  chosen_korean: 그의 코에
  alternatives_korean:
  - 그의 콧구멍에
  - 그의 코를 통해
  lexicon: HALOT
  rationale: 히브리어 אַף는 코/콧구멍을 가리키며, 한국어에서는 ‘코에’가 가장 직접적이고 과도하게 해부학적이지 않은 대응입니다.
- source_word: לֶחֱיוֹ
  english_pob_choice: his jaw
  chosen_korean: 그의 턱
  alternatives_korean:
  - 그의 뺨
  - 그의 볼
  lexicon: HALOT
  rationale: לְחִי의 ‘뺨/턱’ 중, 갈고리를 걸어 제어한다는 이미지에는 ‘턱’이 더 강하고 분명합니다.
theological_decisions:
- issue: 수사적 도전문의 직설성
  chosen_reading: 신의 힘으로 리워야단을 제어할 수 있는지 묻는 도전적 수사문을 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘할 수 있습니까’로 낮추는 번역
  - 설명적으로 풀어 쓰는 번역
  rationale: 이 절은 하나님의 창조권 앞에서 인간의 무력함을 드러내는 논박이므로, 한국어도 직설적 수사문을 유지해야 원문의 압박감이 살아납니다.
  doctrine_reference: 욥기 40장 문맥상 하나님의 주권과 인간의 한계를 드러내는 신학
