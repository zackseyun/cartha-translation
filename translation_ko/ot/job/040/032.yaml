    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים עָלָיו כַּפֶּךָ
  english_pob_choice: Lay your hand on him
  chosen_korean: 손을 그에게 대어 보십시오
  alternatives_korean:
  - 손을 그 위에 놓으십시오
  - 손을 그에게 얹어 보십시오
  lexicon: HALOT
  rationale: שׂים + עַל + כַּף는 문자적으로는 ‘손을 얹다’이지만, 한국어에서는 명령의 압박감과 행위성을 살리기 위해 ‘손을 대다’가 가장 자연스럽습니다.
- source_word: זְכֹר מִלְחָמָה
  english_pob_choice: remember the battle
  chosen_korean: 전투를 기억하십시오
  alternatives_korean:
  - 그 싸움을 기억하십시오
  - 전쟁을 기억하십시오
  lexicon: HALOT
  rationale: מִלְחָמָה는 일반적인 ‘싸움’보다 더 강한 전투/전쟁의 뉘앙스가 있어, 대결의 긴박함을 살려 ‘전투’로 옮겼습니다.
- source_word: אַל תּוֹסַף
  english_pob_choice: you will not do it again
  chosen_korean: 다시는 그러지 못하실 것입니다
  alternatives_korean:
  - 다시는 하지 못할 것입니다
  - 다시는 그것을 반복하지 못할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘더하지 말라’이지만, 문맥상 레비아단에게 손을 대려는 시도를 다시 반복하지 못한다는 관용적 뜻이므로, 한국어에서는 결과적·예측적 의미를 반영했습니다.
theological_decisions:
- issue: 이 절의 어조가 단순 금지인지, 패배를 전제한 예고인지
  chosen_reading: 명령 뒤에 이어지는 결과 진술로 이해하여, 욥이 다시는 같은 공격을 시도하지 못할 것이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 단순히 ‘다시는 그러지 마십시오’로 이해
  - ‘더 이상 더하지 마십시오’처럼 문자적으로 이해
  rationale: 히브리어 אַל תּוֹסַף는 형식상 부정 명령이지만, 영어 POB의 audit trail처럼 관용적으로는 ‘반복하지 못할 것이다’라는 예고적 의미가 강합니다.
  doctrine_reference: 문맥적 관용구 해석
