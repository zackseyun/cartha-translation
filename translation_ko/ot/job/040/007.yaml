lexical_decisions:
- source_word: אֱזָר נָא
  english_pob_choice: Now gird up
  chosen_korean: 이제 허리를 동이십시오
  alternatives_korean:
  - 이제 허리띠를 매십시오
  - 이제 준비하십시오
  lexicon: HALOT
  rationale: אזר의 구체적 관용구를 살리기 위해 ‘허리를 동이다’로 옮기고, נָא는 문맥상 간절한 요청이 아니라 즉각적 촉구이므로 ‘이제’로 반영했습니다.
- source_word: כְגֶבֶר
  english_pob_choice: like a man
  chosen_korean: 사람답게
  alternatives_korean:
  - 한 남자처럼
  - 남자답게
  lexicon: HALOT
  rationale: 직역하면 ‘남자처럼’이지만, 한국어에서는 도전적 대비를 자연스럽게 살리면서도 성별 표지를 유지하는 ‘사람답게’가 문맥의 강한 요구를 잘 드러냅니다.
- source_word: חֲלָצֶיךָ
  english_pob_choice: your loins
  chosen_korean: 허리
  alternatives_korean:
  - 몸통
  - 요대
  lexicon: HALOT
  rationale: ‘허리’는 한국어에서 ‘허리를 동이다’ 관용구를 살릴 수 있는 가장 자연스러운 대응어이며, 신체 은유를 크게 훼손하지 않습니다.
- source_word: אֶשְׁאָלְךָ וְהוֹדִיעֵנִי
  english_pob_choice: I will question you, and you shall make it known to me
  chosen_korean: 제가 당신에게 질문하겠습니다. 당신은 제게 그것을 알려야 합니다
  alternatives_korean:
  - 제가 당신에게 물어보겠습니다. 당신은 제게 답해야 합니다
  - 제가 당신에게 캐묻겠습니다. 당신은 제게 밝혀야 합니다
  lexicon: HALOT
  rationale: שאל은 단순한 ‘묻다’보다 심문적 뉘앙스가 있어 ‘질문하다’로, Hiphil ידע는 ‘알게 하다/알려 주다’의 사역 의미를 살려 ‘알려야 합니다’로 옮겼습니다.
theological_decisions:
