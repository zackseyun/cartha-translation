  rationale: 직역하면 민족명처럼 보이지만, 본문과 POB 주석이 가리키듯 상업적 용례가 더 적절하므로 독자가 문맥을 즉시 이해하도록 ‘상인들’로 본문을 옮겼습니다.
  doctrine_reference: 문맥 우선의 직역 원칙
- issue: 첫 절의 수사적 질문 어조
  chosen_reading: 두 개의 반문을 유지했습니다.
  alternative_readings:
