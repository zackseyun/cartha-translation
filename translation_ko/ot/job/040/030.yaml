translation:
  language: ko
  text: 장사꾼들이 그를 두고 흥정하겠습니까?[a] 그들이 그를 상인들 사이에 분배하겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동료들이 그를 두고 잔치를 벌이겠습니까?’ 히브리어 첫 절은 어렵고, 일부는 חַבָּרִים를 상업적 의미가 아닌 것으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘가나안 사람들’이지만, 문맥상 여기서는 ‘상인들’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ עָלָיו
  english_pob_choice: Will traders bargain over him?
  chosen_korean: 그를 두고 흥정하겠습니까?
  alternatives_korean:
  - 그를 두고 거래하겠습니까?
  - 그를 두고 값을 흥정하겠습니까?
  lexicon: HALOT
  rationale: כּרה의 문자적 ‘파다’보다 이 문맥의 상업적 관용 의미를 살려, 영어 POB의 bargain에 맞는 ‘흥정하다’로 옮겼습니다.
- source_word: חַבָּרִים
  english_pob_choice: traders
  chosen_korean: 상인들
  alternatives_korean:
  - 동료들
  - 무리들
  - 거래상들
  lexicon: HALOT
  rationale: 문맥상 시장/거래의 장면이므로, POB의 traders를 자연스러운 한국어 ‘상인들’로 옮겼습니다.
- source_word: יֶחֱצוּהוּ בֵּין כְּנַעֲנִים
  english_pob_choice: Will they divide him among the merchants?
  chosen_korean: 그를 상인들 사이에 나누어 가지겠습니까?
  alternatives_korean:
  - 그를 상인들 가운데 분배하겠습니까?
  - 그를 상인들 사이에 나누겠습니까?
  lexicon: HALOT
  rationale: חצה의 ‘나누다/분배하다’와 בין의 ‘among’을 살리면서, 한국어에서는 거래 대상의 분배를 자연스럽게 드러내기 위해 ‘나누어 가지다’를 택했습니다.
theological_decisions:
- issue: כְּנַעֲנִים의 처리
