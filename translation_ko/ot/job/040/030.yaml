  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
  footnotes:
  - marker: a
    text: Or 'Will companions feast on him?' The Hebrew of the first clause is difficult, and some take חַבָּרִים in a non-commercial sense.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Canaanites'; in context this likely means 'merchants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 상인들이 그를 두고 흥정하겠습니까? 그를 상인들 사이에 나누어 가지겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 동료들이 먹이로 삼겠습니까?’ 히브리어 첫 절은 어렵고, 일부는 חַבָּרִים를 상업적 의미가 아닌 것으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘가나안 사람들’이지만, 문맥상 여기서는 ‘상인들’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ עָלָיו
  english_pob_choice: Will traders bargain over him?
  chosen_korean: 그를 두고 흥정하겠습니까?
  alternatives_korean:
  - 그를 두고 거래하겠습니까?
  - 그를 두고 값을 흥정하겠습니까?
  lexicon: HALOT
  rationale: כּרה의 문자적 ‘파다’보다 이 문맥의 상업적 관용 의미를 살려, 영어 POB의 bargain에 맞는 ‘흥정하다’로 옮겼습니다.
- source_word: חַבָּרִים
  english_pob_choice: traders
  chosen_korean: 상인들
  alternatives_korean:
  - 동료들
  - 무리들
  - 거래상들
  lexicon: HALOT
  rationale: 문맥상 시장/거래의 장면이므로, POB의 traders를 자연스러운 한국어 ‘상인들’로 옮겼습니다.
- source_word: יֶחֱצוּהוּ בֵּין כְּנַעֲנִים
  english_pob_choice: Will they divide him among the merchants?
  chosen_korean: 그를 상인들 사이에 나누어 가지겠습니까?
  alternatives_korean:
  - 그를 상인들 가운데 분배하겠습니까?
  - 그를 상인들 사이에 나누겠습니까?
  lexicon: HALOT
  rationale: חצה의 ‘나누다/분배하다’와 בין의 ‘among’을 살리면서, 한국어에서는 거래 대상의 분배를 자연스럽게 드러내기 위해 ‘나누어 가지다’를 택했습니다.
theological_decisions:
- issue: כְּנַעֲנִים의 처리
  chosen_reading: 상인들
  alternative_readings:
  - 가나안 사람들
  - 가나안인들
  rationale: 직역하면 민족명처럼 보이지만, 본문과 POB 주석이 가리키듯 상업적 용례가 더 적절하므로 독자가 문맥을 즉시 이해하도록 ‘상인들’로 본문을 옮겼습니다.
  doctrine_reference: 문맥 우선의 직역 원칙
- issue: 첫 절의 수사적 질문 어조
  chosen_reading: 두 개의 반문을 유지했습니다.
  alternative_readings:
  - 서술문으로 완화
  rationale: 본문의 조롱 섞인 반문 구조를 보존해야 하므로, 한국어에서도 질문 형태를 유지했습니다.
  doctrine_reference: 문학적 수사 보존
