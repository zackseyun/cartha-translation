id: JOB.40.16
reference: Job 40:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
  footnotes:
  - marker: a
    text: Or 'his vigor' for 'his power'; the Hebrew parallelism uses two closely related terms for bodily strength.
    reason: lexical_alternative
  - marker: b
    text: Or 'sinews of his belly' for 'muscles of his belly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그의 힘은 허리에 있고 그의 능력은 배의 근육에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 기력'로도 옮길 수 있습니다. 히브리어 평행법에서 두 표현은 서로 아주 가까운 신체적 힘을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '배의 힘줄'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 이제
  - 자, 보십시오
  lexicon: HALOT
  rationale: הִנֵּה נָא의 주목을 끄는 뉘앙스를 자연스러운 현대 한국어 명령형으로 살렸습니다. '보십시오'는 문맥의 즉시성과 시각적 지시를 전달하면서도 합쇼체를 유지합니다.
- source_word: כֹחוֹ
  english_pob_choice: his strength
  chosen_korean: 그의 힘
  alternatives_korean:
  - 그의 능력
  - 그의 강함
  lexicon: HALOT
  rationale: כֹחַ는 물리적 힘과 역량을 함께 가질 수 있지만, 여기서는 몸의 구조를 말하므로 '힘'이 가장 직접적입니다.
- source_word: בְמָתְנָיו
  english_pob_choice: in his loins
  chosen_korean: 허리에
  alternatives_korean:
  - 허벅지에
  - 엉덩이에
  lexicon: HALOT
  rationale: מָתְנַיִם은 허리/등허리 쪽을 가리키는 신체어로, 한국어에서는 '허리'가 가장 넓고 자연스러운 대응어입니다.
- source_word: וְאֹנוֹ
  english_pob_choice: and his power
  chosen_korean: 그의 능력
  alternatives_korean:
  - 그의 힘
  - 그의 기력
  lexicon: HALOT
  rationale: אוֹן은 힘, 기력, 생식력까지 아우를 수 있으나 병렬 구조상 כֹחַ와의 반복을 피하기 위해 '능력'으로 옮겨 두 용어의 근접한 의미를 살렸습니다.
- source_word: בִּשְׁרִירֵי בִטְנוֹ
  english_pob_choice: in the muscles of his belly
  chosen_korean: 배의 근육에
  alternatives_korean:
  - 배의 힘줄에
  - 배의 힘센 부분에
  lexicon: HALOT
  rationale: שְׁרִירִים은 근육/힘줄/단단한 살을 가리킬 수 있는데, POB의 주석처럼 해부학적 의미를 살려 '근육'으로 옮겼습니다. בֶּטֶן은 여기서 몸통의 배를 뜻하므로 '배'가 자연스럽습니다.
theological_decisions:
- issue: 욥기의 도전적 신체 묘사 어휘를 현대어로 얼마나 직접적으로 드러낼지
  chosen_reading: 전통적 완곡어법보다 본문이 말하는 신체 부위를 직접 드러내되, 과도한 노골화는 피했습니다.
  alternative_readings:
  - '''사타구니''로 더 좁게 구체화'
  - '''엉덩이''로 완곡하게 처리'
  rationale: 본문은 거대한 짐승의 체력을 묘사하는 시적 병행법이므로, 신체어를 직접 번역해야 대비와 강조가 살아납니다. 동시에 현대 한국어에서 불필요한 자극이 되지 않도록 표준적 해부학 어휘를 선택했습니다.
  doctrine_reference: 시적 본문 번역 원칙
