base_translation:
  language: en
  yaml_path: translation/ot/job/040/018.yaml
  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
  footnotes:
  - marker: a
    text: Or 'channels of bronze' for אֲפִיקֵי נְחוּשָׁה; the Hebrew image may emphasize conduits/shafts rather than specifically 'tubes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his bones are like castings/bars of iron' for גְּרָמָיו כִּמְטִיל בַּרְזֶל; גְּרָמָיו may also be rendered 'his bones,' preserving the tighter parallel with the first line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뼈는 청동의 관들이며, 그의 팔다리는 쇠 막대와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관들’은 אֲפִיקֵי נְחוּשָׁה의 이미지를 한국어로 풀어 옮긴 것으로, 문자적으로는 ‘통로들/도관들’에 가까울 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쇠 막대’는 כִּמְטִיל בַּרְזֶל의 주조된 금속물 이미지를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  english_pob_choice: his bones
  chosen_korean: 그의 뼈
  alternatives_korean:
  - 그의 골격
  - 그의 몸뚱이
  lexicon: HALOT
  rationale: 히브리어 עֶצֶם의 기본 뜻은 ‘뼈’이므로, 첫째 행은 해부학적 직역을 유지하는 것이 원문 이미지에 가장 가깝습니다.
- source_word: אֲפִיקֵי
