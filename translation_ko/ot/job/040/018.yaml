  rationale: POB가 지적하듯 이 표현은 ‘통로/도관’의 이미지를 가질 수 있지만, 한국어에서는 청동의 견고한 원통형 구조를 자연스럽게 살리는 ‘관들’이 가장 무난합니다.
- source_word: גְּרָמָיו
  english_pob_choice: his limbs
  chosen_korean: 그의 팔다리
  alternatives_korean:
  - 그의 뼈
  - 그의 몸
  lexicon: HALOT
  rationale: 두 번째 행에서 같은 ‘뼈’를 반복하면 평행시의 변주가 약해지므로, 신체의 강건함을 살리면서도 첫 행과 구별되는 ‘팔다리’로 옮겼습니다.
- source_word: כִּמְטִיל בַּרְזֶל
  english_pob_choice: like bars of iron
  chosen_korean: 쇠 막대와 같습니다
  alternatives_korean:
  - 철 막대와 같습니다
  - 쇠덩이와 같습니다
  lexicon: HALOT
  rationale: מְטִיל은 단순한 ‘막대’보다 금속을 주조한 덩이/봉의 느낌을 갖지만, 한국어에서 ‘쇠 막대’가 강하고 단단한 금속성 이미지를 가장 자연스럽게 전달합니다.
