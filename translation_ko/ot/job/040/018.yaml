    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뼈는 청동 관들이며,[a] 그의 뼈는 쇠 막대와 같습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청동 관들’은 אֲפִיקֵי נְחוּשָׁה를 옮긴 것으로, 문자적으로는 ‘청동의 통로들’ 또는 ‘청동의 도관들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 뼈’로 옮긴 גְּרָמָיו는 ‘그의 골격’으로도 이해될 수 있습니다. ‘쇠 막대’는 כִּמְטִיל בַּרְזֶל의 주조되거나 형성된 철 금속물의 이미지를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
