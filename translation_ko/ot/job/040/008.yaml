  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
  footnotes:
  - marker: a
    text: Or 'my judgment.' The Hebrew mishpati can denote judgment, justice, or legal right.
    reason: lexical_alternative
translation:
  language: ko
  text: 아예 내 공의를 무효로 하시겠습니까? 나를 정죄하여 당신이 의롭다 함을 받으시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 판단.’ 히브리어 미슈파트(מִשְׁפָּט)는 판단, 공의, 법적 권리를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֭/אַף תָּפֵר
  english_pob_choice: Would you even annul
  chosen_korean: 아예 … 무효로 하시겠습니까?
  alternatives_korean:
  - 정말 … 무효로 하시겠습니까?
  - 심지어 … 폐기하시겠습니까?
  - 무효화하시겠습니까?
  lexicon: HALOT
  rationale: אַף의 강한 강조를 ‘아예’로 살리고, תָּפֵר의 법정적 ‘nullify/annul’ 의미를 ‘무효로 하다’로 자연스럽게 옮겼습니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 내 공의
  alternatives_korean:
  - 내 판단
  - 내 판결
  - 내 정의
  lexicon: HALOT
  rationale: 문맥상 משפט는 단순한 한 번의 판결보다 하나님의 न्याय/공의의 질서를 가리키므로, POB의 ‘my justice’를 살려 ‘내 공의’로 옮겼습니다.
- source_word: תַּ֝רְשִׁיעֵ֗נִי
  english_pob_choice: condemn me
  chosen_korean: 나를 정죄하여
  alternatives_korean:
  - 나를 유죄로 판정하여
  - 나를 악하다고 판정하여
  lexicon: HALOT
  rationale: רשע의 Hiphil 법정적 의미를 따라 ‘정죄하다’로 옮겨, 앞의 ‘무효로 하다’와 대응하는 재판 어휘를 유지했습니다.
- source_word: תִּצְדָּֽק
  english_pob_choice: you may be justified
  chosen_korean: 당신이 의롭다 함을 받으시겠습니까
  alternatives_korean:
  - 당신이 의롭다 여겨지시겠습니까
  - 당신이 옳다 함을 받으시겠습니까
  lexicon: HALOT
  rationale: צדק의 법정적 의미를 살려 수동형 표현인 ‘의롭다 함을 받다’로 옮겼고, 문장의 역설적 목적절을 한국어에서 자연스럽게 연결했습니다.
theological_decisions:
- issue: 욥기의 법정적 수사 보존
  chosen_reading: 전체 문장을 ‘공의/정죄/의롭다 함’의 재판 언어로 유지했습니다.
  alternative_readings:
  - 도덕적 비난 중심의 표현으로 완화함
  - ‘판단’ 중심으로 일반화함
  rationale: 히브리어 משפט, רשע, צדק이 모두 법정적·공적 의미를 띠므로, 하나님의 공의에 대한 욥의 도전이라는 긴장을 약화시키지 않기 위해 법정 언어를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
