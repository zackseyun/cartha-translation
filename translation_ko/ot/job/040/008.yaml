review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the interrogative form, the judicial sequence of nullifying God's mishpat, condemning God, and thereby being shown right, and it retains the lexical ambiguity of מִשְׁפָּטִי in a note. However, ‘아예’ normally means ‘altogether/from the outset’ in modern Korean, not the intensifying ‘even/indeed’ of הַאַף. The passive construction ‘의롭다 함을 받다’ is also less direct than the forensic sense ‘be recognized as right.’
  naturalness: ‘정녕’ supplies the solemn rhetorical emphasis naturally in formal Korean. ‘당신이 옳다고 인정받으시겠습니까?’ is idiomatic, maintains the courtroom frame, and expresses the result/purpose of the preceding condemnation without importing a doctrinal sense of justification.
  terminology: ‘공의’ and ‘정죄’ suitably retain the judicial-moral register. The footnote appropriately records ‘내 판단’ as a viable alternative for מִשְׁפָּטִי; ‘법적 권리’ accurately reflects another lexical possibility.
  issues:
  - severity: medium
    issue: ‘아예’ does not accurately render הַאַף.
    rationale: In contemporary Korean, ‘아예’ usually conveys ‘entirely’ or ‘from the beginning,’ whereas the Hebrew interrogative-plus-אַף conveys emphatic ‘indeed/even.’ ‘정녕’ better preserves the rhetorical force.
  - severity: low
    issue: ‘의롭다 함을 받으시겠습니까?’ is unnecessarily indirect.
    rationale: תִּצְדָּק denotes being in the right/being vindicated in this forensic setting. ‘옳다고 인정받으시겠습니까?’ is more natural formal Korean while preserving that legal sense.
  revised_text: 정녕 내 공의를 무효로 하시겠습니까? 나를 정죄하여 당신이 옳다고 인정받으시겠습니까?[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘내 판단.’ 히브리어 미슈파트(מִשְׁפָּט)는 판단, 공의, 법적 권리를 뜻할 수 있습니다.
    reason: lexical_alternative
