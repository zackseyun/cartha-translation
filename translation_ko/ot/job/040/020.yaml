translation:
  language: ko
  text: 이는 산들이 그를 위하여 먹을 것을 내고, 모든 들짐승이 거기서 놉니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들이 그를 위하여 산출물을 냅니다’.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘들의 모든 짐승이 거기서 놉니다’.'
    reason: previous_rendering
lexical_decisions:
- source_word: בּוּל הָרִים יִשְׂאוּ לוֹ
  english_pob_choice: the mountains bear food for him
  chosen_korean: 산들이 그를 위하여 먹을 것을 냅니다
  alternatives_korean:
  - 산들이 그를 위하여 산출물을 냅니다
  - 산들이 그를 위하여 먹이를 냅니다
  - 산들이 그를 위하여 열매를 냅니다
  lexicon: HALOT
  rationale: בּוּל은 산의 생산물·수확물을 가리킬 수 있지만, 문맥상 그가 산에서 얻는 공급을 말하므로 ‘먹을 것을 내다’가 의미를 가장 자연스럽게 전달합니다.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  english_pob_choice: all the wild animals of the field
  chosen_korean: 들의 모든 들짐승
  alternatives_korean:
  - 들의 모든 들짐승
  - 야생의 모든 짐승
  - 들의 모든 짐승
  lexicon: HALOT
  rationale: חַיַּת הַשָּׂדֶה는 ‘들판의 짐승들’, 곧 들짐승을 뜻하므로 현대어로는 ‘들짐승’이 가장 간결하고 자연스럽습니다.
- source_word: יְשַׂחֲקוּ
  english_pob_choice: play
  chosen_korean: 놉니다
  alternatives_korean:
  - 뛰놉니다
  - 장난칩니다
  - 즐겁게 놉니다
  lexicon: HALOT
  rationale: שׂחק의 기본 의미는 ‘놀다/장난하다’이므로, 문맥의 유희적 움직임을 살리면서도 과도하게 장식적이지 않은 ‘놉니다’를 택했습니다.
theological_decisions:
- issue: 시적 진술의 직설성 보존
  chosen_reading: 산들이 그를 위하여 먹을 것을 내고, 들짐승들이 거기서 놉니다라는 두 병렬 진술을 그대로 살렸습니다.
  alternative_readings:
  - 산들은 그에게 먹이를 주고…
  - 산들은 그를 먹여 살리고…
  rationale: 본문은 비유적 의인화를 통해 자연이 그에게 공급하고 그 자리가 들짐승의 놀이터임을 말하므로, 설명을 덧붙이기보다 시적 병렬을 유지하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 시문 해석 원칙
