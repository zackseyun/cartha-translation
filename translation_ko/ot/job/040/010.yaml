  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
  footnotes:
  - marker: a
    text: Or 'Deck yourself now with pride and dignity; clothe yourself with glory and majesty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 자신을, 부디, 위엄과 높음으로 꾸미고, 찬란함과 존귀함을 입으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이제 교만과 존귀로 단장하고, 영광과 위엄을 입으십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדֵה
  english_pob_choice: Adorn yourself
  chosen_korean: 꾸미고
  alternatives_korean:
  - 단장하고
  - 장식하고
  lexicon: HALOT
  rationale: 반사적 명령형의 장식/단장 의미를 살리되, 현대 한국어에서 자연스럽고 뒤의 ‘입으십시오’와도 잘 어울리는 표현으로 옮겼습니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 지금
  - 제발
  lexicon: HALOT
  rationale: 간청·강조의 뉘앙스를 합쇼체에서 가장 무리 없이 살릴 수 있는 말로, 구어적이면서도 공손한 ‘부디’를 택했습니다.
- source_word: גָּאוֹן וָגֹבַהּ
  english_pob_choice: majesty and loftiness
  chosen_korean: 위엄과 높음
  alternatives_korean:
  - 위엄과 높이
  - 장엄과 높음
  - 교만과 높음
  lexicon: HALOT
  rationale: 문맥상 부정적 ‘교만’이 아니라 하나님의 도전 속 장엄한 위상을 가리키므로, regal grandeur를 드러내는 ‘위엄’과 문자적 대응이 가능한 ‘높음’을 배치했습니다.
- source_word: וְהוֹד וְהָדָר
  english_pob_choice: splendor and honor
  chosen_korean: 찬란함과 존귀함
  alternatives_korean:
  - 광채와 존귀
  - 영광과 위엄
  - 찬란함과 위엄
  lexicon: HALOT
  rationale: הוֹד의 눈에 보이는 화려함과 הָדָר의 품위·존귀를 구분해 살리기 위해, 중복을 피하면서도 시적 병렬을 유지하는 표현을 선택했습니다.
theological_decisions:
- issue: גָּאוֹן/גֹּבַהּ를 죄된 교만으로 읽을지, 위엄과 장엄함으로 읽을지
  chosen_reading: 이 절은 욥에게 하나님의 권능에 준하는 장엄함을 ‘입어 보라’는 도전이므로, 부정적 도덕 평가가 아니라 왕적·신적 위엄의 어휘로 읽었습니다.
  alternative_readings:
  - 교만과 높이로 읽는 해석
  - 자기 과시를 풍자적으로 요구하는 해석
  rationale: 문맥의 의문·도전적 명령과 의복 은유가 결합되어, 여기서는 도덕적 비난보다 초월적 위엄의 축적을 보여 줍니다.
  doctrine_reference: 하나님의 초월성과 피조물의 한계에 대한 문맥적 강조
