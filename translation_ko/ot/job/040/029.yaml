review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 수사 의문문, ‘놀다’(שׂחק), ‘묶다/매다’(קשר), 그리고 여성 복수 대상(נַעֲרוֹת)을 전반적으로 충실히 옮겼습니다. 다만 ‘그것을 새처럼 가지고 놀다’는 한국어에서 리워야단 자체가 새처럼 논다는 뜻으로도 읽힐 수 있어, ‘새와 놀듯이’로 비교의 대상을 분명히 하는 것이 안전합니다.
  naturalness: 초안의 합쇼체는 적절합니다. 그러나 ‘새처럼 가지고 놀다’의 수식 범위가 다소 불명확하므로, ‘새와 놀듯이 그것과 놀다’가 더 자연스럽고 의미가 분명합니다. ‘매어 두다’는 동물을 묶어 두는 맥락에 자연스럽습니다.
  terminology: ‘소녀들’은 נַעֲרוֹת의 가능한 현대어 번역입니다. 이 말이 딸인지, 집안의 젊은 여성들인지 본문만으로 특정되지 않으므로 소유 표현을 유지하고 각주에서 대안을 제시하는 것이 적절합니다. 리워야단을 가리키는 히브리어 남성 단수 접미사는 한국어 본문에서 중립적인 ‘그것’으로 자연스럽게 처리할 수 있으나, 각주는 실제 번역 대안을 밝혀야 합니다.
