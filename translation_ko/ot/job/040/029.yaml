  text: הַֽ/תְשַׂחֶק בּ֭/וֹ כַּ/צִּפּ֑וֹר וְ֝/תִקְשְׁרֶ֗/נּוּ לְ/נַעֲרוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/029.yaml
  text: Will you play with him like a bird[b][a], or tie him up for your girls?
  footnotes:
  - marker: a
    text: Or 'with it' instead of 'with him'; the Hebrew uses a masculine singular pronoun referring to Leviathan.
    reason: lexical_alternative
  - marker: b
    text: Or 'for your maidens' or 'for your young women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 새와 놀듯이 그것과[a] 놀 수 있겠습니까? 아니면 그것을 당신의 소녀들을[b] 위해 매어 둘 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 리워야단을 가리키는 남성 단수 대명사를 사용합니다. ‘그와’ 또는 ‘그를’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘젊은 여자들’ 또는 ‘처녀들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  english_pob_choice: Will you play
  chosen_korean: 가지고 놀 수 있습니까
  alternatives_korean:
  - 놀 수 있습니까
  - 희롱할 수 있습니까
  - 장난칠 수 있습니까
  lexicon: HALOT
  rationale: שׂחק의 ‘놀이/장난’ 뜻을 살리되, 현대 한국어에서 대상을 도구처럼 다루는 뉘앙스를 가장 자연스럽게 드러내기 위해 ‘가지고 놀다’를 택했습니다.
- source_word: בּוֹ
  english_pob_choice: with him
  chosen_korean: 그것
  alternatives_korean:
  - 그를
  - 그것을
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 대명사를 쓰지만, 리워야단을 한국어에서 동물/괴물 대상으로 자연스럽게 지시하기 위해 중립적 ‘그것’을 본문에 두고, 남성 단수 지시라는 긴장은 주석 없이 본문에서 과도하게 살리지 않았습니다.
- source_word: וְתִקְשְׁרֶנּוּ
  english_pob_choice: or tie him up
  chosen_korean: 묶어 둘 수 있습니까
  alternatives_korean:
  - 묶을 수 있습니까
  - 결박할 수 있습니까
  - 매어 둘 수 있습니까
  lexicon: HALOT
  rationale: קשר의 ‘묶다/결박하다’ 가운데, 가축이나 장난감처럼 다루는 장면을 살리는 현대적 표현으로 ‘묶어 두다’를 선택했습니다.
- source_word: לְנַעֲרוֹתֶיךָ
  english_pob_choice: for your girls
  chosen_korean: 당신의 소녀들을 위해
  alternatives_korean:
  - 당신의 하녀들을 위해
  - 당신의 젊은 여자들을 위해
  - 당신의 처녀들을 위해
  lexicon: HALOT
  rationale: נַעֲרוֹת는 ‘어린 여자들/소녀들’의 복수로, POB의 ‘girls’를 따라 자연스러운 현대어 ‘소녀들’을 사용했습니다. '하녀들'은 사회적 신분을 지나치게 암시하므로 배제했습니다.
theological_decisions:
- issue: 리워야단을 향한 수사적 질문의 난감한 비유
  chosen_reading: 본문을 문자적 가능성보다 조롱 섞인 수사적 질문으로 읽고, ‘가지고 놀다/묶어 두다’의 유희적·가정적 이미지를 유지했습니다.
  alternative_readings:
  - 실제 조련 가능성을 강하게 드러내는 읽기
  - 비유적 과장으로만 약화시키는 읽기
  rationale: 문맥상 하나님은 욥의 무력함을 드러내기 위해 리워야단을 반려동물처럼 다루는 상상을 제시하므로, 과장된 수사와 가정적 이미지를 동시에 보존하는 쪽이 소스에 가장 가깝습니다.
  doctrine_reference: 욥기 40장 문맥의 하나님의 수사적 반문
- issue: 남성 단수 대명사와 한국어 대명사의 처리
  chosen_reading: 히브리어의 남성 단수 지시를 인정하되 한국어 본문에서는 성별을 드러내는 대명사보다 대상 지시의 자연스러움을 우선했습니다.
  alternative_readings:
  - ‘그를’로 직역
  - ‘그것을’로 완전 중립화
  rationale: 한국어에서 리워야단은 성별보다 존재 유형이 더 중요하므로, 본문 가독성을 해치지 않는 범위에서 중립적 지시를 선택했습니다.
  doctrine_reference: 원어 지시어의 문체 재현 원칙
