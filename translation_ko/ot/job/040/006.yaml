lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: Then ... answered
  chosen_korean: 그때 ... 대답하시며
  alternatives_korean:
  - 그리고 ... 대답하시며
  - 응답하시며
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속형을 한국어에서는 자연스러운 시간 연결어 ‘그때’로 옮기고, ענה는 이 문맥에서 ‘대답하다’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명 표기를 보존하기 위해 전통적 대체어 ‘주님’이 아니라 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: מִן סְעָרָה
  english_pob_choice: out of the storm
  chosen_korean: 폭풍 속에서
  alternatives_korean:
  - 폭풍에서
  - 회오리바람 속에서
  - 소용돌이 속에서
  lexicon: HALOT
  rationale: סְעָרָה는 폭풍·회오리바람·격랑을 포괄하므로, 신현적 분위기를 살리면서도 현대 한국어로 자연스러운 ‘폭풍 속에서’로 옮겼습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: 'and said:'
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 직접화법을 예고하는 서술 동사로서 한국어 성경 문체에 자연스러운 ‘말씀하셨습니다’를 선택했습니다.
theological_decisions:
- issue: 하나님의 음성이 폭풍/회오리바람 가운데서 들린다는 신현 묘사
  chosen_reading: ‘폭풍 속에서’로 번역해 장면의 위엄과 직접성을 유지했습니다.
  alternative_readings:
  - ‘회오리바람에서’로 더 직역함
  - ‘폭풍우 가운데서’로 완화함
  rationale: ‘폭풍’은 סְעָרָה의 의미 범위를 충분히 담으면서도 현대 독자가 이해하기 쉽고, 하나님의 현현적 발화라는 긴장감을 보존합니다.
  doctrine_reference: 욥기 38–42장의 신현 묘사
