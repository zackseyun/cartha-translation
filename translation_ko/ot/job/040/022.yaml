  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
  footnotes:
  - marker: a
    text: Or 'shade trees' for צֶאֱלִים; the precise botanical identification is uncertain, though 'lotus trees' is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'the poplars of the wadi' for עַרְבֵי נָחַל.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 연못의 나무들이 그를 그늘로 덮고, 시내의 버드나무들이 그를 둘러싸고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: צֶאֱלִים은 식물 동정이 확실하지 않아, 전통적으로는 '연꽃나무들(lotus trees)'로 옮기지만 문맥상 '그늘나무들'로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: עַרְבֵי נָחַל은 '시내의 버드나무들'로도, 또는 '와디의 포플러들'로도 옮길 수 있습니다.
    reason: lexical_alternative
