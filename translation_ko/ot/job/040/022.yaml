translation:
  language: ko
  text: 연꽃나무들이[a] 그늘로 그를 덮고, 시내의 버드나무들이[b] 그를 둘러싸고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֶאֱלִים의 정확한 식물 동정은 확실하지 않습니다. 전통적으로는 ‘연꽃나무들’로 옮기며, ‘그늘나무들’로 이해할 수도 있습니다.
    reason: lexical_alternative
