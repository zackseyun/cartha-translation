  text: הַֽ/תְמַלֵּ֣א בְ/שֻׂכּ֣וֹת עוֹר֑/וֹ וּ/בְ/צִלְצַ֖ל דָּגִ֣ים רֹאשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
  footnotes:
  - marker: a
    text: Or 'with barbed irons' for 'with harpoons'; the Hebrew term is rare and may refer more generally to sharp or barbed hunting implements.
    reason: lexical_alternative
  - marker: b
    text: Or 'with fishing hooks'; the Hebrew expression may denote a fish-catching implement more generally, though 'fishing spears' best fits the parallel image here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 가죽을 작살로, 그의 머리를 물고기 창으로 채우시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바브가 달린 쇠붙이로'로 옮길 수 있습니다. 히브리어는 희귀어로, 보다 일반적으로 날카롭거나 가시가 있는 사냥 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '낚시 갈고리로'로 옮길 수 있습니다. 이 히브리어 표현은 더 넓게는 물고기를 잡는 도구를 가리킬 수 있지만, 여기서는 평행법상 '물고기 창'이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְמַלֵּא
  english_pob_choice: Can you fill
  chosen_korean: 채우시겠습니까?
  alternatives_korean:
  - 채우겠습니까?
  - 채울 수 있습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 도전적 뉘앙스를 살리기 위해 단순 미래보다 가능성 질문형을 택했고, 높임을 유지하면서도 문맥상 상대의 능력을 묻는 형태로 옮겼습니다.
- source_word: בְשֻׂכּוֹת
  english_pob_choice: with harpoons
  chosen_korean: 작살로
  alternatives_korean:
  - 쇠갈고리로
  - 바브가 달린 쇠붙이로
  - 갈고리로
  lexicon: HALOT
  rationale: 희귀어로서 뾰족하고 찌르는 사냥·어로 도구를 가리키며, 문맥의 공격적 이미지에는 '작살'이 가장 자연스럽고 구체적입니다.
- source_word: עוֹרוֹ
  english_pob_choice: his hide
  chosen_korean: 그의 가죽
  alternatives_korean:
  - 그의 피부
  - 그의 가죽피
  lexicon: HALOT
  rationale: 거대한 동물의 몸을 가리키는 구체적 이미지이므로, 중립적인 '피부'보다 '가죽'이 영어 POB의 'hide'와 더 잘 맞습니다.
- source_word: וּבְצִלְצַל דָּגִים
  english_pob_choice: with fishing spears
  chosen_korean: 물고기 창으로
  alternatives_korean:
  - 물고기 갈고리로
  - 낚시 창으로
  - 물고기 작살로
  lexicon: HALOT
  rationale: 직역하면 물고기와 관련된 도구이지만, 앞 절의 '작살'과 평행을 이루는 강한 공격 이미지를 살려 '물고기 창'으로 옮겼습니다.
theological_decisions:
- issue: 레위아탄을 향한 수사적 도전문의 어조
  chosen_reading: 번역문도 실제로 할 수 있는지 묻는 질문형으로 유지해, 인간의 무력함과 피조물 앞에서의 한계를 드러내는 문맥을 보존했습니다.
  alternative_readings:
  - 서술형으로 완화해 옮김
  - 단순한 과장으로 처리
  rationale: 이 절은 정보 전달보다 야훼의 창조 권능 앞에서 인간의 한계를 드러내는 도전이 핵심이므로, 질문의 압박감을 유지하는 것이 중요합니다.
  doctrine_reference: 욥기 40장 문맥의 창조주-피조물 대비
- issue: 희귀 어휘의 해석 불확정성
  chosen_reading: 본문의 핵심 이미지는 '뾰족한 찌름 도구'로 보되, 구체 명칭은 '작살'과 '물고기 창'으로 최소한의 구체화만 했습니다.
  alternative_readings:
  - 갈고리
  - 쇠갈고리
  - 낚시도구 일반
  rationale: 히브리어 희귀어는 의미 범위가 넓으므로, 과도한 특정화를 피하면서도 병렬 구조가 살아나도록 번역했습니다.
  doctrine_reference: 본문의 어휘적 불확실성 보존
