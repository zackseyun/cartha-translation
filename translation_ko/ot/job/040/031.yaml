  doctrine_reference: 욥기 40장 문맥의 창조주-피조물 대비
- issue: 희귀 어휘의 해석 불확정성
  chosen_reading: 본문의 핵심 이미지는 '뾰족한 찌름 도구'로 보되, 구체 명칭은 '작살'과 '물고기 창'으로 최소한의 구체화만 했습니다.
  alternative_readings:
