    text: 또는 ‘미늘 달린 쇠붙이’로 옮길 수 있습니다. 이 히브리어 낱말은 희귀어이며, 더 일반적으로 날카롭거나 미늘이 있는 사냥 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낚시 갈고리’로 옮길 수 있습니다. 이 히브리어 표현은 더 넓게 물고기를 잡는 도구를 가리킬 수 있지만, 여기서는 평행법상 ‘물고기잡이 창’이 더 잘 맞습니다.
    reason: lexical_alternative
