base_translation:
  language: en
  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
  footnotes:
  - marker: a
    text: Or, 'He is the chief of God's ways.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the final clause is difficult. It may mean 'only his Maker can approach him with the sword' or 'his Maker furnished him with his sword.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 하나님의 일들 가운데 첫째입니다. 그를 만드신 이만이 그의 칼을 가까이 가져갈 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 하나님의 길들 가운데 으뜸입니다.’
    reason: alternative_reading
  - marker: b
    text: 마지막 절의 히브리어는 어렵습니다. ‘그를 만드신 이만이 그의 칼을 가까이할 수 있다’ 또는 ‘그를 만드신 이가 그의 칼을 그에게 마련해 주었다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: the first
  chosen_korean: 첫째
  alternatives_korean:
  - 처음
  - 머리
  - 으뜸
  lexicon: HALOT
  rationale: 문맥상 창조된 존재들 가운데서의 우선성/첫째 자리를 가리키므로, ‘첫째’가 간결하게 그 우위를 살립니다.
- source_word: דַּרְכֵי אֵל
  english_pob_choice: of the works of God
  chosen_korean: 하나님의 일들 가운데
  alternatives_korean:
  - 하나님의 길들 가운데
  - 하나님의 행하신 일들 가운데
  lexicon: HALOT
  rationale: דֶּרֶךְ의 ‘길’ 의미를 그대로 살리면 한국어에서 뜻이 다소 흐려질 수 있어, 여기서는 창조 맥락에 맞는 ‘일들’로 풀어 자연스럽게 옮겼습니다.
- source_word: הָעֹשׂוֹ
  english_pob_choice: the one who made him
  chosen_korean: 그를 만드신 이
  alternatives_korean:
  - 그를 지으신 분
  - 그의 창조자
  lexicon: HALOT
  rationale: 분사구문과 목적어 접미사를 살려 ‘그를 만드신 이’로 옮기면, 원문의 관계적 표현과 주어의 지시를 함께 보존할 수 있습니다.
- source_word: יַגֵּשׁ חַרְבּוֹ
  english_pob_choice: bring near his sword
  chosen_korean: 그의 칼을 가까이 가져갈 수 있습니다
  alternatives_korean:
  - 그의 칼을 가까이할 수 있습니다
  - 그를 칼로 가까이할 수 있습니다
  lexicon: HALOT
  rationale: 히필 של נגשׁ의 ‘가까이 가져오다/가까이하게 하다’ 의미를 반영하되, 한국어에서는 동작의 가능성을 자연스럽게 나타내어 난해한 종결부의 긴장을 보존했습니다.
theological_decisions:
- issue: 난해한 마지막 절의 관계
  chosen_reading: 오직 그를 만드신 이만이 그의 칼을 가까이 가져갈 수 있다는 뜻으로 유지했습니다.
  alternative_readings:
  - 그에게 칼로 접근할 수 있다는 뜻
  - 그의 창조자가 그에게 칼을 공급했다는 뜻
  rationale: 히브리어가 압축되어 있어 해석이 갈리므로, 원문의 모호성을 줄이지 않고 가장 직접적인 관계만 드러내는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
