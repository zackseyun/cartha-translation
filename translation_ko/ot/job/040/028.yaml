base_translation:
  language: en
  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a slave forever?
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant with you,' a standard idiom meaning 'make a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'servant forever.' The Hebrew עֶבֶד can mean either 'servant' or 'slave'; 'slave' is preferred here because the context emphasizes permanent bonded status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 당신과 언약[a]을 맺겠습니까? 당신은 그를 영구히 노예[b]로 삼겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘당신과 언약을 자르다’이며, ‘언약을 맺다’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영구히 종으로’. 히브리어 עֶבֶד는 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다. 여기서는 영구적인 예속 상태가 강조되므로 ‘노예’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִכְרֹת בְּרִית
  english_pob_choice: Will he make a covenant
  chosen_korean: 언약을 맺겠습니까
  alternatives_korean:
  - 언약을 끊겠습니까
  - 언약을 맺을 수 있겠습니까
  lexicon: HALOT
  rationale: כרת בְּרִית는 관용적으로 ‘언약을 맺다/자르다’를 뜻하므로, 한국어에서는 자연스럽고 성서적 뉘앙스를 유지하는 ‘언약을 맺다’로 옮겼습니다.
- source_word: עִמָּךְ
  english_pob_choice: with you
  chosen_korean: 당신과
  alternatives_korean:
  - 당신과 함께
  - 그대와
  lexicon: HALOT
  rationale: 직접적인 전치사구이므로 현대 한국어에서 가장 자연스러운 ‘당신과’로 옮겼습니다.
- source_word: תִּקָּחֶנּוּ
  english_pob_choice: that you would take him
  chosen_korean: 그를 삼겠습니까
  alternatives_korean:
  - 그를 취하겠습니까
  - 그를 데려가겠습니까
  lexicon: HALOT
  rationale: 앞 절의 질문과 연결된 결과적/의도적 뉘앙스를 살려, ‘take’를 관계 설정의 의미가 드러나는 ‘삼다’로 옮겼습니다.
- source_word: לְעֶבֶד עוֹלָם
  english_pob_choice: as a slave forever
  chosen_korean: 영원한 노예로
  alternatives_korean:
  - 영원한 종으로
  - 영구히 종으로
  lexicon: HALOT
  rationale: POB의 판단처럼 עֶבֶד는 여기서 단순한 하인이 아니라 지속적 종속 상태를 가리키므로, 그 긴장감을 드러내기 위해 ‘노예’로 옮겼습니다. ‘עוֹלָם’은 지속성과 영속성을 담아 ‘영원한’으로 처리했습니다.
theological_decisions:
- issue: ‘slave’의 사회적 강도 반영
  chosen_reading: ‘노예’로 옮겨, 종속과 소유의 강한 의미를 드러냈습니다.
  alternative_readings:
  - 종
  - 사환
  rationale: 본문의 ‘for ever’와 결합된 עֶבֶד는 단순 봉사자가 아니라 지속적 예속 상태를 강조하므로, 완화된 표현보다 강한 사회적 의미를 살리는 것이 본문의 힘에 가깝습니다.
  doctrine_reference: 고대 근동의 언약/예속 언어에 대한 본문 중심 해석
