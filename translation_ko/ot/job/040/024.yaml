  source_fidelity: 원문의 두 미완료형을 수사적 질문으로 유지하고, בְעֵינָיו를 ‘그가 보는 앞에서’로 옮겨 영어 POB의 ‘before his eyes’ 및 히브리어의 문맥상 의미를 반영했습니다. 다만 원문에는 첫 질문의 행위자와 목적어가 모두 문맥상 보충되므로, 초안의 ‘그가 … 그를’은 지시 대상이 불필요하게 모호합니다.
  naturalness: 초안은 동일한 대명사 ‘그가/그의/그를’가 연이어 사용되어 누가 붙잡고 누가 붙잡히는지 한국어 독자가 즉시 파악하기 어렵습니다. ‘누가 그가 보는 앞에서 그를’로 바꾸면 피포획 대상은 ‘그’, 행위자는 ‘누가’로 분명해지며 현대 한국어 합쇼체의 수사적 질문으로 자연스럽습니다.
  terminology: ‘붙잡다’, ‘코를 뚫다’는 לקח 및 נקב אָף를 자연스럽게 반영합니다. מוֹקְשִׁים은 기본적으로 올무·덫·함정 계열이므로 ‘올가미’와 관련 각주는 유지할 수 있습니다. ‘갈고리’는 전통적 해석 이미지로만 각주에서 제한하여 제시하는 것이 적절합니다.
