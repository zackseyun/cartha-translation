id: JOB.40.24
reference: Job 40:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
  footnotes:
  - marker: a
    text: Or 'Will he take him before his eyes? Will he pierce his nose with traps?' The Hebrew is terse and difficult; some translations construe the verbs less generically.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'with snares'; traditional versions sometimes read imagery closer to 'hooks,' but the noun more naturally refers to traps or snares.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 눈앞에서 그를 붙잡을 수 있습니까? 그가 올가미로 그의 코를 뚫을 수 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 간결하고 난해합니다. 일부 번역은 동사의 주체와 뜻을 달리 이해하여 ‘그를 그의 눈앞에서 데려가겠느냐/잡겠느냐’처럼 옮기기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘올가미들/함정들’에 해당하며, 전통 번역의 일부는 이 장면을 ‘갈고리’ 이미지로 더 가깝게 풀기도 하지만, 어휘 자체는 덫·올무 계열이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  english_pob_choice: before his eyes
  chosen_korean: 그의 눈앞에서
  alternatives_korean:
  - 그의 눈앞에
  - 그의 눈으로
  lexicon: HALOT
  rationale: ב + 눈은 여기서 ‘보는 중에’라는 도구적 의미보다, 당사자가 지켜보는 앞에서 공개적으로 행하는 뜻이 자연스럽습니다. 한국어에서는 ‘눈앞에서’가 그 긴장감을 가장 सीधे하게 살립니다.
- source_word: יִקָּחֶנּוּ
  english_pob_choice: can one capture him
  chosen_korean: 그를 붙잡을 수 있습니까
  alternatives_korean:
  - 그를 잡을 수 있습니까
  - 그를 사로잡을 수 있습니까
  lexicon: HALOT
  rationale: לקח는 기본적으로 ‘취하다/가져가다’이지만, 짐승을 대상으로 한 문맥에서는 ‘붙잡다’가 포획의 의미를 잘 드러냅니다. 반문형도 영어 POB의 수사적 질문을 그대로 반영합니다.
- source_word: בְּמוֹקְשִׁים
  english_pob_choice: with snares
  chosen_korean: 올가미로
  alternatives_korean:
  - 덫으로
  - 올무로
  - 올가미와 함께
  lexicon: HALOT
  rationale: מוֹקֵשׁ은 전통적으로 ‘덫/올무’ 계열의 함정 장치를 가리키므로, 한국어에서는 짧고 자연스러운 ‘올가미로’를 택했습니다. 영어 POB의 ‘with snares’와도 대응됩니다.
- source_word: יִנְקָב אָף
  english_pob_choice: pierce his nose
  chosen_korean: 그의 코를 뚫을 수 있습니까
  alternatives_korean:
  - 그의 코를 꿸 수 있습니까
  - 그의 콧구멍을 뚫을 수 있습니까
  lexicon: HALOT
  rationale: נקב은 ‘뚫다/꿰뚫다’의 물리적 동작을 가리키므로 ‘뚫다’를 택했습니다. אָף는 여기서 해부학적 ‘코’가 가장 직접적이며, ‘콧구멍’은 너무 좁아져 원문의 거친 이미지가 약해집니다.
theological_decisions:
- issue: 수사적 질문의 직설성 유지
  chosen_reading: 두 문장을 모두 수사적 질문으로 유지해, 아무도 이 짐승을 통제할 수 없다는 본문의 도전을 그대로 드러냈습니다.
  alternative_readings:
  - 서술문으로 완화해 번역
  - 더 설명적인 의역으로 처리
  rationale: 이 구절은 문법적 정보 전달보다 창조물의 불가항력성을 강조하는 시적 도전이 핵심이므로, 질문 형식을 유지하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 욥기 40장 문맥의 하나님의 창조주권과 인간의 한계 인식
