translation:
  language: ko
  text: 그들을 함께 티끌 속에 숨기십시오[a]. 그들의 얼굴을 감추어진 곳에서 묶으십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 함께 묻으십시오.’ 히브리어 동사는 ‘숨기다’를 뜻하지만, 이 문맥에서는 ‘묻다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 얼굴을 비밀리에 묶으십시오’ 또는 ‘그들의 얼굴을 은밀한 곳에서 묶으십시오.’ 마지막 구절은 난해하며, 히브리어는 감추어진 곳을 가리키고 앞의 ‘숨기다’와 호응하는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  english_pob_choice: Hide them
  chosen_korean: 그들을 … 숨기십시오
