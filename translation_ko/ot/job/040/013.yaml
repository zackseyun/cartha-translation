  lexicon: HALOT
  rationale: עָפָר의 기본 이미지인 ‘dust’를 한국어로 자연스럽게 옮겨, 죽음과 티끌의 이미지를 보존했습니다.
- source_word: חֲבֹשׁ
  english_pob_choice: bind
  chosen_korean: 묶으십시오
  alternatives_korean:
  - 속박하십시오
  - 동여매십시오
  lexicon: HALOT
  rationale: חבשׁ의 핵심 의미를 ‘묶다’로 옮겨, 심판적 억제/구속의 뉘앙스를 유지했습니다.
- source_word: בַּטָּמוּן
  english_pob_choice: in the hidden place
  chosen_korean: 감추어진 곳에
  alternatives_korean:
  - 은밀한 곳에
  - 숨은 곳에
  lexicon: HALOT
  rationale: 어근 טמן과의 말장난을 살리기 위해 ‘감추어진 곳’으로 옮겨, 앞의 ‘숨기다’와 연결되는 숨김의 이미지를 유지했습니다.
theological_decisions:
- issue: 문맥상 טָמְנֵם의 ‘숨기다’가 장례적 ‘묻다’로 확장될 가능성
  chosen_reading: 본문은 기본어휘인 ‘숨기다/감추다’를 유지하고, 장례적 함의는 본문을 과잉해석하지 않도록 열어 둡니다.
  alternative_readings:
  - 그들을 함께 묻으십시오
  - 그들을 함께 매장하십시오
  rationale: 시적 문맥이 죽음의 이미지를 강하게 띠지만, 히브리어 동사의 기본값을 유지하는 편이 원문 추적성에 더 충실합니다.
