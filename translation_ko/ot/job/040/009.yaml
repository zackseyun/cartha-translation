  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
  footnotes:
  - marker: a
    text: Or, less likely, 'like a god' if אֵל were taken more generically; the context strongly favors 'God.'
    reason: alternative_reading
translation:
  language: ko
  text: 아니면 하나님처럼 팔이 있습니까, 또 그분처럼 우레를 울리는 목소리로 말할 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 덜 가능성이 크지만, אֵל을 더 일반적으로 보면 ‘한 신 같은’으로도 옮길 수 있습니다. 그러나 문맥은 ‘하나님’ 쪽을 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: Or do
  chosen_korean: 아니면
  alternatives_korean:
  - 그리고 만일
  - 혹시
  lexicon: HALOT
  rationale: 질문을 이어 가는 도전적 문맥이므로, 직역적인 ‘그리고 만일’보다 반문을 자연스럽게 살리는 ‘아니면’이 원문의 수사적 힘을 잘 전합니다.
- source_word: זְרוֹעַ
  english_pob_choice: arm
  chosen_korean: 팔
  alternatives_korean:
  - 힘
  - 능력
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘팔’을 살려, 하나님의 능력을 은유적으로 드러내는 표현을 유지했습니다.
- source_word: כָּאֵל
  english_pob_choice: like God’s
  chosen_korean: 하나님처럼
  alternatives_korean:
  - 하나님 같은
  - 신처럼
  lexicon: HALOT
  rationale: 문맥상 אֵל은 일반적인 ‘신’이 아니라 이스라엘의 하나님을 가리키므로, POB의 판단을 따라 ‘하나님’으로 옮겼습니다. 한국어에서는 소유격을 억지로 반복하기보다 비교 표현 ‘하나님처럼’이 더 자연스럽습니다.
- source_word: וּבְקוֹל ... תַרְעֵם
  english_pob_choice: and can you thunder with a voice
  chosen_korean: 우레를 울리는 목소리로 말할 수 있습니까
  alternatives_korean:
  - 목소리로 우레를 칠 수 있습니까
  - 우레 같은 목소리로 말할 수 있습니까
  lexicon: HALOT
  rationale: רעם의 ‘우레 치다/우레를 울리다’ 이미지를 살리되, 한국어에서는 ‘목소리로 우레를 울리다’가 다소 경직되어 자연스러운 동사구로 재구성했습니다.
theological_decisions:
- issue: אֵל의 지시 대상
  chosen_reading: ‘하나님’으로 번역하여 창조주에 대한 직접 비교를 유지했습니다.
  alternative_readings:
  - ‘신’ 또는 ‘한 신’으로 완화하는 읽기
  rationale: 문맥이 야훼의 독특한 능력을 묻는 수사 질문이므로, 일반 신격으로 약화하지 않고 하나님의 유일성을 드러내는 번역이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 문맥상 단일 참하나님 지시
