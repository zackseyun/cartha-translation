  rationale: 본문은 신체 부위를 힘의 상징으로 쓰는 표현이므로, 해석어로 바꾸지 않고 은유를 유지하는 것이 원문 의미를 가장 충실히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
