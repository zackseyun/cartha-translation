  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
  footnotes:
  - marker: a
    text: Or 'save for yourself'; the Hebrew includes a preposition of advantage ('for you/for yourself').
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 저도 당신을 찬양하겠습니다. 당신의 오른손이 당신을 구원할 수 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신 자신을 위해 구원할 수 있기 때문입니다’. 히브리어는 이익의 전치사(‘~을 위해/~자신을 위해’)를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Then even
  chosen_korean: 그러면 저도
  alternatives_korean:
  - 그리고 저도
  - 저도 또한
  - 그러면 또한
  lexicon: HALOT
  rationale: 문맥상 앞선 도전 뒤에 이어지는 양보적·강조적 연결이므로, 한국어에서는 자연스러운 진행을 살려 ‘그러면’으로 옮기고 주어 강조를 위해 ‘저도’를 붙였습니다.
- source_word: אוֹדְךָ
  english_pob_choice: will praise you
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 감사하겠습니다
  - 인정하겠습니다
  - 고백하겠습니다
  lexicon: HALOT
  rationale: ידה의 히필은 여기서 단순 감사보다 공개적 찬양의 뜻이 강하므로, 합쇼체 문맥에 맞는 ‘찬양하겠습니다’를 택했습니다.
- source_word: תוֹשִׁיעַ
  english_pob_choice: can save
  chosen_korean: 구원할 수 있기 때문입니다
  alternatives_korean:
  - 구원할 것입니다
  - 구해낼 수 있기 때문입니다
  - 도울 수 있기 때문입니다
  lexicon: HALOT
  rationale: 동사는 ישׁע의 히필로 ‘구원하다/구하다’의 능력을 나타내므로, POB의 가능성 강조를 따라 ‘~할 수 있다’로 옮겼습니다.
- source_word: יְמִינְךָ
  english_pob_choice: your right hand
  chosen_korean: 당신의 오른손
  alternatives_korean:
  - 당신의 오른편 손
  - 당신의 오른손 곧 능력
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 보존해 본문에서 힘의 상징을 드러내도록 ‘오른손’을 직역했습니다.
theological_decisions:
- issue: ‘오른손’의 비유적 힘 이미지 보존
  chosen_reading: 당신의 오른손이 당신을 구원할 수 있기 때문입니다.
  alternative_readings:
  - 당신의 힘이 당신을 구원할 수 있기 때문입니다.
  rationale: 본문은 신체 부위를 힘의 상징으로 쓰는 표현이므로, 해석어로 바꾸지 않고 은유를 유지하는 것이 원문 의미를 가장 충실히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
