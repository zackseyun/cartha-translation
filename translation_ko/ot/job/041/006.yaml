  yaml_path: translation/ot/job/041/006.yaml
  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
  footnotes:
  - marker: a
    text: Or 'Who can open the doors of his mouth?' The Hebrew reads literally, 'the doors of his face,' a poetic expression for the mouth or jaws.
