translation:
  language: ko
  text: 그 얼굴의 문들을 누가 열었습니까? 그 이빨 둘레에는 공포가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입의 문들을 누가 열 수 있습니까?’ 히브리어는 문자적으로 ‘그의 얼굴의 문들’이라고 되어 있으며, 입이나 턱을 가리키는 시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 이빨 둘레에는 두려움이 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי פָנָיו
  english_pob_choice: doors of his face
  chosen_korean: 그의 얼굴의 문들
  alternatives_korean:
  - 그의 입의 문들
  - 그의 턱문
  lexicon: HALOT
  rationale: 히브리어의 직유를 살리기 위해 ‘문들’을 유지하고, ‘face’를 그대로 옮겨 얼굴로 두어 입과 턱을 암시하는 시적 이미지를 보존했습니다.
- source_word: פִתֵּחַ
  english_pob_choice: has opened
  chosen_korean: 열었습니까
  alternatives_korean:
  - 열 수 있습니까
  - 열었습니다
  lexicon: HALOT
  rationale: 수사적 질문의 כוח을 살리면서 한국어에서는 자연스러운 완료형 의문문으로 옮겼습니다.
- source_word: סְבִיבוֹת שִׁנָּיו
  english_pob_choice: Around his teeth
  chosen_korean: 그의 이빨 둘레에는
  alternatives_korean:
  - 그의 이빨 주변에는
  - 그의 이빨 곁에는
  lexicon: HALOT
  rationale: ‘주변’보다 더 물리적이고 둘러싼 느낌을 주는 ‘둘레’를 택해 원문의 둘러쌈 이미지를 살렸습니다.
- source_word: אֵימָה
  english_pob_choice: terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 경외
  lexicon: HALOT
  rationale: 문맥상 위압적이고 강한 감정을 나타내므로, 한국어에서도 강도를 유지하는 ‘공포’를 사용했습니다.
theological_decisions:
- issue: 시적 은유를 얼마나 풀어 쓸지
  chosen_reading: ‘얼굴의 문들’을 직역에 가깝게 두어 입/턱을 암시하는 은유를 남겼습니다.
  alternative_readings:
  - ‘입의 문들’로 명시적으로 풀어씀
  - ‘턱’으로 해석해 의역
  rationale: 본문이 의도적으로 신체 부위를 은유적으로 표현하므로, 해석을 과도하게 고정하지 않고 독자가 이미지를 읽도록 두는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 시적·지혜문학의 은유 보존 원칙
