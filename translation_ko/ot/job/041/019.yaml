  alternative_readings:
  - ‘생각하고’로 순화하는 번역
  - ‘~와 같이’로 완화하는 번역
  rationale: 문맥상 단순 인지보다 평가·경멸의 뉘앙스가 중요하므로, 원문의 수사적 강도를 약화시키지 않았습니다.
  doctrine_reference: 욥기 41장 리워야단 묘사의 시적 과장
