  lexicon: HALOT
  rationale: תבן은 보통 짚/건초 계열이지만, 비교 용법에서는 한국어로 더 자연스러운 ‘지푸라기처럼’이 하찮음의 이미지를 선명하게 전달합니다.
- source_word: לְעֵץ רִקָּבֹון
