  - 짚더미처럼
  lexicon: HALOT
  rationale: תבן은 보통 짚/건초 계열이지만, 비교 용법에서는 한국어로 더 자연스러운 ‘지푸라기처럼’이 하찮음의 이미지를 선명하게 전달합니다.
- source_word: לְעֵץ רִקָּבֹון
  english_pob_choice: as rotten wood
  chosen_korean: 썩은 나무처럼
  alternatives_korean:
  - 부패한 나무처럼
  - 썩어 문드러진 나무처럼
  lexicon: HALOT
  rationale: 직역의 구조를 유지하되, ‘썩은 나무처럼’이 원문의 ‘썩음/부패’ 이미지를 가장 간결하게 살립니다.
- source_word: נְחוּשָׁה
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 구리
  - 동
  lexicon: HALOT
  rationale: 무기·금속 문맥에서 נְחוּשָׁה는 ‘청동’이 한국어 성경 용례상 가장 안정적이며, 철과 대조되는 강한 금속 이미지를 유지합니다.
