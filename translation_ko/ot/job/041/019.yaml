lexical_decisions:
- source_word: יַחְשֹׁב
  english_pob_choice: regards
  chosen_korean: 여깁니다
  alternatives_korean:
  - 생각합니다
  - 간주합니다
  - 헤아립니다
  lexicon: HALOT
  rationale: חשׁב는 여기서 가치 평가나 판단의 뜻이므로, ‘여깁니다’가 Leviathan의 태도를 자연스럽게 드러내면서도 의미를 보존합니다.
- source_word: לְתֶבֶן
  english_pob_choice: as straw
  chosen_korean: 지푸라기처럼
  alternatives_korean:
