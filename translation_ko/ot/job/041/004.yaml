translation:
  language: ko
  text: 나는 그의 지체들[a]에 대해, 곧 그의 능력의 설명과 그의 배열의 아름다움에 대해 침묵하지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 부분들에 대해, 곧 그의 능력의 문제와 그의 배열의 아름다움에 대해 침묵하지 않겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  english_pob_choice: I will not keep silent
  chosen_korean: 침묵하지 않겠습니다
  alternatives_korean:
  - 잠잠하지 않겠습니다
  - 말을 아끼지 않겠습니다
  lexicon: HALOT
  rationale: 화자의 의지를 분명히 드러내는 1인칭 미래/의지 표현으로 옮기되, 현대 한국어에서 자연스러운 ‘침묵하다’로 소리를 내지 않겠다는 뜻을 살렸습니다.
- source_word: בַּדָּיו
  english_pob_choice: his limbs
  chosen_korean: 그의 지체들
  alternatives_korean:
  - 그의 부분들
  - 그의 몸의 부분들
  - 그의 팔다리
  lexicon: HALOT
  rationale: 몸의 각 부분을 가리키는 시적 표현이므로, 너무 해부학적이거나 어색한 ‘부분들’보다 자연스러운 신체 통칭인 ‘지체들’이 문맥에 맞습니다.
- source_word: דְבַר גְּבוּרֹת
  english_pob_choice: the account of his mighty strength
  chosen_korean: 그의 능력의 설명
  alternatives_korean:
  - 그의 능력에 대한 말
  - 그의 위력의 이야기
  - 그의 힘에 대한 설명
  lexicon: HALOT
  rationale: דְבַר는 단순한 ‘말’보다 ‘설명/진술’의 범위를 가지므로, 이어지는 시적 병행 구조를 살려 ‘설명’으로 옮겼습니다. גְּבוּרוֹת는 여기서 ‘용맹’보다 힘의 현현을 가리키므로 ‘능력’이 무난합니다.
- source_word: חִין עֶרְכּוֹ
  english_pob_choice: the grace of his proportions
  chosen_korean: 그의 배열의 아름다움
  alternatives_korean:
  - 그의 배치의 아름다움
  - 그의 형상의 아름다움
  - 그의 균형의 아름다움
  lexicon: HALOT
  rationale: חִין은 ‘은총’보다 여기서 미적 매력을 뜻하므로 ‘아름다움’으로 풀었고, עֶרְכּוֹ는 물체의 정돈된 배치/구성을 가리켜 ‘배열’이 मूल뜻을 가장 가깝게 반영합니다.
theological_decisions:
- issue: 시적 평행법의 재현
  chosen_reading: ‘능력의 설명’과 ‘배열의 아름다움’을 나란히 두어, 히브리어의 두 병행구를 한국어에서도 병렬적으로 보이게 했습니다.
  alternative_readings:
  - 한 문장으로 매끄럽게 통합하는 읽기
  - ‘능력’과 ‘형태’로 더 간단히 처리하는 읽기
  rationale: 이 구절은 정보 전달보다 대상의 신체성과 위엄을 점층적으로 묘사하는 시적 진술이므로, 병행 구조를 보존하는 편이 원문의 효과를 더 잘 드러냅니다.
  doctrine_reference: 시편/지혜문학의 히브리 시 형식 보존 원칙
