lexical_decisions:
- source_word: כָּל גָּבֹהַּ
  english_pob_choice: everything that is high
  chosen_korean: 모든 높은 것
  alternatives_korean:
  - 모든 높이 있는 것
  - 모든 높은 대상
  lexicon: HALOT
  rationale: כָּל과 גָּבֹהַּ의 포괄적이고 형용사적 결합을 한국어에서 자연스럽게 옮기되, 높음의 구체적 이미지를 유지했습니다.
- source_word: יִרְאֶה
  english_pob_choice: looks on
  chosen_korean: 바라보십니다
  alternatives_korean:
  - 보십니다
  - 주시합니다
  lexicon: HALOT
  rationale: 단순한 시각 인식보다 대상에 대한 응시와 주권적 관찰의 뉘앙스를 살려, 시적 문맥에 맞는 '바라보다'를 택했습니다.
- source_word: מֶלֶךְ עַל
  english_pob_choice: king over
  chosen_korean: 왕이십니다
  alternatives_korean:
  - 다스리십니다
  - 통치하십니다
  lexicon: HALOT
  rationale: 직역적 '왕'을 유지해 시편적·지혜문학적 왕권 이미지를 보존했고, עַל의 지배 관계는 문맥상 '위에/over'의 통치 의미로 반영했습니다.
- source_word: בְּנֵי שָׁחַץ
  english_pob_choice: the sons of pride
  chosen_korean: 교만의 아들들
  alternatives_korean:
  - 교만한 자들
  - 교만의 자손들
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구인 '아들들 of' 구조를 살리면서, 성별 포괄을 위해 자연스러운 한국어 소유격 구조로 옮겼습니다.
