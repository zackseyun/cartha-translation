source:
  edition: WLC
  text: אֵֽת כָּל גָּבֹ֥הַּ יִרְאֶ֑ה ה֝֗וּא מֶ֣לֶךְ עַל כָּל בְּנֵי שָֽׁחַץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
  footnotes:
  - marker: a
    text: Or 'all the proud ones'; literally, 'all the sons of pride.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 높은 것을 바라보십니다. 그는 모든 교만의 아들들 위에 왕이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '교만한 자들 모두'; 문자적으로는 '교만의 아들들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גָּבֹהַּ
  english_pob_choice: everything that is high
  chosen_korean: 모든 높은 것
  alternatives_korean:
  - 모든 높이 있는 것
  - 모든 높은 대상
  lexicon: HALOT
  rationale: כָּל과 גָּבֹהַּ의 포괄적이고 형용사적 결합을 한국어에서 자연스럽게 옮기되, 높음의 구체적 이미지를 유지했습니다.
- source_word: יִרְאֶה
  english_pob_choice: looks on
  chosen_korean: 바라보십니다
  alternatives_korean:
  - 보십니다
  - 주시합니다
  lexicon: HALOT
  rationale: 단순한 시각 인식보다 대상에 대한 응시와 주권적 관찰의 뉘앙스를 살려, 시적 문맥에 맞는 '바라보다'를 택했습니다.
- source_word: מֶלֶךְ עַל
  english_pob_choice: king over
  chosen_korean: 왕이십니다
  alternatives_korean:
  - 다스리십니다
  - 통치하십니다
  lexicon: HALOT
  rationale: 직역적 '왕'을 유지해 시편적·지혜문학적 왕권 이미지를 보존했고, עַל의 지배 관계는 문맥상 '위에/over'의 통치 의미로 반영했습니다.
- source_word: בְּנֵי שָׁחַץ
  english_pob_choice: the sons of pride
  chosen_korean: 교만의 아들들
  alternatives_korean:
  - 교만한 자들
  - 교만의 자손들
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구인 '아들들 of' 구조를 살리면서, 성별 포괄을 위해 자연스러운 한국어 소유격 구조로 옮겼습니다.
theological_decisions:
- issue: בְּנֵי שָׁחַץ의 범주를 좁히지 않음
  chosen_reading: 교만을 특징으로 하는 모든 존재를 가리키는 시적 표현으로 유지했습니다.
  alternative_readings:
  - 특정한 짐승들에 대한 언급
  - 우주적 교만의 세력을 가리키는 신화적 표현
  rationale: 본문은 의도적으로 모호한 시적 표현이므로, 동물학적·신화적 특정화로 의미를 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 시적 은유의 개방성을 보존
