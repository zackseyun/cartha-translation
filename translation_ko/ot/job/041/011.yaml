    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  english_pob_choice: From his mouth
  chosen_korean: 그의 입에서
  alternatives_korean:
  - 그의 입으로부터
  - 그 입에서
  lexicon: HALOT
  rationale: מִן + פֶּה + 3인칭 남성 단수 접미사는 자연스럽게 ‘그의 입에서’로 옮기되, 리워야단에 대한 시적 인격화도 함께 살렸습니다.
- source_word: לַפִּידִים
  english_pob_choice: torches
  chosen_korean: 횃불이
  alternatives_korean:
  - 등불이
  - 불길이
  - 불화살이
  lexicon: HALOT
  rationale: לַפִּידִים은 구체적인 불붙은 횃불을 가리키므로, 현대 한국어에서도 이미지가 선명한 ‘횃불’이 가장 가깝습니다.
- source_word: כִּידֹדֵי אֵשׁ
  english_pob_choice: sparks of fire
  chosen_korean: 불의 불똥이
  alternatives_korean:
  - 불꽃이
  - 불똥이
  - 불의 불화살이
  lexicon: HALOT
  rationale: 희귀한 표현이라 단정적 재구성이 어렵지만, 앞의 ‘횃불’과 평행을 이루는 작은 불꽃 조각의 이미지를 살려 ‘불의 불똥’으로 옮겼습니다.
- source_word: יִתְמַלָּטוּ
  english_pob_choice: leap forth
  chosen_korean: 튀어 나갑니다
  alternatives_korean:
  - 뛰쳐나갑니다
  - 솟구쳐 나갑니다
  - 달아납니다
  lexicon: HALOT
  rationale: 문맥상 ‘도망가다’보다 불꽃이 갑자기 밖으로 튀어나오는 동작이 핵심이므로, 역동성을 살린 ‘튀어 나갑니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 과장과 문자성의 균형
  chosen_reading: 리워야단의 입에서 실제 횃불과 불똥이 나오는 과장된 시적 묘사로 그대로 옮겼습니다.
  alternative_readings:
  - 비유적으로 완화하여 ‘마치 횃불이 나오는 듯’으로 처리하는 읽기
  - 상징성을 앞세워 의미만 풀어 쓰는 읽기
  rationale: 본문은 생생한 우주적 괴수의 이미지를 의도하므로, 과장을 약화하지 않고 수사 그대로 전달하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 성경 시가의 과장법과 의인화
- issue: 남성 대명사 유지
  chosen_reading: ‘그의’로 번역해 히브리어 3인칭 남성 단수 접미사를 반영했습니다.
  alternative_readings:
  - ‘그것의’로 중성화하는 읽기
  - 대상을 드러내지 않는 무표지 번역
  rationale: 히브리어는 리워야단을 문법적으로 남성으로 처리하며, 본문의 생동감 있는 인격화도 유지됩니다.
  doctrine_reference: 히브리어 시적 문법
