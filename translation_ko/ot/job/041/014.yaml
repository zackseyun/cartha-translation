base_translation:
  language: en
  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
  footnotes:
  - marker: a
    text: Or 'terror leaps before him.' The Hebrew noun דְּאָבָה is rare, and the sense may range from dismay or dejection to terror in this poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 목에는 힘이 깃들어 있고, 그 앞에서는 낙담이 뛰어오릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 앞에서 공포가 뛰어오릅니다.’ 희귀한 히브리어 명사 דְּאָבָה는 이 시적 문맥에서 낙담, 두려움, 공포까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  english_pob_choice: In his neck
  chosen_korean: 그의 목에는
  alternatives_korean:
  - 그의 목에
  - 목 안에
  lexicon: HALOT
  rationale: ב + צוּאָר + 3인칭 남성 단수 접미사는 위치를 나타내는 것으로 이해하는 것이 자연스럽고, 한국어에서는 ‘목에는’이 시적 이미지와 함께 ‘그 자리에’의 뉘앙스를 살리기 좋습니다.
- source_word: יָלִין
  english_pob_choice: lodges
  chosen_korean: 깃들어 있고
  alternatives_korean:
  - 머무르고 있고
  - 묵어 있고
  - 자고 있고
  lexicon: HALOT
  rationale: ‘밤을 지내다/묵다’의 기본 뜻을 가지지만 여기서는 지속적으로 자리 잡은 상태를 나타내므로, 한국어 ‘깃들다’가 시적이면서도 정착된 존재감을 잘 드러냅니다.
- source_word: תָּדוּץ דְּאָבָה
  english_pob_choice: dismay leaps
  chosen_korean: 낙담이 뛰어오릅니다
  alternatives_korean:
  - 두려움이 뛰어오릅니다
  - 공포가 뛰어오릅니다
  - 절망이 뛰어오릅니다
  lexicon: HALOT
  rationale: 희귀 명사 דְּאָבָה는 문맥상 두려움/낙담/침울함의 범위를 가질 수 있어, POB의 ‘dismay’에 맞추어 ‘낙담’으로 옮기되 동적인 동사 ‘뛰어오릅니다’로 המקור의 도약 이미지를 살렸습니다.
