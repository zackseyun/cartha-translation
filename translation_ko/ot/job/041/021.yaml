base_translation:
  language: en
  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
  footnotes:
  - marker: a
    text: Or 'A dart/missile is regarded as straw'; the Hebrew term תוֹתָח is rare, and its precise sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'like stubble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 짚처럼 여겨지고, 그는 창의 요란한 소리를 비웃습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תוֹתָח는 매우 드문 단어라 정확한 뜻이 확실하지 않으며, ‘몽둥이/막대기’ 또는 ‘투창’처럼 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘짚더미처럼’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  english_pob_choice: as straw
  chosen_korean: 짚처럼
  alternatives_korean:
  - 볏짚처럼
  - 그루터기처럼
  lexicon: HALOT
  rationale: קַשׁ은 짚/짚단 계열을 가리키므로, 현대 한국어에서는 자연스럽고 시각적 대비가 분명한 ‘짚처럼’으로 옮겼습니다.
- source_word: נֶחְשְׁבוּ
  english_pob_choice: is regarded
  chosen_korean: 여겨지고
  alternatives_korean:
  - 간주되고
  - 여겨집니다
  lexicon: HALOT
  rationale: חשׁב의 피동 의미를 살려 ‘여겨지다’로 옮기되, 시어의 흐름에 맞게 연결형으로 처리했습니다.
- source_word: לְרַעַשׁ כִּידוֹן
  english_pob_choice: the rattling of the javelin
  chosen_korean: 창의 요란한 소리
  alternatives_korean:
  - 창의 덜그럭거리는 소리
  - 창의 달그락거림
  - 창의 요동치는 소리
  lexicon: HALOT
  rationale: רַעַשׁ은 단순한 ‘소음’보다 무기의 움직임에서 나는 요란한 소리를 뜻하므로, 창(כִּידוֹן)과 함께 한국어 시어로 자연스럽게 묶어 표현했습니다.
theological_decisions:
- issue: 시적 의인화의 인칭 처리
  chosen_reading: 레비아탄을 가리키는 인칭을 한국어에서 ‘그’로 자연스럽게 유지했습니다.
  alternative_readings:
  - ‘그것은 … 비웃습니다’처럼 무인칭으로 처리
  - ‘그는 … 웃습니다’로 더 직역
  rationale: 본문 전체가 바다 괴물 레비아탄을 의인화한 시적 묘사이므로, 한국어에서도 인격적 주어를 유지하는 편이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 시적 의인화와 문맥상 지시 대상 보존
