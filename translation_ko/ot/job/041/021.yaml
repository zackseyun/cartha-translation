  - marker: b
    text: Or 'like stubble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 몽둥이[a]도 짚처럼[b] 여겨지며, 그는 투창이 내는 요란한 소리를 비웃습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תוֹתָח는 매우 드문 단어라 정확한 뜻이 확실하지 않습니다. ‘투창’이나 다른 발사체로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그루터기 같은 마른 줄기처럼’.
    reason: lexical_alternative
