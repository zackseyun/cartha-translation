id: JOB.41.15
reference: Job 41:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַפְּלֵ֣י בְשָׂר֣/וֹ דָבֵ֑קוּ יָצ֥וּק עָ֝לָ֗י/ו בַּל יִמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
  footnotes:
  - marker: a
    text: Or 'firmly set on him' for 'cast firm upon him'; the Hebrew uses imagery of something poured/cast so as to become fixed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 살의 주름은 서로 달라붙어 있고, 그 위에 주조되어[a] 단단히 고정되어 있어 움직일 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 단단히 고정되어 있다’로 옮길 수 있습니다. 히브리어는 무언가를 부어 주조하여 고정하는 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  english_pob_choice: folds
  chosen_korean: 주름
  alternatives_korean:
  - 겹
  - 부분
  - 층
  lexicon: HALOT
  rationale: 몸의 접히고 늘어진 부분이라는 구체적 이미지를 살리면서, 현대 한국어에서 자연스럽고 문맥에 맞게 표현했습니다.
- source_word: בְשָׂרוֹ
  english_pob_choice: his flesh
  chosen_korean: 그의 살
  alternatives_korean:
  - 그의 몸
  - 그의 가죽
  - 그의 육체
  lexicon: HALOT
  rationale: 히브리어의 직접적인 어휘인 בשר을 따라 '살'로 옮겨, 해석적으로 넓히지 않았습니다.
- source_word: דָבֵקוּ
  english_pob_choice: cling together
  chosen_korean: 서로 붙어 있으며
  alternatives_korean:
  - 달라붙어 있으며
  - 서로 밀착되어 있으며
  - 한데 붙어 있습니다
  lexicon: HALOT
  rationale: 복수 주어의 밀착된 결합을 자연스러운 한국어로 드러내되, 단순한 정지 상태보다 '붙어 있음'의 촉감을 살렸습니다.
- source_word: יָצוּק עָלָיו
  english_pob_choice: cast firm upon him
  chosen_korean: 그 위에 마치 주조한 듯 굳게 놓여
  alternatives_korean:
  - 그 위에 부어 굳힌 듯
  - 그 위에 단단히 고정되어
  - 그 위에 주조되어
  lexicon: HALOT
  rationale: יַצּוּק의 '붓다/주조하다' 이미지를 살리면서도, 결과 상태인 '굳게 놓여'를 통해 문맥상의 고착성을 전달했습니다.
- source_word: בַּל יִמּוֹט
  english_pob_choice: cannot be moved
  chosen_korean: 움직일 수 없습니다
  alternatives_korean:
  - 흔들릴 수 없습니다
  - 움직이지 않습니다
  - 흔들리지 않습니다
  lexicon: HALOT
  rationale: 부정문과 니팔 '움직이다/흔들리다'의 의미를 현대어로 압축해, 능동적 불가능성을 분명히 했습니다.
theological_decisions:
- issue: 고난받는 짐승의 과장된 신체 묘사에서 직유적 이미지 보존 여부
  chosen_reading: 문맥의 생생한 육체적 이미지를 평탄화하지 않고, '주조한 듯'이라는 비유를 통해 단단히 굳은 상태를 드러냈습니다.
  alternative_readings:
  - 더 평이하게 '단단히 고정되어'로 옮김
  - 보다 직역하여 '부어져 있다'로 옮김
  rationale: 본문은 신학적 논쟁점보다 창조된 피조물의 압도적 육체성을 강조하므로, 시적 은유의 힘을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시적 묘사 보존 원칙
- issue: יִמּוֹט의 의미를 '흔들리다'와 '움직이다' 중 어떻게 처리할지
  chosen_reading: 여기서는 전체 문장의 종결 효과를 살려 '움직일 수 없습니다'로 옮겼습니다.
  alternative_readings:
  - '''흔들릴 수 없습니다'''
  - '''미동도 하지 않습니다'''
  rationale: 히브리어 מוט은 '흔들리다/움직이다' 범위를 가지므로, 문맥상 고착성을 강조하는 방향으로 자연스럽게 합의했습니다.
  doctrine_reference: 시적 히브리어 어휘 의미 범위
