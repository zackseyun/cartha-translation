id: JOB.41.2
reference: Job 41:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
  footnotes:
  - marker: a
    text: Or 'No one is so cruel that he would rouse him.' The Hebrew verb means 'awaken' or 'rouse,' here in the sense of provoking Leviathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 그렇게 사나워서 그를 깨우려 들지 못합니다. 그렇다면 누가 감히 내 앞에 설 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨우려 들지 못합니다’는 히브리어 동사 עור를 문맥상 ‘도발하여 자극하다’는 뜻으로 옮긴 것입니다. 직역하면 ‘깨우다/불러일으키다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  english_pob_choice: No one is so fierce
  chosen_korean: 아무도 그렇게 사나워서
  alternatives_korean:
  - 아무도 그렇게 잔혹해서
  - 아무도 그렇게 무자비해서
  lexicon: HALOT
  rationale: אַכְזָר는 도덕적 잔혹함보다 위압적이고 사나운 성격을 가리키므로, 욥기 41장의 리워야단 문맥에서는 ‘사나워서’가 가장 자연스럽고 직접적입니다.
- source_word: יְעוּרֶנּוּ
  english_pob_choice: he dares to stir him up
  chosen_korean: 그를 깨우려 들지 못합니다
  alternatives_korean:
  - 그를 깨우지 못합니다
  - 그를 흔들어 깨우려 하지 못합니다
  - 그를 자극하지 못합니다
  lexicon: HALOT
  rationale: עור의 기본 뜻은 ‘깨우다/불러일으키다’이지만, 여기서는 리워야단을 건드려 분노를 일으키는 뉘앙스가 있어 ‘깨우려 들다’로 옮기되, 부정문으로 가능성을 차단했습니다.
- source_word: וּמִי הוּא לְפָנַי יִתְיַצָּב
  english_pob_choice: Who then is he who can stand before me?
  chosen_korean: 그렇다면 누가 감히 내 앞에 설 수 있겠습니까?
  alternatives_korean:
  - 그렇다면 누가 내 앞에 설 수 있겠습니까?
  - 그렇다면 누가 내 앞에 버틸 수 있겠습니까?
  lexicon: HALOT
  rationale: לְפָנַי와 יִתְיַצָּב는 단순한 위치가 아니라 하나님 앞에서 맞서는 행위를 가리키므로, ‘내 앞에 서다’에 ‘감히’를 보태 수사적 도전을 살렸습니다.
theological_decisions:
- issue: 첫 절반과 둘째 절반의 대상 전환
  chosen_reading: 첫 절반은 리워야단을 직접 가리키고, 둘째 절반은 ‘내’라는 1인칭으로 하나님 자신 앞에 설 수 있는가를 묻는 쪽으로 전환했습니다.
  alternative_readings:
  - 두 절반이 모두 리워야단만을 가리킨다
  rationale: 본문의 לְפָנַי('내 앞에')가 화자를 하나님으로 분명히 드러내므로, 논증은 피조물에 대한 도전에서 창조주 앞에 설 수 없음으로 아포리오리하게 진행됩니다.
  doctrine_reference: 욥기 40–41장의 하나님의 연설
- issue: ‘깨우다’의 의미
  chosen_reading: 여기서는 단순한 수면에서 깨우는 뜻보다, 리워야단을 자극하여 행동하게 만드는 도발의 의미로 이해했습니다.
  alternative_readings:
  - 그를 깨우다
  - 그를 흔들어 깨우다
  rationale: 영어 POB도 ‘rouse/stir him up’의 어감을 반영하며, 본문은 실제 기상보다 위협적 자극을 말하므로 한국어에서도 그 긴장을 보존하는 편이 적절합니다.
  doctrine_reference: 욥기 41:2 주석적 어휘 선택
