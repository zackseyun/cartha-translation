    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두려움 없이 지음받았다’로 옮길 수 있습니다. 곧 두려움이나 공포에 굴하지 않는 존재로 만들어졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין עַל עָפָר
  english_pob_choice: On earth there is none
  chosen_korean: 땅 위에는 그와 같은 이가 없으며
