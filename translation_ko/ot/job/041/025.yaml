id: JOB.41.25
reference: Job 41:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽין עַל עָפָ֥ר מָשְׁל֑/וֹ הֶ֝/עָשׂ֗וּ לִ/בְלִי חָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/025.yaml
  text: On earth there is none like him[b][a], one made without fear.
  footnotes:
  - marker: a
    text: Or, 'On earth there is no equal to him'; the Hebrew term may express likeness or equalness in this context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'made to be without fear,' that is, created as one not subject to terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅 위에는 그와 같은 이가 없으며, 두려움 없이 지음받은 존재입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위에 그와 동등한 이는 없다’로도 옮길 수 있습니다. 히브리어는 이 문맥에서 ‘비슷함’과 ‘동등함’의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두려움을 당하지 않도록 지음받은 존재’로도 옮길 수 있습니다. 즉, 공포의 지배를 받지 않도록 창조되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין עַל עָפָר
  english_pob_choice: On earth there is none
  chosen_korean: 땅 위에는 그와 같은 이가 없으며
  alternatives_korean:
  - 땅 위에는 그와 같은 이가 없습니다
  - 세상에 그와 같은 이는 없습니다
  lexicon: HALOT
  rationale: 절대적 부정을 자연스러운 한국어로 살리면서, עַל עָפָר의 지상적 대비를 ‘땅 위’로 옮겼습니다.
- source_word: מָשְׁלוֹ
  english_pob_choice: like him
  chosen_korean: 그와 같은 이
  alternatives_korean:
  - 그의 같은 이
  - 그와 같은 자
  - 그의 बराब한 이
  lexicon: HALOT
  rationale: 문맥상 ‘비교되는 동일성/동등성’을 나타내므로 ‘같은 이’가 ‘같은 자/동등한 자’보다 자연스럽고 본문 의미를 잘 드러냅니다.
- source_word: הֶעָשׂוּ לִבְלִי חָת
  english_pob_choice: made without fear
  chosen_korean: 두려움 없이 지음받은 존재
  alternatives_korean:
  - 두려움 없이 만들어진 존재
  - 두려움이 없도록 지음받은 존재
  - 두려움 없이 지어진 자
  lexicon: HALOT
  rationale: עשה의 수동적 의미를 ‘지음받다’로 살리고, לִבְלִי חָת을 ‘두려움 없이’로 옮겨 본문의 상태 진술을 보존했습니다.
theological_decisions:
- issue: 문장 끝의 상태 표현(‘without fear’)을 도덕적 용기인지, 본성상 두려움의 부재인지로 볼지
  chosen_reading: 피조물이 본성상 두려움에 지배되지 않는 존재로 묘사하는 표현으로 읽었습니다.
  alternative_readings:
  - 단순히 용감한 존재라는 뜻
  - 공포를 느끼지 않는 괴물적 특성
  rationale: 영문 POB가 ‘created as one not subject to terror’의 가능성을 주석으로 열어 두므로, 본문은 일반적 ‘용감함’보다 창조된 성향/상태를 가리키는 쪽을 더 직접적으로 반영해야 합니다.
  doctrine_reference: 창조론; 피조물의 본성 묘사
