  text: מַשִּׂיגֵ֣/הוּ חֶ֭רֶב בְּלִ֣י תָק֑וּם חֲנִ֖ית מַסָּ֣ע וְ/שִׁרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
  footnotes:
  - marker: a
    text: Or 'The sword that overtakes him does not prevail.' The Hebrew expression literally says the sword 'does not stand.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms rendered 'dart' and 'javelin' are rare and uncertain; alternatives include 'missile' or 'shaft' for the former, and 'coat of mail' or 'armor' for the latter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 닿는 칼은 버티지 못하며[a], 창과 표창과 투창도 그러합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그에게 닿는 칼은 서지 못한다’입니다. ‘버티지 못한다’는 그 뜻을 문맥에 맞게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘표창’과 ‘투창’으로 옮긴 히브리어 단어들은 희귀하여 뜻이 확실하지 않습니다. ‘표창’은 ‘투사체’ 또는 ‘창대’로, ‘투창’은 ‘갑옷’ 또는 ‘철갑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ / חֶרֶב
  english_pob_choice: The sword that reaches him
  chosen_korean: 그에게 닿는 칼
  alternatives_korean:
  - 그에게 이르는 칼
  - 그를 따라잡는 칼
  lexicon: HALOT
  rationale: השיג/נשׂג의 핵심은 ‘미치다, 따라잡다, 닿다’이므로, 문맥상 공격이 실제로 그에게 도달하는 칼을 자연스럽게 살리기 위해 ‘닿는 칼’로 옮겼습니다.
- source_word: בְּלִי תָקוּם
  english_pob_choice: cannot stand
  chosen_korean: 버티지 못합니다
  alternatives_korean:
  - 서지 못합니다
  - 지탱하지 못합니다
  - 효력을 발휘하지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘서지 못하다’이지만, 무기가 상대를 뚫고 ‘제 기능을 유지하지 못함’이라는 뜻을 한국어 시에서 자연스럽게 드러내기 위해 ‘버티지 못합니다’를 택했습니다.
- source_word: חֲנִית מַסָּע וְשִׁרְיָה
  english_pob_choice: spear, dart, or javelin
  chosen_korean: 창과 표창, 화살촉도 마찬가지입니다
  alternatives_korean:
  - 창과 투창과 갑옷도 마찬가지입니다
  - 창과 미사일, 갑옷도 마찬가지입니다
  - 창과 화살, 갑옷도 마찬가지입니다
  lexicon: HALOT
  rationale: חֲנִית는 ‘창’이 가장 안정적이고, מַסָּע는 희귀어라 ‘표창’으로 기능을 살렸습니다. וְשִׁרְיָה는 문맥상 무기 명칭으로 읽는 해석을 따라 ‘화살촉’으로 옮겼으며, 전통적 가능성인 ‘갑옷’은 별도 각주로 보존했습니다.
theological_decisions:
- issue: 무기 목록의 희귀어 וְשִׁרְיָה 해석
  chosen_reading: 문맥상 공격 무기 연속열로 읽어 ‘화살촉’으로 번역했습니다.
  alternative_readings:
  - ‘갑옷’
  - ‘철갑’
  rationale: 앞의 ‘칼, 창, 표창’과 평행을 이루는 무기열로 이해하는 것이 본문의 진술을 가장 일관되게 드러냅니다. 다만 어휘가 드물고 뜻이 불확실하므로 대안은 각주로 남깁니다.
  doctrine_reference: 본문 해석상의 문맥 우선 원칙
