    rationale: 「헛되게 끝나고 말며」는 원문의 ‘헛된 것으로 드러난다’보다 우회적이며, 뒤의 수사 의문문에 「-며」로 연결한 구조도 부자연스럽습니다.
  - severity: medium
    issue: 「겁에 질려」가 명시되지 않은 반응 방식을 추가합니다.
    rationale: 본문은 보는 이가 ‘내던져지거나 쓰러지는’ 결과를 말할 뿐, 이를 직접적으로 ‘겁에 질림’이라고 규정하지 않습니다. 공포는 문맥상 가능하지만 번역 본문에 첨가하지 않는 편이 안전합니다.
