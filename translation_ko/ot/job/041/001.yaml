id: JOB.41.1
reference: Job 41:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
  footnotes:
  - marker: a
    text: Or, 'his expectation is disappointed' or 'his confidence fails.' The Hebrew verb can emphasize that the hope turns out to be deceptive or disappointed.
    reason: lexical_alternative
  - marker: b
    text: Or, 'is one not laid low at the mere sight of him?'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그의 희망은 헛되게 끝나고 말며, 그를 보기만 해도 사람이 겁에 질려 쓰러지지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그의 기대가 좌절되고 만다」, 「그의 믿음이 무너지고 만다」. 히브리어 동사는 희망이 속임수처럼 드러나거나 기대가 무너지는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그의 모습만 보아도 사람이 쓰러지지 않습니까?」
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어에서는 단순한 서술보다 독자에게 직접 시선을 돌리는 「보십시오」가 가장 자연스럽고 공문체에도 맞습니다.
- source_word: תֹּחַלְתּוֹ
  english_pob_choice: his hope
  chosen_korean: 그의 희망
  alternatives_korean:
  - 그의 소망
  - 그의 기대
  lexicon: HALOT
  rationale: 희망/기대의 범위가 있으나, 시적 문맥에서 가장 직접적이고 표준적인 대응은 「희망」입니다.
- source_word: נִכְזָבָה
  english_pob_choice: proves false
  chosen_korean: 헛되게 끝나고 말며
  alternatives_korean:
  - 거짓으로 드러나며
  - 실패하고 말며
  - 좌절되고 말며
  lexicon: HALOT
  rationale: 단순한 실패보다, 기대가 결국 속빈 것으로 판명되는 결과를 드러내므로 「헛되게 끝나고 말며」로 결과 상태를 살렸습니다.
- source_word: יֻטָל
  english_pob_choice: is cast down
  chosen_korean: 쓰러지지 않습니까
  alternatives_korean:
  - 내던져지지 않습니까
  - 엎드러지지 않습니까
  - 깊이 눌려지지 않습니까
  lexicon: HALOT
  rationale: 원문의 수동적 ‘내던져짐/눌려짐’과 공포로 인한 붕괴를 한국어 관용으로 옮기기 위해 「쓰러지다」를 택했습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 서술형이 아니라 반문형으로 처리해, 리워야단의 압도적 위력을 강조하는 시적 수사로 읽히게 했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 단정형으로 재구성
  rationale: 히브리어의 הֲגַם…יֻטָל 구조는 단순 정보 전달이 아니라 압도적 반응을 끌어내는 반문이므로, 한국어에서도 그 긴장감을 유지해야 합니다.
  doctrine_reference: 시적 수사와 본문 정황
- issue: ‘그를 보기만 해도’의 반응 표현
  chosen_reading: 직역의 낯섦을 줄이되, 단순 외형 묘사가 아니라 실제 공포 반응을 드러내도록 처리했습니다.
  alternative_readings:
  - 그의 모습을 보기만 해도
  - 그의 모습 앞에서
  rationale: אֶל מַרְאָיו는 ‘보는 즉시’의 반응을 가리키며, 본문은 리워야단의 존재감이 사람을 무너뜨린다는 점을 강조합니다.
  doctrine_reference: 본문의 시적 과장과 공포 이미지
