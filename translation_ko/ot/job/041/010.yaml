  text: עֲֽ֭טִישֹׁתָי/ו תָּ֣הֶל א֑וֹר וְ֝/עֵינָ֗י/ו כְּ/עַפְעַפֵּי שָֽׁחַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
  footnotes:
  - marker: a
    text: Or 'His sneezes shine with light.' The Hebrew verb is causative ('cause light to shine'), and the phrase is highly poetic.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'like the eyelids of dawn,' a Hebrew poetic image for the first opening light of day.
    reason: cultural_note
translation:
  language: ko
  text: 그의 재채기는 빛을 번쩍이게 하고, 그의 눈은 새벽의 눈꺼풀 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빛이 빛나게 하다’라는 사역적 표현입니다. ‘빛을 번쩍이게 하다’는 그 시적인 강도를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새벽의 눈꺼풀’은 새벽빛이 처음 열리는 모습을 떠올리게 하는 히브리 시어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  english_pob_choice: his sneezings
  chosen_korean: 그의 재채기
  alternatives_korean:
  - 그의 재채기들
  - 그의 코골이 같은 숨소리
  lexicon: HALOT
  rationale: עֲטִישֹׁתָיו는 ‘재채기들/재채기’에 해당하므로, 한국어에서는 자연스러운 단수 집합 표현인 ‘재채기’로 옮겼습니다.
- source_word: תָּהֶל א֑וֹר
  english_pob_choice: flash forth light
  chosen_korean: 빛을 번쩍이며 내뿜고
  alternatives_korean:
  - 빛을 비추고
  - 빛을 발하고
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스와 시적 생동감을 살려, 단순한 ‘비추다’보다 더 강한 ‘번쩍이며 내뿜다’로 옮겼습니다.
- source_word: כְּעַפְעַפֵּי שָׁחַר
  english_pob_choice: like the eyelids of dawn
  chosen_korean: 새벽의 눈꺼풀 같습니다
  alternatives_korean:
  - 새벽의 눈꺼풀 같은 듯합니다
  - 여명의 눈꺼풀 같습니다
  lexicon: HALOT
  rationale: עַפְעַפֵּי를 직역해 ‘눈꺼풀’ 이미지를 보존했고, שָׁחַר는 ‘새벽’으로 옮겨 시적 비유를 그대로 드러냈습니다.
