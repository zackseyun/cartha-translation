  text: לֹֽא יַבְרִיחֶ֥/נּוּ בֶן קָ֑שֶׁת לְ֝/קַ֗שׁ נֶהְפְּכוּ ל֥/וֹ אַבְנֵי קָֽלַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the son of the bow,'' that is, an archer or bowman.'
    reason: lexical_alternative
translation:
  language: ko
  text: 활 쏘는 자도 그를 도망하게 하지 못하며, 활촉 돌도 그에게는 짚처럼 여겨집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “활의 아들”이며, 곧 궁수나 활쏘는 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  english_pob_choice: cannot make him flee
  chosen_korean: 도망하게 하지 못하며
  alternatives_korean:
  - 도망치게 하지 못하며
  - 달아나게 하지 못하며
  - 쫓아내지 못하며
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘도망하게 하다’로 옮기면, 무기가 리워야단을 움직이지 못한다는 맥락이 자연스럽게 드러납니다.
- source_word: בֶן קָשֶׁת
  english_pob_choice: the son of the bow
  chosen_korean: 활 쏘는 자
  alternatives_korean:
  - 활의 아들
  - 활잡이
  - 궁수
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 직역하면 뜻이 막힐 수 있어, 본문의 의도인 ‘활을 다루는 사람’이라는 의미를 풀어 옮겼습니다.
- source_word: לְקַשׁ
  english_pob_choice: like stubble
  chosen_korean: 짚처럼
  alternatives_korean:
  - 짚같이
  - 볏짚처럼
  - 짚더미처럼
  lexicon: HALOT
  rationale: קַשׁ은 마른 줄기나 짚 같은 사물을 가리키므로, 가볍고 무력한 이미지를 살려 ‘짚처럼’으로 옮겼습니다.
- source_word: אַבְנֵי קָלַע
  english_pob_choice: slingstones
  chosen_korean: 활촉 돌
  alternatives_korean:
  - 투석 돌
  - 돌팔매 돌
  - 슬링 돌
  lexicon: HALOT
  rationale: 돌을 던지는 무기 이미지가 분명하므로 ‘활촉 돌’보다 ‘투석 돌’이 더 자연스럽고, 히브리어의 무기용 돌이라는 뜻을 살립니다.
theological_decisions:
- issue: 전투 이미지의 강조를 위해 무기 실패를 어떻게 처리할지
  chosen_reading: 본문은 리워야단 앞에서 활과 투석돌이 전혀 위력을 발휘하지 못한다는 점을 직설적으로 표현했습니다.
  alternative_readings:
  - 무기가 충분하지 않다는 뉘앙스로 완화하는 읽기
  - 비유적으로만 약함을 말하는 읽기
  rationale: 시의 병렬 구조는 공격 무기의 무력함을 강하게 말하므로, 이를 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: 욥기 41장의 리워야단 묘사
