  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
  footnotes:
  - marker: a
    text: Or, more formally, 'Who has preceded me, that I should repay him?' The Hebrew verb can mean 'come before' or 'anticipate,' but here likely carries the sense of giving first so as to place another under obligation.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 내게 먼저 주어서 내가 그에게 갚아야 하겠습니까? 하늘 아래의 모든 것이 다 내 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘누가 내 앞서서 왔기에 내가 그에게 갚아야 하겠습니까?’라고도 옮길 수 있습니다. 히브리어 동사는 ‘앞서 오다’ 또는 ‘먼저 대하다/베풀다’의 뜻을 가질 수 있으나, 여기서는 앞서 무엇을 줌으로써 상대를 빚지게 한다는 뜻이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 있습니까
  lexicon: HALOT
  rationale: 수사적 질문의 주어를 자연스럽게 살리기 위해 평이한 의문대명사 ‘누가’를 썼습니다.
- source_word: הִקְדִּימַנִי
  english_pob_choice: has first given to me
  chosen_korean: 내게 먼저 주어서
  alternatives_korean:
  - 내게 먼저 주었기에
  - 내보다 먼저 와서
  - 나보다 앞서 주어서
  lexicon: HALOT
  rationale: 동사의 핵심은 단순한 시간적 ‘앞섬’이 아니라 먼저 베풀어 하나님을 빚진 자로 만들려는 뜻이므로, POB의 해석을 따라 ‘먼저 주어서’로 옮겼습니다.
- source_word: וַאֲשַׁלֵּם
  english_pob_choice: that I should repay him
  chosen_korean: 내가 그에게 갚아야 하겠습니까
  alternatives_korean:
  - 내가 그에게 갚겠습니까
  - 내가 그에게 갚도록 되어 있습니까
  lexicon: HALOT
  rationale: 결과/귀결을 나타내는 수사적 뜻을 살려 ‘갚아야 하겠습니까’로 옮겨, 실제 약속이 아니라 반문임을 드러냈습니다.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  english_pob_choice: under all the heavens
  chosen_korean: 하늘 아래의 모든 것이
  alternatives_korean:
  - 온 하늘 아래의 모든 것이
  - 온 세상이
  - 하늘 아래 모든 것이
  lexicon: HALOT
  rationale: 히브리어의 포괄적 총칭을 유지하되, 한국어에서 자연스러운 전체성 표현인 ‘하늘 아래의 모든 것’으로 옮겼습니다.
- source_word: לִי הוּא
  english_pob_choice: is mine
  chosen_korean: 다 내 것입니다
  alternatives_korean:
  - 내 것입니다
  - 내게 속합니다
  - 다 제 것입니다
  lexicon: HALOT
  rationale: ‘to me it is’의 소유 선언을 간결한 현대 한국어로 살리되, 문맥상 전부를 가리키는 뜻을 드러내기 위해 ‘다’를 보탰습니다.
theological_decisions:
- issue: 하나님의 부채 없음과 보편적 소유권
  chosen_reading: 첫째 절은 아무도 하나님께 먼저 베풀어 하나님을 갚아야 할 채권자로 만들 수 없다는 반문이며, 이어지는 절은 하늘 아래의 모든 것이 이미 하나님의 것임을 선포합니다.
  alternative_readings:
  - ‘누가 나보다 먼저 왔느냐’ 정도의 단순한 시간 우선으로 읽을 수도 있습니다.
  rationale: 문맥의 ‘갚다’와 결합할 때 의미 중심은 시간 순서가 아니라 선행 베풂으로 인한 의무 부과에 있으므로, 그 긴장을 유지했습니다.
  doctrine_reference: 욥기 41:3 문맥; 번역 원칙 §§1, 3, 5
