  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
  footnotes:
  - marker: a
    text: Or "firm like the lower millstone"; the Hebrew verb literally relates to something cast or poured, hence rigid or solid.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음은 돌처럼 단단하며, 아랫맷돌처럼 단단합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌처럼 굳어 있으며, 아랫맷돌처럼 굳어 있습니다.” 히브리어 동사는 문자적으로 ‘붓다’ 또는 ‘주조하다’와 관련되어 있으며, 여기서는 굳고 견고한 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 그의 마음
  alternatives_korean:
  - 그의 심장
  - 그의 속마음
  - 그의 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב/לֵבָב는 사고·의지·성향의 중심을 가리키므로, 이 시적 문맥에서는 생리적 심장보다 심리적 중심을 뜻하는 ‘마음’이 가장 자연스럽습니다.
- source_word: יָצוּק
  english_pob_choice: is hard
  chosen_korean: 단단합니다
  alternatives_korean:
  - 굳어 있습니다
  - 굳습니다
  - 딱딱합니다
  lexicon: HALOT
  rationale: 어근상 ‘붓다/주조하다’와 관련되지만, 여기서는 돌처럼 굳고 견고하다는 뜻이므로 현대 한국어에서는 상태를 드러내는 ‘단단합니다’가 가장 잘 맞습니다.
- source_word: כְּמוֹ אָבֶן
  english_pob_choice: like a stone
  chosen_korean: 돌처럼
  alternatives_korean:
  - 돌 같이
  - 석처럼
  lexicon: HALOT
  rationale: 직유를 자연스럽게 살리되, 시적 병렬을 해치지 않도록 ‘돌처럼’으로 옮겼습니다.
- source_word: כְּפֶלַח תַּחְתִּית
  english_pob_choice: like the lower millstone
  chosen_korean: 아래맷돌처럼
  alternatives_korean:
  - 아랫맷돌처럼
  - 아래쪽 맷돌처럼
  - 하부 맷돌처럼
  lexicon: HALOT
  rationale: ‘펠라흐’는 여기서 맷돌의 아래쪽 돌을 가리키는 표현으로 이해되므로, 한국어에서는 관용적으로 이해되는 ‘아래맷돌’이 가장 간결하고 명확합니다.
