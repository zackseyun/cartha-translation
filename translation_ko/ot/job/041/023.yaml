theological_decisions:
- issue: 시적 비교의 강도와 이미지 보존
  chosen_reading: ‘깊은 바다’와 ‘향유 솥’의 구체적 이미지를 유지해, 하나님이 창조 질서의 거대한 물을 압도적으로 흔드시는 장면을 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘깊은 곳’과 ‘향료 혼합물’로 더 추상적으로 처리하는 읽기
  rationale: 이 절은 설명보다 시각적 충격이 핵심이므로, 전통적 완곡화보다 원문의 생생한 비유를 우선했습니다.
  doctrine_reference: 욥기 41장의 리워야단 묘사와 하나님의 주권적 능력
- issue: 문장 주어의 지시
  chosen_reading: 주어를 ‘그’로 두어 앞문맥의 리워야단을 자연스럽게 이어 받도록 했습니다.
  alternative_readings:
  - 주어를 생략하는 번역
  rationale: 히브리어 원문은 서술의 주체가 문맥상 명확하므로, 한국어에서도 앞절의 지시를 이어 읽히게 하는 것이 적절합니다.
  doctrine_reference: 본문 문맥 일관성
