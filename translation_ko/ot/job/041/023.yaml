translation:
  language: ko
  text: 그가 깊은 물을 솥처럼 끓게 하고, 바다를 향유 혼합물처럼 만듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향료를 섞어 만든 것처럼’ 또는 ‘향유처럼’으로 옮길 수 있습니다. 히브리어 מְרְקָחָה는 향료를 섞어 만든 혼합물, 특히 향유나 향수와 관련된 것을 가리킵니다.
    reason: lexical_alternative
