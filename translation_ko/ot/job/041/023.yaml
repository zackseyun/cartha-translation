base_translation:
  language: en
  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
  footnotes:
  - marker: a
    text: Or 'like a perfumer’s mixture' or 'like ointment.' The Hebrew term refers to a compounded mixture, often associated with ointment or perfume.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 깊은 바다를 솥처럼 끓게 하고, 바다를 향유 솥처럼 만듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향료 혼합물처럼’, 혹은 ‘향유처럼’으로도 옮길 수 있습니다. 히브리어 מְרְקָחָה는 대개 향유나 향수로 쓰이는 혼합물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּ֣יחַ
  english_pob_choice: makes ... boil
  chosen_korean: 끓게 하고
  alternatives_korean:
  - 끓어오르게 하고
  - 부글부글 끓게 하고
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히는 동사구로 옮겼습니다.
- source_word: כַּ/סִּ֣יר
  english_pob_choice: like a pot
  chosen_korean: 솥처럼
  alternatives_korean:
  - 냄비처럼
  - 가마솥처럼
  lexicon: HALOT
  rationale: 시적 병행에서 כלי의 이미지가 분명하므로 일반적인 조리 용기인 솥으로 옮겨 비교를 유지했습니다.
- source_word: מְצוּלָ֑ה
  english_pob_choice: the deep
  chosen_korean: 깊은 바다
  alternatives_korean:
  - 깊은 곳
  - 심연
  lexicon: HALOT
  rationale: 문맥상 ‘바다’와 병행되는 수심의 이미지를 살리기 위해 ‘깊은 바다’로 구체화했습니다.
- source_word: כַּ/מֶּרְקָחָֽה
  english_pob_choice: like a pot of ointment
  chosen_korean: 향유 솥처럼
  alternatives_korean:
  - 향료 혼합물처럼
  - 향유처럼
  lexicon: HALOT
  rationale: מֶרְקָחָה의 혼합된 향유/향료 이미지를 반영하되, 끓어오르는 액체의 시각적 대비를 살리기 위해 ‘향유 솥처럼’으로 옮겼습니다.
theological_decisions:
- issue: 시적 비교의 강도와 이미지 보존
  chosen_reading: ‘깊은 바다’와 ‘향유 솥’의 구체적 이미지를 유지해, 하나님이 창조 질서의 거대한 물을 압도적으로 흔드시는 장면을 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘깊은 곳’과 ‘향료 혼합물’로 더 추상적으로 처리하는 읽기
  rationale: 이 절은 설명보다 시각적 충격이 핵심이므로, 전통적 완곡화보다 원문의 생생한 비유를 우선했습니다.
  doctrine_reference: 욥기 41장의 리워야단 묘사와 하나님의 주권적 능력
- issue: 문장 주어의 지시
  chosen_reading: 주어를 ‘그’로 두어 앞문맥의 리워야단을 자연스럽게 이어 받도록 했습니다.
  alternative_readings:
  - 주어를 생략하는 번역
  rationale: 히브리어 원문은 서술의 주체가 문맥상 명확하므로, 한국어에서도 앞절의 지시를 이어 읽히게 하는 것이 적절합니다.
  doctrine_reference: 본문 문맥 일관성
