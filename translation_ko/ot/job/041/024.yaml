  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭חֲרָי/ו יָאִ֣יר נָתִ֑יב יַחְשֹׁ֖ב תְּה֣וֹם לְ/שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
  footnotes:
  - marker: a
    text: Or 'After him a path shines.' The Hebrew may be read temporally ('after him') or spatially ('behind him'); the context of a wake in the water favors 'behind him.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the deep to gray hair/hoariness,' an image of the sea appearing white with foam, as though gray-haired.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뒤에는 길이 빛나고[a], 깊은 바다는 백발이 된 듯 보입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 지나간 뒤에 길이 빛납니다.” 히브리어는 시간적으로 ‘뒤에’ 또는 공간적으로 ‘뒤에’를 뜻할 수 있습니다. 물 위에 남는 흔적이라는 문맥에서는 공간적 의미가 더 알맞습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “깊음을 백발로 여긴다”입니다. 바다의 포말 때문에 깊은 물이 희끗하게 보이는 모습을, 백발이 된 것처럼 시적으로 묘사한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֭חֲרָיו
  english_pob_choice: Behind him
  chosen_korean: 그의 뒤로
  alternatives_korean:
  - 그 뒤에
  - 그의 뒤에서
  - 그의 이후로
  lexicon: HALOT
  rationale: 문맥이 리워야단이 물을 가르며 지나간 뒤에 남는 흔적을 묘사하므로, 시간적 ‘이후로’보다 공간적 ‘뒤로’가 더 정확합니다.
- source_word: יָאִ֣יר
  english_pob_choice: shines
  chosen_korean: 빛나고
  alternatives_korean:
  - 비치고
  - 환하게 하고
  - 밝아지고
  lexicon: HALOT
  rationale: 물결의 흔적이 시각적으로 밝아지는 상태를 자연스럽게 살리기 위해 ‘빛나고’로 옮겼습니다.
- source_word: יַחְשֹׁ֖ב
  english_pob_choice: one would think
  chosen_korean: 사람은 ... 생각합니다
  alternatives_korean:
  - 누구나 ... 생각합니다
  - 그것은 ...로 보입니다
  - 사람들이 ...로 여깁니다
  lexicon: HALOT
  rationale: 히브리어의 비인칭적 관찰 표현을 한국어의 자연스러운 일반화 표현으로 옮겨, 보는 이의 인상을 드러냈습니다.
- source_word: תְּה֣וֹם לְ/שֵׂיבָֽה
  english_pob_choice: the deep to be gray-haired
  chosen_korean: 그 깊은 바다가 회색 머리처럼 된다고
  alternatives_korean:
  - 그 깊은 바다가 백발처럼 된다고
  - 깊은 바다가 회색 수염처럼 보인다고
  - 깊은 바다가 흰 머리처럼 보인다고
  lexicon: HALOT
  rationale: ‘שֵׂיבָה’의 노쇠/백발 이미지를 한국어에서 가장 직관적으로 드러내되, 거품으로 인해 바다가 희끗해 보이는 시적 비유를 유지했습니다.
theological_decisions:
- issue: 시적 비유의 강도 유지
  chosen_reading: 리워야단이 지나간 뒤 바다가 희끗해 보이는 장면을 직설적 설명으로 약화시키지 않고, ‘회색 머리처럼’이라는 비유를 유지했습니다.
  alternative_readings:
  - ‘백발처럼’으로 더 풀어 쓰는 해석
  - ‘흰 거품처럼’으로 의미를 명시하는 해석
  rationale: 본문은 바다의 흰 포말을 노쇠한 머리의 이미지로 묘사하는 시적 과장을 사용하므로, 해석을 과도하게 풀어 쓰기보다 원문의 장면감을 보존하는 편이 좋습니다.
  doctrine_reference: 시적 본문 해석 원칙
- issue: 비인칭 표현의 주체 처리
  chosen_reading: 히브리어의 ‘생각하다’는 표현을 주어를 특정하지 않는 일반 관찰로 옮겼습니다.
  alternative_readings:
  - ‘그가 생각합니다’로 특정 주체를 두는 해석
  - ‘보기에’로 완전히 무주체화하는 해석
  rationale: 문맥상 특정 인물의 내적 판단이 아니라 관찰자의 일반적 인상을 말하므로, 비인칭성을 살리되 한국어 문장으로 자연화했습니다.
  doctrine_reference: 히브리 시문학의 관찰자 시점
