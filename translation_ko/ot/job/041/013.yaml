lexical_decisions:
- source_word: נַפְשׁוֹ
  english_pob_choice: his breath
  chosen_korean: 그의 숨
  alternatives_korean:
  - 그의 생명
  - 그의 목구멍
  - 그의 영혼
  lexicon: HALOT
  rationale: 문맥상 신체적 발화의 이미지가 강하므로, POB의 “his breath”에 맞춰 현대 한국어의 자연스러운 표현인 “숨”으로 옮겼습니다.
- source_word: גֶּחָלִים
