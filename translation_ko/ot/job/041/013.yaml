  rationale: 직역상 ‘숯/숯불’이 가능하지만, 여기서는 이미 ‘붙이다’와 결합해 발화의 이미지를 살리는 표현이 필요하므로 “숯불”을 택했습니다.
- source_word: תְּלַהֵט
