  - 타는 숯
  lexicon: HALOT
  rationale: 직역상 ‘숯/숯불’이 가능하지만, 여기서는 이미 ‘붙이다’와 결합해 발화의 이미지를 살리는 표현이 필요하므로 “숯불”을 택했습니다.
- source_word: תְּלַהֵט
  english_pob_choice: kindles
  chosen_korean: 붙이고
  alternatives_korean:
  - 불붙게 하고
  - 활활 타오르게 하고
  - 점화하고
  lexicon: HALOT
  rationale: Piel의 사역적 의미를 살리되 한국어에서는 “붙이다”가 가장 자연스럽고, 이어지는 병행구와도 잘 맞습니다.
- source_word: וְלַהַב
  english_pob_choice: and a flame
  chosen_korean: 불꽃
  alternatives_korean:
  - 화염
  - 불길
  - 한 불꽃
  lexicon: HALOT
  rationale: 단수 명사 ‘불꽃/불길’ 중에서 시적 병행과 현대 문체를 함께 고려해 “불꽃”으로 옮겼습니다.
