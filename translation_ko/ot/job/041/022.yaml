theological_decisions:
- issue: 직유의 유지 여부
  chosen_reading: ‘타작 써레처럼’으로 직유를 분명히 드러내어, 진흙 위에 넓게 펼쳐진 레위아단의 위압적 이미지를 보존했습니다.
  alternative_readings:
  - ‘타작 써레를 펴듯’
  - ‘타작 써레처럼 진흙 위를 덮습니다’
  rationale: 영문 POB의 수정안이 비교 구조를 더 분명히 했으므로, 한국어도 직접적인 직유로 옮겨 본문의 생생한 비유를 약화하지 않았습니다.
  doctrine_reference: 시적 묘사와 본문 의미 보존
- issue: 레위아단의 몸짓 표현
  chosen_reading: ‘몸을 펼칩니다’로 번역하여 동물의 위협적 자세를 강조했습니다.
  alternative_readings:
  - ‘퍼집니다’
  - ‘눕습니다’
  rationale: 문맥상 단순히 눕는 동작이 아니라, 넓게 퍼져 진흙을 덮는 장면이므로 동작성과 긴장감을 살리는 표현이 적절합니다.
  doctrine_reference: 문맥 충실성
