base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'his outcry' or 'his plea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'if distress comes upon him'; the Hebrew conjunction can also be read conditionally, though the temporal sense 'when' fits the context well.
    reason: alternative_reading
  - marker: c
    text: '''Distress'' may also be rendered ''trouble,'' ''calamity,'' or ''affliction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 환난[c]이 그에게 닥칠 때에[b] 하나님께서 그의 부르짖음을[a] 들으시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르짖음’은 ‘외침’이나 ‘호소’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כִּי는 여기서 ‘때에’로 옮겼지만, ‘만일’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘환난’은 ‘고난’, ‘재앙’, ‘괴로움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  english_pob_choice: his cry
  chosen_korean: 그의 부르짖음
  alternatives_korean:
  - 그의 외침
  - 그의 호소
  lexicon: HALOT
  rationale: צעקה는 고통 속에서 부르는 울부짖음이나 간청을 가리키므로, 문맥상 자연스럽고 긴급성이 살아 있는 ‘부르짖음’이 적절합니다.
- source_word: יִשְׁמַע
  english_pob_choice: will hear
  chosen_korean: 들으시겠습니까
  alternatives_korean:
  - 들으십니까
  - 들으실 것입니까
  lexicon: HALOT
  rationale: 문맥상 수사 의문이므로 미래적 질문을 살리면서도 한국어에서 자연스러운 ‘들으시겠습니까’로 옮겼습니다.
- source_word: כִּי
  english_pob_choice: when
  chosen_korean: -때에
  alternatives_korean:
  - -하면
  - -이므로
  lexicon: HALOT
  rationale: 여기서는 조건보다 시간적 의미가 더 자연스러우므로, 앞절과 연결되는 ‘-때에’로 처리했습니다.
- source_word: צָרָה
  english_pob_choice: distress
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 재앙
  - 괴로움
  lexicon: HALOT
  rationale: צָרָה는 압박과 곤란을 가리키는 넓은 말이어서, 본문 흐름과 한국어 성경 문체에 잘 맞는 ‘환난’을 택했습니다.
theological_decisions:
- issue: 문장의 수사적 구조와 주어-목적어 관계
  chosen_reading: 하나님께서 그 사람의 부르짖음을 들으실지 묻는 수사 의문으로 유지했습니다.
  alternative_readings:
  - 진술문으로 완화하여 ‘하나님은 그의 부르짖음을 들으십니다’
  - 단순한 가능 질문으로 낮추어 표현
  rationale: 본문은 고난받는 자의 상황에서 하나님이 그 부르짖음에 응답하시는지에 대한 반문이므로, 질문형과 긴장감을 보존해야 합니다.
  doctrine_reference: 욥기의 논증적·수사적 발화 방식 보존
- issue: כִּי의 관계 설정
  chosen_reading: 시간적 의미(‘때에’)를 기본으로 반영했습니다.
  alternative_readings:
  - 조건적 의미(‘만일’)
  - 인과적 의미(‘왜냐하면’)
  rationale: 히브리어 접속사 כִּי의 범위는 넓지만, 여기서는 이어지는 상황 묘사와 함께 읽을 때 시간적 해석이 가장 자연스럽고 본문 흐름을 잘 드러냅니다.
  doctrine_reference: 히브리어 접속사 다의성의 문맥 결정
