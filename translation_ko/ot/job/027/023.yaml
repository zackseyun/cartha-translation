source:
  edition: WLC
  text: יִשְׂפֹּ֣ק עָלֵ֣י/מוֹ כַפֵּ֑י/מוֹ וְ/יִשְׁרֹ֥ק עָ֝לָ֗י/ו מִ/מְּקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/023.yaml
  text: He claps his hands at him and hisses at him from his place[a][b].
  footnotes:
  - marker: a
    text: Or 'whistles at him.' The Hebrew verb can denote whistling or hissing; here 'hisses' was chosen to reflect the hostile tone.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew leaves the subject implicit: ''he claps ... and hisses.'' Interpreters variously understand this as God, other people, or an impersonal force.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그에게 박수를 치고, 자기 자리에서 그에게 야유하듯 휘파람을 붑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘휘파람을 불다’로 옮길 수 있습니다. 히브리어 동사는 휘파람과 쉿 소리를 모두 뜻할 수 있지만, 여기서는 적대적 뉘앙스를 살리기 위해 ‘야유하듯 휘파람을 붑니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 주어를 명시하지 않고 ‘박수 치고 … 야유한다’고만 말합니다. 해석자들은 이를 하나님, 다른 사람들, 혹은 비인격적 힘으로 다양하게 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  english_pob_choice: claps
  chosen_korean: 박수를 치고
  alternatives_korean:
  - 손뼉을 치고
  - 손을 치고
  lexicon: HALOT
  rationale: כפיים와 함께 나온 동사는 구체적 손동작인 ‘clap’에 해당하므로, 한국어에서는 자연스럽게 ‘박수를 치고’로 옮겨 손뼉 치는 동작을 살렸습니다.
- source_word: עָלָיו / עָלֵימוֹ
  english_pob_choice: at him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 향해
  - 그에게 대고
  lexicon: HALOT
  rationale: על + 목적어의 방향성은 한국어에서 ‘-에게’가 가장 간결하고 자연스럽습니다. 호의적이기보다 조롱·적대의 방향성을 문맥상 유지합니다.
- source_word: וְיִשְׁרֹק
  english_pob_choice: hisses
  chosen_korean: 야유하듯 휘파람을 붑니다
  alternatives_korean:
  - 휘파람을 붑니다
  - 쉿 소리를 냅니다
  - 야유합니다
  lexicon: HALOT
  rationale: שרק은 ‘휘파람/쉿 소리’ 둘 다 가능하지만, 문맥의 적대적·조롱적 뉘앙스를 살리기 위해 ‘야유하듯 휘파람을 붑니다’로 옮겼습니다.
- source_word: מִמְּקֹמוֹ
  english_pob_choice: from his place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 자기 자리에서부터
  - 그의 처소에서
  lexicon: HALOT
  rationale: מקום은 넓게 ‘place’이므로, 한국어에서는 ‘자리’가 가장 중립적으로 ‘그가 있는 곳’을 표현합니다. ‘from his place’의 거리감을 보존하기 위해 ‘에서’로 처리했습니다.
theological_decisions:
- issue: 주어의 명시 여부
  chosen_reading: 주어를 특정하지 않고 ‘그는’으로 유지했습니다.
  alternative_readings:
  - 하나님이 그에게 박수 치고 야유하신다
  - 사람들이 그에게 박수 치고 야유한다
  - 바람이나 비인격적 힘이 그렇게 한다
  rationale: 히브리어는 3인칭 남성 단수 동사만 사용하고 주어를 밝히지 않으므로, 본문이 허용하는 모호성을 한국어에서도 유지했습니다. 이는 해석을 확정하기보다 문맥적 긴장을 보존하는 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
