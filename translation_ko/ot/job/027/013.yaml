  rationale: שדי를 칭호로 보고 의미 번역을 따랐으며, 문맥상 ‘받다’와 어울리도록 출처를 나타내는 ‘-에게서’를 사용했습니다.
theological_decisions:
- issue: עִם אֵל의 관계 표현
  chosen_reading: 하나님과의 몫
  alternative_readings:
  - 하나님에게서의 몫
  - 하나님 앞의 몫
  rationale: 직역의 ‘with God’는 욥기 문맥에서 하나님과 관련된 배당/몫이라는 뜻으로 읽힐 수 있어, 본문 의미를 더 분명히 하되 주석적 여지를 남기는 ‘하나님과의 몫’을 택했습니다.
  doctrine_reference: Job 27:13 문맥상 보응의 몫/유산
- issue: יִקָּחוּ의 어감
  chosen_reading: 받는
  alternative_readings:
  - 취하는
  - 가져가는
  rationale: ‘취하다’의 직역보다 상속·배당 문맥에서 결과를 수동적으로 ‘받는다’는 뜻이 더 분명하므로, 문맥적 의미를 살렸습니다.
  doctrine_reference: 할당된 유산의 의미
