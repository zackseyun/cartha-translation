id: JOB.27.13
reference: Job 27:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֖ם רָשָׁ֥ע עִם אֵ֑ל וְֽ/נַחֲלַ֥ת עָ֝רִיצִ֗ים מִ/שַּׁדַּ֥י יִקָּֽחוּ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
  footnotes:
  - marker: a
    text: Or 'with God' may be understood idiomatically as 'from God' in the sense of what God allots to the wicked man.
    reason: lexical_alternative
  - marker: b
    text: Or 'the violent' for 'the ruthless.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'take'; rendered 'receive' here because the context is an allotted portion or inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 악인의 하나님과의 몫이며, 무뢰한들이 전능하신 분에게서 받는 유산입니다:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나님과 함께’이지만, 문맥상 하나님이 악인에게 정하시는 몫이라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘무뢰한들’은 ‘폭력적인 자들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘취하다’이지만, 유산·몫의 문맥에서는 ‘받다’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה / This is
  english_pob_choice: This is
  chosen_korean: 이것이 …입니다
  alternatives_korean:
  - 이것은 …입니다
  - 바로 이것이 …입니다
  lexicon: WLC
  rationale: 지시어로 시작하는 선언문 구조를 한국어에서는 자연스럽게 ‘이것이 …입니다’로 옮겨, 단정적이고 경구적인 어조를 살렸습니다.
- source_word: חֵלֶק / portion
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 분깃
  - 차지
  lexicon: HALOT
  rationale: 지혜문맥에서 ‘할당된 분량/배당’의 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 ‘몫’을 택했습니다.
- source_word: רָשָׁע / wicked
  english_pob_choice: wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 불의한 자
  lexicon: HALOT
  rationale: 형용사적 의미를 인격화된 명사로 옮겨, 욥기의 도덕적 대조를 분명하게 드러냈습니다.
- source_word: עָרִיצִים / the ruthless
  english_pob_choice: the ruthless
  chosen_korean: 무뢰한들
  alternatives_korean:
  - 무자비한 자들
  - 포악한 자들
  - 폭력배들
  lexicon: HALOT
  rationale: 원어가 가리키는 압제적·포악한 사람들을 현대 한국어에서 압축적으로 드러내는 표현으로 ‘무뢰한들’을 선택했습니다.
- source_word: מִשַּׁדַּי / from the Almighty
  english_pob_choice: from the Almighty
  chosen_korean: 전능하신 분에게서
  alternatives_korean:
  - 전능자에게서
  - 샤다이에게서
  lexicon: HALOT
  rationale: שדי를 칭호로 보고 의미 번역을 따랐으며, 문맥상 ‘받다’와 어울리도록 출처를 나타내는 ‘-에게서’를 사용했습니다.
theological_decisions:
- issue: עִם אֵל의 관계 표현
  chosen_reading: 하나님과의 몫
  alternative_readings:
  - 하나님에게서의 몫
  - 하나님 앞의 몫
  rationale: 직역의 ‘with God’는 욥기 문맥에서 하나님과 관련된 배당/몫이라는 뜻으로 읽힐 수 있어, 본문 의미를 더 분명히 하되 주석적 여지를 남기는 ‘하나님과의 몫’을 택했습니다.
  doctrine_reference: Job 27:13 문맥상 보응의 몫/유산
- issue: יִקָּחוּ의 어감
  chosen_reading: 받는
  alternative_readings:
  - 취하는
  - 가져가는
  rationale: ‘취하다’의 직역보다 상속·배당 문맥에서 결과를 수동적으로 ‘받는다’는 뜻이 더 분명하므로, 문맥적 의미를 살렸습니다.
  doctrine_reference: 할당된 유산의 의미
