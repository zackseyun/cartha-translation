  - 악한 사람 같고
  lexicon: HALOT
  rationale: 비교 כ를 살리면서 רָשָׁע의 도덕적 범주를 ‘악인’으로 간결하게 표현했습니다.
- source_word: וּמִתְקוֹמְמִי
  english_pob_choice: and the one who rises against me
  chosen_korean: 나를 대적하여 일어나는 자는
  alternatives_korean:
  - 나를 거슬러 일어나는 자는
  - 나를 공격하는 자는
  - 나를 대적하는 자는
  lexicon: HALOT
  rationale: ‘일어나는’의 동작성을 유지해 אויב적 ‘대적’보다 더 직접적인 적대 행위를 드러냈습니다.
- source_word: כְעַוָּל
  english_pob_choice: like the unrighteous
  chosen_korean: 불의한 자 같기를
  alternatives_korean:
  - 부정한 자 같기를
  - 불의한 사람 같기를
  - 불의한 자처럼
  lexicon: HALOT
  rationale: עַוָּל의 의·불의 의미를 ‘불의한 자’로 옮겨 ‘악인’과 대응되는 도덕적 병렬을 살렸습니다.
theological_decisions:
- issue: 시편적/지혜문학적 저주성 희구의 어조
