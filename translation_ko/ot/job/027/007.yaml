  - …이기를 원합니다
  lexicon: HALOT
  rationale: 희구·저주를 나타내는 미완료형 용법을 현대 합쇼체의 소망 표현으로 자연스럽게 옮겼습니다.
- source_word: כְרָשָׁע
  english_pob_choice: like the wicked
  chosen_korean: 악인 같고
  alternatives_korean:
