id: JOB.27.6
reference: Job 27:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
  footnotes:
  - marker: a
    text: Or 'my integrity.' The Hebrew word commonly means 'righteousness,' but in Job it can overlap with the idea of personal integrity.
    reason: lexical_alternative
  - marker: b
    text: Or 'my heart does not taunt/revile me all my days.' The Hebrew idiom speaks of inward self-reproach.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 의를 굳게 붙들고 놓지 않을 것입니다[a]; 내 마음이 내게서 내 날들 동안 책망하지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 정직.’ 히브리어는 보통 ‘의’를 뜻하지만, 욥기에서는 개인적 정직성의 뜻과 겹칠 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 마음이 내 모든 날 동안 나를 조롱/비난하지 않습니다.’ 이 히브리어 관용구는 내적 자기책망을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  english_pob_choice: to my righteousness
  chosen_korean: 내 의
  alternatives_korean:
  - 내 righteousness
  - 내 정직
  - 내 무죄
  lexicon: HALOT
  rationale: צִדְקָה는 기본적으로 ‘의/의로움’을 뜻하므로, 여기서는 POB의 ‘righteousness’를 따라 ‘의’로 옮겨 법정적·도덕적 뉘앙스를 살렸습니다.
- source_word: הֶחֱזַקְתִּי
  english_pob_choice: I hold fast
  chosen_korean: 굳게 붙들고
  alternatives_korean:
  - 굳게 잡고
  - 굳게 지키고
  - 붙들고
  lexicon: HALOT
  rationale: חזק의 사역형은 단순 소유가 아니라 단단히 붙잡는 동작을 가리키므로, 현재적 결심을 드러내는 ‘굳게 붙들고’가 자연스럽습니다.
- source_word: וְלֹא אַרְפֶּהָ
  english_pob_choice: and will not let it go
  chosen_korean: 놓지 않을 것입니다
  alternatives_korean:
  - 풀어놓지 않을 것입니다
  - 놓아주지 않을 것입니다
  - 버리지 않을 것입니다
  lexicon: HALOT
  rationale: רפה는 여기서 ‘느슨하게 하다/놓다’의 뜻이므로, 대상인 ‘의’를 계속 놓지 않겠다는 결의를 한국어 관용으로 옮겼습니다.
- source_word: לֹא יֶחֱרַף לְבָבִי
  english_pob_choice: my heart does not reproach me
  chosen_korean: 내 마음이 내게서 … 책망하지 않습니다
  alternatives_korean:
  - 내 마음이 나를 꾸짖지 않습니다
  - 내 마음이 나를 책망하지 않습니다
  - 내 양심이 나를 책망하지 않습니다
  lexicon: HALOT
  rationale: חרף는 ‘비난하다/조롱하다’의 뜻이지만, 심장/마음이 주어일 때는 내면의 자기책망을 뜻하므로 ‘책망하다’로 옮기되 ‘양심’은 해석을 더해 배제했습니다.
- source_word: מִיָּמָי
  english_pob_choice: for any of my days
  chosen_korean: 내 날들 동안
  alternatives_korean:
  - 평생
  - 내 모든 날 동안
  - 어느 날에도
  lexicon: HALOT
  rationale: מן + ימים는 삶의 어느 시점도 예외가 없음을 나타내므로, 직역적이면서도 한국어로 자연스러운 ‘내 날들 동안’으로 처리했습니다.
theological_decisions:
- issue: צִדְקָה를 ‘의’로 유지할지, 문맥적 글로스인 ‘정직/무죄’로 완화할지
  chosen_reading: 의
  alternative_readings:
  - 정직
  - 무죄
  - 성실
  rationale: 욥기의 문맥에서 ‘의’는 단지 주관적 성실성보다 더 강한 도덕·법정적 주장까지 포함할 수 있어, POB의 lexical tension을 살리기 위해 ‘의’를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: לֹא יֶחֱרַף לְבָבִי의 내면 독백을 ‘양심’으로 명시할지
  chosen_reading: 마음이 책망하지 않음
  alternative_readings:
  - 양심이 책망하지 않음
  - 마음이 나를 꾸짖지 않음
  rationale: 본문은 ‘마음’(לֵב)을 말하므로, 현대적 해석어인 ‘양심’을 도입하지 않고 내면의 자기책망이라는 원뜻을 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §1, §5
