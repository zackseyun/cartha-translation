id: JOB.27.14
reference: Job 27:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
  footnotes:
  - marker: a
    text: Or 'will not be satisfied with bread.' The Hebrew expression is literally 'will not be filled/satisfied [with] bread,' an idiom for lacking sufficient food.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들이 많아져도[a] 그것은 칼을 위한 것이며, 그의 자손들은 빵으로 만족하지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빵으로 만족하지 못할 것입니다.’ 히브리어 표현은 문자적으로 ‘빵으로 채워지지/만족하지 못하다’이며, 충분한 음식이 없다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 아들들
  lexicon: HALOT
  rationale: 히브리어는 성별이 분명한 복수형 ‘sons’를 사용하므로, 성중립화하지 않고 직역에 가까운 ‘아들들’로 옮겼습니다.
- source_word: יִרְבּוּ
  english_pob_choice: multiply
  chosen_korean: 많아져도
  alternatives_korean:
  - 증가해도
  - 번성해도
  lexicon: HALOT
  rationale: רבה의 핵심은 수적 증가이므로 ‘많아지다’로 자연스럽게 살렸고, 조건절의 흐름을 위해 ‘-아/어도’를 붙였습니다.
- source_word: לְמוֹ חָרֶב
  english_pob_choice: it is for the sword
  chosen_korean: 그것은 칼을 위한 것이며
  alternatives_korean:
  - 그것은 칼을 위한 것입니다
  - 칼로 향한 것입니다
  - 칼을 위해 정해진 것입니다
  lexicon: HALOT
  rationale: לְמוֹ는 결과·운명적 방향을 나타내므로, 단순한 목적어구보다 ‘~을 위한 것’으로 옮겨 수사적·운명적 뉘앙스를 살렸습니다.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  english_pob_choice: will not be satisfied with bread
  chosen_korean: 빵으로 만족하지 못할 것입니다
  alternatives_korean:
  - 빵으로 배부르지 못할 것입니다
  - 빵이 충분하지 않을 것입니다
  lexicon: HALOT
  rationale: שׂבע의 기본 의미인 ‘만족/충족’을 살리면서, 현대 한국어에서 자연스러운 부정 표현으로 정리했습니다. ‘빵’은 히브리어의 구체적 이미지를 유지합니다.
theological_decisions:
- issue: פרشיית적 예언/진술의 어조
  chosen_reading: 본문을 일반적인 조건-결과 진술로 유지하고, 도덕화하거나 해석적으로 완화하지 않았습니다.
  alternative_readings:
  - 아들을 많이 둔다 해도 결국 죽음과 궁핍으로 간다
  - 아들이 많아도 재앙을 피하지 못한다
  rationale: 이 절은 지혜문학적 관찰의 형태로, ‘칼’과 ‘빵’이라는 이미지가 그대로 제시됩니다. 한국어에서도 해석을 앞세우기보다 원문의 날카로운 대비를 보존했습니다.
  doctrine_reference: 욥기 27:14의 시적·비유적 진술 보존
