  - severity: medium
    issue: ‘그것은 칼을 위한 것’의 지시 대상과 한국어 표현이 불명확함
    rationale: 원문은 늘어난 아들들이 칼의 운명에 처함을 말합니다. ‘그들은 칼의 몫이 될 것이며’가 이 관계를 명확하고 자연스럽게 나타냅니다.
