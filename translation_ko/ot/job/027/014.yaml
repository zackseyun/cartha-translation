  source_fidelity: 히브리어 אִם은 여기서 조건을 이끄므로 ‘많아져도’(양보)보다 ‘많아지면’이 적절합니다. לְמוֹ חָרֶב는 아들들이 칼, 곧 폭력적 죽음의 운명에 넘겨짐을 나타내며, ‘칼의 몫이 되다’가 이를 자연스럽고 과도한 해석 없이 전달합니다. לֹא יִשְׂבְּעוּ לָחֶם은 빵을 충분히 얻어 배부르지 못함을 뜻합니다.
  naturalness: 초안의 ‘그것은 칼을 위한 것이며’는 한국어에서 지시 대상이 불분명하고 어색합니다. 또한 각주가 ‘많아져도’에 붙어 있으나 실제로는 마지막 ‘빵’ 구절의 어휘·관용 표현을 설명하므로 해당 구절에 옮겨야 합니다.
  terminology: ‘아들들’은 בָנָיו의 남성 복수를 보존하며, ‘자손들’은 צֶאֱצָאָיו의 더 넓은 범위를 적절히 나타냅니다. ‘빵’도 לָחֶם의 구체적 표현을 유지합니다.
