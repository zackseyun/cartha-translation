  lexicon: HALOT
  rationale: 분사 נֹצֵר는 ‘지키는/감시하는 자’이지만, 영어 POB의 watchman처럼 들판이나 임시 거처를 지키는 사람의 그림을 살리기 위해 ‘보초’로 옮겼습니다.
