translation:
  language: ko
  text: 그는 나방처럼 자기 집을 짓고, 파수꾼이 만드는 초막처럼 짓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초막’은 들이나 포도원에 임시로 세운 오두막을 가리킬 수 있으며, ‘파수꾼’은 그것을 지키는 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  english_pob_choice: builds
