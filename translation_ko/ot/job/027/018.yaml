  lexicon: HALOT
  rationale: עָשׁ는 문맥상 쉽게 허물어지는 연약한 존재를 가리키는 ‘나방’이 가장 직접적이며, 비교 표지 כ를 ‘-처럼’으로 살렸습니다.
- source_word: וּכְסֻכָּה
  english_pob_choice: like a shelter
