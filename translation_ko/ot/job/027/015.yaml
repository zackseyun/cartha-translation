id: JOB.27.15
reference: Job 27:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שריד/ו בַּ/מָּ֣וֶת יִקָּבֵ֑רוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
  footnotes:
  - marker: a
    text: Or 'will be buried in death.' The Hebrew phrase is compressed and may express either the manner/fate of burial or burial amid death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 살아남은 자들은 죽음으로 묻히고, 그의 과부들은 울지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 압축적이어서 ‘죽음으로’는 매장의 방식/운명을, ‘죽음 안에서’는 매장의 장소성을 더 드러낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  english_pob_choice: those who survive him
  chosen_korean: 그의 살아남은 자들
  alternatives_korean:
  - 그의 생존자들
  - 그의 남은 자들
  - 그의 잔존자들
  lexicon: HALOT
  rationale: שָׂרִיד는 ‘남아 있는 자, 살아남은 자’의 뜻이므로, 사람을 집합적으로 가리키는 복수 표현으로 옮겼습니다.
- source_word: בַּמָּוֶת
  english_pob_choice: by death
  chosen_korean: 죽음으로
  alternatives_korean:
  - 죽음 안에서
  - 죽음에 의해
  - 죽음 가운데
  lexicon: HALOT
  rationale: בְּ + 명사구는 이 구절에서 죽음이 매장 방식이나 운명을 나타내는 압축 표현이므로, ‘죽음으로’가 그 긴장감을 비교적 직접적으로 살립니다.
- source_word: יִקָּבֵרוּ
  english_pob_choice: will be buried
  chosen_korean: 묻히고
  alternatives_korean:
  - 장사될 것이고
  - 매장될 것이고
  - 묻힐 것입니다
  lexicon: HALOT
  rationale: נִקְבַּר 계열의 수동 의미를 한국어에서 자연스럽게 나타내는 ‘묻히다’를 사용했습니다.
- source_word: וְאַלְמְנֹתָיו
  english_pob_choice: and his widows
  chosen_korean: 그의 과부들은
  alternatives_korean:
  - 그의 미망인들은
  - 그의 아내들은 이제 과부가 된
  lexicon: HALOT
  rationale: אַלְמָנָה는 ‘과부’이므로, 관용적이면서도 직접적인 ‘과부들’로 옮겼습니다.
- source_word: לֹא תִבְכֶּינָה
  english_pob_choice: will not weep
  chosen_korean: 울지 않을 것입니다
  alternatives_korean:
  - 통곡하지 않을 것입니다
  - 울지 않겠지요
  - 슬퍼하지 않을 것입니다
  lexicon: HALOT
  rationale: בכה의 기본 의미인 ‘울다’를 유지해, ‘mourn’보다 좁고 직접적인 감정 표현을 살렸습니다.
theological_decisions:
- issue: 문맥상 ‘그의 과부들’이 복수로 제시되는 표현의 처리
  chosen_reading: 문자적으로 유지하여 복수형 ‘과부들’로 옮겼습니다.
  alternative_readings:
  - 그의 아내들은 이제 과부가 될 것입니다
  - 그의 과부 된 여자들은
  rationale: 히브리어 복수형과 소유격을 그대로 드러내어, 본문이 의도한 급격한 상실의 이미지를 희석하지 않도록 했습니다.
  doctrine_reference: 본문의 시적·지혜문학적 표현 보존
