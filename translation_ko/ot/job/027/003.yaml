translation:
  language: ko
  text: 내 숨이 아직 내 안에 있고 하나님의 숨결[a]이 내 콧속에 있는 한,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 영”. 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / כָל עוֹד
  english_pob_choice: For as long as ... still
  chosen_korean: '...하는 한,'
  alternatives_korean:
  - '...동안'
  - '...하는 동안에도'
  - '...하는 내내'
  lexicon: HALOT
  rationale: 여기서는 지속 조건을 나타내는 표현이므로, ‘...하는 한’이 시간의 계속성과 조건성을 가장 자연스럽게 함께 살립니다.
- source_word: נִשְׁמָתִי
  english_pob_choice: my breath
  chosen_korean: 호흡이 내 안에
  alternatives_korean:
  - 내 숨이
  - 내 생명의 숨결이
  - 내 영혼이
  lexicon: HALOT
  rationale: נשמה는 여기서 생명 유지와 연결된 ‘호흡’이 가장 직접적입니다. ‘영혼’은 문맥이 요구하지 않는 의미를 덧씌울 수 있어 피했습니다.
- source_word: וְרוּחַ אֱלוֹהַּ
  english_pob_choice: the breath of God / the spirit of God
  chosen_korean: 하나님의 숨결
  alternatives_korean:
  - 하나님의 영
  - 하나님의 바람
  - 하나님의 숨
  lexicon: HALOT
  rationale: רוּחַ는 ‘바람/숨/영’의 범위를 가지지만, 앞절의 ‘호흡’과 평행을 이루고 ‘콧속’이라는 이미지와도 맞물리므로 ‘숨결’로 옮겼습니다. 다만 ‘영’이라는 신학적 가능성도 남기기 위해 주석으로 보존합니다.
- source_word: בְּאַפִּי
  english_pob_choice: in my nostrils
  chosen_korean: 내 콧속에
  alternatives_korean:
  - 내 코에
  - 내 콧구멍에
  lexicon: HALOT
  rationale: אַף의 문자적 신체 이미지를 살리되 한국어에서 과도하게 생소하지 않도록 ‘콧속’으로 옮겨 시적 구체성을 유지했습니다.
theological_decisions:
- issue: רוּחַ אֱלוֹהַּ의 의미를 ‘숨결’로 둘지 ‘영’으로 둘지
  chosen_reading: 하나님의 숨결
  alternative_readings:
  - 하나님의 영
  - 하나님의 숨
  rationale: 이 구절은 생명의 지속과 호흡을 병렬로 강조하므로, 문맥상 ‘숨결’이 가장 적절합니다. 그러나 רוּחַ의 신학적 중의성은 주석으로 남깁니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
