  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘만일 그가 전능자를 기뻐한다면’입니다. 여기서 히브리어 입자는 수사적 질문을 이끕니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르짖다’는 여기서 ‘부르다’, ‘호소하다’ 또는 ‘기도하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
