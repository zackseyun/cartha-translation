  rationale: 히브리어의 지속적·반복적 의미를 간결하게 전달하면서, 수사적 질문의 리듬을 해치지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Source meaning first; preserve discourse force.'
