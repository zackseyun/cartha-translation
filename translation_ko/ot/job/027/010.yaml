id: JOB.27.10
reference: Job 27:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
  footnotes:
  - marker: a
    text: Or, more literally, 'if he delights himself in the Almighty'; here the Hebrew particle introduces a rhetorical question.
    reason: lexical_alternative
  - marker: b
    text: '''Call on'' can also be rendered ''invoke'' or ''pray to.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 전능자 안에서 기뻐하겠습니까? 그는 하나님께 늘 부르짖겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘그가 전능자 안에서 기뻐한다면’입니다. 여기서 히브리어 입자는 수사적 질문을 이끕니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르짖다’는 여기서 ‘부르다’ 또는 ‘기도하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Will ... ?
  chosen_korean: '...겠습니까?'
  alternatives_korean:
  - 만일 ...
  - '...인지'
  lexicon: HALOT
  rationale: 조건문이 아니라 수사적 질문이므로, 한국어에서도 의문형으로 옮겨 문맥의 반어적 질문성을 살렸습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 이
  - 샤다이
  lexicon: HALOT
  rationale: 신적 칭호이므로 음역보다 의미 중심의 번역을 택해, 문맥상 하나님을 가리키는 호칭임을 분명히 했습니다.
- source_word: יִתְעַנָּג
  english_pob_choice: delight himself
  chosen_korean: 기뻐하겠습니까
  alternatives_korean:
  - 즐거워하겠습니까
  - 즐기겠습니까
  lexicon: HALOT
  rationale: 히트파엘의 자기지향적 ‘즐거움/기쁨’을 살리면서도, 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: יִקְרָא
  english_pob_choice: call on
  chosen_korean: 부르짖겠습니까
  alternatives_korean:
  - 부르겠습니까
  - 기도하겠습니까
  - 호소하겠습니까
  lexicon: HALOT
  rationale: 하나님을 향한 호출/기도의 뜻을 유지하되, 시적 문맥에서 강한 종교적 호소를 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: ‘בְּכָל עֵת’의 시간성 표현
