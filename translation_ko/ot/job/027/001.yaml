  rationale: 서술 도입 공식을 한국어 합쇼체로 자연스럽게 옮기되, 직전의 재개 표현과 연결되도록 했습니다.
theological_decisions:
- issue: מָשָׁל의 범위와 문학 장르
  chosen_reading: 이 절은 욥의 다음 시적 발화를 여는 서술 도입으로 보고, ‘자기의 말’로 넓게 번역했습니다.
  alternative_readings:
  - ‘자기의 잠언’
  - ‘자기의 비유’
  - ‘자기의 경구’
  rationale: 여기서 מָשָׁל을 특정 장르 용어 하나로 고정하면 문맥이 요구하는 폭을 좁힐 수 있어, 욥기의 길고 엄중한 발화를 포괄하는 표현을 택했습니다.
  doctrine_reference: 문학적 장르의 범주를 보존하는 번역 원칙
- issue: 화자 전환의 문체
  chosen_reading: 서술문은 합쇼체로 유지하고, 욥의 직접 인용이 시작되는 지점은 이 절에서만 도입형으로 처리했습니다.
  alternative_readings:
  - 더 평이한 구어체
  - 더 고전적인 문어체
  rationale: 본문의 장중한 서술 톤을 유지하면서도 현대 한국어 독자가 자연스럽게 읽을 수 있도록 했습니다.
  doctrine_reference: 표준어 현대 문어 번역 원칙
