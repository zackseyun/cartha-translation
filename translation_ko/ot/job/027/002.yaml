- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: POB의 영어 처리에 따라 신적 칭호는 번역하고, 욥기의 병행법에 맞게 존칭적 표현 ‘전능하신 분’을 택했습니다.
- source_word: הֵמַר נַפְשִׁי
  english_pob_choice: has made my soul bitter
  chosen_korean: 제 영혼을 쓰디쓰게 하셨습니다
  alternatives_korean:
  - 제 생명을 쓰라리게 하셨습니다
  - 저를 쓰디쓰게 하셨습니다
  lexicon: HALOT
  rationale: הֵמַר의 ‘쓰라리게 하다’라는 구체적 이미지를 보존하면서, נֶפֶשׁ은 여기서 감정적·전인적 주체를 가리키므로 ‘영혼’이 본문의 시적 색채를 가장 잘 살립니다.
