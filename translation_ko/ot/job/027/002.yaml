  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַי אֵ֭ל הֵסִ֣יר מִשְׁפָּטִ֑/י וְ֝/שַׁדַּ֗י הֵמַ֥ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
  footnotes:
  - marker: a
    text: Or 'my right' or 'my legal claim' for 'my justice.' The Hebrew מִשְׁפָּט can denote justice, judgment, or a rightful claim.
    reason: lexical_alternative
  - marker: b
    text: Or 'has embittered my life' or simply 'has embittered me.' The Hebrew נֶפֶשׁ often means 'soul,' 'life,' or 'self' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 살아 계심을 두고 맹세합니다. 제 의를 빼앗아 가신 분이시며, 전능하신 분이 제 영혼을 쓰디쓰게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 법정적 권리, 정당성, 혹은 의로운 처우를 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 여기서 문자적 이분법보다 전인적 자아를 가리킬 수 있으며, ‘생명’이나 ‘나 자신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  english_pob_choice: As God lives
  chosen_korean: 하나님이 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 살아 계신 하나님을 두고 맹세합니다
  - 하나님이 살아 계십니다
  lexicon: HALOT
  rationale: 히브리어 관용적 맹세문은 서술문보다 맹세의 형식을 살려 옮기는 것이 자연스럽고, ‘살아 계심을 두고’가 원문의 서약력을 가장 잘 드러냅니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 제 의
  alternatives_korean:
  - 제 권리
  - 제 법적 주장
  - 제 공의
  lexicon: HALOT
  rationale: 문맥상 욥은 단순한 판결이 아니라 마땅히 받아야 할 의로운 처우가 박탈되었다고 항의하므로, ‘의’가 의미의 폭과 احتجاج적 뉘앙스를 함께 살립니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: POB의 영어 처리에 따라 신적 칭호는 번역하고, 욥기의 병행법에 맞게 존칭적 표현 ‘전능하신 분’을 택했습니다.
- source_word: הֵמַר נַפְשִׁי
  english_pob_choice: has made my soul bitter
  chosen_korean: 제 영혼을 쓰디쓰게 하셨습니다
  alternatives_korean:
  - 제 생명을 쓰라리게 하셨습니다
  - 저를 쓰디쓰게 하셨습니다
  lexicon: HALOT
  rationale: הֵמַר의 ‘쓰라리게 하다’라는 구체적 이미지를 보존하면서, נֶפֶשׁ은 여기서 감정적·전인적 주체를 가리키므로 ‘영혼’이 본문의 시적 색채를 가장 잘 살립니다.
theological_decisions:
- issue: 맹세문과 신적 칭호의 화법
  chosen_reading: ‘하나님이 살아 계심을 두고 맹세합니다’로 맹세의 형식을 살리고, 뒤의 두 절은 욥의 탄원으로 평서형을 유지했습니다.
  alternative_readings:
  - ‘살아 계신 하나님께서…’와 같은 서술적 표현
  - 전 구절을 단순 서술로 평탄화
  rationale: 원문은 맹세 서두와 평행적인 탄원을 결합하므로, 한국어에서도 맹세력과 항의의 긴장을 유지해야 합니다.
  doctrine_reference: 욥기 27:2의 수사 구조
