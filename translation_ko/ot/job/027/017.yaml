source:
  edition: WLC
  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
  footnotes:
  - marker: a
    text: Or 'He prepares, but the righteous will wear it.' The Hebrew imperfect can be rendered more simply without the concessive nuance; the context from the previous verse supports the sense 'He may prepare it, but...'.
    reason: lexical_alternative
  - marker: b
    text: 'The implied objects are supplied from the previous verse: clothing for ''will wear it'' and accumulated wealth for ''the silver.'''
    reason: cross_reference
translation:
  language: ko
  text: 그가 마련할지라도[a], 의인은 그것을 입을 것이며[b], 무죄한 사람은 은을 나눌 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 마련하지만.” 히브리어 미완료형 자체가 반드시 양보를 뜻하는 것은 아니지만, 앞절의 문맥은 “그가 마련할지라도”라는 뜻을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’의 목적어는 앞절에서 암시되는 옷입니다. ‘은’은 그가 모아 둔 은을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  english_pob_choice: He may prepare it
  chosen_korean: 그가 그것을 준비할지라도
  alternatives_korean:
  - 그는 그것을 준비합니다
  - 그는 그것을 준비할 것입니다
  - 그가 그것을 마련할지라도
  lexicon: HALOT
  rationale: 히필형 כון의 기본 의미인 ‘준비하다, 마련하다’를 살리되, 앞절의 문맥이 주는 양보적 뉘앙스를 한국어 ‘-지라도’로 자연스럽게 반영했습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 의인들
  lexicon: HALOT
  rationale: 형용사 명사적 용법을 한국어 성경 문체에 맞게 간결하게 옮겼습니다. 문맥상 단수 대표성도 유지됩니다.
- source_word: יִלְבָּשׁ
  english_pob_choice: will wear it
  chosen_korean: 그것을 입고
  alternatives_korean:
  - 그것을 입을 것입니다
  - 그것을 두를 것입니다
  - 그것을 입습니다
  lexicon: HALOT
  rationale: 앞절에서 이어지는 옷을 가리키는 암시된 목적어를 살려 ‘그것을’로 보충했고, לבש의 직접적 의미를 ‘입다’로 옮겼습니다.
- source_word: נָקִי
  english_pob_choice: the innocent
  chosen_korean: 무죄한 사람
  alternatives_korean:
  - 무죄한 자
  - 깨끗한 자
  - 결백한 사람
  lexicon: HALOT
  rationale: 단순한 ‘깨끗한’보다 도덕적/법적 무죄의 의미를 드러내는 표현을 선택했습니다. POB의 대조 구조도 유지됩니다.
theological_decisions:
- issue: 문맥이 요구하는 생략된 목적어 보충
  chosen_reading: 앞절의 축적된 옷과 은을 이어받아 ‘그것을’로 보충했습니다.
  alternative_readings:
  - 목적어를 드러내지 않고 ‘준비할지라도, 의인은 입고…’로 직역함
  - ‘그가 쌓아 두어도’처럼 더 해석적으로 옮김
  rationale: 히브리어는 앞절의 재화를 이어받는 압축된 표현이므로, 한국어에서는 이해를 위해 최소한의 보충이 필요합니다. 다만 해석을 과도하게 확장하지 않도록 중립적인 대명사만 사용했습니다.
  doctrine_reference: 문맥 추론과 지시 대상 보충 원리
- issue: 양보적 뉘앙스의 재현
  chosen_reading: ‘-지라도’를 사용해 준비 행위와 의인의 수혜를 대비시켰습니다.
  alternative_readings:
  - ‘그가 준비하면 의인은 입습니다’처럼 단순 조건으로 옮김
  - ‘설령 준비해도’처럼 더 강하게 옮김
  rationale: 영어 POB가 지적한 것처럼 히브리어 완료/미완료 조합은 문맥상 양보의 힘을 가집니다. 이를 한국어에서 가장 자연스럽고 과도하지 않게 드러내기 위해 ‘-지라도’를 택했습니다.
  doctrine_reference: 히브리어 서술 양식과 담화 문맥
