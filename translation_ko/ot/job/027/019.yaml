source:
  edition: WLC
  text: עָשִׁ֣יר יִ֭שְׁכַּב וְ/לֹ֣א יֵאָסֵ֑ף עֵינָ֖י/ו פָּקַ֣ח וְ/אֵינֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
  footnotes:
  - marker: a
    text: Or, 'he will not be gathered to his fathers' or more generally 'he will not be gathered'; the Hebrew is terse and may allude to death and burial without stating it explicitly.
    reason: alternative_reading
  - marker: b
    text: Literally, 'and he is not'; an idiom meaning that he is gone or no more.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 부유하게 눕지만, 거두어지지 않을 것입니다. 그는 눈을 뜨지만, 그는 사라져 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 조상들에게로 거두어지지 않을 것입니다’ 혹은 더 일반적으로 ‘그는 거두어지지 않을 것입니다’. 히브리어는 매우 간결하여 죽음과 매장을 암시할 수 있지만 그것을 직접 말하지는 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그는 없습니다’이며, ‘사라져 버리다/더 이상 없다’는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: rich
  chosen_korean: 부유하게
  alternatives_korean:
  - 부자로
  - 부유한 상태로
  - 부자답게
  lexicon: HALOT
  rationale: 히브리어 עָשִׁיר은 형용사적으로 ‘부유한’의 뜻이므로, ‘부유하게 눕다’로 옮겨 간결성과 원문의 압축성을 살렸습니다.
- source_word: יִשְׁכַּב
  english_pob_choice: lies down
  chosen_korean: 눕지만
  alternatives_korean:
  - 누우나
  - 누우며
  - 잠들지만
  lexicon: HALOT
  rationale: שׁכב의 기본 의미인 ‘눕다’를 살려, 시적 문맥에서 자연스러운 현재형 서술로 표현했습니다.
- source_word: וְלֹא יֵאָסֵף
  english_pob_choice: but he will not be gathered
  chosen_korean: 거두어지지 않을 것입니다
  alternatives_korean:
  - 모이지 않을 것입니다
  - 조상들에게로 거두어지지 않을 것입니다
  - 거두어지지 못할 것입니다
  lexicon: HALOT
  rationale: אָסף의 핵심인 ‘거두다/모으다’를 유지하되, 죽음·장례의 함의를 단정하지 않도록 한국어도 간결하게 남겼습니다.
- source_word: וְאֵינֶנּוּ
  english_pob_choice: and he is gone
  chosen_korean: 사라져 버립니다
  alternatives_korean:
  - 그는 없습니다
  - 그는 더 이상 없습니다
  - 그는 있고 없고 하지 않습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그는 없다’이지만, 문맥상 갑작스러운 소멸을 나타내므로 현대 한국어에서 자연스러운 ‘사라져 버립니다’를 택했습니다.
theological_decisions:
- issue: וְלֹא יֵאָסֵף의 장례/죽음 암시를 얼마나 구체화할지
  chosen_reading: 죽음이나 장례를 직접 명시하지 않고 ‘거두어지지 않을 것입니다’로 남겼습니다.
  alternative_readings:
  - ‘조상들에게로 거두어지지 않을 것입니다’
  - ‘죽어서 거두어지지 않을 것입니다’
  rationale: 히브리어가 매우 간결하고, 본문이 죽음·매장·가문의 모음 중 어느 쪽을 더 강하게 뜻하는지 열어 두므로, 과도한 해석을 피했습니다.
  doctrine_reference: 본문의 시적 절제와 의도된 모호성 보존
