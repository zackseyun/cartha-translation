  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
  footnotes:
  - marker: a
    text: Or, 'he will not be gathered to his fathers' or more generally 'he will not be gathered'; the Hebrew is terse and may allude to death and burial without stating it explicitly.
    reason: alternative_reading
  - marker: b
    text: Literally, 'and he is not'; an idiom meaning that he is gone or no more.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자는 누우나 거두어지지 못합니다[a]. 눈을 뜨면 그는 없어집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 조상들에게로 거두어지지 못합니다’ 또는 더 일반적으로 ‘그는 거두어지지 못합니다’. 히브리어는 매우 간결하며, 죽음과 매장을 암시할 수 있으나 이를 직접 말하지는 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그는 없다’입니다. 이는 그가 사라졌거나 더 이상 없다는 뜻의 관용적 표현입니다.
