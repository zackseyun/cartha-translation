  lexicon: HALOT
  rationale: 2인칭 복수의 포괄성과 강조를 살리면서도 한국어 어순에 자연스럽게 맞췄습니다.
- source_word: חֲזִיתֶם
  english_pob_choice: have seen
  chosen_korean: 보았으니
  alternatives_korean:
  - 보았고
  - 목격했으니
  - 알고 있으니
  lexicon: HALOT
  rationale: 직접 관찰했다는 의미를 간결하게 옮기고, 뒤의 책망으로 이어지는 논리적 연결을 위해 이유절 형태로 처리했습니다.
- source_word: הֶבֶל תֶּהְבָּלוּ
  english_pob_choice: do you become vain
  chosen_korean: 헛된 자가 되느냐
  alternatives_korean:
