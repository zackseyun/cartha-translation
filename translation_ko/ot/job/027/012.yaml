  - 허무해지느냐
  - 헛된 말을 하느냐
  lexicon: HALOT
  rationale: הבל의 핵심 의미인 ‘헛됨, 허무, 덧없음’을 살리되, 동족어 반복의 압력을 한국어에서 가장 응축된 방식으로 표현했습니다.
theological_decisions:
- issue: הבל/תֶּהְבָּלוּ의 동족어 반복이 주는 책망의 강도
  chosen_reading: ‘헛된 자가 되느냐’로 옮겨, 단순 상태 묘사보다 지적·도덕적 허무에 빠진다는 책망을 드러냈습니다.
  alternative_readings:
  - ‘헛되이 되느냐’
  - ‘허무하게 되느냐’
  rationale: 본문은 명사 הֶבֶל과 동사 תֶּהְבָּלוּ의 말장난을 통해 강한 수사적 책망을 구성하므로, 의미를 완화하지 않고 압축적으로 재현하는 것이 적절합니다.
  doctrine_reference: 시 39:5, 전 1:2의 הבל 어휘군
