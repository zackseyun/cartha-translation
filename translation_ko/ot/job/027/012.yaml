  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
  footnotes:
  - marker: a
    text: Or 'why then do you act vainly?' The Hebrew uses a noun and cognate verb from the root הבל ('vanity, emptiness, futility'), creating an emphatic wordplay that is difficult to reproduce fully in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 너희 모두가 그것을 보았으니, 어찌하여 너희는 헛된 자가 되느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘헛됨/허무’라는 뜻의 명사와 같은 어근의 동사를 겹쳐 써서 말장난을 이루므로, 영어처럼 완전히 같은 효과를 옮기기 어렵습니다.
    reason: source_note
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
