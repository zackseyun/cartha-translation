  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서, 현대 합쇼체 문맥에서는 ‘보십시오’가 가장 자연스럽게 경고성과 호소력을 살립니다.
- source_word: אַתֶּם כֻּלְּכֶם
