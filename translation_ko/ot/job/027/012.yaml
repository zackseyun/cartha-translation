review_pass:
  verdict: revise
  source_fidelity: ‘헛된 자가 되느냐’는 본문의 동사 תֶּהְבָּלוּ를 존재 상태의 변화로 좁히고, 사람 자체를 ‘헛된 자’로 규정하는 뉘앙스를 더합니다. 본문은 동족어 어근을 사용하여 그들의 행위나 말의 헛됨을 책망하며, 그 범위를 단정하지 않는 표현이 더 충실합니다.
  naturalness: 초안의 ‘너희 … 되느냐’는 현대 표준어 합쇼체라는 목표 등록과 맞지 않습니다. ‘여러분 … 하십니까’로 통일하면 현대적이고 정중한 문체가 됩니다.
  terminology: הבל 어근의 ‘헛됨/허무’ 의미는 유지하되, ‘헛된 짓’은 원문의 명사·동사 결합이 주는 행위적 책망을 자연스럽게 전달합니다. 각주도 영어 번역 효과가 아니라 한국어 번역에서의 재현 곤란을 설명하도록 바로잡습니다.
