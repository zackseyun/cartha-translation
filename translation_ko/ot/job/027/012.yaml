translation:
  language: ko
  text: 보십시오. 여러분 모두가 그것을 보았는데, 어찌하여 이렇게 헛된 짓을 하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘헛됨, 허무’를 뜻하는 명사와 같은 어근의 동사를 함께 사용하여 강한 말놀이를 이룹니다. 이 효과를 한국어로 온전히 재현하기는 어렵습니다.
    reason: source_note
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
