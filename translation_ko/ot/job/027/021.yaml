base_translation:
  language: en
  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
  footnotes:
  - marker: a
    text: Or, 'it whirls him away from his place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 동풍이 그를 몰아가고 그는 사라지며, 그것이 그를 그의 자리에서 휩쓸어 갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  english_pob_choice: carries him away
  chosen_korean: 그를 몰아가고
  alternatives_korean:
  - 그를 실어 가고
  - 그를 데려가고
  - 그를 휩쓸어 가고
  lexicon: HALOT
  rationale: נשׂא의 ‘들어 올리다/나르다’ 의미를 바탕으로, 바람이 사람을 강제로 이동시키는 이미지를 한국어에서 자연스럽게 살리기 위해 ‘몰아가다’를 택했습니다.
- source_word: קָדִים
  english_pob_choice: the east wind
  chosen_korean: 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동쪽에서 부는 바람
  - 동풍이
  lexicon: HALOT
  rationale: 히브리어 קדים은 단순한 방향보다 파괴적이거나 위협적인 ‘동풍’을 가리키는 경우가 많아, 자연스러운 현대 한국어로 ‘동풍’이라 옮겼습니다.
- source_word: וְיֵלַךְ
  english_pob_choice: and he is gone
  chosen_korean: 그는 사라지며
  alternatives_korean:
  - 그는 가버리며
  - 그는 떠나며
  - 그는 가고
  lexicon: HALOT
  rationale: הלך의 단순한 ‘가다’보다 앞 절의 강제 이동 결과를 나타내는 상태를 살려, 결과적 의미가 분명한 ‘사라지며’로 처리했습니다.
- source_word: וִישָׂעֲרֵהוּ
  english_pob_choice: it sweeps him away
  chosen_korean: 그를 그의 자리에서 휩쓸어 갑니다
  alternatives_korean:
  - 그를 휩쓸어 갑니다
  - 그를 몰아냅니다
  - 그를 폭풍처럼 몰아갑니다
  lexicon: HALOT
  rationale: סער의 ‘휘몰다/소용돌이치다’ 이미지를 반영하면서, POB의 수정본이 택한 ‘sweeps him away’와도 맞추어 폭력적 이탈을 분명하게 했습니다.
