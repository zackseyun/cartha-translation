id: JOB.27.5
reference: Job 27:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
  footnotes:
  - marker: a
    text: Or 'to justify you' or 'to pronounce you righteous.' The Hebrew verb is forensic, meaning to declare someone to be in the right.
    reason: lexical_alternative
  - marker: b
    text: Or 'my blamelessness.' The Hebrew term can denote moral integrity or blamelessness in Job's self-defense.
    reason: lexical_alternative
translation:
  language: ko
  text: 차마 나는 당신들을 옳다 하지 않겠습니다[a]. 내가 죽을 때까지[b] 나는 내 온전함을 내게서 거두지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신들을 의롭다 하다’, ‘당신들을 정당하다고 선언하다’. 히브리어 동사는 법정적 의미로, 누군가를 옳다고 판정한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 흠없음’, ‘내 순전함’. 히브리어 용어는 욥의 자기 변호에서 도덕적 온전함 또는 흠없음을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  english_pob_choice: Far be it from me
  chosen_korean: 차마 나는 … 않겠습니다
  alternatives_korean:
  - 결코 나는 … 않겠습니다
  - 내게서 그런 일은 있을 수 없습니다
  lexicon: HALOT
  rationale: 강한 거부와 혐오를 드러내는 관용구로, 현대 한국어에서는 ‘차마’가 감정적 거부감을 자연스럽게 살립니다.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  english_pob_choice: to declare you right
  chosen_korean: 당신들을 옳다 하다
  alternatives_korean:
  - 당신들을 의롭다 하다
  - 당신들을 정당하다고 선언하다
  lexicon: HALOT
  rationale: 법정적 ‘옳음의 선언’이라는 뜻을 살리되, 한국어에서는 ‘옳다 하다’가 가장 직접적으로 판정의 뉘앙스를 전달합니다.
- source_word: תֻּמָּתִי
  english_pob_choice: my integrity
  chosen_korean: 내 온전함
  alternatives_korean:
  - 내 무죄
  - 내 흠없음
  - 내 순전함
  lexicon: HALOT
  rationale: 욥기의 자기 변호 맥락에서 도덕적 무흠과 내적 온전성을 함께 담는 표현으로 ‘온전함’이 가장 균형적입니다.
- source_word: מִמֶּנִּי
  english_pob_choice: from myself
  chosen_korean: 내게서
  alternatives_korean:
  - 나에게서
  - 내 자신에게서
  lexicon: HALOT
  rationale: 히브리어의 분리/이탈 의미를 자연스럽게 옮기면서도, 한국어에서 과도하게 어색한 반사 표현은 피했습니다.
theological_decisions:
- issue: 욥의 자기의 선언 강도
  chosen_reading: ‘옳다 하다’와 ‘온전함’을 택해, 욥이 친구들의 고발을 수긍하지 않겠다는 법정적·윤리적 입장을 그대로 보존했습니다.
  alternative_readings:
  - ‘의롭다 하다’로 더 신학적으로 옮기기
  - ‘무죄’로 더 강하게 옮기기
  rationale: 본문은 욥이 자기 결백을 절대화한다기보다 친구들의 판단을 받아들이지 않겠다는 맥락이므로, 과도한 신학적 평어로 좁히지 않고 긴장을 유지해야 합니다.
  doctrine_reference: 본문의 논쟁적 긴장을 보존하고, 욥의 자기 변호를 후대 교리어로 단정하지 않음.
