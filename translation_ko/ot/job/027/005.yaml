  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 חָלִילָה לִּי는 단순히 ‘차마’라고 하기보다 강한 단호한 거부를 나타내므로 ‘결코’가 더 적절합니다. 또한 לֹא אָסִיר ... מִמֶּנִּי의 뜻은 자신의 온전함을 포기하지 않겠다는 것이므로, 한국어에서는 ‘내게서 거두다’보다 ‘버리지 않다’가 자연스럽게 전달합니다.
  naturalness: ‘차마 나는 당신들을 옳다 하지 않겠습니다’는 어순과 ‘옳다 하다’의 결합이 다소 부자연스럽고, ‘당신들’은 현대 한국어에서 불필요하게 대립적인 어감을 낼 수 있습니다. ‘결코 여러분을 옳다고 하지 않겠습니다’와 ‘내 온전함을 버리지 않겠습니다’가 현대적 정중 문체에 더 자연스럽습니다.
  terminology: ‘온전함’은 תֻּמָּתִי의 도덕적 온전함/성실성을 넓게 보존하는 적절한 선택입니다. אצדיק의 법정적 선언 의미는 ‘옳다고 하다’ 및 각주에 제시된 ‘의롭다 하다’로 충분히 보존됩니다. 각주 b는 ‘죽을 때까지’가 아니라 ‘내 온전함’에 연결되어야 합니다.
