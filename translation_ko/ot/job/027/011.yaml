  source_fidelity: 히브리어의 선언적 미래형 ‘내가 가르치겠다’, ‘하나님의 손’이라는 비유, 그리고 אֲשֶׁר עִם שַׁדַּי의 압축적·타원적 표현을 충실히 보존했습니다. ‘전능자에게 있는 것’은 원문의 넓은 의미를 불필요하게 ‘뜻’이나 ‘계획’으로 한정하지 않습니다.
