id: JOB.27.11
reference: Job 27:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
  footnotes:
  - marker: a
    text: Or 'concerning God's hand.' The phrase may refer to God's power, activity, or dealings.
    reason: lexical_alternative
  - marker: b
    text: Or 'what belongs to the Almighty,' 'the counsel of the Almighty,' or 'what is from the Almighty.' The Hebrew expression is concise and somewhat elliptical.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너희에게 하나님의 손에 대하여 가르치겠습니다[a]; 전능자에게 있는 것은 숨기지 않겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 손’은 하나님의 능력, 활동, 또는 다루심을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전능자에게 속한 것’, ‘전능자의 뜻’, ‘전능자로부터 온 것’으로도 옮길 수 있습니다. 히브리어 표현이 간결하고 다소 생략적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרֶה / אוֹרֶה
  english_pob_choice: I will teach
  chosen_korean: 가르치겠습니다
  alternatives_korean:
  - 가르쳐 드리겠습니다
  - 알려 드리겠습니다
  lexicon: HALOT
  rationale: 화자 욥의 선언적 말투를 살리면서, 지식 전달의 뜻을 자연스럽게 드러내는 합쇼체로 옮겼습니다.
- source_word: בְּיַד אֵל
  english_pob_choice: concerning the hand of God
  chosen_korean: 하나님의 손에 대하여
  alternatives_korean:
  - 하나님의 손에 관하여
  - 하나님의 손에 대해서
  lexicon: HALOT
  rationale: בְּיַד אֵל은 하나님의 능력·행사·다루심을 가리킬 수 있지만, 본문이 허용하는 비유를 보존하기 위해 직역에 가까운 ‘하나님의 손’을 유지했습니다.
- source_word: אֲשֶׁר עִם שַׁדַּי
  english_pob_choice: what is with the Almighty
  chosen_korean: 전능자에게 있는 것
  alternatives_korean:
  - 전능자와 함께 있는 것
  - 전능자에게 속한 것
  - 전능자의 뜻
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 풀어 쓰되, POB의 개방성을 따라 ‘뜻’처럼 의미를 한정하지 않고 ‘있는 것’으로 남겼습니다.
- source_word: לֹא אֲכַחֵד
  english_pob_choice: I will not hide
  chosen_korean: 숨기지 않겠습니다
  alternatives_korean:
  - 감추지 않겠습니다
  - 숨기지 않을 것입니다
  lexicon: HALOT
  rationale: כחד의 기본 의미인 ‘숨기다/감추다’를 자연스러운 한국어로 옮겼고, 단정적 선언을 살리기 위해 미래-의지형으로 처리했습니다.
theological_decisions:
- issue: ‘하나님의 손’의 비유를 어떻게 처리할지
  chosen_reading: 하나님의 손이라는 비유를 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 능력에 대하여
  - 하나님의 행하심에 대하여
  rationale: 원문의 상징성을 보존하는 것이 더 넓은 신학적 함의를 유지하며, 하나님의 권능과 섭리를 한 의미로 축소하지 않습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘전능자에게 있는 것’의 모호성 유지
  chosen_reading: ‘전능자에게 있는 것’으로 남겨, 하나님의 뜻·계획·행위 중 하나로 한정하지 않았습니다.
  alternative_readings:
  - 전능자의 뜻
  - 전능자의 계획
  - 전능자의 일
  rationale: 히브리어가 의도적으로 압축되어 있으므로, 해석을 과도하게 특정하지 않는 것이 문맥과 POB의 주석적 신중함에 부합합니다.
  doctrine_reference: Translation philosophy §3
