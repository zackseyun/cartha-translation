  terminology: ‘하나님’, ‘전능자’, ‘하나님의 손’은 한국어 성경 번역에서 통용되는 용어이며, 원문의 신명과 은유를 적절히 유지합니다. 핵심 용어를 교리적으로 좁혀 해석하지 않았습니다.
