  - 내 입술이 결코 불의를 말하지 않겠다
  rationale: 이 구절은 실제 조건을 말하는 것이 아니라 강한 부정 확언이므로, 한국어에서도 그 확언성을 분명하게 드러내는 것이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 욥기의 서원/무죄 선언 문맥
