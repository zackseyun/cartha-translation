  lexicon: HALOT
  rationale: 서원·맹세 같은 부정적 확언 구조로 쓰인 אִם의 의미를 조건문으로 옮기지 않고, 한국어에서는 분명한 부정 서술로 자연스럽게 풀었습니다.
