translation:
  language: ko
  text: 내 입술이 불의를 말하지 않을 것이며, 내 혀가 속임수를 내뱉지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 אִם(‘만일/if’)을 맹세적·서원적 부정 확언으로 사용합니다. 따라서 직역상 ‘만일 내 입술이 불의를 말한다면…’에 가깝지만, 뜻은 ‘내 입술이 결코 불의를 말하지 않을 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
