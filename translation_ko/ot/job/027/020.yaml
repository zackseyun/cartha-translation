    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  english_pob_choice: overtake him
  chosen_korean: 그를 덮쳐오고
  alternatives_korean:
  - 그를 따라잡고
  - 그를 덮칩니다
  - 그를 미칩니다
  lexicon: HALOT
  rationale: 재난이 대상을 뒤쫓아 붙잡는다는 이미지를 살리기 위해 ‘덮쳐오다’를 택했습니다. ‘따라잡다’보다 시적이며, ‘미치다’보다 동적인 추격감을 줍니다.
- source_word: כַ֭/מַּיִם
  english_pob_choice: like waters
  chosen_korean: 물같이
  alternatives_korean:
  - 물처럼
  - 홍수같이
  - 물처럼 밀려오는
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘waters’의 감각을 유지하면서도 한국어 시구로 자연스럽게 읽히도록 ‘물같이’로 옮겼습니다. ‘홍수’는 해석을 한 단계 더 나아간 표현이므로 본문에는 두지 않았습니다.
- source_word: בַּלָּהוֹת
  english_pob_choice: terrors
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 소름끼치는 일들
  - 재앙
  lexicon: HALOT
  rationale: ‘terror’ 계열의 뜻을 살리되 한국어에서 지나치게 강한 추상 명사보다 시적 균형이 좋은 ‘두려움’을 선택했습니다. 복수적 뉘앙스는 전체 구문에서 보완됩니다.
- source_word: גְּנָבַתּ/וּ
  english_pob_choice: steals him away
  chosen_korean: 훔쳐 갑니다
  alternatives_korean:
  - 몰래 데려갑니다
  - 가로채 갑니다
  - 훔쳐 가 버립니다
  lexicon: HALOT
  rationale: ‘גנב’의 핵심인 ‘훔치다’의 의미를 직접 살리면서, 폭풍이 사람을 갑자기 빼앗아 가는 이미지를 자연스럽게 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘לַיְלָה’의 시간 부사와 시적 긴장
  chosen_reading: ‘밤에’로 옮겨, 재난이 은밀하고 예기치 않게 임하는 분위기를 살렸습니다.
  alternative_readings:
  - ‘한밤중에’
  - ‘밤사이’
  rationale: 본문은 단순한 시간 표시를 넘어, 어둠 속에서 닥치는 불가항력성을 강조합니다. ‘밤에’는 그 긴장을 유지하면서도 과장하지 않습니다.
  doctrine_reference: 시적 문맥에서의 시간 부사 처리
