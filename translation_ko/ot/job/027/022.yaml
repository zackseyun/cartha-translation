source:
  edition: WLC
  text: וְ/יַשְׁלֵ֣ךְ עָ֭לָי/ו וְ/לֹ֣א יַחְמֹ֑ל מִ֝/יָּד֗/וֹ בָּר֥וֹחַ יִבְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
  footnotes:
  - marker: a
    text: Or 'He casts himself upon him'; the Hebrew verb can be rendered more literally as 'throws/casts,' and the construction may depict a violent assault.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''fleeing he flees,'' an infinitive absolute with finite verb expressing emphasis: ''he surely flees'' or ''he flees in haste.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 내던져 대고[a] 아끼지 않으며, 그는 그의 손에서 반드시 도망칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그에게 던집니다’로 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘던지다/내던지다’를 뜻하며, 목적어는 명시되지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘도망하며 도망한다’에 해당하는 부정사 절대형과 미완료형을 함께 쓴 강조 표현으로, ‘반드시 도망칩니다’ 또는 ‘급히 도망칩니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  english_pob_choice: He hurls at him
  chosen_korean: 그가 그에게 달려들어
  alternatives_korean:
  - 그에게 던져 버려
  - 그에게 내던져
  - 그에게 던집니다
  lexicon: HALOT
  rationale: שלך의 기본 의미는 ‘던지다/내던지다’이지만, 여기서는 עלי־ו와 결합한 공격적 움직임이므로 한국어에서는 ‘달려들어’가 폭력적 기세를 가장 자연스럽게 드러냅니다.
- source_word: וְלֹא יַחְמֹל
  english_pob_choice: and does not spare
  chosen_korean: 아끼지 않으며
  alternatives_korean:
  - 불쌍히 여기지 않으며
  - 자비를 베풀지 않으며
  - 사정을 봐주지 않으며
  lexicon: HALOT
  rationale: חמל은 ‘아끼다/불쌍히 여기다/사면하다’의 뜻이어서, 심판 장면의 냉혹함을 살리는 ‘아끼지 않다’가 간결하고 정확합니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손에서부터
  - 그의 권세에서
  - 그의 손아귀에서
  lexicon: HALOT
  rationale: יד의 직역인 ‘손’은 원문 이미지를 보존합니다. 여기서는 ‘from his hand’의 도주/탈출 이미지를 살려 ‘그의 손에서’로 옮겼습니다.
- source_word: בָּרוֹחַ יִבְרָח
  english_pob_choice: he surely flees
  chosen_korean: 그는 반드시 도망칩니다
  alternatives_korean:
  - 그는 참으로 도망합니다
  - 그는 급히 도망칩니다
  - 도망치며 도망칩니다
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 중첩은 강한 강조를 나타내므로, 현대 한국어에서는 ‘반드시’로 그 힘을 살렸습니다. ‘도망칩니다’는 반복 강조를 자연스럽게 전달합니다.
theological_decisions:
- issue: 폭력적 심판 이미지의 직설성
  chosen_reading: 원문의 공격성과 도주를 완화하지 않고 그대로 드러내는 방향을 택했습니다.
  alternative_readings:
  - 비유적으로 순화하여 ‘맞서 싸웁니다’로 완곡하게 처리
  - ‘손’의 이미지를 ‘권세’로 추상화
  rationale: 이 절은 악인의 최종적 패퇴를 묘사하므로, 원문의 물리적 이미지와 긴박감을 보존하는 것이 해석상 더 충실합니다.
  doctrine_reference: 본문의 시적·지혜문학적 심판 묘사
