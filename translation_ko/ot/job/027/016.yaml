  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
  footnotes:
  - marker: a
    text: Or 'If he heaps up silver like dust and prepares garments like clay.' The Hebrew particle אִם can be read conditionally ('if') or concessively ('though'); the concessive sense fits the flow of the surrounding argument.
    reason: alternative_reading
  - marker: b
    text: Or 'garments' for 'clothing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 은을 티끌처럼 쌓고, 옷을 진흙처럼 준비한다 하더라도,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만약 그가 은을 티끌처럼 쌓고 옷을 진흙처럼 준비한다면’으로도 옮길 수 있습니다. 히브리어 אִם은 조건문(‘만약’)으로도, 양보문(‘하더라도’)으로도 읽힐 수 있는데, 이 문맥에는 양보적 읽기가 더 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: ‘옷’은 ‘의복’ 또는 ‘옷가지’로도 옮길 수 있습니다.
    reason: lexical_alternative
