source:
  edition: WLC
  text: אִם חָטָ֥אתִי וּ/שְׁמַרְתָּ֑/נִי וּ֝/מֵ/עֲוֺנִ֗/י לֹ֣א תְנַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
  footnotes:
  - marker: a
    text: Or 'If I have sinned ... you do not hold me innocent of my guilt.'
    reason: lexical_alternative
  - marker: b
    text: '''Watch me'' here carries the sense of close scrutiny, not protective guarding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 죄를 지으면, 주님께서는 저를 살피시고[a] 제 죄악에 대해서는 저를 무죄로 선언하지 않으실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살피시고’는 보호하기 위한 돌봄이 아니라 면밀히 주시하고 조사하는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무죄로 선언하지 않으실 것입니다’는 정결하게 한다는 뜻보다 법정에서 죄가 없다고 판정하지 않는다는 뜻을 살립니다.
    reason: theological_note
lexical_decisions:
- source_word: אִם / חָטָאתִי
  english_pob_choice: If I sin
  chosen_korean: 내가 죄를 지으면
  alternatives_korean:
  - 내가 죄를 범하면
  - 내가 죄를 지었다면
  lexicon: HALOT
  rationale: 조건절의 의미를 살려 ‘~하면’으로 옮기되, 히브리어 완료형이 여기서 가정적 진술로 쓰인 점을 반영했습니다.
- source_word: וּשְׁמַרְתָּנִי
  english_pob_choice: you watch me
  chosen_korean: 당신은 나를 살피시고
  alternatives_korean:
  - 당신은 나를 지켜보시고
  - 당신은 나를 감시하시고
  lexicon: HALOT
  rationale: 여기서는 보호적 ‘지키다’보다 심문적·감찰적 의미가 강하므로, 하나님의 지속적인 주시를 드러내는 ‘살피시고’를 택했습니다.
- source_word: וּמֵעֲוֺנִי
  english_pob_choice: of my iniquity
  chosen_korean: 내 죄악에서
  alternatives_korean:
  - 내 죄에서
  - 내 죄책에서
  lexicon: HALOT
  rationale: עָוֹן의 죄악/죄책 의미를 살리면서, 뒤의 ‘무죄로 하지 않다’와 함께 법정적 맥락이 드러나도록 ‘죄악에서’로 옮겼습니다.
- source_word: לֹא תְנַקֵּנִי
  english_pob_choice: you will not acquit me
  chosen_korean: 나를 무죄로 하지 않으실 것입니다
  alternatives_korean:
  - 나를 무죄로 선고하지 않으실 것입니다
  - 나를 깨끗하게 하지 않으실 것입니다
  - 나를 용서하지 않으실 것입니다
  lexicon: HALOT
  rationale: נקה의 법정적 의미를 따라 ‘무죄로 하다’로 옮겨, 단순한 용서나 정결이 아니라 판결적 무죄 선고의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: נקה의 의미를 정결이 아닌 법정적 판정으로 옮길지 여부
  chosen_reading: ‘나를 무죄로 하지 않으실 것입니다’로 번역해 법정적/사법적 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘나를 깨끗하게 하지 않으실 것입니다’
  - ‘나를 벌하지 않으실 것입니다’
  rationale: 문맥이 하나님과의 변론을 전개하는 항변이므로, 정결 언어보다 죄책을 면제받지 못한다는 재판적 의미가 더 정확합니다.
  doctrine_reference: 욥기의 항변적 문맥과 하나님의 심판/판결 이미지를 반영
