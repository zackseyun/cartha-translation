  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
  footnotes:
  - marker: a
    text: Or “declare me guilty”; the Hebrew verb carries a judicial sense.
    reason: lexical_alternative
  - marker: b
    text: Or “why you bring a case against me” or “why you dispute with me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 하나님께 이렇게 말씀드리겠습니다. 「저를 정죄하지 마시고[a], 왜 저와 다투시는지[b] 저에게 알려 주십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저를 유죄라고 선언하지 마시고”. 히브리어 동사는 사법적 의미를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “왜 저를 상대로 소송하시는지” 또는 “왜 저와 논쟁하시는지”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  english_pob_choice: I will say
  chosen_korean: 나는 … 말할 것입니다
  alternatives_korean:
  - 나는 … 말합니다
  - 말하겠습니다
  lexicon: HALOT
  rationale: 미완료형 1인칭 단수의 앞으로 말하려는 뜻을 살려, 서술형 ‘말할 것입니다’로 자연스럽게 옮겼습니다.
- source_word: אֶל אֱלוֹהַּ
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 엘로아께
  lexicon: HALOT
  rationale: אֱלוֹהַּ는 욥기에서 하나님을 가리키는 호칭이므로, 한국어에서는 의미를 바로 전달하는 ‘하나님께’가 가장 적절합니다.
- source_word: תַּרְשִׁיעֵנִי
  english_pob_choice: condemn me
  chosen_korean: 저를 정죄하지 마시고
  alternatives_korean:
  - 저를 유죄로 판결하지 마시고
  - 저를 악인으로 여기지 마시고
  lexicon: HALOT
  rationale: 히필의 משפט적 의미를 살려 ‘정죄하다’로 옮겼습니다. ‘유죄로 판결하다’도 가능하지만 한국어 문맥에서는 ‘정죄하다’가 간결하고 법정적 뉘앙스를 유지합니다.
- source_word: תְּרִיבֵנִי
  english_pob_choice: you contend with me
  chosen_korean: 왜 저와 다투시는지
  alternatives_korean:
  - 왜 저와 변론하시는지
  - 왜 저를 상대로 소송하시듯 하시는지
  - 왜 저와 논쟁하시는지
  lexicon: HALOT
  rationale: ריב의 법정적·대립적 뉘앙스를 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘다투다’로 옮겼습니다. 이는 단순한 말다툼보다 하나님과의 대립/논쟁을 함께 암시합니다.
theological_decisions:
- issue: 욥의 요청에 담긴 법정적 긴장
  chosen_reading: ‘정죄하다’와 ‘다투시다’를 유지하여, 하나님께 드리는 욥의 항변이 지닌 사법적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘유죄로 선언하다’와 ‘소송을 제기하다’로 더 기술적으로 옮김
  - ‘악인으로 취급하다’와 ‘논쟁하다’로 완화함
  rationale: 본문은 하나님 앞에서의 항변을 법정 언어로 말하지만, 그 긴장을 지나치게 해설적으로 풀어 버리면 욥기의 표현력이 약해집니다. 따라서 의미를 좁히지 않고 한국어로도 tension을 보존했습니다.
  doctrine_reference: 본문의 신학적 긴장을 해소하지 않고 보존함
