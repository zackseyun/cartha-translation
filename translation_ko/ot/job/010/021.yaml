lexical_decisions:
- source_word: בְּטֶרֶם
  english_pob_choice: before
  chosen_korean: 가기 전에
  alternatives_korean:
  - 전에
  - 내가 가기 전에
  lexicon: HALOT
  rationale: 시간 부사를 한국어에서는 뒤 문장을 자연스럽게 여는 '-기 전에'로 옮겨, 죽음의 목적지로 향하기 전이라는 흐름을 살렸습니다.
- source_word: אֵלֵךְ
  english_pob_choice: I go
  chosen_korean: 가다
  alternatives_korean:
  - 떠나다
  - 죽다
  lexicon: HALOT
  rationale: 직접적으로 '죽다'로 풀기보다, 히브리어의 기본 동사적 이동 표현을 따라 '가다'로 두어 문맥이 요구하는 죽음의 함의는 보존하되 과잉해석을 피했습니다.
- source_word: וְלֹא אָשׁוּב
  english_pob_choice: and do not return
  chosen_korean: 돌아오지 못하는
  alternatives_korean:
  - 돌아오지 않고
  - 다시는 돌아오지 못하는
  lexicon: HALOT
  rationale: 단순한 'return'보다 문맥상 실제로는 되돌아올 수 없는 상태를 드러내므로, '못하는'을 더해 시적 긴장과 비가역성을 살렸습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep shadow
  chosen_korean: 깊은 그늘
  alternatives_korean:
  - 죽음의 그늘
  - 깊은 어둠
  - 사망의 그늘
  lexicon: HALOT
  rationale: 전통적 '죽음의 그늘'은 주석적 의미를 강하게 고정하므로, 영어 POB의 'deep shadow'에 맞춰 '깊은 그늘'로 옮겨 어둠의 강도를 유지했습니다.
theological_decisions:
- issue: צַלְמָוֶת의 전통적 '죽음의 그늘' 여부
  chosen_reading: 본문에는 '깊은 그늘'을 두고, 전통적 표현은 각주로 보조합니다.
  alternative_readings:
  - 죽음의 그늘
  - 깊은 어둠
  rationale: 히브리어 צַלְמָוֶת는 시적 문맥에서 매우 짙은 어둠을 뜻할 수 있으므로, 본문은 영어 POB의 판단을 따라 의미를 넓게 열어 두고 전통적 독법은 각주로 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3
