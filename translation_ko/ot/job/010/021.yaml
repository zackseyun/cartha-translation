translation:
  language: ko
  text: 내가 가기 전에—돌아오지 못하는—어둠과 깊은 그늘의 땅으로 가기 전에 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로, ‘죽음의 그늘의 땅’입니다.
