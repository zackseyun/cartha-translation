  rationale: 본문은 고난 속에서 하나님께 드리는 절박한 탄원으로 이해되므로, 합쇼체의 공손한 청유/명령을 유지하는 것이 본문의 관계성을 가장 잘 드러냅니다.
  doctrine_reference: 기도/탄원의 화행 보존
