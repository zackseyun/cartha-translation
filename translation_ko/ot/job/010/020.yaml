  text: הֲ/לֹא מְעַ֣ט יָמַ֣/י יחדל ישית מִ֝מֶּ֗/נִּי וְ/אַבְלִ֥יגָה מְּעָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
  footnotes:
  - marker: a
    text: Or 'turn away from me' / 'withdraw from me.' The Hebrew expression with 'cease' and 'set from me' is idiomatic and compressed.
    reason: alternative_reading
  - marker: b
    text: Or 'so that I may have a little cheer' or 'recover myself a little.' The verb suggests a brief easing or brightening of spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 날이 얼마 남지 않았습니까? 그러니 그치시고 나를 떠나 주십시오. 그러면 제가 조금은 기운을 되찾겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그치시고 나를 떠나 주십시오’는 히브리어의 압축된 표현을 풀어 옮긴 것입니다. 직역하면 ‘나에게서 그치다/물러나다’의 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기운을 되찾겠습니다’는 ‘잠시 마음이 밝아지다/숨을 돌리다’에 해당하는 말로, 동사의 짧은 회복 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא מְעַט יָמַי
  english_pob_choice: Are not my days few?
  chosen_korean: 내 날이 얼마 남지 않았습니까?
  alternatives_korean:
  - 내 날이 몇 날 남지 않았습니까?
  - 내 생애가 얼마 남지 않았습니까?
  lexicon: HALOT
  rationale: 반문하는 부정 의문을 한국어 자연문으로 옮기되, יָמַי의 생애적 뉘앙스를 살리면서도 직역 과잉을 피했습니다.
- source_word: יחדל
  english_pob_choice: cease
  chosen_korean: 그치시고
  alternatives_korean:
  - 멈추시고
  - 중지하시고
  lexicon: HALOT
  rationale: 먼저 나오는 동사 ‘그치다’를 살려, 이어지는 ‘떠나 주십시오’와 분리된 두 동작으로 표현했습니다.
- source_word: ישית ממני
  english_pob_choice: leave me alone
  chosen_korean: 나를 떠나 주십시오
  alternatives_korean:
  - 나에게서 물러나 주십시오
  - 나를 버려 두십시오
  lexicon: HALOT
  rationale: 문맥상 압축된 관용구로서 ‘from me’의 분리를 분명히 드러내면서도, 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: וְאַבְלִיגָה מְעָט
  english_pob_choice: so that I may brighten up a little
  chosen_korean: 그러면 제가 조금은 기운을 되찾겠습니다
  alternatives_korean:
  - 그러면 제가 조금은 밝아지겠습니다
  - 그러면 제가 조금은 위로를 얻겠습니다
  lexicon: HALOT
  rationale: בלג의 ‘잠시 기운이 회복되거나 마음이 풀림’이라는 뜻을 살려, 감정적 밝아짐과 회복의 뉘앙스를 함께 담았습니다.
theological_decisions:
- issue: 욥의 요청 어조와 호칭 방식
  chosen_reading: 하나님께 드리는 직접 호소로 보고, 한국어에서는 공손한 명령형 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - 더 중립적인 서술형으로 완화
  - 직설적 명령형으로 강하게 번역
  rationale: 본문은 고난 속에서 하나님께 드리는 절박한 탄원으로 이해되므로, 합쇼체의 공손한 청유/명령을 유지하는 것이 본문의 관계성을 가장 잘 드러냅니다.
  doctrine_reference: 기도/탄원의 화행 보존
