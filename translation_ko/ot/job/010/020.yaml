  text: הֲ/לֹא מְעַ֣ט יָמַ֣/י יחדל ישית מִ֝מֶּ֗/נִּי וְ/אַבְלִ֥יגָה מְּעָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
  footnotes:
  - marker: a
    text: Or 'turn away from me' / 'withdraw from me.' The Hebrew expression with 'cease' and 'set from me' is idiomatic and compressed.
    reason: alternative_reading
  - marker: b
    text: Or 'so that I may have a little cheer' or 'recover myself a little.' The verb suggests a brief easing or brightening of spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 살 날이 얼마 남지 않았습니까? 그치시고 저에게서 물러나 주셔서, 제가 조금이나마 마음을 밝힐 수 있게 해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그치시고 저에게서 물러나 주셔서’는 히브리어의 압축된 표현을 풀어 옮긴 것입니다. ‘나에게서 그치다’, ‘나에게서 물러나다’, 또는 ‘나를 내버려 두다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마음을 밝히다’는 잠시 기운을 차리다, 위안을 얻다, 또는 숨을 돌리다로도 옮길 수 있습니다. 이 표현은 짧은 완화나 회복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא מְעַט יָמַי
  english_pob_choice: Are not my days few?
  chosen_korean: 내 날이 얼마 남지 않았습니까?
  alternatives_korean:
