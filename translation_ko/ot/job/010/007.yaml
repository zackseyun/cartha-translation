id: JOB.10.7
reference: Job 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
  footnotes:
  - marker: a
    text: Or 'You know that I am not guilty.' The Hebrew says 'not wicked,' which emphasizes Job's denial of being a wicked man rather than a claim of absolute sinlessness.
    reason: lexical_alternative
  - marker: b
    text: '''From your hand'' is a Hebrew expression for being under someone''s power or control.'
    reason: cultural_note
translation:
  language: ko
  text: 비록 주님께서는 내가 악하지 않다는 것을 아시지만, 주님의 손에서 벗어나게 해 줄 자는 아무도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘죄책이 없다’보다 ‘악하지 않다’에 가깝게 말합니다. 욥은 완전무결을 주장하기보다 자신이 악인처럼 취급될 일이 없다고 항변합니다.
    reason: lexical_alternative
  - marker: b
    text: “주님의 손에서”는 누군가의 권세나 통제 아래 있다는 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  english_pob_choice: Though you know
  chosen_korean: 비록 주님께서는 아시지만
  alternatives_korean:
  - 주님의 아심으로
  - 주님께서 아시는데도
  - 주님께서 아시면서도
  lexicon: HALOT
  rationale: עַל + דַּעַת은 여기서 상황을 전제하는 관용구이므로, 단순한 지식 진술보다 양보의 뉘앙스를 살린 「비록 … 아시지만」이 가장 자연스럽습니다.
- source_word: לֹא אֶרְשָׁע
  english_pob_choice: I am not wicked
  chosen_korean: 내가 악하지 않다는 것
  alternatives_korean:
  - 내가 죄가 없다는 것
  - 내가 악인이라는 점이 아니라는 것
  - 내가 악을 행하지 않았다는 것
  lexicon: HALOT
  rationale: 히브리어는 죄책 일반보다 «악한 사람/악하다»를 직접 말하므로, 「악하지 않다」로 옮겨 욥의 항변이 '절대적 무죄' 선언으로 과장되지 않도록 했습니다.
- source_word: מִיָּדְךָ
  english_pob_choice: from your hand
  chosen_korean: 주님의 손에서
  alternatives_korean:
  - 주님의 손으로부터
  - 주님의 권세에서
  - 주님의 손아귀에서
  lexicon: HALOT
  rationale: ‘손’은 כוח/권세의 관용적 은유이므로 본래 이미지를 살리면서도 한국어에서 자연스러운 「주님의 손에서」로 옮겼습니다.
- source_word: מַצִּיל
  english_pob_choice: who can deliver
  chosen_korean: 벗어나게 해 줄 자는 아무도 없습니다
  alternatives_korean:
  - 구해 낼 자는 아무도 없습니다
  - 건져 줄 자는 아무도 없습니다
  - 구출할 자는 아무도 없습니다
  lexicon: HALOT
  rationale: 분사형은 가능 주체를 가리키므로 「해 줄 자는 아무도 없습니다」로 불가능성을 매끄럽게 표현했습니다.
theological_decisions:
- issue: 욥의 자기변호가 무죄 주장처럼 들릴 수 있음
  chosen_reading: 욥의 말은 자신의 도덕적 ‘무악함’을 주장하는 항변으로 옮기되, 절대적 죄없음의 교리로 읽히지 않도록 했습니다.
  alternative_readings:
  - 내가 무죄라고 단정하는 번역
  - 내가 완전히 의롭다는 식의 번역
  rationale: 히브리어 רשע는 ‘악하다/악인이다’에 초점이 있으므로, 본문이 허용하는 범위 안에서만 욥의 항변을 드러내는 것이 문맥과 신학적 긴장을 함께 보존합니다.
  doctrine_reference: 본문의 긴장을 해소하지 않고 유지함
