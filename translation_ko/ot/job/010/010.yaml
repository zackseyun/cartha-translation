base_translation:
  language: en
  yaml_path: translation/ot/job/010/010.yaml
  text: Did you not pour me out like milk and curdle me like cheese?[a]
  footnotes:
  - marker: a
    text: Or 'congeal me like curds.' The Hebrew noun can be rendered more specifically as 'cheese' or more generally as a curdled dairy product.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 저를 우유처럼 쏟으시고, 치즈처럼 응고시키셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘응유처럼 저를 응고시키셨습니까?’ 히브리어 명사는 더 구체적으로 ‘치즈’ 또는 더 일반적으로는 응고된 유제품으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Did you not
  chosen_korean: 주께서는 … 하셨습니까?
  alternatives_korean:
  - 주께서 … 하지 않으셨습니까?
  - 정말 주께서 … 하셨습니까?
  lexicon: HALOT
  rationale: 반어적 질문의 기대 응답을 살리기 위해 한국어에서는 부정 의문형보다 공손한 반문형으로 자연스럽게 옮겼습니다.
- source_word: כֶּחָלָב
  english_pob_choice: like milk
  chosen_korean: 우유처럼
  alternatives_korean:
  - 젖처럼
  - 우유같이
  lexicon: HALOT
  rationale: 비유 표지가 분명하므로 ‘-처럼’을 유지했고, 현대 독자에게 가장 직관적인 유제품 이미지는 ‘우유’입니다.
- source_word: תַּתִּיכֵנִי
  english_pob_choice: pour me out
  chosen_korean: 저를 … 쏟으시고
  alternatives_korean:
  - 저를 … 붓으시고
  - 저를 … 흘려보내시고
  lexicon: HALOT
  rationale: 유동체를 붓는 동작을 살리되, 현대 한국어에서 우유 이미지와 가장 자연스럽게 맞는 동사는 ‘쏟다’입니다.
- source_word: וְכַגְּבִנָּה
  english_pob_choice: like cheese
  chosen_korean: 치즈처럼
  alternatives_korean:
  - 응유처럼
  - 커드처럼
  lexicon: HALOT
  rationale: 히브리어 גְּבִנָּה의 기본 의미를 반영하면서도, 영어 POB의 주석이 가리키는 ‘curdled dairy product’보다 한국어 독자에게 더 익숙한 대응어로 옮겼습니다.
- source_word: תַּקְפִּיאַנִי
  english_pob_choice: curdle me
  chosen_korean: 응고시키셨습니까
  alternatives_korean:
  - 굳히셨습니까
  - 엉기게 하셨습니까
  lexicon: HALOT
  rationale: 우유-치즈 형성의 과정을 정확히 드러내기 위해 ‘응고시키다’를 택했습니다. 이는 ‘curdle’의 물질 변화 감각을 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 욥의 질문을 하나님께 대한 직접 호소로 유지할지 여부
  chosen_reading: 주께서는 … 하셨습니까?
  alternative_readings:
  - 하나님께서 … 하셨습니까?
  - 주께서 … 하지 않으셨습니까?
  rationale: 본문은 창조/형성의 주체를 하나님께 직접 묻는 탄원입니다. 존칭과 반문형을 함께 사용해 항의의 긴장과 예의의 균형을 살렸습니다.
  doctrine_reference: 욥기의 탄식과 항변 화법
