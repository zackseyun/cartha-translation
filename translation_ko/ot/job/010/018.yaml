  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
  footnotes:
  - marker: a
    text: Or, 'I would have died, and no eye would see me.' The Hebrew imperfects can be rendered more formally, but the context favors a counterfactual sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 왜 주님께서는 저를 태에서 나오게 하셨습니까? 제가 죽었더라면 아무도 저를 보지 못했을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형들은 더 형식적으로는 ‘제가 죽을 것이고 아무도 저를 보지 못할 것이다’로 옮길 수 있습니다. 그러나 문맥상 출생하지 않았더라면 그러했을 것이라는 반사실적 탄식으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  english_pob_choice: Why, then,
  chosen_korean: 왜, 그러면,
  alternatives_korean:
  - 그리고 왜
  - 왜
  lexicon: HALOT
  rationale: 접속사 וְ는 앞선 탄식을 이어 주는 담화 표지로 보고, 한국어에서는 ‘그러면’을 넣어 문맥적 연결을 드러냈습니다.
- source_word: מֵרֶחֶם
  english_pob_choice: from the womb
  chosen_korean: 태에서
  alternatives_korean:
  - 배에서
  - 태에서부터
  lexicon: HALOT
  rationale: ‘태’가 출생 이전의 자궁 이미지를 자연스럽게 살리면서도 한국어 성경 문체에 맞습니다.
- source_word: הֹצֵאתָנִי
  english_pob_choice: did you bring me out
  chosen_korean: 저를 끌어내셨습니까
  alternatives_korean:
  - 저를 데리고 나오셨습니까
  - 저를 나오게 하셨습니까
  lexicon: HALOT
  rationale: 히필의 ‘나오게 하다’는 출생을 포함한 출현 유발을 뜻하므로, 직접적이면서도 생생한 ‘끌어내셨습니까’로 옮겼습니다.
- source_word: אֶגְוַע
  english_pob_choice: I should have died
  chosen_korean: 제가 죽어 버렸더라면
  alternatives_korean:
  - 제가 죽었을 텐데
  - 제가 죽었더라면
  lexicon: HALOT
  rationale: 문맥상 가정적·반사실적 소망을 나타내므로, 단순 과거가 아니라 ‘-었더라면’으로 처리했습니다.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  english_pob_choice: and no eye would have seen me
  chosen_korean: 어떤 눈도 저를 보지 못했을 것입니다
  alternatives_korean:
  - 아무 눈도 저를 보지 못했을 것입니다
  - 어떤 사람의 눈도 저를 보지 못했을 것입니다
  lexicon: HALOT
  rationale: ‘눈’은 관찰자를 가리키는 환유이므로 그대로 살리되, 한국어에서는 자연스럽게 ‘어떤 눈도’로 반영했습니다.
theological_decisions:
- issue: 욥의 반사실적 탄식의 시제 처리
  chosen_reading: ‘제가 죽어 버렸더라면’으로 욥의 바람 섞인 반사실적 진술을 드러냈습니다.
  alternative_readings:
  - 제가 죽었을 것입니다
  - 제가 죽었을 텐데
  rationale: 히브리어 미완료형들의 맥락상 실제 미래 예언이 아니라 ‘그랬더라면’이라는 탄식의 가정법이므로, 이를 분명히 하는 번역이 본문의 정서를 더 정확히 전달합니다.
  doctrine_reference: 욥기의 탄식 시학과 반사실적 가정 표현
