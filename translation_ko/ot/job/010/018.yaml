  terminology: ‘태’는 מֵרֶחֶם의 출생 전 자궁 이미지를 적절히 보존합니다. 신적 호칭 ‘주님께서는’도 본문의 직접 호소에 자연스럽고 존중하는 합쇼체입니다.
