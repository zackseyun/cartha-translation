    rationale: Footnote a concerns פְקֻדָּתְךָ ('주의 돌보심'), while footnote b concerns רוּחִי ('제 영'). In the draft, both markers occur after '변함없는 사랑,' which incorrectly associates them with חסד and fails to identify their intended referents.
