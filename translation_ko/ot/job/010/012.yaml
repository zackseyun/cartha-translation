base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
  footnotes:
  - marker: a
    text: Or 'your visitation' or 'your oversight' has preserved my spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'my breath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제게 생명과 변함없는 사랑을 베푸셨으며, 주의 돌보심이 제 영을 지켜 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주의 방문' 또는 '주의 감찰'로 제 영을 지켜 주셨습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '제 숨'.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 삶
  lexicon: HALOT
  rationale: 복수형이지만 여기서는 하나의 총체적 의미인 'life'로 기능하므로, 하나님의 선물로서의 생명을 자연스럽게 드러내는 '생명'이 가장 적절합니다.
- source_word: וָחֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 변함없는 사랑
  alternatives_korean:
  - 인자
  - 자비
  - 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·신실한 사랑의 뉘앙스를 살리기 위해, 단순한 친절이나 자비보다 지속성과 충실성을 담는 표현을 택했습니다.
- source_word: וּפְקֻדָּתְךָ
  english_pob_choice: your care
  chosen_korean: 주의 돌보심
  alternatives_korean:
  - 주의 살피심
  - 주의 방문
  - 주의 섭리
  lexicon: HALOT
  rationale: 여기서는 징벌적 '방문'보다 생명을 보존하는 긍정적 의미의 돌봄과 감독이 문맥에 맞으므로, '돌보심'으로 옮겼습니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 제 영
  alternatives_korean:
  - 제 숨
  - 제 호흡
  - 제 생명
  lexicon: HALOT
  rationale: רוּחַ는 '영/숨/호흡'을 모두 가질 수 있으나, 생명과 병렬을 이루며 내적 생명 전체를 가리키는 점을 살려 '영'으로 번역했습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 무게
  chosen_reading: 변함없는 사랑
  alternative_readings:
  - 인자
  - 자비
  - 언약적 신실함
  rationale: 본문은 하나님의 선한 베풂을 말하지만, 더 협소한 교리적 범주로 좁히지 않으면서도 언약적 충실성을 보존하는 표현이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: פְקֻדָּה의 의미 방향
  chosen_reading: 긍정적 돌보심과 감독
  alternative_readings:
  - 방문
  - 감찰
  - 섭리
  rationale: 동사 '지켜 주셨습니다'와 결합될 때, 이 단어는 심판적 방문보다 생명을 보존하는 주의 깊은 보살핌을 가리키는 것으로 읽는 것이 자연스럽습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
