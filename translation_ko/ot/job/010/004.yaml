base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
  footnotes:
  - marker: a
    text: Or 'as a human sees.' Hebrew אֱנוֹשׁ is a generic singular term for a human being, often with an overtone of mortality or frailty.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 육체의 눈을 지니고 계십니까? 아니면 사람이 보는 것처럼 보십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 보는 것처럼.’ 히브리어 אֱנוֹשׁ은 일반적으로 인간을 가리키는 단수어이며, 종종 죽을 수밖에 없는 연약함의 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עֵינֵי
  english_pob_choice: Do you have eyes
  chosen_korean: 육체의 눈이 있습니까
  alternatives_korean:
  - 눈이 있습니까
  - 육신의 눈이 있습니까
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’을 직접 묻는 수사적 질문이므로, 한국어에서도 소유를 드러내는 질문으로 옮기되 ‘육체의’로 인간적·신체적 시각을 대비시켰습니다.
- source_word: בָשָׂר
  english_pob_choice: of flesh
  chosen_korean: 육체의
  alternatives_korean:
  - 육신의
  - 살의
  lexicon: HALOT
  rationale: בָשָׂר의 직역인 ‘살’은 한국어에서 부자연스러워, 신체성을 드러내는 ‘육체의’로 옮겨 인간의 제한된 보는 방식을 살렸습니다.
- source_word: אִם כִּ/רְאֹות אֱנוֹשׁ תִּרְאֶה
  english_pob_choice: or do you see as a man sees
  chosen_korean: 아니면 사람이 보는 것처럼 보십니까
  alternatives_korean:
  - 아니면 한 인간이 보는 것처럼 보십니까
  - 아니면 사람이 보듯이 보십니까
  lexicon: HALOT
  rationale: אִם은 여기서 조건이 아니라 대안적 질문을 여는 말이므로 ‘아니면’으로 처리했고, ראה의 반복을 한국어에서 자연스럽게 살리기 위해 ‘보는 것처럼 보십니까’로 옮겼습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인생
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 대표적 일반 남성 단수는 한국어에서 성중립적 일반어인 ‘사람’이 가장 자연스럽게 살리며, 문맥상 인간의 유한함도 함께 떠올리게 합니다.
theological_decisions:
- issue: 하나님께 신체 기관을 묻는 인유법
  chosen_reading: 수사적 인유법을 그대로 유지하여, 하나님을 인간처럼 제한된 시각을 가진 분으로 축소해 설명하지 않았습니다.
  alternative_readings:
  - ‘외모로 판단하십니까?’처럼 해석적으로 풀어씀
  - 인유를 약화하여 의미만 전달
  rationale: 본문은 ‘육체의 눈’과 ‘사람이 보는 방식’의 대비를 통해 하나님의 인식을 인간의 인식과 구별합니다. 이를 유지하는 편이 히브리어의 힘과 날카로움을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
