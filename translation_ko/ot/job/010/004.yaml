  source_fidelity: 히브리어의 두 수사 의문문, ‘육체의 눈’이라는 인유적 표현, 그리고 אֱנוֹשׁ과 ראה의 비교 구문을 대체로 충실히 옮겼습니다. 다만 לָךְ의 소유 의미는 ‘주께는’보다 ‘주님께서 … 지니고 계십니까’로 표현할 때 한국어에서 더 명확하고 자연스럽습니다.
