id: JOB.10.8
reference: Job 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדֶ֣י/ךָ עִ֭צְּבוּ/נִי וַֽ/יַּעֲשׂ֑וּ/נִי יַ֥חַד סָ֝בִ֗יב וַֽ/תְּבַלְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
  footnotes:
  - marker: a
    text: Or 'formed me' or 'fashioned me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'together all around,' expressing that God formed Job completely, on every side.
    reason: cultural_note
  - marker: c
    text: Or 'but you destroy me'; the Hebrew literally says 'swallow me up,' a vivid metaphor for destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 손이 저를 온몸 구석구석 빚어 만드셨는데도, 저를 삼키십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 형성하여 만드셨는데도’. 히브리어의 ‘함께, 사방으로’라는 표현은 하나님께서 욥을 온전히, 모든 면에서 지으셨음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그러나 저를 멸하십니다’. 히브리어는 문자적으로 ‘저를 삼키십니다’라고 말하며, 파괴를 생생하게 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  english_pob_choice: Your hands
  chosen_korean: 주의 손이
  alternatives_korean:
  - 주의 손들
  - 주님의 손이
  lexicon: WLC
  rationale: 히브리어 복수형 ‘손들’을 직역할 수 있지만, 한국어에서는 하나의 창조적 행위를 가리키는 관용적 단수 ‘손’이 더 자연스럽습니다. 인격적 창조 행위라는 의미는 유지됩니다.
- source_word: עִצְּבוּנִי
  english_pob_choice: shaped me
  chosen_korean: 저를 빚으시고
  alternatives_korean:
  - 저를 형성하시고
  - 저를 만드시고
  - 저를 조형하시고
  lexicon: HALOT
  rationale: Piel 형태의 עצב가 지닌 ‘세심하게 빚다/형성하다’는 뉘앙스를 살리기 위해 ‘빚다’를 택했습니다. ‘형성하다’나 ‘만들다’보다 장인의 손길이 더 잘 드러납니다.
- source_word: וַיַּעֲשׂוּנִי
  english_pob_choice: and made me
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 제작하셨습니다
  lexicon: HALOT
  rationale: עשה의 기본 의미인 ‘만들다’를 자연스러운 합쇼체로 옮겼습니다. 앞의 ‘빚으시고’와 병렬을 이루어 창조의 두 표현을 모두 살렸습니다.
- source_word: יַחַד סָבִיב
  english_pob_choice: together all around
  chosen_korean: 사방에서 온전히
  alternatives_korean:
  - 온 사방에서
  - 사방으로 함께
  - 둘러싸서
  lexicon: HALOT
  rationale: יַחַד와 סָבִיב의 결합은 ‘사방에서/모든 면에서’ 완전하게 형성하셨다는 뜻입니다. 한국어에서는 문자형을 그대로 나열하기보다 ‘사방에서 온전히’로 압축해 전체성의 의미를 드러냈습니다.
- source_word: וַתְּבַלְּעֵנִי
  english_pob_choice: yet you swallow me up
  chosen_korean: 그러면서도 저를 삼키십니다
  alternatives_korean:
  - 그러나 저를 삼키십니다
  - 저를 멸하십니다
  lexicon: HALOT
  rationale: בלע의 핵심 비유인 ‘삼키다’를 그대로 살려 파괴의 생생한 이미지를 보존했습니다. POB가 보존한 긴장을 따라 ‘그러면서도’로 창조와 파괴의 대비를 드러냈습니다.
theological_decisions:
- issue: 창조와 파괴의 긴장
  chosen_reading: 하나님의 세심한 창조 행위와 ‘삼키심’의 파괴적 이미지가 한 절 안에 공존하도록 그대로 유지했습니다.
  alternative_readings:
  - 해석적으로 완화해 ‘저를 없애십니다’로 옮김
  - 의미를 조정해 창조만 강조함
  rationale: 욥의 탄식은 하나님께서 지으신 분이면서도 지금은 자신을 해치시는 분처럼 경험된다는 역설을 의도적으로 제시합니다. 번역이 이 긴장을 해소하면 본문의 호소력이 약해집니다.
  doctrine_reference: '번역 원칙: 본문의 신학적 긴장을 보존하고, 해석으로 먼저 정리하지 않는다.'
