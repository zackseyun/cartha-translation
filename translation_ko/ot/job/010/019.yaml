lexical_decisions:
- source_word: כַּאֲשֶׁר לֹא הָיִיתִי אֶהְיֶה
  english_pob_choice: I would have been as though I had not been
  chosen_korean: “마치 존재하지 않았던 것처럼 되었을 것입니다”
  alternatives_korean:
  - “내가 없었던 것처럼 되었을 것입니다”
  - “존재하지 않았던 것과 같았을 것입니다”
  lexicon: HALOT
  rationale: 비현실적·반사실적 조건을 한국어로 자연스럽게 옮기되, ‘없었던 것처럼’으로 존재 부정을 분명히 살렸습니다.
- source_word: מִבֶּטֶן
  english_pob_choice: from the womb
  chosen_korean: “배 속에서”
  alternatives_korean:
  - “어머니의 태에서”
  - “태에서”
  lexicon: HALOT
  rationale: 히브리어의 신체적 이미지가 분명하므로 직역성을 유지하되, 현대 한국어에서 자연스러운 ‘배 속’으로 옮겼습니다.
- source_word: לַקֶּבֶר
  english_pob_choice: to the grave
  chosen_korean: “무덤으로”
  alternatives_korean:
  - “무덤에”
  - “묘지로”
  lexicon: HALOT
  rationale: קבר는 כאן에서 사후 세계가 아니라 매장 장소를 가리키므로 ‘무덤’이 가장 직접적입니다.
- source_word: אוּבָל
  english_pob_choice: I would have been carried
  chosen_korean: “옮겨졌을 것입니다”
  alternatives_korean:
  - “실려 갔을 것입니다”
  - “운반되었을 것입니다”
  lexicon: HALOT
  rationale: 수동적 이동의 뜻을 살리면서, 출생에서 매장까지의 짧은 생애 이미지를 한국어로 과장 없이 전달합니다.
theological_decisions:
- issue: 욥의 반사실적 탄식 표현
  chosen_reading: 본문은 욥이 태어나자마자 무덤으로 옮겨졌다면 차라리 존재하지 않은 것과 같았을 것이라는 절망적 가정을 말합니다.
  alternative_readings:
  - 단순한 시간 서술로 읽기
  - 죽음 이후의 형이상학적 상태를 상세히 진술하는 것으로 읽기
  rationale: 히브리어의 비현실적 형태와 문맥상 탄식의 수위를 반영하여, 존재 부정의 정서가 드러나도록 옮겼습니다.
  doctrine_reference: 인간 고통에 대한 욥기의 시적 진술
- issue: ‘무덤’의 의미
  chosen_reading: ‘무덤’은 여기서 지하세계(스올)가 아니라 실제 매장 장소를 가리킵니다.
  alternative_readings:
  - 스올로 번역하기
  - 장지로 완화하기
  rationale: 직전 문맥과 어휘 용례상 קבר는 매장지를 뜻하므로, 사후 세계 용어로 바꾸면 의미가 흐려집니다.
  doctrine_reference: 히브리어 어휘 קבר의 기본 의미
