id: JOB.10.1
reference: Job 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָֽקְטָ֥ה נַפְשִׁ֗/י בְּ/חַ֫יָּ֥/י אֶֽעֶזְבָ֣ה עָלַ֣/י שִׂיחִ֑/י אֲ֝דַבְּרָה֗ בְּ/מַ֣ר נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
  footnotes:
  - marker: a
    text: Or 'My soul is weary of my life.' The Hebrew verb can express deep weariness as well as loathing.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will let loose my complaint.' The Hebrew idiom means Job will no longer restrain his lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼이 내 생명을 싫어합니다[a]. 나는 내 불평에 제멋대로 풀어 놓겠습니다[b]. 나는 내 영혼의 쓰라림 속에서 말하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼이 내 생명에 지쳤습니다.’ 히브리어 동사는 깊은 피로와 혐오를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 내 불평을 풀어 놓겠습니다.’ 히브리어 관용구는 욥이 자신의 탄식을 더 이상 억누르지 않겠다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה נַפְשִׁי בְּחַיָּי
  english_pob_choice: My soul loathes my life
  chosen_korean: 내 영혼이 내 생명을 싫어합니다
  alternatives_korean:
  - 내 영혼이 내 삶을 혐오합니다
  - 내 영혼이 내 생명에 지쳤습니다
  lexicon: HALOT
  rationale: נָקְטָה는 단순한 피로보다 강한 반감/혐오를 나타내므로, 문맥을 보존하면서도 현대 한국어에서 자연스러운 ‘싫어합니다’로 옮겼습니다.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  english_pob_choice: I will give free course to my complaint
  chosen_korean: 나는 내 불평에 제멋대로 풀어 놓겠습니다
  alternatives_korean:
  - 나는 내 불평을 더는 억누르지 않겠습니다
  - 나는 내 불평을 마음껏 말하겠습니다
  lexicon: HALOT
  rationale: עזב가 כאן에서 ‘놓아두다/풀어 주다’의 관용적 의미로 쓰이므로, complaint를 단순히 ‘말하다’가 아니라 ‘억제하지 않고 풀어 놓다’는 방향으로 살렸습니다.
- source_word: שִׂיחִי
  english_pob_choice: my complaint
  chosen_korean: 내 불평
  alternatives_korean:
  - 내 탄식
  - 내 묵상
  lexicon: HALOT
  rationale: 이 문맥에서 שִׂיחַ는 조용한 묵상보다 고통스러운 शिकायत/탄식에 가깝기 때문에, 의미를 분명히 하는 ‘불평’을 택했습니다.
- source_word: בְּמַר נַפְשִׁי
  english_pob_choice: in the bitterness of my soul
  chosen_korean: 내 영혼의 쓰라림 속에서
  alternatives_korean:
  - 내 영혼의 쓰라림 가운데
  - 쓰라린 내 영혼으로
  lexicon: HALOT
  rationale: בְּ + 명사는 상태/영역을 나타내므로, 직역에 가까우면서도 한국어로 자연스러운 ‘속에서’로 옮겼습니다. ‘영혼’은 앞절의 נֶפֶשׁ 반복을 살리기 위해 유지했습니다.
theological_decisions:
- issue: Job의 자기-혐오 표현의 강도
  chosen_reading: ‘내 영혼이 내 생명을 싫어합니다’로, 시적 절망의 강도를 약화하지 않고 유지했습니다.
  alternative_readings:
  - ‘내 영혼이 내 삶을 지겨워합니다’처럼 완화된 표현
  - ‘내 영혼이 내 생명을 혐오합니다’처럼 더 강한 표현
  rationale: 문맥상 욥의 탄식은 단순한 피로가 아니라 생명 자체에 대한 깊은 혐오/역겨움의 표현이므로, 완곡화하지 않되 한국어로 과도하게 비속하지 않은 강도를 유지했습니다.
  doctrine_reference: 탄식시/지혜문학의 정직한 고통 표현
- issue: ‘풀어 놓겠습니다’의 의도적 동적 표현
  chosen_reading: ‘제멋대로 풀어 놓겠습니다’는 히브리어 관용구의 ‘억제 해제’를 드러내기 위한 번역입니다.
  alternative_readings:
  - ‘내 불평에 자유를 주겠습니다’
  - ‘내 불평을 쏟아내겠습니다’
  rationale: עָזַב + שִׂיחַ는 단순 발화가 아니라 억제 중단의 의미를 가지므로, 욥이 자기 탄식을 더 이상 제어하지 않겠다는 뜻이 분명히 드러나도록 했습니다.
  doctrine_reference: 원문 관용구의 의미 보존
