review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the continuation of Job’s rhetorical question and the parallel references to Job’s iniquity and sin. However, ‘찾아내다’ presents the first verb as successful discovery rather than seeking, and ‘추적하다’ normally denotes tracking a person or object and is not a natural rendering of God’s searching examination of sin.
  naturalness: ‘내 죄를 추적하신다’ is unnatural in modern formal Korean. ‘찾으시고 … 살피신다는 것입니까?’ is idiomatic, retains the parallel investigative sense, and maintains the formal-polite register.
  terminology: ‘죄악’ and ‘죄’ appropriately represent עָוֹן and חַטָּאת without asserting that Job actually possesses the alleged fault. The lexical alternative ‘죄책’ remains useful, though its phrasing should match the revised main text.
  issues:
  - severity: medium
    issue: ‘찾아내고’ overstates תְבַקֵּשׁ.
    rationale: The Hebrew verb means seek/look for; it does not itself state that the object has been found. ‘찾으시고’ preserves this open-ended sense.
  - severity: medium
    issue: ‘내 죄를 추적하신다’ is semantically and idiomatically unsuitable.
    rationale: ‘추적하다’ commonly means tracking a moving person, vehicle, or object. For דרש in this parallelism, ‘살피시다’ naturally conveys searching examination without importing an image absent from the Hebrew.
  revised_text: 당신께서 내 죄악을 찾으시고 내 죄를 살피신다는 것입니까?[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘당신께서 내 죄책을 찾으시고 내 죄를 살피신다는 것입니까?’
    reason: lexical_alternative
  revision_rationale: The revision retains the content-clause force of כִּי as a continuation of the preceding rhetorical question, preserves the paired moral terms, and uses natural Korean verbs that convey seeking and examining without implying either successful discovery or Job’s actual guilt.
