- from: 당신께서 내 죄악을 찾아내고 내 죄를 추적하신다는 말입니까?[a]
  to: 당신께서 내 죄악을 찾으시고 내 죄를 살피신다는 것입니까?[a]
  rationale: The revision retains the content-clause force of כִּי as a continuation of the preceding rhetorical question, preserves the paired moral terms, and uses natural Korean verbs that convey seeking and examining without implying either successful discovery or Job’s actual guilt.
  reviewer_model: gpt-5.6-terra
