id: JOB.10.17
reference: Job 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
  footnotes:
  - marker: a
    text: Or 'your evidences' instead of 'your witnesses'; the Hebrew can be read as forensic testimony or as evidentiary proofs brought against Job.
    reason: lexical_alternative
  - marker: b
    text: Or 'changes and warfare are with me.' The Hebrew likely pictures successive waves of assault in military imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 저를 거슬러 증인들을 거듭 내세우시고[a], 저를 향한 주의 분노를 더하십니다. 교대와 군대가 제게 닥쳐 옵니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증거들’입니다. 히브리어는 법정에서의 증인 또는 욥에게 불리하게 제시되는 증거 자료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘변화와 전쟁이 제게 닥쳐 옵니다’ 또는 ‘변화와 군역이 제게 닥쳐 옵니다’입니다. 히브리어는 연이어 바뀌는 공격과 군사적 충돌 또는 고된 군역의 이미지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ עֵדֶיךָ
  english_pob_choice: you renew your witnesses
  chosen_korean: 증인을 새로 세우시고
  alternatives_korean:
  - 증언들을 새롭게 하시고
  - 증거들을 새로 하시고
  lexicon: HALOT
  rationale: עֵד는 문맥상 법정에서의 증인/증언을 가리킬 수 있으므로, POB의 ‘witnesses’를 따라 ‘증인’을 택했습니다. ‘새로 세우시고’는 반복적으로 불리게 되는 소환·제시의 뉘앙스를 살립니다.
- source_word: נֶגְדִּי
  english_pob_choice: against me
  chosen_korean: 제게 대적하는
  alternatives_korean:
  - 제 앞에 있는
  - 제 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘제 앞에’이지만, 욥의 항변 맥락에서는 적대적 법정 상황이므로 ‘대적하는’으로 풀어 원문의 공격적 방향을 드러냈습니다.
- source_word: כַּעַשְׂךָ
  english_pob_choice: your anger
  chosen_korean: 주의 분노
  alternatives_korean:
  - 주의 노여움
  - 주의 격분
  lexicon: HALOT
  rationale: כעס는 분노·노여움·격분을 뜻할 수 있는데, 하나님께 직접 말하는 문맥에서 표준적이고 강한 대응으로 ‘분노’를 선택했습니다.
- source_word: חֲלִיפוֹת וְצָבָא
  english_pob_choice: changes and hard service
  chosen_korean: 교대와 군대
  alternatives_korean:
  - 변화와 군역
  - 교체와 전쟁
  lexicon: HALOT
  rationale: חֲלִיפוֹת는 교대·교체·연속적 교번을, צָבָא 는 군대/군역을 뜻할 수 있습니다. 본문이 공격의 연속성을 그리므로 ‘교대와 군대’로 군사적 이미지를 살렸습니다.
theological_decisions:
- issue: 하나님께 대한 직접 항의의 어조
  chosen_reading: 욥의 원망과 항변을 완화하지 않고, 2인칭 직접 호칭과 강한 정서어를 유지했습니다.
  alternative_readings:
  - 보다 완곡한 기도체로 순화하기
  - ‘주의 징계’처럼 신학적으로 해석하기
  rationale: 본문은 지혜문학적 탄식으로서 하나님을 향한 법정적 항변을 드러내므로, 감정의 날을 흐리지 않는 것이 원문 이해에 더 충실합니다.
  doctrine_reference: 욥기 10장의 탄식/항변 문맥
- issue: ‘교대와 군대’의 이미지
  chosen_reading: 연속적인 공격과 압박을 군사적 이미지로 보존했습니다.
  alternative_readings:
  - ‘변화와 고난’처럼 일반화하기
  - ‘변화와 전쟁’으로 직역하기
  rationale: חֲלִיפוֹת וְצָבָא는 단순한 추상 개념보다 파도처럼 이어지는 압박과 전투 이미지를 함께 전달하므로, 그 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 욥기 10:17의 시적 병행법
