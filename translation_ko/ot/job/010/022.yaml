translation:
  language: ko
  text: 어둠의 땅, 캄캄한 어둠 같은 땅, 사망의 그늘과 질서가 없는 땅, 어둠처럼 빛나는 땅입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צַלְמָוֶת는 ‘사망의 그늘’로 번역할 수 있으며, ‘깊은 어둠’ 또는 ‘짙은 그늘’을 뜻할 수도 있습니다.
    reason: lexical_alternative
