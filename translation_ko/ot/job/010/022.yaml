theological_decisions:
- issue: “죽음의 그림자” 계열 표현의 보존 여부
  chosen_reading: ‘사망의 그늘’로 옮겨, 단순한 어둠보다 죽음과 연결된 음울한 영역이라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 깊은 어둠
  - 죽음의 그림자
  rationale: 본문은 단지 어두움을 넘어서 죽음의 영역을 시각화하므로, 전통적 이미지와 원문의 긴장을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: 욥기 10:22의 시적·상징적 진술
- issue: 마지막 절의 역설적 동사 구성
  chosen_reading: ‘그 어둠처럼 비추입니다’로, 비춤이 곧 어둠처럼 보인다는 역설을 유지했습니다.
  alternative_readings:
  - 그곳은 어둠처럼 빛납니다
  - 어둠 속에서 빛납니다
  rationale: 히브리어는 ‘비춘다’와 ‘어둠’이 공존하는 역설을 강조하므로, 이를 매끈하게 평탄화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 욥기 10:22의 시적 역설
