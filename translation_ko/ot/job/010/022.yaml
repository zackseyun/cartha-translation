  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֤רֶץ עֵיפָ֨תָ/ה כְּמ֥וֹ אֹ֗פֶל צַ֭לְמָוֶת וְ/לֹ֥א סְדָרִ֗ים וַ/תֹּ֥פַע כְּמוֹ אֹֽפֶל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/010/022.yaml
  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
  footnotes:
  - marker: a
    text: Or 'of deep shadow' for 'the shadow of death' (צַלְמָוֶת); the Hebrew term can denote either death-shadow specifically or very deep darkness more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 혼돈의 땅, 캄캄한 흑암과 사망의 그늘의 땅이며, 질서도 없고, 그 어둠처럼 비추입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צַלְמָוֶת는 ‘사망의 그늘’뿐 아니라 ‘깊은 어둠’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 세계
  lexicon: HALOT
  rationale: 욥기의 문맥에서 죽음의 영역을 가리키는 장소적 이미지이므로, 가장 자연스럽고 구체적인 ‘땅’이 적절합니다.
- source_word: עֵיפָתָה
  english_pob_choice: of gloom
  chosen_korean: 혼돈의
  alternatives_korean:
  - 어둠의
  - 침침한
  lexicon: HALOT
  rationale: 직전의 흑암 이미지와 결합되는 음산함·혼미함을 살리기 위해 ‘혼돈의’로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: the shadow of death
  chosen_korean: 사망의 그늘
  alternatives_korean:
  - 죽음의 그늘
  - 깊은 어둠
  lexicon: HALOT
  rationale: 관용구적 전통 표현을 살리되, 문자적으로도 ‘death-shadow’의 어두운 죽음의 기운을 드러내기 위해 ‘사망의 그늘’로 옮겼습니다.
- source_word: וְלֹא סְדָרִים
  english_pob_choice: and without order
  chosen_korean: 질서도 없고
  alternatives_korean:
  - 정돈도 없고
  - 순서도 없고
  lexicon: HALOT
  rationale: סְדָרִים의 핵심 의미인 질서/배열의 부재를 간결한 한국어로 표현했습니다.
theological_decisions:
- issue: “죽음의 그림자” 계열 표현의 보존 여부
  chosen_reading: ‘사망의 그늘’로 옮겨, 단순한 어둠보다 죽음과 연결된 음울한 영역이라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 깊은 어둠
  - 죽음의 그림자
  rationale: 본문은 단지 어두움을 넘어서 죽음의 영역을 시각화하므로, 전통적 이미지와 원문의 긴장을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: 욥기 10:22의 시적·상징적 진술
- issue: 마지막 절의 역설적 동사 구성
  chosen_reading: ‘그 어둠처럼 비추입니다’로, 비춤이 곧 어둠처럼 보인다는 역설을 유지했습니다.
  alternative_readings:
  - 그곳은 어둠처럼 빛납니다
  - 어둠 속에서 빛납니다
  rationale: 히브리어는 ‘비춘다’와 ‘어둠’이 공존하는 역설을 강조하므로, 이를 매끈하게 평탄화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 욥기 10:22의 시적 역설
