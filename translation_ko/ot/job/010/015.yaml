id: JOB.10.15
reference: Job 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
  footnotes:
  - marker: a
    text: Or 'and see my affliction' / 'and behold my affliction.' The Hebrew here is syntactically difficult, and some take it as a direct appeal to God rather than part of Job's self-description.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 악하다면, 내게 화가 있습니다! 내가 의롭다 해도 머리를 들 수 없습니다. 나는 수치로 가득한 채 내 환난을 바라봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 환난을 보소서’ 또는 ‘보라, 내 환난을.’ 히브리어는 통사적으로 어려우며, 일부는 이것을 욥의 자기 묘사가 아니라 하나님께 드리는 직접 호소로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  english_pob_choice: If I am wicked
  chosen_korean: 내가 악하면
  alternatives_korean:
  - 내가 악을 행하면
  - 내가 죄가 있으면
  lexicon: HALOT
  rationale: 조건절의 도덕적 의미를 살려 ‘악하다’로 옮겼고, 영어 POB의 현재 상태적 표현에 맞춰 한국어도 자연스러운 조건문으로 구성했습니다.
- source_word: אַלְלַי לִי
  english_pob_choice: woe to me
  chosen_korean: 내게 화가 있으리라
  alternatives_korean:
  - 아, 나에게 화가 있도다
  - 슬프도다, 나에게
  lexicon: HALOT
  rationale: 탄식어의 비통함을 살리면서도 현대 한국어에서 자연스러운 감탄 표현으로 옮겼습니다.
- source_word: וְצָדַקְתִּי
  english_pob_choice: Even if I am righteous
  chosen_korean: 내가 의로워도
  alternatives_korean:
  - 내가 의롭더라도
  - 내가 옳더라도
  lexicon: HALOT
  rationale: צדק의 도덕·법정적 뉘앙스를 살리기 위해 ‘의롭다’를 택했고, 앞절과의 대비를 드러내기 위해 양보 연결로 처리했습니다.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  english_pob_choice: I cannot lift up my head
  chosen_korean: 나는 내 머리를 들 수 없으니
  alternatives_korean:
  - 나는 머리를 들지 못하니
  - 나는 내 머리를 들지 못합니다
  lexicon: HALOT
  rationale: ‘머리를 들다’는 관용구를 그대로 살려 자신감·존엄의 결여를 표현했고, POB의 ‘cannot’에 맞춰 불가능성을 분명히 했습니다.
- source_word: שְׂבַע קָלוֹן
  english_pob_choice: filled with disgrace
  chosen_korean: 수치로 가득하고
  alternatives_korean:
  - 불명예로 가득하고
  - 치욕으로 가득하고
  lexicon: HALOT
  rationale: שְׂבַע의 ‘가득함/충만함’을 한국어로 자연스럽게 풀어 ‘가득하고’로 옮겼고, קָלוֹן은 공적 수치의 의미를 살려 ‘수치’로 번역했습니다.
- source_word: וּרְאֵה עָנְיִי
  english_pob_choice: looking on my affliction
  chosen_korean: 내 환난을 바라볼 뿐입니다
  alternatives_korean:
  - 내 환난을 보고 있을 뿐입니다
  - 내 고통을 바라보고 있습니다
  lexicon: HALOT
  rationale: 히브리어의 난해함을 존중해 POB의 해석을 따르되, 직접적인 하나님께의 명령형으로 확정하지 않고 현재 상태 묘사로 처리했습니다.
theological_decisions:
- issue: וּרְאֵה עָנְיִי의 구문 처리
  chosen_reading: 직접적인 하나님께의 청원보다, 욥 자신의 처지 묘사로서 ‘내 환난을 바라볼 뿐입니다’로 옮겼습니다.
  alternative_readings:
  - ‘내 환난을 보소서’라는 하나님께의 직접 호소
  - ‘내 환난을 보라’는 감탄적 읽기
  rationale: 히브리어가 문법적으로 여러 해석을 허용하지만, 바로 앞의 ‘수치로 가득하고’와 이어지는 흐름상 갑작스러운 청원 전환보다 상태 진술로 읽는 편이 문맥에 더 잘 맞습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장을 해소하지 않고 보존한다'
