source:
  edition: WLC
  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
  footnotes:
  - marker: a
    text: Or 'as clay'; the Hebrew expression is comparative, not explicitly 'from clay,' though the creation imagery is clearly evoked.
    reason: lexical_alternative
  - marker: b
    text: Or 'and you will return me to dust.' The Hebrew form itself can be read as either a statement or, in context, a rhetorical question.
    reason: alternative_reading
translation:
  language: ko
  text: 기억해 주십시오. 주께서 저를 진흙처럼[a] 만드셨는데, 저를 다시 티끌로 돌려보내시겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진흙으로’. 히브리어 표현은 ‘~에서’가 아니라 비교의 뜻을 가진 것으로 읽는 것이 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 주께서는 저를 티끌로 돌려보내실 것입니다.’ 히브리어 동사형은 문맥에 따라 진술문으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  english_pob_choice: Remember, please
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억해 주시기 바랍니다
  - 기억하십시오
  lexicon: HALOT
  rationale: זכר의 직접 명령형을 하나님께 드리는 간구로 살리되, 나아 주는 뉘앙스는 한국어 공손 표현인 ‘주십시오’로 자연스럽게 담았습니다.
- source_word: כַחֹמֶר
  english_pob_choice: like clay
  chosen_korean: 진흙처럼
  alternatives_korean:
  - 점토처럼
  - 흙처럼
  lexicon: HALOT
  rationale: כ의 비교 용법을 ‘~처럼’으로 살렸고, 한글 성경 문맥에서 Job 10:9의 창조 이미지에 가장 자연스럽게 대응하는 재료 이미지는 ‘진흙’입니다.
- source_word: עֲשִׂיתָנִי
  english_pob_choice: you made me
  chosen_korean: 지음받은 것을
  alternatives_korean:
  - 만드신 것을
  - 지으신 것을
  lexicon: HALOT
  rationale: עשה의 기본 의미는 넓은 ‘만들다’이지만, 몸의 형성과 창조 맥락에서는 ‘지음’이 더 공경적이고 자연스러워 주어를 보존한 수동 표현으로 옮겼습니다.
- source_word: עָפָר
  english_pob_choice: dust
  chosen_korean: 티끌
  alternatives_korean:
  - 먼지
  - 흙
  lexicon: HALOT
  rationale: 문맥상 죽음과 인간의 유한성을 가리키는 עפר를 한국어 성경 전통에 널리 쓰이는 ‘티끌’로 옮겨 창세기적 소멸 이미지를 살렸습니다.
theological_decisions:
- issue: 두 번째 절의 종결을 진술문이 아니라 수사적 질문으로 옮길지 여부
  chosen_reading: 수사적 질문으로 옮겨 ‘저를 다시 티끌로 돌려보내시렵니까?’라고 했습니다.
  alternative_readings:
  - 진술문으로 ‘저를 다시 티끌로 돌려보내실 것입니다’
  - 직설적 예언형으로 ‘저를 다시 티끌로 돌려보내십니다’
  rationale: 히브리어는 표지어 없이도 문맥상 항의 섞인 질문으로 읽히며, 욥의 탄식과 논박의 힘을 한국어에서도 그대로 드러내는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 욥기의 탄식적 수사와 하나님께 드리는 직접 호소
