language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/יִגְאֶה כַּ/שַּׁ֣חַל תְּצוּדֵ֑/נִי וְ֝/תָשֹׁ֗ב תִּתְפַּלָּא בִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
  footnotes:
  - marker: a
    text: Hebrew is difficult and elliptical; the opening may also be understood, 'And if it rises' or 'If I am exalted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you act wonderfully against me.' The Hebrew can denote extraordinary or marvelous action, here in a hostile context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 스스로 높아지려 하면[a], 주께서 사자처럼 나를 사냥하시고[b], 또다시 내게 놀랍게 행하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 3인칭 단수 형태로 되어 있어 직역이 불완전합니다. 문맥상 ‘내가 스스로 높아지려 하면’ 또는 ‘내가 높아지면’으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘사자처럼’입니다. 앞의 사냥 이미지와 함께, 하나님이 사냥꾼처럼 욥을 뒤쫓는 비유를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  english_pob_choice: If I lift myself up
  chosen_korean: 내가 스스로 높아지려 하면
  alternatives_korean:
  - 내가 높아지면
  - 내가 높임을 받으면
  - 내가 치솟으면
  lexicon: HALOT
  rationale: 히브리어는 3인칭 단수 형태로 축약되어 있어 직역이 매끄럽지 않으므로, 문맥상 욥의 ‘자기 높아짐’ 조건을 살려 자연스러운 조건절로 옮겼습니다.
- source_word: כַּשַּׁחַל
  english_pob_choice: like a lion
  chosen_korean: 사자처럼
  alternatives_korean:
  - 사나운 사자처럼
  - 사자와 같이
  - 사자같이
  lexicon: HALOT
  rationale: 비유를 직접 살리되 과도한 해설은 덧붙이지 않고, 한국어에서도 자연스러운 동물 사냥 비유로 표현했습니다.
- source_word: תְּצוּדֵנִי
  english_pob_choice: you hunt me
  chosen_korean: 나를 사냥하시고
  alternatives_korean:
  - 나를 추적하시고
  - 나를 사냥하십니다
  - 나를 노리시고
  lexicon: HALOT
  rationale: צוד의 핵심은 ‘사냥하다/사냥감으로 뒤쫓다’이므로, 욥이 포획 대상처럼 취급되는 이미지를 살려 ‘사냥하다’로 옮겼습니다.
- source_word: תִּתְפַּלָּא בִי
  english_pob_choice: you show yourself wonderful against me
  chosen_korean: 내게 놀랍게 행하십니다
  alternatives_korean:
  - 내게 놀라운 일을 하십니다
  - 내게 기이하게 행하십니다
  - 내게 놀랍게 나타나십니다
  lexicon: HALOT
  rationale: פלא 계열은 긍정적 ‘놀라움’뿐 아니라 압도적이고 기이한 행위도 뜻하므로, 문맥의 적대성을 지우지 않으면서도 직역의 긴장을 보존했습니다.
theological_decisions:
- issue: פלא를 하나님에 대한 긍정적 찬양으로 완화할지 여부
  chosen_reading: ‘놀랍게 행하십니다’로 두어, 하나님의 기이하고도 위협적인 작용이라는 긴장을 그대로 남겼습니다.
  alternative_readings:
  - ‘놀라운 일을 하십니다’
  - ‘기이한 일을 하십니다’
  - ‘능력 있게 치십니다’
  rationale: 욥기의 탄식 맥락에서는 하나님의 행위가 선한 찬양어휘로 평탄화되면 본문의 고통과 역설이 약해집니다. 따라서 ‘wonderful’의 양가성을 유지하는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
