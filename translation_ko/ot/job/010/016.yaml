reference: Job 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/יִגְאֶה כַּ/שַּׁ֣חַל תְּצוּדֵ֑/נִי וְ֝/תָשֹׁ֗ב תִּתְפַּלָּא בִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
  footnotes:
  - marker: a
    text: Hebrew is difficult and elliptical; the opening may also be understood, 'And if it rises' or 'If I am exalted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you act wonderfully against me.' The Hebrew can denote extraordinary or marvelous action, here in a hostile context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 머리가 들리면[a], 주께서 사자처럼 나를 사냥하시고, 다시 나를 상대로 놀라운 일을 행하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어가 명시되지 않은 3인칭 남성 단수 형태로, 직역하면 ‘그리고 그것이 높아진다’입니다. 문맥에 따라 ‘내 머리가 들리면’ 또는 ‘내가 높아지면’으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 상대로 기이한 일을 행하십니다.’ 히브리어는 하나님께서 자신을 놀랍게 드러내시거나 비범한 일을 행하신다는 뜻일 수 있으며, 여기서는 욥을 향한 적대적인 맥락에서 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  english_pob_choice: If I lift myself up
  chosen_korean: 내가 스스로 높아지려 하면
  alternatives_korean:
  - 내가 높아지면
  - 내가 높임을 받으면
  - 내가 치솟으면
  lexicon: HALOT
  rationale: 히브리어는 3인칭 단수 형태로 축약되어 있어 직역이 매끄럽지 않으므로, 문맥상 욥의 ‘자기 높아짐’ 조건을 살려 자연스러운 조건절로 옮겼습니다.
- source_word: כַּשַּׁחַל
  english_pob_choice: like a lion
  chosen_korean: 사자처럼
  alternatives_korean:
