id: JOB.10.3
reference: Job 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
  footnotes:
  - marker: a
    text: Or 'show favor to the counsel of the wicked.' The Hebrew verb literally means 'shine forth/upon,' here likely expressing favorable regard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 주님께 좋으십니까? 주님께서 주님의 손으로 지으신 것을 억압하시며, 악인들의 계획에 비추십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인들의 계획에 호의를 보이십니까?’ 히브리어 동사는 문자적으로 ‘비추다/빛나다’의 뜻이며, 여기서는 호의적 대우를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  english_pob_choice: Is it good for you
  chosen_korean: 그것이 주님께 좋으십니까?
  alternatives_korean:
  - 주님께서 기뻐하십니까?
  - 주님께 옳으십니까?
  lexicon: HALOT
  rationale: 수사적 질문의 핵심은 ‘좋음/마땅함’을 주님께 묻는 것이므로, 자연스러운 합쇼체로 압축해 옮겼습니다.
- source_word: תַעֲשֹׁק
  english_pob_choice: you oppress
  chosen_korean: 억압하시며
  alternatives_korean:
  - 학대하시며
  - 착취하시며
  lexicon: HALOT
  rationale: עָשַׁק의 강한 불의와 압제의 의미를 살려, 완곡한 ‘잘못하다’보다 ‘억압하다’를 택했습니다.
- source_word: יְגִיעַ כַּפֶּיךָ
  english_pob_choice: the work of your hands
  chosen_korean: 주님의 손으로 지으신 것
  alternatives_korean:
  - 주님의 손의 수고
  - 주님의 손으로 하신 일
  lexicon: HALOT
  rationale: 문맥상 ‘손’은 창조적 행위를 가리키므로, 단순한 노동보다 ‘지으신 것’이 더 직접적으로 원문의 대상을 드러냅니다.
- source_word: הוֹפָעְתָּ
  english_pob_choice: shine upon
  chosen_korean: 비추십니까?
  alternatives_korean:
  - 호의를 보이십니까?
  - 빛나십니까?
  lexicon: HALOT
  rationale: 히필 형태의 기본 이미지를 살려 ‘비추다’로 옮겼고, 영어 POB 각주가 제시한 ‘호의를 보이다’의 해석 가능성은 본문을 지나치게 풀이하지 않도록 본문 밖으로 남겨두었습니다.
theological_decisions:
- issue: 하나님을 향한 욥의 직접적 항의 표현
  chosen_reading: 주님께 대한 정면의 수사적 항의를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 주님께서 그렇게 보이시는 것입니까?
  - 주님께서 그렇게 하시는 것처럼 보이십니까?
  rationale: 히브리어는 욥의 탄식을 노골적인 비난 형식으로 제시하므로, 이를 부드럽게 바꾸지 않아야 본문의 긴장과 감정이 보존됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
