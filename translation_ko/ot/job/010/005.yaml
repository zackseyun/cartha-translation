  text: הֲ/כִ/ימֵ֣י אֱנ֣וֹשׁ יָמֶ֑י/ךָ אִם שְׁ֝נוֹתֶ֗י/ךָ כִּ֣/ימֵי גָֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
  footnotes:
  - marker: a
    text: Or 'mortal' for 'man' (אֱנוֹשׁ), emphasizing human frailty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew גָבֶר may also be rendered 'man' or 'mighty man'; 'strong man' is used here to preserve the distinction from אֱנוֹשׁ in the previous line.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 날들이 사람의 날들과 같습니까? 아니면 주님의 해들이 한 용사의 날들과 같습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 אֱנוֹשׁ의 유한한 인간성을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’는 גָבֶר의 강인함을 드러내며, 앞의 אֱנוֹשׁ과의 대조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי / יָמֶיךָ
  english_pob_choice: Are your days like the days of man
  chosen_korean: 주님의 날들이 사람의 날들과 같습니까
  alternatives_korean:
  - 주님의 날들이 인간의 날들과 같습니까
  - 주님의 날들이 죽을 자의 날들과 같습니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 비교문을 자연스러운 한국어 의문문으로 옮기되, יָמֶיךָ를 직역하여 ‘주님의 날들’로 유지했습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 죽을 자
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 인간적·유한성 뉘앙스를 살리면서도 문맥상 대표적 인간을 가리키는 비교로 읽히게 하려면 ‘사람’이 가장 무난합니다.
- source_word: אִם / שְׁנוֹתֶיךָ
  english_pob_choice: or your years
  chosen_korean: 아니면 주님의 해들이
  alternatives_korean:
  - 혹 주님의 해들이
  - 또는 주님의 나이월들이
  lexicon: HALOT
  rationale: 시적 평행을 살리기 위해 אִם을 조건문이 아닌 대안적 비교로 이해해 ‘아니면’으로 옮기고, שְׁנוֹתֶיךָ는 ‘해들’로 간결하게 번역했습니다.
- source_word: גָבֶר
  english_pob_choice: a mighty man
  chosen_korean: 한 용사
  alternatives_korean:
  - 한 강한 사람
  - 한 장부
  - 한 힘센 사람
  lexicon: HALOT
  rationale: גָבֶר의 남성적 강인함을 드러내면서도, 앞의 אֱנוֹשׁ과 구별되는 어감을 살리기 위해 ‘용사’를 택했습니다.
theological_decisions:
- issue: 하나님의 시간성과 인간의 유한성 대비
  chosen_reading: 이 절은 하나님을 인간과 같은 시간 범주로 환원할 수 없다는 수사적 반문으로 읽었습니다.
  alternative_readings:
  - 단순한 길이 비교
  - 하나님의 연대에 대한 철학적 진술
  rationale: 문맥상 욥의 항변은 하나님의 생애가 인간의 유한한 생애와 같지 않음을 강조하는 질문형 비유이므로, 과도한 철학화보다 수사성을 유지하는 편이 본문에 충실합니다.
  doctrine_reference: 하나님의 초월성과 인간의 피조성
