translation:
  language: ko
  text: 주님의 날들이 사람[a]의 날들과 같습니까? 아니면 주님의 세월이 힘센 사람[b]의 날들과 같습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱנוֹשׁ은 ‘사람’ 또는 ‘죽을 사람’으로 옮길 수 있으며, 인간의 유한함을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גָבֶר는 ‘사람’, ‘힘센 사람’ 또는 ‘강한 사람’으로 옮길 수 있습니다. 여기서는 앞의 אֱנוֹשׁ과 구별되는 강건함의 뉘앙스를 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי / יָמֶיךָ
  english_pob_choice: Are your days like the days of man
  chosen_korean: 주님의 날들이 사람의 날들과 같습니까
