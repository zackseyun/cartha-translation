  to: 그러나 이 일들을 당신의 마음에 숨겨 두셨습니다[a]. 나는 이것이 당신께 있다는 것을 알았습니다[b].
  rationale: The revision removes the added sense of totality in ‘모든’ and replaces a Korean calque with an idiomatic expression that still reflects the Hebrew ‘with you.’ It retains the source text’s ambiguity concerning what ‘this’ denotes and the nature of its relation to God.
