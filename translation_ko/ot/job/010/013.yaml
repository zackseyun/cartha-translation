id: JOB.10.13
reference: Job 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
  footnotes:
  - marker: a
    text: Or 'And these things you stored up in your heart.' The Hebrew verb can mean 'hide,' 'store up,' or 'keep in reserve.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'this was with you' may mean 'this was in your mind' or 'this was part of your hidden purpose.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이 일들을 당신의 마음에 숨겨 두셨습니다[a]. 나는 이것이 당신께 있다는 것을 알았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들을 당신의 마음에 저장해 두셨습니다.’ 히브리어 동사는 ‘숨기다’, ‘저장하다’, ‘간직하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신께 있다’는 표현은 ‘당신의 생각 안에 있다’ 또는 ‘당신의 숨은 목적의 일부이다’라는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Yet these things
  chosen_korean: 그러나 이 모든 것을
  alternatives_korean:
  - 그리고 이 모든 것을
  - 이 모든 것을
  lexicon: HALOT
  rationale: 문맥상 앞선 하나님의 행위들에서 숨겨진 의도로 넘어가는 대조가 분명하므로, 합쇼체에서는 ‘그러나’가 ‘Yet’의 역접 기능을 가장 자연스럽게 살립니다.
- source_word: צָפַנְתָּ
  english_pob_choice: you hid
  chosen_korean: 숨겨 두셨습니다
  alternatives_korean:
  - 감추셨습니다
  - 저장해 두셨습니다
  - 간직해 두셨습니다
  lexicon: HALOT
  rationale: צפן은 ‘숨기다/간직하다/비축하다’의 뜻이 있어, 하나님의 내적 의도를 가리키는 이 문맥에서는 ‘숨겨 두셨습니다’가 비밀스럽게 보존된 상태를 잘 드러냅니다.
- source_word: בִלְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 당신의 마음에
  alternatives_korean:
  - 당신의 হৃদ에
  - 당신의 속에
  - 당신의 마음속에
  lexicon: HALOT
  rationale: 히브리어 לֵבָב은 단순한 감정이 아니라 내면, 생각, 뜻을 포함하므로, 한국어 성경어법에서는 ‘마음에’가 원문의 인류학적 표현을 자연스럽게 옮깁니다.
- source_word: זֹאת עִמָּךְ
  english_pob_choice: this was with you
  chosen_korean: 이것이 당신과 함께 있다는 것
  alternatives_korean:
  - 이것이 당신 안에 있다는 것
  - 이것이 당신의 뜻이었다는 것
  - 이것이 당신의 마음에 있다는 것
  lexicon: HALOT
  rationale: עִם+대명사는 직역하면 ‘~와 함께’이지만, 문맥상 ‘숨겨진 의도/계획이 하나님과 함께 있다’는 의미를 살려 ‘당신과 함께 있다는 것’으로 두어 영어 POB가 보존한 모호성을 한국어에서도 유지했습니다.
theological_decisions:
- issue: ‘이것’의 지시 대상과 하나님의 숨은 의도
  chosen_reading: 지시 대상을 특정하지 않고, 욥이 하나님의 숨은 뜻을 알고 있었다고 말하는 고발적 진술로 유지했습니다.
  alternative_readings:
  - 하나님의 구체적 징벌 계획으로 한정해서 읽기
  - 앞선 절의 복된 일들을 가리키는 것으로 읽기
  rationale: 본문은 ‘이것’이 무엇인지 명시하지 않으므로, 번역이 그 긴장을 풀어버리지 않고 숨은 목적에 대한 욥의 항변을 그대로 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 말고 보존한다.'
