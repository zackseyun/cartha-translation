  to: 그렇지 않다면 제 말을 들으십시오[a]. 잠잠하십시오[b]. 그러면 제가 당신에게 지혜를 가르치겠습니다.
  rationale: 조건절은 앞 절의 응답 요청을 받는 ‘그렇지 않다면’으로 간결하게 옮겼습니다. ‘제 말을 들으십시오’는 שמע ל의 청취 대상과 주의 깊은 청취의 뜻을 자연스러운 한국어로 드러냅니다. ‘잠잠하십시오’와 ‘지혜를 가르치겠습니다’는 각각 명령형과 미래 진술의 흐름을 보존했습니다. 각주는 해당 낱말에 직접 연결하고, 대안 번역만 간결하게 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:45:56Z'
