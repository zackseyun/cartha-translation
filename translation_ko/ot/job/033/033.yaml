    reason: lexical_alternative
  - marker: b
    text: ‘잠잠하십시오’는 단순한 정적보다 말의 중지를 더 강하게 요구하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אַיִן
  english_pob_choice: If not
  chosen_korean: 만일 그렇지 않으면
  alternatives_korean:
  - 그렇지 않으면
  - 만일 아니라면
  lexicon: HALOT
  rationale: 앞 문맥의 전제에 대한 반대 조건을 자연스럽게 살리면서도, 현대 한국어에서 어색하지 않은 조건 표현으로 옮겼습니다.
- source_word: שְׁמַע לִי
  english_pob_choice: listen to me
  chosen_korean: 저에게 들으십시오
  alternatives_korean:
  - 제 말을 들으십시오
  - 저의 말을 들으십시오
  lexicon: HALOT
  rationale: שמע + ל의 ‘주의 깊게 듣다’라는 초점을 살리되, 합쇼체 명령으로 다듬어 직접적인 권면을 분명히 했습니다.
- source_word: הַחֲרֵשׁ
  english_pob_choice: be silent
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 침묵하십시오
  - 조용히 하십시오
  lexicon: HALOT
  rationale: 단순한 ‘조용히’보다 더 강하게 말의 중지를 요구하는 명령으로서의 뉘앙스를 살리기 위해 ‘잠잠하십시오’를 택했습니다.
- source_word: וַאֲאַלֶּפְךָ
  english_pob_choice: and I will teach you
  chosen_korean: 그러면 제가 당신에게 지혜를 가르치겠습니다
  alternatives_korean:
  - 그리고 제가 당신을 가르치겠습니다
  - 그러면 제가 당신을 교훈하겠습니다
  lexicon: HALOT
  rationale: אַלַּף 계열의 ‘가르치다/훈련하다’ 의미를 반영하되, 목적어를 앞의 ‘지혜’와 자연스럽게 결합해 한국어 문장 흐름을 살렸습니다.
theological_decisions:
- issue: 지혜(חָכְמָה)의 처리
  chosen_reading: 지혜를 그대로 두어 욥기 전체의 지혜 담론과 연결되게 했습니다.
  alternative_readings:
  - 지혜로운 교훈
  - 지혜의 길
  rationale: 본문의 핵심 명사인 חָכְמָה를 확장하지 않고 보존해야, 엘리후의 발언이 일반적 훈계가 아니라 지혜 전통 안의 직접적 가르침이라는 점이 드러납니다.
  doctrine_reference: 욥기 지혜문학 문맥
