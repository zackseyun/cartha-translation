  rationale: 문맥상 확정도가 높은 대명사 지시 대상은 한국어에서 명시하여 의미를 보존했습니다. ‘하나님의 얼굴’은 영어 POB의 선택된 읽기와 본문 문맥을 따르되, 히브리어의 압축된 대명사 표현은 각주에서 밝혔습니다. 마지막 절은 하나님이 기도한 사람의 의를 그에게 회복하신다는 관계를 문법적으로 분명히 하면서, ‘의’라는 폭넓은 원어 어휘를 유지했습니다.
