  source_fidelity: 대명사의 지시 대상과 동사의 주체를 본문에서 명확히 해야 합니다. 히브리어의 흐름은 사람이 하나님께 간구하고, 하나님께서 그를 호의롭게 받아들이시며, 그 사람이 하나님의 얼굴을 환호 가운데 보고, 하나님께서 그 사람에게 그의 의를 돌려주시는 것으로 읽는 것이 가장 자연스럽습니다. 초안은 마지막 ‘되돌려 주십니다’의 주체와 ‘그의 의’의 소유자가 한국어상 불필요하게 모호합니다.
  naturalness: ‘하나님은 … 그는 … 사람에게 그의 의를’이라는 연쇄는 현대 한국어에서 지시 대상이 흔들립니다. 주체를 필요한 곳에서 밝혀 주고, ‘기쁨의 외침과 함께’는 동작에 자연스럽게 연결되는 ‘기쁨의 환호를 하며’로 다듬는 것이 좋습니다.
