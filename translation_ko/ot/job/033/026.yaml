id: JOB.33.26
reference: Job 33:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
  footnotes:
  - marker: a
    text: Or 'he entreats God.' The Hebrew verb can emphasize earnest pleading in prayer.
    reason: lexical_alternative
  - marker: b
    text: That is, he sees God's face; the Hebrew simply says 'his face.'
    reason: alternative_reading
  - marker: c
    text: Or 'his vindication' or 'his right standing.' The Hebrew 'righteousness' may refer to restored standing before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하나님께 기도합니다[a]. 하나님은 그를 받아 주시고, 그는 기쁨의 외침과 함께 그의 얼굴을 보며[b], 사람에게 그의 의를 되돌려 주십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 하나님께 간청합니다.’ 히브리어 동사는 간절한 청원을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 하나님의 얼굴을 본다는 뜻입니다. 히브리어는 단순히 ‘그의 얼굴’이라고 합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 변호/정당화’입니다. 여기서 ‘의’는 회복된 바른 지위나 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  english_pob_choice: prays
  chosen_korean: 기도합니다
  alternatives_korean:
  - 간청합니다
  - 간구합니다
  lexicon: HALOT
  rationale: עתר는 하나님께 드리는 간절한 기도나 간구를 뜻하므로, 현대 한국어에서는 가장 자연스러운 ‘기도합니다’로 옮기되, 간절한 청원의 뉘앙스는 문맥으로 살렸습니다.
- source_word: וַיִּרְצֵהוּ
  english_pob_choice: and he accepts him
  chosen_korean: 그를 받아 주시고
  alternatives_korean:
  - 그를 기쁘게 여기시고
  - 그에게 호의로 응답하시고
  lexicon: HALOT
  rationale: רצה의 여기서는 하나님이 청원을 호의롭게 받아들이는 뜻이므로, ‘받아 주시고’가 관계 회복과 응답의 뉘앙스를 가장 간결하게 드러냅니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: with a shout of joy
  chosen_korean: 기쁨의 외침과 함께
  alternatives_korean:
  - 환호와 함께
  - 즐거운 소리와 함께
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 기쁨보다 소리 나는 환호를 가리키므로, ‘기쁨의 외침’으로 옮겨 음성적 강세를 살렸습니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 의로움
  - 그의 올바른 지위
  lexicon: HALOT
  rationale: צדקה는 기본적으로 ‘의’를 뜻하므로, 원어의 범위를 보존하는 ‘의’를 택했습니다. 이 문맥에서 회복된 상태나 변호의 의미도 포함될 수 있지만, 본문 자체를 넘어서지 않도록 했습니다.
theological_decisions:
- issue: ‘그의 얼굴을 보며’의 지시 대상
  chosen_reading: ‘그의 얼굴’은 문맥상 하나님을 가리키는 것으로 이해하되, 히브리어의 간결한 표현은 그대로 유지했습니다.
  alternative_readings:
  - 사람의 얼굴을 본다는 읽기
  - 직접적으로 ‘하나님의 얼굴’이라고 풀어 쓰는 읽기
  rationale: 히브리어는 단순히 ‘그의 얼굴’을 말하지만, 앞뒤 문맥상 회복된 사람이 하나님 앞에 나아가 하나님의 얼굴을 보는 뜻이 자연스럽습니다. 한국어 본문은 원문의 압축성을 살리고, 의미는 문맥으로 드러나게 했습니다.
  doctrine_reference: 애매한 대명사는 본문이 허용하는 범위 안에서 유지하고, 필요한 해석은 과도하게 본문에 삽입하지 않습니다.
- issue: ‘그의 의’의 신학적 범위
  chosen_reading: 회복된 사람에게 돌아가는 의/바른 관계의 회복으로 옮겼습니다.
  alternative_readings:
  - 사람의 무죄 판정
  - 외적 변호의 회복
  - 의롭다 하심의 선취
  rationale: 본문은 후대 교리 용어를 직접 말하지 않고, 회복 이후의 상태를 묘사합니다. 따라서 ‘의’를 유지하되, 독자가 관계적 회복까지 함께 읽을 수 있도록 했습니다.
  doctrine_reference: 본문이 말하는 것 이상으로 칭의 교리를 덧씌우지 않습니다.
