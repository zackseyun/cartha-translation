base_translation:
  language: en
  yaml_path: translation/ot/job/033/005.yaml
  text: If you are able[a], answer me; set your case in order before me; take your stand.
  footnotes:
  - marker: a
    text: Or 'arrange your words before me.' The Hebrew verb means 'set in order' and may refer either to Job's argument or more generally to his prepared response.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 할 수 있다면, 내게 대답하십시오. 내 앞에서 당신의 논변을 잘 정리하여 제시하고, 일어서십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘정리하다, 배열하다’의 뜻을 가지며, 여기서는 당신의 논변이나 더 일반적으로는 준비된 대답을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם / תּוּכַל
  english_pob_choice: If you are able
  chosen_korean: 만일 당신이 할 수 있다면
  alternatives_korean:
  - 당신이 할 수 있다면
  - 만일 당신이 능하다면
  lexicon: HALOT
  rationale: 조건적 도전의 어조를 살리기 위해 ‘만일’과 가능성 표현을 사용했습니다. ‘할 수 있다’가 능력의 의미를 자연스럽게 담습니다.
- source_word: הֲשִׁיבֵנִי
  english_pob_choice: answer me
  chosen_korean: 내게 대답하십시오
  alternatives_korean:
  - 내게 답하십시오
  - 내게 응답하십시오
  lexicon: HALOT
  rationale: 히필형의 ‘대답하다/되답하다’ 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 선택했습니다.
- source_word: עֶרְכָה
  english_pob_choice: set your case in order
  chosen_korean: 당신의 논변을 잘 정리하여 제시하고
  alternatives_korean:
  - 당신의 말을 정리하여 제시하고
  - 당신의 변론을 정리하여 제시하고
  - 당신의 주장을 배열하여
  lexicon: HALOT
  rationale: ‘정리하여 제시하다’로 ‘set in order’의 배열·준비 의미를 살리면서, 법정/논쟁 맥락의 ‘논변’ 뉘앙스를 반영했습니다.
- source_word: הִתְיַצָּבָה
  english_pob_choice: take your stand
  chosen_korean: 일어서십시오
  alternatives_korean:
  - 자리를 잡으십시오
  - 서서 맞서십시오
  - 자세를 갖추십시오
  lexicon: HALOT
  rationale: 히트파엘의 ‘서다/자기 위치에 서다’ 의미를 한국어 명령형으로 압축해, 대결적인 도전 어조를 살렸습니다.
theological_decisions:
- issue: 욥기 33:5의 수사적 대면 장면과 존대 레벨
  chosen_reading: 화자와 상대의 대립적 공개 토론 장면을 유지하기 위해 전반은 합쇼체로 두되, 명령형은 한국어 공손 명령으로 처리했습니다.
  alternative_readings:
  - 더 직접적인 반말식 도전
  - 더 완곡한 권유형 표현
  rationale: 본문은 논쟁적·법정적 도전이므로 지나치게 완곡하게 만들지 않되, 한국어 성경 문체의 표준인 합쇼체를 유지했습니다.
  doctrine_reference: 표준어 성경체와 담화 장르 보존
