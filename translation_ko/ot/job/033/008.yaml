    text: Hebrew literally, 'in my ears, and the sound of words I hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분명히 당신은 내가 듣는 데서 말하였고, 나는 당신의 말소리를 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 귀에, 그리고 말들의 소리를 내가 듣는다’입니다.
    reason: source_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 참으로
  - 실로
  - 오직
  lexicon: HALOT
  rationale: 여기서는 제한의 의미가 아니라 엘리후가 앞선 발화를 강하게 확인하며 인용을 시작하는 강조 부사로 기능하므로, 한국어에서는 '분명히'가 어조를 가장 자연스럽게 살립니다.
- source_word: בְאָזְנִי
  english_pob_choice: in my hearing
  chosen_korean: 내 귀에
  alternatives_korean:
  - 내 듣는 데에
  - 내 귀속에
  - 내가 듣는 중에
  lexicon: HALOT
  rationale: 직역은 '내 귀에'이지만, 한국어에서도 신체기관을 통한 청취를 자연스럽게 표현할 수 있어 원문의 청각적 이미지를 보존하면서도 어색함을 줄입니다.
- source_word: וְקוֹל מִלִּין
  english_pob_choice: and the sound of your words
  chosen_korean: 당신의 말소리
  alternatives_korean:
  - 말의 소리
  - 당신의 말의 소리
  - 말하는 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 '소리'이고 מִלִּין과 결합해 말의 청각적 현상을 강조하므로, 한국어에서는 '말소리'로 압축해 원문의 감각적 중점을 살렸습니다.
- source_word: אֶשְׁמָע
  english_pob_choice: I have heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣고 있습니다
  - 들어요
  - 들은 바 있습니다
  lexicon: HALOT
  rationale: 형태상 미완료형이지만 문맥상 이미 들은 사실을 회고하는 진술이므로, 한국어에서는 완료된 청취를 나타내는 '들었습니다'가 가장 자연스럽습니다.
theological_decisions:
- issue: 엘리후가 Job의 말을 직접 인용하는 화행의 톤
  chosen_reading: 직접 인용의 보고문으로 처리해, 감정적 비난이나 해석을 덧붙이지 않고 '분명히… 말하였고… 들었습니다'로 담담하게 옮겼습니다.
  alternative_readings:
  - 더 강한 고발조의 표현
  - 설명형으로 풀어쓴 번역
  rationale: 이 절은 Job의 발화를 기억해 재진술하는 도입부이므로, 원문의 화행을 보존하는 것이 다음 절들의 논증을 왜곡하지 않습니다.
  doctrine_reference: 문맥적 화행 보존
