base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
  footnotes:
  - marker: a
    text: Or 'innocent' for 'clean' (חַף); the Hebrew term can denote freedom from guilt as well as cleanness.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is no guilt in me'; 'iniquity' (עָוֺן) can also carry the sense of guilt or wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: “나는 순결하고[a] 범죄가 없으며, 나는 깨끗하고[b] 내게는 죄악이 없습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깨끗한’으로 옮길 수 있습니다. 히브리어 זַךְ는 도덕적 순결 또는 깨끗함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무죄한’ 또는 ‘결백한’으로 옮길 수 있습니다. 히브리어 חַף는 깨끗함뿐 아니라 죄책이 없음을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘죄책’ 또는 ‘잘못’으로 옮길 수 있습니다. 히브리어 עָוֺן은 죄악, 죄책, 또는 잘못을 가리킬 수 있습니다.
    reason: lexical_alternative
