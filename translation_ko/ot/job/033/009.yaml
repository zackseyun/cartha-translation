  rationale: 여기서는 ‘내 안에 없다’는 표현과 결합해 단순한 행위보다 왜곡된 도덕적 상태를 가리키므로, 한국어로는 전통 교회어보다 넓은 의미의 ‘불의’가 적절합니다.
theological_decisions:
- issue: 화자의 자기 진술을 얼마나 강하게 보존할지
  chosen_reading: 이 진술을 완화하지 않고, 자기 의로움을 말하는 직접적 진술로 그대로 옮겼습니다.
  alternative_readings:
  - ‘나는 그렇게 생각합니다’처럼 약화하기
  - 도덕적 무결함을 넘어 무죄선언처럼 과도하게 강화하기
  rationale: 히브리어는 엘리후가 인용하는 욥의 발화를 단정적인 평행구조로 제시하므로, 번역도 그 긴장을 유지해야 합니다. 본문이 말하는 자기 주장 자체를 드러내되, 그 진술의 정당성 판단은 번역에서 해결하지 않습니다.
  doctrine_reference: 번역은 본문의 긴장을 보존하고 신학적 판결은 유보합니다.
