  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
  footnotes:
  - marker: a
    text: Or 'innocent' for 'clean' (חַף); the Hebrew term can denote freedom from guilt as well as cleanness.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is no guilt in me'; 'iniquity' (עָוֺן) can also carry the sense of guilt or wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: “나는 순수합니다[a], 범죄가 없습니다. 나는 깨끗합니다[b], 그리고 내 안에는 불의가 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄한’으로 옮길 수 있습니다. 히브리어 חַף는 죄책이 없다는 뜻과 깨끗하다는 뜻을 둘 다 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내게 불의가 없다’로 옮길 수 있습니다. עָוֺן은 불의, 죄책, 잘못의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  english_pob_choice: pure
  chosen_korean: 순수합니다
  alternatives_korean:
  - 깨끗합니다
  - 무죄합니다
  - 정결합니다
  lexicon: HALOT
  rationale: 예배·정결의 관용어보다 도덕적 상태를 드러내는 말로 옮겨, 첫 진술의 윤리적 순결성을 살렸습니다. 뒤의 חַף를 ‘깨끗하다’로 구분해 중복을 피했습니다.
- source_word: בְּלִי פָשַׁע
  english_pob_choice: without transgression
  chosen_korean: 범죄가 없습니다
  alternatives_korean:
  - 반역이 없습니다
  - 허물이 없습니다
  - 범죄함이 없습니다
  lexicon: HALOT
  rationale: בְּלִי의 부재 의미와 פשע의 법적·도덕적 위반 의미를 함께 살려, ‘없습니다’로 직접적인 부정을 유지했습니다.
- source_word: חַף
  english_pob_choice: clean
  chosen_korean: 깨끗합니다
  alternatives_korean:
  - 무죄합니다
  - 결백합니다
  - 순결합니다
  lexicon: HALOT
  rationale: 이 형용사는 ‘깨끗함’과 ‘죄책 없음’ 둘 다를 가질 수 있으므로, 물질적 이미지도 남기면서 도덕적 의미를 잃지 않는 ‘깨끗하다’를 택했습니다.
- source_word: עָוֺן
  english_pob_choice: iniquity
  chosen_korean: 불의
  alternatives_korean:
  - 죄악
  - 죄책
  - 악행
  lexicon: HALOT
  rationale: 여기서는 ‘내 안에 없다’는 표현과 결합해 단순한 행위보다 왜곡된 도덕적 상태를 가리키므로, 한국어로는 전통 교회어보다 넓은 의미의 ‘불의’가 적절합니다.
theological_decisions:
- issue: 화자의 자기 진술을 얼마나 강하게 보존할지
  chosen_reading: 이 진술을 완화하지 않고, 자기 의로움을 말하는 직접적 진술로 그대로 옮겼습니다.
  alternative_readings:
  - ‘나는 그렇게 생각합니다’처럼 약화하기
  - 도덕적 무결함을 넘어 무죄선언처럼 과도하게 강화하기
  rationale: 히브리어는 엘리후가 인용하는 욥의 발화를 단정적인 평행구조로 제시하므로, 번역도 그 긴장을 유지해야 합니다. 본문이 말하는 자기 주장 자체를 드러내되, 그 진술의 정당성 판단은 번역에서 해결하지 않습니다.
  doctrine_reference: 번역은 본문의 긴장을 보존하고 신학적 판결은 유보합니다.
