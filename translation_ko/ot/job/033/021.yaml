  yaml_path: translation/ot/job/033/021.yaml
  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
  footnotes:
  - marker: a
    text: Or 'His flesh is consumed away from sight, and his bones that were not seen are laid bare.' The Hebrew of this line is compact and somewhat difficult, especially the verb rendered 'stick out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 살은 보이는 데서 쇠하고, 보이지 않던 그의 뼈들이 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 살은 보이지 않게 사라지고, 그의 뼈들, 이전에는 보이지 않던 것들이 드러납니다.’ 히브리어는 매우 압축적이고 다소 난해하며, 특히 ‘드러납니다’로 옮긴 동사가 그렇습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  english_pob_choice: wastes away
  chosen_korean: 쇠하고
  alternatives_korean:
  - 소진되고
  - 소멸하고
  - 사라지고
  lexicon: HALOT
  rationale: כלה의 신체적 쇠약·소모를 자연스러운 현대 한국어로 옮겼습니다. '쇠하다'는 육체가 약해지고 줄어드는 과정을 잘 드러냅니다.
- source_word: בְּשָׂרוֹ
  english_pob_choice: his flesh
  chosen_korean: 그의 살
  alternatives_korean:
  - 그의 몸
  - 그의 육체
  lexicon: HALOT
  rationale: 직역에 가까운 '살'을 사용해 원문의 구체적 신체 이미지를 보존했습니다.
- source_word: מֵרֹאִי
  english_pob_choice: from sight
  chosen_korean: 보이는 데서
  alternatives_korean:
  - 보이지 않게
  - 눈에 띄지 않게
  lexicon: HALOT
  rationale: מן + רֹאִי의 의미를 '시야/가시성의 영역에서'라는 뜻으로 살려, 살이 눈앞에서 줄어드는 그림을 자연스럽게 표현했습니다.
- source_word: וְשֻׁפִי עַצְמוֹתָיו
  english_pob_choice: his bones, once unseen, stick out
  chosen_korean: 보이지 않던 그의 뼈들이 드러납니다
  alternatives_korean:
  - 그의 뼈들이 튀어나옵니다
  - 그의 뼈들이 드러나 보입니다
  lexicon: HALOT
  rationale: 난해한 שׁפי를 '드러나다'로 처리해 뼈가 육체의 소모로 인해 노출되는 이미지를 살렸습니다. '튀어나오다'보다 문맥상 과도하지 않게, 그러나 시각적 대비는 유지했습니다.
theological_decisions:
- issue: 시적·의학적 신체 묘사의 직설성 유지
  chosen_reading: 원문의 육체 쇠약과 뼈의 노출을 완곡하게 줄이지 않고 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로 완화해 번역하는 방식
  - 병약함을 일반화해 표현하는 방식
  rationale: 이 절은 회개·징계 맥락에서 신체가 무너져 가는 모습을 말하므로, 시적 긴장과 신체성 자체를 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 욥기 33장 문맥의 고난-징계-회복 논의
