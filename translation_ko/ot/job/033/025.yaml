  text: his flesh becomes fresher than in youth[b][a]; he returns to the days of his youthful vigor.
  footnotes:
  - marker: a
    text: Or 'his flesh is made fresh like a boy's' or 'his flesh becomes fresher than a youth's.' The Hebrew verb is rare, and the comparison with youth can be construed in slightly different ways.
    reason: lexical_alternative
  - marker: b
    text: Or 'he returns to the days of his youth.' The Hebrew noun can denote youth itself or the vigor associated with it.
