  text: 그의 살이 젊은 시절보다 더 새로워지고, 그는 젊은 시절의 날들로 돌아갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 살이 소년의 살처럼 새로워집니다’ 혹은 ‘그의 살이 청년의 살보다 더 새로워집니다.’ 히브리어 동사는 희귀하며, 젊음과의 비교는 약간 다르게 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 젊은 시절의 날들로 돌아갑니다.’ 이 히브리어 명사는 젊음 자체나 그에 따른 활력을 가리킬 수 있습니다.
    reason: lexical_alternative
