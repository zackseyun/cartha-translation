lexical_decisions:
- source_word: הַקְשֵׁב
  english_pob_choice: Pay attention
  chosen_korean: 잘 들으십시오
  alternatives_korean:
  - 주의하십시오
  - 귀를 기울이십시오
  lexicon: HALOT
  rationale: קשב의 히필 명령형은 단순 청취보다 주의 깊은 경청을 요구하므로, 현대 한국어에서 직접적이고 자연스러운 명령인 ‘잘 들으십시오’로 옮겼습니다.
- source_word: שְׁמַע לִי
  english_pob_choice: listen to me
  chosen_korean: 들으십시오
  alternatives_korean:
  - 저를 들으십시오
  - 제 말을 들으십시오
  lexicon: HALOT
  rationale: ל 접속사와 함께한 שׁמע는 상대를 향한 청취를 뜻하므로, 한국어에서는 대상이 분명한 명령형으로 간결하게 처리했습니다.
- source_word: הַחֲרֵשׁ
  english_pob_choice: Be silent
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 조용히 하십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: חרשׁ의 명령형은 ‘말을 멈추라’는 수사적 금지에 가깝기 때문에, 본문 어조를 살리는 ‘잠잠하라’를 택했습니다.
- source_word: וְאָנֹכִי אֲדַבֵּר
  english_pob_choice: and I will speak
  chosen_korean: 그러면 내가 말하겠습니다
  alternatives_korean:
  - 그리고 제가 말하겠습니다
  - 그러면 제가 말할 것입니다
  lexicon: HALOT
  rationale: 연결사 ו와 1인칭 강조형 אָנֹכִי, 그리고 미완료형 אֲדַבֵּר의 순서를 따라, 조건적 진행감을 살려 ‘그러면’과 1인칭 미래형으로 옮겼습니다.
theological_decisions:
- issue: Elihu의 발화 태도와 명령형 어조
  chosen_reading: 본문의 직접 명령을 살려, 욥에게 두 번의 명령과 화자의 발화 예고를 분명하게 드러냈습니다.
  alternative_readings:
  - 부드러운 권유조로 완화
  - 설명문처럼 평서로 처리
  rationale: 이 절은 설교적 완곡어보다 대화적 긴박감이 핵심이므로, 본문의 수사적 압박을 유지하는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 문맥적 수사 이해
- issue: 존대와 명령형의 병용
  chosen_reading: 직접 호칭은 평서체를 유지하되, 청자에게는 합쇼체 명령을 사용했습니다.
  alternative_readings:
  - 전면 하십시오체
  - 구어적 반말 명령
  rationale: 히브리어 원문은 격식 있는 호칭과 강한 명령을 함께 사용하므로, 한국어에서도 존대를 유지하면서 명령의 강도를 보존했습니다.
  doctrine_reference: 번역체/화법 일치
