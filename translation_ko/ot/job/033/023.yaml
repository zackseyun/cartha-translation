  terminology: מַלְאָךְ는 ‘천사’, מֵלִיץ는 문맥상 ‘중재자’로 옮기되, ‘해석자’ 및 ‘사자’의 대안을 각주에 보존합니다. יָשְׁרוֹ는 교리적으로 특정하지 않고 ‘그에게 마땅한 바’로 번역하며 직역적 대안을 각주에 제시합니다.
