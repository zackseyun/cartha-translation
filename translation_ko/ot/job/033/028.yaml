id: JOB.33.28
reference: Job 33:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
  footnotes:
  - marker: a
    text: Or 'has ransomed my life from going down into the pit.'
    reason: lexical_alternative
  - marker: b
    text: '''The pit'' is a common Hebrew image for death or the grave.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 내 영혼을 구덩이로 넘어가지 않게 속량하셨고, 내 생명은 빛을 보게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 죽음이나 무덤을 가리키는 흔한 히브리어 이미지입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내 생명을 구덩이로 내려가지 않게 속량하셨고’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  english_pob_choice: has redeemed
  chosen_korean: 속량하셨고
  alternatives_korean:
  - 구원하셨고
  - 되사셨고
  - 건져내셨고
  lexicon: HALOT
  rationale: פָּדָה는 단순한 구조보다 값으로 건져내는 속량의 의미가 강하므로, POB의 'redeemed'를 따라 ‘속량하다’로 옮기는 것이 가장 직접적입니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나
  - 내 존재
  lexicon: HALOT
  rationale: 앞 절의 נֶפֶשׁ는 여기서 ‘생명/자기 자신’보다 ‘영혼’이 더 잘 살려 주는 시적 대비가 있으며, 뒤의 ‘내 생명’과 구분도 유지됩니다.
- source_word: בַּשַּׁחַת
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 무덤
  - 구덩이 속
  - 멸망의 구덩이
  lexicon: HALOT
  rationale: שַׁחַת은 죽음의 영역을 가리키는 관용적 이미지이므로, 직역에 가까운 ‘구덩이’를 택해 비유성을 유지했습니다.
- source_word: בָּאוֹר תִּרְאֶה
  english_pob_choice: will look upon the light
  chosen_korean: 빛을 보게 될 것입니다
  alternatives_korean:
  - 빛을 바라보게 될 것입니다
  - 빛을 보게 됩니다
  - 빛을 보리라
  lexicon: HALOT
  rationale: 문맥상 미래적 결과를 나타내므로 ‘보게 될 것입니다’로 옮기고, ‘빛을 보다’는 히브리 시에서 생명/회복을 뜻하는 표현으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 첫 절의 주어를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그는’으로 시작해 앞뒤 문맥에서 암시되는 하나님을 드러냈습니다.
  alternative_readings:
  - 주어를 생략해 ‘내 영혼을 … 속량하셨고’로 시작
  - ‘하나님은’으로 명시
  rationale: 히브리어는 주어를 생략하지만, 한국어에서는 서술의 주체를 드러내야 자연스럽습니다. 다만 본문에 없는 ‘하나님은’을 새로 넣기보다, 문맥상 암시된 주어를 ‘그는’으로 처리해 원문의 절제된 표현을 보존했습니다.
  doctrine_reference: 문맥상 하나님의 구원 행위
- issue: ‘구덩이’의 상징성 유지
  chosen_reading: ‘구덩이’로 옮겨 죽음/무덤의 관용적 의미를 열어 두었습니다.
  alternative_readings:
  - ‘무덤’으로 명시
  - ‘죽음’으로 해석해 옮김
  rationale: 본문의 שַׁחַת은 죽음의 영역을 가리키지만, 시적 비유를 직접 해설해 버리면 원문의 중의성이 줄어듭니다. 따라서 한국어도 상징을 유지하는 방향이 더 적절합니다.
  doctrine_reference: 히브리 시의 비유적 표현
