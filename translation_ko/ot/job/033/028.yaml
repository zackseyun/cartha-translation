  to: 그는 내 영혼을 구덩이로 들어가는 데서 속량하셨고, 내 생명은 빛을 보게 될 것입니다.[a][b]
  rationale: 첫째 행의 이동 표현을 원문에 더 가깝고 자연스러운 한국어로 바로잡았습니다. 주어 ‘그는’은 히브리어에서 명시되지 않았으나 문맥상 암시된 3인칭 남성 주어를 보존하며, ‘하셨고’는 한국어 성경 문체의 존대 서술을 유지합니다. 각주는 본문의 비유성과 נֶפֶשׁ의 어휘 대안을 각각 지원하도록 유지·정리했습니다.
