    issue: ‘구덩이로 넘어가지 않게’가 מֵעֲבֹר בַּשַּׁחַת의 이동 표현을 부정확하고 다소 어색하게 옮깁니다.
    rationale: עָבַר는 여기서 구덩이로 건너가거나 들어가는 것을 뜻하며, ‘넘어가지 않게’는 넘어짐 또는 일반적 통과의 뜻으로 읽힐 수 있습니다. ‘구덩이로 들어가는 데서’는 원문의 방향성과 פָּדָה가 취하는 ‘~에서 속량하다’의 관계를 자연스럽게 나타냅니다.
  - severity: low
