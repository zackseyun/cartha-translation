  rationale: 문맥상 특정 남성만이 아니라 일반 인간을 가리키는 용법이므로, 한국어 본문은 포괄적 의미를 드러내는 쪽이 오해를 줄입니다. 다만 원문의 남성 복수 표지는 주석으로 보존합니다.
