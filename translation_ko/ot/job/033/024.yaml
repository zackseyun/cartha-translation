id: JOB.33.24
reference: Job 33:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחֻנֶּ֗/נּוּ וַ/יֹּ֗אמֶר פְּ֭דָעֵ/הוּ מֵ/רֶ֥דֶת שָׁ֗חַת מָצָ֥אתִי כֹֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/024.yaml
  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
  footnotes:
  - marker: a
    text: Or 'I have found an atonement price' / 'I have found a covering.' The Hebrew כֹּפֶר can denote a ransom or compensation securing release, and in some contexts carries atonement-related overtones.
    reason: lexical_alternative
  - marker: b
    text: '''The pit'' can also evoke the grave or destruction, not merely a physical hole in the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그는 그에게 은혜를 베풀어 말했습니다. “그를 구덩이[b]로 내려가지 않도록 건져 내라. 내가 속전[a]을 찾았다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֹפֶר는 해방을 위한 속전이나 배상금을 뜻할 수 있습니다. 어떤 문맥에서는 속죄와 관련된 뉘앙스도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구덩이’는 단순한 땅의 구멍뿐 아니라 무덤이나 멸망을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  english_pob_choice: then he is gracious to him
  chosen_korean: 그는 그에게 은혜를 베풀며
  alternatives_korean:
  - 그는 그를 불쌍히 여기며
  - 그는 그에게 호의를 보이며
  lexicon: HALOT
  rationale: חנן은 단순한 동정이 아니라 은혜·호의·자비를 베푸는 뜻이므로, 한국어에서는 ‘은혜를 베풀다’가 가장 직접적으로 대응합니다.
- source_word: פְּדָעֵהוּ
  english_pob_choice: Deliver him
  chosen_korean: 그를 구덩이로 내려가지 않게 하라
  alternatives_korean:
  - 그를 속량하라
  - 그를 건져내라
  - 그를 구출하라
  lexicon: HALOT
  rationale: פּדה는 ‘속량하다/구속하다’의 뜻이 있지만, 이 절에서는 뒤의 כֹפֶר가 이미 속전 개념을 명시하므로 본문 명령은 결과를 살린 ‘내려가지 않게 하라’로 옮겨 중복 과잉을 피했습니다.
- source_word: שָׁחַת
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 음부
  - 무덤
  - 멸망
  lexicon: HALOT
  rationale: שׁחת는 문맥상 죽음의 세계를 가리키는 ‘구덩이’가 기본값이며, 너무 신학화된 ‘음부’나 해석을 고정하는 ‘멸망’보다 원어의 구체적 이미지를 살립니다.
- source_word: כֹפֶר
  english_pob_choice: a ransom
  chosen_korean: 속전
  alternatives_korean:
  - 속죄값
  - 대속물
  - 보상물
  lexicon: HALOT
  rationale: כֹפר는 해방을 확보하는 대가라는 뜻의 ‘속전’이 가장 정확하며, ‘속죄값’보다 제의적 의미를 덜 고정하면서도 POB의 ‘ransom’과 잘 대응합니다.
theological_decisions:
- issue: כֹפֶר의 신학적 범위
  chosen_reading: 본문의 핵심 이미지는 ‘구원을 위한 속전’으로 두고, 속죄 뉘앙스는 여백으로 남깁니다.
  alternative_readings:
  - 속죄
  - 화목제물적 대가
  - 속량
  rationale: 이 절은 사람이 구덩이로 내려가지 않도록 막는 근거를 말하므로, 원문의 긴장을 보존하기 위해 제의적 용어를 과도하게 확정하지 않고 ‘속전’으로 번역했습니다.
  doctrine_reference: 본문의 의미를 보존하되, 뒤의 구속·속죄 교리로 곧장 환원하지 않음
