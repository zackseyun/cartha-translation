id: JOB.33.27
reference: Job 33:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשֹׁ֤ר עַל אֲנָשִׁ֗ים וַ/יֹּ֗אמֶר חָ֭טָאתִי וְ/יָשָׁ֥ר הֶעֱוֵ֗יתִי וְ/לֹא שָׁ֥וָה לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: ko
  text: 그는 사람들 앞에서 노래하며 말합니다. ‘내가 죄를 지었고, 옳은 것을 비틀었습니다. 그런데도 그것은 나에게 갚아지지 않았습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “사람들 위에서”이지만, 한국어에서는 공개적 발화의 장면을 드러내는 ‘사람들 앞에서’가 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁר עַל אֲנָשִׁים
  english_pob_choice: He sings before men
  chosen_korean: 사람들 앞에서 노래하며
  alternatives_korean:
  - 사람들 앞에서 노래하고
  - 사람들 위에서 노래하며
  lexicon: יָשֹׁר
  rationale: 동사의 기본 의미를 따라 ‘노래하다’로 옮기고, 전치사구는 자연스러운 한국어로 ‘사람들 앞에서’라고 풀어 원문의 공개적 행위를 드러냈습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었고
  alternatives_korean:
  - 내가 죄를 범했고
  - 내가 죄를 지었으며
  lexicon: חטא
  rationale: 직역보다 한국어에서 자연스러운 죄책 고백 표현인 ‘죄를 지었습니다’ 계열을 택하되, 현재완료적 고백의 뉘앙스를 살리기 위해 과거형으로 옮겼습니다.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  english_pob_choice: twisted what was right
  chosen_korean: 옳은 것을 비틀었습니다
  alternatives_korean:
  - 옳은 것을 비뚤어지게 했습니다
  - 바른 것을 굽게 했습니다
  lexicon: ישר / עוה
  rationale: POB의 최종 선택인 ‘twisted’를 반영해 ‘비틀다’를 사용했습니다. ישר의 ‘옳은/바른’ 의미를 살리면서 도덕적 일탈을 분명히 드러냅니다.
- source_word: וְלֹא שָׁוָה לִי
  english_pob_choice: and it was not repaid to me
  chosen_korean: 그런데도 그것은 나에게 갚아지지 않았습니다
  alternatives_korean:
  - 그리고 그것은 내게 보상되지 않았습니다
  - 그 대가가 내게 돌아오지 않았습니다
  lexicon: שׁוה
  rationale: 문맥상 ‘값지다/상응하다’의 어감이 있어, 행위의 결과가 기대한 대로 돌아오지 않았음을 한국어 수동형으로 표현했습니다. POB의 ‘repaid’를 직접 반영하되 의미를 자연화했습니다.
theological_decisions:
- issue: 회개 고백의 발화 방식
  chosen_reading: 화자가 공개적으로 자신의 죄와 왜곡을 인정하는 고백문으로 읽었습니다.
  alternative_readings:
  - 단순한 서술문으로 읽는 방식
  - 보응의 부재를 중심으로 읽는 방식
  rationale: 히브리어 동사 연쇄와 인용 부호 구조는 고백의 직접화를 강하게 드러내므로, 한국어도 직접 화법을 유지해 독자의 이해를 보존했습니다.
  doctrine_reference: 욥기 33장 문맥상의 회개/책망 논지
- issue: וְלֹא שָׁוָה לִי의 의미
  chosen_reading: 행위에 대한 상응하는 대가나 보상이 자신에게 돌아오지 않았다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘그것은 내게 합당하지 않았다’
  - ‘그것은 나에게 상응하지 않았다’
  rationale: שורש שוה의 보상·상응 영역을 한국어로 전달하기 위해 ‘갚아지지 않았다’로 옮겨, 도덕적-법적 결과의 부재를 보존했습니다.
  doctrine_reference: 히브리어 상응어휘의 의미 범위
