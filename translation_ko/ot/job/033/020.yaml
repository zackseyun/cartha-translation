id: JOB.33.20
reference: Job 33:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זִֽהֲמַ֣תּ/וּ חַיָּת֣/וֹ לָ֑חֶם וְ֝/נַפְשׁ֗/וֹ מַאֲכַ֥ל תַּאֲוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/020.yaml
  text: so that his life loathes bread[b][a], and his soul desirable food.
  footnotes:
  - marker: a
    text: Or 'choice food' for 'desirable food'; the Hebrew expression denotes food that is desired or appealing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his soul'; this can also mean 'his life,' 'his appetite,' or 'he himself' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그의 생명은 빵을 싫어하고, 그의 영혼은 기호식품을 싫어합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기호식품’은 ‘좋아하는 음식’, ‘먹고 싶은 음식’으로도 옮길 수 있습니다. 히브리어는 ‘원하는/매력적인 음식’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 영혼’은 문맥에 따라 ‘그의 생명’, ‘그의 욕구’, ‘그 자신’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  english_pob_choice: loathes
  chosen_korean: 싫어하고
  alternatives_korean:
  - 혐오하고
  - 역겨워하고
  - 꺼려하고
  lexicon: HALOT
  rationale: זהם의 핵심은 강한 혐오와 역겨움이지만, 한국어에서는 문맥상 자연스러운 동사인 ‘싫어하다’로 옮겨도 강한 거부감을 살릴 수 있어 동사 하나로 간결하게 처리했습니다.
- source_word: חַיָּתוֹ
  english_pob_choice: his life
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 삶
  - 그의 목숨
  - 그의 생기
  lexicon: HALOT
  rationale: 시적 병행 속에서 נפשׁ와 짝을 이루는 표현으로, ‘생명’이 영어 POB의 ‘his life’를 가장 직접적으로 받으면서도 한국어에서 자연스럽습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그 자신
  - 그의 욕구
  lexicon: HALOT
  rationale: נפשׁ는 여기서 내면의 자아/생명 전체를 가리킬 수 있으나, 시적 병행을 살리기 위해 ‘영혼’을 택했습니다. 다만 이는 본문의 인격적·내적 차원을 강조하는 번역입니다.
- source_word: מַאֲכַל תַּאֲוָה
  english_pob_choice: desirable food
  chosen_korean: 기호식품
  alternatives_korean:
  - 원하는 음식
  - 먹고 싶은 음식
  - 기호하는 음식
  lexicon: HALOT
  rationale: 직역하면 ‘바라는 음식’이지만, 한국어에서 ‘기호식품’이 원래는 appetizing/desired food의 뜻을 더 압축적으로 전달합니다. 다만 현대 용례의 뉘앙스가 있으므로 시적 표현으로 읽히도록 선택했습니다.
theological_decisions:
- issue: ‘נפשׁ’의 한국어 대응을 생명/영혼 중 어디로 둘지
  chosen_reading: ‘영혼’으로 두어 시적 병행을 살리고, ‘생명’과의 차이를 유지했습니다.
  alternative_readings:
  - ‘생명’으로 통일
  - ‘자신’으로 평준화
  rationale: 본문은 ‘생명’과 ‘נפשׁ’를 나란히 두어 인간의 전체성을 묘사합니다. 한국어에서 둘을 모두 ‘생명’으로 만들면 병행의 긴장이 약해져, 한쪽은 ‘영혼’으로 남겼습니다.
  doctrine_reference: 시적 인류학과 히브리어 병행법
