id: JOB.33.18
reference: Job 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַחְשֹׂ֣ךְ נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת וְ֝/חַיָּת֗/וֹ מֵ/עֲבֹ֥ר בַּ/שָּֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
  footnotes:
  - marker: a
    text: Or 'from the grave' or 'from destruction' for 'from the pit.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may refer more specifically to 'a dart,' 'missile,' or possibly 'the sword'; the line speaks of being kept from a violent death.
    reason: lexical_alternative
  - marker: c
    text: Or 'from crossing into the weapon'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그의 영혼을 구덩이에서, 그의 생명을 무기로 인한 죽음에서 지켜 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 ‘무덤’ 또는 ‘멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 보다 직역하면 ‘무기를 지나감에서’에 가깝지만, 문맥상 폭력적 죽음을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַחְשֹׂךְ
  english_pob_choice: spares
  chosen_korean: 지켜 주십니다
  alternatives_korean:
  - 아끼십니다
  - 보존하십니다
  - 막아 주십니다
  lexicon: HALOT
  rationale: חשׂך의 ‘덜어 주다/보전하다’ 의미를 살리되, 이 문맥의 구원 행위를 자연스럽게 드러내기 위해 ‘지켜 주십니다’로 옮겼습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그 사람
  - 그의 목숨
  lexicon: HALOT
  rationale: נפש의 폭넓은 의미를 보존하기 위해 ‘영혼’을 택했고, 뒤의 ‘생명’과의 병행을 통해 인명 보존의 뜻을 드러냈습니다.
- source_word: מִנִּי שָׁחַת
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 무덤에서
  - 멸망에서
  - 심연에서
  lexicon: HALOT
  rationale: שחת은 죽음의 영역을 가리키는 ‘구덩이’로 옮겨, 시적 이미지와 죽음 회피의 의미를 함께 살렸습니다.
- source_word: בַּשָּׁלַח
  english_pob_choice: the weapon
  chosen_korean: 무기로 인한 죽음
  alternatives_korean:
  - 창으로 인한 죽음
  - 화살로 인한 죽음
  - 무기에서
  lexicon: HALOT
  rationale: שׁלח의 정확한 물건을 단정하기보다, 본문이 말하는 폭력적 죽음을 드러내기 위해 ‘무기로 인한 죽음’으로 풀었습니다.
theological_decisions:
- issue: 마지막 구의 의미 처리
  chosen_reading: ‘무기로 인한 죽음’으로 옮겨, 단순한 이동이 아니라 폭력적 죽음의 회피를 나타내게 했습니다.
  alternative_readings:
  - ‘무기를 지나감에서’
  - ‘무기 곁을 지나감에서’
  - ‘무기로부터 지나감에서’
  rationale: 히브리어 עֲבֹר בַּשָּׁלַח은 문맥상 ‘무기를 지나가다’보다 ‘무기로 죽다/죽임을 당하다’의 의미가 자연스럽기 때문에, 한국어에서는 의미를 분명히 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 시적 지혜문학의 구원 묘사
