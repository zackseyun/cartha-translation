  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I am like your mouth to God.' This may mean 'your mouthpiece/spokesman before God,' 'according to your wish before God,' or possibly 'your equal before God.'
    reason: alternative_reading
  - marker: b
    text: Or 'I too was formed from clay.' The Hebrew verb evokes being pinched off or shaped from clay.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 하나님께 당신과 같은 자입니다. 나도 진흙에서 찍혀 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '나는 하나님께 당신의 입과 같다'에 가깝습니다. 문맥상 '당신을 대신해 하나님 앞에서 말하는 자' 또는 '하나님 앞에서 당신과 같은 자'로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 동사는 흙에서 '빚어지다'보다 더 구체적으로, 진흙에서 떼어 내듯 '찍혀 나가다'는 이미지를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지로서, 현대 합쇼체에서 자연스럽게 강세를 살릴 수 있는 명령형 공손 표현을 택했습니다.
- source_word: כְפִיךָ לָאֵל
  english_pob_choice: like your mouthpiece before God
  chosen_korean: 하나님께 당신과 같은 자
  alternatives_korean:
  - 하나님 앞에서 당신의 대변자
  - 하나님께 당신의 입과 같은 자
  - 하나님 앞에서 당신과 동등한 자
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 직역상 '당신의 입처럼/입에 따라 하나님께'의 뜻을 담으므로, 해석을 과도하게 고정하지 않으면서도 문맥상 화자 자신이 욥과 같은 인간임을 드러내는 표현으로 옮겼습니다.
- source_word: קֹרַצְתִּי
  english_pob_choice: was pinched off
  chosen_korean: 찍혀 나왔습니다
  alternatives_korean:
  - 지어졌습니다
  - 빚어졌습니다
  - 형성되었습니다
  lexicon: HALOT
  rationale: 동사의 촉각적·물질적 이미지를 살려, 단순한 '형성'보다 흙에서 떼어 내듯 만들어진 느낌을 드러내는 한국어를 선택했습니다.
theological_decisions:
- issue: 욥과 하나님 앞에서의 관계를 어떻게 드러낼 것인가
  chosen_reading: 화자는 자신을 욥과 같은 피조 인간으로 제시하며, 하나님 앞에서 욥을 대신해 말할 수 있는 동류의 존재임을 강조합니다.
  alternative_readings:
  - 욥의 뜻에 따른 사람이라는 뜻
  - 욥과 하나님 앞에서 동등하다는 뜻
  rationale: 둘째 행의 '진흙에서 찍혀 나왔다'는 진술이 공통된 창조성을 분명히 하므로, 번역도 중재자 역할의 가능성은 남기되 인간적 동질성을 중심으로 유지했습니다.
  doctrine_reference: 원문이 허락하는 긴장을 보존하고, 해석을 번역 안에 과도하게 봉합하지 않습니다.
