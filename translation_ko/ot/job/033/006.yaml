  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 직역상 '당신의 입처럼/입에 따라 하나님께'의 뜻을 담으므로, 해석을 과도하게 고정하지 않으면서도 문맥상 화자 자신이 욥과 같은 인간임을 드러내는 표현으로 옮겼습니다.
