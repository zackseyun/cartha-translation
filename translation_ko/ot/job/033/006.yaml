base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I am like your mouth to God.' This may mean 'your mouthpiece/spokesman before God,' 'according to your wish before God,' or possibly 'your equal before God.'
    reason: alternative_reading
  - marker: b
    text: Or 'I too was formed from clay.' The Hebrew verb evokes being pinched off or shaped from clay.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 하나님 앞에서 당신의 입과 같습니다.[a] 나도 진흙에서 떼어 내어졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 하나님께 당신의 입과 같다’에 가깝습니다. 이는 ‘당신을 대신하여 하나님 앞에서 말하는 자’, ‘하나님 앞에서 당신과 같은 자’, 또는 ‘당신의 뜻에 따라 하나님 앞에 선 자’를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 동사는 진흙에서 무엇인가를 떼어 내거나 빚어 만드는 듯한 구체적 이미지를 띱니다. 또는 ‘진흙에서 빚어졌다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
