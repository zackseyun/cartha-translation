base_translation:
  language: en
  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
  footnotes:
  - marker: a
    text: Or 'my hand on you will not be heavy.' The Hebrew noun אַכְפִּי is difficult; a more literal rendering preserves the traditional image of a hand laid upon someone, while the main text brings out the likely sense of pressure or weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 주는 두려움이 당신을 놀라게 하지 않을 것이며, 제 손이 당신을 무겁게 누르지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 손이 당신 위에서 무겁지 않을 것입니다.’ 히브리어 אַכְפִּי의 정확한 뜻은 논란이 있습니다. 전통적으로는 ‘손’으로 이해되지만, 문맥에서는 사람에게 가해지는 압박이나 무게를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
