  text: הִנֵּ֣ה אֵ֭מָתִ/י לֹ֣א תְבַעֲתֶ֑/ךָּ וְ֝/אַכְפִּ֗/י עָלֶ֥י/ךָ לֹא יִכְבָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
  footnotes:
  - marker: a
    text: Or 'my hand on you will not be heavy.' The Hebrew noun אַכְפִּי is difficult; a more literal rendering preserves the traditional image of a hand laid upon someone, while the main text brings out the likely sense of pressure or weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제 두려움이 당신을 놀라게 하지 않을 것이며, 제 압박도 당신에게 무겁지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 손도 당신에게 무겁지 않을 것입니다.’ 히브리어 אַכְפִּי는 난해하며, 보다 직역하면 전통적 ‘손이 사람 위에 놓인’ 이미지를 살릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어의 공손한 직접 호소에 맞춰 ‘보십시오’로 옮겼습니다.
- source_word: אֵמָתִי
  english_pob_choice: my terror
  chosen_korean: 제 두려움
  alternatives_korean:
  - 제 공포
  - 제 무서움
  - 제 떨게 함
  lexicon: HALOT
  rationale: 문맥상 엘리후가 자기 존재가 주는 위압을 말하므로, 추상적 감정명사보다 ‘두려움’이 자연스럽고 의미를 보존합니다.
- source_word: אַכְפִּי
  english_pob_choice: my pressure
  chosen_korean: 제 압박
  alternatives_korean:
  - 제 손
  - 제 무게
  - 제 손의 압력
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, POB의 영어 판단처럼 ‘무게/압박’의 의미를 살려 직접적 압박감을 드러내는 쪽이 본문 흐름에 더 적합합니다.
- source_word: יִכְבָּד
  english_pob_choice: will not be heavy
  chosen_korean: 무겁지 않을 것입니다
  alternatives_korean:
  - 무겁게 느껴지지 않을 것입니다
  - 무겁게 지지 않을 것입니다
  lexicon: HALOT
  rationale: ‘heavy’의 핵심 이미지를 살리되, 한국어에서는 상태형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 엘리후의 발화가 위협이 아니라 위로로 기능하는지
  chosen_reading: 본문은 엘리후가 욥에게 자신이 두렵게 하거나 짓누르지 않겠다고 안심시키는 말로 읽었습니다.
  alternative_readings:
  - 엘리후의 권위적 압박을 암시하는 말로 읽기
  - ‘손’ 이미지가 실제 신체 접촉의 은유라고 보기
  rationale: 히브리어 동사와 POB의 문맥 판단 모두 reassurance를 지지하므로, 위협보다 ‘두려움/압박이 아니다’는 뜻을 분명히 했습니다.
  doctrine_reference: 문맥 주해; 히브리어 시적 평행법
- issue: אַכְפִּי의 난해성 처리
  chosen_reading: ‘손’으로 단정하지 않고 ‘압박’으로 옮겼습니다.
  alternative_readings:
  - ‘제 손’으로 직역하기
  - ‘제 무게’로 번역하기
  rationale: 이 단어는 전통적으로 ‘손’으로도 이해되지만, 본문에서는 뒤의 ‘무겁다’와 결합하여 압박의 은유가 더 분명하므로 의미 중심 번역을 택했습니다.
  doctrine_reference: 문맥 주해; 사전학적 난제
