  source_fidelity: 첫 행의 ‘사람을 그 행위에서 돌이키시고’는 לְהָסִיר אָדָם מַעֲשֶׂה의 문맥적 해석을 충실히 반영합니다. 둘째 행은 וְגֵוָה מִגֶּבֶר יְכַסֶּה의 압축성과 ‘덮다/감추다’의 은유를 유지하되, 기존의 ‘가리려 하십니다’보다 ‘감추시려 하십니다’가 더 자연스럽고 정확합니다.
  naturalness: ‘강한 사람’은 한국어 성경 문맥에서 다소 직역투이므로 ‘힘센 사람’이 더 자연스럽습니다. 또한 ‘교만을 가리다’는 한국어에서 뜻이 불분명하거나 물리적으로 가리는 의미로 읽히기 쉬워 ‘교만을 감추다’가 적절합니다.
  terminology: ‘행위’와 ‘교만’은 적절합니다. גֶּבֶר의 힘·기력의 뉘앙스를 과도하게 확대하지 않으면서 반영하기 위해 ‘힘센 사람’을 사용합니다. ‘감추다’는 כָּסָה의 구체적 은유를 보존합니다.
  issues:
  - severity: medium
    issue: ‘교만을 가리려 하십니다’는 한국어 의미가 불명확합니다.
    rationale: ‘가리다’는 시야를 막거나 구별한다는 뜻으로도 흔히 쓰여, 여기서 כָּסָה의 ‘덮다/감추다’ 은유를 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: ‘강한 사람’은 다소 부자연스러운 직역투입니다.
    rationale: גֶּבֶר의 뉘앙스는 살릴 수 있으나, 현대 표준 한국어에서는 ‘힘센 사람’이 더 자연스럽습니다.
