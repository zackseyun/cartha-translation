source:
  edition: WLC
  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
  footnotes:
  - marker: a
    text: Or, more literally, 'to remove a man's deed, and he covers pride from a man.' The Hebrew is compressed, and the line may be understood either as turning a man away from his action or as removing the deed itself from him.
    reason: alternative_reading
translation:
  language: ko
  text: 사람을 그 행위에서 돌이키고, 힘센 사람에게서 교만을 감추시려 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축되어 있어, 더 문자적으로는 ‘사람의 행위를 제거하고, 사람에게서 교만을 감추다’로도 읽을 수 있습니다. 첫 행은 사람을 그 행위에서 돌이키게 하신다는 뜻으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  english_pob_choice: to turn ... from
  chosen_korean: 돌이키고
  alternatives_korean:
  - 제거하고
  - 돌려
  - 돌이켜
  lexicon: HALOT
  rationale: 히필 부정사로서 ‘~에서 돌이켜 떠나게 하다’는 사역적 의미가 강하므로, 한국어에서는 관계를 자연스럽게 살리는 ‘돌이키고’가 가장 적절합니다.
- source_word: מַעֲשֶׂה
  english_pob_choice: his deed
  chosen_korean: 그의 행위에서
  alternatives_korean:
  - 그의 일에서
  - 그의 행동에서
  - 그의 행위로부터
  lexicon: HALOT
  rationale: 문맥상 도덕적·행위적 의미가 핵심이므로 ‘행위’로 옮겼고, 히브리어의 압축된 소유 의미는 자연스럽게 ‘그의’로 반영했습니다.
- source_word: וְגֵוָה
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 자만
  - 오만
  - 거만
  lexicon: HALOT
  rationale: 이 단어는 부정적 ‘높아짐/우쭐함’을 가리키므로, 한국어 성경어에서 가장 직접적으로 대응하는 ‘교만’을 택했습니다.
- source_word: מִגֶּבֶר
  english_pob_choice: from a strong man
  chosen_korean: 강한 사람에게서
  alternatives_korean:
  - 사람에게서
  - 용사에게서
  - 장부에게서
  lexicon: HALOT
  rationale: גֶּבֶר가 אָדָם과 대조되어 ‘힘 있는 사람/장부’의 뉘앙스를 주므로, 두 병렬을 살리기 위해 ‘강한 사람’으로 옮겼습니다.
- source_word: יְכַסֶּה
  english_pob_choice: to cover
  chosen_korean: 가리려 하십니다
  alternatives_korean:
  - 덮으려 하십니다
  - 숨기려 하십니다
  - 가리십니다
  lexicon: HALOT
  rationale: ‘cover’의 구체적 은유를 살리되 한국어에서 자연스럽게 목적/결과를 드러내도록 ‘가리려 하십니다’로 옮겼습니다.
theological_decisions:
- issue: 압축된 히브리어 병행구의 해석
  chosen_reading: 하나님은 사람을 그의 잘못된 행위에서 돌이키게 하시고, 강한 사람 안의 교만을 가리려 하십니다.
  alternative_readings:
  - 사람의 행위를 그에게서 제거하시고, 사람에게서 교만을 가리십니다.
  rationale: 문맥(33:14–18)상 엘리후는 하나님의 경고가 사람을 죄와 교만에서 멀어지게 하신다는 뜻으로 설명하므로, 과도한 직역보다 문맥을 살린 번역을 택하되, 더 문자적인 가능성은 본문 각주로 남깁니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
