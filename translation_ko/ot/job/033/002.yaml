lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오 이제
  - 자
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사와 긴급한 호소를 한국어 합쇼체의 직접 호소로 옮겼습니다. '보라'보다 현대적이고, '이제'를 덧붙이는 것은 영어 POB의 운율을 불필요하게 늘립니다.
- source_word: פָּתַחְתִּי פִי
  english_pob_choice: I have opened my mouth
  chosen_korean: 제가 입을 열었습니다
  alternatives_korean:
  - 내가 입을 열었습니다
  - 내가 말을 시작했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 이해되도록 '입을 열다'를 유지했습니다. '말을 시작했습니다'는 의미는 분명하지만 원문의 표현력을 다소 평준화합니다.
- source_word: דִּבְּרָה לְשׁוֹנִי
  english_pob_choice: my tongue speaks
  chosen_korean: 제 혀가 … 말합니다
  alternatives_korean:
  - 제 혀가 … 이야기합니다
  - 제 혀가 … 말하였습니다
  lexicon: HALOT
  rationale: 혀를 말하는 주어로 둔 시적 병행을 살려 '제 혀가'를 주어로 옮겼습니다. 영어 POB의 현재형을 따라 현재형 '말합니다'를 택해 장면의 생동감을 보존했습니다.
- source_word: בְחִכִּי
  english_pob_choice: in my palate
  chosen_korean: 제 입천장에서
  alternatives_korean:
  - 제 입안에서
  - 제 입천정에서
  - 제 입에서
  lexicon: HALOT
  rationale: חֵךְ는 문자적으로 입천장/입천정이므로, 한국어에서 가장 구체적인 해부학적 대응인 '입천장'을 선택했습니다. 원문의 다소 이례적이고 생생한 이미지를 희석하지 않기 위해 일반적인 '입'보다 더 직접적으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 시구의 마지막 절이 의도적으로 다소 비정상적이고 생생한 표현이라는 점
  chosen_reading: '''제 혀가 제 입천장에서 말합니다''로 유지해, 원문의 기이한 시적 이미지를 매끈하게 풀어쓰지 않았습니다.'
  alternative_readings:
  - '''제 혀가 제 입에서 말합니다'''
  - '''제 혀가 말하기 시작합니다'''
  rationale: POB의 주석이 지적하듯 이 절은 매우 생생하고 다소 특이합니다. 따라서 한국어도 익숙한 관용으로 완전히 평준화하지 않고, 원문의 낯선 이미지와 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 시적 표현의 보존과 원문 형상 유지
