  lexicon: HALOT
  rationale: מֹסָר는 ‘instruction, correction, discipline, warning’의 범위를 가지며, 본문에서는 하나님이 사람에게 새겨 넣으시는 내용이라는 점을 살려 ‘교훈’으로 옮겼습니다.
- source_word: יַחְתֹּם
  english_pob_choice: seals
  chosen_korean: 인치십니다
  alternatives_korean:
  - 봉인하십니다
  - 새겨 두십니다
  lexicon: HALOT
  rationale: ‘seal’의 이미지와 고정·확증의 뉘앙스를 함께 살릴 수 있는 성경적 표현으로 ‘인치십니다’를 택했습니다.
theological_decisions:
- issue: 하나님이 사람의 내면에 말씀을 새기시는 동작의 표현
  chosen_reading: 하나님이 귀를 여실 뿐 아니라 그들에게 주어진 교훈을 확정적으로 새겨 두시는 것으로 번역했습니다.
  alternative_readings:
  - 하나님이 단지 경고를 봉인하신다는 식의 번역
  - 하나님이 외적 소통을 차단하신다는 식의 번역
  rationale: 문맥은 계시를 통해 사람을 경고하고 돌이키게 하는 장면이므로, ‘인치십니다’로 확증과 내적 각인을 함께 드러내는 것이 본문 의도에 부합합니다.
  doctrine_reference: 하나님의 계시와 내적 교훈
