  - 귀를 열어 주시고
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 듣도록 하게 하시는 것이므로, 직역보다 의미를 살린 ‘귀를 여시고’가 가장 직접적입니다.
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들의
  alternatives_korean:
  - 사람의
  - 인간의
  lexicon: HALOT
  rationale: 일반적인 인간들을 가리키는 복수 표현이므로, 한국어에서는 대표적 집합 표현인 ‘사람들의’로 자연스럽게 살렸습니다.
- source_word: וּבְמֹסָרָם
  english_pob_choice: their instruction
  chosen_korean: 그들의 교훈
  alternatives_korean:
  - 그들의 훈계
  - 그들의 징계
