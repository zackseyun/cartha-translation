    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: then
  chosen_korean: 그때
  alternatives_korean:
  - 그러면
  - 그리하여
  lexicon: HALOT
  rationale: 앞 절의 꿈과 환상 속 하나님의 말씀 흐름을 이어 주는 시간 부사이므로, 현대 한국어에서 자연스러운 ‘그때’로 옮겼습니다.
- source_word: יִגְלֶה אֹזֶן
  english_pob_choice: opens the ears
  chosen_korean: 귀를 여시고
  alternatives_korean:
