  source_fidelity: ‘귀를 여시고’는 יִגְלֶה אֹזֶן의 관용적 의미를 정확히 전달합니다. 다만 חתם은 여기서 교훈을 확정하거나 마음에 새기는 비유이며, ‘인치다’는 현대 한국어에서 지나치게 교회적·전문적이고 성령의 인침과 같은 신학적 연상을 불러올 수 있습니다. 문맥상 하나님이 앞 절들에서 말씀하시는 분임은 분명하지만, 히브리어 본문에는 명시 명사가 없으므로 한국어에서도 주어를 생략할 수 있습니다.
  naturalness: ‘그들의 교훈을 인치십니다’는 현대 표준어로 다소 부자연스럽고 ‘인치다’의 일반적 용례와도 거리가 있습니다. ‘그들의 교훈을 새겨 두십니다’는 봉인 이미지가 지닌 확정·각인의 뜻을 자연스러운 현대 합쇼체로 전달합니다.
