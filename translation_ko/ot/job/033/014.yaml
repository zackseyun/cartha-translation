base_translation:
  language: en
  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
  footnotes:
  - marker: a
    text: Or 'For God speaks once, and twice, yet one does not notice it.' The Hebrew numbers may be taken adverbially ('once... twice') or idiomatically ('in one way... and in two').
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 하나님은 한 가지 방식으로 말씀하시고, 또 두 가지로도 말씀하시지만, 사람은 그것을 알아차리지 못하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 가지 방식으로… 또 두 가지로도’는 히브리어 수사를 회화적으로 풀어 옮긴 것입니다. 직역하면 ‘한 번… 두 번’으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - 곧
  lexicon: HALOT
  rationale: 문맥상 엘리후의 설명을 여는 인과·설명 접속으로 기능하므로, 자연스러운 현대 한국어 설명형 접속사로 옮겼습니다.
- source_word: בְאַחַת / וּבִשְׁתַּיִם
  english_pob_choice: in one way / and in two
  chosen_korean: 한 가지 방식으로 / 또 두 가지로도
  alternatives_korean:
  - 한 번 / 두 번
  - 한 가지로 / 둘로
  lexicon: HALOT
  rationale: 히브리어의 수사적 평행을 살리기 위해 단순 횟수보다 ‘방식’의 뉘앙스를 드러냈고, 뒤의 ‘두 가지로도’는 반복적·다양한 전달 방식을 자연스럽게 반영합니다.
- source_word: יְדַבֶּר אֵל
  english_pob_choice: God speaks
  chosen_korean: 하나님은 … 말씀하시고
  alternatives_korean:
  - 하나님이 … 말씀하십니다
  - 하나님은 … 말하십니다
  lexicon: HALOT
  rationale: אֵל을 본문 맥락에 따라 ‘하나님’으로 두고, דב״ר는 단순한 ‘말하다’보다 계시적·권위적 발화를 드러내는 ‘말씀하시다’로 옮겼습니다.
- source_word: יְשׁוּרֶנָּה
  english_pob_choice: one does not perceive it
  chosen_korean: 사람은 그것을 알아차리지 못하기
  alternatives_korean:
  - 사람은 그것을 보지 못하기
  - 사람은 그것을 인식하지 못하기
  lexicon: HALOT
  rationale: שור의 ‘보다/지각하다’ 의미를 살리되, 하나님의 말씀을 알아보지 못하는 인지 실패를 한국어로 자연스럽게 드러내기 위해 ‘알아차리다’를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 일반적 인간 주어
  chosen_reading: ‘사람은’으로 일반적 인간을 드러내되, 성별을 특정하지 않는 포괄적 표현으로 처리했습니다.
  alternative_readings:
  - ‘그는’
  - ‘누구도’
  rationale: 히브리어의 암시적 3인칭 단수 주어를 과도하게 성별화하지 않으면서도, 일반적 인간이 하나님의 말씀을 인지하지 못한다는 뜻을 유지합니다.
  doctrine_reference: Translation philosophy §4
