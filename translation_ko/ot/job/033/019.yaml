translation:
  language: ko
  text: 그는 또한 침상에서 고통으로 책망을 받고, 그의 뼈에는 끊임없는 다툼이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형용사 אֵתָן은 ‘끊임없는’ 또는 ‘지속적인’뿐 아니라 ‘강한’ 또는 ‘힘센’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  english_pob_choice: He is also reproved
  chosen_korean: 책망을 받으며
  alternatives_korean:
  - 교정을 받으며
  - 징계를 받으며
  - 꾸지람을 받으며
  lexicon: HALOT
  rationale: Hophal של יכח는 ‘책망/교정/징계받다’의 수동적 의미를 가지므로, 여기서는 고통을 통해 주어지는 교정적 책망을 살려 ‘책망을 받으며’로 옮겼습니다. ‘also’는 앞 절과의 연결을 자연스럽게 드러내는 ‘-며’로 반영했습니다.
- source_word: בְּמַכְאוֹב
  english_pob_choice: with pain
  chosen_korean: 고통으로
  alternatives_korean:
  - 고통과 함께
  - 고통 가운데
  - 아픔으로
  lexicon: HALOT
  rationale: מַכְאוֹב는 육체적 고통을 가리키므로, 한국어에서는 ‘고통으로’가 도구·매개 의미를 자연스럽게 살리면서도 몸의 고통을 분명히 드러냅니다.
- source_word: וְרִיב עֲצָמָיו אֵתָן
  english_pob_choice: with continual strife in his bones
  chosen_korean: 뼈에는 끊임없는 다툼이 있습니다
  alternatives_korean:
  - 뼈에는 계속되는 다툼이 있습니다
  - 뼈 속에는 지속되는 다툼이 있습니다
  - 뼈에는 강한 다툼이 있습니다
  lexicon: HALOT
  rationale: רִיב는 ‘다툼/분쟁/갈등’의 뜻이지만 여기서는 뼈에 비유된 내적·신체적 격통을 가리키므로 ‘다툼’으로 살렸습니다. אֵתָן은 ‘끊임없는/지속적인’의 의미가 문맥상 가장 자연스러워 본문에는 ‘끊임없는’으로 두었습니다.
theological_decisions:
- issue: 고통의 신학적 기능
  chosen_reading: 이 절은 고통을 하나님의 책망 수단으로 제시하지만, 그것을 곧바로 전면적인 형벌 교리로 확정하지는 않습니다.
  alternative_readings:
  - 고통은 단순한 자연적 질병이다
  - 고통은 곧바로 징벌적 심판이다
  rationale: 엘리후의 논지 안에서 고통은 하나님이 사람에게 말씀하시는 방식이므로, ‘책망을 받다’로 옮겨 교정적 의미를 보존하되, 본문이 허용하는 범위를 넘어 형벌로 단정하지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장을 그대로 보존합니다.
