source:
  edition: WLC
  text: יֹֽשֶׁר לִבִּ֥/י אֲמָרָ֑/י וְ/דַ֥עַת שְׂ֝פָתַ֗/י בָּר֥וּר מִלֵּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
  footnotes:
  - marker: a
    text: Or 'my lips utter pure knowledge' or 'my lips speak plainly what they know.' The Hebrew term rendered 'clearly' can also carry the sense of purity or plainness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 마음의 정직함이 내 말에 있고, 내 입술은 지식을 분명하게 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분명하게’는 여기서 ‘순수하게’, ‘명료하게’, 또는 ‘자기가 아는 바를 분명히’라는 뜻을 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  english_pob_choice: uprightness
  chosen_korean: 정직함
  alternatives_korean:
  - 올바름
  - 바름
  - 의로움
  lexicon: HALOT
  rationale: 문맥상 마음의 도덕적 바름을 가리키므로, 직역적인 ‘곧음’보다 인격적 성실성을 드러내는 ‘정직함’이 자연스럽습니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 속
  - 내 심중
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 생각과 의지를 포함하는 내면 전체를 가리키므로, 한국어에서도 관용적이면서도 의미를 보존하는 ‘내 마음’으로 옮겼습니다.
- source_word: בָּרוּר
  english_pob_choice: clearly
  chosen_korean: 분명하게
  alternatives_korean:
  - 깨끗하게
  - 맑게
  - 명백하게
  lexicon: HALOT
  rationale: 이 단어는 명료함과 순수함의 뉘앙스를 함께 가질 수 있지만, 여기서는 입술의 말하기를 수식하므로 ‘분명하게’가 가장 직접적으로 담습니다.
- source_word: מִלֵּלוּ
  english_pob_choice: speak
  chosen_korean: 말합니다
  alternatives_korean:
  - 발합니다
  - 읊습니다
  - 전합니다
  lexicon: HALOT
  rationale: 시적 병행구에서 단순한 발화 행위를 나타내므로, 현대 한국어에서 가장 자연스럽고 중립적인 ‘말합니다’를 택했습니다.
theological_decisions:
- issue: 시적 병행에서 ‘my heart / my lips’의 대비를 어떻게 살릴지
  chosen_reading: ‘내 마음… 내 입술…’로 병행 구조를 유지했습니다.
  alternative_readings:
  - ‘내 속… 내 말…’로 의미를 풀어 쓰는 방식
  - 두 구를 하나로 묶어 문장화하는 방식
  rationale: 본문은 내면의 정직함과 외적 발화의 지식을 평행시켜 자기 변호를 구성하므로, 대응 구조를 한국어에서도 보존하는 것이 신학적·문학적으로 중요합니다.
  doctrine_reference: 시편/지혜문학의 내적 진실성과 언어의 일치
