base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
  footnotes:
  - marker: a
    text: Or 'to the grave' or 'to destruction' for 'the pit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to the dead' or 'to death-dealers'; the Hebrew expression is difficult and may refer either to agents of death or to the realm/powers of death.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 영혼은 구덩이[a]에 다가가고, 그의 생명은 죽음을 가져오는 자들에게[b] 다가갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’이나 ‘멸망’으로 옮길 수 있습니다. 여기서 ‘구덩이’는 히브리어의 구체적인 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽은 자들’로, 또는 ‘죽음의 영역이나 세력’으로 이해할 수 있습니다. 히브리어 표현은 어려우며, 죽음을 초래하는 주체를 가리키는지 죽음과 관련된 영역 또는 세력을 가리키는지는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  english_pob_choice: draws near
  chosen_korean: 가까워집니다
  alternatives_korean:
  - 다가옵니다
  - 가까이 갑니다
  lexicon: HALOT
  rationale: 시적 문맥에서 קרב의 ‘가까워지다/다가오다’ 의미를 자연스럽게 살리되, 한국어에서는 현재형 종결로 압박감을 전달했습니다.
- source_word: לַשַּׁחַת
  english_pob_choice: to the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 무덤
  - 멸망
  lexicon: HALOT
  rationale: שַׁחַת의 구체적 이미지인 ‘pit’을 우선 살렸습니다. ‘무덤’은 해석을 좁히고, ‘멸망’은 은유를 추상화하므로 기본 본문은 ‘구덩이’가 더 적절합니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그의 존재
  lexicon: HALOT
  rationale: 네페쉬의 넓은 의미를 유지하면서도 다음 절과의 평행을 위해 ‘영혼’을 택했습니다. 다만 이는 영혼/육체를 교리적으로 규정하려는 의도는 아닙니다.
- source_word: לַמְמִתִים
  english_pob_choice: to those who bring death
  chosen_korean: 죽음을 가져오는 자들
  alternatives_korean:
  - 죽이는 자들
  - 처형하는 자들
  - 죽은 자들
  lexicon: HALOT
  rationale: 문자적으로는 ‘죽게 만드는 자들/죽음을 초래하는 자들’에 가까워, 인간 실행자에 한정하지 않도록 ‘죽음을 가져오는 자들’로 옮겼습니다. 영어 POB가 보존한 해석상의 난점을 그대로 반영합니다.
theological_decisions:
- issue: נַפְשׁוֹ와 וְחַיָּתוֹ의 병행이 인간 구성에 대해 주는 함의
  chosen_reading: ‘영혼’과 ‘생명’을 구분해 번역하되, 이를 몸-영혼 이원론으로 단정하지 않도록 했습니다.
  alternative_readings:
  - 둘 다 ‘생명’ 계열로 평평하게 옮기기
  - ‘영혼’을 비물질 실체로 교리화하기
  rationale: 본문은 시적 평행법을 사용하므로 어휘 차이를 살리되, 그 차이를 교리적 체계로 과잉해석하지 않는 것이 원문에 충실합니다.
  doctrine_reference: 시적 평행법과 인간론의 긴장을 보존
