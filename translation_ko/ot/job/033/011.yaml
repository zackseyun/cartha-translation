source:
  edition: WLC
  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
  footnotes:
  - marker: a
    text: Or 'He guards all my paths.' The Hebrew verb can mean either watch over or guard; here the context favors hostile scrutiny rather than protection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내 발을 차꼬에 넣으시고, 내 모든 길을 감시하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 내 모든 길을 지키십니다.’ 히브리어 동사는 ‘지키다’와 ‘감시하다’ 모두로 옮길 수 있으나, 여기서는 문맥상 보호보다 적대적으로 주시하는 뜻이 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  english_pob_choice: puts
  chosen_korean: 넣으시고
  alternatives_korean:
  - 두시고
  - 놓으시고
  - 차시고
  lexicon: HALOT
  rationale: 발을 가두는 구체적 장면이므로 단순한 ‘두다’보다, 차꼬에 실제로 발을 넣어 구속하는 동작을 드러내는 ‘넣으시고’가 자연스럽습니다.
- source_word: בַּסַּד
  english_pob_choice: in the stocks
  chosen_korean: 차꼬에
  alternatives_korean:
  - 족쇄에
  - 굴레에
  - 붙들림에
  lexicon: HALOT
  rationale: סַד는 발을 가두는 구속 도구이므로 한국어 성경어휘 중 ‘차꼬’가 가장 직접적으로 대응합니다.
- source_word: יִשְׁמֹר
  english_pob_choice: he watches
  chosen_korean: 살피십니다
  alternatives_korean:
  - 지키십니다
  - 감시하십니다
  - 주시합니다
  lexicon: HALOT
  rationale: 문맥상 보호보다 감시·주목의 뉘앙스가 강하므로, 보호적 의미를 덜 띠는 ‘살피다’로 긴장을 살렸습니다.
- source_word: אָרְחֹתַי
  english_pob_choice: my paths
  chosen_korean: 내 모든 길
  alternatives_korean:
  - 내 길들
  - 내 행로
  - 내 발자취
  lexicon: HALOT
  rationale: אָרַח의 비유적 의미를 한국어에서 가장 자연스럽게 전달하는 표현은 ‘길’이며, כָּל을 반영해 ‘모든’을 살렸습니다.
theological_decisions:
- issue: יִשְׁמֹר의 뉘앙스가 보호인지 감시인지
  chosen_reading: 여기서는 보호가 아니라, 억압적이고 심문하듯 살피는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 지키십니다
  - 보호하십니다
  rationale: English POB audit trail이 이 절을 하나님의 호의적 보호가 아니라 적대적 감시로 읽도록 지시하므로, 그 긴장을 한국어에서도 해소하지 않았습니다.
  doctrine_reference: 원문이 드러내는 신학적 긴장을 보존하고, 번역이 그 의미를 미리 조정하지 않도록 합니다.
