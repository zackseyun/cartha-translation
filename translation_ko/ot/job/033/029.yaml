  source_fidelity: 본문의 ‘보십시오’, ‘이 모든 일’, ‘두세 번’, ‘한 사람’은 히브리어 הֶן, כָּל־אֵלֶּה, פַּעֲמַיִם שָׁלֹשׁ, גָּבֶר의 의미를 대체로 충실히 반영합니다. עִם은 여기서 하나님이 사람을 상대로 행하시는 일을 나타내므로 ‘한 사람에게’는 자연스럽고 적절합니다.
  naturalness: ‘보십시오, 하나님은 이 모든 일을 한 사람에게 두세 번 하십니다’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 각주가 본문의 ‘한 사람에게’를 ‘한 사람과 함께’로 바꾸어 제시하면서 의미 관계를 부정확하게 설명합니다.
  terminology: ‘하나님’, ‘한 사람’, ‘두세 번’은 문맥과 현대 한국어에 적절합니다. גָּבֶר의 대표적 단수 용법은 본문에서 ‘한 사람’으로 무리 없이 전달할 수 있으며, 각주에서는 문자적 남성형을 오해 없이 설명할 수 있습니다.
  issues:
