    rationale: 이 절의 עִם은 하나님이 한 사람을 상대로 행하시는 일을 나타내며, 한국어 본문의 ‘한 사람에게’가 문맥상 적절합니다. ‘한 사람과 함께’는 하나님과 사람이 함께 그 일을 한다는 인상을 줄 수 있어 본문의 뜻을 잘못 전달합니다. 각주는 גָּבֶר의 대표적 남성 단수를 설명하는 방식으로 고쳐야 합니다.
