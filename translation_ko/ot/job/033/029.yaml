  rationale: 히브리어의 반복적 관용구를 한국어의 통상적 표현인 '두세 번'으로 옮겨 의미와 리듬을 살렸습니다.
- source_word: גָּבֶר
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
