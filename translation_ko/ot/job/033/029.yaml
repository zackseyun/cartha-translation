  - 한 인간
  lexicon: HALOT
  rationale: 영어 POB의 대표적 단수 표현을 한국어에서는 성별을 과도하게 드러내지 않는 '한 사람'으로 옮겨, 일반적 인간을 가리키는 문맥을 살렸습니다.
theological_decisions:
- issue: 대표 단수 גָּבֶר의 한국어 처리
  chosen_reading: 한 사람
  alternative_readings:
  - 한 남자
  - 사람에게
  rationale: 본문은 대표 단수로서의 인간을 가리키므로, 직역적 '남자'보다 문맥적 포괄성이 살아 있는 '한 사람'을 본문에 두었습니다. 성별 표지를 약화시키는 해석이지만, 한국어 독자에게는 원문의 일반적 적용 범위를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
