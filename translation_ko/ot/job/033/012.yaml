id: JOB.33.12
reference: Job 33:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
  footnotes:
  - marker: a
    text: Or 'than a mortal.' The Hebrew אֱנוֹשׁ often highlights human frailty.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 이 점에서 당신은 옳지 않습니다. 제가 당신에게 답하겠습니다. 이는 하나님이 사람보다 더 크시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 여기서 אֱנוֹשׁ의 일반적 인간성을 따른 번역입니다. 더 문자적인 뉘앙스로는 ‘죽을 인간/유한한 인간’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 주의하십시오
  lexicon: HALOT
  rationale: 담화 전환과 주의를 끄는 감탄어로서, 현대 합쇼체에서는 ‘보십시오’가 자연스럽고 원문의 촉구성을 살립니다.
- source_word: לֹא צָדַקְתָּ
  english_pob_choice: you are not right
  chosen_korean: 옳지 않습니다
  alternatives_korean:
  - 옳지 않으십니다
  - 정당하지 않습니다
  - 의롭지 않습니다
  lexicon: HALOT
  rationale: 여기서는 משפט적·논변적 맥락의 ‘옳다/옳지 않다’가 핵심이므로, 도덕적 의로움을 강하게 띠는 ‘의롭다’보다 논지상 판단을 드러내는 표현이 적절합니다.
- source_word: אֶעֱנֶךָּ
  english_pob_choice: I will answer you
  chosen_korean: 제가 당신에게 답하겠습니다
  alternatives_korean:
  - 제가 당신에게 대답하겠습니다
  - 제가 당신에게 응답하겠습니다
  lexicon: HALOT
  rationale: 미완료형 1인칭이 미래적 응답을 나타내므로, 문맥에 맞게 자연스러운 예고형으로 옮겼습니다.
- source_word: יִרְבֶּה אֱלֹהַ מֵאֱנוֹשׁ
  english_pob_choice: God is greater than man
  chosen_korean: 하나님이 사람보다 더 크시기 때문입니다
  alternatives_korean:
  - 하나님이 사람보다 크시기 때문입니다
  - 하나님이 한 사람보다 더 크시기 때문입니다
  - 하나님이 인간보다 더 크시기 때문입니다
  lexicon: HALOT
  rationale: רבה의 비교 용법은 단순한 수량 증가가 아니라 우월성/더 큼을 뜻하므로 ‘더 크시다’로 옮겼고, אֱנוֹשׁ의 일반적 인간성을 ‘사람’으로 간결하게 살렸습니다.
theological_decisions:
- issue: אֱנוֹשׁ의 인간 지칭을 어떻게 한국어로 살릴지
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 죽을 인간
  - 한 사람
  rationale: 본문의 대조는 하나님과 유한한 인간 사이의 일반적 대비입니다. ‘사람’은 원문의 단수 일반성을 유지하면서도 현대 한국어에서 가장 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
