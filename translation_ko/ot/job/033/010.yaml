theological_decisions:
- issue: 하나님을 향한 욥의 অভিযোগ적 진술을 어떻게 보존할 것인가
  chosen_reading: 욥이 하나님께서 자신을 적대적으로 대하신다고 느끼는 진술을 그대로 살려, 신학적으로 완화하지 않았습니다.
  alternative_readings:
  - ‘하나님이 저에게 적대의 근거를 찾으십니다’처럼 더 완곡하게 처리
  - ‘하나님이 저를 원수로 삼으십니다’처럼 단정적으로 강화
  rationale: 이 절은 욥의 체감된 অভিযোগ을 보고하는 문맥이므로, 본문의 긴장을 해소하지 않고 그대로 드러내는 것이 source-grounded 번역에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
