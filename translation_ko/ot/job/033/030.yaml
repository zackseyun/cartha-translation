id: JOB.33.30
reference: Job 33:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
  footnotes:
  - marker: a
    text: Or 'his life' for 'his soul'; Hebrew nephesh can mean soul, life, or self.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the grave' or 'from destruction' for 'from the pit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to see the light' or 'to be brought to the light.' The Hebrew is compact and poetic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영혼을 구덩이에서 다시 데려오시고, 그가 생명의 빛으로 빛을 받게 하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’은 여기서 ‘생명’ 또는 ‘그 자신’으로도 옮길 수 있습니다. 히브리어 nephesh는 여러 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구덩이’는 ‘무덤’ 또는 ‘멸망’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 매우 압축적이어서 ‘빛을 보게 하다’ 또는 ‘빛으로 인도하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  english_pob_choice: to bring back
  chosen_korean: 다시 데려오시고
  alternatives_korean:
  - 돌이키시고
  - 회복시키시고
  lexicon: HALOT
  rationale: 사역적 שוב의 ‘다시 돌아오게 하다’라는 구체적 방향성을 살리면서, 한국어로는 자연스럽게 ‘데려오다’가 적절합니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그 자신
  lexicon: HALOT
  rationale: נפש의 생명/자기 자신 의미를 배제하지 않되, 여기서는 ‘구덩이’와 ‘생명의 빛’ 사이에서 인간 내면 전체를 가리키는 표현으로 ‘영혼’이 가장 무난합니다.
- source_word: מִנִּי שָׁחַת
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 무덤에서
  - 멸망에서
  lexicon: HALOT
  rationale: 시적 이미지인 שחת를 문자적으로 살려 ‘구덩이’로 옮겼습니다. 이는 영어 POB의 ‘the pit’과도 대응합니다.
- source_word: לֵאוֹר בְּאוֹר הַחַיִּים
  english_pob_choice: that he may be enlightened with the light of life
  chosen_korean: 생명의 빛으로 빛을 받게 하십니다
  alternatives_korean:
  - 생명의 빛으로 비추임을 받게 하십니다
  - 생명의 빛을 보게 하십니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 이중 표현을 한국어에서 ‘빛을 받다’로 풀어, ‘오로라/계몽’의 개념보다 빛의 이미지와 결과를 함께 살렸습니다.
theological_decisions:
- issue: ס목적절의 동사성 표현
  chosen_reading: 두 번째 절을 ‘빛을 받게 하십니다’로 번역해, 구원 후 조명/회복의 결과를 드러냈습니다.
  alternative_readings:
  - ‘보게 하십니다’
  - ‘비추임을 받게 하십니다’
  rationale: 히브리어는 매우 압축되어 있어 단순한 직역보다 목적과 결과를 드러내는 동사화가 본문의 의미를 더 잘 전달합니다.
  doctrine_reference: 문맥상 하나님이 생명 회복과 조명을 주시는 분이라는 지혜문학적 구원 이해
