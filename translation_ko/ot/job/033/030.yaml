base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
  footnotes:
  - marker: a
    text: Or 'his life' for 'his soul'; Hebrew nephesh can mean soul, life, or self.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the grave' or 'from destruction' for 'from the pit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to see the light' or 'to be brought to the light.' The Hebrew is compact and poetic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영혼을 구덩이에서 되돌려, 생명의 빛으로 그를 비추시려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’은 여기서 ‘생명’ 또는 ‘그 자신’으로도 옮길 수 있습니다. 히브리어 네페쉬는 여러 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구덩이’는 ‘무덤’ 또는 ‘멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 압축적이어서 ‘생명의 빛을 보게 하시려는 것입니다’ 또는 ‘빛으로 인도하시려는 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
