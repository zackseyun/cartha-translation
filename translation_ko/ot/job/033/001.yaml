  text: וְֽ/אוּלָ֗ם שְׁמַֽע נָ֣א אִיּ֣וֹב מִלָּ֑/י וְֽ/כָל דְּבָרַ֥/י הַאֲזִֽינָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
  footnotes:
  - marker: a
    text: Or 'give ear to all my words.' The Hebrew uses two near-parallel expressions ('my words' / 'my speech') and two hearing verbs for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제, 욥이여, 내 말을 들으십시오. 나의 모든 말을 귀 기울여 들으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 말’과 ‘나의 모든 말’은 히브리어의 כמעט 동의적 병행을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 하지만 이제
  - 그런데 이제
  - 그러나 지금
  lexicon: HALOT
  rationale: 대화의 전환을 나타내는 וְאוּלָם의 반전감과 호소의 현재성을 함께 살려 자연스러운 표준어로 옮겼습니다.
- source_word: שְׁמַע
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어 주십시오
  - 들어 보십시오
  lexicon: HALOT
  rationale: 직접 호소하는 명령형이므로 합쇼체로 정중하게 옮겼고, 단순 청취보다 ‘말을 받아들여 주의 깊게 듣다’는 뉘앙스를 살렸습니다.
- source_word: מִלָּי / דְּבָרַי
  english_pob_choice: my words / my speech
  chosen_korean: 내 말 / 나의 모든 말
  alternatives_korean:
  - 내 이야기 / 내 발언
  - 내가 하는 말 / 나의 말들
  lexicon: HALOT
  rationale: 두 유사 표현의 병행을 한국어에서도 살려, 첫째는 ‘내 말’, 둘째는 ‘나의 모든 말’로 대응해 강조와 포괄성을 함께 드러냈습니다.
- source_word: הַאֲזִינָה
  english_pob_choice: listen to
  chosen_korean: 귀 기울여 들으십시오
  alternatives_korean:
  - 주의 깊게 들으십시오
  - 들어 주십시오
  - 잘 들어 주십시오
  lexicon: HALOT
  rationale: האזין의 강한 주의 집중을 단순한 ‘듣다’보다 더 분명하게 드러내기 위해 관용적 표현 ‘귀 기울여’로 강화했습니다.
theological_decisions:
- issue: 두 동사의 반복 명령과 병행 구조
  chosen_reading: ‘들으십시오 / 귀 기울여 들으십시오’로 두 단계의 청취 요구를 분명히 구분했습니다.
  alternative_readings:
  - 두 절을 모두 ‘들으십시오’로 평준화
  - ‘귀를 기울이십시오’만 사용
  rationale: 히브리어는 거의 동의적이지만 서로 다른 두 청각 동사를 나란히 써서 강조합니다. 한국어에서도 반복의 수사적 힘이 약화되지 않도록 구분을 유지했습니다.
  doctrine_reference: 히브리어 평행법의 수사적 강조
