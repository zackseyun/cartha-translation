translation:
  language: ko
  text: 그러나 이제 욥이여, 부디 내 말을 들으시고 내 모든 말에 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 말’과 ‘내 모든 말’이라는 거의 동의적인 표현 및 두 청취 동사를 병행하여 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
