base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
  footnotes:
  - marker: a
    text: Or, more formally, 'Call, and I will answer; or I will speak, and answer me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 부르십시오. 그러면 제가 대답하겠습니다. 아니면 제가 말하겠습니다—그러면 당신은 저에게 대답하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘부르십시오, 그러면 제가 대답하겠습니다; 아니면 제가 말하겠습니다, 그러면 저에게 대답하십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  english_pob_choice: Then call
  chosen_korean: 부르십시오
  alternatives_korean:
  - 그리고 부르십시오
  - 그러면 부르십시오
  - 불러 보십시오
  lexicon: HALOT
  rationale: 명령형 2인칭 남성 단수의 요청을 현대 합쇼체로 옮겼습니다. 영어 POB의 Then은 문맥상 조건적·순차적 뉘앙스를 살리기 위한 것이므로, 한국어에서는 자연스러운 대화/논쟁 연결을 위해 문장 첫머리에 두되 과도한 부가어는 피했습니다.
- source_word: אֶעֱנֶה
  english_pob_choice: I will answer
  chosen_korean: 제가 대답하겠습니다
  alternatives_korean:
  - 제가 응답하겠습니다
  - 제가 대답할 것입니다
  lexicon: HALOT
  rationale: ענה의 ‘대답하다/응답하다’ 의미를 살려, 단순 미래보다 의지와 응답의 관계가 드러나는 합쇼체로 옮겼습니다.
- source_word: אֲדַבֵּר
  english_pob_choice: let me speak
  chosen_korean: 제가 말하겠습니다
  alternatives_korean:
  - 말하게 해 주십시오
  - 제가 발언하겠습니다
  lexicon: HALOT
  rationale: 직역형 ‘말하게 해 주십시오’도 가능하지만, 여기서는 소송/논쟁 구도에서 화자의 발언 제안을 자연스럽게 드러내는 ‘제가 말하겠습니다’가 더 적합합니다.
- source_word: וַהֲשִׁיבֵנִי
  english_pob_choice: and you reply to me
  chosen_korean: 그러면 당신은 저에게 대답하십시오
  alternatives_korean:
  - 그리고 저에게 대답하십시오
  - 저에게 답변하십시오
  lexicon: HALOT
  rationale: הֵשִׁיב의 ‘대답하다/답하다’ 용법을 반영해, 앞의 ‘제가 말하겠습니다’와 대응되는 상호 응답 구조를 살렸습니다. ‘reply’의 상대적 대칭성을 위해 ‘대답하십시오’로 두었습니다.
theological_decisions:
- issue: 욥기의 논쟁적·법정적 대화 톤
  chosen_reading: 이 절은 하나님께 직접 따지는 법정적 대면의 요청으로 읽고, 한국어도 정중하지만 도전적인 상호 응답 구조를 유지했습니다.
  alternative_readings:
  - 단순한 기도 요청으로 완화하는 읽기
  - 일반적인 대화 권유로 순화하는 읽기
  rationale: 원문은 명령형과 응답형이 교차하는 대결적 구조이므로, 지나치게 경건하거나 완곡한 표현으로 바꾸면 장면의 긴장이 약해집니다.
  doctrine_reference: Job 13:22 문맥상의 화법
