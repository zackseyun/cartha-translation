language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
  footnotes:
  - marker: a
    text: Or, 'How great are my iniquities and sins?' The Hebrew interrogative can ask about extent as well as number, though the main text preserves the more direct quantitative sense.
    reason: lexical_alternative
  - marker: b
    text: '''Transgression'' renders פֶּשַׁע, which can also carry the sense of ''rebellion.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 죄악과 죄가 얼마나 많습니까? 내 허물과 내 죄를 내게 알려 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 죄악과 죄가 얼마나 큽니까?’ 히브리어 의문사는 수량뿐 아니라 정도를 물을 수도 있으나, 본문은 보다 직접적인 수량 의미를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허물’은 פֶּשַׁע의 번역으로, ‘반역’의 뉘앙스도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  english_pob_choice: How many are my
  chosen_korean: 얼마나 많습니까
  alternatives_korean:
  - 몇 개나 됩니까
  - 얼마나 많으니
  lexicon: HALOT
  rationale: 히브리어 שאלת כַּמָּה는 수량뿐 아니라 정도를 물을 수 있지만, 여기서는 복수 명사들과 함께 한국어의 자연스러운 수량/정도 질문인 ‘얼마나 많습니까’가 직접적이고 정확합니다.
- source_word: עֲוֺנוֹת
  english_pob_choice: iniquities
  chosen_korean: 죄악
  alternatives_korean:
  - 악행
  - 불법
  lexicon: HALOT
  rationale: עָוֹן은 단순한 실수보다 도덕적 왜곡과 죄책을 포함하는 무게가 있어 ‘죄악’이 가장 적절합니다.
- source_word: וְחַטָּאוֹת
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 죄과
  - 잘못
  lexicon: HALOT
  rationale: חַטָּאת는 기본적으로 ‘죄’이므로, 앞의 ‘죄악’과 구별되면서도 자연스러운 대응으로 ‘죄’가 적합합니다.
- source_word: פִּשְׁעִי
  english_pob_choice: my transgression
  chosen_korean: 내 허물
  alternatives_korean:
  - 내 범죄
  - 내 반역
  lexicon: HALOT
  rationale: פֶּשַׁע는 ‘거역/반역’의 뉘앙스가 있지만, 이 절에서는 위의 죄 항목들과 병렬을 이루므로 한국어 성경문체에서 넓게 통용되는 ‘허물’이 과도한 해석 없이 긴장을 살립니다.
- source_word: וְחַטָּאתִי
  english_pob_choice: my sin
  chosen_korean: 내 죄
  alternatives_korean:
  - 내 죄과
  - 내 잘못
  lexicon: HALOT
  rationale: 단수형 חַטָּאת는 간명하게 ‘내 죄’로 옮기면 원문의 반복 구조와 대구가 잘 드러납니다.
- source_word: הֹדִיעֵנִי
  english_pob_choice: Make ... known to me
  chosen_korean: 내게 알려 주십시오
  alternatives_korean:
  - 내게 보여 주십시오
  - 내게 알게 하십시오
  lexicon: HALOT
  rationale: 히필 ידע는 ‘알게 하다/알려 주다’의 사역적 의미이므로, 명령형으로 자연스럽고 직역성도 유지되는 ‘내게 알려 주십시오’가 적절합니다.
theological_decisions:
- issue: 욥의 자책 어조를 한국어에서 얼마나 강하게 드러낼지
  chosen_reading: ‘죄악/죄/허물’의 연쇄를 유지해 죄책 고백의 강도를 살리되, 원문에 없는 회개 공식은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘죄과/잘못’처럼 완화된 표현
  - ‘반역’으로 더 강하게 구체화
  rationale: 본문은 죄의 성격을 열거하며 하나님께 드러내 달라고 요청하는 것이지, 특정 교리적 회심문을 말하지 않으므로 병렬 구조를 보존하는 번역이 가장 충실합니다.
  doctrine_reference: 욥기 13:23의 수사적 자기 성찰
- issue: פֶּשַׁע의 뉘앙스 처리
  chosen_reading: ‘허물’로 번역해 일반적 도덕적 결함과 의도적 위반 사이의 긴장을 남겼습니다.
  alternative_readings:
  - ‘반역’으로 번역
  - ‘범죄’로 번역
  rationale: ‘반역’은 פֶּשַׁע의 강한 뉘앙스를 드러내지만 한국어에서는 너무 특정한 정치적/신학적 반역으로 좁아질 수 있어, 문맥상 균형이 좋은 ‘허물’을 택했습니다.
  doctrine_reference: 히브리어 פֶּשַׁע의 의미 범위
