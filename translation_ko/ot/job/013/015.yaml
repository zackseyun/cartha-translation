source:
  edition: WLC
  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
  footnotes:
  - marker: a
    text: 'Traditional rendering: ''Though he slay me, yet will I hope in him.'' This reflects an alternative reading of the Hebrew.'
    reason: alternative_reading
translation:
  language: ko
  text: 비록 그가 나를 죽이실지라도 나는 기다리지 않겠습니다. 그러나 나는 그분 앞에서 내 길을 변론하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '전통적 번역: ‘그가 나를 죽이실지라도 나는 그에게 소망하리라.’ 이는 히브리어의 다른 읽기를 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Though
  chosen_korean: 비록
  alternatives_korean:
  - 보라
  - 진실로
  - 만일
  lexicon: HALOT
  rationale: 앞 절에 양보의 뉘앙스를 주는 도입어로, 현대 한국어에서는 ‘비록’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: יִקְטְלְנִי
  english_pob_choice: he slay me
  chosen_korean: 그가 나를 죽이실지라도
  alternatives_korean:
  - 그가 나를 죽이시더라도
  - 그가 나를 죽일지라도
  - 그가 나를 살해하실지라도
  lexicon: HALOT
  rationale: קטל의 강한 ‘죽이다/죽이다’ 의미를 살리되, 욥의 비장한 어조를 반영해 ‘죽이실지라도’로 옮겼습니다.
- source_word: לֹא אֲיַחֵל
  english_pob_choice: I will not wait
  chosen_korean: 나는 기다리지 않겠습니다
  alternatives_korean:
  - 나는 바라지 않겠습니다
  - 나는 소망하지 않겠습니다
  - 나는 기다리지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 자음본문의 부정 לֹא를 따라 ‘기다리다’의 의미를 살렸고, 현대어에서는 부정 의지형으로 자연스럽게 표현했습니다.
- source_word: אוֹכִיחַ
  english_pob_choice: I will argue
  chosen_korean: 내 길을 변론하겠습니다
  alternatives_korean:
  - 내 길을 주장하겠습니다
  - 내 사정을 변론하겠습니다
  - 내 길을 변호하겠습니다
  lexicon: HALOT
  rationale: 법정적·논쟁적 맥락을 살려 ‘변론하다’를 택했고, דְּרָכַי의 직역인 ‘내 길’을 함께 보존했습니다.
theological_decisions:
- issue: 전승적 읽기(“그가 나를 죽이시리니, 그에게 소망하리라”)를 본문에 반영할지 여부
  chosen_reading: 본문은 자음본문의 לֹא를 따라 ‘나는 기다리지 않겠습니다’로 옮기고, 전승적 해석은 주석에서 다루지 않습니다.
  alternative_readings:
  - 그가 나를 죽이실지라도 나는 그에게 소망하겠습니다
  - 그가 나를 죽이시리니 나는 그를 기다리겠습니다
  rationale: 제공된 원문과 POB 주석은 לֹא(‘아니라’)를 기준으로 하므로, 전통 번역을 본문에 넣어 본문 증거를 약화시키지 않도록 했습니다.
  doctrine_reference: 원문 우선 번역 원칙
