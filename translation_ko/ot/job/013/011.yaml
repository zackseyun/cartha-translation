source:
  edition: WLC
  text: הֲ/לֹ֣א שְׂ֭אֵת/וֹ תְּבַעֵ֣ת אֶתְ/כֶ֑ם וּ֝/פַחְדּ֗/וֹ יִפֹּ֥ל עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
  footnotes:
  - marker: a
    text: Or 'his exaltation' for 'his majesty.' The Hebrew term can denote elevation, dignity, or exalted status.
    reason: lexical_alternative
  - marker: b
    text: Or 'the fear of him fall upon you.' The phrase 'his dread' may be understood as the dread he inspires.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 위엄[a]이 여러분을 두렵게 하지 않겠습니까? 그의 두려움[b]이 여러분 위에 떨어지지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 높아짐’으로도 옮길 수 있습니다. 히브리어는 높이 올림, 존귀, 고양된 지위를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 향한 두려움’으로도 이해할 수 있습니다. ‘그의 두려움’은 그가 불러일으키는 두려움을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Will not
  chosen_korean: 않겠습니까
  alternatives_korean:
  - 아니겠습니까
  - 정녕 그렇지 않겠습니까
  lexicon: HALOT
  rationale: 반어적 수사 의문문을 한국어의 정중한 의문형으로 옮겨, 단순 평서보다 예상되는 긍정 답변의 압박감을 살렸습니다.
- source_word: שְׂאֵתוֹ
  english_pob_choice: his majesty
  chosen_korean: 그의 위엄
  alternatives_korean:
  - 그의 높임
  - 그의 높아지심
  - 그의 존귀
  lexicon: HALOT
  rationale: שְׂאֵת은 높임, 고양, 존귀한 상태를 가리킬 수 있어, 문맥상 하나님/그의 압도적 높음을 드러내는 ‘위엄’이 가장 자연스럽고 엄숙합니다.
- source_word: תְּבַעֵת
  english_pob_choice: terrify
  chosen_korean: 두렵게 하지 않겠습니까
  alternatives_korean:
  - 무섭게 하지 않겠습니까
  - 공포에 떨게 하지 않겠습니까
  lexicon: HALOT
  rationale: 동사의 강한 공포 유발 뉘앙스를 살리되, 한국어에서 부자연스럽지 않게 ‘두렵게 하다’로 옮겼습니다.
- source_word: וּפַחְדּוֹ
  english_pob_choice: his dread
  chosen_korean: 그의 두려움
  alternatives_korean:
  - 그의 공포
  - 그를 향한 두려움
  - 그의 경외
  lexicon: HALOT
  rationale: ‘his dread’의 소유격 구조를 보존하면서도, 그것이 일으키는 감정인지 그 자체의 두려움인지 열린 상태를 유지했습니다.
theological_decisions:
- issue: ‘his dread’의 의미를 주체적 공포인가, 하나님이 불러일으키는 두려움인가로 고정할지 여부
  chosen_reading: 본문에는 한국어 본문에서 ‘그의 두려움’으로 두어, 하나님에게 속한 두려움이면서 동시에 그가 일으키는 두려움이라는 중의성을 보존했습니다.
  alternative_readings:
  - 그를 향한 두려움
  - 그의 공포
  rationale: 영어 POB도 ‘his dread’와 ‘the fear of him’ 사이의 해석 가능성을 열어 두고 있어, 본문에서 특정 방향으로 과도하게 결정하지 않았습니다.
  doctrine_reference: 하나님의 거룩하심과 인간의 경외 반응
