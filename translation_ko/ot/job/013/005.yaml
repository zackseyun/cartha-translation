    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: If only
  chosen_korean: …하기만 하면 좋겠습니다
  alternatives_korean:
  - …하면 좋겠습니다
  - 아, …했으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용적 소망 표현이므로, 직설적 질문이 아니라 바람의 뉘앙스를 살리는 한국어 optative로 옮겼습니다.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  english_pob_choice: keep completely silent
  chosen_korean: 완전히 침묵하시기
  alternatives_korean:
  - 잠잠하시기
  - 철저히 침묵하시기
  lexicon: HALOT
  rationale: 동사 어근의 반복이 강한 강조를 만들므로, ‘침묵’에 ‘완전히’를 더해 중첩 강조를 반영했습니다.
- source_word: וּתְהִי לָכֶם לְחָכְמָה
  english_pob_choice: it would count as wisdom for you
  chosen_korean: 그것이 당신들에게 지혜가 될 것입니다
  alternatives_korean:
  - 그것이 당신들에게 지혜로 여겨질 것입니다
  - 그것이 당신들에게 지혜일 것입니다
  lexicon: HALOT
  rationale: 직역적 ‘~로 되다/여겨지다’보다, 문맥상 침묵 자체가 지혜로 평가된다는 뜻을 자연스럽게 살려 ‘지혜가 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 욥의 날카로운 책망을 한국어 높임말로 어떻게 처리할지
  chosen_reading: 직접 상대는 높임 표현을 쓰되, 책망의 의미는 약화하지 않았습니다.
  alternative_readings:
  - 반말로 낮춰서 더 날카롭게 옮김
  - 더 완곡하게 순화함
  rationale: 이 절은 발화의 공격성을 유지해야 하지만, 표준어 합쇼체의 문체 규범도 따라야 하므로, 상대 존중형 종결을 쓰되 내용의 질책은 그대로 보존했습니다.
  doctrine_reference: 욥기 13:5의 수사적 책망
