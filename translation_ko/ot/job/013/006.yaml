translation:
  language: ko
  text: 부디 내 변론[a]을 들으시고, 내 입술의 호소[b]에 귀를 기울이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 책망’. 히브리어는 책망, 교정, 또는 이치에 맞게 제시하는 주장·논증을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 입술의 다툼’ 또는 ‘내 입술의 변론’. 히브리어 표현에는 말로 하는 다툼이나 법정적 호소의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Please hear
  chosen_korean: 부디 … 들으시고
  alternatives_korean:
  - 들으십시오
  - 제발 들으십시오
  - 부디 들어 주십시오
  lexicon: HALOT / discourse particle
  rationale: שׁמע의 명령형 복수에 נָא의 간청을 살려, 현대 한국어에서는 ‘부디’로 공손한 요청을 자연스럽게 표현했습니다.
- source_word: תוֹכַחְתִּי
  english_pob_choice: my argument
  chosen_korean: 내 변론
  alternatives_korean:
  - 내 논증
  - 내 책망
  - 내 주장
  lexicon: HALOT
  rationale: 욥기의 법정적 맥락에서 תוכחה는 단순한 ‘책망’보다 자신이 제시하는 변론·사례를 뜻하므로, POB의 ‘argument’를 따라 ‘변론’으로 옮겼습니다.
- source_word: וְרִבוֹת שְׂפָתַי
  english_pob_choice: the pleadings of my lips
  chosen_korean: 내 입술의 변론
  alternatives_korean:
  - 내 입술의 다툼
  - 내 입술의 호소
  - 내 입술의 변론들
  lexicon: HALOT
  rationale: ריב/ריבות의 법정적 ‘변론, 다툼, 변호’의 뉘앙스를 살려 ‘입술의 변론’으로 옮겼고, 직역적 이미지도 유지했습니다.
- source_word: הַקְשִׁיבוּ
  english_pob_choice: listen to
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 들으십시오
  - 주의를 기울이십시오
  - 유의하십시오
  lexicon: HALOT
  rationale: קשׁב의 ‘주의 깊게 듣다’라는 강한 집중성을 한국어 관용 표현 ‘귀를 기울이다’로 살렸습니다.
