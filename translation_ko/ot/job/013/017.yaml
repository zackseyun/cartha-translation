  - 귀 기울여 들으십시오
  - 분명히 들으십시오
  lexicon: HALOT
  rationale: 동사와 절대부정사의 강조를 한국어에서는 명령형과 부사로 자연스럽게 살려, 반복의 강세를 '잘'로 압축해 옮겼습니다.
- source_word: מִלָּתִי
  english_pob_choice: my word
  chosen_korean: 제 말
  alternatives_korean:
  - 제 말씀
  - 제 단어
  - 제가 하는 말
  lexicon: HALOT
  rationale: 히브리어 단수 'word'의 직접성을 유지하되, 현대 한국어에서는 '말'이 가장 자연스럽고 간결합니다.
- source_word: וַאֲחֲוָתִי
  english_pob_choice: my declaration
  chosen_korean: 제 설명
  alternatives_korean:
  - 제 선언
  - 제 진술
  - 제 발언
  lexicon: HALOT
  rationale: 여기서는 단순한 발화보다 내용의 제시와 설명을 가리키므로, POB의 'declaration'에 맞춰 '설명'으로 옮겼습니다.
- source_word: בְּאָזְנֵיכֶם
  english_pob_choice: in your ears
  chosen_korean: 당신들의 귀에
  alternatives_korean:
  - 당신들의 귀 안에
  - 당신들의 귀속에
  - 당신들의 귀에다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서는 '귀에 있게 하십시오'로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 강조 명령의 수사적 힘
  chosen_reading: '''Listen carefully''의 강조를 ''잘 들으십시오''로 살렸습니다.'
  alternative_readings:
  - '''주의 깊게 들으십시오''로 더 풀이적으로 옮길 수 있음'
  - '''들으십시오''로 단순화할 수 있음'
  rationale: 욥의 간청은 단순 청취가 아니라 긴박한 집중을 요구하므로, 명령형의 간절함을 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성경 본문 수사와 담화 기능 보존
