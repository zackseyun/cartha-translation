source:
  edition: WLC
  text: עַל מָ֤ה אֶשָּׂ֣א בְשָׂרִ֣/י בְ/שִׁנָּ֑/י וְ֝/נַפְשִׁ֗/י אָשִׂ֥ים בְּ/כַפִּֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/014.yaml
  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
  footnotes:
  - marker: a
    text: Or, 'Why should I take my flesh with my teeth?' The Hebrew expression is idiomatic and difficult; it conveys reckless self-endangerment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'my soul.' Hebrew nephesh can mean 'life,' 'soul,' or 'self'; here 'life' best fits the sense of risking oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 내가 내 살을 내 이빨 사이에 물고, 내 생명을 내 손바닥에 두겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘왜 내가 내 살을 이빨로 물겠습니까?’ 히브리어 표현은 관용적이며 난해합니다. 무모하게 자신을 위험에 내맡기는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘내 혼.’ 히브리어 nephesh는 ‘생명,’ ‘영혼,’ ‘자기’가 될 수 있는데, 여기서는 자신을 위험에 내맡기는 뜻에는 ‘생명’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  english_pob_choice: Why should
  chosen_korean: 어찌하여 …겠습니까?
  alternatives_korean:
  - 왜 …합니까?
  - 무엇 때문에 …겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 동기를 묻는 표현으로, 현대 합쇼체에서 자연스럽고도 강한 반문을 살리기 위해 ‘어찌하여’로 옮겼습니다.
- source_word: אֶשָּׂא
  english_pob_choice: should I take
  chosen_korean: 내가 … 물고
  alternatives_korean:
  - 내가 … 들고
  - 내가 … 가져가고
  lexicon: HALOT
  rationale: 문맥상 ‘내 살을 이빨로 물다’는 관용적·자기위험 표현이므로, 단순한 ‘들다/가져가다’보다 영어 POB의 의도를 따라 한국어도 동작 이미지를 유지했습니다.
- source_word: בְשָׂרִי
  english_pob_choice: my flesh
  chosen_korean: 내 살
  alternatives_korean:
  - 내 육체
  - 내 몸
  lexicon: HALOT
  rationale: 히브리어 בשר의 구체적 이미지를 살리기 위해 ‘살’로 옮겼습니다. ‘몸’으로 풀면 감각적 비유가 약해집니다.
- source_word: בְּשִׁנַּי
  english_pob_choice: in my teeth
  chosen_korean: 내 이빨 사이에
  alternatives_korean:
  - 내 이빨에
  - 내 이로
  lexicon: HALOT
  rationale: 히브리어의 기이하고 난해한 관용구를 한국어에서도 그대로 드러내기 위해 ‘이빨 사이에’로 옮겨, 자기 훼손·무모함의 이미지를 보존했습니다.
- source_word: וְנַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 목숨
  - 내 영혼
  - 내 혼
  lexicon: HALOT
  rationale: נפש는 ‘생명/목숨/영혼’ 모두 가능하지만, ‘손바닥에 두다’와 병렬되는 위험 노출의 의미에는 ‘내 생명’이 가장 명확합니다.
- source_word: בְּכַפִּי
  english_pob_choice: in my hand
  chosen_korean: 내 손바닥에
  alternatives_korean:
  - 내 손에
  - 내 손안에
  lexicon: HALOT
  rationale: כף는 문자적으로 ‘손바닥’이어서, ‘손바닥에’가 원문의 구체적 이미지를 가장 잘 보존합니다. 다만 한국어에서는 ‘손에’보다 시각적 긴박감이 큽니다.
theological_decisions:
- issue: 이 절의 난해한 관용구를 어떻게 처리할지
  chosen_reading: 직역에 가까운 이미지 유지로 자기위험과 무모한 행동의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘왜 내가 내 살을 입에 물겠습니까?’처럼 더 관용적으로 풀기
  - 의미만 살려 ‘왜 내가 스스로를 위험에 빠뜨리겠습니까?’로 의역하기
  rationale: 본문은 의도적으로 거친 비유를 사용하므로, 의미를 지나치게 매끈하게 만들기보다 이미지 자체를 보존하는 편이 문맥과 합합니다.
  doctrine_reference: 욥기의 수사적 항변과 고난 담화의 문체 보존
