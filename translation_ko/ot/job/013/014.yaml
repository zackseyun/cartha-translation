  - 의미만 살려 ‘왜 내가 스스로를 위험에 빠뜨리겠습니까?’로 의역하기
  rationale: 본문은 의도적으로 거친 비유를 사용하므로, 의미를 지나치게 매끈하게 만들기보다 이미지 자체를 보존하는 편이 문맥과 합합니다.
  doctrine_reference: 욥기의 수사적 항변과 고난 담화의 문체 보존
