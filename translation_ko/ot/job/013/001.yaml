theological_decisions:
- issue: 히브리어의 여성형 동사 וַתָּבֶן לָהּ의 처리
  chosen_reading: 마지막 동사를 한국어에서는 성별 표시 없이 '깨달았습니다'로 자연스럽게 처리했습니다.
  alternative_readings:
  - '''그것을 이해했습니다''처럼 목적어를 드러내는 번역'
  - '''분별했습니다''처럼 지적 판단을 강조하는 번역'
  rationale: 히브리어의 여성형은 한국어에서 문법적 재현이 불가능하며, כאן은 화자의 귀가 들은 내용을 인지해 이해했다는 의미가 핵심이므로 성별 표지보다 의미를 우선했습니다.
  doctrine_reference: 히브리어 문법의 성 구분은 한국어 번역에서 의미적으로만 반영
