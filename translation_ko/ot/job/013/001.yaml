id: JOB.13.1
reference: Job 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶן כֹּ֭ל רָאֲתָ֣ה עֵינִ֑/י שָֽׁמְעָ֥ה אָ֝זְנִ֗/י וַ/תָּ֥בֶן לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
  footnotes:
  - marker: a
    text: Or 'and discerned it' / 'and considered it.' The Hebrew literally continues, 'and understood for her/itself,' an idiom expressing comprehension of what was heard.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내 눈이 이 모든 것을 보았고 내 귀가 듣고 깨달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “그리고 그것을/스스로를 이해했다”에 가깝습니다. 여기서는 들은 내용을 ‘이해했다’는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 대상을 주목하게 하는 감탄·호소의 표지를 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: כֹּל
  english_pob_choice: all this
  chosen_korean: 이 모든 것
  alternatives_korean:
  - 모든 것
  - 이 모든 일
  - 전부
  lexicon: HALOT
  rationale: 문맥상 앞서 논의된 내용 전체를 가리키므로, 단순한 '모든 것'보다 지시성을 살린 표현을 택했습니다.
- source_word: רָאֲתָה עֵינִי / שָׁמְעָה אָזְנִי
  english_pob_choice: my eye has seen / my ear has heard
  chosen_korean: 내 눈이 보았고 / 내 귀가 들었습니다
  alternatives_korean:
  - 내 눈이 보았고 / 내 귀가 들었고
  - 내가 보았고 / 내가 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 신체기관 주어를 유지해 병렬과 생생함을 살렸고, 합쇼체 문맥에 맞게 현재완료적 의미를 자연스럽게 표현했습니다.
- source_word: וַתָּבֶן לָהּ
  english_pob_choice: and understood it
  chosen_korean: 깨달았습니다
  alternatives_korean:
  - 이해했습니다
  - 분별했습니다
  - 그것을 이해했습니다
  lexicon: HALOT
  rationale: 문맥상 단순 청취를 넘어 인지·파악의 완료를 나타내므로, 한국어에서 가장 자연스럽고 포괄적인 '깨달았습니다'로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 여성형 동사 וַתָּבֶן לָהּ의 처리
  chosen_reading: 마지막 동사를 한국어에서는 성별 표시 없이 '깨달았습니다'로 자연스럽게 처리했습니다.
  alternative_readings:
  - '''그것을 이해했습니다''처럼 목적어를 드러내는 번역'
  - '''분별했습니다''처럼 지적 판단을 강조하는 번역'
  rationale: 히브리어의 여성형은 한국어에서 문법적 재현이 불가능하며, כאן은 화자의 귀가 들은 내용을 인지해 이해했다는 의미가 핵심이므로 성별 표지보다 의미를 우선했습니다.
  doctrine_reference: 히브리어 문법의 성 구분은 한국어 번역에서 의미적으로만 반영
