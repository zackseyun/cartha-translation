  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
  footnotes:
  - marker: a
    text: Or 'and discerned it' / 'and considered it.' The Hebrew literally continues, 'and understood for her/itself,' an idiom expressing comprehension of what was heard.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내 눈은 이 모든 것을 보았고 내 귀는 듣고 이해했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “분별했습니다” 또는 “숙고했습니다.” 히브리어는 문자적으로 “그리고 그녀/그것이 자신을 위하여 이해했다”라고 이어집니다. 이는 들은 내용을 이해했다는 뜻을 나타내는 난해한 표현입니다.
    reason: lexical_alternative
