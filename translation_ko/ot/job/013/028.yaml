lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: while he
  chosen_korean: 그는
  alternatives_korean:
  - 그리하여 그는
  - 그리고 그는
  - 그는 또한
  lexicon: HALOT
  rationale: 독립 인칭대명사는 여기서 앞 문맥의 대상을 다시 받는 기능이므로, 한국어에서는 단순 주어 표지로 처리하는 것이 자연스럽습니다.
- source_word: כְּרָקָב
  english_pob_choice: like something rotten
  chosen_korean: 썩은 것처럼
  alternatives_korean:
  - 부패한 것처럼
  - 썩음처럼
  - 부패처럼
  lexicon: HALOT
  rationale: רָקָב의 핵심 의미는 부패/썩음이므로, 비유적이면서도 직접적인 ‘썩은 것처럼’이 문맥의 생생함을 잘 살립니다.
- source_word: יִבְלֶה
  english_pob_choice: wastes away
  chosen_korean: 쇠약해집니다
  alternatives_korean:
  - 낡아갑니다
  - 소모되어 갑니다
  - 사그라집니다
  lexicon: HALOT
  rationale: 몸이 점차 허물어지는 맥락이므로, 단순한 ‘낡다’보다 상태가 소진되어 가는 ‘쇠약해집니다’가 의미를 더 정확히 드러냅니다.
- source_word: כְּבֶגֶד אֲכָלוֹ עָשׁ
  english_pob_choice: like a garment eaten by moths
  chosen_korean: 좀이 먹은 옷처럼
  alternatives_korean:
  - 나방이 먹은 옷처럼
  - 벌레 먹은 옷처럼
  - 좀벌레가 갉아먹은 옷처럼
  lexicon: HALOT
  rationale: 의복이 해충에 훼손되는 이미지를 자연스럽게 옮기기 위해, 한국어 관용에 맞는 ‘좀이 먹은 옷’으로 표현했습니다.
theological_decisions:
- issue: 시적 비유의 강도 유지
  chosen_reading: 부패와 좀먹음의 이중 비유를 그대로 살려, 고통받는 사람이 점점 소진되어 가는 모습을 직설적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 완화한 표현
  - 단순히 ‘망가집니다’로 요약
  rationale: 히브리어는 신체적 쇠락을 두 개의 강한 이미지로 제시하므로, 완화하지 않고 대응하는 것이 본문의 정서를 보존합니다.
  doctrine_reference: 시적 지혜문학의 비유 보존
