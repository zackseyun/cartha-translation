  rationale: 독립 인칭대명사는 여기서 앞 문맥의 대상을 다시 받는 기능이므로, 한국어에서는 단순 주어 표지로 처리하는 것이 자연스럽습니다.
- source_word: כְּרָקָב
  english_pob_choice: like something rotten
  chosen_korean: 썩은 것처럼
  alternatives_korean:
  - 부패한 것처럼
  - 썩음처럼
  - 부패처럼
  lexicon: HALOT
  rationale: רָקָב의 핵심 의미는 부패/썩음이므로, 비유적이면서도 직접적인 ‘썩은 것처럼’이 문맥의 생생함을 잘 살립니다.
- source_word: יִבְלֶה
  english_pob_choice: wastes away
  chosen_korean: 쇠약해집니다
  alternatives_korean:
