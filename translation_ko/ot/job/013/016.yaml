  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
  footnotes:
  - marker: a
    text: Or 'deliverance' or 'vindication' for 'salvation.'
    reason: lexical_alternative
  - marker: b
    text: '''Godless man'' may also be rendered ''hypocrite'' or ''impious man''; the Hebrew refers to one who is irreverent before God, not merely insincere.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것도 나의 구원이 될 것입니다[a], 악한 사람은 그 앞에 나아갈 수 없기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 ‘구출’ 또는 ‘변호/입증’의 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 사람’은 ‘위선자’ 또는 ‘불경한 사람’으로도 옮길 수 있으나, 히브리어는 단순한 내적 불성실보다 하나님 앞에서 불경한 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  english_pob_choice: This also
  chosen_korean: 이것도
  alternatives_korean:
  - 이 또한
  - 이 역시
  lexicon: HALOT
  rationale: 앞선 주장에 덧붙는 지시를 한국어 자연문으로 옮기되, 문맥상 대상을 가리키는 뉘앙스를 유지했습니다.
- source_word: לִי לִישׁוּעָה
  english_pob_choice: my salvation
  chosen_korean: 나의 구원
  alternatives_korean:
  - 나의 구출
  - 나의 해방
  - 나의 구원과 변호
  lexicon: HALOT
  rationale: לִישׁוּעָה의 폭넓은 의미를 살리면서도 한국어에서는 ‘구원’이 가장 포괄적이고 엄중한 표현이어서 채택했습니다.
- source_word: חָנֵף
  english_pob_choice: godless man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 불경한 사람
  - 경건하지 않은 사람
  - 위선자
  lexicon: HALOT
  rationale: 이 어휘는 단순한 위선보다 하나님 앞에서 불경하고 불의한 사람을 가리키므로, ‘위선자’로 좁히지 않고 도덕·종교적 반감을 함께 담는 표현을 택했습니다.
- source_word: לְפָנָיו יָבֹוא
  english_pob_choice: come before him
  chosen_korean: 그 앞에 나아갈 수 없기
  alternatives_korean:
  - 그 앞에 올 수 없기
  - 그 앞에 나올 수 없기
  - 그 앞에 들어갈 수 없기
  lexicon: HALOT
  rationale: ‘그 앞에’는 উপস্থিত/접근의 관용구를 자연스럽게 살리고, ‘나아갈 수 없다’는 허용되지 않는다는 뜻을 분명히 합니다.
theological_decisions:
- issue: לְפָנָיו의 지시 대상
  chosen_reading: ‘그’는 하나님을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 일반적인 심판자/대상으로 이해할 수 있음
  rationale: 문맥상 욥의 변호와 판결 논의가 하나님 앞에서의 문제이므로, 지시 대상을 하나님으로 드러내는 것이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: 문맥에 근거한 지시 대상 해석
