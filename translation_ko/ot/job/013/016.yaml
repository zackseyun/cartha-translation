translation:
  language: ko
  text: 이것도 나의 구원이 될 것입니다[a]. 불경한 사람은[b] 그 앞에 나아갈 수 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 ‘구출’ 또는 ‘변호/입증’의 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불경한 사람’은 ‘위선자’ 또는 ‘경건하지 않은 사람’으로도 옮길 수 있으나, 히브리어는 단순한 내적 불성실보다 하나님 앞에서 불경한 사람을 가리킵니다.
    reason: lexical_alternative
