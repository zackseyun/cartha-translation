    text: 원문 동사 ערץ는 단순히 ‘놀라게 하다’보다 더 강하게 ‘두렵게 하다/공포를 주다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: קַשׁ은 ‘겨’ 외에도 ‘짚’이나 ‘지푸라기’로 옮길 수 있으며, 모두 매우 가벼운 식물 찌꺼기라는 점을 드러냅니다.
