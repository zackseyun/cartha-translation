    text: 또는 ‘당신들의 기억은 재로 된 속담이며, 당신들의 보루는 진흙으로 된 보루입니다.’ 히브리어는 매우 간결하며, 마지막 구절은 해석하기 어렵습니다. ‘방어물/보루’는 반복된 명사를 문맥에 따라 옮긴 것입니다.
