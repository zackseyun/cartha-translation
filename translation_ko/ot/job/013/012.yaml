source:
  edition: WLC
  text: זִֽ֭כְרֹנֵי/כֶם מִשְׁלֵי אֵ֑פֶר לְ/גַבֵּי חֹ֝֗מֶר גַּבֵּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
  footnotes:
  - marker: a
    text: Or 'Your remembrances are proverbs of ashes; your bulwarks are bulwarks of clay.' The Hebrew is terse and the final phrase is difficult; 'defenses/bulwarks' reflects a contextual reading of the repeated noun.
    reason: alternative_reading
translation:
  language: ko
  text: 당신들의 격언은 재의 속담이며, 당신들의 방어는 진흙의 방어입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신들의 기억은 재의 속담이며, 당신들의 보루는 진흙의 보루입니다.’ 히브리어는 매우 간결하며 마지막 구는 해석이 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  english_pob_choice: your maxims
  chosen_korean: 당신들의 격언
  alternatives_korean:
  - 당신들의 기억들
  - 당신들의 기념 문구
  - 당신들의 명언
  lexicon: HALOT
  rationale: 문맥상 욥이 친구들의 말이 권위 있는 지혜격언처럼 제시된다고 비꼬는 표현이므로, 단순한 ‘기억’보다 ‘격언’이 더 자연스럽고 원문의 기능을 살립니다.
- source_word: מִשְׁלֵי
  english_pob_choice: proverbs of
  chosen_korean: 재의 속담
  alternatives_korean:
  - 재의 비유
  - 재의 비사
  - 재에 관한 속담
  lexicon: HALOT
  rationale: מָשָׁל의 핵심 의미인 ‘속담/격언’의 문학적 성격을 살리되, ‘of ashes’의 축약된 수식 구조를 한국어에서 가장 간결하게 옮겼습니다.
- source_word: חֹמֶר
  english_pob_choice: clay
  chosen_korean: 진흙
  alternatives_korean:
  - 점토
  - 흙
  - 찰흙
  lexicon: HALOT
  rationale: 영어 POB가 이 구절의 평행법상 약함과 무너짐의 이미지를 살리기 위해 ‘clay’를 택한 점을 반영하되, 한국어에서는 일상적이고 이미지가 즉각 전달되는 ‘진흙’이 더 적절합니다.
- source_word: גַּבֵּיכֶם
  english_pob_choice: your defenses
  chosen_korean: 당신들의 방어
  alternatives_korean:
  - 당신들의 등
  - 당신들의 울타리
  - 당신들의 보루
  lexicon: HALOT
  rationale: 직역하면 ‘등’이 될 수 있지만, 문맥상 친구들의 논증을 가리키는 비유적 표현이므로 ‘방어’로 옮겨 욥의 조롱을 명확히 했습니다.
theological_decisions:
- issue: 반복 명사 구조의 해석
  chosen_reading: ‘재의 속담… 진흙의 방어’로 평행 구조를 유지했습니다.
  alternative_readings:
  - ‘재의 격언들… 진흙의 보루들’
  - ‘재의 기억들… 진흙의 성벽들’
  rationale: 히브리어의 압축된 반복 명사와 영어 POB의 ‘defenses/bulwarks’ 해석을 반영하되, 한국어에서는 너무 낯선 구조를 피하면서도 조롱의 날카로움을 보존했습니다.
  doctrine_reference: 문학적 평행법과 시편/욥기의 수사 이해
