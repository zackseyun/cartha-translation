id: JOB.13.9
reference: Job 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ֭/טוֹב כִּֽי יַחְקֹ֣ר אֶתְ/כֶ֑ם אִם כְּ/הָתֵ֥ל בֶּ֝/אֱנ֗וֹשׁ תְּהָתֵ֥לּוּ בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
  footnotes:
  - marker: a
    text: Or 'deceive him' / 'trifle with him'; the Hebrew verb can denote mocking, deceiving, or making sport of someone.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man'; that is, a mere human being, in contrast to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 여러분을 살피실 때 그것이 좋겠습니까? 아니면 사람이 하듯 그분을 조롱하시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '속이겠습니까' / '가지고 노시겠습니까'; 히브리어 동사는 조롱, 기만, 희롱의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '사람'; 곧 하나님과 대비되는 보통 인간입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  english_pob_choice: Will it be good
  chosen_korean: 그것이 좋겠습니까
  alternatives_korean:
  - 좋겠습니까
  - 좋은 일이겠습니까
  - 옳겠습니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어의 공손한 미래·판단형 질문으로 옮겨, 결과를 묻는 뉘앙스를 살렸습니다.
- source_word: יַחְקֹר
  english_pob_choice: he examines
  chosen_korean: 살피실 때
  alternatives_korean:
  - 심문하실 때
  - 조사하실 때
  - 탐지하실 때
  lexicon: HALOT
  rationale: 단순한 관찰이 아니라 철저히 들추어 살피는 의미를 반영하되, 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: כְּהָתֵל
  english_pob_choice: as one mocks
  chosen_korean: 조롱하시겠습니까
  alternatives_korean:
  - 속이시겠습니까
  - 가지고 노시겠습니까
  - 희롱하시겠습니까
  lexicon: HALOT
  rationale: 문맥상 하나님을 사람처럼 우롱하거나 속이는 무례함을 드러내므로, '조롱'이 비교 구문의 경멸적 힘을 가장 잘 전달합니다.
- source_word: בֶּאֱנוֹשׁ
  english_pob_choice: a man
  chosen_korean: 사람이 하듯
  alternatives_korean:
  - 한 인간에게 하듯
  - 한 사람에게 하듯
  - 나약한 인간에게 하듯
  lexicon: HALOT
  rationale: 히브리어 אֱנוֹשׁ의 '한 인간/유한한 사람' 대비를 살리되, 한국어에서는 비교 대상이 분명하도록 '사람이 하듯'으로 풀었습니다.
theological_decisions:
- issue: 13절 문맥에서의 3인칭 지시 대상
  chosen_reading: '''그분''은 하나님을 가리키며, 사람처럼 하나님을 농락하려는 태도를 책망하는 말로 읽었습니다.'
  alternative_readings:
  - 막연한 심문자
  - 일반적인 판사
  rationale: 앞뒤 문맥이 하나님 앞에서의 검증과 정직성을 논하므로, 대상을 하나님으로 분명히 드러내는 것이 본문의 논지를 보존합니다.
  doctrine_reference: 문맥적 지시대상 해석
