lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  english_pob_choice: what you know
  chosen_korean: 당신들이 아는 바
  alternatives_korean:
  - 당신들의 지식에 따라
  - 당신들이 알고 있는 것처럼
  - 당신들이 아는 것
  lexicon: HALOT
  rationale: כ plus דַּעַת with 2인칭 복수 접미사는 ‘여러분의 아는 내용/지식’이라는 비교 표현이므로, 직역의 어색함을 피하면서도 대상을 분명히 하는 ‘아는 바’로 옮겼습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 나도 압니다
  alternatives_korean:
  - 나도 알고 있습니다
  - 나도 압니다
  - 나 역시 알고 있습니다
  lexicon: HALOT
  rationale: 완료형이지만 여기서는 현재적 진술로 기능하므로, 합쇼체에서 자연스러운 현재형 ‘압니다’를 택했습니다.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  english_pob_choice: I am not inferior to you
  chosen_korean: 당신들보다 못하지 않습니다
  alternatives_korean:
  - 당신들에게 뒤지지 않습니다
  - 당신들보다 떨어지지 않습니다
  - 당신들보다 부족하지 않습니다
  lexicon: HALOT
  rationale: ‘떨어지다/못하다’의 비교적 뉘앙스를 현대 한국어에서 자연스럽게 살리되, 지적·논쟁적 맥락에서의 우열 부정을 분명히 하기 위해 ‘못하지 않습니다’로 옮겼습니다.
theological_decisions:
