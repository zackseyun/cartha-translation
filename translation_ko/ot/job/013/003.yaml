lexical_decisions:
- source_word: אוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그렇지만
  lexicon: HALOT
  rationale: 앞절의 책망과 대조되는 강한 전환을 한국어의 자연스러운 역접 접속사로 살렸습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
