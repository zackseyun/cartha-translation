lexical_decisions:
- source_word: אוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그렇지만
  lexicon: HALOT
  rationale: 앞절의 책망과 대조되는 강한 전환을 한국어의 자연스러운 역접 접속사로 살렸습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 전능하신 하나님
  - 샤다이
  lexicon: HALOT
  rationale: 직역적 칭호를 살리되, 한국어에서 자연스럽고 위엄 있는 신적 호칭으로 옮겼습니다.
- source_word: וְהוֹכֵחַ
  english_pob_choice: argue with God
  chosen_korean: 변론하기를 원합니다
  alternatives_korean:
  - 논박하기를 원합니다
  - 다투기를 원합니다
  - 사유하기를 원합니다
  - 제 소송을 제시하기를 원합니다
  lexicon: HALOT
  rationale: 히필 יכח의 법정적 의미를 살려 단순한 '말하다'보다 법적·변론적 뉘앙스가 드러나도록 했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하나님이신 분
  lexicon: HALOT
  rationale: 병행절의 분명한 신적 지시를 한국어 성경 관용에 맞게 '하나님'으로 옮겼습니다.
theological_decisions:
- issue: Job의 발화 태도와 어조
  chosen_reading: 하나님께 직접 말씀드리고 그분과 변론하려는, 단호하지만 경외를 잃지 않는 태도로 옮겼습니다.
  alternative_readings:
  - 보다 중립적인 '이야기하다'
  - 더 공격적인 '다투다'
  rationale: 히브리어는 단순 대화가 아니라 재판정에서의 논변을 암시하므로, 한국어에서도 그 긴장을 유지하되 하나님께 드리는 발화의 경외성을 과도하게 약화시키지 않았습니다.
  doctrine_reference: Job 13:3의 משפט/יכח 문맥과 하나님의 주권에 대한 성경적 표현 원칙
