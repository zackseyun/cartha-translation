  - 물려주십니다
  - 상속하게 하십니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서, ירש의 ‘유산/상속’ 이미지를 한국어에서 가장 자연스럽게 드러냈습니다.
- source_word: עֲוֺנוֹת נְעוּרַי
  english_pob_choice: the iniquities of my youth
  chosen_korean: 내 젊은 시절의 죄악
  alternatives_korean:
  - 내 젊은 시절의 죄악들
  - 내 젊은 시절의 죄과
  - 내 젊은 시절의 불의
  lexicon: HALOT
  rationale: עָוֹן의 의미 범위(죄, 죄책, 죄과/결과)를 과도하게 좁히지 않으면서도, 한국어에서 문맥상 가장 직접적인 ‘죄악’으로 옮겼습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위
  chosen_reading: ‘죄악’으로 옮기되, 그 죄의 책임과 그 결과를 함께 떠올리게 했습니다.
  alternative_readings:
