  - 죄의 벌
  - 죄과
  rationale: 본문은 청년 시절의 잘못 자체와 그로 인한 부담을 함께 내포할 수 있으므로, 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: 의미의 긴장을 보존합니다.
