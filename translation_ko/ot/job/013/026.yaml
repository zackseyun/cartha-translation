  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תִכְתֹּ֣ב עָלַ֣/י מְרֹר֑וֹת וְ֝/תוֹרִישֵׁ֗/נִי עֲוֺנ֥וֹת נְעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
  footnotes:
  - marker: a
    text: Or 'you decree bitter things against me'; the Hebrew literally says 'you write bitter things against me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make me bear the guilt' or 'the punishment' of the iniquities of my youth.' The Hebrew word can denote iniquity, guilt, or its consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 내게 쓴 쓴것들을 기록하시고 내 젊은 시절의 죄악을 내게 유산으로 물려주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 쓴 쓴 판결문들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘내게 쓴 쓴 것들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 젊은 시절의 죄의 책임’을 뜻할 수 있습니다. עָוֹן은 죄악, 죄책, 그 결과를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְתֹּב עָלַי
  english_pob_choice: you write ... against me
  chosen_korean: 내게 쓴
  alternatives_korean:
  - 내게 기록하신
  - 내게 써 두신
  - 내게 대하여 쓰신
  lexicon: HALOT
  rationale: כתב의 기본 의미인 ‘쓰다’를 살리면서, עַל + 1인칭 목적격의 대립적 뉘앙스를 문맥상 자연스러운 ‘내게’로 압축했습니다.
- source_word: מְרֹרוֹת
  english_pob_choice: bitter things
  chosen_korean: 쓴것들
  alternatives_korean:
  - 쓴 것들
  - 쓰디쓴 것들
  - 쓴 일들
  lexicon: HALOT
  rationale: 복수 명사로서 ‘쓴 것들’이 가장 सीधे하며, 재앙·판결·고소 중 어느 것으로도 과도하게 특정하지 않게 합니다.
- source_word: וְתוֹרִישֵׁנִי
  english_pob_choice: and make me inherit
  chosen_korean: 유산으로 물려주십니다
  alternatives_korean:
  - 상속받게 하십니다
  - 물려주십니다
  - 상속하게 하십니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서, ירש의 ‘유산/상속’ 이미지를 한국어에서 가장 자연스럽게 드러냈습니다.
- source_word: עֲוֺנוֹת נְעוּרַי
  english_pob_choice: the iniquities of my youth
  chosen_korean: 내 젊은 시절의 죄악
  alternatives_korean:
  - 내 젊은 시절의 죄악들
  - 내 젊은 시절의 죄과
  - 내 젊은 시절의 불의
  lexicon: HALOT
  rationale: עָוֹן의 의미 범위(죄, 죄책, 죄과/결과)를 과도하게 좁히지 않으면서도, 한국어에서 문맥상 가장 직접적인 ‘죄악’으로 옮겼습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위
  chosen_reading: ‘죄악’으로 옮기되, 그 죄의 책임과 그 결과를 함께 떠올리게 했습니다.
  alternative_readings:
  - 죄책
  - 죄의 벌
  - 죄과
  rationale: 본문은 청년 시절의 잘못 자체와 그로 인한 부담을 함께 내포할 수 있으므로, 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: 의미의 긴장을 보존합니다.
