base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
  footnotes:
  - marker: a
    text: Or 'you decree bitter things against me'; the Hebrew literally says 'you write bitter things against me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make me bear the guilt' or 'the punishment' of the iniquities of my youth.' The Hebrew word can denote iniquity, guilt, or its consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서는 나를 거슬러 쓰디쓴 것들을 기록하시고, 내 젊은 날의 죄악을 내가 물려받게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 거슬러 쓰디쓴 것들을 정하신다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘나를 거슬러 쓰디쓴 것들을 기록하신다’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 젊은 날의 죄악에 대한 죄책’ 또는 ‘그 죄악에 따른 벌’을 뜻할 수 있습니다. 히브리어 עָוֹן은 죄악, 죄책, 또는 그 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְתֹּב עָלַי
  english_pob_choice: you write ... against me
  chosen_korean: 내게 쓴
  alternatives_korean:
