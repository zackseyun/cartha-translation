  verdict: revise
  source_fidelity: 첫 두 절반은 원문의 구속과 감시 이미지를 충실히 전달합니다. 그러나 ‘내 발바닥 자리’는 히브리어 שָׁרְשֵׁי רַגְלַי(직역하면 ‘내 발들의 뿌리/밑부분’)에 없는 ‘자리’를 보태며, תִּתְחַקֶּה의 새김·표시·경계 설정 이미지를 다소 추상화합니다. ‘발바닥에 표시를 새기십니다’는 원문의 신체 이미지와 동사를 더 직접적으로 보존합니다.
  naturalness: ‘발을 차꼬에 넣으시고’도 이해되지만, 한국어에서는 ‘차꼬에 채우시고’가 구속 기구에 발을 고정하는 뜻을 자연스럽게 나타냅니다. ‘내 발바닥 자리를 표시해 두십니다’는 다소 부자연스럽고 의미 범위가 넓습니다.
  terminology: ‘차꼬’는 סַד의 발을 구속하는 틀이라는 뜻에 적절합니다. ‘지켜보시며’는 שׁמר의 면밀한 감시를 무리 없이 전달합니다. 마지막 구절은 ‘표시를 새기십니다’로 하여 חקה의 표기·새김 의미를 살리고, 경계를 둘러 긋는 가능성은 각주에서 보존하는 것이 적절합니다.
  issues:
