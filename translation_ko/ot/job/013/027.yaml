  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
  footnotes:
  - marker: a
    text: Or 'you trace around the soles of my feet,' preserving the imagery of inscribing or marking a boundary.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 내 발을 차꼬에 넣으시고 내 모든 길을 지켜보시며, 내 발바닥 자리를 표시해 두십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 발바닥의 뿌리/기초’를 가리키는 표현으로, 여기서는 발바닥의 자리를 표시하거나 둘러 경계를 그으는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  english_pob_choice: in the stocks
  chosen_korean: 차꼬에
  alternatives_korean:
  - 족쇄에
  - 구속틀에
  - 발목틀에
  lexicon: HALOT
  rationale: סַד는 발을 묶는 구속 장치로 이해되므로, 현대 한국어에서 그 기능을 가장 분명히 드러내는 ‘차꼬’가 적절합니다.
- source_word: וְתָשֵׂם
  english_pob_choice: you put
  chosen_korean: 넣으시고
  alternatives_korean:
  - 두시고
  - 놓으시고
  - 설치하시고
  lexicon: HALOT
  rationale: 단순히 ‘두다’보다 발을 구속 장치 안에 실제로 넣는 동작을 살려 ‘넣으시고’로 옮겼습니다.
- source_word: וְתִשְׁמוֹר כָּל אָרְחוֹתַי
  english_pob_choice: you watch all my paths
  chosen_korean: 내 모든 길을 지켜보시며
  alternatives_korean:
  - 내 모든 길을 감시하시며
  - 내 모든 길을 살피시며
  - 내 모든 길을 지키시며
  lexicon: HALOT
  rationale: שׁמר의 감시·감찰 뉘앙스를 살리되 한국어에서 자연스럽게 읽히도록 ‘지켜보시며’로 옮겼습니다.
- source_word: עַל שָׁרְשֵׁי רַגְלַי תִּתְחַקֶּה
  english_pob_choice: you mark out the soles of my feet
  chosen_korean: 내 발바닥 자리를 표시해 두십니다
  alternatives_korean:
  - 내 발바닥을 둘러 그으십니다
  - 내 발바닥 둘레를 새기십니다
  - 내 발바닥 자취를 그어 두십니다
  lexicon: HALOT
  rationale: ‘발의 뿌리’라는 직역은 난해하므로, 영어 POB의 해석을 따라 발바닥의 경계나 자리를 ‘표시해 두다’로 옮겨 원문의 형상과 제한의 이미지를 보존했습니다.
theological_decisions:
- issue: 원문 화자의 고난 인식 속에서 하나님을 2인칭으로 직접 호소하는 표현
  chosen_reading: 직접 호소형을 유지해 ‘주께서 … 하십니다’로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘하나님은 … 하십니다’
  - 완곡하게 ‘주께서 … 해 두십니다’
  rationale: 이 절은 욥의 항의와 탄식이 직접 대상에게 향하는 구조이므로, 문법적 2인칭과 긴장감을 유지하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 욥기의 탄식/논쟁 담화 구조
- issue: עַל שָׁרְשֵׁי רַגְלַי의 신체-경계 이미지
  chosen_reading: ‘발바닥 자리를 표시해 두십니다’로 경계 설정의 이미지를 살렸습니다.
  alternative_readings:
  - ‘발바닥을 둘러 그으십니다’
  - ‘내 발밑을 한정하십니다’
  rationale: 동작의 핵심은 발의 움직임을 제한하는 표시이므로, 과도한 해석을 피하면서도 감금·감시의 이미지를 전달하는 표현을 택했습니다.
  doctrine_reference: 시적 이미지의 보존
