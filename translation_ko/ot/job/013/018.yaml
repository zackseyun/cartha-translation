source:
  edition: WLC
  text: הִנֵּה נָ֭א עָרַ֣כְתִּי מִשְׁפָּ֑ט יָ֝דַ֗עְתִּי כִּֽי אֲנִ֥י אֶצְדָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
  footnotes:
  - marker: a
    text: Or 'I know that I will be justified.' The Hebrew verb is forensic and can mean being shown to be in the right.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이제 내가 내 변론을 마련했습니다. 내가 의롭다 함을 받을 줄 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 의롭다 함을 받을 줄 압니다.’ 히브리어 동사는 법정적 의미로, ‘옳다고 인정받다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: See now
  chosen_korean: 보십시오, 이제
  alternatives_korean:
  - 보라, 지금
  - 이제 보십시오
  lexicon: HALOT
  rationale: 히브리어의 주의를 끄는 감탄과 즉시성을 합쇼체로 자연스럽게 살려, 현대 한국어에서 직접적인 호소로 들리도록 옮겼습니다.
- source_word: עָרַכְתִּי מִשְׁפָּט
  english_pob_choice: I have prepared my case
  chosen_korean: 내 변론을 마련했습니다
  alternatives_korean:
  - 내 사건을 준비했습니다
  - 내 소송을 정리했습니다
  lexicon: HALOT
  rationale: 법정 문맥의 מִשְׁפָּט을 추상적인 ‘심판’보다 ‘변론’으로 풀어, 욥이 자기 소송/논증을 하나님 앞에 제시한다는 의미를 드러냈습니다.
- source_word: אֶצְדָּק
  english_pob_choice: will be vindicated
  chosen_korean: 의롭다 함을 받을 줄 압니다
  alternatives_korean:
  - 입증될 줄 압니다
  - 정당하다고 인정받을 줄 압니다
  - 옳다고 판정받을 줄 압니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 사법적·포렌식 의미이므로, 교리적 ‘칭의’로 굳히기보다 ‘의롭다 함을 받다’로 법정적 판정을 살렸습니다.
theological_decisions:
- issue: צדק의 번역이 바울서신식 교리 용어로 읽힐 가능성
  chosen_reading: 욥은 자기 소송에서 하나님 앞에 ‘의롭다 함’을 받을 것이라고 확신한다고 말합니다.
  alternative_readings:
  - 내가 칭의될 줄 압니다
  - 내가 의인으로 선언될 줄 압니다
  rationale: 문맥은 논쟁적 법정 장면이므로, 본문이 말하는 것은 구원론적 교리 진술보다 법정적 무죄/정당 판정입니다.
  doctrine_reference: 'Translation philosophy: preserve the source text’s plain sense; do not import doctrinal claims the text does not make.'
