  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
  footnotes:
  - marker: a
    text: Or 'I know that I will be justified.' The Hebrew verb is forensic and can mean being shown to be in the right.
