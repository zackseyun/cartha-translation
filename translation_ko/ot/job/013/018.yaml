  to: 보십시오, 이제 내가 내 변론을 준비했습니다. 내가 옳다고 판정받을 줄 압니다.[a]
  rationale: ‘보십시오, 이제’는 הִנֵּה נָא의 주의 환기와 강조를 유지했습니다. ‘내 변론을 준비했습니다’는 עָרַכְתִּי מִשְׁפָּט의 법정적 ‘사건/주장을 정리하여 제시할 준비를 하다’는 뜻을 자연스럽게 옮깁니다. ‘옳다고 판정받을 줄 압니다’는 אֶצְדָּק의 법정적 미래 결과를 분명히 하면서도, 본문을 특정 교리 체계의 용어로 제한하지 않습니다. 각주는 실질적인 대안을 제시하도록 바로잡았습니다.
