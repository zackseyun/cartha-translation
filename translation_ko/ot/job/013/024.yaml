  - 저를 주의 원수로 생각하십니까
  lexicon: HALOT
  rationale: חשב의 판단·간주 의미를 ‘여기시다’로 옮겨, POB의 ‘count me as your enemy’가 가진 판정적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 하나님께 대한 직접 질문의 존칭과 시제
  chosen_reading: 하나님께 직접 묻는 탄식으로 보고, 주어와 동사를 높이는 합쇼체를 유지했습니다.
  alternative_readings:
  - 더 평이한 서술형
  - 경어를 약화한 직설형
  rationale: 욥의 탄원은 하나님을 향한 직접 호소이므로, 내용은 날카롭더라도 한국어 형식은 공손한 합쇼체로 유지하는 편이 원문과 서정에 모두 적합합니다.
  doctrine_reference: 시편·욥기 탄식시의 대화체 번역 원칙
