  rationale: 히브리어의 구체적 이미지인 ‘얼굴’을 살려, 하나님의 임재나 호의를 지나치게 풀어 쓰지 않았습니다.
- source_word: תַסְתִּיר
  english_pob_choice: do you hide
  chosen_korean: 숨기시고
  alternatives_korean:
