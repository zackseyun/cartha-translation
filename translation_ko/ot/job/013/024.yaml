  naturalness: ‘어찌하여 … 숨기시고 … 여기십니까?’는 욥기의 탄식에 어울리는 현대 표준어 합쇼체이며, 하나님께 직접 호소하는 문맥에서 존칭도 일관됩니다. ‘주의 얼굴’은 다소 전통적인 성경 문체이지만 현대 독자에게도 명확하고 원문의 시적 이미지를 보존합니다.
  terminology: ‘주’, ‘주의 얼굴’, ‘원수’는 본문의 호칭과 관계적·시적 어휘를 적절히 유지합니다. ‘여기시다’는 חשב의 ‘생각하다, 간주하다, 여기다’라는 의미와 잘 맞으며 교리적으로 과도한 해석을 더하지 않습니다.
