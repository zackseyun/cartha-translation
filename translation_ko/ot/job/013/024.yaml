lexical_decisions:
- source_word: לָמָה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 직접적인 이유 질문을 한국어에서 자연스럽고 격식 있게 드러내는 표현으로 옮겼습니다.
- source_word: פָנֶיךָ
  english_pob_choice: your face
  chosen_korean: 주의 얼굴
