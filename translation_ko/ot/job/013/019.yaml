  text: 누가 나와 다투겠습니까? 그렇다면 저는 잠잠해지고 죽겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이제 저는 잠잠해지고 죽겠습니다.’ 히브리어 עַתָּה는 보통 ‘이제’ 또는 ‘지금’을 뜻하지만, 여기서는 욥의 논증 흐름상 ‘그렇다면’이라는 귀결의 뜻으로 이해하는 견해가 많습니다.
    reason: alternative_reading
