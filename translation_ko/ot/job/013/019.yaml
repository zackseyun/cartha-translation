  text: Who is it that will contend with me? For then I would be silent and die[a].
  footnotes:
  - marker: a
    text: Or, 'For now I would be silent and die.' The Hebrew adverb often means 'now,' but here many understand it in the sense 'then' within Job's argument.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 나와 다투겠습니까? 그러면 저는 침묵하다가 죽겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러면 지금 저는 침묵하다가 죽겠습니다.’ 히브리어의 עַתָּה는 보통 ‘지금’이지만, 여기서는 욥의 논증 흐름에서 ‘그러면’의 뜻으로 이해하는 해석이 널리 받아들여집니다.
    reason: alternative_reading
