    rationale: 각주가 제시해야 할 대안은 עַתָּה를 ‘이제/지금’으로 읽는 경우의 번역입니다. 본문의 ‘그러면’은 바로 그 단어를 조건적 귀결로 이해한 번역이므로 대안 문구에 유지하면 안 됩니다.
