  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
  footnotes:
  - marker: a
    text: Or, more literally, 'Be silent from me, and I will speak; and let whatever may pass over me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 앞에서 잠잠하십시오.[a] 제가 말하게 하십시오. 그리고 무슨 일이 제게 닥치든지 그대로 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나에게서 잠잠하십시오’입니다. 여기서는 욥 앞에서 또는 욥을 향한 말을 멈추라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  english_pob_choice: Be silent
  chosen_korean: 입을 다무시고
  alternatives_korean:
  - 조용히 하십시오
  - 잠잠하십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: חרשׁ의 명령형은 상대가 말을 멈추라는 뜻이므로, 한국어에서는 단순한 상태표현보다 직접적인 행위 요구인 「입을 다무시고」가 자연스럽고 힘이 있습니다.
- source_word: מִמֶּנִּי
  english_pob_choice: before me
  chosen_korean: 제 말을
  alternatives_korean:
  - 저에게서
  - 제 앞에서
  - 저를 향해
  lexicon: HALOT
  rationale: 직역하면 「저에게서」이지만, 문맥상 욥이 자기 앞의 논쟁을 멈추게 하는 뜻이므로 한국어에서는 관계적·담화적 기능을 살려 「제 말을」로 옮겼습니다.
- source_word: וַאֲדַבְּרָה אָ֑נִי
  english_pob_choice: and let me speak
  chosen_korean: 제가 말하게 하십시오
  alternatives_korean:
  - 그러면 제가 말하겠습니다
  - 제가 말하게 해주십시오
  - 제가 말할 것입니다
  lexicon: HALOT
  rationale: 코호르타티브의 의지·요청 뉘앙스를 살려, 단순 미래보다 상대에게 발화 허용을 요청하는 「제가 말하게 하십시오」로 표현했습니다.
- source_word: וְיַעֲבֹר עָלַי מָה־
  english_pob_choice: then let come upon me what may
  chosen_korean: 그러면 제 위에 무엇이 닥치든지 닥치게 두십시오.
  alternatives_korean:
  - 그러면 제게 무엇이 닥치든지 그대로 두십시오
  - 그러면 제 위로 무엇이 지나가든지 두십시오
  - 그러면 무슨 일이 제게 닥치더라도 두십시오
  lexicon: HALOT
  rationale: עבר + עלי의 관용적 용법은 단순히 ‘지나가다’보다 ‘닥치다/임하다’가 한국어에서 더 정확하며, مָה의 불특정성을 살려 「무엇이 닥치든지」로 옮겼습니다.
theological_decisions:
- issue: 욥의 자기위임적 어조
  chosen_reading: 마지막 절반은 단순 허용이 아니라, 진실을 말한 뒤 어떤 결과가 와도 감수하겠다는 결연한 태도로 읽었습니다.
  alternative_readings:
  - 그저 어떤 일도 일어나게 두라는 소극적 체념
  - 위험을 감수하겠다는 법정적·대결적 선언
  rationale: 문맥상 욥은 변론을 마치고자 하며, 히브리어의 명령·코호르타티브 배열은 수동적 체념보다 강한 결단을 드러냅니다.
  doctrine_reference: 문맥 주해
- issue: 직접 화법의 높임
  chosen_reading: 욥이 동료들에게 말하는 장면이므로 평서체가 아니라 정중한 명령형 합쇼체를 사용했습니다.
  alternative_readings:
  - 반말형 명령
  - 중립적 서술형
  rationale: 현대 한국어 독자에게 원문의 직접성과 긴장을 살리면서도, 성경 본문으로서의 공적 문체를 유지하기 위함입니다.
  doctrine_reference: 번역 문체 원칙
