theological_decisions:
- issue: 욥의 친구들을 향한 날카로운 비난의 수위
  chosen_reading: 완곡하게 낮추지 않고, ‘거짓을 덧바르는 사람들’과 ‘쓸모없는 의사들’이라는 직접적 비판을 유지했습니다.
  alternative_readings:
  - ‘거짓의 회칠꾼들’처럼 완화된 표현
  - ‘무지한 조언자들’처럼 해석적 완화
  rationale: 본문은 상담의 무능을 넘어 진실을 가리는 행위를 고발하므로, 은유의 공격성을 보존하는 것이 원문의 수사와 기능에 더 충실합니다.
  doctrine_reference: 지혜문학의 논박 수사와 진리/거짓의 윤리
