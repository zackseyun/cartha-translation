    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  english_pob_choice: will surely rebuke
  chosen_korean: 분명히 … 책망하실 것입니다
  alternatives_korean:
  - 반드시 … 꾸짖으실 것입니다
  - 틀림없이 … 책망하실 것입니다
  - 분명히 … 질책하실 것입니다
  lexicon: HALOT
  rationale: 미완료형+부정사 절대형의 강조를 한국어에서는 ‘분명히’로 살리고, יכח의 책망/책망하다 의미는 문맥상 ‘책망하실 것입니다’가 가장 자연스럽습니다.
- source_word: בַּסֵּתֶר
  english_pob_choice: in secret
  chosen_korean: 은밀히
  alternatives_korean:
  - 비밀리에
  - 숨은 데서
  - 감추어져서
  lexicon: HALOT
  rationale: ‘숨은/감추어진 상태에서’라는 장소·상태 부사를 한국어 관용에 맞게 ‘은밀히’로 옮기면 간결하면서도 행동 방식의 뉘앙스를 유지합니다.
- source_word: פָּנִים תִּשָּׂאוּן
  english_pob_choice: show partiality
  chosen_korean: 편파적으로 대하신다면
  alternatives_korean:
  - 사람을 가려 대하신다면
  - 특별히 봐주신다면
  - 치우쳐 대하신다면
  lexicon: HALOT
  rationale: 직역인 ‘얼굴을 들어 올리다’는 한국어에서 의미가 전달되지 않으므로, 고정 관용구의 뜻인 편애/편파를 드러내는 표현으로 옮겼습니다. 다만 ‘판단에서의 편파성’이 핵심이므로 ‘편파적으로 대하다’가 가장 적절합니다.
theological_decisions:
- issue: 히브리어 관용구 נשׂא פנים의 윤리적·사법적 의미
  chosen_reading: 하나님의 책망은 은밀한 편파성을 향한다는 경고로 읽었습니다.
  alternative_readings:
  - 하나님이 너희를 불공평하게 대하시는 것을 책망하신다
  - 하나님이 너희의 사람을 보고 대함을 책망하신다
  rationale: 문맥상 욥이 친구들의 하나님 편들기/변론의 공정성 문제를 지적하는 자리이므로, 단순한 감정적 편애가 아니라 판단과 변호에서의 편파성을 드러내는 번역이 원문의 긴장을 잘 보존합니다.
  doctrine_reference: Translation philosophy §5–6; 공정한 재판/편파 금지의 성경적 윤리
