id: JOB.13.8
reference: Job 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/פָנָ֥י/ו תִּשָּׂא֑וּ/ן אִם לָ/אֵ֥ל תְּרִיבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
  footnotes:
  - marker: a
    text: Literally, 'Will you lift up his face?'—a Hebrew idiom meaning to show partiality or favoritism.
    reason: lexical_alternative
  - marker: b
    text: Or 'Will you plead on God’s behalf?'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 좋다고 해서 편들어 주시겠습니까? 하나님을 위해 변론하시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴을 들어 주시겠습니까?’라는 관용구로, 여기서는 편파적으로 대한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님을 위해 변론하다’는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו / תִּשָּׂאוּן
  english_pob_choice: Will you show partiality for him?
  chosen_korean: 그가 좋다고 해서 편들어 주시겠습니까?
  alternatives_korean:
  - 그의 얼굴을 들어 주시겠습니까?
  - 그에게 편파적으로 대하시겠습니까?
  - 그에게 호의를 보이시겠습니까?
  lexicon: HALOT
  rationale: ‘얼굴을 들다’라는 직역보다 משפט/논쟁 문맥에서의 관용적 뜻인 ‘편들다, 편파적으로 대하다’를 살렸습니다. 합쇼체로 질문의 압박감을 유지했습니다.
- source_word: לָאֵל
  english_pob_choice: for God
  chosen_korean: 하나님을 위해
  alternatives_korean:
  - 하나님 편에서
  - 하나님을 위하여
  - 하나님을 대신하여
  lexicon: HALOT
  rationale: ל의 목적·이익 의미를 살려 ‘하나님을 위해’로 옮겼습니다. 여기서는 단순한 대상 표지가 아니라 변론의 편들기/대변 성격이 함께 드러납니다.
- source_word: תְּרִיבוּן
  english_pob_choice: Will you contend
  chosen_korean: 변론하시겠습니까?
  alternatives_korean:
  - 다투시겠습니까?
  - 논쟁하시겠습니까?
  - 변호하시겠습니까?
  lexicon: HALOT
  rationale: ריב의 법정적·논쟁적 뉘앙스를 반영해 ‘변론하다’로 옮겼습니다. ‘변호하다’보다 직접적인 분쟁성은 조금 덜하지만, 하나님을 위한 논증이라는 문맥에 자연스럽습니다.
theological_decisions:
- issue: 첫 절의 히브리 관용구를 직역할지, 편파성의 의미로 옮길지
  chosen_reading: ‘그가 좋다고 해서 편들어 주시겠습니까?’로 옮겨, 관용구가 드러내는 편파성 비판을 분명히 했습니다.
  alternative_readings:
  - ‘그의 얼굴을 들어 주시겠습니까?’
  - ‘그에게 호의를 보이시겠습니까?’
  rationale: 욥이 친구들의 변론을 책망하는 문맥상, 관용구를 문자적으로 풀기보다 공정성의 문제를 드러내는 번역이 본문의 공격성을 더 정확히 전달합니다.
  doctrine_reference: 욥기 13:7–10의 논쟁 문맥
