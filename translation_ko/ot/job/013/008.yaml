    issue: 첫 절에 ‘그가 좋다고 해서’라는 인과적 동기가 추가되었습니다.
    rationale: הֲפָנָיו תִּשָּׂאוּן은 ‘그의 얼굴을 들다’라는 편파성 관용구이며, 상대를 좋아한다는 이유를 명시하지 않습니다.
  - severity: low
    issue: 각주 b가 본문 ‘하나님을 위해 변론하시겠습니까?’와 실질적으로 같은 번역을 반복합니다.
    rationale: 영어 감사 기록의 대안은 ‘plead’ 대 ‘contend’의 차이를 보존합니다. 한국어 각주도 ‘다투시겠습니까?’처럼 ריב의 다른 가능한 뉘앙스를 제시하는 편이 유익합니다.
