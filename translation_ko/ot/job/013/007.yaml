  text: Will you speak injustice for God[a], and deceit for him?
  footnotes:
  - marker: a
    text: Or 'on God's behalf' / 'to God' in the first clause, and similarly 'on his behalf' / 'to him' in the second clause. The Hebrew preposition can be understood in more than one way, though the context favors speaking in God's defense.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 위해 불의를 말하시겠습니까? 그분을 위해서는 속임수를 말하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님을 위해’는 히브리어 전치사 ל의 뜻을 따라 ‘하나님 편에서/대변하여’의 의미를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  english_pob_choice: for God
  chosen_korean: 하나님을 위해
  alternatives_korean:
  - 하나님께
  - 하나님 편에서
  - 하나님을 위해서
  lexicon: HALOT
  rationale: ל의 의미가 ‘~을 위하여/대변하여’의 뉘앙스를 가질 수 있으므로, 문맥상 하나님을 변호하는 뜻을 살려 ‘하나님을 위해’로 옮겼습니다.
- source_word: תְּדַבְּרוּ
  english_pob_choice: will you speak
  chosen_korean: 말하시겠습니까
  alternatives_korean:
  - 말하겠습니까
  - 말합니까
  lexicon: HALOT
  rationale: 반문하는 책망의 어조를 살리기 위해 미래형 반문을 자연스러운 합쇼체로 옮겼습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 잘못
  - 불공정
  lexicon: HALOT
  rationale: 윤리적·법적 어감을 함께 지니는 ‘불의’가 히브리어의 무게를 가장 잘 반영합니다.
- source_word: רְמִיָּה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 거짓말
  - 속임
  lexicon: HALOT
  rationale: 명사형의 추상성을 유지하면서 앞절의 ‘불의’와 중복되지 않게 ‘속임수’로 옮겼습니다.
theological_decisions:
- issue: ל의 방향을 ‘to God’로 볼지, ‘for God/on God’s behalf’로 볼지
  chosen_reading: 문맥상 하나님 편에서, 곧 하나님을 변호하는 말로 이해했습니다.
  alternative_readings:
  - 하나님께 말한다
  - 하나님을 향해 말한다
  rationale: 앞뒤 문맥이 친구들의 변론적 태도를 책망하는 흐름이므로, 단순한 발화 대상보다 ‘하나님을 위해’라는 대표/대변 의미를 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
