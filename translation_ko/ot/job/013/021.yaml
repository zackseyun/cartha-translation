  source_fidelity: 히브리어의 두 명령(הַרְחַק, אַל ... תְּבַעֲתַנִּי)과 ‘당신의 손’, ‘당신의 공포/두려움’이라는 직접적 이미지는 유지되어야 합니다. 초안의 ‘주님의 두려움이 저를 무서워하게 하지’는 בעת의 ‘겁나게 하다/떨게 하다’를 부자연스럽고 중복적으로 옮겼습니다.
  naturalness: ‘저를 무서워하게 하지 마시옵소서’는 현대 표준어 합쇼체로 자연스럽지 않으며, ‘두려움이 ... 무서워하게’는 의미가 겹칩니다. ‘저를 떨게 하지 마십시오’가 자연스럽고 원문의 강도를 보존합니다.
  terminology: כַּף는 ‘손’, אֵימָה는 여기서 하나님에게서 오는 ‘공포’로 옮기는 것이 적절합니다. ‘주님의 공포’는 다소 낯선 속격 표현이지만 원문의 수식 관계와 시적 긴장을 보존하며, 각주에서 ‘두려움’을 제시할 수 있습니다.
