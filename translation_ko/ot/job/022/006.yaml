id: JOB.22.6
reference: Job 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תַחְבֹּ֣ל אַחֶ֣י/ךָ חִנָּ֑ם וּ/בִגְדֵ֖י עֲרוּמִּ֣ים תַּפְשִֽׁיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
  footnotes:
  - marker: a
    text: Or 'you seized collateral from your brothers without cause.'
    reason: lexical_alternative
  - marker: b
    text: '''Your brothers'' may refer more broadly to fellow members of the community, not only biological siblings.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 네가 까닭 없이 네 형제들에게서 담보를 잡고, 벌거벗은 이들의 옷을 벗겼기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 형제들에게서 담보를 빼앗았다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 형제들’은 혈연 형제보다 더 넓게 공동체의 구성원들을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַחְבֹּל
  english_pob_choice: you took pledges
  chosen_korean: 담보를 잡다
  alternatives_korean:
  - 저당을 잡다
  - 담보를 취하다
  lexicon: HALOT
  rationale: חבל의 ‘담보/저당을 잡다’라는 의미를 살리되, 현대 한국어에서 자연스럽고 법적 함의가 분명한 표현으로 옮겼습니다.
- source_word: אַחֶיךָ
  english_pob_choice: your brothers
  chosen_korean: 네 형제들
  alternatives_korean:
  - 네 형들
  - 네 동족들
  - 네 동료들
  lexicon: HALOT
  rationale: 직역상 ‘형제들’이지만, 문맥상 혈연만이 아니라 공동체 구성원을 가리킬 수 있으므로 그 뉘앙스를 유지하면서도 한국어에서 자연스럽게 표현했습니다.
- source_word: חִנָּם
  english_pob_choice: for no reason
  chosen_korean: 까닭 없이
  alternatives_korean:
  - 이유 없이
  - 아무 이유 없이
  - 부당하게
  lexicon: HALOT
  rationale: 행위의 무정당성을 드러내는 표현으로, 단순한 ‘무보상’이 아니라 비난의 어조를 보존합니다.
- source_word: תַּפְשִׁיט
  english_pob_choice: stripped
  chosen_korean: 벗겼기
  alternatives_korean:
  - 벗겨 버렸기
  - 홑옷을 벗겼기
  - 빼앗았기
  lexicon: HALOT
  rationale: 히필의 ‘벗기다/벗겨 내다’ 의미를 직접 반영했습니다. 옷을 빼앗는 행위와 결합되어 폭력성을 분명히 합니다.
theological_decisions:
- issue: ‘brothers’의 범위
  chosen_reading: 혈연 형제에 한정하지 않고 공동체 안의 동료 구성원을 포함할 수 있는 표현으로 옮겼습니다.
  alternative_readings:
  - 혈연적 형제만 가리킨다
  - 그냥 ‘동포’로 넓힌다
  rationale: 영어 POB 주석의 문화적 설명을 반영해, 본문이 사회적·공동체적 관계를 겨냥한 고발임을 살리면서도 과도한 해석 확장은 피했습니다.
  doctrine_reference: 구약 지혜문학의 언약 공동체 윤리
