id: JOB.22.3
reference: Job 22:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
  footnotes:
  - marker: a
    text: Or 'delight' for 'pleasure.'
    reason: lexical_alternative
  - marker: b
    text: Or 'profit' for 'gain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전능자에게 당신이 의롭다 하여 무슨 기쁨이 있겠으며, 당신이 자신의 길을 흠없게 한다 하여 무슨 이익이 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무슨 기쁨’은 히브리어 חֵפֶץ의 ‘기쁨/즐거움’ 또는 ‘원함’의 범위를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이익’은 히브리어 בֶּצַע의 ‘이득/수익’ 가능성을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  english_pob_choice: Is it any pleasure
  chosen_korean: 무슨 기쁨이 있겠으며
  alternatives_korean:
  - 무슨 즐거움이 있겠으며
  - 무슨 기쁨이 있습니까
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘기쁨, 즐거움, 욕망’의 범위를 가지므로, 수사 의문문에서는 전능자에게 돌아가는 유익이 없다는 뜻을 살려 ‘무슨 기쁨이 있겠으며’로 옮겼습니다.
- source_word: לְשַׁדַּי
  english_pob_choice: to the Almighty
  chosen_korean: 전능자에게
  alternatives_korean:
  - 전능자를 향해
  - 전능자를 위해
  lexicon: HALOT
  rationale: שַׁדַּי의 관용적 번역인 ‘전능자’를 따르고, לְ는 여기서 대상/수혜의 방향을 나타내므로 ‘에게’가 가장 자연스럽습니다.
- source_word: תִצְדָּק
  english_pob_choice: that you are righteous
  chosen_korean: 당신이 의롭다 하여
  alternatives_korean:
  - 당신이 옳다 하여
  - 당신이 의롭다고 하여
  lexicon: HALOT
  rationale: צדק의 Qal은 여기서 ‘의롭다, 의롭다고 여겨지다’의 뜻이므로, 결과절의 뉘앙스를 살려 ‘의롭다 하여’로 표현했습니다.
- source_word: בֶּצַע
  english_pob_choice: gain
  chosen_korean: 이익이
  alternatives_korean:
  - 유익이
  - 이득이
  lexicon: HALOT
  rationale: בֶּצַע는 경제적 ‘이익/이득/수익’을 뜻하므로, 엘리바스의 수사적 대비를 살리는 중립적 표현인 ‘이익’이 적절합니다.
- source_word: תַתֵּם דְּרָכֶיךָ
  english_pob_choice: you make your ways blameless
  chosen_korean: 당신이 자신의 길을 흠없게 한다
  alternatives_korean:
  - 당신의 길을 온전하게 한다
  - 당신의 삶을 흠없게 한다
  lexicon: HALOT
  rationale: תמם의 사역형은 ‘온전하게 하다, 흠없게 하다’의 의미이므로 도덕적 완전성을 드러내는 ‘흠없게 한다’로 옮겼고, דְּרָכֶיךָ는 삶의 행로를 뜻하는 관용구로 ‘자신의 길’로 살렸습니다.
theological_decisions:
- issue: 이 구절의 수사적 질문이 하나님의 필요 없음만 말하는지, 인간 의로움의 실질적 유익 부재를 말하는지
  chosen_reading: 엘리바스의 주장대로, 인간의 의로움이 전능자에게 어떤 직접적 이익이나 보탬도 되지 않는다는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 하나님이 의를 기뻐하신다는 더 넓은 성경적 진술을 고려해, 단지 하나님의 비의존성을 말하는 것으로 완화하는 읽기
  rationale: 히브리어의 ‘기쁨’과 ‘이익’이 모두 수사적 질문 안에 놓여 있으므로, 본문의 공격적 논지를 약화시키지 않고 엘리바스의 발언 자체를 그대로 드러냈습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
