reference: Job 22:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ֭/מִ/יִּרְאָ֣תְ/ךָ יֹכִיחֶ֑/ךָ יָב֥וֹא עִ֝מְּ/ךָ֗ בַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'because you fear him'; Hebrew literally, 'from/because of your fear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he rebukes you' or 'he corrects you.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'comes with you into judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 그분을 경외하기 때문에, 그분께서 당신을 책망하시고 당신과 재판을 벌이시겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 두려움/경외로부터(또는 때문에)’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘책망하시고’는 ‘꾸짖으시고’ 또는 ‘바로잡으시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘당신과 함께 심판 안으로 들어가다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  english_pob_choice: because of your fear of him
  chosen_korean: 그분을 경외하는 까닭입니까?
  alternatives_korean:
  - 그분을 두려워하는 까닭입니까?
  - 당신의 경외 때문에입니까?
  lexicon: HALOT
  rationale: 히브리어는 ‘~의 두려움/경외로부터’라는 원인적 질문이므로, 한국어에서도 원인을 묻는 형태로 살렸습니다. 문맥상 대상은 하나님이므로 ‘그분’을 덧붙여 자연스럽고 명확하게 했습니다.
- source_word: יֹכִיחֶךָ
  english_pob_choice: he reproves you
  chosen_korean: 그분이 당신을 책망하시며
  alternatives_korean:
  - 그분이 당신을 꾸짖으시며
  - 그분이 당신을 바로잡으시며
  - 그분이 당신과 변론하시며
  lexicon: HALOT
  rationale: יכח는 책망, 꾸짖음, 또는 법정적 다툼을 모두 가질 수 있으나, 뒤의 משפט와 함께 볼 때 도덕적·법정적 힘을 함께 살리는 ‘책망하다’가 가장 균형적입니다.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  english_pob_choice: enters into judgment with you
  chosen_korean: 당신과 함께 심판에 들어가시겠습니까?
  alternatives_korean:
  - 당신과 함께 재판에 들어가시겠습니까?
  - 당신과 함께 판결에 들어가시겠습니까?
  - 당신과 함께 법정에 들어가시겠습니까?
  lexicon: HALOT
  rationale: 직역하면 ‘당신과 함께 그 심판 안으로 들어오다’이므로, 법정 장면을 보존하면서 한국어 관용에 맞게 ‘심판에 들어가다’로 옮겼습니다. ‘with you’는 ‘당신과 함께’로 분명히 했습니다.
- source_word: מִּשְׁפָּט
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  - 법정
  lexicon: HALOT
  rationale: 이 문맥의 משפט는 단순한 추상적 ‘정의’가 아니라 하나님과 사람 사이의 사법적 심문/판결을 가리키므로, 한국어에서는 절차와 판결의 함의를 함께 지니는 ‘심판’이 적절합니다.
theological_decisions:
- issue: 수사적 질문의 힘
  chosen_reading: 엘리바스가 Job의 경외를 이유로 하나님이 책망하신다는 생각을 부정하는 수사적 질문으로 옮깁니다.
  alternative_readings:
  - 중립적인 정보 질문으로 옮김
  - 단정문으로 바꾸어 옮김
  rationale: 히브리어 질문형과 문맥상 반어적 뉘앙스를 유지해야 하므로, 한국어에서도 물음표를 살려 기대 답변이 ‘아니오’임을 드러냈습니다.
  doctrine_reference: Translation philosophy §3
- issue: 지시 대상의 명시
  chosen_reading: 문맥상 생략된 목적어를 ‘그분’으로 밝혀 하나님을 가리키게 했습니다.
  alternative_readings:
  - 목적어를 생략하여 ‘당신의 경외’만 남김
  rationale: 한국어는 원문의 생략된 대상을 그대로 두면 다소 불완전하게 들릴 수 있어, 본문이 가리키는 하나님을 명시해 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §6
