  source_fidelity: 수정이 필요합니다. 히브리어의 하나의 의문문은 ‘당신의 경외 때문에 그가 당신을 책망하고 당신과 재판에 들어가겠느냐’라는 인과 관계를 이루는데, 초안은 이를 두 문장으로 분리하여 첫 문장이 문법적으로 미완성이 되고, 두 번째 문장에는 그 원인 관계가 연결되지 않습니다.
  naturalness: ‘심판에 들어가다’는 한국어에서 다소 비관용적이며, משפט의 법정적 절차 문맥에는 ‘재판을 벌이다’가 자연스럽습니다. 원문의 수사 의문문도 한 문장으로 연결하는 것이 현대 한국어에 적절합니다.
  terminology: יִרְאָה는 문맥상 하나님을 향한 ‘경외’로 적절합니다. יכח는 ‘책망하다’로 유지할 수 있습니다. משפט는 여기서 판결 자체보다 하나님과 욥 사이의 법적 다툼/절차를 가리키므로 ‘재판’이 더 정확합니다.
