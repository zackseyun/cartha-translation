  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: ko
  text: 그들이 하나님께 「우리에게서 떠나십시오」라고 말하고, 「전능하신 분이 그들에게 무엇을 행하실 수 있습니까?」라고 말한 사람들입니다.
  philosophy: formal
lexical_decisions:
- source_word: לָאֵל
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 하나님을
  lexicon: הַאֱלֹהִים → 하나님
  rationale: 대상은 하나님이며, 한국어에서는 여격을 자연스럽게 살려 ‘하나님께’로 옮겼습니다.
- source_word: סוּר מִמֶּנּוּ
  english_pob_choice: Depart from us
  chosen_korean: 우리에게서 떠나십시오
  alternatives_korean:
  - 우리에게서 물러가십시오
  - 우리 곁을 떠나십시오
  lexicon: סוּר → 떠나다/물러가다
  rationale: 직접 인용된 명령형의 거칠고 배척하는 뉘앙스를 살리기 위해 가장 직설적인 ‘떠나십시오’를 택했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 전능하신 하나님
  lexicon: שַׁדַּי → 전능하신 분
  rationale: 야훼 칭호를 한국어에서 과도하게 특정하지 않으면서도 원문의 호칭성을 유지하는 표현입니다.
- source_word: לָמוֹ
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 우리에게
  - 그 사람들에게
  lexicon: לָמוֹ → 그들에게
  rationale: 본문의 최종 지시 대상은 복수의 ‘그들’이며, English POB의 수정본도 이를 반영하므로 한국어도 동일하게 맞췄습니다.
theological_decisions:
- issue: 인용 내부의 명령형 높임말
  chosen_reading: 하나님께 드리는 직접 발화로 보되, 본문이 기록하는 말의 성격상 명령형 높임말 ‘떠나십시오’를 사용했습니다.
  alternative_readings:
  - 떠나라
  - 떠나세요
  rationale: 히브리어 명령형의 공격적·배척적 어조를 살리면서도 합쇼체 본문에 맞추기 위한 절충입니다.
  doctrine_reference: 직접 화법의 화행 유지
