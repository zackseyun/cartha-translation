id: JOB.22.23
reference: Job 22:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם תָּשׁ֣וּב עַד שַׁ֭דַּי תִּבָּנֶ֑ה תַּרְחִ֥יק עַ֝וְלָ֗ה מֵ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
  footnotes:
  - marker: a
    text: Or 'you will be built up' or 'you will be rebuilt.' The Hebrew verb is literally 'be built,' used metaphorically for restoration or reestablishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'wrongdoing' or 'injustice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 전능자께로 돌아오면, 당신은 회복될 것입니다. 또 당신의 장막에서 불의를 멀리하시면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세워질 것입니다’, ‘재건될 것입니다’. 히브리어 동사는 문자적으로는 ‘세워지다’이며, 여기서는 회복이나 재정립을 뜻하는 은유로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잘못’이나 ‘부정’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשׁוּב
  english_pob_choice: you return
  chosen_korean: 당신이 …께로 돌아오면
  alternatives_korean:
  - 당신이 돌아서면
  - 당신이 회개하면
  lexicon: HALOT
  rationale: שוב의 기본 의미인 ‘돌아오다’를 살리면서, 전능자에게로 향하는 움직임을 자연스러운 한국어 조건절로 옮겼습니다. ‘회개하다’는 문맥상 가능하지만 의미를 더 좁힐 수 있어 피했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 샷다이
  lexicon: HALOT
  rationale: 신적 칭호를 번역하는 POB 원칙에 따라 음역보다 의미 번역을 택했습니다. 한국어에서는 ‘전능자’가 가장 간결하고 직역에 가깝습니다.
- source_word: תִּבָּנֶה
  english_pob_choice: you will be restored
  chosen_korean: 당신은 회복될 것입니다
  alternatives_korean:
  - 당신은 세워질 것입니다
  - 당신은 재건될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘세워지다/지어지다’이지만, 사람과 삶의 재정립을 말하는 비유이므로 한국어에서는 ‘회복되다’가 의미를 가장 분명하게 전달합니다.
- source_word: עַוְלָה
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 잘못
  - 불법
  lexicon: HALOT
  rationale: 이 단어는 도덕적·신앙적 차원의 그릇됨을 가리키므로 ‘불의’가 문맥상 가장 적절합니다. POB의 ‘unrighteousness’와도 대응됩니다.
- source_word: מֵאָהֳלֶךָ
  english_pob_choice: from your tent
  chosen_korean: 당신의 장막에서
  alternatives_korean:
  - 당신의 거처에서
  - 당신의 집에서
  lexicon: HALOT
  rationale: ‘tent’의 이미지를 보존해 욥기 특유의 고대 생활상을 살렸습니다. ‘집’으로 풀면 문화적 이미지가 약화됩니다.
theological_decisions:
- issue: תִּבָּנֶה의 은유를 어떻게 처리할지
  chosen_reading: 회복될 것입니다
  alternative_readings:
  - 세워질 것입니다
  - 재건될 것입니다
  rationale: 문자적 은유를 완전히 지우지 않으면서도, 욥기 22:23의 의도인 삶의 재정립과 회복을 현대 한국어 독자가 즉시 이해하도록 옮겼습니다.
  doctrine_reference: Translation philosophy §6; §5 documented exception
- issue: 조건절의 어조를 원문에 맞게 유지할지
  chosen_reading: 만일 …하면
  alternative_readings:
  - 혹시 …한다면
  - 네가 …하면
  rationale: 히브리어 אם의 조건문 구조를 분명히 드러내기 위해 ‘만일 …하면’을 사용했습니다. 직설적인 권면 문맥이지만, 과도한 설교체로 밀어붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1
