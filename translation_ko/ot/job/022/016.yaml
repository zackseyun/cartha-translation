id: JOB.22.16
reference: Job 22:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶֽׁר קֻמְּט֥וּ וְ/לֹא עֵ֑ת נָ֝הָ֗ר יוּצַ֥ק יְסוֹדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/016.yaml
  text: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
  footnotes:
  - marker: a
    text: Or 'were cut down before their time.' The Hebrew verb is difficult and may suggest being seized, shriveled up, or suddenly removed.
    reason: lexical_alternative
  - marker: b
    text: Or 'their foundation was poured out by a river'—that is, overwhelmed or swept away. The Hebrew imagery is compressed.
    reason: lexical_alternative
  - marker: c
    text: The verse may allude specifically to the generation destroyed by the flood, or more generally to the sudden downfall of the wicked.
    reason: cross_reference
translation:
  language: ko
  text: 때 이르게 끌려가고, 그들의 기초가 강물에 씻겨 나간 자들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘때가 이르기 전에 잘려 나간 자들’이라는 뜻일 수 있습니다. 히브리어 동사는 어렵고, 붙잡혀 가거나 쪼그라들거나 갑자기 제거되는 뜻을 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 기초가 강물에 부어졌다’는 뜻일 수 있습니다. 즉 압도당하거나 쓸려 갔다는 의미입니다. 히브리어의 이미지는 압축되어 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 특히 홍수로 멸망한 세대를 가리킬 수도 있고, 더 일반적으로는 악인의 갑작스러운 몰락을 가리킬 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: קֻמְּטוּ
  english_pob_choice: were snatched away
  chosen_korean: 때 이르게 끌려가고
  alternatives_korean:
  - 갑자기 사라지고
  - 끊어지고
  - 낚아채이듯 끌려가고
  lexicon: HALOT
  rationale: 히브리어는 갑작스럽게 제거되거나 끌려가는 느낌을 주므로, 한국어에서는 ‘때 이르게’로 ‘before their time’을 살리고 ‘끌려가고’로 급작스러운 제거의 뉘앙스를 담았습니다.
- source_word: וְלֹא עֵת
  english_pob_choice: before their time
  chosen_korean: 때 이르게
  alternatives_korean:
  - 제때가 아닌
  - 정해진 때가 오기 전에
  - 시기가 이르기 전에
  lexicon: HALOT
  rationale: 관용적으로 ‘not in due time’의 뜻이므로, 현대 한국어에서 자연스러운 ‘때 이르게’로 옮겼습니다.
- source_word: יוּצַק
  english_pob_choice: was washed away
  chosen_korean: 씻겨 나간
  alternatives_korean:
  - 쏟아져 버린
  - 쓸려 간
  - 밀려난
  lexicon: HALOT
  rationale: 직역하면 ‘부어지다’이지만, 대상이 ‘기초’이고 매개가 ‘강물’이므로 무너져 쓸려 가는 이미지를 살려 ‘씻겨 나간’으로 자연스럽게 표현했습니다.
- source_word: יְסוֹדָם
  english_pob_choice: their foundation
  chosen_korean: 그들의 기초
  alternatives_korean:
  - 그들의 터전
  - 그들의 기반
  - 그들의 토대
  lexicon: HALOT
  rationale: 건물의 기초라는 물질적 이미지를 보존해, 물에 의해 무너지는 비유가 선명하게 드러나도록 했습니다.
theological_decisions:
- issue: 이 구절의 물 심판 이미지가 특정 역사 사건인지 여부
  chosen_reading: 특정 사건으로 단정하지 않고, 때 이른 멸망과 압도적인 물의 심판 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 노아 홍수 세대에 대한 직접적 암시
  - 일반적인 악인의 급작스러운 멸망 비유
  rationale: 히브리어와 기존 POB의 영어는 역사적 암시와 일반적 비유를 모두 열어 두므로, 한국어도 그 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 번역은 해석을 과도하게 확정하지 않고 본문이 허용하는 범위의 의미를 유지해야 합니다.
