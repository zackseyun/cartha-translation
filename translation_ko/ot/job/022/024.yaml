  to: 금을 흙먼지[a] 위에 두고, 오빌[c]의 금을 여러 와디[b]의 바위에 두십시오.
  rationale: 원문의 구체적 병행, 곧 ‘금/오빌의 금’과 ‘흙먼지 위/와디의 바위에’를 보존하도록 고쳤습니다. ‘여러’는 נְחָלִים의 복수형을 반영합니다. 바위와 와디의 전치사 관계는 논의의 여지가 있으므로, 단정적인 ‘돌무더기’나 ‘버리다’를 넣지 않고 원문의 ‘두다’와 공간 이미지를 유지했습니다.
