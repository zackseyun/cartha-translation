id: JOB.22.24
reference: Job 22:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
  footnotes:
  - marker: a
    text: Or 'and place gold ore on the dust.' The Hebrew term can denote precious metal or ore, not only refined gold.
    reason: lexical_alternative
  - marker: b
    text: '''Wadis'' refers to seasonal streambeds or torrent-valleys; alternatively, ''streams'' or ''torrent-beds.'''
    reason: cultural_note
  - marker: c
    text: Hebrew 'Ophir,' a place famed for fine gold; thus 'the gold of Ophir.'
    reason: cross_reference
translation:
  language: ko
  text: 금을 흙먼지[a] 위에 두고, 오빌[c]의 금을 여러 와디[b]의 바위에 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흙먼지’는 히브리어 עָפָר로, 흙이나 먼지를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘와디’는 비가 올 때 물이 흐르는 계절성 물길 또는 그 골짜기를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 오빌은 질 좋은 금으로 알려진 지명입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְשִׁית
  english_pob_choice: and lay
  chosen_korean: 두고
  alternatives_korean:
  - 놓고
  - 두십시오
  - 두어
  lexicon: HALOT
  rationale: 문맥상 ‘놓다/두다’의 명령 흐름을 살리되, 한국어에서는 뒤 동작과 자연스럽게 이어지는 연결형 ‘두고’가 가장 매끄럽습니다.
- source_word: עָפָר
  english_pob_choice: the dust
  chosen_korean: 흙
  alternatives_korean:
  - 먼지
  - 흙바닥
  - 티끌
  lexicon: HALOT
  rationale: עָפָר는 먼지보다도 땅의 흙/흙먼지에 가까워, 시적 이미지에서 ‘흙’이 가장 직관적으로 그려집니다.
- source_word: בָּצֶר
  english_pob_choice: gold
  chosen_korean: 보물
  alternatives_korean:
  - 금
  - 금덩이
  - 금광석
  lexicon: HALOT
  rationale: 이 어휘는 정련된 금만이 아니라 귀금속/금원석까지 가리킬 수 있어, 본문의 핵심인 재물 포기를 살리기 위해 ‘보물’로 완화하지 않고 그대로 ‘금’으로 가는 대신, 문맥상 대상이 되는 재물을 넓게 이해할 수 있음을 고려해 해설은 발주석에 남겼습니다.
- source_word: נְחָלִים
  english_pob_choice: the wadis
  chosen_korean: 시내돌들
  alternatives_korean:
  - 와디들
  - 시냇물의 골짜기들
  - 시내바닥들
  lexicon: HALOT
  rationale: 한국어 독자에게 ‘와디’는 생소할 수 있어, 사막의 간헐적 물길이라는 지형감이 살아 있는 ‘시내돌들’로 옮겼습니다.
- source_word: אוֹפִיר
  english_pob_choice: the gold of Ophir
  chosen_korean: 오빌의 금
  alternatives_korean:
  - 오빌 금
  - 오빌의 황금
  lexicon: HALOT
  rationale: 오빌은 고급 금의 산지로 알려진 지명이라, 지명과 금의 결합을 그대로 드러내는 ‘오빌의 금’이 가장 직접적입니다.
theological_decisions:
- issue: 문맥상 이 명령의 방향
  chosen_reading: 재물을 안전하게 보관하라는 뜻이 아니라, 금붙이에 대한 의존을 땅에 버리라는 요청으로 옮겼습니다.
  alternative_readings:
  - 귀금속을 자연 지형에 저장하라는 뜻
  rationale: 바로 뒤 문맥에서 하나님이 참된 보물이 되신다는 흐름을 고려하면, 이 절은 재산 축적보다 포기의 요구로 읽는 것이 자연스럽습니다.
  doctrine_reference: 문맥 우선 원칙, 최적 대응 번역
