id: JOB.22.25
reference: Job 22:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה שַׁדַּ֣י בְּצָרֶ֑י/ךָ וְ/כֶ֖סֶף תּוֹעָפ֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/025.yaml
  text: then the Almighty will be your gold[a], and choice silver for you.
  footnotes:
  - marker: a
    text: Or, 'then the Almighty will be your treasure, and silver in abundance for you.' The Hebrew terms for 'gold' and the qualifier on 'silver' are difficult and may emphasize wealth supplied by God rather than God himself as the treasure.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 전능하신 분이 당신의 금이 되시고, 정금 같은 은이 되실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러면 전능하신 분이 당신의 보물이 되시고, 은이 풍성하게 당신에게 있게 됩니다.’ 히브리어의 ‘금’과 ‘은’의 수식어는 난해하며, 하나님이 친히 보배가 되신다는 뜻보다 하나님이 풍요를 주신다는 뜻을 강조할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: then ... will be
  chosen_korean: 그러면 ... 되실 것입니다
  alternatives_korean:
  - 그리고 ... 되실 것입니다
  - 그리하여 ... 되실 것입니다
  lexicon: HALOT
  rationale: 문맥상 조건에 따른 결과를 나타내므로 단순한 병렬의 ‘그리고’보다 ‘그러면’이 원문의 귀결성을 더 잘 드러냅니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 욥기에서의 신적 호칭을 음역하기보다 의미를 살려 옮겨, 한국어 독자가 곧바로 신적 칭호로 이해하도록 했습니다.
- source_word: בְּצָרֶיךָ
  english_pob_choice: your gold
  chosen_korean: 당신의 금
  alternatives_korean:
  - 당신의 보물
  - 당신의 광석
  - 당신의 방어막
  lexicon: HALOT
  rationale: 이 어형은 난해하지만 시적 평행법상 값진 금속을 가리키는 뜻이 가장 자연스러워 보이며, 영어 POB의 ‘gold’에 따라 한국어로도 직역했습니다.
- source_word: תּוֹעָפֹות
  english_pob_choice: choice silver
  chosen_korean: 정금 같은 은
  alternatives_korean:
  - 풍부한 은
  - 아주 좋은 은
  - 은이 넉넉히
  lexicon: HALOT
  rationale: 희귀어라 뉘앙스가 확정적이지 않으므로, 귀한 은이라는 핵심을 살리면서도 ‘choice silver’의 의미를 무리 없이 담는 표현을 택했습니다.
theological_decisions:
- issue: 하나님 자신이 재물이 되시는지, 하나님이 재물을 주신다는 뜻인지
  chosen_reading: 본문은 전능하신 분 자신을 참된 가치로 제시하는 표현을 살리되, 금과 은의 물질적 풍요를 암시하는 여지도 남깁니다.
  alternative_readings:
  - 하나님이 욥에게 금과 은을 공급하신다는 약속
  - 하나님 자신이 욥의 보배가 되신다는 비유
  rationale: 히브리어 평행 구조가 두 해석을 모두 허용하므로, 한쪽으로 단정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
