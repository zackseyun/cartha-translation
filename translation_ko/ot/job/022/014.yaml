  rationale: 관계대명사적 의미를 덧씌운 ‘그를 가리는’를 ‘그에게는 … 가림막이 되어’로 바로잡고, 원문의 병렬절을 보존했습니다. ‘하늘의 궁창’은 חוּג의 둥근 궁륭 이미지를 자연스럽게 전달하며, 각주에서 ‘하늘의 원’이라는 더 문자적인 대안을 제시합니다.
