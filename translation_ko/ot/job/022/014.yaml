source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
  footnotes:
  - marker: a
    text: Or 'Thick clouds are a covering for him, and he does not see; he walks on the circle of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구름이 그를 가리는 덮개가 되어 그가 보지 못하게 하고, 하늘의 둥근 궁창 위를 걸어다닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “짙은 구름이 그를 가리는 덮개가 되어 그가 보지 못하게 하고, 하늘의 원을 걸어다닙니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבִים
  english_pob_choice: Clouds
  chosen_korean: 구름
  alternatives_korean:
  - 짙은 구름
  lexicon: HALOT
  rationale: 복수 명사로서 기본 의미는 ‘구름’이며, 직전의 ‘가림’ 이미지가 이미 차단성을 드러내므로 과도한 수식 없이 자연스럽게 옮겼습니다.
- source_word: סֵתֶר
  english_pob_choice: a covering
  chosen_korean: 덮개
  alternatives_korean:
  - 가림
  - 숨김
  - 은폐
  lexicon: HALOT
  rationale: 문맥상 하나님에 대한 시각적 차단을 말하므로 추상명사보다 구체적 물건 느낌의 ‘덮개’가 원문의 가시적 이미지를 잘 살립니다.
- source_word: חוּג שָׁמַיִם
  english_pob_choice: the vault of heaven
  chosen_korean: 하늘의 둥근 궁창
  alternatives_korean:
  - 하늘의 원
  - 하늘의 둥근 천
  - 하늘의 궁창
  lexicon: HALOT
  rationale: חוּג는 원/둥근 굴곡의 이미지이고, 현대 한국어에서 ‘궁창’은 성경적 하늘의 아치 이미지를 전달하므로 ‘둥근’으로 형태감을 보완해 번역했습니다.
- source_word: יִתְהַלָּךְ
  english_pob_choice: he walks
  chosen_korean: 걸어다닙니다
  alternatives_korean:
  - 거닙니다
  - 오가십니다
  - 걸으십니다
  lexicon: HALOT
  rationale: 히트파엘의 반복·왕래 뉘앙스를 반영해 단순 ‘걷다’보다 ‘걸어다니다’가 더 잘 맞으며, 본문 화자가 하나님을 지칭하는 문맥이라 존대형을 사용했습니다.
theological_decisions:
- issue: 14절의 주어를 명시할지 여부
  chosen_reading: 직접 ‘하나님’이라 쓰지 않고 ‘그’를 유지했습니다.
  alternative_readings:
  - 하나님이 보지 못하게 하고
  - 주님이 보지 못하게 하고
  rationale: 욥기 22:13-14의 발화 흐름상 엘리바스가 악인의 주장으로 인용하는 구조를 보존하기 위해, 원문의 지시대명사를 살려 담화상의 긴장을 유지했습니다.
  doctrine_reference: 발화자 관점과 인용 구조 보존
