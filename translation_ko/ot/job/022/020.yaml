  source_fidelity: 첫 절의 אִם לֹא는 이 문맥에서 조건절이라기보다 강한 확언으로 쓰였으므로 ‘분명히’는 적절합니다. נִכְחַד는 ‘끊어졌고’로 무난하게 옮겼으며, 난해한 קִימָנוּ를 문맥상 ‘우리를 대적하던 자들’로 처리하고 관련 대안을 각주에 보존한 것도 타당합니다. 다만 וְיִתְרָם에는 앞서 언급된 집단을 가리키는 3인칭 복수 소유 접미사가 있으므로, 본문의 ‘남은 것은’에는 빠진 ‘그들/그들에게’ 지시를 보완해야 합니다.
