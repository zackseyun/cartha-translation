  terminology: ‘대적하던 자들’, ‘끊어졌고’, ‘불이 삼켰습니다’는 문맥과 격식에 적합합니다. קִימָנוּ의 난해성과 וְיִתְרָם의 ‘남은 것/남은 자’ 계열 대안은 각주로 유지합니다.
