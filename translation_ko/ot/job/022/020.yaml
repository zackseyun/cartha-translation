source:
  edition: WLC
  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
  footnotes:
  - marker: a
    text: Hebrew קִימָנוּ is difficult. It may be understood as 'our adversaries/opponents,' as in the main text, or possibly 'our substance/possessions' in some interpretations.
    reason: alternative_reading
  - marker: b
    text: Or 'their remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분명히 우리를 대적하던 자들은 끊어졌고, 그들에게 남아 있던 것은 불이 삼켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קִימָנוּ는 해석이 어렵습니다. 본문처럼 ‘우리를 대적하던 자들’로 볼 수도 있고, 어떤 해석에서는 ‘우리의 소유’ 또는 ‘우리의 재산’으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 남은 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 정녕
  - 참으로
  - 만일 그렇지 않다면
  lexicon: HALOT
  rationale: 여기서는 실제 조건이 아니라 강한 확언이므로, 한국어에서도 조건문이 아니라 확언 부사로 옮기는 것이 자연스럽습니다.
- source_word: נִכְחַד
  english_pob_choice: have been cut off
  chosen_korean: 끊어졌고
  alternatives_korean:
  - 멸망했고
  - 사라졌고
  - 잘려 나갔고
  lexicon: HALOT
  rationale: ‘끊어지다’는 제거·단절의 결과를 간결하게 살리면서, 파괴되어 없어졌다는 수동적 뉘앙스를 유지합니다.
- source_word: קִימָנוּ
  english_pob_choice: our adversaries
  chosen_korean: 우리를 대적하던 자들
  alternatives_korean:
  - 우리의 적들
  - 우리의 대적들
  - 우리에게 맞서던 자들
  lexicon: HALOT
  rationale: 히브리어 형태가 난해하므로, 문맥상 앞뒤의 심판 진술에 가장 잘 맞는 ‘대적하던 자들’로 풀어 옮겼습니다.
- source_word: וְיִתְרָם
  english_pob_choice: what was left of them
  chosen_korean: 남은 것은
  alternatives_korean:
  - 그들의 남은 것
  - 그들의 남은 자들
  - 남아 있던 것
  lexicon: HALOT
  rationale: ‘남은 것’은 יתר의 잔여 의미를 자연스럽게 살리며, 뒤의 ‘불이 삼켰습니다’와도 매끄럽게 연결됩니다.
theological_decisions:
- issue: 심판의 완결성을 나타내는 종결 표현
  chosen_reading: ‘끊어졌고, 남은 것은 불이 삼켰습니다’로 심판의 완결을 직설적으로 표현했습니다.
  alternative_readings:
  - ‘멸망했고, 남은 것은 불이 삼켰습니다’
  - ‘사라졌고, 남은 것을 불이 삼켰습니다’
  rationale: 본문은 대적의 제거와 잔여의 소멸을 병렬적으로 강조하므로, 완곡하게 누그러뜨리지 않고 심판의 종결성을 드러내는 쪽이 원문 효과에 가깝습니다.
  doctrine_reference: 하나님의 공의와 악인에 대한 심판
- issue: ‘우리’의 화자 포함 범위
  chosen_reading: ‘우리’를 그대로 유지해 화자의 공동체적 관점을 반영했습니다.
  alternative_readings:
  - ‘내 적들’
  - ‘그들의 적들’
  rationale: 히브리어의 인칭 소유 표현과 POB의 해석을 따라 공동체적 1인칭을 보존하는 것이 문맥상 자연스럽습니다.
  doctrine_reference: 본문-화자 일치와 시적 발화 보존
