base_translation:
  language: en
  yaml_path: translation/ot/job/022/015.yaml
  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
  footnotes:
  - marker: a
    text: Or 'the path of old' or 'the age-old path.' The Hebrew expression refers to a path long followed in the past, not necessarily to something eternal.
    reason: lexical_alternative
  - marker: b
    text: Or 'evil men' or 'men of iniquity.' The Hebrew phrase is literally 'men of wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사람들이 밟고 지나간 옛길[a][b]을 따르시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옛길’은 ‘옛날부터 있던 길’ 또는 ‘오래전의 길’이라는 뜻으로, 반드시 영원한 길을 가리키는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 사람들’은 히브리어의 문자적 표현으로는 ‘악의 사람들’입니다. ‘악인들’ 또는 ‘불의한 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֹ֣רַח
  english_pob_choice: the path
  chosen_korean: 옛길
  alternatives_korean:
  - 길
  - 경로
  - 옛 경로
  lexicon: HALOT
  rationale: אֹרַח의 핵심 이미지는 사람이 따라가는 ‘길/경로’이며, 문맥상 단순한 지리적 길보다 오랫동안 이어진 삶의 방식이어서 자연스러운 한국어로 ‘옛길’이라 옮겼습니다.
- source_word: עוֹלָ֣ם
  english_pob_choice: ancient
  chosen_korean: 옛
  alternatives_korean:
  - 오래된
  - 예로부터의
  - 영원한
  lexicon: HALOT
  rationale: עוֹלָם은 여기서 영원성이 아니라 오래전부터 이어진 것을 뜻하므로, 시간적 뉘앙스를 살리는 ‘옛’이 적절합니다.
- source_word: תִּשְׁמֹ֑ר
  english_pob_choice: will you keep to
  chosen_korean: 지키시겠습니까
  alternatives_korean:
  - 따르시겠습니까
  - 지키겠습니까
  - 붙드시겠습니까
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/지켜 따르다’의 뜻이 있어, 길을 목적어로 할 때는 ‘지키다’가 한국어 관용에 맞으면서도 ‘keep to’의 의미를 전달합니다.
- source_word: מְתֵי אָֽוֶן
  english_pob_choice: men of wickedness
  chosen_korean: 악인들
  alternatives_korean:
  - 죄악의 사람들
  - 불의한 사람들
  - 죄인들
  lexicon: HALOT
  rationale: 직역하면 ‘악의 사람들’이지만, 한국어에서는 문맥상 도덕적 평가를 분명히 하는 복수형 ‘악인들’이 가장 자연스럽고, POB의 ‘men of wickedness’에 대응됩니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 이 구절은 욥에게 ‘옛길’을 따를지 묻는 수사적 질문으로 읽고, 단순 정보 질문이 아니라 도덕적 선택을 압박하는 표현으로 살렸습니다.
  alternative_readings:
  - 단순한 사실 확인 질문
  - 권유형 진술
  rationale: 히브리어 문맥에서 질문은 비난과 경고의 기능을 가지므로, 한국어도 물음표를 유지해 그 압박감을 드러냈습니다.
  doctrine_reference: 욥기 22장 문맥상 엘리바스의 책망 화법
