id: JOB.22.12
reference: Job 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
  footnotes:
  - marker: a
    text: Or 'in the heights of heaven.' The Hebrew phrase is literally 'the height of heaven.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the head/top of the stars'; the sense is 'the highest stars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 하늘의 높음에 계시지 않습니까? 별들의 꼭대기를 보십시오 — 그 별들이 얼마나 높이 있는지요.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구절은 문자적으로 ‘하늘의 높음’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘별들의 머리/꼭대기’이며, 뜻은 ‘가장 높은 별들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 히브리어 אֱלוֹהַּ의 일반적 단수 신칭을 한국어 표준 신학 용례에 맞게 하나님으로 옮겼습니다. '신'은 일반명사화 위험이 있어 배제했습니다.
- source_word: גֹּבַהּ שָׁמַיִם
  english_pob_choice: in the height of heaven
  chosen_korean: 하늘의 높음에
  alternatives_korean:
  - 하늘의 높이에
  - 하늘의 높은 곳에
  - 하늘의 높이
  lexicon: HALOT
  rationale: 직역하면 '하늘의 높이/높음'이라는 공간적 이미지이므로, 위치감을 살리면서도 한국어에서 자연스러운 '하늘의 높음에'로 옮겼습니다. '높은 곳'은 의미를 다소 풀어 쓰는 표현입니다.
- source_word: רֹאשׁ כּוֹכָבִים
  english_pob_choice: the highest stars
  chosen_korean: 별들의 꼭대기
  alternatives_korean:
  - 별들의 머리
  - 가장 높은 별들
  - 별들의 정상
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 '머리/꼭대기'이지만, 별의 배열과 높이를 말하는 문맥에서는 '꼭대기'가 가장 자연스럽고 원문 이미지도 유지합니다. POB의 'highest stars'를 한국어에서 비유적으로 풀었습니다.
- source_word: רָמּוּ
  english_pob_choice: how lofty they are
  chosen_korean: 얼마나 높이 있는지요
  alternatives_korean:
  - 얼마나 높은지요
  - 얼마나 높이 솟아 있는지요
  - 얼마나 드높은지요
  lexicon: HALOT
  rationale: 동사 רום의 물리적 높이를 살리면서, 감탄적 관찰을 한국어에서 자연스럽게 표현했습니다. '드높다'는 문체는 가능하지만 다소 문어적 장식이 강합니다.
theological_decisions:
- issue: 이 구절의 질문 형식과 감탄 구조를 어떻게 처리할 것인가
  chosen_reading: 수사적 질문과 뒤따르는 관찰의 감탄을 그대로 살려, 엘리바스의 발언이 지닌 수사성을 보존했습니다.
  alternative_readings:
  - 단정문으로 바꾸어 하나님의 초월성을 설명적으로 제시하기
  - 하나님과 별의 높이를 비교하는 해설을 덧붙이기
  rationale: 히브리어 הֲלֹא는 기대하는 동의를 전제하는 수사적 질문이며, כִּי와 רָמוּ는 별들의 높이에 대한 관찰적 감탄을 이룹니다. 본문이 말하지 않은 신학적 결론을 덧붙이지 않고 원문의 수사와 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
