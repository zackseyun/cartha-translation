base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
  footnotes:
  - marker: a
    text: Or, 'He delivers the innocent one'; the Hebrew of the first line is difficult, and some take the phrase differently.
    reason: alternative_reading
  - marker: b
    text: Literally, 'through the cleanness of your hands,' an idiom for innocence or moral purity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 죄 없는 사람이라도 건져 내시고, 당신의 손의 깨끗함으로 말미암아 그가 건짐을 받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 죄 없는 사람을 건져 내신다’로 볼 수도 있습니다. 이 히브리어의 첫 행은 어렵고, 일부는 다르게 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘당신의 손의 깨끗함을 통해’이며, 이는 무죄 또는 도덕적 정결을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  english_pob_choice: delivers
  chosen_korean: 건져 내시고
  alternatives_korean:
  - 구원하시고
  - 구해 내시고
  - 벗어나게 하시고
  lexicon: HALOT
  rationale: 피엘형 מלט의 ‘빠져나오게 하다/구해 내다’ 의미를 살리면서, 문맥상 자연스러운 능동 서술로 옮겼습니다.
- source_word: אִי נָקִי
  english_pob_choice: even one who is not innocent
  chosen_korean: 죄 없는 사람이라도
  alternatives_korean:
  - 무죄한 사람이라도
  - 결백한 사람이라도
  - 죄 없는 자라도
  lexicon: HALOT
  rationale: 본문이 난해하므로 POB의 해석을 따라 ‘무죄/결백’ 계열을 살리되, 역설적 강조를 위해 ‘라도’를 써서 ‘심지어…까지’의 뉘앙스를 반영했습니다.
- source_word: בְּבֹר כַּפֶּיךָ
  english_pob_choice: through the cleanness of your hands
  chosen_korean: 당신의 손의 깨끗함으로 말미암아
  alternatives_korean:
  - 당신의 손의 순결로
  - 당신의 손의 정결로
  - 당신의 손의 깨끗함을 통해
  lexicon: HALOT
  rationale: 손의 ‘깨끗함’이 무죄와 도덕적 정결을 가리키는 관용구이므로, 직역을 유지하되 현대 한국어에서 이해 가능한 조사 구조로 옮겼습니다.
theological_decisions:
- issue: 첫 번째 행의 난해한 문구 해석
  chosen_reading: ‘죄 없는 사람이라도’로 옮겨, 하나님이 무죄한 사람뿐 아니라 그렇지 않은 사람까지도 건져 내신다는 취지를 살렸습니다.
  alternative_readings:
  - ‘죄 없는 사람을’
  - ‘무죄한 땅을’
  rationale: 히브리어 구문이 난해하므로, 본문의 긴장을 풀어버리지 않고 POB의 전통적 이해를 따라 번역했습니다. 이 절은 엘리바스의 주장으로 읽히므로, 신학적 단정 대신 발화의 의미를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
