  source_fidelity: 수정이 필요합니다. 난해한 첫 구절 אִי נָקִי는 POB가 채택한 해석에 따라 ‘무죄하지 않은 사람’(not innocent)을 뜻하는데, 초안의 ‘죄 없는 사람이라도’는 정반대인 ‘innocent’를 본문으로 삼았습니다. 대안 독해는 각주로 유지해야 합니다.
  naturalness: ‘무죄하지 않은 사람까지도’는 현대 표준 한국어의 격식 있는 문체에서 의미가 명료하며, ‘그가 건짐을 받을 것입니다’도 수동형 원문의 의미를 보존합니다. ‘당신의 손의 깨끗함’은 다소 직역적이지만 의도적으로 관용 표현을 보존한 것으로 이해 가능합니다.
  terminology: נָקִי의 법정·도덕적 의미에는 ‘무죄’가 적절합니다. בְּבֹר כַּפֶּיךָ는 ‘당신 손의 깨끗함을 통하여’로 옮겨 원문의 수단 표현과 손의 정결이라는 비유를 보존했습니다.
