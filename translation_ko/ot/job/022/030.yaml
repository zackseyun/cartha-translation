  - marker: a
    text: Or, 'He delivers the innocent one'; the Hebrew of the first line is difficult, and some take the phrase differently.
    reason: alternative_reading
  - marker: b
    text: Literally, 'through the cleanness of your hands,' an idiom for innocence or moral purity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 무죄하지 않은 사람까지도 건져 내시고, 당신 손의 깨끗함을 통하여 그가 건짐을 받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 무죄한 사람을 건져 내신다’로 볼 수 있습니다. 히브리어 첫 행은 난해하며, 이 구절을 다르게 이해하는 이들도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘당신 손의 깨끗함을 통하여’는 무죄 또는 도덕적 정결을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  english_pob_choice: delivers
  chosen_korean: 건져 내시고
  alternatives_korean:
