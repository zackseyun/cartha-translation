  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
  footnotes:
  - marker: a
    text: Or 'Can a man profit God? For the one with insight profits himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 하나님께 유익이 될 수 있겠습니까? 참으로 지혜로운 사람은 자신에게 유익을 줍니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 하나님께 이익이 될 수 있겠습니까? 참으로 통찰 있는 사람은 자신에게 이익을 줍니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְאֵל
  english_pob_choice: Can ... to God?
  chosen_korean: 하나님께 유익이 될 수 있겠습니까?
  alternatives_korean:
  - 하나님께 이로울 수 있겠습니까?
  - 하나님께 도움이 될 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사 의문문이 사람의 행동이 하나님께 이익이 되는지 묻는 구조이므로, 한국어에서는 자연스러운 가능형 의문으로 옮겼습니다.
- source_word: יִסְכָּן
  english_pob_choice: be of use
  chosen_korean: 유익이 될 수 있겠습니까
  alternatives_korean:
  - 도움이 될 수 있겠습니까
  - 이로울 수 있겠습니까
  lexicon: HALOT
  rationale: סכן의 핵심 의미를 ‘유익/이로움’으로 잡아, 상업적 뉘앙스를 피하면서도 하나님께 무언가를 보탤 수 있느냐는 뜻을 살렸습니다.
- source_word: גָּבֶר
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 인간
  lexicon: HALOT
  rationale: 여기서는 일반적 인간을 가리키는 대표적 용법이므로, 성별 표지를 과도하게 강조하지 않는 ‘사람’으로 옮겼습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: the one who is wise
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 분별 있는 사람
  - 통찰 있는 사람
  - 깨달은 사람
  lexicon: HALOT
  rationale: 분사형 שכל의 의미를 살리되 한국어에서는 서술적 명사구보다 자연스러운 ‘지혜로운 사람’이 본문 흐름을 가장 잘 전달합니다.
theological_decisions:
- issue: 지혜의 유익이 하나님이 아니라 인간 자신에게 돌아간다는 대비
  chosen_reading: 본문은 사람이 하나님께 유익을 줄 수 없다는 수사적 부정을 유지하고, 지혜의 실제 유익은 사람 자신에게 돌아간다고 말합니다.
  alternative_readings:
  - 두 번째 절을 단순히 ‘지혜로운 사람은 자기에게 유익하다’로만 읽을 수도 있습니다.
  rationale: 히브리어 평행법이 하나님과 인간의 대조를 분명히 하므로, 그 긴장을 완화하지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
