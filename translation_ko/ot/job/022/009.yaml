  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
  footnotes:
  - marker: a
    text: Or 'empty-handed.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the arms of orphans'; 'arms' may also imply their strength or power.
    reason: lexical_alternative
  - marker: c
    text: Or 'the fatherless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 과부들을 빈손으로 돌려보내고, 고아들의 팔은 부러졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '빈손으로.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '고아들의 팔'이라고 말하며, '팔'은 그들의 힘이나 권세를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '부친 없는 자들.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  english_pob_choice: widows
  chosen_korean: 과부들
  alternatives_korean:
  - 미망인들
  lexicon: HALOT
  rationale: 사회적·경제적 취약성을 드러내는 일반 명사로, 문맥의 고발조를 자연스럽게 살리기 위해 '과부들'로 옮겼습니다.
- source_word: שִׁלַּחְתָּ רֵיקָם
  english_pob_choice: sent away empty
  chosen_korean: 빈손으로 돌려보내고
  alternatives_korean:
  - 빈 채로 돌려보내고
  - 아무것도 없이 내보내고
  lexicon: HALOT
  rationale: '''보내다/내보내다''의 강한 추방 뉘앙스보다, 부당하게 돌려보낸다는 비난을 드러내는 ''돌려보내다''가 문맥에 맞습니다. ''empty''는 한국어에서 관용적으로 ''빈손으로''가 가장 자연스럽습니다.'
- source_word: זְרֹעוֹת
  english_pob_choice: arms
  chosen_korean: 팔은
  alternatives_korean:
  - 힘은
  - 권세는
  lexicon: HALOT
  rationale: 기본적인 신체 이미지를 보존하면서, 본문이 암시할 수 있는 힘의 상징성도 함께 남기기 위해 직역에 가깝게 '팔'을 선택했습니다.
- source_word: יְתֹמִים
  english_pob_choice: orphans
  chosen_korean: 고아들
  alternatives_korean:
  - 아비 없는 자들
  - 부친 없는 아이들
  lexicon: HALOT
  rationale: 현대 한국어에서 즉각 이해되는 대응어로, 사회적 보호가 끊긴 대상을 분명히 하기 위해 '고아들'로 옮겼습니다.
- source_word: יְדֻכָּא
  english_pob_choice: were crushed
  chosen_korean: 부러졌습니다
  alternatives_korean:
  - 짓눌렸습니다
  - 산산이 부서졌습니다
  lexicon: HALOT
  rationale: 히브리어의 '부수다/짓누르다' 계열 의미를 살리되, '팔'과의 결합에서 한국어로 가장 자연스럽고 충격적인 결과 상태를 드러내기 위해 '부러졌습니다'로 옮겼습니다.
theological_decisions:
- issue: 시적 병행에서 ‘팔’의 이미지가 단순 신체 묘사인지, 힘의 상징인지
  chosen_reading: 본문은 고아들의 실제 ‘팔’이라는 이미지와 그들의 무력함/힘의 상실을 함께 드러내는 시적 표현으로 유지했습니다.
  alternative_readings:
  - '''힘이 꺾였다''처럼 완전히 비유로 풀어 옮길 수 있습니다.'
  - '''권세가 꺾였다''처럼 사회적 의미를 강조할 수 있습니다.'
  rationale: 히브리어는 구체적 이미지와 상징적 함의를 동시에 허용하므로, 한국어도 직설적 이미지 '팔'을 보존해 독자가 본문의 충격을 직접 느끼도록 했습니다.
  doctrine_reference: 시적 이미지의 보존과 문맥상 사회적 약자에 대한 폭력 고발
