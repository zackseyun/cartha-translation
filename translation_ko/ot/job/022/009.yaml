    rationale: דכא의 수동형은 ‘짓눌리다, 부서지다, 꺾이다’의 범위를 지니며, 여기서는 고아들의 ‘팔’이 상징할 수 있는 힘의 억압도 포함합니다. ‘짓눌렸습니다’는 이를 더 충실히 보존합니다.
