  verdict: revise
  source_fidelity: 첫 절의 ‘과부들을 빈손으로 돌려보내셨고’는 אַלְמָנוֹת שִׁלַּחְתָּ רֵיקָם을 충실하게 옮깁니다. 다만 יְדֻכָּא는 ‘짓누르다/부수다’의 수동 의미이므로, 단순히 골절을 뜻하기 쉬운 ‘부러졌습니다’보다 ‘짓눌렸습니다’가 원문의 폭력적이고 비유적인 범위를 더 잘 보존합니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘과부’와 ‘고아’는 본문의 사회적으로 취약한 집단을 가리키는 통상적 성경 한국어이며, 본문에서는 무리 없이 이해됩니다.
  terminology: ‘팔’은 זְרֹעוֹת의 구체적 이미지를 유지하며 힘·능력이라는 비유적 함의도 열어 둡니다. ‘고아’는 현대어로 자연스럽지만 히브리어의 ‘아버지 없는 이들’이라는 가능한 더 좁은 의미는 각주로 밝혀야 합니다.
