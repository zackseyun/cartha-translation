    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  english_pob_choice: Please, receive
  chosen_korean: 부디 … 받으십시오
  alternatives_korean:
  - 받으십시오
  - 받아 주십시오
  - 부디 … 받아들이십시오
  lexicon: WLC + EN POB audit
  rationale: 청유의 נָא를 '부디'로, לקח의 명령형을 현대 공손체 명령인 '받으십시오'로 옮겨 권면의 어조를 살렸습니다.
- source_word: תּוֹרָה
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 율법
  - 가르침
  - 교도
  lexicon: HALOT
  rationale: 욥기의 문맥에서는 모세 율법보다 권위 있는 훈계·가르침의 뜻이 강하므로, POB의 'instruction'에 맞춰 '교훈'으로 옮겼습니다.
- source_word: וְשִׂים אֲמָרָיו
  english_pob_choice: lay up his words
  chosen_korean: 그의 말씀들을 당신의 마음에 간직하십시오
  alternatives_korean:
  - 그의 말씀들을 당신의 마음에 두십시오
  - 그의 말을 마음에 저장하십시오
  - 그의 말씀들을 마음에 쌓아 두십시오
  lexicon: HALOT
  rationale: '''마음에 두다''의 관용을 살리되, 저장·보존의 이미지를 드러내는 ''간직하십시오''를 택해 ''lay up''의 축적 뉘앙스를 반영했습니다.'
- source_word: בִּלְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 당신의 마음에
  alternatives_korean:
  - 당신의 심장에
  - 당신의 속에
  - 당신의 중심에
  lexicon: HALOT
  rationale: 히브리어 '마음'은 사고와 의지의 내적 중심을 가리키므로, 직설적이면서도 자연스러운 '마음'을 유지했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: '''교훈''으로 옮겨, 특정한 율법 조항보다 지혜문맥의 권위 있는 가르침을 가리키게 했습니다.'
  alternative_readings:
  - 율법
  - 가르침
  rationale: 엘리바스의 권면에서 תּוֹרָה는 시내산 율법의 전문용어라기보다 받아들여야 할 권위 있는 지시를 뜻하므로, 문맥상 과도한 법제화 없이 전달하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms, or documented exception.'
