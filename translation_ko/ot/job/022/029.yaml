revisions:
- from: 그들이 낮아질 때에 주께서 말씀하시기를 “일으키십시오!” 하시며, 눈이 처진 사람을 구원하십니다.[a][b]
  to: 그들이 낮아질 때[a], 당신은 “높아질 것입니다!”라고 말할 것이며, 눈을 내리뜬 사람을 구원하십니다.[b]
  rationale: 2인칭 동사 ‘당신은 말할 것이며’를 복원하여 원문의 발화 주체를 바로잡았습니다. גֵּוָה의 논쟁적·생략적 성격은 본문에서 ‘높아질 것입니다!’라는 선언으로, 각주에서 ‘높아짐이 있다!’라는 보다 문자적인 대안으로 유지했습니다. 3인칭 남성 단수 ‘구원하십니다’의 암시된 주어는 명시하지 않았습니다.
