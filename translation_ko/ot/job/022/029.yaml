    issue: וַתֹּאמֶר의 주어가 ‘주께서’로 바뀜
    rationale: 히브리어 동사는 2인칭 단수 여성형이며, 문맥상 엘리바스가 욥에게 ‘당신은 말할 것입니다’라고 하는 표현입니다. 3인칭이신 하나님을 이 동사의 주어로 삼을 수 없습니다.
  - severity: high
