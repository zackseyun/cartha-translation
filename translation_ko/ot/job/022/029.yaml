  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
  footnotes:
  - marker: a
    text: Or, 'For when they are cast down, you say, “There is lifting up!”' The Hebrew clause is elliptical and may be rendered more literally this way.
    reason: alternative_reading
  - marker: b
    text: Literally, 'the downcast of eyes'; that is, the humble or dejected person.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 낮아질 때[a], 당신은 “높아질 것입니다!”라고 말할 것이며, 눈을 내리뜬 사람을 구원하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 내던져질 때, 당신은 ‘높아짐이 있다!’라고 말할 것입니다.” 히브리어 구절은 생략적이어서 이렇게 더 문자적으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘눈이 낮은 사람’이라는 뜻으로, 겸손하거나 낙심한 사람을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For when
  chosen_korean: ~할 때에
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - ~할 경우
  lexicon: HALOT
  rationale: 원문의 כִּי는 앞절의 약속에 대한 근거·상황을 여는 말이므로, 한국어에서는 자연스러운 조건·상황 연결인 “~할 때에”로 옮겼습니다.
- source_word: הִשְׁפִּילוּ
  english_pob_choice: they are brought low
  chosen_korean: 낮아질 때에
  alternatives_korean:
  - 겸손해질 때에
  - 끌어내려질 때에
  - 비천해질 때에
  lexicon: HALOT
  rationale: שׁפל의 피엘/상황 표지는 ‘낮아지다, 낮아지게 되다’의 상태를 가리키므로, 자발적 자기비하보다 피동적 저하를 드러내는 표현을 택했습니다.
- source_word: גֵּוָה
  english_pob_choice: Lift them up!
  chosen_korean: 일으키십시오!
  alternatives_korean:
  - 높이십시오!
  - 들어 올리십시오!
  - 올라가게 하십시오!
  lexicon: HALOT
  rationale: 문맥상 ‘낮아짐’의 반대말로서 회복·고양을 뜻하는 압축적 구절이므로, 한국어에서는 축약된 외침을 살려 “일으키십시오!”로 자연스럽게 풀었습니다.
- source_word: וְשַׁח עֵינַיִם
  english_pob_choice: the one with downcast eyes
  chosen_korean: 눈이 처진 사람
  alternatives_korean:
  - 눈을 내리깐 사람
  - 낮아진 눈의 사람
  - 겸손한 사람
  lexicon: HALOT
  rationale: 직역하면 ‘눈이 낮은/처진’이므로, 이미지와 의미를 함께 살리기 위해 “눈이 처진 사람”을 선택했습니다. 해석적 일반화인 ‘겸손한 사람’은 피했습니다.
- source_word: יוֹשִׁעַ
  english_pob_choice: he saves
  chosen_korean: 구원하십니다
  alternatives_korean:
  - 구해 주십니다
  - 건져 주십니다
  - 구원합니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘구하다/구원하다’이며, 문맥상 주어는 암시된 하나님이므로 한국어에서는 존칭 주어를 보충하지 않고 종결만 공손하게 처리했습니다.
theological_decisions:
- issue: 암시된 주어(יוֹשִׁעַ)
  chosen_reading: 주어를 명시하지 않고, 문맥상 하나님이 하시는 구원을 한국어 동사 어미로만 드러냈습니다.
  alternative_readings:
  - ‘하나님이 구원하십니다’로 명시
  - ‘그가 구원하십니다’로 대명사 보완
  rationale: 히브리어의 간결함을 보존하면서, 본문에 없는 명시적 명사를 덧붙여 해석을 과도하게 고정하지 않기 위함입니다.
  doctrine_reference: 원문 우선 원칙; 암시된 신적 주어는 문맥으로 유지
