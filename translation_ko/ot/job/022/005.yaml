source:
  edition: WLC
  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
  footnotes:
  - marker: a
    text: Or 'your wickedness.' The Hebrew term can also mean 'calamity' in some contexts, but here the parallel with 'your iniquities' points to moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is no limit to your iniquities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 악은 어찌 그리 크며, 네 죄악에는 끝이 없습니다?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 문맥에 따라 ‘재난’도 뜻하지만, 여기서는 바로 뒤의 ‘네 죄악들’과의 평행 때문에 ‘악’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 קֵץ는 ‘끝’ 또는 ‘한계’로도 옮길 수 있습니다. 여기서는 한국어 표현을 자연스럽게 하기 위해 ‘끝’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: 어찌 그리 … 입니까?
  alternatives_korean:
  - 과연 … 아닙니까?
  - … 아닙니까?
  lexicon: HALOT
  rationale: 반어적 수사를 살리기 위해 단순 진술보다 놀람과 비난이 함께 드러나는 표현으로 옮겼습니다.
- source_word: רָעָתְךָ
  english_pob_choice: your evil
  chosen_korean: 네 악
  alternatives_korean:
  - 네 악행
  - 네 죄악
  - 네 사악함
  lexicon: HALOT
  rationale: 문맥상 재난이 아니라 도덕적 악을 가리키므로, ‘악’으로 간결하게 옮겨 원문과 POB의 moral evil 판단을 반영했습니다.
- source_word: רַבָּה
  english_pob_choice: abundant
  chosen_korean: 어찌 그리 크며
  alternatives_korean:
  - 풍부하며
  - 많으며
  - 막대하며
  lexicon: HALOT
  rationale: 히브리어의 ‘크다/많다/풍성하다’의 규모감을 한국어에서 자연스럽게 살리기 위해 크다는 표현을 택했습니다.
- source_word: לַעֲוֺנֹתֶיךָ
  english_pob_choice: to your iniquities
  chosen_korean: 네 죄악에는
  alternatives_korean:
  - 네 죄들에는
  - 네 불의에는
  - 네 죄과에는
  lexicon: HALOT
  rationale: עָוֹן의 강한 도덕적·법정적 뉘앙스를 유지하려고 ‘죄악’을 사용했고, ‘끝이 없다’는 관용구에 맞게 조사를 자연스럽게 조정했습니다.
theological_decisions:
- issue: רָעָתְךָ의 의미를 재난이 아닌 도덕적 악으로 볼지 여부
  chosen_reading: 욥의 고난을 설명하는 말이 아니라, 엘리바스가 욥에게 죄책을 돌리는 도덕적 비난으로 읽었습니다.
  alternative_readings:
  - 네 재난
  - 네 불행
  rationale: 바로 뒤의 ‘네 죄악들’과의 평행이 도덕적 의미를 강하게 요구하므로, 고난/불행 의미를 배제하고 비난의 어조를 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 요구하는 평행법과 어휘의 도덕적 의미 보존'
