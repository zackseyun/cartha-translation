base_translation:
  language: en
  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
  footnotes:
  - marker: a
    text: Literally, 'man of arm,' an idiom for a powerful or strong man.
    reason: lexical_alternative
  - marker: b
    text: Or 'the honored man,' 'the one shown favor,' or 'the one treated with partiality' for 'the favored man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 땅은 힘 있는 자[a]의 것이었고, 호의를 받는 사람[b]은 그 땅에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘팔의 사람’이지만, 관용적으로 힘이나 권세가 있는 사람을 뜻합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘얼굴이 들린 사람’입니다. 존중이나 호의를 받는 사람, 또는 특별 대우를 받는 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ זְרוֹעַ
  english_pob_choice: the strong man
  chosen_korean: 강한 자
  alternatives_korean:
  - 힘센 사람
  - 권세 있는 사람
  - 팔 힘 있는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘팔의 사람’이지만, 관용적으로 ‘힘 있는 사람/강한 자’라는 뜻이므로 현대 한국어에서 자연스럽고 의미를 보존하는 표현으로 옮겼습니다.
- source_word: ל֣וֹ הָאָרֶץ
  english_pob_choice: the land belonged to
  chosen_korean: 땅은 ...의 것이었고
  alternatives_korean:
  - 그 땅이 ...의 것이었고
  - 그 땅은 ...에게 속했고
  - 땅은 ...의 소유였고
  lexicon: HALOT
  rationale: לְ + 대명사는 소유·지배를 나타내므로, ‘~의 것’으로 번역해 소속과 통제의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: וּנְשׂוּא פָנִים
  english_pob_choice: the favored man
  chosen_korean: 은총을 받은 사람
  alternatives_korean:
  - 은혜를 입은 사람
  - 존귀한 사람
  - 편애를 받은 사람
  lexicon: HALOT
  rationale: 직역 가능한 ‘얼굴이 들린 사람’은 한국어 관용으로 어색하므로, favor/partiality의 양면성을 모두 살릴 수 있는 ‘은총을 받은 사람’으로 옮겼습니다.
- source_word: יֵשֶׁב בָּהּ
  english_pob_choice: lived in it
  chosen_korean: 그 땅에 살았습니다
  alternatives_korean:
  - 그 땅에 거주했습니다
  - 그 땅에 머물렀습니다
  - 그 안에 살았습니다
  lexicon: HALOT
  rationale: יָשַׁב의 기본적 의미를 반영하되, 문맥상 토지 점유를 자연스럽게 말하는 현대 한국어 표현으로 다듬었습니다.
theological_decisions:
- issue: ‘favored man’의 가치 판단 여부
  chosen_reading: 문맥상 ‘은총/호의를 입은 사람’으로 중립적으로 처리했습니다.
  alternative_readings:
  - ‘편애를 받은 사람’처럼 부정적 뉘앙스를 강화하는 읽기
  - ‘존귀한 사람’처럼 단순 명예를 뜻하는 읽기
  rationale: 히브리어 נְשׂוּא פָנִים은 존중받는 사람일 수도, 편파적으로 대우받는 사람일 수도 있어 문맥상 어느 한쪽으로 과도하게 고정하지 않았습니다.
  doctrine_reference: 본문 관찰과 어휘의 의미 범위
