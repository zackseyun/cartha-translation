translation:
  language: ko
  text: 또는 어둠 때문에 보지 못하고, 많은 물[a]이 당신을 덮습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넘치는 물’ 또는 ‘홍수’. 히브리어 표현은 풍부함이나 넘침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  english_pob_choice: or
  chosen_korean: …이거나
  alternatives_korean:
  - …또는
  - …혹은
  lexicon: HALOT
  rationale: 히브리어 אוֹ는 앞선 재앙과 나란히 이어지는 선택적·병렬적 연결을 이루므로, 한국어에서는 간결한 ‘…이거나’로 옮겨 연결감을 살렸습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 암흑
  - 캄캄함
  lexicon: HALOT
  rationale: 시적 문맥에서 חֹשֶׁךְ의 직접적이고 자연스러운 대응은 ‘어둠’이며, 시야 상실의 이미지를 유지합니다.
- source_word: וְשִׁפְעַת מַיִם
  english_pob_choice: and an abundance of waters
  chosen_korean: 물의 풍부함
  alternatives_korean:
  - 많은 물
  - 물의 넘침
  - 홍수 같은 물
  lexicon: HALOT
  rationale: שִׁפְעָה는 단순한 양의 많음을 뜻할 수 있으므로, 본문은 POB의 선택을 따라 특정한 ‘홍수’로 좁히지 않고 ‘물의 풍부함’으로 보존했습니다.
- source_word: תְּכַסֶּךָּ
  english_pob_choice: covers you
  chosen_korean: 당신을 덮을 것입니다
  alternatives_korean:
  - 당신을 가릴 것입니다
  - 당신을 뒤덮을 것입니다
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 살려 직설적으로 옮겼고, 시적 압박감은 한국어 문맥에서 자연스럽게 드러나도록 했습니다.
theological_decisions:
- issue: 욥기 22:11의 심판적 이미지가 문자적 어둠과 물의 재난을 함께 묘사하는 방식
  chosen_reading: 본문의 이미지를 비유적으로 완화하지 않고, 시각 상실과 압도적 물의 침수를 병렬된 재앙으로 제시했습니다.
  alternative_readings:
  - 어둠을 내면적 혼란으로만 완화하는 해석
  - 물을 단순한 곤란의 상징으로 축소하는 해석
  rationale: 엘리바스의 말은 욥이 피할 수 없는 재앙을 강하게 그리므로, 원문의 감각적·압박적 이미지를 그대로 살리는 편이 본문 의도에 충실합니다.
  doctrine_reference: 시적 심판 경고의 직설성 보존
