  naturalness: ‘지친 사람’, ‘굶주린 사람’, ‘물을 주지 않았고’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽습니다. 두 번째 절은 ‘빵을 주지 않았습니다’가 원문의 고발적 평행법을 자연스럽게 유지합니다.
