id: JOB.22.7
reference: Job 22:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
  footnotes:
  - marker: a
    text: Hebrew 'bread' may also function more broadly as 'food,' but the main text keeps the concrete term used in the source.
    reason: lexical_alternative
translation:
  language: ko
  text: 지친 사람에게 물을 주지 않았고, 굶주린 사람에게서는 빵을 빼앗았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָיֵף
  english_pob_choice: the weary
  chosen_korean: 지친 사람
  alternatives_korean:
  - 피곤한 사람
  - 쇠약한 사람
  - 지친 이들
  lexicon: HALOT
  rationale: 형용사를 명사적으로 처리해 특정 개인이 아니라 일반적인 ‘지친 사람’을 가리키도록 했습니다.
- source_word: תַּשְׁקֶה
  english_pob_choice: you gave ... to drink
  chosen_korean: 물을 주지 않았습니다
  alternatives_korean:
  - 마시게 하지 않았습니다
  - 물을 주어야 했습니다
  - 물을 주지 못하게 했습니다
  lexicon: HALOT
  rationale: 히필의 ‘마시게 하다/물을 주다’라는 사역 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: תִּמְנַע
  english_pob_choice: you withheld
  chosen_korean: 빵을 빼앗았습니다
  alternatives_korean:
  - 빵을 주지 않았습니다
  - 빵을 거두었습니다
  - 빵을 막았습니다
  lexicon: HALOT
  rationale: 단순 미제공보다 더 강한 도덕적 고발의 뉘앙스를 살리되, 한국어로는 ‘빼앗다’가 가장 직설적으로 결핍을 유발한 행위를 드러냅니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 히브리어의 구체적 명사 ‘bread’를 본문에서 그대로 살리되, 현대 한국어에서는 상징성과 일상성을 함께 지닌 ‘빵’이 가장 자연스럽습니다.
theological_decisions:
- issue: 두 번째 절의 행위 묘사 강도
  chosen_reading: ‘withheld’의 의미를 약화시키지 않고 ‘빼앗았습니다’로 옮겨, 단순한 무관심이 아니라 필요한 것을 막아버린 책임을 드러냈습니다.
  alternative_readings:
  - 빵을 주지 않았습니다
  - 빵을 거두었습니다
  rationale: 문맥상 욥에 대한 고발은 윤리적 책임 부재를 넘어 실제 결핍을 초래한 가해성을 띱니다. 한국어에서도 그 긴장을 보존하는 편이 좋습니다.
  doctrine_reference: 성경의 의인/악인 평가와 이웃 사랑의 윤리
