language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֤וּא מִלֵּ֣א בָתֵּי/הֶ֣ם ט֑וֹב וַ/עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
  footnotes:
  - marker: a
    text: Or, less literally, 'with prosperity.' The Hebrew says 'with good,' likely meaning good things or benefits.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''let the counsel of the wicked be far from me.'' The Hebrew more directly reads as a statement: ''the counsel of the wicked is far from me.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들의 집에 좋은 것으로 가득 채우셨지만, 악인들의 계획은 내게서 멉니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 것’은 문자적으로는 ‘좋음’이지만, 문맥상 ‘좋은 것들’이나 ‘유익’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘악인의 계획이 내게서 멀리 있기를’로도 옮길 수 있으나, 히브리어는 더 직접적으로는 진술문입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: Yet he
  chosen_korean: 그가
  alternatives_korean:
  - 그러나 그가
  - 그런데 그가
  lexicon: HALOT
  rationale: 앞 절과의 대조는 접속사 자체보다 문맥에서 드러나므로, 한국어에서는 주어를 살리고 자연스러운 서술문으로 옮겼습니다.
- source_word: מִלֵּא
  english_pob_choice: filled
  chosen_korean: 가득 채우셨습니다
  alternatives_korean:
  - 채우셨습니다
  - 가득하게 하셨습니다
  lexicon: HALOT
  rationale: ‘가득 채우다’는 동사의 충만함을 자연스럽게 살리면서, 단순한 ‘채우다’보다 강조를 유지합니다.
- source_word: טוֹב
  english_pob_choice: with good things
  chosen_korean: 좋은 것으로
  alternatives_korean:
  - 좋은 것들로
  - 복으로
  lexicon: HALOT
  rationale: 히브리어의 ‘좋음’을 한국어에서 가장 सीधे하게 드러내기 위해 ‘좋은 것’ 계열을 택했고, ‘복’은 해석을 더 강하게 개입시킬 수 있어 뺐습니다.
- source_word: וַעֲצַת רְשָׁעִים
  english_pob_choice: the counsel of the wicked
  chosen_korean: 악인들의 계획
  alternatives_korean:
  - 악인들의 조언
  - 악인들의 꾀
  lexicon: HALOT
  rationale: עֵצָה는 상황에 따라 ‘조언’이나 ‘계획’이 될 수 있으나, 문맥상 단순한 충고보다 악한 방향의 의도와 방침이 더 잘 드러나므로 ‘계획’으로 옮겼습니다.
- source_word: רָחֲקָה מֶנִּי
  english_pob_choice: is far from me
  chosen_korean: 내게서 멉니다
  alternatives_korean:
  - 내게서 멀리 있습니다
  - 내게서 멀어졌습니다
  lexicon: HALOT
  rationale: 히브리어는 명령형이 아니라 상태 진술이므로, ‘멀리 하십시오’가 아니라 ‘멀다’의 현재적 상태로 번역했습니다.
theological_decisions:
- issue: 마지막 절의 화자 태도
  chosen_reading: 마지막 절은 기도문이 아니라, 악인의 계획과 자신을 분리하는 진술로 읽었습니다.
  alternative_readings:
  - 악인의 계획이 내게서 멀어지기를
  - 악인의 계획은 내게서 멀리 있으라
  rationale: 히브리어 동사형은 청유나 명령보다 상태 진술에 가깝기 때문에, 한국어에서도 그 분리 선언을 그대로 보존했습니다.
  doctrine_reference: 원문의 문장 유형을 보존하여 해석을 과도하게 신앙고백형으로 바꾸지 않음
