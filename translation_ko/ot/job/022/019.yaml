  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
  footnotes:
  - marker: a
    text: Or 'laugh at them' or 'scoff at them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들은 이것을 보고 기뻐하고, 무죄한 사람은 그들을 비웃습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그들을 보고 웃습니다’ 혹은 ‘그들을 비웃습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰인 집합적 표현이므로, 한국어에서는 간결한 복수형 ‘의인들’이 자연스럽고 문맥의 도덕적 범주를 잘 드러냅니다.
- source_word: יִרְאוּ
  english_pob_choice: see
  chosen_korean: 이것을 보고
  alternatives_korean:
  - 보고
  - 목격하고
  - 살펴보고
  lexicon: HALOT
  rationale: ‘see’는 단순한 시각 행위보다 상황의 결과를 ‘보게 되다’는 의미가 강하므로, 앞뒤 문맥의 파멸 장면을 받아들이는 한국어로 ‘이것을 보고’가 가장 자연스럽습니다.
- source_word: וְנָקִי
  english_pob_choice: the innocent
  chosen_korean: 무죄한 사람
  alternatives_korean:
  - 무죄한 이
  - 결백한 사람
  - 흠 없는 사람
  lexicon: HALOT
  rationale: 단수형이지만 일반적 범주를 가리키므로, 한국어에서는 집합적·서술적 의미를 살려 ‘무죄한 사람’으로 옮겼습니다.
- source_word: יִלְעַג
  english_pob_choice: mock
  chosen_korean: 비웃습니다
  alternatives_korean:
  - 조롱합니다
  - 놀립니다
  - 웃어넘깁니다
  lexicon: HALOT
  rationale: לעג의 경멸적 조롱을 담기 위해 ‘비웃다’를 택했습니다. ‘mock’의 간결하고 날 선 어감을 한국어에서 잘 반영합니다.
theological_decisions:
- issue: 대상 대명사 לָמוֹ의 지시 대상
  chosen_reading: 의인들과 무죄한 사람이 비웃는 대상은 앞문맥에서 말한 악인들입니다.
  alternative_readings:
  - 더 일반적으로 하나님의 심판을 지켜보는 대상에 대한 진술로 볼 수 있습니다.
  rationale: 직접적으로는 앞선 문맥의 악인 멸망을 가리키므로, 본문 밖 설명을 덧붙이지 않고 ‘그들을’로 처리해 문맥상의 대상을 유지했습니다.
  doctrine_reference: 문맥적 지시 대상 보존
