  text: וְֽ/תִגְזַר א֭וֹמֶר וְ/יָ֣קָם לָ֑/ךְ וְ/עַל דְּ֝רָכֶ֗י/ךָ נָ֣גַֽהּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
  footnotes:
  - marker: a
    text: Or 'You will decree a word, and it will stand for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 일을 정하시면, 그 일이 당신에게 이루어질 것이며, 당신의 길에 빛이 비칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 말을 정하시면, 그것이 당신에게 설 것이며’
    reason: 히브리어 אֹמֶר는 ‘말, 발언’을, יָקָם은 문자적으로 ‘서다’를 뜻할 수 있습니다.
lexical_decisions:
- source_word: תִגְזַר אֹמֶר
  english_pob_choice: You will decree a matter
  chosen_korean: 당신이 한 말을 선포하시면
  alternatives_korean:
  - 당신이 한 일을 결정하시면
  - 당신이 말씀을 명하시면
  - 당신이 말을 정하시면
  lexicon: HALOT
  rationale: גזר는 단순한 ‘결정’보다 단호하게 말로 정하고 선포하는 뉘앙스를 가질 수 있으므로, 한국어에서는 ‘선포하다’로 옮겨 결단의 공적·효력적 성격을 살렸습니다. אֹמֶר은 문맥상 ‘말/선언된 내용’으로 읽혀 ‘한 말’로 처리했습니다.
- source_word: יָקָם
  english_pob_choice: it will be established
  chosen_korean: 그것이 당신을 위해 세워질 것이며
  alternatives_korean:
  - 그것이 당신을 위해 서 있을 것이며
  - 그것이 당신을 위해 이루어질 것이며
  - 그것이 당신을 위해 확립될 것이며
  lexicon: HALOT
  rationale: קום의 결과적 의미를 살려 단순한 ‘일어나다’보다 효력이 인정되고 굳어지는 뉘앙스를 한국어 ‘세워지다’로 반영했습니다. POB의 ‘established’와도 잘 맞습니다.
- source_word: נָגַהּ אוֹר
  english_pob_choice: light will shine
  chosen_korean: 빛이 비출 것입니다
  alternatives_korean:
  - 빛이 비칠 것입니다
  - 빛이 환히 비출 것입니다
  - 빛이 빛날 것입니다
  lexicon: HALOT
  rationale: נָגַהּ는 ‘빛나다/비추다’의 밝아짐을 나타내므로, 시적 이미지를 자연스럽게 살리는 ‘빛이 비추다’로 옮겼습니다. 다만 한국어 주체-동사 호응을 위해 ‘빛이 비출 것입니다’로 정리했습니다.
- source_word: דְּרָכֶיךָ
  english_pob_choice: your ways
  chosen_korean: 당신의 길 위에
  alternatives_korean:
  - 당신의 길에
  - 당신의 길들 위에
  - 당신의 행로에
  lexicon: HALOT
  rationale: דרך는 비유적으로 삶의 행로를 뜻하므로, 단순한 공간 ‘길’보다 진행 중인 삶의 방향을 드러내는 표현을 택했습니다. ‘위에’는 뒤따르는 빛의 이미지를 자연스럽게 받쳐 줍니다.
theological_decisions:
- issue: 엘리바스의 발화에 담긴 약속의 강도
  chosen_reading: 문맥의 자신만만한 진술로 옮기되, 무조건적 번영 약속으로 과장하지 않았습니다.
  alternative_readings:
  - 무조건적인 축복의 약속처럼 더 강하게 옮김
  - 단순한 가능성 진술처럼 약하게 옮김
  rationale: 이 절은 엘리바스의 조언 안에 있는 말이므로, 본문이 말하는 확신은 유지하되 책 전체의 신학적 긴장을 지우지 않는 방식이 적절합니다.
  doctrine_reference: 욥기 22장의 화자 구분과 정경적 긴장 보존
