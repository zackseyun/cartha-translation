review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the resultative force of כִּי אָז and retains both core images: delight in Shaddai and lifting one''s face toward God. However, translating שַׁדַּי as ‘전능하신 분’ is less idiomatic and less terminologically stable than the established Korean divine title ‘전능자.’ The phrase ‘전능하신 분 안에서 기뻐하다’ is understandable but is less natural than directly expressing the object of delight in Korean.'
  naturalness: The mixed address ‘네가 … 될 것입니다’ combines an older intimate second-person form with modern 합쇼체 and should be regularized. ‘하나님께로 네 얼굴을 들다’ is comprehensible but somewhat stiff; ‘하나님을 향해 얼굴을 들다’ is natural modern Korean while preserving the concrete idiom.
  terminology: ‘전능자’ is the appropriate standard Korean rendering for שַׁדַּי here. ‘하나님’ suitably renders אֱלוֹהַּ without importing a more specific title. The face-lifting idiom should remain untranslated in the main text, with a restrained explanatory note that does not restrict its sense to prayer or one doctrinal interpretation.
  issues:
  - severity: medium
    issue: Mixed second-person register in ‘네가 … 될 것입니다’
    rationale: ‘네가’ does not align smoothly with the requested modern formal-polite 합쇼체 ending. ‘당신은’ supplies a consistent formal direct address.
  - severity: medium
    issue: ‘전능하신 분’ is a less standard rendering of שַׁדַּי
    rationale: ‘전능자’ is concise, natural, and established Korean biblical terminology for the divine title, without changing its meaning.
  - severity: low
    issue: The wording ‘하나님께로 네 얼굴을 들게 될 것입니다’ is unnecessarily stiff
    rationale: ‘하나님을 향해 얼굴을 들 것입니다’ more naturally marks the Hebrew directional phrase אֶל אֱלוֹהַּ while retaining the idiom.
  revised_text: 그러면 당신은 전능자[a]를 기뻐할 것이며, 하나님을 향해 얼굴을 들 것입니다.[b]
  revised_footnotes:
  - marker: a
    text: ‘전능자’는 히브리어 ‘샷다이’(שַׁדַּי)를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님을 향해 얼굴을 들다’는 하나님께 자신 있게 나아가며 호의를 회복하는 것을 암시할 수 있는 관용적 표현입니다.
    reason: cultural_note
