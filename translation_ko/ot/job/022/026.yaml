base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
  footnotes:
  - marker: a
    text: Or 'take delight in the Almighty.'
    reason: lexical_alternative
  - marker: b
    text: '''Lift up your face to God'' is an idiom that can suggest confident approach, restored favor, or bold prayer.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하면 네가 전능하신 분 안에서 기뻐할 것이며, 하나님께로 네 얼굴을 들게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전능하신 분’은 שַׁדַּי의 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 얼굴을 들다’는 하나님 앞에서의 담대한 접근, 회복된 호의, 자신감 있는 나아감을 나타낼 수 있는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  english_pob_choice: For then
  chosen_korean: 그리하면
  alternatives_korean:
  - 그러면
  - 그때
  lexicon: HALOT
  rationale: 앞선 조건의 결과를 자연스럽게 잇는 인과·결과 표현으로, 직역형 ‘그때’보다 한국어 문맥에서는 ‘그리하면’이 더 명료합니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샷다이
  lexicon: HALOT
  rationale: שַׁדַּי의 표준적 의미를 살리면서도 한국어 독자가 이해할 수 있게 ‘전능하신 분’으로 옮겼습니다.
- source_word: תִּתְעַנָּג
  english_pob_choice: you will delight yourself
  chosen_korean: 기뻐할 것이며
  alternatives_korean:
  - 스스로 즐거워할 것이며
  - 당신 자신 안에서 즐거움을 누릴 것이며
  lexicon: HALOT
  rationale: 히트파엘의 자기-향유/기쁨의 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘기뻐하다’를 택했습니다.
- source_word: וְתִשָּׂא אֶל אֱלוֹהַּ פָּנֶיךָ
  english_pob_choice: and lift up your face to God
  chosen_korean: 하나님께로 네 얼굴을 들게 될 것입니다
  alternatives_korean:
  - 하나님께 네 얼굴을 들게 될 것입니다
  - 하나님을 향해 얼굴을 들게 될 것입니다
  lexicon: HALOT
  rationale: ‘얼굴을 들다’의 관용구를 보존해 하나님 앞에서의 담대한 접근과 회복된 호의를 함께 드러내며, 한국어 어법상 조사 ‘께로’로 방향성을 살렸습니다.
theological_decisions:
- issue: ‘얼굴을 들다’ 관용구의 의미 범위
  chosen_reading: 담대한 접근, 회복된 호의, 자신감 있는 나아감을 모두 열어 둔 채 직유를 유지했습니다.
  alternative_readings:
  - 하나님께 기도하게 될 것입니다
  - 하나님 앞에서 당당해질 것입니다
  - 하나님을 바라보게 될 것입니다
  rationale: 히브리어 관용구의 시적 긴장과 해석의 폭을 좁히지 않기 위해, POB의 방침에 따라 구체적 한 가지 의미로 평탄화하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
