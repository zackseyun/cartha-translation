  rationale: The revision uses consistent modern formal-polite address, replaces the less idiomatic title ‘전능하신 분’ with the standard ‘전능자,’ and makes the directional face-lifting expression natural in Korean. It preserves the Hebrew poetic imagery and the idiom’s open range of confident approach and restored favor.
