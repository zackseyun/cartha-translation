  rationale: 모든 동사를 원문의 미래적 진술 흐름에 맞추고, 마지막 절의 서원 이행 관용구를 자연스러운 현대 한국어로 옮겼습니다. 각주 표지를 해당 어휘인 ‘이행하게 될 것입니다’ 뒤로 옮기고, 문자적 대안을 원문의 인칭·시제에 맞게 수정했습니다.
