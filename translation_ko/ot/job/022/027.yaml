base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
  footnotes:
  - marker: a
    text: Or, more literally, 'you will pay your vows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 기도하십시오[a]. 그러면 그가 당신의 말을 들으실 것이며, 당신은 당신의 서원들을 이루게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 당신의 서원을 갚으십시오/지불하십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר אֵלָיו
  english_pob_choice: You will pray to him
  chosen_korean: 그에게 기도하십시오
  alternatives_korean:
  - 그에게 간청하십시오
  - 그에게 간구하십시오
  lexicon: HALOT
  rationale: 히필 עתר는 간청하다/간절히 기도하다의 뜻이지만, 여기서는 목적어 אֵלָיו와 뒤의 ‘그가 들으실 것이다’와의 평행을 살려 현대 한국어의 자연스러운 ‘기도하십시오’로 옮겼습니다.
- source_word: וְיִשְׁמָעֶךָּ
  english_pob_choice: and he will hear you
  chosen_korean: 그러면 그가 당신의 말을 들으실 것이며
  alternatives_korean:
  - 그러면 그가 당신을 들으실 것이며
  - 그러면 그가 당신의 기도를 들으실 것이며
  lexicon: HALOT
  rationale: שׁמע는 기본적으로 ‘듣다’이므로, 직역에 가깝게 ‘당신의 말을 들으실 것이며’로 옮겨 ‘응답하다’보다 원문의 청취 이미지를 보존했습니다.
- source_word: וּנְדָרֶיךָ תְשַׁלֵּם
  english_pob_choice: and you will fulfill your vows
  chosen_korean: 당신은 당신의 서원들을 이루게 될 것입니다
  alternatives_korean:
  - 당신은 당신의 서원을 갚게 될 것입니다
  - 당신은 당신의 서원을 이행하게 될 것입니다
  lexicon: HALOT
  rationale: נדר의 의무 이행 관용구를 한국어에서는 ‘서원을 이루다’로 자연스럽게 표현할 수 있어, POB의 ‘fulfill’과 המקרא적(성서적) 의무 이행 뜻을 함께 살렸습니다.
theological_decisions:
- issue: 끝 절의 서원 이행을 ‘갚다’로 더 문자적으로 옮길지, 현대 한국어의 관용적 표현으로 옮길지
  chosen_reading: ‘이루다’로 옮겨 서원 이행의 의미를 분명하게 했습니다.
  alternative_readings:
  - ‘갚다’
  - ‘이행하다’
  rationale: 히브리어 관용구는 서원을 실제로 실행한다는 뜻이므로, 한국어에서는 지나치게 금전적으로 들릴 수 있는 ‘갚다’보다 의미가 분명한 ‘이루다’를 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; idiomatic rendering of vow language without loss of covenant obligation.'
