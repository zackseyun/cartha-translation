id: JOB.22.13
reference: Job 22:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
  footnotes:
  - marker: a
    text: Or, 'Does he judge through thick darkness?' The Hebrew imperfect may be read as simple present/future as well as with an implied sense of ability in this rhetorical question.
    reason: alternative_reading
  - marker: b
    text: '''Thick darkness'' can also be rendered ''dark cloud'' or ''gloom.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 당신은 말합니다. ‘하나님께서 무엇을 아십니까? 짙은 어둠[b]을 뚫고 심판하실 수 있습니까?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘짙은 어둠을 뚫고 심판하십니까?’로도 옮길 수 있습니다. 히브리어 미완료형은 단순 현재나 미래로도, 능력의 의미를 내포한 의문으로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘짙은 어둠’은 ‘짙은 구름’ 또는 ‘암흑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: Yet you say
  chosen_korean: 그러면서 당신들은 말합니다
  alternatives_korean:
  - 그러나 당신은 말합니다
  - 그런데 당신들은 말합니다
  lexicon: WLC, discourse context
  rationale: 전후 문맥의 책망/반박 뉘앙스를 살리기 위해 연결어를 넣었고, 집단적 논박의 흐름에 맞춰 복수형 ‘당신들은’으로 자연스럽게 옮겼습니다.
- source_word: מַה יָּדַע אֵל
  english_pob_choice: What does God know?
  chosen_korean: 하나님이 무슨 아십니까?
  alternatives_korean:
  - 하나님이 무엇을 아십니까?
  - 하나님이 무슨 것을 아십니까?
  lexicon: HALOT
  rationale: 질문의 핵심은 지식의 내용 부재를 비꼬는 표현이므로 ‘무슨’으로 옮겨, 하나님의 인식을 의심하는 조롱조의 수사를 살렸습니다.
- source_word: הַבְעַד עֲרָפֶל
  english_pob_choice: through thick darkness
  chosen_korean: 짙은 어둠 너머에서
  alternatives_korean:
  - 짙은 어둠을 통해
  - 짙은 구름 너머에서
  - 짙은 어둠 속에서
  lexicon: HALOT
  rationale: ‘עֲרָפֶל’은 단순한 어둠보다 짙고 가려진 상태를 가리키므로, 심판의 시야를 가리는 장벽감을 살려 ‘너머에서’로 표현했습니다.
- source_word: יִשְׁפּוֹט
  english_pob_choice: Can he judge
  chosen_korean: 심판하실 수 있습니까
  alternatives_korean:
  - 심판하십니까
  - 심판하시겠습니까
  lexicon: HALOT
  rationale: 영어 POB의 해석대로 히브리어 미완료형의 능력 뉘앙스를 살려 가능형으로 옮겼습니다. 한국어에서는 문맥상 행위보다 능력에 대한 의문이 더 자연스럽습니다.
theological_decisions:
- issue: 둘째 절의 미완료형을 단순 현재/미래가 아니라 ‘능력’ 의문으로 옮길지 여부
  chosen_reading: ‘심판하실 수 있습니까?’로 옮겨, 하나님이 어둠 때문에 실제로 심판할 수 없다는 회의적 발언의 힘을 보존했습니다.
  alternative_readings:
  - ‘심판하십니까?’
  - ‘심판하시겠습니까?’
  rationale: 문맥에서 엘리바스는 하나님이 인간의 일에 관심 없다는 불경한 말을 인용하고 있으므로, 단순 진행보다 능력에 대한 의심을 드러내는 번역이 원문의 신학적 긴장을 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
