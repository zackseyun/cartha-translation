  terminology: ‘하나님’, ‘심판하다’, ‘짙은 어둠’은 문맥과 한국어 성경 문체에 적절합니다. עֲרָפֶל의 다른 가능한 뜻은 각주에서 ‘짙은 구름’과 ‘암흑’으로 제시합니다.
