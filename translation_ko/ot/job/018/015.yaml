  text: תִּשְׁכּ֣וֹן בְּ֭/אָהֳל/וֹ מִ/בְּלִי ל֑/וֹ יְזֹרֶ֖ה עַל נָוֵ֣/הוּ גָפְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
  footnotes:
  - marker: a
    text: Or, 'In his tent dwells what is no longer his'; the Hebrew syntax is difficult and may imply that an alien presence occupies his tent after his downfall.
    reason: alternative_reading
  - marker: b
    text: 'Traditional English: ''brimstone'' for ''sulfur.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 천막 안에는 더 이상 그의 것이 아닌 것이 머뭅니다[a]. 그의 거처 위에는 유황이 흩뿌려집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그의 천막 안에는 더 이상 그의 것이 아닌 것이 머뭅니다.’ 히브리어 구문은 어렵고, 그의 몰락 뒤에 낯선 존재가 그의 천막을 차지한다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  english_pob_choice: dwells
  chosen_korean: 머뭅니다
  alternatives_korean:
  - 거합니다
  - 깃듭니다
  lexicon: HALOT
  rationale: שכן의 거주 이미지를 살리되, 한국어에서는 상태의 지속을 자연스럽게 드러내는 ‘머뭅니다’가 가장 무리 없습니다.
- source_word: בְּאָהֳלוֹ
  english_pob_choice: in his tent
  chosen_korean: 그의 천막 안에는
  alternatives_korean:
  - 그의 천막에
  - 그의 장막 안에는
  lexicon: HALOT
  rationale: אֹהֶל의 구체적 이미지를 살려 ‘천막’으로 옮기고, 위치를 분명히 하기 위해 ‘안에는’를 붙였습니다.
- source_word: מִבְּלִי לוֹ
  english_pob_choice: no longer his
  chosen_korean: 더 이상 그의 것이 아닌 것
  alternatives_korean:
  - 더 이상 그의 것이 아닙니다
  - 그의 것이 아닌 것
  lexicon: HALOT
  rationale: 문법적으로 압축된 구절이므로, ‘그의 것’의 상실을 드러내면서도 외부 존재를 과도하게 덧붙이지 않는 방향으로 옮겼습니다.
- source_word: גָפְרִית
  english_pob_choice: sulfur
  chosen_korean: 유황
  alternatives_korean:
  - 황
  - 브림스톤
  lexicon: HALOT
  rationale: גָפְרִית의 현대 한국어 표준 대응은 ‘유황’이며, 전통적 ‘브림스톤’은 의미는 같지만 현대 독자에게는 낯섭니다.
theological_decisions:
- issue: מִבְּלִי לוֹ의 해석 범위
  chosen_reading: 소유의 상실과 퇴거를 말하는 표현으로 이해하고, ‘더 이상 그의 것이 아닌 것’으로 번역했습니다.
  alternative_readings:
  - ‘그의 것이 아닌 낯선 존재가’라는 식의 해석
  - ‘그의 것이 전혀 남아 있지 않다’는 해석
  rationale: 히브리어는 매우 압축되어 있어 외부 점유자를 명시할 수도 있지만, 본문이 분명히 말하는 것은 그 사람의 소유 관계가 끊어졌다는 점입니다. 이를 넘어서지 않도록 했습니다.
  doctrine_reference: 본문 문맥의 재앙/심판 이미지
