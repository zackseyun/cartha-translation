translation:
  language: ko
  text: 분명히 이런 자들이 악인의 거처이며, 하나님을 알지 못하는 자의 장소입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님을 알지 못하는 자의 장소’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 참으로
  - 과연
  - 오직
  lexicon: HALOT
  rationale: 절을 강하게 단정하는 어조이므로, 제한의 뜻인 ‘오직’보다 결론적 강조를 드러내는 ‘분명히’가 자연스럽습니다.
- source_word: מִשְׁכְּנוֹת
  english_pob_choice: dwellings
  chosen_korean: 거처
  alternatives_korean:
  - 거주지
  - 장막
  - 주거
  lexicon: HALOT
  rationale: 복수 의미를 유지하면서도 현대 한국어에서 자연스럽고, 해당 대상의 정주 공간을 무리 없이 드러냅니다.
- source_word: עַוָּל
  english_pob_choice: the unjust
  chosen_korean: 악인
  alternatives_korean:
  - 불의한 자
  - 부정한 자
  - 불의한 사람
  lexicon: HALOT
  rationale: 영어 POB가 ‘the unjust’로 법적·도덕적 성격을 살렸지만, 한국어 성서 문맥에서는 ‘악인’이 동일한 도덕적 범주를 가장 자연스럽게 전달합니다.
- source_word: לֹא יָדַע אֵל
  english_pob_choice: one who does not know God
  chosen_korean: 하나님을 알지 못하는 자
  alternatives_korean:
  - 하나님을 모르는 자
  - 하나님을 알지 못한 사람
  - 하나님을 알지 못하는 이
  lexicon: HALOT
  rationale: ‘알다’는 단순 인지가 아니라 관계적·언약적 앎을 포함하므로, 직역성을 유지한 채 인칭을 자연스럽게 한국어화했습니다.
theological_decisions:
- issue: ‘알지 못하다’의 의미 범위
  chosen_reading: 하나님에 대한 단순 무지보다 관계적·도덕적 무지를 함께 내포하는 표현으로 유지함
  alternative_readings:
  - 단순히 하나님에 대해 모른다는 의미
  - 종교 지식이 부족하다는 뜻
  rationale: 지혜문학의 ‘알다’는 하나님과의 올바른 관계를 포함하므로, 의미를 좁히지 않고 원문 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
