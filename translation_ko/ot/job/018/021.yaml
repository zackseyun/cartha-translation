- from: 분명히 이런 자들이 악인의 거처이며, 하나님을 알지 못하는 자의 장소입니다.[a][b]
  to: 분명히 이것들은 불의한 자[a]의 거처들이며, 이것은 하나님을 알지 못하는 자의 곳[b]입니다.
  rationale: 원문의 지시사 복수 אֵלֶּה와 명사 복수 מִשְׁכְּנוֹת를 ‘이것들은 … 거처들이며’로 보존하고, 뒤따르는 단수 지시사 וְזֶה와 מְקוֹם은 ‘이것은 … 곳입니다’로 반영했습니다. ‘불의한 자’는 עַוָּל의 불의·부정의 의미를 직접 보존하며, 각주들은 실제 대안 어휘에 정확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:42:57Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘이런 자들이 … 거처’는 히브리어의 지시사 복수(אֵלֶּה)가 가리키는 ‘이것들’과 ‘거처들’을 뒤바꾸어, 사람들이 거처라는 뜻이 되게 합니다. 원문은 ‘이것들은 불의한 자의 거처들이며, 이것은 하나님을 알지 못하는 자의 곳’이라는 병렬입니다.
  naturalness: ‘이것들은 … 거처들이며, 이것은 … 곳입니다’는 원문의 복수/단수 대조와 결론적 어조를 보존하면서 현대 표준 한국어로 자연스럽습니다. ‘분명히’는 אַךְ의 강조를 적절히 반영합니다.
  terminology: עַוָּל은 법적·도덕적 불의의 뉘앙스를 보존하도록 ‘불의한 자’로 옮기는 것이 적절합니다. אֵל은 ‘하나님’, לֹא יָדַע은 해석을 덧붙이지 않은 ‘알지 못하는 자’로 유지합니다. 각주 a는 해당 어휘에, 각주 b는 ‘곳’이라는 어휘 선택에 연결하도록 바로잡습니다.
  issues:
  - severity: high
    issue: 주어와 보어의 관계가 역전되었습니다.
    rationale: ‘이런 자들이 악인의 거처’는 원문의 ‘이것들은 불의한 자의 거처들’과 달리 사람들을 거처로 서술합니다. 또한 원문의 복수 거처(מִשְׁכְּנוֹת)도 드러나지 않습니다.
  - severity: medium
    issue: 각주 a의 본문 연결과 내용이 일치하지 않습니다.
    rationale: 본문은 이미 ‘악인’을 사용하면서 각주는 ‘악인’이라는 대안을 제시하고, 표지도 문장 끝에 붙어 있습니다. 본문을 ‘불의한 자’로 하고 해당 낱말에 각주를 붙여야 합니다.
  - severity: medium
    issue: 각주 b는 본문과 동일한 표현을 대안으로 제시합니다.
    rationale: 현재 본문이 이미 ‘하나님을 알지 못하는 자의 장소’이므로 동일 문구를 대안으로 제시할 수 없습니다. מְקוֹם의 자연스러운 대안인 ‘거처’를 제시하고 ‘곳’에 표지를 붙입니다.
  revised_text: 분명히 이것들은 불의한 자[a]의 거처들이며, 이것은 하나님을 알지 못하는 자의 곳[b]입니다.
