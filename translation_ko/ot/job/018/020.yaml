  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל י֭וֹמ/וֹ נָשַׁ֣מּוּ אַחֲרֹנִ֑ים וְ֝/קַדְמֹנִ֗ים אָ֣חֲזוּ שָֽׂעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
  footnotes:
  - marker: a
    text: Hebrew 'his day,' likely meaning the day of his calamity or judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'later ones ... former ones'; some understand the pair geographically as 'those in the west ... those in the east.'
    reason: alternative_reading
  - marker: c
    text: Literally 'seize shuddering,' an idiom for being gripped with horror.
    reason: lexical_alternative
translation:
  language: ko
  text: 뒤에 오는 자들은 그의 날을 보고 경악하고, 앞서 간 자들은 공포에 사로잡힙니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그의 날'이며, 보통 그의 재앙이나 심판의 날을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: '''뒤에 오는 자들 … 앞서 간 자들''은 경우에 따라 ''서쪽 사람들 … 동쪽 사람들''로 이해되기도 합니다.'
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 '전율을 붙잡다'라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יוֹמוֹ
  english_pob_choice: at his day
  chosen_korean: 그의 날을 보고
  alternatives_korean:
  - 그의 날에
  - 그의 날 때문에
  - 그의 날로 인해
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '그의 날에/그의 날에 대하여'이지만, 문맥상 재앙이나 심판의 날을 보고 반응하는 뜻이므로 한국어에서는 대상 인지를 드러내는 '보고'로 자연스럽게 옮겼습니다.
- source_word: נָשַׁמּוּ
  english_pob_choice: are appalled
  chosen_korean: 경악하고
  alternatives_korean:
  - 놀라고
  - 아연실색하고
  - 황망해하고
  lexicon: HALOT
  rationale: 이 동사는 충격을 받아 멍해지는 강한 반응을 나타내므로, 현대 한국어에서 그 강도를 살리는 '경악하다'가 적절합니다.
- source_word: אַחֲרֹנִים
  english_pob_choice: those who come after
  chosen_korean: 뒤에 오는 자들
  alternatives_korean:
  - 후대 사람들
  - 나중 세대
  - 뒤따르는 이들
  lexicon: HALOT
  rationale: 문맥상 시간적 대비가 가장 자연스러우므로, 지시 대상을 살리되 간결한 '뒤에 오는 자들'로 옮겼습니다.
- source_word: אָחֲזוּ שָׂעַר
  english_pob_choice: are seized with horror
  chosen_korean: 공포에 사로잡힙니다
  alternatives_korean:
  - 전율에 사로잡힙니다
  - 전율을 붙잡힙니다
  - 소름에 붙들립니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 '떨림/오싹함에 붙잡히다'는 뜻이므로, 한국어에서는 결과 상태를 자연스럽게 드러내는 '공포에 사로잡히다'로 표현했습니다.
theological_decisions:
- issue: אַחֲרֹנִים / קַדְמֹנִים의 대비가 시간적인지 지리적인지
  chosen_reading: 시간적 대비로 이해하여 '뒤에 오는 자들'과 '앞서 간 자들'로 번역했습니다.
  alternative_readings:
  - 서쪽 사람들 / 동쪽 사람들
  - 후대 사람들 / 선대 사람들
  rationale: 문맥에서 더 직접적인 대조는 시간 순서이며, 본문이 전달하려는 충격의 확산을 가장 자연스럽게 보여 줍니다.
  doctrine_reference: 해석학적 문맥 판단
