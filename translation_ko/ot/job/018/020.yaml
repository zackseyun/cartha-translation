  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
  footnotes:
  - marker: a
    text: Hebrew 'his day,' likely meaning the day of his calamity or judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'later ones ... former ones'; some understand the pair geographically as 'those in the west ... those in the east.'
    reason: alternative_reading
  - marker: c
    text: Literally 'seize shuddering,' an idiom for being gripped with horror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 날을 두고[a] 뒤에 오는 자들은 경악하며, 앞선 자들은[b] 전율에 사로잡힙니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 날’이며, 보통 그의 재앙이나 심판의 날을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뒤에 오는 자들 … 앞선 자들’은 경우에 따라 ‘서쪽 사람들 … 동쪽 사람들’로 이해되기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 사람들이 ‘전율’을 붙잡는다고 하며, 전율 또는 공포에 사로잡힘을 나타내는 관용 표현입니다.
    reason: lexical_alternative
