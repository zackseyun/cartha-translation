theological_decisions:
- issue: 명령형의 화자 태도와 공손도
  chosen_reading: 직접적인 책망과 도전의 어조를 유지하기 위해 합쇼체 명령형 ‘이해하십시오’를 사용했습니다.
  alternative_readings:
  - 분별하십시오
  - 알아들으십시오
  rationale: 욥기 18장 2절은 빌닷의 날카로운 반문이므로, 완곡하게 누그러뜨리기보다 발화의 공격성을 드러내는 공적 명령문이 적절합니다.
  doctrine_reference: 문맥적 화행 보존
- issue: וְאַחַר נְדַבֵּר의 발화 뉘앙스
  chosen_reading: ‘우리가 말하겠습니다’로 단순 미래를 우선하되, 한국어 문맥상 후속 발화의 예고로 읽히게 했습니다.
  alternative_readings:
  - 말합시다
  - 그 후에 말하겠습니다
  rationale: POB가 지적한 대로 이 동사는 초청 또는 단순 미래로 들릴 수 있으나, 여기서는 먼저 이해를 요구한 뒤 이어 말하겠다는 순차적 진술을 보존하는 편이 더 안정적입니다.
  doctrine_reference: 문맥적 다의성 보존
