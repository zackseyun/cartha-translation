base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
  footnotes:
  - marker: a
    text: Or 'How long will you set limits to words?' The Hebrew phrase is difficult, and some take it as a complaint about endless talk rather than verbal entrapment.
    reason: lexical_alternative
  - marker: b
    text: Or 'then let us speak.' The final verb may be heard as an invitation as well as a simple future.
    reason: lexical_alternative
translation:
  language: ko
  text: 언제까지 너희가 말로 함정을 파겠습니까?[a] 이해하십시오. 그 후에 우리가 말하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말에 한계를 정하겠습니까?’로도 옮길 수 있습니다. 히브리어 구절은 난해하며, 일부는 이를 끝없이 이어지는 말에 대한 불평으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그런 다음 말합시다.’로도 읽을 수 있습니다. 마지막 동사는 단순 미래뿐 아니라 초청으로도 들릴 수 있습니다.
    reason: lexical_alternative
