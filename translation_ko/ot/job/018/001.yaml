lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하고
  lexicon: HALOT
  rationale: 서술형 대화 도입 공식에서 ענה는 ‘대답하다/응답하다’의 뜻이므로, 문어체 합쇼체에서 자연스러운 ‘대답하여’로 옮겼습니다.
- source_word: בִּלְדַּד הַשֻּׁחִי
  english_pob_choice: Bildad the Shuhite
  chosen_korean: 드드 사람 빌닷
  alternatives_korean:
  - 수아 사람 빌닷
  - 슈히 사람 빌닷
  lexicon: HALOT
  rationale: בילדד은 통용되는 한국어 성경 인명인 ‘빌닷’을 따르고, הַשֻּׁחִי는 지명/족속 표지로서 전통적으로 알려진 ‘드드 사람’이 가장 자연스럽고 식별 가능합니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하여 이르렀습니다
  lexicon: HALOT
  rationale: 두 번째 서술동사 אמר를 한국어에서 중복 표현으로 살려 ‘말했습니다’로 옮겨, 히브리어의 ‘대답하고 말하다’라는 관용적 도입 공식을 반영했습니다.
- source_word: וַ
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그리고
  lexicon: HALOT
  rationale: 문두 waw의 서사 진행 기능을 한국어 서술문에서 자연스럽게 드러내는 시간적 접속어로 ‘그때’를 선택했습니다.
