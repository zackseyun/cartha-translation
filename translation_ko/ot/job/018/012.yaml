  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
  footnotes:
  - marker: a
    text: Or 'ready for his stumbling.' The Hebrew word may be understood as 'side' or, by extension in some interpretations, 'stumbling/limping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 힘은 굶주리고, 재난이 그의 곁에[a] 준비되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 넘어짐에 대비하여.’ 히브리어 צלע는 ‘곁’ 또는 ‘옆’을 뜻할 수 있으며, 일부 해석에서는 ‘절뚝거림’이나 ‘넘어짐’의 뜻으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי רָעֵב אֹנוֹ
  english_pob_choice: His strength is famished
  chosen_korean: 그의 힘은 기근에 시달리고
  alternatives_korean:
  - 그의 힘은 굶주리고
  - 그의 힘은 배고프고
  lexicon: HALOT
  rationale: רָעֵב의 ‘굶주리다’ 의미를 살리되, 힘(오ֹן)이 사람처럼 굶주린다는 시적 역설을 자연스럽게 옮기기 위해 ‘기근에 시달리다’로 다듬었습니다.
- source_word: אֹנוֹ
  english_pob_choice: his strength
  chosen_korean: 그의 힘은
  alternatives_korean:
  - 그의 기력은
  - 그의 강함은
  - 그의 재산은
  lexicon: HALOT
  rationale: אֹן은 힘, 기력, 자원까지 가질 수 있으나, 문맥상 다가오는 재난과 병행되는 신체적·존재론적 약화를 가리키므로 ‘힘’이 가장 직접적입니다.
- source_word: וְאֵיד
  english_pob_choice: and calamity
  chosen_korean: 재난이
  alternatives_korean:
  - 그리고 재앙이
  - 그리고 멸망이
  lexicon: HALOT
  rationale: אֵיד는 파멸적 재난을 뜻하므로, 예언적이고 시적인 어감을 유지하는 ‘재난’이 적절합니다.
- source_word: נָכוֹן לְצַלְעוֹ
  english_pob_choice: is ready at his side
  chosen_korean: 그의 곁에 준비되어 있습니다
  alternatives_korean:
  - 그의 옆에 서 있습니다
  - 그의 옆구리를 향해 준비되어 있습니다
  - 그가 넘어질 준비가 되어 있습니다
  lexicon: HALOT
  rationale: צלע는 기본적으로 ‘옆/곁’ 또는 ‘갈비’이지만, 본문에서는 재난이 사람의 바로 곁에 대기하는 이미지가 자연스럽습니다. לכן ‘곁에 준비되어 있습니다’로 옮겨 문자적 공간감을 유지했습니다.
