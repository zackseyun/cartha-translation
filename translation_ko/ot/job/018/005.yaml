translation:
  language: ko
  text: 참으로 악인의 빛은 꺼지고, 그의 불꽃은 빛나지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׁבִיב은 ‘불꽃’뿐 아니라 ‘불티’ 또는 ‘불똥’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 과연
  lexicon: HALOT
  rationale: 문맥에서 단순한 첨가가 아니라 빌닷의 단정적 강조로 쓰였으므로, 한국어에서는 ‘참으로’로 힘을 살렸습니다.
- source_word: א֣וֹר רְשָׁעִ֣ים
  english_pob_choice: the light of the wicked
  chosen_korean: 악인의 빛
  alternatives_korean:
  - 악인들의 빛
  - 악한 자들의 빛
  lexicon: HALOT
  rationale: 원문의 명사구를 직역해 ‘빛’ 이미지를 유지하되, 복수성은 한국어 관용상 단수 집합명사로 자연스럽게 옮겼습니다.
- source_word: יִדְעָ֑ךְ
  english_pob_choice: is put out
  chosen_korean: 꺼지고
  alternatives_korean:
  - 꺼집니다
  - 사라지고
  - 소멸하고
  lexicon: HALOT
  rationale: 불빛이 꺼져 감을 나타내는 동사이므로, 능동적·설명적 표현보다 이미지에 가까운 ‘꺼지다’를 택했습니다.
- source_word: שְׁבִ֣יב
  english_pob_choice: flame
  chosen_korean: 불꽃
  alternatives_korean:
  - 불똥
  - 불티
  - 섬광
  lexicon: HALOT
  rationale: שְׁבִיב은 ‘불꽃/불티/불똥’ 범위를 가지지만, 앞의 ‘빛’과 뒤의 ‘그의 불’과 평행을 이루는 시적 이미지로는 ‘불꽃’이 가장 자연스럽습니다.
theological_decisions:
- issue: 시적 경고의 강도
  chosen_reading: 문장을 완곡하게 풀지 않고, 악인의 ‘빛’이 꺼지는 심판적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 악인의 번영이 끝난다로 해석해 완화하기
  - 단순히 운이 나빠진다는 식으로 바꾸기
  rationale: 욥기 18장은 빌닷의 경고적 선언이므로, 원문의 은유를 해설로 바꾸기보다 독자가 그 긴장을 직접 느끼도록 하는 것이 본문에 충실합니다.
  doctrine_reference: 욥기 18:5 문맥의 시적 심판 이미지
