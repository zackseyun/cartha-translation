  rationale: 욥기 18장은 빌닷의 경고적 선언이므로, 원문의 은유를 해설로 바꾸기보다 독자가 그 긴장을 직접 느끼도록 하는 것이 본문에 충실합니다.
  doctrine_reference: 욥기 18:5 문맥의 시적 심판 이미지
