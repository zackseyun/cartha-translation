lexical_decisions:
- source_word: זִכְרוֹ
  english_pob_choice: his memory
  chosen_korean: 그의 기억
  alternatives_korean:
  - 그의 회상
  - 그에 대한 기억
  - 그의 기억됨
  lexicon: HALOT
  rationale: זכר는 여기서 사람에게 남는 기억·기념을 뜻하므로, ‘기억’이 자연스럽고 원의미를 잘 보존합니다.
- source_word: אָבַד
  english_pob_choice: perishes
  chosen_korean: 사라지고
  alternatives_korean:
  - 멸하고
  - 없어지고
  - 소멸하고
  lexicon: HALOT
  rationale: אָבַד는 ‘멸망하다’의 강한 뉘앙스가 있지만, 기억이 완전히 지워지는 이미지를 살리기 위해 ‘사라지다’를 택했습니다.
- source_word: מִנִּי אָרֶץ
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 이 땅에서
  - 세상에서
  lexicon: HALOT
  rationale: אָרֶץ는 시어에서 ‘땅’으로도 ‘세상’으로도 갈 수 있으나, 완전한 소멸의 공간감을 살리기 위해 ‘땅’으로 옮겼습니다.
- source_word: עַל פְּנֵי חוּץ
  english_pob_choice: on the face of the street
  chosen_korean: 거리의 얼굴 앞에
  alternatives_korean:
  - 거리 위에
  - 거리 한복판에
  - 공공장소에
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 직역성(‘~의 פני/얼굴 위에’)을 살리되, 한국어에서는 매우 어색한 ‘거리의 얼굴 앞에’로 남겨 원문의 시적·관용적 압박을 드러냈습니다.
theological_decisions:
- issue: ‘거리의 얼굴 앞에’라는 직역적 표현을 유지할지 여부
  chosen_reading: 의미를 풀어주기보다 원문의 관용구와 시적 낯설음을 보존했습니다.
  alternative_readings:
  - ‘거리에서’
  - ‘공공장소에서’
  - ‘거리 한복판에서’
  rationale: 본문은 단순한 장소표시보다 사회적 기억과 공개적 명성의 완전한 소멸을 말하므로, 직역이 가진 심판적 냉혹함을 유지하는 편이 source-direct합니다.
  doctrine_reference: 시문학 번역의 직역-보존 원칙
