  text: יֵֽ֭צְרוּ צַעֲדֵ֣י אוֹנ֑/וֹ וְֽ/תַשְׁלִיכֵ֥/הוּ עֲצָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/007.yaml
  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
  footnotes:
  - marker: a
    text: Or 'His strong steps are narrowed'; אוֹן may denote 'strength' or 'vigor,' and the verb may be rendered 'are narrowed' or 'are restricted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his own plan throws him down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 힘찬 걸음은 제약되고, 그의 꾀가 그를 넘어뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 강한 걸음은 좁혀진다’; אוֹן은 ‘힘’ 또는 ‘기력’의 뜻일 수 있고, 동사는 ‘좁혀지다’ 또는 ‘제한되다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 계획이 그를 넘어뜨립니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵֽצְרוּ
  english_pob_choice: are constrained
  chosen_korean: 제약되고
  alternatives_korean:
  - 좁혀지고
  - 억제되고
  - 묶이고
  lexicon: HALOT
  rationale: 발걸음이 자유롭게 나아가지 못하게 되는 상태를 자연스러운 현대 한국어로 옮겼습니다. 영어 POB의 ‘are constrained’가 담는 제한·구속의 이미지를 유지합니다.
- source_word: צַעֲדֵ֣י
  english_pob_choice: steps
  chosen_korean: 걸음은
  alternatives_korean:
  - 발걸음은
  - 발자국은
  - 걸음걸이는
  lexicon: HALOT
  rationale: צעד의 보행 이미지를 살리면서 시적 문맥에서 가장 자연스러운 표현으로 ‘걸음’을 택했습니다.
- source_word: אוֹנ֑וֹ
  english_pob_choice: his vigorous
  chosen_korean: 힘찬
  alternatives_korean:
  - 강한
  - 기운찬
  - 활기찬
  lexicon: HALOT
  rationale: אוֹן의 ‘힘/기력/기세’ 뉘앙스를 ‘힘찬’으로 옮겨, 앞절의 걸음이 본래 강하고 기세 있던 상태였음을 드러냈습니다.
- source_word: עֲצָתֽוֹ
  english_pob_choice: his own counsel
  chosen_korean: 그의 꾀
  alternatives_korean:
  - 그의 계획
  - 그의 조언
  - 그의 책략
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 עֵצָה는 내적 계획이나 도모를 가리키므로, 한국어로는 간결하게 ‘꾀’로 옮겨 자기 도모가 되레 자신을 무너뜨리는 역설을 살렸습니다.
theological_decisions:
- issue: 행동의 제한과 자기 꾀의 역전이라는 인과 구조
  chosen_reading: 악인의 힘 있는 걸음조차 결국 제약되고, 그의 자기 도모가 그를 넘어뜨린다는 시적 역설을 그대로 유지했습니다.
  alternative_readings:
  - ‘걸음이 좁혀진다’로 더 직역할 수 있음
  - ‘계획’으로 옮겨 중립적으로 만들 수 있음
  rationale: 본문은 단순한 실패가 아니라, 본인이 의지하던 힘과 꾀가 오히려 파멸의 원인이 된다는 지혜문학적 역전을 말합니다. 이를 완화하지 않고 보존했습니다.
  doctrine_reference: 잠언적 지혜 전승의 보응/역전 모티프
