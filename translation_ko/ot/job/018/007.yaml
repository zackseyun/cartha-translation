  - 그의 조언
  - 그의 책략
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 עֵצָה는 내적 계획이나 도모를 가리키므로, 한국어로는 간결하게 ‘꾀’로 옮겨 자기 도모가 되레 자신을 무너뜨리는 역설을 살렸습니다.
theological_decisions:
- issue: 행동의 제한과 자기 꾀의 역전이라는 인과 구조
  chosen_reading: 악인의 힘 있는 걸음조차 결국 제약되고, 그의 자기 도모가 그를 넘어뜨린다는 시적 역설을 그대로 유지했습니다.
  alternative_readings:
  - ‘걸음이 좁혀진다’로 더 직역할 수 있음
  - ‘계획’으로 옮겨 중립적으로 만들 수 있음
  rationale: 본문은 단순한 실패가 아니라, 본인이 의지하던 힘과 꾀가 오히려 파멸의 원인이 된다는 지혜문학적 역전을 말합니다. 이를 완화하지 않고 보존했습니다.
  doctrine_reference: 잠언적 지혜 전승의 보응/역전 모티프
