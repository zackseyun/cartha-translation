translation:
  language: ko
  text: 공포들이 사방에서 그를 두렵게 하고, 그의 발걸음마다 그를 흩어지게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 발에/발 곁에’입니다. 이는 공포들이 그가 내딛는 걸음마다 그를 몰아붙이거나 뒤쫓는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
