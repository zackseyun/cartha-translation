  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סָ֭בִיב בִּֽעֲתֻ֣/הוּ בַלָּה֑וֹת וֶ/הֱפִיצֻ֥/הוּ לְ/רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
  footnotes:
  - marker: a
    text: Or 'at his heels.' The Hebrew is literally 'at his feet,' which may describe terrors driving him along wherever he steps.
    reason: lexical_alternative
translation:
  language: ko
  text: 사방에서 두려움이 그를 떨게 하고, 그의 발밑에서 그를 흩뜨립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 발에서’입니다. 문맥상 그가 내딛는 걸음마다 두려움이 그를 뒤쫓는 그림일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  english_pob_choice: on every side
  chosen_korean: 사방에서
  alternatives_korean:
  - 온 사방에서
  - 둘레에서
  lexicon: HALOT
  rationale: 주변을 둘러싼 상태를 자연스러운 현대 한국어로 옮기되, encirclement의 이미지를 유지하기 위해 ‘사방에서’를 택했습니다.
- source_word: בִּעֲתֻהוּ
  english_pob_choice: frighten him
  chosen_korean: 그를 떨게 하고
  alternatives_korean:
  - 그를 두렵게 하고
  - 그를 놀라게 하고
  lexicon: HALOT
  rationale: ‘두려움들’이 단순 감정이 아니라 실제로 그를 겁먹게 만드는 동작을 드러내도록, 시적 병행을 살린 ‘떨게 하고’로 옮겼습니다.
- source_word: בַלָּהוֹת
  english_pob_choice: Terrors
  chosen_korean: 두려움
  alternatives_korean:
  - 공포들
  - 끔찍한 것들
  lexicon: HALOT
  rationale: 복수형의 위협적 실체를 살리되 한국어에서 부자연스러운 복수 명사를 피하기 위해 ‘두려움’으로 자연스럽게 처리했습니다.
- source_word: לְרַגְלָיו
  english_pob_choice: at his feet
  chosen_korean: 그의 발밑에서
  alternatives_korean:
  - 그의 발에서
  - 그의 발뒤꿈치에서
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘발에/발에서’에 가까우나, 문맥상 그가 걷는 자리마다 뒤쫓긴다는 뉘앙스를 살려 ‘발밑에서’로 옮겼습니다.
theological_decisions:
- issue: 시적 압박의 누적 이미지
  chosen_reading: ‘사방에서’와 ‘발밑에서’의 결합으로, 포위와 추격이 동시에 일어나는 시적 긴장을 유지했습니다.
  alternative_readings:
  - ‘온 사방에서’와 ‘그의 발뒤꿈치에서’로 더 직역할 수 있음
  - ‘그가 가는 곳마다’로 해석적으로 풀 수 있음
  rationale: 본문은 단순 정보 전달이 아니라 악인의 불안정한 상태를 압축한 시적 진술이므로, 추격의 감각을 약화시키지 않는 범위에서 한국어로 자연스럽게 표현했습니다.
  doctrine_reference: 지혜문학의 시적 병행과 이미지 보존
