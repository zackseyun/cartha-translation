  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
  footnotes:
  - marker: a
    text: Or, more formally, 'He who tears his soul in his anger.' The Hebrew opens with a third-person participial expression before shifting to direct second-person address.
