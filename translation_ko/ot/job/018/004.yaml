translation:
  language: ko
  text: 분노하여 자신을 찢는 당신이여—당신 때문에 땅이 버려져야 하겠습니까?[a] 아니면 바위가 제자리에서 옮겨져야 하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 분노로 자기 자신을 찢는 자.’ 히브리어는 3인칭 분사구로 시작하지만, 이어지는 ‘당신 때문에’는 2인칭 단수입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  english_pob_choice: tear yourself apart / he who tears his soul
  chosen_korean: 자기 영혼을 찢는 사람
  alternatives_korean:
  - 자기를 찢는 사람
  - 자기 목숨을 찢는 사람
  - 자기 영혼을 뜯는 사람
  lexicon: HALOT
  rationale: 히브리어 טרף는 ‘찢다/뜯다’의 생생한 동작을 나타내며, נֶפֶשׁ은 여기서 ‘영혼’보다 ‘자기 자신/생명’에 가까운 반사적 표현입니다. 한국어에서는 직역의 구조를 살리면서도 문맥상 ‘분노 속에서 자기 영혼을 찢는 사람’으로 옮겨 원문의 격렬함을 유지했습니다.
- source_word: בְּאַפּוֹ
  english_pob_choice: in your anger
  chosen_korean: 분노 속에서
  alternatives_korean:
  - 그의 분노 속에서
  - 노여움 가운데
  - 화가 난 채로
  lexicon: HALOT
  rationale: אַף는 문자적으로 ‘코/콧김’이지만 관용적으로 ‘분노’를 뜻합니다. 앞뒤 문맥이 욥에게 직접 말을 거는 형식이므로 한국어에서는 자연스럽게 ‘분노 속에서’로 처리해 분노의 상태를 드러냈습니다.
- source_word: הֲלְמַעַנְךָ תֵּעָזַב אָרֶץ
  english_pob_choice: shall the earth be abandoned for your sake
  chosen_korean: 당신을 위해 땅이 버려져야 하겠습니까
  alternatives_korean:
  - 당신 때문에 땅이 버려져야 하겠습니까
  - 당신의 이익을 위해 땅이 버려져야 하겠습니까
  - 당신을 위해 땅이 버려지겠습니까
  lexicon: HALOT
  rationale: לְמַעַן + 2인칭 접미사는 ‘당신을 위해/당신 때문에’의 역설적 수사를 만듭니다. אָרֶץ는 여기서 우주적·상식적 질서를 가리키므로 ‘땅’으로 옮겨, 세계가 욥의 사정에 맞춰 뒤집혀야 하느냐는 반문을 살렸습니다.
- source_word: וְיֶעְתַּק צוּר מִמְּקֹמוֹ
  english_pob_choice: or a rock be moved from its place
  chosen_korean: 아니면 바위가 제자리에서 옮겨져야 하겠습니까
  alternatives_korean:
  - 아니면 바위가 자리에서 옮겨져야 하겠습니까
  - 아니면 반석이 제자리에서 움직여야 하겠습니까
  - 아니면 바위가 그 자리에서 옮겨져야 하겠습니까
  lexicon: HALOT
  rationale: עָתַק은 ‘옮기다/이동시키다’의 뜻으로, 앞절의 ‘버려지다’와 평행을 이루는 수동적 반문이 적절합니다. צוּר는 문맥상 신학적 칭호가 아니라 ‘바위/반석’의 일반 명사이므로 ‘바위’로 번역했습니다.
theological_decisions:
- issue: 히브리어 3인칭 분사와 2인칭 직접 호칭의 긴장
  chosen_reading: 첫 구절은 형식상 3인칭 분사이지만, 뒤의 לְמַעַנְךָ와 전체 수사 흐름을 따라 욥에게 직접 경책하는 말로 읽었습니다.
  alternative_readings:
  - 형식대로 ‘자기 영혼을 찢는 그 사람’처럼 3인칭을 유지한다
  - 전체를 비인칭적 격언처럼 처리한다
  rationale: 본문은 문법적으로 시작점에서 3인칭 형식을 가지지만, 곧바로 2인칭 접미사와 반문이 이어져 발화의 초점이 욥에게 향합니다. 한국어에서는 이 수사적 압박을 분명히 하려면 직접 호칭형이 더 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
