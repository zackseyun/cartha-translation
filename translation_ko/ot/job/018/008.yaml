base_translation:
  language: en
  yaml_path: translation/ot/job/018/008.yaml
  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: ko
  text: 이는 그가 자기 발에 떠밀려 그물 속으로 내몰리고, 그물망 위를 걷기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי / For
  english_pob_choice: For
  chosen_korean: 참으로
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 곧
  lexicon: כִּי
  rationale: 앞 문맥의 진술을 이유로 받되, 한국어에서는 문장 첫머리의 인과 접속을 자연스럽고 응축되게 살리기 위해 ‘참으로’를 택했습니다.
- source_word: שֻׁלַּח
  english_pob_choice: is sent
  chosen_korean: 올가미에 걸려들고
  alternatives_korean:
  - 보내지고
  - 던져지고
  - 빠지고
  lexicon: שׁלח
  rationale: 어근상 ‘보내다/내던지다’의 수동형이지만, 여기서는 발로 스스로 들어가 빠져드는 함정을 가리키므로 한국어에서는 동작의 결과를 드러내는 ‘올가미에 걸려들고’로 옮겼습니다.
- source_word: בְּרֶשֶׁת / בְּרַגְלָיו / שְׂבָכָה
  english_pob_choice: a net ... a mesh
  chosen_korean: 올가미 ... 그물
  alternatives_korean:
  - 덫 ... 망
  - 그물 ... 망
  - 올무 ... 그물
  lexicon: רֶשֶׁת; שְׂבָכָה
  rationale: 두 명사의 의미 영역이 겹치지만 서로 다른 덫 이미지를 유지해야 하므로, 앞은 ‘올가미’, 뒤는 ‘그물’로 구분해 반복적 함정의 긴박함을 살렸습니다.
theological_decisions:
- issue: 수동 표현과 책임 귀속
  chosen_reading: ‘그는 자기 발로 올가미에 걸려든다’는 식으로, 외부에서 강제로 던져진 피해보다 자기 걸음으로 함정에 들어가는 책임을 강조했습니다.
  alternative_readings:
  - ‘그는 자기 발로 그물에 보내진다’
  - ‘그는 자기 발로 덫에 던져진다’
  rationale: 히브리어 수동형과 ‘자기 발로’라는 표현이 함께 가리키는 자기연루성을 한국어에서 분명하게 드러내는 것이 본문의 논지를 더 잘 보존합니다.
  doctrine_reference: 욥기의 지혜문학적 인과응보 논의
- issue: 병렬 구조 보존
  chosen_reading: 두 번째 절은 ‘그물 위를 걷습니다’로 유지해, 첫 절의 함정과 대응되는 시각적 병렬을 살렸습니다.
  alternative_readings:
  - ‘망 위를 걷습니다’
  - ‘그물 위를 다닙니다’
  rationale: Hebrew parallelism을 한국어에서도 살려, 함정 속으로 들어감과 그 위를 걷는 장면이 서로 호응하도록 했습니다.
  doctrine_reference: 히브리 시편/지혜문학의 평행법
