  source_fidelity: 첫 절은 히브리어의 수동형 복수 ‘우리가 여겨지다’를 ‘우리를 여기시다’로 자연스럽게 전환했고, ‘가축처럼’과 ‘당신의 눈에는’은 원문의 멸시적 비교와 평가의 관용구를 충실히 반영합니다. 그러나 두 번째 동사 נִטְמִינוּ는 본문상 난해하며, 현 번역 ‘부정한 것으로 보십니까’는 부정/불결의 해석을 채택한 점은 가능하나 첫 절의 ‘여기시며’와 병행되는 판단 동사로 옮기는 편이 원문의 병행성과 영어 POB의 audit trail을 더 잘 보존합니다.
  naturalness: ‘당신의 눈에는’은 자연스럽지만, ‘부정한 것으로 보십니까’보다 ‘부정한 것으로 여기십니까’가 앞의 ‘가축처럼 여기시며’와 균형을 이루며 현대 표준 한국어의 문맥에서도 더 매끄럽습니다. 합쇼체 높임은 발화 상대에 대한 높임으로 일관됩니다.
  terminology: בְּהֵמָה의 ‘가축’은 가능한 번역이나 한국어에서는 동물 일반/짐승이라는 멸시의 폭을 다소 좁힐 수 있습니다. ‘짐승처럼’이 문맥의 모욕적 비교를 더 직접적이고 자연스럽게 전달합니다. ‘부정한’은 의례적·평가적 함의를 열어 둔 적절한 용어입니다.
