  text: מַ֭דּוּעַ נֶחְשַׁ֣בְנוּ כַ/בְּהֵמָ֑ה נִ֝טְמִ֗ינוּ בְּ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/003.yaml
  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
  footnotes:
  - marker: a
    text: Or 'like beasts' / 'as animals.' The Hebrew בְּהֵמָה is a broad term for animal or beast, here used contemptuously.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of 'considered unclean' is difficult. Some understand it differently, but the sense here is that Bildad protests being viewed as defiled or impure.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 우리를 가축처럼 여기시며, 당신의 눈에는 부정한 것으로 보십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּהֵמָה는 짐승/동물/가축을 아우르는 넓은 말로, 여기서는 멸시하는 비교로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부정한 것으로 보십니까’는 본문의 난해한 동사를 POB의 해석에 따라 옮긴 것입니다. 다른 이해도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 반문하는 탄식의 뉘앙스를 자연스럽게 살리면서, 시적 문맥에서 조금 더 격조 있는 질문 형태를 유지합니다.
- source_word: נֶחְשַׁבְנוּ
  english_pob_choice: are we regarded
  chosen_korean: 우리를 … 여기시며
  alternatives_korean:
  - 우리가 … 여겨지며
  - 우리를 … 간주하시며
  lexicon: HALOT
  rationale: ‘חשב’의 평가·판단 의미를 한국어의 ‘여기다’로 옮겨, 외부에서 그렇게 평가받는 느낌을 보존합니다.
- source_word: כַ/בְּהֵמָה
  english_pob_choice: as cattle
  chosen_korean: 가축처럼
  alternatives_korean:
  - 짐승처럼
  - 동물처럼
  - 소처럼
  lexicon: HALOT
  rationale: 문맥상 멸시의 비교를 드러내면서도 히브리어의 포괄적 동물 의미를 살리기 위해, 한국어에서 집단적·경멸적 뉘앙스가 있는 ‘가축처럼’을 택했습니다.
- source_word: נִטְמִינוּ
  english_pob_choice: considered unclean
  chosen_korean: 부정한 것으로 보십니까
  alternatives_korean:
  - 더럽다고 보십니까
  - 불결한 것으로 여기십니까
  - 부정한 자로 여기십니까
  lexicon: HALOT
  rationale: 이 난해한 형태를 POB의 해석을 따라 ‘부정한’ 의미로 옮기고, ‘눈에’라는 관용구와 자연스럽게 이어지도록 수동적 판단 표현으로 구성했습니다.
theological_decisions:
- issue: ‘in your eyes’의 인칭과 직접성
  chosen_reading: 당신의 눈에는
  alternative_readings:
  - 당신 보시기에
  - 당신에게는
  rationale: 히브리어 관용구를 직역하되, 욥이 발닷에게 직접 항의하는 장면이므로 2인칭 대화의 직접성을 유지했습니다.
  doctrine_reference: 문맥상 화법 유지
- issue: ‘unclean’의 번역 강도
  chosen_reading: 부정한
  alternative_readings:
  - 더러운
  - 오염된
  - 불결한
  rationale: 종교적·의례적 부정의 가능성을 열어 두면서도, 한국어에서 도덕적 비난으로 과도하게 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 의례적 부정 개념
