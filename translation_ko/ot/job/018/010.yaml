- source_word: טָמוּן
  english_pob_choice: is hidden
  chosen_korean: 숨겨져 있고
  alternatives_korean:
  - 감추어져 있고
  - 숨겨져 있습니다
  lexicon: HALOT
  rationale: 피동·상태 의미를 살려서, 덫의 구성물이 이미 보이지 않게 놓여 있음을 자연스럽게 표현했습니다.
- source_word: בָּאָרֶץ
