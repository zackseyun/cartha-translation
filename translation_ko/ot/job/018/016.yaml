    text: 또는 ‘그의 새순’ 또는 ‘그의 수확물’. 히브리어 명사는 보통 거둔 것, 곧 수확물을 뜻할 수 있으나, 이 식물 비유에서는 잘려 나가는 식물의 윗부분을 가리키는 것으로 이해될 수 있습니다.
