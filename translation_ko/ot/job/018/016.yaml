base_translation:
  language: en
  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
  footnotes:
  - marker: a
    text: Or 'his shoot is cut off.' The Hebrew noun can evoke what is cut or reaped; in this context it refers to the plant's upper growth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뿌리는 아래에서 마르고, 위에서는 그의 가지가 말라 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 새순이 잘려 버립니다.’ 히브리어 명사는 잘린 것 또는 거둔 것을 떠올리게 할 수 있으며, 여기서는 식물의 윗부분 성장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  english_pob_choice: beneath
  chosen_korean: 아래에서
  alternatives_korean:
  - 아래로
  - 밑에서
  - 아래
  lexicon: HALOT
  rationale: 공간 관계를 나타내는 전치사로서 ‘beneath’의 아래쪽 대칭을 살리기 위해 ‘아래에서’로 옮겼습니다.
- source_word: שָׁרָשָׁיו
  english_pob_choice: his roots
  chosen_korean: 그의 뿌리들
  alternatives_korean:
  - 그의 뿌리
  - 뿌리
  lexicon: HALOT
  rationale: 복수형과 3인칭 남성 소유격을 반영해 식물 비유를 살리되, 한국어에서는 자연스럽게 ‘그의 뿌리’로 다듬어 번역했습니다.
- source_word: יִבָשׁוּ
  english_pob_choice: dry up
  chosen_korean: 마르다
  alternatives_korean:
  - 말라 버리다
  - 바짝 마르다
  - 시들다
  lexicon: HALOT
  rationale: ‘dry up’의 수분 소실 이미지를 한국어 동사 ‘마르다’로 간결하게 살렸습니다.
- source_word: יִמַּל קְצִירוֹ
  english_pob_choice: his branch withers
  chosen_korean: 그의 가지가 말라 버립니다
  alternatives_korean:
  - 그의 새순이 잘려 버립니다
  - 그의 순이 꺾입니다
  - 그의 가지가 끊어집니다
  lexicon: HALOT
  rationale: 문맥상 추수보다 식물의 윗부분 성장체를 가리키는 은유로 보고, POB의 ‘branch’ 해석을 따라 ‘가지’로 옮겼습니다.
theological_decisions:
- issue: 식물 은유의 보존과 해석 범위
  chosen_reading: 뿌리와 가지가 함께 말라 가는 나무의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 뿌리가 마르고 위로는 새순이 잘려 버립니다
  - 뿌리가 마르고 위로는 수확이 끊깁니다
  rationale: 히브리어는 아래쪽(뿌리)과 위쪽(윗성장)의 병행 대구를 통해 완전한 쇠퇴를 묘사하므로, 한국어에서도 그 시각적·시적 구조를 유지했습니다.
  doctrine_reference: 시적 대구와 비유적 언어의 보존
