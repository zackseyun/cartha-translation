  source_fidelity: 첫 행은 뿌리가 아래에서 마르는 모습을 적절히 옮겼습니다. 그러나 둘째 행의 יִמַּל은 식물의 윗부분이 ‘마른다’기보다 ‘잘려 나가다/끊어지다’를 뜻하는 것으로 보는 것이 더 직접적입니다. 따라서 본문의 ‘말라 버립니다’는 원문의 동작을 약화시키며, 각주에만 ‘잘려 버립니다’를 둘 수 없습니다. קְצִירוֹ의 정확한 지시 대상에는 논의가 있으므로 ‘가지’를 본문에 유지하되 대안을 각주에 밝혀야 합니다.
