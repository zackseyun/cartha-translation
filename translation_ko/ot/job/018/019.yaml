  rationale: מָגוּר는 거주와 체류/소요를 함께 가리킬 수 있으므로, 영어 POB의 해석을 따라 ‘머물던 곳들’로 옮겨 장소적 의미를 간결하게 살렸습니다.
theological_decisions:
- issue: 세 쌍의 병렬이 만드는 완전한 단절의 의미
  chosen_reading: ‘후손도, 자손도 없으며’로 두 용어를 모두 살려, 단순히 자녀가 없다는 뜻이 아니라 혈통의 완전한 끊김을 드러냈습니다.
  alternative_readings:
