base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
  footnotes:
  - marker: a
    text: Or 'grandchild' for 'posterity'; the pair 'offspring and posterity' renders a Hebrew expression for the complete cutting off of descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'in his dwellings' or 'in his settlements'; the Hebrew can refer either to places of residence or places of sojourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 그의 백성 가운데 후손도, 자손도 없으며, 그가 머물던 곳들에는 남은 자도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’으로도 옮길 수 있으며, 히브리어는 후손의 완전한 끊김을 나타내는 관용적 병렬을 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 거처들’ 또는 ‘그가 거류하던 곳들’로도 옮길 수 있으며, 히브리어는 거주지와 체류지를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  english_pob_choice: offspring
  chosen_korean: 후손
  alternatives_korean:
  - 자손
  - 자녀
  - 후예
  lexicon: HALOT
  rationale: נִין은 직계 ‘아들’보다 넓은 ‘자손/후손’의 의미이므로, 문맥상 다음 표현과 짝을 이루어 단절의 의미를 드러내는 ‘후손’이 적절합니다.
- source_word: נֶכֶד
  english_pob_choice: posterity
  chosen_korean: 자손
  alternatives_korean:
  - 손자
  - 후대
  - 후예
  lexicon: HALOT
  rationale: נִין과 병렬로 쓰여 혈통의 완전한 소멸을 강조하므로, 특정 세대인 ‘손자’보다 더 넓은 ‘자손’을 택해 영어 POB의 ‘offspring / posterity’ 대비를 살렸습니다.
- source_word: בְּעַמּוֹ
  english_pob_choice: among his people
  chosen_korean: 그의 백성 가운데
  alternatives_korean:
  - 그의 백성 안에
  - 그의 친족 가운데
  - 그 백성 가운데
  lexicon: HALOT
  rationale: בְּ + עַם은 소속 공동체의 범위를 나타내므로, 관계를 드러내는 ‘그의 백성 가운데’가 가장 자연스럽고 원문의 공동체적 배경을 보존합니다.
- source_word: בִּמְגוּרָיו
  english_pob_choice: in the places where he sojourned
  chosen_korean: 그가 머물던 곳들
  alternatives_korean:
  - 그가 거류하던 곳들
  - 그의 거처들
  - 그가 살던 곳들
  lexicon: HALOT
  rationale: מָגוּר는 거주와 체류/소요를 함께 가리킬 수 있으므로, 영어 POB의 해석을 따라 ‘머물던 곳들’로 옮겨 장소적 의미를 간결하게 살렸습니다.
theological_decisions:
- issue: 세 쌍의 병렬이 만드는 완전한 단절의 의미
  chosen_reading: ‘후손도, 자손도 없으며’로 두 용어를 모두 살려, 단순히 자녀가 없다는 뜻이 아니라 혈통의 완전한 끊김을 드러냈습니다.
  alternative_readings:
  - ‘자녀도 없으며’로 단순화
  - ‘후예도 없으며’로 일반화
  rationale: 히브리어의 나란한 표현은 의도적으로 총체적 상실을 강조하므로, 한국어에서도 두 낱말을 병렬해 그 강도를 보존해야 합니다.
  doctrine_reference: 시적 지혜문학의 보응/심판 묘사
