  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
  footnotes:
  - marker: a
    text: Or 'grandchild' for 'posterity'; the pair 'offspring and posterity' renders a Hebrew expression for the complete cutting off of descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'in his dwellings' or 'in his settlements'; the Hebrew can refer either to places of residence or places of sojourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 그의 백성 가운데 후손도 자손도 없고,[a] 그가 머물던 곳들에는 살아남은 자도 없습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’은 ‘손자’로도 옮길 수 있습니다. ‘후손과 자손’이라는 병렬은 후대가 완전히 끊어짐을 나타내는 히브리어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 거처들’ 또는 ‘그가 거류하던 곳들’로도 옮길 수 있습니다. 히브리어는 거주지나 체류지를 가리킬 수 있습니다.
    reason: lexical_alternative
