  language: ko
  text: 덫이 그의 발꿈치를 잡고[a], 그물 올가미가 그를 꽉 붙듭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덫이 그의 발꿈치에서 그를 붙잡고, 올가미가 그를 붙든다.’ 마지막 명사는 희귀어로, 특정한 종류의 올가미나 덫을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  english_pob_choice: seizes
  chosen_korean: 잡고
  alternatives_korean:
  - 붙잡고
  - 사로잡고
  - 덮치고
  lexicon: HALOT
  rationale: אחז의 기본 의미는 ‘붙잡다, 잡다’이므로, 덫이 대상을 포착하는 장면을 자연스럽게 살려 ‘잡고’로 옮겼습니다.
- source_word: בְּעָקֵב
  english_pob_choice: by the heel
  chosen_korean: 발꿈치를
  alternatives_korean:
  - 발꿈치에
  - 뒤꿈치를
  - 발뒤꿈치를
  lexicon: HALOT
  rationale: עָקֵב은 ‘발꿈치’이므로 직접 목적어처럼 처리해 한국어에서 더 자연스럽게 ‘발꿈치를 잡다’로 표현했습니다.
- source_word: פָּח
  english_pob_choice: trap
  chosen_korean: 덫
  alternatives_korean:
  - 함정
  - 올무
  - 그물
  lexicon: HALOT
  rationale: פָּח은 일반적인 ‘덫/함정’ 계열이지만, 뒤의 별도 포획 이미지를 살리기 위해 가장 직관적인 ‘덫’을 택했습니다.
- source_word: צַמִּים
  english_pob_choice: snare
  chosen_korean: 그물 올가미
  alternatives_korean:
  - 올가미
  - 그물
  - 덫
  lexicon: HALOT
  rationale: 희귀한 명사로서 특정한 ‘올가미/덫’ 종류를 가리킬 수 있으므로, 영문의 주석이 제시한 의미 범위를 살려 ‘그물 올가미’로 옮겼습니다.
theological_decisions:
- issue: 두 개의 포획 이미지의 구분
  chosen_reading: 앞 절은 일반적인 ‘덫’, 뒤 절은 더 구체적인 ‘그물 올가미’로 구분해 병행성을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘덫’으로 통일
  - 둘 다 ‘올무’로 통일
  rationale: 원문은 פָּח와 צַמִּים을 나란히 두어 서로 다른 포획 도구의 중첩을 보여 주므로, 한국어도 같은 말로 평준화하지 않고 차이를 남겼습니다.
  doctrine_reference: 시적 병행법과 어휘적 세부성 보존
- issue: ‘꽉 붙듭니다’의 동작성
  chosen_reading: יַחֲזֵק의 강한 접착·포획 뉘앙스를 살려 ‘꽉 붙듭니다’로 번역했습니다.
  alternative_readings:
  - 단단히 붙듭니다
  - 꽉 잡습니다
  - 놓지 않습니다
  rationale: 단순한 ‘잡다’보다 포획의 강도를 드러내며, 앞 절과의 평행 속에서 함정이 피해자를 확실히 제압하는 이미지를 유지합니다.
  doctrine_reference: 어휘 강도 보존
