translation:
  language: ko
  text: 그의 천막 안의 빛이 어두워지고, 그의 위에 있는 등불은 꺼집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 밝음
  lexicon: HALOT
  rationale: אור의 기본적 구체 의미를 살려, 천막 안에 비치는 빛이라는 시각적 이미지를 자연스럽게 전달했습니다.
- source_word: חָשַׁךְ
  english_pob_choice: grows dark
  chosen_korean: 어두워지고
  alternatives_korean:
  - 어둡게 되고
  - 점점 어두워지고
  lexicon: HALOT
  rationale: 동사가 ‘어두워지다’라는 상태 변화이므로, 진행형처럼 자연스러운 한국어 ‘어두워지고’로 옮겼습니다.
- source_word: בְּאָהֳלוֹ
  english_pob_choice: in his tent
  chosen_korean: 그의 천막 안의
  alternatives_korean:
  - 그의 천막 속의
  - 그의 집 안의
  lexicon: HALOT
  rationale: אָהֶל의 문자적 의미인 ‘천막’을 보존하되, 시적 병행구 안에서 소유 관계를 자연스럽게 나타내기 위해 ‘안의’로 처리했습니다.
- source_word: עָלָיו
  english_pob_choice: above him
  chosen_korean: 그 위의
  alternatives_korean:
  - 그 위에 있는
  - 그 위로
  lexicon: HALOT
  rationale: עַל의 위치감을 살려, 등불이 사람 ‘위에’ 놓인 모습을 가장 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: יִדְעָךְ
  english_pob_choice: is extinguished
  chosen_korean: 꺼집니다
  alternatives_korean:
  - 사라집니다
  - 꺼져 버립니다
  lexicon: HALOT
  rationale: 등불에 대한 동사로는 ‘꺼지다’가 가장 직접적이며, 시적 맥락에서도 ‘is extinguished’의 의미를 충실히 전달합니다.
