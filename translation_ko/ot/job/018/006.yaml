  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
  footnotes:
  - marker: a
    text: Or 'over him.' The Hebrew preposition can denote position upon or above; the phrase likely pictures the lamp's light over the wicked man.
