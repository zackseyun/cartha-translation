translation:
  language: ko
  text: 그들은 그를 빛에서 어둠으로 몰아내고, 세상에서 그를 내쫓습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תֵּבֵל은 ‘세상’ 또는 더 구체적으로 ‘거주하는 세계’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 הדף는 여기서 ‘몰아내다’보다 더 직접적으로는 ‘쫓아내다/밀쳐내다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  english_pob_choice: They drive him
  chosen_korean: 그들은 그를 … 몰아내고
  alternatives_korean:
  - 그들은 그를 … 쫓아내고
  - 그들은 그를 … 몰아붙이고
  lexicon: HALOT
  rationale: 동사 הדף의 강한 밀어내기·추방 뉘앙스를 살리면서, 시적 평행구조에서 자연스러운 한국어로는 ‘몰아내다’가 가장 가깝습니다.
- source_word: מֵאוֹר אֶל חֹשֶׁךְ
  english_pob_choice: from light into darkness
  chosen_korean: 빛에서 어둠으로
  alternatives_korean:
  - 빛에서 어둠 속으로
  - 빛으로부터 어둠으로
  lexicon: HALOT
  rationale: 분리(מִן)와 방향성(אֶל)을 함께 살려, 상태의 영역이 밝음에서 어둠으로 바뀌는 대비를 간결하게 표현했습니다.
- source_word: וּמִתֵּבֵל
  english_pob_choice: from the world
  chosen_korean: 세상에서
  alternatives_korean:
  - 이 세상에서
  - 거주하는 세상에서
  lexicon: HALOT
  rationale: תֵּבֵל은 ‘거주하는 세계’까지 포함할 수 있지만, 시구에서는 한국어 ‘세상’이 가장 자연스럽고 의미 범위도 충분히 반영합니다.
- source_word: יְנִדֻּהוּ
  english_pob_choice: banish him
  chosen_korean: 그를 내쫓습니다
  alternatives_korean:
  - 그를 추방합니다
  - 그를 내어쫓습니다
  lexicon: HALOT
  rationale: נדח/נדה의 배제·추방의 법적 사회적 힘을 살리기 위해 ‘내쫓다’를 택했고, 앞의 ‘몰아내다’와는 다른 어감을 유지했습니다.
theological_decisions:
- issue: 시적 평행구에서 동일한 동작의 반복을 어떻게 한국어로 처리할지
  chosen_reading: 첫 절반은 ‘몰아내고’, 둘째 절반은 ‘내쫓습니다’로 달리 옮겨 강한 추방의 이미지는 유지하되 반복을 피했습니다.
  alternative_readings:
  - 둘 다 ‘쫓아내다’로 통일
  - 둘 다 ‘추방하다’로 통일
  rationale: 히브리어는 두 동사를 나란히 두어 강한 배제의 이미지를 누적하므로, 한국어도 동일 의미를 유지하되 어휘를 조금 달리해 시의 힘을 보존했습니다.
  doctrine_reference: 시적 병행법과 의미 중첩 보존
