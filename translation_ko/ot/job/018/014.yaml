id: JOB.18.14
reference: Job 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
  footnotes:
  - marker: a
    text: Or 'He is torn from his tent, his security'; the Hebrew may mean either that he is removed from the secure place of his tent or that the tent itself was his security.
    reason: lexical_alternative
  - marker: b
    text: '''The king of terrors'' is a poetic expression, often understood as death personified.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자기 장막의 안전한 곳에서 끌려나와, 공포의 왕에게로 끌려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 장막에서, 곧 그가 안전하다고 여긴 곳에서”; 히브리어는 안전한 장소로부터의 추방인지, 장막 자체가 그의 안전이었는지를 둘 다 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘공포의 왕’은 시적 표현으로, 흔히 죽음의 의인화로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  english_pob_choice: is torn
  chosen_korean: 끌려나와
  alternatives_korean:
  - 찢겨 나와
  - 뜯겨 나와
  - 뽑혀 나와
  lexicon: HALOT
  rationale: נתק의 수동적·폭력적 의미를 살리되, 한국어에서 자연스럽게 대상이 안전한 장소에서 강제로 분리되는 느낌을 주기 위해 ‘끌려나와’로 옮겼습니다.
- source_word: מֵאָהֳלוֹ / מִבְטַחוֹ
  english_pob_choice: from the security of his tent
  chosen_korean: 자기 장막의 안전한 곳에서
  alternatives_korean:
  - 자기 장막에서 안전하던 곳에서
  - 그의 장막의 안전에서
  - 안전의 장막에서
  lexicon: HALOT
  rationale: ‘장막’의 구체적 이미지와 ‘안전/신뢰’의 뜻을 함께 살리기 위해, 소유격을 분명히 하면서도 apposition의 여지를 남기는 표현으로 옮겼습니다.
- source_word: וְתַצְעִדֵהוּ
  english_pob_choice: is marched off
  chosen_korean: 끌려갑니다
  alternatives_korean:
  - 행진하듯 끌려갑니다
  - 몰려갑니다
  - 인도되어 갑니다
  lexicon: HALOT
  rationale: 히필의 ‘가게 하다/걷게 하다’는 강제 이동의 뉘앙스를 한국어의 수동형으로 전달하되, 주어가 불명확한 원문의 시적 흐름을 과도하게 해설하지 않기 위해 간결하게 처리했습니다.
- source_word: לְמֶלֶךְ בַּלָּהוֹת
  english_pob_choice: to the king of terrors
  chosen_korean: 공포의 왕에게
  alternatives_korean:
  - 공포의 왕에게로
  - 두려움의 왕에게
  - 공포의 군왕에게
  lexicon: HALOT
  rationale: ‘왕’이라는 칭호와 בלָּהוֹת의 복수적 공포 이미지를 그대로 살렸습니다. 한국어에서는 관용적으로 ‘공포의 왕’이 가장 직관적이며 시적입니다.
theological_decisions:
- issue: ‘공포의 왕’의 정체를 특정할지 여부
  chosen_reading: 정체를 밝히지 않고 시적 표현 그대로 유지했습니다.
  alternative_readings:
  - 죽음의 의인화
  - 스올/무덤에 대한 우회적 표현
  - 악한 영적 통치자에 대한 암시
  rationale: 히브리어 본문은 그 대상을 명시적으로 규정하지 않으므로, 번역에서 신학적 해석을 앞서 넣기보다 원문의 긴장과 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 해석을 단정하지 않고 시적·신학적 여지를 보존
