theological_decisions:
- issue: 욥의 ‘눈’이 무엇에 머무는지에 대한 은유 해석
  chosen_reading: ‘내 눈은 그들의 반항 위에서 밤을 지냅니다’로 옮겨, 시선이 적대적 행위 위에 오래 머무는 강한 이미지를 유지했습니다.
  alternative_readings:
  - ‘내 눈은 그들의 반역을 바라봅니다’
