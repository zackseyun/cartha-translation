id: JOB.17.2
reference: Job 17:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לֹ֣א הֲ֭תֻלִים עִמָּדִ֑/י וּ֝/בְ/הַמְּרוֹתָ֗/ם תָּלַ֥ן עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
  footnotes:
  - marker: a
    text: Or 'deceivers are with me'; the Hebrew term can carry the sense of deceptive or derisive people.
    reason: lexical_alternative
  - marker: b
    text: Or 'my eye remains on their rebellion' or 'their bitterness'; the Hebrew expression is difficult and may denote provoking, rebellious, or bitter conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 분명히 조롱하는 자들이 내 곁에 있고, 내 눈은 그들의 반항 위에서 밤을 지냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조롱하는 자들’은 ‘속이는 자들’로도 옮길 수 있습니다. 히브리어는 조롱과 기만의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 반항’은 ‘그들의 도발’, ‘그들의 반역’, 또는 ‘그들의 쓰라림’으로도 옮길 수 있습니다. 이 히브리어 표현은 난해하여 여러 뜻이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 참으로
  - 진실로
  - 만일 아니면
  lexicon: HALOT
  rationale: 이 관용구는 조건이 아니라 강한 확언이므로, 한국어에서도 단정적이고 자연스러운 ‘분명히’로 옮겼습니다.
- source_word: הֲתֻלִים
  english_pob_choice: mockers
  chosen_korean: 조롱하는 자들
  alternatives_korean:
  - 속이는 자들
  - 조롱꾼들
  - 희롱하는 사람들
  lexicon: HALOT
  rationale: 문맥상 욥을 향한 적대적 비웃음이 핵심이므로, ‘조롱하는 자들’이 가장 직접적입니다.
- source_word: וּבְהַמְּרוֹתָם
  english_pob_choice: on their provocation
  chosen_korean: 그들의 반항 위에서
  alternatives_korean:
  - 그들의 도발 위에서
  - 그들의 반역 위에서
  - 그들의 씁쓸함 위에서
  lexicon: HALOT
  rationale: מרה의 의미 범위가 도발·반항·반역·쓰라림을 아우르지만, 여기서는 상대의 적대적 저항을 드러내는 ‘반항’이 가장 무난합니다.
- source_word: תָּלַן
  english_pob_choice: lodges
  chosen_korean: 밤을 지냅니다
  alternatives_korean:
  - 머뭅니다
  - 머무릅니다
  - 묵습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘묵다/밤을 지내다’를 살리면서, 눈이 그 대상 위에 오래 고정된다는 비유를 한국어로 자연스럽게 전달합니다.
theological_decisions:
- issue: 욥의 ‘눈’이 무엇에 머무는지에 대한 은유 해석
  chosen_reading: ‘내 눈은 그들의 반항 위에서 밤을 지냅니다’로 옮겨, 시선이 적대적 행위 위에 오래 머무는 강한 이미지를 유지했습니다.
  alternative_readings:
  - ‘내 눈은 그들의 반역을 바라봅니다’
  - ‘내 눈은 그들의 쓰라림 위에 머뭅니다’
  rationale: 히브리어 표현은 직역하면 난해하므로, 영어 POB의 보수적 해석을 따라 시각적 은유를 유지하되 과도한 해석을 피했습니다.
  doctrine_reference: 시적 은유의 의미 보존과 문맥 우선 원칙
