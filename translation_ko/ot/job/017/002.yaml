  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
  footnotes:
  - marker: a
    text: Or 'deceivers are with me'; the Hebrew term can carry the sense of deceptive or derisive people.
    reason: lexical_alternative
  - marker: b
    text: Or 'my eye remains on their rebellion' or 'their bitterness'; the Hebrew expression is difficult and may denote provoking, rebellious, or bitter conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 분명히 조롱하는 자들이 내 곁에 있고, 내 눈은 그들의 도발에 머문 채 밤을 지냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조롱하는 자들’은 ‘속이는 자들’로도 옮길 수 있습니다. 이 히브리어 말은 기만하거나 조롱하는 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 도발’은 ‘그들의 반항’, ‘그들의 반역’, 또는 ‘그들의 쓰라림’으로도 옮길 수 있습니다. 이 히브리어 표현은 난해하며, 도발적·반항적·쓰라린 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
