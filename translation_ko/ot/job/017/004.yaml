id: JOB.17.4
reference: Job 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
  footnotes:
  - marker: a
    text: Or 'their mind' or 'their inner self'; Hebrew 'heart' often refers to the seat of thought and discernment, not only emotion.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not lift them up' or 'you will not let them triumph.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신이 그들의 마음을 깨달음에서 숨기셨기 때문입니다[a]. 그러므로 당신은 그들을 높이시지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생각’이나 ‘속사람’. 히브리어 ‘마음’은 감정보다 생각과 분별의 중심을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 들어 올리시지 않을 것입니다’ 또는 ‘그들이 승리하게 두지 않으실 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  english_pob_choice: their heart
  chosen_korean: 그들의 마음
  alternatives_korean:
  - 그들의 심장
  - 그들의 마음속
  - 그들의 생각
  lexicon: HALOT
  rationale: 히브리어 ‘heart’는 감정보다 사고와 분별의 중심을 가리키는 경우가 많으므로, 한국어에서는 자연스럽고 넓게 포괄하는 ‘마음’으로 옮기되 ‘생각’으로만 좁히지는 않았습니다.
- source_word: צָפַנְתָּ
  english_pob_choice: you have hidden
  chosen_korean: 숨기셨습니다
  alternatives_korean:
  - 감추셨습니다
  - 가리셨습니다
  - 숨겨 두셨습니다
  lexicon: HALOT
  rationale: 하나님의 직접 행위를 드러내면서도 완료된 동작의 의미를 살리기 위해 ‘숨기셨습니다’를 선택했습니다.
- source_word: מִשָּׂכֶל
  english_pob_choice: from understanding
  chosen_korean: 깨달음에서
  alternatives_korean:
  - 이해에서
  - 분별에서
  - 통찰에서
  lexicon: HALOT
  rationale: 문맥상 단순 지식이 아니라 분별과 이해의 능력을 가리키므로, 현대 한국어에서 가장 무난한 ‘깨달음’으로 렌더링했습니다.
- source_word: לֹא תְרֹמֵם
  english_pob_choice: you will not exalt them
  chosen_korean: 그들을 높이시지 않을 것입니다
  alternatives_korean:
  - 그들을 높이지 않으실 것입니다
  - 그들을 들어 올리지 않으실 것입니다
  - 그들을 승리하게 하지 않으실 것입니다
  lexicon: HALOT
  rationale: רום의 기본 이미지를 살리면서도 시적 문맥에서 ‘승리하게 하다’로 의미를 과도하게 좁히지 않기 위해 ‘높이시다’를 택했습니다.
theological_decisions:
- issue: ‘their heart’의 인식 기능을 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘마음’을 사용하되, 문맥이 사고와 분별의 영역을 말한다는 점을 유지했습니다.
  alternative_readings:
  - ‘생각’
  - ‘속마음’
  - ‘이성’
  rationale: 히브리어 לֵב/לֵבָב은 인지와 의지의 중심을 포함하므로, 한국어의 ‘마음’이 가장 균형 있게 이를 담아냅니다. ‘이성’은 지나치게 현대 철학적 의미로 좁아질 수 있습니다.
  doctrine_reference: 인간의 내적 분별 능력에 대한 성경적 이해
- issue: ‘높이시다’의 의미 범위를 어떻게 보존할 것인가
  chosen_reading: 하나님이 그들을 승격시키거나 번영시키지 않으신다는 함의를 열어 둔 채 ‘높이시다’로 번역했습니다.
  alternative_readings:
  - ‘들어 올리시다’
  - ‘승리하게 하시다’
  - ‘번영하게 하시다’
  rationale: 본문은 단순한 물리적 상승이 아니라 지위/승리의 상승을 시사하지만, 해석을 특정 방향으로만 고정하지 않기 위해 상징적 동사를 유지했습니다.
  doctrine_reference: 하나님의 주권과 인간 분별의 상관관계
