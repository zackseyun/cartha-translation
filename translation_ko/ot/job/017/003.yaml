id: JOB.17.3
reference: Job 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
  footnotes:
  - marker: a
    text: Or 'be surety for me with yourself.' The Hebrew uses legal language for providing security or guarantee.
    reason: lexical_alternative
  - marker: b
    text: Literally 'who is he who would strike my hand?'—an idiom for entering a pledge or surety agreement.
    reason: cultural_note
translation:
  language: ko
  text: 부디 저를 위하여 당신께 보증을 세워 주십시오.[a] 누가 저와 손을 맞잡겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부디 저를 위하여 보증을 서 주십시오.’ 히브리어는 보증이나 보장을 제공하는 법적 언어를 사용합니다. ‘당신께’는 직역하면 ‘당신과 함께’이며, 하나님께서 친히 보증을 맡아 주시기를 청하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘누가 내 손을 칠 것인가?’ 히브리어의 이 관용구는 손을 맞잡거나 손을 쳐 보증·계약을 맺는 행위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה
  english_pob_choice: Lay down
  chosen_korean: 부디 … 세워 주십시오
  alternatives_korean:
  - 놓아 주십시오
  - 두어 주십시오
  lexicon: HALOT
  rationale: 명령형 שׂים의 일반적 의미보다, 이 문맥의 법적·보증적 성격을 살려 ‘세우다’로 옮겼습니다. 간청의 뉘앙스는 ‘부디’와 존댓말 명령형으로 반영했습니다.
- source_word: עָרְבֵנִי
  english_pob_choice: a pledge for me
  chosen_korean: 저를 위해 담보를 세워
  alternatives_korean:
  - 저를 위해 보증해
  - 저를 위해 보증 서 주십시오
  lexicon: HALOT
  rationale: עָרַב의 ‘보증하다/담보 서다’ 의미를 살려 법적 책임을 지는 행위를 드러냈습니다. ‘담보’는 현대 한국어에서 다소 중립적이지만, 본문이 요구하는 보증·안전장치의 법적 이미지를 잘 보존합니다.
- source_word: עִמָּךְ
  english_pob_choice: with yourself
  chosen_korean: 당신 곁에
  alternatives_korean:
  - 당신과 함께
  - 당신 자신과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘당신과 함께/당신 자신과 함께’이지만, 영어 POB가 지적하듯 화자가 하나님에게 그 보증의 상대가 되어 달라고 요청하는 뉘앙스를 한국어에서는 ‘당신 곁에’로 자연스럽게 살렸습니다.
- source_word: יִתָּקֵעַ־
  english_pob_choice: would strike hands
  chosen_korean: 제 손을 잡아 줄 수 있겠습니까
  alternatives_korean:
  - 제 손을 쳐 맞잡아 줄 수 있겠습니까
  - 저와 손을 잡고 보증해 줄 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손을 치다/맞잡다’는 맹세·보증 계약의 체결을 가리키므로, 문자적 동작을 유지하되 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘잡아 주십시오’는 단순한 우정의 악수가 아니라 보증 행위임을 문맥상 드러내려는 선택입니다.
theological_decisions:
- issue: 하나님께 직접 보증인이 되어 달라는 요청의 표현
  chosen_reading: 욥이 하나님께 직접 자기의 보증을 서 달라고 간청하는 흐름을 유지했습니다.
  alternative_readings:
  - 일반적인 중재자나 제3의 보증인을 요청하는 것으로 약화시킬 수 있음
  rationale: ‘저를 위해 담보를 세워 주십시오’와 ‘당신 곁에 누가 또 있겠습니까?’는 본문이 제3자를 찾기보다 하나님 자신을 향해 요청하는 긴장을 분명히 드러냅니다. 이 긴장을 해소하지 않고 그대로 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
