language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/שַּׁ֣חַת קָ֭רָאתִי אָ֣בִ/י אָ֑תָּה אִמִּ֥/י וַ֝/אֲחֹתִ֗/י לָֽ/רִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/014.yaml
  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: ko
  text: 구덩이에게는 「당신은 내 아버지입니다」라고 부르고, 벌레에게는 「내 어머니와 내 누이입니다」라고 부릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַשַּׁחַת / pit
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 무덤
  - 스올
  - 구렁
  lexicon: שַׁחַת
  rationale: 히브리어 שַׁחַת은 문맥상 죽음의 세계를 가리키지만, 여기서는 POB의 영어처럼 의인화된 대상인 ‘the pit’를 직접 살려 ‘구덩이’로 옮겼습니다.
- source_word: קָרָאתִי
  english_pob_choice: I call
  chosen_korean: 부릅니다
  alternatives_korean:
  - 부르겠습니다
  - 부른다고 합니다
  - 외칩니다
  lexicon: קרא
  rationale: 완료형이지만 시적 진술로서 현재적·반복적 발화를 드러내는 영어 POB의 ‘I call’을 따라, 자연스러운 현재형 ‘부릅니다’로 옮겼습니다.
- source_word: אָבִי / אִמִּי וַאֲחֹתִי
  english_pob_choice: my father / My mother and my sister
  chosen_korean: 내 아버지입니다 / 내 어머니와 내 누이입니다
  alternatives_korean:
  - 내 아버지예요 / 내 어머니와 내 누이예요
  - 제 아버지입니다 / 제 어머니와 제 누이입니다
  lexicon: אָב / אֵם / אָחוֹת
  rationale: 직접 화법의 인칭 대명사를 유지하면서 관계 호칭을 분명히 드러내기 위해 ‘내 아버지/내 어머니/내 누이’로 옮겼고, ‘누이’는 혈연적 ‘sister’를 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 죽음과 부패의 의인화된 대상에 대한 직접 호칭
  chosen_reading: 욥이 죽음의 구덩이와 썩어 가는 것을 자기 가족처럼 부르는 극단적 역설을 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘무덤’이나 ‘스올’로 풀어 독자에게 익숙하게 만들기
  - 상징성을 약화시켜 일반적 비유로 처리하기
  rationale: 본문은 정서적 절망과 자기 붕괴를 강하게 표현하므로, 전통적 완곡어보다 원문의 충격을 보존하는 쪽이 의미를 더 정확히 전달합니다.
  doctrine_reference: 시적 지혜문학의 수사와 죽음 이미지
