id: JOB.17.1
reference: Job 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
  footnotes:
  - marker: a
    text: Or 'My breath is broken.' The Hebrew רוּחַ can mean 'spirit' or 'breath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my days are snuffed out.' The verb likely carries the image of something being quenched or extinguished.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 영이 깨졌습니다[a]. 제 날들이 꺼졌습니다[b]. 무덤들이 저를 기다립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 숨’. 히브리어 רוּחַ는 ‘영’과 ‘숨’을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 날들이 꺼져 버렸습니다’. 이 동사는 불이 꺼지듯 소멸하는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 제 영
  alternatives_korean:
  - 제 숨
  - 제 생기
  lexicon: HALOT
  rationale: רוּחַ는 영, 숨, 바람을 뜻할 수 있지만, 욥의 탄식 문맥에서는 내면의 생명이 꺾인 상태를 가리키는 ‘영’이 가장 자연스럽습니다. 영어 POB의 ‘my spirit’도 이 선택을 지지합니다.
- source_word: חֻבָּלָה
  english_pob_choice: is broken
  chosen_korean: 깨졌습니다
  alternatives_korean:
  - 부서졌습니다
  - 망가졌습니다
  - 무너졌습니다
  lexicon: HALOT
  rationale: 수동형의 훼손·붕괴를 한국어 탄식체로 간결하게 살리기 위해 ‘깨졌습니다’를 택했습니다. ‘부서졌습니다’보다 내면 상태에 더 잘 맞습니다.
- source_word: נִזְעָכוּ
  english_pob_choice: are extinguished
  chosen_korean: 꺼졌습니다
  alternatives_korean:
  - 소멸했습니다
  - 꺼져 버렸습니다
  - 타버렸습니다
  lexicon: HALOT
  rationale: 이 동사는 불이나 빛이 꺼지는 이미지를 갖기 때문에, ‘꺼졌습니다’가 영어 POB의 ‘extinguished’와 원문의 은유를 가장 직접적으로 옮깁니다.
- source_word: קְבָרִים לִי
  english_pob_choice: graves await me
  chosen_korean: 무덤들이 저를 기다립니다
  alternatives_korean:
  - 무덤들이 제 앞에 있습니다
  - 무덤들이 저를 위해 있습니다
  - 무덤만이 저를 기다립니다
  lexicon: HALOT
  rationale: 복수형 קְבָרִים를 살려 ‘무덤들’로 옮기고, לִי의 미래 지향적 압박을 ‘기다립니다’로 풀어 영어 POB의 체감을 반영했습니다.
theological_decisions:
- issue: ‘רוּחִי’의 의미를 영/숨 가운데 어떻게 둘 것인가
  chosen_reading: 본문에는 ‘제 영’으로 두고, 육체적 생명기운의 울림은 문맥 전체에서 남겨 둡니다.
  alternative_readings:
  - 제 숨
  - 제 생기
  rationale: 욥의 탄식은 단순한 호흡의 중단보다 내면의 소진과 절망을 강조하므로, 지나치게 생리적으로 좁히지 않고 ‘영’으로 번역하는 편이 문맥의 무게를 잘 보존합니다.
  doctrine_reference: 욥기의 탄식 문맥과 인간의 내면/생명기력 표현에 대한 어휘 선택
- issue: 무덤들이 ‘기다린다’는 표현의 인격화
  chosen_reading: 무덤들의 도래하는 종말을 의인화하여 옮기되, 과장된 신학 해석은 덧붙이지 않습니다.
  alternative_readings:
  - 무덤들이 제 앞에 있습니다
  - 무덤이 저를 기다립니다
  rationale: 원문 לִי는 ‘나를 위한/나를 향한’ 방향성을 주며, POB의 ‘await me’는 죽음의 불가피성을 강하게 드러냅니다. 한국어에서도 동일한 압박감을 살리기 위해 의인화를 유지했습니다.
  doctrine_reference: 욥기 17장의 죽음/절망 이미지
