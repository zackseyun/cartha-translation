  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
  footnotes:
  - marker: a
    text: Or 'the hypocrite.' The Hebrew חָנֵף can denote an impious or irreverent person and in some contexts is traditionally rendered 'hypocrite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이로 인해 정직한 이들은 놀라고, 무죄한 이는 하나님을 모르는 자를 향해 분개합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '위선자.' 히브리어 חָנֵף는 불경한 사람이나 경건을 모독하는 사람을 가리킬 수 있으며, 일부 문맥에서는 전통적으로 '위선자'로 번역됩니다.
    reason: lexical_alternative
