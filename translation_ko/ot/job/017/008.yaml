theological_decisions:
- issue: חָנֵף의 의미 범위
  chosen_reading: '''하나님을 모르는 자''로 옮겨, 단순한 심리적 ''위선자''보다 경건과 불경의 대비를 드러냈습니다.'
  alternative_readings:
  - 위선자
  - 불경한 자
  rationale: 본문의 대조는 정직한 이/무죄한 이 대 하나님을 거스르는 자라는 윤리·종교적 대비이므로, 의미를 좁히지 않고 독자에게 그 긴장을 직접 전달하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 어휘의 윤리·종교적 긴장 보존
