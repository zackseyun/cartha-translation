  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
  footnotes:
  - marker: a
    text: Or 'who will behold it?' The Hebrew verb can be rendered 'see' or 'behold,' and the imperfect may be taken as either simple future or modal ('can').
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 내 희망은 어디에 있습니까? 내 희망을 누가 볼 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “볼 수 있겠습니까”는 히브리어 미완료형의 가능성·능력 뉘앙스를 반영한 번역입니다. “볼 것입니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ֭/אַיֵּה
  english_pob_choice: And where
  chosen_korean: 그렇다면 … 어디에 있습니까?
  alternatives_korean:
  - 그리고 어디에 있습니까?
  - 그런데 어디에 있습니까?
  lexicon: HALOT
  rationale: אַיֵּה는 단순한 위치 질문이 아니라 탄식 속 추궁을 담으므로, 한국어에서도 앞선 문맥을 이어 주는 자연스러운 전환어와 함께 물음으로 옮겼습니다.
- source_word: אֵפ֣וֹ
  english_pob_choice: then
  chosen_korean: 그렇다면
  alternatives_korean:
  - 그러면
  - 정녕
  lexicon: HALOT
  rationale: אֵפוֹ의 강조·추론 기능을 한국어에서는 ‘그렇다면’으로 살려, 감정적 탄식의 흐름을 자연스럽게 유지했습니다.
- source_word: תִקְוָתִ֑/י
  english_pob_choice: my hope
  chosen_korean: 내 희망
  alternatives_korean:
  - 나의 희망
  - 내 기대
  lexicon: HALOT
  rationale: תִקְוָה는 여기서 ‘희망’이 가장 직접적이며, 시적 반복을 살리기 위해 한 번은 주어 자리, 한 번은 목적어 자리에 그대로 유지했습니다.
- source_word: יְשׁוּרֶֽ/נָּה
  english_pob_choice: can see it
  chosen_korean: 볼 수 있겠습니까
  alternatives_korean:
  - 보겠습니까
  - 바라볼 수 있겠습니까
  - 볼 수 있습니까
  lexicon: HALOT
  rationale: שור는 ‘보다/바라보다/응시하다’의 뜻이지만, 문맥상 가능성을 묻는 탄식이므로 ‘볼 수 있겠습니까’로 모달 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 욥의 수사적 질문의 정서 보존
  chosen_reading: 두 개의 질문을 모두 종결형 의문문으로 옮겨, 희망의 부재를 단정하기보다 절망 속 탄식을 드러냈습니다.
  alternative_readings:
  - 희망은 어디에 있습니까? 내 희망을 누가 보겠습니까?
  - 그렇다면 희망은 어디 있습니까? 누가 그것을 볼 수 있습니까?
  rationale: 본문은 지적 정보보다 절망의 수사학을 전달하므로, 한국어에서도 단정문으로 완화하지 않고 질문의 긴장을 유지했습니다.
  doctrine_reference: 욥기의 탄식과 지혜 문학의 수사적 질문
