  yaml_path: translation/ot/job/017/005.yaml
  text: He denounces friends for a share[a], and the eyes of his children will fail.
  footnotes:
  - marker: a
    text: Or 'for a portion,' 'for gain,' or, according to another interpretation, 'as flattery.' The Hebrew phrase is difficult, but the sense is of treating friends for personal advantage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 친구들을 배반하여 한 몫을 챙기려고 하지만, 그의 자녀들의 눈은 쇠해 갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '몫을 위해', '이익을 위해', 혹은 다른 해석으로는 '아첨하여'. 히브리어 구절은 어렵지만, 뜻은 친구들을 개인적 이익을 위해 다루는 데 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  english_pob_choice: for a share[a]
  chosen_korean: 한 몫을 챙기려고
  alternatives_korean:
  - 몫을 위해
  - 몫을 얻으려고
  - 분배 몫을 위해
  lexicon: HALOT
  rationale: חֵלֶק의 기본 의미인 '몫, 분깃, 부분'을 살리면서, 이 문맥의 이익 추구·사익 도모 뉘앙스를 한국어로 자연스럽게 드러냈습니다.
- source_word: יַגִּיד
  english_pob_choice: denounces
  chosen_korean: 배반하여
  alternatives_korean:
  - 고발하여
  - 폭로하여
  - 고자질하여
  lexicon: HALOT
  rationale: 히필 נגד의 '알리다/드러내다'에서 문맥상 친구들을 해치는 배신 행위가 핵심이므로, 법정 용어보다 관계적 배신을 직접 드러내는 표현을 택했습니다.
- source_word: רֵעִים
  english_pob_choice: friends
  chosen_korean: 친구들
  alternatives_korean:
  - 동료들
  - 벗들
  - 동반자들
  lexicon: HALOT
  rationale: 단순한 동료보다 가까운 관계를 가리켜야 배신의 강도가 살아나므로 '친구들'이 가장 적절합니다.
- source_word: תִּכְלֶנָה
  english_pob_choice: will fail
  chosen_korean: 쇠해 갑니다
  alternatives_korean:
  - 시들어 갑니다
  - 어두워집니다
  - 사라져 갑니다
  lexicon: HALOT
  rationale: 눈을 주어로 할 때 '쇠해 갑니다'는 시력 상실·기력 소진의 이미지를 보존하면서도 현대 한국어로 자연스럽습니다.
theological_decisions:
- issue: 'שכר-도덕적 역전의 표현: 친구를 배반해 이익을 얻으려는 행동과 자녀의 눈이 쇠하는 결과의 병치'
  chosen_reading: 문장은 개인적 이익을 위한 배신이 결국 자기 집안에 심판적 결핍을 불러온다는 역설로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 경고
  - 사회적 평판 손상에 대한 묘사
  rationale: 히브리어 병치는 단순한 인간관계 손상보다 더 강한 보응의 뉘앙스를 가지므로, 결과절의 무게를 살렸습니다.
  doctrine_reference: 잠언적 보응/도덕적 인과의 일반 원리
