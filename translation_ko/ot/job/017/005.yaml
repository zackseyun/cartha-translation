  naturalness: ‘친구들을 자기 몫을 얻기 위해 고발하는 사람’과 ‘그 자녀들의 눈은 쇠할 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 격언적 문체도 유지합니다. ‘눈이 쇠하다’는 문학적·성경적 문맥에서 자연스러우며, 시력의 쇠잔 또는 소진이라는 원문의 이미지를 보존합니다.
