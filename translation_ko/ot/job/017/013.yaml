  rationale: 원어의 개념 범위를 유지하는 직역성을 살리면서도 한국어에서 의미가 통하는 전통적 음역/번역어를 택했습니다. ‘무덤’은 지나치게 좁아 원문보다 축소됩니다.
- source_word: בֵּיתִי
  english_pob_choice: as my house
  chosen_korean: 내 집으로
  alternatives_korean:
  - 내 집처럼
  - 내 집으로 삼아
  lexicon: HALOT
  rationale: ‘스올’을 자신의 거처로 여긴다는 관계를 한국어에서는 서술격보다 목적격 보어로 자연스럽게 드러내어 원문의 은유를 보존했습니다.
- source_word: בַּחֹשֶׁךְ
  english_pob_choice: in the darkness
  chosen_korean: 어둠 속에
  alternatives_korean:
  - 어둠 가운데
  - 흑암 속에
  lexicon: HALOT
  rationale: 정관사 포함 표현을 한국어 관용에 맞게 ‘어둠 속에’로 옮겨, 죽음/스올의 음울한 분위기를 유지했습니다.
- source_word: רִפַּדְתִּי יְצוּעָי
  english_pob_choice: I spread my bed
  chosen_korean: 내 침상을 깔아 놓기를
  alternatives_korean:
  - 내 침상을 펴기를
  - 내 자리깔개를 준비하기를
  lexicon: HALOT
  rationale: ‘펴다’보다 ‘깔아 놓다’가 침상 준비의 구체적 동작을 더 잘 살립니다. ‘침상’은 죽음의 휴식 이미지를 유지하면서도 현대어에서 이해 가능합니다.
theological_decisions:
- issue: שְׁאוֹל을 한국어에서 어떻게 처리할지
  chosen_reading: ‘음부’로 옮겨, 단순한 매장지보다 죽은 자들의 처소라는 넓은 의미를 드러냅니다.
  alternative_readings:
  - 스올
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 절의 초점은 죽음 이후의 거처를 향한 절망적 기대이지, 단지 장례 매장지를 말하는 것이 아닙니다. 따라서 원문의 개념 범위를 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: 원어 우선 원칙; 개념을 축소하지 않고 긴장을 유지하는 번역
