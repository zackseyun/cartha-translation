translation:
  language: ko
  text: 내가 스올[a]이 내 집이 되기를 바라고, 어둠 속에 내 침상을 편다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’ 또는 ‘죽은 자들의 세계’. 히브리어 ‘스올’은 죽은 자들의 처소를 가리키며, 단순한 매장지만을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 내가 … 바란다면
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 히브리어의 조건문을 살려 가정적 진술로 옮기되, 한국어에서는 자연스럽게 ‘-다면’ 구조로 풀어야 합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 음부
  alternatives_korean:
