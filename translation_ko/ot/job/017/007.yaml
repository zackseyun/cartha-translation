  text: וַ/תֵּ֣כַהּ מִ/כַּ֣עַשׂ עֵינִ֑/י וִֽ/יצֻרַ֖/י כַּ/צֵּ֣ל כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/007.yaml
  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
  footnotes:
  - marker: a
    text: Or 'from anger,' 'from vexation,' or 'from sorrow.' The Hebrew term can denote emotional agitation in several senses; here it is rendered 'grief' because the context is lament and suffering.
    reason: lexical_alternative
  - marker: b
    text: Or 'my form,' 'my members,' or 'my frame.' The Hebrew likely refers to Job's bodily features or members as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 근심으로 내 눈이 흐려지고, 내 온몸은 그림자와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘근심’은 여기서 כַּעַשׂ의 가능한 의미들(분노, 격분, 슬픔, 근심) 가운데, 욥의 탄식 문맥에 가장 잘 맞는 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 온몸’은 히브리어의 ‘내 지체들/형체/몸의 부분들’에 해당하는 넓은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  english_pob_choice: has grown dim
  chosen_korean: 흐려지고
  alternatives_korean:
  - 어두워지고
  - 희미해지고
  - 침침해지고
  lexicon: HALOT
  rationale: כהה는 ‘희미해지다, 어두워지다’의 뜻이므로, 눈의 시력이 약해진 상태를 자연스럽게 드러내는 ‘흐려지고’로 옮겼습니다.
- source_word: מִכַּעַשׂ
  english_pob_choice: from grief
  chosen_korean: 근심으로
  alternatives_korean:
  - 비탄으로
  - 슬픔으로
  - 분노로
  - 격분으로
  lexicon: HALOT
  rationale: כַּעַשׂ는 문맥에 따라 분노·격분·근심·슬픔을 가질 수 있는데, 욥기의 탄식 문맥에서는 고통에서 비롯된 내적 괴로움을 나타내므로 ‘근심’이 가장 무난합니다.
- source_word: וִיצֻרַי
  english_pob_choice: my members
  chosen_korean: 내 온몸
  alternatives_korean:
  - 내 지체들
  - 내 몸의 부분들
  - 내 형체
  lexicon: HALOT
  rationale: 이 단어는 신체의 지체나 형체 전체를 가리킬 수 있으므로, 시적 병행과 맥락을 살려 전체성을 드러내는 ‘내 온몸’으로 옮겼습니다.
- source_word: כַּצֵּל
  english_pob_choice: like a shadow
  chosen_korean: 그림자와 같습니다
  alternatives_korean:
  - 그림자 같습니다
  - 그림자처럼 됩니다
  lexicon: HALOT
  rationale: 비유가 주는 덧없음과 쇠약함을 살리기 위해, 한국어에서 자연스러운 비교문형인 ‘그림자와 같습니다’를 택했습니다.
