base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
  footnotes:
  - marker: a
    text: Or 'the parts of Sheol' or 'the bolts/bars of Sheol.' The Hebrew image likely evokes the imprisoning gates of the realm of the dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'Shall we together rest in the dust?' The final Hebrew noun can be understood as 'descent' or, by some interpreters, as 'rest.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 스올의 빗장들까지 내려가겠습니까? 우리가 함께 흙 위로 내려가겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올의 부분들’ 혹은 ‘스올의 빗장/문빗장들’입니다. 히브리어 이미지는 아마도 죽은 자들의 영역을 가두는 문을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 함께 흙 위에서 쉬겠습니까?’로도 이해할 수 있습니다. 마지막 히브리어 낱말은 ‘내려감’ 또는 일부 해석에서는 ‘쉼’으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  english_pob_choice: bars of
  chosen_korean: 빗장들
  alternatives_korean:
  - 문빗장들
  - 자물쇠들
  - 막대기들
  lexicon: HALOT
  rationale: 스올을 가두는 이미지로 이해한 POB의 ‘bars of’에 맞춰, 감금과 봉쇄의 뜻을 살리는 ‘빗장들’로 옮겼습니다.
- source_word: שְׁאֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
