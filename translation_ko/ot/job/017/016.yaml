  - 죽은 자들의 세계
  - 저승
  lexicon: HALOT
  rationale: ‘grave’로 평준화하지 않고 히브리어 개념어를 보존해야 하므로 음역 ‘스올’을 사용했습니다.
- source_word: אִם יַחַד
  english_pob_choice: Shall we descend together
  chosen_korean: 우리가 함께 내려가겠습니까
  alternatives_korean:
  - 우리가 같이 내려가겠습니까
  - 함께 내려가겠습니까
  lexicon: HALOT
  rationale: אִם의 수사적 질문 기능을 한국어 의문형으로 살리고, יַחַד은 ‘함께’로 자연스럽게 옮겼습니다.
- source_word: עַל עָפָר / נָחַת
  english_pob_choice: into the dust / descend
  chosen_korean: 흙으로 내려가겠습니까
  alternatives_korean:
  - 티끌로 내려가겠습니까
  - 먼지로 내려가겠습니까
  - 흙에 함께 쉬겠습니까
  lexicon: HALOT
  rationale: ‘dust’의 장례·죽음 이미지를 한국어 성경에서 통용되는 ‘흙’으로 살리되, POB가 유지한 하강 이미지를 따라 ‘내려가다’로 번역했습니다.
theological_decisions:
- issue: 스올과 흙의 병렬이 단순한 매장지가 아니라 죽음의 영역으로 향하는 하강 이미지를 만든다는 점
  chosen_reading: 스올의 빗장들까지 내려감과 흙으로의 하강을 병렬된 죽음의 이미지로 유지했습니다.
  alternative_readings:
  - 무덤으로 내려감
  - 저승에서 쉬게 됨
  rationale: 본문의 시적 수사와 POB의 어휘 선택이 가리키는 죽음의 경계 이미지를 약화시키지 않기 위해, 더 일반적인 ‘무덤/저승’으로 평준화하지 않았습니다.
  doctrine_reference: 시적 지하세계 표상 보존
