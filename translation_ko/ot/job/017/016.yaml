  text: בַּדֵּ֣י שְׁאֹ֣ל תֵּרַ֑דְנָה אִם יַ֖חַד עַל עָפָ֣ר נָֽחַת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
  footnotes:
  - marker: a
    text: Or 'the parts of Sheol' or 'the bolts/bars of Sheol.' The Hebrew image likely evokes the imprisoning gates of the realm of the dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'Shall we together rest in the dust?' The final Hebrew noun can be understood as 'descent' or, by some interpreters, as 'rest.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 스올의 빗장들까지 내려가겠습니까? 우리가 함께 흙으로 내려가겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올의 부분들’ 혹은 ‘스올의 빗장/문빗장들’입니다. 히브리어 이미지는 아마도 죽은 자들의 영역을 가두는 문을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 함께 흙 속에 쉬겠습니까?’로도 이해할 수 있습니다. 마지막 히브리어는 ‘내려감’ 또는 일부 해석에서는 ‘쉼’으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  english_pob_choice: bars of
  chosen_korean: 빗장들
  alternatives_korean:
  - 문빗장들
  - 자물쇠들
  - 막대기들
  lexicon: HALOT
  rationale: 스올을 가두는 이미지로 이해한 POB의 ‘bars of’에 맞춰, 감금과 봉쇄의 뜻을 살리는 ‘빗장들’로 옮겼습니다.
- source_word: שְׁאֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 저승
  lexicon: HALOT
  rationale: ‘grave’로 평준화하지 않고 히브리어 개념어를 보존해야 하므로 음역 ‘스올’을 사용했습니다.
- source_word: אִם יַחַד
  english_pob_choice: Shall we descend together
  chosen_korean: 우리가 함께 내려가겠습니까
  alternatives_korean:
  - 우리가 같이 내려가겠습니까
  - 함께 내려가겠습니까
  lexicon: HALOT
  rationale: אִם의 수사적 질문 기능을 한국어 의문형으로 살리고, יַחַד은 ‘함께’로 자연스럽게 옮겼습니다.
- source_word: עַל עָפָר / נָחַת
  english_pob_choice: into the dust / descend
  chosen_korean: 흙으로 내려가겠습니까
  alternatives_korean:
  - 티끌로 내려가겠습니까
  - 먼지로 내려가겠습니까
  - 흙에 함께 쉬겠습니까
  lexicon: HALOT
  rationale: ‘dust’의 장례·죽음 이미지를 한국어 성경에서 통용되는 ‘흙’으로 살리되, POB가 유지한 하강 이미지를 따라 ‘내려가다’로 번역했습니다.
theological_decisions:
- issue: 스올과 흙의 병렬이 단순한 매장지가 아니라 죽음의 영역으로 향하는 하강 이미지를 만든다는 점
  chosen_reading: 스올의 빗장들까지 내려감과 흙으로의 하강을 병렬된 죽음의 이미지로 유지했습니다.
  alternative_readings:
  - 무덤으로 내려감
  - 저승에서 쉬게 됨
  rationale: 본문의 시적 수사와 POB의 어휘 선택이 가리키는 죽음의 경계 이미지를 약화시키지 않기 위해, 더 일반적인 ‘무덤/저승’으로 평준화하지 않았습니다.
  doctrine_reference: 시적 지하세계 표상 보존
