id: JOB.17.9
reference: Job 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
  footnotes:
  - marker: a
    text: Or 'and the clean-handed one adds strength'; the Hebrew literally says 'adds strength,' which may also be understood as 'grows in strength' or, more narrowly, 'gains courage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 의인은 자기 길을 굳게 지키고, 깨끗한 손을 가진 자는 더 강해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘힘을 더한다’입니다. 문맥상 ‘더 강해집니다’, ‘힘이 더해집니다’, 또는 ‘담대함을 얻습니다’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  english_pob_choice: Yet ... holds fast
  chosen_korean: 그런데 ... 굳게 지키고
  alternatives_korean:
  - 그리고 ... 붙들고
  - 하지만 ... 붙들고
  - 그리고 ... 굳게 붙들고
  lexicon: HALOT
  rationale: 문맥상 앞의 비탄을 잇되 약한 대조를 띠므로 ‘그런데’로 옮겼고, אחז의 ‘붙들다/붙잡다’는 한국어에서 ‘굳게 지키다’가 지속적 견인을 자연스럽게 드러냅니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 살려 대표적 단수로 ‘의인’을 택해, ‘사람’이나 ‘자’를 덧붙이지 않고도 대상성을 유지했습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 자기 길
  alternatives_korean:
  - 그의 길
  - 자신의 길
  - 자기의 삶의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 삶의 길/행로 의미를 살리되 현대 한국어에서 더 자연스럽게 읽히도록 ‘자기 길’로 옮겼습니다.
- source_word: וּטֳהָר יָדַיִם יֹסִיף אֹמֶץ
  english_pob_choice: the one with clean hands grows stronger
  chosen_korean: 깨끗한 손을 가진 자는 더 강해집니다
  alternatives_korean:
  - 손이 깨끗한 자는 힘을 더합니다
  - 깨끗한 손의 사람은 더 강해집니다
  - 손이 깨끗한 이는 더욱 강해집니다
  lexicon: HALOT
  rationale: ‘깨끗한 손’은 무죄/정결의 관용구이므로 이미지와 의미를 함께 보존했고, יֹסִיף אֹמֶץ는 ‘힘/담대함을 더하다’의 결과를 한국어 자연문장으로 풀어 ‘더 강해집니다’로 처리했습니다.
theological_decisions:
- issue: 의인과 ‘깨끗한 손’의 병렬 표현을 어떻게 살릴지
  chosen_reading: 두 표현을 별개의 묘사가 아니라, 인격의 의로움과 행위의 무결함을 함께 보여주는 병렬로 유지했습니다.
  alternative_readings:
  - ‘의인’만 강조해 뒤의 손 이미지를 약화
  - ‘깨끗한 손’을 단순히 도덕적 선행으로 평탄화
  rationale: 히브리어는 대표적 의인과 그 사람의 ‘깨끗한 손’을 병렬로 제시하므로, 둘 다 살아 있도록 옮겨 독자가 인격과 행위의 결합을 보게 했습니다.
  doctrine_reference: 잠언적/지혜문학의 의인 표상
