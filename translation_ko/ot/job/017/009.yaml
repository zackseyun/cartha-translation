  to: 그러나 의인은 자기의 길을 굳게 붙들며, 손이 깨끗한 사람은 더욱 강해집니다.[a]
  rationale: 첫 동사를 ‘굳게 붙들며’로 고쳐 원문의 אָחַז가 나타내는 지속적 붙듦을 보존했습니다. 접속사는 앞 절들의 어두운 묘사 뒤에 이어지는 대조적 흐름을 반영하여 ‘그러나’로 옮겼습니다. 둘째 행의 ‘더욱 강해집니다’와 각주는 원문의 ‘힘을 더한다’라는 표현 및 אֹמֶץ의 ‘힘/용기’ 의미 범위를 함께 보존합니다.
  reviewer_model: gpt-5.6-terra
