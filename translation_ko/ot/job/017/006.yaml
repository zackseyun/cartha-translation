id: JOB.17.6
reference: Job 17:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֭/הִצִּגַ/נִי לִ/מְשֹׁ֣ל עַמִּ֑ים וְ/תֹ֖פֶת לְ/פָנִ֣ים אֶֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
  footnotes:
  - marker: a
    text: Or 'He has made me a proverb among the peoples.' The Hebrew term likely refers to a proverbial object of scorn.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and I have become a spitting before faces,' that is, an object of open contempt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 뭇 민족의 속담거리가 되게 하셨고, 나는 사람들이 내 앞에서 침을 뱉는 대상이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뭇 민족의 비웃음거리’. ‘속담거리’는 사람들이 입에 올리는 본보기라는 뜻이며, 여기서는 조롱과 경멸의 대상이라는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나는 얼굴들 앞의 침 뱉음이 되었다’입니다. 사람들이 대면하여 드러내는 공개적 경멸과 모욕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  english_pob_choice: He has made me
  chosen_korean: 나를 … 삼으셨고
  alternatives_korean:
  - 나를 … 되게 하셨고
  - 나를 … 만들으셨고
  - 나를 … 세우셨고
  lexicon: HALOT
  rationale: 힙필형의 인과적 의미를 살려 하나님이 욥을 공개적 수치의 대상으로 ‘만드신’ 결과를 표현하되, 한국어에서는 자연스러운 ‘삼다’로 옮겼습니다.
- source_word: לִמְשֹׁל
  english_pob_choice: a byword
  chosen_korean: 속담거리
  alternatives_korean:
  - 비웃음거리
  - 우화거리
  - 속담
  lexicon: HALOT
  rationale: 단순한 ‘속담’보다 사람들 입에 오르내리며 조롱의 대상이 되는 뉘앙스를 살리기 위해 ‘속담거리’로 옮겼습니다.
- source_word: עַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 민족들의
  alternatives_korean:
  - 백성들의
  - 사람들 가운데의
  - 민족들 사이의
  lexicon: HALOT
  rationale: 복수형 עַמִּים을 살려 단수화하지 않고 ‘민족들’로 유지했습니다.
- source_word: וְתֹפֶת לְפָנִים
  english_pob_choice: one before whom people spit
  chosen_korean: 사람들 앞에서 침 뱉음거리가
  alternatives_korean:
  - 얼굴 앞에 침을 당하는 자가
  - 사람들 앞에서 침을 맞는 자가
  - 침 뱉음의 대상이
  lexicon: HALOT
  rationale: 직역하면 매우 낯설지만, 공개적 경멸의 이미지인 ‘before faces’와 ‘spitting’의 수치를 한국어로 드러내기 위해 ‘사람들 앞에서 침 뱉음거리’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위와 욥의 수치 표현을 직설적으로 유지할지 여부
  chosen_reading: 하나님이 욥을 공개적 조롱과 경멸의 대상으로 ‘삼으셨다’는 진술을 완화하지 않고 유지했습니다.
  alternative_readings:
  - 주어를 흐리게 하여 수동적으로 옮김
  - ‘비웃음거리’처럼 정서를 약화시킴
  rationale: 본문은 고난의 주체적 경험을 강하게 진술하므로, 수치와 경멸의 이미지를 약화하지 않는 쪽이 원문 효과를 더 잘 반영합니다.
  doctrine_reference: 욥기 17:6의 시적 탄원 표현
- issue: ‘침 뱉음’ 이미지의 노골성 유지
  chosen_reading: ‘침 뱉음거리가 되었습니다’로 직설성을 유지했습니다.
  alternative_readings:
  - ‘모욕거리가 되었습니다’로 완화
  - ‘경멸의 대상이 되었습니다’로 의역
  rationale: 영어 POB가 spitting의 물리적 수치를 보존하므로, 한국어도 그 불쾌하고 공개적인 모욕성을 보존해야 합니다.
  doctrine_reference: 시적 수치/조롱의 표상
