revisions:
- from: 그가 나를 민족들의 속담거리로 삼으셨고, 나는 사람들 앞에서 침 뱉음거리가 되었습니다.[a][b]
  to: 그가 나를 뭇 민족의 속담거리가 되게 하셨고, 나는 사람들이 내 앞에서 침을 뱉는 대상이 되었습니다.[a][b]
  rationale: 사역 표현과 ‘민족들’의 복수는 유지하되, 비관용적인 ‘침 뱉음거리’를 ‘침을 뱉는 대상’으로 고쳐 원문의 모욕 이미지를 현대 한국어로 명료하게 전달했습니다. 각주도 영어 POB를 단순히 언급하는 대신 원문 어휘의 가능한 의미와 직역을 독립적으로 설명하도록 정비했습니다.
