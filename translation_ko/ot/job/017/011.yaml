  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָמַ֣/י עָ֭בְרוּ זִמֹּתַ֣/י נִתְּק֑וּ מ֖וֹרָשֵׁ֣י לְבָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/011.yaml
  text: My days have passed by; my plans are broken off[a], the desires of my heart.
  footnotes:
  - marker: a
    text: Or 'the possessions of my heart,' 'the cherished things of my heart,' or 'the inheritances of my heart.' The Hebrew expression is rare and difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 날들은 지나갔고, 내 계획들은 끊어졌으며, 내 마음의 소망들만 남았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 희귀하고 어려워서, ‘내 마음의 소유물들’, ‘내 마음의 소중한 것들’, 또는 ‘내 마음의 유산들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי / עָבְרוּ
  english_pob_choice: My days have passed by
  chosen_korean: 내 날들은 지나갔고
  alternatives_korean:
  - 내 생애의 날들은 지나갔고
  - 내 날들은 지나갔습니다
  lexicon: HALOT
  rationale: 히브리어의 소유격과 완료상을 자연스러운 합쇼체로 옮기되, 시간의 소멸감을 살려 ‘지나갔고’로 처리했습니다.
- source_word: זִמֹּתַי / נִתְּקוּ
  english_pob_choice: my plans are broken off
  chosen_korean: 내 계획들은 끊어졌으며
  alternatives_korean:
  - 내 뜻들은 잘려 나갔으며
  - 내 계획들은 부러졌으며
  - 내 계획들은 끊겼으며
  lexicon: HALOT
  rationale: זִמֹּתַי를 문맥상 ‘계획들’로 옮기고, נתק의 ‘끊기다/떨어져 나가다’ 의미를 살려 ‘끊어졌으며’로 번역했습니다.
- source_word: מוֹרָשֵׁי לְבָבִי
  english_pob_choice: the desires of my heart
  chosen_korean: 내 마음의 소망들만 남았습니다
  alternatives_korean:
  - 내 마음의 소유물들
  - 내 마음의 소중한 것들
  - 내 마음의 유산들
  lexicon: HALOT
  rationale: 이 구절의 난해한 명사구는 영어 POB의 해설처럼 ‘마음이 붙들고 있던 바람/소망’의 의미로 풀어, 병행을 살리면서도 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 명사구의 난해성 처리
  chosen_reading: 직역 가능한 ‘유산/소유물’보다 문맥상 ‘소망들’로 풀어 표현했습니다.
  alternative_readings:
  - ‘내 마음의 소유물들’
  - ‘내 마음의 유산들’
  - ‘내 마음의 소중한 것들’
  rationale: 히브리어 표현이 희귀하고 어려우므로, POB의 lexical note를 따라 문맥에서 의도된 내면의 기대와 열망을 드러내는 번역을 택했습니다.
  doctrine_reference: 시적 탄식의 의미 보존
