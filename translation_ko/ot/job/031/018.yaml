  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מִ֭/נְּעוּרַ/י גְּדֵלַ֣/נִי כְ/אָ֑ב וּ/מִ/בֶּ֖טֶן אִמִּ֣/י אַנְחֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/018.yaml
  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
  footnotes:
  - marker: a
    text: Or 'he made me grow up like a father' or 'I raised him like a father.' The Hebrew of this line is difficult, and some understand Job to be speaking of his care for the fatherless rather than of being raised.
    reason: alternative_reading
  - marker: b
    text: The feminine 'her' likely refers to the widow from the previous verse.
    reason: cross_reference
translation:
  language: ko
  text: 내가 어려서부터 그는 내게 아버지처럼 길러 주었고, 내 어머니의 태에서부터 나는 그녀를 인도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절의 남성 단수와 둘째 절의 여성 단수를 그대로 유지합니다. 둘째 절의 ‘그녀’는 앞 절의 과부를 가리키는 것으로 이해됩니다.
    reason: source_note
lexical_decisions:
- source_word: מִנְּעוּרַי
  english_pob_choice: from my youth
  chosen_korean: 내가 어려서부터
  alternatives_korean:
  - 내 젊은 시절부터
  - 어릴 때부터
  lexicon: HALOT
  rationale: 시작 시점을 나타내는 표현으로, 문맥상 ‘어려서부터’가 자연스럽고 ‘from my youth’의 시간적 범위를 잘 살립니다.
- source_word: גְּדֵלַנִי כְאָב
  english_pob_choice: he raised me like a father
  chosen_korean: 그는 내게 아버지처럼 길러 주었고
  alternatives_korean:
  - 그는 나를 아버지처럼 키웠고
  - 그는 나를 아버지처럼 자라게 했고
  lexicon: HALOT
  rationale: Qal 형태의 גדל을 단순히 ‘크다’로 풀기보다, 돌보아 자라게 했다는 의미를 살려 ‘길러 주었고’로 옮겼습니다. ‘아버지처럼’은 비교의 כ를 분명히 드러냅니다.
- source_word: וּמִבֶּטֶן אִמִּי
  english_pob_choice: and from my mother’s womb
  chosen_korean: 내 어머니의 태에서부터
  alternatives_korean:
  - 어머니의 태에서부터
  - 내 어머니의 뱃속에서부터
  lexicon: HALOT
  rationale: 히브리어의 출발 시점을 가리키는 관용구로, 직역보다 한국어에서 자연스러운 ‘태에서부터’를 택했습니다.
- source_word: אַנְחֶנָּה
  english_pob_choice: I guided her
  chosen_korean: 나는 그녀를 인도했습니다
  alternatives_korean:
  - 나는 그녀를 이끌었습니다
  - 나는 그녀를 돌보았습니다
  lexicon: HALOT
  rationale: Hiphil 동사의 1인칭 단수와 여성 단수 목적어를 살려 ‘인도했습니다’로 옮겼습니다. 앞 절의 남성 단수와 달리 여기서는 여성 단수 대명사를 유지해 본문의 문법적 긴장을 보존했습니다.
theological_decisions:
- issue: 본문의 주어/목적어 참조가 문맥상 갑작스럽게 바뀝니다
  chosen_reading: 첫 번째 절은 ‘아버지처럼 길러 줌’이라는 비유를 유지하고, 두 번째 절은 여성 목적어 ‘그녀’를 그대로 남겨, 히브리어의 성별 표지를 평탄화하지 않았습니다.
  alternative_readings:
  - 첫 절을 ‘나를 아버지처럼 길렀다’로만 매끄럽게 처리함
  - 두 번째 절의 ‘그녀’를 일반화하여 성별 표지를 제거함
  rationale: 본문은 남성 단수와 여성 단수 표지를 함께 보존하고 있어, 이를 한국어에서도 어느 정도 드러내는 편이 원문 관찰에 충실합니다. 해석상의 난점을 해소하기보다 그대로 남겨 두는 것이 본문 증거를 더 잘 반영합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
