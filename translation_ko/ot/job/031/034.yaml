id: JOB.31.34
reference: Job 31:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
  footnotes:
  - marker: a
    text: Or 'the scorn of families.' The Hebrew מִשְׁפָּחוֹת can denote extended families or larger kinship groups; 'clans' was chosen to reflect the broader social sense.
    reason: lexical_alternative
  - marker: b
    text: The verse is part of Job's oath of innocence. The wording is elliptical in Hebrew; the sense is, 'if I feared public opinion ... so that I kept silent and stayed indoors.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 큰 무리[a]를 두려워하고, 씨족들의 멸시가 나를 두렵게 하여 잠잠히 있고 문 밖으로 나가지 않았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 무리’는 히브리어 הָמוֹן רַבָּה의 규모와 사회적 압력을 함께 나타냅니다. 뒤의 ‘씨족들’(מִשְׁפָּחוֹת)은 확대 가족, 씨족, 또는 더 넓은 친족 집단을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 욥의 결백 서약의 문맥에 속합니다. 히브리어는 생략적인 이유절로 되어 있으며, 앞절의 조건적 진술과 함께 읽힙니다. 뜻은 사람들이나 친족 집단의 반응을 두려워하여 침묵하고 집 안에 머물렀다는 경우를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: 기 때문입니다
  alternatives_korean:
  - 때문입니다
  - 왜냐하면
  lexicon: HALOT
  rationale: 원문의 כִּי를 결과 설명의 연결로 보고, 한국어에서는 앞 문장의 이유를 자연스럽게 밝히는 ‘-기 때문입니다’로 옮겼습니다.
- source_word: הָמוֹן רַבָּה
  english_pob_choice: the great multitude
  chosen_korean: 큰 무리
  alternatives_korean:
  - 큰 무리들
  - 대중
  - 큰 군중
  lexicon: HALOT
  rationale: ‘무리’가 הָמוֹן의 집합적·사회적 압력을 잘 살리며, ‘큰’으로 רַבָּה의 규모를 반영했습니다.
- source_word: מִשְׁפָּחוֹת
  english_pob_choice: clans
  chosen_korean: 종족들
  alternatives_korean:
  - 가문들
  - 씨족들
  - 가족들
  lexicon: HALOT
  rationale: 영어 POB의 ‘clans’에 맞춰, 현대 한국어에서 혈연·사회적 단위를 넓게 가리키는 ‘종족들’로 옮겨 ‘가족들’보다 넓은 의미를 유지했습니다.
- source_word: יְחִתֵּנִי
  english_pob_choice: terrified me
  chosen_korean: 나를 두렵게 했습니다
  alternatives_korean:
  - 나를 겁먹게 했습니다
  - 나를 떨게 했습니다
  - 나를 두렵게 하였습니다
  lexicon: HALOT
  rationale: חתת의 ‘두렵게 하다/겁주다’의 뜻을 따라, 앞의 ‘두려워했고’와 구별되도록 ‘나를 두렵게 했습니다’로 옮겼습니다.
theological_decisions:
- issue: 욥의 서원적 자기변호에서 조건적·미완결적 어조를 어떻게 살릴지
  chosen_reading: ‘기 때문입니다’와 과거형 서술을 사용해, 욥이 사람들의 평판을 두려워해 침묵하고 밖으로 나가지 않았다는 진술을 분명히 했습니다.
  alternative_readings:
  - ‘만일 내가 … 두려워했다면’ 식의 조건문
  - ‘… 때문에 나는 잠잠하였으니’처럼 더 직역적인 종결
  rationale: 이 절은 욥의 결백 서약 문맥 안에서 사회적 시선을 두려워한 태도를 말하므로, 의미를 흐리지 않되 현대 한국어에서 자연스럽게 읽히는 서술문으로 정리했습니다.
  doctrine_reference: 욥기 31장의 결백 서약 문맥
- issue: ‘문 밖으로 나가지 않았다’의 이미지 전달
  chosen_reading: ‘문 밖으로 나가지 않았습니다’로 옮겨, 실내에 머무르며 공개적 노출을 피한 이미지를 유지했습니다.
  alternative_readings:
  - ‘문간으로 나가지 않았습니다’
  - ‘출입문 밖으로 나가지 않았습니다’
  rationale: פֶּתַח의 기본 이미지는 출입문/문간이지만, 한국어에서는 ‘문 밖’이 가장 간결하게 은유적·상황적 의미를 전달합니다.
  doctrine_reference: 직접적 신학 쟁점 없음
