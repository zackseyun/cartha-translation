  source_fidelity: 개정이 필요합니다. מִשְׁפָּחוֹת는 여기서 현대 민족 집단을 뜻하는 ‘종족’보다 ‘씨족/가문/친족 집단’이 적절합니다. 또한 כִּי가 이끄는 이유절과 욥기 31장의 서원적 문맥을 반영하도록, 독립적인 사실 진술처럼 시작하는 ‘이는’를 제거하는 편이 좋습니다. ‘문 밖으로 나가지 않았다’는 פֶּתַח의 출입구 이미지를 무리 없이 전달합니다.
  naturalness: ‘큰 무리’, ‘잠잠히 있고’, ‘문 밖으로 나가지 않았습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘나를 두렵게 했습니다’도 가능하지만, 앞 절과의 연결을 위해 ‘나를 두렵게 하여’로 처리하면 문장이 더 매끄럽습니다.
  terminology: ‘종족들’은 מִשְׁפָּחוֹת의 친족·사회 집단 의미를 민족/인종 집단으로 오해하게 할 수 있으므로 ‘씨족들’로 고칩니다. בּוּז는 ‘멸시’, הָמוֹן רַבָּה는 ‘큰 무리’로 적절합니다.
  issues:
  - severity: medium
    issue: ‘종족들’
    rationale: מִשְׁפָּחוֹת는 가족, 확대 가족, 씨족 또는 친족 집단을 가리킵니다. ‘종족’은 현대 한국어에서 민족적·인종적 집단이라는 뜻이 강하여 어휘 범위를 부정확하게 좁힙니다.
