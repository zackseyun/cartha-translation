revisions:
- from: 이는 내가 큰 무리를 두려워했고, 종족들의 멸시가 나를 두렵게 했기 때문입니다. 그래서 나는 잠잠했고 문 밖으로 나가지 않았습니다—[a][b]
  to: 내가 큰 무리[a]를 두려워하고, 씨족들의 멸시가 나를 두렵게 하여 잠잠히 있고 문 밖으로 나가지 않았기 때문입니다[b].
  rationale: ‘종족들’을 ‘씨족들’로 바꾸어 מִשְׁפָּחוֹת의 친족 집단 의미를 보존했습니다. ‘이는’를 삭제하여 원문의 문맥 의존적인 이유절과 결백 서약의 미완결적 흐름을 더 잘 반영했습니다. 각주 a는 원 영어 감사 기록에서 다룬 מִשְׁפָּחוֹת의 어휘적 범위를 포함하도록 보완했고, 각주 b는 이를 실제 고백으로 단정하지 않고 조건적 서원 문맥으로 설명하도록 조정했습니다.
