base_translation:
  language: en
  yaml_path: translation/ot/job/031/020.yaml
  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
  footnotes:
  - marker: a
    text: Or 'from the wool of my sheep.' The Hebrew noun can refer to fleece or shorn wool.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his loins,' a bodily expression referring to the needy person's body being clothed and warmed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 복을 빌어 주지 않았다면—그의 허리가 내 양 떼의 털로 따뜻해지지 않았다면 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘털’은 히브리어 גֵּז가 가리킬 수 있는 깎은 양털/털의 넓은 범위를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허리’는 히브리어 ‘그의 허리들’이라는 신체 표현을 살려, 가난한 사람의 몸이 입히고 덮인 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: if ... not
  chosen_korean: …하지 않았다면
  alternatives_korean:
  - 분명히 …하지 않았다면
  - …하지 않았더라면
  lexicon: HALOT
  rationale: 욥기의 맹세 문맥에서 조건형을 유지하는 것이 중요하므로, 결과를 단정하는 표현보다 ‘…하지 않았다면’으로 조건적 힘을 살렸습니다.
- source_word: בֵרֲכוּנִי
  english_pob_choice: have blessed me
  chosen_korean: 내게 복을 빌어 주지 않았다
  alternatives_korean:
  - 나를 축복하지 않았다
  - 내게 감사하지 않았다
  lexicon: HALOT
  rationale: ברך의 기본 의미를 따라 ‘복을 빌다/축복하다’를 유지했고, 감사로 완화하지 않았습니다.
- source_word: חֲלָצָיו
  english_pob_choice: his loins
  chosen_korean: 그의 허리
  alternatives_korean:
  - 그의 몸
  - 그의 엉덩이
  - 그의 허리춤
  lexicon: HALOT
  rationale: 직역에 가까운 ‘허리’를 택해, 고통받는 사람의 몸 전체를 가리키는 완곡한 신체 환유를 드러냈습니다.
- source_word: וּמִגֵּז כְּבָשַׂי
  english_pob_choice: by the fleece of my sheep
  chosen_korean: 내 양 떼의 털로
  alternatives_korean:
  - 내 양의 양털로
  - 내 양 떼의 깎은 털로
  lexicon: HALOT
  rationale: גֵּז는 깎은 양털/털을 가리키므로, ‘털’로 옮기되 양털의 출처가 분명하도록 ‘내 양 떼의’라고 했습니다.
theological_decisions:
- issue: 맹세적 조건문의 한국어 표현
  chosen_reading: 문장 전체를 ‘…하지 않았다면—…하지 않았다면 말입니다’로 옮겨, 욥의 자기저주적 조건 맹세의 긴장감을 유지했습니다.
  alternative_readings:
  - 단정문처럼 평서로 풀어 쓰는 방식
  - ‘만일 … 않았다면’만 반복하는 방식
  rationale: 본문은 단순 서술이 아니라 맹세적 조건절이므로, 조건성과 응답의 연쇄를 보존하는 것이 신학적·수사학적으로 중요합니다.
  doctrine_reference: Job 31장의 무죄 변론과 맹세 형식
