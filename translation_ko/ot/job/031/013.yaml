  lexicon: HALOT
  rationale: 종과 여종은 전통적이면서도 본문의 종속 신분을 유지합니다. 여기서는 POB의 'slave'를 그대로 옮겨 '노예'로 밀어붙이기보다, 한국어 성경문맥에서 자연스럽고 위계가 덜 과장된 '종/여종'을 택했습니다.
- source_word: בְּרִיבָם עִמָּדִי
  english_pob_choice: when they brought a complaint against me
  chosen_korean: 그들이 나와 다투었을 때 그들의 호소를 외면했다면
  alternatives_korean:
  - 그들이 나와 다툴 때
  - 그들이 나와 송사했을 때 그들의 항변을 물리쳤다면
  - 그들이 나와 분쟁했을 때 그들의 주장을 거절했다면
  lexicon: HALOT
  rationale: ריב는 단순한 말다툼보다 법적 분쟁·항의를 포함하므로 '다투다'와 '호소'를 함께 써서 대립적 분쟁의 성격과 종들의 청구를 반영했습니다.
theological_decisions:
- issue: 종에 대한 משפט의 의미
  chosen_reading: 여기서는 종들이 주인에게 제기한 정당한 권리 주장으로 이해했습니다.
  alternative_readings:
  - 단순한 불평
  - 법정 소송
  - 도덕적 불만
  rationale: 문맥상 욥은 자기 집안의 종들에게까지 정의를 거절하지 않았는지 맹세하므로, משפט을 권리·정당한 청구의 뜻으로 살리는 것이 본문의 윤리적 무게를 보존합니다.
  doctrine_reference: 구약의 공의/정의와 약자 보호의 맥락
