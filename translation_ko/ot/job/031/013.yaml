  lexicon: HALOT
  rationale: מָאַס는 단순한 감정적 혐오보다 법적·실질적으로 받지 않거나 거절하는 뜻이 강하므로, 여기서는 '거절하다'가 가장 자연스럽고 정확합니다.
- source_word: מִשְׁפַּט
