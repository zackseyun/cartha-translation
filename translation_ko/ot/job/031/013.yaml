  text: 내가 만일 내 종이나 내 여종의 권리를 거절했거나, 그들이 나와 다투었을 때 그들의 호소를 외면했다면[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 משפט은 '권리', '법적 권리', 또는 '법적 사건/소송'을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '내 종과 내 여종'은 더 전통적으로 '내 종과 내 여종(여종/시녀)'으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְאַס
  english_pob_choice: I have rejected
  chosen_korean: 거절했거나
  alternatives_korean:
