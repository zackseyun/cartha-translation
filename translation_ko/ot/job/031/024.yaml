    text: ‘순금’은 כֶּתֶם이 가리키는 정련되거나 순수한 금을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘안전’은 מִבְטַחִי를 풀어 옮긴 것으로, ‘내 신뢰’처럼도 번역될 수 있습니다.
