  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא נָתַ֣תִּי לַ/חֲטֹ֣א חִכִּ֑/י לִ/שְׁאֹ֖ל בְּ/אָלָ֣ה נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
  footnotes:
  - marker: a
    text: Or 'with an oath.' The Hebrew noun can mean either 'curse/imprecation' or 'oath,' but here the context of wishing harm favors 'curse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 입이 죄짓도록 내버려 두지 않았습니다. 곧 저주로 그의 생명을 구하게 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹세로.’ 히브리어 명사에는 ‘저주/저주하는 말’과 ‘맹세’ 두 뜻이 있을 수 있으나, 여기서는 해를 비는 문맥이므로 ‘저주’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  english_pob_choice: have not allowed
  chosen_korean: 내버려 두지 않았습니다
  alternatives_korean:
  - 허락하지 않았습니다
  - 허용하지 않았습니다
  lexicon: HALOT
  rationale: ‘주다’가 허용의 관용적 의미로 쓰인 구문이므로, 한국어에서는 자연스럽게 ‘내버려 두지 않았다’로 옮겨 거절의 의지를 살렸습니다.
- source_word: חִכִּי
  english_pob_choice: my mouth
  chosen_korean: 내 입
  alternatives_korean:
  - 내 입술
  - 내 혀
  - 내 입천장
  lexicon: HALOT
  rationale: 직역하면 ‘입천장’이지만, 시적 메타포로서 말하기 주체를 가리키므로 POB의 판단대로 한국어에서도 ‘내 입’이 가장 분명합니다.
- source_word: לִשְׁאֹל
  english_pob_choice: by asking for
  chosen_korean: …하게 하지 않았습니다
  alternatives_korean:
  - 요구하게 하지 않았습니다
  - 구하게 하지 않았습니다
  - 청하게 하지 않았습니다
  lexicon: HALOT
  rationale: 부정의 원인이 되는 행위를 자연스러운 한국어 구조로 풀어, ‘죄짓다’와 연결되는 발화 행위를 드러냈습니다.
- source_word: בְּאָלָה
  english_pob_choice: with a curse
  chosen_korean: 저주로
  alternatives_korean:
  - 저주와 함께
  - 저주하여
  - 맹세로
  lexicon: HALOT
  rationale: 문맥상 해를 빌거나 저주하는 발화가 핵심이므로 기본값은 ‘저주’가 적절하며, 다른 가능한 뜻인 ‘맹세’는 주석으로 보존했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 목숨
  - 그의 영혼
  - 그 사람
  lexicon: HALOT
  rationale: 여기서는 형이상학적 ‘영혼’보다 실제 삶 자체를 가리키므로, POB의 판단을 따라 ‘생명’이 가장 정확합니다.
theological_decisions:
- issue: אָלָה의 의미 범위
  chosen_reading: 본문은 ‘저주’로 옮기되, 히브리어 אָלָה가 ‘맹세’도 뜻할 수 있음을 주석으로 남깁니다.
  alternative_readings:
  - 맹세
  - 맹세의 말
  rationale: 문맥은 해를 비는 언어를 가리키므로 ‘저주’가 우선이며, 어휘의 이중 가능성을 지우지 않기 위해 대안 의미를 보존했습니다.
  doctrine_reference: 욥기 31장 전체의 무죄 변론과 언어 윤리
