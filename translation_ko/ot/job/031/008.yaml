id: JOB.31.8
reference: Job 31:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֭זְרְעָה וְ/אַחֵ֣ר יֹאכֵ֑ל וְֽ/צֶאֱצָאַ֥/י יְשֹׁרָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/008.yaml
  text: then let me sow and another eat[a], and let my offspring be uprooted.
  footnotes:
  - marker: a
    text: Or 'my produce be uprooted' or 'my descendants be rooted out.' The Hebrew צֶאֱצָא can refer to what springs forth, whether offspring or produce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 씨를 뿌리고 다른 이가 먹게 하며, 내 자손은 뿌리째 뽑히기를.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 소산이 뿌리째 뽑히기를’ 또는 ‘내 자손이 뿌리째 뽑히기를’. 히브리어 צֶאֱצָא는 솟아나는 것, 곧 자손이나 소산을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  english_pob_choice: let me sow
  chosen_korean: 내가 씨를 뿌리고
  alternatives_korean:
  - 내가 뿌리고
  - 씨를 뿌리게 하시고
  lexicon: HALOT
  rationale: 히브리어 cohortative의 자기 저주적 의지를 한국어에서 자연스럽게 살려, 단순 미래보다 ‘내가 씨를 뿌리고’로 옮겼습니다.
- source_word: וְאַחֵר יֹאכֵל
  english_pob_choice: and another eat
  chosen_korean: 다른 이가 먹게 하며
  alternatives_korean:
  - 다른 사람이 먹게 하며
  - 남이 먹게 하며
  lexicon: HALOT
  rationale: אַחֵר의 대조를 살리면서, 농사 결과를 타인이 누린다는 뜻을 ‘먹게 하며’로 구체적으로 유지했습니다.
- source_word: וְצֶאֱצָאַי
  english_pob_choice: my offspring
  chosen_korean: 내 자손은
  alternatives_korean:
  - 내 후손은
  - 내 자식들은
  - 내 소산은
  lexicon: HALOT
  rationale: צֶאֱצָא의 기본적인 인간/가계 의미를 따라 ‘자손’으로 옮겼고, POB가 제시한 ‘produce’ 가능성은 본문상 덜 자연스러워 본문에는 두지 않았습니다.
- source_word: יְשֹׁרָשׁוּ
  english_pob_choice: be uprooted
  chosen_korean: 뿌리째 뽑히기를
  alternatives_korean:
  - 뿌리째 뽑히게 하기를
  - 뿌리에서 뽑히기를
  - 뿌리째 뽑히기를 바라노라
  lexicon: HALOT
  rationale: שורש의 뿌리 이미지를 한국어 관용으로 강하게 살리되, 저주/서원 맥락의 수동적 결과를 ‘뽑히기를’로 표현했습니다.
theological_decisions:
- issue: 욥의 자기 저주 서원 어조
  chosen_reading: 직설적 예언문보다, 자신에게 닥치길 바라는 저주의 문장으로 처리했습니다.
  alternative_readings:
  - 평서형 미래 진술로 완화하는 번역
  - ‘~하기를’ 구조를 더 약화한 번역
  rationale: 문맥상 욥이 무죄를 주장하며 스스로를 저주하는 맥락이므로, 한국어에서도 동사의 의지·저주 성격이 드러나야 합니다.
  doctrine_reference: 욥기 31장의 무죄 선서 및 자기 저주 맥락
- issue: ‘내 자손’의 범위
  chosen_reading: 인간 후손을 기본값으로 두고 번역했습니다.
  alternative_readings:
  - 농산물/소산으로 번역
  - 후손과 소산을 모두 열어두는 각주 처리
  rationale: 히브리어 צֶאֱצָא의 의미 범위는 넓지만, 뒤의 ‘뿌리째 뽑히다’와 평행 구조상 가계/후손 의미가 우선입니다.
  doctrine_reference: 히브리어 어휘의 다의성과 문맥 우선 원칙
