  naturalness: ‘내 자손은 뿌리째 뽑히기를’은 문장 종결과 연결이 불완전합니다. 두 결과를 같은 청원 아래에 두어 자연스러운 현대 한국어 합쇼체로 정리할 필요가 있습니다.
  terminology: ‘씨를 뿌리다’, ‘다른 이’, ‘자손’, ‘뿌리째 뽑히다’는 적절합니다. צֶאֱצָא의 소산/후손 양의성은 각주에서 유지해야 합니다.
