- from: 그러면 내가 씨를 뿌리고 다른 이가 먹게 하며, 내 자손은 뿌리째 뽑히기를.[a]
  to: 그렇다면 내가 씨를 뿌리고 다른 이가 먹게 하시며, 내 자손이 뿌리째 뽑히게 하시기를 바랍니다.[a]
  rationale: 자기 저주 맥락에서 두 결과 모두를 포괄하는 청원형 ‘~하게 하시기를 바랍니다’로 고쳐, 원문의 cohortative 및 저주적 결과를 자연스럽게 나타냈습니다. ‘먹게 하시며’는 욥이 타인에게 먹이를 준다는 사역 의미가 아니라, 하나님께 그러한 결과가 일어나게 해 달라고 청원하는 문맥으로 기능합니다. 각주는 본문과 중복되는 선택지를 제거하고 어휘적 양의성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:43:42Z'
