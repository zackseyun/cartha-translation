  source_fidelity: 히브리어의 조건절 אִם, ‘거짓과 함께 걷다’라는 행실의 은유, 그리고 ‘내 발’이 속임수 쪽으로 서두르는 시적 의인화와 방향성을 충실히 반영합니다. 다만 현 번역의 ‘걸었거나’는 둘 중 하나를 뜻하는 선택적 연결로 읽힐 수 있어, 병렬된 두 행위를 함께 조건으로 제시하는 원문과 맞지 않습니다.
  naturalness: ‘걸었으며 … 서둘렀다면’으로 연결하면 현대 한국어에서 조건절의 논리 관계가 자연스럽고, 원문의 미완결된 맹세 공식도 끝 대시로 보존됩니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 독자에게 더 명확합니다.
