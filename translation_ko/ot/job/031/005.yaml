source:
  edition: WLC
  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
  footnotes:
  - marker: a
    text: Or 'and my foot has hastened after deceit.' The Hebrew preposition can be understood as directional ('to/toward/after').
    reason: lexical_alternative
  - marker: b
    text: '''Walked'' is a Hebrew idiom for one''s conduct or way of life.'
    reason: cultural_note
translation:
  language: ko
  text: 만일 내가 거짓과 함께 걸었으며[b], 내 발이 속임수를 향해[a] 서둘렀다면—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향해’는 히브리어 전치사 עַל의 방향성(‘~로, ~을 향하여, ~을 따라’)을 반영한 것으로, 문맥상 ‘속임수를 향해’ 또는 ‘속임수를 따라’로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘걸었다’는 히브리어 관용구로서 삶의 방식이나 행실을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일
  lexicon: HALOT
  rationale: 욥의 자기 저주적 맹세 구조를 살리기 위해 조건을 여는 표현으로 옮겼습니다.
- source_word: הָלַכְתִּי
  english_pob_choice: I have walked
  chosen_korean: 내가 … 걸었거나
  alternatives_korean:
  - 내가 … 걸었습니다
  - 내가 … 살아왔거나
  lexicon: HALOT
  rationale: הלך의 관용적 의미인 삶의 행실을 반영하되, POB의 ‘walked’ 이미지를 살려 행동의 방식으로 옮겼습니다.
- source_word: מִרְמָה / עַל
  english_pob_choice: has hurried to deceit
  chosen_korean: 속임수를 향해 서둘렀다면
  alternatives_korean:
  - 속임수로 서둘렀다면
  - 속임수를 따라 서둘렀다면
  lexicon: HALOT
  rationale: עַל은 동사와 함께 방향성을 띠므로 ‘향해’로 풀어 주었고, מִרְמָה는 여기서 윤리적 기만을 가리키는 ‘속임수’가 자연스럽습니다.
- source_word: וַתַּחַשׁ
  english_pob_choice: has hastened
  chosen_korean: 서둘렀다면
  alternatives_korean:
  - 급히 갔다면
  - 재빨리 갔다면
  lexicon: HALOT
  rationale: 짧고 시적인 동작성을 유지하면서도 현대 한국어에서 자연스럽게 읽히는 동사로 옮겼습니다.
theological_decisions:
- issue: 직유적 ‘걸음’과 도덕적 행실의 관계
  chosen_reading: ‘걸었다’는 단순한 이동이 아니라 삶의 행실을 가리키는 시적 관용으로 유지했습니다.
  alternative_readings:
  - ‘살아왔다’로 의미만 풀기
  - ‘행실을 보였다’로 해석 번역하기
  rationale: 원문의 은유를 지우지 않고, 욥의 무죄 변론이라는 문맥의 윤리적 무게를 그대로 전달하기 위해서입니다.
  doctrine_reference: 욥기 31장의 자가-맹세적 무죄 변론
- issue: 조건절의 미완성감과 종결부 대시
  chosen_reading: 문장 끝의 대시는 원문의 맹세적 여운과 조건절의 여지를 살리기 위해 유지했습니다.
  alternative_readings:
  - 마침표로 완결
  - 쉼표로 약화
  rationale: 히브리어 시문의 긴장감을 보존하고, 뒤따르는 절들과의 연속성을 암시하기 위해서입니다.
  doctrine_reference: 히브리 시의 병행법과 맹세 공식
