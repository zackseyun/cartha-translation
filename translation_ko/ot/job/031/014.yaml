id: JOB.31.14
reference: Job 31:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
  footnotes:
  - marker: a
    text: Or 'when he visits' / 'when he examines.' The Hebrew verb can mean to visit, inspect, or call to account; the context here favors judicial accountability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 하나님이 일어나시면 내가 무엇을 하겠습니까? 그리고 그분이 나를 불러 따지시면 내가 무엇이라고 대답하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾으실 때’ / ‘살피실 때’. 히브리어 פקד는 방문하다, 살피다, 조사하다, 불러 따지다의 뜻을 가질 수 있는데, 여기서는 문맥상 책임 추궁의 의미가 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  english_pob_choice: And what
  chosen_korean: 그런데 … 무엇을 하겠습니까?
  alternatives_korean:
  - 그리고 … 무엇을 하겠습니까?
  - 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: 문맥상 욥의 수사적 자기질문이므로, 앞말을 잇는 접속 감각을 살리되 한국어에서는 자연스러운 전환 표현인 ‘그런데’로 급작스러운 반문성을 살렸습니다.
- source_word: אֶעֱשֶׂה
  english_pob_choice: would I do
  chosen_korean: 무엇을 하겠습니까
  alternatives_korean:
  - 무엇을 하오리까
  - 무엇을 하리이까
  lexicon: HALOT
  rationale: 히브리어 미완료형의 가상적·수사적 뉘앙스를 한국어에서 ‘-겠습니까’로 옮겨, 실제 행동 가능성을 묻기보다 궁지에 선 반문임을 드러냈습니다.
- source_word: יָקוּם אֵל
  english_pob_choice: when God rises up
  chosen_korean: 하나님이 일어나시면
  alternatives_korean:
  - 하나님이 일어나실 때
  - 하나님이 일어나서 행하시면
  lexicon: HALOT
  rationale: ‘일어나다’는 קום의 기본 이미지를 살리고, 심판적 행위까지 과도하게 특정하지 않기 위해 직설적이지만 넓은 표현을 택했습니다.
- source_word: יִפְקֹד
  english_pob_choice: calls me to account
  chosen_korean: 불러 따지시면
  alternatives_korean:
  - 찾으시면
  - 감찰하시면
  - 불러 살피시면
  lexicon: HALOT
  rationale: פקד의 의미 범위 가운데 이 문맥에서 드러나는 법정적 책임 추궁을 반영하기 위해 ‘불러 따지다’를 선택했습니다. ‘방문하다’로만 옮기면 문맥의 책임 추궁성이 약해집니다.
- source_word: מָה אֲשִׁיבֶנּוּ
  english_pob_choice: what would I answer him
  chosen_korean: 내가 무엇이라고 대답하겠습니까
  alternatives_korean:
  - 내가 무엇으로 대답하겠습니까
  - 내가 무엇이라 답하겠습니까
  lexicon: HALOT
  rationale: שוב의 응답 의미를 자연스러운 한국어 ‘대답하다’로 옮기고, 목적격 대명사 ‘그분께’를 뒤의 문맥에 의해 생략하지 않도록 ‘그분이…’와 짝지어 인칭 관계를 분명히 했습니다.
theological_decisions:
- issue: פקד의 번역에서 나타나는 신적 심문/책임 추궁의 뉘앙스
  chosen_reading: ‘불러 따지시면’으로 옮겨, 하나님이 욥을 불러 책임을 묻는 장면으로 읽히게 했습니다.
  alternative_readings:
  - ‘찾으시면’처럼 더 중립적으로 옮기기
  - ‘감찰하시면’처럼 조사·점검에 가까운 표현으로 옮기기
  rationale: 본문의 병행구 ‘내가 무엇이라고 대답하겠습니까?’가 법정적 응답 장면을 강하게 가리키므로, 심판을 과도하게 단정하지 않되 책임 추궁의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 신적 심문과 인간의 책임이라는 본문 긴장을 유지합니다.
