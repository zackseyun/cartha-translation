  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
  footnotes:
  - marker: a
    text: Or 'For the disaster of God was dread to me.' The Hebrew can be rendered more formally with 'of God,' though the sense is likely calamity coming from God.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of his exaltation I could not withstand it/him.' The noun may emphasize exaltation or majesty, and the verb may be rendered 'be able' or 'withstand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하나님에게서 온 재앙이 나에게는 두려움이었고, 그의 위엄 때문에 나는 견딜 수 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 재앙이 나에게는 두려움이었다.’ 히브리어는 ‘~의’로도 옮길 수 있지만, 문맥상 하나님에게서 오는 재앙이라는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 높임 때문에 나는 그것/그를 견딜 수 없었습니다.’ שְׂאֵת는 높임, 높으심, 위엄을 뜻할 수 있고, 동사는 ‘감당하다/견디다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  english_pob_choice: a terror
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 두려운 일
  lexicon: HALOT
  rationale: 명사로서의 פחד는 ‘두려움/공포’의 감정을 가리키므로, 문장 전체의 자연스러운 흐름을 살려 ‘두려움’으로 옮겼습니다.
- source_word: אֵיד אֵל
  english_pob_choice: calamity from God
  chosen_korean: 하나님에게서 온 재앙
  alternatives_korean:
  - 하나님의 재앙
  - 하나님으로부터 온 재난
  lexicon: HALOT
  rationale: פּחד의 대상이 되는 것은 ‘하나님에게서 오는 재앙’이라는 뜻이 가장 자연스럽고, 소유격으로만 처리하기보다 출처를 드러내는 번역이 원문의 긴장을 잘 살립니다.
- source_word: שְׂאֵתוֹ
  english_pob_choice: his majesty
  chosen_korean: 그의 위엄
  alternatives_korean:
  - 그의 높임
  - 그의 높으심
  - 그의 존귀
  lexicon: HALOT
  rationale: שְׂאֵת는 높임/높으심/위엄의 뜻을 가질 수 있는데, 여기서는 하나님의 장엄함을 가리키므로 현대 한국어에서 가장 직접적인 ‘위엄’을 택했습니다.
- source_word: לֹא אוּכָל
  english_pob_choice: I could not endure
  chosen_korean: 견딜 수 없었습니다
  alternatives_korean:
  - 버틸 수 없었습니다
  - 감당할 수 없었습니다
  - 견디어 낼 수 없었습니다
  lexicon: HALOT
  rationale: יכל의 능력 불가능을 한국어 관용에 맞게 옮겨, 단순한 ‘할 수 없음’보다 압박 앞에서 무너지는 뉘앙스가 드러나도록 했습니다.
theological_decisions:
- issue: אֵל의 번역을 고유명사처럼 보존할지 여부
  chosen_reading: ‘하나님’으로 풀어 번역했습니다.
  alternative_readings:
  - 엘
  - Mighty One(전사적 의미)
  rationale: 문맥이 심판과 위엄을 말하므로 독자가 즉시 이해할 수 있는 ‘하나님’이 가장 분명하며, 본문이 요구하지 않는 히브리어 형태의 보존은 피했습니다.
  doctrine_reference: 번역 가독성과 원문 의미의 명료성
- issue: 하나님의 위엄 앞에서의 인간 반응
  chosen_reading: 두려움과 견딜 수 없음이 함께 있는 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 처벌 공포로 축소
  - 추상적 경외감으로 완화
  rationale: 본문은 재앙에 대한 공포와 하나님의 위엄 앞에서의 무력함을 함께 말하므로, 둘 중 하나로 환원하지 않고 함께 살렸습니다.
  doctrine_reference: 원문이 가진 긴장 보존
