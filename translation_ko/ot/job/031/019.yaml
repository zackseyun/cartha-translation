  text: אִם אֶרְאֶ֣ה א֭וֹבֵד מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת לָ/אֶבְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/019.yaml
  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
  footnotes:
  - marker: a
    text: Or 'without clothing' for 'for lack of clothing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the poor' instead of 'the needy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 만일 누군가가 옷이 없어 죽어 가는 것을 보았거나, 가난한 사람이 덮을 것이 없는 것을 보았다면—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옷이 없이’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가난한 사람’보다 ‘궁핍한 사람’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: if
  chosen_korean: 내가 만일
  alternatives_korean:
  - 만일
  - 내가 ...라면
  lexicon: HALOT
  rationale: 욥의 맹세문 안에 있는 조건절이므로, 한국어에서도 가정 조건을 분명히 드러내는 ‘만일’을 살렸습니다.
- source_word: אֶרְאֶה אֹבֵד
  english_pob_choice: I have seen anyone perishing
  chosen_korean: 누군가가 ... 죽어 가는 것을 보았
  alternatives_korean:
  - 누군가가 망해 가는 것을 보았
  - 어떤 사람이 죽어 가는 것을 보았
  lexicon: HALOT
  rationale: אֹבֵד는 단순한 ‘가난한’이 아니라 멸망/파멸 상태에 있는 자를 가리키므로, 문맥에 맞게 ‘죽어 가는’으로 옮겨 지속적 파멸 상태를 드러냈습니다.
- source_word: מִבְּלִי לְבוּשׁ
  english_pob_choice: for lack of clothing
  chosen_korean: 옷이 없어
  alternatives_korean:
  - 의복이 부족하여
  - 입을 것이 없어
  lexicon: HALOT
  rationale: 직역적 ‘의복 부족’보다 한국어에서 자연스러운 결핍 표현인 ‘옷이 없어’를 택해 원문의 결핍 원인을 보존했습니다.
- source_word: כְּסוּת לָאֶבְיוֹן
  english_pob_choice: the needy without covering
  chosen_korean: 가난한 사람이 덮을 것이 없는
  alternatives_korean:
  - 궁핍한 사람이 덮을 것이 없는
  - 가난한 자가 덮을 것이 없는
  lexicon: HALOT
  rationale: כְּסוּת는 ‘덮는 것/덮개’의 의미를 살려 ‘덮을 것’으로 옮겼고, אֶבְיוֹן은 POB의 ‘the needy’를 반영하되 한국어로는 ‘가난한 사람’이 의미상 자연스럽다고 보았습니다.
theological_decisions:
- issue: 히브리어 병렬 접속사의 처리
  chosen_reading: 두 조건 항목을 한국어에서도 ‘... 보았거나, ... 보았다면’으로 병렬화했습니다.
  alternative_readings:
  - 그리고
  - 또는
  rationale: 본문은 빈곤한 두 상황을 병렬로 제시하는 조건문이므로, 한국어에서는 ‘거나’ 구조로 둘 사이의 대립 없이 나열감을 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥/수사 구조 보존
