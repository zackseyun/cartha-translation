translation:
  language: ko
  text: 내가 헐벗어[a] 망해 가는 사람을 보았거나, 입을 옷이 없는 궁핍한[b] 사람을 보았다면—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옷이 없어’로 번역할 수 있습니다.
