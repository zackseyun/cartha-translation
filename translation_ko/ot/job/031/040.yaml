base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
  footnotes:
  - marker: a
    text: Or 'foul weeds' or 'noxious weeds'; the exact plant named by the Hebrew is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 밀 대신 가시덤불이 나고, 보리 대신 악취 나는 잡초가 나기를. 욥의 말은 끝났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 בָאְשָׁה는 정확한 식물명이 분명하지 않아 ‘악취 나는 잡초’로 옮겼습니다. 다른 가능성으로는 ‘불쾌한 잡초’ 또는 ‘해로운 잡초’가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: instead of
  chosen_korean: 대신
  alternatives_korean:
  - 자리에
  - 그 아래에
  lexicon: HALOT
  rationale: 이 문맥에서는 위치가 아니라 대체를 나타내므로, 한국어로는 자연스럽고 의미를 정확히 드러내는 ‘대신’이 가장 적절합니다.
- source_word: חִטָּה
