  - 불쾌한 잡초
  lexicon: HALOT
  rationale: 정확한 식물 동정이 불확실하다는 점을 반영해, 냄새와 무가치함을 드러내는 ‘악취 나는 잡초’로 옮겼습니다.
theological_decisions:
- issue: 욥기의 결말 공지 표현
