- source_word: חוֹחַ
  english_pob_choice: thorns
  chosen_korean: 가시덤불
  alternatives_korean:
  - 가시
  - 가시나무
  - 엉겅퀴
  lexicon: HALOT
  rationale: 위협적이고 쓸모없는 자라남을 가리키는 일반적 가시 식물로 이해되므로, 단순한 ‘가시’보다 구체적인 ‘가시덤불’이 문맥을 더 잘 살립니다.
- source_word: בָאְשָׁה
  english_pob_choice: stinkweed
  chosen_korean: 악취 나는 잡초
