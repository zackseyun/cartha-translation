  rationale: 히브리어 תַּמּוּ דִּבְרֵי אִיּוֹב는 본문의 종결 공지이므로, 내용 요약보다 서술적 종료 감각을 살리는 표현이 적절합니다.
  doctrine_reference: 문학적 종결 표지의 보존
