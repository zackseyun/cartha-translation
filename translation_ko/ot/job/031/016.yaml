    text: ‘바라는 것’은 히브리어 חֵפֶץ의 기본 의미를 따른 번역입니다. 문맥상 ‘그들이 필요로 하던 것’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘과부의 눈을 쇠하게 하다’는 오래 기다리며 기대가 좌절되거나 희망이 소진되는 것을 뜻합니다.
