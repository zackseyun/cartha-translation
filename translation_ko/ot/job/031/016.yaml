source:
  edition: WLC
  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
  footnotes:
  - marker: a
    text: Or 'withheld from the poor what they desired' or, contextually, 'withheld from the poor what they needed.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''caused the eyes of the widow to fail,'' expressing prolonged disappointment, longing, or hope deferred.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 만일 가난한 사람들에게서 그들의 바람을 빼앗았거나, 과부의 눈을 지치게 하였다면[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 바람’은 히브리어 חֵפֶץ의 기본 의미를 따른 번역입니다. 문맥상 ‘그들이 필요로 하던 것’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘과부의 눈을 지치게 하다’는 오래 기다림, 기대의 좌절, 희망의 소진을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 내가 만일
  alternatives_korean:
  - 만일
  - 내가 만약
  lexicon: HALOT
  rationale: 자기 맹세형 조건문이므로 서술을 매끄럽게 이끄는 ‘내가 만일’이 적절합니다.
- source_word: מֵחֵפֶץ דַּלִּים
  english_pob_choice: from their desire
  chosen_korean: 가난한 사람들에게서 그들의 바람
  alternatives_korean:
  - 가난한 사람들의 욕구에서
  - 가난한 사람들에게서 그들이 원하는 것
  - 가난한 사람들에게서 그들의 필요
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘바람/원하는 것’의 뜻을 살리되, 문맥상 필요한 것을 빼앗는 뉘앙스도 남기기 위해 직역보다 자연스러운 ‘바람’으로 옮겼습니다.
- source_word: אֲכַלֶּה־
  english_pob_choice: caused the eyes of the widow to fail
  chosen_korean: 과부의 눈을 지치게 하였다
  alternatives_korean:
  - 과부의 눈을 쇠하게 하였다
  - 과부의 눈을 마르게 하였다
  - 과부의 눈을 흐리게 하였다
  lexicon: HALOT
  rationale: ‘눈을 실패하게 하다’는 히브리어 관용구를 한국어 관용으로 풀어, 오래 기다림과 희망의 소진을 드러내는 ‘지치게 하다’로 옮겼습니다.
- source_word: אַלְמָנָה
  english_pob_choice: the widow
  chosen_korean: 과부
  alternatives_korean:
  - 한 과부
  - 그 과부
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사이지만 한국어에서는 자연스럽게 일반 명사 ‘과부’로 처리하는 것이 문맥에 맞습니다.
theological_decisions:
- issue: 자기 정당화 맹세의 조건문 형식
  chosen_reading: 문장의 조건문을 그대로 살려, 욥이 스스로의 무죄를 검증하는 맹세 구조로 읽었습니다.
  alternative_readings:
  - 평서문처럼 단순 과거 진술로 옮김
  - 완곡한 반성문체로 조정
  rationale: 본문은 실제 행위의 자백이 아니라 ‘만일 내가 ... 했다면’이라는 자기 저주의 조건문이므로, 그 구조를 분명히 드러내야 합니다.
  doctrine_reference: 욥기 31장의 자기 변론과 맹세 구조
