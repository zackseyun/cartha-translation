theological_decisions:
- issue: 의인화된 땅과 밭고랑의 증언성
  chosen_reading: 땅이 ‘나를 거슬러 부르짖고’ 밭고랑들이 ‘함께 울부짖는’ 장면으로, 피조물이 죄의 증인처럼 소리 내는 법정적-시적 의도를 살렸습니다.
  alternative_readings:
  - 땅이 나를 고발하고
  - 땅이 나를 향해 소리치고
  rationale: 본문은 단순한 감정 묘사가 아니라 무죄 주장에 대한 피조 세계의 증언이라는 긴장을 담고 있으므로, 이를 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 창세기 4:10; 욥기 31장 문맥의 맹세적 무죄 변론
