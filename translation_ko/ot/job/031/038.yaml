  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 בכה는 기본적으로 ‘울다’를 뜻하지만, 여기서는 밭고랑에 대한 의인화된 표현이어서 시적으로 ‘울부짖다’로 옮길 수 있습니다.
