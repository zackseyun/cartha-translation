lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그것은
  alternatives_korean:
  - 왜냐하면
  - 이는
  - 참으로
  lexicon: HALOT
  rationale: 앞절의 맹세 진술을 이어 주는 설명 관계를 살리되, 한국어에서는 문두의 연결을 자연스럽게 하기 위해 직접적 원인 접속사보다 대상을 가리키는 표현으로 옮겼습니다.
- source_word: זִמָּה
  english_pob_choice: a disgraceful act
  chosen_korean: 수치스러운 행위
  alternatives_korean:
  - 음란한 행위
  - 음행
  - 불명예스러운 일
  lexicon: HALOT
  rationale: 이 단어의 도덕적 수치와 성적 비도덕성의 뉘앙스를 함께 살리되, 현대 한국어에서 너무 협소하거나 낡지 않은 표현을 택했습니다.
- source_word: עָוֺן
  english_pob_choice: an iniquity
  chosen_korean: 악
  alternatives_korean:
  - 불의
  - 죄악
  - 죄
  lexicon: HALOT
  rationale: 법정 맥락에서의 유죄성보다 도덕적 악함이 강조되므로, 포괄적이면서도 무게감 있는 ‘악’으로 옮겼습니다.
- source_word: פְּלִילִים
  english_pob_choice: for the judges
  chosen_korean: 재판관들에게 해당하는
  alternatives_korean:
  - 재판관들의
  - 재판관들이 다룰
  - 법정의
  lexicon: HALOT
  rationale: 히브리어의 사법적 의미를 살리되, 한국어에서 ‘for the judges’를 직역한 어색함을 줄이기 위해 ‘해당하는’으로 판결 대상/관할의 뜻을 드러냈습니다.
theological_decisions:
- issue: פְּלִילִים의 사법적 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘재판관들에게 해당하는’으로 옮겨, 이 행위가 단순한 사적 도덕 문제가 아니라 공적 재판의 대상임을 드러냈습니다.
  alternative_readings:
  - ‘재판관들에게 속한’
  - ‘재판관들이 다룰’
  - ‘법정에서 다룰’
  rationale: 문맥상 지혜문학적 윤리 진술이 법적 책임까지 포함하므로, 사법적 성격을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 공적 책임과 도덕적 유죄성의 동시 진술
- issue: זִמָּה와 עָוֺן의 병렬을 어떻게 유지할지
  chosen_reading: ‘수치스러운 행위이며, ... 악입니다’로 두 명사를 병렬하여 도덕적 혐오와 법적/윤리적 악함을 함께 살렸습니다.
  alternative_readings:
  - ‘수치스러운 짓이며, ... 죄입니다’
  - ‘음란한 일이며, ... 불의입니다’
  rationale: 히브리어의 강한 병렬 구조를 유지해야 두 번째 절이 첫 번째 절을 단순 반복하지 않고 판단을 누적한다는 점이 드러납니다.
  doctrine_reference: 히브리 시의 병렬법과 윤리적 강조
