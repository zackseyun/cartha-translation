  to: 또 위에 계신 하나님께서 주시는 몫은 무엇이며, 높은 곳에 계신 전능자께서 주시는 유업은 무엇입니까?[a]
  rationale: 원문의 두 병행구를 ‘위에 계신 하나님’과 ‘높은 곳에 계신 전능자’로 자연스럽게 재구성하여, 초안의 잘못된 수식 관계를 바로잡았습니다. ‘주시는’은 ‘하나님/전능자로부터의 몫·유업’이라는 문맥상 출처 의미를 한국어 문장 안에서 명료하게 표현합니다. 각주는 전치사구의 범위에 관한 남아 있는 문법적 여지를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:43:27Z'
