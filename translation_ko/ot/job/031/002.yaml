  - 분깃
  lexicon: HALOT
  rationale: 말 그대로의 분배·할당의 뜻을 살리면서도 현대 한국어에서 자연스럽고 간결하게 들리는 ‘몫’으로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님 위의
  - 신
  lexicon: HALOT
  rationale: 시적 문맥의 신칭을 한국어 기독교 독자에게 가장 직접적으로 전달하는 표준어로 ‘하나님’을 택했습니다.
- source_word: מִמְּרֹמִים
  english_pob_choice: from on high
  chosen_korean: 높은 곳에서의
  alternatives_korean:
  - 높은 곳으로부터의
  - 하늘의
  lexicon: HALOT
  rationale: 반복된 מן-전치사의 출처 감각을 살리면서, 시적 병행구에서 ‘~에서의’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 시적 신칭의 한국어 처리
  chosen_reading: אֱלוֹהַּ와 שַׁדַּי를 각각 ‘하나님’과 ‘전능자’로 번역했습니다.
  alternative_readings:
  - 엘로아흐 … 샷다이
  - 하나님 … 전능하신 이
  rationale: 시적 병행에서 두 호칭의 의미를 현대 독자가 즉시 이해하도록 풀어 옮기되, 전통 교회어를 과도하게 고정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §2 (Translate titles; transliterate names)'
