lexical_decisions:
- source_word: וּמֶה
  english_pob_choice: And what is
  chosen_korean: 또 … 무엇입니까?
  alternatives_korean:
  - 그리고 … 무엇입니까?
  - 무엇입니까?
  lexicon: HALOT
  rationale: 접속사 וּ-의 이어짐을 살리면서도, 히브리어 수사 의문문으로서의 흐름을 자연스러운 한국어 질문으로 옮겼습니다.
