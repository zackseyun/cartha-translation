  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
  footnotes:
  - marker: a
    text: Or 'from above ... from the heights.' The Hebrew phrases may be taken more adverbially, emphasizing the heavenly source of God's allotted portion and the Almighty's inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 위에 계신 하나님께서 주시는 몫은 무엇이며, 높은 곳에 계신 전능자께서 주시는 유업은 무엇입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘위에 계신 … 높은 곳에 계신’은 각각 ‘위로부터 … 높은 곳으로부터’로도 옮길 수 있습니다. 히브리어는 이 표현들이 하나님의 천상적 위치를 가리키는지, 몫과 유업의 출처를 강조하는지를 다소 열어 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  english_pob_choice: And what is
  chosen_korean: 또 … 무엇입니까?
  alternatives_korean:
  - 그리고 … 무엇입니까?
  - 무엇입니까?
  lexicon: HALOT
  rationale: 접속사 וּ-의 이어짐을 살리면서도, 히브리어 수사 의문문으로서의 흐름을 자연스러운 한국어 질문으로 옮겼습니다.
- source_word: חֵלֶק
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 분깃
  lexicon: HALOT
  rationale: 말 그대로의 분배·할당의 뜻을 살리면서도 현대 한국어에서 자연스럽고 간결하게 들리는 ‘몫’으로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님 위의
  - 신
  lexicon: HALOT
  rationale: 시적 문맥의 신칭을 한국어 기독교 독자에게 가장 직접적으로 전달하는 표준어로 ‘하나님’을 택했습니다.
- source_word: מִמְּרֹמִים
  english_pob_choice: from on high
  chosen_korean: 높은 곳에서의
  alternatives_korean:
  - 높은 곳으로부터의
  - 하늘의
  lexicon: HALOT
  rationale: 반복된 מן-전치사의 출처 감각을 살리면서, 시적 병행구에서 ‘~에서의’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 시적 신칭의 한국어 처리
  chosen_reading: אֱלוֹהַּ와 שַׁדַּי를 각각 ‘하나님’과 ‘전능자’로 번역했습니다.
  alternative_readings:
  - 엘로아흐 … 샷다이
  - 하나님 … 전능하신 이
  rationale: 시적 병행에서 두 호칭의 의미를 현대 독자가 즉시 이해하도록 풀어 옮기되, 전통 교회어를 과도하게 고정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §2 (Translate titles; transliterate names)'
