translation:
  language: ko
  text: 그러면 내 아내가 다른 남자를 위해 곡식을 갈게 하시고, 다른 남자들이 그녀 위에 무릎을 꿇게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
