  lexicon: HALOT
  rationale: אַחֵר는 ‘다른/남의’라는 뜻이지만, 이 절은 아내와 남성들 사이의 관계를 말하므로 한국어에서는 ‘다른 남자’를 밝혀 자연스럽고 문맥에 맞게 옮겼습니다.
- source_word: יִכְרְעוּן
  english_pob_choice: kneel
