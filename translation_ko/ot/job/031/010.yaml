  - 절하게 하십시오
  - 그녀와 잠자게 하십시오
  lexicon: HALOT
  rationale: כרע의 기본 뜻인 ‘무릎을 꿇다/굽히다’를 살렸습니다. 다만 이 맥락에서는 성적 완곡어법으로 이해될 수 있으므로, 본문은 직역에 가깝게 두고 그 함의를 각주로 처리했습니다.
