  text: then let my wife grind for another man[a], and let other men kneel over her.
  footnotes:
  - marker: a
    text: Or possibly, 'let other men lie with her'; 'kneel over her' is likely a sexual euphemism in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내 아내가 다른 남자를 위해 갈고, 다른 남자들이 그녀 위에 무릎을 꿇게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무릎을 꿇다’는 이 문맥에서 성적 완곡어법일 가능성이 큽니다. 그래서 ‘그녀와 잠자다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  english_pob_choice: grind
  chosen_korean: 갈고
  alternatives_korean:
  - 분쇄하고
  - 곡식을 찧고
  - 노역하게 하고
  lexicon: HALOT
  rationale: טחן의 기본 의미인 ‘갈다’를 살려 본문의 구체적 이미지를 유지했습니다. 문맥상 굴욕과 성적 수치가 함축될 수 있지만, 본문에서는 직접 풀어 쓰지 않았습니다.
- source_word: לְאַחֵר
  english_pob_choice: for another man
  chosen_korean: 다른 남자를 위해
  alternatives_korean:
  - 다른 이를 위해
  - 다른 사람을 위해
  lexicon: HALOT
  rationale: אַחֵר는 ‘다른/남의’라는 뜻이지만, 이 절은 아내와 남성들 사이의 관계를 말하므로 한국어에서는 ‘다른 남자’를 밝혀 자연스럽고 문맥에 맞게 옮겼습니다.
- source_word: יִכְרְעוּן
  english_pob_choice: kneel
  chosen_korean: 무릎을 꿇게 하십시오
  alternatives_korean:
  - 꿇어앉게 하십시오
  - 절하게 하십시오
  - 그녀와 잠자게 하십시오
  lexicon: HALOT
  rationale: כרע의 기본 뜻인 ‘무릎을 꿇다/굽히다’를 살렸습니다. 다만 이 맥락에서는 성적 완곡어법으로 이해될 수 있으므로, 본문은 직역에 가깝게 두고 그 함의를 각주로 처리했습니다.
- source_word: אֲחֵרִין
  english_pob_choice: other men
  chosen_korean: 다른 남자들
  alternatives_korean:
  - 다른 이들
  - 남자들
  lexicon: HALOT
  rationale: 복수형의 남성 지시를 드러내기 위해 ‘다른 남자들’로 옮겼습니다.
theological_decisions:
- issue: 성적 함의를 본문에 직접 풀어 쓸지 여부
  chosen_reading: 본문은 ‘갈다’와 ‘무릎을 꿇다’의 구체적 이미지를 유지하고, 성적 함의는 각주로 남겼습니다.
  alternative_readings:
  - 그녀가 다른 사람과 잠자게 하십시오
  - 다른 남자들이 그녀와 동침하게 하십시오
  rationale: 히브리어는 노골적 성행위 동사를 쓰지 않고 굴욕적 이미지로 말합니다. 따라서 본문은 원문의 형상을 보존하고, 가능한 완곡어법의 의미만 주석으로 알리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
