  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם כֹּ֭חָ/הּ אָכַ֣לְתִּי בְלִי כָ֑סֶף וְ/נֶ֖פֶשׁ בְּעָלֶ֣י/הָ הִפָּֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/039.yaml
  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
  footnotes:
  - marker: a
    text: Or, more literally, 'caused the life of its owners to expire' or 'made its owners gasp.' The Hebrew verb is rare and the clause may express either extreme oppression or causing death.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 밭의 소출을 값 없이 먹었거나, 그 소유자들의 생명을 꺼뜨렸다면—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘그 소유자들의 생명을 꺼뜨리게 했거나’ 혹은 ‘그 소유자들을 헐떡이게 했거나’입니다. 히브리어 동사는 희귀하며, 이 절은 극심한 압박이나 죽음에 이르게 함을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  english_pob_choice: its produce
  chosen_korean: 그 밭의 소출
  alternatives_korean:
  - 그 밭의 힘
  - 그 밭의 산출물
  lexicon: HALOT
  rationale: כֹּחַ는 기본적으로 ‘힘’이지만, 여기서는 앞뒤 문맥상 땅/밭이 내는 산물을 가리키므로 ‘소출’이 자연스럽고 의미도 잘 드러냅니다.
- source_word: בְלִי כָסֶף
  english_pob_choice: without payment
  chosen_korean: 값 없이
  alternatives_korean:
  - 돈 없이
  - 대가 없이
  lexicon: HALOT
  rationale: כֶּסֶף의 문자적 ‘은/돈’보다, 착취 없이 무상으로 취했다는 경제적 의미를 한국어로 간결하게 살려 ‘값 없이’로 옮겼습니다.
- source_word: בְּעָלֶיהָ
  english_pob_choice: its owners
  chosen_korean: 그 소유자들
  alternatives_korean:
  - 그 주인들
  - 그 소유주들
  lexicon: HALOT
  rationale: בַּעַל의 소유 관계를 직접 드러내는 표현으로 ‘소유자들’이 가장 중립적이고 본문에 맞습니다.
- source_word: הִפָּחְתִּי
  english_pob_choice: caused ... to lose heart
  chosen_korean: 생명을 꺼뜨렸다면
  alternatives_korean:
  - 기운을 꺼뜨렸다면
  - 숨을 끊었더라면
  - 낙심하게 했더라면
  lexicon: HALOT
  rationale: 히필형 נפח는 희귀하고 난해하여, 본문이 말할 수 있는 최대 강도를 살리면서도 한국어로는 ‘꺼뜨리다’가 ‘숨/생명’을 꺼뜨리는 뉘앙스를 전달합니다.
theological_decisions:
- issue: 난해한 동사 הִפָּחְתִּי의 강도
  chosen_reading: 주 텍스트는 ‘생명을 꺼뜨렸다면’으로 옮기고, 본문이 강압으로 인한 쇠약/실신을 뜻할 수도 있음을 각주에서 열어 둡니다.
  alternative_readings:
  - ‘기운을 꺼뜨렸다면’
  - ‘낙심하게 했더라면’
  - ‘숨을 끊었더라면’
  rationale: 히필 נפח는 주석 전통상 ‘숨을 끊다/소생을 잃게 하다’까지 갈 수 있으나, 주 텍스트에서 과도하게 단정하지 않고 문맥의 폭력을 드러내도록 했습니다.
  doctrine_reference: Job 31:39의 서약 진술은 의인/무고함의 맥락으로, 본문 강도를 지나치게 약화하지 않되 확정적 살해로만 제한하지 않는 것이 적절합니다.
