theological_decisions:
- issue: 하나님의 감찰을 묘사하는 동사 표현
  chosen_reading: ‘보시다’와 ‘헤아리시다’를 사용해, 본문의 구체적 이미지(보기/세기)를 유지했습니다.
  alternative_readings:
  - ‘살피시다’와 ‘계산하시다’로 풀어 더 해석적으로 옮기는 방식
  rationale: 본문은 추상적 교리 진술보다 하나님이 길과 걸음을 실제로 보고 세신다는 구체적 수사에 무게가 있습니다. 그 이미지를 보존하는 것이 source-direct에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
