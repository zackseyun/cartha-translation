base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
  footnotes:
  - marker: a
    text: Or 'and did not one form us in the womb?' The Hebrew phrase 'one womb' may also be understood more idiomatically as 'the same womb,' emphasizing shared human origin.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 태 속에서 지으신 분이 그도 짓지 않으셨습니까? 우리를 한 태 안에서 빚지 않으셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 태’이지만, 문맥상 ‘같은 태’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Did not
  chosen_korean: ~하지 않으셨습니까?
  alternatives_korean:
  - ~하지 않았습니까?
  - 과연 ~하지 않으셨습니까?
  lexicon: HALOT
  rationale: 반어적 질문이면서도 대답을 기대하는 구조이므로, 한국어에서는 공손한 의문형으로 살려 동일한 수사적 힘을 유지했습니다.
- source_word: בַּבֶּטֶן
  english_pob_choice: in the womb
  chosen_korean: 태 속에서
  alternatives_korean:
  - 배 속에서
  - 복중에서
  lexicon: HALOT
  rationale: 여기서는 단순한 신체 내부가 아니라 태아 형성의 자리를 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘태’ 표현을 택했습니다.
- source_word: עֹשֵׂנִי / עָשָׂהוּ
  english_pob_choice: he who made me / make him
  chosen_korean: 나를 ... 지으신 분 / 그도 짓지 않으셨습니까
  alternatives_korean:
  - 나를 ... 만드신 분 / 그도 만들지 않으셨습니까
  - 나를 ... 지으신 이 / 그도 지으신 것이 아니겠습니까
  lexicon: HALOT
  rationale: 첫 분사는 ‘나를 지으신 분’처럼 인칭적 주어를 살리고, 두 번째 동사는 같은 창조 행위를 되풀이하여 대구를 유지했습니다. ‘짓다’는 사람/생명의 창조를 말할 때 더 직접적입니다.
- source_word: וַיְכֻנֶנּוּ
  english_pob_choice: form us
  chosen_korean: 우리를 ... 빚지 않으셨습니까
  alternatives_korean:
  - 우리를 ... 세우지 않으셨습니까
  - 우리를 ... 형성하지 않으셨습니까
  lexicon: HALOT
  rationale: כון 계열의 여기서는 태중에서의 빚음, 형성의 뜻이 강하므로 ‘빚다’를 택해 시적 이미지와 형성의 의미를 함께 살렸습니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 한
  alternatives_korean:
  - 같은
  - 하나의
  lexicon: HALOT
  rationale: ‘한 태’로 옮겨 히브리어의 압축된 표현을 살렸고, 공동 기원을 강조하는 의미는 문맥이 드러내게 했습니다.
theological_decisions:
- issue: ‘한 태’의 의미 범위
  chosen_reading: 같은 어머니를 뜻한다고 단정하지 않고, 하나님 앞에서의 공통된 태중 형성과 인간의 동등한 기원을 강조하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘같은 태’
  - ‘하나의 태’
  rationale: 히브리어는 시적으로 공동 기원을 말하지만 생물학적 동일 모친을 주장하는 것은 아니므로, 원문의 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy; common human creation
