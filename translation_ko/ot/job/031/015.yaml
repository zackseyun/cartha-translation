translation:
  language: ko
  text: 나를 태중에서 지으신 분이 그도 짓지 않으셨습니까? 한 분이 태중에서 우리를 빚지 않으셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 말은 ‘한 분’을 뜻하며, 나와 그를 지으신 동일한 창조주를 가리키는 것으로 이해할 수 있습니다. 일부는 이를 ‘한 태’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Did not
  chosen_korean: ~하지 않으셨습니까?
  alternatives_korean:
  - ~하지 않았습니까?
  - 과연 ~하지 않으셨습니까?
  lexicon: HALOT
  rationale: 반어적 질문이면서도 대답을 기대하는 구조이므로, 한국어에서는 공손한 의문형으로 살려 동일한 수사적 힘을 유지했습니다.
- source_word: בַּבֶּטֶן
  english_pob_choice: in the womb
  chosen_korean: 태 속에서
  alternatives_korean:
