  naturalness: ‘그것을 내 몸에 관처럼 두르겠습니다’는 현대 표준어에서 다소 부자연스럽습니다. ‘그것을 관처럼 쓰겠습니다’가 간결하고 자연스러우며, 합쇼체 문장으로도 적절합니다.
