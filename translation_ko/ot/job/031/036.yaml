theological_decisions:
- issue: 본문의 마지막 비유가 단순 장식인지, 영예의 상징인지
  chosen_reading: 욥은 그 문서/고발을 부끄러워하지 않고 오히려 관처럼 몸에 두르겠다고 말합니다.
  alternative_readings:
  - 그것을 단순히 들고 다니겠다는 뜻
  - 장식품처럼 꾸미겠다는 뜻
  rationale: 문맥상 자의식적인 수치의 반전과 무죄 선언의 강도가 핵심이므로, ‘관처럼 두르겠습니다’로 명예의 역설을 살렸습니다.
  doctrine_reference: 문맥적 수사와 무죄 호소
- issue: 히브리어 복수 ‘עֲטָרוֹת’의 처리
  chosen_reading: 복수형의 형식은 존중하되 한국어 본문은 ‘관처럼’으로 읽기 쉽게 처리했습니다.
  alternative_readings:
  - ‘관들처럼’이라고 직역
  - 복수성을 본문에 과도하게 드러내지 않음
  rationale: POB의 영어 본문도 복수형의 문법적 형식을 주석으로 남기고 의미상 단수 비유를 택하므로, 한국어도 본문은 자연스럽게, 설명은 각주로 처리하는 편이 좋습니다.
  doctrine_reference: 원문 형식과 의미의 균형
