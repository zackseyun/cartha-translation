  text: אִם לֹ֣א עַל שִׁ֭כְמִ/י אֶשָּׂאֶ֑/נּוּ אֶֽעֶנְדֶ֖/נּוּ עֲטָר֣וֹת לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
  footnotes:
  - marker: a
    text: Hebrew 'crowns' (plural); the sense may be an intensive plural, hence 'like a crown.'
    reason: lexical_alternative
translation:
  language: ko
  text: 확실히 나는 그것을 내 어깨에 메고, 그것을 내 몸에 관처럼 두르겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 ‘관들’(עֲטָרוֹת)을 사용하지만, 뜻은 ‘관처럼’이라는 단수적 비유로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 확실히
  alternatives_korean:
  - 분명히
  - 진실로
  - 만일 아니라면
  lexicon: HALOT
  rationale: 이 구절에서는 조건이 아니라 강한 확언의 용법이므로, 한국어에서도 단정적이고 자연스러운 ‘확실히’로 옮겼습니다.
- source_word: עַל שִׁכְמִי
  english_pob_choice: on my shoulder
  chosen_korean: 내 어깨에
  alternatives_korean:
  - 내 어깨 위에
  - 내 어깨에 얹어
  lexicon: HALOT
  rationale: 히브리어의 단수 ‘어깨’ 이미지를 그대로 살려, 공개적으로 짊어지는 동작을 자연스럽게 표현했습니다.
- source_word: אֶשָּׂאֶנּוּ
  english_pob_choice: I would carry it
  chosen_korean: 메고
  alternatives_korean:
  - 지고
  - 들고
  lexicon: HALOT
  rationale: ‘bear/carry’의 뜻을 한국어 동작 동사로 풀어, 무언가를 어깨에 걸쳐 짊어지는 장면을 선명하게 드러냈습니다.
- source_word: עֲטָרוֹת
  english_pob_choice: like a crown
  chosen_korean: 관처럼
  alternatives_korean:
  - 왕관처럼
  - 면류관처럼
  - 관들처럼
  lexicon: HALOT
  rationale: 히브리어 복수형의 형식은 남기되, 한국어에서는 관용적으로 단수적 비유인 ‘관처럼’이 가장 자연스럽습니다.
theological_decisions:
- issue: 본문의 마지막 비유가 단순 장식인지, 영예의 상징인지
  chosen_reading: 욥은 그 문서/고발을 부끄러워하지 않고 오히려 관처럼 몸에 두르겠다고 말합니다.
  alternative_readings:
  - 그것을 단순히 들고 다니겠다는 뜻
  - 장식품처럼 꾸미겠다는 뜻
  rationale: 문맥상 자의식적인 수치의 반전과 무죄 선언의 강도가 핵심이므로, ‘관처럼 두르겠습니다’로 명예의 역설을 살렸습니다.
  doctrine_reference: 문맥적 수사와 무죄 호소
- issue: 히브리어 복수 ‘עֲטָרוֹת’의 처리
  chosen_reading: 복수형의 형식은 존중하되 한국어 본문은 ‘관처럼’으로 읽기 쉽게 처리했습니다.
  alternative_readings:
  - ‘관들처럼’이라고 직역
  - 복수성을 본문에 과도하게 드러내지 않음
  rationale: POB의 영어 본문도 복수형의 문법적 형식을 주석으로 남기고 의미상 단수 비유를 택하므로, 한국어도 본문은 자연스럽게, 설명은 각주로 처리하는 편이 좋습니다.
  doctrine_reference: 원문 형식과 의미의 균형
