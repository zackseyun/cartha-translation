source:
  edition: WLC
  text: אִ֥ם תִּטֶּ֣ה אַשֻּׁרִ/י֮ מִנִּ֪י הַ֫/דָּ֥רֶךְ וְ/אַחַ֣ר עֵ֭ינַ/י הָלַ֣ךְ לִבִּ֑/י וּ֝/בְ/כַפַּ֗/י דָּ֣בַק מֻאֽוּם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
  footnotes:
  - marker: a
    text: Or 'my heart has followed my eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'any spot' or 'any blemish.' The Hebrew term can denote a stain, defect, or blemish.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내 발걸음이 길에서 벗어나고, 내 마음이 내 눈을 따라가고, 내 손에 어떤 티끌이라도 달라붙어 있다면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음이 내 눈을 따랐다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어떤 흠’ 또는 ‘어떤 흠집’. 히브리어는 티끌, 결함, 흠집을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה / אַשֻּׁרִי
  english_pob_choice: has turned aside / my step
  chosen_korean: 내 발걸음이 길에서 벗어나고
  alternatives_korean:
  - 내 걸음이 길에서 치우치고
  - 내 발자국이 길에서 벗어나고
  lexicon: HALOT
  rationale: אַשּׁוּרִי는 ‘발걸음/걸음’의 의미이고, תִּטֶּה는 방향이 빗나가는 동작이어서 한국어에서는 ‘발걸음이 길에서 벗어나다’가 가장 자연스럽고 원문 비유를 살립니다.
- source_word: הַדָּרֶךְ
  english_pob_choice: the way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - דרך
  lexicon: HALOT
  rationale: 히브리어의 ‘길/דרך’는 도덕적 삶의 경로를 가리키므로, 한국어에서는 관용적으로 이해되는 ‘길’을 택하되 단순한 물리적 길로만 좁히지 않도록 했습니다.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  english_pob_choice: my heart has gone after my eyes
  chosen_korean: 내 마음이 내 눈을 따라가고
  alternatives_korean:
  - 내 마음이 내 눈을 좇고
  - 내 마음이 내 눈을 따라가며
  lexicon: HALOT
  rationale: ‘마음’과 ‘눈’의 관계를 그대로 살리면서, 한국어에서는 ‘따라가다’가 추구/욕망의 흐름을 가장 자연스럽게 드러냅니다. ‘좇다’보다 문체가 덜 거칠어 본문 흐름에 맞습니다.
- source_word: מֻאוּם
  english_pob_choice: any stain
  chosen_korean: 어떤 티끌이라도
  alternatives_korean:
  - 어떤 흠이라도
  - 어떤 얼룩이라도
  - 어떤 흠집이라도
  lexicon: HALOT
  rationale: 문맥상 손에 붙은 도덕적 오염을 가리키므로, ‘티끌’은 ‘spot/blemish/stain’의 뉘앙스를 아우르면서도 한국어에서 부정·오염의 감각을 전달합니다.
theological_decisions:
- issue: 징계적 자기서원 형식의 조건문 유지
  chosen_reading: ‘만일 … 있다면’으로 조건문을 그대로 살렸습니다.
  alternative_readings:
  - 내 발걸음이 벗어나지 않았습니다
  - 내가 결코 … 하지 않았습니다
  rationale: 본문은 욥이 스스로를 시험대에 올리는 서원/맹세 형식이므로, 단정형으로 바꾸지 않고 조건구조를 유지해야 자기정당화의 긴장감이 보존됩니다.
  doctrine_reference: Job 31 맹세 담화의 수사 구조
- issue: ‘마음’과 ‘눈’의 심리-윤리적 연결 보존
  chosen_reading: ‘마음이 내 눈을 따라가고’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 내 욕망이 본 것을 따르고
  - 내 속사람이 본 것을 좇고
  rationale: 본문의 핵심은 욕망이 시각적 자극을 따라 움직인다는 점이므로, 이를 심리학적으로 풀기보다 원문의 인과 구조를 보존하는 편이 해석을 덜 가합니다.
  doctrine_reference: 인간 내면과 죄의 유혹에 관한 성서적 인간론
