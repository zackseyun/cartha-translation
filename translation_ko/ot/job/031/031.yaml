base_translation:
  language: en
  yaml_path: translation/ot/job/031/031.yaml
  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
  footnotes:
  - marker: a
    text: Or 'the men of my household,' since 'tent' can stand for one's household or domestic circle.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from his flesh'; here the sense is provision from Job's table, that is, meat/food supplied by him.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내 장막의 사람들[a]이 말하지 않았다면, ‘누가 그의 고기[b]를 먹고 배부르지 않았겠습니까?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막’은 여기서 한 사람의 집안이나 가정의 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 살에서/그의 살로’라고 합니다. 여기서는 문맥상 욥이 식탁에서 제공한 음식, 특히 고기를 가리킵니다.
    reason: lexical_alternative
