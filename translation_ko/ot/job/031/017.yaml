    rationale: פִּתִּי는 음식, 특히 빵의 조각을 가리킬 수 있으나, 이 문맥에서 특정 음식명으로 반드시 번역할 근거는 없습니다.
  - severity: low
    issue: 각주 표지가 ‘고아’가 아니라 ‘혼자’ 뒤에 놓여 있습니다.
    rationale: 각주의 내용은 יָתוֹם의 어휘적 대안에 관한 것이므로 해당 번역어에 직접 붙여야 합니다.
