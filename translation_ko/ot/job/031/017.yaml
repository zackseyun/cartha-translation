  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֹכַ֣ל פִּתִּ֣/י לְ/בַדִּ֑/י וְ/לֹא אָכַ֖ל יָת֣וֹם מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
  footnotes:
  - marker: a
    text: Or 'the orphan.' The Hebrew literally refers to one who is fatherless.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 몫의 떡을 혼자 먹고[a], 고아가 그 몫을 먹지 못하게 했다면—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '고아'. 히브리어는 문자적으로 '아버지 없는 자'를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  english_pob_choice: if I ate
  chosen_korean: 내가 ... 먹고
  alternatives_korean:
  - 내가 ... 먹었다면
  - 내가 ... 먹었고
  lexicon: HALOT
  rationale: 히브리어는 욥기의 맹세형 조건절로, 한국어에서는 가정 조건을 자연스럽게 드러내는 '-다면' 구조가 가장 적절합니다. 현재형/과거형의 직역보다 조건문의 기능을 살렸습니다.
- source_word: פִּתִּי
  english_pob_choice: my morsel
  chosen_korean: 내 몫의 떡
  alternatives_korean:
  - 내 한 조각
  - 내 한입거리
  lexicon: HALOT
  rationale: פִּתִּי의 구체적이고 작은 음식 조각이라는 의미를 살리되, 한국어에서 자연스럽고 읽기 쉬운 표현으로 옮겼습니다. '떡'은 본문이 특정 음식명을 요구하지는 않지만, 작고 먹을 만한 몫이라는 감각을 전달합니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 고아
  alternatives_korean:
  - 아버지 없는 사람
  - 부친 없는 자
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '아버지 없는 자'를 가리키지만, 한국어에서는 '고아'가 해당 사회적 취약성을 가장 자연스럽게 드러냅니다. 다만 원문의 표지성을 살리기 위해 각주로 대안을 남깁니다.
- source_word: מִמֶּנָּה
  english_pob_choice: from it
  chosen_korean: 그 몫을
  alternatives_korean:
  - 그것을
  - 그 떡에서
  lexicon: HALOT
  rationale: 문법상 여성 단수 대명사는 앞의 '떡/몫'을 가리키므로 한국어에서는 '그 몫을'로 풀어 자연스럽게 연결했습니다. 목적어화된 표현이 반복을 줄이면서도 지시 대상을 분명히 합니다.
theological_decisions:
- issue: 욥의 서약형 자기변론을 조건문으로 옮길지 여부
  chosen_reading: 본문을 단순 서술이 아니라 '만일 내가 ... 했다면'이라는 서약적 조건문으로 옮겼습니다.
  alternative_readings:
  - 그냥 먹었다
  - 내가 먹고 ... 못 먹게 했다
  rationale: 욥기 31장의 연쇄는 자기 무죄를 증언하는 맹세 형식이므로, 한국어에서도 조건문으로 재현해야 논증의 힘이 유지됩니다.
  doctrine_reference: '성경 해석학: 맹세/서약 수사'
- issue: יָתוֹם의 사회적 뉘앙스
  chosen_reading: '''고아''를 본문에 두되, 각주로 ''아버지 없는 자''라는 문자적 의미를 밝혔습니다.'
  alternative_readings:
  - 본문에 '아버지 없는 자'를 그대로 넣기
  - '''부모 잃은 아이''로 완화하기'
  rationale: 이 단어는 단순한 가족 상태가 아니라 보호받지 못하는 사회적 약자를 가리키므로, 한국어의 익숙한 사회적 범주를 사용하되 원문 의미는 각주로 보존하는 편이 적절합니다.
  doctrine_reference: 구약의 약자 보호 윤리
