    issue: ‘먹지 못하게 했다면’이 사동성을 추가합니다.
    rationale: 원문 두 번째 절의 주어는 יָתוֹם(아버지 없는 자)이며, אָכַל의 부정은 그가 먹지 않았음을 말할 뿐 화자가 이를 막았다고 하지 않습니다.
  - severity: medium
