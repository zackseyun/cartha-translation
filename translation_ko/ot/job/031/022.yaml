  - 제 어깨 옆
  lexicon: HALOT
  rationale: כָּתֵף는 기본적으로 ‘어깨’를 뜻하므로, 한국어에서도 가장 자연스러운 대응인 ‘어깨’를 택했습니다.
- source_word: מִשִּׁכְמָה
  english_pob_choice: from its socket
  chosen_korean: 제자리에서 떨어지고
  alternatives_korean:
  - 어깨에서 떨어지고
