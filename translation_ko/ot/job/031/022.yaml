  lexicon: HALOT
  rationale: 희귀한 אַנატომिकल 용법을 반영해, 본문이 말하는 단단한 신체 구조를 살리는 ‘뼈’를 택했습니다. 영어 POB의 보수적 처리도 이 방향과 같습니다.
theological_decisions:
- issue: Job의 저주적 맹세를 한국어에서 어떻게 재현할 것인가
  chosen_reading: 직접적인 저주 맹세의 어조를 유지하기 위해 명령형 청유가 아니라 ‘~하게 하십시오’의 간구형으로 옮겼습니다.
  alternative_readings:
  - ‘~하소서’
  - ‘~되게 하소서’
  rationale: 본문은 하나님께 실제로 심판을 구하는 저주의 맹세이므로, 현대 한국어에서도 그 긴박하고 공적 성격이 드러나게 했습니다.
  doctrine_reference: 욥기 31장의 서원/맹세 문맥
- issue: 신체 훼손 이미지의 강도를 얼마나 보존할 것인가
  chosen_reading: ‘제자리에서 떨어지고’와 ‘그 뼈에서 부러지게’로 신체 분리와 골절의 강도를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘다치게 하십시오’
  - 의역하여 ‘탈골되게 하십시오’
  rationale: 문맥은 단순 부상이 아니라 구체적인 신체 저주이므로, 본문의 강한 이미지를 약화시키지 않았습니다.
  doctrine_reference: 본문 의미 보존 원칙
