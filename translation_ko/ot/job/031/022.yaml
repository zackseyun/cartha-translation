  source_fidelity: 히브리어는 조건절의 귀결로서 화자 자신의 신체에 닥칠 저주를 말합니다. כָּתֵף는 ‘어깨’, זְרוֹעַ는 ‘팔’, תִפּוֹל은 ‘떨어지다/빠지다’, תִשָּׁבֵר는 ‘부러지다’로 옮긴 것은 적절합니다. 다만 מִשִּׁכְמָה와 מִקָּנָה는 해부학적 지시가 불확실하거나 드문 표현이므로 본문에서 지나치게 단정하지 않고 주석으로 보완하는 편이 안전합니다.
  naturalness: ‘그때’는 앞의 조건에 따른 귀결을 나타내기에 부자연스러우므로 ‘그렇다면’이 적절합니다. 또한 ‘그 뼈에서’는 선행 대상이 분명하지 않아 한국어로 어색합니다. ‘제자리에서 빠지다’는 어깨의 이탈이라는 강한 이미지를 자연스럽게 전달합니다.
  terminology: ‘제 어깨’, ‘제 팔’은 현대 표준어 합쇼체 문맥에 적합합니다. ‘제자리’는 원문의 어깨/등 부위라는 지시를 해석적으로 반영하므로, 어깨 또는 어깨뼈라는 대안은 각주에 남겨야 합니다. מִקָּנָה는 ‘뼈’로 본문에 유지하되 ‘관절’ 등의 가능성을 각주에서 밝혀야 합니다.
