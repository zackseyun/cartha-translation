  - 제 전완
  lexicon: HALOT
  rationale: זְרוֹעַ는 통상 ‘팔’을 뜻하므로, 전문 해부학 용어보다 직관적인 ‘팔’을 사용했습니다.
- source_word: מִקָּנָה
  english_pob_choice: from its bone
  chosen_korean: 그 뼈에서
