translation:
  language: ko
  text: 그때 제 어깨가 제자리에서 떨어지고, 제 팔이 그 뼈에서 부러지게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제자리에서 떨어지고’는 히브리어 שִׁכְמָה의 희귀하고 해부학적인 뉘앙스를 살린 표현으로, 영어 POB의 ‘from its socket’과 같은 방향의 해석입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 뼈에서’는 히브리어 מִקָּנָה의 희귀한 해부학적 용례를 반영한 표현입니다. 영어 POB도 이 어구를 ‘from its bone’으로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי / כָּתֵף
  english_pob_choice: my shoulder
