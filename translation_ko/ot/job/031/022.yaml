  lexicon: HALOT
  rationale: 이 표현은 어깨가 제 위치에서 분리되는 신체적 저주를 가리키므로, 영어 POB의 ‘from its socket’에 맞춰 분리·이탈의 이미지를 살린 ‘제자리에서 떨어지고’로 옮겼습니다.
- source_word: וְאֶזְרֹעִי
