translation:
  language: ko
  text: 그렇다면 제 어깨가 제자리에서 빠지고[a], 제 팔이 뼈에서 부러지게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어깨에서’ 또는 ‘어깨뼈에서’일 수 있습니다. 히브리어는 어깨가 붙어 있는 자리에서 떨어지는 모습을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뼈에서’로 번역한 히브리어는 드문 해부학적 표현입니다. ‘관절에서’ 또는 ‘관절 부위에서’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי / כָּתֵף
  english_pob_choice: my shoulder
  chosen_korean: 제 어깨
  alternatives_korean:
