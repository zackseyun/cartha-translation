  text: אִם נִפְתָּ֣ה לִ֭בִּ/י עַל אִשָּׁ֑ה וְ/עַל פֶּ֖תַח רֵעִ֣/י אָרָֽבְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
  footnotes:
  - marker: a
    text: Or 'has been deceived' or 'has been seduced.' The Hebrew verb can denote being enticed or persuaded, here in a context of sexual temptation.
    reason: lexical_alternative
  - marker: b
    text: Or 'my friend's door.' The Hebrew word can mean 'neighbor,' 'friend,' or 'companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내 마음이 여자에게 유혹되었고, 내가 내 이웃의 문 앞에서 엎드려 기다렸다면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속임을 당했다’ 혹은 ‘꾀임을 당했다’일 수 있습니다. 히브리어 동사는 유혹되다, 설득되다의 뜻을 가질 수 있으며, 여기서는 성적 유혹의 문맥입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 친구의 문’일 수 있습니다. 히브리어 단어는 ‘이웃,’ ‘친구,’ ‘동료’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  english_pob_choice: has been enticed
  chosen_korean: 유혹되었고
  alternatives_korean:
  - 속임을 당했고
  - 꾀임을 당했고
  - 설득되었고
  lexicon: HALOT
  rationale: 니팔형 פתה의 ‘유혹되다/꾀이다’ 의미를 살려, 내적 성적 유혹의 동력을 분명히 드러내되 지나치게 해석적으로 만들지 않았습니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 হৃদ심
  - 내 속마음
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 인격의 중심, 생각과 욕망과 의지를 포괄하므로 한국어에서도 관용적이면서도 인류학적 함의를 살릴 수 있는 ‘내 마음’으로 옮겼습니다.
- source_word: רֵעִי
  english_pob_choice: my neighbor's
  chosen_korean: 내 이웃의
  alternatives_korean:
  - 내 친구의
  - 내 동료의
  lexicon: HALOT
  rationale: רֵעַ는 친구/동료/이웃을 모두 가질 수 있지만, 이 법적·윤리적 맥락에서는 ‘이웃’이 공동체적 경계를 가장 잘 드러냅니다.
- source_word: אָרָבְתִּי
  english_pob_choice: I have lain in wait
  chosen_korean: 엎드려 기다렸다면
  alternatives_korean:
  - 숨어 기다렸다면
  - 매복했었다면
  - 몰래 기다렸다면
  lexicon: HALOT
  rationale: אָרב의 핵심은 숨은 의도를 가진 잠복·매복이지만, 한국어에서 ‘매복’은 군사적 뉘앙스가 강하므로, 문맥의 은밀하고 부정한 기다림을 살리면서도 자연스러운 ‘엎드려 기다리다’로 옮겼습니다.
theological_decisions:
- issue: 사적 욕망과 실제 행동의 연속성
  chosen_reading: 내면의 유혹과 문 앞에서의 은밀한 대기라는 두 단계를 함께 드러내어, 죄의 진행을 축소하지 않았습니다.
  alternative_readings:
  - 더 완곡하게 연애 감정으로 옮기기
  - 더 노골적으로 간음 시도로 해석하기
  rationale: 본문은 조건절 형태로 내적 유혹에서 외적 은밀한 행동으로 이어지는 윤리적 긴장을 유지합니다. 번역도 그 진행을 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
