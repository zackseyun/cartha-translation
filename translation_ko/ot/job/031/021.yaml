id: JOB.31.21
reference: Job 31:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם הֲנִיפ֣וֹתִי עַל יָת֣וֹם יָדִ֑/י כִּֽי אֶרְאֶ֥ה בַ֝/שַּׁ֗עַר עֶזְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
  footnotes:
  - marker: a
    text: Or 'the orphan.' The Hebrew term refers specifically to one deprived of a father and therefore socially vulnerable.
    reason: lexical_alternative
  - marker: b
    text: The 'gate' refers to the city gate, where elders judged cases and public decisions were made.
    reason: cultural_note
  - marker: c
    text: Literally 'my help'; here it means support or backing in a legal/public setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아버지 없는 자를 대적하여 내 손을 들어 올렸다면, 내가 성문에서 내 도움을 볼 수 있었기 때문입니다—[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지 없는 자’는 단순히 법적 고아를 넘어, 아버지의 보호를 받지 못해 사회적으로 취약한 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 도시의 성문으로, 장로들이 재판하고 공적 결정을 내리던 장소를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘내 도움’은 문자적으로는 ‘나의 도움’이며, 여기서는 성문에서의 후원이나 법적 뒷받침을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִיפוֹתִי / עַל
  english_pob_choice: have raised ... against
  chosen_korean: 대적하여 내 손을 들어 올렸다면
  alternatives_korean:
  - 내 손을 들어 대항했다면
  - 내 손을 높이 들었다면
  lexicon: HALOT
  rationale: 히필 동사와 전치사 עַל의 적대적 제스처를 한국어에서 자연스럽게 살리기 위해 ‘대적하여’와 ‘들어 올렸다’로 옮겼습니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 아버지 없는 자
  alternatives_korean:
  - 고아
  - 부친 없는 자
  lexicon: HALOT
  rationale: 히브리어가 가리키는 것은 단순한 법적 범주보다 아버지를 잃어 사회적으로 취약한 사람입니다. ‘아버지 없는 자’가 그 취약성을 더 직접적으로 드러냅니다.
- source_word: בַשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 문에서
  - 도성의 문에서
  lexicon: HALOT
  rationale: ‘성문’은 재판과 공적 결정이 이루어지던 도시 문맥을 한국어 독자가 바로 알아들을 수 있게 하는 적절한 표현입니다.
- source_word: עֶזְרָתִי
  english_pob_choice: I had support
  chosen_korean: 내 도움을 볼 수 있었기 때문입니다
  alternatives_korean:
  - 내 도움을 가질 수 있었기 때문입니다
  - 내 배경이 있었기 때문입니다
  - 내 후원을 볼 수 있었기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 ‘나의 도움’이지만, 문맥상 성문에서의 법적·공적 우위를 가리키므로 ‘내 도움을 볼 수 있었다’로 이해 가능하게 옮겼습니다.
theological_decisions:
- issue: 조건문이 다음 절의 암시된 저주를 향해 열리는 욥의 맹세 구조
  chosen_reading: 21절은 단순한 가정문이 아니라, 자신이 그런 악을 저질렀다면 다음 절의 심판을 받아도 된다는 서원적 조건문으로 읽었습니다.
  alternative_readings:
  - 일반적인 가정문으로만 읽기
  - 윤리적 반성문으로 완화해 읽기
  rationale: 히브리어 ‘אם’과 31장 전체의 맹세 재판 문맥은, 욥이 자신의 결백을 엄정하게 주장하는 법정 언어를 형성합니다.
  doctrine_reference: 욥기 31장 맹세 구조와 고대 근동 법정 수사
