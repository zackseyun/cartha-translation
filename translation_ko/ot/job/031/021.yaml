  source_fidelity: ‘내 도움을 볼 수 있었기 때문입니다’는 히브리어 עֶזְרָתִי(‘나의 도움’)를 한국어 관용상 부자연스럽게 직역하여, 성문에서 이용할 수 있는 후원·지원이라는 뜻이 충분히 전달되지 않습니다. 또한 הֲנִיפוֹתִי עַל의 적대적 위협 행위는 ‘해하려고 손을 들다’로 더 자연스럽고 충실하게 표현할 수 있습니다.
  naturalness: 수정문은 욥기 31장의 맹세적 조건문과 다음 절로 이어지는 대시를 유지하면서, 현대 표준 한국어 합쇼체에서 자연스러운 문장으로 다듬었습니다.
  terminology: יָתוֹם은 ‘아버지 없는 사람’으로 옮겨 아버지를 잃어 사회적으로 취약한 이를 가리키는 원문의 범위를 보존했습니다. בַשַּׁעַר는 법적·공적 맥락을 지닌 ‘성문’으로 유지했고, עֶזְרָתִי는 ‘나를 도와줄 사람이 있음을’으로 문맥적 의미를 명료화했습니다.
