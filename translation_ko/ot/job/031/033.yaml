base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
  footnotes:
  - marker: a
    text: Or, “like Adam.” The Hebrew אָדָם can be read either as the common noun “man” or the proper name “Adam.”
    reason: alternative_reading
translation:
  language: ko
  text: 만일 제가 사람처럼[a] 제 허물들을 가리고, 제 죄악을 제 품속에 숨겼다면—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아담처럼”. 히브리어 אָדָם은 일반명사 “사람”으로도, 고유명사 “아담”으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסִּיתִי
  english_pob_choice: I have covered
  chosen_korean: 제가 … 가리고
  alternatives_korean:
  - 제가 … 덮고
  - 제가 … 숨기고
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다/가리다’를 살려, 죄를 밖에서 감추는 행위를 자연스러운 한국어 동사 ‘가리다’로 옮겼습니다.
- source_word: כְאָדָם
  english_pob_choice: like a man
  chosen_korean: 사람처럼
  alternatives_korean:
  - 아담처럼
  - 인간처럼
  - 사람같이
  lexicon: HALOT
  rationale: אָדָם의 일반명사 의미를 본문에 두고, 비교 표지 כְ를 살려 ‘사람처럼’으로 번역했습니다. 고유명사 ‘아담’ 해석은 본문 주석으로 남기지 않고, 직역보다 문맥상 자연스러운 일반의미를 택했습니다.
- source_word: בְּחֻבִּי
  english_pob_choice: in my bosom
  chosen_korean: 제 품속에
  alternatives_korean:
  - 제 품에
  - 제 가슴에
  - 제 속에
  lexicon: HALOT
  rationale: ‘bosom/lap’의 구체적 신체 이미지를 한국어의 ‘품속’으로 옮겨, 은폐된 내밀한 곳이라는 은유를 유지했습니다.
- source_word: פְּשָׁעַי / עֲוֺנִי
  english_pob_choice: my transgressions / my iniquity
  chosen_korean: 저의 허물들 / 제 죄악
  alternatives_korean:
  - 저의 죄과들 / 제 불의
  - 저의 죄들 / 제 불법
  lexicon: HALOT
  rationale: פֶּשַׁע의 ‘transgression’과 עָוֹן의 ‘iniquity’ 차이를 살리기 위해, 앞은 ‘허물들’, 뒤는 더 무거운 ‘죄악’으로 구분했습니다.
theological_decisions:
- issue: כְאָדָם의 해석
  chosen_reading: 본문에는 일반명사 의미를 따라 ‘사람처럼’으로 두고, 아담 고유명사 읽기는 채택하지 않았습니다.
  alternative_readings:
  - ‘아담처럼’으로 읽는 해석
  - ‘사람들처럼’이라는 집단적 의미
  rationale: 히브리어 אָדָם은 문맥상 일반명사와 고유명사 둘 다 가능하지만, 여기서는 욥의 자기고백적 평행법 안에서 일반적 인간을 가리키는 읽기가 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם 항목 및 contested terms 원칙'
- issue: 직접적인 자기고백의 문체
  chosen_reading: 합쇼체 서술을 유지하되, 조건절 내부의 1인칭 고백은 성격상 평서형으로 처리했습니다.
  alternative_readings:
  - 더 구어적인 자기 진술
  - 더 경전체적인 종결
  rationale: 욥기의 시적 진술은 현대 한국어에서도 품위를 유지해야 하므로, 과도한 고어체 없이 단정한 합쇼체로 옮겼습니다.
  doctrine_reference: Korean target style guidance
