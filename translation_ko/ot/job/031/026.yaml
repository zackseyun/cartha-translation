  - 주석 없이 단순히 '빛'과 '달'만 병렬하기
  rationale: 욥기 31:26 자체는 해석적 함의를 열어 두고 있으므로, 원문 어휘를 보존하면서 문맥이 그 신학적 긴장을 설명하도록 두는 편이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
