  text: אִם אֶרְאֶ֣ה א֖וֹר כִּ֣י יָהֵ֑ל וְ֝/יָרֵ֗חַ יָקָ֥ר הֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/026.yaml
  text: if I looked at the light when it shone[a], or at the moon moving in splendor[b],
  footnotes:
