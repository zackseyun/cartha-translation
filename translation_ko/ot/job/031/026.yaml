    reason: lexical_alternative
  - marker: b
    text: Or 'the moon walking in brightness / splendor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 빛이 찬란히 비칠 때[a], 또는 달이 찬란히 떠가는 것을[b] 바라보았다면
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '해'일 수 있습니다. 여기서 '빛'은 아마 달과 병행을 이루는 해를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '찬란하게 떠가는 달'이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: if
  chosen_korean: -라면
  alternatives_korean:
  - 만약
  - 만일
  lexicon: HALOT
  rationale: 히브리어 조건절을 한국어 가정형으로 자연스럽게 옮기되, 욥의 부인 맹세 문맥을 살려 문장 말미에 조건형으로 처리했습니다.
- source_word: אֶרְאֶה
  english_pob_choice: I looked
