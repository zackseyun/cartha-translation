  - 내가 … 쳐다보았다
  lexicon: HALOT
  rationale: 문맥상 과거의 가정된 행위를 가리키므로 과거형으로 옮겼고, 단순 시각보다 의도적 응시를 드러내기 위해 '바라보다'를 택했습니다.
- source_word: אוֹר
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 그 빛
  - 해
  lexicon: HALOT
  rationale: 원문은 문자적으로 '빛'이지만, 영어 POB 주석처럼 문맥상 해를 가리킬 수 있으나 본문 자체는 일반 명칭을 유지하므로 한국어도 직역을 보존했습니다.
- source_word: יָהֵל
  english_pob_choice: it shone
  chosen_korean: 찬란히 비칠 때
  alternatives_korean:
  - 비칠 때
  - 빛날 때
  lexicon: HALOT
  rationale: 동사의 발광/광휘 의미를 한국어의 '찬란히 비치다'로 살려, 단순한 밝음보다 천체의 눈부신 광채를 드러냈습니다.
- source_word: יָרֵחַ
  english_pob_choice: the moon
  chosen_korean: 달
  alternatives_korean:
  - 그 달
  - 월
  lexicon: HALOT
  rationale: 히브리어 ירח는 달을 뜻하므로 현대 한국어의 자연스러운 표현인 '달'로 옮겼습니다.
- source_word: יָקָר הֹלֵךְ
  english_pob_choice: moving in splendor
  chosen_korean: 빛나며 움직이는 것을
  alternatives_korean:
  - 영광스럽게 움직이는 것을
  - 찬란히 가며
  lexicon: HALOT
  rationale: יָקָר의 '귀한/영광스러운/찬란한' 뉘앙스와 הֹלֵךְ의 진행성을 함께 살려, 달의 하늘 운행을 한국어 진행형으로 표현했습니다.
theological_decisions:
- issue: 본문의 천체 숭배 암시를 얼마나 드러낼지
  chosen_reading: 본문 표면의 천체 묘사는 유지하되, 숭배라는 해석은 본문 밖에서 강요하지 않았습니다.
  alternative_readings:
  - '''해''로 의역하여 우상숭배 맥락을 더 분명히 드러내기'
  - 주석 없이 단순히 '빛'과 '달'만 병렬하기
  rationale: 욥기 31:26 자체는 해석적 함의를 열어 두고 있으므로, 원문 어휘를 보존하면서 문맥이 그 신학적 긴장을 설명하도록 두는 편이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
