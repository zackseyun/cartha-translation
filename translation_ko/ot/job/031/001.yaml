lexical_decisions:
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 약속
  lexicon: HALOT
  rationale: בְּרִית의 중량감 있는 법적·도덕적 결속을 한국어로는 ‘언약’이 가장 잘 보존합니다.
- source_word: כָּרַתִּי
  english_pob_choice: have made
  chosen_korean: 맺었습니다
  alternatives_korean:
  - 만들었습니다
  - 끊었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘언약을 자르다’는 한국어에서 자연스럽게 ‘언약을 맺다’로 옮기는 것이 가장 직접적입니다.
- source_word: אֶתְבּוֹנֵן
  english_pob_choice: gaze
  chosen_korean: 바라보겠습니까
  alternatives_korean:
  - 응시하겠습니까
  - 쳐다보겠습니까
  - 유심히 보겠습니까
  lexicon: HALOT
  rationale: 단순한 ‘보다’가 아니라 의도적이고 지속적인 시선을 뜻하므로, 문맥상 자연하면서도 통제된 시선의 뉘앙스를 살리는 ‘바라보다’를 택했습니다.
- source_word: בְּתוּלָה
  english_pob_choice: a virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 젊은 여자
  lexicon: HALOT
  rationale: 이 절은 성적 순결을 전제한 미혼 여성을 가리키므로, 현대 한국어에서 그 의미를 가장 직접적으로 전달하는 ‘처녀’를 사용했습니다.
theological_decisions:
- issue: 욕망을 향한 자기 규율의 진술을 어떻게 드러낼 것인가
  chosen_reading: 문장을 직설적으로 유지해, 욥이 시선 자체를 도덕적 책임의 영역으로 삼고 있음을 드러냈습니다.
  alternative_readings:
  - ‘처녀를 쳐다보지 않겠습니다’처럼 완화하기
  - ‘처녀를 생각하지 않겠습니다’로 내면화하기
  rationale: 본문은 실제로 ‘바라보다’는 행위를 문제 삼으므로, 행위의 직접성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 성결과 절제에 관한 성서적 윤리
