base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
  footnotes:
  - marker: a
    text: Or 'ruin' for 'disaster' and 'misfortune' for 'calamity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the unjust' and 'for the doers of evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 자에게는 재앙이, 악을 행하는 자들에게는 불행이 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 ‘파멸’로, ‘불행’은 ‘환난’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불의한 자’는 ‘불공정한 자’로, ‘악을 행하는 자들’은 ‘악을 저지르는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: 그렇지 않습니까?
  alternatives_korean:
  - 아닙니까?
  - 정말 그렇지 않습니까?
  lexicon: HALOT
  rationale: 반어적 질문의 힘을 살리면서 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: אֵיד
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 파멸
  lexicon: HALOT
  rationale: 불의한 자에게 돌아오는 파괴적 결과를 간결하게 드러내는 표준적 어휘로 옮겼습니다.
- source_word: לְעַוָּל
  english_pob_choice: for the unrighteous
  chosen_korean: 불의한 자에게는
  alternatives_korean:
  - 불의한 사람에게는
  - 불공정한 자에게는
  lexicon: HALOT
  rationale: 의미 중심으로 ‘의롭지 않음’보다 윤리적·법적 반대편을 드러내는 ‘불의한 자’로 옮겼습니다.
- source_word: וְנֵכֶר
  english_pob_choice: and calamity
  chosen_korean: 환난이
  alternatives_korean:
  - 재앙이
  - 불행이
  lexicon: HALOT
  rationale: 평행구에서 אֵיד와 약간 다른 뉘앙스의 파국적 결과를 살리되, ‘재앙’과 지나치게 겹치지 않도록 ‘환난’을 택했습니다.
- source_word: לְפֹעֲלֵי אָוֶן
  english_pob_choice: for the workers of iniquity
  chosen_korean: 악을 행하는 자들에게는
  alternatives_korean:
  - 불의를 행하는 자들에게는
  - 죄악을 행하는 자들에게는
  lexicon: HALOT
  rationale: ‘행하다’의 지속적·습관적 뉘앙스를 살리면서, אָוֶן의 도덕적 악을 한국어로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 보편적 도덕 질서 표현
  chosen_reading: 이 절은 불의와 악행에 따르는 결과를 말하는 일반 원리로 옮기고, 징벌의 기제를 지나치게 특정하지 않았습니다.
  alternative_readings:
  - 하나님의 직접적 형벌로 명시하기
  - 단순한 자연적 결과로만 읽기
  rationale: 히브리어는 재앙과 환난이 불의한 자와 악행자에게 속한다고 말하지만, 그 발생 방식을 이 절 안에서 상세히 규정하지는 않습니다. 번역은 그 긴장을 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
