revisions:
- from: 그것은 소멸에 이르기까지 삼키는 불이며, 내 모든 소출을 뿌리째 뽑아낼 것입니다.[a]
  to: 이는 파멸[a]에 이르기까지 태워 삼키고, 내 모든 소출을 뿌리째 뽑아 버릴 불입니다.
  rationale: כִּי의 설명적 기능을 ‘이는’으로 반영했습니다. ‘태워 삼키고’는 불이 ‘먹다/소비하다’라는 히브리어 비유를 한국어에서 자연스럽게 유지합니다. תְשָׁרֵשׁ의 뿌리 이미지와 조건적 맹세 문맥에서의 결과적 뉘앙스는 ‘뿌리째 뽑아 버릴’로 보존했습니다. 아바돈의 독법은 본문에서 강요하지 않고, 해당 어구에 직접 붙인 각주에서만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:43:59Z'
