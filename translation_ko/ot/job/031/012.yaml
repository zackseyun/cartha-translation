id: JOB.31.12
reference: Job 31:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
  footnotes:
  - marker: a
    text: Or 'unto Abaddon.' The Hebrew אֲבַדּוֹן can denote 'destruction' or, in some contexts, the realm/personification of destruction.
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 소멸에 이르기까지 삼키는 불이며, 내 모든 소출을 뿌리째 뽑아낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아바돈까지’. 히브리어 אֲבַדּוֹן은 ‘소멸/파멸’을 뜻할 수 있고, 어떤 문맥에서는 ‘아바돈’이라는 존재 또는 영역을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그것은
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 경고를 받는 설명문이지만, 한국어에서는 문장 첫머리에 원인 접속사보다 주어를 먼저 두어 경고의 이미지를 자연스럽게 살렸습니다.
- source_word: אֵשׁ הִיא
  english_pob_choice: it is a fire
  chosen_korean: 불이며
  alternatives_korean:
  - 불입니다
  - 그 불입니다
  lexicon: HALOT
  rationale: ‘불’의 은유를 그대로 살리되, 서술적 연결을 위해 ‘-이며’를 사용해 원문의 비유적 단정성을 유지했습니다.
- source_word: עַד אֲבַדּוֹן
  english_pob_choice: to destruction
  chosen_korean: 소멸에 이르기까지
  alternatives_korean:
  - 파멸까지
  - 아바돈까지
  lexicon: HALOT
  rationale: 문맥상 고유명사보다 보통명사 ‘소멸/파멸’이 자연스러우므로 본문에는 그 뜻을 반영했고, 히브리어의 중의성은 각주로 보존했습니다.
- source_word: תֹּאכֵל
  english_pob_choice: consumes
  chosen_korean: 삼키는
  alternatives_korean:
  - 태우는
  - 소모하는
  lexicon: HALOT
  rationale: 불이 먹어 치우듯 없애 버리는 동작을 한국어의 관용적 이미지 ‘삼키다’로 옮겨 소멸의 강도를 살렸습니다.
- source_word: תְּבוּאָתִי
  english_pob_choice: my produce
  chosen_korean: 내 모든 소출
  alternatives_korean:
  - 내 수확
  - 내 소산
  lexicon: HALOT
  rationale: 농경적 결과물 전체를 가리키는 말이므로 ‘소출’이 가장 가깝고, ‘모든’을 더해 전면적 상실을 분명히 했습니다.
- source_word: תְשָׁרֵשׁ
  english_pob_choice: would root out
  chosen_korean: 뿌리째 뽑아낼 것입니다
  alternatives_korean:
  - 뿌리까지 뽑아버릴 것입니다
  - 근본부터 없앨 것입니다
  lexicon: HALOT
  rationale: שורש의 농경적 이미지를 살려 ‘뿌리째 뽑다’로 옮겼고, 미래형은 맹세 맥락의 잠재/결과적 뉘앙스를 한국어의 ‘-ㄹ 것입니다’로 반영했습니다.
theological_decisions:
- issue: אֲבַדּוֹן의 의미
  chosen_reading: 본문은 ‘소멸/파멸’의 보통명사 의미로 읽고, 고유명사적 뉘앙스는 각주로만 남깁니다.
  alternative_readings:
  - ‘아바돈’이라는 고유명사로 읽기
  rationale: 지혜문맥에서는 특정 지하세계 존재를 가리킨다기보다 파괴의 종착점을 묘사하는 뜻이 더 직접적이므로, 본문 의미를 우선하고 대안 해석은 보존했습니다.
  doctrine_reference: 문맥 우선 원칙
