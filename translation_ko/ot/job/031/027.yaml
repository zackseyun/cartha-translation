    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  english_pob_choice: was enticed
  chosen_korean: 유혹되었고
  alternatives_korean:
  - 꾀임을 받았고
  - 현혹되었고
  - 설득되었고
  lexicon: HALOT
  rationale: 피알 형태의 פתה는 여기서 내적인 끌림과 유혹을 가리키므로, ‘유혹되었고’가 가장 자연스럽게 그 의미를 살립니다.
- source_word: בַּסֵּתֶר
  english_pob_choice: secretly
  chosen_korean: 은밀하게
  alternatives_korean:
  - 몰래
  - 비밀리에
  - 숨은 데서
  lexicon: HALOT
  rationale: סתר의 핵심은 드러나지 않은 상태이므로, 한국어로는 부자연스럽지 않게 ‘은밀하게’가 적절합니다.
- source_word: וַתִּשַּׁק יָדִי לְפִי
  english_pob_choice: and my hand kissed my mouth
  chosen_korean: 내 손이 내 입에 입맞추었습니다
  alternatives_korean:
  - 내 손이 내 입에 입맞추었습니다
  - 내 손이 내 입에 입맞춤했습니다
  - 내 손이 내 입으로 입맞춤했습니다
  lexicon: HALOT
  rationale: נשק은 기본적으로 ‘입맞추다’이므로, 본문 이미지를 그대로 살려 손과 입의 동작을 직역에 가깝게 옮겼습니다.
