  source_fidelity: 첫 절반의 ‘은밀하게 유혹되었고’는 וַיִּפְתְּ בַּסֵּתֶר לִבִּי를 충실히 옮깁니다. 그러나 ‘내 손이 내 입에 입맞추었습니다’는 히브리어의 구체적 이미지를 기계적으로 보존하려 하나, 한국어에서는 손이 입에 입맞춤하는 동작으로 읽혀 부자연스럽고 실제 몸짓을 흐립니다. ‘내 손에 입맞추었고’는 한국어의 자연스러운 관용적 표현으로, 손에 입맞추는 원문의 제의적 몸짓을 보존합니다.
  naturalness: ‘은밀히 내 마음이 유혹을 받았고, 내 손에 입맞추었고’는 현대 표준어의 격식 있는 성경 문체로 자연스럽습니다. 주어를 ‘내 마음’으로 명시하고 ‘유혹을 받다’를 사용하면 무엇이 유혹되었는지도 분명해집니다.
  terminology: ‘유혹을 받다’는 פתה의 수동적·내면적 끌림을 적절히 나타냅니다. ‘입맞추다’는 נשק의 기본 뜻을 유지합니다. 각주에서는 본문에 우상숭배를 삽입하지 않으면서 문맥상 가능한 경배 몸짓을 설명합니다.
