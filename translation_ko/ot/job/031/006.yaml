lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  english_pob_choice: Let him weigh me
  chosen_korean: 나를 달아 보시고
  alternatives_korean:
  - 나를 저울에 달게 하시고
  - 나를 달아 보십시오
  lexicon: WLC/HALOT
  rationale: שקל의 비유적 용법을 살려 심판적·검증적 의미가 드러나도록 ‘달아 보다’로 옮겼습니다. 문맥의 요청형 뉘앙스는 공손한 간접청유로 처리했습니다.
- source_word: בְּמֹאזְנֵי צֶדֶק
  english_pob_choice: in righteous scales
  chosen_korean: 정직한 저울에
  alternatives_korean:
  - 의로운 저울에
  - 공정한 저울에
  - 의의 저울에
  lexicon: WLC/HALOT
  rationale: מֹאזְנַיִם은 실제 ‘저울’이고, צֶדֶק은 이 문맥에서 도덕적 ‘의로움’보다 공정성·정직성을 강조하는 상업/법정 이미지로 읽히므로 자연스러운 한국어로 ‘정직한 저울’이라 했습니다.
- source_word: וְיֵדַע אֱלוֹהַּ
  english_pob_choice: and let God know
  chosen_korean: 하나님께서 아시기를 바랍니다
  alternatives_korean:
  - 그리고 하나님께서 알게 되시기를 바랍니다
  - 하나님께서 아시고 인정하시기를 바랍니다
  lexicon: WLC/HALOT
  rationale: וְ + 미완료형의 연속적 소망을 한국어의 ‘-시기를 바랍니다’로 옮겨, 단순 미래가 아니라 검증 뒤의 인지/인정 요청을 살렸습니다.
- source_word: תֻּמָּתִי
  english_pob_choice: my integrity
  chosen_korean: 나의 온전함
  alternatives_korean:
  - 나의 정직함
  - 나의 무죄함
  - 나의 흠없음
  lexicon: WLC/HALOT
  rationale: תֻּמָּה는 ‘온전함, 완전함, 흠없음’의 범위를 가지며, 욥이 절대적 무죄를 단정하기보다 자신의 도덕적 온전함을 주장하는 흐름에 맞춰 ‘온전함’을 택했습니다.
theological_decisions:
- issue: 욥의 자기 진술 강도
  chosen_reading: ‘나의 온전함’으로 번역해 자기의 도덕적 결백을 주장하되, 절대적 무죄 선언으로 과장하지 않았습니다.
  alternative_readings:
  - ‘나의 무죄함’
  - ‘나의 흠없음’
  rationale: 본문은 공정한 하나님의 검증을 요청하는 자기변호이지, 완전무결함을 교리적으로 선언하는 구절이 아니므로 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3 (theological tension preserved)
