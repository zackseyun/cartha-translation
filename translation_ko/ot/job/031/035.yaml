id: JOB.31.35
reference: Job 31:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
  footnotes:
  - marker: a
    text: Or 'my mark' or 'my sign.' The Hebrew likely refers to Job's attesting mark placed on his declaration.
    reason: lexical_alternative
  - marker: b
    text: Or 'and let the man of my dispute write a document.' The Hebrew is more literally 'and a scroll/document the man of my dispute wrote,' but in context it expresses Job's wish for a written charge from his accuser.
    reason: alternative_reading
translation:
  language: ko
  text: 오, 내 말을 들어 줄 사람이 있었으면 좋겠습니다! 여기에 내 서명이 있습니다[a]. 전능하신 분께서 내게 대답하시면 좋겠습니다. 나의 소송 상대가 고발 문서를 작성했으면 좋겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 표식’ 또는 ‘내 표지’로 옮길 수 있습니다. 히브리어는 아마도 욥이 자신의 진술에 붙인 확인 표시를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 소송 상대가 문서를 작성했으면 좋겠습니다.’ 히브리어는 더 문자적으로 ‘나의 소송 상대가 작성한 문서’라고 읽힐 수 있습니다. 그러나 문맥에서는 욥이 자신을 고발하는 문서를 내놓으라고 요구하는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  english_pob_choice: Oh, that I had
  chosen_korean: 오, 나를 들어 줄 사람이 있었으면 좋겠습니다
  alternatives_korean:
  - 누가 주겠습니까
  - 나에게 듣는 이가 있었으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 질문이 아니라 간절한 소망을 나타내므로, 현대 한국어의 소망 표현으로 옮겼습니다.
- source_word: שֹׁמֵעַ לִי
  english_pob_choice: someone to hear me
  chosen_korean: 나를 들어 줄 사람
  alternatives_korean:
  - 나를 듣는 이
  - 나에게 귀 기울일 사람
  lexicon: HALOT
  rationale: 법정적 맥락에서 Job의 말을 '듣는 사람'은 그의 변론을 청취하고 판단할 사람을 뜻하므로, 자연스러운 현대어로 살렸습니다.
- source_word: תָּוִי
  english_pob_choice: my signature
  chosen_korean: 내 표식
  alternatives_korean:
  - 내 서명
  - 내 표지
  - 내 도장
  lexicon: HALOT
  rationale: 히브리어 תָּו는 본문에서 자신의 진술을 확인하는 표시를 가리킬 가능성이 높아, 문자적 의미를 보존하면서도 법정적 기능을 드러내는 '표식'을 채택했습니다.
- source_word: אִישׁ רִיבִי
  english_pob_choice: my accuser
  chosen_korean: 나의 소송 상대
  alternatives_korean:
  - 나의 고소인
  - 나와 다투는 사람
  - 나의 원고
  lexicon: HALOT
  rationale: 직역하면 '나의 다툼의 사람'이지만, 문맥상 법적 분쟁의 상대를 가리키므로 한국어의 소송 용어로 기능을 드러냈습니다.
- source_word: סֵפֶר כָּתַב
  english_pob_choice: write out the indictment
  chosen_korean: 고발장을 써 주었으면 좋겠습니다
  alternatives_korean:
  - 문서를 써 주었으면 좋겠습니다
  - 소장을 써 주었으면 좋겠습니다
  - 기록문을 써 주었으면 좋겠습니다
  lexicon: HALOT
  rationale: סֵפֶר과 כָּתַב의 결합은 단순한 '책'이 아니라 분쟁을 기록한 문서의 의미를 가지므로, 문맥상 고발 문서의 성격을 살렸습니다.
theological_decisions:
- issue: 법정적 이미지의 명시성
  chosen_reading: '''표식'', ''소송 상대'', ''고발장''처럼 분쟁과 진술 확인의 법정 이미지를 분명하게 드러냈습니다.'
  alternative_readings:
  - 더 직역적으로 '내 표시', '나와 다투는 사람', '책/문서'로 옮길 수 있습니다.
  rationale: 이 절은 하나님 앞에서의 변론과 무죄 호소를 법정 언어로 구성하므로, 의미를 희미하게 하지 않도록 법정적 기능을 분명히 드러내는 번역이 본문 취지에 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and optimal equivalence in forensic context'
