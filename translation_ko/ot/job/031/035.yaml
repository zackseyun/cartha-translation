  source_fidelity: 수정이 필요합니다. 히브리어의 소망 표현과 법정적 맥락은 대체로 잘 반영했지만, '대답해 주시고/써 주었으면'의 보조 동사 '주다'는 원문에 없는 수혜의 뉘앙스를 더합니다. 또한 '고발장'은 현대 한국 법률 용어로 다소 특정적이므로, 원문의 '문서/기록'과 문맥상 고발의 기능을 함께 보존하는 표현이 더 안전합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. '내 말을 들어 줄 사람'은 법정적 청취의 의미를 자연스럽게 전달하며, 두 소망을 독립 문장으로 두어 주어가 바뀌는 구조를 명료하게 했습니다.
  terminology: '''전능하신 분''은 שַׁדַּי의 적절한 번역입니다. תָּו는 본문에서 진술의 인증 표시라는 기능을 지니므로 본문에서는 ''서명''으로, 각주에서는 더 문자적인 ''표식/표지''로 보완했습니다. אִישׁ רִיבִי는 ''소송 상대''로 유지하되, סֵפֶר는 지나치게 특정적인 ''고발장'' 대신 ''고발 문서''로 옮겼습니다.'
