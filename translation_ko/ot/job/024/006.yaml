id: JOB.24.6
reference: Job 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
  footnotes:
  - marker: a
    text: Or 'provender' or 'mixed fodder'; the Hebrew refers to animal feed rather than ordinary grain.
    reason: lexical_alternative
  - marker: b
    text: Or 'they glean the vineyard of the wicked.' The Hebrew does not explicitly repeat the preposition 'in.'
    reason: lexical_alternative
  - marker: c
    text: '''The wicked'' may refer generically to a wicked owner; alternatively, ''a wicked man.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 밭에서 그들은 사료를 거두어들이고, 악한 자의 포도원에서 이삭을 주워 모읍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사료’는 여기서 사람의 곡식이 아니라 가축 먹이인 혼합 사료를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이삭을 주워 모으다’의 뜻을 담지만, 한국어에서는 동작을 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘악한 자’는 특정 인물보다 악한 소유자를 가리키는 일반적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  english_pob_choice: In the field
  chosen_korean: 밭에서
  alternatives_korean:
  - 들에서
  - 밭 안에서
  lexicon: HALOT
  rationale: בַּ plus שָׂדֶה의 장소 용법을 자연스럽게 옮기되, 농경 문맥에서는 ‘밭’이 가장 직관적입니다.
- source_word: בְּלִילוֹ
  english_pob_choice: fodder
  chosen_korean: 사료를
  alternatives_korean:
  - 여물을
  - 혼합 사료를
  lexicon: HALOT
  rationale: 이 단어는 사람의 곡식이 아니라 가축 먹이인 혼합 사료를 가리키므로, 그 의미를 분명히 드러내는 ‘사료’를 택했습니다.
- source_word: יקצירו
  english_pob_choice: they harvest
  chosen_korean: 거두어들이고
  alternatives_korean:
  - 수확하고
  - 거둡니다
  lexicon: HALOT
  rationale: קצר의 ‘거두다/수확하다’ 의미를 살리면서, 다음 절과의 병렬을 위해 한국어에서 자연스러운 진행형 연결로 처리했습니다.
- source_word: יְלַקֵּשׁוּ
  english_pob_choice: they glean
  chosen_korean: 이삭을 주워 모읍니다
  alternatives_korean:
  - 이삭을 줍습니다
  - 이삭을 거둡니다
  lexicon: HALOT
  rationale: לקשׁ의 ‘남은 것을 주워 모으다, 이삭을 줍다’라는 뜻을 반영해, 수확과 구별되는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: רָשָׁע의 대상과 범주성
  chosen_reading: ‘악한 자’로 옮겨, 특정 개인일 수도 있으나 일반적으로 악한 소유자를 가리키는 범주성을 남겼습니다.
  alternative_readings:
  - 악한 사람
  - 악인
  rationale: 히브리어 단수 형용사가 명사처럼 쓰여 일반적 성격을 띠므로, 한국어에서도 개별 인물로 고정하지 않고 열어 두었습니다.
  doctrine_reference: 본문 문맥의 일반화된 윤리적 묘사
- issue: ‘the field’와 ‘the vineyard of the wicked’의 병렬
  chosen_reading: 첫 절은 ‘밭에서’, 둘째 절은 ‘악한 자의 포도원에서’로 대응시켜 두 장소의 병렬성을 살렸습니다.
  alternative_readings:
  - 밭에서 ... 포도원에서
  - 밭에서 ... 그 악한 자의 포도원에서
  rationale: 히브리어는 두 작업 공간을 나란히 배치하므로, 한국어에서도 공간 대비가 분명히 드러나도록 했습니다.
  doctrine_reference: 시적 병행법
