lexical_decisions:
- source_word: עָרוֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은 채로
  alternatives_korean:
  - 나체의
  - 옷이 없는 채로
  lexicon: HALOT
  rationale: עָרוֹם의 기본 뜻은 옷이 없는 상태이며, 한국어에서는 서술적 표현인 ‘벌거벗은 채로’가 현대문체에서 가장 직접적이고 생생합니다.
- source_word: יָלִינוּ
  english_pob_choice: spend the night
  chosen_korean: 밤을 지내며
  alternatives_korean:
  - 밤을 보냅니다
  - 묵습니다
  lexicon: HALOT
  rationale: לין의 핵심은 ‘밤을 지내다/묵다’이므로, 시간의 지속을 살리면서도 문맥의 비참함을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: לְבוּשׁ
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 입을 것
  lexicon: HALOT
  rationale: 일반적 의복을 가리키는 말이므로, 본문에서 가장 자연스럽고 즉각적인 한국어인 ‘옷’으로 옮겼습니다.
- source_word: כְּסוּת
  english_pob_choice: covering
  chosen_korean: 덮을 것
  alternatives_korean:
  - 덮개
  - 가릴 것
  - 덮는 것
  lexicon: HALOT
  rationale: כְּסוּת는 보호를 위한 덮개나 덮을 물건을 가리키므로, 추위로부터 막아 준다는 기능을 살려 ‘덮을 것’으로 옮겼습니다.
theological_decisions:
- issue: 추위를 나타내는 בַּקָּרָה의 처리
  chosen_reading: ‘추위를 막아 줄’로 옮겨 보호의 결핍을 드러냈습니다.
  alternative_readings:
  - ‘추위 속에서’
  - ‘추위 가운데’
  rationale: 문맥상 단순한 위치 표지보다, 아무런 보호도 없다는 비참함이 핵심이므로 POB의 ‘against the cold’ 취지를 따라 기능적으로 옮겼습니다.
  doctrine_reference: 문맥 중심의 서술이며 교리적 쟁점은 없습니다.
