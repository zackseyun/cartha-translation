id: JOB.24.19
reference: Job 24:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
  footnotes:
  - marker: a
    text: Or 'meltwater from snow.' The Hebrew is literally 'waters of snow.'
    reason: lexical_alternative
  - marker: b
    text: '''Sheol'' is the Hebrew term for the realm of the dead; alternatively, ''the grave.'''
    reason: alternative_reading
translation:
  language: ko
  text: 가뭄과 더위도 눈의 물을 빼앗아 갑니다[a]; 그렇게 스올은 죄를 지은 자들을 데려갑니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘눈의 물들’입니다. 문맥상 눈에서 녹은 물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스올’은 히브리어로 죽은 자의 영역을 가리키는 말이며, 경우에 따라 ‘무덤’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  english_pob_choice: drought
  chosen_korean: 가뭄
  alternatives_korean:
  - 메마름
  - 건조함
  - 마른 땅
  lexicon: HALOT
  rationale: 주변의 חֹם(더위)과 병렬을 이루는 아리드한 상태를 한국어에서 자연스럽게 드러내며, 시적 문맥에서도 즉시 이해됩니다.
- source_word: יִגְזְלוּ
  english_pob_choice: snatch away
  chosen_korean: 빼앗아 갑니다
  alternatives_korean:
  - 낚아챕니다
  - 훔쳐 갑니다
  - 빼앗습니다
  lexicon: HALOT
  rationale: 무생물 주어인 가뭄과 더위가 물을 강하게 빼앗는 이미지를 살리되, 한국어 시문맥에서 과도하게 거칠지 않게 옮겼습니다.
- source_word: מֵימֵי שֶׁלֶג
  english_pob_choice: the waters of snow
  chosen_korean: 눈의 물
  alternatives_korean:
  - 눈의 물들
  - 눈물
  - 눈에서 나온 물
  lexicon: HALOT
  rationale: 영어 POB의 직역성을 존중하되 한국어에서는 ‘눈의 물’이 가장 간결하게 원문 이미지를 보존합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 음역하여 유지했고, 전통적 교회어인 ‘음부’는 후대 신학적 함의를 덧씌울 수 있어 피했습니다.
- source_word: חָטָאוּ
  english_pob_choice: those who have sinned
  chosen_korean: 죄를 지은 자들
  alternatives_korean:
  - 죄인들
  - 죄를 범한 사람들
  - 그들이 죄를 지었습니다
  lexicon: HALOT
  rationale: 동사 완료형의 행위를 살리면서도 스올의 목적어가 분명하게 드러나도록 명사화했습니다.
theological_decisions:
- issue: שְׁאוֹל의 의미 보존
  chosen_reading: 스올을 음역하여 ‘죽은 자들의 영역/무덤’으로 단정하지 않고 유지했습니다.
  alternative_readings:
  - 무덤
  - 음부
  - 죽은 자들의 세계
  rationale: 이 절은 시적 비유 안에서 스올을 사용하므로, 원문의 개념적 여지를 지키는 것이 번역상 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 의인화된 주어의 동작
  chosen_reading: 가뭄과 더위가 물을 ‘빼앗아 간다’고 옮겨, 원문의 강한 의인화와 폭력성을 살렸습니다.
  alternative_readings:
  - 말라 없앤다
  - 없앤다
  - 거둬 간다
  rationale: גזל의 강탈 뉘앙스를 약화하지 않기 위해, 단순 소멸보다 탈취 이미지를 유지했습니다.
  doctrine_reference: 시적 수사 보존
