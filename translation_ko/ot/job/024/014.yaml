id: JOB.24.14
reference: Job 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/א֡וֹר יָ֘ק֤וּם רוֹצֵ֗חַ יִֽקְטָל עָנִ֥י וְ/אֶבְי֑וֹן וּ֝/בַ/לַּ֗יְלָה יְהִ֣י כַ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
  footnotes:
  - marker: a
    text: Or 'At the light' / 'With the light'; the Hebrew literally refers to the coming of light, likely daybreak.
    reason: lexical_alternative
  - marker: b
    text: Or 'he murders the poor and needy'; the Hebrew uses a different verb here from 'murderer,' so the main text preserves that distinction with 'kills.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침빛에 살인자는 일어납니다[a]. 그는 가난한 사람과 궁핍한 사람을 죽이고[b], 밤에는 도둑처럼 행동합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛과 함께’, ‘빛이 올 때’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘빛을 향하여/빛에’라는 뜻으로, 해가 비치기 시작하는 때, 곧 새벽이나 아침을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 가난한 사람과 궁핍한 사람을 살해합니다’로 옮길 수 있습니다. 히브리어는 여기서 앞의 ‘살인자’와 다른 동사를 사용하므로, 본문은 그 구별을 살려 ‘죽이고’로 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  english_pob_choice: At dawn
  chosen_korean: 아침빛에
  alternatives_korean:
  - 새벽에
  - 빛이 올 때
  - 동틀 무렵에
  lexicon: HALOT
  rationale: 직역하면 ‘빛을 향하여/빛에’이지만, 문맥상 해가 떠오르는 때를 가리키므로 ‘아침빛에’로 자연스럽게 옮겼습니다.
- source_word: רוֹצֵחַ
  english_pob_choice: the murderer
  chosen_korean: 살인자
  alternatives_korean:
  - 살해자
  - 살인하는 자
  - 살인한 자
  lexicon: HALOT
  rationale: 명사적 분사로서 유형을 지칭하므로, 한국어에서도 행위자를 가리키는 ‘살인자’가 가장 직접적입니다.
- source_word: יִקְטָל
  english_pob_choice: he kills
  chosen_korean: 죽이고
  alternatives_korean:
  - 살해하고
  - 죽입니다
  - 쳐 죽이고
  lexicon: HALOT
  rationale: 앞의 ‘살인자’와 같은 어근을 반복하지 않고, 히브리어가 여기서는 일반 동사 ‘죽이다’를 쓰는 차이를 살려 ‘죽이고’로 옮겼습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 사람과 궁핍한 사람
  alternatives_korean:
  - 가난하고 궁핍한 사람
  - 빈곤한 사람과 궁핍한 사람
  - 가난한 자와 궁핍한 자
  lexicon: HALOT
  rationale: 사회적으로 취약한 두 표현의 병렬을 유지하면서, 현대 한국어에서 두 층위를 분명히 드러내는 표현으로 번역했습니다.
- source_word: כַגַּנָּב
  english_pob_choice: like a thief
  chosen_korean: 도둑처럼 행동합니다
  alternatives_korean:
  - 도둑처럼입니다
  - 도둑처럼 있습니다
  - 도둑처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 살리되, 밤의 행위를 설명하는 문맥상 단순 비유보다 ‘도둑처럼 행동합니다’가 의미를 더 분명히 드러냅니다.
theological_decisions:
- issue: 시적 평행법에서 시간 대비와 행위 대비를 어떻게 살릴지
  chosen_reading: ‘아침빛에’와 ‘밤에는’의 대비를 살리고, 살인과 도둑질의 이중 묘사를 그대로 유지했습니다.
  alternative_readings:
  - 문장을 더 매끄럽게 다듬어 ‘새벽에’와 ‘밤에’로 통일하는 방식
  - 도덕적 평가를 덧붙여 해석하는 방식
  rationale: 본문은 악인의 은밀한 행동을 시간 대비로 그리므로, 해석을 덧붙이기보다 이미지와 평행 구조를 유지하는 편이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 시편적 지혜/탄식 문학의 수사 구조 보존
- issue: ‘도둑처럼’의 종결을 단순 서술로 둘지 행동 표현을 넣을지
  chosen_reading: ‘도둑처럼 행동합니다’로 옮겨 비교의 의미를 살리면서 현재적 상태를 드러냈습니다.
  alternative_readings:
  - ‘도둑처럼입니다’
  - ‘도둑과 같습니다’
  rationale: 히브리어의 כ + 명사 구조는 단순 동일시보다 태도와 행위의 유사성을 나타내므로, 한국어에서는 ‘행동합니다’를 보완해 독자가 문맥을 즉시 이해하도록 했습니다.
  doctrine_reference: 히브리어 비교구문(כ) 의미 보존
