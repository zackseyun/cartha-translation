  - 빛이 올 때
  - 동틀 무렵에
  lexicon: HALOT
  rationale: 직역하면 ‘빛을 향하여/빛에’이지만, 문맥상 해가 떠오르는 때를 가리키므로 ‘아침빛에’로 자연스럽게 옮겼습니다.
- source_word: רוֹצֵחַ
  english_pob_choice: the murderer
  chosen_korean: 살인자
