  - 살인하는 자
  - 살인한 자
  lexicon: HALOT
  rationale: 명사적 분사로서 유형을 지칭하므로, 한국어에서도 행위자를 가리키는 ‘살인자’가 가장 직접적입니다.
- source_word: יִקְטָל
  english_pob_choice: he kills
  chosen_korean: 죽이고
  alternatives_korean:
  - 살해하고
  - 죽입니다
