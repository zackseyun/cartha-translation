id: JOB.24.22
reference: Job 24:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
  footnotes:
  - marker: a
    text: Or, 'he rises up, and he does not trust in life,' or 'he rises up, and he has no assurance of life.' The Hebrew subject in the final clause is ambiguous.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그는 자신의 힘으로 강한 자들을 끌어가고, 그가 일어나면 아무도 생명을 확신하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 일어나면, 그는 생명을 신뢰하지 않습니다’, 혹은 ‘그가 일어나면, 그는 생명에 대한 확신이 없습니다.’ 마지막 절의 히브리어는 주어가 모호합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  english_pob_choice: drags away
  chosen_korean: 끌어가고
  alternatives_korean:
  - 잡아끌고
  - 끌어당기고
  - 빼앗아 가고
  lexicon: HALOT, BDB
  rationale: מָשַׁךְ은 기본적으로 ‘끌다, 잡아끌다’의 뜻이므로, 폭력적·강제적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 ‘끌어가고’로 옮겼습니다.
- source_word: אַבִּירִים
  english_pob_choice: the mighty
  chosen_korean: 강한 자들
  alternatives_korean:
  - 용사들
  - 권세자들
  - 힘센 자들
  lexicon: HALOT, BDB
  rationale: אבירים은 물리적 강함보다 사회적·권력적 힘이 있는 자들을 가리킬 수 있어, 문맥에 맞게 ‘강한 자들’로 옮겨 힘의 우위를 드러냈습니다.
- source_word: בְּכֹחוֹ
  english_pob_choice: by his power
  chosen_korean: 자신의 힘으로
  alternatives_korean:
  - 그의 능력으로
  - 그 힘으로
  lexicon: HALOT, BDB
  rationale: 전치사 בְּ는 수단을 나타내므로 ‘자신의 힘으로’가 가장 자연스럽고, 대명사 접미사도 주어를 분명히 드러내도록 반영했습니다.
- source_word: יָקוּם
  english_pob_choice: he rises up
  chosen_korean: 그가 일어나면
  alternatives_korean:
  - 그가 일어서면
  - 그가 일어나고
  - 그가 일어납니다
  lexicon: HALOT, BDB
  rationale: קום은 단순한 기립보다 ‘일어나 행동하다’의 흐름을 담을 수 있어, 결과를 이어 주는 조건·상황 표현으로 ‘그가 일어나면’이 본문 흐름에 맞습니다.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  english_pob_choice: but he has no assurance of life
  chosen_korean: 아무도 생명을 확신하지 못합니다
  alternatives_korean:
  - 그는 생명을 신뢰하지 않습니다
  - 그는 생명에 대한 확신이 없습니다
  - 아무도 삶을 믿지 못합니다
  lexicon: HALOT, BDB
  rationale: יַאֲמִין은 문자적으로 ‘믿다/신뢰하다’이지만, 문맥상 불안정성과 생명의 불확실성을 나타내므로 POB의 해석을 따라 결과적으로 ‘아무도 생명을 확신하지 못합니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 주어 해석이 모호함
  chosen_reading: 주어를 문맥적으로 일반화하여, 권세자의 등장으로 인해 ‘아무도 생명을 확신하지 못한다’는 결과를 한국어로 분명히 했습니다.
  alternative_readings:
  - 그는 생명을 신뢰하지 않습니다
  - 그는 생명에 대한 확신이 없습니다
  rationale: 히브리어는 마지막 절에서 주어와 술어 관계가 압축되어 있어, 인물 자체의 심리인지 공동체적 불안인지가 문법적으로 열려 있습니다. 본문 전체의 위협적 분위기를 살려 결과를 드러내는 번역이 가장 잘 전달합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
