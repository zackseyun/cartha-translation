  terminology: ‘강한 자들’은 אַבִּירִים의 넓은 의미를 유지하며, ‘생명에 대한 확신’은 בַּחַיִּין의 뜻을 자연스럽게 전달합니다. ‘자기 힘’은 수단을 나타내는 בְּכֹחוֹ를 적절히 반영합니다.
