id: JOB.24.24
reference: Job 24:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
  footnotes:
  - marker: a
    text: Or, 'they are no more.' The Hebrew idiom can be rendered more literally this way.
    reason: lexical_alternative
  - marker: b
    text: Or, 'they are taken away' for 'are gathered up.' The Hebrew verb here is rare and its nuance is debated.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'like the head of an ear of grain.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 잠시 높아졌다가[a] 사라지고, 낮아집니다. 그들은 다른 사람들처럼 모여들고[b], 곡식 이삭의 머리처럼 잘려 나갑니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 더 이상 없다.’ 히브리어 관용구는 더 문자적으로 이렇게 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들은 거두어집니다.’ ‘모여들다’에 해당하는 히브리어 동사는 드물며, 그 뉘앙스는 논쟁적입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘곡식 이삭의 머리처럼’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  english_pob_choice: are exalted a little while
  chosen_korean: 잠시 높아졌다가
  alternatives_korean:
  - 잠깐 높이 올라갔다가
  - 잠시 높임을 받았다가
  lexicon: HALOT
  rationale: 높아짐의 상태와 그 지속 시간이 짧다는 점을 함께 살리기 위해 ‘잠시 높아졌다가’로 옮겼습니다.
- source_word: וְאֵינֶנּוּ
  english_pob_choice: and then they are gone
  chosen_korean: 사라지고
  alternatives_korean:
  - 더 이상 없고
  - 그런 뒤 없고
  lexicon: HALOT
  rationale: 히브리어 관용구가 존재의 소멸을 나타내므로, 한국어에서는 자연스럽게 ‘사라지다’로 처리했습니다.
- source_word: וְהֻמְּכוּ
  english_pob_choice: they are brought low
  chosen_korean: 낮아집니다
  alternatives_korean:
  - 겸손해집니다
  - 끌어내려집니다
  lexicon: HALOT
  rationale: 높아짐과의 대비를 살리면서 신분·상태의 하강을 간결하게 표현했습니다.
- source_word: יִקָּפְצוּן
  english_pob_choice: are gathered up
  chosen_korean: 모여들고
  alternatives_korean:
  - 모아지고
  - 거두어지고
  lexicon: HALOT
  rationale: 드문 동사로서 ‘모이다/거두이다’의 뉘앙스를 보존하되, 문맥상 한데 모여 끝을 맞는 이미지를 살렸습니다.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת יִמָּלוּ
  english_pob_choice: and like the head of a stalk of grain they are cut off
  chosen_korean: 곡식 이삭의 머리처럼 잘려 나갑니다
  alternatives_korean:
  - 곡식 이삭의 끝처럼 잘려 나갑니다
  - 이삭 꼭대기처럼 잘려 나갑니다
  lexicon: HALOT
  rationale: ‘ראשׁ שִׁבֹּלֶת’의 농경 이미지를 현대 독자가 이해할 수 있도록 풀면서, 수확 시 잘림의 비유를 유지했습니다.
theological_decisions:
- issue: 시편적/지혜문학적 운명의 반전 이미지
  chosen_reading: 악인의 일시적 상승과 급작스러운 소멸을 직설적으로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘잠시 번영하다가’로 완화하는 읽기
  - ‘사라지고’ 대신 ‘없어지고’로 평탄화하는 읽기
  rationale: 본문은 상승-소멸-낮아짐-수확의 연쇄를 통해 무상함과 심판의 감각을 강하게 전달하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: Job 24:24의 지혜문학적 관찰과 보응의 역전 주제
- issue: ‘모여들고’의 종말론적/장례적 함의
  chosen_reading: 희귀 동사의 난해함을 특정한 교리적 사건으로 단정하지 않고, 공통의 종결을 향해 한데 모이는 이미지로 남겼습니다.
  alternative_readings:
  - 죽음으로 ‘거두어짐’을 명시하는 읽기
  - 재판을 위해 ‘소집됨’을 강조하는 읽기
  rationale: 히브리어 동사의 의미가 논쟁적이므로, 문맥이 허용하는 범위 안에서 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: 어휘 난해성 보존 및 문맥 중심 해석
