id: JOB.24.13
reference: Job 24:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
  footnotes:
  - marker: a
    text: Or 'They were among the rebels against the light.' The Hebrew verb can be read as past ('were'), but in this poetic context it likely describes an ongoing class of people.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his ways ... his paths'; the suffixes most naturally refer to 'light,' hence 'its ways ... its paths' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 빛을 거역하는 자들 가운데 있습니다[a]. 그 빛의 길들을 알지 못하고[b], 그 빛의 행로들에 머물지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 빛을 거역하는 자들 가운데 있었습니다.’ 히브리어 동사는 과거로도 읽을 수 있지만, 이 시적 문맥에서는 지속적인 부류를 묘사하는 현재적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 길들 … 그의 행로들’입니다. 남성 단수 접미사는 가장 가까운 선행사인 ‘빛’을 가리키는 것으로 이해할 수 있습니다. 한국어 ‘그의’는 남성 인격을 강하게 암시할 수 있어, 여기서는 ‘그 빛의’로 그 지시 대상을 밝혔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: These
  chosen_korean: 이들은
  alternatives_korean:
  - 그들은
  lexicon: HALOT
  rationale: 독립 인칭대명사의 지시적·강조적 힘을 살리기 위해 단순한 ‘그들은’보다 ‘이들은’이 더 적절합니다.
- source_word: בְּמֹרְדֵי
  english_pob_choice: among those who rebel
  chosen_korean: 거역하는 자들 가운데
  alternatives_korean:
  - 반역하는 자들 가운데
  - 반역자들 가운데
  lexicon: HALOT
  rationale: 분사적 의미를 살려 행위성을 드러내고, 전치사 ב의 포함 관계를 ‘가운데’로 자연스럽게 옮겼습니다.
- source_word: דְרָכָיו / בִּנְתִיבֹתָיו
  english_pob_choice: its ways / its paths
  chosen_korean: 그의 길들
  alternatives_korean:
  - 그 길들
  - 그의 길
  - 그의 발자취
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 접미사가 가장 자연스럽게 ‘빛’을 가리키므로, 한국어에서는 인칭화된 소유격 ‘그의’를 유지해 원문의 긴장을 보존했습니다.
- source_word: וְלֹא יָשְׁבוּ
  english_pob_choice: and they do not stay
  chosen_korean: 머물지도 않습니다
  alternatives_korean:
  - 머물지 않습니다
  - 있지도 않습니다
  - 서 있지도 않습니다
  lexicon: HALOT
  rationale: ישב의 ‘거주하다/머물다/머무르다’ 의미를 살리되, ‘길들’과 결합할 때는 현대 한국어의 ‘머물다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 소유 접미사의 지시 대상
  chosen_reading: 접미사는 ‘빛’을 가리키는 것으로 보고, 한국어도 ‘그의 길들/그의 길들에’로 옮겼습니다.
  alternative_readings:
  - ‘그 길들’처럼 무인칭으로 처리하는 방식
  - ‘빛의 길들’로 명시적으로 바꾸는 방식
  rationale: 원문의 문법은 ‘빛’을 가리키는 인격화된 표현과 비인격적 표현 사이의 긴장을 유지합니다. 한국어도 이를 평탄화하지 않고, 소유격을 남겨 원문이 허용하는 모호성을 보존했습니다.
  doctrine_reference: 원문 우선의 번역 원칙과 수사적 긴장 보존
