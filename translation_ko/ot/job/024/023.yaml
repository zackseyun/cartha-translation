  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
  footnotes:
  - marker: a
    text: Hebrew has singular 'to him' and 'he is supported'; the translation renders these collectively as 'them' and 'they' because the verse ends with 'their ways.'
    reason: alternative_reading
  - marker: b
    text: 'Or, more formally: ''He gives him security, and he is supported; his eyes are on their ways.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들에게 안전을 주시고, 그들은 붙들려 있습니다. 그의 눈은 그들의 길 위에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마지막 절에서 복수형 ‘그들의 길’을 사용하므로, 앞부분의 인칭도 집합적으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 더 문자적으로는 ‘그에게 안전을 주시고, 그는 붙들려 있습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבֶטַח
  english_pob_choice: security
  chosen_korean: 안전
  alternatives_korean:
  - 보호
  - 안전 보장
  - 평안
  lexicon: HALOT
  rationale: לָבֶטַח은 ‘안전/보장된 상태’를 뜻하므로, 동사 ‘주시고’와 자연스럽게 결합하는 ‘안전’을 택했습니다.
- source_word: וְיִשָּׁעֵן
  english_pob_choice: they are supported
  chosen_korean: 붙들려 있습니다
  alternatives_korean:
  - 지탱됩니다
  - 의지하고 있습니다
  - 기대고 있습니다
  lexicon: HALOT
  rationale: נִפעל형 שׁען의 결과적·수동적 뜻을 살려, 단순한 ‘의지하다’보다 주어가 외부에서 지탱되는 상태를 드러내는 표현을 사용했습니다.
- source_word: עֵינֵיהוּ
  english_pob_choice: his eyes
  chosen_korean: 그의 눈은
  alternatives_korean:
  - 그의 눈들이
  - 그의 시선은
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 관용적으로 ‘그의 눈은’이 자연스러우며, 감시와 주시의 이미지를 그대로 살릴 수 있습니다.
- source_word: דַּרְכֵיהֶם
  english_pob_choice: their ways
  chosen_korean: 그들의 길 위에
  alternatives_korean:
  - 그들의 길에
  - 그들의 행위 위에
  - 그들의 삶의 길에
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 유지하되, 한국어에서는 ‘길 위에’가 감시의 방향성을 더 분명히 드러냅니다.
theological_decisions:
- issue: 히브리어의 단수·복수 혼용
  chosen_reading: 앞 절은 단수 인칭을 집단적으로 풀기보다, 한국어에서는 ‘그들’로 자연스럽게 공동체적/집합적 의미를 살렸습니다.
  alternative_readings:
  - ‘그에게 안전을 주시고, 그는 붙들려 있습니다’처럼 단수로 유지
  rationale: 끝의 ‘그들의 길’이 복수이므로, 본문이 의도하는 집단적 대상과 감시의 긴장을 한국어에서도 유지하는 것이 더 정확합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
