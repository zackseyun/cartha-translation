  source_fidelity: 히브리어는 앞 두 동사와 그 목적어가 단수형인 반면 마지막 구절은 ‘그들의 길’이라는 복수형입니다. 초안의 집합적 복수 번역은 가능한 해석이지만, 각주 a는 앞부분의 실제 단수 형태를 밝히지 않아 이를 보완해야 합니다. 또한 ‘그들의 길 위에 있습니다’는 עַל의 직역을 한국어에 부자연스럽게 옮긴 표현입니다.
  naturalness: ‘붙들려 있습니다’는 한국어에서 체포되거나 제지된 뜻으로도 쉽게 들립니다. ‘지탱받습니다’가 여기서의 수동적 의미를 더 직접적으로 전달합니다. 마지막 구절은 ‘그의 눈은 그들의 길을 지켜보고 계십니다’로 옮겨 자연스러운 한국어 관용을 살렸습니다.
  terminology: ‘안전’은 לָבֶטַח에 적절합니다. ‘길’은 דַּרְכֵיהֶם의 은유를 보존합니다. 문맥상 신적 주어로 이해되는 ‘그’에는 합쇼체 존대 표현을 유지하되, 본문이 이름을 밝히지 않는 점은 그대로 두었습니다.
