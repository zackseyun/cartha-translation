source:
  edition: WLC
  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
  footnotes:
  - marker: a
    text: Or 'dusk' for 'twilight.' The Hebrew noun can refer to the dim light at day's end, fitting the context of secret sin.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and a concealment of face he puts.' The Hebrew expression means that he covers or disguises his face to avoid recognition.
    reason: lexical_alternative
translation:
  language: ko
  text: 간음하는 자의 눈은 황혼을 기다리며[a] 말하기를 ‘아무 눈도 나를 보지 못하리라’[b] 하고, 얼굴을 가리는 것을 덧씁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어스름’. 히브리어 명사는 해질 무렵의 희미한 빛을 가리킬 수 있으며, 문맥상 은밀한 죄와 잘 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아무 눈도 나를 보지 못하리라’입니다. 이 표현은 들키지 않기 위해 얼굴을 가리거나 변장한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאֵף
  english_pob_choice: adulterer
  chosen_korean: 간음하는 자
  alternatives_korean:
  - 간음자
  - 부정한 자
  lexicon: HALOT
  rationale: 히브리어 분사형은 간음을 일삼는 남성을 가리키므로, 현대 한국어에서는 명사화된 ‘간음하는 자’가 의미와 문체를 가장 자연스럽게 함께 살립니다.
- source_word: נֶשֶׁף
  english_pob_choice: twilight
  chosen_korean: 황혼
  alternatives_korean:
