  - 어스름
  - 저녁 어스름
  lexicon: HALOT
  rationale: 어둑해지는 때를 뜻하는 시어로서 ‘황혼’이 비밀스러운 죄의 분위기와 원문의 시간감을 압축적으로 전달합니다.
- source_word: תְשׁוּרֵנִי
  english_pob_choice: will see me
  chosen_korean: 나를 보지 못하리라
  alternatives_korean:
