  - 나를 알아보지 못하리라
  lexicon: HALOT
  rationale: ‘보다’의 감각을 살리되, 문맥상 노리는 것은 목격과 인식의 차단이므로 부정형으로 자연스럽게 풀어 옮겼습니다.
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  english_pob_choice: he puts a covering over his face
  chosen_korean: 얼굴을 가리는 것을 덧씁니다
  alternatives_korean:
  - 얼굴에 가림막을 씁니다
  - 얼굴을 가리는 것을 둡니다
  - 얼굴을 가려 숨깁니다
  lexicon: HALOT
  rationale: 압축된 히브리어 구문은 얼굴/정체를 숨기기 위한 덮개를 뜻하므로, ‘덧씁니다’로 실제로 위에 덧가리는 동작을 살렸습니다.
theological_decisions:
- issue: 악행의 은폐를 드러내는 서술 방식
  chosen_reading: 직설적인 서술을 유지해, 간음하는 자가 어둠과 가림으로 자신을 숨기려는 죄의 의도를 드러냈습니다.
  alternative_readings:
  - 완곡하게 풀어 죄의 수치를 약하게 표현하는 방식
  - 도덕적 평가를 덜 드러내는 중립적 표현
  rationale: 본문은 단순한 행동 묘사가 아니라 은밀한 죄의 심리를 폭로하므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 죄의 은폐성과 하나님의 감찰에 대한 성경의 일관된 증언
