theological_decisions:
- issue: 악행의 은폐를 드러내는 서술 방식
  chosen_reading: 직설적인 서술을 유지해, 간음하는 자가 어둠과 가림으로 자신을 숨기려는 죄의 의도를 드러냈습니다.
  alternative_readings:
  - 완곡하게 풀어 죄의 수치를 약하게 표현하는 방식
  - 도덕적 평가를 덜 드러내는 중립적 표현
  rationale: 본문은 단순한 행동 묘사가 아니라 은밀한 죄의 심리를 폭로하므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 죄의 은폐성과 하나님의 감찰에 대한 성경의 일관된 증언
