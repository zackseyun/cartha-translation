translation:
  language: ko
  text: 그들은 그들의 줄[a] 사이에서 기름을 짜내고[b], 포도즙 짜는 틀을 밟고도 목마릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘줄/행’ 또는 ‘담장/벽’의 뜻을 가질 수 있어, 여기서는 농경지의 줄지은 구획을 가리키는 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로는 ‘빛나게 하다/기름지게 하다’와 연관되지만, 문맥상 올리브기름을 짜내는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
