  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
  footnotes:
  - marker: a
    text: Or 'their walls' or 'their rows'; the Hebrew term likely refers to the enclosed or terraced agricultural areas where the labor occurs.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'press out oil' is traditionally difficult; literally it is related to 'oil' or 'brightness,' and in context likely refers to extracting olive oil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 줄 사이에서 그들은 기름을 짜내고[a] 포도즙틀을 밟지만[b], 목은 마릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘줄/행’ 또는 ‘담장/벽’의 뜻을 가질 수 있어, 여기서는 농경지의 줄지은 구획을 가리키는 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로는 ‘빛나게 하다/기름지게 하다’와 연관되지만, 문맥상 올리브기름을 짜내는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
