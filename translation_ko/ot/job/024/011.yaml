theological_decisions:
- issue: 노동의 역설적 착취와 갈증의 대비
  chosen_reading: 풍요를 생산하는 자들이 정작 갈증 속에 방치된다는 아이러니를 직설적으로 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 사회적 불평등으로 일반화할 수 있음
  - 갈증을 상징적으로만 처리할 수 있음
  rationale: 본문의 날카로운 사회적 고발을 약화시키지 않기 위해, 생산과 결핍의 대비를 분명하게 유지했습니다.
  doctrine_reference: 성서의 사회정의/착취 비판 문맥
