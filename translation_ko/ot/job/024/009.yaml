    text: ‘젖가슴’은 직역에 가깝고, 다른 가능성으로는 ‘어머니의 젖가슴’이 있습니다. 히브리어 표현이 난해하므로, 여기서는 유아를 폭력적으로 떼어 내는 뜻을 드러내는 데 집중했습니다.
    reason: alternative_reading
