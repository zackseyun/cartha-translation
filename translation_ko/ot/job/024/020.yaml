base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
  footnotes:
  - marker: a
    text: Or, 'the worm finds him sweet.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the wicked man is broken like a tree.' The Hebrew has the abstract noun 'unrighteousness/wickedness,' which may stand for the evildoer.
    reason: alternative_reading
translation:
  language: ko
  text: 태가 그를 잊어버리고, 벌레가 그를 달게 먹습니다.[a] 그는 더 이상 기억되지 않고, 불의는 나무처럼 꺾입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌레가 그를 달게 여긴다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불의한 사람이 나무처럼 꺾인다’라는 뜻일 수 있습니다. 히브리어는 추상명사 ‘불의/불의함’을 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ / רֶחֶם
  english_pob_choice: The womb forgets him
  chosen_korean: 태가 그를 잊어버리고
  alternatives_korean:
  - 어머니의 태가 그를 잊어버리고
  - 자궁이 그를 잊어버리고
  lexicon: WLC + POB audit
  rationale: רֶחֶם은 문자적으로 ‘자궁/태’이지만, 한국어에서는 ‘태’가 시적·신체적 이미지를 더 직접적으로 살리며, 문맥의 냉혹한 버려짐을 압축적으로 전달합니다.
- source_word: רִמָּה
  english_pob_choice: the worm
  chosen_korean: 구더기가
  alternatives_korean:
  - 벌레가
  - 벌레들
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 한국어에서는 무덤 속 부패를 가리키는 ‘구더기’가 문맥상 가장 강하고 자연스럽습니다.
- source_word: מְתָקוֹ
  english_pob_choice: feeds sweetly on him
  chosen_korean: 달게 먹습니다
  alternatives_korean:
  - 달콤하게 먹습니다
  - 그를 달게 여깁니다
  lexicon: HALOT
  rationale: ‘달다’의 맛 이미지를 살려, 구더기가 시체를 ‘달게’ 먹는 역설적 표현을 한국어에서도 보존했습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의는
  alternatives_korean:
  - 불의가
  - 악인은
  - 불의한 자는
  lexicon: HALOT
  rationale: 히브리어는 추상명사이므로 주된 본문은 추상형을 유지했습니다. POB의 주석처럼 이 표현이 불의한 사람을 가리킬 수 있지만, 본문에서는 원형을 살리는 쪽을 택했습니다.
theological_decisions:
- issue: 추상명사 עַוְלָה를 본문에서 어떻게 처리할지
  chosen_reading: ‘불의는 나무처럼 꺾입니다’로 번역해 추상형을 유지했습니다.
  alternative_readings:
  - ‘불의한 사람은 나무처럼 꺾입니다’로 구체화
  - ‘악인은 나무처럼 꺾입니다’로 의역
  rationale: 원문은 추상명사를 사용하며, POB도 그 추상성을 본문에서 유지하고 구체적 인물을 주석으로 열어 둡니다. 한국어 본문도 그 긴장을 보존하는 것이 स्रोत 충실도에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
