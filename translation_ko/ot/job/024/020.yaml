  source_fidelity: 히브리어의 병행 구조와 표현을 대체로 충실히 옮겼습니다. רֶחֶם의 의인화, רִמָּה가 시신을 먹는 이미지, עַוְלָה의 추상형을 모두 보존했습니다. 다만 רִמָּה는 특정 종을 확정하지 않는 말이므로 ‘구더기’보다 ‘벌레’가 원문의 어휘 범위를 더 안전하게 유지합니다.
  naturalness: ‘태가 그를 잊어버리고’와 ‘불의는 나무처럼 꺾입니다’는 현대의 격식 있는 성경 문체에서 가능하며, 종결 표현도 합쇼체에 맞습니다. ‘벌레가 그를 달게 먹습니다’는 원문의 섬뜩한 ‘달다’의 비유를 유지하면서도 자연스럽게 이해됩니다.
  terminology: ‘태’는 רֶחֶם의 직역적·시적 의인화를 보존합니다. עַוְלָה는 본문에서 ‘불의’로 유지하고, 그것이 불의한 사람을 가리킬 수 있다는 해석은 주석으로 처리하는 것이 적절합니다. 각주 표지는 해당 표현 바로 뒤에 놓여야 합니다.
