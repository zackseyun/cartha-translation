  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָתַ֥ר בַּ/חֹ֗שֶׁךְ בָּ֫תִּ֥ים יוֹמָ֥ם חִתְּמוּ לָ֗/מוֹ לֹא יָ֥דְעוּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
  footnotes:
  - marker: a
    text: Or 'he digs through houses in the dark'; the Hebrew verb can more literally mean 'digs through,' likely referring to breaking through walls.
    reason: lexical_alternative
  - marker: b
    text: Or 'they seal themselves up by day.' The Hebrew may emphasize shutting themselves in or concealing themselves during daylight hours.
    reason: lexical_alternative
  - marker: c
    text: '''The light'' may refer literally to daylight, while also carrying a possible moral undertone in the context of the wicked avoiding what is exposed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠 속에서 그들은 집들로 파고듭니다[a]—낮에는 스스로를 가둡니다[b]—그들은 빛을 알지 못합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어둠 속에서 집들을 뚫고 들어갑니다’. 히브리어 동사는 더 문자적으로 ‘파다, 뚫다’의 뜻을 지니며, 벽을 부수는 침입을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낮에 스스로를 봉합니다’. 히브리어는 낮 동안 몸을 숨기거나 닫아 두는 것을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘빛’은 문자적으로는 낮빛을 가리킬 수 있지만, 문맥상 악한 자들이 드러나는 것을 피한다는 도덕적 뉘앙스를 함께 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  english_pob_choice: breaks into
  chosen_korean: 파고듭니다
  alternatives_korean:
  - 들어갑니다
  - 뚫고 들어갑니다
  - 침입합니다
  lexicon: HALOT
  rationale: 히브리어 동사는 벽이나 장벽을 뚫는 침입의 이미지를 지니므로, 단순한 진입보다 ‘파고듭니다’가 그 물리적·범죄적 동작을 더 직접적으로 드러냅니다.
- source_word: בַּחֹשֶׁךְ
  english_pob_choice: in the dark
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 어둠 가운데서
  - 캄캄할 때
  lexicon: HALOT
  rationale: 행동의 시간과 은폐성을 함께 살리기 위해 ‘어둠 속에서’로 옮겼습니다.
- source_word: חִתְּמוּ לָמוֹ
  english_pob_choice: they shut themselves in
  chosen_korean: 스스로를 가둡니다
  alternatives_korean:
  - 스스로를 봉합니다
  - 자기들끼리 숨어듭니다
  - 문을 닫아걸고 있습니다
  lexicon: HALOT
  rationale: 본문은 낮 동안 몸을 숨기고 차단하는 뜻을 가지므로, 반사적 뉘앙스를 살려 ‘스스로를 가둡니다’로 옮겼습니다.
- source_word: לֹא יָדְעוּ אוֹר
  english_pob_choice: they do not know the light
  chosen_korean: 빛을 알지 못합니다
  alternatives_korean:
  - 빛과 친하지 않습니다
  - 빛을 모릅니다
  - 빛을 받아들이지 않습니다
  lexicon: HALOT
  rationale: ‘알다’는 단순 인지가 아니라 관계적 친숙함을 포함할 수 있으므로, 직역을 유지해 ‘빛을 알지 못합니다’로 옮겼습니다.
theological_decisions:
- issue: ‘빛’의 문자적 의미와 도덕적 함의
  chosen_reading: 본문의 1차 의미인 ‘빛’ 자체를 유지하고, 도덕적 함의는 본문이 열어 두는 정도로만 남깁니다.
  alternative_readings:
  - ‘낮’을 명시적으로 풀어 쓰기
  - ‘옳은 것’으로 해석해 옮기기
  rationale: 이 절은 밤의 범죄와 낮의 은폐를 대비하므로 문자적 의미가 우선이지만, ‘빛’이 지닐 수 있는 도덕적 울림도 해소하지 않는 편이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
