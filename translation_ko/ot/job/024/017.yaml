id: JOB.24.17
reference: Job 24:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
  footnotes:
  - marker: a
    text: Or 'For morning is to them all like deep darkness'; the Hebrew order is compact and allows a slightly more literal rendering.
    reason: alternative_reading
  - marker: b
    text: Hebrew צַלְמָוֶת (tsalmaveth) can also be rendered 'shadow of death.' Here it likely means 'deep darkness' or 'gloom' rather than death itself.
    reason: lexical_alternative
  - marker: c
    text: The verb is singular in Hebrew ('he knows/recognizes'), but it likely has a generic sense referring to the wicked as a class; hence the plural in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들 모두에게 아침이 곧 깊은 어둠이기 때문입니다. 그들은 깊은 어둠의 공포를 잘 압니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침은 그들 모두에게 깊은 어둠과 같습니다.’ 히브리어 어순은 압축적이어서 이러한 비교적 번역도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 צַלְמָוֶת는 ‘사망의 그늘’로도 옮길 수 있습니다. 그러나 여기서는 죽음 자체보다 ‘깊은 어둠’ 또는 ‘암흑’을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 단수형(‘그가 안다/알아본다’)이지만, 문맥상 악인들을 한 부류로 가리키는 일반적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְדָּו / לָמוֹ
  english_pob_choice: all / to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 모두에게
  - 함께
  lexicon: HALOT
  rationale: יַחְדָּו의 분배적 뉘앙스와 לָמוֹ의 대상 관계를 자연스럽게 살려, ‘그들에게’로 묶어 표현했습니다. 앞뒤 문맥상 집단 전체를 가리키므로 한국어에서는 중복 어감을 피하는 것이 적절합니다.
- source_word: בֹּקֶר
  english_pob_choice: morning
  chosen_korean: 아침
  alternatives_korean:
  - 새벽
  - 아침때
  lexicon: HALOT
  rationale: 히브리어의 기본 뜻은 ‘아침’이며, ‘깊은 어둠’과의 대비를 선명하게 유지합니다. ‘새벽’은 시간대가 더 좁아져 원문의 일반성을 약화할 수 있습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness
  chosen_korean: 깊은 어둠
  alternatives_korean:
  - 사망의 그늘
  - 캄캄한 어둠
  - 그늘진 죽음
  lexicon: HALOT
  rationale: 욥기 문맥에서는 ‘죽음’보다 ‘짙은/깊은 어둠’의 의미가 더 강하므로, 영어 POB의 선택을 따라 ‘깊은 어둠’으로 옮겼습니다.
- source_word: בַּלְהוֹת
  english_pob_choice: the terrors of
  chosen_korean: 공포를
  alternatives_korean:
  - 두려움을
  - 무서운 일들을
  lexicon: HALOT
  rationale: 복수 명사 ‘공포들/공포의 것들’의 효과를 한국어에서는 자연스러운 단수 목적어로 흡수하되, 뒤의 ‘깊은 어둠’과 연결해 위협적 분위기를 유지했습니다.
theological_decisions:
- issue: 문장 구조상 첫 절의 의미 관계
  chosen_reading: ‘깊은 어둠이 아침이다’라는 역전된 인식을 설명하는 인과문으로 읽었습니다.
  alternative_readings:
  - ‘아침이 그들에게는 깊은 어둠과 같다’라는 비교문
  - ‘깊은 어둠이 그들 모두의 아침이다’라는 보다 직역적인 어순
  rationale: 원문은 압축적이어서 비교와 동일시의 뉘앙스를 둘 다 품지만, 문맥상 악인의 삶이 어둠에 사로잡혔음을 설명하는 진술이므로 한국어에서는 인과적 설명으로 풀었습니다.
  doctrine_reference: 욥기 24장의 악인 묘사 문맥
