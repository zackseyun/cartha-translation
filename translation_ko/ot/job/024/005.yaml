id: JOB.24.5
reference: Job 24:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
  footnotes:
  - marker: a
    text: Or 'the steppe provides food for his young ones.' The Hebrew has singular 'for him' and a final noun that could be rendered 'young ones,' 'children,' or 'boys,' depending on how concretely one takes the image.
    reason: lexical_alternative
  - marker: b
    text: '''Seeking food early'' renders a participle that can also be understood as ''rising early for prey/provision.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 광야의 들나귀들처럼 그들은 자기 일하러 나가며, 먹이를 찾아 이른 아침부터 움직입니다. 광야는 그에게 빵이며, 자식들에게도 그렇습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 ‘그에게’를 보존합니다. 마지막 명사도 ‘자식들/아이들/소년들’로 다양하게 옮길 수 있어, 이미지의 분배적 의미를 열어 둡니다.
    reason: lexical_alternative
  - marker: b
    text: ‘먹이를 찾아 이른 아침부터’는 새벽에 일찍 일어나 먹이/생계를 구하는 동작을 함께 담은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 합쇼체의 직접적인 호소를 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: פְּרָאִים
  english_pob_choice: wild donkeys
  chosen_korean: 들나귀들
  alternatives_korean:
  - 야생 당나귀들
  - 들당나귀들
  lexicon: HALOT
  rationale: 광야의 길들지 않은 나귀를 가리키므로 자연스러운 현대어인 ‘들나귀들’을 택했습니다.
- source_word: בְּפָעֳלָם
  english_pob_choice: to their work
  chosen_korean: 자기 일하러
  alternatives_korean:
  - 그들의 일로
  - 노동하러
  lexicon: HALOT
  rationale: 단순한 ‘일’보다 목적성을 드러내는 ‘~하러’ 구문이 원문의 ‘to their work’에 가깝습니다.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  english_pob_choice: seeking prey early
  chosen_korean: 먹이를 찾아 이른 아침부터 움직입니다
  alternatives_korean:
  - 먹이를 찾으며 이른 아침에 나섭니다
  - 이른 아침부터 먹이를 찾습니다
  lexicon: HALOT
  rationale: ‘טָּרֶף’의 기본 뜻을 살려 ‘먹이’로 두되, 새벽부터 찾는 분주함을 ‘이른 아침부터 움직입니다’로 풀어 한국어 시어를 유지했습니다.
- source_word: עֲרָבָה
  english_pob_choice: the desert
  chosen_korean: 광야
  alternatives_korean:
  - 사막
  - 황무지
  - 스텝
  lexicon: HALOT
  rationale: 이 지형어는 단순한 사막보다 메마른 광야의 전 영역을 포괄하므로, 문맥상 가장 넓고 익숙한 ‘광야’가 적절합니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 비유적 기본 생존 식량을 가리키는 말이므로 관용적 번역어인 ‘빵’을 유지해 이미지의 구체성을 살렸습니다.
- source_word: לַנְּעָרִים
  english_pob_choice: for the children
  chosen_korean: 자식들에게도
  alternatives_korean:
  - 아이들에게도
  - 소년들에게도
  - 젊은이들에게도
  lexicon: HALOT
  rationale: 마지막 명사는 의존하는 자녀/가족을 폭넓게 가리킬 수 있어, 원문의 분배적 의미를 살린 ‘자식들에게도’로 옮겼습니다.
theological_decisions:
- issue: 시편식 비유의 분배적 단수 לוֹ 처리
  chosen_reading: ‘그에게’의 단수를 유지하되, 뒤의 복수 대상에도 자연스럽게 걸리도록 ‘자식들에게도 그렇습니다’로 마무리했습니다.
  alternative_readings:
  - 단수를 복수로 평준화하여 ‘그들에게’라고 옮김
  - 대표 단수로 보고 각 개인에 분배되는 의미를 유지함
  rationale: 히브리어 본문은 단수 לוֹ를 보존하면서도 마지막 명사는 복수입니다. 한국어에서는 문법적 충돌을 줄이되, 원문의 분배적·대표적 긴장을 잃지 않는 방식이 필요했습니다.
  doctrine_reference: 시적 문맥의 문법-의미 보존
- issue: ‘טָּרֶף’의 의미를 먹이로 유지
  chosen_reading: ‘먹이’로 옮겨 생존을 위한 조달 행위를 드러냈습니다.
  alternative_readings:
  - ‘희생물’로 옮김
  - ‘공물’로 옮김
  - ‘사냥감’으로 옮김
  rationale: 문맥은 동물 사냥의 이미지이지만, 여기서는 가난하고 척박한 삶의 생계 확보를 묘사하므로 ‘먹이’가 가장 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
