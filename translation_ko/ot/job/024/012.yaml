  rationale: מִן + עיר는 출발점뿐 아니라 소리가 들려오는 근원을 나타낼 수 있어, 한국어에서는 자연스러운 위치 표현인 ‘성읍에서’로 옮겨 원문의 장면을 살렸습니다.
- source_word: מְתִים
