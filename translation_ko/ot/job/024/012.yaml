  lexicon: HALOT
  rationale: 이 어형은 ‘사람들’로도 이해될 수 있지만, 바로 뒤의 ‘죽임당한 이들’과 평행을 이루므로 죽음의 위기에 있는 사람으로 옮기는 것이 문맥에 더 적합합니다.
- source_word: תְּשַׁוֵּעַ
  english_pob_choice: cries out for help
  chosen_korean: 도움을 외치지만
  alternatives_korean:
