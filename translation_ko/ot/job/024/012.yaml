  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
  footnotes:
  - marker: a
    text: Or 'In the city men groan'; the Hebrew מְתִים is difficult here, and some take it in the sense of 'men' rather than 'the dying.'
    reason: lexical_alternative
  - marker: b
    text: Or 'yet God does not regard it as folly' or 'yet God does not lay blame.' The Hebrew idiom is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 성읍에서 죽어 가는 자들이 신음하고, 죽임당한 이들의 혼이 도움을 외치지만, 하나님은 그것을 어리석음으로 여기지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְתִים은 여기서 ‘사람들’로도 이해될 수 있어, ‘죽어 가는 자들’ 대신 ‘성읍에서 사람들이 신음한다’로 옮길 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘하나님은 그것을 어리석음으로 여기지 않으십니다’ 외에도 ‘하나님은 그것을 잘못으로 여기지 않으십니다’ 또는 ‘주의하지 않으십니다’로 옮길 수 있습니다.
    reason: alternative_reading
