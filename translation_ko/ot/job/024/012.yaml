  - marker: b
    text: Or 'yet God does not regard it as folly' or 'yet God does not lay blame.' The Hebrew idiom is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 성읍에서 죽어 가는 자들이[a] 신음하고, 죽임당한 이들의 영혼이 도움을 부르짖지만, 하나님은 이를 어리석은 일로 여기지 않으십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְתִים은 여기서 ‘사람들’로도 이해될 수 있어, ‘죽어 가는 자들’ 대신 ‘성읍에서 사람들이 신음한다’로 옮길 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 히브리어 관용구는 난해합니다. ‘하나님은 이를 어리석은 일로 여기지 않으십니다’ 외에 ‘하나님은 이를 잘못으로 여기지 않으십니다’ 또는 ‘하나님은 이를 부당한 일로 돌리지 않으십니다’로 옮길 수 있습니다.
    reason: alternative_reading
