  lexicon: HALOT
  rationale: 동사의 핵심은 절박한 부르짖음이며, 한국어에서는 목적어를 보충해 ‘도움을 외치다’로 풀어야 원문의 도움 요청 성격이 분명해집니다.
- source_word: תִּפְלָה
  english_pob_choice: does not regard it as folly
  chosen_korean: 그것을 어리석음으로 여기지 않으십니다
  alternatives_korean:
  - 그것을 어리석은 일로 여기지 않으십니다
  - 그것을 잘못으로 여기지 않으십니다
  - 그것을 죄로 여기지 않으십니다
  lexicon: HALOT
  rationale: תִּפְלָה는 법정적 ‘잘못’보다 ‘어리석음/부조리’ 쪽이 더 가깝기 때문에, 하나님이 이 현실을 도덕적·지혜론적 무의미로 처리하지 않으신다는 긴장을 살려 옮겼습니다.
theological_decisions:
- issue: 하나님의 무응답처럼 보이는 결말의 긴장 유지
  chosen_reading: 하나님은 그것을 어리석음으로 여기지 않으십니다
  alternative_readings:
  - 하나님은 그것을 잘못으로 여기지 않으십니다
  - 하나님은 그것을 주의하지 않으십니다
  rationale: 이 구절은 하나님의 정의를 부정하기보다, 욥이 체감하는 불의와 무응답의 긴장을 그대로 드러냅니다. 한국어도 그 긴장을 해소하지 않고 유지하는 쪽이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
