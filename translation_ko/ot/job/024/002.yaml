  lexicon: HALOT
  rationale: 문맥상 추상적 ‘경계’보다 토지 경계를 표시하는 물리적 표지를 가리키므로, 현대 한국어에서 가장 직접적인 ‘경계표’로 옮겼습니다.
- source_word: יַשִּׂ֑יגוּ
  english_pob_choice: move
