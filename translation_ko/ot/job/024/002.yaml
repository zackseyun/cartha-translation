  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
  footnotes:
  - marker: a
    text: Or 'remove boundary markers.' The Hebrew verb can denote shifting or removing property markers to encroach on another's land.
    reason: lexical_alternative
  - marker: b
    text: Or 'they steal a flock and shepherd it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 경계표를 옮기고[a], 양 떼를 빼앗아 그 떼를 먹입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경계표를 없애고.’ 히브리어 동사는 경계표를 옮기거나 제거하여 남의 땅을 침범하는 뜻이 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘양 떼를 훔쳐 목양합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: גְּבֻל֥וֹת
  english_pob_choice: boundary markers
  chosen_korean: 경계표
  alternatives_korean:
  - 경계선
  - 지계석
  - 경계 표시
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘경계’보다 토지 경계를 표시하는 물리적 표지를 가리키므로, 현대 한국어에서 가장 직접적인 ‘경계표’로 옮겼습니다.
- source_word: יַשִּׂ֑יגוּ
  english_pob_choice: move
  chosen_korean: 옮기고
  alternatives_korean:
  - 없애고
  - 밀어내고
  - 이동시키고
  lexicon: HALOT
  rationale: 경계표를 다른 곳으로 ‘움직여’ 침범하는 뉘앙스를 살리기 위해 ‘옮기고’를 택했습니다. 완전히 제거한다는 뜻으로 좁히지 않으려 했습니다.
- source_word: גָּ֝זְל֗וּ
  english_pob_choice: they seize
  chosen_korean: 빼앗아
  alternatives_korean:
  - 훔쳐
  - 강탈해
  - 탈취해
  lexicon: HALOT
  rationale: ‘빼앗다’는 강제적·부당한 취득을 드러내면서도, 단순 은닉 절도보다 넓은 폭력을 포함해 원문의 동사를 잘 반영합니다.
- source_word: וַ/יִּרְעֽוּ
  english_pob_choice: and pasture it
  chosen_korean: 그 떼를 먹입니다
  alternatives_korean:
  - 그것을 풀 먹입니다
  - 그것을 치며 기릅니다
  - 그것을 목양합니다
  lexicon: HALOT
  rationale: 동사는 ‘먹이다’보다 본래 ‘초지에 풀리게 하다/먹이다’의 의미가 있어, 탈취한 양 떼를 자기 것처럼 계속 돌보는 아이러니를 한국어로 자연스럽게 드러내기 위해 ‘먹입니다’로 옮겼습니다.
theological_decisions:
- issue: 부당한 토지 침탈과 가축 약탈의 병렬 표현
  chosen_reading: 경계표를 옮기는 행위와 양 떼를 빼앗아 돌보는 행위를 병렬로 유지했습니다.
  alternative_readings:
  - 경계표를 없애고
  - 양 떼를 훔치고
  rationale: 본문의 고발은 단순 도둑질이 아니라 토지 경계 침해와 약탈을 함께 묶어 불의의 구조를 드러내므로, 두 행위를 모두 분명히 보존했습니다.
  doctrine_reference: 잠 22:28; 신 19:14
