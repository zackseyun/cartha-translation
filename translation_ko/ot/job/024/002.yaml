  chosen_reading: 경계표를 옮기는 행위와 양 떼를 빼앗아 돌보는 행위를 병렬로 유지했습니다.
  alternative_readings:
  - 경계표를 없애고
  - 양 떼를 훔치고
  rationale: 본문의 고발은 단순 도둑질이 아니라 토지 경계 침해와 약탈을 함께 묶어 불의의 구조를 드러내므로, 두 행위를 모두 분명히 보존했습니다.
  doctrine_reference: 잠 22:28; 신 19:14
