id: JOB.24.18
reference: Job 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
  footnotes:
  - marker: a
    text: Or 'He is light upon the face of the waters'; the Hebrew is difficult, and some take the opening as describing transience rather than speed.
    reason: lexical_alternative
  - marker: b
    text: Hebrew is difficult; some read 'his portion in the land is cursed' instead of 'their portion in the land is cursed.'
    reason: textual_variant
  - marker: c
    text: Or 'he does not turn to the road of the vineyards,' possibly meaning he no longer returns to cultivated land or prosperous places.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 물 위를 재빠르게 지나갑니다[a]. 그들이 땅에서 차지한 몫은 저주받고[b], 그는 포도원 길로는 돌이키지 않습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 물 위에서 가볍습니다.’ 히브리어가 어려워서, 어떤 해석은 이 첫 구절을 속도보다 덧없음의 묘사로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어가 어렵습니다. 어떤 본문 이해는 ‘그가 땅에서 차지한 몫은 저주받는다’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘포도원들의 길로 돌이키지 않는다’로도 옮길 수 있으며, 이는 더 이상 경작지나 번영한 곳으로 돌아가지 않는다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַֽל
  english_pob_choice: swift
  chosen_korean: 빠르게 지나갑니다
  alternatives_korean:
