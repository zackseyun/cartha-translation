id: JOB.24.18
reference: Job 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
  footnotes:
  - marker: a
    text: Or 'He is light upon the face of the waters'; the Hebrew is difficult, and some take the opening as describing transience rather than speed.
    reason: lexical_alternative
  - marker: b
    text: Hebrew is difficult; some read 'his portion in the land is cursed' instead of 'their portion in the land is cursed.'
    reason: textual_variant
  - marker: c
    text: Or 'he does not turn to the road of the vineyards,' possibly meaning he no longer returns to cultivated land or prosperous places.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 물 위를 빠르게 지나갑니다[a]. 그들의 몫은 땅에서 저주를 받으며[b], 그는 포도원으로 가는 길로는 돌이키지 않습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 얼굴 위에서 가볍다’로도 옮길 수 있습니다. 히브리어가 어려워서, 어떤 해석은 이 첫 구절을 속도보다 덧없음의 묘사로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어가 어렵습니다. 어떤 본문 이해는 ‘땅에서 그의 몫은 저주를 받는다’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘포도원들의 길로 돌이키지 않는다’로도 옮길 수 있으며, 이는 더 이상 경작지나 번영한 곳으로 돌아가지 않는다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַֽל
  english_pob_choice: swift
  chosen_korean: 빠르게 지나갑니다
  alternatives_korean:
  - 가볍습니다
  - 민첩합니다
  - 재빠릅니다
  lexicon: HALOT
  rationale: 물 위에서의 움직임이라는 문맥을 살려 속도와 덧없음을 함께 암시하는 표현으로 옮겼습니다.
- source_word: תְּקֻלַּ֣ל
  english_pob_choice: is cursed
  chosen_korean: 저주를 받으며
  alternatives_korean:
  - 저주받으며
  - 저주를 받습니다
  - 저주를 당하며
  lexicon: HALOT
  rationale: Pual의 수동적 의미를 살려 ‘저주를 받다’로 옮겼고, 문맥상 이어지는 절을 자연스럽게 연결하기 위해 연결형을 사용했습니다.
- source_word: חֶלְקָתָם בָּאָרֶץ
  english_pob_choice: their portion in the land
  chosen_korean: 그들의 몫은 땅에서
  alternatives_korean:
  - 그들의 몫은 이 땅에서
  - 그들의 기업은 땅에서
  - 그의 몫은 땅에서
  lexicon: HALOT
  rationale: ‘몫’으로 חלק의 분배·소유 이미지를 살렸고, ‘땅에서’로 land의 소유 공간을 간결하게 반영했습니다.
- source_word: דֶּרֶךְ כְּרָמִים
  english_pob_choice: the way of the vineyards
  chosen_korean: 포도원으로 가는 길
  alternatives_korean:
  - 포도원의 길
  - 포도밭의 길
  - 포도원 길
  lexicon: HALOT
  rationale: 직역의 이미지와 한국어 가독성 사이에서 균형을 맞추어, 정착과 번영의 장소를 가리키는 길로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 문장의 주어와 소유 대명사 처리
  chosen_reading: 문맥상 인간 일반을 가리키는 익명적 진술로 보고 ‘그들/그’의 병치를 그대로 살렸습니다.
  alternative_readings:
  - ‘그의 몫은’으로 단수화
  - ‘사람은’으로 일반화
  rationale: 히브리어 본문과 POB 주석 모두에서 수/인칭이 어렵기 때문에, 문법적 불확실성을 평탄화하지 않고 본문의 긴장을 유지했습니다.
  doctrine_reference: 텍스트 비평/해석학적 겸손
