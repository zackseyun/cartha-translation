  source_fidelity: 첫 구절의 ‘물 위를 빠르게 지나갑니다’는 קַל의 문맥상 가능한 ‘빠름’을 자연스럽게 반영합니다. 다만 ‘그들의 몫은 땅에서 저주를 받으며’는 בָּאָרֶץ가 ‘몫’에 걸리는 관계를 한국어에서 다소 불분명하게 만들고, ‘포도원으로 가는 길’은 원문의 ‘포도원들의 길’보다 목적지를 명시하는 해석을 더합니다.
  naturalness: 합쇼체는 일관되지만, 둘째 절의 ‘땅에서 저주를 받으며’는 어색하고 의미 관계가 흐립니다. ‘그들이 땅에서 차지한 몫은 저주받고’가 더 자연스럽고 원문의 소유·분배 이미지를 잘 드러냅니다.
  terminology: ‘몫’, ‘저주받고’, ‘돌이키지 않습니다’는 적절합니다. ‘포도원 길’은 직역적 이미지를 유지하면서도 현대 한국어에서 자연스럽습니다. 수의 불확실성은 본문과 각주에서 유지합니다.
