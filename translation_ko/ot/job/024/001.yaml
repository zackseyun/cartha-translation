  terminology: שַׁדַּי는 욥기에서 통상적인 명칭인 ‘전능자’로 유지합니다. ‘그분의 날들’은 복수형과 시적 모호성을 보존하며, 각주에서 가능한 심판·개입의 의미만 제시합니다.
