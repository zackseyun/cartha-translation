  lexicon: HALOT
  rationale: 복수형 ‘날들’을 그대로 살려 하나님이 개입하시고 판단하시는 여러 시기를 가리킬 수 있는 시적 여지를 유지했습니다.
theological_decisions:
- issue: ‘그분의 날들’의 의미를 구체화할지 여부
  chosen_reading: 본문의 압축성을 유지해 ‘그분의 날들’로 두고, 심판이나 개입의 날로 단정하지 않았습니다.
  alternative_readings:
  - 심판의 날들
  - 개입하시는 때들
  - 정하신 날들
  rationale: 히브리어는 의도적으로 함축적이므로, 지나치게 해석을 좁히면 욥기의 항의적 질문이 약해집니다. 본문이 허용하는 긴장을 그대로 남겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
