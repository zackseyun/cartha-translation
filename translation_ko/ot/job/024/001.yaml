    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 때들이 전능자에게 숨겨져 있지 않은데도, 그분을 아는 이들은 그분의 날들을 보지 못합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어찌하여 전능자께서 때들을 간직해 두지 않으십니까?’ 히브리어의 표현은 ‘때들’을 전능자에게 숨겨져 있지 않은 것으로 이해할 수도, 전능자가 간직해 두지 않으시는 것으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분의 날들’은 하나님이 행동하시거나 심판하시는 때들을 가리킬 수 있습니다.
    reason: theological_note
