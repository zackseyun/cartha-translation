base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
  footnotes:
  - marker: a
    text: Or 'appointed times'; the line may mean, 'Why are appointed times not reserved by the Almighty?'
    reason: lexical_alternative
  - marker: b
    text: '''His days'' likely refers to the days when God acts in judgment or intervention.'
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 전능자 앞에서 때가 정해져 있지 않으며, 그분을 아는 이들이 그분의 날들을 보지 못합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때’는 ‘정해진 때, 지정된 시기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분의 날들’은 하나님이 일하시는 날들, 곧 개입이나 심판의 때를 가리킬 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 히브리어의 질문 어조와 욥의 항의적 뉘앙스를 살리면서도, 합쇼체 문장에서 자연스럽고 격조 있게 들리도록 했습니다.
- source_word: מִשַּׁדַּי
  english_pob_choice: by the Almighty
  chosen_korean: 전능자 앞에서
  alternatives_korean:
  - 전능자에 의해
  - 전능자께
  - 전능자에게서
  lexicon: HALOT
  rationale: מִ의 관계를 단순 수동 주체로만 처리하기보다, 하나님에게 속한 통제권/기준 아래 있다는 뜻을 한국어로 자연스럽게 드러내기 위해 ‘앞에서’를 택했습니다.
- source_word: נִצְפְּנוּ עִתִּים
  english_pob_choice: times are kept
  chosen_korean: 때가 정해져 있지 않으며
  alternatives_korean:
  - 때가 지켜져 있지 않으며
  - 때가 간직되어 있지 않으며
  - 때가 예비되어 있지 않으며
  lexicon: HALOT
  rationale: צפן의 ‘간직하다/저장하다/보관하다’ 의미를 한국어에서 문맥상 맞게 풀어, 단순한 비유가 아니라 하나님이 때를 배정하고 보류하시는 뜻을 반영했습니다.
- source_word: וְיֹדְעָיו לֹא חָזוּ יָמָיו
  english_pob_choice: those who know him not see his days
  chosen_korean: 그분을 아는 이들이 그분의 날들을 보지 못합니까
  alternatives_korean:
  - 그분을 아는 이들이 그분의 날을 보지 못합니까
  - 그분을 아는 자들이 그분의 날들을 보지 못합니까
  lexicon: HALOT
  rationale: 복수형 ‘날들’을 그대로 살려 하나님이 개입하시고 판단하시는 여러 시기를 가리킬 수 있는 시적 여지를 유지했습니다.
theological_decisions:
- issue: ‘그분의 날들’의 의미를 구체화할지 여부
  chosen_reading: 본문의 압축성을 유지해 ‘그분의 날들’로 두고, 심판이나 개입의 날로 단정하지 않았습니다.
  alternative_readings:
  - 심판의 날들
  - 개입하시는 때들
  - 정하신 날들
  rationale: 히브리어는 의도적으로 함축적이므로, 지나치게 해석을 좁히면 욥기의 항의적 질문이 약해집니다. 본문이 허용하는 긴장을 그대로 남겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
