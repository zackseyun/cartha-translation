translation:
  language: ko
  text: 그들은 궁핍한 사람들을 길에서 밀어내고, 땅의 가난한 사람들은 함께 숨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַטּוּ
  english_pob_choice: turn ... off
  chosen_korean: 밀어내고
  alternatives_korean:
  - 돌려세우고
  - 비켜나게 하고
  - 길에서 밀쳐내고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 억압적 상황에서 사람을 길 밖으로 내모는 장면을 한국어로 자연스럽게 드러내기 위해 ‘밀어내고’를 택했습니다.
- source_word: אֶבְיוֹנִים
  english_pob_choice: the needy
  chosen_korean: 궁핍한 사람들
  alternatives_korean:
  - 가난한 사람들
  - 빈궁한 사람들
  - 궁핍한 이들
  lexicon: HALOT
  rationale: אביונים은 단순한 빈곤보다 생계가 절박한 취약층을 가리키므로, 기존의 ‘가난한’보다 약간 더 구체적인 ‘궁핍한 사람들’이 어감상 잘 맞습니다.
- source_word: מִדָּרֶךְ
  english_pob_choice: off the road
  chosen_korean: 길에서
  alternatives_korean:
  - 길 밖으로
  - 길에서 벗어나
  - 도로에서
  lexicon: HALOT
  rationale: דרך의 문자적 이미지가 공공의 이동로라는 점을 살려 ‘길에서’로 옮기되, 동사 ‘밀어내다’와 결합해 추방의 뉘앙스를 자연스럽게 전달했습니다.
- source_word: עֲנִיֵּי אָרֶץ
  english_pob_choice: the poor of the land
  chosen_korean: 땅의 가난한 사람들
  alternatives_korean:
  - 땅의 궁핍한 사람들
  - 그 땅의 가난한 이들
  - 땅의 가난한 자들
  lexicon: HALOT
  rationale: ‘땅’은 여기서 추상적 ‘지구’보다 공동체 내부의 삶의 자리로 읽는 것이 적절하므로, 영어 POB의 ‘land’를 따라 ‘땅의 가난한 사람들’로 옮겼습니다.
