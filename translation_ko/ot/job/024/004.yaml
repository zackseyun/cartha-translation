review_pass:
  verdict: revise
  source_fidelity: יַטּוּ is a Hiphil causative (‘cause to turn aside’); ‘밀어내고’ can fit the oppressive context but more strongly suggests forcible expulsion and does not explicitly retain the turning-aside sense. The Pual חֻבְּאוּ may be expressed idiomatically in Korean as ‘몸을 숨깁니다,’ without asserting a doctrinal or otherwise extraneous nuance. ‘함께’/‘모두’ appropriately represents יַחַד.
  naturalness: The draft is generally clear and uses formal-polite verb endings, but ‘땅의 가난한 사람들’ is somewhat stiff and literal in modern Korean. ‘궁핍한 이들’ and ‘땅의 가난한 이들’ are more concise and natural in this formal biblical register. ‘모두 몸을 숨깁니다’ also reads more idiomatically than the bare ‘함께 숨습니다.’
  terminology: ‘궁핍한’ suitably distinguishes אֶבְיוֹנִים from the following עֲנִיֵּי, while ‘가난한 이들’ is an acceptable restrained rendering of the latter. No theological terminology is involved.
  issues:
  - severity: medium
    issue: ‘밀어내고’ over-specifies the action of יַטּוּ.
    rationale: The Hebrew Hiphil primarily conveys causing the needy to turn aside from the way. Although coercion is contextually likely, a Korean expression retaining the causative turning-aside image is closer to the source.
  - severity: low
    issue: ‘땅의 가난한 사람들’ is awkwardly literal.
    rationale: The genitive construction is understandable, but ‘땅의 가난한 이들’ is more natural in modern formal Korean and retains the source’s ‘poor of the land’ wording.
  revised_text: 그들은 궁핍한 이들을 길에서 비켜나게 하고, 땅의 가난한 이들은 모두 몸을 숨깁니다.
  revised_footnotes: []
  revision_rationale: ‘길에서 비켜나게 하고’ preserves the causative force and the road/way image without making physical violence explicit beyond the Hebrew. The second clause retains the collective sense of יַחַד in idiomatic formal Korean and uses a natural expression for the poor hiding themselves.
