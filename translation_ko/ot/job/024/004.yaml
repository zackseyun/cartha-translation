- from: 그들은 궁핍한 사람들을 길에서 밀어내고, 땅의 가난한 사람들은 함께 숨습니다.
  to: 그들은 궁핍한 이들을 길에서 비켜나게 하고, 땅의 가난한 이들은 모두 몸을 숨깁니다.
  rationale: ‘길에서 비켜나게 하고’ preserves the causative force and the road/way image without making physical violence explicit beyond the Hebrew. The second clause retains the collective sense of יַחַד in idiomatic formal Korean and uses a natural expression for the poor hiding themselves.
  reviewer_model: gpt-5.6-terra
