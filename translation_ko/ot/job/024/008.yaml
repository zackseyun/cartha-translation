  text: מִ/זֶּ֣רֶם הָרִ֣ים יִרְטָ֑בוּ וּֽ/מִ/בְּלִ֥י מַ֝חְסֶ֗ה חִבְּקוּ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
  footnotes:
  - marker: a
    text: Or 'They are wet from the mountain torrent' or 'from the storm-rain of the mountains.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they embrace the rock,' that is, they cling to it for shelter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 산비로 젖어 있습니다[a]. 피할 곳이 없어서[b] 바위에 몸을 웅크립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산골짜기의 급류에 젖어 있습니다’, 혹은 ‘산의 폭풍비에 젖어 있습니다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바위를 껴안습니다’이며, 곧 피난처로 바위에 달라붙는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  english_pob_choice: by the mountain rains
  chosen_korean: 산비로
  alternatives_korean:
  - 산의 폭우로
  - 산에서 오는 소나기로
  - 산의 소낙비로
  lexicon: HALOT
  rationale: זֶרֶם의 강한 비/쏟아지는 물의 뜻을 살리되, 한국어에서는 자연스럽고 압축적으로 ‘산비’로 옮겨 산지의 거센 강우 이미지를 전달했습니다.
- source_word: יִרְטָבוּ
  english_pob_choice: they are drenched
  chosen_korean: 젖어 있습니다
  alternatives_korean:
  - 흠뻑 젖어 있습니다
  - 완전히 젖어 있습니다
  - 흠뻑 젖습니다
  lexicon: HALOT
  rationale: 동사의 상태적 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘젖어 있습니다’로 옮겼고, 앞의 산비와 결합해 상황의 노출을 드러냈습니다.
- source_word: מַחְסֶה
  english_pob_choice: shelter
  chosen_korean: 피할 곳
  alternatives_korean:
  - 쉼터
  - 피난처
  - 은신처
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘피난처’보다 비를 피하는 물리적 공간을 가리키므로, 실제 독해에 즉각적인 ‘피할 곳’이 가장 잘 맞습니다.
- source_word: חִבְּקוּ צוּר
  english_pob_choice: they embrace the rock
  chosen_korean: 바위에 몸을 웅크립니다
  alternatives_korean:
  - 바위를 껴안습니다
  - 바위에 매달립니다
  - 바위에 달라붙습니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘껴안다’가 가능하지만, 여기서는 피난을 위해 바위에 바짝 붙는 행위를 한국어로 더 생생하게 드러내기 위해 ‘몸을 웅크리다’로 풀었습니다.
theological_decisions:
- issue: 노출된 가난한 자들이 자연재해 속에서 생존을 위해 바위에 의지하는 장면의 표현 강도
  chosen_reading: ‘피할 곳이 없어서 바위에 몸을 웅크립니다’로 옮겨, 단순한 서술이 아니라 생존을 위한 절박한 의지를 드러냈습니다.
  alternative_readings:
  - ‘바위를 껴안습니다’
  - ‘바위에 달라붙습니다’
  rationale: 본문의 물리적 절박함을 약화시키지 않으면서도, 한국어에서 부자연스러운 직역을 피하는 균형을 택했습니다.
  doctrine_reference: 문맥에 따른 직역-의역 조정
