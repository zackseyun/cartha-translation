  lexicon: HALOT
  rationale: 문맥상 추상적 ‘피난처’보다 비를 피하는 물리적 공간을 가리키므로, 실제 독해에 즉각적인 ‘피할 곳’이 가장 잘 맞습니다.
- source_word: חִבְּקוּ צוּר
  english_pob_choice: they embrace the rock
  chosen_korean: 바위에 몸을 웅크립니다
  alternatives_korean:
