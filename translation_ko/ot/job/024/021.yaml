base_translation:
  language: en
  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
  footnotes:
  - marker: a
    text: Or 'feeds on the barren woman'; the Hebrew verb is literally 'pastures/feeds,' but in context it likely has a predatory sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아이를 낳지 못하는 여인을 먹이로 삼고, 과부에게는 아무런 선도 베풀지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이를 낳지 못하는 여인을 먹고’로 옮길 수 있습니다. 히브리어 동사는 문자적으로는 ‘먹이다/목양하다’라는 뜻이지만, 이 문맥에서는 포식적으로 착취한다는 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  english_pob_choice: preys on
  chosen_korean: 노리고
  alternatives_korean:
  - 먹이로 삼고
  - 목양하고
  - 먹어치우고
  lexicon: HALOT
  rationale: 기본 뜻은 ‘기르다/먹이다’이지만, 이 문맥에서는 약자를 착취하는 포식적 의미가 분명하므로 ‘노리다’가 POB의 ‘preys on’을 자연스럽게 반영합니다.
- source_word: עֲקָרָה לֹא תֵלֵד
  english_pob_choice: the barren woman who does not bear
  chosen_korean: 아이를 낳지 못하는 여인
  alternatives_korean:
  - 불임의 여인
  - 아이를 낳지 않는 여인
  - 아이를 낳을 수 없는 여인
  lexicon: HALOT
  rationale: 히브리어의 ‘불임인 여자’와 ‘낳지 못함’을 함께 살리되, 한국어에서는 성격을 분명히 드러내는 ‘아이를 낳지 못하는 여인’이 가장 직설적이고 자연스럽습니다.
- source_word: לֹא יְיֵטִיב
  english_pob_choice: does no good to
  chosen_korean: 아무 선도 행하지 않습니다
  alternatives_korean:
  - 좋은 일을 하지 않습니다
  - 도움을 주지 않습니다
  - 좋게 대하지 않습니다
  lexicon: HALOT
  rationale: 힙힐의 ‘선을 행하다/좋게 하다/유익을 주다’라는 폭을 살리면서, 단순한 친절보다 도덕적 선행의 부재를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 약자 착취를 나타내는 동사의 뉘앙스
  chosen_reading: 단순히 ‘먹이다/기르다’로 중화하지 않고, 본문이 고발하는 폭력적 착취를 드러냈습니다.
  alternative_readings:
  - 목양하다
  - 먹이다
  - 기르다
  rationale: 문맥상 의인은 돌보는 자가 아니라 약자를 해치는 자로 묘사되므로, 독자가 사회적·도덕적 역전을 바로 이해하도록 ‘노리다’로 처리했습니다.
  doctrine_reference: 문맥 우선의 직역 원칙
- issue: ‘과부’에 대한 행위의 부정
  chosen_reading: ‘아무 선도 행하지 않습니다’로 번역해 히브리어의 일반적 선행 부정을 유지했습니다.
  alternative_readings:
  - 과부를 잘 대하지 않습니다
  - 과부에게 도움을 주지 않습니다
  rationale: 본문은 과부에게 특별한 악행을 넘어서 ‘선함’ 자체가 없음을 말하므로, 행위의 결핍을 넓게 포착하는 표현이 적합합니다.
  doctrine_reference: 히브리어 יטב의 일반적 의미 범위
