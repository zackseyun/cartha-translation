base_translation:
  language: en
  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
  footnotes:
  - marker: a
    text: Or 'refute me and reduce my speech to nothing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않다면, 누가 내가 거짓말을 한다고 입증하고 내 말을 아무것도 아닌 것으로 만들겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 반박하고 내 말을 무효로 만들다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא אֵפוֹ
  english_pob_choice: And if it is not so ... then
  chosen_korean: 그렇지 않다면
  alternatives_korean:
  - 만일 그렇지 않다면
  - 그렇지 않으면
  lexicon: HALOT
  rationale: 조건문과 이어지는 추론적 뉘앙스를 한 덩어리로 자연스럽게 살렸습니다. ‘오포’의 담화적 강조는 한국어에서 별도 어휘보다 문맥 전체의 반문 구조로 전달하는 편이 더 적절합니다.
- source_word: מִי יַכְזִיבֵנִי
  english_pob_choice: who can prove me a liar
  chosen_korean: 누가 나를 거짓말쟁이로 증명하고
  alternatives_korean:
  - 누가 나를 거짓말쟁이로 입증하고
  - 누가 나를 거짓말하는 사람으로 드러내고
  - 누가 나를 거짓으로 증명하고
  lexicon: HALOT
  rationale: הִפְעִיל형 כזב의 ‘거짓으로 드러내다/거짓말쟁이로 입증하다’ 의미를 살려, 단순한 반박보다 법정적·논박적 강도를 드러냈습니다.
- source_word: וְיָשֵׂם לְאַל מִלָּתִי
  english_pob_choice: and make my word into nothing
  chosen_korean: 내 말을 아무것도 아닌 것으로 만들겠습니까
  alternatives_korean:
  - 내 말을 무효로 만들겠습니까
  - 내 말을 아무것도 아니게 만들겠습니까
  - 내 말을 무로 돌리겠습니까
  lexicon: HALOT
  rationale: לְאַל의 ‘무효화, 무로 만듦’을 한국어의 ‘아무것도 아닌 것으로 만들다’로 옮겨 결과를 분명히 했습니다. מִלָּה는 여기서 ‘말/발언’의 단수이므로 ‘내 말’이 가장 간결합니다.
theological_decisions:
- issue: 욥의 반문 형식과 수사적 긴장 보존
  chosen_reading: 직역보다 자연스러운 반문형으로 유지해, 욥이 자신의 말을 무효화할 수 있는 상대를 도전적으로 묻는 긴장을 살렸습니다.
  alternative_readings:
  - 그렇지 않으면 누가 나를 반박하며 내 말을 헛되게 하겠습니까?
  - 만일 그렇지 않다면 누가 나를 논박하여 내 말을 무효로 하겠습니까?
  rationale: 이 절은 교리 진술보다 논쟁적 수사에 속하므로, 의미를 완화하지 않되 한국어에서 살아 있는 반문으로 옮기는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 욥기 24장의 논쟁적 지혜문학 문맥
