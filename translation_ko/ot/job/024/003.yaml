  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
  footnotes:
  - marker: a
    text: Or 'They lead off the donkeys of orphans.' The Hebrew uses a plural for 'orphans,' which may be read distributively or collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'they seize the widow's ox in pledge' or 'as collateral.' The verb refers specifically to taking property as security for a debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고아의 나귀를 몰아내며[a], 과부의 소를 담보로 잡습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고아들의 나귀를 몰아냅니다.” 히브리어는 ‘고아들’에 복수형을 사용하여, 개별적 의미로도 집합적 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “과부의 소를 담보로 잡습니다” 곧 채무의 보증물로 압류합니다.
    reason: lexical_alternative
