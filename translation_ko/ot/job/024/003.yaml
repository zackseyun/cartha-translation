  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
  footnotes:
  - marker: a
    text: Or 'They lead off the donkeys of orphans.' The Hebrew uses a plural for 'orphans,' which may be read distributively or collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'they seize the widow's ox in pledge' or 'as collateral.' The verb refers specifically to taking property as security for a debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고아들의 나귀를 몰고 가며[a], 과부의 소를 담보로 잡습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고아의 나귀를 몰고 갑니다.” 히브리어는 ‘고아들’에 복수형을 사용하며, 이를 개별적으로 또는 집합적으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “과부의 소를 담보로 빼앗습니다” 또는 “과부의 소를 채무의 담보물로 압류합니다.” 이 동사는 채무의 담보로 재산을 취하는 일을 가리킵니다.
    reason: lexical_alternative
