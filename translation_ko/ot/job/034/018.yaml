  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
  footnotes:
  - marker: a
    text: Or 'scoundrel' for בְּלִיָּעַל; the Hebrew here uses a term of worthlessness, not necessarily the later proper name 'Belial.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wicked' is singular in form, but it is addressed to the plural 'nobles' and is rendered as a plural insult in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕에게 “무가치한 자!”라고 하고, 귀족들에게 “악한 자들!”이라고 하는 이입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּלִיָּעַל은 여기서 후대의 인격화된 ‘벨리알’이 아니라, ‘무가치함’ 또는 ‘비천함’을 뜻하는 모욕어입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רָשָׁע는 형태상 단수이지만, 복수인 ‘귀족들’을 향해 쓰였으므로 한국어에서는 복수로 옮겼습니다.
    reason: lexical_alternative
