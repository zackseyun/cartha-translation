id: JOB.34.10
reference: Job 34:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
  footnotes:
  - marker: a
    text: Hebrew 'men of heart,' an idiom for men with understanding or discernment.
    reason: lexical_alternative
  - marker: b
    text: Or 'far be it for God from wickedness, and for the Almighty from injustice.' The Hebrew expresses that such evil is unthinkable in relation to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 마음이 있는 사람들아, 내 말을 들으십시오. 하나님이 악을 행하시는 것은 있을 수 없으며, 전능하신 분이 불의를 행하시는 것도 있을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘마음의 사람들’입니다. 여기서 ‘마음’은 감정보다 이해와 분별을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 ‘악을 행하다’와 ‘불의를 행하다’의 대구로 이해할 수도 있고, ‘하나님에게서 악이 멀다’는 뜻으로도 읽을 수 있습니다. 본문은 하나님의 성품상 그러한 일이 전혀 어울리지 않음을 강하게 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 따라서
  lexicon: HALOT
  rationale: 앞뒤 논증의 연결을 나타내는 추론 접속사로, 한국어에서는 ‘그러므로’가 가장 자연스럽고 문맥의 논리 전개를 잘 살립니다.
- source_word: אַנֲשֵׁי לֵבָב
  english_pob_choice: men of understanding
  chosen_korean: 마음이 있는 사람들
  alternatives_korean:
  - 이해력이 있는 사람들
  - 분별 있는 사람들
  - 마음의 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 사람들’이지만, 히브리어에서 ‘마음’은 이해와 분별의 자리이므로 이를 너무 생경하지 않게 살려 ‘마음이 있는 사람들’로 옮겼습니다.
- source_word: חָלִילָה
  english_pob_choice: far be it
  chosen_korean: 있을 수 없습니다
  alternatives_korean:
  - 결코 그럴 수 없습니다
  - 있어서는 안 됩니다
  - 멀리 하소서
  lexicon: HALOT
  rationale: 강한 부정과 혐오를 나타내는 관용구이므로, 한국어에서는 문맥상 ‘있을 수 없습니다’가 하나님의 성품에 대한 불가능성을 가장 분명하게 전달합니다.
- source_word: מֵרֶשַׁע
  english_pob_choice: to do wickedness
  chosen_korean: 악을 행하시는 것은
  alternatives_korean:
  - 악을 저지르시는 것은
  - 악을 행하는 것은
  - 악행을 하시는 것은
  lexicon: HALOT
  rationale: ‘wickedness’의 명사성을 한국어에서는 자연스러운 서술로 풀어 ‘악을 행하시는 것’으로 옮겨, 하나님께 대한 동작의 부적합성을 분명히 했습니다.
- source_word: וְשַׁדַּי
  english_pob_choice: and from the Almighty
  chosen_korean: 전능하신 분이
  alternatives_korean:
  - 전능자께서
  - 샷다이가
  - 전능하신 이가
  lexicon: HALOT
  rationale: שַׁדַּי는 인명보다 칭호이므로, 문맥에 맞게 ‘전능하신 분’으로 번역해 의미를 살렸습니다.
- source_word: מֵעָוֶל
  english_pob_choice: to do wrong
  chosen_korean: 불의를 행하시는 것도
  alternatives_korean:
  - 부정을 행하시는 것도
  - 불의한 일을 하시는 것도
  - 잘못을 행하시는 것도
  lexicon: HALOT
  rationale: עָוֶל은 단순한 ‘wrong’보다 ‘불의/부정’의 윤리적·법적 색채가 강하므로, 전능하신 분에 대해 ‘불의를 행하시는 것’으로 대응했습니다.
theological_decisions:
- issue: חָלִילָה의 신학적 강도
  chosen_reading: 하나님과 전능하신 분에게 악과 불의는 있을 수 없습니다
  alternative_readings:
  - 하나님에게 그런 악은 멀리 있습니다
  - 하나님이 악을 행하실 리 없습니다
  rationale: 본문은 단순 가능성 부정보다 하나님의 본성상 그런 행위가 전혀 어울리지 않음을 강하게 진술하므로, ‘있을 수 없습니다’로 신학적 강도를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (Preserve source force)
