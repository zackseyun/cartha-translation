  - 악을 행하는 것은
  - 악행을 하시는 것은
  lexicon: HALOT
  rationale: ‘wickedness’의 명사성을 한국어에서는 자연스러운 서술로 풀어 ‘악을 행하시는 것’으로 옮겨, 하나님께 대한 동작의 부적합성을 분명히 했습니다.
- source_word: וְשַׁדַּי
  english_pob_choice: and from the Almighty
  chosen_korean: 전능하신 분이
  alternatives_korean:
  - 전능자께서
  - 샷다이가
