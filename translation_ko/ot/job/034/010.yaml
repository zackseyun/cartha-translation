source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
  footnotes:
  - marker: a
    text: Hebrew 'men of heart,' an idiom for men with understanding or discernment.
    reason: lexical_alternative
  - marker: b
    text: Or 'far be it for God from wickedness, and for the Almighty from injustice.' The Hebrew expresses that such evil is unthinkable in relation to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 분별 있는 사람들이여[a], 내 말을 들으십시오. 하나님께서 악을 행하시는 일은 결코 있을 수 없으며[b], 전능하신 분께서 불의를 행하시는 일도 결코 있을 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘마음의 사람들’입니다. 여기서 ‘마음’은 감정보다 이해력과 분별을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님에게서 악이 멀고, 전능하신 분에게서 불의가 멉니다’라고도 옮길 수 있습니다. 히브리어 표현은 악과 불의가 하나님께 전혀 어울릴 수 없음을 강하게 배격합니다.
    reason: lexical_alternative
lexical_decisions:
