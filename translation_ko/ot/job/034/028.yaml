language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הָבִ֣יא עָ֭לָי/ו צַֽעֲקַת דָּ֑ל וְ/צַעֲקַ֖ת עֲנִיִּ֣ים יִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
  footnotes:
  - marker: a
    text: Or 'upon him' or 'against him'; the Hebrew preposition can be understood in more than one way here.
    reason: lexical_alternative
  - marker: b
    text: Or 'the poor ... the oppressed.' The two Hebrew terms overlap but are not identical.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분 앞에 가난한 자의 부르짖음을 가져오게 하시고, 그분은 고난받는 이들의 부르짖음을 들으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עָלָיו는 여기서 ‘그분 앞에/그에게’처럼 이해할 수도 있고, ‘그분 위에/그분을 향해’ 또는 ‘그분에게 맞서’로도 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 두 표현은 뜻이 겹치지만 완전히 같지는 않습니다. 앞의 דָּל은 주로 ‘가난한 자’, 뒤의 עֲנִיִּים은 ‘고난받는 이들/억눌린 이들’의 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא עָלָיו
  english_pob_choice: so as to bring before him
  chosen_korean: 그분 앞에 … 가져오게 하시고
  alternatives_korean:
  - 그에게 가져오게 하시고
  - 그분 위에 가져오게 하시고
  - 그분에게 맞서 가져오게 하시고
  lexicon: HALOT
  rationale: 히브리어 לְהָבִיא는 목적을 나타내며, עָלָיו는 여기서 ‘그에게/그분 앞에’로 읽는 것이 자연스럽습니다. 한국어에서는 ‘앞에’가 청원이나 호소가 하나님께 제시되는 뉘앙스를 잘 살립니다.
- source_word: צַעֲקַת דָּל
  english_pob_choice: the cry of the poor
  chosen_korean: 가난한 자의 부르짖음
  alternatives_korean:
  - 가난한 이의 부르짖음
  - 가난한 자들의 부르짖음
  - 가난한 사람의 외침
  lexicon: HALOT
  rationale: דָּל은 가난하고 힘없는 사람을 가리키므로 ‘가난한 자’로 옮겼습니다. צעקה는 단순한 ‘소리’보다 고통 섞인 ‘부르짖음’이 적절합니다.
- source_word: עֲנִיִּים
  english_pob_choice: the afflicted
  chosen_korean: 고난받는 이들
  alternatives_korean:
  - 가난한 이들
  - 곤고한 이들
  - 억눌린 이들
  lexicon: HALOT
  rationale: 뒤의 עֲנִיִּים은 דָּל과 뜻이 겹치지만 동일하지 않으므로, 앞의 ‘가난한 자’와 구별되도록 ‘고난받는 이들’로 옮겼습니다. 사회적 궁핍과 고통의 뉘앙스를 함께 살립니다.
- source_word: יִשְׁמָע
  english_pob_choice: he hears
  chosen_korean: 들으십니다
  alternatives_korean:
  - 들을 것입니다
  - 듣습니다
  - 들으십니까
  lexicon: HALOT
  rationale: 시적 진술에서 하나님의 상시적 행위를 현재형으로 옮겨, ‘그분은 … 들으십니다’로 자연스럽고 단정하게 표현했습니다.
theological_decisions:
- issue: עָלָיו와 יִשְׁמָע의 주어 해석
  chosen_reading: 부르짖음은 하나님 앞에 제시되고, 하나님이 그 부르짖음을 들으십니다.
  alternative_readings:
  - 부르짖음이 그 악인에게 닥친다
  - 그가 그 부르짖음을 듣는다
  rationale: 문맥상 엘리후는 하나님이 억압의 소리를 감지하고 심판하신다는 점을 말하므로, ‘그분 앞에’와 ‘들으십니다’를 하나님을 지칭하는 것으로 읽는 것이 가장 자연스럽습니다. 악인이 듣는다는 해석은 문맥과 맞지 않습니다.
  doctrine_reference: 하나님의 न्याय적 인지와 가난한 자의 호소에 대한 응답
