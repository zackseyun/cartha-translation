  source_fidelity: 첫 절의 לְהָבִיא는 앞 절에서 이어지는 목적/결과의 부정사이며, 하나님께서 부르짖음을 ‘가져오게 하신다’는 독립된 사역으로 번역할 근거는 없습니다. 원문의 문맥상 억압자들의 행위가 가난한 이의 부르짖음을 하나님께 이르게 한다는 뜻을 보존해야 합니다. יִשְׁמָע의 주어는 문맥상 하나님으로 이해하는 것이 타당합니다.
  naturalness: ‘그분 앞에 … 가져오게 하시고’는 한국어에서 하나님이 그 일을 시키시는 주어로 읽히며, 원문의 연결 관계도 불분명합니다. ‘그분께 이르게 하였고’는 선행 문맥의 묵시적 행위자를 자연스럽게 이어 줍니다. ‘고난을 받는 이들’은 현대 표준어에서 ‘고난받는 이들’보다 조금 더 자연스럽습니다.
  terminology: דַּל은 ‘가난한 이’, עֲנִיִּים은 ‘고난을 받는 이들’로 구별하여 겹치되 동일하지 않은 의미 영역을 보존했습니다. צעקה의 반복은 ‘부르짖음’으로 유지했습니다. עָלָיו의 해석상 여지는 각주에서 보존하되, 본문은 문맥상 ‘그분께’로 옮겼습니다.
