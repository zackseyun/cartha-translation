base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
  footnotes:
  - marker: a
    text: Or, 'he causes it to come upon him' or 'he brings upon him,' reflecting the causative sense of the Hebrew verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사람에게 그의 행위대로 갚으시며, 사람의 길에 따라 그로 하여금 그에 맞는 결과를 만나게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그로 하여금 그에게 닥치게 하시며”, “그 위에 가져오시며”로도 옮길 수 있습니다. 이는 히브리어 동사의 인과적 의미를 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그가
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 직접적인 원인 설명을 한국어로 자연스럽게 이어 주되, 앞뒤 문맥에서 이미 드러난 주어를 받아 문장 흐름을 살렸습니다.
- source_word: פֹעַל
  english_pob_choice: deed
  chosen_korean: 행위
  alternatives_korean:
  - 행동
  - 일
  lexicon: HALOT
  rationale: 의인 행위를 가리키는 말로서, 단순한 '일'보다 도덕적·판결적 맥락을 더 분명히 드러냅니다.
- source_word: יְשַׁלֶּם לוֹ
  english_pob_choice: he repays a man
  chosen_korean: 사람에게 … 갚으시며
  alternatives_korean:
  - 사람에게 … 보응하시며
  - 사람에게 … 갚아 주시며
  lexicon: HALOT
  rationale: שלם의 보응/상환 의미를 살리면서도, 현대 한국어에서 자연스러운 '갚다'를 사용해 재판적 보응의 뉘앙스를 보존했습니다.
- source_word: אֹרַח
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길[행로]
  - 삶의 방식
  lexicon: HALOT
  rationale: 문자적 이미지인 '길'을 살려, 행위의 경로와 삶의 방식이라는 비유를 함께 유지했습니다.
- source_word: יַמְצִאֶנּוּ
  english_pob_choice: he makes him find
  chosen_korean: 그로 하여금 그에 맞는 결과를 만나게 하십니다
  alternatives_korean:
  - 그에게서 찾게 하십니다
  - 그가 그것을 만나게 하십니다
  - 그를 맞닥뜨리게 하십니다
  lexicon: HALOT
  rationale: 히필의 '찾게 하다/경험하게 하다'라는 인과 의미를 살리면서, 한국어에서 자연스럽고 오해가 적은 표현으로 결과의 체험을 드러냈습니다.
theological_decisions:
- issue: 행위에 따른 보응의 일반 원리
  chosen_reading: 이 절은 하나님께서 사람의 행위와 길에 따라 갚으신다는 일반 원리를 말하며, 욥기의 전체 긴장 속에서 모든 고난을 단순한 개인 죄의 직접 보응으로 단정하지 않도록 표현했습니다.
  alternative_readings:
  - 모든 고난은 언제나 개인의 정확한 죄값이라는 단정
  rationale: 본문 자체의 진술은 일반 원리이므로, 욥기의 문맥을 넘어 과도한 신학적 결론으로 확장하지 않도록 했습니다.
  doctrine_reference: 욥기의 신정론적 긴장 보존
