base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
  footnotes:
  - marker: a
    text: Or, 'he causes it to come upon him' or 'he brings upon him,' reflecting the causative sense of the Hebrew verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분께서 사람의 행위대로 그에게 갚으시고, 사람이 자기 길에 따라 그에 상응하는 것을 겪게 하시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람의 길에 따라 그에게 닥치게 하시며”로 옮길 수 있습니다. 이는 히브리어 동사의 사역적 의미를 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그가
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 직접적인 원인 설명을 한국어로 자연스럽게 이어 주되, 앞뒤 문맥에서 이미 드러난 주어를 받아 문장 흐름을 살렸습니다.
