  rationale: 설명 접속사 כִּי를 ‘이는 … 때문입니다’로 옮겼습니다. פֹעַל과 אֹרַח의 병행은 ‘행위’와 ‘자기 길’로 유지했으며, יַמְצִאֶנּוּ는 사람이 그 길에 상응하는 것을 ‘겪게 하신다’로 번역하여 사역성과 결과적 의미를 보존했습니다. ‘그에 상응하는 것’은 원문의 문맥상 암시된 목적어를 최소한으로 보완한 표현이며, 더 직접적인 ‘그에게 닥치게 하시며’는 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:01Z'
