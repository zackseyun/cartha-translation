  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
  footnotes:
  - marker: a
    text: Or, “A man profits nothing when God delights in him,” or “A man gains nothing by seeking God’s favor.” The Hebrew phrase is compact and allows more than one construal.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말하기를, 「사람은 하나님과 함께 기뻐해도 아무 유익을 얻지 못합니다」라고 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 그를 기뻐하셔도 사람은 아무 유익을 얻지 못합니다” 혹은 “사람은 하나님의 은혜를 구해도 아무 유익을 얻지 못합니다.” 히브리어 구문이 압축적이어서 여러 해석이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
