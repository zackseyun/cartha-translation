  lexicon: HALOT
  rationale: 인용문을 이끄는 서술로 처리해, 엘리후가 욥의 입장을 요약해 진술하는 뉘앙스를 살렸습니다.
- source_word: יִסְכָּן
  english_pob_choice: gains
  chosen_korean: 아무 유익을 얻지 못합니다
