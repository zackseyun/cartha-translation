  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
  footnotes:
  - marker: a
    text: Or, “A man profits nothing when God delights in him,” or “A man gains nothing by seeking God’s favor.” The Hebrew phrase is compact and allows more than one construal.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 “사람은 하나님과 함께하는 것을 기뻐해도 아무 유익을 얻지 못합니다”라고 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 그를 기뻐하실 때에도 사람은 아무 유익을 얻지 못합니다” 또는 “사람은 하나님의 은혜를 구해도 아무 유익을 얻지 못합니다.” 히브리어 구문은 압축적이어서 여러 해석이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그가 말하기를 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 엘리후의 전후 논증을 잇는 이유 표지이므로, 한국어에서는 자연스러운 인과 연결로 옮겼습니다.
- source_word: אָמַר
  english_pob_choice: he has said
  chosen_korean: 말하기를
  alternatives_korean:
  - 말했습니다
  - 그가 말했다
  lexicon: HALOT
  rationale: 인용문을 이끄는 서술로 처리해, 엘리후가 욥의 입장을 요약해 진술하는 뉘앙스를 살렸습니다.
- source_word: יִסְכָּן
  english_pob_choice: gains
  chosen_korean: 아무 유익을 얻지 못합니다
  alternatives_korean:
  - 아무 이익도 얻지 못합니다
  - 아무 소득도 없습니다
  lexicon: HALOT
  rationale: ‘유익/이익’을 뜻하는 동사로서, 결과적 이득의 부재를 한국어 관용 표현으로 자연스럽게 옮겼습니다.
- source_word: בִּרְצֹתוֹ עִם אֱלֹהִים
  english_pob_choice: by delighting himself with God
  chosen_korean: 하나님과 함께 기뻐해도
  alternatives_korean:
  - 하나님을 기뻐해도
  - 하나님께 기쁨을 두어도
  - 하나님의 은혜를 구해도
  lexicon: HALOT
  rationale: רצה는 ‘기뻐하다/즐기다’의 뜻이 가능하므로, 본문을 한 가지 해석으로 단정하지 않고 ‘하나님과 함께 기뻐하다’로 옮겨 관계적 즐거움의 의미를 살렸습니다.
theological_decisions:
- issue: בִּרְצֹתוֹ עִם אֱלֹהִים의 주어와 관계 방향
  chosen_reading: 본문의 기본 읽기는 사람이 하나님과의 관계 안에서 기뻐해도 유익이 없다는 엘리후의 요약 발언으로 두었습니다.
  alternative_readings:
  - 하나님께서 그를 기뻐하셔도 유익이 없다
  - 하나님의 은혜를 구해도 유익이 없다
  rationale: 히브리어 구문이 압축적이어서 주어·관계 해석이 갈릴 수 있으므로, 한 가지로 교리화하지 않고 한국어 본문은 가장 직접적인 읽기를 따르되 대안은 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
