source:
  edition: WLC
  text: וְ/אִם בִּ֥ינָה שִׁמְעָ/ה זֹּ֑את הַ֝אֲזִ֗ינָ/ה לְ/ק֣וֹל מִלָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
  footnotes:
  - marker: a
    text: Or 'listen to the voice of my words.' The Hebrew phrase is literally 'to the sound/voice of my words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 분별력이 있으면, 이것을 들으십시오. 내 말소리에 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 말들의 소리/음성에’입니다. ‘음성’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 만약
  lexicon: HALOT
  rationale: 조건을 여는 אם의 기능을 자연스럽게 살려 ‘만일’로 옮겼습니다. 앞의 접속적 ו는 한국어에서 별도로 드러낼 필요가 없습니다.
- source_word: בִּינָה
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해력
  - 통찰
  lexicon: HALOT
  rationale: בִּינָה는 단순 지식보다 사안을 가려 아는 능력을 가리켜, 대화 문맥에서는 ‘분별력’이 가장 근접합니다.
- source_word: שִׁמְעָה
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어라
  - 들어 주십시오
  lexicon: HALOT
  rationale: 직접 명령형의 요청을 합쇼체로 옮겨, 권면의 강도를 유지하면서도 현대 한국어 문체에 맞췄습니다.
- source_word: לְקוֹל מִלָּי
  english_pob_choice: to the sound of my words
  chosen_korean: 내 말소리에도
  alternatives_korean:
  - 내 말의 소리에
  - 내 말의 음성에
  lexicon: HALOT
  rationale: קוֹל의 ‘소리/음성’과 이어지는 ‘내 말들’의 결합을 살려 ‘말소리’로 압축했습니다. ‘에도’를 넣어 앞의 ‘이것’을 듣는 것에 더해 그의 발화 전체에 귀를 기울이라는 병렬성을 나타냈습니다.
theological_decisions:
- issue: 두 개의 청각 동사(hear/listen)의 뉘앙스 차이
  chosen_reading: ‘들으십시오’와 ‘귀를 기울이십시오’로 구분해, 첫 번째는 일반 청취, 두 번째는 더 집중된 경청으로 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘들으십시오’
  - ‘들어 주십시오’와 ‘들으십시오’
  rationale: 히브리어는 같은 영역의 감각을 두 단계로 강화하므로, 한국어에서도 반복을 단순 평행으로만 처리하지 않고 강도를 높이는 방향을 유지했습니다.
  doctrine_reference: 시적·권면 문맥의 수사적 강조
