id: JOB.34.6
reference: Job 34:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
  footnotes:
  - marker: a
    text: Or, 'Against my right I am counted a liar,' taking the first clause as a statement rather than a rhetorical question.
    reason: alternative_reading
  - marker: b
    text: Literally, 'my arrow is incurable'; 'arrow' is likely a metaphor for the wound or affliction inflicted on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 내 권리를 두고 거짓말을 하겠습니까? 제게 아무 죄도 없는데도 제 상처는 낫지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 권리에 대하여 내가 거짓말쟁이로 여겨집니다’로 이해할 수 있습니다. 첫 절을 반문이 아니라 진술로 읽는 해석입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘제 화살은 치료될 수 없습니다’입니다. 여기서 ‘화살’은 욥에게 가해진 상처나 고난을 가리키는 은유일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁפָּטִי
  english_pob_choice: concerning my right
  chosen_korean: 내 권리를 두고
  alternatives_korean:
  - 내 사건에 관해
  - 내 변론에 관해
  - 내 권리에 대하여
  lexicon: HALOT
  rationale: מִשְׁפָּטִי는 법정적 ‘판결’보다 욥의 ‘권리/정당한 사정’에 가깝고, עַל은 여기서 ‘~을 두고/대하여’의 뜻이 자연스러워 한국어로 간결하게 살렸습니다.
- source_word: אֲכַזֵּב
  english_pob_choice: Should I lie
  chosen_korean: 거짓말을 하겠습니까
  alternatives_korean:
  - 제가 거짓되겠습니까
  - 제가 거짓말하겠습니까
  - 제가 거짓말한 셈이 되겠습니까
  lexicon: HALOT
  rationale: 반문형의 힘을 살리면서도 욥의 항변으로 읽히게 하려면 직설적 현재형보다 ‘~하겠습니까’가 합쇼체에서 가장 자연스럽습니다.
- source_word: אָנ֖וּשׁ
  english_pob_choice: is incurable
  chosen_korean: 치료될 수 없는데도
  alternatives_korean:
  - 낫지 않는데도
  - 불치인데도
  - 회복될 수 없는데도
  lexicon: HALOT
  rationale: אָנושׁ의 ‘절망적으로 아프다/불치이다’라는 의미를 현대 한국어로 압축해, 욥의 고난이 회복 불가능하다는 뉘앙스를 전달했습니다.
- source_word: חִצִּי
  english_pob_choice: my wound
  chosen_korean: 제 상처
  alternatives_korean:
  - 제 화살
  - 제 아픔
  - 제 상처 난 곳
  lexicon: HALOT
  rationale: 직역의 ‘제 화살’은 은유를 남기지만 한국어 독자에게 뜻이 덜 분명하므로, POB의 해설대로 상처/고난의 의미를 본문에 드러내되 은유적 긴장은 유지했습니다.
- source_word: בְלִי פָשַׁע
  english_pob_choice: though there is no transgression
  chosen_korean: 아무 죄도 없습니다
  alternatives_korean:
  - 범죄가 없는데도
  - 어떤 범죄도 없는데도
  - 허물이 없는데도
  lexicon: HALOT
  rationale: פשע는 도덕적·법적 ‘죄/범죄’의 강한 표현이므로, 욥의 무죄 항변을 현대 한국어에서 자연스럽고 분명하게 드러내는 ‘아무 죄도 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 첫 절의 문장 유형—반문인가, 진술인가
  chosen_reading: 반문형으로 옮겨, 욥이 자신의 무죄를 부인할 이유가 없다는 항변을 드러냈습니다.
  alternative_readings:
  - ‘내 권리에 대하여 내가 거짓말쟁이로 여겨집니다’라는 진술형
  - ‘내 권리를 두고 거짓말하겠느냐’의 직설형
  rationale: 히브리어는 압축적이어서 진술형도 가능하지만, 문맥상 욥의 강한 항변을 보존하려면 반문형이 가장 자연스럽습니다. 동시에 절 뒤의 고난과 무죄 사이의 긴장을 풀어버리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: חִצִּי의 은유 처리
  chosen_reading: ‘제 상처’로 본문에 의미를 드러내고, 화살 은유는 본문 밖에서 추적 가능하도록 남겨 두었습니다.
  alternative_readings:
  - ‘제 화살은 치료될 수 없습니다’의 직역
  - ‘제 화살이 불치입니다’
  - ‘제 상처 난 화살’
  rationale: 원문은 문자적 ‘화살’이지만 문맥상 고난의 상처를 가리키는 은유이므로, 독자가 의미를 즉시 파악하도록 하되 과도한 해석으로 확정하지는 않았습니다.
  doctrine_reference: Translation philosophy §3, preserve imagery without obscuring meaning
