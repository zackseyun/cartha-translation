  source_fidelity: 히브리어의 압축된 첫 절을 반문으로 읽는 번역은 영어 POB의 선택과 부합하며, 대안적 진술 독해도 각주로 보존했습니다. חִצִּי를 ‘상처’로 의미 번역하고 문자적 ‘화살’을 각주에 제시한 처리도 가능합니다. 다만 בְּלִי פָשַׁע(‘허물/범법이 없이’)는 욥의 무죄 상태를 나타내므로, 현 본문의 ‘상처는 치료될 수 없는데도, 아무 죄도 없습니다’는 양보절의 연결 대상이 불분명하고 한국어 문장으로도 부자연스럽습니다.
  naturalness: ‘제게 아무 죄도 없는데도 제 상처는 낫지 않습니다’로 배열하면 무죄와 지속되는 고난의 대조가 분명하며 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘낫지 않습니다’는 상처에 자연스럽게 쓰이며, 문맥과 각주가 אַנּוּשׁ의 절망적·불치의 함의를 보완합니다.
