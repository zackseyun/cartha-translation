    issue: ‘하소서’가 원문에 없는 기도·명령형을 도입함
    rationale: 히브리어는 앞 문맥의 하나님의 행위에 연결되는 압축된 부정 목적/예방 구문이며, 화자가 하나님께 청원하는 형태가 아닙니다.
  - severity: medium
    issue: ‘왕이 되다’는 מָלַךְ의 의미를 좁힘
    rationale: 이 문맥의 מָלַךְ은 왕위 획득보다 실제 통치·지배를 가리키므로 ‘통치하지 못하게 하시며’가 적절합니다.
  - severity: medium
