  source_fidelity: 수정이 필요합니다. 초안의 ‘왕이 되다’는 מָלַךְ의 여기 문맥상 의미인 ‘통치하다/다스리다’를 충분히 반영하지 못하며, ‘하소서’는 원문에 없는 기도·명령형을 도입합니다. 압축된 두 번째 구는 백성이 올무에 걸리거나 올무에 빠지는 것을 막는 뜻으로 옮기는 것이 문맥과 영어 POB의 판단을 가장 잘 반영합니다.
  naturalness: ‘경건하지 않은 자’는 가능하지만, 현대 표준어에서는 ‘경건하지 않은 사람이’ 더 자연스럽습니다. ‘…하시려는 것입니다’는 앞 절(34:29)의 하나님의 행위에 이어지는 목적·결과의 뉘앙스를 합쇼체로 자연스럽게 나타냅니다.
  terminology: חָנֵף는 ‘경건하지 않은’으로 유지할 수 있습니다. מָלַךְ은 ‘왕이 되다’보다 ‘통치하다’로, מוֹקֵשׁ는 ‘올무’로 옮겼습니다. 논쟁적인 압축 구문은 각주에서 대안 가능성을 보존했습니다.
  issues:
