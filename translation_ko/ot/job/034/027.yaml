  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
  footnotes:
  - marker: a
    text: Literally, 'from after him,' a Hebrew idiom meaning 'from following him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they did not consider all his ways.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그들이 그를 따르던 데서 돌아섰고[a] 그의 어떤 길도 깨닫지 못했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 뒤에서'이지만, 히브리어 관용구로 '그를 따르던 데서'라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 모든 길을 고려하지 않았습니다.'
    reason: alternative_reading
