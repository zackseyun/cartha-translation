    text: 직역하면 '그 뒤에서'이지만, 히브리어 관용구로 '그를 따르는 데서'라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 모든 길을 그들은 고려하지 않았습니다.'
    reason: alternative_reading
