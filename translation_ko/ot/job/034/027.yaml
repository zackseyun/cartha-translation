  source_fidelity: 인과를 나타내는 אֲשֶׁר עַל כֵּן, '그를 따르는 데서 돌아서다'라는 סָרוּ מֵאַחֲרָיו의 관용적 뜻, 그리고 하나님의 길들에 대한 הִשְׂכִּילוּ의 이해·통찰 의미를 보존했습니다. 부정 아래의 כָל은 한국어에서 '어떤 길도'로 옮겨 부정의 범위를 분명히 했습니다.
  naturalness: 초안의 '그의 모든 길을 그들은'은 현대 한국어의 어순으로 다소 부자연스럽고, 대시로 이어진 문장도 인과절의 흐름을 끊습니다. '이는 ... 때문입니다' 구조로 자연스럽고 합쇼체 문체에 맞게 다듬었습니다.
