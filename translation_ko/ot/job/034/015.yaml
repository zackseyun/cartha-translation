lexical_decisions:
- source_word: יִגְוַע
  english_pob_choice: would perish
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 죽을 것입니다
  - 소멸할 것입니다
  lexicon: HALOT
  rationale: גוע는 단순한 ‘죽다’보다 생명의 소멸·꺼짐을 강하게 드러내므로, 조건적 문맥에서 ‘사라지다’가 한국어로 자연스럽고 중립적으로 그 중량감을 살립니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 인류
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 반영해 보편적 죽음의 범위를 살렸습니다. ‘육체’는 인간의 유한성을 강조하는 표현으로, POB의 ‘all flesh’ 감각을 비교적 가깝게 옮깁니다.
- source_word: יָחַד
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 일제히
  - 한꺼번에
  lexicon: HALOT
  rationale: 동시성과 집합성을 간결하게 드러내는 가장 자연스러운 현대 한국어 표현입니다.
- source_word: יָשׁוּב־־ / עַל עָפָר
  english_pob_choice: would return to dust
  chosen_korean: 흙으로 돌아갈 것입니다
  alternatives_korean:
  - 먼지로 돌아갈 것입니다
  - 티끌로 돌아갈 것입니다
  lexicon: HALOT
  rationale: 돌아가는 방향을 나타내는 전치사와 ‘흙/먼지’ 이미지의 성경적 관용을 살리면서, 한국어로 가장 익숙하고 문맥에 적합한 표현을 택했습니다.
theological_decisions:
- issue: אָדָם의 성별 포괄성
