  yaml_path: translation/ot/job/034/015.yaml
  text: all flesh would perish together[a], and man would return to dust.
  footnotes:
  - marker: a
    text: Or 'humankind would return to the dust.' The Hebrew אָדָם is singular but can represent humanity collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 육체는 함께 사라지고, 사람은 흙으로 돌아갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류가 흙으로 돌아갈 것입니다.’ 히브리어 אָדָם은 단수형이지만 집합적으로 인간 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  english_pob_choice: would perish
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 죽을 것입니다
  - 소멸할 것입니다
  lexicon: HALOT
  rationale: גוע는 단순한 ‘죽다’보다 생명의 소멸·꺼짐을 강하게 드러내므로, 조건적 문맥에서 ‘사라지다’가 한국어로 자연스럽고 중립적으로 그 중량감을 살립니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 인류
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 반영해 보편적 죽음의 범위를 살렸습니다. ‘육체’는 인간의 유한성을 강조하는 표현으로, POB의 ‘all flesh’ 감각을 비교적 가깝게 옮깁니다.
- source_word: יָחַד
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 일제히
  - 한꺼번에
  lexicon: HALOT
  rationale: 동시성과 집합성을 간결하게 드러내는 가장 자연스러운 현대 한국어 표현입니다.
- source_word: יָשׁוּב־־ / עַל עָפָר
  english_pob_choice: would return to dust
  chosen_korean: 흙으로 돌아갈 것입니다
  alternatives_korean:
  - 먼지로 돌아갈 것입니다
  - 티끌로 돌아갈 것입니다
  lexicon: HALOT
  rationale: 돌아가는 방향을 나타내는 전치사와 ‘흙/먼지’ 이미지의 성경적 관용을 살리면서, 한국어로 가장 익숙하고 문맥에 적합한 표현을 택했습니다.
theological_decisions:
- issue: אָדָם의 성별 포괄성
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 인간
  rationale: 히브리어 단수형 אָדָם은 여기서 집합적 인간을 가리키며, ‘사람’은 성별을 특정하지 않으면서도 단수 집합의 뉘앙스를 비교적 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
