lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  english_pob_choice: men of understanding
  chosen_korean: 분별력 있는 사람들
  alternatives_korean:
  - 마음의 사람들
  - 이해력 있는 사람들
  - 통찰력 있는 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘마음의 사람들’은 현대 한국어에서 의미가 선명하지 않아, 관용적 의미인 이해·분별의 사람으로 풀었습니다.
- source_word: יֹאמְרוּ לִי
  english_pob_choice: will say to me
  chosen_korean: 내게 말할 것이며
  alternatives_korean:
  - 내게 말할 것입니다
  - 내게 말하리라
  lexicon: HALOT
  rationale: 미완료형의 기대·전망을 살려 미래적으로 옮겼고, 앞 절과의 병렬을 위해 연결어미를 유지했습니다.
- source_word: וְגֶבֶר חָכָם
  english_pob_choice: and a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 현명한 사람
  lexicon: HALOT
  rationale: גבר의 기본 의미는 ‘사람/남자’지만, 여기서는 앞의 병행구와 맞물려 일반적 인간을 가리키므로 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: שֹׁמֵעַ לִי
  english_pob_choice: who hears me
  chosen_korean: 내 말을 들을 것입니다
  alternatives_korean:
  - 나를 들을 사람
  - 내 말을 듣는 사람
  lexicon: HALOT
  rationale: 분사구문은 그 사람의 특징을 나타내므로 ‘듣는 사람’도 가능하지만, 문맥상 엘리후의 말을 실제로 듣고 수긍하는 뜻을 드러내기 위해 자연스럽게 정리했습니다.
