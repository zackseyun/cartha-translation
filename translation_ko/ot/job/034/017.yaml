  rationale: 본문의 ‘큰 이’를 현대 한국어에서 자연스럽고 의미상 정확한 ‘능력이 크신 분’으로 고쳤습니다. 이는 כַּבִּיר의 강함과 위대함을 반영하며, 본문에 ‘하나님’을 직접 삽입하지 않아 지시 대상에 관한 해석의 여지를 보존합니다. 각 주석 표지도 해당 어구 또는 동사에 직접 붙도록 정리했습니다.
