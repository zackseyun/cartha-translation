id: JOB.34.17
reference: Job 34:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
  footnotes:
  - marker: a
    text: Or 'rule,' 'restrain,' or more literally 'bind.' The Hebrew verb likely carries the sense of exercising rule or restraint in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the just mighty one' or 'the righteous great one.' The phrase is most naturally understood here as referring to God.
    reason: alternative_reading
translation:
  language: ko
  text: 정의를 미워하는 자가 다스릴 수 있겠습니까? 의로우신 큰 이를 정죄하시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘묶다’이지만, 이 문맥에서는 ‘다스리다’ 또는 ‘억제하다’의 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의로우신 큰 이’는 문맥상 하나님을 가리키는 표현으로 읽힙니다.
    reason: theological_note
lexical_decisions:
- source_word: הַ/אַף
  english_pob_choice: Can
  chosen_korean: …할 수 있겠습니까?
  alternatives_korean:
  - …하겠습니까?
  - 과연 …할 수 있겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 강한 반문을 자연스러운 합쇼체로 옮겼습니다. 영어 POB의 ‘Can’에 해당하는 가능 여부 질문을 유지하되, 문맥상 반어의 힘이 드러나도록 했습니다.
- source_word: שׂוֹנֵא
  english_pob_choice: one who hates
  chosen_korean: 정의를 미워하는 자
  alternatives_korean:
  - 미워하는 자
  - 정의를 증오하는 자
  lexicon: HALOT
  rationale: 분사형의 인물 성격을 ‘…하는 자’로 살리고, 대상은 מִשְׁפָּט의 문맥에 맞게 ‘정의’로 옮겼습니다.
- source_word: יַחֲבֹשׁ
  english_pob_choice: govern
  chosen_korean: 다스릴 수 있겠습니까
  alternatives_korean:
  - 통치할 수 있겠습니까
  - 다스리겠습니까
  - 억제할 수 있겠습니까
  lexicon: HALOT
  rationale: 기본 의미는 ‘묶다’이지만 여기서는 통치/억제의 관용적 의미가 문맥상 더 자연스럽습니다. 영어 POB의 해석을 따라 ‘다스리다’로 옮겨, 공적 통치의 뉘앙스를 살렸습니다.
- source_word: צַדִּיק כַּבִּיר
  english_pob_choice: the righteous Mighty One
  chosen_korean: 의로우신 큰 이
  alternatives_korean:
  - 의로우신 큰 분
  - 의로우신 능력자
  - 의로우신 위대한 이
  lexicon: HALOT
  rationale: כַּבִּיר을 고유 호칭으로 단정하지 않고 형용사적 결합으로 보아, 직역에 가까운 ‘큰 이’로 유지했습니다. 동시에 앞의 ‘의로우신’으로 인물의 성격을 분명히 했습니다.
- source_word: תַּרְשִׁיעַ
  english_pob_choice: will you condemn
  chosen_korean: 정죄하시겠습니까
  alternatives_korean:
  - 유죄로 판정하시겠습니까
  - 정죄하겠습니까
  - 악하다고 선언하시겠습니까
  lexicon: HALOT
  rationale: 히필의 법정적 의미를 살려 ‘정죄하다’로 옮겼습니다. 한국어 성경 전통과도 맞지만, 여기서는 המשפט과 대응되는 법정 어조를 유지하는 것이 핵심입니다.
theological_decisions:
- issue: כַּבִּיר의 지시 대상
  chosen_reading: ‘큰 이’는 일반적 형용사구로 유지하되, 문맥상 하나님을 가리키는 표현으로 읽힙니다.
  alternative_readings:
  - ‘큰 자’라는 일반적 통치자
  - ‘능력자’라는 칭호
  rationale: 영어 POB가 God으로 이해하되 본문 자체는 칭호를 명시적으로 주지 않으므로, 한국어 본문에서는 해석을 과잉 고정하지 않고 문맥적 신적 지시를 보존했습니다.
  doctrine_reference: 문맥 해석과 신적 지시 표지의 보존
- issue: 두 번째 질문의 존대
  chosen_reading: 법정적 반문을 유지하면서도, 독자 대상의 현대 합쇼체를 사용했습니다.
  alternative_readings:
  - 더 직설적인 반말형 반문
  - 고전적 어미의 경어체
  rationale: 히브리어 수사적 질문의 날카로움을 살리되, 현대 한국어 성경 문체에 맞게 합쇼체로 정리했습니다. 직접 하나님께 말하는 장면이 아니므로 특별한 신앙어 경어를 적용하지 않았습니다.
  doctrine_reference: 한국어 성경 문체와 화행의 적합성
