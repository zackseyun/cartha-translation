  source_fidelity: 첫 질문의 ‘정의를 미워하는 자’와 ‘다스리다’는 שׂוֹנֵא מִשְׁפָּט 및 יַחֲבֹשׁ의 문맥적 의미를 잘 반영합니다. 두 번째 질문의 ‘정죄하시겠습니까?’도 히필 תַּרְשִׁיעַ의 법정적 의미에 정확합니다. 다만 כַּבִּיר을 ‘큰 이’로 옮긴 것은 어휘의 ‘강함/위대함’보다 물리적 크기를 우선시하는 듯하고, 현대 표준 한국어에서는 부자연스럽습니다.
