base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
  footnotes:
  - marker: a
    text: Or, more literally, 'I have borne; I will not act corruptly.' The Hebrew leaves the object of 'borne' unstated, which may imply punishment, chastisement, or guilt borne.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로, 누가 하나님께 「나는 징계를 받았습니다[a]. 다시는 악을 행하지 않겠습니다」라고 말한 적이 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 짊어졌습니다’ 또는 ‘나는 감당했습니다’라고 하며, 무엇을 짊어졌는지는 밝히지 않습니다. 문맥상 징계나 벌을 감당했다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 사람이 …라고 말한 적이 있습니까?
  alternatives_korean:
