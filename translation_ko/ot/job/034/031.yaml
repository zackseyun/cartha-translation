  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
  footnotes:
  - marker: a
    text: Or, more literally, 'I have borne; I will not act corruptly.' The Hebrew leaves the object of 'borne' unstated, which may imply punishment, chastisement, or guilt borne.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 하나님께 「나는 징계를 받았습니다. 다시는 악을 행하지 않겠습니다」라고 말한 적이 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘나는 무엇을 견뎠다/짊어졌다’로도 읽힐 수 있어, ‘징계를 받았습니다’보다 더 문자적으로는 ‘나는 짊어졌습니다’ 또는 ‘나는 감당했습니다’가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 사람이 …라고 말한 적이 있습니까?
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 사람이 …라고 말했습니까?
  lexicon: HALOT
  rationale: 문맥상 앞뒤 논증을 잇는 이유 제시이므로 질문형으로 자연스럽게 풀되, 히브리어의 연결 기능은 유지했습니다.
- source_word: אֶל אֵל
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 하나님을 향해
  lexicon: HALOT
  rationale: אֶל의 방향성은 한국어 여격 조사로 자연스럽게 드러내고, אֵל은 일반 명사적 용법이므로 ‘하나님’으로 옮겼습니다.
- source_word: נָשָׂאתִי
  english_pob_choice: I have borne punishment
  chosen_korean: 나는 징계를 받았습니다
  alternatives_korean:
  - 나는 받았습니다
  - 나는 고난을 받았습니다
  - 나는 벌을 받았습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어가 생략되어 있으나 회개/징계의 맥락에서 ‘징계를 받다’가 그 함의를 가장 분명하게 살립니다.
- source_word: אֶחְבֹּל
  english_pob_choice: I will not offend again
  chosen_korean: 다시는 악을 행하지 않겠습니다
  alternatives_korean:
  - 다시는 잘못을 저지르지 않겠습니다
  - 다시는 부패하게 행동하지 않겠습니다
  - 다시는 죄를 짓지 않겠습니다
  lexicon: HALOT
  rationale: חבל의 윤리적 의미를 자연스럽게 옮기되, 현대 한국어에서 문맥상 가장 직접적인 금지 서원을 살리는 표현을 택했습니다.
theological_decisions:
- issue: 문장의 화자 일반화와 인용 부호 처리
  chosen_reading: ‘사람이 하나님께’로 옮겨, 특정 개인 고백이 아니라 하나님 앞에서의 보편적 회개 진술이라는 수사적 의미를 살렸습니다.
  alternative_readings:
  - ‘그가 하나님께’
  - 직역형 ‘하나님께 말했습니까’
  rationale: 히브리어 הֶאָמַר는 문맥상 일반적/수사적 질문으로 읽히므로, 한국어에서도 보편성을 드러내는 것이 본문의 논지를 더 정확히 전달합니다.
  doctrine_reference: '욥기 34장의 엘리후 논변: 하나님 앞에서의 인간의 회개와 의무'
