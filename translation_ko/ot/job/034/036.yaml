  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
  footnotes:
  - marker: a
    text: Or "O my father"; the Hebrew reads literally "my father," likely as a vocative, though some understand it differently.
    reason: lexical_alternative
  - marker: b
    text: Literally "unto perpetuity/forever"; here likely meaning intensive or exhaustive testing rather than endless duration.
    reason: lexical_alternative
  - marker: c
    text: Or "with wicked men" or "like wicked men"; the Hebrew preposition can suggest association or comparison.
    reason: alternative_reading
translation:
  language: ko
  text: 아버지여, 욥을 끝까지 시험해 보시어, 그의 대답이 악인들과 같은 까닭입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 아버지”입니다. 여기서는 호격으로 보는 해석을 본문에 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “영원/항상”입니다. 여기서는 끝없는 기간보다 철저한 시험의 강도를 뜻하는 것으로 보았습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 전치사 בְּ는 “같은/더불어/가운데”의 뉘앙스를 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  english_pob_choice: My father
  chosen_korean: 아버지여
  alternatives_korean:
  - 오, 아버지여
  - 내 아버지여
  lexicon: HALOT
  rationale: 히브리어의 호격적 용법을 살려 직접 부르는 말로 옮겼습니다. 문맥상 감탄보다 호소에 가깝기 때문에 ‘아버지여’가 가장 자연스럽습니다.
- source_word: יִבָּחֵן
  english_pob_choice: let ... be tested
  chosen_korean: 시험해 보시어
  alternatives_korean:
  - 시험되게 하시어
  - 검증되게 하시어
  lexicon: HALOT
  rationale: נִפעל형의 ‘시험받다/검증되다’ 의미를 살리되, 한국어에서는 간청형 문맥에 맞게 동사구로 자연스럽게 풀었습니다.
- source_word: עַד נֶצַח
  english_pob_choice: to the limit
  chosen_korean: 끝까지
  alternatives_korean:
  - 영원히
  - 철저히
  - 한계까지
  lexicon: HALOT
  rationale: 직역하면 ‘영원까지’이지만, 여기서는 지속 기간보다 철저함과 극한의 시험을 가리키는 관용적 표현으로 보이므로 ‘끝까지’로 옮겼습니다.
- source_word: בְּאַנְשֵׁי אָוֶן
  english_pob_choice: like wicked men / among wicked men
  chosen_korean: 악인들과 같은
  alternatives_korean:
  - 악인들 가운데 있는
  - 악인들과 더불어
  lexicon: HALOT
  rationale: 전치사 בְּ의 비교적 뉘앙스를 반영해 ‘같은’으로 옮겼습니다. POB의 각주가 지적한 비교/연관의 긴장을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 욥의 대답을 둘러싼 엘리후의 비난적 진술
  chosen_reading: 욥의 대답이 악인들과 유사하다고 보며, 그 점 때문에 욥이 철저히 시험받아야 한다는 청원으로 읽었습니다.
  alternative_readings:
  - 욥이 악인들 가운데 있는 것으로 본 읽기
  - 욥이 영원히 시험받는다는 읽기
  rationale: 본문은 문법적으로 난해하므로, 본문의 비난적 힘을 유지하되 시간적 과장이나 더 강한 신학적 단정을 덧붙이지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
