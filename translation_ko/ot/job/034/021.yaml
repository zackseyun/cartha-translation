source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
  footnotes:
  - marker: a
    text: Or 'a person's ways.' The Hebrew reads 'the ways of a man,' using a masculine singular form with generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분의 눈이 사람이 가는 길들 위에 있고, 그분께서 그의 모든 걸음을 보시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘사람’에 해당하는 말은 남성 단수형이지만, 일반적으로 모든 인간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינָיו
  english_pob_choice: his eyes
  chosen_korean: 그분의 눈
  alternatives_korean:
  - 그의 눈
  - 그 눈
  lexicon: HALOT
  rationale: 히브리어는 3인칭 남성 단수 접미사가 붙은 복수형이므로 복수 이미지인 ‘눈’을 살리되, 문맥상 하나님을 가리키는 점을 반영해 ‘그분의’로 자연스럽게 옮겼습니다.
- source_word: דַּרְכֵי אִישׁ
  english_pob_choice: the ways of a man
  chosen_korean: 사람의 길들
  alternatives_korean:
  - 한 남자의 길들
  - 사람의 삶의 길
  lexicon: HALOT
  rationale: ‘דֶּרֶךְ’의 ‘길/삶의 행로’라는 의미를 살려 ‘길들’로 옮겼고, 영어 POB의 각주처럼 남성 단수의 일반적 용법은 한국어에서는 ‘사람’으로 보편 의미를 드러냈습니다.
- source_word: יִרְאֶה
  english_pob_choice: he sees
  chosen_korean: 보십니다
  alternatives_korean:
  - 보십니다
  - 살피십니다
  - 지켜보십니다
  lexicon: HALOT
  rationale: 단순 시각 행위를 넘어 감찰의 뜻이 문맥에 강하므로, ‘보다’를 기본으로 하되 한국어에서 더 자연스럽게 감찰 의미를 드러내는 ‘보십니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 지속적 감찰을 현재형으로 표현할지 여부
  chosen_reading: ‘눈은 … 살피시며, … 보십니다’로 현재적이고 지속적인 감찰을 표현했습니다.
  alternative_readings:
  - ‘보실 것입니다’처럼 미래형으로 옮김
  - ‘주시고 계십니다’처럼 진행형으로 옮김
  rationale: 히브리어 미완료형은 여기서 일반적·지속적 진술의 힘을 가지므로, 한국어 현재형이 문맥의 상시적 감찰을 가장 잘 반영합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
