revisions:
- from: 그분의 눈은 사람의 길들을 살피시며, 그의 모든 걸음을 보십니다.[a]
  to: 이는 그분의 눈이 사람이 가는 길들 위에 있고, 그분께서 그의 모든 걸음을 보시기 때문입니다.[a]
  rationale: The revision restores the explanatory force of כִּי, preserves the imagery of God's eyes being upon a person's ways, retains the plural ‘ways’ and ‘all his steps,’ and clarifies the grammatical scope of the generic-masculine footnote. ‘사람이 가는 길들’ is a natural Korean expression for the person's ways without changing the generic reference.
