lexical_decisions:
- source_word: מִשְׁפָּט
  english_pob_choice: what is just
  chosen_korean: 의로운 것
  alternatives_korean:
  - 정의
  - 판결
  - 옳은 것
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법정 판결보다 도덕적·규범적 판단의 대상으로 쓰였으므로, ‘의로운 것’이 POB의 ‘what is just’를 자연스럽게 살리면서 의미 범위를 유지합니다.
- source_word: נִבְחֲרָה
  english_pob_choice: let us choose
  chosen_korean: 선택하자
  alternatives_korean:
  - 고르자
  - 택하자
  lexicon: HALOT
  rationale: 1인칭 공동 권유형의 선택 의지를 살리기 위해 평이한 명령형 공대 ‘선택하자’를 사용했습니다.
- source_word: לָּנוּ
  english_pob_choice: for ourselves
  chosen_korean: 우리를 위하여
  alternatives_korean:
  - 우리 자신을 위해
  - 우리에게
  lexicon: HALOT
  rationale: ל + 1인칭 복수는 자기 이익을 위한 결정을 가리키므로, ‘우리를 위하여’로 공동의 자기 관련성을 드러냈습니다.
- source_word: בֵינֵינוּ
  english_pob_choice: among ourselves
  chosen_korean: 우리끼리
  alternatives_korean:
  - 우리 가운데서
  - 서로
  lexicon: HALOT
  rationale: 집단 내부의 상호 숙의를 뜻하므로, 한국어 구어적이지만 의미가 분명한 ‘우리끼리’로 옮겼습니다.
- source_word: מַה טּוֹב
  english_pob_choice: what is good
  chosen_korean: 무엇이 선한지
  alternatives_korean:
  - 무엇이 좋은지
  - 무엇이 옳은지
  lexicon: HALOT
  rationale: טוֹב는 ‘좋다’보다 윤리적 판단의 뉘앙스를 살릴 수 있어, 문맥상 ‘선한지’로 옮겨 ‘의로운지’와 대응시켰습니다.
