    text: 또는 ‘우리 자신을 위해 정의를 선택합시다. 우리 가운데서 무엇이 선한지 분별합시다.’
    reason: מִשְׁפָּט can mean ‘justice,’ ‘judgment,’ or ‘what is right’; נֵדְעָה may contextually be rendered ‘discern.’
  revision_rationale: The revision preserves both first-person plural exhortations, renders the reflexive force naturally, avoids the added progressive sense of ‘알아가다,’ and maintains consistent modern formal-polite style. The footnote preserves the viable lexical alternatives without forcing a disputed nuance into the main text.
