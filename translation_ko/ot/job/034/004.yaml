  to: 우리 자신을 위해 옳은 것을 선택합시다[a]. 우리 가운데서 무엇이 선한지 알아봅시다.
  rationale: The revision preserves both first-person plural exhortations, renders the reflexive force naturally, avoids the added progressive sense of ‘알아가다,’ and maintains consistent modern formal-polite style. The footnote preserves the viable lexical alternatives without forcing a disputed nuance into the main text.
