translation:
  language: ko
  text: 그리고 악을 행하는 자들과 어울리며[a], 악한 남자들과 함께 걷습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 단순히 이동한다는 뜻보다 ‘함께 어울리다’ 또는 ‘동행하다’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ֭/חֶבְרָה
  english_pob_choice: and keeps company
  chosen_korean: 그리고 … 함께 어울리며
  alternatives_korean:
  - 그리고 …와 어울리며
  - 그리고 …와 함께 지내며
  - 그리고 …와 교제하며
  lexicon: HALOT
  rationale: אָרַח과 לְחֶבְרָה의 결합은 단순한 이동보다 교제·동행의 의미가 강하므로, 한국어에서는 자연스럽고 관계적 뉘앙스를 살리는 ‘함께 어울리다’로 옮겼습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: workers of wickedness
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 악행하는 사람들
  - 죄악의 일꾼들
  lexicon: HALOT
  rationale: פֹּעֲלֵי는 ‘행하는 자들/일하는 자들’의 구조이지만, 한국어에서는 직역형보다 ‘악을 행하는 자들’이 구성과 의미를 더 분명하게 전달합니다. אָוֶן의 핵심 의미는 도덕적 악/불의입니다.
- source_word: וְ/לָ/לֶכֶת
  english_pob_choice: and walks
  chosen_korean: 그리고 … 함께 걷습니다
  alternatives_korean:
  - 그리고 …와 함께 갑니다
  - 그리고 …와 동행합니다
  - 그리고 …의 길을 갑니다
  lexicon: HALOT
  rationale: הלך의 비유적 용례를 살려 삶의 행보를 나타내는 ‘걷다’로 유지했습니다. 앞절의 ‘어울리다’와 평행을 이루도록 공동행동의 이미지를 살렸습니다.
- source_word: אַנְשֵׁי רֶשַׁע
  english_pob_choice: men of evil
  chosen_korean: 불의를 행하는 사람들
  alternatives_korean:
  - 악한 사람들
  - 악의 사람들
  - 악을 행하는 남자들
  lexicon: HALOT
  rationale: אַנְשֵׁי의 남성 복수 표지를 한국어에서 노골적으로 재현하기보다, 문맥상 일반 독자에게 자연스러운 표현으로 옮기되 ‘사람들’로 집단성을 살렸습니다. רֶשַׁע는 여기서 단순 성향보다 실제적인 불의/악행을 가리킵니다.
theological_decisions:
- issue: 병행구의 도덕적 연합을 어떻게 드러낼 것인가
  chosen_reading: ‘함께 어울리며 … 함께 걷습니다’로 두 동사의 관계적·윤리적 연합을 분명히 표현했습니다.
  alternative_readings:
  - ‘동행합니다’로 평행을 단순화할 수 있음
  - ‘교제합니다’로 더 종교적 어감을 줄 수 있음
  rationale: 이 절은 단순한 이동 묘사가 아니라 악인들과의 연합을 비판하는 맥락이므로, 관계적 동사 선택이 해설 없이도 경고의 힘을 전달해야 합니다.
  doctrine_reference: Job 34:8의 문맥적 윤리 경고
