id: JOB.34.25
reference: Job 34:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
  footnotes:
  - marker: a
    text: Or 'he overthrows them by night.' The Hebrew does not state the object explicitly in 'he overturns,' but the context points to the wicked rulers under judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 그들의 행위를 알아보시며, 밤에 그들을 뒤엎으시고 그들은 짓눌려 부서집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뒤엎다’의 목적어를 직접 말하지 않지만, 문맥상 심판 아래 있는 악인들, 곧 권세자들을 가리킵니다. ‘밤에’는 ‘밤중에’ 또는 ‘밤을 틈타’로도 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞 절의 논증에서 이어지는 결론 표지이므로, 인과와 추론을 함께 살리는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: יַכִּיר
  english_pob_choice: he recognizes
  chosen_korean: 알아보시며
  alternatives_korean:
  - 인정하시며
  - 알아채시며
  - 살피시며
  lexicon: HALOT
  rationale: 히필 형태의 ‘인지하고 분별하여 알아봄’의 뜻을 살리되, 심판 맥락에 맞게 하나님의 능동적 판정을 드러내는 표현으로 옮겼습니다.
- source_word: וְהָפַךְ
  english_pob_choice: he overturns them
  chosen_korean: 그들을 뒤엎으시니
  alternatives_korean:
  - 그들을 전복하시니
  - 그들을 엎어버리시니
  - 그들을 뒤집으시니
  lexicon: HALOT
  rationale: ‘뒤엎다’는 전복·전도·역전의 이미지를 살리면서도 한국어로 과도하게 해석을 덧붙이지 않는 표현입니다. 영어 POB가 드러낸 묵시적 목적어를 따라 ‘그들을’로 보충했습니다.
- source_word: וְיִדַּכָּאוּ
  english_pob_choice: and they are crushed
  chosen_korean: 그들은 부서집니다
  alternatives_korean:
  - 그들은 짓눌립니다
  - 그들은 산산이 부서집니다
  - 그들은 سحق당합니다
  lexicon: HALOT
  rationale: דכא의 파괴·압궤 의미를 담되, 심판의 결과를 간결하고 강하게 드러내는 ‘부서집니다’를 택했습니다.
theological_decisions:
- issue: 본문에 나타나지 않은 목적어의 보충
  chosen_reading: ‘그들을’은 히브리어에서 생략된 목적어를 문맥에 따라 보충한 것으로, 앞뒤 문맥이 가리키는 악인/권세자들을 뜻합니다.
  alternative_readings:
  - 목적어를 드러내지 않고 ‘뒤엎으시며’로 두는 읽기
  - ‘밤’을 목적어처럼 오해하는 직역적 읽기
  rationale: 34:24–26의 문맥은 하나님께서 악한 권세자들을 심판하시는 장면이므로, 한국어에서도 생략된 대상을 명시해야 의미가 분명해집니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source의 생략을 문맥에 따라 적절히 보충하되 의미를 확장하지 않음.'
