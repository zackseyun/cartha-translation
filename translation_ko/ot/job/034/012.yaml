source:
  edition: WLC
  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
  footnotes:
  - marker: a
    text: Or, 'God does not condemn unjustly' or 'God does not declare guilty.' The Hebrew verb can carry a judicial sense in some contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 하나님은 악하게 행하지 않으시고[a], 전능하신 분은 정의를 왜곡하지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님은 부당하게 정죄하지 않으신다’ 혹은 ‘죄 있다고 선고하지 않으신다’로도 옮길 수 있습니다. 히브리어 동사는 어떤 문맥에서는 법정적 의미를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 정녕
  - 실로
  - 과연
  lexicon: HALOT
  rationale: 확언과 강조의 결합을 한국어에서 자연스럽게 살리기 위해 ‘참으로’를 택했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이신 분
  - 신
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 하나님을 가리키는 신칭으로 보아, 프로젝트 기본어인 ‘하나님’이 가장 직접적입니다.
- source_word: יַרְשִׁיעַ
  english_pob_choice: does not act wickedly
  chosen_korean: 악하게 행하지 않으시고
  alternatives_korean:
  - 죄악을 행하지 않으시고
  - 부당하게 정죄하지 않으시고
  - 악을 행하지 않으시고
  lexicon: HALOT
  rationale: 법정적 ‘정죄하다’의 가능성은 있으나, 본절의 평행구와 문맥상 하나님의 도덕적·재판적 정직성을 포괄하는 ‘악하게 행하다’가 더 넓고 자연스럽습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 직역보다 한국어에서 통용되는 신칭을 택해, ‘전능하신 분’으로 하나님의 호칭을 살렸습니다.
- source_word: יְעַוֵּת
  english_pob_choice: does not pervert
  chosen_korean: 굽히지 않으십니다
  alternatives_korean:
  - 비틀지 않으십니다
  - 왜곡하지 않으십니다
  - 일그러뜨리지 않으십니다
  lexicon: HALOT
  rationale: ‘곧게 된 것을 비뚤게 만들다’는 뜻을 한국어 동사 ‘굽히다’로 간결하게 옮겨, ‘정의’와의 결합을 자연스럽게 했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 재판
  - 판결
  lexicon: HALOT
  rationale: 여기서는 개인 사건의 판결보다 하나님의 공정한 판정 기준을 가리키므로, 현대 한국어에서 가장 분명한 ‘정의’를 택했습니다.
theological_decisions:
- issue: יַרְשִׁיעַ의 법정적 가능성
  chosen_reading: ‘악하게 행하지 않으시고’로 넓게 번역해 하나님의 도덕적·재판적 무흠함을 함께 드러냈습니다.
  alternative_readings:
  - 부당하게 정죄하지 않으시고
  - 죄 있다고 선고하지 않으시고
  rationale: 히필 동사의 법정적 의미는 주석적으로 보존하되, 본절의 평행법이 요구하는 넓은 의미를 한국어 본문에 반영했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
