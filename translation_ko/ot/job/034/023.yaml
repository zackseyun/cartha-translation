revisions:
- from: 그는 한 사람에게 다시 시간을 정하지 않으시고, 하나님께 나아가 심판을 받게 하십니다.[a]
  to: 이는 하나님께서 사람이 하나님 앞에 나아가 심판을 받을 시간을 다시 정하지 않으시기 때문입니다.[a]
  rationale: 개정문은 ‘시간’을 원문의 생략된 목적어로 보충하되, 그것이 ‘하나님 앞에 나아가 심판을 받을’ 시간이라는 관계를 문법적으로 명확히 합니다. 또한 ‘이는 … 때문입니다’로 כִּי의 근거·설명 기능을 살렸습니다. 어려운 עוֹד와 생략된 목적어의 불확실성은 본문에서 과도하게 단정하지 않고 각주에 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:47:57Z'
