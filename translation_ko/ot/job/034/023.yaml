    rationale: ‘다시 시간을 정하지 않으시고, … 받게 하십니다’는 원문에 없는 긍정적 사역 동사절을 형성합니다. לַהֲלֹךְ 이하가 ‘정하다’에 딸린 내용이 되도록 ‘… 나아가 심판을 받을 시간을 다시 정하지 않으십니다’로 고쳐야 합니다.
