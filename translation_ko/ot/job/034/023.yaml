source:
  edition: WLC
  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
  footnotes:
  - marker: a
    text: Or, 'For he does not set any further time for a man to go before God in judgment.' The Hebrew is difficult and compressed; the sense is that God needs no additional hearing or delay before judging.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 하나님께서 사람이 하나님 앞에 나아가 심판을 받을 시간을 다시 정하지 않으시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그가 사람이 하나님께 심판을 받으러 나아갈 것을 더 정하지 않으신다’입니다. 히브리어는 압축적이며, ‘다시’는 ‘더 이상’ 또는 ‘추가로’로도 이해될 수 있습니다. 많은 해석은 하나님께서 심판 전에 사람에게 별도의 추가 기일이나 지연을 정하실 필요가 없으심을 뜻한다고 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그는
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 설명을 잇는 접속 의미를 한국어에서는 자연스럽게 주어를 이어 받는 문장으로 처리했습니다. 여기서는 원문의 논리 연결을 살리되 한국어 어순상 과도한 접속부사를 피했습니다.
- source_word: עַל אִישׁ
  english_pob_choice: for a man
  chosen_korean: 한 사람에게
  alternatives_korean:
  - 사람 위에
  - 사람에게
  lexicon: HALOT
  rationale: עַל + אישׁ의 부담/대상 관계를 한국어에서는 '에게'로 옮기는 것이 가장 자연스럽고, '한 사람'으로 단수 일반성을 유지했습니다.
- source_word: יָשִׂים עוֹד
  english_pob_choice: does not set a time
  chosen_korean: 다시 시간을 정하지 않으시고
  alternatives_korean:
  - 더는 시간을 정하지 않으시고
  - 추가 시간을 정하지 않으시고
  lexicon: HALOT
  rationale: עוֹד의 '더/다시/추가로'라는 중의성을 한국어로 직접 드러내기보다, 문맥상 요구되는 '추가 심리 기일'의 뉘앙스를 살려 '다시 시간을 정하다'로 옮겼습니다.
- source_word: לַהֲלֹךְ אֶל אֵל בַּמִּשְׁפָּט
  english_pob_choice: to go before God in judgment
  chosen_korean: 하나님께 나아가 심판을 받게 하십니다
  alternatives_korean:
  - 하나님 앞에 나아가 재판을 받게 하십니다
  - 하나님께 나아가 판단을 받게 하십니다
  lexicon: HALOT
  rationale: לֶךְ/הלך와 אֶל אֵל을 법정적 맥락에 맞춰 '하나님께 나아가'로, מִשְׁפָּט을 '심판'으로 옮겨 법정 출두의 장면을 한국어로 분명히 했습니다.
theological_decisions:
- issue: יַשִׂים + עוֹד의 압축된 법정적 의미
  chosen_reading: 하나님은 사람에게 추가 심리 기일을 따로 정해 둘 필요가 없으십니다.
  alternative_readings:
  - 하나님은 사람을 다시 불러 세울 시간을 정하지 않으십니다.
  - 하나님은 사람에게 더 기다릴 시간을 정하지 않으십니다.
  rationale: 히브리어는 매우 압축되어 있지만, 문맥상 하나님이 판단을 미루거나 재청문을 필요로 하지 않는다는 뜻이 가장 잘 맞습니다. 한국어 본문은 이를 지나치게 풀지 않으면서도 독자가 법정적 긴장을 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
