translation:
  language: ko
  text: 누가 욥처럼 조롱을 물처럼 마시는 사람이겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  english_pob_choice: What man
  chosen_korean: 누가 욥 같은 사람이 있겠습니까?
  alternatives_korean:
  - 어떤 사람이 욥 같겠습니까?
  - 누가 욥 같은 남자가 있겠습니까?
  lexicon: HALOT
  rationale: מִי גֶבֶר의 수사적 놀람을 한국어에서는 자연스러운 반문으로 풀어, ‘누가… 있겠습니까?’로 강한 비교의 어조를 살렸습니다. גֶבֶר는 여기서 ‘사람’보다 구어적 과장을 살리는 ‘사람’이 가장 자연스럽습니다.
- source_word: כְּאִיּוֹב
  english_pob_choice: like Job
  chosen_korean: 욥 같은
  alternatives_korean:
  - 욥처럼
  - 욥과 같은
  lexicon: HALOT
  rationale: 비교 접두 כ의 의미를 직역보다 자연스러운 관형 표현 ‘-같은’으로 옮겨, 욥을 기준점으로 삼는 비교를 분명히 했습니다.
- source_word: יִשְׁתֶּה
  english_pob_choice: drinks
  chosen_korean: 마십니다
  alternatives_korean:
  - 마시고 있습니다
  - 마셔 버립니다
  lexicon: HALOT
  rationale: 현재형의 관습적·성격 묘사 기능을 한국어 현재 서술형 ‘마십니다’로 옮겨, 욥의 지속적 태도를 드러냈습니다.
- source_word: לַּעַג
  english_pob_choice: mockery
  chosen_korean: 조롱
  alternatives_korean:
  - 비웃음
  - 경멸
  lexicon: HALOT
  rationale: לַּעַג는 단순한 추상적 경멸보다 조롱하는 말과 행동의 뉘앙스가 강하므로, 한국어에서도 가장 직접적인 대응인 ‘조롱’을 택했습니다.
- source_word: כַּמָּיִם
  english_pob_choice: like water
  chosen_korean: 물처럼
  alternatives_korean:
  - 물같이
  - 물과 같이
  lexicon: HALOT
  rationale: ‘물처럼’은 경멸을 아주 쉽고 많이 받아들인다는 비유를 현대 한국어로 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 욥이 조롱을 ‘마신다’는 은유의 보존
  chosen_reading: 은유를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘조롱을 당합니다’처럼 의미를 설명적으로 풀기
  - ‘조롱을 받아들입니다’로 완곡화하기
  rationale: 본문은 조롱을 음료처럼 들이켜는 강한 비유를 사용하므로, 이를 설명문으로 바꾸면 수사적 충격과 인간의 처지를 고발하는 힘이 약해집니다.
  doctrine_reference: 성경 문체의 수사적 진술 보존
- issue: 수사 의문문의 한국어 처리
  chosen_reading: 반문형으로 옮겨 청중의 놀라움을 유지했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 ‘욥 같은 사람은 없습니다’라고 번역하기
  rationale: 히브리어 מִי의 수사적 질문은 단순 정보 요청이 아니라 놀라움과 비교 불가능성을 드러내므로, 한국어에서도 의문형을 유지하는 것이 적절합니다.
  doctrine_reference: 히브리어 수사법 보존
