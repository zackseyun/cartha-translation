  - 주어를 드러내지 않는 비인칭 표현
  - ‘그분은’ 대신 생략형 표현
  rationale: 엘리후의 논증 흐름에서 하나님이 권세자들을 내리치고 다른 이들을 세우시는 분으로 일관되게 묘사되므로, 원문의 함축된 주어를 한국어에서 명시하는 것이 자연스럽습니다.
