  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
  footnotes:
  - marker: a
    text: Or 'without inquiry' / 'without searching.' The Hebrew phrase literally reads 'not investigation/searching,' expressing that no prolonged examination is needed before he overthrows the mighty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 조사하지 않으시고[a] 권세 있는 자들을 꺾으시며, 다른 이들을 그들의 자리에 세우십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘조사/탐색 없음’입니다. 이는 하나님께서 권세 있는 자들을 꺾으시기 전에 사람처럼 조사하거나 탐색하실 필요가 없으심을 나타냅니다.
    reason: lexical_alternative
