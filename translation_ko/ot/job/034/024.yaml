  naturalness: ‘권세 있는 자들’과 ‘꺾으시고’가 현대 표준 한국어에서 더 자연스럽고 문맥에 맞습니다. 각주 표지는 설명 대상인 ‘조사하지 않으시고’ 바로 뒤에 두는 편이 독자의 이해에 명확합니다.
