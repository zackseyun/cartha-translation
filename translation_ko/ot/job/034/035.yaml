lexical_decisions:
- source_word: אִיּוֹב
  english_pob_choice: Job
  chosen_korean: 욥
  alternatives_korean:
  - 욥기의 욥
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 고유명사 אִיּוֹב은 한국어 성경에서 확립된 형태인 ‘욥’으로 옮기는 것이 가장 자연스럽고 식별성이 높습니다.
- source_word: בְדַעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이
  alternatives_korean:
  - 지식 없이
  - 알지 못한 채
  - 지식과 함께하지 않고
  lexicon: HALOT
  rationale: ב + דעת의 부정적 수식은 ‘without knowledge’의 의미이므로, 한국어에서는 ‘지식 없이’가 가장 직접적이고 시적 병행을 살립니다.
- source_word: דְבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말들은
  alternatives_korean:
  - 그의 말
  - 그의 말씀들
  - 그가 하는 말은
  lexicon: HALOT
  rationale: דברים의 복수는 여기서 ‘말/발언’의 뜻이므로, ‘그의 말들’로 옮겨 병행 구조를 드러냈습니다.
- source_word: בְהַשְׂכֵּיל
  english_pob_choice: without understanding
  chosen_korean: 이해 없이
  alternatives_korean:
  - 이해 없이
  - 분별 없이
  - 깨달음 없이
  lexicon: HALOT
  rationale: שכל 계열은 이해, 분별, 지혜로운 판단을 뜻하므로, 앞의 ‘지식’과 대구를 이루는 ‘이해 없이’가 가장 균형 잡힌 번역입니다.
theological_decisions:
- issue: Elihu의 평가적 진술을 한국어에서 너무 완곡하게 만들지 않을지
  chosen_reading: 직설적인 평가 진술로 유지했습니다.
  alternative_readings:
  - ‘욥은 지식이 없다고 말합니다’처럼 중화
  - ‘욥은 지식 없이 말합니다’보다 더 부드러운 표현
  rationale: 본문은 엘리후의 욥에 대한 직접적 평가이므로, 판단의 날카로움을 약화시키지 않고 평가 문장을 그대로 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 문맥 충실성 및 화자 평가 보존
- issue: לֹא + בְ구문을 한국어에서 어떻게 처리할지
  chosen_reading: 반복되는 ‘בלי/without’ 뉘앙스를 살려 ‘없이’로 옮겼습니다.
  alternative_readings:
  - ‘~하지 않고’
  - ‘~와 함께하지 않고’
  rationale: 히브리어의 부정적 수식구조는 단순 부정 동사보다 상태 부재를 나타내므로, 한국어 ‘없이’가 가장 자연스럽고 원문 효과를 잘 전달합니다.
  doctrine_reference: 히브리어 부정적 방식 표지
