source:
  edition: WLC
  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
  footnotes:
  - marker: a
    text: Or “my right” or “the justice due me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 욥이 말하기를 ‘나는 옳습니다. 그리고 하나님이 내 공의를 빼앗으셨습니다’라고 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 권리” 또는 “내게 마땅한 공의”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 설명을 이어 주는 연결로서, 문맥상 원인 설명을 담되 한국어에서 자연스러운 서술 연결인 ‘이는’이 적절합니다.
- source_word: צָדַקְתִּי
  english_pob_choice: I am in the right
  chosen_korean: 나는 옳습니다
  alternatives_korean:
  - 나는 의롭습니다
  - 나는 정당합니다
  lexicon: HALOT
  rationale: 이 표현은 욥이 자기 입장에서 옳다고 주장하는 법정적·논쟁적 뉘앙스를 가지므로, 도덕적 완전성을 강하게 암시하는 ‘의롭습니다’보다 ‘옳습니다’가 더 가깝습니다.
- source_word: הֵסִיר
  english_pob_choice: has taken away
  chosen_korean: 빼앗으셨습니다
  alternatives_korean:
  - 거두셨습니다
  - 제거하셨습니다
  - 없애셨습니다
  lexicon: HALOT
  rationale: מִשְׁפָּטִי와 함께 쓰일 때 단순히 옮기다보다 부당하게 빼앗긴 느낌이 살아나도록 ‘빼앗으셨습니다’로 옮겼습니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 내 공의
  alternatives_korean:
  - 내 권리
  - 내 न्याय
  - 내 재판
  lexicon: HALOT
  rationale: 이 단어는 ‘권리’와 ‘공의/정당함’ 사이의 의미 긴장을 함께 지니므로, 한국어에서 법적 권리의 뉘앙스도 담을 수 있는 ‘공의’로 옮겨 본문은 간결하게 유지했습니다.
theological_decisions:
- issue: מִשְׁפָּטִי의 의미 긴장 유지
  chosen_reading: 본문에는 ‘내 공의’를 두고, ‘내 권리’의 가능성은 각주로 남깁니다.
  alternative_readings:
  - 내 권리
  - 내가 받아야 할 공의
  - 내 사건
  rationale: 이 구절은 욥이 하나님이 자신에게 마땅한 판단을 빼앗으셨다고 주장하는 장면이므로, 단일한 한국어 의미로 좁히기보다 법적·윤리적 중첩을 보존하는 편이 소스에 충실합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 욥의 자기 진술의 강도
  chosen_reading: ‘나는 옳습니다’로 번역해 욥의 자기변호를 법정적 진술로 유지합니다.
  alternative_readings:
  - 나는 의롭습니다
  - 나는 무죄합니다
  rationale: 본문은 욥의 무죄 선언 일반이 아니라 논쟁 속 자기 주장입니다. 따라서 신학적으로 더 강한 ‘의롭습니다’나 ‘무죄합니다’보다 문맥상 중립적인 법정 표현이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
