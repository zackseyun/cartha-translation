source:
  edition: WLC
  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
  footnotes:
  - marker: a
    text: Or 'without human hand'; the Hebrew literally says 'not by hand,' likely indicating removal apart from human agency.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 잠깐 사이에 죽습니다. 한밤중에 한 백성이 흔들리고 사라지며, 용사들은 손으로 말미암지 않고 제거됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 손 없이’. 히브리어는 문자적으로 ‘손으로 말미암지 않고’라고 하며, 아마 인간의 개입이 없는 제거를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  english_pob_choice: in a moment
  chosen_korean: 잠깐 사이에
  alternatives_korean:
  - 순간에
  - 즉시
  lexicon: HALOT
  rationale: 짧은 시간을 가리키는 명사로, 한국어에서는 ‘잠깐 사이에’가 순간성을 자연스럽게 살리면서도 과장되지 않습니다.
- source_word: וַחֲצוֹת לָיְלָה
  english_pob_choice: at midnight
  chosen_korean: 한밤중에
  alternatives_korean:
  - 자정에
  - 밤중에
  lexicon: HALOT
  rationale: 직역형보다 ‘한밤중에’가 관용적이며, 히브리어의 ‘밤의 한가운데’라는 시점을 잘 전달합니다.
- source_word: יְגֹעֲשׁוּ עָם
  english_pob_choice: a people are shaken
  chosen_korean: 한 백성이 흔들리고
  alternatives_korean:
  - 백성이 요동치고
  - 한 민족이 뒤흔들리고
  lexicon: HALOT
  rationale: 단수 집합명사 עָם을 ‘한 백성’으로 살리고, געשׁ의 흔들림/동요를 ‘흔들리고’로 옮겨 급작스러운 혼란을 드러냈습니다.
- source_word: לֹא בְיָד
  english_pob_choice: not by hand
  chosen_korean: 손으로 말미암지 않고
  alternatives_korean:
  - 사람의 손 없이
  - 손에 의하지 않고
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 살리면서도 한국어에서 의미가 분명하도록 ‘손으로 말미암지 않고’로 옮겼습니다. 이는 인간의 개입이 아니라는 뉘앙스를 보존합니다.
theological_decisions:
- issue: ‘not by hand’의 행위 주체
  chosen_reading: 본문의 표현을 직접 살려, 용사들의 제거가 인간의 손이 아니라는 점을 남겨 두었습니다.
  alternative_readings:
  - 사람의 손 없이
  - 인간의 손을 거치지 않고
  rationale: 본문은 제거의 주체를 명시하지 않으므로, 해석을 지나치게 좁히지 않고 하나님의 주권적 행위를 암시하는 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3; providence and divine sovereignty in judgment
