base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
  footnotes:
  - marker: a
    text: Or 'without human hand'; the Hebrew literally says 'not by hand,' likely indicating removal apart from human agency.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 잠깐 사이에 죽습니다. 한밤중에 한 백성이 흔들리고 사라지며, 강한 자는 사람의 손을 거치지 않고 제거됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 손 없이’. 히브리어는 문자적으로 ‘손으로 하지 않고’라고 하며, 아마 인간의 개입 없이 제거되는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  english_pob_choice: in a moment
  chosen_korean: 잠깐 사이에
  alternatives_korean:
  - 순간에
  - 즉시
  lexicon: HALOT
  rationale: 짧은 시간을 가리키는 명사로, 한국어에서는 ‘잠깐 사이에’가 순간성을 자연스럽게 살리면서도 과장되지 않습니다.
- source_word: וַחֲצוֹת לָיְלָה
  english_pob_choice: at midnight
  chosen_korean: 한밤중에
  alternatives_korean:
