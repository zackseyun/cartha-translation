  lexicon: HALOT
  rationale: 직역형보다 ‘한밤중에’가 관용적이며, 히브리어의 ‘밤의 한가운데’라는 시점을 잘 전달합니다.
- source_word: יְגֹעֲשׁוּ עָם
  english_pob_choice: a people are shaken
  chosen_korean: 한 백성이 흔들리고
  alternatives_korean:
  - 백성이 요동치고
  - 한 민족이 뒤흔들리고
  lexicon: HALOT
  rationale: 단수 집합명사 עָם을 ‘한 백성’으로 살리고, געשׁ의 흔들림/동요를 ‘흔들리고’로 옮겨 급작스러운 혼란을 드러냈습니다.
- source_word: לֹא בְיָד
  english_pob_choice: not by hand
  chosen_korean: 손으로 말미암지 않고
  alternatives_korean:
  - 사람의 손 없이
  - 손에 의하지 않고
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 살리면서도 한국어에서 의미가 분명하도록 ‘손으로 말미암지 않고’로 옮겼습니다. 이는 인간의 개입이 아니라는 뉘앙스를 보존합니다.
theological_decisions:
- issue: ‘not by hand’의 행위 주체
  chosen_reading: 본문의 표현을 직접 살려, 용사들의 제거가 인간의 손이 아니라는 점을 남겨 두었습니다.
  alternative_readings:
  - 사람의 손 없이
  - 인간의 손을 거치지 않고
  rationale: 본문은 제거의 주체를 명시하지 않으므로, 해석을 지나치게 좁히지 않고 하나님의 주권적 행위를 암시하는 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3; providence and divine sovereignty in judgment
