  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
  footnotes:
  - marker: a
    text: Or, 'Should he repay according to you?' The Hebrew opening is idiomatic and difficult; the sense is that God's recompense is not determined by Job's preference.
    reason: lexical_alternative
  - marker: b
    text: '''Rejected it'' may refer to God''s judgment, God''s way of governing, or the proposed recompense.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신이 그것을 거절했기 때문에,[b] 그분이 당신의 판단에 따라[a] 보응하시겠습니까? 선택하는 것은 내가 아니라 당신입니다. 그러므로 당신이 아는 바를 말하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그분이 당신을 따라 보응하시겠습니까?’ 히브리어 서두는 관용적 표현으로 이해하기 어렵습니다. 그 의미는 하나님의 보응이 욥의 선호에 따라 결정되지 않는다는 것입니다.
    reason: lexical_alternative
