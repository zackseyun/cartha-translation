    text: 또는, '그분이 당신에게 따라 갚으시겠습니까?' 히브리어 서두는 관용적 표현이며 이해하기 어렵습니다. 의미는 하나님의 보상이 욥의 선호에 따라 결정되지 않는다는 것입니다.
    reason: alternative_reading
