source:
  edition: WLC
  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
  footnotes:
  - marker: a
    text: Or 'shadow of death'; the Hebrew term can also denote very deep darkness or gloom in poetic contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠도 없고 깊은 그늘도 없어서 악을 행하는 자들이 거기서 숨을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깊은 그늘’은 전통적 ‘사망의 그늘’에 해당하는 어휘로도 읽을 수 있으나, 여기서는 짙은 어둠의 뜻을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  english_pob_choice: There is no ... and no ...
  chosen_korean: …도 없고 …도 없어서
  alternatives_korean:
  - …이 없습니다
  - …도 없고 …도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 존재 부정 병렬을 한국어에서 자연스럽게 살려, 두 항목 모두에 대한 결핍을 분명히 했습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 암흑
  - 어둠
  lexicon: HALOT
  rationale: 시어적 맥락에서 가장 자연스럽고, 뒤의 ‘깊은 그늘’과 함께 은폐 불가능성을 드러내는 기본 의미를 살렸습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep shadow
  chosen_korean: 깊은 그늘
  alternatives_korean:
  - 사망의 그늘
  - 깊은 어둠
  - 짙은 그늘
  lexicon: HALOT
  rationale: 문맥이 죽음 자체보다 ‘숨음’의 불가능성을 말하므로, 전통적 직역보다 심화된 어둠의 이미지를 살린 표현을 택했습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: workers of wickedness
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 악행하는 자들
  - 불법의 일꾼들
  lexicon: HALOT
  rationale: ‘일하는/행하는’의 동사적 이미지는 유지하되, 한국어에서는 ‘악을 행하는 자들’이 원문의 도덕적 성격을 가장 분명하게 전달합니다.
theological_decisions:
- issue: 욥기 34:22의 은폐 불가능성 표현
  chosen_reading: 어둠과 깊은 그늘이 있어도 악을 행하는 자들이 숨을 수 없다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 하나님의 심판을 직접 언급하는 해석
  - ‘사망의 그늘’ 중심의 전통적 표현
  rationale: 이 절은 죽음 언급보다 하나님의 감찰 앞에서의 은폐 불가능성을 강조하므로, 본문이 말하는 기능적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
