id: JOB.34.32
reference: Job 34:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
  footnotes:
  - marker: a
    text: Or, more literally, 'What I do not see, show me/teach me.' The Hebrew is elliptical and may also be rendered 'Apart from what I see, you teach me.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'I will add no more,' that is, 'I will not continue' or 'I will not do it again.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 보지 못하는 것을 당신이 가르쳐 주십니다. 내가 만일 잘못을 행했다면, 다시는 반복하지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제가 보지 못하는 것(을) 당신이 가르쳐 주십니다’라는 뜻으로도 읽을 수 있으며, 히브리어는 생략된 말을 보충해야 하는 축약 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘더하지 않겠습니다’이며, ‘계속하지 않겠습니다’ 또는 ‘다시 하지 않겠습니다’의 뜻으로도 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶ֭חֱזֶה
  english_pob_choice: What I do not see
  chosen_korean: 제가 보지 못하는 것을
  alternatives_korean:
  - 제가 알지 못하는 것을
  - 제가 보지 못하는 바를
  - 저에게 보이지 않는 것을
  lexicon: HALOT
  rationale: 히브리어는 ‘보지 못하는 것/인식하지 못하는 것’의 축약된 표현으로 보이므로, 한국어에서는 목적어형으로 풀어 자연스럽게 옮겼습니다.
- source_word: אַתָּה הֹרֵנִי
  english_pob_choice: you teach me
  chosen_korean: 당신이 가르쳐 주십니다
  alternatives_korean:
  - 당신이 보여 주십니다
  - 당신이 일러 주십니다
  - 당신이 가르치십니다
  lexicon: HALOT
  rationale: הורה의 사역형은 ‘가르치다/지시하다’의 의미가 기본이므로 ‘가르쳐 주십니다’로 옮겨, 바로 뒤의 교정·훈계적 문맥을 살렸습니다.
- source_word: עָוֶל פָּעַלְתִּי
  english_pob_choice: if I have done wrong
  chosen_korean: 내가 만일 잘못을 행했다면
  alternatives_korean:
  - 내가 만일 불의를 행했다면
  - 내가 만일 악을 행했다면
  - 내가 만일 그릇되게 행했다면
  lexicon: HALOT
  rationale: עָוֶל은 단순한 ‘실수’보다 도덕적 왜곡이 있는 잘못을 가리키므로, 너무 약화시키지 않으면서도 자연스러운 한국어로 ‘잘못을 행하다’라고 옮겼습니다.
- source_word: לֹא אֹסִיף
  english_pob_choice: I will not do it again
  chosen_korean: 다시는 반복하지 않겠습니다
  alternatives_korean:
  - 더는 하지 않겠습니다
  - 더 이상 계속하지 않겠습니다
  - 다시 더하지 않겠습니다
  lexicon: HALOT
  rationale: יסף의 부정형은 ‘더하지 않다/계속하지 않다’의 뜻으로, 한국어에서는 생략된 목적을 드러내어 ‘반복하지 않겠습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: '욥의 태도: 배움과 중단의 결심'
  chosen_reading: 이 절을 하나님 앞에서 교정을 받아들이는 자세와 잘못을 계속하지 않겠다는 결심으로 옮겼습니다.
  alternative_readings:
  - 더 강한 회개 공식으로 번역하기
  - 단순 정보 전달로만 번역하기
  rationale: 히브리어는 죄책 고백을 과장하기보다, 알려 주심을 요청하고 잘못을 더하지 않겠다는 태도를 드러냅니다. 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
