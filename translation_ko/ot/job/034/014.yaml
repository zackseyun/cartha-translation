source:
  edition: WLC
  text: אִם יָשִׂ֣ים אֵלָ֣י/ו לִבּ֑/וֹ רוּח֥/וֹ וְ֝/נִשְׁמָת֗/וֹ אֵלָ֥י/ו יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
  footnotes:
  - marker: a
    text: Or 'If he should set his heart to this, and gather to himself his spirit and his breath.' The Hebrew expression 'set his heart' may mean to direct his attention or purpose.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 자기에게 마음을 두고, 자기의 영과 자기의 숨을 거두어 가신다면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기에게 마음을 두고’는 ‘마음을 그에게 두다/그 일에 두다’로도 옮길 수 있으며, 히브리어 표현은 주의를 돌리거나 의도를 정한다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - if
  - 그렇다면
  lexicon: HALOT
  rationale: 히브리어 조건절을 자연스럽게 여는 표지로 ‘만일’을 사용해, 가정적 의미를 유지했습니다.
- source_word: יָשִׂים אֵלָיו לִבּוֹ
  english_pob_choice: should set his heart on himself
  chosen_korean: 자기에게 마음을 두고
  alternatives_korean:
  - 자기 자신에게 마음을 두고
  - 자기에게 마음을 정하고
  lexicon: HALOT
  rationale: ‘마음을 두다’는 히브리어 ‘마음을 두다/향하다’의 관용적 의미를 살리면서도 한국어로는 자연스럽게 ‘집중하다, 주의를 두다’의 뜻이 드러납니다.
- source_word: רוּחוֹ וְנִשְׁמָתוֹ
  english_pob_choice: his spirit and his breath
  chosen_korean: 자기의 영과 자기의 숨
  alternatives_korean:
  - 자기의 영과 자기의 호흡
  - 자기의 숨결과 자기의 숨
  lexicon: HALOT
  rationale: רוּחַ와 נְשָׁמָה를 구별해, 전자는 ‘영’, 후자는 생명-호흡으로서의 ‘숨’으로 옮겨 병렬 구조를 보존했습니다.
- source_word: יֶאֱסֹף
  english_pob_choice: gather
  chosen_korean: 거두어 가신다면
  alternatives_korean:
  - 거두신다면
  - 모으신다면
  - 가져가신다면
  lexicon: HALOT
  rationale: 직역의 ‘거두다’에 이동 방향을 덧붙인 ‘거두어 가다’는 문맥상 하나님이 생명을 회수하신다는 뜻을 자연스럽게 드러내며, 단순한 ‘모으다’보다 의미를 분명하게 합니다.
theological_decisions:
- issue: 1인칭 재귀 표현의 대상과 하나님의 주권
  chosen_reading: 주어와 목적어 모두 하나님을 가리키는 것으로 읽어, ‘자기에게’와 ‘거두어 가신다면’으로 표현했습니다.
  alternative_readings:
  - ‘자기에게 마음을 두고’를 더 추상적으로 ‘그 일에 마음을 두고’로 완화하는 읽기
  rationale: 욥기의 논지상 이는 하나님이 생명과 호흡을 주고 거두시는 주권을 말하는 가정문이므로, 반사적 의미를 분명히 하되 문맥의 신학적 긴장을 유지했습니다.
  doctrine_reference: 하나님의 주권과 생명에 대한 권한
- issue: ‘영’과 ‘숨’의 구별 유지
  chosen_reading: רוּחַ와 נְשָׁמָה를 같은 말로 합치지 않고 각각 ‘영’과 ‘숨’으로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘호흡’으로 통일
  rationale: 본문의 평행법은 두 표현을 나란히 두어 생명 원리를 반복 강조하므로, 한국어에서도 구별을 남겨 원문의 힘을 보존했습니다.
  doctrine_reference: 히브리어 평행법과 인간 생명 이해
