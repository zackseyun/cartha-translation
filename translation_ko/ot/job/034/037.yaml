source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
  footnotes:
  - marker: a
    text: Or 'he strikes his hands together'; the gesture likely conveys scorn, defiance, or mockery.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''to God.'' The Hebrew preposition can be read more neutrally as direction (''to''), but the context favors an adversative sense: ''against God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자기 죄에 반역을 더합니다. 우리 가운데서 손뼉을 칩니다.[a] 그리고 하나님을 거슬러 말을 많이 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손을 맞부딪친다’로 옮길 수 있습니다. 이 동작은 조롱, 경멸, 또는 도전의 몸짓을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께’로도 읽을 수 있습니다. 히브리어 전치사는 중립적인 방향을 나타낼 수도 있으나, 문맥상 ‘하나님을 거슬러’라는 적대적 뜻이 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹסִיף עַל חַטָּאתוֹ פֶשַׁע
  english_pob_choice: he adds rebellion to his sin
  chosen_korean: 자기 죄에 반역을 더하고
  alternatives_korean:
  - 자기 죄에 죄를 더하고
  - 자기 죄 위에 반역을 더하고
  lexicon: HALOT
  rationale: יֹסִיף עַל은 ‘더하다’의 중첩 이미지로 읽고, פֶשַׁע는 단순한 잘못보다 반항·반역의 뉘앙스를 살려 ‘반역’으로 옮겼습니다.
- source_word: בֵּינֵינוּ
  english_pob_choice: among us
  chosen_korean: 우리 가운데서
  alternatives_korean:
  - 우리 사이에서
  - 우리 중에
  lexicon: HALOT
  rationale: 직역의 ‘우리 사이에’보다 한국어에서 자연스러운 공동체 내부 장면을 살려 ‘우리 가운데서’로 옮겼습니다.
- source_word: יִסְפּוֹק
  english_pob_choice: he claps his hands
  chosen_korean: 손뼉을 치며
  alternatives_korean:
  - 손을 맞부딪치며
  - 손뼉을 치고
  lexicon: HALOT
  rationale: 이 동사는 조롱·경멸의 몸짓으로 이해되므로, 본문 이미지를 유지하는 기본 번역을 택하고 그 함의를 과도하게 풀지 않았습니다.
- source_word: לָאֵל
  english_pob_choice: against God
  chosen_korean: 하나님을 거슬러
  alternatives_korean:
  - 하나님께
  - 하나님을 향해
  lexicon: HALOT
  rationale: 문맥상 단순한 도달 방향이 아니라 적대적 대립을 드러내므로, ‘against God’의 의미를 한국어 동사구 ‘거슬러’로 표현했습니다.
theological_decisions:
- issue: לָאֵל의 관계를 ‘to God’로 완화할지, 적대적 의미로 유지할지
  chosen_reading: 하나님을 거슬러
  alternative_readings:
  - 하나님께
  - 하나님을 향해
  rationale: 엘리후의 논지는 죄에 반역을 더하고 공개적으로 조롱의 몸짓을 보이며, 말까지 하나님께 대항하는 방향으로 쌓아 올린다는 점이므로 긴장을 완화하지 않았습니다.
  doctrine_reference: 원문 수사의 강화 효과를 보존하고 번역 전통이 아닌 स्रोत 언어의 문맥 우선 원칙을 따른다.
