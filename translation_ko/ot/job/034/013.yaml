id: JOB.34.13
reference: Job 34:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו אָ֑רְצָ/ה וּ/מִ֥י שָׂ֝֗ם תֵּבֵ֥ל כֻּלָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
  footnotes:
  - marker: a
    text: Or 'Who charged him with the earth, and who laid on him the whole world?' The Hebrew verb פקד can carry the sense of appointing, charging, or entrusting responsibility.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 그에게 땅을 맡겼으며, 누가 온 세상을 세워 두었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 그에게 땅을 맡겼으며, 누가 온 세상을 그에게 지웠습니까?’ 히브리어 פקד는 임명하다, 맡기다, 책임을 지우다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד + עָלָיו
  english_pob_choice: appointed over him
  chosen_korean: 맡겼으며
  alternatives_korean:
  - 임명했으며
  - 위임했으며
  - 책임지게 했으며
  lexicon: HALOT
  rationale: 이 문맥의 פקד는 단순한 ‘방문하다’가 아니라 책임이나 권한을 부여하는 뜻이므로, 한국어에서는 ‘맡기다’가 가장 자연스럽게 그 뉘앙스를 살립니다.
- source_word: אָרְצָה
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 대지
  lexicon: HALOT
  rationale: 앞의 ‘온 세상’과 평행을 이루는 우주적 범위는 살리되, 한국어에서는 ‘땅’이 원문의 אֶרֶץ를 무리 없이 담아내는 가장 기본적인 표현입니다.
- source_word: תֵּבֵל כֻּלָּהּ
  english_pob_choice: the whole world
  chosen_korean: 온 세상
  alternatives_korean:
  - 온 세계
  - 전체 세계
  lexicon: HALOT
  rationale: תבל은 ‘거주하는 질서 잡힌 세계’의 의미를 가지므로, ‘온 세상’이 자연스럽고도 그 전체성을 잘 드러냅니다.
- source_word: שָׂם
  english_pob_choice: set
  chosen_korean: 세워 두었습니까
  alternatives_korean:
  - 두었습니까
  - 정하였습니까
  - 설정하였습니까
  lexicon: HALOT
  rationale: שׂים의 기본뜻인 ‘두다/놓다/세우다’를 살리면서, 앞절과 병렬을 이루는 ‘세워 두다’로 번역해 우주 질서의 확립을 표현했습니다.
theological_decisions:
- issue: עָלָיו의 지시 대상
  chosen_reading: ‘그에게’는 하나님을 가리키는 것으로 이해하여 번역했습니다.
  alternative_readings:
  - ‘그것 위에’처럼 비인격적으로 처리하는 해석
  rationale: 욥기 34:10–15의 논지상, 누구도 하나님 위에 권위를 두지 않았다는 수사적 질문이므로 남성 단수 대명사는 하나님을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥이 충분히 분명할 때는 대명사 지시를 명료하게 반영하되, 신학적 긴장은 원문이 허용하는 범위 안에서 유지합니다.
