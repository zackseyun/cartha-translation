lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: Though ... was
  chosen_korean: 비록 ...였으나
  alternatives_korean:
  - 그리고 ...였습니다
  - 그러나 ...였습니다
  - 그때 ...였습니다
  lexicon: HALOT
  rationale: 히브리어의 연결사와 완료형이 여기서는 단순 접속보다 앞 절과 뒤 절의 대비를 여는 양보적 뉘앙스로 읽히므로, 한국어에서도 ‘비록 ...였으나’로 자연스럽게 드러냈습니다.
- source_word: רֵאשִׁיתְךָ
  english_pob_choice: your beginning
  chosen_korean: 시작
  alternatives_korean:
  - 처음 상태
  - 출발
  - 처음
  lexicon: HALOT
  rationale: רֵאשִׁית는 시작, 첫 부분, 초기 상태를 가리키므로, 시적 문맥에서 가장 직접적인 ‘시작’을 택했습니다.
- source_word: אַחֲרִיתְךָ
  english_pob_choice: your latter end
  chosen_korean: 나중
  alternatives_korean:
  - 미래
  - 마지막 결과
  - 말년
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 시간적 미래보다 최종적인 결과와 귀결을 포함하므로, 한국어에서는 문맥상 자연하면서도 결과의 뉘앙스를 살리는 ‘나중’으로 옮겼습니다.
- source_word: יִשְׂגֶּה מְאֹד
  english_pob_choice: will increase greatly
  chosen_korean: 크게 번성할 것입니다
  alternatives_korean:
  - 크게 증가할 것입니다
  - 매우 불어날 것입니다
  - 크게 자랄 것입니다
  lexicon: HALOT
  rationale: יִשְׂגֶּה는 단순 수량 증가보다 ‘크게 되다/번성하다’의 의미가 강하므로, 뒤의 מְאֹד와 합쳐 성장·확장의 강한 이미지를 살려 ‘크게 번성하다’로 표현했습니다.
