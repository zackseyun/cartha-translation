id: JOB.8.14
reference: Job 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר יָק֥וֹט כִּסְל֑/וֹ וּ/בֵ֥ית עַ֝כָּבִ֗ישׁ מִבְטַחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/014.yaml
  text: whose confidence is cut off[c][b][a], and whose trust is a spider’s house.
  footnotes:
  - marker: a
    text: Or 'whose hope is cut off'; the Hebrew noun can denote confidence, hope, or security in this context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb rendered 'is cut off' is rare and debated; possible nuances include 'is severed' or, less likely here, 'is loathed.'
    reason: lexical_alternative
  - marker: c
    text: That is, his trust is as fragile as a spider’s web/house.
    reason: cultural_note
translation:
  language: ko
  text: 그의 확신은 끊어지고, 그의 믿음은 거미집과 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 희망은 끊어진다’; 이 명사는 이 문맥에서 확신, 희망, 안전을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘끊어지다’로 옮긴 히브리어 동사는 드물고 해석이 분분하며, ‘잘리다’ 또는 덜 가능하게는 ‘미움을 받다’의 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧, 그의 신뢰는 거미집처럼 연약합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָקוֹט
  english_pob_choice: is cut off
  chosen_korean: 끊어지고
  alternatives_korean:
  - 잘려 없어지고
  - 끊깁니다
  - 끊어집니다
  lexicon: HALOT
  rationale: 희귀하고 논쟁적인 동사를 한국어로는 ‘끊어지다’로 옮겨, 확신이 갑자기 제거되는 이미지를 살렸습니다. ‘잘려 없어지다’도 가능하지만 본문은 상태의 단절을 간결하게 보여 주는 표현이 더 자연스럽습니다.
- source_word: כִּסְלוֹ
  english_pob_choice: his confidence
  chosen_korean: 그의 확신
  alternatives_korean:
  - 그의 희망
  - 그의 안전
  - 그의 신뢰
  lexicon: HALOT
  rationale: 지혜문맥에서 이 명사는 ‘희망’도 될 수 있지만, 평행행의 ‘그의 믿음’과 함께 읽을 때 ‘확신’이 가장 자연스럽고 중복도 덜합니다.
- source_word: מִבְטַחוֹ
  english_pob_choice: his trust
  chosen_korean: 그의 믿음
  alternatives_korean:
  - 그의 신뢰
  - 그의 의지처
  - 그가 भरो?
  lexicon: HALOT
  rationale: 이 명사는 신뢰의 대상/기반을 가리키므로 문맥상 ‘믿음’으로 옮겼습니다. ‘신뢰’나 ‘의지처’도 가능하지만, 병행구에서 추상적 상태를 한 번 더 반복해 주는 표현이 한국어에 더 매끄럽습니다.
- source_word: עַכָּבִישׁ
  english_pob_choice: spider’s house
  chosen_korean: 거미집
  alternatives_korean:
  - 거미의 집
  - 거미줄집
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하되 한국어 관용에 맞게 합성어 ‘거미집’으로 옮겨, 그 취약성과 연약함을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 의인의 안전이 아니라 악인의 붕괴를 묘사하는 지혜문학적 경고의 어조
  chosen_reading: 본문은 악인의 확신과 의지가 허물어지는 장면을 비유적으로 말하며, 교리 진술보다 시적 대비를 앞세웁니다.
  alternative_readings:
  - 일반적인 인간 불안의 진술
  - 도덕적 교훈의 완화된 표현
  rationale: 욥기 8:14의 문맥은 빌닷이 악인의 운명을 규정하는 발언입니다. 따라서 예언적 일반화로 약화하지 않고, 원문의 단정적·비유적 힘을 유지했습니다.
  doctrine_reference: 지혜문학의 시적 비유와 인과적 경고
- issue: ‘거미집’의 비유를 설명하지 않고 본문에 보존
  chosen_reading: 비유를 본문 안에서 그대로 살려, 믿음/안전의 취약성이 즉시 느껴지도록 했습니다.
  alternative_readings:
  - ‘거미줄처럼 약한 집’으로 풀이하여 설명적으로 번역
  - 각주로만 비유를 처리
  rationale: 영어 POB가 ‘spider’s house’ 이미지를 직접 유지하므로, 한국어도 해설보다 직역적 이미지 보존이 본문의 수사력을 더 잘 전달합니다.
  doctrine_reference: 시적 은유의 보존 원칙
