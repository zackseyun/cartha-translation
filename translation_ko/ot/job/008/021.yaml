lexical_decisions:
- source_word: עַד
  english_pob_choice: yet
  chosen_korean: 여전히
  alternatives_korean:
  - 아직
  - 그래도
  - 언젠가
  lexicon: HALOT
  rationale: 문맥상 하나님이 아직도 이루실 미래의 약속을 나타내므로, 단순한 시점 부사보다 지속성과 기대를 함께 살리는 ‘여전히’로 옮겼습니다.
- source_word: יְמַלֵּה
  english_pob_choice: he will fill
  chosen_korean: 채우실 것입니다
  alternatives_korean:
  - 채웁니다
  - 채우게 하실 것입니다
  lexicon: HALOT
  rationale: 하나님이 주어인 미래형 약속을 자연스러운 현대 한국어로 반영했고, ‘채우다’는 원문의 이미지도 그대로 살립니다.
- source_word: שְׂחוֹק
  english_pob_choice: laughter
  chosen_korean: 웃음
  alternatives_korean:
  - 웃음소리
  - 기쁨
  - 비웃음
  lexicon: HALOT
  rationale: 회복의 문맥에서 명사 ‘웃음’이 가장 직접적이며, 부정적 뉘앙스의 ‘비웃음’은 문맥상 과도합니다.
- source_word: תְרוּעָה
  english_pob_choice: shouting
  chosen_korean: 외침
  alternatives_korean:
  - 환호
  - 기쁜 외침
  - 함성
  lexicon: HALOT
  rationale: 이 단어는 기쁨이나 승리의 큰 소리를 가리킬 수 있으나, 본문 자체가 의미를 좁히지 않으므로 ‘외침’으로 넓게 유지했습니다.
theological_decisions:
- issue: 인칭 주어의 명시 여부
  chosen_reading: ‘그분은’으로 시작해, 직전 절의 하나님을 계속 가리키는 주어를 분명히 드러냈습니다.
  alternative_readings:
  - 주어를 생략해 ‘여전히 당신의 입에…’로 옮김
  rationale: 히브리어 동사의 행위 주체가 앞문맥의 하나님이므로, 한국어에서도 약속의 주체를 분명히 드러내는 편이 본문의 신학적 초점을 더 잘 보존합니다.
  doctrine_reference: 원문 주어의 연속성 보존
