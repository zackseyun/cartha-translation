id: JOB.8.16
reference: Job 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָטֹ֣ב ה֭וּא לִ/פְנֵי שָׁ֑מֶשׁ וְ/עַ֥ל גַּ֝נָּת֗/וֹ יֹֽנַקְתּ֥/וֹ תֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
  footnotes:
  - marker: a
    text: Or 'his sprout comes forth over his garden.' The Hebrew singular noun for tender growth may be understood collectively.
    reason: lexical_alternative
  - marker: b
    text: '''Before the sun'' may mean ''in front of the sun'' or ''under the sun''s light,'' not necessarily ''before sunrise.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 해 앞에서[b] 물기를 머금고 있으며, 그의 새순은 그의 정원 위로 뻗어 나갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 새싹이 그의 정원 위로 돋아납니다.’ 히브리어의 단수 명사는 집합적으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해 앞에서’는 ‘태양 앞에서’ 또는 ‘햇빛 아래서’를 뜻할 수 있으며, 반드시 해 뜨기 전만을 가리키지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  english_pob_choice: full of moisture
  chosen_korean: 촉촉하며
  alternatives_korean:
  - 물기 가득하며
  - 젖어 있으며
  - 무성하며
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘생기 있다’보다 수분이 충분한 상태를 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘촉촉하다’로 옮겼습니다.
- source_word: לִפְנֵי שָׁמֶשׁ
  english_pob_choice: before the sun
  chosen_korean: 해 앞에서도
  alternatives_korean:
  - 해 아래서도
  - 태양 앞에서도
  - 햇빛 아래서도
  lexicon: HALOT
  rationale: 직역의 ‘해 앞’ 이미지를 살리면서, 문맥상 시간보다 위치/노출의 뉘앙스를 유지하기 위해 ‘앞에서도’로 처리했습니다.
- source_word: יֹנַקְתּוֹ / תֵצֵא
  english_pob_choice: his shoots spread out
  chosen_korean: 그의 새순은 … 뻗어 나갑니다
  alternatives_korean:
  - 그의 싹은 … 나옵니다
  - 그의 움은 … 퍼져 나갑니다
  - 그의 새싹은 … 뻗습니다
  lexicon: HALOT
  rationale: ‘יֹנַקְתּוֹ’의 어린 식물 성장 이미지를 한국어의 ‘새순’으로 옮기고, ‘תֵצֵא’의 밖으로 나아감과 확장을 ‘뻗어 나갑니다’로 자연스럽게 반영했습니다.
- source_word: גַּנָּתוֹ
  english_pob_choice: his garden
  chosen_korean: 그의 정원
  alternatives_korean:
  - 그의 동산
  - 그의 뜰
  - 그의 밭
  lexicon: HALOT
  rationale: 시적 맥락에서 ‘정원’이 가장 자연스럽고, 소유격도 그대로 살릴 수 있어 선택했습니다.
theological_decisions:
- issue: 의인/악인의 비유적 식물 이미지 보존
  chosen_reading: 이 구절을 사람을 식물에 비유한 시적 진술로 유지하고, ‘해 앞’과 ‘정원 위로’의 공간적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 윤택한 상태를 강조하는 해석적 번역
  - 단순히 ‘햇빛 아래서’로 평준화하는 번역
  rationale: 빌닷의 비유는 식물의 번성과 확장을 통해 번영의 모습을 그리므로, 이미지를 평준화하지 않고 원문 감각을 보존하는 것이 중요합니다.
  doctrine_reference: 문맥상 지혜문학의 비유적 표현을 우선 존중하는 번역 원칙
- issue: ‘before the sun’의 중의성 유지
  chosen_reading: ‘해 앞에서도’로 옮겨, 시간적 ‘해 뜨기 전’으로만 좁히지 않고 노출/위치의 가능성을 남겼습니다.
  alternative_readings:
  - ‘해가 뜨기 전에’
  - ‘햇빛 아래서’
  rationale: 영어 POB가 지적하듯 히브리어는 시간적 선행보다 태양과의 관계를 넓게 가리킬 수 있으므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 시적 다의성 보존 원칙
