    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֭/אֵל
  english_pob_choice: Does God
  chosen_korean: 하나님이
  alternatives_korean:
  - 엘이
  - 하느님이
  lexicon: HALOT
  rationale: 여기서는 고유명사 ‘엘’이 아니라 일반적인 신칭이므로, 현대 한국어 성경 문체에 맞게 ‘하나님’으로 옮겼습니다. 의문문은 한국어에서 자연스러운 어순으로 처리했습니다.
- source_word: יְעַוֵּת
  english_pob_choice: pervert
  chosen_korean: 왜곡하시겠습니까
  alternatives_korean:
  - 뒤틀리시겠습니까
  - 굽게 하시겠습니까
  lexicon: HALOT
  rationale: 법정·도덕적 맥락에서 ‘곡되게 만들다’의 강한 의미를 살려 ‘왜곡하다’로 옮겼습니다. 두 절에 같은 동사를 반복해 히브리어의 평행법을 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 판결
  - 심판
  - 공의
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּט은 단순한 ‘판결’보다 공정한 법적 질서를 가리키므로, 현대 한국어에서 가장 자연스럽고 의미가 넓은 ‘정의’를 택했습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 옳음
  - 공의
  lexicon: HALOT
  rationale: צֶדֶק은 מִשְׁפָּט와 겹치지만 동일하지 않으므로, 한국어 성경 어휘에서 구별이 살아 있는 ‘의’를 사용해 병행의 차이를 보존했습니다.
theological_decisions:
- issue: 두 법적·윤리적 용어 מִשְׁפָּט와 צֶדֶק의 구별 유지
  chosen_reading: 정의 ... 의
  alternative_readings:
  - 정의 ... 정의
  - 판결 ... 의
  - 공의 ... 공의
  rationale: 본문은 같은 뜻을 반복하기보다 관련된 두 개념을 나란히 두어 하나님의 공정성과 도덕적 올바름을 함께 묻습니다. 한국어에서도 서로 다른 단어를 써서 그 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §3, §5'
