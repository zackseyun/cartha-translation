translation:
  language: ko
  text: 그들이 당신을 가르치고 당신에게 말하며, 그들의 마음[a]에서 말을 꺼내지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음’은 감정뿐 아니라 생각과 분별의 중심도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Will ... not
  chosen_korean: '... 않겠습니까?'
  alternatives_korean:
  - '... 아니겠습니까?'
  - 정말 ... 하지 않겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 긍정적 답을 기대하는 뉘앙스를 살려, 현대 한국어의 자연스러운 반문형으로 옮겼습니다.
- source_word: יוֹרוּךָ
  english_pob_choice: teach you
  chosen_korean: 당신을 가르치고
  alternatives_korean:
  - 당신을 가르치며
  - 당신에게 가르치고
  lexicon: HALOT
  rationale: 지혜 문맥의 히필 ירה를 ‘가르치다’로 옮겨 교육·훈계의 의미를 분명히 했습니다.
- source_word: יֹאמְרוּ לָךְ
  english_pob_choice: tell you
  chosen_korean: 당신에게 말하지 않겠습니까
  alternatives_korean:
  - 당신에게 말하지 않겠습니까?
  - 당신에게 일러주지 않겠습니까?
  lexicon: HALOT
  rationale: 앞절의 ‘가르치다’와 짝을 이루는 별도의 발화 동사로 보아 ‘말하다’를 유지하되, 자연스러운 한국어 어순으로 정리했습니다.
- source_word: וּמִלִּבָּם
  english_pob_choice: from their heart
  chosen_korean: 그들의 마음에서
  alternatives_korean:
  - 그들의 속마음에서
  - 그들의 생각에서
  lexicon: HALOT
  rationale: לֵב의 인지적 의미를 반영하면서도 한국어에서 ‘마음’이 생각과 내면을 함께 가리킬 수 있도록 했습니다.
- source_word: יוֹצִיאוּ מִלִּים
  english_pob_choice: bring forth words
  chosen_korean: 말을 끌어내지 않겠습니까
  alternatives_korean:
  - 말을 내놓지 않겠습니까
  - 말을 내지 않겠습니까
  lexicon: HALOT
  rationale: ‘밖으로 나오게 하다’라는 히필의 이미지를 살려 단순한 ‘말하다’보다 내면에서 끌어내는 동작을 드러냈습니다.
theological_decisions:
- issue: 지혜 전승의 권위와 수사적 반문
  chosen_reading: 본문은 조상들의 전승이 욥을 가르치고 설명할 것이라는 기대를 반문형으로 강조합니다.
  alternative_readings:
  - 단순 진술로 완화하여 ‘그들이 당신을 가르치고 말할 것입니다’로 읽기
  - 도덕적 훈계로만 축소하기
  rationale: 히브리어 הֲלֹא의 수사적 기능을 살려, 청자가 ‘그렇다’고 답하게 만드는 압박감을 보존했습니다.
  doctrine_reference: 문맥 주해(지혜문학의 수사적 질문)
