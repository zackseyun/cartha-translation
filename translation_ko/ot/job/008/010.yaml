base_translation:
  language: en
  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
  footnotes:
  - marker: a
    text: Or 'from their minds' or 'from their inner being'; Hebrew 'heart' often refers to the center of thought as well as feeling.
