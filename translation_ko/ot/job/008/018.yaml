id: JOB.8.18
reference: Job 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יְבַלְּעֶ֥/נּוּ מִ/מְּקוֹמ֑/וֹ וְ/כִ֥חֶשׁ בּ֝֗/וֹ לֹ֣א רְאִיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
  footnotes:
  - marker: a
    text: Or “from its place.” The Hebrew suffix can be read with the plant image in view, though the verse also personifies the image in relation to the wicked man.
    reason: lexical_alternative
  - marker: b
    text: Or “it disowns him” / “it deals falsely with him.” The Hebrew verb can express denial or disavowal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 자리에서 삼켜지면, 그 자리가 그를 부인하며 말합니다. “나는 너를 보지 못했다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 자리에서.” 히브리어 소유 접미사는 식물 이미지를 가리킬 수도 있지만, 문맥상 인물을 함께 의인화한 표현으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그를 저버리며” / “그에게 거짓되게 하며.” 히브리어 동사는 부인과 불인정, 또는 불성실한 대우를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַלְּעֶנּוּ
  english_pob_choice: he is destroyed
  chosen_korean: 삼켜지면
  alternatives_korean:
  - 파멸되면
  - 파괴되면
  - 없어지면
  lexicon: HALOT
  rationale: בלע의 기본 이미지는 ‘삼키다/집어삼키다’이며, 시적 문맥에서 사람의 소멸을 생생하게 드러내므로 ‘삼켜지면’이 원문 이미지에 가장 가깝습니다.
- source_word: מִמְּקוֹמוֹ
  english_pob_choice: from his place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 그의 자리에서
  - 그 자리에서
  - 그의 곳에서
  lexicon: HALOT
  rationale: 소유 접미사는 인물 쪽을 가리키지만, 앞의 식물 이미지와도 연결되므로 ‘자기 자리’로 자연스럽게 옮기되 개인화된 뉘앙스를 보존했습니다.
- source_word: וְכִחֶשׁ בּוֹ
  english_pob_choice: then it will deny him
  chosen_korean: 그 자리가 그를 부인하며
  alternatives_korean:
  - 그 자리가 그를 부정하며
  - 그 자리가 그를 저버리며
  - 그 자리가 그를 모른다고 하며
  lexicon: HALOT
  rationale: כחש는 ‘부인하다/부정하다/거짓되다’의 폭이 있어, 자리의 의인화된 거절을 살리는 ‘부인하며’가 가장 직접적입니다.
- source_word: לֹא רְאִיתִיךָ
  english_pob_choice: I have not seen you
  chosen_korean: 나는 너를 보지 못했다
  alternatives_korean:
  - 나는 너를 보지 않았다
  - 나는 너를 알지 못한다
  - 내가 너를 본 적이 없다
  lexicon: HALOT
  rationale: 직접 부인 화행을 한국어로 자연스럽게 옮기면서도 ‘보다’의 구체적 이미지를 유지하기 위해 ‘보지 못했다’를 택했습니다.
theological_decisions:
- issue: 의인화된 ‘자리’가 말을 하는 장면의 처리
  chosen_reading: ‘그 자리가 그를 부인하며 말합니다’로 옮겨, 원문의 의인화를 그대로 드러냈습니다.
  alternative_readings:
  - ‘그곳이 그를 부인합니다’
  - ‘그의 자리가 그를 버립니다’
  rationale: 본문은 장소를 말하는 존재처럼 다루므로, 평탄화하지 않고 독자가 시적 충격을 느끼도록 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 시적 의인화와 수사적 진술
