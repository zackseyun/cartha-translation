  source_fidelity: 조건사 אִם은 ‘만일 …다면’으로 적절히 반영되었고, ‘아들들’, ‘죄를 짓다’, 그리고 심판적으로 넘겨주는 וַיְשַׁלְּחֵם의 의미도 대체로 충실합니다. 다만 בְּיַד פִּשְׁעָם을 본문의 ‘죄악의 손에’로 옮긴 것은 한국어에서 의미가 불명확하고 비자연적입니다. 이 관용구의 ‘손’은 여기서 지배력·권세를 뜻하므로, 본문에서는 그 뜻을 드러내고 직역은 주석에 남기는 것이 안전합니다.
  naturalness: ‘그들의 죄악의 손에’는 현대 표준 한국어의 자연스러운 결합이 아니며 독자가 ‘손’의 소유 관계를 문자적으로 이해할 수 있습니다. 또한 ‘그에게’와 ‘그는 … 내주셨습니다’는 존대의 일관성이 약합니다. 문맥상 하나님을 가리키는 대명사는 ‘그분께/그분은’으로 통일하면 합쇼체 문장에 자연스럽습니다.
