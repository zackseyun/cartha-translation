id: JOB.8.4
reference: Job 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם בָּנֶ֥י/ךָ חָֽטְאוּ ל֑/וֹ וַֽ֝/יְשַׁלְּחֵ֗/ם בְּ/יַד פִּשְׁעָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
  footnotes:
  - marker: a
    text: Or 'he delivered them into the power of their transgression.' The Hebrew idiom is literally 'into the hand of their transgression.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신의 아들들이 그에게 죄를 지었다면, 그는 그들을 그들의 죄악의 손에 내주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 더 풀어 옮기면 ‘그들의 죄악의 권세에 내주셨습니다’ 또는 ‘그들의 죄악에 넘기셨습니다’라는 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - ~한다면
  lexicon: HALOT
  rationale: 히브리어 조건절의 기본 힘을 살리기 위해 조건 접속을 분명히 드러냈습니다.
- source_word: בָּנֶיךָ
  english_pob_choice: your sons
  chosen_korean: 당신의 아들들
  alternatives_korean:
  - 당신의 자녀들
  - 아들들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형 ‘아들들’을 사용하므로, 성별 정보를 완화하지 않고 그대로 반영했습니다.
- source_word: לוֹ
  english_pob_choice: against him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 향하여
  - 하나님께
  lexicon: HALOT
  rationale: 히브리어에서 חטא와 결합한 ל는 죄의 대상/상대방을 나타낼 수 있어, 본문 수준에서는 직접적으로 ‘그에게 죄를 짓다’로 옮겼습니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: he gave them over
  chosen_korean: 그들을 내주셨습니다
  alternatives_korean:
  - 그들을 넘기셨습니다
  - 그들을 보내셨습니다
  - 그들을 넘겨주셨습니다
  lexicon: HALOT
  rationale: 단순 ‘보내다’보다, 뒤의 관용구와 함께 심판적 인도/넘김의 의미를 살려 한국어의 ‘내주다’를 택했습니다.
- source_word: בְּיַד פִּשְׁעָם
  english_pob_choice: into the hand of their transgression
  chosen_korean: 그들의 죄악의 손에
  alternatives_korean:
  - 그들의 범죄의 손에
  - 그들의 죄의 힘에
  - 그들의 죄악의 권세에
  lexicon: HALOT
  rationale: ‘손’이라는 히브리 관용을 보존하면서도 자연스러운 한국어가 되도록 직역적 구조를 유지했습니다.
theological_decisions:
- issue: לוֹ의 지시 대상
  chosen_reading: ‘그에게’는 문맥상 하나님을 가리키지만, 본문 표면의 대명사를 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님께’로 명시
  - 문맥상 모호함을 그대로 남김
  rationale: 빌닷의 발언은 하나님의 공의에 관한 논증 안에 놓여 있으므로 지시 대상은 하나님이지만, 원문이 직접 명시하지 않은 것을 본문에 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선과 문맥 해석의 균형을 유지합니다.
- issue: בְּיַד פִּשְׁעָם의 관용
  chosen_reading: ‘그들의 죄악의 손에 내주셨습니다’로, 행위와 결과의 결박을 함께 드러냈습니다.
  alternative_readings:
  - ‘그들의 죄악의 권세에 내주셨습니다’
  - ‘그들의 죄악에 넘기셨습니다’
  rationale: 히브리 관용은 죄가 그들을 지배하는 상태를 암시하므로, 심판 행위와 죄의 지배력을 함께 보존하는 표현을 택했습니다.
  doctrine_reference: '최적 등가 번역: 본문이 말하는 범위를 넘는 교리적 세부화는 피합니다.'
