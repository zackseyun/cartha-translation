revisions:
- from: 네가 깨끗하고 정직하다면, 분명히 지금이라도 그분이 너를 위해 일어나시고 네 의로운 거처를 회복하실 것입니다.[a][b][c]
  to: 당신이 깨끗하고 올바르다면, 분명히 지금이라도 그분께서 당신을 위해 일어나실 것이며[a] 당신의 의로운 거처를 회복하실 것입니다.[b][c]
  rationale: 원문의 조건문, 강조, 암시된 주어, 그리고 두 동사의 병렬 관계는 유지했습니다. 목표인 현대 합쇼체에 맞추어 2인칭 대명사를 ‘당신’으로 통일하고, 각주의 어휘 설명과 표지 위치를 정정했습니다. 빌닷의 조건적 주장을 완화하거나 평가하지 않았습니다.
