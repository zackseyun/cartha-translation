id: JOB.8.6
reference: Job 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם זַ֥ךְ וְ/יָשָׁ֗ר אָ֥תָּה כִּי עַ֭תָּה יָעִ֣יר עָלֶ֑י/ךָ וְ֝/שִׁלַּ֗ם נְוַ֣ת צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
  footnotes:
  - marker: a
    text: Or 'he will awake for you' or 'he will stir himself on your behalf.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make whole' or 'repay'; the Hebrew verb can carry the sense of restoring or making complete.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the dwelling of your righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 깨끗하고 정직하다면, 분명히 지금이라도 그분이 너를 위해 일어나시고 네 의로운 거처를 회복하실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 너를 위해 깨어나실 것이다’ 또는 ‘그가 네 편에서 스스로 일어나실 것이다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온전하게 하다’ 또는 ‘되갚다’; 이 히브리어 동사는 회복하거나 완전하게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘네 의의 거처’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -다면
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 조건문을 자연스러운 한국어 종결로 옮겼습니다.
- source_word: זַךְ וְיָשָׁר
  english_pob_choice: pure and upright
  chosen_korean: 깨끗하고 정직하다
  alternatives_korean:
  - 순수하고 올바르다
  - 깨끗하고 의롭다
  lexicon: HALOT
  rationale: 지혜문맥의 도덕적 순결과 곧음을 함께 살리되, 현대 한국어에서 자연스러운 성품 묘사로 옮겼습니다.
- source_word: יָעִיר עָלֶיךָ
  english_pob_choice: he will rouse himself for you
  chosen_korean: 그분이 너를 위해 일어나시고
  alternatives_korean:
  - 그분이 너를 위해 깨어나시고
  - 그분이 너를 위해 스스로 움직이시고
  lexicon: HALOT
  rationale: ‘깨우다/일으키다’의 비유를 살리면서 한국어에서는 ‘일어나시고’가 가장 자연스럽고 힘 있게 들립니다.
- source_word: וְשִׁלַּם
  english_pob_choice: and restore
  chosen_korean: 회복하실 것입니다
  alternatives_korean:
  - 되갚으실 것입니다
  - 온전하게 하실 것입니다
  - 갚으실 것입니다
  lexicon: HALOT
  rationale: 목적어가 ‘네 의로운 거처’이므로 ‘restore’의 의미를 한국어로 가장 잘 드러내는 것은 ‘회복하다’입니다.
- source_word: נְוַת צִדְקֶךָ
  english_pob_choice: your righteous dwelling
  chosen_korean: 네 의로운 거처
  alternatives_korean:
  - 네 의의 거처
  - 네 의로운 집
  lexicon: HALOT
  rationale: 히브리어의 ‘의의 거처’라는 직역형을 살리면서도 한국어에서는 ‘의로운 거처’가 가장 자연스럽습니다.
theological_decisions:
- issue: 암시된 주어
  chosen_reading: 동사의 주어를 문맥상 하나님으로 이해하되, 본문에는 ‘그분’으로만 두었습니다.
  alternative_readings:
  - 하나님이 너를 위해
  - 주님이 너를 위해
  rationale: 히브리어는 주어를 명시하지 않지만, 문맥상 하나님을 가리킵니다. 본문에 없는 고유명사를 덧붙이지 않으면서도 의미는 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 빌닷의 말의 성격
  chosen_reading: 번역은 빌닷의 조건적 주장 자체를 그대로 옮기고, 그 신학을 미리 교정하지 않았습니다.
  alternative_readings:
  - 완곡하게 거리를 두는 표현
  - 해설적 주석을 본문에 삽입하는 방식
  rationale: 본문은 화자의 발화를 충실히 재현해야 하므로, 서술자가 아닌 빌닷의 발언으로서 그대로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
