lexical_decisions:
- source_word: עַד אָן
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 어느 때까지
  lexicon: HALOT
  rationale: 히브리어 관용 질문을 자연스러운 한국어 시간 질문으로 옮겼습니다. 원문의 탄식·책망의 압박감을 살리기에 가장 직접적입니다.
- source_word: תְּמַלֶּל אֵלֶּה
  english_pob_choice: will you keep saying these things
  chosen_korean: 이런 말들을 계속 하겠습니까
  alternatives_korean:
  - 이런 것들을 계속 말하겠습니까
  - 이런 말들을 하겠습니까
  lexicon: HALOT
  rationale: 말하기를 계속한다는 반복·지속의 뉘앙스를 살리기 위해 ‘계속 하겠습니까’를 넣었습니다. אֵלֶּה는 앞뒤 문맥을 가리키는 복수 지시로 보아 ‘이런 말들’로 옮겼습니다.
- source_word: וְרוּחַ כַּבִּיר
  english_pob_choice: be a mighty wind
  chosen_korean: 거센 바람이겠습니까
  alternatives_korean:
  - 강한 바람이겠습니까
  - 세찬 바람이겠습니까
  - 강풍이겠습니까
  lexicon: HALOT
  rationale: רוּחַ를 문자 그대로 ‘바람’으로 유지해, 힘은 있으나 내용이 없는 발언이라는 은유를 살렸습니다. כַּבִּיר의 강함은 ‘거센’으로 표현했습니다.
- source_word: אִמְרֵי פִיךָ
  english_pob_choice: the words of your mouth
  chosen_korean: 당신 입에서 나오는 말
  alternatives_korean:
  - 당신의 입의 말
  - 당신 입의 말들
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 한국어에서 자연스럽게 풀어, 입에서 실제로 나오는 발언이라는 구체성을 살렸습니다.
theological_decisions:
- issue: Bildad의 질문형 책망을 한국어에서 어떻게 반영할지
  chosen_reading: 두 개의 반문을 유지해, 단순 정보 질문이 아니라 조롱 섞인 책망의 어조가 드러나게 했습니다.
  alternative_readings:
  - 평서문처럼 완화해 옮기기
  - 한 문장으로 압축해 부드럽게 처리하기
  rationale: 문맥상 빌닷의 날 선 비난이 핵심이므로, 반문 구조를 살려 화자의 태도를 흐리지 않았습니다.
  doctrine_reference: 문맥-화행 보존
- issue: רוּחַ כַּבִּיר의 은유를 직역할지 의미역할지
  chosen_reading: ‘거센 바람’으로 옮겨, 힘은 있으나 공허한 발언이라는 비유를 유지했습니다.
  alternative_readings:
  - ‘위대한 바람’처럼 문자적으로 옮기기
  - 은유를 풀어 ‘허풍’으로 의역하기
  rationale: 원문의 풍자적 이미지가 중요하므로 바람 은유를 보존하되, 한국어에서 자연스러운 강도 표현을 선택했습니다.
  doctrine_reference: 시적 은유 보존
