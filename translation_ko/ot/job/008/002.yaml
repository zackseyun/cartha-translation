    rationale: 히브리어 אִמְרֵי는 복수이며, ‘말들이’로 옮기면 원문의 형태와 병렬적 어감을 더 잘 보존할 수 있습니다.
  - severity: low
    issue: ‘그리고’가 두 반문 사이의 시적 병렬을 불필요하게 산문적으로 연결합니다.
    rationale: 접속사를 생략하고 두 질문을 나란히 두면 히브리어의 압축된 책망 어조가 더 자연스럽게 살아납니다.
  - severity: low
    issue: 현 각주가 ‘이런 것들’이라는 지시어 설명만 제시하며 본문의 ‘이런 말들’과의 번역 대안을 명확히 안내하지 않습니다.
    rationale: 각주를 실제 가능한 번역 대안으로 고치고 해당 표현 바로 뒤에 붙이면 앵커와 내용의 대응이 분명해집니다.
