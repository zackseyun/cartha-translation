base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
  footnotes:
  - marker: a
    text: Or, 'the hypocrite.' The Hebrew term can denote an impious or irreverent person; here 'the godless' best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 잊는 모든 이의 길도 이와 같으며, 불경한 자의 소망은 사라집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위선자의’. 히브리어는 위선자라는 뜻으로도 번역될 수 있으나, 여기서는 하나님께 불경하거나 경건하지 않은 사람을 가리키는 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 비유적 진술을 받아 결론을 이끄는 연결어로서, 원문의 비교·귀결을 자연스럽게 살리는 표현입니다.
- source_word: שֹׁכְחֵי אֵל
  english_pob_choice: who forget God
  chosen_korean: 하나님을 잊는
  alternatives_korean:
  - 하나님을 잊어버리는
  - 하나님을 기억하지 않는
  lexicon: HALOT
  rationale: 분사 구조를 한국어의 관용적 관형절로 옮겼고, אֵל은 여기서 고유명사가 아니라 일반적인 신호칭이므로 ‘하나님’으로 번역했습니다.
- source_word: חָנֵף
  english_pob_choice: the godless
  chosen_korean: 하나님을 저버린 자
  alternatives_korean:
  - 경건하지 않은 자
  - 위선자
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘위선’보다 하나님에 대한 불경·불신앙의 성격이 강하므로, ‘저버린 자’로 관계적·신앙적 배반을 드러냈습니다.
- source_word: תֹּאבֵד
  english_pob_choice: will perish
  chosen_korean: 사라집니다
  alternatives_korean:
  - 멸망합니다
  - 없어집니다
  lexicon: HALOT
  rationale: 아בד의 파멸/소멸 의미를 살리되, 시적 병행 속에서 희망이 끝내 도달하지 못함을 간명하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: חָנֵף의 한국어 재현 방식
  chosen_reading: ‘하나님을 저버린 자’로 옮겨, 단순한 성격적 ‘위선자’보다 불경과 배반의 신학적 무게를 드러냈습니다.
  alternative_readings:
  - 위선자
  - 불경한 자
  rationale: 욥기에서 이 단어는 내면의 가식보다 하나님 앞에서의 불경·불의한 태도를 가리키는 경우가 많아, 본문의 도덕·신앙 대조를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
