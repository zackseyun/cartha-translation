  source_fidelity: 첫 절은 비교·귀결의 כֵּן과 ‘하나님을 잊는 모든 이’ 및 복수형 ‘길’을 대체로 잘 반영합니다. 그러나 חָנֵף를 ‘하나님을 저버린 자’로 옮기면 원어의 불경·불신앙이라는 넓은 뜻에 ‘저버림’이라는 관계적 배반의 뉘앙스를 더하게 됩니다. ‘불경한 자’가 문맥과 어휘 범위에 더 가깝습니다. תֹּאבֵד는 희망의 소멸을 가리키므로 ‘사라집니다’는 적절합니다.
  naturalness: ‘길은 이러하며’는 한국어에서 다소 직역투이므로, 앞 문맥의 비유를 받는 ‘길도 이와 같으며’가 더 자연스럽습니다. ‘희망’도 가능하나 지혜문학의 문체에서는 ‘소망’이 자연스럽고 의미를 잘 보존합니다.
  terminology: אֵל은 ‘하나님’으로 적절합니다. חָנֵף는 현대 한국어의 심리적·도덕적 의미로 좁아질 수 있는 ‘위선자’보다 ‘불경한 자’가 적절하며, 이 대안은 각주에서 밝혀야 합니다. 현 각주는 본문에서 문제 되는 חָנֵף가 아니라 이미 자연스럽게 번역된 분사구를 설명하므로 영어 POB의 어휘 대안 주석과도 맞지 않습니다.
