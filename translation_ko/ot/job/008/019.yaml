- source_word: אַחֵר יִצְמָחוּ
  english_pob_choice: others will sprout
  chosen_korean: 다른 것들이 돋아납니다
  alternatives_korean:
  - 다른 이들이 돋아납니다
  - 다른 것들이 자라납니다
  - 다른 것들이 솟아납니다
  lexicon: HALOT
  rationale: 히브리어 복수 동사 יִצְמָחוּ의 복수성을 반영해 복수 주어로 옮겼고, 식물 은유는 ‘돋아나다’가 가장 잘 살립니다.
theological_decisions:
- issue: אַחֵר의 수/대상 이해
  chosen_reading: 인격적 ‘한 사람’보다, 앞선 비유의 대상이 흙에서 ‘다른 것들’로 대체되어 돋아나는 장면으로 읽었습니다.
  alternative_readings:
  - ‘다른 하나가 돋아납니다’처럼 단수로 읽기
  - 인간 후손/대체자를 암시하는 표현으로 읽기
  rationale: 형용사 אַחֵר는 단수처럼 보일 수 있으나, 복수 동사와 식물 비유가 결합되어 있어 집합적 복수로 번역하는 편이 문맥에 충실합니다.
  doctrine_reference: 문맥 우선의 시적 해석
