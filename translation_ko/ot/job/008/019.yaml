  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
  footnotes:
  - marker: a
    text: Or 'he is the joy of his way'; the Hebrew pronoun can be read more personally, but the context favors a summary of the plant's fate rather than a direct statement about a person.
    reason: alternative_reading
  - marker: b
    text: Or 'another will sprout from the dust.' The Hebrew אַחֵר can be singular, but the plural verb favors the rendering 'others will sprout.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이것은 그의 길의 기쁨이며, 흙에서 다른 것들이 돋아날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그의 길의 기쁨이다’. 히브리어 대명사는 더 인격적으로 읽을 수 있지만, 문맥은 사람에 대한 직접 진술보다 식물의 운명을 요약하는 표현을 더 잘 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘흙에서 다른 하나가 돋아날 것입니다’. 히브리어 אַחֵר는 단수로도 읽을 수 있으나, 복수 동사가 ‘다른 것들’이라는 번역을 더 잘 뒷받침합니다.
    reason: lexical_alternative
