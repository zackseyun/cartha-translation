id: JOB.8.5
reference: Job 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
  footnotes:
  - marker: a
    text: Or 'seek God early'; the Hebrew verb can carry the sense of seeking early, though here it likely means seeking earnestly or diligently.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Shaddai.' Traditionally rendered 'the Almighty.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 만일 당신이 하나님을 간절히 찾고, 전능자께 은혜를 구한다면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘일찍 찾다’라는 뜻도 가질 수 있지만, 여기서는 하나님을 간절하고 부지런히 찾는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘샷다이’의 번역입니다. 전통적으로는 ‘전능자’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 만일
  - 그러나 만약
  lexicon: HALOT
  rationale: 조건절의 기본 의미를 살리되, 앞 절과의 대조를 드러내는 문맥을 반영해 ‘그러나 만일’로 옮겼습니다.
- source_word: תְּשַׁחֵר
  english_pob_choice: seek earnestly
  chosen_korean: 간절히 찾고
  alternatives_korean:
  - 애써 찾고
  - 부지런히 찾고
  - 일찍 찾고
  lexicon: HALOT
  rationale: 동사의 ‘이른 시각’ 가능성보다 여기서는 하나님을 향한 진지하고 끈질긴 구함이 핵심이므로, 자연스러운 현대 한국어로 ‘간절히 찾고’라 했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 샷다이
  lexicon: HALOT
  rationale: POB가 직역 취지로 제목을 번역한 점을 따라, 고유음역보다 의미를 드러내는 ‘전능자’를 택했습니다.
- source_word: תִּתְחַנָּן
  english_pob_choice: plead for favor
  chosen_korean: 은혜를 구한다면
  alternatives_korean:
  - 은혜를 간구한다면
  - 자비를 애원한다면
  - 호의를 구한다면
  lexicon: HALOT
  rationale: Hitpael의 간구·호소 의미를 살리되, 한국어에서 ‘구하다’가 가장 자연스럽고 격식 있는 부탁의 뉘앙스를 전달합니다.
theological_decisions:
- issue: 신적 칭호 שַׁדַּי의 처리
  chosen_reading: ‘전능자’로 번역해 의미를 직접 전달했습니다.
  alternative_readings:
  - 샷다이로 음역
  - 전능하신 이
  rationale: 본문의 호칭 기능을 독자가 즉시 이해하도록 의미 번역을 택했으며, 이는 POB의 제목 번역 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
