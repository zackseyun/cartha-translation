theological_decisions:
- issue: ִיֶחֱזֶה의 시각 동사 표현
  chosen_reading: ‘바라봅니다’로 옮겨, 단순한 정보 전달보다 시적 관찰의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 봅니다
  - 쳐다봅니다
  - 응시합니다
  rationale: 이 구절은 시적 병행구로서 장면을 그리므로, ‘바라봅니다’가 원문의 시각적 긴장을 가장 무리 없이 전달합니다.
  doctrine_reference: 시적 이미지 보존
- issue: 문장 종결의 인칭화
  chosen_reading: 문맥상 ‘그의 뿌리’가 의인화된 나무/식물 이미지임을 유지했습니다.
  alternative_readings:
  - 그의 뿌리는 얽혀 있고… 그가 봅니다
  - 그의 뿌리는 얽혀 있습니다…
  rationale: 히브리어의 의인화된 시적 흐름을 살려, 후반부의 ‘바라봅니다’가 전반부 이미지와 이어지도록 했습니다.
  doctrine_reference: 히브리 시편/지혜문학의 의인화 관습
