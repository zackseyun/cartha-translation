  text: עַל גַּ֭ל שָֽׁרָשָׁ֣י/ו יְסֻבָּ֑כוּ בֵּ֖ית אֲבָנִ֣ים יֶחֱזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/017.yaml
  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
  footnotes:
  - marker: a
    text: Or 'he sees a stone house' or 'he looks into a house of stones.' The Hebrew phrase is literally 'house of stones' and may refer either to a structure of stones or to a stony place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뿌리는 돌무더기 위에 얽혀 있고, 돌로 된 집을 바라봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘돌들의 집’입니다. 따라서 ‘돌로 된 집’은 돌로 지은 구조물일 수도 있고, 돌이 많은 장소를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: over
  chosen_korean: 위에
  alternatives_korean:
  - 에
  - 위로
  - 위에서
  lexicon: HALOT
  rationale: 돌무더기와 뿌리의 위치 관계를 자연스럽게 살리면서도, 위로 뻗어 있는 이미지가 드러나도록 했습니다.
- source_word: גַּל
  english_pob_choice: stone heap
  chosen_korean: 돌무더기
  alternatives_korean:
  - 돌더미
  - 돌무지
  - 돌무더기
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘무더기’가 아니라 돌로 이뤄진 더미이므로, 시적이면서도 구체적인 ‘돌무더기’로 옮겼습니다.
- source_word: יְסֻבָּכוּ
  english_pob_choice: are intertwined
  chosen_korean: 얽혀 있고
  alternatives_korean:
  - 뒤얽혀 있고
  - 서로 얽혀 있고
  - 엉켜 있고
  lexicon: HALOT
  rationale: 뿌리들이 돌 사이에 서로 감기고 뒤엉킨 상태를 한국어로 가장 자연스럽게 나타내는 표현입니다.
- source_word: בֵּית אֲבָנִים
  english_pob_choice: a house of stones
  chosen_korean: 돌로 된 집
  alternatives_korean:
  - 돌집
  - 돌의 집
  - 돌로 된 집
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘돌들의 집’이지만, 한국어에서는 ‘돌로 된 집’이 더 자연스럽게 문맥의 모호성을 보존합니다.
theological_decisions:
- issue: ִיֶחֱזֶה의 시각 동사 표현
  chosen_reading: ‘바라봅니다’로 옮겨, 단순한 정보 전달보다 시적 관찰의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 봅니다
  - 쳐다봅니다
  - 응시합니다
  rationale: 이 구절은 시적 병행구로서 장면을 그리므로, ‘바라봅니다’가 원문의 시각적 긴장을 가장 무리 없이 전달합니다.
  doctrine_reference: 시적 이미지 보존
- issue: 문장 종결의 인칭화
  chosen_reading: 문맥상 ‘그의 뿌리’가 의인화된 나무/식물 이미지임을 유지했습니다.
  alternative_readings:
  - 그의 뿌리는 얽혀 있고… 그가 봅니다
  - 그의 뿌리는 얽혀 있습니다…
  rationale: 히브리어의 의인화된 시적 흐름을 살려, 후반부의 ‘바라봅니다’가 전반부 이미지와 이어지도록 했습니다.
  doctrine_reference: 히브리 시편/지혜문학의 의인화 관습
