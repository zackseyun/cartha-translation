translation:
  language: ko
  text: 그때 빌닷—수아 사람—이 대답하여 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘응답하여’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수아 사람’은 수아와 관련된 사람 또는 지역 출신을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַ֭/יַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 답하여
  lexicon: HALOT
  rationale: 서술 도입 공식에서 ענה는 ‘대답하다/응답하다’의 뜻이므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘대답하여’로 옮겼습니다.
- source_word: בִּלְדַּ֥ד
  english_pob_choice: Bildad
  chosen_korean: 빌닷
  alternatives_korean:
  - 빌다드
  - 빌다닷
  lexicon: 표준 외래어 표기 관례
  rationale: 고유명사는 한국어 성경에서 널리 정착된 ‘빌닷’을 사용했습니다.
- source_word: הַ/שּׁוּחִ֗י
  english_pob_choice: the Shuhite
  chosen_korean: 수아 사람
  alternatives_korean:
  - 수아인
  - 수하시 사람
  lexicon: HALOT
  rationale: 히브리어 gentilice는 출신 집단/지역을 가리키므로, 직역적이면서도 한국어에서 이해되는 ‘수아 사람’으로 옮겼습니다.
- source_word: וַ/יֹאמַֽר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하여
  lexicon: HALOT
  rationale: ענה와 함께 붙는 관용적 서술식이므로, 반복을 억지로 보존하기보다 현대 한국어에서 자연스러운 ‘대답하여 말했습니다’로 처리했습니다.
