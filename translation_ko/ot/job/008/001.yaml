base_translation:
  language: en
  yaml_path: translation/ot/job/008/001.yaml
  text: Then Bildad the Shuhite answered and said:[a][b]
  footnotes:
  - marker: a
    text: Or 'responded.'
    reason: lexical_alternative
  - marker: b
    text: '''Shuhite'' means a member of the people or region associated with Shuah.'
