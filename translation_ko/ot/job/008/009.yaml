- from: 우리는 어제 태어난 존재에 불과하여 알지 못합니다. 우리의 날들은 땅 위의 한낱 그림자이기 때문입니다.[a]
  to: 우리는 어제 생겨난 자들에 지나지 않아 알지 못합니다[a]. 우리의 날들은 땅 위의 그림자이기 때문입니다.
  rationale: The revision preserves the Hebrew sequence and explanatory force while rendering the ‘of yesterday’ idiom naturally in Korean. It removes interpretive overstatement from ‘태어난 존재’ and added emphasis from ‘한낱,’ and it relocates the footnote anchor to the clause containing the idiom and resulting lack of knowledge.
  reviewer_model: gpt-5.6-terra
