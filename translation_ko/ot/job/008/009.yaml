  text: כִּֽי תְמ֣וֹל אֲ֭נַחְנוּ וְ/לֹ֣א נֵדָ֑ע כִּ֤י צֵ֖ל יָמֵ֣י/נוּ עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
  footnotes:
  - marker: a
    text: Or, 'we are only yesterday's people,' that is, we are of very recent origin and therefore limited in knowledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 어제 태어난 존재에 불과하여 알지 못합니다. 우리의 날들은 땅 위의 한낱 그림자이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리는 어제의 사람들’ 또는 ‘어제 태어난 사람들’이라는 뜻으로, 최근성 때문에 지식이 제한된다는 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְמֹול
  english_pob_choice: of yesterday
  chosen_korean: 어제 태어난 존재에 불과하여
  alternatives_korean:
  - 어제의 사람들일 뿐이라
  - 어제에 속한 존재라
  lexicon: HALOT
  rationale: 히브리어 관용구가 인간의 최근성·유한성을 드러내므로, 단순한 시간 부사보다 한국어에서 자연스럽게 그 의미를 풀어 옮겼습니다.
- source_word: וְלֹא נֵדָע
  english_pob_choice: and do not know
  chosen_korean: 알지 못합니다
  alternatives_korean:
  - 모르며
  - 아는 바가 없습니다
  lexicon: HALOT
  rationale: 원문은 1인칭 복수의 무지 진술이므로, 한국어에서는 앞 구절과 자연스럽게 이어지도록 간결한 부정 표현으로 옮겼습니다.
- source_word: צֵל
  english_pob_choice: a shadow
  chosen_korean: 한낱 그림자
  alternatives_korean:
  - 그림자
  - 그늘
  lexicon: HALOT
  rationale: ‘그림자’의 허무·덧없음 이미지를 살리되, 문맥상 인생의 일시성을 강조하는 뉘앙스를 드러내기 위해 ‘한낱’을 덧붙였습니다.
- source_word: עֲלֵי אָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅 위의
  alternatives_korean:
  - 땅 위에 있는
  - 세상 위의
  lexicon: HALOT
  rationale: 지상적 삶의 범위를 나타내는 표현이므로, 시적이면서도 직설적인 ‘땅 위의’로 처리했습니다.
theological_decisions:
- issue: 인간 지식의 한계와 존재의 유한성
  chosen_reading: 이 구절은 인간이 최근에 생겨났고 그 지식이 제한적이며, 삶이 덧없다는 빌닷의 논지를 그대로 드러낸다고 보았습니다.
  alternative_readings:
  - 단순히 시간적으로 짧은 생애를 말하는 표현
  - 지식 부족만을 강조하는 표현
  rationale: 히브리어 두 절은 ‘어제’와 ‘그림자’를 병치하여 존재의 짧음과 인식의 제한을 함께 제시하므로, 둘 다 드러나도록 번역했습니다.
  doctrine_reference: 지혜문학의 인간 이해와 유한성
