    text: 직역하면 ‘우리는 어제의 사람들입니다.’ 이는 인간이 매우 최근에 생겨나 지식이 제한되어 있음을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew sequence and explanatory force while rendering the ‘of yesterday’ idiom naturally in Korean. It removes interpretive overstatement from ‘태어난 존재’ and added emphasis from ‘한낱,’ and it relocates the footnote anchor to the clause containing the idiom and resulting lack of knowledge.
