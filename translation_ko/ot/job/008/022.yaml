lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  english_pob_choice: those who hate you
  chosen_korean: 당신을 미워하는 자들
  alternatives_korean:
  - 당신을 미워하는 사람들
  - 당신을 증오하는 자들
  lexicon: HALOT
  rationale: 2인칭 남성 단수 목적어를 가진 분사적 표현을 자연스러운 현대 한국어로 옮기면서, 인격적 적대의 의미를 보존했습니다.
- source_word: יִלְבְּשׁוּ בֹשֶׁת
  english_pob_choice: will be clothed with shame
  chosen_korean: 수치를 입을 것이며
  alternatives_korean:
  - 부끄러움을 입을 것이며
  - 수치로 옷 입을 것이며
  lexicon: HALOT
  rationale: לבשׁ의 비유를 한국어 관용에 맞게 '입다'로 살리되, בֹשֶׁת은 공적 불명예까지 아우르는 '수치'로 옮겼습니다.
- source_word: וְאֹהֶל רְשָׁעִים
  english_pob_choice: the tent of the wicked
  chosen_korean: 악인들의 장막
  alternatives_korean:
  - 악인들의 천막
  - 악인들의 집
  lexicon: HALOT
  rationale: אֹהֶל의 구체적 이미지를 '장막'으로 보존했고, רְשָׁעִים은 '악인들'로 집단성을 드러냈습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: will be no more
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 더 이상 없을 것입니다
  - 있지 않을 것입니다
  - 없어질 것입니다
  lexicon: HALOT
  rationale: 문맥상 결과적·미래적 종결을 자연스럽게 드러내기 위해, 존재 부정을 한국어의 소멸 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 시간성
  chosen_reading: 미래적 결과로 읽어 '악인들의 장막은 사라질 것입니다'라고 번역했습니다.
  alternative_readings:
  - 현재 진술로 '악인들의 장막은 없습니다'라고 옮길 수 있습니다.
  rationale: 앞뒤 문맥이 경고와 결과를 말하는 흐름이어서, 히브리어의 존재 부정을 미래적 결말로 풀어 주는 것이 담화 흐름을 더 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §3, §6
