source:
  edition: WLC
  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
  footnotes:
  - marker: a
    text: Or, 'nor does he support evildoers,' or more literally, 'nor does he grasp the hand of evildoers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 하나님은 흠 없는 사람을 버리지 않으시고, 악인들의 손을 붙들어 주지도 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보라’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라, 이제
  lexicon: HALOT
  rationale: 시적 문맥에서 주의를 환기하는 감탄사로 기능하므로, 현대 한국어에서 자연스럽고 직접적인 호소인 '보십시오'로 옮겼습니다.
- source_word: תָּם
  english_pob_choice: a blameless man
  chosen_korean: 흠없는 사람
  alternatives_korean:
  - 흠없는 자
  - 완전한 사람
  - 정직한 사람
  lexicon: HALOT
  rationale: תָּם의 핵심은 도덕적 흠없음과 온전함이므로 '흠없는'이 가장 간결하게 살립니다. POB의 성별-일반적 독법을 반영해 '사람'으로 자연화했습니다.
- source_word: יִמְאַס
  english_pob_choice: reject
  chosen_korean: 버리지 않으시고
  alternatives_korean:
  - 거절하지 않으시고
  - 물리치지 않으시고
  - 외면하지 않으시고
  lexicon: HALOT
  rationale: 이 동사는 단순 감정적 경멸보다 관계적·판단적 거절을 뜻하므로, 시적 문맥에서 가장 자연한 한국어인 '버리다'를 부정형으로 풀었습니다.
- source_word: יַחֲזִיק בְּיַד
  english_pob_choice: uphold the hand of / take the hand of
  chosen_korean: 손을 붙들다
  alternatives_korean:
  - 손을 잡다
  - 손을 잡아 주다
  - 손을 붙들어 주다
  lexicon: HALOT
  rationale: 직역하면 '손을 잡다/붙들다'이지만, 여기서는 악인을 지지하거나 돕는다는 관용적 뜻이므로 구체적 이미지를 살리면서도 의미를 드러내는 '손을 붙들다'로 옮겼습니다.
- source_word: מְרֵעִים
  english_pob_choice: evildoers
  chosen_korean: 악인들
  alternatives_korean:
  - 악을 행하는 자들
  - 행악자들
  - 죄인들
  lexicon: HALOT
  rationale: 능동적 의미는 유지되지만 한국어 시가에서 가장 자연스럽고 축약된 집단명으로 '악인들'을 택했습니다.
theological_decisions:
- issue: יד 표현의 번역에서 문자적 이미지와 함축적 의미의 균형
  chosen_reading: '''악인들의 손을 붙들지도 않으십니다''로 옮겨, 손을 잡아 돕는 구체적 이미지를 살리면서 하나님의 부조(扶助) 부정을 드러냈습니다.'
  alternative_readings:
  - '''악인들을 지지하지 않으십니다'''
  - '''악인들의 손을 들어 주지 않으십니다'''
  rationale: 히브리어는 문자적으로 '손을 붙들다'이지만, 문맥상 하나님이 악인을 돕거나 후원하지 않으신다는 뜻이 핵심입니다. 너무 추상화하지 않되 과도한 해석도 피하는 균형을 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve the source image and implied theological claim.'
