  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
  footnotes:
  - marker: a
    text: Or 'he relies on his house.' The Hebrew verb can denote depending on something for support as well as physically leaning on it.
    reason: lexical_alternative
  - marker: b
    text: The repeated image of 'stand'/'remain standing' preserves the Hebrew poetic parallelism; the sense is that what he depends on proves unstable.
    reason: cross_reference
translation:
  language: ko
  text: 그는 자기 집[a]에 기대지만, 그 집은 서지 못합니다. 그것을 붙잡지만, 그것은 일어서지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 자기 집에 의지하지만.” 히브리어 동사는 물리적으로 기대는 것뿐 아니라 어떤 것에 의존한다는 뜻도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서지 못합니다’와 ‘일어서지 못합니다’라는 반복된 이미지는 히브리어의 시적 병행을 보존합니다. 그가 의지하는 것이 불안정하다는 뜻입니다.
    reason: cross_reference
