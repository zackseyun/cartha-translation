id: JOB.36.26
reference: Job 36:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
  footnotes:
  - marker: a
    text: Or, more literally, 'and we do not know.' The object 'him' is implicit from the context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'there is no searching out of the number of his years.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하나님은 위대하시며 우리는 그분을 알지 못합니다.[a] 그분의 햇수는 헤아릴 수 없습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘그리고 우리는 알지 못한다’라고 옮길 수 있습니다. 목적어는 문맥상 하나님을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 햇수를 찾아낼 길이 없습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라 하십시오
  - 이제
  lexicon: HALOT
  rationale: 감탄과 주목을 끄는 서두를 한국어 합쇼체에서 자연스럽게 살리기 위해 명령형적 호소인 ‘보십시오’를 택했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 시적 문맥에서 אֵל은 보통의 신칭으로 쓰이므로, 본문 전체의 신학적 용례에 맞춰 ‘하나님’으로 옮겼습니다.
- source_word: שַׂגִּיא
  english_pob_choice: great
  chosen_korean: 위대하시며
  alternatives_korean:
  - 크시며
  - 높으시며
  - 광대하시며
  lexicon: HALOT
  rationale: 단순한 크기보다 하나님의 초월적 위엄과 탁월함을 드러내기 위해 ‘위대하시며’를 선택했습니다.
- source_word: וְלֹא נֵדָע
  english_pob_choice: and we do not know him
  chosen_korean: 우리는 그분을 알지 못합니다
  alternatives_korean:
  - 우리는 알지 못합니다
  - 우리는 그분을 알 수 없습니다
  - 우리는 그분을 헤아리지 못합니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 하나님을 가리키므로, 영어 POB의 보충을 따라 ‘그분을’로 보완해 의미를 분명히 했습니다.
- source_word: חֵקֶר
  english_pob_choice: unsearchable
  chosen_korean: 헤아릴 수 없습니다
  alternatives_korean:
  - 찾아낼 수 없습니다
  - 탐구할 수 없습니다
  - 알아낼 수 없습니다
  lexicon: HALOT
  rationale: ‘검색/탐구의 대상이 되지 않는다’는 뜻을 한국어에서 자연스럽게 전달하면서도, 단순한 정보 부족보다 인간의 한계를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: אנθρω포모픽한 '그의 해들' 표현의 보존
  chosen_reading: ‘그분의 해의 수’로 직역해 하나님의 ‘해들’이라는 시적 표현을 유지했습니다.
  alternative_readings:
  - ‘그분의 영원하심’으로 해석해 옮김
  - ‘그분의 존재 기간’으로 풀어씀
  rationale: 본문은 하나님의 시간을 추상적으로 재해석하기보다, 사람의 언어로 하나님의 무한성을 말하는 시적 긴장을 유지합니다. 그래서 ‘해의 수’를 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 생략된 목적어의 보충
  chosen_reading: 문맥상 하나님을 가리키므로 ‘그분을’ 보충했습니다.
  alternative_readings:
  - 목적어를 생략한 채 ‘우리는 알지 못합니다’로 옮김
  - ‘그분은 알 수 없으십니다’로 의역
  rationale: 히브리어의 생략을 과도하게 평탄화하지 않으면서도, 독자가 ‘무엇을 알지 못하는지’를 분명히 이해하도록 최소한의 보충만 했습니다.
  doctrine_reference: Translation philosophy §1, §3
