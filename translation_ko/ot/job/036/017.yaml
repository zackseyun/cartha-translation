- source_word: מָלֵאתָ
  english_pob_choice: you are full of
  chosen_korean: 가득 차 있습니다
  alternatives_korean:
  - 가득합니다
  - 채워져 있습니다
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형의 현재적 상태를 한국어의 상태 서술로 자연스럽게 옮겼습니다.
- source_word: וּמִשְׁפָּט יִתְמֹכוּ
  english_pob_choice: judgment and justice seize you
  chosen_korean: 판단과 정의가 당신을 붙잡습니다
  alternatives_korean:
  - 판단과 정의가 당신을 지탱합니다
  - 판단과 정의가 당신을 붙잡아 둡니다
  lexicon: HALOT
  rationale: תמך는 ‘붙잡다/지탱하다/붙들다’의 범위를 가지며, 여기서는 압박적 이미지가 강하므로 ‘붙잡습니다’가 가장 무난합니다.
theological_decisions:
- issue: 마지막 동사의 방향성(지탱 vs. 포획)
  chosen_reading: ‘판단과 정의가 당신을 붙잡습니다’로, 의미 범위를 열어 둔 채 압박적·포획적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 판단과 정의가 당신을 지탱합니다
  - 판단과 정의가 당신을 붙듭니다
  rationale: 히브리어 יִתְמֹכוּ는 지탱과 붙듦 모두 가능하므로, 문맥의 심판적 긴장을 해치지 않는 범위에서 양가성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
