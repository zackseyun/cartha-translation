source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
  footnotes:
  - marker: a
    text: Or 'And you are full of the wicked man's judgment'; the Hebrew is compressed and may refer either to sharing the wicked person's judgment or to being occupied with the kind of judgment associated with the wicked.
    reason: alternative_reading
  - marker: b
    text: Or 'judgment and justice uphold you' or 'seize you'; the Hebrew verb can carry the sense of supporting, sustaining, or taking hold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 악인의 심판으로 가득 차 있습니다[a]; 심판과 정의가 당신을 붙잡습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 악인의 심판으로 가득 차 있습니다.’ 히브리어는 압축적이어서, 악인에게 속한 심판을 함께 받는다는 뜻인지, 악인과 관련된 종류의 심판에 사로잡혀 있다는 뜻인지 분명하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘심판과 정의가 당신을 지탱합니다’ 또는 ‘심판과 정의가 붙들고 있습니다.’ 히브리어 동사는 지탱하다, 붙들다, 붙잡다의 뜻을 가질 수 있으며, 목적어는 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  english_pob_choice: But / judgment
  chosen_korean: 그러나 / 판단
  alternatives_korean:
