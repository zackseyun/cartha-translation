language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
  footnotes:
  - marker: a
    text: Or 'And you are full of the wicked man's judgment'; the Hebrew is compressed and may refer either to sharing the wicked person's judgment or to being occupied with the kind of judgment associated with the wicked.
    reason: alternative_reading
  - marker: b
    text: Or 'judgment and justice uphold you' or 'seize you'; the Hebrew verb can carry the sense of supporting, sustaining, or taking hold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 악인의 판단으로 가득 차 있습니다[b][a]; 판단과 정의가 당신을 붙잡습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 악인의 판단으로 가득 차 있습니다’가 아니라 ‘악인의 판단에 속해 있습니다’로도 이해할 수 있습니다. 히브리어는 압축적이어서, 악인의 ‘판단’에 참여한다는 뜻인지 그와 같은 종류의 판단에 사로잡힌다는 뜻인지 둘 다 가능해 보입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘판단과 정의가 당신을 지탱합니다’로도 옮길 수 있습니다. 히브리어 동사는 지탱하다, 유지하다, 붙잡다의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  english_pob_choice: But / judgment
  chosen_korean: 그러나 / 판단
  alternatives_korean:
  - 그리고 / 재판
  - 이제 / 판결
  lexicon: HALOT
  rationale: 문맥상 앞선 권면과 대조를 이루므로 וְ는 ‘그러나’로 옮기고, דִּין은 법정적·판정적 의미를 살려 ‘판단’으로 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 죄인
  - 악한 사람
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰인 표현이므로 단일 개인보다 유형을 나타내는 ‘악인’이 자연스럽습니다.
- source_word: מָלֵאתָ
  english_pob_choice: you are full of
  chosen_korean: 가득 차 있습니다
  alternatives_korean:
  - 가득합니다
  - 채워져 있습니다
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형의 현재적 상태를 한국어의 상태 서술로 자연스럽게 옮겼습니다.
- source_word: וּמִשְׁפָּט יִתְמֹכוּ
  english_pob_choice: judgment and justice seize you
  chosen_korean: 판단과 정의가 당신을 붙잡습니다
  alternatives_korean:
  - 판단과 정의가 당신을 지탱합니다
  - 판단과 정의가 당신을 붙잡아 둡니다
  lexicon: HALOT
  rationale: תמך는 ‘붙잡다/지탱하다/붙들다’의 범위를 가지며, 여기서는 압박적 이미지가 강하므로 ‘붙잡습니다’가 가장 무난합니다.
theological_decisions:
- issue: 마지막 동사의 방향성(지탱 vs. 포획)
  chosen_reading: ‘판단과 정의가 당신을 붙잡습니다’로, 의미 범위를 열어 둔 채 압박적·포획적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 판단과 정의가 당신을 지탱합니다
  - 판단과 정의가 당신을 붙듭니다
  rationale: 히브리어 יִתְמֹכוּ는 지탱과 붙듦 모두 가능하므로, 문맥의 심판적 긴장을 해치지 않는 범위에서 양가성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
