  - 이제 / 판결
  lexicon: HALOT
  rationale: 문맥상 앞선 권면과 대조를 이루므로 וְ는 ‘그러나’로 옮기고, דִּין은 법정적·판정적 의미를 살려 ‘판단’으로 옮겼습니다.
- source_word: רָשָׁע
