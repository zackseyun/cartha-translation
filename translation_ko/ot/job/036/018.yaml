  source_fidelity: 첫 접속사 כִּי는 문맥상 원인·근거를 나타내므로 ‘그러므로’보다 ‘이는’(또는 ‘왜냐하면’)이 충실합니다. ‘분노’의 지시 대상을 특정하지 않은 점, סות의 유인 의미, סָפֶק의 난해성을 주석으로 보존한 점, 그리고 רָב כֹּפֶר를 ‘큰 속전’으로 옮긴 점은 대체로 원문에 충실합니다.
  naturalness: 기존의 ‘조롱으로 유혹하지 못하게’와 ‘당신을 돌아서게 하지 못하게 하십시오’는 한국어 결합과 이중 부정이 다소 어색합니다. ‘조롱에 빠지게 하지 않도록’, ‘빗나가게 하지 않도록’으로 다듬으면 현대 표준어 합쇼체에서 자연스럽고 의미도 유지됩니다.
  terminology: ‘분노’와 ‘속전’은 원문의 폭넓은 의미와 신학적 모호성을 보존합니다. ‘속전’을 ‘속죄값’으로 본문에서 한정하지 않고 주석에만 대안으로 둔 것은 적절합니다. 주석 표지는 각각 해당 어구인 ‘조롱’ 및 ‘큰 속전’에 붙여야 합니다.
