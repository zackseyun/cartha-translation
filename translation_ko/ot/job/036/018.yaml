  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
  footnotes:
  - marker: a
    text: Or 'lest it entice you with clapping'; the Hebrew term translated 'scoffing' is difficult and may refer more literally to striking the hands or clapping, possibly as a gesture of derision.
    reason: lexical_alternative
  - marker: b
    text: Or 'and do not let a great ransom sway you.' The Hebrew may be read with 'great' directly qualifying 'ransom.'
    reason: alternative_reading
  - marker: c
    text: '''Ransom'' may also be understood as ''price of atonement'' or, in some contexts, ''bribe.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 분노가 당신을 조롱으로 유혹하지 못하게 조심하십시오. 또한 큰 속전이 당신을 돌아서게 하지 못하게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '손뼉침으로'; 여기의 히브리어는 어렵고, 문자적으로는 경멸의 몸짓으로서 손뼉치기나 박수를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '큰 속전이 당신을 흔들어 놓지 못하게 하십시오.' 히브리어는 '큰'이 '속전'을 바로 수식하는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: '''속전''은 어떤 문맥에서는 ''속죄값'' 또는 ''뇌물''로도 이해될 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: 그러므로
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞선 경고를 받는 문맥에서 원인 접속의 기능을 한국어로 자연스럽게 살리되, 직역형 '왜냐하면'보다 권고문에 맞는 연결어로 옮겼습니다.
- source_word: יְסִיתְךָ
  english_pob_choice: it entice you
  chosen_korean: 유혹하지 못하게
  alternatives_korean:
  - 부추기지 못하게
  - 꾀지 못하게
  - 속이지 못하게
  lexicon: HALOT
  rationale: 히필형의 '부추기다/유혹하다/꾀다'의 의미를 반영해, 경고문 맥락에서 가장 자연스러운 '유혹하다'를 택했습니다.
- source_word: בְסָפֶק
  english_pob_choice: into scoffing
  chosen_korean: 조롱으로
  alternatives_korean:
  - 비웃음으로
  - 손뼉침으로
  - 조롱 가운데
  lexicon: HALOT
  rationale: 본문의 난해한 어휘를 POB처럼 핵심 의미인 경멸적 반응으로 풀어, 본문이 경고하는 잘못된 태도를 드러내는 표현으로 옮겼습니다. 문자적으로는 '손뼉침/박수'의 가능성도 주석으로 남겨야 합니다.
- source_word: כֹּפֶר
  english_pob_choice: a ransom
  chosen_korean: 큰 속전
  alternatives_korean:
  - 큰 대속값
  - 큰 속량값
  - 뇌물
  lexicon: HALOT
  rationale: כֹּפֶר의 기본 의미를 따라 '속전'으로 옮기되, 문맥상 그 규모를 나타내는 רָב을 살려 '큰'을 붙였습니다. '뇌물'은 가능하지만 본문이 요구하는 더 넓은 의미를 좁힐 수 있어 본문에는 두지 않았습니다.
- source_word: אַל יַטֶּךָּ
  english_pob_choice: do not let ... turn you aside
  chosen_korean: 당신을 돌아서게 하지 못하게
  alternatives_korean:
  - 당신을 치우치게 하지 못하게
  - 당신을 꺾지 못하게
  - 당신이 빗나가게 하지 못하게
  lexicon: HALOT
  rationale: נטה의 '돌리다/치우게 하다'라는 방향 전환 이미지를 살려, 의도된 길에서 벗어나게 하는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: בְסָפֶק의 난해성과 의도적 모호성
  chosen_reading: 본문에는 '조롱'으로 옮기되, 손뼉침/박수의 문자적 가능성은 주석에서 열어 둡니다.
  alternative_readings:
  - 손뼉침으로
  - 박수로
  - 비웃음으로
  rationale: 히브리어가 분명히 단정되지 않으므로, 본문은 경고의 기능을 살리는 해석을 택하고 주석으로 대안을 보존해 의미 범위를 지웠습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
