revisions:
- from: 그러므로 분노가 당신을 조롱으로 유혹하지 못하게 조심하십시오. 또한 큰 속전이 당신을 돌아서게 하지 못하게 하십시오.[a][b][c]
  to: 이는 분노가 당신을 조롱에 빠지게 하지 않도록 조심하십시오.[a] 또한 큰 속전이 당신을 빗나가게 하지 않도록 하십시오.[b][c]
  rationale: כִּי의 원인·근거 기능을 ‘이는’으로 회복했습니다. 분노의 지시 대상은 특정하지 않았고, בְסָפֶק의 논쟁적인 의미는 본문에서 ‘조롱’으로 유지하면서 문자적 대안을 주석으로 남겼습니다. 한국어의 자연스러운 연결과 주석 범위를 위해 동사 표현 및 주석 표지 위치를 조정했습니다.
