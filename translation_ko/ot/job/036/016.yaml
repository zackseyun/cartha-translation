id: JOB.36.16
reference: Job 36:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
  footnotes:
  - marker: a
    text: Or 'from the jaws of affliction' or 'from the mouth of a narrow place.' The Hebrew combines imagery of distress with constriction, contrasting it with the following 'broad place.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a spacious place with no restriction beneath it.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'full of fatness'; that is, full of rich abundance or rich food.
    reason: lexical_alternative
translation:
  language: ko
  text: 실로 그는 당신을 환난의 입에서 넓은 곳으로 이끌어 내셨고, 그 아래에는 구속이 없으며 당신의 상차림은 기름짐으로 가득 찼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף / הֲסִיתְךָ
  english_pob_choice: Indeed; he lured you
  chosen_korean: 실로 그는 당신을 이끌어 내셨고
  alternatives_korean:
  - 또한 그는 당신을 이끌어 내셨고
  - 그는 당신을 유혹하셨고
  - 그는 당신을 부추기셨고
  lexicon: HALOT
  rationale: וְאַף의 강조를 ‘실로’로 살리고, הֲסִיתְךָ는 이 문맥에서 ‘끌어내다/유도하다’의 긍정적 이동을 드러내되, ‘유혹하다’처럼 부정적 뉘앙스를 과도하게 강요하지 않도록 했습니다.
- source_word: מִפִּי צָר
  english_pob_choice: out of the mouth of distress
  chosen_korean: 환난의 입에서
  alternatives_korean:
  - 고통의 입에서
  - 재앙의 입에서
  - 좁은 곳의 입에서
  lexicon: HALOT
  rationale: ‘입’의 은유를 유지하되, צָר가 지닌 압박·곤란의 의미를 현대 한국어에서 가장 자연스럽게 드러내는 ‘환난’으로 옮겼습니다.
- source_word: רַחַב לֹא מוּצָק תַּחְתֶּיהָ
  english_pob_choice: a broad place with no constraint beneath it
  chosen_korean: 넓은 곳으로 … 그 아래에는 구속이 없으며
  alternatives_korean:
  - 넓은 곳으로 … 그 아래에는 제약이 없으며
  - 광활한 곳으로 … 아래에 좁음이 없으며
  - 넉넉한 곳으로 … 그 아래에는 압박이 없으며
  lexicon: HALOT
  rationale: ‘broad place’의 공간적 대비를 살리고, מוּצָק의 난해함은 ‘구속’으로 처리해 협착/제약의 대비를 보존했습니다.
- source_word: וְנַחַת שֻׁלְחָנְךָ מָלֵא דָשֶׁן
  english_pob_choice: and the setting of your table was full of richness
  chosen_korean: 당신의 상차림은 기름짐으로 가득 찼습니다
  alternatives_korean:
  - 당신의 상은 풍성함으로 가득 찼습니다
  - 당신의 식탁은 풍요로 가득 찼습니다
  - 당신의 상차림은 풍부한 음식으로 가득 찼습니다
  lexicon: HALOT
  rationale: וְנַחַת을 단순히 ‘놓인 것’으로 풀이하기보다 식탁 맥락에 맞는 ‘상차림’으로 풀어, ‘table’의 이미지와 דָשֶׁן의 ‘fatness/richness’ 의미를 ‘기름짐’으로 대응시켰습니다.
theological_decisions:
- issue: He라는 주어의 명시 여부
  chosen_reading: 주어를 ‘그는’으로 살려, 문맥상 하나님을 가리키지만 본문이 직접 이름을 쓰지 않는 점을 유지했습니다.
  alternative_readings:
  - ‘하나님은 당신을 이끌어 내셨고’로 명시
  - ‘누군가 당신을 이끌어 내셨고’로 중립화
  rationale: 히브리어는 3인칭 남성 단수 동사로 주어를 생략하므로, 본문 형식을 존중하면서도 문맥이 가리키는 분을 독자가 파악할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 환난과 넓은 곳의 공간 대비
  chosen_reading: ‘환난의 입’과 ‘넓은 곳’을 그대로 대비시켜 시적 이미지를 보존했습니다.
  alternative_readings:
  - ‘고난에서 자유로’처럼 추상화
  - ‘곤경에서 안식으로’처럼 의역
  rationale: 이 구절의 설득력은 압박/협착과 넓음/여유의 대조에 있으므로, 이미지를 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
