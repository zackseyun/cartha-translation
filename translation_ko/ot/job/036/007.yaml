id: JOB.36.7
reference: Job 36:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
  footnotes:
  - marker: a
    text: 'Or: ''and kings on the throne—he seats them forever.'' The Hebrew is compact, and some understand the clause to speak directly of kings rather than of the righteous being seated with kings.'
    reason: alternative_reading
  - marker: b
    text: 'Or: ''and he exalts them.'' The final verb may be understood actively with God as the implied subject.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 의인에게서 눈을 거두지 않으시고, 그들을 왕들과 함께 왕좌에 영원히 앉히시니, 그들은 높아집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘그리고 왕들을 왕좌에—그분이 그들을 영원히 앉히십니다.’ 히브리어는 매우 압축적이어서, 어떤 이들은 이 구절을 의인들이 왕들과 함께 앉는다는 말이 아니라 왕들 자체에 대한 진술로 이해합니다.'
    reason: alternative_reading
  - marker: b
    text: '또는: ‘그분이 그들을 높이십니다.’ 마지막 동사는 하나님이 암시된 주어인 능동형으로 이해될 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  english_pob_choice: withdraw
  chosen_korean: 눈을 거두지 않으시고
  alternatives_korean:
  - 눈을 떼지 않으시고
  - 눈을 돌리지 않으시고
  - 주시를 거두지 않으시고
  lexicon: HALOT
  rationale: ‘그의 눈’을 그대로 살리면서, ‘거두다’는 주의와 시선을 중단하는 뜻을 자연스럽게 담아 원문의 관용적 이미지를 보존합니다.
- source_word: מִצַּדִּיק
  english_pob_choice: from the righteous
  chosen_korean: 의인에게서
  alternatives_korean:
  - 의인에게서
  - 의로운 사람에게서
  - 의인들로부터
  lexicon: HALOT
  rationale: 단수 형용사가 집합적으로 쓰인 것으로 보고, ‘의인’으로 클래스 의미를 살리되 한국어 조사로 출발점의 의미를 분명히 했습니다.
- source_word: לַכִּסֵּא
  english_pob_choice: on the throne
  chosen_korean: 왕좌에
  alternatives_korean:
  - 왕좌에
  - 왕좌 위에
  - 왕좌 곁에
  lexicon: HALOT
  rationale: 히브리어의 왕권 장면을 직접적으로 살리기 위해 ‘왕좌’로 옮겼고, 장소 표지 ‘에’로 자연스럽게 연결했습니다.
- source_word: וַיִּגְבָּהוּ
  english_pob_choice: and they are exalted
  chosen_korean: 그들을 영원히 높이십니다
  alternatives_korean:
  - 그들을 높이십니다
  - 그들은 높아집니다
  - 그들을 높여 주십니다
  lexicon: HALOT
  rationale: 문맥상 의인들의 신분 상승을 말하므로 결과를 한국어 능동형으로 풀되, 마지막 절의 ‘영원히’와 함께 왕적 고양을 분명히 했습니다.
theological_decisions:
- issue: 왕좌에 앉히는 주체와 그 대상의 해석
  chosen_reading: 의인들이 왕들과 함께 왕좌에 앉는다는 뜻을 본문 흐름에 맞게 살렸습니다.
  alternative_readings:
  - 하나님이 왕들을 왕좌에 앉히신다는 해석
  - 왕들이 왕좌에 앉는다는 해석
  rationale: 히브리어는 매우 압축적이어서 주어·목적어의 연결이 다소 열려 있지만, 앞절의 의인에 대한 하나님의 지속적 주목과 연결하면 의인들이 왕적 영예에 참여하는 그림이 자연스럽습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘그들을 높이십니다’의 능동/수동 처리
  chosen_reading: 한국어 본문은 하나님을 주어로 하여 ‘높이십니다’로 옮겼습니다.
  alternative_readings:
  - 그들은 높아집니다
  - 그들을 높임을 받습니다
  rationale: 히브리어 말미는 형태상 애매하지만, 문맥상 하나님이 의인을 높이시는 결과를 말하므로 원인-결과를 분명히 하는 것이 시적 흐름에 더 적합합니다.
  doctrine_reference: Translation philosophy §1
