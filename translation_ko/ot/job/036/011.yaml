  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
  footnotes:
  - marker: a
    text: Or 'hear and obey'; the Hebrew verb for 'listen' can also carry the sense of obedient hearing in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'spend their days in good' and 'their years in delights.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그들이 듣고 섬기면, 자기들의 날들을 형통함 속에서 마치고 자기들의 해들을 즐거움 속에서 보낼 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁמע는 문맥에 따라 ‘듣다’뿐 아니라 ‘순종하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형통함’과 ‘즐거움’은 각각 ‘좋음’과 ‘즐거운 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
