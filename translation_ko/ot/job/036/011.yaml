  rationale: טוֹב의 실체화된 용법을 한국어의 추상명사적 표현으로 살려, 단순한 ‘좋음’보다 삶의 번성과 형편의 좋음을 포괄하도록 했습니다.
- source_word: בַּנְּעִימִים
  english_pob_choice: in pleasantness
  chosen_korean: 즐거움 속에서
  alternatives_korean:
  - 기쁨 속에서
  - 쾌적함 속에서
  - 즐거운 가운데
  lexicon: WLC/HALOT
  rationale: נעים의 ‘즐겁고 հաճ한’ 뉘앙스를 살리되, 시적 평행을 유지하기 위해 자연스러운 현대어인 ‘즐거움 속에서’를 택했습니다.
theological_decisions:
- issue: 이 절을 번역할 때 번영을 무조건적 약속으로 만들지 않을지
  chosen_reading: 엘리후의 조건적 진술로서 직역에 가깝게 두고, 도덕적 인과를 보편 교리처럼 확장하지 않았습니다.
  alternative_readings:
  - 의로운 자는 반드시 현세 번영을 누린다는 교리적 단정
  - 내적 영적 평안만을 가리키는 해석
  rationale: 히브리어 본문은 지혜 문맥의 조건문이므로, 번역이 그 긴장을 유지해야 하며 절 자체를 신학적으로 평탄화하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문이 말하는 조건적 약속의 범위를 보존함
