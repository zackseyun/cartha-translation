id: JOB.36.15
reference: Job 36:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
  footnotes:
  - marker: a
    text: Or 'delivers the poor in their affliction.' The Hebrew terms can emphasize poverty, affliction, or oppression.
    reason: lexical_alternative
  - marker: b
    text: Literally 'uncovers/open[s] their ear(s),' a Hebrew idiom for making someone listen or receive instruction.
    reason: cultural_note
translation:
  language: ko
  text: 그는 고난받는 이들을 그들의 고난 가운데서 건져 내시고, 압박 가운데서 그들의 귀를 여십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָנִי와 עָנְיוֹ는 가난뿐 아니라 고난이나 억압을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그들의 귀를 드러내다/열다’입니다. 이는 듣고 교훈이나 경고를 받아들이게 한다는 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  english_pob_choice: rescues
  chosen_korean: 구원하시고
  alternatives_korean:
  - 건져내시고
  - 구출하시고
  - 구해내시고
  lexicon: HALOT
  rationale: חלץ의 사역적 뉘앙스는 위험에서 건져내는 적극적 구원을 뜻하므로, 현대 한국어에서는 '구원하다'가 가장 자연스럽고 힘 있게 그 의미를 전달합니다.
- source_word: עָנִי / עָנְיוֹ
  english_pob_choice: the afflicted / by their affliction
  chosen_korean: 고난받는 이를 / 그들의 고난으로
  alternatives_korean:
  - 가난한 이를 / 그들의 가난으로
  - 곤고한 이를 / 그들의 곤고로
  - 압제당하는 이를 / 그들의 압박으로
  lexicon: HALOT
  rationale: עָנִי는 단순한 경제적 빈곤보다 고난·억압의 폭을 포함할 수 있어 '고난받는 이'로 옮겼고, בְעָנְיוֹ의 수단·상황적 뉘앙스는 '그들의 고난으로'로 살렸습니다.
- source_word: וְיִגֶל
  english_pob_choice: opens
  chosen_korean: 여십니다
  alternatives_korean:
  - 열어 주십니다
  - 드러내십니다
  - 밝히십니다
  lexicon: HALOT
  rationale: '''귀를 열다''는 히브리어 관용구를 한국어에서도 자연스럽게 살리기 위해 직역적 ''열어 주다''보다 간결한 ''여십니다''를 택했습니다.'
- source_word: בַּלַּחַץ אָזְנָם
  english_pob_choice: by oppression / their ears
  chosen_korean: 압박으로 그들의 귀를
  alternatives_korean:
  - 압제로 그들의 귀를
  - 고통으로 그들의 귀를
  - 곤경으로 그들의 귀를
  lexicon: HALOT
  rationale: לַחַץ는 압박·압제를 아우르므로 '압박'을 택해 강도를 유지했고, מושא인 '귀'는 복수형 어미를 그대로 반영해 '그들의 귀'로 옮겼습니다.
theological_decisions:
- issue: 고난이 구원과 듣게 하심의 수단으로 제시되는 방식
  chosen_reading: 본문의 문법적 평행을 따라 고난과 압박을 하나님이 사람을 구원하시고 듣게 하시는 수단으로 표현하되, 고난 그 자체를 선하거나 자동적으로 징벌적이라고 단정하지는 않습니다.
  alternative_readings:
  - 고난은 단지 구원이 일어나는 배경일 뿐입니다
  - 이 구절은 모든 고난이 직접적인 죄의 대가라고 가르칩니다
  rationale: 두 개의 ב 전치사구는 수단성/상황성을 강하게 드러내므로 이를 반영해야 하지만, 욥기의 맥락상 단순한 보응 신학으로 평평하게 만들지 않도록 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
