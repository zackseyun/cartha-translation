  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אָ֭מְנָם לֹא שֶׁ֣קֶר מִלָּ֑/י תְּמִ֖ים דֵּע֣וֹת עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
  footnotes:
  - marker: a
    text: Or, 'the one perfect in knowledge is with you,' possibly referring to God rather than to Elihu himself.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로, 내 말은 거짓이 아닙니다. 지식에 있어 완전한 이가 당신과 함께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지식에 있어 완전한 이’는 엘리후 자신이 아니라 하나님을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  english_pob_choice: For truly
  chosen_korean: 참으로
  alternatives_korean:
  - 정녕
  - 실로
  lexicon: HALOT
  rationale: 서술의 첫머리에서 화자의 강한 확언을 자연스러운 현대 한국어로 살리기 위해 하나의 강조 부사구로 묶어 옮겼습니다.
- source_word: לֹא שֶׁקֶר
  english_pob_choice: are not false
  chosen_korean: 거짓이 아닙니다
  alternatives_korean:
  - 거짓말이 아닙니다
  - 틀리지 않습니다
  lexicon: HALOT
  rationale: ‘my words’에 대한 서술로서, 내용의 진실성을 직역 투보다 자연스러운 부정 서술로 표현했습니다.
- source_word: מִלַּי
  english_pob_choice: my words
  chosen_korean: 내 말은
  alternatives_korean:
  - 내 말
  - 내 발언은
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘말들’을 한국어에서는 일반적인 단수 개념의 ‘말’로 옮기되, 문맥상 주어 표지를 살리기 위해 ‘은’을 붙였습니다.
- source_word: תְּמִים דֵּעוֹת
  english_pob_choice: perfect in knowledge
  chosen_korean: 지식에 있어 완전한
  alternatives_korean:
  - 완전한 지식의
  - 지식에 있어서 온전한
  lexicon: HALOT
  rationale: ‘תְּמִים’의 완전성/온전함과 ‘דֵּעוֹת’의 지식 범위를 함께 살리기 위해, 명사구를 관계적으로 풀어 한국어 어순에 맞췄습니다.
- source_word: עִמָּךְ
  english_pob_choice: is with you
  chosen_korean: 당신과 함께 있습니다
  alternatives_korean:
  - 당신과 함께 계십니다
  - 당신 곁에 있습니다
  lexicon: HALOT
  rationale: 두 번째 인칭 단수 여성형의 직접 호칭을 한국어에서는 문맥상 Job을 향한 대화로 자연스럽게 처리했고, 존재 동사는 평서형으로 유지했습니다.
theological_decisions:
- issue: ‘지식에 있어 완전한 이’의 지시 대상
  chosen_reading: 본문의 문장형을 유지하여, 엘리후의 자기진술로 읽힐 여지를 남깁니다.
  alternative_readings:
  - 하나님을 가리키는 말로 읽는 해석
  rationale: 즉시 앞뒤 문맥에서 엘리후가 자신의 발언을 변호하는 흐름이 강하므로, 한국어 본문은 단정적으로 해석을 고정하지 않고 원문의 긴장을 보존합니다.
  doctrine_reference: 해석상 모호성이 있을 때는 본문이 허용하는 범위를 넘겨 확정하지 않습니다.
