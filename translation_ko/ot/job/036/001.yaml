  alternatives_korean:
  - 엘리후우
  lexicon: 현대 외래어 표기 관행
  rationale: 인명은 통용되는 음역인 ‘엘리후’로 옮겨 표준 한국어 독자가 바로 पहचान할 수 있게 했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술형 בעברית의 wayyiqtol ‘and said’는 한국어에서는 보통 종결 동사로 자연스럽게 처리하는 것이 합당하므로 ‘말했습니다’로 간결하게 옮겼습니다.
