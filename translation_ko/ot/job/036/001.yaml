  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘더하다’이지만, 여기서는 담화 도입식으로 이미 말하던 화자가 발화를 재개하는 뜻이므로 한국어에서는 자연스럽게 ‘다시 말했습니다’로 옮기는 것이 기능을 가장 잘 살립니다.
- source_word: אֱלִיהוּא
