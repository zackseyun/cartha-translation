lexical_decisions:
- source_word: וַיֹּסֶף
  english_pob_choice: continued
  chosen_korean: 다시 말했습니다
  alternatives_korean:
  - 계속해서 말했습니다
  - 말을 이었습니다
  - 덧붙여 말했습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘더하다’이지만, 여기서는 담화 도입식으로 이미 말하던 화자가 발화를 재개하는 뜻이므로 한국어에서는 자연스럽게 ‘다시 말했습니다’로 옮기는 것이 기능을 가장 잘 살립니다.
- source_word: אֱלִיהוּא
  english_pob_choice: Elihu
  chosen_korean: 엘리후
  alternatives_korean:
  - 엘리후우
  lexicon: 현대 외래어 표기 관행
  rationale: 인명은 통용되는 음역인 ‘엘리후’로 옮겨 표준 한국어 독자가 바로 पहचान할 수 있게 했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술형 בעברית의 wayyiqtol ‘and said’는 한국어에서는 보통 종결 동사로 자연스럽게 처리하는 것이 합당하므로 ‘말했습니다’로 간결하게 옮겼습니다.
