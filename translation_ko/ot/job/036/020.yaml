  text: אַל תִּשְׁאַ֥ף הַ/לָּ֑יְלָה לַ/עֲל֖וֹת עַמִּ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
  footnotes:
  - marker: a
    text: Or, more literally, 'Do not long for the night, for peoples to go up under them.' The Hebrew is difficult; 'are taken away from their place' reflects a common contextual understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 밤을 갈망하지 마십시오[a]. 민족들이 그들의 자리에서 옮겨질 때를요.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘밤을 갈망하지 마십시오, 민족들이 그들 아래로 올라가도록.’ 히브리어는 난해하며, ‘그들의 자리에서 옮겨질 때’는 흔히 받아들여지는 문맥적 이해를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁאַף
  english_pob_choice: Do not long for
  chosen_korean: 갈망하지 마십시오
  alternatives_korean:
  - 사모하지 마십시오
  - 원하지 마십시오
  - 열망하지 마십시오
  lexicon: HALOT
  rationale: שׁאף의 강한 갈망·간절한 원함을 살리되, 한국어에서 자연스럽고 문맥상 경고의 어조에 맞는 표현을 택했습니다.
- source_word: הַלָּיְלָה
  english_pob_choice: the night
  chosen_korean: 밤
  alternatives_korean:
  - 그 밤
  - 밤중
  lexicon: HALOT
  rationale: 정관사가 있지만 한국어에서는 보통 자연스럽게 ‘밤’으로 옮기며, 명시적 정관은 문맥으로 충분히 드러납니다.
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 나라들
  - 사람들
  lexicon: HALOT
  rationale: 복수 집단을 가리키는 말이므로 단순한 ‘사람들’보다 민족적·집단적 뉘앙스가 있는 ‘민족들’이 더 가깝습니다.
- source_word: תַּחְתָּם
  english_pob_choice: from their place
  chosen_korean: 그들의 자리에서
  alternatives_korean:
  - 그들의 자리 아래에서
  - 그들의 위치에서
  - 그들이 있던 곳에서
  lexicon: HALOT
  rationale: 직역하면 ‘그들 아래’이지만, POB의 문맥 판단처럼 ‘옮겨짐/제거됨’의 의미를 살려 한국어에서는 ‘그들의 자리에서’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 난해구 לַעֲלוֹת עַמִּים תַּחְתָּם의 처리
  chosen_reading: ‘민족들이 그들의 자리에서 옮겨질 때’로 이해하여 번역했습니다.
  alternative_readings:
  - ‘민족들이 그들 아래로 올라갈 때’
  - ‘민족들의 올라감 때문에’
  rationale: POB의 주석처럼 직역은 문맥상 매우 난해하므로, 문맥적으로 통용되는 ‘이동/제거’의 의미를 살려 시적이고 이해 가능한 한국어로 제시했습니다.
  doctrine_reference: 본문 의미의 명료화는 교리 판단이 아니라 난해한 시어의 문맥적 해석에 관한 것입니다.
