source:
  edition: WLC
  text: זְ֭כֹר כִּֽי תַשְׂגִּ֣יא פָעֳל֑/וֹ אֲשֶׁ֖ר שֹׁרְר֣וּ אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
  footnotes:
  - marker: a
    text: Or 'which men have beheld' or 'which men have contemplated.' The Hebrew verb שֹׁרְרוּ is difficult, and some take it in the sense of seeing rather than singing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 일을 기억하십시오. 사람들이 그것을 노래한 바 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들이 그것을 보아 왔습니다’ 혹은 ‘사람들이 그것을 관조해 왔습니다’. 히브리어 동사 שֹׁרְרוּ는 뜻이 분명하지 않으며, 어떤 이들은 이를 ‘노래하다’보다 ‘보다’의 뜻으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 잊지 마십시오
  lexicon: HALOT
  rationale: 직접적인 2인칭 남성 단수 명령형을 표준적인 합쇼체 권고로 옮겼습니다.
- source_word: תַשְׂגִּיא
  english_pob_choice: you should exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 크게 하십시오
  - 증대시키십시오
  - 찬양하십시오
  lexicon: HALOT
  rationale: 히필형의 ‘크게 하다/높이다’ 의미를 한국어 자연스러운 권면으로 옮겼습니다. 영어 POB의 권고적 뉘앙스를 반영해 명령형으로 처리했습니다.
- source_word: פָעֳלוֹ
  english_pob_choice: his work
  chosen_korean: 그의 일
  alternatives_korean:
  - 그의 행하심
  - 그의 사역
  - 그의 하신 일
  lexicon: HALOT
  rationale: 하나님의 행위를 가리키는 넓은 의미를 살리면서도 한국어에서 가장 자연스럽고 간결한 표현을 택했습니다.
- source_word: שֹׁרְרוּ אֲנָשִׁים
  english_pob_choice: of which men have sung
  chosen_korean: 사람들이 그것을 노래한 바 있습니다
  alternatives_korean:
  - 사람들이 그것을 노래해 왔습니다
  - 사람들이 그것을 보아 왔습니다
  - 사람들이 그것을 관조해 왔습니다
  lexicon: HALOT
  rationale: 본문의 קשה한 שֹׁרְרוּ는 영어 POB처럼 기본적으로 ‘노래하다’로 옮기되, 주어 아ֲנָשִׁים을 성중립화하지 않고 ‘사람들’로 유지했습니다.
theological_decisions:
- issue: פָעֳלוֹ의 소유격 지시 대상
  chosen_reading: 하나님의 일
  alternative_readings:
  - 그의 일
  - 그분의 일
  rationale: 문맥상 엘리후가 하나님을 가리키고 있으므로, 한국어 본문은 자연스럽게 ‘그의 일’로 두되 독자가 하나님을 지시 대상으로 이해하도록 합니다.
  doctrine_reference: 문맥 지시와 대명사 보존 원칙
- issue: שֹׁרְרוּ의 난해한 의미
  chosen_reading: ‘노래한 바 있습니다’
  alternative_readings:
  - ‘보아 온 바 있습니다’
  - ‘관조해 온 바 있습니다’
  rationale: 영어 POB가 본문 주해상 ‘노래하다’를 본문 채택으로 두고 대안 의미를 각주로 남긴 점을 따라, 한국어 본문도 그 선택을 유지했습니다.
  doctrine_reference: 본문-각주 구분 원칙
