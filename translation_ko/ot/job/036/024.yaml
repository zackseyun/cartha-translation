translation:
  language: ko
  text: 사람들이 노래한 그의 일을 높여야 한다는 것을 기억하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들이 그것을 보았습니다’ 또는 ‘사람들이 그것을 관조했습니다’. 히브리어 동사 שֹׁרְרוּ는 뜻이 분명하지 않으며, 어떤 이들은 이를 ‘노래하다’가 아니라 ‘보다’라는 뜻으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
