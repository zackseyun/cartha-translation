  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
  footnotes:
  - marker: a
    text: Or 'uncovers their ear for instruction' or 'opens their ears to correction.'
    reason: lexical_alternative
  - marker: b
    text: '''Iniquity'' may also be rendered ''wickedness'' or, in some contexts, ''trouble.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들의 귀를 징계에 열어 주시고, 그들이 악에서 돌아서야 한다고 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀를 열다’는 ‘귀를 드러내다/열어 듣게 하다’의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악’은 여기서 אָוֶן의 도덕적 의미를 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל אָזְנָם
  english_pob_choice: He opens their ear
  chosen_korean: 그들의 귀를 열어 주시고
  alternatives_korean:
  - 그들의 귀를 드러내 주시고
  - 그들의 귀를 밝혀 주시고
  lexicon: HALOT
  rationale: גלה의 관용구를 한국어에서 자연스러운 ‘귀를 열다’로 옮겨, 듣도록 하시는 비유를 살리면서도 과도한 설명을 피했습니다.
- source_word: לַמּוּסָר
  english_pob_choice: to discipline
  chosen_korean: 징계에
  alternatives_korean:
  - 훈계에
  - 교정에
  - 교육에
  lexicon: HALOT
  rationale: מוּסָר는 교훈과 교정을 함께 담을 수 있으므로, 문맥상 교정적 훈육을 드러내는 ‘징계’를 택했습니다.
- source_word: יְשֻׁבוּן
  english_pob_choice: they should turn back
  chosen_korean: 그들이 돌아서야 한다고
  alternatives_korean:
  - 그들이 돌아오도록
  - 그들이 되돌아가야 한다고
  lexicon: HALOT
  rationale: שוב의 방향 전환과 회개적 뉘앙스를 살리기 위해 ‘돌아서다’를 사용했습니다.
- source_word: מֵאָוֶן
  english_pob_choice: from iniquity
  chosen_korean: 악에서
  alternatives_korean:
  - 죄악에서
  - 불의에서
  - 사악함에서
  lexicon: HALOT
  rationale: אָוֶן은 여기서 도덕적 그릇됨을 가리키므로, 한국어로는 가장 자연스럽고 포괄적인 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: מוּסָר의 신학적 뉘앙스
  chosen_reading: 하나님이 사람을 부르셔서 교정받게 하시는 징계
  alternative_readings:
  - 단순한 교육적 가르침
  - 더 강한 징벌적 징계
  rationale: 이 문맥은 고난을 통해 듣게 하고 돌이키게 하시는 하나님의 교정적 գործող을 보여 주므로, ‘징계’가 교훈과 교정을 함께 보존합니다.
  doctrine_reference: Translation philosophy §3, §6
