theological_decisions:
- issue: 어려운 শেষ구문의 의미를 어떻게 처리할지
  chosen_reading: ‘그것에게 명령하여 적중하게 하십니다’로 옮겨, 번개에 대한 하나님의 주권적 지시를 드러냈습니다.
  alternative_readings:
