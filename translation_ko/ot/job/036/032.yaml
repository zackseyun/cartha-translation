  - ‘그것을 치는 자에게 명령하십니다’
  rationale: 히브리어 말미는 난해하지만, 바로 앞의 폭풍-신현 맥락에서 대상이 번개라는 흐름을 살려 주권적 명령을 강조하는 번역이 가장 일관됩니다.
  doctrine_reference: 하나님의 주권적 섭리
