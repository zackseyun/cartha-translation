  source_fidelity: 히브리어 כִּי는 여기서 하나님이 알리시는 내용으로 이어지는 것이 자연스럽습니다. 초안의 ‘…때문입니다’는 인과관계로 바꾸어 본문의 구문을 약화합니다. יִתְגַּבָּרוּ의 문맥상 교만이라는 이해는 가능하되, 각주로 문자적 대안을 보존하는 것이 적절합니다.
  naturalness: ‘그러면’은 조건절적 문맥에서 가능하지만, 이 절만으로는 다소 불필요하게 접속 의미를 확정합니다. ‘그들의 행위와 그들의 죄과’는 반복이 무거우므로 ‘그들의 행위와 죄과’가 자연스럽습니다. ‘곧’을 사용하여 뒤의 절이 알리시는 내용임을 매끄럽게 드러냈습니다.
