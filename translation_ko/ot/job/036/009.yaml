base_translation:
  language: en
  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
  footnotes:
  - marker: a
    text: Or, more literally, 'that they have become strong'; in context the sense is likely self-exaltation or arrogance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 그들의 행위와 죄과, 곧 그들이 교만하게 행하였다는 것을[a] 알리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그들이 강해졌다는 것’; 문맥상 의미는 아마도 자기 높임이나 교만일 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: then he declares
  chosen_korean: 그러면 그가 … 알리십니다
  alternatives_korean:
  - 그리고 그가 … 말하십니다
  - 그러면 그가 … 선언하십니다
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다, 선언하다’의 뜻이므로, 단순한 말하기보다 공식적이고 무게감 있는 ‘알리십니다’가 적절합니다. 문맥의 흐름을 살려 ‘그러면’으로 이어졌습니다.
- source_word: פָּעֳלָם
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 행실
  - 그들의 일
  lexicon: HALOT
  rationale: פֹּעַל은 여기서 도덕적 평가를 받는 행동을 가리키므로, 직업적 의미의 ‘일’보다 ‘행위’가 더 정확합니다.
- source_word: וּפִשְׁעֵיהֶם
  english_pob_choice: their transgressions
  chosen_korean: 그들의 죄과
  alternatives_korean:
  - 그들의 범죄
  - 그들의 반역
  lexicon: HALOT
  rationale: פשע는 ‘반역/범죄/죄과’의 폭이 있지만, 시적·윤리적 문맥에서 ‘죄과’가 책임과 위반의 뉘앙스를 잘 살립니다.
- source_word: יִתְגַּבָּרוּ
  english_pob_choice: they have acted arrogantly
  chosen_korean: 그들이 교만하게 행했기 때문입니다
  alternatives_korean:
  - 그들이 ძლ? strong?
  - 그들이 스스로 높아졌기 때문입니다
  - 그들이 강해졌기 때문입니다
  lexicon: HALOT
  rationale: 히트파엘 גבר는 이 문맥에서 단순한 ‘강해짐’이 아니라 자기과시적 우쭐거림을 뜻하므로, POB의 해석을 따라 ‘교만하게 행하다’로 옮겼습니다.
theological_decisions:
- issue: יִתְגַּבָּרוּ의 윤리적 의미
  chosen_reading: 힘의 증가가 아니라 죄책을 드러내는 교만과 자기과시로 이해했습니다.
  alternative_readings:
  - 그들이 강해졌기 때문입니다
  - 그들이 이겼기 때문입니다
  rationale: 앞 절의 ‘행위’와 ‘죄과’와 평행을 이루므로, 본문은 능력의 진술이 아니라 책망의 진술로 읽는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
