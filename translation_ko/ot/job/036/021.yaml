  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 אַל תֵּפֶן은 문자적으로 ‘돌아서다/향하다’라는 금지이며, ‘마음을’은 원문에 없는 내면적 요소를 더합니다. 이를 제거하면 원문의 직접성과 은유를 더 잘 보존할 수 있습니다. עַל־זֶה와 מֵעֹנִי의 비교 관계는 ‘고난보다 이것을’로 적절히 드러납니다.
  naturalness: 합쇼체의 문체는 자연스럽고 일관됩니다. ‘악을 향해 돌아서지 마십시오’는 한국어에서 다소 중첩적으로 들릴 수 있으므로 ‘악으로 향하지 마십시오’가 더 매끄럽고 직접적입니다.
  terminology: אָוֶן을 ‘죄악’으로 택한 것은 영어 POB의 ‘iniquity’ 및 문맥상 윤리적 경고와 부합합니다. 다만 이 낱말에는 ‘악/악행’뿐 아니라 ‘불행/재난’의 의미 가능성도 있으므로 각주로 보존하는 것이 적절합니다. ‘고난’은 עֹנִי의 문맥적 번역으로 적절합니다.
