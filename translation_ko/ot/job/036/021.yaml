id: JOB.36.21
reference: Job 36:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
  footnotes:
  - marker: a
    text: Or 'evil,' 'wickedness,' or possibly 'trouble' for Hebrew אָוֶן.
    reason: lexical_alternative
  - marker: b
    text: Or 'instead of affliction' or 'than misery.' The sense is that he must not prefer wrongdoing to the suffering he is undergoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 조심하십시오[a]. 죄악[b]을 향해 마음을 돌리지 마십시오. 이는 당신이 고난보다 이것을 선택하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הִשָּׁמֶר는 경고의 명령으로, ‘주의하십시오’나 ‘삼가십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָוֶן은 여기서 ‘죄악’ 외에도 ‘악’, ‘악행’, ‘불행’ 또는 ‘재난’으로도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  english_pob_choice: Take care
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 삼가십시오
  - 경계하십시오
  lexicon: HALOT
  rationale: 분명한 경고의 명령형을 현대적이고 공손한 합쇼체로 살리기 위해 ‘조심하십시오’를 택했습니다.
- source_word: אַל תֵּפֶן
  english_pob_choice: do not turn
  chosen_korean: 마음을 돌리지 마십시오
  alternatives_korean:
  - 돌리지 마십시오
  - 향하지 마십시오
  - 기울이지 마십시오
  lexicon: HALOT
  rationale: 단순한 방향 전환보다 ‘향하다/기울이다’의 금지로서 뜻이지만, 한국어에서는 결심과 지향의 전환을 드러내는 ‘마음을 돌리다’가 자연스럽습니다.
- source_word: אֶל אָוֶן
  english_pob_choice: to iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 악
  - 악행
  - 불의
  lexicon: HALOT
  rationale: 오ֶן의 도덕적 의미를 살려 ‘죄악’으로 옮겼습니다. 문맥상 단순한 재난보다 잘못된 행위 쪽의 뉘앙스가 강합니다.
- source_word: מֵעֹנִי
  english_pob_choice: rather than affliction
  chosen_korean: 고난보다
  alternatives_korean:
  - 환난보다
  - 고통보다
  - 비참보다
  lexicon: HALOT
  rationale: 비교의 מ을 한국어의 ‘보다’로 풀어, 욥이 겪는 처지를 가리키는 ‘고난’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: אָוֶן의 번역 범위와 윤리적 경고의 강도
  chosen_reading: 여기서는 אָוֶן을 ‘죄악’으로 번역해, 고난 속에서 잘못을 택하지 말라는 윤리적 금지를 분명히 드러냈습니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 문맥은 고난 자체보다 그 고난에 대한 반응으로서의 도덕적 이탈을 경고하므로, 윤리적 무게를 가진 번역이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: Job 36:21 문맥
