theological_decisions:
- issue: אָוֶן의 번역 범위와 윤리적 경고의 강도
  chosen_reading: 여기서는 אָוֶן을 ‘죄악’으로 번역해, 고난 속에서 잘못을 택하지 말라는 윤리적 금지를 분명히 드러냈습니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 문맥은 고난 자체보다 그 고난에 대한 반응으로서의 도덕적 이탈을 경고하므로, 윤리적 무게를 가진 번역이 본문의 의도를 더 잘 반영합니다.
