  rationale: 히브리어 대명사 בוֹ는 문맥상 앞서 언급된 하나님의 행위나 일에 가리키는 것으로 보이므로, 한국어에서는 '그것'으로 자연스럽게 처리했습니다. '바라보다'도 가능하지만 여기서는 단순 관찰의 의미를 우선해 '보았습니다'를 택했습니다.
