  text: 온 인류가 그것을 보았습니다. 사람이 멀리서 바라봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 남성 단수 대명사는 문맥상 사람을 가리킬 수도 있지만, 여기서는 앞선 하나님의 일이나 행위를 가리키는 것으로 보는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: '''사람''과 ''인류''는 כאן אָדָם과 אֱנוֹשׁ의 보편적 인간 지칭을 반영한 표현입니다.'
