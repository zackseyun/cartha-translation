translation:
  language: ko
  text: 온 인류가[a][b] 그것을 보았습니다. 사람이 멀리서 바라봅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 남성 단수 대명사는 ‘그분을’로 옮길 수도 있습니다. 그러나 문맥상 앞서 언급된 하나님의 일이나 행위를 가리키는 것으로 보는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘인류’와 ‘사람’은 히브리어 אָדָם과 אֱנוֹשׁ이 사람들을 보편적으로 가리키는 용법을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  english_pob_choice: All mankind
  chosen_korean: 온 인류
  alternatives_korean:
  - 모든 사람
  - 온 사람들
  lexicon: HALOT
  rationale: כָּל אָדָם의 포괄성을 살려 집합적 표현으로 옮겼습니다. '온 인류'는 성별을 특정하지 않으면서도 공동체 전체를 자연스럽게 드러냅니다.
- source_word: חָזוּ בוֹ
  english_pob_choice: has looked on it
  chosen_korean: 그것을 보았습니다
  alternatives_korean:
  - 그를 보았습니다
  - 그것을 바라보았습니다
  lexicon: HALOT
  rationale: 히브리어 대명사 בוֹ는 문맥상 앞서 언급된 하나님의 행위나 일에 가리키는 것으로 보이므로, 한국어에서는 '그것'으로 자연스럽게 처리했습니다. '바라보다'도 가능하지만 여기서는 단순 관찰의 의미를 우선해 '보았습니다'를 택했습니다.
- source_word: אֱנוֹשׁ יַבִּיט
  english_pob_choice: man gazes
  chosen_korean: 사람이 바라봅니다
  alternatives_korean:
  - 사람이 응시합니다
  - 죽을 인생이 바라봅니다
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 인간, 곧 유한한 사람을 가리키며 시적 평행법상 '사람'이 가장 자연스럽습니다. יַבִּיט의 지속적 응시를 살려 '바라봅니다'로 옮겼습니다.
- source_word: מֵרָחוֹק
  english_pob_choice: from afar
  chosen_korean: 멀리서
  alternatives_korean:
  - 아주 멀리서
  - 먼 곳에서
  lexicon: HALOT
  rationale: מֵרָחוֹק의 거리감을 간결하고 시적으로 살릴 수 있는 현대 한국어 표현으로 옮겼습니다.
