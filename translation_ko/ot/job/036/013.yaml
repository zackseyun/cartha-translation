reference: Job 36:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
  footnotes:
  - marker: a
    text: Or 'for/because he binds them.' The Hebrew conjunction can be read causally rather than temporally.
    reason: alternative_reading
  - marker: b
    text: '''The godless in heart'' may also be rendered ''the hypocrites in heart'' or ''the impious at heart.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 마음이 불경한 자들은 분노를 쌓아 두고 — 그가 그들을 묶을 때에도 — 도움을 부르짖지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 여기서 ‘때에/때에도’의 시간적 의미로도, ‘왜냐하면/때문에’의 이유적 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마음이 불경한 자들’은 ‘마음의 위선자들’ 또는 ‘마음이 경건하지 않은 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנְפֵי לֵב
  english_pob_choice: the godless in heart
  chosen_korean: 마음이 불경한 자들
  alternatives_korean:
  - 마음이 위선적인 자들
  - 마음이 경건하지 않은 자들
  - 마음의 불경한 자들
  lexicon: HALOT
  rationale: חנף은 욥기에서 단순한 위선보다 하나님을 경외하지 않는 불경·불경건의 뜻이 두드러지므로, 한국어로는 ‘불경한 자들’이 source 의미를 가장 직접적으로 드러냅니다. לֵב는 인격의 내면을 가리키므로 ‘마음이’로 옮겼습니다.
- source_word: יָשִׂימוּ אָף
  english_pob_choice: store up anger
  chosen_korean: 분노를 쌓아 두고
  alternatives_korean:
  - 분노를 쌓고
  - 진노를 간직하고
  - 화를 쌓아 두고
  lexicon: HALOT
  rationale: אָף는 여기서 그들의 내면적 분노를 가리키므로, 자연스러운 한국어 관용을 살리되 축적의 이미지를 유지하는 ‘쌓아 두다’가 적절합니다.
- source_word: לֹא יְשַׁוְּעוּ
  english_pob_choice: they do not cry for help
  chosen_korean: 도움을 부르짖지 않습니다
  alternatives_korean:
  - 도움을 외치지 않습니다
  - 부르짖어 도움을 구하지 않습니다
  - 도움을 호소하지 않습니다
  lexicon: HALOT
  rationale: שׁוע의 핵심은 고통 속에서의 구조 요청이므로 ‘부르짖다’와 ‘도움’의 결합이 의미를 가장 온전히 전달합니다.
- source_word: אֲסָרָם
  english_pob_choice: he binds them
  chosen_korean: 그가 그들을 묶을 때에도
  alternatives_korean:
  - 그가 그들을 묶을 때
  - 그가 그들을 속박할 때에도
  - 그가 그들을 가둘 때에도
  lexicon: HALOT
  rationale: אָסַר은 묶다/속박하다의 뜻이지만, 문맥상 하나님이 고난으로 그들을 제어하시는 장면을 가리킬 수 있어 ‘묶다’로 직역성을 유지했습니다. 한국어 어순을 위해 종속절 형태로 옮겼습니다.
theological_decisions:
- issue: 'כִּי의 관계: 시간 또는 이유'
  chosen_reading: ‘그가 그들을 묶을 때에도’로 시간적 뉘앙스를 본문에 두고, 원문의 이유/근거 가능성은 본문 밖에서 열어 둡니다.
  alternative_readings:
  - ‘그가 그들을 묶기 때문에’
  - ‘그가 그들을 묶으므로’
  rationale: 히브리어 כִּי는 이 자리에서 시간적·인과적 둘 다 가능하지만, 앞뒤 흐름상 고난의 순간에 도움을 부르짖지 않는다는 서술이 자연스럽습니다. 의미의 긴장을 해소하지 않기 위해 본문은 시간적 읽기를 택했습니다.
  doctrine_reference: 원문 다의성 보존
- issue: 단수 주어 ‘he’의 지시 대상
  chosen_reading: ‘그가’로 두어 직접적으로 하나님을 명시하지 않고, 문맥으로 하나님을 식별하도록 합니다.
  alternative_readings:
  - ‘하나님이 그들을 묶을 때에도’
  rationale: 히브리어는 단수 동사와 인칭 접미로 표현하며, 문맥상 그 행위자는 하나님으로 이해됩니다. 본문은 source의 형식을 따라 ‘그가’를 유지하는 것이 더 충실합니다.
  doctrine_reference: 원문 주어 보존
