  source_fidelity: 첫 행의 물방울을 위로 거두어 올리는 이미지는 적절합니다. 그러나 둘째 행의 יָזֹקּוּ는 비를 ‘증발시킨다’는 뜻으로 보기 어렵고, 비를 방울방울 떨어뜨리거나 쏟아 내는 이미지로 옮기는 편이 원문과 영어 POB의 난해성 처리에 더 충실합니다. 히브리어의 복수 동사를 한국어에서도 ‘그것들이’로 드러내어, 원문에 명시되지 않은 주어를 단정하지 않았습니다.
  naturalness: ‘비를 증발시켜 내리십니다’는 물리 과정상 부자연스럽고 의미가 상충합니다. 수정안은 현대 표준어 합쇼체로 자연스럽게 읽히면서 시적 표현을 유지합니다.
