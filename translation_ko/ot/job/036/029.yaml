    text: ‘굉음’은 또한 ‘울림’ 또는 ‘요란한 소리’로 옮길 수 있습니다. ‘장막’은 ‘정자’ 또는 ‘덮개’로도 옮길 수 있으며, 여기서는 폭풍구름과 관련된 하나님의 시적 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
