    rationale: 영어 감사 기록은 תְּשֻׁאוֹת와 סֻכָּתוֹ의 대안적 의미도 명시합니다. 한국어에서도 해당 어구에 각주를 두어 ‘울림/요란한 소리’ 및 ‘정자/덮개’ 가능성을 밝혀 두는 것이 적절합니다.
