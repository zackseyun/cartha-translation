    rationale: 원문의 속격 연결은 그의 장막과 관련된 큰 울림을 가리킵니다. 한국어에서는 ‘그의 장막에서 나는 굉음’이 소리의 관계를 자연스럽게 드러내며, ‘굉음’은 תְּשֻׁאוֹת의 넓은 의미 범위를 유지합니다.
