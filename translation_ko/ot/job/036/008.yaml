lexical_decisions:
- source_word: וְ/אִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 접속사 וְ와 조건사 אִם의 결합을 살려, 앞뒤 문맥의 흐름을 이어 주는 조건문으로 옮겼습니다.
- source_word: בַּ/זִּקִּים
  english_pob_choice: in chains
  chosen_korean: 쇠사슬에 묶이고
  alternatives_korean:
  - 사슬에 묶이고
  - 족쇄에 묶이고
  lexicon: HALOT
  rationale: זִּקִּים은 구속 도구를 가리키므로, 현대 한국어에서 자연스럽고 구체적인 ‘쇠사슬’로 옮겨 구속의 이미지를 분명하게 살렸습니다.
- source_word: יִ֝לָּכְד֗וּ/ן
  english_pob_choice: caught
  chosen_korean: 붙잡히면
  alternatives_korean:
  - 포로가 되면
  - 사로잡히면
  lexicon: HALOT
  rationale: לכד의 피동적 의미를 살리면서, 앞의 ‘묶이고’와 평행을 이루는 자연스러운 수동 표현으로 옮겼습니다.
- source_word: בְּ/חַבְלֵי עֹנִי
  english_pob_choice: in cords of affliction
  chosen_korean: 고난의 밧줄에
  alternatives_korean:
  - 환난의 줄에
  - 비참의 밧줄에
  - 궁핍의 줄에
  lexicon: HALOT
  rationale: עֹנִי는 문맥상 경제적 가난보다 넓은 고통을 가리키므로 ‘고난’으로 옮겼고, חַבְלֵי는 단순한 ‘줄’보다 물리적 구속감을 더하는 ‘밧줄’로 대응했습니다.
theological_decisions:
- issue: 구속 이미지의 성격
  chosen_reading: 물리적 속박의 이미지를 그대로 살리되, 문맥상 고난과 징계의 비유로도 읽히도록 열어 두었습니다.
  alternative_readings:
  - 순전히 문자적 투옥으로만 읽는 해석
  - 순전히 비유적 환난 표현으로만 읽는 해석
  rationale: 히브리어는 ‘묶이고, 사로잡히고, 밧줄’이라는 구체적 어휘를 사용하지만, 욥기 36장의 문맥에서는 하나님의 다루심을 말하는 비유적 울림도 유지됩니다.
  doctrine_reference: '번역 원칙: 소스의 긴장을 해소하지 않고 보존함.'
