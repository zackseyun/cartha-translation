lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: which
  chosen_korean: 그것은
  alternatives_korean:
  - 이는
  - 그것이
  lexicon: HALOT
  rationale: 앞선 대상과 이어지는 관계를 한국어에서는 부자연스러운 관계대명사보다 지시 대명사로 받는 편이 자연스럽고, 문맥 연결도 분명합니다.
- source_word: יִזְּל֥וּ שְׁחָקִ֑ים
  english_pob_choice: the clouds pour down
  chosen_korean: 구름들이 쏟아 붓고
  alternatives_korean:
  - 구름들이 퍼붓고
  - 구름이 흘러내리고
  - 하늘이 쏟아 붓고
  lexicon: HALOT
  rationale: נזל의 하향 흐름을 ‘쏟아 붓다’로 옮겨 비의 내림을 자연스럽게 살렸고, שְׁחָקִים는 이 문맥에서 ‘구름들’이 가장 직접적입니다.
- source_word: יִרְעֲפ֗וּ
  english_pob_choice: they drip
  chosen_korean: 흩뿌립니다
  alternatives_korean:
  - 방울져 떨어집니다
  - 뚝뚝 떨어집니다
  - 적셔 줍니다
  lexicon: HALOT
  rationale: רָעַף의 핵심 이미지는 물방울의 낙하이지만, 현대 한국어에서는 ‘흩뿌리다’가 비를 내리는 반복적·분산적 동작을 더 자연스럽게 전달합니다.
- source_word: עֲלֵי אָדָם
  english_pob_choice: on man
  chosen_korean: 사람에게
  alternatives_korean:
  - 사람 위에
  - 인간에게
  - 인류에게
  lexicon: HALOT
  rationale: אָדָם은 여기서 특정 남성이 아니라 인간 일반을 가리키는 단수의 보편명사이므로, 한국어에서는 독자에게 바로 이해되는 ‘사람’으로 옮겼습니다.
- source_word: רָב
  english_pob_choice: abundantly
  chosen_korean: 넉넉히
  alternatives_korean:
  - 풍성하게
  - 많이
  - 충분히
  lexicon: HALOT
  rationale: 부사적으로 쓰인 רָב의 풍성한 정도를 나타내되, 한국어에서 비의 양과 동작의 충만함을 자연스럽게 담는 표현으로 ‘넉넉히’를 선택했습니다.
theological_decisions:
- issue: אָדָם의 대표적 단수와 성중립 처리
  chosen_reading: ‘사람’으로 번역하여 대표적 단수의 보편적 의미를 살렸습니다.
  alternative_readings:
  - ‘인간’
  - ‘인류’
  - ‘남자’
  rationale: 히브리어 אָדָם은 여기서 단수형이지만 인간 일반을 가리키므로, 본문 의미를 해치지 않으면서 현대 한국어 독자가 자연스럽게 이해할 수 있는 보편적 표현을 택했습니다.
