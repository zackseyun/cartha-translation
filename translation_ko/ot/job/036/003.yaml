  - marker: b
    text: 또는 ‘내 창조주께 정의를 돌리겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  english_pob_choice: I will bring
  chosen_korean: 가져오고
  alternatives_korean:
  - 가져오겠습니다
  - 옮기고
  - 들고 오겠습니다
  lexicon: HALOT
  rationale: נשׂא는 문자적으로 ‘들다/지니다’이지만, ‘내 지식’과 ‘멀리서’가 함께 나와 지식을 어떤 먼 곳에서 끌어와 제시한다는 뜻이므로 한국어에서는 자연스럽게 ‘가져오다’로 옮겼습니다.
- source_word: דֵעִי
  english_pob_choice: my knowledge
  chosen_korean: 내 지식
  alternatives_korean:
  - 나의 지식
  - 내 이해
  - 내 의견
  lexicon: HALOT
  rationale: דעת 계열은 단순한 의견보다 실제로 알고 있는 지식이나 이해를 가리키므로, 직설적이고 분명한 ‘내 지식’이 가장 가깝습니다.
- source_word: לְמֵרָחוֹק
  english_pob_choice: from afar
  chosen_korean: 멀리서
  alternatives_korean:
  - 먼 곳에서
  - 아득히 먼 데서
  lexicon: HALOT
  rationale: 이 전치사구는 지식의 출처 또는 도달 거리를 나타내므로, 간결하고 관용적인 한국어 표현인 ‘멀리서’가 원문의 감각을 잘 살립니다.
- source_word: וּלְפֹעֲלִי
  english_pob_choice: to my Maker
  chosen_korean: 내 창조주께
  alternatives_korean:
  - 나를 지으신 분께
  - 내 만드신 이에게
  - 내 조성자께
  lexicon: HALOT
  rationale: פֹעֵל은 ‘행하는 이/만드는 이’로, כאן에서는 하나님을 가리키는 호칭이므로 한국어에서는 의미가 분명한 ‘창조주’로 옮겼습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의를
  alternatives_korean:
  - 정의를
  - 옳음을
  - 의로움을
  lexicon: HALOT
  rationale: צדק은 하나님께 돌려지는 ‘의/정의’의 넓은 범위를 지니므로, 하나님의 성품과 행위의 바름을 포괄하는 기본 용례인 ‘의’를 택했습니다.
theological_decisions:
- issue: צֶדֶק의 신학적 뉘앙스
  chosen_reading: ‘의를 돌리겠습니다’는 하나님께 바름과 의로움을 귀속시키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘정의를 돌리겠습니다’로 좁혀 사회적·법정적 뉘앙스를 강조하는 읽기
  rationale: 문맥상 엘리후는 자기 창조주께 하나님의 올바름을 인정하고 선언합니다. ‘의’는 그 선언의 신학적 폭을 유지하면서도, POB가 보존한 ‘justice’ 대안을 완전히 지우지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
