  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
  footnotes:
  - marker: a
    text: Or "for lack of knowledge."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 듣지 않으면, 칼에 쓰러지고 지식이 없이 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지식이 부족해서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא
  english_pob_choice: But if they do not listen
  chosen_korean: 그러나 그들이 듣지 않으면
  alternatives_korean:
  - 그리고 그들이 듣지 않으면
  - 만일 그들이 듣지 않으면
  lexicon: HALOT
  rationale: 앞절과의 대조를 살려 역접 ‘그러나’로 시작했고, 조건절은 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יִשְׁמְעוּ
  english_pob_choice: they do not listen
  chosen_korean: 듣지 않으면
  alternatives_korean:
  - 듣지 않으면
  - 귀 기울이지 않으면
  - 순종하지 않으면
  lexicon: HALOT
  rationale: שׁמע의 의미 범위(듣다/귀를 기울이다/순종하다)를 과도하게 좁히지 않기 위해 ‘듣다’를 기본으로 살렸습니다.
- source_word: בְּשֶׁלַח
  english_pob_choice: by the sword
  chosen_korean: 칼에 쓰러지고
  alternatives_korean:
  - 칼에 의해
  - 칼로
  - 무기로
  lexicon: HALOT
  rationale: 직역형 ‘칼로’도 가능하지만, 문맥상 심판의 결과를 자연스럽게 드러내기 위해 ‘칼에 쓰러지고’로 옮겼습니다.
- source_word: כִּבְלִי דָעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식이 없이
  alternatives_korean:
  - 무지한 채로
  - 알지 못한 채로
  - 지식 없이
  lexicon: HALOT
  rationale: 히브리어 전치사구의 상태적 의미를 살려 ‘지식이 없이’로 옮겼고, ‘for lack of knowledge’의 원인 뉘앙스는 본문이 아니라 해석의 여지로 남겼습니다.
theological_decisions:
- issue: יָעֲבֹרוּ와 יִגְוְעוּ의 심판적 병렬을 어떻게 처리할지
  chosen_reading: ‘칼에 쓰러지고 … 죽을 것입니다’로 두 동사를 분리해 심판과 죽음을 모두 드러냈습니다.
  alternative_readings:
  - ‘지나가고 죽을 것입니다’
  - ‘패하고 죽을 것입니다’
  rationale: 두 동사는 단순 반복이 아니라 심판의 통과와 죽음을 병렬적으로 강조하므로, 한국어에서도 둘을 분리해 의미의 중첩을 보존했습니다.
  doctrine_reference: Translation philosophy §3
