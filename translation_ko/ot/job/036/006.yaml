id: JOB.36.6
reference: Job 36:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
  footnotes:
  - marker: a
    text: Or 'He does not let the wicked live.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the poor'; Hebrew 'the afflicted/poor' can denote those who are lowly, oppressed, or economically poor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 악인을 살려 두지 않으시지만, 고난받는 이들에게는 정의를 베푸십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살게 하지 않으신다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가난한 이들’; 히브리어 ‘고난받는/가난한’은 낮고, 억눌리고, 경제적으로 가난한 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  english_pob_choice: keep alive
  chosen_korean: 살려 두지 않으시지만
  alternatives_korean:
  - 살아 있게 두지 않으시지만
  - 살게 하지 않으시지만
  - 목숨을 붙여 두지 않으시지만
  lexicon: HALOT
  rationale: 피엘형 동사 חיה는 여기서 부활의 의미가 아니라 ‘살아 있게 보존하다/살려 두다’의 뉘앙스이므로, 지속적 보존을 나타내는 표현으로 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 불의한 사람
  lexicon: HALOT
  rationale: 단수형이지만 대표적·일반적 의미로 쓰이므로, 한국어에서도 자연스럽고 범주적 의미를 유지하는 ‘악인’을 택했습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 재판
  - 판결
  - 권리
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 법정 행위보다 고난받는 이들에게 마땅히 주어져야 할 공정한 결과를 가리키므로, ‘정의’를 사용했습니다.
- source_word: עֲנִיִּים
  english_pob_choice: the afflicted
  chosen_korean: 고난받는 이들
  alternatives_korean:
  - 가난한 이들
  - 겸손한 이들
  - 억눌린 이들
  lexicon: HALOT
  rationale: עָנִי는 경제적 가난뿐 아니라 억눌림·고난·비천함을 포괄하므로, 그 의미 범위를 좁히지 않는 ‘고난받는 이들’이 가장 적절합니다.
- source_word: יִתֵּן
  english_pob_choice: gives
  chosen_korean: 베푸십니다
  alternatives_korean:
  - 주십니다
  - 내리십니다
  - 가져다주십니다
  lexicon: HALOT
  rationale: 히브리어 נתן의 기본 의미는 ‘주다’이지만, 한국어에서는 ‘정의를 베풀다’가 시적이면서도 자연스러워 동사구를 매끄럽게 살렸습니다.
theological_decisions:
- issue: 악인을 ‘살려 두지 않으신다’는 표현이 생명 창조나 부활을 뜻하는지 여부
  chosen_reading: 여기서는 하나님의 지속적 보존 거부를 뜻하는 것으로 읽고, 부활이나 생명 부여로 확대하지 않았습니다.
  alternative_readings:
  - 악인을 살게 하지 않으신다
  - 악인에게 생명을 주지 않으신다
  rationale: 문맥의 대조는 악인에 대한 하나님의 섭리와 고난받는 이들에 대한 정의의 수여에 있으므로, 문장이 직접 말하지 않는 부활적 함의를 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; 문맥이 요구하는 의미만 반영'
