base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
  footnotes:
  - marker: a
    text: Or 'over him'; the Hebrew pronoun is masculine singular, but the referent is not explicit and may point to the cloud/storm context rather than a person.
    reason: alternative_reading
  - marker: b
    text: Or 'his lightning' or 'his brightness' for 'his light.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the roots of the sea'; this may mean its deepest or foundational parts.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 그가 그의 빛[b]을 그 위에[a] 펼치시고, 바다의 뿌리들[c]을 덮으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 위에’에 해당하는 히브리어 표현의 접미사는 남성 단수이지만, 가리키는 대상은 분명하지 않습니다. 문맥상 사람을 가리킬 수도 있고 폭풍이나 구름과 같은 무생물을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘빛’은 문맥상 ‘번개’ 또는 ‘광휘’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘바다의 뿌리들’이며, 바다의 가장 깊은 곳이나 기초를 가리킬 수 있습니다.
    reason: lexical_alternative
