id: JOB.36.30
reference: Job 36:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
  footnotes:
  - marker: a
    text: Or 'over him'; the Hebrew pronoun is masculine singular, but the referent is not explicit and may point to the cloud/storm context rather than a person.
    reason: alternative_reading
  - marker: b
    text: Or 'his lightning' or 'his brightness' for 'his light.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the roots of the sea'; this may mean its deepest or foundational parts.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 그가 자기 빛을 그 위에 펼치시고, 바다의 뿌리들을 덮으십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 대명사는 남성 단수이지만, 문맥상 가리키는 대상은 분명하지 않아 ‘그’로도, 무생물인 폭풍/구름으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘빛’은 문맥상 ‘번개’ 또는 ‘광휘’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘바다의 뿌리들’이며, 바다의 가장 깊은 곳이나 기초를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 주의를 끄는 시적 담화 표지로서, 합쇼체에서 가장 자연스럽고 격조 있는 호응인 ‘보십시오’로 옮겼습니다.
- source_word: פָּרַשׂ
  english_pob_choice: spreads
  chosen_korean: 펼치시고
  alternatives_korean:
  - 펼치고
  - 펼쳐 놓으시고
  - 펴시고
  lexicon: HALOT
  rationale: ‘펴다/펼치다’의 확장 이미지를 살리되, 시적 병렬을 위해 연결형 ‘펼치시고’를 택했습니다.
- source_word: אוֹרוֹ
  english_pob_choice: his light
  chosen_korean: 자기 빛
  alternatives_korean:
  - 그의 빛
  - 그의 광명
  - 번개
  lexicon: HALOT
  rationale: 본문의 기본 어휘는 ‘빛’이므로 이를 유지하되, 히브리어 대명사와 시적 소유 관계를 자연스럽게 드러내기 위해 ‘자기 빛’으로 옮겼습니다.
- source_word: שָׁרְשֵׁי הַיָּם
  english_pob_choice: the roots of the sea
  chosen_korean: 바다의 뿌리들
  alternatives_korean:
  - 바다의 근원들
  - 바다의 기초들
  - 바다의 깊은 곳들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘뿌리들’을 유지하여 히브리어의 은유를 보존했고, 복수형도 반영했습니다.
theological_decisions:
- issue: ‘his light’의 의미를 일반 광채로 둘지, 폭풍 문맥의 번개로 좁힐지
  chosen_reading: 본문에는 ‘빛’을 유지하되 특정화하지 않았습니다.
  alternative_readings:
  - 번개
  - 광휘
  rationale: 주변 문맥상 번개를 시사할 수 있으나, 히브리어 단어 자체는 더 넓은 ‘빛’을 뜻하므로 본문은 넓은 의미를 보존하는 것이 더 충실합니다.
  doctrine_reference: 시적 묘사의 다의성 보존
- issue: ‘바다의 뿌리들’의 은유를 평이하게 풀어 쓸지
  chosen_reading: 은유를 그대로 살렸습니다.
  alternative_readings:
  - 바다의 깊은 곳들
  - 바다의 기초
  rationale: 히브리어 시어의 강한 이미지와 신적 주권의 범위를 약화시키지 않기 위해, 해석적 완화보다 원문 은유를 유지했습니다.
  doctrine_reference: 히브리 문학의 은유 보존
