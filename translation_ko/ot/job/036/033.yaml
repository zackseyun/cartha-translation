    text: 또는 '가축도 또한 [선포합니다] 떠오르는 폭풍에 대해.' 마지막 구절은 다가오는 폭풍을 가리킬 가능성이 높으나, 히브리어에는 단지 '떠오르는 것'이라고만 기록되어 있습니다.
