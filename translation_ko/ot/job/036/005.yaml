  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
  footnotes:
  - marker: a
    text: Or 'does not reject' or 'does not spurn.' The Hebrew does not state the object explicitly.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'strength of heart'; this may mean strength of mind, understanding, or firmness of purpose.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 하나님은 강하시며 멸시하지 않으십니다.[a] 그분은 마음의 힘이 크십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거절하지 않으십니다’, ‘내치지 않으십니다’. 히브리어는 목적어를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음의 힘’입니다. 여기서 ‘마음’은 이해력, 분별력, 결단력을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 화자의 주의를 끄는 감탄·호출 표현으로 이해해, 고어적 느낌은 피하면서도 시적 강조를 살리는 합쇼체로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하나님
  lexicon: HALOT
  rationale: 시적 문맥의 일반 명칭으로서 가장 직접적인 대응어를 사용했습니다.
- source_word: וְלֹא יִמְאָס
  english_pob_choice: and does not despise anyone
  chosen_korean: 아무도 멸시하지 않으시며
  alternatives_korean:
  - 거절하지 않으시며
  - 외면하지 않으시며
  lexicon: HALOT
  rationale: מאס의 기본 의미를 살리되, 영어 POB가 지적한 대로 목적어가 생략된 상태이므로 한국어에서는 자연스럽게 ‘아무도’로 풀어 뜻을 분명히 했습니다.
- source_word: כֹּחַ לֵב
  english_pob_choice: strength of heart
  chosen_korean: 마음의 힘
  alternatives_korean:
  - 마음의 강함
  - 심령의 힘
  - 생각의 힘
  lexicon: HALOT
  rationale: 직역형인 ‘마음의 힘’을 택해 원문의 이미지와 해석상의 여지를 보존했습니다. ‘마음’은 히브리어 לֵב의 인지·의지적 범위를 함께 담을 수 있습니다.
theological_decisions:
- issue: ‘does not despise’의 목적어 보충
  chosen_reading: 아무도 멸시하지 않으시며
  alternative_readings:
  - 멸시하지 않으시며
  - 그들을 멸시하지 않으시며
  rationale: 히브리어가 목적어를 명시하지 않으므로, 문맥상 일반화된 인간 대상을 한국어에서 최소한으로 보충해 오해를 줄였습니다. 특정 집단으로 제한하지 않도록 ‘아무도’를 선택했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘strength of heart’의 해석 폭 유지
  chosen_reading: 마음의 힘
  alternative_readings:
  - 마음의 이해력
  - 마음의 굳셈
  rationale: 원문 표현이 지닌 다의성을 한 해석으로 좁히지 않고, ‘마음’ 이미지를 유지해 이해력·결단력·내적 힘의 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §3, §5
