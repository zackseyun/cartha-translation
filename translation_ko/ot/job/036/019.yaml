  verdict: revise
  source_fidelity: 본문은 MT의 통상적 독법인 ‘당신의 부르짖음’(שׁוּעֲךָ)을 유지하고, 난해한 לֹא בְצָר는 영어 POB의 해석을 따라 ‘환난이 닥칠 때’로 풀어 쓸 수 있습니다. 다만 대안 각주는 ‘재물’ 독법과 ‘환난에 있지 않도록’이라는 연결을 더 정확하고 자연스럽게 반영해야 합니다.
