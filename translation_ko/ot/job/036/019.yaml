  terminology: ‘부르짖음,’ ‘환난,’ ‘재물,’ ‘온 힘을 다한 노력’은 문맥과 시적 수사에 적절합니다. ‘도움이 되다’는 여기서 ערך의 관용적 해석(‘avail’)을 자연스럽게 전달합니다.
