translation:
  language: ko
  text: 당신의 부르짖음이 환난이 닥칠 때에 도움이 되겠습니까? 또는 당신의 온 힘을 다한 모든 노력이 도움이 되겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 해석으로는, 난해한 히브리어를 따라 ‘당신의 재물이 당신이 환난에 빠지지 않도록 도움이 되겠습니까? 또는 당신의 모든 강한 힘이 도움이 되겠습니까?’로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 히브리어는 특히 전통적으로 ‘당신의 부르짖음’과 ‘환난에 있지 않음’으로 옮겨지는 부분이 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  english_pob_choice: will ... avail
  chosen_korean: 유익하겠느냐
  alternatives_korean:
  - 도움이 되겠느냐
  - 쓸모가 있겠느냐
  - 맞서게 해 주겠느냐
  lexicon: HALOT
  rationale: ערך의 문자적 뜻보다 이 문맥의 수사적 질문이 ‘도움이 되다/유익하다’는 의미를 묻는 것으로 보이므로, POB의 ‘avail’에 맞춰 간결하게 옮겼습니다.
- source_word: שׁוּעֲךָ
  english_pob_choice: your cry
  chosen_korean: 너의 부르짖음
  alternatives_korean:
  - 너의 간구
  - 너의 외침
  - 너의 부르짖음
  lexicon: HALOT
  rationale: 자음형과 모음형은 ‘부르짖음/도움 요청’의 뜻을 가리키는 것으로 이해하는 것이 가장 자연스러워, 직접적인 애원 행위를 드러내는 ‘부르짖음’으로 옮겼습니다.
- source_word: לֹא בְצָר
  english_pob_choice: when distress comes
  chosen_korean: 환난이 닥칠 때에
  alternatives_korean:
  - 환난 속에서
  - 곤경에 있을 때
  - 환난이 올 때에
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, 문맥상 재난이 닥치는 상황을 가리키는 표현으로 이해되므로, 상황성을 드러내되 과도하게 해석하지 않는 ‘환난이 닥칠 때에’를 선택했습니다.
- source_word: מַאֲמַצֵּי כֹחַ
  english_pob_choice: the exertions of your strength
  chosen_korean: 너의 힘의 모든 분투
  alternatives_korean:
  - 너의 힘을 다한 노력
  - 너의 온 힘의 애씀
  - 너의 힘의 모든 노력
  lexicon: HALOT
  rationale: מאמצים는 ‘애씀/분투’의 뉘앙스를, כוח는 ‘힘’을 나타내므로 두 요소를 함께 살려 ‘힘의 모든 분투’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 난구절에서의 의미 범위 보존
  chosen_reading: 본문의 기본 독법인 ‘부르짖음’과 ‘환난’의 의미를 유지하되, 시적 압축 때문에 다소 자연스럽게 풀어 옮겼습니다.
  alternative_readings:
  - ‘너의 재물’이 유익하겠느냐로 보는 해석
  - ‘환난이 없다’로 읽는 해석
  rationale: 이 절은 본문 자체가 어렵기 때문에, 본문이 분명히 지시하는 ‘부르짖음’ 중심의 독법을 본문에 두고, 다른 가능한 해석은 각주로만 남기는 것이 원문과 독자 이해를 함께 지키는 방식입니다.
  doctrine_reference: 원문 난해 구절 처리 원칙
