  source_fidelity: 첫 구절의 כַּתַּר לִי זְעֵיר는 화자가 잠시 기다려 달라고 요청하는 말이며, ‘저를 조금만 참아 주십시오’도 가능하나 현대 한국어에서는 다소 부자연스럽고 ‘참다’의 대상이 화자 자신이라는 점이 어색하게 들립니다. וַאֲחַוֶּךָּ는 ‘내가 네게 보여 주겠다/알려 주겠다’로 옮길 수 있습니다. 마지막 절의 לֶאֱלוֹהַּ는 ‘하나님을 위하여/하나님 편에서’라는 방향성을 지니므로, ‘하나님을 위하여 할 말’은 영어 POB의 ‘for God’ 및 원문의 열린 의미를 보존합니다.
  naturalness: ‘하나님을 위한 말씀이’는 한국어에서 ‘하나님께서 하신 말씀’으로 오해되기 쉽고, ‘말씀’은 이 문맥의 화자 발화를 지칭하는 데 불필요하게 높임말적입니다. ‘하나님을 위하여 할 말’이 자연스럽고 의미도 분명합니다. ‘제가 보여 드리겠습니다’는 목적어 없이 다소 어색하나, 원문의 표현을 유지할 수 있습니다.
