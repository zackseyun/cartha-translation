  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  english_pob_choice: Bear with me a little
  chosen_korean: 저를 조금만 참아 주십시오
  alternatives_korean:
  - 잠시만 저를 견뎌 주십시오
  - 조금만 기다려 주십시오
  lexicon: כּתּר / זְעֵיר
  rationale: 동사의 의미를 자연스럽게 살려, 욥의 말을 청유적 요청으로 옮기되 ‘조금만’으로 시간의 짧음을 반영했습니다.
- source_word: וַאֲחַוֶּךָּ
  english_pob_choice: and I will show you
  chosen_korean: 그러면 제가 보여 드리겠습니다
  alternatives_korean:
  - 그리고 내가 네게 보이겠다
  - 내가 너에게 설명해 주겠습니다
  lexicon: חוה
  rationale: ‘보여 주다/설명하다’의 결과를 살려, 현대 한국어에서 문맥에 맞는 공손한 약속 표현으로 옮겼습니다.
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  english_pob_choice: for there are still words for God
  chosen_korean: 하나님을 위한 말씀이 아직도 있습니다
  alternatives_korean:
  - 하나님을 위한 말이 아직도 있습니다
  - 하나님에 관한 말씀이 아직도 있습니다
  lexicon: אֱלוֹהַּ / מִלִּים
  rationale: POB의 ‘for God’를 유지하되, 히브리어 전치사 ל의 방향성을 따라 ‘하나님을 위한’으로 직역하여 발화가 하나님을 향한/위한 말임을 드러냈습니다.
theological_decisions:
- issue: לְ + אֱלוֹהַּ의 관계를 ‘for God’로 어떻게 드러낼지
  chosen_reading: ‘하나님을 위한 말씀이 아직도 있습니다’로 번역해, 말의 목적지/대상을 모호하게 희석하지 않았습니다.
  alternative_readings:
  - 하나님에 관한 말이 아직도 있습니다
  - 하나님에 대하여 더 말할 것이 있습니다
  rationale: 문맥상 엘리후가 하나님에 대해 더 말할 것이 있음을 주장하지만, 히브리어 표면형은 ‘하나님을 위한/향한 말’의 방향성을 포함하므로 이를 유지했습니다.
  doctrine_reference: 욥기 36장 문맥 해석
