    text: 또는 ‘그분의 능력 안에서’ 또는 ‘그분의 힘으로’.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported passive construction, retains the poetic attention call and rhetorical question, and uses natural modern formal-polite Korean. The footnote preserves the semantic range of ב, including the descriptive/sphere sense reflected in the English audit trail.
