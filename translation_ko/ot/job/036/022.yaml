source:
  edition: WLC
  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
  footnotes:
  - marker: a
    text: Or 'by his power' or 'through his strength.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Who is like him as a teacher?'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하나님은 자신의 능력 안에서 높임을 받으십니다[a]. 그분처럼 가르치는 이가 누가 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 능력으로’ 혹은 ‘그의 힘으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 시적 경고와 주목 환기를 담는 감탄사로, 합쇼체 안에서 격식을 유지하면서도 즉각적인 주의를 끄는 표현을 택했습니다.
- source_word: יַשְׂגִּיב
  english_pob_choice: is exalted
  chosen_korean: 높임을 받으십니다
  alternatives_korean:
  - 높으십니다
  - 높아지십니다
  - 존귀하게 되십니다
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘높아짐/고양됨’을 살리되, 문맥상 하나님 자신의 탁월함을 드러내는 표현으로 자연스럽게 옮겼습니다.
- source_word: בְּכֹחוֹ
  english_pob_choice: in his power
  chosen_korean: 자신의 능력 안에서
  alternatives_korean:
  - 그의 능력으로
  - 그의 힘으로
  - 그의 권능으로
  lexicon: HALOT
  rationale: ב의 의미가 수단과 영역을 모두 열어 두므로, ‘안에서’로 옮겨 시적 압축을 살리고 과도하게 도구적 의미로 좁히지 않았습니다.
- source_word: מוֹרֶה
  english_pob_choice: a teacher
  chosen_korean: 가르치는 이
  alternatives_korean:
  - 교사
  - 선생
  - 스승
  lexicon: HALOT
  rationale: 하나님의 비교 불가능한 가르침을 묻는 수사 의문으로서, 현대 한국어에서 너무 제도화된 ‘교사’보다 더 직접적인 행위 중심 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 ‘높임’과 능력의 관계
  chosen_reading: 본문의 요지는 하나님이 능력과 결부된 절대적 우월성 안에서 높임을 받으신다는 것이며, 구체적 교리 진술로 확장하지 않았습니다.
  alternative_readings:
  - 그분이 능력으로 사람들을 안전하게 하신다
  - 그분이 능력을 행사하신다
  rationale: 히브리어 동사는 ‘높다/높이 세우다’의 뉘앙스를 가질 수 있지만, 문맥은 하나님의 탁월성과 비할 데 없는 가르침을 강조하므로 그 범위를 넘지 않게 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
