id: JOB.36.23
reference: Job 36:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו דַּרְכּ֑/וֹ וּ/מִֽי אָ֝מַ֗ר פָּעַ֥לְתָּ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
  footnotes:
  - marker: a
    text: Or, 'Who has charged him with his way?' The Hebrew verb can also carry the sense of appointing, prescribing, or charging.
    reason: lexical_alternative
  - marker: b
    text: Or, 'You have done injustice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 그의 길을 그를 위하여 정하였습니까? 아니면 누가 “당신은 잘못을 저질렀습니다”라고 말하였습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그의 길을 그에게 부과한/정해 준’으로도 옮길 수 있습니다. 히브리어 동사 פקד는 여기서 ‘정하다, 지정하다, 맡기다, 요구하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘당신은 불의를 행하였습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד
  english_pob_choice: has appointed
  chosen_korean: 정하였습니까
  alternatives_korean:
  - 임명하였습니까
  - 지정하였습니까
  - 책임을 물었습니까
  lexicon: HALOT
  rationale: פקד는 문맥상 ‘길을 정하다/지정하다’의 뜻이 자연스럽고, POB의 “has appointed”에 가장 가깝게 ‘정하다’로 옮기면 하나님의 길을 인간이 규정한다는 뉘앙스를 살릴 수 있습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 그의 길
  alternatives_korean:
  - 그의 방식
  - 그의 행로
  - 그의 도
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 단순한 물리적 길보다 삶의 행로/방식을 가리키므로, 한국어에서는 ‘길’이 가장 간결하고 원문과 대응이 좋습니다.
- source_word: וּמִי אָמַר
  english_pob_choice: Or who has said
  chosen_korean: 아니면 누가 …라고 말하였습니까
  alternatives_korean:
  - 또 누가 …라고 말하였습니까
  - 그리고 누가 …라고 말하였습니까
  lexicon: HALOT
  rationale: 두 번째 수사 의문문은 대비·분기 기능이 있어 ‘아니면 누가’가 POB의 “Or who”를 자연스럽게 반영합니다.
- source_word: עַוְלָה
  english_pob_choice: wrong
  chosen_korean: 잘못을 저질렀습니다
  alternatives_korean:
  - 불의를 행하였습니다
  - 불의를 저질렀습니다
  - 악을 행하였습니다
  lexicon: HALOT
  rationale: עַוְלָה는 ‘불의’도 가능하지만, 여기서는 고발 문장으로서 ‘잘못을 저질렀다’가 한국어에서 가장 직접적이고 과도하게 해석을 덧붙이지 않습니다.
theological_decisions:
- issue: 23절의 대상이 하나님이라는 점과 2인칭 발화의 처리
  chosen_reading: 문맥상 대상은 하나님이므로 한국어에서는 인칭을 그대로 유지하되, 둘째 질문의 ‘당신’은 하나님께 대한 직접 고발을 살려 따옴표 안에 넣었습니다.
  alternative_readings:
  - ‘그에게’로 완곡하게 처리
  - 대상 표시를 생략하고 일반 진술로 번역
  rationale: 욥기 36:22–23의 문맥은 하나님의 주권과 의를 강조하므로, 원문의 수사적 긴장—아무도 하나님을 규정하거나 그분을 불의로 고발할 수 없다는 뜻—을 약화시키지 않도록 직접 대조를 살렸습니다.
  doctrine_reference: 원문 수사와 신학적 긴장을 보존하며, 전통적 완화 번역으로 평탄화하지 않습니다.
