  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר חֲכָמִ֥ים יַגִּ֑ידוּ וְ/לֹ֥א כִֽ֝חֲד֗וּ מֵ/אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
  footnotes:
  - marker: a
    text: Or, 'what their fathers did not hide,' or 'and have hidden nothing received from their fathers.' The Hebrew allows more than one construal of the relation between 'hidden' and 'their fathers.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람들이 선포한 것[a], 곧 그들이 자기 아버지들에게서 숨기지 않은 것입니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 아버지들이 숨기지 않은 것’, 혹은 ‘그들의 아버지들에게서 받은 것을 아무것도 숨기지 않은 것’. 히브리어는 ‘숨기다’와 ‘그들의 아버지들’의 관계를 여러 방식으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: what
  chosen_korean: 것
  alternatives_korean:
  - 무엇
  - 바로 그것
  lexicon: HALOT
  rationale: 앞절의 내용을 받는 관계절을 한국어에서는 명사화된 ‘것’으로 자연스럽게 옮겨, 영어 POB의 ‘what’이 가진 내용 지시 기능을 유지했습니다.
- source_word: חֲכָמִים
  english_pob_choice: wise men
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜자들
  - 현자들
  lexicon: HALOT
  rationale: 문맥상 조상 대대로 내려오는 지혜를 전하는 이들을 가리키므로, 성별을 굳이 드러내는 직역보다 현대 한국어에서 자연스러운 ‘지혜로운 사람들’로 옮겼습니다.
- source_word: יַגִּידוּ
  english_pob_choice: declare
  chosen_korean: 선포한
  alternatives_korean:
  - 선언한
  - 말한
  lexicon: HALOT
  rationale: 단순한 말하기보다 지혜 전승을 공적으로 드러내는 뉘앙스가 있어, 공적·격식적 어감을 살리는 ‘선포한’이 적절합니다.
- source_word: כִחֲדוּ מֵאֲבוֹתָם
  english_pob_choice: have not hidden from their fathers
  chosen_korean: 자기 아버지들에게서 숨기지 않은 것입니다
  alternatives_korean:
  - 자기 아버지들에게 숨기지 않은 것입니다
  - 그들의 아버지들에게서 감추지 않은 것입니다
  - 아버지들에게서 숨긴 것이 아닙니다
  lexicon: HALOT
  rationale: 히브리어는 ‘from their fathers’와 ‘from/of their fathers’를 둘 다 허용할 만큼 압축되어 있어, 한국어 본문은 원문의 어순과 모호성을 최대한 보존하는 표현으로 두었습니다.
theological_decisions:
- issue: מֵאֲבוֹתָם의 관계가 지혜의 출처인지, 감춤의 대상인지에 대한 모호성
  chosen_reading: 본문은 ‘아버지들에게서 숨기지 않은 것’으로 두어, 조상 전승의 전달 방식에 대한 히브리어의 압축성과 여지를 보존했습니다.
  alternative_readings:
  - 지혜로운 사람들이 자기 아버지들에게서 숨기지 않은 것
  - 아버지들이 숨기지 않은 것
  - 아버지들에게서 받은 것을 숨기지 않은 것
  rationale: 원문은 관계를 단정적으로 해소하지 않으므로, 한국어도 그 긴장을 유지하는 편이 본문 충실성과 POB의 주석적 투명성에 더 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
