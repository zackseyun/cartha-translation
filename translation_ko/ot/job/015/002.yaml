translation:
  language: ko
  text: 지혜로운 사람이 바람 같은 지식으로 대답하겠으며, 자기 배를 동풍으로 채우겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람이
  alternatives_korean:
  - 지혜로운 자가
  - 현명한 사람이
  lexicon: HALOT
  rationale: 의문형 수사 질문의 주어를 자연스러운 현대 한국어로 살리면서, 특정 인물보다 일반적 인간을 가리키는 의미를 반영했습니다.
- source_word: יַעֲנֶה דַעַת רוּחַ
  english_pob_choice: windy knowledge
  chosen_korean: 바람 같은 지식으로 대답하겠으며
  alternatives_korean:
  - 바람의 지식으로 대답하겠으며
  - 헛된 지식으로 대답하겠으며
  - 텅 빈 지식으로 대답하겠으며
  lexicon: HALOT
  rationale: דַעַת רוּחַ의 문자적 이미지를 유지하되, 한국어에서는 ‘바람 같은 지식’이 공허하고 실속 없는 말을 가장 직접적으로 드러냅니다.
- source_word: קָדִים
  english_pob_choice: the east wind
  chosen_korean: 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동풍
  lexicon: HALOT
  rationale: קָדִים의 관용적 의미를 따라 ‘동풍’으로 옮겨, 파괴적이고 거친 바람의 이미지를 보존했습니다.
- source_word: בִּטְנוֹ
  english_pob_choice: his belly
  chosen_korean: 자기 배를
  alternatives_korean:
  - 그의 배를
  - 자기 배속을
  lexicon: HALOT
  rationale: 비유적 신체 표현을 살리기 위해 직역에 가깝게 ‘배’를 택했고, 한국어 문맥에서 주어와의 관계를 분명히 하도록 ‘자기’를 보탰습니다.
theological_decisions:
- issue: 수사적 질문의 뉘앙스
  chosen_reading: 반문형으로 옮겨, 화자 엘리바스의 책망과 경멸이 드러나게 했습니다.
  alternative_readings:
  - 평서형으로 옮기기
  - 더 완곡한 질문형으로 옮기기
  rationale: 히브리어의 의문문은 단순 정보 요청이 아니라 상대를 꾸짖는 반문이므로, 한국어에서도 그 압박감을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 본문 화행 보존 원칙
- issue: רוּחַ와 קָדִים의 이미지
  chosen_reading: ‘바람 같은 지식’과 ‘동풍’으로 두 개의 바람 이미지를 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 추상적으로 ‘헛된 것’으로 처리하기
  - 둘 다 동일하게 ‘바람’으로 옮기기
  rationale: 본문은 지식의 공허함과 동풍의 파괴성을 겹쳐 보여 주므로, 두 이미지를 구분해 번역해야 대조 효과가 살아납니다.
  doctrine_reference: 시적 비유 보존 원칙
