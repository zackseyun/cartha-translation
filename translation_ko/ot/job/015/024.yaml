base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
  footnotes:
  - marker: a
    text: Or 'like a king prepared for the assault/attack.' The Hebrew word translated 'battle' is rare and may refer more specifically to an armed attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 환난과 고통이 무섭게 하고, 그것들이 마치 전투를 앞둔 왕처럼 그를 압도합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공격/습격을 대비한 왕처럼’이라는 뜻일 수 있습니다. 번역된 히브리어 단어는 희귀하여, 더 구체적으로는 무장한 공격을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  english_pob_choice: terrify him
  chosen_korean: 무섭게 하고
  alternatives_korean:
  - 두렵게 하고
  - 공포에 떨게 하고
  lexicon: HALOT
  rationale: בעת의 사역적 의미를 살려 외부 압력이 그를 두렵게 만드는 뉘앙스를 담되, 한국어에서는 자연스럽게 ‘무섭게 하고’로 옮겼습니다.
- source_word: צַר / מְצוּקָה
  english_pob_choice: distress and anguish
  chosen_korean: 환난과 고통
  alternatives_korean:
  - 고난과 고통
  - 곤고와 고통
  - 환난과 곤고
  lexicon: HALOT
  rationale: 두 명사가 병렬로 중압감과 협착을 나타내므로, 한국어에서도 서로 다른 두 표현을 유지해 압박의 이중성을 살렸습니다.
- source_word: תִּתְקְפֵהוּ
  english_pob_choice: they overpower him
  chosen_korean: 그것들이 … 그를 압도합니다
  alternatives_korean:
  - 그것들이 … 그를 이깁니다
  - 그것들이 … 그를 제압합니다
  - 그것들이 … 그를 누릅니다
  lexicon: HALOT
  rationale: 동사의 강한 ‘이겨 눌러 지배하다’는 힘을 살리면서, 앞의 두 명사를 묶어 복수 주어처럼 자연스럽게 처리했습니다.
- source_word: לַכִּידוֹר
  english_pob_choice: for battle
  chosen_korean: 전투를 앞둔
  alternatives_korean:
  - 공격에 대비한
  - 전쟁을 앞둔
  - 습격에 대비한
  lexicon: HALOT
  rationale: 희귀어 כידור의 군사적 의미를 반영하되, 영어 POB의 ‘battle’보다 약간 더 열린 한국어로 옮겨 본문의 비유성을 유지했습니다.
