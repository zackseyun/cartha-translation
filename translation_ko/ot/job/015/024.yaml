  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
  footnotes:
  - marker: a
    text: Or 'like a king prepared for the assault/attack.' The Hebrew word translated 'battle' is rare and may refer more specifically to an armed attack.
