  text: 환난과 고통이 그를 두렵게 하며, 전투할 준비를 마친 왕처럼 그를 압도합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공격이나 습격을 대비한 왕처럼’이라는 뜻일 수 있습니다. 여기서 ‘전투’로 번역한 히브리어 단어는 드물게 쓰이며, 더 구체적으로 무장한 공격을 가리킬 수 있습니다.
    reason: lexical_alternative
