  rationale: בְּתוֹכָם의 ‘그들 내부/가운데’라는 위치감을 한국어로 자연스럽게 살리기 위해 ‘그들 가운데’를 선택했습니다.
theological_decisions:
- issue: ‘땅’의 범위
  chosen_reading: 문맥상 특정한 기업/거주지를 가리키는 ‘그 땅’으로 번역했습니다.
  alternative_readings:
  - ‘그 나라’
  - ‘땅’ 대신 ‘세상’
  rationale: 히브리어 אֶרֶץ는 ‘땅/나라/세상’까지 가능하지만, 이 절은 한 집단에게 주어진 영역과 외부인의 부재를 말하므로 ‘그 땅’이 가장 직접적입니다.
  doctrine_reference: 본문 문맥 우선의 지리·공동체적 의미
