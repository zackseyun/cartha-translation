base_translation:
  language: en
  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
  footnotes:
  - marker: a
    text: Or 'the earth' instead of 'the land.' The Hebrew אֶרֶץ can bear either sense; 'land' is preferred here because the verse speaks of a territory uniquely given to a people and untouched by outsiders.
    reason: lexical_alternative
  - marker: b
    text: Or 'no foreigner passed through their midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게만 그 땅[a]이 주어졌고, 그들 가운데를 지나간 낯선 사람[b]도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 한 공동체에게만 주어진 영역을 가리키므로 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘외국인’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  english_pob_choice: to them alone
  chosen_korean: 그들에게만
  alternatives_korean:
  - 오직 그들에게
  - 그들만에게
  lexicon: HALOT
  rationale: לָהֶם의 수혜/귀속 의미와 לְבַדָּם의 배타성을 함께 살려, ‘그들에게만’으로 간결하게 압축했습니다.
- source_word: נִתְּנָה הָאָרֶץ
  english_pob_choice: the land was given
  chosen_korean: 그 땅이 주어졌으며
  alternatives_korean:
  - 그 땅이 주어졌고
  - 그 땅이 허락되었으며
  lexicon: HALOT
  rationale: נִתְּנָה의 수동형을 살려 ‘주어졌’으로 옮기고, הָאָרֶץ는 문맥상 ‘땅’이 자연스러워 그대로 반영했습니다.
- source_word: זָר
  english_pob_choice: stranger
  chosen_korean: 낯선 자
  alternatives_korean:
  - 외국인
  - 이방인
  - 낯선 사람
  lexicon: HALOT
  rationale: זָר는 공동체 밖의 타자를 가리키므로, 민족적·종교적 함의를 과도하게 특정하지 않도록 ‘낯선 자’로 옮겼습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 한가운데
  - 그들 중에
  - 그들 사이에
  lexicon: HALOT
  rationale: בְּתוֹכָם의 ‘그들 내부/가운데’라는 위치감을 한국어로 자연스럽게 살리기 위해 ‘그들 가운데’를 선택했습니다.
theological_decisions:
- issue: ‘땅’의 범위
  chosen_reading: 문맥상 특정한 기업/거주지를 가리키는 ‘그 땅’으로 번역했습니다.
  alternative_readings:
  - ‘그 나라’
  - ‘땅’ 대신 ‘세상’
  rationale: 히브리어 אֶרֶץ는 ‘땅/나라/세상’까지 가능하지만, 이 절은 한 집단에게 주어진 영역과 외부인의 부재를 말하므로 ‘그 땅’이 가장 직접적입니다.
  doctrine_reference: 본문 문맥 우선의 지리·공동체적 의미
