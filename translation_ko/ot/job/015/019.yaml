base_translation:
  language: en
  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
  footnotes:
  - marker: a
    text: Or 'the earth' instead of 'the land.' The Hebrew אֶרֶץ can bear either sense; 'land' is preferred here because the verse speaks of a territory uniquely given to a people and untouched by outsiders.
    reason: lexical_alternative
  - marker: b
    text: Or 'no foreigner passed through their midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게만 그 땅이 주어졌으며, 낯선 자는 그들 가운데 지나가지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’이나 ‘땅/세상(earth)’을 뜻할 수 있습니다. 여기서는 한 공동체에게 주어진 고유한 영역을 가리키므로 ‘땅’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 가운데를 지나간 외국인은 없었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  english_pob_choice: to them alone
  chosen_korean: 그들에게만
  alternatives_korean:
