  lexicon: HALOT
  rationale: נִתְּנָה의 수동형을 살려 ‘주어졌’으로 옮기고, הָאָרֶץ는 문맥상 ‘땅’이 자연스러워 그대로 반영했습니다.
- source_word: זָר
  english_pob_choice: stranger
  chosen_korean: 낯선 자
  alternatives_korean:
