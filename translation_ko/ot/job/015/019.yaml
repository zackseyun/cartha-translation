  lexicon: HALOT
  rationale: זָר는 공동체 밖의 타자를 가리키므로, 민족적·종교적 함의를 과도하게 특정하지 않도록 ‘낯선 자’로 옮겼습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
