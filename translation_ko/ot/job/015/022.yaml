source:
  edition: WLC
  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
  footnotes:
  - marker: a
    text: Or 'he is watched for by the sword,' 'he is destined for the sword,' or 'he is expected by the sword.' The Hebrew verb is difficult, and the line likely conveys impending violent judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 어둠에서 돌아올 것을 기대하지 않으며, 칼을 위해 정해져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 형태가 어렵습니다. 본문은 ‘칼에 의해 지켜짐/기다려짐/정해짐/기대됨’ 등으로도 이해될 수 있으며, 문맥상 임박한 폭력적 심판의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין שׁוּב
  english_pob_choice: does not expect to return
  chosen_korean: 돌아올 것을 기대하지 않으며
  alternatives_korean:
  - 돌아오리라고 믿지 않으며
  - 다시 돌아올 것으로 생각하지 않으며
  lexicon: HALOT
  rationale: 이 구절의 히필형 אמן은 종교적 ‘믿다’보다 미래 결과에 대한 기대/확신을 뜻하므로, 한국어에서도 ‘기대하다’로 옮겨 문맥을 살렸습니다.
- source_word: מִנִּי חֹשֶׁךְ
  english_pob_choice: from darkness
  chosen_korean: 어둠에서
  alternatives_korean:
  - 흑암에서
  - 어둠 속에서
  lexicon: HALOT
  rationale: ‘어둠’은 재난과 죽음의 상태를 가리키는 비유로 자연스럽고, 전치사 מן의 출발점을 간결하게 드러냅니다.
- source_word: ו/צפו
  english_pob_choice: is destined / is watched for / is marked out
  chosen_korean: 정해져 있습니다
  alternatives_korean:
  - 칼이 그를 지켜보고 있습니다
  - 칼을 위해 기다려지고 있습니다
  - 칼로 정해져 있습니다
  lexicon: HALOT
  rationale: 동사의 난해성을 고려해, 본문이 말하는 ‘칼을 향한 임박한 심판’의 수동적 지정 의미를 가장 무난하게 살리는 표현을 택했습니다.
- source_word: אֱלֵי חָרֶב
  english_pob_choice: for the sword
  chosen_korean: 칼을 위해
  alternatives_korean:
  - 칼을 향해
  - 칼로 말미암아
  lexicon: HALOT
  rationale: 히브리어 방향전치사 אֱלֵי는 여기서 ‘칼을 향한/칼에 이르는’ 운명적 귀결을 나타내므로, 한국어에서는 목적·귀결을 보이는 ‘칼을 위해’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 문장의 마지막 절의 난해한 동사 처리
  chosen_reading: ‘정해져 있습니다’로 수동적 예정/지정의 의미를 살렸습니다.
  alternative_readings:
  - ‘칼이 그를 노리고 있습니다’처럼 능동적 추격으로 읽기
  - ‘칼을 위해 기다려지고 있습니다’처럼 직역에 가까운 표현
  rationale: 본문은 단순한 사냥 묘사보다 악인에 대한 임박한 폭력적 심판을 말하므로, 의미를 흐리지 않으면서도 과도한 해석을 피하는 쪽이 적절합니다.
  doctrine_reference: 하나님의 심판과 악인에게 임하는 보응에 대한 지혜문학적 진술
