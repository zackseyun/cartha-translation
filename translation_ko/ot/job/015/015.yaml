base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
  footnotes:
  - marker: a
    text: Or 'his saints.' The Hebrew says 'his holy ones,' likely referring here to heavenly beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그는 자신의 거룩한 이들조차 신뢰하지 않으시며, 하늘들도 그의 눈에는 깨끗하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘그의 거룩한 이들’입니다. 문맥상 천상적 존재를 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보라, 주목하십시오
  lexicon: HALOT
  rationale: 문장의 주의를 끄는 감탄/지시 용법을 현대 합쇼체로 자연스럽게 살리면서, 원문의 강조를 유지했습니다.
- source_word: בְּקְדֹשָׁיו
  english_pob_choice: in his holy ones
  chosen_korean: 자기의 거룩한 자들에게도
  alternatives_korean:
  - 그의 성도들에게도
  - 그의 거룩한 이들에게도
  - 그의 거룩한 자들에게도
  lexicon: HALOT
  rationale: 직역은 '거룩한 자들'이지만, 욥기의 병행구와 영어 POB의 주해를 반영해 '도'를 넣어 '심지어 …에게도'의 뉘앙스를 살렸고, 교회적 '성도'는 문맥상 오해 소지가 있어 피했습니다.
- source_word: לֹא זַכּוּ
  english_pob_choice: are not pure
  chosen_korean: 깨끗하지 않습니다
  alternatives_korean:
  - 순결하지 않습니다
  - 정결하지 않습니다
  - 순수하지 않습니다
  lexicon: HALOT
  rationale: זכה의 의미를 도덕적 '무죄'보다 정결/청결의 이미지로 보고, 시적 병행에 맞는 현대어 '깨끗하다'로 옮겼습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그의 눈에는
  alternatives_korean:
  - 그의 보시기에는
  - 그의 시야에는
  - 그의 눈앞에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 직접 살려, 하나님의 평가 기준을 '그의 눈'이라는 원문 이미지로 유지했습니다.
theological_decisions:
- issue: בְּקְדֹשָׁיו의 대상
  chosen_reading: '''그의 거룩한 자들''을 기본으로 두되, 천상적 존재를 암시하는 표현으로 열어 둡니다.'
  alternative_readings:
  - 인간 성도들
  - 천사 같은 거룩한 존재들
  rationale: 욥기의 병행구 '하늘들'과 문맥상 인간 신자보다 천상 존재를 가리킬 가능성이 크지만, 본문 자체가 그 점을 완전히 명시하지 않으므로 의미를 지나치게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3, 본문의 긴장을 해소하지 않고 보존
