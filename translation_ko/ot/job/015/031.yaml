id: JOB.15.31
reference: Job 15:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
  footnotes:
  - marker: a
    text: Or 'Let him not trust in vanity, being deluded'; the Hebrew can also be understood as 'being led astray' rather than explicitly 'deceiving himself.'
    reason: lexical_alternative
  - marker: b
    text: '''Emptiness'' translates שָׁוְא, which can also mean ''vanity,'' ''falsehood,'' or ''worthlessness.'' The repetition of the same Hebrew word is preserved in the verse.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for vanity will be what he gets in return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 헛된 것에 의지하지 말아야 하며 — 자기 자신이 속고 있으니 — 결국 그에게 돌아올 것은 헛됨뿐입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘허무한 것에 의지하지 말아야 하며, 미혹되고 있으니’로도 옮길 수 있습니다. נִתְעָה는 ‘자기 자신이 속고 있음’보다 ‘길을 잃음/미혹됨’의 뉘앙스로도 읽힙니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 שָׁוְא가 여기서 반복되어 ‘헛된 것/헛됨’의 수사적 대비를 이룹니다.
    reason: source_note
  - marker: c
    text: 또는 ‘그가 되돌아받게 될 것은 헛됨뿐입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: אַל יַאֲמֵן
  english_pob_choice: Let him not trust
  chosen_korean: 의지하지 말아야 하며
  alternatives_korean:
  - 믿지 말아야 하며
  - 신뢰하지 말아야 하며
  lexicon: HALOT
  rationale: אַל의 금지 뉘앙스와 יַאֲמֵן의 ‘trust’ 의미를 한국어로 자연스럽게 옮기기 위해, 단순 지식 동의보다 의지/신뢰 행위를 드러내는 표현을 택했습니다.
- source_word: בְּשָׁוְא / שָׁוְא
  english_pob_choice: in emptiness / emptiness
  chosen_korean: 헛된 것 / 헛됨
  alternatives_korean:
  - 허무 / 공허 / 허망함
  - 거짓
  lexicon: HALOT
  rationale: 반복되는 שָׁוְא의 수사적 반복을 살리기 위해 첫째는 대상어로 ‘헛된 것’, 둘째는 귀결로 ‘헛됨’을 써서 같은 어근의 되풀이를 한국어에서도 느낄 수 있게 했습니다.
- source_word: נִתְעָה
  english_pob_choice: deceiving himself
  chosen_korean: 자기 자신이 속고 있으니
  alternatives_korean:
  - 자기 자신을 속이며
  - 길을 잃고 있으니
  - 미혹되고 있으니
  lexicon: HALOT
  rationale: 히필/니팔 계열의 ‘길을 잃다, 속임을 당하다’ 의미를 현대 한국어로 분명하게 전달하면서도, 문맥상 자기기만의 상태를 드러내기 위해 수동적 표현을 택했습니다.
- source_word: תְּמוּרָתוֹ
  english_pob_choice: his recompense
  chosen_korean: 그에게 돌아올 것
  alternatives_korean:
  - 그의 보상
  - 그가 받게 될 대가
  - 그의 되갚음
  lexicon: HALOT
  rationale: תְּמוּרָה의 ‘교환/되받음/결과’ 뉘앙스를 살리면서도, 시적 문맥에서 지나치게 법정적이거나 종교적 보상어로 굳어지지 않도록 중립적 귀결 표현을 사용했습니다.
theological_decisions:
- issue: שָׁוְא의 반복을 어떻게 살릴지
  chosen_reading: 첫 구와 마지막 구에서 같은 어근 계열의 한국어를 반복해, 헛됨이 처음부터 끝까지 이 구절을 지배한다는 점을 드러냈습니다.
  alternative_readings:
  - 처음은 ‘허무’, 마지막은 ‘보상’으로 의미만 풀어 쓰기
  - 양쪽 모두 ‘공허’로 통일하기
  rationale: 히브리어의 반복은 단순 동의어 사용이 아니라 강조 장치이므로, 한국어에서도 반복 효과가 보이도록 했습니다.
  doctrine_reference: 문학적 강조와 의미 반복 보존
