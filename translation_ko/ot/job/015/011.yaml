  - 너에게는 너무 하찮은가
  lexicon: HALOT
  rationale: 수사적 질문의 핵심인 '부족함/불충분함'을 자연스러운 현대 한국어로 옮기되, הערכה를 낮추는 뉘앙스를 유지하기 위해 '너무 작은가'를 택했습니다.
- source_word: תַּנְחֻמוֹת
