  chosen_korean: 위로
  alternatives_korean:
  - 위안
  - 위로의 말
  - 위로들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 복수 표지보다 내용어의 자연스러움이 더 중요하므로, 공식적이면서도 문맥에 맞는 '위로'로 옮겼습니다.
- source_word: וְדָבָר לָאַט עִמָּךְ
  english_pob_choice: or a word spoken gently to you
  chosen_korean: 아니면 부드럽게 전해지는 한마디가 그렇습니까
  alternatives_korean:
  - 아니면 부드럽게 전해지는 말씀입니까
  - 아니면 살며시 전해지는 한마디가 그렇습니까
  lexicon: HALOT
  rationale: '''דָבָר''을 단순한 ''말''보다 문맥상 더 자연스러운 ''한마디''로 풀고, ''לָאַט''의 완곡하고 조심스러운 말하기를 ''부드럽게 전해지는''으로 표현했습니다.'
theological_decisions:
- issue: וְדָבָר의 접속사 기능
  chosen_reading: 두 번째 항목을 첫 항목과 나란히 놓는 수사적 선택으로 읽어 '아니면'으로 옮겼습니다.
  alternative_readings:
  - 그리고 한마디가 부드럽게 전해지는가
  - 또는 부드럽게 전해지는 한마디가 있는가
  rationale: 히브리어의 ו는 단순한 '그리고'보다 대조적·선택적 질문을 형성할 수 있어, 한국어에서도 원문의 수사성을 살리기 위해 '아니면'을 택했습니다.
  doctrine_reference: 문법적-수사적 읽기
- issue: 대상 독자 호칭의 인칭 유지
  chosen_reading: 원문의 2인칭 단수 대상을 그대로 살려 '너에게는'으로 옮겼습니다.
  alternative_readings:
  - 너희에게는
  - 당신에게는
  rationale: 이 구절은 욥 개인을 향한 직접 질책이므로, 복수화하거나 지나치게 공손한 호칭으로 바꾸지 않고 직접성을 유지했습니다.
  doctrine_reference: 본문 화자-수신자 관계
