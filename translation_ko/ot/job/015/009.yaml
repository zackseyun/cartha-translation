  chosen_reading: 두 개의 반문을 모두 존대형 의문문으로 유지하여, 엘리바스가 욥의 주장에 대해 던지는 도전과 비판의 어조를 살렸습니다.
  alternative_readings:
  - 평서문처럼 완화하여 번역하는 방식
