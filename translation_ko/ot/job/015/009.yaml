lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇을
  alternatives_korean:
  - 무엇이
  - 어떤 것을
  lexicon: HALOT
  rationale: 반복되는 수사 의문문을 자연스러운 표준어로 옮기되, 히브리어의 간결함을 살려 첫 번째 질문을 직접적인 목적격 형태로 처리했습니다.
- source_word: יָּדַעְתָּ
  english_pob_choice: do you know
  chosen_korean: 아셔서
  alternatives_korean:
  - 아시어서
  - 아셔서 알고 계셔서
  lexicon: HALOT
  rationale: ידע의 단순 지식이 아니라 상대의 우월한 앎을 비꼬는 문맥이므로, 존대형으로 ‘아시다’를 써서 발화 상대를 그대로 살렸습니다.
- source_word: תָּבִין
  english_pob_choice: do you understand
  chosen_korean: 깨달으셔서
  alternatives_korean:
  - 이해하셔서
  - 분별하셔서
  lexicon: HALOT
  rationale: בין은 단순 이해보다 분별·통찰의 뉘앙스를 가지므로, 현대 한국어에서 그 함의를 살릴 수 있는 ‘깨닫다’를 택했습니다.
- source_word: וְלֹא עִמָּנוּ הוּא
  english_pob_choice: that is not with us
  chosen_korean: 그것이 우리와 함께 있지 않겠습니까
  alternatives_korean:
  - 그것을 우리가 가지고 있지 않겠습니까
  - 그것이 우리 가운데 있지 않겠습니까
  lexicon: HALOT
  rationale: 문자적으로는 ‘우리와 함께 있지 않다’이지만, 문맥상 앞선 ‘깨달음/앎’을 가리키므로 사물 대명사 ‘그것’으로 받되 ‘with us’를 관계적 존재 표현으로 옮겼습니다.
