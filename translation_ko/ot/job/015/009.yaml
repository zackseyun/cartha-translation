  text: מַה יָּ֭דַעְתָּ וְ/לֹ֣א נֵדָ֑ע תָּ֝בִ֗ין וְֽ/לֹא עִמָּ֥/נוּ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
  footnotes:
  - marker: a
    text: Or, 'that we do not have.' The Hebrew literally says, 'and it is not with us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무엇을 아셔서 우리가 알지 못하겠습니까? 무엇을 깨달으셔서 그것이 우리와 함께 있지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리와 함께 있지 않다’입니다. 여기서는 앞의 ‘무엇을’이 가리키는 앎이나 깨달음을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇을
  alternatives_korean:
  - 무엇이
  - 어떤 것을
  lexicon: HALOT
  rationale: 반복되는 수사 의문문을 자연스러운 표준어로 옮기되, 히브리어의 간결함을 살려 첫 번째 질문을 직접적인 목적격 형태로 처리했습니다.
- source_word: יָּדַעְתָּ
  english_pob_choice: do you know
  chosen_korean: 아셔서
  alternatives_korean:
  - 아시어서
  - 아셔서 알고 계셔서
  lexicon: HALOT
  rationale: ידע의 단순 지식이 아니라 상대의 우월한 앎을 비꼬는 문맥이므로, 존대형으로 ‘아시다’를 써서 발화 상대를 그대로 살렸습니다.
- source_word: תָּבִין
  english_pob_choice: do you understand
  chosen_korean: 깨달으셔서
  alternatives_korean:
  - 이해하셔서
  - 분별하셔서
  lexicon: HALOT
  rationale: בין은 단순 이해보다 분별·통찰의 뉘앙스를 가지므로, 현대 한국어에서 그 함의를 살릴 수 있는 ‘깨닫다’를 택했습니다.
- source_word: וְלֹא עִמָּנוּ הוּא
  english_pob_choice: that is not with us
  chosen_korean: 그것이 우리와 함께 있지 않겠습니까
  alternatives_korean:
  - 그것을 우리가 가지고 있지 않겠습니까
  - 그것이 우리 가운데 있지 않겠습니까
  lexicon: HALOT
  rationale: 문자적으로는 ‘우리와 함께 있지 않다’이지만, 문맥상 앞선 ‘깨달음/앎’을 가리키므로 사물 대명사 ‘그것’으로 받되 ‘with us’를 관계적 존재 표현으로 옮겼습니다.
theological_decisions:
- issue: 수사적 반문과 조롱의 어조
  chosen_reading: 두 개의 반문을 모두 존대형 의문문으로 유지하여, 엘리바스가 욥의 주장에 대해 던지는 도전과 비판의 어조를 살렸습니다.
  alternative_readings:
  - 평서문처럼 완화하여 번역하는 방식
  - 더 직설적인 비난 어조로 강화하는 방식
  rationale: 본문은 정보 요청이 아니라 수사적 반문이므로, 현대 한국어에서도 질문 형식을 유지해야 본문의 논쟁적 힘이 드러납니다.
  doctrine_reference: 지혜서/논쟁문맥의 수사학 보존
