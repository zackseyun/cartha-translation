  rationale: 본문은 정보 요청이 아니라 수사적 반문이므로, 현대 한국어에서도 질문 형식을 유지해야 본문의 논쟁적 힘이 드러납니다.
  doctrine_reference: 지혜서/논쟁문맥의 수사학 보존
