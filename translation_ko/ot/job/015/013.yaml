  to: 그대가 하나님을 향하여 그대의 영을 돌리고, 그대의 입에서 말을 내놓는다는 것입니까?[a]
  rationale: The revision removes the unsupported concessive ‘그런데도,’ uses formal-polite Korean, and retains the Hebrew preposition’s literal directional ambiguity. The footnote records both the alternative rendering and the contextual possibility of hostility without making that interpretation mandatory in the main text.
