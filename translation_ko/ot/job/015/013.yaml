id: JOB.15.13
reference: Job 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תָשִׁ֣יב אֶל אֵ֣ל רוּחֶ֑/ךָ וְ/הֹצֵ֖אתָ מִ/פִּ֣י/ךָ מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/013.yaml
  text: that you turn your spirit against God and bring words out of your mouth?[a]
  footnotes:
  - marker: a
    text: Or 'toward God.' The Hebrew literally reads 'to/toward God'; 'against God' is chosen in the main text because the context is accusatory and implies opposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 네가 하나님을 향해 네 영을 돌리고 네 입에서 말을 내놓는다는 말이냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께.’ 히브리어는 문자적으로 ‘하나님께/하나님을 향해’라고 되어 있으나, 문맥상 책망과 적대의 뉘앙스가 강하므로 본문에서는 ‘하나님을 향해’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: that
  chosen_korean: 그런데도
  alternatives_korean:
  - 왜냐하면
  - 그리하여
  - 곧
  lexicon: HALOT
  rationale: 본문에서 כִּי는 앞선 책망을 이어 그 내용 자체를 도입하는 기능이므로, 한국어에서는 따옴표 없는 반어적 질문의 흐름을 살려 ‘그런데도’로 자연스럽게 처리했습니다.
- source_word: תָשִׁיב
  english_pob_choice: you turn
  chosen_korean: 돌리고
  alternatives_korean:
  - 되돌리고
  - 향하게 하고
  - 돌려
  lexicon: HALOT
  rationale: Hiphil שוב의 ‘돌리다/향하게 하다’는 뜻을 반영하여, ‘네 영을’과 결합할 때 가장 간결하고 문맥에 맞는 동사로 ‘돌리고’를 택했습니다.
- source_word: אֶל אֵל
  english_pob_choice: against God
  chosen_korean: 하나님을 향해
  alternatives_korean:
  - 하나님께
  - 하나님을 대적하여
  - 하나님에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘하나님께/하나님을 향해’이지만, 영어 POB의 주석처럼 고발적 문맥에서 적대의 뉘앙스가 강합니다. 한국어 본문은 원형의 방향성을 살려 ‘향해’로 두고, 노골적 적대 해석은 주석에서 보완하는 편이 소스에 더 가깝습니다.
- source_word: וְהֹצֵאתָ מִפִּיךָ מִלִּין
  english_pob_choice: and bring words out of your mouth
  chosen_korean: 네 입에서 말을 내놓는다는
  alternatives_korean:
  - 네 입에서 말을 꺼낸다는
  - 네 입에서 말을 끌어낸다는
  - 네 입에서 말을 내뱉는다는
  lexicon: HALOT
  rationale: ‘bring out’의 구체적 이미지를 살리되 한국어에서 어색하지 않게 ‘내놓다’를 사용했습니다. ‘말’을 택해 מִלִּין의 직접적 의미를 반영했습니다.
theological_decisions:
- issue: אֶל אֵל의 공격적 함의와 한국어 표면 번역의 균형
  chosen_reading: 본문에는 ‘하나님을 향해’라고 옮기고, 전체 수사적 질문이 책망과 고발의 맥락임을 살려 읽도록 했습니다.
  alternative_readings:
  - 하나님을 대적하여
  - 하나님께
  - 하나님에게
  rationale: 히브리어 전치사 자체는 중립적 방향성을 가지므로, 본문 번역에서 의미를 과도하게 확정하기보다 문맥이 주는 적대성을 살짝 열어 두는 편이 원문과 POB 주해를 함께 반영합니다.
  doctrine_reference: 문맥적 의미 결정 / 수사적 책망
