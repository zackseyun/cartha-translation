  verdict: revise
  source_fidelity: 첫 의문사들을 원인·동기를 묻는 ‘어찌하여’로 옮긴 것은 문맥에 맞고, ‘마음’과 ‘눈’의 이미지를 보존했습니다. 다만 ‘빼앗아 가다’는 타인의 소유물을 탈취한다는 뜻이 강하여, 마음이 사람을 사로잡거나 휩쓸어 가는 비유인 יִקָּחֲךָ의 문맥에는 ‘휩쓸어 가다’가 더 정확하고 자연스럽습니다. 희귀 동사 יִרְזְמוּן의 불확실성은 각주로 적절히 보존해야 합니다.
  naturalness: ‘어찌하여’와 합쇼체 의문문은 욥기 논쟁 담화의 격식과 질책조에 잘 맞습니다. ‘마음이 당신을 휩쓸어 가며’가 ‘마음이 당신을 빼앗아 가며’보다 현대 한국어에서 자연스럽고 비유의 방향도 분명합니다.
  terminology: ‘마음’은 히브리어 לֵב의 내면·사고·의지의 중심이라는 폭넓은 의미를 무리 없이 전달합니다. ‘번뜩이다’는 채택 가능한 해석이나 희귀 동사의 의미가 확정되지 않았으므로 해당 단어에 각주를 직접 연결해야 합니다.
