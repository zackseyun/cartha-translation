base_translation:
  language: en
  yaml_path: translation/ot/job/015/012.yaml
  text: Why does your heart carry you away[a], and why do your eyes flash?
  footnotes:
  - marker: a
    text: Or 'wink,' 'signal,' or possibly 'roll' your eyes; the Hebrew verb is rare and its precise nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 당신의 마음이 당신을 빼앗아 가며[a], 어찌하여 당신의 눈이 번뜩입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 드물어서 정확한 뜻이 확정적이지 않습니다. '눈짓하다', '신호하다', 혹은 '눈을 굴리다'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무엇 때문에
  lexicon: HALOT
  rationale: 히브리어 שאלת어가 원인·동기를 묻는 수사 의문으로 쓰였으므로, 한국어에서는 단순한 '무엇'보다 '어찌하여'가 문맥의 질책조를 더 잘 살립니다.
- source_word: יִקָּחֲךָ
  english_pob_choice: does ... carry you away
  chosen_korean: 당신을 빼앗아 가며
  alternatives_korean:
  - 당신을 데려가며
  - 당신을 사로잡으며
  lexicon: HALOT
  rationale: 직역하면 '취하다/가져가다'이지만, 여기서는 '마음'이 사람을 휩쓸어 가는 비유이므로 한국어로는 흐름을 강하게 만드는 '빼앗아 가다'가 적절합니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 심장
  - 당신의 속마음
  lexicon: HALOT
  rationale: 히브리어 'heart'는 감정뿐 아니라 판단과 의지의 중심을 가리키므로, 한국어에서는 몸기관보다 내면 전체를 뜻하는 '마음'이 자연스럽습니다.
- source_word: יִרְזְמוּן
  english_pob_choice: do ... flash
  chosen_korean: 번뜩입니까
  alternatives_korean:
  - 눈짓합니까
  - 신호합니까
  - 굴리십니까
  lexicon: HALOT
  rationale: 이 동사는 드물고 정확한 뉘앙스가 불확실하므로, POB의 'flash'를 따라 눈의 공격적·날카로운 움직임을 살리는 '번뜩이다'를 택했습니다.
theological_decisions:
- issue: 인물의 표현을 한국어로 어떻게 옮길지
  chosen_reading: 직접적인 책망의 수사 의문으로 유지하여, 말투를 완화하지 않고 그대로 재현했습니다.
  alternative_readings:
  - 부드러운 설명문조
  - 해석적 평서문
  rationale: 본문은 엘리바스가 욥을 꾸짖는 장면이므로, 질문형의 압박감과 비난의 뉘앙스를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 문맥상 담화 기능 보존 원칙
