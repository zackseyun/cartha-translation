source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
  footnotes:
  - marker: a
    text: Or 'He wanders about for food, saying, “Where is it?”' Hebrew 'bread' can stand for food more generally.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in his hand'; the expression likely means that the day of darkness is close at hand for him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 빵을 찾아 떠돌며[a] ‘어디 있느냐?’고 합니다. 그는 어둠의 날이 자기에게 가까이 닥쳐 있음을[b] 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음식을 찾아 떠돌며’라고 옮길 수 있습니다. 히브리어 ‘빵’은 더 넓게 ‘음식’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손에’입니다. 이 표현은 여기서 어둠의 날이 그에게 가까이 임박해 있음을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  english_pob_choice: wanders about
  chosen_korean: 헤매며
  alternatives_korean:
  - 떠돌며
  - 방황하며
  - 이리저리 다니며
  lexicon: HALOT
  rationale: נדד의 지속적이고 불안정한 떠돎을 자연스러운 합쇼체로 옮기되, 과도한 해석 없이 움직임의 초점을 살렸습니다.
- source_word: לַלֶּחֶם
  english_pob_choice: for bread
  chosen_korean: 먹을 빵을
  alternatives_korean:
  - 음식을
  - 빵을
  - 먹을 것을
  lexicon: HALOT
  rationale: ‘빵’의 직역을 유지하되, 한국어에서는 목적을 드러내기 위해 ‘먹을’로 풀어 독자가 생존을 위한 찾음을 바로 이해하게 했습니다.
- source_word: בידו
  english_pob_choice: at hand for him
  chosen_korean: 자기에게
  alternatives_korean:
  - 그의 손에
  - 그에게
  - 그의 손 안에
  lexicon: HALOT
  rationale: 직역의 ‘그의 손에’보다, 관용적으로 ‘자기에게 준비되어 있음’이 임박성과 처지를 더 정확히 전달하므로 본문에서는 그 의미를 반영했습니다.
- source_word: יום חשך
  english_pob_choice: a day of darkness
  chosen_korean: 어둠의 날
  alternatives_korean:
  - 어둠의 하루
  - 흑암의 날
  - 어두운 날
  lexicon: HALOT
  rationale: 이미지성을 보존하면서도 한국어에서 자연스럽게 들리도록 ‘어둠의 날’로 옮겼습니다. ‘어둠’은 재난과 심판의 함의를 열어 두는 표현입니다.
theological_decisions:
- issue: ‘어둠의 날’의 의미를 본문에서 얼마나 풀어 쓸지
  chosen_reading: 주석적 설명을 본문에 넣지 않고 이미지 그대로 유지했습니다.
  alternative_readings:
  - 재앙의 날
  - 심판의 날
  - 파멸의 날
  rationale: 히브리어 표현은 비유적이지만, 본문 자체는 그 의미를 직접 규정하지 않습니다. 따라서 신학적 해석을 앞세우지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
