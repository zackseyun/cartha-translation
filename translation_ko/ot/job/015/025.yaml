translation:
  language: ko
  text: 그가 하나님을 향해[a] 손을 뻗고, 전능하신 분을 상대로 스스로 힘을 과시했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 거슬러’. 히브리어는 기본적으로 ‘하나님을 향해’라는 방향을 나타내며, 여기서는 적대적인 문맥에서 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: 그가 … 했기 때문에
  alternatives_korean:
  - 이는 … 때문입니다
  - 왜냐하면 …
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 진술의 근거를 제시하는 인과 접속이므로, 한국어에서도 원인의 흐름이 분명한 표현으로 옮겼습니다.
- source_word: נָטָה אֶל אֵל יָדוֹ
  english_pob_choice: has stretched out his hand against God
  chosen_korean: 하나님을 향해 손을 뻗었고
  alternatives_korean:
  - 하나님께 손을 뻗었고
  - 하나님을 향해 손을 내밀었고
  lexicon: HALOT
  rationale: ‘손을 뻗다’는 גוף/행동 이미지를 살리면서도, hostile context를 한국어에서 자연스럽게 드러내기 위해 ‘향해’로 방향성을 유지했습니다.
- source_word: יִתְגַּבָּר
  english_pob_choice: has shown himself mighty
  chosen_korean: 스스로 강한 체했습니다
  alternatives_korean:
  - 스스로 강해졌습니다
  - 힘을 과시했습니다
  - 강한 자인 양 행동했습니다
  lexicon: HALOT
  rationale: 히트파엘의 자기-강화/자기-과시 뉘앙스를 살리되, 하나님께 대항하는 문맥의 반어를 드러내기 위해 ‘강한 체하다’를 택했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 하나님의 칭호를 음역보다 번역하는 프로젝트 원칙에 따라, 시적 평행을 해치지 않는 자연스러운 한국어 칭호로 옮겼습니다.
theological_decisions:
- issue: אֵל과 שַׁדַּי의 병행 칭호를 한국어에서 어떻게 구분할지
  chosen_reading: אֵל은 ‘하나님’, שַׁדַּי은 ‘전능하신 분’으로 구분해 번역했습니다.
  alternative_readings:
  - ‘하나님’ / ‘전능자’
  - ‘하나님’ / ‘샤다이’
  rationale: 두 칭호의 병행을 살리면서도 같은 칭호의 중복을 피해야 하므로, 앞 절은 일반 호칭, 뒤 절은 권능을 드러내는 칭호로 구분했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
