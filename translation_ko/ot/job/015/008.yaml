  source_fidelity: 현 번역의 ‘하나님의 비밀 회합을 들으셨으며’는 בְּ(‘~에서/~안에서’)를 목적격으로 처리하여, 회합 자체를 듣는다는 뜻으로 흐립니다. 원문은 하나님의 סוֹד, 곧 은밀한 회의/모임 안에서 들었느냐고 묻습니다. 또한 ‘지혜를 당신에게만 제한하다’는 한국어 결합이 다소 부자연스럽지만, 지혜를 자기에게만 국한한다는 원문의 수사적 비난은 보존할 수 있습니다.
  naturalness: ‘하나님의 회의에서 들으셨으며’가 장소·상황을 자연스럽게 드러냅니다. ‘자신에게만 국한하셨습니까?’는 원문의 배타적 방향성(אֵלֶיךָ)을 현대 표준 한국어로 비교적 자연스럽게 전달합니다.
  terminology: אֱלוֹהַ는 ‘하나님’으로, חָכְמָה는 ‘지혜’로 옮기는 것이 적절합니다. סוֹד의 회의·친밀한 모임·비밀스러운 심의라는 범위는 각주에서 보존합니다. 본문에서는 ‘회의’를 택하되, ‘은밀한’이라는 해석적 수식어는 각주 대안으로 둡니다.
