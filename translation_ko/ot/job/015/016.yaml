translation:
  language: ko
  text: 하물며 더더욱, 가증스럽고 부패한 사람은 물처럼 불의를 마십니다!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: how much less
  chosen_korean: 하물며 더더욱
  alternatives_korean:
  - 하물며
  - 더욱이 얼마나
  lexicon: HALOT
  rationale: 앞선 문맥의 아 포르투리오 논리를 한국어에서 자연스럽게 살려, 단순 접속이 아니라 ‘그렇다면 더욱’의 축을 드러내는 표현으로 옮겼습니다.
- source_word: נִתְעָב
  english_pob_choice: detestable
  chosen_korean: 가증스럽고
  alternatives_korean:
  - 역겨운
  - 혐오스러운
  - 가증한
  lexicon: HALOT
  rationale: 도덕적 혐오를 강하게 드러내는 말이므로, 한국어 성경 문체에서 충분히 강한 ‘가증스럽다’를 택했습니다.
- source_word: נֶאֱלָח
  english_pob_choice: corrupt
  chosen_korean: 부패한
  alternatives_korean:
  - 더러운
  - 오염된
  - 타락한
  lexicon: HALOT
  rationale: 희귀어가 나타내는 오염됨/부정됨의 뜻을, 도덕적·영적 훼손을 함께 담는 ‘부패한’으로 옮겼습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불법
  - 죄악
  - 부정
  lexicon: HALOT
  rationale: 문맥상 단순한 사회적 불공정보다 하나님 앞에서의 도덕적 그릇됨이 핵심이어서, 한국어 성경에서 자주 쓰이는 ‘불의’를 택했습니다.
theological_decisions:
- issue: 의인의 반대편에 있는 인간의 도덕 상태를 어떻게 압축할 것인가
  chosen_reading: 가증스럽고 부패한 사람은 물처럼 불의를 마십니다
  alternative_readings:
  - 가증스럽고 부패한 사람은 물처럼 불의를 받아들입니다
  - 가증스럽고 부패한 사람은 물처럼 불의를 행합니다
  rationale: 원문은 ‘마신다’는 동사로 불의를 체화하듯 삼키는 생생한 이미지를 제시하므로, 행위 일반보다 더 강한 내면화의 은유를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
