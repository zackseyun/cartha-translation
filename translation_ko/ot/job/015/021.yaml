id: JOB.15.21
reference: Job 15:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קוֹל פְּחָדִ֥ים בְּ/אָזְנָ֑י/ו בַּ֝/שָּׁל֗וֹם שׁוֹדֵ֥ד יְבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
  footnotes:
  - marker: a
    text: Or 'in peace' or 'in safety'; Hebrew שָׁלוֹם can denote peace, well-being, or prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 공포의 소리가 그의 귀에 있고, 평안 중에 파괴자가 그에게 온다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안에서’, ‘안전할 때’. 히브리어 שָׁלוֹם은 평안, 안전, 번영을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל פְּחָדִים
  english_pob_choice: A sound of terrors
  chosen_korean: 공포의 소리
  alternatives_korean:
  - 두려움들의 소리
  - 전율의 소리
  lexicon: WLC; HALOT
  rationale: קוֹל은 여기서 말소리보다 청각적으로 들려오는 현상을 가리키므로 ‘소리’로 옮기고, פְּחָדִים의 복수적 강도를 살려 ‘공포’로 표현했습니다.
- source_word: בְּאָזְנָיו
  english_pob_choice: is in his ears
  chosen_korean: 그의 귀에 있고
  alternatives_korean:
  - 그의 귀속에 있고
  - 그의 귀에 울리고
  lexicon: WLC; HALOT
  rationale: 히브리어의 직설적인 신체 이미지를 살리면서도 한국어로 자연스럽게 읽히도록 ‘그의 귀에 있고’로 옮겼습니다.
- source_word: בַּשָּׁלוֹם
  english_pob_choice: in prosperity
  chosen_korean: 평안 중에
  alternatives_korean:
  - 번영 중에
  - 안전할 때
  - 평안하게
  lexicon: WLC; HALOT
  rationale: שָׁלוֹם은 문맥상 ‘평안/안전/번영’의 범위를 가지므로, 본문이 말하는 허울 좋은 안전 상태를 과도하게 좁히지 않도록 ‘평안 중에’로 두었습니다.
- source_word: שׁוֹדֵד
  english_pob_choice: the destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 약탈자
  - 파멸자
  - 노략하는 자
  lexicon: WLC; HALOT
  rationale: 분사형은 파괴와 약탈을 행하는 존재를 가리키므로, 문맥의 위협을 직접적으로 드러내는 ‘파괴자’가 가장 간명합니다.
theological_decisions:
- issue: בַּשָּׁלוֹם의 의미 범위
  chosen_reading: ‘평안 중에’로 번역해, 겉보기의 안전과 안락 속에서 재앙이 닥친다는 역설을 드러냈습니다.
  alternative_readings:
  - ‘평안에서’
  - ‘번영 중에’
  - ‘안전할 때’
  rationale: 이 절은 악인의 체감상 안전이 무너지는 순간을 그리므로, 단순한 정서적 평화보다 생활 조건의 무사함까지 포괄하는 표현이 필요합니다.
  doctrine_reference: 잠언적/지혜문학적 심판 역전의 표현
