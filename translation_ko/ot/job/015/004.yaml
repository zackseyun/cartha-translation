base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
  footnotes:
  - marker: a
    text: Or 'you undermine fear' or 'you make fear ineffective.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fear'; in context, likely 'the fear of God' or reverence directed toward God.
    reason: lexical_alternative
  - marker: c
    text: Or 'prayer,' 'devotion,' or 'complaint' before God; the Hebrew term can denote reflective or prayerful speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 진정으로 당신은 하나님을 향한 두려움을 무효화하고 하나님 앞에서의 묵상을 줄여 버립니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려움을 무너뜨린다’, ‘두려움을 무력하게 만든다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘두려움’은 문맥상 하나님을 향한 두려움, 곧 경외를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기도’, ‘경건’, ‘불평’; 히브리어는 하나님 앞에서의 숙고적·기도적 말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 진정으로
  alternatives_korean:
  - 참으로
  - 과연
  - 실로
  lexicon: HALOT
  rationale: אַף의 강조·확언 기능을 한국어 담화부사로 살려, 엘리바스의 공격적 단정이 앞에 강하게 서도록 했습니다.
- source_word: תָּפֵר
  english_pob_choice: annul
  chosen_korean: 무효화하고
  alternatives_korean:
  - 폐기하고
  - 무너뜨리고
  - 무효로 만들고
  lexicon: HALOT
  rationale: 히필의 ‘무력화/무효화’ 뉘앙스를 살리되, ‘fear’를 단순히 약화시키는 수준보다 강한 반박성을 드러내기 위해 선택했습니다.
- source_word: יִרְאָה
  english_pob_choice: the fear of God
  chosen_korean: 하나님을 향한 두려움
  alternatives_korean:
  - 하나님에 대한 두려움
  - 하나님 경외
  - 두려움
  lexicon: HALOT
  rationale: 문맥상 종교적 경외를 가리키지만, 한국어에서 ‘경외’만 쓰면 감정적 두려움의 결이 약해질 수 있어 ‘하나님을 향한 두려움’으로 넓게 살렸습니다.
- source_word: שִׂיחָה
  english_pob_choice: meditation
  chosen_korean: 묵상
  alternatives_korean:
  - 기도
  - 명상
  - 숙고
  lexicon: HALOT
  rationale: ‘before God’와 결합한 성찰적·기도적 말/생각의 의미를 가장 간결하게 담는 표준어로 ‘묵상’을 택했습니다.
theological_decisions:
- issue: יִרְאָה의 종교적 의미를 어떻게 드러낼지
  chosen_reading: 하나님을 향한 두려움
  alternative_readings:
  - 하나님 경외
  - 두려움
  rationale: 본문은 일반적 공포가 아니라 경건의 핵심 태도를 공격하는 말이므로, 한국어에서도 종교적 방향성을 분명히 하되 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: שִׂיחָה를 기도/묵상 중 무엇으로 볼지
  chosen_reading: 묵상
  alternative_readings:
  - 기도
  - 명상
  - 말함
  rationale: 히브리어는 넓은 의미를 가지며, 하나님 앞에서의 내적·말씀적 숙고를 포함할 수 있으므로 너무 좁은 ‘기도’보다 넓은 ‘묵상’이 본문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3
