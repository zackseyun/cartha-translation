    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 당신은 하나님을 향한 두려움을 무너뜨리고[a][b], 하나님 앞에서의 묵상을 줄입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려움을 무력하게 만든다’, ‘두려움을 무효로 만든다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘두려움’은 문맥상 하나님을 향한 두려움, 곧 경외를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기도’, ‘경건’, ‘불평’; 히브리어는 하나님 앞에서의 숙고적·기도적 말을 가리킬 수 있습니다.
    reason: lexical_alternative
