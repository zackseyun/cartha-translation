id: JOB.15.28
reference: Job 15:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכּ֤וֹן עָ֘רִ֤ים נִכְחָד֗וֹת בָּ֭תִּים לֹא יֵ֣שְׁבוּ לָ֑/מוֹ אֲשֶׁ֖ר הִתְעַתְּד֣וּ לְ/גַלִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
  footnotes:
  - marker: a
    text: Or 'He dwelt in destroyed cities, in houses where they do not live, which were appointed for heaps.' The Hebrew of this verse is compact and allows several closely related renderings, especially in the middle clause.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 무너진 성읍들에 살며, 사람이 거주하지 않는 집들, 곧 쌓인 더미가 되도록 정해진 곳에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  english_pob_choice: He has lived
  chosen_korean: 살며
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: שכן의 ‘거주하다/살다’ 뜻을 살리면서, 문맥상 계속된 상태를 자연스럽게 나타내기 위해 ‘살며’로 옮겼습니다.
- source_word: עָרִים נִכְחָדוֹת
  english_pob_choice: ruined cities
  chosen_korean: 무너진 성읍들
  alternatives_korean:
  - 폐허가 된 성읍들
  - 파괴된 성읍들
  - 황폐한 성읍들
  lexicon: HALOT
  rationale: נכחדות의 ‘없어지다, 파괴되다, 폐허가 되다’의 의미를 반영하되, 문맥의 붕괴 상태를 간명하게 드러내기 위해 ‘무너진’을 선택했습니다.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  english_pob_choice: in houses where no one dwells
  chosen_korean: 사람이 거주하지 않는 집들
  alternatives_korean:
  - 아무도 살지 않는 집들
  - 그들에게 거주하지 않는 집들
  - 사람들이 살지 않는 집들
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문을 한국어에서 자연스럽게 풀어, 부자연스러운 대명사 처리를 피하면서 ‘거주하지 않음’의 상태를 분명히 했습니다.
- source_word: לְגַלִּים
  english_pob_choice: to become heaps
  chosen_korean: 쌓인 더미가 되도록
  alternatives_korean:
  - 무더기가 되도록
  - 잔해 더미가 되도록
  - 돌무더기가 되도록
  lexicon: HALOT
  rationale: גַּלִּים의 ‘더미, 무더기’ 의미를 살려 결과 상태를 분명히 하되, 도시·집과의 연결을 고려해 일반적인 ‘더미’로 옮겼습니다.
