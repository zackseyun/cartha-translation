lexical_decisions:
- source_word: הוֹכֵחַ
  english_pob_choice: argue
  chosen_korean: 변론하다
  alternatives_korean:
  - 논쟁하다
  - 책망하다
  - 변론하다
  lexicon: HALOT
  rationale: 욥기 15장의 논박 상황에서 הוכיח는 단순한 ‘꾸짖다’보다 말로 상대를 몰아붙이며 논변하는 뜻이 강하므로, ‘변론하다’가 문맥상 가장 자연스럽습니다.
- source_word: בְּדָבָר
  english_pob_choice: with ... words
  chosen_korean: 말로
  alternatives_korean:
  - 말로
  - 말씀으로
  - 한마디로
  lexicon: HALOT
  rationale: דָבָר는 여기서 ‘말/말씀’의 의미로 쓰이며, 뒤의 מִלִּים과 평행을 이루므로 ‘말로’로 옮겨 말의 영역을 분명히 했습니다.
- source_word: לֹא יִסְכּוֹן
  english_pob_choice: useless
  chosen_korean: 무익한
  alternatives_korean:
  - 쓸모없는
  - 무용한
  - 유익이 없는
  lexicon: HALOT
  rationale: יָסַך/סכן 계열의 용법은 ‘유익하다, 도움이 되다’의 반대를 가리키므로, 현대 한국어에서 의미를 가장 간결하게 드러내는 ‘무익한’을 선택했습니다.
- source_word: לֹא יוֹעִיל בָּם
  english_pob_choice: that does no good
  chosen_korean: 아무 유익도 주지 못하는
  alternatives_korean:
  - 도움이 되지 않는
  - 유익하지 못하는
  - 그것으로는 아무 유익도 없는
  lexicon: HALOT
  rationale: יוֹעִיל은 ‘유익하게 하다, 도움이 되다’의 뜻이고, 어미 -בָּם은 앞의 ‘말/말들’을 가리키므로, 한국어에서는 결과적 무효성을 분명히 하는 표현으로 옮겼습니다.
