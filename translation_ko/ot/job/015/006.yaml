id: JOB.15.6
reference: Job 15:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַרְשִֽׁיעֲ/ךָ֣ פִ֣י/ךָ וְ/לֹא אָ֑נִי וּ֝/שְׂפָתֶ֗י/ךָ יַעֲנוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
  footnotes:
  - marker: a
    text: Or 'your own lips answer against you.' The Hebrew verb can more literally mean 'answer,' but here likely carries the sense of giving testimony.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 입이 여러분을 정죄하고, 제가 아니라 여러분의 입술이 여러분에게 불리하게 증언합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 입술이 여러분에게 불리하게 대답합니다’. 히브리어 동사는 문자적으로 ‘대답하다’에 가깝지만, 여기서는 증언의 뜻이 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  english_pob_choice: condemns you
  chosen_korean: 정죄하고
  alternatives_korean:
  - 유죄로 판결하고
  - 죄가 있음을 선언하고
  - 악하다고 증명하고
  lexicon: HALOT
  rationale: 히필형 רשע는 ‘정죄하다/유죄로 판결하다’의 법정적 뜻이므로, 엘리바스의 고발 문맥에 맞게 ‘정죄하다’로 옮겼습니다.
- source_word: פִיךָ
  english_pob_choice: your own mouth
  chosen_korean: 여러분의 입
  alternatives_korean:
  - 여러분의 입술
  - 당신의 입
  lexicon: HALOT
  rationale: 직역상 ‘입’이며, 한국어에서는 주어 반복이 자연스러워 소유격을 유지해 자책의 의미를 드러냈습니다.
- source_word: וּשְׂפָתֶיךָ
  english_pob_choice: your own lips
  chosen_korean: 여러분의 입술
  alternatives_korean:
  - 여러분의 입
  - 여러분 자신의 입술
  lexicon: HALOT
  rationale: 평행구조를 살리기 위해 ‘입’과 구분되는 ‘입술’로 옮겼고, 원문의 자기비판 강조는 소유격 반복으로 충분히 반영했습니다.
- source_word: יַעֲנוּ בָךְ
  english_pob_choice: testify against you
  chosen_korean: 여러분에게 불리하게 증언합니다
  alternatives_korean:
  - 여러분을 향해 대답합니다
  - 여러분에게 맞서 증언합니다
  - 여러분에 대해 답합니다
  lexicon: HALOT
  rationale: ענה는 여기서 단순 ‘대답하다’보다 법정적 ‘증언하다’의 뉘앙스가 강하므로, 전치사 בָךְ의 대립성을 살려 ‘불리하게’로 풀었습니다.
theological_decisions:
- issue: 화자-청자 관계를 반영한 직설적 정죄 표현
  chosen_reading: 엘리바스가 욥의 말 자체를 증거로 삼아 그를 정죄하는 공격적 진술로 유지했습니다.
  alternative_readings:
  - 더 완곡하게 ‘여러분의 말이 여러분을 책망합니다’로 완화
  - ‘증언합니다’ 대신 ‘말합니다’로 일반화
  rationale: 이 구절은 위로가 아니라 고발의 수사이므로, 법정적 긴장과 공격성을 약화시키지 않는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문의 화용론적/수사학적 맥락
