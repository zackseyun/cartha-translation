id: JOB.15.14
reference: Job 15:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
  footnotes:
  - marker: a
    text: Or 'What is a human being...?' The Hebrew singular 'man' is generic, referring to humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'clean' for 'pure.' The Hebrew can denote cleanness or purity in a moral sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the right' or 'justified' for 'righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 어찌 깨끗할 수 있겠습니까? 여자에게서 난 이가 어찌 의로울 수 있겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '인간'입니다. 히브리어 단수형 '사람'은 일반적으로 인류를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '깨끗할'입니다. 히브리어는 도덕적 또는 정결의 의미를 둘 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '의로운'이 아니라 '옳은/정당한'의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 사람이
  lexicon: HALOT
  rationale: 히브리어 אֱנוֹשׁ은 연약한 인간 일반을 가리키는 대표적 단수이므로, 한국어에서는 성별이 드러나는 '남자'보다 보편적이고 자연스러운 '사람'으로 옮겼습니다.
- source_word: יִזְכֶּה
  english_pob_choice: should be pure
  chosen_korean: 깨끗할 수 있겠습니까
  alternatives_korean:
  - 순결할 수 있겠습니까
  - 정결할 수 있겠습니까
  - 깨끗하겠습니까
  lexicon: HALOT
  rationale: זכה는 문맥상 도덕적·의례적 정결을 함께 아우를 수 있어, 한국어에서는 의미 범위를 넓게 담는 '깨끗하다'를 택했습니다. 질문형으로는 능력/가능성을 드러내는 표현이 문맥에 잘 맞습니다.
- source_word: יִצְדַּק
  english_pob_choice: should be righteous
  chosen_korean: 의로울 수 있겠습니까
  alternatives_korean:
  - 의롭다 할 수 있겠습니까
  - 정당하다고 할 수 있겠습니까
  - 의롭겠습니까
  lexicon: HALOT
  rationale: צדק은 여기서 의롭다/옳다의 상태를 가리키므로, 신학적·법정적 의미를 지나치게 좁히지 않는 '의롭다' 계열로 옮겼습니다. 반문 구조를 살려 '수 있겠습니까'로 자연스럽게 표현했습니다.
- source_word: יְלוּד אִשָּׁה
  english_pob_choice: one born of a woman
  chosen_korean: 여자에게서 난 이
  alternatives_korean:
  - 여자에게서 태어난 이
  - 여인에게서 난 자
  - 여자에게서 난 사람
  lexicon: HALOT
  rationale: 히브리어 관용구는 인간의 유한성과 피조성을 강조합니다. 한국어에서는 고전적 직역보다 현대적이면서도 상투성을 유지하는 '여자에게서 난 이'로 간결하게 살렸습니다.
theological_decisions:
- issue: 인류 일반을 가리키는 단수 표현의 처리
  chosen_reading: '''사람''과 ''여자에게서 난 이''로 옮겨, 특정 남성을 가리키지 않고 인간 일반을 뜻하는 대표적 단수로 읽히게 했습니다.'
  alternative_readings:
  - 성중립적으로 '인간' 또는 '누구'로 완화하는 번역
  rationale: 원문은 문법상 단수이지만 의미상 인류 전체를 가리키므로, 남성 중심 어감을 과도하게 강화하지 않으면서도 대표성은 유지하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: יִצְדַּק의 의미 범위
  chosen_reading: 법정적 '의롭다'보다 문맥상 인간의 도덕적 상태를 묻는 '의롭다/의로울 수 있다'로 처리했습니다.
  alternative_readings:
  - '''정당하다'''
  - '''의롭다 함을 받다'''
  rationale: 이 구절은 인간이 하나님 앞에서 스스로 깨끗하고 의로울 수 없다는 수사적 질문이므로, 후대 교리 용어를 앞세우기보다 히브리어의 넓은 의미를 보존하는 쪽이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
