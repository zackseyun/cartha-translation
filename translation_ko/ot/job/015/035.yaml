  source_fidelity: 히브리어의 잉태·출산 은유와 복수 일반 주어는 대체로 반영되었습니다. 그러나 עָמָל은 영어 POB의 ‘trouble’에 해당하는 해악·고난의 폭을 지니는데, 초안의 ‘악’은 다음의 אָוֶן과 지나치게 겹칩니다. 또한 אָוֶן을 ‘악행’으로 옮기면 행위로 한정되어 원문의 ‘죄악/불의’라는 추상적 악의 의미가 좁아집니다.
  naturalness: ‘그들의 배는’은 출산 은유의 문맥에서는 가능하지만 다소 어색합니다. ‘그들의 태는’이 임신·출산의 연속된 비유를 더 자연스럽고 분명하게 유지합니다. ‘속임수를 준비합니다’는 시적 표현으로 이해 가능하며 תָּכִין의 ‘준비하다’ 의미를 직접 보존합니다.
  terminology: ‘해악’은 עָמָל의 해로운 고난·폐해의 뉘앙스를 살리면서 אָוֶן(‘죄악’)과 구별합니다. ‘죄악’은 אָוֶן의 윤리적 의미를 자연스럽게 전달하며, ‘속임수’는 מִרְמָה에 적절합니다.
  issues:
