    rationale: ‘악’은 뒤의 אָוֶן과 의미가 중복됩니다. עָמָל의 해악·고난·폐해의 의미를 별도로 드러내는 편이 원문의 병행을 더 잘 보존합니다.
  - severity: medium
    issue: אָוֶן을 ‘악행’으로 번역함
    rationale: ‘악행’은 구체적인 행위로 의미를 제한합니다. 원문은 죄악·불의·악이라는 보다 넓은 추상 명사를 가리킵니다.
  - severity: low
    issue: ‘배’의 선택
    rationale: 출산 은유를 지속하는 문맥에서 בֶּטֶן은 ‘태/자궁’으로 옮기는 것이 한국어에서 더 자연스럽고 이미지도 일관됩니다.
