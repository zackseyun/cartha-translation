id: JOB.15.32
reference: Job 15:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּֽ/לֹא י֭וֹמ/וֹ תִּמָּלֵ֑א וְ֝/כִפָּת֗/וֹ לֹ֣א רַעֲנָֽנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
  footnotes:
  - marker: a
    text: Or 'It will be fulfilled before his time.' The Hebrew verb literally means 'will be filled/full,' and the exact nuance in context is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'his palm branch' or 'his top shoot.' The Hebrew term refers to a branch-like part of a tree or plant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 때 이전에 그 대가가 다 치러질 것이며, 그의 가지는 푸르지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 때가 차기 전에’로도 옮길 수 있습니다. 히브리어 동사 מלא는 문자적으로 ‘가득 차다/채워지다’를 뜻하며, 문맥상 정확한 뉘앙스는 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 꼭대기 순’이나 ‘그의 야자 가지’로 볼 수 있습니다. 히브리어는 나무나 식물의 가지 모양 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  english_pob_choice: before his time
  chosen_korean: 그의 때 이전에
  alternatives_korean:
  - 그의 날 이전에
  - 제때가 되기 전에
  lexicon: HALOT
  rationale: בְּלֹא יוֹמוֹ는 직역하면 ‘그의 날/때가 아니다’로, 문맥상 ‘때가 이르기 전에’라는 뜻이 적절하므로 한국어에서는 자연스럽게 ‘그의 때 이전에’로 옮겼습니다.
- source_word: תִּמָּלֵא
  english_pob_choice: will be paid in full
  chosen_korean: 그 대가가 다 치러질 것입니다
  alternatives_korean:
  - 충만해질 것입니다
  - 완성될 것입니다
  - 이루어질 것입니다
  lexicon: HALOT
  rationale: נפעל형 מלא는 기본적으로 ‘가득 차다/채워지다’이지만, 영어 POB의 audit trail처럼 문맥상 ‘응분의 대가가 완전히 치러진다’는 뉘앙스가 살아 있어 한국어에서는 ‘대가가 다 치러지다’로 풀었습니다.
- source_word: כִפָּתוֹ
  english_pob_choice: his branch
  chosen_korean: 그의 가지
  alternatives_korean:
  - 그의 꼭대기 순
  - 그의 야자 가지
  - 그의 새순
  lexicon: HALOT
  rationale: כִפָּה는 나무의 가지, 꼭대기 순, 잎이 달린 부분을 가리킬 수 있어, 지나치게 특정한 이미지인 ‘야자 가지’보다 일반적인 식물 이미지인 ‘가지’가 본문에 안전합니다.
- source_word: לֹא רַעֲנָנָה
  english_pob_choice: will not stay green
  chosen_korean: 푸르지 못할 것입니다
  alternatives_korean:
  - 싱싱하지 못할 것입니다
  - 무성하지 못할 것입니다
  - 푸르게 남지 못할 것입니다
  lexicon: HALOT
  rationale: רַעֲנָן은 식물의 신선함과 푸름을 나타내므로, 이미지성을 살리면서도 자연스러운 한국어로 ‘푸르지 못할 것입니다’라고 옮겼습니다.
