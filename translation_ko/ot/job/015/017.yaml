base_translation:
  language: en
  yaml_path: translation/ot/job/015/017.yaml
  text: I will tell you; listen to me. What I have seen[a], I will recount—
  footnotes:
  - marker: a
    text: Or 'I will show you; hear me; and this I have seen, and I will declare it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 당신에게 말하겠습니다. 제 말을 들으십시오. 제가 본 것을 저는 이야기하겠습니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 당신에게 보여주겠습니다; 제 말을 들으십시오; 그리고 이것을 제가 보았으며, 저는 그것을 이야기하겠습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַוְךָ
  english_pob_choice: I will tell you
  chosen_korean: 제가 당신에게 말하겠습니다
  alternatives_korean:
  - 제가 당신에게 보여주겠습니다
  - 제가 당신에게 선언하겠습니다
  lexicon: HALOT
  rationale: 문맥상 실제로 무언가를 ‘보여주는’ 것이 아니라 말로 전하려는 화행이므로, POB의 ‘tell’에 맞춰 자연스러운 ‘말하겠습니다’로 옮겼습니다.
- source_word: שְׁמַע לִי
  english_pob_choice: listen to me
  chosen_korean: 제 말을 들으십시오
  alternatives_korean:
  - 제 말을 들어 보십시오
  - 저를 들으십시오
  lexicon: HALOT
  rationale: 히브리어 명령형과 전치사는 화자에게 주의를 기울이라는 요청이므로, 현대 한국어에서 가장 직접적인 ‘제 말을 들으십시오’로 살렸습니다.
- source_word: וְזֶה
  english_pob_choice: What
  chosen_korean: 제가 본 것을
  alternatives_korean:
  - 그리고 이것을
  - 이것을
  lexicon: HALOT
  rationale: 형식적으로는 ‘그리고 이것’이지만, 뒤의 ‘I have seen’과 함께 내용 도입 기능을 하므로 한국어에서는 자연스럽게 관계화하여 ‘제가 본 것을’로 풀었습니다.
- source_word: וַאֲסַפֵּרָה
  english_pob_choice: I will recount
  chosen_korean: 저는 이야기하겠습니다
  alternatives_korean:
  - 저는 전하겠습니다
  - 저는 진술하겠습니다
  lexicon: HALOT
  rationale: 관찰한 내용을 차분히 풀어 말하는 뉘앙스가 있어 ‘이야기하다’가 한국어로 가장 자연스럽고, 단순한 ‘말하다’보다 서술적 반복성을 더 잘 담습니다.
theological_decisions:
- issue: 엘리바스의 단정적 발화 톤
  chosen_reading: 문장 전체를 화자의 확신에 찬 선언으로 유지했습니다.
  alternative_readings:
  - 완곡하게 낮춘 표현으로 조정
  - 설명문처럼 중립화
  rationale: 본문은 체험을 근거로 단정적으로 말하는 엘리바스의 수사이므로, 그 강도를 약화하지 않고 그대로 살리는 편이 원문의 효과에 충실합니다.
  doctrine_reference: 본문의 화행과 담화 기능에 관한 번역 결정
