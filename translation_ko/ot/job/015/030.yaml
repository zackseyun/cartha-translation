  text: 그는 어둠에서 떠나지 못할 것입니다.[a] 불꽃이 그의 새싹을 말릴 것이며,[b] 그의 입김으로 그가 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 마지막 구절의 ‘그의 입김’을 악한 자의 입김이 아니라 하나님의 입김으로 읽어, ‘그분의 입김으로 그가 사라질 것입니다’로 번역할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 새싹’은 식물 비유입니다. 악한 자를 새로 돋은 가지가 불꽃에 그을려 마르는 나무에 빗대어 말합니다.
    reason: cultural_note
