  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
  footnotes:
  - marker: a
    text: Or, 'by the breath of His mouth he will pass away,' if the final phrase is taken as referring to God rather than to the wicked man.
    reason: alternative_reading
  - marker: b
    text: '''His shoots'' renders a plant image: the wicked is pictured like a tree whose fresh growth is scorched and dried up.'
    reason: cultural_note
translation:
