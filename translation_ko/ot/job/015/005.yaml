  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
  footnotes:
  - marker: a
    text: Or 'your guilt teaches your mouth'; Hebrew עָוֹן can denote iniquity, guilt, or guilt-bearing depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the tongue of the cunning' or 'the language of the shrewd.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런즉 당신의 죄악이 당신의 입을 가르치고, 당신은 간교한 자들의 혀를 택합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 죄책이 당신의 입을 가르치고’ — 히브리어 עָוֹן은 문맥에 따라 죄악, 죄책, 또는 죄값을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘간교한 자들의 혀’나 ‘꾀 많은 자들의 언어’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנְךָ
  english_pob_choice: your iniquity
  chosen_korean: 당신의 죄악
  alternatives_korean:
  - 당신의 죄
  - 당신의 죄책
  - 당신의 악행
  lexicon: HALOT
  rationale: 이 문맥에서는 Job의 도덕적 그릇됨이 말과 발언을 빚는다는 비난이므로, 법적 책임 뉘앙스의 ‘죄책’보다 윤리적 강도를 살리는 ‘죄악’이 가장 자연스럽습니다.
- source_word: פִיךָ
  english_pob_choice: your mouth
  chosen_korean: 당신의 입
  alternatives_korean:
  - 당신의 입술
  - 당신의 말
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지인 ‘입’을 그대로 살려, 앞 절과의 병렬과 ‘말이 입에서 나온다’는 감각을 유지했습니다.
- source_word: וְתִבְחַר
  english_pob_choice: and you choose
  chosen_korean: 당신은 … 택합니다
  alternatives_korean:
  - 당신은 … 선택합니다
  - 당신은 … 고릅니다
  lexicon: HALOT
  rationale: בחר의 기본 의미를 직접 살리되, 비난의 어조가 분명하도록 ‘택합니다’를 사용했습니다.
- source_word: עֲרוּמִים
  english_pob_choice: the crafty
  chosen_korean: 간교한 자들
  alternatives_korean:
  - 간교한 자
  - 꾀많은 자들
  - 교활한 자들
  lexicon: HALOT
  rationale: 문맥상 긍정적 의미의 ‘슬기로운’이 아니라 부정적 의미의 ‘crafty/cunning’이 분명하므로, 그 뉘앙스를 드러내는 ‘간교한 자들’로 옮겼습니다.
theological_decisions:
- issue: 비난의 화자 어조와 직접성
  chosen_reading: 엘리바스의 책망을 현대 한국어의 직접 비난 어조로 옮기되, 원문의 병렬 구조를 보존했습니다.
  alternative_readings:
  - 더 완곡한 설명체
  - 더 설교적인 해석체
  rationale: 이 절은 Job의 말의 원인을 죄악에 돌리는 공격적 발화이므로, 수사적 날카로움을 약화시키지 않는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §5: source force and rhetorical force'
