translation:
  language: ko
  text: 당신은 첫 사람으로 태어났습니까?[a] 또 산들보다 먼저 태어났습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘첫 사람’은 아담을 암시할 수 있으나, 고유명사 ‘아담’을 명시적으로 사용하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  english_pob_choice: Were you born as the first man
  chosen_korean: 사람의 첫째로 태어났느냐
  alternatives_korean:
  - 첫 사람으로 태어났느냐
  - 사람의 첫 사람으로 태어났느냐
  - 아담으로 태어났느냐
  lexicon: HALOT
  rationale: רִאשׁוֹן의 우선성은 ‘첫째’로, אָדָם은 문맥상 고유명사보다 일반명사 ‘사람’으로 옮기는 것이 원문을 과도하게 특정하지 않습니다.
- source_word: תִּוָּלֵד
  english_pob_choice: were you born
  chosen_korean: 태어났느냐
  alternatives_korean:
  - 태어났느냐
  - 출생했느냐
  - 낳아졌느냐
  lexicon: HALOT
  rationale: 니팔형의 출생 의미를 자연스러운 한국어 의문문 ‘태어났느냐’로 옮겨, 수동적 뉘앙스를 살렸습니다.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  english_pob_choice: and were you brought forth before the hills
  chosen_korean: 그리고 산들보다 먼저 존재했느냐
  alternatives_korean:
  - 그리고 산들보다 먼저 생겨났느냐
  - 그리고 산들보다 앞서 나왔느냐
  - 그리고 언덕들보다 앞서 태어났느냐
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘~보다 먼저/앞서’의 시간적 비교로, גְבָעוֹת는 시적 문맥상 ‘산들’로 옮겨 원문의 장중한 지형 이미지를 살렸습니다.
- source_word: חוֹלָלְתָּ
  english_pob_choice: were you brought forth
  chosen_korean: 존재했느냐
  alternatives_korean:
  - 낳아졌느냐
  - 산고 속에 나오게 되었느냐
  - 태어나게 되었느냐
  lexicon: HALOT
  rationale: חול의 출산/산고 이미지는 한국어에서 직역하면 다소 거칠 수 있어, 앞 절의 ‘태어나다’와 중복되지 않도록 보다 포괄적인 ‘존재했다’로 옮겨 두 번째 질문의 선재성 대조를 드러냈습니다.
theological_decisions:
- issue: אָדָם을 ‘아담’이라는 고유명사로 볼 것인가, 일반명사 ‘사람’으로 볼 것인가
  chosen_reading: 일반명사 ‘사람’으로 읽어 ‘사람의 첫째’로 번역했습니다.
  alternative_readings:
  - 아담
  - 첫 사람
  rationale: 영어 POB의 주석처럼 히브리어는 고유명사를 명시하지 않으며, 본문은 엘리바스의 수사적 질문에서 인간의 선재성을 묻는 맥락이므로 원문 수준의 모호함을 보존하는 편이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy and avoiding over-specification'
- issue: חוֹלָלְתָּ의 산고/출산 이미지를 한국어에서 얼마나 직접적으로 드러낼 것인가
  chosen_reading: 두 번째 절은 출생보다도 ‘먼저 존재했느냐’로 옮겨 시간적 선재성을 강조했습니다.
  alternative_readings:
  - 산고 속에 나오게 되었느냐
  - 낳아졌느냐
  - 태어났느냐
  rationale: 문맥상 핵심은 산고 이미지 자체보다 ‘산들보다 먼저’라는 선재성 대조이므로, 한국어에서는 반복을 줄이되 원문의 논지를 훼손하지 않는 방향을 택했습니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
