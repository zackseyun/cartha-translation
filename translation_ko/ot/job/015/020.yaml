source:
  edition: WLC
  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
  footnotes:
  - marker: a
    text: Or 'is in anguish'; the Hebrew verb can convey writhing, trembling, or travail-like anguish.
    reason: lexical_alternative
  - marker: b
    text: Or 'are hidden away' or 'are reserved' for the ruthless.
    reason: lexical_alternative
  - marker: c
    text: '''The wicked man'' is grammatically masculine singular in Hebrew and represents the wicked person as a type.'
    reason: cultural_note
translation:
  language: ko
  text: 악한 사람은 온 생애 동안 몸부림치고, 폭력적인 자를 위해서는 몇 해가 저장되어 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고통 속에 있다’입니다. 히브리어 동사는 몸부림치다, 떨다, 산고와 같은 고통을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숨겨져 있다’, ‘예비되어 있다’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘악한 사람’은 히브리어에서 남성 단수로 되어 있으나, 한 유형의 악인을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי
  english_pob_choice: All the days of
  chosen_korean: 온 생애 동안
  alternatives_korean:
  - 그의 모든 날 동안
  - 악인의 모든 날 동안
  lexicon: HALOT
  rationale: 총체적인 시간 표현을 자연스러운 한국어로 옮기면서, ‘모든 날’의 전체성도 유지했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 악한 자
  lexicon: HALOT
  rationale: 히브리어의 단수 유형적 표현을 살리되, 한국어에서 남성성보다 성격을 드러내는 표현이 더 자연스러워 ‘악한 사람’으로 옮겼습니다.
- source_word: מִתְחוֹלֵל
  english_pob_choice: writhes in torment
  chosen_korean: 몸부림치고
  alternatives_korean:
  - 괴로워하고
  - 고통 가운데 뒤틀리고
  - 몸서리치고
  lexicon: HALOT
  rationale: 어근의 뒤틀림, 몸부림, 고통스러운 동작을 반영하되 과도한 해석어를 줄여 현재분사적 지속성을 살렸습니다.
- source_word: נִצְפְּנוּ לֶעָרִיץ
  english_pob_choice: are stored up for the ruthless
  chosen_korean: 폭력적인 자를 위해서는 몇 해가 저장되어 있습니다
  alternatives_korean:
  - 포악한 자를 위해서는 몇 해가 간직되어 있습니다
  - 무자비한 자에게는 몇 해가 마련되어 있습니다
  - 포학한 자를 위해서는 몇 해가 숨겨져 있습니다
  lexicon: HALOT
  rationale: נִצְפְּנוּ의 ‘숨겨져/저장되어/예비되어’ 의미를 살려, 문맥상 정해졌지만 아직 오지 않은 기간이라는 점을 반영했습니다.
theological_decisions:
- issue: עָרִיץ의 성격 표현
  chosen_reading: ‘폭력적인 자’로 옮겨, 권력형 ‘폭군’보다 폭력성과 가혹함을 넓게 드러냈습니다.
  alternative_readings:
  - 폭군
  - 포악한 자
  - 무자비한 자
  rationale: 지혜문맥에서 עָרִיץ는 정치적 직함보다 폭력적·가혹한 성격을 가리키므로, 과도한 구체화를 피했습니다.
  doctrine_reference: 지혜문학의 일반적 악인 묘사
