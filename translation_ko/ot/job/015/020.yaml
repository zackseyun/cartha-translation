base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
  footnotes:
  - marker: a
    text: Or 'is in anguish'; the Hebrew verb can convey writhing, trembling, or travail-like anguish.
    reason: lexical_alternative
  - marker: b
    text: Or 'are hidden away' or 'are reserved' for the ruthless.
    reason: lexical_alternative
  - marker: c
    text: '''The wicked man'' is grammatically masculine singular in Hebrew and represents the wicked person as a type.'
    reason: cultural_note
translation:
  language: ko
  text: 악한 사람[c]은 온 생애 동안 몸부림치며[a], 포악한 자를 위하여 몇 해가 감추어져 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고통 속에 있다’입니다. 히브리어 동사는 몸부림치다, 떨다, 또는 산고와 같은 고통을 겪다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘간직되어 있다’ 또는 ‘예비되어 있다’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘악한 사람’은 히브리어에서 문법적으로 남성 단수이나, 악한 사람을 한 유형으로 가리킵니다.
    reason: cultural_note
