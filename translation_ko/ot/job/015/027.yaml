  - 추상적으로 ‘번영’으로 바꾸기
  rationale: 문맥은 단순 외양이 아니라 오만과 방종의 결과를 몸의 이미지로 드러내므로, 시적 공격성을 약화하지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 욥기 15장 문맥상 엘리바스의 악인 묘사
