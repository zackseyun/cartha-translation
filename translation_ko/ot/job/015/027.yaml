  lexicon: HALOT
  rationale: כסה는 ‘덮다/가리다’의 구체적 이미지를 가지며, ‘자기 얼굴’을 그대로 살려 신체적 은유를 유지했습니다.
- source_word: בְּחֶלְבּוֹ
  english_pob_choice: with his fat
  chosen_korean: 자기 기름으로
  alternatives_korean:
