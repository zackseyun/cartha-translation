  chosen_korean: 허리에는 살진 살덩이를 두르었습니다
  alternatives_korean:
  - 허리 위에 살집을 얹었습니다
  - 옆구리에는 살덩이를 만들었습니다
  lexicon: HALOT
  rationale: פִּימָה와 כָסֶל은 희귀하고 신체적 축적 이미지를 띠므로, ‘살진 살덩이’와 ‘허리’로 번역해 비유적 과장을 자연스럽게 전달했습니다.
theological_decisions:
