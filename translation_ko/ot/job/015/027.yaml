lexical_decisions:
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: -고
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 앞절의 진술을 이어 주는 설명적 접속으로 기능하므로, 한국어에서는 자연스러운 연결 어미로 이유 관계를 살렸습니다.
- source_word: כִסָּה פָנָיו
  english_pob_choice: has covered his face
  chosen_korean: 자기 얼굴을 … 가렸고
  alternatives_korean:
