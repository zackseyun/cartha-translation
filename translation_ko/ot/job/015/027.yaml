  - 자기 살로
  lexicon: HALOT
  rationale: חֵלֶב은 문맥상 육체적 비만과 자만을 드러내는 ‘기름/지방’의 이미지이므로, 한국어의 ‘기름’으로 구체성과 비유성을 함께 살렸습니다.
- source_word: פִּימָה עֲלֵי כָסֶל
