  source_fidelity: 원문의 כִּי는 앞 절의 진술에 대한 이유를 제시하므로, 초안의 단순 연결형 ‘-고’만으로는 인과 관계가 충분히 드러나지 않습니다. 또한 וַיַּעַשׂ는 ‘두르다’보다 ‘만들다/생기게 하다’에 가깝습니다. 희귀어 פִּימָה는 문맥상 옆구리의 살집 또는 지방의 주름을 가리키는 것으로 보이며, 단정적인 과도한 해석은 피하는 것이 좋습니다.
  naturalness: ‘자기 기름’과 ‘살진 살덩이’는 현대 표준어에서 다소 부자연스럽고 중복적으로 들립니다. ‘지방’, ‘살집’, ‘옆구리’를 사용하면 신체적 이미지를 유지하면서도 자연스럽습니다. ‘이는 … 때문입니다’는 합쇼체에서 앞 절에 종속되는 이유를 분명하게 나타냅니다.
  terminology: חֵלֶב은 이 문맥에서 식용유가 아니라 몸의 지방을 뜻하므로 ‘지방’이 적절합니다. כֶּסֶל은 ‘허리’보다 ‘옆구리/허리께’에 가까우므로 ‘옆구리’로 옮깁니다. פִּימָה의 정확한 뉘앙스는 불확실하므로 본문은 ‘살집’으로, ‘지방의 주름’은 각주 대안으로 보존합니다.
