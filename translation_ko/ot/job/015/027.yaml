  chosen_reading: 이 절은 도덕적 타락과 자기 만족을 신체적 과장으로 묘사하는 시적 표현으로 보아, 의역하되 비하적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 단순한 체형 묘사로 중화하기
  - 추상적으로 ‘번영’으로 바꾸기
  rationale: 문맥은 단순 외양이 아니라 오만과 방종의 결과를 몸의 이미지로 드러내므로, 시적 공격성을 약화하지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 욥기 15장 문맥상 엘리바스의 악인 묘사
