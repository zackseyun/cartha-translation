id: JOB.35.13
reference: Job 35:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
  footnotes:
  - marker: a
    text: Or 'vanity,' 'falsehood,' or 'worthlessness.' The Hebrew term can describe what is empty, futile, or deceptive.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 하나님은 헛된 것을 들으시지 않으시며, 전능자께서는 그것을 돌아보지 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 것’은 히브리어 שָׁוְא를 넓게 옮긴 말입니다. 이 말은 ‘헛됨’, ‘거짓’, ‘무가치함’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 분명히
  - 오직
  - 진실로
  lexicon: HALOT
  rationale: אַךְ는 여기서 단순한 제한이 아니라 단언적 강조를 나타내므로, 한국어에서는 자연스러운 확인·강조 부사인 ‘참으로’가 적절합니다.
- source_word: שָׁוְא
  english_pob_choice: emptiness
  chosen_korean: 공허함
  alternatives_korean:
  - 헛됨
  - 허무
  - 거짓
  - 무가치함
  lexicon: HALOT
  rationale: שָׁוְא의 핵심 의미인 비어 있음, 헛됨, 실체 없음의 뉘앙스를 살리기 위해 ‘공허함’을 선택했습니다. ‘거짓’으로 좁히면 의미가 과도하게 특정됩니다.
- source_word: יִשְׁמַע
  english_pob_choice: does not hear
  chosen_korean: 들으시지 않으시며
  alternatives_korean:
  - 듣지 않으시며
  - 들으시지 않으며
  - 귀를 기울이지 않으시며
  lexicon: HALOT
  rationale: שׁמע의 기본 의미를 따라 ‘듣다’로 옮기되, 하나님을 주어로 한 문맥에 맞게 존칭 종결을 사용했습니다. ‘귀를 기울이다’는 해석적 색채가 더 강합니다.
- source_word: יְשׁוּרֶנָּה
  english_pob_choice: does not regard it
  chosen_korean: 살피지 않으십니다
  alternatives_korean:
  - 바라보지 않으십니다
  - 주시하지 않으십니다
  - 주의하지 않으십니다
  lexicon: HALOT
  rationale: שׁור는 단순한 시선보다 ‘살피다, 주의하여 보다’의 뜻이 있어, 앞의 ‘들으시다’와 평행을 이루는 ‘살피다’로 옮겼습니다. 대상이 ‘공허함’이라는 추상명사임도 자연스럽게 반영합니다.
theological_decisions:
- issue: אל / שַׁדַּי의 신칭 처리
  chosen_reading: ‘하나님’과 ‘전능자’로 각각 자연스럽게 옮겨, 두 호칭의 병렬을 유지했습니다.
  alternative_readings:
  - ‘하나님’과 ‘전능하신 분’
  - ‘엘’과 ‘샷다이’로 음역
  rationale: 히브리어 본문의 두 신칭은 병렬 강조를 이루므로, 하나는 일반적인 ‘하나님’, 다른 하나는 욥기에서 통용되는 ‘전능자’로 번역해 의미와 문체를 함께 살렸습니다.
  doctrine_reference: Job 35:13의 병렬 신칭 보존
- issue: שָׁוְא의 신학적 범위
  chosen_reading: 이 절은 하나님이 ‘공허하고 헛된 것’을 듣지 않으신다는 뜻으로, 무조건적인 기도 불응 선언으로 좁히지 않습니다.
  alternative_readings:
  - 하나님은 거짓된 말을 듣지 않으신다
  - 하나님은 헛된 부르짖음을 들으시지 않는다
  rationale: 본문은 하나님의 전지성을 부정하는 것이 아니라, 하나님이 어떤 종류의 호소를 받지 않으시는지를 말합니다. 그래서 ‘공허함’이라는 넓은 표현으로 본문의 긴장과 범위를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
