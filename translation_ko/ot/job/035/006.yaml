  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
  footnotes:
  - marker: a
    text: Or, more literally, 'what do you do to him?' in the first clause as well. The Hebrew verb can mean simply 'do' or 'effect'; the translation 'accomplish against him' brings out the rhetorical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 죄를 지으면 그에게 무엇을 이루겠습니까?[a] 네 범죄가 많아도 그에게 무엇을 하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무엇을 이루겠습니까?’에 해당하는 히브리어는 문자적으로 ‘그에게 무엇을 하겠느냐’라고도 옮길 수 있습니다. 이 동사는 단순히 ‘하다’ 또는 ‘효과를 내다/이루다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם / חָטָאתָ
  english_pob_choice: If you sin
  chosen_korean: 네가 죄를 지어도
  alternatives_korean:
  - 네가 죄를 지으면
  - 네가 죄를 범하면
  lexicon: HALOT
  rationale: 조건문의 가정적 뉘앙스를 살리면서, 현대 한국어에서는 ‘죄를 지어도’가 자연스럽고 문맥상 반어적 질문의 힘도 잘 드러냅니다.
- source_word: מַה תִּפְעָל בּוֹ
  english_pob_choice: what do you accomplish against him
  chosen_korean: 그것이 그에게 무슨 유익이 있겠습니까?
  alternatives_korean:
  - 그에게 무엇을 이루겠습니까?
  - 그에게 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: פעל은 단순한 ‘하다’보다 ‘이루다/효과를 내다’의 뜻이 있어, 인간의 죄가 하나님께 아무런 실질적 손해나 성과도 내지 못한다는 반어를 한국어 관용으로 풀어 옮겼습니다.
- source_word: פְשָׁעֶיךָ
  english_pob_choice: your transgressions
  chosen_korean: 네 허물
  alternatives_korean:
  - 네 죄악
  - 네 반역들
  - 네 범죄들
  lexicon: HALOT
  rationale: פשע는 ‘반역/범죄’의 강한 뉘앙스가 있지만, 한국어에서는 다음 절의 수를 강조하는 흐름에서 ‘허물’이 지나치게 약하지 않으면서도 자연스럽습니다.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  english_pob_choice: what do you do to him
  chosen_korean: 네가 그에게 무엇을 하겠습니까?
  alternatives_korean:
  - 네가 그에게 무엇을 행하겠습니까?
  - 네가 그에게 무엇을 할 수 있겠습니까?
  lexicon: HALOT
  rationale: 두 번째 수사 의문은 더 직역에 가깝게 유지해, 첫 절의 의미를 보완하는 평행 구조를 살렸습니다.
theological_decisions:
- issue: 인간의 죄가 하나님께 미치는 영향의 범위
  chosen_reading: 이 구절은 인간의 죄가 하나님을 궁극적으로 해치거나 약화시키지 못한다는 뜻을 강조합니다.
  alternative_readings:
  - 인간의 죄는 하나님과 아무 관련도 없다는 식의 더 강한 진술
  - 단순히 ‘무엇을 하겠느냐’로만 중립적으로 옮기는 방식
  rationale: 엘리후의 논지는 하나님의 초월성과 자족성을 드러내는 것이지, 죄의 도덕적 의미를 지워버리는 것이 아닙니다. 그래서 첫 절은 ‘유익’이라는 결과 중심 표현으로 반어를 분명히 하되, 둘째 절은 보다 직역적으로 두어 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
