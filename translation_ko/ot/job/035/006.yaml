    rationale: 원문은 죄인이 하나님을 상대로 무엇을 행하거나 효과를 낼 수 있는지를 묻습니다. ‘유익’은 하나님이 죄로부터 이득을 얻는다는 방향의 질문처럼 들릴 수 있어, 원문의 부정적/대항적 수사적 방향을 충분히 보존하지 못합니다.
