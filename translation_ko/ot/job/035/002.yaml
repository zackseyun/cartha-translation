base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
  footnotes:
  - marker: a
    text: Or, 'My righteousness is before God,' or 'My right is from God.' The Hebrew is compressed, and the relation of 'my righteousness' to 'God' is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 이것이 옳다고 생각하십니까? 당신은 ‘내 의가 하나님의 의보다 더 큽니다’[a]라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 의가 하나님 앞에 있습니다’, 혹은 ‘내 권리는 하나님에게서 옵니다’. 히브리어는 매우 압축되어 있어, ‘내 의’와 ‘하나님’의 관계에 대해서는 해석이 엇갈립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  english_pob_choice: Do you think this
  chosen_korean: 이것이 옳다고 생각하십니까?
  alternatives_korean:
  - 이것을 생각하십니까?
  - 이것이 그렇다고 보십니까?
  lexicon: HALOT
  rationale: 히브리어의 반문형 질문을 한국어에서 자연스러운 반문으로 옮기되, לְמִשְׁפָּט의 평가적 의미를 살려 ‘옳다’로 풀었습니다.
- source_word: לְמִשְׁפָּט
  english_pob_choice: is just
  chosen_korean: 옳다고
  alternatives_korean:
  - 공의롭다고
  - 정당하다고
  - 정의롭다고
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법적·도덕적 판단의 적절함을 가리키므로, 문맥상 가장 자연스러운 ‘옳다’로 번역했습니다.
- source_word: אָמַרְתָּ
  english_pob_choice: you say
  chosen_korean: 당신은 말합니다
  alternatives_korean:
  - 당신은 말하셨습니다
  - 말합니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 현재적 발화를 소개하므로, 항의의 생생한 현장감을 살려 현재형으로 옮겼습니다.
- source_word: צִדְקִי מֵאֵל
  english_pob_choice: My righteousness is greater than God’s
  chosen_korean: 내 의가 하나님보다 더 큽니다
  alternatives_korean:
  - 내 의가 하나님 앞에 있습니다
  - 내 권리가 하나님에게서 옵니다
  lexicon: HALOT
  rationale: 비교적 מִן의 의미를 따라 ‘~보다 더’로 처리했고, צֶדֶק 계열은 문맥상 ‘의’가 가장 직접적입니다. 영어 POB의 각주처럼 히브리어가 압축되어 있어 다른 가능성도 열어 두었습니다.
theological_decisions:
- issue: אָמַרְתָּ의 발화 시점
  chosen_reading: Elihu가 욥의 말을 현재적으로 재현하며 비난하는 장면으로 읽습니다.
  alternative_readings:
  - 단순 과거 보고로 읽음
  - 인용된 말 전체를 과거시제로 통일함
  rationale: 이 절은 직접 인용을 끌어오며 책망의 논지를 전개하므로, 한국어에서도 현재형 인용을 사용해 수사적 긴장을 유지했습니다.
  doctrine_reference: 문맥 중심의 담화 재현
