source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
  footnotes:
  - marker: a
    text: Or 'the arrogance of evil men.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not explicitly name the subject of 'does not answer'; context implies God.
    reason: alternative_reading
translation:
  language: ko
  text: 거기서 그들은 부르짖지만[a] 그분은 응답하지 않으십니다[b]. 그것은 악인들의 교만 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인들의 오만’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘응답하지 않다’의 주어를 직접 밝히지 않지만, 문맥상 하나님을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 그때
  lexicon: HALOT
  rationale: 문맥상 앞서 말한 상황을 가리키는 장소 부사이므로, 시간 부사로 옮기기보다 ‘거기서’로 좇는 것이 원문에 가깝습니다.
- source_word: יִצְעֲקוּ
  english_pob_choice: they cry out
  chosen_korean: 부르짖지만
  alternatives_korean:
  - 외치지만
  - 소리치지만
  lexicon: HALOT
  rationale: צעק는 곤경 속의 간절한 외침을 뜻하므로, 한국어에서는 ‘부르짖다’가 절박함을 가장 잘 살립니다.
- source_word: יַעֲנֶה
  english_pob_choice: he does not answer
  chosen_korean: 응답하지 않으십니다
  alternatives_korean:
  - 대답하지 않으십니다
  - 응답하지 않습니다
  lexicon: HALOT
  rationale: 히브리어는 주어를 명시하지 않지만 문맥상 하나님을 가리키므로, 존대 표현을 쓰되 원문이 암시하는 대상만 드러내도록 했습니다.
- source_word: גְּאוֹן רָעִים
  english_pob_choice: the pride of evil men
  chosen_korean: 악인들의 교만
  alternatives_korean:
  - 악한 사람들의 교만
  - 악인들의 오만
  lexicon: HALOT
  rationale: גאון은 여기서 부정적 의미의 ‘교만’이며, רָעִים은 악한 사람들을 가리키므로 POB의 의미를 따라 ‘악인들’로 옮겼습니다.
theological_decisions:
- issue: יַעֲנֶה의 암시적 주어
  chosen_reading: ‘그분’이라고 하여 문맥상 하나님을 가리키되, 히브리어가 직접 명시하지 않는 점은 유지했습니다.
  alternative_readings:
  - ‘그는 응답하지 않으십니다’
  - ‘하나님께서 응답하지 않으십니다’
  rationale: 본문은 응답하지 않는 주어를 명시하지 않지만, 전체 문맥은 하나님을 가리킵니다. 따라서 한국어에서는 존칭을 사용하되, 원문의 절제도 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
