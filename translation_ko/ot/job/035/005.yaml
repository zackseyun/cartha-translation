  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: ko
  text: 하늘을 바라보고 보십시오. 구름을 주시하십시오 — 그것들이 당신보다 더 높습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘하늘’은 여기서 단수형이지만, 히브리어 샤마임은 형식상 복수형입니다. 한국어에서는 자연스러운 표준 표현인 ‘하늘’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הַבֵּ֣ט ... וּ/רְאֵ֑ה
  english_pob_choice: Look at ... and see
  chosen_korean: 바라보고 보십시오
  alternatives_korean:
  - 쳐다보고 보십시오
  - 살펴보십시오
  lexicon: הבט / ראה
  rationale: 두 명령형을 분리해 ‘바라보다’와 ‘보다’를 함께 살려, 단순한 시선 이동이 아니라 주의를 기울여 확인하라는 뉘앙스를 반영했습니다.
- source_word: שָׁמַ֣יִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘들 위의 곳
  lexicon: שמים
  rationale: 여기서는 천체적·우주적 배경의 ‘하늘’이 자연스럽고, 한국어에서도 ‘하늘’을 통해 원문의 광범위한 상공 이미지를 충분히 전달할 수 있습니다.
- source_word: שְׁ֝חָקִ֗ים
  english_pob_choice: the clouds
  chosen_korean: 구름
  alternatives_korean:
  - 구름들
  - 창공의 구름
  lexicon: שחקים
  rationale: 시적 병행에서 상공의 대상을 가리키는 표현으로 ‘구름’이 가장 सीधे이며, POB의 ‘clouds’ 선택을 그대로 반영했습니다.
- source_word: גָּבְה֥וּ מִמֶּֽ/ךָּ
  english_pob_choice: they are higher than you
  chosen_korean: 그것들이 당신보다 더 높습니다
  alternatives_korean:
  - 그것들이 당신보다 높습니다
  - 그것들이 네보다 더 높습니다
  lexicon: גבה + מן
  rationale: 비교 구문을 직역해 높이의 차이를 분명히 드러냈고, 문맥상 일반적 설교체보다 직접적인 2인칭을 택했습니다.
