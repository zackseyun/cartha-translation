id: JOB.35.14
reference: Job 35:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
  footnotes:
  - marker: a
    text: Or, more literally, 'and writhe before him'; the Hebrew verb is difficult, and many understand it here as 'wait expectantly for him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 당신이 말할 때, ‘그를 보지 못한다’고 하지 않습니까? 사건은 그 앞에 있으며, 당신은 그를 기다려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그 앞에서 몸부림치며’; 히브리어 동사는 난해하며, 많은 이들은 여기서 ‘기대하며 기다리다’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: How much less when
  chosen_korean: 아, 당신이 말할 때
  alternatives_korean:
  - 하물며 당신이 말할 때
  - 더구나 당신이 말할 때
  - 그런데 당신이 말할 때
  lexicon: HALOT
  rationale: 앞 절의 논지를 이어 받아 ‘하물며/더구나’의 추론적·강조적 힘을 살리되, 한국어에서는 자연스러운 도치형 도입으로 옮겼습니다.
- source_word: תֹאמַר
  english_pob_choice: you say
  chosen_korean: 당신이 말할 때
  alternatives_korean:
  - 당신이 말하면
  - 당신이 말합니다
  - 당신이 말하실 때
  lexicon: HALOT
  rationale: 욥에게 직접 말하는 2인칭 단수의 단순 발화 동사이므로, 과도한 의역 없이 ‘말할 때’로 옮겼습니다.
- source_word: לֹא תְשׁוּרֶנּוּ
  english_pob_choice: You do not see him
  chosen_korean: 그를 보지 못한다
  alternatives_korean:
  - 그를 보지 않습니다
  - 그를 바라보지 못한다
  - 그를 알아보지 못한다
  lexicon: HALOT
  rationale: שׁוּר는 ‘보다/바라보다/살피다’의 뜻이므로, 욥의 하소연처럼 ‘그를 보지 못한다’로 옮겨 하나님의 비가시성을 드러냈습니다.
- source_word: דִּין לְפָנָיו
  english_pob_choice: the case is before him
  chosen_korean: 사건은 그 앞에 있으며
  alternatives_korean:
  - 그의 앞에 그 사건이 있으며
  - 그의 앞에 재판 사건이 있으며
  - 그 앞에 그 소송이 있으며
  lexicon: HALOT
  rationale: דִּין은 추상적 ‘정의’보다 법정적 ‘사건/송사’의 의미가 강하므로, 현대 한국어 독자에게 자연스러운 ‘사건’으로 옮겨 재판 맥락을 보존했습니다.
- source_word: וּתְחוֹלֵל לוֹ
  english_pob_choice: and you must wait for him
  chosen_korean: 그를 기다려야 합니다
  alternatives_korean:
  - 그 앞에서 몸부림쳐야 합니다
  - 그를 애타게 기다려야 합니다
  - 그를 기다리며 버텨야 합니다
  lexicon: HALOT
  rationale: 마지막 동사는 난해하므로 문맥상 권면의 흐름을 따라 ‘기다리다’로 옮겼고, 과도한 감정어는 덜어 원문의 긴장을 유지했습니다.
theological_decisions:
- issue: 욥이 하나님을 ‘보지 못한다’는 표현의 방향
  chosen_reading: 이 절은 하나님이 사건을 보지 못한다는 뜻이 아니라, 욥이 하나님을 보지 못한다고 말하는 상황으로 읽습니다.
  alternative_readings:
  - 하나님이 사건을 보지 못한다
  - 욥이 하나님의 응답을 보지 못한다
  rationale: 문맥상 엘리후는 하나님의 무지함이 아니라 하나님의 현재적 비가시성과 욥의 인내를 논합니다. 따라서 주어의 방향을 뒤집지 않고 원문의 긴장을 살렸습니다.
  doctrine_reference: 본문 문맥 우선; 하나님의 인식과 न्याय에 대한 성경적 전제 유지
- issue: וּתְחוֹלֵל לוֹ의 처리
  chosen_reading: 본문에는 ‘기다리다’라는 해석을 본문 번역에 두고, 문자적으로는 더 난해한 가능성을 각주로 남깁니다.
  alternative_readings:
  - 그 앞에서 몸부림치다
  - 그 앞에서 뒤틀리다
  - 희망하며 기다리다
  rationale: 히브리어 어근 חול의 용례가 난해하므로, 본문 흐름에 가장 잘 맞는 해석을 채택하되 대안적 직역 가능성도 독자가 추적할 수 있게 했습니다.
  doctrine_reference: 난해한 동사는 문맥상 가장 그럴듯한 의미를 본문에, 더 문자적인 가능성은 각주에 보존
