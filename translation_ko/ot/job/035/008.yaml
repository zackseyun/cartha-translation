source:
  edition: WLC
  text: לְ/אִישׁ כָּמ֥וֹ/ךָ רִשְׁעֶ֑/ךָ וּ/לְ/בֶן אָ֝דָ֗ם צִדְקָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
  footnotes:
  - marker: a
    text: Or 'a human being.' Hebrew 'a son of man,' a common idiom here for a mortal person, not a messianic title.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 악은 당신과 같은 한 사람에게, 당신의 의는 한 인자에게 미칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 여기서 메시아 칭호가 아니라, 평범한 사람을 가리키는 히브리어 관용구입니다.
    reason: theological_note
lexical_decisions:
- source_word: לְאִישׁ כָּמוֹךָ
  english_pob_choice: affects a man like yourself
  chosen_korean: 당신과 같은 한 사람에게
  alternatives_korean:
  - 한 사람에게
  - 당신 같은 사람에게
  lexicon: HALOT
  rationale: לְאִישׁ의 방향성은 한국어에서 ‘-에게’로 자연스럽게 드러내고, כָּמוֹךָ는 비교 대상을 분명히 하기 위해 ‘당신과 같은’으로 옮겼습니다.
- source_word: רִשְׁעֶךָ
  english_pob_choice: your wickedness
  chosen_korean: 당신의 악
  alternatives_korean:
  - 당신의 wickedness
  - 당신의 불의
  - 당신의 죄악
  lexicon: HALOT
  rationale: 이 문맥에서 רֶשַׁע는 도덕적 악/악행의 성격이 강하므로, 한국어로는 지나치게 교회적이거나 추상적인 ‘죄악’보다 직접적인 ‘악’이 원문의 힘을 더 잘 살립니다.
- source_word: וּלְבֶן אָדָם
  english_pob_choice: and ... a son of man
  chosen_korean: 한 인자에게
  alternatives_korean:
  - 한 사람에게
  - 한 인자
  - 한 인간에게
  lexicon: HALOT
  rationale: בֶּן־אָדָם은 여기서 메시아 칭호가 아니라 평범한 인간을 가리키는 관용구이므로, 본문 이미지를 보존하는 ‘인자’로 옮기되 문맥상 수신처를 ‘-에게’로 밝혔습니다.
- source_word: צִדְקָתֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 정의
  - 당신의 옳음
  - 당신의 공의
  lexicon: HALOT
  rationale: צְדָקָה는 여기서 악과 평행을 이루는 윤리적 ‘의’이므로, 한국어 성경의 표준 용례에 따라 ‘의’를 선택했습니다.
theological_decisions:
- issue: בֶּן אָדָם의 의미와 기독론적 오독 가능성
  chosen_reading: 본문의 ‘인자’는 사람을 뜻하는 관용구로 유지하고, 메시아 칭호로 읽지 않습니다.
  alternative_readings:
  - 한 인간
  - 인자(메시아 칭호)
  rationale: 욥기 35:8의 병행구가 ‘당신과 같은 한 사람’이기 때문에, 여기서 בֶּן־אָדָם은 일반 인간을 가리키는 표현입니다. 본문 이미지를 살리면서도 기독론적 과잉독해를 피하는 것이 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
