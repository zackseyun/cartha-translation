source:
  edition: WLC
  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
  footnotes:
  - marker: a
    text: Hebrew 'my makers' (plural form), a plural used here for the one God; hence 'my Maker.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아무도 ‘나를 지으신 하나님, 곧 밤에 노래를 주시는 분은 어디에 계십니까?’라고 말하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֹשָׂי는 형태상 ‘나의 창조자들’처럼 복수형이지만, 여기서는 한 분 하나님을 가리키므로 본문에는 단수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמַר
  english_pob_choice: But no one says
  chosen_korean: 그러나 아무도 …라고 말하지 않습니다
  alternatives_korean:
  - 그러나 말하는 사람이 없습니다
  - 그런데 아무도 …라고 말하지 않습니다
  lexicon: HALOT
  rationale: 부정과 대조의 흐름을 살리기 위해 ‘그러나’로 시작하고, 히브리어의 일반적 진술을 현대 한국어에 자연스럽게 맞는 ‘아무도 …라고 말하지 않습니다’로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 이 단어는 욥기에서 단일한 신적 호칭이므로, 프로젝트 기본어에 따라 ‘하나님’으로 옮기는 것이 가장 सीधे합니다.
- source_word: עֹשָׂי
  english_pob_choice: my Maker
  chosen_korean: 나를 지으신
  alternatives_korean:
  - 나의 창조자이신
  - 나를 만드신
  lexicon: HALOT
  rationale: 히브리어 형태는 복수형이지만 대상은 한 분 하나님이므로, 본문 의미에 맞게 관계절로 풀어 ‘나를 지으신’으로 옮기고, 복수 형태의 긴장은 본문 주석으로 보존할 수 있습니다.
- source_word: נֹתֵן זְמִרוֹת
  english_pob_choice: who gives songs
  chosen_korean: 노래를 주시는 분이십니까
  alternatives_korean:
  - 찬양을 주시는 분이십니까
  - 노래를 베푸시는 분이십니까
  lexicon: HALOT
  rationale: ‘זְמִרוֹת’의 기본 의미를 과도하게 확장하지 않고 ‘노래’로 옮겼으며, 분사 구조는 한국어에서 자연스러운 ‘주시는 분’으로 처리했습니다.
- source_word: בַּלָּיְלָה
  english_pob_choice: in the night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤중에
  lexicon: HALOT
  rationale: 시적 어감을 해치지 않으면서도 한국어에서는 ‘밤에’가 가장 자연스럽고 간결합니다.
theological_decisions:
- issue: עֹשָׂי의 복수형과 단수 지시 대상
  chosen_reading: 형태상 복수이지만 의미상 ‘나를 지으신’이라는 단수적 하나님을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - 형태를 따라 ‘나를 지으신 분들’로 직역
  rationale: 히브리어의 형태적 긴장을 지우지 않되, 한국어 본문에서는 다신론적 오해를 피하면서도 원문의 지시 대상을 정확히 드러내는 것이 적절합니다.
  doctrine_reference: 원문 우선 번역; 신적 복수형의 형태적 긴장 보존
