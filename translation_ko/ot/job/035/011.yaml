  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
  footnotes:
  - marker: a
    text: Or, 'who teaches us from the beasts of the earth and makes us wise from the birds of the heavens.' The Hebrew preposition can also be read as indicating source rather than comparison.
