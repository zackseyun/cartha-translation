translation:
  language: ko
  text: 땅의 짐승들보다 더 우리를 가르치시고, 하늘의 새들보다 더 우리를 지혜롭게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 짐승들로부터 우리를 가르치시고, 하늘의 새들로부터 우리를 지혜롭게 하십니다.’ 히브리어 전치사 מ는 비교뿐 아니라 출처를 나타낼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  english_pob_choice: teaches us
  chosen_korean: 우리를 가르치시고
  alternatives_korean:
  - 우리를 훈련시키시고
  - 우리를 가르쳐 주시고
  lexicon: HALOT
  rationale: פּעל형 분사로서 지속적·능동적 교육 행위를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘가르치시고’로 옮겼습니다.
- source_word: מִבַּהֲמוֹת אָ֑רֶץ
  english_pob_choice: more than the beasts of the earth
  chosen_korean: 땅의 짐승들보다 더
  alternatives_korean:
  - 땅의 짐승들에게서
  - 땅의 짐승들로부터
  lexicon: HALOT
  rationale: 문맥의 병행법이 비교를 요구하므로, מקור/도구보다 비교의 뜻을 살려 ‘보다 더’로 옮겼습니다.
- source_word: וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם
  english_pob_choice: than the birds of the heavens
  chosen_korean: 하늘의 새들보다 더
  alternatives_korean:
  - 하늘의 새들에게서
  - 하늘의 새들로부터
  lexicon: HALOT
  rationale: 앞 절과 같은 비교 구조를 유지하면서, 히브리어의 ‘하늘’ 표현을 살려 시적 높임을 보존했습니다.
- source_word: יְחַכְּמֵֽ/נוּ
  english_pob_choice: makes us wiser
  chosen_korean: 우리를 지혜롭게 하십니다
  alternatives_korean:
  - 우리를 더 지혜롭게 하십니다
  - 우리를 지혜로우게 하십니다
  lexicon: HALOT
  rationale: 힐형/사역적 의미를 한국어로 자연스럽게 드러내는 표현으로, 비교의 결과를 직접 말하는 ‘지혜롭게 하십니다’가 가장 매끄럽습니다.
theological_decisions:
- issue: 'מ의 의미: 비교인가, 출처/수단인가'
  chosen_reading: 하나님이 인간을 짐승과 새보다 더 뛰어나게 가르치고 지혜롭게 하신다는 비교적 의미로 번역했습니다.
  alternative_readings:
  - ‘땅의 짐승들로부터’ ‘하늘의 새들로부터’라는 출처/수단 의미
  rationale: 평행구와 문맥상 인간의 지혜가 동물 세계를 능가한다는 대비가 자연스럽고, 출처 의미는 본문의 직접적 흐름을 약화시키므로 본문이 드러내는 비교를 따랐습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
