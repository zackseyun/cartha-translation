id: JOB.35.15
reference: Job 35:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּי אַ֭יִן פָּקַ֣ד אַפּ֑/וֹ וְ/לֹֽא יָדַ֖ע בַּ/פַּ֣שׁ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/015.yaml
  text: And now[a], because his anger has not punished, and he does not greatly heed transgression[b],
  footnotes:
  - marker: a
    text: Or 'has not visited in his anger'; the Hebrew verb can mean 'visit,' 'attend to,' or 'punish.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'transgression' is uncertain; it may also suggest 'rebellion,' 'insolence,' or 'great offense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 지금, 그의 분노가 벌하지 않았으며, 그가 큰 죄악도 크게 헤아리지 않으십니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 분노 가운데서 벌하지 않았다”로도 옮길 수 있습니다. 히브리어 פָּקַד는 ‘방문하다’, ‘살피다’, ‘벌하다’를 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פַּשׁ는 뜻이 불확실하여 ‘반역’, ‘오만’, ‘큰 죄과’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 지금
  alternatives_korean:
  - 이제
  - 그런즉 지금
  lexicon: HALOT
  rationale: 접속 ו와 시간 부사 עתה의 연결을 자연스럽게 살리면서, 문맥 전환을 과도하게 해석하지 않도록 했습니다.
- source_word: פָּקַד
  english_pob_choice: has punished
  chosen_korean: 벌하지 않았
  alternatives_korean:
  - 찾아오지 않았
  - 방문하지 않았
  - 징벌하지 않았
  lexicon: HALOT
  rationale: פּקד는 '방문하다'부터 '벌하다'까지 넓지만, כאן에서는 심판적 개입의 뜻이 가장 적절하므로 '벌하다'로 옮겼습니다.
- source_word: וְלֹא יָדַע
  english_pob_choice: does not greatly heed
  chosen_korean: 크게 헤아리지 않으십니다
  alternatives_korean:
  - 크게 알아보지 않으십니다
  - 크게 주목하지 않으십니다
  - 크게 여기지 않으십니다
  lexicon: HALOT
  rationale: ידע는 단순 지식보다 '알아차리다/유의하다'의 뜻이 가능하므로, 문맥의 주목·고려의 뉘앙스를 살려 '헤아리다'를 선택했습니다.
- source_word: בַּפַּשׁ מְאֹד
  english_pob_choice: transgression
  chosen_korean: 큰 죄악
  alternatives_korean:
  - 죄과
  - 반역
  - 오만한 죄
  lexicon: HALOT
  rationale: 본문의 פּשׁ는 난해하고 어형도 불확실하므로, POB의 'transgression'에 대응하면서도 문맥상 중대한 잘못을 드러내는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: 어려운 히브리어 절의 주어-목적어 관계와 의미 범위
  chosen_reading: 하나님의 분노가 즉각적인 벌을 내리지 않았고, 큰 죄악도 엄중히 헤아리지 않으신다는 식으로 옮겨, 본문의 판단 진술을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - '''그가 분노 가운데 벌하지 않았다''는 읽기'
  - '''그가 오만함/반역을 크게 알아보지 않으신다''는 읽기'
  rationale: 이 절은 특히 후반부가 난해하므로, 문맥상 엘리후의 발언이 드러내는 긴장을 유지하되 신학적 결론을 덧씌우지 않도록 했습니다.
  doctrine_reference: 난해한 본문은 해석의 긴장을 보존하고 과잉 단정하지 않습니다.
