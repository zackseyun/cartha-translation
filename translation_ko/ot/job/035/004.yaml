translation:
  language: ko
  text: 제가 당신에게 말로 대답하고, 당신의 친구들에게도 당신과 함께 대답하겠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 당신에게 응답하고, 당신의 친구들에게도 당신과 함께 응답하겠습니다.’ 히브리어 동사는 ‘대답하다’ 또는 ‘응답하다’라는 뜻을 가질 수 있습니다. 이 행은 엘리후가 욥에게 대답하면서 그의 친구들에게도 함께 말하는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשִׁיבְךָ
  english_pob_choice: will answer you
  chosen_korean: 제가 당신에게 말로 대답하겠습니다
  alternatives_korean:
  - 제가 당신에게 대답하겠습니다
  - 제가 당신에게 답변하겠습니다
  lexicon: HALOT
  rationale: 히필형 שוב는 여기서 단순한 ‘되돌리다’보다 대답/응답의 뜻이 분명하므로, 문맥의 말하기 행위를 드러내는 ‘말로 대답하겠습니다’로 옮겼습니다.
- source_word: מִלִּין
  english_pob_choice: with words
  chosen_korean: 말로
  alternatives_korean:
  - 말로써
  - 단어들로
  - 말들과 함께
  lexicon: HALOT
  rationale: ‘words’의 구체성을 살리되 한국어에서는 도구적 표현으로 자연스럽게 풀어 ‘말로’라고 했습니다.
- source_word: רֵעֶיךָ
  english_pob_choice: your friends
  chosen_korean: 당신의 친구들
  alternatives_korean:
  - 당신의 동료들
  - 당신의 동반자들
  lexicon: HALOT
  rationale: רֵעַ는 친구, 동료, 동반자를 가리킬 수 있으나, 욥기의 대화 상대들을 가리키는 이 문맥에서는 가장 직접적인 ‘친구들’이 적절합니다.
- source_word: עִמָּךְ
  english_pob_choice: with you
  chosen_korean: 당신과 함께 있는
  alternatives_korean:
  - 당신과 함께
  - 당신 곁에 있는
  lexicon: HALOT
  rationale: 동반 관계를 분명히 하되 한국어 어순에 맞게 ‘당신과 함께 있는’으로 풀어, 뒤의 ‘친구들’이 욥과 함께 서 있는 대상임을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 엘리후가 욥과 친구들을 함께 향해 말하는지 여부
  chosen_reading: 본문은 엘리후가 욥에게 대답하면서 동시에 욥과 함께 있는 친구들도 염두에 두는 말로 읽을 수 있습니다.
  alternative_readings:
  - 욥에게만 말하는 것으로 볼 수 있습니다.
  - 욥과 친구들을 한꺼번에 동일한 대상으로 응답하는 것으로 볼 수 있습니다.
  rationale: 히브리어 문장의 병렬 구조와 영어 POB의 주해를 따라, 화자의 응답 대상이 욥 단독인지 또는 욥과 친구들을 함께 포함하는지의 여지를 닫지 않고 유지했습니다.
  doctrine_reference: 본문 주해/담화 구조
- issue: 동사의 의미를 ‘답하다’로 둘지 ‘말로 대답하다’로 둘지
  chosen_reading: 단순한 응답이 아니라 말로 하는 응답임을 드러내기 위해 ‘말로 대답하겠습니다’로 옮겼습니다.
  alternative_readings:
  - 제가 당신에게 대답하겠습니다.
  - 제가 당신에게 응답하겠습니다.
  rationale: מִלִּין(말들)과 결합된 동사의 구체적 말하기 성격을 보존하려면, 한국어에서도 ‘말로’라는 표지를 두는 편이 원문 긴장을 더 잘 살립니다.
  doctrine_reference: 번역 원리
