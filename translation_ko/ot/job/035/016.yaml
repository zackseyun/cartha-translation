lexical_decisions:
- source_word: וְאִיּוֹב
  english_pob_choice: So Job
  chosen_korean: 그러므로 욥은
  alternatives_korean:
  - 그리고 욥은
  - 그런데 욥은
  lexicon: WLC context
  rationale: 앞 문맥의 결론을 이어 주는 연결어로 보아 ‘그러므로’가 가장 자연스럽고, 주어 ‘욥은’을 분명히 드러냈습니다.
- source_word: הֶבֶל
  english_pob_choice: in vain
  chosen_korean: 공허함을 말하고
  alternatives_korean:
  - 헛되이 입을 열고
  - 허무하게 말하고
  - 헛것을 말하고
  lexicon: HALOT
  rationale: הֶבֶל은 ‘숨/김/헛됨/공허’의 범위를 가지므로, 한국어에서는 추상 명사 ‘공허함’으로 옮겨 발화의 내용이 텅 비어 있음을 드러냈습니다.
- source_word: יִפְצֶה פִּיהוּ
  english_pob_choice: opens his mouth
  chosen_korean: 입을 열어
  alternatives_korean:
  - 입을 벌려
  - 입을 열고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입을 열다’를 직역에 가깝게 살리되, 한국어에서 자연스럽게 읽히도록 동사구로 정리했습니다.
- source_word: בִּבְלִי דַעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이
  alternatives_korean:
  - 지식이 없이
  - 깨달음 없이
  - 이해 없이
  lexicon: HALOT
  rationale: דַעַת을 가장 직접적으로 ‘지식’으로 옮기고, 전치사 בִּבְלִי의 결핍 의미를 간결한 부사구로 표현했습니다.
- source_word: יַכְבִּר־־׃פּ
  english_pob_choice: he multiplies words
  chosen_korean: 말을 많이 늘어놓습니다
  alternatives_korean:
  - 말을 많이 합니다
  - 말을 늘립니다
  - 말을 거듭합니다
  lexicon: HALOT
  rationale: 히필형의 ‘많게 하다/늘리다’ 의미를 살리면서, 한국어에서는 ‘말을 많이 늘어놓다’가 중복적 발화의 뉘앙스를 가장 잘 드러냅니다.
theological_decisions:
- issue: 이 절의 문체는 엘리후의 평가 진술로서 직접 인용이 아니라 서술형 비난입니다.
  chosen_reading: 직설적 평서문으로 옮기되, 성경본문의 비난 강도를 약화하지 않았습니다.
  alternative_readings:
  - 완곡하게 풀어 쓰기
  - 문어적으로 중화하기
  rationale: 원문은 욥의 발화를 ‘공허함/지식 없음’으로 평가하는 판단 진술이므로, 한국어도 같은 평가의 날을 유지해야 합니다.
  doctrine_reference: 본문의 수사적 평가를 보존하는 번역 원칙
