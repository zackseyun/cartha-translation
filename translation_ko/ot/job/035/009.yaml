  to: 억압이 많기 때문에 사람들이 부르짖고, 힘 있는 자들의 팔[a] 때문에[b] 도움을 청합니다.
  rationale: 복수형 רַבִּים을 ‘힘 있는 자들의’로 바로잡고, 도움을 구하는 동사의 간청 의미를 ‘도움을 청합니다’로 명료하게 했습니다. 두 절의 원인 관계와 ‘팔’이라는 히브리어 이미지는 유지했으며, 각주 표지를 해당 표현에 각각 연결했습니다.
