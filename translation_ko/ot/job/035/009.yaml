id: JOB.35.9
reference: Job 35:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
  footnotes:
  - marker: a
    text: Or 'they cry for help from the arm of the mighty.' The Hebrew preposition can be rendered more literally as 'from,' though here it likely expresses the cause of their cry.
    reason: lexical_alternative
  - marker: b
    text: '''Arm'' is a Hebrew image for strength or power.'
    reason: cultural_note
translation:
  language: ko
  text: 억압이 많기 때문에 사람들이 부르짖고, 힘 있는 자들의 팔[a] 때문에[b] 도움을 청합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팔’은 히브리어에서 힘이나 권세를 가리키는 이미지입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 전치사는 더 문자적으로는 ‘~로부터’로 옮길 수 있으나, 여기서는 그들의 부르짖음의 원인을 나타내는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב עֲשׁוּקִים
  english_pob_choice: Because of the multitude of oppressions
  chosen_korean: 억압이 많기 때문에
  alternatives_korean:
  - 압제가 많기 때문에
  - 억압의 많음 때문에
  - 억압의 무리가 많기 때문에
  lexicon: HALOT
  rationale: מֵרֹב은 원인/출처를 나타내는 표현으로 보이며, עֲשׁוּקִים은 ‘억압들’ 또는 ‘압제들’에 해당합니다. 한국어에서는 자연스러운 원인 표현으로 압축해, 의미와 호흡을 모두 살렸습니다.
- source_word: יַזְעִיקוּ
  english_pob_choice: they cry out
  chosen_korean: 그들이 부르짖습니다
  alternatives_korean:
  - 그들이 외칩니다
  - 그들이 큰 소리로 부릅니다
  - 그들이 울부짖습니다
  lexicon: HALOT
  rationale: זעק의 히필은 단순한 말하기보다 절박한 외침을 뜻하므로, ‘부르짖다’가 문맥의 고통과 긴급성을 가장 잘 드러냅니다.
- source_word: יְשַׁוְּעוּ
  english_pob_choice: they call for help
  chosen_korean: 도움을 외칩니다
  alternatives_korean:
  - 도와 달라고 외칩니다
  - 구원을 청합니다
  - 도움을 호소합니다
  lexicon: HALOT
  rationale: שוע는 도움을 구하는 간청이므로, 앞의 ‘부르짖다’와 구별되면서도 평행을 살리는 ‘도움을 외치다’ 계열로 옮겼습니다.
- source_word: מִזְּרֹעַ רַבִּים
  english_pob_choice: because of the arm of the mighty
  chosen_korean: 강한 자의 팔 때문에
  alternatives_korean:
  - 힘센 자의 팔 때문에
  - 권세 있는 자의 팔 때문에
  - 강한 자들의 팔 때문에
  lexicon: HALOT
  rationale: זְרוֹעַ는 문자적으로 ‘팔’이지만 힘/권력의 비유이므로 이미지를 살려 ‘팔’로 유지했습니다. רַבִּים은 단순한 수적 ‘많은’이 아니라 힘 있는 자들을 가리켜 ‘강한 자’로 옮겼습니다.
theological_decisions:
- issue: ‘arm’의 비유를 한국어에서 어떻게 처리할지
  chosen_reading: 문자적 이미지인 ‘팔’을 유지하되, 권력과 폭력의 상징으로 읽히도록 문맥을 구성했습니다.
  alternative_readings:
  - ‘권세’로 풀어 쓰기
  - ‘힘’으로 해석하기
  rationale: 히브리어의 신체 비유를 보존하면 억압의 물리성과 상징성이 함께 전달됩니다. 본문은 단순한 능력이 아니라 타인의 억압적 힘을 말하므로 ‘팔’이 적절합니다.
  doctrine_reference: 시적/비유적 표현 보존 원칙
