review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 מִן 구문은 모두 원인으로 이해할 수 있으며, ‘억압이 많기 때문에’와 ‘… 때문에’는 이를 충실히 반영합니다. 다만 רַבִּים은 복수이므로 ‘강한 자의’보다 ‘힘 있는 자들의’가 원문에 더 맞습니다.
  naturalness: ‘도움을 외칩니다’도 이해되지만 현대 표준 한국어의 격식 있는 문장에서는 ‘도움을 청합니다’가 שׁוע의 간청 의미를 더 자연스럽고 분명하게 전달합니다. 동사의 무표지 복수 주어는 한국어에서 ‘사람들이’로 밝혀 주어도 원문의 불특정성을 훼손하지 않습니다.
  terminology: ‘억압’, ‘부르짖다’, ‘힘 있는 자들’, ‘팔’은 본문의 사회적 억압 및 히브리어의 힘의 이미지를 적절히 보존합니다. ‘팔’의 비유는 각주로 설명합니다.
