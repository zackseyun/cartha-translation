  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
  footnotes:
  - marker: a
    text: Or, “What advantage do you have? What profit do I have more than from my sin?” The Hebrew is terse and may imply a comparison between being righteous and sinning.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 당신이 「무엇이 당신에게 유익합니까? 제가 제 죄로 무슨 이득을 얻습니까?」라고 말하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「무엇이 당신에게 유익합니까? 제가 죄를 지었을 때보다 무슨 이득을 더 얻습니까?」 히브리어는 매우 간결하며, 의로움과 죄를 비교하는 뜻을 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: …때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이므로
  lexicon: HALOT
  rationale: 이유를 제시하는 접속사로서, 앞뒤 논증 흐름을 살리기 위해 종결형 서술로 옮겼습니다.
- source_word: תֹאמַר
  english_pob_choice: you say
  chosen_korean: 당신이 말하기를
  alternatives_korean:
  - 당신이 말씀하시기를
  - 당신이 말합니다
  lexicon: HALOT
  rationale: 욥을 직접 인용하는 형식이므로, 현대 한국어에서 자연스러운 간접화법으로 처리했습니다.
- source_word: יִסְכָּן לָךְ
  english_pob_choice: is it to you
  chosen_korean: 무슨 이익이 있습니까
  alternatives_korean:
  - 당신에게 무슨 유익이 있습니까
  - 당신에게 무슨 도움이 됩니까
  lexicon: HALOT
  rationale: סכן의 ‘유익/도움이 됨’이라는 뜻을 살리되, 반복되는 ‘profit’과 구별되도록 한국어에서는 관용적으로 ‘이익’으로 옮겼습니다.
- source_word: אֹעִיל
  english_pob_choice: profit do I have
  chosen_korean: 무슨 이득을 얻습니까
  alternatives_korean:
  - 제가 무슨 이익을 봅니까
  - 제가 무슨 유익이 있습니까
  lexicon: HALOT
  rationale: ‘유익하다/이득이 되다’의 의미를 현재형 의문문으로 자연스럽게 살렸습니다.
- source_word: מֵחַטָּאתִי
  english_pob_choice: from my sin
  chosen_korean: 제 죄로부터
  alternatives_korean:
  - 제 죄에서
  - 제 죄 때문에
  lexicon: HALOT
  rationale: מִן의 출처/비교 가능성을 열어 두면서, 영어 POB가 유지한 직접적인 표현을 따라 ‘-로부터’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 생략적이고 모호한 비교 가능성
  chosen_reading: 본문의 모호성을 풀어 쓰지 않고, 이익/이득의 병렬을 유지한 채 직역에 가까운 의문형으로 옮겼습니다.
  alternative_readings:
  - 의로운 행위와 죄의 상대적 이익을 더 분명히 드러내는 의역
  - ‘죄보다 더한 이익’이라는 비교를 명시하는 번역
  rationale: 히브리어가 아주 간결하여 비교가 암시될 수 있지만 명시되지는 않으므로, 독자가 원문의 긴장을 보도록 과도한 해석을 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
