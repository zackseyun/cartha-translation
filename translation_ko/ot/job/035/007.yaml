  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
  footnotes:
  - marker: a
    text: 'That is, God: Elihu''s point in context is that human righteousness does not provide gain to God.'
    reason: cross_reference
  - marker: b
    text: Or 'what does he receive from your hand?'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 의롭다면, 그것이 하나님께 무슨 유익을 드리겠습니까? 아니면 무엇을 네 손에서 받으시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 하나님입니다. 문맥상 엘리후의 요지는 인간의 의가 하나님께 이익을 더하지 못한다는 것입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘네 손에서 무엇을 받으시겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם / צָדַקְתָּ
  english_pob_choice: If you are righteous
  chosen_korean: 네가 의롭다면
  alternatives_korean:
  - 네가 의롭다면
  - 네가 의로우면
  - 네가 의로운 사람이라면
  lexicon: HALOT
  rationale: 조건문의 직설성을 살리면서 צדק의 핵심 의미를 ‘의롭다’로 옮겼습니다. ‘의롭다면’이 문맥상 가장 자연스럽고, 행위의 상태를 과도하게 풀어쓰지 않습니다.
- source_word: מַה תִּתֶּן ל֑/וֹ
  english_pob_choice: what do you give to him?
  chosen_korean: 그것이 하나님께 무슨 유익을 드리겠습니까?
  alternatives_korean:
  - 무엇을 그에게 드리겠습니까?
  - 그분께 무엇을 주겠습니까?
  lexicon: HALOT
  rationale: 히브리어는 직역상 ‘무엇을 그에게 주느냐’이지만, 엘리후의 논지는 인간의 의가 하나님께 이익이 되지 않는다는 점입니다. 그래서 ‘무슨 유익을 드리겠습니까’로 소스의 수사적 의미를 드러냈습니다.
- source_word: מִיָּדְךָ יִקָּח
  english_pob_choice: what does he take from your hand?
  chosen_korean: 무엇을 네 손에서 받으시겠습니까?
  alternatives_korean:
  - 무엇을 네 손에서 취하시겠습니까?
  - 네 손에서 무엇을 가져가시겠습니까?
  lexicon: HALOT
  rationale: ‘손에서 받다/취하다’의 관용적 이미지를 살리되, 한국어에서는 ‘받으시겠습니까’가 하나님을 가리키는 존대와 ‘받다’의 결과성을 함께 전하기에 적절합니다. 영어 POB의 대안처럼 ‘receive’ 의미도 함께 반영됩니다.
theological_decisions:
- issue: 대상 대명사 לוֹ / יִקָּח의 지시 대상
  chosen_reading: 본문은 대명사를 직접 풀지 않고, 문맥상 하나님을 가리키는 것으로 읽히지만 한국어 본문도 그 긴장을 크게 바꾸지 않도록 구성했습니다.
  alternative_readings:
  - 그를 ‘사람’으로 모호하게 남김
  - 본문에서 ‘하나님’을 명시적으로 반복함
  rationale: 욥기 35:6-8의 논지상 엘리후는 인간의 의가 하나님께 이익을 더하지 못함을 말합니다. 다만 히브리어의 대명사 지시를 번역이 과도하게 해석하지 않도록 본문은 수사적 질문 형태를 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy.'
