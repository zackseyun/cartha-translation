translation:
  language: ko
  text: 구름의 펼쳐짐[a]과 지식이 완전한 분의 놀라운 일들을 아십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구름의 펼쳐짐’으로 옮긴 히브리어는 희귀어이므로 정확한 뜻이 확실하지 않습니다. 구름이 하늘에 넓게 퍼져 있는 모습, 또는 공중에 떠 있거나 매달려 있는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  english_pob_choice: Do you know
  chosen_korean: 아십니까
  alternatives_korean:
  - 아시나요
  - 알고 계십니까
  lexicon: HALOT
  rationale: 욥에게 던지는 수사 의문문이므로, 현대 합쇼체로 직접적이고 자연스럽게 질문하는 형태를 택했습니다.
- source_word: מִפְלְשֵׂי עָב
  english_pob_choice: the balancing of the clouds
  chosen_korean: 구름의 펼쳐짐
  alternatives_korean:
  - 구름의 균형 잡힘
  - 구름의 퍼짐
  - 구름의 떠받쳐짐
  lexicon: HALOT
  rationale: 희귀어라 정확한 뉘앙스가 불확실하므로, 영어 POB의 주석처럼 ‘spreadings’ 계열의 의미를 살려 구름이 하늘에 펼쳐져 있는 모습을 드러내는 표현으로 옮겼습니다.
- source_word: מִפְלְאוֹת
  english_pob_choice: the wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 경이들
  - 기이한 일들
  - 놀라운 사건들
  lexicon: HALOT
  rationale: פלא의 명사형이 가리키는 초월적·경이로운 현상을 한국어에서 자연스럽게 전달하기 위해 ‘놀라운 일들’로 옮겼습니다.
- source_word: תְּמִים דֵּעִים
  english_pob_choice: one perfect in knowledge
  chosen_korean: 지식이 완전한 이
  alternatives_korean:
  - 지식에 완전한 이
  - 온전한 지식을 가진 이
  - 완전한 지식의 이
  lexicon: HALOT
  rationale: תָּמִים은 여기서 도덕적 ‘흠 없음’보다 완전함을 가리키므로 ‘지식이 완전한’으로 풀고, דֵּעִים의 의미를 ‘지식’으로 압축해 한국어 어순에 맞췄습니다.
theological_decisions:
- issue: ‘지식이 완전한 이’의 지시 대상
  chosen_reading: 본문의 직접 표현을 유지하고, 지시 대상은 문맥상 하나님으로 이해되도록 두었습니다.
  alternative_readings:
  - 하나님을 명시적으로 넣기
  - 지혜로운 사람에 대한 일반 진술로 보기
  rationale: 엘리후의 창조·기상에 대한 논의 흐름상, 이 표현은 하나님을 가리키는 것으로 읽히지만 히브리어의 간접성을 보존하는 편이 더 원문에 가깝습니다.
  doctrine_reference: 문맥에 따른 지시 대상 해석을 유지하고, 본문에 없는 해석어를 덧붙이지 않습니다.
