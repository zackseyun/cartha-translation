lexical_decisions:
- source_word: וַתָּבֹא / Then ... enters
  english_pob_choice: Then ... enters
  chosen_korean: 그러면 ... 들어가고
  alternatives_korean:
  - 그리고 ... 들어가고
  - 그때 ... 들어가고
  - 그리하여 ... 들어가고
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 진행성을 살리되, 한국어에서는 자연스러운 서술 연결인 ‘그러면’으로 앞선 자연 현상 묘사와 이어지게 했습니다.
- source_word: חַיָּה
  english_pob_choice: the wild animal
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생 동물
  - 짐승
  - 들짐승들
  lexicon: HALOT
  rationale: 문맥상 특정 종이 아니라 야생의 동물을 가리키므로, 현대 한국어에서 자연스럽고 성격을 드러내는 ‘들짐승’이 가장 적절합니다.
- source_word: בְמוֹ אָרֶב
  english_pob_choice: its lair
  chosen_korean: 자기 굴
  alternatives_korean:
  - 자기 은신처
  - 자기 숨어 있는 곳
  - 자기 소굴
  lexicon: HALOT
  rationale: ‘가만히 숨어 지내는 장소’라는 뉘앙스를 살리면서 한국어에서 동물의 거처로 가장 자연스러운 ‘굴’을 택했습니다.
- source_word: וּבִמְעֹנֹתֶיהָ
  english_pob_choice: and ... in its dens
  chosen_korean: 자기 은신처들에
  alternatives_korean:
  - 자기 굴들에
  - 자기 거처들에
  - 자기 보금자리들에
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 장소의 반복성과 분산을 드러내기 위해 복수 표현을 유지했습니다. ‘은신처들’은 동물의 숨는 곳이라는 의미를 비교적 직설적으로 전달합니다.
- source_word: תִשְׁכֹּן
  english_pob_choice: remains
  chosen_korean: 머물러 있습니다
  alternatives_korean:
  - 거합니다
  - 살아갑니다
  - 머뭅니다
  lexicon: HALOT
  rationale: 비바람을 피해 들어간 뒤 계속 그곳에 있는 상태를 나타내므로, 정적인 ‘거합니다’보다 진행 중인 상태를 보이는 ‘머물러 있습니다’가 문맥에 더 맞습니다.
