id: JOB.37.13
reference: Job 37:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לְ/שֵׁ֥בֶט אִם לְ/אַרְצ֑/וֹ אִם לְ֝/חֶ֗סֶד יַמְצִאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
  footnotes:
  - marker: a
    text: Or 'for a rod,' that is, for punishment or discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'for mercy' or 'for kindness' for 'steadfast love.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb may also be rendered 'he brings it about' or 'he makes it come.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 징계를 위한 것이든, 그의 땅을 위한 것이든, 또는 인자한 사랑을 위한 것이든, 그분이 그것을 이루십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘막대기를 위한 것’, 곧 형벌이나 징계를 위한 것.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자비를 위한 것’ 또는 ‘인자함을 위한 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 ‘그것을 이루다’ 또는 ‘그것을 가져오다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: whether
  chosen_korean: …이든, …이든, …이든
  alternatives_korean:
  - 만일
  - ~이면
  lexicon: HALOT
  rationale: 반복되는 אִם은 단순 조건문보다 세 갈래의 목적/결과 범주를 나열하는 구조이므로, 한국어에서는 ‘~이든’ 반복으로 분기성을 살렸습니다.
- source_word: לְשֵׁבֶט
  english_pob_choice: for correction
  chosen_korean: 징계를 위한
  alternatives_korean:
  - 막대기를 위한
  - 처벌을 위한
  - 교정을 위한
  lexicon: HALOT
  rationale: שֵׁבֶט의 문자적 의미인 ‘막대기’보다 여기서는 하나님의 통치 아래서의 징계적 기능이 더 분명하므로, 과도한 형벌 이미지를 피하면서도 훈육/징계의 뜻을 살렸습니다.
- source_word: לְאַרְצוֹ
  english_pob_choice: for his land
  chosen_korean: 그의 땅을 위한
  alternatives_korean:
  - 그의 나라를 위한
  - 그의 땅에 대한
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥상 ‘땅/영토’가 자연스러워, 소유격을 반영해 ‘그의 땅’을 택했습니다.
- source_word: לְחֶסֶד
  english_pob_choice: for steadfast love
  chosen_korean: 인자한 사랑을 위한
  alternatives_korean:
  - 자비를 위한
  - 은혜를 위한
  - 언약적 사랑을 위한
  lexicon: HALOT
  rationale: חֶסֶד의 무게를 살리면서도 한국어에서 과도하게 교회적이거나 협소한 ‘자비’로 줄이지 않기 위해 ‘인자한 사랑’을 사용했습니다.
- source_word: יַמְצִאֵהוּ
  english_pob_choice: he causes it to happen
  chosen_korean: 그분이 그것을 이루십니다
  alternatives_korean:
  - 그분이 그것을 일어나게 하십니다
  - 그분이 그것을 가져오십니다
  - 그분이 그것을 이루게 하십니다
  lexicon: HALOT
  rationale: 히필형 מצא는 여기서 사건을 ‘일어나게 하다/이루다’의 결과적·사역적 뉘앙스를 가지므로, 한국어에서 자연스럽고 원인성을 드러내는 ‘이루십니다’로 옮겼습니다.
theological_decisions:
- issue: '세 항목의 성격: 목적인가, 결과인가'
  chosen_reading: 세 가지는 하나님이 폭풍/비를 보내시는 상이한 목적 또는 결과 범주로 읽고, 본문이 의도적으로 그 범주를 열어 둔 것으로 보존했습니다.
  alternative_readings:
  - 단순한 조건문으로 읽기
  - 첫 항목을 더 노골적인 형벌로 한정하기
  - 세 항목을 지리적 목적지로만 읽기
  rationale: 문맥상 피조물과 날씨를 다루는 하나님의 주권을 말하며, 본문은 징계와 보살핌의 긴장을 동시에 유지합니다. 번역은 그 긴장을 풀어버리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
