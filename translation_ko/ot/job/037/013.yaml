  - ~이면
  lexicon: HALOT
  rationale: 반복되는 אִם은 단순 조건문보다 세 갈래의 목적/결과 범주를 나열하는 구조이므로, 한국어에서는 ‘~이든’ 반복으로 분기성을 살렸습니다.
- source_word: לְשֵׁבֶט
  english_pob_choice: for correction
  chosen_korean: 징계를 위한
  alternatives_korean:
