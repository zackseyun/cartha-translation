  lexicon: HALOT
  rationale: שֵׁבֶט의 문자적 의미인 ‘막대기’보다 여기서는 하나님의 통치 아래서의 징계적 기능이 더 분명하므로, 과도한 형벌 이미지를 피하면서도 훈육/징계의 뜻을 살렸습니다.
- source_word: לְאַרְצוֹ
  english_pob_choice: for his land
  chosen_korean: 그의 땅을 위한
