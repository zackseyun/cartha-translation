  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
  footnotes:
  - marker: a
    text: Or 'for a rod,' that is, for punishment or discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'for mercy' or 'for kindness' for 'steadfast love.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb may also be rendered 'he brings it about' or 'he makes it come.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그것이 징계를 위해[a], 그의 땅을 위해, 또는 한결같은 사랑을 위해[b] 일어나게 하십니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘막대기를 위해’; 곧 형벌이나 징계를 위해.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자비를 위해’ 또는 ‘친절을 위해’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 ‘그것을 일어나게 하시다’, ‘그것을 가져오시다’, 또는 ‘그것이 닥치게 하시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
