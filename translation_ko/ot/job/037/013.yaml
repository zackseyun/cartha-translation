  source_fidelity: 세 번 반복되는 אִם의 선택적 나열과 לְ의 목적적 용법, 그리고 날씨 현상을 일으키시는 하나님의 사역을 대체로 반영합니다. 다만 초안의 ‘그것이 … 그분이 그것을 이루십니다’는 무엇이 목적을 위해 존재하는지와 무엇을 이루는지가 겹쳐, 히브리어의 사역적 의미와 문맥상의 기상 현상에 대한 지시를 충분히 드러내지 못합니다.
  naturalness: ‘그분은 그것이 … 일어나게 하십니다’로 하면 한국어 문장이 자연스러워지고, 기상 현상이 징계·땅·사랑과 관련하여 발생하게 됨을 명료하게 표현합니다. ‘한결같은 사랑’은 חֶסֶד의 지속성과 호의를 현대 표준어로 자연스럽게 전달합니다.
