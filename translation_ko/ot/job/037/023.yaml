id: JOB.37.23
reference: Job 37:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
  footnotes:
  - marker: a
    text: Or 'we cannot comprehend him' or 'we cannot attain to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'judgment' for 'justice.'
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be understood as 'he does not afflict'; some have taken the verb as 'he does not answer,' but that fits the context less well.
    reason: alternative_reading
translation:
  language: ko
  text: 전능자께서는 우리가 그분을 찾아낼 수 없는 분이시며[a], 권능이 크시고, 공의[b]와 풍성한 의를 억누르지 않으십니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그분을 이해할 수 없습니다’ 혹은 ‘그분께 이를 수 없습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공의’ 대신 ‘심판’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 앞선 ‘공의와 풍성한 의’에 연결하여 ‘그것들을 억누르지 않으십니다’로 옮겼습니다. 동사를 ‘괴롭히다’ 또는 ‘대답하다’로 이해하는 견해도 있으나, 문맥에는 덜 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  english_pob_choice: The Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 이
  - 샷다이
  lexicon: HALOT
  rationale: 신적 칭호의 의미를 살려 ‘전능자’로 옮겼습니다. 음역보다 한국어 의미 전달이 더 직접적입니다.
- source_word: לֹא מְצָאנֻהוּ
  english_pob_choice: we cannot find him out
  chosen_korean: 우리가 그분을 찾아낼 수 없습니다
  alternatives_korean:
  - 우리가 그분을 찾아볼 수 없습니다
  - 우리가 그분을 이해할 수 없습니다
  - 우리가 그분께 이를 수 없습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘발견’보다 도달·파악의 불가능함을 함께 드러내므로 ‘찾아내다’로 옮겼습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 심판
  lexicon: HALOT
  rationale: 하나님의 속성으로서의 משפט는 법정 행위보다 올바른 통치의 성격을 가리키므로 ‘공의’가 가장 자연스럽습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צדקה를 하나님의 도덕적 올바름으로 이해하여 신학적으로 표준적인 ‘의’로 옮겼습니다. ‘풍성한’은 רֹב의 뉘앙스를 반영합니다.
- source_word: יְעַנֶּה
  english_pob_choice: he does not afflict
  chosen_korean: 억압하지 않으십니다
  alternatives_korean:
  - 괴롭히지 않으십니다
  - 학대하지 않으십니다
  - 고통을 주지 않으십니다
  lexicon: HALOT
  rationale: ענה의 피엘은 ‘괴롭히다/압제하다/억누르다’의 뜻을 가지며, 공의와 의와 병치될 때 부당한 억압의 부재를 나타내기에 ‘억압하지 않다’가 가장 적절합니다.
theological_decisions:
- issue: 마지막 절의 יְעַנֶּה를 어떻게 이해할지
  chosen_reading: 하나님은 공의와 풍성한 의를 가지시므로 사람을 부당하게 억압하지 않으신다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘그분은 대답하지 않으신다’는 뜻으로 읽는 견해
  rationale: 앞의 ‘공의’와 ‘의’가 하나님의 성품을 진술하므로, 문맥상 ‘억압하지 않으신다’가 더 자연스럽고 신학적 긴장을 해치지 않습니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 유지하되 본문이 지지하지 않는 해석은 피함
