  source_fidelity: 초안은 שַׁדַּי, 하나님의 불가해성, 큰 권능, מִשְׁפָּט와 צְדָקָה의 병치를 대체로 충실히 반영합니다. 그러나 ‘공의와 풍성한 의로 그분은 억압하지 않으십니다’의 ‘-로’는 히브리어에 없는 수단·방법 관계를 만들어, 하나님이 공의와 의를 수단으로 사람을 억압하지 않으신다는 뜻처럼 읽힙니다. 마지막 동사는 앞선 ‘공의와 풍성한 의’에 직접 연결하여, 그것들을 억누르거나 훼손하지 않으신다는 형태로 옮기는 것이 원문의 결속을 더 잘 보존합니다.
