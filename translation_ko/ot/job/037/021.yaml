id: JOB.37.21
reference: Job 37:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֤ה לֹ֘א רָ֤אוּ א֗וֹר בָּהִ֣יר ה֭וּא בַּ/שְּׁחָקִ֑ים וְ/ר֥וּחַ עָ֝בְרָ֗ה וַֽ/תְּטַהֲרֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
  footnotes:
  - marker: a
    text: Or 'they have not seen the light, which is bright in the skies'; the Hebrew sequence is compact and may be taken less concessively.
    reason: alternative_reading
  - marker: b
    text: The pronoun in 'clears them' is plural, likely referring to the skies or clouds; some understand the sense more generally as 'clears the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제는 그들이 빛을 보지 못합니다[a]. 빛은 하늘들 가운데 밝게 비칩니다[b]. 그러나 바람이 지나가며 그것들을 깨끗하게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 하늘들 가운데 밝게 비치는 빛을 보지 못했다’로도 옮길 수 있습니다. 히브리어 배열이 매우 압축적이어서 다소 다르게 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그것들을 깨끗하게 합니다’의 목적어는 복수형으로, 하늘이나 구름을 가리키는 것으로 보입니다. 더 넓게는 ‘하늘을 맑게 한다’는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제는
  alternatives_korean:
  - 이제는
  - 그리고 지금은
  lexicon: HALOT
  rationale: 시간 전환과 문장 연결을 함께 살려 주는 표현으로, ו의 연결감과 עַתָּה의 현재적 국면을 자연스럽게 옮겼습니다.
- source_word: לֹא רָאוּ אוֹר
  english_pob_choice: they do not see the light
  chosen_korean: 그들이 빛을 보지 못합니다
  alternatives_korean:
  - 그들은 빛을 보지 않았습니다
  - 빛을 보지 못합니다
  lexicon: HALOT
  rationale: 완료형이지만 문맥상 현재적 상태를 가리키므로, 한국어에서는 현재적 부정으로 옮겨 관찰 진술의 느낌을 살렸습니다.
- source_word: בָּהִיר הוּא בַּשְּׁחָקִים
  english_pob_choice: bright though it is in the skies
  chosen_korean: 빛은 하늘들 가운데 밝게 비칩니다
  alternatives_korean:
  - 하늘들 가운데 밝습니다
  - 밝기는 하늘들 가운데 있습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 접속 구조와 대비를 살리되, 한국어에서는 자연스러운 서술문으로 풀어 ‘밝은데도 보이지 않는’ 상황을 유지했습니다.
- source_word: וְר֥וּחַ עָבְרָה
  english_pob_choice: but a wind passes by
  chosen_korean: 그러나 바람이 지나가며
  alternatives_korean:
  - 그리고 바람이 지나가며
  - 그런데 바람이 지나가며
  lexicon: HALOT
  rationale: רוח는 כאן 기상적 ‘바람’이며, 대조를 분명히 하는 반의 접속으로 문맥의 전환을 살렸습니다.
- source_word: וַתְּטַהֲרֵם
  english_pob_choice: and clears them
  chosen_korean: 그것들을 깨끗하게 합니다
  alternatives_korean:
  - 그것들을 맑게 합니다
  - 그것들을 깨끗이 치웁니다
  lexicon: HALOT
  rationale: טהר의 ‘깨끗하게 하다/맑게 하다’ 의미를 따라, 시적이지만 지나치게 해석적이지 않은 표현을 택했습니다.
theological_decisions:
- issue: וְר֥וּחַ의 의미
  chosen_reading: 여기서는 ‘영’이 아니라 기상 현상인 ‘바람’으로 이해했습니다.
  alternative_readings:
  - 영
  - 바람과 영의 이중적 여운
  rationale: 문맥이 하늘과 빛, 구름의 변화에 관한 묘사이므로 רוח는 자연현상으로 읽는 것이 가장 직접적입니다.
  doctrine_reference: 문맥 우선의 어휘 판단
