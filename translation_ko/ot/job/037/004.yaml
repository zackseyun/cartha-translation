reference: Job 37:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרָ֤י/ו יִשְׁאַג ק֗וֹל יַ֭רְעֵם בְּ/ק֣וֹל גְּאוֹנ֑/וֹ וְ/לֹ֥א יְ֝עַקְּבֵ֗/ם כִּֽי יִשָּׁמַ֥ע קוֹלֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
  footnotes:
  - marker: a
    text: Or 'Afterward, a voice roars.' The Hebrew may be taken adverbially, but the context likely points back to the lightning in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'and he does not delay them,' with 'them' likely referring to the thunderbolts or storm effects released with the thunder.
    reason: lexical_alternative
  - marker: c
    text: Or 'for/because his voice is heard.' The Hebrew conjunction can be read causally as well as temporally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것 뒤에 한 목소리가 포효합니다. 그분은 그분의 장엄한 음성으로 천둥을 치시며, 그분의 음성이 들릴 때에는 그것들을 붙들어 두지 않으십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뒤에 한 목소리가 포효한다.’ 히브리어는 부사적으로도 읽을 수 있으나, 문맥은 앞 절의 번개를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 그것들을 지체시키지 않으십니다.’ 여기의 ‘그것들’은 천둥과 함께 풀려나는 번개나 폭풍의 효과를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분의 음성이 들리기 때문에.’ 히브리어 접속사는 시간적 의미뿐 아니라 원인적 의미로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After it
  chosen_korean: 그것 뒤에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  - 그 후에
  lexicon: HALOT
  rationale: 앞 절의 번개를 가리키는 뒤이어 오는 순서를 살려, 지시 대상을 드러내는 ‘그것 뒤에’로 옮겼습니다.
- source_word: יִשְׁאַג קוֹל
  english_pob_choice: a voice roars
  chosen_korean: 목소리가 포효하고
  alternatives_korean:
  - 목소리가 울부짖고
  - 한 목소리가 포효하고
  - 소리가 포효하고
  lexicon: HALOT
  rationale: שׁאג의 사자후 같은 ‘포효’ 이미지를 살리되, קוֹל을 자연스러운 한국어로 ‘목소리’로 옮겨 생생한 의인화를 유지했습니다.
- source_word: בְּקוֹל גְּאוֹנוֹ
  english_pob_choice: with his majestic voice
  chosen_korean: 자기의 장엄한 음성으로
  alternatives_korean:
  - 그의 장엄한 음성으로
  - 위엄 있는 음성으로
  - 장엄한 음성으로
  lexicon: HALOT
  rationale: גָּאוֹן의 위엄·장엄함을 반영하여 ‘장엄한 음성’으로 옮기고, בְּ는 수단/방식의 ‘-으로’로 자연스럽게 처리했습니다.
- source_word: וְלֹא יְעַקְּבֵם
  english_pob_choice: and he does not hold them back
  chosen_korean: 그들을 붙들어 두지 않으십니다
  alternatives_korean:
  - 그들을 지체시키지 않으십니다
  - 그들을 막아 두지 않으십니다
  - 그들을 늦추지 않으십니다
  lexicon: HALOT
  rationale: עכב의 ‘지체시키다/붙들어 두다/막다’ 의미 가운데, 폭풍의 번개와 그 효과가 방해 없이 풀려나는 뉘앙스를 가장 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 4인칭 지시와 이어지는 3인칭 소유격의 주체
  chosen_reading: 자연 현상처럼 들리지만, 문맥상 주체는 하나님의 음성이며 천둥을 통해 나타납니다.
  alternative_readings:
  - 무인칭 폭풍의 소리로 읽을 수 있음
  - 주체를 본문에서 명시하지 않고 소리 자체로만 읽을 수 있음
  rationale: 앞뒤 문맥이 하나님의 임재와 활동을 폭풍 속에서 묘사하므로, 인칭 대명사와 소유격을 살려 하나님을 암시하되 본문에 ‘하나님’을 덧붙여 과잉 설명하지 않았습니다.
  doctrine_reference: 욥기 37장 문맥상 하나님의 자연계시 묘사
