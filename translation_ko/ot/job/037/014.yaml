translation:
  language: ko
  text: 이것을 들으십시오, 욥이여. 서서 하나님의 놀라운 일들을 생각해 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה זֹּאת
  english_pob_choice: Listen to this
  chosen_korean: 이것을 들으십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 이것에 귀를 기울이십시오
  lexicon: HALOT
  rationale: אזן의 청각적 주의를 요구하는 명령을 자연스러운 현대 한국어로 옮겼습니다. ‘들으십시오’가 직설적이면서도 격식을 갖춰, 뒤따르는 호명과 잘 어울립니다.
- source_word: עֲמֹד
  english_pob_choice: stand still
  chosen_korean: 서서
  alternatives_korean:
  - 서십시오
  - 가만히 서서
  lexicon: HALOT
  rationale: 문맥상 다음 명령과 연결되어 ‘멈추고 자세를 고정한 채’라는 뉘앙스가 있으므로, 한국어에서는 동작 이어짐을 살리는 ‘서서’가 가장 자연스럽습니다.
- source_word: וְהִתְבּוֹנֵן
  english_pob_choice: and consider
  chosen_korean: 생각해 보십시오
  alternatives_korean:
  - 살펴보십시오
  - 깊이 생각해 보십시오
  lexicon: HALOT
  rationale: בין의 히트폴엘은 주의 깊은 숙고를 뜻하므로, 단순 인지보다 숙고를 드러내는 ‘생각해 보십시오’를 택했습니다.
- source_word: נִפְלְאוֹת אֵל
  english_pob_choice: the wonders of God
  chosen_korean: 하나님의 놀라운 일들
  alternatives_korean:
  - 하나님의 기이한 일들
  - 하나님의 놀라운 행적
  lexicon: HALOT
  rationale: נפלאות는 ‘기적 같은 놀라운 일들’의 복수형으로, 한국어에서는 ‘놀라운 일들’이 직역성을 유지하면서도 자연스럽습니다. אֵל은 여기서 일반적 신칭이므로 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: אֵל의 번역 범위
  chosen_reading: 하나님
  alternative_readings:
  - 전능하신 하나님
  - 능력의 하나님
  rationale: 본문은 야훼의 놀라운 행위를 일반적으로 가리키며, 히브리어 אֵל 자체가 추가 수식 없이 쓰였으므로 해석적 증강 없이 ‘하나님’으로 유지했습니다.
  doctrine_reference: 원어 우선 원칙; 문맥에 없는 신학적 강조의 절제
