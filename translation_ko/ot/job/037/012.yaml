id: JOB.37.12
reference: Job 37:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֤וּא מְסִבּ֨וֹת מִתְהַפֵּ֣ךְ ב/תחבולת/ו לְ/פָעֳלָ֑/ם כֹּ֖ל אֲשֶׁ֥ר יְצַוֵּ֓/ם עַל פְּנֵ֖י תֵבֵ֣ל אָֽרְצָ/ה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
  footnotes:
  - marker: a
    text: Or 'in circuits' or 'round about'; the Hebrew emphasizes repeated circling motion.
    reason: lexical_alternative
  - marker: b
    text: Or 'by his steering' or 'by his direction'; the Hebrew term suggests skillful guidance or control.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the inhabited world, earthward/landward,' a layered expression for the terrestrial world.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 그의 인도하심으로 이리저리 돌면서, 그가 그들에게 명령하시는 모든 일을 이루기 위해 땅의 지면, 곧 사람이 사는 세상 위로 지나갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이리저리’의 뜻으로, 반복적으로 돌거나 선회하는 움직임을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 조종’이나 ‘그의 방향 잡음’으로 옮길 수 있으며, 능숙한 통제와 이끄심의 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘사람이 사는 세상, 곧 땅/지면 쪽’이라는 겹친 표현으로, 지상의 세계 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא / It
  english_pob_choice: It
  chosen_korean: 그것은
  alternatives_korean:
  - 그는
  lexicon: HALOT
  rationale: 문맥상 폭풍 구름과 같은 자연 현상을 가리키므로, 한국어에서는 인칭 대명사보다 비인칭 대명사 ‘그것’을 쓰는 편이 원문의 referent와 자연스럽게 맞습니다.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  english_pob_choice: turns around and around
  chosen_korean: 이리저리 돌면서
  alternatives_korean:
  - 빙빙 돌면서
  - 돌고 또 돌면서
  - 순환하며
  lexicon: HALOT
  rationale: 반복적이고 순환적인 움직임을 한국어로 과장 없이 살리기 위해 ‘이리저리 돌면서’로 옮겼습니다.
- source_word: בְּתַחְבֻּלֹתוֹ
  english_pob_choice: by his guidance
  chosen_korean: 그의 인도하심으로
  alternatives_korean:
  - 그의 지도로
  - 그의 방향 잡으심으로
  - 그의 조종으로
  lexicon: HALOT
  rationale: 이 어근은 단순한 지시보다 숙련된 방향 잡기와 통제의 뉘앙스를 가지므로, 자연현상을 다스리시는 하나님의 주권적 이끄심을 드러내는 ‘인도하심’이 적절합니다.
- source_word: יְצַוֵּם
  english_pob_choice: he commands them
  chosen_korean: 그가 그들에게 명령하시는
  alternatives_korean:
  - 그가 그들을 명하시는
  - 그가 그들에게 지시하시는
  lexicon: HALOT
  rationale: 피엘 동사의 기본 의미를 따라 ‘명령하시다’로 옮기고, 목적어를 명시해 히브리어의 대상을 분명히 했습니다.
- source_word: תֵבֵל אָרְצָה
  english_pob_choice: the inhabited world on the earth
  chosen_korean: 땅의 지면, 곧 사람이 사는 세상 위로
  alternatives_korean:
  - 사람이 사는 세상 위로
  - 땅 위에
  - 온 세상 위로
  lexicon: HALOT
  rationale: תֵבֵל은 단순한 ‘세상’보다 사람이 사는 지면의 뉘앙스가 강하고, אָרְצָה는 지면/땅 쪽으로의 방향성을 보태므로, 두 표현을 함께 살려 ‘땅의 지면, 곧 사람이 사는 세상’으로 풀었습니다.
theological_decisions:
- issue: 지시 대상의 성격과 자연현상 묘사
  chosen_reading: 구름이나 폭풍과 같은 자연현상이 하나님의 주권적 인도 아래 움직이는 것으로 읽었습니다.
  alternative_readings:
  - 더 구체적으로 구름 무리로 볼 수 있습니다.
  - 번개와 폭풍 전체를 포괄하는 표현으로 볼 수 있습니다.
  rationale: 문맥 전체가 욥기 37장의 바람, 구름, 번개, 폭풍에 대한 묘사이므로, 번역은 과도하게 특정하지 않으면서도 하나님의 통치 아래 움직이는 자연현상이라는 점을 유지해야 합니다.
  doctrine_reference: 섭리와 창조세계에 대한 하나님의 주권
- issue: 공간 표현의 중복 보존
  chosen_reading: ‘땅의 지면, 곧 사람이 사는 세상 위로’로 두 겹의 공간 표현을 살렸습니다.
  alternative_readings:
  - 의미를 묶어 ‘세상 위로’만 둘 수 있습니다.
  - ‘땅 위로’로 간략화할 수 있습니다.
  rationale: 히브리어는 ‘사람이 사는 세상’과 ‘땅/지면’의 층위를 겹쳐 말하므로, 한국어에서도 그 중복이 주는 시적·강조적 효과를 어느 정도 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 시적 병행과 반복 강조
