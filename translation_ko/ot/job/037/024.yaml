base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
  footnotes:
  - marker: a
    text: Or, more literally, 'he does not see all the wise of heart'; the Hebrew verb can mean 'see' or 'regard,' and the phrase may emphasize God's disregard for human wisdom before him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 사람들이 그를 두려워합니다[a]—그는 마음이 지혜로운 자들을 모두 돌아보지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 마음이 지혜로운 자들을 모두 보지 않으신다’로도 옮길 수 있습니다. 히브리어 동사는 ‘보다’ 또는 ‘돌아보다/유의하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞 구절들에 대한 결론을 드러내는 연결어로, 현대 한국어에서도 가장 자연스럽고 논리적 힘을 잘 살립니다.
- source_word: יְרֵאוּהוּ
  english_pob_choice: fear him
  chosen_korean: 그를 두려워합니다
  alternatives_korean:
  - 그를 경외합니다
  - 그를 두려워하게 됩니다
  lexicon: HALOT
  rationale: ירא의 직접적인 의미를 살리되, 합쇼체 문맥에 맞게 자연스럽게 옮겼습니다. ‘경외하다’는 너무 완화될 수 있어 기본 의미인 두려움을 우선했습니다.
- source_word: לֹא יִרְאֶה
  english_pob_choice: he does not regard
  chosen_korean: 돌아보지 않으십니다
  alternatives_korean:
  - 보지 않으십니다
  - 유의하지 않으십니다
  - 돌아보지 않으십니다
  lexicon: HALOT
  rationale: 히브리어 ראה는 문자적으로 ‘보다’이지만, 문맥상 단순 시각이 아니라 사람들을 인정하거나 주목하는 뜻이므로 ‘돌아보다’로 옮겨 관계적·평가적 뉘앙스를 살렸습니다.
- source_word: חַכְמֵי לֵב
  english_pob_choice: wise of heart
  chosen_korean: 마음이 지혜로운 자들
  alternatives_korean:
  - 마음의 지혜로운 자들
  - 지혜로운 마음을 가진 자들
  - 지혜로운 마음의 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 풀되, 내면의 지혜라는 이미지를 유지했습니다. ‘마음이 지혜로운’은 직역성과 가독성의 균형이 좋습니다.
theological_decisions:
- issue: 하나님의 ‘돌아보지 않으심’의 의미
  chosen_reading: 하나님은 마음이 지혜롭다고 여기는 자들을 인정하거나 주목하지 않으신다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 보지 않으신다
  - 아예 보이지 않으신다
  rationale: 문맥은 하나님의 위엄 앞에서 인간의 지혜가 무력하다는 점을 말하므로, 시각 행위보다 평가·인정의 부재를 드러내는 번역이 더 정확합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
