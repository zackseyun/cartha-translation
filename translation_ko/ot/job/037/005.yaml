  - marker: b
    text: Or 'great things beyond our knowledge' or 'great things we cannot comprehend.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님은 그의 음성으로 놀랍게[a] 천둥치시며, 우리가 알지 못하는 위대한 일들을[b] 행하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님이 그의 음성으로 기이한 일들을 천둥치신다.’ 히브리어 ‘놀라운 것들’은 더 문자적으로 옮길 수도 있으나, 여기서는 ‘천둥치시다’를 수식하는 부사적 용법으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리에게 알려지지 않은 위대한 일들’ 또는 ‘우리가 헤아릴 수 없는 위대한 일들.’
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  english_pob_choice: thunders
  chosen_korean: 천둥치시며
  alternatives_korean:
  - 우레를 치시며
  - 천둥을 울리시며
  - 천둥하시며
  lexicon: HALOT
  rationale: 히필 형태의 רעם은 하나님이 천둥을 내시거나 천둥치시는 것을 뜻하므로, 현대 한국어에서 자연스럽고 직접적인 동사 표현인 ‘천둥치시며’를 택했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 전능하신 하나님
  lexicon: HALOT
  rationale: 문맥상 일반적인 신칭호이므로 표준 개신교 용례인 ‘하나님’이 가장 분명합니다.
- source_word: בְּקוֹלוֹ
  english_pob_choice: with his voice
  chosen_korean: 그의 음성으로
  alternatives_korean:
  - 그의 소리로
  - 그의 목소리로
  - 그의 음성 가운데
  lexicon: HALOT
  rationale: ב + קול은 수단/도구적 용법으로, 한국어에서는 ‘~으로’가 가장 자연스럽고 ‘음성’이 시적·경외적 뉘앙스를 잘 살립니다.
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrously
  chosen_korean: 놀랍게
  alternatives_korean:
  - 기이하게
  - 경이롭게
  - 놀라운 일들을
  lexicon: HALOT
  rationale: 형태는 명사적 복수지만 여기서는 부사적으로 기능하므로, 어색한 ‘기이한 일들을 천둥치시며’보다 동사의 양태를 살리는 ‘놀랍게’가 원문에 더 가깝습니다.
- source_word: וְלֹא נֵדָע
  english_pob_choice: that we do not know
  chosen_korean: 우리가 알지 못하는
  alternatives_korean:
  - 우리가 이해할 수 없는
  - 우리의 지식 밖에 있는
  - 우리가 모르는
  lexicon: HALOT
  rationale: 동사 ידע의 직접적 의미를 유지하면서도 뒤의 ‘큰일들’에 연결되는 관계절로 자연스럽게 옮겼습니다. ‘이해할 수 없는’은 원문보다 강하므로 피했습니다.
theological_decisions:
- issue: 인간의 무지의 범위
  chosen_reading: 하나님의 큰일들은 우리가 알지 못하는 것으로, 그 불가해성을 과장하지 않고 원문의 ‘알지 못함’에 머무릅니다.
  alternative_readings:
  - 우리가 도무지 헤아릴 수 없는 큰일들
  - 우리가 이해할 수 없는 큰일들
  rationale: 히브리어 נֵדָע는 ‘알다’의 부정이므로, 본문이 말하는 한계를 넘어 ‘완전히 이해 불가’로 강하게 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §3
