  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
  footnotes:
  - marker: a
    text: Or 'he loads the thick cloud with rain/water'; the Hebrew term translated 'moisture' is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'he scatters the cloud of his light'; 'his lightning cloud' interprets 'light' in the storm context as lightning.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그는 짙은 구름에 물기[a]를 실으시고, 그의 빛의 구름[b]을 흩으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 짙은 구름에 비나 물을 실으신다.” 여기의 히브리어 단어는 의미가 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “그의 빛의 구름”입니다. 이를 “그의 빛을 내는 구름”으로, 또는 폭풍 문맥에서 “그의 번개 구름”으로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 확실히
  - 심지어
  lexicon: HALOT
  rationale: 여기서는 앞말을 덧붙이며 강조하는 용법이므로, 자연스러운 감탄·강조 부사인 '참으로'가 문맥의 힘을 잘 살립니다.
- source_word: בְּרִי
  english_pob_choice: with moisture
  chosen_korean: 물기를 실으시고
  alternatives_korean:
