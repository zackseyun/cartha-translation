  source_fidelity: 본문은 בְּרִי의 불확실성을 ‘물기’로 절제하여 옮기고, עֲנַן אוֹרוֹ의 낯선 결합을 ‘그의 빛의 구름’으로 보존하여 대체로 원문에 충실합니다. 다만 각주 표지가 해당 어휘에 붙어 있지 않아, 불확실한 어휘와 각주의 연결을 바로잡아야 합니다.
  naturalness: ‘두터운 구름’도 이해되지만 현대 표준어 기상 표현으로는 ‘짙은 구름’이 더 자연스럽습니다. ‘빛의 구름’은 의도적으로 원문의 시적이고 다소 이례적인 결합을 유지한 표현이므로, 각주에서 가능한 이해를 밝혀 주는 것이 적절합니다.
  terminology: ‘참으로’, ‘물기’, ‘짙은 구름’, ‘흩으십니다’는 합쇼체의 문체와 문맥에 적절합니다. ‘빛’을 본문에서 곧바로 ‘번개’로 확정하지 않은 점도 어휘적 불확실성을 보존합니다.
