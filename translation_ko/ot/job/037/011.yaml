id: JOB.37.11
reference: Job 37:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
  footnotes:
  - marker: a
    text: Or 'he loads the thick cloud with rain/water'; the Hebrew term translated 'moisture' is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'he scatters the cloud of his light'; 'his lightning cloud' interprets 'light' in the storm context as lightning.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그는 두터운 구름에 물기를 실으시고, 그의 빛의 구름을 흩으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 두터운 구름에 비/물을 실으신다.” 여기의 히브리어 표현은 의미가 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 그의 빛의 구름을 흩으신다.” 문맥상 “그의 번개 구름”으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 확실히
  - 심지어
  lexicon: HALOT
  rationale: 여기서는 앞말을 덧붙이며 강조하는 용법이므로, 자연스러운 감탄·강조 부사인 '참으로'가 문맥의 힘을 잘 살립니다.
- source_word: בְּרִי
  english_pob_choice: with moisture
  chosen_korean: 물기를 실으시고
  alternatives_korean:
  - 비를 실으시고
  - 물로 채우시고
  - 습기로 채우시고
  lexicon: HALOT
  rationale: 어근 의미가 불확실하지만 구름에 물이 가득 차는 기상적 그림이 핵심이므로, '물기'로 옮기고 동사와 결합해 '실으시고'로 표현했습니다.
- source_word: עָב
  english_pob_choice: the thick cloud
  chosen_korean: 두터운 구름
  alternatives_korean:
  - 짙은 구름
  - 구름 덩어리
  - 어두운 구름
  lexicon: HALOT
  rationale: עָב는 두껍고 짙은 구름을 가리키므로, 형용사 '두터운'을 써서 시적이면서도 구체적인 이미지를 보존했습니다.
- source_word: אוֹרוֹ
  english_pob_choice: his cloud of light / his lightning cloud
  chosen_korean: 그의 빛의 구름
  alternatives_korean:
  - 그의 번개 구름
  - 그의 빛나는 구름
  - 그의 빛의 구름
  lexicon: HALOT
  rationale: 문맥상 번개를 암시할 수 있지만, 원문은 문자적으로 '그의 빛'이므로 해석을 과도하게 확장하지 않고 겹구조를 살린 '빛의 구름'으로 옮겼습니다.
theological_decisions:
- issue: শেষ clause의 '빛'을 번개로 명시할지 여부
  chosen_reading: 본문에는 '그의 빛의 구름'을 두어 원문 표현을 보존하고, 번개 해석은 본문 밖에서만 가능하도록 남겨 두었습니다.
  alternative_readings:
  - 그의 번개 구름
  - 그의 밝은 구름
  rationale: 시적·기상적 문맥상 번개일 가능성은 있으나, 본문이 직접 말하는 것은 '빛'이므로 해석을 본문에 선반영하지 않는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: 본문의 자연현상 묘사와 어휘 보존
- issue: אַף의 기능을 단순 접속으로 볼지 강조로 볼지
  chosen_reading: 강조 부사로 보고 '참으로'를 사용했습니다.
  alternative_readings:
  - 또한
  - 심지어
  rationale: 이 절은 엘리후의 자연 묘사 연속선에서 새로운 강조를 도입하므로, 단순 연결보다 확인·강조의 뉘앙스가 더 잘 맞습니다.
  doctrine_reference: 히브리어 담화 표지의 수사적 기능
