base_translation:
  language: en
  yaml_path: translation/ot/job/037/017.yaml
  text: you whose garments are hot when the earth is still because of the south wind?[a]
  footnotes:
  - marker: a
    text: Or 'from the south.' The Hebrew literally says 'from the south,' which may refer more generally to the southern quarter; 'south wind' makes the meteorological sense explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그대의 옷은 뜨겁지 않습니까 — 땅이 남풍으로 잠잠할 때에?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘남쪽에서’입니다. 여기서는 기상학적 의미를 드러내기 위해 ‘남풍’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: you whose
  chosen_korean: 그대의
  alternatives_korean:
  - 당신의
  - ~하는 그대
  lexicon: HALOT
  rationale: 직접 호격으로 Job을 부르는 문맥이므로, 관계절을 한국어 소유격으로 자연스럽게 풀어 주었습니다. 시적·수사적 질문의 흐름을 살리기 위해 호칭을 최소화했습니다.
- source_word: בְּגָדֶיךָ
  english_pob_choice: your garments
  chosen_korean: 옷은
  alternatives_korean:
  - 의복은
  - 겉옷은
  lexicon: HALOT
  rationale: בגד의 기본 의미를 반영하되, 한국어에서는 ‘옷’이 가장 자연스럽고 시적 압박감도 유지합니다. ‘가먼트’류의 번역투는 피했습니다.
- source_word: חַמִּים
  english_pob_choice: are hot
  chosen_korean: 뜨겁지 않습니까
  alternatives_korean:
  - 뜨겁습니다
  - 열이 나지 않습니까
  lexicon: HALOT
  rationale: 문맥상 단순 진술보다 수사적 질문이 자연스럽고, 뜨거운 옷감과 더운 기후를 함께 드러냅니다. 영어 POB의 질문 형식을 한국어에도 반영했습니다.
- source_word: מִדָּרוֹם
  english_pob_choice: because of the south wind
  chosen_korean: 남풍으로
  alternatives_korean:
  - 남쪽에서
  - 남쪽 때문에
  lexicon: HALOT
  rationale: 영어 POB가 기상학적 의미를 명시했듯이, 한국어도 ‘남풍’으로 옮겨 מקור의 남쪽/남풍 중 중의성을 날씨 맥락에서 풀었습니다. ‘남쪽에서’보다 원인성이 분명합니다.
theological_decisions:
- issue: Elihu의 수사적 질문을 한국어에서 어떤 존대 수준으로 재현할지
  chosen_reading: 합쇼체의 수사적 질문으로 처리해, 공손하지만 긴박한 책망의 어조를 유지했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 ‘그대의 옷은 뜨겁습니다’
  - 더 강한 책망체로 ‘그대의 옷이 얼마나 뜨거운지요’
  rationale: 본문은 교훈적 설명이 아니라 Elihu의 날씨 비유를 통한 반문입니다. 한국어에서는 질문형이 대화의 추진력을 가장 잘 보존합니다.
  doctrine_reference: 문학적-수사적 문맥 보존
