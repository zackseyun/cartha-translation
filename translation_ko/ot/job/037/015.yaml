  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
  footnotes:
  - marker: a
    text: Or 'when God sets them in place' or 'how God appoints them.' The Hebrew expression is compact and leaves the object and referent implicit from the surrounding context.
    reason: alternative_reading
  - marker: b
    text: Or 'causes the brightness of his cloud to flash.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그것들을 그들 위에 어떻게 두시는지[a], 또 그분의 구름빛이 비치게 하시는지[b] 아십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그것들을 제자리에 두실 때’ 또는 ‘하나님께서 그것들을 정하실 때’로 옮길 수 있습니다. 히브리어 표현은 매우 압축적이어서 목적어와 대명사의 지시 대상이 문맥에 의존합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분의 구름빛이 번쩍이게 하시는지’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  english_pob_choice: Do you know
  chosen_korean: 아십니까?
  alternatives_korean:
  - 알고 계십니까?
  - 아시겠습니까?
  lexicon: WLC/HALOT
  rationale: 욥에게 던지는 수사 의문형을 현대 합쇼체로 자연스럽게 옮겼습니다. '아십니까?'가 질문의 직접성과 긴장을 가장 잘 보존합니다.
- source_word: בְּשׂוּם
  english_pob_choice: how ... lays
  chosen_korean: 어떻게 두시는지
  alternatives_korean:
  - 어떻게 놓으시는지
  - 언제 두시는지
  - 두실 때
  lexicon: WLC/HALOT
  rationale: 히브리어는 ‘~하는 방식/상황’의 짧은 구조라서, 한국어에서는 '어떻게'로 그 뉘앙스를 살렸습니다. '두다/놓다'는 문맥상 배치·설정의 의미를 유지합니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: upon them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들 위에
  - 그 위에
  - 그들 위로
  lexicon: WLC/HALOT
  rationale: 대명사 지시 대상이 문맥상 암시되어 있으므로, 원문의 모호함을 보존하면서 한국어에서는 자연스러운 처격 '그들에게'로 옮겼습니다.
- source_word: וְהוֹפִיעַ א֣וֹר עֲנָנֽוֹ
  english_pob_choice: and causes the light of his cloud to shine
  chosen_korean: 그분의 구름의 빛을 비추시는지
  alternatives_korean:
  - 그분의 구름의 빛이 비치게 하시는지
  - 그분의 구름빛을 비추시는지
  - 구름의 빛이 번쩍이게 하시는지
  lexicon: WLC/HALOT
  rationale: הוֹפִיעַ는 ‘빛나게 하다/드러나게 하다’의 사역적 뉘앙스를 가지므로 '비추다'로 옮겼습니다. '구름의 빛'은 원문의 소유·연결 구조를 그대로 살린 표현입니다.
theological_decisions:
- issue: בְּשׂוּם 이후의 생략된 목적어와 '그것들'의 지시 대상
  chosen_reading: 원문이 생략한 대상을 특정하지 않고 '그것들을'로 남겨 두었습니다.
  alternative_readings:
  - 번개를
  - 구름을
  - 그것들을 그 위에
  rationale: 히브리어는 목적어와 지시 대상을 의도적으로 압축합니다. 문맥이 허용하는 여러 가능성을 하나로 고정하지 않기 위해 모호성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
