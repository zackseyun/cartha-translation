base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
  footnotes:
  - marker: a
    text: Or 'beat out the skies' or 'stretch out the skies.' The Hebrew verb can evoke hammering metal thin as well as spreading something out.
    reason: lexical_alternative
  - marker: b
    text: Or 'the heavens' or 'the clouds.' The Hebrew שׁחקים is a poetic term that can refer to the skies/heavens and, in some contexts, clouds.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'like a cast mirror.' The image is of the sky as solid and gleaming like metalwork.
    reason: cultural_note
translation:
  language: ko
  text: 그분과 함께 하늘을 펼치시어, 주조된 거울처럼 단단하게 만드시는[a] 능력을 가지고 계신가? [b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하늘을 두드리다' 또는 '하늘을 펼치다'. 히브리어 동사는 금속을 얇게 두드리는 것뿐만 아니라 무언가를 펼치는 것을 연상시킬 수 있다.
    reason: alternative_reading
  - marker: b
    text: 또는 '하늘들' 또는 '구름들'. 히브리어 שׁחקים은 시적 표현으로 하늘/하늘들, 그리고 일부 문맥에서는 구름을 가리킬 수 있다.
    reason: alternative_reading
  - marker: c
    text: 문자적으로 '주조된 거울과 같다'. 이미지는 하늘이 금속 공예품처럼 단단하고 반짝이는 것으로 묘사된다.
    reason: alternative_reading
