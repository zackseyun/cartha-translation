id: JOB.37.3
reference: Job 37:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּֽחַת כָּל הַ/שָּׁמַ֥יִם יִשְׁרֵ֑/הוּ וְ֝/אוֹר֗/וֹ עַל כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
  footnotes:
  - marker: a
    text: Or 'and his light upon the ends/corners of the earth.' The Hebrew uses 'his light,' which in context likely refers to lightning.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the wings of the earth,' a Hebrew idiom for the earth's extremities.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그것을 온 하늘 아래에 보내시고, 그의 번개[a]를 땅 끝[b]까지 이르게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 빛’. 히브리어는 ‘그의 빛’이라고 하며, 문맥상 번개를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅의 날개들’. 땅의 가장자리나 끝을 가리키는 히브리어의 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  english_pob_choice: Under all the heavens
  chosen_korean: 모든 하늘 아래로
  alternatives_korean:
  - 하늘들 아래로
  - 온 하늘 아래
  lexicon: HALOT
  rationale: 히브리어의 공간적 표현을 살리되, 한국어에서는 '아래로'가 동작의 도달 범위를 자연스럽게 드러내므로 채택했습니다.
- source_word: יִשְׁרֵהוּ
  english_pob_choice: he sends it out
  chosen_korean: 그것을 보내시며
  alternatives_korean:
  - 그것을 내보내시며
  - 그것을 펼치시며
  - 그것을 흩으시며
  lexicon: HALOT
  rationale: 동사와 목적어 접미사가 가리키는 대상을 그대로 유지하면서, 폭풍 문맥에서 '보내다/내보내다'가 가장 무난하게 작동합니다.
- source_word: וְאוֹרֹו
  english_pob_choice: his lightning
  chosen_korean: 그의 번개
  alternatives_korean:
  - 그의 빛
  - 그의 광채
  lexicon: HALOT
  rationale: 문맥상 אוֹר는 일반적인 '빛'보다 번개의 섬광을 가리키는 것이 자연스러우므로, 본문 의미를 드러내는 '번개'를 택했습니다.
- source_word: כַּנְפוֹת הָאָרֶץ
  english_pob_choice: the ends of the earth
  chosen_korean: 땅의 끝들
  alternatives_korean:
  - 땅의 모퉁이들
  - 땅의 날개들
  - 땅끝
  lexicon: HALOT
  rationale: 직역하면 '땅의 날개들'이지만, 이는 관용적으로 지리적 극단을 뜻하므로 한국어에서는 '땅의 끝들'로 옮겨 이미지와 의미를 함께 살렸습니다.
theological_decisions:
- issue: 창조 세계 전체를 덮는 폭풍-현현의 범위
  chosen_reading: 하나님의 행위가 '모든 하늘 아래'와 '땅의 끝들'까지 미친다는 우주적 범위를 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 자연 현상 묘사로만 읽는 해석
  - 시적 과장으로만 축소하는 해석
  rationale: 시어의 과장된 공간 표현이 하나님의 주권적 권능의 보편성을 강조하므로, 이를 약화하지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 하나님의 주권과 창조 세계에 대한 통치
- issue: אוֹר의 의미
  chosen_reading: '''그의 빛''보다 문맥상 ''그의 번개''로 이해해 번역했습니다.'
  alternative_readings:
  - 그의 빛
  - 그의 광채
  rationale: 폭풍 신현 문맥에서 오ור는 빛 일반이 아니라 번개의 섬광을 가리키는 것으로 보는 해석이 더 설득력 있으며, 시적 대비도 분명해집니다.
  doctrine_reference: 시적-신현적 묘사
