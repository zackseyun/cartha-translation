    issue: ‘말해야 한다고’가 אֲדַבֵּר의 1인칭과 가정적 발화 의미를 바꿈
    rationale: 원문은 ‘내가 말한다/말하려 한다’이지 ‘말해야 한다’가 아닙니다. 초안은 화자를 지우고 의무 양태를 첨가합니다.
  - severity: medium
    issue: 각주 표지가 적용 대상과 떨어져 절 끝에 일괄 배치됨
    rationale: a는 ‘그에게’, b는 ‘한 사람’에 직접 붙여 독자가 각주의 대상어를 분명히 알 수 있게 해야 합니다.
  - severity: low
    issue: 각주 c의 대안 번역이 본문과 동일한 1인칭을 충분히 명시하지 않고, 대안 절 연결을 다소 매끄럽게 확정함
    rationale: 난해한 히브리어 구문이라는 점을 유지하면서 ‘내가 말한다고’ 및 ‘자신이 삼켜질 것이라고’를 명시하면 대안 독법이 더 정확해집니다.
