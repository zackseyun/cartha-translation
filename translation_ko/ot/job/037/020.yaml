  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
  footnotes:
  - marker: a
    text: Or, 'to Him,' referring to God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man'; alternatively, 'someone' or 'anyone' in a generic sense.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew of this verse is difficult. Another possible rendering is, 'Should it be told him that I speak? Or should a man say that he would be swallowed up?'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게 말해야 한다고 알려지겠습니까? 사람이 말한다면, 그는 반드시 삼켜질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에게’는 문맥상 하나님을 가리킬 수 있습니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 ‘사람’은 여기서 일반적인 ‘누군가’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 히브리어는 난해하며, ‘그에게 내가 말한다고 알려지겠습니까? 혹은 사람이 말하면 삼켜질 것입니까?’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר לוֹ
  english_pob_choice: Should it be told to him
  chosen_korean: 그에게 말해야 한다고 알려지겠습니까?
  alternatives_korean:
  - 그에게 전해지겠습니까?
  - 그에게 보고되겠습니까?
  lexicon: HALOT
  rationale: הֲ+passive of ספר는 단순한 ‘전달’보다 ‘알려지다/보고되다’의 뉘앙스를 가지므로, 문맥상 신에게 대한 발화를 두고 ‘알려지겠습니까’로 옮겼습니다.
- source_word: אֲדַבֵּר
  english_pob_choice: I would speak
  chosen_korean: 말해야 한다
  alternatives_korean:
  - 내가 말하겠다고
  - 내가 말하리라고
  lexicon: HALOT
  rationale: 미완료형의 가정·의지적 뉘앙스를 살려, 직설적인 현재보다 ‘말해야 한다’로 번역해 화자의 의도된 발화를 드러냈습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 누군가가
  lexicon: HALOT
  rationale: 히브리어 단수 אישׁ을 성중립적 일반명사로 처리할 수 있는 문맥이므로, 한국어에서는 자연스러운 일반화 표현인 ‘사람’으로 옮겼습니다.
- source_word: יְבֻלָּע
  english_pob_choice: he would be swallowed up
  chosen_korean: 반드시 삼켜질 것입니다
  alternatives_korean:
  - 삼켜질 것입니다
  - 삼켜져 버릴 것입니다
  lexicon: HALOT
  rationale: בלע의 수동형은 ‘삼키다/삼켜지다’의 강한 이미지가 핵심이므로, 경고의 압박감을 살려 ‘반드시’로 힘을 보탰습니다.
theological_decisions:
- issue: Job 37:20의 난해한 구문 처리
  chosen_reading: 본문의 수사적 질문 구조를 유지하면서, 너무 매끄럽게 풀지 않고 ‘알려지겠습니까? … 삼켜질 것입니다’로 긴장을 남겼습니다.
  alternative_readings:
  - 그에게 내가 말한다고 알려지겠습니까?
  - 사람이 말하면 그는 삼켜질 것입니까?
  rationale: 히브리어가 압축되어 있어 해석을 과도하게 확정하면 원문의 난점을 지워 버릴 수 있으므로, 가능한 한 구조를 보존했습니다.
  doctrine_reference: '번역 원칙: 원문이 지닌 난해성과 수사성을 보존'
