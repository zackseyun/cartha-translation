    text: Or 'quakes' for 'trembles'; the Hebrew verb can denote shaking from fear, awe, or agitation.
    reason: lexical_alternative
  - marker: b
    text: Or 'jumps out of its place'; the Hebrew expression vividly portrays the heart as suddenly displaced.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일에도 내 마음이 떨리고 제자리에서 뛰쳐나옵니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전율하고’; 히브리어 동사는 두려움, 경외, 또는 동요로 인한 떨림을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제자리에서 뛰어오릅니다’; 히브리어 표현은 마음이 갑자기 제 자리에서 움직이는 모습을 생생하게 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  english_pob_choice: At this also
  chosen_korean: 이 일로도
  alternatives_korean:
  - 이 일에 대해서도
  - 이것으로도
  - 이런 일에도
  lexicon: HALOT
  rationale: אַף와 לְזֹאת의 연결이 앞선 상황에 덧붙여지는 반응을 가리키므로, 한국어에서는 자연스럽게 ‘이 일로도’로 옮겨 연결성과 강조를 함께 살렸습니다.
- source_word: יֶחֱרַד
  english_pob_choice: trembles
  chosen_korean: 떨리고
  alternatives_korean:
  - 전율하고
  - 몸서리치고
  - 흔들리고
  lexicon: HALOT
  rationale: חרד은 두려움·경외·동요로 인한 떨림을 뜻할 수 있어, 의미를 과도하게 좁히지 않는 ‘떨리다’가 가장 무난합니다.
- source_word: וְיִתַּר מִמְּקוֹמוֹ
  english_pob_choice: leaps from its place
  chosen_korean: 제자리에서 뛰쳐나올 듯합니다
  alternatives_korean:
  - 제자리에서 튀어나옵니다
  - 제자리에서 뛰어오릅니다
  - 자리에서 벗어나 뛰는 듯합니다
  lexicon: HALOT
  rationale: יתר와 ‘from its place’의 결합은 심장이 갑자기 제자리에서 벗어나는 생생한 비유이므로, 직역보다 한국어 관용에 맞는 ‘뛰쳐나올 듯합니다’로 강한 동세를 살렸습니다.
theological_decisions:
- issue: 심장을 의인화한 표현의 처리
  chosen_reading: ‘내 마음이 … 뛰쳐나올 듯합니다’로 의인화를 유지했습니다.
  alternative_readings:
  - ‘내가 … 떱니다’로 완화
  - ‘내 심장이 …’로 생리적 표현화
  rationale: 히브리어는 ‘마음’이 자리를 박차고 나가는 듯한 강한 의인화를 사용하므로, 이를 평이하게 약화하지 않고 그대로 보존하는 것이 원문의 충격을 전달합니다.
  doctrine_reference: 성서 히브리어의 인간 이해와 시적 의인화
