    reason: lexical_alternative
translation:
  language: ko
  text: 그의 음성의 떨림[a]과 그의 입에서 나오는 울림[b]을 잘 들으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성의 동요/격노’. 히브리어는 떨림, 동요, 격노를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘웅얼거림’ 또는 ‘낮게 울리는 소리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  english_pob_choice: Listen carefully
  chosen_korean: 잘 들으십시오
  alternatives_korean:
  - 들으십시오, 들으십시오
  - 귀 기울여 들으십시오
  - 잘 들어보십시오
  lexicon: HALOT
  rationale: 히브리어의 명령형+절대부정사로 된 강조를 한국어에서는 자연스러운 공손 명령인 ‘잘 들으십시오’로 옮겨, 반복의 강세는 살리되 부자연스러운 중복은 피했습니다.
- source_word: בְּרֹגֶז קֹלוֹ
  english_pob_choice: the trembling of his voice
  chosen_korean: 그의 음성의 떨림
  alternatives_korean:
  - 그의 목소리의 떨림
  - 그의 음성의 떨림
  - 그의 음성의 격동
  lexicon: HALOT
  rationale: רֹגֶז는 떨림, 동요, 격노의 폭을 가지지만, 문맥상 폭풍의 음향을 가리키므로 ‘떨림’으로 살리고, קוֹל은 여기서 ‘음성/목소리’보다 시적·인격적 울림을 보존하는 ‘음성’으로 옮겼습니다.
- source_word: וְהֶגֶה
  english_pob_choice: the rumbling
  chosen_korean: 울림
  alternatives_korean:
  - 우르릉거림
  - 웅웅거림
  - 속삭임
  lexicon: HALOT
  rationale: הֶגֶה는 낮게 울리는 소리, 중얼거림, 신음까지 뜻할 수 있으나, 폭풍/천둥의 청각 이미지를 고려해 너무 구어적인 표현보다 포괄적이고 시적인 ‘울림’을 택했습니다.
- source_word: מִפִּיו יֵצֵא
  english_pob_choice: comes out from his mouth
  chosen_korean: 그의 입에서 나오는
  alternatives_korean:
  - 그의 입에서 나오는
  - 그의 입에서 나오는 것이
  - 그의 입에서 흘러나오는
  lexicon: HALOT
  rationale: 직역적 신체 은유를 보존하되 한국어 문장 흐름에 맞게 ‘입에서 나오는’으로 정리해, 신의 말씀이 입에서 발해지는 형상을 그대로 드러냈습니다.
theological_decisions:
- issue: 하나님의 폭풍 음성에 대한 의인화
  chosen_reading: ‘그의 음성’, ‘그의 입’ 같은 의인화 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘천둥의 소리’처럼 비인격화함
  - ‘그 소리’로 일반화함
  rationale: 본문은 폭풍 현상을 하나님의 말씀/음성으로 시적으로 그리므로, 의인화를 약화하지 않고 원문의 신학적·문학적 긴장을 보존하는 것이 타당합니다.
  doctrine_reference: Translation philosophy §1, §3
