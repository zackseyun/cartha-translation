  lexicon: HALOT
  rationale: מִפְּנֵי의 원인적 용법을 반영하되, 시적 압축을 유지하기 위해 ‘어둠 때문에’로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘어둠’의 의미 범위
  chosen_reading: 어둠을 그대로 유지해 인간의 무지, 말의 궁핍, 혹은 실제 어둠의 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 무지 때문에
  - 캄캄해서
  rationale: 히브리어는 이미지를 압축해서 제시하므로, 의미를 한쪽으로 고정하기보다 원문의 여지를 보존하는 것이 적절합니다.
  doctrine_reference: 성경시의 함축성과 다의성 보존
