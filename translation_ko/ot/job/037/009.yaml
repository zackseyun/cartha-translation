  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הַ֭/חֶדֶר תָּב֣וֹא סוּפָ֑ה וּֽ/מִ/מְּזָרִ֥ים קָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
  footnotes:
  - marker: a
    text: Or 'From the south comes the storm'; the Hebrew literally says 'from the chamber,' which may be a poetic reference to a southern quarter or hidden storehouse.
    reason: alternative_reading
  - marker: b
    text: Or 'from the north comes cold' or 'from the dispersing winds, cold'; the Hebrew term is rare and its precise sense is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 방에서[a] 폭풍이 오고, 흩어지는 바람들에서[b] 추위가 옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남쪽에서 폭풍이 옵니다.’ 히브리어는 문자적으로 ‘방에서’라고 하며, 이는 남쪽 방향이나 감추어진 저장고를 시적으로 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘북쪽에서 추위가 옵니다.’ 또는 ‘흩어지게 하는 바람들에서 추위가 옵니다.’ 이 히브리어 낱말은 드물게 쓰여 정확한 뜻이 확실하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  english_pob_choice: From its chamber
  chosen_korean: 그의 방에서
  alternatives_korean:
  - 그 방에서
  - 방에서
  - 그 은밀한 곳에서
  lexicon: HALOT
  rationale: חֶדֶר의 기본 뜻은 ‘방, 침실, 안쪽 방’이므로 이를 살리되, 시적 문맥에서 폭풍의 근원지를 가리키는 의인화된 표현으로 자연스럽게 옮겼습니다. 영어 POB의 ‘its chamber’를 따라 소유격 느낌을 주기 위해 ‘그의’로 처리했습니다.
- source_word: תָּבוֹא
  english_pob_choice: comes
  chosen_korean: 나고
  alternatives_korean:
  - 옵니다
  - 다가옵니다
  - 나옵니다
  lexicon: HALOT
  rationale: בוא의 ‘오다/나오다’ 의미를 살리면서 폭풍이 근원지에서 ‘솟아나오는’ 시적 동작을 한국어로 압축해 표현했습니다.
- source_word: סוּפָה
  english_pob_choice: the storm
  chosen_korean: 폭풍
  alternatives_korean:
  - 폭풍우
  - 폭풍
  - 회오리바람
  lexicon: HALOT
  rationale: סוּפָה는 격렬한 폭풍 또는 회오리바람이지만, 본문의 병렬 구조상 ‘차가움’과 자연스럽게 대응하는 일반어 ‘폭풍’이 적절합니다.
- source_word: וּמִמְּזָרִים
  english_pob_choice: from the scattering winds
  chosen_korean: 흩어지는 바람에서
  alternatives_korean:
  - 북쪽에서
  - 분산시키는 바람에서
  - 별자리들에서
  lexicon: HALOT
  rationale: מְזָרִים은 희귀어로 뜻이 불확실하므로, 본문에 제시된 어근의 투명성을 따라 ‘흩어지는 바람’으로 옮겼습니다. ‘북쪽’은 해석적 선택이므로 본문에서는 채택하지 않았습니다.
- source_word: קָרָה
  english_pob_choice: cold
  chosen_korean: 차가움
  alternatives_korean:
  - 추위
  - 서늘함
  - 서리
  lexicon: HALOT
  rationale: קָרָה는 ‘차가움, 추위, 냉기’를 뜻하므로, 시적 병행을 살리면서도 날씨의 상태를 넓게 담는 ‘차가움’이 가장 무난합니다.
theological_decisions:
- issue: 희귀어 מְזָרִים의 방향 해석 여부
  chosen_reading: 본문은 ‘흩어지는 바람’으로 옮기고, 방향 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 북쪽
  - 남쪽
  - 분산시키는 바람
  rationale: 히브리어 형태 자체가 불확실하므로, 추정되는 방위 의미를 본문에 확정적으로 넣기보다 어휘적으로 투명한 표현을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 해석의 불확실성 보존
- issue: 시적 의인화의 정도
  chosen_reading: 폭풍과 차가움이 ‘나오다’라는 동작으로 제시되도록 유지했습니다.
  alternative_readings:
  - 폭풍이 온다
  - 차가움이 온다
  rationale: 이 절은 자연현상을 하나님이 마련하신 근원에서 솟아나오는 것으로 묘사하는 시적 표현이므로, 평이한 서술로 완전히 평준화하지 않았습니다.
  doctrine_reference: 시적 수사 보존
