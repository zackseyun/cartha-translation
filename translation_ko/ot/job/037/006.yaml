id: JOB.37.6
reference: Job 37:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
  footnotes:
  - marker: a
    text: Or 'Be on the earth,' with the sense that the snow is commanded to appear or lie upon the ground.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be rendered 'and the heavy rains of his strength' or 'and the mighty torrents of rain.' The Hebrew is compressed and poetic.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 눈에게 말씀하십니다[a]. ‘땅에 내려라.’ 또 비와 소나기, 그리고 그의 힘찬 폭우에게도 말씀하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에 있어라’ 또는 ‘땅 위에 있어라.’ 히브리어 동사는 눈이 땅에 나타나거나 그 위에 머물도록 명하는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 표현은 직역하면 ‘그의 힘의 비들(소나기들)’ 정도입니다. ‘그의 힘찬 폭우’, ‘그의 힘의 거센 비’, 또는 ‘힘찬 폭우’로 옮길 수 있습니다. 히브리어는 압축된 시어이며, ‘그의’의 지시 대상도 문맥상 하나님으로 이해될 수 있으나 본문 자체는 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַשֶּׁלַג
  english_pob_choice: to the snow
  chosen_korean: 눈에게
  alternatives_korean:
  - 눈에
  - 눈을 향하여
  lexicon: HALOT
  rationale: לְ는 כאן לדבר의 상대를 나타내므로 한국어로는 여격 ‘-에게’가 가장 자연스럽고, 눈을 의인화한 호칭도 살릴 수 있습니다.
- source_word: הֱוֵא אָרֶץ
  english_pob_choice: Fall to the earth
  chosen_korean: ‘땅에 떨어져라.’
  alternatives_korean:
  - ‘땅에 있어라.’
  - ‘땅 위에 내려앉아라.’
  lexicon: HALOT
  rationale: 히브리어 imperatival היה는 이 문맥에서 눈이 땅에 나타나라는 뜻으로 기능하므로, 한국어에서는 과도한 직역보다 ‘떨어져라’가 시각적·동작적 의미를 가장 잘 살립니다.
- source_word: וְגֶשֶׁם מָטָר
  english_pob_choice: and to the rain, ‘Become a shower,’
  chosen_korean: 또 비에게는 ‘소나기가 되어라.’
  alternatives_korean:
  - 또 비에게는 ‘비가 되어라.’
  - 또 비에게는 ‘소나기 비가 되어라.’
  lexicon: HALOT
  rationale: גֶשֶׁם과 מָטָר의 중첩을 한국어의 ‘비/소나기’로 살려, 단순한 반복이 아니라 강도와 양상을 더하는 시적 병행을 반영했습니다.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  english_pob_choice: and to the rains, ‘Become a downpour of his might.’
  chosen_korean: 또 비들[b]에게는 ‘그의 능력의 폭우가 되어라.’
  alternatives_korean:
  - 또 폭우들[b]에게는 ‘그의 힘의 소낙비가 되어라.’
  - 또 비줄기들[b]에게는 ‘그의 능력의 억수비가 되어라.’
  lexicon: HALOT
  rationale: מִטְרוֹת의 복수성과 עֻזּוֹ의 ‘strength/might’를 그대로 살려, 압축된 히브리어 시구를 한국어에서도 강한 폭우 이미지로 옮겼습니다.
- source_word: עֻזּוֹ
  english_pob_choice: his might
  chosen_korean: 그의 능력
  alternatives_korean:
  - 그의 힘
  - 그의 권능
  lexicon: HALOT
  rationale: 하나님의 주권적 힘을 가리키므로 ‘능력’이 너무 일상적이지 않으면서도 ‘힘’보다 문어적이고 시적입니다.
theological_decisions:
- issue: ‘그의’의 지시 대상
  chosen_reading: ‘그의’는 문맥상 하나님을 가리키는 것으로 보았습니다.
  alternative_readings:
  - 비/눈 자체의 힘을 가리킨다고 볼 수 있음
  rationale: 앞선 문맥 전체에서 하나님이 날씨를 명령하시는 분으로 묘사되므로, 소유격은 자연스럽게 하나님께 귀속됩니다.
  doctrine_reference: 하나님의 섭리와 창조 통치
- issue: 눈과 비에 대한 의인화된 명령의 어조
  chosen_reading: 직접 명령형을 유지해 자연 현상을 인격화한 시적 어조를 살렸습니다.
  alternative_readings:
  - 설명문적으로 완화하여 ‘내리게 하신다’로 옮길 수 있음
  rationale: 본문의 시적 긴장과 권위—자연이 하나님의 말을 듣는다는 표현—를 보존하기 위해 명령형을 유지하는 것이 적절합니다.
  doctrine_reference: 창조에 대한 하나님의 주권
