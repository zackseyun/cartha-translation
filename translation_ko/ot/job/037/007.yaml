id: JOB.37.7
reference: Job 37:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
  footnotes:
  - marker: a
    text: Or 'He seals up the hand of every man.' The Hebrew expression likely means that God halts ordinary human labor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'every man' / 'all men'; the wording is generic for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 사람의 손에 인장을 찍으시니[a][b], 모든 사람이 그의 일을 알게 하려 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람의 손을 봉인하신다.’라는 뜻일 수 있습니다. 이 히브리어 표현은 하나님께서 일상적인 인간 노동을 멈추게 하신다는 의미일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘모든 사람’은 남성형 일반 표현이지만, 의미상 인류 전체를 가리키는 일반적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד / יַחְתּוֹם
  english_pob_choice: He seals the hand
  chosen_korean: 모든 사람의 손에 인장을 찍으시니
  alternatives_korean:
  - 모든 사람의 손을 봉인하시니
  - 모든 사람의 손을 닫아 두시니
  lexicon: HALOT
  rationale: חתם의 핵심 의미인 ‘봉인하다/인장을 찍다’를 살리되, 한국어에서는 ‘손에 인장을 찍다’가 비유적 정지의 이미지를 가장 자연스럽게 전달합니다.
- source_word: כָּל אָדָם / כָּל אַנְשֵׁי
  english_pob_choice: every man / all men
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 남자
  - 모든 인간
  lexicon: HALOT
  rationale: 히브리어의 남성형 일반 표현이지만 문맥상 인류 전체를 가리키므로, 성별을 과도하게 드러내지 않는 ‘모든 사람’으로 옮겼습니다.
- source_word: לָדַעַת
  english_pob_choice: so that ... may know
  chosen_korean: …알게 하려 하십니다
  alternatives_korean:
  - …알도록 하십니다
  - …알게 되게 하십니다
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 부정사 구문이므로, 한국어에서는 ‘-게 하다’ 구조로 자연스럽게 옮겼습니다.
- source_word: מַעֲשֵׂהוּ
  english_pob_choice: his work
  chosen_korean: 그의 일
  alternatives_korean:
  - 그의 행하신 일
  - 그의 하신 일
  lexicon: HALOT
  rationale: 하나님의 활동 전체를 가리키는 표현으로 보아, 간결하면서도 포괄적인 ‘그의 일’이 본문의 뜻을 잘 드러냅니다.
theological_decisions:
- issue: 구절의 주체와 소유격이 가리키는 대상
  chosen_reading: 주체와 ‘그의 일’은 하나님을 가리킨다고 보았습니다.
  alternative_readings:
  - 날씨나 추위 같은 비인격적 힘이 손을 묶는다는 읽기
  rationale: 앞뒤 문맥이 하나님이 피조 세계와 인간의 일을 주관하시는 내용이므로, 여기서도 하나님이 인간의 노동을 멈추게 하여 사람들이 그분의 행하심을 알게 하신다는 읽기가 가장 자연스럽습니다.
  doctrine_reference: '욥기 37장의 문맥적 신학: 하나님 주권과 피조물의 인식'
