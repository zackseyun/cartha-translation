review_pass:
  verdict: revise
  source_fidelity: יַחְתּוֹם בְּיַד כָּל־אָדָם is a difficult idiom, but its central image is that God ‘seals’/‘seals up’ every person's hand, contextually denoting the cessation of ordinary work. ‘손에 인장을 찍으시니’ changes the object and pictures marking a hand with a seal rather than sealing/restraining the hand. The purpose clause and the reference of ‘his work’ are otherwise preserved.
  naturalness: ‘손을 봉하시어’ is formal, intelligible Korean suited to a close biblical translation. It avoids the misleadingly concrete modern image of stamping a seal on someone’s hand. ‘알게 하십니다’ naturally expresses the purpose/result infinitive in the verse.
  terminology: ‘봉하다’ preserves the Hebrew sealing metaphor without overcommitting to a particular explanation. ‘모든 사람’ appropriately conveys both generic human expressions without introducing an unnecessary male-only sense. ‘그분의 일’ clearly maintains the contextual divine referent while retaining the broad sense of מַעֲשֵׂהוּ.
  issues:
  - severity: medium
    issue: ‘모든 사람의 손에 인장을 찍으시니’
    rationale: This renders the phrase as placing a seal impression on the hand. The Hebrew expression uses ‘hand’ as the object/domain of sealing and is conventionally understood, in context, as restraining human activity. The draft’s wording materially shifts the image and is not a safe Korean representation of the difficult idiom.
  - severity: low
    issue: Footnote a is framed as an alternative although its wording supplies the more source-faithful basic rendering.
    rationale: Once the main text is corrected to ‘손을 봉하시어,’ the note should explain the idiom rather than label the main rendering an alternative.
  revised_text: 그분은 모든 사람의 손을 봉하시어[a][b], 모든 사람이 그분의 일을 알게 하십니다.
