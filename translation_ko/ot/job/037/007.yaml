  rationale: 본문의 ‘손에 인장을 찍다’를 히브리어의 봉인 비유를 유지하는 ‘손을 봉하시어’로 고쳤습니다. 이는 손에 표지를 찍는다는 다른 뜻을 피하면서도, 관례적인 해석인 노동의 중단은 각주에서 신중하게 설명합니다. 나머지 목적절과 하나님의 일을 가리키는 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
