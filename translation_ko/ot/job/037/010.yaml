base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
  footnotes:
  - marker: a
    text: Or 'By the breath of God ice is given.' The Hebrew preposition can express either source ('from') or means ('by').
    reason: lexical_alternative
  - marker: b
    text: Or 'the breadth of the waters is congealed' or 'becomes hard.' The Hebrew expression is poetic and may refer to the wide surface of the waters becoming solid.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 숨결에서 얼음이 생기고, 넓게 펼쳐진 물은 단단히 굳어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 숨결로 얼음이 생깁니다.’ 히브리어 전치사는 출처(‘~에서’)나 수단(‘~로’)을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘물의 넓이가 굳어집니다’ 또는 ‘물의 넓은 표면이 단단해집니다.’ 이 히브리어 표현은 시적으로 넓게 펼쳐진 물이 굳는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  english_pob_choice: From the breath of
  chosen_korean: 하나님의 숨결로
  alternatives_korean:
  - 하나님의 호흡으로
  - 하나님의 숨결에서
  lexicon: HALOT
  rationale: נִשְׁמָה는 구체적으로 ‘숨결/호흡’을 뜻하며, 전치사 מִן은 출처 또는 수단을 나타낼 수 있습니다. 한국어에서는 ‘~로’가 수단·원인을 자연스럽게 살리므로 시적 이미지도 함께 유지합니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님의
  - 전능하신 하나님의
  lexicon: HALOT
  rationale: אֵל은 여기서 일반적인 신적 호칭이므로, 확장하지 않고 기본적으로 ‘하나님’으로 옮기되 소유격 형태로 연결했습니다.
- source_word: וְרֹחַב מַיִם
  english_pob_choice: the broad expanse of waters
  chosen_korean: 물의 넓은 면
  alternatives_korean:
  - 물의 넓은 펼침
  - 물의 광활한 면
  lexicon: HALOT
  rationale: רֹחַב은 단순한 ‘폭’보다 넓게 펼쳐진 면적을 가리키므로, 물의 표면이 얼어붙는 시적 문맥을 살려 ‘넓은 면’으로 옮겼습니다.
- source_word: בְּמוּצָק
  english_pob_choice: is frozen solid
  chosen_korean: 단단하게 얼어붙습니다
  alternatives_korean:
  - 굳어집니다
  - 얼음처럼 굳어집니다
  - 단단히 굳어집니다
  lexicon: HALOT
  rationale: מוּצָק은 ‘굳다/단단해지다’의 뜻을 가지며, 여기서는 기상적 문맥상 물이 실제로 얼어 단단해지는 상태를 가리킵니다. ‘얼어붙습니다’가 기본 뜻을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: יהוה가 아닌 אֵל의 번역 범위
  chosen_reading: 여기서는 특정한 언약 სახელ칭이 아니라 일반적인 신적 호칭이므로 ‘하나님’으로 번역합니다.
  alternative_readings:
  - 야훼
  - 전능하신 하나님
  rationale: 본문의 אֵל은 문맥상 일반 명칭이며, YHWH 대체 표기가 필요한 경우가 아닙니다. 따라서 신학적 과잉지정 없이 원문 호칭의 범위를 유지합니다.
  doctrine_reference: 신명기적 신명 호칭의 문맥 구분
