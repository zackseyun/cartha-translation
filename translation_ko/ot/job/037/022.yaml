  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: ko
  text: 북쪽에서 금빛 찬란함이 옵니다. 하나님 주위에는 두려운 위엄이 있습니다.
  philosophy: formal
lexical_decisions:
- source_word: מִצָּפוֹן
  english_pob_choice: From the north
  chosen_korean: 북쪽에서
  alternatives_korean:
  - 북에서
  - 북방에서
  lexicon: צָפוֹן
  rationale: 방향 출처를 자연스럽게 나타내기 위해 ‘~에서’를 썼으며, 시적 문맥에서도 직설적인 공간 기원을 유지했습니다.
- source_word: זָהָב
  english_pob_choice: golden splendor
  chosen_korean: 금빛 찬란함
  alternatives_korean:
  - 황금의 영광
  - 금빛 영광
  - 황금 찬란함
  lexicon: זָהָב
  rationale: ‘golden’의 색채와 광휘를 함께 살리면서, 영어 POB의 ‘splendor’가 가리키는 눈부신 광채를 한국어에서 과장되지 않게 옮겼습니다.
- source_word: אֱל֗וֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: אֱלוֹהַּ
  rationale: 시편·욥기의 신명칭으로서 한국어 성경 전통과 가독성을 고려해 ‘하나님’을 택했습니다.
- source_word: נ֣וֹרָא
  english_pob_choice: awesome
  chosen_korean: 두려운
  alternatives_korean:
  - 경외로운
  - 위엄 있는
  - 엄위로운
  lexicon: נוֹרָא
  rationale: 문맥상 단순한 아름다움보다 경외와 두려움을 일으키는 성격이 핵심이므로, ‘awesome’의 경외적·엄정한 뉘앙스를 ‘두려운’으로 직접 반영했습니다.
- source_word: הוֹד
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 영광
  - 존귀
  - 장엄
  lexicon: הוֹד
  rationale: ‘majesty’의 통치적 품위와 장중함을 가장 직접적으로 드러내는 기본어로 ‘위엄’을 선택했습니다.
theological_decisions:
- issue: נורא와 הוֹד의 결합이 만들어내는 하나님의 현현 묘사
  chosen_reading: ‘두려운 위엄’으로 옮겨, 아름다움과 경외가 함께 서는 하나님의 현현을 유지했습니다.
  alternative_readings:
  - ‘경외로운 장엄함’
  - ‘엄위로운 영광’
  rationale: 본문은 단순 미학이 아니라 하나님 앞에서의 경외를 강조하므로, 부드럽게 미화하기보다 두려움과 위엄의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 거룩하심과 초월성
- issue: מִצָּפוֹן의 시적 방향성과 하나님의 권능의 현현
  chosen_reading: ‘북쪽에서’로 직역성 있게 두어, 자연현상처럼 보이는 광휘가 하나님의 통치 아래 있음을 드러냈습니다.
  alternative_readings:
  - ‘북방에서’
  - ‘북에서’
  rationale: 시적 공간표현을 지나치게 상징화하지 않고, 본문이 제시하는 관찰형 진술을 살렸습니다.
  doctrine_reference: 창조 세계 속에서 드러나는 하나님의 주권
