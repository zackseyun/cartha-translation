source:
  edition: WLC
  text: שָׁ֣ם רְ֭שָׁעִים חָ֣דְלוּ רֹ֑גֶז וְ/שָׁ֥ם יָ֝נ֗וּחוּ יְגִ֣יעֵי כֹֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
  footnotes:
  - marker: a
    text: Or 'agitation,' 'rage,' or 'unrest' for 'turmoil.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the weary of strength,' that is, those exhausted of strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에서는 악인들이 소란을 그치고, 거기에서는 기력에 지친 자들이 쉼을 얻습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘turmoil’에 해당하는 말은 문맥상 ‘동요’, ‘격동’, ‘소란’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기력의 지친 자들’이며, 곧 기력이 다해 지친 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There / and there
  chosen_korean: 거기에서는
  alternatives_korean:
  - 그곳에서는
  - 거기서
  lexicon: HALOT
  rationale: 두 번 반복되는 장소 부사를 한국어에서도 그대로 살려, 대비와 병렬 구조를 유지했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 죄인들
  lexicon: HALOT
  rationale: 도덕적으로 악한 부류를 가리키는 집합명사로 이해하여, 간결하고 직접적인 ‘악인들’로 옮겼습니다.
- source_word: רֹגֶז
  english_pob_choice: turmoil
  chosen_korean: 소란
  alternatives_korean:
  - 동요
  - 격동
  - 분주함
  lexicon: HALOT
  rationale: ‘turmoil’이 뜻하는 불안정하고 요동치는 상태를 자연스러운 현대 한국어의 ‘소란’으로 옮겨, 정서적 ‘분노’로 좁히지 않았습니다.
- source_word: יְגִיעֵי כֹחַ
  english_pob_choice: those weary in strength / literally, 'the weary of strength'
  chosen_korean: 기력에 지친 자들
  alternatives_korean:
  - 힘이 다한 자들
  - 힘에 지친 자들
  - 기력이 쇠한 자들
  lexicon: HALOT
  rationale: 직역성만 살리면 부자연스러우므로, ‘strength’의 의미를 드러내는 ‘기력’과 피로 상태를 나타내는 ‘지친 자들’을 결합했습니다.
theological_decisions:
- issue: ‘소란’으로 번역된 רֹגֶז의 정서 범위
  chosen_reading: 이 단어를 단순한 분노가 아니라 불안정과 소요를 포함한 상태로 이해해 옮겼습니다.
  alternative_readings:
  - 분노
  - 동요
  - 불안
  rationale: 문맥상 죽음의 안식과 대비되는 삶의 요동을 가리키므로, 감정 하나로 축소하지 않고 포괄적 상태를 반영했습니다.
  doctrine_reference: 문맥 주도 번역 원칙
