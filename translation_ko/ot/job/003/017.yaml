translation:
  language: ko
  text: 거기에서는 악인들이 소란을 그치고[a], 거기에서는 기력에 지친 자들이 쉼을 얻습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소란’으로 옮긴 말은 문맥상 ‘동요’, ‘격동’, ‘불안’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기력의 지친 자들’이며, 곧 기력이 다해 지친 사람들을 뜻합니다.
    reason: lexical_alternative
