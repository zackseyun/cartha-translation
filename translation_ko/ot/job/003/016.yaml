  - 나는 존재하지 않을 것이며
  - 나는 되지 않았을 것이며
  lexicon: HALOT
  rationale: 문맥상 생존 부재가 아니라 ‘세상에 들어오지 못한 비존재’를 가리키므로, 합쇼체 문장 안에서 의미를 분명히 드러내는 ‘존재하지 않았을 것이며’를 선택했습니다.
- source_word: כְ/עֹלְלִים
  english_pob_choice: like infants
  chosen_korean: 아기들처럼
  alternatives_korean:
  - 유아들처럼
  - 갓난아이들처럼
  - 아기들처럼
  lexicon: HALOT
  rationale: עֹלְלִים은 아주 어린 아이들을 뜻하므로, 한국어에서 가장 자연스럽고 직관적인 ‘아기들’이 적절합니다.
- source_word: לֹא רָאוּ אוֹר
  english_pob_choice: who never saw light
  chosen_korean: 빛을 보지 못한
  alternatives_korean:
  - 빛을 본 적이 없는
  - 세상 빛을 보지 못한
  - 빛을 보지 못한
  lexicon: HALOT
  rationale: ‘빛을 보다’는 히브리어 관용구로 생을 경험하다/세상에 들어오다를 뜻하므로, 관용을 살린 ‘빛을 보지 못한’으로 옮겼습니다.
theological_decisions:
- issue: 욥의 비유가 의도하는 생명 부재의 강도
  chosen_reading: 원문의 비유를 유지하면서도, 아기가 세상에 들어오지 못한 비극적 이미지를 한국어로 분명하게 드러냈습니다.
  alternative_readings:
  - 직역에 가까운 ‘사산아처럼’
  - 더 완화된 ‘태어나지 못한 아이처럼’
  rationale: 이 구절은 욥의 존재 부정 소망을 시적으로 표현하므로, 지나치게 완곡하게 만들기보다 원문이 주는 상실감과 비존재의 강도를 보존하는 것이 중요합니다.
  doctrine_reference: 인간 존재와 고난에 대한 욥기의 시적 진술
