id: JOB.3.16
reference: Job 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
  footnotes:
  - marker: a
    text: Or 'like a stillborn child.' The Hebrew noun can refer to a miscarriage or stillbirth; both convey the idea of one who never comes to live in the world.
    reason: lexical_alternative
  - marker: b
    text: Literally 'did not see light,' a Hebrew expression for not entering or experiencing earthly life.
    reason: cultural_note
translation:
  language: ko
  text: 혹은 숨겨진 유산처럼, 나는 존재하지 않았을 것이며, 빛을 보지 못한 아기들처럼 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유산’은 כאן의 נפל이 가리킬 수 있는 의미를 현대 한국어로 자연스럽게 드러냅니다. 문맥상 ‘사산’도 가능하지만, 본문에는 더 포괄적인 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빛을 보지 못한’은 히브리어 관용구로, 단순한 시각의 부재가 아니라 세상 생명을 경험하지 못했다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְ/נֵפֶל
  english_pob_choice: like a hidden miscarriage
  chosen_korean: 숨겨진 유산처럼
  alternatives_korean:
  - 유산처럼
  - 숨겨진 유산처럼
  - 사산아처럼
  lexicon: HALOT
  rationale: נפל은 유산 또는 사산의 이미지를 가리킬 수 있어, 한국어에서는 지나치게 의학적이거나 오해의 소지가 큰 표현보다 ‘유산’이 원문 이미지와 현대 독자 이해를 함께 살립니다.
- source_word: טָמוּן
  english_pob_choice: hidden
  chosen_korean: 숨겨진
  alternatives_korean:
  - 감춰진
  - 묻힌
  - 은폐된
  lexicon: HALOT
  rationale: טמן의 수동 분사로서 ‘숨겨진’이 매장 암시를 과도하게 특정하지 않으면서도 감추어진 상태를 자연스럽게 옮깁니다.
- source_word: לֹא אֶהְיֶה
  english_pob_choice: I would not be
  chosen_korean: 나는 존재하지 않았을 것이며
  alternatives_korean:
  - 나는 있지 않았을 것이며
  - 나는 존재하지 않을 것이며
  - 나는 되지 않았을 것이며
  lexicon: HALOT
  rationale: 문맥상 생존 부재가 아니라 ‘세상에 들어오지 못한 비존재’를 가리키므로, 합쇼체 문장 안에서 의미를 분명히 드러내는 ‘존재하지 않았을 것이며’를 선택했습니다.
- source_word: כְ/עֹלְלִים
  english_pob_choice: like infants
  chosen_korean: 아기들처럼
  alternatives_korean:
  - 유아들처럼
  - 갓난아이들처럼
  - 아기들처럼
  lexicon: HALOT
  rationale: עֹלְלִים은 아주 어린 아이들을 뜻하므로, 한국어에서 가장 자연스럽고 직관적인 ‘아기들’이 적절합니다.
- source_word: לֹא רָאוּ אוֹר
  english_pob_choice: who never saw light
  chosen_korean: 빛을 보지 못한
  alternatives_korean:
  - 빛을 본 적이 없는
  - 세상 빛을 보지 못한
  - 빛을 보지 못한
  lexicon: HALOT
  rationale: ‘빛을 보다’는 히브리어 관용구로 생을 경험하다/세상에 들어오다를 뜻하므로, 관용을 살린 ‘빛을 보지 못한’으로 옮겼습니다.
theological_decisions:
- issue: 욥의 비유가 의도하는 생명 부재의 강도
  chosen_reading: 원문의 비유를 유지하면서도, 아기가 세상에 들어오지 못한 비극적 이미지를 한국어로 분명하게 드러냈습니다.
  alternative_readings:
  - 직역에 가까운 ‘사산아처럼’
  - 더 완화된 ‘태어나지 못한 아이처럼’
  rationale: 이 구절은 욥의 존재 부정 소망을 시적으로 표현하므로, 지나치게 완곡하게 만들기보다 원문이 주는 상실감과 비존재의 강도를 보존하는 것이 중요합니다.
  doctrine_reference: 인간 존재와 고난에 대한 욥기의 시적 진술
