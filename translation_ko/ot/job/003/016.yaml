  lexicon: HALOT
  rationale: נפל은 유산 또는 사산의 이미지를 가리킬 수 있어, 한국어에서는 지나치게 의학적이거나 오해의 소지가 큰 표현보다 ‘유산’이 원문 이미지와 현대 독자 이해를 함께 살립니다.
- source_word: טָמוּן
  english_pob_choice: hidden
  chosen_korean: 숨겨진
  alternatives_korean:
  - 감춰진
  - 묻힌
  - 은폐된
  lexicon: HALOT
  rationale: טמן의 수동 분사로서 ‘숨겨진’이 매장 암시를 과도하게 특정하지 않으면서도 감추어진 상태를 자연스럽게 옮깁니다.
- source_word: לֹא אֶהְיֶה
  english_pob_choice: I would not be
  chosen_korean: 나는 존재하지 않았을 것이며
  alternatives_korean:
