id: JOB.3.16
reference: Job 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
  footnotes:
  - marker: a
    text: Or 'like a stillborn child.' The Hebrew noun can refer to a miscarriage or stillbirth; both convey the idea of one who never comes to live in the world.
    reason: lexical_alternative
  - marker: b
    text: Literally 'did not see light,' a Hebrew expression for not entering or experiencing earthly life.
    reason: cultural_note
translation:
  language: ko
  text: 혹은 감추어진 유산아처럼, 빛을 보지 못한 아기들처럼, 나는 존재하지 않았을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유산아’는 히브리어 נֵפֶל이 가리킬 수 있는 유산되었거나 사산된 아이를 뜻합니다. 문맥상 ‘사산아’도 가능하지만, 본문에서는 의미를 한정하지 않는 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빛을 보지 못한’은 세상에 태어나거나 세상 생명을 경험하지 못했다는 뜻을 나타내는 히브리어 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְ/נֵפֶל
  english_pob_choice: like a hidden miscarriage
  chosen_korean: 숨겨진 유산처럼
  alternatives_korean:
