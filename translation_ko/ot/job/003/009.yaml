  naturalness: ‘그 밤’으로 지시 대상을 밝혀 자연스럽게 연결하고, 병렬된 저주를 ‘-기를 바랍니다’로 통일했습니다. ‘그 밤의 황혼의 별들’은 히브리어의 소유·연계 구조를 다소 시적으로 보존한 표현입니다.
  terminology: ‘황혼’, ‘빛’, ‘새벽의 눈꺼풀’을 유지했습니다. ‘눈꺼풀’은 한국어에서 집합적·시적 용법으로 자연스러우므로 복수형을 별도로 표시하지 않았습니다.
