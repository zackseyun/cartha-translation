id: JOB.3.9
reference: Job 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֶחְשְׁכוּ֮ כּוֹכְבֵ֪י נִ֫שְׁפּ֥/וֹ יְקַו לְ/א֥וֹר וָ/אַ֑יִן וְ/אַל יִ֝רְאֶ֗ה בְּ/עַפְעַפֵּי שָֽׁחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
  footnotes:
  - marker: a
    text: Or 'the stars of its dusk.' The Hebrew noun can denote twilight, especially evening twilight.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the eyelids of dawn,' a Hebrew poetic image for the first appearance of morning light.
    reason: cultural_note
translation:
  language: ko
  text: 그의 황혼의 별들이 어두워지기를 바랍니다[a]. 그가 빛을 기다려도 없게 하시고[b], 새벽의 눈꺼풀도 보지 못하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 해질녘의 별들’. 히브리어 명사는 특히 저녁 황혼을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘새벽의 눈꺼풀들’입니다. 히브리어 시어로서 새벽이 처음 드러나는 모습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  english_pob_choice: be dark
  chosen_korean: 어두워지기를 바랍니다
  alternatives_korean:
  - 어둡기를 바랍니다
  - 어두워지게 하소서
  lexicon: HALOT
  rationale: 저주의 소망을 나타내는 jussive 맥락이므로 ‘어두워지다’의 소망형으로 옮기고, 현대 한국어에서 자연스럽고 문체도 유지했습니다.
- source_word: נִשְׁפּוֹ
  english_pob_choice: its twilight
  chosen_korean: 그의 황혼
  alternatives_korean:
  - 그의 저녁
  - 그의 해질녘
  lexicon: HALOT
  rationale: 이 명사는 특히 저녁 황혼을 가리킬 수 있으므로, 시적 등록을 살리면서도 suffix의 소유관계를 반영해 ‘그의 황혼’으로 옮겼습니다.
- source_word: יְקַו לְאוֹר וָאַיִן
  english_pob_choice: may it wait for light, but there be none
  chosen_korean: 그가 빛을 기다려도 없게 하시고
  alternatives_korean:
  - 그가 빛을 바라 기다려도 없게 하시고
  - 빛을 기다리되 없게 하시고
  lexicon: HALOT
  rationale: קוה는 ‘기다리다/바라다’가 가능하지만, 앞의 절과 병행되는 기대의 좌절을 살려 ‘기다리다’로 옮겼습니다. ‘없게 하시고’는 ‘but there be none’의 결핍을 간결하게 반영합니다.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  english_pob_choice: the eyelids of dawn
  chosen_korean: 새벽의 눈꺼풀
  alternatives_korean:
  - 새벽의 눈꺼풀들
  - 새벽의 눈꺼풀 같은 빛
  lexicon: HALOT
  rationale: ‘눈꺼풀’의 문자적 이미지를 유지해 히브리어의 시적 은유를 보존했습니다. ‘새벽’은 שָׁחַר의 표준적인 시어를 반영합니다.
theological_decisions:
- issue: 저주 시의 합쇼체와 3인칭 대상 표현
  chosen_reading: 직접 하나님께 말하는 기도체가 아니라 욥의 저주 발화이므로, 현대 합쇼체를 유지하되 내용어는 원문의 저주 강도를 약화시키지 않도록 옮겼습니다.
  alternative_readings:
  - 평서체로 완화하는 번역
  - 기도문식 -옵소서로 전면 통일
  rationale: 본문은 탄원이나 경배가 아니라 탄식 속 저주이므로, 한국어 문체는 공손하지만 의미상 강한 소망/저주를 그대로 드러내야 합니다.
  doctrine_reference: Job 3의 시적-수사적 발화 양식
