theological_decisions:
- issue: 시편식 탄식 문장의 어조와 직설성
  chosen_reading: 욥의 원망 섞인 수사적 질문을 완화하지 않고 그대로 살려, 고통 속의 생존 자체를 탄식하는 말투로 유지했습니다.
  alternative_readings:
  - 보다 부드럽게 감정만 표현하는 서술형
  - ‘태어나지 않았더라면’ 같은 의미 중심의 완곡 표현
  rationale: 본문은 태어남 자체를 저주하는 강한 탄식이므로, 의미를 순화하지 않고 질문 형식과 절박한 어조를 보존하는 것이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 욥기 3장의 탄식/지혜 문학적 정직성
