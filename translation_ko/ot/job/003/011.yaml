  yaml_path: translation/ot/job/003/011.yaml
  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
  footnotes:
  - marker: a
    text: Or 'from the womb ... from the belly'; the Hebrew uses two related but distinct maternal-body terms in parallel.
    reason: lexical_alternative
  - marker: b
    text: Or 'and die' or 'and breathe my last'; the verb here is distinct from the earlier 'die' and may emphasize expiring.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 나는 태에서 죽지 않았으며, 배에서 나와 숨을 거두지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘태’와 ‘배’라는 서로 관련되지만 다른 두 모체 용어를 평행으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 앞의 ‘죽다’와 구별되는 말로, ‘숨을 거두다’처럼 ‘숨지다/expire’의 뉘앙스를 띱니다.
    reason: lexical_alternative
