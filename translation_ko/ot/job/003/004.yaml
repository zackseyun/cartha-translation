    reason: lexical_alternative
translation:
  language: ko
  text: 그 날이 어둠이 되기를 바랍니다. 위에 계신 하나님께서 그 날을 찾지 않으시고[a], 빛이 그 위에 비치지 않기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 날을 살피지 않으시고’ 또는 ‘그 날을 돌보지 않으시고’. 히브리어 동사는 ‘찾다, 살피다, 돌보다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광명’ 또는 ‘밝음’.
    reason: lexical_alternative
