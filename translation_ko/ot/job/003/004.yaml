  rationale: 미완결 연결형 ‘바라며’를 완결된 기원문으로 고쳐 히브리어의 세 병렬 소망절을 분명히 했습니다. ‘위에 계신 하나님’은 מִמָּעַל의 공간적 표현과 אֱלוֹהַּ의 직접 언급을 모두 보존합니다. 각주 a를 יִדְרְשֵׁהוּ에, 각주 b를 נְהָרָה에 각각 연결하여 앵커와 내용의 불일치를 해소했습니다.
