reference: Job 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יּ֥וֹם הַ/ה֗וּא יְֽהִ֫י חֹ֥שֶׁךְ אַֽל יִדְרְשֵׁ֣/הוּ אֱל֣וֹהַּ מִ/מָּ֑עַל וְ/אַל תּוֹפַ֖ע עָלָ֣י/ו נְהָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
  footnotes:
  - marker: a
    text: Or 'may God from above not seek it'; the Hebrew verb can carry the sense of seeking, attending to, or caring for.
    reason: lexical_alternative
  - marker: b
    text: Or 'brightness' or 'radiance' for 'light.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날이 어둠이 되기를 바라며[a], 위에서 하나님께서 그것을 찾지 않으시고, 그 위에 빛이 비치지 않기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 날이 어둠이 되기를’; 히브리어 동사는 ‘찾다, 살피다, 돌보다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광명’, ‘밝음’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  english_pob_choice: May ... be
  chosen_korean: 되기를 바라며
  alternatives_korean:
  - 되게 하십시오
  - 있기를 바랍니다
  lexicon: HALOT
  rationale: जussive의 소망·저주적 뉘앙스를 현대 한국어의 기원형으로 살렸습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 암흑
  lexicon: HALOT
  rationale: 명사로서의 ‘어둠’을 자연스럽게 살리되, 지나치게 문어적인 ‘흑암’은 피했습니다.
- source_word: יִדְרְשֵׁהוּ
  english_pob_choice: seek it
  chosen_korean: 그것을 찾지 않으시고
  alternatives_korean:
  - 그것을 찾지 않으시며
  - 그것을 돌보지 않으시고
  - 그것을 살피지 않으시고
  lexicon: HALOT
  rationale: דרש의 ‘찾다/구하다’ 이미지를 살리면서, 문맥상 ‘관심을 두다’의 뜻도 열어 두었습니다.
- source_word: נְהָרָה
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 밝음
  lexicon: HALOT
  rationale: 평행 구조에서 가장 자연스러운 대응어로 ‘빛’을 택했습니다.
theological_decisions:
- issue: 하나님에 대한 직접 언급을 완화할지 여부
  chosen_reading: ‘위에서 하나님께서’로 직접 번역해, 본문의 직설적 탄원을 유지했습니다.
  alternative_readings:
  - 하늘 위에서
  - 위로부터
  rationale: 히브리어의 אֱלוֹהַּ를 완곡하게 바꾸지 않고, 욥의 강한 애도와 저주의 어조를 그대로 드러내기 위해서입니다.
  doctrine_reference: Translation philosophy §1, §3
