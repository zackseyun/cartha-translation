source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֣י לַ֭חְמִ/י אַנְחָתִ֣/י תָבֹ֑א וַֽ/יִּתְּכ֥וּ כַ֝/מַּ֗יִם שַׁאֲגֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
  footnotes:
  - marker: a
    text: Or 'my food'; Hebrew 'my bread' can stand more broadly for what one eats.
    reason: lexical_alternative
  - marker: b
    text: Or 'my roarings'; the Hebrew term can evoke a loud, animal-like cry, intensifying Job's anguish.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 빵[a]보다 먼저 내 신음이 나오고, 내 울부짖음[b]은 물처럼 쏟아져 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 음식’; 히브리어 ‘내 빵’은 더 넓게 먹는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 포효’; 히브리어는 야수 같은 거친 외침을 떠올리게 하며, 욥의 고통을 더욱 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמִי
  english_pob_choice: my bread
  chosen_korean: 내 음식
  alternatives_korean:
  - 내 빵
  - 내 양식
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로는 ‘빵’이지만 먹는 것을 넓게 가리킬 수 있어, 문맥의 자연스러움과 POB의 각주 취지를 살려 ‘음식’으로 옮겼습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 보다 먼저
  alternatives_korean:
  - 앞서
  - 전에
  lexicon: HALOT
  rationale: 여기서는 시름의 상태가 식사보다 앞선다는 시간적 관계를 나타내므로, 한국어에서는 ‘보다 먼저’가 가장 분명합니다.
- source_word: אַנְחָתִי
  english_pob_choice: my sighing
  chosen_korean: 내 신음
  alternatives_korean:
  - 내 탄식
  - 내 한숨
  lexicon: HALOT
  rationale: אַנְחָה는 고통에서 나온 탄식·신음을 뜻하므로, 감정적 무게를 살리는 ‘신음’이 적절합니다.
- source_word: שַׁאֲגֹתַי
  english_pob_choice: my groanings
  chosen_korean: 내 울부짖음
  alternatives_korean:
  - 내 포효
  - 내 부르짖음
  - 내 신음들
  lexicon: HALOT
  rationale: שׁאג는 단순한 탄식보다 더 거칠고 동물적인 울부짖음을 가리킬 수 있어, 본문의 강도를 살리기 위해 ‘울부짖음’으로 옮겼습니다.
theological_decisions:
- issue: 시적 과장의 강도 유지
  chosen_reading: ‘울부짖음’으로 번역해 고통의 동물적·거친 이미지를 유지했습니다.
  alternative_readings:
  - ‘탄식’으로 완화
  - ‘부르짖음’으로 일반화
  rationale: 욥기의 탄식시는 고통의 과장을 약화시키지 않는 것이 중요하므로, 어감이 더 강한 표현을 선택했습니다.
  doctrine_reference: 욥기의 시적 탄식과 lament의 수사적 강도
