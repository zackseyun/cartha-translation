reference: Job 3:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א שָׁלַ֨וְתִּי וְ/לֹ֖א שָׁקַ֥טְתִּי וְֽ/לֹא נָ֗חְתִּי וַ/יָּ֥בֹא רֹֽגֶז׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
  footnotes:
  - marker: a
    text: Or 'I was not at peace ... I was not calm ... I did not rest.' The Hebrew uses three near-parallel verbs to intensify Job's lack of relief.
    reason: lexical_alternative
  - marker: b
    text: Or 'trouble came' or 'agitation came.' The noun can denote disturbance, unrest, or turmoil.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 평안하지도 않았고, 조용하지도 않았으며, 쉬지도 못했는데, 격동이 찾아왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 세 동사는 서로 가까운 뜻을 반복하며, ‘평안하지도 않았다 / 고요하지도 않았다 / 쉬지도 못했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: רֹגֶז는 ‘문란함’, ‘요동’, ‘불안’, ‘소동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  english_pob_choice: I was at ease
  chosen_korean: 평안하지도 않았고
  alternatives_korean:
  - 편안하지도 않았고
  - 안정되지도 않았고
  - 평온하지도 않았고
  lexicon: HALOT
  rationale: שׁלה/שׁלו의 ‘ease, tranquility, undisturbed security’에 해당하는 상태를 한국어에서 가장 자연스럽게 ‘평안’으로 옮겨, 감정적·상황적 안정을 함께 드러냈습니다.
- source_word: שָׁקַטְתִּי
  english_pob_choice: I was quiet
  chosen_korean: 조용하지도 않았으며
  alternatives_korean:
  - 고요하지도 않았으며
  - 잠잠하지도 않았으며
  - 차분하지도 않았으며
  lexicon: HALOT
  rationale: שׁקט의 ‘quietness, freedom from disturbance’를 살리면서 앞 절과 구별되는 병렬성을 유지하도록 ‘조용하다’를 택했습니다.
- source_word: נָחְתִּי
  english_pob_choice: I was at rest
  chosen_korean: 쉬지도 못했는데
  alternatives_korean:
  - 휴식하지도 못했는데
  - 안식하지도 못했는데
  - 가만히 있지도 못했는데
  lexicon: HALOT
  rationale: נוח의 ‘rest, settle down’는 단순 과거보다 ‘쉼을 얻지 못함’이 더 자연스럽고, 욥의 절망적 상태를 더 분명히 드러냅니다.
- source_word: רֹגֶז
  english_pob_choice: turmoil
  chosen_korean: 격동
  alternatives_korean:
  - 혼란
  - 요동
  - 불안
  lexicon: HALOT
  rationale: רֹגֶז는 불안정한 동요·요동·격동을 가리킬 수 있으므로, 문맥상 욥의 내적·외적 뒤흔들림을 압축하는 ‘격동’이 가장 적절합니다.
theological_decisions:
- issue: 세 번 반복되는 부정의 병렬 구조
  chosen_reading: ‘~하지도 않았고, ~하지도 않았으며, ~하지도 못했는데’로 반복을 살려 욥의 누적된 고통을 드러냈습니다.
  alternative_readings:
  - ‘편안하지도, 조용하지도, 쉬지도 못했는데’처럼 압축할 수 있음
  - ‘평안도 없고, 고요도 없고, 쉼도 없었는데’로 명사화할 수 있음
  rationale: 히브리어의 לֹא ... וְלֹא ... וְלֹא ...는 단순 정보 전달보다 탄식의 리듬을 형성하므로, 한국어에서도 반복을 보존하는 편이 원문 효과를 더 충실히 전달합니다.
  doctrine_reference: 시적 평행법과 탄식의 수사
