id: JOB.3.21
reference: Job 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/מְחַכִּ֣ים לַ/מָּ֣וֶת וְ/אֵינֶ֑/נּוּ וַֽ֝/יַּחְפְּרֻ֗/הוּ מִ/מַּטְמוֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/021.yaml
  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
  footnotes:
  - marker: a
    text: Or 'and it is not there'; the Hebrew is literally 'and it is not,' meaning that death does not appear or arrive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 죽음을 기다리지만 죽음은 오지 않으며[a], 숨은 보물을 찾는 것보다도 더 죽음을 찾아 파헤칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것이 없다’이며, 여기서 ‘그것’은 죽음을 가리킵니다. 문맥상 죽음이 나타나거나 이르지 않는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  english_pob_choice: who wait for
  chosen_korean: 기다리지만
  alternatives_korean:
  - 갈망하지만
  - 애타게 기다리지만
  lexicon: HALOT
  rationale: חכה의 기본 뜻은 ‘기다리다’이므로, 기대를 포함하되 과도한 정서 해석은 덜한 ‘기다리지만’이 가장 직접적입니다.
- source_word: לַמָּוֶת
  english_pob_choice: for death
  chosen_korean: 죽음을
  alternatives_korean:
  - 죽음에게
  - 죽음을 향해
  lexicon: HALOT
  rationale: 전치사 ל + 명사 구조를 한국어에서는 목적어 표지로 자연스럽게 옮겨, 기다림의 대상이 죽음임을 분명히 했습니다.
- source_word: וְאֵינֶנּוּ
  english_pob_choice: but it does not come
  chosen_korean: 그것은 오지 않고
  alternatives_korean:
  - 그것은 없고
  - 그것은 거기 있지 않고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그리고 그것은 없다’이지만, 문맥상 죽음이 나타나지 않는다는 뜻이므로 ‘오지 않고’로 자연스럽게 옮겼습니다.
- source_word: וַיַּחְפְּרֻהוּ
  english_pob_choice: and dig for it
  chosen_korean: 그것을 파헤칩니다
  alternatives_korean:
  - 그것을 팝니다
  - 그것을 찾아 파냅니다
  lexicon: HALOT
  rationale: חפר의 기본 의미인 ‘파다’를 살리되, 죽음을 대상으로 한 비유적 탐색을 드러내기 위해 ‘파헤치다’를 택했습니다.
- source_word: מִמַּטְמוֹנִים
  english_pob_choice: more than for hidden treasures
  chosen_korean: 숨은 보물보다 더
  alternatives_korean:
  - 숨겨진 보물보다 더
  - 감춰진 보물보다 더
  lexicon: HALOT
  rationale: מַטְמוֹן의 뜻인 ‘숨겨 둔 보물’을 한국어로 간결하게 살리고, 비교 구조는 ‘~보다 더’로 전달했습니다.
theological_decisions:
- issue: 죽음의 ‘부재’ 표현 처리
  chosen_reading: ‘그것은 오지 않고’로 번역해, 단순한 존재 부정이 아니라 도착/현현의 실패를 드러냈습니다.
  alternative_readings:
  - ‘그것은 없고’
  - ‘거기 있지 않고’
  rationale: 히브리어 וְאֵינֶנּוּ는 문자적으로 ‘그리고 그것은 없다’이지만, 이 절에서는 기다리던 죽음이 나타나지 않는 상황을 말하므로 독자에게 같은 효과를 주는 표현이 적절합니다.
  doctrine_reference: 욥기 3장의 탄식적 시어는 교리 진술이 아니라 경험 묘사이므로, 의미 효과를 우선했습니다.
