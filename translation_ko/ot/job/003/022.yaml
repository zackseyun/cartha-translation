base_translation:
  language: en
  yaml_path: translation/ot/job/003/022.yaml
  text: who rejoice exceedingly[c][b][a], who exult when they find the grave—
  footnotes:
  - marker: a
    text: Or 'who rejoice to exultation'; the Hebrew phrase is an idiomatic intensifier.
    reason: lexical_alternative
  - marker: b
    text: Or 'because they find the grave.' The Hebrew conjunction can be read causally as well as temporally here.
    reason: alternative_reading
  - marker: c
    text: Or 'a grave.' Hebrew קָבֶר may be indefinite, but English idiom often uses 'the grave' generically for death.
    reason: lexical_alternative
translation:
  language: ko
  text: 심히[a] 기뻐하고, 무덤[c]을 찾으면[b] 환호하는 이들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기쁨에 이르도록’이며, 기쁨의 정도를 강조하는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כִּי는 여기서 ‘~할 때’로도 ‘~하기 때문에’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 קָבֶר는 ‘한 무덤’으로도 옮길 수 있으나, 여기서는 죽음의 일반적 종착점으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
