  - 크게 기뻐하는
  lexicon: HALOT
  rationale: 앞의 ‘즐거워하다’보다 한층 고조된 기쁨을 중첩으로 드러내기 위해 ‘기뻐 뛰다’를 택했습니다.
- source_word: קָבֶר
  english_pob_choice: the grave
