source:
  edition: WLC
  text: הַ/שְּׂמֵחִ֥ים אֱלֵי גִ֑יל יָ֝שִׂ֗ישׂוּ כִּ֣י יִמְצְאוּ קָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/022.yaml
  text: who rejoice exceedingly[c][b][a], who exult when they find the grave—
  footnotes:
  - marker: a
    text: Or 'who rejoice to exultation'; the Hebrew phrase is an idiomatic intensifier.
    reason: lexical_alternative
  - marker: b
    text: Or 'because they find the grave.' The Hebrew conjunction can be read causally as well as temporally here.
    reason: alternative_reading
  - marker: c
    text: Or 'a grave.' Hebrew קָבֶר may be indefinite, but English idiom often uses 'the grave' generically for death.
    reason: lexical_alternative
translation:
  language: ko
  text: 애곡하는 자들보다 더욱 심히 즐거워하고, 무덤을 만나면 기뻐 뛰는 자들이니라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기쁨으로/기쁨을 향해 즐거워하는’이라는 관용적 강조입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 כִּי는 여기서 ‘때문에’로도, ‘~할 때’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: קָבֶר는 문맥상 특정한 한 무덤이 아니라 죽음의 일반적 종착점을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  english_pob_choice: who rejoice
  chosen_korean: 즐거워하고
  alternatives_korean:
  - 기뻐하는
  - 즐거워하는 자들
  lexicon: HALOT
  rationale: 분사적 성격을 살리면서도 앞뒤 병렬 구조에 맞게 자연스럽게 풀었습니다.
- source_word: אֱלֵי גִיל
  english_pob_choice: exceedingly
