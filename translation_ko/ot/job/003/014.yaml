    reason: lexical_alternative
lexical_decisions:
- source_word: מְלָכִים
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 임금들
  - 군왕들
  lexicon: 왕
  rationale: 히브리어 복수형을 자연스러운 현대 한국어 복수명사로 옮겼습니다.
- source_word: וְיֹעֲצֵי אָרֶץ
  english_pob_choice: counselors of the earth
  chosen_korean: 땅의 모사들
  alternatives_korean:
  - 땅의 상담자들
  - 세상의 조언자들
  lexicon: 모사
  rationale: יֹעֲצֵי는 단순한 상담자가 아니라 통치에 관여하는 ‘조언자/참모’의 성격이 강하므로, 전통적이지만 의미를 잘 보존하는 ‘모사들’로 옮겼습니다.
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  english_pob_choice: who built ruins for themselves
  chosen_korean: 무너진 곳들을 자기들을 위해 세운 이들
  alternatives_korean:
  - 폐허를 자기들을 위해 세운 이들
  - 황폐한 곳들을 자기들을 위해 세운 이들
  lexicon: 무너진 곳
  rationale: English POB의 ‘ruins’를 따라 파괴된 장소 자체를 가리키는 표현으로 옮겼고, ‘자기들을 위해’는 לָמוֹ의 재귀적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: Job 3:14의 마지막 구가 죽은 자들의 비참한 동료를 묘사하는지 여부
  chosen_reading: 문맥상 죽은 자들이 왕과 조언자들 같은 지위 높은 자들과도 같은 처지에 놓인다는 아이러니를 드러냅니다.
  alternative_readings:
  - 단순한 묘지의 건축을 말하는 것으로 읽을 수 있습니다.
  - ‘폐허’를 긍정적 건축 대상으로 오해할 수 있습니다.
  rationale: 히브리어 본문은 무덤/폐허의 역설적 이미지를 통해 죽음의 평등성을 강조하므로, 이를 완화하지 않고 유지했습니다.
  doctrine_reference: 욥기 3장의 시적 탄식과 죽음의 보편성
