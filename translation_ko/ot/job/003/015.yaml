translation:
  language: ko
  text: 혹은 금을 가진 통치자들— 은으로 그들의 집을 가득 채운 자들과 함께였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통치자들’은 שָׂרִים의 가능한 번역 가운데 하나이며, 문맥상 ‘귀족들’이나 ‘지도자들’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘그들의 집’이라고 하며, 문맥상 ‘궁전’으로 볼 수 있지만 원문보다 더 구체적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 통치자들
  alternatives_korean:
  - 왕자들
  - 지도자들
  - 귀족들
  lexicon: HALOT
  rationale: 문맥상 높이 자리한 권력자를 가리키는 말이므로, 한국어에서는 신분적 오해가 적은 ‘통치자들’이 가장 자연스럽고, POB의 ‘princes’가 담는 위상도 유지합니다.
- source_word: זָהָב לָהֶם
  english_pob_choice: who had gold
  chosen_korean: 금을 가진
  alternatives_korean:
