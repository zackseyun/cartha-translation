  - 금이 그들에게 있는
  - 금 소유한
  lexicon: HALOT
  rationale: 소유를 나타내는 관용적 구문이므로, 직역투를 피하면서도 소유 관계를 분명히 하는 ‘금을 가진’으로 옮겼습니다.
- source_word: בָּתֵּיהֶם
  english_pob_choice: their houses
  chosen_korean: 그들의 집
  alternatives_korean:
  - 그들의 궁전
  - 그들의 저택
  - 그들의 집들
  lexicon: HALOT
  rationale: 원어는 단순히 ‘집들’이므로, POB의 주석처럼 ‘궁전’으로 구체화하지 않고 기본 의미를 살렸습니다.
- source_word: כָּסֶף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  - 은으로
  lexicon: HALOT
  rationale: 부유함의 시각적 이미지를 살리기 위해 일반적 금속명인 ‘은’으로 옮겼고, ‘돈’처럼 추상화하지 않았습니다.
