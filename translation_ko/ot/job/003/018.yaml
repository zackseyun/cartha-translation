lexical_decisions:
- source_word: יַחַד
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 모두
  - 한데
  lexicon: HALOT
  rationale: 감옥에 갇힌 이들이 공동으로 누리는 상태를 자연스럽게 나타내는 가장 직접적인 대응입니다.
- source_word: אֲסִירִים
  english_pob_choice: the prisoners
  chosen_korean: 죄수들
  alternatives_korean:
