review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 אֲסִירִים는 유죄 판결을 받은 사람이라는 뜻을 내포할 수 있는 ‘죄수들’보다 중립적인 ‘갇힌 이들’이 더 정확합니다. נֹגֵשׂ는 강제 노동의 감독자, 독촉자, 압박하는 자를 폭넓게 가리키므로 ‘부리는 자’와 각주 대안이 적절히 그 범위를 보존합니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘함께 편안합니다’도 이해되지만 ‘함께 편안히 지내며’가 상태의 지속과 두 절의 연결을 더 매끄럽게 나타냅니다.
  terminology: ‘갇힌 이들’은 원문의 중립적인 ‘포로/수감자들’ 의미를 살립니다. ‘부리는 자’는 특정 제도나 신분을 과도하게 한정하지 않으면서 נֹגֵשׂ의 억압적·강제적 역할을 전달합니다.
  issues:
