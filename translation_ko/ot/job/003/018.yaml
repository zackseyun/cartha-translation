  - 갇힌 자들
  lexicon: HALOT
  rationale: 문맥상 구금된 사람들을 가리키므로 현대 한국어에서 즉시 이해되는 표현을 택했습니다.
- source_word: שַׁאֲנָנוּ
  english_pob_choice: are at ease
  chosen_korean: 편안합니다
  alternatives_korean:
  - 평안합니다
  - 고요합니다
  - 안온합니다
  lexicon: HALOT
  rationale: 단순한 '휴식'보다, 외적 압박이 사라진 안정된 상태를 담는 표현으로 읽었습니다.
- source_word: נֹגֵשׂ
  english_pob_choice: the taskmaster
  chosen_korean: 압제자
  alternatives_korean:
  - 독촉하는 자
  - 부리는 자
  - 가혹한 감독
  lexicon: HALOT
  rationale: HALOT 범주상 '억누르고 몰아붙이는 자'의 의미가 핵심이므로, 한국어로는 기능을 분명히 드러내는 '압제자'가 가장 적절합니다.
theological_decisions:
- issue: 죽음/스올의 상태를 묘사하는 시적 현재 표현
  chosen_reading: 현재형으로 번역해, 죽은 자들의 상태가 '그곳에서' 지속되는 모습으로 읽히게 했습니다.
  alternative_readings:
  - 과거형으로 옮겨 '듣지 못했다'로 처리할 수 있음
  - 미래적/일반적 진술로 완화할 수 있음
  rationale: 히브리어 완료형이 시적 문맥에서 결과 상태를 나타낼 수 있으므로, 영어 POB의 판단을 따라 현재적 상태를 유지했습니다.
  doctrine_reference: 시적·서사적 시제 해석
