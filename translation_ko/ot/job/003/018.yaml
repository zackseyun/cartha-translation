    issue: ‘죄수들’은 אֲסִירִים의 의미를 불필요하게 좁힐 수 있습니다.
    rationale: 히브리어는 일반적으로 갇히거나 결박된 이들을 뜻하며, 범죄로 유죄 판결을 받은 죄수로 한정하지 않습니다.
  - severity: medium
    issue: 각주 표지가 ‘편안합니다’에 붙어 있으나, 각주 내용은 נֹגֵשׂ에 관한 어휘 대안입니다.
    rationale: 각주 표지는 대안 번역이 적용되는 ‘부리는 자’에 붙어야 합니다.
  revised_text: 거기에서는 갇힌 이들이 함께 편안히 지내며, 부리는 자[a]의 목소리를 듣지 않습니다.
