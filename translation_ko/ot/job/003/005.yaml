id: JOB.3.5
reference: Job 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
  footnotes:
  - marker: a
    text: Or 'death-shadow' or 'deep darkness' for צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the blacknesses of the day' is difficult; it may also mean 'the day's blackness,' 'eclipses of the day,' or less likely 'the bitternesses of the day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠과 깊은 그늘이 그것을 되찾아가고, 구름이 그것 위에 머물며, 날의 캄캄함들이 그것을 두렵게 하기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 그림자’, ‘깊은 어둠’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 매우 난해하여, ‘날의 검은 어둠들’, ‘날의 어두움’, ‘일식들’, 또는 덜 가능하지만 ‘날의 쓰디쓴 것들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  english_pob_choice: reclaim it
  chosen_korean: 되찾아가고
  alternatives_korean:
  - 되찾고
  - 거두어가고
  - 구속하고
  lexicon: HALOT
  rationale: גאל의 핵심을 ‘자기에게 속한 것을 다시 가져감’으로 살리되, 이 저주 맥락에서 구원의 ‘구속’ 의미가 되지 않도록 ‘되찾아가다’로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep shadow
  chosen_korean: 깊은 그늘
  alternatives_korean:
  - 깊은 어둠
  - 죽음의 그림자
  - 죽음그늘
  lexicon: HALOT
  rationale: 전통적 ‘죽음의 그림자’도 가능하지만, 본문이 죽음 자체보다 짙고 압도적인 어두움의 이미지를 누적하므로 ‘깊은 그늘’로 자연스럽게 살렸습니다.
- source_word: תִּשְׁכָּן עָלָיו
  english_pob_choice: dwell over it
  chosen_korean: 그것 위에 머물며
  alternatives_korean:
  - 그것 위에 거하며
  - 그것 위에 자리하며
  - 그것 위에 덮이며
  lexicon: HALOT
  rationale: שׁכן의 ‘거주하다/머무르다’와 עַל의 위에 덮이는 방향성을 함께 반영하여, 시적이면서도 현대 한국어로 자연한 ‘머물며’를 택했습니다.
- source_word: כִּמְרִירֵי יוֹם
  english_pob_choice: the blacknesses of the day
  chosen_korean: 날의 캄캄함들
  alternatives_korean:
  - 그 날의 어둠들
  - 날의 검은 음영들
  - 낮의 캄캄함
  lexicon: HALOT
  rationale: 난해한 복수형을 평탄화하지 않고, 어둠의 중첩과 낯섦을 유지하기 위해 ‘캄캄함들’로 옮겼습니다. 영어 주석처럼 ‘blacknesses’의 어색함을 일부 보존합니다.
theological_decisions:
- issue: 이 구절의 저주형 기원문을 한국어에서 지나치게 완곡하게 만들지 않을지
  chosen_reading: 직설적인 저주 시의 형식을 유지해 ‘되찾아가고… 머물며… 두렵게 하기를 바랍니다’로 옮겼습니다.
  alternative_readings:
  - 더 부드럽게 ‘없애고… 덮고… 괴롭게 하기를 바랍니다’
  - 간접적으로 ‘사라지게 하소서’류로 완화
  rationale: 욥의 탄식이 지닌 강한 역설적 저주를 보존해야 하므로, 본문의 반복된 ‘may’ 기원형과 파괴적 이미지를 약화시키지 않았습니다.
  doctrine_reference: 시적 저주/탄식의 수사 보존
- issue: צַלְמָוֶת의 의미를 ‘죽음’으로 단정할지 여부
  chosen_reading: ‘깊은 그늘’로 번역해 어두움의 강도를 살리되, 죽음 의미를 본문 본역에 직접 주입하지 않았습니다.
  alternative_readings:
  - 죽음의 그림자
  - 죽음그늘
  - 깊은 어둠
  rationale: 원어는 전통적 해석과 더 넓은 ‘깊은 어둠’ 이해를 모두 허용하므로, 본역은 과도한 신학적 단정 없이 이미지의 밀도를 유지하는 쪽이 적절합니다.
  doctrine_reference: 어휘 다의성 보존
