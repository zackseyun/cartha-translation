base_translation:
  language: en
  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
  footnotes:
  - marker: a
    text: Or 'my belly.' In context, 'womb' best fits the reference to Job's birth.
    reason: lexical_alternative
  - marker: b
    text: Or 'misery,' 'toil,' or 'sorrow' for 'trouble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 내 모태의 문을 닫지 않고, 고난을 내 눈앞에서 숨기지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모태’는 출생 문맥에서 ‘내 배’라는 히브리어 표현을 옮긴 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고난’은 문맥에 따라 ‘괴로움’, ‘수고’, 또는 ‘슬픔’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
