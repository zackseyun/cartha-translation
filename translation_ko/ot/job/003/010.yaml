id: JOB.3.10
reference: Job 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֣א סָ֭גַר דַּלְתֵ֣י בִטְנִ֑/י וַ/יַּסְתֵּ֥ר עָ֝מָ֗ל מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
  footnotes:
  - marker: a
    text: Or 'my belly.' In context, 'womb' best fits the reference to Job's birth.
    reason: lexical_alternative
  - marker: b
    text: Or 'misery,' 'toil,' or 'sorrow' for 'trouble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 내 태의 문들을 닫지 않고, 고난을 내 눈에서 숨기지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태’는 여기서 출생을 가리키는 문맥상 번역입니다. 직역하면 ‘배’도 가능하지만, 본문 흐름에는 ‘태’가 더 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고난’은 ‘misery’, ‘toil’, ‘sorrow’까지 아우를 수 있는 넓은 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그래서
  lexicon: HALOT
  rationale: 앞 문장의 저주에 대한 이유를 밝히는 인과를 자연스럽게 살리되, 합쇼체 문장으로 매끄럽게 연결했습니다.
- source_word: סָגַר דַּלְתֵי
  english_pob_choice: shut the doors
  chosen_korean: 문들을 닫지 않고
  alternatives_korean:
  - 문들을 닫지 않고
  - 문을 닫지 않고
  - 문짝들을 닫지 않고
  lexicon: HALOT
  rationale: ‘문들’을 유지해 히브리어의 복수 이미지를 살리고, 태의 출입구를 닫는 생생한 은유를 그대로 전달했습니다.
- source_word: בִטְנִי
  english_pob_choice: my womb
  chosen_korean: 내 태
  alternatives_korean:
  - 내 배
  - 내 복부
  - 내 자궁
  lexicon: HALOT
  rationale: 이 문맥은 출생을 가리키므로 ‘배’보다 ‘태’가 더 직접적으로 원문의 뜻을 드러내며, 지나친 의학화도 피합니다.
- source_word: עָמָל
  english_pob_choice: trouble
  chosen_korean: 고난
  alternatives_korean:
  - 고통
  - 괴로움
  - 수고
  lexicon: HALOT
  rationale: 욥기의 탄식 맥락에서 עָמָל은 단순한 ‘수고’보다 고통스러운 환난 전체를 가리키므로, 의미 범위를 넓게 포착하는 ‘고난’이 적절합니다.
theological_decisions:
- issue: ‘from my eyes’의 관용적 의미를 어떻게 옮길지
  chosen_reading: ‘내 눈에서 숨기지 않았습니다’로 옮겨, 고통이 보이지 않게 가려지지 않았다는 뜻을 유지했습니다.
  alternative_readings:
  - ‘내 시야에서 숨기지 않았습니다’
  - ‘내가 보지 못하게 하지 않았습니다’
  rationale: 히브리어는 눈앞에서 제거되지 않은 상태를 말하므로, 단순 시각 정보보다 ‘고난을 실제로 마주하게 된 상태’를 드러내는 표현이 본문 의도에 가깝습니다.
  doctrine_reference: 욥기 3장의 탄식 문맥
