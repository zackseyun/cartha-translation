    reason: lexical_alternative
  revision_rationale: The revision keeps the Hebrew causal structure and birth metaphor while improving modern Korean idiom. ‘내 눈앞에서’ conveys the source expression’s sense that suffering was not hidden from Job’s sight. The footnotes remain anchored to the relevant terms and are revised into reader-facing Korean.
