base_translation:
  language: en
  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
  footnotes:
  - marker: a
    text: Or, 'the thing I feared has come upon me.' The Hebrew uses a noun plus a cognate verb ('dread I dreaded') for emphasis.
    reason: lexical_alternative
  - marker: b
    text: The first clause's verb likely means 'has come upon/overtaken me,' while the second more literally says 'has come to me,' preserving a slight variation in the Hebrew parallelism.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 두려워한 두려움이 내게 닥쳤고, 내가 두려워한 것이 내게 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 명사와 같은 어근의 동사를 함께 써서(‘두려움/두려워했다’) 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 첫 절의 동사는 ‘내게 닥치다’ 또는 ‘엄습하다’라는 뉘앙스가 있고, 둘째 절은 더 단순하게 ‘내게 이르다’라고 하여 히브리어의 미세한 병행 차이를 보존합니다.
    reason: lexical_alternative
