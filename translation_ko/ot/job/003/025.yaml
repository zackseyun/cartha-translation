  lexicon: HALOT
  rationale: 명사+동사 어근 반복이 주는 강조를 살리기 위해 단순히 ‘두려워했다’로 풀지 않고, ‘두려움/두려워한’의 반복으로 중첩된 강도를 드러냈습니다.
- source_word: וַיֶּאֱתָיֵנִי
  english_pob_choice: has come upon me
  chosen_korean: 내게 닥쳤고
  alternatives_korean:
  - 내게 임했고
  - 내게 덮쳤고
  - 내게 이르렀고
  lexicon: HALOT
  rationale: 이 동사는 재앙이 사람에게 ‘닥치다/덮치다’는 뉘앙스가 있어, 첫 절의 위협이 실제로 엄습했음을 분명하게 나타내는 표현을 택했습니다.
- source_word: יָגֹרְתִּי / יָבֹא לִי
  english_pob_choice: I feared / has come to me
  chosen_korean: 내가 무서워한 그것이 내게 이르렀습니다
  alternatives_korean:
  - 내가 두려워한 것이 내게 왔습니다
  - 내가 무서워한 것이 내게 닥쳤습니다
  - 내가 두려워한 그것이 내게 왔습니다
  lexicon: HALOT
  rationale: 두 번째 절은 첫 절보다 약한 ‘내게 오다’의 동작을 유지해야 하므로, ‘이르렀습니다’로 번역해 병행 속의 미세한 차이를 보존했습니다.
theological_decisions:
- issue: 시편적/탄식문적 강세 표현의 재현
  chosen_reading: 반복 어근과 병행 구조를 살려, 단순한 ‘두려움이 현실이 되었다’는 의역보다 압박감이 직접 느껴지도록 번역했습니다.
  alternative_readings:
  - 두려움이 현실이 되었습니다
  - 내가 두려워하던 일이 일어났습니다
  rationale: 욥의 탄식은 단순 정보 전달보다 정서적 절규가 핵심이므로, 원문의 반복과 점층을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 욥기 3장 탄식의 수사와 병행법
