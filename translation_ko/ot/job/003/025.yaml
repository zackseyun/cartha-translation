  - 이는
  - 그러므로
  lexicon: HALOT
  rationale: 이 절은 앞선 탄식에 대한 설명을 이어 주므로, 한국어에서는 별도의 접속사를 과잉 사용하지 않고 자연스럽게 이어 주는 것이 원문의 설명적 기능을 잘 살립니다.
- source_word: פַחַד פָּחַדְתִּי
  english_pob_choice: the dread I dreaded
  chosen_korean: 내가 두려워한 그 두려움
  alternatives_korean:
  - 내가 두려워한 것을
