  source_fidelity: 현 초안 첫 문장의 인용문(‘그 밤은 어찌하여 아직 태어나지 않았더라면 좋았을까.’)은 욥기 3:6의 히브리어 본문에 없으며, 앞 절들의 내용을 부정확하게 덧붙입니다. 또한 יִחַדְּ는 의미가 논쟁적인 희귀 동사이므로, 본문에서는 영어 POB의 문맥적 선택인 ‘기뻐하다’를 따르되 달력적 배제라는 대안을 해당 위치의 각주로 보존하는 것이 안전합니다.
  naturalness: ‘해의 날들’보다 ‘한 해의 날들’이 현대 표준 한국어에서 자연스럽습니다. 문두 목적어 ‘그 밤을’은 히브리어의 강조를 살리며, ‘어둠이 사로잡게 하십시오’는 저주적 기원문의 격렬함과 합쇼체를 함께 유지합니다.
  terminology: ‘어둠’, ‘한 해의 날들’, ‘달들의 수’는 원문의 시적·달력적 어휘를 충실히 반영합니다. ‘사로잡다’는 לקח의 취함/장악함과 문맥의 의인화를 자연스럽게 나타냅니다. 이 구절에는 별도의 신학 용어 문제가 없습니다.
