source:
  edition: WLC
  text: הַ/לַּ֥יְלָה הַ/הוּא֮ יִקָּחֵ֪/ה֫וּ אֹ֥פֶל אַל יִ֭חַדְּ בִּ/ימֵ֣י שָׁנָ֑ה בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים אַל יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
  footnotes:
  - marker: a
    text: Or 'let it not be joined to the days of the year.' The Hebrew verb is rare here, and some understand it as exclusion from the calendar rather than lack of rejoicing.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그 밤은 어찌하여 아직 태어나지 않았더라면 좋았을까.」 그 밤을 어둠이 덮쳐라. 그것이 해의 날들 가운데에 더해지지 않게 하라. 그것이 달들의 수에 들지도 않게 하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해의 날들에 더해지지 않게 하라.’ 히브리어 동사는 여기서 희귀하며, 어떤 이들은 기쁨의 결여가 아니라 달력에서의 제외를 뜻하는 것으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/לַּ֥יְלָה הַ/הוּא
  english_pob_choice: As for that night
  chosen_korean: 「그 밤은」
  alternatives_korean:
  - 「그 밤은 말입니다」
  - 「그 밤은」
  - 「그 밤을」
  lexicon: HALOT
  rationale: 전면에 나온 강조된 주제어를 한국어에서도 문두에 두어, 대상 밤을 집요하게 가리키는 구조를 살렸습니다.
- source_word: יִקָּחֵ֪/ה֫וּ אֹ֥פֶל
  english_pob_choice: let darkness seize it
  chosen_korean: 어둠이 덮쳐라
  alternatives_korean:
  - 어둠이 그것을 잡아가라
  - 어둠이 그것을 삼켜라
  - 어둠이 그것을 덮치게 하라
  lexicon: HALOT
  rationale: לקח의 ‘붙잡다/취하다’와 어둠의 인격화된 공격성을 함께 살리기 위해, 직역보다 한국어에서 자연스럽고 강한 ‘덮치다’를 택했습니다.
- source_word: אַ֭ל יִחַדְּ בִּ/ימֵ֣י שָׁנָ֑ה
  english_pob_choice: let it not rejoice among the days of the year
  chosen_korean: 그것이 해의 날들 가운데에 더해지지 않게 하라
  alternatives_korean:
  - 그것이 해의 날들 가운데에서 기뻐하지 않게 하라
  - 그것이 해의 날들 가운데에 합류하지 않게 하라
  - 그것이 해의 날들 가운데에 들지 않게 하라
  lexicon: HALOT
  rationale: יִחַדְּ의 희귀한 용법을 ‘기뻐하다’로 단정하기보다, 달력 안에 포함되는 의미를 드러내는 쪽으로 옮겨 본문의 축복적 ‘포함’과 대비되는 저주 의도를 분명히 했습니다.
- source_word: בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים
  english_pob_choice: into the number of the months
  chosen_korean: 달들의 수에 들지도 않게 하라
  alternatives_korean:
  - 달들의 수 가운데에 들어가지 않게 하라
  - 달들의 수에 포함되지 않게 하라
  - 달들의 숫자에 들어가지 않게 하라
  lexicon: HALOT
  rationale: מִסְפָּר의 ‘계수/기록된 수’ 이미지를 살리면서, 한국어에서는 ‘들다/포함되다’가 자연스러워 달력 목록에 편입되는 뜻을 드러냈습니다.
theological_decisions:
- issue: 욥기의 저주적 소망을 한국어에서 얼마나 직설적으로 살릴지
  chosen_reading: 직설적인 저주형 명령문으로 유지했습니다.
  alternative_readings:
