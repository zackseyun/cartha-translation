- from: 「날들을 저주하는 자들」은 그 날을 저주하고, 레위야단을 깨우려고 준비된 자들이라.[a]
  to: 날을 저주하는 자들, 곧 리워야단을 깨울 준비가 된 자들이 그 날을 저주하게 하십시오.
  rationale: 원문 단수 יוֹם을 ‘날’로 바로잡고, 지시대명사 목적어를 ‘그 날’로 보존했습니다. 두 분사구의 관계는 동격적 병렬로 무리 없이 표현했으며, 리워야단을 깨운다는 시적·신화적 이미지는 해설로 축소하거나 교리적으로 규정하지 않았습니다. 원문에 근거하지 않은 복수형 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
