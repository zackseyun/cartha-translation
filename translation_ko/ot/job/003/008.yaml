theological_decisions:
- issue: 레위야단을 깨우려는 표현의 상징성 유지
  chosen_reading: 문자적으로 ‘레위야단을 깨우려고 준비된 자들’로 옮겨, 파멸적 혼돈의 이미지를 약화하지 않았습니다.
  alternative_readings:
