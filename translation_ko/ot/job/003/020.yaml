  - 불행한 이에게
  - 수고하는 이에게
  lexicon: HALOT
  rationale: 문맥상 단순한 노동이 아니라 고통과 괴로움의 상태가 핵심이므로, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 불빛
  lexicon: HALOT
  rationale: 히브리어의 시적 이미지를 그대로 살려 계속되는 존재/삶의 은유를 보존했습니다.
- source_word: לְמָרֵי נָפֶשׁ
  english_pob_choice: to the bitter in soul
  chosen_korean: 마음이 쓰라린 이에게
  alternatives_korean:
  - 영혼이 쓰라린 이에게
  - 속이 쓰린 이에게
  - 쓰라린 마음의 사람에게
  lexicon: HALOT
  rationale: ‘bitter in soul’의 내면적 고통을 살리면서도 한국어에서 어색하지 않게 ‘마음’으로 풀었습니다. ‘영혼’은 너무 형이상학적으로 들릴 수 있어 피했습니다.
theological_decisions:
- issue: יִתֵּן의 주어가 명시되지 않은 점
  chosen_reading: 주어를 밝히지 않고 수동형으로 옮겨, ‘주어 없는 주심’의 긴장을 유지했습니다.
  alternative_readings:
  - ‘왜 그분은… 주십니까’처럼 하나님을 명시하기
  - ‘왜 하나님은… 주십니까’처럼 명시적 신적 주어를 넣기
  rationale: 히브리어 본문은 주어를 말하지 않으므로, 번역에서 하나님을 서둘러 특정하지 않고 탄식의 수사적 여운을 보존하는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 유지한다.'
