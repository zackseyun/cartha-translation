  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה יִתֵּ֣ן לְ/עָמֵ֣ל א֑וֹר וְ֝/חַיִּ֗ים לְ/מָ֣רֵי נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
  footnotes:
  - marker: a
    text: Or 'Why does he give light to the miserable, and life to those bitter of soul?' The Hebrew leaves the giver unstated, though God is likely implied in context.
    reason: alternative_reading
  - marker: b
    text: '''Light'' is a poetic image for continued existence; the Hebrew keeps the metaphor rather than stating ''life'' directly in the first clause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 고통받는 이에게 빛이 주어지고, 마음이 쓰라린 이에게 생명이 주어집니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절에서 ‘빛’을 그대로 유지하며, 곧바로 ‘생명’이라고 풀어 쓰지 않습니다. 여기서는 계속되는 존재의 시적 이미지가 유지됩니다.
    reason: lexical_alternative
  - marker: b
    text: 동사의 주어는 히브리어 본문에 명시되어 있지 않습니다. 문맥상 하나님이 암시될 가능성은 있지만, 본문은 그분을 직접 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어찌하여
  lexicon: HALOT
  rationale: 직접적인 의문 부사로서 욥의 탄식조 질문을 간결하고 힘 있게 살립니다.
- source_word: לְעָמֵל
  english_pob_choice: to the troubled
  chosen_korean: 고통받는 이에게
  alternatives_korean:
  - 괴로워하는 이에게
  - 불행한 이에게
  - 수고하는 이에게
  lexicon: HALOT
  rationale: 문맥상 단순한 노동이 아니라 고통과 괴로움의 상태가 핵심이므로, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 불빛
  lexicon: HALOT
  rationale: 히브리어의 시적 이미지를 그대로 살려 계속되는 존재/삶의 은유를 보존했습니다.
- source_word: לְמָרֵי נָפֶשׁ
  english_pob_choice: to the bitter in soul
  chosen_korean: 마음이 쓰라린 이에게
  alternatives_korean:
  - 영혼이 쓰라린 이에게
  - 속이 쓰린 이에게
  - 쓰라린 마음의 사람에게
  lexicon: HALOT
  rationale: ‘bitter in soul’의 내면적 고통을 살리면서도 한국어에서 어색하지 않게 ‘마음’으로 풀었습니다. ‘영혼’은 너무 형이상학적으로 들릴 수 있어 피했습니다.
theological_decisions:
- issue: יִתֵּן의 주어가 명시되지 않은 점
  chosen_reading: 주어를 밝히지 않고 수동형으로 옮겨, ‘주어 없는 주심’의 긴장을 유지했습니다.
  alternative_readings:
  - ‘왜 그분은… 주십니까’처럼 하나님을 명시하기
  - ‘왜 하나님은… 주십니까’처럼 명시적 신적 주어를 넣기
  rationale: 히브리어 본문은 주어를 말하지 않으므로, 번역에서 하나님을 서둘러 특정하지 않고 탄식의 수사적 여운을 보존하는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 유지한다.'
