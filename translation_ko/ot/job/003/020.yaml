base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
  footnotes:
  - marker: a
    text: Or 'Why does he give light to the miserable, and life to those bitter of soul?' The Hebrew leaves the giver unstated, though God is likely implied in context.
    reason: alternative_reading
  - marker: b
    text: '''Light'' is a poetic image for continued existence; the Hebrew keeps the metaphor rather than stating ''life'' directly in the first clause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 고통받는 이에게 빛이 주어지고, 마음이 쓰라린 이에게 생명이 주어집니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절에서 ‘빛’을 그대로 유지하며, 곧바로 ‘생명’이라고 풀어 쓰지 않습니다. 여기서는 계속되는 존재의 시적 이미지가 유지됩니다.
    reason: lexical_alternative
  - marker: b
    text: 동사의 주어는 히브리어 본문에 명시되어 있지 않습니다. 문맥상 하나님이 암시될 가능성은 있지만, 본문은 그분을 직접 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어찌하여
  lexicon: HALOT
  rationale: 직접적인 의문 부사로서 욥의 탄식조 질문을 간결하고 힘 있게 살립니다.
- source_word: לְעָמֵל
  english_pob_choice: to the troubled
  chosen_korean: 고통받는 이에게
  alternatives_korean:
