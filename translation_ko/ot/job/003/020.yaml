  source_fidelity: 히브리어의 의문사 לָמָּה, 주어가 명시되지 않은 3인칭 단수 동사 יִתֵּן, 그리고 ‘빛’(אוֹר)과 ‘생명’(חַיִּים)의 병행을 충실히 반영합니다. 수동형 ‘주어지고/주어집니까’는 행위자를 본문보다 더 구체화하지 않으면서 자연스럽게 옮깁니다. ‘고통받는 이’와 ‘마음이 쓰라린 이’도 각각 עָמֵל 및 מָרֵי נָפֶשׁ의 고난과 내면의 쓰라림을 문맥상 적절히 전달합니다.
  naturalness: 현대 표준 한국어로 자연스럽고, 욥의 탄식에 알맞은 격식 있는 합쇼체 의문문입니다. 두 절의 병행도 ‘빛이 주어지고 … 생명이 주어집니까’로 명료하게 살아 있습니다.
  terminology: ‘빛’과 ‘생명’을 구별하여 유지한 점이 좋습니다. ‘마음이 쓰라린 이’는 נֶפֶשׁ를 불필요하게 형이상학적인 ‘영혼’으로 한정하지 않으면서 내면적 고통을 잘 전달합니다. 각주도 빛의 시적 기능과 미명시 행위자를 적절히 설명하며, 본문의 모호성을 해소하지 않습니다.
