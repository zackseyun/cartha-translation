  source_fidelity: 히브리어 יֹאבַד의 저주·소원(쥬시브)과 두 병렬 대상은 대체로 반영되었습니다. 그러나 현행 문장은 첫 대상에만 ‘사라지고’를 붙이고 둘째 대상에만 ‘사라지기를 바랍니다’를 붙여, 두 대상 모두를 향한 저주 소원이 문법적으로 고르게 드러나지 않습니다. גָבֶר는 남성임을 나타내며, 출생 고지 문맥에서는 ‘남자아이’로 이해될 수 있습니다.
  naturalness: ‘내가 태어난 그 날’은 자연스럽지만, ‘사라지고 … 사라지기를 바랍니다’의 연결은 어색합니다. 두 명사를 함께 묶어 하나의 소원형 서술어에 연결하면 현대 표준 한국어 합쇼체에서 더 명료하고 자연스럽습니다. ‘한 남자가 잉태되었다’는 문법상 가능하나 출생 고지에서는 성인 남성을 떠올리게 할 수 있으므로, 본문에는 ‘남자아이’를 쓰고 어휘적 대안을 각주로 제시하는 편이 자연스럽습니다.
  terminology: ‘잉태되었다’는 הֹרָה의 수동적·비인칭적 출생 고지 표현을 적절히 보존합니다. ‘없어져 버리다’는 יֹאבַד의 파멸/소멸 소원을 자연스럽게 옮기며, 단순한 물리적 소멸보다 저주문의 강도를 어느 정도 드러냅니다. 각주 표지는 해당 어휘인 ‘남자아이’ 바로 뒤에 두는 것이 적절합니다.
