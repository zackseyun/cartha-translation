source:
  edition: WLC
  text: יֹ֣אבַד י֭וֹם אִוָּ֣לֶד בּ֑/וֹ וְ/הַ/לַּ֥יְלָה אָ֝מַ֗ר הֹ֣רָה גָֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
  footnotes:
  - marker: a
    text: Or 'and the night that said, “A male child is conceived.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 태어난 그 날이 사라지고, “한 남자가 잉태되었다”고 말한 그 밤도 사라지기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 남자아이가 잉태되었다”고도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  english_pob_choice: May ... perish
  chosen_korean: 사라지고
  alternatives_korean:
  - 멸망하고
  - 없어지고
  - 사라지기를 바랍니다
  lexicon: HALOT
  rationale: 저주/소원의 뉘앙스를 한국어 합쇼체로 자연스럽게 옮기기 위해 직설적 미래형보다 소망형을 택했습니다. ‘사라지다’는 대상이 존재하지 않게 되기를 바라는 의미를 비교적 직관적으로 전달합니다.
- source_word: אִוָּלֶד בּוֹ
  english_pob_choice: on which I was born
  chosen_korean: 내가 태어난 그 날
  alternatives_korean:
  - 내가 태어난 날
  - 내가 거기서 태어난 날
  lexicon: HALOT
  rationale: ‘그 날’로 특정 생일을 분명히 하고, ‘태어나다’로 니팔 ילד의 수동적 의미를 자연스럽게 반영했습니다.
- source_word: הֹרָה גָבֶר
  english_pob_choice: A man is conceived
  chosen_korean: “한 남자가 잉태되었다”
  alternatives_korean:
  - “한 남자가 잉태되었다”
  - “남자아이가 잉태되었다”
  - “한 남자가 수태되었다”
  lexicon: HALOT
  rationale: 영어 POB의 lexical note가 제시한 성별 표지를 살리면서도, 밤의 선언문 형식을 한국어로 간결하게 옮기기 위해 ‘한 남자’와 ‘잉태되었다’를 택했습니다. ‘잉태’는 출생 전 상태를 드러내는 동사로서 source의 임신/수태 선언을 보존합니다.
theological_decisions:
- issue: 욥의 말이 저주문 형태라는 점을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘사라지고 … 바랍니다’로 소망형을 사용해, 단순 예언이 아니라 욥의 저주/탄원의 의도를 나타냈습니다.
  alternative_readings:
  - 직설형 ‘사라집니다’
  - 명령형 ‘사라져라’
  rationale: 히브리어 יֹאבַד의 쥬사브/임precatory force를 반영해야 하므로, 서술적 미래보다 소망형이 문맥상 더 정확합니다.
  doctrine_reference: 욥기 3장의 탄식과 저주 시퀀스
