language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/לַּ֣יְלָה הַ֭/הוּא יְהִ֣י גַלְמ֑וּד אַל תָּבֹ֖א רְנָנָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: ko
  text: 보라, 그 밤이 황폐하게 되기를, 그 안으로 즐거운 외침이 들어오지 않기를.
  philosophy: formal
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 보게
  lexicon: הִנֵּה
  rationale: 감탄적 주의 환기 표현으로, 서술을 끊고 대상을 강하게 지시하는 짧은 명령형/감탄형 ‘보라’가 원문의 효과를 가장 직접적으로 살립니다.
- source_word: יְהִי גַלְמוּד
  english_pob_choice: may that night be barren
  chosen_korean: 그 밤이 황폐하게 되기를
  alternatives_korean:
  - 그 밤이 메마르게 되기를
  - 그 밤이 쓸쓸하고 비어 있기를
  lexicon: גַלְמוּד
  rationale: גַלְמוּד는 단순한 ‘적막함’보다 생기와 생산성이 없는 황폐·불모의 상태를 가리키므로, ‘황폐하게’로 옮겨 밤의 저주적 상태를 살렸습니다.
- source_word: רְנָנָה
  english_pob_choice: joyful cry
  chosen_korean: 즐거운 외침
  alternatives_korean:
  - 환호
  - 기쁜 소리
  - 환성
  lexicon: רְנָנָה
  rationale: 이 단어는 단순한 소음이 아니라 기쁨의 외침/환호를 뜻하므로, 문맥에 맞게 ‘즐거운 외침’으로 옮겨 소리의 정서성을 유지했습니다.
- source_word: תָּבֹא ... בֽוֹ
  english_pob_choice: enter it
  chosen_korean: 그 안으로 들어오지 않기를
  alternatives_korean:
  - 그 안에 들어가지 않기를
  - 그 속에 스며들지 않기를
  lexicon: בוא
  rationale: POB의 ‘enter’는 장소 내부로 들어가는 동작을 직접 반영하므로, 대상지시대명사 ‘그 안으로’와 함께 자연스러운 현대 한국어로 재현했습니다.
theological_decisions:
- issue: 저주적 희구문(원문이 밤에 대한 부정적 소망을 말함)
  chosen_reading: 직역에 가깝게 ‘되기를 / 들어오지 않기를’로 유지하여, 욥의 탄식이 지닌 저주의 어조를 약화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘아무 기쁨도 없기를’로 풀어쓰기
  - 해석적으로 ‘그 밤이 텅 비기를’로 순화
  rationale: 이 절은 시적 저주/탄원의 언어이므로, 도덕적으로 순화하거나 일반적 묵상문처럼 바꾸면 원문의 정서를 훼손합니다.
  doctrine_reference: 욥기 3장의 탄식과 저주적 시어
