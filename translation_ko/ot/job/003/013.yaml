  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
  footnotes:
  - marker: a
    text: Hebrew 'and been quiet'; alternatively 'and been still' or 'and been at peace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'then there would have been rest for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그랬더라면 지금쯤 나는 누워 고요히 있었을 것이며[a], 잠들었을 것이고, 그때에는 내게 쉼이 있었을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘고요히’; ‘잠잠히’ 또는 ‘평안히’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그때 나는 쉬었을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  english_pob_choice: For now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 바로 지금
  lexicon: HALOT
  rationale: 현재 시점을 가리키는 연결을 한국어에서는 자연스럽게 ‘지금’으로 옮기되, 앞 문맥의 이유 제시 기능은 문장 전체에서 유지했습니다.
- source_word: וְאֶשְׁקֹט
  english_pob_choice: and been quiet
  chosen_korean: 잠잠하고
  alternatives_korean:
  - 고요하고
  - 조용하고
  - 평안하고
  lexicon: HALOT
  rationale: שקט의 핵심 의미를 ‘잠잠하다’로 옮겨 정적과 평온의 뉘앙스를 살렸고, ‘평안하다’처럼 의미를 확대하지 않았습니다.
- source_word: יָשַׁנְתִּי
  english_pob_choice: I would have slept
  chosen_korean: 잠들어 있었을 것이며
  alternatives_korean:
  - 잤을 것이며
  - 잠들었을 것이며
  lexicon: HALOT
  rationale: ‘sleep’의 평범한 동사를 살리면서도 시적 문맥에서 죽음의 비유를 과잉 해석하지 않도록 ‘잠들어 있었다’로 자연스럽게 옮겼습니다.
- source_word: יָנוּחַ לִי
  english_pob_choice: I would have been at rest
  chosen_korean: 나는 쉬고 있었을 것입니다
  alternatives_korean:
  - 나에게 쉬는 것이 있었을 것입니다
  - 그때 내게 쉼이 있었을 것입니다
  lexicon: HALOT
  rationale: נוּחַ + לִי의 상태 표현을 한국어에서는 ‘쉬고 있다/쉬다’로 옮기되, 직접적으로 사후 상태를 규정하는 표현은 피했습니다.
theological_decisions:
- issue: 잠과 쉼의 죽음 비유를 어떻게 처리할지
  chosen_reading: ‘누웠더라면’, ‘잠들어 있었을 것이며’, ‘쉬고 있었을 것입니다’로 옮겨, 죽음의 안식을 암시하는 시적 이미지는 살리되 사후 상태에 대한 교리를 분명히 단정하지 않았습니다.
  alternative_readings:
  - ‘죽어 있었을 것이며’로 명시적으로 풀기
  - ‘무덤에서 쉬고 있었을 것입니다’로 확대하기
  rationale: 히브리어 본문은 눕다, 자다, 쉬다의 일상 동사를 사용하므로, 원문의 시적 긴장과 신학적 여지를 보존하는 것이 적절합니다.
  doctrine_reference: 죽음의 상태에 대한 교리적 단정 대신 시적 은유를 유지
