id: JOB.3.12
reference: Job 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַ֭דּוּעַ קִדְּמ֣וּ/נִי בִרְכָּ֑יִם וּ/מַה שָּׁ֝דַ֗יִם כִּ֣י אִינָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/012.yaml
  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
  footnotes:
  - marker: a
    text: Or 'that I might suck' or 'that I might suckle.' The Hebrew verb refers to an infant drawing milk.
    reason: lexical_alternative
  - marker: b
    text: '''Knees'' likely refers to the newborn being received onto the knees or lap at birth.'
    reason: cultural_note
translation:
  language: ko
  text: 어찌하여 무릎들이 나를 받아 주었으며, 어찌하여 젖가슴들이 있었기에 내가 빨 수 있었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무릎들’은 신생아가 출생 때 무릎이나 무릎 위에 받아졌음을 가리키는 문화적 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 유아가 젖을 빠는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 이유로
  lexicon: HALOT
  rationale: 원문의 직접적인 질문을 자연스러운 현대 한국어 의문문으로 살리되, 욥의 탄식체에 어울리는 문어적 뉘앙스를 유지했습니다.
- source_word: קִדְּמוּנִי
  english_pob_choice: did ... receive me
  chosen_korean: 나를 받아 주었으며
  alternatives_korean:
  - 나를 맞이했으며
  - 나를 영접했으며
  lexicon: HALOT
  rationale: ‘무릎’과 결합된 출생 장면의 관용을 그대로 풀기보다, POB의 audit처럼 ‘받다’의 수용 의미를 살려 문맥상 ‘받아 주다’로 옮겼습니다.
- source_word: בִרְכָּיִם
  english_pob_choice: knees
  chosen_korean: 무릎들
  alternatives_korean:
  - 무릎
  - 무릎 위
  - 품
  lexicon: HALOT
  rationale: 출생 직후 아기를 무릎 위에 받는 문화적 배경을 주석으로 설명하되, 본문에서는 구체적 이미지를 보존하기 위해 직역 성격의 ‘무릎들’을 유지했습니다.
- source_word: שָׁדַיִם
  english_pob_choice: breasts
  chosen_korean: 젖가슴들
  alternatives_korean:
  - 가슴들
  - 유방들이
  - 어머니의 젖가슴들
  lexicon: HALOT
  rationale: 해부학적이면서도 수유 맥락이 분명한 표현으로 옮겨, 단순한 ‘가슴’보다 원문 이미지와 기능을 더 정확히 드러냈습니다.
- source_word: אִינָק
  english_pob_choice: I should nurse
  chosen_korean: 내가 빨 수 있었습니까
  alternatives_korean:
  - 내가 젖을 빨 수 있었습니까
  - 내가 젖을 먹을 수 있었습니까
  - 내가 젖을 빨았어야 했습니까
  lexicon: HALOT
  rationale: 동사의 핵심 의미인 유아의 빨기를 살리면서, 한국어에서 자연스러운 능력·상황 의문으로 구성했습니다. POB의 ‘nurse’에 대응하되 오해를 줄이기 위해 더 직설적인 동사를 선택했습니다.
theological_decisions:
- issue: 출생 장면의 문화적 함의(무릎 위 수용)
  chosen_reading: ‘무릎들’을 본문에 남기고, 출생 직후 아이를 무릎이나 무릎 위에 받는 관습을 암시하는 이미지로 읽습니다.
  alternative_readings:
  - ‘품’이나 ‘안’으로 의미화
  - ‘받아 주다’만 강조하고 무릎 이미지는 약화
  rationale: 본문은 시적 질문 속에서 출생·수유를 함께 묶는 구체적 이미지를 사용하므로, 문화적 배경은 설명하되 본문의 물성을 보존하는 편이 더 충실합니다.
  doctrine_reference: 창 50:23; 욥 3:11–13의 탄식 맥락
