  footnotes:
  - marker: a
    text: ‘무릎’은 신생아가 출생 때 무릎이나 무릎 위에 받아졌음을 가리키는 문화적 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 유아가 젖을 빠는 행위를 가리킵니다.
    reason: lexical_alternative
