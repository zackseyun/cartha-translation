id: JOB.3.19
reference: Job 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the slave is free from his master.
  footnotes:
  - marker: a
    text: Or 'The small and the great are there; and the servant is free from his master.' The Hebrew for עֶבֶד can mean 'servant' or 'slave'; here 'slave' is used because the contrast with being free from a master highlights bonded status.
    reason: lexical_alternative
translation:
  language: ko
  text: 작은 자나 큰 자나 거기에는 다 있고, 종은 자기 주인에게서 벗어나 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘작은 자와 큰 자가 거기에는 있고, 종이 자기 주인에게서 자유롭다.’ 히브리어 עֶבֶד은 ‘종’이나 ‘노예’를 뜻할 수 있으며, 여기서는 주인과의 대비가 묶인 상태를 강조하므로 ‘노예’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן וְגָדוֹל
  english_pob_choice: the small and the great
  chosen_korean: 작은 자나 큰 자나
  alternatives_korean:
  - 작은 사람과 큰 사람
  - 작은 자와 큰 자
  - 미천한 자와 높은 자
  lexicon: HALOT
  rationale: 대조되는 사회적/지위적 범주를 한국어에서도 간결하게 살리기 위해 ‘작은 자’와 ‘큰 자’로 옮겼습니다. ‘나 … 나’는 원문의 병렬과 포괄성을 자연스럽게 드러냅니다.
- source_word: שָׁם הוּא
  english_pob_choice: there
  chosen_korean: 거기에는 다 있고
  alternatives_korean:
  - 거기에는 있습니다
  - 그곳에 있습니다
  - 그곳에 둘 다 있습니다
  lexicon: HALOT
  rationale: ‘거기’는 문맥상 스올/죽음의 영역을 가리키는 지시어이므로 유지했습니다. ‘다’는 영어 POB의 집합적 의미를 한국어에서 자연스럽게 풀어 준 표현입니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 종된 자
  lexicon: HALOT
  rationale: 영어 POB가 ‘slave’로 택해 종속성과 묶인 상태를 강조하지만, 한국어 본문에서는 지나치게 현대적·법적 뉘앙스가 강한 ‘노예’보다 원문의 관계적 의미를 살리는 ‘종’이 더 자연스럽습니다. 다만 주인과의 대비는 뒤의 표현으로 분명히 유지했습니다.
- source_word: מֵאֲדֹנָיו
  english_pob_choice: from his master
  chosen_korean: 자기 주인에게서 벗어나 있습니다
  alternatives_korean:
  - 자기 주인에게서 자유롭습니다
  - 자기 주인으로부터 벗어납니다
  - 자기 주인에게서 풀려 있습니다
  lexicon: HALOT
  rationale: 히브리어의 분리 표지와 ‘자유’의 대조를 살리기 위해 ‘~에게서 벗어나다’로 옮겼습니다. 이는 원문의 상태를 서술하면서도, 주인-종 관계의 해방을 분명히 드러냅니다.
theological_decisions:
- issue: 죽음의 영역에서 신분 차이가 무력해진다는 진술의 직설성
  chosen_reading: ‘거기에는 다 있고’와 ‘벗어나 있습니다’로, 죽음 앞에서 높은 자와 낮은 자의 구분이 사라지고 종이 주인에게서 풀려나는 상태를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘거기에서는 같다’
  - ‘거기서는 자유롭다’
  - ‘거기에는 모두가 있다’
  rationale: 본문은 위로를 주는 일반론보다, 죽음이 사회적 위계와 속박을 무효화한다는 날카로운 대조를 말합니다. 이를 약화시키지 않도록 직설적 표현을 택했습니다.
  doctrine_reference: 욥기 3장 19절의 시적·지혜문학적 죽음 묘사
