lexical_decisions:
- source_word: לְגֶבֶר
  english_pob_choice: to a man
  chosen_korean: 한 사람에게
  alternatives_korean:
  - 남자에게
  - 사람에게
  lexicon: HALOT
  rationale: 히브리어 가ֶבֶר은 남성 단수의 ‘사람/남자’를 가리키며, 이 문맥에서는 앞의 수사적 질문의 목적어이므로 한국어로는 자연스러운 여격 표현인 ‘한 사람에게’로 옮겼습니다.
- source_word: דַּרְכּוֹ נִסְתָּרָה
  english_pob_choice: whose way is hidden
  chosen_korean: 그 길이 숨겨진
  alternatives_korean:
  - 그의 길이 감추어진
  - 그의 길이 숨은
  lexicon: HALOT
  rationale: דֶּרֶךְ은 문자적 ‘길’보다 삶의 행로를 뜻하는 비유가 강하므로 ‘그 길’로 살리고, נִסְתָּרָה는 상태적 수동 의미를 살려 ‘숨겨진’으로 옮겼습니다.
- source_word: וַיָּסֶךְ אֱלוֹהַּ בַּעֲדוֹ
  english_pob_choice: and whom God has hedged in
  chosen_korean: 그리고 하나님께서 그를 에워싸신
  alternatives_korean:
  - 그리고 하나님께서 그를 둘러막으신
  - 그리고 하나님께서 그를 가두신
  lexicon: HALOT
  rationale: וַיָּסֶךְ는 막아 둘러싸다/에워싸다의 뜻이므로, 절망적 이미지가 살아 있는 ‘에워싸신’이 ‘hedged in’의 은유를 가장 잘 반영합니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 욥기에서 אֱלוֹהַּ는 시적 어휘로 쓰인 ‘하나님’이므로, 한국어 표준 개신교 용례에 따라 그대로 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 행위 진술
  chosen_reading: 본문은 하나님이 그 사람의 길을 숨기고 그를 에워싸신다고 직접 말합니다.
  alternative_readings:
  - 하나님을 약화시켜 단순한 상황 묘사로 읽는 해석
  rationale: 히브리어의 명시적 주어 אֱלוֹהַּ를 보존하여, 욥의 탄식이 갖는 신정론적 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
