  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: ko
  text: 하나님께서는 진노를 돌이키지 않으십니다. 그분 아래에서는 라합의 조력자들이 웅크립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלוֹהַּ / God
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 주님
  lexicon: Theos → 하나님
  rationale: 시적 문맥에서도 본문 주어는 일반적인 신 칭호이므로 한국어 표준 신학 용례에 따라 하나님으로 옮겼습니다.
- source_word: לֹא יָשִׁיב אַפּוֹ / does not turn back his anger
  english_pob_choice: does not turn back his anger
  chosen_korean: 진노를 돌이키지 않으시니
  alternatives_korean:
  - 진노를 거두지 않으시니
  - 분노를 되돌리지 않으시니
  lexicon: שׁוּב + אַף → 진노를 돌이키다
  rationale: אַף는 단순 감정의 '분노'보다 하나님의 진노를 가리키는 맥락이므로 진노를 택했고, יָשִׁיב은 동작의 반전을 살려 '돌이키다'로 옮겼습니다.
- source_word: שָׁחֲחוּ / crouch
  english_pob_choice: crouch
  chosen_korean: 웅크리고 있습니다
  alternatives_korean:
  - 구부리고 있습니다
  - 엎드리고 있습니다
  - 굽히고 있습니다
  lexicon: שָׁחַח → 웅크리다/구부리다
  rationale: POB의 'crouch'를 따라 아래로 움츠러든 자세를 드러내기 위해 '웅크리다'를 선택했습니다. 'bow down'보다 신체적 굴복의 이미지를 더 직접적으로 전달합니다.
- source_word: עֹזְרֵי רָהַב / the helpers of Rahab
  english_pob_choice: the helpers of Rahab
  chosen_korean: 라합의 조력자들
  alternatives_korean:
  - 라합의 돕는 자들
  - 라합의 부하들
  - 라합의 조수들
  lexicon: עֹזְרִים → 조력자들
  rationale: עֹזְרֵי는 단순한 보조가 아니라 함께 돕는 자들이므로 '조력자들'이 자연스럽고, 고유명사 라합은 본문 이미지와 전승을 유지하기 위해 음역했습니다.
theological_decisions:
- issue: '''Rahab''의 지시 대상'
  chosen_reading: 본문의 라합은 신화적/상징적 혼돈 세력을 가리키는 시적 표상으로 보이며, 번역에서는 의미를 해설하지 않고 고유명사 형태를 유지했습니다.
  alternative_readings:
  - 이집트의 별칭
  - 바다 괴물/혼돈의 상징
  rationale: 시의 압축성을 보존하고, 독자가 본문의 상징 구조를 직접 읽도록 하기 위해 해설적 확장을 넣지 않았습니다.
  doctrine_reference: 시적 상징 해석은 주석에서 다루고 본문 번역은 과잉해석을 피함
