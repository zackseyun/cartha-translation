  source_fidelity: 히브리어는 ‘하나님이 그의 진노를 돌이키지 않으시며, 그분 아래에서 라합의 조력자들이 웅크린다’는 뜻입니다. 초안은 핵심 의미와 라합이라는 고유명사를 충실히 보존합니다. 다만 ‘-시니’는 원문에 명시되지 않은 인과 관계를 다소 부가하고, ‘그 아래에’는 선행 대상을 조금 더 분명히 할 수 있습니다.
