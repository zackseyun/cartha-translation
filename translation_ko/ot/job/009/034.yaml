id: JOB.9.34
reference: Job 9:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
  footnotes:
  - marker: a
    text: Or 'Let him turn aside his rod from me, and let not his dread terrify me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 막대기를 제 위에서 거두시고, 그의 공포가 저를 두렵게 하지 않기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 위에서’이며, 원문은 고통이 위에 얹혀 있는 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֵר
  english_pob_choice: let him remove
  chosen_korean: 거두시고
  alternatives_korean:
  - 치우시고
  - 옮기시고
  - 비켜 놓으시고
  lexicon: HALOT
  rationale: 히필형의 완곡한 요청/소원 표현을 한국어의 연결형으로 자연스럽게 살리되, 막대기를 ‘없애다’가 아니라 ‘거두다’로 옮겨 원문의 동작성을 보존했습니다.
- source_word: מֵעָלַי
  english_pob_choice: from upon me
  chosen_korean: 제 위에서
  alternatives_korean:
  - 저에게서
  - 제게서
  - 제 위로부터
  lexicon: HALOT
  rationale: 직역하면 ‘제 위에서’이며, 원문의 압박·가중 이미지를 살리기 위해 단순한 ‘저에게서’보다 공간적 이미지를 유지했습니다.
- source_word: שִׁבְטוֹ
  english_pob_choice: his rod
  chosen_korean: 자기의 막대기
  alternatives_korean:
  - 그의 막대기
  - 그의 지팡이
  - 그의 채찍
  lexicon: HALOT
  rationale: 문맥상 징계나 타격의 도구를 가리키므로, 전통적 ‘지팡이’보다 의미가 분명한 ‘막대기’를 택했고, 직설적 소유를 피하기 위해 ‘자기의’로 풀었습니다.
- source_word: אֵמָתוֹ
  english_pob_choice: his terror
  chosen_korean: 그의 두려움
  alternatives_korean:
  - 그의 공포
  - 그의 위압
  - 그의 공포스러움
  lexicon: HALOT
  rationale: אֵימָה의 핵심 의미인 두려움/공포를 살리되, 한국어에서 자연스러운 추상명사 ‘두려움’으로 옮겼습니다.
theological_decisions:
- issue: 3인칭으로 하나님을 말하는 형태를 유지할지, 2인칭 직접호칭으로 풀지 여부
  chosen_reading: ‘그가… 그의…’로 유지하여 하나님을 직접 ‘주님/당신’으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘당신의 막대기를 제게서 거두십시오…’처럼 직접 호칭으로 순화
  - ‘주님’으로 명시하여 기도체로 전환
  rationale: 히브리어는 3인칭 단수와 소유격을 사용하므로, 욥이 하나님을 직접 부르기보다 그에 대해 말하는 긴장을 보존했습니다.
  doctrine_reference: 원문 문법 우선, 번역 전통에 따른 신학적 매끄러움보다 원어의 거리감을 유지
- issue: 마지막 절의 억제어 ‘אַל תְּבַעֲתַנִּי’를 부정 명령/소원으로 어떻게 처리할지
  chosen_reading: ‘…저를 떨게 하지 않기를 바랍니다’로 소망형으로 옮겼습니다.
  alternative_readings:
  - ‘…저를 두렵게 하지 마십시오’
  - ‘…저를 놀라게 하지 않기를 바랍니다’
  rationale: 알(אַל)+미완료형의 금지/소원 기능을 현대 한국어에서 과도하게 명령조로 만들지 않으면서도, 욥의 간청을 분명히 드러냈습니다.
  doctrine_reference: 히브리 시의 청원체 유지
