theological_decisions:
- issue: 욥이 하나님에 대해 말하는 법정적 긴장 보존
  chosen_reading: ‘무죄로 선언하지 않으실’이라는 법정적 표현을 유지해, 하나님이 욥을 변호해 주실 것이라는 식으로 완화하지 않았습니다.
  alternative_readings:
  - ‘나를 벌하지 않으실’
  - ‘나를 죄 없다고 인정하지 않으실’
  rationale: 문맥은 하나님 앞에서의 판결 가능성을 다루므로, 형벌보다 무죄 선언의 부재를 강조하는 번역이 본문의 긴장을 더 정확히 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
