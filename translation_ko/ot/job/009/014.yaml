id: JOB.9.14
reference: Job 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭ף כִּֽי אָנֹכִ֣י אֶֽעֱנֶ֑/נּוּ אֶבְחֲרָ֖ה דְבָרַ֣/י עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/014.yaml
  text: How much less could I answer him and choose my words with him?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'How then could I answer him?' The Hebrew opening is an idiomatic expression of stronger impossibility in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'my arguments' for 'my words,' since the context is Job's attempt to speak his case before God.
    reason: lexical_alternative
  - marker: c
    text: Or 'before him' or 'against him' for 'with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하물며 내가 어찌 그분께 대답하며, 그분과 나눌 내 말을 고르겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그렇다면 내가 어떻게 그분께 대답하겠습니까?” 히브리어 첫머리는 문맥상 더 강한 불가능성을 나타내는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 변론”으로 옮길 수 있습니다. 여기서 ‘말’은 하나님 앞에서 욥이 펼칠 진술이나 주장을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그분 앞에서” 또는 “그분을 상대로”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: How much less
  chosen_korean: 내가 어떻게
  alternatives_korean:
  - 하물며
  - 더더욱
  - 그렇다면 어떻게
  lexicon: HALOT
  rationale: 문맥상 하나님의 위대하심 앞에서 욥이 대답할 수 없다는 강한 불가능성을 나타내므로, 한국어에서는 자연스러운 반문 형태로 옮겨 그 수사적 압박을 살렸습니다.
- source_word: אֶעֱנֶנּוּ
  english_pob_choice: could I answer him
  chosen_korean: 대답하겠으며
  alternatives_korean:
  - 응답하겠으며
  - 말하겠으며
  - 대응하겠으며
  lexicon: HALOT
  rationale: ענה의 기본 의미인 ‘대답하다/응답하다’를 살리되, 욥이 하나님께 말을 꺼내는 상황을 반문형으로 표현했습니다.
- source_word: דְבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말을
  alternatives_korean:
  - 내 말들
  - 내 변론을
  - 내 주장들을
  lexicon: HALOT
  rationale: דבר은 ‘말, 말한 것, 진술’까지 포괄하므로, 여기서는 ‘말’을 택해 발화 행위를 자연스럽게 드러냈습니다. POB의 ‘arguments’ 가능성은 해석적이므로 본문에는 두지 않았습니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그분과 함께
  alternatives_korean:
  - 그분 앞에서
  - 그분을 상대로
  - 그분 앞에
  lexicon: HALOT
  rationale: 전치사 עם의 기본값을 유지하면서, 법정적 뉘앙스를 과도하게 못 박지 않도록 한국어로는 ‘함께’로 옮겼습니다. 다만 문맥상 ‘그분 앞에서’나 ‘그분을 상대로’도 가능해 각주로 남겼습니다.
theological_decisions:
- issue: 욥의 발화가 하나님 앞에서 갖는 법정적/논쟁적 뉘앙스
  chosen_reading: 본문은 단순한 대화가 아니라 하나님 앞에서 자신의 변론을 꺼내기 어려운 상황을 말하므로, 본문에는 중립적인 표현을 두고 해석 가능한 방향은 각주로 처리했습니다.
  alternative_readings:
  - 그분 앞에서
  - 그분을 상대로
  rationale: 히브리어 עִמּוֹ는 기본적으로 ‘함께’이지만, 문맥상 법정적 대면도 암시할 수 있습니다. 한국어 본문에서 이를 단정적으로 강화하면 원문보다 앞서갈 수 있어 절제했습니다.
  doctrine_reference: 욥기 9장의 하나님의 초월성과 인간의 무력함
- issue: אַף כִּי의 수사적 강도
  chosen_reading: ‘내가 어떻게’로 반문 형태를 살려, ‘하물며/더더욱’이 담는 강한 불가능성을 자연스럽게 전달했습니다.
  alternative_readings:
  - 하물며 내가
  - 더더욱 내가
  - 그렇다면 내가 어떻게
  rationale: 히브리어 관용구가 단순 조건문이 아니라 a fortiori 논증이므로, 한국어에서도 불가능성의 강조가 드러나야 합니다. 직역보다 수사 효과를 우선해도 원문의 뜻을 손상하지 않습니다.
  doctrine_reference: 히브리 시적 수사와 욥의 항변
