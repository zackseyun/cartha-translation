  source_fidelity: ‘재앙’은 שׁוֹט(채찍, 그리고 파괴적 재앙)의 문맥적 확장 의미를 적절히 반영하며, ‘그는’은 יִלְעָג의 남성 단수 주어를 유지하여 문맥상 하나님일 수 있는 지시와 재앙의 의인화라는 긴장을 해소하지 않습니다. 다만 ‘사람을’은 히브리어에 명시되지 않은 단수 목적어를 덧붙이므로 피하는 편이 좋습니다.
  naturalness: ‘재앙이 갑자기 목숨을 앗아 간다면’은 목적어를 불필요하게 단수화하지 않으면서도 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘무고한 이들’은 이 문맥에서 ‘무죄한 이들’보다 더 자연스럽고, נְקִיִּם의 무죄·무고의 뜻을 잘 전달합니다.
