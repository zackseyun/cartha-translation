id: JOB.9.23
reference: Job 9:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
  footnotes:
  - marker: a
    text: Or 'he laughs at the trial of the innocent' or 'he mocks the melting away of the innocent.' The Hebrew noun can denote testing or collapse/despair.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 재앙이 갑자기 사람을 죽인다면, 그는 무죄한 이들의 재난을 비웃습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄한 이들의 시험을 비웃는다’ 혹은 ‘무죄한 이들의 녹아내림을 비웃는다’. 히브리어 명사는 시험이나 붕괴/절망을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일 … 한다면
  alternatives_korean:
  - 만약 … 한다면
  - …할 때
  lexicon: HALOT
  rationale: 히브리어 조건문을 자연스러운 한국어 조건 표현으로 옮겨, 가정의 힘을 분명히 살렸습니다.
- source_word: שׁוֹט
  english_pob_choice: a scourge
  chosen_korean: 재앙
  alternatives_korean:
  - 채찍
  - 회초리
  - 재난
  lexicon: HALOT
  rationale: 원뜻은 채찍/징계이지만, 문맥상 사람을 갑자기 죽이는 파괴적 힘을 가리키므로 ‘재앙’이 이미지와 문맥을 함께 살립니다.
- source_word: יִלְעָג
  english_pob_choice: he mocks
  chosen_korean: 비웃습니다
  alternatives_korean:
  - 조롱합니다
  - 모욕합니다
  lexicon: HALOT
  rationale: 동사의 핵심은 냉소적 조롱이므로, 현대 한국어에서 직접적이고 강한 ‘비웃습니다’가 적절합니다.
- source_word: נְקִיִּים
  english_pob_choice: the innocent
  chosen_korean: 무죄한 이들
  alternatives_korean:
  - 무고한 이들
  - 흠 없는 이들
  lexicon: HALOT
  rationale: 죄책이 없는 사람들을 가리키므로, משפט적·윤리적 뉘앙스를 함께 담는 ‘무죄한 이들’이 적합합니다.
theological_decisions:
- issue: 문장의 주어가 누구인지
  chosen_reading: 히브리어의 주어를 한국어에서도 명시적으로 확정하지 않고, 문맥상 하나님을 가리킬 수 있는 긴장을 남겨 둡니다.
  alternative_readings:
  - 재앙이 의인들을 비웃는 것으로 의인화할 수 있음
  - ‘그’ 대신 하나님을 명시할 수 있음
  rationale: 욥기의 논쟁적 어조를 보존하기 위해, 본문이 감추는 주어의 모호성을 해소하지 않고 그대로 살렸습니다.
  doctrine_reference: 성경 본문의 의도적 모호성 보존
- issue: לְמַסַּת의 의미 범위
  chosen_reading: ‘재난’으로 옮기되, 시험/무너짐의 가능성을 과도하게 특정하지 않습니다.
  alternative_readings:
  - 시험
  - 시련
  - 녹아내림
  rationale: 명사 מסס 계열은 시험, 붕괴, 소진의 의미권을 가지므로, 한국어에서는 상황 전체를 포괄하는 ‘재난’이 가장 무리 없이 읽힙니다.
  doctrine_reference: 어휘적 중의성 보존
