  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
  footnotes:
  - marker: a
    text: Or, 'Though I am blameless, he would prove me crooked,' taking God as the implied subject in the second clause.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 옳다 하여도 내 입이 나를 정죄할 것이며, 내가 흠이 없다 하여도 내 입이 나를 비뚤어진 사람으로 드러낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내가 흠이 없다 하여도 그분이 나를 비뚤어진 사람으로 드러내실 것입니다.” 둘째 절의 주어를 하나님으로 보는 읽기입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -다 해도
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 첫 절의 조건절을 한국어에서는 자연스러운 양보형 표현으로 풀어, 뒤 절의 역설적 효과를 살렸습니다.
- source_word: אֶצְדָּק
  english_pob_choice: I am in the right
  chosen_korean: 내가 바른 처지에 있다
  alternatives_korean:
  - 내가 의롭다
  - 내가 옳다
  - 내가 의롭다고 한다
  lexicon: HALOT
  rationale: 법정적 맥락을 살리되, '의롭다'의 종교적 울림을 과도하게 덧씌우지 않도록 '바른 처지에 있다'로 옮겼습니다.
- source_word: יַרְשִׁיעֵנִי
  english_pob_choice: would condemn me
  chosen_korean: 나를 정죄하고
  alternatives_korean:
  - 나를 유죄로 하고
  - 나를 단죄하고
  lexicon: HALOT
  rationale: 법정적 판정의 의미를 한국어 성경 문맥에 맞게 '정죄하다'로 옮겼습니다.
- source_word: תָּם
  english_pob_choice: blameless
  chosen_korean: 흠없다
  alternatives_korean:
  - 온전하다
  - 결함이 없다
  - 책망할 데 없다
  lexicon: HALOT
  rationale: 욥기에서 תָּם이 가리키는 도덕적 무흠성과 온전함을 간결하게 드러내는 표현을 택했습니다.
- source_word: וַיַּעְקְשֵׁנִי
  english_pob_choice: it would prove me crooked
  chosen_korean: 나를 비뚤어졌다고 드러낼 것입니다
  alternatives_korean:
  - 나를 비뚤어지게 할 것입니다
  - 나를 굽은 자로 드러낼 것입니다
  - 나를 그릇되다고 할 것입니다
  lexicon: HALOT
  rationale: עקש의 '비뚤다/굽다' 이미지를 살리면서, 판정적 결과를 '드러낼 것입니다'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 둘째 절의 주어 처리
  chosen_reading: 둘째 절도 앞의 '내 입'을 이어받아, '내 입이 ... 나를 비뚤어졌다고 드러낼 것입니다'로 읽었습니다.
  alternative_readings:
  - 하나님이 나를 비뚤어지게 하실 것입니다
  rationale: 평행 구조상 동일 주어가 이어지는 읽기가 가장 자연스럽고, 본문이 요구하지 않는 하나님 직접 주어를 번역문에 과도하게 넣지 않았습니다.
  doctrine_reference: 본문 우선 원칙과 해석상의 긴장 보존
