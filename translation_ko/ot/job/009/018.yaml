lexical_decisions:
- source_word: יִתְּנֵנִי
  english_pob_choice: does not let me
  chosen_korean: 제게 숨을 고를 틈도 주지 않으시고
  alternatives_korean:
  - 제게 허락하지 않으시고
  - 제게 주지 않으시고
  lexicon: HALOT
  rationale: נתן의 관용적 용법을 따라 ‘허락하지 않다’의 뜻이지만, 문맥상 고통 속에서 잠시 숨 돌릴 여유조차 없다는 뜻이므로 자연스러운 한국어로 옮겼습니다.
- source_word: הָשֵׁב רוּחִי
  english_pob_choice: catch my breath
  chosen_korean: 숨을 고를 틈
  alternatives_korean:
  - 숨을 돌릴 틈
  - 호흡을 회복할 기회
  - 제 영을 돌려받는 것
  lexicon: HALOT
  rationale: רוח는 여기서 영적 회복보다 ‘숨/기력’의 뉘앙스가 강하므로, 직역보다 한국어 관용 표현으로 압박과 탈진의 의미를 살렸습니다.
- source_word: יַשְׂבִּיעַנִי
  english_pob_choice: fills me
  chosen_korean: 저를 …으로 채우십니다
  alternatives_korean:
  - 저를 …으로 배부르게 하십니다
  - 저를 …으로 만족시키십니다
  lexicon: HALOT
  rationale: Hiphil שבע의 ‘채우다/흠뻑 되게 하다’라는 뜻을 살려, 부정적 대상인 ‘쓴 것들’로 가득 채워진 상태를 자연스럽게 표현했습니다.
- source_word: מַמְּרֹרִים
  english_pob_choice: with bitterness
  chosen_korean: 쓰라림
  alternatives_korean:
  - 쓴 것들
  - 쓴맛
  - 비통함
  lexicon: HALOT
  rationale: 복수형 명사이지만 한국어에서는 누적된 고통의 상태를 가리키는 ‘쓰라림’이 가장 자연스럽고, 영어 POB의 추상적 처리와도 잘 맞습니다.
theological_decisions:
- issue: 욥의 원망적 탄식 어조
  chosen_reading: 본문의 고통스러운 호소를 완화하지 않고, 하나님을 직접 3인칭 존칭으로 가리키되 감정의 날것을 유지했습니다.
  alternative_readings:
  - 부드럽게 완곡한 표현으로 바꾸기
  - 신앙적 해석을 덧붙여 정서 완화
  rationale: 이 절은 위로의 언어가 아니라 극심한 고난 속 탄식이므로, 원문의 격렬한 정서를 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: Job의 탄식 문맥 보존
