id: JOB.9.29
reference: Job 9:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
  footnotes:
  - marker: a
    text: Or, 'I will be wicked'; the Hebrew verb can carry either a moral sense ('be wicked') or a forensic sense ('be declared guilty/condemned').
    reason: alternative_reading
translation:
  language: ko
  text: 저는 유죄 판결을 받을 것입니다[a]; 그렇다면 어찌하여 헛되이 수고해야 합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 악합니다.’ 히브리어 동사는 도덕적 의미(‘악하다’)와 법정적 의미(‘유죄로 선언되다/정죄되다’)를 둘 다 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  english_pob_choice: I
  chosen_korean: 저는
  alternatives_korean:
  - 나는
  - 제가
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살리되, 합쇼체 문맥에 맞게 자연스럽고 격식 있게 옮겼습니다.
- source_word: אֶרְשָׁע
  english_pob_choice: will be condemned
  chosen_korean: 유죄 판결을 받을 것입니다
  alternatives_korean:
  - 악인이 될 것입니다
  - 유죄로 판정받을 것입니다
  - 정죄될 것입니다
  lexicon: HALOT
  rationale: 문맥상 욥이 하나님 앞에서 무죄를 입증할 수 없다는 법정적 의미가 핵심이므로, 도덕적 '악함'보다 판결·선고의 뉘앙스를 살렸습니다.
- source_word: לָמָה זֶּה
  english_pob_choice: why then
  chosen_korean: 그렇다면 어찌하여
  alternatives_korean:
  - 왜 그러면
  - 어찌하여
  - 그런즉 왜
  lexicon: HALOT
  rationale: 히브리어 관용구의 추론적 힘을 자연스러운 한국어로 옮기기 위해 '그렇다면'을 보강했습니다.
- source_word: הֶבֶל
  english_pob_choice: in vain
  chosen_korean: 헛되이
  alternatives_korean:
  - 공허하게
  - 무익하게
  - 허망하게
  lexicon: HALOT
  rationale: הבל의 핵심 의미인 헛됨·무익함을 간명하게 반영하는 표준적 표현입니다.
- source_word: אִיגָע
  english_pob_choice: should I labor
  chosen_korean: 수고해야 합니까
  alternatives_korean:
  - 애써야 합니까
  - 애쓰며 일해야 합니까
  - 노력해야 합니까
  lexicon: HALOT
  rationale: יגע의 '수고하다, 힘들게 일하다'를 살리면서, 수사적 질문의 자연스러운 한국어 형태로 다듬었습니다.
theological_decisions:
- issue: רשע의 의미를 도덕적 '악함'이 아니라 법정적 '유죄 판결'로 옮길지 여부
  chosen_reading: 법정적 의미를 택해 '유죄 판결을 받을 것입니다'로 번역했습니다.
  alternative_readings:
  - '''악인이 될 것입니다''처럼 도덕적/서술적 의미로 옮길 수 있습니다.'
  - '''정죄될 것입니다''로도 번역할 수 있습니다.'
  rationale: 본문의 논지는 욥이 하나님 앞에서 자기 의를 세울 수 없고, 결국 유죄로 판정될 수밖에 없다는 법정적 긴장에 있습니다. 따라서 도덕적 낙인보다 판결의 의미를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 원문의 법정적 긴장을 보존하고, 번역이 신학적 쟁점을 과잉 해소하지 않도록 합니다.
