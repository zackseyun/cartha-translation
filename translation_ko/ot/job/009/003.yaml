  rationale: 과장적 비율 표현을 현대 한국어로 자연스럽게 옮기면서도, ‘한 번도’로 불가능성의 강도를 살렸습니다.
theological_decisions:
- issue: 대상 인칭을 본문에 명시할지 여부
  chosen_reading: 히브리어의 일반적 인칭을 유지하고, 다투는 주체와 그 상대의 관계를 문맥이 드러내도록 두었습니다.
  alternative_readings:
  - ‘그와’ 대신 ‘하나님과’로 풀어 쓰는 해석적 번역
  - ‘사람이’로 일반화하는 번역
  rationale: 문맥상 하나님을 가리키는 것이 분명하지만, 본문 자체는 인칭 대명사를 유지합니다. 그래서 원문 구조를 따라가되, 독자가 문맥으로 파악하도록 남겨 두는 것이 가장 투명합니다.
  doctrine_reference: 문맥적 해석과 원문 형식 보존
