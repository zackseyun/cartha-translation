source:
  edition: WLC
  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
  footnotes:
  - marker: a
    text: Or 'If he wished to dispute with him' or 'If he desired to litigate with him.' The Hebrew verb for 'contend' can carry legal-dispute nuance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he would not/could not answer him one from a thousand'; the sense is that he could not answer even once in a thousand times.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 누가 그와 다투고자 해도, 그는 천 번 가운데 한 번도 대답하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투고자 하다’는 분쟁·논쟁뿐 아니라 법정적 ‘소송을 제기하다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘천 가운데 하나’에 가까운 표현으로, ‘천 번 가운데 한 번도’라는 극도의 불가능성을 뜻합니다.
    reason: lexical_alternative
