translation:
  language: ko
  text: 만일 내가 부르고 그분이 나에게 응답하셔도, 나는 그분이 내 음성에 귀를 기울이셨다고 믿지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 부르짖고 그분이 나에게 응답하셔도, 그분이 내 음성에 귀를 기울이셨다고 나는 믿지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - ~하면
  lexicon: HALOT
  rationale: 조건적·가정적 상황을 여는 말로, 본문의 가상적 논리를 가장 자연스럽게 드러냅니다.
- source_word: קָרָאתִי
  english_pob_choice: I called
  chosen_korean: 내가 부르고
  alternatives_korean:
  - 내가 외치고
  - 내가 불렀고
  lexicon: HALOT
  rationale: קרא의 기본 의미를 살리되, 탄식·호소의 맥락을 고려해 한국어에서는 ‘부르다’가 가장 넓고 직접적입니다.
- source_word: וַיַּעֲנֵנִי
  english_pob_choice: and he answered me
  chosen_korean: 그분이 나에게 응답하셔도
  alternatives_korean:
  - 그분이 나에게 대답하셔도
  - 그분이 나를 응답하셔도
  lexicon: HALOT
  rationale: ענה는 단순한 대답보다 응답의 뉘앙스가 있어, 하나님께 드리는 호소의 맥락을 살려 ‘응답하다’로 옮겼습니다.
- source_word: יַאֲזִין קוֹלִי
  english_pob_choice: he was listening to my voice
  chosen_korean: 그분이 내 음성에 귀를 기울이셨다고
  alternatives_korean:
  - 그분이 내 음성을 들으셨다고
  - 그분이 내 음성에 귀를 기울이고 계셨다고
  lexicon: HALOT
  rationale: אזן은 단순 청취보다 주의 깊게 귀를 기울이는 뜻이어서, ‘귀를 기울이다’로 옮겨 מקור의 강조를 보존했습니다.
theological_decisions:
- issue: 하나님이 ‘응답하신다’와 ‘귀를 기울이신다’ 사이의 긴장
  chosen_reading: 표면상 응답이 있어도, 욥은 그것이 वास्तव로 자기 음성에 대한 진지한 경청이라고는 믿지 못하는 내적 불신으로 표현했습니다.
  alternative_readings:
  - 하나님이 전혀 듣지 않으신다는 단정
  - 단지 놀라움을 나타내는 표현
  rationale: 히브리어는 조건절 안에서 욥의 주관적 불신을 드러내며, 하나님의 청취 자체를 교리적으로 부정하지는 않습니다. 번역도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
