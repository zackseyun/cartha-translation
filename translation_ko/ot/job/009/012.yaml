base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
  footnotes:
  - marker: a
    text: Or, 'if he seizes' or 'if he carries off.' The Hebrew verb suggests sudden, forceful taking.
    reason: lexical_alternative
  - marker: b
    text: Or, 'who can bring him back?' The Hebrew literally means 'cause him to return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그가 낚아채 가시면[a] 누가 그를 돌려세울 수 있겠습니까?[b] 누가 그에게 ‘무엇을 하고 계십니까?’라고 말할 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빼앗아 가시면’. 히브리어 동사는 갑작스럽고 강하게 낚아채는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그를 돌아오게 하다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
