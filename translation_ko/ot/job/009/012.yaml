source:
  edition: WLC
  text: הֵ֣ן יַ֭חְתֹּף מִ֣י יְשִׁיבֶ֑/נּוּ מִֽי יֹאמַ֥ר אֵ֝לָ֗י/ו מַֽה תַּעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
  footnotes:
  - marker: a
    text: Or, 'if he seizes' or 'if he carries off.' The Hebrew verb suggests sudden, forceful taking.
    reason: lexical_alternative
  - marker: b
    text: Or, 'who can bring him back?' The Hebrew literally means 'cause him to return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그가 빼앗아 가시면 누가 그를 되돌릴 수 있겠습니까? 누가 그에게 ‘무엇을 하고 계십니까?’라고 말할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빼앗아 가시면’은 히브리어 동사의 갑작스럽고 강한 취함을 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘되돌릴 수 있겠습니까’는 문자적으로는 ‘그에게로 돌아오게 할 수 있겠습니까’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 예언적·수사적 주의를 끄는 감탄사로서, 현대 한국어에서는 ‘보십시오’가 공손하면서도 강한 주목 촉구를 잘 살립니다.
- source_word: יַחְתֹּף
  english_pob_choice: snatches away
  chosen_korean: 빼앗아 가시면
  alternatives_korean:
  - 빼앗으시면
  - 채 가시면
  - 가져가시면
  lexicon: HALOT
  rationale: ‘갑작스럽고 강한 빼앗음’의 뉘앙스를 살리면서, 문맥상 하나님에 대한 행위를 공손하게 표현하기 위해 ‘빼앗아 가시면’로 옮겼습니다.
- source_word: יְשִׁיבֶנּוּ
  english_pob_choice: turn him back
  chosen_korean: 되돌릴 수 있겠습니까
  alternatives_korean:
  - 돌이킬 수 있겠습니까
  - 되돌려 놓을 수 있겠습니까
  - 다시 오게 할 수 있겠습니까
  lexicon: HALOT
  rationale: 히필의 ‘돌아오게 하다/되돌리다’라는 뜻을 반영해, 하나님의 행위를 무효화하거나 역전시킬 수 없다는 수사적 의미를 자연스럽게 전달했습니다.
- source_word: מַה תַּעֲשֶׂה
  english_pob_choice: What are you doing?
  chosen_korean: 무엇을 하고 계십니까?
  alternatives_korean:
  - 무엇을 하십니까?
  - 무슨 일을 하고 계십니까?
  - 무엇을 하고 있습니까?
  lexicon: HALOT
  rationale: 직접 질문의 도전적 뉘앙스를 유지하되, 하나님께 대한 직접 호칭이므로 존대형을 사용했습니다. 현재 진행형의 압박감을 살리기 위해 ‘하고 계십니까?’를 택했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 질문의 문체
  chosen_reading: 직접 화법은 존대형으로 유지하되, 본문의 도전성과 긴장감을 약화하지 않도록 ‘보십시오’와 연속된 반문으로 구성했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 경건한 기도체로 전환
  rationale: 본문은 하나님의 주권에 대한 인간의 무력함을 강하게 드러내는 수사적 반문이므로, 한국어에서도 그 긴장감과 직접성을 보존하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §1, §3
