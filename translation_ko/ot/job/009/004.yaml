id: JOB.9.4
reference: Job 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
  footnotes:
  - marker: a
    text: Or 'and prospered,' 'and remained unharmed.' The Hebrew verb can denote coming through whole or in peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 마음이 지혜로우시고 힘이 강하십니다. 누가 그분에게 맞서 완고해지고도 무사하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형통하겠습니까?’, ‘온전하게 벗어나겠습니까?’ 히브리어 동사는 온전하게 지나가거나 평안히 벗어남을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  english_pob_choice: wise in heart
  chosen_korean: 마음에 지혜롭고
  alternatives_korean:
  - 마음에 지혜로운
  - 마음이 지혜롭고
  - 지혜로운 마음을 지니고
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 인지와 의지의 중심이므로, 단순히 ‘지혜롭다’보다 ‘마음에 지혜롭다’로 옮겨 원문의 심장 이미지를 살렸습니다.
- source_word: וְאַמִּיץ כֹּחַ
  english_pob_choice: and mighty in strength
  chosen_korean: 힘에 능하십니다
  alternatives_korean:
  - 능력에 강하십니다
  - 힘이 크십니다
  - 힘에 강하시며 능하십니다
  lexicon: HALOT
  rationale: אַמִּיץ와 כֹּחַ의 중첩된 강함을 한국어에서 자연스럽게 압축해, ‘힘에 능하다’로 능력과 강세를 함께 드러냈습니다.
- source_word: הִקְשָׁה אֵלָיו
  english_pob_choice: has hardened himself against him
  chosen_korean: 그분에게 맞서 완강해지고
  alternatives_korean:
  - 그분에게 대항하고
  - 그분에게 완고해지고
  - 그분에게 대적하고
  lexicon: HALOT
  rationale: 히필형의 ‘스스로 단단하게 하다’는 의미와 נגד적 관계를 함께 반영하기 위해 ‘맞서 완강해지다’로 옮겼습니다.
- source_word: וַיִּשְׁלָם
  english_pob_choice: and come through safely
  chosen_korean: 무사하겠습니까
  alternatives_korean:
  - 번성하겠습니까
  - 평안하겠습니까
  - 상하지 않겠습니까
  lexicon: HALOT
  rationale: 문맥상 단순한 번영보다 ‘손상 없이 온전하게 지나가다/무사하다’는 뜻이 더 적절하므로, 수사적 질문의 한국어 관용에 맞게 ‘무사하다’로 반영했습니다.
theological_decisions:
- issue: 구절의 주어가 암시적으로 하나님을 가리킴
  chosen_reading: 첫 절의 주어는 문맥상 하나님으로 이해하여 ‘그는’으로 시작했습니다.
  alternative_readings:
  - 주어를 아예 생략하기
  - ‘그분’으로만 시작하기
  rationale: 히브리어는 주어를 생략하지만, 욥의 논증 전체가 하나님을 가리키므로 한국어에서도 명시적 주어를 두어 문장을 자연스럽고 분명하게 만들었습니다.
  doctrine_reference: 문맥 주어 보충
- issue: וַיִּשְׁלָם의 의미를 ‘무사하다’로 처리
  chosen_reading: ‘무사하다’는 번영보다 ‘손상 없이 지나감/온전함’의 핵심을 더 직접적으로 드러냅니다.
  alternative_readings:
  - 번성하다
  - 형통하다
  - 평안하다
  rationale: 이 절은 하나님께 맞서고도 결과가 어떠한가를 묻는 수사문이므로, 물질적 번영보다 ‘온전함/무사함’의 가능성을 열어 두는 번역이 원문 긴장을 보존합니다.
  doctrine_reference: 시적 수사와 어휘 긴장
