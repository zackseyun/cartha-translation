  rationale: ‘감실들’은 문자적인 ‘방들’보다 시적 이미지와 ‘숨겨진 남쪽 하늘의 구획’이라는 뉘앙스를 더 잘 살리면서도 과도한 해석을 피합니다.
theological_decisions:
- issue: 분사의 시제 뉘앙스
  chosen_reading: 현재 진행적 의미보다 창조를 완결된 사실로 제시하는 과거 관형 표현을 택했습니다.
  alternative_readings:
