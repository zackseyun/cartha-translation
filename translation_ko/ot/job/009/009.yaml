id: JOB.9.9
reference: Job 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
  footnotes:
  - marker: a
    text: Or possibly, 'who makes the Bear, Orion, and the Pleiades, and the chambers of the south.' The Hebrew participle can describe ongoing action as well as a completed act.
    reason: lexical_alternative
  - marker: b
    text: '''The Bear'' renders the Hebrew name of a constellation. Older English versions often have ''Arcturus.'''
    reason: alternative_reading
  - marker: c
    text: The phrase 'the chambers of the south' likely refers poetically to the hidden regions or constellations of the southern sky.
    reason: cultural_note
translation:
  language: ko
  text: 그분은 큰곰자리[b], 오리온자리, 플레이아데스성단, 그리고 남쪽의 방들[c]을 지으신[a] 분이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘지으신’은 분사형으로, 완료된 창조 행위뿐 아니라 ‘지으시는’이라는 현재적·지속적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰곰자리’는 히브리어 별자리 이름을 통상적으로 옮긴 것입니다. 정확한 식별은 확실하지 않으며, 옛 번역들에는 ‘아르크투루스’로 옮긴 경우도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘남쪽의 방들’입니다. 남쪽 하늘의 감추어진 영역이나 별들의 영역을 가리키는 시적 표현일 수 있습니다.
    reason: cultural_note
lexical_decisions:
