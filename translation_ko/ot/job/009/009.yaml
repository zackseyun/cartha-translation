  lexicon: HALOT
  rationale: 이 단어는 별자리 이름으로 이해되므로 한국어에서 가장 익숙하고 의미가 분명한 ‘북두칠성’을 택했습니다. 직역형 음역은 독자가 뜻을 놓치기 쉽습니다.
