  rationale: 욥기의 문맥은 하나님의 창조 권능을 열거하는 방향이므로, 한국어에서는 완료된 창조 행위를 더 자연스럽게 드러내는 표현이 본문 효과에 부합합니다.
  doctrine_reference: 창조주 하나님의 주권과 과거 창조 행위의 기념
- issue: 별자리 명칭의 한국어화
  chosen_reading: 고유한 천문명은 독자에게 즉시 식별 가능하도록 표준 한국어/음역을 사용했습니다.
  alternative_readings:
  - 곰
  - 아쉬
  - 게실
  rationale: 본문은 시적 천문 목록이므로, 의미를 희미하게 만드는 고어식 음역보다 통용되는 명칭이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 시적-지혜 문학의 명료성
