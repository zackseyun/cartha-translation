  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
  footnotes:
  - marker: a
    text: Or possibly, 'who makes the Bear, Orion, and the Pleiades, and the chambers of the south.' The Hebrew participle can describe ongoing action as well as a completed act.
    reason: lexical_alternative
  - marker: b
    text: '''The Bear'' renders the Hebrew name of a constellation. Older English versions often have ''Arcturus.'''
    reason: alternative_reading
  - marker: c
    text: The phrase 'the chambers of the south' likely refers poetically to the hidden regions or constellations of the southern sky.
    reason: cultural_note
translation:
  language: ko
  text: 그는 북두칠성, 오리온자리, 플레이아데스와 남쪽의 감실들을 지으신 분입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 완료된 창조 행위뿐 아니라 ‘만드시는’ 현재적 의미도 가질 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘북두칠성’은 여기서 별자리 이름을 드러내기 위한 현대 한국어 번역입니다.
    reason: cultural_note
  - marker: c
    text: ‘남쪽의 감실들’은 남쪽 하늘의 숨은 구역이나 별들의 거처를 가리키는 시적 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  english_pob_choice: who made
  chosen_korean: 지으신 분
  alternatives_korean:
  - 만드신 분
  - 만드는 분
  lexicon: HALOT
  rationale: 문맥상 하나님의 창조 행위를 묘사하는 분사이므로, 완료된 창조를 자연스럽게 드러내는 존칭형 과거 관형사 ‘지으신’이 가장 적절합니다.
- source_word: עָשׁ
  english_pob_choice: the Bear
  chosen_korean: 북두칠성
  alternatives_korean:
  - 곰자리
  - 큰곰자리
  - 아르크투루스
  lexicon: HALOT
  rationale: 이 단어는 별자리 이름으로 이해되므로 한국어에서 가장 익숙하고 의미가 분명한 ‘북두칠성’을 택했습니다. 직역형 음역은 독자가 뜻을 놓치기 쉽습니다.
- source_word: כְּסִיל
  english_pob_choice: Orion
  chosen_korean: 오리온자리
  alternatives_korean:
  - 게실
  - 오리온
  lexicon: HALOT
  rationale: 천문학적 대응어가 분명하므로 표준 별자리명 ‘오리온자리’로 옮기는 것이 원문 의도를 가장 직접적으로 전달합니다.
- source_word: כִימָה
  english_pob_choice: the Pleiades
  chosen_korean: 플레이아데스
  alternatives_korean:
  - 칠자성
  - 플레이아데스성단
  lexicon: HALOT
  rationale: 원문이 가리키는 성단의 통용 명칭을 유지해 시적 목록의 병렬성을 살렸습니다.
- source_word: חַדְרֵי תֵמָן
  english_pob_choice: the chambers of the south
  chosen_korean: 남쪽의 감실들
  alternatives_korean:
  - 남쪽의 방들
  - 남쪽의 숨은 곳들
  - 남쪽의 별방들
  lexicon: HALOT
  rationale: ‘감실들’은 문자적인 ‘방들’보다 시적 이미지와 ‘숨겨진 남쪽 하늘의 구획’이라는 뉘앙스를 더 잘 살리면서도 과도한 해석을 피합니다.
theological_decisions:
- issue: 분사의 시제 뉘앙스
  chosen_reading: 현재 진행적 의미보다 창조를 완결된 사실로 제시하는 과거 관형 표현을 택했습니다.
  alternative_readings:
  - 지으시는 분
  - 지어 가시는 분
  rationale: 욥기의 문맥은 하나님의 창조 권능을 열거하는 방향이므로, 한국어에서는 완료된 창조 행위를 더 자연스럽게 드러내는 표현이 본문 효과에 부합합니다.
  doctrine_reference: 창조주 하나님의 주권과 과거 창조 행위의 기념
- issue: 별자리 명칭의 한국어화
  chosen_reading: 고유한 천문명은 독자에게 즉시 식별 가능하도록 표준 한국어/음역을 사용했습니다.
  alternative_readings:
  - 곰
  - 아쉬
  - 게실
  rationale: 본문은 시적 천문 목록이므로, 의미를 희미하게 만드는 고어식 음역보다 통용되는 명칭이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 시적-지혜 문학의 명료성
