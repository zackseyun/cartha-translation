id: JOB.9.24
reference: Job 9:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
  footnotes:
  - marker: a
    text: Or 'The land is given into the hand of a wicked man.' Hebrew אֶרֶץ can mean 'earth' or 'land,' and רָשָׁע may be read as a singular 'wicked man' or more generally 'the wicked.'
    reason: lexical_alternative
  - marker: b
    text: The subject of 'he covers' is left implicit in Hebrew. It may refer to God, to the wicked ruler, or function as an unspecified subject.
    reason: alternative_reading
translation:
  language: ko
  text: 땅은 악인의 손에 넘겨지고, 그가 그 땅의 재판관들의 얼굴을 가립니다. 그렇지 않다면, 도대체 누가 그렇게 하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 악한 사람의 손에 넘겨진다.’ 히브리어 אֶרֶץ는 ‘땅’과 ‘나라/세상’의 범위를 가질 수 있고, רָשָׁע는 집합적 ‘악인’이나 단수 ‘악한 사람’으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘가리다’의 주어를 드러내지 않습니다. 하나님, 악한 통치자, 또는 불특정한 주어로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: The earth
  chosen_korean: 땅
  alternatives_korean:
  - 세상
  - 지면
  - 땅(또는 세상)
  lexicon: HALOT
  rationale: אֶרֶץ는 ‘땅/나라/세상’의 폭을 가질 수 있는데, 여기서는 시적 문맥에서 구체적 영토보다 संसार의 질서를 가리키는 말로 쓰이므로 한국어로는 가장 자연스럽고 넓은 범위의 ‘땅’이 적절합니다.
- source_word: נִתְּנָה בְיַד
  english_pob_choice: is given into the hand of
  chosen_korean: 악인의 손에 넘겨지고
  alternatives_korean:
  - 악인의 손에 주어지고
  - 악인의 권세에 넘겨지고
  - 악인의 손아귀에 넘겨지고
  lexicon: HALOT
  rationale: ‘손에’라는 히브리 관용을 살리면서, 한국어에서는 ‘넘겨지다’가 지배·장악의 의미를 가장 자연스럽게 드러냅니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 악인들
  lexicon: HALOT
  rationale: 단수 형용사지만 집합적·대표적 의미가 가능하므로, 문맥상 과도하게 특정하지 않는 ‘악인’이 적절합니다.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  english_pob_choice: the faces of its judges
  chosen_korean: 그 땅의 재판관들의 얼굴
  alternatives_korean:
  - 그 땅의 재판관들의 얼굴들
  - 그의 재판관들의 얼굴
  - 그 땅의 심판자들의 얼굴
  lexicon: HALOT
  rationale: שֹׁפְטִים은 ‘재판관들’이 기본 뜻이므로 이를 유지하고, פָּנִים의 직역인 ‘얼굴’을 살려 히브리어의 구체적 이미지를 보존했습니다.
- source_word: יְכַסֶּה
  english_pob_choice: he covers
  chosen_korean: 가립니다
  alternatives_korean:
  - 덮습니다
  - 숨깁니다
  - 가리웁니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘덮다/가리다’이며, 얼굴을 대상으로 할 때 한국어에서는 ‘가리다’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘그가’의 주어를 누구로 확정할 것인가
  chosen_reading: 주어를 밝히지 않고 ‘그가’로만 두어, 히브리어가 남겨 둔 모호성을 보존했습니다.
  alternative_readings:
  - 하나님이 가리십니다
  - 악인이 가립니다
  - 사람들이 가립니다
  rationale: 원문은 יְכַסֶּה의 주어를 명시하지 않으며, POB도 그 긴장을 풀지 않습니다. 한국어 번역도 그 모호성을 유지하는 것이 본문 효과를 가장 잘 반영합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
