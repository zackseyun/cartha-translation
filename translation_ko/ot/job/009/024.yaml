    issue: ‘그가’가 미표시 주어의 모호성을 약화합니다.
    rationale: 히브리어 동사는 3인칭 남성 단수이지만 명시된 선행사가 없습니다. 한국어 대명사 ‘그’는 보통 바로 앞의 ‘악인’을 가리키므로, 본문이 의도적으로 남긴 해석 가능성을 사실상 좁힙니다.
  - severity: low
