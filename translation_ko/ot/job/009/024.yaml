review_pass:
  verdict: revise
  source_fidelity: ‘그가’는 한국어에서 바로 앞의 ‘악인’을 자연스러운 선행사로 삼게 하므로, 히브리어 יְכַסֶּה의 미표시 주어가 지닌 모호성을 충분히 보존하지 못합니다. 또한 ‘누가 그렇게 하겠습니까?’는 원문의 ‘누구입니까?’보다 행위를 보충합니다.
  naturalness: 주어를 생략한 ‘…얼굴을 가립니다’는 현대 표준 한국어에서 자연스럽고, 문맥상 주어를 확정하지 않습니다. ‘그렇지 않다면, 도대체 누구입니까?’도 수사적 물음으로 자연스럽습니다.
  terminology: ‘땅’, ‘악인’, ‘재판관’, ‘얼굴’, ‘가리다’는 원문의 어휘와 이미지를 적절히 반영합니다. 각주 표지는 해당 어휘 및 미표시 주어가 있는 절에 붙이는 편이 더 정확합니다.
