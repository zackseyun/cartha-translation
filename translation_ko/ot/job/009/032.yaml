- from: 그는 나처럼 한 인간이 아니어서, 내가 그에게 대답할 수 없고 우리가 함께 법정에 나아갈 수도 없습니다.
  to: 그분은 나 같은 사람이 아니시므로, 내가 그분께 대답하고 우리가 함께 법정에 나아갈 수 없습니다.
