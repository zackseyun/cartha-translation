source:
  edition: WLC
  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
  footnotes:
  - marker: a
    text: Or 'that I might answer him, that we might come together for judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나처럼 한 인간이 아니어서, 내가 그에게 대답할 수 없고 우리가 함께 법정에 나아갈 수도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אִישׁ כָּמֹנִי
  english_pob_choice: he is not a man like me
  chosen_korean: 나처럼 한 인간이 아니어서
  alternatives_korean:
  - 나 같은 사람이 아니어서
  - 나 같은 인간이 아니어서
  lexicon: HALOT
  rationale: אִישׁ의 인간-대-인간 대비를 살리되, 한국어에서는 ‘한 인간’이 자연스럽고 하나님과의 격차를 분명히 보여 줍니다.
- source_word: אֶעֱנֶנּוּ
  english_pob_choice: that I should answer him
  chosen_korean: 내가 그에게 대답할 수 없고
  alternatives_korean:
  - 내가 그에게 답할 수 없고
  - 내가 그에게 응답할 수 없고
  lexicon: HALOT
  rationale: 법정 대화의 응답 의미를 살려 ‘대답하다’를 택했습니다. 영어 POB의 forensic nuance와도 맞습니다.
- source_word: נָבוֹא יַחְדָּו
  english_pob_choice: that we should come together
  chosen_korean: 우리가 함께 법정에 나아갈 수도 없습니다
  alternatives_korean:
  - 우리가 함께 나아갈 수도 없습니다
  - 우리가 함께 모일 수도 없습니다
  lexicon: HALOT
  rationale: יַחְדָּו의 ‘함께’와 나아감의 동시성을 살려, משפט의 법정 맥락에 맞게 ‘법정에 나아가다’로 옮겼습니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: in court
  chosen_korean: 법정에
  alternatives_korean:
  - 재판에서
  - 심판에서
  lexicon: HALOT
  rationale: מִשְׁפָּט을 추상적 ‘심판’보다 구체적 법정 이미지로 풀어, 욥기의 소송 비유를 현대 한국어에서 분명하게 드러냈습니다.
theological_decisions:
- issue: 하나님과 인간의 법정 비유
  chosen_reading: 하나님을 인간 동등자처럼 상대할 수 없다는 욥의 탄식을 법정 언어로 유지했습니다.
  alternative_readings:
  - 더 일반적으로 ‘심판을 받다’로 완화하는 읽기
  rationale: 본문은 교리적 선언보다 소송 비유에 초점이 있으므로, 법정 이미지를 살리되 과잉 신학화는 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
