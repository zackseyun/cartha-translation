translation:
  language: ko
  text: 다 마찬가지입니다. 그러므로 나는 말합니다[a]. “그가 흠 없는 이와 악한 이를 모두 멸하십니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘나는 말했습니다.’ 히브리어 완료형은 문맥에 따라 현재형이나 과거/완료형으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그것이 흠 없는 이와 악한 이를 모두 멸합니다.’ 주어를 더 비인격적으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  english_pob_choice: It is all one
  chosen_korean: 모두 다 똑같습니다
  alternatives_korean:
  - 한 가지입니다
  - 그것은 하나입니다
  - 같은 일입니다
  lexicon: HALOT
  rationale: 이 관용구는 수량의 ‘하나’보다 결과의 동일함과 무차별성을 말하므로, 현대 한국어에서 자연스러운 ‘모두 다 똑같습니다’로 옮겨 Job의 체념 섞인 판단을 살렸습니다.
- source_word: עַל כֵּן
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞의 진술로부터 이끌어 내는 결론을 나타내므로, 문맥상 가장 명료한 인과 접속사인 ‘그러므로’를 선택했습니다.
- source_word: תָּם וְרָשָׁע
  english_pob_choice: the blameless and the wicked
  chosen_korean: 흠 없는 사람과 악한 사람
  alternatives_korean:
  - 의인과 악인
  - 온전한 사람과 악한 사람
  - 무죄한 사람과 악한 사람
  lexicon: HALOT
  rationale: תָּם은 죄 없음을 단정하기보다 성품의 온전함·흠 없음을 가리키므로, 한국어 성경어법에서 과도하게 종교화하지 않은 ‘흠 없는 사람’이 적절합니다. רָשָׁע는 대조를 살려 ‘악한 사람’으로 옮겼습니다.
- source_word: הוּא מְכַלֶּה
  english_pob_choice: He destroys
  chosen_korean: 그가 … 멸하십니다
  alternatives_korean:
  - 그가 … 파괴하십니다
  - 그가 … 끝장내십니다
  - 그것이 … 멸합니다
  lexicon: HALOT
  rationale: 문맥상 주어는 하나님이지만 히브리어는 주어를 직접 드러내지 않아, 한국어 본문에서는 인격적 주어를 살리되 문장의 긴장을 유지하도록 ‘멸하십니다’로 옮겼습니다. POB의 ‘He destroys’에 맞추어 주체를 하나님으로 읽되, 대안적 비인격 독법은 각주로 남겼습니다.
theological_decisions:
- issue: 주어의 명시 방식(‘He’ 대 비인격적 표현)
  chosen_reading: 본문은 ‘그가’로 번역해 하나님을 주어로 드러내되, 멸망의 행위가 공적으로 동일하게 미치는 Job의 탄식을 유지했습니다.
  alternative_readings:
  - ‘그것이 멸합니다’와 같은 비인격적 표현
  - ‘누가 봐도 그렇게 됩니다’ 식의 완화
  rationale: 9장 전체에서 욥은 하나님의 주권 아래에서 벌어지는 현실을 논하고 있으므로, 함축된 주어를 하나님으로 읽는 것이 문맥에 가장 부합합니다. 다만 히브리어가 허용하는 비인격적 읽기도 가능하므로, 본문은 인격적 주어를 택하되 각주로 대안을 남겨 해석의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 주권과 고난의 긴장 보존
- issue: 욥의 진술 등록(register)
  chosen_reading: 직접 인용문 안은 단정적 서술형으로 두어, 욥의 냉정한 결론을 그대로 드러냈습니다.
  alternative_readings:
  - 완곡한 설명체
  - 감탄형 번역
  rationale: 본문은 위로하거나 설명하기보다 판결처럼 말하는 욥의 어조가 강하므로, 현대 한국어에서도 간결하고 단정한 말투를 유지하는 것이 원문 효과를 더 잘 살립니다.
  doctrine_reference: 문학적 어조 보존
