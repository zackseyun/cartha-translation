  rationale: 원문의 부정 존재문과 관계절을 한국어 한 문장으로 재구성하여, 부재한 제3자가 양쪽에 권위를 행사하거나 분쟁에 관여할 수 있기를 바라는 함의를 보존했습니다. ‘손을 얹을’이라는 구체적 이미지는 유지했으며, 본문에는 법정적 의미가 더 선명한 ‘판정자’를, 각주에는 가능한 대안 ‘중재자’를 제시했습니다.
  reviewer_model: gpt-5.6-terra
