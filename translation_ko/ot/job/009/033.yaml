id: JOB.9.33
reference: Job 9:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
  footnotes:
  - marker: a
    text: Or 'mediator.' The Hebrew term can denote one who decides or intervenes between two parties in dispute.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 사이에는 중재자가 없습니다. 그는 우리 둘 위에 자기 손을 얹을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중재인’. 히브리어는 두 당사자 사이에서 판정하거나 개입하는 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  english_pob_choice: There is no
  chosen_korean: 없습니다
  alternatives_korean:
  - 있지 않습니다
  - 존재하지 않습니다
  lexicon: HALOT
  rationale: 존재 부정의 문장을 한국어에서는 자연스럽게 ‘없습니다’로 옮기는 것이 가장 직접적입니다.
- source_word: בֵּינֵינוּ
  english_pob_choice: between us
  chosen_korean: 우리 사이에는
  alternatives_korean:
  - 우리 둘 사이에는
  - 우리 가운데
  lexicon: HALOT
  rationale: 분쟁의 양 당사자 사이를 가리키는 관계를 ‘우리 사이에는’으로 간결하게 살렸습니다.
- source_word: מוֹכִיחַ
  english_pob_choice: arbiter
  chosen_korean: 중재자
  alternatives_korean:
  - 판정자
  - 재판관
  - 중재인
  lexicon: HALOT
  rationale: 법정적 분쟁 맥락에서 양쪽 사이를 판정하거나 개입하는 제3자를 가리키므로, 한국어에서는 기능을 드러내는 ‘중재자’가 가장 자연스럽습니다.
- source_word: יָשֵׁת יָדוֹ עַל שְׁנֵינוּ
  english_pob_choice: might lay his hand on us both
  chosen_korean: 그는 우리 둘 위에 자기 손을 얹을 수 없습니다
  alternatives_korean:
  - 그가 우리 둘 위에 손을 얹을 수 없습니다
  - 그가 우리 둘에게 손을 얹을 수 없습니다
  lexicon: HALOT
  rationale: 손을 얹는 구체적 이미지를 유지하되, 한국어에서는 가능성/허용의 뉘앙스를 살려 ‘~할 수 없습니다’로 옮겼습니다.
theological_decisions:
- issue: מוֹכִיחַ를 ‘arbiter’보다 신학적으로 더 강한 용어로 풀지 여부
  chosen_reading: ‘중재자’로 옮기되, 본문이 말하는 것은 욥과 하나님 사이에 분쟁을 판정할 제3자가 없다는 사실로 제한합니다.
  alternative_readings:
  - 판정자
  - 중재인
  - 재판관
  rationale: 이 절은 구원론적 직함을 선언하기보다 법정적 결핍을 탄식하는 문맥이므로, 신학적 확장을 자제하면서도 분쟁 해결 기능은 드러내는 번역이 적절합니다.
  doctrine_reference: 원문 우선; 문맥이 허용하는 범위를 넘는 기독론적 해석을 본문 번역에 미리 주입하지 않음.
