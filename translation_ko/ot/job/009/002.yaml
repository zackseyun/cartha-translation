  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
  footnotes:
  - marker: a
    text: Or 'how can a man be justified with God?'
    reason: lexical_alternative
  - marker: b
    text: '''A man'' translates Hebrew ''enosh,'' a representative singular for frail humanity; alternatively, ''a mortal'' or ''a human being.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로, 나는 그것이 그렇다는 것을 압니다. 그러나 사람이 하나님 앞에서 어떻게 의로울 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 하나님과 함께 의롭다 함을 받을 수 있겠습니까?’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘에노쉬’는 연약한 인류를 대표하는 단수 표현입니다. 따라서 ‘사람’으로 옮겼으며, ‘죽을 인간’이나 ‘인간 존재’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭מְנָם
  english_pob_choice: Truly
  chosen_korean: 진실로
  alternatives_korean:
