  - 정말로
  lexicon: HALOT
  rationale: 동의·강조의 감탄을 자연스러운 현대 한국어로 옮기되, 진술의 엄숙한 확언을 살리기 위해 ‘진실로’를 선택했습니다.
- source_word: יָדַ֣עְתִּי כִי כֵ֑ן
  english_pob_choice: I know that it is so
  chosen_korean: 나는 그것이 그렇다는 것을 압니다
  alternatives_korean:
  - 나는 그것이 그러하다는 것을 압니다
  - 그것이 그렇다는 것을 압니다
  lexicon: HALOT
  rationale: 완료형의 확정된 인식을 한국어 현재 시제로 자연스럽게 풀어, 욥의 단정적 수긍을 드러냈습니다.
- source_word: וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ
  english_pob_choice: how can a man be righteous
  chosen_korean: 어떻게 사람이 … 의로울 수 있겠습니까
  alternatives_korean:
  - 어떻게 사람이 … 의롭다고 인정될 수 있겠습니까
  - 어떻게 사람이 … 의롭다 할 수 있겠습니까
  lexicon: HALOT
  rationale: צדק의 기본 의미를 따라 ‘의롭다’로 옮겼고, 한국어에서는 질문형으로 풀어 원문의 논박적 흐름을 살렸습니다.
- source_word: עִם אֵֽל
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님과 함께
  - 하나님과 상대로
  lexicon: HALOT
  rationale: 직역의 ‘with God’보다 문맥상 재판·대면의 뉘앙스를 드러내는 자연스러운 한국어 관용으로 옮겼습니다.
theological_decisions:
- issue: יִצְדַּק의 법정적 뉘앙스
  chosen_reading: ‘의로울 수 있겠습니까’로 옮겨, 인간이 하나님 앞에서 의롭다 설 수 있는지 묻는 긴장을 유지했습니다.
  alternative_readings:
  - ‘의롭다 함을 받을 수 있겠습니까’
  - ‘정당하다고 인정받을 수 있겠습니까’
  rationale: 히브리어는 법정적/도덕적 뉘앙스를 모두 가질 수 있으나, 본문 자체는 후대 교리용 공식을 요구하지 않으므로 긴장을 해소하지 않고 보존하는 번역이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
