  - severity: low
    issue: ‘계속’의 추가
    rationale: יַחֲלֹף는 ‘지나가다, 지나쳐 가다, 지나가 버리다’의 뜻이나, 지속성을 특정하는 ‘계속’은 본문에 명시되어 있지 않습니다.
