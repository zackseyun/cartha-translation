  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן יַעֲבֹ֣ר עָ֭לַ/י וְ/לֹ֣א אֶרְאֶ֑ה וְ֝/יַחֲלֹ֗ף וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
  footnotes:
  - marker: a
    text: Or 'Behold' for 'Look.'
    reason: lexical_alternative
  - marker: b
    text: Or 'passes over me' / 'goes by me' for 'passes by me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I do not understand him'; the Hebrew can denote discernment or understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그가 내 곁을 지나가도 나는 보지 못하고, 계속 지나가도 나는 그를 분별하지 못합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’ 대신 ‘보라’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: יַעֲבֹר עָלַי의 뜻은 ‘내 위를 지나가도’ 또는 ‘내 곁을 지나가도’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: בין은 여기서 ‘이해하다’보다 ‘분별하다/인지하다’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오,
  lexicon: HALOT
  rationale: 주의를 끌어 대상을 가리키는 감탄사로, 현대 한국어에서는 명령형을 섞기보다 공손한 호명 표현인 "보십시오"가 원문의 즉각성을 자연스럽게 살립니다.
- source_word: יַעֲבֹר עָלַי
  english_pob_choice: passes by me
  chosen_korean: 내 곁을 지나가도
  alternatives_korean:
  - 내게서 지나가도
  - 나를 지나쳐도
  - 내 위를 지나가도
  lexicon: HALOT
  rationale: עבר עם על의 결합은 단순한 상행 이동보다 사람 곁을 스쳐 지나가는 장면을 드러내므로, "내 곁을 지나가도"가 관계적 근접성을 가장 잘 살립니다.
- source_word: אֶרְאֶה
  english_pob_choice: I do not see him
  chosen_korean: 나는 보지 못하고
  alternatives_korean:
  - 나는 그를 보지 못하고
  - 나는 보지 않습니다
  - 나는 그를 볼 수 없고
  lexicon: HALOT
  rationale: 히브리어의 단순 부정 미완료형은 여기서 실제 인지의 부재를 말하므로, 과도한 능력 부정보다 "보지 못하고"로 옮겨 자연스러운 병렬을 유지했습니다.
- source_word: אָבִין לוֹ
  english_pob_choice: I do not perceive him
  chosen_korean: 나는 그를 분별하지 못합니다
  alternatives_korean:
  - 나는 그를 이해하지 못합니다
  - 나는 그를 알아차리지 못합니다
  - 나는 그를 깨닫지 못합니다
  lexicon: HALOT
  rationale: בין은 단순한 지적 이해보다 식별·분별의 뜻을 포함하므로, "분별하지 못합니다"가 영문 POB의 "perceive"가 지닌 인지적·경험적 뉘앙스를 가장 가깝게 반영합니다.
theological_decisions:
- issue: 9:11의 주어와 목적어의 지시 대상
  chosen_reading: 주어와 대명사는 하나님을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 불특정한 '누군가'가 지나가는 것으로 읽을 수 있습니다.
  rationale: 직전 문맥(Job 9:10–12)이 하나님의 감지할 수 없는 행위를 말하므로, 본절의 '그'와 '그를'은 하나님을 가리키는 것으로 번역하는 것이 문맥에 충실합니다.
  doctrine_reference: 문맥적 지시 대명사 해석
