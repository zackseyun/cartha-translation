translation:
  language: ko
  text: 보십시오[a], 그가 내 곁을 지나가지만[b] 나는 그를 보지 못합니다. 그가 지나쳐 가지만 나는 그를 분별하지 못합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 ‘보라’ 또는 ‘보라, 이제’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: יַעֲבֹר עָלַי는 ‘내 위를 지나가다’, ‘나를 지나쳐 가다’ 또는 ‘내 곁을 지나가다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: אָבִין לוֹ는 ‘그를 이해하지 못합니다’로도 옮길 수 있습니다. 히브리어는 이해와 식별·인지의 의미를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
