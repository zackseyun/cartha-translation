  naturalness: 합쇼체는 일관됩니다. 그러나 원문의 병렬을 한국어의 독립된 두 문장으로 옮기면 더 자연스럽고 명료하며, 각 대명사의 지시 대상도 분명해집니다.
  terminology: ‘분별하지 못합니다’는 אָבִין לוֹ의 인지·식별 의미를 무리 없이 살린 적절한 선택입니다. 문맥상 ‘그’는 하나님을 가리키지만, 원문처럼 대명사로 유지한 것은 절제된 처리입니다.
