  rationale: 문맥상 우주적 이미지가 있지만 한국어에서는 ‘땅’이 가장 자연스럽게 원문의 대상을 드러내며, ‘지구’는 현대 과학적 뉘앙스를 지나치게 강하게 만듭니다.
- source_word: מִמְּקוֹמָהּ
  english_pob_choice: from its place
  chosen_korean: 제자리에서
  alternatives_korean:
  - 그 자리에서
  - 원래 자리에서
  - 그 위치에서
  lexicon: HALOT
  rationale: ‘from its place’의 의미를 한국어 관용 표현으로 압축해, 원문의 위치 이탈 이미지를 살리면서도 문장을 매끄럽게 했습니다.
- source_word: וְעַמּוּדֶיהָ
  english_pob_choice: and its pillars
  chosen_korean: 그 땅의 기둥들도
  alternatives_korean:
  - 그 기둥들도
  - 그 받침대들도
  - 그 토대들도
  lexicon: HALOT
  rationale: ‘기둥’은 고대 우주론적 시상을 보존하는 가장 직접적인 대응이며, ‘토대’로 풀어버리면 이미지가 해석적으로 완화됩니다.
theological_decisions:
