  chosen_reading: ‘땅의 기둥들’이라는 비유를 그대로 살렸습니다.
  alternative_readings:
  - ‘토대들’로 옮겨 현대적 우주관에 맞춘 해석적 번역
  rationale: 본문은 시적·우주론적 이미지를 의도적으로 사용하므로, 이를 현대적으로 평탄화하지 않고 그대로 드러내는 것이 원문의 의미와 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve literary-theological tension rather than harmonize it.'
