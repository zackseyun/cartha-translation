  lexicon: HALOT
  rationale: ‘from its place’의 의미를 한국어 관용 표현으로 압축해, 원문의 위치 이탈 이미지를 살리면서도 문장을 매끄럽게 했습니다.
- source_word: וְעַמּוּדֶיהָ
