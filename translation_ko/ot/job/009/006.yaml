  chosen_korean: 그 땅의 기둥들도
  alternatives_korean:
  - 그 기둥들도
  - 그 받침대들도
  - 그 토대들도
  lexicon: HALOT
  rationale: ‘기둥’은 고대 우주론적 시상을 보존하는 가장 직접적인 대응이며, ‘토대’로 풀어버리면 이미지가 해석적으로 완화됩니다.
