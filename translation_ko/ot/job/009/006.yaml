  rationale: 문맥상 우주적 이미지가 있지만 한국어에서는 ‘땅’이 가장 자연스럽게 원문의 대상을 드러내며, ‘지구’는 현대 과학적 뉘앙스를 지나치게 강하게 만듭니다.
- source_word: מִמְּקוֹמָהּ
  english_pob_choice: from its place
