lexical_decisions:
- source_word: נֹטֶה
  english_pob_choice: stretches out
  chosen_korean: 펼치시고
  alternatives_korean:
  - 펼치십니다
  - 늘이십니다
  - 펴십니다
  lexicon: HALOT
  rationale: נטה의 ‘stretch out/spread out’ 의미를 살려, 창조적 행위를 자연스럽게 드러내는 현대 한국어 동사로 옮겼습니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘 나라
  - 하늘들(천상)
  lexicon: HALOT
  rationale: 시적 우주 문맥에서 שָׁמַיִם의 복수성을 반영해 ‘하늘들’로 옮겼고, 단순한 날씨의 하늘로 축소하지 않았습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: alone
  chosen_korean: 오직 그분만이
  alternatives_korean:
  - 홀로
  - 그분만이
  - 오로지 그분만이
  lexicon: HALOT
  rationale: 단독성·배타성을 강조하는 표현이라 ‘오직 그분만이’로 옮겨, 하나님의 유일한 행위를 분명히 했습니다.
- source_word: בָּמֳתֵי יָם
  english_pob_choice: the heights of the sea
  chosen_korean: 바다의 높은 곳들
  alternatives_korean:
  - 바다의 높은 곳
  - 바다의 물결 위
  - 바다의 높이들
  lexicon: HALOT
  rationale: POB의 본문처럼 ‘waves’로 바로 풀지 않고, 히브리어의 시적 은유인 ‘높은 곳들’을 살리되 한국어에서는 자연스럽게 ‘바다의 높은 곳들’로 표현했습니다.
theological_decisions:
- issue: 하나님의 창조적 주권을 시적 이미지로 유지할지 여부
  chosen_reading: 바다 위를 걷는 기적담으로 축소하지 않고, 하늘을 펴고 바다의 높은 곳들을 밟으시는 하나님의 유일한 주권을 시적으로 유지했습니다.
  alternative_readings:
  - 바다의 파도 위를 걷습니다
  - 바다의 물결을 밟으십니다
  rationale: 본문은 자연에 대한 하나님의 절대적 권위를 강조하는 시적 진술이므로, 해석을 과도하게 구체화하기보다 원문 이미지를 보존하는 편이 본문의 힘을 잘 살립니다.
  doctrine_reference: 창조주 하나님의 주권, 시적 계시의 보존
