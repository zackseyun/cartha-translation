id: JOB.9.17
reference: Job 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר בִּ/שְׂעָרָ֥ה יְשׁוּפֵ֑/נִי וְ/הִרְבָּ֖ה פְצָעַ֣/י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/017.yaml
  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
  footnotes:
  - marker: a
    text: Or 'with a storm' or 'in the tempest.' The Hebrew preposition can express manner or instrument.
    reason: lexical_alternative
  - marker: b
    text: The verb may also be rendered 'bruise' or, less likely here, 'snap at.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for no reason' or 'gratuitously.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 폭풍 속에서 저를 부수시고, 제 상처를 이유 없이 늘리십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 여기서 ‘~와 함께’ 같은 수단적 의미도, ‘~속에서’ 같은 장소·양태 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀 동사 שׁוּף은 문맥에 따라 ‘부수다’, ‘상하게 하다’, ‘짓누르다’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: חִנָּם은 ‘이유 없이’, ‘까닭 없이’, ‘값없이/부당하게’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׂעָרָה
  english_pob_choice: in a storm
  chosen_korean: 폭풍 속에서
  alternatives_korean:
  - 폭풍과 함께
  - 폭풍 가운데서
  - 폭풍으로
  lexicon: HALOT
  rationale: ב 접두사는 장소·방식·수단의 여지를 가지므로, ‘속에서’는 영어 POB의 ‘in a storm’처럼 폭풍의 한가운데라는 이미지를 자연스럽게 살리면서 문맥의 폭력을 드러냅니다.
- source_word: יְשׁוּפֵנִי
  english_pob_choice: crushes me
  chosen_korean: 저를 부수시고
  alternatives_korean:
  - 저를 짓누르시고
  - 저를 상하게 하시고
  - 저를 으깨시고
  lexicon: HALOT
  rationale: 이 희귀 동사는 단순한 스침보다 강한 해악을 가리키므로, ‘부수시고’로 강한 파괴성을 드러냈습니다. ‘부수다’는 시적 병렬인 ‘상처를 늘리다’와도 잘 어울립니다.
- source_word: פְצָעַי
  english_pob_choice: my wounds
  chosen_korean: 제 상처
  alternatives_korean:
  - 제 부상
  - 제 상처들
  - 제 상흔
  lexicon: HALOT
  rationale: פצע는 ‘상처/부상’을 뜻하므로 가장 직접적인 ‘상처’를 택했습니다. 소유격 ‘제’는 욥의 개인적 고통을 분명히 합니다.
- source_word: חִנָּם
  english_pob_choice: without cause
  chosen_korean: 이유 없이
  alternatives_korean:
  - 까닭 없이
  - 아무 이유 없이
  - 무고하게
  lexicon: HALOT
  rationale: חִנָּם은 ‘까닭 없이, 값없이, 부당하게’의 의미를 가지며, 여기서는 욥의 항변을 자연스러운 한국어로 전달하는 ‘이유 없이’가 적절합니다. 다만 이는 욥의 관점에서의 진술임을 유지합니다.
theological_decisions:
- issue: חִנָּם의 신학적 긴장—욥의 무고함 주장인지, 단순한 체감적 부당성인지
  chosen_reading: ‘이유 없이’로 직역에 가깝게 두어, 욥의 고발이 지닌 신학적 긴장을 해소하지 않았습니다.
  alternative_readings:
  - 까닭 없이
  - 무고하게
  - 내가 당할 만한 이유 없이
  rationale: 본문은 욥의 탄식과 항변을 드러내므로, 번역이 그 고통의 정당성 논쟁을 미리 결론내리면 안 됩니다. 영어 POB의 ‘without cause’처럼, 독자가 긴장을 그대로 읽도록 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
