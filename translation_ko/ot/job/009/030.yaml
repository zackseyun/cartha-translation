    reason: lexical_alternative
translation:
  language: ko
  text: 내가 만일 눈으로 나를 씻고 잿물로 내 손을 깨끗하게 하더라도[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잿물’은 고대 근동의 세정용 알칼리 물질을 가리키며, 영어 POB의 ‘lye’에 대응합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 내가 만일
  alternatives_korean:
  - 만약
  - 내가
  lexicon: WLC
  rationale: 히브리어 조건문을 자연스러운 한국어 조건 표현으로 옮겼습니다. '만일'은 가정적 조건을 분명히 드러냅니다.
- source_word: הִתְרָחַצְתִּי
  english_pob_choice: I washed myself
  chosen_korean: 나를 씻고
  alternatives_korean:
  - 내가 몸을 씻고
  - 내가 목욕하고
  lexicon: WLC
  rationale: 히트파엘의 재귀적 의미를 살리되, 한국어에서는 목적어를 드러내는 '나를 씻고'가 가장 자연스럽습니다.
- source_word: בְּבֹר
  english_pob_choice: with lye
  chosen_korean: 잿물로
  alternatives_korean:
  - 비누로
  - 알칼리성 세제로
  lexicon: HALOT
  rationale: בֹּר는 현대적 '비누'보다 고대의 알칼리성 세정제를 가리키므로, 한국어로는 '잿물'이 가장 근접합니다.
- source_word: כַּפָּי
  english_pob_choice: my hands
  chosen_korean: 내 손을
  alternatives_korean:
  - 내 손바닥을
  lexicon: WLC
  rationale: 직역하면 '손바닥'이지만, 정결을 나타내는 문맥에서는 한국어 관용상 '손'이 더 자연스럽고 의미를 보존합니다.
theological_decisions:
- issue: 정결 행위의 한계와 의도
  chosen_reading: 이 구절은 실제 정결 능력을 주장하기보다, 아무리 외적 정결을 극대화해도 더 깊은 부정을 스스로 해결할 수 없다는 가정을 드러냅니다.
  alternative_readings:
  - 단순한 위생의 과장된 표현
  - 의례적 정결만을 가리키는 진술
  rationale: 욥기의 논지상 화자는 최고의 세정 수단을 상정해도 한계가 있음을 말합니다. 따라서 표현을 도덕적/의례적 정결의 긴장으로 유지했습니다.
  doctrine_reference: 욥기 9장의 논증 구조
