source:
  edition: WLC
  text: אָ֭ז בַּ/שַּׁ֣חַת תִּטְבְּלֵ֑/נִי וְ֝/תִֽעֲב֗וּ/נִי שַׂלְמוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/031.yaml
  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
  footnotes:
  - marker: a
    text: Or 'into the ditch.' The Hebrew שַׁחַת can mean 'pit,' 'ditch,' or, in some contexts, 'destruction.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my garments would loathe me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 주께서 저를 구덩이[a]에 빠뜨리시고, 제 옷마저 저를 혐오할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도랑에’. 히브리어 שַׁחַת은 ‘구덩이’, ‘도랑’, 어떤 문맥에서는 ‘파멸’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 옷가지가 저를 혐오할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: then
  chosen_korean: 그러면
  alternatives_korean:
  - 그때
  - 그렇다면
  lexicon: HALOT
  rationale: 앞선 가정에 이어지는 순차적 의미를 자연스러운 합쇼체로 살렸습니다.
- source_word: בַּשַּׁחַת
  english_pob_choice: into the pit
  chosen_korean: 구덩이에
  alternatives_korean:
  - 웅덩이에
  - 함정에
  - 무덤에
  lexicon: HALOT
  rationale: שַׁחַת은 문맥상 ‘pit’ 계열의 구체적 이미지가 적합하여, ‘구덩이’로 옮겨 몸이 더럽혀지는 장면의 감각을 유지했습니다.
- source_word: תִּטְבְּלֵנִי
  english_pob_choice: you would plunge me
  chosen_korean: 빠뜨리시고
  alternatives_korean:
  - 담그시고
  - 적시시고
  - 잠기게 하시고
  lexicon: HALOT
  rationale: טבל의 기본 뜻인 ‘담그다/잠그다’를 문맥에 맞게 ‘빠뜨리다’로 옮겨, 씻은 뒤 다시 더러움에 던져지는 강한 역설을 살렸습니다.
- source_word: וְתִעֲבוּנִי
  english_pob_choice: would abhor me
  chosen_korean: 저를 혐오할 것입니다
  alternatives_korean:
  - 저를 역겨워할 것입니다
  - 저를 가증히 여길 것입니다
  - 저를 싫어할 것입니다
  lexicon: HALOT
  rationale: תעב의 강한 혐오·혐오감을 담아, 완곡한 ‘싫어하다’보다 직접적인 ‘혐오하다’를 택했습니다.
- source_word: שַׂלְמוֹתַי
  english_pob_choice: my own clothes
  chosen_korean: 제 옷마저
  alternatives_korean:
  - 제 의복마저
  - 제 겉옷마저
  - 제 옷들이
  lexicon: HALOT
  rationale: 외투/옷 전체를 가리키는 표현으로 이해하여, 소유의 아이러니를 드러내도록 ‘제 옷마저’로 압축했습니다.
theological_decisions:
- issue: 하나님의 직접적 행위와 고난의 긴장
  chosen_reading: 주께서 저를 구덩이에 빠뜨리시는 직접적 행위로 옮겼습니다.
  alternative_readings:
  - 사건이 그렇게 되어 제가 구덩이에 빠지게 된다는 우회적 표현
  rationale: 히브리어 2인칭 남성 단수 동사가 하나님께 직접 말하는 형식이므로, 그 긴장을 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 하나님의 주권과 고난의 긴장을 해소하지 않고 보존
