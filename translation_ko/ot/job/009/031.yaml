  rationale: טבל의 기본 뜻인 ‘담그다/잠그다’를 문맥에 맞게 ‘빠뜨리다’로 옮겨, 씻은 뒤 다시 더러움에 던져지는 강한 역설을 살렸습니다.
- source_word: וְתִעֲבוּנִי
  english_pob_choice: would abhor me
  chosen_korean: 저를 혐오할 것입니다
  alternatives_korean:
  - 저를 역겨워할 것입니다
  - 저를 가증히 여길 것입니다
  - 저를 싫어할 것입니다
  lexicon: HALOT
  rationale: תעב의 강한 혐오·혐오감을 담아, 완곡한 ‘싫어하다’보다 직접적인 ‘혐오하다’를 택했습니다.
- source_word: שַׂלְמוֹתַי
  english_pob_choice: my own clothes
  chosen_korean: 제 옷마저
  alternatives_korean:
  - 제 의복마저
  - 제 겉옷마저
  - 제 옷들이
  lexicon: HALOT
  rationale: 외투/옷 전체를 가리키는 표현으로 이해하여, 소유의 아이러니를 드러내도록 ‘제 옷마저’로 압축했습니다.
theological_decisions:
- issue: 하나님의 직접적 행위와 고난의 긴장
  chosen_reading: 주께서 저를 구덩이에 빠뜨리시는 직접적 행위로 옮겼습니다.
  alternative_readings:
  - 사건이 그렇게 되어 제가 구덩이에 빠지게 된다는 우회적 표현
  rationale: 히브리어 2인칭 남성 단수 동사가 하나님께 직접 말하는 형식이므로, 그 긴장을 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 하나님의 주권과 고난의 긴장을 해소하지 않고 보존
