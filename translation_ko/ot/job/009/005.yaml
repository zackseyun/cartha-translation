  source_fidelity: 히브리어는 ‘산들’(복수)을 옮기시는 분과, 그분이 노여움으로 산들을 뒤엎으시는 일을 알지 못하는 산들의 의인화를 말합니다. 초안의 ‘산을’은 집합적으로 읽을 수 있으나 원문의 복수를 충분히 드러내지 못하며, ‘그들도 알지 못합니다 — …때에’라는 연결은 אֲשֶׁר 이하가 알지 못하는 내용임을 불분명하게 합니다.
