base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
  footnotes:
  - marker: a
    text: Or 'He moves mountains.' The Hebrew verb can denote causing something to shift from its place.
    reason: lexical_alternative
  - marker: b
    text: The line poetically personifies the mountains as not knowing when God overturns them.
    reason: cultural_note
  - marker: c
    text: Or 'in his wrath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 산들을[a] 옮기시되, 산들은 그가 노여움으로[c] 그것들을 뒤엎으시는 것을 알지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들을 움직이십니다.’ 히브리어 동사는 어떤 것을 제자리에서 다른 곳으로 움직이게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 산들이 그가 그것들을 뒤엎으시는 일을 알지 못한다는 의인화된 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그의 진노로.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  english_pob_choice: removes
  chosen_korean: 옮기시니
  alternatives_korean:
  - 옮기십니다
  - 제거하시니
  - 옮겨 버리시니
  lexicon: HALOT
  rationale: 히필 분사로서 ‘제자리에서 다른 곳으로 옮기다’는 뜻을 살려, 산에 대한 시적 표현에 자연스러운 ‘옮기시니’를 택했습니다. ‘제거하다’는 의미가 지나치게 강하고, ‘옮겨 버리다’는 구어적입니다.
- source_word: הָרִים
  english_pob_choice: mountains
  chosen_korean: 산을
  alternatives_korean:
  - 산들
  - 산맥을
  lexicon: HALOT
  rationale: 복수형을 한국어에서 가장 자연스럽게 보존하기 위해 ‘산을’로 처리했습니다. 문맥상 거대한 산들을 가리킵니다.
- source_word: וְלֹא יָדָעוּ
  english_pob_choice: and they do not know it
  chosen_korean: 그들도 알지 못합니다
  alternatives_korean:
  - 그들도 모릅니다
  - 그들은 알지 못합니다
  - 옮겨진 줄도 모릅니다
  lexicon: HALOT
  rationale: 히브리어의 의인화된 표현을 유지하되, 한국어에서는 목적어를 과도하게 드러내지 않고도 뜻이 드러나도록 옮겼습니다. POB의 ‘and they do not know it’에 맞춰 산들이 알지 못한다는 점을 살렸습니다.
- source_word: בְּאַפּוֹ
  english_pob_choice: in his anger
  chosen_korean: 노여움으로
  alternatives_korean:
  - 분노로
  - 진노로
  - 그의 노여움 가운데
  lexicon: HALOT
  rationale: אַף의 관용적 의미인 ‘anger/wrath’를 드러내되, 시적이고 현대적인 어감을 위해 ‘노여움으로’를 택했습니다. POB의 ‘in his anger’에 해당합니다.
theological_decisions:
- issue: 하나님의 감정 표현을 어떻게 한국어로 유지할지
  chosen_reading: ‘노여움으로’와 ‘뒤엎으실 때에’로 하나님의 심판적 행위를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘진노로’
  - ‘성내어’
  - ‘무너뜨리실 때에’
  rationale: 본문은 단순한 자연 현상이 아니라 하나님의 주권적이고 감정적인 개입을 말하므로, 이를 완화하지 않고 그대로 살리는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 하나님의 주권과 심판에 대한 구약의 시적 표현
