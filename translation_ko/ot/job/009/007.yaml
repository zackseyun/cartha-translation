id: JOB.9.7
reference: Job 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֹמֵ֣ר לַ֭/חֶרֶס וְ/לֹ֣א יִזְרָ֑ח וּ/בְעַ֖ד כּוֹכָבִ֣ים יַחְתֹּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/007.yaml
  text: who says to the sun[b][a], ‘Do not rise,’ and seals up the stars.
  footnotes:
  - marker: a
    text: Or, more literally, 'and it does not rise'; the Hebrew may express either the command spoken to the sun or the result of God's word.
    reason: lexical_alternative
  - marker: b
    text: Hebrew חֶרֶס here likely means 'sun' in poetic usage; elsewhere the word can refer to earthenware or clay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 해에게 ‘떠오르지 말라’고 말씀하시고, 별들을 봉인하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶרֶס는 이 시적 문맥에서 ‘해’를 뜻합니다. 다른 문맥에서는 토기나 질그릇 조각을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘떠오르지 말라’는 히브리어를 명령으로 읽은 번역입니다. ‘그가 말하시면 해가 뜨지 않는다’처럼 결과를 나타내는 읽기도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמֵר
  english_pob_choice: who says
  chosen_korean: 말씀하시고
  alternatives_korean:
  - 말하시는 분이시고
  - 말하는 분이시고
  lexicon: HALOT
  rationale: 앞절의 주어가 하나님임을 이어 받는 분사적 표현이므로, 한국어에서는 서술을 자연스럽게 이어 주는 ‘말씀하시고’로 옮겨 행위의 지속성과 주어의 주권성을 살렸습니다.
- source_word: לַחֶרֶס
  english_pob_choice: to the sun
  chosen_korean: 해에게
  alternatives_korean:
  - 태양에게
  - 해를 향해
  lexicon: HALOT
  rationale: 시적 문맥에서 חֶרֶס는 ‘해’의 뜻으로 보는 것이 자연스럽고, 한국어 성경체에서는 ‘해’가 가장 간결하고 직접적입니다.
- source_word: וְלֹא יִזְרָח
  english_pob_choice: ‘Do not rise,’
  chosen_korean: ‘떠오르지 말라’고
  alternatives_korean:
  - ‘떠오르지 않는다’고
  - ‘뜬들 말라’고
  lexicon: HALOT
  rationale: 영문 POB가 명령의 내용으로 읽은 해석을 따라, 한국어도 직접명령형으로 처리해 태양을 향한 주권적 금지를 드러냈습니다.
- source_word: יַחְתֹּם
  english_pob_choice: seals up
  chosen_korean: 봉인하십니다
  alternatives_korean:
  - 봉하십니다
  - 막으십니다
  - 봉쇄하십니다
  lexicon: HALOT
  rationale: חתם의 핵심 이미지는 ‘봉인하다/도장을 찍어 막다’이므로, ‘봉인하십니다’가 별들을 가두어 보이지 않게 하는 시적·우주적 통제를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 시적 의인화와 하나님의 우주적 주권
  chosen_reading: 해와 별들을 향한 명령을 실제 자연 현상에 대한 하나님의 절대 주권 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 표현으로 완화하는 읽기
  - 자연현상 일반에 대한 상징적 서술로만 축소하는 읽기
  rationale: 본문은 하나님이 해에게 말하고 별들을 봉인하시는 장면을 통해 창조 세계 전체가 그분의 명령 아래 있음을 강조하므로, 의인화를 약화하지 않고 그대로 살리는 것이 문맥에 맞습니다.
  doctrine_reference: 창조주 하나님의 섭리와 주권
- issue: 명령형 번역의 직접성
  chosen_reading: ‘떠오르지 말라’로 옮겨, 결과 서술보다 명령의 내용이 분명히 드러나게 했습니다.
  alternative_readings:
  - ‘떠오르지 않는다’로 결과를 서술하는 번역
  - ‘떠오르게 하지 않으신다’로 우회하는 번역
  rationale: 히브리어의 형태상 결과 의미도 가능하지만, 영문 POB의 감사된 판단처럼 여기서는 태양에게 향한 명령으로 읽는 것이 시적 힘을 살립니다.
  doctrine_reference: 본문 중심 번역 원칙
