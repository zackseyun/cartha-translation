source:
  edition: WLC
  text: עֹשֶׂ֣ה גְ֭דֹלוֹת עַד אֵ֣ין חֵ֑קֶר וְ/נִפְלָא֗וֹת עַד אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/010.yaml
  text: who does great things beyond searching out[b][a], and wonders beyond number.
  footnotes:
  - marker: a
    text: Or 'past finding out.' The Hebrew idiom means that his great acts cannot be fully investigated or comprehended.
    reason: lexical_alternative
  - marker: b
    text: Or 'without number.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 헤아릴 수 없는 큰일을 하시며, 헤아릴 수 없는 놀라운 일들을 행하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤아릴 수 없는’은 본문의 관용구가 뜻하는 ‘끝까지 조사하거나 이해할 수 없음’을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰일’은 문자적으로는 ‘큰 것들’이며, 여기서는 하나님의 위대한 행위들을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: עֹשֶׂה
  english_pob_choice: who does
  chosen_korean: 하시며
  alternatives_korean:
  - 하시는 분이며
  - 행하시며
  lexicon: HALOT
  rationale: 현재 분사적 서술을 한국어에서 자연스럽게 풀어, 앞 문맥의 하나님을 수식하는 지속적·서술적 의미를 살렸습니다.
- source_word: גְדֹלוֹת
  english_pob_choice: great things
  chosen_korean: 큰일
  alternatives_korean:
  - 큰 일들
  - 위대한 일들
  - 큰 업적
  lexicon: HALOT
  rationale: ‘great things’의 넓은 범위를 유지하면서도, 능력의 행위라는 뉘앙스를 한국어에서 간결하게 담았습니다.
- source_word: עַד אֵין חֵקֶר
  english_pob_choice: beyond searching out
  chosen_korean: 헤아릴 수 없는
  alternatives_korean:
  - 찾아낼 수 없는
  - 조사할 수 없는
  - 다 헤아릴 수 없는
  lexicon: HALOT
  rationale: 히브리어 관용구가 인간의 탐구·이해의 한계를 뜻하므로, ‘헤아릴 수 없는’으로 의미를 자연스럽게 전달했습니다.
- source_word: וְנִפְלָאוֹת
  english_pob_choice: and wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 행위
  lexicon: HALOT
  rationale: ‘wonders’의 경탄성과 초월적 성격을 살리되, 현대 한국어에서 지나치게 종교적 관용구로 굳지 않은 표현을 택했습니다.
theological_decisions:
- issue: 두 평행구의 반복 표현을 어떻게 옮길지
  chosen_reading: 두 구절 모두 ‘헤아릴 수 없는’으로 옮겨, 하나님의 행위가 지식과 수의 양쪽에서 모두 인간의 한계를 넘는다는 점을 드러냈습니다.
  alternative_readings:
  - 첫 구만 ‘헤아릴 수 없는’, 둘째 구는 ‘셀 수 없는’으로 구분
  - 두 구 모두 ‘알 수 없는’으로 통합
  rationale: 히브리어는 ‘탐구 불가’와 ‘무수함’을 병행하므로, 동일한 핵심 표현을 반복해 병렬 구조와 강조를 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 하나님의 초월성과 인간 이해의 한계
