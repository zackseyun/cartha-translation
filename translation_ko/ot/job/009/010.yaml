translation:
  language: ko
  text: 주께서는 아무도 다 밝혀낼 수 없는 위대한 일들을 행하시며[a], 셀 수 없이 많은 놀라운 일들을 행하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘탐구함이 없는 데까지’입니다. 이 관용구는 그 행위들을 끝까지 조사하거나 충분히 이해할 수 없다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘수가 없는 데까지’입니다.
    reason: lexical_alternative
