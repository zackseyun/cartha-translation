translation:
  language: ko
  text: 나는 흠이 없습니다[a]. 나는 내 자신을 알지 못합니다. 나는 내 생명을 싫어합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 내 영혼/자아를 알지 못합니다.” 히브리어 네페쉬의 넓은 의미를 보존한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  english_pob_choice: blameless
  chosen_korean: 흠이 없습니다
  alternatives_korean:
  - 온전합니다
  - 결백합니다
  - 책망할 것이 없습니다
  lexicon: HALOT
  rationale: תָּם은 완전함·온전함의 뜻을 가지며 욥기에서는 종종 ‘흠이 없는/책망할 것이 없는’ 자기를 묘사하는 말로 쓰입니다. 한국어에서는 ‘흠이 없습니다’가 문맥상 자연스럽고, 도덕적 완전무결성으로 과장하지 않으면서도 원문의 자기 진술을 잘 살립니다.
- source_word: לֹא אֵדַע נַפְשִׁי
  english_pob_choice: I do not know myself
  chosen_korean: 나는 내 자신을 알지 못합니다
  alternatives_korean:
  - 나는 내 영혼을 알지 못합니다
  - 나는 내 생명을 알지 못합니다
  - 나는 나를 인정하지 않습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ은 영혼, 자아, 생명까지 포괄할 수 있으므로, 한국어에서는 ‘내 자신’으로 옮겨 자기 소외의 의미를 살렸습니다. ‘영혼’이나 ‘생명’으로 고정하면 원문의 폭이 좁아질 수 있습니다.
- source_word: אֶמְאַס חַיָּי
  english_pob_choice: I despise my life
  chosen_korean: 나는 내 생명을 싫어합니다
  alternatives_korean:
  - 나는 내 삶을 혐오합니다
  - 나는 내 생명을 경멸합니다
  - 나는 내 삶을 버립니다
  lexicon: HALOT
  rationale: מָאַס는 ‘거절하다/싫어하다/경멸하다’의 폭을 가지지만, 한국어에서는 ‘싫어합니다’가 가장 직접적이며 과도한 정서적 강도를 덧씌우지 않습니다. חַיִּים의 1인칭 소유형은 여기서 ‘내 생명’이 자연스럽습니다.
theological_decisions:
- issue: 욥의 자기 평가 강도
  chosen_reading: ‘흠이 없습니다’는 욥의 자기변호를 드러내되, 무죄 절대화보다는 문맥상 신분적·도덕적 결백 주장으로 읽습니다.
  alternative_readings:
  - ‘온전합니다’로 더 중립적으로 완화
  - ‘결백합니다’로 법정적 뉘앙스를 강화
  rationale: 욥기에서 תָּם은 완전무결한 죄 없음을 선언하기보다, 하나님 앞에서의 정직함과 책망받을 만한 흠이 없음을 주장하는 뉘앙스가 강합니다. 따라서 한국어도 과장 없이 자기 진술의 긴장을 유지해야 합니다.
  doctrine_reference: 욥 9장 전체의 논쟁 맥락; תָּם의 용례(욥 1:1, 1:8, 2:3)
