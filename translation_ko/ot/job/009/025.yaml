translation:
  language: ko
  text: 내 날들은 달리는 사람보다 더 빠르고, 달아나며, 좋은 것[a]을 보지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번영’이나 ‘안녕’을 뜻할 수 있습니다.
