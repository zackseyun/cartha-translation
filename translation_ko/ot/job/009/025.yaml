lexical_decisions:
- source_word: יָמַי
  english_pob_choice: my days
  chosen_korean: 나의 날들
  alternatives_korean:
  - 내 생애의 날들
  - 내 날들
  lexicon: HALOT
  rationale: 히브리어의 소유격 복수 표현을 자연스러운 현대 한국어로 옮기되, 생애 전체를 가리키는 시간적 의미를 살리기 위해 ‘나의 날들’로 처리했습니다.
- source_word: קַלוּ
  english_pob_choice: are swifter
  chosen_korean: 더 빠르고
  alternatives_korean:
  - 더 가볍고
  - 더 민첩하고
  lexicon: HALOT
  rationale: ‘가볍다/빠르다’의 어근 의미가 있으나, 달리는 사람과의 비교에서는 속도의 의미가 핵심이므로 ‘더 빠르고’가 가장 직접적입니다.
- source_word: מִנִּי רָץ
  english_pob_choice: than a runner
  chosen_korean: 달리는 사람보다
  alternatives_korean:
  - 달리기 선수보다
  - 달리는 자보다
  lexicon: HALOT
  rationale: 비교 대상인 רָץ는 일반적인 ‘달리는 사람’으로 충분하며, ‘사자/전령’ 같은 특정 직역은 문맥상 과합니다.
- source_word: טוֹבָה
  english_pob_choice: good
  chosen_korean: 좋은 것
  alternatives_korean:
  - 복된 것
  - 형통함
  - 번영
  lexicon: HALOT
  rationale: 영어 POB가 ‘good’의 범위를 넓게 유지하듯, 히브리어의 포괄적 의미를 살려 구체화하지 않은 ‘좋은 것’으로 옮겼습니다.
theological_decisions:
- issue: ‘좋은 것’의 범위
  chosen_reading: 특정한 번영이나 행복으로 한정하지 않고, 일반적인 ‘좋은 것’으로 유지했습니다.
  alternative_readings:
  - 번영
  - 평안
  - 복
  rationale: טוֹבָה는 문맥상 삶의 유익 전반을 가리킬 수 있으므로, 의미를 좁혀 독자가 텍스트의 넓이를 잃지 않도록 했습니다.
  doctrine_reference: 해석학적 중립성
