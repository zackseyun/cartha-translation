id: JOB.9.19
reference: Job 9:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
  footnotes:
  - marker: a
    text: Or 'if it is a matter of judgment, who can appoint me a hearing?' The Hebrew verb is difficult, and some take the object as 'me' rather than 'him.'
    reason: alternative_reading
  - marker: b
    text: '''Justice'' may also be rendered ''judgment'' or ''legal case.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 만약 힘에 관한 일이라면, 보십시오, 그는 강하십니다. 그리고 만약 정의에 관한 일이라면, 누가 그를 소환할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판의 일이라면, 누가 나를 재판에 부를 수 있겠습니까?’ 히브리어 동사는 어렵고, 어떤 이들은 목적어를 ‘그를’이 아니라 ‘나를’로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: ‘정의’는 ‘심판’ 또는 ‘법적 사건’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לְכֹחַ
  english_pob_choice: If it is a matter of strength
  chosen_korean: “만약 힘에 관한 일이라면”
  alternatives_korean:
  - “만약 힘의 문제라면”
  - “만약 힘에 대하여라면”
  lexicon: HALOT
  rationale: לְ와 כֹחַ의 결합은 단순한 소유보다 ‘~에 관한/관련된’ 범주를 드러내므로, 한국어에서는 법정적·논리적 문맥을 살려 “힘에 관한 일”로 옮겼습니다.
- source_word: אַמִּיץ
  english_pob_choice: mighty
  chosen_korean: “강하십니다”
  alternatives_korean:
  - “강력하십니다”
  - “능하십니다”
  lexicon: HALOT
  rationale: 앞의 ‘힘’과 중복을 피하면서도 압도적 능력을 드러내기 위해 ‘강하다’를 택했고, 인칭이 아닌 서술형으로 정리했습니다.
- source_word: לְמִשְׁפָּט
  english_pob_choice: of justice
  chosen_korean: “정의에 관한 일이라면”
  alternatives_korean:
  - “심판에 관한 일이라면”
  - “법적 사건이라면”
  lexicon: HALOT
  rationale: 미슈파트는 ‘심판/재판/법적 사건’까지 아우르지만, 이 절의 변론·송사 이미지를 살리기 위해 ‘정의’로 옮기되 ‘관한 일’로 법정 맥락을 열어 두었습니다.
- source_word: יוֹעִידֵנִי
  english_pob_choice: can summon him
  chosen_korean: “누가 그를 소환할 수 있겠습니까?”
  alternatives_korean:
  - “누가 그를 소환하겠습니까?”
  - “누가 그를 재판에 부를 수 있겠습니까?”
  - “누가 저를 소환할 수 있겠습니까?”
  lexicon: HALOT
  rationale: 문맥상 하나님을 법정에 불러내는 뜻이 가장 강하므로 ‘소환하다’로 직역성을 살렸습니다. 히브리어 형태는 ‘저를’로도 읽을 여지가 있어 그 난해함을 주석으로 보존했습니다.
theological_decisions:
- issue: 욥기의 법정 은유를 어떻게 보존할 것인가
  chosen_reading: ‘정의’와 ‘소환’ 어휘를 사용해 하나님과의 송사 이미지를 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - 더 일반적으로 ‘심판’으로 옮겨 법정성을 완화하는 방법
  rationale: 이 절은 하나님 앞에서 인간이 소송을 제기할 수 없다는 긴장을 드러내므로, 해석적으로 매끈하게 만들지 않고 법정적 표현을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
