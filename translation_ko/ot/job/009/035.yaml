translation:
  language: ko
  text: 그러면 내가 말하고 그분을 두려워하지 않겠습니다. 그러나 내게는 그렇지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “이는 내가 내게 그렇게 있지 않기 때문이다”입니다. 히브리어 마지막 절은 타원적이고 해석이 어려워, “내게는 그렇지 않다” 또는 “나는 그렇지 않다”로 이해할 수 있습니다.
    reason: lexical_alternative
