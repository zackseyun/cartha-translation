  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
  footnotes:
  - marker: a
    text: Or, 'for it is not so with me,' or more formally, 'for not so am I with myself.' The Hebrew final clause is elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 말하고 그분을 두려워하지 않겠는데, 내게는 그렇지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절은 히브리어상 생략이 있는 표현으로, ‘내게는 그렇지 않기 때문입니다’처럼 풀거나 ‘나는 그렇지 않기 때문입니다’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  english_pob_choice: Then I would speak
  chosen_korean: 그러면 내가 말하고
  alternatives_korean:
  - 내가 말하겠습니다
  - 그때 내가 말하리라
  lexicon: HALOT
  rationale: 1인칭 단수 cohortative/미완료형의 의지를 반영하되, 앞 문맥의 가정적 흐름을 살려 ‘그러면 내가 말하고’로 옮겼습니다.
- source_word: וְלֹא אִירָאֶנּוּ
  english_pob_choice: and not fear him
  chosen_korean: 그분을 두려워하지 않겠는데
  alternatives_korean:
  - 그분을 두려워하지 않고
  - 그분을 무서워하지 않겠는데
  lexicon: HALOT
  rationale: ירא의 기본 의미를 ‘두려워하다’로 살리고, 목적어 대명사를 존대 맥락에 맞게 ‘그분’으로 처리했습니다.
- source_word: כִּי לֹא כֵן
  english_pob_choice: for I am not so in myself / for it is not so with me
  chosen_korean: 내게는 그렇지 않기 때문입니다
  alternatives_korean:
  - 나는 그렇지 않기 때문입니다
  - 내 안에서는 그렇지 않기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 종결절을 한국어에서 자연스럽게 풀되, 원문의 엘립시스와 의미의 여지를 보존했습니다.
- source_word: עִמָּדִי
  english_pob_choice: in myself
  chosen_korean: 내게는
  alternatives_korean:
  - 나와 함께
  - 내 안에
  lexicon: HALOT
  rationale: 직역인 ‘with me’보다, 문맥상 현재의 상태를 가리키는 표현으로 읽히는 점을 살려 한국어에서 가장 덜 해석적인 ‘내게는’으로 조정했습니다.
theological_decisions:
- issue: 엘립시스가 있는 마지막 절의 처리
  chosen_reading: 욥이 하나님 앞에서 담대히 말할 수 있으나, 지금 자신의 상태가 그렇지 않다는 뜻을 간결하게 살렸습니다.
  alternative_readings:
  - ‘내게는 그렇지 않기 때문입니다’ 대신 ‘나는 그렇지 않기 때문입니다’
  - ‘그분 앞에서는 그렇지 않기 때문입니다’로 구체화
  rationale: 마지막 절은 히브리어상 압축되어 있어 해석을 과도하게 단정하지 않고, 한국어에서도 원문의 열린 의미를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
