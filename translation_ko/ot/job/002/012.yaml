base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
  footnotes:
  - marker: a
    text: Or 'from afar.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'toward the heavens,' that is, upward in a gesture of mourning.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 멀리서 눈을 들었을 때[a], 그를 알아보지 못했습니다. 그들은 목소리를 높여 울었고[b], 각 사람은 자기 겉옷을 찢고, 자기 머리 위로 먼지를 하늘을 향해 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 거리에서’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘하늘을 향해’는 위쪽 방향을 나타내며, 여기서는 애도의 몸짓을 묘사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  english_pob_choice: they lifted up their eyes
  chosen_korean: 눈을 들어 올렸을 때
  alternatives_korean:
  - 눈을 들었을 때
  - 올려다보았을 때
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 단순한 시선 이동보다 장면의 서술적 긴장을 살리기 위해 ‘눈을 들어’로 표현했습니다.
- source_word: מֵרָחוֹק
  english_pob_choice: from a distance
  chosen_korean: 멀리서
  alternatives_korean:
  - 먼 거리에서
  - 저 멀리서
  lexicon: HALOT
  rationale: 공간적 거리를 간결하고 현대적인 한국어로 전달합니다. 본문에는 물리적 거리가 강조됩니다.
- source_word: וְלֹא הִכִּירֻהוּ
  english_pob_choice: they did not recognize him
  chosen_korean: 그를 알아보지 못했습니다
  alternatives_korean:
  - 그를 알아채지 못했습니다
  - 그를 몰라보았습니다
  lexicon: HALOT
  rationale: 문맥상 욥의 외형을 알아보지 못한 뜻이므로, 관계 인식보다 시각적 식별을 드러내는 ‘알아보지 못하다’가 가장 정확합니다.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  english_pob_choice: threw dust over their heads toward the heavens
  chosen_korean: 자기 머리 위로 먼지를 하늘을 향해 던졌습니다
  alternatives_korean:
  - 머리 위로 흙을 던졌습니다
  - 머리 위로 먼지를 하늘로 던졌습니다
  lexicon: HALOT
  rationale: 애도 행위의 몸짓을 살리기 위해 ‘머리 위로’와 방향어 ‘하늘을 향해’를 함께 유지했습니다. ‘먼지’는 עָפָר의 기본 의미를 살리면서 한국어로 자연스럽습니다.
theological_decisions:
- issue: 애도 제스처의 방향 표현
  chosen_reading: ‘하늘을 향해’는 단순한 위치 설명이 아니라 애도 중 위로 던지는 동작의 방향을 드러내는 표현으로 보았습니다.
  alternative_readings:
  - ‘하늘로’
  - ‘하늘을 향하여’
  rationale: 히브리어의 הַשָּׁמָיְמָה는 방향성을 가진 형태이므로, 행위의 상향 동작을 본문대로 보존하는 것이 좋습니다.
  doctrine_reference: 본문 서술의 문화적 몸짓 재현
