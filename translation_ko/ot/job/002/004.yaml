  source_fidelity: 핵심 속담 עוֹר בְּעַד עוֹר는 ‘피는 피로’가 아니라 ‘가죽은 가죽으로’(또는 ‘살갗은 살갗으로’)입니다. ‘피’는 원문에 없고, 원문의 피부/가죽 이미지를 다른 신체 이미지로 바꾸므로 수정이 필요합니다. 나머지 절은 ‘사람이 가진 모든 것’과 자신의 생명을 맞바꾸려 한다는 뜻을 충실히 전달합니다.
  naturalness: ‘그 대적’보다 역할 명칭으로서의 ‘그 대적자’가 현대 한국어에서 더 자연스럽고 지시 대상도 분명합니다. ‘가죽은 가죽으로!’는 다소 낯선 속담형 표현이지만, 원문의 압축성과 의도된 해석 여지를 보존하는 안전한 번역입니다.
  terminology: הַשָּׂטָן의 정관사형 역할 명칭은 ‘그 대적자’로, יהוה는 프로젝트 선택을 따라 ‘야훼’로 옮깁니다. נֶפֶשׁ는 이 문맥에서 ‘생명’으로 적절합니다. 각주 표지는 해당 어구 바로 뒤에 배치합니다.
