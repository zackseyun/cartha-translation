- from: 그때 그 대적이 야훼께 대답하여 말했습니다. 「피는 피로! 참으로 사람은 자기 생명을 위해 자기의 모든 것을 내줄 것입니다.」[a][b][c]
  to: 그 대적자가 야훼께 대답하여 말했습니다. “가죽은 가죽으로![b] 참으로 사람이 가진 모든 것은 자기 생명을 위해 내줄 것입니다.[c]”[a]
  rationale: 원문의 עור(피부·가죽)를 ‘피’로 대체한 중대한 어휘 오류를 ‘가죽’으로 바로잡았습니다. 속담을 설명적으로 풀어쓰지 않아 원문의 간결함과 일부 해석상의 여지를 유지했습니다. 또한 역할 칭호는 자연스러운 현대 한국어인 ‘그 대적자’로 다듬고, 각주 표지를 관련 어구에 연결했습니다.
