reference: Job 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
  footnotes:
  - marker: a
    text: Or “Satan”; Hebrew has the title-like form “the satan/adversary.”
    reason: alternative_reading
  - marker: b
    text: “Skin for skin” is a proverb, likely meaning that a person will surrender one thing to protect his own life.
    reason: cultural_note
  - marker: c
    text: Or “for his soul/self.” Here “life” best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 대적이 야훼께 대답하여 말했습니다. 「피는 피로! 참으로 사람은 자기 생명을 위해 자기의 모든 것을 내줄 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 대적’은 히브리어에 정관사가 붙은 역할명칭을 반영한 것입니다. 이 문맥은 고유명사 ‘사탄’으로 확정하기보다 ‘대적’이라는 칭호를 유지하는 편이 더 직접적입니다.
    reason: alternative_reading
  - marker: b
    text: 이 표현은 속담처럼 쓰인 말로, 대체로 사람이 자기 생명을 지키기 위해 다른 것을 내준다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 히브리어 נֶפֶשׁ는 ‘혼’보다 ‘생명’의 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 그 대적
  alternatives_korean:
  - 사탄
  - 고발자
  lexicon: HALOT
  rationale: 정관사와 함께 쓰여 고유명사보다 직분/역할 칭호로 기능하므로, 문맥의 법정적·대항적 뉘앙스를 살려 ‘대적’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값을 따라 신적 고유명을 ‘야훼’로 일관되게 표기했습니다.
- source_word: עוֹר בְּעַד עוֹר
  english_pob_choice: Skin for skin
  chosen_korean: 피는 피로
  alternatives_korean:
  - 살은 살로
  - 가죽은 가죽으로
  - 피부는 피부로
  lexicon: HALOT
  rationale: 히브리어는 짧은 속담형 표현이라 직역보다 관용의 힘을 살려야 하므로, 한국어에서도 같은 교환/대가의 압축성을 지키는 간결한 속담형으로 옮겼습니다. 다만 원문 이미지의 육체성을 완전히 지우지 않도록 ‘피’로 유지했습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 혼
  - 자기 자신
  lexicon: HALOT
  rationale: 여기서는 비물질적 ‘혼’보다 생명 보존의 뜻이 분명하므로 ‘생명’이 문맥에 가장 정확합니다.
theological_decisions:
- issue: ‘Skin for skin’ 속담의 의미를 얼마나 풀어 쓸 것인지
  chosen_reading: 한국어 본문은 압축된 교환 격언으로 유지하되, 의미를 과도하게 설명하지 않았습니다.
  alternative_readings:
  - ‘제 살은 제 살로’처럼 더 직역하기
  - ‘자기 목숨을 지키려고 무엇이든 내준다’처럼 설명하기
  rationale: 원문은 독자가 의미를 추론하도록 남겨 둔 속담이므로, 번역도 그 긴장을 보존하는 것이 적절합니다. 본문에서 풀어쓰면 원문의 응축된 수사 효과가 약해집니다.
  doctrine_reference: 원문 수사 보존; 과잉 해석 회피
