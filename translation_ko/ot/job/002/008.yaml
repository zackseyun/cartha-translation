revisions:
- from: 그러자 그는 자신을 긁으려고 항아리 조각 하나를 가져다가 재 한가운데에 앉아 있었습니다.[a][b]
  to: 그러자 그는 재 가운데에 앉아 있으면서, 자기 몸을 긁어 문지르기 위해 질그릇 조각 하나를 집어 들었습니다.[a][b]
  rationale: 수정문은 와우 연속형의 서사 진행(‘그러자 … 집어 들었습니다’)을 유지하고, 재 가운데에 앉아 있는 것을 동시 상황으로 나타냈습니다. 또한 질그릇 조각이 자기 몸을 긁는 데 쓰이는 도구라는 관계를 ‘긁어 문지르기 위해’로 자연스럽게 밝혔습니다. 각주 표지는 본문 끝에 그대로 유지했으며, 두 각주의 대안 기능을 각각 보존했습니다.
