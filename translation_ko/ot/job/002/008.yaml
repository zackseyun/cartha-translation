id: JOB.2.8
reference: Job 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֣/וֹ חֶ֔רֶשׂ לְ/הִתְגָּרֵ֖ד בּ֑/וֹ וְ/ה֖וּא יֹשֵׁ֥ב בְּ/תוֹךְ הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/008.yaml
  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
  footnotes:
  - marker: a
    text: Or 'a shard of pottery.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to scratch himself.' The Hebrew verb can denote scratching, but 'scrape' better matches the use of a potsherd.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 자신을 긁으려고 항아리 조각 하나를 가져다가 재 한가운데에 앉아 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘항아리 파편’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘긁으려고’로도 옮길 수 있습니다. 히브리어 동사는 ‘긁다’의 뜻도 지니지만, 항아리 조각의 용도에는 ‘스크래치하다/긁어내다’의 느낌이 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  english_pob_choice: And he took
  chosen_korean: 그러자 그는 가져다가
  alternatives_korean:
  - 그리고 그는 가져갔습니다
  - 그는 자신을 위해 가져다가
  lexicon: HALOT
  rationale: וַיִּקַּח은 서술을 이어 주는 단순한 진행을 살려 ‘그러자 … 가져다가’로 옮겼고, לוֹ의 방향성은 한국어에서 자연스럽게 드러나게 했습니다.
- source_word: חֶרֶשׂ
  english_pob_choice: a potsherd
  chosen_korean: 항아리 조각 하나
  alternatives_korean:
  - 옹기 조각 하나
  - 도기 조각 하나
  - 토기 조각 하나
  lexicon: HALOT
  rationale: חֶרֶשׂ는 깨진 질그릇 조각을 가리키므로, 현대 한국어에서 바로 이해되면서도 파편성을 살리는 ‘항아리 조각’으로 옮겼습니다.
- source_word: לְהִתְגָּרֵד בּוֹ
  english_pob_choice: to scrape himself
  chosen_korean: 자신을 긁으려고
  alternatives_korean:
  - 자신을 긁어내려고
  - 자신을 긁으려고
  lexicon: HALOT
  rationale: 히트파엘 동사는 자기 몸에 가해지는 동작을 나타내며, potsherd의 용도를 살려 ‘긁다’로 옮기되 과도한 의역은 피했습니다.
- source_word: בְּתוֹךְ הָאֵפֶר
  english_pob_choice: among the ashes
  chosen_korean: 재 한가운데에
  alternatives_korean:
  - 재 속에
  - 재 가운데
  lexicon: HALOT
  rationale: בְּתוֹךְ은 ‘가운데/한가운데’의 공간감을 주므로, 욥이 재더미 속에 앉아 있는 장면을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 욥의 행동 묘사의 강도
  chosen_reading: ‘긁으려고’로 옮겨, 단순한 가벼운 긁기보다 고통스러운 피부 자극과 자기 처치를 함께 드러냈습니다.
  alternative_readings:
  - ‘긁기 위해’
  - ‘긁어내려고’
  rationale: 문맥상 욥의 극심한 고난을 나타내는 장면이므로, 도구의 거칠음과 행위의 고통스러움을 약화시키지 않도록 했습니다.
  doctrine_reference: 인간 고난의 বাস্তৃত성(현실성) 강조
