translation:
  language: ko
  text: 그러나 손을 내밀어 보시고, 그의 뼈와 살에 대어 보십시오. 그러면 그가 반드시 주님의 얼굴 앞에서 주님을 저주할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘주님을 축복하다’입니다. 여기서는 완곡한 표현으로 이해되어 ‘저주하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 대조적 반박을 여는 접속사로서, 문맥상 강한 역전보다 논박의 흐름을 살리는 ‘그러나’가 자연합니다.
- source_word: שְׁלַח נָא יָדְךָ
  english_pob_choice: stretch out your hand, please
  chosen_korean: 손을 내밀어 보시고
  alternatives_korean:
  - 손을 뻗어 보시고
  - 손을 내밀어 주십시오
  lexicon: HALOT
  rationale: 직역의 ‘보내다’보다 한국어에서 관용적인 동작 표현인 ‘손을 내밀다’가 원문의 신체 동작 명령을 더 분명히 드러냅니다. נָא는 정중한 요청을 반영해 완곡하게 옮겼습니다.
- source_word: וְגַע אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  english_pob_choice: and touch his bone and his flesh
  chosen_korean: 그의 뼈와 살에 대어 보십시오
  alternatives_korean:
  - 그의 뼈와 살을 건드려 보십시오
  - 그의 몸에 손을 대어 보십시오
  lexicon: HALOT
  rationale: ‘뼈와 살’의 구체적 신체 표현을 유지하되, 해를 끼치는 접촉의 뉘앙스를 살리기 위해 ‘대다’를 선택했습니다.
- source_word: יְבָרֲכֶךָּ
  english_pob_choice: curse you
  chosen_korean: 주님을 저주할 것입니다
  alternatives_korean:
  - 주님을 욕할 것입니다
  - 주님을 배반할 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로는 ‘축복하다’이지만, 욥기 1:11; 2:5의 완곡법상 의미는 저주이므로 본문에는 의미를 드러내고, footnote로 문자형을 보존합니다.
theological_decisions:
- issue: ברך의 완곡어법 처리
  chosen_reading: 본문에는 ‘저주하다’로 번역하고 각주로 ‘축복하다’의 문자형을 밝힙니다.
  alternative_readings:
  - 본문에 ‘축복하다’로 직역하고 문맥으로 보충 설명
  - ‘하나님을 저주하다’로 신학적 목적어를 직접 드러내기
  rationale: 사탄의 도발은 욥이 고통 속에서 하나님을 공개적으로 저주할 것이라는 예측이므로, 현대 독자가 즉시 이해할 수 있도록 의미를 본문에 반영하는 것이 적절합니다. 다만 히브리어 표면형의 투명성을 위해 각주를 둡니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
