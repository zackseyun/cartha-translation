revisions:
- from: 그러나 손을 내밀어 보시고, 그의 뼈와 살에 대어 보십시오. 그러면 그가 반드시 주님의 얼굴 앞에서 주님을 저주할 것입니다.[a]
  to: 그러나 손을 내밀어 그의 뼈와 살에 대십시오. 그러면 그가 반드시 주님의 면전에서 주님을 저주할 것입니다.[a]
  rationale: 원문의 신체 표현(‘손’, ‘뼈’, ‘살’)과 해로운 접촉을 암시하는 ‘대다’를 유지했습니다. 불필요한 시도·시험의 뉘앙스를 제거하고, ‘당신의 얼굴 앞에서’라는 관용구의 직접성을 ‘주님의 면전에서’로 반영했습니다. ברך의 논쟁적 표면형은 각주에 보존하면서 문맥상 의미인 ‘저주하다’를 본문에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:18Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문 의미를 잘 반영합니다. 다만 נָא는 청유·간청의 뉘앙스이지 ‘시험 삼아 해 보다’라는 뜻이 아니므로 ‘내밀어 보시고/대어 보십시오’의 ‘보다’는 피하는 편이 안전합니다. 또한 אֶל־פָּנֶיךָ의 직접성을 ‘면전에서’로 더 분명히 반영할 수 있습니다.
  naturalness: ‘손을 내밀어 그의 뼈와 살에 대십시오’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 연속 명령도 간결하게 유지합니다. ‘주님의 면전에서’는 이 문맥에서 자연스럽고 공개적·대면적 성격을 드러냅니다.
  terminology: ‘주님’은 본문에서 하나님께 직접 말하는 문맥을 적절히 나타내며, ‘저주하다’는 ברך의 완곡어법상 의미를 정확히 전달합니다. 각주는 히브리어의 문자적 목적어가 ‘당신’임을 반영하도록 조정합니다.
  issues:
  - severity: medium
    issue: ‘내밀어 보시고’와 ‘대어 보십시오’의 ‘보다’
    rationale: 원문의 נָא는 공손한 간청의 표지이며, 한국어의 ‘-어 보다’가 흔히 수반하는 시험적·시도적 의미는 원문에 없습니다. 두 동작을 직접적인 명령으로 옮기는 것이 더 충실합니다.
  - severity: low
    issue: ‘주님의 얼굴 앞에서’
    rationale: 뜻은 전달되지만, אֶל־פָּנֶיךָ는 ‘당신의 면전에서/대놓고’라는 직접적 대면의 관용 표현입니다. ‘주님의 면전에서’가 더 자연스럽고 정확합니다.
  - severity: low
    issue: 각주의 문자적 표현
    rationale: 히브리어 동사는 문법적으로 ‘당신을 축복할 것입니다’입니다. 본문 지시 대상이 주님이므로 의미상 혼동은 없으나, 문자형을 밝히는 각주에서는 ‘당신’을 보존하는 편이 더 투명합니다.
