translation:
  language: ko
  text: 그러나 손을 내밀어 그의 뼈와 살에 대십시오. 그러면 그가 반드시 주님의 면전에서 주님을 저주할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘당신을 축복할 것입니다’입니다. 여기서는 완곡한 표현으로 이해되어 ‘저주할 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
