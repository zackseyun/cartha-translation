  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: ko
  text: 야훼께서 고발자에게 말씀하셨습니다. 「보아라, 그가 네 손 안에 있다. 다만 그의 생명은 지키라.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문 신명칭을 음역해 본문에서 야훼를 유지하며, 영어 POB의 LORD는 관례적 대체 표기이므로 원어 기준 번역을 따랐습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 사탄
  - 대적자
  lexicon: śāṭān
  rationale: 문맥상 고유명사보다 기능적 호칭인 ‘고발자’가 원문의 법정적·역할적 뉘앙스를 더 직접적으로 드러냅니다.
- source_word: הִנּוֹ
  english_pob_choice: Look
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 여기 보라
  lexicon: hinnēh
  rationale: 감탄적 주의를 환기하는 말로서, 합쇼체 본문에서 자연스럽고 직접적인 명령형을 택했습니다.
- source_word: שְׁמֹר
  english_pob_choice: spare
  chosen_korean: 지키라
  alternatives_korean:
  - 보존하라
  - 살려 두라
  lexicon: šāmar
  rationale: 원문 동사는 ‘보호하여 건드리지 않다’는 의미를 담아 ‘지키라’로 옮겼고, 영어 POB의 spare는 그 결과적 의미를 반영한 것입니다.
theological_decisions:
- issue: 사탄 호칭의 번역
  chosen_reading: 본문의 הַשָּׂטָן은 인물 고유명사화보다 ‘고발자’라는 직무적 호칭으로 옮겼습니다.
  alternative_readings:
  - 사탄으로 음역
  - 대적자
  rationale: 이 장면은 하늘 법정의 고소자 역할을 강조하므로, 한국 독자가 기능을 즉시 이해하도록 호칭적 번역을 선택했습니다.
  doctrine_reference: 욥기 1–2장의 하늘 회의 장면과 계시 문맥
- issue: 생명 보존 명령의 뉘앙스
  chosen_reading: ‘그의 생명은 지키라’로 옮겨, 절대적 해치지 말라는 제한을 강조했습니다.
  alternative_readings:
  - 그의 생명을 살려 두라
  - 그의 목숨은 보존하라
  rationale: 원문은 ‘손 안에 있다’는 허용과 함께 생명에 대한 명확한 금지선을 세우므로, 제한 명령으로서의 힘을 살렸습니다.
  doctrine_reference: 하나님의 주권 아래 시험의 경계 설정
