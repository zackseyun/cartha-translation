  - 주님
  rationale: 본문에 나타난 언약 სახელ명을 음역하여 원문 가시성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님이 직접 치시는 서술의 주체성
  chosen_reading: ‘치셨습니다’
  alternative_readings:
