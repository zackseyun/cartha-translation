base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Satan''; traditionally rendered ''Satan.'' The term here includes the article and may function as a title, ''the Adversary.'''
    reason: alternative_reading
  - marker: b
    text: Or 'with painful boils' or 'with grievous boils.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 대적은 야훼의 면전에서 떠나, 욥을 발바닥에서부터 정수리까지 심한 종기로 쳤습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 정관사가 붙은 ‘그 사탄’입니다. 여기서는 고유명사 ‘사탄’보다 칭호 또는 역할을 가리키는 ‘대적’으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘고통스러운 종기’, ‘심한 종기’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 대적
  alternatives_korean:
  - 사탄
  - 그 사탄
  lexicon: HALOT
  rationale: 원문은 정관사와 함께 나와 이 문맥에서 고유명사보다 역할/칭호의 뉘앙스가 강하므로, 한국어도 기능을 살린 ‘대적’으로 옮겼습니다.
- source_word: מֵאֵת פְּנֵי יְהוָה
  english_pob_choice: from the presence of Yahweh
  chosen_korean: 야훼의 면전에서
  alternatives_korean:
