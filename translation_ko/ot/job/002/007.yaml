  - 야훼의 임재에서
  lexicon: HALOT
  rationale: פָּנִים의 관용적 의미를 살려 ‘면전’으로 옮기고, 신명은 본문 지침에 따라 ‘야훼’로 보존했습니다.
- source_word: בִּשְׁחִין רָע
  english_pob_choice: with painful sores
  chosen_korean: 악한 종기
  alternatives_korean:
  - 아픈 종기
  - 심한 종기
  - 고통스러운 종기
  lexicon: HALOT
  rationale: שְׁחִין은 피부 질환/종기를 가리키므로 ‘종기’로 옮기되, רָע의 강도를 ‘악한’으로 받아 원문의 중한 재앙성을 드러냈습니다.
- source_word: מִכַּף רַגְלוֹ עַד קָדְקֳדוֹ
  english_pob_choice: from the sole of his foot to the crown of his head
  chosen_korean: 발바닥에서부터 정수리까지
  alternatives_korean:
  - 발바닥에서 머리끝까지
  - 발바닥에서부터 머리의 꼭대기까지
  lexicon: HALOT
  rationale: כַּף רֶגֶל은 ‘발바닥’, קָדְקֹד은 머리의 꼭대기/정수리를 뜻하므로, 온몸 전체를 포괄하는 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
