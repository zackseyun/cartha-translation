base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Satan''; traditionally rendered ''Satan.'' The term here includes the article and may function as a title, ''the Adversary.'''
    reason: alternative_reading
  - marker: b
    text: Or 'with painful boils' or 'with grievous boils.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 대적이 야훼의 면전에서 나가서, 욥을 발바닥에서부터 정수리까지 악한 종기로 치셨습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정관사가 붙은 ‘the Satan’으로, 여기서는 고유명사 ‘사탄’보다 칭호/역할인 ‘대적’으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘고통스러운 종기’, ‘심한 종기’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 대적
  alternatives_korean:
  - 사탄
  - 그 사탄
  lexicon: HALOT
  rationale: 원문은 정관사와 함께 나와 이 문맥에서 고유명사보다 역할/칭호의 뉘앙스가 강하므로, 한국어도 기능을 살린 ‘대적’으로 옮겼습니다.
- source_word: מֵאֵת פְּנֵי יְהוָה
  english_pob_choice: from the presence of Yahweh
  chosen_korean: 야훼의 면전에서
  alternatives_korean:
  - 야훼 앞에서
  - 야훼의 임재에서
  lexicon: HALOT
  rationale: פָּנִים의 관용적 의미를 살려 ‘면전’으로 옮기고, 신명은 본문 지침에 따라 ‘야훼’로 보존했습니다.
- source_word: בִּשְׁחִין רָע
  english_pob_choice: with painful sores
  chosen_korean: 악한 종기
  alternatives_korean:
  - 아픈 종기
  - 심한 종기
  - 고통스러운 종기
  lexicon: HALOT
  rationale: שְׁחִין은 피부 질환/종기를 가리키므로 ‘종기’로 옮기되, רָע의 강도를 ‘악한’으로 받아 원문의 중한 재앙성을 드러냈습니다.
- source_word: מִכַּף רַגְלוֹ עַד קָדְקֳדוֹ
  english_pob_choice: from the sole of his foot to the crown of his head
  chosen_korean: 발바닥에서부터 정수리까지
  alternatives_korean:
  - 발바닥에서 머리끝까지
  - 발바닥에서부터 머리의 꼭대기까지
  lexicon: HALOT
  rationale: כַּף רֶגֶל은 ‘발바닥’, קָדְקֹד은 머리의 꼭대기/정수리를 뜻하므로, 온몸 전체를 포괄하는 표현으로 자연스럽게 옮겼습니다.
