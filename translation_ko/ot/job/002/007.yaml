  rationale: 원문 וַיַּךְ의 직접적이고 강한 행위를 살리되, 한국어에서 폭력적 구어체보다 성경적 서술체에 맞게 정제했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and directness'
