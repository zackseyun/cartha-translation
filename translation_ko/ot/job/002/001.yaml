source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָֽ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֤וֹא גַֽם הַ/שָּׂטָן֙ בְּ/תֹכָ֔/ם לְ/הִתְיַצֵּ֖ב עַל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of God.'' This may refer to heavenly beings or members of the divine council.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''Satan''; Hebrew has the article: ''the satan,'' likely functioning here as a title meaning ''the adversary'' or ''the accuser.'''
    reason: alternative_reading
translation:
  language: ko
  text: 다시 하루가 되어, 하나님의 아들들이[a] 야훼 앞에 서기 위해 왔고, 사탄도[b] 그들 가운데 와서 야훼 앞에 서기 위해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘하나님의 아들들’은 하늘의 존재들이나 신적 회의의 구성원들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 정관사가 붙어 있습니다. 따라서 ‘사탄’은 고유명사라기보다 ‘대적’ 또는 ‘고발자’라는 역할명일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: Again there was a day
  chosen_korean: 또다시 하루가 있었습니다
  alternatives_korean:
  - 다시 그런 날이 있었습니다
  - 또 하루가 있었습니다
  - 어느 날 다시
  lexicon: HALOT
  rationale: 1:6의 장면 반복을 드러내는 영어 POB의 ‘Again’을 살려 서술적 반복을 자연스럽게 표현했습니다. ‘하루가 있었습니다’는 히브리어 관용을 너무 풀지 않으면서 한국어로 읽히게 합니다.
- source_word: בְּנֵי הָאֱלֹהִים
  english_pob_choice: the sons of God
  chosen_korean: 하나님의 아들들
  alternatives_korean:
  - 하늘 존재들
  - 신적 존재들
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성과 해석의 긴장을 보존하기 위해, 영어 POB처럼 해석어로 대체하지 않고 기본 표현을 유지했습니다.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  english_pob_choice: to present themselves before Yahweh
  chosen_korean: 야훼 앞에 나아와 자신들을 나타내었습니다
  alternatives_korean:
  - 야훼 앞에 서려고 왔습니다
  - 야훼 앞에 자신을 드러내었습니다
  lexicon: HALOT
  rationale: 히트파엘의 ‘출석하다/나아가 서다’ 의미를 한국어에서 궁정적·공적 뉘앙스를 살려 옮겼습니다. ‘자신들을 나타내다’는 단순 위치 이동보다 공식적 출현을 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명사 표기는 ‘야훼’를 사용했습니다. 본문 반복에서 주(主)로 대체하면 고유명사성이 약해집니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 사탄
  alternatives_korean:
  - 그 대적
  - 그 고발자
  - 사탄(대적)
  lexicon: HALOT
  rationale: 히브리어의 정관사와 역할성을 반영하려면 제목형 표현이 적합하지만, 한국어에서는 ‘사탄’이 이미 정관적 호칭으로 널리 쓰여 본문의 인물/역할을 가장 간결하게 전달합니다.
theological_decisions:
- issue: הַשָּׂטָן의 제목성(정관사 포함)을 한국어에서 어떻게 처리할지
  chosen_reading: ‘사탄’으로 옮기되, 본문의 대결 구도와 역할성을 유지했습니다.
  alternative_readings:
  - 그 대적
  - 그 고발자
  - 사탄
  rationale: 히브리어는 정관사를 가진 הַשָּׂטָן으로, 고유명사보다 직책/역할의 뉘앙스가 있습니다. 한국어에서는 관사 구별이 어려워 본문 흐름을 해치지 않는 범위에서 통용되는 호칭을 택했습니다.
  doctrine_reference: 원문 문법 신호를 존중하되 한국어 관용을 과도하게 늘리지 않음
