id: JOB.2.10
reference: Job 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ כְּ/דַבֵּ֞ר אַחַ֤ת הַ/נְּבָלוֹת֙ תְּדַבֵּ֔רִי גַּ֣ם אֶת הַ/טּ֗וֹב נְקַבֵּל֙ מֵ/אֵ֣ת הָ/אֱלֹהִ֔ים וְ/אֶת הָ/רָ֖ע לֹ֣א נְקַבֵּ֑ל בְּ/כָל זֹ֛את לֹא חָטָ֥א אִיּ֖וֹב בִּ/שְׂפָתָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
  footnotes:
  - marker: a
    text: Or “adversity”; traditionally, “evil.” The Hebrew רָע here refers to harmful or unfavorable circumstances in contrast to “the good.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 욥이 아내에게 말했습니다. “당신은 어리석은 여자들 가운데 하나가 말하듯 말하는군요. 우리가 하나님께 좋은 것은 받고, 나쁜 것은[a] 받지 않겠습니까?” 이 모든 일에도 욥은 자기 입술로 죄를 짓지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불리한 일’, ‘재앙’. 히브리어 רָע는 여기서 ‘좋은 것’과 대조되어, 도덕적 악이라기보다 해롭거나 불리한 상황을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  english_pob_choice: You speak as one of the foolish women speaks
  chosen_korean: 당신은 어리석은 여자들 중 하나가 말하듯 말하는군요
  alternatives_korean:
  - 당신은 어리석은 여자들 가운데 하나처럼 말하는군요
  - 당신은 어리석은 여자 하나가 말하듯 말하는군요
  lexicon: HALOT
  rationale: נְבָלוֹת는 단순한 지능 부족보다 도덕적·신앙적 어리석음을 가리키므로, ‘어리석은’이 그 힘을 가장 자연스럽게 살립니다. 여성형 복수를 한국어에서는 ‘여자들 중 하나’로 풀어 주어 원문의 대비를 드러냈습니다.
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  english_pob_choice: Shall we receive the good from God
  chosen_korean: 우리가 하나님에게서 좋은 것을 받았는데
  alternatives_korean:
  - 우리가 하나님에게서 좋은 것을 받아야 합니까
  - 우리가 하나님에게서 좋은 것을 받겠습니까
  lexicon: HALOT
  rationale: 히브리어의 반문 구조를 한국어에서는 자연스러운 서술형+반문 꼴로 옮겨, “좋은 것”이 하나님의 선하신 베풂 전체를 가리키도록 했습니다. ‘하나님에게서’는 מקור/출처의 의미를 분명히 합니다.
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  english_pob_choice: and shall we not receive the bad
  chosen_korean: 나쁜 것은 받지 않겠습니까
  alternatives_korean:
  - 악한 것은 받지 않겠습니까
  - 재앙은 받지 않겠습니까
  - 환난은 받지 않겠습니까
  lexicon: HALOT
  rationale: 여기서 רָע는 도덕적 악보다 선한 것과 대비되는 불리한 처지·해로운 상황을 뜻하므로, ‘악’보다 덜 오해를 부르는 ‘나쁜 것’을 택했습니다. 이는 영어 POB의 ‘the bad’와 대응하면서도 하나님의 도덕성에 대한 오독을 줄입니다.
- source_word: בִּשְׂפָתָיו
  english_pob_choice: with his lips
  chosen_korean: 자기 입술로
  alternatives_korean:
  - 입술로
  - 말로
  lexicon: HALOT
  rationale: 원문이 ‘입술’이라는 신체 표현을 분명히 하므로, 이를 유지해 욥의 죄가 말의 영역에서 없었다는 서술을 살렸습니다. ‘자기’는 소유격을 자연스럽게 풀어 준 것입니다.
theological_decisions:
- issue: רָע의 신학적 무게
  chosen_reading: ‘나쁜 것’으로 옮겨, 하나님이 도덕적 악의 저자가 아니라 선한 것과 불리한 처지를 함께 주권 아래 두신다는 대비를 살렸습니다.
  alternative_readings:
  - 악
  - 재앙
  - 환난
  rationale: 이 절은 선과 불리함의 대비를 말하므로, ‘악’은 과도한 신학적 함의를 불러일으킬 수 있습니다. 본문이 요구하는 긴장을 유지하는 쪽이 원문 충실도에 더 가깝습니다.
  doctrine_reference: 하나님의 주권과 하나님의 도덕적 선하심을 함께 보존
- issue: 히브리어 반문을 한국어 문장으로 구현하는 방식
  chosen_reading: 직역형 의문문 대신 ‘받았는데… 받지 않겠습니까?’로 옮겨, 수사적 반문과 대조를 살렸습니다.
  alternative_readings:
  - 우리가 좋은 것을 받았으니 나쁜 것도 받아야 합니까
  - 좋은 것을 받았는데 나쁜 것은 받지 않겠습니까
  rationale: 한국어에서는 히브리어의 연속 반문을 그대로 재현하면 어색해질 수 있어, 의미는 보존하되 읽기 자연성을 확보했습니다.
  doctrine_reference: 수사학적 질문의 기능 보존
