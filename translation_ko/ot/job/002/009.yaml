  lexicon: HALOT
  rationale: ‘계속 붙들다/굳게 붙잡다’의 의미를 살리되, 한국어에서 부자연스러운 직역을 피하고 책망하는 어조를 유지했습니다.
- source_word: בְּתֻמָּתֶךָ
  english_pob_choice: to your integrity
  chosen_korean: 자신의 온전함
  alternatives_korean:
  - 당신의 성실함
  - 당신의 무죄함
  lexicon: HALOT
  rationale: תֻמָּה는 ‘온전함, 흠없음, 성실함’의 범위를 가지며, 여기서는 욥의 도덕적/신앙적 온전함을 가리키므로 ‘온전함’이 가장 균형 잡힌 표현입니다.
- source_word: בָּרֵךְ אֱלֹהִים
  english_pob_choice: Bless God
  chosen_korean: 하나님을 찬양하고
  alternatives_korean:
  - 하나님을 축복하고
  - 하나님을 저주하고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘축복하다’이지만, 욥기에서는 하나님을 향한 반어적·완곡 표현으로 ‘저주하다’로 이해되는 긴장이 있습니다. 본문에는 어휘 형태를 최대한 보존하고, 역의 의미는 각주로 처리했습니다.
- source_word: וָמֻת
  english_pob_choice: and die
  chosen_korean: 죽으십시오
  alternatives_korean:
  - 그리고 죽으십시오
  - 그리하여 죽으십시오
  lexicon: HALOT
  rationale: 두 번째 명령형의 급박하고 단호한 어조를 한국어 명령형으로 옮겼습니다.
theological_decisions:
- issue: ‘Bless God’의 반어적 완곡법 처리
  chosen_reading: 본문에는 ‘하나님을 찬양하고 죽으십시오’처럼 히브리어 표면 형식을 유지하고, 각주로 ‘저주하다’로 이해하는 전통적 독해를 밝혔습니다.
  alternative_readings:
  - ‘하나님을 저주하고 죽으십시오’
  rationale: 원문 어휘를 지우지 않으면서도, 욥기에서 널리 인정되는 반어적 완곡법이라는 해석 긴장을 보존하기 위해서입니다.
  doctrine_reference: Translation philosophy §§1, 3
