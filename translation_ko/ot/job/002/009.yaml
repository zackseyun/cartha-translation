  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
  footnotes:
  - marker: a
    text: Hebrew 'Bless God and die'; many understand 'bless' here as a reverential euphemism meaning 'curse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 아내가 그에게 말했습니다. “당신이 아직도 당신의 온전함을 굳게 지키고 있습니까? 하나님을 축복하고[a] 죽으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘축복하고’입니다. 여기서는 하나님을 향한 완곡한 표현으로 ‘저주하고’라는 뜻으로 이해하는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
