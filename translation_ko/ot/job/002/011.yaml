  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'Now when Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
  footnotes:
  - marker: a
    text: Or 'all this calamity' or 'all this adversity.' The Hebrew רָעָה here refers to disaster or misfortune that came upon Job, not moral evil committed by him.
    reason: lexical_alternative
  - marker: b
    text: Or 'they met together' or 'they made an appointment together.' The Hebrew verb suggests deliberate coordination.
    reason: lexical_alternative
  - marker: c
    text: Or 'to mourn with him.' The Hebrew verb לָנוּד can denote showing sympathy or condolence, often with mourning over suffering or death.
    reason: lexical_alternative
  - marker: d
    text: Or 'to come'.
    reason: previous_rendering
translation:
  language: ko
  text: 욥의 세 친구, 곧 데만 사람 엘리바스와 수아 사람 빌닷과 나아마 사람 소발은 그에게 닥친 이 모든 재난[a]을 듣고, 각자 자기 있던 곳에서 왔습니다. 그들은 그에게 와서[d] 그와 함께 슬퍼하고[c] 그를 위로하기로 서로 약속했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재난’은 여기서 히브리어 רָעָה의 문맥적 의미를 반영한 것으로, 욥이 행한 도덕적 악을 뜻하지 않습니다. ‘불행’ 또는 ‘재앙’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יעד의 니팔형은 단순히 ‘만나다’보다 함께 약속하거나 의도적으로 합의하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נוּד는 이 문맥에서 고난받는 이에게 동정을 나타내거나 그와 함께 슬퍼하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 직역하면 ‘오다’입니다. 여기서는 그들이 욥에게 와서 동정하고 위로하려 했다는 목적을 나타냅니다.
    reason: previous_rendering
lexical_decisions:
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  english_pob_choice: Job’s three friends
  chosen_korean: 욥의 세 친구
  alternatives_korean:
  - 욥의 세 친구들
  - 욥에게 속한 세 친구
  lexicon: WLC/HALOT
  rationale: 구문상 소유격 관계를 자연스럽게 살리면서, רֵעַ의 기본 의미를 ‘친구’로 옮겼습니다.
- source_word: כָּל הָרָעָה הַזֹּאת
  english_pob_choice: all this trouble
  chosen_korean: 이 모든 재난
  alternatives_korean:
  - 이 모든 고난
  - 이 모든 불행
  - 이 모든 재앙
  lexicon: HALOT
  rationale: 여기서 רָעָה는 욥에게 닥친 불운/재난을 가리키므로, 도덕적 ‘악’보다 사건의 재난성을 드러내는 표현을 택했습니다.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  english_pob_choice: They agreed together
  chosen_korean: 함께 모여
  alternatives_korean:
  - 서로 약속하고
  - 함께 의논하고
  - 한자리에 모여
  lexicon: HALOT
  rationale: יעד의 ‘약정하다/합의하다’ 뉘앙스를 살리되, 이어지는 목적절과 함께 한국어로는 ‘함께 모여’가 가장 자연스럽습니다.
- source_word: לָנוּד לוֹ וּלְנַחֲמוֹ
  english_pob_choice: to sympathize with him and to comfort him
  chosen_korean: 그에게 동정하러 오고 그를 위로하려고
  alternatives_korean:
  - 그와 함께 슬퍼하러 오고 그를 위로하려고
  - 그에게 연민을 보이러 오고 그를 위로하려고
  - 그와 함께 애도하러 오고 그를 위로하려고
  lexicon: HALOT
  rationale: נוּד와 נחם을 구분해, 첫 동사는 ‘동정/애도’의 반응, 둘째는 ‘위로’라는 목적을 드러냈습니다. 영어 POB의 구별을 한국어에서도 유지했습니다.
