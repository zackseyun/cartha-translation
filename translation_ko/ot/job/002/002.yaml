revisions:
- from: 야훼께서 그 대적에게 말씀하셨습니다. 「네가 어디에서 왔느냐?」 그러자 그 대적이 야훼께 대답하여 말했습니다. 「땅을 두루 돌아다니며 그 위를 이리저리 거닐고 있었습니다.」[a]
  to: 야훼께서 그 고발자[a]에게 말씀하셨습니다. “네가 어디에서 왔습니까?” 그러자 그 고발자가 야훼께 대답하여 말했습니다. “땅을 두루 돌아다니고 그 위를 이리저리 거닐다가 왔습니다.”
  rationale: 합쇼체를 일관되게 적용하고, הַשָּׂטָן의 직능적·비고유명사적 성격을 ‘그 고발자’와 각주로 보존했습니다. 마지막 답변은 원문의 ‘~을 돌아다니고 ~을 거닐다’라는 이동 경위와 그로부터 온 응답의 관계를 살리도록 고쳤습니다.
