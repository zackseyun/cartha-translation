language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the satan''; here likely a title meaning ''the accuser'' or ''the adversary,'' not necessarily a proper name.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그 대적에게 말씀하셨습니다. 「네가 어디에서 왔느냐?」 그러자 그 대적이 야훼께 대답하여 말했습니다. 「땅을 두루 돌아다니며 그 위를 이리저리 거닐고 있었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정관사가 붙은 ‘the satan’입니다. 여기서는 고유명사라기보다 ‘고발자/대적자’라는 직능 명칭으로 읽을 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명인 여호와의 이름을 제목으로 바꾸지 않고 학술적 음역인 ‘야훼’로 옮겨, 하나님의 개인적 이름이라는 점을 드러냈습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 그 대적
  alternatives_korean:
  - 그 사탄
  - 사탄
  - 대적
  lexicon: HALOT
  rationale: 정관사 있는 역할 명칭이라는 점을 살려 이름화하지 않고, 법정적·대립적 뉘앙스를 담는 ‘대적’을 택했습니다. 문맥상 반복 지시를 위해 관형사 ‘그’를 붙였습니다.
- source_word: אֵי מִזֶּה תָּבֹא
  english_pob_choice: From where have you come?
  chosen_korean: 네가 어디에서 왔느냐?
  alternatives_korean:
  - 어디서 왔느냐?
  - 어디에서 왔습니까?
  lexicon: HALOT
  rationale: 출발 지점을 묻는 관용적 표현이므로 한국어로 자연스럽게, 그러나 원문의 추궁하는 질문감을 유지하도록 옮겼습니다.
- source_word: מִשֻּׁט ... וּמֵהִתְהַלֵּךְ
  english_pob_choice: from roaming about ... and from walking around on it
  chosen_korean: 땅을 두루 돌아다니며 그 위를 이리저리 거닐고 있었습니다
  alternatives_korean:
  - 땅을 이리저리 돌아다니며 그 위를 거닐고 있었습니다
  - 땅을 두루 돌아다니고 그 위를 거니는 중이었습니다
  lexicon: HALOT
  rationale: שׁוּט와 הִתְהַלֵּךְ의 반복적 이동을 각각 살려, 단순한 ‘왔다갔다’보다 넓게 돌아다니는 모습을 드러냈습니다. ‘~고 있었습니다’는 과거 진행의 상황감을 보완합니다.
theological_decisions:
- issue: הַשָּׂטָן의 정체를 고유명사로 고정할지, 직능명으로 둘지
  chosen_reading: 직능명 ‘그 대적’으로 처리했습니다.
  alternative_readings:
  - 사탄
  - 그 사탄
  rationale: 이 장면은 하늘 회의의 법정적 대화이며 히브리어는 관사를 포함합니다. 따라서 후기 전승의 고유명사화보다 원문의 기능적 호칭을 우선해, 해석을 미리 닫지 않도록 했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 본문이 허용하는 신학적 긴장 유지
