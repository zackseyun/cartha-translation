source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
  footnotes:
  - marker: a
    text: Or “Have you considered my servant Job?” Literally, “Have you set your heart on my servant Job?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew הַשָּׂטָן, “the Accuser”; traditionally “Satan.”
    reason: alternative_reading
  - marker: c
    text: Or “to destroy him” or “to ruin him”; Hebrew literally “to swallow him up.”
    reason: lexical_alternative
  - marker: d
    text: “For nothing” may also mean “without cause,” and likely echoes Job 1:9, where the Accuser asks whether Job fears God “for nothing.”
    reason: cross_reference
translation:
  language: ko
  text: 그때 야훼께서 고발자에게 말씀하셨습니다. 「내 종 욥에게 네 마음을 두었느냐? 그와 같은 사람은 땅에 없느니라. 그는 온전하고 정직한 사람으로서 하나님을 경외하며 악에서 떠나고, 지금도 자기 온전함을 굳게 지키고 있다. 그런데도 네가 그를 이유 없이 삼키도록 나를 부추겼다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "내 종 욥을 네가 살펴보았느냐?" 히브리어는 문자적으로 "네 마음을 내 종 욥에게 두었느냐?"입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אִישׁ תָּם וְיָשָׁר는 직역하면 "온전하고 정직한 사람"입니다.
    reason: source_note
  - marker: c
    text: לְבַלְּעוֹ는 문자적으로 "그를 삼키다"이며, 여기서는 멸망시키는 비유적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: חִנָּם은 "이유 없이" 또는 "까닭 없이"의 뜻일 수 있으며, 1:9의 표현을 되울립니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 신명사 טetragrammaton을 POB 방침에 따라 고유명사로 옮겨, 호칭으로 대체하지 않고 하나님의 이름을 드러냈습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 사탄
  - 대적자
  lexicon: HALOT
  rationale: 정관사가 붙은 용례이므로 고유명사보다 역할 명칭이 적절합니다. 법정적·대립적 기능을 현대 한국어에서 가장 분명하게 드러내는 말로 옮겼습니다.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  english_pob_choice: have you set your heart on
  chosen_korean: 네 마음을 두었느냐
  alternatives_korean:
  - 네가 주목했느냐
  - 네가 생각해 보았느냐
  lexicon: HALOT
  rationale: 히브리어의 직역성 있는 심장/마음 관용구를 살리면서도 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: וַתְּסִיתֵנִי בוֹ
  english_pob_choice: you incited me against him
  chosen_korean: 나를 부추겼다
  alternatives_korean:
  - 나를 선동했다
  - 나를 충동질했다
  lexicon: HALOT
  rationale: לסות의 사동적 뉘앙스를 살리되, 하나님과 관련된 문맥에서 과도하게 거친 표현을 피하면서도 원문의 긴장을 유지했습니다.
theological_decisions:
- issue: וַתְּסִיתֵנִי בוֹ의 신학적 긴장
  chosen_reading: 본문의 직접 표현을 따라 "나를 부추겼다"로 옮겨, 하나님의 직접적 발화와 그에 따른 책임의 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - 그를 해치도록 허락하셨다
  - 그에 관해 나를 움직이셨다
  rationale: 히브리어는 해석적 완화를 요구하지 않으며, 서술이 드러내는 신적 주권과 도덕적 긴장을 그대로 보존하는 것이 본문의 의미를 더 충실히 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: הַשָּׂטָן의 정체성
  chosen_reading: 인명화하지 않고 역할 명칭인 "고발자"로 유지했습니다.
  alternative_readings:
  - 사탄
  - 대적
  rationale: 본문의 정관사는 이 인물을 기능적으로 지칭합니다. 후대 신학적 동일시를 성급하게 고정하지 않으면서도 장면의 법정적 성격을 살립니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
