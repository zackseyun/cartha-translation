  to: 그때 야훼께서 고발자[a]에게 말씀하셨습니다. 「내 종 욥을 마음에 두었느냐[b]? 땅에는 그와 같은 이가 없다. 그는 온전하고 정직한 사람으로서 하나님을 경외하며 악에서 떠나고, 지금도 자기 온전함을 굳게 지키고 있다. 그런데도 네가 그를 삼키려고[c] 나를 부추겼다. 이유 없이[d].」
  rationale: 원문의 통사 관계를 따라 ‘삼키다’의 행위 주체가 야훼임을 분명히 했습니다. 신적 행위를 완화하지 않았으며, הַשָּׂטָן을 역할 명칭으로 유지했습니다. 한국어 어순과 각주 표지 위치도 현대 표준어 독해에 맞게 정리했습니다.
