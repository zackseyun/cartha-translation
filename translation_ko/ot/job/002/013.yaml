id: JOB.2.13
reference: Job 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּשְׁב֤וּ אִתּ/וֹ֙ לָ/אָ֔רֶץ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת לֵיל֑וֹת וְ/אֵין דֹּבֵ֤ר אֵלָי/ו֙ דָּבָ֔ר כִּ֣י רָא֔וּ כִּֽי גָדַ֥ל הַ/כְּאֵ֖ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
  footnotes:
  - marker: a
    text: Or, 'that his suffering was very great' or 'that his grief was very great.' The Hebrew term can cover pain broadly, including physical suffering and emotional anguish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그와 함께 땅에 앉아 일곱 날과 일곱 밤을 지냈습니다[a]. 아무도 그에게 한마디도 하지 않았습니다. 그들이 그의 고통이 매우 크다는 것을 보았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 고난이 매우 컸다’, 혹은 ‘그의 슬픔이 매우 컸다’. 히브리어 용어는 신체적 고통과 정서적 괴로움을 포함한 넓은 의미의 고통을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  english_pob_choice: they sat
  chosen_korean: 앉아 지냈습니다
  alternatives_korean:
  - 앉았습니다
  - 머물렀습니다
  - 그대로 앉아 있었습니다
  lexicon: HALOT
  rationale: 히브리어 יָשַׁב의 기본 의미를 살리면서, 장례적 맥락에서 단순한 동작보다 지속된 태도를 함께 드러내기 위해 ‘앉아 지냈습니다’로 옮겼습니다.
- source_word: לָאָרֶץ
  english_pob_choice: on the ground
  chosen_korean: 땅에
  alternatives_korean:
  - 땅 위에
  - 땅바닥에
  - 땅에 내려
  lexicon: HALOT
  rationale: 문맥상 애도하는 자세를 가리키므로 ‘땅’으로 직역하되, 한국어에서는 자연스럽게 ‘땅에 앉다’가 됩니다.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  english_pob_choice: and no one spoke a word to him
  chosen_korean: 아무도 그에게 한마디도 하지 않았습니다
  alternatives_korean:
  - 아무도 그에게 아무 말도 하지 않았습니다
  - 그에게 한마디도 하는 사람이 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 완전한 침묵을 살리기 위해 ‘한마디도’로 옮겼고, ‘말하다’보다 직접적인 ‘하지 않았습니다’를 사용했습니다.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  english_pob_choice: that his pain was very great
  chosen_korean: 그의 고통이 매우 크다는 것을
  alternatives_korean:
  - 그의 아픔이 매우 크다는 것을
  - 그의 고통이 심히 크다는 것을
  - 그의 고통이 매우 심하다는 것을
  lexicon: HALOT
  rationale: כאב은 신체적 고통과 넓은 의미의 아픔을 포괄하므로, POB의 문맥 판단을 따라 ‘고통’으로 번역했습니다. ‘매우 크다’는 히브리어의 강한 강조를 자연스럽게 반영합니다.
theological_decisions:
- issue: 애도 장면의 침묵과 공감의 표현
  chosen_reading: 말을 아끼는 침묵 자체를 본문 의미로 유지했습니다.
  alternative_readings:
  - ‘위로하지 않았다’처럼 해석을 덧붙이는 읽기
  - ‘아무 말도 할 수 없었다’로 심리 상태를 추론하는 읽기
  rationale: 본문은 원인 설명 없이 ‘아무도 말하지 않았다’고만 말하므로, 친구들의 침묵을 과도하게 심리화하거나 위로의 부재로 설명하지 않고 그대로 보존했습니다.
  doctrine_reference: 본문 서술의 절제와 문맥적 애도 장면의 묘사
- issue: כאב의 의미 범위
  chosen_reading: ‘고통’으로 두되, 신체적 아픔과 넓은 고난의 뉘앙스를 함께 열어 두었습니다.
  alternative_readings:
  - ‘아픔’만으로 좁히는 읽기
  - ‘슬픔’으로 정서적 의미만 강조하는 읽기
  rationale: 히브리어 כאב은 신체적 통증과 정서적 고통을 함께 포괄할 수 있어, 본문의 의도와 POB 주석의 범위를 보존하는 쪽이 적절합니다.
  doctrine_reference: 어휘 의미 범위 보존
