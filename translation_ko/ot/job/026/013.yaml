reference: Job 26:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
  footnotes:
  - marker: a
    text: Or 'By his Spirit' or 'By his wind.' The Hebrew word can mean breath, wind, or spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'his hand formed the fleeing serpent.' The verb may be understood differently, though 'pierced' best fits the combat imagery of the line.
    reason: alternative_reading
  - marker: c
    text: '''The fleeing serpent'' likely evokes a cosmic chaos-serpent; compare Isaiah 27:1.'
    reason: cross_reference
translation:
  language: ko
  text: 그분께서는 자신의 숨결로 하늘을 아름답게 하셨고, 자신의 손으로 달아나는 뱀을 빚으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨결’에 해당하는 히브리어 רוּחַ는 ‘영’ 또는 ‘바람’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 ‘빚으셨다’ 외에 ‘꿰뚫으셨다’로 이해될 수도 있습니다. 그러나 이 문맥과 동사 형태에서는 ‘빚으셨다’가 더 직접적인 번역입니다.
    reason: alternative_reading
  - marker: c
    text: ‘달아나는 뱀’은 우주적 혼돈의 뱀을 떠올리게 할 수 있습니다. 이사야 27:1을 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  english_pob_choice: By his breath
  chosen_korean: 그의 숨으로
  alternatives_korean:
  - 그의 영으로
  - 그의 바람으로
  lexicon: HALOT
  rationale: רוּחַ는 숨, 바람, 영을 뜻할 수 있으므로, 이 시적 창조 문맥에서는 신체적 이미지가 살아 있는 ‘숨’이 가장 자연스럽고, 영을 단정하지도 바람으로만 좁히지도 않습니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들이
  alternatives_korean:
  - 하늘
  - 하늘은
  lexicon: HALOT
  rationale: 복수형 שָׁמַיִם의 우주적·시적 뉘앙스를 살리기 위해 ‘하늘들’로 옮겼습니다.
- source_word: שִׁפְרָה
  english_pob_choice: are made fair
  chosen_korean: 아름답게 되며
  alternatives_korean:
  - 아름답게 하며
  - 찬란해지며
  - 아름다워지며
  lexicon: HALOT
  rationale: ‘made fair’의 결과 상태를 자연스러운 현대 한국어로 풀어, 하나님의 행위로 하늘이 아름다워지는 뜻을 보존했습니다.
- source_word: חֹלֲלָה יָדוֹ
  english_pob_choice: his hand pierced
  chosen_korean: 그의 손이 찔렀습니다
  alternatives_korean:
  - 그의 손이 형성했습니다
  - 그의 손이 뚫었습니다
  lexicon: HALOT
  rationale: 동사의 가능한 의미들 가운데, 전투적 평행법과 ‘도망하는 뱀’의 이미지에는 ‘찔렀다’가 가장 잘 맞아 원문의 공격적 함의를 살립니다.
- source_word: נָחָשׁ בָּרִיחַ
  english_pob_choice: the fleeing serpent
  chosen_korean: 도망하는 뱀
  alternatives_korean:
  - 도망치는 뱀
  - 질주하는 뱀
  - 꼬불꼬불한 뱀
  lexicon: HALOT
  rationale: בָּרִיחַ의 여러 가능성 중, 본문과 이사야 27:1을 함께 고려하면 ‘도망하는’이 혼돈-뱀의 이미지를 가장 무리 없이 전달합니다.
theological_decisions:
- issue: רוּחַ를 ‘영’으로 명시할지, ‘숨’으로 유지할지
  chosen_reading: 본문에는 ‘숨’으로 두고, 성령을 직접 가리킨다고 단정하지 않았습니다.
  alternative_readings:
  - 영
  - 바람
  - 성령
  rationale: 시편적·창조적 비유 속에서 본문은 하나님의 생명력과 능력을 말하지만, 여기서 곧바로 인격적 성령 언급으로 좁힐 필연은 없습니다. 따라서 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘도망하는 뱀’을 사탄이나 리워야단으로 명시할지
  chosen_reading: 본문 표현을 유지해 상징적 혼돈-뱀의 이미지만 드러냈습니다.
  alternative_readings:
  - 리워야단
  - 사탄
  - 혼돈의 뱀
  rationale: 히브리어 본문 자체는 대상을 명시적으로 규정하지 않으므로, 해석을 본문 밖에서 확정하지 않고 시적 이미지를 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §3
