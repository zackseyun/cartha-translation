  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
  footnotes:
  - marker: a
    text: Or 'The dead writhe beneath the waters.' Hebrew רְפָאִים can mean 'the dead' or 'the shades,' and יְחוֹלָלוּ may also be rendered 'writhe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 자들의 영은 물 아래에서 떱니다. 그곳에 거하는 자들도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 자들이 물 아래에서 몸부림칩니다.’ 히브리어 רְפָאִים은 ‘죽은 자들’ 또는 ‘그림자들’을 뜻할 수 있고, יְחוֹלָלוּ는 ‘몸부림치다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  english_pob_choice: the departed spirits
  chosen_korean: 죽은 자들의 영
  alternatives_korean:
  - 죽은 자들
  - 그림자들
  - 르파임
  lexicon: HALOT, BDB
  rationale: 본문의 רְפָאִים은 민족명 ‘르파임’이 아니라 스올적 맥락의 죽은 자들을 가리키므로, 현대 한국어에서는 ‘죽은 자들의 영’이 시적 뉘앙스와 의미를 함께 살립니다.
- source_word: יְחוֹלָלוּ
  english_pob_choice: tremble
  chosen_korean: 떱니다
  alternatives_korean:
  - 몸부림칩니다
  - 전율합니다
  - 흔들립니다
  lexicon: HALOT, BDB
  rationale: 이 동사는 두려움 속의 격한 동요를 나타내므로, 물리적 움직임보다 공포에 떠는 상태를 드러내는 ‘떱니다’가 가장 자연스럽습니다.
- source_word: מִתַּחַת מַיִם
  english_pob_choice: beneath the waters
  chosen_korean: 물 아래에서
  alternatives_korean:
  - 물 밑에서
  - 물 아래에
  - 물 속에서
  lexicon: HALOT, BDB
  rationale: 히브리어의 위치 개념을 한국어의 자연스러운 공간 표현으로 옮겼습니다. ‘물 속에서’는 안에 있음으로 좁혀질 수 있어 피했습니다.
- source_word: וְשֹׁכְנֵיהֶם
  english_pob_choice: and those who dwell in them
  chosen_korean: 그곳에 거하는 자들도 그러합니다
  alternatives_korean:
  - 그 안에 사는 자들도 그러합니다
  - 그들의 거민들도 그러합니다
  lexicon: HALOT, BDB
  rationale: 대명사 접미사는 앞의 ‘물’로 돌아가므로, ‘그곳에’로 지시 대상을 분명히 하면서 병행구조의 의미를 살렸습니다.
theological_decisions:
- issue: רְפָאִים의 지시 대상
  chosen_reading: 스올의 죽은 자들에 대한 시적 표현으로 읽었습니다.
  alternative_readings:
  - 고대 민족 르파임
  - 단순히 ‘죽은 자’
  rationale: 욥 26장의 우주적·저승적 문맥상 역사적 민족명보다 죽은 자들의 세계를 가리키는 시적 용례가 더 적절합니다.
  doctrine_reference: 시적 지시 대상 판단; 교리 쟁점은 아님
