  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
  footnotes:
  - marker: a
    text: Or 'He set a boundary on the face of the waters, at the limit where light meets darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 빛과 어둠이 맞닿는 경계까지 물의 표면에 원을 그어 두셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “물의 표면에 경계를 정하셨습니다. 빛과 어둠이 맞닿는 한계까지입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹק חָג
  english_pob_choice: He inscribed a circle
  chosen_korean: 그는 … 원을 그으셨습니다
  alternatives_korean:
  - 그는 … 경계를 정하셨습니다
  - 그는 … 원을 새기셨습니다
  lexicon: HALOT
  rationale: חֹק과 חָג의 결합은 단순한 ‘법령’이 아니라 물 위에 원형의 한계를 그어 두는 이미지를 담으므로, ‘원을 그으셨습니다’가 형상과 행위를 가장 직접적으로 살립니다.
- source_word: עַל פְּנֵי מָיִם
  english_pob_choice: on the surface of the waters
  chosen_korean: 물의 표면 위에
  alternatives_korean:
  - 물의 얼굴 위에
  - 물 위에
  lexicon: HALOT
  rationale: פְּנֵי의 문자적 의미인 ‘얼굴/표면’을 유지하되, 현대 한국어에서 자연스러운 ‘물의 표면 위에’로 옮겨 구체적 공간 이미지를 보존했습니다.
- source_word: עַד תַּכְלִית
  english_pob_choice: at the boundary
  chosen_korean: … 경계까지입니다
  alternatives_korean:
  - … 한계까지입니다
  - … 끝까지입니다
  lexicon: HALOT
  rationale: תַּכְלִית은 ‘끝, 한계, 경계점’의 뜻이므로, 우주적 경계선을 드러내는 ‘경계까지’가 가장 적절합니다.
- source_word: אוֹר עִם חֹשֶׁךְ
  english_pob_choice: between light and darkness
  chosen_korean: 빛과 어둠의
  alternatives_korean:
  - 빛과 어둠 사이의
  - 빛과 어둠이 만나는
  lexicon: HALOT
  rationale: 직역하면 ‘빛과 어둠과 함께/빛과 어둠의’이지만, 문맥상 두 영역의 맞닿는 경계를 가리키므로 ‘빛과 어둠의 경계’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 창조 질서의 경계 설정을 형상화하는 시적 표현의 처리
  chosen_reading: 하나님이 우주적 경계를 ‘그어 두신’ 장면으로 옮겨, 추상적 선언보다 시각적·물질적 이미지를 살렸습니다.
  alternative_readings:
  - 하나님이 경계를 정하셨습니다
  - 하나님이 한계를 선언하셨습니다
  rationale: 히브리어는 바다 위에 원을 그어 빛과 어둠의 경계를 두는 시적 묘사를 사용하므로, 이를 규정적 선언으로 평탄화하지 않고 형상 그대로 전달하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 창조주 하나님의 주권과 질서 부여
