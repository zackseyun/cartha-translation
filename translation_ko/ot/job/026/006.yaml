base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
  footnotes:
  - marker: a
    text: Or 'Sheol is laid bare before him.'
    reason: lexical_alternative
  - marker: b
    text: Abaddon can also be rendered 'Destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스올은 그 앞에 벌거벗었고, 아바돈에는 덮개가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올은 그 앞에 벌거벗겨져 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 아바돈은 ‘파멸’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  english_pob_choice: lies naked
  chosen_korean: 벌거벗었고
  alternatives_korean:
  - 벌거벗어 있고
  - 드러나 있고
  - 적나라하고
  lexicon: HALOT
  rationale: ‘벌거벗다’는 עָרוֹם의 기본 의미를 직접 살리면서, 시적 병행구에서 ‘스올’이 드러나 있다는 이미지를 자연스럽게 전달합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역 ‘스올’을 사용했습니다. ‘무덤’이나 설명적 표현으로 바꾸면 본문의 고유한 사상 범위가 약화됩니다.
- source_word: אֵין כְּסוּת
  english_pob_choice: has no covering
  chosen_korean: 덮개가 없습니다
  alternatives_korean:
  - 가릴 것이 없습니다
  - 덮을 것이 없습니다
  - 감출 것이 없습니다
  lexicon: HALOT
  rationale: כְּסוּת의 ‘덮는 것/덮개’라는 뜻을 살려, 앞절의 ‘벌거벗었’과 대응되는 병행을 유지했습니다.
- source_word: אֲבַדּוֹן
  english_pob_choice: Abaddon
  chosen_korean: 아바돈
  alternatives_korean:
  - 파멸
  - 멸망
  - 파괴
  lexicon: HALOT
  rationale: 시적 병행에서 스올과 짝을 이루는 고유한 표현성을 살리기 위해 음역을 유지했습니다. 추상명사 ‘파멸’로 풀면 개별적 울림이 약해집니다.
theological_decisions:
- issue: ‘그 앞에’의 지시 대상
  chosen_reading: 지시 대상을 본문 밖에서 명시하지 않고 ‘그 앞에’로 유지했습니다.
  alternative_readings:
  - ‘하나님 앞에’로 명시하기
  - ‘그분 앞에’로 풀기
  rationale: 히브리어 3인칭 접미사는 문맥상 하나님을 가리키지만, 한국어 본문에서는 원문의 간결함을 따라 과도한 해석을 본문에 넣지 않고 문맥에 맡겼습니다.
  doctrine_reference: 문맥적 지시 대명사 보존
