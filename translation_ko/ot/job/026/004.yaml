    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי / הִגַּדְתָּ מִלִּין
  english_pob_choice: To whom have you declared words
  chosen_korean: 당신은 누구에게 말을 전하셨습니까?
  alternatives_korean:
  - 당신은 누구에게 말씀하셨습니까?
  - 당신은 누구에게 말을 하셨습니까?
  lexicon: HALOT
  rationale: 히브리어의 ‘declare/tell’과 ‘words’의 결합을 자연스러운 한국어로 옮기되, 반문하는 시의 수사적 힘을 살리기 위해 ‘말을 전하셨습니까’보다 더 직접적인 ‘말을 전하셨습니까’와 ‘누구에게’를 사용했습니다.
- source_word: מִלִּין
  english_pob_choice: words
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 말들
  - 언사
  lexicon: HALOT
  rationale: 이 단어는 여기서 일반적인 ‘말/말씀’의 의미이며, 하나님께 드리는 경어 ‘말씀’으로 고정하면 원문의 중립적 어조를 과도하게 신학화할 수 있어 ‘말’을 택했습니다.
- source_word: וְנִשְׁמַת מִי יָצְאָה מִמֶּךָּ
  english_pob_choice: whose breath has come out from you
  chosen_korean: 누구의 숨결이 당신에게서 나왔습니까?
  alternatives_korean:
  - 누구의 영이 당신에게서 나왔습니까?
  - 누구의 호흡이 당신에게서 나왔습니까?
  lexicon: HALOT
  rationale: נשמה는 ‘숨결/호흡’과 경우에 따라 ‘영’을 뜻하므로, 여기서는 ‘나오다’와 결합한 구체적 이미지에 맞춰 ‘숨결’로 옮기고, 영적 의미는 과도하게 고정하지 않았습니다.
theological_decisions:
- issue: נשמה의 의미 범위(숨결 vs 영)
  chosen_reading: 본문은 우선 ‘숨결’로 읽되, 생명력이나 내적 생기의 암시를 열어 둡니다.
  alternative_readings:
  - ‘영’으로 번역해 인간의 내적 영을 강조하는 읽기
  - ‘호흡’으로 번역해 더욱 물리적 이미지를 강조하는 읽기
  rationale: 문맥상 ‘당신에게서 나왔다’는 표현은 말의 근원성과 생명력을 비유하므로, 한국어에서는 ‘숨결’이 물리적 호흡과 비유적 생기 모두를 비교적 균형 있게 담아냅니다.
  doctrine_reference: 창 2:7; 전 12:7
