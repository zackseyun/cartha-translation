  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
  footnotes:
  - marker: a
    text: Rahab is a poetic name for a chaos power or sea monster opposed by God; alternatively, the term can be rendered interpretively as 'the sea monster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 능력으로 바다를 잠잠하게 하셨고, 그의 통찰로 라합을 산산이 부수셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라합은 하나님께 대적하는 혼돈의 세력이나 바다 괴물을 가리키는 시적 이름입니다. 경우에 따라서는 해석적으로 ‘바다 괴물’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  english_pob_choice: By his power
  chosen_korean: 그의 능력으로
  alternatives_korean:
  - 그의 힘으로
  - 그의 능력에 의해
  lexicon: HALOT
  rationale: ב + כֹּחַ의 도구적 의미를 살려 ‘~으로’로 옮겼고, 우주적 맥락에서는 ‘힘’보다 ‘능력’이 더 자연스럽고 포괄적입니다.
- source_word: רָגַע הַיָּם
  english_pob_choice: he stilled the sea
  chosen_korean: 바다를 잠잠하게 하셨고
  alternatives_korean:
  - 바다를 가라앉히셨고
  - 바다를 शांत하게 하셨고
  - 바다를 조용하게 하셨고
  lexicon: HALOT
  rationale: 동사 רָגַע는 여기서 바다의 소란을 멈추게 하는 뜻이므로, 결과 상태를 드러내는 ‘잠잠하게 하다’가 시적 문맥에 가장 적합합니다.
- source_word: וּבִתְבוּנָתוֹ
  english_pob_choice: and by his understanding
  chosen_korean: 그의 분별로
  alternatives_korean:
  - 그의 이해로
  - 그의 지혜로
  - 그의 통찰로
  lexicon: HALOT
  rationale: תְּבוּנָה는 단순 지식보다 분별·통찰의 실천적 뉘앙스가 있어, 욥기의 지혜 문맥을 살리는 ‘분별’이 적절합니다.
- source_word: מָחַץ רָהַב
  english_pob_choice: he shattered Rahab
  chosen_korean: 라합을 산산이 부수셨습니다
  alternatives_korean:
  - 라합을 산산조각 내셨습니다
  - 라합을 꺾으셨습니다
  - 라합을 깨뜨리셨습니다
  lexicon: HALOT
  rationale: מָחַץ는 강한 파쇄·분쇄를 뜻하므로, 시적 강도를 살리는 ‘산산이 부수다’가 적절합니다. רָהַב은 고유명사로 음역해, 혼돈 세력을 가리키는 시적 인물을 보존했습니다.
theological_decisions:
- issue: רָהַב의 의미를 일반 명사로 풀지, 고유명사로 유지할지
  chosen_reading: 고유명사 ‘라합’으로 유지하여, 하나님께 제압된 혼돈의 세력이라는 시적 상징을 보존했습니다.
  alternative_readings:
  - ‘바다 괴물’로 풀어 옮김
  - ‘교만’이라는 추상명사로 해석
  rationale: 본문의 시적·우주론적 이미지가 핵심이므로, 해석을 한 가지로 고정하기보다 이름을 보존하고 독자가 의미를 추적하도록 하는 편이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 이름은 음역하고, 의미는 각주로 설명하여 해석의 긴장을 보존합니다.'
