  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
  footnotes:
  - marker: a
    text: Or 'the ends/outskirts of his ways.' The Hebrew suggests only the outermost edges of what God does are in view.
    reason: lexical_alternative
  - marker: b
    text: Or 'what a faint hint of a thing we hear of him.' The Hebrew expression is rare and emphasizes how little is heard compared with the 'thunder' of his power.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이것들은 그분의 길들의 끝자락[a]일 뿐입니다. 우리가 그분에 대하여 듣는 것은 겨우 속삭임[b]일 뿐입니다. 그러나 그분의 권능의 천둥을 누가 헤아릴 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 길들의 끝’ 또는 ‘그분의 길들의 가장자리’. 히브리어는 하나님께서 행하시는 일 가운데 가장 바깥쪽 부분만 보인다는 뜻을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 그분에 대하여 듣는 것은 희미한 한마디일 뿐입니다’. 히브리어 표현은 희귀하며, 그분의 권능의 ‘천둥’에 비해 우리가 듣는 것이 얼마나 미미한지를 강조합니다.
    reason: lexical_alternative
