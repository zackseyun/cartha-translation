  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 길의 끝' 또는 '그 길의 가장자리'. 히브리어는 하나님께서 행하시는 일의 가장 바깥쪽 끝부분만 언급하고 있음을 시사합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그분께 대한 말은 겨우 희미한 단서일 뿐입니다'. 히브리어 표현은 희귀하며, 그 권능의 우렁찬 소리에 비해 들리는 것이 얼마나 적은지를 강조합니다.
    reason: alternative_reading
  - marker: c
    text: 원문에는 이 표기가 없으나, '우렁찬 소리'는 'thunder'의 번역으로 추가되었습니다.
