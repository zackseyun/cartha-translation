  terminology: ‘하늘의 기둥들’은 עַמּוּדֵי שָׁמַיִם의 시적 이미지를 적절히 보존합니다. ‘꾸짖으심’은 하나님의 행위를 가리키는 한국어 성서 문체로 가능하나, 각주의 직역은 원문의 명사와 전치사 관계를 정확히 반영하여 ‘그의 꾸짖으심으로부터’로 고쳐야 합니다.
