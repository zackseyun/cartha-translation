  lexicon: HALOT
  rationale: ‘tremble’의 동작성과 경외감을 함께 살리기 위해 ‘떨며’를 택했습니다.
- source_word: וְיִתְמְהוּ
  english_pob_choice: and are astonished
  chosen_korean: 놀랍니다
  alternatives_korean:
  - 경악합니다
  - 아연해합니다
  - 놀라 넋을 잃습니다
  lexicon: HALOT
  rationale: תמהּ의 뜻인 ‘놀라다/경탄하다’에 맞추어, 현대 한국어에서 자연스럽고 과한 정서 왜곡이 적은 ‘놀랍니다’로 옮겼습니다.
- source_word: מִגַּעֲרָתוֹ
  english_pob_choice: at his rebuke
  chosen_korean: 그의 꾸짖으심 앞에서
  alternatives_korean:
  - 그의 꾸짖으심으로 인해
  - 그의 책망 앞에서
  - 그의 꾸짖음 때문에
  lexicon: HALOT
  rationale: מִן의 원인/출처 뉘앙스를 한국어에서 자연스럽게 드러내기 위해, 직역인 ‘from’보다 반응의 계기를 나타내는 ‘앞에서’를 선택했습니다.
