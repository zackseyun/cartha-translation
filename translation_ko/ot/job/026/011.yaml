lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  english_pob_choice: the pillars of heaven
  chosen_korean: 하늘의 기둥들
  alternatives_korean:
  - 하늘의 기둥들
  - 하늘의 주춧돌들
  - 하늘의 기둥들(하늘들)
  lexicon: HALOT
  rationale: עַמּוּדֵי의 문자적 뜻인 ‘기둥들’을 살리면서, שָׁמַיִם은 자연스러운 표준어로 ‘하늘’이라 옮겨 우주적 시상을 그대로 보존했습니다.
- source_word: יְרוֹפָפוּ
  english_pob_choice: tremble
  chosen_korean: 떨며
  alternatives_korean:
