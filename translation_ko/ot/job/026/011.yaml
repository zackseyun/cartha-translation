  source_fidelity: 원문의 ‘하늘의 기둥들’이라는 우주적 시상과 두 동사(‘떨다’, ‘놀라다/경악하다’)는 대체로 충실히 보존되었습니다. 다만 מִן의 원인·계기 용법을 ‘앞에서’로 옮기면 원문의 ‘~로 말미암아/~에’보다 공간적·대면적 의미가 더해집니다.
