    reason: lexical_alternative
translation:
  language: ko
  text: 하늘의 기둥들이 떨며 그의 꾸짖으심 앞에서 놀랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흔들리며’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경악하며’ / ‘놀라며’
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 꾸짖음에서’이며, ‘그의 꾸짖음 때문에’의 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  english_pob_choice: the pillars of heaven
  chosen_korean: 하늘의 기둥들
  alternatives_korean:
  - 하늘의 기둥들
  - 하늘의 주춧돌들
  - 하늘의 기둥들(하늘들)
  lexicon: HALOT
  rationale: עַמּוּדֵי의 문자적 뜻인 ‘기둥들’을 살리면서, שָׁמַיִם은 자연스러운 표준어로 ‘하늘’이라 옮겨 우주적 시상을 그대로 보존했습니다.
- source_word: יְרוֹפָפוּ
  english_pob_choice: tremble
  chosen_korean: 떨며
  alternatives_korean:
  - 흔들리며
  - 요동하며
  - 부르르 떨며
  lexicon: HALOT
  rationale: ‘tremble’의 동작성과 경외감을 함께 살리기 위해 ‘떨며’를 택했습니다.
- source_word: וְיִתְמְהוּ
  english_pob_choice: and are astonished
  chosen_korean: 놀랍니다
  alternatives_korean:
  - 경악합니다
  - 아연해합니다
  - 놀라 넋을 잃습니다
  lexicon: HALOT
  rationale: תמהּ의 뜻인 ‘놀라다/경탄하다’에 맞추어, 현대 한국어에서 자연스럽고 과한 정서 왜곡이 적은 ‘놀랍니다’로 옮겼습니다.
- source_word: מִגַּעֲרָתוֹ
  english_pob_choice: at his rebuke
  chosen_korean: 그의 꾸짖으심 앞에서
  alternatives_korean:
  - 그의 꾸짖으심으로 인해
  - 그의 책망 앞에서
  - 그의 꾸짖음 때문에
  lexicon: HALOT
  rationale: מִן의 원인/출처 뉘앙스를 한국어에서 자연스럽게 드러내기 위해, 직역인 ‘from’보다 반응의 계기를 나타내는 ‘앞에서’를 선택했습니다.
theological_decisions:
- issue: ‘하늘의 기둥들’의 우주적 이미지 유지
  chosen_reading: 이미지를 설명하거나 자연현상으로 환원하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 산맥이나 지구 구조의 은유로 풀어 쓰기
  - 고대 우주론으로 각주에서 해설하기
  rationale: 욥기의 시적 과장은 독자가 본문이 주는 장엄함을 직접 받도록 보존하는 것이 더 적절하므로, 전통적 해설을 본문에 앞세우지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
