base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
  footnotes:
  - marker: a
    text: Or 'in his thick clouds'; the Hebrew term can emphasize dense cloud-mass.
    reason: lexical_alternative
  - marker: b
    text: Or 'does not burst'; the Hebrew says 'is not split open.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 구름들 속에 물을 가두시고, 구름은 그 아래에서 찢어지지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 구름들’은 히브리어의 복수형과 소유격을 반영한 것으로, 문맥상 하나의 구름 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  english_pob_choice: binds up
  chosen_korean: 가두시고
  alternatives_korean:
  - 묶어 두시고
  - 감싸 두시고
  - 묶으시고
  lexicon: HALOT
  rationale: ‘묶다’보다 ‘가두다’가 물을 구름 안에 제한해 두는 이미지를 더 자연스럽게 살리면서, 동작의 구속성을 유지합니다.
- source_word: מַיִם
  english_pob_choice: the waters
  chosen_korean: 물
  alternatives_korean:
  - 물들
  - 물의 흐름
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 시적 문맥에서 보통 단수 ‘물’로 옮겨도 집합적 의미가 유지됩니다.
- source_word: בְּעָבָיו
  english_pob_choice: in his clouds
  chosen_korean: 자기 구름들 속에
  alternatives_korean:
  - 그의 구름들 속에
  - 자기의 두터운 구름 속에
  - 그의 두터운 구름들 속에
  lexicon: HALOT
  rationale: 소유격과 복수 느낌을 함께 살리기 위해 ‘자기 구름들’로 옮겼고, ‘속에’로 בתוך의 포위를 드러냈습니다.
- source_word: נִבְקַע
  english_pob_choice: is not split open
  chosen_korean: 찢어지지 않습니다
  alternatives_korean:
  - 갈라지지 않습니다
  - 쪼개지지 않습니다
  - 터지지 않습니다
  lexicon: HALOT
  rationale: בקע의 물리적 분열 이미지를 한국어에서 가장 직접적으로 전달하는 표현을 택했습니다. ‘터지다’는 의미는 살지만 원문보다 해석적입니다.
