  naturalness: ‘자기 구름들’보다 존칭 문체에서는 ‘자신의 구름들’이 더 자연스럽습니다. ‘구름은 그 아래에서 갈라지지 않습니다’는 시적 이미지와 합쇼체를 유지하면서도 원문의 다소 불명확한 지시 관계를 보존합니다.
