translation:
  language: ko
  text: 당신은 지혜 없는 이에게 어떻게 충고하셨으며, 분별 있는 지혜를 얼마나 풍성하게 알려 주셨습니다![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무슨 충고를 지혜 없는 이에게 하셨으며, 분별 있는 지혜를 얼마나 풍성하게 알려 주셨습니다!’로도 옮길 수 있습니다. 히브리어 פתיחה מַה는 ‘무엇’과 ‘어떻게’ 모두 가능하지만, 본문은 반어적 감탄을 살리기 위해 ‘어떻게’를 취했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: How
  chosen_korean: 어떻게
  alternatives_korean:
  - 무엇을
  - 무슨
  lexicon: HALOT
  rationale: 감탄문으로 시작하는 반어적 문맥이므로, 한국어에서는 ‘무엇을’보다 ‘어떻게’가 영어 POB의 exclamatory force를 가장 자연스럽게 살립니다.
- source_word: לְלֹא חָכְמָה
  english_pob_choice: one without wisdom
  chosen_korean: 지혜 없는 이에게
  alternatives_korean:
  - 지혜 없는 자에게
  - 지혜가 없는 사람에게
  lexicon: HALOT
  rationale: ל + 부정 표현은 수혜 대상/상대방을 가리키는 말이므로, 한국어에서는 ‘~에게’ 구조로 옮겨 반어적 대상 지시를 살렸습니다.
- source_word: וְתוּשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: 분별 있는 지혜
  alternatives_korean:
  - 건전한 지혜
  - 실용적인 지혜
  - 든든한 지혜
  lexicon: HALOT
  rationale: תוּשִׁיָּה는 단순한 지식보다 실효성 있는 판단과 분별을 뜻하므로, ‘지혜’만 두기보다 ‘분별 있는 지혜’로 그 결을 드러냈습니다.
- source_word: לָרֹב הוֹדָעְתָּ
  english_pob_choice: made known abundantly
  chosen_korean: 풍성하게 알려 주셨습니다
  alternatives_korean:
  - 널리 알려 주셨습니다
  - 많이 알려 주셨습니다
  - 넘치도록 알려 주셨습니다
  lexicon: HALOT
  rationale: הוֹדָעְתָּ의 ‘알리다’ 의미와 לָרֹב의 강조를 함께 반영하여, 양적 과잉과 반어를 살릴 수 있는 ‘풍성하게’와 ‘알려 주셨습니다’를 택했습니다.
theological_decisions:
- issue: 욥의 반어적 항의 어조
  chosen_reading: 문장을 정보 전달이 아니라 조롱 섞인 반문으로 읽어, ‘어떻게’와 종결형 감탄을 살렸습니다.
  alternative_readings:
  - 직설적 진술로 읽어 ‘무엇을’ 중심으로 옮김
  - 평서문으로 완화하여 번역
  rationale: 문맥상 욥은 빌닷의 발언을 비꼬며 반어적으로 말하므로, 한국어도 그 날카로움을 유지해야 합니다.
  doctrine_reference: Job 26:3의 담화 문맥
