source:
  edition: WLC
  text: מְאַחֵ֥ז פְּנֵי כִסֵּ֑ה פַּרְשֵׁ֖ז עָלָ֣י/ו עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
  footnotes:
  - marker: a
    text: Or 'He seizes the face of the throne'—the Hebrew verb can more literally mean 'grasp' or 'hold,' but here likely carries the sense of covering or concealing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the face of his throne,' an idiom for the visible surface or front of the throne.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자기 보좌의 앞면을 가리시고, 그 위에 자기 구름을 펴십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아하즈’는 기본적으로 ‘붙잡다’ 또는 ‘잡다’를 뜻할 수도 있습니다. 여기서는 뒤따르는 구름의 이미지 때문에 문맥상 ‘가리다’ 또는 ‘덮다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 보좌의 얼굴’입니다. 이는 보좌의 보이는 면 또는 앞면을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  english_pob_choice: covers
  chosen_korean: 가리시고
  alternatives_korean:
  - 덮으시고
  - 붙드시고
  - 숨기시고
  lexicon: HALOT
  rationale: 히브리어 אחז의 기본값은 ‘붙잡다/잡다’이지만, 여기서는 이어지는 ‘구름을 그 위에 펴다’와 병행되어 보좌의 가시적 면을 가리는 뜻이 자연스럽습니다. 한국어에서는 ‘가리시고’가 그 은폐 이미지를 가장 분명하게 전달합니다.
- source_word: פְּנֵי
  english_pob_choice: the face of
  chosen_korean: 얼굴을
  alternatives_korean:
  - 면을
  - 앞면을
  - 표면을
  lexicon: HALOT
  rationale: פָּנִים의 기본적인 비유적 의미를 살려 직역적으로 ‘얼굴’을 택했습니다. 한국어에서도 ‘보좌의 얼굴’은 히브리어 특유의 생생한 표현을 비교적 그대로 보존합니다.
- source_word: כִסֵּה
  english_pob_choice: his throne
  chosen_korean: 그의 보좌
  alternatives_korean:
  - 그의 왕좌
  - 보좌
  lexicon: HALOT
  rationale: כִּסֵּא는 ‘보좌/왕좌’인데, 시적 문맥에서 하나님의 주권적 좌소를 가리키므로 ‘보좌’가 가장 자연스럽고 문맥에 맞습니다. 영어 POB의 소유격을 따라 ‘그의’도 반영했습니다.
- source_word: פַּרְשֵׁז
  english_pob_choice: spreading
  chosen_korean: 펴시며
  alternatives_korean:
  - 펼치시며
  - 펼쳐
  - 펴며
  lexicon: HALOT
  rationale: 동사는 ‘펼치다/펴다’의 뜻이므로, 앞 동작과 연결되는 현재적 흐름을 살려 ‘펴시며’로 옮겼습니다. 이는 구름이 넓게 덮이는 시적 이미지를 잘 살립니다.
- source_word: עָלָיו
  english_pob_choice: over it
  chosen_korean: 그 위에
  alternatives_korean:
  - 위에
  - 그것 위에
  - 그 위로
  lexicon: HALOT
  rationale: 대명사 접미사는 앞의 ‘보좌’를 가리키므로, 한국어에서는 반복을 피하면서도 관계를 분명히 하는 ‘그 위에’가 적절합니다.
- source_word: עֲנָנוֹ
  english_pob_choice: his cloud
  chosen_korean: 그의 구름
  alternatives_korean:
  - 그 구름
  - 그의 구름덩이
  lexicon: HALOT
  rationale: 단수형에 접미사가 붙은 표현을 그대로 살려 ‘그의 구름’으로 옮겼습니다. 여기서 구름은 하나님의 영광을 가리는 시적 표상으로 이해됩니다.
theological_decisions:
- issue: ‘his throne’와 ‘his cloud’의 소유격 처리
  chosen_reading: 문맥의 암시적 주어를 하나님의 것으로 이해하여 ‘그의 보좌’, ‘그의 구름’으로 옮겼습니다.
  alternative_readings:
  - 소유를 드러내지 않고 ‘보좌’, ‘구름’으로만 번역할 수 있습니다.
  rationale: 히브리어 시는 하나님을 직접 언급하지 않아도 그의 왕권과 위엄을 전제합니다. 소유격을 유지하면 문맥상의 신적 주어를 자연스럽게 드러내되, 본문이 허용하는 범위를 넘지 않습니다.
  doctrine_reference: 번역 원칙 §1, §3
