  rationale: ‘돕다’의 완료된 행위를 합쇼체 의문문으로 옮겨, 반어적 질책의 어조를 살렸습니다.
- source_word: לְלֹא כֹחַ
  english_pob_choice: the powerless
  chosen_korean: 힘없는 자
  alternatives_korean:
  - 힘없는 이
  - 무력한 자
  lexicon: HALOT
  rationale: 히브리어의 ‘힘이 없는 한 사람/자’를 한국어에서 자연스럽게 드러내기 위해 ‘자’를 썼고, 영어 POB가 잡은 반어적 대상성을 유지했습니다.
- source_word: זְרוֹעַ לֹא עֹז
  english_pob_choice: the arm without strength
  chosen_korean: 힘없는 팔
  alternatives_korean:
  - 무력한 팔
  - 힘이 없는 팔
  lexicon: HALOT
  rationale: ‘팔’의 비유적 힘/능력 이미지를 그대로 살리고, 뒤의 ‘없이/없는’ 표현으로 대구를 유지했습니다.
theological_decisions:
- issue: 욥의 반어적 질책 어조
  chosen_reading: 두 문장을 모두 의문형 감탄으로 처리해, 실제 칭찬이 아니라 비꼬는 반어가 드러나게 했습니다.
