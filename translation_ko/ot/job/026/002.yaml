  yaml_path: translation/ot/job/026/002.yaml
  text: How you have helped the powerless! How you have saved the arm without strength![a]
  footnotes:
  - marker: a
    text: Or, more literally, 'What have you helped one without strength? What have you saved—an arm without might?' The Hebrew is sharply ironic.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 힘없는 자를 도우셨습니까! 어찌하여 힘없는 팔을 구하셨습니까![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘힘이 없는 이에게 무엇을 도우셨습니까? 무엇을 구하셨습니까—힘 없는 팔을?’에 가깝고, 히브리어는 강한 반어를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 무엇을
  - 어떻게
  lexicon: HALOT
  rationale: 감탄을 동반한 수사 의문이므로 단순한 ‘무엇’보다 반어적 놀라움을 드러내는 ‘어찌하여’가 문맥에 더 잘 맞습니다.
- source_word: עָזַרְתָּ
  english_pob_choice: you have helped
  chosen_korean: 도우셨습니까
  alternatives_korean:
  - 도왔습니까
  - 도와주셨습니까
  lexicon: HALOT
  rationale: ‘돕다’의 완료된 행위를 합쇼체 의문문으로 옮겨, 반어적 질책의 어조를 살렸습니다.
- source_word: לְלֹא כֹחַ
  english_pob_choice: the powerless
  chosen_korean: 힘없는 자
  alternatives_korean:
  - 힘없는 이
  - 무력한 자
  lexicon: HALOT
  rationale: 히브리어의 ‘힘이 없는 한 사람/자’를 한국어에서 자연스럽게 드러내기 위해 ‘자’를 썼고, 영어 POB가 잡은 반어적 대상성을 유지했습니다.
- source_word: זְרוֹעַ לֹא עֹז
  english_pob_choice: the arm without strength
  chosen_korean: 힘없는 팔
  alternatives_korean:
  - 무력한 팔
  - 힘이 없는 팔
  lexicon: HALOT
  rationale: ‘팔’의 비유적 힘/능력 이미지를 그대로 살리고, 뒤의 ‘없이/없는’ 표현으로 대구를 유지했습니다.
theological_decisions:
- issue: 욥의 반어적 질책 어조
  chosen_reading: 두 문장을 모두 의문형 감탄으로 처리해, 실제 칭찬이 아니라 비꼬는 반어가 드러나게 했습니다.
  alternative_readings:
  - 평서형으로 옮겨 완화하는 방식
  - 단순한 정보 질문처럼 옮기는 방식
  rationale: 문맥상 욥은 빌닷의 말을 빈정거리며 되받아치고 있으므로, 한국어에서도 반어를 약화시키지 않는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 욥기 26장 문맥
