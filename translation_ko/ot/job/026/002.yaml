    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 무엇을
  - 어떻게
  lexicon: HALOT
  rationale: 감탄을 동반한 수사 의문이므로 단순한 ‘무엇’보다 반어적 놀라움을 드러내는 ‘어찌하여’가 문맥에 더 잘 맞습니다.
- source_word: עָזַרְתָּ
