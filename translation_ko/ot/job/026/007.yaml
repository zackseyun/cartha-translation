source:
  edition: WLC
  text: נֹטֶ֣ה צָפ֣וֹן עַל תֹּ֑הוּ תֹּ֥לֶה אֶ֝֗רֶץ עַל בְּלִי מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
  footnotes:
  - marker: a
    text: Or 'the northern sky.' The Hebrew simply says 'the north,' which may refer to the northern heavens in this poetic context.
    reason: lexical_alternative
  - marker: b
    text: Or 'void.' The Hebrew term can denote emptiness, wasteness, or formless void.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 북쪽을 텅 빔 위에 펼치시고, 땅을 아무것도 없는 곳에 매달아 두십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북녘 하늘’. 히브리어는 단순히 ‘북쪽’이라고만 말하며, 이 시적 문맥에서는 북쪽 하늘을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공허’. 히브리어는 비어 있음, 황무함, 형체 없음의 빈 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  english_pob_choice: stretches out
  chosen_korean: 펼치시고
  alternatives_korean:
  - 늘리시고
  - 펴시고
  lexicon: HALOT
  rationale: 우주를 향한 시적 이미지에서 נטה의 ‘펴다/펼치다’ 의미를 자연스럽게 살리면서, ‘북쪽을’의 대상과 잘 어울리는 한국어 표현으로 옮겼습니다.
- source_word: צָפוֹן
  english_pob_choice: the north
  chosen_korean: 북쪽
  alternatives_korean:
  - 북녘 하늘
  - 북쪽 하늘
  lexicon: HALOT
  rationale: 문맥상 지리적 북쪽이라기보다 우주적 방향을 가리키므로, 원문의 단순한 의미를 따라 ‘북쪽’으로 두었습니다. POB의 ‘the north’에 대응하되, 본문에는 해석을 덜 덧붙였습니다.
- source_word: תֹּהוּ
  english_pob_choice: emptiness
  chosen_korean: 텅 빔
  alternatives_korean:
  - 공허
  - 무(無)
  lexicon: HALOT
  rationale: תֹּהוּ의 ‘비어 있음/형체 없음/공허’ 뉘앙스를 현대 한국어로 압축해, 시어로서의 울림을 살리면서도 추상적이지 않게 표현했습니다.
- source_word: בְּלִי מָה
  english_pob_choice: nothing
  chosen_korean: 아무것도 없는 곳
  alternatives_korean:
  - 무(無)
  - 아무것도 없이
  lexicon: HALOT
  rationale: 관용구의 뜻인 ‘on nothing’을 한국어에서는 장소적 표현으로 풀어, ‘땅을 아무것도 없는 곳에 매달아 두십니다’로 원문의 관계를 분명히 했습니다.
theological_decisions:
- issue: 우주 질서의 시적 진술을 현대 과학 명제로 바꾸지 않기
  chosen_reading: 본문을 하나님의 창조 주권을 드러내는 시적 묘사로 유지하고, 과학적 설명으로 재해석하지 않았습니다.
  alternative_readings:
  - 현대 우주론에 대한 직접적 진술로 읽기
  - 신화적 배경을 본문에 명시적으로 덧붙이기
  rationale: 지혜문학의 시어와 이미지 자체를 보존하는 것이 원문 청취자에게 주어진 의미를 가장 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 시적 긴장을 해소하지 않음'
