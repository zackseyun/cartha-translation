  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
  footnotes:
  - marker: a
    text: Or 'The voice of princes fell silent.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their tongue clung to their palate,' an idiom for being unable or unwilling to speak.
    reason: lexical_alternative
translation:
  language: ko
  text: 유력한 자들의 목소리는 사라졌고, 그들의 혀는 입천장에 붙었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 혀가 그들의 입천장에 달라붙었다’이며, 말문이 막히거나 말하지 못하는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
