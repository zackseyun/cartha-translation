  - 숨었고
  lexicon: HALOT
  rationale: 동사의 기본뜻은 ‘숨다’이지만 여기서는 ‘목소리’가 들리지 않게 된 상태를 뜻하므로, 한국어에서는 결과 상태를 드러내는 ‘사라졌고’가 관용적 의미를 가장 잘 반영합니다.
