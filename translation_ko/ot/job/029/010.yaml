base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
  footnotes:
  - marker: a
    text: Or 'The voice of princes fell silent.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their tongue clung to their palate,' an idiom for being unable or unwilling to speak.
    reason: lexical_alternative
translation:
  language: ko
  text: 유력한 자들의 목소리는 잠잠해졌고, 그들의 혀는 입천장에 달라붙었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 혀가 입천장에 달라붙었다’입니다. 말할 수 없게 된 모습을 나타내는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
  - 소리
  - 음성
  lexicon: HALOT
  rationale: 사람의 말소리가 사라지는 문맥이므로 일반적 ‘소리’보다 ‘목소리’가 더 자연스럽고, 시적 병행구에서도 화자의 말이 멎은 상태를 잘 드러냅니다.
- source_word: נְגִידִים
  english_pob_choice: nobles
  chosen_korean: 유력한 자들
  alternatives_korean:
  - 귀족들
  - 지도자들
  - 통치자들
  lexicon: HALOT
  rationale: 권세 있는 사회적 지위를 가리키지만, 왕족으로 너무 좁히지 않기 위해 ‘유력한 자들’로 옮겨 신분적 두드러짐을 유지했습니다.
- source_word: נֶחְבָּאוּ
  english_pob_choice: was hushed
  chosen_korean: 사라졌고
  alternatives_korean:
  - 잠잠해졌고
  - 침묵했고
  - 숨었고
  lexicon: HALOT
  rationale: 동사의 기본뜻은 ‘숨다’이지만 여기서는 ‘목소리’가 들리지 않게 된 상태를 뜻하므로, 한국어에서는 결과 상태를 드러내는 ‘사라졌고’가 관용적 의미를 가장 잘 반영합니다.
- source_word: לְחִכָּם
  english_pob_choice: the roof of their mouth
  chosen_korean: 입천장
  alternatives_korean:
  - 그들의 입천장
  - 그들의 구개
  lexicon: HALOT
  rationale: 해부학적 비유를 한국어 일상어로 분명하게 전달하기 위해 ‘입천장’으로 옮겼습니다.
