    rationale: 이 절은 앞 문맥에서 언급된 존경의 근거를 제시합니다. 한국어에서는 ‘이는 … 때문입니다’로 자연스럽게 드러낼 수 있습니다.
  - severity: high
    issue: ‘도와줄 이가 없는’ 수식어가 יָתוֹם과 분리되어 두 명의 별도 대상처럼 번역됨
