  source_fidelity: 개정이 필요합니다. 초안은 כִּי의 문맥상 근거·이유 연결을 문장에 반영하지 않았고, ‘아버지가 없는 자와 그를 돕는 이가 없는 자’를 두 부류의 사람처럼 병렬 처리하여, ‘도와줄 이가 없는’이라는 수식이 ‘아버지가 없는 이’를 한정하는 히브리어 구문을 흐립니다.
  naturalness: ‘가난한 자가 부르짖을 때’는 원문의 분사 수식을 시간절로 바꾸어 다소 약화하며, ‘아버지가 없는 자와 그를 돕는 이가 없는 자’는 의미와 문장 구조 모두 부자연스럽습니다. 인과절과 관계절로 정리하면 현대 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘구해 주었습니다’는 אֲמַלֵּט의 적극적인 구출 의미를 적절히 전달합니다. יָתוֹם은 ‘아버지가 없는 사람’으로 옮겨 ‘고아’보다 좁고 구체적인 원어의 사회적 범주를 보존하는 것이 좋습니다.
