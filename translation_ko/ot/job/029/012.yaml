source:
  edition: WLC
  text: כִּֽי אֲ֭מַלֵּט עָנִ֣י מְשַׁוֵּ֑עַ וְ֝/יָת֗וֹם וְֽ/לֹא עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
  footnotes:
  - marker: a
    text: Or "the orphan." The Hebrew more specifically denotes one without a father, a socially vulnerable person.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 제가 부르짖는 가난한 사람을 구해 주었고, 그를 도와줄 이가 없는 아버지 없는 사람도 구해 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지 없는 사람’은 히브리어 יָתוֹם을 따른 번역입니다. ‘고아’로도 옮길 수 있지만, 이 말은 더 구체적으로 아버지가 없는 사회적 약자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 제가
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 문맥상 앞선 명예 진술의 근거를 이어 주므로 한국어에서는 자연스러운 서술 주어로 시작해 설명 관계를 드러냈습니다.
- source_word: אֲמַלֵּט
  english_pob_choice: I delivered
  chosen_korean: 구해 주었습니다
  alternatives_korean:
  - 건져 주었습니다
  - 구원했습니다
  - 도망치게 했습니다
  lexicon: HALOT
  rationale: 피엘형의 적극적 구출 의미를 살리면서, 현재 문맥의 구제·보호 행위를 한국어에서 자연스럽게 나타냈습니다.
- source_word: עָנִי מְשַׁוֵּעַ
  english_pob_choice: the poor who cried for help
  chosen_korean: 가난한 자가 부르짖을 때
  alternatives_korean:
  - 부르짖는 가난한 자
  - 도움을 외치는 가난한 자
  lexicon: HALOT
  rationale: עָנִי를 ‘가난한 자’로, מְשַׁוֵּעַ를 ‘부르짖다’로 옮겨 사회적 취약성과 간구의 소리를 함께 드러냈습니다.
- source_word: יָתוֹם וְלֹא עֹזֵר לוֹ
  english_pob_choice: the fatherless who had no helper
  chosen_korean: 아버지가 없는 자와 그를 돕는 이가 없는 자
  alternatives_korean:
  - 아버지가 없는 자, 곧 그를 돕는 이가 없는 자
  - 고아와 그를 돕는 이가 없는 자
  lexicon: HALOT
  rationale: יָתוֹם의 사회적 의미를 ‘아버지가 없는 자’로 보존하고, 뒤의 ‘돕는 이가 없는’ 조건도 병렬로 살렸습니다. ‘고아’는 가능하지만 부모 상실까지 암시할 수 있어 더 좁은 의미를 택했습니다.
theological_decisions:
- issue: 보호와 구원의 행위를 어떻게 표현할지
  chosen_reading: ‘구해 주었습니다’로 두 번 반복해, 욥이 약자를 실제로 건져 낸 적극적 행위를 강조했습니다.
  alternative_readings:
  - ‘구원했습니다’
  - ‘건져 주었습니다’
  rationale: 본문의 자기 변호는 단순한 동정이 아니라 위기에서의 실제 개입을 말하므로, 반복을 통해 행위의 무게를 살렸습니다.
  doctrine_reference: 사회적 정의와 자비의 실천
