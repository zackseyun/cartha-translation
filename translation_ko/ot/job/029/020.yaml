  naturalness: 합쇼체 문체는 적절합니다. ‘내 손의 활’은 한국어에서 소유 관계로 쉽게 읽혀 ‘손에 있는/손에 든 활’로 고치는 편이 자연스럽습니다. 각 주석 표지를 해당 어구 바로 뒤에 두면 참조 범위도 분명해집니다.
  terminology: ‘영광’과 ‘활’을 유지한 것은 시적 이미지와 의미 폭을 보존합니다. ‘활’을 본문에서 곧바로 힘으로 해석하지 않고 주석에서 상징 가능성만 밝히는 방식도 적절합니다.
