source:
  edition: WLC
  text: כְּ֭בוֹדִ/י חָדָ֣שׁ עִמָּדִ֑/י וְ֝/קַשְׁתִּ֗/י בְּ/יָדִ֥/י תַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
  footnotes:
  - marker: a
    text: Or 'My glory was new with me.' The Hebrew adjective can be rendered 'new,' though in context it likely means continually fresh or unfaded.
    reason: lexical_alternative
  - marker: b
    text: The 'bow' is likely a figure for strength or vigor, though the Hebrew keeps the concrete image.
    reason: cultural_note
translation:
  language: ko
  text: 나의 영광은 나와 함께 늘 새로웠고[a], 내 손에 든 활은 새로워졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형용사 חָדָשׁ은 ‘새로운’으로도 옮길 수 있습니다. 여기서는 계속 생기 있고 빛이 바래지 않은 상태를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘활’은 힘이나 활력을 나타내는 비유일 수 있으나, 히브리어 본문은 구체적인 활의 이미지를 유지합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 나의 영광
  alternatives_korean:
  - 나의 명예
  - 나의 존엄
  lexicon: HALOT
  rationale: כָּבוֹד는 문맥상 명예만이 아니라 위엄과 영광의 폭을 가지므로, POB의 'my glory'를 따라 '나의 영광'으로 옮겨 원문의 시적 이미지를 살렸습니다.
- source_word: חָדָשׁ
  english_pob_choice: fresh
  chosen_korean: 늘 새로웠고
  alternatives_korean:
  - 새로웠고
  - 새것이었고
  - 신선했고
  lexicon: HALOT
  rationale: 형용사 חָדָשׁ은 단순히 '새로운' 상태보다 시적으로 '마르지 않고 새 힘이 남아 있는' 뉘앙스를 가지므로, '늘 새로웠고'로 현재적·지속적 생기를 드러냈습니다.
- source_word: תַחֲלִיף
  english_pob_choice: was renewed
  chosen_korean: 새로워졌습니다
  alternatives_korean:
  - 갱신되었습니다
  - 다시 강해졌습니다
  - 새 힘을 얻었습니다
  lexicon: HALOT
  rationale: חלף의 히필은 단순한 교체보다 회복·갱신의 뜻이 강하므로, 활이 다시 생기를 얻는 이미지를 살려 '새로워졌습니다'로 옮겼습니다.
theological_decisions:
- issue: ‘활’의 상징성은 살리되 본문 이미지 자체를 유지할지 여부
  chosen_reading: 비유적 의미를 과도하게 풀지 않고 '내 손의 활'을 그대로 유지했습니다.
  alternative_readings:
  - 나의 힘
  - 나의 활력
  - 나의 무력
  rationale: 영어 POB도 구체적 이미지인 'bow'를 본문에 남기고 상징 가능성만 주석으로 처리하므로, 한국어 본문도 상징 해석을 본문에 흡수하지 않고 원문 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 본문 해석 원칙 / 원문 이미지 보존
