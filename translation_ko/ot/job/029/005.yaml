  text: בְּ/ע֣וֹד שַׁ֭דַּי עִמָּדִ֑/י סְבִ֖יבוֹתַ֣/י נְעָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/005.yaml
  text: when the Almighty was still with me[a], and my young men were around me,
  footnotes:
  - marker: a
    text: Or 'my servants were around me.' The Hebrew נְעָרַי can denote 'my young men,' 'my attendants,' or 'my servants,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 전능하신 이가 아직도 저와 함께 계실 때, 제 젊은이들이 제 주위에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 종들이 제 주위에 있었습니다.’ 히브리어 נְעָרַי는 문맥에 따라 ‘젊은이들’, ‘시종들’, ‘종들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד
  english_pob_choice: when ... was still
  chosen_korean: 아직도 … 계실 때
  alternatives_korean:
  - …하는 동안
  - 여전히 …이실 때
  - …계시는 동안
  lexicon: HALOT
  rationale: 과거의 지속 상태를 여는 זמני절이므로, 단순한 '동안'보다 종료된 옛 상태의 뉘앙스를 살린 '아직도 … 계실 때'가 원문의 시간감각을 잘 드러냅니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 이
  alternatives_korean:
  - 전능자
  - 전능하신 하나님
  - 샤다이
  lexicon: HALOT
  rationale: 욥기에서의 신적 칭호를 한국어로 의미 번역하여 이해 가능성을 높이되, 인칭적 호칭으로도 자연스러운 '전능하신 이'를 택했습니다.
- source_word: נְעָרַי
  english_pob_choice: my young men
  chosen_korean: 제 젊은이들
  alternatives_korean:
  - 제 종들
  - 제 시종들
  - 제 하인들
  lexicon: HALOT
  rationale: 문맥상 집안의 젊은 남자들을 가리키는 표현이므로, 신분을 과도하게 특정하는 '종/시종'보다 어휘적 기본값을 살린 '젊은이들'이 더 직접적입니다.
theological_decisions:
- issue: 하나님의 임재를 회상하는 욥의 문장 톤
  chosen_reading: 하나님을 직접 부르는 기도체가 아니라 과거를 회상하는 서술이므로, 합쇼체 평서로 유지했습니다.
  alternative_readings:
  - 기도문처럼 더 경건한 높임말로 조정
  - 문학적 구어체로 완화
  rationale: 원문은 회상 서술이며 화자-청자 관계의 변화가 없으므로, 과도한 경어 전환 없이 담담하게 옮기는 것이 문맥에 맞습니다.
  doctrine_reference: 문맥 우선 원칙; 서사체 평서 유지
