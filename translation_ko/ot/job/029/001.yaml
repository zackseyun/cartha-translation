lexical_decisions:
- source_word: וַיֹּסֶף
  english_pob_choice: continued
  chosen_korean: 다시 … 시작하여
  alternatives_korean:
  - 계속하여
  - 거듭하여
  lexicon: HALOT
  rationale: יסף는 여기서 앞선 발언을 이어 가는 반복적·연속적 동작을 나타내므로, 한국어에서는 자연스럽게 ‘다시 … 시작하여’로 풀어 연속성과 재개를 함께 살렸습니다.
- source_word: שְׂאֵת מְשָׁלוֹ
  english_pob_choice: taking up his discourse
  chosen_korean: 자신의 말을 시작하여
  alternatives_korean:
  - 자신의 설교를 들어 올려
  - 자신의 잠언을 들어 올려
  lexicon: HALOT
  rationale: נשׂא + משל 관용구는 단순한 ‘잠언’보다 길게 이어지는 시적 발언의 개시를 가리키므로, 문맥상 ‘자신의 말을 시작하여’로 옮겨 한국어 독자에게 자연스럽게 전달했습니다.
- source_word: מְשָׁל
  english_pob_choice: discourse
  chosen_korean: 말
  alternatives_korean:
  - 잠언
  - 비유
  - 예언
  lexicon: HALOT
  rationale: māšāl은 여기서 욥기의 장문의 시적 담화를 여는 표지이므로, 좁은 의미의 ‘잠언’보다 넓은 ‘말’이 원문의 기능을 과도하게 특정하지 않습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하여 이르렀습니다
  lexicon: HALOT
  rationale: 서사적 와우 연속형을 한국어의 자연스러운 직접화법 도입인 ‘말하였습니다’로 옮겨, 문체를 유지하면서도 매끄러운 합쇼체를 확보했습니다.
