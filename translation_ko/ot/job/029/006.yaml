  text: בִּ/רְחֹ֣ץ הֲלִיכַ֣/י בְּ/חֵמָ֑ה וְ/צ֥וּר יָצ֥וּק עִ֝מָּדִ֗/י פַּלְגֵי שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/006.yaml
  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
  footnotes:
  - marker: a
    text: 'Or ''butter'': the Hebrew חֵמָה can denote curds, cream, or butter-like dairy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beside me' / 'with me' for 'for me'; the Hebrew expression is literally spatial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내 걸음이 응유로 씻겼고, 바위가 내게 기름 시내를 쏟아 냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버터’; 히브리어 חֵמָה는 응유, 크림, 버터 같은 유제품을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 곁에’/‘나와 함께’; 여기서 히브리어 표현은 문자적으로는 공간적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ הֲלִיכַי
  english_pob_choice: when my steps were washed
  chosen_korean: 내 걸음이 씻겼고
  alternatives_korean:
  - 내 걸음이 씻길 때
  - 내 걸음이 씻겼을 때
  - 내 걸음이 씻겨 있을 때
  lexicon: WLC / HALOT
  rationale: 부정사구가 시간적 상황을 여는 표현이므로 한국어는 서술형으로 자연스럽게 풀어 '그때'를 두어 옛 번영의 장면을 시간적으로 제시했습니다.
- source_word: בְּחֵמָה
  english_pob_choice: with curds
  chosen_korean: 응유로
  alternatives_korean:
  - 버터로
  - 크림으로
  - 유장으로
  lexicon: HALOT
  rationale: חֵמָה는 우유 부산물인 응유·농후한 유제품을 가리킬 수 있으므로, 현대 한국어에서 가장 소스에 가까우면서도 과도하게 근대적 이미지를 덜 주는 '응유'를 택했습니다.
- source_word: יָצוּק
  english_pob_choice: poured out
  chosen_korean: 쏟아 냈습니다
  alternatives_korean:
  - 부어 냈습니다
  - 흘려보냈습니다
  - 쏟았습니다
  lexicon: HALOT
  rationale: יצק의 핵심은 '붓다/쏟다'이므로, 풍성한 공급의 이미지를 살리면서도 시적 과장을 유지하는 '쏟아 냈습니다'를 선택했습니다.
- source_word: פַּלְגֵי שָׁמֶן
  english_pob_choice: streams of oil
  chosen_korean: 기름 시내를
  alternatives_korean:
  - 기름의 시내를
  - 기름의 물줄기를
  - 기름의 흐름을
  lexicon: HALOT
  rationale: פַּלְגֵי는 갈라진 물길/시내라는 시적 표현이므로, 한국어에서도 자연스럽고 형상적인 '시내'를 유지해 풍요의 과장을 보존했습니다.
