  rationale: אֲבֵלִים은 단순한 슬픔보다 상중의 애도 상태를 가리킬 수 있어 ‘애곡하는 사람들’로 옮겼고, יְנַחֵם은 ‘위로하는’으로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 비유문의 난해한 종결구 해석
  chosen_reading: 마지막 절을 ‘애곡하는 사람들을 위로하는 이처럼’으로 처리하여, 지위의 비유와 위로의 역할을 모두 살렸습니다.
  alternative_readings:
  - ‘애곡하는 사람들을 위로하듯’
  - ‘애도하는 자를 위로하는 이처럼’
  rationale: 히브리어의 비교구문이 다소 압축적이므로, 한국어에서는 비교 표지를 분명히 하면서도 문맥상 욥의 품위와 위로자 역할이 함께 드러나도록 했습니다.
  doctrine_reference: 시적 지혜문학의 수사와 인물 묘사
