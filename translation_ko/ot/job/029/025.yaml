source:
  edition: WLC
  text: אֶֽבֲחַ֣ר דַּרְכָּ/ם֮ וְ/אֵשֵׁ֪ב רֹ֥אשׁ וְ֭/אֶשְׁכּוֹן כְּ/מֶ֣לֶךְ בַּ/גְּד֑וּד כַּ/אֲשֶׁ֖ר אֲבֵלִ֣ים יְנַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
  footnotes:
  - marker: a
    text: Or 'I chose their course and sat at the head.' The Hebrew can be understood as Job selecting or approving the way others should take, then occupying the place of leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a king in the troop/band.' The Hebrew גְּדוּד may refer to a troop, band, or company.
    reason: lexical_alternative
  - marker: c
    text: The final comparison is difficult. The Hebrew may mean 'like one who comforts mourners,' emphasizing Job's consoling role even while holding a place of honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 길을 택하고 우두머리 자리에 앉았으며,[a] 부대 가운데 있는 왕처럼 지냈고,[b] 애도하는 이들을 위로하는 이처럼 지냈습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 길을 택하고 우두머리로 앉았으며.’ 히브리어는 욥이 그들이 갈 길을 선택하거나 승인하고 지도자의 자리를 차지했다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부대’로 옮긴 히브리어 גְּדוּד는 ‘무리’, ‘떼’, 또는 ‘부대’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 비교는 해석하기 어렵습니다. 히브리어는 ‘애도하는 이들을 위로하는 이처럼’이라는 뜻일 수 있으며, 욥이 높은 지위에 있으면서도 위로하는 역할을 했음을 강조하는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
