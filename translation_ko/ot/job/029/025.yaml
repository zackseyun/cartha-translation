source:
  edition: WLC
  text: אֶֽבֲחַ֣ר דַּרְכָּ/ם֮ וְ/אֵשֵׁ֪ב רֹ֥אשׁ וְ֭/אֶשְׁכּוֹן כְּ/מֶ֣לֶךְ בַּ/גְּד֑וּד כַּ/אֲשֶׁ֖ר אֲבֵלִ֣ים יְנַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
  footnotes:
  - marker: a
    text: Or 'I chose their course and sat at the head.' The Hebrew can be understood as Job selecting or approving the way others should take, then occupying the place of leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a king in the troop/band.' The Hebrew גְּדוּד may refer to a troop, band, or company.
    reason: lexical_alternative
  - marker: c
    text: The final comparison is difficult. The Hebrew may mean 'like one who comforts mourners,' emphasizing Job's consoling role even while holding a place of honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 길을 택하고 수석 자리에 앉았으며, 군대 가운데의 왕처럼 머물렀고, 애곡하는 사람들을 위로하는 이처럼 그러했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수석 자리’는 히브리어 רֹאשׁ의 직역 ‘머리’보다 한국어에서 자연스러운 지도적 지위를 드러내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘군대 가운데의’는 히브리어 גְּדוּד가 ‘부대, 무리, 떼’도 뜻할 수 있음을 반영한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 비교구문은 ‘애곡하는 사람들을 위로하는 이처럼’으로 옮겼으나, 히브리어는 압축적이어서 ‘애도하는 자를 위로하듯’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר / דַּרְכָּם
  english_pob_choice: I chose their way
  chosen_korean: 나는 그들의 길을 택하고
  alternatives_korean:
  - 나는 그들의 길을 선택하고
  - 나는 그들의 길을 정하고
  lexicon: HALOT
  rationale: בחר의 ‘택하다’와 דרך의 ‘길’을 살려, 단순히 길을 걷는 것이 아니라 판단하여 받아들인 방향을 고른다는 뜻을 드러냈습니다.
- source_word: וְאֵשֵׁב רֹאשׁ
  english_pob_choice: and sat as chief
  chosen_korean: 수석 자리에 앉았으며
  alternatives_korean:
  - 머리 자리에 앉았으며
  - 우두머리로 앉았으며
  lexicon: HALOT
  rationale: רֹאשׁ의 직역인 ‘머리’보다 한국어에서 자연스러운 위계·대표 자리를 드러내는 ‘수석 자리’를 택해, 앉음의 이미지와 지도적 의미를 함께 살렸습니다.
- source_word: בַּגְּדוּד
  english_pob_choice: among the troops
  chosen_korean: 군대 가운데의
  alternatives_korean:
  - 무리 가운데의
  - 부대 가운데의
  lexicon: HALOT
  rationale: גְּדוּד의 ‘무리/대오/부대’ 가능성을 반영하되, 문맥상 위엄과 소속감을 살리기 위해 ‘군대 가운데의’로 옮겼습니다.
- source_word: אֲבֵלִים יְנַחֵם
  english_pob_choice: like one who comforts mourners
  chosen_korean: 애곡하는 사람들을 위로하는 이처럼
  alternatives_korean:
  - 상주들을 위로하는 이처럼
  - 슬퍼하는 사람들을 위로하는 이처럼
  lexicon: HALOT
  rationale: אֲבֵלִים은 단순한 슬픔보다 상중의 애도 상태를 가리킬 수 있어 ‘애곡하는 사람들’로 옮겼고, יְנַחֵם은 ‘위로하는’으로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 비유문의 난해한 종결구 해석
  chosen_reading: 마지막 절을 ‘애곡하는 사람들을 위로하는 이처럼’으로 처리하여, 지위의 비유와 위로의 역할을 모두 살렸습니다.
  alternative_readings:
  - ‘애곡하는 사람들을 위로하듯’
  - ‘애도하는 자를 위로하는 이처럼’
  rationale: 히브리어의 비교구문이 다소 압축적이므로, 한국어에서는 비교 표지를 분명히 하면서도 문맥상 욥의 품위와 위로자 역할이 함께 드러나도록 했습니다.
  doctrine_reference: 시적 지혜문학의 수사와 인물 묘사
