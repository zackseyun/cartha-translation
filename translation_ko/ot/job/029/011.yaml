id: JOB.29.11
reference: Job 29:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֹ֣זֶן שָׁ֭מְעָה וַֽ/תְּאַשְּׁרֵ֑/נִי וְ/עַ֥יִן רָ֝אֲתָ֗ה וַ/תְּעִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
  footnotes:
  - marker: a
    text: Or 'bore witness to me.' The Hebrew verb can mean to testify or bear witness; in context it is favorable testimony about Job.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 어떤 이가 듣기만 해도 저를 복되다고 했고, 어떤 이가 보기만 해도 저를 증언했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 위해 증언했습니다.’ 히브리어 동사는 ‘증언하다/증거하다’의 뜻을 가지며, 문맥상 욥에 대한 호의적 증언입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그때
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 앞선 진술을 이어 주는 설명이므로, 한국어에서는 원인 접속사보다 회상적 시간 부사로 풀어 자연스러운 흐름을 살렸습니다.
- source_word: אֹזֶן שָׁמְעָה
  english_pob_choice: an ear heard
  chosen_korean: 어떤 이가 듣기만 해도
  alternatives_korean:
  - 귀가 들었고
  - 한 귀가 들었고
  - 듣는 이가
  lexicon: HALOT
  rationale: 히브리어의 신체 부위 단수는 일반적 청자를 가리키는 관용적 표현이므로, 한국어에서는 부자연스러운 ‘귀’보다 ‘어떤 이가’로 옮겨 의미를 드러냈습니다.
- source_word: וַתְּאַשְּׁרֵנִי
  english_pob_choice: called me blessed
  chosen_korean: 저를 복되다고 했고
  alternatives_korean:
  - 저를 복되다 일컬었고
  - 저를 복 있다고 했고
  - 저를 행복하다고 했고
  lexicon: HALOT
  rationale: אשר의 평가적 의미를 살려 ‘복되다’로 옮기되, 현대 한국어에서 자연스럽도록 ‘했다고’ 형태로 표현했습니다.
- source_word: וַתְּעִידֵנִי
  english_pob_choice: it testified for me
  chosen_korean: 저를 증언했습니다
  alternatives_korean:
  - 저를 위해 증언했습니다
  - 저에게 증언했습니다
  - 저를 위해 증거했습니다
  lexicon: HALOT
  rationale: 본동사는 법정적 ‘증언/증거’의 뜻을 가지며, 문맥상 욥에게 유리한 평판을 가리키므로 ‘증언했습니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 화자의 일반화된 청각·시각 표현을 한국어에서 어떻게 처리할지
  chosen_reading: 개별 신체기관을 그대로 반복하기보다, ‘어떤 이가… 어떤 이가…’로 옮겨 수사적 병렬을 유지했습니다.
  alternative_readings:
  - ‘귀가 들으면… 눈이 보면…’
  - ‘한 귀가 들으면… 한 눈이 보면…’
  rationale: 히브리어는 신체기관을 주어로 세워 보편적 반응을 말하지만, 한국어 직역은 어색할 수 있어 의미를 훼손하지 않는 범위에서 자연스러운 인칭화로 풀었습니다.
  doctrine_reference: 시적 병렬과 관용적 신체 이미지의 번역 원칙
- issue: וַתְּעִידֵנִי의 방향성
  chosen_reading: ‘저를 증언했습니다’로 옮겨, 욥에게 유리한 ‘for me’의 방향을 문맥에서 유지했습니다.
  alternative_readings:
  - ‘저에 대해 증언했습니다’
  - ‘저에게 증언했습니다’
  rationale: 영어 POB가 ‘for me’로 해석한 긍정적 증언을 따라, 중립적 ‘to me’보다 유리한 증언이라는 문맥을 살리는 방향이 적절합니다.
  doctrine_reference: 문맥상 호의적 평판에 대한 증언
