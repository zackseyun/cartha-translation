  to: 이는 나에 대하여 들은 사람마다 나를 복되다 하였고, 나를 본 사람마다 나를 위하여 증언하였기 때문입니다.[a]
  rationale: 시간적 ‘그때’와 강조 표현 ‘-기만 해도’를 제거하고, כִּי의 설명적 기능을 ‘이는 … 때문입니다’로 옮겼습니다. 귀와 눈의 시적 병렬은 각각 ‘들은 사람마다’와 ‘본 사람마다’로 자연스럽게 반영했습니다. 마지막 동사는 문맥상 호의적인 증언의 방향을 명시하도록 ‘나를 위하여 증언하였다’로 고쳤습니다.
