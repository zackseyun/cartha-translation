language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ב אָ֭נֹכִֽי לָֽ/אֶבְיוֹנִ֑ים וְ/רִ֖ב לֹא יָדַ֣עְתִּי אֶחְקְרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
  footnotes:
  - marker: a
    text: Or, 'I searched out the dispute of one I did not know.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 가난한 사람들에게 아버지였으며, 내가 알지 못하던 사람의 사건을 조사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 알지 못하던 사람의 분쟁을 찾아냈습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָב / אָנֹכִי
  english_pob_choice: I was a father
  chosen_korean: 나는 … 아버지였습니다
  alternatives_korean:
  - 나는 … 보호자였습니다
  - 나는 … 후원자였습니다
  lexicon: HALOT
  rationale: אָב는 문자적으로 ‘아버지’이므로, 관계적 보호와 변호의 이미지를 살리기 위해 직역형을 유지했습니다. 독립인칭 אָנֹכִי의 강조는 한국어에서 주어를 분명히 드러내는 방식으로 반영했습니다.
- source_word: לָאֶבְיוֹנִים
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 가난한 이들에게
  - 궁핍한 사람들에게
  lexicon: HALOT
  rationale: אֶבְיוֹן은 가난하고 궁핍한 사람을 가리키므로, ‘가난한 사람들’이 자연스럽고 명료합니다. ל는 여기서 ‘-에게’로 옮기는 것이 문맥상 가장 자연스럽습니다.
- source_word: וְרִיב
  english_pob_choice: the case
  chosen_korean: 사건을
  alternatives_korean:
  - 분쟁을
  - 소송을
  - 다툼을
  lexicon: HALOT
  rationale: רִיב은 분쟁, 소송, 법적 사건을 포괄할 수 있으나, ‘사건’이 한국어에서 조사하고 다루는 대상이라는 의미를 가장 넓고 자연스럽게 담습니다.
- source_word: אֶחְקְרֵהוּ
  english_pob_choice: I investigated
  chosen_korean: 조사했습니다
  alternatives_korean:
  - 살펴보았습니다
  - 탐문했습니다
  - 면밀히 조사했습니다
  lexicon: HALOT
  rationale: חקר는 ‘면밀히 조사하다, 탐구하다’의 뜻이므로, 현대 한국어에서는 ‘조사했습니다’가 가장 직관적으로 대응합니다. 목적어 대명사 -הוּ는 앞의 ‘사건’을 받는 것으로 드러납니다.
theological_decisions:
- issue: 가난한 사람들에 대한 욥의 태도와 법정적/사회적 돌봄의 뉘앙스
  chosen_reading: ‘아버지였다’와 ‘사건을 조사했다’를 함께 살려, 단순한 친절이 아니라 보호자이자 변호인으로서의 역할을 드러냈습니다.
  alternative_readings:
  - ‘보호자였다’로 완화하기
  - ‘분쟁을 해결했다’로 해석하기
  rationale: 본문은 욥이 가난한 이들을 아버지처럼 돌보고, 자신이 모르는 사람의 분쟁까지 직접 파고들었다는 공적 의를 강조합니다. 이를 약화시키지 않기 위해 관계적 이미지와 조사 행위를 모두 유지했습니다.
  doctrine_reference: 지혜문학의 사회적 의와 약자 보호
- issue: רִיב의 범위
  chosen_reading: ‘사건’으로 번역해 법정 분쟁에만 가두지 않고, 문맥상 정당한 주장·분쟁·사안까지 포괄하게 했습니다.
  alternative_readings:
  - ‘분쟁’
  - ‘소송’
  - ‘사건/소송’의 병기
  rationale: 영어 POB도 ‘case’를 택해 משפט적 의미를 드러내면서도 자연성을 유지했습니다. 한국어에서도 단일어 ‘사건’이 그 폭을 가장 무리 없이 담습니다.
  doctrine_reference: 히브리어 רִיב의 문맥적 의미
