id: JOB.29.14
reference: Job 29:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
  footnotes:
  - marker: a
    text: Or 'I put on justice, and it clothed me.' The Hebrew צֶדֶק can be rendered 'righteousness' or 'justice.'
    reason: lexical_alternative
  - marker: b
    text: A 'turban' here is a wrapped head covering, part of the verse's imagery of honor and public dignity.
    reason: cultural_note
translation:
  language: ko
  text: 나는 의를 입었고, 그것이 나를 입혔습니다. 나의 공의는 겉옷 같고, 관을 쓴 것 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֶדֶק은 ‘의’ 또는 ‘공의/정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צָנִיף은 머리에 감아 쓰는 덮개로, 여기서는 위엄과 공적 존귀를 나타내는 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 정의
  lexicon: HALOT
  rationale: צֶדֶק은 문맥에 따라 ‘의’와 ‘공의/정의’의 폭을 가질 수 있으나, 여기서는 옷을 입는 비유 속에서 인격적·도덕적 성품을 나타내므로 1절 후반의 מִשְׁפָּטִי와 구별되게 ‘의’로 옮겼습니다.
- source_word: לָבַשְׁתִּי
  english_pob_choice: I put on
  chosen_korean: 입었습니다
  alternatives_korean:
  - 걸쳤습니다
  - 둘렀습니다
  lexicon: HALOT
  rationale: לָבַשׁ의 기본 의미는 옷을 ‘입다/걸치다’이므로, 한국어에서는 자연스럽고 시각적인 ‘입었습니다’로 살려 주어 능동적 이미지가 유지되게 했습니다.
- source_word: וַיִּלְבָּשֵׁנִי
  english_pob_choice: and it clothed me
  chosen_korean: 그것이 나를 입혔습니다
  alternatives_korean:
  - 그것이 나를 덮었습니다
  - 그것이 나를 둘렀습니다
  lexicon: HALOT
  rationale: 동일 어근의 반복으로 ‘제가 입었고, 그것이 저를 입혔다’는 역전된 시적 평행이 생기므로, 직역에 가까운 ‘입혔습니다’를 택해 상호작용의 긴장을 보존했습니다.
- source_word: כִּמְעִיל וְצָנִיף
  english_pob_choice: like a robe and a turban
  chosen_korean: 겉옷 같고, 관을 쓴 것 같았습니다
  alternatives_korean:
  - 로브 같고, 터번 같았습니다
  - 망토 같고, 두건 같았습니다
  lexicon: HALOT
  rationale: מְעִיל은 겉옷/로브 계열의 외투이고, צָנִיף은 감아 두른 머리덮개를 가리키므로, 현대 독자가 위엄의 이미지를 바로 이해하도록 ‘겉옷’과 ‘관을 쓴 것’으로 옮겼습니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 나의 공의
  alternatives_korean:
  - 나의 정의
  - 나의 재판
  lexicon: HALOT
  rationale: מִשְׁפָּט은 판결만이 아니라 공정한 처신과 질서를 포함할 수 있으므로, 첫 행의 ‘의’와 어울리면서도 사회적·공적 성격을 드러내는 ‘공의’로 옮겼습니다.
theological_decisions:
- issue: צֶדֶק과 מִשְׁפָּטִי의 의미 범위 구분
  chosen_reading: 전반부는 내적·도덕적 ‘의’, 후반부는 공적 행위와 판정의 ‘공의’로 구분했습니다.
  alternative_readings:
  - 두 단어를 모두 ‘의’로 번역
  - 두 단어를 모두 ‘정의’로 번역
  rationale: 히브리어의 어휘 차이를 한국어에서 무리 없이 보존하기 위해, 같은 한자어 반복을 피하면서도 시적 병행을 살렸습니다.
  doctrine_reference: 잠 21:3, 사 61:10
