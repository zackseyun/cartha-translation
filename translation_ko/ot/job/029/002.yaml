translation:
  language: ko
  text: 아, 내가 지난 세월처럼, 하나님께서 나를 지켜 주시던 날들처럼 다시 지낼 수 있다면 좋겠습니다![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아, 누가 나를 예전처럼 되게 해 주면 좋겠습니다!’ 히브리어는 문자적으로 ‘누가 나를 [그렇게] 되게 해 주겠습니까?’로 시작하며, 소망을 나타내는 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 보호하시던’ 또는 ‘나를 보살피시던.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  english_pob_choice: Oh, that I were
  chosen_korean: 아, …처럼
  alternatives_korean:
  - 누가 나에게 주면 좋겠습니까
  - 오, 내가 …이었으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적인 ‘누가 나를 주겠습니까?’가 아니라 상실한 상태에 대한 간절한 소망을 나타내므로, 한국어도 감탄과 소망을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: כְיַרְחֵי קֶדֶם
  english_pob_choice: as in months gone by
  chosen_korean: 지난날들처럼
  alternatives_korean:
  - 옛 달들처럼
  - 옛 시절의 달들처럼
  lexicon: HALOT
  rationale: ‘달들’의 비유적 시간표현은 한국어에서 자연스럽지 않아, 회상의 시간감만 살려 ‘지난날들’로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 욥기의 시어인 אֱלוֹהַּ는 여기서 일반적인 ‘하나님’으로 충분히 전달되며, 본문이 특별한 칭호 확장을 요구하지 않습니다.
- source_word: יִשְׁמְרֵנִי
  english_pob_choice: watched over me
  chosen_korean: 저를 지키시던
  alternatives_korean:
  - 저를 지켜 주시던
  - 저를 보호하시던
  - 저를 돌보시던
  lexicon: HALOT
  rationale: שׁמר는 지키다/보호하다의 뜻이지만, 여기서는 과거의 돌보심을 회상하는 문맥이므로 ‘지키시던’이 가장 압축적이고 시적입니다.
theological_decisions:
- issue: 기억 속의 하나님의 돌보심을 어떻게 표현할지
  chosen_reading: ‘하나님이 저를 지키시던 날들’로 옮겨, 과거의 보호와 배려를 함께 드러냈습니다.
  alternative_readings:
  - ‘하나님이 저를 보호하시던 날들’
  - ‘하나님이 저를 지켜 주시던 날들’
  rationale: 본문은 신학적 체계를 설명하기보다 욥의 회고적 탄식을 전하므로, 강한 교리적 해석을 덧붙이지 않고 보호적 돌보심을 담담하게 살렸습니다.
  doctrine_reference: Providence and lament in wisdom literature
