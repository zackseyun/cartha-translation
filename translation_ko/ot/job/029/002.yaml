source:
  edition: WLC
  text: מִֽי יִתְּנֵ֥/נִי כְ/יַרְחֵי קֶ֑דֶם כִּ֝/ימֵ֗י אֱל֣וֹהַּ יִשְׁמְרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
  footnotes:
  - marker: a
    text: Or 'Oh, that someone would grant me to be as in former months.' The Hebrew idiom literally begins, 'Who will give me...?' and expresses a wish.
    reason: lexical_alternative
  - marker: b
    text: Or 'kept me' or 'guarded me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 지난날들처럼, 하나님이 저를 지키시던 날들처럼![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 누군가 나를 옛날처럼 있게 해 주면 좋겠습니다.’ 히브리어 관용구는 문자적으로는 ‘누가 나에게 …를 주겠습니까?’로 시작하지만, 실제로는 소망을 나타냅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘저를 지키셨던’ 혹은 ‘저를 보호하셨던.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  english_pob_choice: Oh, that I were
  chosen_korean: 아, …처럼
  alternatives_korean:
  - 누가 나에게 주면 좋겠습니까
  - 오, 내가 …이었으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적인 ‘누가 나를 주겠습니까?’가 아니라 상실한 상태에 대한 간절한 소망을 나타내므로, 한국어도 감탄과 소망을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: כְיַרְחֵי קֶדֶם
  english_pob_choice: as in months gone by
  chosen_korean: 지난날들처럼
  alternatives_korean:
  - 옛 달들처럼
  - 옛 시절의 달들처럼
  lexicon: HALOT
  rationale: ‘달들’의 비유적 시간표현은 한국어에서 자연스럽지 않아, 회상의 시간감만 살려 ‘지난날들’로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 욥기의 시어인 אֱלוֹהַּ는 여기서 일반적인 ‘하나님’으로 충분히 전달되며, 본문이 특별한 칭호 확장을 요구하지 않습니다.
- source_word: יִשְׁמְרֵנִי
  english_pob_choice: watched over me
  chosen_korean: 저를 지키시던
  alternatives_korean:
  - 저를 지켜 주시던
  - 저를 보호하시던
  - 저를 돌보시던
  lexicon: HALOT
  rationale: שׁמר는 지키다/보호하다의 뜻이지만, 여기서는 과거의 돌보심을 회상하는 문맥이므로 ‘지키시던’이 가장 압축적이고 시적입니다.
theological_decisions:
- issue: 기억 속의 하나님의 돌보심을 어떻게 표현할지
  chosen_reading: ‘하나님이 저를 지키시던 날들’로 옮겨, 과거의 보호와 배려를 함께 드러냈습니다.
  alternative_readings:
  - ‘하나님이 저를 보호하시던 날들’
  - ‘하나님이 저를 지켜 주시던 날들’
  rationale: 본문은 신학적 체계를 설명하기보다 욥의 회고적 탄식을 전하므로, 강한 교리적 해석을 덧붙이지 않고 보호적 돌보심을 담담하게 살렸습니다.
  doctrine_reference: Providence and lament in wisdom literature
