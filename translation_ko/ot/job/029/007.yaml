translation:
  language: ko
  text: 내가 성읍의 성문으로 나가[a] 광장에[b] 내 자리를 마련하던 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘성읍에/곁에 있는 문’입니다. 이 문은 고대 도시에서 재판과 공적 논의가 이루어지던 장소이기도 했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광장’은 히브리어 רחוב을 옮긴 말입니다. 이는 좁은 길이라기보다 넓은 공공 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאתִי
  english_pob_choice: When I went out
  chosen_korean: 내가 성문으로 나갈 때에
  alternatives_korean:
  - 내가 나갈 때에
  - 내가 밖으로 나갈 때에
  lexicon: HALOT
  rationale: בְּ + יצא의 부정사구는 시간 부사절로 읽히므로, 자연스러운 한국어로 ‘~할 때에’로 옮기고, 문맥상 출입의 목적지인 성문을 드러냈습니다.
- source_word: שַׁעַר
  english_pob_choice: the gate
  chosen_korean: 성문
  alternatives_korean:
  - 문
  - 도성의 문
  lexicon: HALOT
  rationale: 고대 도시의 שער는 단순한 문이 아니라 공적 재판과 회합의 장소이므로, 한국어에서 그 기능을 드러내는 ‘성문’이 가장 적절합니다.
- source_word: בָּרְחוֹב
  english_pob_choice: in the square
  chosen_korean: 광장에
  alternatives_korean:
  - 거리에서
  - 빈터에
  lexicon: HALOT
  rationale: רחוב은 좁은 도로보다 넓은 공개 장소를 가리키므로, 현대 한국어의 공적 공간 감각을 살리는 ‘광장’으로 옮겼습니다.
- source_word: מוֹשָׁבִי
  english_pob_choice: my seat
  chosen_korean: 내 자리
  alternatives_korean:
  - 내 좌석
  - 내 앉을 자리
  lexicon: HALOT
  rationale: 문맥상 거주지가 아니라 공적 자리에 앉는 뜻이므로, 간결하면서도 위엄 있는 ‘내 자리’로 번역했습니다.
