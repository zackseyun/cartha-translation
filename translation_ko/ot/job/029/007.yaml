  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/צֵ֣אתִ/י שַׁ֣עַר עֲלֵי קָ֑רֶת בָּ֝/רְח֗וֹב אָכִ֥ין מוֹשָׁבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/007.yaml
  text: When I went out to the gate by the city[a], when I prepared my seat in the square[b],
  footnotes:
  - marker: a
    text: Or 'the city gate'; the Hebrew says literally 'the gate' and then adds a phrase relating it to 'the city.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the street' or 'in the open place'; the term refers to a broad public area, not necessarily a narrow roadway.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 성문으로 나갈 때에, 내가 광장에 내 자리를 마련할 때였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 히브리어의 פשוט한 ‘문’보다, 고대 근동에서 재판과 공적 논의가 이루어지던 도시의 관문을 드러냅니다.
    reason: cultural_note
  - marker: b
    text: ‘광장’은 רחוב의 의미를 반영한 것으로, 좁은 ‘거리’보다 넓은 공개 공간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאתִי
  english_pob_choice: When I went out
  chosen_korean: 내가 성문으로 나갈 때에
  alternatives_korean:
  - 내가 나갈 때에
  - 내가 밖으로 나갈 때에
  lexicon: HALOT
  rationale: בְּ + יצא의 부정사구는 시간 부사절로 읽히므로, 자연스러운 한국어로 ‘~할 때에’로 옮기고, 문맥상 출입의 목적지인 성문을 드러냈습니다.
- source_word: שַׁעַר
  english_pob_choice: the gate
  chosen_korean: 성문
  alternatives_korean:
  - 문
  - 도성의 문
  lexicon: HALOT
  rationale: 고대 도시의 שער는 단순한 문이 아니라 공적 재판과 회합의 장소이므로, 한국어에서 그 기능을 드러내는 ‘성문’이 가장 적절합니다.
- source_word: בָּרְחוֹב
  english_pob_choice: in the square
  chosen_korean: 광장에
  alternatives_korean:
  - 거리에서
  - 빈터에
  lexicon: HALOT
  rationale: רחוב은 좁은 도로보다 넓은 공개 장소를 가리키므로, 현대 한국어의 공적 공간 감각을 살리는 ‘광장’으로 옮겼습니다.
- source_word: מוֹשָׁבִי
  english_pob_choice: my seat
  chosen_korean: 내 자리
  alternatives_korean:
  - 내 좌석
  - 내 앉을 자리
  lexicon: HALOT
  rationale: 문맥상 거주지가 아니라 공적 자리에 앉는 뜻이므로, 간결하면서도 위엄 있는 ‘내 자리’로 번역했습니다.
