  text: וְ/יִֽחֲל֣וּ כַ/מָּטָ֣ר לִ֑/י וּ֝/פִי/הֶ֗ם פָּעֲר֥וּ לְ/מַלְקֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
  footnotes:
  - marker: a
    text: Or 'for the latter rain' or 'for the late rain.' The Hebrew מַלְקוֹשׁ refers to the late seasonal rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 비를 기다리듯 저를 기다렸고, 봄비를 기다리듯 입을 크게 벌렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַלְקוֹשׁ는 계절상 늦은 비를 가리키며, 한국어로는 문맥상 ‘봄비’로 풀어 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  english_pob_choice: they waited
  chosen_korean: 기다렸고
  alternatives_korean:
  - 기대했고
  - 바랐고
  - 간절히 기다렸고
  lexicon: HALOT
  rationale: יָחַל의 기대 섞인 ‘기다리다’라는 뜻을 살려, 단순 시간 경과가 아니라 기대를 품은 기다림으로 읽히는 문맥을 반영했습니다.
- source_word: כַמָּטָר
  english_pob_choice: as for the rain
  chosen_korean: 비를 기다리듯이
  alternatives_korean:
  - 비처럼
  - 비처럼 여기며
  - 비를 바라는 듯이
  lexicon: HALOT
  rationale: 히브리어의 비교구문을 한국어에서는 자연스럽게 ‘-듯이’로 옮겨, 비를 애타게 기다리는 비유를 살렸습니다.
- source_word: לְמַלְקוֹשׁ
  english_pob_choice: for the spring rain
  chosen_korean: 봄비
  alternatives_korean:
  - 이른비
  - 늦은비
  - 가을비
  lexicon: HALOT
  rationale: מַלְקוֹשׁ는 늦은 계절비를 가리키며 팔레스타인 농경 맥락에서는 봄비로 이해될 수 있으므로, 현대 독자에게 의미가 분명한 ‘봄비’로 옮겼습니다.
theological_decisions:
- issue: 시적 과장 표현의 보존
  chosen_reading: ‘입을 크게 벌렸습니다’로 직역에 가깝게 유지해, 간절히 기다리는 생생한 이미지를 살렸습니다.
  alternative_readings:
  - ‘입을 벌렸습니다’
  - ‘입을 크게 벌려 기다렸습니다’
  rationale: פעלרו의 ‘크게 벌리다’는 시각적·정서적 강도를 담고 있어, 완화하지 않고 유지하는 편이 원문의 힘에 가깝습니다.
  doctrine_reference: 문학적 충실성 원칙
- issue: ‘저를 기다렸고’의 인칭 유지
  chosen_reading: 대상을 ‘저를’로 직접 살려, 욥 자신에게 향한 기대를 분명히 했습니다.
  alternative_readings:
  - ‘제 말을 기다렸고’
  - ‘제 충고를 기다렸고’
  rationale: 히브리어는 פשוט히 ‘나/저를’이라 말하므로, 해석적 확장을 본문에 미리 넣지 않고 문맥이 암시하는 바를 유지했습니다.
  doctrine_reference: 본문 우선 원칙
