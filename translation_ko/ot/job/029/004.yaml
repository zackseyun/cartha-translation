  - severity: medium
    issue: ‘친밀한 의논’이 어색하고 의미를 오도할 수 있습니다.
    rationale: 소드는 은밀한 조언, 비밀, 친밀한 교제의 의미 영역을 가지지만, 한국어 ‘친밀한 의논’은 통상적인 표현이 아니며 하나님이 참여하는 상호 토의로 들릴 수 있습니다.
