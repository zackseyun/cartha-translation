  text: כַּ/אֲשֶׁ֣ר הָ֭יִיתִי בִּ/ימֵ֣י חָרְפִּ֑/י בְּ/ס֥וֹד אֱ֝ל֗וֹהַּ עֲלֵ֣י אָהֳלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/004.yaml
  text: as I was in the days of my prime[a], when God's intimate counsel was over my tent[b],
  footnotes:
  - marker: a
    text: Or 'in the days of my autumn,' that is, the season of full maturity or flourishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'when the secret counsel of God was over my tent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 전성기의 날들에 있었던 때처럼, 하나님의 친밀한 의논이 내 장막 위에 있었을 때였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가을의 날들’, 곧 온전히 무르익은 성숙이나 번영의 시기.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 비밀한 의논이 내 장막 위에 있었을 때’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר / as I was
  english_pob_choice: as I was
  chosen_korean: 내가 … 있었던 때처럼
  alternatives_korean:
  - 내가 … 있었던 것처럼
  - …하던 때처럼
  lexicon: HALOT
  rationale: 회상하는 비교절의 성격을 살리면서, 한국어에서는 ‘때처럼’이 문장 흐름을 가장 자연스럽게 유지합니다.
- source_word: חָרְפִּי
  english_pob_choice: my prime
  chosen_korean: 내 전성기
  alternatives_korean:
  - 내 청춘
  - 내 가을
  - 내 성숙의 때
  lexicon: HALOT
  rationale: 문맥상 단순한 연령보다 ‘한창 잘나가던 시기, 절정기’의 의미가 적절하므로 ‘전성기’로 옮겼습니다.
- source_word: בְּסוֹד אֱלוֹהַּ
  english_pob_choice: God's intimate counsel
  chosen_korean: 하나님의 친밀한 의논
  alternatives_korean:
  - 하나님의 비밀한 의논
  - 하나님의 친밀한 교제
  - 하나님의 속삭이는 뜻
  lexicon: HALOT
  rationale: סוֹד의 핵심인 ‘비밀스러운/친밀한 의논, 내밀한 관계’를 살리되, 영어 POB의 ‘intimate counsel’에 맞춰 ‘친밀한 의논’으로 직역과 의미를 함께 반영했습니다.
- source_word: עֲלֵי אָהֳלִי
  english_pob_choice: was over my tent
  chosen_korean: 내 장막 위에
  alternatives_korean:
  - 내 장막에
  - 내 집 위에
  - 내 거처 위에
  lexicon: HALOT
  rationale: ‘over’의 덮임/임재 이미지를 보존하면서, אָהֳלִי의 구체적 이미지는 ‘장막’으로 유지했습니다.
theological_decisions:
- issue: בְּסוֹד אֱלוֹהַּ의 신학적 뉘앙스
  chosen_reading: 하나님의 친밀한 의논이 내 장막 위에 있었다는 표현으로, 하나님의 가까운 호의와 보호를 드러내되 계시 용어로 지나치게 한정하지 않습니다.
  alternative_readings:
  - 하나님의 비밀이 내 장막 위에 있었다
  - 하나님의 친구 됨이 내 장막 위에 있었다
  rationale: 히브리어는 비밀한 친밀성, 신뢰, 호의를 모두 함축하므로, 특정 교리적 범주로 좁히지 않고 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3
