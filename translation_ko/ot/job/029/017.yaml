  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: ko
  text: 나는 악한 자의 송곳니를 부러뜨렸고, 그의 이빨에서 먹잇감을 던져 버렸습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘먹잇감’은 히브리어 טָרֶף의 사냥·포식 이미지를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתַלְּע֣וֹת עַוָּ֑ל
  english_pob_choice: the fangs of the unrighteous
  chosen_korean: “악한 자의 송곳니”
  alternatives_korean:
  - “불의한 자의 송곳니”
  - “악인의 송곳니”
  lexicon: מְתַלְּעוֹת / עַוָּל
  rationale: 문맥상 비유적 가해 능력을 가리키므로 직역에 가깝게 ‘송곳니’를 유지했고, עַוָּל은 도덕적 악함을 드러내는 ‘악한 자’로 옮겼습니다.
- source_word: וּמִשִּׁנָּיו
  english_pob_choice: from his teeth
  chosen_korean: “그의 이빨에서”
  alternatives_korean:
  - “그의 이에서”
  - “그의 이빨들에서”
  lexicon: שֵׁן
  rationale: 히브리어 복수형을 한국어에서는 자연스럽게 ‘이빨’로 옮겨, 가해의 수단이었던 ‘이’의 이미지를 보존했습니다.
- source_word: אַשְׁלִיךְ טָרֶף
  english_pob_choice: I threw the prey
  chosen_korean: “먹잇감을 던져 버렸습니다”
  alternatives_korean:
  - “먹이를 던졌습니다”
  - “노획물을 내던졌습니다”
  lexicon: טָרֶף
  rationale: טָרֶף는 사냥감/먹잇감의 뜻이므로 ‘먹잇감’이 이미지와 의미를 함께 살리고, אַשְׁלִיךְ는 단순 투척보다 강한 폐기감을 살려 ‘던져 버렸습니다’로 옮겼습니다.
theological_decisions:
- issue: 의인의 강한 역전 이미지
  chosen_reading: 의인이 악한 자를 물리쳐 약탈을 중단시키는 과거 행위로 읽었습니다.
  alternative_readings:
  - 일반적인 도덕 교훈으로 완화하는 읽기
  - 비유를 약화해 단순한 승리 묘사로 읽기
  rationale: 문장은 폭력적 상징을 통해 악의 착취를 제압한 경험을 증언하므로, 심상을 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: 지혜문학의 시적 과장과 의인화
