  naturalness: ‘저의 조언 앞에서 잠잠했습니다’도 문법적으로 가능하지만, 현대 표준어에서는 다소 번역투이며 ‘조언 앞에서’가 무엇을 뜻하는지 불분명할 수 있습니다. ‘내 조언을 기다리며 잠잠히 있었습니다’는 문맥과 한국어 관용에 더 자연스럽습니다.
