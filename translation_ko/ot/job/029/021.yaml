  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִֽ/י שָׁמְע֥וּ וְ/יִחֵ֑לּוּ וְ֝/יִדְּמ֗וּ לְמ֣וֹ עֲצָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
  footnotes:
  - marker: a
    text: Or 'They listened to me and waited in expectation.' The verb can also carry the nuance of hoping or expecting.
    reason: lexical_alternative
  - marker: b
    text: Or 'they were silent at my counsel.' The final phrase may express silence in response to Job's counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 저에게 귀를 기울이고 기다렸으며, 저의 조언 앞에서 잠잠했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기다렸으며’는 여기서 기대를 품고 기다리는 뉘앙스까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잠잠했습니다’는 ‘침묵했습니다’ 또는 ‘가만히 있었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  english_pob_choice: listened
  chosen_korean: 귀를 기울이고
  alternatives_korean:
  - 들었고
  - 경청했고
  lexicon: HALOT
  rationale: 단순한 청각적 '듣다'보다 발언을 받아들이는 태도를 드러내야 하므로, 문맥에 맞게 '귀를 기울이다'로 옮겼습니다.
- source_word: וְיִחֵלּוּ
  english_pob_choice: waited
  chosen_korean: 기다렸으며
  alternatives_korean:
  - 기대하며 기다렸으며
  - 소망하며 기다렸으며
  - 기다리며
  lexicon: HALOT
  rationale: 본문의 기다림은 직역상 '기다리다'가 가장 자연스럽고, 기대의 뉘앙스는 문맥상 충분히 내포되므로 본문에는 기본 의미를 유지했습니다.
- source_word: וְיִדְּמוּ
  english_pob_choice: kept silent
  chosen_korean: 잠잠했습니다
  alternatives_korean:
  - 침묵했습니다
  - 말을 멈췄습니다
  - 가만히 있었습니다
  lexicon: HALOT
  rationale: דמם의 정지·침묵 의미를 한국어에서 격조 있게 살리기 위해 '잠잠하다'를 택했고, 회중의 경청 상황에도 어울립니다.
- source_word: לְמוֹ עֲצָתִי
  english_pob_choice: for my counsel
  chosen_korean: 저의 조언 앞에서
  alternatives_korean:
  - 저의 조언에
  - 저의 조언을 위해
  - 저의 조언으로
  lexicon: HALOT
  rationale: לְמוֹ는 여기서 단순 목적어보다 '…앞에서/…에 대하여'의 관계를 띠므로, 조언에 대한 경외 섞인 침묵을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 욥의 말에 대한 사람들의 반응을 어떻게 표상할지
  chosen_reading: 단순 정보 전달보다 존중과 경청의 태도가 드러나도록 '귀를 기울이고 기다렸으며… 잠잠했습니다'로 옮겼습니다.
  alternative_readings:
  - '''들었고 기다렸으며… 침묵했습니다'''
  - '''경청했고 기대하며… 말을 아꼈습니다'''
  rationale: 본문은 욥의 지혜/조언이 사람들로 하여금 숙연한 침묵을 낳는 장면이므로, 한국어에서도 그 위상을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 지혜 문맥에서의 존중과 질서 있는 침묵
