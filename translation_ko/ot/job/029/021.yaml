  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
  footnotes:
  - marker: a
    text: Or 'They listened to me and waited in expectation.' The verb can also carry the nuance of hoping or expecting.
    reason: lexical_alternative
  - marker: b
    text: Or 'they were silent at my counsel.' The final phrase may express silence in response to Job's counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내게 귀를 기울여 내 조언을 기다렸으며[a], 내 조언을 기다리며 잠잠히 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기다렸으며’는 여기서 기대를 품고 기다리는 뉘앙스까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잠잠히 있었습니다’는 ‘침묵했습니다’ 또는 ‘가만히 있었습니다’로도 옮길 수 있습니다. 마지막 표현은 내 조언을 기다리며 침묵한 상황을 나타낼 수 있습니다.
    reason: lexical_alternative
