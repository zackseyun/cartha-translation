  lexicon: HALOT
  rationale: לְמוֹ는 여기서 단순 목적어보다 '…앞에서/…에 대하여'의 관계를 띠므로, 조언에 대한 경외 섞인 침묵을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 욥의 말에 대한 사람들의 반응을 어떻게 표상할지
  chosen_reading: 단순 정보 전달보다 존중과 경청의 태도가 드러나도록 '귀를 기울이고 기다렸으며… 잠잠했습니다'로 옮겼습니다.
  alternative_readings:
  - '''들었고 기다렸으며… 침묵했습니다'''
  - '''경청했고 기대하며… 말을 아꼈습니다'''
  rationale: 본문은 욥의 지혜/조언이 사람들로 하여금 숙연한 침묵을 낳는 장면이므로, 한국어에서도 그 위상을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 지혜 문맥에서의 존중과 질서 있는 침묵
