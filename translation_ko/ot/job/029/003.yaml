  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הִלּ֣/וֹ נֵ֭ר/וֹ עֲלֵ֣י רֹאשִׁ֑/י לְ֝/אוֹר/וֹ אֵ֣לֶךְ חֹֽשֶׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/003.yaml
  text: when his lamp shone above my head[a], and by his light I walked through darkness.
  footnotes:
  - marker: a
    text: Or 'by its light I walked in darkness.' The Hebrew suffix in 'by his/its light' may be taken as referring either to God in context or more immediately to the lamp.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 등불이 내 머리 위에 비칠 때, 나는 그의 빛으로 어둠을 걸어다녔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의’는 문맥상 하나님을 가리킬 수도 있고, 바로 앞의 등불을 가리키는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ
  english_pob_choice: when his lamp shone
  chosen_korean: 그의 등불이 비칠 때
  alternatives_korean:
  - 그가 비추실 때
  - 그의 비침 가운데
  lexicon: HALOT
  rationale: ב + להל/הלל의 형태가 회상적 시간 표현으로 기능하므로 ‘-할 때’로 옮겼고, 이어지는 נֵרוֹ와 연결해 자연스럽게 ‘등불이 비칠 때’로 풀었습니다.
- source_word: נֵרוֹ
  english_pob_choice: his lamp
  chosen_korean: 그의 등불
  alternatives_korean:
  - 그의 빛
  - 그의 등
  lexicon: HALOT
  rationale: נֵר는 추상적 ‘빛’보다 구체적 ‘등불’이므로 이미지의 물성을 살려 옮겼습니다.
- source_word: לְאוֹרוֹ
  english_pob_choice: by his light
  chosen_korean: 그의 빛으로
  alternatives_korean:
  - 그의 빛 가운데
  - 그 빛에 의해
  lexicon: HALOT
  rationale: ל의 수단·동반 의미를 살려 ‘-으로’로 옮겼고, 뒤의 ‘어둠을 걷다’와 자연스럽게 이어지도록 했습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: through darkness
  chosen_korean: 어둠을
  alternatives_korean:
  - 어둠 속을
  - 어둠 가운데
  lexicon: HALOT
  rationale: 히브리어의 이동 동사를 한국어에서도 살려 ‘어둠을 걸어다녔습니다’로 옮기면, ‘darkness’를 통과하는 대비가 유지됩니다.
theological_decisions:
- issue: 대명사 소유격의 지시 대상
  chosen_reading: ‘그의’는 본문 맥락상 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 가까운 선행사인 등불 자체를 가리켜 ‘그 빛으로’처럼 비인칭으로 읽을 수도 있습니다.
  rationale: 29장 전체가 하나님이 베푸신 보호와 인도하심을 회상하는 문맥이므로, 인격적 관계를 살려 소유 대명사를 그대로 반영했습니다.
  doctrine_reference: 문맥에 따른 지시 대상 판단
- issue: 빛과 어둠의 대비
  chosen_reading: 하나님의 빛 아래서 어둠을 걷던 과거의 보호와 인도를 강조했습니다.
  alternative_readings:
  - 단순한 시각적 상황 묘사로만 읽을 수도 있습니다.
  rationale: 이 절은 단순한 조명 묘사라기보다, 욥이 기억하는 하나님의 돌보심을 상징적으로 드러내는 표현이므로 그 신학적 뉘앙스를 보존했습니다.
  doctrine_reference: 섭리와 인도
