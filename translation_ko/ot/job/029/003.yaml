  source_fidelity: 첫 절반의 ‘그의 등불이 … 비칠 때’는 히브리어의 등불 이미지를 잘 보존합니다. 그러나 ‘어둠을 걸어다녔습니다’는 אֵלֶךְ의 회상적 단회/관습적 ‘걸었습니다’보다 배회·반복의 뜻을 더하며, ‘through darkness’의 이동 경로도 다소 부자연스럽게 처리합니다. ‘어둠 속을 걸었습니다’가 원문의 의미와 한국어 용법을 더 충실히 반영합니다.
  naturalness: ‘어둠을 걸어다녔습니다’는 현대 표준어에서 어색하고 ‘이리저리 돌아다니다’라는 뉘앙스를 낼 수 있습니다. ‘그의 빛을 따라 어둠 속을 걸었습니다’는 시적이면서도 자연스럽고, 빛의 인도 아래 걷는 이미지를 유지합니다.
  terminology: ‘등불’은 נֵר의 구체적 이미지를 적절히 살립니다. ‘빛’은 אוֹר에 알맞습니다. 각주에서는 첫 번째 소유 표현까지 등불을 가리킬 수 있는 것처럼 포괄적으로 말하지 않고, 논점이 되는 두 번째 ‘그의 빛’의 지시 대상만 한정하여 밝혀야 합니다.
