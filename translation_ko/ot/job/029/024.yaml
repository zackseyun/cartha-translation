id: JOB.29.24
reference: Job 29:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶשְׂחַ֣ק אֲ֭לֵ/הֶם לֹ֣א יַאֲמִ֑ינוּ וְ/א֥וֹר פָּ֝נַ֗/י לֹ֣א יַפִּילֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
  footnotes:
  - marker: a
    text: Or, 'I laughed at them, and they did not believe it'; the Hebrew may express astonishment at Job's condescension or favor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the light of my face,' an idiom for a bright or favorable expression.
    reason: cultural_note
  - marker: c
    text: Or 'cast down the light of my face'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그들에게 미소를 지었을 때, 그들은 그것을 믿지 않았고[a], 내 얼굴의 빛을 흐리게 하지 않았습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그들은 믿지 않았다”입니다. 문맥상 욥의 호의에 사람들이 놀라 쉽게 믿기 어려워했다는 뉘앙스로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 “내 얼굴의 빛”은 밝고 호의적인 표정을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 “그들은 내 얼굴의 빛을 떨어뜨리지 않았다”입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אֶשְׂחַק
  english_pob_choice: I smiled
  chosen_korean: 미소 지으면
  alternatives_korean:
  - 웃으면
  - 웃었습니다
  - 비웃으면
  lexicon: HALOT
  rationale: שׂחק는 여기서 조롱이 아니라 호의적 반응을 가리키므로, 한국어에서는 강한 ‘웃다’보다 ‘미소 짓다’가 정서와 격을 더 잘 살립니다.
- source_word: אֲלֵהֶם
  english_pob_choice: at them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들 앞에서
  - 그들을 향해
  lexicon: HALOT
  rationale: אֶל은 이 동사와 함께 대상을 향한 움직임을 나타내므로, 한국어에서는 자연스러운 방향 표현인 ‘그들에게’로 옮겼습니다.
- source_word: וְאוֹר פָּנַי
  english_pob_choice: the light of my face
  chosen_korean: 내 얼굴의 빛
  alternatives_korean:
  - 내 얼굴의 밝음
  - 내 낯빛
  - 내 환한 얼굴
  lexicon: HALOT
  rationale: 직역에 가까운 ‘얼굴의 빛’을 살려 히브리어 관용구의 이미지를 보존했고, 도덕적·정서적 호의의 뉘앙스를 흐리지 않도록 했습니다.
- source_word: לֹא יַפִּילוּן
  english_pob_choice: they did not cast down
  chosen_korean: 어둡게 하지 않았습니다
  alternatives_korean:
  - 떨어뜨리지 않았습니다
  - 낮추지 않았습니다
  - 가라앉히지 않았습니다
  lexicon: HALOT
  rationale: נפל의 사역형을 문자적으로 ‘떨어뜨리다’로 옮기면 한국어에서 어색하므로, POB의 관찰대로 얼굴의 빛이 꺼지거나 흐려지는 의미를 살려 ‘어둡게 하지 않았다’로 자연화했습니다.
theological_decisions:
- issue: ‘믿지 못했습니다’의 뉘앙스
  chosen_reading: 여기서는 진리 부정이 아니라, 예상 밖의 호의에 대한 놀람과 받아들이기 어려움을 표현하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 불신
  - 의심
  - 믿지 않았다
  rationale: 문맥상 Job의 태도에 대한 놀라움이 핵심이므로, 의미를 좁히지 않고 현대 한국어의 자연스러운 반응 표현으로 옮겼습니다.
  doctrine_reference: 문맥 중심의 서술적 번역 원칙
- issue: ‘내 얼굴의 빛’의 이미지 보존
  chosen_reading: 직접적인 관용 설명보다 이미지 보존을 우선해, 얼굴의 밝음이 흐려지지 않았다는 뜻을 남겼습니다.
  alternative_readings:
  - 내 환한 얼굴
  - 내 기분 좋은 표정
  - 내 낯빛이 흐려지지 않았다
  rationale: 히브리어 관용구의 시적 힘을 유지하면서도 한국어 독자가 의미를 따라갈 수 있도록 했습니다.
  doctrine_reference: 시적 이미지 보존 원칙
