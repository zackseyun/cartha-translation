id: JOB.29.22
reference: Job 29:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרֵ֣י דְ֭בָרִ/י לֹ֣א יִשְׁנ֑וּ וְ֝/עָלֵ֗י/מוֹ תִּטֹּ֥ף מִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/022.yaml
  text: After my words they did not speak again[b][a], and my word dripped upon them.
  footnotes:
  - marker: a
    text: Or 'they did not answer again'; the Hebrew verb can suggest not repeating or not responding after Job had spoken.
    reason: lexical_alternative
  - marker: b
    text: Literally 'my word dripped upon them,' a poetic image for speech falling gently yet authoritatively on listeners.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 말들 뒤에는 그들이 다시 말하지 않았고, 내 말은 그들 위에 똑똑 떨어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시 말하지 않았다’는 뜻으로 옮겼지만, 히브리어 동사는 ‘되풀이하지 않았다’ 또는 ‘응답하지 않았다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 말이 그들 위에 떨어졌다/방울졌다’라는 시적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  english_pob_choice: After my words
  chosen_korean: 내 말들 뒤에는
  alternatives_korean:
  - 내 말들 후에
  - 내 말들 뒤로
  lexicon: HALOT
  rationale: אַחֲרֵי는 시간상 ‘~뒤에’를 뜻하고, דְבָרִי는 복수형 ‘my words’이므로 한국어도 복수성을 살려 ‘내 말들 뒤에는’으로 옮겼습니다.
- source_word: לֹא יִשְׁנוּ
  english_pob_choice: they did not speak again
  chosen_korean: 그들이 다시 말하지 않았고
  alternatives_korean:
  - 그들이 다시 대답하지 않았고
  - 그들이 반복해 말하지 않았고
  lexicon: HALOT
  rationale: שנה는 반복/되풀이의 뜻을 가질 수 있지만, 문맥상 욥의 말을 들은 뒤 더 이상 응답하지 않았다는 의미가 자연스러워 ‘다시 말하지 않았다’로 표현했습니다.
- source_word: תִּטֹּף מִלָּתִי
  english_pob_choice: my word dripped upon them
  chosen_korean: 내 말은 그들 위에 똑똑 떨어졌습니다
  alternatives_korean:
  - 내 말은 그들 위에 떨어졌습니다
  - 내 말은 그들 위에 스며들었습니다
  lexicon: HALOT
  rationale: נטף의 핵심 이미지는 ‘방울져 떨어짐’이므로, 한국어에서도 시적 이미지를 살려 ‘똑똑 떨어졌습니다’로 번역했습니다. מִלָּתִי는 단수 ‘내 말/내 말 한마디’에 해당하지만, 앞의 ‘말들’과의 대비를 살리기 위해 ‘내 말’로 받았습니다.
