base_translation:
  language: en
  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
  footnotes:
  - marker: a
    text: Or 'hid themselves'; the Hebrew verb can mean to conceal oneself, here likely expressing deferential withdrawal in Job's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은이들은 저를 보고 물러났고, 늙은이들은 일어나 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨었습니다’. 히브리어 동사는 ‘숨다’라는 뜻도 있지만, 여기서는 욥 앞에서 예를 갖추어 물러난 뉘앙스일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרִים
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 젊은 남자들
  - 청년들
  lexicon: HALOT
  rationale: 남성 복수의 연령층을 가리키지만, 한국어에서는 직역형인 ‘젊은 남자들’보다 자연스럽고 품위 있는 ‘젊은이들’이 시적 문맥에 잘 맞습니다.
- source_word: וְנֶחְבָּאוּ
  english_pob_choice: withdrew
  chosen_korean: 물러났고
  alternatives_korean:
  - 숨었고
  - 몸을 숨겼고
  - 물러섰고
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로는 ‘숨다’이지만, 존경과 위축의 사회적 뉘앙스가 있어 ‘물러나다’가 그 의미를 자연스럽게 드러냅니다.
- source_word: וִישִׁישִׁים
  english_pob_choice: the aged
  chosen_korean: 늙은이들
  alternatives_korean:
  - 연로한 이들
  - 노인들
  - 장로들
  lexicon: HALOT
  rationale: 나이 든 사람들을 뜻하며, ‘장로들’은 직분 오해를 부를 수 있어 피했습니다. 시적 대비를 살리면서도 현대 한국어로 무난한 표현을 택했습니다.
- source_word: קָמוּ עָמָדוּ
  english_pob_choice: rose and stood
  chosen_korean: 일어나 서 있었습니다
  alternatives_korean:
  - 일어나 섰습니다
  - 일어나서 섰습니다
  - 일어나 서 있었습니다
  lexicon: HALOT
  rationale: 두 동작을 모두 살려 존경의 행동이 단계적으로 나타나도록 했습니다. 한국어에서는 ‘일어나 서 있었습니다’가 간결하면서도 원문의 반복 효과를 유지합니다.
theological_decisions:
- issue: 연장자들의 행동을 단순한 신체 동작이 아니라 존경의 표시로 옮길지 여부
  chosen_reading: ‘물러났고… 일어나 서 있었습니다’로 번역해, 욥 앞에서의 경외와 예우가 드러나게 했습니다.
  alternative_readings:
  - 그냥 숨었습니다
  - 그냥 일어섰습니다
  rationale: 문맥상 단순한 움직임보다 사회적 위계와 존중의 반응이 핵심이므로, 원문의 함의를 살리는 방향이 적절합니다.
  doctrine_reference: 고대 지중해 명예-수치 문화의 화행적 의미
