  chosen_korean: 일어나 서 있었습니다
  alternatives_korean:
  - 일어나 섰습니다
  - 일어나서 섰습니다
  - 일어나 서 있었습니다
  lexicon: HALOT
  rationale: 두 동작을 모두 살려 존경의 행동이 단계적으로 나타나도록 했습니다. 한국어에서는 ‘일어나 서 있었습니다’가 간결하면서도 원문의 반복 효과를 유지합니다.
theological_decisions:
- issue: 연장자들의 행동을 단순한 신체 동작이 아니라 존경의 표시로 옮길지 여부
  chosen_reading: ‘물러났고… 일어나 서 있었습니다’로 번역해, 욥 앞에서의 경외와 예우가 드러나게 했습니다.
  alternative_readings:
  - 그냥 숨었습니다
  - 그냥 일어섰습니다
  rationale: 문맥상 단순한 움직임보다 사회적 위계와 존중의 반응이 핵심이므로, 원문의 함의를 살리는 방향이 적절합니다.
  doctrine_reference: 고대 지중해 명예-수치 문화의 화행적 의미
