translation:
  language: ko
  text: 고관들은 말을 삼가고, 자기 입에 손바닥을 대었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרִים
  english_pob_choice: Princes
  chosen_korean: 고관들
  alternatives_korean:
  - 귀족들
  - 지도자들
  - 제후들
  lexicon: HALOT
  rationale: שָׂרִים은 고위 지위의 사람들을 가리키므로, 한국어에서는 신분과 위엄을 드러내면서도 과도하게 왕족화하지 않는 ‘고관들’이 문맥에 적합합니다.
- source_word: עָצְרוּ בְמִלִּים
  english_pob_choice: held back their words
  chosen_korean: 말을 삼가고
  alternatives_korean:
  - 말을 억제하고
  - 말을 참아 두고
  - 말을 자제하고
  lexicon: HALOT
  rationale: 동사 עצר는 여기서 발화를 억누르거나 멈추게 하는 뜻이므로, 한국어에서는 관용적으로 자연스럽고 문맥에 맞는 ‘말을 삼가고’로 옮겼습니다.
- source_word: כַף יָשִׂימוּ לְפִיהֶם
  english_pob_choice: put their hand over their mouth
  chosen_korean: 자기 입에 손바닥을 대었습니다
  alternatives_korean:
  - 입을 손으로 가렸습니다
  - 입 위에 손을 얹었습니다
  - 입에 손을 가져다 댔습니다
  lexicon: HALOT
  rationale: כַף는 손바닥/손을 가리키며, פה에 손을 대는 몸짓은 침묵과 경외의 관용구이므로, 동작을 그대로 살리되 한국어로는 ‘손바닥을 대었습니다’가 가장 분명합니다.
theological_decisions:
- issue: 시적 평행법에서 사회적 위엄과 자기 절제가 함께 표현되는지 여부
  chosen_reading: ‘고관들’과 ‘말을 삼가고’의 조합으로, 높은 신분의 사람들이 욥 앞에서 자발적으로 침묵하던 위엄과 경의를 함께 드러냈습니다.
  alternative_readings:
  - ‘귀족들’로 더 문자적으로 옮길 수 있음
  - ‘말을 억제하고’처럼 더 직역할 수 있음
  rationale: 이 절은 욥의 이전 명성을 묘사하는 시적 진술이므로, 과장 없이도 장중한 분위기를 살리는 표현이 적합합니다.
  doctrine_reference: 욥기 29장의 기억 회상과 지혜시적 화법
