base_translation:
  language: en
  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
  footnotes:
  - marker: a
    text: Or possibly, 'and I will multiply my days like the phoenix.' The Hebrew word translated 'sand' has been understood by some as a bird name here, but 'sand' is the more likely sense in context and fits the common biblical image of great number.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 나는 말했습니다[a]. “나는 내 보금자리에서 죽고, 내 날들을 모래처럼 많게 하리라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불사조처럼 내 날들을 많게 하리라”로 번역할 수 있습니다. 여기서 ‘모래’로 옮긴 히브리어는 일부 해석자들에게 새의 이름으로 이해되기도 합니다. 그러나 문맥상 ‘모래’가 더 가능성이 높으며, 이는 매우 많은 수를 나타내는 성경의 익숙한 이미지와도 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 나는 말했습니다
  alternatives_korean:
  - 그리고 나는 말했습니다
  - 나는 말했습니다
  lexicon: WLC
  rationale: 와우-연속으로 이어지는 회상의 흐름을 한국어에서는 ‘그때’로 자연스럽게 살리고, 평서 서술에 맞는 합쇼체로 옮겼습니다.
- source_word: קִנִּי
  english_pob_choice: my nest
  chosen_korean: 내 보금자리
  alternatives_korean:
  - 내 둥지
  - 내 집
  lexicon: HALOT
  rationale: 직역하면 ‘둥지’이지만, 한국어에서는 사람이 사는 안전한 거처의 시적 이미지를 살리는 ‘보금자리’가 가장 자연스럽습니다.
- source_word: אֶגְוָע
  english_pob_choice: I will die
  chosen_korean: 죽고
  alternatives_korean:
  - 죽겠습니다
  - 숨지겠습니다
  lexicon: HALOT
  rationale: 현재 장면에서 회상문 안의 미래적 확언이므로 ‘죽고’로 이어지는 병렬 구조를 살렸습니다.
- source_word: וְכַחוֹל
  english_pob_choice: like the sand
  chosen_korean: 모래처럼
  alternatives_korean:
  - 모래같이
  - 바다 모래처럼
  lexicon: HALOT
  rationale: 문맥상 다수성의 통상적 비유이므로 ‘모래처럼’이 가장 자연스럽고, POB의 기본 의미 선택을 그대로 반영합니다.
theological_decisions:
- issue: וְכַחוֹל의 이중 가능성(‘모래’ 또는 ‘불사조’로 읽는 견해)
  chosen_reading: 본문은 기본 의미인 ‘모래’로 번역하고, 다른 읽기는 각주로 제한합니다.
  alternative_readings:
  - 불사조처럼
  - 그 새처럼
  rationale: 문맥은 ‘날들이 많아짐’의 익숙한 성경적 비유와 잘 맞아 ‘모래’가 더 설득력 있습니다. 다만 대안 독법의 존재는 삭제하지 않고 각주로 보존합니다.
  doctrine_reference: 본문의 비유적 표현과 어휘 다의성 처리
