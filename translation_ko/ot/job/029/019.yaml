  - severity: low
    issue: ‘뻗었고’는 원문의 상태적 분사를 완료된 동작처럼 들리게 할 수 있습니다.
    rationale: ‘뻗어 있었고’는 뿌리가 물 쪽으로 열려 있거나 펼쳐진 지속 상태를 더 잘 나타냅니다.
  - severity: medium
