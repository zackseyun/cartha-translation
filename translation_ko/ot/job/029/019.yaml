source:
  edition: WLC
  text: שָׁרְשִׁ֣/י פָת֣וּחַ אֱלֵי מָ֑יִם וְ֝/טַ֗ל יָלִ֥ין בִּ/קְצִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
  footnotes:
  - marker: a
    text: Or 'in my harvest.' The Hebrew word here is unusual in context; 'branches' is chosen because it fits the plant imagery of roots and dew more naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 뿌리는 물가로 뻗었고, 이슬이 내 가지에 밤새 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 수확에’. 이 히브리어는 문맥상 드물고, 뿌리와 이슬의 식물 이미지를 더 자연스럽게 살리기 위해 ‘가지’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  english_pob_choice: My roots
  chosen_korean: 내 뿌리들
  alternatives_korean:
  - 내 뿌리
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수+1인칭 소유이지만, 시적 이미지에서는 뿌리 체계를 가리키므로 한국어에서도 자연스러운 복수형 ‘뿌리들/뿌리’ 중 문맥상 살아 있는 이미지인 ‘뿌리’를 택했습니다.
- source_word: פָתוּחַ
  english_pob_choice: were spread out
  chosen_korean: 뻗었고
  alternatives_korean:
  - 펴져 있고
  - 열려 있고
  lexicon: HALOT
  rationale: ‘열려 있다’보다 식물의 뿌리가 물가로 길게 나아간 그림을 살리는 동사 ‘뻗다’가 원문의 확장·개방 상태를 더 자연스럽게 전달합니다.
- source_word: אֱלֵי מָיִם
  english_pob_choice: to the waters
  chosen_korean: 물가로
  alternatives_korean:
  - 물들에게
  - 물로
  - 물을 향하여
  lexicon: HALOT
  rationale: 직역하면 ‘물들께/물들을 향하여’이지만, 한국어 시적 표현에서는 ‘물가로’가 방향성과 수분의 풍요를 함께 살리면서도 어색함이 적습니다.
- source_word: בִּקְצִירִי
  english_pob_choice: on my branches
  chosen_korean: 내 가지에
  alternatives_korean:
  - 내 수확에
  - 내 추수에
  - 내 가지들에
  lexicon: HALOT
  rationale: 본문 어휘는 문맥상 비정상적이어서, POB가 식물 이미지를 따라 ‘branches’로 풀이한 것을 반영해 한국어도 ‘가지’로 옮겼습니다. 이는 ‘수확’이라는 직역 가능성을 각주로 남기는 해석입니다.
theological_decisions:
- issue: 시적 평행법에서 식물-비유를 어떻게 살릴 것인가
  chosen_reading: 의인의 번영을 뿌리와 가지, 이슬의 이미지로 시각화한 시적 진술로 읽고, 한국어도 해석을 과도하게 풀지 않고 이미지 중심으로 유지했습니다.
  alternative_readings:
  - ‘뿌리’와 ‘수확’을 각각 농경 은유로 분리해 더 문자적으로 옮기는 방식
  - 문맥을 의도 설명으로 풀어 쓰는 방식
  rationale: 이 절은 교리 진술보다 시적 회상에 가깝기 때문에, 원문의 은유적 밀도를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 욥기 29장의 회상적 시편적 수사
