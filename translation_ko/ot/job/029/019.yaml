    rationale: קָצִיר 자체는 드문 단어라기보다 보통 ‘수확’을 뜻하며, 이 문맥에서 그 뜻과 식물 이미지의 관계가 논쟁적입니다. 각주는 이 대안을 명시해야 합니다.
