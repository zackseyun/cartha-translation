id: JOB.29.13
reference: Job 29:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּרְכַּ֣ת אֹ֭בֵד עָלַ֣/י תָּבֹ֑א וְ/לֵ֖ב אַלְמָנָ֣ה אַרְנִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
  footnotes:
  - marker: a
    text: Or 'the blessing of the one who was perishing came upon me.' The Hebrew participle אֹבֵד can denote someone perishing, ruined, or near death.
    reason: lexical_alternative
  - marker: b
    text: Or 'I caused the widow’s heart to rejoice' or 'to shout for joy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난해지는 사람의 복이 내게 이르렀고, 나는 과부의 마음이 기뻐 노래하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망해 가는 사람의 복이 내게 이르렀다.’ 히브리어 분사 אֹבֵד는 ‘멸망하는/무너지는/죽어 가는’ 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 과부의 마음을 기쁘게 했다’ 혹은 ‘기뻐 외치게 했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֹבֵד
  english_pob_choice: the blessing of the perishing man
  chosen_korean: 가난해지는 사람의 복
  alternatives_korean:
  - 망해 가는 사람의 복
  - 죽어 가는 사람의 복
  - 멸망하는 사람의 복
  lexicon: HALOT
  rationale: אֹבֵד의 핵심은 ‘소멸/파멸/잃어감’의 진행 상태이므로, 한국어에서는 죽음으로만 한정하지 않도록 ‘가난해지는 사람’으로 유연하게 옮겨 원문의 열린 의미를 살렸습니다.
- source_word: עָלַי תָּבֹא
  english_pob_choice: came upon me
  chosen_korean: 내게 이르렀고
  alternatives_korean:
  - 내게 임했고
  - 내 위에 왔고
  - 내게 닥쳤고
  lexicon: HALOT
  rationale: ‘upon me’의 이미지와 오게 하는 동사를 살리되, 한국어에서는 ‘이르렀다’가 시적 맥락에서 자연스럽고 축복의 도래를 잘 드러냅니다.
- source_word: וְלֵב אַלְמָנָה אַרְנִן
  english_pob_choice: I made the widow’s heart sing for joy
  chosen_korean: 과부의 마음이 기뻐 노래하게 했습니다
  alternatives_korean:
  - 과부의 마음을 기쁘게 했습니다
  - 과부의 마음이 즐거워 외치게 했습니다
  - 과부의 마음이 기쁨으로 노래하게 했습니다
  lexicon: HALOT
  rationale: הִפְעִיל 1인칭 단수의 사역성을 살려 ‘하게 했습니다’로 옮겼고, רנן의 ‘기쁘게 노래하다/외치다’ 의미는 ‘기뻐 노래하다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 시적 회고에서의 시제 처리
  chosen_reading: 과거 회상으로 읽어 한국어를 자연스러운 완료형으로 처리했습니다.
  alternative_readings:
  - 직역에 가까운 현재형
  - ‘올 것이었다’ 식의 미완료형
  rationale: 본문은 욥기의 회고적 시에서 자신의 행동을 회상하는 문맥이므로, 한국어에서는 과거 완료적 진술이 가장 분명합니다.
  doctrine_reference: 문맥-담화 기반 번역 원리
