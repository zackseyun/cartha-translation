translation:
  language: ko
  text: 주께서 저를 바람으로 들어 올리시고[a], 그 위를 타게 하시며[b], 폭풍 속에서 저를 휘돌리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘저를 바람 위로 들어 올리시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그것을 타게 하시며’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  english_pob_choice: You lift me up
  chosen_korean: 저를 들어 올리시고
  alternatives_korean:
  - 저를 들어 올려
  - 저를 받쳐 올리시고
  - 저를 끌어올리시고
  lexicon: HALOT
  rationale: נשא의 기본 뜻인 ‘들다, 들어 올리다’에 맞추되, 시적 문맥에서 주체의 극심한 무력감을 드러내는 자연스러운 한국어로 옮겼습니다.
- source_word: אֶל רוּחַ
  english_pob_choice: to the wind
  chosen_korean: 바람으로
  alternatives_korean:
  - 바람으로
  - 바람 위로
  - 바람 속으로
  lexicon: HALOT
  rationale: רוּחַ를 여기서는 날씨적 이미지에 따라 ‘바람’으로 보았고, 전치사의 방향성을 한국어 조사 ‘-으로’로 간결하게 살렸습니다.
- source_word: תַּרְכִּיבֵנִי
  english_pob_choice: you make me ride on it
  chosen_korean: 그 위를 타게 하시며
  alternatives_korean:
  - 그 위에 타게 하시며
  - 그것을 타게 하시며
  - 그 위에서 타게 하시며
  lexicon: HALOT
  rationale: רכב의 사역형을 ‘타게 하시다’로 옮기고, 앞선 ‘바람’을 가리키는 대상을 한국어에서 자연스럽게 받도록 ‘그 위를’로 처리했습니다.
- source_word: וּתְמֹגְגֵנִי
  english_pob_choice: you toss me about
  chosen_korean: 저를 휘돌리십니다
  alternatives_korean:
  - 저를 휘두르십니다
  - 저를 뒤흔드십니다
  - 저를 녹여 버리십니다
  lexicon: HALOT
  rationale: מוג는 ‘녹다, 녹아 없어지다’의 의미가 있으나, 본 구절의 폭풍 이미지와 결합한 결과로 ‘휘돌리다/뒤흔들다’가 더 직접적으로 폭풍 속의 격렬한 요동을 전달합니다.
theological_decisions:
- issue: יְהוָה를 직접 부르는 화자와 합쇼체의 조화
  chosen_reading: ‘주께서’로 시작해 하나님께 직접 말하는 장면을 유지하면서, 전체 서술은 합쇼체로 통일했습니다.
  alternative_readings:
  - 하나님께서
  - 주님께서
  rationale: 이 절은 욥이 하나님께 항의하듯 말하는 시적 독백이므로, 직접 호칭의 긴장감을 살리되 문체는 현대 한국어 공적 번역체로 유지했습니다.
  doctrine_reference: 욥기 30장의 시적 탄원과 하나님에 대한 직접 호소
