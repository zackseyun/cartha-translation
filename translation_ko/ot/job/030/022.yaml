translation:
  language: ko
  text: 주께서 저를 바람 속으로 들어 올리시고[a], 그 위에 타게 하시며, 폭풍 속에서 저를 녹아 없어지게 하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주께서 저를 바람 위로 들어 올리시고, 그 위에 타게 하시며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 히브리어 낱말은 뜻이 분명하지 않습니다. 폭풍, 요란한 굉음, 또는 파괴·멸망을 가리킬 수 있습니다. 따라서 이 구절은 ‘폭풍 속에서 저를 이리저리 내던지십니다’ 또는 ‘저를 멸망하게 하십니다’로도 옮길 수 있습니다.
    reason: alternative_reading
