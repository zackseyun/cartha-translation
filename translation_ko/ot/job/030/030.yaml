base_translation:
  language: en
  yaml_path: translation/ot/job/030/030.yaml
  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
  footnotes:
  - marker: a
    text: Or 'My skin turns black from upon me'; the Hebrew expression may describe skin blackening and peeling away or hanging darkened on the body.
    reason: lexical_alternative
  - marker: b
    text: Or 'my bones burn from fever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 피부가 검게 변하여 내 몸에서 벗겨지고, 내 뼈는 열로 타오릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 피부가 내 몸에서 검게 변한다’. 히브리어 표현은 피부가 검게 변해 벗겨지거나, 몸 위에 검게 드리워진 상태를 묘사할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 뼈는 열이 나서 탄다’.
    reason: alternative_reading
lexical_decisions:
- source_word: ע֭וֹרִי
  english_pob_choice: my skin
  chosen_korean: 내 피부
  alternatives_korean:
  - 내 살가죽
  - 내 가죽
  lexicon: HALOT
  rationale: 인간 몸에 대한 표현으로는 현대 한국어에서 ‘피부’가 가장 자연스럽고, 어감도 본문의 신체적 고통을 잘 드러냅니다.
- source_word: שָׁחַ֣ר
  english_pob_choice: turns black
  chosen_korean: 검게 변하여
  alternatives_korean:
  - 검게 되어
  - 어두워져
  lexicon: HALOT
  rationale: 동사의 결과 상태를 살려 ‘검게 변하다’로 옮기면 단순 색 변화가 아니라 병든 피부의 변색을 분명하게 전달할 수 있습니다.
- source_word: מֵ/עָלָ֑/י
  english_pob_choice: and falls from me
  chosen_korean: 내 몸에서 벗겨지고
  alternatives_korean:
  - 내게서 떨어지고
  - 내 몸에서 떨어지고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘내 위에서/내에게서’이지만, 문맥상 피부가 떨어져 나가는 병증을 가리키므로 한국어에서는 ‘벗겨지다’가 가장 근접합니다.
- source_word: חָ֝֗רָה
  english_pob_choice: burn
  chosen_korean: 타오릅니다
  alternatives_korean:
  - 불타오릅니다
  - 달아오릅니다
  lexicon: HALOT
  rationale: ‘burn’의 생생한 신체 이미지를 살리기 위해 ‘타오르다’로 옮겼습니다. 병적 열감과 고통을 함께 담을 수 있습니다.
theological_decisions:
- issue: 마지막 구의 감각적 표현 처리
  chosen_reading: ‘열로 타오릅니다’로 옮겨, 병증의 열감과 육체적 소모를 함께 드러냈습니다.
  alternative_readings:
  - ‘열 때문에 뜨겁습니다’
  - ‘열로 뜹니다’
  rationale: 본문은 단순한 체온 상승보다 고통스럽게 달아오르는 육체 상태를 묘사하므로, 시적 긴장을 유지하는 표현이 적절합니다.
  doctrine_reference: 시적 지혜문학의 신체 묘사
