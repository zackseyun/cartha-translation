  text: 내 피부는 내 몸 위에서 검게 변하고[a], 내 뼈는 열 때문에 타오릅니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 피부가 검게 변하여 내 몸에서 벗겨진다’. 히브리어 표현은 피부가 검게 변해 벗겨지는 것을 가리킬 수도 있고, 피부가 몸 위에 검게 드리워진 상태를 가리킬 수도 있습니다.
    reason: 원문의 מֵעָלָי(‘내 위에서’)는 피부의 탈락을 명시하지 않으므로, 가능한 문맥적 해석을 각주에 보존합니다.
  - marker: b
    text: 또는 ‘내 뼈는 열병으로 탄다’.
    reason: חֹרֶב은 일반적인 ‘열’을 뜻하며, 병적 열 또는 열병으로 이해할 가능성도 있습니다.
