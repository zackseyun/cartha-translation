source:
  edition: WLC
  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
  footnotes:
  - marker: a
    text: Or 'they profit from it' / 'they help it forward'; the Hebrew verb can denote being useful or advancing something, here likely Job's ruin.
    reason: lexical_alternative
  - marker: b
    text: Or 'with no one helping them.' The final clause is terse and may mean either that they act without assistance or that they have no helper.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 길을 허물고, 내 파멸을 재촉합니다. 그들에게는 돕는 자가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יוֹעִילוּ는 ‘유익하다, 도움이 되다’ 또는 ‘진전시키다’라는 뜻을 가질 수 있습니다. 여기서는 문맥상 욥의 파멸을 더욱 진전시키거나 재촉한다는 의미로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 매우 간결합니다. ‘그들에게는 돕는 자가 없다’로도, ‘아무의 도움 없이’라는 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  english_pob_choice: tear up
  chosen_korean: 허물어뜨리고
  alternatives_korean:
  - 찢어 놓고
  - 무너뜨리고
  - 헐어 버리고
  lexicon: HALOT
  rationale: 길을 폭력적으로 파괴하는 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘허물어뜨리다’를 선택했습니다.
- source_word: נְתִיבָתִי
  english_pob_choice: my path
  chosen_korean: 내 길
  alternatives_korean:
  - 내 길목
  - 내 행로
  - 내 길을
  lexicon: HALOT
  rationale: 직역적 ‘길’은 삶의 경로라는 은유를 무리 없이 전달하며, 1인칭 소유도 분명하게 드러냅니다.
- source_word: לְהַוָּתִי
  english_pob_choice: for my ruin
  chosen_korean: 내 파멸을 위해
  alternatives_korean:
  - 내 재앙을 위해
  - 내 멸망을 위해
  - 내 멸망으로
  lexicon: HALOT
  rationale: הַוָּה의 파멸/파괴 의미를 보존하되, 목적을 나타내는 לְ를 한국어의 ‘~을 위해’로 옮겼습니다.
- source_word: יֹעִילוּ
  english_pob_choice: they profit from it / they advance it
  chosen_korean: 그것을 더욱 진행시킵니다
  alternatives_korean:
  - 그것에 이익을 봅니다
  - 그것을 진척시킵니다
  - 그것을 돕습니다
  lexicon: HALOT
  rationale: 이 동사는 ‘유익하다/도움이 되다’의 뉘앙스를 가지므로, 여기서는 앞선 ‘파멸’을 적극적으로 진척시키는 뜻을 살려 ‘더욱 진행시키다’로 번역했습니다.
- source_word: לֹא עֹזֵר לָמוֹ
  english_pob_choice: there is no helper for them
  chosen_korean: 그들에게는 도와줄 자가 없습니다
  alternatives_korean:
  - 그들을 돕는 자가 없습니다
  - 그들에게는 아무도 돕지 않습니다
  - 그들에게는 조력자가 없습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 종결절을 자연스럽게 풀되, ‘helper’의 명사적 의미를 유지했습니다.
