  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
  footnotes:
  - marker: a
    text: Or 'they were scourged/beaten out from the land.' The Hebrew verb is rare, and the exact nuance may be either violent striking or expulsion; the context favors the sense of being driven out.
    reason: lexical_alternative
  - marker: b
    text: '''Sons without a name'' is a Hebrew idiom for people of no standing or honor.'
    reason: cultural_note
  - marker: c
    text: Or 'they were driven out'.
    reason: previous_rendering
translation:
  language: ko
  text: 어리석은 자들의 아들들, 곧 이름 없는 자들의 아들들은 땅에서 쫓겨났습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 드물며, ‘맞아서 쫓겨남’과 ‘추방됨’의 뉘앙스가 모두 가능합니다. 문맥상 결과는 추방에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름 없는 자들’은 명예와 지위가 없는 사람들을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘쫓겨난’으로 볼 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: בְּנֵי נָבָל
  english_pob_choice: sons of fools
  chosen_korean: 어리석은 자들의 아들들
  alternatives_korean:
  - 바보들의 아들들
  - 우매한 자들의 아들들
  lexicon: HALOT
  rationale: נָבָל은 지적 부족보다 도덕적·사회적 경멸을 담는 표현이므로, 한국어로는 자연스럽고 의미 강도가 살아 있는 ‘어리석은 자들’로 옮겼습니다.
- source_word: גַּם
  english_pob_choice: indeed
  chosen_korean: 곧
  alternatives_korean:
  - 또한
  - 심지어
  - 참으로
  lexicon: HALOT
  rationale: 여기서는 두 번째 명사구를 덧붙이며 강조하는 기능이어서, 한국어에서는 설명적 동격을 드러내는 ‘곧’이 가장 자연스럽습니다.
- source_word: בְּנֵי בְלִי שֵׁם
  english_pob_choice: sons without a name
  chosen_korean: 이름 없는 자들의 아들들
  alternatives_korean:
  - 이름이 없는 아들들
  - 무명한 아들들
  - 이름 없는 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구의 사회적 수치와 무명성을 살리면서도, 한국어 독자가 바로 이해할 수 있게 ‘이름 없는 자들’로 옮겼습니다.
- source_word: נִכְּאוּ
  english_pob_choice: were scourged / were driven out
  chosen_korean: 쫓겨났습니다
  alternatives_korean:
  - 채찍질당했습니다
  - 몰려났습니다
  - 내쫓겼습니다
  lexicon: HALOT
  rationale: 동사는 드물어 ‘맞다/내쫓기다’의 가능성이 있으나, 뒤의 מִן הָאָרֶץ와 결합된 문맥상 결과는 추방에 가깝습니다. 한국어에서는 그 결과를 분명히 하는 ‘쫓겨났습니다’를 택했습니다.
- source_word: מִן הָאָרֶץ
  english_pob_choice: from the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 나라에서
  - 땅으로부터
  lexicon: HALOT
  rationale: 이곳의 אֶרֶץ는 우주적 ‘땅’보다 공동체적·거주지적 의미가 더 자연스러워, 간결하게 ‘땅에서’로 옮겼습니다.
theological_decisions:
- issue: 시적 평행구의 인격화된 낙인 표현
  chosen_reading: 두 개의 명사구를 유지해 ‘어리석은 자들’과 ‘이름 없는 자들’이 함께 사회적 수치와 배제를 드러내도록 했습니다.
  alternative_readings:
  - 하나로 묶어 ‘어리석고 이름 없는 자들’로 처리하는 방식
  - 더 매끈하게 의역해 ‘천대받는 자들’로 바꾸는 방식
  rationale: 원문은 단순한 설명이 아니라 두 낙인 표현을 병렬로 쌓아 수치와 배제의 강도를 높입니다. 이를 합쳐 버리면 시적 압박감이 약해집니다.
  doctrine_reference: 시편/지혜문학의 시적 평행법과 수치-명예 문화
