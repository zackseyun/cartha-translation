lexical_decisions:
- source_word: מֵעַי
  english_pob_choice: my inward parts
  chosen_korean: 내 창자들
  alternatives_korean:
  - 내 속
  - 내 배속
  - 내 내장
  lexicon: HALOT
  rationale: 히브리어 מֵעֶה는 문자적으로 안쪽 장기들을 가리키므로, 시적 비탄의 강한 신체적 이미지를 살려 '창자들'로 옮겼습니다. '속'은 뜻은 자연스럽지만 이미지를 약화합니다.
- source_word: רֻתְּחוּ
  english_pob_choice: boil
  chosen_korean: 끓어오르고
  alternatives_korean:
  - 끓습니다
  - 달아오르고
  - 들끓고
  lexicon: HALOT
  rationale: רתח의 핵심 의미는 끓다, 끓어오르다이므로, 내부의 격한 동요를 살리는 현재적 묘사로 번역했습니다.
- source_word: וְלֹא דָמּוּ
  english_pob_choice: and do not rest
  chosen_korean: 쉬지 않습니다
  alternatives_korean:
  - 가만있지 않습니다
  - 멈추지 않습니다
  - 고요하지 않습니다
  lexicon: HALOT
  rationale: דמם은 '고요하다/멈추다/그치다'의 의미가 있어, 문맥상 계속되는 내적 소동을 자연스러운 한국어로 옮겨 '쉬지 않습니다'를 택했습니다.
- source_word: קִדְּמֻנִי
  english_pob_choice: confront me
  chosen_korean: 나를 맞이합니다
  alternatives_korean:
  - 나를 맞닥뜨립니다
  - 나를 대면합니다
  - 나를 덮칩니다
  lexicon: HALOT
  rationale: קדם은 '앞서 오다, 맞이하다, 마주하다'의 뜻이 있으므로, 날들이 인격화되어 화자 앞에 이른다는 이미지를 살리되 한국어에서는 '나를 맞이합니다'로 옮겼습니다.
- source_word: יְמֵי עֹנִי
  english_pob_choice: days of affliction
  chosen_korean: 고난의 날들
  alternatives_korean:
  - 환난의 날들
  - 괴로움의 날들
  - 비참의 날들
  lexicon: HALOT
  rationale: עֹנִי는 문맥상 가난만이 아니라 폭넓은 고난·고통을 가리키므로, 욥기의 탄식에 맞는 일반적이면서도 강한 표현인 '고난'을 사용했습니다.
theological_decisions:
- issue: 의인화된 '날들'과 내부 장기의 병렬 표현을 어떻게 살릴지
  chosen_reading: 두 이미지를 모두 살려, 내부의 격렬한 동요와 밖에서 다가오는 고난을 병렬로 제시했습니다.
  alternative_readings:
  - 의역하여 한쪽 이미지만 강조하는 번역
  - 감정 표현으로 완전히 풀어쓰는 번역
  rationale: 히브리어 시는 신체 내부의 끓어오름과 고난의 날들이 나를 맞이하는 장면을 병렬로 놓아 탄식의 압박을 강화하므로, 둘 중 하나를 희석하지 않도록 했습니다.
  doctrine_reference: 욥기의 시적 탄식은 실제 신체감각과 영적/정서적 고통을 함께 표현합니다.
