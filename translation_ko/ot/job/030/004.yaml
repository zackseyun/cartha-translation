translation:
  language: ko
  text: 그들은 수풀 사이에서 염생 식물을 뜯고[a], 로뎀나무의 뿌리가 그들의 양식입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말로우’. 히브리어 식물명은 확실하지 않지만, 염분에 견디는 야생 식물을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘로뎀나무’는 사막 지역에서 자라는 로뎀 또는 브룸 관목을 가리킵니다. 정확한 현대 식물 분류는 확실하지 않습니다.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַקֹּטְפִים
  english_pob_choice: who pluck
  chosen_korean: 뜯어 먹고
  alternatives_korean:
  - 따서 먹고
  - 꺾어 먹고
  lexicon: HALOT
  rationale: קטף는 식물을 ‘따다/뜯다’는 뜻이므로, 단순히 ‘모으다’보다 절박한 채집 행위를 드러내는 ‘뜯어 먹다’로 옮겼습니다.
- source_word: מַלּוּחַ
  english_pob_choice: saltwort
  chosen_korean: 염생 식물
  alternatives_korean:
  - 소금풀
  - 소금초
  lexicon: HALOT
  rationale: 히브리어 식물명은 불확실하지만 건조지의 염분성 야생식물을 가리키는 것으로 보이므로, 독자에게 오해를 줄 수 있는 특정 원예식물명보다 의미 중심의 ‘염생 식물’을 택했습니다.
- source_word: עֲלֵי שִׂיחַ
  english_pob_choice: from among the bushes
  chosen_korean: 수풀 사이에서
  alternatives_korean:
  - 덤불 사이에서
  - 관목들 사이에서
  lexicon: HALOT
  rationale: 전치사 על의 장소적 용법을 자연스럽게 살려, 거친 덤불지대에서 채집하는 장면을 보여 주는 ‘수풀 사이에서’로 옮겼습니다.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  english_pob_choice: and the root of broom shrubs
  chosen_korean: 관목나무의 뿌리
  alternatives_korean:
  - 싸리나무의 뿌리
  - 떨기나무의 뿌리
  lexicon: HALOT
  rationale: רתמים은 사막성 관목을 가리키므로, 한국어 독자에게 생소할 수 있는 식물명을 바로 음역하기보다 ‘관목나무’로 처리해 거친 사막 식생의 이미지를 유지했습니다.
- source_word: לַחְמָם
  english_pob_choice: is their food
  chosen_korean: 그들의 양식
  alternatives_korean:
  - 그들의 음식
  - 그들의 빵
  lexicon: HALOT
  rationale: לחם은 문자적으로 ‘빵’이지만 여기서는 생존을 위한 먹거리 전반을 뜻하므로, 현대 한국어에서 자연스러운 ‘양식’으로 옮겼습니다.
