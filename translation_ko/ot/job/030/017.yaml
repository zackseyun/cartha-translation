reference: Job 30:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ֗יְלָה עֲ֭צָמַ/י נִקַּ֣ר מֵ/עָלָ֑/י וְ֝/עֹרְקַ֗/י לֹ֣א יִשְׁכָּבֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/017.yaml
  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
  footnotes:
  - marker: a
    text: Or 'my bones are bored through from upon me'; the Hebrew wording is difficult, and some translations render the verb more generally as 'gnaws.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my sinews' or 'my veins'; the Hebrew term is rare and may refer literally to bodily cords/channels rather than, by extension, to pains.
    reason: lexical_alternative
translation:
  language: ko
  text: 밤에 내 뼈가 내 안에서 찔리며, 내 갉아먹는 고통은 눕지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘내 위로부터’에 가까워 해석이 어렵습니다. 문맥상 몸속에서 겪는 고통을 가리키는 것으로 이해하여 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어 단어는 매우 드물어 ‘힘줄’, ‘핏줄’ 등으로도 옮길 수 있습니다. 본문은 여기서 지속적 신체 고통을 가리키는 표현으로 이해되었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  english_pob_choice: At night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤에
  - 밤마다
  lexicon: HALOT
  rationale: 시간 부사로서의 기능을 자연스러운 현대 한국어로 살리되, 시적 압축을 유지했습니다.
- source_word: עֲצָמַי
  english_pob_choice: my bones
  chosen_korean: 내 뼈
  alternatives_korean:
  - 내 골격
  - 내 몸뚱이
  lexicon: HALOT
  rationale: 고통의 구체적 신체 이미지를 직접 살리기 위해 직역에 가까운 ‘뼈’를 택했습니다.
- source_word: נִקַּר
  english_pob_choice: are pierced
  chosen_korean: 찔리며
  alternatives_korean:
  - 뚫리며
  - 구멍이 뚫리며
  - 파여
  lexicon: HALOT
  rationale: ‘뚫다/구멍내다’의 강한 물리적 이미지를 한국어 시적 문맥에서 간결하게 전달했습니다.
- source_word: וְעֹרְקַי
  english_pob_choice: my gnawing pains
  chosen_korean: 내 갉아먹는 고통
  alternatives_korean:
  - 내 힘줄
  - 내 핏줄
  - 내 신경
  lexicon: HALOT
  rationale: 희귀어의 해석 불확실성을 고려하되, 문맥상 지속적으로 몸을 갉아먹는 고통이라는 의미를 본문에 반영했습니다.
theological_decisions:
- issue: 희귀어 עֹרְקַי의 의미 처리
  chosen_reading: 본문에는 해석이 확정되지 않은 신체 부위보다, 문맥이 분명히 드러내는 지속적 고통의 이미지를 살린 ‘갉아먹는 고통’으로 옮겼습니다.
  alternative_readings:
  - 내 힘줄
  - 내 핏줄
  rationale: 영어 POB도 이 단어를 ‘my gnawing pains’로 문맥 번역하고 있으며, 히브리어의 불확실성을 숨기지 않으면서 시의 흐름을 유지합니다.
  doctrine_reference: 해석학적 보수성 및 본문 불확실성 존중
- issue: לֹא יִשְׁכָּבוּן의 의인화된 표현
  chosen_reading: ‘눕지 않습니다’로 옮겨 고통이 잠들거나 쉬지 않는다는 의인화를 유지했습니다.
  alternative_readings:
  - 쉬지 않습니다
  - 가라앉지 않습니다
  rationale: 히브리어의 ‘눕다’ 이미지는 단순한 중단보다 더 생생하므로, 이를 보존하는 편이 원문의 시적 힘에 가깝습니다.
  doctrine_reference: 시적 평행법과 이미지 보존
