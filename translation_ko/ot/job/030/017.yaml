theological_decisions:
- issue: 희귀어 עֹרְקַי의 의미 처리
  chosen_reading: 본문에는 해석이 확정되지 않은 신체 부위보다, 문맥이 분명히 드러내는 지속적 고통의 이미지를 살린 ‘갉아먹는 고통’으로 옮겼습니다.
  alternative_readings:
  - 내 힘줄
  - 내 핏줄
  rationale: 영어 POB도 이 단어를 ‘my gnawing pains’로 문맥 번역하고 있으며, 히브리어의 불확실성을 숨기지 않으면서 시의 흐름을 유지합니다.
  doctrine_reference: 해석학적 보수성 및 본문 불확실성 존중
- issue: לֹא יִשְׁכָּבוּן의 의인화된 표현
  chosen_reading: ‘눕지 않습니다’로 옮겨 고통이 잠들거나 쉬지 않는다는 의인화를 유지했습니다.
  alternative_readings:
  - 쉬지 않습니다
  - 가라앉지 않습니다
  rationale: 히브리어의 ‘눕다’ 이미지는 단순한 중단보다 더 생생하므로, 이를 보존하는 편이 원문의 시적 힘에 가깝습니다.
  doctrine_reference: 시적 평행법과 이미지 보존
