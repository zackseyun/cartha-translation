source:
  edition: WLC
  text: לַ֗יְלָה עֲ֭צָמַ/י נִקַּ֣ר מֵ/עָלָ֑/י וְ֝/עֹרְקַ֗/י לֹ֣א יִשְׁכָּבֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/017.yaml
  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
  footnotes:
  - marker: a
    text: Or 'my bones are bored through from upon me'; the Hebrew wording is difficult, and some translations render the verb more generally as 'gnaws.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my sinews' or 'my veins'; the Hebrew term is rare and may refer literally to bodily cords/channels rather than, by extension, to pains.
    reason: lexical_alternative
translation:
  language: ko
  text: 밤에 내 뼈가 내 안에서[a] 찔리며, 나를 갉아먹는 고통[b]은 눕지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘내 위로부터’에 가까워 해석이 어렵습니다. 문맥상 몸속에서 겪는 고통을 가리키는 것으로 이해하여 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어 단어는 매우 드물어 ‘힘줄’, ‘핏줄’ 등으로도 옮길 수 있습니다. 본문은 여기서 지속적 신체 고통을 가리키는 표현으로 이해되었습니다.
    reason: lexical_alternative
