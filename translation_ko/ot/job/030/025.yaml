id: JOB.30.25
reference: Job 30:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לֹ֣א בָ֭כִיתִי לִ/קְשֵׁה י֑וֹם עָֽגְמָ֥ה נַ֝פְשִׁ֗/י לָ/אֶבְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
  footnotes:
  - marker: a
    text: Or 'for one in a day of hardship' / 'for him who was in trouble.' The Hebrew literally speaks of 'the hard/severe of day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 고난의 날을 맞은 이를 위해 울지 않았겠습니까? 내 영혼이 가난한 이를 위해 슬퍼하지 않았겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난의 날에 있는 이를 위해’ / ‘곤경에 처한 이를 위해’. 히브리어는 문자적으로 ‘날이 고된 이’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Did I not
  chosen_korean: 내가 어찌 … 않았겠습니까?
  alternatives_korean:
  - 내가 … 하지 않았습니까?
  - 과연 내가 … 하지 않았겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 반문을 한국어 합쇼체의 자연스러운 반문으로 옮기되, 자책과 항변이 함께 느껴지도록 했습니다.
- source_word: בָכִיתִי
  english_pob_choice: weep
  chosen_korean: 울지
  alternatives_korean:
  - 통곡하지
  - 눈물 흘리지
  lexicon: HALOT
  rationale: weeping의 감정적 강도를 살리면서도 한국어에서 가장 자연스러운 동사인 ‘울다’를 사용했습니다.
- source_word: לִקְשֵׁה יוֹם
  english_pob_choice: for the one whose day was hard
  chosen_korean: hard한 날을 맞은 이를 위해
  alternatives_korean:
  - 고난의 날을 겪는 이를 위해
  - 어려운 날을 맞은 이를 위해
  - 괴로운 날의 사람을 위해
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘힘든 날’의 개념을 유지하되 한국어로 매끄럽게 풀어, 고난의 때를 가리키는 관용을 전달했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼이
  alternatives_korean:
  - 내가
  - 내 속사람이
  - 내 마음이
  lexicon: HALOT
  rationale: 히브리어의 נפש 표현을 유지해 시적 자기지시와 정서적 깊이를 살렸습니다. 한국어 ‘영혼’은 여기서 영혼론의 기술어가 아니라 내적 자아를 가리키는 표현으로 사용했습니다.
- source_word: לָאֶבְיוֹן
  english_pob_choice: for the poor
  chosen_korean: 가난한 이를 위해
  alternatives_korean:
  - 가난한 자를 위해
  - 궁핍한 이를 위해
  - 빈궁한 이를 위해
  lexicon: HALOT
  rationale: 대표적 단수의 보편적 의미를 살려 ‘가난한 이’로 옮겼으며, 한국어에서 지나치게 낯선 사회경제 용어보다 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: נַפְשִׁי의 번역에서 ‘영혼’ 사용 여부
  chosen_reading: ‘내 영혼이’로 옮겨 시적 표현을 보존하되, 교리적 의미를 과도하게 부여하지 않았습니다.
  alternative_readings:
  - 내가
  - 내 속사람이
  rationale: 이 구절은 시적 평행법 속 자기지시이므로, 본문의 문체를 살리기 위해 직접적 자아표현보다 ‘영혼’을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: לִקְשֵׁה יוֹם의 관용적 의미
  chosen_reading: ‘hard한 날’로 풀어 원문 이미지와 고난의 의미를 함께 드러냈습니다.
  alternative_readings:
  - 고난의 날
  - 어려운 날
  rationale: 히브리어의 ‘날’ 이미지를 지우지 않으면서 독자가 의미를 즉시 이해하도록, 직역과 관용 사이의 균형을 택했습니다.
  doctrine_reference: 시적/수사적 번역 원칙
