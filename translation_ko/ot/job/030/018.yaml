source:
  edition: WLC
  text: בְּ/רָב כֹּ֭חַ יִתְחַפֵּ֣שׂ לְבוּשִׁ֑/י כְּ/פִ֖י כֻתָּנְתִּ֣/י יַֽאַזְרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/018.yaml
  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
  footnotes:
  - marker: a
    text: Or 'my garment is changed,' 'my garment is disfigured,' or possibly 'he seizes my garment.' The Hebrew verb is difficult, and the line is commonly understood as describing Job's affliction as distorting or constricting him like clothing.
    reason: lexical_alternative
  - marker: b
    text: Literally 'like the mouth/opening of my tunic.'
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 힘으로 제 옷이 뒤틀리고, 제 겉옷의 목둘레처럼 저를 조입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 뜻이 어렵습니다. 문맥상 ‘변형되다’, ‘뒤틀리다’, 또는 ‘붙잡히다/거칠게 다루어지다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제 옷의 입구/목구멍처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  english_pob_choice: By great force
  chosen_korean: 큰 힘으로
  alternatives_korean:
  - 강한 힘으로
  - 엄청난 힘으로
  lexicon: HALOT
  rationale: ב + רָב + כֹּחַ는 수단/정도를 나타내는 표현으로 보아, 한국어에서는 자연스럽고 간결한 ‘큰 힘으로’가 적절합니다.
- source_word: יִתְחַפֵּשׂ
  english_pob_choice: is disfigured
  chosen_korean: 뒤틀리고
  alternatives_korean:
  - 변형되고
  - 일그러지고
  - 가려지고
  lexicon: HALOT
  rationale: 히트파엘 동사는 의미가 어려우며, 문맥상 욥의 고난이 옷을 변형·왜곡시키는 이미지이므로 ‘뒤틀리고’가 가장 잘 맞습니다.
- source_word: כְּפִי כֻתָּנְתִּי
  english_pob_choice: like the collar of my tunic
  chosen_korean: 제 겉옷의 목둘레처럼
  alternatives_korean:
  - 제 옷의 목구멍처럼
  - 제 튜닉의 입구처럼
  lexicon: HALOT
  rationale: 직역하면 ‘입/열림’이지만 의복 문맥에서는 목둘레나 옷깃의 여밈을 가리키므로, 의미를 살려 ‘목둘레’로 옮겼습니다.
- source_word: יַאַזְרֵנִי
  english_pob_choice: it binds me
  chosen_korean: 저를 조입니다
  alternatives_korean:
  - 저를 묶습니다
  - 저를 동여맵니다
  lexicon: HALOT
  rationale: ‘허리띠를 띠다/동이다’의 동사이지만, 옷이 몸을 죄는 비유를 한국어에서 자연스럽게 드러내기 위해 ‘조입니다’를 택했습니다.
