  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
  footnotes:
  - marker: a
    text: Or 'mourning' / 'blackened' for 'darkened'; the Hebrew participle can evoke both grief and a darkened appearance.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'not by the sun.' The sense is that his darkened condition is not caused by sun exposure.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 어두운 모습으로 다닙니다[a]. 그러나 태양 때문은 아닙니다[b]. 나는 모인 사람들 가운데서 일어서서 도움을 청하며 부르짖습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘애도하며’, ‘검게 되어’. 히브리어 קֹדֵר는 어두워지거나 검게 된 모습을 가리킬 수 있으며, 애도나 침울함도 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘태양 없이’ 또는 ‘태양으로 말미암지 않고’입니다. 문맥상 그의 어두운 모습이 햇볕을 쬔 탓이 아니라는 뜻입니다.
    reason: lexical_alternative
