  lexicon: HALOT
  rationale: 시적 현재감이 있는 반복적 동작을 살리기 위해 단순 과거보다 현재형의 서술을 택했습니다.
- source_word: בְּלֹא חַמָּה
  english_pob_choice: but not by the sun
  chosen_korean: 햇볕 때문은 아닙니다
  alternatives_korean:
  - 햇볕이 없어서가 아닙니다
  - 태양 때문은 아닙니다
  - 햇빛 때문은 아닙니다
  lexicon: HALOT
  rationale: 문맥상 ‘햇볕 노출로 그렇게 된 것이 아니다’라는 원인을 부정하므로, 원인 부정이 드러나는 한국어로 옮겼습니다.
- source_word: בַקָּהָל
  english_pob_choice: in the assembly
  chosen_korean: 회중 가운데서
  alternatives_korean:
  - 모임 가운데서
  - 집회 가운데서
  - 총회 가운데서
  lexicon: HALOT
  rationale: קהל은 단순한 모임이지만, 본문이 공동체 앞의 공개적 외침을 가리키므로 ‘회중’이 가장 자연스럽고 절제된 대응입니다.
theological_decisions:
- issue: 공개적인 절망 호소의 표현
  chosen_reading: ‘도움을 외칩니다’로 개인적 탄식이 아니라 공동체 앞의 구원 요청으로 드러냈습니다.
  alternative_readings:
  - ‘부르짖습니다’
  - ‘소리칩니다’
  rationale: אֲשַׁוֵּעַ의 간구적 성격을 유지하되, 현대 한국어에서 목적이 분명한 표현이 문맥에 더 잘 맞습니다.
  doctrine_reference: lament / supplication in wisdom poetry
