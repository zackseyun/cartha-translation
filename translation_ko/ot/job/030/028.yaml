source:
  edition: WLC
  text: קֹדֵ֣ר הִ֭לַּכְתִּי בְּ/לֹ֣א חַמָּ֑ה קַ֖מְתִּי בַ/קָּהָ֣ל אֲשַׁוֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
  footnotes:
  - marker: a
    text: Or 'mourning' / 'blackened' for 'darkened'; the Hebrew participle can evoke both grief and a darkened appearance.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'not by the sun.' The sense is that his darkened condition is not caused by sun exposure.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 검은빛이 되어 돌아다닙니다[a], 그러나 햇볕 때문은 아닙니다[b]. 나는 회중 가운데서 일어나 도움을 외칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘검은빛이 되어’는 히브리어 קֹדֵר의 중의성—어두워짐과 애도/침울함—을 함께 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘태양이 아니라/햇볕이 아니라’입니다. 여기서는 햇볕 노출이 원인이 아니라는 뜻을 분명히 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  english_pob_choice: darkened
  chosen_korean: 검은빛이 되어
  alternatives_korean:
  - 어두워져
  - 애도 중인 듯한
  - 검게 되어
  lexicon: HALOT
  rationale: 이 형용사는 ‘어두워지다/검어지다/애도하다’의 중의를 가질 수 있으므로, 몸과 처지를 함께 암시하는 ‘검은빛이 되어’로 옮겨 의미 범위를 과도하게 좁히지 않았습니다.
- source_word: הִלַּכְתִּי
  english_pob_choice: I go about
  chosen_korean: 돌아다닙니다
  alternatives_korean:
  - 다닙니다
