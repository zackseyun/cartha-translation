  rationale: פֶרֶץ의 핵심 이미지는 성벽의 ‘틈/파열’이며, כְּ는 비교를 나타내므로 한국어도 비유를 살려 간결하게 옮겼습니다.
- source_word: יֶאֱתָיוּ
