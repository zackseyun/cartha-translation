translation:
  language: ko
  text: 넓은 틈 같아 그들이 다가오고, 파멸의 소용돌이 속에서 그들은 굴러갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/פֶרֶץ רָחָב
  english_pob_choice: Like a wide breach
  chosen_korean: 넓은 틈 같아
  alternatives_korean:
  - 넓은 무너진 틈처럼
  - 넓은 파열처럼
  lexicon: HALOT
  rationale: פֶרֶץ의 핵심 이미지는 성벽의 ‘틈/파열’이며, כְּ는 비교를 나타내므로 한국어도 비유를 살려 간결하게 옮겼습니다.
- source_word: יֶאֱתָיוּ
  english_pob_choice: they come
  chosen_korean: 그들이 다가오고
  alternatives_korean:
  - 그들이 옵니다
  - 그들이 진군하고
  lexicon: HALOT
  rationale: 문맥상 단순한 도착보다 밀려오는 움직임이 두드러지므로, 한국어에서는 ‘다가오고’로 생동감을 살렸습니다.
- source_word: תַּחַת שֹׁאָה
  english_pob_choice: amid the crash / amid the ruin
  chosen_korean: 파멸의 소용돌이 속에서
  alternatives_korean:
  - 파멸의 혼란 속에서
  - 붕괴의 소용돌이 속에서
  lexicon: HALOT
  rationale: שֹׁאָה는 ‘파멸, 격변, 붕괴의 소란’ 범위를 가지므로, 단순 상태명사보다 급작스러운 재난의 압력을 드러내는 표현을 택했습니다.
- source_word: הִתְגַּלְגָּלוּ
  english_pob_choice: they roll on
  chosen_korean: 그들은 굴러갑니다
  alternatives_korean:
  - 그들은 구르며 갑니다
  - 그들은 굴러들어갑니다
  lexicon: HALOT
  rationale: 히트파엘형 גלל의 반복적·자기추진적 움직임을 자연스러운 현대 한국어 동사로 옮겼습니다.
