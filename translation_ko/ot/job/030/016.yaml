id: JOB.30.16
reference: Job 30:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה עָ֭לַ/י תִּשְׁתַּפֵּ֣ךְ נַפְשִׁ֑/י יֹ֭אחֲז֣וּ/נִי יְמֵי עֹֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
  footnotes:
  - marker: a
    text: Or 'my soul is poured out upon me.' The Hebrew preposition is literally 'upon/on me,' but the expression likely describes inward collapse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 내 영혼이 내 안에 쏟아져 나갑니다[a]. 고난의 날들이 나를 붙잡습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼이 내 위에 쏟아져 나갑니다.’ 히브리어 전치사는 문자적으로 ‘나 위에/나에게’이지만, 표현은 내면 붕괴를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그런데 이제
  lexicon: HALOT
  rationale: 시간 전환과 앞뒤 연결을 함께 살리기 위해 ‘그리고 이제’로 옮겼습니다. 단순한 ‘이제’보다 담화의 연결감이 더 분명합니다.
- source_word: תִּשְׁתַּפֵּךְ
  english_pob_choice: is poured out
  chosen_korean: 쏟아져 나갑니다
  alternatives_korean:
  - 퍼져 나갑니다
  - 흘러나갑니다
  lexicon: HALOT
  rationale: 자기 자신이 비워지듯 ‘쏟아지다’는 이미지가 핵심이므로, 수동적 붕괴를 자연스럽게 드러내는 ‘쏟아져 나갑니다’로 옮겼습니다.
- source_word: עָלַי
  english_pob_choice: within me
  chosen_korean: 내 안에
  alternatives_korean:
  - 내 위에
  - 나에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘나 위에/나에게’이지만, 문맥상 내면이 무너지는 형상을 가리키므로 한국어에서는 ‘내 안에’가 가장 직접적으로 같은 효과를 줍니다.
- source_word: יֹאחֲזוּנִי
  english_pob_choice: seize me
  chosen_korean: 나를 붙잡습니다
  alternatives_korean:
  - 나를 사로잡습니다
  - 나를 움켜잡습니다
  lexicon: HALOT
  rationale: אחז의 ‘붙들다/붙잡다’ 의미를 살리면서, 시적 병행 속에서 고통이 덮치는 느낌을 담기 위해 ‘붙잡습니다’로 옮겼습니다.
- source_word: יְמֵי עֹנִי
  english_pob_choice: days of affliction
  chosen_korean: 고난의 날들
  alternatives_korean:
  - 환난의 날들
  - 괴로움의 날들
  lexicon: HALOT
  rationale: עֹנִי를 여기서는 단순한 빈곤보다 폭넓은 고통·굴욕의 상태로 보아 ‘고난’으로 옮겼습니다. 소유격 구조는 한국어에서 자연스럽게 ‘고난의 날들’로 표현했습니다.
theological_decisions:
- issue: נפש(네페쉬)의 번역
  chosen_reading: ‘영혼’으로 옮겨, 시편·지혜문학의 내적 붕괴와 인격 전체의 소진을 드러냈습니다.
  alternative_readings:
  - 생명
  - 자기 자신
  rationale: 이 구절은 단순한 생물학적 생명보다 내면의 붕괴를 강조하므로, 한국어 ‘영혼’이 시적·인간론적 깊이를 가장 잘 전달합니다.
  doctrine_reference: Job 30의 시적 인간 이해
