lexical_decisions:
- source_word: תֵּהָפֵךְ
  english_pob_choice: have turned
  chosen_korean: 잔인하게 변하셨습니다
  alternatives_korean:
  - 가혹하게 되셨습니다
  - 냉혹하게 되셨습니다
  - 변하셨습니다
  lexicon: HALOT
  rationale: פּעל의 상태 변화와 POB의 "have turned"를 따라, 하나님께서 Job에게 대해 보이시는 태도의 변화를 직접적으로 살리되 한국어에서 자연스럽게 표현했습니다.
- source_word: לְאַכְזָר
  english_pob_choice: cruel
  chosen_korean: 잔인하게
  alternatives_korean:
  - 무자비하게
  - 냉혹하게
  - 잔혹하게
  lexicon: HALOT
  rationale: אַכְזָר의 핵심 의미는 잔인함/무자비함이므로, POB의 predicate adjective "cruel"에 맞춰 부사형으로 옮겼습니다.
- source_word: בְּעֹצֶם יָדְךָ
  english_pob_choice: with the might of your hand
  chosen_korean: 주님의 손의 힘으로
  alternatives_korean:
  - 주님의 손의 위력으로
  - 주님의 권능으로
  - 주님의 힘센 손으로
  lexicon: HALOT
  rationale: 손의 구체적 이미지를 유지하면서, בְּ의 수단 의미와 עֹצֶם의 힘/위력을 한국어로 자연스럽게 옮겼습니다.
- source_word: תִשְׂטְמֵנִי
  english_pob_choice: you oppose me
  chosen_korean: 저를 대적하십니다
  alternatives_korean:
  - 저를 공격하십니다
  - 저를 해치십니다
  - 저를 핍박하십니다
  lexicon: HALOT
  rationale: שׂטם의 적대적 대항 의미를 따라, 단순한 감정(미워함)보다 행위적 적대성을 드러내는 "대적하다"를 택했습니다.
theological_decisions:
- issue: 하나님을 향한 직접적인 책망과 인체적 표현
  chosen_reading: 주님을 직접 호칭하고 "주님의 손"이라는 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - '"주님의 권능이 저를 거스릅니다"처럼 완화하기'
  - 삼인칭 서술로 바꾸어 직접 고발을 약화하기
  rationale: 욥의 탄식은 하나님께 대한 정면 호소와 긴장을 의도하므로, 인격적이고 도전적인 어조를 누그러뜨리지 않는 것이 본문의 신학적 힘을 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
