  rationale: 히브리어와 영어 POB 모두 앞부분에서는 하나님이 주체이고, 뒤 문장에서는 ‘그들’이 Job 앞에서 제어를 버렸다고 말하므로, 문맥적 긴장을 지우지 않고 보존했습니다.
