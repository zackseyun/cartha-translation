base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
  footnotes:
  - marker: a
    text: Or 'Because he has loosened his bowstring and afflicted me.' The Hebrew term may refer more specifically to a bowstring than a general cord.
    reason: lexical_alternative
  - marker: b
    text: Literally 'they have sent away the bridle before me,' that is, 'they have cast off restraint in my presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분이 자신의 줄을 풀어 저를 괴롭게 하시고, 제 앞에서 굴레를 벗겨 버리셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분이 자신의 활시위를 풀어 저를 괴롭게 하셨다.’ 히브리어 어휘는 일반적인 ‘줄’보다 더 구체적으로 ‘활시위’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 내 앞에서 굴레를 보냈다’는 뜻으로, 곧 ‘내 앞에서 제어를 풀어 버렸다’는 의미입니다.
    reason: lexical_alternative
