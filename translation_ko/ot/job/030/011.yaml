  chosen_reading: 문맥상 하나님을 가리키는 비난/탄식의 진술로 읽어, 1인칭 고난 서술과 3인칭 복수 주어가 함께 유지되도록 했습니다.
  alternative_readings:
  - 일반적인 사람들을 주어로 읽는 해석
