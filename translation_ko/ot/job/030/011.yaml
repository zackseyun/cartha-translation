theological_decisions:
- issue: 마지막 절의 주어 해석
  chosen_reading: 문맥상 하나님을 가리키는 비난/탄식의 진술로 읽어, 1인칭 고난 서술과 3인칭 복수 주어가 함께 유지되도록 했습니다.
  alternative_readings:
  - 일반적인 사람들을 주어로 읽는 해석
  - 문법적 불명확성을 살려 더 중립적으로 옮기는 해석
  rationale: 히브리어와 영어 POB 모두 앞부분에서는 하나님이 주체이고, 뒤 문장에서는 ‘그들’이 Job 앞에서 제어를 버렸다고 말하므로, 문맥적 긴장을 지우지 않고 보존했습니다.
  doctrine_reference: 욥기의 탄식과 항변의 수사
