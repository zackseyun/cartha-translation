  lexicon: HALOT
  rationale: כִּנּוֹר는 현악기를 뜻하며 한국어 성경에서 널리 알려진 ‘수금’이 가장 자연스럽습니다. 영어의 lyre/harp 구분보다 한국어 독자의 이해도를 우선했습니다.
- source_word: וְעֻגָבִי
  english_pob_choice: my pipe
  chosen_korean: 내 피리
  alternatives_korean:
  - 내 플루트
  - 내 관악기
  - 내 퉁소
  lexicon: HALOT
  rationale: עוּגָב은 정확한 형태가 불확실한 관악기로, ‘피리’가 일반적이고 간명한 대응어입니다. 지나치게 특정한 악기명은 원문의 불확실성을 가릴 수 있습니다.
- source_word: לְקוֹל בֹּכִים
  english_pob_choice: the sound of those who weep
  chosen_korean: 우는 자들의 소리
  alternatives_korean:
  - 우는 이들의 소리
  - 곡하는 자들의 소리
  - 울음소리
  lexicon: HALOT
  rationale: לְקוֹל은 ‘~의 소리’라는 전환/대응 관계를 나타내므로 이를 그대로 살렸습니다. בֹּכִים은 현재 분사로, 울고 있는 사람들을 가리켜 ‘우는 자들’이 자연스럽습니다.
theological_decisions:
- issue: 시적 역전의 표현 방식
  chosen_reading: 악기가 단순히 ‘슬프다’가 아니라 애통과 울음의 소리로 바뀌었다는 역전을 직접적으로 표현했습니다.
  alternative_readings:
  - 내 수금은 슬픔이 되었습니다
  - 내 피리는 울음에 맞추어졌습니다
  rationale: 본문은 탄식의 정서를 설명하는 것이 아니라, 음악의 기쁨이 애도의 표지로 전도된 상황을 말합니다. 따라서 상태 변화와 청각적 대체를 모두 드러내는 번역이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 문학적/시적 표현의 보존
