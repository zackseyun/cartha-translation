  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
  footnotes:
  - marker: a
    text: Or 'my harp has become mourning.' The Hebrew כִּנּוֹר can denote a lyre or harp-like stringed instrument.
    reason: lexical_alternative
  - marker: b
    text: Or 'my flute.' The Hebrew עוּגָב refers generally to a wind instrument, and its exact form is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 수금[a]은 애통이 되었고, 내 피리[b]는 우는 이들의 소리가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּנּוֹר는 ‘수금’ 또는 하프와 비슷한 현악기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עוּגָב은 대체로 관악기를 가리키며, 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: has become
  chosen_korean: 되었고
  alternatives_korean:
