  rationale: אֵבֶל은 장례적 ‘애도/애통’의 상태를 가리키므로, ‘슬픔’보다 더 강하고 의례적인 뉘앙스의 ‘애통’이 적합합니다.
- source_word: כִּנֹּרִי
  english_pob_choice: my lyre
  chosen_korean: 내 수금
  alternatives_korean:
  - 내 비파
  - 내 리라
