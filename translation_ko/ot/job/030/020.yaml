  source_fidelity: 첫 절의 שׁוע는 도움을 구하는 강한 부르짖음으로 ‘주께 부르짖다’가 적절합니다. ענה는 ‘제게 대답하다’로 목적 대상을 밝혀 옮기는 것이 자연스럽습니다. עמדתי는 문법상 완료형이나 문맥상 현재적·생생한 표현으로도 가능하므로 본문은 현재적 표현을 유지하고, 과거 읽기는 각주로 제시합니다. התבונן은 단순히 보다보다 ‘주의 깊게 살피다/고려하다’의 뜻을 낼 수 있어 ‘살펴보다’가 적절합니다.
  naturalness: 초안의 ‘서 있사오나’, ‘보시나이다’는 현대 표준어 합쇼체로는 지나치게 고풍스럽고 문체가 혼합되어 있습니다. 또한 본문의 두 번째 절과 각주의 인용문이 사실상 동일하여 대안 독법을 제시하지 못합니다. 현대 합쇼체로 통일하고 각주의 과거시제 대안을 명확히 해야 합니다.
