  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
  footnotes:
  - marker: a
    text: Or 'In want and hunger, they are withered; they scrape at the dry land by night, in desolation and waste.' Several words in this verse are rare and difficult, especially 'gaunt' and 'gnawing.'
    reason: lexical_alternative
  - marker: b
    text: '''אֶמֶשׁ'' often means ''yesterday'' or ''last night''; here it is taken more broadly as ''in the night'' to fit the poetic context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 궁핍과 배고픔으로 말라붙어, 황무지와 폐허의 밤에 마른 땅을 갉아먹습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 קשה한 어휘들을 반영하면 ‘궁핍과 배고픔으로 야위어, 마른 땅을 밤에 갉아먹는다’ 정도로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: אֶמֶשׁ는 보통 ‘어젯밤’ 또는 ‘지난밤’ 뜻이지만, 여기서는 시적 문맥에 따라 더 넓게 ‘밤’으로 이해했습니다.
    reason: lexical_alternative
