  text: 그러나 이제 저는 그들의 노래[a]가 되었고, 그들에게는 말거리[b]가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 노래’이며, 문맥상 조롱하는 노래를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘말’ 또는 ‘말거리’를 뜻합니다. 여기서는 사람을 두고 경멸하며 입에 올리는 말거리를 가리킬 수 있습니다.
    reason: lexical_alternative
