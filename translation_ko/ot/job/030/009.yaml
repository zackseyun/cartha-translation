theological_decisions:
- issue: Job의 수치를 드러내는 두 번째 절구의 강도
  chosen_reading: ‘비웃음거리’로 옮겨 단순한 평판 저하가 아니라 조롱의 대상이 된 상태를 분명히 했습니다.
  alternative_readings:
  - ‘말거리’로 더 중립적으로 옮김
  - ‘속담거리’로 더 관용구적으로 옮김
  rationale: 히브리어 לְמִלָּה는 단순한 ‘말’이 아니라 사람을 두고 조롱 섞인 말로 소비되는 상황을 가리키므로, 문맥의 수치와 멸시를 보존하는 번역이 적절합니다.
  doctrine_reference: 문맥상 지혜문학의 탄식과 수치 표현
- issue: נְגִינָתָם의 조롱 뉘앙스 처리
  chosen_reading: 기본어휘를 따라 ‘노래’로 두고, 조롱성은 전체 문맥에서 읽히도록 했습니다.
  alternative_readings:
  - ‘조롱 노래’로 명시
  - ‘희롱의 노래’로 의역
  rationale: 히브리어가 기본적으로 ‘노래/선율’을 뜻하므로, 본문 자체의 어휘를 유지하는 것이 사본 언어에 더 충실합니다. 멸시의 의미는 문맥이 지지합니다.
  doctrine_reference: 문맥 기반 어휘 보존
