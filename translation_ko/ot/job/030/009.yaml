translation:
  language: ko
  text: 그리고 이제 저는 그들의 노래가 되었고, 그들에게는 비웃음거리가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 노래’이지만, 문맥상 조롱의 노래를 뜻할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘비유/말’에 가까우며, 여기서는 사람을 두고 조롱 섞인 말거리로 삼는 뜻입니다.
    reason: lexical_alternative
