id: JOB.30.26
reference: Job 30:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י ט֣וֹב קִ֭וִּיתִי וַ/יָּ֣בֹא רָ֑ע וַֽ/אֲיַחֲלָ֥ה לְ֝/א֗וֹר וַ/יָּ֥בֹא אֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
  footnotes:
  - marker: a
    text: Or 'calamity'/'disaster' for 'evil'; the Hebrew רָע here likely refers to adversity rather than moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 좋은 것을 바랐으나 재앙[a]이 왔고, 빛을 기다렸으나 어둠이 왔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악’, ‘불행’. 여기서 히브리어 רָע은 도덕적 악보다 닥쳐오는 재앙이나 불행을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋은 것
  alternatives_korean:
  - 선한 것
  - 복된 것
  - 좋음
  lexicon: HALOT
  rationale: 여기서는 명사적으로 쓰인 ‘good’의 넓은 의미를 살리면서, 뒤의 ‘악’과의 대비가 자연스럽게 드러나도록 ‘좋은 것’으로 옮겼습니다.
- source_word: קִוִּיתִי
  english_pob_choice: I hoped
  chosen_korean: 바라였으나
  alternatives_korean:
  - 기대하였으나
  - 희망하였으나
  - 기다렸으나
  lexicon: HALOT
  rationale: ‘hopeful expectation’의 뉘앙스를 살리기 위해 단순한 기다림보다 소망 섞인 바람을 나타내는 ‘바라다’를 택했습니다.
- source_word: רָע
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 재앙
  - 불행
  - 재난
  lexicon: HALOT
  rationale: 이 단어는 욥기 문맥에서 도덕적 악보다 재난·불행을 가리킬 수 있지만, 본문의 강한 대조를 보존하기 위해 ‘악’을 기본값으로 두었습니다.
- source_word: אֲיַחֲלָה
  english_pob_choice: I waited
  chosen_korean: 기다렸으나
  alternatives_korean:
  - 바랐으나
  - 고대하였으나
  - 기다리었으나
  lexicon: HALOT
  rationale: 앞의 ‘바라다’와 중복을 피하면서도, 앞으로 올 밝은 상태를 기대하며 대기하는 의미를 자연스럽게 살리기 위해 ‘기다리다’를 사용했습니다.
- source_word: לְאוֹר / אֹפֶל
  english_pob_choice: for light / darkness
  chosen_korean: 빛 / 어둠
  alternatives_korean:
  - 광명 / 흑암
  - 밝음 / 어두움
  lexicon: HALOT
  rationale: 히브리어의 직접 대비를 그대로 살리기 위해 ‘빛’과 ‘어둠’을 대응시켰고, 지나친 해석어인 ‘광명’이나 ‘흑암’은 피했습니다.
theological_decisions:
- issue: רָע의 의미 범위
  chosen_reading: ‘악’이라고 직역하되, 독자가 욥기의 문맥에서 그것이 주로 재앙·불행의 뜻일 수 있음을 주석으로 알 수 있게 했습니다.
  alternative_readings:
  - 재앙
  - 불행
  - 재난
  rationale: 본문의 날카로운 대조를 약화시키지 않으면서도, 욥기의 한탄 맥락에서 이 শব্দ이 지닌 실제 의미 범위를 보존하려는 선택입니다.
  doctrine_reference: 욥기 30장의 탄식적 문맥
- issue: 두 절구의 대조 구조
  chosen_reading: ‘좋은 것/악’과 ‘빛/어둠’의 병렬을 유지해 기대와 현실의 반전을 드러냈습니다.
  alternative_readings:
  - 좋음/재앙
  - 빛/흑암
  rationale: 히브리어의 평행법을 살려, 욥의 절망이 단순한 정보가 아니라 정서적 충격으로 전달되도록 했습니다.
  doctrine_reference: 히브리 시가의 평행법
