  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
  footnotes:
  - marker: a
    text: Or 'you will return me to death.' The verb carries the sense of causing someone to return.
    reason: lexical_alternative
  - marker: b
    text: Or 'the house appointed for all the living'; possibly a poetic reference to the grave or Sheol as the destination common to every person.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 당신이 나를 죽음으로 데려가시고, 모든 살아 있는 자를 위한 정해진 집으로 데려가실 줄 압니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘돌아오게 하다/되돌리다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 살아 있는 자를 위한 정해진 집’은 스올이나 무덤을 가리키는 시적 표현일 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי / יָדַעְתִּי
  english_pob_choice: For I know
  chosen_korean: 나는 … 줄 압니다
  alternatives_korean:
  - 나는 …을 압니다
  - 내가 …을 압니다
  lexicon: HALOT
  rationale: ידעתי의 확신을 한국어 현재형으로 자연스럽게 옮기되, כִּי의 인과/설명 기능은 문맥상 생략 없이 앞 절과 이어지게 했습니다.
- source_word: תְּשִׁיבֵנִי
  english_pob_choice: you will bring me to death / you will bring me back to death
  chosen_korean: 나를 죽음으로 데려가시고
  alternatives_korean:
  - 나를 죽음으로 돌이키시고
  - 나를 죽음으로 되돌리시고
  lexicon: HALOT
  rationale: הִפעיל of שוב가 지닌 ‘돌아오게 하다/되돌리다’의 뜻을 살리되, 한국어에서는 ‘죽음으로 데려가시고’가 문맥상 가장 자연스럽고도 목적지를 분명히 드러냅니다.
- source_word: מָוֶת
  english_pob_choice: death
  chosen_korean: 죽음
  alternatives_korean:
  - 사망
  - 죽음의 상태
  lexicon: HALOT
  rationale: 히브리어 명사 자체의 직접적 의미를 따라 ‘죽음’으로 옮겼습니다. 장차의 지옥/스올을 앞서 해석하기보다 본문이 말하는 보편적 종착지를 드러냅니다.
- source_word: בֵית מוֹעֵד
  english_pob_choice: the house appointed
  chosen_korean: 정해진 집
  alternatives_korean:
  - 정해진 곳
  - 정해진 처소
  - 모임의 집
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/지정된’ 의미를 살리고, ‘집’ 이미지를 유지해 모든 살아 있는 자에게 공통된 목적지라는 시적 표현을 보존했습니다.
- source_word: לְכָל חָי
  english_pob_choice: for every living one
  chosen_korean: 모든 살아 있는 자
  alternatives_korean:
  - 모든 생명 있는 자
  - 모든 살아 있는 사람
  lexicon: HALOT
  rationale: 히브리어의 보편성을 한국어 관용에 맞게 풀어 ‘모든 살아 있는 자’로 옮겼습니다. 단수적 집합 표현의 포괄성을 유지합니다.
theological_decisions:
- issue: ‘죽음’과 ‘정해진 집’의 이미지
  chosen_reading: 본문은 모든 인간의 공통 종착지로서의 죽음을 말하며, 이를 ‘정해진 집’이라는 시적 은유로 표현합니다.
  alternative_readings:
  - 스올이나 무덤을 더 구체적으로 가리킨다고 볼 수 있습니다.
  - ‘죽음으로 다시 돌아가게 하신다’는 순환적 표현으로 읽을 수 있습니다.
  rationale: 히브리어 본문은 스올을 직접 명시하지 않고 ‘죽음’과 ‘정해진 집’만 말하므로, 한국어도 그 긴장을 보존하면서 과도한 교리적 구체화를 피했습니다.
  doctrine_reference: 시적 은유와 종말 이미지 해석
