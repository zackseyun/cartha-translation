id: JOB.30.2
reference: Job 30:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם כֹּ֣חַ יְ֭דֵי/הֶם לָ֣/מָּה לִּ֑/י עָ֝לֵ֗י/מוֹ אָ֣בַד כָּֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/002.yaml
  text: Even the strength of their hands—what is it to me? Their vigor has perished[a].
  footnotes:
  - marker: a
    text: Or 'their prime has perished,' taking the rare Hebrew noun as referring to mature age or full strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 손의 힘도 내게 무슨 소용이 있습니까? 그들의 기력은 사라졌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 전성기가 사라졌습니다’로도 옮길 수 있는데, 희귀한 히브리어 명사를 성숙한 나이 또는 전성기를 가리키는 말로 이해한 경우입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 도
  alternatives_korean:
  - 심지어
  - 또한
  lexicon: HALOT
  rationale: 문맥상 추가적이면서도 다소 냉소적인 강조를 나타내므로 조사 ‘도’가 자연스럽고 간결하게 그 뉘앙스를 살립니다.
- source_word: כֹּחַ יְדֵיהֶם
  english_pob_choice: the strength of their hands
  chosen_korean: 그들의 손의 힘
  alternatives_korean:
  - 그들의 손의 능력
  - 그들의 손힘
  lexicon: HALOT
  rationale: 손을 통해 드러나는 실제적인 노동 능력을 살리는 직역에 가깝게 옮겼고, ‘힘’으로 물리적 역량을 보존했습니다.
- source_word: לָמָה לִּי
  english_pob_choice: what is it to me?
  chosen_korean: 내게 무슨 소용이 있습니까?
  alternatives_korean:
  - 내게 무슨 상관이 있습니까?
  - 왜 내가 신경 써야 합니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문형의 거절/무관심 표현을 한국어의 관용적 질문으로 옮겨, 단순한 정보 요청이 아니라 ‘나와 무슨 관련이 있느냐’는 뉘앙스를 보존했습니다.
- source_word: כָּלַח
  english_pob_choice: vigor
  chosen_korean: 기력
  alternatives_korean:
  - 전성기
  - 장성한 힘
  - 원기
  lexicon: HALOT
  rationale: EN POB가 이 희귀어를 ‘vigor’로 이해한 점을 따라, 나이든 성숙기보다 여기서는 사용 가능한 신체적 기세가 사라졌다는 의미를 드러내는 ‘기력’을 선택했습니다.
theological_decisions:
- issue: 욥의 발언을 도덕적 판단이 아니라 자기 변호의 냉소적 수사로 어떻게 보존할지
  chosen_reading: 이 절은 욥이 사람들의 육체적 능력이 이제 자신에게 아무 유익도 없다고 말하는 냉소적 수사로 읽었습니다.
  alternative_readings:
  - 사회적 약자를 깎아내리는 일반적 발언으로 읽는 해석
  - 단순한 관찰 진술로 완화하는 해석
  rationale: 히브리어의 ‘내게 무슨 소용이 있습니까?’는 관계적 무익함을 강조하는 수사 의문형이므로, 정서적 톤을 약화시키지 않고 그대로 옮기는 것이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 욥기 30장 문맥의 발화 화행(수사 의문, 탄식/변호)
