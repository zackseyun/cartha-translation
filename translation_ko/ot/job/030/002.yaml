  source_fidelity: 히브리어의 강조 첨가사 גַּם, ‘그들의 손의 힘’(כֹּחַ יְדֵיהֶם), 수사적 무익 표현 לָמָה לִּי, 그리고 ‘그들의 기력은 사라졌다’(עָלֵימוֹ אָבַד כָּלַח)를 충실히 반영합니다. 희귀어 כָּלַח의 의미상 불확실성도 각주에서 적절히 보존했습니다.
  naturalness: ‘그들의 손의 힘도 내게 무슨 소용이 있습니까?’는 현대 표준 한국어의 합쇼체로 자연스럽고, 욥의 냉소적 수사 의문을 잘 드러냅니다. ‘기력은 사라졌습니다’도 문맥상 매끄럽습니다.
  terminology: ‘힘’과 ‘기력’은 각각 노동·신체 역량과 상실된 활력을 구분하여 적절히 옮겼습니다. ‘전성기’ 및 ‘성숙한 나이’라는 각주의 대안은 כָּלַח에 대한 주요 어휘적 가능성을 무리 없이 제시합니다.
