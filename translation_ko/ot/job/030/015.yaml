  - 내 도움
  - 내 평안
  lexicon: HALOT
  rationale: ישועה의 넓은 의미를 살려 ‘구원’으로 옮기되, 종교적 교리어로만 좁아지지 않도록 문맥상 상실된 ‘구출/안녕’ 가능성도 열어 두었습니다.
theological_decisions:
- issue: יְשֻׁעָתִי의 신학적 과잉 해석 가능성
  chosen_reading: ‘구원’은 유지하되, 문맥상 일반적 구출과 안녕의 의미도 열어 둡니다.
  alternative_readings:
  - 내 구출
  - 내 평안
  - 내 도움
  rationale: 욥기의 탄식에서 ישועה는 후대 구원론의 전문 용어로 고정되지 않으므로, 원문의 폭을 유지하면서도 신학적 과잉을 피하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
