  - 내 존귀함
  - 내 지위
  lexicon: HALOT
  rationale: נדיב/נדיבה 계열이 가리킬 수 있는 ‘고귀한 지위, 존귀한 상태’를 반영해, 사회적 신분과 품격을 함께 담는 ‘고귀함’을 택했습니다.
- source_word: יְשֻׁעָתִי
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
