source:
  edition: WLC
  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
  footnotes:
  - marker: a
    text: Or 'my nobility,' 'my prosperity,' or 'my honor.' The Hebrew term refers to an exalted or honorable condition.
    reason: lexical_alternative
  - marker: b
    text: Or 'my deliverance' or 'my welfare.' The Hebrew can denote rescue or well-being as well as salvation.
    reason: lexical_alternative
translation:
  language: ko
  text: 공포들이 내 위에 뒤집어졌습니다[a]. 그것들은 바람처럼 내 고귀함[b]을 뒤쫓고, 내 구원은 구름처럼 지나가 버립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 고귀함’, ‘내 번영’, ‘내 명예’로도 옮길 수 있습니다. 이 히브리어는 높고 존귀한 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 구출’이나 ‘내 안녕’으로도 옮길 수 있습니다. 이 히브리어는 구원, 구조, 복리의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ / בַּלָּהוֹת
  english_pob_choice: Terrors are turned upon me
  chosen_korean: 공포들이 내 위에 뒤집어졌습니다
  alternatives_korean:
  - 두려움들이 내 위에 임했습니다
  - 공포가 내 위에 덮쳤습니다
  lexicon: HALOT
  rationale: הָהְפַּךְ의 수동적 뒤집힘/전도 의미를 살려 ‘뒤집어졌습니다’로 옮겼고, בַּלָּהוֹת는 복수 감각을 반영해 ‘공포들이’로 처리했습니다.
- source_word: תִּרְדֹּף
  english_pob_choice: they pursue
  chosen_korean: 뒤쫓고
  alternatives_korean:
  - 추격하고
  - 쫓고
  lexicon: HALOT
  rationale: רדף의 핵심 의미인 ‘추격하다/뒤쫓다’를 직역하되, 시적 병행구에서 자연스럽게 읽히도록 현재형 연결로 옮겼습니다.
- source_word: נְדִבָתִי
  english_pob_choice: my nobility / my dignity
  chosen_korean: 내 고귀함
  alternatives_korean:
  - 내 품위
  - 내 존귀함
  - 내 지위
  lexicon: HALOT
  rationale: נדיב/נדיבה 계열이 가리킬 수 있는 ‘고귀한 지위, 존귀한 상태’를 반영해, 사회적 신분과 품격을 함께 담는 ‘고귀함’을 택했습니다.
- source_word: יְשֻׁעָתִי
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 내 구출
  - 내 도움
  - 내 평안
  lexicon: HALOT
  rationale: ישועה의 넓은 의미를 살려 ‘구원’으로 옮기되, 종교적 교리어로만 좁아지지 않도록 문맥상 상실된 ‘구출/안녕’ 가능성도 열어 두었습니다.
theological_decisions:
- issue: יְשֻׁעָתִי의 신학적 과잉 해석 가능성
  chosen_reading: ‘구원’은 유지하되, 문맥상 일반적 구출과 안녕의 의미도 열어 둡니다.
  alternative_readings:
  - 내 구출
  - 내 평안
  - 내 도움
  rationale: 욥기의 탄식에서 ישועה는 후대 구원론의 전문 용어로 고정되지 않으므로, 원문의 폭을 유지하면서도 신학적 과잉을 피하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
