source:
  edition: WLC
  text: בֵּין שִׂיחִ֥ים יִנְהָ֑קוּ תַּ֖חַת חָר֣וּל יְסֻפָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/007.yaml
  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
  footnotes:
  - marker: a
    text: Or 'they are gathered together' / 'they cower together.' The Hebrew verb suggests being clustered or pressed together; the exact nuance is uncertain in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'under the thornbush' / 'under the bramble.' The precise plant named by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 덤불 사이에서 그들은 나귀처럼 울며, 쐐기풀[b] 아래에서 바짝 모여 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한데 모여 있습니다’ / ‘웅크리고 있습니다’. 히브리어 동사는 한데 모이거나 빽빽하게 붙어 있는 상태를 암시하며, 문맥상 정확한 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가시덤불 아래’ / ‘찔레덤불 아래’. 히브리어가 가리키는 식물의 정확한 종류는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין / שִׂיחִים
  english_pob_choice: among the bushes
  chosen_korean: 덤불 사이에서
  alternatives_korean:
  - 덤불들 가운데
  - 관목들 사이에서
  lexicon: HALOT
  rationale: בֵּין은 ‘사이/가운데’의 뜻이고 שִׂיחִים은 낮은 관목류를 가리키므로, 한국어에서는 자연스럽게 ‘덤불 사이에서’로 옮겨 소박한 황야의 이미지를 살렸습니다.
- source_word: יִנְהָקוּ
  english_pob_choice: they bray
  chosen_korean: 당나귀처럼 울부짖고
  alternatives_korean:
  - 울고
  - 소리치고
  - 나귀처럼 울고
  lexicon: HALOT
  rationale: נהק는 본래 당나귀의 울음소리를 가리키므로, 단순한 ‘울다/소리치다’보다 ‘당나귀처럼 울부짖다’가 동물화된 비참함과 거친 음향을 더 직접적으로 드러냅니다.
- source_word: חָרוּל
  english_pob_choice: nettles
  chosen_korean: 쐐기풀
  alternatives_korean:
  - 가시덤불
  - 찔레덤불
  - 잡풀
  lexicon: HALOT
  rationale: 식물의 정확한 종은 불확실하지만, POB의 ‘nettles’에 맞추어 한국어에서도 불쾌하고 거친 야생 식생을 떠올리게 하는 ‘쐐기풀’을 택했습니다.
- source_word: יְסֻפָּחוּ
  english_pob_choice: they huddle together
  chosen_korean: 서로 바짝 모여 있습니다
  alternatives_korean:
  - 서로 모여 있습니다
  - 떼지어 있습니다
  - 서로 웅크리고 있습니다
  lexicon: HALOT
  rationale: 수동/집합적 형태는 ‘모여 붙다, 한데 몰리다’의 뉘앙스를 가지므로, 단순한 ‘모여 있습니다’보다 궁핍하고 위축된 상태를 담는 ‘서로 바짝 모여 있습니다’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 비하적 동물 이미지의 보존
  chosen_reading: ‘당나귀처럼 울부짖고’로 번역해 사람을 짐승에 비유하는 경멸적 뉘앙스를 그대로 살렸습니다.
  alternative_readings:
  - 부드럽게 ‘울부짖고’만 번역하기
  - ‘신음하고’로 완화하기
  rationale: 본문은 단순한 소음이 아니라 인간의 몰락과 조롱을 드러내는 표현이므로, 의미를 누그러뜨리지 않고 원문의 모욕적 이미지를 보존하는 것이 중요합니다.
  doctrine_reference: 문학적/신학적 정직성 원칙
- issue: 동사상의 상태 표현
  chosen_reading: ‘서로 바짝 모여 있습니다’로 현재형 상태를 살려 궁핍한 피난처의 장면을 제시했습니다.
  alternative_readings:
  - ‘서로 모여 있습니다’
  - ‘서로 웅크리고 있습니다’
  rationale: 히브리어의 집합·응집 뉘앙스를 한국어에서 가장 자연스럽게 전달하면서도, 장면의 비참함을 과장하지 않도록 균형을 맞췄습니다.
  doctrine_reference: 문학적/서술적 충실성 원칙
