  text: תִּֽ֭עֲבוּ/נִי רָ֣חֲקוּ מֶ֑/נִּי וּ֝/מִ/פָּנַ֗/י לֹא חָ֥שְׂכוּ רֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
  footnotes:
  - marker: a
    text: Literally, 'they do not hold back spit from my face.' The Hebrew expression conveys an open act of contempt directed at Job personally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 저를 혐오하고, 저에게서 멀리 떠나며, 제 얼굴 앞에 침 뱉기를 조금도 주저하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 얼굴에서/면전에서 침을 보류하지 않는다’는 뜻으로, 욥을 향한 노골적인 모욕 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  english_pob_choice: they abhor me
  chosen_korean: 그들은 저를 혐오하고
  alternatives_korean:
  - 그들은 저를 역겨워하고
  - 그들은 저를 몹시 싫어하고
  lexicon: HALOT
  rationale: תעב는 강한 혐오·경멸을 뜻하므로, 현대 한국어에서 강도와 태도를 함께 살리는 ‘혐오하다’를 택했습니다.
- source_word: רָחֲקוּ מֶנִּי
  english_pob_choice: they keep far from me
  chosen_korean: 저에게서 멀리 떠나며
  alternatives_korean:
  - 저에게서 멀리 떨어져 있으며
  - 저를 멀리하며
  lexicon: HALOT
  rationale: רחק는 단순 거리뿐 아니라 관계적 소원함도 드러내므로, 물리적·사회적 거리감을 함께 보이는 표현으로 옮겼습니다.
- source_word: לֹא חָשְׂכוּ רֹק
  english_pob_choice: they do not hold back spitting
  chosen_korean: 침 뱉기를 조금도 주저하지 않습니다
  alternatives_korean:
  - 침을 뱉는 것을 조금도 삼가지 않습니다
  - 침 뱉기를 조금도 아끼지 않습니다
  lexicon: HALOT
  rationale: חׂשׂך는 ‘보류하다/삼가다/주저하다’의 뜻이어서, 한국어에서는 행위의 무절제함을 드러내는 ‘주저하지 않습니다’로 자연스럽게 살렸습니다.
- source_word: וּמִפָּנַי
  english_pob_choice: before my face
  chosen_korean: 제 얼굴 앞에
  alternatives_korean:
  - 제 앞에서
  - 제 얼굴 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘내 얼굴/면전에서’이므로, 모욕의 직접성을 보이기 위해 면전의 의미를 살린 표현을 택했습니다.
theological_decisions:
- issue: 모욕 행위의 강도와 직접성
  chosen_reading: ‘침 뱉기’를 단순한 무례가 아니라 욥 개인을 향한 공개적 멸시로 드러나게 옮겼습니다.
  alternative_readings:
  - ‘침을 뱉습니다’
  - ‘침을 뱉는 것을 삼가지 않습니다’
  rationale: 히브리어 표현은 단순 행위 묘사보다 노골적 경멸을 강조하므로, 한국어에서도 그 공격성과 공개성을 보존했습니다.
  doctrine_reference: 고난받는 의인의 수치와 조롱을 사실적으로 드러내는 욥기의 문맥
