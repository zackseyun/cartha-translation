theological_decisions:
- issue: 마지막 절의 관계절 처리
  chosen_reading: ‘그의 재난 속에 구원의 부르짖음이 있다면’으로, 히브리어의 난해한 조건절을 완전히 매끈하게 풀기보다 불확실성을 남겼습니다.
