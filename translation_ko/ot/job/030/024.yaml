  - marker: a
    text: Or, 'Surely one does not stretch out a hand to a ruin-heap; if in his disaster there is a cry for help.' The Hebrew of this verse is difficult, especially the phrases rendered 'against a ruin' and 'from them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 사람이 폐허를 향해 손을 내밀겠습니까? 그의 재난 속에 구원의 부르짖음이 있다면 더욱 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘사람이 폐허 더미를 향해 손을 내밀겠습니까? 그의 재난 속에 구원의 부르짖음이 있다면.’ 히브리어는 이 절에서 특히 ‘폐허’와 뒷부분의 관계가 어렵습니다.
    reason: alternative_reading
