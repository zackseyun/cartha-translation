    rationale: אַךְ는 이 문맥에서 강조·단언의 기능이 강합니다. ‘그런데’는 원문에 없는 역접적 전환을 도입합니다.
  - severity: medium
    issue: 수사 의문문과 ‘더욱 그렇습니다’의 첨가
    rationale: 원문과 영어 감사본은 ‘손을 내밀지 않는다’는 부정 진술 및 난해한 조건절을 제시합니다. 수사 의문문은 어조를 강화하고, ‘더욱 그렇습니다’는 본문에 명시되지 않은 결론을 추가합니다.
  - severity: low
    issue: 각주가 לָהֶן의 난해성을 충분히 특정하지 않음
    rationale: 문맥상 관계가 어려운 말이 있음을 언급하되, ‘그들에게/그들로부터’ 등으로 이해될 수 있는 형태가 있다는 점을 밝혀 독자가 본문 생략이 임의적 확정이 아님을 알 수 있게 하는 편이 낫습니다.
