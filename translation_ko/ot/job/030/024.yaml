revisions:
- from: 그런데 사람이 폐허를 향해 손을 내밀겠습니까? 그의 재난 속에 구원의 부르짖음이 있다면 더욱 그렇습니다.[a]
  to: 참으로 사람이 폐허를 향해 손을 내밀지는 않습니다. 그가 재난을 당할 때 도움을 청하는 부르짖음이 있다면 말입니다.[a]
  rationale: 강조사 אַךְ를 ‘참으로’로 바로 옮기고, 원문에 없는 역접·수사 의문·추론적 결론을 제거했습니다. 난해한 조건절은 매끈하게 해설하지 않고 ‘…있다면 말입니다’로 그 미완의 연결을 보존했습니다. 각주는 בְּעִי와 לָהֶן을 포함한 구문의 불확실성을 명시하여 대안적 이해를 제시합니다.
