  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
  footnotes:
  - marker: a
    text: Or, 'Surely one does not stretch out a hand to a ruin-heap; if in his disaster there is a cry for help.' The Hebrew of this verse is difficult, especially the phrases rendered 'against a ruin' and 'from them.'
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 사람이 폐허를 향해 손을 내밀지는 않습니다. 그가 재난을 당할 때 도움을 청하는 부르짖음이 있다면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘참으로 사람이 폐허 더미에 손을 내밀지는 않습니다. 그가 파멸을 당할 때 도움을 청하는 부르짖음이 있다면 말입니다.’ 히브리어 본문은 이 절에서 매우 어렵습니다. 특히 ‘폐허’로 옮긴 말과 뒷부분의 관계, 그리고 ‘그들에게’ 또는 ‘그들로부터’로 이해될 수 있는 말의 뜻과 연결이 불확실합니다.
    reason: alternative_reading
