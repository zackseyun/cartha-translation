id: JOB.30.12
reference: Job 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
  footnotes:
  - marker: a
    text: Or 'a rabble rises up'; the Hebrew פִּרְחַח is a rare term for a contemptible or unruly group.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they send my feet away.' The sense may be that they drive his feet off course or trip him up.
    reason: lexical_alternative
  - marker: c
    text: Or 'they cast up against me their paths of calamity/ruin.' The Hebrew keeps the road-building metaphor in a hostile sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 오른쪽에 한 무리의 패거리가 일어나고, 그들이 내 발을 밀어내며, 내게 맞서 자기들의 재앙의 길을 닦아 놓습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל יָמִין
  english_pob_choice: On my right
  chosen_korean: 오른쪽에
  alternatives_korean:
  - 내 오른쪽에
  - 오른편에
  lexicon: HALOT
  rationale: 방향과 위치를 간결하게 살리되, 한국어에서 자연스러운 전치 표현으로 처리했습니다. 원문의 대조적·적대적 배치도 문맥상 유지됩니다.
- source_word: פִּרְחַח
  english_pob_choice: a brood
  chosen_korean: 한 무리의 패거리
  alternatives_korean:
  - 한 떼의 족속
  - 한 무리의 난폭한 자들
  - 한 패거리
  lexicon: HALOT
  rationale: 희귀한 멸시어로서 무리 전체를 비하하는 뉘앙스를 살리기 위해 중립적 ‘무리’에 경멸적 ‘패거리’를 더했습니다. 단순한 ‘무리’만으로는 원문의 경멸감이 약합니다.
- source_word: רַגְלַי שִׁלֵּחוּ
  english_pob_choice: they send my feet away
  chosen_korean: 그들이 내 발을 밀어내며
  alternatives_korean:
  - 그들이 내 발을 내쫓으며
  - 그들이 내 발을 떠밀어 내며
  - 그들이 내 발을 길 밖으로 밀어내며
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 발을 보내다/풀어놓다’이지만, 영어 POB의 판단처럼 발을 궤도 밖으로 몰아내는 뜻이므로 한국어에서는 자연스럽고 가시적인 ‘밀어내다’로 옮겼습니다. 과도한 의역인 ‘발을 헛디디게 하다’는 피했습니다.
- source_word: וַיָּסֹלּוּ ... אָרְחוֹת אֵידָם
  english_pob_choice: they build up against me their paths of disaster
  chosen_korean: 내게 맞서 자기들의 재앙의 길을 닦아 놓습니다
  alternatives_korean:
  - 내게 맞서 자기들의 재앙의 길을 쌓아 올립니다
  - 내게 맞서 파멸의 길을 닦아 놓습니다
  - 내게 맞서 재앙의 길을 만들어 갑니다
  lexicon: HALOT
  rationale: סלל의 도로를 ‘닦다/쌓다’는 이미지를 살리면서, ‘paths’와 ‘against me’를 함께 드러냈습니다. ‘재앙의 길’은 אֵיד의 파멸·재난 의미를 비교적 직역적으로 반영합니다.
theological_decisions:
- issue: 시편적 적대 이미지의 보존
  chosen_reading: 원문의 공간적 적대성(오른쪽)과 보행 방해(내 발을 밀어냄), 도로 건설 은유(길을 닦아 놓음)를 그대로 유지했습니다.
  alternative_readings:
  - 단순히 ‘나를 방해한다’로 평탄화하는 읽기
  - ‘함정을 놓는다’로 은유를 바꾸는 읽기
  rationale: 이 절은 적대자들의 공격을 공간·보행·도로 이미지로 층층이 묘사하므로, 의미를 일반화하면 시각적 긴장과 시적 힘이 약해집니다.
  doctrine_reference: 시적 본문 번역 원칙; 원문 은유 보존
- issue: 멸시어 פִּרְחַח의 한국어 처리
  chosen_reading: ‘패거리’로 경멸적 집단성을 살리되, ‘한 무리’로 수량감도 유지했습니다.
  alternative_readings:
  - ‘족속’으로 혈연 뉘앙스를 주는 읽기
  - ‘난폭한 자들’로 성격을 설명하는 읽기
  rationale: 원문은 도덕적 평가를 담은 집합명사이므로, 한국어에서도 평가적 뉘앙스를 드러내되 본문이 말하는 집단성을 유지하는 쪽이 적절합니다.
  doctrine_reference: 어휘-수사 보존
