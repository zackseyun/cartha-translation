  source_fidelity: ‘오른쪽에’는 히브리어 עַל יָמִין의 관계적·공간적 용법에서 화자와의 관계가 충분히 드러나지 않으므로 ‘내 오른쪽에서’가 더 충실합니다. פִּרְחַח의 경멸적 집단 의미는 ‘한 패거리’로 자연스럽게 보존됩니다. רַגְלַי שִׁלֵּחוּ는 난해한 표현이므로 본문에서는 ‘내 발을 밀어 내고’로 이미지를 유지하되, 직역 및 가능한 의미를 주석으로 밝혀야 합니다. וַיָּסֹלּוּ의 길을 돋우어 만드는 은유는 ‘길을 닦습니다’로 보존했습니다.
  naturalness: ‘한 무리의 패거리’는 의미가 겹치고 다소 부자연스럽습니다. ‘한 패거리’가 간결하고 현대 표준어 문맥에 맞습니다. 또한 ‘닦아 놓습니다’는 원문에 없는 완료·결과의 뉘앙스를 더할 수 있어 현재의 시적 서술에는 ‘닦습니다’가 더 적절합니다.
  terminology: ‘패거리’는 פִּרְחַח의 멸시적 집단성을 반영하며 지나치게 속되지 않습니다. ‘재앙의 길’은 אָרְחוֹת אֵידָם의 소유·연결 관계가 지닌 해석 여지를 유지합니다. ‘나를 향해’는 적대적 עָלַי를 자연스럽게 전달합니다.
