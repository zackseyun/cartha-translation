  - 내게 맞서 재앙의 길을 만들어 갑니다
  lexicon: HALOT
  rationale: סלל의 도로를 ‘닦다/쌓다’는 이미지를 살리면서, ‘paths’와 ‘against me’를 함께 드러냈습니다. ‘재앙의 길’은 אֵיד의 파멸·재난 의미를 비교적 직역적으로 반영합니다.
theological_decisions:
- issue: 시편적 적대 이미지의 보존
  chosen_reading: 원문의 공간적 적대성(오른쪽)과 보행 방해(내 발을 밀어냄), 도로 건설 은유(길을 닦아 놓음)를 그대로 유지했습니다.
  alternative_readings:
  - 단순히 ‘나를 방해한다’로 평탄화하는 읽기
  - ‘함정을 놓는다’로 은유를 바꾸는 읽기
  rationale: 이 절은 적대자들의 공격을 공간·보행·도로 이미지로 층층이 묘사하므로, 의미를 일반화하면 시각적 긴장과 시적 힘이 약해집니다.
  doctrine_reference: 시적 본문 번역 원칙; 원문 은유 보존
- issue: 멸시어 פִּרְחַח의 한국어 처리
  chosen_reading: ‘패거리’로 경멸적 집단성을 살리되, ‘한 무리’로 수량감도 유지했습니다.
  alternative_readings:
  - ‘족속’으로 혈연 뉘앙스를 주는 읽기
  - ‘난폭한 자들’로 성격을 설명하는 읽기
  rationale: 원문은 도덕적 평가를 담은 집합명사이므로, 한국어에서도 평가적 뉘앙스를 드러내되 본문이 말하는 집단성을 유지하는 쪽이 적절합니다.
  doctrine_reference: 어휘-수사 보존
