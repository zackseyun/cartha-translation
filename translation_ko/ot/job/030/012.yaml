  lexicon: HALOT
  rationale: 문자적으로는 ‘내 발을 보내다/풀어놓다’이지만, 영어 POB의 판단처럼 발을 궤도 밖으로 몰아내는 뜻이므로 한국어에서는 자연스럽고 가시적인 ‘밀어내다’로 옮겼습니다. 과도한 의역인 ‘발을 헛디디게 하다’는 피했습니다.
- source_word: וַיָּסֹלּוּ ... אָרְחוֹת אֵידָם
  english_pob_choice: they build up against me their paths of disaster
  chosen_korean: 내게 맞서 자기들의 재앙의 길을 닦아 놓습니다
  alternatives_korean:
  - 내게 맞서 자기들의 재앙의 길을 쌓아 올립니다
