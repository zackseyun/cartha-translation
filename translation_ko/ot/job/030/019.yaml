  lexicon: HALOT
  rationale: חֹמֶר는 이 문맥에서 점토보다 더럽고 굴욕적인 ‘진흙/수렁’의 이미지를 띠므로, 현대 한국어에서 자연스럽고 비하 감각이 살아 있는 표현을 택했습니다.
- source_word: וָאֶתְמַשֵּׁל
  english_pob_choice: I have become
  chosen_korean: 저는 … 되었습니다
