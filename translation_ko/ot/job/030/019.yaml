  lexicon: HALOT
  rationale: 반사·수동적 뉘앙스를 지닌 동사를 결과 상태로 풀어, 앞절의 ‘던져짐’ 이후의 처지를 자연스러운 한국어로 연결했습니다.
- source_word: כֶּעָפָ֥ר וָאֵפֶר
  english_pob_choice: like dust and ashes
  chosen_korean: 먼지와 재처럼
