translation:
  language: ko
  text: 그분은 저를 진흙 속으로 던지셨고, 저는 먼지와 재처럼 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹמֶר는 문맥에 따라 ‘점토’, ‘진흙’, ‘수렁’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘먼지와 재처럼’ 또는 ‘먼지와 재로 여겨지게 되었습니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָ֥נִי
  english_pob_choice: He has thrown me
  chosen_korean: 저를 던지셨고
  alternatives_korean:
