  - 먼지와 재 같이
  - 흙먼지와 재처럼
  lexicon: HALOT
  rationale: 성경적 관용구인 ‘먼지와 재’를 한국어에서도 직관적으로 들리게 옮기되, סימיל레의 비교감각을 살렸습니다.
theological_decisions:
- issue: 히브리어의 암시적 3인칭 남성 단수 주어
  chosen_reading: 문맥상 하느님을 가리키는 ‘그분’으로 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 채 번역
  - ‘누군가가’처럼 비인칭 처리
  rationale: 욥의 탄식 맥락에서 행위 주체는 문맥상 하나님이므로, 히브리어의 암시된 주어를 한국어에서 읽히게 하되 과도하게 설명하지 않았습니다.
  doctrine_reference: 문맥적 지시 대상 처리
- issue: ‘먼지와 재’의 이미지
  chosen_reading: 죽음·비천함을 연상시키는 성경적 비유로 그대로 유지했습니다.
  alternative_readings:
  - ‘아주 초라하게’처럼 의미만 풀기
  - 현대적 비유로 완화
  rationale: 원문의 굴욕과 소멸 이미지를 약화시키지 않기 위해 익숙한 성경적 표현을 유지했습니다.
  doctrine_reference: 시적·상징적 이미지 보존
