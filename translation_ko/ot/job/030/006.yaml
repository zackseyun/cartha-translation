  - marker: a
    text: Or 'In the ravines of the streambeds they dwell'; Hebrew נְחָלִים can denote wadis, torrent-beds, or valleys depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'in holes of the earth and in the crags.'
