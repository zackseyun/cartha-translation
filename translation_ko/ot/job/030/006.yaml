translation:
  language: ko
  text: 그들은 골짜기 사이의 협곡에 살고, 흙의 구덩이와 바위들 가운데에 삽니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내 골짜기의 협곡에’; 히브리어 נְחָלִים은 문맥에 따라 와디, 급류 골짜기, 또는 계곡을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘흙의 구멍과 바위들 가운데에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  english_pob_choice: in the gullies
  chosen_korean: 골짜기 사이의 협곡에
  alternatives_korean:
  - 협곡에
  - 도랑들에
  - 깎인 골짜기에
  lexicon: HALOT
  rationale: עָרוּץ는 물에 의해 파인 골짜기나 골짜기 모양의 통로를 가리키므로, 자연스럽고 현대적인 이미지인 ‘협곡’으로 옮기되 위치 관계를 살려 ‘골짜기 사이의’로 보완했습니다.
- source_word: נְחָלִים
  english_pob_choice: of the wadis
  chosen_korean: 골짜기
  alternatives_korean:
  - 와디의
  - 마른 개울의
  - 시내들의
  lexicon: HALOT
  rationale: נחל은 건기에는 마르는 와디/계곡형 물길을 뜻하므로, 한국어 독자가 바로 이해할 수 있는 지형 표현인 ‘골짜기’로 풀어 근동적 지형감을 살렸습니다.
- source_word: חֹרֵי עָפָר
  english_pob_choice: holes of the dust
  chosen_korean: 흙의 구덩이
  alternatives_korean:
  - 먼지의 구멍
  - 땅의 구덩이
  - 흙구덩이
  lexicon: HALOT
  rationale: 직역하면 ‘먼지의 구멍들’이지만 한국어에서는 어색하므로, עָפָר의 낮고 비천한 땅의 감각을 유지하면서도 자연스러운 ‘흙의 구덩이’로 옮겼습니다.
- source_word: וְכֵפִים
  english_pob_choice: among the rocks
  chosen_korean: 바위들 가운데에
  alternatives_korean:
  - 바위들 사이에
  - 바위벽들 가운데에
  - 바위틈에
  lexicon: HALOT
  rationale: כֵפִים는 바위/바위덩이들을 가리키므로, 단순한 물체 나열이 아니라 거처의 위치를 드러내는 한국어 표현으로 ‘바위들 가운데에’를 택했습니다.
theological_decisions:
- issue: 거처 묘사의 사회적·신체적 비참함을 얼마나 직접적으로 드러낼지
  chosen_reading: 직접적인 구제 표현을 피하고, ‘골짜기 사이의 협곡’, ‘흙의 구덩이’, ‘바위들 가운데’라는 지형어로 원문의 거친 생활상을 그대로 드러냈습니다.
  alternative_readings:
  - ‘동굴’이나 ‘바위굴’처럼 피난처 느낌을 주는 표현
  - ‘산속에서 산다’처럼 완화된 표현
  rationale: 이 절은 배척당한 자들의 처지를 지리적 이미지로 적나라하게 묘사하므로, 위협적이고 비참한 정조를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Job 30장의 고난 묘사와 시적 이미지 보존
