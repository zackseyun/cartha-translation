id: JOB.30.5
reference: Job 30:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן גֵּ֥ו יְגֹרָ֑שׁוּ יָרִ֥יעוּ עָ֝לֵ֗י/מוֹ כַּ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/005.yaml
  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
  footnotes:
  - marker: a
    text: Or 'They shout against them like a thief,' with the subject of 'shout' left unspecified in Hebrew.
    reason: lexical_alternative
  - marker: b
    text: '''Ravine'' may also be rendered ''valley'' or ''gorge.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 골짜기에서 쫓겨나며, 사람들은 도둑에게 하듯 그들을 향해 소리칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’는 여기서 גֵּו의 지형적 의미를 살린 번역입니다. 문맥상 ‘협곡’ 또는 ‘골’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 복수형이지만, 소리치는 이들이 누구인지는 본문에서 특정하지 않습니다. ‘사람들은’은 이를 자연스럽게 드러낸 해석상 보충입니다.
    reason: source_note
lexical_decisions:
- source_word: מִן גֵּו
  english_pob_choice: from the midst / ravine
  chosen_korean: 골짜기에서
  alternatives_korean:
  - 산골짜기에서
  - 깊은 골짜기에서
  - 그 한가운데에서
  lexicon: HALOT
  rationale: גֵּו는 이 문맥에서 사람들의 거처가 되는 험한 지형을 가리키므로, 한국어에서는 자연스럽고 지형감을 살리는 '골짜기'로 옮겼습니다. '한가운데'는 문맥상 부자연스럽고, 'ravine'의 지형적 뉘앙스를 약화시킵니다.
- source_word: יְגֹרָשׁוּ
  english_pob_choice: are driven out
  chosen_korean: 쫓겨나고
  alternatives_korean:
  - 몰려나고
  - 추방되고
  - 내쫓기고
  lexicon: HALOT
  rationale: גרש의 수동적 강제 축출 의미를 살려, 상태 서술이 자연스러운 '쫓겨나고'로 옮겼습니다.
- source_word: יָרִיעוּ
  english_pob_choice: people shout
  chosen_korean: 사람들이 ... 소리칩니다
  alternatives_korean:
  - 그들이 소리칩니다
  - 외칩니다
  - 고함칩니다
  lexicon: HALOT
  rationale: 히브리어는 주어가 명시되지 않으므로, 영어 POB의 해석을 따라 한국어에서는 자연스러운 무정칭 주어 '사람들이'를 보이되, 본문이 가리키는 공공의 야유를 살렸습니다.
- source_word: כַּגַּנָּב
  english_pob_choice: as after a thief
  chosen_korean: 도둑에게 하듯
  alternatives_korean:
  - 도둑처럼
  - 도둑을 쫓듯
  - 도둑에게 하는 것처럼
  lexicon: HALOT
  rationale: כַּגַּנָּב는 단순 비교가 아니라 도둑을 향한 경고·추격의 관습적 반응을 시사하므로, 한국어에서는 그 행동을 드러내는 '도둑에게 하듯'으로 풀어 옮겼습니다.
theological_decisions:
- issue: 이 구절의 주어가 명시되지 않은 '소리침'을 어떻게 처리할지
  chosen_reading: 본문의 공적 야유를 드러내기 위해 '사람들이'를 보였지만, 이는 해석상 보충이며 원문이 직접 제시한 명시 주어는 아닙니다.
  alternative_readings:
  - 주어를 생략해 '그들 뒤에서 도둑에게 하듯 소리칩니다'로 둘 수 있음
  - '''그들에게 소리칩니다''로 방향만 표현할 수 있음'
  rationale: 히브리어 동사의 주어가 비어 있어 번역상 자연화가 필요하지만, 원문의 모호성을 지우지 않도록 과도한 특정화는 피했습니다.
  doctrine_reference: 문학적·해석학적 처리 원칙
