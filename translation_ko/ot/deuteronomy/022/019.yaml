  source_fidelity: 수정이 필요합니다. נַעֲרָה(젊은 여자)와 בְּתוּלָה(처녀)를 본문에서 구별해야 하며, שֵׁם רָע의 관용구는 한국어로 ‘나쁜 소문’을 퍼뜨리다와 같이 자연스럽게 옮기는 것이 적절합니다. לְשַׁלְּחָהּ는 혼인 해소를 뜻할 수 있으나 문자적 ‘내쫓다’보다 중립적인 ‘떠나보내다’가 원문의 표현과 모호성을 더 잘 보존합니다.
  naturalness: 초안의 ‘악한 이름을 퍼뜨리다’는 현대 한국어에서 부자연스럽고 뜻이 불명확합니다. 또한 ‘내쫓다’는 원문보다 강한 강제 축출의 뉘앙스를 더합니다. 수정문은 현대적 법률·서사 문체의 합쇼체로 자연스럽습니다.
