  text: וְ/עָנְשׁ֨וּ אֹת֜/וֹ מֵ֣אָה כֶ֗סֶף וְ/נָתְנוּ֙ לַ/אֲבִ֣י הַֽ/נַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֔ה לֹא יוּכַ֥ל לְ/שַּׁלְּחָ֖/הּ כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
  footnotes:
  - marker: a
    text: Or 'divorce her'; the Hebrew literally says 'send her away,' a common expression for marital dismissal in legal contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 그에게 은 백 세겔의 벌금을 부과하고, 그 돈을 그 처녀의 아버지에게 줄 것입니다. 이는 그가 이스라엘의 처녀에게 악한 이름을 퍼뜨렸기 때문입니다. 그녀는 그의 아내가 될 것이며, 그는 평생 그녀를 내쫓을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이혼시킬 수 없습니다.” 히브리어는 문자적으로 “보내다/내보내다”라고 말하지만, 혼인 해소의 관용구로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  english_pob_choice: they shall fine
  chosen_korean: 벌금을 부과하고
  alternatives_korean:
  - 벌을 내리고
  - 형벌을 가하고
  lexicon: HALOT
  rationale: 법률 문맥에서 כסף와 함께 나타나므로 일반적 처벌보다 금전 제재를 뜻하는 것이 자연스럽습니다. “벌금을 부과하고”가 법적 강제를 가장 분명하게 드러냅니다.
- source_word: מֵאָה כֶסֶף
  english_pob_choice: one hundred shekels of silver
  chosen_korean: 은 백 세겔
  alternatives_korean:
  - 은 백 개
  - 은 백 은전
  lexicon: HALOT
  rationale: 히브리어의 축약된 화폐표현을 한국어에서도 관용적으로 풀어 “세겔”로 옮겼습니다. “은 백 세겔”은 액수와 재화 성격을 모두 유지합니다.
- source_word: שֵׁם רָע
  english_pob_choice: a bad name
  chosen_korean: 악한 이름을 퍼뜨렸기
  alternatives_korean:
  - 나쁜 이름을 퍼뜨렸기
  - 악평을 퍼뜨렸기
  - 악명을 지었기
  lexicon: HALOT
  rationale: 직역인 “나쁜 이름”보다 한국어에서 법적·명예 훼손 뉘앙스를 살리면서도 원문의 이름/평판 이미지를 유지하는 표현으로 잡았습니다. “퍼뜨렸기”는 히브리어의 ‘밖으로 내보내다’라는 확산 뉘앙스를 반영합니다.
- source_word: לְשַׁלְּחָהּ
  english_pob_choice: send her away
  chosen_korean: 내쫓을 수 없습니다
  alternatives_korean:
  - 보낼 수 없습니다
  - 떠나보낼 수 없습니다
  - 이혼시킬 수 없습니다
  lexicon: HALOT
  rationale: 원문은 문자적으로 “보내다/내보내다”이지만, 혼인 해소의 법적 관용구입니다. 본문은 일상적 한국어로 그 결과를 드러내는 “내쫓다”를 택하되, 더 직접적인 “이혼시킬 수 없습니다”는 주해적 대안으로 남길 수 있습니다.
theological_decisions:
- issue: 혼인 해소 관용구의 처리
  chosen_reading: “내쫓을 수 없습니다”로 옮겨 법적 결론을 분명히 하되, 원문의 ‘보내다’ 관용을 완전히 지우지는 않습니다.
  alternative_readings:
  - “떠나보낼 수 없습니다”
  - “이혼시킬 수 없습니다”
  rationale: 히브리어 לְשַׁלְּחָהּ는 법률 문맥에서 이혼/해소를 가리킬 수 있으므로, 한국어 본문은 의미를 분명히 전달해야 합니다. 다만 본문에서 법적 관용구의 강도를 반영해 원문의 제재성을 살리는 방향을 택했습니다.
  doctrine_reference: Translation philosophy 1, 3, 5
