  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
  footnotes:
  - marker: a
    text: Or, 'the young woman is guilty of no capital offense.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'so is this matter'—that is, this case is comparable to murder committed by assault.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 젊은 여자에게는 아무 일도 하지 마십시오[a]. 그 젊은 여자는 죽어 마땅한 죄를 짓지 않았습니다[b]. 이는 한 사람이 자기 이웃에게 달려들어 그를 죽이는 경우와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 젊은 여자는 죽을 만한 범죄가 없다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이 일은 곧…과 같다’는 뜻으로, 이 사건을 폭력에 의한 살인과 비교합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  english_pob_choice: But to the young woman
  chosen_korean: 그러나 그 젊은 여자에게는
  alternatives_korean:
  - 그리고 그 젊은 여자에게는
  - 그 젊은 여자에게는
  lexicon: HALOT
  rationale: 앞 절의 남자에 대한 판결과 대비되는 접속을 살려 ‘그러나’로 옮기고, משפט 문맥의 נַעַר를 ‘젊은 여자’로 옮겨 연령감과 법적 맥락을 함께 보존했습니다.
- source_word: לֹא תַעֲשֶׂה דָבָר
  english_pob_choice: you shall do nothing
  chosen_korean: 아무 일도 하지 마십시오
  alternatives_korean:
  - 아무것도 하지 마십시오
  - 그에게 아무것도 하지 마십시오
  lexicon: HALOT
  rationale: 법적 금지의 절대성을 살리되, 한국어에서 자연스러운 금지 표현으로 옮겼습니다. 직접 대상이 문맥상 여자이므로 불필요한 목적어는 덧붙이지 않았습니다.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  english_pob_choice: the young woman has committed no sin deserving death
  chosen_korean: 그 젊은 여자는 죽어 마땅한 죄를 짓지 않았습니다
  alternatives_korean:
  - 그 젊은 여자는 죽음에 해당하는 죄가 없습니다
  - 그 젊은 여자에게는 죽을 죄가 없습니다
  lexicon: HALOT
  rationale: 직역의 ‘죽음의 죄’보다 히브리어 המשפט 관용구의 법적 힘을 한국어로 분명히 드러내기 위해 ‘죽어 마땅한 죄’로 옮겼습니다. 이는 형벌 가능성의 부재를 말하는 표현입니다.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ וּרְצָחוֹ נֶפֶשׁ
  english_pob_choice: when a man rises against his neighbor and murders him
  chosen_korean: 이는 한 사람이 자기 이웃에게 달려들어 그를 죽이는 경우와 같습니다
  alternatives_korean:
  - 이는 한 사람이 자기 이웃을 공격하여 죽이는 경우와 같습니다
  - 사람이 자기 이웃에게 일어나 그를 죽이는 것과 같습니다
  lexicon: HALOT
  rationale: ‘일어나다’의 공격적 법정 의미를 한국어에서 자연스럽게 드러내기 위해 ‘달려들어’로 옮겼고, רצח은 불법 살인을 가리키므로 ‘죽이다’보다 강하게 ‘죽이는’으로 표현했습니다. 비교절의 의미를 분명히 하기 위해 ‘경우와 같습니다’를 사용했습니다.
theological_decisions:
- issue: 여자의 무죄 진술의 범위
  chosen_reading: 이 구절은 그 여자에게 형벌을 받을 만한 법적 죄책이 없다고 말하며, 더 넓은 도덕적 평가를 확장해서 말하지는 않습니다.
  alternative_readings:
  - 완전한 도덕적 무죄를 선언한다고 읽을 수 있음
  rationale: 히브리어의 ‘죽음의 죄 없음’은 이 사건의 사법적 판단을 가리키는 관용구이므로, 번역도 법적 책임의 부재를 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve the text''s plain sense without importing doctrinal claims.'
