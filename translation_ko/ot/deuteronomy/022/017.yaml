base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
  footnotes:
  - marker: a
    text: Hebrew literally, “I did not find virginities for your daughter,” an idiom meaning that he claims she was not a virgin.
    reason: lexical_alternative
  - marker: b
    text: Or “tokens/evidence of my daughter’s virginity.”
    reason: lexical_alternative
  - marker: c
    text: The “garment” refers to the cloth presented as legal evidence in this case.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 그가 내 딸을 헐뜯는 말을 하며 ‘내가 당신의 딸에게서 처녀였다는 증거를 찾지 못했다’라고 말합니다.[a] 그러나 이것들이 내 딸의 처녀성의 증거입니다.[b] 그들은 그 옷을 성읍의 장로들 앞에 펼칠 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “내가 당신의 딸에게서 처녀성들을 찾지 못했다”입니다. 이는 그가 그 딸이 처녀가 아니었다고 주장한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 딸의 처녀성의 표지들/증거물들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 “옷”은 이 사건에서 법적 증거로 제시되는 천을 가리킵니다.
    reason: cultural_note
