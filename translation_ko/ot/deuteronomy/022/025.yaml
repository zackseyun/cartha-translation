    issue: 처벌 대상이 ‘그 사람’으로 표현됨
    rationale: 히브리어는 두 차례 הָאִישׁ(그 남자)를 명시합니다. ‘그 사람’도 문맥상 이해되지만, 여성과 남성의 법적 처우를 대조하는 이 절에서는 ‘그 남자’가 더 충실하고 분명합니다.
  - severity: medium
    issue: 법률적 결과가 단순 미래형으로 표현됨
    rationale: וּמֵת는 이 법조문에서 처방적 결과입니다. ‘죽을 것입니다’보다 ‘죽어야 합니다’가 법적 의무·판결의 뉘앙스를 더 잘 전달합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 위치함
    rationale: 각주의 설명과 대안은 וְהֶחֱזִיק בָּהּ(그 여자를 붙잡고)에 관한 것이므로 해당 표현 직후에 표지하는 것이 앵커를 명확히 합니다.
