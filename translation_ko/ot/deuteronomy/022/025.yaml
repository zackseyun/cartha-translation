revisions:
- from: 그러나 들판에서 사람이 그 약혼한 젊은 여자를 만나 그 여자를 붙잡고 그 여자와 동침하면, 그 여자와 동침한 그 사람만 죽을 것입니다.[a]
  to: 그러나 들판에서 어떤 남자가 약혼한 젊은 여자를 만나, 그 남자가 그 여자를 붙잡고[a] 동침하면, 그 여자와 동침한 그 남자만 죽어야 합니다.
  rationale: ‘남자’를 명시하여 원문의 성별 지시와 법적 대조를 보존하고, 법조문의 처방적 결론을 ‘죽어야 합니다’로 옮겼습니다. 각주 표지는 ‘붙잡고’에 붙이고, 각주 문구를 자연스러운 현대 한국어로 다듬었습니다. 본문에는 원문의 어휘 범위를 넘어서는 ‘강간’이라는 분류어를 넣지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:13Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건·대조 구조, ‘들판’, 약혼한 젊은 여자, 붙잡음, 성관계, 그리고 처벌이 남자에게만 적용된다는 뜻은 대체로 충실히 반영했습니다. 다만 결론의 ‘그 사람’은 원문의 성별이 명시된 ‘그 남자’를 약화시키며, 법률적 결과인 וּמֵת는 한국어에서 ‘죽어야 합니다’로 옮기는 편이 더 정확합니다.
  naturalness: 전반적으로 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘그 여자와 동침한 그 사람만 죽을 것입니다’보다 ‘그 여자와 동침한 그 남자만 죽어야 합니다’가 지시 대상과 법문체를 더 분명하게 합니다.
  terminology: ‘약혼한 젊은 여자’, ‘붙잡고’, ‘동침하다’는 적절합니다. 성폭력을 본문에서 원문보다 좁은 법률 용어로 단정하지 않고, 각주에서 문맥상 비합의성을 설명한 처리도 적절합니다. 각주는 ‘붙잡고’ 바로 뒤에 붙여 해당 어휘의 대안을 명확히 가리켜야 합니다.
  issues:
