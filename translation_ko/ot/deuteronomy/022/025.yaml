source:
  edition: WLC
  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
  footnotes:
  - marker: a
    text: Or 'overpowers her' or 'rapes her'; the Hebrew says 'seizes her,' and the surrounding law makes clear that the act is non-consensual.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 들판에서 사람이 그 약혼한 젊은 여자를 만나 그 여자를 붙잡고 그 여자와 동침하면, 그 여자와 동침한 그 사람만 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자를 제압하면’, ‘그 여자를 강간하면’으로 옮길 수도 있습니다. 히브리어는 ‘붙잡다’라고 말하며, 앞뒤 법문맥은 이 행위가 합의되지 않은 것임을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 하면
  alternatives_korean:
  - 그리고 만일 … 하면
  - 만일 … 하면
  lexicon: HALOT
  rationale: 앞 절과 대조되는 법률 사례 전환이므로 ‘그러나’로 역접을 살리되, 조건문 구조는 그대로 유지했습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the open field
  chosen_korean: 들판에서
  alternatives_korean:
  - 밭에서
  - 벌판에서
  lexicon: HALOT
  rationale: 히브리어 שָׂדֶה의 기본 의미는 ‘들/밭’이지만, 이 문맥의 고립된 장소성을 자연스럽게 드러내기 위해 ‘들판에서’로 옮겼습니다.
- source_word: הַמְאֹרָשָׂה
  english_pob_choice: the young woman who is betrothed
  chosen_korean: 약혼한 젊은 여자
  alternatives_korean:
  - 약혼된 젊은 여자
  - 정혼한 젊은 여자
  lexicon: HALOT
  rationale: ארשׂ의 법적·관계적 의미를 현대 독자가 이해하기 쉬운 ‘약혼한’으로 옮기되, 본문의 강한 법적 구속력을 크게 흐리지 않도록 했습니다.
- source_word: וְהֶחֱזִיק בָּהּ
  english_pob_choice: seizes her
  chosen_korean: 붙잡고
  alternatives_korean:
  - 잡아
  - 억지로 붙들고
  - 제압하고
  lexicon: HALOT
  rationale: חזק의 핵심은 강제로 붙드는 행위이므로, 과도한 해석어를 피하면서도 강압성을 드러내는 ‘붙잡고’를 선택했습니다.
theological_decisions:
- issue: 동침 동사의 성격과 폭력성의 처리
  chosen_reading: 본문에는 직접적으로 ‘강간’이라는 법률 용어를 삽입하지 않고, ‘붙잡고’와 문맥 전체가 강제성을 드러내도록 두었습니다.
  alternative_readings:
  - 강간하면
  - 억지로 관계를 맺으면
  rationale: 히브리어는 전형적인 성행위 관용구와 함께 ‘붙잡다’만을 말하므로, 의미는 분명하되 원문보다 더 좁은 법률 분류어를 본문에 넣는 것은 피했습니다.
  doctrine_reference: 번역 철학 §§1, 3, 5
