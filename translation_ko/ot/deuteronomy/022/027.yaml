base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
  footnotes:
  - marker: a
    text: Or 'in the open country.' The Hebrew phrase refers to a rural, isolated setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'there was no one to save her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 들판에서 그 여자를 발견했습니다[a]. 그 약혼한 젊은 여자는 소리쳤지만[b] 그녀를 구해 줄 사람이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빈들에서’입니다. 히브리어 표현은 외딴 농촌의 열린 장소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀를 구해 줄 사람이 없었습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판에서
  alternatives_korean:
  - 밭에서
  - 시골에서
  - 빈들에서
  lexicon: HALOT
  rationale: 히브리어는 외딴 농촌의 열린 공간을 가리키므로, 법적 맥락을 살리면서도 자연스러운 현대어인 ‘들판’으로 옮겼습니다.
- source_word: מְצָאָהּ
  english_pob_choice: he found her
  chosen_korean: 그 여자를 발견했습니다
  alternatives_korean:
  - 그를 만나게 했습니다
  - 그 여자를 만났습니다
  lexicon: HALOT
  rationale: 기본 동사 뜻인 ‘찾다/발견하다’를 살리되, 우발적 조우의 상황을 한국어로 분명하게 전달했습니다.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  english_pob_choice: the betrothed young woman
  chosen_korean: 그 약혼한 젊은 여자
  alternatives_korean:
  - 그 약혼한 처녀
  - 그 정혼한 젊은 여성
  lexicon: HALOT
  rationale: 법적 신분을 나타내는 ‘betrothed’는 한국어의 현대적 표현인 ‘약혼한’으로, 성별과 연령감은 ‘젊은 여자’로 옮겨 본문 의미를 직접 드러냈습니다.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  english_pob_choice: but there was no one to rescue her
  chosen_korean: 그녀를 구해 줄 사람이 없었습니다
  alternatives_korean:
  - 그녀를 구원할 사람이 없었습니다
  - 그녀를 살려 줄 사람이 없었습니다
  lexicon: HALOT
  rationale: 법정 문맥의 ‘rescuer’에 맞춰 ‘구해 줄 사람’으로 옮겼고, 신학적으로 과도하게 울릴 수 있는 ‘구원하다’는 피했습니다.
theological_decisions:
- issue: הַמְּאֹרָשָׂה의 혼인 전 법적 지위 표현
  chosen_reading: 약혼한
  alternative_readings:
  - 정혼한
  - 약혼된
  rationale: 본문의 핵심은 감정적 약속이 아니라 이스라엘 법에서의 공식적 혼인 예비 상태이므로, 현대어로 가장 이해하기 쉬우면서도 법적 무게를 유지하는 ‘약혼한’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: צָעֲקָה의 반응 표현
  chosen_reading: 소리쳤지만
  alternative_readings:
  - 외쳤지만
  - 비명을 질렀지만
  rationale: 히브리어는 단순한 소음이 아니라 도움을 부르는 절박한 외침을 뜻하므로, 한국어에서도 그 긴박함을 살리되 과도한 현대적 뉘앙스는 피했습니다.
  doctrine_reference: Translation philosophy §4
