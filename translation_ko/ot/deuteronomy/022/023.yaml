lexical_decisions:
- source_word: נער בְתוּלָה
  english_pob_choice: a young woman, a virgin
  chosen_korean: 정혼한 처녀
  alternatives_korean:
  - 젊은 여자이자 처녀
  - 어린 처녀
  lexicon: HALOT
  rationale: 나עַר/בְתוּלָה의 핵심은 혼인 가능한 처녀라는 사회적 법적 상태이며, 한국어에서는 이를 간결하게 ‘처녀’로 살리고 ‘정혼한’으로 결합된 상태를 드러내는 것이 문맥에 가장 맞습니다.
- source_word: מְאֹרָשָׂה לְאִישׁ
  english_pob_choice: pledged to a man
  chosen_korean: 정혼한
  alternatives_korean:
  - 한 남자에게 약속된
  - 약혼한
  lexicon: HALOT
  rationale: 히브리어는 단순한 구두 약속이 아니라 법적으로 구속력 있는 정혼을 가리키므로, 현대 한국어에서 그 법적 강도를 가장 잘 보존하는 ‘정혼한’을 택했습니다.
- source_word: וּמְצָאָהּ אִישׁ
  english_pob_choice: and another man finds her
  chosen_korean: 어떤 사람이 그를 성읍에서 만나
  alternatives_korean:
  - 어떤 남자가 그녀를 만나
  - 또 다른 남자가 그녀를 발견하여
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘한 사람’이 그녀를 ‘발견하다/만나다’고 말하지만, 한국어에서는 사건 성격을 드러내기 위해 ‘만나’로 옮기되 과도한 해석은 피했습니다.
- source_word: וְשָׁכַב עִמָּהּ
  english_pob_choice: and lies with her
  chosen_korean: 그와 동침하면
  alternatives_korean:
  - 그와 잠자리를 같이하면
  - 그와 성관계를 가지면
  lexicon: HALOT
  rationale: 성행위를 뜻하는 완곡어법을 한국어 법문체에서도 비교적 직접적으로 보존하기 위해 ‘동침하다’를 택했습니다.
theological_decisions:
- issue: 이 구절에서 성행위의 강제성 여부를 명시할지
  chosen_reading: 강제성은 덧붙이지 않고, 단순히 동침한 경우로만 제시했습니다.
  alternative_readings:
  - 그를 강간하면
  - 그녀를 강제로 동침시키면
  rationale: 이 절 자체는 강제행위를 직접 표지하지 않으므로, 주변 절의 판단을 미리 끌어와 해석을 고정하지 않고 원문이 말하는 범위 안에서 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
