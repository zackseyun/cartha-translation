- from: 그때 젊은 여자와 그 어머니의 아버지가 그 젊은 여자의 처녀성의 증거를 가져다가 성문에 있는 그 도시의 장로들에게 내놓아야 합니다.[a]
  to: 그러면 그 젊은 여자의 아버지와 어머니는 그 젊은 여자의 처녀성의 증거를 가져가 성문에서 그 성의 장로들에게 내놓아야 합니다.[a]
  rationale: 주어를 원문의 소유·친족 관계에 맞게 ‘그 젊은 여자의 아버지와 어머니’로 바로잡았습니다. ‘가져가 … 내놓아야 합니다’는 취하여 가져와 제시한다는 법적 절차를 자연스럽게 반영합니다. 성문은 절차가 이루어지는 장소로 ‘성문에서’로 옮겼고, 처녀성 관련 표현은 본문에서 이해 가능한 관용적 의미로 번역하되 각주에서 문자적 복수형과 의미 범위를 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:11Z'
