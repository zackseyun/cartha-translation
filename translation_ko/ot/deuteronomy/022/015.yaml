  source_fidelity: 본문의 친족 관계가 잘못 옮겨졌습니다. 히브리어 אֲבִי הַנַּעַר וְאִמָּהּ는 ‘그 젊은 여자의 아버지와 그 어머니’이지, ‘젊은 여자와 그 어머니의 아버지’가 아닙니다. 또한 성문은 장로들이 있는 법정 장소이므로, 한국어에서는 장로들을 수식하기보다 ‘성문에서’로 처리하는 것이 원문의 절차적 장소를 더 정확히 나타냅니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체 법조문 문맥에 자연스럽습니다. ‘그 성의 장로들’과 ‘성문에서’는 고대 공동체의 재판 장소를 간결하고 명료하게 전달합니다.
  terminology: נַעֲרָה는 ‘젊은 여자’로 유지할 수 있습니다. בְּתוּלֵי는 문자적으로 복수형 ‘처녀성들’이나, 이 문맥에서는 처녀성을 입증하기 위해 제시되는 표지/증거를 가리키는 관용 표현이므로 본문에서는 ‘처녀성의 증거’로, 각주에서 문자적 표현과 관용성을 밝혀 두는 것이 적절합니다.
