translation:
  language: ko
  text: 그때 젊은 여자와 그 어머니의 아버지가 그 젊은 여자의 처녀성의 증거를 가져다가 성문에 있는 그 도시의 장로들에게 내놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 젊은 여자의 처녀성들’이라고 하며, 이 법정 문맥에서는 처녀성을 입증하는 물적 표지나 증거를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  english_pob_choice: the young woman’s father and her mother
  chosen_korean: 그 젊은 여자와 그 어머니의 아버지
  alternatives_korean:
  - 그 젊은 여자의 아버지와 어머니
  - 그 처녀의 아버지와 어머니
  lexicon: HALOT
  rationale: 나עַר/נערה 계열을 현대 한국어의 자연스러운 ‘젊은 여자’로 옮기고, 소유 관계를 분명히 하되 법조문식 문맥을 살려 가족 구성원을 제시했습니다.
- source_word: וְהוֹצִיאוּ אֶת בְּתוּלֵי הַנַּעַר
  english_pob_choice: bring out the evidence of the young woman’s virginity
  chosen_korean: 그 젊은 여자의 처녀성의 증거를 가져다가
  alternatives_korean:
  - 그 젊은 여자의 처녀성의 표를 내놓아
  - 그 젊은 여자의 처녀성의 증거물을 가져다가
  lexicon: HALOT
  rationale: 히브리어의 ‘처녀성들’이라는 관용구를 직역하기보다, EN POB의 해석을 따라 법정 증거라는 기능을 드러내는 ‘증거’로 옮겼습니다.
- source_word: אֶל זִקְנֵי הָעִיר
  english_pob_choice: to the elders of the city
  chosen_korean: 성문에 있는 그 도시의 장로들에게
  alternatives_korean:
  - 그 도시의 장로들에게
  - 성문에서 그 도시의 장로들에게
  lexicon: HALOT
  rationale: ‘장로들’은 재판 권위를 지닌 집단이므로 ‘도시의 장로들’로 두고, 문맥상 심판 장소인 ‘성문’을 함께 살렸습니다.
- source_word: הַשַּׁעְרָה
  english_pob_choice: at the gate
  chosen_korean: 성문에 있는
  alternatives_korean:
  - 성문에서
  - 성문 앞에 있는
  lexicon: HALOT
  rationale: ‘문’ 자체보다 공동체 재판이 이루어지는 장소 기능을 드러내기 위해 ‘성문에 있는’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 법적 절차의 공개성
  chosen_reading: 사적 주장이나 추정이 아니라, 공동체 앞에 제시되는 증거를 요구하는 공적 절차로 읽었습니다.
  alternative_readings:
  - 가족의 명예를 위한 관습적 확인
  - 단순한 풍속 규정
  rationale: 본문은 장로들과 성문을 지시하여, 개인적 변명이 아니라 공동체 법정에서 검증되는 절차임을 강조합니다.
  doctrine_reference: 공동체 재판과 증언의 공적 성격
