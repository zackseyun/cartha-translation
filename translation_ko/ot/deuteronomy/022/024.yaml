revisions:
- from: 그때에는 그 둘을 그 성의 문으로 끌어내어 돌로 쳐서 죽이십시오. 그 젊은 여인은 성 안에서 부르짖지 않았기 때문이고, 그 남자는 이웃의 아내를 욕보였기 때문입니다. 그렇게 해서 너희 가운데에서 악을 제거하십시오.[a][b][c]
  to: 그때에 그 둘을 그 성의 성문[c]으로 데리고 나가서 돌로 쳐 죽게 하십시오. 그 젊은 여인[a]은 성 안에서 부르짖지 않았기 때문이며, 그 남자는 자기 이웃의 아내를 욕보였기[b] 때문입니다. 이렇게 너희 가운데에서 악을 없애십시오.
  rationale: 원문의 사역 동사에 없는 ‘끌다’의 강제성을 제거하고, 처형 행위와 그 결과의 연결을 한국어로 명료하게 나타냈습니다. 이유 절을 자연스럽게 병렬화했으며, 모든 각주 표지를 해당 본문 어구에 직접 연결했습니다. 원문이 제시하는 법적 근거와 עִנָּה의 성적 침해·수치의 의미 범위는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:21Z'
review_pass:
  verdict: revise
  source_fidelity: ‘끌어내어’는 וְהוֹצֵאתֶם(사역형 ‘데리고/내보내다’)에 있는 강제적으로 끄는 뉘앙스를 더합니다. 또한 각주 표지가 해당 어구가 아니라 문장 끝에 한꺼번에 놓여 있어 연결 대상이 불분명합니다. ‘그 성의 성문’은 שַׁעַר הָעִיר הַהִוא를 자연스럽고 정확하게 나타냅니다.
  naturalness: 현대 표준어 합쇼체로 ‘데리고 나가십시오’, ‘돌로 쳐서 죽게 하십시오’, ‘없애십시오’를 사용하면 자연스럽습니다. 두 개의 ‘때문’ 절은 ‘때문이며’로 병렬 처리하는 것이 문법적으로 매끄럽습니다.
  terminology: ‘젊은 여인’은 문맥상 여성 단수인 הַנַּעַר를 적절히 반영합니다. עִנָּה에 대한 ‘욕보였기’는 성적 침해와 수치의 의미를 보존하면서 현대 법률 용어로 과도하게 한정하지 않습니다. ‘악을 ... 없애십시오’는 신명기의 정형적 משפט 표현을 자연스럽게 유지합니다.
