reference: Deuteronomy 22:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
  footnotes:
  - marker: a
    text: Or, 'the girl.' The Hebrew form here is written without the final he of the more explicit feminine spelling, but the following verb 'she did not cry out' shows that a female is meant.
    reason: lexical_alternative
  - marker: b
    text: Or, 'humiliated' or 'afflicted.' The Hebrew verb can denote sexual violation with accompanying humiliation; 'violated' is chosen here as the clearest modern rendering.
    reason: lexical_alternative
  - marker: c
    text: The city gate was the customary public place of legal proceedings and judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그때에 그 둘을 그 성의 성문[c]으로 데리고 나가서 돌로 쳐 죽게 하십시오. 그 젊은 여인[a]은 성 안에서 부르짖지 않았기 때문이며, 그 남자는 자기 이웃의 아내를 욕보였기[b] 때문입니다. 이렇게 너희 가운데에서 악을 없애십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊은 여인’으로 옮겼습니다. 히브리어 형태는 더 분명한 여성형 철자 없이 적혀 있지만, 뒤의 ‘성 안에서 부르짖지 않았다’가 여성을 가리킨다는 점을 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘욕보였다’는 히브리어 동사가 이 문맥에서 가지는 성적 침해와 수치의 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 성문은 고대 이스라엘의 공적 재판과 판결이 이루어지던 관습적 장소였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  english_pob_choice: you shall bring ... out
  chosen_korean: 끌어내어
  alternatives_korean:
  - 밖으로 데리고 내어
  - 끌고 나와
  lexicon: HALOT
  rationale: 출입을 지시하는 사역형 동사를 현대 한국어로 자연스럽게 옮기면서, 공적 재판을 위해 사람들을 밖으로 데려가는 강한 흐름을 살렸습니다.
- source_word: שַׁעַר הָעִיר הַהִוא
  english_pob_choice: the gate of that city
  chosen_korean: 그 성의 문
  alternatives_korean:
  - 그 도시의 문
  - 그 성문
  lexicon: HALOT
  rationale: 히브리어의 공적 재판 장소를 가리키는 표현을 간명하게 유지했습니다. 본문이 설명을 덧붙이지 않으므로 문구 자체를 살렸습니다.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  english_pob_choice: you shall stone them with stones
  chosen_korean: 돌로 쳐서
  alternatives_korean:
  - 돌로 치십시오
  - 돌을 던져 쳐서
  lexicon: HALOT
  rationale: 히브리어가 돌을 매개로 한 처형을 분명히 말하므로, 반복을 줄이면서도 행위의 가혹함을 드러내는 한국어로 옮겼습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여인
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: 문맥상 여성임이 분명하므로, 영어 POB처럼 성인성·연령 함의를 지나치게 좁히지 않는 ‘젊은 여인’을 택했습니다.
- source_word: עִנָּה אֶת אֵשֶׁת רֵעֵהוּ
  english_pob_choice: he violated his neighbor’s wife
  chosen_korean: 이웃의 아내를 욕보였기
  alternatives_korean:
  - 이웃의 아내를 강간했기
  - 이웃의 아내를 학대했기
  lexicon: HALOT
  rationale: ענה는 이 성문맥에서 성적 침해와 수치를 함께 내포하므로, ‘욕보이다’로 본문의 법적·윤리적 무게를 살리되 현대어로 과도한 특정 법률용어로 좁히지 않았습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: So you shall purge the evil from your midst
  chosen_korean: 그렇게 해서 너희 가운데에서 악을 제거하십시오
  alternatives_korean:
  - 너희 가운데에서 악을 깨끗이 없애십시오
  - 너희 중에서 악을 제거하십시오
  lexicon: HALOT
  rationale: 신명기의 반복 법식으로서 공동체 정화의 의미를 분명히 전달하되, 한국어에서 가장 자연스러운 행정·법률적 표현을 사용했습니다.
theological_decisions:
- issue: 여성의 책임 근거를 어떻게 드러낼 것인가
  chosen_reading: 성 안에서 부르짖지 않았기 때문
  alternative_readings:
  - 성 안에서 도움을 청하지 않았기 때문
  - 성 안에서 소리치지 않았기 때문
  rationale: 본문이 제시하는 법적 근거를 그대로 드러내기 위해, 출처가 말하는 ‘부르짖지 않았다’의 인과를 유지했습니다. 이는 본문 진술을 넘어서지 않습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עִנָּה의 성적 법률 맥락을 어떻게 번역할 것인가
  chosen_reading: 욕보였기
  alternative_readings:
  - 강간했기
  - 학대했기
  rationale: 히브리어의 의미 범위는 성적 침해와 수치를 함께 담고 있어, ‘욕보이다’가 본문을 과도하게 현대 법률 용어로 좁히지 않으면서도 무게를 유지합니다.
  doctrine_reference: Translation philosophy §1, §6
