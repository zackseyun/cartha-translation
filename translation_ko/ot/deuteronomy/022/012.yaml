  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
  footnotes:
  - marker: a
    text: Or 'twisted cords' or 'fringes' for 'tassels.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your covering'; alternatively 'your garment' or 'your cloak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 자기의 옷 가장자리에 술을 만들어야 합니다. 그 옷은 네 모서리에 술을 달아야 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘술’은 ‘꼬임끈’ 또는 ‘프린지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 옷’을 뜻하며, 문맥상 ‘당신의 겉옷’이나 ‘당신의 의복’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  english_pob_choice: tassels
  chosen_korean: 술
  alternatives_korean:
  - 술장식
  - 프린지
  - 꼬임끈
  lexicon: HALOT
  rationale: 옷에 달리는 규정된 장식물을 가리키므로, 현대 한국어에서 가장 자연스럽고 성경적 용례에도 잘 맞는 ‘술’을 택했습니다.
- source_word: תַּעֲשֶׂה
  english_pob_choice: you shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
  - 만드십시오
  - 만들 것입니다
  lexicon: HALOT
  rationale: 법규문맥의 2인칭 남성 단수 명령/의무를 한국어 합쇼체 의무 표현으로 옮겼습니다.
- source_word: כְּסוּתְךָ
  english_pob_choice: your covering
  chosen_korean: 자기의 옷
  alternatives_korean:
  - 당신의 덮개
  - 당신의 외투
  - 당신의 옷
  lexicon: HALOT
  rationale: ‘covering’의 직역인 ‘덮개’는 한국어에서 어색하므로, 문맥상 옷감을 가리키는 기능을 살려 ‘옷’으로 옮겼습니다.
- source_word: אַרְבַּע כַּנְפוֹת
  english_pob_choice: the four corners
  chosen_korean: 네 모서리
  alternatives_korean:
  - 네 귀퉁이
  - 네 가장자리
  - 네 날개
  lexicon: HALOT
  rationale: 의복의 끝부분을 뜻하므로 ‘corners’의 의미를 가장 분명하게 드러내는 ‘모서리’를 사용했습니다.
theological_decisions:
- issue: 이 절의 규정적 문장 형태를 한국어에서 어떻게 살릴지
  chosen_reading: 의무를 나타내는 합쇼체로 옮겨, 율법 조항의 규범성을 분명히 했습니다.
  alternative_readings:
  - 평서형으로 ‘만듭니다’라고 옮김
  - 명령형 ‘만드십시오’로 옮김
  rationale: 본문은 단순 서술이 아니라 법규적 지시이므로, 현대 한국어에서는 정중한 의무 표현이 가장 자연스럽고 स्रोत의 기능도 잘 드러냅니다.
  doctrine_reference: 신명기 율법 본문 문체
