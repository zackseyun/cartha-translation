base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
  footnotes:
  - marker: a
    text: Or, more literally, 'you shall surely let the mother go.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons'; in the context of a bird's nest, this means the young.
    reason: lexical_alternative
  - marker: c
    text: Or, more literally, 'and you may prolong days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어미를 반드시 놓아주어야 하지만, 새끼들은 너를 위해 잡을 수 있습니다. 그러면 네게 잘되고 네 날이 길어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어미를 반드시 놓아주어야 한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘아들들’이지만, 둥지 문맥에서는 새끼를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  english_pob_choice: must surely let ... go
  chosen_korean: 반드시 놓아주어야 합니다
  alternatives_korean:
  - 반드시 보내야 합니다
  - 꼭 놓아주어야 합니다
  lexicon: HALOT
  rationale: 분사-동사 결합의 강조를 한국어의 ‘반드시’로 살리되, 새 둥지 문맥에 맞게 ‘보내다’보다 ‘놓아주다’가 더 자연스럽습니다.
- source_word: הָאֵם
  english_pob_choice: the mother
  chosen_korean: 어미
  alternatives_korean:
  - 어미새
  - 어미
  lexicon: HALOT
  rationale: 문맥상 새의 어미이지만, 본문에 없는 ‘새’를 덧붙이지 않기 위해 간결하게 ‘어미’로 옮겼습니다.
- source_word: הַבָּנִים
  english_pob_choice: the young
  chosen_korean: 새끼들
  alternatives_korean:
  - 어린 것들
  - 새끼 새들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아들들’이지만 둥지 문맥에서는 새의 새끼를 가리키므로, 의미를 드러내는 ‘새끼들’이 가장 적절합니다.
- source_word: וְהַאֲרַכְתָּ יָמִים
  english_pob_choice: you may prolong your days
  chosen_korean: 네 날이 길어질 것입니다
  alternatives_korean:
  - 너는 날들을 연장할 것입니다
  - 네 날들을 길게 할 것입니다
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞는 표현으로 의미를 전달하면서도, ‘날이 길어지다’로 원문의 관용적 시간을 보존했습니다.
theological_decisions:
- issue: 순종에 따른 복의 성격
  chosen_reading: 이 절은 순종에 대한 결과/축복을 말하며, 개인별 수명의 기계적 보장을 단정하지 않습니다.
  alternative_readings:
  - 모든 경우에 적용되는 절대적 장수 약속
  rationale: לְמַעַן ... 구조는 목적·결과를 나타내므로, 본문이 말하는 축복의 진술을 유지하되 과도한 보증으로 확대하지 않았습니다.
  doctrine_reference: 언약적 축복 표현의 의미를 보존하되, 단순한 인과 공식으로 축소하지 않음
