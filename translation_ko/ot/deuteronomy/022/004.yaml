base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
  footnotes:
  - marker: a
    text: Literally, 'with him,' emphasizing that the person is to assist the owner rather than leave him unaided.
    reason: lexical_alternative
translation:
  language: ko
  text: 길에서 형제의 나귀나 소가 쓰러져 있는 것을 보고도 그것들을 외면해서는 안 됩니다. 반드시 그와 함께 그것들을 일으켜 세워야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그와 함께’라고 하여, 그 사람을 홀로 두지 말고 함께 도와 일으켜 세워야 함을 강조합니다.
    reason: lexical_alternative
