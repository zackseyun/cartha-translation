  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  lexicon: HALOT
  rationale: 현대 한국어에서 가장 자연스러운 성경적 동물명으로 ‘나귀’를 사용했습니다.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  english_pob_choice: and ignore them
  chosen_korean: 못 본 체해서는 안 됩니다
  alternatives_korean:
