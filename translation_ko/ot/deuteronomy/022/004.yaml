  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
  footnotes:
  - marker: a
    text: Literally, 'with him,' emphasizing that the person is to assist the owner rather than leave him unaided.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 길에서 넘어져 있는 형제의 나귀나 그의 소를 보게 되더라도 그것들을 못 본 체해서는 안 됩니다[a]. 반드시 그것들을 그와 함께 일으켜 세워야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들에게서 자신을 숨기다’라는 뜻이지만, 여기서는 그 상황을 의도적으로 외면하는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  english_pob_choice: your brother’s
  chosen_korean: 형제의
  alternatives_korean:
  - 동료 이스라엘 사람의
  - 친족의
  lexicon: HALOT
  rationale: 언약 공동체 안의 동족을 가리키는 직설적 표현을 살리기 위해 직역성 있는 ‘형제의’를 택했습니다.
- source_word: חֲמוֹר
