  - 외면해서는 안 됩니다
  lexicon: HALOT
  rationale: 히트파엘의 관용적 의미인 ‘의도적으로 외면하다/모른 체하다’를 한국어 관용구로 자연스럽게 옮겼습니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 더불어
  - 그와 함께하여
  lexicon: HALOT
  rationale: 영어 본문의 각주가 지적하듯 ‘함께’의 협력적 의미를 살려, 소유자를 배제하지 않고 동행하여 돕는 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 공동체 윤리의 수혜자 범위
  chosen_reading: ‘형제’는 단순한 친족보다 언약 공동체의 동족을 포함하는 표현으로 읽었습니다.
  alternative_readings:
  - 혈연 형제만 가리킴
  - 일반적인 이웃으로 완화함
  rationale: 신명기의 법문맥과 영어 POB의 ‘your brother’s’ 선택을 따라, 공동체 내부 상호책임의 강도를 보존했습니다.
  doctrine_reference: 언약 공동체 윤리
- issue: ‘못 본 체’의 윤리적 뉘앙스
  chosen_reading: 단순한 방관이 아니라 의도적 외면을 금지하는 것으로 옮겼습니다.
  alternative_readings:
  - 단순히 보지 말라는 금지
  - 관찰 자체의 금지
  rationale: 히브리어가 ‘외면하다/무시하다’는 적극적 회피를 뜻하므로, 본문의 도덕적 책임을 약화시키지 않도록 했습니다.
  doctrine_reference: 성경의 이웃 사랑과 상호책임
