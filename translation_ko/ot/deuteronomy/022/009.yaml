  lexicon: BDB / HALOT
  rationale: כרם은 표준적으로 ‘포도원’이며, 한국어에서도 가장 자연스럽고 확립된 대응입니다.
- source_word: כִּלְאָיִם
  english_pob_choice: two kinds of seed
  chosen_korean: 두 종류의 씨앗
  alternatives_korean:
