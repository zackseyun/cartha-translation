  lexicon: BDB / HALOT
  rationale: זרע는 씨를 ‘뿌리다’가 기본 뜻이므로, 농경법 문맥에서는 ‘심다’보다 ‘뿌리다’가 더 직접적입니다.
- source_word: כַּרְמְךָ
