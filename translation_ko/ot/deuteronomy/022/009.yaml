  - 온 수확
  lexicon: BDB / HALOT
  rationale: המלאה는 ‘충만함’에서 나온 말로 여기서는 결과물 전체, 곧 수확 전체를 가리키므로 ‘전체 수확물’이 적절합니다.
- source_word: וּתְבוּאַת הַכָּרֶם
  english_pob_choice: and the produce of the vineyard
  chosen_korean: 포도원의 소출
  alternatives_korean:
  - 포도원의 산출물
  - 포도원의 열매
