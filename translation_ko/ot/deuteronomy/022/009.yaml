base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
  footnotes:
  - marker: a
    text: Or, more literally, 'lest the whole yield become holy/consecrated'—that is, set apart and no longer for ordinary use.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 포도원에 두 종류의 씨를 뿌리지 마십시오. 그렇게 하면 네가 뿌린 씨와 포도원의 소출, 곧 온 수확물이 성별될 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘네가 뿌린 씨와 포도원의 소출, 곧 온 수확물이 거룩하게/성별되게 될까 하여’입니다. 여기서 ‘성별되다’는 일반 용도로 더 이상 사용할 수 없게 되는 법적 결과를 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
