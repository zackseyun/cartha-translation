  rationale: 이 절은 제의적 경건을 칭찬하는 문맥이 아니라 금지 조항의 결과를 경고하는 문맥이므로, ‘거룩’의 긍정적 뉘앙스가 오해를 낳지 않도록 했습니다.
  doctrine_reference: 토라의 정결/금기 규정 해석
