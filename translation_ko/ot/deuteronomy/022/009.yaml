  rationale: 직접 호칭 ‘당신은’을 원문의 2인칭 소유 표현에 맞는 ‘네 포도원’으로 고치고, 논의되는 תִּקְדַּשׁ을 본문에서 ‘성별되다’로 보존했습니다. 그 법적 함의는 단정적으로 확대하지 않고 각주에서 ‘이해될 수 있다’고 설명했습니다. ‘온 수확물’은 뿌린 씨와 포도원 소출을 함께 가리키는 הַמְלֵאָה의 범위를 자연스럽게 드러냅니다.
