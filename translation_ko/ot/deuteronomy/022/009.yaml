  rationale: כלאים는 금지된 ‘혼합/이종 결합’을 가리키므로, ‘두 종류의 씨앗’이 법적 의미를 유지하면서도 자연스럽습니다.
- source_word: תִּקְדַּשׁ
  english_pob_choice: be forfeited
  chosen_korean: 구별되어 일반적인 용도로 쓸 수 없게 됩니다
  alternatives_korean:
  - 거룩하게 됩니다
  - 성별됩니다
  - 몰수됩니다
  lexicon: BDB / HALOT
  rationale: קדש는 문자적으로는 ‘거룩해지다/성별되다’이지만, 여기서는 금지된 상태로 ‘일상적 사용에서 분리됨’이라는 법적 결과가 핵심이므로 그 의미를 풀어 옮겼습니다.
- source_word: הַמְלֵאָה
  english_pob_choice: the whole yield
  chosen_korean: 전체 수확물
  alternatives_korean:
  - 모든 소출
  - 온전한 소출
  - 온 수확
  lexicon: BDB / HALOT
  rationale: המלאה는 ‘충만함’에서 나온 말로 여기서는 결과물 전체, 곧 수확 전체를 가리키므로 ‘전체 수확물’이 적절합니다.
- source_word: וּתְבוּאַת הַכָּרֶם
  english_pob_choice: and the produce of the vineyard
  chosen_korean: 포도원의 소출
  alternatives_korean:
  - 포도원의 산출물
  - 포도원의 열매
  - 포도원의 생산물
  lexicon: BDB / HALOT
  rationale: תבואה는 농경 맥락에서 ‘소출/수확물’이 자연스럽고, 포도원에 해당하는 생산물을 포괄적으로 나타냅니다.
theological_decisions:
- issue: תִּקְדַּשׁ의 의미를 ‘거룩’ 용어로 직접 옮길지 여부
  chosen_reading: 금지 위반의 결과로 소출이 일반적 사용에서 분리된다는 법적 효과를 드러냈습니다.
  alternative_readings:
  - 거룩하게 됩니다
  - 성별됩니다
  - 성소에 바쳐집니다
  rationale: 이 절은 제의적 경건을 칭찬하는 문맥이 아니라 금지 조항의 결과를 경고하는 문맥이므로, ‘거룩’의 긍정적 뉘앙스가 오해를 낳지 않도록 했습니다.
  doctrine_reference: 토라의 정결/금기 규정 해석
