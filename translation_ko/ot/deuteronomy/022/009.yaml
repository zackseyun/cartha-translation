  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
  footnotes:
  - marker: a
    text: Or, more literally, 'lest the whole yield become holy/consecrated'—that is, set apart and no longer for ordinary use.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 포도원에 두 종류의 씨앗을 뿌려서는 안 됩니다. 그렇지 않으면 뿌린 씨앗과 포도원의 소출을 포함한 전체 수확물이 구별되어 일반적인 용도로 쓸 수 없게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 문자적으로는 ‘전체 수확물이 거룩하게/성별되게 되지 않도록’이라는 뜻입니다. 즉, 일반적인 용도로는 더 이상 쓸 수 없게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  english_pob_choice: you shall not sow
  chosen_korean: 뿌려서는 안 됩니다
  alternatives_korean:
