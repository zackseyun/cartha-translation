  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
  footnotes:
  - marker: a
    text: Or 'tokens of virginity were not found for the young woman.' The Hebrew uses בְּתוּלִים, literally 'virginity' or 'signs/evidence of virginity,' in the context of an ancient legal custom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 이 일이 사실이고 그 젊은 여자의 처녀성에 대한 증거가 발견되지 않았다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 젊은 여자의 처녀성의 표지가 발견되지 않았다면.’ 히브리어 בְּתוּלִים은 문자적으로 ‘처녀성’ 또는 ‘처녀성의 표지/증거’를 뜻하며, 고대 법적 관습의 문맥에서 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절의 가정적 진술에 이어지는 대조를 살리기 위해 ‘그러나’를 두었고, 조건문은 ‘만일’로 자연스럽게 옮겼습니다.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  english_pob_choice: this matter is true
  chosen_korean: 이 일이 참이라면
  alternatives_korean:
  - 이 사건이 참이라면
  - 이 말이 참이라면
  - 이 일이 사실이라면
  lexicon: HALOT
  rationale: 법정 문맥의 דָּבָר를 ‘일’로 넓게 옮기되, predicative אֱמֶת는 ‘참하다/사실이다’보다 직접적인 ‘참’으로 처리해 원문의 판정 어조를 살렸습니다.
- source_word: בְּתוּלִים
  english_pob_choice: evidence of virginity
  chosen_korean: 처녀성의 증거
  alternatives_korean:
  - 처녀성의 표지
  - 처녀성의 증거물
  - 처녀의 흔적
  lexicon: HALOT
  rationale: '문맥상 신체적/법적 입증을 가리키므로 단순히 ‘처녀성’만 두기보다 ‘증거’를 붙여 영어 POB의 해석을 반영했습니다. '
- source_word: לַנַּעֲרָ
  english_pob_choice: for the young woman
  chosen_korean: 그 젊은 여자에게서
  alternatives_korean:
  - 그 젊은 여자에게
  - 그 처녀에게서
  - 그 여자에게서
  lexicon: HALOT
  rationale: נַעֲרָ는 혼인 연령대의 젊은 여성을 가리키므로 ‘젊은 여자’로 옮겼고, ‘에게서’는 증거가 발견되는 출처를 나타내는 자연스러운 한국어 법정 표현입니다.
theological_decisions:
- issue: 법정 판정문의 진술 방식
  chosen_reading: 직설적 판정 구조를 유지해, 본문이 개인적 도덕 훈계가 아니라 공동체 법정 절차의 사실 확인임을 드러냈습니다.
  alternative_readings:
  - 부드럽게 윤리적 권고문으로 옮길 수 있음
  - 문장 종결을 더 완곡하게 만들 수 있음
  rationale: 본문은 조건절 안에서 사실 여부와 증거 유무를 판정하는 법률 문맥이므로, 한국어에서도 판단·증거의 구조를 분명히 해야 합니다.
  doctrine_reference: 신명기 22장 혼인·성윤리 관련 율법의 법정적 맥락
