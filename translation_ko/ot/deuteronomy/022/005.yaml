translation:
  language: ko
  text: 여자는 남자의 물건을 몸에 지녀서는 안 되며, 남자는 여자의 옷을 입어서는 안 됩니다. 그런 일을 하는 사람은 누구나 야훼 네 하나님께 가증한 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 히브리어 כְלִי는 둘째 절에서 ‘옷’을 뜻하는 שִׂמְלָה보다 넓은 말입니다. 따라서 ‘남자의 물건’은 남자의 옷, 장비 또는 기구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  english_pob_choice: a man's article
  chosen_korean: 남자의 물건
  alternatives_korean:
  - 남자의 옷
  - 남자의 장비
  - 남자의 기구
  lexicon: HALOT
  rationale: כְלִי는 단순한 ‘옷’보다 넓어 물건, 도구, 장비까지 가리킬 수 있으므로, 첫 절의 범위를 좁히지 않도록 ‘물건’으로 옮겼습니다. 둘째 절의 שִׂמְלָה와 구별되는 어휘 차이도 살렸습니다.
- source_word: עַל אִשָּׁה
  english_pob_choice: wear a woman shall not wear
  chosen_korean: 몸에 걸쳐서는 안 되고
  alternatives_korean:
  - 입어서는 안 되고
  - 걸치고 있어서는 안 되고
  - 몸에 두어서는 안 되고
  lexicon: HALOT
  rationale: ‘על’이 의복이나 착용물에 대해 ‘몸에 지니다/걸치다’는 뜻으로 쓰이므로, 한국어에서는 자연스러운 착용 표현인 ‘몸에 걸치다’로 옮겼습니다.
- source_word: שִׂמְלַת אִשָּׁה
  english_pob_choice: a woman's garment
  chosen_korean: 여자의 옷
  alternatives_korean:
  - 여자의 의복
  - 여자의 치마
  - 여자의 겉옷
  lexicon: HALOT
  rationale: שִׂמְלָה는 특정한 한 벌만이 아니라 일반적인 의복을 가리킬 수 있어, 너무 좁히지 않도록 ‘옷’으로 옮겼습니다. 첫 절의 broader term과 대비되는 보편적 의복 표현도 유지됩니다.
- source_word: תוֹעֲבַת יְהוָה אֱלֹהֶיךָ
  english_pob_choice: an abomination to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께 가증한 자입니다
  alternatives_korean:
  - 야훼 당신의 하나님께 가증한 것입니다
  - 야훼 당신의 하나님께 혐오스러운 것입니다
  - 야훼 당신의 하나님께 역겨운 것입니다
  lexicon: HALOT
  rationale: תוֹעֵבָה의 강한 도덕·언약적 거부를 살리기 위해 ‘가증한’으로 옮겼고, 주어가 사람을 가리키는 문맥이므로 ‘자’로 처리했습니다. יְהוָה는 본 프로젝트 기본어인 ‘야훼’를 따랐습니다.
theological_decisions:
- issue: 첫 절의 어휘 범위
  chosen_reading: ‘남자의 물건’으로 넓게 유지해 첫 절을 둘째 절의 ‘옷’으로 자동 환원하지 않았습니다.
  alternative_readings:
  - 남자의 옷
  - 남자의 장비
  rationale: 히브리어는 첫 절에 더 넓은 명사 כְלִי를 쓰고 둘째 절에만 구체적인 ‘옷’(שִׂמְלָה)을 쓰므로, 번역도 그 구별을 보존해야 합니다. 이렇게 해야 본문이 무엇을 금하는지 지나치게 특정하지 않으면서 원문의 긴장을 유지할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 여호와/야훼 표기
  chosen_reading: YHWH는 ‘야훼’로, 번역문에서도 일관되게 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 본문 원칙에 따라 본문 독자성이 드러나는 학술적 음역을 따랐습니다. 또한 본문이 직접 신명기 맥락의 언약적 경고를 담고 있으므로 고유명 표기를 보존하는 것이 유리합니다.
  doctrine_reference: Project glossary — יהוה / YHWH
