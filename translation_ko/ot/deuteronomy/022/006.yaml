  - 데려가서는 안 됩니다
  rationale: 본문은 단순한 분리 명령이 아니라 어미와 새끼를 함께 취하는 행위를 금지하는 법조문이므로, 행위의 대상과 금지의 강도를 그대로 살렸습니다.
  doctrine_reference: 신 22:6의 토라 윤리
