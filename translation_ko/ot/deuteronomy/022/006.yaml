  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘엎드려’는 רֹבֶצֶת가 가리키는 어미 새의 둥지 위 자세를 다소 부자연스럽고 지나치게 특정합니다. 또한 ‘당신 앞에서 우연히 보게 되는데’는 한국어 어순이 어색하며, 원문의 우연한 마주침을 더 자연스럽게 옮길 수 있습니다.
