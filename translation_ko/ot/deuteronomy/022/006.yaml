  terminology: ‘새의 둥지’, ‘어미’, ‘새끼’, ‘알’은 적절합니다. תִקַּח은 이 상황에서 둥지의 어미를 포획하거나 가져가는 행위를 포괄하므로 ‘잡다’가 자연스럽습니다. 마지막 עַל은 공간적 ‘위에’가 아니라 어미를 새끼와 함께 취하는 것을 뜻하는 관용적 용법으로 반영했습니다.
