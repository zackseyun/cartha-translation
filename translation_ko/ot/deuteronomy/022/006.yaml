  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
  footnotes:
  - marker: a
    text: Or 'When a bird’s nest is encountered before you.' The Hebrew verb suggests a chance finding rather than a deliberate search.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the mother upon the young.' The idiom means taking the mother together with her offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 길에서 새의 둥지를 당신 앞에서 우연히 보게 되는데, 그것이 어떤 나무 위에 있든지 땅 위에 있든지, 새끼들이나 알들이 있고 어미가 새끼들이나 알들 위에 엎드려 있으면, 어미를 새끼들과 함께 취하지 말아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우연히 보게 되는데’는 יִקָּרֵא의 의도적 탐색이 아닌 우발적 발견을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘엎드려 있으면’은 새가 알이나 새끼 위에 있는 상태를 옮긴 것으로, 직역의 ‘위에’보다 한국어에서 더 분명하게 둥지 위의 자세를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  english_pob_choice: If a bird’s nest happens to be before you
  chosen_korean: 만일 … 우연히 보게 되는데
  alternatives_korean:
  - …을 만나게 되면
  - …이 눈에 띄면
  lexicon: HALOT
  rationale: 조건문으로 시작하는 법 조항의 형식을 살리면서, יִקָּרֵא의 우연한 마주침 뉘앙스를 ‘우연히’로 드러냈습니다.
- source_word: קַן צִפּוֹר
  english_pob_choice: a bird’s nest
  chosen_korean: 새의 둥지
  alternatives_korean:
  - 새 둥지
  - 새집
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어에서 자연스러운 소유구문으로 정리했습니다.
- source_word: רֹבֶצֶת
  english_pob_choice: is sitting
  chosen_korean: 엎드려 있으면
  alternatives_korean:
  - 앉아 있으면
  - 보호하듯 덮고 있으면
  - 품고 있으면
  lexicon: HALOT
  rationale: 새가 둥지 위에 있는 상태를 단순한 ‘앉다’보다 더 정확히 반영하고, 알이나 새끼를 덮고 있는 모습을 담기 위해 ‘엎드려’로 옮겼습니다.
- source_word: לֹא תִקַּח הָאֵם עַל הַבָּנִים
  english_pob_choice: you shall not take the mother along with the young
  chosen_korean: 어미를 새끼들과 함께 취하지 말아야 합니다
  alternatives_korean:
  - 어미를 새끼들과 함께 잡아서는 안 됩니다
  - 어미를 새끼들과 함께 데려가서는 안 됩니다
  lexicon: HALOT
  rationale: תִקַּח은 상황에 따라 ‘잡다/취하다/데려가다’가 가능하지만, 여기서는 포획·취득을 포괄하는 법적 금지로서 ‘취하다’를 택했습니다.
theological_decisions:
- issue: 동물 보호 규정의 금지 표현
  chosen_reading: 어미를 새끼들과 함께 취하지 말아야 합니다
  alternative_readings:
  - 잡아서는 안 됩니다
  - 데려가서는 안 됩니다
  rationale: 본문은 단순한 분리 명령이 아니라 어미와 새끼를 함께 취하는 행위를 금지하는 법조문이므로, 행위의 대상과 금지의 강도를 그대로 살렸습니다.
  doctrine_reference: 신 22:6의 토라 윤리
