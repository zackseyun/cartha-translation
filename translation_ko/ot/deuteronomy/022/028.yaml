  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
  footnotes:
  - marker: a
    text: Or 'who is not betrothed.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'seize,' 'grasp,' or 'take hold of.' Some understand the clause here as implying rape; others argue the legal nuance must be inferred from the wider context rather than from this verb alone.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 어떤 사람이 약혼하지 않은 젊은 여자, 곧 처녀를 발견하고 그녀를 붙잡아 그녀와 동침하면, 그들이 발각되면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정혼하지 않은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘붙잡다’, ‘움켜쥐다’, ‘붙들다’의 뜻을 가질 수 있습니다. 이 구절을 강간으로 이해하는 해석도 있고, 다른 이들은 그 법적 함의를 동사 자체보다 더 넓은 문맥에서 판단해야 한다고 봅니다.
    reason: alternative_reading
