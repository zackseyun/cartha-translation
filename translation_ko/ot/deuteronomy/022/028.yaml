  source_fidelity: ‘그와 함께 동침하면’은 앞의 남성을 가리켜, 히브리어 עִמָּהּ(‘그녀와’)의 여성 목적어와 맞지 않습니다. 또한 וְנִמְצָאוּ는 복수 수동형이므로 ‘그 일이 드러나면’보다 ‘그들이 발각되면’이 원문의 대상을 더 직접적으로 보존합니다.
  naturalness: ‘그녀를 붙잡아 그녀와 동침하면, 그들이 발각되면’은 현대 표준 한국어의 격식 있는 법조항 문체로 자연스럽습니다. ‘동침하다’는 본문의 성적 관용표현을 지나치게 노골적이거나 완곡하게 만들지 않고 옮깁니다.
  terminology: ‘젊은 여자, 곧 처녀’, ‘약혼하지 않은’, ‘붙잡아’는 נער בְּתוּלָה, לֹא אֹרָשָׂה, תפשׂ의 의미 범위와 해석상 긴장을 적절히 보존합니다. 각주 a는 본문에 이미 쓰인 ‘약혼하지 않은’ 자체를 대안으로 제시하므로, 법적 뉘앙스를 지닌 ‘정혼하지 않은’으로 바로잡습니다.
