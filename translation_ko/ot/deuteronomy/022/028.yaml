  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
  footnotes:
  - marker: a
    text: Or 'who is not betrothed.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'seize,' 'grasp,' or 'take hold of.' Some understand the clause here as implying rape; others argue the legal nuance must be inferred from the wider context rather than from this verb alone.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 어떤 사람이 아직 약혼하지 않은 젊은 여자, 곧 처녀를 발견하고 그녀를 붙잡아 그와 함께 동침하면, 그 일이 드러나면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약혼하지 않은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘붙잡다’, ‘움켜쥐다’, ‘붙들다’의 뜻을 가질 수 있습니다. 이 구절을 강간으로 이해하는 해석도 있고, 다른 이들은 그 법적 함의를 동사 자체보다 더 넓은 문맥에서 판단해야 한다고 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 때에
  - ~할 때
  lexicon: HALOT
  rationale: 가법적 법 조항의 조건문을 한국어 법문체로 자연스럽게 살리기 위해 ‘만일’을 선택했습니다.
- source_word: נער בְתוּלָה
  english_pob_choice: a young woman, a virgin
  chosen_korean: 젊은 여자, 곧 처녀
  alternatives_korean:
  - 젊은 처녀
  - 어린 여자, 곧 처녀
  lexicon: HALOT
  rationale: 원문의 청년성(נער)과 처녀성(בְתוּלָה)을 함께 드러내되, 현대 한국어에서 ‘여자’와 ‘처녀’를 병기하여 의미를 분명히 했습니다.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  english_pob_choice: who is not engaged
  chosen_korean: 아직 약혼하지 않은
  alternatives_korean:
  - 약혼하지 않은
  - 정혼하지 않은
  lexicon: HALOT
  rationale: 법적·관계적 상태를 가장 직접적으로 나타내는 말로 ‘약혼’을 택했고, ‘아직’을 넣어 상태의 부재를 선명하게 했습니다.
- source_word: וּתְפָשָׂהּ
  english_pob_choice: and seizes her
  chosen_korean: 그녀를 붙잡아
  alternatives_korean:
  - 그녀를 붙들어
  - 그녀를 잡아
  lexicon: HALOT
  rationale: תפשׂ의 물리적 제압 뉘앙스를 유지하면서도 한국어에서 과도하게 해석을 고정하지 않기 위해 ‘붙잡아’를 사용했습니다.
- source_word: וְשָׁכַב עִמָּהּ
  english_pob_choice: and lies with her
  chosen_korean: 그와 함께 동침하면
  alternatives_korean:
  - 그녀와 동침하면
  - 그녀와 함께 잠자리를 같이하면
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성서 문체로 옮기기 위해 ‘동침하다’를 사용했고, ‘עםּהּ’의 상호성을 살리기 위해 ‘함께’를 붙였습니다.
- source_word: וְנִמְצָאוּ
  english_pob_choice: and they are discovered
  chosen_korean: 그 일이 드러나면
  alternatives_korean:
  - 그들이 발각되면
  - 그 사실이 알려지면
  lexicon: HALOT
  rationale: 수동적 결과 상태를 자연스럽게 옮기되, 법문맥에서 핵심인 ‘알려짐/발각됨’보다 더 중립적인 ‘드러나다’로 처리했습니다.
theological_decisions:
- issue: תפשׂ(붙잡다)의 폭력성 및 본문의 법적 함의
  chosen_reading: 본문은 행위를 단일 해석어로 확정하지 않고, 물리적 강제성을 드러내는 ‘붙잡다’로 유지했습니다.
  alternative_readings:
  - 강간하다
  - 데려가다
  rationale: 원문 동사는 물리적 제압을 분명히 하지만, 본문 전체의 법적·해석적 논쟁을 번역어 하나로 닫아버리지는 않도록 했습니다. 따라서 강제성은 보존하되, 최종 법적 평가는 텍스트 밖으로 남겨 두었습니다.
  doctrine_reference: 원문 우선과 해석 긴장 보존 원칙
