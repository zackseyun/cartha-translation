  - 어린 여자, 곧 처녀
  lexicon: HALOT
  rationale: 원문의 청년성(נער)과 처녀성(בְתוּלָה)을 함께 드러내되, 현대 한국어에서 ‘여자’와 ‘처녀’를 병기하여 의미를 분명히 했습니다.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  english_pob_choice: who is not engaged
  chosen_korean: 아직 약혼하지 않은
  alternatives_korean:
  - 약혼하지 않은
  - 정혼하지 않은
  lexicon: HALOT
  rationale: 법적·관계적 상태를 가장 직접적으로 나타내는 말로 ‘약혼’을 택했고, ‘아직’을 넣어 상태의 부재를 선명하게 했습니다.
- source_word: וּתְפָשָׂהּ
  english_pob_choice: and seizes her
  chosen_korean: 그녀를 붙잡아
  alternatives_korean:
  - 그녀를 붙들어
  - 그녀를 잡아
  lexicon: HALOT
  rationale: תפשׂ의 물리적 제압 뉘앙스를 유지하면서도 한국어에서 과도하게 해석을 고정하지 않기 위해 ‘붙잡아’를 사용했습니다.
- source_word: וְשָׁכַב עִמָּהּ
  english_pob_choice: and lies with her
  chosen_korean: 그와 함께 동침하면
  alternatives_korean:
  - 그녀와 동침하면
  - 그녀와 함께 잠자리를 같이하면
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성서 문체로 옮기기 위해 ‘동침하다’를 사용했고, ‘עםּהּ’의 상호성을 살리기 위해 ‘함께’를 붙였습니다.
- source_word: וְנִמְצָאוּ
  english_pob_choice: and they are discovered
  chosen_korean: 그 일이 드러나면
  alternatives_korean:
  - 그들이 발각되면
  - 그 사실이 알려지면
  lexicon: HALOT
  rationale: 수동적 결과 상태를 자연스럽게 옮기되, 법문맥에서 핵심인 ‘알려짐/발각됨’보다 더 중립적인 ‘드러나다’로 처리했습니다.
theological_decisions:
- issue: תפשׂ(붙잡다)의 폭력성 및 본문의 법적 함의
  chosen_reading: 본문은 행위를 단일 해석어로 확정하지 않고, 물리적 강제성을 드러내는 ‘붙잡다’로 유지했습니다.
  alternative_readings:
  - 강간하다
  - 데려가다
  rationale: 원문 동사는 물리적 제압을 분명히 하지만, 본문 전체의 법적·해석적 논쟁을 번역어 하나로 닫아버리지는 않도록 했습니다. 따라서 강제성은 보존하되, 최종 법적 평가는 텍스트 밖으로 남겨 두었습니다.
  doctrine_reference: 원문 우선과 해석 긴장 보존 원칙
