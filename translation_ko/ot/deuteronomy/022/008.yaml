  lexicon: WLC/HALOT
  rationale: 히브리어의 일반적·가정적 피해자를 한국어로 자연스럽게 풀어, 특정 인물 없이도 성립하는 법규의 성격을 드러냈습니다.
theological_decisions:
- issue: 법적 책임을 나타내는 דָּמִים의 처리
  chosen_reading: ‘피의 책임’은 살상 결과 자체보다 예방 의무를 소홀히 한 데 따른 책임을 드러냅니다.
  alternative_readings:
  - ‘피흘림’
  - ‘유혈’
  - ‘혈죄’
  rationale: 이 절은 살인을 직접 명령하는 문장이 아니라, 위험을 방치해 생길 수 있는 죽음에 대한 책임을 규정합니다. 따라서 공동체 윤리와 법적 책임의 의미가 드러나는 번역이 필요합니다.
  doctrine_reference: 신명기 22:8의 보호 의무와 생명 보호 원리
