  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
  footnotes:
  - marker: a
    text: Or 'railing' or 'guardrail.' The Hebrew refers to a protective barrier built around a flat roof.
    reason: lexical_alternative
translation:
  language: ko
  text: 새 집을 지을 때에는 지붕에 난간을 만들어야 합니다. 그래야 누군가 거기서 떨어져도 당신의 집에 피의 책임을 지우지 않게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘난간’은 평평한 지붕 둘레에 두는 보호 장벽을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  english_pob_choice: you build a new house
  chosen_korean: 새 집을 지을 때에는
  alternatives_korean:
  - 당신이 새 집을 지을 때
  - 새로운 집을 지으면
  lexicon: WLC/HALOT
  rationale: 법조문의 조건절을 자연스러운 한국어로 옮기되, ‘새 집’이라는 구체적 건축 상황을 유지했습니다.
- source_word: מַעֲקֶה
  english_pob_choice: parapet
  chosen_korean: 난간
  alternatives_korean:
  - 벽난간
  - 가드레일
  - 파라펫
  lexicon: HALOT
  rationale: 지붕 가장자리에 두는 보호용 장벽이라는 뜻을 살리면서도 한국어 독자가 바로 이해할 수 있는 표현을 택했습니다. 전통적 음역보다 의미 중심의 대응이 더 적절합니다.
- source_word: דָּמִים
  english_pob_choice: bloodguilt
  chosen_korean: 피의 책임
  alternatives_korean:
  - 피의 죄
  - 피흘림의 책임
  - 유혈 책임
  lexicon: HALOT
  rationale: 단순한 ‘피’가 아니라 예방 가능한 죽음에 대한 법적·도덕적 책임을 가리키므로, ‘피의 책임’으로 옮겨 법조문의 무게를 살렸습니다.
- source_word: הַנֹּפֵל מִמֶּנּוּ
  english_pob_choice: someone falls ... from it
  chosen_korean: 누군가 거기서 떨어져도
  alternatives_korean:
  - 누군가 그곳에서 떨어져도
  - 어떤 사람이 거기서 떨어지더라도
  lexicon: WLC/HALOT
  rationale: 히브리어의 일반적·가정적 피해자를 한국어로 자연스럽게 풀어, 특정 인물 없이도 성립하는 법규의 성격을 드러냈습니다.
theological_decisions:
- issue: 법적 책임을 나타내는 דָּמִים의 처리
  chosen_reading: ‘피의 책임’은 살상 결과 자체보다 예방 의무를 소홀히 한 데 따른 책임을 드러냅니다.
  alternative_readings:
  - ‘피흘림’
  - ‘유혈’
  - ‘혈죄’
  rationale: 이 절은 살인을 직접 명령하는 문장이 아니라, 위험을 방치해 생길 수 있는 죽음에 대한 책임을 규정합니다. 따라서 공동체 윤리와 법적 책임의 의미가 드러나는 번역이 필요합니다.
  doctrine_reference: 신명기 22:8의 보호 의무와 생명 보호 원리
