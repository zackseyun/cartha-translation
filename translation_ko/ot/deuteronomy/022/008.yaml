revisions:
- from: 새 집을 지을 때에는 지붕에 난간을 만들어야 합니다. 그래야 누군가 거기서 떨어져도 당신의 집에 피의 책임을 지우지 않게 됩니다.[a]
  to: 새 집을 지을 때에는 지붕에 난간[a]을 만들어야 합니다. 그렇게 하여 누군가 그 지붕에서 떨어질 경우 당신의 집에 피 흘림의 책임이 돌아가지 않도록 해야 합니다.
  rationale: 'The revision preserves the source’s prescriptive case-law force and its conditional consequence: a protective barrier must be built so that liability for bloodshed does not attach to the house if a person falls. It improves Korean syntax, restores the conditional nuance, and places the lexical footnote at its proper anchor.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the case-law setting, the required protective barrier, and the consequence of a fall. However, '누군가 거기서 떨어져도' ('even if someone falls from there') weakens the Hebrew conditional/result construction, and '당신의 집에 피의 책임을 지우지 않게 됩니다' has an unclear agent and is unnatural Korean. The revised wording retains the legal-moral sense of דָּמִים as liability for bloodshed.
  naturalness: ‘난간’을 설명하는 주석은 이해하기 쉽습니다. ‘그 지붕에서 떨어질 경우’ makes the antecedent explicit and is more natural than the vague ‘거기서.’ ‘피 흘림의 책임이 돌아가지 않도록 해야 합니다’ is idiomatic formal Korean and clearly expresses the householder’s liability.
  terminology: ‘난간’ is a suitable modern Korean rendering of מַעֲקֶה, with the footnote appropriately specifying its function around a flat roof. ‘피 흘림의 책임’ conveys bloodguilt without reducing it to merely physical blood or imposing later doctrinal terminology. The footnote anchor is moved directly after ‘난간,’ the word it explains.
  issues:
  - severity: medium
    issue: ‘떨어져도’ is concessive rather than conditional.
    rationale: The Hebrew כִּי יִפֹּל presents the potential event whose occurrence would result in bloodguilt. ‘떨어질 경우’ preserves this legal contingency more directly.
  - severity: medium
    issue: ‘당신의 집에 피의 책임을 지우지 않게 됩니다’ is syntactically unclear and unnatural.
    rationale: The Korean wording does not clearly identify who would impose the responsibility and does not naturally express liability attaching to the house. Recasting it as responsibility ‘returning’ to the house is clear and idiomatic.
  - severity: low
    issue: Footnote marker is placed at the end of the verse rather than at ‘난간.’
    rationale: The note explains the lexical sense of ‘난간,’ so anchoring it immediately after that term improves reference precision.
  revised_text: 새 집을 지을 때에는 지붕에 난간[a]을 만들어야 합니다. 그렇게 하여 누군가 그 지붕에서 떨어질 경우 당신의 집에 피 흘림의 책임이 돌아가지 않도록 해야 합니다.
  revised_footnotes:
