source:
  edition: WLC
  text: וְ/אָמַ֛ר אֲבִ֥י ה/נער אֶל הַ/זְּקֵנִ֑ים אֶת בִּתִּ֗/י נָתַ֜תִּי לָ/אִ֥ישׁ הַ/זֶּ֛ה לְ/אִשָּׁ֖ה וַ/יִּשְׂנָאֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
  footnotes:
  - marker: a
    text: Or, 'and he has come to hate her.' The Hebrew verb simply means 'hate'; English may express the resulting state either as present ('hates') or as developed attitude ('has come to hate').
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 여자의 아버지가 장로들에게 말할 것입니다. ‘내 딸을 이 사람에게 아내로 주었는데, 그가 그녀를 미워합니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  english_pob_choice: And ... shall say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말합니다
  - 그리고 ... 말할 것입니다
  lexicon: HALOT
  rationale: 법적 절차 문맥의 예고된 진술이므로 미래 지시형으로 옮기되, 한국어에서는 문장 첫머리의 접속성을 본문 흐름으로 자연스럽게 흡수했습니다.
- source_word: אֲבִי הַנַּעַר
  english_pob_choice: the young woman’s father
  chosen_korean: 그 젊은 여자의 아버지
  alternatives_korean:
  - 그 소녀의 아버지
  - 그 처녀의 아버지
  lexicon: HALOT
  rationale: 혼인 문맥의 נַעַר는 결혼 가능한 젊은 여성을 가리키므로, 현대 한국어에서 자연스럽고 의미를 덜 왜곡하는 ‘젊은 여자’를 택했습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들에게
  alternatives_korean:
  - 어른들에게
  - 노인들에게
  lexicon: HALOT
  rationale: 여기서는 연장자 일반이 아니라 공동체의 사법적 권위를 지닌 장로들이므로, 기능을 살려 ‘장로들’로 옮겼습니다.
- source_word: וַיִּשְׂנָאֶהָ
  english_pob_choice: and he hates her
  chosen_korean: 그가 그녀를 미워합니다
  alternatives_korean:
  - 그가 그녀를 미워해 버렸습니다
  - 그가 그녀를 미워하기 시작했습니다
  lexicon: HALOT
  rationale: שָׂנֵא의 기본 의미는 ‘미워하다’이므로, 영어 POB처럼 결과 상태로 읽는 해석을 따르되 한국어는 현재형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 혼인 표현 ‘לְאִשָּׁה’의 처리
  chosen_reading: ‘아내로 주었다’
  alternative_readings:
  - ‘아내로 삼았다’
  - ‘결혼하게 했다’
  rationale: 이 구절은 아버지가 딸을 남편에게 ‘주다’는 결혼 배정의 관용구를 담고 있으므로, 원문의 관계적·법적 뉘앙스를 살렸습니다.
  doctrine_reference: 혼인/가족 법규의 서술적 표현
