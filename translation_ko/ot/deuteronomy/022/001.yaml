source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: ko
  text: 당신의 형제의 소나 그의 양이 흩어져 가는 것을 보게 되더라도 못 본 체해서는 안 됩니다. 반드시 그것들을 당신의 형제에게 돌려주어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִדָּחִים
  english_pob_choice: driven away
  chosen_korean: 흩어져 가는
  alternatives_korean:
  - 몰려간
  - 내몰린
  - 길 잃은
  lexicon: WLC נִדָּחִים
  rationale: 영문 POB의 ‘driven away’를 따르되, 가축이 흩어져 통제 밖에 놓인 상태를 자연스럽게 드러내는 한국어로 옮겼습니다. ‘길 잃은’은 의미를 좁힐 수 있어 피했습니다.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  english_pob_choice: and ignore them
  chosen_korean: 못 본 체해서는 안 됩니다
  alternatives_korean:
  - 외면해서는 안 됩니다
  - 모른 체해서는 안 됩니다
  - 그들을 무시해서는 안 됩니다
  lexicon: WLC וְהִתְעַלַּמְתָּ מֵהֶם
  rationale: ‘see’와 대비되는 의도적 외면을 한국어 관용으로 분명하게 표현했습니다. 단순한 지각 부족이 아니라 책임 있는 회피를 금하는 뜻을 살렸습니다.
- source_word: הָשֵׁב תְּשִׁיבֵם
  english_pob_choice: you must certainly return them
  chosen_korean: 반드시 그것들을 ... 돌려주어야 합니다
  alternatives_korean:
  - 반드시 그것들을 ... 돌려보내야 합니다
  - 꼭 돌려주어야 합니다
  - 반드시 되돌려주어야 합니다
  lexicon: WLC הָשֵׁב תְּשִׁיבֵם
  rationale: 반복형 동사구의 강한 의무성을 한국어의 ‘반드시 ... 주어야 합니다’로 옮겨, 단순 권고가 아니라 확정적 의무임을 드러냈습니다.
- source_word: לְאָחִיךָ
  english_pob_choice: to your brother
  chosen_korean: 당신의 형제에게
  alternatives_korean:
  - 당신의 동족에게
  - 당신의 이웃에게
  - 형제에게
  lexicon: WLC לְאָחִיךָ
  rationale: 출애굽기/신명기 문맥의 친족-동족적 언어를 반영해 직역에 가깝게 옮겼습니다. 여기서는 POB의 ‘brother’를 유지하되 한국어에서는 자연스러운 소유 구조로 정리했습니다.
theological_decisions:
- issue: 형제/동족에게 대한 언약적 책임
  chosen_reading: ‘형제’는 혈연 한정이 아니라 이스라엘 공동체 안에서의 언약적 책임 관계를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘동족’으로 완화해 사회적 책임으로만 읽는 방식
  - ‘이웃’으로 일반화하는 방식
  rationale: 문맥상 소유물 반환 의무를 공동체 내부의 관계 윤리로 제시하므로, 본문의 언약적 친밀성을 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 신명기 22:1; 언약 공동체 윤리
