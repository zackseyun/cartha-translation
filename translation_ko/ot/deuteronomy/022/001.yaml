review_pass:
  verdict: revise
  source_fidelity: נִדָּחִים is a passive plural participle referring to animals that have been driven off, scattered, or otherwise gone astray. The draft's ‘흩어져 가는’ introduces an awkward progressive sense and does not clearly preserve the passive/resultative nuance. ‘흩어져 있는’ more directly represents the Hebrew while retaining its range. The emphatic infinitive-plus-finite verb construction in הָשֵׁב תְּשִׁיבֵם is adequately conveyed by ‘반드시 ... 돌려주어야 합니다.’
  naturalness: ‘당신의 형제의’ and its repeated use are cumbersome in modern Korean. ‘형제의 ... 형제에게’ is natural in this legal-scriptural context, and ‘보고도 외면해서는 안 됩니다’ clearly conveys deliberate refusal to act in formal-polite register.
  terminology: ‘형제’ appropriately retains אָחִיךָ without prematurely generalizing it to ‘이웃’ or interpreting it as only a biological sibling. A note records the lexical ambiguity of נִדָּחִים rather than selecting a narrower interpretation such as ‘길 잃은.’
  issues:
  - severity: medium
    issue: ‘흩어져 가는’ is an imprecise and unnatural rendering of נִדָּחִים.
    rationale: The Hebrew passive participle describes animals in a condition of having been driven/scattered/strayed, not specifically an ongoing process of scattering.
  - severity: low
    issue: Repeated ‘당신의 형제’ is unnecessarily stilted.
    rationale: Korean naturally omits this repeated possessive where the referent is clear; the omission does not change the source meaning.
  revised_text: 형제의 소나 양이 흩어져 있는 것을 보고도 외면해서는 안 됩니다.[a] 반드시 그것들을 형제에게 돌려주어야 합니다.
  revised_footnotes:
  - marker: a
    text: ‘흩어져 있는’은 내몰리거나 흩어져 주인에게서 떨어져 있는 상태를 가리킬 수 있습니다.
    reason: נִדָּחִים의 ‘내몰린, 흩어진, 길을 잃은’ 등으로 논의되는 의미 범위를 보존합니다.
  revision_rationale: 히브리어의 상태적·수동적 표현과 반복형 명령의 강한 의무를 보존하면서, 현대 표준 한국어 합쇼체로 문장을 매끄럽게 다듬었습니다. 각주로 논쟁 가능성이 있는 동사의 의미 범위를 밝혀 본문에서 특정 해석을 과도하게 확정하지 않았습니다.
