  naturalness: ‘어린 여자아버지’는 띄어쓰기와 표현 모두 부자연스럽습니다. ‘그 젊은 여인의 아버지’가 자연스럽고 נַעֲרָ의 혼인 가능한 젊은 여성이라는 법문 맥락에도 맞습니다. ‘주어야 하며/되어야 합니다’는 현대 한국어 합쇼체 법률 문체에 자연스럽습니다.
  terminology: ‘동침하다’, ‘은 오십 세겔’, ‘욕보이다’는 절제된 법문 문체를 유지합니다. שַׁלְּחָהּ는 문자적으로 ‘내보내다’이지만 혼인 문맥에서는 내쫓음 또는 이혼을 뜻하므로, 해당 표현 뒤에 설명 각주를 붙입니다.
