revisions:
- from: 그 남자가 그녀와 동침한 대가로 은 오십 세겔을 그 어린 여자아버지에게 주고, 그녀는 그가 그녀를 욕보였기 때문에 그의 아내가 되어야 합니다[b]. 그는 평생 그녀를 내보낼 수 없습니다.
  to: 그녀와 동침한 남자는 그 젊은 여인의 아버지에게 은 오십 세겔을 주어야 하며, 그가 그녀를 욕보였으므로[a] 그녀는 그의 아내가 되어야 합니다. 그는 평생 그녀를 내보낼 수 없습니다[b].
  rationale: 인과 접속을 바로잡아 동침에 대한 거래적 ‘대가’라는 오해를 제거하고, 법적 의무를 ‘주어야 하며’로 명시했습니다. 친족 표현을 자연스러운 표준어로 고쳤고, 두 각주를 각각 설명하는 본문 어휘에 정확히 연결했습니다. 성적 침해를 뜻하는 עִנָּהּ의 의미는 ‘욕보이다’로 보존하되, 현대 독자가 그 어휘 범위와 문맥을 알 수 있도록 대안 각주를 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:22Z'
