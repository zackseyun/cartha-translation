base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
  footnotes:
  - marker: a
    text: Or 'because he has humbled/debased her.' The Hebrew verb can be rendered more literally this way, but in this context it refers to sexual violation.
    reason: lexical_alternative
  - marker: b
    text: '''Send her away'' refers to dismissing or divorcing her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀와 동침한 남자는 그 젊은 여인의 아버지에게 은 오십 세겔을 주어야 하며, 그가 그녀를 욕보였으므로[a] 그녀는 그의 아내가 되어야 합니다. 그는 평생 그녀를 내보낼 수 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 낮추었으므로’ 또는 ‘그녀를 모욕했으므로’. 히브리어 동사는 문자적으로 이러한 뜻을 가질 수 있으나, 이 문맥에서는 성적 침해를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내보내다’는 여기서 아내를 내쫓거나 이혼시키는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: Then ... shall give
  chosen_korean: 주고
  alternatives_korean:
  - 그리고 ... 주고
  - 그런 뒤 ... 주고
  lexicon: HALOT
  rationale: 법률 문맥의 연속적 서술로서 결과를 이어 주는 연결을 자연스럽게 살리되, 명령/규정의 의무성을 문맥에서 드러내기 위해 동사형으로 옮겼습니다.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  english_pob_choice: the man who lay with her
  chosen_korean: 그 남자가 그녀와 동침한
  alternatives_korean:
  - 그 여인과 함께 잔 남자가
  - 그녀와 잠자리를 같이한 남자가
  lexicon: HALOT
  rationale: 성적 행위를 직접 가리키는 관계절로 이해하여, 합쇼체 법문에 맞는 비교적 절제된 표현인 ‘동침한’을 택했습니다.
- source_word: חֲמִשִּׁים כָּסֶף
  english_pob_choice: fifty shekels of silver
  chosen_korean: 은 오십 세겔
  alternatives_korean:
  - 오십 세겔의 은
  - 은돈 오십 세겔
  lexicon: HALOT
  rationale: 히브리어의 화폐/중량 관용구를 그대로 드러내는 표준적 옮김으로, 경제적 배상액이라는 점을 유지했습니다.
- source_word: לַאֲבִי הַנַּעֲרָ
  english_pob_choice: to the young woman's father
  chosen_korean: 그 어린 여자아버지에게
  alternatives_korean:
  - 그 젊은 여인의 아버지에게
  - 그 소녀의 아버지에게
  lexicon: HALOT
  rationale: נַעֲרָ를 나이 어린 미혼 여성을 가리키는 말로 보아 ‘어린 여자’로 옮겼습니다. 원문의 친족 관계를 유지하면서도 법문 맥락을 고려했습니다.
- source_word: עִנָּהּ
  english_pob_choice: has violated her
  chosen_korean: 그녀를 욕보였기 때문에
  alternatives_korean:
  - 그녀를 학대하였기 때문에
  - 그녀를 낮추었기 때문에
  lexicon: HALOT
  rationale: 이 동사는 문맥상 성적 수치와 침해를 포함한 가혹한 행위를 가리키므로, 전통적이지만 모호한 ‘겸손케 하다’보다 한국어에서 더 직접적으로 수치를 드러내는 ‘욕보이다’를 택했습니다.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  english_pob_choice: He may not send her away
  chosen_korean: 그는 평생 그녀를 내보낼 수 없습니다
  alternatives_korean:
  - 그는 평생 그녀를 떠나보낼 수 없습니다
  - 그는 평생 그녀와 이혼할 수 없습니다
  lexicon: HALOT
  rationale: ‘내보내다’는 פ/שׁלח의 기본 이미지를 살리면서, 본문이 결혼 관계의 해소를 뜻하는 법적 용례임을 문맥으로 드러냅니다.
theological_decisions:
- issue: עִנָּהּ의 번역이 성적 침해의 강도를 드러내되, 본문이 직접 쓰지 않은 더 강한 현대어를 과도하게 단정하지 않아야 함
  chosen_reading: ‘욕보였기 때문에’로 번역해 수치화·침해의 의미를 드러냈습니다.
  alternative_readings:
  - ‘강간했기 때문에’
  - ‘모욕했기 때문에’
  rationale: 이 절 단독의 동사 ענה는 더 넓은 ‘낮추다/괴롭히다’ 범위를 가지므로, 본문 문구를 넘어서지 않으면서도 피해의 실질을 분명히 하는 표현이 필요합니다. POB의 ‘violated’에 상응하는 한국어로 ‘욕보이다’를 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
