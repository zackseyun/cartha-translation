lexical_decisions:
- source_word: לֹא + תַחֲרֹשׁ
  english_pob_choice: You shall not plow
  chosen_korean: 갈지 말아야 합니다
  alternatives_korean:
  - 밭갈이하지 말아야 합니다
  - 쟁기질하지 말아야 합니다
  lexicon: HALOT
  rationale: 법조문형 금지를 자연스러운 합쇼체로 옮겼습니다. '갈다'는 농경 행위를 넓게 포괄하면서도 현대 한국어에서 지나치게 장황하지 않습니다.
- source_word: בְּשׁוֹר
  english_pob_choice: with an ox
  chosen_korean: 소와
  alternatives_korean:
  - 황소와
  - 소와 함께
  lexicon: HALOT
  rationale: בְּ는 여기서 수단/동반의 전치사로 기능하므로 '소와'로 옮겼습니다. '소'가 농경 문맥에 가장 자연스럽습니다.
- source_word: וּבַחֲמֹר
  english_pob_choice: and a donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  - 나귀와
  lexicon: HALOT
  rationale: חֲמוֹר는 일반적인 'donkey'이므로 '나귀'를 택해 본문의 짝을 간결하게 살렸습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 동시에
  - 한데
  lexicon: HALOT
  rationale: 두 동물을 같은 멍에/작업에 묶어 쓰는 상황을 가장 مستقیم하게 드러내는 말로 '함께'를 선택했습니다.
theological_decisions:
- issue: 법규의 어조
  chosen_reading: 직접적인 금지 명령으로 옮겨, 율법 조항의 규범성을 유지했습니다.
  alternative_readings:
  - 설명형으로 완화해 '소와 나귀를 함께 부려서는 안 됩니다'라고 옮길 수 있음
  rationale: 본문은 서술이 아니라 언약 율법의 금지이므로, 현대 독자가 법규로 인식할 수 있도록 명령형 금지를 유지했습니다.
  doctrine_reference: 신명기 율법의 문체와 규범성
