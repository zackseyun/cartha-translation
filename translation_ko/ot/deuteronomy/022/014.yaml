  rationale: 각주 표지를 해당 원어 표현에 재배치하여 앵커 오류를 해소했습니다. 명예훼손 관용구는 자연한 현대 한국어인 ‘오명을 씌우다’로 고쳤고, 혼인 문맥의 לָקַחְתִּי는 ‘아내로 맞이하였습니다’로 명료화했습니다. 성적 접근에 관한 완곡성 및 처녀성 증거라는 법적 문맥은 유지했습니다.
