base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
  footnotes:
  - marker: a
    text: Or 'false charges.' The Hebrew phrase is idiomatic and refers to defamatory accusations.
    reason: lexical_alternative
  - marker: b
    text: Literally 'brings a bad name upon her'; that is, defames her.
    reason: lexical_alternative
  - marker: c
    text: Or 'when I went in to her,' a Hebrew euphemism for sexual relations.
    reason: lexical_alternative
  - marker: d
    text: Literally 'I did not find virginity for her.' In context this refers to evidence or tokens of virginity, as explained in the following verses.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그는 그녀에게 거짓 고발을 하고[a] 그녀에게 오명을 씌우며[b] 말합니다. “나는 이 여자를 아내로 맞이하였는데, 그녀에게 가까이 갔을 때[c] 그녀에게서 처녀성의 증거를 찾지 못했습니다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘허위 고발.’ 히브리어 표현은 관용구로, 모함하는 진술을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀에게 나쁜 이름을 가져옵니다’입니다. 곧 명예를 훼손한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀에게 들어갔을 때.’ 성관계를 가리키는 히브리어 완곡어법입니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그녀에게 처녀성을 찾지 못했다’입니다. 문맥상 다음 절들이 설명하는 법적 증거를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  english_pob_choice: he charges her with false accusations
  chosen_korean: 그녀에게 거짓 고발을 하며
  alternatives_korean:
  - 그녀에게 허위 주장을 하며
  - 그녀에게 악의적인 말을 덧씌우며
  lexicon: HALOT
  rationale: 관용구는 문자적으로는 ‘말들의 꾸밈/꾸며댐’에 가깝지만, 법정 맥락에서는 타인을 허위로 고발하는 뜻이므로 ‘거짓 고발’이 가장 직접적입니다.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  english_pob_choice: brings a bad name upon her
  chosen_korean: 그녀에게 나쁜 이름을 씌웁니다
  alternatives_korean:
  - 그녀를 악평으로 몰아넣습니다
  - 그녀의 평판을 떨어뜨립니다
  lexicon: HALOT
  rationale: ‘이름’ 이미지를 살려 수치와 명예훼손의 구체성을 유지하되, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: וָאֶקְרַב אֵלֶיהָ
  english_pob_choice: when I came near to her
  chosen_korean: 그녀에게 가까이 갔을 때
  alternatives_korean:
  - 그녀에게 들어갔을 때
  - 그녀와 관계했을 때
  lexicon: HALOT
  rationale: 히브리어의 완곡어법을 살려 직설적 표현을 피했고, POB의 레지스터도 반영했습니다.
- source_word: בְּתוּלִים
  english_pob_choice: evidence of virginity
  chosen_korean: 처녀의 증거
  alternatives_korean:
  - 처녀성의 증거
  - 처녀의 표지
  - 처녀의 흔적
  lexicon: HALOT
  rationale: 문맥상 추상적 상태가 아니라 법적 입증자료를 가리키므로, POB의 해석을 따라 ‘증거’로 옮겼습니다.
theological_decisions:
- issue: 정죄적 발화의 직접성
  chosen_reading: 본문의 법적·명예훼손적 표현을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘비난합니다’처럼 완곡하게 낮추는 번역
  - ‘부끄러운 말을 한다’처럼 정서화하는 번역
  rationale: 율법 문맥에서 이 표현은 실제 고발 행위를 가리키므로, 독자가 사건의 중대성과 폭력을 분명히 이해하도록 유지했습니다.
  doctrine_reference: 성경 본문의 법적 진술과 인격 훼손에 대한 정직한 재현
- issue: ‘이 여자’의 지시어 유지
  chosen_reading: 대상 여성을 ‘이 여자’ 대신 서술적 거리감을 약간 줄인 ‘그녀’/‘이 여자’ 혼용 대신 문맥상 자연한 ‘그녀’로 처리했습니다.
  alternative_readings:
  - ‘이 여자’
  - ‘아내’
  rationale: 히브리어는 ‘이 여자’라고 하여 법정 진술의 거리감을 드러내며, POB도 ‘this woman’을 유지합니다. 한국어에서는 반복을 줄이되 지시 대상의 특정성은 잃지 않도록 했습니다.
  doctrine_reference: 법정/서술 맥락에서의 지시어와 화행 재현
