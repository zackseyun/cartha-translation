  to: 그 형제의 나귀에 대해서도 그렇게 하십시오. 그 형제의 겉옷에 대해서도 그렇게 하십시오. 또 당신의 형제에게서 없어진 어떤 물건이든 당신이 찾아내면, 그것에 대해서도 그렇게 하십시오. 그것을 못 본 체해서는 안 됩니다.[a]
