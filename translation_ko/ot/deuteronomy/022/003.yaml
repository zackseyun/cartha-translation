  source_fidelity: 세 번째 문장의 ‘당신의 형제에게서 잃어버려 그에게서 잃고’는 히브리어 אֲשֶׁר תֹּאבַד מִמֶּנּוּ(‘그에게서 없어진/잃어버린’)를 문법적으로 잘못 중복하여 뜻이 불명확합니다. 이를 ‘당신의 형제에게서 없어진’으로 고쳐 수동·비의도적 상실의 뉘앙스를 보존했습니다. 나귀, 겉옷, 모든 잃은 물건, 발견했을 때의 의무, 그리고 외면 금지는 모두 보존됩니다.
  naturalness: 반복 법문 자체는 원문의 문체에 부합하지만, 기존 세 번째 문장은 현대 한국어로 비문입니다. ‘그 형제의’로 지시 대상을 분명히 하고, 조건절과 주절을 자연스럽게 연결했습니다. 합쇼체의 법문 등록도 유지했습니다.
