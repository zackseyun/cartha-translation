source:
  edition: WLC
  text: וְ/כֵ֧ן תַּעֲשֶׂ֣ה לַ/חֲמֹר֗/וֹ וְ/כֵ֣ן תַּעֲשֶׂה֮ לְ/שִׂמְלָת/וֹ֒ וְ/כֵ֣ן תַּעֲשֶׂ֜ה לְ/כָל אֲבֵדַ֥ת אָחִ֛י/ךָ אֲשֶׁר תֹּאבַ֥ד מִמֶּ֖/נּוּ וּ/מְצָאתָ֑/הּ לֹ֥א תוּכַ֖ל לְ/הִתְעַלֵּֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
  footnotes:
  - marker: a
    text: Or more literally, 'you may not hide yourself' or 'you may not pretend not to notice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 형제의 나귀에 대해서도 그렇게 하십시오. 그 형제의 겉옷에 대해서도 그렇게 하십시오. 또 당신의 형제에게서 없어진 어떤 물건이든 당신이 찾아내면, 그것에 대해서도 그렇게 하십시오. 그것을 못 본 체해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “자신을 숨길 수 없다” 또는 “모른 척할 수 없다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고 … 그렇게 하십시오
  alternatives_korean:
  - 그와 같이 … 하십시오
  - 또 … 그렇게 하십시오
  lexicon: HALOT
  rationale: 반복되는 법문 연결과 준칙의 계속성을 살리기 위해 접속과 지시를 함께 표현했습니다.
- source_word: לַחֲמֹרוֹ
  english_pob_choice: with his donkey
  chosen_korean: 그의 나귀에 대해서도
  alternatives_korean:
  - 그의 나귀와 관련해서도
  - 그의 나귀에 대해서도 그렇게
  lexicon: HALOT
  rationale: 앞 절의 분실물 법을 이어받는 대상을 자연스러운 한국어 법문으로 옮기기 위해 ‘-에 대해서도’로 처리했습니다.
- source_word: לְשִׂמְלָתוֹ
  english_pob_choice: with his cloak
  chosen_korean: 그의 겉옷에 대해서도
  alternatives_korean:
  - 그의 외투에 대해서도
  - 그의 옷에 대해서도
  lexicon: HALOT
  rationale: שִׂמְלָה는 겉옷/외투를 가리키므로, 더 구체적인 ‘겉옷’을 택해 소스의 물질적 이미지를 살렸습니다.
- source_word: אֲבֵדַת
  english_pob_choice: any lost thing
  chosen_korean: 어떤 잃어버린 것
  alternatives_korean:
  - 어떤 분실물
  - 잃어버린 어떤 것
  lexicon: HALOT
  rationale: 법문의 범위를 넓히는 표현이므로, 소유물로 한정하지 않고 원문의 포괄성을 유지했습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 당신의 형제자매
  - 당신의 동족
  lexicon: HALOT
  rationale: 원문의 남성 단수 호칭을 보존해, 공동체적 함의를 일반화하기보다 원문 표현을 우선했습니다.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  english_pob_choice: you may not ignore it
  chosen_korean: 그것을 못 본 체해서는 안 됩니다
  alternatives_korean:
  - 그것을 무시해서는 안 됩니다
  - 그것을 외면해서는 안 됩니다
  lexicon: HALOT
  rationale: 히트파엘의 문자적 뉘앙스인 ‘자신을 숨기다/모른 척하다’를 한국어 관용으로 옮기되, 책임 회피 금지라는 법적 힘을 살렸습니다.
theological_decisions:
- issue: אָחִיךָ의 공동체 범위와 번역어
  chosen_reading: 형제
  alternative_readings:
  - 동족
  - 동료 이스라엘 사람
  rationale: 본문은 일반화된 설명보다 직접적인 친족-공동체 언어를 사용하므로, 원문의 사회적 호칭을 그대로 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §4
- issue: לֹא תוּכַל לְהִתְעַלֵּם의 법적 강도
  chosen_reading: 못 본 체해서는 안 됩니다
  alternative_readings:
  - 무시해서는 안 됩니다
  - 외면해서는 안 됩니다
  rationale: 문자적으로는 ‘숨다/모른 척하다’의 이미지가 있지만, 문맥상 핵심은 분실물에 대한 책임 회피 금지이므로, 한국어 법문으로 자연스럽게 전달하되 금지의 강도는 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
