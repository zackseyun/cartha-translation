  naturalness: ‘그 성읍의 장로들은 그 사람을 데리고 그를 징계해야 합니다’는 현대 표준 한국어의 합쇼체 법문 문맥에서 자연스럽습니다. 다만 ‘그를’은 동사의 목적어와 중복되지만 명료성을 위해 허용됩니다.
  terminology: ‘장로들’은 여기서 공동체의 공적 지도자/재판 담당자를 가리키는 זִקְנֵי에 적절합니다. ‘성읍’은 성경 번역의 관용어이나 현대어로는 ‘그 성의’가 더 자연스럽고 עיר의 법적 관할 단위를 무리 없이 반영합니다. ‘징계하다’는 יסר의 폭을 유지합니다.
