base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
  footnotes:
  - marker: a
    text: Or 'chastise him,' 'punish him,' or possibly 'flog him.' The Hebrew verb is broad for disciplinary correction; the exact form of punishment is clarified by the surrounding legal context rather than by the verb alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 장로들은 그 사람을 붙들고 그를 징계해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 동사 יסר는 ‘훈계하다, 징계하다, 처벌하다’의 폭이 넓어, 여기서는 구체적 형벌의 종류를 특정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 어른들
  - 노인들
  lexicon: HALOT
  rationale: 법정·공동체 맥락에서 זקנים는 단순한 고령자가 아니라 공적 책임을 지는 지도자들을 가리키므로, 한국어로는 직무를 드러내는 ‘장로들’이 가장 적절합니다.
- source_word: וְלָקְחוּ
  english_pob_choice: shall take
  chosen_korean: 붙들고
  alternatives_korean:
  - 데려가고
  - 잡고
  lexicon: HALOT
  rationale: 법적 절차에서의 ‘take’는 단순한 이동보다 상대를 공식적으로 확보하는 행위를 내포하므로, 억지로 강도를 과장하지 않으면서도 구속적 뉘앙스를 살리는 ‘붙들고’를 택했습니다.
- source_word: וְיִסְּרוּ אֹתוֹ
  english_pob_choice: and discipline him
  chosen_korean: 징계해야 합니다
  alternatives_korean:
  - 훈계해야 합니다
  - 처벌해야 합니다
  - 매질해야 합니다
  lexicon: HALOT
  rationale: יסר는 교정·징계·처벌의 폭이 넓지만, 영어 POB처럼 구체적 형벌을 미리 못박지 않기 위해 포괄적인 ‘징계하다’를 사용했습니다.
theological_decisions:
- issue: 형벌의 구체성 vs. 원어의 넓은 의미
  chosen_reading: ‘징계해야 합니다’로 옮겨, 벌의 형태는 다음 문맥이 밝히는 대로 남겨 둡니다.
  alternative_readings:
  - ‘매질해야 합니다’
  - ‘벌해야 합니다’
  rationale: 원어 동사 יסר 자체는 체벌을 반드시 뜻하지 않으며, POB도 주변 법맥이 형벌의 성격을 정한다고 본다. 따라서 한국어에서도 의미를 좁히지 않는 번역이 더 충실합니다.
  doctrine_reference: 법문맥의 어휘 범위 보존
