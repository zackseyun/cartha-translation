revisions:
- from: 만일 어떤 사람이 남편이 있는 여자와 함께 누워 있는 것이 발견되면, 그 둘은 곧 죽을 것입니다—그 여자와 함께 누운 그 남자와 그 여자도 그러합니다. 그러므로 여러분은 이스라엘 가운데서 그 악을 제거해야 합니다.[a][b]
  to: 어떤 남자가 남편이 있는 여자와 동침한 것이 발견되면, 그 여자와 동침한 남자와 그 여자는 둘 다 죽어야 합니다. 그러므로 이스라엘에서 그 악을 제거해야 합니다.[a][b]
  rationale: 즉시성을 덧붙인 ‘곧’을 삭제하고, 원문의 ‘그 여자와 동침한 남자와 그 여자’라는 병렬을 한국어에서 명료하게 재구성했습니다. 성관계 관용구는 현대의 격식 있는 법률 문맥에서 분명한 ‘동침한’으로 옮겼습니다. 마지막 명령은 불필요한 복수 호칭을 빼고 신명기 법문의 정형적 표현을 유지했습니다. 두 각주 표지는 모두 본문 끝에 유지되며, 각주는 각각 혼인 상태 표현과 형벌의 법적 의미를 뒷받침합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:16Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 법률적 조건절, 혼인 상태, 쌍방에게 적용되는 죽음의 형벌, 그리고 신명기의 정형적 ‘악을 제거하다’ 표현은 대체로 반영되어 있습니다. 그러나 ‘곧’은 원문의 시간적 의미를 불필요하게 보태며, 형벌 대상의 재진술은 현행 문장에서 어색하고 의미상 불분명합니다.
  naturalness: ‘그 둘은 곧 죽을 것입니다—그 여자와 함께 누운 그 남자와 그 여자도 그러합니다’는 현대 한국어 법문으로 자연스럽지 않습니다. 특히 ‘그 여자도 그러합니다’는 앞의 형벌 규정을 불필요하게 되풀이하면서 문장 구조를 흐립니다. ‘여러분은’도 히브리어 단수 명령의 법률 문맥에는 맞지 않습니다.
  terminology: ‘남편이 있는 여자’는 혼인 상태를 무리 없이 나타내며 유지할 수 있습니다. 성관계를 가리키는 관용구는 한국어에서 법률적·명료하게 ‘동침하다’로 옮기는 것이 안전합니다. ‘죽어야 합니다’는 법규의 의무적 제재를 자연스럽게 전달하며, 각주에서 사형이라는 법적 함의를 밝혀 줄 수 있습니다.
