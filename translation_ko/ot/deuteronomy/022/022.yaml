  text: כִּֽי יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב עִם אִשָּׁ֣ה בְעֻֽלַת בַּ֗עַל וּ/מֵ֨תוּ֙ גַּם שְׁנֵי/הֶ֔ם הָ/אִ֛ישׁ הַ/שֹּׁכֵ֥ב עִם הָ/אִשָּׁ֖ה וְ/הָ/אִשָּׁ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'a married woman.' Literally, 'a woman married to a husband.'
    reason: lexical_alternative
  - marker: b
    text: '''Shall die'' here states the law''s death penalty; some translations make this explicit with ''shall be put to death.'''
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 남자가 남편이 있는 여자와 동침한 것이 발견되면, 그 여자와 동침한 남자와 그 여자는 둘 다 죽어야 합니다. 그러므로 이스라엘에서 그 악을 제거해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘남편을 둔 여자’라고 합니다. 더 자연스럽게는 ‘결혼한 여자’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘죽어야 합니다’는 법률상의 사형을 가리킵니다. 일부 번역은 이를 ‘죽임을 당해야 합니다’로 더 분명히 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  english_pob_choice: is found
  chosen_korean: 발견되면
  alternatives_korean:
  - 드러나면
  - 잡히면
  lexicon: HALOT
  rationale: 법률 문맥에서 니팔형의 수동적 의미를 살려, 존재 진술이 아니라 ‘발견됨’을 나타내는 표현으로 옮겼습니다.
- source_word: שֹׁכֵב עִם
  english_pob_choice: lying with
  chosen_korean: 함께 누워 있는
  alternatives_korean:
  - 동침하는
  - 잠자리를 같이하는
  lexicon: HALOT
  rationale: 성관계를 뜻하는 히브리 관용구를 직접 반영하면서도, 현대 한국어에서 지나치게 구어적인 표현은 피했습니다.
- source_word: בְעֻלַת בַּעַל
  english_pob_choice: married to a husband
  chosen_korean: 남편이 있는 여자
  alternatives_korean:
  - 남편에게 속한 여자
  - 남편과 결혼한 여자
  lexicon: HALOT
  rationale: 문자적으로는 ‘남편을 가진’ 상태를 가리키므로, 소유 뉘앙스를 과도하게 살리지 않으면서도 혼인 상태가 분명히 드러나게 했습니다.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  english_pob_choice: then both of them shall die
  chosen_korean: 그 둘은 곧 죽을 것입니다
  alternatives_korean:
  - 그 둘은 반드시 죽어야 합니다
  - 그 둘은 죽임을 당할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 법정형 제재를 반영하되, 원문이 직접적으로 말하는 ‘죽다’를 유지했습니다. 한국어에서는 미래형으로 법적 판결의 효력을 자연스럽게 나타낼 수 있습니다.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  english_pob_choice: So you shall purge the evil from Israel
  chosen_korean: 그러므로 여러분은 이스라엘 가운데서 그 악을 제거해야 합니다
  alternatives_korean:
  - 그러므로 여러분은 이스라엘에서 악을 없애야 합니다
  - 그러므로 여러분은 이스라엘에서 그 악을 정결하게 해야 합니다
  lexicon: HALOT
  rationale: Deuteronomy의 정형구를 따라 ‘악을 제거하다’로 옮겼고, ‘가운데서’는 공동체로부터의 제거라는 전치사의 함의를 살렸습니다.
theological_decisions:
- issue: 죽음 형벌의 표현 방식
  chosen_reading: 그 둘은 곧 죽을 것입니다
  alternative_readings:
  - 그 둘은 반드시 죽어야 합니다
  - 그 둘은 죽임을 당할 것입니다
  rationale: 히브리어 본문은 ‘죽다’라고 말하지만, 법문 맥락상 사형을 뜻합니다. 본문 표현을 우선하되 판결의 엄중함은 문맥이 전달하도록 두었습니다.
  doctrine_reference: Translation philosophy §1, §5
