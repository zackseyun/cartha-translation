revisions:
- from: 하지만 네 형제가 네 곁에 가까이 있지 않고, 네가 그를 알지 못하면, 그것을 네 집 안으로 가져가야 합니다. 그리고 그것이 네 곁에 있게 하되, 네 형제가 그것을 찾을 때까지 그렇게 해야 합니다. 그러면 너는 그것을 그에게 돌려주어야 합니다.[a][b][c]
  to: 그러나 네 형제[a]가 네 가까이에 있지 않거나 네가 그를[b] 알지 못하면, 그것을 네 집 안으로 가져가서 네 형제가 그것을 찾을 때까지 네 곁에 두어야 합니다. 그러면 그것을 그에게 돌려주어야 합니다.[c]
  rationale: 원문의 문장 구조와 법적 흐름을 보존하면서, 지속적 보관을 ‘네 곁에 두어야 합니다’로 명료화했습니다. ‘형제’ 및 ‘그를 알지 못하다’의 의도적 문법적 모호성은 유지하고 각주를 각각 해당 어구에 배치했습니다. 반환 동사에 관한 각주 c는 의미를 바꾸는 시간 표현을 제거하고 적절한 한국어 어휘 대안으로 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:11Z'
