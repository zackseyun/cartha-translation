  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
  footnotes:
  - marker: a
    text: Hebrew 'your brother' likely refers broadly to a fellow member of the covenant community, not only a biological brother.
    reason: cultural_note
  - marker: b
    text: Or 'you do not know whose it is'; literally, 'you do not know him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'return it to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 네 형제가 네 곁에 가까이 있지 않고, 네가 그를 알지 못하면, 그것을 네 집 안으로 가져가야 합니다. 그리고 그것이 네 곁에 있게 하되, 네 형제가 그것을 찾을 때까지 그렇게 해야 합니다. 그러면 너는 그것을 그에게 돌려주어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘형제’는 여기서 단순한 친형제보다 언약 공동체의 동료를 넓게 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘네가 그것이 누구의 것인지 알지 못하면’로 옮길 수 있습니다. 히브리어는 직역하면 ‘그를 알지 못하고’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것을 되돌려줄 때까지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 네 형제
  alternatives_korean:
  - 네 형님
  - 네 동족
  - 네 이웃
  lexicon: HALOT
  rationale: 직역의 친족 언어를 살리되, 신명기 율법 문맥에서 혈연만이 아니라 공동체 구성원을 가리킬 수 있다는 주석을 본문 밖 설명으로 유지했습니다.
- source_word: קָרוֹב אֵלֶיךָ
  english_pob_choice: is not near you
  chosen_korean: 네 곁에 가까이 있지 않고
  alternatives_korean:
  - 네게 가까이 있지 않고
  - 네 가까이에 있지 않고
  - 네 곁에 있지 않고
  lexicon: HALOT
  rationale: ‘가까이 있다’의 공간적 의미를 자연스러운 한국어로 옮기되, 단순한 관계적 거리보다 물리적 근접을 드러냈습니다.
- source_word: וְלֹא יְדַעְתּוֹ
  english_pob_choice: you do not know him
  chosen_korean: 네가 그를 알지 못하면
  alternatives_korean:
  - 네가 그것이 누구의 것인지 알지 못하면
  - 네가 그를 알아보지 못하면
  lexicon: HALOT
  rationale: 히브리어의 목적격 대명사 ‘그를’ 형식을 살려, 소유자와의 인지 관계가 끊긴 상황을 본문대로 반영했습니다.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  english_pob_choice: you shall bring it into your house
  chosen_korean: 그것을 네 집 안으로 가져가야 합니다
  alternatives_korean:
  - 그것을 네 집으로 데려가야 합니다
  - 그것을 네 집 안에 들여야 합니다
  lexicon: HALOT
  rationale: ‘אסף’의 모으다/가져가다 의미를 살리면서, 뒤의 ‘집 안’과 결합해 자연스러운 이동 동작을 표현했습니다.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  english_pob_choice: you shall restore it to him
  chosen_korean: 그것을 그에게 돌려주어야 합니다
  alternatives_korean:
  - 그것을 그에게 회복시켜야 합니다
  - 그것을 그에게 반환해야 합니다
  lexicon: HALOT
  rationale: 법률 문맥에서 שוב의 사역형을 ‘돌려주다’로 옮겨, 반환 의무를 분명하고 현대적으로 전달했습니다.
theological_decisions:
- issue: 공동체 내부의 ‘형제’ 언어를 어떻게 처리할지
  chosen_reading: 본문의 친족 표현을 그대로 살려 ‘형제’로 옮기고, 공동체적 확장 가능성은 각주로 처리하지 않았습니다.
  alternative_readings:
  - ‘동족’으로 일반화
  - ‘이웃’으로 윤리적 범주화
  rationale: 히브리어는 실제로 형제 언어를 사용하며, 이를 미리 비혈연 공동체 용어로 바꾸면 원문이 주는 법적·언약적 근접성을 약화시킬 수 있습니다.
  doctrine_reference: 신명기 율법의 언약 공동체 표지
- issue: ‘찾다’와 ‘돌려주다’의 법적 뉘앙스
  chosen_reading: ‘찾을 때까지’와 ‘돌려주어야 합니다’로, 임시 보관과 최종 반환 의무를 구분했습니다.
  alternative_readings:
  - ‘요구할 때까지’
  - ‘되찾을 때까지’
  rationale: דרש는 단순 탐색보다 잃은 것을 찾아 권리를 주장하는 법적 요청을 포함할 수 있어, 문맥상 ‘찾다’가 가장 간결하면서도 의무 구조를 유지합니다.
  doctrine_reference: 재산 회복과 이웃 사랑의 법
