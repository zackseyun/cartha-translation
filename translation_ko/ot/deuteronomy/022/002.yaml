  naturalness: ‘네 곁에 가까이’는 의미가 중복되고, ‘네 곁에 있게 하되 … 그렇게 해야 합니다’는 현대 표준어 합쇼체 문장으로 매끄럽지 않습니다. ‘가까이에 있지 않거나’, ‘네 곁에 두어야 합니다’로 고치면 자연스럽고 원문의 의미도 유지됩니다.
  terminology: אָחִיךָ는 본문에서 ‘네 형제’로 유지하고 공동체적 범위를 각주로 설명한 것은 적절합니다. וַהֲשֵׁבֹתוֹ לוֹ는 ‘그에게 돌려주어야 합니다’가 법률 문맥에 알맞습니다. 각주 c는 이 동사의 가능한 대안인 ‘반환하다’를 제시하도록 수정해야 합니다.
