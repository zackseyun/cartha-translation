  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
  footnotes:
  - marker: a
    text: Or 'the girl.' The Hebrew נַעַר can refer to a young female person, with nuance determined by context.
    reason: lexical_alternative
  - marker: b
    text: Or 'a disgraceful thing' or 'a vile act.' The Hebrew נְבָלָה denotes a morally shocking outrage.
    reason: lexical_alternative
  - marker: c
    text: Or 'by committing sexual immorality.' The Hebrew verb זנה literally evokes prostitution/harlotry and is often used more broadly for illicit sexual conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 그 소녀를 그 아버지의 집 문어귀로 끌어내고, 그 성읍의 사람들이 돌로 그를 쳐서 그가 죽게 해야 합니다. 이는 그가 이스라엘 가운데서 부끄러운 일을 저질러, 그 아버지의 집에서 창녀짓을 했기 때문입니다. 그렇게 하여 당신들은 당신들 가운데서 악을 없애야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 문맥에 따라 젊은 여성, 곧 소녀를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְבָלָה는 단순한 어리석음이 아니라 공동체를 충격시키는 수치스러운 악행을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 זנה는 문자적으로는 창녀/매춘의 이미지를 띠며, 문맥에 따라 더 넓은 성적 부정행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  english_pob_choice: the young woman
  chosen_korean: 그 소녀
  alternatives_korean:
  - 그 젊은 여자
  - 그 여자아이
  lexicon: HALOT
  rationale: 이 문맥의 נַעַר는 젊은 여성/소녀를 가리킬 수 있으므로, 법문체에 자연스러운 ‘소녀’를 택해 연령감과 미혼의 뉘앙스를 살렸습니다.
- source_word: פֶּתַח
  english_pob_choice: the entrance
  chosen_korean: 문어귀
  alternatives_korean:
  - 입구
  - 문
  - 출입구
  lexicon: HALOT
  rationale: פֶּתַח의 기본 뜻인 ‘열린 곳/입구’를 살리면서도, 집 문 앞이라는 법적·공간적 장면을 한국어로 자연스럽게 드러내기 위해 ‘문어귀’를 사용했습니다.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  english_pob_choice: shall stone her with stones
  chosen_korean: 돌로 그를 쳐서
  alternatives_korean:
  - 돌로 치고
  - 돌로 쳐서
  lexicon: HALOT
  rationale: 히브리어는 ‘돌로 치다’와 ‘돌들로’의 반복을 통해 처형의 강도를 강조합니다. 한국어에서는 중복을 과도하게 반복하기보다 ‘돌로 그를 쳐서’로 법적 형벌의 폭력을 유지했습니다.
- source_word: נְבָלָה
  english_pob_choice: an outrageous act
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 가증한 일
  - 추악한 일
  - 난폭한 짓
  lexicon: HALOT
  rationale: נְבָלָה는 도덕적으로 충격적인 수치를 뜻하므로, 지나치게 현대적이거나 설명적인 표현보다 ‘부끄러운 일’로 공동체적 수치와 법적 비난을 함께 전달했습니다.
- source_word: לִזְנוֹת
  english_pob_choice: by prostituting herself
  chosen_korean: 창녀짓을 했기 때문입니다
  alternatives_korean:
  - 음행을 했기 때문입니다
  - 매춘을 했기 때문입니다
  - 음란한 일을 했기 때문입니다
  lexicon: HALOT
  rationale: זנה의 본래적 이미지는 ‘창녀/매춘’의 행위입니다. 본문의 거친 도덕적·비유적 색채를 약화시키지 않기 위해 보다 직접적인 표현을 택했습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: So you shall purge the evil from your midst
  chosen_korean: 그렇게 하여 당신들은 당신들 가운데서 악을 없애야 합니다
  alternatives_korean:
  - 그러므로 당신은 당신들 가운데서 악을 제거해야 합니다
  - 그리하여 너희 가운데서 악을 제해야 합니다
  lexicon: HALOT
  rationale: בער은 반복되는 신명기 법문 공식이지만, 한국어에서는 ‘없애다’가 가장 자연스럽고 직관적으로 공동체 정화의 뜻을 전달합니다. 2인칭 복수는 본문의 공동체적 명령을 살리기 위해 ‘당신들은’으로 옮겼습니다.
theological_decisions:
- issue: 성별 지시와 법문체의 정확성
  chosen_reading: 히브리어의 남성 복수 ‘그 성읍의 사람들이’를 그대로 살리고, 한국어에서도 이를 중화하지 않았습니다.
  alternative_readings:
  - 그 성읍의 사람들
  - 그 성읍 주민들이
  rationale: 본문은 남성 복수 법적 주체를 사용하므로, 성별 지시를 흐리지 않는 쪽이 원문 이해를 더 충실히 반영합니다.
  doctrine_reference: gender-accurate translation principle
- issue: 직접적 성적 언어의 보존
  chosen_reading: לִזְנוֹת의 성적·도덕적 충격을 완화하지 않고 ‘창녀짓을 했기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 음행을 했기 때문입니다
  - 성적으로 부정했기 때문입니다
  rationale: 이 구절은 완곡한 일반론보다 법적 고발의 강도가 중요하므로, 원문의 거친 도덕적 판단을 유지하는 것이 본문의 의미를 더 잘 드러냅니다.
  doctrine_reference: translation philosophy §§1, 3, 6
