revisions:
- from: 그러면 그들은 그 소녀를 그 아버지의 집 문어귀로 끌어내고, 그 성읍의 사람들이 돌로 그를 쳐서 그가 죽게 해야 합니다. 이는 그가 이스라엘 가운데서 부끄러운 일을 저질러, 그 아버지의 집에서 창녀짓을 했기 때문입니다. 그렇게 하여 당신들은 당신들 가운데서 악을 없애야 합니다.[a][b][c]
  to: 그러면 그들은 그 소녀[a]를 그녀의 아버지 집 입구로 데리고 나가고, 그 성읍의 남자들은 돌로 그 소녀를 쳐 죽여야 합니다. 이는 그 소녀가 이스라엘에서 수치스러운 일[b]을 저질러, 아버지의 집에 있으면서 음행하였기[c] 때문입니다. 그리하여 당신은 당신 가운데서 악을 없애야 합니다.
  rationale: 여성 지시어와 소유 관계를 바로잡고, 원문의 남성 복수 행위 주체와 남성 단수 2인칭 법문 공식을 보존했습니다. 또한 현대 격식체에 맞지 않는 ‘창녀짓’을 ‘음행하다’로 바꾸되, זנה의 문자적·확장된 의미는 각주로 보존했습니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:35Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 여성 단수 목적어와 주어를 여러 차례 남성 대명사 ‘그’로 받으며, ‘그 아버지’도 소유 관계를 잘못 드러냅니다. 또한 히브리어의 ‘그 성읍의 남자들’과 마지막의 남성 단수 2인칭 법문 공식을 더 정확히 반영할 필요가 있습니다.
  naturalness: ‘문어귀’는 가능하나 현대 표준어 법문에서는 ‘집 입구’가 더 자연스럽습니다. ‘창녀짓’은 구어적이고 낙인성이 강해 현대의 격식 있는 번역문에 적합하지 않습니다. ‘음행하다’는 이 법적 문맥에서 זנה의 넓은 성적 부정 의미를 자연스럽게 옮기며, 각주에서 문자적 매춘 이미지를 보완할 수 있습니다.
  terminology: נְבָלָה는 단순히 ‘부끄러운 일’보다 ‘수치스러운 일’ 또는 ‘가증한 일’처럼 공동체적으로 충격적인 도덕적 악행을 나타내는 표현이 적절합니다. ‘음행하다’는 실제 매춘으로 단정하지 않으면서도 זנה의 강한 성적·도덕적 용례를 보존합니다.
  issues:
  - severity: high
    issue: 여성인 ‘소녀’를 남성 대명사 ‘그/그가’로 지시함
    rationale: הַנַּעַר는 이 문맥에서 여성 단수이며, 뒤따르는 여성 접미사와 동사 형태도 이를 명확히 합니다. 한국어에서는 ‘그 소녀/그녀’로 일관되게 지시해야 합니다.
  - severity: medium
    issue: ‘그 아버지의 집’이 소녀의 아버지라는 소유 관계를 흐림
    rationale: בֵּית אָבִיהָ는 ‘그녀의 아버지 집’입니다. ‘그 아버지’는 한국어에서 선행 남성 인물을 가리키는 듯하여 부정확하고 부자연스럽습니다.
  - severity: medium
    issue: ‘그 성읍의 사람들이’가 אַנְשֵׁי עִירָהּ의 남성 표지를 중화함
    rationale: 원문은 직역하여 ‘그녀의 성읍의 남자들’입니다. 이 법문에서는 ‘그 성읍의 남자들’로 옮기는 것이 원문과 영어 POB의 결정을 반영합니다.
  - severity: medium
    issue: ‘창녀짓’이 현대 격식체에 비해 구어적·낙인적이며 실제 매춘을 단정할 위험이 있음
    rationale: זנה는 매춘의 이미지를 지니지만 문맥상 더 넓은 불법적 성행위를 가리킬 수 있습니다. ‘음행하다’로 본문을 옮기고 각주에서 의미 범위를 밝혀야 합니다.
  - severity: medium
    issue: 마지막 법문 공식을 ‘당신들은 당신들’로 복수화함
    rationale: וּבִעַרְתָּ는 남성 단수 2인칭입니다. 공동체 전체를 향한 법문이라는 함의는 있으나, 번역 본문에서는 ‘당신은 당신 가운데서’로 형태를 보존하는 편이 안전합니다.
