  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
  footnotes:
  - marker: a
    text: Or 'put it under the ban'; the Hebrew verb denotes devoting something irrevocably to destruction.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the mouth of the sword,' an idiom meaning 'with the edge of the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 반드시 그 성읍의 주민들을 칼날로 쳐야 합니다[a]. 그 성읍과 그 안에 있는 모든 것과 그 가축을 칼날로 진멸해야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘치다’의 부정사절대형과 미완료형을 함께 써서 명령을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘칼의 입으로’이지만, 관용적으로는 ‘칼날로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  english_pob_choice: You shall surely strike
  chosen_korean: 반드시 … 쳐야 합니다
  alternatives_korean:
  - 반드시 … 쳐야 합니다
  - 정녕 … 쳐야 합니다
  - 반드시 … 공격해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 부정사절대형+미완료형이 주는 강한 강조를 한국어의 ‘반드시’로 살리고, 본동사 ‘치다’로 전투적이고 직접적인 폭력을 과도하게 완화하지 않았습니다.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  english_pob_choice: the inhabitants of that city
  chosen_korean: 그 성읍의 주민들
  alternatives_korean:
  - 그 성읍에 거주하는 자들
  - 그 성읍의 거주자들
  lexicon: HALOT
  rationale: 거주하는 사람들을 가리키는 분사 표현을 현대 한국어의 자연스러운 집단명사 ‘주민들’로 옮겼습니다.
- source_word: הַחֲרֵם
  english_pob_choice: devoting it to destruction
  chosen_korean: 진멸하여 버리고
  alternatives_korean:
  - 진멸하고
  - 멸하여 바치고
  - 저주 아래 두고
  lexicon: HALOT
  rationale: חרם의 제의적·전면적 소멸 의미를 살리기 위해 ‘진멸하다’를 택했고, POB의 ‘devoting to destruction’에 해당하는 결과를 한국어 동사형으로 드러냈습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  - 칼의 가장자리로
  lexicon: HALOT
  rationale: 직역상 ‘칼의 입’이지만 한국어 관용에 맞게 ‘칼날’로 옮겨, 도구의 날 부분이라는 구체적 이미지를 보존했습니다.
theological_decisions:
- issue: חרם(ḥerem)의 번역과 심판 명령의 강도 유지
  chosen_reading: ‘진멸하여 버리고’로 옮겨, 전면적 파괴와 헌납의 긴장을 함께 보이게 했습니다.
  alternative_readings:
  - ‘완전히 멸하고’
  - ‘진멸하고’
  - ‘금지 아래 두고’
  rationale: 본문은 단순한 군사적 패배가 아니라 거룩한 심판 아래 놓인 전면적 파괴를 말하므로, 완곡하게 낮추지 않고 그 무게를 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
