  source_fidelity: 수정이 필요합니다. 초안은 חרם의 목적어인 ‘그 성읍’을 ‘그것’으로 받으면서, 뒤의 ‘그 안에 있는 모든 것과 그 가축’에 대한 칼의 표현을 다시 ‘치다’에 연결합니다. 히브리어에서는 두 번째 ‘칼날로’가 성읍 및 그 안의 모든 것과 가축을 ‘진멸하다’(החרם)의 방식으로 수식합니다. 이를 명시하면 문장 구조와 범위가 더 정확해집니다.
