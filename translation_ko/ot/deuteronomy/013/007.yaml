revisions:
- from: 당신의 형제, 곧 당신의 어머니에게서 난 아들이나 당신의 아들이나 당신의 딸이나 당신의 품에 있는 아내나 당신의 영혼 같은 당신의 친구가 몰래 당신을 꾀어 말하기를, 「가서 다른 신들을 섬기자」—당신과 당신의 조상들이 알지 못하던 신들—[a][b]
  to: 네 형제, 곧 네 어머니에게서 난 아들이나 네 아들이나 네 딸이나 네 품에 안은 아내[a]나 네 영혼과 같은 친구[b]가 은밀히 너를 꾀어 ‘가서 다른 신들을 섬기자’ 하고 말한다면—곧 너와 네 조상들이 알지 못하던 신들이라면—
  rationale: 수정은 본문의 의미를 바꾸지 않고, 히브리어 관용구의 소유 관계를 바로잡고 각주를 해당 어구에 직접 연결했습니다. 또한 현대 한국어의 직접 호칭에서는 ‘당신’보다 자연스러운 ‘네’를 사용했습니다. 본절은 다음 절로 이어지는 조건절이므로 ‘말한다면’과 대시로 미완결 구조를 보존했습니다.
