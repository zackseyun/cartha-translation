review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional setup, the close-relationship list, the secret enticement, the cohortative invitation, and the final relative clause. However, its footnote anchors are both placed after the whole verse rather than on the expressions they explain, and footnote a reverses the Hebrew possessive relationship ('아내의 품' rather than '당신의 품의 아내').
  naturalness: ‘당신의 … 당신의 …’ is unnecessarily repetitive and ‘당신의 품에 있는 아내’ can suggest mere physical location rather than the Hebrew intimacy idiom. ‘네’ is the natural conventional second-person form in a direct biblical address, while the quoted invitation remains natural as ‘섬기자.’
  terminology: ‘꾀어,’ ‘다른 신들,’ and ‘섬기자’ are appropriate. ‘네 영혼과 같은 친구’ retains the deliberately intense נפש expression without choosing only ‘생명’ or reducing it to ‘가장 친한 친구.’
  issues:
  - severity: medium
    issue: Footnote anchors do not identify the terms being annotated.
    rationale: Footnote a concerns אֵשֶׁת חֵיקֶךָ and footnote b concerns רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ, but both markers occur at the verse end. They should immediately follow their respective Korean renderings.
  - severity: medium
    issue: Footnote a mistranslates the possessive structure of the Hebrew idiom.
    rationale: אֵשֶׁת חֵיקֶךָ means ‘the wife of your bosom/embrace,’ not ‘the bosom of the wife’ (‘아내의 품’).
  - severity: low
    issue: The rendering of the intimate-wife idiom is potentially misleading.
    rationale: ‘당신의 품에 있는 아내’ may be read spatially. ‘네 품에 안은 아내’ conveys the close-embrace imagery more naturally while remaining suitably literal.
  revised_text: 네 형제, 곧 네 어머니에게서 난 아들이나 네 아들이나 네 딸이나 네 품에 안은 아내[a]나 네 영혼과 같은 친구[b]가 은밀히 너를 꾀어 ‘가서 다른 신들을 섬기자’ 하고 말한다면—곧 너와 네 조상들이 알지 못하던 신들이라면—
  revised_footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘네 품의 아내’입니다. 가장 가까운 친밀 관계를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 생명과 같은 친구’.
    reason: lexical_alternative
  revision_rationale: 수정은 본문의 의미를 바꾸지 않고, 히브리어 관용구의 소유 관계를 바로잡고 각주를 해당 어구에 직접 연결했습니다. 또한 현대 한국어의 직접 호칭에서는 ‘당신’보다 자연스러운 ‘네’를 사용했습니다. 본절은 다음 절로 이어지는 조건절이므로 ‘말한다면’과 대시로 미완결 구조를 보존했습니다.
