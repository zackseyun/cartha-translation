  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
  footnotes:
  - marker: a
    text: 'Hebrew: ''the wife of your bosom''—an idiom for a wife held in closest intimacy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your friend who is as your own life/soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 형제, 곧 네 어머니에게서 난 아들이나 네 아들이나 네 딸이나 네 품에 안은 아내[a]나 네 영혼과 같은 친구[b]가 은밀히 너를 꾀어 ‘가서 다른 신들을 섬기자’ 하고 말한다면—곧 너와 네 조상들이 알지 못하던 신들이라면—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘네 품의 아내’입니다. 가장 가까운 친밀 관계를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 생명과 같은 친구’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  english_pob_choice: secretly entices you
  chosen_korean: 몰래 당신을 꾀어
  alternatives_korean:
  - 은밀히 당신을 유혹하여
  - 몰래 당신을 부추겨
  lexicon: HALOT
  rationale: 히필형 סות의 ‘꾀다/유혹하다/부추기다’ 의미를 살리되, 문맥의 בַּסֵּתֶר와 함께 ‘몰래’로 자연스럽게 옮겼습니다.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  english_pob_choice: your brother, the son of your mother
  chosen_korean: 당신의 형제, 곧 당신의 어머니에게서 난 아들
  alternatives_korean:
  - 당신의 어머니의 아들인 형제
  - 당신의 친형제
  lexicon: HALOT
  rationale: 직계 친족을 강조하는 히브리어의 병치를 풀지 않고, ‘곧’으로 설명적 동격을 드러냈습니다.
- source_word: אֵשֶׁת חֵיקֶךָ
  english_pob_choice: the wife of your bosom / embrace
  chosen_korean: 당신의 품에 있는 아내
  alternatives_korean:
  - 당신이 품에 안은 아내
  - 당신의 품안 아내
  lexicon: HALOT
  rationale: חֵיק의 친밀한 신체 은유를 현대 한국어에서 이해되도록 ‘품’으로 옮기되, 관계의 밀착성을 유지했습니다.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  english_pob_choice: your friend who is like your own soul
  chosen_korean: 당신의 영혼 같은 당신의 친구
  alternatives_korean:
  - 당신의 혼과 같은 친구
  - 당신의 생명 같은 친구
  lexicon: HALOT
  rationale: נֶפֶשׁ의 강한 인격적 친밀성을 살려, 단순한 우정보다 더 깊은 결속을 나타내도록 했습니다.
- source_word: נֵלְכָה וְנַעַבְדָה
  english_pob_choice: Let us go and serve
  chosen_korean: 가서 다른 신들을 섬기자
  alternatives_korean:
  - 가서 섬기자
  - 가자, 그리고 다른 신들을 섬기자
  lexicon: HALOT
  rationale: עבד는 여기서 ‘예배하다’보다 넓은 ‘섬기다’가 적절하며, 청유형의 흐름을 자연스럽게 살렸습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 타신들
  - 이방 신들
  lexicon: HALOT
  rationale: אֲחֵרִים의 기본 의미를 따라 ‘다른 신들’로 직역하되, 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 가장 가까운 인간관계들을 열거하는 수사 유지
  chosen_reading: 형제, 어머니의 아들, 아들, 딸, 아내, 친구를 차례로 제시해 배교 유혹의 중대성을 그대로 드러냈습니다.
  alternative_readings:
  - 더 자연스럽게 묶어 ‘가족이나 가장 친한 친구’로 압축하기
  rationale: 본문은 가장 가까운 관계를 열거해 경고의 무게를 높이므로, 현대어로도 그 수사적 압박감을 보존하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
