  - marker: b
    text: In some English versifications, this verse is numbered as Deuteronomy 12:32.
    reason: textual_variant
translation:
  language: ko
  text: 내가 너희에게 명령하는 모든 말씀[a]을 지켜 행하십시오. 거기에 더하지 말고, 거기에서 빼지도 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집합적 단수 표현으로, 문자적으로는 ‘그 말씀 전체’에 가깝습니다.
    reason: source_note
  - marker: b
    text: 일부 영어 및 성경 장절 전통에서는 이 절을 신명기 12:32로 번호 매깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  english_pob_choice: Every word / all the word
  chosen_korean: 모든 말씀
  alternatives_korean:
  - 모든 דבר
  - 모든 말
  - 각각의 말씀
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 뉘앙스를 살리면서도 한국어에서는 ‘모든 말씀’이 가장 자연스럽고, ‘말씀’이 하나님의 명령 내용을 가리키는 법적·권위적 문맥에 잘 맞습니다.
- source_word: מְצַוֶּה
  english_pob_choice: am commanding
  chosen_korean: 명령하는
  alternatives_korean:
  - 명하고 있는
  - 명령하고 있는
  - 내가 지금 명하는
  lexicon: HALOT
  rationale: 현재 분사형의 지속적·현장적 명령성을 살리기 위해 ‘명령하는’으로 옮겼습니다.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  english_pob_choice: shall be careful to do
  chosen_korean: 지켜서 행해야 합니다
  alternatives_korean:
  - 주의하여 행해야 합니다
  - 잘 지켜 행해야 합니다
  - 지켜 행해야 합니다
  lexicon: HALOT
  rationale: ‘지키다+행하다’의 관용구를 한국어 법률·언약 문맥에 자연스럽게 살리면서, ‘careful’의 주의 깊은 준수 의미를 포함하도록 했습니다.
- source_word: לֹא תֹסֵף / וְלֹא תִגְרַע
  english_pob_choice: shall not add to it / shall not take away from it
  chosen_korean: 거기에 더하지도 말고, 거기에서 빼지도 마십시오
  alternatives_korean:
  - 거기에 더하지도 말고, 거기에서 덜어내지도 마십시오
  - 거기에 보태지도 말고, 거기에서 없애지도 마십시오
  - 더하지도 빼지도 마십시오
  lexicon: HALOT
  rationale: ‘add/take away’의 금지 구조를 한국어로 직접적이고 명료하게 옮겼습니다. ‘빼다’는 원문의 ‘감하다/줄이다’ 의미를 현대어로 자연스럽게 전달합니다.
theological_decisions:
- issue: 언약적 율법의 절대적 보존과 준수
  chosen_reading: 이 구절을 인간의 편집이나 보완을 금하는 언약 명령으로 직설적으로 번역했습니다.
  alternative_readings:
  - 권면 정도로 완화하여 옮기는 방식
  - 전통적 교훈 문체로 순화하는 방식
  rationale: 히브리어의 금지형은 단순한 조언이 아니라 말씀에 대한 추가·삭제 금지를 선언하므로, 현대 한국어에서도 그 규범적 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 신명기 4:2과의 주제적 연관
