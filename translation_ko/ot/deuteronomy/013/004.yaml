id: DEU.13.4
reference: Deuteronomy 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
  footnotes:
  - marker: a
    text: Or 'whether you love the LORD your God.' The Hebrew participle can be rendered as a simple present, though 'are loving' more explicitly reflects the ongoing/state nuance.
    reason: lexical_alternative
  - marker: b
    text: '''Soul'' here can also mean ''life,'' ''self,'' or ''being.'' In this covenant formula, ''soul'' preserves the traditional and intertextually important wording.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 예언자의 말이나 그 꿈을 꾸는 자의 말은 들으시면 안 됩니다. 왜냐하면 여러분의 하나님 야훼께서 여러분을 시험하시어, 여러분이 여러분의 하나님 야훼를 온 마음과 온 목숨으로 사랑하는지 아시려는 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  english_pob_choice: You shall not listen to
  chosen_korean: 들으시면 안 됩니다
  alternatives_korean:
  - 귀 기울이시면 안 됩니다
  - 들어서는 안 됩니다
  lexicon: HALOT
  rationale: שׁמע 뒤에 אֶל이 오면 단순 청취보다 ‘듣고 따르다’의 뉘앙스가 있어, 금지의 직접성을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא / חוֹלֵם הַחֲלוֹם הַהוּא
  english_pob_choice: the words of that prophet / that dreamer of dreams
  chosen_korean: 그 예언자나 그 꿈꾸는 자
  alternatives_korean:
  - 그 예언자의 말이나 그 꿈꾸는 자
  - 그 예언자나 꿈을 꾸는 자
  lexicon: HALOT
  rationale: 히브리어의 평행구조를 살리되, 한국어에서는 ‘그 예언자’와 ‘그 꿈꾸는 자’로 간결하게 대응시켜 대상의 식별성을 유지했습니다.
- source_word: מְנַסֶּה
  english_pob_choice: is testing
  chosen_korean: 시험하셔서
  alternatives_korean:
  - 검증하셔서
  - 알아보셔서
  lexicon: HALOT
  rationale: נסה의 핵심 의미는 ‘시험하다/검증하다’이므로 ‘시험하셔서’가 문맥의 평가적·계약적 의미를 가장 직접적으로 드러냅니다.
- source_word: לָדַעַת הֲיִשְׁכֶם אֹהֲבִים
  english_pob_choice: to know whether you are loving
  chosen_korean: 여러분이 ... 사랑하는지 아시려는 것입니다
  alternatives_korean:
  - 여러분이 ... 사랑하는지 알려고 하시는 것입니다
  - 여러분이 ... 사랑하는지 알아보려는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 목적절 ‘to know’와 진행상 뉘앙스를 한국어의 간접의문 ‘-는지’로 살리면서, 동사 ‘아시려는 것입니다’로 목적성을 드러냈습니다.
- source_word: נַפְשְׁכֶם
  english_pob_choice: your soul
  chosen_korean: 온 목숨
  alternatives_korean:
  - 온 영혼
  - 온 존재
  lexicon: HALOT
  rationale: נפשׁ는 ‘생명/목숨/자기/영혼’의 폭이 있으므로, 이 언약적 정형구에서는 현대어로도 자연스럽고 의미 폭을 유지하는 ‘목숨’을 택했습니다.
theological_decisions:
- issue: יהוה의 표기와 언약적 호칭
  chosen_reading: 야훼 여러분의 하나님
  alternative_readings:
  - 여호와 여러분의 하나님
  - 주 여러분의 하나님
  rationale: 본문의 고유신명 ישוהה를 일반 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 유지해 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘to know’의 신적 인식 표현
  chosen_reading: 아시려는 것입니다
  alternative_readings:
  - 알아보시려는 것입니다
  - 드러내시려는 것입니다
  rationale: ‘시험하다 ... to know’의 인과 목적 구조를 그대로 두어, 본문이 말하는 하나님의 시험과 인식의 긴장을 해소하지 않고 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
