  terminology: יְהוָה는 프로젝트 결정에 따라 '야훼'로 유지했습니다. חֵרֶם은 '진멸에 바쳐진 것'으로 번역하고 해당 어휘 주석을 정확한 위치에 붙였습니다. רַחֲמִים/רִחַמְךָ의 연속은 '긍휼을 베푸시며/불쌍히 여기시고'로 구별했습니다. אֲבֹתֶיךָ는 원문의 성별 특정성과 족장 언약의 지시를 보존하여 '조상들에게' 대신 '아버지들에게'로 옮겼습니다.
