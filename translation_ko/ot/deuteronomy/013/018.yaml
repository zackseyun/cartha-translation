reference: Deuteronomy 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'nothing from the ban' or 'nothing of what is under the ban.' The Hebrew חֵרֶם refers to something devoted irrevocably to God, often for destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the fierceness of his nose/anger,' an idiom for intense anger.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너희 손에는 아무것도 남아 있어서는 안 됩니다. 곧 야훼께서 그의 진노의 격렬함에서 돌이키시고, 너희에게 긍휼을 주시며, 너희를 불쌍히 여기시고, 너희를 번성하게 하실 것입니다 — 그가 너희 조상들에게 맹세하신 대로 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵרֶם은 하나님께 돌이킬 수 없이 바쳐진 것을 가리키며, 흔히 멸절을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 코의 격렬함/진노’라는 관용구를 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה
  english_pob_choice: nothing ... shall cling to your hand
  chosen_korean: 너희 손에는 아무것도 남아 있어서는 안 됩니다
  alternatives_korean:
  - 너희 손에 아무것도 붙어 있어서는 안 됩니다
  - 너희 손에 아무것도 매달려 있어서는 안 됩니다
  lexicon: HALOT
  rationale: יִדְבַּק의 ‘붙다/달라붙다’ 이미지를 한국어에서는 자연스러운 금지 표현으로 풀어 ‘남아 있어서는 안 됩니다’로 옮기되, 아무것도 허용되지 않는 전면 금지를 살렸습니다.
- source_word: הַחֵרֶם
  english_pob_choice: what is devoted to destruction
  chosen_korean: 바쳐 멸절된 것
  alternatives_korean:
  - 진멸에 바쳐진 것
  - 저주받아 바쳐진 것
  - 금령 아래 있는 것
  lexicon: HALOT
  rationale: חֵרֶם은 단순한 ‘금지된 물건’이 아니라 하나님께 돌려져 멸절되는 대상을 가리키므로, 전통적 ‘금령’보다 의미가 드러나도록 ‘바쳐 멸절된 것’으로 옮겼습니다.
- source_word: יְהוָה מֵ/חֲר֣וֹן אַפּ֗/וֹ
  english_pob_choice: Yahweh may turn from the fierceness of his anger
  chosen_korean: 야훼께서 그의 진노의 격렬함에서 돌이키시고
  alternatives_korean:
  - 야훼께서 그의 타오르는 진노에서 돌이키시고
  - 야훼께서 그의 맹렬한 진노에서 돌아서시고
  lexicon: HALOT
  rationale: חֲרוֹן אַף의 관용구를 직역하기보다 한국어에서 자연스럽고도 강한 ‘진노의 격렬함’으로 옮겨, 격한 분노의 뉘앙스를 보존했습니다.
- source_word: רַחֲמִים / וְרִחַמְךָ
  english_pob_choice: show you mercy ... have compassion on you
  chosen_korean: 긍휼을 주시며, 너희를 불쌍히 여기시고
  alternatives_korean:
  - 자비를 주시며, 너희를 긍휼히 여기시고
  - 은혜를 베푸시며, 너희를 불쌍히 여기시고
  lexicon: HALOT
  rationale: 명사 רַחֲמִים과 동사 רִחַם의 근접 반복을 한국어에서도 ‘긍휼을 주시며 / 불쌍히 여기시고’로 구분해, 동일어 반복으로 평면화하지 않았습니다.
- source_word: וְ/הִרְבֶּ֔/ךָ
  english_pob_choice: multiply you
  chosen_korean: 너희를 번성하게 하실 것입니다
  alternatives_korean:
  - 너희를 많게 하실 것입니다
  - 너희를 번창하게 하실 것입니다
  lexicon: HALOT
  rationale: רבה의 언약적 번성 언어를 현대 한국어에서 가장 자연스럽게 살리는 표현으로 ‘번성하게 하다’를 택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 옮겨 신명기를 읽는 독자가 신적 칭호와 고유 이름을 구별해 이해하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘fathers’의 성별-정확한 표현
  chosen_reading: 조상들에게
  alternative_readings:
  - 부모들에게
  - 선조들에게
  rationale: 원어 אֲבֹתֶיךָ는 문자적으로 ‘너희 아버지들’이지만, 한국어에서는 언약 계보를 뜻하는 표현을 너무 남성 중심적으로 고정하기보다 문맥상 자연스러운 ‘조상들’로 옮겨 동일한 언약 지시를 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
