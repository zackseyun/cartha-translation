revisions:
- from: 그리고 너희 손에는 아무것도 남아 있어서는 안 됩니다. 곧 야훼께서 그의 진노의 격렬함에서 돌이키시고, 너희에게 긍휼을 주시며, 너희를 불쌍히 여기시고, 너희를 번성하게 하실 것입니다 — 그가 너희 조상들에게 맹세하신 대로 말입니다.[a][b]
  to: 진멸에 바쳐진 것[a] 가운데서는 아무것도 네 손에 붙어 있어서는 안 됩니다. 그리하면 야훼께서 그의 타오르는 진노[b]에서 돌이키시고, 네게 긍휼을 베푸시며, 너를 불쌍히 여기시고, 너를 번성하게 하실 것입니다. 이는 그가 네 아버지들에게 맹세하신 대로입니다.
  rationale: 핵심 어휘 חֵרֶם을 복원하고, 단수 2인칭을 일관되게 반영했습니다. דבק의 구체적 이미지는 '네 손에 붙어'로 살렸습니다. 두 각주 표지는 설명하는 어구에 각각 연결했으며, 원문의 목적/결과 관계는 '그리하면'으로 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
