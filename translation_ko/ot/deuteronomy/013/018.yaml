  source_fidelity: 개정이 필요합니다. 초안은 הַחֵרֶם(진멸에 바쳐진 것)을 본문에서 완전히 누락했으며, 원문의 단수 2인칭을 복수로 바꾸었습니다. 또한 '남아 있어서는 안 됩니다'는 דבק의 '붙다/달라붙다' 비유를 다소 약화합니다.
