  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: ko
  text: 만일 여러분이 여러분의 하나님 야훼의 음성에 귀 기울여, 내가 오늘 여러분에게 명령하는 그분의 모든 계명을 지키며, 여러분의 하나님 야훼께서 보시기에 옳은 일을 하시면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי / תִשְׁמַע בְּקוֹל
  english_pob_choice: if you listen to the voice
  chosen_korean: 만일 당신이 ...의 음성에 순종하여
  alternatives_korean:
  - 만일 당신이 ...의 음성을 들으면
  - 만일 당신이 ...의 음성을 듣고
  lexicon: HALOT
  rationale: 조건을 나타내는 כִּי의 기능을 ‘만일’로 살리고, שׁמע בְּקוֹל의 듣기-순종 결합을 ‘음성에 순종하여’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 주 당신의 하나님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신성호칭은 Tetragrammaton이므로 프로젝트 기본값대로 ‘야훼’를 사용해 고유명을 보존했습니다.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  english_pob_choice: to keep all his commandments
  chosen_korean: '... 그의 모든 명령을 지키고'
  alternatives_korean:
  - '... 그의 모든 계명을 지키고'
  - '... 그의 모든 명령들을 지켜'
  lexicon: HALOT
  rationale: מִצְוָה는 언약적 법령 맥락에서 ‘명령’으로도 충분히 전달되며, 뒤의 동사와 연결해 목적/부대 상황을 살려 ‘지키고’로 옮겼습니다.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  english_pob_choice: to do what is right
  chosen_korean: 옳은 일을 하여
  alternatives_korean:
  - 옳은 것을 하여
  - 바른 일을 하여
  lexicon: HALOT
  rationale: יָשָׁר의 윤리적 의미를 현대 한국어의 자연스러운 표현인 ‘옳은 일’로 옮겼고, 부정확한 관용어를 피했습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: '...의 눈앞에서'
  alternatives_korean:
  - '...의 보시기에'
  - '...의 눈에'
  lexicon: HALOT
  rationale: 히브리어 관용구의 평가/판단 의미를 드러내면서도 한국어에서 자연스러운 ‘눈앞에서’로 처리해 직역감을 유지했습니다.
theological_decisions:
- issue: 조건문과 결과적 행위의 결합
  chosen_reading: 본문 전체를 ‘만일 ... 순종하여 ... 지키고 ... 하여’로 한 문장 안에서 연결해, 듣기·지키기·행하기가 분리된 행위가 아니라 언약적 순종의 연속임을 드러냈습니다.
  alternative_readings:
  - 조건절과 목적절을 더 분리하여 번역
  - ‘순종’ 대신 단순히 ‘듣다’로 옮김
  rationale: 히브리어 문장 구조는 청취와 순종, 준수와 실행을 한 흐름으로 묶고 있으므로, 의미를 약화시키지 않는 범위에서 한국어 연결어로 그 연속성을 보존하는 것이 적절합니다.
  doctrine_reference: Deuteronomy covenant obedience context
- issue: 야훼의 이름 보존
  chosen_reading: 본문과 반복되는 신명기의 언약 언어에서 יְהוָה를 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 고유 신명(神名)을 제목어로 바꾸면 본문의 언약적 직접성이 약해지므로, 프로젝트 기준에 따라 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
