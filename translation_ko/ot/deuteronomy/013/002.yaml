lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - if
  - 혹시
  lexicon: HALOT
  rationale: 법률적 조건절을 여는 말로 이해하여 원문의 가정적 상황을 한국어 조건 표현인 ‘만일’로 옮겼습니다.
- source_word: בְּקִרְבְּךָ
  english_pob_choice: among you
  chosen_korean: 너희 가운데서
  alternatives_korean:
  - 너희 가운데
  - 너희 안에서
  - 너희 한복판에
  lexicon: HALOT
  rationale: 공동체 내부를 가리키는 뜻을 살리되, 현대 한국어에서 자연스러운 공동체적 표현으로 옮겼습니다.
- source_word: חֹלֵם חֲל֑וֹם
  english_pob_choice: a dreamer of dreams
  chosen_korean: 꿈꾸는 자
  alternatives_korean:
  - 꿈의 꿈꾸는 자
  - 꿈꾸는 사람
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 직역하면 부자연스러워져, 직업적/유형적 인물을 가리키는 표현으로 의미를 보존했습니다.
- source_word: אוֹת ... מוֹפֵת
  english_pob_choice: a sign or a wonder
  chosen_korean: 표징이나 기사
  alternatives_korean:
  - 표적이나 놀라운 일
  - 징조나 기이한 일
  lexicon: HALOT
  rationale: 두 명사를 서로 구별해 병렬을 유지하면서, 한국어 성경 전통에서 널리 쓰이지만 지나치게 신학적으로 특정되지 않은 대응어를 선택했습니다.
theological_decisions:
- issue: 표징과 기사의 성격을 본문에서 단정할지 여부
  chosen_reading: 단순히 ‘표징이나 기사’로 옮기고, 그것이 참된 기적인지 속임수인지에 대한 판단은 본문 밖으로 미루었습니다.
  alternative_readings:
  - ‘기적적인 표징이나 기사’
  - ‘표징이나 징조’
  rationale: 원문은 이런 현상이 주어질 수 있음을 말할 뿐, 그 출처나 진위를 이 절에서 판정하지 않으므로 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
