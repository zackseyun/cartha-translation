  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
  footnotes:
  - marker: a
    text: Or 'and the wonder'; the Hebrew pair often functions idiomatically as 'sign or wonder.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whom you have not known.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and let us worship them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 표징이나 기사가 네게 말한 대로 이루어져도, “우리가 너희가 알지 못하던 다른 신들을 따라가자. 그리고 그들을 섬기자” 하고 말하면,[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기적’; 히브리어의 ‘표징과 기사’ 결합은 관용적으로 ‘표징이나 기사’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네가 알지 못하던’; 히브리어는 직접 2인칭 단수 형태를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 예배하자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הָאוֹת וְהַמּוֹפֵת
  english_pob_choice: and the sign or the wonder comes to pass
  chosen_korean: 그 표징이나 기사가… 이루어져도
  alternatives_korean:
  - 그 표징이나 기적이… 일어나도
  - 표징과 기사가… 나타나도
  lexicon: HALOT
  rationale: 히브리어의 표징-기사 결합을 한국어에서 자연스럽게 “표징이나 기사”로 옮기고, 성취를 나타내는 문맥상 “이루어져도”가 예언 성취의 뉘앙스를 잘 살립니다.
- source_word: נֵלְכָה אַחֲרֵי
  english_pob_choice: Let us go after
  chosen_korean: 우리가 … 따라가자
  alternatives_korean:
  - 우리가 … 뒤따르자
  - 우리가 … 좇아가자
  lexicon: HALOT
  rationale: ‘따라가자’는 우상 숭배적 충성을 드러내는 히브리어 관용구의 방향성과 결단을 현대 한국어로 자연스럽게 전달합니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 신들
  - 이방 신들
  lexicon: HALOT
  rationale: ‘other gods’의 직역적 대응으로 ‘다른 신들’을 택해 본문의 언약적 대조를 유지했고, ‘이방’은 원문에 없는 해석을 덧붙일 수 있어 배제했습니다.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  english_pob_choice: which you have not known
  chosen_korean: 너희가 알지 못하던
  alternatives_korean:
  - 네가 알지 못하던
  - 너희가 알지 못하는
  lexicon: HALOT
  rationale: 히브리어의 ‘알다’는 단순 정보보다 관계적 인지와 신뢰를 포함하므로, 한국어에서도 그 관계적 부정을 살려 ‘알지 못하던’으로 옮겼습니다.
- source_word: וְנָעָבְדֵם
  english_pob_choice: and let us serve them
  chosen_korean: 그리고 그들을 섬기자
  alternatives_korean:
  - 그리고 그들을 섬기자
  - 그리고 그들을 예배하자
  lexicon: HALOT
  rationale: עבד는 여기서 종교적 봉사를 뜻하지만, 한국어에서 ‘섬기다’가 우상에 대한 충성과 예속을 더 넓게 보존하며, POB의 ‘serve’도 그대로 반영합니다.
theological_decisions:
- issue: 우상에 대한 호칭과 문법적 지시대상
  chosen_reading: ‘다른 신들’과 ‘그들을’로 옮겨 본문이 우상 숭배의 유혹을 보고하는 말임을 유지했습니다.
  alternative_readings:
  - ‘다른 신들’을 ‘다른 신격들’로 풀이함
  - ‘그들을’를 ‘그것들을’로 바꿈
  rationale: 본문은 그 신들의 실재를 인정하기보다 유혹의 발화를 기록하므로, 한국어에서도 신학적 긴장을 해치지 않도록 원문의 지시대상을 그대로 보존했습니다.
  doctrine_reference: 신명기 13장의 우상 시험 본문은 거짓 표징이 참 하나님께 대한 충성을 대체하지 못함을 보여 줍니다.
