id: DEU.13.8
reference: Deuteronomy 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
  footnotes:
  - marker: a
    text: Or 'from one end of the land to the other end of the land.' Hebrew אֶרֶץ can mean either 'earth' or 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희에게서 멀리 있든지 가까이 있든지, 너희 주변의 여러 민족의 신들, 곧 땅 끝에서 땅 끝까지 있는 신들로부터—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘땅/나라(land)’를 뜻할 수 있습니다. 여기서는 전면적 범위를 드러내는 관용구이므로 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  english_pob_choice: from the gods of
  chosen_korean: ~의 신들로부터
  alternatives_korean:
  - ~의 신들에게서
  - ~의 신들 중에서
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살려 유혹의 근원이 되는 대상을 ‘~로부터’로 옮겼습니다. 한국어에서는 ‘신들로부터’가 가장 자연스럽고 직역적입니다.
- source_word: הָעַמִּים
  english_pob_choice: the peoples
  chosen_korean: 여러 민족
  alternatives_korean:
  - 그 민족들
  - 그 여러 백성들
  lexicon: HALOT
  rationale: עַמִּים의 집합적 민족성을 살려 ‘여러 민족’으로 옮겼습니다. ‘나라들’보다 사람 집단의 뉘앙스가 더 직접적입니다.
- source_word: סְבִיבֹתֵיכֶם
  english_pob_choice: that are around you
  chosen_korean: 너희 주변의
  alternatives_korean:
  - 너희 둘레의
  - 너희를 둘러싼
  lexicon: HALOT
  rationale: 지리적 둘레를 나타내는 표현이라 ‘주변의’가 가장 간결하고 현대적입니다.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  english_pob_choice: from one end of the earth to the other end of the earth
  chosen_korean: 땅 끝에서 땅 끝까지
  alternatives_korean:
  - 온 땅 끝에서 끝까지
  - 땅의 한 끝에서 다른 끝까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 전면적 범위를 한국어 관용구로 압축해 살렸습니다. 반복 구조는 유지하되, 한국어에서 자연스럽게 읽히도록 다듬었습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅/땅의 땅
  - 세상
  rationale: 여기서는 문맥상 지리적 총범위를 가리키는 상투적 표현이므로 ‘땅’으로 옮겨 원문의 수사적 과장을 보존했습니다. ‘세상’은 의미를 너무 넓히고, ‘땅’은 ‘땅 끝에서 땅 끝까지’라는 관용구를 가장 잘 살립니다.
  doctrine_reference: 신명기 13:8의 수사적 경고 범위
- issue: ‘가까이 있든지 멀리 있든지’의 배열
  chosen_reading: 너희에게서 멀리 있든지 가까이 있든지
  alternative_readings:
  - 가까이 있든지 멀리 있든지
  rationale: 히브리어의 대조쌍을 자연스러운 한국어 어순으로 옮겨, 먼저 ‘멀리’와 ‘가까이’를 병렬하여 대상의 거리 차이를 강조했습니다.
  doctrine_reference: 대조적 병렬 구조 보존
