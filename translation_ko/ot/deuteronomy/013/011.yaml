  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
  footnotes:
  - marker: a
    text: Or 'to lead you astray from the LORD your God' or 'to entice you away from the LORD your God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'out of the house of slavery,' a covenant formula recalling Israel's deliverance from Egypt.
    reason: cultural_note
translation:
  language: ko
  text: 그를 돌로 쳐야 합니다[a]. 그는 죽을 것입니다. 그가 당신을 야훼 당신의 하나님에게서, 곧 당신을 이집트 땅에서, 노예의 집에서 인도하여 내신 분에게서, 떠나게 하려고 했기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 야훼 당신의 하나님에게서 떠나게 하려고 꾀했기 때문입니다’, ‘당신을 야훼 당신의 하나님에게서 유인하려 했기 때문입니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘노예의 집에서’는 이집트에서의 종살이를 상기시키는 언약 공식입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  english_pob_choice: You shall stone him with stones
  chosen_korean: 그를 돌로 쳐야 합니다
  alternatives_korean:
  - 그를 돌로 쳐야 합니다
  - 그를 돌로 칩니다
  lexicon: HALOT
  rationale: 법률 문맥의 명령형을 한국어 합쇼체로 자연스럽게 옮겼고, 수단 표현인 ‘with stones’는 한국어에서 ‘돌로’가 가장 직역적이고 자연스럽습니다.
- source_word: וָמֵת
  english_pob_choice: and he shall die
  chosen_korean: 그는 죽을 것입니다
  alternatives_korean:
  - 그는 죽을 것입니다
  - 그리하여 죽습니다
  lexicon: HALOT
  rationale: 돌에 맞는 결과를 별도 절로 유지해 히브리어의 결과 진술을 살렸습니다.
- source_word: לְהַדִּיחֲךָ מֵעַל
  english_pob_choice: to drive you away from
  chosen_korean: …에게서 떠나게 하려고 했기 때문입니다
  alternatives_korean:
  - …에게서 떠나게 하려고 했기 때문입니다
  - …에게서 떠나도록 꾀했기 때문입니다
  - …에게서 멀어지게 하려고 했기 때문입니다
  lexicon: HALOT
  rationale: הדיח의 강한 ‘몰아내다/떠나게 하다’는 힘을 살리되, מֵעַל의 관계적 이탈을 한국어로 자연스럽게 표현했습니다. ‘꾀하다’는 유혹의 뉘앙스는 있으나 원문의 동사 힘이 약해져 배제했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 본문에 나타난 신명기적 언약명은 전통적 대체어 ‘주’가 아니라 고유명 ‘야훼’로 옮겼고, אֱלֹהֶיךָ는 표준 신학어인 ‘당신의 하나님’으로 번역했습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים
  english_pob_choice: from the land of Egypt, out of the house of slavery
  chosen_korean: 이집트 땅에서, 노예의 집에서 인도하여 내신 분
  alternatives_korean:
  - 이집트 땅에서, 노예의 집에서 인도하여 내신 분
  - 이집트 땅에서, 종살이의 집에서 이끌어 내신 분
  lexicon: HALOT
  rationale: ‘house of slavery’의 언약 공식성을 살리기 위해 ‘노예의 집’을 택했습니다. ‘인도하여 내신 분’은 히브리어 분사형의 구속 행위를 한국어로 자연스럽게 드러냅니다.
theological_decisions:
- issue: 죽음의 처벌을 명령하는 법률 문체
  chosen_reading: 형벌 명령을 완화하지 않고 직접적으로 유지했습니다.
  alternative_readings:
  - 그를 제거해야 합니다
  - 그를 벌해야 합니다
  rationale: 본문은 공동체의 언약적 배교 유혹에 대한 사법적 판결을 말하므로, 추상화하거나 완화하면 원문의 강도가 약해집니다.
  doctrine_reference: 신명기 13장 문맥의 언약 충성/배교 경고
- issue: ‘house of slavery’의 문화적 공식
  chosen_reading: ‘노예의 집’으로 직역하여 출애굽 언약 기억을 보존했습니다.
  alternative_readings:
  - ‘종살이의 집’
  - ‘속박의 집’
  rationale: 이 표현은 단순한 지리 설명이 아니라 이집트에서의 종살이와 구출을 상기시키는 공식을 이룹니다. 한국어에서도 그 공식성을 유지하는 것이 중요합니다.
  doctrine_reference: 출애굽 사건을 회상하는 신명기 언약 공식
