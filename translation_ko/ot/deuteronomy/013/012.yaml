    reason: source_note
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: And all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 이스라엘 모두
  - 온 이스라엘 백성
  lexicon: HALOT
  rationale: כָּל과 יחד된 이스라엘을 공동체 전체로 가리키는 표현이므로, 간결하게 ‘온 이스라엘’로 옮겨 집합적 의미를 살렸습니다.
- source_word: יִשְׁמְעוּ
  english_pob_choice: shall hear
  chosen_korean: 듣고
  alternatives_korean:
  - 들을 것이며
  - 듣게 될 것이며
  lexicon: HALOT
  rationale: 법적·경고적 문맥에서 ‘듣다’는 단순 청취보다 경고를 받아들여 알아차린다는 의미를 포함하므로, 한국어에서도 자연스럽게 ‘듣고’로 처리했습니다.
- source_word: וְיִרָאוּן
  english_pob_choice: and fear
  chosen_korean: 두려워할 것이며
  alternatives_korean:
  - 경외할 것이며
  - 무서워할 것이며
  lexicon: HALOT
  rationale: 여기서는 억제 효과를 낳는 פחד/ירא의 의미가 강하므로, 정서적 강도를 살리되 지나치게 종교화하지 않는 ‘두려워하다’가 적절합니다.
- source_word: בְּקִרְבֶּךָ
  english_pob_choice: in your midst
  chosen_korean: 너희 가운데서
  alternatives_korean:
  - 너희 한가운데서
  - 너희 가운데
  lexicon: HALOT
  rationale: 히브리어의 단수 2인칭을 보존한 영어의 ‘your midst’에 대응하되, 한국어에서는 공동체 지시를 자연스럽게 전달하는 ‘너희 가운데서’가 가장 매끄럽습니다.
theological_decisions:
- issue: 이스라엘에 대한 단수 주소를 한국어에서 어떻게 드러낼지
  chosen_reading: 공동체 지시를 살리되 한국어에서는 복수형 ‘너희’로 풀어 옮겼습니다.
  alternative_readings:
  - 너의 가운데서
  - 너희 가운데
  rationale: 히브리어는 이스라엘을 하나의 언약 공동체로 부르는 단수 주소를 사용하지만, 한국어에서 이를 직역하면 어색해지므로 수용 가능성과 원문의 공동체성을 함께 살리는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §4, gender-accurate over gender-neutral
