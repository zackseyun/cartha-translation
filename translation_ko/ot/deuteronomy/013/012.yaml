- from: 그러면 온 이스라엘이 듣고 두려워할 것이며, 다시는 너희 가운데서 이런 악한 일을 행하지 않을 것입니다.[a]
  to: 온 이스라엘은 듣고 두려워하여, 너희 가운데서 이 악한 일을 다시는 행하지 않을 것입니다.[a]
  rationale: 원문에 없는 ‘그러면’을 제거하고, ‘이런’을 원문의 지시사에 맞게 ‘이’로 고쳤습니다. 히브리어의 단수 주소는 한국어에서 자연스러운 공동체 지시인 ‘너희’로 옮기되, 각주에서 단수형과 이스라엘의 집합적 용법을 밝혔습니다.
