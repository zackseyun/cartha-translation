id: DEU.13.5
reference: Deuteronomy 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
  footnotes:
  - marker: a
    text: Or 'follow the LORD your God.' The Hebrew says literally, 'walk after the LORD your God.'
    reason: lexical_alternative
  - marker: b
    text: '''Listen to his voice'' can also carry the sense ''obey his voice'' or ''obey him.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'hold fast to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 야훼 너희 하나님을 따라가며 그를 두려워하고, 그의 명령들을 지키며 그의 음성을 듣고, 그를 섬기며 그에게 꼭 붙어 있어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘따라가며’는 히브리어의 직역인 ‘뒤를 따라 걷다’를 한국어로 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 음성을 듣고’는 문맥상 ‘그의 음성에 순종하고’라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그에게 꼭 붙어 있어야 합니다’는 ‘그에게 굳게 붙어 있다/그를 붙들다’의 뜻을 담은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 하나님의 고유명사를 보존하기 위해 전통적 대치어 대신 음역형 ‘야훼’를 사용했습니다.
- source_word: אַחֲרֵי + תֵּלֵכוּ
  english_pob_choice: you shall walk after
  chosen_korean: 따라가며
  alternatives_korean:
  - 뒤따라가며
  - 따르며
  - 행하며
  lexicon: HALOT
  rationale: 직역의 ‘뒤를 따라 걷다’ 이미지를 살리되, 한국어에서 자연스럽게 순종과 충성을 나타내는 ‘따라가다’를 택했습니다.
- source_word: תִירָאוּ
  english_pob_choice: fear him
  chosen_korean: 그를 두려워하고
  alternatives_korean:
  - 그를 경외하고
  - 그를 두려워하며
  lexicon: HALOT
  rationale: 하나님에 대한 ירא의 긴장을 약화시키지 않기 위해 ‘경외하다’보다 기본 의미인 ‘두려워하다’를 본문에 두었습니다.
- source_word: וּבְקֹלוֹ תִּשְׁמָעוּ
  english_pob_choice: listen to his voice
  chosen_korean: 그의 음성을 듣고
  alternatives_korean:
  - 그의 음성에 귀를 기울이고
  - 그의 음성을 들으며
  - 그의 음성에 순종하고
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살려 ‘음성을 듣다’로 두고, 순종의 함의는 문맥에서 드러나도록 했습니다.
- source_word: תַעֲבֹדוּ
  english_pob_choice: serve him
  chosen_korean: 그를 섬기며
  alternatives_korean:
  - 그를 예배하며
  - 그를 봉사하며
  lexicon: HALOT
  rationale: עבד의 예배·봉사 양쪽 가능성을 살리면서도, 하나님께 대한 포괄적 봉사를 자연스럽게 드러내는 ‘섬기다’를 선택했습니다.
- source_word: תִדְבָּקוּן
  english_pob_choice: cling to him
  chosen_korean: 그에게 꼭 붙어 있어야 합니다
  alternatives_korean:
  - 그에게 붙어 있어야 합니다
  - 그에게 굳게 붙어 있어야 합니다
  - 그를 굳게 붙들어야 합니다
  lexicon: HALOT
  rationale: דבק의 밀착·충성 이미지를 한국어에서 생생하게 전달하기 위해 관계적 친밀함이 드러나는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘듣다’에 내포된 순종의 의미를 본문에서 얼마나 드러낼지
  chosen_reading: ‘그의 음성을 듣고’로 본문은 유지하고, 순종의 뜻은 문맥에 맡겼습니다.
  alternative_readings:
  - ‘그의 음성에 순종하고’
  - ‘그의 음성을 듣고 순종하며’
  rationale: 히브리어는 문자적으로 ‘음성을 듣다’라고 말하므로, 해석을 본문에 과도하게 앞당기지 않고 원문 표현의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
