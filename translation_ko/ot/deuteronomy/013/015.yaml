  - 살펴보고
  - 캐묻고
  lexicon: HALOT
  rationale: דרש는 법적 맥락에서 단순한 질문보다 사실 확인을 위한 조사·탐문의 의미가 강하므로, 현대 한국어의 법정·행정 문체에 맞는 ‘조사하다’로 옮겼습니다.
- source_word: וְחָקַרְתָּ
