  chosen_korean: 살펴보고
  alternatives_korean:
  - 탐문하고
  - 검토하고
  - 파헤치고
  lexicon: HALOT
  rationale: חקר는 앞선 조사보다 더 세밀한 확인을 가리키므로, 절차의 누적을 살리기 위해 ‘살펴보다’로 구분해 옮겼습니다.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  english_pob_choice: inquire thoroughly
  chosen_korean: 자세히 물어보십시오
  alternatives_korean:
  - 철저히 물어보십시오
  - 충분히 물어보십시오
  - 꼼꼼히 물어보십시오
  lexicon: HALOT
  rationale: שאל과 הֵיטֵב의 결합은 ‘묻다/조사하다’의 강화를 뜻하므로, 합쇼체의 공적 문체를 유지하면서도 반복적 탐문이라는 뉘앙스를 살리기 위해 ‘자세히 물어보다’로 번역했습니다.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  english_pob_choice: this abomination
  chosen_korean: 이 혐오스러운 일
  alternatives_korean:
  - 이 가증한 일
  - 이 가증한 것
  - 이 역겨운 일
  lexicon: HALOT
  rationale: תועבה는 단순한 도덕적 불쾌감보다 언약 공동체 안에서 가증하고 금지된 행위를 가리키므로, 직역적인 종교어보다 현대 한국어에서 강도를 유지하는 ‘혐오스러운 일’을 택했습니다.
theological_decisions:
- issue: 법적 확인의 누적 구조
  chosen_reading: 세 개의 동사(조사하다, 살펴보다, 물어보다)를 나란히 두어 공동체가 사실을 충분히 검증해야 함을 드러냈습니다.
  alternative_readings:
  - 두 동사 정도로 줄여 자연스럽게 만들기
  - 한 문장으로 통합해 ‘조사하십시오’로 단순화하기
  rationale: 히브리어는 조사 행위를 단계적으로 중첩해 강조하므로, 한국어에서도 검증 절차의 엄중함이 약해지지 않도록 반복 구조를 유지했습니다.
  doctrine_reference: 신 13:14-15의 재판 절차; 공동체 내 죄의 사실 확인
