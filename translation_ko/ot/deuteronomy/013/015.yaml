  verdict: revise
  source_fidelity: 히브리어의 세 단계 조사 동사와 확증 공식은 대체로 반영했지만, 초안은 הֵיטֵב(‘철저히/자세히’)를 첫 동사에 붙여 놓고 마지막 동사에도 별도의 강도를 더해 동사별 수식 관계가 흐려졌습니다. 또한 וְהִנֵּה를 ‘그리고 보십시오’로 처리한 것은 다소 기계적입니다. 원문은 조건절 표지 없이 사실 확인의 결론을 제시하지만, 한국어에서는 이어지는 법적 귀결을 예고하는 ‘…라면’으로 자연스럽게 표현할 수 있습니다.
  naturalness: ‘그리고 너는 … 물어보십시오’는 주어 ‘너는’과 합쇼체 명령형의 결합이 어색하고, ‘그리고 보십시오’의 반복도 현대 공적 문체에 자연스럽지 않습니다. 주어를 생략하고 조사 동사를 병렬한 뒤 ‘보십시오’로 확인 결과를 도입하면 합쇼체와 법률적 문맥에 더 잘 맞습니다.
  terminology: תּוֹעֵבָה는 단순한 개인적 혐오보다 강한 종교·윤리적 배척의 표현입니다. ‘혐오스러운 일’보다 성경적 법률 문맥에서 널리 이해되는 ‘가증한 일’이 더 정확합니다. ‘사실이고 확실하다’는 אֱמֶת/נָכוֹן의 이중 확증을 적절히 보존합니다.
  issues:
  - severity: medium
    issue: הֵיטֵב의 수식 위치가 첫 조사 동사로 옮겨졌습니다.
    rationale: 원문에서 הֵיטֵב는 직전의 וְשָׁאַלְתָּ(‘물어보다/탐문하다’)를 강화합니다. ‘조사하고, 살펴보고, 철저히 물어보십시오’로 두는 편이 원문의 배열과 강조를 보존합니다.
  - severity: medium
    issue: ‘너는 … 물어보십시오’가 합쇼체에서 어색합니다.
    rationale: 현대 표준 한국어에서 ‘너’는 대체로 비격식적 호칭이므로 합쇼체 명령형과 결합하기 부자연스럽습니다. 원문의 2인칭은 한국어에서 생략할 수 있습니다.
  - severity: low
    issue: ‘그리고 보십시오’의 접속 표현이 반복적이고 부자연스럽습니다.
    rationale: וְהִנֵּה는 단순한 사건 연결보다 조사 뒤 확인된 결과를 주목시키는 표지입니다. ‘보십시오,’로 옮기면 그 기능을 더 자연스럽게 살립니다.
  - severity: medium
    issue: ‘혐오스러운 일’은 תּוֹעֵבָה의 성경적·법적 강도를 충분히 드러내지 못합니다.
    rationale: ‘가증한 일’은 공동체의 언약적·법적 문맥에서 해당 용어의 강한 부정 평가를 더 충실히 전달합니다.
  revised_text: 철저히 조사하고, 살펴보고, 자세히 물어보십시오. 보십시오, 이 가증한 일이 너희 가운데에서 일어난 것이 사실이고 확실하다면,
