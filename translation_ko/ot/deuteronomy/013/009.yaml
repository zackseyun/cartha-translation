  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
  footnotes:
  - marker: a
    text: Or 'consent to him.' The Hebrew verb can denote being willing, consenting, or yielding.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'your eye shall not pity him,' a Hebrew idiom for withholding compassionate regard.
    reason: cultural_note
  - marker: c
    text: Or 'cover for him'—that is, hide him or conceal his guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 끌려들어가서도 안 되고 그에게 귀를 기울여서도 안 됩니다[a]. 또 그를 불쌍히 여겨서도 안 되고[b] 그를 용서해서도 안 되며 그를 숨겨 주어서도 안 됩니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 동의해서도 안 됩니다.’ 히브리어 동사는 의지하다, 동의하다, 내주다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 눈이 그를 불쌍히 여기지 말라’입니다. 히브리어 관용구로, 자비로운 시선을 거두라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그를 덮어 주어서도 안 됩니다’ 곧 그를 숨기거나 그의 죄를 은폐하지 말라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאבֶה לֹו
  english_pob_choice: yield to him
  chosen_korean: 그에게 끌려들어가서도 안 됩니다
  alternatives_korean:
  - 그에게 동의해서도 안 됩니다
  - 그를 받아들여서도 안 됩니다
  - 그에게 굴복해서도 안 됩니다
  lexicon: HALOT
  rationale: אָבָה는 여기서 상대의 유혹에 마음을 내주거나 동의하는 뜻이므로, 법문 맥락에서 자연스럽게 ‘끌려들어가다’로 옮겨 거절의 뉘앙스를 살렸습니다.
- source_word: וְלֹא תִשְׁמַע אֵלָיו
  english_pob_choice: listen to him
  chosen_korean: 그에게 귀를 기울여서도 안 됩니다
  alternatives_korean:
  - 그의 말을 들어서도 안 됩니다
  - 그에게 순종해서도 안 됩니다
  - 그를 듣지도 말아야 합니다
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청취보다 ‘귀를 기울이다, 응하다’의 뜻이므로, POB의 ‘listen to him’을 살려 반응적 경청을 표현했습니다.
- source_word: וְ/לֹא תָח֤וֹס עֵינְ/ךָ֙ עָלָ֔י/ו
  english_pob_choice: your eye shall not pity him
  chosen_korean: 그를 불쌍히 여겨서도 안 되고
  alternatives_korean:
  - 그를 가엾게 여겨서도 안 되고
  - 그를 측은히 여겨서도 안 되고
  - 그에게 동정심을 품어서도 안 되고
  lexicon: HALOT
  rationale: ‘네 눈’이라는 히브리어 관용구를 한국어에서 자연스러운 동사구로 풀되, 자비로운 시선을 거두라는 뜻을 분명히 하기 위해 ‘불쌍히 여기다’로 옮겼습니다.
- source_word: וְ/לֹֽא תַחְמֹ֥ל
  english_pob_choice: spare
  chosen_korean: 그를 용서해서도 안 되며
  alternatives_korean:
  - 그를 아껴서도 안 되며
  - 그를 용서하지도 말며
  - 그를 불쌍히 여기지도 말며
  lexicon: HALOT
  rationale: חמל은 ‘아끼다/불쌍히 여기다/봐주다’의 폭이 있으나, 앞의 ‘불쌍히 여기다’와 구별되도록 처벌을 면하게 해 주지 않는 뜻을 살려 ‘용서하다’로 옮겼습니다.
- source_word: וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו
  english_pob_choice: conceal him
  chosen_korean: 그를 숨겨 주어서도 안 됩니다
  alternatives_korean:
  - 그를 감춰서도 안 됩니다
  - 그를 덮어 주어서도 안 됩니다
  - 그의 죄를 숨겨서도 안 됩니다
  lexicon: HALOT
  rationale: כסה는 여기서 범죄자를 숨기거나 죄를 덮는 의미이므로, 법정·공동체적 은폐를 드러내는 ‘숨겨 주다’로 옮겼습니다.
theological_decisions:
- issue: 연속된 부정 명령의 강도 유지
  chosen_reading: 비판적 거리두기 수준으로 약화하지 않고, 동의·경청·연민·면책·은폐를 차례로 금지하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 감정적으로만 동정하지 말라는 뜻으로 완화
  - ‘그를 보호하지 말라’로만 단순화
  rationale: 본문은 배교 유혹자에 대한 언약적·사법적 금지 조항이므로, 반복되는 금지의 누적 효과를 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
