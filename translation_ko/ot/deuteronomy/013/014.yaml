  verdict: revise
  source_fidelity: 원문의 조건절 구조와 주요 어휘는 대체로 반영되었으나, 마지막 관계절(‘너희가 알지 못하던’)이 ‘다른 신들’을 수식하지 않고 독립 진술처럼 처리되어 원문의 문장 구조와 의미가 달라졌습니다. 또한 וַיַּדִּיחוּ의 완료 동작은 ‘이끌며’보다 ‘미혹하고/미혹하여’가 더 충실합니다.
  naturalness: ‘무가치한 사람들’은 한국어에서 사람의 도덕적 성격을 가리키는 표현으로 다소 부자연스럽습니다. ‘불량한 자들’은 현대 한국어에서 간결하고 문맥상 자연스러우며, 본문의 부정적 도덕 평가를 적절히 전달합니다. ‘성읍’은 성경 문맥에서 자연스럽고 עיר의 의미도 보존합니다.
  terminology: בְּנֵי בְלִיַּעַל은 고유한 악령 이름으로 단정하지 않고 ‘불량한 자들’로 옮기는 것이 적절합니다. 각주에서는 관용구의 직역과 전통적 번역을 함께 제시하되, 직역은 ‘무가치의 아들들’보다 ‘불량의 아들들’ 또는 ‘가치 없음의 아들들’이 원어 구성에 더 가깝습니다.
  issues:
  - severity: high
    issue: 인용문 끝의 ‘너희가 알지 못하던 신들이다’
    rationale: אֲשֶׁר לֹא יְדַעְתֶּם은 ‘다른 신들’을 수식하는 관계절입니다. 이를 ‘신들이다’라는 독립 서술로 바꾸면 원문에 없는 단정 문장이 생기고, 청유문의 목적어 구조가 훼손됩니다.
  - severity: medium
    issue: ‘그릇된 길로 이끌며’
    rationale: וַיַּדִּיחוּ는 이 문맥에서 주민들을 배교로 이끌어 이미 미혹한 행위를 나타냅니다. ‘미혹하고’가 동작의 완료성과 종교적 이탈의 문맥을 더 직접적으로 드러냅니다.
  - severity: low
    issue: ‘무가치한 사람들’ 및 각주의 ‘무가치의 아들들’
    rationale: 본문 표현은 한국어 관용상 어색하며, 각주의 직역도 히브리어 관용구의 부정적 성격을 충분히 자연스럽게 전달하지 못합니다.
  revised_text: 너희 가운데서 불량한 자들이 나와 그들의 성읍 주민들을 미혹하고, ‘가서 너희가 알지 못하던 다른 신들을 섬기자’라고 말하면
  revised_footnotes:
  - marker: a
    text: '히브리어: ‘불량의 아들들’; 전통적으로 ‘벨리알의 아들들’로 옮깁니다.'
    reason: lexical_alternative
  revision_rationale: 관계절을 ‘다른 신들’에 직접 연결하여 원문의 통사와 의미를 회복했습니다. 또한 배교 선동의 의미를 ‘미혹하고’로 명확히 하고, בְּנֵי בְלִיַּעַל은 후대의 인격화된 ‘벨리알’을 본문에 도입하지 않는 ‘불량한 자들’로 유지했습니다.
