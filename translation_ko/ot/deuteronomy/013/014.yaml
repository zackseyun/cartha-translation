translation:
  language: ko
  text: 어떤 무가치한 사람들[a]이 너희 가운데에서 나가 그들의 도시 주민들을 그릇된 길로 이끌며, “가서 다른 신들을 섬기자. 너희가 알지 못하던 신들이다”라고 말하면
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘무가치의 아들들’. 전통적으로는 ‘벨리알의 아들들’로 옮깁니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 무가치한 사람들
  alternatives_korean:
  - 쓸모없는 사람들
  - 사악한 사람들
  - 벨리알의 아들들
  lexicon: HALOT
  rationale: 영어 POB의 idiomatic한 의미를 따라, 고유명사화하지 않고 사람의 도덕적 무가치를 드러내는 표현으로 옮겼습니다.
- source_word: מִקִּרְבְּךָ
  english_pob_choice: from among you
  chosen_korean: 너희 가운데에서
  alternatives_korean:
  - 너희 한가운데서
  - 너희 가운데
  - 너희 중에서
  lexicon: HALOT
  rationale: 언약 공동체 내부에서 나왔다는 뜻을 자연스러운 현대 한국어로 살리되, 공동체 내부 기원을 분명히 했습니다.
- source_word: וַיַּדִּיחוּ
  english_pob_choice: have led ... astray
  chosen_korean: 그릇된 길로 이끌며
  alternatives_korean:
  - 미혹하며
  - 타락시키며
  - 떨어지게 하며
  lexicon: HALOT
  rationale: 단순한 유혹이 아니라 신앙적 이탈을 일으키는 뉘앙스를 살리기 위해 ‘그릇된 길로 이끌다’를 택했습니다.
- source_word: נֵלְכָה וְנַעַבְדָה
  english_pob_choice: Let us go and serve
  chosen_korean: 가서 … 섬기자
  alternatives_korean:
  - 가서 … 예배하자
  - 가서 … 섬기러 가자
  - 가자, … 섬기자
  lexicon: HALOT
  rationale: עבד의 더 넓은 의미를 반영해 ‘섬기다’로 옮겼고, 권유형 뉘앙스를 한국어 청유형으로 표현했습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 외국 신들
  - 다른 신
  - 이방 신들
  lexicon: HALOT
  rationale: 신명기에서 반복되는 표준 표현을 직역에 가깝게 유지했습니다.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  english_pob_choice: which/whom you have not known
  chosen_korean: 너희가 알지 못하던
  alternatives_korean:
  - 너희가 알지 못한
  - 너희가 알지 못했던
  - 너희가 알지 못하는
  lexicon: HALOT
  rationale: ידע의 관계적·언약적 ‘앎’을 반영해 단순한 정보 인지가 아니라 익숙함과 소속의 부재를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל의 해석
  chosen_reading: 고유명사 ‘벨리알’로 처리하지 않고, 도덕적으로 무가치한 사람들을 가리키는 관용구로 이해했습니다.
  alternative_readings:
  - 벨리알의 아들들
  - 사악한 사람들
  rationale: 이 문맥은 특정 악령 이름을 도입하기보다, 언약 공동체 안에서 나온 배교 선동자들의 성격을 규정합니다. 따라서 본문이 요구하는 범위를 넘어서는 신학적 이미지를 덧씌우지 않았습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 허용하는 범위 안에서만 신학적 의미를 드러냄
