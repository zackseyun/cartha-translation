  lexicon: HALOT
  rationale: ידע의 관계적·언약적 ‘앎’을 반영해 단순한 정보 인지가 아니라 익숙함과 소속의 부재를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל의 해석
  chosen_reading: 고유명사 ‘벨리알’로 처리하지 않고, 도덕적으로 무가치한 사람들을 가리키는 관용구로 이해했습니다.
  alternative_readings:
  - 벨리알의 아들들
  - 사악한 사람들
  rationale: 이 문맥은 특정 악령 이름을 도입하기보다, 언약 공동체 안에서 나온 배교 선동자들의 성격을 규정합니다. 따라서 본문이 요구하는 범위를 넘어서는 신학적 이미지를 덧씌우지 않았습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 허용하는 범위 안에서만 신학적 의미를 드러냄
