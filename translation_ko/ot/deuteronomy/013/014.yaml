  lexicon: HALOT
  rationale: 언약 공동체 내부에서 나왔다는 뜻을 자연스러운 현대 한국어로 살리되, 공동체 내부 기원을 분명히 했습니다.
- source_word: וַיַּדִּיחוּ
  english_pob_choice: have led ... astray
  chosen_korean: 그릇된 길로 이끌며
