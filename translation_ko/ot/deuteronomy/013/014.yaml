  text: 어떤 무가치한 사람들[a]이 너희 가운데에서 나가 그들의 도시 주민들을 그릇된 길로 이끌며, “가서 다른 신들을 섬기자. 너희가 알지 못하던 신들이다”라고 말하면
  philosophy: optimal-equivalence
  footnotes:
