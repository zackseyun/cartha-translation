    text: '히브리어: ‘무가치의 아들들’. 전통적으로는 ‘벨리알의 아들들’로 옮깁니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 무가치한 사람들
  alternatives_korean:
  - 쓸모없는 사람들
