  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 כָּלִיל의 제의적 수식 범위가 불분명하게 표현되었고, 해당 각주 표지가 ‘광장’ 뒤에 놓여 있어 כָּלִיל에 관한 각주와 연결되지 않습니다. 또한 ‘그것을’은 성읍과 전리품 전체를 가리키는지 불명확합니다.
  naturalness: ‘너는’과 ‘삼아야 합니다’의 결합은 목표 합쇼체 문체 안에서 다소 부자연스럽고, ‘영원한 폐허의 언덕’도 한국어로는 어색합니다. 명령을 일관되게 합쇼체로 처리하고, תֵּל의 폐허 더미 이미지를 자연스럽게 옮기는 편이 좋습니다.
  terminology: ‘전리품’, ‘넓은 광장’, ‘야훼’, ‘하나님’은 적절합니다. כָּלִיל은 ‘온전히 바치는 제물’로 옮겨 제의적 울림을 보존할 수 있으나, 불사르는 성읍과 전리품 전체를 수식하도록 문장 구조를 명료하게 해야 합니다.
  issues:
