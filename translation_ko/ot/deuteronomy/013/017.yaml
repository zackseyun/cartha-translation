    rationale: ‘너는 … 삼아야 합니다’는 직접 명령의 흐름을 약화시키며 목표 문체에도 매끄럽지 않습니다. ‘… 모으고 … 불사르십시오’로 일관되게 처리하는 것이 자연스럽습니다.
