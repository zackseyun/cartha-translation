  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
  footnotes:
  - marker: a
    text: Or 'completely for the LORD your God.' The Hebrew כָּלִיל can be taken adverbially ('wholly, completely') or with sacrificial force, indicating something entirely consumed for God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a mound forever' or 'an everlasting heap,' that is, a lasting ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그 성읍의 모든 전리품을 그 성읍의 넓은 광장 한가운데로 모으고[a], 그 성읍과 그 성읍의 모든 전리품을 불로 사르되, 그것을 야훼 너의 하나님께 온전히 드리는 제물로 삼아야 합니다. 그것은 영원한 폐허의 언덕[b]이 되어 다시는 세워지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 너의 하나님께 온전히(완전히)’. 히브리어 כָּלִיל은 ‘온전히, 완전히’라는 부사적으로도 읽을 수 있고, 제의적으로는 하나님께 전부 바쳐진 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘영원한 언덕’ 또는 ‘영원한 폐허 더미’라는 뜻일 수 있으며, 곧 오래 지속되는 폐허를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  english_pob_choice: its spoil
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 약탈물
  lexicon: HALOT
  rationale: 전쟁 맥락의 שָׁלָל은 빼앗은 재물을 뜻하므로, 한국어에서는 자연스럽고 군사적 뉘앙스를 살리는 ‘전리품’이 적절합니다.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  english_pob_choice: into the middle of its open square
  chosen_korean: 그 성읍의 넓은 광장 한가운데로
  alternatives_korean:
  - 그 성읍의 광장 한복판으로
  - 그 성읍의 거리 한가운데로
  lexicon: HALOT
  rationale: רְחוֹב는 좁은 ‘거리’보다 공개된 넓은 장소를 가리키므로, ‘넓은 광장 한가운데’가 문맥과 더 잘 맞습니다.
- source_word: כָּלִיל
  english_pob_choice: as a whole offering
  chosen_korean: 온전히 드리는 제물로
  alternatives_korean:
  - 완전히
  - 온전히
  - 전부 불살라 드리는 제물로
  lexicon: HALOT
  rationale: כָּלִיל의 전소·전적 헌납 뉘앙스를 살리되, 도시를 대상에 둔 문맥에서 기술적 제사명칭을 과도하게 좁히지 않도록 ‘온전히 드리는 제물로’로 옮겼습니다.
- source_word: תֵּל עוֹלָם
  english_pob_choice: a perpetual ruin mound
  chosen_korean: 영원한 폐허의 언덕
  alternatives_korean:
  - 영원한 폐허 더미
  - 영구한 폐허 언덕
  - 폐허의 언덕
  lexicon: HALOT
  rationale: תֵּל은 유적이 쌓여 이루어진 ‘언덕/더미’이며, עוֹלָם은 지속성을 나타내므로 ‘영원한 폐허의 언덕’이 두 요소를 함께 드러냅니다.
theological_decisions:
- issue: 성읍 파괴를 제사적 헌납 언어로 표현하는 방식
  chosen_reading: ‘온전히 드리는 제물로’라고 옮겨, 단순 파괴가 아니라 하나님께 완전하게 돌려드리는 행위라는 제의적 긴장을 유지했습니다.
  alternative_readings:
  - ‘완전히’로 단순 부사화
  - ‘번제물로’로 더 강하게 제사화
  rationale: 본문의 כָּלִיל은 전면적 소각과 헌납의 의미를 함께 띠므로, 한국어에서도 그 신학적·의례적 울림을 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6; Contested terms table for יְהוָה
