    issue: 각주 a의 표지 위치가 해당 어휘와 맞지 않습니다.
    rationale: 각주 내용은 כָּלִיל(‘온전히/완전히’ 또는 전면 헌납의 제의적 의미)에 관한 것인데, 현재 표지는 רְחוֹב(‘광장’) 뒤에 있습니다. 표지를 ‘온전히 바치는 제물’ 뒤로 옮겨야 합니다.
  - severity: medium
