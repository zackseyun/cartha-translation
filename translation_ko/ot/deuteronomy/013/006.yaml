id: DEU.13.6
reference: Deuteronomy 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
  footnotes:
  - marker: a
    text: Or 'apostasy.' The Hebrew phrase 'spoken rebellion' denotes defection from covenant loyalty to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'the house of bondage'; literally 'the house of slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 예언자나 그 꿈꾸는 자는 반드시 죽임을 당해야 합니다. 그는 야훼 당신들의 하나님을 거슬러 반역을 말하였기 때문입니다. 그 하나님은 당신들을 이집트 땅에서 이끌어 내시고 노예의 집에서 당신들을 구속하신 분이며, 당신들이 야훼 당신들의 하나님이 명령하신 길에서 벗어나게 하려 하셨습니다. 그러므로 당신들은 그 가운데서 악을 제거해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘반역을 말하다’이며, 문맥상 언약 충성에서의 이탈을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘노예들의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  english_pob_choice: But that prophet
  chosen_korean: 그러나 그 예언자
  alternatives_korean:
  - 그리고 그 예언자
  - 그 예언자는
  lexicon: HALOT
  rationale: 문맥상 앞선 판정에 이어지는 법적 경고이므로 역접을 살려 ‘그러나’로 시작하고, נָבִיא는 여기서 일반적 종교 직분이 아니라 거짓 예언자를 가리키므로 ‘예언자’가 적절합니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 죽어야 합니다
  - 사형에 처해야 합니다
  lexicon: HALOT
  rationale: 형태가 단순한 사망이 아니라 판결에 따른 처형을 뜻하므로, 법률적 강제를 드러내는 표현을 택했습니다.
- source_word: כִּי דִבֶּר סָרָה
  english_pob_choice: because he has spoken rebellion
  chosen_korean: 반역을 말하였기 때문입니다
  alternatives_korean:
  - 배교를 말하였기 때문입니다
  - 패역을 말하였기 때문입니다
  lexicon: HALOT
  rationale: סָרָה는 언약 충성에서의 이탈·반역을 뜻하므로, 현대 한국어에서 가장 직접적인 ‘반역’으로 옮겨 문맥의 법적·언약적 힘을 살렸습니다.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  english_pob_choice: and redeemed you from the house of slavery
  chosen_korean: 노예의 집에서 당신들을 구속하신 분
  alternatives_korean:
  - 종들의 집에서 당신들을 구속하신 분
  - 노예 상태에서 당신들을 구속하신 분
  lexicon: HALOT
  rationale: בֵּית עֲבָדִים는 문자적으로 ‘노예들의 집’이므로 전통적 ‘속박’보다 사회적 현실을 드러내는 ‘노예의 집’을 택했고, פּדה는 ‘구속하다’로 옮겨 출애굽 구원 어휘를 유지했습니다.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  english_pob_choice: to drive you from the way
  chosen_korean: 당신들이 … 길에서 벗어나게 하려 하셨습니다
  alternatives_korean:
  - 당신들을 그 길에서 몰아내려 하셨습니다
  - 당신들을 그 길에서 떠나게 하려 하셨습니다
  lexicon: HALOT
  rationale: הדיח의 핵심은 언약의 ‘길’에서 이탈시키는 것이므로, 단순한 이동이 아니라 방향 전환·이탈의 의미가 드러나도록 옮겼습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: So you shall purge the evil from your midst
  chosen_korean: 그 가운데서 악을 제거해야 합니다
  alternatives_korean:
  - 너희 가운데서 악을 제거해야 합니다
  - 당신들 가운데서 악을 소멸해야 합니다
  lexicon: HALOT
  rationale: Deuteronomy의 법정 공식어로서 בער는 단호한 제거를 뜻하지만, 한국어에서는 과도하게 문어적인 ‘정화’보다 직접적인 ‘제거’가 자연스럽고 명료합니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 고유한 언약명으로 드러내기 위해 POB 기준에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 출애굽 회상 표현의 사회적 이미지
  chosen_reading: 노예의 집
  alternative_readings:
  - 속박의 집
  - 종살이의 집
  rationale: 히브리어의 구체적 사회 현실을 완화하지 않고 보존하여, 해방 행위의 강도를 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
