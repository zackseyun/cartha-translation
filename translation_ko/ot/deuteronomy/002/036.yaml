  source_fidelity: 범위 표현에서 מֵעֲרֹעֵר의 출발점과 골짜기 안의 성읍을 함께 연결해야 합니다. 초안의 “Aroer에서—…그곳에서 시작하여 … 성읍에 이르기까지, 길르앗에 이르기까지”는 성읍을 중간 종점처럼 만들고 ‘이르기까지’를 중복하여 원문의 병렬 지리 표현을 흐립니다. 또한 각주 표지는 해당 어휘인 ‘높은’에 붙이는 것이 적절합니다.
