  lexicon: HALOT
  rationale: מִן/מֵ는 출발점을 나타내므로, 한국어에서는 간결한 처소 조사 ‘에서’로 시작점을 살렸습니다.
- source_word: שְׂפַת נַחַל אַרְנֹן
  english_pob_choice: the edge of the Arnon Valley
  chosen_korean: 아르논 골짜기 가장자리에 있는
  alternatives_korean:
  - 아르논 계곡 가장자리에 있는
  - 아르논 와디의 언저리에 있는
  lexicon: HALOT
  rationale: שָׂפָה의 핵심은 ‘가장자리/언저리’이므로, 현대 한국어에서 자연스럽고 지형적 감각이 살아 있는 ‘가장자리’로 옮겼습니다.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  english_pob_choice: and the city that is in the valley
  chosen_korean: 그 골짜기 안에 있는 성읍
  alternatives_korean:
  - 그리고 골짜기 안에 있는 성읍
  - 그 와디 안에 있는 성읍
  lexicon: HALOT
  rationale: 문맥상 앞의 아르논 지형과 평행을 이루는 추가 지점을 가리키므로, ‘그 골짜기 안에 있는 성읍’으로 압축해 지리적 평행성을 유지했습니다.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר שָׂגְבָה מִמֶּנּוּ
  english_pob_choice: there was no town too high for us
  chosen_korean: 우리에게 너무 높은 성읍은 하나도 없었습니다
  alternatives_korean:
  - 우리에게 너무 강한 성읍은 하나도 없었습니다
  - 우리로서는 접근할 수 없는 성읍은 하나도 없었습니다
  lexicon: HALOT
  rationale: שׂגב의 비유적 높이 이미지를 살리되, 한국어에서는 ‘너무 높은’으로 옮겨 방어적 난공불락의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: אֶת הַכֹּל
  english_pob_choice: all of it
  chosen_korean: 그 모든 것을
  alternatives_korean:
  - 모두를
  - 그 전부를
  lexicon: HALOT
  rationale: כֹּל은 여기서 정복된 지역 전체를 가리키는 집합적 표현이므로, 한국어에서는 문맥을 드러내는 ‘그 모든 것’을 택했습니다.
- source_word: לְפָנֵינוּ
  english_pob_choice: before us
  chosen_korean: 우리 앞에
  alternatives_korean:
  - 우리 앞에서
  - 우리에게
  lexicon: HALOT
  rationale: 전달·양도 의미를 담는 ‘before us’를 한국어의 공간적·주권적 관용구인 ‘우리 앞에’로 옮겼습니다.
