base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
  footnotes:
  - marker: a
    text: Or 'the land of the Rephaim.'
    reason: lexical_alternative
  - marker: b
    text: '''Rephaim'' may refer to an ancient people traditionally associated with great size; some translations render the term ''giants'' here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳도 르바임의 땅으로 여겨집니다[a]. 르바임은 옛날에 거기에 살았는데[b], 암몬 사람들은 그들을 잠줌밈이라고 부릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르바임의 땅’.
    reason: lexical_alternative
  - marker: b
    text: ‘르바임’은 전통적으로 큰 체구의 옛 민족을 가리키는 말로 이해되며, 일부 번역은 여기서 ‘거인들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  english_pob_choice: a land of the Rephaim
  chosen_korean: 르바임의 땅
  alternatives_korean:
  - 르바임의 나라
  - 르바임 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 기본적으로 ‘땅’이므로 이를 살리고, רְפָאִים은 해석어 ‘거인들’보다 음역하여 사람 집단명으로 보이게 했습니다.
- source_word: תֵּחָשֵׁב
  english_pob_choice: is considered
  chosen_korean: 여겨집니다
  alternatives_korean:
  - 간주됩니다
  - 셈해집니다
  lexicon: HALOT
  rationale: 니팔형 חשׁב의 ‘평가되다/여겨지다’라는 수동적 의미를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: יָשְׁבוּ בָהּ לְפָנִים
  english_pob_choice: Rephaim lived in it formerly
  chosen_korean: 르바임은 옛날에 거기에 살았는데
  alternatives_korean:
  - 르바임이 전에 거기에 거주했는데
  - 르바임이 그곳에 옛적에 살았는데
  lexicon: HALOT
  rationale: יָשַׁב의 ‘살다/거주하다’ 의미를 살리되, לְפָנִים은 ‘옛날에’로 간결하게 옮겨 문맥의 시간 표지를 분명히 했습니다.
- source_word: זַמְזֻמִּים
  english_pob_choice: Zamzummim
  chosen_korean: 잠줌밈
  alternatives_korean:
  - 자므줌밈
  - 잠주밈
  lexicon: HALOT
  rationale: 고유 민족명은 음역을 유지해 원문의 이질성과 식별 가능성을 보존했습니다.
theological_decisions:
- issue: רְפָאִים을 ‘거인들’로 풀지 여부
  chosen_reading: 본문은 민족명 ‘르바임’으로 유지하고, 해석적 전통인 ‘거인들’은 본문 밖에서만 참조합니다.
  alternative_readings:
  - 거인들의 땅
  - 거인들
  rationale: 이 절에서 רְפָאִים은 암몬인의 별칭 ‘잠줌밈’과 병치되는 집단명으로 기능하므로, 해석을 본문에 주입하기보다 원문 고유명을 보존하는 편이 더 정확합니다.
  doctrine_reference: 성경 본문 해석의 역사적·문법적 우선성
