translation:
  language: ko
  text: 그때 우리는 돌아서서, 야훼께서 내게 말씀하신 대로 홍해[a] 길을 따라 광야로 떠났고, 여러 날 동안 세일 산을 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
