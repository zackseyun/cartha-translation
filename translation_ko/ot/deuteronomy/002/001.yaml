  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
  footnotes:
  - marker: a
    text: Or 'Sea of Reeds.' The Hebrew name Yam Suph may be rendered more literally this way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리는 돌아서서, 야훼께서 내게 말씀하신 대로 홍해[a] 길을 따라 광야로 출발하여 세일 산을 오랫동안 돌아다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대바다’. 히브리어 이름 야므 수프는 더 문자적으로 이렇게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  english_pob_choice: Then we turned
  chosen_korean: 우리는 돌아서서
  alternatives_korean:
  - 우리는 방향을 돌려
  - 우리는 되돌아
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 살리되, 상황 전환의 자연스러운 한국어로 ‘돌아서서’를 택했습니다.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  english_pob_choice: set out for the wilderness
  chosen_korean: 광야로 출발하여
  alternatives_korean:
  - 광야를 향해 떠나
  - 광야로 길을 떠나
  lexicon: HALOT
  rationale: נָסַע는 진영을 걷고 떠나는 출발의 뉘앙스가 있어 ‘출발하다’로 옮겼고, 방향형 목적어는 ‘광야로’로 보존했습니다.
- source_word: דֶּרֶךְ יַם סוּף
  english_pob_choice: by the way of the Red Sea
  chosen_korean: 홍해 길을 따라
  alternatives_korean:
  - 홍해로 가는 길을 따라
  - 갈대바다 길을 따라
  lexicon: HALOT
  rationale: route 표현인 דֶּרֶךְ를 한국어의 자연스러운 이동 표현 ‘길을 따라’로 풀었고, 본문 흐름상 지명으로서 ‘홍해’를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 인용된 신명기의 본문에서 신명기적 고유명사인 여호와의 이름을 제목화하지 않고, 프로젝트 기준에 따라 ‘야훼’로 일관되게 옮겼습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 오랫동안
  alternatives_korean:
  - 여러 날 동안
  - 많은 날 동안
  lexicon: HALOT
  rationale: 기간의 지속을 강조하는 관용적 표현으로, 한국어에서 더 자연스럽고 서술의 흐름에 맞는 ‘오랫동안’을 택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 신적 칭호로 대체하지 않고 고유명으로 드러내는 것이 문맥과 번역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
