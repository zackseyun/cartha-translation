  text: 그때 야훼께서 내게 이렇게 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말씀하시며 이르셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 그때 ... 이르셨습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서술 진행을 한국어에서는 시간 전환의 '그때'로 자연스럽게 살리고, 이어지는 직접 인용의 도입은 '말씀하시며 이르셨습니다'로 본문의 발화 감각을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유신명 יְהוָה를 관례적 대체어가 아니라 하나님의 이름으로 직접 옮겨, POB의 이름 보존 원칙을 따랐습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 1인칭 단수 여격을 현대 합쇼체 문맥에 자연스러운 '내게'로 옮겨, 구어체로 흐르지 않으면서도 직접성을 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 라고
  lexicon: HALOT
  rationale: לֵאמֹר의 도입 기능을 단순 반복어로 두지 않고 한국어 본문에서 다음 발화의 서술 표지로 기능하도록 '이르셨습니다'를 택해, 영어 POB가 회복한 완결성을 반영했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 야훼의 직접 발화를 보이므로, 고유 이름을 제목형 호칭으로 바꾸지 않고 '야훼'로 보존하는 것이 본문의 신학적·서사적 직접성을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
