  naturalness: “말씀하시며 이르셨습니다” is an awkward, semantically overlapping verb sequence in modern Korean. “이렇게 말씀하셨습니다” naturally introduces the following speech while retaining the function of לֵאמֹר.
  terminology: “야훼” appropriately preserves the divine name יהוה in accordance with the stated project convention. “내게” is natural and accurate.
