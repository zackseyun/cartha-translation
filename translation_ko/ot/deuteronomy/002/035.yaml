lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 앞선 문맥과의 대비를 살리면서도 한국어에서 자연스럽고 문맥상 제한을 분명히 드러냅니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 동물
  lexicon: HALOT
  rationale: 전리품으로 남긴 घरेल이 동물들을 가리키므로, 일반적인 '동물'보다 '가축'이 더 정확합니다.
- source_word: בָּזַזְנוּ לָנוּ
  english_pob_choice: we took as plunder for ourselves
  chosen_korean: 우리가 우리를 위하여 노략하였고
  alternatives_korean:
  - 우리가 우리를 위하여 약탈하였고
  - 우리가 스스로 노략하였고
  lexicon: HALOT
  rationale: בָּזַז의 전쟁 맥락을 따라 '노략하다'를 유지하고, לָנוּ의 수혜/자기지시 뉘앙스를 '우리를 위하여'로 반영합니다.
- source_word: וּשְׁלַל הֶעָרִים
  english_pob_choice: along with the spoil of the cities
  chosen_korean: 성읍들의 노략물도
  alternatives_korean:
  - 성읍들의 전리품도
  - 성읍들의 약탈물도
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 노획물을 뜻하므로 '노략물'로 옮겨 어휘적 연결을 유지합니다.
theological_decisions:
- issue: 전쟁 서술에서 남겨진 재산의 성격
  chosen_reading: 사람들은 진멸되었지만, 가축과 성읍의 노략물은 예외적으로 취해졌다는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 약탈 사실만을 서술한다
  - 가축과 성읍의 재산을 중립적으로 나열한다
  rationale: 이 절은 이전 절의 진멸과 대조되는 남겨진 전리품을 강조하므로, '다만'과 '노략물'로 그 긴장을 보존하는 것이 본문 의미에 충실합니다.
  doctrine_reference: 본문 맥락에 근거한 서술적 대조
