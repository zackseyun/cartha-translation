revisions:
- from: 그들과 싸움을 걸지 마십시오. 내가 너희에게 그들의 땅에서 한 뼘의 자리도 주지 않을 것이기 때문입니다. 왜냐하면 내가 세일 산을 에서에게 소유로 주었기 때문입니다.[a][b][c]
  to: 그들과 다투지 마십시오.[a] 내가 너희에게 그들의 땅에서 발바닥을 디딜 자리만큼도 주지 않을 것이기 때문입니다. 이는 내가 세일 산을 에서에게 소유지로 주었기 때문입니다.[b][c]
  rationale: 원문의 발-발바닥 관용구를 ‘발바닥을 디딜 자리만큼도’로 회복하여 최소한의 토지도 주지 않는다는 의미와 형상을 함께 보존했습니다. 적대 행위 금지는 격식 있는 현대 한국어인 ‘다투지 마십시오’로 옮겼으며, 토지의 수여는 ‘소유지로’로 다듬었습니다. 각주 표지도 각 해당 어구 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:06Z'
review_pass:
  verdict: revise
  source_fidelity: ‘한 뼘의 자리’는 히브리어 ‘발바닥이 밟을 자리’라는 관용적 심상을 다른 신체 척도로 바꾸므로, 최소한의 땅도 주지 않는다는 뜻은 전달하지만 원문의 표현을 충분히 보존하지 못합니다. 또한 ‘소유로 주다’보다 ‘소유지로 주다’가 현대 한국어에서 더 자연스럽습니다.
  naturalness: 합쇼체의 명령문은 적절합니다. 다만 ‘싸움을 걸지 마십시오’는 다소 구어적이고, 본문의 적대적 대립·충돌 금지를 균형 있게 나타내는 ‘다투지 마십시오’가 현대의 격식 있는 성경 문체에 더 알맞습니다.
  terminology: ‘세일 산’, ‘에서’는 통용되는 성경식 고유명으로 유지할 수 있습니다. יְרֻשָּׁה는 이 문맥에서 ‘소유지’로 옮겨 신적 수여에 따른 영토 보유의 뜻을 자연스럽게 나타냅니다. ‘기업’과 ‘유산’은 각주 대안으로 남길 수 있습니다.
  issues:
  - severity: medium
    issue: ‘발바닥’ 관용구가 ‘한 뼘’으로 대체됨
    rationale: עַד מִדְרַךְ כַּף רָגֶל은 발바닥을 디딜 자리조차 없다는 표현입니다. ‘한 뼘’은 극소량이라는 해석은 전달하나 원문의 구체적 이미지와 척도를 바꿉니다.
