  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
  footnotes:
  - marker: a
    text: 'Or: “not even so much as a footstep” or “not even the sole of a foot.”'
    reason: lexical_alternative
  - marker: b
    text: “As a possession” may also be rendered “as an inheritance.”
    reason: lexical_alternative
  - marker: c
    text: “Mount Seir” can also refer to the mountainous region or hill country of Seir.
    reason: cultural_note
translation:
  language: ko
  text: 그들과 다투지 마십시오.[a] 내가 너희에게 그들의 땅에서 발바닥을 디딜 자리만큼도 주지 않을 것이기 때문입니다. 이는 내가 세일 산을 에서에게 소유지로 주었기 때문입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 자극하지 마십시오’, ‘그들과 대적하지 마십시오’. 이 표현은 적대적인 충돌을 일으키거나 벌이지 말라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소유지’는 ‘기업’ 또는 ‘유산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘세일 산’은 세일의 산악 지역 또는 산지를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  english_pob_choice: Do not provoke them
  chosen_korean: 그들과 싸움을 걸지 마십시오
  alternatives_korean:
  - 그들을 자극하지 마십시오
  - 그들과 다투지 마십시오
  - 그들과 대적하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘 동사의 적대적 충돌 개시를 한국어로 자연스럽게 드러내기 위해 ‘싸움을 걸다’를 택했습니다. 단순한 감정 자극보다 실제적인 적대 행동 금지를 더 잘 살립니다.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  english_pob_choice: I will not give you any of their land
  chosen_korean: 내가 너희에게 그들의 땅에서 한 뼘의 자리도 주지 않을 것이기 때문입니다
  alternatives_korean:
  - 내가 너희에게 그들의 땅을 조금도 주지 않을 것이기 때문입니다
  - 내가 너희에게 그들의 땅 중 아무것도 주지 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: מן이 가진 부분적 부정을 살려 ‘한 뼘의 자리도’로 옮겨, 땅의 일부조차 허락되지 않는다는 뜻을 유지했습니다.
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  english_pob_choice: not even enough to set the sole of a foot on
  chosen_korean: 한 뼘의 자리도
  alternatives_korean:
  - 발바닥이 닿을 자리도
  - 발을 디딜 자리도
  - 한 발자국의 자리도
  lexicon: HALOT
  rationale: 관용구의 핵심은 극소량의 토지도 허락되지 않는다는 점이므로, 한국어에서 자연스럽고 압축적인 ‘한 뼘의 자리도’로 의미를 전달했습니다.
- source_word: יְרֻשָּׁה
  english_pob_choice: as a possession
  chosen_korean: 소유로
  alternatives_korean:
  - 기업으로
  - 유산으로
  - 상속으로
  lexicon: HALOT
  rationale: 여기서는 가족 상속의 절차보다 야훼가 부여한 정착지의 소유권이 강조되므로 ‘소유로’가 가장 직접적입니다.
theological_decisions:
- issue: 야훼의 영토 분배 근거
  chosen_reading: 금지 명령의 이유를 에돔에게 이미 주어진 세일 산이라는 야훼의 주권적 분배로 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 외교적 자제 권고로만 읽는 번역
  rationale: 두 개의 כִּי 절이 금지의 근거를 하나님의 주권적 분배에 두므로, 그 신학적 논리를 번역문에서도 유지했습니다.
  doctrine_reference: 하나님의 주권과 열방에 대한 땅의 분배
