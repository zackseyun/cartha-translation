  text: And when all the men of war had finished dying from among the people,[a]
  footnotes:
  - marker: a
    text: Or 'the fighting men.' The Hebrew is literally 'the men of war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 군사들이 백성 가운데에서 죽기를 마쳤을 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투원들’. 히브리어는 문자적으로 ‘전쟁의 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: 그리고 …했을 때였습니다
  alternatives_korean:
  - 그리고 …하였습니다
  - 그리고 …하게 되었습니다
  lexicon: HALOT
  rationale: 서술 시작의 와우 연속과 זמן절을 한국어에서 자연스럽게 풀어, 사건 전환을 드러내되 문체는 공식적으로 유지했습니다.
- source_word: תַּמּוּ לָמוּת
  english_pob_choice: had finished dying
  chosen_korean: 죽기를 마쳤을 때였습니다
  alternatives_korean:
  - 죽었습니다
  - 죽는 일이 끝났을 때였습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘죽다’와 ‘마치다’의 결합을 그대로 살려, 해당 세대의 죽음이 완결되었음을 드러냈습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 온 군사들
  alternatives_korean:
  - 전쟁의 사람들
  - 전사들
  lexicon: HALOT
  rationale: 직역적 ‘전쟁의 사람들’보다 문맥상 군사 집단을 가리키는 표현으로서 ‘군사들’이 자연스럽고, ‘온’으로 הכול 의미를 보완했습니다.
- source_word: מִקֶּרֶב הָעָם
  english_pob_choice: from among the people
  chosen_korean: 백성 가운데에서
  alternatives_korean:
  - 백성들 가운데서
  - 백성의 한가운데에서
  lexicon: HALOT
  rationale: 공동체 내부에서의 제거를 나타내는 מִקֶּרֶב을 한국어의 ‘가운데에서’로 옮겨 출처적 공간감을 유지했습니다.
theological_decisions:
- issue: ‘all the men of war’의 범위와 함의
  chosen_reading: 이스라엘 공동체 안에서 심판 아래 놓인 출애굽 1세대의 군사적 성인 남성을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 전투원에 대한 기술
  - 비유적으로 강한 사람들을 가리키는 표현
  rationale: 문맥상 가나안 진입을 앞둔 세대 교체를 설명하는 역사 서술이므로, 신학적 함의는 ‘광야 세대의 소멸’에 두어야 합니다.
  doctrine_reference: 민수기 14장, 신명기 1–2장 맥락
