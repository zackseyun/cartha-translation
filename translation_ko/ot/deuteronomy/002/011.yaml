translation:
  language: ko
  text: 그들도 아낙 사람들처럼 르바임[a]으로 여겨졌으며, 모압 사람들은 그들을 에밈이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘르바임’은 ‘거인들’로 풀이될 수도 있으나, 원문에서는 고대 집단명으로 보존되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  english_pob_choice: Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 레파임
  lexicon: HALOT
  rationale: 영어 POB가 지명/민족명으로 음역한 흐름을 따라, 해석어인 ‘거인들’보다 고유한 집단명으로 옮겼습니다.
- source_word: יֵחָשְׁבוּ
  english_pob_choice: were considered
  chosen_korean: 여겨졌습니다
  alternatives_korean:
  - 간주되었습니다
  - 헤아려졌습니다
  lexicon: HALOT
  rationale: 니팔의 ‘간주되다/여겨지다’ 뜻을 자연스러운 현대 한국어 수동 표현으로 살렸습니다.
- source_word: כָּעֲנָקִים
  english_pob_choice: like the Anakim
  chosen_korean: 아낙족처럼
  alternatives_korean:
  - 아낙족같이
  - 아낙족과 같이
  lexicon: HALOT
  rationale: 비교 접두 כ의 의미를 ‘처럼’으로 풀어, 동일한 분류가 아니라 유사한 범주로 여겨졌다는 점을 드러냈습니다.
- source_word: אֵמִים
  english_pob_choice: Emim
  chosen_korean: 에밈
  alternatives_korean:
  - 에밈 족
  - 에밈들
  lexicon: HALOT
  rationale: 모압 사람들이 붙인 고유명칭을 음역해 보존했고, 히브리어 무관사형에 맞추어 ‘그 에밈’으로 일반화하지 않았습니다.
theological_decisions:
- issue: 본문의 민족명/집단명 보존 여부
  chosen_reading: 역사적 민족 집단명으로 읽어 음역을 유지했습니다.
  alternative_readings:
