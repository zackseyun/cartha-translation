  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
  footnotes:
  - marker: a
    text: Or 'giants' for 'Rephaim,' though the Hebrew most naturally preserves the name of an ancient people-group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 르바임으로 여겨졌습니다 — 아낙족처럼 말입니다. 모압 사람들은 그들을 에밈이라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘르바임’은 문맥상 ‘거인들’로 풀이될 수 있으나, 원문은 고대 집단명으로 가장 자연스럽게 보존됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  english_pob_choice: Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 레파임
  lexicon: HALOT
  rationale: 영어 POB가 지명/민족명으로 음역한 흐름을 따라, 해석어인 ‘거인들’보다 고유한 집단명으로 옮겼습니다.
- source_word: יֵחָשְׁבוּ
  english_pob_choice: were considered
  chosen_korean: 여겨졌습니다
  alternatives_korean:
  - 간주되었습니다
  - 헤아려졌습니다
  lexicon: HALOT
  rationale: 니팔의 ‘간주되다/여겨지다’ 뜻을 자연스러운 현대 한국어 수동 표현으로 살렸습니다.
- source_word: כָּעֲנָקִים
  english_pob_choice: like the Anakim
  chosen_korean: 아낙족처럼
  alternatives_korean:
  - 아낙족같이
  - 아낙족과 같이
  lexicon: HALOT
  rationale: 비교 접두 כ의 의미를 ‘처럼’으로 풀어, 동일한 분류가 아니라 유사한 범주로 여겨졌다는 점을 드러냈습니다.
- source_word: אֵמִים
  english_pob_choice: Emim
  chosen_korean: 에밈
  alternatives_korean:
  - 에밈 족
  - 에밈들
  lexicon: HALOT
  rationale: 모압 사람들이 붙인 고유명칭을 음역해 보존했고, 히브리어 무관사형에 맞추어 ‘그 에밈’으로 일반화하지 않았습니다.
theological_decisions:
- issue: 본문의 민족명/집단명 보존 여부
  chosen_reading: 역사적 민족 집단명으로 읽어 음역을 유지했습니다.
  alternative_readings:
  - ‘거인들’로 해석해 서술하는 읽기
  rationale: 이 절은 고대 민족들의 명칭과 타칭을 기록하는 문맥이므로, 해석적 일반화보다 원문의 집단명 구조를 유지하는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: 성경 본문의 역사성 및 지리·민족 명칭의 보존
