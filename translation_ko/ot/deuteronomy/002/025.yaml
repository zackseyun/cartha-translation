source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
  footnotes:
  - marker: a
    text: Or 'who hear your fame' or 'who hear news of you.' The Hebrew expression can refer to a report that produces reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be in anguish' or 'will writhe like a woman in labor.' The Hebrew verb evokes intense bodily distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내가 시작하여, 하늘 아래 모든 백성 위에 너에 대한 두려움과 너의 공포를 두겠습니다. 그들은 너에 관한 소문을 듣고 너 때문에 떨며 진통하듯 몸부림칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너에 대한 명성’ 혹은 ‘너에 관한 소식’입니다. 히브리어 표현은 평판을 만들어 내는 보고를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산고에 있을 것이다’ 혹은 ‘해산하는 여인처럼 몸부림칠 것이다’입니다. 히브리어 동사는 강한 신체적 고통을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  english_pob_choice: I will begin to put
  chosen_korean: 내가 시작하여 … 두겠습니다
  alternatives_korean:
  - 내가 시작하여 … 주겠습니다
  - 내가 시작하여 … 놓겠습니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘시작하다’와 ‘주다/두다’의 관용을 살려, 한국어에서는 자연스럽게 ‘시작하여 … 두겠습니다’로 옮겼습니다.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  english_pob_choice: the dread of you and fear of you
  chosen_korean: 너에 대한 두려움과 너의 공포
  alternatives_korean:
  - 너를 향한 두려움과 공포
  - 너에 대한 두려움과 경외
  lexicon: HALOT
  rationale: 두 명사의 병렬을 살리되, ‘경외’처럼 종교적으로 완화하지 않고 적대적 맥락에 맞는 ‘두려움 / 공포’로 구분했습니다.
- source_word: עַל פְּנֵי הָעַמִּים
  english_pob_choice: on the face of the peoples
  chosen_korean: 모든 백성 위에
  alternatives_korean:
  - 백성들의 얼굴 위에
  - 백성들 앞에
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지는 보존하되 한국어에서는 자연스러운 수용을 위해 ‘on the face of’를 과도하게 문자화하지 않고 ‘위에’로 처리했습니다.
- source_word: שִׁמְעֲךָ
  english_pob_choice: the report about you
  chosen_korean: 너에 관한 소문
  alternatives_korean:
  - 너에 대한 보고
  - 너의 소식
  lexicon: HALOT
  rationale: 이 어근은 ‘소문/소식/보고’의 넓은 범위를 가지며, 본문에서는 열방이 듣게 될 평판의 확산을 가리키므로 ‘소문’이 가장 직접적입니다.
- source_word: וְחָלוּ
  english_pob_choice: and writhe
  chosen_korean: 진통하듯 몸부림칠 것입니다
  alternatives_korean:
  - 몸부림칠 것입니다
  - 산통을 겪을 것입니다
  lexicon: HALOT
  rationale: 동사가 육체적 고통의 뒤틀림을 강하게 나타내므로, POB의 ‘writhe’에 맞춰 고통의 몸짓을 살린 표현을 채택했습니다.
theological_decisions:
- issue: ‘두려움과 공포’의 대상과 방향
  chosen_reading: 이스라엘의 힘이 열방 안에 주어지는 것이 아니라, 그들 위에 두려움이 임하는 것으로 번역했습니다.
  alternative_readings:
  - 너를 두려워하게 될 것이다
  - 너에 대한 경외가 있을 것이다
  rationale: 본문은 전쟁의 억제력과 신적 심판의 결과를 묘사하므로, 적대적 भय의 뉘앙스를 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 신명기 2장 문맥; 야훼의 주권적 역사와 열방의 반응
- issue: ‘소문’과 ‘보고/소식’의 선택
  chosen_reading: 공적 명성의 추상화보다, 들려오는 소문과 소식의 파급을 드러내는 방향으로 번역했습니다.
  alternative_readings:
  - 보고
  - 소식
  rationale: 히브리어 שֵׁמַע는 단순한 정보 전달을 넘어 평판을 형성하는 들림을 포함하므로, 문맥상 반응을 일으키는 ‘소문’이 가장 생생합니다.
  doctrine_reference: 언어의 전달력과 열방 인식의 변화에 대한 본문 서술
