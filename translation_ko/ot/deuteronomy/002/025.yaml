  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 본문의 ‘진통하듯’은 חוּל의 가능한 산고 이미지를 본문에 선결적으로 넣어, ‘몸부림치다/고통을 겪다’라는 더 넓은 의미를 좁힙니다. 이를 각주로 옮기는 것이 원문의 범위를 보존합니다.
  naturalness: ‘오늘 내가 시작하여 … 두겠습니다’는 현대 한국어 합쇼체에서 다소 어색합니다. ‘오늘부터 내가 … 두기 시작하겠습니다’가 원문의 시작 의미를 유지하면서 자연스럽습니다. 또한 각주는 해당 어휘 바로 뒤에 배치하는 편이 독해와 앵커 대응에 명확합니다.
  terminology: פחד와 יראה의 병렬은 ‘두려움과 공포’로 구별해 옮길 수 있습니다. שִׁמְעֲךָ는 ‘소문’보다 중립적인 ‘소식’으로 본문에 두고, ‘명성/소문’을 각주 대안으로 제시하는 것이 적절합니다. ‘모든 민족’은 עמים의 복수적 공적 집단을 자연스럽게 반영합니다.
