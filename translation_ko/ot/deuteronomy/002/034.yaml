id: DEU.2.34
reference: Deuteronomy 2:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
  footnotes:
  - marker: a
    text: Or, more formally, 'we put every city under the ban.' The Hebrew verb carries the idea of devoting something to destruction under ḥerem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리는 그의 모든 성읍을 점령하였고, 그 가운데 거주하던 모든 성읍을 여인들과 어린아이들과 함께 멸망에 넘겼습니다. 우리는 남은 자를 하나도 남기지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘우리는 모든 성읍을 멸망에 넘겼습니다.’ 히브리어 동사는 ḥerem 아래에서 무엇인가를 멸망에 바친다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  english_pob_choice: we captured
  chosen_korean: 점령하였고
  alternatives_korean:
  - 포획하였고
  - 사로잡았고
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 군사적 정복 동사를 한국어로 자연스럽게 옮기되, 단순한 '잡다'보다 전투 맥락이 분명한 '점령하다'를 택했습니다.
- source_word: בָּעֵת הַהִוא
  english_pob_choice: At that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시기에
  - 그 무렵
  lexicon: HALOT
  rationale: 시간 부사를 간결하고 자연스럽게 옮겨, 내러티브 흐름을 유지했습니다.
- source_word: וַנַּחֲרֵם
  english_pob_choice: we devoted ... to destruction
  chosen_korean: 멸망에 넘겼습니다
  alternatives_korean:
  - 진멸하였습니다
  - 저주 아래 두었습니다
  - 멸절시켰습니다
  lexicon: HALOT
  rationale: חרם의 기술적·종교적 뉘앙스를 살리면서도, 현대 한국어에서 이해 가능한 표현으로 옮겼습니다. 단순한 '완전히 파괴하다'보다 헌납/제의적 강제를 포함한 의미를 덜 희석합니다.
- source_word: כָּל עִיר מְתִם
  english_pob_choice: every inhabited city
  chosen_korean: 그 가운데 거주하던 모든 성읍
  alternatives_korean:
  - 모든 사람이 사는 성읍
  - 모든 거주 성읍
  lexicon: HALOT
  rationale: מְתִם이 '거주하는 자들/사람이 사는' 뉘앙스를 담으므로, 단순히 '성읍'만 반복하기보다 '거주하던'을 넣어 inhabited의 의미를 드러냈습니다.
- source_word: וְ/הַ/נָּשִׁים וְ/הַ/טָּף
  english_pob_choice: with the women and the little children
  chosen_korean: 여인들과 어린아이들과 함께
  alternatives_korean:
  - 여자들과 어린아이들과 함께
  - 부녀자들과 어린아이들과 함께
  lexicon: HALOT
  rationale: 여성 명사와 어린 자녀를 직접 구분해 번역하되, 한국어에서 가장 자연스러운 인칭 범주로 '여인들'과 '어린아이들'을 사용했습니다.
- source_word: לֹא הִשְׁאַ֖רְנוּ שָׂרִיד
  english_pob_choice: We left no survivor
  chosen_korean: 우리는 남은 자를 하나도 남기지 않았습니다
  alternatives_korean:
  - 생존자를 하나도 남기지 않았습니다
  - 남은 사람을 하나도 남기지 않았습니다
  lexicon: HALOT
  rationale: שָׂרִיד을 '남은 자'로 옮겨 survivor/remnant의 의미를 모두 살렸고, 한국어 관용에 맞게 종결을 정리했습니다.
theological_decisions:
- issue: חרם(herem) 군사-제의 용어의 한국어 처리
  chosen_reading: 멸망에 넘겼습니다
  alternative_readings:
  - 진멸하였습니다
  - 진멸하도록 바쳤습니다
  rationale: 본문의 חרם는 단순한 전멸이 아니라 하나님께 속하게 된 파괴 명령의 성격을 지니므로, 이를 너무 평면화하지 않으면서도 현대 독자가 이해할 수 있게 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 남성/여성/어린아이의 구분 보존
  chosen_reading: 여인들과 어린아이들과 함께
  alternative_readings:
  - 사람들과 함께
  - 부녀자와 아이들과 함께
  rationale: 히브리어가 남성 집단과 여성, 어린이를 구분하는 문맥이므로, 그 구분을 지우지 않고 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §4
