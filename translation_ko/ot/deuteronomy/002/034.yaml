  source_fidelity: 수정이 필요합니다. 초안의 ‘그 가운데 거주하던 모든 성읍’은 히브리어 כָּל עִיר מְתִם을 자연스럽게 반영하지 못하며, ‘성읍들 가운데 거주하던’이라는 뜻으로도 읽힐 수 있습니다. 또한 원문이 명시하는 남자(מְתִם)가 본문에서 빠졌습니다. 원문은 각 성읍과 그 안의 남자들, 여자들, 어린아이들을 חרם으로 진멸한 것을 말합니다.
  naturalness: ‘그 가운데 거주하던 모든 성읍’은 현대 한국어 문장으로 부자연스럽고 의미 관계가 불분명합니다. ‘각 성읍의 남자들과 여자들과 어린아이들’로 풀어 쓰면 원문의 열거를 명료하고 자연스럽게 드러낼 수 있습니다. ‘한 사람도 남기지 않았습니다’는 ‘남은 자를 하나도 남기지 않았습니다’보다 간결하고 자연스럽습니다.
  terminology: ‘멸망에 넘겼습니다’는 חרם의 기술적 의미를 충분히 드러내지 못하고, 현재 문장에서는 성읍 자체만을 대상으로 삼는 듯합니다. ‘진멸하도록 바쳤습니다’는 파괴에 바치는 חרם의 특성을 비교적 보존합니다. 각주에서 히브리어 ḥerem을 설명하여 전문적 의미를 보완합니다.
