revisions:
- from: 그때 우리는 그의 모든 성읍을 점령하였고, 그 가운데 거주하던 모든 성읍을 여인들과 어린아이들과 함께 멸망에 넘겼습니다. 우리는 남은 자를 하나도 남기지 않았습니다.[a]
  to: 그때 우리는 그의 모든 성읍을 점령하고, 각 성읍의 남자들과 여자들과 어린아이들을 진멸하도록 바쳤습니다.[a] 한 사람도 남기지 않았습니다.
  rationale: 원문의 열거 가운데 빠진 ‘남자들’을 복원하고, 부자연스럽고 의미가 어긋난 ‘그 가운데 거주하던 모든 성읍’을 ‘각 성읍의 남자들과 여자들과 어린아이들’로 고쳤습니다. חרם의 기술적 의미는 본문에서 ‘진멸하도록 바쳤습니다’로 보존하고, 각주에서 더 형식적인 표현과 의미를 설명했습니다. 잔혹한 행위의 역사적 묘사는 완화하거나 해설로 덧붙이지 않고 원문의 서술 범위 안에서 충실히 옮겼습니다.
