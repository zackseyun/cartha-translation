  to: 은을 받고 음식을 제게 팔아 주십시오[a]. 그러면 제가 먹겠습니다. 또 은을 받고 물을 제게 주십시오. 그러면 제가 마시겠습니다. 다만 제가 제 발로 지나가게 해 주십시오[b]—
  rationale: 지불을 뜻하는 히브리어 전치사구는 ‘은을 받고’로 자연스럽게 옮기되 ‘은’이라는 구체적 표현을 유지했습니다. 먹고 마심은 상대의 사역 행위가 아니라 판매와 제공의 결과이므로 ‘그러면 제가 먹겠습니다/마시겠습니다’로 수정했습니다. 또한 ‘제 발로’ 관련 각주를 올바른 본문 위치로 옮기고 중복 없는 대안과 정확한 문자적 설명으로 정비했습니다.
