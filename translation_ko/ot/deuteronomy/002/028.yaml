  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
  footnotes:
  - marker: a
    text: Or 'with money.' The Hebrew says literally 'for/with the silver.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on foot.' The Hebrew reads literally 'on my feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 음식을 은으로 팔아 주십시오[a], 그래서 제가 먹게 하시고, 물도 은으로 주십시오, 그래서 제가 마시게 하십시오[b]. 다만 제가 제 발로 지나가게 해주십시오—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈으로’. 히브리어는 문자적으로 ‘은/은으로’를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 발로’. 히브리어는 문자적으로 ‘내 발들 위에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 식량
  - 양식
  lexicon: HALOT
  rationale: 일반적인 먹을거리를 가리키는 넓은 뜻을 살리기 위해 ‘음식’을 택했습니다. 이 문맥에서는 특정 품목보다 보편적 식품 요청이 핵심입니다.
- source_word: בַּכֶּסֶף
  english_pob_choice: for silver
  chosen_korean: 은으로
  alternatives_korean:
  - 돈으로
  - 은값으로
  - 은을 주고
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 ‘은’을 유지해, 단순한 화폐 일반보다 지불 수단의 물질성을 드러냈습니다.
- source_word: תַּשְׁבִּרֵנִי
  english_pob_choice: you may sell me
  chosen_korean: 팔아 주십시오
  alternatives_korean:
  - 저에게 파십시오
  - 저에게 판매해 주십시오
  - 저에게 주십시오
  lexicon: HALOT
  rationale: 이 동사의 문맥상 의미는 ‘팔다/조달하다’이므로, 청원형 요청을 자연스럽게 살려 ‘팔아 주십시오’로 옮겼습니다.
- source_word: בְרַגְלָי
  english_pob_choice: on my feet
  chosen_korean: 제 발로
  alternatives_korean:
  - 걸어서
  - 도보로
  - 제 두 발로
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하면서도 한국어에서 자연스러운 관용으로 풀어, 평화롭게 도보로 지나가는 뜻을 드러냈습니다.
theological_decisions:
- issue: 청원문의 문체와 공손도
  chosen_reading: 화자는 상대에게 직접 명령한다기보다 허용을 구하는 요청이므로, 한국어는 명령형보다는 정중한 청원형인 ‘-주십시오’로 처리했습니다.
  alternative_readings:
  - -하십시오
  - -해 주시오
  - -하시길 바랍니다
  rationale: 히브리어의 청원적 뉘앙스를 보존하면서 현대 한국어 합쇼체에 맞추기 위해서입니다.
  doctrine_reference: 담화/화행 뉘앙스 보존
