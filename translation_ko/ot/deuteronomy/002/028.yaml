  source_fidelity: 초안은 음식과 물을 은을 받고 제공해 달라는 청원과 ‘제 발로’ 지나가게 해 달라는 제한을 대체로 보존합니다. 그러나 ‘그래서 제가 먹게 하시고/마시게 하십시오’는 상대가 화자가 먹고 마시도록 하게 한다는 불필요한 사역 의미를 만들며, 히브리어의 결과·목적 관계를 더 정확히 옮길 필요가 있습니다.
  naturalness: ‘은으로 팔아 주십시오’보다 ‘은을 받고 … 팔아 주십시오’가 현대 한국어에서 지불의 뜻을 더 자연스럽고 분명하게 전달합니다. 문장을 나누어 결과를 ‘그러면 제가 …겠습니다’로 표현하면 합쇼체의 정중한 청원 문체도 유지됩니다.
  terminology: ‘음식’, ‘은’, ‘제 발로’는 적절합니다. ‘제 발로’는 문자적 표현을 보존하면서도 자연스럽습니다. 각주 b는 본문에서 ‘마시게 하십시오’에 잘못 붙어 있어 ‘제 발로’에 붙여야 하며, 각주 내용도 본문 표현과 중복되지 않도록 고쳐야 합니다.
