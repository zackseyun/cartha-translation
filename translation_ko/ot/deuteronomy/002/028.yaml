translation:
  language: ko
  text: 은을 받고 음식을 제게 팔아 주십시오[a]. 그러면 제가 먹겠습니다. 또 은을 받고 물을 제게 주십시오. 그러면 제가 마시겠습니다. 다만 제가 제 발로 지나가게 해 주십시오[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈을 받고’. 히브리어는 문자적으로 ‘은으로/은을 받고’를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘걸어서’. 히브리어는 문자적으로 ‘내 발로’를 말합니다.
    reason: lexical_alternative
