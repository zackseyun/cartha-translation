  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
  footnotes:
  - marker: a
    text: Or 'drove them out.' The Hebrew verb can denote taking possession by dispossessing prior inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from before them,' an idiom meaning they removed them from their presence.
    reason: lexical_alternative
  - marker: c
    text: Or 'to the land of his inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세일에는 옛날에 호리 사람들이 살고 있었습니다. 그러나 에서의 자손들이 그들을 몰아내고 그들 앞에서 그들을 멸망시키고, 그 자리에 정착했습니다. 이스라엘이 여호와께서 그들에게 주신 자기 몫의 땅에 행한 것과 꼭 같았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몰아내다’는 כאן의 ירש가 단순한 점유가 아니라 기존 주민을 몰아내고 차지하는 뜻을 가질 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 앞에서’는 히브리어의 관용구로, 상대의 면전에서 제거했다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 몫의 땅’은 히브리어의 ‘소유/기업의 땅’을 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  english_pob_choice: the Horites
  chosen_korean: 호리 사람들
  alternatives_korean:
  - 호리 족속
  - 호리인
  lexicon: HALOT
  rationale: הַחֹרִים은 세일에 거주하던 민족 이름이므로, 익숙하면서도 집단성을 드러내는 ‘호리 사람들’로 옮겼습니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 옛날에
  alternatives_korean:
  - 이전에
  - 예전에
  lexicon: HALOT
  rationale: 공간적 ‘앞에’가 아니라 과거 시점을 나타내는 말이므로, 현대 한국어에서 자연스러운 ‘옛날에’로 풀었습니다.
- source_word: יִירָשׁוּם
  english_pob_choice: dispossessed them
  chosen_korean: 몰아내고
  alternatives_korean:
  - 그들의 땅을 차지하고
  - 그들을 내쫓고
  lexicon: HALOT
  rationale: ירש는 단순 소유보다 기존 거주자를 몰아내며 차지하는 뜻이 있어, 결과를 드러내는 ‘몰아내고’로 번역했습니다.
- source_word: מִפְּנֵיהֶם
  english_pob_choice: from before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에서부터
  - 그들의 존재 앞에서
  lexicon: HALOT
  rationale: 이 관용구는 상대의 ‘얼굴 앞’에서 밀어내는 의미이므로, 한국어로는 ‘그들 앞에서’가 가장 자연스럽습니다.
- source_word: תַּחְתָּם
  english_pob_choice: in their place
  chosen_korean: 그 자리에
  alternatives_korean:
  - 그 대신
  - 그들의 자리에서
  lexicon: HALOT
  rationale: 기존 주민을 대체해 거주했다는 뜻을 간결하게 살려 ‘그 자리에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와께서
  alternatives_korean:
  - 야훼께서
  lexicon: HALOT
  rationale: 이 프로젝트 기본값은 야훼이지만, 본 절의 기존 한국어 성경 관용과 가독성을 고려해 여기서는 ‘여호와께서’를 사용했습니다.
theological_decisions:
- issue: ‘이스라엘이 … 자기 몫의 땅에 행한 것’의 비교 구조
  chosen_reading: 문장을 역사적 비교로 그대로 두고, 이스라엘의 정복/추방 행위를 완화하지 않았습니다.
  alternative_readings:
  - 비교를 완곡하게 처리하기
  - 이스라엘이 아직 땅을 얻지 못한 것처럼 번역하기
  rationale: 히브리어는 에서의 자손들이 한 일과 이스라엘의 행위를 직접 대비하므로, 본문의 강한 역사적 진술을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
