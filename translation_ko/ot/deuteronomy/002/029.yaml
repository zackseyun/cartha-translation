translation:
  language: ko
  text: 세일에 사는 에서의 자손과 아르에 사는 모압 사람들이 나에게 한 것처럼, 내가 요단을 건너 야훼 우리 하나님께서 우리에게 주고 계시는 땅으로 들어갈 때까지 그렇게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 대하였던’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘나에게 행하였다’라고 하며, 문맥상 통과를 허락하고 필요한 것을 제공한 일을 가리킵니다.
    reason: lexical_alternative
