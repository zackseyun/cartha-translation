  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
  footnotes:
  - marker: a
    text: Or 'dealt with me'; the Hebrew says literally 'did for me,' referring in context to granting passage and provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 곧 세일에 사는 에서의 자손과 아르에 사는 모압 사람들이 나에게 한 것처럼, 내가 요단을 건너 우리가 받을 땅으로 들어갈 때까지입니다. 야훼 우리 하나님께서 우리에게 주고 계시는 땅입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 대하였던’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘나에게 행하였다’라고 하며, 문맥상 통과 허용과 식량 제공을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: just as
  chosen_korean: …한 것처럼
  alternatives_korean:
  - …하듯이
  - …과 같이
  lexicon: HALOT
  rationale: 비교 관계를 자연스러운 현대 한국어로 살리면서, 뒤의 행위와 정확히 대응되는 비교임을 드러냅니다.
- source_word: עָשׂוּ לִי
  english_pob_choice: did for me
  chosen_korean: 나에게 한 것처럼
  alternatives_korean:
  - 나를 위해 한 것처럼
  - 나에게 대해 한 것처럼
  lexicon: HALOT
  rationale: 문맥상 통과와 공급을 허용한 처신을 가리키지만, 히브리어 표현의 넓이를 유지하기 위해 구체화하지 않고 최소한으로 옮겼습니다.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר / הַיֹּשְׁבִים בְּעָר
  english_pob_choice: who live in Seir / who live in Ar
  chosen_korean: 세일에 사는 / 아르에 사는
  alternatives_korean:
  - 세일에 거주하는 / 아르에 거주하는
  - 세일에 머무는 / 아르에 머무는
  lexicon: HALOT
  rationale: 정착 거주를 나타내는 분사이므로 ‘사는’이 가장 자연스럽고, 지명은 음역하여 보존했습니다.
- source_word: אֶעֱבֹר אֶת הַיַּרְדֵּן
  english_pob_choice: I cross the Jordan
  chosen_korean: 내가 요단을 건너
  alternatives_korean:
  - 내가 요단을 넘어
  - 내가 요단강을 건너
  lexicon: HALOT
  rationale: ‘cross’의 이동 경계를 살리면서 한국어에서는 ‘요단을 건너’가 가장 간결하고 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약명 יהוה를 관례적 대체어가 아니라 고유명으로 드러내기 위해 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: “우리에게 주고 계시는”의 시제/상 측면
  chosen_reading: 현재 진행형으로 옮겨, 땅의 선물이 이미 확정되었으나 아직 여정 중에 있는 긴장을 살렸습니다.
  alternative_readings:
  - ‘우리에게 주시는’
  - ‘우리에게 주실’
  rationale: 히브리어 분사 נֹתֵן은 현재적·계속적 성격을 띠므로, 완료나 단순 미래로 평면화하지 않는 것이 소스에 충실합니다.
  doctrine_reference: 히브리어 분사상(Aspect) 및 약속-성취 긴장
