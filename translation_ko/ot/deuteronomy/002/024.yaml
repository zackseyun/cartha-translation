  lexicon: HALOT
  rationale: 연속된 복수 명령의 추진력을 살리되, 한국어에서는 자연스러운 현대 문체로 압축해 옮겼습니다.
- source_word: נַ֣חַל אַרְנֹן
  english_pob_choice: the Arnon Valley
  chosen_korean: 아르논 골짜기
  alternatives_korean:
