source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
  footnotes:
  - marker: a
    text: Or 'the Wadi Arnon' or 'the Arnon Brook'; the Hebrew נחל can refer to a wadi, streambed, or valley.
    reason: lexical_alternative
  - marker: b
    text: Or 'Begin to possess it.' The verb can also carry the sense 'dispossess,' but here the immediate object is Sihon's land.
    reason: lexical_alternative
  - marker: c
    text: Or 'contend with him in war' or 'provoke him to war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오[a], 떠나서 아르논 골짜기를 건너십시오. 보십시오, 내가 헤스본 왕이자 아모리 사람인 시혼과 그의 땅을 당신의 손에 넘겨주었습니다. 그것을 차지하기 시작하십시오[b], 그와 전쟁을 벌이십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아르논 와디’, ‘아르논 시내’로 옮길 수 있습니다. 히브리어 נחל은 와디, 물줄기, 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 차지하십시오’. 히브리어 동사는 ‘소유하다’뿐 아니라 ‘내쫓다/탈취하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그와 전쟁으로 대항하십시오’, ‘그를 향해 전쟁을 일으키십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ וְעִבְרוּ
  english_pob_choice: Rise up, set out, and cross over
  chosen_korean: 일어나십시오, 떠나서, 건너십시오
  alternatives_korean:
  - 일어나 움직이십시오
  - 일어나 출발하십시오
  - 일어나셔서 길을 나서십시오
  lexicon: HALOT
  rationale: 연속된 복수 명령의 추진력을 살리되, 한국어에서는 자연스러운 현대 문체로 압축해 옮겼습니다.
- source_word: נַ֣חַל אַרְנֹן
  english_pob_choice: the Arnon Valley
  chosen_korean: 아르논 골짜기
  alternatives_korean:
  - 아르논 와디
  - 아르논 시내
  - 아르논 개울
  lexicon: HALOT
  rationale: נחל의 지리적 범주를 현대 독자가 이해하기 쉬운 ‘골짜기’로 옮기되, POB의 주석상 다양한 가능성을 열어 두었습니다.
- source_word: נָתַ֣תִּי בְיָדְךָ
  english_pob_choice: I have given into your hand
  chosen_korean: 당신의 손에 넘겨주었습니다
  alternatives_korean:
  - 당신의 손에 주었습니다
  - 당신의 손에 맡겼습니다
  - 당신에게 넘겨주었습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용을 살리면서, 단순한 전달보다 통제권 부여의 뉘앙스를 드러내기 위해 ‘넘겨주었습니다’를 택했습니다.
- source_word: רָשׁ
  english_pob_choice: Begin to take possession of it
  chosen_korean: 그것을 차지하기 시작하십시오
  alternatives_korean:
  - 그것을 소유하기 시작하십시오
  - 그것을 점유하기 시작하십시오
  - 그것을 차지하십시오
  lexicon: HALOT
  rationale: 여기서는 땅이 직접 목적어이므로 ‘차지하다’가 가장 자연스럽고, 동작의 시작을 명시하는 히브리어 용법도 반영합니다.
- source_word: וְהִתְגָּר בּוֹ מִלְחָמָה
  english_pob_choice: engage him in battle
  chosen_korean: 그와 전쟁을 벌이십시오
  alternatives_korean:
  - 그와 싸우십시오
  - 그와 전투를 벌이십시오
  - 그를 향해 전쟁을 일으키십시오
  lexicon: HALOT
  rationale: 히트파엘의 상호적·적대적 의미를 살려 단순한 충돌보다 더 강한 ‘전쟁을 벌이다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 수여와 인간의 실행 명령을 함께 보존할지 여부
  chosen_reading: ‘내가 … 넘겨주었습니다’와 ‘차지하기 시작하십시오, 그와 전쟁을 벌이십시오’를 함께 유지했습니다.
  alternative_readings:
  - ‘내가 … 넘겨주겠다’로 미래화하기
  - ‘차지하다’만 남기고 전쟁 명령을 약화하기
  rationale: 본문은 이미 이루어진 신적 수여와 이스라엘의 실제 행동 명령을 나란히 놓습니다. 이를 한쪽으로 풀어버리지 않고 함께 드러내는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3
