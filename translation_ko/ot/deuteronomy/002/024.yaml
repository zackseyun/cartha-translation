  source_fidelity: 본문은 세 명령, 아르논 나할의 통과, 시혼(헤스본 왕·아모리 사람)과 그의 땅을 이미 넘겨주셨다는 선언, 땅을 차지하라는 명령 및 전쟁 명령을 충실히 보존합니다. 다만 ‘그것’은 문법상 땅을 가리키지만, 히브리어의 직접 목적어가 ‘그의 땅’임을 한국어 본문에서 명시하면 더 분명합니다.
  naturalness: 현대 합쇼체는 대체로 자연스럽습니다. ‘그 땅을 차지하기 시작하십시오’가 ‘그것을’보다 지시 대상이 명확하고 자연스럽습니다. 각주 c의 ‘전쟁으로 대항하십시오’는 다소 부자연스러워 자연스러운 대안을 제시하는 편이 좋습니다.
  terminology: ‘아르논 골짜기’, ‘헤스본’, ‘아모리 사람’, ‘시혼’, ‘당신의 손에 넘겨주었습니다’, ‘전쟁을 벌이십시오’는 적절합니다. 각주 b는 ירש의 ‘내쫓다’ 가능성을 언급하되, 이 문맥의 목적어가 시혼의 땅임을 밝혀야 영어 POB 주석의 판단을 온전히 반영합니다.
