- from: 그러나 헤스본 왕 시혼은 우리가 그의 땅을 지나가도록 허락하지 않았습니다[a]. 이는 야훼 당신의 하나님께서 그의 영을 완강하게 하시고 그의 마음을 굳세게 하셔서, 오늘과 같이 그를 당신의 손에 넘겨 주시려는 것이었습니다.
  to: 그러나 헤스본 왕 시혼은 우리가 그의 영토를 지나가도록 허락하려 하지 않았습니다[a]. 이는 야훼 당신의 하나님께서 그의 영을 완고하게 하시고 그의 마음을 완고하게 하셔서, 오늘과 같이 그를 당신의 손에 넘겨주시려 하셨기 때문입니다.
  rationale: 시혼의 내적 비의지(אָבָה)를 ‘허락하려 하지 않았습니다’로 보존했습니다. 야훼께서 시혼의 영과 마음을 완고하게 하셨다는 두 진술을 모두 직접 번역하여 본문의 신학적 긴장을 해소하지 않았습니다. 영토라는 문맥적 지시는 본문에서 자연스럽게 드러내되, 히브리어 표현의 문자적 범위는 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:03Z'
review_pass:
  verdict: revise
  source_fidelity: ‘허락하지 않았습니다’는 결과적으로 거절했다는 뜻은 전달하지만, אָבָה가 지닌 ‘기꺼이 하려 하지 않다’라는 의지의 뉘앙스를 충분히 드러내지 못합니다. 또한 הִקְשָׁה와 문맥상의 완고함을 ‘영을 완강하게’보다 자연스럽고 정확하게 ‘영을 완고하게’로 옮기는 편이 낫습니다. בּוֹ는 문맥상 시혼의 영토를 뜻하므로 본문에서 ‘그의 영토’로 명시하는 것은 적절하며, 각주의 직역 설명은 전치사 בּ의 의미를 더 정확히 밝혀야 합니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 다만 ‘영을 완강하게 하시고’는 현대 한국어에서 다소 어색하고, ‘허락하지 않았습니다’는 원문의 의지 표현을 평면화합니다. ‘지나가도록 허락하려 하지 않았습니다’와 ‘영을 완고하게 하시고’가 더 자연스럽습니다.
  terminology: ‘야훼’, ‘하나님’, ‘영’, ‘마음’, ‘손에 넘겨주시다’는 일관되고 적절합니다. ‘마음을 굳세게’는 어휘상 가능하나 한국어의 긍정적 용례가 강할 수 있으므로, 본문의 완고함의 문맥을 드러내어 ‘마음을 완고하게’로 번역하는 것이 안전합니다.
