  - severity: low
    issue: ‘그의 영을 완강하게 하시고’는 한국어 결합이 다소 부자연스럽습니다.
    rationale: ‘영을 완고하게 하시고’가 הִקְשָׁה의 완고하게 함을 자연스럽게 전달하면서 רוּחַ도 보존합니다.
  - severity: low
    issue: 각주의 ‘문자적으로 그를/그 안에서’는 בּוֹ의 전치사적 의미를 충분히 반영하지 못합니다.
