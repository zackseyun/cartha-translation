source:
  edition: WLC
  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
  footnotes:
  - marker: a
    text: Or 'and strengthened his heart.' The Hebrew verb can mean 'make strong,' but here likely carries the sense of making him obstinate or stubborn in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 헤스본 왕 시혼은 우리가 그의 영토를 지나가도록 허락하려 하지 않았습니다[a]. 이는 야훼 당신의 하나님께서 그의 영을 완고하게 하시고 그의 마음을 완고하게 하셔서, 오늘과 같이 그를 당신의 손에 넘겨주시려 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그를 통하여 지나가도록.’ 히브리어는 문자적으로 ‘그 안에/그를 통하여’라는 표현을 쓰지만, 문맥상 시혼의 영토를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  english_pob_choice: was not willing
  chosen_korean: 허락하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 동의하지 않았습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 외적 거절보다 의지와 동의의 부재를 가리키므로, 자연스러운 한국어로 그 뜻을 살려 표현했습니다.
- source_word: הַעֲבִרֵנוּ בּוֹ
  english_pob_choice: to let us pass through his land
  chosen_korean: 우리가 그의 땅을 지나가도록
  alternatives_korean:
  - 우리가 그를 지나가도록
  - 우리가 그것을 지나가도록
  lexicon: HALOT
  rationale: 문맥상 בּוֹ는 그의 영토를 가리키므로, 한국어에서는 의미를 분명히 하되 과도한 해석을 피해서 ‘그의 땅’을 살렸습니다.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  english_pob_choice: had hardened his spirit
  chosen_korean: 그의 영을 완강하게 하시고
  alternatives_korean:
  - 그의 영을 굳게 하시고
  - 그의 마음을 완강하게 하시고
  lexicon: HALOT
  rationale: רוּחַ를 ‘영’으로 유지해 인간 내면의 상태와 신학적 긴장을 보존했고, הִקְשָׁה의 कठ함/완강함을 한국어의 ‘완강하게 하시고’로 옮겼습니다.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  english_pob_choice: and made his heart stubborn
  chosen_korean: 그의 마음을 굳세게 하셔서
  alternatives_korean:
  - 그의 마음을 완강하게 하셔서
  - 그의 마음을 강하게 하셔서
  lexicon: HALOT
  rationale: אָמֵץ의 기본 뜻은 ‘강하게 하다/굳세게 하다’이므로, 지나치게 해석적인 ‘완강하다’보다 본래 어감을 살린 ‘굳세게 하시고’로 번역했습니다.
- source_word: תִּתּוֹ בְיָדְךָ
  english_pob_choice: to give him into your hand
  chosen_korean: 그를 당신의 손에 넘겨 주시려는
  alternatives_korean:
  - 그를 당신의 손에 주시려는
  - 그를 당신의 권세 아래 두시려는
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에 주다’는 권세 아래 넘겨 주는 뜻이므로, 현대 한국어에서 그 힘을 드러내는 ‘넘겨 주시다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사본의 신명기를 따라 신적 고유명은 번역적 대체어가 아니라 학술적 음역인 ‘야훼’로 일관했습니다.
theological_decisions:
- issue: 시혼의 의지와 야훼의 완고하게 하심을 함께 보존할지 여부
  chosen_reading: 시혼이 스스로 ‘허락하지 않았다’는 진술과 야훼께서 그의 영과 마음을 강하게/완강하게 하셨다는 진술을 모두 그대로 살렸습니다.
  alternative_readings:
  - 시혼의 자발적 거절만 강조하는 완화 번역
  - 하나님의 행위를 단순한 허용으로만 바꾸는 번역
  rationale: 본문은 인간의 거절과 하나님의 주권적 작용을 동시에 말하므로, 둘 중 하나로 풀어버리지 않고 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
