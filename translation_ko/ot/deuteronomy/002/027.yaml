translation:
  language: ko
  text: 당신의 땅을 지나가게 해 주십시오. 저는 길로만 가겠습니다[a]. 오른쪽으로도, 왼쪽으로도 치우치지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘길, 길’로 반복되어 있으며, 그 반복은 경로를 엄격히 지키겠다는 강조입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  english_pob_choice: Let me pass through
  chosen_korean: 지나가게 해 주십시오
  alternatives_korean:
  - 지나가게 하소서
  - 지나가겠습니다
  lexicon: HALOT
  rationale: 모압 왕에게 정중히 요청하는 코호르타티브의 청원을 살려, 한국어에서는 직접적인 요청형인 ‘지나가게 해 주십시오’가 가장 자연스럽습니다.
- source_word: בְאַרְצֶךָ
  english_pob_choice: through your land
  chosen_korean: 당신의 땅을
  alternatives_korean:
  - 당신의 땅 가운데
  - 당신의 땅을 지나
  lexicon: HALOT
  rationale: עבר 뒤의 ב는 단순한 ‘안에서’가 아니라 통과의 의미이므로, 목적어형으로 풀어 ‘땅을 지나가게’라고 옮겼습니다.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  english_pob_choice: only by the road
  chosen_korean: 길로만
  alternatives_korean:
  - 길로, 길로
  - 오직 그 길로만
  lexicon: HALOT
  rationale: 반복을 한국어에서 직역 반복으로 두기보다, 반복의 강조를 ‘-만’으로 압축해 경로를 엄격히 지킨다는 힘을 살렸습니다.
- source_word: לֹא אָסוּר יָמִין וּשְׂמֹאול
  english_pob_choice: I will not turn aside to the right or to the left
  chosen_korean: 오른쪽으로도, 왼쪽으로도 치우치지 않겠습니다
  alternatives_korean:
  - 오른쪽이나 왼쪽으로도 벗어나지 않겠습니다
  - 오른쪽도 왼쪽도 돌아서지 않겠습니다
  lexicon: HALOT
  rationale: אָסוּר는 길에서 ‘비켜서다/치우치다’의 뜻이므로, 한국어에서는 도로 이미지에 자연스럽게 맞는 ‘치우치다’를 택했습니다.
theological_decisions:
- issue: 정중한 외교적 청원 문체
  chosen_reading: 명령형이 아니라 요청형 ‘해 주십시오’로 옮겨, 에돔/모압 계열 왕에게 보내는 외교적 청원의 어조를 드러냈습니다.
  alternative_readings:
  - 지나가게 하소서
  - 지나가겠습니다
  rationale: 본문은 단순한 미래 진술이 아니라 통과 허가를 구하는 청원이며, 한국어에서도 이를 분명히 해야 문맥의 긴장이 보존됩니다.
  doctrine_reference: 서사-담화 맥락에 따른 화행 보존
