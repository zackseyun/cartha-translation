base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
  footnotes:
  - marker: a
    text: Or 'Do not distress Moab, and do not engage them in battle.'
    reason: lexical_alternative
  - marker: b
    text: Or 'as an inheritance' for both occurrences of 'as a possession.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내게 말씀하셨습니다. “모압을 괴롭히지 말고, 그들과 전쟁을 일으키지도 마십시오. 내가 그 땅의 어떤 부분도 당신에게 소유로 주지 않을 것입니다. 나는 롯의 자손에게 아르를 소유로 주었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압을 괴롭히지 말고, 그들과 싸움에 들어가지도 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘상속으로’ — 두 번 나오는 ‘소유로’에 모두 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 표준 음역
  rationale: 히브리어 고유명 יְהוָה를 한국어 관용 대치어인 ‘주’로 바꾸지 않고, POB의 원칙에 따라 신명 ‘야훼’로 옮겼습니다.
- source_word: אֶל תָּצַר
  english_pob_choice: Do not harass
  chosen_korean: 괴롭히지 말고
  alternatives_korean:
  - 핍박하지 말고
  - 괴롭히거나 압박하지 말고
  lexicon: HALOT
  rationale: 이 금지형은 단순한 감정적 ‘슬픔’보다 적대적 압박과 괴롭힘의 뉘앙스를 가지므로, 자연스러운 현대 한국어로 ‘괴롭히지 말고’가 적합합니다.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  english_pob_choice: or provoke them to war
  chosen_korean: 그들과 전쟁을 일으키지도 마십시오
  alternatives_korean:
  - 그들과 전쟁으로 다투지도 마십시오
  - 그들에게 전쟁을 도발하지도 마십시오
  lexicon: HALOT
  rationale: hitpael 동사와 ‘전쟁’의 결합은 적대 행위를 먼저 촉발하지 말라는 뜻이어서, 한국어로는 ‘전쟁을 일으키다’가 가장 직접적입니다.
- source_word: יְרֻשָּׁה
  english_pob_choice: as a possession
  chosen_korean: 소유로
  alternatives_korean:
  - 기업으로
  - 상속으로
  lexicon: HALOT
  rationale: ‘유산’의 제도적 배경은 유지하되, 이 절의 초점은 분배된 땅을 실제로 차지하는 것에 있으므로 현대어로 ‘소유’가 분명합니다.
- source_word: לִבְנֵי לֹט
  english_pob_choice: to the sons of Lot
  chosen_korean: 롯의 자손에게
  alternatives_korean:
  - 롯의 아들들에게
  - 롯의 후손들에게
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘롯의 아들들’이지만, 한국어에서는 혈연적 집단 전체를 자연스럽게 가리키는 ‘자손’이 문맥에 더 잘 맞습니다.
theological_decisions:
- issue: 하나님이 이스라엘의 정복을 제한하시는 이유
  chosen_reading: 야훼께서 모압 땅을 이스라엘에게 주지 않겠다고 직접 선언하시는 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 역사 정보로만 완화하는 번역
  - ‘상속’의 종교적 함의를 약화하는 번역
  rationale: 본문은 단순한 외교 지침이 아니라, 야훼가 열방의 경계를 주권적으로 정하시는 내용입니다. 이를 분명히 드러내기 위해 ‘소유로 주지 않을 것입니다’라고 번역했습니다.
  doctrine_reference: 신 2장 문맥의 분배 주권, 민족 경계에 대한 하나님의 주권
