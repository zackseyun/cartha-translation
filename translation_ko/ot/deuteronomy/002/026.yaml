id: DEU.2.26
reference: Deuteronomy 2:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
  footnotes:
  - marker: a
    text: Or 'with terms of peace.' The Hebrew literally reads 'words of peace,' an idiom for a peaceful diplomatic overture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 저는 그데못 광야에서 헤스본 왕 시혼에게 평화의 말을 전할 사신들을 보내며 이렇게 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘평화의 말들’입니다. 히브리어 관용구로서 평화적인 외교적 제안을 가리킬 수 있습니다. 또는 ‘평화의 조건들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  english_pob_choice: So I sent
  chosen_korean: 그래서 저는 … 보냈습니다
  alternatives_korean:
  - 그리고 저는 … 보냈습니다
  - 그러므로 저는 … 보냈습니다
  lexicon: HALOT
  rationale: 와우-연속의 진행성을 한국어 서술에서 자연스럽게 살려, 이전 행위에 이어진 파견을 ‘그래서’로 표현했습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 이 문맥은 천사가 아니라 인간 외교 사절을 가리키므로, 한국어에서 공적·외교적 뉘앙스가 있는 ‘사신들’이 가장 적절합니다.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  english_pob_choice: from the wilderness of Kedemoth
  chosen_korean: 그핫의 광야에서부터
  alternatives_korean:
  - 그핫 광야에서
  - 그핫의 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר는 보통 ‘광야’로 옮기며, 지명 קדמות는 음역해 고유명사로 보존했습니다.
- source_word: דִּבְרֵי שָׁלוֹם
  english_pob_choice: with words of peace
  chosen_korean: 평화의 말과 함께
  alternatives_korean:
  - 평화의 말로
  - 평화 협상의 말과 함께
  - 평화의 조건과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘평화의 말’이지만, 한국어에서는 외교적 접촉을 자연스럽게 드러내는 ‘말과 함께’가 가장 매끄럽습니다. 다만 문자적 표현을 보존하기 위해 핵심어 ‘평화의 말’을 유지했습니다.
theological_decisions:
- issue: 평화의 말(דִּבְרֵי שָׁלוֹם)의 범위
  chosen_reading: 단순한 인사말이 아니라 전쟁을 피하려는 외교적 제안으로 읽었습니다.
  alternative_readings:
  - 일반적인 평화 인사
  - 형식적인 협상 개시
  rationale: 영어 POB가 이를 관용구로 보며 주석을 달았듯, 문맥상 ‘평화의 말’은 평화적 외교 제의의 성격을 띱니다.
  doctrine_reference: 신명기 20:10-12의 전쟁 전 평화 제안과 문맥적 연관
- issue: ‘그핫’의 음역
  chosen_reading: 고유명사는 한국 교회 전통의 익숙한 지명화보다 원어 지명 보존을 우선했습니다.
  alternative_readings:
  - 게데못
  - 케데못
  rationale: 지명은 원문에 가깝게 음역해 지리적 고유성을 유지하는 것이 본문 추적에 유리합니다.
  doctrine_reference: 본문 지리 정보 보존 원칙
