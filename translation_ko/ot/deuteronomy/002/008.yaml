revisions:
- from: 그렇게 우리는 세일에 사는 에서의 아들들인 우리의 형제들[a] 곁을 떠나 아라바의 길에서, 엘라트와 에시온게벨에서 돌아서, 모압 광야의 길로 지나갔습니다.
  to: 그러므로 우리는 세일에 사는 우리 형제들, 곧 에서의 자손들 곁을 지나 아라바 길과 엘랏과 에시온게벨에서 떠나, 방향을 돌려 모압 광야의 길로 지나갔습니다.
  rationale: 문장의 이동 순서를 원문에 맞게 재구성했습니다. 첫 번째 עבר는 ‘곁을 지나’로, 뒤따르는 세 개의 מִן 전치사구는 ‘…에서 떠나’로 명시했으며, וַנֵּפֶן은 ‘방향을 돌려’로 옮겼습니다. 친족 관계를 나타내는 ‘우리 형제들’은 유지하되, בְנֵי עֵשָׂו는 자연스러운 한국어 계보 표현인 ‘에서의 자손들’로 바꾸었습니다. 구조적으로 잘못된 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:08Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 전반적인 이동의 흐름과 세일, 아라바, 엘랏, 에시온게벨, 모압 광야라는 지명을 보존합니다. 그러나 첫 번째 וַנַּעֲבֹר(‘지나갔다’)를 ‘곁을 떠나’로 바꾸어 약화했고, ‘아라바의 길에서, 엘라트와 에시온게벨에서 돌아서’라는 연결은 히브리어의 수식 관계를 흐립니다. 히브리어는 세일의 에서 자손 곁을 지나, 아라바 길·엘랏·에시온게벨에서 떠나 방향을 돌린 뒤 모압 광야 길로 나아간 흐름입니다.
  naturalness: ‘에서의 아들들’은 한국어 족보·민족 표현으로 다소 직역투이므로 ‘에서의 자손들’이 자연스럽습니다. 또한 쉼표만으로 여러 출발 지점과 ‘돌아서’를 연결한 현 문장은 의미 단위가 불명확합니다. ‘…에서 떠나 방향을 돌려’로 정리하면 현대 한국어 합쇼체에서 명료하고 자연스럽습니다.
  terminology: ‘우리 형제들’은 אֲחֵינוּ의 친족 언어를 보존하므로 유지합니다. בְנֵי עֵשָׂו는 문맥상 ‘에서의 자손들’로 옮기는 것이 자연스럽고 충실합니다. 통용 한국어 성경 지명 표기인 ‘엘랏’, ‘에시온게벨’을 사용합니다. 현 각주 a는 본문 앵커(‘우리의 형제들’)와 내용(‘아라바의 길’)이 일치하지 않으며, 영어 감사 기록의 각주 배정도 원문상 뒤바뀐 것으로 보이므로 삭제합니다.
  issues:
  - severity: high
    issue: 첫 이동 동사와 전치사구의 관계가 흐려졌습니다.
    rationale: וַנַּעֲבֹר מֵאֵת는 단순히 ‘곁을 떠나다’가 아니라 친족들 곁을 ‘지나가다/지나 계속 가다’라는 이동 표현입니다. 이어지는 מִדֶּרֶךְ, מֵאֵילַת, וּמֵעֶצְיֹן גָּבֶר는 아라바 길 및 두 지점에서 떠난 것을 나타내며 ‘돌아서’에 직접 연결되지 않습니다.
  - severity: medium
    issue: 각주 a의 앵커와 내용이 불일치합니다.
    rationale: 각주는 ‘우리의 형제들’ 뒤에 붙어 있으나 ‘아라바의 길에서’라는 내용을 설명합니다. 또한 이것은 해당 위치의 대안 번역이 아닙니다. 독자에게 잘못된 본문 연결을 제시하므로 삭제하는 것이 안전합니다.
  - severity: low
    issue: ‘에서의 아들들’은 한국어에서 부자연스럽습니다.
    rationale: 히브리어의 ‘아들들’은 집단·후손을 뜻하는 관용적 계보 표현이므로 ‘에서의 자손들’이 의미를 보존하면서 더 자연스럽습니다.
  revised_text: 그러므로 우리는 세일에 사는 우리 형제들, 곧 에서의 자손들 곁을 지나 아라바 길과 엘랏과 에시온게벨에서 떠나, 방향을 돌려 모압 광야의 길로 지나갔습니다.
