  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
  footnotes:
  - marker: a
    text: Or 'from the road of the Arabah.' 'Arabah' refers to the rift-valley region south of the Dead Sea.
    reason: lexical_alternative
  - marker: b
    text: Or 'our kindred, the descendants of Esau.' The Hebrew literally says 'our brothers, the sons of Esau.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 우리는 세일에 사는 우리 형제들, 곧 에서의 자손들 곁을 지나 아라바 길과 엘랏과 에시온게벨에서 떠나, 방향을 돌려 모압 광야의 길로 지나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  english_pob_choice: our brothers, the sons of Esau
  chosen_korean: 우리의 형제들, 에서의 아들들
  alternatives_korean:
  - 우리의 친족, 에서의 후손들
  - 우리 형제들, 에서의 자손들
  lexicon: HALOT
  rationale: 히브리어의 친족 호칭을 살려 '형제들'로 옮겼고, בְנֵי עֵשָׂו는 직역에 가깝게 '에서의 아들들'로 두어 혈연 관계를 지우지 않았습니다.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  english_pob_choice: who live in Seir
  chosen_korean: 세일에 사는
  alternatives_korean:
  - 세일에 거주하는
  - 세일에 머무는
  lexicon: HALOT
  rationale: 현재 분사로 된 거주 표현은 한국어에서 자연스럽게 '사는'으로 옮기되, 지명 '세일'을 그대로 유지했습니다.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  english_pob_choice: away from the route of the Arabah
  chosen_korean: 아라바의 길에서
  alternatives_korean:
  - 아라바의 도로에서
  - 아라바의 길을 벗어나
  lexicon: HALOT
  rationale: דֶּרֶךְ의 반복을 살리기 위해 '길'을 유지했고, מִן의 이탈 감각은 문맥상 '떠나'와 결합해 자연스럽게 드러냈습니다.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  english_pob_choice: from Elath and from Ezion-geber
  chosen_korean: 엘라트와 에시온게벨에서
  alternatives_korean:
  - 엘랏과 에시온-게벨에서
  - 엘라트와 에지온게벨에서
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따르되, 한국어 표기 관행에 맞춰 자연스럽게 연결했습니다.
- source_word: וַנַּעֲבֹר ... וַנַּעֲבֹר
  english_pob_choice: we passed ... and passed
  chosen_korean: 떠나 ... 지나갔습니다
  alternatives_korean:
  - 지나갔습니다 ... 지나갔습니다
  - 건너갔습니다
  lexicon: HALOT
  rationale: 본문의 이동 동사를 두 번 그대로 반복하면 한국어가 경직되므로, 첫 번째는 전체 이동의 시작을 나타내는 '떠나'로, 두 번째는 실제 통과를 나타내는 '지나갔습니다'로 구분해 반복 의미를 살렸습니다.
theological_decisions:
- issue: 에돔/에서를 형제 관계로 부르는 표현
  chosen_reading: 우리의 형제들
  alternative_readings:
  - 우리의 친족
  - 우리의 동족
  rationale: 본문은 에돔을 단순한 이방 민족이 아니라 이스라엘의 혈연적 친족으로 제시하므로, 그 관계성을 약화하지 않도록 '형제들'을 유지했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
