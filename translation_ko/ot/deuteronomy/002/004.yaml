source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
  footnotes:
  - marker: a
    text: Or 'you are passing through' or 'you will pass through.' The Hebrew participle can express an imminent action.
    reason: lexical_alternative
  - marker: b
    text: Or 'border.' The Hebrew term can mean either a boundary line or the territory bounded by it.
    reason: lexical_alternative
  - marker: c
    text: Or 'therefore watch yourselves very carefully.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그 백성에게 명령하여 말하십시오. “너희는 세일에 사는 너희 형제들, 곧 에서의 아들들의 영토[b]를 지나가려고 합니다[a]. 그들은 너희를 두려워할 것입니다. 그러므로 매우 조심하십시오[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지나가고 있습니다’ 또는 ‘지나가게 될 것입니다’. 히브리어 분사는 임박한 동작을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경계’. 히브리어 용어는 경계선이나 그 경계로 둘러싸인 영토를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그러므로 스스로를 매우 잘 살피십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  english_pob_choice: command
  chosen_korean: 명하여 이르십시오
  alternatives_korean:
  - 명령하십시오
  - 지시하십시오
  lexicon: HALOT
  rationale: צוה의 강한 명령성을 살리면서, 합쇼체에서 자연스러운 지시문인 ‘명하여 이르십시오’로 옮겼습니다.
- source_word: בִּגְבוּל
  english_pob_choice: through the territory
  chosen_korean: 영토를
  alternatives_korean:
  - 경계를
  - 경계선을
  - 경계 지역을
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 선이 아니라 통과하게 되는 지리적 관할권이므로 ‘영토’가 가장 잘 맞습니다.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  english_pob_choice: your brothers, the sons of Esau
  chosen_korean: 형제들, 곧 에서의 아들들
  alternatives_korean:
  - 형제들, 곧 에서의 자손들
  - 친족, 곧 에서의 아들들
  lexicon: HALOT
  rationale: אַחֵיכם의 친족 언어를 ‘형제들’로 직접 살리고, בְּנֵי עֵשָׂו는 족보적 표현을 유지하기 위해 ‘에서의 아들들’로 옮겼습니다.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  english_pob_choice: So be very careful
  chosen_korean: 그러므로 매우 조심하십시오
  alternatives_korean:
  - 그러므로 스스로를 매우 잘 살피십시오
  - 그러니 각별히 주의하십시오
  lexicon: HALOT
  rationale: נשמר의 반사적 의미를 현대 한국어의 자연스러운 경고 표현인 ‘조심하십시오’로 옮기되, מְאֹד의 강조를 ‘매우’로 보존했습니다.
theological_decisions:
- issue: Edom에 대한 형제 언어의 보존
  chosen_reading: 형제들, 곧 에서의 아들들
  alternative_readings:
  - 친족, 곧 에서의 자손들
  - 민족, 곧 에서의 후손들
  rationale: 이스라엘이 에돔을 대하는 태도의 근거가 혈연적 관계에 있음을 본문이 강조하므로, 이를 완화하지 않고 ‘형제들’로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, preserve source intent
