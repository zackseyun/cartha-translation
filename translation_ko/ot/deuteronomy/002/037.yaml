  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
  footnotes:
  - marker: a
    text: Or 'the land of the Ammonites.' Literally, 'the land of the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'all the hand of the Wadi Jabbok,' an idiom referring to the side, bank, or region along the Jabbok.
    reason: cultural_note
  - marker: c
    text: Or 'and everything that the LORD our God had commanded,' with the object left implicit in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 여러분은 암몬 자손의 땅에는 가까이 가지 않았습니다. 곧 야복 골짜기 가장자리와 산지의 성읍들, 그리고 야훼 우리 하나님께서 명령하신 모든 것에는 가까이 가지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘암몬 자손의 땅’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야복 강의 손/가장자리’라는 관용구로, 강둑이나 강변 지역을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 목적어를 생략한 채 ‘그리고 야훼 우리 하나님께서 명령하신 모든 것’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 앞선 정복 요약에 대한 예외를 표시하는 말로, 한국어에서는 문맥상 자연스럽고 간결한 ‘다만’이 ‘Only’의 예외 뉘앙스를 잘 살립니다.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  english_pob_choice: the land of the sons of Ammon
  chosen_korean: 암몬 자손의 땅
  alternatives_korean:
  - 암몬 사람들의 땅
  - 암몬 족속의 땅
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 너무 낯설게 유지하기보다, 원문의 친족/족속 표현을 살린 ‘암몬 자손의 땅’이 source-directed이면서도 자연스럽습니다.
- source_word: כָּל יַד נַחַל יַבֹּק
  english_pob_choice: all along the bank of the Jabbok
  chosen_korean: 야복 골짜기 가장자리
  alternatives_korean:
  - 야복 강둑 전체
  - 야복 와디의 모든 옆면
  lexicon: HALOT
  rationale: ‘손/가장자리’ 관용구를 한국어로 그대로 옮기면 어색하므로, 물줄기 옆 지역을 가리키는 뜻을 살려 ‘골짜기 가장자리’로 풀었습니다.
- source_word: וְעָרֵי הָהָר
  english_pob_choice: and the cities of the hill country
  chosen_korean: 산지의 성읍들
  alternatives_korean:
  - 산지의 도시들
  - 산악 지역의 성읍들
  lexicon: HALOT
  rationale: הָהָר는 여기서 단일 산이 아니라 고지대/산지로 이해하는 것이 타당하므로 ‘산지’로 옮겼고, עָרֵי는 문맥상 ‘성읍들’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 도구 지침의 기본값에 따라 여호와 대신 신명기 본문의 고유명사로서 ‘야훼’를 사용해 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 일반 호칭이 아니라 언약의 고유명사를 사용하므로, ‘주’로 치환하지 않고 이름 자체를 드러내는 ‘야훼’로 번역합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
