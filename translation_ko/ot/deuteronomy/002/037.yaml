    rationale: נחל은 계절성 수로/와디 또는 시내를 가리킬 수 있고, יַד는 그 곁·강변·주변 지역이라는 관용 표현입니다. ‘야복 시내의 모든 강변’이 본문의 공간적 의미를 더 직접적으로 전달합니다.
