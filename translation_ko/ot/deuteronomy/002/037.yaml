base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
  footnotes:
  - marker: a
    text: Or 'the land of the Ammonites.' Literally, 'the land of the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'all the hand of the Wadi Jabbok,' an idiom referring to the side, bank, or region along the Jabbok.
    reason: cultural_note
  - marker: c
    text: Or 'and everything that the LORD our God had commanded,' with the object left implicit in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 여러분은 암몬 자손의 땅[a], 곧 야복 시내의 모든 강변[b]과 산지의 성읍들, 그리고 야훼 우리 하나님께서 명령하신 모든 곳[c]에는 가까이 가지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘암몬 자손의 땅’입니다. ‘암몬 사람들의 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야복 시내의 모든 손’입니다. 이는 야복 시내의 곁, 강변, 또는 주변 지역을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 목적어를 생략한 채 문자적으로 ‘야훼 우리 하나님께서 명령하신 모든 것’이라고 합니다. 문맥상 접근하지 말라고 명령하신 곳들을 가리킵니다.
    reason: lexical_alternative
