base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
  footnotes:
  - marker: a
    text: Or 'who dwell in Seir.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from before them,' a Hebrew idiom meaning he removed the Horites from their presence/territory.
    reason: lexical_alternative
  - marker: c
    text: Or 'they took possession of them'; the sense is that the descendants of Esau dispossessed the Horites and occupied their land.
    reason: lexical_alternative
translation:
  language: ko
  text: 곧 에서의 자손으로서 세일에 거주하는 사람들에게 행하신 것과 같이, 곧 그분이 그들 앞에서 호리 족속을 멸하셨으므로 그들이 그들을 차지하여 그 자리에 살게 하신 것과 같이, 오늘에 이르기까지 그러하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세일에 거하는’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 앞에서’, 곧 호리 족속을 그들의 존재 영역에서 제거하셨다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 차지하였다’; 뜻은 에서의 자손이 호리 족속을 몰아내고 그 땅을 차지했다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  english_pob_choice: just as he did
  chosen_korean: …행하신 것과 같이
  alternatives_korean:
  - …하신 것처럼
  - …행하셨듯이
  lexicon: HALOT
  rationale: 비교 구조를 자연스러운 현대 한국어로 옮기되, 바로 앞 문맥의 하나님의 행위를 이어 받는다는 점을 유지했습니다.
- source_word: לִבְנֵי עֵשָׂו הַיֹּשְׁבִים בְּשֵׂעִיר
  english_pob_choice: for the sons of Esau who live in Seir
  chosen_korean: 에서의 자손으로서 세일에 거주하는 사람들
  alternatives_korean:
  - 세일에 사는 에서의 자손
  - 세일에 거주하는 에서의 아들들
  lexicon: HALOT
  rationale: ‘sons of Esau’를 혈통적·민족적 표현으로 살리면서, ‘거주하는’으로 지리적 수식을 반영했습니다.
- source_word: מִפְּנֵיהֶם
  english_pob_choice: from before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에서부터
  - 그들 면전에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 다소 어색하므로, 추방·제거의 의미가 드러나는 한국어 관용으로 옮겼습니다.
- source_word: וַיִּירָשֻׁם
  english_pob_choice: they dispossessed them
  chosen_korean: 그들이 그들을 차지하여
  alternatives_korean:
  - 그들을 빼앗아
  - 그들의 땅을 차지하여
  lexicon: HALOT
  rationale: ירשׁ의 정복 문맥 의미를 살리되, 단순 점유보다 이전 거주자를 몰아내고 차지하는 뜻이 드러나게 했습니다.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  english_pob_choice: and settled in their place
  chosen_korean: 그 자리에 살게 하신 것과 같이
  alternatives_korean:
  - 그 자리에 정착하게 하신 것과 같이
  - 그들을 대신하여 거주하게 하신 것과 같이
  lexicon: HALOT
  rationale: ‘settled in their place’의 결과를 자연스럽게 전달하면서, 문맥상 주어는 여전히 하나님이라는 점을 앞부분과 연결해 반영했습니다.
theological_decisions:
- issue: 동사의 주어를 명시적으로 드러낼지 여부
  chosen_reading: 본문의 3인칭 남성 단수 동사는 문맥상 하나님을 가리키므로, 한국어에서도 ‘행하신’, ‘멸하셨으므로’, ‘하신’으로 이어 하나님을 분명히 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 채 수동적으로 옮기는 방식
  - 문맥상의 주어를 덜 드러내는 번역
  rationale: 앞절들 및 POB 영어 본문과 같은 맥락에서, 이 행위가 하나님의 섭리적 행동임을 분명히 하는 것이 본문의 의미를 더 잘 보존합니다.
  doctrine_reference: 신적 섭리와 언약적 역사 인식
