  terminology: ‘에서의 자손’, ‘세일’, ‘호리 족속’은 적절합니다. ירשׁ는 이 문맥에서 이전 거주민을 내쫓고 그 자리를 점유한다는 뜻이므로 ‘몰아내고’로 옮기고, 각주에서 가능한 직역적 대안을 보존했습니다.
