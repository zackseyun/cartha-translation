  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
  footnotes:
  - marker: a
    text: Literally, 'before you.' The phrase means that the LORD is placing Sihon and his land into Israel's power.
    reason: lexical_alternative
  - marker: b
    text: Or 'Begin to possess, to take possession of his land.' The Hebrew repeats the same verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내게 말씀하셨습니다. 「보십시오, 내가 이미 시혼과 그의 땅을 너에게 넘겨 주기 시작했습니다. 일어나 그의 땅을 차지하기 시작하십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너 앞에’입니다. 여기서는 시혼과 그의 땅을 이스라엘의 지배 아래 넘겨 두신다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 같은 동사가 반복되어 강조를 이룹니다. 따라서 ‘차지하다’와 ‘차지하기 시작하다’로 옮겨 그 반복 효과를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와 신칭이 아니라 여호와의 고유 이름을 직접 사용하므로, 한국어 본문도 관용적 대치어보다 음역인 ‘야훼’를 택했습니다.
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: HALOT
  rationale: מראה 계열 명령형의 주의 환기 기능을 살리되, 모세의 발화에 합쇼체를 맞추어 자연스럽게 옮겼습니다.
- source_word: הַחִלֹּתִי תֵּת לְפָנֶיךָ
  english_pob_choice: I have begun to give ... over to you
  chosen_korean: 내가 이미 ... 너에게 넘겨 주기 시작했습니다
  alternatives_korean:
  - 내가 ... 너 앞에 두기 시작했습니다
  - 내가 ... 너에게 주기 시작했습니다
  lexicon: HALOT
  rationale: ‘내가 시작했다’와 ‘너에게 넘겨 주다’를 함께 살려, 전쟁 맥락에서 ‘내 앞에’의 관용적 뜻이 단순 위치가 아니라 소유권/지배권의 이전임을 분명히 했습니다.
- source_word: רָשׁ לָרֶשֶׁת אֶת אַרְצוֹ
  english_pob_choice: Begin to take possession of his land
  chosen_korean: 일어나 그의 땅을 차지하기 시작하십시오
  alternatives_korean:
  - 그의 땅을 차지하기 시작하십시오
  - 그의 땅을 점유하기 시작하십시오
  lexicon: HALOT
  rationale: 동일 어근의 반복이 강조를 이루므로 ‘차지하다/차지하기 시작하다’로 핵심을 살렸고, ‘일어나’는 행동 개시의 명령적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 여호와 신명 표기
  chosen_reading: 본문에서는 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, 본문에서 신적 호칭으로 대치하지 않고 고유 이름을 드러내는 것이 자료의 직독성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
