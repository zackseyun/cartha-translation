id: DEU.2.23
reference: Deuteronomy 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
  footnotes:
  - marker: a
    text: Or 'the Avvites.'
    reason: lexical_alternative
  - marker: b
    text: '''Settlements'' may also be rendered ''villages'' or ''encampments,'' referring to places of habitation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브빔[a]은 가사까지 이르는 마을들[b]에 살았는데, 갑도르에서 나온 갑도림이 그들을 멸하고 그들의 자리에 정착했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아빔’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 חֲצֵרִים은 ‘마을들’, ‘정착지들’, 또는 ‘촌락들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  english_pob_choice: the Avvim
  chosen_korean: 아브빔
  alternatives_korean:
  - 아빔
  - 아브빗 사람들
  lexicon: HALOT
  rationale: 민족명으로 보고 음역했습니다. 영어 POB의 ‘Avvim’을 따라 고유 집단명으로 유지하는 것이 원문 의도를 가장 잘 드러냅니다.
- source_word: הַיֹּשְׁבִים בַּחֲצֵרִים
  english_pob_choice: who lived in villages
  chosen_korean: 마을들에 살았는데
  alternatives_korean:
  - 마을에 거주했는데
  - 정착지들에 살았는데
  - 촌락들에 살았는데
  lexicon: HALOT
  rationale: חֲצֵרִים은 단순한 ‘마을’보다 넓게 촌락·거주지를 가리킬 수 있지만, 현대 한국어에서 가장 자연스럽고 지나친 해석을 피하는 표현으로 ‘마을들’을 택했습니다.
- source_word: עַד עַזָּה
  english_pob_choice: as far as Gaza
  chosen_korean: 가사까지 이르는
  alternatives_korean:
  - 가사에 이르기까지의
  - 가사까지
  - 가사에 이르도록
  lexicon: HALOT
  rationale: 경계 표시인 עַד의 범위를 살려 ‘~까지 이르는’으로 옮겨, 지리적 한계를 분명히 했습니다.
- source_word: כַּפְתֹּרִים ... מִכַּפְתּוֹר
  english_pob_choice: the Caphtorim ... who came out from Caphtor
  chosen_korean: 갑도림이 ... 갑도르에서 나온
  alternatives_korean:
  - 갑도르 사람들
  - 갑도르에서 나온 사람들
  lexicon: HALOT
  rationale: 집단명은 음역으로 유지하고, יצא의 이동 이미지는 ‘나온’으로 살렸습니다. ‘갑도르’도 동일하게 음역해 원문 지명을 보존했습니다.
- source_word: הִשְׁמִידֻם
  english_pob_choice: destroyed them
  chosen_korean: 그들을 멸하고
  alternatives_korean:
  - 그들을 멸망시키고
  - 그들을 진멸하고
  - 그들을 파멸시키고
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 담되, 문맥상 과도한 해석어를 피하기 위해 ‘멸하다’를 택했습니다.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  english_pob_choice: and settled in their place
  chosen_korean: 그들의 자리에 정착했습니다
  alternatives_korean:
  - 그들의 자리에 살게 되었습니다
  - 그들 대신 거주했습니다
  - 그들의 자리에 살았습니다
  lexicon: HALOT
  rationale: תַחְתָּם의 대체·점거 의미를 살려 ‘그들의 자리에’로 옮겼고, 지속적 거주를 드러내기 위해 ‘정착했습니다’를 선택했습니다.
theological_decisions:
- issue: 민족 이동과 정복 서술의 강도
  chosen_reading: 본절의 ‘멸하고’는 역사 서술로서의 강한 파괴를 그대로 보존했습니다.
  alternative_readings:
  - 완곡하게 ‘없애고’로 낮추기
  - ‘진멸하고’로 더 강하게 올리기
  rationale: 원문 שׁמד의 파괴 강도를 흐리지 않되, 본문이 서술하는 역사적 사실성을 해치지 않도록 중간 강도의 표현을 택했습니다.
  doctrine_reference: 성경 본문의 역사 서술과 어휘 강도 보존
- issue: 집단명 음역 유지
  chosen_reading: 아브빔, 갑도림, 갑도르를 음역으로 유지했습니다.
  alternative_readings:
  - 의미 번역으로 풀기
  - 전통적 교회식 고유명 표기 사용
  rationale: 이 절은 고유 집단명과 지명을 나열하는 본문이므로, 번역적 풀이보다 음역이 원문 식별성과 주석 가능성을 더 잘 보존합니다.
  doctrine_reference: 고유명사 보존 원칙
