review_pass:
  verdict: revise
  source_fidelity: 원문의 민족명 עַוִּים, כַּפְתֹּרִים와 지명 כַּפְתּוֹר, 그리고 ‘가사까지’, ‘멸하고’, ‘그들의 자리에’라는 핵심 관계를 모두 보존해야 합니다. 다만 초안의 ‘아브빔/갑도림/갑도르’는 표준 한국어 성경 용례 및 히브리어 자음 음역 관행과 다소 거리가 있습니다. 널리 정착한 ‘아위 사람들’, ‘갑돌 사람들’, ‘갑돌’이 식별성과 자연스러움을 함께 확보합니다.
  naturalness: ‘아위 사람들은 가사까지 이르는 마을들에 살고 있었는데’는 원문의 배경 제시를 현대 한국어 합쇼체 문장으로 자연스럽게 연결합니다. ‘그들의 자리에 정착했습니다’도 가능하지만, ‘그들의 자리에 살았습니다’가 וַיֵּשְׁבוּ의 기본 뜻을 더 직접적으로 보존하면서 자연스럽습니다.
  terminology: 민족명과 지명은 한국어 성경에서 통용되는 ‘아위 사람들’, ‘갑돌 사람들’, ‘갑돌’로 통일했습니다. חֲצֵרִים은 성벽 없는 촌락·거주지를 포함할 수 있으므로 본문에서는 ‘마을들’을 유지하고 각주에서 범위를 밝혔습니다.
  issues:
  - severity: medium
    issue: 고유명사 표기가 ‘아브빔/갑도림/갑도르’로 되어 있습니다.
    rationale: 이 표기들은 표준 한국어 성경의 통용 표기인 ‘아위 사람들/갑돌 사람들/갑돌’과 달라 독자의 식별을 어렵게 할 수 있습니다. 특히 עַוִּים의 통상 음역은 ‘아위’ 계열이며, כַּפְתּוֹר는 ‘갑돌’로 널리 정착해 있습니다.
  - severity: low
    issue: ‘정착했습니다’는 וַיֵּשְׁבוּ보다 다소 구체적인 뉘앙스를 더합니다.
    rationale: 문맥상 대체 점거의 의미는 תַחְתָּם으로 충분히 전달됩니다. ‘살았습니다’는 ישב의 기본 의미를 직접 보존합니다.
  revised_text: 아위 사람들은 가사까지 이르는 마을들에 살고 있었는데, 갑돌에서 나온 갑돌 사람들이 그들을 멸하고 그들의 자리에 살았습니다.
  revised_footnotes:
