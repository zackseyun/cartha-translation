    reason: alternative_reading
  - marker: b
    text: 히브리어 חֲצֵרִים은 ‘마을들’ 외에 ‘촌락들’ 또는 ‘정착지들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 의미 관계와 파괴 동사의 강도는 유지하되, 고유명사를 표준 한국어 성경 용례에 맞추어 바로잡았습니다. 또한 ישב의 기본 의미를 살려 ‘정착했습니다’를 ‘살았습니다’로 조정했습니다. 영어 감사 기록의 b 각주는 본문상 정착지 어휘에 관한 설명이지만 앵커가 Caphtor에 붙어 있는 구조상 오류가 있으나, 한국어 각주는 해당 어휘에 적절하게 연결했습니다.
