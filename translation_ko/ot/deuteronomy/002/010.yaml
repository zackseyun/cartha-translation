    reason: lexical_alternative
translation:
  language: ko
  text: 에밈이 전에 그곳에 살고 있었는데, 그들은 아낙 사람들처럼 크고 수가 많고 키가 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전에’는 여기서 장소적 ‘앞서’가 아니라 시간적으로 ‘이전에/옛적에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵמִים
  english_pob_choice: The Emim
  chosen_korean: 에밈
  alternatives_korean:
  - 에미 사람들
  - 에밈 족속
  lexicon: HALOT
  rationale: 고유한 민족명으로 보고 음역하는 것이 원문의 종족명을 가장 직접적으로 드러냅니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 전에
  alternatives_korean:
  - 옛적에
  - 옛날에
  - 이전에는
  lexicon: HALOT
  rationale: 여기서는 시간 부사로 쓰였으므로, 장소적 ‘앞서’가 아니라 ‘전에/이전에’의 뜻을 자연스럽게 살렸습니다.
- source_word: יָשְׁבוּ בָהּ
  english_pob_choice: lived there
  chosen_korean: 그곳에 살고 있었는데
  alternatives_korean:
  - 그곳에 살았습니다
  - 그곳에 거주했습니다
  - 그 땅에 거했습니다
  lexicon: HALOT
  rationale: ישׁב의 거주 의미를 살리되 현대 한국어로는 ‘살다’가 가장 자연스럽고, 바 성별 지시대명사는 ‘그곳’으로 풀어 옮겼습니다.
- source_word: כָּעֲנָקִים
  english_pob_choice: as the Anakim
  chosen_korean: 아낙 사람들처럼
  alternatives_korean:
  - 아낙 사람들 같이
  - 아낙인들처럼
  - 아낙 족속처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 한국어의 ‘처럼’으로 옮겨, 다음 형용사 열거가 외형 비교임을 분명히 했습니다.
theological_decisions:
- issue: 세 가지 형용사(גדול, רב, רם)의 순차적 강조
  chosen_reading: 크고 수가 많고 키가 컸습니다
  alternative_readings:
  - 크고 많고 높았습니다
  - 거대하고 많으며 높았습니다
  rationale: 본문의 연속된 형용사들을 각각 살려 민족의 규모와 신체적 위압감을 함께 드러내도록 했습니다.
  doctrine_reference: 본문 직역·의미 보존 원칙
- issue: 아낙ים의 한국어 표기
  chosen_reading: 아낙 사람들
  alternative_readings:
  - 아낙인들
  - 아낙 족속
  rationale: 한국어 성경에서 널리 알려진 이름을 유지하되, 문맥상 민족 집단임을 드러내기 위해 ‘사람들’을 붙였습니다.
  doctrine_reference: 고유명사 표기 일관성
