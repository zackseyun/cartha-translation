  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
  footnotes:
  - marker: a
    text: Or 'to meet us'; in this context the phrase implies a hostile encounter.
    reason: lexical_alternative
  - marker: b
    text: Jahaz is also rendered 'Jahzah' in some English traditions.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 시혼이 우리를 만나려고[a] 자기와 그의 모든 백성을 이끌고 싸움하러 야하스에 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '우리를 만나려고'이지만, 여기서는 전투 상황이므로 적대적 만남의 뜻이 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: came out
  chosen_korean: 나왔습니다
  alternatives_korean:
  - 나갔습니다
  - 출정했습니다
  lexicon: HALOT
  rationale: 서사 동사 יצא의 기본 의미를 살리되, 전투 문맥에서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לִקְרָאתֵנוּ
  english_pob_choice: to meet us
  chosen_korean: 우리를 만나려고
  alternatives_korean:
  - 우리를 맞서려고
  - 우리에게 대항하려고
  lexicon: HALOT
  rationale: 직역은 '우리를 맞이하러'에 가깝지만, 이어지는 '싸움하러'와 함께 적대적 만남임을 드러내면서도 원문의 표현을 과도하게 확장하지 않기 위해 이처럼 옮겼습니다.
- source_word: עַמּוֹ
  english_pob_choice: all his people
  chosen_korean: 그의 모든 백성
  alternatives_korean:
  - 그의 모든 사람들
  - 그의 군대
  lexicon: HALOT
  rationale: עם의 기본 의미인 '백성'을 유지하여, 전투 맥락을 이유로 '군대'로 좁히지 않았습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 싸움하러
  alternatives_korean:
  - 전투하려고
  - 전쟁하러
  lexicon: HALOT
  rationale: 목적을 나타내는 전치사구로서, 한국어에서는 동사형 목적 표현이 가장 자연스럽고 본문의 군사적 의미도 충분히 전달합니다.
theological_decisions:
- issue: לִקְרָאתֵנוּ의 적대적 뉘앙스
  chosen_reading: 직접적 적대 표현을 과도하게 번역하지 않고, 문맥과 다음 절의 '싸움하러'를 통해 적대성을 드러냈습니다.
  alternative_readings:
  - 우리를 맞서려고
  - 우리를 공격하려고
  rationale: 히브리어는 문자적으로 '우리에게 만나러'이지만, 전쟁 서사에서는 적대적 조우를 뜻할 수 있습니다. 본문 구조를 유지하면서 의미는 문맥으로 보강하는 것이 가장 절제된 처리입니다.
  doctrine_reference: 본문 문맥에 따른 서사적 의미 전달
- issue: 시혼과 그의 백성의 집단적 등장
  chosen_reading: '''자기와 그의 모든 백성을 이끌고''로 독립 인칭 ''그''의 강조를 살렸습니다.'
  alternative_readings:
  - 그와 그의 모든 백성이
  - 그 자신과 그의 모든 백성이
  rationale: 히브리어의 독립 대명사는 주어 시혼의 직접적 가시성을 더합니다. 한국어에서는 과도한 중복 없이 강조를 살리는 방식이 적절합니다.
  doctrine_reference: 히브리어 서사체의 강조법
