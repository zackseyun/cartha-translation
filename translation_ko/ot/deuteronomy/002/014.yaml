  rationale: 문장을 세 문장으로 나누어 히브리어의 시간 범위와 그 기간에 일어난 세대의 소멸을 명확히 했습니다. ‘전쟁의 사람들’을 자연스러운 한국어인 ‘전쟁에 나갈 사람들’로 고치고, 세대 전체가 진영에서 다 없어졌다는 원문의 완료 의미를 보존했습니다. 와디에 관한 각주 표지는 해당 지명에 연결되는 기존 위치를 유지했습니다.
  reviewer_model: gpt-5.6-terra
