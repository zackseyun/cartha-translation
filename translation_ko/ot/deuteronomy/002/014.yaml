- from: 우리가 가데스-바르네아에서 떠나 세렛 와디를 건널 때까지의 기간은 삼십팔 년이었습니다[a]. 곧 그 세대의 전부, 전쟁의 사람들은 진영 한가운데에서 사라져 갔으니, 야훼께서 그들에게 맹세하신 그대로였습니다.
