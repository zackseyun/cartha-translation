source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
  footnotes:
  - marker: a
    text: Or 'the brook Zered.' The Hebrew term can denote a wadi, streambed, or brook; 'Wadi Zered' reflects the regional geography more precisely.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 가데스-바르네아에서 출발하여 세렛 와디를 건너기까지 걸린 기간은 삼십팔 년이었습니다[a]. 전쟁에 나갈 사람들로 이루어진 그 세대 전체가 진영 가운데서 다 없어질 때까지였습니다. 이는 야훼께서 그들에게 맹세하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세렛 시내’. 히브리어 נַחַל은 와디, 물길, 시내를 가리킬 수 있으며, ‘세렛 와디’가 그 지역의 지리적 특성을 더 정확히 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  english_pob_choice: And the time
  chosen_korean: 기간
  alternatives_korean:
  - 날들
  - 때
  lexicon: HALOT
  rationale: 여기서는 문자적 ‘날들’보다 여행의 지속 시간을 가리키는 문맥이 핵심이므로, 한국어로는 자연스럽고 의미를 살리는 ‘기간’이 적절합니다.
- source_word: עָבַרְנוּ אֶת נַחַל זֶרֶד
  english_pob_choice: we crossed the Wadi Zered
  chosen_korean: 세렛 와디를 건널 때까지
  alternatives_korean:
  - 세렛 시내를 건널 때까지
  - 세렛 골짜기를 지나기까지
  lexicon: HALOT
  rationale: נחל은 이 지역 문맥에서 계절하천/와디를 뜻하므로 ‘와디’를 유지해 지리적 정확성을 살리고, עבר는 물길을 ‘건너다’로 옮기는 것이 가장 직접적입니다.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  english_pob_choice: thirty-eight years
  chosen_korean: 삼십팔 년
  alternatives_korean:
  - 서른여덟 해
  - 38년
  lexicon: HALOT
  rationale: 히브리어 수사구를 표준적인 현대 한국어로 옮겨, 의미를 분명히 하면서도 성경 본문체를 유지했습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 전쟁의 사람들
  alternatives_korean:
  - 전쟁하는 사람들
  - 전사들
  lexicon: HALOT
  rationale: 직역상 ‘전쟁의 사람들’이 가장 가깝지만, 한국어에서는 관용성이 낮으므로 본문에서는 의미를 드러내되 지나치게 군사적 용어로 굳히지 않는 표현을 택했습니다.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  english_pob_choice: from the midst of the camp
  chosen_korean: 진영 한가운데에서
  alternatives_korean:
  - 진영 가운데서
  - 진영 한복판에서
  lexicon: HALOT
  rationale: ‘midst’의 공간적 중심성을 살려 ‘한가운데’로 옮겼으며, ‘진영’은 공동체가 머무는 집단적 장소를 자연스럽게 전달합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 여호와/주님이 아니라 표준화된 음역인 ‘야훼’로 옮겨, 언약 이름 자체를 본문에서 드러내는 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 서술 시점과 맹세의 관계
  chosen_reading: ‘맹세하신 그대로였습니다’
  alternative_readings:
  - ‘맹세하신 대로였습니다’
  - ‘맹세하신 바와 같았습니다’
  rationale: 본문의 כַּאֲשֶׁר נִשְׁבַּע는 단순한 예언이 아니라 이미 한 맹세의 성취를 말하므로, 결과의 확정을 분명히 하는 과거완료적 의미를 살렸습니다.
  doctrine_reference: 서사 문맥의 약속-성취 구조
