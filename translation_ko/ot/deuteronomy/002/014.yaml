  source_fidelity: 초안은 삼십팔 년, 세렛 와디, 야훼의 맹세라는 핵심 요소를 보존합니다. 그러나 אַנְשֵׁי הַמִּלְחָמָה를 옮긴 ‘전쟁의 사람들’은 한국어에서 부자연스럽고 의미가 불명확합니다. 또한 ‘그 세대의 전부, 전쟁의 사람들은’은 히브리어의 ‘전쟁에 나갈 사람들의 온 세대’라는 결속을 적절히 나타내지 못합니다. תֹּם의 완료 의미는 ‘다 없어지다’로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘떠나 … 건널 때까지의 기간’과 ‘사라져 갔으니’는 이해 가능하나 다소 어색하거나 문어적으로 부정확합니다. ‘출발하여 … 건너기까지 걸린 기간’ 및 ‘다 없어질 때까지’가 현대 표준어 합쇼체 본문으로 더 자연스럽습니다.
  terminology: ‘야훼’, ‘가데스-바르네아’, ‘세렛 와디’, ‘진영’은 유지할 수 있습니다. ‘전쟁에 나갈 사람들’은 원문의 남성 복수 군사 대상자를 문맥상 자연스럽게 전달하며, 성별을 중화하거나 특정 군사 계급으로 과도하게 좁히지 않습니다.
  issues:
