  text: 우리 하나님 야훼께서 그를 우리에게 넘겨주셨습니다[a]. 우리는 그를 그의 아들들과 그의 모든 백성과 함께 쳐 쓰러뜨렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 앞에’입니다. 여기서는 전쟁 문맥에서 적을 이스라엘의 권세 아래 넘겨주셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 자음 본문은 ‘그의 아들’이라고 읽히지만, 전통 독법과 문맥에 따라 ‘그의 아들들’로 이해됩니다.
    reason: alternative_reading
