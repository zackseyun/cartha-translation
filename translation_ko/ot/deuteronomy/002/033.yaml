  lexicon: WLC / POB glossary
  rationale: יהוה는 POB 기본 원칙에 따라 고유명사인 ‘야훼’로 옮기고, אֱלֹהֵינוּ는 직접 소유를 살려 ‘우리 하나님’으로 표현했습니다.
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  english_pob_choice: gave him over to us
  chosen_korean: 그를 우리 앞에 넘겨주셨습니다
  alternatives_korean:
  - 그를 우리에게 주셨습니다
  - 그를 우리 손에 넘겨주셨습니다
  lexicon: HALOT
  rationale: נתן과 לְפָנֵינוּ의 전쟁 문맥은 단순한 ‘주다’보다 패배한 적을 지배 아래 넘겨주는 뜻이므로, 이를 드러내는 ‘넘겨주셨습니다’를 택했습니다.
- source_word: וַנַּךְ
  english_pob_choice: we struck him down
  chosen_korean: 우리는 ... 쳐서 쓰러뜨렸습니다
  alternatives_korean:
  - 우리는 그를 쳤습니다
  - 우리는 그를 쳐부수었습니다
  lexicon: HALOT
  rationale: נכה는 군사 서술에서 결정적인 타격과 패배를 뜻하므로, 단순한 ‘쳤습니다’보다 결과를 드러내는 ‘쳐서 쓰러뜨렸습니다’가 더 가깝습니다.
- source_word: בנו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 아들
  - 그의 아들들과
  lexicon: HALOT
  rationale: 자음 본문은 단수로도 읽힐 수 있지만, 문맥상 집합적 복수가 더 자연스러워 POB의 영어 본문처럼 복수 의미를 반영했습니다.
theological_decisions:
- issue: 야훼의 전쟁 주권 표현
  chosen_reading: 야훼께서 적을 이스라엘의 승리 아래 넘겨주신 것으로 표현했습니다.
  alternative_readings:
  - 하나님께서 그냥 도우셨다고 완화해 표현하기
  - 우연한 군사적 성공으로만 표현하기
  rationale: 본문은 전투의 승리를 야훼의 직접적인 행위로 진술하므로, 그 주권적 개입을 약화하지 않고 살렸습니다.
  doctrine_reference: Deuteronomy 2:33 narrative theology
