  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
  footnotes:
  - marker: a
    text: Hebrew literally, 'before us'; the phrase means that the LORD handed him over into Israel's power.
    reason: lexical_alternative
  - marker: b
    text: Hebrew reads 'his son' in the consonantal text; many understand it collectively as 'his sons' in this context.
    reason: alternative_reading
translation:
