  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
  footnotes:
  - marker: a
    text: Hebrew literally, 'before us'; the phrase means that the LORD handed him over into Israel's power.
    reason: lexical_alternative
  - marker: b
    text: Hebrew reads 'his son' in the consonantal text; many understand it collectively as 'his sons' in this context.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼 우리 하나님께서 그를 우리 앞에 넘겨주셨습니다[a]. 그래서 우리는 그와 그의 아들들, 그리고 그의 모든 백성을 쳐서 쓰러뜨렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 앞에’입니다. 여기서는 전쟁 문맥에서 적을 이스라엘의 권세 아래 넘겨주셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 자음 본문은 ‘그의 아들’로도 읽힐 수 있으나, 여기서는 집합적으로 ‘그의 아들들’로 이해하는 경우가 많습니다.
    reason: alternative_reading
