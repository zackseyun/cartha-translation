translation:
  language: ko
  text: 당신은 오늘 모압의 경계인 아르를 지나가고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘 아르에 있는 모압의 경계를 지나가고 있습니다.’ 히브리어는 ‘아르’ 앞에 목적격 표지를 한 번 더 반복합니다. 이를 아르가 모압의 경계와 동격 관계에 있음을 나타내는 표현으로, 또는 아르에 있는 경계를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה / עֹבֵר
  english_pob_choice: You are crossing
  chosen_korean: 당신은 ... 지나가고 있습니다
  alternatives_korean:
  - 당신은 ... 건너고 있습니다
  - 당신은 ... 통과하고 있습니다
  - 당신은 ... 지나가려 하고 있습니다
  lexicon: HALOT
  rationale: 주어 ‘אַתָּה’의 직접 호칭을 살리면서, 분사형의 현재 진행감을 한국어 현재진행형으로 자연스럽게 옮겼습니다. ‘지나가다’가 경계/영역을 통과하는 상황을 가장 무리 없이 드러냅니다.
- source_word: הַיּוֹם
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  - 이날에
  lexicon: HALOT
  rationale: 시간 부사로서의 ‘오늘’을 간결하고 현대적인 표준어로 옮겼습니다.
- source_word: גְּבוּל מוֹאָב
  english_pob_choice: the border of Moab
  chosen_korean: 모압의 경계
  alternatives_korean:
  - 모압의 국경
  - 모압의 변경
  lexicon: HALOT
  rationale: 지리적 경계선을 뜻하는 ‘גְּבוּל’은 문맥상 ‘경계’가 가장 자연스럽고, ‘모압의’는 속격 관계를 분명히 합니다.
- source_word: עָר
  english_pob_choice: Ar
  chosen_korean: 아르
  alternatives_korean:
  - 아르 성
  - 아르
  lexicon: HALOT
  rationale: 고유 지명은 현대 외래어 표기법에 따라 음역했습니다.
- source_word: אֶת ... אֶת
  english_pob_choice: the border of Moab at Ar / namely Ar
  chosen_korean: 곧 아르
  alternatives_korean:
  - 아르에서
  - 곧 아르에서
  - 즉 아르
  lexicon: HALOT
  rationale: 반복된 목적격 표지가 첫 구절을 보완 설명하는 구조로 읽히므로, 한국어에서는 ‘곧’으로 apposition을 드러내어 ‘모압의 경계, 곧 아르’라는 설명 관계를 살렸습니다.
theological_decisions:
- issue: 이스라엘에 대한 단수 호칭
  chosen_reading: 단수 ‘당신’으로 유지했습니다.
  alternative_readings:
  - 여러분은 오늘...
  - 너희는 오늘...
  rationale: 히브리어 단수는 이스라엘 공동체 전체를 대표하는 수사이므로, 한국어에서도 설명을 덧붙이지 않고 단수 호칭으로 유지해 원문의 직접성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
