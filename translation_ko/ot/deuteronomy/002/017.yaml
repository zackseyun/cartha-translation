lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 … 말씀하시기를
  alternatives_korean:
  - 그리고 … 말씀하셨습니다
  - … 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서술 전개를 자연스러운 한국어의 시간 연결로 옮기되, דבר의 직접 발화 성격을 살려 ‘말씀하시다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 제목적 호칭이 아닌 하나님의 이름으로 보존하기 위해 음역 ‘야훼’를 사용했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 나와 함께
  lexicon: HALOT
  rationale: אֶל + 1인칭 접미사의 방향성 있는 직접 수신을 한국어의 자연스러운 여격 ‘내게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 말하여
  - 이르시기를
  lexicon: HALOT
  rationale: 직접 인용을 여는 관용구를 한국어 성경체에서 자연스럽고 격식 있게 연결하는 표현으로 처리했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה 표기
  chosen_reading: ‘야훼’로 본문에 직접 표기합니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: POB의 원칙에 따라 טetragrammaton을 대체 호칭이 아니라 본문에서 식별 가능한 신명으로 보존해, 이스라엘과 맺은 언약적 이름성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접화법 도입문의 한국어 형식
  chosen_reading: ‘말씀하시기를’로 공손하고 서술적인 인용 도입을 유지합니다.
  alternative_readings:
  - ‘말하여’
  - ‘이르시며’
  rationale: 히브리어 לֵאמֹר의 문법적 역할은 내용 진술의 도입이므로, 과도한 해석 없이 직접 발화를 예고하는 형식으로 옮겼습니다.
  doctrine_reference: '번역 원칙: source-direct, auditable discourse framing'
