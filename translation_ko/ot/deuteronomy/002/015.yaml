  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
  footnotes:
  - marker: a
    text: Or 'to discomfit them' or 'to rout them'; the Hebrew verb can denote causing panic or confusion as an act of divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'until they came to an end' or 'until they perished.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뿐만 아니라 야훼의 손도 그들을 대적하여, 진영 한가운데에서 그들을 혼란에 빠뜨려 그들이 다 없어질 때까지 이르게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘혼란에 빠뜨리다’는 ‘공포에 몰아넣다’ 또는 ‘패주시키다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 끝에 이를 때까지’ 또는 ‘그들이 멸망하기까지’로 옮길 수 있습니다.
    reason: lexical_alternative
