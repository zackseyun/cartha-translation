theological_decisions:
- issue: 야훼의 손이 미치는 방식의 표현
  chosen_reading: 하나님의 손이 ‘그들 위에 있었다’는 단순 접촉보다, 심판적 능력이 그들을 향해 작동했다는 뜻으로 읽어 ‘야훼의 손이 그들에게 있어’로 옮겼습니다.
  alternative_readings:
  - 야훼의 손이 그들 위에 있었습니다
  - 야훼의 손이 그들을 쳤습니다
  rationale: 히브리어 전치사 בָם은 여기서 적대적·심판적 방향성을 띠므로, 평이한 존재 표현보다 문맥상 압박과 심판을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 심판과 섭리의 주권적 행위에 대한 구약 본문의 일반적 신학
- issue: 문장 내 종결의 정도
  chosen_reading: ‘완전히 끝나기까지’로 옮겨, 본문이 말하는 집단의 종결을 드러내되 멸절의 구체적 양상을 과도하게 상상하지 않도록 했습니다.
  alternative_readings:
  - 완전히 멸망하기까지
  - 완전히 죽기까지
  - 완전히 사라지기까지
  rationale: עַד תֻּמָּם은 결과의 완결을 가리키지만, 한국어에서 이를 지나치게 세분하면 원문의 간결성을 해칠 수 있어 절제된 완료 표현을 선택했습니다.
  doctrine_reference: 본문의 서술적 심판 언어에 대한 문맥 충실성
