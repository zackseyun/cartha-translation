id: DEU.2.15
reference: Deuteronomy 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
  footnotes:
  - marker: a
    text: Or 'to discomfit them' or 'to rout them'; the Hebrew verb can denote causing panic or confusion as an act of divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'until they came to an end' or 'until they perished.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뿐만 아니라 야훼의 손이 그들에게 있어, 진영 한가운데에서 그들을 혼란에 빠뜨려 그들이 완전히 끝나기까지 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 המם은 ‘혼란에 빠뜨리다, 공포에 몰아넣다, 패주시키다’까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 끝장나기까지’ ‘그들이 멸망하기까지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Moreover
  chosen_korean: 뿐만 아니라
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 앞 구절에 이어지는 추가·강조 기능을 살리되, 현대 한국어에서 자연스럽고 문맥 연결이 분명한 표현으로 옮겼습니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 여호와의 손
  - 야훼의 능력
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 하나님의 գործող하는 힘을 보존했습니다. 본문의 고유명사는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: לְהֻמָּם
  english_pob_choice: to throw them into confusion
  chosen_korean: 그들을 혼란에 빠뜨려
  alternatives_korean:
  - 그들을 혼란케 하여
  - 그들을 동요시키며
  - 그들을 패주시키려고
  lexicon: HALOT
  rationale: הם의 핵심 의미인 ‘혼란/공포를 일으키다’를 살리되, 곧바로 멸망 결과로 축소하지 않도록 한국어에서도 동작의 결과를 중립적으로 표현했습니다.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  english_pob_choice: from the midst of the camp
  chosen_korean: 진영 한가운데에서
  alternatives_korean:
  - 진영 가운데에서
  - 진영 한복판에서
  - 진중에서
  lexicon: HALOT
  rationale: ‘가운데/내부’라는 구체적 공간감을 유지하면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: עַד תֻּמָּם
  english_pob_choice: until they were finished off
  chosen_korean: 그들이 완전히 끝나기까지
  alternatives_korean:
  - 그들이 완전히 사라지기까지
  - 그들이 멸망하기까지
  - 그들이 소멸되기까지
  lexicon: HALOT
  rationale: 문맥상 집단이 심판 아래 종결되는 뜻을 살리되, 원문의 완료·종결 뉘앙스를 과도하게 해석하지 않도록 ‘끝나기까지’로 처리했습니다.
theological_decisions:
- issue: 야훼의 손이 미치는 방식의 표현
  chosen_reading: 하나님의 손이 ‘그들 위에 있었다’는 단순 접촉보다, 심판적 능력이 그들을 향해 작동했다는 뜻으로 읽어 ‘야훼의 손이 그들에게 있어’로 옮겼습니다.
  alternative_readings:
  - 야훼의 손이 그들 위에 있었습니다
  - 야훼의 손이 그들을 쳤습니다
  rationale: 히브리어 전치사 בָם은 여기서 적대적·심판적 방향성을 띠므로, 평이한 존재 표현보다 문맥상 압박과 심판을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 심판과 섭리의 주권적 행위에 대한 구약 본문의 일반적 신학
- issue: 문장 내 종결의 정도
  chosen_reading: ‘완전히 끝나기까지’로 옮겨, 본문이 말하는 집단의 종결을 드러내되 멸절의 구체적 양상을 과도하게 상상하지 않도록 했습니다.
  alternative_readings:
  - 완전히 멸망하기까지
  - 완전히 죽기까지
  - 완전히 사라지기까지
  rationale: עַד תֻּמָּם은 결과의 완결을 가리키지만, 한국어에서 이를 지나치게 세분하면 원문의 간결성을 해칠 수 있어 절제된 완료 표현을 선택했습니다.
  doctrine_reference: 본문의 서술적 심판 언어에 대한 문맥 충실성
