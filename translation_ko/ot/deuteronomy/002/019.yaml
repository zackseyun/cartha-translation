source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
  footnotes:
  - marker: a
    text: Or 'the Ammonites' throughout the verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not attack them' for 'do not harass them.' The Hebrew may broadly forbid hostile action, not only formal siege.
    reason: lexical_alternative
  - marker: c
    text: Or 'as an inheritance' for 'as a possession.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들이 암몬 자손 앞에 이르거든 그들을 괴롭히지 말고 그들과 다투지 마십시오. 내가 암몬 자손의 땅 가운데서 한 조각도 당신들에게 기업으로 주지 않을 것이니, 그것은 내가 이미 롯의 자손에게 기업으로 주었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암몬 자손’은 직역적 표현으로, 영어 POB의 ‘sons of Ammon’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다투지 마십시오’는 본문의 적대 행위를 포괄적으로 옮긴 것이며, 경우에 따라 ‘공격하지 마십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘기업’은 여기서 상속 재산보다 분배된 소유지/몫의 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ ... מוּל
  english_pob_choice: When you come opposite
  chosen_korean: 당신들이 ... 앞에 이르거든
  alternatives_korean:
  - 당신들이 ... 마주하거든
  - 당신들이 ... 대면하거든
  - 당신들이 ... 맞은편에 이르거든
  lexicon: HALOT
  rationale: קָרַב과 מוּל의 공간적·상황적 의미를 살려, 자연스러운 현대 한국어로 ‘앞에 이르거든’이라 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬의 아들들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 유지하되 한국어에서는 가장 자연스러운 성경식 표현인 ‘자손’으로 옮겼습니다.
- source_word: אַל תִּתְגָּר בָּם
  english_pob_choice: or provoke them
  chosen_korean: 그들과 다투지 마십시오
  alternatives_korean:
  - 그들을 자극하지 마십시오
  - 그들과 충돌하지 마십시오
  - 그들을 전쟁으로 몰지 마십시오
  lexicon: HALOT
  rationale: 히트파엘 동사의 호전적 의미를 살리되, 본문이 직접 ‘전쟁’이라고 말하지 않으므로 과도한 구체화는 피했습니다.
- source_word: יְרֻשָּׁה
  english_pob_choice: as a possession
  chosen_korean: 기업으로
  alternatives_korean:
  - 소유로
  - 소유지로
  - 상속으로
  lexicon: HALOT
  rationale: 이 문맥에서 יְרֻשָּׁה는 토지 분배의 언어이므로, 한국어 성경에서 자연스럽고 오해가 적은 ‘기업’으로 옮겼습니다.
- source_word: לִבְנֵי לוֹט נְתַתִּיהָ
  english_pob_choice: I have given it as a possession to the sons of Lot
  chosen_korean: 내가 이미 롯의 자손에게 기업으로 주었기 때문입니다
  alternatives_korean:
  - 내가 롯의 자손에게 이미 그것을 주었기 때문입니다
  - 내가 롯의 자손에게 그것을 기업으로 주었기 때문입니다
  - 내가 롯의 자손에게 그것을 상속으로 주었기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 확정된 부여를 ‘이미 ... 주었기 때문입니다’로 자연스럽게 나타냈고, ‘롯의 자손’으로 친족 구조를 유지했습니다.
theological_decisions:
- issue: 호전적 금지 표현의 강도
  chosen_reading: ‘그들과 다투지 마십시오’로 옮겨, 노골적 공격 금지보다 넓은 적대 행위 금지를 드러냈습니다.
  alternative_readings:
  - 그들을 공격하지 마십시오
  - 그들을 괴롭히지 마십시오
  - 그들과 싸우지 마십시오
  rationale: 히브리어는 특정 전술보다 적대적 충돌 전반을 금하는 표현이므로, 본문 범위를 과도하게 좁히거나 넓히지 않는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §6 (읽기 쉬운 현대어)
