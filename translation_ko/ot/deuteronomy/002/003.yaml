base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
  footnotes:
  - marker: a
    text: Or 'this mountain.' The Hebrew הַר can denote a mountain or a mountainous region; here the broader travel setting favors 'hill country.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 산지 주위를 도는 일이 너희에게는 충분합니다[a]. 북쪽으로 돌이키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 산.’ 히브리어 הַר는 산 자체를 뜻할 수도 있고, 여기서는 더 넓은 ‘산지’를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  english_pob_choice: You have gone ... long enough
  chosen_korean: 너희에게는 충분합니다
  alternatives_korean:
  - 그만하면 충분합니다
  - 이제 족합니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 양적 표현이 아니라 ‘이제 그만할 만큼 충분하다’는 종결의 뉘앙스를 가지므로, 한국어에서도 현재 상태의 지속 종료를 분명히 살렸습니다.
- source_word: סֹב אֶת הָהָר הַזֶּה
  english_pob_choice: gone around this hill country
  chosen_korean: 이 산지 주위를 도는 일
  alternatives_korean:
  - 이 산을 도는 일
  - 이 산지를 빙 둘러가는 일
  lexicon: HALOT
  rationale: הַר는 단일 산보다 여행 문맥에서 ‘산지/산악지대’를 가리킬 수 있어, 한국어도 지형 전체를 가리키는 ‘산지’로 옮겼습니다.
- source_word: פְּנוּ
  english_pob_choice: turn
  chosen_korean: 돌이키십시오
  alternatives_korean:
  - 돌아가십시오
  - 방향을 바꾸십시오
  lexicon: HALOT
  rationale: 여행 방향 전환을 명하는 동사로서, 단순한 회전보다 방향 전환의 명령을 자연스럽게 드러내는 ‘돌이키다’를 택했습니다.
- source_word: צָפֹנָה
  english_pob_choice: northward
  chosen_korean: 북쪽으로
  alternatives_korean:
  - 북쪽을 향하여
  - 북으로
  lexicon: HALOT
  rationale: 히브리어 방향 표지를 한국어 부사구로 자연스럽게 살려, 이동 방향이 북쪽임을 직접적으로 표현했습니다.
theological_decisions:
- issue: 모세의 명령문 어조
  chosen_reading: 하나님의 지시를 전달하는 모세의 직접 명령을 현대 한국어 명령형으로 분명히 살렸습니다.
  alternative_readings:
  - 완곡한 권고문처럼 완화하는 번역
  - 설명문형으로 바꾸는 번역
  rationale: 본문은 이동을 중지하고 방향을 바꾸라는 실제 지시이므로, 수사적 완화보다 원문의 명령성을 유지하는 편이 청중 이해에 더 충실합니다.
  doctrine_reference: 신명기 2:3 문맥상 광야 여정에 대한 하나님의 인도
- issue: ‘너희’ 대상 유지
  chosen_reading: 복수 대상을 분명히 보여 주기 위해 ‘너희’로 옮겼습니다.
  alternative_readings:
  - 단수처럼 보이는 ‘당신’
  - 주어를 생략하는 번역
  rationale: 히브리어 לָכֶם은 복수 대상을 분명히 가리키므로, 공동체 전체에게 주어진 지시라는 점을 한국어에서도 유지했습니다.
  doctrine_reference: 이스라엘 공동체에게 주어진 언약적 지시
