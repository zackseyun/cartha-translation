  text: 한 백성은 크고, 많고, 아나킴과 같이 키가 컸습니다. 야훼께서 그들을 그들 앞에서 멸하셨고, 그들은 그들을 차지하여 그 자리에 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '아낙임과 같이'입니다. 다른 가능성으로는 '아나킴과 같이'가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 백성
  - 한 민족
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사는 특정 집단을 가리키므로, 단순한 복수형보다 '한 백성'이 집합성과 지시성을 함께 살립니다.
- source_word: גָּדוֹל וְרַב וָרָם
  english_pob_choice: great, numerous, and tall
