  lexicon: HALOT
  rationale: 비교 표지 כ를 '...와 같이'로 살리고, 고유명사는 현대 음역 관행에 따라 '아나킴'으로 옮겼습니다.
- source_word: וַיַּשְׁמִידֵם יְהוָה
  english_pob_choice: Yahweh destroyed them
  chosen_korean: 야훼께서 그들을 멸하셨고
  alternatives_korean:
  - 야훼께서 그들을 파괴하셨고
  - 야훼께서 그들을 없애셨고
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴·제거 의미를 살리되, 한국어 성경체에서 자연스러운 '멸하셨다'를 택했습니다.
- source_word: וַיִּירָשֻׁם וַיֵּשְׁבוּ תַחְתָּם
  english_pob_choice: they dispossessed them and lived in their place
  chosen_korean: 그들은 그들을 차지하여 그 자리에 살았습니다
  alternatives_korean:
  - 그들은 그들을 차지하고 그 자리에 거주하였습니다
  - 그들은 그들을 몰아내고 그 자리에 살았습니다
  lexicon: HALOT
  rationale: ירש의 점유·상속 의미를 '차지하다'로, תַחְתָּם의 대체 점거를 '그 자리에'로 간결하게 옮겼습니다.
