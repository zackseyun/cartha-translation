  lexicon: HALOT
  rationale: 세 형용사의 병렬을 한국어에서도 자연스럽게 살리되, רָם은 문맥상 신체적 키를 가리키므로 '키가 컸습니다'로 옮겼습니다.
- source_word: כָּעֲנָקִים
  english_pob_choice: like the Anakim
  chosen_korean: 아나킴과 같이
  alternatives_korean:
