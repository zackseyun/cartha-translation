base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
  footnotes:
  - marker: a
    text: Or 'He has watched over your journey through this great wilderness.' The Hebrew verb is literally 'has known,' which in context can imply attentive care.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼 당신의 하나님이 당신의 손으로 한 모든 일에 복을 주셨기 때문입니다. 그분은 이 큰 광야를 당신이 걸어온 것을 아셨습니다. 이 사십 년 동안 야훼 당신의 하나님이 당신과 함께 계셨으니, 당신은 아무것도 부족하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘알다’는 여기서 ‘살피다, 돌보다’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 고유한 언약 이름을 제목어 ‘주’로 바꾸지 않고, POB 기준에 따라 음역형 ‘야훼’로 옮겨 신적 이름의 직접성을 살렸습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
