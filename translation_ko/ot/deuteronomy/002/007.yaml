  - 복되게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 ‘축복하다’의 언약적 의미를 살리면서 한국어로 자연스럽고 경건한 표현인 ‘복을 주셨다’로 옮겼습니다.
- source_word: יָדַע לֶכְתְּךָ אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  english_pob_choice: He has known your walking through this great wilderness
  chosen_korean: 이 큰 광야를 당신이 걸어온 것을 아셨습니다
  alternatives_korean:
  - 이 큰 광야를 지나는 당신의 걸음을 아셨습니다
  - 이 큰 광야를 걸어가신 것을 아셨습니다
  lexicon: HALOT
  rationale: ‘알다’의 기본 의미를 유지하되, 문맥상 ‘살피시고 돌보셨다’는 함의를 한국어에서 과도하게 확대하지 않도록 ‘아셨습니다’로 옮겼습니다.
- source_word: אַרְבָּעִים שָׁנָה
  english_pob_choice: These forty years
  chosen_korean: 이 사십 년 동안
  alternatives_korean:
  - 이 마흔 해 동안
  - 사십 년 동안
  lexicon: HALOT
  rationale: 기간 표현으로 자연스러운 현대 한국어를 택하되, 문맥의 회고성을 살려 ‘이 … 동안’ 구조를 유지했습니다.
- source_word: לֹא חָסַרְתָּ דָּבָר
  english_pob_choice: you have lacked nothing
  chosen_korean: 아무것도 부족하지 않았습니다
  alternatives_korean:
