  rationale: 관용구의 완전한 충족을 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 처리
  chosen_reading: 본문 전체에서 ‘야훼’로 일관되게 옮기고, ‘당신의 하나님’과 병치하여 언약적 친밀성과 고유성을 함께 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  - 주님
  rationale: POB 기준은 전통적 대체어를 쓰지 않고 신명기 본문이 직접 사용하는 이름을 보존하는 것입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
