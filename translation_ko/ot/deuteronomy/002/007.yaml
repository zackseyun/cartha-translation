  - 당신 하나님
  lexicon: HALOT
  rationale: 직접화법이 아닌 회고적 서술이므로 표준적이고 공손한 합쇼체로 ‘당신의 하나님’이라 옮겼습니다.
- source_word: בֵּרַכְךָ
  english_pob_choice: has blessed you
  chosen_korean: 복을 주셨습니다
  alternatives_korean:
