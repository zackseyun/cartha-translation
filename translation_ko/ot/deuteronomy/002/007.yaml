base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
  footnotes:
  - marker: a
    text: Or 'He has watched over your journey through this great wilderness.' The Hebrew verb is literally 'has known,' which in context can imply attentive care.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼 당신의 하나님이 당신의 손으로 하는 모든 일에 복을 주셨기 때문입니다. 그분은 이 큰 광야를 지나온 당신의 걸음을 아셨습니다.[a] 이 사십 년 동안 야훼 당신의 하나님이 당신과 함께 계셨으니, 당신은 아무것도 부족하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘알다’입니다. 문맥상 ‘당신의 여정을 살피셨다’ 또는 ‘돌보셨다’는 뜻을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
