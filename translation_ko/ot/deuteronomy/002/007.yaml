  naturalness: ‘이 큰 광야를 당신이 걸어온 것을 아셨습니다’는 목적격 표지와 명사절 구성이 부자연스럽습니다. ‘이 큰 광야를 지나온 당신의 걸음을 아셨습니다’가 현대 표준어 합쇼체에서 자연스럽고 원문의 ‘당신의 걸음/여행을 아셨다’를 보존합니다.
  terminology: ‘야훼’, ‘하나님’, ‘복을 주셨습니다’는 POB의 명칭 방침 및 본문의 종교적 어휘에 적절합니다. יָדַע는 본문에서 ‘아셨습니다’로 유지하고, 문맥적 돌봄의 함의는 주석에서 제한적으로 밝혀야 합니다.
