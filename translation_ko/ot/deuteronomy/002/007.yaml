  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 고유한 언약 이름을 제목어 ‘주’로 바꾸지 않고, POB 기준에 따라 음역형 ‘야훼’로 옮겨 신적 이름의 직접성을 살렸습니다.
- source_word: אֱלֹהֶיךָ
