base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
  footnotes:
  - marker: a
    text: Or, more formally, 'and eat' / 'and drink.' The Hebrew sequence can be rendered more literally, but here it expresses the intended result of buying the provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그들에게서 은으로 먹을 것을 사서 먹으십시오. 또 그들에게서 은으로 물을 사서 마시십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 직역하면 ‘그리고 먹고 / 그리고 마시고’입니다. 히브리어의 동사 연결은 구매 뒤에 이어지는 먹음과 마심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 음식
  - 식량
  - 양식
  lexicon: HALOT
  rationale: אֹכֶל은 일반적인 먹거리/식용 물품을 가리키므로, 문맥에 맞게 자연스러운 현대 한국어인 ‘먹을 것’으로 옮겼습니다.
- source_word: תִּשְׁבְּרוּ
  english_pob_choice: you shall buy
  chosen_korean: 사서
  alternatives_korean:
  - 구입하여
  - 구매하여
  - 얻어서
  lexicon: HALOT
  rationale: שׁבר의 ‘사다’ 의미가 여기서는 음식과 물을 대가를 지불하고 얻는 뜻이므로, 동사형으로 ‘사서’가 가장 직관적입니다.
- source_word: בַּכֶּסֶף
  english_pob_choice: with silver
  chosen_korean: 은으로
  alternatives_korean:
  - 돈으로
  - 은값으로
  - 금전으로
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 살려 ‘돈’으로 일반화하지 않고 ‘은으로’라고 옮겼습니다.
- source_word: וַאֲכַלְתֶּם / וּשְׁתִיתֶם
  english_pob_choice: so that you may eat / so that you may drink
  chosen_korean: 먹고 / 마셔야 합니다
  alternatives_korean:
  - 먹으십시오 / 마시십시오
  - 먹게 되며 / 마시게 되며
  - 먹고 / 마십니다
  lexicon: WLC
  rationale: 이 절에서는 구매 행위 뒤의 결과를 나타내는 연결로 이해하여, 한국어에서는 의도·결과를 자연스럽게 드러내는 ‘먹고 / 마셔야 합니다’로 처리했습니다.
theological_decisions:
- issue: 구매 명령의 윤리적 힘
  chosen_reading: 이스라엘은 에돔의 식량과 물을 약탈하지 말고, 대가를 치르고 정당하게 사야 합니다.
  alternative_readings:
  - 연결어를 단순한 ‘그리고’로만 두어 결과성을 약화할 수 있습니다.
  rationale: 본문은 적법한 거래를 명령하는 맥락이므로, ‘사서’와 결과 표현을 통해 약탈이 아닌 정당한 구매라는 윤리적 강도를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
