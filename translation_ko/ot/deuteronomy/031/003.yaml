id: DEU.31.3
reference: Deuteronomy 31:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'goes before you' / 'will cross over before you.' The Hebrew participle can express ongoing, imminent, or certain future action.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will take possession of them/their land.' The Hebrew verb often carries the sense of taking possession by dispossessing prior occupants.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님이신 야훼께서 친히 당신보다 앞서 건너가십니다[a]. 그분이 친히 이 민족들을 당신 앞에서 멸하실 것이며, 당신은 그들을 몰아내어 그 땅을 차지할 것입니다[b]. 여호수아가 친히 당신보다 앞서 건너가십니다. 야훼께서 말씀하신 그대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신보다 앞서 가십니다’/‘당신보다 앞서 건너가실 것입니다.’ 히브리어 분사는 진행 중인 일, 임박한 일, 또는 확정된 미래를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들을 차지할 것입니다.’ 히브리어 동사는 이 문맥에서 앞에 있던 사람들을 몰아내고 그들의 땅을 소유하게 되는 뜻을 자주 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 영어 본문이 Tetragrammaton을 인명으로 유지하므로, 한국어도 전통적 대체어가 아니라 음역형 ‘야훼’로 살려 신적 고유명을 보존했습니다.
- source_word: הוּא
  english_pob_choice: himself
  chosen_korean: 친히
  alternatives_korean:
  - 그분이
  - 직접
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 부사 ‘친히’로 자연스럽게 드러내어, 주어의 능동적·강조적 행위를 보존했습니다.
- source_word: עֹבֵר לְפָנֶיךָ
  english_pob_choice: is crossing over before you
  chosen_korean: 당신보다 앞서 건너가십니다
  alternatives_korean:
  - 당신 앞에서 건너가십니다
  - 당신보다 앞서 가십니다
  lexicon: HALOT
  rationale: פָּנִים 앞의 공간적 이미지를 살리되, 광야-요단 문맥에 맞는 ‘건너가다’로 옮겨 현재적·임박한 진행을 유지했습니다.
- source_word: וִירִשְׁתָּם
  english_pob_choice: you will dispossess them
  chosen_korean: 그들을 차지하게 될 것입니다
  alternatives_korean:
  - 그들을 상속하게 될 것입니다
  - 그들을 점유하게 될 것입니다
  lexicon: HALOT
  rationale: ירש의 정복 문맥에서 ‘상속/차지’의 의미가 있으나, POB의 ‘dispossess’가 암시하는 결과를 한국어에서 과도하게 설명하지 않도록 ‘차지하다’로 옮겼습니다.
- source_word: הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: these nations
  chosen_korean: 이 민족들
  alternatives_korean:
  - 이 나라들
  - 이 민족 국가들
  lexicon: HALOT
  rationale: 가나안 주민들을 가리키는 גוֹיִם은 여기서 정치·민족 집단을 뜻하므로, 한국어에서 자연스럽고 포괄적인 ‘민족들’을 택했습니다.
theological_decisions:
- issue: 야훼와 여호수아의 이중 전진 주체를 어떻게 보존할지
  chosen_reading: 야훼가 먼저 앞서 건너가시고, 여호수아도 그 뒤를 이어 앞서 건너가는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 두 절차를 단순히 하나의 진행으로 합치기
  - 여호수아의 행위를 약화시켜 부차적으로만 표현하기
  rationale: 본문은 하나님과 지도자 여호수아의 행위를 나란히 두어, 하나님의 주권적 선행과 인간 대리자의 순종을 함께 보여 줍니다. 한국어에서도 이 긴장을 지우지 않도록 반복 구조를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, preserve tension rather than resolve it'
