  rationale: 정착된 성경 인명 형태를 따라 여호수아를 두고, 히브리어 친족관계를 자연스럽게 한국어 어순에 맞춰 ‘눈의 아들’로 옮겼습니다.
- source_word: חֲזַק וֶאֱמָץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 강하고 담대하십시오
  alternatives_korean:
  - 강하고 용기 있으십시오
  - 강하고 굳세십시오
  lexicon: HALOT
  rationale: עצם/אמץ의 결합은 단순한 체력보다 용기와 결연함을 요구하므로, 관용적이면서도 힘을 유지하는 ‘강하고 담대하십시오’로 옮겼습니다.
