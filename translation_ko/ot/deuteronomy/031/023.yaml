  - 약속의 땅
  lexicon: HALOT
  rationale: 신명기 문맥의 언약적 정착지를 가리키므로 관사적 지시를 살린 ‘그 땅’으로 옮겼습니다.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  english_pob_choice: and I will be with you
  chosen_korean: 나는 당신과 함께 있을 것입니다
  alternatives_korean:
