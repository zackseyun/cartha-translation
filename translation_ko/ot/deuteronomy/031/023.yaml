  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the people of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 눈의 아들 여호수아에게 명령하며 말했습니다. 「강하고 담대하십시오. 당신이 이스라엘 자손을 그 땅으로 인도해 들어갈 것이기 때문입니다. 나는 그들에게 맹세한 그 땅으로 들어가게 하실 분입니다. 나는 당신과 함께 있을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역형입니다. 더 자연스러운 뜻으로는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성들’이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: he commanded
  chosen_korean: 명령하며
  alternatives_korean:
  - 명하여
  - 지시하며
  lexicon: HALOT
  rationale: 피엘형 צוה의 직접적 의미를 따라 공적이고 권위 있는 명령을 드러내기 위해 ‘명령하며’로 옮겼습니다.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: Joshua son of Nun
  chosen_korean: 눈의 아들 여호수아
  alternatives_korean:
  - 여호수아, 눈의 아들
  - 눈의 아들인 여호수아
  lexicon: 고유명사 표기 관행
  rationale: 정착된 성경 인명 형태를 따라 여호수아를 두고, 히브리어 친족관계를 자연스럽게 한국어 어순에 맞춰 ‘눈의 아들’로 옮겼습니다.
- source_word: חֲזַק וֶאֱמָץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 강하고 담대하십시오
  alternatives_korean:
  - 강하고 용기 있으십시오
  - 강하고 굳세십시오
  lexicon: HALOT
  rationale: עצם/אמץ의 결합은 단순한 체력보다 용기와 결연함을 요구하므로, 관용적이면서도 힘을 유지하는 ‘강하고 담대하십시오’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족·언약적 표현을 보존하면서 한국어 성경에서 널리 통용되는 직역형을 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 약속의 땅
  lexicon: HALOT
  rationale: 신명기 문맥의 언약적 정착지를 가리키므로 관사적 지시를 살린 ‘그 땅’으로 옮겼습니다.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  english_pob_choice: and I will be with you
  chosen_korean: 나는 당신과 함께 있을 것입니다
  alternatives_korean:
  - 내가 당신과 함께하겠습니다
  - 나는 당신과 함께할 것입니다
  lexicon: HALOT
  rationale: אָנֹכִי의 강조를 살리면서, 보편적 성경 약속 공식을 한국어로 자연스럽게 유지했습니다.
theological_decisions:
- issue: 주어의 명시 여부
  chosen_reading: ‘그리고 그는 … 명령하며 말했습니다’로 익명 주어를 유지했습니다.
  alternative_readings:
  - ‘그리고 야훼께서 … 명령하며 말씀하셨습니다’
  - ‘그리고 모세가 … 명령하며 말했습니다’
  rationale: 본문 자체는 삼인칭 단수 주어만 제시하므로, 문맥적 식별을 본문에 과잉 삽입하지 않고 원문 흐름을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
- issue: ‘내가 … 맹세한 그 땅’의 동사 처리
  chosen_reading: ‘나는 그들에게 맹세한 그 땅으로 들어가게 하실 분입니다’로 옮겼습니다.
  alternative_readings:
  - ‘내가 그들에게 맹세한 그 땅’
  - ‘내가 그들에게 맹세한 땅’
  rationale: 히브리어는 ‘맹세하다’만 명시하고 ‘주다’는 반복하지 않으므로, 원문에 없는 목적동사를 보태지 않되 한국어 문맥상 약속의 성격이 드러나도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
