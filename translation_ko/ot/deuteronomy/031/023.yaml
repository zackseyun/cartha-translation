translation:
  language: ko
  text: 그리고 그는 눈의 아들인 여호수아에게 명령하여 말했습니다. 「강하고 담대하십시오. 당신이 이스라엘 자손[a]을 내가 그들에게 맹세한 땅으로 데리고 들어갈 것이기 때문입니다. 나는 당신과 함께 있을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역형입니다. 더 자연스러운 표현으로는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’이 가능합니다.
    reason: lexical_alternative
