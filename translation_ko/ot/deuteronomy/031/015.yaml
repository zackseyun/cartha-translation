base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
  footnotes:
  - marker: a
    text: Or 'in the Tent'; the Hebrew simply says 'the tent,' likely referring to the tent of meeting in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'over the entrance of the tent'; the Hebrew preposition can also be rendered more literally as 'on/over,' though 'at the entrance' best fits the scene in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 천막 안에 구름 기둥으로 나타나셨고, 구름 기둥이 천막 어귀에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단순히 ‘천막’을 말합니다. 문맥상 회막을 가리킬 가능성이 있지만, 여기서는 원문 범위를 넘지 않기 위해 직역했습니다.
    reason: source_note
  - marker: b
    text: 히브리어 עַל פֶּתַח은 이 장면에서 ‘~의 어귀에/입구에’라는 위치를 뜻합니다. ‘위에’로 옮길 수도 있지만, 장면상 ‘어귀에’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
