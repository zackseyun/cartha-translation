base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
  footnotes:
  - marker: a
    text: Or 'in the Tent'; the Hebrew simply says 'the tent,' likely referring to the tent of meeting in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'over the entrance of the tent'; the Hebrew preposition can also be rendered more literally as 'on/over,' though 'at the entrance' best fits the scene in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 천막[a] 안에서 구름 기둥 가운데 나타나셨고, 구름 기둥이 천막 어귀[b]에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘천막’을 말합니다. 문맥상 회막을 가리킬 가능성이 있지만, 본문 자체는 이를 더 구체적으로 밝히지 않습니다.
    reason: source_note
  - marker: b
    text: 히브리어 עַל은 더 문자적으로 ‘~ 위에/위로’를 뜻할 수도 있습니다. 그러나 이 장면에서는 ‘천막 어귀에’가 자연스러운 위치 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 언약의 신적 고유명을 보존하기 위해 통용되는 음역인 ‘야훼’를 사용했고, 경칭 대체어인 ‘주님’은 피했습니다.
- source_word: בָּאֹהֶל
  english_pob_choice: in the tent
  chosen_korean: 천막 안에
  alternatives_korean:
  - 천막에
  - 회막 안에
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘천막’을 말하므로, 문맥상 회막을 떠올리게 하되 원문 범위를 넘지 않도록 ‘천막 안에’로 옮겼습니다.
- source_word: בְּעַמּוּד עָנָן
  english_pob_choice: in a pillar of cloud
  chosen_korean: 구름 기둥으로
  alternatives_korean:
  - 구름 기둥 안에
  - 구름 기둥 가운데
  lexicon: HALOT
  rationale: אָנָן/עַמּוּד의 결합은 여호와의 현현 방식을 가리키므로, 수단·양태를 드러내는 ‘-으로’를 써서 보이는 형상을 살렸습니다.
- source_word: עַל פֶּתַח הָאֹהֶל
  english_pob_choice: at the entrance of the tent
  chosen_korean: 천막 어귀에
  alternatives_korean:
  - 천막 입구에
  - 천막 문간에
  lexicon: HALOT
  rationale: עַל פֶּתַח은 위치를 가리키는 표현이므로 ‘어귀에’로 간결하게 옮겨, 장면의 공간감을 자연스럽게 유지했습니다.
theological_decisions:
- issue: 여호와의 현현을 어떻게 한국어로 보존할지
  chosen_reading: 야훼께서 천막 안에 구름 기둥으로 나타나셨고
  alternative_readings:
  - 야훼께서 천막 안에 계시고 구름 기둥이 나타났고
  - 야훼께서 구름 기둥 가운데 나타나셨고
  rationale: 본문은 보이는 현현과 장소성을 함께 제시하므로, 이를 평면적으로 풀어버리지 않고 ‘나타나셨고’와 ‘구름 기둥으로’의 결합으로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
