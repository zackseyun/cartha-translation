  to: 그때 모세는 여호수아를 불러 온 이스라엘이 보는 앞에서 그에게 말했습니다. “힘을 내고 용기를 내십시오. 당신은 이 백성과 함께 야훼께서 그들의 아버지들에게[b] 주겠다고 맹세하신 땅으로 들어갈 것이기 때문입니다[a]. 그리고 당신은 그들이 그 땅을 기업으로 받게 할 것입니다.”
