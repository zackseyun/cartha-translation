id: DEU.31.7
reference: Deuteronomy 31:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
  footnotes:
  - marker: a
    text: Or, “you will bring this people into the land.” The Hebrew may be understood either as Joshua going in with the people or as leading them in; the main text preserves the wording distinction in this verse before the next clause states that he will give them the land as an inheritance.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: “their fathers.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세는 여호수아를 불러 온 이스라엘이 보는 앞에서 그에게 말했습니다. “힘을 내고 용기를 내십시오. 당신은 이 백성과 함께 야훼께서 그들의 아버지들에게[b] 주겠다고 맹세하신 땅으로 들어갈 것이기 때문입니다[a]. 그리고 당신은 그들이 그 땅을 기업으로 받게 할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 백성과 함께 … 들어갈’은 히브리어 문장 구조를 따른 번역입니다. 문맥상 ‘이 백성을 그 땅으로 데려갈’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러서
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 서사 문맥의 קרא는 공식적 ‘소집’보다 자연스러운 ‘부르다’가 적절하며, 이어지는 직접화법 도입도 매끄럽게 합니다.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  english_pob_choice: in the sight of all Israel
  chosen_korean: 온 이스라엘이 보는 앞에서
  alternatives_korean:
  - 온 이스라엘 앞에서
  - 온 이스라엘의 눈앞에서
  lexicon: HALOT
  rationale: 직역의 ‘눈앞에’ 의미를 살리면서도 공개적으로 보는 장면을 한국어로 자연스럽게 표현했습니다.
- source_word: חֲזַק וֶאֱמָץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 힘을 내고 용기를 내십시오
  alternatives_korean:
  - 강하고 담대하십시오
  - 강건하고 용감하십시오
  lexicon: HALOT
  rationale: 관용적 히브리어 격려 표현을 현대 한국어의 권면으로 옮기되, 강함과 용기의 두 축을 모두 드러냈습니다.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  english_pob_choice: you will go with this people
  chosen_korean: 당신은 이 백성과 함께 그 땅으로 들어갈 것이기 때문입니다
  alternatives_korean:
  - 당신은 이 백성을 그 땅으로 데려갈 것이기 때문입니다
  - 당신은 이 백성과 함께 들어갈 것이기 때문입니다
  lexicon: HALOT
  rationale: 이 구절의 תחביר는 여호수아가 백성과 ‘함께’ 들어가는 뜻을 우선 지지하므로, 다음 절의 ‘기업으로 차지하게 할 것이다’와 구분해 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 도큐먼트의 기본 원칙에 따라 신명기를 따라 나타난 신명은 ‘야훼’로 옮겼습니다.
- source_word: לַאֲבֹתָם
  english_pob_choice: to their fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 아버지들’이지만, 한국어에서는 혈통적-언약적 대상을 가장 자연스럽게 드러내는 ‘조상들’이 의미를 더 잘 전달합니다.
- source_word: תַּנְחִילֶנָּה
  english_pob_choice: you will give it to them as an inheritance
  chosen_korean: 그들에게 그것을 기업으로 차지하게 할 것입니다
  alternatives_korean:
  - 그들에게 그것을 유산으로 줄 것입니다
  - 그들이 그것을 기업으로 받게 할 것입니다
  lexicon: HALOT
  rationale: נחל의 사역형은 단순 ‘주다’보다 상속·분배의 의미가 강하므로, 성경적 ‘기업’ 개념을 살리면서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 신명기 인용문의 여호와 이름 처리
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 언약 이름 יְהוָה를 직접 사용하므로, 본문에서 고유 이름을 보존하는 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: תָּבוֹא אֶת הָעָם의 방향성
  chosen_reading: ‘이 백성과 함께 그 땅으로 들어갈’로 옮겨, 여호수아가 백성과 동행해 प्रवेश하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘이 백성을 그 땅으로 데려갈’
  - ‘이 백성을 그 땅에 이끌고 들어갈’
  rationale: 히브리어는 이 절에서 여호수아의 동행을 먼저 말하고, 곧이어 그가 기업 분배를 맡는다고 하여 역할을 구분합니다. 이를 한국어에서도 분리해 해석의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
