source:
  edition: WLC
  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
  footnotes:
  - marker: a
    text: Or 'my presence'; the Hebrew reads literally 'my face,' an idiom for divine favor or presence withdrawn.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나 자신이 그날에 그가 행한 모든 악 때문에, 곧 그가 다른 신들에게로 돌아섰기 때문에, 반드시 내 얼굴[a]을 숨기겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 얼굴’은 직역이며, 하나님의 호의나 임재가 물러남을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  english_pob_choice: And I myself
  chosen_korean: 그리고 내가 반드시
  alternatives_korean:
  - 그리고 나도
  - 그리고 내가
  lexicon: HALOT
  rationale: אָנֹכִי의 강조를 한국어에서 자연스럽게 살리기 위해 단순한 ‘내가’보다 ‘내가 반드시’로 강세를 보였습니다. 접속 וְ는 문맥상 ‘그리고’로 옮겼습니다.
- source_word: הַסְתֵּר אַסְתִּיר פָּנַי
  english_pob_choice: will surely hide my face
  chosen_korean: 내 얼굴을 숨기겠습니다
  alternatives_korean:
  - 내 얼굴을 반드시 숨기겠습니다
  - 내 얼굴을 가리겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴’(פָּנַי)과 반복 강조 구조를 살리되, 한국어에서는 ‘숨기다’가 직역에 가깝고 공적인 문맥에서도 자연스럽습니다. ‘가리다’는 의미는 가깝지만 본문 이미지가 약해집니다.
- source_word: עַל כָּל הָרָעָה
  english_pob_choice: because of all the evil
  chosen_korean: 그가 행한 모든 악 때문에
  alternatives_korean:
  - 그가 행한 모든 악으로 인해
  - 그가 한 모든 악 때문에
  lexicon: HALOT
  rationale: עַל의 인과 의미를 ‘때문에’로 옮겼고, הָרָעָה는 단순 재앙이 아니라 도덕적 악/악행의 의미를 살려 ‘악’으로 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂה כִּי פָנָה אֶל אֱלֹהִים אֲחֵרִים
  english_pob_choice: that he has done ... because he has turned to other gods
  chosen_korean: 그가 다른 신들에게로 돌아섰기 때문입니다
  alternatives_korean:
  - 그가 다른 신들에게로 향했기 때문입니다
  - 그가 다른 신들 쪽으로 돌아갔기 때문입니다
  lexicon: HALOT
  rationale: פָנָה אֶל은 단순 이동보다 방향 전환과 충성을 함축하므로 ‘돌아섰다’로 옮겼습니다. אֱלֹהִים אֲחֵרִים은 전통적 완곡어보다 원문의 직접성을 따라 ‘다른 신들’로 처리했습니다.
theological_decisions:
- issue: פָּנַי의 직역 유지
  chosen_reading: ‘내 얼굴’로 유지하여 신적 임재/호의의 철수라는 함의를 본문 안에 남겼습니다.
  alternative_readings:
  - 내 임재
  - 내 호의
  - 내 존재
  rationale: 히브리어는 문자적으로 ‘내 얼굴’이라 말하며, 이를 해설적으로 바꾸면 의도적 긴장이 약해집니다. 본문 이미지를 유지하는 것이 원문과 POB의 audit trail에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 이스라엘을 단수로 지칭하는 형태 유지
  chosen_reading: ‘그가 행한… 그가 다른 신들에게로 돌아섰기’로 단수를 유지했습니다.
  alternative_readings:
  - 그들이 행한… 그들이 돌아섰기
  - 그 백성이 행한… 그 백성이 돌아섰기
  rationale: 히브리어 동사의 단수형을 보존해 이스라엘을 집합적 단수로 의인화하는 원문 형식을 살렸습니다. 이는 의미를 흐리지 않으면서도 형태적 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §1, §5
