  naturalness: ‘그가 행한 모든 악 때문에, 그가 … 때문입니다’는 한국어에서 같은 인과 연결이 연속되어 다소 경직됩니다. ‘곧’을 사용해 두 번째 כִּי절이 앞의 ‘악’의 내용을 설명하는 관계를 자연스럽게 드러낼 수 있습니다. ‘나 자신이’와 ‘반드시’를 각각 주어 및 동사 강조에 배치하면 현대 표준어 합쇼체로도 자연스럽습니다.
  terminology: ‘내 얼굴’과 ‘다른 신들’은 원문 및 영어 POB의 선택에 부합합니다. ‘돌아섰다’는 פָנָה אֶל의 충성·예배 방향 전환을 과도하게 해석하지 않으면서 적절히 전달합니다. 각주는 ‘내 얼굴’ 직후에 붙여야 어휘 대안의 범위가 분명해집니다.
