- from: 강하고 담대하여라, 그들을 두려워하거나 놀라지 말라, 이는 너희 하나님 야훼가 너희와 함께 가시며, 너희를 버리거나 떠나지 아니하실 것이기 때문이다.
  to: 강하고 담대하십시오. 그들을 두려워하지도 말고 그들 앞에서 겁내지도 마십시오. 너희의 하나님 야훼께서 바로 너희와 함께 가시는 분이시니, 너희를 놓지 않으시고 버리지 않으실 것입니다.
  rationale: The revision renders both plural imperatives in modern formal-polite style, reflects the stronger second fear prohibition with ‘겁내다,’ retains the causal sense of ‘그들 앞에서,’ preserves the emphatic participial clause, and distinguishes ‘not let go’ from ‘not forsake.’ No footnote is required for the Korean text because the translation can express these distinctions directly without unresolved ambiguity.
