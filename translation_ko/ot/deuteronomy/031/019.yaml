  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites' (also twice in this verse). The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'among the sons of Israel.' The Hebrew preposition can be read more literally as 'in/among,' but here the sense is likely that the song serves as a witness against them.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 너희를 위해 이 노래를 기록하고, 이스라엘의 아들들에게 가르쳐서 그들의 입에 두십시오. 이는 이 노래가 이스라엘의 아들들 가운데서 나를 위한 증인이 되게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라고 합니다. 이 절에서 두 번 더 나옵니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 이 노래는 이스라엘의 언약 불순종을 드러내는 증언의 기능을 합니다.
    reason: theological_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 전환과 긴급성을 자연스럽게 살리되, 한국어에서는 ‘이제’가 가장 간결하게 התחלה를 연결합니다.
- source_word: כִּתְבוּ לָכֶם
  english_pob_choice: write this song for yourselves
  chosen_korean: 너희를 위해 이 노래를 기록하고
  alternatives_korean:
  - 너희를 위해 이 노래를 쓰고
  - 이 노래를 너희 자신을 위해 적고
  lexicon: HALOT
  rationale: לָכֶם의 수혜/당사자 뉘앙스를 ‘너희를 위해’로 살리고, 노래를 문서로 남기라는 뜻에 맞게 ‘기록하다’를 택했습니다.
- source_word: הַשִּׁירָה הַזֹּאת
  english_pob_choice: this song
  chosen_korean: 이 노래
  alternatives_korean:
  - 이 시
  - 이 찬가
  lexicon: HALOT
  rationale: שִׁירָה의 기본 의미를 직접적으로 반영해 ‘노래’로 옮겼습니다.
- source_word: שִׂימָהּ בְּפִיהֶם
  english_pob_choice: put it in their mouths
  chosen_korean: 그들의 입에 두십시오
  alternatives_korean:
  - 그들의 입에 넣으십시오
  - 그들이 외우도록 하십시오
  lexicon: HALOT
  rationale: 기억과 낭송을 위한 구체적 이미지를 유지하면서, 한국어에서 ‘입에 두다’가 다소 부자연스러워 의미를 살린 직역으로 정리했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 보존해 ‘아들들’로 옮겼고, 일반화된 관용어보다 원문 형식을 우선했습니다.
- source_word: לְעֵד
  english_pob_choice: a witness
  chosen_korean: 증인
  alternatives_korean:
  - 증거
  - 증언
  lexicon: HALOT
  rationale: 문맥상 노래가 언약 위반을 드러내는 법정적 역할을 하므로, ‘증거’보다 인격화된 ‘증인’이 원문의 기능을 더 잘 드러냅니다.
theological_decisions:
- issue: בִּבְנֵי יִשְׂרָאֵל의 방향성
  chosen_reading: 이스라엘의 아들들 가운데서
  alternative_readings:
  - 이스라엘의 아들들을 대하여
  - 이스라엘의 아들들에게 대하여
  rationale: 여기서는 노래가 이스라엘 안에서 증언의 기능을 한다는 공간적/관계적 뉘앙스를 살리되, 19절의 후속 문맥상 책망의 증언이라는 해석은 본문 밖에서 과도하게 단정하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
