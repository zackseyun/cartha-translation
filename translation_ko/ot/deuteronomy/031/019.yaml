  source_fidelity: 원문의 명령 연쇄(기록하라, 가르치라, 그들의 입에 두라)와 목적절을 유지해야 합니다. 특히 마지막 בִּבְנֵי יִשְׂרָאֵל은 문맥상 ‘…을 거슬러/불리하게’가 유력하나, 전치사 ב의 공간적 의미 가능성은 각주로 남기는 것이 적절합니다.
  naturalness: 초안의 ‘그들의 입에 두십시오’는 현대 한국어에서 부자연스럽습니다. ‘그들의 입에 넣으십시오’가 원문의 구체적 비유를 가장 직접적으로 유지합니다. 또한 ‘이스라엘의 아들들’은 한국어에서 자연스러운 집단 명칭이 아니므로, 관용적 성서 표현인 ‘이스라엘 자손’을 쓰되 히브리어 표현은 각주에서 밝혔습니다.
  terminology: שִׁירָה는 ‘노래’, עֵד는 노래가 수행하는 법정적 역할을 나타내므로 ‘증인’으로 유지합니다. לִי는 ‘나를 위한’으로, 대적 방향은 ‘이스라엘 자손을 거슬러’로 옮겼습니다.
