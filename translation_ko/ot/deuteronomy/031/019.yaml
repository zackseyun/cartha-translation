revisions:
- from: 이제 너희를 위해 이 노래를 기록하고, 이스라엘의 아들들에게 가르쳐서 그들의 입에 두십시오. 이는 이 노래가 이스라엘의 아들들 가운데서 나를 위한 증인이 되게 하려는 것입니다.[a][b]
  to: 이제 이 노래를 너희 자신을 위하여 기록하고, 이스라엘 자손[a]에게 그것을 가르치며, 그들의 입에 넣으십시오. 그리하여 이 노래가 이스라엘 자손을 거슬러[b] 나를 위한 증인이 되게 하십시오.
  rationale: 명령의 대상과 순서를 보존하고, ‘입에 넣으십시오’로 원문의 암송·낭송 비유를 직역적으로 살렸습니다. 마지막 전치사구는 문맥에 가장 잘 맞는 대적 의미로 본문에 반영하되, 논쟁 가능한 공간적 독법을 각주에 명시했습니다. 또한 집단 명칭을 자연스러운 한국어 성서 용례로 정리하고 각주 a의 횟수 오류를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:10Z'
