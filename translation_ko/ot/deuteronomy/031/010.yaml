  source_fidelity: 초안의 ‘해마다의 해방’은 שְׁנַת הַשְּׁמִטָּה(제7년의 면제/탕감의 해)를 잘못 옮겨 반복 주기와 의미를 모두 훼손합니다. מִקֵּץ שֶׁבַע שָׁנִים은 문맥상 ‘매 칠 년이 끝나는 때’로 옮기는 것이 적절합니다. בְּמוֹעֵד는 ‘정한 때’로, 축제 명칭은 ‘초막절’로 옮겼습니다.
  naturalness: ‘명령하여 말하기를’보다 현대 표준어 합쇼체에서는 ‘이렇게 명령하였습니다’가 자연스럽습니다. 이 절은 다음 절로 이어지는 직접 인용의 도입부이므로 인용문을 종결하지 않고 쉼표로 마무리했습니다.
  terminology: ‘면제년’은 שְׁמִטָּה의 면제·탕감 의미를 보존하는 중립적인 번역입니다. ‘초막절’은 סֻכּוֹת의 통용 한국어 성경 명칭이며, ‘장막절’은 이칭으로 각주 처리할 수 있습니다.
