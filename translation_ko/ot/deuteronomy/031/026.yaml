revisions:
- from: 이 율법책을 가져다가 야훼 당신들의 하나님 언약궤 곁에 두고, 거기에서 당신들에 대한 증언으로 남겨 두십시오.[a][b]
  to: 이 율법책[a]을 가져다가 당신들의 하나님 야훼의 언약궤 곁에 두십시오. 그것이 거기에 있어 당신들에게 불리한 증거가 되게 하십시오.[b]
  rationale: 소유 관계를 자연스러운 한국어 속격으로 바로잡고, 언약-법정 문맥의 ‘불리한 증거’라는 의미를 명확히 했습니다. 두 문장으로 나누어 원문의 연속된 명령과 결과 상태를 자연스러운 합쇼체로 표현했으며, 두루마리라는 어휘 대안과 증거의 기능에 관한 각주도 해당 어구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:05Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 명령과 위치 관계는 대체로 반영되었으나, ‘야훼 당신들의 하나님 언약궤’는 히브리어의 속격 관계(‘당신들의 하나님 야훼의 언약궤’)를 한국어에서 부자연스럽고 모호하게 만듭니다. 또한 בְּךָ의 언약-법정적 불리함은 ‘당신들에 대한 증언’보다 분명하게 드러내는 것이 좋습니다.
  naturalness: ‘야훼 당신들의 하나님 언약궤’는 현대 표준 한국어의 명사 연결로 자연스럽지 않습니다. ‘당신들의 하나님 야훼의 언약궤’로 고치고, ‘당신들에게 불리한 증거’로 표현하면 합쇼체 명령문 안에서 자연스럽고 법정적 기능도 명료합니다.
  terminology: ‘율법책’, ‘야훼’, ‘언약궤’는 적절합니다. עֵד는 이 문맥에서 문서가 수행하는 법정적 증거 기능을 가리키므로 ‘증거’가 자연스럽습니다. 각주는 סֵפֶר의 두루마리 의미와 증거의 불리한 기능을 각각 적절히 보존합니다.
  issues:
  - severity: medium
    issue: 언약궤의 소유·속격 관계가 한국어에서 모호하고 부자연스럽습니다.
    rationale: ‘야훼 당신들의 하나님 언약궤’는 יְהוָה אֱלֹהֵיכֶם이 ‘언약궤’를 수식하는 관계를 명확히 전달하지 못합니다. ‘당신들의 하나님 야훼의 언약궤’가 원문의 관계와 자연스러운 한국어를 함께 충족합니다.
  - severity: medium
    issue: ‘당신들에 대한 증언’은 증언의 적대적·불리한 방향을 충분히 드러내지 못합니다.
    rationale: לְעֵד בְּךָ는 이 문맥에서 이스라엘에게 불리하게 서는 증거의 기능을 나타냅니다. ‘당신들에게 불리한 증거’는 이를 직접적으로 전달하면서도 본문이 명시하지 않은 조건을 본문에 추가하지 않습니다.
