source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
  footnotes:
  - marker: a
    text: Or 'this scroll of the law.' The Hebrew סֵפֶר can refer to a scroll or written document.
    reason: lexical_alternative
  - marker: b
    text: That is, as testimony against you if you break the covenant.
    reason: cultural_note
translation:
  language: ko
  text: 이 율법책[a]을 가져다가 당신들의 하나님 야훼의 언약궤 곁에 두십시오. 그것이 거기에 있어 당신들에게 불리한 증거가 되게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֵפֶר는 두루마리나 기록 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 언약을 어길 경우 당신들에게 불리한 증거가 됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  english_pob_choice: Take
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져오십시오
  - 취하십시오
  lexicon: HALOT
  rationale: 직접적인 명령의 힘을 살리되, 이어지는 ‘두고’와 자연스럽게 이어지도록 ‘가져다가’로 옮겼습니다.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  english_pob_choice: this Book of the Law
  chosen_korean: 이 율법책
  alternatives_korean:
  - 이 율법 두루마리
  - 이 율법의 책
  lexicon: HALOT
  rationale: סֵפֶר는 물리적 문서인 책/두루마리를 가리킬 수 있지만, 한국어에서는 כאן의 문맥상 간결한 ‘율법책’이 가장 자연스럽습니다.
- source_word: מִצַּד אֲרוֹן בְּרִית יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: beside the ark of the covenant of Yahweh your God
  chosen_korean: 야훼 당신들의 하나님 언약궤 곁에
  alternatives_korean:
  - 야훼 당신들의 하나님 언약궤 옆에
  - 야훼 당신들의 하나님과 맺은 언약궤 곁에
  lexicon: HALOT
  rationale: מִצַּד는 위치상 ‘곁에/옆에’가 적절하며, יְהוָה는 본 지침에 따라 ‘야훼’로, אֱלֹהֵיכֶם은 ‘당신들의 하나님’으로 옮겼습니다.
- source_word: לְעֵד
  english_pob_choice: as a witness
  chosen_korean: 증언으로
  alternatives_korean:
  - 증인으로
  - 증거로
  lexicon: HALOT
  rationale: 이 문맥의 עֵד는 단순한 물건 설명이 아니라 언약 위반 때의 법정적 증언 기능을 가지므로, 한국어에서는 ‘증언’이 그 기능을 가장 분명히 드러냅니다.
theological_decisions:
- issue: 언약책의 기능
  chosen_reading: 율법책은 언약궤 옆에 놓여, 백성이 언약을 어길 때 그들을 향해 작동하는 증언이 됩니다.
  alternative_readings:
  - 단순한 기념물로 남겨 둡니다
  - 중립적인 보관 문서로 이해합니다
  rationale: ‘לְעֵד בְּךָ’는 신명기의 언약-재판 맥락에서 백성에게 불리한 증언의 성격을 띱니다. 이를 완화하지 않고 살려야 원문의 긴장이 유지됩니다.
  doctrine_reference: 언약적·법정적 증언 기능을 보존
