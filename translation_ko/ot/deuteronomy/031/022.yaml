base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그날 이 노래를 써서, 그것을 이스라엘 자손에게 가르쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자녀들’로도 옮길 수 있습니다. 히브리어는 ‘이스라엘 자손’이라고 되어 있으며, 이는 이스라엘 백성을 가리키는 표준 언약적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: wrote
  chosen_korean: 써서
  alternatives_korean:
  - 기록해서
  - 썼습니다
  lexicon: HALOT
  rationale: 히브리어 서술 동사 כתב의 기본 의미를 자연스러운 서사체로 옮겼습니다. 앞절과 이어지는 행위를 매끄럽게 잇기 위해 ‘써서’를 택했습니다.
- source_word: הַשִּׁירָה הַזֹּאת
  english_pob_choice: this song
  chosen_korean: 이 노래
  alternatives_korean:
  - 이 시
  - 이 가사
  lexicon: HALOT
  rationale: 지시형용사와 יחד로 된 שִׁירָה를 ‘노래’로 옮겨 문맥의 문학적·언약적 성격을 살렸습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그 같은 날
  lexicon: HALOT
  rationale: 시간 표현은 한국어 서사에서 가장 자연스러운 ‘그날’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 표준 언약적 표현을 살리되, 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’으로 옮겨 직역성과 가독성을 함께 확보했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성별 표지 보존
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 원문은 집합적 대상을 가리키지만 남성 복수 구성어를 사용합니다. 한국어에서는 관용적이면서도 원문의 언약적 호칭을 유지하는 ‘이스라엘 자손’이 가장 균형 잡힌 대응입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
