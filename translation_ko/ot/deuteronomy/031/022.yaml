  naturalness: ‘모세는 그날 이 노래를 써서, 그것을 이스라엘 자손에게 가르쳤습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘써서’는 이 문맥에서 연속된 행위를 자연스럽게 연결하며, ‘그것을’은 노래를 가르친 대상임을 분명히 합니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל에 대한 한국어 성경의 확립된 관용적 대응이며, 집단적 언약 명칭을 유지합니다. 각주도 가능한 대안과 해당 표현의 집단적 용법을 적절히 설명합니다.
