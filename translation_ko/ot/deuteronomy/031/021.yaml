    issue: ‘이 노래가 그 앞에서 증언하는 증인이 될 것입니다’
    rationale: ‘증언하는 증인’은 동어 반복에 가깝고, ענתה의 기본적인 ‘응답하다’라는 어휘상을 본문에서 잃습니다. ‘그 앞에서 증인으로서 응답할 것입니다’가 더 충실하고 자연스럽습니다.
