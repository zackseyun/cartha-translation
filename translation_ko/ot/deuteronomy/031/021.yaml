source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
  footnotes:
  - marker: a
    text: Or 'find him' or 'overtake him' for 'come upon him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'before him' may be understood more forcefully as 'against him' in context, since the song functions as a witness.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his inclination' (or 'intent/imagination'), referring to his inner disposition.
    reason: lexical_alternative
  - marker: d
    text: Hebrew simply 'that I swore'; 'to give' is implied by context and parallel covenant-language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 재앙과 고난이 그에게 닥칠 때, 이 노래가 그 앞에서 증언하는 증인이 될 것입니다. 그것이 그의 자손의 입에서 잊히지 않을 것이기 때문입니다. 내가 그의 성향과 그가 오늘 하고 있는 일을 알기 때문입니다. 내가 그를 내가 맹세한 땅으로 들여보내기 전에 말입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 찾아낼 때’, ‘그를 덮칠 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘그 앞에서’는 더 강하게 ‘그를 향하여/그에 맞서’로 이해될 수 있습니다. 노래가 증인으로 기능하기 때문입니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 ‘그의 성향’(또는 ‘의도/상상’)으로, 내적 기울어짐을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 단순히 ‘내가 맹세한’이라고만 되어 있으며, ‘땅’은 문맥상 보충됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצֶאןָ אֹתוֹ
  english_pob_choice: come upon him
  chosen_korean: 그에게 닥칠 때
  alternatives_korean:
  - 그를 찾아낼 때
  - 그를 덮칠 때
  lexicon: HALOT
  rationale: 이 문맥의 רָעוֹת / צָרוֹת가 주어가 되어 사람을 만나는 뜻이므로, 한국어에서는 ‘닥치다’가 가장 자연스럽고 재난이 덮쳐 오는 뉘앙스를 살립니다.
- source_word: וְעָנְתָה ... לְעֵד
  english_pob_choice: will answer before him as a witness
  chosen_korean: 이 노래가 그 앞에서 증언하는 증인이 될 것입니다
  alternatives_korean:
  - 이 노래가 그 앞에서 답할 것입니다
  - 이 노래가 그 앞에서 증언할 것입니다
  lexicon: HALOT
  rationale: עָנָה의 ‘응답/대답하다’와 לְעֵד의 ‘증인’ 기능을 함께 살리기 위해, POB의 ‘answer’보다 한국어에서는 ‘증언하는 증인’으로 옮겨 말의 응답성과 증언 기능을 동시에 드러냈습니다.
- source_word: מִפִּי זַרְעוֹ
  english_pob_choice: from the mouth of his offspring
  chosen_korean: 그의 자손의 입에서
  alternatives_korean:
  - 그의 후손의 입에서
  - 그의 자손의 입에서 나오지 않을
  lexicon: HALOT
  rationale: ‘입’은 암송과 전승의 구체적 이미지를 유지하며, זֶרַע는 여기서 집단적 후손을 가리키므로 ‘자손’이 가장 무난합니다.
- source_word: יִצְרוֹ
  english_pob_choice: his inclination
  chosen_korean: 그의 성향
  alternatives_korean:
  - 그의 기울어짐
  - 그의 의도
  - 그의 본성
  lexicon: HALOT
  rationale: יִצֶר의 내적 기울어짐을 한국어의 ‘성향’으로 옮겨, 인간 내면의 방향성을 살리되 지나친 교리적 확정을 피했습니다.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  english_pob_choice: what he is doing today
  chosen_korean: 그가 오늘 하고 있는 일
  alternatives_korean:
  - 그가 오늘 하고 있는 것
  - 그가 오늘 행하는 일
  lexicon: HALOT
  rationale: 현재 진행 중인 행동을 자연스러운 한국어로 옮기되, 단순한 습관이 아니라 ‘오늘’의 현재적 상태를 강조했습니다.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  english_pob_choice: that I swore
  chosen_korean: 내가 맹세한 땅
  alternatives_korean:
  - 내가 맹세한 것
  - 내가 맹세한 그 땅
  lexicon: HALOT
  rationale: 히브리어는 여기서 목적어를 생략한 채 ‘내가 맹세한’으로 끝나지만, 문맥상 땅을 가리키므로 한국어에서는 앞의 ‘땅’을 받아 자연스럽게 풀었습니다.
theological_decisions:
- issue: 'לְפָנָי/ו의 방향성: ‘앞에서’와 ‘그에 맞서’ 사이의 긴장'
  chosen_reading: ‘그 앞에서’로 두되, 증인 기능은 바로 뒤의 ‘증언하는 증인’으로 명시했습니다.
  alternative_readings:
  - 그에게 맞서
  - 그의 면전에서
  rationale: 본문은 문자적으로는 ‘그 앞에서’이지만, 노래가 증인으로 기능한다는 점 때문에 대립적 뉘앙스가 있습니다. 본문에는 과도한 해석을 넣지 않고, 증언 표현으로 기능을 분명히 했습니다.
  doctrine_reference: 본문의 법정-증언 이미지를 보존하되 과잉 해석은 피함
