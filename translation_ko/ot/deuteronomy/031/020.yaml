  verdict: revise
  source_fidelity: 히브리어는 이스라엘을 집단적 단수로 가리킨 뒤, וַעֲבָדוּם(‘그들이 그들을 섬기고’)와 וְנִאֲצוּנִי(‘그들이 나를 멸시하고’)에서 복수로 전환하며, וְהֵפֵר(‘그가 깨뜨리고’)에서 다시 단수로 돌아옵니다. 현 번역은 한국어 동사가 수를 표시하지 않는 점을 고려하더라도 이 복수 전환과 마지막 단수 복귀를 모두 평준화합니다.
  naturalness: 개정문은 원문의 의도적인 수 전환을 대명사로 드러냅니다. 한국어에서 다소 두드러지는 전환이지만, 각주로 설명하면 현대의 격식 있는 성경 문체 안에서 이해 가능하며 원문 충실성을 우선할 수 있습니다.
  terminology: ‘젖과 꿀이 흐르는 땅’, ‘다른 신들’, ‘섬기다’, ‘멸시하다’, ‘언약을 깨뜨리다’는 원문의 어휘와 언약 문맥을 자연스럽게 전달합니다. ‘멸시하다’는 נָאַץ의 경멸·모욕의 의미를 ‘업신여기다’보다 간결하고 문체적으로 안정되게 나타냅니다.
