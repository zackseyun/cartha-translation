  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
  footnotes:
  - marker: a
    text: Hebrew shifts from singular ('him... he') to plural ('they will spurn me'), treating Israel both as one people and as many persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'despise me' for 'spurn me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 내가 그의 조상들에게 맹세한 땅으로, 곧 젖과 꿀이 흐르는 땅으로 데려가서 그가 먹고 배부르며 살찌게 되면, 그는 다른 신들에게로 돌아서서 그들을 섬기고 나를 업신여기며 내 언약을 깨뜨릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이스라엘을 가리켜 단수에서 복수로 옮겨 가며 말합니다. 이 번역은 그 집단적 단수 표현을 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: הָאֲדָמָה
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 토지
  - 땅
  lexicon: HALOT
  rationale: 언약적·지리적 문맥에서 추상적 '흙/토양'보다 약속의 땅을 가리키는 '땅'이 자연스럽고 정확합니다.
- source_word: זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 흐르는 땅
  lexicon: HALOT
  rationale: 풍요를 나타내는 고정 관용구이므로, 한국어에서도 관용성을 살려 '젖과 꿀'을 유지하는 것이 적절합니다.
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים וַעֲבָדוּם
  english_pob_choice: he will turn to other gods and serve them
  chosen_korean: 다른 신들에게로 돌아서서 그들을 섬기고
  alternatives_korean:
  - 다른 신들에게로 돌아서서 그들을 섬기고
  - 다른 신들을 따르고 섬기고
  lexicon: HALOT
  rationale: '''돌아서다''는 배교의 방향 전환을 잘 드러내며, ''섬기다''는 종교적 충성을 포함하는 עבד의 기본 의미를 보존합니다.'
- source_word: וְנִאֲצוּנִי
  english_pob_choice: spurn me
  chosen_korean: 나를 업신여기며
  alternatives_korean:
  - 나를 경멸하며
  - 나를 업신여기며
  - 나를 멸시하며
  lexicon: HALOT
  rationale: 히브리어는 경멸/멸시의 뉘앙스를 가지므로, '업신여기다'가 관계적이고 강한 모욕감을 비교적 잘 전달합니다.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  english_pob_choice: break my covenant
  chosen_korean: 내 언약을 깨뜨릴 것입니다
  alternatives_korean:
  - 내 언약을 깨뜨릴 것입니다
  - 내 언약을 어길 것입니다
  - 내 언약을 무너뜨릴 것입니다
  lexicon: HALOT
  rationale: 언약 파기의 관용적 표현으로 '깨뜨리다'가 직역성과 자연성을 함께 지닙니다.
theological_decisions:
- issue: 이스라엘을 가리키는 단수 인칭의 유지
  chosen_reading: '''그를''로 시작해 집단적 단수 표현을 유지했습니다.'
  alternative_readings:
  - '''그들을''로 일반화'
  - 전 구절을 일관되게 복수로 정리
  rationale: 히브리어는 이스라엘을 한 백성으로 보면서도 한 사람처럼 말하는 집단적 단수를 사용하므로, 이를 살려 언약 경고의 수사적 힘을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 배교 언어를 해설어로 약화하지 않음
  chosen_reading: '''다른 신들에게로 돌아서서 그들을 섬기고''라고 번역해, ''우상숭배하다'' 같은 설명어를 넣지 않았습니다.'
  alternative_readings:
  - 다른 신들을 섬겨 우상숭배하고
  - 다른 신들에게로 돌아서서
  rationale: 본문은 행동 자체를 말하므로, 그 결과를 해설하는 용어를 덧붙이기보다 원문이 말하는 전환과 섬김의 행위를 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1
