    rationale: 원문은 ‘그를/그가/그는’에서 ‘그들이’로 전환했다가 마지막 동사에서 다시 집단적 단수로 돌아옵니다. 현행 한국어 문장은 모든 동작을 암묵적으로 단수로 처리하며, 각주의 ‘단수에서 복수’ 설명도 번역문 자체에서 확인되지 않고 마지막 단수 복귀도 언급하지 않습니다.
  - severity: low
    issue: 각주가 원문의 수 전환 전체를 정확히 설명하지 못합니다.
    rationale: 복수 전환 뒤 마지막 동사(‘내 언약을 깨뜨리고’)는 다시 단수입니다. 각주에 이 복귀까지 밝혀야 독자가 번역의 대명사 전환을 이해할 수 있습니다.
