  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
  footnotes:
  - marker: a
    text: Or 'you will surely corrupt yourselves' / 'you will surely become corrupt.' The Hebrew intensifies the verb 'corrupt' and may be understood reflexively or intransitively here.
    reason: lexical_alternative
  - marker: b
    text: Or 'disaster' or 'calamity' instead of 'the evil'; the Hebrew רָעָה can denote harmful trouble as well as evil in a broader sense.
    reason: lexical_alternative
  - marker: c
    text: '''In the latter days'' can also mean ''in days to come''; the phrase is future-oriented and can carry eschatological weight depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 죽은 뒤에 너희가 반드시 부패하여 내가 너희에게 명령한 길에서 벗어날 것을 내가 압니다. 그리하면 마지막 날들에 너희에게 재앙이 닥칠 것입니다. 이는 너희가 야훼의 눈에 악한 일을 하여, 너희 손의 작품으로 그를 분노하게 할 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부패하다’는 여기서 ‘스스로 부패하다’ 또는 ‘스스로 타락하다’라는 반사적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재앙’은 히브리어 רָעָה가 여기서 지닐 수 있는 ‘악’뿐 아니라 ‘해악, 재난’의 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘마지막 날들’은 ‘훗날’이라는 단순한 미래를 가리킬 수도 있지만, 문맥에 따라 종말론적 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  english_pob_choice: you will surely act corruptly
  chosen_korean: 너희가 반드시 부패하여
  alternatives_korean:
  - 너희가 반드시 스스로 부패하여
  - 너희가 철저히 타락하여
  lexicon: HALOT
  rationale: 원문의 강한 강조(부정확한 반복 구조)를 살리되, 한국어에서는 ‘부패하다’가 언약적·도덕적 타락을 자연스럽게 드러냅니다.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  english_pob_choice: and turn aside from the way
  chosen_korean: …길에서 벗어날 것을
  alternatives_korean:
  - …길에서 떠날 것을
  - …길을 벗어날 것을
  lexicon: HALOT
  rationale: ‘길’은 명령받은 삶의 방향을 가리키는 관용구이므로, ‘벗어나다’로 직역성과 자연스러움을 함께 살렸습니다.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  english_pob_choice: and evil will befall you
  chosen_korean: 너희에게 재앙이 닥칠 것입니다
  alternatives_korean:
  - 너희에게 악이 닥칠 것입니다
  - 너희에게 재난이 닥칠 것입니다
  lexicon: HALOT
  rationale: הָרָעָה는 문맥상 단순한 도덕악보다 닥쳐오는 해악·재앙을 뜻할 수 있어, 한국어에서는 ‘재앙’이 더 분명합니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 훗날에
  - 이후의 날들에
  lexicon: HALOT
  rationale: 미래 지향성과 종말론적 울림을 보존하면서도 한국어로 자연스럽게 들리도록 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 원문의 관용구를 직접 살려 하나님의 평가 기준을 ‘눈’의 이미지로 유지했습니다.
- source_word: לְהַכְעִיסוֹ
  english_pob_choice: provoking him to anger
  chosen_korean: 그를 분노하게 할
  alternatives_korean:
  - 그를 노하게 할
  - 그의 진노를 일으킬
  lexicon: HALOT
  rationale: 히필의 원인-결과 관계를 살리기 위해 ‘분노하게 하다’로 옮겼고, 언약적 분노의 무게도 유지했습니다.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  english_pob_choice: by the work of your hands
  chosen_korean: 너희 손의 작품으로
  alternatives_korean:
  - 너희 손으로 만든 것으로
  - 너희 손의 일로
  lexicon: HALOT
  rationale: 이 표현은 우상 제작을 포함할 수 있는 관용구이므로, ‘작품’으로 손으로 만든 산물을 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
