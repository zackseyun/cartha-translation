  - 너희에게 재난이 닥칠 것입니다
  lexicon: HALOT
  rationale: הָרָעָה는 문맥상 단순한 도덕악보다 닥쳐오는 해악·재앙을 뜻할 수 있어, 한국어에서는 ‘재앙’이 더 분명합니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 훗날에
  - 이후의 날들에
  lexicon: HALOT
  rationale: 미래 지향성과 종말론적 울림을 보존하면서도 한국어로 자연스럽게 들리도록 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
