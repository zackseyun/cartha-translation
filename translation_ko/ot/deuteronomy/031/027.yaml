  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
  footnotes:
  - marker: a
    text: Hebrew 'your stiff neck,' an idiom for stubbornness or obstinacy.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the LORD'; here the sense is opposition, hence 'against the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 너희의 반역과 너희의 뻣뻣한 목을 알고 있기 때문입니다[a]. 보십시오, 내가 오늘 너희와 함께 아직 살아 있는 동안에도 너희는 야훼[b]께 반역해 왔는데, 내 죽음 뒤에는 얼마나 더 그러하겠습니까!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘너희의 뻣뻣한 목’이며, 완고함과 고집을 뜻하는 관용적 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼와 함께’이지만, 여기서는 반역의 대상인 야훼를 가리키므로 ‘야훼께’가 문맥상 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  english_pob_choice: your rebellion
  chosen_korean: 너희의 반역
  alternatives_korean:
  - 너희의 패역
  - 너희의 반항
  lexicon: HALOT
  rationale: מֶרִי는 언약에 대한 반역·불복종을 뜻하므로, 한국어에서는 의미를 직접 드러내는 ‘반역’이 가장 간결하고 분명합니다.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  english_pob_choice: your stiff neck
  chosen_korean: 너희의 목이 뻣뻣함
  alternatives_korean:
