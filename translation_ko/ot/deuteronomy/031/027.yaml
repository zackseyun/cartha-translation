  - 너희의 고집 센 목
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘목이 뻣뻣함’으로 옮겼습니다.
- source_word: וְאֶת ...
  english_pob_choice: you have been rebellious against Yahweh
  chosen_korean: 야훼께 반역해 왔는데
  alternatives_korean:
  - 야훼와 함께 반역해 왔는데
  - 야훼를 거슬러 왔는데
  lexicon: HALOT
  rationale: עִם는 문자적으로 ‘함께’이지만 이 문맥에서는 반역의 대상/방향을 나타내므로 한국어에서는 ‘~께 반역하다’가 가장 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기 본문의 יְהוָה는 고유명사로서 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: 직접적인 하나님의 이름 표기
  chosen_reading: ‘야훼’로 표기하여 언약적 고유명을 보존했습니다.
  alternative_readings:
  - ‘주’로 완화하여 표기
  - 전통적 교회 용례인 ‘여호와’ 사용
  rationale: 본문은 제목어가 아니라 테트라그람마톤을 직접 사용하므로, 독자가 하나님의 개인 이름을 인식하도록 고유명 표기를 유지하는 것이 본문 효과를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְאַף כִּי의 점증 표현
  chosen_reading: ‘얼마나 더’로 번역해 현재의 반역에서 미래의 더 큰 반역으로 나아가는 수사적 상승을 살렸습니다.
  alternative_readings:
  - ‘더욱이’
  - ‘심지어’
  rationale: 히브리어 결합구는 단순 접속이 아니라 논증적 강화이므로, 한국어에서도 비교·증강의 뉘앙스를 분명히 해야 합니다.
  doctrine_reference: 수사적 강조의 점증 표현
