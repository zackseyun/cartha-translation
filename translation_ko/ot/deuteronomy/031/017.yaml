  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
  footnotes:
  - marker: a
    text: Or 'they will be devoured'; literally, 'and it/he will be for eating.' The Hebrew is compressed and may express becoming vulnerable to destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my God is not in my midst.' The singular wording personifies Israel as one speaker.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그날에 내 분노가 그들에게 타오를 것이며, 내가 그들을 버리고 내 얼굴을 그들에게서 숨길 것입니다. 그들은 먹이가 될 것이며[a], 많은 재앙과 환난이 그들을 찾아올 것입니다. 그날에 그는 말할 것입니다. “내 하나님이 내 가운데 계시지 않기 때문에[b] 이 재앙들이 나를 찾아온 것이 아니냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그것/그는 먹을 것이 될 것이다’에 가깝습니다. 이 압축된 표현은 멸망이나 파괴에 취약하게 되는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내 하나님이 내 가운데 계시지 않다’라고 합니다. 단수 표현은 이스라엘을 한 화자로 의인화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  english_pob_choice: my anger will burn
  chosen_korean: 내 분노가 ... 타오를 것이며
  alternatives_korean:
  - 내 분노가 불붙을 것이며
  - 내 노여움이 타오를 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구는 분노/코의 ‘타오름’을 뜻하므로, 자연스러운 한국어로 옮기되 불의 이미지는 유지했습니다.
- source_word: וַעֲזַבְתִּים
  english_pob_choice: I will forsake them
  chosen_korean: 내가 그들을 버리고
  alternatives_korean:
  - 내가 그들을 떠나고
  - 내가 그들을 버리겠습니다
  lexicon: HALOT
  rationale: 언약적 철수를 나타내는 동사이므로, 단순한 ‘떠나고’보다 ‘버리고’가 더 강한 심판의 뉘앙스를 살립니다.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  english_pob_choice: hide my face from them
  chosen_korean: 내 얼굴을 그들에게서 숨기겠습니다
  alternatives_korean:
  - 내 얼굴을 그들에게서 감추겠습니다
  - 그들을 향한 내 얼굴을 돌리겠습니다
  lexicon: HALOT
  rationale: 신학적 비중이 큰 관용구를 직역에 가깝게 유지하여, 단순한 ‘부재’로 완화하지 않았습니다.
- source_word: וְהָיָה לֶאֱכֹל
  english_pob_choice: they will become prey / they will be devoured
  chosen_korean: 그들은 먹히게 될 것이며
  alternatives_korean:
  - 그들은 먹힐 것이며
  - 그들은 먹이가 될 것이며
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현(‘먹을 것이 됨’)을 한국어의 수동 가능성으로 옮겨, 해석을 과도하게 좁히지 않았습니다.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  english_pob_choice: my God is not among me
  chosen_korean: 내 하나님이 내 가운데 계시지 않으니
  alternatives_korean:
  - 내 하나님이 내 가운데 없으니
  - 내 하나님이 내 안에 계시지 않으니
  lexicon: HALOT
  rationale: ‘내 가운데’는 공동체적/언약적 임재를 드러내는 מקור 표현을 보존하며, 한국어에서는 더 자연스럽습니다.
theological_decisions:
- issue: 집단적 단수와 인칭의 유지
  chosen_reading: 하나님의 행위는 복수 대상인 ‘그들’로, 이스라엘의 자기 고백은 히브리어의 단수 인칭 ‘그는... 나를’로 유지했습니다.
  alternative_readings:
  - 이스라엘을 단수로 일관되게 옮김
  - 자연스러운 한국어를 위해 전부 복수로 풀어씀
  rationale: 본문은 이스라엘을 한 사람처럼 말하는 수사와 공동체를 향한 심판을 함께 담고 있어, 두 층위를 모두 드러내는 편이 원문에 더 충실합니다.
  doctrine_reference: 번역 철학 §5 (핵심 용어 일관성과 문맥상 예외)
- issue: 하나님의 얼굴을 숨김
  chosen_reading: ‘내 얼굴을 숨기겠습니다’라는 관용구를 그대로 살려 언약적 관계의 철회를 드러냈습니다.
  alternative_readings:
  - 내 임재를 거두겠습니다
  - 내 얼굴을 돌리겠습니다
  rationale: 이는 단순한 거리두기가 아니라 심판으로서의 관계적 철수이므로, 관용구를 보존해야 신학적 긴장이 유지됩니다.
  doctrine_reference: 번역 철학 §3 (신학적 긴장 보존)
