  to: 그러면 그날에 내 분노가 그들에게 타오를 것이며, 내가 그들을 버리고 내 얼굴을 그들에게서 숨길 것입니다. 그들은 먹이가 될 것이며[a], 많은 재앙과 환난이 그들을 찾아올 것입니다. 그날에 그는 말할 것입니다. “내 하나님이 내 가운데 계시지 않기 때문에[b] 이 재앙들이 나를 찾아온 것이 아니냐?”
