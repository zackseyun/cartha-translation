id: DEU.31.24
reference: Deuteronomy 31:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת מֹשֶׁ֗ה לִ/כְתֹּ֛ב אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את עַל סֵ֑פֶר עַ֖ד תֻּמָּֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
  footnotes:
  - marker: a
    text: Or 'on a scroll'; the Hebrew ספר can denote a written document or scroll, not necessarily a bound book in the modern sense.
    reason: cultural_note
translation:
  language: ko
  text: 모세가 이 율법의 말씀을 한 책에 다 베껴 써 마치기를 마쳤을 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리에’. 히브리어 ספר는 현대적 의미의 제본된 책뿐 아니라 기록문서나 두루마리를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּ/כַלּוֹת
  english_pob_choice: And when ... had finished
  chosen_korean: '... 마쳤을 때였습니다'
  alternatives_korean:
  - '... 끝냈을 때였습니다'
  - '... 다 썼을 때였습니다'
  lexicon: HALOT
  rationale: 완료를 나타내는 זמן 절을 한국어 자연문으로 옮기되, 문맥상 서술 전환의 기능을 유지하기 위해 ‘~했을 때였습니다’를 사용했습니다.
- source_word: לִ/כְתֹּב
  english_pob_choice: writing
  chosen_korean: 베껴 써
  alternatives_korean:
  - 써
  - 기록해
  lexicon: HALOT
  rationale: 율법의 말씀을 책에 옮겨 적는 행위를 분명히 하기 위해 단순한 ‘쓰다’보다 ‘베껴 쓰다’를 택했습니다.
- source_word: דִּבְרֵי הַ/תּוֹרָה הַ/זֹּאת
  english_pob_choice: the words of this law
  chosen_korean: 이 율법의 말씀
  alternatives_korean:
  - 이 율법의 말들
  - 이 율법의 말씀들
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 개별 단어보다 ‘말씀/말들’에 가깝지만, 한국어에서는 단수적 집합명사 ‘말씀’이 가장 자연스럽고 법적 문맥도 잘 드러냅니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in a book[a]
  chosen_korean: 한 책에
  alternatives_korean:
  - 한 두루마리에
  - 한 기록물에
  lexicon: HALOT
  rationale: ספר는 당시의 문서/두루마리를 가리킬 수 있으나, 본문은 현대 독자에게 과도한 구체화를 피하면서도 기록 매체를 분명히 해야 하므로 ‘한 책에’로 옮겼습니다.
- source_word: תֻּמָּם
  english_pob_choice: until they were complete
  chosen_korean: 다
  alternatives_korean:
  - 완전히
  - 끝까지
  lexicon: HALOT
  rationale: 완료의 정도를 한국어 동사구 안에 흡수해 ‘다 베껴 써’로 표현함으로써, ‘그것들이 완성될 때까지’라는 완료 감각을 자연스럽게 살렸습니다.
theological_decisions:
- issue: ספר의 매체성
  chosen_reading: 본문에는 현대적 ‘책’으로 읽히는 오해를 피하되, 본문 자체의 기록 매체를 과도하게 주석화하지 않고 ‘한 책에’로 번역했습니다.
  alternative_readings:
  - ‘한 두루마리에’로 더 구체화
  - ‘한 문서에’로 중립화
  rationale: 히브리어 ספר는 현대적 제본책보다 문서/두루마리일 수 있으나, 이 절의 핵심은 기록이 완결되었다는 점입니다. 본문에서는 읽기 쉬운 중립적 표현을 유지하고, 매체 가능성은 각주로 처리하는 편이 더 적절합니다.
  doctrine_reference: 본문-문헌적 정밀성
