base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''play the prostitute after the foreign gods.'' The expression uses sexual infidelity as a metaphor for covenant unfaithfulness through idolatry.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew has singular forms in 'he is entering' and 'with him,' using a collective singular for Israel/the people; English renders the sense with plurals for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “보십시오, 당신은 곧 당신의 조상들과 함께 잠들 것입니다. 그러면 이 백성은 일어나 그들이 들어가게 될[b] 땅의 이방 신들을 따라 음행할 것이며[a], 나를 버리고 내가 그들과 맺은 나의 언약을 깨뜨릴 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 땅의 이방 신들 뒤를 따라 음행하다’라는 표현을 사용합니다. 성적 불성실을 우상숭배를 통한 언약적 불성실의 은유로 사용한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그가 들어가며’와 ‘그의 가운데’에 단수 형태를 사용합니다. 이는 이스라엘, 곧 백성을 가리키는 집합적 단수이며, 한국어에서는 의미를 분명히 하기 위해 복수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이름 형태를 살려 번역하라는 POB 원칙에 따라 신적 호칭 대체어가 아니라 고유명사로 옮겼습니다.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  english_pob_choice: Behold, you are about to lie down with your fathers
  chosen_korean: 보아라, 네가 곧 네 조상들과 함께 누울 것이다
  alternatives_korean:
  - 보아라, 네가 네 조상들과 함께 잠들 것이다
  - 보아라, 네가 죽어 네 조상들과 함께 모일 것이다
  lexicon: HALOT
  rationale: 죽음의 완곡한 히브리어 관용구를 그대로 살리되, 현대 한국어에서 자연스러운 ‘누울 것이다’로 옮겨 임박성을 유지했습니다.
- source_word: וְזָנָה
  english_pob_choice: prostitute themselves
  chosen_korean: 음행하고
  alternatives_korean:
  - 창녀처럼 행하고
  - 음란하게 행하고
  - 부정하게 되고
  lexicon: HALOT
  rationale: 우상숭배를 향한 언약적 불신실함의 성적 은유를 유지하되, 한국어에서 지나치게 노골적이거나 어색한 표현은 피했습니다.
- source_word: אַחֲרֵי אֱלֹהֵי נֵכַר הָאָרֶץ
  english_pob_choice: after the foreign gods of the land
  chosen_korean: 그들이 들어가게 될 땅의 이방 신들을 따라
  alternatives_korean:
  - 그 땅의 낯선 신들을 따라
  - 그 땅의 외국 신들을 따라
  lexicon: HALOT
  rationale: נֵכַר의 외래성은 ‘이방’으로, אחרי는 ‘따라’로 옮겨 원문의 방향성과 우상숭배의 추종성을 드러냈습니다.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  english_pob_choice: and break my covenant
  chosen_korean: 내 언약을 깨뜨릴 것이다
  alternatives_korean:
  - 내 언약을 어길 것이다
  - 내 언약을 폐할 것이다
  lexicon: HALOT
  rationale: 언약 문맥의 הפר를 가장 직관적으로 드러내는 동사로 ‘깨뜨리다’를 선택해 언약 위반의 강도를 살렸습니다.
theological_decisions:
- issue: 우상숭배의 성적 은유 보존
  chosen_reading: ‘음행하고’로 옮겨 성적 은유를 약화하지 않고 유지했습니다.
  alternative_readings:
  - 부정하게 되고
  - 신실하지 않게 되고
  rationale: 히브리어는 언약 파기를 우상숭배와 연결하는 강한 성적 은유를 사용하므로, 이를 순화하면 본문의 경고 강도가 줄어듭니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 이스라엘을 가리키는 집합적 단수의 처리
  chosen_reading: 문맥상 한국어에서는 ‘이 백성은 … 그들이 …’처럼 자연스럽게 처리했습니다.
  alternative_readings:
  - 그 백성은 … 그 백성이 …
  - 그 백성은 … 그가 …
  rationale: 히브리어 집합적 단수는 한국어에서 반복될 경우 부자연스러워지므로, 본문의 대상과 의미를 유지하는 범위 안에서 복수로 풀었습니다.
  doctrine_reference: Translation philosophy §§5, 6
