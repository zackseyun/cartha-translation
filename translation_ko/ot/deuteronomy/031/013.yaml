  to: 그들의 자녀들, 곧 알지 못하던 자들도 듣고 배워, 여러분이 요단강을 건너 차지하려고 들어가는 그 땅에서 여러분이 사는 모든 날 동안 여러분의 하나님 야훼를 경외하게 될 것입니다.
  rationale: 원문의 주절과 결과 연쇄(‘듣고 배워 … 경외하게 될 것입니다’)를 회복하고, ‘요단을 건너 … 차지하려고 들어가는 땅’이라는 목적 관계 및 ‘그 땅에서 사는 모든 날 동안’이라는 기간 표현을 보존했습니다. 목적어가 명시되지 않은 ‘알지 못하던’은 원문의 열린 표현을 유지합니다.
