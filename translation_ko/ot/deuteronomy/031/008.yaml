  text: 야훼께서 친히 여러분보다 앞서 가십니다. 그분께서는 여러분과 함께 계실 것이며, 여러분을 놓아 버리지도[a] 않고 버리지도 않으실 것입니다. 두려워하지 말며 낙담하지도 마십시오.
  philosophy: optimal-equivalence
  footnotes:
