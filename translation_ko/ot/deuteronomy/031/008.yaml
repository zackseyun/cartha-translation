  source_fidelity: יַרְפְּךָ와 יַעַזְבֶךָּ는 서로 구별되어야 합니다. 초안의 ‘버리지도, 떠나지도’는 첫 동사의 ‘놓다/손을 놓다’라는 뜻을 충분히 드러내지 못하며, 둘째 동사의 ‘버리다’와의 대응도 불명확합니다. 또한 두 번째 금지의 תֵחָת는 단순히 ‘무서워하다’를 반복하기보다 ‘낙담하다/기가 꺾이다’처럼 두려움과 구별되는 위축·낙담의 뜻을 나타내는 편이 적절합니다.
  naturalness: 합쇼체는 전반적으로 자연스럽습니다. 다만 미래의 약속은 ‘않으실 것입니다’로 명시하고, 두 금지 명령은 ‘두려워하지 말며 낙담하지도 마십시오’로 연결하면 원문의 병렬과 현대 한국어의 문체를 함께 살릴 수 있습니다.
  terminology: ‘야훼’는 제공된 POB 신명 표기 원칙과 일치합니다. ‘친히’는 강조된 독립대명사 הוּא를 잘 반영합니다. רפה는 ‘놓아 버리다’, עזב는 ‘버리다’로 구별하여 번역하고, 관련 각주는 첫 동사에 붙여야 합니다.
