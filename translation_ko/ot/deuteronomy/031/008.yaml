translation:
  language: ko
  text: 야훼께서 친히 여러분보다 앞서 가십니다[a]. 그분께서 여러분과 함께 계실 것이며, 여러분을 버리지도, 떠나지도 않으십니다. 두려워하지 말고, 무서워하지도 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그분께서 여러분을 놓아주지 않으실 것이다'로, '그분께서 여러분을 버리지 않으실 것이다'의 다른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 원문에 직접 나온 여호와 이름을 음역해, 언약적 고유명과 POB의 स्रोत-직역 원칙을 보존했습니다.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  english_pob_choice: himself is the one going before you
  chosen_korean: 친히 여러분보다 앞서 가십니다
  alternatives_korean:
  - 여러분 앞에서 가십니다
  - 스스로 여러분 앞에 가십니다
  lexicon: HALOT
  rationale: 독립 대명사의 강조를 '친히'로 살리고, 진행형 분사의 선행 이미지를 '앞서 가십니다'로 자연스럽게 옮겼습니다.
- source_word: יַרְפְּךָ / יַעַזְבֶךָּ
  english_pob_choice: will not fail you or forsake you
  chosen_korean: 버리지도, 떠나지도 않으십니다
  alternatives_korean:
  - 실망시키지도, 버리지도 않으십니다
  - 포기하지도, 떠나지도 않으십니다
  lexicon: HALOT
  rationale: 두 동사의 긴장을 한국어에서 분리해 보여 주기 위해 첫 동사는 '버리다'보다 덜 관용적인 의미를 살려 '떠나다'와 병렬로 처리했습니다.
- source_word: לֹא תִירָא וְלֹא תֵחָת
  english_pob_choice: Do not fear or be dismayed
  chosen_korean: 두려워하지 말고, 무서워하지도 마십시오
  alternatives_korean:
  - 두려워하지 말고, 낙담하지도 마십시오
  - 두려워하지 말고, 기가 죽지도 마십시오
  lexicon: HALOT
  rationale: 명령형 금지를 현대 한국어의 직접적 금지 표현으로 옮겼고, 두 번째 동사의 공포/위축 뉘앙스를 '무서워하다'로 반복 변주해 중복을 최소화했습니다.
