  to: 야훼께서 친히 여러분보다 앞서 가십니다. 그분께서는 여러분과 함께 계실 것이며, 여러분을 놓아 버리지도[a] 않고 버리지도 않으실 것입니다. 두려워하지 말며 낙담하지도 마십시오.
  rationale: 원문의 강조(‘친히’), 앞서 가심, 함께하심, 그리고 두 개의 구별된 부정 약속을 유지했습니다. רפה의 ‘놓다/손을 놓다’와 עזב의 ‘버리다’를 구별했으며, 어휘 대안 각주를 실제 해당 동사에 붙였습니다. 마지막 두 금지는 ‘두려움’과 ‘낙담’으로 구별하여 תירא와 תֵחָת의 병렬을 보존했습니다.
  reviewer_model: gpt-5.6-terra
