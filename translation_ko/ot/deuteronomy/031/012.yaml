  source_fidelity: 히브리어의 소집 명령, 네 부류의 열거, 반복된 목적, 야훼를 경외함, 그리고 율법의 모든 말씀을 지켜 행함을 대체로 충실히 반영합니다. 다만 초안의 ‘행하도록 하려는 것입니다’는 원문의 명령문과 목적절을 서술적 의도 표현으로 바꾸며 한국어로도 부자연스럽습니다. שׁמר + לעשות의 ‘지켜 행하다’ 의미도 명시하는 편이 적절합니다.
  naturalness: ‘그들이 … 행하도록 하려는 것입니다’는 합쇼체 명령문 문맥에서 어색하고 문법적으로도 불필요하게 우회적입니다. 목적절을 앞세워 ‘…하도록 … 모으십시오’로 구성하면 자연스럽고 원문의 논리 관계도 보존됩니다.
  terminology: ‘야훼’, ‘율법’, ‘경외하다’, ‘어린아이들’은 적절합니다. גֵר를 ‘나그네’로 옮기는 것은 가능하나 현대 한국어에서 일시적 여행자를 연상시킬 수 있으므로 각주가 그 거주 외국인/비토착 거주민의 뜻을 분명히 밝혀야 합니다. 각주 a의 ‘כאן’은 한국어 문장 안의 명백한 혼입 오류이므로 ‘여기서’로 고칩니다.
