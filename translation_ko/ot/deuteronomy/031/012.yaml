source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
  footnotes:
  - marker: a
    text: Or 'the resident foreigner' for 'the sojourner.' The Hebrew term refers to a non-native resident living among Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'within your gates,' an idiom referring to those living within your towns or community.
    reason: cultural_note
  - marker: c
    text: Or 'revere the LORD your God.' The Hebrew verb includes the sense of reverent fear and obedient awe.
    reason: lexical_alternative
  - marker: d
    text: Or 'this instruction.' The Hebrew torah can mean 'instruction' as well as 'law'; here 'law' fits the covenantal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성—곧 남자들과 여자들과 어린아이들과 너희 성문 안에 있는 나그네를—모으십시오. 그들이 듣고, 배우고, 또 너희의 하나님 야훼를 경외하며, 이 율법의 모든 말씀을 행하도록 하려는 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 כאן의 גֵר를 옮긴 것으로, 이스라엘 공동체 안에 거주하는 비토착민을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문 안에’는 도시 안에 거주하는 공동체를 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘경외하며’는 두려움과 순종적 경외를 함께 담습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘율법’은 여기서 ‘가르침’으로도 옮길 수 있으나, 언약적 문맥에서는 ‘율법’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  english_pob_choice: Assemble
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모이게 하십시오
  - 집합시키십시오
  lexicon: HALOT
  rationale: 히필 명령형의 강한 소집 명령을 자연스러운 현대 한국어로 옮기되, 단순한 자발적 ‘모임’보다 주도적 소집의 의미를 살리기 위해 ‘모으십시오’를 택했습니다.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  english_pob_choice: the men, the women, the little children
  chosen_korean: 남자들과 여자들과 어린아이들
  alternatives_korean:
  - 남자들과 여자들과 아이들
  - 남자들, 여자들, 그리고 어린이들
  lexicon: HALOT
  rationale: 본문이 집단을 열거하므로 이를 그대로 살렸고, טַף의 어린 의존자 뉘앙스를 반영해 ‘어린아이들’로 옮겼습니다.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  english_pob_choice: the sojourner within your gates
  chosen_korean: 너희 성문 안에 있는 나그네
  alternatives_korean:
  - 너희 성읍 안에 있는 거주 외국인
  - 너희 성문 안의 거류민
  lexicon: HALOT
  rationale: גֵר의 법적·공동체적 뉘앙스를 살리면서도 한국어에서 이해되는 표현으로 ‘나그네’를 택했고, 성문/성읍의 관용구는 ‘성문 안에 있는’으로 유지했습니다.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: fear Yahweh your God
  chosen_korean: 너희의 하나님 야훼를 경외하며
  alternatives_korean:
  - 너희의 하나님 야훼를 두려워하며
  - 너희의 하나님 야훼를 경외하고
  lexicon: HALOT
  rationale: 예배적·순종적 두려움을 함께 담는 ירא의 의미를 반영해 ‘경외하며’로 옮겼습니다. POB의 고유명 원칙에 따라 יהוה는 ‘야훼’로 표기했습니다.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  english_pob_choice: all the words of this law
  chosen_korean: 이 율법의 모든 말씀
  alternatives_korean:
  - 이 율법의 모든 말들
  - 이 가르침의 모든 말씀
  lexicon: HALOT
  rationale: דִּבְרֵי의 ‘말씀들/말들’ 가운데 문맥상 자연스럽고, תורה의 언약적 문맥에 맞는 ‘율법’을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יהוה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, 표제어 대체어인 ‘주’보다 이름 자체를 드러내는 ‘야훼’가 स्रोत 직역과 주해 가능성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 청중의 열거를 평탄화하지 않음
  chosen_reading: ‘남자들과 여자들과 어린아이들과 너희 성문 안에 있는 나그네’를 그대로 열거했습니다.
  alternative_readings:
  - 백성 모두를
  - 모든 사람을
  rationale: 히브리어는 포괄적 요약이 아니라 집단의 구체적 열거를 사용하므로, 사회적 범주를 지우지 않고 본문 구조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4'
