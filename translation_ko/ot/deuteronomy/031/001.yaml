  text: 그때 모세가 가서 이 말씀들을 온 이스라엘에게 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 이어지는 접속사 와우는 영어에서 ‘Then’으로 옮길 수 있으며, 더 형식적으로는 ‘And’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 나아가
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 גם הלך의 기본적 이동 의미를 유지하기 위해 ‘가서’로 옮겼습니다. 이어지는 ‘전했습니다’와 함께 사건의 흐름이 잘 드러납니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 전했습니다
  alternatives_korean:
  - 말했습니다
  - 연설했습니다
  lexicon: HALOT
  rationale: 직접적인 발화라기보다 공개적으로 전달된 내용을 가리키는 문맥이므로, ‘말했습니다’보다 다소 공식적이고 본문 흐름에 맞는 ‘전했습니다’를 택했습니다.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말씀들을
  alternatives_korean:
  - 이 말들을
  - 이것들을
  lexicon: HALOT
  rationale: 문맥상 단순한 음성적 ‘말’이 아니라 모세가 전달하는 계시적 내용이므로, 한국어에서는 자연스럽고도 무게가 있는 ‘말씀들’로 옮겼습니다. 다만 מקור의 복수성과 지시성은 ‘이’와 복수형 ‘-들’로 유지했습니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 온 백성
  lexicon: HALOT
  rationale: 집합명사로서의 공동체 전체를 가리키므로 ‘온 이스라엘’이 가장 자연스럽고, ‘all Israel’의 전체성도 잘 보존합니다.
theological_decisions:
- issue: 모세의 말의 성격
  chosen_reading: ‘이 말씀들’을 모세의 개인 의견이 아니라 이어지는 언약적 경고와 지시를 포함한 공적 전달로 이해했습니다.
  alternative_readings:
  - 단순한 개인 발언으로 읽기
  - 평범한 대화체로 약화시키기
  rationale: 본문은 모세가 ‘이 말씀들’을 온 이스라엘에게 전달하는 장면으로, 언약 갱신 문맥상 공적·권위적 전달의 뉘앙스를 유지하는 것이 중요합니다.
  doctrine_reference: 신명기 31장의 언약 갱신 문맥
- issue: ‘가서’와 ‘전했습니다’의 조합
  chosen_reading: 행동과 발화의 연속을 보존해 서술의 진행성과 엄숙성을 함께 살렸습니다.
  alternative_readings:
  - ‘갔습니다’와 ‘말했습니다’로 평면화하기
  - ‘나아가 말씀했습니다’로 합치기
  rationale: 히브리어의 연속 동작을 한국어에서 지나치게 평면적으로 만들지 않으면서도, 현대 한국어 문체에서 자연스럽게 읽히도록 조정했습니다.
  doctrine_reference: 서사 문체의 충실성
