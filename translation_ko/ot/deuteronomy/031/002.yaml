translation:
  language: ko
  text: 그가 그들에게 말했습니다[a]. “저는 오늘로 백이십 살입니다. 더는 나가고 들어올 수 없습니다. 그리고 야훼께서 저에게 말씀하시기를, ‘너는 이 요단을 건너지 못한다’ 하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나가고 들어오다’는 일상적 활동을 가리킬 수도 있고, 백성을 인도하는 지도 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
