lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 분부하여
  - 명하여
  lexicon: HALOT
  rationale: 완료 연속형 동사 צוה는 권위 있는 명령 행위를 뜻하므로, 서술체에서 자연스럽고 직접적인 ‘명령하여’로 옮겼습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들에게
  alternatives_korean:
  - 레위인들에게
  - 레위 지파 사람들에게
  lexicon: HALOT
  rationale: 지파/직무 집단을 가리키는 표준 명칭이므로 ‘레위 사람들’로 풀어, 뒤의 분사 구문과 자연스럽게 연결했습니다.
- source_word: נֹשְׂאֵי
  english_pob_choice: who carried / the bearers of
  chosen_korean: 메는
  alternatives_korean:
  - 메고 있는
  - 메는 자들인
  - 운반하는
  lexicon: HALOT
  rationale: 분사 נשׂא는 여기서 수식적 성격이 강하므로, 한국어에서는 ‘메는’으로 간결하게 처리해 레위 사람들의 직무를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와의
  alternatives_korean:
  - 야훼의
  lexicon: HALOT
  rationale: 본문 용례와 한국어 교회 문맥의 가독성을 고려해, 본문에서는 통용성이 높은 ‘여호와’를 유지했습니다.
theological_decisions:
- issue: יתרה דיוק? divine name rendering in Korean
  chosen_reading: 본문에서는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  rationale: 영어 POB는 יְהוָה를 ‘Yahweh’로 직역하지만, 한국어 본문은 출판 가독성과 성경 독자층의 수용성을 고려해 통용형을 채택했습니다. 다만 이는 원어 의미를 약화시키려는 것이 아니라 명칭의 식별성을 유지하려는 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name rendering'
