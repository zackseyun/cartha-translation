  text: 온 이스라엘이 와서 야훼, 곧 당신의 하나님 앞에 나타나려고 그분이 선택하실 곳에 이르면, 이 율법을 온 이스라엘 앞에서 그들이 듣는 데서 낭독해야 합니다.[a]
