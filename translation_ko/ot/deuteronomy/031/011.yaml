  source_fidelity: 시간절과 명령의 기본 구조는 반영되어 있으나, 초안의 ‘와서 … 이르면’은 ‘나타나기 위하여’라는 목적절과 ‘그곳에 오다’의 시간절을 다소 어색하게 중첩합니다. 또한 ‘당신의 하나님’은 본문의 언약적 2인칭 소유 표현에 비해 지시 대상이 불분명합니다.
  naturalness: ‘그들이 듣는 데서’는 현대 표준어로 부자연스럽습니다. ‘온 이스라엘이 듣는 가운데’가 공적 낭독과 청취의 뜻을 자연스럽게 드러냅니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. תורה는 문맥상 ‘율법’, קרא는 공적 낭독을 나타내는 ‘낭독하십시오’로 옮기는 것이 적절합니다.
