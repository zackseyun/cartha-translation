  to: 온 이스라엘이 네 하나님 야훼 앞에 나타나기 위하여 그분이 선택하실 곳에 올 때, 너는 이 율법을 온 이스라엘이 듣는 가운데 낭독하십시오.[a]
  rationale: 히브리어의 시간절(‘올 때’) 안에 목적 표현(‘나타나기 위하여’)을 자연스럽게 배치했습니다. 공적 청취를 나타내는 마지막 표현은 현대 표준어에 맞게 다듬었고, 본문과 각주의 신명 표기를 ‘야훼’로 통일했습니다.
