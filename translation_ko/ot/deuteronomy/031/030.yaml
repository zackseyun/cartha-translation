- from: 그때 모세는 이 노래의 말을 온 이스라엘 회중의 귀에 들리도록 끝까지 말했습니다.[a]
  to: 그때 모세는 온 이스라엘 회중이 듣는 가운데 이 노래의 말들을, 그 말들이 다 끝날 때까지 말했습니다.[a]
  rationale: 청중 앞에서 말한다는 히브리어 관용구를 자연스러운 한국어로 옮기고, 원문의 완료 표현 및 그것을 능동적으로 이해하는 대안 가능성을 각주에 보존했습니다. 본문은 영어 POB의 수동적 완료 이해를 따라 ‘그 말들이 다 끝날 때까지’로 번역했습니다.
