translation:
  language: ko
  text: 그때 모세는 온 이스라엘 회중이 듣는 가운데 이 노래의 말들을, 그 말들이 다 끝날 때까지 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세가 그것들을 다 말할 때까지’. 히브리어는 문자적으로 ‘그것들이 끝날 때까지’라고 하며, ‘그것들’은 이 노래의 말들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then Moses spoke
  chosen_korean: 모세는 ... 말했습니다
  alternatives_korean:
  - 모세는 ... 말씀했습니다
  - 모세가 ... 말했습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 자연스러운 서술 동사인 ‘말하다’로 옮기고, 와우 연속의 서사 진행은 ‘그때’로 살렸습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 귀에 들리도록
  alternatives_korean:
  - 듣는 앞에서
  - 들리는 데서
  lexicon: HALOT
  rationale: 직역한 ‘귀에’보다, 청중에게 실제로 들리도록 말한다는 관용적 힘을 한국어로 자연스럽게 드러냈습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 온 이스라엘 회중
  alternatives_korean:
  - 이스라엘의 모든 회중
  - 이스라엘의 온 회중
  lexicon: HALOT
  rationale: קהל은 예배 제도적 ‘교회’보다 먼저 모여 있는 공동체 전체를 가리키므로, POB의 일관된 용법에 맞게 ‘회중’으로 옮겼습니다.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  english_pob_choice: the words of this song
  chosen_korean: 이 노래의 말
  alternatives_korean:
  - 이 노래의 말씀
  - 이 노래의 가사
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘이 노래’가 아니라 ‘이 노래의 말들’이라고 하므로, 구성요소를 드러내는 ‘말’을 남겼습니다.
- source_word: עַד תֻּמָּם
  english_pob_choice: until they were finished
  chosen_korean: 끝까지
  alternatives_korean:
  - 마칠 때까지
  - 다 끝날 때까지
  lexicon: HALOT
  rationale: 어미 대명사가 앞의 ‘말들’을 가리키는 완료 의미를 담고 있지만, 한국어에서는 ‘끝까지 말했습니다’가 자연스럽고 완료감을 잘 전달합니다.
theological_decisions:
- issue: 회중(קהל) 번역에서 교회적 용어 사용 여부
  chosen_reading: ‘회중’으로 번역해 이스라엘의 모인 공동체라는 역사적 의미를 보존했습니다.
  alternative_readings:
  - 교회
  - 모임
  rationale: 본문은 시내산적/언약적 집합체를 가리키므로, 후대 제도적 뉘앙스가 강한 ‘교회’보다 ‘회중’이 source-direct입니다.
  doctrine_reference: 언약 공동체의 역사적 맥락
