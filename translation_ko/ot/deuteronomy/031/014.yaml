  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
  footnotes:
  - marker: a
    text: Or “that I may charge him” or “and I will command him.” The Hebrew verb can denote commanding, charging, or commissioning; here it refers to the LORD's formal appointment of Joshua.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “보십시오, 당신이 죽을 날이 가까웠습니다. 여호수아를 불러, 만남의 장막 안에 함께 서십시오. 내가 그에게 명령하겠습니다.” 그래서 모세와 여호수아는 가서 만남의 장막 안에 함께 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그에게 당부하겠습니다” 또는 “내가 그에게 위임하겠습니다.” 히브리어 동사는 명령하다, 당부하다, 공식적으로 위임하다를 뜻할 수 있습니다. 여기서는 여호수아에게 주어지는 공식적 책무와 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유한 언약명인 테트라그람마톤을 살려, 관습적 대체어인 ‘주님’보다 직접적으로 ‘야훼’로 옮겼습니다.
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 여기
  - 자
  lexicon: HALOT
  rationale: 하나님의 말씀 도입부에서 주의를 끄는 감탄사로, 현대 한국어에서 자연스럽고 간결한 ‘보라’가 적절합니다.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  english_pob_choice: present yourselves / presented themselves
  chosen_korean: 너희 자신을 나타내라 / 자신을 나타냈습니다
  alternatives_korean:
  - 자리를 잡으라 / 자리를 잡았습니다
  - 서라 / 섰습니다
  - 나오라 / 나왔습니다
  lexicon: HALOT
  rationale: 히트파엘의 ‘자신을 드러내어 서다, 출두하다’는 뉘앙스를 살리기 위해, 단순히 ‘서다’보다 공식적이고 의례적인 ‘자신을 나타내다’를 택했습니다.
- source_word: וַאֲצַוֶּנּוּ
  english_pob_choice: that I may command him
  chosen_korean: 내가 그에게 명령하겠다
  alternatives_korean:
  - 내가 그에게 지시하겠다
  - 내가 그를 위임하겠다
  - 내가 그를 임명하겠다
  lexicon: HALOT
  rationale: 본문의 צוה는 여기서 여호수아에게 주어질 공식적 지시를 뜻하지만, 히브리어 동사의 직접성을 살려 ‘명령하다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문이 신적 호칭이 아니라 고유명사를 사용하므로, 한국어 본문에서도 대체어가 아니라 이름 자체를 드러내는 번역이 स्रोत에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וַאֲצַוֶּנּוּ의 기능
  chosen_reading: 여호수아를 세우는 공식적 명령으로 읽습니다.
  alternative_readings:
  - 단순한 지시
  - 임명/위임
  rationale: 문맥은 모세의 후계자 여호수아를 회막 앞에서 공식적으로 세우는 장면이므로, ‘명령’은 단순 지시보다 강하지만 과도한 교회식 용어는 피합니다.
  doctrine_reference: Translation philosophy §1, §5
