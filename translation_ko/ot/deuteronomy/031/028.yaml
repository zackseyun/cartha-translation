base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
  footnotes:
  - marker: a
    text: Or 'the heavens and the earth.' The Hebrew expression is a stock covenant-witness formula in Deuteronomy.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들의 지파의 모든 장로들과 당신들의 관리들을 내게 모으십시오. 내가 그들의 귀에 이 말들을 들려주고, 하늘과 땅을 그들에게 대하여 증인으로 부르겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들과 땅.’ 히브리어 표현은 신명기에서 반복되는 언약 증언 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ אֵלַי
  english_pob_choice: Gather to me
  chosen_korean: 내게 모으십시오
  alternatives_korean:
  - 내게 모으라
  - 내게 집결시키십시오
  lexicon: HALOT
  rationale: חִיל/קהל의 사역 명령으로 여러 지도자들을 한곳에 소집하라는 뜻이므로, 현대 한국어에서 자연스럽고 지시성이 분명한 ‘모으십시오’로 옮겼습니다.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  english_pob_choice: the elders of your tribes
  chosen_korean: 당신들의 지파의 모든 장로들
  alternatives_korean:
  - 당신들의 지파 장로들
  - 당신들의 지파별 장로들
  lexicon: HALOT
  rationale: ‘장로들’은 지파에 속한 지도자들을 가리키는 소유·수식 구조이므로, 원문의 소속 관계를 드러내는 ‘지파의 … 장로들’로 옮겼습니다.
- source_word: שֹׁטְרֵיכֶם
  english_pob_choice: your officers
  chosen_korean: 당신들의 관리들
  alternatives_korean:
  - 당신들의 관원들
  - 당신들의 감독관들
  lexicon: HALOT
  rationale: Deuteronomy의 행정 문맥에서 שֹׁטְרִים은 단순한 서기관보다 하위 행정 담당자에 가깝기 때문에, 기능을 넓게 드러내는 ‘관리들’이 적절합니다.
- source_word: בְאָזְנֵיהֶם
  english_pob_choice: in their hearing
  chosen_korean: 그들의 귀에 이 말들을 들려주고
  alternatives_korean:
  - 그들의 듣는 데서 이 말들을 말하고
  - 그들의 귀에 이 말씀들을 말하고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘귀에’는 실제로는 공개적으로 들리게 말한다는 뜻이므로, 한국어에서는 자연스러운 관용으로 풀어 의미를 보존했습니다.
- source_word: וְאָעִידָה בָּם אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  english_pob_choice: call heaven and earth to witness against them
  chosen_korean: 하늘과 땅을 그들에게 대하여 증인으로 부르겠습니다
  alternatives_korean:
  - 하늘과 땅을 그들에 대하여 증언하도록 부르겠습니다
  - 하늘과 땅을 그들에게 불리어 증인 되게 하겠습니다
  lexicon: HALOT
  rationale: אָנּוּד/עוּד의 법정-언약적 힘을 살려 ‘증인으로 부르다’로 옮겼고, 한국어에서는 목적어를 분명히 하기 위해 ‘그들에게 대하여’라고 했습니다.
theological_decisions:
- issue: 언약 증언 공식
  chosen_reading: 하늘과 땅을 그들에게 대하여 증인으로 부르겠습니다
  alternative_readings:
  - 하늘과 땅을 그들에 대한 증인으로 부르겠습니다
  - 하늘과 땅을 증인으로 삼아 그들을 고발하겠습니다
  rationale: 신명기의 전형적인 언약 증언/소송 공식이므로, 단순한 수사보다 법정적·언약적 긴장을 살리는 표현을 유지했습니다.
  doctrine_reference: 신명기 31장 전체의 언약 갱신과 증언 구조
