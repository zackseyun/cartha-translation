  naturalness: ‘당신들의 지파의’는 중복 소유 표현으로 어색합니다. ‘너희 지파의 모든 장로와 너희 관리들’ 및 ‘그들이 듣는 데서’가 현대 한국어 성서 문체에서 더 자연스럽고 명료합니다. ‘그들에게 불리한 증인으로 세우겠습니다’는 원문의 נגד/בָּם에 해당하는 법정적 방향성을 자연스럽게 드러냅니다.
  terminology: שֹׁטְרִים은 ‘관리들’로 넓게 옮길 수 있습니다. 하늘과 땅은 증인으로 ‘부른다’기보다 한국어에서는 ‘증인으로 세우다’가 법정·언약 문맥에 더 자연스럽습니다. 각주에서는 ‘언약 증언 공식’보다 ‘언약 증인 공식’이 해당 기능을 더 정확히 표현합니다.
