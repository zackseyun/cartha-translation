  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: ko
  text: 야훼께서 그것들을 여러분 앞에 넘겨주실 것이며, 여러분은 내가 여러분에게 명령한 모든 명령에 따라 그들에게 행해야 합니다.
  philosophy: formal
lexical_decisions:
- source_word: וּנְתָנָם / will give them over
  english_pob_choice: will give them over
  chosen_korean: 넘겨주실 것이며
  alternatives_korean:
  - 주실 것이며
  - 내주실 것이며
  lexicon: נתן
  rationale: 출애굽기·신명기 문맥에서 אויב을 ‘넘겨주다/내주다’는 의미를 살려, 단순한 ‘주다’보다 전투적 인도와 패배의 뉘앙스를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 신명기 본문의 여호와 이름은 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: לִפְנֵיכֶם
  english_pob_choice: to you / before you
  chosen_korean: 여러분 앞에
  alternatives_korean:
  - 여러분에게
  - 여러분 앞에서
  lexicon: לפני
  rationale: 히브리어 전치사는 ‘앞에/면전에’의 공간적 대비를 갖지만, POB 개정에서는 도착점보다 ‘적들이 여러분 앞에 놓이게 됨’이라는 상황을 살려 ‘여러분 앞에’로 풀었습니다.
- source_word: כְּכָל הַמִּצְוָה
  english_pob_choice: according to all the commandment
  chosen_korean: 모든 명령에 따라
  alternatives_korean:
  - 모든 계명대로
  - 온갖 명령대로
  lexicon: מצוה
  rationale: 단수형 ‘모든 명령’을 한국어에서도 자연스럽게 유지하되, 신명기의 언약 준수 문맥을 살려 ‘따라’로 옮겼습니다.
theological_decisions:
- issue: 전투 결과를 주시는 주권적 행위의 표현
  chosen_reading: ‘넘겨주실 것이며’로 번역해 야훼의 주권적 넘겨주심과 전쟁 맥락을 드러냈습니다.
  alternative_readings:
  - ‘주실 것이며’
  - ‘내주실 것이며’
  rationale: 본문은 단순한 일반적 선물이 아니라 적들을 이스라엘의 손에 넘기시는 신적 행위를 말하므로, 의미를 약화시키지 않는 동사 선택이 필요합니다.
  doctrine_reference: 신명기 31장 전체의 언약-전쟁 문맥
