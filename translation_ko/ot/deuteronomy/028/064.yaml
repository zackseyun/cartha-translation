  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 현행 각주 표지가 해당 각주의 내용과 맞지 않으며, 각주 a는 אֶרֶץ를 설명하면서 ‘민족들’로 읽는다는 잘못된 결론을 제시합니다. 히브리어의 범위 표현은 ‘땅의 이 끝에서 저 끝까지’로 유지하는 것이 적절합니다.
  naturalness: ‘흩으시고’도 가능하지만, 문장의 미래 예고와 뒤 절의 결과를 자연스럽게 연결하려면 ‘흩으실 것이며’가 더 매끄럽습니다. ‘다른 신들—나무와 돌—’은 이해 가능하나, 한국어에서는 ‘다른 신들, 곧 나무와 돌’이 동격 관계를 더 자연스럽게 드러냅니다.
  terminology: ‘야훼’, ‘모든 민족’, ‘다른 신들’, ‘섬기게 될 것입니다’는 원문 및 프로젝트 방침에 부합합니다. עֵץ וָאָבֶן은 신들 자체의 재료적 성격을 가리키므로 관련 설명 각주를 해당 표현에 붙여야 합니다.
  issues:
