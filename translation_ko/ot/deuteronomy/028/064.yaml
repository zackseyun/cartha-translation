    rationale: 현행 a는 ‘모든 민족’ 뒤에 있으나 אֶרֶץ를 다루고, 현행 b는 ‘흩으시고’ 뒤에 있으나 범위 표현을 설명합니다. 또한 영어 감사 기록의 ‘wood and stone’ 문화 설명은 한국어 본문에서도 ‘나무와 돌’에 연결하는 것이 적절합니다.
