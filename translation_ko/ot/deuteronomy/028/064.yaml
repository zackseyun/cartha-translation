source:
  edition: WLC
  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
  footnotes:
  - marker: a
    text: Or 'from one end of the land to the other end of the land.' Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'earth' is preferred because the context speaks of scattering among all peoples.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wood and stone,' referring to idols made from these materials.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 여러분을 모든 민족[a] 가운데로, 땅 끝에서 땅 끝까지 흩으시고[b], 거기서 여러분은 여러분도 여러분의 조상들도 알지 못하던 다른 신들—나무와 돌—을 섬기게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘나라’로도 번역될 수 있습니다. 여기서는 ‘모든 민족’과 함께 나오는 문맥상 ‘땅’보다 넓은 의미의 ‘민족들’로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅 끝에서 땅 끝까지’입니다. 히브리어의 반복을 살려 전면적인 흩어짐을 강조했습니다.
    reason: source_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ / will scatter you
  english_pob_choice: will scatter you
  chosen_korean: 흩으시고
  alternatives_korean:
  - 분산하시고
  - 흩어지게 하시고
  lexicon: HALOT
  rationale: הפיץ의 사역형은 사람을 흩어지게 만드는 뜻이므로, 자연스러운 한국어로 ‘흩으시고’가 가장 직접적입니다.
- source_word: בְּכָל הָעַמִּים / among all the peoples
  english_pob_choice: among all the peoples
  chosen_korean: 모든 민족 가운데로
  alternatives_korean:
  - 모든 백성 가운데로
  - 모든 사람들 가운데로
  lexicon: HALOT
  rationale: עַמִּים는 ‘민족들/백성들’의 복수이므로, 보다 구체적인 ‘민족’이 적합합니다.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ / from one end of the earth to the other end of the earth
  english_pob_choice: from one end of the earth to the other end of the earth
  chosen_korean: 땅 끝에서 땅 끝까지
  alternatives_korean:
  - 땅 끝에서 이 끝까지
  - 땅에서 땅 끝까지
  lexicon: HALOT
  rationale: 반복 구조를 한국어 관용구로 간결하게 옮기되, 지리적 전면성을 유지했습니다.
- source_word: עֵץ וָאָבֶן / wood and stone
  english_pob_choice: wood and stone
  chosen_korean: 나무와 돌
  alternatives_korean:
  - 목재와 돌
  - 나무와 석재
  lexicon: HALOT
  rationale: 우상의 재료를 지시하는 직설적 표현이므로, 관용적으로 ‘나무와 돌’로 옮겨 우상숭배의 허무함이 드러나게 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 언약명 יהוה를 제목이나 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 고유명 ‘야훼’로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: אֶרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅/나라
  - 나라
  rationale: ‘모든 민족’과 병행되는 전면적 흩어짐의 맥락이므로, 이 구절에서는 ‘땅’이 더 넓은 범위를 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, original-language primacy
