base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
  footnotes:
  - marker: a
    text: Or 'You will sow much seed in the field, but harvest little.' The Hebrew more literally says 'carry much seed out into the field' and 'gather in little.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 씨앗을 밭으로 가지고 나가겠지만, 적게 거두어들일 것입니다. 메뚜기가 그것을 먹어 버릴 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭에 많은 씨앗을 뿌리겠지만, 적게 수확할 것입니다.’ 히브리어는 문자적으로 ‘많은 씨앗을 밭으로 가지고 나가다’와 ‘적게 거두어들이다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  english_pob_choice: much seed
  chosen_korean: 많은 씨앗
  alternatives_korean:
  - 풍성한 씨앗
  - 많은 종자
  lexicon: HALOT
  rationale: זֶרַע는 씨앗/종자를 가리키고 רַב은 수량을 강조하므로, ‘많은 씨앗’이 구체적인 농경 이미지를 자연스럽게 살립니다.
- source_word: תּוֹצִיא הַשָּׂדֶה
  english_pob_choice: will carry out to the field
  chosen_korean: 밭으로 내겠지만
  alternatives_korean:
  - 들로 가져가겠지만
  - 밭에 가지고 나가겠지만
  lexicon: HALOT
  rationale: 히필형의 기본 뜻인 ‘내다/가져내다’를 살리되, 한국어에서는 ‘밭으로 내다’가 씨앗을 파종하러 밖으로 가져가는 장면을 가장 자연스럽게 전달합니다.
- source_word: וּמְעַט תֶּאֱסֹף
  english_pob_choice: but you will gather in little
  chosen_korean: 거두어들이는 것은 적을 것이니
  alternatives_korean:
  - 적게 거두어들이겠지만
  - 적은 것만 거두겠지만
  lexicon: HALOT
  rationale: אָסַף는 ‘모으다/거두다’이므로 ‘거두어들이다’가 농업 문맥을 유지합니다. 명사화한 표현은 히브리어의 대비(많음/적음)를 한국어에서 또렷하게 드러냅니다.
- source_word: הָאַרְבֶּה
  english_pob_choice: the locust
  chosen_korean: 메뚜기
  alternatives_korean:
  - 메뚜기 떼
  - 그 메뚜기
  lexicon: HALOT
  rationale: אַרְבֶּה는 표준적으로 메뚜기를 뜻하며, 한국어에서는 단수 보통명사로도 집단적 파괴력을 충분히 전달합니다.
theological_decisions:
- issue: 재앙의 원인과 인칭 지시
  chosen_reading: ‘그것’을 메뚜기가 먹어 버린다는 원인절을 그대로 살려, 수확 실패의 직접 원인이 자연재해로 제시되도록 했습니다.
  alternative_readings:
  - ‘먹어 치울 것입니다’처럼 더 강한 구어적 표현
  - 원인절을 약화해 단순한 결과 진술로 처리
  rationale: 본문은 수확의 실패를 추상적으로 말하지 않고 메뚜기의 파괴를 직접 원인으로 제시하므로, 이 긴장과 인과를 분명히 유지해야 합니다.
  doctrine_reference: 신명기 28장의 언약 저주는 농경 재난을 통해 실제로 드러나는 심판의 형식입니다.
