  text: הָ/רַכָּ֨ה בְ/ךָ֜ וְ/הָ/עֲנֻגָּ֗ה אֲשֶׁ֨ר לֹא נִסְּתָ֤ה כַף רַגְלָ/הּ֙ הַצֵּ֣ג עַל הָ/אָ֔רֶץ מֵ/הִתְעַנֵּ֖ג וּ/מֵ/רֹ֑ךְ תֵּרַ֤ע עֵינָ/הּ֙ בְּ/אִ֣ישׁ חֵיקָ֔/הּ וּ/בִ/בְנָ֖/הּ וּ/בְ/בִתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''her eye will be evil toward,'' meaning she will look on them with hostility or begrudging selfishness.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the man of her bosom' or 'the husband of her embrace,' an intimate expression for her husband.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 있는 부드럽고 연약한 여인[a], 곧 발바닥을 땅에 대어 본 적이 없을 정도로 사치와 연약함[b] 가운데 살아온 여인은, 자기 품의 남편과 아들, 딸을 향하여 눈이 악하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그녀의 눈이 악하다’는 그들을 적대하거나 인색하게 여기며 못마땅해하는 태도를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 발바닥을 땅에 대어 본 적이 없는’이며, 극도로 보호받고 연약하게 자란 상태를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: הָרַכָּה
  english_pob_choice: tender
  chosen_korean: 부드럽고
  alternatives_korean:
  - 연한
  - 연약한
  lexicon: HALOT
  rationale: 여성형 형용사 רך의 기본 의미는 부드러움·연약함이므로, 한국어에서는 자연스럽게 ‘부드럽고’로 시작해 뒤의 ‘연약한’과 짝을 이루게 했습니다.
- source_word: וְהָעֲנֻגָּה
  english_pob_choice: delicate
  chosen_korean: 연약한
  alternatives_korean:
  - 고운
  - 사치스러운
  - 세련된
  lexicon: HALOT
  rationale: ענג의 수동적 형용사는 ‘섬세한, 응석받이의, 연약한’ 뉘앙스를 가지므로, 문맥상 과도한 장식어보다 ‘연약한’이 원문의 보호받아 온 취약성을 잘 드러냅니다.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  english_pob_choice: because of delicacy and tenderness
  chosen_korean: 사치와 연약함 가운데
  alternatives_korean:
  - 호사와 부드러움 가운데
  - 응석과 연약함 가운데
  - 섬세함과 부드러움 때문에
  lexicon: HALOT
  rationale: 전치사구는 그녀가 땅에 발을 대어 본 적이 없는 이유를 설명하므로, 원문의 원인성은 살리되 한국어에서 자연스러운 관용으로 압축해 옮겼습니다.
- source_word: תֵּרַע עֵינָהּ
  english_pob_choice: her eye will be evil toward
  chosen_korean: 눈이 악하게 될 것입니다
  alternatives_korean:
  - 그녀가 못마땅히 여길 것입니다
  - 그녀가 원망스럽게 볼 것입니다
  - 그녀의 눈이 악할 것입니다
  lexicon: HALOT
  rationale: ‘눈이 악하다’는 히브리어 관용구를 직설적으로 살려, 시기·인색함·적대감을 모두 포괄하는 원문의 긴장을 보존했습니다. 의미 설명은 각주로 보완합니다.
- source_word: בְּאִישׁ חֵיקָהּ
  english_pob_choice: the husband of her embrace
  chosen_korean: 자기 품의 남편
  alternatives_korean:
  - 품에 안은 남편
  - 가슴에 품은 남편
  - 포옹의 남편
  lexicon: HALOT
  rationale: 직역에 가까운 ‘남편 of her embrace’를 한국어에서 어색하지 않게 풀어, 친밀한 혼인 관계를 드러내면서도 ‘남편’으로 의미를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 관용구 '눈이 악하다'의 처리
  chosen_reading: 문자적 이미지를 본문에 유지하고, 의미는 각주에서 hostility/begrudging selfishness로 설명합니다.
  alternative_readings:
  - 완전히 의역해 '못마땅히 여길 것입니다'로만 처리
  - '''원망스럽게 볼 것입니다''로 바꾸기'
  rationale: 이 구절은 감정의 방향을 드러내는 고유한 히브리 관용구이므로, 본문에서 이미지를 지우지 않고 독자가 의미를 이해하도록 주석으로 보완하는 편이 원문 충실도에 더 적합합니다.
  doctrine_reference: 히브리 성경의 관용적 표현 보존 원칙
- issue: 가족 관계 표현의 구체성
  chosen_reading: ‘아들, 딸’을 그대로 유지해 일반화하지 않았습니다.
  alternative_readings:
  - '''자녀''로 묶어 번역'
  - 남편만 언급하고 자녀는 생략
  rationale: 원문은 아들과 딸을 각각 제시해 가정 내부의 적대가 전면화됨을 강조하므로, 범위를 넓히거나 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 본문 세부성 보존 원칙
