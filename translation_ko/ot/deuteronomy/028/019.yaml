  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
  footnotes:
  - marker: a
    text: Literally, 'in your coming in ... in your going out,' a Hebrew idiom covering the whole course of daily life.
    reason: cultural_note
translation:
  language: ko
  text: 들어갈 때 저주를 받을 것이며, 나갈 때 저주를 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네가 들어올 때에 … 네가 나갈 때에’라고 하며, 일상생활 전반을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주가 임할 것입니다
  lexicon: HALOT
  rationale: פּאַסive/형용사적 의미를 살려 언약 저주의 선언으로 자연스럽게 표현했습니다. '저주를 받을 것입니다'는 현대 한국어에서 분명하고, 반복되는 경고문체도 유지합니다.
- source_word: בְּבֹאֶךָ
  english_pob_choice: when you come in
  chosen_korean: 들어갈 때에도
  alternatives_korean:
  - 들어올 때에도
  - 들어올 적에도
  - 당신이 들어갈 때에도
  lexicon: HALOT
  rationale: 직역의 '네 들어옴 안에서'보다 관용적 의미를 살려, 출입 전체를 가리키는 대응 표현으로 옮겼습니다.
- source_word: בְּצֵאתֶךָ
  english_pob_choice: when you go out
  chosen_korean: 나갈 때에도
  alternatives_korean:
  - 나아갈 때에도
  - 떠날 때에도
  - 당신이 나갈 때에도
  lexicon: HALOT
  rationale: 앞 구와 짝을 이루는 관용구로서 일상 전체의 범위를 나타내므로, 자연스러운 대칭을 살려 '나갈 때'로 옮겼습니다.
theological_decisions:
- issue: 언약 저주 선언문의 반복적·공식적 어조 보존
  chosen_reading: 두 절구를 모두 '저주를 받을 것입니다'로 맞추어, 히브리어의 앞세운 'אָרוּר'과 평행 구조의 엄숙함을 살렸습니다.
  alternative_readings:
  - '''저주받을 것입니다''로 더 압축하는 방식'
  - '''저주가 임할 것입니다''로 의미를 완화하는 방식'
  rationale: 본문은 단순 정보가 아니라 언약적 경고의 선포이므로, 현대적이면서도 단정적인 미래형을 유지하는 것이 적절합니다.
  doctrine_reference: 신명기 28장의 언약적 축복과 저주 구조
