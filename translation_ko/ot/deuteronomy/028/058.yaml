  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
  footnotes:
  - marker: a
    text: Or 'scroll' instead of 'book.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to revere this glorious and awesome name.' The Hebrew verb commonly includes both reverence and fear.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 만일 이 책[a]에 기록된 이 율법의 모든 말씀을 힘써 지켜 행하여, 이 영광스럽고 두려움을 불러일으키는 이름, 곧 야훼[c], 네 하나님을 두려워하지[b] 않으면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경외하다’. 히브리어 동사는 경외와 두려움을 함께 포함하는 경우가 많습니다.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘YHWH’. 전통적으로는 ‘주’로 번역되었습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא תִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: If you are not careful to do
  chosen_korean: 지키고 행하도록 주의하지 않아서
  alternatives_korean:
  - 지켜 행하지 않아서
  - 지키도록 하지 않아서
  - 주의하여 행하지 않아서
  lexicon: HALOT
  rationale: שׁמר + לעשות은 단순 불이행보다 ‘주의하여 지키며 실행함’의 결합을 가리키므로, 두 동작을 함께 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  english_pob_choice: all the words of this law
  chosen_korean: 이 율법의 모든 말씀
  alternatives_korean:
  - 이 율법의 모든 말
  - 이 율법의 모든 규정
  - 이 가르침의 모든 말씀
  lexicon: HALOT
  rationale: דִּבְרֵי는 ‘말씀들’이고, 여기의 תּוֹרָה는 신명기 언약 문맥의 율법을 가리키므로 ‘율법’과 ‘말씀’을 함께 살렸습니다.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  english_pob_choice: that are written in this book
  chosen_korean: 이 책에 기록된
  alternatives_korean:
  - 이 두루마리에 기록된
  - 이 책에 적힌
  - 이 두루마리에 적힌
  lexicon: HALOT
  rationale: 문맥상 기록된 언약 문서를 가리키므로 ‘기록된’으로 옮기고, POB의 주석 가능성을 열어 두기 위해 본문은 ‘책’으로 두었습니다.
- source_word: לְיִרְאָה
  english_pob_choice: to fear
  chosen_korean: 두려워하지 않으면
  alternatives_korean:
  - 경외하지 않으면
  - 두려워하며
  - 경외하며
  lexicon: HALOT
  rationale: יִרְאָה는 단순한 공포를 넘어 경외를 포함할 수 있지만, 본문이 의도하는 언약적 긴장과 무게를 살리기 위해 ‘두려워하다’를 기본으로 유지했습니다.
- source_word: הַשֵּׁם הַנִּכְבָּד וְהַנּוֹרָא
  english_pob_choice: this glorious and awesome name
  chosen_korean: 이 영광스럽고 두려운 이름
  alternatives_korean:
  - 이 영광스럽고 경외로운 이름
  - 이 영화롭고 두려운 이름
  - 이 존귀하고 두려운 이름
  lexicon: HALOT
  rationale: נכבד는 영광/존귀의 뜻을, נורא는 두려움을 불러일으키는 위엄을 뜻하므로 ‘영광스럽고 두려운’으로 직접 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 야웨
  lexicon: HALOT
  rationale: 공인된 원음 전사에 따라 신명기 본문의 고유명사를 ‘야훼’로 옮겨, 대체 호칭이 아니라 신적 이름 자체를 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 번역 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 언약의 고유명사 יְהוָה를 사용하므로, 주호칭으로 대체하지 않고 이름 자체를 보존하는 것이 본문이 요구하는 신학적 무게에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
- issue: לְיִרְאָה의 정서 강도
  chosen_reading: 두려워하다
  alternative_readings:
  - 경외하다
  - 경외하고 두려워하다
  rationale: 신명기 언약 문맥에서는 하나님 이름 앞의 경외가 실제 두려움의 차원을 포함하므로, 완화된 표현만으로는 본문의 긴장을 충분히 드러내지 못합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #6'
