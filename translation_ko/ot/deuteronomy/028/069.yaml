  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to cut a covenant' ... 'the covenant that he cut with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 여호와께서 모압 땅에서 이스라엘 자손과 맺도록 모세에게 명하신 언약의 말씀입니다[a]. 이것은 여호와께서 호렙에서 그들과 맺으신 언약과는 별개입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자 그대로는 ‘언약을 자르다’입니다. 즉, ‘그들이 맺은 언약’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은
  alternatives_korean:
  - 이것은
  - 이 말씀들은
  lexicon: HALOT
  rationale: 서술문을 자연스럽게 시작하면서 히브리어 복수 지시어를 살렸습니다.
- source_word: דִבְרֵי הַבְּרִית
  english_pob_choice: the words of the covenant
  chosen_korean: 언약의 말씀
  alternatives_korean:
  - 언약의 말들
  - 언약의 조항들
  lexicon: HALOT
  rationale: ‘words of’는 단순한 단어 나열보다 언약 내용 전체를 가리키므로, 한국어에서는 간결하게 ‘언약의 말씀’으로 옮겼습니다.
- source_word: לִכְרֹת ... כָּרַת
  english_pob_choice: to make ... made
  chosen_korean: 맺도록 ... 맺으신
  alternatives_korean:
  - 끊도록 ... 끊으신
  - 자르도록 ... 자르신
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘자르다’는 각주에서만 드러내고, 본문은 언약 체결의 관용적 의미인 ‘맺다’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역적 형식을 보존하면서도 한국어 성경에서 자연스러운 집합 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: DOCTRINE.md contested terms
  rationale: 이 구절의 POB 영어 본문이 ‘Yahweh’를 사용하지만, 한국어 독자층의 가독성과 POB 한국어 전체 일관성을 위해 본문에서는 ‘여호와’를 택했습니다. 이는 고유명사 표기 문제로서 신학적 내용 변화는 아닙니다.
theological_decisions:
- issue: ‘to cut a covenant’ 관용구를 한국어 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 ‘맺다’로 자연스럽게 옮기고, 히브리어의 문자적 표현은 각주로 보존합니다.
  alternative_readings:
  - 본문에 ‘자르다’/‘끊다’로 직역하기
  - 아무 표시 없이 단순히 ‘맺다’만 사용하기
  rationale: 언약 체결의 관용구를 한국어로는 ‘맺다’가 가장 분명합니다. 다만 원문에는 ‘자르다’라는 이미지가 있으므로 각주로 보존해 어휘적 긴장을 지켰습니다.
  doctrine_reference: Translation philosophy §2, §4
- issue: 하나님 이름 표기
  chosen_reading: 본문에서는 ‘여호와’를 사용합니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 한국어 성경 독서 전통과 본문의 유창성을 고려해 여호와를 사용했습니다. 이는 본문의 의미를 완화하지 않으며, 인명/호칭 표기 차원의 선택입니다.
  doctrine_reference: POB Korean name rendering policy
