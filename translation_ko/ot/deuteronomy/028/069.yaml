revisions:
- from: 이것들은 여호와께서 모압 땅에서 이스라엘 자손과 맺도록 모세에게 명하신 언약의 말씀입니다[a]. 이것은 여호와께서 호렙에서 그들과 맺으신 언약과는 별개입니다.
  to: 이것들은 야훼께서 호렙에서 그들과 맺으신 언약 외에, 모압 땅에서 이스라엘 자손과 언약을 맺도록 모세에게 명하신 언약의 말씀입니다[a].
  rationale: 원문의 מִלְּבַד를 ‘~외에’로 옮겨 첨가·구별의 관계를 보존하고, 두 문장을 원문의 한 문장 구조에 맞게 통합했습니다. יְהוָה는 POB 감사 기록의 표기 원칙에 따라 ‘야훼’로 고쳤습니다. 각주는 כרת ברית 관용구의 문자적 의미를 정확히 제시하도록 수정했습니다.
