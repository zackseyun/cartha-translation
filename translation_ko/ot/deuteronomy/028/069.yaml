  - severity: medium
    issue: 여호와 표기
    rationale: 제시된 영어 POB 감사 기록은 יְהוָה를 ‘Yahweh’로 일관되게 옮기는 방침을 명시합니다. 한국어 본문도 이에 상응하는 ‘야훼’를 사용해야 합니다.
  - severity: medium
    issue: 각주의 ‘그들이 맺은 언약’
    rationale: 원문과 본문은 야훼께서 모세에게 이스라엘 자손과 언약을 맺도록 명하신다고 말합니다. ‘그들이’는 행위 주체를 부정확하게 만들며, 두 번째 כרת도 반영하지 않습니다.
