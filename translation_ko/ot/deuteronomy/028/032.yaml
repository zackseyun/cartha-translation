  verdict: revise
  source_fidelity: ‘그것을 바라보며’는 히브리어의 אֲלֵיהֶם(‘그들을 향하여/그들 때문에’)가 가리키는 아들들과 딸들을 사건으로 바꾸어 버립니다. 또한 눈이 ‘쇠한다’는 כָלוֹת의 소모·쇠진 이미지를 직접 살리는 편이 적절합니다. 수정문은 수동의 미래적 저주 진술, ‘다른 백성’, 종일 계속되는 목격과 쇠진, 그리고 무력함의 관용구를 보존합니다.
  naturalness: 원문의 ‘그것을 바라보며 종일 그들을 그리워하다가’는 지시 대상이 바뀌어 다소 어색합니다. ‘그들을 바라보며 종일 그들을 그리워하여 쇠할 것이나’는 문학적이면서도 현대 한국어 성경 문체에서 자연스럽습니다. 본문의 중복된 표지 ‘<a>[a]’는 하나의 각주 표지로 정리했습니다.
  terminology: ‘아들들과 딸들’, ‘다른 백성’, ‘넘겨질’, ‘힘이 없을 것입니다’는 적절합니다. ‘손에 힘이 없다’는 신적 언급이 아니라 능력·권한의 부재를 뜻하는 히브리어 관용구로 처리되어야 합니다.
  issues:
