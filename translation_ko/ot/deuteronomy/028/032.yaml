  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
  footnotes:
  - marker: a
    text: Or, 'and it will not be in your power.' The Hebrew idiom literally refers to there being no power in your hand.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 아들들과 딸들은 다른 백성에게 넘겨질 것이며, 네 눈은 그들을 바라보며 종일 그들을 그리워하여 쇠할 것이나, 네 손에는 힘이 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그것을 어찌할 힘이 네 손에 없을 것입니다.’ 히브리어는 문자적으로 ‘네 손에 능력이 없다’는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  english_pob_choice: Your sons and your daughters
  chosen_korean: 네 아들들과 네 딸들은
  alternatives_korean:
  - 네 자녀들은
  - 아들딸들은
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 각각 분명히 말하므로, 포괄적 '자녀'보다 '아들들과 딸들'이 저주의 구체성을 더 잘 보존합니다.
- source_word: נְתֻנִים לְעַם אַחֵר
  english_pob_choice: will be given to another people
  chosen_korean: 다른 백성에게 넘겨질 것이며
  alternatives_korean:
  - 다른 백성에게 주어질 것이며
  - 외국 백성에게 넘겨질 것이며
  lexicon: HALOT
  rationale: 수동 표현을 한국어에서 자연스럽게 옮기되, 포로·약탈의 강한 함의를 살리기 위해 단순한 '주어질'보다 '넘겨질'을 택했습니다.
- source_word: וְעֵינֶיךָ רֹאוֹת וְכָלוֹת אֲלֵיהֶם כָּל הַיּוֹם
  english_pob_choice: while your eyes look on and fail with longing for them all day long
  chosen_korean: 네 눈은 그것을 바라보며 종일 그들을 그리워하다가 지칠 것이지만
  alternatives_korean:
  - 네 눈은 그것을 바라보며 종일 그들 때문에 쇠하여 갈 것이지만
  - 네 눈은 그것을 보며 종일 그들을 바라다보다가 소진될 것이지만
  lexicon: HALOT
  rationale: '''바라보며''는 눈앞에서 벌어지는 일을 목격하는 장면을 살리고, ''그리워하다가 지치다''는 כָלָה의 소모·쇠진 의미를 현대 한국어에서 자연스럽게 드러냅니다.'
- source_word: וְאֵין לְאֵל יָדֶךָ
  english_pob_choice: but your hand will be powerless
  chosen_korean: 네 손에는 힘이 없을 것입니다
  alternatives_korean:
  - 네 손에는 능력이 없을 것입니다
  - 네 손에는 아무 힘도 없을 것입니다
  - 그것을 어찌할 힘이 네 손에 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 능력 부재를 뜻하므로, 신적 대상처럼 오해될 수 있는 직역보다 '손에는 힘이 없다'로 관용의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 관용구 וְאֵין לְאֵל יָדֶךָ 의 처리
  chosen_reading: '''네 손에는 힘이 없을 것입니다''로 관용적으로 옮겼습니다.'
  alternative_readings:
  - '''네 손에 힘이 없을 것입니다'''
  - '''그것을 어찌할 힘이 네 손에 없을 것입니다'''
  rationale: 이 표현은 하나님을 가리키는 문장이 아니라 무력함을 뜻하는 관용구이므로, 독자가 '엘'을 신적 언급으로 오해하지 않도록 자연스러운 한국어로 풀었습니다.
  doctrine_reference: 번역 철학 §1, §6
