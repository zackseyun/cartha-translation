revisions:
- from: 그는 네 모든 성문에서 네게 포위전을 벌여, 네가 그 성벽들을 의지하여 신뢰하던 높고 견고한 성벽들이 네 온 땅에 걸쳐 무너지기까지 할 것입니다. 그리고 네 하나님 야훼께서 네게 주신 네 모든 땅의 모든 성문에서 네게 포위전을 벌일 것입니다.[a]
  to: 그는 네 모든 성문에서 너를 포위하여, 네가 의지하는 높고 견고한 성벽들이 네 온 땅에서 무너지기까지 할 것입니다. 그는 또 네 하나님 야훼께서 네게 주신 네 온 땅의 모든 성문에서 너를 포위할 것입니다.
  rationale: 반복되는 וְהֵצַר를 두 번 모두 ‘포위할 것입니다’로 일관되게 옮기고, עַד רֶדֶת의 시간 관계는 첫 절의 ‘무너지기까지’로 보존했습니다. בֹּטֵחַ의 지속적 의미는 ‘의지하는’으로 간결하게 반영했습니다. 두 번째 ‘모든 성문’은 ‘야훼께서 네게 주신 네 온 땅’에 속한다는 히브리어 수식 관계가 드러나도록 배열했습니다.
  reviewer_model: gpt-5.6-terra
