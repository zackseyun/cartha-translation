source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: ko
  text: 그는 네 모든 성문에서 네게 포위전을 벌여, 네가 그 성벽들을 의지하여 신뢰하던 높고 견고한 성벽들이 네 온 땅에 걸쳐 무너지기까지 할 것입니다. 그리고 네 하나님 야훼께서 네게 주신 네 모든 땅의 모든 성문에서 네게 포위전을 벌일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 여기서 도시의 방어 거점들을 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵצַר
  english_pob_choice: he will besiege
  chosen_korean: 포위전을 벌여
  alternatives_korean:
  - 포위할 것입니다
  - 에워쌀 것입니다
  - 압박할 것입니다
  lexicon: HALOT
  rationale: 군사적 문맥과 ‘성문’, ‘성벽’의 결합을 살려 일반적 ‘압박’보다 포위·공성의 이미지를 드러내도록 했습니다.
- source_word: שְׁעָרֶיךָ
  english_pob_choice: your gates
  chosen_korean: 네 모든 성문에서
  alternatives_korean:
  - 네 성문에서
  - 네 도시들에서
  - 네 성읍들에서
  lexicon: HALOT
  rationale: 직역상 ‘성문’이므로 구체적 이미지와 포위전의 장면을 유지했습니다. 반복을 살려 두 곳 모두 동일하게 처리했습니다.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  english_pob_choice: your high and fortified walls
  chosen_korean: 높고 견고한 성벽들
  alternatives_korean:
  - 높고 요새화된 성벽들
  - 높고 방어된 성벽들
  lexicon: HALOT
  rationale: ‘높다’와 ‘견고/요새화됨’의 이중 형용사를 모두 살리되 한국어에서는 ‘성벽들’이 자연스러워 ‘벽’보다 ‘성벽’으로 옮겼습니다.
- source_word: בֹּטֵחַ בָּהֵן
  english_pob_choice: in which you trust
  chosen_korean: 그 성벽들을 의지하여 신뢰하던
  alternatives_korean:
  - 그 성벽들을 믿던
  - 그 성벽들에 의지하던
  - 그 성벽들을 신뢰하던
  lexicon: HALOT
  rationale: בטח의 신뢰·의지 의미를 함께 살리기 위해 ‘의지하여 신뢰하던’으로 옮겨, 방어시설에 둔 인간적 확신을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신명사 יְהוָה는 ‘야훼’로 음역해 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 반복되는 ‘포위하다/포위전’의 일관성
  chosen_reading: 두 번째 וְהֵצַר도 첫 번째와 같은 군사적 포위 의미로 일관되게 옮겼습니다.
  alternative_readings:
  - 두 번째는 ‘압박할 것입니다’로 완화할 수 있음
  - 두 번째는 ‘에워쌀 것입니다’로 다양화할 수 있음
  rationale: 동일 동사의 반복이 의도적 강조이므로, 첫 절의 공성 이미지를 약화시키지 않도록 같은 계열 표현으로 유지했습니다.
  doctrine_reference: '번역 원리: 반복 구조 보존'
- issue: יְהוָה의 표기
  chosen_reading: 본문의 신명사 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 문맥상 언약적 고유명을 드러내기 위해 칭호 대체를 피하고, 프로젝트 표준에 따른 음역을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
