base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
  footnotes:
  - marker: a
    text: Or 'consumption' for 'wasting disease'; the Hebrew term denotes a debilitating wasting sickness.
    reason: lexical_alternative
  - marker: b
    text: Or 'and these will pursue you'; the Hebrew verb is plural, referring back to the preceding afflictions and disasters.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 당신을 낭비병과 열병과 염증과 불타는 열과 칼과 곡식 마름병과 곡식의 흰가루병으로 치실 것이며, 그것들이 당신을 따라가서 당신이 망할 때까지 쫓아갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낭비병’은 히브리어 שַׁחֶפֶת의 의미를 살린 표현이며, 전통적 번역인 ‘소모병/폐병’보다 현대적입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 열거된 재앙들을 복수로 받습니다. 그래서 마지막 동사는 ‘그것들이’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 기존 한국어 교회 언어와의 연속성을 고려해 본문에서는 ‘여호와’를 쓰되, 원어의 고유 신명임을 드러내는 선택으로 처리했습니다. 이 절은 하나님의 직접적 심판 선언이므로 호칭보다 고유명사를 유지하는 것이 핵심입니다.
- source_word: שַׁחֶפֶת
  english_pob_choice: wasting disease
  chosen_korean: 낭비병
  alternatives_korean:
  - 쇠약병
  - 소모병
  lexicon: HALOT
  rationale: 원어는 몸을 야위게 하고 쇠하게 하는 병을 가리키므로, 현대 한국어에서 의미를 살려 ‘낭비병’으로 옮겼습니다. 다만 이 표현은 다소 생경할 수 있어, 의미상 대안들을 함께 남깁니다.
- source_word: שִׁדָּפֹון / יֵרָקוֹן
  english_pob_choice: blight / mildew
  chosen_korean: 곡식 마름병과 곡식의 흰가루병
  alternatives_korean:
  - 마름병과 곰팡이병
  - 가뭄 피해와 병해
  lexicon: HALOT
  rationale: 이 둘은 농작물에 대한 재앙으로, 단순한 질병이 아니라 수확을 망가뜨리는 현상을 가리킵니다. 그래서 일반적 병명보다 농경 맥락이 드러나는 표현으로 옮겨 원문의 대조를 유지했습니다.
- source_word: וּרְדָפוּךָ
  english_pob_choice: and they will pursue you
  chosen_korean: 그것들이 당신을 따라가서
  alternatives_korean:
  - 그것들이 당신을 쫓아가서
  - 그것들이 당신을 추격하여
  lexicon: HALOT
  rationale: 히브리어는 앞의 재앙들을 복수 주어처럼 묶어 가리키므로 ‘그것들’로 받았습니다. ‘따라가서’는 단순한 추적이 아니라 재앙이 지속적으로 따라붙는 뉘앙스를 살립니다.
- source_word: עַד אָבְדֶךָ
  english_pob_choice: until you perish
  chosen_korean: 당신이 망할 때까지
  alternatives_korean:
  - 당신이 멸망할 때까지
  - 당신이 죽을 때까지
  lexicon: HALOT
  rationale: 원어는 단순한 죽음보다 ‘망함/소멸’의 의미가 강하므로, 심판의 결과를 드러내는 ‘망하다’를 택했습니다. 직역적이면서도 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 심판 선언의 직설성과 2인칭 직접 호칭
  chosen_reading: 본문의 직접적 경고를 살려 ‘당신’을 사용하고, 완곡하게 돌리지 않았습니다.
  alternative_readings:
  - 너를
  - 그대를
  rationale: 히브리어 2인칭 단수의 직접 대면 구조를 현대 한국어에서도 분명하게 보이게 해야 합니다. 이 절은 축복이 아니라 언약 저주의 선언이므로, 강한 직설을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Deuteronomy 28 covenant curses
- issue: 재앙들의 복수성
  chosen_reading: 마지막 절반은 ‘그것들이…쫓아갈 것입니다’로 복수성을 유지했습니다.
  alternative_readings:
  - 그것이 쫓아갈 것입니다
  - 이 재앙이 쫓아갈 것입니다
  rationale: 히브리어 동사는 복수형으로, 앞서 열거한 재앙들을 집합적으로 가리킵니다. 이를 단수로 평준화하면 문법적 긴장과 문장 힘이 약해집니다.
  doctrine_reference: Hebrew grammar / lexical-agreement
