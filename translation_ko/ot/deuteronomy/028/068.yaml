  to: 야훼께서 너를 배를 타고 이집트로 다시 데려가실 것이며, 내가 네게 ‘다시는 그것을 보지 못할 것이다’라고 말한 그 길로 데려가실 것이다. 너희는 거기서 너희 원수들에게 남종과 여종으로 너희 자신을 팔려고 내놓겠으나[a], 사려는 사람이 없을 것이다.
