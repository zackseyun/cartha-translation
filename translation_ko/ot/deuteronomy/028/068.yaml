  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male slaves and female slaves, but there will be no buyer.
  footnotes:
  - marker: a
    text: Or 'you will be sold there to your enemies as slaves, male and female'; the Hebrew verb may be understood reflexively ('sell yourselves') or more generally as entering slavery.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 너를 배를 타고 이집트로 다시 데려가실 것이며, 내가 네게 ‘다시는 그것을 보지 못할 것이다’라고 말한 그 길로 데려가실 것이다. 너희는 거기서 너희 원수들에게 남종과 여종으로 너희 자신을 팔려고 내놓겠으나[a], 사려는 사람이 없을 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 너희 원수들에게 남종과 여종으로 팔릴 것이다.’ 히브리어 동사는 ‘스스로를 팔다’라는 재귀적 뜻으로도, 더 넓게는 종살이에 들어가게 됨을 가리키는 뜻으로도 이해될 수 있다.
    reason: lexical_alternative
