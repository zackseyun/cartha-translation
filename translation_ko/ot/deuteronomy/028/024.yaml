source:
  edition: WLC
  text: יִתֵּ֧ן יְהוָ֛ה אֶת מְטַ֥ר אַרְצְ/ךָ֖ אָבָ֣ק וְ/עָפָ֑ר מִן הַ/שָּׁמַ֨יִם֙ יֵרֵ֣ד עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
  footnotes:
  - marker: a
    text: Or 'dust and dirt/earth.' The Hebrew pairs two related terms for dry particulate matter (אָבָק, עָפָר), intensifying the image of rain turned into drought and devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신의 땅의 비를 먼지와 가루로 만드실 것입니다[a]. 하늘에서 그것이 당신에게 내려와, 당신이 멸망할 때까지 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼지와 흙’. 히브리어는 관련된 두 용어(אָבָק, עָפָר)를 나란히 써서, 마른 입자들이 비를 대신하는 재앙의 이미지를 강화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md default / project glossary
  rationale: 본문의 신명기적 하나님의 이름은 칭호가 아니라 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 개인명성을 보존했습니다.
- source_word: יִתֵּן
  english_pob_choice: will make
  chosen_korean: 만드실 것입니다
  alternatives_korean:
  - 주시겠습니다
  - 되게 하실 것입니다
  - 바꾸실 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘주시다’보다 문맥상 비를 먼지와 가루가 되게 하시는 인과적 의미를 드러내는 표현이 필요하므로, 자연스러운 원인적 결과를 살린 ‘만드실 것입니다’를 택했습니다.
- source_word: אָבָק וְעָפָר
  english_pob_choice: dust and powder
  chosen_korean: 먼지와 가루
  alternatives_korean:
  - 먼지와 티끌
  - 먼지와 흙
  - 가루와 먼지
  lexicon: HALOT
  rationale: 두 유사 명사를 한국어에서도 구분 가능한 일상어로 살려, 비가 메마른 미세 입자로 변하는 재앙적 이미지를 유지했습니다. 영어의 ‘dust and powder’에 대응하되 과도하게 고어적이지 않게 했습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from the heavens
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: 히브리어 복수형의 장엄한 표현을 한국어에서는 자연스러운 ‘하늘에서’로 옮기되, 하강하는 재앙의 출발점을 분명히 했습니다.
- source_word: עַד הִשָּׁמְדָךְ
  english_pob_choice: until you are destroyed
  chosen_korean: 당신이 멸망할 때까지
  alternatives_korean:
  - 당신이 멸절될 때까지
  - 당신이 파멸될 때까지
  lexicon: HALOT
  rationale: 완료적 종결을 나타내는 표현을 결과 상태로 풀어, 문맥상 심판의 끝을 분명히 드러내는 ‘멸망할 때까지’로 옮겼습니다.
theological_decisions:
- issue: 언약 저주 구문의 어조
  chosen_reading: 미래형 선언으로, 야훼의 주권적 심판이 실제로 임할 것을 예고하는 경고문으로 읽었습니다.
  alternative_readings:
  - 일반적인 자연현상 묘사로 읽기
  - 비유적 과장으로만 읽기
  rationale: 본문은 언약 저주 목록의 한 항목으로서 현실적 재앙을 선언하므로, 단순 비유로 약화시키지 않고 선포적 미래형으로 유지했습니다.
  doctrine_reference: 신명기 28장 언약 저주 구조
