source:
  edition: WLC
  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
  footnotes:
  - marker: a
    text: Or 'an astonishment.' The Hebrew term can denote something so devastated or appalling that it causes horror or astonishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'a byword' for both 'a proverb' and 'a taunt'; the Hebrew uses two related but distinct terms for public derision.
    reason: lexical_alternative
  - marker: c
    text: Or 'where the LORD will lead you.' The verb can mean 'lead' or 'drive'; here 'drive' reflects the coercive sense of exile in the curse context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희는 야훼께서 너희를 끌고 가시는 모든 민족들 가운데서 공포의 대상과 속담과 조롱거리가 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공포의 대상’은 히브리어의 뜻을 풀어 옮긴 것으로, ‘경악/놀라움의 대상’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속담’은 ‘비유적 말/비웃음거리’의 기능을 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘끌고 가시는’은 이 문맥의 강제 추방 뉘앙스를 드러낸 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  english_pob_choice: And you shall become
  chosen_korean: 그러면 너희는 … 될 것입니다
  alternatives_korean:
  - 그리고 너희는 … 될 것입니다
  - 너희는 …이 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 저주 선포의 결과를 나타내므로 ‘되다’로 옮기되, 한국어에서는 연결의 결과성을 살린 ‘그러면’이 자연스럽습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: an object of horror
  chosen_korean: 공포의 대상
  alternatives_korean:
  - 경악의 대상
  - 황폐의 대상
  - 공포
  - 경악
  lexicon: HALOT
  rationale: שַׁמָּה는 단순한 상태보다 사람들의 반응을 불러일으키는 끔찍한 대상이라는 뜻이 강하므로, ‘공포의 대상’이 문맥을 가장 잘 드러냅니다.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  english_pob_choice: a proverb and a taunt
  chosen_korean: 속담과 조롱거리
  alternatives_korean:
  - 비유와 조롱거리
  - 속담과 비웃음
  - 속담과 수치거리
  lexicon: HALOT
  rationale: מָשָׁל과 שְׁנִינָה의 공적 조롱/비난 기능을 함께 살리되, 두 표현을 한국어의 자연스러운 병렬인 ‘속담과 조롱거리’로 옮겼습니다.
- source_word: בְּכֹל הָעַמִּים
  english_pob_choice: among all the peoples
  chosen_korean: 모든 민족들 가운데서
  alternatives_korean:
  - 모든 백성들 가운데서
  - 모든 나라들 가운데서
  lexicon: HALOT
  rationale: עַמִּים는 ‘민족들/백성들’이 가능한데, 심판과 흩어짐의 국제적 범위를 드러내는 데 ‘민족들’이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신성호칭은 고유명사이므로 전통적 대치어 ‘주’가 아니라 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: יְנַהֶגְךָ
  english_pob_choice: will drive you
  chosen_korean: 끌고 가시는
  alternatives_korean:
  - 몰아가시는
  - 인도하시는
  - 데려가시는
  lexicon: HALOT
  rationale: 저주 맥락에서는 단순한 ‘인도’보다 강제적 이동의 뉘앙스가 필요하므로 ‘끌고 가다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 저주 문맥에서 동사의 강도
  chosen_reading: ‘야훼께서 너희를 끌고 가시는’으로 번역해 강제적 추방의 의미를 살렸습니다.
  alternative_readings:
  - ‘야훼께서 너희를 인도하시는’
  - ‘야훼께서 너희를 데려가시는’
  rationale: 히브리어 נהג는 이 문맥에서 단순 안내가 아니라 심판으로서의 강제 이주를 가리키므로, 한국어에서도 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 출애굽기/신명기의 저주 조항 해석 원칙
