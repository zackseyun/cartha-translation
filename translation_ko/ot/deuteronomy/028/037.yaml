  source_fidelity: 히브리어 원문은 단수 2인칭(‘네가’)이며, ‘여호와께서 네가 그리로 끌려갈 모든 민족 가운데서’라는 목적지의 관계절을 포함합니다. 초안의 복수 2인칭과 ‘야훼께서 너희를 끌고 가시는 모든 민족들’은 수 일치 및 관계절의 범위를 바꾸어, 야훼가 모든 민족을 끌고 간다는 뜻으로도 읽힐 수 있습니다.
  naturalness: ‘공포의 대상, 속담, 조롱거리’는 자연스럽고 현대 표준어에 맞습니다. 다만 ‘너희는’과 ‘가시는’의 결합은 원문의 단수와 미래적 저주 선언을 충분히 반영하지 못합니다. ‘네가 끌려갈’로 고치면 문장 구조와 의미가 모두 분명해집니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기 원칙에 부합합니다. שַׁמָּה는 ‘경악의 대상’도 가능하나 ‘공포의 대상’은 안전합니다. מָשָׁל과 שְׁנִינָה를 각각 ‘속담’과 ‘조롱거리’로 구별한 것도 적절합니다.
