base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Who will give evening/morning?''—an idiom expressing longing, hence ''If only it were evening/morning!'''
    reason: lexical_alternative
  - marker: b
    text: Or 'because of the fear in your heart ... and because of what your eyes will see.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에는 ‘차라리 저녁이었으면!’ 하고 말하고, 저녁에는 ‘차라리 아침이었으면!’ 하고 말할 것입니다. 이는 마음에 이는 공포와 여러분의 눈이 보게 될 광경 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘누가 저녁/아침을 주겠느냐’이지만, 여기서는 ‘차라리 … 이었으면!’이라는 갈망의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘마음의 공포 … 그리고 눈이 보게 될 것’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר / תֹּאמַר
  english_pob_choice: In the morning you will say
  chosen_korean: 아침에는 … 하고 말할 것입니다
  alternatives_korean:
  - 아침에 … 라고 말하실 것입니다
  - 아침에는 … 말하게 될 것입니다
  lexicon: WLC; HALOT
  rationale: 아침/저녁의 대구를 살리면서 2인칭 미완료형을 미래 예고로 옮겨, 저주 문맥의 예언적 진술을 자연스러운 합쇼체로 표현했습니다.
- source_word: מִי יִתֵּן
  english_pob_choice: If only it were
  chosen_korean: ‘차라리 … 이었으면!’
  alternatives_korean:
  - ‘… 이기를!’
  - ‘누가 … 주면 좋겠느냐!’
  lexicon: WLC; HALOT
  rationale: 직역 질문형보다 소망·갈망의 관용구를 드러내는 한국어 표현이 원문의 힘을 더 정확히 전달합니다.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  english_pob_choice: because of the dread of your heart that you will dread
  chosen_korean: 이는 마음에 이는 공포
  alternatives_korean:
  - 이는 마음의 두려움
  - 이는 네 마음의 공포
  lexicon: WLC; HALOT
  rationale: פַּחַד의 강한 공포감을 살리기 위해 ‘공포’를 택했고, לְבָבְךָ는 관용적으로 ‘마음에 이는’으로 풀어 자연스러움을 확보했습니다.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  english_pob_choice: and because of the sight your eyes will see
  chosen_korean: 그리고 여러분의 눈이 보게 될 광경
  alternatives_korean:
  - 그리고 여러분의 눈으로 보게 될 것
  - 그리고 눈앞에 펼쳐질 광경
  lexicon: WLC; HALOT
  rationale: מַרְאֶה를 추상화된 ‘보는 것’보다 실제로 목격하는 ‘광경’으로 옮겨, 눈에 보이는 भय의 장면이라는 구체성을 유지했습니다.
theological_decisions:
- issue: 직설적 소망 표현 מִי יִתֵּן의 한국어 강도
  chosen_reading: ‘차라리 … 이었으면!’로 번역해 절망적 갈망을 드러냈습니다.
  alternative_readings:
  - ‘… 이기를!’
  - ‘… 면 좋겠다!’
  rationale: 본문은 단순한 바람이 아니라 고난 속에서 반대 시간대를 갈망하는 비탄이므로, 더 절박한 어조가 문맥에 부합합니다.
  doctrine_reference: 신명기 28장의 언약 저주 문맥
- issue: ‘눈이 보게 될’의 반복 구조
  chosen_reading: ‘여러분의 눈이 보게 될 광경’으로 옮겨 눈과 광경의 연결을 남겼습니다.
  alternative_readings:
  - ‘여러분이 보게 될 광경’
  - ‘눈앞에 보일 것’
  rationale: 히브리어의 감각적 반복을 완전히 평탄화하지 않고, 두려운 현실을 직접 목격하는 이미지를 보존했습니다.
  doctrine_reference: 히브리어 시적/수사적 평행법
