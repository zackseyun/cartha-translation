  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Who will give evening/morning?''—an idiom expressing longing, hence ''If only it were evening/morning!'''
    reason: lexical_alternative
  - marker: b
    text: Or 'because of the fear in your heart ... and because of what your eyes will see.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에는 ‘차라리 저녁이었으면!’ 하고 말하고, 저녁에는 ‘차라리 아침이었으면!’ 하고 말할 것입니다. 이는 마음속에서 두려워하게 될 공포와 눈으로 보게 될 광경 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘누가 저녁/아침을 주겠느냐’이지만, 여기서는 ‘차라리 …이었으면!’이라는 갈망의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘마음의 공포 … 그리고 눈으로 보게 될 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
