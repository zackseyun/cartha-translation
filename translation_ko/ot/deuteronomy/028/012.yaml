  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
  footnotes:
  - marker: a
    text: Or 'his good treasury.' The Hebrew term can denote a storehouse or treasury; 'storehouse' fits the rain-and-harvest context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신에게 자신의 좋은 창고[a], 곧 하늘을 열어 주셔서, 당신의 땅에 철을 따라 비를 내리시고 당신이 손으로 하는 모든 일에 복을 주실 것입니다. 당신은 많은 나라에 빌려주겠지만, 빌리지는 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 좋은 보물창고’. 히브리어 오차르(אוֹצָר)는 ‘창고’ 또는 ‘보물창고’를 뜻할 수 있습니다. 여기서는 비와 수확의 문맥에 맞추어 ‘창고’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 직역 관례
  rationale: POB의 원칙에 따라 신명기의 여호와 이름은 언약적 고유명인 야훼로 옮겨, 호칭이 아니라 이름 자체를 드러냈습니다.
- source_word: אוֹצָרוֹ הַטּוֹב
  english_pob_choice: his good storehouse
  chosen_korean: 그의 좋은 창고
  alternatives_korean:
  - 그의 좋은 저장고
  - 그의 좋은 보물창고
  - 그의 좋은 금고
  lexicon: HALOT
  rationale: אוֹצָר는 문맥상 비와 곡식을 내어주는 저장 공간을 가리키므로, 비·수확 문맥에 맞는 창고로 옮겼습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘들(천상)
  lexicon: HALOT
  rationale: 한국어에서는 복수 형식의 뉘앙스를 과도하게 살리기보다, 상응하는 자연스러운 표준어인 하늘로 옮겨 문맥을 분명히 했습니다.
- source_word: מְטַר אַרְצְךָ בְּעִתּוֹ
  english_pob_choice: the rain of your land in its season
  chosen_korean: 당신의 땅에 때를 따라 비를 내리게 하시고
  alternatives_korean:
  - 당신의 땅의 비를 제때에 내리게 하시고
  - 당신 땅의 비를 그 때에 내리게 하시고
  lexicon: HALOT
  rationale: 직역형인 ‘땅의 비’보다 한국어에서 자연스러운 동사구로 풀어, ‘때를 따라’로 절기의 의미를 살렸습니다.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  english_pob_choice: You will lend to many nations
  chosen_korean: 당신은 많은 나라에 꾸어 주겠지만
  alternatives_korean:
  - 당신은 많은 민족에게 빌려주겠지만
  - 당신은 많은 나라에 빌려주겠지만
  lexicon: HALOT
  rationale: לוה의 사역형은 ‘꾸어 주다’로, 대상인 גּוֹיִם은 이 언약적·국가적 문맥에서 나라로 옮겼습니다.
- source_word: וְאַתָּה לֹא תִלְוֶה
  english_pob_choice: but you will not borrow
  chosen_korean: 꾸지는 않을 것입니다
  alternatives_korean:
  - 빌리지는 않을 것입니다
  - 꾸어오지는 않을 것입니다
  lexicon: HALOT
  rationale: 앞절과의 대조를 살리기 위해 ‘하지만’을 넣기보다 종결부에서 대비를 유지했고, לוה의 수동적 의미는 한국어 관용에 맞게 ‘꾸다’로 처리했습니다.
theological_decisions:
- issue: 야훼의 복 주심이 경제적 번영과 연결되는 언약 축복의 의미
  chosen_reading: 비와 농사, 그리고 대외적 부채 관계까지 포함한 구체적 번영의 약속으로 읽었습니다.
  alternative_readings:
  - 일반적 영적 복으로 완화해 읽기
  - 상징적으로만 해석하기
  rationale: 본문은 추상적 복이 아니라 비, 수확, 노동의 성과, 국가 간 신용 관계를 직접 언급하므로 그 구체성을 유지했습니다.
  doctrine_reference: 신명기 28장의 언약 축복/저주 구조
- issue: ‘꾸어 주겠지만…꾸지는 않을 것입니다’의 대조 표현
  chosen_reading: 대조 접속을 영어식으로 과도하게 드러내기보다, 한국어 종결 대비로 긴장을 유지했습니다.
  alternative_readings:
  - ‘하지만’으로 명시적 대조를 넣기
  - 두 절을 동일한 어조로 평행 처리하기
  rationale: 히브리어의 병렬 대비를 살리되, 한국어에서는 문장 끝의 긍정/부정 대립이 충분히 강하므로 과잉 설명을 피했습니다.
  doctrine_reference: 문학적 병행법 보존
