lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed
  chosen_korean: 복을 받으시고 / 복을 받으실 것입니다
  alternatives_korean:
  - 복되시고
  - 복 있으시고
  lexicon: HALOT
  rationale: ברך의 수동 분사로 된 축복 선언을 한국어로는 '복을 받다'로 옮겨, 언약적 축복의 성격과 선언성을 자연스럽게 살렸습니다.
- source_word: בָּעִיר
  english_pob_choice: in the city
  chosen_korean: 성읍에서도
  alternatives_korean:
  - 도성에서도
  - 도시에서도
  lexicon: HALOT
  rationale: עִיר는 단순한 '도시'보다 성경적·고대적 생활권을 드러내는 '성읍'이 더 직접적이어서, 장소의 범위를 유지하면서도 본문 분위기를 살렸습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판에서도
  alternatives_korean:
  - 밭에서도
  - 시골에서도
  lexicon: HALOT
  rationale: שָׂדֶה는 농경지·들판의 구체적 대비를 가리키므로, 도시와의 평행을 자연스럽게 살리는 '들판'을 선택했습니다.
- source_word: וּ
  english_pob_choice: and
  chosen_korean: 그리고 / -에서도
  alternatives_korean:
  - 또
  - 및
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 한국어에서도 유지하기 위해 두 영역을 나란히 제시하고, 반복되는 축복을 '에서도'로 대응시켜 강조를 보존했습니다.
theological_decisions:
- issue: 축복 선언의 시제와 어조
  chosen_reading: 미래형 존대 표현으로 약속의 성격을 드러냈습니다.
  alternative_readings:
  - 단순 현재형 '복되십니다'
  - 명령형/기도형 표현
  rationale: 본문은 조건적 서술이 아니라 언약적 축복 선언이므로, 한국어에서는 '복을 받으실 것입니다'로 약속성과 선언성을 함께 드러내는 것이 적절합니다.
  doctrine_reference: 신명기 28장의 언약 축복 선언
