  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֵיתִ֛ים יִהְי֥וּ לְ/ךָ֖ בְּ/כָל גְּבוּלֶ֑/ךָ וְ/שֶׁ֨מֶן֙ לֹ֣א תָס֔וּךְ כִּ֥י יִשַּׁ֖ל זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
  footnotes:
  - marker: a
    text: Or 'your olive crop will fall off' or 'your olive tree will shed its fruit.' The Hebrew uses 'your olive' collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 올리브나무가 당신의 모든 땅에 있을 것이나, 당신은 기름을 몸에 바르지 못할 것입니다. 이는 당신의 올리브[a]가 떨어질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 올리브 수확이 떨어질 것입니다’ 또는 ‘당신의 올리브나무가 열매를 떨굴 것입니다’. 히브리어는 ‘당신의 올리브’를 집합적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  english_pob_choice: olive trees
  chosen_korean: 올리브나무
  alternatives_korean:
  - 올리브들
  - 올리브 과수원
  lexicon: HALOT
  rationale: 문맥상 단순한 열매가 아니라 땅 전체에 퍼져 있는 나무의 존재를 가리키므로, POB의 선택을 따라 ‘올리브나무’로 옮기는 것이 자연스럽습니다.
- source_word: בְּכָל גְּבוּלֶךָ
  english_pob_choice: throughout all your territory
  chosen_korean: 온 당신의 영토에 두루
  alternatives_korean:
  - 당신의 모든 경계 안에
  - 당신의 모든 땅에
  lexicon: HALOT
  rationale: 언약 저주의 문맥에서 גְּבוּל은 경계보다 땅의 범위를 포괄하는 의미가 강하므로, ‘영토에 두루’가 전체 범위를 잘 드러냅니다.
- source_word: לֹא תָסוּךְ
  english_pob_choice: you will not anoint yourself
  chosen_korean: 자신에게 바르지 못할 것입니다
  alternatives_korean:
  - 자신에게 기름을 부지 못할 것입니다
  - 자신에게 문지르지 못할 것입니다
  lexicon: HALOT
  rationale: סוך는 몸에 기름을 바르거나 문지르는 행위이므로, 한국어에서는 의례적 뉘앙스를 과하게 주지 않는 ‘바르다’가 가장 무난합니다.
- source_word: יִשַּׁל זֵיתֶךָ
  english_pob_choice: your olives will fall off
  chosen_korean: 당신의 올리브가 떨어질 것이기 때문입니다
  alternatives_korean:
  - 당신의 올리브 열매가 떨어질 것이기 때문입니다
  - 당신의 올리브나무가 열매를 떨굴 것이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 집합명사적 표현을 반영해 ‘올리브’로 옮기되, 열매가 떨어지는 상황을 직접적으로 드러내기 위해 ‘떨어질 것’으로 번역했습니다.
theological_decisions:
- issue: 저주 진술의 직설성
  chosen_reading: 문장의 저주적 결과를 완곡하게 돌리지 않고, 소유의 상실과 기름 사용의 금지를 그대로 드러냈습니다.
  alternative_readings:
  - ‘기름을 쓰지 못할 것입니다’처럼 더 완곡하게 표현하기
  - ‘기름을 바를 수 없을 것입니다’로 약화하기
  rationale: 본절은 풍요의 결핍을 구체적으로 말하는 언약 저주이므로, 의미를 누그러뜨리기보다 소스가 주는 상실감을 보존하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 신명기 28장의 언약 저주 맥락
- issue: 예배적 의미를 과도하게 덧씌우지 않음
  chosen_reading: ‘바르다’를 사용해 일상적 신체용 기름 바름을 기본 의미로 유지했습니다.
  alternative_readings:
  - ‘기름을 붓다’로 번역하여 제의적 인상을 주기
  - ‘기름으로 anoint’의 전통교회식 표현을 그대로 따르기
  rationale: 히브리어 סוך은 여기서 제의보다 생활상의 도포 행위가 핵심이므로, 예배적 ‘성유 부음’으로 오해되지 않도록 했습니다.
  doctrine_reference: 레위기/신명기 용례의 일상적 기름 바름
