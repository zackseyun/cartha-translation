  to: 올리브나무가 당신의 모든 땅에 있을 것이나, 당신은 기름을 몸에 바르지 못할 것입니다. 이는 당신의 올리브[a]가 떨어질 것이기 때문입니다.
  rationale: 원문의 소유·결핍 및 인과 구조를 보존하면서, 장소 표현과 기름을 바르는 행위의 표현을 현대 표준 한국어로 자연스럽게 다듬었습니다. ‘올리브’의 집합적이고 다소 논쟁적인 지시 대상은 본문에서 불필요하게 단정하지 않고 각주에 가능한 해석을 유지했습니다.
