    rationale: ‘온’과 ‘두루’가 범위 의미를 중복하며, ‘영토’는 현대 한국어에서 정치·국가적 뉘앙스가 비교적 강합니다. 농경지와 상속지를 가리키는 문맥에는 ‘당신의 모든 땅에’가 자연스럽습니다.
