  source_fidelity: 히브리어의 사역형 וְהֵשִׁיב은 질병을 ‘다시’ 가져오거나 임하게 한다는 뜻이며, ‘다시 내리실’은 문맥상 이를 적절히 반영합니다. 관계절 אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם는 ‘당신이 두려워하던’으로 질병을 수식해야 합니다. 이어지는 복수 동사 ‘그것들이 … 달라붙을 것입니다’도 원문에 충실합니다.
  naturalness: 초안의 ‘당신이 그것들을 두려워하던 바로 그것들입니다’는 문장 조각으로 독립되어 매우 부자연스럽고, 앞 절과의 통사 관계가 끊깁니다. 관계절을 ‘이집트의 모든 질병’에 직접 연결하면 현대 표준 한국어 합쇼체로 자연스럽습니다. 원문에 없는 접속 표현 ‘그러면’은 삭제하는 편이 좋습니다.
  terminology: ‘이집트’, ‘질병’, ‘두려워하던’, ‘달라붙을 것입니다’는 정확하고 현대적인 표현입니다. 신적 주어에 대한 ‘내리실’의 높임도 문맥과 합쇼체 번역 관행에 맞습니다.
