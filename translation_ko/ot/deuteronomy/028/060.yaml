theological_decisions:
- issue: 재앙의 반복성과 언약 저주의 성격
  chosen_reading: ‘다시 내리실 것이니’로 번역해, 단순한 발생이 아니라 이미 알려진 재앙이 언약 저주로 재현된다는 점을 드러냈습니다.
  alternative_readings:
  - ‘되돌려 보내실 것이니’
  - ‘내려보내실 것이니’
  rationale: 문맥상 출애굽기의 재앙을 기억하게 하는 언약 저주 선언이므로, 재앙의 재발과 심판적 성격을 분명히 하는 표현이 적절합니다.
  doctrine_reference: 신명기 28장의 언약 저주와 출애굽 재앙의 상호연결
