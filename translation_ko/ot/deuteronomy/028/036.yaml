base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
  footnotes:
  - marker: a
    text: Or 'the king whom you appoint over yourself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'there you will worship other gods'; the Hebrew verb literally means 'serve.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 당신과 당신이 당신 위에 세운 왕[a]을, 당신과 당신의 아버지들이 알지 못한 민족에게 데려가실 것입니다. 거기에서 당신은 다른 신들, 곧 나무와 돌을 섬길 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 당신 위에 임명한 왕’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거기에서 당신은 다른 신들을 예배할 것입니다’; 히브리어 동사는 문자적으로 ‘섬기다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ יְהוָה
  english_pob_choice: Yahweh will bring
  chosen_korean: 야훼께서 … 데려가실 것이며
  alternatives_korean:
  - 야훼께서 … 이끄실 것이며
  - 야훼께서 … 데려가실 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되, 추방의 문맥에서 자연스러운 한국어로 ‘데려가실’이 원문의 강한 이동·이송 의미를 잘 드러냅니다.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  english_pob_choice: the king whom you set over yourself
  chosen_korean: 당신이 자신 위에 세운 왕
  alternatives_korean:
  - 당신이 자신 위에 임명한 왕
  - 당신 위에 세운 왕
  lexicon: HALOT
  rationale: ‘세우다’는 תָּקִים(세우다/임명하다)의 의미를 살리고, עָלֶיךָ의 ‘위에’라는 구조를 한국어에서도 유지합니다.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  english_pob_choice: that neither you nor your fathers have known
  chosen_korean: 당신과 당신의 조상들이 알지 못한
  alternatives_korean:
  - 당신과 당신의 아버지들이 알지 못한
  - 당신과 당신의 선조들이 알지 못한
  lexicon: HALOT
  rationale: 히브리어의 ‘아버지들’을 한국어에서는 문맥상 ‘조상들’로 옮겨 남성 중심 표현을 지나치게 반복하지 않으면서도, 알려지지 않은 이방 민족이라는 뜻을 분명히 합니다.
- source_word: עֵץ וָאָבֶן
  english_pob_choice: wood and stone
  chosen_korean: 나무와 돌
  alternatives_korean:
  - 나무와 돌로 된
  - 목재와 석재
  lexicon: HALOT
  rationale: 히브리어는 우상의 물질을 압축적으로 제시하므로, 한국어도 ‘나무와 돌’로 간결하게 옮겨 조롱 섞인 물질적 대비를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기에서 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: עָבַדְתָּ שָּׁם אֱלֹהִים אֲחֵרִים의 동사 의미
  chosen_reading: 섬길 것입니다
  alternative_readings:
  - 예배할 것입니다
  - 봉사할 것입니다
  rationale: 문자적으로는 ‘섬기다’이지만, 문맥상 우상숭배를 가리키므로 한국어에서 종교적 예배의 함의를 함께 전달하도록 했습니다.
  doctrine_reference: 'POB lexical policy: עבד with gods can retain ''serve'' while carrying worship sense in context'
