  text: 네가 아내를 약혼할지라도 다른 남자가 그와 동침할 것이요, 네가 집을 지을지라도 그 안에 살지 못할 것이요, 네가 포도원을 심을지라도 그 열매를 맛보지 못할 것이니라.
