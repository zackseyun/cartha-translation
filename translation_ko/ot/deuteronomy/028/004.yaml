  - 네 떼의 새끼와 네 무리의 새끼
  lexicon: HALOT
  rationale: 관용적인 가축 번식 축복 표현이므로 의미를 분명히 드러내는 ‘새끼’로 옮기되, ‘소떼/양 떼’로 각각의 가축 집단을 살렸습니다.
