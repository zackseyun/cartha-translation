    text: 또는 ‘네 소 떼의 번식과 네 양 떼의 번식’. 원문은 같은 ‘열매’ 표현을 태와 땅과 가축에 반복하며, 뒤의 두 목축 용어로 가축의 번성을 구체적으로 말합니다.
