  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
  footnotes:
  - marker: a
    text: Or 'the increase of your cattle and the offspring of your flock.' The Hebrew expressions שְׁגַר אֲלָפֶיךָ and עַשְׁתְּרֹת צֹאנֶךָ are traditional livestock terms for reproductive increase.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 태의 열매와 네 땅의 열매와 네 가축의 열매가 복을 받습니다. 곧 네 소떼의 새끼와 네 양 떼의 새끼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 같은 ‘열매’ 표현을 세 영역에 반복해, 자손·농산물·가축의 번성 전체를 한 묶음으로 말합니다.
    reason: source_note
lexical_decisions:
