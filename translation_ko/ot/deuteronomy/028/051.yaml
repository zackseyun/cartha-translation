  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
  footnotes:
  - marker: a
    text: Or 'the young of your flock.' The Hebrew expression עַשְׁתְּרֹת צֹאנֶךָ refers to the reproductive yield of the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 나라는 당신의 가축의 새끼와 당신의 땅의 소산을 먹어 치워, 당신이 멸망할 때까지 이를 것입니다. 그 나라는 당신에게 곡식과 새 포도주와 기름, 소 떼의 송아지들과 양 떼의 새끼들[a]을 하나도 남기지 않고, 마침내 당신을 멸망시킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양 떼의 번식 산물’. 히브리어 표현 עַשְׁתְּרֹת צֹאנֶךָ는 양 떼에서 나는 새끼 또는 번식으로 늘어난 산출을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  english_pob_choice: It will consume
  chosen_korean: 삼켜서
  alternatives_korean:
  - 먹어서
  - 소모하여
  - 먹어 치워서
  lexicon: HALOT
  rationale: 문맥이 포위·저주의 파괴적 소진을 말하므로 단순한 ‘먹다’보다 파괴적으로 없애는 뜻이 살아 있는 ‘삼키다’가 더 적절합니다.
- source_word: פְּרִי בְהֶמְתְּךָ
  english_pob_choice: the offspring of your livestock
  chosen_korean: 당신의 가축의 새끼
  alternatives_korean:
  - 당신의 가축의 열매
  - 당신의 짐승의 소산
  - 당신의 가축의 자손
  lexicon: HALOT
  rationale: פְּרִי는 가축에 대해 ‘새끼/산출물’의 뜻이고, בְהֵמָה는 일반적인 가축이므로 자연스러운 한국어로 ‘가축의 새끼’가 문맥을 가장 잘 살립니다.
- source_word: וּפְרִי אַדְמָתְךָ
  english_pob_choice: the produce of your land
  chosen_korean: 당신의 땅의 소산
  alternatives_korean:
  - 당신의 밭의 열매
  - 당신의 토지의 소산
  - 당신의 땅의 산물
  lexicon: HALOT
  rationale: אַדְמָה의 농경적 결실을 가리키므로, 원문의 병렬 구조를 유지하는 ‘땅의 소산’이 간결하고 정확합니다.
- source_word: שְׁגַר אֲלָפֶיךָ וְעַשְׁתְּרֹת צֹאנֶךָ
  english_pob_choice: no young of your herd or lambs of your flock
  chosen_korean: 당신의 소 떼의 송아지와 당신의 양 떼의 어린 것들
  alternatives_korean:
  - 당신의 소 떼의 새끼와 당신의 양 떼의 새끼들
  - 당신의 가축 떼의 새끼와 당신의 양 떼의 새끼들
  - 당신의 소 떼의 송아지와 당신의 양 떼의 새끼들
  lexicon: HALOT
  rationale: שְׁגַר는 소 떼의 새끼를, עַשְׁתְּרֹת צֹאן은 떼의 번식 산출을 가리키므로 문맥상 ‘어린 것들’로 옮기되, POB가 구분한 양 떼 항목의 중의성을 살리기 위해 보다 넓은 표현을 택했습니다.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  english_pob_choice: until it has destroyed you
  chosen_korean: 마침내 당신을 멸망시킬 것입니다
  alternatives_korean:
  - 당신을 멸망시킬 때까지
  - 당신을 없애 버릴 때까지
  - 당신을 파멸시킬 것입니다
  lexicon: HALOT
  rationale: הַאֲבִידוֹ의 사역적 의미는 ‘멸망시키다/파멸시키다’이므로 최종 결과를 강조하는 종결 구문으로 옮겼습니다.
theological_decisions:
- issue: 저주의 주어와 반복 종결
  chosen_reading: 전장 맥락의 저주가 계속되는 주어를 한국어에서도 ‘그것은…’으로 유지했습니다.
  alternative_readings:
  - 주어를 생략하여 수동적으로 옮김
  - ‘그것’ 대신 ‘적군’ 등으로 명시
  rationale: 히브리어는 앞선 침략 세력을 계속 가리키는 단수 주어를 유지하므로, 반복되는 파괴 주체를 분명히 드러내는 번역이 본문 효과를 가장 잘 전달합니다.
  doctrine_reference: 본문 맥락 보존
- issue: עַשְׁתְּרֹת צֹאנֶךָ의 범위
  chosen_reading: ‘양 떼의 어린 것들’로 옮겨 번식 산출/새끼의 의미를 열어 두었습니다.
  alternative_readings:
  - ‘양 떼의 새끼들’
  - ‘양 떼의 어린 양들’
  - ‘암양들’
  rationale: 히브리어 표현은 정확한 종별 명칭보다 양 떼의 번식 결과를 가리키는 폭넓은 표현이므로, 단정적으로 특정화하기보다 문맥적 의미를 보존하는 쪽이 더 안전합니다.
  doctrine_reference: 어휘 중의성 보존
