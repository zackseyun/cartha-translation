base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
  footnotes:
  - marker: a
    text: Or 'an object of horror.' The Hebrew term can denote something that causes horror or dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신을 적들 앞에서 패하게 넘겨주실 것입니다. 당신은 한 길로 그들을 치러 나가지만, 일곱 길로 그들 앞에서 도망하게 될 것이며, 온 땅의 모든 왕국들에게 공포가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공포의 대상’. 히브리어는 공포를 불러일으키는 것 또는 그 자체로 경악스러운 존재를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ / יְהוָה
  english_pob_choice: will give you over / Yahweh
  chosen_korean: 야훼께서 당신을 … 넘겨주실 것입니다
  alternatives_korean:
  - 야훼께서 당신을 … 주실 것입니다
  - 주님께서 당신을 … 넘겨주실 것입니다
  lexicon: HALOT
  rationale: נתן의 ‘주다’가 여기서는 저주 맥락에서 ‘넘겨주다’라는 처지 변화의 의미로 쓰였으므로, 단순한 ‘주시다’보다 ‘넘겨주다’가 원문의 힘을 더 잘 살립니다. 신명기의 יְהוָה는 관례적 ‘주님’ 대신 고유명 ‘야훼’로 옮겼습니다.
- source_word: נִגָּף לִפְנֵי אֹיְבֶיךָ
  english_pob_choice: as defeated before your enemies
  chosen_korean: 적들 앞에서 패하게
  alternatives_korean:
  - 적들 앞에서 패배한 채
  - 적들 앞에서 쓰러지게
  lexicon: HALOT
  rationale: נִגָּף는 전투적 맥락에서 ‘패하다, 타격을 입다’의 결과 상태를 가리키므로, 현대 한국어에서 자연스럽고 군사적 의미가 분명한 ‘패하게’로 옮겼습니다.
- source_word: בְּדֶרֶךְ אֶחָד … וּבְשִׁבְעָה דְרָכִים
  english_pob_choice: by one way … by seven ways
  chosen_korean: 한 길로 … 일곱 길로
  alternatives_korean:
  - 한 길로 … 일곱 갈래로
  - 한 방향으로 … 일곱 방향으로
  lexicon: HALOT
  rationale: דרך의 기본 이미지인 ‘길/노선’을 살려 앞뒤 병렬을 유지했습니다. ‘한 길/일곱 길’은 원문의 대구법을 가장 직접적으로 드러냅니다.
- source_word: תָּנוּס לְפָנָיו
  english_pob_choice: you will flee before them
  chosen_korean: 그들 앞에서 도망하게 될 것이며
  alternatives_korean:
  - 그들 앞에서 달아나게 될 것이며
  - 그들 앞에서 도망칠 것이며
  lexicon: HALOT
  rationale: נוס는 ‘도망하다, 달아나다’의 의미이므로, 전투 장면과 자연스러운 서술형 미래로 풀었습니다. 전치사 לְפָנָיו는 군사적 패배의 결과로 ‘그들 앞에서’라고 직역에 가깝게 살렸습니다.
- source_word: לְזַעֲוָה
  english_pob_choice: a horror
  chosen_korean: 공포가 될 것입니다
  alternatives_korean:
  - 소름 끼치는 존재가 될 것입니다
  - 전율의 대상이 될 것입니다
  lexicon: HALOT
  rationale: זַעֲוָה는 단순 감정으로서의 공포보다, 남들이 두려워하고 기피하는 ‘공포의 대상’이라는 공적 효과를 가리킵니다. 한국어에서는 간결하게 ‘공포가 되다’로 옮겨 그 충격성을 살렸습니다.
theological_decisions:
- issue: 율법 저주 문맥에서의 심판 표현
  chosen_reading: ‘넘겨주실 것입니다’와 ‘패하게’로 번역해, 전쟁 패배가 야훼의 언약적 심판임을 드러냈습니다.
  alternative_readings:
  - ‘패배시키실 것입니다’
  - ‘멸망시키실 것입니다’
  rationale: 본문은 단순한 전쟁 결과가 아니라 언약 저주의 집행을 말하므로, 결과를 과장하지 않으면서도 주체가 야훼이심을 분명히 하는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§5–6
- issue: לְזַעֲוָה의 공적 충격성
  chosen_reading: ‘공포가 될 것입니다’
  alternative_readings:
  - ‘두려움의 대상이 될 것입니다’
  - ‘소름 끼치는 존재가 될 것입니다’
  rationale: 열방 앞에서 이스라엘이 수치와 경악의 대상이 된다는 점을, 지나치게 설명적이지 않으면서도 현대어로 전달했습니다.
  doctrine_reference: DOCTRINE.md contested terms — curse imagery
