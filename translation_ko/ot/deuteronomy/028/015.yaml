    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 당신이 당신의 하나님 야훼의 음성[a]을 듣지 않고, 오늘 내가 당신에게 명령하는 그의 모든 계명과 그의 규례를 지켜 행하지 않으면[b], 이 모든 저주가 당신에게 임하여 당신을 따라잡을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘음성/소리로 듣다’라는 관용구를 사용하며, 문맥상 ‘순종하다’의 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 모든 계명과 그의 규례를 지키고 행하는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
