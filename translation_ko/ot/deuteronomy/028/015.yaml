  rationale: 본문의 고유명사를 제목화하지 않고 신적 이름으로 직접 옮겨, POB의 기본 원칙을 따랐습니다.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  english_pob_choice: all his commandments and his statutes
  chosen_korean: 그의 모든 계명과 그의 규례
  alternatives_korean:
  - 그의 모든 명령과 규례
  - 그의 모든 계명과 법도
  lexicon: HALOT
  rationale: 둘의 병렬을 유지하면서, 신명기 문맥에서 הלכה적·언약적 용례를 반영해 ‘계명’과 ‘규례’를 구분했습니다.
- source_word: וּבָאוּ עָלֶיךָ ... וְהִשִּׂיגוּךָ
  english_pob_choice: will come upon you ... and overtake you
  chosen_korean: 당신에게 임하여 당신을 따라잡을 것입니다
  alternatives_korean:
  - 당신에게 닥쳐 당신을 따라잡을 것입니다
  - 당신에게 와서 당신을 따라잡을 것입니다
  lexicon: HALOT
  rationale: ‘임하다’는 재난/저주의 도래를, ‘따라잡다’는 पीछ아오는 저주 이미지의 역동성을 비교적 직접적으로 전달합니다.
theological_decisions:
- issue: 언약적 불순종의 결과를 드러내는 저주 어휘
  chosen_reading: 이 모든 저주가 당신에게 임하여 당신을 따라잡을 것입니다
  alternative_readings:
  - 이 모든 저주가 당신에게 올 것입니다
  - 이 모든 저주가 당신에게 닥칠 것입니다
  rationale: 저주를 단순한 불운으로 누그러뜨리지 않고, 언약 위반에 대한 실제적·인격적 결과라는 본문의 힘을 살렸습니다.
  doctrine_reference: 신명기 28장 축복/저주 구조; 원어 직역 우선 원칙
