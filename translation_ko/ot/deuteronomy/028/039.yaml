base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
  footnotes:
  - marker: a
    text: Or 'store it up.' The Hebrew verb can mean gather, collect, or store.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도원을 심고 가꾸겠지만, 포도주를 마시지도 못하고 그것을 저장하지도 못할 것입니다.[a] 벌레가 그것을 먹을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 모으지도 못할 것입니다’ 또는 ‘그것을 거두어들이지도 못할 것입니다’. 히브리어 동사는 모으다, 거두어들이다, 저장하다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  english_pob_choice: vineyards
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  - 포도원들
  lexicon: HALOT
  rationale: כרמים은 포도 재배지를 가리키므로 한국어에서는 자연스러운 단수 집합 명사인 ‘포도원’이 적절합니다.
- source_word: וְעָבָדְתָּ
  english_pob_choice: and cultivate them
  chosen_korean: 경작하지만
  alternatives_korean:
  - 가꾸지만
  - 일구지만
  - 돌보지만
  lexicon: HALOT
  rationale: עבד는 농경 문맥에서 ‘일하다/경작하다’의 뜻이므로, 포도원에 대한 수고를 드러내는 ‘경작하다’로 옮겼습니다.
- source_word: וְלֹא תֶאֱגֹר
  english_pob_choice: or gather it
  chosen_korean: 거두지도 못할 것입니다
  alternatives_korean:
  - 모으지도 못할 것입니다
  - 저장하지도 못할 것입니다
  lexicon: HALOT
  rationale: אגר는 ‘거두다, 모으다, 저장하다’의 범위를 가지며, 포도원 문맥에서는 수확을 거두는 의미가 가장 자연스럽습니다.
- source_word: הַתּוֹלָעַת
  english_pob_choice: the worm
  chosen_korean: 벌레
  alternatives_korean:
  - 구더기
  - 벌레
  lexicon: HALOT
  rationale: תולעת는 파괴하는 벌레류를 넓게 가리키므로, 특정 종을 한정하지 않는 ‘벌레’가 가장 직역에 가깝습니다.
theological_decisions:
- issue: 수확 실패의 원인 표현
  chosen_reading: “그것을 벌레가 먹을 것이기 때문입니다”로 원인을 직접 제시했습니다.
  alternative_readings:
  - “벌레가 그것을 먹으므로”
  - “그것은 벌레에게 먹힐 것이기 때문입니다”
  rationale: 히브리어 כִּי는 뒤 절이 앞 절의 실패 원인을 설명하므로, 한국어에서도 인과를 분명하게 드러내는 것이 본문의 경고성을 살립니다.
  doctrine_reference: 신명기 28장의 언약 저주 문맥
