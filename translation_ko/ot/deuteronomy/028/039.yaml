revisions:
- from: 포도원을 심고 경작하지만, 포도주를 마시지 못하며 거두지도 못할 것입니다. 그것을 벌레가 먹을 것이기 때문입니다.
  to: 포도원을 심고 가꾸겠지만, 포도주를 마시지도 못하고 그것을 저장하지도 못할 것입니다.[a] 벌레가 그것을 먹을 것이기 때문입니다.
  rationale: 아גר를 ‘저장하다’로 옮겨 포도주라는 직접 목적어와의 한국어 결합을 자연스럽게 하고, ‘모으다/거두어들이다’라는 가능한 의미는 각주로 보존했습니다. ‘가꾸다’는 포도원에 대한 농경 노동을 자연스럽게 나타냅니다. 벌레가 ‘그것’을 먹는다는 원문의 다소 거친 대명사 연결은 해석적으로 구체화하지 않고 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:57Z'
