  rationale: 이 프로젝트의 기본값에 따라 신적 이름 יהוה는 호칭 ‘주’로 대체하지 않고 고유명사 ‘야훼’로 옮겼습니다.
- source_word: בִּשְׁחִין רָע
  english_pob_choice: with severe boils
  chosen_korean: 심한 종기
  alternatives_korean:
  - 악성 종기
