  rationale: שְׁחִין은 피부의 염증성 종기를 가리키며, רָע는 그 심각함을 더합니다. 현대 한국어에서 자연스럽고 강한 표현으로 ‘심한 종기’를 택했습니다.
- source_word: וְעַל הַשֹּׁקַיִם
  english_pob_choice: and on the legs
  chosen_korean: 다리에
  alternatives_korean:
