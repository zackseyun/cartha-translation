  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
  footnotes:
  - marker: a
    text: Or 'shins' for 'legs'; the Hebrew term refers more specifically to the lower leg.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 무릎과 다리에 심한 종기[a]를 치셔서, 발바닥에서부터 머리 꼭대기까지 고침을 받을 수 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정강이들’로 옮길 수 있습니다. 히브리어 용어는 더 구체적으로 아래다리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md default for YHWH
  rationale: 이 프로젝트의 기본값에 따라 신적 이름 יהוה는 호칭 ‘주’로 대체하지 않고 고유명사 ‘야훼’로 옮겼습니다.
- source_word: בִּשְׁחִין רָע
  english_pob_choice: with severe boils
  chosen_korean: 심한 종기
  alternatives_korean:
  - 악성 종기
  - 심한 부스럼
  lexicon: HALOT
  rationale: שְׁחִין은 피부의 염증성 종기를 가리키며, רָע는 그 심각함을 더합니다. 현대 한국어에서 자연스럽고 강한 표현으로 ‘심한 종기’를 택했습니다.
- source_word: וְעַל הַשֹּׁקַיִם
  english_pob_choice: and on the legs
  chosen_korean: 다리에
  alternatives_korean:
  - 정강이에
  - 종아리에
  lexicon: HALOT
  rationale: שׁוֹקַיִם은 아래다리 전체를 가리킬 수 있어, 본문 흐름상 더 넓은 범위의 ‘다리’로 옮겼습니다. 더 구체적인 해석 가능성은 각주로 남겼습니다.
- source_word: וְעַד קָדְקֳדֶךָ
  english_pob_choice: to the crown of your head
  chosen_korean: 머리 꼭대기까지
  alternatives_korean:
  - 정수리까지
  - 머리의 꼭대기까지
  lexicon: HALOT
  rationale: קָדְקֹד는 머리의 꼭대기/정수리를 뜻하므로, 전신을 포괄하는 관용을 살리되 현대 한국어에서 자연스러운 ‘머리 꼭대기까지’로 옮겼습니다.
theological_decisions:
- issue: 재앙의 전신적 범위 표현
  chosen_reading: 발바닥에서부터 머리 꼭대기까지
  alternative_readings:
