    text: 또는 ‘정강이’로 옮길 수 있습니다. 히브리어 용어는 더 구체적으로 아래다리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
