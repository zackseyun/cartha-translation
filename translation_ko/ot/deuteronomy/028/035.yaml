  source_fidelity: 히브리어의 직접적인 재앙 선언, ‘심한 종기’, 무릎과 하퇴 부위, 발바닥부터 머리 꼭대기까지의 전신 범위는 대체로 반영되어 있습니다. 다만 초안의 ‘종기를 치셔서’는 한국어에서 종기 자체를 때린다는 뜻으로도 읽혀, בִּשְׁחִין(‘종기로’)의 수단·재앙 표지를 정확히 드러내지 못합니다.
  naturalness: ‘심한 종기로 치실 것이며’가 원문의 직접성과 현대 한국어 성서 문체를 함께 살립니다. 또한 각주의 대상은 ‘종기’가 아니라 שׁוֹקַיִם에 해당하는 ‘다리’이므로 표지를 그 낱말에 붙여야 합니다. 두 절로 나누어 불치성과 전신 범위를 명료하게 했습니다.
