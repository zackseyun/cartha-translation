translation:
  language: ko
  text: 야훼께서 무릎과 다리[a]에 심한 종기로 치실 것이며, 그 종기는 발바닥에서 머리 꼭대기까지 고침을 받을 수 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
