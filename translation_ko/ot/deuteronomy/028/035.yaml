  - 종아리에
  lexicon: HALOT
  rationale: שׁוֹקַיִם은 아래다리 전체를 가리킬 수 있어, 본문 흐름상 더 넓은 범위의 ‘다리’로 옮겼습니다. 더 구체적인 해석 가능성은 각주로 남겼습니다.
- source_word: וְעַד קָדְקֳדֶךָ
  english_pob_choice: to the crown of your head
  chosen_korean: 머리 꼭대기까지
  alternatives_korean:
  - 정수리까지
  - 머리의 꼭대기까지
  lexicon: HALOT
  rationale: קָדְקֹד는 머리의 꼭대기/정수리를 뜻하므로, 전신을 포괄하는 관용을 살리되 현대 한국어에서 자연스러운 ‘머리 꼭대기까지’로 옮겼습니다.
