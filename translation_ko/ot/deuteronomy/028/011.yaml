base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
  footnotes:
  - marker: a
    text: Or 'for good' or 'for well-being.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fruit of your womb,' an idiom for children or offspring.
    reason: lexical_alternative
  - marker: c
    text: Or 'the produce of your land' or 'the yield of your soil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 당신의 태의 열매[b]와 가축의 열매와 땅의 열매[c]에서 당신에게 풍성한 복[a]을 주실 것입니다. 이는 야훼께서 당신의 조상들에게 맹세하시고 당신에게 주시겠다고 하신 땅에서 이루어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋게’ 또는 ‘잘되게’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘태의 열매’는 자녀나 후손을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 땅의 소산’ 또는 ‘당신의 토지의 수확’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ / will make you abound
  english_pob_choice: will make you abound
  chosen_korean: 복되게 하셔서
  alternatives_korean:
  - 풍성하게 하셔서
  - 넘치게 하셔서
  - 널리 더하시고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 이어지는 세 영역의 축복 전체를 자연스럽게 묶기 위해 한국어에서는 ‘복되게 하셔서’로 옮겼습니다.
- source_word: לְטוֹבָה / in prosperity
  english_pob_choice: in prosperity
  chosen_korean: 복되게
  alternatives_korean:
  - 잘되게
  - 선하게
  - 평안하게
  lexicon: HALOT
  rationale: 직역하면 ‘선함을 위하여’이지만, 이 문맥에서는 언약적 번영과 유익을 가리키므로 ‘복되게’가 가장 자연스럽고 본문의 축복 어감을 잘 살립니다.
- source_word: בִּפְרִי בִטְנְךָ / in the fruit of your womb
  english_pob_choice: in the fruit of your womb
  chosen_korean: 당신의 배의 열매
  alternatives_korean:
  - 당신의 태의 열매
  - 당신의 자손
  - 자녀
  lexicon: HALOT
  rationale: POB의 어휘 선택처럼 반복되는 ‘열매’ 구조를 유지해 인간의 생식, 가축, 토지의 생산을 하나의 축복 공식으로 드러냈습니다.
- source_word: וּבִפְרִי בְהַמְתְּךָ / in the fruit of your livestock
  english_pob_choice: in the fruit of your livestock
  chosen_korean: 당신의 가축의 열매
  alternatives_korean:
  - 당신의 가축의 소산
  - 당신의 짐승의 열매
  - 당신의 가축의 번식
  lexicon: HALOT
  rationale: ‘בהמה’는 가축 전체를 가리키므로 ‘가축’이 적절하며, 앞뒤와 같은 구조를 맞추기 위해 ‘열매’를 유지했습니다.
- source_word: וּבִפְרִי אַדְמָתֶךָ / in the fruit of your ground
  english_pob_choice: in the fruit of your ground
  chosen_korean: 당신의 땅의 열매
  alternatives_korean:
  - 당신의 토지의 소산
  - 당신의 밭의 소출
  - 당신의 땅의 소산
  lexicon: HALOT
  rationale: ‘adamah’를 자연스러운 한국어로 풀되, 본문의 반복 구조와 농경적 이미지를 보존하기 위해 ‘땅의 열매’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 여호와 대체가 아니라 신명기의 언약명 자체를 드러내기 위해 원어 명칭을 음역한 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 축복 공식의 반복 구조를 유지할지 여부
  chosen_reading: 인간의 열매, 가축의 열매, 땅의 열매라는 삼중 반복을 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘자녀와 가축과 소출’로 옮김
  rationale: 본문은 세 범주의 번영을 같은 ‘열매’ 어구로 묶어 하나님의 포괄적 복을 강조하므로, 이를 풀어 쓰면 수사적 힘이 약해집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms)
