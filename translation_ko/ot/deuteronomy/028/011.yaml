  naturalness: ‘배의 열매’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘태의 열매’는 성경적 관용 표현으로 통용되며, 각주로 자녀·후손의 뜻을 밝혀 자연스러움을 보완할 수 있습니다. 수정문은 합쇼체의 현대적 정중 문체를 유지합니다.
  terminology: 야훼 표기는 원문 יְהוָה 및 POB 방침과 일치합니다. ‘풍성한 복’은 히필 יתר의 풍성하게 하심과 לְטוֹבָה의 유익/복됨을 함께 드러냅니다. 세 차례의 ‘열매’ 반복도 유지했습니다.
