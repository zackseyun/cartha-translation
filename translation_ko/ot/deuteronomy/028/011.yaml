revisions:
- from: 야훼께서 당신을 복되게 하셔서, 당신의 배의 열매와 당신의 가축의 열매와 당신의 땅의 열매가 풍성하게 하십니다. 이는 야훼께서 당신의 조상들에게 주시겠다고 맹세하신 그 땅에서 이루어집니다.[a][b][c]
  to: 야훼께서는 당신의 태의 열매[b]와 가축의 열매와 땅의 열매[c]에서 당신에게 풍성한 복[a]을 주실 것입니다. 이는 야훼께서 당신의 조상들에게 맹세하시고 당신에게 주시겠다고 하신 땅에서 이루어질 것입니다.
  rationale: 야훼를 축복의 주체로, 미래의 약속을 미래형으로 회복했습니다. ‘태의 열매·가축의 열매·땅의 열매’라는 원문의 삼중 반복을 보존하면서, 풍성함과 유익의 의미를 ‘풍성한 복’으로 자연스럽게 나타냈습니다. 마지막 절은 약속의 땅에서 이 축복이 이루어짐을 명시하며, 조상들에게 하신 맹세와 현 청자에게 땅을 주신다는 목적을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:32Z'
