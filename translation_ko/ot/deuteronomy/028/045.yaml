translation:
  language: ko
  text: 이 모든 저주가 당신에게 임하고, 당신을 뒤쫓아 따라잡아, 마침내 당신이 멸망하게 될 것입니다. 이는 당신의 하나님 야훼의 말씀을 듣지 않고[a], 그분이 당신에게 명령하신 계명과 규례를 지키지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 하나님 야훼께 순종하지 않고’. 히브리어를 직역하면 ‘당신의 하나님 야훼의 음성을 듣지 않고’입니다.
    reason: lexical_alternative
lexical_decisions:
