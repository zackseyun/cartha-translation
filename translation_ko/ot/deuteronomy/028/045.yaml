  lexicon: HALOT
  rationale: 히브리어 결과 종결을 한국어 종결문으로 자연스럽게 옮기되, 단순한 과정이 아니라 최종 파괴라는 의미를 유지합니다.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה אֱלֹהֶיךָ
  english_pob_choice: you did not listen to the voice of Yahweh your God
  chosen_korean: 당신이 야훼 당신의 하나님의 말씀을 듣지 않고
  alternatives_korean:
  - 당신이 야훼 당신의 하나님의 음성을 듣지 않고
  - 당신이 야훼 당신의 하나님께 순종하지 않고
  lexicon: HALOT
  rationale: ‘בְּקוֹל’의 직역감은 ‘음성’이지만, 한국어 성경에서 ‘말씀을 듣다’가 더 자연스러운 순종 표현이어서, 청취-불순종의 긴장을 살리는 범위 안에서 선택했습니다.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  english_pob_choice: his commandments and his statutes
  chosen_korean: 그분의 계명과 규례
  alternatives_korean:
  - 그분의 명령들과 규례들
  - 그분의 계명들과 율례
  lexicon: HALOT
  rationale: 모세오경의 율법적 병렬을 한국어에서 흔히 대응되는 ‘계명/규례’로 살려, 두 항목의 구별을 유지했습니다.
theological_decisions:
- issue: 야훼의 음성/말씀 표현
  chosen_reading: ‘듣지 않다’와 ‘말씀’의 결합으로, 청취의 실패가 곧 언약 불순종임을 드러냈습니다.
  alternative_readings:
  - ‘음성’을 직접 써서 더 문자적으로 옮기는 방법
  - ‘순종하지 않았다’로 동적 번역하는 방법
  rationale: 히브리어는 문자적으로 ‘야훼의 음성에 듣다’이지만, 본절의 핵심은 언약적 청종의 실패입니다. 한국어에서는 ‘말씀을 듣지 않고’가 본문의 음성-순종 연결을 유지하면서도 자연스럽습니다.
  doctrine_reference: Original-language primacy; preserve auditory covenant metaphor without flattening it into abstraction
