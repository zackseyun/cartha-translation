source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
  footnotes:
  - marker: a
    text: Or 'because you did not obey the LORD your God by keeping his commandments and his statutes.' The Hebrew literally says 'did not listen to the voice of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 저주가 당신에게 임하고, 당신을 뒤쫓아 따라잡아 마침내 당신이 멸망할 것입니다. 이는 당신이 야훼 당신의 하나님의 말씀을 듣지 않고, 그분이 당신에게 명령하신 그분의 계명과 규례를 지키지 않았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  english_pob_choice: all these curses will come upon you
  chosen_korean: 이 모든 저주가 당신에게 임하고
  alternatives_korean:
  - 이 모든 저주가 당신 위에 임하고
  - 이 모든 저주가 당신에게 닥치고
  lexicon: WLC / HALOT
  rationale: ‘임하다’는 הדין/재앙이 사람에게 덮쳐오는 뉘앙스를 살리면서도 문맥의 경고조를 자연스럽게 옮깁니다.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  english_pob_choice: pursue you and overtake you
  chosen_korean: 당신을 뒤쫓아 따라잡아
  alternatives_korean:
  - 당신을 추적하고 따라잡아
  - 당신을 쫓아가 붙잡아
  lexicon: HALOT
  rationale: ‘뒤쫓다’와 ‘따라잡다’로 두 동사의 연쇄를 구분해, 저주가 단지 따라오는 것이 아니라 결국 붙잡는다는 강도를 보존합니다.
- source_word: עַד הִשָּׁמְדָךְ
  english_pob_choice: until you are destroyed
  chosen_korean: 마침내 당신이 멸망할 것입니다
  alternatives_korean:
  - 당신이 멸망할 때까지
  - 당신이 완전히 멸망할 때까지
  lexicon: HALOT
  rationale: 히브리어 결과 종결을 한국어 종결문으로 자연스럽게 옮기되, 단순한 과정이 아니라 최종 파괴라는 의미를 유지합니다.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה אֱלֹהֶיךָ
  english_pob_choice: you did not listen to the voice of Yahweh your God
  chosen_korean: 당신이 야훼 당신의 하나님의 말씀을 듣지 않고
  alternatives_korean:
  - 당신이 야훼 당신의 하나님의 음성을 듣지 않고
  - 당신이 야훼 당신의 하나님께 순종하지 않고
  lexicon: HALOT
  rationale: ‘בְּקוֹל’의 직역감은 ‘음성’이지만, 한국어 성경에서 ‘말씀을 듣다’가 더 자연스러운 순종 표현이어서, 청취-불순종의 긴장을 살리는 범위 안에서 선택했습니다.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  english_pob_choice: his commandments and his statutes
  chosen_korean: 그분의 계명과 규례
  alternatives_korean:
  - 그분의 명령들과 규례들
  - 그분의 계명들과 율례
  lexicon: HALOT
  rationale: 모세오경의 율법적 병렬을 한국어에서 흔히 대응되는 ‘계명/규례’로 살려, 두 항목의 구별을 유지했습니다.
theological_decisions:
- issue: 야훼의 음성/말씀 표현
  chosen_reading: ‘듣지 않다’와 ‘말씀’의 결합으로, 청취의 실패가 곧 언약 불순종임을 드러냈습니다.
  alternative_readings:
  - ‘음성’을 직접 써서 더 문자적으로 옮기는 방법
  - ‘순종하지 않았다’로 동적 번역하는 방법
  rationale: 히브리어는 문자적으로 ‘야훼의 음성에 듣다’이지만, 본절의 핵심은 언약적 청종의 실패입니다. 한국어에서는 ‘말씀을 듣지 않고’가 본문의 음성-순종 연결을 유지하면서도 자연스럽습니다.
  doctrine_reference: Original-language primacy; preserve auditory covenant metaphor without flattening it into abstraction
