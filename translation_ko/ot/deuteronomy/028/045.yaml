  rationale: ‘임하다’는 הדין/재앙이 사람에게 덮쳐오는 뉘앙스를 살리면서도 문맥의 경고조를 자연스럽게 옮깁니다.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  english_pob_choice: pursue you and overtake you
  chosen_korean: 당신을 뒤쫓아 따라잡아
  alternatives_korean:
  - 당신을 추적하고 따라잡아
  - 당신을 쫓아가 붙잡아
  lexicon: HALOT
  rationale: ‘뒤쫓다’와 ‘따라잡다’로 두 동사의 연쇄를 구분해, 저주가 단지 따라오는 것이 아니라 결국 붙잡는다는 강도를 보존합니다.
- source_word: עַד הִשָּׁמְדָךְ
  english_pob_choice: until you are destroyed
  chosen_korean: 마침내 당신이 멸망할 것입니다
  alternatives_korean:
  - 당신이 멸망할 때까지
