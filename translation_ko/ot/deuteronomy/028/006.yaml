    rationale: ‘복을 받으십시오’는 독자에게 복을 받으라고 권하거나 명하는 뜻이 되지만, 원문은 언약적 결과를 선포하는 두 개의 축복 진술입니다.
  - severity: medium
    issue: ‘때마다’가 반복성을 첨가함
    rationale: בְּ + 부정사구문은 ‘들어올 때/나갈 때’라는 상황을 나타냅니다. ‘때마다’는 본문에 없는 매번의 반복이라는 의미를 더합니다.
  - severity: low
    issue: 각주 a의 ‘공동체적 주소’ 표현이 부자연스러움
    rationale: 한국어에서는 ‘공동체를 단수로 부르는 표현’이라고 하면 원문의 대표적 단수 호칭을 더 명료하고 자연스럽게 설명합니다.
