  text: 당신이 들어올 때마다 복을 받으며, 당신이 나갈 때마다 복을 받으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 2인칭 남성 단수입니다. 이스라엘 전체를 단수로 부르는 공동체적 주소입니다.
    reason: cultural_note
  - marker: b
    text: ‘들어오고 나감’은 삶과 활동 전체를 가리키는 메리즘으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed shall you be
  chosen_korean: 복을 받으며
  alternatives_korean:
  - 복되십시오
  - 복을 받으십시오
  lexicon: HALOT
  rationale: 히브리어 분사형 축복 진술을 한국어에서는 결과 상태를 나타내는 표현으로 풀어 옮기되, 축복 선언의 힘을 살리기 위해 간결한 서술형을 택했습니다.
- source_word: בְּבֹאֶךָ
