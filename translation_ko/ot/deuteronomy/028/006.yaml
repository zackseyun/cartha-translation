review_pass:
  verdict: revise
  source_fidelity: 히브리어는 두 개의 병렬된 축복 선언(‘복되다/복을 받다’)이며, 명령이 아닙니다. 초안의 ‘복을 받으십시오’는 청유·명령형으로 바꾸어 본문의 선언적 미래 의미를 변경합니다. 또한 ‘때마다’는 원문의 단순한 시간/상황 표현에 반복성을 추가합니다.
  naturalness: ‘당신은 들어올 때에도 복을 받을 것이며, 나갈 때에도 복을 받을 것입니다’는 현대 표준 한국어의 합쇼체 문장으로 자연스럽고, 병렬과 반복을 유지합니다.
  terminology: ‘복을 받다’는 בָּרוּךְ의 축복 선언을 자연스럽게 옮깁니다. ‘당신’은 한국어에서 다소 제한적인 호칭이나, 원문의 단수 호칭을 드러내려는 현 번역의 선택 안에서는 사용할 수 있습니다. 각주에서는 ‘공동체적 주소’보다 ‘공동체를 단수로 부르는 표현’이 자연스럽습니다.
  issues:
