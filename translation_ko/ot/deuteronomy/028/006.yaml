  rationale: 첫 절과 짝을 이루는 동작을 자연스러운 현대 한국어로 대칭시키되, 진입과 퇴장의 전생활적 범위를 드러내기 위해 반복 표현을 유지했습니다.
- source_word: אַתָּה
  english_pob_choice: you
  chosen_korean: 당신이
  alternatives_korean:
  - 너는
  - 당신은
  lexicon: HALOT
  rationale: 히브리어 2인칭 남성 단수의 대표적 공동체 호칭을 한국어에서 단수 인칭으로 유지하되, 공적 축복문에 어울리는 ‘당신’으로 옮겼습니다.
theological_decisions:
- issue: 이스라엘을 향한 단수 호칭
  chosen_reading: 히브리어의 단수 2인칭을 그대로 살려 공동체를 대표하는 단수 주소로 번역했습니다.
  alternative_readings:
  - 당신들
  - 이스라엘은
  rationale: 본문은 공동체 전체를 단수로 부르는 언약적 수사이므로, 이를 풀어 복수나 명시적 명사로 바꾸지 않고 독자가 그 긴장을 보게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4, §5
- issue: ‘들어감/나감’의 관용적 범위
  chosen_reading: 직역만 하지 않고 생활 전체를 가리키는 관용 가능성을 반영해 반복적 시간표현으로 옮겼습니다.
  alternative_readings:
  - 당신이 들어올 때 복을 받으며, 당신이 나갈 때 복을 받으십시오.
  - 당신의 들어옴과 나감에 복을 받으십시오.
  rationale: 본문의 ‘들어옴/나감’은 일상과 활동 전반을 포괄하는 메리즘일 가능성이 있어, 한국어에서도 그 폭이 드러나도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
