  text: בָּר֥וּךְ אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וּ/בָר֥וּךְ אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
  footnotes:
  - marker: a
    text: Hebrew singular 'you'; Israel is addressed as a corporate people in the singular.
    reason: cultural_note
  - marker: b
    text: Or 'in your coming in ... in your going out'; the expression likely functions as a merism for the whole course of life and activity.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 들어올 때에도 복을 받을 것이며, 나갈 때에도 복을 받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 2인칭 남성 단수입니다. 이스라엘 전체를 단수로 부르는 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘들어옴과 나감’은 삶과 활동 전체를 가리키는 메리즘으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed shall you be
  chosen_korean: 복을 받으며
  alternatives_korean:
  - 복되십시오
  - 복을 받으십시오
  lexicon: HALOT
  rationale: 히브리어 분사형 축복 진술을 한국어에서는 결과 상태를 나타내는 표현으로 풀어 옮기되, 축복 선언의 힘을 살리기 위해 간결한 서술형을 택했습니다.
- source_word: בְּבֹאֶךָ
  english_pob_choice: when you come in
  chosen_korean: 당신이 들어올 때마다
  alternatives_korean:
  - 당신이 들어올 때
  - 당신의 들어옴에
  - 들어올 때
  lexicon: HALOT
  rationale: ‘들어가다/들어오다’의 통상적 의미를 살리면서도 반복적·생활 전반적 뉘앙스를 반영하기 위해 ‘때마다’를 넣었습니다.
- source_word: בְּצֵאתֶךָ
  english_pob_choice: when you go out
  chosen_korean: 당신이 나갈 때마다
  alternatives_korean:
  - 당신이 나갈 때
  - 당신의 나감에
  - 나갈 때
  lexicon: HALOT
  rationale: 첫 절과 짝을 이루는 동작을 자연스러운 현대 한국어로 대칭시키되, 진입과 퇴장의 전생활적 범위를 드러내기 위해 반복 표현을 유지했습니다.
- source_word: אַתָּה
  english_pob_choice: you
  chosen_korean: 당신이
  alternatives_korean:
  - 너는
  - 당신은
  lexicon: HALOT
  rationale: 히브리어 2인칭 남성 단수의 대표적 공동체 호칭을 한국어에서 단수 인칭으로 유지하되, 공적 축복문에 어울리는 ‘당신’으로 옮겼습니다.
theological_decisions:
- issue: 이스라엘을 향한 단수 호칭
  chosen_reading: 히브리어의 단수 2인칭을 그대로 살려 공동체를 대표하는 단수 주소로 번역했습니다.
  alternative_readings:
  - 당신들
  - 이스라엘은
  rationale: 본문은 공동체 전체를 단수로 부르는 언약적 수사이므로, 이를 풀어 복수나 명시적 명사로 바꾸지 않고 독자가 그 긴장을 보게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4, §5
- issue: ‘들어감/나감’의 관용적 범위
  chosen_reading: 직역만 하지 않고 생활 전체를 가리키는 관용 가능성을 반영해 반복적 시간표현으로 옮겼습니다.
  alternative_readings:
  - 당신이 들어올 때 복을 받으며, 당신이 나갈 때 복을 받으십시오.
  - 당신의 들어옴과 나감에 복을 받으십시오.
  rationale: 본문의 ‘들어옴/나감’은 일상과 활동 전반을 포괄하는 메리즘일 가능성이 있어, 한국어에서도 그 폭이 드러나도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
