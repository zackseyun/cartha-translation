translation:
  language: ko
  text: 그것들은 당신과 당신의 자손에게 영원히 표징과 이적이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 후손’. 히브리어 ‘씨’는 집합적으로 자손이나 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것들’은 앞 문맥에서 언급된 언약 저주들을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  english_pob_choice: And they will be
  chosen_korean: 그것들은 … 있을 것입니다
  alternatives_korean:
  - 그리고 그것들은 … 될 것입니다
  - 그것들은 … 될 것입니다
  lexicon: HALOT
  rationale: 복수 동사와 문맥상의 주어가 앞선 저주들이라는 점을 살려 ‘그것들’로 받았고, 결과 지속을 나타내는 미래형으로 옮겼습니다.
- source_word: בְּךָ / וּבְזַרְעֲךָ
  english_pob_choice: on you / and on your offspring
  chosen_korean: 당신에게와 당신의 자손에게
  alternatives_korean:
  - 당신 위에와 당신의 후손 위에
  - 당신에게와 당신의 후손에게
  lexicon: HALOT
  rationale: בְּ는 여기서 저주가 ‘덮이고 미치는’ 의미로 기능하므로 한국어에서는 자연스럽게 ‘~에게’로 풀어 주되, 대상 표지를 유지했습니다.
- source_word: לְאוֹת וּלְמוֹפֵת
  english_pob_choice: as a sign and a wonder
  chosen_korean: 하나의 표징과 하나의 기이한 일로
  alternatives_korean:
  - 표징과 기이한 일로
  - 징조와 기적으로
  lexicon: HALOT
  rationale: אוֹת와 מוֹפֵת의 병렬을 살리기 위해 둘 다 명사로 대응했고, ‘기이한 일’은 מוֹפֵת의 놀라움/이적성을 너무 좁히지 않으면서 현대 한국어로 전달합니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: 언약적 지속을 나타내는 관용구로서 현대 합쇼체에서 가장 자연스러운 대응은 ‘영원히’입니다.
theological_decisions:
- issue: ‘they’의 지시 대상
  chosen_reading: 앞선 문맥의 언약 저주들로 이해하되, 본문에는 명시적 주어가 없으므로 ‘그것들’로만 처리했습니다.
  alternative_readings:
  - 저주 전체를 포괄하는 일반적 표현으로 볼 수 있음
  rationale: 원문의 복수 동사를 한국어에서 임의로 재명명하지 않고, 문맥적 지시를 드러내면서도 해석을 과잉 고정하지 않았습니다.
  doctrine_reference: 원문 우선, 문맥 참조는 유지하되 본문에 해석어를 과도하게 삽입하지 않음
- issue: עַד עוֹלָם의 범위
  chosen_reading: ‘영원히’로 옮기되, 철학적 무한성보다 언약적 지속을 함축하는 표현으로 처리했습니다.
  alternative_readings:
  - 계속해서
  - 모든 세대 동안
  rationale: 히브리어 관용구의 지속성을 살리면서도 본문이 스스로 말하는 범위를 넘는 교리적 확장을 피했습니다.
  doctrine_reference: 최적 대응, 과잉 신학화 자제
