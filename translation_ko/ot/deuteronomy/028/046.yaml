  source_fidelity: 히브리어의 복수 동사와 문맥상 선행하는 저주들을 받는 대명사, 두 대상(당신과 당신의 자손), ‘표징과 이적’, 그리고 지속을 나타내는 עַד עוֹלָם을 전반적으로 보존합니다. 다만 초안의 ‘당신에게와’는 한국어 문법상 부자연스럽고, ‘하나의 표징과 하나의 기이한 일로 있을 것입니다’는 히브리어의 병렬 표현을 지나치게 장황하고 어색하게 만듭니다.
  naturalness: ‘그것들은 당신과 당신의 자손에게 영원히 표징과 이적이 될 것입니다’는 현대 표준 한국어의 합쇼체에 맞고, 대명사의 문맥적 지시를 본문에서 과도하게 해설하지 않습니다. ‘표징과 이적’은 이 문맥에서 자연스럽고 정착된 병렬어입니다.
  terminology: אָתוֹ מוֹפֵת의 병렬은 ‘표징과 이적’으로 옮기는 것이 ‘표징과 기이한 일’보다 간결하고 자연스러우며, 두 낱말의 구별도 유지합니다. זֶרַע는 집합적 의미를 살려 ‘자손’으로 두고 ‘후손’을 각주 대안으로 제시합니다.
  issues:
