source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
  footnotes:
  - marker: a
    text: Or 'astonishing.' The Hebrew verb can mean to make something extraordinary or remarkable; here it describes the exceptional severity of the judgment.
    reason: lexical_alternative
  - marker: b
    text: '''Lasting'' renders a Hebrew term meaning firm, enduring, or persistent; the same word is used of both the plagues and the sicknesses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 야훼께서는 당신의 재앙과 당신 자손의 재앙을 유난히 심하게 하실 것입니다.[a] 곧 크고 오래 지속되는 재앙들과 심하고 오래 지속되는 질병들입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놀랍게’. 히브리어 동사는 어떤 것을 비범하거나 이례적으로 만들다는 뜻을 가질 수 있으며, 여기서는 심판의 예외적인 강도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오래 지속되는’은 히브리어 단어가 지닌 굳건함, 지속성, 끈질김의 뜻을 옮긴 것입니다. 같은 단어가 재앙과 질병 모두에 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  english_pob_choice: will make ... extraordinary
  chosen_korean: 기이하게 하실 것입니다
  alternatives_korean:
  - 놀랍게 하실 것입니다
  - 특별하게 하실 것입니다
  - 이상하게 하실 것입니다
  lexicon: HALOT
  rationale: פּלא의 사역형은 여기서 긍정적 ‘놀라움’이 아니라 재앙을 비범하고 이례적으로 만들다는 뜻이므로, ‘기이하게’가 강도를 살리면서도 의미를 흐리지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 프로젝트 기본 용례
  rationale: יהוה는 프로젝트 기본값에 따라 고유명사로 ‘야훼’로 옮겨, 주어의 개인적 이름을 보존했습니다.
- source_word: מַכֹּתְךָ / מַכּוֹת
  english_pob_choice: your plagues / plagues
  chosen_korean: 당신의 재앙 / 재앙들
  alternatives_korean:
  - 당신의 타격 / 타격들
  - 당신의 ضرب격?
  - 당신의 치심 / 치심들
  lexicon: HALOT
  rationale: מכה는 문자적으로는 ‘치기/타격’이지만 저주 문맥에서는 하나님이 내리시는 재앙의 뜻이 분명하므로 ‘재앙’이 문맥을 가장 잘 드러냅니다.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  english_pob_choice: lasting
  chosen_korean: 지속되는
  alternatives_korean:
  - 지속적인
  - 견고한
  - 영속하는
  lexicon: HALOT
  rationale: אמן의 의미는 ‘굳건한, 변치 않는, 지속하는’ 쪽이므로, 여기서는 재앙과 질병이 쉽게 사라지지 않는다는 점을 드러내는 ‘지속되는’이 가장 자연스럽습니다.
theological_decisions:
- issue: 재앙을 묘사하는 פלא의 뉘앙스
  chosen_reading: ‘기이하게’로 옮겨, 심판의 비범성과 불길함을 함께 드러냈습니다.
  alternative_readings:
  - ‘놀랍게’로 옮기면 긍정적 경탄이 섞일 수 있습니다.
  - ‘특별하게’는 심판의 날카로운 느낌이 약해질 수 있습니다.
  rationale: 본문은 복이 아니라 언약 저주의 맥락이므로, source의 강한 심판 효과를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: '번역 원칙: 원문 의미 우선, 문맥상 정서 오독 방지'
