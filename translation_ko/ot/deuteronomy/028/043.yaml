base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
  footnotes:
  - marker: a
    text: Or 'the sojourner' or 'the resident alien.' The Hebrew גֵּר refers to a non-native living among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 가운데 있는 나그네는 너보다 점점 더 높아지고, 너는 점점 더 낮아질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민’, ‘거주 외국인’입니다. 히브리어 גֵּר는 이스라엘 가운데 거주하는 비본토인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  english_pob_choice: the foreigner
  chosen_korean: 나그네
  alternatives_korean:
  - 외국인
  - 거류민
  - 타국인
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 가운데 거주하는 비본토인을 가리키므로, POB의 'foreigner'에 대응하는 현대 한국어로는 공동체 안의 이방 거주자를 자연스럽게 드러내는 '나그네'가 적절합니다.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  english_pob_choice: who is among you
  chosen_korean: 네 가운데 있는
  alternatives_korean:
  - 네 한가운데 있는
  - 너희 가운데 있는
  lexicon: HALOT
  rationale: 직역적 '네 한가운데'보다 한국어에서 자연스러운 위치 표현인 '네 가운데 있는'으로, 공동체 내부에 위치한 대상을 분명히 살렸습니다.
- source_word: יַעֲלֶה עָלֶיךָ / מַעְלָה מָּעְלָה
  english_pob_choice: will rise higher and higher above you
  chosen_korean: 너보다 점점 더 높아지고
  alternatives_korean:
  - 너 위로 점점 올라가고
  - 너보다 더 높아지고 또 높아지고
  lexicon: HALOT
  rationale: עלה + על의 비유적 상승과 반복 강조를 한국어의 '점점 더 높아지고'로 옮겨, 사회적 우위의 점증을 자연스럽게 표현했습니다.
- source_word: וְאַתָּה תֵרֵד מַטָּה מָּטָּה
  english_pob_choice: and you will go down lower and lower
  chosen_korean: 너는 점점 더 낮아질 것입니다
  alternatives_korean:
  - 너는 아래로 점점 더 내려갈 것입니다
  - 너는 낮아지고 또 낮아질 것입니다
  lexicon: HALOT
  rationale: ירד와 반복 부사를 한국어의 하강·저하 표현으로 옮기되, 본문의 대조를 살리면서도 현대어로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: אִי־נָרוֹת/사회적 역전의 범위
  chosen_reading: 이 절의 상승·하강 이미지를 경제나 정치 한 분야로만 좁히지 않고, 언약 저주의 총체적 신분 역전으로 읽히도록 유지했습니다.
  alternative_readings:
  - 경제적 번영과 쇠퇴만 가리킨다
  - 정치적 지배와 피지배만 가리킨다
  rationale: 히브리어의 상승·하강은 은유적으로 폭넓게 쓰이며, 신 28장의 저주 문맥에서는 삶의 전반적 역전이라는 의미를 더 온전히 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve what the source text states without narrowing its scope beyond the Hebrew imagery.'
