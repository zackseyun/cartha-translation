  lexicon: WLC; HALOT
  rationale: שָׁמַיִם의 우주적 ‘하늘’과 위치구문 ‘머리 위’를 자연스러운 한국어로 압축해, 하늘-땅의 대칭을 보존했습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋쇠
  alternatives_korean:
