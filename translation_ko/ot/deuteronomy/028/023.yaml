lexical_decisions:
- source_word: וְהָיוּ
  english_pob_choice: shall be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 입니다
  - 되겠습니다
  - 될 터입니다
  lexicon: WLC; HALOT
  rationale: 저주 선언의 미래적·선언적 뉘앙스를 살리기 위해 단순 현재형보다 전망형 ‘될 것입니다’를 택했습니다.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  english_pob_choice: the heavens above your head
  chosen_korean: 당신의 머리 위 하늘
  alternatives_korean:
