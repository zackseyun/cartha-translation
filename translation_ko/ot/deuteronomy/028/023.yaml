  - 청동
  lexicon: HALOT
  rationale: 원어는 구리/청동 범위를 가지지만, 한국어 성경 전통에서 금속의 단단함을 드러내는 대응으로 ‘놋쇠’가 가장 자연스럽습니다.
- source_word: בַּרְזֶל
  english_pob_choice: iron
  chosen_korean: 쇠
  alternatives_korean:
  - 철
  - 강철
  lexicon: HALOT
  rationale: בַּרְזֶל의 기본 의미를 살리되, 한국어에서는 시적·일상적 단어 ‘쇠’가 저주의 이미지와 짝을 이루는 ‘놋쇠’와 균형이 좋습니다.
