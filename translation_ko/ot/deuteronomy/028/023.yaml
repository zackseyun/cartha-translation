  lexicon: WLC; HALOT
  rationale: 저주 선언의 미래적·선언적 뉘앙스를 살리기 위해 단순 현재형보다 전망형 ‘될 것입니다’를 택했습니다.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
