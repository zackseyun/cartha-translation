translation:
  language: ko
  text: 아들들과 딸들을 낳게 되겠지만, 그들은 당신의 소유로 남지 못할 것이니, 그들이 포로로 끌려갈 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남녀 자녀를 각각 분명히 말합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘당신에게/당신을 위하여 있지 않다’입니다.
    reason: source_note
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어는 남녀 자녀를 각각 분명히 말하므로, 성별 구분을 살린 ‘아들들과 딸들’이 원문의 병렬성을 가장 잘 보존합니다.
- source_word: תּוֹלִיד
  english_pob_choice: you will father
  chosen_korean: 낳게 되겠지만
  alternatives_korean:
  - 아들을 낳을 것입니다
  - 아버지가 될 것입니다
  - 생기게 하겠지만
  lexicon: HALOT
  rationale: 형식상 남성 단수 2인칭을 가리키지만, 한국어에서는 ‘아버지가 되다’보다 결과를 직접 말하는 ‘낳다’가 자연스럽고, 출산/생식의 발생을 드러냅니다.
- source_word: וְלֹא יִהְיוּ לָךְ
  english_pob_choice: but they will not remain yours
  chosen_korean: 그들은 당신의 소유로 남지 못할 것이니
  alternatives_korean:
  - 그들은 당신의 것이 아니게 될 것이니
  - 그들은 당신에게 속하지 않을 것이니
  lexicon: HALOT
  rationale: 직역하면 ‘당신에게/당신을 위하여 있지 않다’이므로, 관계와 소유의 상실을 함께 드러내는 ‘소유로 남지 못하다’가 문맥상 가장 분명합니다.
- source_word: בַּשֶּׁבִי
  english_pob_choice: into captivity
  chosen_korean: 포로로 끌려갈
  alternatives_korean:
  - 포로로 잡혀갈
  - 포로가 되어 갈
  lexicon: HALOT
  rationale: שֶׁבִי는 포로 상태를 가리키므로 ‘포로로’가 핵심 의미를 살리고, 전후 문맥의 강제 이주를 반영해 ‘끌려가다’를 택했습니다.
theological_decisions:
- issue: 저주의 선언에서 자녀 상실과 포로됨의 결합을 어떻게 드러낼지
  chosen_reading: 자녀들은 소유 상실로 끝나지 않고 실제 포로 이동으로 이어지는 저주로 읽었습니다.
  alternative_readings:
  - 단순한 가족 해체의 은유로 완화
  - ‘포로’보다 넓은 ‘유배’로 일반화
  rationale: 본문은 ‘낳다’—‘소유로 남지 못하다’—‘포로’의 연쇄로 재앙의 구체성을 강화하므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 신명기 28장의 언약 저주
