  source_fidelity: 초안은 야훼의 직접적 행위, 세 재앙 명사, 손을 대는 모든 일이라는 관용구의 뜻을 대체로 잘 반영합니다. 그러나 ‘멸망하고 속히 사라질 때까지’는 두 히브리어 동사의 병렬을 다소 압축하고 ‘사라지다’는 אבד의 파멸 의미를 약화합니다. 또한 마지막 절은 ‘당신이 야훼를 저버린 그 악한 행위들’보다 본문의 1인칭 목적어(‘나를’)와 인과 관계를 직접 보존해야 합니다.
