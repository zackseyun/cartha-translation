base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in all the putting forth of your hand,'' that is, in everything you set your hand to do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신에게 저주와 혼란과 책망을 당신이 손으로 하는 모든 일에 보내실 것입니다. 당신이 멸망하고 속히 사라질 때까지, 곧 당신이 야훼를 저버린 그 악한 행위들 때문에 그렇게 하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 직역: ‘당신의 손을 내미는 모든 것에’, 곧 당신이 무엇을 하든지.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 하나님 이름 יְהוָה를 관례적 호칭으로 바꾸지 않고 고유한 신명으로 드러내기 위해 야훼로 옮겼습니다.
- source_word: הַמְּאֵרָה
  english_pob_choice: the curse
  chosen_korean: 저주
  alternatives_korean:
  - 그 저주
  - 저주의 저주
  lexicon: HALOT
  rationale: 언약적 재앙으로서의 단수 명사 의미를 자연스럽게 살리기 위해 저주로 옮겼습니다.
- source_word: הַמְּהוּמָה
  english_pob_choice: the confusion
  chosen_korean: 혼란
  alternatives_korean:
  - 소동
  - 공황
  - 어지러움
  lexicon: HALOT
  rationale: 여기서는 모든 일의 진행이 뒤엉키는 뜻이 핵심이므로 혼란이 가장 적절합니다.
- source_word: הַמִּגְעֶרֶת
  english_pob_choice: the rebuke
  chosen_korean: 책망
  alternatives_korean:
  - 꾸짖음
  - 질책
  - 면박
  lexicon: HALOT
  rationale: גער 계열의 강한 신적 꾸짖음을 한국어로 간결하게 살리기 위해 책망으로 옮겼습니다.
- source_word: בְּכָל מִשְׁלַח יָדְךָ
  english_pob_choice: in every undertaking of your hand
  chosen_korean: 당신이 손으로 하는 모든 일에
  alternatives_korean:
  - 당신이 손을 대는 모든 일에
  - 손으로 하는 모든 수행에
  - 손을 뻗는 모든 일에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, 한국어로는 가장 자연스러운 ‘손으로 하는 모든 일’로 풀어 의미와 이미지 둘 다 살렸습니다.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ
  english_pob_choice: until you are destroyed and until you perish
  chosen_korean: 당신이 멸망하고 속히 사라질 때까지
  alternatives_korean:
  - 당신이 멸절되고 멸망할 때까지
  - 당신이 파멸되고 사라질 때까지
  lexicon: HALOT
  rationale: 두 동사를 한국어의 병렬적 자연스러움 속에 살리기 위해 멸망하다/사라지다로 옮겼고, מַהֵר의 속히를 함께 반영했습니다.
theological_decisions:
- issue: 야훼의 직접적 행위 주어 유지
  chosen_reading: ‘야훼께서 … 보내실 것입니다’로 직접 주어를 드러냄
  alternative_readings:
  - ‘저주가 임할 것입니다’처럼 비인칭화
  - ‘주님이 허락하실 것입니다’처럼 완화
  rationale: 히브리어는 재앙의 주체를 분명히 야훼로 제시하므로, 심판의 주권과 언약적 책임을 흐리지 않도록 직접적 행위 주어를 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
