review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘(아들들, 살, 포위, 환난)는 대체로 보존했으나, 원문의 원인 관계와 마지막 장소·상황 구문이 한국어 문장에서 불분명하게 연결됩니다. 또한 ‘아무것도 남지 않은 상태로’는 מִבְּלִי הִשְׁאִיר לוֹ כֹּל의 ‘그에게 아무것도 남아 있지 않기 때문에’라는 이유를 충분히 드러내지 못합니다.
  naturalness: 초안의 ‘자기 아들들의 살 가운데서 먹고 있는 그 어느 것이라도’와 ‘포위와 환난 가운데서 그러할 것입니다’는 현대 표준 한국어로 어색하고 수식 관계가 불명확합니다. 문장을 나누어 원인과 발생 상황을 명료하게 제시하는 편이 자연스럽습니다.
  terminology: בָּנָיו의 남성형은 ‘아들들’로, בָּשָׂר의 구체성은 ‘살’로 유지하는 것이 적절합니다. בְּכָל שְׁעָרֶיךָ는 본문에서 문자적 표현인 ‘모든 성문에서’로 옮기고, 거주 성읍을 가리키는 환유적 용법은 해당 위치의 각주로 설명해야 합니다.
  issues:
  - severity: high
    issue: ‘아무것도 남지 않은 상태로’가 원인의 의미를 약화합니다.
    rationale: מִבְּלִי הִשְׁאִיר לוֹ כֹּל은 그가 나누어 주지 않는 이유, 곧 그 자신에게 아무것도 남지 않았음을 제시합니다. ‘그에게 아무것도 남아 있지 않기 때문입니다’로 밝혀야 합니다.
  - severity: high
    issue: 마지막 절 ‘포위와 환난 가운데서 그러할 것입니다’가 문법적으로 불완전하고 의미가 모호합니다.
    rationale: 원문은 원수가 모든 성문/성읍에서 가할 포위와 곤경이라는 상황을 수식합니다. ‘이 일은 … 가운데서 일어날 것입니다’처럼 사건과 상황을 명시적으로 연결해야 합니다.
  - severity: medium
    issue: ‘성문’ 관련 각주의 앵커가 ‘아무것도 남지 않은’에 붙어 있습니다.
    rationale: 각주의 내용은 בְּכָל שְׁעָרֶיךָ를 설명하므로 ‘성문’ 바로 뒤에 앵커를 두어야 합니다.
  - severity: medium
    issue: ‘살 가운데서 먹고 있는 그 어느 것’은 수식 구조가 부자연스럽습니다.
    rationale: 관계절 אֲשֶׁר יֹאכֵל은 ‘그가 먹고 있는 아들들의 살’을 수식합니다. ‘자신이 먹고 있는 자기 아들들의 살을’로 옮기면 의미와 한국어 어순이 모두 분명해집니다.
