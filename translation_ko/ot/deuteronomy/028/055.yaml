revisions:
- from: 그래서 그는 자기 아들들의 살 가운데서 먹고 있는 그 어느 것이라도 그들 가운데 누구에게도 주지 않을 것이며[a], 아무것도 남지 않은[b] 상태로, 원수들이 당신을 당신의 모든 성문 안에서 압박하는 포위와 환난 가운데서 그러할 것입니다.
  to: 그는 자신이 먹고 있는 자기 아들들의[a] 살을 그들 중 어느 누구에게도 주지 않을 것입니다. 그에게 아무것도 남아 있지 않기 때문입니다. 이 일은 원수가 당신의 모든 성문에서[b] 당신을 압박할 포위와 곤경 가운데서 일어날 것입니다.
  rationale: 원문의 비인도적 상황 묘사를 완화하지 않고 ‘아들들’과 ‘살’을 유지했습니다. 부정적 부정사 구문의 문맥상 기능을 한국어의 명시적 인과문으로 풀었고, 포위와 곤경이 원수가 가하는 상황임을 드러냈습니다. 문화 설명 각주는 설명 대상인 ‘성문’에 직접 연결했습니다.
