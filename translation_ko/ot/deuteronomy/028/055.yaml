base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
  footnotes:
  - marker: a
    text: Hebrew 'his sons'; the text is specifically masculine here, not the more general 'children.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in all your towns'; 'gates' is a Hebrew way of referring to the places where the people live.
    reason: cultural_note
translation:
  language: ko
  text: 그는 자신이 먹고 있는 자기 아들들의[a] 살을 그들 중 어느 누구에게도 주지 않을 것입니다. 그에게 아무것도 남아 있지 않기 때문입니다. 이 일은 원수가 당신의 모든 성문에서[b] 당신을 압박할 포위와 곤경 가운데서 일어날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 일반적인 ‘자녀’가 아니라 남성형 ‘아들들’을 구체적으로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 사람들의 거주지와 공동체를 가리키는 히브리식 표현입니다. 따라서 ‘성읍들’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת
  english_pob_choice: so that he will not give
  chosen_korean: 주지 않을 것이며
  alternatives_korean:
