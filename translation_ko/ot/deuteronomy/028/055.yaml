  rationale: 히브리어의 분배적 의미를 살려, 한 사람도 예외 없이 거부한다는 뉘앙스를 담았습니다.
- source_word: מִבְּשַׂר בָּנָיו
  english_pob_choice: any of the flesh of his sons
  chosen_korean: 자기 아들들의 살 가운데서 먹고 있는 그 어느 것이라도
  alternatives_korean:
  - 자기 아들들의 살
  - 자기 아들들의 고기 가운데서
  lexicon: HALOT
  rationale: בָּשָׂר의 구체적이고 충격적인 ‘살’을 유지했고, בָּנָיו는 ‘아들들’로 옮겨 성별 표지를 보존했습니다. ‘먹고 있는’은 현재 진행 중인 포위 상황의 생생함을 반영합니다.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  english_pob_choice: because he has nothing left
  chosen_korean: 아무것도 남지 않은 상태로
  alternatives_korean:
  - 그에게 남은 것이 없어서
  - 아무것도 남겨 두지 못한 채
  lexicon: HALOT
  rationale: 직역보다 원인 설명을 자연스럽게 드러내는 한국어로, 완전한 결핍 상태를 압축해 전달했습니다.
- source_word: בְּכָל שְׁעָרֶיךָ
  english_pob_choice: within all your gates
  chosen_korean: 당신의 모든 성문 안에서
  alternatives_korean:
  - 당신의 모든 성읍에서
  - 당신의 모든 성문들 안에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘성문’이지만, POB의 주석처럼 거주지를 가리키는 관용을 유지하되 한국어에서는 장소감이 살아 있는 ‘성문 안에서’로 옮겼습니다.
theological_decisions:
- issue: 포위와 환난의 병렬 표현
  chosen_reading: ‘포위와 환난’으로 두 명사를 모두 살려, 적의 압박이 군사적 포위와 그로 인한 고통을 함께 가리키도록 했습니다.
  alternative_readings:
  - ‘포위 중의 고통’으로 묶을 수 있음
  - ‘곤경’ 하나로 완화해 옮길 수 있음
  rationale: 히브리어 두 명사는 단순 반복이 아니라 상황의 강도와 폭을 함께 증폭하므로, 한국어에서도 둘 다 보존하는 편이 원문의 압박감을 더 정확히 드러냅니다.
  doctrine_reference: 신명기 저주 선포의 언약적 경고 문맥
