source:
  edition: WLC
  text: מִ/תֵּ֣ת לְ/אַחַ֣ד מֵ/הֶ֗ם מִ/בְּשַׂ֤ר בָּנָי/ו֙ אֲשֶׁ֣ר יֹאכֵ֔ל מִ/בְּלִ֥י הִשְׁאִֽיר ל֖/וֹ כֹּ֑ל בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בְּ/כָל שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
  footnotes:
  - marker: a
    text: Hebrew 'his sons'; the text is specifically masculine here, not the more general 'children.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in all your towns'; 'gates' is a Hebrew way of referring to the places where the people live.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 그는 자기 아들들의 살 가운데서 먹고 있는 그 어느 것이라도 그들 가운데 누구에게도 주지 않을 것이며[a], 아무것도 남지 않은[b] 상태로, 원수들이 당신을 당신의 모든 성문 안에서 압박하는 포위와 환난 가운데서 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 일반적인 ‘자녀’가 아니라 남성형 ‘아들들’을 구체적으로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 사람들의 거주지와 공동체를 가리키는 히브리식 표현입니다. 따라서 ‘성읍들’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת
  english_pob_choice: so that he will not give
  chosen_korean: 주지 않을 것이며
  alternatives_korean:
  - 주지 않게 되며
  - 주지 않을 것입니다
  lexicon: HALOT
  rationale: 미완료적 거절/유보의 흐름을 한국어로 자연스럽게 살리되, 앞 문맥의 결과를 이어 주는 문맥상 기능을 반영했습니다.
- source_word: לְאַחַד מֵהֶם
  english_pob_choice: to any of them
  chosen_korean: 그들 가운데 누구에게도
  alternatives_korean:
  - 그들 중 한 사람에게도
  - 그들 가운데 한 사람에게도
  lexicon: HALOT
  rationale: 히브리어의 분배적 의미를 살려, 한 사람도 예외 없이 거부한다는 뉘앙스를 담았습니다.
- source_word: מִבְּשַׂר בָּנָיו
  english_pob_choice: any of the flesh of his sons
  chosen_korean: 자기 아들들의 살 가운데서 먹고 있는 그 어느 것이라도
  alternatives_korean:
  - 자기 아들들의 살
  - 자기 아들들의 고기 가운데서
  lexicon: HALOT
  rationale: בָּשָׂר의 구체적이고 충격적인 ‘살’을 유지했고, בָּנָיו는 ‘아들들’로 옮겨 성별 표지를 보존했습니다. ‘먹고 있는’은 현재 진행 중인 포위 상황의 생생함을 반영합니다.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  english_pob_choice: because he has nothing left
  chosen_korean: 아무것도 남지 않은 상태로
  alternatives_korean:
  - 그에게 남은 것이 없어서
  - 아무것도 남겨 두지 못한 채
  lexicon: HALOT
  rationale: 직역보다 원인 설명을 자연스럽게 드러내는 한국어로, 완전한 결핍 상태를 압축해 전달했습니다.
- source_word: בְּכָל שְׁעָרֶיךָ
  english_pob_choice: within all your gates
  chosen_korean: 당신의 모든 성문 안에서
  alternatives_korean:
  - 당신의 모든 성읍에서
  - 당신의 모든 성문들 안에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘성문’이지만, POB의 주석처럼 거주지를 가리키는 관용을 유지하되 한국어에서는 장소감이 살아 있는 ‘성문 안에서’로 옮겼습니다.
theological_decisions:
- issue: 포위와 환난의 병렬 표현
  chosen_reading: ‘포위와 환난’으로 두 명사를 모두 살려, 적의 압박이 군사적 포위와 그로 인한 고통을 함께 가리키도록 했습니다.
  alternative_readings:
  - ‘포위 중의 고통’으로 묶을 수 있음
  - ‘곤경’ 하나로 완화해 옮길 수 있음
  rationale: 히브리어 두 명사는 단순 반복이 아니라 상황의 강도와 폭을 함께 증폭하므로, 한국어에서도 둘 다 보존하는 편이 원문의 압박감을 더 정확히 드러냅니다.
  doctrine_reference: 신명기 저주 선포의 언약적 경고 문맥
