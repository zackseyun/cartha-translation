source:
  edition: WLC
  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
  footnotes:
  - marker: a
    text: That is, the foreigner or sojourner mentioned in the previous verse.
    reason: cross_reference
  - marker: b
    text: Or 'make a loan to him.' The Hebrew verb in both clauses refers to lending, highlighting economic dependence and reversal of status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 당신에게 빌려 줄 것입니다[a]. 그러나 당신은 그에게 빌려 주지 못할 것입니다. 그는 머리가 될 것이고, 당신은 꼬리가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 바로 앞 절에서 언급한 외국인 또는 거류민입니다.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  english_pob_choice: lend to / lend to him
  chosen_korean: 빌려 줄 것입니다 / 빌려 주지 못할 것입니다
  alternatives_korean:
  - 돈을 빌려 줄 것입니다 / 빌리지 못할 것입니다
  - 대출해 줄 것입니다 / 대출해 주지 못할 것입니다
  lexicon: HALOT
  rationale: 히필형 לוה는 이 문맥에서 경제적 우위와 열위의 역전을 드러내는 ‘빌려 주다’의 뜻이 자연스럽습니다. 두 절의 대조를 살려 같은 동사를 반복해 번역했습니다.
- source_word: הוּא
  english_pob_choice: he
  chosen_korean: 그가
  alternatives_korean:
  - 그 사람은
  - 그자는
  lexicon: HALOT
  rationale: 직전 문맥의 단수 남성 지시를 살려 ‘그가’로 옮겼습니다. 한국어에서도 인칭 대명사를 유지해야 대조가 분명해집니다.
- source_word: לְרֹאשׁ / לְזָנָב
  english_pob_choice: the head / the tail
  chosen_korean: 머리가 될 것이고 / 꼬리가 될 것입니다
  alternatives_korean:
  - 우두머리가 될 것이고 / 꼬리가 될 것입니다
  - 머리로 / 꼬리로 될 것입니다
  lexicon: HALOT
  rationale: ‘머리/꼬리’의 은유를 그대로 보존해 지위와 종속의 역전을 드러냈습니다. ‘우두머리’는 의미를 풀어 주지만 은유의 직접성을 약화시킬 수 있습니다.
- source_word: יִהְיֶה / תִּהְיֶה
  english_pob_choice: will be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되겠습니다
  lexicon: HALOT
  rationale: 미래 상태를 나타내는 היה를 한국어의 자연스러운 미래 표현 ‘될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 성별이 표시된 단수 지시 유지
  chosen_reading: ‘그가 … 당신은’으로 단수 남성 지시를 유지했습니다.
  alternative_readings:
  - ‘그들은 … 당신들은’으로 일반화
  - ‘그 외국인은 … 당신은’으로 명시적 명사화
  rationale: 히브리어는 단수 남성형을 사용해 앞 절의 ‘이방인/거류민’을 대표적으로 가리킵니다. 본문의 인칭적 대조를 살리기 위해 복수화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
