base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
  footnotes:
  - marker: a
    text: Or 'in your barns' or 'in your granaries.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in all the sending out of your hand,' an idiom for all your work or undertakings.
    reason: lexical_alternative
  - marker: c
    text: Or 'gives you' or 'will give you.' The Hebrew participle can be rendered in more than one way here.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 당신의 곳간들과 손으로 하는 모든 일에 복을 내리도록 명하실 것이며, 야훼 당신의 하나님께서 당신에게 주시는 땅에서 당신을 복 주실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 창고들’, ‘당신의 곡간들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘당신의 손이 내미는 모든 것’이라는 뜻으로, 모든 일이나 모든 계획을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주십니다’로 옮길 수 있습니다. 여기의 히브리어 분사는 문맥에 따라 여러 방식으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약 이름인 יְהוָה는 프로젝트 기본값에 따라 고유 이름으로 옮겨 ‘야훼’를 사용했습니다. 제목인 ‘주’로 바꾸면 원문의 인칭성과 이름성이 약해집니다.
- source_word: אֶת הַבְּרָכָה
  english_pob_choice: the blessing
  chosen_korean: 복
  alternatives_korean:
  - 그 복
  - 복된 것
  - 축복
  lexicon: HALOT
  rationale: 문맥상 하나님이 내려주시는 구체적 복을 가리키므로 ‘복’으로 간결하게 옮겼습니다. 관사를 살린 ‘그 복’도 가능하지만 한국어에서는 다소 중복됩니다.
- source_word: בַּאֲסָמֶיךָ
  english_pob_choice: in your storehouses
  chosen_korean: 당신의 곳간들
  alternatives_korean:
  - 당신의 창고들
  - 당신의 곳집들
  - 당신의 곡간들
  lexicon: HALOT
  rationale: אֲסָם은 저장고, 곡간, 곳간의 뜻이 있어 ‘곳간들’이 농경적 맥락과 일반적 저장 공간을 함께 잘 살립니다. 영어 주석의 ‘storehouses’에 대응하면서도 자연스럽습니다.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  english_pob_choice: in all the work of your hand
  chosen_korean: 손으로 하는 모든 일
  alternatives_korean:
  - 손이 내미는 모든 일
  - 손으로 벌이는 모든 일
  - 모든 수고
  lexicon: HALOT
  rationale: 직역하면 ‘손의 내밈’이지만, 한국어에서는 그 관용구를 살리되 뜻을 드러내는 ‘손으로 하는 모든 일’이 가장 투명합니다. 너무 의역된 ‘모든 수고’는 손의 이미지가 약해집니다.
- source_word: נֹתֵן לָךְ
  english_pob_choice: is giving you
  chosen_korean: 주시는
  alternatives_korean:
  - 주고 계시는
  - 주실
  - 주시는 중인
  lexicon: HALOT
  rationale: 히브리어 분사는 진행/임박의 뉘앙스를 가지므로 현재분사적 표현인 ‘주시는’으로 옮겼습니다. 문맥상 지속적이며 현재 진행 중인 선물의 성격을 유지합니다.
theological_decisions:
- issue: 여호와 신명칭의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문의 고유 이름을 보존해 언약적 인칭성과 신명성을 드러내기 위해 ‘야훼’를 유지했습니다. 이는 프로젝트 기본 원칙과도 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
