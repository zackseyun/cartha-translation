translation:
  language: ko
  text: 당신이 알지 못한 한 백성이 당신 땅의 열매와 당신이 수고하여 얻은 모든 것을 먹을 것이며, 당신은 평생 억압받고 짓눌릴 뿐일 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  english_pob_choice: the fruit of your land
  chosen_korean: 당신의 땅의 열매
  alternatives_korean:
  - 당신의 땅의 소출
  - 당신의 땅의 산물
  lexicon: HALOT
  rationale: ‘열매’는 농경적 이미지를 살리면서도 원문의 구체성을 유지하며, ‘땅의’는 소유와 생산의 근원을 분명히 드러냅니다.
- source_word: וְכָל יְגִיעֲךָ
  english_pob_choice: all your labor
  chosen_korean: 당신의 수고의 모든 것
  alternatives_korean:
  - 당신의 모든 노동
  - 당신의 모든 수고
  lexicon: HALOT
  rationale: יְגִיעַ는 단순 행위보다 ‘수고/노고’와 그 결과를 함께 가리킬 수 있어, 먹히게 되는 소출의 뉘앙스를 살리기 위해 포괄적으로 옮겼습니다.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  english_pob_choice: A people whom you have not known
  chosen_korean: 당신이 알지 못한 한 백성
  alternatives_korean:
  - 당신이 알지 못하는 한 민족
  - 당신이 한 번도 알지 못한 백성
  lexicon: HALOT
  rationale: עַם은 집합 명사로서 ‘백성’이 자연스럽고, ‘알지 못한’은 ידע의 관계적·언약적 미지성을 간결하게 전달합니다.
- source_word: עָשׁוּק וְרָצוּץ
  english_pob_choice: oppressed and crushed
  chosen_korean: 억압받고 짓눌릴
  alternatives_korean:
  - 압제받고 부서질
  - 억눌리고 짓밟힐
  lexicon: HALOT
  rationale: 두 분사는 결과 상태를 강조하므로 수동형으로 맞추었고, ‘짓눌리다’는 רָצוּץ의 압도적 파괴감을 자연스럽게 반영합니다.
theological_decisions:
- issue: 재난의 강도를 얼마나 직접적으로 표현할지
  chosen_reading: ‘당신은 온종일 다만 억압받고 짓눌릴 것입니다’로, 반복·지속을 드러내면서도 원문의 절망적 예언을 완화하지 않았습니다.
  alternative_readings:
  - ‘당신은 늘 억압받고 짓눌릴 것입니다’
  - ‘당신은 평생 억압과 파괴 아래 있을 것입니다’
  rationale: כָּל הַיָּמִים는 단순 시간 부사보다 지속적 운명을 말하므로, ‘온종일’보다 ‘온종일 다만’으로는 부자연스러울 수 있으나 여기서는 예언의 지속성과 배타성을 함께 살리기 위해 ‘온종일 다만’의 강한 지속감을 택했습니다.
  doctrine_reference: 언약 저주 본문의 지속성 강조
