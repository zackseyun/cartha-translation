  source_fidelity: 핵심 의미는 대체로 충실하지만, כָּל הַיָּמִים를 ‘온종일’로 옮기면 ‘하루 내내’라는 뜻이 되어 ‘모든 날/평생 지속적으로’라는 히브리어 표현의 범위를 좁힙니다. 또한 ‘수고의 모든 것’은 먹는 대상이라는 문맥에서 다소 어색하므로, 수고의 산출물이라는 문맥상 함의를 한국어에 자연스럽게 드러내는 편이 좋습니다.
  naturalness: ‘당신의 수고의 모든 것을 먹을 것이며’와 ‘온종일 다만’은 현대 표준 한국어에서 다소 부자연스럽습니다. ‘당신이 수고하여 얻은 모든 것’ 및 ‘평생 … 뿐일 것입니다’가 합쇼체를 유지하면서 더 자연스럽습니다.
  terminology: ‘땅의 열매’, ‘한 백성’, ‘억압받고 짓눌리다’는 원문의 농경적 이미지, 집합명사, 압제와 파괴의 병치를 적절히 반영합니다. 본문에 교리적 해석을 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘온종일’이 כָּל הַיָּמִים의 지속 기간을 축소합니다.
