  - severity: low
    issue: ‘당신의 수고의 모든 것’은 ‘먹다’의 목적어로 어색합니다.
    rationale: יְגִיעֲךָ는 수고 자체와 그 수고의 결실을 포괄할 수 있으며, 여기서는 타인이 소비하는 농업 생산물의 문맥입니다. ‘수고하여 얻은 모든 것’이 의미를 과도하게 한정하지 않으면서 한국어 문맥을 자연스럽게 합니다.
  revised_text: 당신이 알지 못한 한 백성이 당신 땅의 열매와 당신이 수고하여 얻은 모든 것을 먹을 것이며, 당신은 평생 억압받고 짓눌릴 뿐일 것입니다.
