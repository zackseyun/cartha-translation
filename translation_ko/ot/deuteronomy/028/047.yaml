source:
  edition: WLC
  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
  footnotes:
  - marker: a
    text: Or 'with gladness of heart.' The Hebrew phrase literally speaks of 'goodness of heart,' and may overlap with the sense of inward gladness.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the abundance of everything' or 'when you had an abundance of everything.' The Hebrew phrase points to Israel's failure to serve the LORD despite abundant provision.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 곧, 당신이 모든 것을 풍족하게 누리면서도, 기쁨과 마음의 선함으로 당신의 하나님 야훼를 섬기지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음의 선함’은 히브리어 직역에 가깝고, 문맥상 ‘마음의 즐거움/기쁨’과 겹칠 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 것을 풍족하게 누리면서도’는 히브리어가 가리키는 풍요의 상태 속에서도라는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  english_pob_choice: because
  chosen_korean: ~때문입니다
  alternatives_korean:
  - ~해서입니다
  - ~이었기 때문입니다
  lexicon: HALOT
  rationale: 원문의 인과적 접속을 한국어 자연문장으로 옮기되, 본절의 심판 이유를 분명히 드러내도록 했습니다.
- source_word: עָבַדְתָּ אֶת יְהוָה אֱלֹהֶיךָ
  english_pob_choice: serve Yahweh your God
  chosen_korean: 당신의 하나님 야훼를 섬기지 않았습니다
  alternatives_korean:
  - 당신의 하나님 야훼를 예배하지 않았습니다
  - 당신의 하나님 야훼를 섬기지 못했습니다
  lexicon: HALOT
  rationale: עבד는 하나님을 객체로 취할 때 언약적 섬김을 뜻하므로, 예배로 좁히지 않고 '섬기다'를 유지했습니다.
- source_word: בְּשִׂמְחָה וּבְטוּב לֵבָב
  english_pob_choice: with joy and with gladness of heart
  chosen_korean: 기쁨과 마음의 선함으로
  alternatives_korean:
  - 기쁨과 마음의 즐거움으로
  - 기쁨과 마음의 좋음으로
  - 기쁨과 마음의 흡족함으로
  lexicon: HALOT
  rationale: שִׂמְחָה와 טוּב לֵבָב의 두 표현을 모두 살리면서, 직역의 어색함을 줄이고 '마음의 선함'으로 טוב의 어휘적 의미를 보존했습니다.
- source_word: מֵרֹב כֹּל
  english_pob_choice: because of the abundance of all things
  chosen_korean: 모든 것을 풍족하게 누리면서도
  alternatives_korean:
  - 모든 것의 풍족함 때문에
  - 모든 것이 풍족한 가운데
  - 모든 것이 풍족했는데도
  lexicon: HALOT
  rationale: 핵심은 풍족한 형편 속에서도 섬기지 않았다는 대비이므로, 원문의 풍요의 상황을 한국어에서 자연스러운 양보/대조 뉘앙스로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 인격적 언약 이름이므로, 번역 원칙에 따라 제목어 '주'로 대체하지 않고 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘섬기다’의 범위
  chosen_reading: 언약적 충성의 섬김
  alternative_readings:
  - 예배
  - 봉사
  rationale: 문맥은 축복을 받으면서도 하나님께 마땅한 언약적 헌신을 드리지 않은 것을 책망하므로, 예배에만 국한되지 않는 '섬기다'가 더 정확합니다.
  doctrine_reference: Translation philosophy §1, §5
