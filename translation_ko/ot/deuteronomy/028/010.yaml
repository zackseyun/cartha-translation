    rationale: כָּל עַמֵּי הָאָרֶץ는 ‘땅/세상의 모든 민족들(모든 peoples)’을 뜻합니다. 한국어의 ‘모든 백성’은 단수 집단처럼 들릴 수 있으므로 ‘땅 위의 모든 민족’이 범위와 복수성을 더 분명히 합니다.
  - severity: low
