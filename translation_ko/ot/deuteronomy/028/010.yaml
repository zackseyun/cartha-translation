id: DEU.28.10
reference: Deuteronomy 28:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
  footnotes:
  - marker: a
    text: Or, 'that you are called by the name of the LORD.' The Hebrew idiom literally says the LORD's name 'is called upon/over you,' expressing covenant identification and belonging.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 땅 위의 모든 민족이 야훼의 이름이 당신 위에 불려 있는 것을[a] 보고, 당신을 두려워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 이름이 당신 위에 불린다’는 뜻입니다. 이 히브리어 관용구는 당신이 야훼의 이름으로 불린다는 뜻으로도 옮길 수 있으며, 언약적 소속과 동일시를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמֵּי הָאָרֶץ
  english_pob_choice: all the peoples of the earth
  chosen_korean: 땅의 모든 백성
  alternatives_korean:
  - 땅의 모든 민족들
  - 세상의 모든 백성들
  lexicon: HALOT
  rationale: עַמֵּי는 복수의 집단을 가리키지만, 한국어에서는 과도한 직역보다 문맥상 국제적 범위를 살려 ‘땅의 모든 백성’으로 옮기는 것이 자연스럽습니다.
- source_word: שֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 야훼의 이름
  alternatives_korean:
  - 여호와의 이름
  - 주님의 이름
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮기며, ‘이름’은 히브리어 구성형을 그대로 살려 covenantal identity를 드러냅니다.
- source_word: נִקְרָא עָלֶיךָ
  english_pob_choice: is called upon you
  chosen_korean: 당신 위에 불려 있음을
  alternatives_korean:
  - 당신에게 불려 있음을
  - 당신의 이름으로 불림을
  lexicon: HALOT
  rationale: עַל의 ‘위에/위로’라는 이미지를 보존하여, 단순히 ‘~의 이름으로 불리다’로 완전히 평탄화하지 않고 언약적 소속의 함의를 드러냈습니다.
- source_word: וְיָרְאוּ מִמֶּךָּ
  english_pob_choice: and they will fear you
  chosen_korean: 당신을 두려워할 것입니다
  alternatives_korean:
  - 당신 앞에서 두려워할 것입니다
  - 당신을 경외할 것입니다
  lexicon: HALOT
  rationale: יָרֵא의 기본 의미인 두려움을 살리되, 한국어 문맥에서 자연스러운 목적어 구조로 옮겼습니다. ‘경외하다’는 의미를 지나치게 예배적 방향으로 좁힐 수 있습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 언약명 יהוה를 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 신적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה/YHWH → 야훼'
- issue: נִקְרָא עָלֶיךָ의 언약적 소속 의미
  chosen_reading: 당신 위에 불려 있음을
  alternative_readings:
  - 당신이 야훼의 이름으로 불림
  - 당신이 야훼께 속한 사람으로 불림
  rationale: 이 관용구는 단순한 호칭이 아니라 언약적 표지와 소속을 뜻하므로, 한국어에서도 그 이미지가 드러나도록 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
