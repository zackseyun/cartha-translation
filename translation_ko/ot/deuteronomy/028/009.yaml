  terminology: מִצְוֺת에는 한국어 성경 및 법적·언약적 문맥에서 정착된 ‘계명’을 사용하는 편이 적절합니다. ‘야훼, 당신의 하나님’은 동격 관계를 분명히 하며, ‘자신의 거룩한 백성’은 לּוֹ와 לְעַם קָדוֹשׁ을 자연스럽게 반영합니다.
