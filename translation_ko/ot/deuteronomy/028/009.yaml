source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
  footnotes:
  - marker: a
    text: Or 'because you keep the commandments of the LORD your God.' The Hebrew conjunction can sometimes be read causally, though the context here favors 'if.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 당신을 자신을 위하여 거룩한 백성으로 세우실 것입니다[a]. 그것은 그분께서 당신에게 맹세하신 바와 같습니다. 곧 당신이 야훼 당신의 하나님의 명령들을 지키고 그분의 길을 따라 걸으면 그렇게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 야훼 당신의 하나님의 명령들을 지키기 때문에’로도 읽을 수 있습니다. 히브리어 접속사는 때로 이유를 나타내지만, 이 문맥에서는 ‘~하면’이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  english_pob_choice: will establish you
  chosen_korean: 세우실 것입니다
  alternatives_korean:
  - 확립하실 것입니다
  - 일으키실 것입니다
  - 세워 두실 것입니다
  lexicon: HALOT
  rationale: 히필 동사 קום은 여기서 신분과 지위를 ‘세우다/확립하다’는 의미가 자연스러우므로, 축복 맥락에 맞게 ‘세우실 것입니다’로 옮겼습니다.
- source_word: לְעַם קָדוֹשׁ
  english_pob_choice: as a holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 거룩한 ժողովուրդ
  - 거룩한 민족
  - 거룩한 사람들
  lexicon: HALOT
  rationale: 집단적 언약 정체성을 살리기 위해 ‘백성’을 택했고, קָדוֹשׁ은 도덕적·언약적 구별을 담아 ‘거룩한’으로 옮겼습니다.
- source_word: מִצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  - 율례들
  lexicon: HALOT
  rationale: מִצְוֹת는 법적·언약적 요구를 가리키지만, 한국어에서는 다소 교회적 관습어인 ‘계명’보다 원문의 명령성에 가까운 ‘명령들’이 더 직접적입니다.
- source_word: בִּדְרָכָיו
  english_pob_choice: his ways
  chosen_korean: 그분의 길
  alternatives_korean:
  - 그분의 길들
  - 그분의 방식
  - 그분의 행로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘길을 걷다’는 삶의 방식과 행위를 뜻하므로, 비유를 유지한 채 ‘그분의 길’로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문헌학적 표기 원칙에 따라 신성 4문자יהוה는 전통적 대치어 대신 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: כִּי의 조건·이유 양가성
  chosen_reading: 문맥상 축복의 조건을 나타내는 ‘~하면’의 뜻을 살리되, 본문이 가진 이유적 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘왜냐하면/…이므로’로 읽는 해석
  - 조건문 없이 결과만 진술하는 해석
  rationale: 신명기 축복-저주 구조에서는 실제 순종 조건을 드러내는 것이 중요하지만, 히브리어 접속사가 가질 수 있는 이유적 뉘앙스도 완전히 지우지 않기 위해 본문과 각주를 분리했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
