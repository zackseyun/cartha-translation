revisions:
- from: 야훼께서 당신을 자신을 위하여 거룩한 백성으로 세우실 것입니다[a]. 그것은 그분께서 당신에게 맹세하신 바와 같습니다. 곧 당신이 야훼 당신의 하나님의 명령들을 지키고 그분의 길을 따라 걸으면 그렇게 하실 것입니다.
  to: 야훼께서는 당신을 자신의 거룩한 백성으로 세우실 것입니다. 이는 그분께서 당신에게 맹세하신 대로입니다. 당신이 야훼, 당신의 하나님의 계명을 지키고 그분의 길을 걸으시면[a] 그렇게 하실 것입니다.
  rationale: 조건절을 그 결과인 ‘그렇게 하실 것입니다’에 직접 연결하고, 맹세 절은 원문의 순서대로 별도 문장으로 유지했습니다. ‘자신의 거룩한 백성’과 ‘계명’을 사용하여 언약적 귀속 및 법적·종교적 용어를 자연스러운 현대 합쇼체로 반영했습니다. 각주 표지는 כִּי의 해석이 걸리는 조건절 끝으로 옮겼습니다.
