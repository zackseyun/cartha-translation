source:
  edition: WLC
  text: גּ֖וֹי עַ֣ז פָּנִ֑ים אֲשֶׁ֨ר לֹא יִשָּׂ֤א פָנִים֙ לְ/זָקֵ֔ן וְ/נַ֖עַר לֹ֥א יָחֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/050.yaml
  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
  footnotes:
  - marker: a
    text: Literally, 'a nation fierce of face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'does not respect the old.' The Hebrew idiom is literally 'does not lift up the face of the old.'
    reason: lexical_alternative
  - marker: c
    text: Or 'has no mercy on the young.'
    reason: lexical_alternative
translation:
  language: ko
  text: 얼굴이 험한 나라, 곧 늙은이에게는 존중을 보이지 않고 젊은이에게는 은혜를 베풀지 않는 나라입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹי
  english_pob_choice: nation
  chosen_korean: 나라
  alternatives_korean:
  - 민족
  - 국가
  - 나라들
  lexicon: HALOT
  rationale: 저주 선언의 문맥에서 외세의 침입 집단을 가리키므로, 현대 한국어에서 자연스럽고 집단성을 살리는 ‘나라’로 옮겼습니다.
- source_word: עַז פָּנִים
  english_pob_choice: fierce-faced
  chosen_korean: 얼굴이 험한
  alternatives_korean:
  - 얼굴이 사나운
  - 낯이 험한
  - 표정이 거친
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴이 강한/사나운’이지만, 한국어에서는 사람의 태도와 인상을 드러내는 ‘얼굴이 험한’이 원문의 얼굴/인상 이미지를 가장 자연스럽게 보존합니다.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  english_pob_choice: shows no regard for the old
  chosen_korean: 늙은이에게는 존중을 보이지 않고
  alternatives_korean:
  - 늙은이의 얼굴을 들어 주지 않고
  - 노인에게는 예우를 하지 않고
  - 연장자를 존중하지 않고
  lexicon: HALOT
  rationale: ‘얼굴을 들다’라는 히브리어 관용구를 한국어에서는 곧바로 이해되는 ‘존중을 보이다’로 풀어, 노인에 대한 무례함을 분명하게 전달했습니다.
- source_word: לֹא יָחֹן
  english_pob_choice: shows no favor
  chosen_korean: 젊은이에게는 은혜를 베풀지 않는
  alternatives_korean:
  - 젊은이에게는 호의를 베풀지 않는
  - 젊은이에게는 자비를 베풀지 않는
  - 젊은이에게는 긍휼을 베풀지 않는
  lexicon: HALOT
  rationale: חנן의 기본 뜻인 ‘은혜/호의/호감/자비를 베풀다’를 살리되, 앞의 ‘존중’과 평행을 이루도록 ‘은혜를 베풀지 않는’으로 옮겼습니다.
theological_decisions:
- issue: 노인과 젊은이에 대한 병렬적 무정함의 표현
  chosen_reading: 연령에 따른 예의와 호의가 모두 끊긴 폭력적 성격을 드러내는 문장으로 읽었습니다.
  alternative_readings:
  - 단순한 무례함의 묘사
  - 일반적인 잔혹성의 표현
  rationale: 원문은 ‘노인에게는 존중을 보이지 않고 젊은이에게는 은혜를 베풀지 않는다’는 대구를 통해 침입 민족의 무자비함을 강조하므로, 두 연령층 모두를 향한 냉혹함을 함께 드러냈습니다.
  doctrine_reference: 신명기 28장의 언약 저주 문맥
