  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
  footnotes:
  - marker: a
    text: Or 'Your life will hang before you'; the Hebrew image is of life suspended precariously, expressing continual uncertainty about survival.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not be sure of your life' or 'you will not trust your life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 생명은 당신 앞에서 불안정하게 매달려 있을 것이며[a], 밤낮으로 두려워할 것이고[b], 당신의 생명에 대해서는 아무 확신도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 생명은 당신 앞에 매달려 있을 것입니다’. 히브리어 이미지는 생명이 위태롭게 매달린 상태를 가리키며, 계속되는 생존 불안을 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 생명에 대해 확신하지 못할 것입니다’ 혹은 ‘당신의 생명을 믿지 못할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  english_pob_choice: your life
  chosen_korean: 당신의 생명
  alternatives_korean:
  - 당신의 삶
  - 당신의 목숨
  lexicon: HALOT
  rationale: 히브리어 복수형 관용구를 한국어에서는 단수 개념으로 자연스럽게 옮기되, 생존의 위태로움을 살리기 위해 ‘생명’을 선택했습니다.
- source_word: תְּלֻאִים לְךָ מִנֶּגֶד
  english_pob_choice: hang in doubt / before you
  chosen_korean: 당신 앞에서 불안정하게 매달려 있을 것이며
  alternatives_korean:
  - 당신 앞에 매달려 있을 것이며
  - 당신 앞에서 매달려 있을 것이며
  - 불확실하게 드리워질 것이며
  lexicon: HALOT
  rationale: ‘매달리다’의 이미지를 유지하면서, 문맥상 생존의 불안과 위태로움을 드러내도록 ‘불안정하게’로 의미를 보강했습니다.
- source_word: וּפָחַדְתָּ לַיְלָה וְיוֹמָם
  english_pob_choice: you will fear night and day
  chosen_korean: 밤낮으로 두려워할 것이고
  alternatives_korean:
  - 밤과 낮에 두려워할 것이고
  - 밤낮으로 공포에 떨 것이고
  - 밤낮으로 두려워하며
  lexicon: HALOT
  rationale: 히브리어의 ‘밤과 낮’은 지속성을 나타내므로 한국어 관용에 맞게 ‘밤낮으로’로 옮겼습니다.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  english_pob_choice: you will have no assurance of your life
  chosen_korean: 당신의 생명에 대해서는 아무 확신도 없을 것입니다
  alternatives_korean:
  - 당신의 생명에 대해 믿지 못할 것입니다
  - 당신의 생명에 대해 확신하지 못할 것입니다
  - 당신의 생명은 믿을 수 없을 것입니다
  lexicon: HALOT
  rationale: אמן의 ‘믿다/확신하다’ 의미를 따라, 생명의 지속에 대한 신뢰 부재를 현대 한국어로 ‘아무 확신도 없을 것입니다’로 표현했습니다.
theological_decisions:
- issue: 문장의 재난적 상과 지속적 공포의 보존
  chosen_reading: 생명이 ‘불안정하게 매달려’ 있고, 사람이 ‘밤낮으로 두려워’하며, ‘아무 확신도 없다’는 식으로 위태로운 생존 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 ‘불안하게 놓여 있을 것입니다’로 순화
  - ‘두려워할 것입니다’를 더 약하게 조정
  rationale: 본문은 단순한 불안이 아니라 지속적 위협 아래의 생존 불안을 묘사하므로, 이미지와 정서를 약화시키지 않았습니다.
  doctrine_reference: 신명기 28장의 언약 저주 문맥
