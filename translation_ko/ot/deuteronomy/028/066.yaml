    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 생명은 당신 눈앞에 위태롭게 매달려 있을 것이며[a], 밤낮으로 두려워하고, 당신의 생명에 대해서는 아무 확신도 없을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 생명은 당신 앞에 매달려 있을 것입니다’. 히브리어 이미지는 생명이 위태롭게 매달린 상태를 가리키며, 계속되는 생존 불안을 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 생명에 대해 확신하지 못할 것입니다’ 혹은 ‘당신의 생명을 믿지 못할 것입니다’.
    reason: lexical_alternative
