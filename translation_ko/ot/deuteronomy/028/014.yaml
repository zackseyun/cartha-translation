  lexicon: HALOT
  rationale: 복수 명사 ‘말씀들/말들’의 범위를 한국어로 자연스럽게 풀어, 하나도 빠짐없이 순종해야 한다는 금지의 총괄적 의미를 살렸습니다.
- source_word: יָמִין וּשְׂמֹאול
  english_pob_choice: to the right or to the left
  chosen_korean: 오른쪽으로도, 왼쪽으로도
  alternatives_korean:
  - 오른편으로도, 왼편으로도
  - 오른쪽이나 왼쪽으로도
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하여, 어느 방향으로도 치우치지 말라는 이미지가 드러나도록 했습니다.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  english_pob_choice: to go after other gods
  chosen_korean: 다른 신들을 따라가
  alternatives_korean:
  - 다른 신들을 뒤따라가
  - 다른 신들을 쫓아가
  lexicon: HALOT
  rationale: ‘가다/따라가다’의 히브리어 관용을 보존해, 단순한 신앙적 관심이 아니라 추종과 충성을 뜻하는 배교의 방향성을 살렸습니다.
- source_word: לְעָבְדָם
  english_pob_choice: to serve them
  chosen_korean: 그들을 섬기지 마십시오
  alternatives_korean:
  - 그들을 섬기지 말라
  - 그들을 경배하지 마십시오
  lexicon: HALOT
  rationale: עבד는 신적 대상에게 ‘섬기다’와 ‘예배하다’의 폭을 가지지만, 여기서는 직접적인 어휘 대응인 ‘섬기다’를 택해 본문의 더 넓은 충성/봉사 의미를 유지했습니다.
theological_decisions:
- issue: 다른 신들에 대한 표현의 범위
  chosen_reading: ‘다른 신들’을 그대로 유지하여 본문이 제시하는 언약적 경고를 보존했습니다.
  alternative_readings:
  - ‘이방 신들’
  - ‘외국 신들’
  rationale: 본문은 다른 신들로 ‘따라가고 섬기는’ 행위를 경고할 뿐, 그 신들의 존재론을 더 설명하지 않습니다. 따라서 전통적 완화 표현보다 원문의 경고 구조를 직접 드러내는 번역을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
