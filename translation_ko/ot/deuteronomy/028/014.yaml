  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
  footnotes:
  - marker: a
    text: Or 'to follow other gods.' The Hebrew idiom is literally 'to go after.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to worship them.' The verb can denote service rendered to a deity and thus carries worshipful force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 오늘 여러분에게 명령하는 모든 말씀에서 한 치도 벗어나지 말아야 합니다. 오른쪽으로도, 왼쪽으로도 치우치지 말고, 다른 신들을 따라가 그들을 섬기지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 신들을 따르다’로 옮길 수 있습니다. 히브리어 관용구는 문자적으로 ‘뒤따라가다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 경배하다’로 옮길 수 있습니다. 이 동사는 신에게 드려지는 봉사와 예배를 함께 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  english_pob_choice: turn aside
  chosen_korean: 벗어나지 말아야 합니다
  alternatives_korean:
