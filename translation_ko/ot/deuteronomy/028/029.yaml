  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
  footnotes:
  - marker: a
    text: Or 'feel about'; the Hebrew verb refers to searching by touch because one cannot see.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not succeed in your ways.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with no one to rescue you' or 'with no deliverer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 한낮에도 눈먼 사람이 어둠 속에서 더듬듯이 더듬을 것입니다.[a] 당신의 길에서 형통하지 못할 것이며,[b] 날마다 억압당하고 빼앗길 뿐이고, 당신을 구해 줄 사람은 없을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손으로 더듬어 찾다’라는 뜻입니다. 히브리어 동사는 보이지 않아 손으로 찾아 더듬는 동작을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 길에서 성공하지 못할 것이며’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신을 구출해 줄 사람이 없을 것입니다’ 혹은 ‘구원자가 없을 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  english_pob_choice: grope / gropes
  chosen_korean: 더듬다
  alternatives_korean:
  - 손으로 찾아보다
  - 헤매다
  lexicon: HALOT
  rationale: 시각을 잃은 채 손으로 더듬어 찾는 동작을 자연스럽게 살리면서, 비유의 무력함과 혼란을 함께 전달합니다.
- source_word: בַּצָּהֳרַיִם
  english_pob_choice: at noon
  chosen_korean: 정오에도
  alternatives_korean:
  - 한낮에도
  - 대낮에도
  lexicon: HALOT
  rationale: 가장 밝은 때라는 역설을 선명하게 드러내는 현대적 표현으로 옮겼습니다.
- source_word: תַצְלִיחַ
  english_pob_choice: you will not prosper
  chosen_korean: 형통하지 못할 것이고
  alternatives_korean:
  - 성공하지 못할 것이고
  - 잘되지 못할 것이고
  lexicon: HALOT
  rationale: 언약 저주의 문맥에서 단순한 성공 여부보다 삶의 길 전체가 풀리지 않는다는 뜻을 살려 ‘형통’으로 옮겼습니다.
- source_word: עָשׁוּק וְגָזוּל
  english_pob_choice: oppressed and robbed
  chosen_korean: 억압을 당하고 약탈을 당하며
  alternatives_korean:
  - 압제를 당하고 빼앗기며
  - 학대를 당하고 빼앗기며
  lexicon: HALOT
  rationale: 두 분사는 각각 가해를 당하는 상태와 재산/소유의 강탈을 나란히 보여 주므로, 평행성을 살려 두 번의 수동 표현으로 옮겼습니다.
theological_decisions:
- issue: מוֹשִׁיעַ의 번역을 비메시아적 언약 저주 문맥에서 어떻게 처리할지
  chosen_reading: 구해 줄 사람
  alternative_readings:
  - 구원자
  - 구출해 줄 사람
  rationale: 이 구절은 고유한 메시아 호칭이 아니라 도움을 줄 수 있는 어떤 사람도 없다는 뜻이므로, 구원론적 용어를 덧씌우지 않고 일반적 구출 의미를 유지했습니다.
  doctrine_reference: 문맥이 허용하는 범위에서만 신학적 함의를 유지하고, 본문이 말하지 않는 호칭화는 피합니다.
