revisions:
- from: 당신은 정오에도 눈먼 사람이 어둠 속에서 더듬는 것처럼 더듬을 것이며, 당신의 길에서 형통하지 못할 것이고, 당신은 온종일 다만 억압을 당하고 약탈을 당하며 구해 줄 사람이 없을 것입니다.[a][b][c]
  to: 당신은 한낮에도 눈먼 사람이 어둠 속에서 더듬듯이 더듬을 것입니다.[a] 당신의 길에서 형통하지 못할 것이며,[b] 날마다 억압당하고 빼앗길 뿐이고, 당신을 구해 줄 사람은 없을 것입니다.[c]
  rationale: ‘온종일’을 ‘날마다’로 고쳐 원문의 지속적 시간 범위를 보존했습니다. ‘약탈을 당하며’를 ‘빼앗길’로 다듬어 גָזוּל의 강탈당한 상태를 자연스럽게 반영했고, 원문의 병렬 및 제한 강조(אַךְ)를 ‘…뿐이고’로 살렸습니다. 각주 표지는 해당 번역 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:26Z'
