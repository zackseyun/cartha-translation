  source_fidelity: ‘마음이 악하게 될 것입니다’는 히브리어 ‘그의 눈이 악해질 것이다’라는 관용구의 대상 지향성과 구체적 의미(적대적·박한 태도)를 충분히 보존하지 못합니다. 또한 ‘매우 사치스러운’은 הֶעָנֹג의 ‘섬세하고 호사스러움/유복함’보다 도덕적 비난의 뉘앙스가 강합니다. ‘그가 남겨 둔 나머지 자녀들’은 יֶתֶר בָּנָיו אֲשֶׁר יוֹתִיר의 반복적 구조를 유지합니다.
