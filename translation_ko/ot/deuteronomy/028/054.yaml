base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''his eye will be evil toward,'' expressing hostility, stinginess, or begrudging refusal to share.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whom he has remaining.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희 가운데 유약하고 매우 호사스러운 남자는 자기 형제와 자기 품의 아내와 그가 남겨 둔 나머지 자녀들을 적대적으로 대할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘그의 눈이 악해질 것이다’라는 관용구입니다. 여기서는 적대감, 인색함, 또는 나누어 주기를 아까워하며 거부하는 태도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게 남아 있는 나머지 자녀들’.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: The man
  chosen_korean: 남자
  alternatives_korean:
  - 사람
  - 남성
  lexicon: HALOT
  rationale: 히브리어 האיש는 여기서 남성 개인을 가리키며, 뒤이어 나오는 아내와 자녀의 대비와도 맞습니다. 한국어에서는 문맥상 자연스러운 ‘남자’로 옮겼습니다.
- source_word: הָרַךְ ... וְהֶעָנֹג מְאֹד
  english_pob_choice: tender ... and very delicate
  chosen_korean: 연약하고 매우 사치스러운
  alternatives_korean:
  - 부드럽고 매우 연약한
  - 매우 섬세한
  lexicon: HALOT
  rationale: 두 형용사는 보호받고 호사스러운 생활에 익숙한 상태를 함께 나타냅니다. ‘연약하고 매우 사치스러운’은 그 의미 범위를 살리면서도 한국어로 과도하게 낯설지 않게 합니다.
- source_word: תֵּרַע עֵינוֹ
  english_pob_choice: his eye will be hostile toward
  chosen_korean: 마음이 악하게 될 것입니다
  alternatives_korean:
  - 눈이 악하게 될 것입니다
  - 형제를 박하게 대할 것입니다
  - 적대적으로 바라볼 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 눈이 악하다’는 관용구이지만, 실제 의미는 시기·인색·적대의 태도입니다. 한국어에서는 이 관용을 자연스럽게 풀어 ‘마음이 악하게 되다’로 옮기되, 공격적 태도의 강도를 유지했습니다.
- source_word: בְאָחִיו
  english_pob_choice: toward his brother
  chosen_korean: 자기 형제에게
  alternatives_korean:
  - 자기 친족에게
  - 자기 동생에게
  lexicon: HALOT
  rationale: 기본 뜻은 ‘형제’이므로 이를 유지했습니다. 문맥상 가까운 친족까지 확장될 수 있지만, 본문은 우선 literal한 표현이 더 적절합니다.
- source_word: אֵשֶׁת חֵיקוֹ
  english_pob_choice: the wife of his bosom
  chosen_korean: 자기 품의 아내
  alternatives_korean:
  - 품의 아내
  - 가슴에 품은 아내
  lexicon: HALOT
  rationale: 히브리어의 친밀한 비유를 살리면서도, 한국어에서 ‘bosom’을 문자 그대로 옮긴 표현보다 ‘품의 아내’가 더 자연스럽고 의미도 분명합니다.
theological_decisions:
- issue: 전쟁 포위 상황에서의 인간 관계 붕괴를 어떻게 드러낼지
  chosen_reading: 원문의 저주적 예언 구조를 유지하여, 생존 압박 아래 가족 내부에까지 번지는 적대와 인색을 직접적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 사회적 갈등으로 풀어 쓰기
  - 단순히 마음이 불편해진다고 순화하기
  rationale: 본문은 포위로 인한 극단적 결핍이 가족 사랑을 무너뜨리는 장면을 의도합니다. 이를 약화시키지 않고 경고의 강도를 보존했습니다.
  doctrine_reference: 신명기 28장의 언약 저주 본문
