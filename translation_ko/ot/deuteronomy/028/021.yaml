    issue: ‘~까지’(עַד)가 본문에서 누락되었습니다.
    rationale: 초안은 전염병을 달라붙게 하는 일과 땅에서 없애는 일을 ‘-셔서’로 연결할 뿐, 전염병의 지속이 멸망 때까지 계속된다는 원문의 시간적 범위를 표현하지 못합니다.
  - severity: medium
    issue: הַדָּבֶר를 ‘그 재앙’으로 번역했습니다.
    rationale: ‘재앙’은 너무 넓은 말이며, 언약 저주 문맥의 דֶּבֶר는 특히 전염성 치명 질병, 곧 전염병/역병을 가리킵니다.
  - severity: medium
    issue: 각주 b가 영어 POB 감사 기록과 원문의 실제 해석 쟁점을 반영하지 못합니다.
