  source_fidelity: 히브리어의 사역형 יַדְבֵּק(‘달라붙게 하다’)와 ‘그 땅을 차지하려고 들어가다’를 대체로 반영했으나, 초안은 עַד כַּלֹּתוֹ אֹתְךָ(‘당신을 끝장낼 때까지’)의 ‘~까지’를 빠뜨려 두 행위를 단순 연결했습니다. 또한 הַדָּבֶר는 이 저주 문맥에서 일반적 ‘재앙’보다 ‘전염병/역병’이 더 정확합니다.
  naturalness: ‘당신에게 달라붙게 하셔서 … 없애 버리실 것입니다’는 현대 합쇼체로 읽히지만, 시간적 한계가 불명확합니다. ‘…없애실 때까지 …달라붙게 하실 것입니다’로 재배열하면 자연스럽고 원문의 관계를 보존합니다. ‘없애 버리다’는 다소 구어적이므로 문어적 성경 번역에는 ‘없애시다’가 더 적합합니다.
  terminology: ‘야훼’는 제시된 POB 방침과 일치합니다. הַדָּבֶר는 본문에서 ‘그 전염병’으로 옮기고, ‘역병’을 각주 대안으로 제시하는 것이 적절합니다. 원문의 해석상 쟁점은 כַּלֹּתוֹ의 주어가 야훼인지 전염병인지이므로, 기존 각주 b의 전치사 설명 대신 이 쟁점을 밝혀야 합니다.
