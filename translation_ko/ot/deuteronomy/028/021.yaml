  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
  footnotes:
  - marker: a
    text: Or 'the pestilence.' The Hebrew term can denote a deadly epidemic disease sent as judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'until it has consumed you,' taking 'the plague' as the implied subject of the clause.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그 재앙을 당신에게 달라붙게 하셔서, 당신이 들어가 차지하려는 그 땅에서 당신을 없애 버리실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 문맥상 치명적 전염병/역병을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅에서’는 직역하면 ‘그 땅 위에서/에서부터’에 해당하는 표현으로, 토지 상속 문맥에 맞춘 자연스러운 한국어입니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약명 이름 יהוה를 제목어가 아니라 고유한 신적 이름으로 드러내기 위해 표준 학술 음역인 ‘야훼’를 사용했습니다.
- source_word: הַדָּבֶר
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 전염병
  - 그 역병
  - 그 재난
  lexicon: HALOT
  rationale: 이 문맥의 הַדָּבֶר은 언약 저주로서의 치명적 재난을 가리키므로, 본문 흐름을 살리면서도 현대 한국어에서 자연스러운 ‘재앙’으로 옮겼습니다.
- source_word: יַדְבֵּק בְּךָ
  english_pob_choice: will make ... cling to you
  chosen_korean: 당신에게 달라붙게 하셔서
  alternatives_korean:
  - 당신에게 붙게 하셔서
  - 당신에게 들러붙게 하셔서
  - 당신에게 달라붙도록 하셔서
  lexicon: HALOT
  rationale: דבק의 사역형이 주는 ‘붙다/달라붙다’의 강한 지속성을 살리기 위해, 재앙이 쉽게 떨어지지 않는 이미지를 지닌 ‘달라붙게 하다’를 선택했습니다.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  english_pob_choice: until he has wiped you out
  chosen_korean: 당신을 없애 버리실 것입니다
  alternatives_korean:
  - 당신을 완전히 없애실 것입니다
  - 당신을 소멸하실 것입니다
  - 당신을 멸하실 것입니다
  lexicon: HALOT
  rationale: כלה는 여기서 완전한 종결/소멸의 뜻이므로, 현대어에서 강한 총체성을 전달하는 ‘없애 버리다’로 옮겼습니다.
- source_word: מֵעַל הָאֲדָמָה
  english_pob_choice: from the land
  chosen_korean: 그 땅에서
  alternatives_korean:
  - 그 땅 위에서
  - 그 땅에서부터
  - 그 땅 위로부터
  lexicon: HALOT
  rationale: 언약적 토지 문맥에서 אֲדָמָה는 단순한 흙이 아니라 소유해야 할 땅을 가리키므로, 한국어로는 자연스럽게 ‘그 땅’으로 정리했습니다.
theological_decisions:
- issue: 재앙의 주체와 수단의 관계
  chosen_reading: 여호와께서 재앙을 달라붙게 하시고, 그 재앙으로 당신을 그 땅에서 없애 버리십니다.
  alternative_readings:
  - 재앙이 당신을 없애 버립니다
  - 여호와께서 당신을 직접 없애 버리십니다
  rationale: 히브리어는 여호와의 행위와 재앙의 지속적 작용을 함께 말하므로, 주체를 하나님께 두되 재앙을 심판의 수단으로 보이게 옮겼습니다.
  doctrine_reference: 언약 저주의 주권적 집행을 본문이 말하는 방식대로 유지합니다.
