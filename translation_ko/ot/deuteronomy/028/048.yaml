    rationale: וְעָבַדְתָּ는 앞 문맥과 연결되는 접속사일 뿐 이 절 안에 ‘그때’에 해당하는 어휘는 없습니다. 불필요한 시간 표지는 삭제하는 것이 안전합니다.
