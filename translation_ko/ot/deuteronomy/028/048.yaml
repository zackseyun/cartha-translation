  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
  footnotes:
  - marker: a
    text: Or, 'a yoke of iron.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew could also be understood with the enemy as the subject of 'will put' and 'has destroyed,' but the main text takes the LORD as the continuing subject from the previous clause.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에는 굶주림과 목마름과 헐벗음과 모든 것의 결핍 속에서, 야훼께서 당신에게로 보내시는 원수들을 섬기게 되실 것입니다. 그리고 그분이 당신의 목에 쇠멍에를 씌우셔서, 당신을 멸망시키실 때까지 그렇게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֹל בַּרְזֶל은 ‘쇠멍에’ 또는 ‘쇠로 된 멍에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 뒤 절의 동사들은 원수들이 아니라 계속 야훼를 주어로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  english_pob_choice: you shall serve
  chosen_korean: 섬기게 되실 것입니다
  alternatives_korean:
  - 섬기실 것입니다
  - 봉사하게 되실 것입니다
  - 노역하게 되실 것입니다
  lexicon: HALOT
  rationale: עבד는 여기서 예배가 아니라 원수에게 강제로 종속되어 섬기는 뜻이므로, 문맥의 억압성을 살려 ‘섬기다’로 옮겼습니다.
- source_word: אֹיְבֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 원수들을
  alternatives_korean:
  - 적들을
  - 당신의 원수들을
  lexicon: HALOT
  rationale: 적대하는 대상이라는 기본 의미를 직접 살려 ‘원수들’로 옮겼습니다.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  english_pob_choice: in hunger and in thirst and in nakedness and in lack of everything
  chosen_korean: 굶주림과 목마름과 헐벗음과 모든 것의 결핍 속에서
  alternatives_korean:
  - 굶주림과 목마름과 벗은 몸과 모든 것의 부족 속에서
  - 기근과 갈증과 헐벗음과 모든 부족 속에서
  lexicon: HALOT
  rationale: 연속된 전치사구의 누적 효과를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘속에서’로 묶었습니다. ‘헐벗음’은 עירֹם의 직설성을 유지합니다.
- source_word: עֹל בַּרְזֶל
  english_pob_choice: an iron yoke
  chosen_korean: 쇠멍에
  alternatives_korean:
  - 철로 된 멍에
  - 쇠로 만든 멍에
  lexicon: HALOT
  rationale: ‘멍에’는 본문의 지배·예속 이미지를 가장 직접적으로 드러내며, ‘쇠’는 철의 कठ경성을 간결하게 살립니다.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  english_pob_choice: until he has destroyed you
  chosen_korean: 당신을 멸망시키실 때까지
  alternatives_korean:
  - 당신을 멸하실 때까지
  - 당신을 파멸시키실 때까지
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 반영해 ‘멸망시키다’를 택했습니다. 완료 감각은 한국어의 ‘-실 때까지’로 자연스럽게 전달됩니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 번역 관습적 대치어보다 고유 নাম을 살려 ‘야훼’로 옮겨, 언약 저주의 주체가 누구인지 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: “그가”의 주어 유지
  chosen_reading: 야훼께서 보내신 원수들을 말하면서도, 뒤의 ‘씌우셔서… 멸망시키실’의 주어를 야훼로 유지했습니다.
  alternative_readings:
  - 원수들이 멍에를 씌우고 멸망시킨다
  - 주어를 명시하지 않고 수동적으로 처리한다
  rationale: 히브리어의 연속 동사 흐름과 POB의 audit trail에 따라, 야훼가 심판을 실행하시는 궁극적 주어라는 점을 보존했습니다.
  doctrine_reference: 신명기 28장의 언약 저주 구조
