  source_fidelity: 핵심 어휘인 굶주림, 목마름, 헐벗음, 전면적 결핍, 철 멍에, 멸망은 대체로 충실합니다. 그러나 본문에 없는 시간 표지인 ‘그때에는’이 추가되었고, בָּךְ의 적대적 용법은 ‘당신에게로’보다 ‘당신을 치도록/당신을 대적하도록’이 더 정확합니다. 마지막의 ‘그렇게 하실 것입니다’는 원문에 없는 반복입니다.
