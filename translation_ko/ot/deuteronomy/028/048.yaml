  terminology: ‘야훼’, ‘원수들’, ‘쇠멍에’, ‘멸망시키다’는 적절합니다. 다만 ‘쇠멍에’는 현대 독자에게 다소 압축된 합성어이므로 ‘쇠로 된 멍에’가 더 명료하면서도 원문의 철 이미지를 보존합니다.
  issues:
