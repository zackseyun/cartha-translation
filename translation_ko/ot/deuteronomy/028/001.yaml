  source_fidelity: 초안은 조건절과 결과절, 계명 준수 및 모든 민족보다 높이 세움이라는 핵심 의미를 대체로 충실히 옮겼습니다. 그러나 וְהָיָה를 ‘그때가 되면’으로 옮긴 것은 원문에 없는 시간적 전제를 더하며, 첫 번째 ‘야훼 너희의 하나님’에서 소유 표현이 빠졌습니다. 또한 ‘참으로 잘 듣고’는 강조는 나타내지만 언약적 청종의 의미가 다소 약하고 구어적으로 들릴 수 있습니다.
