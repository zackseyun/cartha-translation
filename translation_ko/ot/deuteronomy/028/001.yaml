base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
  footnotes:
  - marker: a
    text: Hebrew literally, 'if hearing you hear the voice of the LORD your God,' an idiom meaning attentive, obedient listening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때가 되면, 여러분이 하나님이신 야훼의 음성을 참으로 잘 듣고, 오늘 내가 여러분에게 명령하는 그의 모든 계명을 지키며 행하면, 야훼 여러분의 하나님께서 여러분을 땅의 모든 민족보다 높이 세우실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘야훼 당신의 하나님의 음성을 듣고 또 듣는다면’이라는 관용구로, 주의 깊고 순종적인 청종을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  english_pob_choice: if you diligently obey the voice of Yahweh your God
  chosen_korean: 하나님이신 야훼의 음성을 참으로 잘 듣고
  alternatives_korean:
  - 야훼 하나님께 순종하고
  - 야훼 여러분의 하나님의 음성에 귀를 기울여
  lexicon: HALOT
  rationale: 히브리어의 ‘듣고 듣다’는 관용적 강조를 한국어의 ‘참으로 잘 듣고’로 옮겨, 단순 청취가 아니라 순종적 경청이라는 뜻을 살렸습니다.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: being careful to do
  chosen_korean: 지키며 행하면
  alternatives_korean:
  - 지켜 행하면
  - 주의 깊게 지켜 행하면
  lexicon: HALOT
  rationale: ‘지키다/행하다’의 두 동사를 간결하게 살려, 계명을 보존하는 것과 실제 실행하는 것을 함께 드러냈습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 하나님이신 야훼
  alternatives_korean:
  - 야훼 여러분의 하나님
  - 야훼 하나님
  lexicon: HALOT
  rationale: 문맥상 소유격 ‘너의 하나님’을 자연스럽게 풀되, 고유명사 야훼를 유지해 언약 이름을 분명히 했습니다.
- source_word: עֶלְיוֹן עַל כָּל גּוֹיֵי הָאָרֶץ
  english_pob_choice: will set you high above all the nations of the earth
  chosen_korean: 땅의 모든 민족보다 높이 세우실 것입니다
  alternatives_korean:
  - 땅의 모든 민족 위에 높이 두실 것입니다
  - 세상의 모든 민족보다 높이 하실 것입니다
  lexicon: HALOT
  rationale: ‘높이 세우다’는 지위의 상승을 자연스럽게 담아, עֶלְיוֹן의 비교적 의미를 한국어로 분명하게 옮겼습니다.
theological_decisions:
- issue: 야훼의 음성을 듣는다는 언약적 순종 표현
  chosen_reading: ‘음성을 참으로 잘 듣고’로 옮겨 청종과 순종을 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀에 순종하고’
  - ‘야훼의 음성에 귀를 기울이고’
  rationale: 본문은 단순한 청각이 아니라 언약에 대한 순종을 요구하므로, ‘듣다’의 관용적 의미를 살리면서도 지나치게 해석적으로 바꾸지 않았습니다.
  doctrine_reference: 신명기 언약 순종의 청종 공식
- issue: ‘높이’의 비교적 상태를 지위 상승으로 표현
  chosen_reading: ‘높이 세우실 것입니다’
  alternative_readings:
  - ‘높이 두실 것입니다’
  - ‘우위에 두실 것입니다’
  rationale: עֶלְיוֹן은 여기서 하나님의 이름이 아니라 상대적 우월 지위를 가리키므로, 민족들 위의 승격을 자연스럽게 나타내는 표현을 택했습니다.
  doctrine_reference: 문맥적 형용사 עֶלְיוֹן
