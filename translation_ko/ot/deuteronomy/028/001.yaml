  terminology: יַהְוֶה는 일관되게 ‘야훼’로, אֱלֹהֶיךָ는 ‘여러분의 하나님’으로 옮겼습니다. מִצְוֺתָיו는 ‘그의 모든 계명’으로 유지하고, עֶלְיוֹן עַל כָּל גּוֹיֵי הָאָרֶץ는 ‘땅의 모든 민족보다 높이 세우다’로 적절히 반영했습니다.
