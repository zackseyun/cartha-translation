source:
  edition: WLC
  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
  footnotes:
  - marker: a
    text: Or 'her placenta.' The Hebrew term refers specifically to the afterbirth that comes out during childbirth.
    reason: lexical_alternative
  - marker: b
    text: Or 'for want of everything.' The phrase denotes extreme deprivation during the siege.
    reason: lexical_alternative
  - marker: c
    text: '''Within your gates'' refers to the city or town under siege, not merely the gate structure itself.'
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 자기 다리 사이에서 나오는 태반과[a] 자기가 낳은 자녀들을, 모든 것이 부족한 가운데[b] 몰래 먹을 것입니다. 이는 네 원수가 네 성읍들 안에서[c] 너를 압박할 포위와 곤경 가운데 일어날 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후산’. 히브리어는 출산 때 나오는 태반, 곧 후산을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 것이 부족하여’. 이 표현은 포위 중의 극심하고 전면적인 결핍을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘네 성문들 안에서’. 이는 성문 구조만이 아니라 포위된 성읍이나 마을의 영역 전체를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  english_pob_choice: her afterbirth
  chosen_korean: 태반
  alternatives_korean:
  - 산후 조직
  - 후산
  lexicon: HALOT
  rationale: 히브리어는 출산 때 나오는 ‘afterbirth/placenta’를 가리키므로, 한국어에서는 해부학적으로 정확한 ‘태반’이 가장 직접적입니다. 문맥의 충격성과 구체성을 살리기 위해 완곡한 표현은 피했습니다.
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  english_pob_choice: that comes out from between her legs
  chosen_korean: 자기 다리 사이에서 나오는
  alternatives_korean:
  - 발 사이에서 나오는
  - 다리 사이로 나오는
  lexicon: HALOT
  rationale: 히브리어의 신체적 묘사를 그대로 살리되, 한국어에서는 ‘다리 사이’가 자연스럽고 이해 가능한 대응입니다. 출산 장면의 육체성을 약화하지 않도록 직설적으로 옮겼습니다.
- source_word: בְּחֹסֶר כֹּל
  english_pob_choice: in the lack of everything
  chosen_korean: 모든 것이 부족한 가운데
  alternatives_korean:
  - 모든 것이 모자라는 가운데
  - 아무것도 없는 가운데
  lexicon: HALOT
  rationale: 이 구절은 극심한 결핍 상태를 뜻하므로, 영어 POB의 의미를 따라 총체적 결핍을 나타내는 표현으로 옮겼습니다. ‘모든 것이 부족한’은 어색하지 않으면서도 원문의 압박감을 유지합니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 네 성문들 안에서
  alternatives_korean:
  - 네 성읍 안에서
  - 네 성문 안에서
  lexicon: HALOT
  rationale: ‘성문들’은 도시 공동체 전체를 가리키는 히브리식 표현이므로, 단순한 문 구조가 아니라 도시 내부를 염두에 둔 뜻을 드러내야 합니다. POB의 문화적 주석을 반영해 ‘안에서’로 지리적 범위를 분명히 했습니다.
theological_decisions:
- issue: ‘성문들 안에서’의 도시-공동체 의미
  chosen_reading: ‘네 성문들 안에서’는 단지 문턱이 아니라 포위된 도시 전체를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - ‘네 성읍 안에서’로 의역
  - ‘네 문들 안에서’로 직역
  rationale: 히브리어 관용구의 사회적·군사적 범위를 살려야 하므로, 도시 공동체를 의미하는 원뜻을 독자에게 분명히 전달하는 쪽을 택했습니다.
  doctrine_reference: 신명기 28장 저주의 언약적·역사적 문맥
