revisions:
- from: 그리고 자기 다리 사이에서 나오는 태반과[a] 자기가 낳는 자녀들에게까지, 그가 모든 것이 부족한 가운데[b] 몰래 먹게 될 것이니, 곧 적군이 너를 네 성문들 안에서 압박하는 포위와 곤경의 때입니다[c].
  to: 그녀는 자기 다리 사이에서 나오는 태반과[a] 자기가 낳은 자녀들을, 모든 것이 부족한 가운데[b] 몰래 먹을 것입니다. 이는 네 원수가 네 성읍들 안에서[c] 너를 압박할 포위와 곤경 가운데 일어날 일입니다.
