  - severity: high
    issue: 목적어·통사 관계의 붕괴
    rationale: ‘태반과 자녀들에게까지’는 여격처럼 제시되지만 뒤의 ‘먹게 될 것’에는 목적어가 필요합니다. 본문의 뜻에 맞게 태반과 자녀들을 먹는다고 명시해야 합니다.
