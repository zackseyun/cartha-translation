  lexicon: HALOT
  rationale: 히브리어 분사형 אָרוּר는 언약적 제재의 선언으로 기능하므로, 상태를 직접 드러내는 ‘저주를 받을’이 본문의 법정적·선언적 힘을 가장 잘 살립니다.
- source_word: אַתָּה
  english_pob_choice: are you
  chosen_korean: 당신은
  alternatives_korean:
  - 너는
  - 네가
  lexicon: HALOT
  rationale: 히브리어의 2인칭 단수 대명사가 분명히 드러나므로, 한국어에서도 주어를 생략하지 않고 반복되는 대상의 강조를 살리기 위해 ‘당신은’으로 옮겼습니다.
- source_word: בָּעִיר
  english_pob_choice: in the city
  chosen_korean: 성 안에서
  alternatives_korean:
  - 도시에서
  - 성읍에서
  lexicon: HALOT
  rationale: ב는 장소를 나타내며, ‘성 안에서’는 도시 영역을 자연스럽게 드러내면서 뒤의 ‘들판’과 대조되는 생활권의 의미를 살립니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판에서
  alternatives_korean:
  - 밭에서
  - 시골에서
  lexicon: HALOT
  rationale: שָׂדֶה는 경작지/들판을 가리키므로, ‘들판에서’가 ‘성 안에서’와 평행을 이루며 구체적인 농경 공간을 유지합니다.
theological_decisions:
- issue: 언약 저주의 선언문 형식
  chosen_reading: 미래 예언이나 소망적 표현으로 풀지 않고, 현재적 선언인 ‘저주를 받을 것입니다’로 유지했습니다.
  alternative_readings:
  - 성 안에서도 저주를 받게 될 것입니다
  - 성 안에서도 저주를 받으십시오
  rationale: 히브리어는 반복된 분사와 2인칭 대명사로 이루어진 서술적 선언형이므로, 문맥상의 언약 저주를 직접적으로 전달하는 것이 본문의 재판적 성격을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 언약 축복/저주의 공적 선언 형식을 보존'
