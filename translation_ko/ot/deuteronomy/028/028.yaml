base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
  footnotes:
  - marker: a
    text: Or 'bewilderment of heart' or 'dismay of heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분을 광기로, 눈멀음으로, 마음의 혼란으로 치시리라[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음의 어리둥절함’ 또는 ‘마음의 당혹’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  english_pob_choice: will strike you
  chosen_korean: 치시리라
  alternatives_korean:
  - 때리시리라
  - 치실 것입니다
  - 내리치시리라
  lexicon: HALOT
  rationale: הִפְעִיל נכה는 단순한 ‘해를 끼치다’보다 ‘치다/내리치다’의 강한 징계를 나타내므로, 현대 한국어에서 자연스럽고 경고의 힘을 살리는 ‘치시리라’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문은 여호와가 아니라 신명기 전통의 고유명사 יְהוָה를 쓰므로, 프로젝트 기본값에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: בְּשִׁגָּעוֹן
  english_pob_choice: with madness
  chosen_korean: 광기로
  alternatives_korean:
  - 미친 상태로
  - 정신 이상으로
  - 광란으로
  lexicon: HALOT
  rationale: שִׁגָּעוֹן은 정신적 혼란이나 광기를 가리키므로, 문맥의 저주적 강도를 유지하는 직역성 표현인 ‘광기’가 가장 적절합니다.
- source_word: וּבְתִמְהוֹן לֵבָב
  english_pob_choice: and confusion of heart
  chosen_korean: 마음의 혼란으로
  alternatives_korean:
  - 마음의 당혹으로
  - 마음의 어리둥절함으로
  - 마음의 놀라움으로
  lexicon: HALOT
  rationale: תִמְהוֹן은 당혹, 경악, 혼란의 뜻을 가지며 לֵבָב은 인격의 중심을 가리키므로, 한국어에서는 자연스럽게 ‘마음의 혼란’으로 옮겨 원문의 심리·인식적 혼란을 살렸습니다.
theological_decisions:
- issue: 야훼의 징계 언어를 완화하지 않을지 여부
  chosen_reading: ‘치시리라’와 ‘광기/마음의 혼란’의 강한 저주 표현을 그대로 유지했습니다.
  alternative_readings:
  - 내리치실 것입니다
  - 벌하시리라
  - 혼란에 빠뜨리시리라
  rationale: 본문은 언약 저주의 공식으로서 신적 징벌의 직접성과 강도를 의도하므로, 의미를 부드럽게 바꾸지 않고 원문의 경고력을 보존했습니다.
  doctrine_reference: 신명기 28장의 언약 저주
