source:
  edition: WLC
  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
  footnotes:
  - marker: a
    text: Or 'you will not be at ease.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'failing/wasting of eyes.'
    reason: lexical_alternative
  - marker: c
    text: Or 'sorrow of soul' or 'pain of soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 나라들 가운데서는 당신이 안식을 얻지 못할 것이며, 당신의 발바닥이 쉴 곳도 없을 것입니다. 거기에서 야훼께서 당신에게 떨리는 마음과 쇠약해지는 눈과 영혼의 고통을 주실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 편안하지 않을 것입니다.’
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘눈의 쇠약함/소모됨’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영혼의 슬픔’ 혹은 ‘영혼의 아픔’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  english_pob_choice: you will find no rest
  chosen_korean: 안식을 얻지 못할 것이며
  alternatives_korean:
  - 쉬지 못할 것이며
  - 평안을 얻지 못할 것이며
  lexicon: HALOT
  rationale: 히필형의 ‘rest/at ease’ 의미를 자연스러운 현대 한국어로 옮기되, 출애굽기·신명기의 저주 문맥에 맞게 ‘안식’의 상실로 표현했습니다.
- source_word: מָנוֹחַ לְכַף רַגְלֶךָ
  english_pob_choice: there will be no resting place for the sole of your foot
  chosen_korean: 당신의 발바닥이 쉴 곳도 없을 것입니다
  alternatives_korean:
  - 당신의 발바닥을 위한 쉴 곳도 없을 것입니다
  - 당신 발의 발바닥이 쉴 곳도 없을 것입니다
  lexicon: HALOT
  rationale: כַּף רֶגֶל의 구체성을 살리면서도 한국어에서는 ‘발바닥’과 ‘쉴 곳’이 가장 자연스럽고 이미지가 분명합니다.
- source_word: לֵב רַגָּז
  english_pob_choice: a trembling heart
  chosen_korean: 떨리는 마음
  alternatives_korean:
  - 떨리는 হৃদ심
  - 불안한 마음
  - 흔들리는 마음
  lexicon: HALOT
  rationale: ‘마음’이 한국어에서 לב의 심리적·내적 중심을 가장 자연스럽게 전달하며, רַגָּז의 떨림과 동요를 직접적으로 살렸습니다.
- source_word: כִלְיוֹן עֵינַיִם
  english_pob_choice: failing eyes
  chosen_korean: 쇠약해지는 눈
  alternatives_korean:
  - 시들어 가는 눈
  - 망가져 가는 눈
  - 쇠하는 눈
  lexicon: HALOT
  rationale: 문자적인 ‘wasting/failing’의 이미지를 유지하면서도 한국어에서 어색하지 않게 ‘쇠약해지다’로 표현했습니다.
- source_word: דַאֲבוֹן נָפֶשׁ
  english_pob_choice: anguish of soul
  chosen_korean: 영혼의 고통
  alternatives_korean:
  - 영혼의 괴로움
  - 마음의 고통
  - 영적 고통
  lexicon: HALOT
  rationale: נֶפֶשׁ를 전통적으로 ‘영혼’으로 옮겨, 단순한 감정이 아니라 존재 전체의 깊은 고통이라는 강도를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 번역은 하나님의 고유 이름을 제목어 ‘주’로 대체하지 않고, 프로젝트 기준에 따라 ‘야훼’로 직접 음역합니다.
theological_decisions:
- issue: 여호와/주로 대체하지 않고 하나님의 이름을 표기하는 문제
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 여호와의 이름을 직접 사용하므로, 신격을 일반 호칭으로 완화하지 않고 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
