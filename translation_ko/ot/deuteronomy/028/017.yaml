lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed shall be
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주받습니다
  lexicon: HALOT
  rationale: 히브리어의 단정적 저주 선포를 현대 한국어 합쇼체로 옮기기 위해 수동형 표현을 사용했습니다. '받을 것입니다'는 예언적·선언적 어조를 살리면서도 자연스럽습니다.
- source_word: טַנְאֲךָ
  english_pob_choice: your basket
  chosen_korean: 당신의 바구니
  alternatives_korean:
  - 당신의 광주리
  - 당신의 바구니
  lexicon: HALOT
  rationale: טַנֶּא는 일반적인 ‘바구니’로 넓게 옮길 수 있어, 직역적이면서도 현대 독자가 이해하기 쉬운 표준어를 택했습니다.
- source_word: וּמִשְׁאַרְתֶּךָ
  english_pob_choice: and your kneading bowl
  chosen_korean: 반죽 그릇도
  alternatives_korean:
  - 반죽 통도
  - 반죽 쟁반도
  - 반죽 그릇도
  lexicon: HALOT
  rationale: מִשְׁאֶרֶת은 반죽에 쓰는 용기이므로, 영어 POB의 ‘kneading bowl’에 맞춰 기능을 드러내는 ‘반죽 그릇’으로 옮겼습니다. 연결 접속사 'וּ'는 앞 항목과 함께 저주 대상이 더해지는 흐름을 살려 ‘도’로 처리했습니다.
theological_decisions:
- issue: 저주 선언문의 문체
  chosen_reading: 본문의 언약 저주 선포를 완곡하게 풀지 않고, 선언적 수동형으로 그대로 드러냈습니다.
  alternative_readings:
  - 당신의 바구니와 반죽 그릇이 저주받습니다
  - 바구니와 반죽 그릇에 저주가 임할 것입니다
  rationale: 신명기 28장의 문맥은 축복/저주의 공적 언약 선언이므로, 대상물 자체에 미치는 저주의 엄중함을 분명히 하는 표현이 적절합니다.
  doctrine_reference: 언약 저주 / 신명기 28장
