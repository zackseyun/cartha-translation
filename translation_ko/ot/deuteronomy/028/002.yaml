  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'if you listen to the voice of the LORD your God.' The Hebrew idiom 'hear/listen to the voice' often carries the sense of obedient response.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 당신의 하나님 야훼의 음성에 순종하면,[a] 이 모든 복이 당신에게 임하고 당신을 따라잡을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 하나님 야훼의 음성을 들으면’입니다. 히브리어에서 ‘음성을 듣다’는 종종 단순히 듣는 것만이 아니라 순종하여 응답하는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  english_pob_choice: will come
  chosen_korean: 임할 것입니다
  alternatives_korean:
  - 올 것입니다
  - 당신에게 올 것입니다
  lexicon: HALOT
  rationale: 복이 사람에게 ‘오다’보다, 예언적·축복 문맥에서 ‘임하다’가 원문의 도래성과 엄중한 어조를 더 잘 살립니다.
- source_word: וְהִשִּׂיגֻךָ
  english_pob_choice: and overtake you
  chosen_korean: 당신을 따라잡을 것입니다
  alternatives_korean:
  - 당신에게 미칠 것입니다
  - 당신을 덮칠 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘뒤쫓아 따라잡다’는 이미지를 살리기 위해 ‘따라잡다’를 택했습니다.
- source_word: תִשְׁמַע בְקוֹל
  english_pob_choice: you obey the voice of
  chosen_korean: 당신이 …의 음성을 들으면
  alternatives_korean:
  - 당신이 …의 음성을 들으면 곧 순종하면
  - 당신이 …의 음성을 순종하면
  lexicon: HALOT
  rationale: ‘듣다/순종하다’의 관용구를 한국어로는 자연스럽게 ‘음성을 들으면’으로 옮기되, 조건문 전체가 순종의 응답을 뜻한다는 점을 유지했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 신명기의 신명 표기는 원문을 따라 ‘야훼’로 유지했고, 2인칭 단수 소유 관계는 ‘당신의 하나님’으로 직역했습니다.
theological_decisions:
- issue: כִּי의 문맥상 기능
  chosen_reading: 말입니다
  alternative_readings:
  - 왜냐하면
  - 그 이유는
  rationale: 여기서는 축복이 임하는 조건을 붙이는 절로 기능하므로, 한국어에서는 문장 끝 보조절 ‘말입니다’로 조건성을 자연스럽게 드러냈습니다.
  doctrine_reference: 문맥적 접속사 처리
- issue: שׁמע בְקוֹל의 순종적 의미
  chosen_reading: 음성을 들으면
  alternative_readings:
  - 음성에 순종하면
  - 음성을 들으며
  rationale: 직역적 이미지인 ‘음성을 듣다’를 보존하되, 전체 절의 조건이 단순 청취가 아니라 언약적 순종임을 독자가 이해하도록 문맥상 유지했습니다.
  doctrine_reference: 신명기적 순종-청종 관용구
