  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
  footnotes:
  - marker: a
    text: Or 'every plague' for 'every affliction'; the Hebrew term can denote a blow, plague, or striking calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 이 법책에 기록되지 않은 모든 질병과 모든 재앙을 야훼께서 당신에게 내리실 것이며, 당신이 멸망할 때까지 그러하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙’ 대신 ‘모든 치는 재앙’으로도 옮길 수 있습니다. 히브리어는 타격, 전염병, 재난을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 심지어
  lexicon: HALOT
  rationale: 추가 요소를 덧붙이는 연결어로, 본문의 누적적 저주 목록을 자연스럽게 이어 주는 표준어입니다.
- source_word: כָּל חֳלִי
  english_pob_choice: every sickness
  chosen_korean: 모든 질병
  alternatives_korean:
  - 모든 병
  - 모든 질환
  lexicon: HALOT
  rationale: חֳלִי는 넓게 병고를 가리키므로, 한국어에서는 현대 독자가 이해하기 쉬운 ‘질병’이 가장 무난합니다.
- source_word: וְכָל מַכָּה
  english_pob_choice: and every affliction
  chosen_korean: 모든 재앙
  alternatives_korean:
  - 모든 타격
  - 모든 환난
  lexicon: HALOT
  rationale: מַכָּה는 ‘치다/가격하다’에서 온 말로 상처, 타격, 재앙까지 넓게 가리킬 수 있어, 질병보다 더 포괄적인 징벌의 뜻을 살려 ‘재앙’으로 옮겼습니다.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  english_pob_choice: in the book of this law
  chosen_korean: 이 법책에
  alternatives_korean:
  - 이 율법책에
  - 이 율법의 책에
  lexicon: HALOT
  rationale: סֵפֶר는 책/두루마리이지만, 이 구절의 문맥상 언약 문서로 기능하므로 자연스러운 한국어로 ‘법책’이라 하되 ‘이’의 지시성을 유지했습니다.
- source_word: עַד הִשָּׁמְדָךְ
  english_pob_choice: until you are destroyed
  chosen_korean: 당신이 멸망할 때까지
  alternatives_korean:
  - 당신이 파멸할 때까지
  - 당신이 완전히 소멸될 때까지
  lexicon: HALOT
  rationale: הִשָּׁמֵד의 종결적 심판을 살리되, 한국어에서 과도하게 강화하지 않고도 분명한 종말적 파괴를 전달하는 표현으로 옮겼습니다.
theological_decisions:
