    text: 또는 ‘모든 재앙’을 ‘모든 타격’ 또는 ‘모든 전염병’으로 옮길 수 있습니다. 히브리어는 타격, 전염병, 또는 징벌적 재앙을 가리킬 수 있습니다.
    reason: lexical_alternative
