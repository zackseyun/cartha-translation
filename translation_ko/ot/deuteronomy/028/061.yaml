  rationale: 원문에 있는 하나님의 고유명사를 제목어 ‘주’로 바꾸지 않고, POB 기준에 따라 음역형 ‘야훼’를 사용해 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
