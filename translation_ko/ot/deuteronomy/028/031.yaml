id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
  footnotes:
  - marker: a
    text: Or 'stolen' for 'seized'; the Hebrew suggests violent taking or robbery.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is no rescuer for you' or 'you will have no deliverer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 소가 당신의 눈앞에서 잡혀도 그 고기를 먹지 못할 것이며, 당신의 나귀는 당신 앞에서 빼앗겨도 당신에게 돌아오지 않을 것이고, 당신의 양 떼는 당신의 원수들에게 넘겨질 것이며, 당신을 구할 사람은 아무도 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹרְךָ
  english_pob_choice: your ox
  chosen_korean: 당신의 소
  alternatives_korean:
  - 당신의 황소
  - 당신의 가축
  lexicon: HALOT
  rationale: שׁוֹר는 노동에 쓰이는 소를 가리키는 경우가 일반적이므로, 현대 한국어에서는 가장 자연스러운 ‘소’로 옮겼습니다.
- source_word: לְעֵינֶיךָ
  english_pob_choice: before your eyes
  chosen_korean: 당신의 눈앞에서
  alternatives_korean:
  - 당신이 보는 앞에서
  - 당신의 눈에 보이는 데서
  lexicon: HALOT
  rationale: 해당 관용구는 사건이 당사자의 바로 앞에서 벌어져 수치를 더하는 뉘앙스를 가지므로, 이를 살린 ‘눈앞에서’로 옮겼습니다.
- source_word: גָּזוּל מִלְּפָנֶיךָ
  english_pob_choice: will be seized from before you
  chosen_korean: 당신 앞에서 빼앗겨
  alternatives_korean:
  - 당신 앞에서 도둑맞아
  - 당신에게서 강제로 빼앗겨
  lexicon: HALOT
  rationale: גזל은 단순 분실이 아니라 강탈·약탈의 뉘앙스를 가지므로, ‘빼앗기다’로 옮겨 폭력적 박탈감을 드러냈습니다.
- source_word: יָשׁוּב לָךְ
  english_pob_choice: will not be returned to you
  chosen_korean: 당신에게 돌아오지 않을 것이고
  alternatives_korean:
  - 당신에게 되돌려지지 않을 것이고
  - 당신에게 회복되지 않을 것이고
  lexicon: HALOT
  rationale: 히브리어는 ‘돌아오다’의 능동형이지만, 문맥상 잃어버린 재산이 본래 주인에게 회복되지 않는 뜻이므로 한국어 관용에 맞게 수동적 의미를 살렸습니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: there will be no one to save you
  chosen_korean: 당신을 구할 사람은 아무도 없을 것입니다
  alternatives_korean:
  - 당신의 구원자가 없을 것입니다
  - 당신을 건져줄 이가 없을 것입니다
  lexicon: HALOT
  rationale: 모셔아는 ‘구원하다/건지다’의 행위자를 가리키므로, 여기서는 종말론적 구원보다 현재적 구조를 따라 ‘구할 사람’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ‘구원’ 어휘를 어떻게 처리할지
  chosen_reading: 현재적 구출을 뜻하는 ‘구할 사람은 아무도 없을 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘구원자가 없을 것입니다’
  - ‘구출해 줄 이가 없을 것입니다’
  rationale: 문맥은 언약 저주의 한복판에서 재산과 보호가 상실되는 상황이므로, 영원한 구원보다 실제적 도움의 부재를 드러내는 번역이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
