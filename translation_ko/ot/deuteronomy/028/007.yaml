base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
  footnotes:
  - marker: a
    text: Or 'The LORD will hand over your enemies who rise up against you, defeated before you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by one way ... by seven ways,' an image of enemies coming in a united approach but fleeing in scattered directions.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 당신을 치고 일어서는 원수들을 당신 앞에서 패하게 하십니다[a]. 그들은 한 길로 당신을 치러 나아오지만[b], 일곱 길로 당신 앞에서 도망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 당신을 치고 일어서는 원수들을 당신 앞에 패배한 채 넘겨주실 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘한 길로 ... 일곱 길로’는 원수들이 한데 모여 왔다가 흩어져 달아나는 모습을 그린 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / divine name convention
  rationale: 원문의 여호와 이름(יהוה)을 제목어가 아니라 고유명으로 드러내기 위해 학술적 음역인 ‘야훼’를 따랐습니다.
- source_word: נִגָּפִים
  english_pob_choice: as defeated
  chosen_korean: 패하게
  alternatives_korean:
  - 쓰러지게
  - 격파되게
  - 쳐부수게
  lexicon: HALOT
  rationale: 여기서는 ‘맞아 쓰러짐’의 결과보다 전투적 패배 상태가 핵심이므로, 한국어 동사구 ‘패하게 하십니다’로 결과 상태를 자연스럽게 드러냈습니다.
- source_word: בְּדֶרֶךְ אֶחָד ... וּבְשִׁבְעָה דְרָכִים
  english_pob_choice: By one way ... by seven ways
  chosen_korean: 한 길로 ... 일곱 길로
  alternatives_korean:
  - 한 방향으로 ... 일곱 방향으로
  - 한 길로 ... 일곱 갈래로
  lexicon: HALOT
  rationale: 원문의 대조 평행법을 살리기 위해 ‘דרך’를 문자적으로 ‘길’로 옮기고, ‘한 길/일곱 길’의 반복으로 흩어져 달아나는 이미지를 유지했습니다.
- source_word: יֵצְאוּ אֵלֶיךָ
  english_pob_choice: they will come out against you
  chosen_korean: 당신을 치러 나아오지만
  alternatives_korean:
  - 당신에게 나아오지만
  - 당신을 향해 나오지만
  lexicon: HALOT
  rationale: יצא + אל의 전투적 관용구를 단순 이동으로 약화하지 않기 위해, 실제 대적 행위를 드러내는 ‘치러 나아오다’를 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 칭호가 아니라 언약 이름을 직접 쓰므로, POB 원칙에 따라 ‘야훼’로 옮겨 본문에서 하나님의 고유한 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
