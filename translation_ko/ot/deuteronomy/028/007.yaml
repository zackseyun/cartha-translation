  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
  footnotes:
  - marker: a
    text: Or 'The LORD will hand over your enemies who rise up against you, defeated before you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by one way ... by seven ways,' an image of enemies coming in a united approach but fleeing in scattered directions.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 당신에게 맞서 일어서는 원수들을 당신 앞에서 패하게 하실 것입니다[a]. 그들은 한 길로 당신에게 맞서 나오겠지만[b], 일곱 길로 당신 앞에서 도망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 당신에게 맞서 일어서는 원수들을 패한 채 당신 앞에 넘겨주실 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘한 길로 … 일곱 길로’는 원수들이 한데 모여 왔다가 여러 방향으로 흩어져 달아나는 모습을 그린 표현입니다.
    reason: cultural_note
lexical_decisions:
