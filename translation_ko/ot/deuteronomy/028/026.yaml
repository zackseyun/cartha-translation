  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה נִבְלָֽתְ/ךָ֙ לְ/מַאֲכָ֔ל לְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
  footnotes:
  - marker: a
    text: Or 'your corpse' or 'your dead body.' The Hebrew term carries a degrading sense in this judgment context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'bird of the sky' and 'beasts of the earth,' a stock sky-and-earth pairing emphasizing total exposure and disgrace.
    reason: cultural_note
  - marker: c
    text: That is, no one will scare away the birds and beasts feeding on the body.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 시체는 하늘의 모든 새와 땅의 짐승들의 먹이가 될 것이며, 그것들을 쫓아낼 사람이 없을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִבְלָה는 단순한 ‘주검’보다 더 굴욕적일 수 있어, 저주 문맥에서는 경멸적 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘/땅’은 히브리어의 전형적 짝 표현으로, 노출의 총체성을 강조합니다.
    reason: cultural_note
  - marker: c
    text: 뜻은 시체를 먹는 새와 짐승을 아무도 몰아내지 않는다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתְךָ
  english_pob_choice: your carcass
  chosen_korean: 당신의 시체
  alternatives_korean:
  - 당신의 사체
  - 당신의 주검
  - 당신의 시체
  lexicon: HALOT
  rationale: 문맥상 저주와 수치의 뜻을 드러내는 মৃত체를 가리키므로, 비교적 중립적이지만 공적 심판의 처지를 잘 보여 주는 ‘시체’로 옮겼습니다. ‘사체’는 다소 법률·의학적이고, ‘주검’은 문학적 뉘앙스가 강합니다.
- source_word: לְמַאֲכָל
  english_pob_choice: food
  chosen_korean: 먹이
  alternatives_korean:
  - 음식
  - 식물
  - 먹이
  lexicon: HALOT
  rationale: ‘~의 먹이가 되다’는 한국어에서 자연스럽고, 사람의 시신이 짐승에게 짓밟히는 저주의 이미지를 강하게 전달합니다. 단순히 ‘음식’보다 더 직접적으로 희생물의 상태를 드러냅니다.
- source_word: לְכָל עוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  english_pob_choice: for every bird of the sky and for the beasts of the earth
  chosen_korean: 하늘의 모든 새와 땅의 짐승들
  alternatives_korean:
  - 하늘의 모든 새와 땅의 짐승들
  - 하늘의 모든 새와 땅의 들짐승들
  - 하늘의 모든 새와 땅의 동물들
  lexicon: HALOT
  rationale: 히브리어의 ‘하늘/땅’ 짝을 살리되, 한국어에서는 ‘새’와 ‘짐승들’로 간결하게 옮겨 자연스러움을 확보했습니다. ‘짐승들’은 저주의 거친 톤을 유지합니다.
- source_word: וְאֵין מַחֲרִיד
  english_pob_choice: and there will be no one to frighten them away
  chosen_korean: 그것들을 쫓아낼 사람이 없을 것입니다
  alternatives_korean:
  - 그것들을 쫓아낼 사람이 없을 것입니다
  - 그것들을 놀라게 하여 달아나게 할 사람이 없을 것입니다
  - 그것들을 내쫓을 사람이 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘떨게 하다/겁주다’의 뜻이지만, 문맥에서는 시체를 먹는 새와 짐승을 몰아낼 사람이 없다는 의미이므로 한국어로는 ‘쫓아내다’가 가장 분명합니다.
theological_decisions:
- issue: 저주 문맥의 수치와 노출을 어떻게 드러낼지
  chosen_reading: 직설적으로 ‘시체’, ‘먹이’, ‘짐승들’로 옮겨, 장례적 완곡어법으로 희석하지 않았습니다.
  alternative_readings:
  - 당신의 주검은 하늘의 모든 새와 땅의 짐승들의 음식이 될 것입니다
  - 당신의 사체가 하늘의 새들과 땅의 동물들에게 먹힐 것입니다
  rationale: 본문은 언약 저주의 극단적 굴욕과 방치 상태를 묘사하므로, 한국어에서도 그 불쾌함과 공개적 수치를 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 신명기 28장의 언약 저주 본문
- issue: ‘하늘/땅’의 짝을 어떻게 처리할지
  chosen_reading: ‘하늘의 모든 새와 땅의 짐승들’로 직역하되, 과도한 설명은 넣지 않았습니다.
  alternative_readings:
  - 하늘과 땅의 모든 피조물에게
  - 온갖 새와 짐승에게
  rationale: 히브리어의 관용적 짝 표현은 총체적 노출을 강조하므로, 이를 보존하는 것이 본문의 수사적 힘을 살립니다.
  doctrine_reference: 신명기 28:26의 수사 구조
