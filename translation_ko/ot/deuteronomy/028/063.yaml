source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
  footnotes:
  - marker: a
    text: Or 'you will be uprooted from the land.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you' is singular in 'that you are entering there to possess it,' addressing Israel as a single people.
    reason: cultural_note
translation:
  language: ko
  text: 여호와께서 여러분에게 선을 베푸시고 여러분을 번성하게 하시기를 기뻐하셨던 것처럼, 여호와께서 여러분을 멸망시키시고 진멸하시기를 기뻐하실 것이며, 여러분은 여러분이 그곳으로 들어가 그 땅을 차지하려는 땅에서 뽑혀 나갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘여러분이’는 단수형으로, 이스라엘을 하나의 백성으로 부릅니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 프로젝트 기본 용례
  rationale: 한국어 교회 언어와 가독성을 고려해 본문은 여호와로 옮겼습니다. 이 구절에서는 인명·지명처럼 널리 통용되는 관용 표기를 유지하는 쪽이 문맥 전달에 유리합니다.
- source_word: שָׂשׂ / יָשִׂישׂ
  english_pob_choice: rejoiced / will rejoice
  chosen_korean: 기뻐하신 것처럼 / 기뻐하실 것입니다
  alternatives_korean:
  - 즐거워하신 것처럼 / 즐거워하실 것입니다
  - 환호하신 것처럼 / 환호하실 것입니다
  lexicon: HALOT
  rationale: 원문의 반복되는 동사를 한국어에서도 대응시키기 위해 같은 동사 ‘기뻐하다’를 유지했습니다. 축복과 심판 양쪽에 같은 정서 동사를 쓰는 긴장을 살립니다.
- source_word: לְהֵיטִיב אֶתְכֶם
  english_pob_choice: to do you good
  chosen_korean: 여러분에게 선을 행하시고
  alternatives_korean:
  - 여러분을 유익하게 하시고
  - 여러분에게 복을 주시고
  lexicon: HALOT
  rationale: 단순한 ‘복 주다’보다 넓은 언약적 선행을 드러내기 위해 ‘선을 행하다’를 택했습니다.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  english_pob_choice: and to multiply you
  chosen_korean: 여러분을 번성하게 하시는
  alternatives_korean:
  - 여러분을 많게 하시는
  - 여러분을 증가시키시는
  lexicon: HALOT
  rationale: 언약적 번성 공식을 자연스러운 현대 한국어로 옮기면서도 의미를 보존하기 위해 ‘번성하게 하다’를 사용했습니다.
- source_word: לְהַאֲבִיד אֶתְכֶם / וּלְהַשְׁמִיד אֶתְכֶם
  english_pob_choice: to destroy you / and to wipe you out
  chosen_korean: 여러분을 멸망시키고 진멸하시는
  alternatives_korean:
  - 여러분을 멸하시고 없애시는
  - 여러분을 파멸시키고 소멸하시는
  lexicon: HALOT
  rationale: 두 파괴 동사의 강도를 구분해 ‘멸망시키다’와 더 강한 ‘진멸하다’로 대응했습니다. 문어적이면서도 심판의 తీవ్ర성을 약화하지 않습니다.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  english_pob_choice: you will be torn away from upon the land
  chosen_korean: 여러분은 … 그 땅에서 뽑혀 나갈 것입니다
  alternatives_korean:
  - 여러분은 그 땅에서 뿌리째 뽑힐 것입니다
  - 여러분은 그 땅 위에서 끌려 나갈 것입니다
  lexicon: HALOT
  rationale: נסח의 강제적 제거 이미지를 한국어 관용으로 자연스럽게 살리기 위해 ‘뽑혀 나가다’를 택했습니다. ‘from upon the land’의 문자성은 지나치게 어색해져 본문 흐름을 해치지 않도록 했습니다.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  english_pob_choice: that you are entering there to possess it
  chosen_korean: 들어가서 차지하려는 그 땅
  alternatives_korean:
  - 들어가서 소유하려는 그 땅
  - 들어가서 차지할 그 땅
  lexicon: HALOT
  rationale: 히브리어의 ‘들어감/차지함’ 흐름을 매끄럽게 압축해, 목적을 드러내는 현재 관형 구조로 옮겼습니다. 히브리어의 지시성과 소유 목적은 ‘그 땅’으로 보존했습니다.
theological_decisions:
- issue: 축복과 심판에 대한 동일한 ‘기뻐하다’의 반복
  chosen_reading: 하나님께서 선을 행하실 때와 심판하실 때를 모두 같은 정서 동사로 연결해, 본문이 의도한 충격과 대칭을 그대로 드러냈습니다.
  alternative_readings:
  - 축복하실 때는 기뻐하시고 심판하실 때는 기꺼이
  - 선하게 하실 때는 좋아하시고 멸망시키실 때는 원하십니다
  rationale: 원문은 축복과 심판을 같은 틀로 병치하며 신적 감정의 대조를 강조합니다. 이를 완화하면 본문의 신학적 긴장이 약해집니다.
  doctrine_reference: '번역 원칙 §3: 해결되지 않은 신학적 긴장 보존'
- issue: 여호와의 언약적 심판 이미지
  chosen_reading: ‘진멸하다’와 ‘뽑혀 나가다’로, 언약 저주의 강도와 추방의 이미지를 모두 드러냈습니다.
  alternative_readings:
  - ‘없애다’와 ‘쫓겨나다’로 완화
  - ‘소멸하다’와 ‘이주하다’로 중화
  rationale: 원문은 단순한 패배가 아니라 땅에서의 강제 제거를 말합니다. 한국어에서도 심판의 폭력성과 추방성을 분명히 해야 합니다.
  doctrine_reference: 신명기 언약 저주 본문
