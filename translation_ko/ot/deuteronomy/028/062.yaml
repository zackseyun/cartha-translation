source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
  footnotes:
  - marker: a
    text: Hebrew 'few in number'; literally 'men/persons of fewness,' an idiom for being very few.
    reason: lexical_alternative
  - marker: b
    text: Or 'whereas you had been as numerous as the stars of heaven.'
    reason: alternative_reading
  - marker: c
    text: The Hebrew says 'you did not listen to the voice of the LORD your God,' a covenant expression that can also imply 'did not obey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 하늘의 별처럼 많아졌었는데도[a][b], 너희가 야훼 너희 하나님[a]의 목소리를 듣지 않았기 때문에, 적은 수만 남게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘적은 수’는 문자적으로는 ‘적음의 사람들/사람 수’라는 뜻으로, 수적으로 매우 적어졌다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희가 하늘의 별처럼 많았던 것과는 달리’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  english_pob_choice: you will be left
  chosen_korean: 남게 될 것입니다
  alternatives_korean:
  - 남을 것입니다
  - 남겨질 것입니다
  lexicon: HALOT
  rationale: 심판 뒤에 ‘남아 있게 됨’이라는 결과를 자연스럽게 살리면서, 단순한 잔존보다 감소·남은 자의 뉘앙스를 유지합니다.
- source_word: בִּמְתֵי מְעָט
  english_pob_choice: few in number
  chosen_korean: 적은 수만
  alternatives_korean:
  - 몇 사람만
  - 아주 적은 수만
  lexicon: HALOT
  rationale: 히브리어 관용구는 수적 극소를 뜻하므로, 성별을 드러내지 않으면서도 한국어로는 자연스러운 수량 표현으로 옮겼습니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  english_pob_choice: as numerous as the stars of the heavens
  chosen_korean: 하늘의 별처럼 많아졌었는데도
  alternatives_korean:
  - 하늘의 별들처럼 많았는데도
  - 하늘의 별만큼 많아졌었는데도
  lexicon: HALOT
  rationale: ‘별’ 비교와 ‘많음’의 상태를 함께 살리되, בעבר의 완성된 번성을 나타내는 과거 완료적 느낌을 한국어로 자연스럽게 반영했습니다.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  english_pob_choice: because you did not listen to the voice of
  chosen_korean: 너희가 … 목소리를 듣지 않았기 때문에
  alternatives_korean:
  - 너희가 … 목소리에 귀를 기울이지 않았기 때문에
  - 너희가 … 말씀을 듣지 않았기 때문에
  lexicon: HALOT
  rationale: ‘voice’를 직역하되, 신명기의 언약적 표현인 ‘듣다’ 구조를 유지했습니다. 한국어 ‘귀를 기울이다’보다 원문 이미지가 더 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대신 하나님의 고유명칭을 학술적 음역인 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
theological_decisions:
- issue: 신명기 28장의 축복/저주 맥락에서 결과절의 어조
  chosen_reading: 미래형 ‘남게 될 것입니다’로 심판의 확정성을 전달했습니다.
  alternative_readings:
  - 현재형 ‘남습니다’
  - 미래완료형 ‘남아 있게 될 것입니다’
  rationale: 본문은 언약 저주의 선언이므로, 현대 한국어에서도 예언적·판결적 확정을 드러내는 미래형이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
- issue: ‘듣다’의 언약적 의미
  chosen_reading: ‘목소리를 듣지 않았다’로 두어, 단순 청각이 아니라 순종 실패의 의미를 열어 두었습니다.
  alternative_readings:
  - ‘순종하지 않았다’로 명시
  - ‘귀 기울이지 않았다’
  rationale: 신명기에서 ‘야훼의 목소리를 듣다’는 언약적 순종을 뜻할 수 있으나, 원문의 동사를 보존해야 하므로 직설적 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
