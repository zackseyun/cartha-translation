  source_fidelity: 수적 소수만 남게 된다는 결과, 하늘의 별과 같은 이전의 번성, 그리고 야훼의 목소리를 듣지 않은 것이 그 이유라는 핵심은 대체로 반영했습니다. 그러나 히브리어의 복수 خطاب에서 마지막 절의 집합적 단수(‘네’)로의 전환은 한국어에서도 ‘너희/네’로 보존하는 편이 더 충실합니다. 또한 ‘목소리를 듣다’는 직역이 한국어에서 다소 부자연스러우므로, 언약적 관용구를 자연스럽게 보존하는 ‘말씀을 듣다’가 적절합니다.
  naturalness: ‘많아졌었는데도’는 현대 표준어에서 과도하게 겹친 과거 표현으로 다소 어색합니다. ‘많아졌지만’이 자연스럽고 원문의 대조를 충분히 나타냅니다. 문장 순서도 원문의 결과절을 먼저 두면 심판 선언의 흐름을 더 잘 따릅니다.
  terminology: ‘야훼’와 ‘하나님’은 제시된 번역 원칙에 부합합니다. ‘야훼 너희 하나님’보다 집합적 단수를 반영한 ‘야훼 네 하나님’이 원문 형태에 더 가깝습니다.
