  lexicon: WLC; HALOT
  rationale: 문장 서두의 분사적 축복 공식을 한국어로 자연스럽게 옮기기 위해, 선언적 미래 의미를 살리면서도 기원문이 아니라 축복 선언임을 드러내는 표현을 택했습니다.
- source_word: טַנְאֲךָ
  english_pob_choice: your basket
  chosen_korean: 당신의 광주리
  alternatives_korean:
  - 당신의 바구니
  - 당신의 바스켓
  lexicon: HALOT
  rationale: טֶנֶא는 곡식이나 소출을 담는 바구니를 가리키므로, 현대어로는 ‘광주리’가 가장 자연스럽고 용례의 기능도 잘 드러냅니다.
- source_word: וּמִשְׁאַרְתֶּךָ
  english_pob_choice: your kneading bowl
  chosen_korean: 당신의 반죽 그릇
  alternatives_korean:
  - 당신의 반죽 통
  - 당신의 반죽 대야
  lexicon: HALOT
  rationale: מִשְׁאֶרֶת는 반죽을 준비하는 용기의 뜻이므로, POB의 ‘kneading bowl’을 따라 ‘반죽 그릇’으로 옮겨 도구의 기능을 분명히 했습니다.
theological_decisions:
- issue: 축복 선언의 문법적 성격
  chosen_reading: 기원문이 아니라 언약적 축복 선언으로 읽고, 한국어에서는 ‘복된 것은’으로 단정적으로 옮겼습니다.
  alternative_readings:
  - ‘복을 받게 될 것입니다’처럼 소망형으로 옮김
  - ‘복이 있을 것입니다’로 완화
  rationale: 본문은 일련의 언약적 축복 선언 가운데 하나로, 명령이나 소원이 아니라 하나님이 부여하시는 복의 확정을 말합니다. 그래서 선언적 어조를 유지했습니다.
  doctrine_reference: 언약 축복/저주 문맥(신 28장)
