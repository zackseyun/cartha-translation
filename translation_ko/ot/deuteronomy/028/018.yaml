  source_fidelity: 히브리어는 네 항목, 곧 태의 열매, 땅의 열매, 소 떼의 번식물, 양·염소 떼의 번식물을 한데 묶어 저주 선언의 술어 아래 둡니다. 초안은 두 문장으로 나누어 첫 문장의 술어와 뒤의 ‘그러할 것입니다’를 중복시켜 원문의 단일 선언 구조를 흐립니다. 또한 אֲלָפֶיךָ와 צֹאנֶךָ의 구별을 ‘가축’과 ‘양 떼’로 옮기면 전자는 지나치게 넓고 후자는 염소를 배제할 수 있습니다.
  naturalness: ‘당신의 양 떼의 어린 것들’보다 ‘양과 염소 떼의 새끼들’이 현대 한국어에서 더 자연스럽고 지시 대상도 분명합니다. 모든 항목을 주어로 놓고 ‘저주받을 것입니다’로 끝내면 합쇼체의 선언문으로 매끄럽습니다.
  terminology: ‘태의 열매’와 ‘땅의 열매’는 히브리어의 의도된 평행을 충실히 보존합니다. ‘소 떼’는 여기의 bovine livestock을, ‘양과 염소 떼’는 צֹאן을 문맥상 명확하게 나타냅니다. 각주 a는 본문의 직역을 단순 반복하지 않고 가능한 한국어 대안을 제시하도록 바로잡았습니다.
