  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
  footnotes:
  - marker: a
    text: Or 'the produce of your land.' The Hebrew literally says 'the fruit of your ground,' preserving the parallel with 'the fruit of your womb.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew expressions here refer specifically to the young or increase of livestock: cattle/herds and sheep/goats/flocks.'
    reason: cultural_note
translation:
  language: ko
  text: 당신의 태의 열매와 당신의 땅의 열매[a], 당신의 소 떼의 새끼들과 당신의 양과 염소 떼의 새끼들이 저주받을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 땅의 소출’로도 옮길 수 있습니다. 히브리어는 ‘당신의 태의 열매’와 평행을 이루도록 문자적으로 ‘당신의 땅의 열매’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 각각 소 떼와 양·염소 떼의 새끼, 곧 그 가축들의 번식물을 가리킵니다.
    reason: cultural_note
