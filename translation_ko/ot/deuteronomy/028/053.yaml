  naturalness: 현 초안의 ‘야훼 너희 하나님이 너희에게 주신 그들을’은 선행사와 목적어가 분리되어 한국어 문장 흐름이 부자연스럽습니다. 관계절을 ‘아들들과 딸들’ 가까이에 배치하면 자연스럽습니다.
  terminology: ‘야훼’는 프로젝트 용례와 일치합니다. פְרִי בִטְנְךָ는 한국어에서 더 자연스러운 ‘네 몸의 열매’로 옮기되, 각주에서 히브리어의 직역적 표현 ‘네 배의 열매’를 밝혔습니다. בָּשָׂר의 강한 의미는 ‘살’로 유지했습니다.
