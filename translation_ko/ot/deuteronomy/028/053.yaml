- from: 그리고 너희는 네 배의 열매, 곧 네 아들들과 딸들의 살을 먹게 될 것입니다. 야훼 너희 하나님이 너희에게 주신 그들을, 너희 원수가 너희를 압박하는 포위와 고통 가운데서 먹게 될 것입니다.[a][b]
  to: 너는 네 몸의 열매[a], 곧 야훼 네 하나님께서 네게 주신 네 아들들과 딸들의 살을 먹게 될 것입니다. 네 원수가 너를 압박하는 그 포위와 고통[b] 가운데서 말입니다.
