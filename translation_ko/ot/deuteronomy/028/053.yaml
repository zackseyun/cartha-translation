translation:
  language: ko
  text: 그리고 너희는 네 배의 열매, 곧 네 아들들과 딸들의 살을 먹게 될 것입니다. 야훼 너희 하나님이 너희에게 주신 그들을, 너희 원수가 너희를 압박하는 포위와 고통 가운데서 먹게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '네 몸의 열매'입니다. 히브리어는 문자적으로 '네 배의 열매'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '포위와 고통/압박 가운데서'입니다.
    reason: lexical_alternative
