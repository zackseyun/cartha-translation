  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
  footnotes:
  - marker: a
    text: Or 'if you obey the commandments of the LORD your God.' The Hebrew says 'listen to,' but in this covenant context the sense includes obedient hearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신을 머리가 되게 하시고 꼬리가 되게 하지 않으실 것입니다[a]. 당신이 오늘 내가 당신에게 명령하는, 야훼 당신의 하나님의 명령들을 지켜 행하려고 그분의 말씀을 들으면, 당신은 오직 위에만 있고 아래에 있지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 야훼 당신의 하나님의 명령들을 순종하면.” 히브리어는 ‘듣다’라고 말하지만, 이 언약 문맥에서는 순종의 의미가 포함됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  english_pob_choice: the LORD will make you
  chosen_korean: 야훼께서 당신을 머리가 되게 하시고
  alternatives_korean:
  - 야훼께서 당신을 머리로 두시고
  - 야훼께서 당신을 머리로 삼으시고
  lexicon: WLC / HALOT
  rationale: נתן의 사역적 용법을 따라, 상태를 ‘되게 하시고’로 옮겨 머리/꼬리의 비유적 대조가 자연스럽게 드러나도록 했습니다.
- source_word: לְרֹאשׁ / לְזָנָב
  english_pob_choice: the head / the tail
  chosen_korean: 머리 / 꼬리
  alternatives_korean:
  - 우두머리 / 꼬리
  - 머리 / 말단
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 그대로 보존하여 우열과 주도권의 대비를 살렸습니다.
- source_word: כִּי תִשְׁמַע אֶל
  english_pob_choice: if you listen to
  chosen_korean: 당신이 … 말씀을 들으면
  alternatives_korean:
  - 당신이 … 말씀에 순종하면
  - 당신이 … 말씀을 따르면
  lexicon: HALOT
  rationale: שמע의 핵심인 ‘듣다’를 살리되, 언약 문맥의 순종 의미는 뒤의 ‘지켜 행하려고’로 드러나게 했습니다.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  english_pob_choice: to keep and to do them
  chosen_korean: 지켜 행하려고
  alternatives_korean:
  - 지키고 행하려고
  - 지켜서 행하려고
  lexicon: HALOT
  rationale: 두 동사의 결합을 한국어의 자연스러운 관용인 ‘지켜 행하다’로 옮기되, 목적부사 ‘-하려고’로 원문의 부정사 관계를 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 원음 표기를 사용해 신적 고유명을 보존했습니다.
theological_decisions:
- issue: כִּי의 조건절 가치
  chosen_reading: “당신이 … 말씀을 들으면”으로 조건을 분명히 나타냈습니다.
  alternative_readings:
  - “당신이 … 말씀을 들으므로”
  - “당신이 … 말씀을 들었기 때문에”
  rationale: 신명기 28장의 축복 문맥에서 כִּי는 결과의 원인보다 언약적 조건을 형성하므로, ‘if’에 해당하는 한국어 조건 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
