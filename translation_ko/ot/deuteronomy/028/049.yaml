  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
  footnotes:
  - marker: a
    text: Or, 'as the eagle flies' or 'as the eagle darts.' The Hebrew verb emphasizes swift movement.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'whose tongue you will not hear'; the sense is that you will not understand its language.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 머나먼 곳, 땅 끝에서, 독수리가 날아들듯이[a] 한 나라를 당신에게 대적하여 일으키실 것입니다. 그 나라의 언어를 당신은 알아듣지 못할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독수리가 날아가듯이’ 혹은 ‘독수리가 급히 돌진하듯이’입니다. 히브리어 동사는 빠른 움직임을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 혀를 듣지 못한다’는 뜻이며, 의미는 그 언어를 이해하지 못한다는 것입니다.
    reason: lexical_alternative
