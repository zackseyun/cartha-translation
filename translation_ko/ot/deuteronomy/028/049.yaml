  lexicon: HALOT
  rationale: 두 표현 모두 거리의 극단을 강조하므로, 한국어에서도 중복된 원문의 강조를 살려 ‘머나먼 곳’과 ‘땅 끝’을 나란히 두었습니다.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  english_pob_choice: as the eagle swoops down
  chosen_korean: 독수리가 급히 내려치듯
  alternatives_korean:
  - 독수리가 급히 날아들듯
  - 독수리가 낚아채듯
  lexicon: HALOT
  rationale: יִדְאֶה의 빠르고 위협적인 돌진 이미지를 ‘급히 내려치다’로 살려, 단순한 비행이 아니라 덮쳐 오는 느낌을 보존했습니다. ‘독수리’는 전통적이면서도 이 문맥의 맹금 이미지를 잘 드러냅니다.
- source_word: לֹא תִשְׁמַע לְשׁוֹנוֹ
  english_pob_choice: whose language you will not understand
  chosen_korean: 그 언어를 알아듣지 못할 것입니다
  alternatives_korean:
  - 그 혀를 듣지 못할 것입니다
  - 그 말소리를 이해하지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘혀를 듣지 못하다’이지만, 의미상은 언어 이해 불가능을 가리키므로 한국어에서는 자연스럽게 ‘알아듣지 못하다’로 옮겼습니다.
