- source_word: יִשָּׂא ... עָלֶיךָ
  english_pob_choice: will raise up against you
  chosen_korean: 당신에게 대적하여 일으키실 것입니다
  alternatives_korean:
  - 당신에게 일으키실 것입니다
  - 당신을 향해 들어올리실 것입니다
  lexicon: HALOT
  rationale: נשא의 문자적 ‘들다/올리다’보다, כאן의 관용구가 지닌 ‘대적하여 일으키다’의 능동적 심판 행위를 한국어에서 자연스럽게 드러내도록 옮겼습니다.
