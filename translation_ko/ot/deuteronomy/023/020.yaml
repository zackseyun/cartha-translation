review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘이자를 붙여 빌려주다’는 히브리어 히필형의 핵심인 이자 부과를 대체로 전달하지만, ‘빌려주다’를 추가하여 행위를 다소 좁힙니다. 또한 마지막 ‘이자를 붙이는 그 밖의 어떤 것’은 수동적·관계절적 원문(‘이자가 붙는/이자를 붙여 빌려주는 모든 것’)을 능동적으로 바꾸고 문장 연결도 불명확합니다. 반복되는 ‘이자’를 보존하면서 ‘부과하다’로 옮기면 원문에 더 정확합니다.
  naturalness: 현 초안은 ‘음식에 이자를 붙여서도, … 마찬가지입니다’가 앞 문장의 서술 구조에 매끄럽게 연결되지 않고, 마지막 항목의 ‘그 밖의 어떤 것에 대해서도’가 무엇에 이자를 부과하는지 모호합니다. 병렬 법문 구조로 정리한 수정문이 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘형제’, ‘돈’, ‘음식’, ‘이자’는 적절합니다. ‘고리대’는 과도하거나 불공정한 이자라는 현대적 함의를 더할 수 있으므로 본문에는 쓰지 않는 것이 좋습니다. כסף의 문자적 뜻인 ‘은’에 관한 각주는 ‘돈’에 직접 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘빌려주다’가 원문보다 행위를 좁힘
    rationale: תשיך는 여기서 대여자에게 이자를 부과·징수하는 행위를 금합니다. ‘빌려주다’ 자체가 금지 대상인 것처럼 읽힐 수 있으므로 ‘이자를 부과하다’가 더 정확합니다.
  - severity: medium
    issue: 마지막 포괄 항목의 태와 연결이 불명확함
    rationale: ‘이자를 붙이는 그 밖의 어떤 것’은 능동 표현이고, ‘그 밖의’도 원문의 포괄성보다 앞의 두 항목에서 제외된 것처럼 들립니다. ‘이자를 붙여 빌려주는 어떤 것’으로 관계를 명시해야 합니다.
  - severity: low
    issue: 각주 b와 c의 본문 표지가 해당 어휘와 맞지 않음
    rationale: ‘은’이라는 문자적 뜻을 설명하는 각주는 ‘돈’에 붙여야 하며, 이자/고리대 관련 설명은 ‘이자’에 붙이는 편이 독자에게 명료합니다.
  - severity: low
    issue: 각주 d는 번역 선택의 근거가 아니라 문체 메모임
    rationale: 독자용 성경 각주로서는 필요하지 않으며, 수정문에서는 해당 능동적 표현도 제거됩니다.
  revised_text: 네 형제에게 돈[c]에 대한 이자[b]나 음식에 대한 이자나, 이자를 붙여 빌려주는 어떤 것에 대한 이자도 부과해서는 안 됩니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘네 동족’이나 ‘네 친족’; 문자적으로는 ‘네 형제’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 일반적인 대출 이자를 가리킵니다. ‘고리대’는 지나치게 높은 이자라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘은’이지만, 여기서는 ‘돈’을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 세 차례 반복되는 נֶשֶׁךְ(이자)를 ‘이자’로 유지하고, 금지되는 행위를 ‘부과하다’로 명시했습니다. 마지막 관계절은 ‘이자를 붙여 빌려주는 어떤 것’으로 옮겨, 돈과 음식 외의 모든 이자 붙은 대여 대상까지 포괄하는 원문의 범위를 보존했습니다. 불필요한 문체 각주는 삭제하고, 어휘 각주를 해당 본문 어휘에 맞게 재배치했습니다.
