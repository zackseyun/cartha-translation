source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
  footnotes:
  - marker: a
    text: Or 'your fellow Israelite' or 'your kinsman'; literally 'your brother.'
    reason: lexical_alternative
  - marker: b
    text: Older English often has 'usury' here, but the Hebrew refers more generally to charging interest on a loan.
    reason: lexical_alternative
  - marker: c
    text: Literally 'silver' for 'money.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 형제에게 돈[a]에 이자를 붙여 빌려주어서는 안 됩니다. 음식[b][c]에 이자를 붙여서도, 이자를 붙이는[d] 그 밖의 어떤 것에 대해서도 마찬가지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 동족’이나 ‘네 친족’일 수 있으며, 문자적으로는 ‘네 형제’입니다.
    reason: lexical_alternative
  - marker: b
    text: 옛 영어에는 흔히 ‘usury’가 나오지만, 히브리어는 여기서 보다 일반적인 ‘이자 부과’를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘은’이지만, 여기서는 ‘돈’의 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 본문의 반복 구조를 살리기 위해, 뒤의 포괄 항목도 앞의 ‘이자를 붙이다’ 표현을 이어 받았습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: לֹא תַשִּׁיךְ
  english_pob_choice: charge ... interest
  chosen_korean: 이자를 붙여 빌려주어서는 안 됩니다
  alternatives_korean:
  - 이자를 받아서는 안 됩니다
  - 이자를 부과해서는 안 됩니다
  - 이자를 매겨 빌려주어서는 안 됩니다
  lexicon: HALOT
  rationale: 히필형 נשׁך는 단순한 ‘빌리다’가 아니라 대출에 이자를 부과하는 행위를 뜻하므로, 한국어도 ‘이자를 붙이다/부과하다’로 금지의 행위를 드러내는 것이 소스에 가깝습니다.
- source_word: לְאָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 네 형제에게
  alternatives_korean:
  - 네 형제에게
  - 네 동족에게
  - 네 친족에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘네 형제’이며, 본문의 언약적·동족적 관계를 살리기 위해 직역을 유지했습니다.
- source_word: נֶשֶׁךְ כֶּסֶף
  english_pob_choice: interest on money
  chosen_korean: 돈에 이자를 붙여
  alternatives_korean:
  - 돈에 대한 이자
  - 은에 이자를 붙여
  - 돈에 이자를 부과하여
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은’이지만 여기서는 경제적 맥락상 ‘돈’이 자연스럽고, 반복되는 נֶשֶׁךְ은 ‘이자’로 통일하는 것이 본문의 금지 대상을 분명히 합니다.
- source_word: נֶשֶׁךְ אֹכֶל
  english_pob_choice: interest on food
  chosen_korean: 음식에 이자를 붙여서도
  alternatives_korean:
  - 음식에 대한 이자를 붙여서도
  - 식량에 이자를 붙여서도
  - 음식에 이자를 부과해서도
  lexicon: HALOT
  rationale: אֹכֶל은 일반적으로 ‘음식/먹을 것’이므로, 대출 대상의 범위를 과도하게 좁히지 않으면서도 현대 한국어에서 자연한 ‘음식’으로 옮겼습니다.
- source_word: כָּל דָּבָר אֲשֶׁר יִשָּׁךְ
  english_pob_choice: anything that is lent at interest
  chosen_korean: 이자를 붙이는 그 밖의 어떤 것
  alternatives_korean:
  - 이자가 붙는 그 밖의 어떤 것
  - 이자를 매겨 빌려주는 그 밖의 무엇이든
  - 이자가 붙는 모든 것
  lexicon: HALOT
  rationale: כָּל דָּבָר는 포괄적 표현이므로 ‘그 밖의 어떤 것’으로 넓이를 살렸고, יִשָּׁךְ의 수동적 의미를 ‘이자를 붙이는’으로 기능적으로 반영했습니다.
theological_decisions:
- issue: 본문의 금지 범위를 경제 행위 전체로 보존할지 여부
  chosen_reading: 돈과 음식만이 아니라 ‘그 밖의 어떤 것’에도 이자를 붙이는 행위를 포괄적으로 금지한다고 옮겼습니다.
  alternative_readings:
  - 돈과 음식에만 한정된 금지로 좁게 옮김
  - ‘고리대’처럼 관념화하여 옮김
  rationale: 반복되는 נֶשֶׁךְ과 포괄구문 כָּל דָּבָר가 법 조항의 범위를 넓히므로, 한국어도 범주 확장을 유지해 본문의 일반성을 훼손하지 않았습니다.
  doctrine_reference: 신 23:20의 언약 공동체 내 경제 윤리
- issue: 형제 호칭의 공동체적 함의
  chosen_reading: ‘네 형제’로 유지하여 동족·언약 공동체 내부의 관계를 드러냈습니다.
  alternative_readings:
  - ‘네 동족’으로 의미화
  - ‘네 이웃’으로 일반화
  rationale: 영어 POB도 ‘your brother’를 유지하므로, 공동체 내부의 상호 책임과 제한을 약화시키지 않기 위해 직역적 표현을 택했습니다.
  doctrine_reference: 언약 공동체의 상호 배려와 공의
