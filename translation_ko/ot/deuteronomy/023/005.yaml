base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
  footnotes:
  - marker: a
    text: Aram-naharaim is traditionally identified with Mesopotamia, literally 'Aram of the Two Rivers.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 그들이 여러분이 이집트에서 나올 때 길에서 떡과 물을 가지고 여러분을 맞이하지 않았기 때문이며, 또 그가 아람 나하라임[a]의 브돌 출신 브올의 아들 발람을 여러분을 저주하려고 고용했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람 나하라임은 전통적으로 메소포타미아와 동일시되며, 문자적으로는 ‘두 강의 아람’이라는 뜻입니다.
    reason: cultural_note
