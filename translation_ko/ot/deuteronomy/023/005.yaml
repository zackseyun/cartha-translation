review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘밧단아람’은 히브리어 אֲרַם נַהֲרַיִם(아람 나하라임)가 아니며, 본문에 없는 지명을 도입합니다. 또한 שָׂכַר는 ‘부르다’보다 ‘고용하다’가 정확합니다. ‘나오실 때’의 높임 선어말은 출애굽한 청자에게 부적절합니다.
  naturalness: ‘이는 … 때문이며, 또 … 때문입니다’는 앞 절의 금지 명령에 근거를 덧붙이는 원문의 종속적 문맥을 자연스럽고 격식 있게 반영합니다. ‘여러분’은 합쇼체의 현대 공적 문체에 알맞습니다.
  terminology: 발람, 브올, 브돌은 고유명사로 유지했습니다. 아람 나하라임은 본문에서 보존하고, 메소포타미아와의 전통적 식별 및 문자적 뜻은 각주로 처리했습니다.
  issues:
  - severity: high
    issue: ‘아람 나하라임’을 ‘메소포타미아의 밧단아람’으로 옮김
    rationale: 밧단아람은 원문에 없고 아람 나하라임과 동일한 지명으로 단정할 수 없습니다. 본문의 고유 지명을 보존해야 합니다.
  - severity: medium
    issue: שָׂכַר를 ‘불러 … 저주하게 했다’로 번역함
    rationale: 동사는 발람을 ‘고용했다’는 뜻입니다. ‘불러’는 고용의 의미를 약화하며, 사동 표현도 원문의 목적 구문보다 한 단계 더 해석적입니다.
  - severity: low
    issue: ‘이집트에서 나오실 때’의 높임 표현
    rationale: 청자 이스라엘 백성을 높이는 표현이므로 일반적인 현대 성경 문체에 맞지 않습니다.
  - severity: low
    issue: 각주 표지가 ‘이집트’ 뒤에 놓임
    rationale: 각주의 대상은 아람 나하라임이므로 해당 지명 바로 뒤에 표지를 두어야 합니다.
  revised_text: 이는 그들이 여러분이 이집트에서 나올 때 길에서 떡과 물을 가지고 여러분을 맞이하지 않았기 때문이며, 또 그가 아람 나하라임[a]의 브돌 출신 브올의 아들 발람을 여러분을 저주하려고 고용했기 때문입니다.
