- from: 그들이 이집트에서 나오실 때 길에서 떡과 물로 당신을 맞이하지 않았기 때문이며, 또 그가 브올의 아들 발람을 메소포타미아의 밧단아람의 브돌에서 당신을 거슬러 불러 당신을 저주하게 했기 때문입니다.[a]
  to: 이는 그들이 여러분이 이집트에서 나올 때 길에서 떡과 물을 가지고 여러분을 맞이하지 않았기 때문이며, 또 그가 아람 나하라임[a]의 브돌 출신 브올의 아들 발람을 여러분을 저주하려고 고용했기 때문입니다.
  rationale: 원문의 지명 ‘아람 나하라임’을 본문에 그대로 보존하고, 초안이 도입한 ‘밧단아람’을 제거했습니다. שָׂכַר의 고용 의미와 לְקַלְלֶךָּ의 목적 의미를 각각 ‘고용했기’와 ‘저주하려고’로 반영했습니다. 청자에 대한 부적절한 높임을 제거하고 각주 표지를 해당 지명으로 옮겼습니다.
