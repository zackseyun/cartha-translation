  text: לֹֽא יָבֹ֧א פְצֽוּעַ דַּכָּ֛א וּ/כְר֥וּת שָׁפְכָ֖ה בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'No one whose testicles are crushed or whose penis is cut off shall enter the assembly of the LORD.'
