translation:
  language: ko
  text: 고환이 으스러졌거나 음경이 잘린 사람은 야훼의 회중에 들어갈 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יָבֹא
  english_pob_choice: may enter
  chosen_korean: 들어갈 수 없습니다
  alternatives_korean:
  - 들어가서는 안 됩니다
  - 들어갈 수 있지 않습니다
  - 들어오지 못합니다
  lexicon: HALOT
  rationale: 법률 문맥의 प्रवेश 금지를 현대 한국어로 자연스럽게 옮기면서, 단순 서술이 아니라 허용 불가의 의미를 분명히 드러냅니다.
- source_word: פְצוּעַ דַּכָּא
  english_pob_choice: with crushed testicles
  chosen_korean: 고환이 으스러졌거나
  alternatives_korean:
  - 음낭이 짓눌렸거나
  - 불알이 으스러졌거나
  - 생식기가 짓눌렸거나
  lexicon: HALOT
  rationale: 히브리어는 남성 생식기 손상 중에서도 ‘으스러짐’의 이미지를 가진 구체적 표현이므로, 이를 완곡하게 돌리지 않고 해부학적으로 분명한 ‘고환’으로 옮겼습니다.
- source_word: וּכְרוּת שָׁפְכָה
  english_pob_choice: or a severed penis
  chosen_korean: 음경이 잘린 사람은
  alternatives_korean:
  - 남성 성기가 잘린 사람은
  - 자른 몸이 된 사람은
  - 성기가 절단된 사람은
  lexicon: HALOT
  rationale: 두 번째 조건 역시 남성 성기의 절단을 가리키므로, 한국어에서도 직접적이고 오해 없는 표현인 ‘음경’과 ‘잘린’으로 대응했습니다.
- source_word: בִּקְהַל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 공동체
  lexicon: HALOT
  rationale: קהל은 단순 모임보다 언약 공동체로 모인 회집체를 가리키므로, 한국어 성서 번역에서 의미를 비교적 잘 살리는 ‘회중’을 택했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 고유명사로서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신적 이름을 титുല이 아닌 고유명사로 드러내려는 이 프로젝트의 기본 원칙에 따라, 대체 칭호 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 신명기 본문에서 Tetragrammaton의 직접 표기 보존
- issue: ‘야훼의 회중’의 범위
  chosen_reading: 입장 금지로 직역하되, 그 범위를 추가 해석하지 않았습니다.
  alternative_readings:
  - 예배 참여 금지
  - 언약 공동체 참여 제한
  - 시민적 자격 제한
  rationale: 본문은 ‘회중에 들어갈 수 없음’이라고만 말하므로, 예배·혼인·시민권 등으로 의미를 좁히거나 넓히지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: 해석을 본문 밖으로 확장하지 않음
