translation:
  language: ko
  text: 고환이 으스러졌거나 음경이 잘린 사람은 야훼의 회중에 들어갈 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 형식적으로, “고환이 으스러진 사람이나 음경이 잘린 사람은 야훼의 회중에 들어가지 못합니다.”
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 회중’은 이스라엘의 언약 공동체에 정식으로 참여하는 일을 가리킬 수 있습니다. 이 배제의 정확한 범위는 논쟁 중입니다.
    reason: alternative_reading
