base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
  footnotes:
  - marker: a
    text: Or 'ears of grain' for 'heads.' The Hebrew term refers to the grain-bearing heads that may be plucked by hand.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall not use a sickle over/upon your neighbor’s standing grain.' The Hebrew verb literally suggests brandishing or applying the sickle.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 이웃의 서 있는 곡식밭에 들어가면[a] 손으로 이삭을 따도 되지만[b], 네 이웃의 서 있는 곡식밭에 낫을 대어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식의 이삭들’로 볼 수 있습니다. 히브리어는 손으로 딸 수 있는 곡식의 이삭을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낫을 네 이웃의 서 있는 곡식밭에 대어서는 안 됩니다.’ 히브리어 동사는 낫을 휘두르거나 적용하는 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָמַת
  english_pob_choice: standing grain
  chosen_korean: 서 있는 곡식밭
  alternatives_korean:
  - 서 있는 곡식
  - 곡식이 선 밭
  lexicon: HALOT
  rationale: קָמָה는 아직 거두지 않은 곡식, 곧 서 있는 곡식을 가리키므로 그 상태를 드러내는 표현을 택했습니다.
- source_word: רֵעֶךָ
  english_pob_choice: your neighbor’s
  chosen_korean: 네 이웃의
  alternatives_korean:
  - 네 동료의
  - 네 가까운 사람의
  lexicon: HALOT
  rationale: 법률 문맥의 רֵעַ는 공동체 안의 타인을 가리키므로, 가장 자연스럽고 문맥에 맞는 ‘이웃’으로 옮겼습니다.
- source_word: מְלִילֹת
  english_pob_choice: heads
  chosen_korean: 이삭
  alternatives_korean:
  - 곡식 머리
  - 이삭들
  lexicon: HALOT
  rationale: 이 단어는 곡식의 이삭/머리를 뜻하므로, 한국어 성경에서 가장 익숙하면서도 의미를 보존하는 ‘이삭’을 사용했습니다.
- source_word: תָנִיף עַל
  english_pob_choice: put a sickle to
  chosen_korean: 낫을 대어서는 안 됩니다
  alternatives_korean:
  - 낫을 휘둘러서는 안 됩니다
  - 낫을 사용해서는 안 됩니다
  lexicon: HALOT
  rationale: תָנִיף는 단순 소유가 아니라 도구를 겨누어 적용하는 동작을 가리키므로, ‘대다’로 옮겨 금지의 행위를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 허용과 금지의 법조문 어조
  chosen_reading: ‘따도 됩니다’와 ‘안 됩니다’로 허용과 금지를 분명히 구분했습니다.
  alternative_readings:
  - ‘따실 수 있습니다’
  - ‘따서는 안 됩니다’
  rationale: 히브리어 법문은 특정 행위의 허용과 제한을 대비하므로, 한국어에서도 같은 법적 긴장을 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 토라의 재산 보호와 이웃 사랑의 법적 적용
