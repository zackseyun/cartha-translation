base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
  footnotes:
  - marker: a
    text: Or 'ears of grain' for 'heads.' The Hebrew term refers to the grain-bearing heads that may be plucked by hand.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall not use a sickle over/upon your neighbor’s standing grain.' The Hebrew verb literally suggests brandishing or applying the sickle.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 이웃의 곡식이 자라고 있는 밭에 들어가면, 손으로 이삭을[a] 따도 됩니다. 그러나 네 이웃의 자라고 있는 곡식에 낫을 대서는[b] 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이삭들을’. 히브리어는 손으로 딸 수 있는 곡식의 이삭을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 이웃의 자라고 있는 곡식 위로 낫을 휘둘러서는 안 됩니다.’ 히브리어 동사는 낫을 휘두르거나 그 곡식에 적용하는 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
