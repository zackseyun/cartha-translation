  lexicon: HALOT
  rationale: 직역하면 ‘해가 들어올 때’이지만, 히브리어 관용구가 가리키는 뜻은 분명한 일몰이므로 현대어로 자연스럽게 풀었습니다.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  english_pob_choice: into the midst of the camp
  chosen_korean: 진영 가운데로 들어올 수 있습니다
