source:
  edition: WLC
  text: וְ/הָיָ֥ה לִ/פְנֽוֹת עֶ֖רֶב יִרְחַ֣ץ בַּ/מָּ֑יִם וּ/כְ/בֹ֣א הַ/שֶּׁ֔מֶשׁ יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
  footnotes:
  - marker: a
    text: Literally, 'when the sun comes in'; this is a Hebrew idiom for sunset.
    reason: lexical_alternative
  - marker: b
    text: Or 'into the camp'; the Hebrew more specifically says 'into the midst of the camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁 무렵에 그는 물로 몸을 씻어야 하고, 해가 지면 진영 가운데로 들어올 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘해가 들어올 때’이지만 여기서는 해가 지는 때를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘진영’이 아니라 ‘진영 가운데/한가운데’를 더 분명히 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת עֶרֶב
  english_pob_choice: toward evening
  chosen_korean: 저녁 무렵에
  alternatives_korean:
  - 해 질 무렵에
  - 저녁이 되어
  lexicon: HALOT
  rationale: ‘פנה + ערב’의 시간 관용구는 하루가 저녁 쪽으로 기우는 때를 가리키므로, 자연스러운 현대 한국어로 ‘저녁 무렵에’라고 옮겼습니다.
- source_word: יִרְחַץ בַּמָּיִם
  english_pob_choice: he shall wash himself with water
  chosen_korean: 물로 몸을 씻어야 하고
  alternatives_korean:
  - 물로 씻어야 하고
  - 물에서 몸을 씻어야 하고
  lexicon: HALOT
  rationale: 의례적 정결 행위의 동사 רחץ는 단순 세정이 아니라 몸을 씻는 행위이므로, ‘몸을 씻다’로 구체화하되 반사적 의미를 과도하게 늘리지 않았습니다.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  english_pob_choice: when the sun sets
  chosen_korean: 해가 지면
  alternatives_korean:
  - 해가 들어가면
  - 일몰하면
  lexicon: HALOT
  rationale: 직역하면 ‘해가 들어올 때’이지만, 히브리어 관용구가 가리키는 뜻은 분명한 일몰이므로 현대어로 자연스럽게 풀었습니다.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  english_pob_choice: into the midst of the camp
  chosen_korean: 진영 가운데로 들어올 수 있습니다
  alternatives_korean:
  - 진영 안으로 들어올 수 있습니다
  - 진영 한가운데로 들어올 수 있습니다
  lexicon: HALOT
  rationale: תוך의 ‘내부/가운데’ 뉘앙스를 살려 단순히 ‘안으로’보다 더 구체적인 ‘가운데로’를 택했습니다.
theological_decisions:
- issue: 정결 후 재진입 허용의 법적 문장 어조
  chosen_reading: 의무와 허용을 함께 드러내기 위해 앞절은 ‘-해야 하고’, 뒤절은 ‘들어올 수 있습니다’로 나누어 번역했습니다.
  alternative_readings:
  - 모두 의무형으로 옮김
  - 모두 허용형으로 옮김
  rationale: 히브리어는 첫 절에서 행위의 필요를, 마지막 절에서 진영 복귀의 허용을 말하므로 한국어에서도 법문 특유의 기능 차이를 보존하는 것이 적절합니다.
  doctrine_reference: 정결 규례의 법적·서술적 구분
