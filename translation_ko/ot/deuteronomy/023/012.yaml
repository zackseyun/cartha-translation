  terminology: ‘진영’은 מַחֲנֶה의 문맥상 적절합니다. ‘몸을 물로 씻어야 합니다’와 ‘들어올 수 있습니다’는 각각 의무와 허용의 기능을 자연스럽게 구별합니다. ‘한가운데’는 תוך의 가능한 뜻이지만 지나치게 좁게 들릴 수 있으므로 본문에서는 ‘안쪽’으로 하고 각주에서 내부/가운데의 범위를 설명하는 편이 좋습니다.
