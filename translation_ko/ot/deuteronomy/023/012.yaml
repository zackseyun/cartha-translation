  source_fidelity: 핵심 의미는 충실합니다. לִפְנוֹת עֶרֶב는 ‘저녁 무렵이 되면’으로, רחץ는 ‘몸을 물로 씻다’로, וּכְבֹא הַשֶּׁמֶשׁ는 ‘해가 지면’으로 적절히 옮겨졌습니다. 마지막 יָבֹא는 재입장을 허용하는 문맥으로 ‘들어올 수 있습니다’가 적절합니다. 다만 אֶל־תּוֹךְ הַמַּחֲנֶה의 ‘내부로’라는 공간적 뉘앙스는 ‘가운데로’보다 ‘안쪽으로’가 현대 한국어에서 더 자연스럽고 정확합니다.
