  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
  footnotes:
  - marker: a
    text: Literally, 'when the sun comes in'; this is a Hebrew idiom for sunset.
    reason: lexical_alternative
  - marker: b
    text: Or 'into the camp'; the Hebrew more specifically says 'into the midst of the camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁 무렵이 되면 그는 몸을 물로 씻어야 합니다. 해가 지면[a] 진영 안쪽으로 들어올 수 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘해가 들어올 때’이지만 여기서는 해가 지는 때를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘진영’이 아니라 진영의 내부, 곧 ‘진영 가운데’를 더 분명히 가리킵니다.
    reason: lexical_alternative
