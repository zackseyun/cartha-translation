  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
  footnotes:
  - marker: a
    text: Or 'detest' or 'loathe' for 'abhor.'
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' refers to Israel''s kinship with Edom through Esau.'
    reason: cross_reference
  - marker: c
    text: Or 'resident foreigner' for 'sojourner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔 사람을 미워해서는 안 됩니다. 그는 당신의 형제이기 때문입니다. 이집트 사람을 미워해서도 안 됩니다. 당신이 그의 땅에서 나그네였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “미워해서는 안 됩니다”는 תְתַעֵב의 강한 혐오/배척을 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 에돔과의 혈연적 관계를 “형제”로 제시합니다.
    reason: cross_reference
  - marker: c
    text: “나그네”는 여기서 타지에 머무는 체류자 신분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  english_pob_choice: abhor
  chosen_korean: 미워해서는 안 됩니다
  alternatives_korean:
  - 혐오해서는 안 됩니다
  - 가증히 여겨서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어 פיעל형은 강한 혐오/배척을 뜻하므로, 한국어에서는 본문의 금지법 문체에 맞는 강한 금지 표현으로 옮겼습니다. “미워하다”는 감정적 혐오를 드러내면서도 과도하게 문어화되지 않아 반복 구조를 살릴 수 있습니다.
- source_word: אֲדֹמִי
  english_pob_choice: Edomite
  chosen_korean: 에돔 사람
  alternatives_korean:
  - 에돔인
  - 에돔 족속
  lexicon: HALOT
  rationale: 민족명은 음역과 뜻풀이를 절충한 “에돔 사람”으로 옮겨, 독자가 사람 집단을 즉시 이해하도록 했습니다. POB의 고유명사 처리 원칙도 보존합니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 당신의 형제뻘인 사람
  - 당신의 친족
  lexicon: HALOT
  rationale: 원문의 친족 관계를 직접 드러내기 위해 “형제”를 유지했습니다. “친족”은 의미는 전달하지만 본문의 역사적·신학적 근거인 형제 관계의 직접성이 약해집니다.
- source_word: מִצְרִי
  english_pob_choice: Egyptian
  chosen_korean: 이집트 사람
  alternatives_korean:
  - 애굽 사람
  - 이집트인
  lexicon: HALOT
  rationale: 현대 표준어에서 자연스러운 민족명으로 옮겼습니다. 전통 교회어인 “애굽”보다 직관적이며, 원문의 민족 지시를 명확히 전달합니다.
- source_word: גֵר
  english_pob_choice: sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 거주 외국인
  lexicon: HALOT
  rationale: גֵר의 핵심은 타지에서 보호 아래 머무는 체류자 신분이므로, 한국어에서는 문맥상 가장 응축된 “나그네”로 옮겼습니다. POB의 “sojourner”가 가진 사회적·법적 뉘앙스를 지나치게 평이하게 만들지 않으면서도 읽기 쉽습니다.
- source_word: בְאַרְצוֹ
  english_pob_choice: in his land
  chosen_korean: 그의 땅에서
  alternatives_korean:
  - 그의 나라에서
  - 그 땅에서
  lexicon: HALOT
  rationale: 히브리어의 단수 소유격을 살려 “그의 땅”으로 옮겼습니다. 이는 이집트라는 국가를 대표적 개인으로 말하는 원문의 표현을 반영합니다.
theological_decisions:
- issue: 대표적 단수 표현을 한국어에서 어떻게 살릴지
  chosen_reading: “에돔 사람… 그는… 이집트 사람… 그의 땅”처럼 단수형을 유지했습니다.
  alternative_readings:
  - “에돔 사람들… 그들은… 이집트 사람들… 그들의 땅”으로 복수화
  rationale: 원문은 법문체에서 민족을 대표 단수로 말합니다. 이를 유지하면 명령의 직접성과 족보·언약적 근거가 더 분명해집니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: אָחִיךָ의 관계를 어떻게 설명할지
  chosen_reading: 본문에는 주석 없이 “당신의 형제”만 두고, 친족 관계 설명은 본문 밖으로 미루었습니다.
  alternative_readings:
  - “당신의 친족”으로 해석해 옮김
  rationale: 에돔과의 관계는 이 본문 자체가 아니라 구약의 역사적 배경에서 설명되는 것이므로, 번역문 안에서는 원문의 직설을 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 4
