  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
  footnotes:
  - marker: a
    text: Or 'a stake'; some understand the implement more functionally as a digging tool or small spade.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon your ear.' The Hebrew expression is idiomatic here and likely refers to one's gear or equipment.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'when you sit down outside,' using a modest euphemism for relieving oneself.
    reason: cultural_note
translation:
  language: ko
  text: 또 너희는 장비 가운데에 말뚝을 하나 두어야 합니다[a]. 그리고 너희가 밖에 앉아 있을 때[b][c], 그것으로 파고 나서 돌아와서 자신의 배설물을 덮어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말뚝’. 이 도구는 말뚝이면서도 실제로는 파는 데 쓰는 작은 삽이나 도구로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네 귀 위에’라고 말합니다. 여기서는 관용적으로 장비나 휴대 장구를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘밖에 앉다’라는 완곡한 표현을 사용하여, 용변을 보는 행위를 직접적으로 말하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  english_pob_choice: peg
  chosen_korean: 말뚝
  alternatives_korean:
  - 말뚝
  - 말뚝 조각
  - 깃대
  lexicon: HALOT
  rationale: 기본 뜻은 말뚝이지만, 여기서는 휴대하여 파고 덮는 도구로 쓰이므로 한국어에서는 기능을 살릴 수 있는 일반적이고 자연스러운 ‘말뚝’으로 옮겼습니다.
- source_word: עַל אֲזֵנֶךָ
  english_pob_choice: among your equipment
  chosen_korean: 장비 가운데에
  alternatives_korean:
  - 장비 위에
  - 소지품 가운데에
  - 무기 곁에
  lexicon: HALOT
  rationale: 직역하면 ‘네 귀 위에’이지만 관용적으로 장비나 휴대 장구를 가리키므로, 오해를 피하면서도 군영 규정을 살려 ‘장비 가운데에’로 옮겼습니다.
- source_word: בְּשִׁבְתְּךָ חוּץ
  english_pob_choice: when you sit down outside
  chosen_korean: 밖에 앉아 있을 때
  alternatives_korean:
  - 밖에 앉을 때
  - 밖으로 나가 앉을 때
  - 밖에서 볼일을 볼 때
  lexicon: HALOT
  rationale: 원문은 완곡한 표현으로 ‘밖에 앉아 있을 때’라고 하여 배설 행위를 직접 말하지 않습니다. 한국어도 그 완곡성을 유지했습니다.
- source_word: צֵאָתֶךָ
  english_pob_choice: your excrement
  chosen_korean: 배설물
  alternatives_korean:
  - 똥
  - 대변
  - 오물
  lexicon: HALOT
  rationale: 인간 배설을 뜻하는 말로, 법문맥에 어울리는 격식 있는 현대 한국어 ‘배설물’을 선택했습니다.
theological_decisions:
- issue: 본문이 사용하는 배설 관련 완곡어법의 처리
  chosen_reading: 직접적인 속어로 바꾸지 않고, ‘밖에 앉아 있을 때’로 완곡성을 유지했습니다.
  alternative_readings:
  - 밖에서 볼일을 볼 때
  - 배설하러 밖에 나갈 때
  rationale: 원문 자체가 노골적 표현을 피하는 법문이므로, 한국어도 같은 정도의 절제된 표현을 유지하는 것이 स्रोत의 어조와 기능을 더 잘 반영합니다.
  doctrine_reference: 본문의 정결 규정과 군영의 거룩함을 드러내는 법문 맥락
