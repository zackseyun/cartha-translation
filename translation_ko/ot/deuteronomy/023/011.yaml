source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
  footnotes:
  - marker: a
    text: Hebrew 'a happening of the night,' an idiom for a nocturnal emission.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분 가운데 밤중의 배출로 말미암아 깨끗하지 못한 사람이 있으면, 그는 진영 밖으로 나가야 합니다. 그는 진영 한가운데로 들어와서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘밤중의 배출’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה בְךָ אִישׁ
  english_pob_choice: If there is among you a man
  chosen_korean: 여러분 가운데 … 사람이 있으면
  alternatives_korean:
  - 여러분 가운데 … 남자가 있으면
  - 여러분 가운데 … 사람이 있을 경우
  lexicon: HALOT
  rationale: 법조문 특유의 조건문을 자연스럽게 옮기되, 공동체 내부를 가리키는 בְךָ의 뉘앙스를 살려 ‘여러분 가운데’로 표현했습니다.
- source_word: לֹא יִהְיֶה טָהוֹר
  english_pob_choice: is not clean
  chosen_korean: 깨끗하지 못한
  alternatives_korean:
  - 부정한
  - 정결하지 못한
  lexicon: HALOT
  rationale: 의례적 상태를 가리키는 טָהוֹר/부정성의 대비를 살리면서도, 도덕적 비난처럼 들릴 수 있는 표현은 피했습니다.
- source_word: מִקְּרֵה לָיְלָה
  english_pob_choice: because of a nocturnal emission
  chosen_korean: 밤중의 배출로 말미암아
  alternatives_korean:
  - 야간의 배출로 말미암아
  - 밤의 사건으로 말미암아
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 의미를 드러내는 한국어로 옮겨, 밤에 일어난 신체적 배출로 인한 의례적 부정을 분명히 했습니다. 본문이 음란이나 죄책을 뜻하는 것은 아니므로 그 방향의 어휘는 피했습니다.
- source_word: לַמַּחֲנֶה / תּוֹךְ הַמַּחֲנֶה
  english_pob_choice: outside the camp / into the midst of the camp
  chosen_korean: 진영 밖 / 진영 한가운데
  alternatives_korean:
  - 진 밖 / 진 가운데
  - 진영 바깥 / 진영 안쪽
  lexicon: HALOT
  rationale: מַחֲנֶה를 군사·공동체적 ‘진영’으로 옮겨, 정결 규정이 공동체 공간의 경계를 다룬다는 점을 살렸습니다. תּוֹךְ는 단순히 ‘안’이 아니라 내부 한복판의 뜻이 있어 ‘한가운데’로 옮겼습니다.
theological_decisions:
- issue: 야간 배출로 인한 부정의 성격
  chosen_reading: 의례적/정결 규정상의 부정으로 읽고, 도덕적 오염으로 읽지 않습니다.
  alternative_readings:
  - 도덕적 죄책을 암시하는 표현으로 읽기
  rationale: 문맥은 진영의 거룩함과 출입 규정에 관한 것이며, 본문 자체는 개인의 죄책을 진술하지 않습니다. 따라서 한국어도 의례적 상태를 가리키는 방향으로 유지했습니다.
  doctrine_reference: Translation philosophy §6; 본문의 평이한 의미 보존
