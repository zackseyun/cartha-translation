revisions:
- from: 여러분 가운데 밤중의 배출로 말미암아 깨끗하지 못한 사람이 있으면, 그는 진영 밖으로 나가야 합니다. 그는 진영 한가운데로 들어와서는 안 됩니다.[a]
  to: 여러분 가운데 밤에 유출이 있어 정결하지 못한 남자가 있으면, 그는 진영 밖으로 나가야 합니다. 그는 진영 안으로 들어와서는 안 됩니다.[a]
  rationale: 원문의 남성 지시(אִישׁ)를 ‘남자’로 보존하고, 의례적 부정을 ‘정결하지 못한’으로 유지했습니다. 야간 유출을 가리키는 완곡한 히브리어 관용구는 본문에서 자연스럽게 옮기고 각주에서 직역과 뜻을 밝혔습니다. 진영의 내부를 뜻하는 표현은 현대 한국어에 맞게 ‘진영 안으로’로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:35Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어 אִישׁ은 이 규정에서 남성을 명시하는데, 초안의 ‘사람’은 이를 일반화합니다. 또한 מִקְּרֵה לָיְלָה는 직역상 ‘밤의 일/사건’이라는 완곡한 관용구이므로, 각주는 이 직역과 관용적 뜻을 함께 밝혀야 합니다.
  naturalness: ‘밤중의 배출’과 ‘진영 한가운데로 들어오다’는 현대 한국어에서 다소 부자연스럽거나 과도하게 공간의 중심점을 가리키는 듯합니다. ‘밤에 유출이 있어’ 및 ‘진영 안으로 들어오다’가 자연스럽고 법규 문체에도 맞습니다.
  terminology: 의례적 상태를 나타내는 ‘정결하지 못한’과 공동체의 야영 공간을 나타내는 ‘진영’은 적절합니다. ‘남자’를 사용하여 원문의 성별 지시를 보존합니다.
  issues:
  - severity: medium
    issue: אִישׁ의 성별 지시가 ‘사람’으로 일반화되었습니다.
    rationale: 원문은 야간 유출과 관련하여 ‘남자’를 명시합니다. 성별을 삭제하지 않는 것이 원문 충실성에 맞습니다.
  - severity: low
    issue: 각주가 히브리어 표현의 직역상 의미를 제시하지 않습니다.
    rationale: מִקְּרֵה לָיְלָה는 문자적으로 ‘밤의 일/사건’이며, 이것이 야간 유출을 가리키는 관용구라는 점을 밝혀야 어휘상의 완곡성과 뜻을 함께 보존할 수 있습니다.
  - severity: low
    issue: ‘진영 한가운데로 들어와서는’은 자연스럽지 않고 תּוֹךְ를 중심 지점으로 지나치게 한정할 수 있습니다.
    rationale: 여기서 תּוֹךְ는 진영의 내부를 뜻합니다. ‘진영 안으로’가 자연스러우면서 출입 금지의 의미를 충분히 전달합니다.
