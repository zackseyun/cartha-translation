  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
  footnotes:
  - marker: a
    text: Or 'congregation of the LORD' for 'assembly of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says both 'to the tenth generation' and 'forever,' preserving the force of enduring exclusion rather than reducing one phrase to the other.
    reason: cultural_note
translation:
  language: ko
  text: 암몬 사람이나 모압 사람은 야훼의 회중에 들어올 수 없습니다[a]. 열 번째 세대까지도[b] 그들 가운데 아무도 야훼의 회중에 영원히 들어올 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 회중’ 대신 ‘주님의 회중’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘열 번째 세대’와 ‘영원히’를 함께 써서, 배제의 지속성을 두 방식으로 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  english_pob_choice: may enter
  chosen_korean: 들어올 수 없습니다
  alternatives_korean:
  - 들어가서는 안 됩니다
  - 들어오지 못합니다
  lexicon: HALOT
  rationale: 법률적 금지와 자격 박탈의 뜻을 자연스러운 현대 한국어로 나타내기 위해 가능성·허가를 부정하는 표현을 사용했습니다.
- source_word: עַמּוֹנִי / מוֹאָבִי
  english_pob_choice: Ammonite / Moabite
  chosen_korean: 암몬 사람 / 모압 사람
  alternatives_korean:
  - 암몬인 / 모압인
  - 암몬 족속 사람 / 모압 족속 사람
  lexicon: HALOT
  rationale: 족속명으로서의 의미를 분명히 하되, 한국어에서는 민족명을 사람으로 풀어 쓰는 것이 가장 자연스럽습니다.
- source_word: קְהַל יְהוָה
  english_pob_choice: assembly of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 집회
  - 야훼의 공동체
  lexicon: HALOT
  rationale: קָהָל은 단순한 모임보다 언약 백성의 공적 집합을 가리키므로, 프로젝트 기본어인 '회중'을 유지하고 יְהוָה는 '야훼'로 옮겼습니다.
- source_word: גַּם דּוֹר עֲשִׂירִי ... עַד עוֹלָם
  english_pob_choice: even to the tenth generation ... forever
  chosen_korean: 열 번째 세대까지도 ... 영원히
  alternatives_korean:
  - 열 번째 세대에 이르기까지도 ... 영원히
  - 열 번째 세대까지 ... 끝없이
  lexicon: HALOT
  rationale: 히브리어의 세대 공식과 '영원히'를 함께 살려, 장기적 배제를 두 표현 모두로 보존했습니다.
theological_decisions:
- issue: ‘열 번째 세대’와 ‘영원히’의 병존
  chosen_reading: 두 표현을 모두 살리고 서로를 약화시키지 않았습니다.
  alternative_readings:
  - ‘열 번째 세대’를 관용적 완곡 표현으로 처리해 사실상 ‘절대’로 묶기
  - ‘영원히’를 후대적 강조로 약화시키기
  rationale: 본문은 배제의 기간을 세대 공식과 영속 표현으로 함께 말하므로, 해석적으로 하나로 환원하지 않고 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
