  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a slave who has escaped from his master to you[a].
  footnotes:
  - marker: a
    text: Or 'servant.' The Hebrew term can denote a servant or slave, but here 'slave' is used because the person's subjection to a master is central to the law.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 주인에게서 당신에게로 도망해 온 노예를 그 주인에게 넘겨주어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’. 히브리어 עֶבֶד는 종이나 노예를 가리킬 수 있습니다. 그러나 여기서는 주인에게 예속된 사람의 신분이 이 법의 핵심이므로 ‘노예’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַסְגִּיר
  english_pob_choice: You shall not hand over
  chosen_korean: 넘겨주어서는 안 됩니다
  alternatives_korean:
  - 인도해서는 안 됩니다
  - 넘겨서는 안 됩니다
  lexicon: HALOT
  rationale: הִפְעִיל형 סגר는 어떤 사람을 다른 이의 통제 아래로 넘기는 법적 행위를 가리키므로, 현대 한국어에서는 ‘넘겨주다’가 가장 자연스럽고 판결적 금지를 분명히 드러냅니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종사자
  lexicon: HALOT
  rationale: 본문은 도망해 온 사람이 주인의 소유·종속 관계에 놓여 있음을 말하지만, 한국어에서는 이 법문맥에서 ‘종’이 원문의 신분 종속성을 비교적 직접적으로 드러내면서도 지나치게 현대적 폭력 뉘앙스를 덜 띱니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 상전
  - 그의 주
  lexicon: HALOT
  rationale: 이 문맥의 אֲדֹן은 신적 칭호가 아니라 노예/종의 소유자를 뜻하므로, 관계를 분명히 하는 ‘주인’이 적절합니다.
- source_word: אֲשֶׁר יִנָּצֵל אֵלֶיךָ
  english_pob_choice: who has escaped from his master to you
  chosen_korean: 당신에게 피신해 온
  alternatives_korean:
  - 당신에게 도망쳐 온
  - 당신에게로 탈출해 온
  lexicon: HALOT
  rationale: נצל의 수동형은 여기서 ‘구출되다’보다 도망·탈주 상황을 가리키며, אֵלֶיךָ는 목적지 방향을 나타냅니다. 한국어에서는 ‘피신해 오다’가 도망하여 보호를 구해 온 뉘앙스를 비교적 잘 살립니다.
- source_word: מֵעִם אֲדֹנָיו
  english_pob_choice: from his master
  chosen_korean: 그의 주인에게서
  alternatives_korean:
  - 그의 주인 곁에서
  - 그의 주인으로부터
  lexicon: HALOT
  rationale: מֵעִם은 단순한 출발점이라기보다 ‘함께 있던 관계로부터의 이탈’을 보이므로, 한국어에서는 ‘~에게서’가 자연스럽게 그 분리를 표현합니다.
theological_decisions:
- issue: 도망해 온 종의 법적 보호
  chosen_reading: 본문은 도망한 종을 원 주인에게 돌려보내지 말라는 이스라엘 공동체의 금지로 읽었습니다.
  alternative_readings:
  - 사적인 망명 보호 규정으로 약화하여 읽기
  - 단순한 인도 의무로 완화하여 읽기
  rationale: 히브리어 동사와 문맥은 단순한 호의가 아니라 실제로 반환을 금지하는 법규를 말하므로, 본문의 강도를 약화하지 않도록 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §1; legal-ethical source fidelity
