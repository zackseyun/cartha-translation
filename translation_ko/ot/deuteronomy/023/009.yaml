  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'sons'; in this legal-genealogical context, the term refers to offspring or descendants more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'the third generation shall enter'; the Hebrew can be rendered more formally, but the sense is that admission is permitted beginning with the third generation.
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게서 태어난 자손은 삼 대째부터 야훼의 회중에 들어올 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנִים
  english_pob_choice: Children
  chosen_korean: 자손
  alternatives_korean:
  - 자녀
  - 아이들
  - 아들들
  lexicon: HALOT
  rationale: 이 법적·계보적 문맥에서는 남성 표지보다 후손 전체를 가리키는 뜻이 강하므로, 자연스러운 표준어로는 '자손'이 가장 근접합니다.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  english_pob_choice: born to them
  chosen_korean: 그들에게서 난
  alternatives_korean:
  - 그들에게서 태어난
  - 그들에게 난
  - 그들에게서 출생한
  lexicon: HALOT
  rationale: 수동형 '태어나다'의 의미를 한국어에서 간결하게 살리기 위해 '그들에게서 난'으로 옮겼습니다.
- source_word: דּוֹר שְׁלִישִׁי
  english_pob_choice: in the third generation
  chosen_korean: 삼대에 이르러서야
  alternatives_korean:
  - 세대째에
  - 세 번째 세대에
  - 삼대가 되어야
  lexicon: HALOT
  rationale: 허용 시점을 표시하는 법률적 표현이므로, 단순한 시간표시보다 조건적 뉘앙스를 드러내는 '이르러서야'를 택했습니다.
- source_word: בִּקְהַל יְהוָה
  english_pob_choice: assembly of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 집회
  - 야훼의 공동체
  - 여호와의 회중
  lexicon: HALOT
  rationale: קהל은 단순한 기관명보다 모인 공동체를 가리키므로 '회중'이 적절하며, יְהוָה는 본 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 문맥에서 신적 고유명을 직접 사용하므로, 제목 대체가 아닌 이름 자체를 보존하는 번역이 원문 효과를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בָּנִים의 범위
  chosen_reading: 자손
  alternative_readings:
  - 아들들
  - 자녀
  rationale: 이 절은 남성 자녀만이 아니라 계보상의 후손 전체를 다루는 법규이므로, 성별을 불필요하게 제한하지 않으면서도 혈통적 의미를 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
