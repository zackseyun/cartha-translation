review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the offspring/descendant sense of בָּנִים, the legal permission expressed by יָבֹא, and the divine name. However, 삼대에 이르러서야 is less precise and less natural than a formulation that directly marks admission beginning with the third generation.
  naturalness: 그들에게서 난 자손 and 야훼의 회중 are understandable and suitable for a formal biblical register. 삼 대째부터 is clearer standard Korean for the legal-genealogical threshold, and 태어난 is slightly more natural than 난 in this context.
  terminology: 자손 appropriately represents the genealogical scope without restricting the referent to males. 야훼 and 회중 are consistent with the stated project choices. No doctrinally loaded alteration is needed.
  issues:
  - severity: medium
    issue: 삼대에 이르러서야 does not express the generational admission threshold as directly as the Hebrew phrase does.
    rationale: דּוֹר שְׁלִישִׁי identifies the third generation as the point at which entry is allowed. In Korean, 삼 대째부터 clearly communicates permitted admission beginning in that generation, whereas 삼대에 이르러서야 can sound like an individual's eventual attainment of a third generation and is less idiomatic.
  revised_text: 그들에게서 태어난 자손은 삼 대째부터 야훼의 회중에 들어올 수 있습니다.
