id: DEU.23.10
reference: Deuteronomy 23:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
  footnotes:
  - marker: a
    text: Or 'every unclean thing' / 'anything improper.' The Hebrew phrase is broad and may include ritual impurity in this context without being limited to it.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 적군을 향하여 출정할 때에는, 모든 악한 것을 삼가십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 악한 것’은 ‘모든 부정한 것’ 또는 ‘모든 부적절한 것’으로도 옮길 수 있습니다. 히브리어 표현은 넓어서 이 문맥에서 의례적 부정함을 포함할 수 있지만, 그것만으로 제한되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: 'תֵצֵא / English: you go out'
  english_pob_choice: you go out
  chosen_korean: 출정할 때에는
  alternatives_korean:
  - 나갈 때에는
  - 출발할 때에는
  lexicon: HALOT
  rationale: 군사적 문맥에서 단순한 ‘나가다’보다 ‘출정하다’가 אויב들과의 전투 상황을 더 분명히 드러내면서도 원문의 이동 의미를 과도하게 확장하지 않습니다.
- source_word: 'מַחֲנֶה / English: as an army'
  english_pob_choice: as an army
  chosen_korean: 적군을 향하여
  alternatives_korean:
  - 군대가
  - 진영이
  lexicon: HALOT
  rationale: 히브리어 מַחֲנֶה는 여기서 ‘진영’ 자체보다 출정하는 군사 집단을 가리키므로, 한국어에서는 ‘적군을 향하여’로 옮겨 군사적 방향성과 대상을 자연스럽게 살렸습니다.
- source_word: 'דָּבָר רָע / English: every evil thing'
  english_pob_choice: every evil thing
  chosen_korean: 모든 악한 것
  alternatives_korean:
  - 모든 부정한 것
  - 모든 좋지 않은 것
  lexicon: HALOT
  rationale: POB의 본문처럼 כאן의 표현을 의례적 부정함으로만 좁히지 않고, 히브리어의 넓은 범위를 살려 ‘악한 것’으로 옮겼습니다.
- source_word: 'וְנִשְׁמַרְתָּ / English: then keep yourself'
  english_pob_choice: then keep yourself
  chosen_korean: 삼가십시오
  alternatives_korean:
  - 스스로를 지키십시오
  - 조심하십시오
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 가진 권고형을 현대 한국어 명령문으로 자연스럽게 옮기되, 단순한 주의가 아니라 스스로를 절제하며 지키라는 뜻을 반영했습니다.
theological_decisions:
- issue: דָּבָר רָע의 범위
  chosen_reading: ‘모든 악한 것’으로 넓게 유지하여, 이 절을 곧바로 의례적 부정함만으로 제한하지 않았습니다.
  alternative_readings:
  - 모든 부정한 것
  - 모든 부적절한 것
  rationale: 앞뒤 문맥이 진영의 거룩함과 정결 규례로 이어지지만, 본 절 자체의 표현은 더 넓으므로 번역에서 그 긴장을 보존하는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 원문 우선 원칙; 정결 규례의 맥락을 인정하되 번역에서 과도하게 해석하지 않음
