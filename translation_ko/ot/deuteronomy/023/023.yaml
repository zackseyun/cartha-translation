lexical_decisions:
- source_word: וְ/כִי
  english_pob_choice: But if
  chosen_korean: 그러나 …하면
  alternatives_korean:
  - 그리고 …하면
  - 하지만 …하면
  lexicon: HALOT
  rationale: 문맥상 앞 절의 서원 이행 명령과 대비되는 조건을 나타내므로, 한국어에서는 ‘그러나’로 대비를 살리고 ‘…하면’으로 조건을 자연스럽게 표현했습니다.
- source_word: תֶחְדַּל
  english_pob_choice: you refrain
  chosen_korean: 그치면
  alternatives_korean:
  - 중단하면
  - 자제하면
  - 서원하지 않으면
  lexicon: HALOT
  rationale: חדל의 핵심은 ‘그치다/중지하다’이므로, 여기서는 ‘서원하는 것을 그치면’으로 동작 자체를 멈추는 의미를 살렸습니다.
- source_word: לִנְדֹּר
  english_pob_choice: from making a vow
  chosen_korean: 서원하는 것을
  alternatives_korean:
  - 서원하는 일을
  - 맹세하는 것을
  lexicon: HALOT
  rationale: נדר는 제의적·법적 ‘서원’을 가리키므로 일반적인 ‘맹세’보다 ‘서원’을 유지하는 것이 원문의 용례를 더 정확히 반영합니다.
- source_word: חֵטְא
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 유죄
  - 허물
  lexicon: HALOT
  rationale: 문맥상 서원을 하지 않는 행위 자체가 दोष가 아니라는 뜻이므로, 한국어에서는 ‘죄’가 가장 직접적이고 넓게 원문의 도덕적·법적 부정을 전달합니다.
theological_decisions:
- issue: 서원하지 않는 행위의 도덕적 지위
  chosen_reading: 서원을 하지 않는 것은 그 자체로 죄가 아닙니다.
  alternative_readings:
  - 죄책이 없다는 법적 진술로만 좁게 볼 수 있습니다.
  - 죄보다 유죄성 부재를 강조하는 표현으로 이해할 수 있습니다.
  rationale: 히브리어 חטא는 ‘죄’와 ‘죄책/유죄’의 범위를 모두 가질 수 있지만, 본문은 서원을 하지 않을 자유를 허용하며 그 행위에 도덕적 잘못을 부여하지 않습니다. 본문은 이를 간결한 부정문으로 유지합니다.
  doctrine_reference: 신명기 23장의 서원 규정
