  source_fidelity: 히브리어 וְכִי תֶחְדַּל לִנְדֹּר는 앞 절과 대조하여 ‘서원하기를 삼가다/서원하지 않다’라는 조건을 나타냅니다. 초안의 ‘서원하는 것을 그치면’은 이미 하고 있는 서원 행위를 중단한다는 뜻으로도 읽혀, 본문의 ‘서원 자체를 하지 않음’이라는 의미를 충분히 분명히 하지 못합니다. ‘죄가 없을 것입니다’와 각주 ‘죄책’은 חֵטְא의 의미 범위와 בְּךָ의 귀속 표현을 적절히 반영합니다.
  naturalness: ‘서원하지 않으면’이 현대 표준어에서 간결하고 자연스러우며, 조건절과 합쇼체 미래 진술의 연결도 매끄럽습니다. ‘당신에게는’은 원문의 2인칭 단수 귀속을 드러내면서 한국어 문장에서도 수용 가능한 표현입니다.
  terminology: נדר는 ‘서원’으로 유지하는 것이 적절합니다. חֵטְא의 본문 번역은 ‘죄’, 각주의 대안은 ‘죄책’으로 제시하여 법적 책임의 뉘앙스를 보존합니다.
  issues:
