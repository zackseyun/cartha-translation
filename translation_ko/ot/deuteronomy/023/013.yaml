  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
  footnotes:
  - marker: a
    text: Hebrew 'hand' (yad); here likely an idiomatic use meaning a designated place or spot. Some translations render it more concretely as an implement or peg in light of the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너에게는 진 밖에, 진 바깥에 있을 자리가 있어야 하며, 너는 거기, 바깥으로 나가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야드’(yad)는 문자적으로는 ‘손’이지만, 여기서는 문맥상 지정된 장소나 지점을 가리키는 관용적 표현으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  english_pob_choice: place
  chosen_korean: 자리
  alternatives_korean:
  - 손
  - 곳
  - 장소
  lexicon: HALOT
  rationale: 직역의 ‘손’은 문맥에 맞지 않으므로, 지정된 위치를 뜻하는 관용적 용법을 살려 ‘자리’로 옮겼습니다.
- source_word: תִּהְיֶה לְךָ
  english_pob_choice: you shall have
  chosen_korean: 있어야 하며
  alternatives_korean:
  - 너에게 있을 것이다
  - 너는 가지게 될 것이다
  - 너에게 주어져야 하며
  lexicon: HALOT
  rationale: 히브리어의 존재·소유 표현을 한국어 명령문 맥락에 자연스럽게 반영하면서, 정해진 제공/배정의 뉘앙스를 살렸습니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진 밖에, 진 바깥에
  alternatives_korean:
  - 진 밖으로
  - 진 바깥으로
  - 진에서 멀리
  lexicon: HALOT
  rationale: ‘진’은 군사적/공동체적 진영을 가리키는 기본 표현으로 유지하고, 바깥 위치를 중복적으로 보여 주는 원문의 강조를 살렸습니다.
- source_word: וְיָצָאתָ שָׁמָּה חוּץ
  english_pob_choice: and you shall go out there, outside
  chosen_korean: 거기, 바깥으로 나가야 합니다
  alternatives_korean:
  - 거기 나가야 합니다
  - 그곳으로 나가야 합니다
  - 거기 밖으로 나가야 합니다
  lexicon: HALOT
  rationale: 동사의 이동 명령과 վերջ의 ‘바깥’ 강조를 함께 살리되, 현대 한국어에서 자연스럽게 읽히도록 정리했습니다.
theological_decisions:
- issue: 반복되는 ‘밖/바깥’ 표현의 처리
  chosen_reading: 원문의 중복 강조를 줄이지 않고 유지했습니다.
  alternative_readings:
  - ‘진 밖에’만 두고 뒤의 ‘바깥’은 생략
  - ‘밖으로 나가야 합니다’만 사용
  rationale: 이 구절은 위치를 두 번 강조하므로, 한국어에서도 반복을 유지해야 명령의 강도가 살아납니다.
  doctrine_reference: 본문의 수사적 강조 존중
