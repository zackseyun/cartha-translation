  source_fidelity: 히브리어의 모든 2인칭 접미사는 남성 단수(ךָ)입니다. 담화의 수신자가 이스라엘 공동체일 수는 있어도, 이 절의 번역에서는 이를 복수 ‘당신들’로 바꾸지 않고 단수 ‘너’를 유지해야 합니다. אָבָה의 의지·동의의 부정과 ‘저주를 복으로’ 바꾸신 의미는 보존되어야 합니다.
  naturalness: ‘너의 하나님 야훼께서는’과 ‘발람의 말을 들으려 하지 않으셨고’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 원문의 의지적 거절을 분명히 드러냅니다. ‘너에게 복이 되게’는 לְךָ를 매끄럽게 반영합니다.
  terminology: יְהוָה는 지침과 영어 POB를 따라 ‘야훼’로 유지합니다. בִּלְעָם은 표준 표기 ‘발람’, בְּרָכָה는 일반적 성서 용례인 ‘복’으로 옮깁니다.
  issues:
