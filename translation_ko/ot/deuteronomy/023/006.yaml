  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: ko
  text: 그러나 너의 하나님 야훼께서는 발람의 말을 들으려 하지 않으셨고,[a] 너의 하나님 야훼께서는 그 저주를 너에게 복이 되게 바꾸셨습니다. 이는 너의 하나님 야훼께서 너를 사랑하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָבָה는 단순한 부정이 아니라 ‘원하다’, ‘동의하다’라는 뜻을 지니며, 여기서는 야훼께서 발람의 말을 들으려 하지 않으셨다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ / אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 야훼 네 하나님
  - 주 당신들의 하나님
  lexicon: HALOT
  rationale: 여기서는 언약적 하나님의 이름 יְהוָה를 본문 그대로 살려 야훼로 옮기고, 2인칭 복수 문맥을 반영해 당신들의 하나님으로 자연스럽게 번역했습니다.
- source_word: אָבָה
  english_pob_choice: was not willing
  chosen_korean: 들으실 뜻이 없으셨고
  alternatives_korean:
  - 원치 않으셨고
  - 들으려 하지 않으셨고
  - 허락하지 않으셨고
  lexicon: HALOT
  rationale: אָבָה는 단순한 능력 부정이 아니라 의사·동의의 부정을 나타내므로, 발람의 말을 ‘들으실 뜻이 없으셨고’로 옮겨 뜻과 거절 의지를 함께 드러냈습니다.
- source_word: וַיַּהֲפֹךְ ... אֶת הַקְּלָלָה לִבְרָכָה
  english_pob_choice: turned the curse into a blessing
  chosen_korean: 그 저주를 당신들을 위한 복으로 바꾸셨습니다
  alternatives_korean:
  - 그 저주를 복으로 바꾸셨습니다
  - 저주를 축복으로 뒤바꾸셨습니다
  - 그 저주를 복으로 전환하셨습니다
  lexicon: HALOT
  rationale: הפך의 ‘뒤집다/바꾸다’ 의미를 살리되, 문맥상 결과가 ‘당신들을 위한 복’이 되었음을 드러내어 자연스럽게 옮겼습니다.
- source_word: אֲהֵבְךָ
  english_pob_choice: loved you
  chosen_korean: 당신들을 사랑하셨기 때문입니다
  alternatives_korean:
  - 여러분을 사랑하셨기 때문입니다
  - 너희를 사랑하셨기 때문입니다
  - 당신들을 사랑하셨기 때문입니다
  lexicon: HALOT
  rationale: אָהֵב의 기본 의미를 따라 covenantal love를 ‘사랑하셨기 때문입니다’로 직역에 가깝게 살렸고, 문맥상 이유 절로 자연스럽게 연결했습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 표기
  chosen_reading: 본절의 두 차례 יְהוָה를 모두 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  - LORD
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 대체 호칭보다 이름 자체를 드러내는 야훼를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
