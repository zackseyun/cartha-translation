  - 이스라엘의 아들들로부터
  - 이스라엘의 여자들 가운데
  - 이스라엘의 남자들 가운데
  lexicon: HALOT
  rationale: 히브리어의 מִן을 문자적으로 ‘~으로부터’로 살리기보다, 한국어에서 자연스럽고 법령체에 어울리는 ‘~가운데’로 옮겨 공동체 내부 금지를 분명히 했습니다. ‘딸들/아들들’의 대칭도 유지했습니다.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  english_pob_choice: There shall not be
  chosen_korean: ~가 있어서는 안 됩니다
  alternatives_korean:
  - ~이 있어서는 안 됩니다
  - ~가 있어서는 안 됩니다
  - ~이 존재해서는 안 됩니다
  lexicon: HALOT
  rationale: 법적 금지문의 존재사 용법을 살려, 지나치게 설명적이지 않으면서도 현대 한국어에서 자연스러운 금지 표현으로 옮겼습니다.
