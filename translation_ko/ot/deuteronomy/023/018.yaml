  rationale: 이 두 히브리어는 긍정적 의미의 ‘거룩한 사람’이 아니라 이방 제의와 결부된 성적 행위를 가리키는 기술어입니다. 한국어로는 그 종교적·성적 뉘앙스를 함께 드러내는 ‘창기’가 가장 직접적이지만, 본문의 제의적 성격을 보완하기 위해 각주를 붙였습니다.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the daughters of Israel / from the sons of Israel
