  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'temple prostitute.' The Hebrew terms are traditionally linked to illicit sexual activity connected with pagan worship; the more literal sense 'consecrated woman/man' is misleading in English here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 딸들 가운데에는 제의 성매매를 하는 여자[a]가 있어서는 안 되며, 이스라엘의 아들들 가운데에는 제의 성매매를 하는 남자[a]가 있어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 성매매자’. 이 히브리어 표현들은 전통적으로 이방 제의와 연관된 성행위를 하는 여자와 남자를 가리키는 것으로 이해됩니다. 이를 문자적으로 ‘성별된 여자/남자’로 옮기면 이 문맥의 뜻을 오해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה / קָדֵשׁ
  english_pob_choice: cult prostitute
  chosen_korean: 창기
  alternatives_korean:
