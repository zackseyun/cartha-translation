  chosen_reading: 이 표현은 가나안계 이방 제의와 연결된 성적 행위를 하는 남녀를 가리키는 것으로 보고, 단순한 일반적 음행보다 더 구체적인 제의적 금지를 반영했습니다.
  alternative_readings:
