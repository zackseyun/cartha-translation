  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'temple prostitute.' The Hebrew terms are traditionally linked to illicit sexual activity connected with pagan worship; the more literal sense 'consecrated woman/man' is misleading in English here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 딸들 가운데에는 창기[a]가 있어서는 안 되며, 이스라엘의 아들들 가운데에도 창기[a]가 있어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 매춘부’. 히브리어 표현은 전통적으로 이방 제의와 연결된 불법적 성행위를 가리키며, 문자적으로 ‘성별된 여자/남자’로 옮기면 뜻이 오해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה / קָדֵשׁ
  english_pob_choice: cult prostitute
  chosen_korean: 창기
  alternatives_korean:
  - 성별된 여자
  - 성전 창기
  - 성전 매춘부
  lexicon: HALOT
  rationale: 이 두 히브리어는 긍정적 의미의 ‘거룩한 사람’이 아니라 이방 제의와 결부된 성적 행위를 가리키는 기술어입니다. 한국어로는 그 종교적·성적 뉘앙스를 함께 드러내는 ‘창기’가 가장 직접적이지만, 본문의 제의적 성격을 보완하기 위해 각주를 붙였습니다.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the daughters of Israel / from the sons of Israel
  chosen_korean: 이스라엘의 딸들 가운데 / 이스라엘의 아들들 가운데
  alternatives_korean:
  - 이스라엘의 딸들로부터
  - 이스라엘의 아들들로부터
  - 이스라엘의 여자들 가운데
  - 이스라엘의 남자들 가운데
  lexicon: HALOT
  rationale: 히브리어의 מִן을 문자적으로 ‘~으로부터’로 살리기보다, 한국어에서 자연스럽고 법령체에 어울리는 ‘~가운데’로 옮겨 공동체 내부 금지를 분명히 했습니다. ‘딸들/아들들’의 대칭도 유지했습니다.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  english_pob_choice: There shall not be
  chosen_korean: ~가 있어서는 안 됩니다
  alternatives_korean:
  - ~이 있어서는 안 됩니다
  - ~가 있어서는 안 됩니다
  - ~이 존재해서는 안 됩니다
  lexicon: HALOT
  rationale: 법적 금지문의 존재사 용법을 살려, 지나치게 설명적이지 않으면서도 현대 한국어에서 자연스러운 금지 표현으로 옮겼습니다.
theological_decisions:
- issue: קְדֵשָׁה / קָדֵשׁ의 의미 범위
  chosen_reading: 이 표현은 가나안계 이방 제의와 연결된 성적 행위를 하는 남녀를 가리키는 것으로 보고, 단순한 일반적 음행보다 더 구체적인 제의적 금지를 반영했습니다.
  alternative_readings:
  - 일반적인 성적 부정행위자
  - 중립적 의미의 ‘성별된 사람’
  rationale: 문맥상 이 용어들은 긍정적 헌신이 아니라 우상숭배와 결부된 관습을 겨냥합니다. 한국어 번역에서도 그 제의적 요소가 흐려지지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; documented lexical tension preserved.'
