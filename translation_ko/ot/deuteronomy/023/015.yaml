  naturalness: 합쇼체 문체와 문장 연결은 자연스럽습니다. ‘그분이 … 보시고 … 돌아서시는 일이 없도록’은 원문의 목적·결과 관계를 자연스럽고 명료하게 드러냅니다.
  terminology: ‘야훼’, ‘거룩’, ‘진영’은 일관되고 적절합니다. ‘부정한 것’은 원문의 포괄적 수치·불미스러운 사안을 의례적 부정으로 다소 좁힐 수 있어 ‘수치스러운 일’로 조정했습니다. 각주 표지는 해당 표현 바로 뒤에 배치해야 합니다.
