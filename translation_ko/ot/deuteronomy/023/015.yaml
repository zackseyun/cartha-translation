  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
  footnotes:
  - marker: a
    text: Or, more literally, 'to give your enemies before you.' The Hebrew idiom means to hand them over into your power.
    reason: lexical_alternative
  - marker: b
    text: Or 'some indecent matter.' The Hebrew expression is broad and can refer to anything shameful or unclean that would defile the camp.
    reason: lexical_alternative
  - marker: c
    text: Or 'turn away from you.' More literally, 'turn back from behind you,' picturing the LORD no longer accompanying the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희 하나님 야훼께서 너희 진영 가운데를 거니시며 너희를 구해 내시고 너희의 원수들을 너희 앞에 넘겨 주시기 때문입니다[a]. 그러므로 너희 진영은 거룩해야 하며[b][c], 그분이 너희 가운데서 부정한 것을 보시고 너희를 떠나지 않으시게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너희 앞에’입니다. 히브리어 관용구는 원수들을 너희의 권세 아래 넘겨 주는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어떤 부정한 일/것’입니다. 이 표현은 진영을 더럽히는 수치스럽거나 부정한 행위를 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그분이 너희 뒤에서 돌아서지 않게/떠나지 않게’입니다. 야훼께서 더 이상 진영을 동행하지 않으시는 그림을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 여호와가 아니라 학술적 표기인 야훼를 사용해 언약적 하나님의 이름을 직접 드러냅니다.
- source_word: מִתְהַלֵּךְ
  english_pob_choice: walks
  chosen_korean: 거니시며
  alternatives_korean:
  - 다니시며
  - 걸으시며
  lexicon: HALOT
  rationale: ‘walks’의 구체적·인격적 이미지를 살리기 위해, 단순한 존재 진술보다 동작성을 드러내는 ‘거니시며’를 택했습니다.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  english_pob_choice: to give your enemies before you
  chosen_korean: 너희의 원수들을 너희 앞에 넘겨 주시고
  alternatives_korean:
  - 너희의 원수들을 너희 앞에 주시고
  - 너희 원수들을 너희 손에 넘기시고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘앞에 두다/주다’ 구조를 살리되, 한국어에서는 결과를 분명히 하기 위해 ‘넘겨 주시고’로 옮겼습니다.
- source_word: עֶרְוַת דָּבָר
  english_pob_choice: anything indecent
  chosen_korean: 부정한 것
  alternatives_korean:
  - 음란한 것
  - 수치스러운 일
  - 부정한 일
  lexicon: HALOT
  rationale: 문맥상 진영의 정결을 더럽히는 폭넓은 부정함을 가리키므로, 육체적 노출만으로 좁히지 않는 ‘부정한 것’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 동행을 나타내는 신인동형적 표현
  chosen_reading: ‘진영 가운데를 거니시며’의 구체적 표현을 유지했습니다.
  alternative_readings:
  - ‘너희 진영에 임재하시며’처럼 추상화하는 읽기
  rationale: 본문은 하나님의 임재를 이동 이미지로 제시해 진영의 거룩함 요구를 강조하므로, 그 긴장을 약화시키지 않도록 직접적인 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 거룩함의 규범적 힘
  chosen_reading: ‘거룩해야 하며’로 의무성을 드러냈습니다.
  alternative_readings:
  - ‘거룩할 것이다’처럼 미래형으로 옮기는 읽기
  rationale: 문맥상 예언보다 규정의 성격이 분명하므로, 진영이 실제로 지켜야 할 상태라는 점을 한국어에서 명확히 했습니다.
  doctrine_reference: Translation philosophy §6
