source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
  footnotes:
  - marker: a
    text: Or, 'you will be guilty of sin.' The Hebrew literally says, 'it will be sin in you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 당신의 하나님 야훼께 서원하면, 그 서원을 이행하기를 지체해서는 안 됩니다. 야훼, 당신의 하나님께서 반드시 그것을 당신에게 요구하실 것이며, 당신에게 죄가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신은 죄책을 지게 될 것입니다.” 히브리어는 문자적으로 “그것이 당신에게 죄가 될 것이다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But if
  chosen_korean: 하지만 … 하면
  alternatives_korean:
  - 만약 … 하면
  - 그러나 … 하면
  lexicon: HALOT
  rationale: 문맥상 이전 절의 ‘서원하지 않는 것’과 대비되는 조건절이므로, 한국어에서는 ‘하지만’으로 약한 대조와 조건을 함께 살렸습니다.
- source_word: תִדֹּר נֶדֶר
  english_pob_choice: you make a vow
  chosen_korean: 서원하면
  alternatives_korean:
  - 서원하시면
  - 서원을 하면
  - 서원을 드리면
  lexicon: HALOT
  rationale: נדר의 동사+동족목적어 관용구는 한국어에서 자연스럽게 ‘서원하다/서원하면’으로 옮기는 것이 가장 직접적입니다.
- source_word: לְשַׁלְּמוֹ
  english_pob_choice: in paying it
  chosen_korean: 그것을 갚는 일
  alternatives_korean:
  - 그것을 이행하는 일
  - 그것을 이루는 일
  - 그것을 바치는 일
  lexicon: HALOT
  rationale: 서원 이행의 구체적 부담을 살리기 위해 ‘갚다’를 택했습니다. 한국어에서 서원은 단순한 추상적 ‘이행’보다 ‘갚다/갚는 것’이 의무적 성격을 더 잘 드러냅니다.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  english_pob_choice: will surely require it
  chosen_korean: 반드시 당신에게서 그것을 요구하실 것이며
  alternatives_korean:
  - 반드시 그것을 요구하실 것이며
  - 꼭 그것을 찾으실 것이며
  - 엄정하게 그것을 물으실 것이며
  lexicon: HALOT
  rationale: 강조형 용법을 ‘반드시’로 풀어 주고, משפט적 문맥에 맞는 ‘요구하다’로 옮겨 언약적 책임을 분명하게 했습니다.
- source_word: וְהָיָה בְךָ חֵטְא
  english_pob_choice: and it will be sin in you
  chosen_korean: 그것은 당신에게 죄가 될 것입니다
  alternatives_korean:
  - 당신 안에 죄가 있을 것입니다
  - 당신에게 죄책이 있을 것입니다
  - 당신은 죄를 짓게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 한국어에서 자연스럽게 풀되, POB의 주석이 지적한 ‘죄가 너에게 있다’는 문법적 긴장을 유지하기 위해 직설적으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 여호와 신명(יהוה)을 직접 포함하므로, 프로젝트 기본 원칙에 따라 언약명칭을 ‘야훼’로 옮겨 מקור의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
