  rationale: 서원의 목적어를 ‘그 서원’으로 명시하고, ‘갚다’를 ‘이행하다’로 바꾸어 שׁלם의 문맥적 의미와 자연스러운 현대 한국어 용법을 함께 살렸습니다. 나머지 문장은 원문의 조건성, 강조, 그리고 죄책 결과를 유지합니다.
