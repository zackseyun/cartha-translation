source:
  edition: WLC
  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
  footnotes:
  - marker: a
    text: Or 'shall dwell with you ... where it seems best to him.'
    reason: lexical_alternative
  - marker: b
    text: '''Within one of your gates'' is a Hebrew idiom referring to settlement within one of your towns or communities.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 당신들과 함께, 당신들의 한가운데에, 그가 당신들의 한 성문 안에서 택하는 곳에 살아야 합니다. 그가 좋아하는 곳에서 말입니다. 당신은 그를 압제해서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 히브리어 관용으로, 실제 성문만이 아니라 도시나 공동체의 거주 구역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘그가 좋아하는 곳’은 문자적으로 ‘그에게 좋은 곳’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  english_pob_choice: shall live
  chosen_korean: 살아야 합니다
  alternatives_korean:
  - 거주해야 합니다
  - 살아 있어야 합니다
  lexicon: HALOT
  rationale: 정주를 뜻하는 ישב의 지속적 거주 의미를 살리되, 현대 한국어에서는 ‘살다’가 가장 자연스럽게 법문맥의 계속적 거주를 전달합니다.
- source_word: בְּקִרְבְּךָ
  english_pob_choice: in your midst
  chosen_korean: 당신들의 한가운데에
  alternatives_korean:
  - 당신들 가운데에
  - 당신들 가운데서
  lexicon: HALOT
  rationale: 공동체 내부라는 공간적 이미지를 살리기 위해 직역적이면서도 자연한 ‘한가운데에’를 택했습니다.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  english_pob_choice: within one of your gates
  chosen_korean: 당신들의 한 성문 안에서
  alternatives_korean:
  - 당신들의 성문들 가운데 한 곳에서
  - 당신들의 마을 안에서
  lexicon: HALOT
  rationale: ‘성문’은 도시/공동체를 가리키는 히브리어 관용을 보존하면서, 장소성은 ‘안에서’로 풀어 한국어에서 이해되게 했습니다.
- source_word: לֹא תּוֹנֶנּוּ
  english_pob_choice: you shall not oppress him
  chosen_korean: 그를 압제해서는 안 됩니다
  alternatives_korean:
  - 그를 학대해서는 안 됩니다
  - 그를 괴롭혀서는 안 됩니다
  lexicon: HALOT
  rationale: 윤리적·사회적 강도가 있는 ינה의 법적 금지를 반영해 ‘압제하다’를 선택했습니다. ‘학대하다’보다 제도적/경제적 억압의 뉘앙스가 더 잘 드러납니다.
theological_decisions:
- issue: 반복되는 2인칭 복수 대상과 남성 단수 지시
  chosen_reading: 히브리어의 2인칭 복수 접미사와 남성 단수 목적대명사를 그대로 반영해, 공동체 전체를 향한 명령이면서도 대상자는 앞절의 특정 개인임을 유지했습니다.
  alternative_readings:
  - 대상을 일반화하여 ‘그들’로 바꾸는 방식
  - 성별 중립적으로 흐리는 방식
  rationale: 법문맥의 정확성을 위해 문법적 복수/단수를 지우지 않고, 앞절과의 연속성을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
