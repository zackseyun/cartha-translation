reference: Deuteronomy 23:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י תָבֹא֙ בְּ/כֶ֣רֶם רֵעֶ֔/ךָ וְ/אָכַלְתָּ֧ עֲנָבִ֛ים כְּ/נַפְשְׁ/ךָ֖ שָׂבְעֶ֑/ךָ וְ/אֶֽל כֶּלְיְ/ךָ֖ לֹ֥א תִתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
  footnotes:
  - marker: a
    text: Or 'If you enter your neighbor’s vineyard.' The Hebrew particle can introduce either a temporal or conditional clause; 'when' is chosen as the smoother fit in this legal context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'according to your soul, your satisfaction,' an idiom meaning according to your desire or appetite, up to being satisfied.
    reason: lexical_alternative
  - marker: c
    text: Or 'vessel.' The Hebrew term is general and does not specify the kind of container.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 이웃의 포도원에 들어갈 때에는[a] 네가 원하는 만큼, 배부를 때까지 포도를 먹을 수 있습니다[b]. 그러나 네 용기에는 포도를 담아서는 안 됩니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 이웃의 포도원에 들어가면’. 히브리어 כִּי는 여기서 시점을 나타낼 수도, 조건을 나타낼 수도 있습니다. 이 법문 맥락에서는 ‘들어갈 때에는’이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘네 자신(욕구)에 따라, 네 배부름까지’입니다. 이는 원하는 만큼 먹되 배부를 때까지 먹는다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그릇’. 히브리어 כְּלִי는 특정한 종류의 용기를 밝히지 않는 일반어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  english_pob_choice: When you enter
  chosen_korean: 들어갈 때에는
  alternatives_korean:
  - 들어가면
  - 만약 들어가면
  lexicon: HALOT
  rationale: כִּי는 이 문맥에서 조건이라기보다 법률 조항의 상황 도입으로 읽는 것이 자연스럽습니다. ‘들어갈 때에는’은 POB의 ‘When’을 살리면서 한국어 법조문 흐름을 유지합니다.
- source_word: בְּכֶרֶם רֵעֶךָ
  english_pob_choice: your neighbor’s vineyard
  chosen_korean: 네 이웃의 포도원
  alternatives_korean:
  - 네 이웃의 포도밭
  - 네 동무의 포도원
  lexicon: HALOT
  rationale: כֶּרֶם은 분명히 포도원을 뜻하므로 ‘포도원’이 적합합니다. רֵעַ는 여기서 ‘이웃’이 가장 자연스럽고, 소유격으로 옮겨 관계를 분명히 했습니다.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  english_pob_choice: as your appetite desires, until you are satisfied
  chosen_korean: 네 마음이 원하는 만큼 … 배부를 때까지
  alternatives_korean:
  - 네 욕구대로 … 만족할 때까지
  - 네 식욕이 이끄는 대로 … 배부를 때까지
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 영혼의 의미가 아니라 욕구/식욕을 가리키는 관용구입니다. ‘마음이 원하는 만큼’은 자연스럽게 욕구의 범위를 살리면서도 과도한 해석을 피합니다.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  english_pob_choice: you shall not put any into your container
  chosen_korean: 네 그릇에는 담아서는 안 됩니다
  alternatives_korean:
  - 네 용기에는 넣어서는 안 됩니다
  - 네 그릇에 담아서는 안 됩니다
  lexicon: HALOT
  rationale: כְּלִי는 특정 용기 종류를 밝히지 않는 일반어이므로 ‘그릇’으로 넓게 옮겼습니다. לֹא תִתֵּן은 여기서 ‘넣다/담다’의 의미로 자연스럽게 이해되므로 ‘담아서는 안 됩니다’가 적절합니다.
theological_decisions:
- issue: 먹을 수 있는 허용과 저장 금지의 대비
  chosen_reading: 이 구절은 이웃의 포도원에서 즉석 소비는 허용하되, 소지·축적은 금지하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 관대함의 권고로 약하게 읽기
  - 포도원 주인의 묵시적 동의가 전제된 임시 허용으로만 읽기
  rationale: 히브리어는 허용된 소비의 범위를 ‘배부를 때까지’로 분명히 하면서도 ‘네 그릇에는 담아서는 안 된다’로 경계를 분명히 합니다. 따라서 허용과 제한의 긴장을 모두 보존하는 것이 본문의 법적 의도를 잘 드러냅니다.
  doctrine_reference: 신 23:25의 토지·수확 규례
- issue: כִּי의 조건/시점 뉘앙스
  chosen_reading: ‘들어갈 때에는’으로 옮겨, 조건문이면서도 예상되는 상황을 전제하는 법률 문체를 살렸습니다.
  alternative_readings:
  - ‘만약 네가 들어가면’으로 조건을 더 강하게 드러내기
  - ‘네가 들어갈 때’로 단순 시점 표현만 택하기
  rationale: 원문은 실제로 발생할 수 있는 상황을 전제하는 casuistic 법문 형태입니다. 한국어에서도 조건성과 상황성을 함께 살리는 표현이 가장 균형적입니다.
  doctrine_reference: 신명기 법문체
