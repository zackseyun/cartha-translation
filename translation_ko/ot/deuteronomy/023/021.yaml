base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
  footnotes:
  - marker: a
    text: Or 'lend at interest' / 'exact interest'; older English often has 'usury.'
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' here means a fellow member of Israel; the Hebrew keeps the familial term.'
    reason: cultural_note
translation:
  language: ko
  text: 외국인에게는 이자를 받을 수 있습니다.[a] 그러나 네 형제에게서는 이자를 받지 마십시오.[b] 그리하면 네가 들어가 차지하려는 땅에서 네 손으로 하는 모든 일에 네 하나님 야훼께서 네게 복을 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외국인’은 여기서 이스라엘 공동체 밖의 사람을 가리킵니다. 히브리어는 ‘낯선 사람’ 또는 ‘외부인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 혈육만이 아니라, 이 문맥에서는 이스라엘 동족을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי / לְאָחִיךָ
  english_pob_choice: to a foreigner / to your brother
  chosen_korean: 외국인 / 당신의 형제
  alternatives_korean:
  - 나그네 / 동족
  - 이방인 / 형제자
  lexicon: HALOT
  rationale: נָכְרִי는 언약 공동체 밖의 외국인을 가리키며, אָחִיךָ는 문자적으로는 '형제'이지만 이 율법 문맥에서는 이스라엘 동족을 뜻하므로 그 가족어를 살렸습니다.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  english_pob_choice: charge interest / shall not charge interest
  chosen_korean: 이자를 받을 수 있으나 / 이자를 받지 마십시오
  alternatives_korean:
  - 이자를 매길 수 있으나 / 이자를 매기지 마십시오
  - 고리대를 받을 수 있으나 / 고리대를 받지 마십시오
  lexicon: HALOT
  rationale: נשך의 히필은 이자 부과를 뜻하므로, 현대 한국어에서 자연스럽고 법 조항의 대비를 살리는 '이자를 받다'로 옮겼습니다.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  english_pob_choice: in all the work of your hand
  chosen_korean: 당신의 손으로 하는 모든 일
  alternatives_korean:
  - 당신의 손의 모든 일
  - 당신이 손을 대는 모든 일
  - 당신의 손이 하는 모든 일
  lexicon: HALOT
  rationale: 직역의 손 이미지를 유지하되 현대 독자가 이해할 수 있도록 관용적 표현으로 다듬었습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 당신의 하나님 여호와
  - 야훼 당신의 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 여호와 대신 야훼를 사용하여 언약 নাম을 직접 드러냈습니다.
theological_decisions:
- issue: 형제에게 이자를 금하는 언약법의 범위
  chosen_reading: '''형제''를 이스라엘 공동체의 동족으로 유지하고, 외국인과의 대비를 분명히 했습니다.'
  alternative_readings:
  - '''형제''를 일반적 친족 의미로 축소'
  - '''동족''으로 풀어 공동체 범위를 명시'
  rationale: 히브리어 אָחִיךָ는 문맥상 언약 공동체 내부의 이스라엘 사람을 가리키므로, 가족어를 보존하되 주석 없이도 오해를 줄이도록 번역했습니다.
  doctrine_reference: 언약 공동체와 율법의 대상 범위
