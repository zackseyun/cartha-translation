base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
  footnotes:
  - marker: a
    text: Or 'the utterance of your lips' or 'what proceeds from your lips.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a voluntary offering.' The Hebrew term refers to an offering given freely rather than under compulsion.
    reason: lexical_alternative
translation:
  language: ko
  text: 입에서 나온 것은 지키고 그대로 행해야 합니다[a]. 곧 야훼 당신의 하나님께 서원한 대로, 자원제물로 드리기로 입으로 말한 것을 행해야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘입술에서 나온 말’ 혹은 ‘입술에서 나온 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자원제사’로도 옮길 수 있습니다. 이 히브리어는 강요가 아니라 자발적으로 드리는 예물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָ֥א שְׂפָתֶ֖י/ךָ
  english_pob_choice: what has gone out from your lips
  chosen_korean: 입에서 나온 것
  alternatives_korean:
  - 입술에서 나온 것
  - 입에서 나온 말
  - 입술의 말
  lexicon: HALOT
  rationale: מוֹצָא의 ‘나오다/나온 것’이라는 구체적 이미지를 살리면서, 한국어에서는 자연스럽게 ‘입에서 나온 것’으로 옮겨 서원 발화의 실재성을 드러냈습니다.
- source_word: תִּשְׁמֹ֣ר וְ/עָשִׂ֑יתָ
  english_pob_choice: you shall keep ... and do it
  chosen_korean: 지키고 그대로 행해야 합니다
  alternatives_korean:
  - 지켜야 하며 행해야 합니다
  - 지키고 실행해야 합니다
  - 지켜야 하고 행해야 합니다
  lexicon: HALOT
  rationale: שׁמר와 עשה의 병렬을 따라 ‘지키다’와 ‘행하다’를 유지하되, 한국어에서는 서원 준수를 강조하는 표현으로 매끄럽게 연결했습니다.
- source_word: לַ/יהוָ֤ה אֱלֹהֶ֨י/ךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께
  alternatives_korean:
  - 야훼 네 하나님께
  - 주 당신의 하나님께
  - 여호와 당신의 하나님께
  lexicon: HALOT
  rationale: 원문의 신명기적 언약명 יְהוָה를 따라 ‘야훼’를 사용했고, 대화적 직접 호칭의 현대 한국어에서 ‘당신의 하나님’으로 맞췄습니다.
- source_word: נְדָבָ֔ה
  english_pob_choice: as a freewill offering
  chosen_korean: 자원제물로
  alternatives_korean:
  - 자원제사로
  - 기쁜 마음의 제물로
  - 자발적 제물로
  lexicon: HALOT
  rationale: נְדָבָה는 강제되지 않은 자원성 있는 봉헌을 가리키므로, 제의적 문맥을 살려 ‘자원제물’로 옮겼습니다.
- source_word: בְּ/פִֽי/ךָ
  english_pob_choice: with your mouth
  chosen_korean: 입으로 말한
  alternatives_korean:
  - 당신의 입으로
  - 입으로 한
  - 입으로 말해
  lexicon: HALOT
  rationale: 입의 발화를 반복해 강조하는 표현을 반영하여 ‘입으로 말한’으로 옮겨, 앞의 ‘입에서 나온 것’과 대응시키고자 했습니다.
