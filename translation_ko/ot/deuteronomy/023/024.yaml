    text: 또는 ‘입술에서 나온 말’ 혹은 ‘입술에서 나온 것’으로 옮길 수 있습니다. ‘자원 예물’은 강요가 아니라 자발적으로 드리는 예물을 가리킵니다.
    reason: lexical_alternative
