translation:
  language: ko
  text: 사람은 아버지의 아내를 취해서는 안 되며, 아버지의 덮개를 드러내서도 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘아버지의 아내를 아내로 맞다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아버지의 덮개를 드러내다’입니다. 이 표현은 성적 완곡어법입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִקַּח אִישׁ
  english_pob_choice: A man shall not take
  chosen_korean: 사람은 … 취해서는 안 됩니다
  alternatives_korean:
  - 남자는 … 데려가서는 안 됩니다
  - 사람은 … 아내로 맞아서는 안 됩니다
  lexicon: HALOT
  rationale: יִקַּח는 아내와 함께 쓰일 때 결혼적 ‘취하다/데려오다’의 뜻을 가질 수 있어, ‘취하다’로 옮겨 원문의 간결한 금지형을 살렸습니다.
- source_word: אֵשֶׁת אָבִיו
  english_pob_choice: his father’s wife
  chosen_korean: 아버지의 아내
  alternatives_korean:
  - 아버지의 아내
  - 아버지의 계모
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지의 아내’이므로, 관계를 직접 드러내는 표현을 택했고 ‘계모’는 해석을 더한 말이라 본문에는 두지 않았습니다.
- source_word: וְלֹא יְגַלֶּה
  english_pob_choice: nor uncover
  chosen_korean: 드러내서도 안 됩니다
  alternatives_korean:
  - 벗겨서도 안 됩니다
  - 노출해서도 안 됩니다
  lexicon: HALOT
  rationale: יְגַלֶּה는 성적·법적 완곡어법으로 ‘드러내다/벗기다’의 뜻을 띠므로, 한국어에서도 직접적이면서도 완곡한 ‘드러내다’를 사용했습니다.
- source_word: כְּנַף אָבִיו
  english_pob_choice: his father’s skirt / covering
  chosen_korean: 아버지의 덮개
  alternatives_korean:
  - 아버지의 옷자락
  - 아버지의 치마
  - 아버지의 스커트
  lexicon: HALOT
  rationale: כְּנַף는 본뜻이 ‘날개, 가장자리, 옷자락’이지만 여기서는 성적 완곡어법으로 기능하므로, 현대 한국어에서 오해를 줄이면서도 은유를 남기는 ‘덮개’를 택했습니다.
theological_decisions:
- issue: 성적 완곡어법을 본문에서 얼마나 드러낼지
  chosen_reading: 본문에서는 은유를 유지하고, 의미는 ‘드러내다/덮개’의 구조로 전달했습니다.
  alternative_readings:
  - 아버지의 벌거벗음/알몸을 드러내다
  - 아버지의 혼인 침상을 더럽히다
  rationale: 히브리어는 노골적 표현보다 완곡어법을 사용하므로, 본문에서 이를 너무 풀어 쓰지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
