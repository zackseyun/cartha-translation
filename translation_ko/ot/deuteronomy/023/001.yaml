  verdict: revise
  source_fidelity: 히브리어의 금지 구조와 ‘아버지의 아내’라는 관계 표현은 대체로 충실히 옮겼습니다. 다만 כְּנַף는 여기서 ‘덮개’보다 ‘옷자락/옷의 가장자리’라는 구체적 은유를 보존하는 편이 어휘적으로 더 정확합니다. ‘들추다’는 יְגַלֶּה의 ‘벗기다/드러내다’라는 행위를 자연스럽게 나타내면서 성적 완곡어법도 유지합니다.
  naturalness: ‘사람은’은 원문의 남성 단수 אִישׁ을 중성화하므로 ‘남자는’이 더 직접적입니다. 또한 ‘아버지의 덮개를 드러내다’는 현대 한국어에서 무엇을 뜻하는지 지나치게 불분명하고 부자연스럽습니다. ‘아버지의 옷자락을 들추다’는 은유를 보존하면서도 자연스럽습니다.
  terminology: ‘아버지의 아내’는 ‘계모’보다 원문에 가깝고 유지하는 것이 적절합니다. ‘취하다’는 법문·문어체에 가능한 표현이며, 각주에서 ‘아내로 맞다’라는 관용적 대안을 제시할 수 있습니다. 성적 의미는 본문에서 과도하게 해설하지 않고 각주에서 완곡어법임을 밝힙니다.
  issues:
