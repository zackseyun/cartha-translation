    rationale: כְּנַף는 본래 날개·끝·옷자락을 뜻하며, 이 문맥의 성적 완곡어법은 옷자락이라는 은유를 통해 유지할 수 있습니다. ‘덮개’는 원문의 의복 가장자리 이미지를 흐립니다.
  - severity: low
