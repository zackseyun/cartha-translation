revisions:
- from: 음행한 여인의 삯이나 개의 값을 여러분의 하나님 야훼의 집에 어떤 서원[a]을 위해서도 가져와서는 안 됩니다. 그 둘은 모두 여러분의 하나님 야훼께 가증한 것이기 때문입니다.
  to: 매춘부의 삯이나 개의 값을 여러분의 하나님 야훼의 집에 어떤 서원을 위해서라도 가져와서는 안 됩니다[a]. 이 둘 모두는 여러분의 하나님 야훼께 가증한 것이기 때문입니다.
  rationale: 본문은 히브리어의 문자적 표현인 ‘개의 값’을 유지하고, 논쟁적인 대안 해석은 각주로 제한했습니다. ‘매춘부의 삯’으로 고쳐 원문의 직업적·금전적 의미를 명확히 했습니다. 각주 표지는 제공된 영어 POB 감사 기록의 위치를 보존했습니다.
