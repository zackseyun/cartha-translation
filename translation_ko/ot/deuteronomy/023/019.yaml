id: DEU.23.19
reference: Deuteronomy 23:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
  footnotes:
  - marker: a
    text: Or possibly, 'the price of a male prostitute,' if 'dog' is understood here as a derogatory term for a male cult prostitute.
    reason: alternative_reading
translation:
  language: ko
  text: 음행한 여인의 삯이나 개의 값을 여러분의 하나님 야훼의 집에 어떤 서원[a]을 위해서도 가져와서는 안 됩니다. 그 둘은 모두 여러분의 하나님 야훼께 가증한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남창의 삯’으로도 옮길 수 있습니다. ‘개’가 남성 성전매춘을 가리키는 경멸적 말일 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  english_pob_choice: bring
  chosen_korean: 가져오다
  alternatives_korean:
  - 가져오지 않다
  - 들여오다
  lexicon: HALOT
  rationale: 금지의 구체적 동작을 자연스러운 현대 한국어로 옮기되, 제의 공간 안으로 ‘bring’하는 의미를 살리기 위해 ‘가져오다’를 선택했습니다.
- source_word: אֶתְנַן זוֹנָה
  english_pob_choice: the wages of a prostitute
  chosen_korean: 음행한 여인의 삯
  alternatives_korean:
  - 창기의 삯
  - 몸을 판 여인의 삯
  lexicon: HALOT
  rationale: זוֹנָה의 성격을 노골적으로 드러내는 직역을 유지하되, 한국어에서 지나치게 설명적으로 흐르지 않도록 ‘음행한 여인’으로 옮겼습니다.
- source_word: מְחִיר כֶּלֶב
  english_pob_choice: the price of a dog
  chosen_korean: 개의 값
  alternatives_korean:
  - 개의 가격
  - 개값
  - 남창의 삯
  lexicon: HALOT
  rationale: 본문의 어휘형을 따라 ‘개’를 유지해 영어 POB가 보존한 해석상의 긴장을 한국어에서도 살렸습니다. ‘남창’ 해석은 본문 주석에서만 다루는 편이 좋습니다.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the house of Yahweh your God
  chosen_korean: 여러분의 하나님 야훼의 집
  alternatives_korean:
  - 여러분의 하나님 야훼의 성전
  - 여러분의 하나님 여호와의 집
  lexicon: HALOT
  rationale: 직역 구조를 살려 ‘집’을 유지하고, 신명기의 문맥에 맞게 성전으로 구체화하지 않았습니다. 또한 YHWH는 본문 지침에 따라 야훼로 옮겼습니다.
- source_word: לְכָל נֶדֶר
  english_pob_choice: for any vow
  chosen_korean: 어떤 서원을 위해서도
  alternatives_korean:
  - 어떤 서원에 대하여도
  - 서원 제물로
  lexicon: HALOT
  rationale: ‘for any vow’의 목적/용도를 자연스럽게 드러내는 표현으로 옮겼으며, 본문에 없는 ‘제물’은 덧붙이지 않았습니다.
- source_word: תוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 가증스러운 것
  - 역겨운 것
  lexicon: HALOT
  rationale: 법문에서 반복되는 강한 평가어를 한국어 성서체의 대표 표현인 ‘가증한 것’으로 옮겨, 도덕적·제의적 혐오의 강도를 보존했습니다.
theological_decisions:
- issue: YHWH의 음역
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 제공된 번역 원칙에 따라 신명기의 언약명은 ‘야훼’로 표기하여, 일반 호칭 ‘주’와 구별했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
- issue: מְחִיר כֶּלֶב의 해석
  chosen_reading: 본문은 직역을 유지해 ‘개의 값’으로 두고, 남창/남성 성전매춘 해석은 본문 주석으로 처리합니다.
  alternative_readings:
  - 남창의 삯
  - 남성 성전매춘의 값
  rationale: 히브리어 어휘 자체가 문자적으로는 ‘개’이므로, 본문에서 해석을 확정하지 않고 독자가 문맥적 긴장을 볼 수 있게 하는 편이 원문 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
