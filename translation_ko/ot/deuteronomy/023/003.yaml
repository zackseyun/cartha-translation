  - 열째 세대까지도
  - 열 번째 대까지도
  lexicon: HALOT
  rationale: 세대 단위를 유지하되, 금지의 지속 범위를 한국어 법문체로 자연스럽게 드러내기 위해 ‘까지도’를 사용했습니다.
