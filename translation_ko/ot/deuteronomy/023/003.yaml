  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'No bastard may enter the assembly of the LORD.' The Hebrew מַמְזֵר refers to a person of illegitimate or otherwise excluded birth status.
    reason: lexical_alternative
translation:
  language: ko
  text: 출생 신분에 결격이 있는 사람은 야훼의 회중에 들어갈 수 없습니다. 열째 세대까지도 그의 자손 가운데 누구도 야훼의 회중에 들어갈 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 “사생아는 여호와의 회중에 들어올 수 없다”라고 옮깁니다. 히브리어 מַמְזֵר는 혼인 관계 밖의 출생이나 그 밖에 배제된 출생 신분을 가리킬 수 있는, 정확한 범위가 논의되는 말입니다.
    reason: lexical_alternative
