  lexicon: HALOT
  rationale: 법적 금지문맥이므로 ‘들어갈 수 없습니다’로 허용 불가를 간명하게 나타냈습니다.
- source_word: קְהַל יְהוָה
  english_pob_choice: the assembly of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 모임
  - 야훼의 집회
  - 여호와의 회중
  lexicon: HALOT
  rationale: קהל은 공동체적 집합을 가리키므로 ‘회중’이 가장 직접적이며, 본 프로젝트 기본 원칙에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: דּוֹר עֲשִׂירִי
  english_pob_choice: even to the tenth generation
  chosen_korean: 열 번째 세대까지도
  alternatives_korean:
