  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'No bastard may enter the assembly of the LORD.' The Hebrew מַמְזֵר refers to a person of illegitimate or otherwise excluded birth status.
    reason: lexical_alternative
translation:
  language: ko
  text: 일그러진 출생의 사람은 야훼의 회중에 들어갈 수 없습니다. 심지어 열 번째 세대까지도 그의 자손 가운데 누구도 야훼의 회중에 들어갈 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 전통적으로는 “여호와의 회중”이라고 옮길 수 있습니다. 히브리어 מַמְזֵר는 불법적이거나 배제된 출생 신분의 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  english_pob_choice: one of illegitimate birth
  chosen_korean: 일그러진 출생의 사람
  alternatives_korean:
  - 사생아
  - 불법 출생자
  - 출생이 정당하지 않은 사람
  lexicon: HALOT
  rationale: מַמְזֵר는 단순한 비난어보다 출생 상태의 제약을 가리키므로, 현대 한국어에서 경멸적 뉘앙스를 덜면서도 배제된 출생 신분을 드러내는 표현을 택했습니다.
- source_word: יָבֹא
  english_pob_choice: may enter
  chosen_korean: 들어갈 수 없습니다
  alternatives_korean:
  - 들어오지 못합니다
