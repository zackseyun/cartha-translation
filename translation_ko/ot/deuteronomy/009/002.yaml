  source_fidelity: 첫 구절의 עַם은 집합적 ‘백성/민족’이지 개별 ‘사람’이 아니므로, 현행 ‘큰 사람이요 키가 큰 사람들’은 수와 의미가 어긋나며 문장도 부자연스럽습니다. ‘알고’와 ‘들어 온’은 목적어가 불분명하고, 히브리어의 이미 알려지고 소문난 대상이라는 뜻을 충분히 전달하지 못합니다. 수정안은 집합명사, 신체적 위압감을 나타내는 ‘크고 키가 큰’, 그리고 두 동사의 대상 및 인용문 구조를 보존합니다.
  naturalness: ‘크고 키가 큰 백성’은 현대 표준어로 자연스럽고, ‘당신은 그들을 알고 또 그들에 관하여 들어왔습니다’는 합쇼체를 유지하면서도 ‘알다/듣다’의 대상을 분명히 합니다. 인용 질문도 자연스럽고 원문의 수사적 힘을 유지합니다.
  terminology: ‘아낙의 자손들’은 본문의 계보적 표현을 유지하는 안전한 번역입니다. 각주에서 문자적 표현 ‘아낙의 아들들’을 제시하여, 민족명으로 평탄화하지 않은 번역 선택을 투명하게 밝힙니다.
