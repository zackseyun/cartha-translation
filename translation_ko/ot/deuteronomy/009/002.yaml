translation:
  language: ko
  text: 큰 사람이요 키가 큰 사람들—아낙의 자손들—입니다. 그들은 당신이 알고, 또 들어 온 사람들입니다. “누가 아낙의 자손들 앞에 설 수 있겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아낙의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם גָּדוֹל וָרָם
  english_pob_choice: a great and tall people
  chosen_korean: 큰 사람이요 키가 큰 사람들
  alternatives_korean:
  - 큰 민족이요 키 큰 민족
  - 크고 키 큰 백성
  lexicon: HALOT
  rationale: עַם은 집단을 가리키는 말이라 여기서는 ‘사람들’로 풀어 자연스럽게 하되, גָּדוֹל וָרָם의 중첩된 신체적·위압적 묘사는 ‘큰… 키가 큰…’으로 살렸습니다.
- source_word: בְּנֵי עֲנָקִים
  english_pob_choice: the sons of Anak
  chosen_korean: 아낙의 자손들
  alternatives_korean:
  - 아낙 사람들
  - 아낙 자손들
  lexicon: HALOT
  rationale: 영문 POB의 주석처럼 히브리어는 직역하면 ‘아낙의 아들들’이지만, 한국어에서는 혈연·계보를 나타내는 ‘자손들’이 가장 자연스럽고 원문 의미도 보존합니다.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ / וְאַתָּה שָׁמַעְתָּ
  english_pob_choice: whom you know, and of whom you have heard
  chosen_korean: 그들은 당신이 알고, 또 들어 온 사람들입니다
  alternatives_korean:
  - 당신이 알고 또 들어 본 사람들입니다
  - 당신이 알고 또 들은 사람들입니다
  lexicon: HALOT
  rationale: 알다/듣다의 완료형을 현재 관련성으로 옮겨, 이미 잘 알려진 대상이라는 점을 한국어로 자연스럽게 드러냈습니다.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  english_pob_choice: Who can stand before
  chosen_korean: 누가 … 앞에 설 수 있겠습니까
  alternatives_korean:
  - 누가 … 앞에서 맞설 수 있겠습니까
  - 누가 … 앞에 버틸 수 있겠습니까
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 방향을 살려 ‘앞에’로 옮기고, 도전적 수사를 현대 한국어 질문형으로 처리했습니다.
theological_decisions:
- issue: 아낙의 자손들 표현을 민족명으로 평탄화할지 여부
  chosen_reading: 혈연 계보를 드러내는 ‘아낙의 자손들’을 본문에 유지합니다.
  alternative_readings:
  - 아낙 사람들
  - 아낙족
  rationale: 영문 POB도 ‘the sons of Anak’를 유지하고 있으며, 히브리어의 계보적 표현을 지워 버리면 본문이 강조하는 두려운 혈통 이미지가 약화됩니다.
  doctrine_reference: source fidelity
