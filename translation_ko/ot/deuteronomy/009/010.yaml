base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
  footnotes:
  - marker: a
    text: Or 'by the finger of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that the LORD spoke to you.' The Hebrew says 'with you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내게 두 돌판을 주셨습니다[a]. 그것들은 하나님의 손가락으로[b] 기록된 것이었고, 그 위에는 야훼께서 산에서, 불 가운데에서, 모임의 날에 여러분에게 말씀하신 모든 말씀이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님의 두 돌판.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '하나님의 손가락에 의해.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유 신명 표기 관례
  rationale: POB가 יְהוָה를 고유 신명으로 유지하므로 한국어도 관례적 대체어보다 '야훼'를 택해 언약적 이름을 드러냈습니다.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  english_pob_choice: the two stone tablets
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 돌로 된 판
  - 두 석판
  lexicon: HALOT
  rationale: 히브리어는 '돌의 두 판'이라는 구성을 가지지만, 한국어에서는 '두 돌판'이 가장 자연스럽고 내용도 충분히 보존합니다.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  english_pob_choice: with the finger of God
  chosen_korean: 하나님의 손가락으로
  alternatives_korean:
  - 하나님의 손가락으로서
  - 하나님의 능력으로
  lexicon: HALOT
  rationale: 신체적 비유를 해석해 약화시키지 않고, 도구적 뉘앙스를 살려 직역에 가깝게 옮겼습니다.
- source_word: עִמָּכֶם
  english_pob_choice: with you
  chosen_korean: 여러분에게
  alternatives_korean:
  - 여러분과
  - 여러분에게서
  lexicon: HALOT
  rationale: 영어 POB의 각주가 지적하듯 히브리어는 문자적으로 '너희와 함께'이지만, 여기서는 출애굽기 20장의 계시 발화를 가리키므로 한국어 본문에서는 자연스럽게 '여러분에게'로 옮기되, 말함의 관계를 보존했습니다.
- source_word: בְּיוֹם הַקָּהָל
  english_pob_choice: on the day of the assembly
  chosen_korean: 모임의 날
  alternatives_korean:
  - 회중의 날
  - 모인 날
  lexicon: HALOT
  rationale: קהל은 단순한 집합이 아니라 이스라엘의 공식적 집회를 가리키므로, '모임'보다 더 교회적 색채가 강한 용어는 피하면서도 공동체적 행위를 전달했습니다.
theological_decisions:
- issue: 문자적 이미지인 '하나님의 손가락'의 보존
  chosen_reading: 하나님의 손가락으로
  alternative_readings:
  - 하나님의 능력으로
  - 하나님이 친히
  rationale: 본문은 하나님의 직접적, 인격적 행위를 생생한 의인화로 제시하므로 그 이미지를 해석해 지우지 않고 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 출 31:18 병행 이미지
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 신명 표기 일관성을 따라 언약 이름을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
