  lexicon: HALOT
  rationale: אַף와 חֵמָה의 중첩된 분노 표현을 한국어에서도 두 겹으로 살리기 위해 ‘분노와 진노’로 옮겼습니다.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  english_pob_choice: to destroy you
  chosen_korean: 멸하시려고
  alternatives_korean:
  - 파괴하시려고
  - 없애시려고
  - 진멸하시려고
  lexicon: HALOT
  rationale: 히필 부정사는 단순한 파괴보다 강한 멸망을 뜻하므로, 과도하게 신학화하지 않으면서도 강도를 유지하는 ‘멸하시려고’를 택했습니다.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי גַּם בַּפַּעַם הַהִוא
  english_pob_choice: But Yahweh listened to me also at that time
  chosen_korean: 그러나 야훼께서 그때에도 내 말을 들으셨습니다
  alternatives_korean:
  - 그러나 야훼께서 그때에도 내게 들으셨습니다
  - 그런데 야훼께서 그때에도 내 말을 들으셨습니다
  - 야훼께서 그때에도 내 말을 들으셨습니다
  lexicon: HALOT
  rationale: שׁמע with אֶל은 단순 청취보다 응답적 ‘들어주심’의 뜻이 있어, 중보에 대한 긍정적 응답을 드러내는 ‘내 말을 들으셨습니다’로 옮겼습니다.
