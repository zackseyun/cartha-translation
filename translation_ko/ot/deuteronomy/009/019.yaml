  to: 내가 야훼께서 너희를 멸하시려고 너희에게 품으신 분노와 진노 때문에[a] 두려워하였습니다. 그러나 야훼께서 그때에도 내 말을 들으셨습니다.[b]
  rationale: 야훼가 멸하시는 주체라는 점을 명확히 하도록 어순을 고치고, קצף의 의미에 맞게 ‘내리신’을 ‘품으신’으로 조정했습니다. 본문의 의미는 유지하면서 각주 표지를 해당 단어·구절에 직접 연결했고, b 각주는 히브리어의 직역을 정확히 제시하도록 바로잡았습니다.
