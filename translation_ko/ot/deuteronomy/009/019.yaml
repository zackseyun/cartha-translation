  text: 내가 야훼께서 너희를 멸하시려고 너희에게 품으신 분노와 진노 때문에[a] 두려워하였습니다. 그러나 야훼께서 그때에도 내 말을 들으셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 앞에서’이지만, 여기서는 두려움의 원인이나 계기를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내게 들으셨습니다’이며, 문맥상 모세의 중보에 대한 호의적인 응답을 뜻합니다.
    reason: lexical_alternative
