base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
  footnotes:
  - marker: a
    text: Or 'For I feared because of the anger and the wrath that the LORD was angry with against you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'heard/listened to me'; in context this implies that the LORD responded favorably to Moses' intercession.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 멸하시려고 야훼께서 너희를 향하여 내리신 그 분노와 진노 때문에 두려워하였습니다. 그러나 야훼께서 그때에도 내 말을 들으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘너희 앞에서’이지만, 여기서는 두려움의 원인이나 계기를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 말을 들으셨습니다’는 문맥상 모세의 중보에 대한 응답, 곧 호의적인 응답을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  english_pob_choice: I was afraid
  chosen_korean: 두려워하였습니다
  alternatives_korean:
  - 무서워하였습니다
  - 두려워했습니다
  - 경외하였습니다
  lexicon: HALOT
  rationale: גור의 1인칭 완료형은 실제 공포를 나타내므로, 현대 한국어에서는 ‘두려워하였습니다’가 가장 자연스럽고 엄숙한 표현입니다.
- source_word: הָאַף וְהַחֵמָה
  english_pob_choice: the anger and the wrath
  chosen_korean: 그 분노와 진노
