base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
  footnotes:
  - marker: a
    text: Or 'For my righteousness the LORD has brought me in to inherit this land.' The Hebrew can be rendered more formally with 'for' and 'inherit,' but the main text uses clearer modern English while preserving the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님께서 이 민족들을 당신 앞에서 쫓아내실 때에, 마음속으로 ‘내 의 때문에 야훼께서 나를 이 땅으로 들어오게 하셔서 이 땅을 차지하게 하셨다’고 말하지 마십시오. 야훼께서 이 민족들의 악함 때문에 그들을 당신 앞에서 쫓아내시는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음속으로’는 히브리어 בִּלְבָבְךָ의 직역이며, 내적 독백을 가리키는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  english_pob_choice: Do not say in your heart
  chosen_korean: 마음속으로 이렇게 말하지 마십시오
  alternatives_korean:
  - 마음에 품고 말하지 마십시오
  - 속으로 말하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 자기대화의 금지를 뜻하므로, 직역의 ‘마음속으로’와 자연스러운 금지문을 함께 살렸습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 야훼, 당신의 하나님
  lexicon: HALOT
  rationale: 공적 문체에서는 ‘당신의 하나님’이 합쇼체에 맞고, 고유명사 יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: בְּצִדְקָתִי הֱבִיאַנִי יְהוָה לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  english_pob_choice: Because of my righteousness Yahweh has brought me in to possess this land
  chosen_korean: 내 의로 인해 야훼께서 이 땅을 소유하게 하시려고 나를 이곳으로 데려오셨다
  alternatives_korean:
  - 내 의 때문에 야훼께서 나를 이 땅을 차지하게 하셨다
  - 내 의로 야훼께서 나를 이 땅을 상속받게 하셨다
  lexicon: HALOT
  rationale: ‘의’는 도덕적 공로를 가리키는 핵심어이므로 유지했고, לָרֶשֶׁת은 문맥상 ‘소유하다’로 자연스럽게 풀어 소유권 획득을 드러냈습니다.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה יְהוָה מוֹרִישָׁם מִפָּנֶיךָ
  english_pob_choice: while because of the wickedness of these nations Yahweh is dispossessing them before you
  chosen_korean: 오히려 이 민족들의 악함 때문입니다
  alternatives_korean:
  - 이 민족들의 악함 때문에입니다
  - 바로 이 민족들의 악함 때문입니다
  lexicon: HALOT
  rationale: 마지막 절은 이스라엘의 공로가 아니라 민족들의 악함이 이유임을 대조하므로, ‘오히려’로 반전을 살리고 ‘악함’으로 רִשְׁעָה를 옮겼습니다.
theological_decisions:
- issue: 이스라엘이 땅을 얻은 근거를 자기 의로 돌리는 오독 방지
  chosen_reading: 이 땅을 소유하게 하시려고 나를 이곳으로 데려오셨다
  alternative_readings:
  - 이 땅을 차지하게 하셨다
  - 이 땅을 상속받게 하셨다
  rationale: 본문은 이스라엘의 공로를 전제한 자기 해석을 금지하므로, ‘의’와 ‘소유’ 표현을 유지해 공로-언약의 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #3'
- issue: 야훼의 행위가 이스라엘의 공로가 아니라 열방의 악함에 근거함을 드러내는 대조
  chosen_reading: 오히려 이 민족들의 악함 때문입니다
  alternative_readings:
  - 이 민족들의 악함 때문에입니다
  - 그 민족들의 악함 때문에입니다
  rationale: 히브리어의 대조적 흐름을 따라 원인 전치를 분명히 하여, 정복의 정당성을 이스라엘이 아니라 야훼의 न्याय로운 심판에 두었습니다.
  doctrine_reference: Deut 9:4 context
