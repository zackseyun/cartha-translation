revisions:
- from: 마음속으로 이렇게 말하지 마십시오. 「내 의로 인해 야훼께서 이 땅을 소유하게 하시려고 나를 이곳으로 데려오셨다」고 말하지 마십시오. 야훼 당신의 하나님께서 이 민족들을 당신 앞에서 쫓아내시는 것은, 오히려 이 민족들의 악함 때문입니다.[a]
  to: 야훼 당신의 하나님께서 이 민족들을 당신 앞에서 쫓아내실 때에, 마음속으로 ‘내 의 때문에 야훼께서 나를 이 땅으로 들어오게 하셔서 이 땅을 차지하게 하셨다’고 말하지 마십시오. 야훼께서 이 민족들의 악함 때문에 그들을 당신 앞에서 쫓아내시는 것입니다.[a]
  rationale: 원문의 시간 절을 문두에 복원하고, 단 한 번의 금지 명령 안에 인용 내용을 넣었습니다. 또한 마지막 절에서 민족들의 악함을 원인으로 제시하는 것과 야훼께서 그들을 이스라엘 앞에서 내쫓으시는 행위를 모두 번역했습니다. ‘의’와 ‘차지하다’를 유지하여 이스라엘이 자신의 의를 근거로 삼는다는 금지된 주장을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:50Z'
review_pass:
