  source_fidelity: 초안은 히브리어의 시간 절(‘야훼께서 그들을 당신 앞에서 쫓아내실 때’)을 문두에 두지 않고, 마지막 절의 명시적 행위인 ‘야훼께서 그들을 쫓아내신다/내쫓으신다’를 ‘악함 때문이다’로 축약하여 누락했습니다. 또한 금지 명령을 불필요하게 두 번 반복합니다.
  naturalness: ‘마음속으로 … 말하지 마십시오’는 자연스럽지만, 원문의 문장 구조와 인용 내용이 더 명료하게 연결되도록 한 문장으로 정리하는 것이 좋습니다. ‘이곳으로 데려오셨다’보다 ‘이 땅으로 들어오게 하셔서 이 땅을 차지하게 하셨다’가 원문의 입국과 소유의 뜻을 모두 더 정확히 드러냅니다.
  terminology: ‘야훼’, ‘하나님’, ‘의’, ‘땅’, ‘민족들’은 적절합니다. רִשְׁעָה는 ‘악함’으로 옮길 수 있으나, 마지막 절에서는 그 악함이 야훼께서 그들을 내쫓으시는 이유임과 그 행위 자체를 모두 번역해야 합니다.
