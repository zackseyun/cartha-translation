  to: 그때 야훼께서 제게 말씀하셨습니다. “내가 이 백성을 보았고, 보라, 이 백성은 목이 뻣뻣한 백성입니다.”[a]
  rationale: 본문의 완료형을 불필요한 역접 뉘앙스 없이 옮기고, הִנֵּה의 강조는 ‘보라’로 유지했습니다. 각주는 완료형의 가능한 단순과거 번역과 הִנֵּה의 ‘참으로’ 해석을 제시하되, 단수 집합명사 ‘이 백성’을 일관되게 유지하도록 바로잡았습니다.
