  - ‘여호와’로 음역
  rationale: 이 절은 하나님의 직접 발화를 전하므로, 대체 호칭보다 고유한 언약명을 보존하는 것이 स्रोत의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
