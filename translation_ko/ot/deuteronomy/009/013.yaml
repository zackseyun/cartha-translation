lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה는 한국어 관례적 대체칭호보다 음역인 ‘야훼’로 옮겨, 언약적 신명 자체를 드러내도록 했습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 … 말씀하셨습니다
  alternatives_korean:
  - 그리고 … 말씀하셨습니다
  - 그리하여 … 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 서사 흐름에 맞게 ‘그때’로 자연스럽게 살렸습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시기를
  - 이라고
  lexicon: HALOT
  rationale: 히브리어의 발화 도입 공식을 한국어에서는 중복 어색함 없이 바로 인용문으로 이어지게 처리하되, 동사 ‘말씀하셨습니다’로 발화 사실은 유지했습니다.
- source_word: קְשֵׁה עֹרֶף
  english_pob_choice: stiff-necked
  chosen_korean: 목이 뻣뻣한
  alternatives_korean:
  - 완고한
  - 목이 굳은
  lexicon: HALOT
  rationale: 관용구의 직유를 살려 문자 이미지를 보존했습니다. 전통적 ‘완고한’은 뜻은 전하나 비유적 힘이 약해집니다.
- source_word: עַם
  english_pob_choice: people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 문맥상 공동체 전체를 가리키는 집합명사로 ‘백성’이 가장 자연스럽고, 앞뒤의 ‘이 백성’ 반복도 히브리어의 강조를 반영합니다.
theological_decisions:
- issue: 신명 יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 직역 수준에서 유지합니다.
  alternative_readings:
