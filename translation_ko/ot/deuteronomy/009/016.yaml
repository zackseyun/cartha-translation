  to: 내가 보니, 너희가 너희 하나님 야훼께 죄를 지었고, 너희 자신을 위하여 주조한 송아지를 만들었으며[a], 야훼께서 너희에게 명령하신 길에서 너무도 빨리 벗어났습니다.
  rationale: ‘내가 보니’가 ‘내가 보았다’와 주의 환기 표지 הִנֵּה를 함께 자연스럽게 전달하도록 고쳤습니다. ‘너희 자신을 위하여’로 לָכֶם의 수혜적 재귀성을 명확히 했고, 주조 의미의 각주를 해당 명사구에 직접 연결했습니다. 원문의 회고적 과거, 언약적 ‘길’ 비유, 그리고 ‘빨리’의 강조는 보존했습니다.
