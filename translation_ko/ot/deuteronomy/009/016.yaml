  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
  footnotes:
  - marker: a
    text: Or 'a molten calf.' The Hebrew phrase refers to a calf made by casting metal.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 보십시오, 너희가 너희 하나님 야훼께 죄를 지었습니다. 너희는 너희를 위해 부어 만든 송아지를 만들었습니다. 너희는 야훼께서 너희에게 명령하신 그 길에서 빠르게 벗어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘부어 만든 송아지’입니다. 히브리어 표현은 금속을 부어 주조한 우상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: And I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보았습니다
  lexicon: HALOT
  rationale: צפה/ראה 계열의 관찰 동작을 서술 흐름상 자연스럽게 살리되, 뒤의 「보십시오」와 중복되지 않도록 「내가 보니」로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지이므로, 한국어에서는 경고적·선언적 뉘앙스가 살아나는 「보십시오」로 처리했습니다.
- source_word: עֵגֶל מַסֵּכָה
  english_pob_choice: a cast-metal calf
  chosen_korean: 부어 만든 송아지
  alternatives_korean:
  - 주조한 송아지
  - 주조 금속 송아지
  - 부어 만든 금송아지
  lexicon: HALOT
  rationale: מַסֵּכָה의 핵심은 금속을 부어 만든 우상이라는 제조 방식이므로, 전통적인 「금송아지」보다 과정이 드러나는 「부어 만든 송아지」를 택했습니다.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  english_pob_choice: You had turned aside quickly from the way
  chosen_korean: 너희는 … 그 길에서 빠르게 벗어났습니다
  alternatives_korean:
  - 그 길에서 급히 돌아섰습니다
  - 그 길에서 속히 치우쳤습니다
  lexicon: HALOT
  rationale: covenant적 비유인 ״דרך״를 「길」로 살리고, סור의 이탈 의미를 「벗어나다」로 풀어 한국어의 자연성을 확보했습니다. 「빠르게」는 מַהֵר의 속도감을 직접 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공식 용례에 따라 신명기 본문의 יְהוָה는 하나님의 고유명사 「야훼」로 옮겨, 호칭 대체를 피했습니다.
theological_decisions:
- issue: 죄의 방향을 나타내는 ל + חטא의 번역
  chosen_reading: 「야훼께 죄를 지었습니다」
  alternative_readings:
  - 야훼를 거슬러 죄를 지었습니다
  - 야훼 앞에서 죄를 지었습니다
  rationale: 히브리어 חטא + ל는 일반적으로 ‘~에게/을 향해 죄를 짓다’의 관계를 가지므로, 직역성과 자연성을 함께 살려 「야훼께 죄를 지었습니다」로 옮겼습니다.
  doctrine_reference: 용례상 방향성을 보존하는 문법·의미 번역
- issue: 명령 회상의 시제 처리
  chosen_reading: 과거 회상에 맞게 현재형 대신 완료형/과거형으로 정리했습니다
  alternative_readings:
  - 너희가 죄를 짓습니다
  - 너희가 죄를 지었습니다
  rationale: 모세가 과거 사건을 회고하는 문맥이므로, 한국어에서도 이미 일어난 행위를 분명히 드러내는 완료형 표현이 적절합니다.
  doctrine_reference: 서사 문맥의 시제 일치
