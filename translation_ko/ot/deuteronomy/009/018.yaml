    issue: 동일한 신명 יְהוָה를 ‘주님’과 ‘야훼’로 혼용함
    rationale: 원문에는 두 곳 모두 יְהוָה가 쓰였고, 제공된 POB 신명 정책도 ‘야훼’를 요구합니다. 문체상의 자연스러움을 이유로 한 임의적 교체는 원문의 반복과 명칭을 보존하지 못합니다.
  - severity: medium
