revisions:
- from: 그러고 나서 나는 처음처럼 주님 앞에 엎드려 사십 일 사십 밤을 지냈습니다. 나는 떡도 먹지 않고 물도 마시지 않았습니다. 이는 여러분이 저지른 모든 죄 때문이었습니다. 곧 여러분이 야훼의 눈앞에서 악을 행하여 그를 분노하게 한 것입니다.[a]
  to: 그러고 나서 나는 처음과 같이[a] 사십 일 사십 밤 동안 야훼 앞에 엎드렸습니다. 나는 떡도 먹지 않았고 물도 마시지 않았습니다. 이는 여러분이 저지른 모든 죄 때문이었습니다. 곧 여러분이 야훼의 눈앞에서 악을 행하여 그를 분노하게 한 죄입니다.
  rationale: 신명 יְהוָה를 모두 ‘야훼’로 통일하여 원문 및 POB 방침을 따랐습니다. 엎드림이 사십 일 사십 밤 동안 계속되었음을 문장 구조에서 분명히 했고, כָּרִאשֹׁנָה 관련 각주를 해당 표현에 직접 연결했습니다. 죄의 집합적 성격과 그 내용인 악행 및 야훼를 분노하게 함을 보존했습니다.
