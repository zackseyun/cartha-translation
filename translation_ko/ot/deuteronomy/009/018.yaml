  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
  footnotes:
  - marker: a
    text: Or 'as before' or 'as formerly.' The Hebrew phrase points back to Moses' earlier forty-day period before the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 나는 처음처럼 주님 앞에 엎드려 사십 일 사십 밤을 지냈습니다. 나는 떡도 먹지 않고 물도 마시지 않았습니다. 이는 여러분이 저지른 모든 죄 때문이었습니다. 곧 여러분이 야훼의 눈앞에서 악을 행하여 그를 분노하게 한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처음에’, ‘이전처럼’으로도 옮길 수 있습니다. 히브리어 표현은 모세의 앞선 사십 일 기간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  english_pob_choice: Then I fell down
  chosen_korean: 엎드려
  alternatives_korean:
  - 쓰러져
  - 몸을 던져 엎드려
  lexicon: HALOT
  rationale: 히트파엘 של נפל은 단순한 낙하보다 경배·중보의 자세를 나타내므로, 자연스러운 동작 표현인 ‘엎드려’로 옮겨 자세를 살렸습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 야훼 앞에
  - 주님 면전에
  lexicon: HALOT
  rationale: 문맥상 하나님 앞에서의 중보 행위를 가리키므로 ‘앞에’가 적절하며, 본문은 POB의 야훼 표기를 따르지 않고 합쇼체 서술에서 ‘주님’으로 정리했습니다.
- source_word: כָּרִאשֹׁנָה
  english_pob_choice: as at the first
  chosen_korean: 처음처럼
  alternatives_korean:
  - 첫 번째처럼
  - 전에처럼
  - 처음에 했던 것처럼
  lexicon: HALOT
  rationale: 이 표현은 앞선 사십 일 사십 밤의 기간을 되돌아보게 하므로, 한국어로는 간결하게 ‘처음처럼’이 자연스럽고 회고적 연결도 유지합니다.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  english_pob_choice: I ate no bread and drank no water
  chosen_korean: 나는 떡도 먹지 않고 물도 마시지 않았습니다
  alternatives_korean:
  - 나는 빵도 먹지 않고 물도 마시지 않았습니다
  - 나는 아무것도 먹지 않고 아무것도 마시지 않았습니다
  lexicon: HALOT
  rationale: 히브리어가 ‘떡/빵’과 ‘물’을 병렬로 구체적으로 말하므로, 일반화하지 않고 ‘떡도… 물도…’로 대응했습니다.
- source_word: עַל כָּל חַטַּאתְכֶם ... לְהַכְעִיסוֹ
  english_pob_choice: because of all your sin ... provoking him to anger
  chosen_korean: 이는 여러분이 저지른 모든 죄 때문이었습니다. 곧 여러분이 ... 그를 분노하게 한 것입니다
  alternatives_korean:
  - 여러분의 모든 죄 때문에
  - 여러분의 모든 죄를 두고
  - 여러분이 그를 노하게 하였기 때문에
  lexicon: HALOT
  rationale: עַל의 원인 의미와 뒤따르는 결과절을 살려 ‘때문이었습니다’로 연결하고, לְהַכְעִיסוֹ의 사역적 의미는 ‘분노하게 한’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 호칭 처리
  chosen_reading: 본문에는 ‘주님’과 ‘야훼’가 함께 나타나도록 하여, 서술 흐름은 현대 한국어로 자연스럽게 유지하되 하나님의 고유 이름은 본문 후반에서 드러내었습니다.
  alternative_readings:
  - 전부 ‘야훼’로 통일
  - 전부 ‘주님’으로 통일
  rationale: 원문은 יְהוָה를 직접 사용하지만, 한국어 합쇼체의 읽기 흐름에서는 반복되는 고유명사보다 문맥상 한 차례 드러내는 방식이 더 자연스럽습니다. 다만 후반의 ‘야훼’로 원문의 언약명 사용을 보존했습니다.
  doctrine_reference: POB name rendering policy for YHWH
