revisions:
- from: 내가 산에 올라가 돌판들—곧 야훼께서 너희와 맺으신 언약의 판들을—받으려고 했을 때, 나는 산에 사십 일 사십 야간 머물렀습니다. 나는 떡을 먹지 않았고 물을 마시지 않았습니다.[a][b][c]
  to: 내가 돌판들[b], 곧 야훼께서 너희와 맺으신[c] 언약의 판들을 받으러[a] 그 산에 올라갔을 때, 나는 그 산에 사십 일 동안 사십 밤을 머물렀습니다. 나는 떡을 먹지 않았고 물을 마시지 않았습니다.
  rationale: 목적을 나타내는 히브리어 부정사의 뜻을 ‘받으러’로 바로잡고, 기간 표현을 현대 한국어에서 자연스럽고 원문에 충실한 ‘사십 일 동안 사십 밤’으로 수정했습니다. 각주를 해당 어구에 배치하고, 각주 b를 실질적인 어휘 대안으로 고쳤습니다.
