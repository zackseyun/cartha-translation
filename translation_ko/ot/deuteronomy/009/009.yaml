source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to take''; here ''to receive'' reflects the sense of Moses going up to be given the tablets.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the tablets of stone.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'cut with you,' a standard Hebrew idiom for making a covenant.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 돌판들[b], 곧 야훼께서 너희와 맺으신[c] 언약의 판들을 받으러[a] 그 산에 올라갔을 때, 나는 그 산에 사십 일 동안 사십 밤을 머물렀습니다. 나는 떡을 먹지 않았고 물을 마시지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘취하다’ 또는 ‘가져가다’이지만, 여기서는 모세가 돌판들을 받는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돌로 된 판들’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구로, 문자적으로는 ‘너희와 자르신’이지만 언약을 맺으셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  english_pob_choice: When I went up
  chosen_korean: 내가 산에 올라가
  alternatives_korean:
  - 내가 산에 올라갔을 때
  - 내가 올라갔을 때
  lexicon: HALOT
  rationale: בְּ + עולה의 시간적 용법을 자연스럽게 살리되, 모세의 이동 방향을 분명히 하기 위해 '산에 올라가'로 옮겼습니다.
- source_word: לָקַחַת
  english_pob_choice: to receive
  chosen_korean: 받으려고 했을 때
  alternatives_korean:
  - 받으러
  - 취하려고
  lexicon: HALOT
  rationale: 문맥상 모세가 스스로 취하는 것이 아니라 하나님께서 주시는 판들을 받는 것이므로 '받다'를 사용해 수동적 수령의 뜻을 드러냈습니다.
- source_word: לוּחֹת הָאֲבָנִים / לוּחֹת הַבְּרִית
  english_pob_choice: the stone tablets / the tablets of the covenant
  chosen_korean: 돌판들—곧 ... 언약의 판들
  alternatives_korean:
  - 석판들—곧 ... 언약의 돌판들
  - 돌판들—곧 ... 언약판들
  lexicon: HALOT
  rationale: 두 개의 אפוסיט적 구문을 모두 살려 재질과 기능을 함께 드러냈습니다. 한국어에서는 '판들'보다 '돌판들'이 자연스럽고, 반복을 '곧'으로 연결해 강조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 용례에 따라 신명 יְהוָה는 제목이 아니라 고유명사로서 '야훼'로 옮겼습니다.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  english_pob_choice: forty days and forty nights
  chosen_korean: 사십 일 사십 야간
  alternatives_korean:
  - 사십 일 사십 밤
  - 사십 일 낮과 사십 밤
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 유지하면서도 한국어에서 '밤'보다 시간 단위로 더 분명한 '야간'을 택해 전체 체류 기간을 드러냈습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 먹을 것
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 넓히지 않고, 현대 한국어에서 일상적이면서도 성경적 문맥에 어울리는 '떡'으로 옮겼습니다.
theological_decisions:
- issue: 언약 체결을 나타내는 כָּרַת יְהוָה עִמָּכֶם의 표현
  chosen_reading: '''야훼께서 너희와 맺으신 언약''으로 옮겨 ''cut a covenant''의 관용적 의미를 반영했습니다.'
  alternative_readings:
  - '''야훼께서 너희와 자르신'''
  - '''야훼께서 너희와 세우신'''
  rationale: 히브리어 직역의 '자르다'는 한국어에서 의미가 불투명하므로, 언약 행위를 자연스럽게 이해시키는 '맺다'를 사용하되 '언약'을 명시해 신학적 의미를 보존했습니다.
  doctrine_reference: 언약 신학 및 히브리어 관용구 כָּרַת בְּרִית
- issue: 산에 머문 기간과 금식의 강조
  chosen_reading: '''나는 산에 사십 일 사십 야간 머물렀습니다. 나는 떡을 먹지 않았고 물을 마시지 않았습니다.'''
  alternative_readings:
  - '''나는 산에서 사십 일 사십 야간을 보냈습니다'''
  - '''... 아무것도 먹지 않고 마시지 않았습니다'''
  rationale: 본문은 모세의 완전한 금식을 강조하므로, '먹지/마시지 않았다'를 유지해 절대적 금식의 강도를 드러냈습니다.
  doctrine_reference: 모세의 시내산 체류와 계시 수령의 본문 맥락
