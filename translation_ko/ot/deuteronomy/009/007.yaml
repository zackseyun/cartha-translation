  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
  footnotes:
  - marker: a
    text: Or, 'how you angered the LORD your God in the wilderness.'
    reason: lexical_alternative
  - marker: b
    text: 'Literally, ''with the LORD''; here the sense is adversative: ''against the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 기억하십시오—잊지 마십시오—광야에서 야훼, 곧 여러분의 하나님을 격노하게 한 일을 말입니다[a]. 여러분이 이집트 땅에서 나온 날부터 이곳에 이르기까지[b] 여러분은 줄곧 야훼를 거역해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '광야에서 여러분의 하나님 여호와를 화나게 한 일'.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '여러분이 오기까지'이며, 여기서는 '이곳에 이르기까지'라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר / אַל תִּשְׁכַּח
  english_pob_choice: Remember—do not forget
  chosen_korean: 기억하십시오—잊지 마십시오
  alternatives_korean:
  - 기억하십시오—기억에서 놓치지 마십시오
  - 기억하십시오—절대 잊지 마십시오
  lexicon: HALOT
  rationale: 기억하라는 명령과 잊지 말라는 부정을 둘 다 살려, 히브리어의 강조적 병렬을 한국어에서도 유지했습니다.
- source_word: הִקְצַפְתָּ
  english_pob_choice: provoked ... to wrath
  chosen_korean: 격노하게 한
  alternatives_korean:
  - 진노하게 한
  - 화를 돋운
  lexicon: HALOT
  rationale: הקציף의 사역적 뉘앙스를 살리기 위해 단순한 '화를 낸'보다 더 강한 '격노하게 하다'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 원문의 신성표기 יְהוָה를 가리키는 고유한 이름을 보존하기 위해 '야훼'로 옮겼습니다.
- source_word: עִם יְהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼를 거역해 왔습니다
  alternatives_korean:
  - 야훼와 함께였습니다
  - 야훼께 대항해 왔습니다
  lexicon: HALOT
  rationale: עִם 자체는 '함께'이지만, מרה와 결합된 문맥상 적대 관계이므로 한국어에서는 '거역하다'로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: POB의 본문 원칙에 따라 고유한 언약 이름을 제목어로 대체하지 않고 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: '''여러분은 줄곧 야훼를 거역해 왔습니다''의 시제 감각'
  chosen_reading: 줄곧 ... 거역해 왔습니다
  alternative_readings:
  - 거역했습니다
  - 거역해 왔습니다
  rationale: 출애굽부터 현재까지 이어지는 지속적 반역의 기간을 한국어 현재완료로 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
