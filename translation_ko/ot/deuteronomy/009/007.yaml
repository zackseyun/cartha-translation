  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: '''여러분은 줄곧 야훼를 거역해 왔습니다''의 시제 감각'
  chosen_reading: 줄곧 ... 거역해 왔습니다
  alternative_readings:
