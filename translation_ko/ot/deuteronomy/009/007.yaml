  lexicon: HALOT
  rationale: 기억하라는 명령과 잊지 말라는 부정을 둘 다 살려, 히브리어의 강조적 병렬을 한국어에서도 유지했습니다.
- source_word: הִקְצַפְתָּ
  english_pob_choice: provoked ... to wrath
  chosen_korean: 격노하게 한
  alternatives_korean:
  - 진노하게 한
  - 화를 돋운
  lexicon: HALOT
  rationale: הקציף의 사역적 뉘앙스를 살리기 위해 단순한 '화를 낸'보다 더 강한 '격노하게 하다'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 원문의 신성표기 יְהוָה를 가리키는 고유한 이름을 보존하기 위해 '야훼'로 옮겼습니다.
- source_word: עִם יְהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼를 거역해 왔습니다
  alternatives_korean:
  - 야훼와 함께였습니다
  - 야훼께 대항해 왔습니다
  lexicon: HALOT
  rationale: עִם 자체는 '함께'이지만, מרה와 결합된 문맥상 적대 관계이므로 한국어에서는 '거역하다'로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
