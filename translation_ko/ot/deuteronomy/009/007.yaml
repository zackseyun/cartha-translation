  source_fidelity: 히브리어는 앞부분에서 2인칭 남성 단수(‘당신이’)를 사용하다가 ‘여러분이 이곳에 이르기까지’와 결론에서 복수로 전환합니다. 초안은 처음부터 모두 ‘여러분’으로 처리하여 이 의도적인 수 전환을 평준화했습니다. 또한 אֵת אֲשֶׁר의 내용절을 ‘어떻게 … 했는지를’로 명시하는 편이 원문의 ‘how’를 더 충실히 반영합니다.
  naturalness: ‘…한 일을 말입니다’는 명령문 뒤에서 다소 구어적이고 느슨합니다. ‘…어떻게 격노하게 했는지를’는 현대 한국어의 공식적 성경 문체에서 자연스럽습니다. ‘당신’은 문맥에 따라 민감할 수 있으나, 단수에서 복수로 바뀌는 원문의 문법적 대비를 보존하는 가장 직접적인 현대 표준어 표현입니다.
  terminology: ‘야훼’, ‘하나님’, ‘격노하게 하다’, ‘거역하다’는 원문의 신명, 언약적 관계, 사역적 분노 유발, 반역의 뜻을 적절히 전달합니다. ‘여호와’는 본문이 아니라 대안 독법으로만 각주에 둡니다.
  issues:
  - severity: medium
    issue: 2인칭 단수에서 복수로의 전환이 사라졌습니다.
    rationale: הִקְצַפְתָּ와 יָצָאתָ는 단수이나 בֹּאֲכֶם과 הֱיִיתֶם은 복수입니다. 초안의 일관된 ‘여러분’은 이 문법적 특징을 보존하지 못합니다.
  - severity: low
