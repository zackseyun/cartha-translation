base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
  footnotes:
  - marker: a
    text: Or, 'how you angered the LORD your God in the wilderness.'
    reason: lexical_alternative
  - marker: b
    text: 'Literally, ''with the LORD''; here the sense is adversative: ''against the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 기억하십시오—잊지 마십시오—당신이 광야에서 당신의 하나님 야훼를 어떻게 격노하게 했는지를[a]. 당신이 이집트 땅에서 나온 날부터 여러분이 이곳에 이르기까지[b], 여러분은 줄곧 야훼를 거역해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신의 하나님 여호와를 어떻게 화나게 했는지를.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘여러분이 이곳에 올 때까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר / אַל תִּשְׁכַּח
  english_pob_choice: Remember—do not forget
  chosen_korean: 기억하십시오—잊지 마십시오
  alternatives_korean:
