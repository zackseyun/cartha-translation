translation:
  language: ko
  text: 그러나 그들은 주님의 백성이며 주님의 기업입니다. 주님께서 주님의 큰 능력과 뻗으신 팔로 이들을 이끌어 내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기업’은 כאן의 נַחֲלָה가 지닌 언약적 분깃 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뻗으신 팔’은 출애굽 전승에서 하나님의 능력을 가리키는 관용적 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: But they are
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 또 그들은
  lexicon: WLC; English POB audit trail
  rationale: 문맥상 모세의 간구가 앞선 금지 요청과 대조를 이루므로, 히브리어 ו를 단순한 접속으로만 두기보다 역접을 드러내는 ‘그러나’로 옮기는 것이 자연스럽습니다.
- source_word: עַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주님의 백성
  alternatives_korean:
  - 주님의 사람들
  - 주님의 민족
  lexicon: HALOT
  rationale: עַם은 단순한 집단이 아니라 언약적 소속을 포함하는 ‘백성’의 뜻이 강하므로, 직역보다 문맥에 맞는 한국어 성경어휘를 택했습니다.
- source_word: וְנַחֲלָתֶךָ
  english_pob_choice: your inheritance
  chosen_korean: 주님의 기업
  alternatives_korean:
  - 주님의 상속
  - 주님의 소유
  lexicon: HALOT
  rationale: נַחֲלָה는 분깃으로 받은 소유, 곧 언약적 기업을 뜻하므로 한국어 성경에서 익숙한 ‘기업’이 가장 정확하게 대응합니다.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  english_pob_choice: and by your outstretched arm
  chosen_korean: 뻗으신 팔로
  alternatives_korean:
  - 펼치신 팔로
  - 뻗어진 팔로
  lexicon: HALOT
  rationale: ‘팔’은 출애굽 구원에서 하나님의 능력을 나타내는 상징적 표현이므로 이미지를 살려 옮겼고, ‘뻗으신’은 נְטוּיָה의 상태를 자연스럽게 반영합니다.
theological_decisions:
- issue: 출애굽 구원 언어의 상징성
  chosen_reading: ‘큰 능력과 뻗으신 팔’의 신체적 이미지를 유지해 하나님의 구원 행위를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘큰 능력으로’만 옮겨 이미지를 약화하는 방식
  - ‘강한 권능’으로 추상화하는 방식
  rationale: 본문은 출애굽 전승의 상투적이면서도 신학적으로 중요한 표상을 사용하므로, 이를 추상화하지 않고 보존하는 편이 저자의 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
