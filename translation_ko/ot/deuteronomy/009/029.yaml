  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
  footnotes:
  - marker: a
    text: Or 'And they are your people and your inheritance.' The Hebrew conjunction can be read simply as 'and'; 'but' reflects the likely contrast in Moses' plea.
