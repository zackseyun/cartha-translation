  timestamp: '2026-07-13T13:46:48Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘눈을 돌리지 마십시오’는 한국어에서 대개 ‘시선을 다른 데로 옮기다/외면하다’라는 뜻이어서, 히브리어 אַל־תֵּפֶן אֶל(‘~에 눈길을 돌려 유념하지 마십시오’)의 부정 명령과 반대되는 의미가 될 수 있습니다.
  naturalness: ‘돌아보지 마십시오’는 이 기도 문맥에서 백성의 완고함·악함·죄를 고려하거나 문제 삼지 말아 달라는 뜻을 자연스럽게 전달합니다. ‘기억하여 주십시오’는 하나님께 드리는 공손한 간구로 자연스럽습니다.
  terminology: ‘종들’, ‘완고함’, ‘악함’, ‘죄’는 각각 עבד, קְשִׁי, רִשְׁעוֹ, חַטָּאתוֹ를 무리 없이 반영합니다. ‘강퍅함’은 현대어 본문에서는 피하고 각주에서 어휘 대안으로만 언급할 수 있습니다.
