- from: 주님의 종들인 아브라함과 이삭과 야곱을 기억해 주십시오. 이 백성의 완고함이나 그들의 악함이나 그들의 죄에 눈을 돌리지 마십시오.[a][b]
  to: 주님의 종들인 아브라함과 이삭과 야곱을 기억하여 주십시오. 이 백성의 완고함[a][b]과 그들의 악함과 그들의 죄를 돌아보지 마십시오.
