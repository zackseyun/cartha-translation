base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
  footnotes:
  - marker: a
    text: Or 'Do not look at' or 'Do not regard' the stubbornness of this people.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'hardness' or 'stubbornness'; compare the idea of being obstinate, not the specific idiom 'stiff-necked' used elsewhere.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 종들인 아브라함과 이삭과 야곱을 기억해 주십시오. 이 백성의 완고함이나 그들의 악함이나 그들의 죄에 눈을 돌리지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 백성의 완고함을 보지 마십시오’처럼 ‘눈을 돌리지 마십시오’는 ‘바라보다/유념하다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘완고함’ 또는 ‘강퍅함’의 뜻을 가집니다. 여기서는 ‘고집스러운 불순종’의 의미를 가리키며, 다른 본문에서 쓰이는 ‘목이 곧다’는 관용구와는 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר לַעֲבָדֶיךָ
  english_pob_choice: Remember your servants
  chosen_korean: 주님의 종들인 ...을 기억해 주십시오
  alternatives_korean:
  - 주님의 종들을 기억해 주십시오
  - 주님의 종들인 ...을 기억하십시오
  lexicon: HALOT
  rationale: זכר의 간구형은 한국어에서 ‘기억해 주십시오’가 자연스럽고, לַעֲבָדֶיךָ는 족장들을 하나님께 속한 종으로 부르는 공손한 호칭이므로 ‘종들’로 옮겼습니다.
- source_word: קְשִׁי
  english_pob_choice: the stubbornness
  chosen_korean: 완고함
  alternatives_korean:
  - 고집
  - 강퍅함
  - 완악함
  lexicon: HALOT
  rationale: 문맥상 백성의 도덕적·태도적 ‘딱딱함’이 아니라 고집스러운 불순종을 가리키므로, 현대 한국어에서 가장 분명한 ‘완고함’을 선택했습니다.
- source_word: וְאֶל רִשְׁעוֹ ... וְאֶל חַטָּאתוֹ
  english_pob_choice: their wickedness ... their sin
  chosen_korean: 그들의 악함이나 그들의 죄
  alternatives_korean:
  - 그들의 악행이나 그들의 죄
  - 그들의 죄악이나 그들의 죄
  lexicon: HALOT
  rationale: רשע는 추상적 악성보다 도덕적 악함을, חטאת는 구체적 죄를 가리키므로 한국어에서 ‘악함’과 ‘죄’로 구분해 전달했습니다.
- source_word: אַל תֵּפֶן אֶל
  english_pob_choice: Do not turn your attention to
  chosen_korean: 눈을 돌리지 마십시오
  alternatives_korean:
  - 주의를 돌리지 마십시오
  - 돌아보지 마십시오
  - 살펴보지 마십시오
  lexicon: HALOT
  rationale: פנה의 비유적 의미인 ‘돌아보다/주시하다’를 한국어 관용구 ‘눈을 돌리다’로 옮겨, 단순한 시선 이동이 아니라 심판적 유념을 뜻하는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 족장들을 향한 עבד의 의미
  chosen_reading: ‘종들’로 옮겨 하나님께 속한 언약적 종이라는 관계를 드러냈습니다.
  alternative_readings:
  - ‘종’보다 완곡한 ‘종복’
  - ‘노예’로 더 강하게 옮김
  rationale: 여기서는 신분 억압보다 하나님께 대한 경외적 소속 관계가 전면에 있으므로, 본문이 가진 언약적 호칭을 유지하는 ‘종들’이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
