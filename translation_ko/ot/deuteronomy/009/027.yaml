    rationale: 원문은 백성의 완고함과 악과 죄에 ‘돌아보거나 유념하지 말라’는 간구입니다. 한국어 ‘눈을 돌리지 마십시오’는 통상 이미 보고 있는 대상에서 시선을 떼지 말라는 뜻으로 이해되어, 그 대상에 계속 주의를 두라는 의미가 될 수 있습니다.
  - severity: medium
    issue: 각주 a도 본문의 부정확한 표현을 전제함
    rationale: ‘눈을 돌리지 마십시오’를 ‘바라보다/유념하다’로 풀이하면 일반적인 현대 한국어 용법과 맞지 않습니다. 본문 수정에 맞추어 ‘돌아보다/유념하다’의 대안을 제시해야 합니다.
