  - 사십 일 낮과 사십 밤 동안
  - 사십 일 밤낮 동안
  lexicon: HALOT
  rationale: 기간의 목적격을 한국어의 시간 부사어로 풀어, 반복되는 구조를 보존하면서도 자연스럽게 ‘동안’으로 표시했습니다.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  english_pob_choice: he would destroy you
  chosen_korean: 여러분을 멸하겠다고
