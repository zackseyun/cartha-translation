  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
  footnotes:
  - marker: a
    text: Or 'I lay prostrate before the LORD for forty days and forty nights.' The Hebrew verb can emphasize prostration in intercession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 저는 야훼 앞에 사십 일 동안과 사십 밤 동안 엎드려 있었습니다. 야훼께서 여러분을 멸하겠다고 말씀하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저는 사십 일 동안과 사십 밤 동안 엎드려 있었습니다.’ 히브리어 동사는 간구 가운데 엎드려 있는 자세를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  english_pob_choice: So I fell down
  chosen_korean: 엎드려 있었습니다
  alternatives_korean:
  - 엎드렸습니다
  - 몸을 던졌습니다
  - 엎드려 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘형은 단순히 넘어짐보다 간구를 동반한 엎드림을 나타내므로, 문맥상 지속 상태를 살려 ‘엎드려 있었습니다’로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 주님 앞에
  - 여호와 앞에
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에/면전에’의 관계를 나타내므로, 소스 직접성에 따라 ‘야훼’와 함께 ‘앞에’로 옮겼습니다.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  english_pob_choice: for forty days and forty nights
  chosen_korean: 사십 일 동안과 사십 밤 동안
  alternatives_korean:
