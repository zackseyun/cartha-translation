base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''the land from which you brought us out,'' with ''land'' standing for its inhabitants.'
    reason: cultural_note
  - marker: b
    text: Or more literally, 'the land that he spoke to them [about].'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면, 당신이 우리를 거기에서 이끌어 내신 그 땅[a]이 말할 것입니다. ‘야훼께서 그들을 그들에게 약속하신 땅[b]으로 데려가실 수 없으셨고, 그들을 미워하셨기 때문에, 그들을 광야에서 죽게 하려고 이끌어 내셨다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신이 우리를 거기에서 이끌어 내신 그 땅’이라고 합니다. 여기서 ‘땅’은 그 땅의 주민들을 가리키는 환유입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그들에게 말씀하신 땅’입니다. 이 문맥에서는 하나님께서 그들에게 약속하신 땅을 가리킵니다.
    reason: lexical_alternative
