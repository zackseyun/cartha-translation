base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''the land from which you brought us out,'' with ''land'' standing for its inhabitants.'
    reason: cultural_note
  - marker: b
    text: Or more literally, 'the land that he spoke to them [about].'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면, 당신이 우리를 거기에서 이끌어 내신 그 땅이 말할 것입니다. ‘야훼께서 그들을 그들에게 말씀하신 땅으로 데려가실 능력이 없으셨고, 그들을 미워하셨기 때문에, 그들을 광야에서 죽게 하려고 이끌어 내셨다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘당신이 우리를 이끌어 내신 그 땅’이지만, 여기서는 ‘땅’이 그 주민들을 가리키는 메타니미로 쓰였습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그들에게 말한 땅’입니다. 여기서는 약속의 땅을 가리키는 관용적 표현으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: Otherwise
  chosen_korean: 그렇지 않으면
  alternatives_korean:
  - 그리하지 않으면
  - 만일 그렇지 않으면
  lexicon: HALOT
  rationale: 문맥상 경고하는 결과를 자연스러운 현대 한국어로 풀었으며, ‘lest’류의 문어적 느낌보다 본문의 위협적 흐름을 살렸습니다.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  english_pob_choice: the land from which you brought us out
  chosen_korean: 당신이 우리를 거기에서 이끌어 내신 그 땅
  alternatives_korean:
  - 당신이 우리를 거기에서 데리고 나오신 그 땅
  - 우리를 거기에서 이끌어 내신 그 땅
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’ 표현을 그대로 살리되, 한국어에서는 의인화된 메타니미가 자연스럽게 들리도록 ‘그 땅’으로 옮겼습니다.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  english_pob_choice: Because Yahweh was not able
  chosen_korean: 야훼께서 … 능력이 없으셨고
  alternatives_korean:
  - 야훼께서 … 할 수 없으셨고
  - 야훼께서 … 힘이 없으셨고
  lexicon: HALOT
  rationale: 원문이 표현하는 ‘할 수 없음’의 비난을 한국어에서 가장 직접적으로 드러내되, 실제 무능을 뜻하지 않는다는 점을 문맥으로 유지했습니다.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  english_pob_choice: and because he hated them
  chosen_korean: 그들을 미워하셨기 때문에
  alternatives_korean:
  - 그들에 대한 미움 때문에
  - 그들을 증오하셨기 때문에
  lexicon: HALOT
  rationale: 히브리어의 인과 표현을 살려, 출애굽-광야 심판에 대한 적대적 오해를 직접적으로 번역했습니다.
- source_word: לַהֲמִתָם בַּמִּדְבָּר
  english_pob_choice: to put them to death in the wilderness
  chosen_korean: 그들을 광야에서 죽게 하려고
  alternatives_korean:
  - 그들을 광야에서 죽이려고
  - 광야에서 그들을 죽음에 이르게 하려고
  lexicon: HALOT
  rationale: 히브리어 히필의 사역성을 반영하면서도, 한국어에서 더 무게감 있게 들리는 ‘죽게 하다’ 구조를 택했습니다.
