translation:
  language: ko
  text: 그리하여 사십 일과 사십 밤이 끝났을 때, 야훼께서 내게 두 돌판, 곧 언약의 돌판들을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  english_pob_choice: And at the end of
  chosen_korean: 그리고 …이 끝났을 때
  alternatives_korean:
  - 그리고 … 후에
  - 그리고 …이 지난 뒤
  lexicon: HALOT
  rationale: מִקֵּץ는 단순한 ‘후에’보다 기간의 완료 지점을 강조하므로, 한국어에서도 경계가 드러나는 ‘…이 끝났을 때’로 옮겼습니다.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  english_pob_choice: forty days and forty nights
  chosen_korean: 사십 일과 사십 밤
  alternatives_korean:
  - 사십 일과 사십 밤 동안
  - 사십 주야
  lexicon: HALOT
  rationale: 히브리어의 관용적 병렬 표현을 그대로 살려 ‘사십 일과 사십 밤’으로 옮기되, 한국어에서 자연스럽게 읽히도록 ‘동안’을 덧붙이지 않았습니다.
- source_word: נָתַן
  english_pob_choice: gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 건네주셨습니다
  lexicon: HALOT
  rationale: 문맥상 언약 돌판을 모세에게 주시는 행위이므로 평이한 ‘주셨습니다’가 가장 직접적이며, ‘건네주셨습니다’는 불필요한 구체화를 낳습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신성 4문자 יְהוָה는 제목어 ‘주’가 아니라 고유명사 ‘야훼’로 옮겨 언약적 이름을 보존했습니다.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים / לֻחֹת הַבְּרִית
  english_pob_choice: the two stone tablets, the tablets of the covenant
  chosen_korean: 돌판 두 개, 곧 언약의 돌판들
  alternatives_korean:
  - 돌판 두 개, 곧 언약 판들
  - 돌로 된 두 판, 곧 언약의 판들
  lexicon: HALOT
  rationale: ‘돌판’은 לֻחֹת הָאֲבָנִים의 물질성을 자연스럽게 드러내고, 뒤의 재진술은 히브리어의 병치 구조를 따라 ‘곧 언약의 돌판들’로 보존했습니다.
theological_decisions:
- issue: 신성 4문자 יְהוָה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 단순한 칭호가 아니라 야훼의 언약 이름을 사용하므로, 이를 번역어 ‘주’로 치환하지 않고 음역으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
