  source_fidelity: 핵심 의미는 대체로 충실하지만, 원문의 לְרִשְׁתָּהּ는 하나님이 땅을 주시는 목적, 곧 이스라엘이 그 땅을 차지하는 것을 나타냅니다. 이를 더 직접적인 목적 구문으로 표현하는 것이 좋습니다. 또한 ‘목이 곧은’은 현대 한국어에서 히브리어 관용구의 뜻을 자연스럽게 전달하지 못합니다.
  naturalness: ‘알아야 합니다’도 가능하나, 본문의 권면·명령적 용법에는 합쇼체 명령형 ‘아십시오’가 더 직접적입니다. ‘목이 뻣뻣한’은 원문의 비유를 보존하면서 현대 독자에게도 완고함의 뜻을 자연스럽게 전달합니다.
  terminology: ‘야훼’, ‘하나님’, ‘의로움’, ‘좋은 땅’, ‘백성’은 적절합니다. 각주의 ‘כאן’은 한국어 각주에 남아 있는 부적절한 외국어 표기이므로 삭제해야 합니다.
