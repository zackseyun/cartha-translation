id: DEU.9.6
reference: Deuteronomy 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
  footnotes:
  - marker: a
    text: Or 'to inherit.' The Hebrew verb can denote receiving an inheritance, but in Deuteronomy it often includes the sense of taking possession of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 야훼 너희 하나님께서 이 좋은 땅을 너희에게 주셔서 차지하게 하시는 것이 너희의 의로움 때문이 아님을 알아야 합니다. 너희는 목이 곧은 백성이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘차지하게 하시는’은 כאן의 ‘상속하다/소유하다’ 계열 의미를 따르되, 신명기에서 자주 나타나는 ‘실제로 차지하여 들어감’의 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: So know
  chosen_korean: 그러므로 너희는 … 알아야 합니다
  alternatives_korean:
  - 그리고 너는 … 알아야 합니다
  - 알아야 합니다
  lexicon: HALOT
  rationale: 문맥상 앞 문장의 결론을 받는 권고이므로 ‘그러므로’로 연결하고, 명령형적 권면은 ‘알아야 합니다’로 자연스럽게 옮겼습니다.
- source_word: לֹא בְצִדְקָתְךָ
  english_pob_choice: not because of your righteousness
  chosen_korean: 너희의 의로움 때문이 아님
  alternatives_korean:
  - 너희의 의 때문에가 아님
  - 너희의 의로 말미암은 것이 아님
  lexicon: HALOT
  rationale: ב + צִדְקָה는 여기서 수단보다 근거/이유를 나타내므로, ‘~때문이 아님’으로 옮겨 원문의 논지를 분명히 했습니다.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  english_pob_choice: this good land
  chosen_korean: 이 좋은 땅
  alternatives_korean:
  - 이 복된 땅
  - 이 좋은 나라
  lexicon: HALOT
  rationale: 언약 약속의 정착지 맥락에서 ‘땅’이 가장 직접적이며, 지시어와 평가적 형용사도 그대로 살렸습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하게 하시는
  alternatives_korean:
  - 소유하게 하시는
  - 상속하게 하시는
  - 기업으로 받게 하시는
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘상속’보다 실제로 점유하여 들어가는 의미가 있어, 신명기 문맥을 살려 ‘차지하게 하시는’으로 옮겼습니다.
- source_word: קְשֵׁה עֹרֶף
  english_pob_choice: stiff-necked
  chosen_korean: 목이 곧은
  alternatives_korean:
  - 완고한
  - 고집 센
  - 목이 뻣뻣한
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유를 유지하기 위해 직역에 가까운 ‘목이 곧은’을 택해, 단순한 성격 평가보다 반항성과 완고함을 드러냈습니다.
theological_decisions:
- issue: 이스라엘이 땅을 받는 근거
  chosen_reading: 이스라엘의 의로움이 아니라 야훼의 주시는 행위가 근거라는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 겸손을 교훈하는 일반 진술로 완화할 수 있음
  - ‘의로움’ 대신 ‘선함’으로 부드럽게 옮길 수 있음
  rationale: 본문은 은혜로운 선물과 수혜자의 자격 없음 사이의 긴장을 직접 말하므로, 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘목이 곧은 백성’의 집단적 진술
  chosen_reading: 이스라엘 전체를 단수 집합명사로 부르는 방식은 한국어에서도 ‘너희’와 ‘백성’으로 유지했습니다.
  alternative_readings:
  - ‘너희 모두는 목이 곧은 백성이다’처럼 풀어쓸 수 있음
  rationale: 원문의 집단적 단수 호칭을 과도하게 확장하지 않고, 공동체 전체에 대한 판정을 그대로 전달했습니다.
  doctrine_reference: Translation philosophy §1
