  to: 그리고 나는 여러분의 죄, 곧 여러분이 만든 송아지를 가져다가 불에 태우고, 그것을 부수어 티끌처럼 아주 곱게 될 때까지 빻은 뒤, 그 티끌을 산에서 내려오는 물줄기[a]에 던졌습니다.
