  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
  footnotes:
  - marker: a
    text: Or 'the brook'; Hebrew נחל can refer to a stream, torrent-bed, or wadi.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 여러분의 죄, 곧 여러분이 만든 송아지를 가져다가 불에 태우고, 그것을 부수어 티끌처럼 아주 곱게 될 때까지 빻은 뒤, 그 티끌을 산에서 내려오는 물줄기[a]에 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내’. 히브리어 נחל은 시내, 급류가 흐르는 골짜기, 또는 와디를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  english_pob_choice: your sin
  chosen_korean: 여러분의 죄
  alternatives_korean:
  - 여러분의 죄된 것
  - 여러분의 속죄제물
  lexicon: HALOT
  rationale: 문맥상 금송아지를 우상 자체이자 이스라엘의 죄로 직접 동일시하므로, 이를 완화하지 않고 ‘여러분의 죄’로 옮겼습니다.
- source_word: הָעֵגֶל
  english_pob_choice: the calf
  chosen_korean: 송아지
  alternatives_korean:
  - 어린 황소
  - 송아지 형상
  lexicon: HALOT
  rationale: 금송아지 사건의 대상이므로 한국어로도 가장 직접적이고 자연한 ‘송아지’가 적절합니다.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ / וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  english_pob_choice: burned it with fire; then I crushed it, grinding it thoroughly
  chosen_korean: 불에 태우고, 그것을 잘게 부수어 가루처럼 아주 곱게 될 때까지 갈아낸 뒤
  alternatives_korean:
  - 불로 태우고, 그것을 부수어 철저히 갈아낸 뒤
  - 불에 사르고, 그것을 빻아 아주 곱게 만든 뒤
  lexicon: HALOT
  rationale: 연속 동작의 강도를 살리기 위해 ‘태우고 / 잘게 부수어 / 갈아낸 뒤’로 구분했고, הֵיטֵב는 ‘아주 곱게’로 완전성을 드러냈습니다.
- source_word: הַנַּחַל הַיֹּרֵד מִן הָהָר
  english_pob_choice: the stream that comes down from the mountain
  chosen_korean: 산에서 내려오는 시내
  alternatives_korean:
  - 산에서 흘러내리는 시내
  - 산에서 내려오는 개울
  lexicon: HALOT
  rationale: נחל의 범위를 지나치게 좁히지 않으면서도 현대 한국어에서 자연스러운 ‘시내’로 옮겼고, 진행형 뉘앙스는 ‘내려오는’으로 살렸습니다.
theological_decisions:
- issue: 금송아지를 ‘여러분의 죄’로 직접 부르는 표현
  chosen_reading: 본문의 날카로운 동일시를 살려 금송아지를 단순한 죄의 결과물이 아니라 ‘여러분의 죄’로 번역했습니다.
  alternative_readings:
  - 여러분의 죄된 것
  - 여러분이 만든 죄의 상징
  rationale: 히브리어는 우상과 죄를 직접 겹쳐 말하므로, 이를 완화하면 본문의 죄책 강조가 약해집니다.
  doctrine_reference: Translation philosophy §1, §3
