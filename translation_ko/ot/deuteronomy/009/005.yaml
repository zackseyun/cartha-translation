  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
  footnotes:
  - marker: a
    text: Or 'is dispossessing them before you.' The Hebrew verb can emphasize causing them to lose possession of the land, not only expelling them.
    reason: lexical_alternative
  - marker: b
    text: Or 'the promise that the LORD swore.' Hebrew 'word' here carries the sense of a pledged word in an oath context.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew ''your fathers'' refers specifically to the patriarchs named here: Abraham, Isaac, and Jacob.'
    reason: cultural_note
translation:
  language: ko
  text: 당신이 그들의 땅을 차지하려고 들어가는 것은 당신의 의로움이나 마음의 정직함 때문이 아닙니다. 이는 이 민족들의 악함 때문에 당신의 하나님 야훼께서 그들을 당신 앞에서 쫓아내시고[a], 또 당신의 조상들[c], 곧 아브라함과 이삭과 야곱에게 맹세하신 말씀[b]을 이루시려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 그 땅을 차지하지 못하게 하신다.’ 히브리어 동사는 그들이 땅의 소유를 잃게 하심을 강조할 수 있으며, 단순히 쫓아내는 것 이상의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘약속.’ 여기서 ‘말씀’은 맹세의 맥락에서 맹세로 보증된 약속을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조상들’은 여기서 뒤에 이름이 나오는 특정 족장들, 곧 아브라함과 이삭과 야곱을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: צִדְקָתְ/ךָ
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean: 의로움, 공의
  lexicon: H6666
  rationale: Hebrew צדקה in Deuteronomy 9:5 refers to covenantal standing and moral integrity before God, best rendered as '의' in a formal theological context.
- source_word: יֹשֶׁר
  english_pob_choice: uprightness
  chosen_korean: 곧음
  alternatives_korean: 정직, 곧은 마음
  lexicon: H3477
  rationale: יֹשֶׁר denotes moral straightness; '곧음' captures the relational integrity implied in the heart's posture better than abstract '정직'.
- source_word: רֶ֣שֶׁת
  english_pob_choice: possess
  chosen_korean: 차지하게 하시는
  alternatives_korean: 점령하다, 얻다
  lexicon: H3423
  rationale: The verb implies taking possession; '차지하게 하시는' emphasizes the divine agency in granting the land, aligning with the context of God's action.
- source_word: הַ/גּוֹיִ֣ם
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean: 이방, 나라들
  lexicon: H1471
  rationale: '''민족들'' is more precise than ''이방'' (which can imply outsiders) and fits the context of specific groups being displaced.'
- source_word: הַ/דָּבָ֗ר
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean: 약속, 말씀
  lexicon: H1697
  rationale: In the context of an oath, '말씀' conveys the binding nature of God's spoken promise, consistent with the footnote regarding 'pledged word'.
theological_decisions:
- decision: Divine Agency Emphasis
  rationale: The translation emphasizes that God is the primary actor ('주께서... 쫓아내시며', '이루려 하심') rather than Israel's merit, preserving the theological core that the land is a gift of grace and covenant fulfillment, not human achievement.
- decision: Covenantal Continuity
  rationale: Explicitly naming Abraham, Isaac, and Jacob as '조상' (fathers) maintains the continuity of the Abrahamic covenant, ensuring the theological link between the patriarchs and the current generation is clear.
