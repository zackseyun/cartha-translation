  to: 당신이 그들의 땅을 차지하려고 들어가는 것은 당신의 의로움이나 마음의 정직함 때문이 아닙니다. 이는 이 민족들의 악함 때문에 당신의 하나님 야훼께서 그들을 당신 앞에서 쫓아내시고[a], 또 당신의 조상들[c], 곧 아브라함과 이삭과 야곱에게 맹세하신 말씀[b]을 이루시려는 것입니다.
