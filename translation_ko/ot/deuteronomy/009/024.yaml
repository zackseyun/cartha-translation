  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''with the LORD''; the phrase means opposition to him, hence ''against the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 내가 당신들을 알게 된 날부터 야훼를 거역해 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘야훼와 함께’이지만, כאן의 의미는 그분에게 맞서는 대항이므로 ‘거역하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  english_pob_choice: rebellious
  chosen_korean: 거역해 왔습니다
  alternatives_korean:
  - 반역해 왔습니다
  - 반항해 왔습니다
  - 불순종해 왔습니다
  lexicon: HALOT
  rationale: ממרה는 단순한 기질보다 권위에 대한 대항과 거역을 뜻하므로, 관계적·언약적 뉘앙스를 살려 동사구로 옮겼습니다.
- source_word: הֱיִיתֶם
  english_pob_choice: have been
  chosen_korean: 거역해 왔습니다
  alternatives_korean:
  - 거역했습니다
  - 거역해 있었습니다
  lexicon: HALOT
  rationale: 완결된 과거보다 현재까지 이어진 누적 상태를 드러내기 위해 한국어 현재완료적 표현을 택했습니다.
- source_word: עִם יְהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼에 대하여
  - 야훼와
  lexicon: HALOT
  rationale: 히브리어 상으로는 직역하면 ‘야훼와 함께’이지만, ממרר와 결합해 적대·대항의 의미가 분명하므로 목적격 조사로 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기 본문의 여호와/주님 대치가 아니라, 자료 원문이 가진 여호와 이름을 학술적 음역인 ‘야훼’로 유지했습니다.
- source_word: מִיּוֹם דַּעְתִּי אֶתְכֶם
  english_pob_choice: from the day I knew you
  chosen_korean: 내가 당신들을 알게 된 날부터
  alternatives_korean:
  - 내가 당신들을 알던 날부터
  - 당신들을 내가 알던 날부터
  lexicon: HALOT
  rationale: דעת의 단순 인지보다 관계적 인지의 시작을 가리키므로 ‘알게 된 날부터’로 옮겨, 모세가 이스라엘을 처음 알게 된 시점을 드러냈습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 하나님의 언약적 고유명을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 이 절은 신명기에서 하나님의 이름 자체를 직접 사용하므로, 칭호로 완화하지 않고 고유명으로 드러내는 것이 원문 의도를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘with Yahweh’의 관계 의미
  chosen_reading: ‘야훼를 거역해 왔습니다’로 옮겨, 표면적 전치사보다 실제 문맥상 적대 의미를 드러냈습니다.
  alternative_readings:
  - ‘야훼와 함께 있었습니다’
  - ‘야훼에게 맞섰습니다’
  rationale: 문맥상 משה의 말은 언약 백성의 지속적 반항을 고발하는 것이므로, 한국어에서도 적대성을 분명히 해야 본문 의미가 전달됩니다.
  doctrine_reference: 'Deuteronomy 9 문맥: 광야에서의 이스라엘 반역 고발'
