base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord Yahweh.'' English ''Lord GOD'' reflects the combined title אֲדֹנָי יְהוִה while avoiding the awkward repetition ''Lord LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'with a mighty hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 저는 야훼께 기도하며 말했습니다. 「주 하나님, 주의 백성과 주의 기업을 멸하지 마십시오. 주께서 주의 위대하심으로 속량하신 그 백성, 주께서 강한 손으로 이집트에서 인도해 내신 그 백성을 말입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 "주 야훼"에 해당하는 결합 호칭인 אֲדֹנָי יְהוִה를 사용합니다.
    reason: source_note
  - marker: b
    text: 또는 "강한 손으로"로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלֵּ֣ל אֶל יְהוָה
  english_pob_choice: So I prayed to Yahweh
  chosen_korean: 그래서 저는 야훼께 기도하며
  alternatives_korean:
  - 그리고 저는 야훼께 기도하며
  - 그러자 저는 야훼께 기도하며
  lexicon: WLC; HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서 자연스러운 인과·전개로 살려 "그래서"를 두었고, יהוה는 프로젝트 기본값에 따라 "야훼"로 옮겼습니다.
- source_word: וָאֹמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 말하였습니다
  lexicon: WLC; HALOT
  rationale: 기도 뒤에 이어지는 직접 발화를 자연스럽게 연결하면서도, 평서 서술의 합쇼체를 유지하기 위해 "말했습니다"로 옮겼습니다.
- source_word: אֲדֹנָ֣/י יְהוִ֗ה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: WLC; HALOT
  rationale: 아도나이+여호와의 결합된 호칭을 한국어에서는 어색한 중복 없이 주권 호칭과 신명 호칭을 함께 살린 "주 하나님"으로 처리했습니다.
- source_word: עַמְּ/ךָ וְ/נַחֲלָ֣תְ/ךָ
  english_pob_choice: your people and your inheritance
  chosen_korean: 주의 백성과 주의 기업
  alternatives_korean:
  - 주의 백성과 주의 상속
  - 주의 백성과 주의 소유
  lexicon: WLC; HALOT
  rationale: עַם은 언약적 공동체를 드러내는 "백성"이 적합하고, נַחֲלָה는 소유 개념보다 언약적 배분·귀속을 살리는 "기업"이 한국어 성서어감과 원문의 결을 함께 반영합니다.
- source_word: אֲשֶׁ֥ר פָּדִ֖יתָ
  english_pob_choice: whom you redeemed
  chosen_korean: 주께서 속량하신
  alternatives_korean:
  - 주께서 구속하신
  - 주께서 구해 내신
  lexicon: HALOT
  rationale: פדה는 단순 구출보다 대가를 치르고 되찾는 뉘앙스가 있어, POB의 "redeemed"에 맞춰 "속량하신"을 선택했습니다.
- source_word: בְּ/גָדְלֶ֑/ךָ
  english_pob_choice: by your greatness
  chosen_korean: 주의 위대하심으로
  alternatives_korean:
  - 주의 크심으로
  - 주의 위대함으로
  lexicon: HALOT
  rationale: גֹדֶל의 추상명사성을 살리되 한국어에서 자연스럽고 경외감이 드러나도록 "위대하심"으로 옮겼습니다.
- source_word: בְּ/יָ֥ד חֲזָקָֽה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 강한 손을 가지고
  - 능한 손으로
  lexicon: HALOT
  rationale: 출애굽 공식 표현을 직역에 가깝게 유지하되, 한국어에서 굳어진 성서적 관용을 따라 "강한 손"으로 옮겼습니다.
theological_decisions:
- issue: 야훼/주 하나님의 병행 처리
  chosen_reading: 본문의 יְהוָה는 "야훼"로, 결합 호칭 אֲדֹנָי יְהוִה는 "주 하나님"으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 "주 하나님"으로 통일
  - 둘 다 "야훼"로 통일
  rationale: 한 절 안에서 단순 반복을 피하고, 본문이 드러내는 두 요소—주권 호칭과 언약 სახელ명—를 한국어에서도 구분해 보여 주기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
