  - 다베라에
  lexicon: HALOT
  rationale: 장소명은 음역하고, מקום을 나타내는 전치사는 한국어에서는 가장 자연스러운 ‘-에서’로 옮겼습니다.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
