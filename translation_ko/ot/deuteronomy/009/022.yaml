  lexicon: HALOT
  rationale: 이 표현은 고유 지명으로 굳어져 있으므로 음역을 유지했습니다. 구성 요소의 직역은 의미를 드러내지만 장소명이라는 사실을 흐릴 수 있습니다.
- source_word: מַקְצִפִים הֱיִיתֶם
  english_pob_choice: you kept provoking ... to anger
  chosen_korean: 계속 격노하게 하였습니다
  alternatives_korean:
  - 분노하게 하였습니다
  - 계속 진노하게 하였습니다
  lexicon: HALOT
  rationale: היה + 분사 구조는 단순 과거보다 지속·반복의 뉘앙스를 가지므로 ‘계속’으로 살렸고, קצף의 사역적 의미는 ‘격노하게 하다’로 옮겼습니다.
- source_word: אֶת יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본문의 신명기적 언약명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
