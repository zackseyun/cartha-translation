translation:
  language: ko
  text: 그리고 다베라와 맛사와 기브롯핫다아와에서 여러분은 야훼를 계속 격노하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기브롯핫다아와는 지명이며, 문자적으로는 ‘욕망의 무덤들’ 또는 ‘갈망의 무덤들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  english_pob_choice: and at Taberah
  chosen_korean: 다베라에서
  alternatives_korean:
  - 다베라 안에서
  - 다베라에
  lexicon: HALOT
  rationale: 장소명은 음역하고, מקום을 나타내는 전치사는 한국어에서는 가장 자연스러운 ‘-에서’로 옮겼습니다.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  english_pob_choice: and at Kibroth-hattaavah
  chosen_korean: 기브롯핫다아와에서
  alternatives_korean:
  - 기브롯핫다아와의 무덤들에서
  - 기브롯 핫다아와에서
  lexicon: HALOT
  rationale: 이 표현은 고유 지명으로 굳어져 있으므로 음역을 유지했습니다. 구성 요소의 직역은 의미를 드러내지만 장소명이라는 사실을 흐릴 수 있습니다.
- source_word: מַקְצִפִים הֱיִיתֶם
  english_pob_choice: you kept provoking ... to anger
  chosen_korean: 계속 격노하게 하였습니다
  alternatives_korean:
  - 분노하게 하였습니다
  - 계속 진노하게 하였습니다
  lexicon: HALOT
  rationale: היה + 분사 구조는 단순 과거보다 지속·반복의 뉘앙스를 가지므로 ‘계속’으로 살렸고, קצף의 사역적 의미는 ‘격노하게 하다’로 옮겼습니다.
- source_word: אֶת יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본문의 신명기적 언약명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 직접 하나님의 언약명 YHWH를 사용하므로, 일반 대체어보다 고유명 표기를 유지해 본문의 직접성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: היה + 분사 구조의 상(Aspect)
  chosen_reading: 계속 격노하게 하였습니다
  alternative_readings:
  - 격노하게 하였습니다
  - 격노시키고 있었습니다
  rationale: 분사와 היה의 결합은 반복적·지속적 행위를 나타내므로, 단발적 과거보다 지속성을 드러내는 표현을 택했습니다.
  doctrine_reference: WLC Hebrew participial/periphrastic construction
