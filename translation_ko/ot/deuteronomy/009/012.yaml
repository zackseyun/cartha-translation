base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
  footnotes:
  - marker: a
    text: Or 'a molten image.' The Hebrew term refers to an image formed by casting metal.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “일어나 이곳에서 속히 내려가십시오. 네가 이집트에서 데리고 나온 네 백성이 스스로 타락했습니다. 그들은 내가 그들에게 명령한 길에서 속히 벗어나, 자기들을 위해 주조한 형상[a]을 만들었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주조한 형상’은 금속을 부어 만들어 낸 형상을 가리킵니다.
    reason: מַסֵּכָה의 제작 방식과 물질적 구체성을 설명하는 어휘 주석입니다.
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 고유명사 관례
  rationale: POB 기본 원칙에 따라 언약적 신명은 학술적 음역인 ‘야훼’로 옮겨 원문 고유성을 드러냈습니다.
- source_word: שִׁחֵת
  english_pob_choice: have corrupted themselves
  chosen_korean: 스스로 타락하였습니다
  alternatives_korean:
  - 스스로 부패하였습니다
  - 자기들을 멸망시켰습니다
  lexicon: HALOT
  rationale: 문맥상 도덕적·언약적 타락을 가리키므로, reflexive 뉘앙스를 살리되 한국어에서 자연스러운 ‘스스로 타락하다’로 옮겼습니다.
- source_word: סָרוּ מִן הַדֶּרֶךְ
  english_pob_choice: have quickly turned aside from the way
  chosen_korean: 길에서 속히 벗어났습니다
  alternatives_korean:
  - 길에서 빨리 돌아섰습니다
  - 길에서 급히 치우쳤습니다
  lexicon: HALOT
  rationale: ‘דרך’의 비유적 ‘길/행로’를 살리면서, 명령받은 규범에서 이탈했다는 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: מַסֵּכָה
  english_pob_choice: a cast image
  chosen_korean: 부어 만든 우상
  alternatives_korean:
  - 주조한 형상
  - 주조 우상
  - 부어 만든 형상
  lexicon: HALOT
  rationale: 이 명사는 금속을 부어 만든 형상을 가리키므로, 단순한 ‘우상’보다 제작 방식을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘네가 이집트에서 데리고 나온 네 백성’이라는 거리를 둔 책망의 어조
  chosen_reading: 관계성은 유지하되, 하나님이 모세를 책망하시는 날카로운 거리감을 그대로 살렸습니다.
  alternative_readings:
  - ‘내 백성’처럼 완화해서 옮기기
  - 의미를 풀어 공손한 설명문처럼 바꾸기
  rationale: 히브리어는 언약 공동체를 상기시키면서도 책임을 모세에게 되돌리는 수사적 긴장을 지니므로, 그 불편한 긴장을 완화하지 않았습니다.
  doctrine_reference: '번역 원칙: 신학적 긴장 보존'
- issue: מַסֵּכָה의 구체성
  chosen_reading: ‘부어 만든 우상’으로 옮겨 형상의 제작 방식과 우상성 둘 다를 드러냈습니다.
  alternative_readings:
  - 단순히 ‘우상’으로 번역
  - ‘주조한 형상’으로만 번역
  rationale: 원문은 추상적 범주보다 물질적 제작 행위를 강조하므로, 우상숭배의 구체적 형태를 지우지 않기 위해 결합 표현을 사용했습니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 구체성 보존'
