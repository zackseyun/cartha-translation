source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
  footnotes:
  - marker: a
    text: Hebrew literally, 'you rebelled against the mouth of the LORD your God,' an idiom meaning his command or word.
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not trust him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you did not obey his voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분을 가데스 바네아에서 보내셨을 때, “올라가서 내가 여러분에게 준 그 땅을 차지하라” 하고 말씀하셨습니다. 그런데 여러분은 야훼 여러분의 하나님의 명령을 거역하고[a] 그분을 믿지 않았으며[b] 그분의 음성에 귀를 기울이지도 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼 여러분 하나님의 입을 거슬러’라고 하며, 이는 그분의 명령이나 말씀을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분을 신뢰하지 않았으며’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분의 음성에 순종하지도 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  english_pob_choice: And when ... sent
  chosen_korean: '...보내시며'
  alternatives_korean:
  - '...보내셨을 때'
  - '...보내실 때'
  lexicon: WLC; HALOT
  rationale: 히브리어 부정사구는 시간적 배경을 여는 용법이므로, 한국어에서는 앞절과 자연스럽게 이어지는 연결형으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC; POB doctrinal default
  rationale: 여기서는 신적 이름이 직접 나오므로, POB 기본 원칙에 따라 칭호가 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  english_pob_choice: from Kadesh-barnea
  chosen_korean: 가데스 바네아에서
  alternatives_korean:
  - 가데스-바네아에서
  - 가데스바네아에서
  lexicon: WLC
  rationale: 지명은 현대 한국어 표기 관행에 따라 음역했고, 한국어 문맥에서 자연스러운 조사 결합을 택했습니다.
- source_word: וּרְשׁוּ
  english_pob_choice: take possession of
  chosen_korean: 차지하라
  alternatives_korean:
  - 소유하라
  - 점유하라
  lexicon: WLC; HALOT
  rationale: 정복-토지 문맥에서 ירשׁ는 단순한 ‘소유’보다 실제로 땅을 확보해 차지하는 행위를 가리키므로, 현대 한국어에서는 ‘차지하다’가 가장 직접적입니다.
- source_word: אֶת פִּי יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the command of Yahweh your God
  chosen_korean: 야훼 여러분의 하나님께 반역하여
  alternatives_korean:
  - 야훼 여러분의 하나님의 명령을 거슬러
  - 야훼 여러분의 하나님의 입을 거슬러
  lexicon: WLC; HALOT
  rationale: 히브리어의 ‘입’은 관용적으로 명령/말씀을 뜻하지만, POB의 영어 판단을 따라 의미를 풀어 한국어에서는 ‘반역하다’와 함께 자연스럽게 전달했습니다.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  english_pob_choice: you did not believe him
  chosen_korean: 그분을 믿지 않았고
  alternatives_korean:
  - 그분을 신뢰하지 않았고
  - 그분께 믿음을 두지 않았고
  lexicon: WLC; HALOT
  rationale: אמן의 핵심은 여기서 ‘믿다/신뢰하다’이므로, 문맥상 가장 직접적인 ‘믿지 않았다’를 선택했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלֽוֹ
  english_pob_choice: or listen to his voice
  chosen_korean: 그분의 음성에 귀를 기울이지도 않았습니다
  alternatives_korean:
  - 그분의 음성을 듣지도 않았습니다
  - 그분의 음성에 순종하지도 않았습니다
  lexicon: WLC; HALOT
  rationale: שמע בקול은 ‘듣다’와 ‘순종하다’의 중간 범위를 가지므로, ‘귀를 기울이다’로 소리를 듣지 않음과 응답하지 않음을 함께 살렸습니다.
theological_decisions:
- issue: 히브리어 관용구 אֶת־פִּי의 처리
  chosen_reading: 한국어 본문에서는 ‘반역하여’로 흡수해 ‘입’을 직역하지 않았습니다.
  alternative_readings:
  - 그분의 입을 거슬러
  - 그분의 명령을 거슬러
  rationale: ‘입’ 직역은 한국어에서 의미가 불명확해질 수 있어, 본문의 핵심 대립인 언약적 불순종을 드러내는 방향으로 옮겼습니다. 다만 관용구 자체는 해설에서 추적 가능해야 하므로 주석으로 남길 수 있습니다.
  doctrine_reference: POB translation philosophy §1, §5
- issue: 부정문의 관계와 의미의 중첩
  chosen_reading: ‘믿지 않았고 … 귀를 기울이지도 않았습니다’로 두 부정을 모두 보존했습니다.
  alternative_readings:
  - 믿지 않고 귀를 기울이지도 않았습니다
  - 믿지도 듣지도 않았습니다
  rationale: 본문은 불신과 불순종을 병렬로 강조하므로, 두 절을 축소하지 않고 각각 드러내는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: WLC syntax; POB optimal-equivalence
