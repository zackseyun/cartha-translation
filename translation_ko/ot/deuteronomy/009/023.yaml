  rationale: 원문의 시간적 배경, 땅으로 올라가라는 명령, 땅을 차지하라는 명령, 하나님의 명령을 거역함, 불신, 그리고 그분의 음성에 귀 기울이지 않음을 모두 보존했습니다. ‘명령’을 본문에 명시하되, 문자적 ‘입’ 관용구는 각주에서 추적 가능하게 했습니다. 신명 표기와 청자 호칭을 일관되게 정리하고 각주 표지를 해당 표현에 연결했습니다.
