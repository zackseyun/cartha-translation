id: DEU.9.14
reference: Deuteronomy 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
  footnotes:
  - marker: a
    text: Or 'Let me alone, and I will destroy them and blot out their name from under heaven.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from under the heavens'; the phrase means removal from the earth, that is, from human remembrance and existence.
    reason: cultural_note
translation:
  language: ko
  text: 내게서 떠나십시오. 그러면 내가 그들을 멸하고 하늘 아래에서 그들의 이름을 지워 버리겠으며, 당신을 그들보다 더 강하고 더 많은 큰 민족으로 만들겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내게서 떠나십시오’이며, 문맥상 더 강한 중단 요구를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘하늘들 아래에서’로, 곧 땅 위의 인간 기억과 존재에서 완전히 제거된다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  english_pob_choice: Leave me alone
  chosen_korean: 내게서 떠나십시오
  alternatives_korean:
  - 저를 내버려 두십시오
  - 저에게서 물러나십시오
  lexicon: HALOT
  rationale: 히브리어 명령형은 단순한 ‘혼자 있게 해 달라’는 요청보다 대화를 중단하고 물러나라는 강한 관용 표현이므로, 합쇼체에서 자연스럽고 직접적인 ‘내게서 떠나십시오’로 옮겼습니다.
- source_word: וְאַשְׁמִידֵם
  english_pob_choice: so that I may destroy them
  chosen_korean: 그러면 내가 그들을 멸하고
  alternatives_korean:
  - 그리고 내가 그들을 멸하겠으며
  - 그래서 내가 그들을 멸하고
  lexicon: HALOT
  rationale: שׁמד는 단순한 손상이 아니라 멸망·멸절의 의미가 강하므로 ‘멸하다’로 옮겼고, 앞선 명령에 대한 결과 흐름을 자연스럽게 살리기 위해 ‘그러면’으로 연결했습니다.
- source_word: וְאֶמְחֶה אֶת שְׁמָם
  english_pob_choice: and blot out their name
  chosen_korean: 그들의 이름을 지워 버리겠으며
  alternatives_korean:
  - 그들의 이름을 지우겠으며
  - 그들의 이름을 말살하겠으며
  lexicon: HALOT
  rationale: מחה는 기록과 기억에서 지우는 이미지를 갖기 때문에, 한국어 관용으로는 ‘지워 버리다’가 ‘blot out’의 의미와 어감 모두를 잘 살립니다.
- source_word: מִתַּחַת הַשָּׁמַיִם
  english_pob_choice: from under the heavens
  chosen_korean: 하늘 아래에서
  alternatives_korean:
  - 하늘 아래로부터
  - 하늘 밑에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 복수형 ‘하늘들’이지만, 한국어에서는 ‘하늘 아래에서’가 원문의 우주적 범위를 자연스럽게 전달합니다.
- source_word: לְגוֹי עָצוּם וָרָב
  english_pob_choice: into a nation mightier and more numerous
  chosen_korean: 더 강하고 더 많은 큰 민족으로
  alternatives_korean:
  - 더 강하고 더 큰 민족으로
  - 더 강대하고 더 많은 민족으로
  lexicon: HALOT
  rationale: גוֹי는 ‘민족’이 적절하고, עָצוּם과 רָב의 병렬 비교를 각각 힘과 수의 증가로 살리기 위해 ‘더 강하고 더 많은’으로 옮겼습니다. ‘큰’은 גוי의 규모·위상을 보완하는 표현입니다.
theological_decisions:
- issue: 하나님의 직접 심판 선언과 모세를 통한 대체 민족 약속의 긴장
  chosen_reading: 본문의 위협과 약속을 완화하지 않고, 하나님의 직접 발화로서 그대로 전달했습니다.
  alternative_readings:
  - 수사적 시험으로 암시해 부드럽게 번역하기
  - 의도를 설명하는 주석을 본문에 넣기
  rationale: 히브리어는 실제 선언 형식으로 심판과 대체 약속을 병치하므로, 번역은 그 긴장을 보존해야 합니다. 본문에서 해석을 미리 정리하면 원문의 날카로움이 약화됩니다.
  doctrine_reference: 본문의 신학적 긴장 보존
- issue: ‘하늘 아래’의 범위와 삭제의 강도
  chosen_reading: ‘하늘 아래에서’와 ‘지워 버리겠으며’로, 존재와 기억에서의 제거를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘죽이겠다’로만 옮기기
  - 문화적 설명을 본문에 풀어 쓰기
  rationale: 문맥상 단순한 육체적 제거가 아니라 명예와 기억의 소거까지 포함하는 표현이므로, POB의 의미를 살려 번역했습니다.
  doctrine_reference: 기억과 존재의 제거에 대한 성서적 표현
