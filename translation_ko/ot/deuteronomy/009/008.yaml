  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
  footnotes:
  - marker: a
    text: Or 'At Horeb' or 'And at Horeb'; the Hebrew conjunction may simply continue the narrative, though here it likely adds emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD was angry with you to destroy you' or 'the LORD was angry enough with you to destroy you.' The Hebrew links the LORD's anger directly with the threatened destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 호렙에서 여러분은 야훼를 격노하게 했고, 야훼께서는 여러분을 멸망시키려고 여러분에게 진노하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호렙에서’, 혹은 ‘그리고 호렙에서’. 히브리어 접속사는 단순히 이야기를 이어 줄 수도 있으나, 여기서는 강조를 더하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분에게 진노하셔서 여러분을 멸망시키려고 하셨습니다’. 히브리어는 야훼의 진노와 뒤따르는 멸망 의도를 직접 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  english_pob_choice: Even at Horeb
  chosen_korean: 호렙에서
  alternatives_korean:
  - 호렙에서도
  - 심지어 호렙에서도
  - 그리고 호렙에서
  lexicon: HALOT
  rationale: הוּ/וּבְ는 여기서 단순 접속보다 서술을 이어 가며 강조하는 기능이 강하므로, 한국어에서는 과잉 해설 없이 장소 부사어로 두되 문맥의 책망성을 살렸습니다.
- source_word: הִקְצַפְתֶּם אֶת יְהוָה
  english_pob_choice: you provoked Yahweh to wrath
  chosen_korean: 야훼를 격노하게 했고
  alternatives_korean:
  - 야훼를 노하게 했고
  - 야훼의 진노를 불러일으켰고
  - 야훼를 격분하게 했고
  lexicon: HALOT
  rationale: Hiphil의 인과적 의미를 살려 ‘격노하게 하다’로 옮겼고, 직접목적어를 살린 구조를 유지했습니다.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  english_pob_choice: Yahweh was angry with you
  chosen_korean: 야훼께서는 여러분에게 진노하셨습니다
  alternatives_korean:
  - 야훼께서는 여러분을 향해 분노하셨습니다
  - 야훼께서는 여러분에게 노하셨습니다
  - 야훼께서는 여러분에게 격노하셨습니다
  lexicon: HALOT
  rationale: אנף의 강한 분노를 ‘진노하다’로 옮겨 앞 절의 ‘격노하게 하다’와 어조를 맞췄습니다. בְּכֶם은 분노의 대상을 나타내므로 ‘여러분에게’가 자연합니다.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  english_pob_choice: to destroy you
  chosen_korean: 멸망시키려고
  alternatives_korean:
  - 멸망시키기 위하여
  - 멸절시키려고
  - 없애려고
  lexicon: HALOT
  rationale: הִשְׁמִיד의 파괴·멸절 의미를 한국어 성서체에서 자연스러운 ‘멸망시키다’로 옮겨 결과의 긴박함을 살렸습니다.
