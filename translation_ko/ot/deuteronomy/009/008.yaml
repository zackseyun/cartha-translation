translation:
  language: ko
  text: 호렙에서도 여러분은 야훼를 격노하게 했고, 야훼께서는 여러분에게 진노하셔서 여러분을 멸망시키려고 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호렙에서’ 또는 ‘그리고 호렙에서’. 히브리어 접속사는 단순히 이야기를 이어 줄 수도 있으나, 여기서는 강조를 더하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서는 여러분을 멸망시키실 만큼 여러분에게 진노하셨습니다’. 히브리어는 야훼의 진노와 뒤따르는 멸망을 직접 연결하며, 그 관계는 목적 또는 결과로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  english_pob_choice: Even at Horeb
  chosen_korean: 호렙에서
  alternatives_korean:
