source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
  footnotes:
  - marker: a
    text: Or 'against Aaron'; the Hebrew preposition can be rendered either way in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아론에게 매우 진노하셔서 그를 멸하려 하셨습니다. 그때 나도 아론을 위해 기도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아론을 향하여’. 이 문맥에서는 히브리어 전치사 ב의 의미를 관계적으로 ‘~에게’ 또는 대립적으로 ‘~을 향하여/대하여’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  english_pob_choice: And with Aaron / against Aaron
  chosen_korean: 아론에게
  alternatives_korean:
  - 아론에 대하여
  - 아론을 향하여
  lexicon: HALOT
  rationale: 진노의 대상 표지를 한국어에서는 여격 조사로 자연스럽게 풀어, ‘야훼께서 아론에게 진노하셨다’라는 관계를 분명히 했습니다.
- source_word: הִתְאַנַּף ... מְאֹד
  english_pob_choice: was very angry
  chosen_korean: 매우 진노하셔서
  alternatives_korean:
  - 몹시 분노하셔서
  - 크게 진노하셔서
  lexicon: HALOT
  rationale: 히트파엘 동사의 강한 분노를 ‘진노하시다’로 살리고, מְאֹד의 강도를 ‘매우’로 옮겨 원문의 중첩 강세를 유지했습니다.
- source_word: לְהַשְׁמִידוֹ
  english_pob_choice: to destroy him
  chosen_korean: 그를 멸하려 하셨습니다
  alternatives_korean:
  - 그를 멸망시키려 하셨습니다
  - 그를 파멸시키려 하셨습니다
  lexicon: HALOT
  rationale: שׁמד의 파괴적 의미를 살리되, 문맥상 실제 실행 직전의 의도를 나타내는 부정사 구조를 한국어의 ‘-하려 하셨습니다’로 풀었습니다.
- source_word: וָאֶתְפַּלֵּל
  english_pob_choice: and I prayed
  chosen_korean: 기도했습니다
  alternatives_korean:
  - 간구했습니다
  - 중보했습니다
  lexicon: HALOT
  rationale: 플랄의 기본 의미를 따라 ‘기도하다’로 옮기고, ‘아론을 위해’가 이미 중보적 의미를 드러내므로 별도의 해석어는 과도하다고 보았습니다.
- source_word: בְּעַד אַהֲרֹן
  english_pob_choice: for Aaron
  chosen_korean: 아론을 위해
  alternatives_korean:
  - 아론을 위하여
  - 아론을 위하여 간구했습니다
  lexicon: HALOT
  rationale: 기도의 수혜 대상을 나타내는 בְּעַד을 한국어의 목적 표현 ‘~을 위해’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 여호와 대체어가 아닌 신명기 본문의 고유한 신명사 יְהוָה를 쓰므로, 프로젝트 기준에 따라 ‘야훼’로 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
