  lexicon: HALOT
  rationale: 현재적/임박한 진행을 자연스러운 한국어로 풀어, 시점 강조를 유지하면서도 어색한 직역을 피했습니다.
- source_word: לָרֶשֶׁת
  english_pob_choice: to dispossess
  chosen_korean: 몰아내게 됩니다
  alternatives_korean:
  - 차지하게 됩니다
  - 상속하게 됩니다
  lexicon: HALOT
  rationale: 정복 문맥에서 기존 거주자를 밀어내는 의미가 핵심이므로, 단순한 '차지하다'보다 결과를 분명히 드러내는 표현을 택했습니다.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  english_pob_choice: nations greater and mightier than you
  chosen_korean: 여러분보다 더 크고 더 강한 민족들
  alternatives_korean:
  - 여러분보다 더 크고 더 강대한 민족들
