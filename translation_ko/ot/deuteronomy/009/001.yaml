  - 하늘에 닿는 큰 성읍들과 견고한 성읍들을
  lexicon: HALOT
  rationale: '''하늘까지''는 히브리어의 과장법을 그대로 살리면서 한국어에서 자연스러운 이미지로 전달하며, ''견고한''은 요새화된 성읍의 성격을 반영합니다.'
theological_decisions:
- issue: 정복 명령의 직설성과 완곡화
  chosen_reading: '''몰아내게 됩니다''로 옮겨, 땅 점유가 단순 소유가 아니라 기존 거주 집단을 축출하는 정복 맥락임을 드러냈습니다.'
  alternative_readings:
  - 차지하게 됩니다
  - 차지할 것입니다
  rationale: 히브리어 ירשׁ는 이 문맥에서 상속보다 정복을 통한 점유를 포함하므로, 본문의 역사적·신학적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 신명기 9장의 정복-심판 문맥
- issue: '''하늘까지''의 과장법'
  chosen_reading: '''하늘까지 닿는''으로 옮겨, 성읍의 높이와 위압감을 나타내는 수사적 과장임을 보존했습니다.'
  alternative_readings:
  - 하늘에 닿는
  - 하늘까지 높이
  rationale: 본문은 문자적 측정보다는 극도의 견고함을 강조하는 비유적 표현이므로, 한국어에서도 그 과장성을 유지하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §1, §6
