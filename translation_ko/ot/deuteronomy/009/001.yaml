  lexicon: HALOT
  rationale: גויים는 여기서 개별 국가 집단보다 민족들로 옮기는 것이 자연스럽고, 크기와 힘의 이중 비교를 각각 살렸습니다.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם
  english_pob_choice: with cities great and fortified up to the heavens
  chosen_korean: 하늘까지 닿는 큰 성읍들과 견고한 성읍들을
  alternatives_korean:
