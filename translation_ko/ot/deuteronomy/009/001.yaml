  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
  footnotes:
  - marker: a
    text: Or 'to take possession of'; the Hebrew verb can mean inherit/possess, but here in a conquest context it carries the sense of dispossessing prior inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the heavens,' a hyperbolic expression for very high fortifications.
    reason: cultural_note
translation:
  language: ko
  text: 들으십시오, 이스라엘. 오늘 여러분은 요르단을 건너 들어가서, 여러분보다 더 크고 더 강한 민족들 — 곧 하늘까지 닿는 큰 성읍들과 견고한 성읍들을 가진 민족들 —을 몰아내게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ירשׁ는 여기서 ‘차지하다’보다 ‘기존 거주자를 몰아내고 차지하다’의 뜻을 강하게 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘까지’는 매우 높고 견고한 성벽을 가리키는 히브리어의 과장법입니다.
    reason: cultural_note
