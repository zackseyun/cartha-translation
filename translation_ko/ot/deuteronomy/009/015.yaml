  source_fidelity: ‘내려오는데’는 히브리어의 단순 접속/상황절 가능성 가운데 상황적·시간적 관계를 다소 특정합니다. 또한 ‘불 속에서 타오르다’는 בָּאֵשׁ의 자연스러운 한국어 대응이 아니며, 산 자체가 불 속에 있다는 뜻으로 들릴 수 있습니다. ‘불타고 있었다’가 원문의 현재적 상태를 자연스럽고 충실하게 옮깁니다.
  naturalness: 수정문은 현대 표준어 합쇼체에서 자연스럽습니다. ‘돌아서’는 פנה의 연속 동작을 무리 없이 나타내며, ‘내 두 손에 있었습니다’는 돌판을 들고 있던 뜻을 간결하게 전달합니다.
  terminology: ‘언약’, ‘돌판’은 이 문맥의 정착된 성경 용어로 적절합니다. ‘두 돌판’과 ‘두 손’을 모두 유지했습니다.
