    rationale: בֹּעֵר בָּאֵשׁ는 ‘불타고 있었다/불에 타고 있었다’로 자연스럽게 옮길 수 있습니다. ‘불 속에서’는 산이 불의 내부에 위치한다는 공간적 그림을 불필요하게 부각합니다.
