id: DEU.9.15
reference: Deuteronomy 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וּ/שְׁנֵי֙ לֻחֹ֣ת הַ/בְּרִ֔ית עַ֖ל שְׁתֵּ֥י יָדָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
  footnotes:
  - marker: a
    text: 'Or, more formally, ''and the mountain was burning with fire.'' The Hebrew conjunction can be read as simple coordination, though the context supports a circumstantial sense: ''while the mountain was burning with fire.'''
    reason: alternative_reading
  - marker: b
    text: Literally, 'upon my two hands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 몸을 돌려 산에서 내려오는데, 산은 불 속에서 타오르고 있었고, 언약의 두 돌판은 내 두 손에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, “산은 불 속에서 타오르고 있었습니다.” 히브리어 접속사는 단순한 병렬로도 읽을 수 있으나, 문맥상 동시 상황으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “내 두 손 위에”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן וָאֵרֵד
  english_pob_choice: So I turned and came down
  chosen_korean: 내가 몸을 돌려 ... 내려오는데
  alternatives_korean:
  - 그리고 내려왔습니다
  - 돌아서 내려왔습니다
  lexicon: HALOT
  rationale: פּנה와 ירד의 연속 동작을 자연스러운 서술로 옮기되, ‘몸을 돌려’로 첫 동작을 분명히 하고 ‘내려오는데’로 뒤 문장의 동시성을 살렸습니다.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  english_pob_choice: and the mountain was burning with fire
  chosen_korean: 산은 불 속에서 타오르고 있었고
  alternatives_korean:
  - 산은 불로 타오르고 있었고
  - 산이 불에 타고 있었고
  lexicon: HALOT
  rationale: בֹּעֵר와 בָּאֵשׁ의 중첩을 살려 단순히 ‘불타다’보다 강한 영상성을 유지했고, ‘불 속에서’로 히브리어의 전치사적 중첩을 반영했습니다.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  english_pob_choice: the two tablets of the covenant
  chosen_korean: 언약의 두 돌판
  alternatives_korean:
  - 언약의 두 판
  - 언약의 두 석판
  lexicon: HALOT
  rationale: לֻחֹת는 이 문맥에서 돌판이므로 ‘돌판’으로 구체화했고, הַבְּרִית는 관용적으로 ‘언약’으로 옮겨 해당 명칭을 유지했습니다.
- source_word: עַל שְׁתֵּי יָדָי
  english_pob_choice: were in my two hands
  chosen_korean: 내 두 손에 있었습니다
  alternatives_korean:
  - 내 두 손 위에 있었습니다
  - 두 손에 들고 있었습니다
  lexicon: HALOT
  rationale: עַל의 직역인 ‘위에’보다, 돌판을 들고 있는 상태를 한국어로 가장 분명하게 드러내는 ‘내 두 손에’가 문맥상 적절합니다.
theological_decisions:
- issue: 산의 불타는 장면과 모세의 하산 동시성
  chosen_reading: 산이 타오르는 상황과 모세의 하산을 나란히 제시하는 서술로 읽었습니다.
  alternative_readings:
  - 불타는 중에 내려왔다는 시간적 배경으로 읽기
  - 단순한 순차 서술로 읽기
  rationale: 히브리어는 접속을 통해 장면을 병렬로 놓으며, 영어 POB도 이를 살려 동시성을 암시합니다. 한국어에서는 과도한 해석어를 피하면서도 현장감을 유지했습니다.
  doctrine_reference: 서술 문맥 및 히브리어 접속법
