  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
  footnotes:
  - marker: a
    text: Or "going before you" for "crossing over before you." The Hebrew participle literally speaks of the LORD as the one crossing over ahead of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or "a devouring fire."
    reason: lexical_alternative
  - marker: c
    text: Or "you will drive them out" for "you will dispossess them."
    reason: lexical_alternative
  - marker: d
    text: Or "as the LORD spoke to you"; the sense is that this will happen in accordance with the LORD's prior word to Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 오늘 너희는 알아야 합니다. 야훼, 곧 너희 하나님이 너희 앞에서 건너가시는 분이시며, 삼키는 불이십니다. 그분이 그들을 멸하시고 너희 앞에서 그들을 굴복시키실 것이며, 너희는 그들을 차지하고 그들을 신속히 멸망시킬 것입니다. 이는 야훼께서 너희에게 말씀하신 그대로입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 앞에서 가시는 분”으로도 옮길 수 있습니다. 히브리어 분사 표현은 여호와께서 이스라엘 앞서 실제로 건너가시는 분이심을 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “삼켜 버리는 불”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들을 몰아내고”입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “야훼께서 너희에게 말씀하신 대로”입니다. 뜻은 야훼의 이전 말씀에 따라 이 일이 이루어진다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  english_pob_choice: So know today
  chosen_korean: 그러므로 오늘 너희는 알아야 합니다
  alternatives_korean:
  - 오늘 알아야 합니다
  - 그러므로 오늘 알아야 합니다
  lexicon: HALOT
  rationale: 앞 절과의 논리적 연결을 드러내는 ולכן/so의 뉘앙스를 살리면서, 현대 한국어에서 자연스러운 권면형으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사는 '야훼'로 옮겨, 호칭으로 대체하지 않고 원문이 가진 고유성을 보존했습니다.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  english_pob_choice: is the one crossing over before you
  chosen_korean: 너희 앞에서 건너가시는 분이시며
  alternatives_korean:
  - 너희 앞에서 건너가시는 분
  - 너희 앞에서 가시는 분
  lexicon: HALOT
  rationale: עָבַר의 구체적 이미지를 살려 '건너가시는'으로 옮겼고, '앞에서'를 유지해 전투적·공간적 방향성을 보존했습니다.
- source_word: אֵשׁ אֹכְלָה
  english_pob_choice: a consuming fire
  chosen_korean: 삼키는 불이십니다
  alternatives_korean:
  - 소멸시키는 불이십니다
  - 먹어 치우는 불이십니다
  lexicon: HALOT
  rationale: 관용적 표현의 파괴성과 심판성을 직접 드러내는 쪽을 택하되, 한국어에서 자연스러운 이미지인 '삼키는 불'로 옮겼습니다.
- source_word: וְהוֹרַשְׁתָּם
  english_pob_choice: you will dispossess them
  chosen_korean: 너희는 그들을 차지하고
  alternatives_korean:
  - 너희는 그들을 몰아내고
  - 너희는 그들을 점유할 것이고
  lexicon: HALOT
  rationale: ירש의 토지-상속/점유 의미를 반영해 단순한 축출보다 '차지하고'로 옮겼습니다. 문맥상 언약 땅의 점유가 핵심입니다.
- source_word: וְהַֽאַבַדְתָּם
  english_pob_choice: make them perish
  chosen_korean: 그들을 신속히 멸망시킬 것입니다
  alternatives_korean:
  - 그들을 빨리 멸망시킬 것입니다
  - 그들을 신속히 사라지게 할 것입니다
  lexicon: HALOT
  rationale: 앞의 '멸하시고'와 구별되도록 אַבַד의 파멸·소멸 뉘앙스를 살렸고, מַהֵר를 자연스럽게 앞에 배치했습니다.
theological_decisions:
- issue: 야훼의 전투적 임재를 어떻게 드러낼 것인가
  chosen_reading: ‘너희 앞에서 건너가시는 분’과 ‘삼키는 불’로 직역에 가깝게 유지했습니다
  alternative_readings:
  - ‘너희를 앞서 가시는 분’
  - ‘타오르는 불’로 완화하는 번역
  rationale: 원문은 단순한 인도보다 전투와 심판의 현존을 강조하므로, 이를 부드럽게 완화하지 않고 이미지와 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological weight without paraphrase'
