- from: 그러므로 오늘 너희는 알아야 합니다. 야훼, 곧 너희 하나님이 너희 앞에서 건너가시는 분이시며, 삼키는 불이십니다. 그분이 그들을 멸하시고 너희 앞에서 그들을 굴복시키실 것이며, 너희는 그들을 차지하고 그들을 신속히 멸망시킬 것입니다. 이는 야훼께서 너희에게 말씀하신 그대로입니다.[a][b][c][d]
  to: 그러므로 오늘 아십시오. 야훼, 곧 네 하나님은 네 앞에서 건너가시는 분[a]이시며 삼키는 불[b]이십니다. 그분께서 그들을 멸하시고 네 앞에서 그들을 굴복시키실 것입니다. 너는 그들을 몰아내고[c] 속히 멸망시킬 것입니다. 야훼께서 네게 말씀하신 대로입니다.[d]
