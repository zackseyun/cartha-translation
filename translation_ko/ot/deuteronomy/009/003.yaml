  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사는 '야훼'로 옮겨, 호칭으로 대체하지 않고 원문이 가진 고유성을 보존했습니다.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  english_pob_choice: is the one crossing over before you
  chosen_korean: 너희 앞에서 건너가시는 분이시며
  alternatives_korean:
  - 너희 앞에서 건너가시는 분
  - 너희 앞에서 가시는 분
