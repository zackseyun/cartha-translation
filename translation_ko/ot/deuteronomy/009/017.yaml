  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
  footnotes:
  - marker: a
    text: Or 'broke them.' The Hebrew verb can be rendered more simply as 'broke,' while 'shattered' brings out the likely effect on the stone tablets in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 두 돌판을 붙잡아 두 손에서 던져 여러분의 눈앞에서 깨뜨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부쉈습니다.’ 히브리어 동사는 더 단순하게 ‘부수다’로 옮길 수도 있으며, 여기서는 문맥상 돌판의 파손 결과를 더 분명히 드러내기 위해 ‘깨뜨렸습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  english_pob_choice: I took hold of
  chosen_korean: 붙잡아
  alternatives_korean:
  - 잡아
  - 손에 쥐어
  lexicon: HALOT
  rationale: תפשׂ의 핵심은 물건을 단단히 잡는 동작이므로, 자연스러운 합쇼체 문맥에서 ‘붙잡아’가 행위를 분명히 드러냅니다.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  english_pob_choice: the two tablets
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 판
  - 두 석판
  lexicon: HALOT
  rationale: לֻחוֹת는 여기서 언약의 돌판을 가리키므로, 본문 맥락을 드러내는 ‘돌판’이 가장 적절합니다.
- source_word: וָאַשְׁלִכֵם
  english_pob_choice: threw them
  chosen_korean: 내던져
  alternatives_korean:
  - 던져
  - 내쳐
  lexicon: HALOT
  rationale: שלך는 단순한 던짐을 뜻하지만, 이어지는 파괴 결과를 고려하면 ‘내던져’가 동작의 급작스러움을 잘 살립니다.
- source_word: וָאֲשַׁבְּרֵם
  english_pob_choice: shattered them
  chosen_korean: 깨뜨렸습니다
  alternatives_korean:
  - 부쉈습니다
  - 산산이 부쉈습니다
  lexicon: HALOT
  rationale: שׁבר는 ‘깨다/부수다’가 기본 의미이므로, 한국어에서는 결과를 자연스럽게 드러내는 ‘깨뜨렸습니다’로 옮기되 과도한 의역은 피했습니다.
theological_decisions:
- issue: 모세의 행위 묘사에서 파괴의 강도 표현
  chosen_reading: ‘깨뜨렸습니다’로 돌판의 실제 파손을 분명히 표현했습니다.
  alternative_readings:
  - ‘부쉈습니다’
  - ‘산산이 부쉈습니다’
  rationale: 문맥상 돌판이 실제로 파손되었음을 보여 주므로, 단순한 ‘던졌습니다’보다 결과를 드러내는 표현이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 출애굽기 32장과 신명기 9장의 언약 파기 서술
