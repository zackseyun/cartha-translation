  source_fidelity: 히브리어는 모세가 두 판을 붙잡아 두 손에서 던지고, 이스라엘 백성이 보는 앞에서 그것들을 부순 일을 서술합니다. ‘두 돌판’은 직접적으로 이 절에 나타나지는 않는 ‘돌’을 문맥상 명시하지만, 언약의 판을 가리키는 관용적이고 명확한 한국어 표현으로 허용됩니다. 다만 ‘내던지다’는 단순히 던진다는 원문의 동작에 다소 거친 뉘앙스를 더합니다.
