  - severity: low
    issue: ‘야훼 당신의 하나님’
    rationale: 번역 자체가 불가능한 표현은 아니지만, 표준 한국어 성경 문체에서는 ‘네 하나님 여호와’가 더 자연스럽고, 히브리어 단수 2인칭 소유 표현을 직접 반영합니다.
