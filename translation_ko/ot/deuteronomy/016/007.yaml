  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: ko
  text: 그리고 그것을 그곳에서 삶아 먹으십시오. 곧 야훼 당신의 하나님께서 그것을 위해 택하실 곳에서 먹으십시오. 아침에 돌아서서 당신의 장막들로 가십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ / וְאָכַלְתָּ
  english_pob_choice: you shall cook it and eat it
  chosen_korean: 그것을 그곳에서 삶아 먹으십시오
  alternatives_korean:
  - 그것을 요리하여 먹으십시오
  - 그것을 삶고 먹으십시오
  lexicon: בשל / אכל
  rationale: 문맥상 제사 음식의 조리와 식사를 자연스럽게 연결하되, 고기 조리의 기본 뜻을 살려 ‘삶아 먹다’로 옮겼습니다.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  english_pob_choice: in the place that the LORD your God will choose for it
  chosen_korean: 야훼 당신의 하나님께서 그것을 위해 택하실 곳에서
  alternatives_korean:
  - 야훼 당신의 하나님께서 선택하실 장소에서
  - 야훼 당신의 하나님께서 택하실 그곳에서
  lexicon: מָקוֹם / בחר / יהוה
  rationale: POB의 ‘for it’는 מקום에 대한 목적지 표현으로 읽히므로, 한국어에서도 ‘그것을 위해’로 반영해 선택의 대상이 제물임을 드러냈습니다.
- source_word: וּפָנִיתָ בַבֹּקֶר וְהָלַכְתָּ לְאֹהָלֶיךָ
  english_pob_choice: and in the morning you shall turn and go to your tents
  chosen_korean: 아침에 돌아서서 당신의 장막들로 가십시오
  alternatives_korean:
  - 아침에 방향을 돌려 당신의 천막들로 가십시오
  - 아침에 떠나 당신의 장막들로 가십시오
  lexicon: פנה / הלך / אֹהֶל
  rationale: ‘turn’과 ‘go’의 연속 동작을 그대로 살리고, 복수형 ‘장막들’을 반영해 원문의 복수 표현을 보존했습니다.
