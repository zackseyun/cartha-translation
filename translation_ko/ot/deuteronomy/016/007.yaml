    issue: ‘그것을 위해 택하실 곳’
    rationale: בּוֹ를 제물에 대한 목적·용도의 뜻으로 확정하여 원문의 통상적인 장소 지시를 왜곡할 수 있습니다. 영어 감사 기록의 ‘for it’도 히브리어의 문법적 지시 대상을 확정할 근거가 되지 않습니다.
  - severity: medium
