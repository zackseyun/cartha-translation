review_pass:
  verdict: revise
  source_fidelity: 초안은 בּוֹ를 ‘그것을 위해’로 풀어, 선택되는 ‘곳’과 제물의 관계를 부당하게 확정합니다. 또한 첫 문장에 이미 ‘그곳에서 ... 먹으십시오’가 있는데 이어서 다시 ‘... 곳에서 먹으십시오’라고 하여 원문에 없는 식사 동작을 반복합니다. 수정안은 조리와 식사를 한 번만 옮기고, ‘택하실 곳에서’로 원문의 자연스러운 장소 표현을 보존합니다.
  naturalness: ‘삶아 먹으십시오’, ‘아침에는 돌아서서 ... 가십시오’는 현대 표준어 합쇼체로 자연스럽습니다. ‘당신의 하나님’보다 성경 문맥의 단수 2인칭에 맞는 ‘네 하나님’이 자연스럽고 관습적인 표현입니다.
  terminology: יהוה는 한국어 성경에서 널리 쓰이는 ‘여호와’로 표기했습니다. אֹהָלֶיךָ의 복수는 ‘네 장막들’로 보존했습니다. בִּשַּׁל은 문맥상 ‘삶다/요리하다’가 가능하나, 유월절 제물 문맥과 초안의 선택을 따라 ‘삶아’로 유지했습니다.
