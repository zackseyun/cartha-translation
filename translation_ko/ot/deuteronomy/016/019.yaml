revisions:
- from: 판결을 굽게 하지 마십시오. 사람을 편파적으로 대하지 마십시오. 뇌물을 받지 마십시오. 뇌물은 지혜로운 사람의 눈을 멀게 하고 의인의 말을 비뚤어지게 합니다.[a][b]
  to: 공의를 왜곡하지 마십시오. 사람을 편들지 마십시오.[a] 뇌물을 받지 마십시오. 뇌물은 지혜로운 이들의 눈을 멀게 하고 의인들의 말을 왜곡합니다.[b]
