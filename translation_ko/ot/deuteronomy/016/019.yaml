id: DEU.16.19
reference: Deuteronomy 16:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
  footnotes:
  - marker: a
    text: Hebrew literally, 'recognize faces,' an idiom meaning to show favoritism or partiality.
    reason: lexical_alternative
  - marker: b
    text: Or 'distorts the words/case of the righteous.' The Hebrew can refer either to their words or, in legal context, to their cause.
    reason: alternative_reading
translation:
  language: ko
  text: 판결을 굽게 하지 마십시오. 사람을 편파적으로 대하지 마십시오. 뇌물을 받지 마십시오. 뇌물은 지혜로운 사람의 눈을 멀게 하고 의인의 말을 비뚤어지게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘얼굴을 알아보다’이며 편파성이나 편애를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘의인의 말들’ 또는 법정 문맥에서 ‘의인의 사안/주장’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 판결
  alternatives_korean:
  - 정의
  - 재판
  - 공의
  lexicon: HALOT
  rationale: 이 문맥은 재판과 판정의 금지이므로, 추상적 규범어인 ‘정의’보다 법정적 행위를 드러내는 ‘판결’이 더 직접적입니다.
- source_word: תַכִּיר פָּנִים
  english_pob_choice: show partiality
  chosen_korean: 사람을 편파적으로 대하다
  alternatives_korean:
  - 얼굴을 알아보다
  - 사람을 차별하다
  - 편파를 보이다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘얼굴을 알아보다’의 의미는 재판에서의 편파성입니다. 한국어에서는 관용적 의미를 살린 ‘편파적으로 대하다’가 자연스럽습니다.
- source_word: שֹׁחַד
  english_pob_choice: bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 선물
  - 사례금
  lexicon: HALOT
  rationale: 법적·도덕적 부패를 가리키는 말이므로, 약화된 ‘선물’보다 ‘뇌물’이 원문의 강도를 정확히 전달합니다.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  english_pob_choice: blinds the eyes of the wise
  chosen_korean: 지혜로운 사람의 눈을 멀게 하고
  alternatives_korean:
  - 지혜로운 이의 눈을 가리고
  - 지혜자들의 눈을 어둡게 하고
  lexicon: HALOT
  rationale: 원문의 비유적 이미지를 그대로 살리되, 한국어에서는 ‘눈을 멀게 하다’가 가장 직설적이고 힘 있는 대응입니다.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  english_pob_choice: twists the words of the righteous
  chosen_korean: 의인의 말을 비뚤어지게 합니다
  alternatives_korean:
  - 의인의 말을 왜곡합니다
  - 의인의 사안을 뒤틀어 놓습니다
  lexicon: HALOT
  rationale: דִּבְרֵי는 문자적으로 ‘말들’이지만 법정 맥락에서 ‘사안/주장’까지 넓을 수 있습니다. 본문 이미지를 유지하면서도 문맥을 살려 ‘말을 비뚤어지게 하다’로 옮겼습니다.
theological_decisions:
- issue: 재판의 공정성 금지 조항을 어떻게 전달할 것인가
  chosen_reading: 본문의 명령형 금지를 강하게 살려, 세 번의 ‘-지 마십시오’로 공적 재판에서의 왜곡, 편파, 뇌물 수수를 분명히 금지했습니다.
  alternative_readings:
  - 더 완곡한 진술형으로 옮기기
  - 하나의 포괄적 금지로 압축하기
  rationale: 히브리어의 연속 금지 구조는 공동체의 사법 윤리를 강조합니다. 한국어에서도 반복 금지를 유지하는 편이 원문의 규범적 힘을 잘 드러냅니다.
  doctrine_reference: 신 16:18-20의 재판 공의 원칙
- issue: ‘의인’의 의미 범위
  chosen_reading: ‘의인’은 단순히 도덕적으로 완전한 사람이라기보다, 재판에서 옳은 편에 있는 사람을 포함하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘무죄한 사람’으로 한정하기
  - ‘정의로운 사람’으로 일반화하기
  rationale: צַדִּיקִם은 법정 문맥에서 법적으로 옳은 자를 가리킬 수 있어, 의미를 좁히지 않는 ‘의인’이 가장 무난합니다.
  doctrine_reference: 구약의 משפט/צדק 어휘군
