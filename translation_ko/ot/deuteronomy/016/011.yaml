  source_fidelity: 개정이 필요합니다. 초안의 ‘데리고’는 히브리어의 단순 병렬 참여자 목록을 동반 행위로 다소 좁히며, ‘너의 성문 안에 있는 나그네’는 레위인에게만 붙는 ‘네 성문 안에 있는’을 나그네에게도 적용합니다. 또한 나그네·고아·과부는 ‘네 가운데 있는’ 이들로 수식되어야 합니다. לְשַׁכֵּן은 사역형이므로 ‘그 이름을 그곳에 거하게 하시려고’로 반영했습니다.
  naturalness: 현대 표준어 합쇼체로 ‘…와 함께 … 앞에서 기뻐하십시오’가 자연스럽고, 긴 열거의 구조와 수식 범위를 분명하게 드러냅니다. ‘레위 사람’은 현대 한국어 성경 문체에서 자연스러운 명칭입니다.
  terminology: יַהְוֶה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. עֶבֶד/אָמָה의 성별 및 예속 신분은 ‘남종/여종’으로 자연스럽게 보존했습니다. גֵּר는 ‘나그네’로, יָתוֹם은 ‘고아’로 번역하고 각주에서 사회법적·어휘적 뉘앙스를 보완했습니다.
