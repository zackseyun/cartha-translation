  text: 너와 네 아들과 네 딸과 네 남종과 네 여종과 네 성문 안에 있는 레위 사람과, 네 가운데 있는 나그네[a]와 고아[b]와 과부와 함께, 네 하나님 야훼께서 자신의 이름을 그곳에 거하게 하시려고[c] 택하실 곳에서 네 하나님 야훼 앞에서 기뻐하십시오.
