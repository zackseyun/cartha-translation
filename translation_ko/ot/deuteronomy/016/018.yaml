revisions:
- from: 판관들과 관리들을 너를 위해 네 모든 성읍에 두십시오. 네 하나님 야훼께서 네 지파들에게 주시는 곳마다 그러해야 하며, 그들이 백성을 의로운 판결로 심판해야 합니다.[a][b]
  to: 네 하나님 야훼께서 네게 주시는 곳의 모든 성문에[a] 네 지파들을 따라 재판관들과 관리들을 두어야 합니다. 그들은 백성을 의로운 판결로 심판해야 합니다.[b]
  rationale: 원문의 ‘성문’을 본문에 보존하고, 성문의 제도적 기능은 각주에서 설명했습니다. ‘네게 주시는 곳’과 ‘네 지파들을 따라’를 분리하여 히브리어의 통사 관계를 더 투명하게 드러냈으며, 법규 문맥에 맞게 ‘두어야 합니다’와 ‘심판해야 합니다’를 사용했습니다. 각주 b의 중복도 실제 번역 대안으로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:05Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 행정·사법 용어와 야훼라는 신명은 대체로 잘 반영했습니다. 그러나 본문의 ‘성문’(שְׁעָרֶיךָ)을 ‘성읍’으로 바꾸어 원문의 구체적 공간 이미지를 본문에서 소거했고, ‘네게 주시는’의 수식 범위와 ‘네 지파들을 따라’(לִשְׁבָטֶיךָ)의 배치를 더 명료하게 할 필요가 있습니다.
  naturalness: 초안의 ‘두십시오’는 원문의 일반적 법규 명령에 비해 직접적인 청유·명령처럼 들립니다. 현대 한국어 합쇼체 법규 문맥에서는 ‘두어야 합니다’가 더 자연스럽고 적절합니다. 또한 ‘네 지파들에게 주시는 곳마다 그러해야 하며’는 문장 연결이 부자연스럽고 원문의 구조를 흐립니다.
  terminology: ‘판관들’도 가능한 표현이나, 일반 독자에게는 법적 역할이 더 분명한 ‘재판관들’이 자연스럽습니다. ‘관리들’은 שֹׁטְרִים의 정확한 직함을 과도하게 특정하지 않아 유지할 수 있습니다. מִשְׁפַּט צֶדֶק은 ‘의로운 판결’로 충실하게 옮길 수 있으며, 각주에는 ‘공정한 판결’이라는 자연스러운 대안을 제시해야 합니다.
  issues:
  - severity: medium
    issue: ‘네 모든 성읍에’가 원문의 ‘네 모든 성문에’를 본문에서 대체함
    rationale: 성문은 당시 재판과 공적 업무가 이루어지던 장소라는 역사적 배경을 지니지만, 원문은 성문이라는 이미지를 직접 사용합니다. 본문에는 ‘성문’을 보존하고 그 기능은 각주로 설명하는 것이 최적 등가 원칙에 더 부합합니다.
  - severity: high
    issue: ‘네 지파들에게 주시는 곳마다 그러해야 하며’가 히브리어의 수식 관계와 문장 구조를 변경함
    rationale: יַהוֶה가 ‘네게’ 주시는 대상은 문맥상 정착지/땅이며, לִשְׁבָטֶיךָ는 지파별 조직·배치를 나타냅니다. 초안은 ‘지파들에게 주시는 곳’으로 재구성하고 ‘그러해야 하며’를 보태어 의미 관계를 흐립니다.
  - severity: medium
    issue: 각주 b가 본문과 동일한 표현을 ‘또는’으로 제시함
    rationale: 본문도 각주도 ‘의로운 판결로’이므로 어휘 대안으로 기능하지 않습니다. 영어 감사 기록의 ‘just judgment’에 상응하는 ‘공정한 판결로’를 제시해야 합니다.
  - severity: low
    issue: ‘두십시오’의 문체
    rationale: 합쇼체 자체는 맞지만, 일반적 법규 명령을 표현하는 데에는 ‘두어야 합니다’가 더 자연스럽고 원문의 의무적 명령법에 잘 맞습니다.
  revised_text: 네 하나님 야훼께서 네게 주시는 곳의 모든 성문에[a] 네 지파들을 따라 재판관들과 관리들을 두어야 합니다. 그들은 백성을 의로운 판결로 심판해야 합니다.[b]
