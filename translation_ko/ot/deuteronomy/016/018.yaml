id: DEU.16.18
reference: Deuteronomy 16:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
  footnotes:
  - marker: a
    text: Or 'within all your towns'; literally 'in all your gates,' referring to the gate areas that functioned as civic and judicial centers.
    reason: cultural_note
  - marker: b
    text: Or 'with just judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 하나님 야훼께서 네게 주시는 곳의 모든 성문에[a] 네 지파들을 따라 재판관들과 관리들을 두어야 합니다. 그들은 백성을 의로운 판결로 심판해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘네 모든 성문에’입니다. 고대 이스라엘에서 성문은 공적 업무와 재판이 이루어지는 중심지였습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘공정한 판결로’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  english_pob_choice: judges
  chosen_korean: 판관들
  alternatives_korean:
  - 재판관들
  - 심판관들
  lexicon: HALOT
  rationale: 법적 판결을 내리는 사람들을 가리키므로, 기능을 드러내는 현대적 법정 용어인 ‘판관들’로 옮겼습니다.
- source_word: שֹׁטְרִים
  english_pob_choice: officers
  chosen_korean: 관리들
  alternatives_korean:
  - 관리관들
  - 서기관들
  - 관원들
  lexicon: HALOT
  rationale: 행정적·치안적 보좌 역할을 나타내므로, 정확한 직함을 과도하게 특정하지 않는 ‘관리들’이 적절합니다.
- source_word: בְּכָל שְׁעָרֶיךָ
  english_pob_choice: in all your gates
  chosen_korean: 네 모든 성읍에
  alternatives_korean:
  - 네 모든 문들에
  - 네 모든 성문에
  - 네 모든 읍성 안에
  lexicon: HALOT
  rationale: 직역하면 ‘네 모든 문들에’이지만, 성문이 당시 공동체의 공적·사법적 중심지라는 점을 한국어에서 자연스럽게 풀어 ‘네 모든 성읍에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 제목이 아닌 이름으로 유지하기 위해, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
- source_word: מִשְׁפַּט צֶדֶק
  english_pob_choice: with righteous judgment
  chosen_korean: 의로운 판결로
  alternatives_korean:
  - 정의로운 판결로
  - 공정한 판결로
  - 의의 판결로
  lexicon: HALOT
  rationale: מִשְׁפָּט의 사법적 의미를 살리면서 צֶדֶק의 도덕적·언약적 정당성을 반영해 ‘의로운 판결’로 옮겼습니다.
theological_decisions:
- issue: 신명기 16:18의 공동체 사법 질서와 현대 독자 이해
  chosen_reading: ‘성문’의 역사적 배경을 한국어 본문에서는 직접 드러내되, 사법·행정 중심지라는 기능은 ‘성읍’으로 자연스럽게 풀어 읽게 했습니다.
  alternative_readings:
  - ‘네 모든 문들에’처럼 더 직역할 수 있음
  - ‘네 모든 성문에’처럼 이미지 보존을 극대화할 수 있음
  rationale: 원문의 문이미지를 완전히 지우지 않으면서도, 현대 한국어 독자가 이 구절의 실제 제도적 의미를 즉시 파악하도록 하는 균형이 필요합니다.
  doctrine_reference: 신명기적 언약 공동체의 재판 제도
