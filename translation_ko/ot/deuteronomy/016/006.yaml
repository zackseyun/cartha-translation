revisions:
- from: 그러나 오직 야훼 당신의 하나님이 그의 이름을 두시려고 택하실 장소에서, 곧 당신이 이집트에서 나오던 때의 정해진 시각에, 해질 무렵에 그 פסח을 드려야 합니다.[a][b][c]
  to: 그러나 야훼, 당신의 하나님께서 그곳에 자신의 이름을 두시려고 택하실 그 장소에서만 유월절 제물을 바쳐야 합니다.[b] 곧 해 질 때, 당신이 이집트에서 나온 때로 정해진 때에 바쳐야 합니다.[c][a]
  rationale: 히브리어 어순을 기계적으로 따르지 않되, 선택된 단일 장소에서의 희생, 저녁/해질 때, 이집트에서 나온 때와 결부된 정해진 시각이라는 모든 요소를 보존했습니다. ‘유월절 제물’은 원문의 제의적 목적어를 자연스러운 한국어로 드러내며, ‘자신의 이름을 두시려고’는 중앙성소 관용구를 과잉 해석하지 않습니다. 각주 표지도 실제 해당 표현에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:53Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 장소의 배타성, 선택, 해질 무렵 및 이집트 خروج과 관련된 정해진 시각이라는 주요 요소를 대체로 담고 있습니다. 그러나 הַפֶּסַח를 히브리 문자로 ‘פסח’라고 표기한 것은 한국어 번역문으로 부적절하며, ‘당신이 이집트에서 나오던 때의 정해진 시각’은 מוֹעֵד צֵאתְךָ의 관계를 다소 흐리게 합니다. 또한 원문의 ‘그곳에서’라는 지시를 번역문에 명시하는 편이 좋습니다.
  naturalness: ‘야훼 당신의 하나님’, ‘그 פסח’, ‘정해진 시각’은 현대 표준 한국어 성경 문장으로 매끄럽지 않거나 지나치게 기술적으로 들립니다. ‘야훼, 당신의 하나님께서’, ‘유월절 제물’, ‘정해진 때’가 자연스럽고, 시간 수식어는 동사 뒤에 배치하는 것이 원문의 진행과 한국어 문장성을 함께 살립니다.
  terminology: יהוה는 프로젝트의 방침에 따라 ‘야훼’로 유지했습니다. הַפֶּסַח는 이 문맥에서 희생 제물을 가리키므로 ‘유월절 제물’로 명시하여 תִּזְבַּח의 제의적 희생 행위와 결합시켰습니다. לְשַׁכֵּן שְׁמוֹ שָׁם은 해설을 덧붙이지 않고 ‘그곳에 자신의 이름을 두시려고’로 옮겨 히브리어 관용을 보존했습니다.
  issues:
  - severity: medium
    issue: 본문에 히브리 문자 ‘פסח’가 그대로 남아 있습니다.
    rationale: 한국어 번역문에는 통용되는 한국어 성경 용어를 사용해야 합니다. 또한 이 문맥의 פֶּסַח는 제의적 희생의 대상이므로 ‘유월절 제물’이 의미를 더 정확히 드러냅니다.
