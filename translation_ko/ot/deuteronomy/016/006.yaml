    rationale: 히브리어는 이집트에서 나온 때와 관련된 정해진 때를 가리킵니다. ‘당신이 이집트에서 나온 때로 정해진 때’는 이를 더 직접적으로 보존합니다.
  - severity: low
    issue: 각주 표지가 참조 대상과 떨어져 있거나 순서가 뒤섞여 있습니다.
