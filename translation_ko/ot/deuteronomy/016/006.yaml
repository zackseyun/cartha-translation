  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
  footnotes:
  - marker: a
    text: Or 'to cause his name to dwell there' or 'to put his name there.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall slaughter the Passover.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'at the appointed time of your coming out from Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼, 당신의 하나님께서 그곳에 자신의 이름을 두시려고 택하실 그 장소에서만 유월절 제물을 바쳐야 합니다.[b] 곧 해 질 때, 당신이 이집트에서 나온 때로 정해진 때에 바쳐야 합니다.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 이름이 그곳에 거하게 하시려고’ 또는 ‘그의 이름을 그곳에 두시려고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유월절 제물을 잡아야 합니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘당신이 이집트에서 나옴의 정해진 때에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: but only
  chosen_korean: 그러나 오직
  alternatives_korean:
  - 오직
  - 다만
  lexicon: HALOT
  rationale: 이 연결어는 앞선 금지에 대한 강한 예외를 나타내므로, 한국어에서는 대비와 제한을 함께 드러내는 「그러나 오직」이 가장 자연스럽습니다.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  english_pob_choice: for his name to dwell
  chosen_korean: 그의 이름을 두시려고
  alternatives_korean:
  - 그의 이름이 머무르게 하시려고
  - 그의 이름이 거하게 하시려고
  lexicon: HALOT
  rationale: 히필 표현의 핵심은 하나님의 이름/임재를 특정 장소에 두시는 행위이므로, 직역적이면서도 문장으로 읽히는 「이름을 두시려고」로 옮겼습니다.
- source_word: תִּזְבַּח
  english_pob_choice: you shall sacrifice
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 희생제물로 바쳐야 합니다
  - 제사해야 합니다
  lexicon: HALOT
  rationale: פסח과 결합한 제의적 행위를 한국어 성경 문체로 자연스럽게 드러내기 위해 「드려야 합니다」를 택했습니다. 문맥상 단순 도살보다 제의적 봉헌이 전면에 있습니다.
- source_word: הַפֶּסַח
  english_pob_choice: the Passover
  chosen_korean: 그 פסח
  alternatives_korean:
  - 유월절
  - 그 유월절
  lexicon: HALOT
  rationale: 해당 항목은 제의적/절기적 용법이지만, 본문 고유 표현의 소리를 살리기 위해 음차 표기를 유지했습니다. 전통적 「유월절」은 의미를 주지만 원문 표지성을 덜 보존합니다.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  english_pob_choice: at sunset
  chosen_korean: 해질 무렵에
  alternatives_korean:
  - 해질 때에
  - 해가 질 무렵에
  lexicon: HALOT
  rationale: 관용적 의미가 ‘sunset’이므로, 현대 한국어에서 가장 자연스러운 시간 표현인 「해질 무렵에」로 옮겼습니다.
- source_word: מוֹעֵד
  english_pob_choice: at the appointed time
  chosen_korean: 정해진 시각에
  alternatives_korean:
  - 정해진 때에
  - 정한 시기에
  lexicon: HALOT
  rationale: מוֹעֵד는 단순한 ‘때’보다 지정된 예식 시점을 가리키므로, 여기서는 ‘appointed time’의 시간성에 맞춰 「정해진 시각」을 택했습니다.
theological_decisions:
- issue: 야훼의 ‘이름을 두는’ 중앙성소 신학
  chosen_reading: 하나님이 택하신 한 장소에 그의 이름을 두시는 것으로 옮기되, 신적 임재의 신비를 과잉 설명하지 않았습니다.
  alternative_readings:
  - 하나님이 그의 이름을 거하게 하시는 장소
  - 하나님이 그의 이름을 두도록 택하신 장소
  rationale: 본문은 하나님이 선택하신 예배 장소의 정당성을 말하지만, 하나님의 현존을 물리적으로 국한한다고 단정하지는 않습니다. 그래서 히브리어 관용을 유지하면서도 신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3; contested terms for יְהוָה'
