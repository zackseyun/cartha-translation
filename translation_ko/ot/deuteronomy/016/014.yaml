  source_fidelity: 수정이 필요합니다. 초안은 절기, 가족 구성원, 종, 레위인 및 사회적으로 취약한 이들을 열거하는 본문의 범위를 대체로 보존했으나, 열거 뒤를 ‘…입니다’로 끝내어 ‘기뻐해야 합니다’라는 명령의 술어가 열거 전체에 문법적으로 연결되지 않습니다. 또한 גֵּר를 ‘나그네’로 옮기면 일시적 여행자라는 인상이 생길 수 있어, 공동체 안에 거주하는 비이스라엘인이라는 법적·사회적 의미를 더 분명히 하는 표현이 안전합니다.
  naturalness: ‘당신은 …와 함께 기뻐해야 합니다’로 명령과 모든 열거 항목을 자연스럽게 연결했습니다. ‘레위 사람’은 통용되는 명칭인 ‘레위인’으로, ‘남종/여종’은 현대 독자에게 신분 의미가 더 분명한 ‘남자 노예/여자 노예’로 다듬었습니다.
  terminology: חַג는 ‘절기’, עֶבֶד/אָמָה는 ‘남자 노예/여자 노예’, לֵוִי는 ‘레위인’으로 옮겼습니다. גֵּר는 현대 이주 제도의 특정 범주를 과도하게 투사하지 않으면서도 정착 거주를 나타내는 ‘거주 외국인’으로 옮겼습니다. ‘성문 안’은 본문의 관용어를 보존하고 각주에서 성읍·공동체 거주라는 뜻을 설명합니다.
