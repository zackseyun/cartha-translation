source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male slave and your female slave, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
  footnotes:
  - marker: a
    text: Or “at your festival.” The Hebrew חַג can denote a festival celebration or feast.
    reason: lexical_alternative
  - marker: b
    text: “The sojourner” refers to a non-Israelite resident living among Israel; alternatively, “the resident alien.”
    reason: lexical_alternative
  - marker: c
    text: Or “the orphan.” Hebrew “fatherless” highlights the vulnerable social status addressed in Torah law.
    reason: lexical_alternative
  - marker: d
    text: Hebrew “within your gates” is an idiom for those living within your towns or community.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 당신은 당신의 절기에서 즐거워해야 합니다—곧 당신과 당신의 아들과 당신의 딸과 당신의 남종과 당신의 여종과 레위 사람과, 당신의 성문 안에 있는 나그네와 고아와 과부입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַג는 절기 행사나 축제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 이스라엘 가운데 거주하는 비이스라엘인을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고아’는 히브리어가 강조하는 사회적 취약성을 드러내지만, 직역하면 ‘아버지 없는 자’입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘성문 안’은 마을이나 공동체 안에 거주하는 사람들을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  english_pob_choice: And you shall rejoice
  chosen_korean: 즐거워해야 합니다
  alternatives_korean:
  - 기뻐해야 합니다
  - 즐거워할 것입니다
  lexicon: HALOT
  rationale: 법/권고 문맥의 완료형+접속사는 명령적·미래적 의미를 띠므로, 합쇼체에서는 의무를 드러내는 「-해야 합니다」가 적절합니다.
- source_word: בְּחַגֶּךָ
  english_pob_choice: in your festival
  chosen_korean: 당신의 절기에서
  alternatives_korean:
  - 당신의 축제에서
  - 당신의 절기 안에서
  lexicon: HALOT
  rationale: חַג는 단순한 잔치보다 종교적 절기/축제를 가리키므로 「절기」가 더 직접적이며, 전치사는 한국어에서 자연스럽게 장소·참여 범위를 나타내는 「-에서」로 옮겼습니다.
- source_word: וְעַבְדְּךָ / וַאֲמָתֶךָ
  english_pob_choice: your male slave / your female slave
  chosen_korean: 당신의 남종과 당신의 여종
  alternatives_korean:
  - 당신의 남자 노예와 당신의 여자 노예
  - 당신의 남종과 당신의 여노예
  lexicon: HALOT
  rationale: 문맥상 재산적·종속적 지위가 드러나므로 완화된 「종」보다 신분을 더 분명히 하는 표현을 택했습니다. 다만 한국어 출판 문체의 자연스러움을 위해 「남종/여종」으로 정리했습니다.
- source_word: וְהַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류하는 외국인
  - 거주 외국인
  - 거류민
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 공동체 안에 거주하는 비이스라엘인을 뜻하므로, 「나그네」는 전통적이면서도 한시적 체류가 아니라 공동체 내의 타자라는 사회적 뉘앙스를 비교적 잘 살립니다.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  english_pob_choice: who are within your gates
  chosen_korean: 당신의 성문 안에 있는
  alternatives_korean:
  - 당신의 성읍 안에 있는
  - 당신의 문 안에 있는
  lexicon: HALOT
  rationale: ‘성문’은 העיר/שער의 관용적 사회 공간을 보존하는 표현입니다. 한국어에서는 직역의 낯섦을 줄이기 위해 「안에 있는」을 붙여 거주 범위를 분명히 했습니다.
theological_decisions:
- issue: 이 절의 배제된 주변인이 아니라 포함된 공동체를 어떻게 드러낼 것인가
  chosen_reading: 축제의 기쁨이 가족과 종, 레위 사람, 나그네, 고아, 과부까지 확장되는 명령으로 옮겼습니다.
  alternative_readings:
  - 가정 중심의 축하로 축소하기
  - 단순한 기쁨의 권고로 약화하기
  rationale: 본문은 절기 기쁨을 사회적 약자와 주변인까지 포괄하는 언약적 의무로 제시하므로, 포함의 범위를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 토라의 공동체 윤리; 신명기 16장 절기 규정의 사회적 포괄성
