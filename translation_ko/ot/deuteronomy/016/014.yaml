  rationale: 명령문의 술어를 열거 전체에 연결하여 원문의 통사와 의미를 회복했습니다. 거주민을 뜻하는 גֵּר의 의미를 명료하게 하고, 용어와 각주 표지를 해당 위치에 맞추었습니다. 본문이 말하는 포괄의 범위는 유지하되 해석적·교파적 설명은 덧붙이지 않았습니다.
