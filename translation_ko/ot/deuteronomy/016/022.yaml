    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹֽא תָקִ֥ים
  english_pob_choice: And you shall not set up
  chosen_korean: 세워서는 안 됩니다
  alternatives_korean:
  - 세우지 말아야 합니다
  - 설치해서는 안 됩니다
  - 세워 두어서는 안 됩니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘세우다/설치하다’라는 뜻을 자연스러운 현대 한국어 금지문으로 옮겼습니다. ‘세워서는 안 됩니다’가 제의적 대상의 설치를 가장 무리 없이 드러냅니다.
- source_word: לְ/ךָ֖
  english_pob_choice: for yourself
  chosen_korean: 자신을 위하여
  alternatives_korean:
  - 당신을 위하여
  - 스스로를 위해
  lexicon: HALOT
  rationale: 여격 대명사는 단순 목적어가 아니라 개인적 관여를 나타내므로, 행위의 귀속성을 살려 ‘자신을 위하여’로 옮겼습니다.
- source_word: מַצֵּבָ֑ה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 석상
  - 세운 돌
  - 제의 기둥
  lexicon: HALOT
  rationale: 이 단어는 예배와 연관된 세워진 돌/기둥을 가리키지만, 본문 자체에 없는 ‘거룩한’ 같은 수식은 덧붙이지 않고 핵심 형상을 드러내는 기본어 ‘기둥’을 택했습니다. 주석 a에서 의미 범위를 보완합니다.
- source_word: שָׂנֵא
  english_pob_choice: hates
  chosen_korean: 미워하시는
  alternatives_korean:
  - 싫어하시는
  - 혐오하시는
  lexicon: HALOT
  rationale: 동사의 강한 혐오 감정을 약화하지 않고, 하나님에 대한 존칭 주체를 살려 ‘미워하시는’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대신 신명기 텍스트의 고유 신명 표기 원칙에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 우상 금지의 강도
  chosen_reading: 본문의 신적 주체를 ‘야훼’로 직접 표기하고, מַצֵּבָה를 중성화하지 않은 ‘기둥’으로 옮겨 제의적 금지의 강도를 유지했습니다.
  alternative_readings:
  - 주님
  - 제단기둥
  - 성스러운 기둥
  rationale: 본문은 단순한 건축물이 아니라 예배와 연결된 세운 물체를 금합니다. 전통적 완화 표현보다 원문의 금지 대상을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms — יְהוָה YHWH → 야훼; original-language primacy over ecclesial tradition'
