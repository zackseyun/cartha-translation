  - 종살이한 사람
  lexicon: HALOT
  rationale: 본문은 이집트의 억압적 예속 상태를 말하지만, 한국어 성경 문체와 본문 전체의 균형을 고려해 ‘종’으로 옮기되, 단순한 종사보다 더 강한 속박 의미를 과도하게 완곡하게 만들지는 않았습니다.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ
  english_pob_choice: keep and do
