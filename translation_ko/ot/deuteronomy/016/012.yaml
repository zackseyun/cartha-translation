  text: Remember that you were a slave in Egypt[a], and keep and do these statutes.
  footnotes:
  - marker: a
    text: Or 'servant.' The Hebrew עֶבֶד can denote a servant or slave, but here 'slave' best reflects Israel's bondage in Egypt.
