translation:
  language: ko
  text: 당신은 이집트에서 종이었음을 기억하고, 이 규례들을 지키며 행해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예’. 히브리어 עֶבֶד는 종이나 노예를 뜻할 수 있지만, 여기서는 이집트에서의 예속 상태를 더 잘 드러내기 위해 POB 영어본은 ‘slave’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: Remember
  chosen_korean: 기억하고
  alternatives_korean:
  - 기억하십시오
  - 기억하세요
  lexicon: HALOT
  rationale: 명령적 문맥의 완료형을 현대 한국어에서는 명령·권고의 ‘기억하다’로 자연스럽게 옮기며, 앞뒤 동사들과 이어지는 행위 촉구를 살렸습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이한 사람
  lexicon: HALOT
  rationale: 본문은 이집트의 억압적 예속 상태를 말하지만, 한국어 성경 문체와 본문 전체의 균형을 고려해 ‘종’으로 옮기되, 단순한 종사보다 더 강한 속박 의미를 과도하게 완곡하게 만들지는 않았습니다.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ
  english_pob_choice: keep and do
  chosen_korean: 지키며 행해야 합니다
  alternatives_korean:
  - 지켜 행해야 합니다
  - 지키고 해야 합니다
  lexicon: HALOT
  rationale: 율법 문맥의 관용 결합인 ‘keep and do’를 한국어에서도 결합된 명령으로 살려, 단순한 인지적 준수보다 실제 이행까지 포함하는 뜻을 드러냈습니다.
- source_word: הַחֻקִּים
  english_pob_choice: statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 법도들
  lexicon: HALOT
  rationale: הֻקִּים의 법적·언약적 성격을 한국어 성경 용례에 따라 ‘규례들’로 옮겼습니다. ‘율례들’도 가능하지만, 여기서는 반복적으로 지켜야 할 규범의 뉘앙스가 더 분명합니다.
theological_decisions:
- issue: ‘slave’/‘종’의 사회적 강도와 한국어 독자 인식
  chosen_reading: ‘종’으로 옮기되, 이집트의 억압적 예속을 흐리지 않도록 문맥상 강한 속박 상태를 유지했습니다.
  alternative_readings:
  - ‘노예’
  - ‘종된 사람’
  rationale: 히브리어 עֶבֶד는 일반적으로 종이지만, 출애굽 기억을 환기하는 본문에서는 강제된 예속을 가리킵니다. 한국어에서는 ‘노예’가 더 강하지만, 이 구절은 전통적 성경 문체와 가독성을 고려해 ‘종’이면서도 의미를 약화시키지 않는 방식이 적절합니다.
  doctrine_reference: 'Translation philosophy: source-directed lexical precision; contested slavery/servitude rendering policy'
