translation:
  language: ko
  text: 너 자신을 위하여 일곱 주를 세십시오. 서 있는 곡식에 낫을 대기 시작할 때부터 일곱 주를 세기 시작하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  english_pob_choice: seven weeks
  chosen_korean: 일곱 주
  alternatives_korean:
  - 일곱 이레
  - 일곱번의 주간
  lexicon: HALOT
  rationale: שָׁבֻעֹת은 문자적으로는 ‘일곱들’과 관련되지만, 절기 계산 문맥에서는 ‘주들/주간들’이 자연스럽고 본문의 달력적 의미를 더 분명하게 드러냅니다.
- source_word: תִּסְפָּר לָךְ
  english_pob_choice: you shall count for yourself
  chosen_korean: 너희를 위해 셀지니라
  alternatives_korean:
  - 너희 자신을 위해 셀지니라
  - 너희가 셀 것입니다
  lexicon: HALOT
  rationale: לָךְ의 직접적 개인적 지시를 살리되, 한국어에서는 ‘너희를 위해’가 공동체적 절기 계산을 자연스럽게 드러냅니다.
- source_word: מֵהָחֵל חֶרְמֵשׁ בַּקָּמָה
  english_pob_choice: from the time the sickle begins to be put to the standing grain
  chosen_korean: 곡식에 낫을 대기 시작할 때부터
  alternatives_korean:
  - 서 있는 곡식에 낫이 가해지기 시작할 때부터
  - 추수할 곡식에 낫을 대기 시작할 때부터
  lexicon: HALOT
  rationale: 히브리어 관용구의 시작 시점을 한국어로 자연스럽게 옮기면서, 수확 도구인 낫과 ‘서 있는 곡식’의 이미지를 유지했습니다.
- source_word: תָּחֵל לִסְפֹּר
  english_pob_choice: you shall begin to count
  chosen_korean: 세기 시작해야 합니다
  alternatives_korean:
  - 헤아리기 시작해야 합니다
  - 계산하기 시작해야 합니다
  lexicon: HALOT
  rationale: חלל의 개시 의미를 ‘시작해야 합니다’로 옮겨 명령적/지시적 뉘앙스를 살렸고, ספר의 기본 의미는 절기 계산 문맥에 맞게 ‘세다’로 유지했습니다.
theological_decisions:
- issue: 절기 계산의 공동체성
  chosen_reading: ‘너희’로 복수형을 드러내어 개인 행위가 아니라 이스라엘 공동체의 절기 규정을 반영했습니다.
  alternative_readings:
  - ‘너’로 단수화
  - 주어를 생략한 중립형
  rationale: 본문의 율법 지시는 공동체적 준수를 전제하므로 복수형을 유지하는 것이 청중 이해에 더 충실합니다.
  doctrine_reference: 언약 공동체와 율법 준수의 공적 성격
