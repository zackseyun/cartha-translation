  source_fidelity: 히브리어 צֶדֶק의 반복과 תִּרְדֹּף의 명령, 땅을 차지함이라는 결과는 대체로 충실히 반영되었습니다. 그러나 법과 재판에 관한 직접 문맥에서 본문의 ‘의’는 현대 한국어에서 ‘정의’보다 덜 명확하고 개인적·종교적 ‘의로움’으로 읽힐 수 있습니다. 영어 POB의 ‘Justice’ 및 원문의 공적·법적 의미를 따라 ‘정의’로 고치는 것이 안전합니다.
  naturalness: ‘정의, 정의를 추구하십시오’는 히브리어의 강조적 반복을 보존하면서 현대 표준 한국어의 합쇼체에도 자연스럽습니다. 이어지는 ‘그리하면 당신은 살고 … 차지하게 될 것입니다’도 명령에 따르는 목적·결과를 자연스럽게 나타냅니다.
  terminology: יְהוָה는 프로젝트 방침에 맞게 ‘야훼’로 유지합니다. אֱלֹהֶיךָ는 ‘당신의 하나님’으로, וְיָרַשְׁתָּ는 약속의 땅을 점유한다는 의미를 살려 ‘차지하게 될 것입니다’로 유지할 수 있습니다. צֶדֶק의 주 번역은 법적 문맥을 명확히 드러내는 ‘정의’가 적절합니다.
