  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
  footnotes:
  - marker: a
    text: Or 'Righteousness, righteousness you shall pursue.' The Hebrew צֶדֶק can denote both justice and righteousness; here 'justice' fits the legal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'inherit the land.' The Hebrew verb can carry the sense of inheriting as well as possessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 정의, 정의를 추구하십시오[a]. 그리하면 당신은 살고, 당신의 하나님 야훼께서 당신에게 주시는 그 땅을 차지하게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로움, 의로움을 추구하십시오.’ 히브리어 צֶדֶק은 ‘정의’와 ‘의로움’을 모두 가리킬 수 있으나, 여기서는 법적 문맥상 ‘정의’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅을 상속하게 될 것입니다.’ 히브리어 동사는 ‘상속하다’와 ‘차지하다/소유하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  english_pob_choice: Justice, justice
  chosen_korean: 의와 의를
  alternatives_korean:
  - 정의와 정의를
  - 의로움과 의로움을
  - 옳은 것을, 옳은 것을
  lexicon: HALOT
  rationale: WLC의 반복은 강조를 나타내므로 한국어도 반복을 그대로 살렸습니다. 문맥이 재판과 판관 규정이므로, 추상적인 ‘의로움’보다 공적·법적 뉘앙스가 분명한 ‘의’가 더 잘 맞습니다.
- source_word: תִּרְדֹּף
  english_pob_choice: you shall pursue
  chosen_korean: 추구하십시오
  alternatives_korean:
  - 쫓으십시오
  - 뒤쫓으십시오
  - 따르십시오
  lexicon: HALOT
  rationale: 히브리어 רדף는 ‘뒤쫓다/추구하다’의 강한 지속적 행위를 뜻합니다. 한국어에서는 법적·윤리적 권면에 자연스러운 ‘추구하십시오’로 옮겨 명령의 힘을 유지했습니다.
- source_word: וְיָרַשְׁתָּ
  english_pob_choice: and possess
  chosen_korean: 차지하게 될 것입니다
  alternatives_korean:
  - 소유하게 될 것입니다
  - 이어받게 될 것입니다
  - 상속받게 될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘상속하다’와 ‘차지하다/소유하다’의 의미를 함께 가질 수 있습니다. 본문에서는 약속의 땅을 실제로 점유·보유하는 결과를 드러내기 위해 ‘차지하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와대명사(신명) יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 신명 ‘야훼’를 유지했습니다. 이는 호칭 ‘주’로 바꾸어 신명을 가리는 것을 피합니다.
theological_decisions:
- issue: צֶדֶק의 번역을 ‘의’로 유지할지 ‘정의’로 풀지
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 직전 문맥이 판관과 재판의 공정성을 다루므로 공적·법적 의미가 우선합니다. 한국어 ‘의’는 이 문맥에서 성경적·법정적 뉘앙스를 함께 살릴 수 있어, 영어 POB의 ‘justice’ 선택과도 대응됩니다.
  doctrine_reference: Translation philosophy §5 (일관성 및 문맥 우선의 번역)
