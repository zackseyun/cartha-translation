revisions:
- from: 너는 엿새 동안 무교병을 먹고, 일곱째 날에는 너의 하나님 여호와께 속한 엄숙한 집회를 하되 아무 일도 하지 말라.[a]
  to: 엿새 동안 무교병을 먹으십시오. 일곱째 날에는 여호와, 당신의 하나님께 드리는 엄숙한 집회[a]가 있으니, 아무 일도 하지 마십시오.
