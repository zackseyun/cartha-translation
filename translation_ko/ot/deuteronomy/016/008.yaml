review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the six-day duration, unleavened bread, the seventh day, Yahweh, and the prohibition of work. However, “여호와께 속한 엄숙한 집회” inaccurately construes לַיהוָה as possession (“belonging to”) rather than dedication/relation (“for/to Yahweh”).
  naturalness: The current imperative forms (“먹고… 말라”) are formal biblical literary style but do not meet the specified modern formal-polite 합쇼체 consistently. A nominal-clause rendering for the assembly and 하십시오 imperatives are natural and clear in modern formal Korean.
  terminology: “무교병” is established and suitable. “엄숙한 집회” is understandable, though “성회” is also a traditional alternative. The footnote overstates that עֲצֶרֶת means a festival’s closing gathering and imports “worship,” neither of which should be asserted as the sole sense in the main note.
  issues:
  - severity: medium
    issue: “여호와께 속한” renders the preposition לְ as possession.
    rationale: The phrase עֲצֶרֶת לַיהוָה denotes an assembly for or dedicated to Yahweh, not an assembly that merely belongs to him.
  - severity: medium
    issue: The footnote presents “종결 집회” and worship as definite meanings.
    rationale: The term denotes a formal festal/sacred assembly; a concluding nuance is possible in context but disputed or secondary, and “예배를 포함함” exceeds the lexical content.
  - severity: low
    issue: The draft does not consistently use the requested modern formal-polite 합쇼체.
    rationale: “먹고… 말라” is traditional declarative biblical register rather than the requested 하십시오체.
  revised_text: 엿새 동안 무교병을 먹으십시오. 일곱째 날에는 여호와, 당신의 하나님께 드리는 엄숙한 집회[a]가 있으니, 아무 일도 하지 마십시오.
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘아체레트’는 공식적인 축제 집회를 가리킵니다. ‘성회’ 또는 ‘종결 집회’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision renders the assembly as dedicated to Yahweh rather than possessed by him, uses modern formal-polite imperatives, and replaces the interpretively overconfident note with one that preserves the term’s lexical range and the possible concluding nuance.
