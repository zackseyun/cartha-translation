base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly' or 'a closing assembly.' The Hebrew term denotes a formal festal gathering, likely with the nuance of a concluding assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 엿새 동안 무교병을 먹고, 일곱째 날에는 너의 하나님 여호와께 속한 엄숙한 집회를 하되 아무 일도 하지 말라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '에체레트'는 공식적인 축제의 종결 집회를 의미하며, 단순한 모임이 아니라 하나님께 드리는 엄숙한 예배를 포함함.
    source: WLC Deuteronomy 16:8
lexical_decisions:
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean: 무교과, 누룩 없는 빵
  lexicon: BDB 403
  rationale: 무교병은 한국 개역개정 등 기존 번역에서 통용되는 신학적 용어로, 맥락적 정확성과 독자의 이해도를 동시에 확보하기 위해 선택함.
- source_word: עֲצֶרֶת
  english_pob_choice: solemn assembly
  chosen_korean: 엄숙한 집회
  alternatives_korean: 금식회, 폐회, 엄숙한 모임
  lexicon: BDB 763
  rationale: 히브리어 '에체레트'는 축제의 종결을 의미하는 공식적인 집회를 지칭하므로, 단순한 모임보다는 종교적 엄숙성을 담은 '엄숙한 집회'로 번역하여 원문의 의도를 살림.
- source_word: מְלָאכָה
  english_pob_choice: work
  chosen_korean: 일
  alternatives_korean: 노력, 직업, 일거리
  lexicon: BDB 603
  rationale: 성경적 맥락에서 '일'은 노동뿐만 아니라 금기된 행위를 포괄하므로, 가장 명확한 현대어인 '일'을 사용하되 '아무 일도 하지 말라'는 부정적 명령형을 통해 금기 사항을 강조함.
theological_decisions:
- decision: Yahweh translation
  rationale: 원문 '여호와'를 사용하여 신의 고유한 이름을 명확히 표기하며, 독자에게 신의 주권적 성격을 전달함.
- decision: Formal-Polite Style (합쇼체)
  rationale: 성경의 권위와 경건함을 유지하면서도 현대 독자가 이해하기 쉬운 합쇼체 (하오체/하십시오체) 를 적용하여 공적 경전으로서의 위상을 부여함.
