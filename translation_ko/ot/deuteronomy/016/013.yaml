  - 행하십시오
  - 지키라
  lexicon: HALOT
  rationale: 절기를 두고 쓰인 עשה는 단순한 '만들다'보다 언약적 준수의 의미가 강하므로, 합쇼체 명령으로 자연스러운 '지키십시오'가 가장 적합합니다.
- source_word: בְּאָסְפְּךָ מִגָּרְנְךָ וּמִיִּקְבֶךָ
  english_pob_choice: when you gather in from your threshing floor and from your winepress
  chosen_korean: 타작마당에서 거두어들이고 포도즙틀에서 거두어들일 때에
  alternatives_korean:
