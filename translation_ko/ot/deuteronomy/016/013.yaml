  rationale: בְּאָסְפְּךָ는 시기적 부사구로 옮기고, מִגָּרְנְךָ와 וּמִיִּקְבֶךָ는 구체적 수확 현장인 타작마당과 포도즙틀을 살려 번역해 원문의 농경 이미지를 보존했습니다.
