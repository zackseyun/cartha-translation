  - 장막절
  - 초막들의 절기
  lexicon: HALOT
  rationale: חַג은 절기/명절의 의미이고 סֻכּוֹת은 임시 거처인 booths를 가리키므로, 한국어에서는 교회 전통에서 익숙하면서도 본뜻을 담는 초막절을 채택했습니다.
