id: DEU.16.21
reference: Deuteronomy 16:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
  footnotes:
  - marker: a
    text: Or 'an Asherah pole'; the Hebrew אֲשֵׁרָה can refer to a cult object associated with the goddess Asherah, not only to the goddess herself.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 자신을 위하여 어떤 나무로 된 아세라도 심어서는 안 됩니다. 야훼 당신의 하나님께서 당신을 위하여 만드실 제단 곁에는 두지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아세라는 여신 아세라 자체를 가리키거나, 그와 관련된 숭배용 나무/목상을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  english_pob_choice: plant
  chosen_korean: 심어서는 안 됩니다
  alternatives_korean:
  - 세워서는 안 됩니다
  - 설치해서는 안 됩니다
  lexicon: HALOT
  rationale: נטע의 기본 의미인 ‘심다’를 살리되, 한국어 법령체에 맞게 금지형으로 자연스럽게 옮겼습니다. cultic 대상이라도 원문의 식물적 이미지를 약화시키지 않기 위해 ‘설치하다’로 돌리지 않았습니다.
- source_word: אֲשֵׁרָה
  english_pob_choice: Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 나무
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 원문의 신명칭/숭배대상에 관한 해석 긴장을 유지하기 위해 음역을 택했습니다. ‘나무’나 ‘목상’으로 고정하면 의미 범위를 과도하게 좁힐 수 있습니다.
- source_word: כָּל עֵץ
  english_pob_choice: any kind of tree
  chosen_korean: 어떤 나무로 된
  alternatives_korean:
  - 어떤 나무든지의
  - 어떤 종류의 나무로 된
  lexicon: HALOT
  rationale: ‘모든 나무 종류’의 폭을 자연스러운 한국어로 풀어, 아세라가 나무 형태의 숭배물일 수 있음을 드러내면서도 번역이 어색해지지 않게 했습니다.
- source_word: אֵצֶל מִזְבַּח
  english_pob_choice: beside the altar
  chosen_korean: 제단 곁에는
  alternatives_korean:
  - 제단 옆에는
  - 제단 가까이에
  lexicon: HALOT
  rationale: אֵצֶל의 근접 의미를 ‘곁에’로 간결하게 살렸습니다. 법적 금지문의 공간적 경계가 분명히 드러납니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기는 하나님의 고유명사인 יְהוָה를 ‘야훼’로 옮겼습니다. 이는 호칭 대체보다 원문 가시성을 높입니다.
theological_decisions:
- issue: 아세라를 신격명으로 볼지, 숭배물로 볼지
  chosen_reading: 본문에서는 ‘아세라’로 음역하고, 뒤의 ‘어떤 나무로 된’으로 숭배물/나무 형상을 암시하게 했습니다.
  alternative_readings:
  - 아세라 목상
  - 아세라 나무
  rationale: 히브리어 אֲשֵׁרָה는 문맥상 여신 이름과 숭배 대상이 모두 가능하므로, 본문에서 하나로 확정하지 않고 긴장을 보존했습니다. 이는 POB의 해석 보류 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
