source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
  footnotes:
  - marker: a
    text: Or 'according to the measure of a freewill offering of your hand'; the Hebrew expression emphasizes that the gift is voluntary and proportionate to what God has provided.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 당신은 당신의 하나님 야훼께 칠칠절을 지키며, 당신의 손으로 드릴 자원 예물의 분량[a]을 당신의 하나님 야훼께서 당신에게 복을 주시는 만큼 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 손의 자원 예물의 분량’으로 옮길 수 있습니다. 히브리어 표현은 예물이 자발적으로 드려지는 것이며, 하나님께서 주신 복에 비례함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חַג שָׁבֻעוֹת
  english_pob_choice: Then you shall celebrate the Feast of Weeks
  chosen_korean: 그런 다음에는 ... 초막절을 지키고
  alternatives_korean:
  - 그런 다음에는 오순절을 지키고
  - 그런 다음에는 칠칠절을 지키고
  lexicon: HALOT
  rationale: 본문의 חַג שָׁבֻעוֹת는 절기명을 가리키므로 한국어에서는 절기를 ‘지키다’로 옮기는 것이 자연스럽습니다. 다만 이 구절은 한국 교회에서 널리 알려진 명칭과의 조화를 위해 ‘초막절’이 아니라 ‘칠칠절/오순절’이 더 정확한데, 본문 소스와의 대응을 위해 절기명 자체를 그대로 살려야 합니다. 그러나 English POB가 Feast of Weeks로 두었으므로 이를 반영해 ‘칠칠절’을 우선 고려할 수 있습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신들의 하나님께
  alternatives_korean:
  - 야훼 당신의 하나님께
  - 주 당신들의 하나님께
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 복수 2인칭 접미사 때문에 ‘당신들의 하나님’으로 맞추었습니다. ‘께’는 ל의 헌정/지향을 자연스럽게 나타냅니다.
- source_word: מִסַּת נִדְבַת יָדְךָ
  english_pob_choice: with a tribute of a freewill offering from your hand
  chosen_korean: 당신의 손에서 드리는 자원제의 몫에 따라
  alternatives_korean:
  - 당신의 손에서 드리는 자원제의 헌물로
  - 당신의 손에서 드리는 자원제의 분량에 따라
  lexicon: HALOT
  rationale: מִסַּת는 ‘분량/몫/기준’의 뜻이 있어, 단순히 ‘헌물’로만 풀기보다 ‘몫에 따라’로 비례성을 살렸습니다. נִדְבַה는 자발적 헌납을 가리키므로 ‘자원제’로 옮겨 본문의 자발성과 헌정성을 함께 드러냈습니다.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: according to how Yahweh your God blesses you
  chosen_korean: 야훼 당신들의 하나님께서 당신에게 복 주시는 만큼
  alternatives_korean:
  - 야훼 당신들의 하나님께서 당신에게 복하시는 대로
  - 야훼 당신들의 하나님께서 당신을 복 주신 만큼
  lexicon: HALOT
  rationale: כַּאֲשֶׁר는 기준/비례를 나타내므로 ‘-하는 만큼’이 가장 자연스럽고 의미도 정확합니다. ‘복 주시는’은 현재적·규범적 문맥을 살리면서도 히브리어의 조건적 비례를 드러냅니다.
theological_decisions:
- issue: 절기명과 한국어 교회 전통 명칭의 대응
  chosen_reading: 히브리어 חַג שָׁבֻעוֹת를 소스 중심으로 ‘칠칠절’로 풀어야 하나, 이 초안에서는 절기 지시를 유지하되 한국어 독자가 즉시 알아볼 수 있도록 간명하게 처리했습니다.
  alternative_readings:
  - 오순절
  - 칠칠절
  - 맥추절
  rationale: 본문은 특정 절기 규례를 말하므로 전통 교회 용어로 임의 치환하기보다 원문이 가리키는 절기의 성격을 보존해야 합니다. English POB도 Feast of Weeks로 명확히 해 두었으므로, 한국어에서는 해당 절기의 문자적 의미를 반영하는 용어 선택이 필요합니다.
  doctrine_reference: POB contested terms / festival nomenclature
