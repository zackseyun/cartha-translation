  source_fidelity: 초안은 칠 일간의 절기 준수와 야훼의 복이라는 주요 내용은 담았지만, 첫 절의 ‘야훼, 당신의 하나님’과 ‘야훼께서 택하실 곳’의 구문 관계를 분명히 하지 못했습니다. 또한 마지막 וְהָיִיתָ אַךְ שָׂמֵחַ는 ‘기쁘게 하라’가 아니라, 기쁨의 상태/명령을 나타내므로 수정이 필요합니다.
  naturalness: ‘그리하여 너는 기쁘게 하라’는 현대 한국어에서 목적어가 빠진 부자연스러운 표현입니다. 합쇼체에 맞추어 ‘기뻐하십시오’로 고치고, 소산과 노동을 자연스럽게 연결했습니다.
  terminology: יְהוָה는 감사 기록의 방침에 따라 ‘야훼’로 유지했습니다. ‘당신의 하나님 야훼’는 원문의 소유 관계를 보존하며, ‘절기를 지키십시오’는 חָגַג의 순례 절기 준수 의미를 반영합니다.
