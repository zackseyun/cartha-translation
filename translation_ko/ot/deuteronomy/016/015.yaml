revisions:
- from: 일곱 날 동안 야훼 하나님께서 택하신 곳에서 야훼 하나님께 절기를 지키라. 이는 야훼 하나님께서 네 모든 소산과 네 손으로 한 모든 일에서 네게 복을 주실 것임이라. 그리하여 너는 기쁘게 하라.
  to: 일곱 날 동안 야훼께서 택하실 곳에서 당신의 하나님 야훼를 위하여 절기를 지키십시오. 야훼 당신의 하나님께서 당신의 모든 소산과 당신의 손으로 하는 모든 일에 복을 주실 것이므로, 당신은 온전히 기뻐하십시오[a].
  rationale: 원문의 어순과 관계를 따라, 절기는 야훼를 위하여 지키며 그 장소는 야훼께서 장차 택하실 곳임을 명시했습니다. 축복의 범위를 ‘모든 소산’과 ‘손으로 하는 모든 일’로 보존했고, 마지막 אַךְ의 강조는 ‘온전히’ 및 주석의 대안으로 반영했습니다.
