  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
  footnotes:
  - marker: a
    text: Or 'you shall be only joyful' or 'you shall surely rejoice.' The Hebrew expression emphasizes full, unalloyed joy.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 날 동안 야훼께서 택하실 곳에서 당신의 하나님 야훼를 위하여 절기를 지키십시오. 야훼 당신의 하나님께서 당신의 모든 소산과 당신의 손으로 하는 모든 일에 복을 주실 것이므로, 당신은 온전히 기뻐하십시오[a].
  philosophy: optimal-equivalence
