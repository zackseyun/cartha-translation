  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
  footnotes:
  - marker: a
    text: Abib is the name of the month associated with early ripening grain; alternatively, 'the month of spring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아빕월을 지키고, 너희 하나님 야훼께 유월절을 지키십시오. 이는 아빕월에 너희 하나님 야훼께서 밤에 너희를 이집트에서 이끌어 내셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹר
  english_pob_choice: Observe
  chosen_korean: 지키십시오
  alternatives_korean:
  - 관찰하십시오
  - 준수하십시오
  - 기억하십시오
  lexicon: HALOT
  rationale: 절기와 율법 문맥에서 שׁמר는 단순한 기억보다 규정된 행위를 성실히 준수하라는 뜻이므로, 한국어로는 자연스럽고 명령 강도가 살아 있는 ‘지키십시오’를 택했습니다.
- source_word: חֹדֶשׁ הָאָבִיב
  english_pob_choice: the month of Abib
  chosen_korean: 아빕월
  alternatives_korean:
  - 아빕 달
  - 봄의 달
  - 봄철
  lexicon: HALOT
  rationale: 여기서는 계절 일반이 아니라 절기 달의 명칭이므로, 달 이름을 살린 ‘아빕월’로 옮겨 달력적·예전적 구체성을 유지했습니다.
- source_word: פֶּסַח
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 과월절
  - 패스오버
  lexicon: HALOT
  rationale: 히브리어 פֶּסַח의 표준 한국어 성경 용례를 따르되, 절기 명칭으로 널리 통용되는 ‘유월절’을 사용해 의미를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 하나님의 고유명 יהוה를 직접 사용하므로, 이를 제목어가 아닌 고유명으로 드러내는 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 문장 둘째 절의 인도 행위 동사
  chosen_reading: ‘이끌어 내셨습니다’
  alternative_readings:
  - ‘데리고 나오셨습니다’
  - ‘구출하셨습니다’
  rationale: 출애굽의 구속사적 사건을 나타내는 הוציא의 Hiphil을 살리면서도, 현대 한국어에서 자연스럽고 하나님의 주도성을 유지하는 표현으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy §1: original-language primacy and redemptive-historical clarity'
- issue: 야훼의 밤중 출애굽 강조
  chosen_reading: ‘밤에’
  alternative_readings:
  - ‘한밤중에’
  - ‘야간에’
  rationale: לָיְלָה의 시간 부사를 과장 없이 직접 반영하여, 사건의 역사적 시점과 긴박감을 그대로 드러냈습니다.
  doctrine_reference: 'Translation philosophy §1: preserve source force without embellishment'
