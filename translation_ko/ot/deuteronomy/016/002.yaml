  source_fidelity: 원문의 단수 명령, 제의적 동사 זבח, ‘양 떼와 소 떼에서’라는 넓은 가축 범주, 그리고 야훼께서 자신의 이름을 그곳에 머물게 하시기 위해 선택하실 장소라는 목적절을 유지하도록 고쳤습니다. 기존 번역의 ‘그곳에서입니다’는 문법적으로 독립된 서술절이 되어 원문의 장소 수식 관계를 흐렸습니다.
  naturalness: 기존 문장은 ‘유월절을 드려야 합니다. 그것은 … 드리는 것이며’라는 분절과 마지막의 ‘곳에서입니다’가 현대 표준 한국어로 부자연스럽습니다. 한 문장 안에서 희생 행위와 그 장소를 연결해 자연스럽게 정리했습니다.
  terminology: ‘야훼’, ‘하나님’, ‘유월절’을 유지했습니다. זבח의 제의적 희생 행위는 ‘제물로 바치다’로 드러냈고, לְשַׁכֵּן의 사역 의미는 ‘이름을 그곳에 머물게 하시려고’로 반영했습니다.
