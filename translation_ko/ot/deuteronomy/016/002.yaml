source:
  edition: WLC
  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
  footnotes:
  - marker: a
    text: '''The Passover'' here is paired with ''from the flock and the herd.'' Some understand this as including not only the Passover victim itself but also the festival sacrifices associated with Passover/Unleavened Bread.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 양 떼와 소 떼에서 유월절을 네 하나님 야훼께 제물로 바쳐야 합니다. 야훼께서 자신의 이름을 그곳에 머물게 하시려고 선택하실 곳에서 바쳐야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유월절’은 여기서 유월절 희생 제물 자체뿐 아니라 유월절과 무교절에 관련된 제물까지 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  english_pob_choice: And you shall sacrifice
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 희생해야 합니다
  - 제사해야 합니다
  - 잡아 드려야 합니다
  lexicon: HALOT
  rationale: זבח의 제의적 ‘희생/제사’ 의미를 살리되, 현대 한국어에서 자연스럽고 법규 문맥에 맞는 표현으로 ‘드리다’를 택했습니다. ‘잡아’는 동작을 드러내지만 제의성을 약화시킬 수 있습니다.
- source_word: פֶּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 제물
  - 유월절 희생제물
  lexicon: HALOT
  rationale: 여기서는 ‘드리다’의 목적어로 쓰여 절기와 제물을 함께 가리킬 수 있으므로, 한국어에서는 통상적인 ‘유월절’로 옮겨 본문 압축성을 살렸습니다. 본문 뒤의 주석으로 희생물 범위의 넓이를 보완합니다.
- source_word: צֹאן וּבָקָר
  english_pob_choice: from the flock and the herd
  chosen_korean: 양 떼와 소 떼에서
  alternatives_korean:
  - 양과 소에서
  - 가축 떼에서
  lexicon: HALOT
  rationale: 히브리어의 집합명사 두 쌍을 유지해 범위를 넓게 드러내고, POB의 ‘from’을 한국어 조사 ‘에서’로 반영했습니다. ‘양과 소’보다 떼 단위를 살려 제의용 가축 범주를 보존했습니다.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  english_pob_choice: to make his name dwell there
  chosen_korean: 자기 이름을 그곳에 두시려고
  alternatives_korean:
  - 자기 이름이 그곳에 거하게 하시려고
  - 자기 이름을 그곳에 두려고
  lexicon: HALOT
  rationale: שכן의 사역형을 직역하되, 한국어에서 ‘이름이 거하다’보다 자연스러운 ‘이름을 두다’로 옮겨 신적 임재와 소유의 관용구를 유지했습니다. ‘자기 이름’은 신적 이름의 주체를 분명히 합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 야훼가 직접 나오므로, POB 지침에 따라 여호와나 일반 호칭 ‘주’가 아니라 고유명사 음역 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘유월절’과 ‘양 떼와 소 떼’의 범위
  chosen_reading: 본문은 축제 전체와 제의적 희생의 넓이를 그대로 두고, 해석을 본문 밖 주석으로 처리했습니다.
  alternative_readings:
  - 유월절 제물과 무교절 제사로 풀어 쓰기
  - 양만을 암시하는 것으로 좁혀 번역하기
  rationale: ‘양 떼와 소 떼’는 일반적인 유월절 어린양만을 즉시 떠올리게 하지 않으므로, 본문을 좁혀 조화시키지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy 1 and 3
