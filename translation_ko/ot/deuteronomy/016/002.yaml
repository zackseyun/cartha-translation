  to: 너는 양 떼와 소 떼에서 유월절을 네 하나님 야훼께 제물로 바쳐야 합니다. 야훼께서 자신의 이름을 그곳에 머물게 하시려고 선택하실 곳에서 바쳐야 합니다[a].
  rationale: 문법적으로 불완전한 장소 표현을 앞 절의 ‘바쳐야 합니다’에 연결하고, 원문의 제의적 행위와 장소 선택 목적절을 명료하게 재구성했습니다. ‘유월절’의 범위는 본문에서 과도하게 한정하지 않고 주석으로 남겼습니다.
