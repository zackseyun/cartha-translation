  - 절기 첫날의 다른 제물로 넓게 이해함
  rationale: 히브리어는 단지 '첫날'이라고만 말하므로, 본문이 스스로 명시하지 않은 유월절 희생을 주석적으로 확정하지 않았습니다.
  doctrine_reference: 본문이 보존하는 해석의 긴장을 유지합니다.
