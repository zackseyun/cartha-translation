  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
  footnotes:
  - marker: a
    text: Or 'none of the meat.' The Hebrew word is literally 'flesh,' a common sacrificial term.
    reason: lexical_alternative
  - marker: b
    text: '''On the first day'' may refer specifically to the Passover sacrifice at the festival''s opening, though the Hebrew does not explicitly say ''Passover lamb'' here.'
    reason: alternative_reading
translation:
  language: ko
  text: 누룩은 사흘 동안이 아니라 칠 일 동안 네 온 땅 안에 보이지 말아야 하며, 저녁에 첫날에 네가 제물로 바친 고기의 한 조각도 아침까지 남겨 두어서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고기’. 히브리어는 문자적으로 ‘살/flesh’이며, 제의 문맥에서 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘첫날’은 절기 시작의 유월절 제물을 가리킬 수도 있지만, 히브리어는 여기서 ‘유월절 양’이라고 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה / שְׂאֹר
  english_pob_choice: No leaven is to be seen
  chosen_korean: 누룩은 … 보이지 말아야 하며
  alternatives_korean:
  - 누룩이 보여서는 안 되며
  - 누룩이 드러나서는 안 되며
  lexicon: WLC
  rationale: נִפְעַל형의 금지문을 자연스러운 현대 한국어 수동 금지로 옮기되, ritually prohibited 'seen'의 상태를 살려 '보이지 말아야'로 렌더링했습니다.
- source_word: בְּכָל גְּבֻלְךָ
  english_pob_choice: within all your territory
  chosen_korean: 네 온 땅 안에
  alternatives_korean:
  - 네 모든 경계 안에
  - 네 전 영역 안에
  lexicon: WLC
  rationale: גְּבוּל의 경계/영역 감각을 한국어 자연성에 맞춰 '온 땅 안'으로 풀되, 범위 전체를 뜻하는 포괄성을 유지했습니다.
- source_word: שְׂאֹר
  english_pob_choice: leaven
  chosen_korean: 누룩
  alternatives_korean:
  - 발효종
  - 이스트
  lexicon: HALOT
  rationale: 절기 율법에서의 표준 대응어로 '누룩'을 사용해 제의적 문맥을 살렸습니다.
- source_word: מִן הַבָּשָׂר
  english_pob_choice: none of the flesh
  chosen_korean: 고기의 한 조각도
  alternatives_korean:
  - 그 고기의 어느 것도
  - 그 고기의 살점도
  lexicon: HALOT
  rationale: בָּשָׂר의 직역 감각인 '고기/살'을 유지하되, 한국어에서 자연스러운 금지 표현으로 '한 조각도 … 남겨 두어서는 안 됩니다'를 택했습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 새벽까지
  - 아침이 될 때까지
  lexicon: HALOT
  rationale: 시간의 한계를 간명하게 표현하는 한국어 관용으로 옮겨, 제의적 보관 금지를 분명히 했습니다.
theological_decisions:
- issue: ‘첫날’의 지시 대상
  chosen_reading: 본문의 '첫날'을 그대로 두고, 절기 이름을 덧붙여 특정하지 않았습니다.
  alternative_readings:
  - 유월절 제물로 구체화함
  - 절기 첫날의 다른 제물로 넓게 이해함
  rationale: 히브리어는 단지 '첫날'이라고만 말하므로, 본문이 스스로 명시하지 않은 유월절 희생을 주석적으로 확정하지 않았습니다.
  doctrine_reference: 본문이 보존하는 해석의 긴장을 유지합니다.
