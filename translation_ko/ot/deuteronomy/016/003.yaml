  verdict: revise
  source_fidelity: 전반적으로 히브리어의 명령, 기간, 무교병의 수식어, 급히 출애굽한 이유와 기억의 목적을 충실히 반영합니다. 다만 마지막 문장의 ‘이는 … 하려는 것입니다’는 앞 문장의 이유절과 목적절을 분리하여 연결하는 방식이므로, 원문의 ‘왜냐하면 … כדי/למען …’ 관계를 한 문장 안에서 더 직접적으로 드러내는 것이 좋습니다.
  naturalness: 합쇼체는 일관됩니다. 그러나 성경의 직접 خطاب에서 ‘당신’은 현대 표준 한국어에서 다소 대립적이거나 부자연스럽게 들릴 수 있습니다. 원문의 남성 단수 명령을 보존하는 ‘너는’을 쓰는 편이 자연스럽고 정확합니다. 또한 각주 표지는 해당 어구인 ‘고난의 떡’ 바로 뒤에 두는 것이 독자에게 명확합니다.
  terminology: ‘누룩 있는 떡’, ‘무교병’, ‘고난의 떡’은 문맥과 전통적 성경 용례에 적절합니다. עֹנִי의 의미 범위를 보존하는 각주도 적절합니다.
  issues:
