    issue: 이유와 목적의 문장 연결
    rationale: 히브리어는 ‘네가 급히 나왔기 때문에, 네가 … 기억하도록’이라는 인과·목적 관계를 연속해서 제시합니다. ‘이는 … 하려는 것입니다’로 별도 문장을 만들기보다 ‘… 나왔기 때문에, … 기억하도록 하려는 것입니다’로 연결하면 관계가 더 충실합니다.
