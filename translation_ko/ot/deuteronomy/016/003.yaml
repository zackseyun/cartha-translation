  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
  footnotes:
  - marker: a
    text: Or 'the bread of poverty' or 'the bread of misery.' The Hebrew phrase may emphasize hardship, deprivation, or affliction associated with the exodus.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 누룩 있는 떡을 그것과 함께 먹지 마십시오. 칠 일 동안 그것과 함께 무교병, 곧 고난의 떡[a]을 먹어야 합니다. 너는 급히 이집트 땅에서 나왔기 때문에, 네가 이집트 땅에서 나온 날을 평생 기억하도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난의 떡’, ‘비참의 떡’으로도 옮길 수 있습니다. 히브리어 표현은 출애굽과 연결된 고난, 결핍, 혹은 고통을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  english_pob_choice: with it
  chosen_korean: 그것과 함께
  alternatives_korean:
  - 그것 위에
  - 그것에
  lexicon: HALOT
  rationale: 유월절 제의 문맥에서 עַל은 단순한 위치보다 ‘동반하여 먹다’는 뜻으로 쓰이므로, 한국어로도 자연스럽게 ‘그것과 함께’로 풀어 옮겼습니다.
- source_word: חָמֵץ
  english_pob_choice: leavened bread
  chosen_korean: 누룩 있는 떡
  alternatives_korean:
  - 누룩
  - 누룩 든 빵
  lexicon: HALOT
  rationale: 금지 대상이 누룩 자체가 아니라 누룩이 들어간 음식이므로, 문맥상 ‘떡’으로 옮기되 누룩의 유무를 분명히 했습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 떡
  - 무누룩 떡
  lexicon: HALOT
  rationale: 절기 음식의 정형화된 대상을 드러내기 위해 ‘무교병’을 사용했고, 이어지는 설명구로 뜻을 보완했습니다.
- source_word: לֶחֶם עֹנִי
  english_pob_choice: the bread of affliction
  chosen_korean: 고난의 떡
  alternatives_korean:
  - 고통의 떡
  - 곤고의 떡
  - 가난의 떡
  lexicon: HALOT
  rationale: עֹנִי가 단순한 경제적 빈곤보다 이집트에서의 억압과 고통을 함께 가리키므로, 그 신학적 무게를 살려 ‘고난’으로 옮겼습니다.
- source_word: בְחִפָּזוֹן
  english_pob_choice: in haste
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 황급히
  lexicon: HALOT
  rationale: 출애굽의 긴박성을 간결하게 전달하는 현대 한국어 표현으로 ‘급히’를 택했습니다.
theological_decisions:
- issue: 고난의 떡의 의미
  chosen_reading: 무교병을 ‘고난의 떡’으로 옮겨, 출애굽의 속박과 급박한 해방을 기억하게 하는 기념적 의미를 유지했습니다.
  alternative_readings:
  - 가난의 떡
  - 고통의 떡
  rationale: 본문은 단순한 식재료 설명이 아니라 출애굽 사건을 기억하게 하는 예전적 표지이므로, 경제적 빈곤으로만 좁히지 않고 억압과 고난의 기억을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §3, §5
