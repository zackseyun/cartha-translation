revisions:
- from: 일 년에 세 번, 남자들 모두가 야훼 당신들의 하나님 앞에, 그분이 선택하실 곳에서 나타나야 합니다. 곧 무교절에, 칠칠절에, 그리고 초막절에 나타나야 합니다[c][b]. 아무도 야훼 앞에 빈손으로 나타나서는 안 됩니다.
  to: 너희의 모든 남자는 해마다 세 번, 곧 무교절과 칠칠절과 초막절[b]에, 야훼 너희의 하나님 앞, 그분이 택하실 곳에 나타나야 합니다. 아무도 야훼 앞에 빈손으로[c] 나타나서는 안 됩니다.
  rationale: 히브리어의 출현 의무, 세 절기, 하나님이 택하실 장소의 관계를 자연스러운 한국어 어순으로 재구성했습니다. 남성으로 한정된 의무 범위와 야훼라는 신명은 유지했습니다. 또한 각주 b와 c를 각각 초막절 및 빈손으로에 정확히 연결하여 앵커 오류를 바로잡았습니다.
