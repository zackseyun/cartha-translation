id: DEU.16.16
reference: Deuteronomy 16:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
  footnotes:
  - marker: a
    text: Or 'shall be seen before the LORD'; the Hebrew verb is literally passive/reflexive, but in this context it functions as the idiom for presenting oneself before God.
    reason: lexical_alternative
  - marker: b
    text: '''The Feast of Booths'' is traditionally rendered ''the Feast of Tabernacles.'''
    reason: alternative_reading
  - marker: c
    text: '''Empty-handed'' means coming without the required gift or offering.'
    reason: cultural_note
translation:
  language: ko
  text: 일 년에 세 번, 남자들 모두가 야훼 당신들의 하나님 앞에, 그분이 선택하실 곳에서 나타나야 합니다. 곧 무교절에, 칠칠절에, 그리고 초막절에 나타나야 합니다[c][b]. 아무도 야훼 앞에 빈손으로 나타나서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘초막절’은 전통적으로 ‘장막절’로도 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: ‘빈손으로’는 요구된 예물이나 헌물 없이 나아오는 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה
  english_pob_choice: Three times a year
  chosen_korean: 일 년에 세 번
  alternatives_korean:
  - 해마다 세 번
  - 일 년 동안 세 번
  lexicon: HALOT
  rationale: 연례적으로 반복되는 절기 의무를 한국어로 자연스럽게 살리면서 원문의 수량 표현을 유지했습니다.
- source_word: כָל זְכוּרְ/ךָ
  english_pob_choice: all your males
  chosen_korean: 남자들 모두가
  alternatives_korean:
  - 모든 남자들이
  - 남성들 모두가
  lexicon: HALOT
  rationale: 법적 의무의 범위가 남성에게 한정된다는 점을 소거하지 않도록 성별 지시를 그대로 반영했습니다.
- source_word: יְהוָ֣ה אֱלֹהֶ֗י/ךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 여러분의 하나님
  - 야훼 너희의 하나님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: דת명은 프로젝트 기본값에 따라 야훼로 옮기고, 복수 소유격은 문맥상 공동체를 향한 직접 호칭으로 풀었습니다.
- source_word: בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר
  english_pob_choice: in the place that he will choose
  chosen_korean: 그분이 선택하실 곳에서
  alternatives_korean:
  - 그가 택하실 곳에서
  - 그분이 고르실 곳에서
  lexicon: HALOT
  rationale: 미래적 선택의 의미를 살려 ‘선택하실’로 옮기고, 예배 장소의 지정성을 간결하게 표현했습니다.
- source_word: חַג הַ/מַּצּ֛וֹת
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 무효절
  - 누룩 없는 빵의 절기
  lexicon: HALOT
  rationale: 오래 정착된 절기명이며, 본문의 축제 이름을 가장 간명하게 전달합니다.
- source_word: חַג הַ/שָּׁבֻע֖וֹת
  english_pob_choice: the Feast of Weeks
  chosen_korean: 칠칠절
  alternatives_korean:
  - 주간절
  - 맥추절
  lexicon: HALOT
  rationale: 히브리어 명칭의 문자적 의미를 반영하면서 한국어 성경에서 널리 통용되는 이름을 사용했습니다.
- source_word: חַג הַ/סֻּכּ֑וֹת
  english_pob_choice: the Feast of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 초막의 절기
  lexicon: HALOT
  rationale: 전통적 한국어 성경 용례를 따르되, 절기의 의미가 드러나도록 옮겼습니다.
- source_word: רֵיקָֽם
  english_pob_choice: empty-handed
  chosen_korean: 빈손으로
  alternatives_korean:
  - 헛되이
  - 아무것도 없이
  lexicon: HALOT
  rationale: 의례적 헌물 없이 나아오는 상태를 한국어 관용으로 자연스럽게 전달합니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 신학적 일반칭으로 바꾸지 않고 고유명으로 드러내기 위해 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘나타나다/보이다’의 방향성
  chosen_reading: 나타나야 합니다
  alternative_readings:
  - 보여져야 합니다
  - 보이게 되어야 합니다
  rationale: 히브리어 Niphal의 수동·사동적 관용구가 여기서는 하나님 앞에 예배자로 ‘드러나서 나아감’을 뜻하므로, 자연스러운 한국어로 의무적 출현을 살렸습니다.
  doctrine_reference: English POB lexical note on יֵרָאֶה
