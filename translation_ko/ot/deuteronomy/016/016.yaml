    rationale: 원문은 한 번의 동사로 세 절기와 선택될 장소를 수식합니다. 한국어에서도 이를 한 문장으로 연결할 수 있습니다.
  revised_text: 너희의 모든 남자는 해마다 세 번, 곧 무교절과 칠칠절과 초막절[b]에, 야훼 너희의 하나님 앞, 그분이 택하실 곳에 나타나야 합니다. 아무도 야훼 앞에 빈손으로[c] 나타나서는 안 됩니다.
