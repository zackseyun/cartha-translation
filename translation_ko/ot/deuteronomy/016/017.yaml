  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
  footnotes:
  - marker: a
    text: Literally, 'the gift of his hand,' an idiom referring to what one has available to give.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 각자의 손이 가진 것에 따라, 곧 야훼 당신의 하나님이 그에게 주신 복에 따라 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손의 선물’이며, 여기서는 사람이 실제로 내어줄 수 있는 몫을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: Each man
  chosen_korean: 사람은
  alternatives_korean:
  - 각 사람은
  - 각 남자는
  lexicon: HALOT
  rationale: 히브리어 단수는 분배적 의미로 쓰였으므로 한국어에서도 분배를 살리되, 성별을 과도하게 드러내지 않는 자연스러운 표지로 옮겼습니다. 본문 기능상 ‘each’의 분배 의미가 핵심입니다.
- source_word: כְּ/מַתְּנַת יָד/וֹ
  english_pob_choice: according to the gift of his hand
  chosen_korean: 각자의 손이 가진 것에 따라
  alternatives_korean:
  - 손의 선물에 따라
  - 손에 있는 선물에 따라
  lexicon: HALOT
  rationale: 직역하면 ‘손의 선물’이지만, 영어 POB 주석처럼 이것은 ‘내어줄 수 있는 몫/가용한 것’을 가리키는 관용구이므로 한국어에서는 의미를 드러내면서도 원문의 손 이미지를 유지했습니다.
- source_word: כְּ/בִרְכַּת
  english_pob_choice: according to the blessing
  chosen_korean: '...주신 복에 따라'
  alternatives_korean:
  - '...주신 축복에 따라'
  - '...주신 복을 따라'
  lexicon: HALOT
  rationale: ‘복/축복’ 가운데 구약적이고 간결한 ‘복’을 택해, 야훼께서 실제로 베푸신 공급의 뉘앙스를 살렸습니다. 앞의 כְּ도 한국어의 ‘-에 따라’로 분명히 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사본의 신명기표현을 따라 고유신명 ‘야훼’를 유지했습니다. 전통적 대체칭호인 ‘여호와’는 사용하지 않았습니다.
theological_decisions:
- issue: 율법문맥에서 요구되는 헌물의 기준
  chosen_reading: 각 사람의 실제로 가진 몫과 야훼의 주신 복을 기준으로 드리게 하는 요구로 읽었습니다.
  alternative_readings:
  - 형식적 의무의 최소치로만 읽는 해석
  - 단순한 자발적 헌납 권고로 읽는 해석
  rationale: 본문은 분배적 기준(‘손이 가진 것’)과 신적 공급(‘야훼…주신 복’)을 함께 두어, 헌물이 소유량과 하나님의 베푸심에 비례해야 함을 가르칩니다. 이를 약화하지 않도록 보존했습니다.
  doctrine_reference: 신명기 16:17; 출애굽기 35:5, 21; 고린도후서 8:12
- issue: 야훼 신명 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주
  - 주님
  rationale: 이 절은 명칭이 아니라 고유신명 자체를 사용하므로, 대체 표지보다 원문 식별성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
