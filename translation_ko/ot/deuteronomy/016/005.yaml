  - 주님
  rationale: 이 프로젝트의 기준어는 YHWH를 학술적 음역인 '야훼'로 드러내어 언약 নাম을 가리키는 본문의 특성을 보존하는 것입니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
