- source_word: הַפָּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 제사
  - 유월절 양
  lexicon: HALOT
  rationale: 이 구절에서는 절기와 그 제의가 겹쳐 있으나, 한국어 성경에서 가장 직접적이고 읽기 쉬운 대응은 '유월절'이며, 제의적 의미는 앞의 동사로 충분히 드러납니다.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  english_pob_choice: in any one of your gates
  chosen_korean: 성읍들 가운데 어느 한 곳
  alternatives_korean:
  - 성문들 가운데 어느 한 곳
  - 당신의 문들 가운데 어느 한 곳
  lexicon: HALOT
  rationale: '''שער''는 문자적으로 ''문''이지만 신명기에서는 성읍/거주지에 대한 환유로 자주 쓰이므로, 의미를 드러내는 ''성읍들 가운데 어느 한 곳''으로 풀어 옮겼습니다.'
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 당신의 하나님 여호와
  - 당신의 하나님 주
  lexicon: Standard transliteration / POB glossary
  rationale: 지침에 따라 신명기의 YHWH는 '야훼'로 옮기고, 소유격 구조는 한국어 어순에 맞게 '당신의 하나님 야훼'로 배치했습니다.
theological_decisions:
