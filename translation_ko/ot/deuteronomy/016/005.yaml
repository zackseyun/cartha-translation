lexical_decisions:
- source_word: לֹא תוּכַל
  english_pob_choice: You may not
  chosen_korean: ~할 수 없습니다
  alternatives_korean:
  - ~해서는 안 됩니다
  - ~할 수 없습니다
  lexicon: HALOT
  rationale: 법조문 맥락에서 단순한 능력 부족이 아니라 금지의 뜻이므로, 현대 한국어에서는 자연스러운 금지 표현인 '~할 수 없습니다'로 옮겼습니다.
- source_word: לִזְבֹּחַ
