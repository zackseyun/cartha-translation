translation:
  language: ko
  text: 당신의 하나님이신 야훼께서 당신에게 주시는 성읍들 가운데 어느 한 곳에서도 유월절 제사를 드릴 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
