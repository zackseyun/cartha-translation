source:
  edition: WLC
  text: יַעֲרֹ֤ף כַּ/מָּטָר֙ לִקְחִ֔/י תִּזַּ֥ל כַּ/טַּ֖ל אִמְרָתִ֑/י כִּ/שְׂעִירִ֣ם עֲלֵי דֶ֔שֶׁא וְ/כִ/רְבִיבִ֖ים עֲלֵי עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
  footnotes:
  - marker: a
    text: 'Or ''drop'' / ''distill'': the Hebrew verb pictures teaching descending like rain.'
    reason: lexical_alternative
  - marker: b
    text: '''Showers'' renders a rare Hebrew term that may denote light rain or raindrops.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 교훈은 비처럼 내리고, 내 말은 이슬처럼 맺히기를. 어린 풀 위에 내리는 소낙비 같고, 푸른 풀 위에 내리는 많은 비 같기를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떨어지기를’, ‘흘러내리기를’. 히브리어 동사는 교훈이 비처럼 내려오는 이미지를 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 희귀어로, 가는 비나 소나기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְחִי
  english_pob_choice: my teaching
  chosen_korean: 내 교훈
  alternatives_korean:
  - 내 가르침
  - 내 교훈의 말
  lexicon: HALOT
  rationale: לֶקַח은 단순한 ‘배움’보다 주는/받는 ‘교훈·가르침’의 뜻이 강하므로, 합쇼체 시에서 자연스럽고 소스의 교육적 함의를 살린 ‘내 교훈’을 택했습니다.
- source_word: תִּזַּל
  english_pob_choice: drip
  chosen_korean: 맺히기를
  alternatives_korean:
  - 흐르기를
  - 뚝뚝 떨어지기를
  lexicon: HALOT
  rationale: 이 동사는 이슬처럼 잔잔하게 흘러내리거나 맺히는 이미지를 주므로, 현대 한국어에서 시적이면서도 과도하게 물리적이지 않은 ‘맺히기를’로 옮겼습니다.
- source_word: כִּשְׂעִירִם
  english_pob_choice: showers
  chosen_korean: 소낙비
  alternatives_korean:
  - 가는 비
  - 이슬비
  lexicon: HALOT
  rationale: 희귀어라 해석상 여지가 있지만 문맥상 가벼운 비/소나기를 가리키므로, ‘쇼어즈’의 자연스러운 한국어 대응으로 ‘소낙비’를 사용했습니다.
- source_word: עֲלֵי דֶשֶׁא / עֵשֶׂב
  english_pob_choice: the tender grass / the green plants
  chosen_korean: 어린 풀 / 푸른 풀
  alternatives_korean:
  - 어린 잔디
  - 새싹 풀
  - 푸른 식물
  lexicon: HALOT
  rationale: דֶשֶׁא와 עֵשֶׂב은 둘 다 새로 돋는 초목을 가리키므로, 과도한 해설을 피하면서도 대비를 살릴 수 있는 ‘어린 풀’과 ‘푸른 풀’로 처리했습니다.
theological_decisions:
- issue: 모세의 말하기를 비·이슬의 이미지로 비유하는 시적 평행법
  chosen_reading: ‘내 교훈/내 말’의 병렬을 그대로 살려, 설교적 일반화 없이 두 행이 모두 하늘에서 내리는 수분의 이미지로 이어지게 했습니다.
  alternative_readings:
  - 해설적으로 풀어 ‘내 가르침은 비처럼 퍼집니다’로 의역
  - 평행을 약화시켜 단순 반복으로 처리
  rationale: 본문은 수사학적 평행법이 핵심이므로, 의미를 설명하기보다 이미지의 누적 효과를 보존하는 쪽이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시적 평행법과 계시 전달의 형상 유지
- issue: 희귀어 שְׂעִירִם의 의미 범위
  chosen_reading: 문맥에 따라 ‘소낙비’로 옮기되, 너무 특정한 기상용어로 고정하지 않았습니다.
  alternative_readings:
  - 가는 비
  - 이슬비
  - 소낙비로 번역하지 않고 음차/주석 처리
  rationale: 히브리어 원문의 불확실성을 지우지 않으면서도 한국어 독자가 즉시 이해할 수 있는 수준의 자연어를 확보하기 위한 선택입니다.
  doctrine_reference: 문맥 우선의 시적 번역
