source:
  edition: WLC
  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the years of generation and generation,'' an idiom for successive generations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your ancestor,' if taken more broadly than one's immediate father.
    reason: lexical_alternative
translation:
  language: ko
  text: 옛적의 날들을 기억하십시오. 세대에서 세대로 이어진 세월을 숙고하십시오[a]. 아버지에게 물으십시오. 그러면 그가 당신에게 알려 줄 것입니다. 장로들에게도 물으십시오. 그러면 그들이 당신에게 말해 줄 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘세대와 세대의 해들’이며, 이어지는 여러 세대를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지’는 가까운 아버지를 뜻할 수도 있고, 더 넓게는 조상을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר / יְמוֹת עוֹלָם
  english_pob_choice: Remember the days of old
  chosen_korean: 옛날의 날들을 기억하십시오
  alternatives_korean:
  - 옛적의 날들을 기억하십시오
  - 옛날을 기억하십시오
  lexicon: HALOT
  rationale: 명령형 זכר의 직접 명령성을 살리면서, יְמוֹת עוֹלָם의 관용적 의미인 먼 옛날을 표준적인 ‘옛날의 날들’로 옮겼습니다.
- source_word: בִּינוּ שְׁנוֹת דּוֹר וָדֹר
  english_pob_choice: consider the years of generation after generation
  chosen_korean: 대대로 이어진 세월을 생각해 보십시오
  alternatives_korean:
  - 세대와 세대의 세월을 분별해 보십시오
  - 대대의 연한을 살펴보십시오
  lexicon: HALOT
  rationale: בין의 분별/숙고 뉘앙스를 ‘생각해 보십시오’로 자연스럽게 살리고, ‘generation after generation’의 관용을 ‘대대로 이어진’으로 풀었습니다.
- source_word: אָבִיךָ / זְקֵנֶיךָ
  english_pob_choice: your father ... your elders
  chosen_korean: 당신의 아버지 ... 당신의 장로들
  alternatives_korean:
  - 당신의 아버지 ... 당신의 어른들
  - 당신의 조상 ... 당신의 연장자들
  lexicon: HALOT
  rationale: אָבִיךָ는 기본 의미인 ‘아버지’를 유지하고, זְקֵנֶיךָ는 단순한 나이 듦보다 공동체의 권위를 가진 연장자를 뜻하므로 ‘장로들’로 옮겼습니다.
- source_word: וְיַגֵּדְךָ / וְיֹאמְרוּ לָךְ
  english_pob_choice: and he will tell you ... and they will say to you
  chosen_korean: 그가 당신에게 말할 것이며 ... 그들이 당신에게 말할 것입니다
  alternatives_korean:
  - 그가 당신에게 알려 줄 것이며 ... 그들이 당신에게 말할 것입니다
  - 그가 당신에게 전할 것이며 ... 그들이 당신에게 말할 것입니다
  lexicon: HALOT
  rationale: נגד와 אמר의 평행을 한국어에서 과도하게 중복하지 않도록 모두 ‘말하다’ 계열로 옮기되, 앞뒤 문장을 연결해 예언적 권면의 흐름을 유지했습니다.
theological_decisions:
- issue: 전통 교회어 ‘기억하라/묵상하라’의 조합과 본문 명령의 직접성
  chosen_reading: ‘기억하십시오’와 ‘생각해 보십시오’로 직설적 권면을 유지했습니다.
  alternative_readings:
  - ‘기억하라’와 ‘분별하라’
  - ‘기억하십시오’와 ‘묵상하십시오’
  rationale: 본문은 역사적 기억과 숙고를 함께 명령하므로, 경건어를 덧입히기보다 현대 한국어로 직접적인 권면을 전달하는 편이 원문 기능을 더 잘 드러냅니다.
  doctrine_reference: 신명기 32장의 언약 갱신/증언 호출 구조
- issue: ‘your father’의 대표성
  chosen_reading: 주문장에는 ‘아버지’를 두고, 주석으로 더 넓은 조상 의미 가능성을 열었습니다.
  alternative_readings:
  - ‘당신의 조상’
  - ‘당신의 아버지’
  rationale: 히브리어의 표면형은 단수 ‘아버지’이므로 본문은 이를 유지하되, POB 주석 방식에 맞춰 더 넓은 대표 의미를 부각할 수 있음을 별도 표시했습니다.
  doctrine_reference: 가정-세대 전승의 언약 교육 원리
