revisions:
- from: 옛날의 날들을 기억하십시오[a]; 대대로 이어진 세월을 생각해 보십시오. 당신의 아버지에게 물어보면 그가 당신에게 말할 것이며, 당신의 장로들에게 물어보면 그들이 당신에게 말할 것입니다[b].
  to: 옛적의 날들을 기억하십시오. 세대에서 세대로 이어진 세월을 숙고하십시오[a]. 아버지에게 물으십시오. 그러면 그가 당신에게 알려 줄 것입니다. 장로들에게도 물으십시오. 그러면 그들이 당신에게 말해 줄 것입니다.[b]
  rationale: 원문의 명령형 권면, 고대의 날들과 세대들의 세월이라는 병행, 그리고 아버지와 장로들에게서 전승을 듣는 구조를 현대 표준 한국어 합쇼체로 보존했습니다. 한국어의 명료성을 위해 두 번째 ‘물으십시오’를 보충하되, 결과 동사는 각각 ‘알려 주다’와 ‘말해 주다’로 구별했습니다. 각주 a는 히브리어 표현을 정확하고 자연스럽게 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:06Z'
