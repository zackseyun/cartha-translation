  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
  footnotes:
  - marker: a
    text: Or 'Jacob the measuring line of his inheritance' or 'Jacob the lot of his inheritance.' The Hebrew חֶבֶל can refer literally to a measuring line and, by extension, to an allotted portion.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 몫은 그의 백성이며, 야곱은 그의 기업의 분깃입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱은 그의 기업의 측량줄’ 혹은 ‘야곱은 그의 기업의 몫’으로도 옮길 수 있습니다. 히브리어 חֶבֶל은 문자적으로는 측량줄을 뜻하며, 확장하여 할당된 몫을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 יְהוָה로 직접 제시되므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 사용하여 원문 고유명을 드러냈습니다.
- source_word: חֵלֶק
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 분깃
  lexicon: HALOT
  rationale: 문맥상 상속과 배분의 이미지가 있으므로 ‘몫’으로 옮겨, 앞절의 소유·배분 관계를 자연스럽게 드러냈습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성
  alternatives_korean:
  - 그의 ժողովուրդ
  - 그의 민족
  lexicon: HALOT
  rationale: 언약적 맥락에서 עַם은 단순한 민족보다 ‘백성’이 더 정확하여, 야훼와의 관계성을 살렸습니다.
- source_word: חֶבֶל
  english_pob_choice: share
  chosen_korean: 분깃
  alternatives_korean:
  - 몫
  - 할당
  - 줄
  lexicon: HALOT
  rationale: חֶבֶל은 측량줄과 그로 인한 분배 몫을 함께 가리킬 수 있으므로, 한국어 성경 전통과 시적 평행을 살리는 ‘분깃’을 택했습니다.
theological_decisions:
- issue: יהוה의 고유명 표기
  chosen_reading: ‘야훼’로 표기하여 언약의 이름을 직접 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 처리
  - ‘여호와’로 표기
  rationale: 본문이 신명사를 직접 사용하므로, 인칭·호칭으로 완화하지 않고 고유명 자체를 보존하는 것이 원문의 강조를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
