source:
  edition: WLC
  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'like the apple of his eye.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb rendered 'he cared for him' can also mean 'he gave him understanding' or 'he paid close attention to him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 광야의 땅에서 그를 찾아내셨고, 울부짖는 황무지 곧 황야 가운데서 그를 둘러싸셨으며, 그를 돌보셨고, 그의 눈동자처럼 그를 지키셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈동자’는 전통적으로 ‘눈의 사과’로도 옮겨집니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘돌보셨고’는 ‘그를 이해하게 하셨다’ 또는 ‘그에게 주의를 기울이셨다’는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  english_pob_choice: he found him
  chosen_korean: 그를 찾아내셨고
  alternatives_korean:
  - 그를 찾으셨고
  - 그를 발견하셨고
  lexicon: HALOT
  rationale: מצא의 기본 의미를 살려 ‘찾아내셨고’로 옮기면, 하나님이 척박한 곳에서 이스라엘을 ‘발견’하신 생생한 이미지를 유지할 수 있습니다.
- source_word: בְּאֶרֶץ מִדְבָּר וּבְתֹהוּ יְלֵל יְשִׁמֹן
  english_pob_choice: in a desert land, and in the howling waste of the wilderness
  chosen_korean: 광야의 땅 … 울부짖는 황무지 곧 황야 가운데서
  alternatives_korean:
  - 사막의 땅
  - 폐허 같은 광야
  lexicon: HALOT
  rationale: מִדְבָּר와 תֹהוּ, יְלֵל יְשִׁמֹן의 중첩된 황량함을 모두 살리기 위해 ‘광야의 땅’과 ‘울부짖는 황무지 곧 황야’로 나누어 표현했습니다.
- source_word: יְסֹבְבֶנְהוּ
  english_pob_choice: he surrounded him
  chosen_korean: 그를 둘러싸셨으며
  alternatives_korean:
  - 그를 에워싸셨으며
  - 그를 둘러보호하셨으며
  lexicon: HALOT
  rationale: סבב는 물리적으로 ‘둘러싸다/에워싸다’는 뜻이므로, 보호의 함의를 덧붙이지 않고 직접적으로 ‘둘러싸셨으며’로 옮겼습니다.
- source_word: יְבֹונְנֵהוּ
  english_pob_choice: he cared for him
  chosen_korean: 그를 돌보셨고
  alternatives_korean:
  - 그를 이해하게 하셨고
  - 그에게 분별력을 주셨고
  - 그를 가르치셨고
  lexicon: HALOT
  rationale: בין/בונן 계열의 동사는 ‘이해하다’도 가능하지만, 앞뒤의 둘러싸심과 지키심에 이어지는 보호의 연쇄에서는 ‘돌보셨고’가 관계적·배려적 의미를 가장 자연스럽게 살립니다.
- source_word: כְּאִישׁוֹן עֵינוֹ
  english_pob_choice: like the pupil of his eye
  chosen_korean: 그의 눈동자처럼
  alternatives_korean:
  - 그의 눈의 동공처럼
  - 그의 눈알의 작은 사람처럼
  lexicon: HALOT
  rationale: 이 관용구는 현대 한국어에서 ‘눈동자처럼’이 가장 자연스럽고, 히브리어의 핵심 이미지를 무리 없이 전달합니다.
theological_decisions:
- issue: 여호와의 보호 행위를 일련의 동사로 어떻게 보존할지
  chosen_reading: ‘찾아내셨고—둘러싸셨으며—돌보셨고—지키셨습니다’로 연쇄를 살려, 광야에서의 구체적 보호를 단계적으로 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축해 ‘보호하셨습니다’로 처리할 수 있음
  - ‘가르치셨고’처럼 인지적 의미를 전면화할 수 있음
  rationale: 본문은 광야에서의 돌보심을 연속 동사로 묘사하므로, 이를 한 단어로 뭉개지 않고 긴장을 보존하는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 번역 철학 §1 (원문 우선) 및 §3 (중의성 보존)
