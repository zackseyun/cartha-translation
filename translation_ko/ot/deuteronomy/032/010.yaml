- from: 그는 광야의 땅에서 그를 찾아내셨고, 울부짖는 황무지 곧 황야 가운데서 그를 둘러싸셨으며, 그를 돌보셨고, 그의 눈동자처럼 그를 지키셨습니다.[a][b]
  to: 그는 광야의 땅에서 그를 발견하셨고, 울부짖는 황량한 광야에서 그를 둘러싸셨으며, 그를 살피셨고[a], 자신의 눈동자처럼 그를 지키셨습니다.[b]
