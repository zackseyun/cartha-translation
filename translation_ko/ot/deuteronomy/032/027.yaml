  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
  footnotes:
  - marker: a
    text: Or 'were it not that I dreaded the enemy’s provocation.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb rendered 'should misunderstand' is difficult; it may also mean 'should misjudge' or 'should fail to discern' the true cause of Israel’s downfall.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'Our hand is high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 원수가 격노하는 일이 두려워서[a], 그의 대적들이 오해하여[b] 말하기를, 「우리 손이 높아졌다[c]. 야훼께서 이 모든 일을 행하신 것이 아니다」 할까 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수의 격노가 두려워서’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 난해하며, ‘잘못 판단하다’ 또는 ‘참된 원인을 분별하지 못하다’는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘우리 손이 높다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  english_pob_choice: Were it not that
  chosen_korean: …할까 하였기 때문입니다
  alternatives_korean:
  - …하지 않았다면
  - …이 아니었다면
  lexicon: HALOT
  rationale: 예외를 나타내는 조건절을 한국어에서 자연스럽게 풀어, 앞뒤 문맥의 억제 사유를 살렸습니다.
- source_word: כַּעַס אוֹיֵב
  english_pob_choice: the provocation of the enemy
  chosen_korean: 원수가 격노하는 일
  alternatives_korean:
  - 원수의 격노
  - 원수의 분노
  lexicon: HALOT
  rationale: 여기서 כַּעַ스는 단순 감정 명칭보다 ‘자극이 되어 분노를 일으키는 일/상태’의 뉘앙스가 있어, 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יְנַכְּרוּ
  english_pob_choice: should misunderstand
  chosen_korean: 오해하여
  alternatives_korean:
  - 잘못 판단하여
  - 분별하지 못하여
  - 낯선 것으로 여기며
  lexicon: HALOT
  rationale: 문맥상 적들이 사건의 참된 원인을 잘못 읽는다는 뜻이 핵심이므로, 과도한 직역보다 ‘오해하다’가 의미를 가장 분명하게 드러냅니다.
- source_word: יָדֵינוּ רָמָה
  english_pob_choice: Our hand is exalted
  chosen_korean: 우리 손이 높아졌다
  alternatives_korean:
  - 우리 손이 높다
  - 우리 손이 승리하였다
  lexicon: HALOT
  rationale: 직역적 이미지를 유지해 교만한 승리 선언의 뉘앙스를 살렸고, ‘승리하였다’는 해석을 덜어 냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명기를 포함한 히브리 본문에서 여호와 대신 고유명사 야훼를 사용했습니다.
theological_decisions:
- issue: 원수의 오해를 표현하는 동사의 강도
  chosen_reading: ‘오해하여’로 옮겨, 적들이 사건의 원인과 의미를 잘못 해석하는 점을 드러냈습니다.
  alternative_readings:
  - ‘잘못 판단하여’
  - ‘분별하지 못하여’
  rationale: 히브리어 동사는 난해하지만, 본문 목적이 야훼의 행위를 적들이 자기 힘으로 돌리는 잘못된 결론을 막는 데 있으므로, 그 결과를 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 여호와/야훼의 이름
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 언약의 고유한 신명을 사용하므로, 칭호로 대체하지 않고 고유명칭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
