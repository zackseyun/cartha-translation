base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
  footnotes:
  - marker: a
    text: Or 'were it not that I dreaded the enemy’s provocation.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb rendered 'should misunderstand' is difficult; it may also mean 'should misjudge' or 'should fail to discern' the true cause of Israel’s downfall.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'Our hand is high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 원수의 격분을 두려워하지 않았더라면[a], 그리하였을 것입니다. 그들의 대적들이 잘못 판단하여[b], ‘우리 손이 높다[c]. 야훼께서 이 모든 일을 행하신 것이 아니다’라고 말할까 염려하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수의 도발을 두려워하지 않았더라면’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 난해하며, ‘오해하다’, ‘분별하지 못하다’, 또는 ‘낯선 것으로 여기다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘우리 손이 높다’입니다.
    reason: lexical_alternative
