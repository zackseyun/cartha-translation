theological_decisions:
- issue: 원수의 오해를 표현하는 동사의 강도
  chosen_reading: ‘오해하여’로 옮겨, 적들이 사건의 원인과 의미를 잘못 해석하는 점을 드러냈습니다.
  alternative_readings:
  - ‘잘못 판단하여’
  - ‘분별하지 못하여’
  rationale: 히브리어 동사는 난해하지만, 본문 목적이 야훼의 행위를 적들이 자기 힘으로 돌리는 잘못된 결론을 막는 데 있으므로, 그 결과를 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 여호와/야훼의 이름
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 언약의 고유한 신명을 사용하므로, 칭호로 대체하지 않고 고유명칭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
