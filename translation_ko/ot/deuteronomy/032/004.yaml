id: DEU.32.4
reference: Deuteronomy 32:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
  footnotes:
  - marker: a
    text: Or 'all his ways are just judgment.' The Hebrew מִשְׁפָּט can denote 'justice,' 'judgment,' or what is legally right.
    reason: lexical_alternative
  - marker: b
    text: '''A God of faithfulness'' may also be understood as ''a faithful God'' or, less likely in this context, ''a God of truth.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'there is no wrong in him' / 'without iniquity.' The Hebrew עָוֶל covers moral wrong, injustice, or iniquity.
    reason: lexical_alternative
translation:
  language: ko
  text: 반석이신 분—그의 행위는 완전합니다. 그의 모든 길은 정의입니다[a]. 그는 신실하신 하나님이시며[b] 불의가 없으시고[c], 의로우시며 올곧으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 길은 바른 판단입니다.’ 히브리어 מִשְׁפָּט은 ‘정의’, ‘판단’, 또는 법적으로 옳은 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신실하신 하나님’은 ‘신실한 하나님’ 또는 문맥상 덜 유력하게는 ‘진리의 하나님’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게는 잘못이 없습니다’ / ‘불의함이 없습니다.’ 히브리어 עָוֶל은 도덕적 잘못, 불의, 부정함을 아울러 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  english_pob_choice: The Rock
  chosen_korean: 반석이신 분
  alternatives_korean:
  - 반석
  - 바위
  lexicon: HALOT
  rationale: צוּר는 여기서 하나님을 가리키는 비유적 호칭이므로, 단순한 물체명보다 호칭성을 드러내는 ‘반석이신 분’이 더 자연스럽습니다.
- source_word: תָּמִים
  english_pob_choice: perfect
  chosen_korean: 완전합니다
  alternatives_korean:
  - 온전합니다
  - 완벽합니다
  lexicon: HALOT
  rationale: 하나님의 행위가 결함 없이 온전하다는 뜻을 살리되, 현대 한국어에서 시적·신학적으로도 무리 없는 ‘완전합니다’를 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 판결
  - 심판
  lexicon: HALOT
  rationale: 여기서는 하나님의 모든 길이 옳고 바르다는 성격을 말하므로, 법정적 ‘판결’보다 윤리·사법적 의미를 함께 담는 ‘정의’가 적절합니다.
- source_word: אֱמוּנָה
  english_pob_choice: faithfulness
  chosen_korean: 신실하신
  alternatives_korean:
  - 신실하신 분
  - 신뢰할 만하신
  - 진실하신
  lexicon: HALOT
  rationale: 명사형 ‘신실함’보다 하나님의 속성을 서술하는 형용형 ‘신실하신’이 한국어 문장 구조와 잘 맞고, 언약적 신뢰성을 잘 드러냅니다.
- source_word: וְאֵין עָוֶל
  english_pob_choice: without injustice
  chosen_korean: 불의가 없으시고
  alternatives_korean:
  - 부정함이 없으시고
  - 불공정함이 없으시고
  - 악이 없으시고
  lexicon: HALOT
  rationale: עָוֶל은 부정한 굽음, 불의, 부당함을 포괄하므로, 하나님의 도덕적 결함 부재를 간결하게 드러내는 ‘불의가 없으시고’로 옮겼습니다.
- source_word: צַדִּיק וְיָשָׁר
  english_pob_choice: righteous and upright
  chosen_korean: 의로우시며 올곧으십니다
  alternatives_korean:
  - 의로우시며 바르십니다
  - 의인이시며 정직하십니다
  lexicon: HALOT
  rationale: ‘의롭다’는 משפט/עָוֶל과 연결되는 핵심 속성을, ‘올곧다’는 ישר의 직선적·도덕적 이미지를 살려 병렬로 번역했습니다.
theological_decisions:
- issue: 하나님을 가리키는 צוּר의 호칭성
  chosen_reading: ‘반석이신 분’으로 번역해 비유적 호칭을 살렸습니다.
  alternative_readings:
  - ‘반석’
  - ‘바위’
  rationale: 본문은 단순한 자연물 묘사가 아니라 하나님을 향한 칭호이므로, 한국어에서도 인격적 호칭성을 드러내는 표현이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 시적 신명기 본문에서의 하나님의 호칭 처리
- issue: אֱמוּנָה의 신학적 뉘앙스
  chosen_reading: 하나님의 ‘신실하심’으로 이해했습니다.
  alternative_readings:
  - ‘진실’
  - ‘성실’
  - ‘충실’
  rationale: 문맥상 사실 명제의 진위보다 하나님이 언제나 신뢰할 수 있는 분이라는 언약적 신실성이 핵심이므로, ‘신실’이 가장 균형 잡힌 표현입니다.
  doctrine_reference: 하나님의 신뢰성과 언약적 성품
