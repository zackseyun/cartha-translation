  to: 그들은 신이 아닌 것으로 나를 질투하게 하였고, 그들의 우상들로[a] 나를 분노하게 하였습니다. 그러므로 나는 백성이 아닌 자들로[b] 그들을 질투하게 하고, 어리석은 민족으로[c] 그들을 분노하게 하겠습니다.
