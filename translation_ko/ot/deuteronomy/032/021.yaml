reference: Deuteronomy 32:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
  footnotes:
  - marker: a
    text: Or 'with their worthless things' or 'with their vanities'; the Hebrew term can denote emptiness and, in context, idols.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a no-people'; the Hebrew deliberately parallels 'what is not a god.'
    reason: lexical_alternative
  - marker: c
    text: '''Foolish'' here carries a moral-spiritual sense, not merely lack of intelligence.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 하나님이 아닌 것으로 나를 질투하게 하였고, 그들의 헛된 것들로 나를 분노하게 하였습니다. 그러므로 나는 백성이 아닌 자들로 그들을 질투하게 하고, 어리석은 민족으로 그들을 분노하게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 것들’은 문자적으로는 ‘헛됨/허무’에 해당하며, 문맥상 우상들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘백성이 아닌 자들’은 문자적으로 ‘한 백성이 아닌’이라는 뜻으로, 원문의 평행법을 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘어리석은’은 단순한 지적 부족보다 도덕적·영적 어리석음을 포함합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלֹא אֵל
  english_pob_choice: with what is not a god
  chosen_korean: 하나님이 아닌 것으로
  alternatives_korean:
  - 신이 아닌 것으로
  - 신이라고 할 수 없는 것으로
  lexicon: HALOT
  rationale: לֹא אֵל의 대조적·논박적 힘을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하나님이 아닌 것’으로 옮겼습니다. 영어 POB의 common noun 처리도 반영합니다.
- source_word: בְּהַבְלֵיהֶם
  english_pob_choice: with their idols
  chosen_korean: 그들의 헛된 것들로
  alternatives_korean:
  - 그들의 우상들로
  - 그들의 허무한 것들로
  lexicon: HALOT
  rationale: הֶבֶל의 기본 의미인 ‘헛됨/허무’가 본문에서 우상숭배를 가리킬 수 있지만, 원문 자체의 어휘 긴장을 유지하기 위해 먼저 직역적 표현을 택했습니다. 영어 주석의 대안 의미를 살렸습니다.
- source_word: בְּלֹא עָם
  english_pob_choice: with those who are not a people
  chosen_korean: 백성이 아닌 자들로
  alternatives_korean:
  - 백성이 아닌 이들로
  - 한 백성이 아닌 자들로
  lexicon: HALOT
  rationale: ‘not a people’의 도발적 평행을 살리기 위해 집합적·비정상적 표현을 유지했습니다. 한국어에서는 ‘자들’이 인격적 대상을 유지하면서도 ‘백성’과의 대비를 분명히 합니다.
- source_word: בְּגוֹי נָבָל
  english_pob_choice: with a foolish nation
  chosen_korean: 어리석은 민족으로
  alternatives_korean:
  - 우매한 민족으로
  - 어리석은 나라로
  lexicon: HALOT
  rationale: נָבָל은 단순 지능 부족보다 도덕적·영적 어리석음을 포함하므로, 한국어의 ‘어리석은’이 그 뉘앙스를 가장 직접적으로 전달합니다. ‘민족’은 영어 POB의 ‘nation’과 본문의 집합적 대상을 무리 없이 반영합니다.
- source_word: קִנְאוּנִי / אַקְנִיאֵם
  english_pob_choice: made me jealous / I will make them jealous
  chosen_korean: 나를 질투하게 하였고 / 그들을 질투하게 하고
  alternatives_korean:
  - 나를 시기하게 하였고 / 그들을 시기하게 하고
  - 나를 질투심 나게 하였고 / 그들을 질투심 나게 하고
  lexicon: HALOT
  rationale: 반복되는 히필 동사를 같은 동사로 대응시켜 원문의 보응적 대칭을 보존했습니다. ‘질투하게 하다’는 한국어에서 가장 자연스러우면서도 의도된 감정 유발을 드러냅니다.
theological_decisions:
- issue: ‘백성이 아닌 자들’과 ‘어리석은 민족’의 특정 역사적 지시 대상
  chosen_reading: 본문의 일반적 표현을 그대로 두고 특정 민족으로 확정하지 않았습니다.
  alternative_readings:
  - 특정 이방 민족을 지시하는 것으로 좁히기
  - 이방인 전체를 집단적으로 가리키는 것으로 풀기
  rationale: 히브리어는 지시 대상을 명시하지 않으며, 원문의 수사적 충격은 바로 그 비지시성에서 나옵니다. 따라서 번역은 해석을 앞서지 않도록 일반형을 유지했습니다.
  doctrine_reference: 본문의 의도와 적용을 구분하면서 해석적 확정을 유보함
