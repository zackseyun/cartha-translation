  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
  footnotes:
  - marker: a
    text: Or 'calamities'; literally 'evils' in the sense of harmful judgments, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will spend my arrows on them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 재앙들을 쏟아붓겠습니다[a]; 내 화살들을 그들에게 다 써버리겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난들’로 옮길 수 있습니다. כאן의 ‘악들’은 도덕적 악이 아니라 해악을 끼치는 심판들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 화살들을 그들에게 다 쓰겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה / עָלֵימוֹ
  english_pob_choice: I will heap disasters upon them
  chosen_korean: 재앙들을 쏟아붓겠습니다
  alternatives_korean:
  - 그들에게 재앙들을 쌓아 올리겠습니다
  - 그들에게 재앙들을 모아 보내겠습니다
  lexicon: WLC + HALOT
  rationale: אסף의 ‘모으다/쌓다’ 이미지를 한국어에서 자연스럽게 풀면 ‘쏟아붓다’가 누적과 압박의 시적 감각을 잘 살리며, עַל + 접미사는 ‘그들에게’로 충분히 반영됩니다.
- source_word: רָעוֹת
  english_pob_choice: disasters
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 재난들
  - 환난들
  lexicon: HALOT
  rationale: 문맥이 야훼의 심판을 말하므로 도덕적 ‘악’보다 실제적 징벌·재난을 뜻하는 ‘재앙들’이 원문의 의미와 POB의 판단을 가장 잘 반영합니다.
- source_word: חִצַּי
  english_pob_choice: my arrows
  chosen_korean: 내 화살들
  alternatives_korean:
  - 내 활
  - 내 화살
  lexicon: HALOT
  rationale: 복수형과 소유격을 살려 ‘내 화살들’로 옮기며, 전쟁 이미지의 직접성을 유지합니다.
- source_word: אֲכַלֶּה
  english_pob_choice: I will use up
  chosen_korean: 다 써버리겠습니다
  alternatives_korean:
  - 소진하겠습니다
  - 소모하겠습니다
  - 다 쓰겠습니다
  lexicon: HALOT
  rationale: כלה의 ‘끝까지 다 써버리다/소진하다’ 의미를 한국어의 관용적 표현으로 옮겨, 화살을 다 소진하는 비유를 자연스럽게 드러냅니다.
- source_word: בָּם
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들 위에
  - 그들에 대하여
  lexicon: HALOT
  rationale: 동사 ‘써버리다’와 결합할 때 표적 방향은 한국어에서 목적어 표지 ‘그들에게’로 가장 자연스럽고, 적대적 행위를 충분히 전달합니다.
theological_decisions:
- issue: רָעוֹת를 하나님의 행위와 연결할 때의 표현
  chosen_reading: ‘재앙들’로 옮겨 하나님의 심판을 말하되 도덕적 악을 뜻하는 듯한 오해는 피합니다.
  alternative_readings:
  - 악들
  - 재난들
  - 환난들
  rationale: 본문은 야훼의 징벌적 선언이므로, 한국어에서 ‘재앙들’이 심판의 실재와 엄중함을 유지하면서 신학적 오독을 줄입니다.
  doctrine_reference: 원문 우선 원칙; 하나님의 न्याय/심판 표현에서 도덕적 악의 귀속을 피함.
