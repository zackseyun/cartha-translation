  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/נֶ֨שֶׁר֙ יָעִ֣יר קִנּ֔/וֹ עַל גּוֹזָלָ֖י/ו יְרַחֵ֑ף יִפְרֹ֤שׂ כְּנָפָי/ו֙ יִקָּחֵ֔/הוּ יִשָּׂאֵ֖/הוּ עַל אֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
  footnotes:
  - marker: a
    text: Or 'like a vulture,' since the Hebrew נֶשֶׁר can denote a large carrion bird or eagle-like raptor.
    reason: lexical_alternative
  - marker: b
    text: Or 'fluttering over its young' or 'brooding over its young.'
    reason: lexical_alternative
  - marker: c
    text: '''Pinions'' refers to the outer wing feathers; more generally, ''wings.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 독수리가 자기 둥지를 뒤흔들고, 자기 새끼들 위를 맴돌며, 날개를 펼쳐 그들을 받아 자기 깃털 위에 태우는 것처럼 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔개처럼’. 히브리어 נֶשֶׁר는 큰 사냥새나 독수리 비슷한 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 새끼들 위를 퍼덕이며’ 혹은 ‘품으며’.
    reason: lexical_alternative
  - marker: c
    text: ‘깃털’은 여기서 더 구체적인 바깥 날개깃, 곧 날개깃을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  english_pob_choice: like an eagle
  chosen_korean: 마치 독수리가
  alternatives_korean:
  - 마치 솔개가
  - 마치 큰 사나운 새가
  lexicon: HALOT
  rationale: נֶשֶׁר은 문맥상 큰 맹금류를 가리키며, POB의 ‘eagle’에 맞춰 표준적인 ‘독수리’로 옮겼습니다. ‘솔개’는 학술적 대안일 수 있으나 한국어 성경 문맥에서 보호와 강함의 이미지를 가장 자연스럽게 살리는 표현은 ‘독수리’입니다.
- source_word: יָעִיר קִנּוֹ
  english_pob_choice: stirs up its nest
  chosen_korean: 자기 둥지를 뒤흔들고
  alternatives_korean:
  - 자기 둥지를 깨우고
  - 자기 둥지를 흔들어 깨우고
  lexicon: HALOT
  rationale: עור의 히필은 ‘깨우다/일으키다’의 뜻이지만, 새가 새끼를 독립시키려 둥지를 움직이는 생생한 장면을 한국어로는 ‘뒤흔들다’가 가장 잘 전달합니다. 단순히 ‘깨우다’로 하면 물리적 긴장이 약해집니다.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  english_pob_choice: that hovers over its young
  chosen_korean: 자기 새끼들 위를 맴돌며
  alternatives_korean:
  - 자기 새끼들 위를 날갯짓하며
  - 자기 새끼들 위를 품으며
  lexicon: HALOT
  rationale: רחף는 ‘hover/flutter’의 동작을 나타내므로, 한국어에서는 ‘맴돌다’가 가장 자연스럽고 시각적인 대응입니다. ‘품다’는 보호의 의미는 있으나 동작성은 약합니다.
- source_word: יִקָּחֵהוּ יִשָּׂאֵהוּ עַל אֶבְרָתוֹ
  english_pob_choice: takes him ... and carries him on his pinions
  chosen_korean: 그들을 받아 자기 깃털 위에 태우는 것처럼 하셨습니다
  alternatives_korean:
  - 그를 받아 자기 날개에 태우고 데려가는 것처럼 하셨습니다
  - 그들을 들어 자기 날개깃에 실어 나르는 것처럼 하셨습니다
  lexicon: HALOT
  rationale: לקח과 נשא의 연쇄는 ‘받다/태우다’의 동작으로 자연스럽게 살렸고, אֶבְרָה는 POB의 ‘pinions’에 따라 일반적인 ‘날개’보다 더 구체적인 ‘깃털’로 옮겼습니다. 앞부분의 단수 대명사는 시적 이미지상 집합적 대상(이스라엘)을 가리키므로 한국어는 문맥에 맞게 복수로 풀었습니다.
theological_decisions:
- issue: 새 비유의 종결에서의 시적 주어 처리
  chosen_reading: 동사열의 능동성을 살려 ‘하셨습니다’로 마무리하되, 원문이 만드는 보호의 동작 연쇄를 한국어에서도 유지했습니다.
  alternative_readings:
  - 단순 서술형으로 ‘…태우고 나르십니다’로 처리
  - 모든 동사를 수동적으로 바꾸어 완화
  rationale: 본절은 야훼의 보호를 독수리의 동작 연쇄로 보여 주는 시구이므로, 동작성을 약화시키지 않는 것이 중요합니다. 한국어에서는 전체 비유를 자연스러운 한 문장으로 묶어, 본문의 생동감과 보호 의도를 함께 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §4
