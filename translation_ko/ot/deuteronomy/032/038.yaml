  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: ko
  text: 곧 희생의 기름을 먹고 그들의 전제주를 마신 자들이여, 그들이 일어나 너희를 도우라. 그들이 너희의 피난처가 되게 하라.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문 ‘전제’는 부어 드리는 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב זְבָחֵי/מוֹ
  english_pob_choice: the fat of their sacrifices
  chosen_korean: 희생의 기름
  alternatives_korean:
  - 제물의 기름
  - 희생제물의 기름
  lexicon: חֵלֶב
  rationale: חֵלֶב은 제의적 맥락에서 ‘기름/기름진 부분’이며, POB의 ‘fat’에 맞춰 제사의 핵심 부위를 간결하게 살렸습니다.
- source_word: יֵין נְסִיכָ/ם
  english_pob_choice: the wine of their drink offerings
  chosen_korean: 전제주
  alternatives_korean:
  - 붓는 제사의 포도주
  - 전제의 포도주
  lexicon: נֶסֶךְ
  rationale: 전제(붓는 제사)를 가리키는 표현이므로, 제의적 성격을 드러내는 ‘전제주’로 압축해 번역했습니다.
- source_word: סִתְרָה
  english_pob_choice: shelter
  chosen_korean: 피난처
  alternatives_korean:
  - 보호처
  - 은신처
  - 피난이 되게
  lexicon: סֵתֶר
  rationale: 원문의 숨김/가림의 이미지는 보호의 장소를 뜻하므로, 현대 한국어에서 자연스러운 보호 개념을 살려 ‘피난처’로 옮겼습니다.
theological_decisions:
- issue: 문장 끝의 명령/도전 어조
  chosen_reading: 희생과 전제를 의지하던 대상들이 실제로 일어나 도움과 보호가 될 수 있는지 조롱 섞인 도전으로 옮겼습니다.
  alternative_readings:
  - 단순한 예언적 선언으로 완화
  - 문장부호를 바꿔 중립적 진술로 처리
  rationale: 히브리어 연속 명령형은 우상숭배의 무능을 드러내는 반어적 효과를 가지므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 우상 무력성에 대한 성경적 증언(신 32장 문맥)
