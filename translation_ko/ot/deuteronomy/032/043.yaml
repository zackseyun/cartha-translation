review_pass:
  verdict: revise
  source_fidelity: 첫째 절은 마소라 본문의 압축된 통사를 따라 ‘민족들’이 ‘그의 백성과 함께’ 기뻐하라는 뜻으로 충실히 옮겼습니다. 다만 דם עבדיו יקום의 ‘피를 갚다’는 한국어에서 목적어 결합이 다소 부자연스러우므로, 히브리어의 피의 복수/보복 의미를 드러내는 관용 표현으로 고칠 필요가 있습니다. וְנָקָם יָשִׁיב לְצָרָיו는 대적들에게 보복을 되돌려 갚는다는 뜻이므로 ‘보복을 되갚으시고’가 원문의 두 요소를 더 자연스럽게 보존합니다. 마지막 כפר는 본문 및 주석에서 속죄/정화의 의미 범위를 보존합니다.
  naturalness: ‘그의 종들의 피를 갚으시며’와 ‘보복을 돌리시고’는 의미는 추정되지만 현대 한국어의 자연스러운 결합으로는 다소 어색합니다. 각각 ‘그의 종들의 피의 원수를 갚으시며’와 ‘그의 대적들에게 보복을 되갚으시고’로 다듬으면 합쇼체의 격조를 유지하면서 명료해집니다.
  terminology: ‘민족들’, ‘종들’, ‘대적들’, ‘속죄’는 문맥과 현대 성경 번역의 문체에 적절합니다. ‘속죄’는 כפר의 제의적·정화적 함의를 충분히 보존하며, 대안 각주가 정화 의미를 적절히 밝혀 줍니다. 사해문서 관련 각주는 원 영어 감사 기록처럼 ‘한 사해문서 사본’을 명시하는 편이 전승 증거를 과장하지 않아 더 정확합니다.
