base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
  footnotes:
  - marker: a
    text: Or 'Sing for joy, O nations, with his people.' The Hebrew imperative can carry the sense of jubilant shouting or singing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the blood of his servants'; 'slaves' is also possible for the noun in other contexts.
    reason: lexical_alternative
  - marker: c
    text: The Greek Septuagint and a Dead Sea Scroll preserve a longer form of this verse, including additional calls for the heavens and divine beings to rejoice and for the nations to worship him. The main text here follows the Masoretic Hebrew.
    reason: textual_variant
  - marker: d
    text: Or 'he will cleanse/purge his land, his people.' The Hebrew verb can emphasize expiation or cleansing.
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들아, 그의 백성과 함께 기뻐하십시오. 그는 그의 종들의 피의 원수를 갚으시며, 그의 대적들에게 보복을 되갚으시고, 그의 땅과 그의 백성을 위하여 속죄하실 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들아, 그의 백성과 함께 노래하며 기뻐하십시오.’ 히브리어 명령형은 환호하거나 노래하는 뜻을 품을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 종들의 피’입니다. 다른 문맥에서는 ‘노예들’도 가능한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 칠십인역과 한 사해문서 사본에는 하늘과 하늘의 존재들이 기뻐하고 민족들이 그를 경배하라는 추가 구절이 들어 있는 더 긴 형태가 있습니다. 본문은 마소라 본문을 따릅니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘그의 땅과 그의 백성을 깨끗하게 하실 것입니다’ 또는 ‘정결하게 하실 것입니다.’ 히브리어 동사는 속죄와 정화의 뜻을 모두 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  english_pob_choice: Rejoice
  chosen_korean: 기뻐하십시오
  alternatives_korean:
  - 즐거워하십시오
  - 환호하십시오
  - 노래하며 기뻐하십시오
  lexicon: HALOT
  rationale: רנן의 명령형은 기쁨의 환호를 뜻하므로, 현대 한국어에서 자연스럽고 높임을 유지하는 「기뻐하십시오」로 옮겼습니다.
- source_word: גוֹיִם
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방인들
  - 백성들
  lexicon: HALOT
  rationale: 문맥상 야훼의 백성과 대비되는 국제 집단을 가리키므로, 교회적·신약적 뉘앙스가 강한 「이방인들」보다 「민족들」이 적절합니다.
- source_word: עֲבָדָי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 섬기는 자들
  lexicon: HALOT
  rationale: עבד는 여기서 하나님께 속한 자들을 가리키는 표지로 보이며, 본문이 주장하는 핵심은 신분보다 소속과 억울한 피 흘림이므로 기본값인 「종들」을 유지했습니다.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  english_pob_choice: he will repay vengeance on his adversaries
  chosen_korean: 그의 대적들에게 보복을 돌리시고
  alternatives_korean:
  - 그의 대적들에게 원수를 갚으시고
  - 그의 대적들에게 보복을 갚으시고
  - 그의 대적들에게 원한을 갚으시고
  lexicon: HALOT
  rationale: ישיב는 ‘돌려주다/되돌리다’의 동작을 살리고, נָקָם은 단순한 처벌보다 보복·응징의 색채가 있으므로 「보복을 돌리시고」로 두 요소를 함께 살렸습니다.
- source_word: וְכִפֶּר
  english_pob_choice: he will make atonement for
  chosen_korean: 속죄하실 것입니다
  alternatives_korean:
  - 속죄하실 것입니다
  - 정화하실 것입니다
  - 깨끗하게 하실 것입니다
  lexicon: HALOT
  rationale: כפר의 제의적·구속사적 무게를 살리기 위해 「속죄하다」를 택했고, 한국어에서는 목적어를 갖는 「~을 위해 속죄하다」보다 자연한 능동 서술로 정리했습니다.
theological_decisions:
- issue: כפר의 의미 범위
  chosen_reading: 하나님이 그의 땅과 그의 백성을 위해 속죄하신다는 제의적·언약적 의미를 유지했습니다.
  alternative_readings:
  - 그의 땅과 그의 백성을 깨끗하게 하신다
  - 그의 땅과 그의 백성을 정결하게 하신다
  rationale: 이 동사는 단순한 청소보다 죄와 부정함을 처리하는 속죄/정화의 의미를 담으므로, 본문이 가진 신학적 무게를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy #6'
- issue: ‘민족들아, 그의 백성과 함께’의 통사 처리
  chosen_reading: 민족들이 하나님의 백성과 더불어 기뻐하도록 부르는 초청으로 풀었습니다.
  alternative_readings:
  - 민족들이 그의 백성을 기뻐하라는 초청
  - 민족들이 그의 백성에게 기뻐하라는 초청
  rationale: 히브리어는 압축되어 있어 한국어에서는 관계를 드러내야 하므로, 추가 의미를 과도하게 넣지 않으면서도 함께 기뻐한다는 방향을 분명히 했습니다.
  doctrine_reference: 'Translation philosophy #1'
