id: DEU.32.51
reference: Deuteronomy 32:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'among the Israelites' for 'among the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Meribath-kadesh may also be rendered 'Meribah of Kadesh' or, more literally, 'the waters of the quarrel of Kadesh.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you did not sanctify me' or 'you did not uphold my holiness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 너희가 이스라엘 자손들 가운데서[a] 신 광야에 있는 가데스 므리바 물에서[b] 나를 거슬러 신의를 저버렸고, 또 이스라엘 자손들 가운데서 나를 거룩히 여기지 않았기[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손들’은 문맥에 따라 ‘이스라엘 백성’ 또는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가데스 므리바’는 ‘가데스의 므리바’ 또는 더 문자적으로 ‘가데스의 다툼’으로도 옮길 수 있는 지명 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나를 거룩히 여기지 않았다’는 하나님을 이스라엘 자손들 가운데서 거룩하신 분으로 인정하고 드러내지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם
  english_pob_choice: acted unfaithfully
  chosen_korean: 신실하지 않게 행하였기
  alternatives_korean:
  - 신의를 저버렸기
  - 불충하게 행하였기
  - 거역하였기
  lexicon: HALOT
  rationale: מעל은 언약적 배신을 포함하는 ‘불충실/불신실’의 뜻이 강하므로, 법률적 뉘앙스가 강한 ‘범죄하다’보다 관계적 위반을 살리는 표현을 택했습니다.
- source_word: בִּי
  english_pob_choice: against me
  chosen_korean: 나를 거슬러
  alternatives_korean:
  - 내게
  - 나에게서
  - 내 안에서
  lexicon: HALOT
  rationale: מעל과 결합한 ב는 해를 입는 당사자를 가리키므로, 직역적 ‘안에서’보다 한국어에서 자연스럽고 대립을 분명히 하는 ‘나를 거슬러’를 사용했습니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손들 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘 백성 가운데서
  - 이스라엘의 아들들 가운데서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 ‘가운데/among’ 의미를 살리면서, POB의 ‘sons of Israel’에 맞춰 ‘이스라엘 자손들’로 옮겼습니다.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ מִדְבַּר צִן
  english_pob_choice: at the waters of Meribath-kadesh, in the wilderness of Zin
  chosen_korean: 가데스의 므리바 물가와 신 광야에서
  alternatives_korean:
  - 가데스 므리바의 물가와 신 광야에서
  - 가데스의 다툼의 물가와 신 광야에서
  - 가데스의 므리밧-가데스에서 신 광야에
  lexicon: HALOT
  rationale: 지명적 표현은 통용 가능한 음역을 우선하되, ‘물가’로 사건 현장을 드러냈습니다. ‘Meribath-kadesh’는 한국어 성경 관용에 맞는 형태로 처리했습니다.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  english_pob_choice: you did not treat me as holy
  chosen_korean: 나를 거룩하게 하지 않았기
  alternatives_korean:
  - 나를 거룩히 여기지 않았기
  - 나의 거룩을 드러내지 않았기
  - 나를 성별하지 않았기
  lexicon: HALOT
  rationale: קדש의 사역형은 ‘거룩하게 하다/거룩히 여기다’의 공개적·관계적 의미를 가지므로, 신학적으로도 자연스러운 ‘거룩하게 하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: קִדַּשְׁתֶּם אֹתִי의 신학적 의미
  chosen_reading: 이 구절은 하나님의 본질적 거룩의 결핍이 아니라, 이스라엘 앞에서 하나님을 거룩하게 드러내지 못한 책임을 말합니다.
  alternative_readings:
  - 하나님을 성별하지 않았다
  - 하나님의 거룩을 침해했다
  rationale: 문맥상 모세와 아론의 실패는 하나님의 거룩을 공적으로 인정하고 드러내지 못한 데 있으므로, 오해를 줄이는 방향으로 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: בְּנֵי יִשְׂרָאֵל의 번역
  chosen_reading: 이스라엘 자손들
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 표면 구조를 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘자손들’을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
