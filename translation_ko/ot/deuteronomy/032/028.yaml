  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 입니다
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 앞 구절에 대한 이유 제시이지만, 한국어에서는 문장 첫머리의 인과 접속을 과도하게 드러내기보다 결과 진술을 매끄럽게 마무리하는 것이 자연스러워서 종결형으로 옮겼습니다.
- source_word: גּוֹי
  english_pob_choice: nation
  chosen_korean: 나라
  alternatives_korean:
  - 민족
  - 국가
  - 백성
  lexicon: HALOT
  rationale: 집단 전체를 가리키는 명사로, 여기서는 공동체의 성격을 드러내는 ‘나라’가 가장 간결하고 자연스럽습니다.
- source_word: אֹבַד עֵצוֹת
  english_pob_choice: devoid of counsel
  chosen_korean: 조언이 없는
  alternatives_korean:
  - 조언을 잃은
  - 모략이 없는
  - 지혜로운 계획이 없는
  lexicon: HALOT
  rationale: ‘조언’은 상담적 조언보다도 지혜로운 판단과 계획을 포괄하는 표현으로, 문맥의 지혜 어휘와 잘 맞습니다. ‘devoid of’의 결핍 의미도 직접 살렸습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: 병렬된 ‘조언’과 함께 지혜적 분별의 결핍을 강조하므로, 단순 지적 이해보다 내포가 넓은 ‘깨달음’을 택했습니다.
theological_decisions:
- issue: 지혜 어휘의 부정 병행 구조
  chosen_reading: ‘조언’과 ‘깨달음’의 이중 결핍으로 읽었습니다.
  alternative_readings:
  - 정치적 지도력의 부족으로 좁혀 읽기
  - 단순한 지식 부족으로 완화해 읽기
  rationale: 히브리어는 공동체가 지혜로운 판단과 분별을 상실했다는 것을 병렬적으로 강조하므로, 두 표현의 중복을 살려 원문의 강도를 유지했습니다.
  doctrine_reference: wisdom literature / covenant accountability
