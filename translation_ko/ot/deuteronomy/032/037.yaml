revisions:
- from: 그러면 그가 말할 것입니다[a]. “그들의 신들은 어디 있습니까? 그들이 피난한 그 바위는 어디 있습니까?”
  to: 그리고 그가 말씀하실 것입니다. “그들의 신들, 곧 그들이 피난한 바위는 어디 있습니까?”
  rationale: 히브리어의 접속사와 문맥상의 미래 의미를 ‘그리고 그가 말씀하실 것입니다’로 반영했습니다. ‘곧’을 사용하여 단수 ‘바위’가 ‘그들의 신들’과 동격임을 한국어에서 분명히 하되, 그 신들이 실제 보호자가 아니라는 본문의 풍자적 대비를 유지했습니다. 기존 각주는 본문에서 해결된 동격 관계를 반복하므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:05Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어는 ‘그들의 신들’과 단수 ‘바위’를 서로 별개의 질문 대상으로 제시하지 않고, ‘그들의 신들’에 대한 동격적 설명으로 ‘그들이 그 안에 피난한 바위’를 덧붙입니다. 현 번역은 이를 두 개의 독립 질문으로 나누어 단수 ‘바위’가 신들을 가리키는 동격 관계를 약화합니다.
  naturalness: ‘그들의 신들, 곧 그들이 피난한 바위는 어디 있습니까?’는 현대 표준 한국어의 합쇼체에 자연스럽고, 문맥상 조롱하는 반문도 보존합니다. ‘그러면’은 히브리어 접속사에 가능한 해석이지만 필수적이지 않아, 보다 중립적인 ‘그리고’를 사용했습니다.
  terminology: ‘신들’은 אֱלֹהֵימוֹ의 복수와 우상 숭배 문맥을 적절히 반영합니다. ‘바위’는 여기서 여호와의 칭호가 아니라 그들이 의지한 신들을 가리키므로 적절합니다. ‘피난한’은 חָסָיוּ בּוֹ의 피난·의탁 비유를 보존합니다.
  issues:
  - severity: medium
    issue: ‘그들의 신들’과 ‘그 바위’를 두 개의 질문으로 분리함
    rationale: 원문은 ‘그들의 신들, [곧] 그들이 그 안에 피난한 바위’라는 동격 구조입니다. 현 문안처럼 각각 ‘어디 있습니까?’를 붙이면 바위가 신들과 별개의 대상인 것처럼 읽힐 수 있습니다.
  - severity: low
    issue: 현 각주가 ‘직역하면’이라고 하나 본문의 구조를 충분히 바로잡지 못함
    rationale: 각주는 바위가 신들을 가리킨다고 설명하지만, 본문 자체가 두 독립 질문이므로 동격 관계가 흐려집니다. 개정 본문에서 이를 직접 드러내므로 각주는 불필요합니다.
  revised_text: 그리고 그가 말씀하실 것입니다. “그들의 신들, 곧 그들이 피난한 바위는 어디 있습니까?”
  revised_footnotes: []
  revision_rationale: 히브리어의 접속사와 문맥상의 미래 의미를 ‘그리고 그가 말씀하실 것입니다’로 반영했습니다. ‘곧’을 사용하여 단수 ‘바위’가 ‘그들의 신들’과 동격임을 한국어에서 분명히 하되, 그 신들이 실제 보호자가 아니라는 본문의 풍자적 대비를 유지했습니다. 기존 각주는 본문에서 해결된 동격 관계를 반복하므로 삭제했습니다.
