  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
  footnotes:
  - marker: a
    text: Or, more literally, 'the rock in him/it they took refuge,' with the singular 'rock' standing appositionally for 'their gods.'
