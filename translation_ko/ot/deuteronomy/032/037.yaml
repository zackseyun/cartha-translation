translation:
  language: ko
  text: 그러면 그가 말할 것입니다[a]. “그들의 신들은 어디 있습니까? 그들이 피난한 그 바위는 어디 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 신들, 그들이 피난한 그 바위는 어디 있습니까?’라는 뜻으로, ‘바위’는 ‘그들의 신들’을 비유적으로 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  english_pob_choice: And he will say
  chosen_korean: 그러면 그가 말할 것입니다
  alternatives_korean:
  - 그리고 그가 말할 것입니다
  - 그가 말할 것입니다
  lexicon: HALOT
  rationale: 문맥상 미래적 선언을 살리면서도, 이어지는 심판 연설의 흐름을 자연스럽게 잇기 위해 ‘그러면’을 택했습니다. Hebrew 접속의 의미는 완전히 지우지 않되 한국어 문장 흐름에 맞췄습니다.
- source_word: אֱלֹהֵימוֹ
  english_pob_choice: their gods
  chosen_korean: 그들의 신들은
  alternatives_korean:
  - 그들의 하나님은
  - 그들의 신들
  lexicon: HALOT
  rationale: 복수형 소유 접미사가 붙은 ‘그들의 신들’의 복수를 그대로 드러냈습니다. 여기서는 참된 하나님이 아니라 우상적 신들을 가리키므로 ‘하나님’보다 ‘신들’이 원문 대비와 풍자를 더 분명히 보존합니다.
- source_word: צוּר
  english_pob_choice: the rock
  chosen_korean: 그 바위는
  alternatives_korean:
  - 그 반석은
  - 그 바위
  lexicon: HALOT
  rationale: 영어 POB처럼 여기서는 참된 하나님 칭호로서의 ‘반석’이 아니라, 우상들을 가리키는 비유적 표현으로 읽히므로 소문자 의미를 살린 ‘바위’를 사용했습니다. 한국어에서도 일반 명사로 두어 아이러니를 보존했습니다.
- source_word: חָסָיוּ / בּוֹ
  english_pob_choice: they took refuge / in which
  chosen_korean: 그들이 피난한
  alternatives_korean:
  - 그들이 피신한
  - 그 안에 피난한
  lexicon: HALOT
  rationale: חסה의 핵심 의미인 ‘피난하다/피신하다’를 살려 물리적 보호의 이미지를 유지했습니다. 뒤의 בּוֹ는 한국어 관계절로 자연스럽게 풀어 ‘그들이 피난한’으로 옮겼습니다.
theological_decisions:
- issue: ‘rock’의 지칭과 대조 효과
  chosen_reading: 여기서는 야훼의 칭호가 아니라 그들이 의지한 우상적 ‘바위’로 읽어 소문자 의미를 살렸습니다.
  alternative_readings:
  - ‘반석’으로 번역해 칭호적 뉘앙스를 살리는 읽기
  - ‘그 바위’로 일반 명사화하는 읽기
  rationale: 문맥상 바로 앞의 ‘그들의 신들’과 병렬되는 대상이므로, 참된 신적 칭호로 오해되지 않도록 일반 명사로 옮기는 것이 원문의 풍자와 심판 선언을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
