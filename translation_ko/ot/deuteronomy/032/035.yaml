id: DEU.32.35
reference: Deuteronomy 32:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
  footnotes:
  - marker: a
    text: Or 'recompense' or 'requital' for 'repayment.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their foot gives way' or 'their foot totters.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the things destined for them hasten'; the Hebrew is compressed.
    reason: lexical_alternative
  - marker: d
    text: Quoted in Romans 12:19 and echoed in Hebrews 10:30.
    reason: cross_reference
translation:
  language: ko
  text: 원수 갚는 일과 보응은 내게 있습니다[a]. 그들의 발이 미끄러질 때, 그들의 재앙의 날이 가까우니, 그들에게 예비된 것이 속히 다가옵니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘복수’ 및 ‘갚음’. ‘보응’은 행위에 따른 갚음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 발이 비틀거릴 때’ 또는 ‘그들의 발이 휘청거릴 때’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들에게 정해진 것들이 속히 다가옵니다’; 히브리어는 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי נָקָם
  english_pob_choice: Vengeance is mine
  chosen_korean: 원수 갚는 일은 내게 있고
  alternatives_korean:
  - 보응은 내게 있습니다
  - 복수는 내게 있습니다
  lexicon: HALOT
  rationale: נָקָם의 핵심은 사적 감정이 아니라 공적·재판적 응징이므로, 한국어에서는 전통적 교회어인 ‘복수’보다 의미를 덜 오해하게 하는 ‘원수 갚는 일’을 택했습니다.
- source_word: וְשִׁלֵּם
  english_pob_choice: recompense / repayment
  chosen_korean: 보응도 내게 있습니다
  alternatives_korean:
  - 갚음도 내게 있습니다
  - 대가도 내게 있습니다
  lexicon: HALOT
  rationale: וְשִׁלֵּם은 ‘갚다/보상하다’의 뜻으로, 앞의 ‘원수 갚는 일’과 병렬되는 법정적 보응을 살리기 위해 ‘보응’을 썼습니다.
- source_word: תָּמוּט רַגְלָם
  english_pob_choice: their foot slips
  chosen_korean: 그들의 발이 미끄러질 때
  alternatives_korean:
  - 그들의 발이 흔들릴 때
  - 그들의 발이 넘어질 때
  lexicon: HALOT
  rationale: 단수 ‘발’과 복수 접미사의 관용적 표현을 자연스러운 한국어 이미지로 옮기되, 급작스러운 몰락의 감각이 드러나도록 ‘미끄러질 때’로 번역했습니다.
- source_word: עֲתִדֹת לָמוֹ
  english_pob_choice: what is prepared for them
  chosen_korean: 그들에게 예비된 것이 속히 다가옵니다
  alternatives_korean:
  - 그들을 위해 준비된 것이 속히 옵니다
  - 그들에게 정해진 것이 속히 다가옵니다
  lexicon: HALOT
  rationale: 압축된 히브리어를 너무 추상화하지 않으면서도, ‘예비된 것’이 무엇인지 열린 상태로 남기기 위해 ‘그들에게 예비된 것’으로 옮겼습니다.
theological_decisions:
- issue: 신적 보응의 성격
  chosen_reading: ‘원수 갚는 일’과 ‘보응’을 하나님께 속한 공적 심판으로 유지했습니다.
  alternative_readings:
  - ‘정의’로 완화하기
  - ‘복수’로 더 감정적으로 옮기기
  rationale: 본문은 하나님의 심판 권한을 강조하므로, 현대 독자가 오해하기 쉬운 사적 감정의 ‘복수’나 의미를 약화하는 ‘정의’로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 문장의 종결 방식
  chosen_reading: 직설적 선언을 유지하여 경구적·예언적 어조를 살렸습니다.
  alternative_readings:
  - 설명형으로 풀기
  - 완곡하게 바꾸기
  rationale: 히브리어의 짧고 단호한 평행법을 살려, 경고의 무게가 약해지지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
