revisions:
- from: 지극히 높으신 이가 민족들에게 그들의 몫을 주실 때, 사람의 아들들을 나누실 때에, 민족들의 경계를 이스라엘의 아들들의 수에 따라 세우셨습니다.[a]
  to: 지극히 높으신 분께서 민족들에게 유산을 주시고 사람들을 갈라 놓으실 때, 백성들의 경계를 이스라엘 자손의 수에 따라 정하셨습니다.[a][b]
  rationale: 본문은 제공된 WLC의 בני ישראל을 따라 ‘이스라엘 자손’으로 유지했습니다. 다만 한국어에서 직역이 오해를 낳는 בְּנֵי אָדָם은 의미상 동등한 ‘사람들’로 옮기고 각주에서 히브리어 표현을 밝혔습니다. 동사 פרד의 분리 의미는 ‘갈라 놓으실 때’로, יצב의 확정·설정 의미는 ‘경계를 … 정하셨습니다’로 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:09Z'
review_pass:
  verdict: revise
  source_fidelity: 마소라 본문의 ‘이스라엘의 아들들’을 본문에 유지하고 본문 변이를 각주로 제시한 점은 적절합니다. 다만 בְּנֵי אָדָם은 히브리어 관용어로서 일반 인간을 뜻하므로, ‘사람의 아들들’은 한국어에서 특정 개인의 남성 자녀를 뜻하는 듯하여 원문의 지시 범위를 부정확하게 만들 수 있습니다. עַמִּים는 앞선 גּוֹיִם와 구별하여 ‘백성들’로 옮기는 것이 좋습니다.
  naturalness: ‘지극히 높으신 이’와 ‘이스라엘의 아들들’ 및 ‘사람의 아들들’은 현대 표준 한국어 성경 문장으로 다소 부자연스럽습니다. ‘지극히 높으신 분’, ‘이스라엘 자손’, ‘사람들’은 합쇼체의 격식과 자연스러움을 함께 지키며, 후자의 관용적 의미는 각주로 명시할 수 있습니다.
  terminology: ‘지극히 높으신 분’은 עֶלְיוֹן의 신적 칭호를 자연스럽게 보존합니다. ‘유산’, ‘경계’, ‘이스라엘 자손’은 각각 분배된 상속 몫, 영토 경계, בני ישראל을 무리 없이 전달합니다. 본문 변이 각주는 사해문서와 칠십인역의 읽기를 서로 정확히 구분해야 합니다.
  issues:
  - severity: medium
    issue: ‘사람의 아들들’
