source:
  edition: WLC
  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
  footnotes:
  - marker: a
    text: Dead Sea Scrolls and the Septuagint read 'sons of God' (or 'angels of God') instead of 'sons of Israel.'
    reason: textual_variant
  - marker: b
    text: '''The sons of man'' is a Hebrew expression for human beings or humankind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 분께서 민족들에게 유산을 주시고 사람들을 갈라 놓으실 때, 백성들의 경계를 이스라엘 자손의 수에 따라 정하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사해문서의 일부는 ‘하나님의 아들들’로, 칠십인역은 ‘하나님의 천사들’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 ‘사람의 아들들’은 사람들, 곧 인류를 뜻하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: HALOT
  rationale: 하나님을 가리키는 칭호이므로 직역보다 칭호의 위격성을 살렸고, 문맥상 존칭이 필요한 대상이라 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: גּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 열방
  lexicon: HALOT
  rationale: 문맥의 রাজনৈতিক·민족적 집단을 가리키므로 ‘민족들’이 가장 자연스럽고, 후반의 ‘민족들의 경계’와도 대응됩니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 사람들
  - 인류
  - 사람의 자손들
  lexicon: HALOT
  rationale: 히브리어의 남성형 표현을 그대로 살리면서도 한국어에서 어색함을 줄이기 위해 ‘사람의 아들들’로 번역했습니다.
- source_word: יַצֵּב גְּבֻלֹת
  english_pob_choice: he fixed the boundaries
  chosen_korean: 경계들을 세우셨습니다
  alternatives_korean:
  - 경계들을 정하셨습니다
  - 경계를 확정하셨습니다
  lexicon: HALOT
  rationale: יצב의 ‘견고하게 세우다, 확립하다’의 뜻을 반영하여 단순한 지정보다 ‘세우다’가 원문 동작을 더 잘 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 마소라 본문을 따라 ‘sons of Israel’의 직접성을 보존했고, 전통적 관용구보다 원문 구조를 더 투명하게 반영했습니다.
theological_decisions:
- issue: 마지막 절의 본문 전통과 번역 본문 유지
  chosen_reading: 본문은 마소라 본문의 ‘이스라엘의 아들들’을 따르고, 대안 전승은 각주로 보완합니다.
  alternative_readings:
  - ‘하나님의 아들들’
  - ‘하나님의 천사들’
  rationale: 제시된 WLC 본문을 우선하되, 사해문서와 칠십인역이 지지하는 변이를 독자에게 숨기지 않기 위해 각주로 남깁니다.
  doctrine_reference: 원문 우선 원칙과 본문 변이 보존 원칙
- issue: ‘사람의 아들들’이라는 표현의 성별 표지
  chosen_reading: 남성형 표현을 유지하되 한국어에서 인류 일반을 가리키는 관용적 의미로 읽히도록 둡니다.
  alternative_readings:
  - 인류
  - 사람들
  rationale: 히브리어의 남성형·대표성 표현을 평탄화하지 않고 보존하여 원문의 어조와 수사적 긴장을 유지합니다.
  doctrine_reference: 성별-정확성 원칙
