  - severity: low
    issue: 본문 변이 각주의 전승 구분
    rationale: 사해문서 증거는 통상 ‘하나님의 아들들’을, 칠십인역은 ‘하나님의 천사들’을 지지합니다. 두 전승을 하나의 괄호 안 대안으로 뭉뚱그리기보다 구분하는 편이 정확합니다.
  - severity: low
    issue: ‘민족들’의 반복 및 ‘이스라엘의 아들들’의 비관용성
    rationale: עַמִּים는 ‘백성들’로 옮겨 앞 절의 גּוֹיִם와 구별할 수 있으며, ‘이스라엘 자손’은 한국어에서 בני ישראל의 확립된 자연스러운 대응어입니다.
