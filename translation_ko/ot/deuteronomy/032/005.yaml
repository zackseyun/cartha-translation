id: DEU.32.5
reference: Deuteronomy 32:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
  footnotes:
  - marker: a
    text: Hebrew is difficult and compressed. The first clause may also be understood, 'They have corrupted themselves,' and the next phrase may be rendered, 'their blemish' or 'their fault.'
    reason: alternative_reading
  - marker: b
    text: Or 'a perverse and crooked generation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그분께 대하여 부패한 행위를 하였습니다[a]. 그들은 그분의 자녀들이 아니며, 이는 그들의 흠 때문입니다. 그들은 비뚤어지고 뒤틀린 세대입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이고 해석하기 어렵습니다. 첫 구절은 ‘그들은 자신을 부패시켰다’로도 이해할 수 있으며, 이어지는 표현은 ‘그들의 흠’ 또는 ‘그들의 허물’로 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘패역하고 비뚤어진 세대’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  english_pob_choice: have acted corruptly
  chosen_korean: 부패하게 행하였고
  alternatives_korean:
  - 타락하게 행하였고
  - 패역하게 행하였고
  - 스스로를 부패시켰고
  lexicon: HALOT
  rationale: פּיעל형의 동사적 힘을 살리면서도, 반사적 의미를 단정하지 않도록 ‘부패하게 행하다’로 옮겼습니다.
- source_word: לֹא בָּנָי/ו
  english_pob_choice: they are not his children
  chosen_korean: 그들은 그분의 자녀들이 아니니
  alternatives_korean:
  - 그들은 그의 자녀들이 아니니
  - 그들은 더 이상 그분의 자녀들이 아니니
  lexicon: HALOT
  rationale: 히브리어는 간결한 계사문이므로, 자연스러운 한국어로 풀되 ‘더 이상’ 같은 시간적 뉘앙스는 넣지 않았습니다.
- source_word: מוּמָם
  english_pob_choice: because of their defect
  chosen_korean: 그들의 흠 때문입니다
  alternatives_korean:
  - 그들의 결함 때문입니다
  - 그들의 흠이 그들 것입니다
  - 그들의 허물 때문입니다
  lexicon: HALOT
  rationale: מוּם의 기본 의미인 ‘흠/결함’을 살리면서, 문장 관계는 한국어로 가장 덜 과잉 해석적인 ‘때문입니다’로 처리했습니다.
- source_word: עִקֵּשׁ וּפְתַלְתֹּל
  english_pob_choice: crooked and twisted
  chosen_korean: 비뚤어지고 뒤틀린
  alternatives_korean:
  - 굽고 뒤틀린
  - 비뚤고 비틀린
  - 사악하고 비뚤어진
  lexicon: HALOT
  rationale: 두 형용사의 병렬성과 신체적 비유를 살려 ‘비뚤어지고 뒤틀린’으로 옮겼습니다. ‘사악한’은 도덕적 해석을 너무 앞세워 원문의 이미지성을 약화시킬 수 있습니다.
theological_decisions:
- issue: 모세의 노래에서 ‘그분의 자녀들’ 부정의 강도
  chosen_reading: 그들은 그분의 자녀들이 아니니
  alternative_readings:
  - 그들은 더 이상 그분의 자녀들이 아니니
  - 그들은 그분께 속한 자녀들이 아니니
  rationale: 본문은 시간적 변화나 소속 정의를 명시하지 않으므로, 관계 부정을 직접적으로 유지해 본문의 날카로움을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 첫 절의 난해한 주어-목적어 관계
  chosen_reading: 그들은 그분에게 대해 부패하게 행하였고
  alternative_readings:
  - 그들은 자신을 부패시켰고
  - 그분께서 그들에게 부패하게 행하셨고
  rationale: 마소라 본문의 압축성과 POB의 ‘toward him’ 해석을 따라, 하나님을 향한 반역 행위로 읽히는 최소한의 관계만 드러냈습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
