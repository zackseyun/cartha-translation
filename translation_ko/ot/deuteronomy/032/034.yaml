  lexicon: HALOT
  rationale: 문서·보관물에 찍는 봉인의 뉘앙스를 살려, 단순히 닫혀 있다는 뜻보다 더 강한 ‘sealed’의 의미를 반영했습니다.
- source_word: בְּאוֹצְרֹתָי
  english_pob_choice: in my storehouses
  chosen_korean: 내 곳간들에
  alternatives_korean:
