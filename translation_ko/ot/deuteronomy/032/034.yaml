  lexicon: HALOT
  rationale: ‘laid up’의 보관·비축 이미지를 살리되, 뒤의 ‘곳간들’과 함께 저장된 상태를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: חָתֻם
