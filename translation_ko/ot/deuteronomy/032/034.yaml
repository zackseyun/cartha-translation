  - 내 보물창고에
  - 내 treasuries에
  lexicon: HALOT
  rationale: 히브리어의 저장소/곳간 이미지를 현대 한국어에서 가장 직접적으로 전달하는 말로 옮겼고, 복수형도 반영했습니다.
theological_decisions:
- issue: 반복되는 ‘…있지 않습니까?’ 구조
  chosen_reading: 두 절반을 모두 질문형으로 유지해, 감추어 두고 봉인해 둔 상태를 하나님 앞에서 확인시키는 수사적 효과를 살렸습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘그것은 내게 쌓여 있고…’로 옮길 수 있음
  rationale: 히브리어의 הֲלֹא가 기대된 긍정을 요구하는 질문이므로, 평서문으로 완화하지 않고 질문의 긴장을 보존했습니다.
  doctrine_reference: 수사적 질문과 문맥의 긴장 보존
- issue: 대상 지시어 ‘it’의 불명확성
  chosen_reading: ‘그것’으로 옮겨, 앞문맥의 무엇을 가리키는지 단정하지 않고 모호성을 유지했습니다.
  alternative_readings:
  - ‘이것’처럼 좀 더 지시적으로 옮길 수 있음
  - 앞문맥을 해석해 특정 명사로 풀어쓸 수 있음
  rationale: 영문 POB의 해설처럼 원문은 지시 대상이 분명히 특정되지 않으므로, 한국어도 그 여지를 남겨 두는 것이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 해석적 특정화 자제
