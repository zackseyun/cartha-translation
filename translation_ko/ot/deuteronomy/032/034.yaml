  source_fidelity: 히브리어는 수사 의문문 하나가 ‘내게 감추어져 있음’과 ‘내 저장고들에 봉인되어 있음’이라는 두 수동 분사구를 함께 지배합니다. 초안의 ‘쌓여’는 보관·비축의 함의는 있으나 כָּמֻס의 기본 뜻인 ‘감추어진/숨겨진’을 충분히 반영하지 못합니다. 또한 두 절반을 각각 독립 질문으로 처리하기보다 한 의문문으로 연결하는 편이 원문의 통사와 더 가깝습니다.
  naturalness: ‘그것이 내게 감추어져 있고 내 저장고들에 봉인되어 있지 않습니까?’는 현대 표준어 합쇼체로 자연스럽고, 수사적 질문의 힘도 보존합니다. ‘저장고들’은 복수형을 드러내면서도 ‘곳간들’보다 현대적입니다.
  terminology: ‘감추어져’는 כָּמֻס에 충실하며, ‘봉인되어’는 חָתֻם의 보안·봉인 이미지를 적절히 전달합니다. ‘저장고들’은 אוֹצְרוֹתָי의 저장소/보관소 의미를 반영합니다. ‘그것’은 남성 단수 대명사의 정확한 선행사를 특정하지 않는 원문의 여지를 유지합니다.
