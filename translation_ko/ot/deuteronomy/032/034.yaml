lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is it not
  chosen_korean: …않습니까?
  alternatives_korean:
  - …아닙니까?
  - …그렇지 않습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 기대된 동의를 한국어 합쇼체로 자연스럽게 살리기 위해 종결형을 질문형으로 옮겼습니다.
- source_word: כָּמֻס
