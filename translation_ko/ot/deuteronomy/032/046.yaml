reference: Deuteronomy 32:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ שִׂ֣ימוּ לְבַבְ/כֶ֔ם לְ/כָל הַ/דְּבָרִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י מֵעִ֥יד בָּ/כֶ֖ם הַ/יּ֑וֹם אֲשֶׁ֤ר תְּצַוֻּ/ם֙ אֶת בְּנֵי/כֶ֔ם לִ/שְׁמֹ֣ר לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
  footnotes:
  - marker: a
    text: Or “I am warning you today” or “I am calling as witness against you today.” The Hebrew verb can carry both testimony and warning/forensic force in covenant contexts.
    reason: alternative_reading
  - marker: b
    text: Hebrew “your sons,” which can represent the next generation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「오늘 내가 너희에게 증언하는[a] 모든 말씀에 마음을 두십시오. 너희는 너희 아들들에게[b] 이 율법의 모든 말씀을 지키고 행하라고 명령하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 오늘 너희에게 경고하는” 또는 “내가 오늘 너희를 상대로 증언하는.” 이 동사는 언약 문맥에서 증언과 경고 또는 법정적 의미를 함께 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 “너희 아들들”로, 더 넓게는 다음 세대를 대표할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  english_pob_choice: Set your heart on
  chosen_korean: 마음을 두십시오
  alternatives_korean:
  - 마음에 두십시오
  - 마음을 기울이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 내적 주의와 결단에 마음을 두는 것이므로, 자연스러운 합쇼체로 옮기되 단순한 감정 표현으로 좁히지 않았습니다.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  english_pob_choice: I am testifying to you today
  chosen_korean: 내가 너희에게 증언하는
  alternatives_korean:
  - 내가 너희에게 경고하는
  - 내가 너희를 상대로 증언하는
  lexicon: HALOT
  rationale: עוּד의 증언/경고의 긴장을 살리기 위해 ‘증언하다’를 본문에 두고, 더 강한 경고·대적 뉘앙스는 과도하게 확정하지 않았습니다.
- source_word: בְּנֵיכֶם
  english_pob_choice: your sons
  chosen_korean: 너희 아들들에게
  alternatives_korean:
  - 너희 자녀들에게
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형 ‘아들들’이므로 본문에서는 성중립화하지 않고 그대로 반영했습니다.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: to keep and to do
  chosen_korean: 지키고 행하게 하려는
  alternatives_korean:
  - 지키고 행하도록
  - 준수하고 실천하게 하려는
  lexicon: HALOT
  rationale: 두 동사의 병렬을 살려 단순히 ‘지키다’로만 합치지 않고, 규례를 지키는 것과 실제로 행하는 것을 함께 드러냈습니다.
- source_word: הַתּוֹרָה הַזֹּאת
  english_pob_choice: this law
  chosen_korean: 이 율법
  alternatives_korean:
  - 이 가르침
  - 이 법
  lexicon: HALOT
  rationale: 신명기의 언약 문맥에서는 תּוֹרָה를 ‘율법’으로 옮기는 것이 가장 분명하며, 앞의 ‘말씀들’과도 대응됩니다.
theological_decisions:
- issue: מֵעִיד בָּכֶם הַיּוֹם의 증언/경고 긴장
  chosen_reading: 본문에는 ‘증언하는’으로 두고, 강한 경고 또는 대적 증언의 의미는 주해 여지를 남겼습니다.
  alternative_readings:
  - 경고하는
  - 너희를 상대로 증언하는
  rationale: 모세의 발화는 언약적 증언이면서 경고의 성격도 가지므로, 한쪽으로 과도하게 고정하지 않고 본문과 각주에서 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: בְּנֵיכֶם의 대표성
  chosen_reading: ‘너희 아들들’로 직역을 유지하되, 다음 세대를 대표하는 의미는 본문 밖에서 확인할 수 있게 합니다.
  alternative_readings:
  - 너희 자녀들
  rationale: 히브리어 형태를 보존하는 것이 원문 감각을 더 잘 드러내며, 대표적 다음 세대 의미를 성급히 일반화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
