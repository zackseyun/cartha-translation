  rationale: 안전한 교정이 필요합니다. 원문은 ‘모든 말씀에 마음을 두라’고 한 뒤, 그 말씀을 아들들에게 전하여 ‘이 율법의 모든 말씀을 지키고 행하도록’ 명령할 것을 말합니다. 수정문은 이 목적어와 동작의 관계를 회복했으며, 원문에 없는 교리적 해석은 추가하지 않았습니다.
