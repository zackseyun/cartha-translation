translation:
  language: ko
  text: 그들의 아들들과 딸들 때문에 분노를 일으키신 것을 보고, 야훼께서 그들을 거부하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 언약적 고유명 YHWH를 ‘야훼’로 옮겨, 일반적인 호칭(주님)과 구별했습니다.
- source_word: וַיִּנְאָץ
  english_pob_choice: rejected them
  chosen_korean: 그들을 거부하셨습니다
  alternatives_korean:
  - 그들을 물리치셨습니다
  - 그들을 멸시하셨습니다
  - 그들을 업신여기셨습니다
  lexicon: HALOT
  rationale: נאץ는 단순한 감정이 아니라 관계적 거절과 경멸의 뉘앙스를 지니므로, 현대 한국어에서 그 힘을 비교적 직접적으로 드러내는 ‘거부하셨습니다’를 택했습니다.
- source_word: מִכַּעַס
  english_pob_choice: provoked to anger by
  chosen_korean: 분노를 일으키신 것을 보고
  alternatives_korean:
  - 분노를 일으킨 탓으로
  - 노하게 한 때문에
  - 분노하게 만든 때문에
  lexicon: HALOT
  rationale: מִן + כַּעַס의 원인 관계를 한국어로 자연스럽게 풀어, ‘~때문에 분노를 일으키신’ 방식으로 원인과 결과를 드러냈습니다.
- source_word: בָּנָיו וּבְנֹתָיו
  english_pob_choice: his sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 그의 아들들과 그의 딸들
  lexicon: HALOT
  rationale: 히브리어의 남녀 자손을 모두 명시하므로, 포괄적 표현보다 ‘아들들과 딸들’을 유지해 성별-정확성을 살렸습니다.
theological_decisions:
- issue: 원인절의 문장 배치
  chosen_reading: ‘그들의 아들들과 딸들 때문에 분노를 일으키신 것을 보고’로 옮겨, 야훼의 거절과 그 원인을 한 문장 안에서 연결했습니다.
  alternative_readings:
  - ‘그들의 아들들과 딸들 때문에 분노하여 그들을 거부하셨습니다’
  - ‘그들의 아들들과 딸들로 인해 그들을 거부하셨습니다’
  rationale: 히브리어는 ‘보시고/거부하셨으며/분노의 원인’이 긴밀히 연결되어 있어, 한국어에서도 원인 구조를 유지하되 지나친 직역 어색함을 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
