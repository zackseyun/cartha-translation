base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
  footnotes:
  - marker: a
    text: Or 'begot you' for 'fathered you.'
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'neglected' is difficult; it may also be rendered 'forgot' or 'were unmindful of.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the God who brought you forth'; the Hebrew uses birth imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 너를 낳으신 반석을 네가 소홀히 여기고, 너를 낳아 주신 하나님을 잊었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낳으신’은 ‘아버지가 되신/낳으신’의 생성·부생 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소홀히 여기고’는 난해한 동사를 해석한 것으로, ‘잊고/무심히 여기고’의 가능성을 함께 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘낳아 주신’은 본문이 사용하는 출산 이미지를 그대로 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֥וּר
  english_pob_choice: the Rock
  chosen_korean: 반석
  alternatives_korean:
  - 바위
  - 그 반석
  lexicon: HALOT
  rationale: צור는 여기서 이스라엘의 하나님을 가리키는 비유적 호칭이므로, 문자적 이미지와 칭호성을 함께 살리는 ‘반석’이 가장 자연스럽습니다.
- source_word: יְלָדְךָ
  english_pob_choice: who fathered you
  chosen_korean: 너를 낳으신
  alternatives_korean:
  - 너를 아버지처럼 낳으신
  - 너를 생기게 하신
  - 너를 낳아 주신
  lexicon: HALOT
  rationale: 동사 ילד는 이 문맥에서 출산이 아니라 ‘낳다/아버지가 되다’의 생성·부생 의미를 띠므로, 아버지적 기원을 드러내는 ‘낳으신’으로 옮겼습니다.
- source_word: תֶּשִׁי
  english_pob_choice: you neglected
  chosen_korean: 소홀히 여기고
  alternatives_korean:
  - 잊었고
  - 무심히 대하고
  - 저버리고
  lexicon: HALOT
  rationale: 이 동사는 의미가 कठिन하지만, 문맥상 단순 기억 상실보다 책임 있는 무시·방치를 뜻하므로 ‘소홀히 여기고’로 처리해 ‘잊다’와의 평행을 살렸습니다.
- source_word: מְחֹלְלֶךָ
  english_pob_choice: who gave you birth
  chosen_korean: 너를 낳아 주신
  alternatives_korean:
  - 너를 세상에 나오게 하신
  - 너를 출산하게 하신
  - 너를 빚으신
  lexicon: HALOT
  rationale: 히브리어는 산고/출산 이미지를 쓰므로, 전통적 창조 용어로 완화하지 않고 어머니적 출산 이미지를 드러내는 ‘낳아 주신’으로 옮겼습니다.
theological_decisions:
- issue: 하나님을 가리키는 아버지·출산 이미지의 공존
  chosen_reading: ‘반석’과 함께 ‘낳으신/낳아 주신’ 표현을 그대로 살려, 하나님에 대한 남성적·출산적 비유를 함께 유지했습니다.
  alternative_readings:
  - ‘지으신 하나님’처럼 일반 창조 ভাষ로 평탄화
  - 한쪽 이미지만 남기고 다른 쪽은 약화
  rationale: 본문은 의도적으로 부모적 이미지를 병치하므로, 그 긴장을 해소하지 않고 한국어에서도 그대로 드러내는 것이 स्रोत에 충실합니다.
  doctrine_reference: Translation philosophy §3
