base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
  footnotes:
  - marker: a
    text: Or 'it is not a trivial matter for you' or 'it is not a vain thing for you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your life'; the plural form can function idiomatically as a singular abstract noun.
    reason: lexical_alternative
  - marker: c
    text: Or 'there to possess it' or 'to inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 여러분에게서 나온 헛된 말이 아니니, 곧 여러분의 생명입니다[a][b]. 이 말씀으로 여러분은 요단을 건너 가서 차지할 땅에서 오래 살게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분에게는 헛된 일이 아닙니다’ 또는 ‘여러분에게는 무익한 일(말)입니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여러분의 생명들’이지만, 관용적으로 단수적 추상명사처럼 쓰입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅을 차지하려고’ 또는 ‘그 땅을 상속하려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  english_pob_choice: an empty word
  chosen_korean: 헛된 말
  alternatives_korean:
  - 빈 말
  - 무익한 말씀
  - 헛된 것
  lexicon: HALOT
  rationale: דָבָר를 한국어의 ‘말’로 옮기고, רֵק의 공허함·무가치를 ‘헛된’으로 드러내어 단순히 ‘비어 있다’는 느낌보다 의미 없는 말이라는 점을 살렸습니다.
- source_word: מִכֶּם
  english_pob_choice: for you
  chosen_korean: 여러분에게서 나온
  alternatives_korean:
  - 여러분을 위한
  - 여러분에게
  - 여러분으로부터
  lexicon: HALOT
  rationale: 문맥상 מן은 단순한 출처보다 ‘너희에게서 기원한 것이 아니다’는 대비를 나타내므로, 한국어에서는 자연스럽게 ‘여러분에게서 나온’으로 풀어 원문 대조를 살렸습니다.
- source_word: חַיֵּיכֶם
  english_pob_choice: your life
  chosen_korean: 여러분의 생명
  alternatives_korean:
  - 여러분의 삶
  - 여러분의 생명들
  lexicon: HALOT
  rationale: 히브리어 복수형이 관용적으로 단수적 추상명사처럼 쓰인 점을 반영하여, 일상적 ‘삶’보다 더 직접적으로 생명·존재의 근원을 드러내는 ‘생명’을 선택했습니다.
- source_word: וּבַדָּבָר הַזֶּה
  english_pob_choice: by this word
  chosen_korean: 이 말씀으로
  alternatives_korean:
  - 이 말로
  - 이 일로
  - 이것으로
  lexicon: HALOT
  rationale: 앞의 דָבָר와 연결성을 유지하기 위해 ‘말씀’으로 옮기되, 도구·수단의 ב를 한국어 조사 ‘-으로’로 자연스럽게 표현했습니다. 문맥상 모세의 언약적 교훈이므로 ‘말씀’이 적절합니다.
theological_decisions:
- issue: 말씀과 생명의 관계
  chosen_reading: 이 구절은 하나님의 말씀이 단순히 중요한 정보가 아니라, 이스라엘의 생명과 땅에서의 장수에 직결되는 언약적 생명의 근원임을 말합니다.
  alternative_readings:
  - 단지 수사적으로 율법의 중요성을 강조한 표현
  - 일반적인 교훈적 격언
  rationale: 두 절반의 평행 구조—‘여러분의 생명’과 ‘이 말씀으로 오래 살게 될 것입니다’—는 단순 강조를 넘어 순종과 생명의 연관을 분명히 합니다. 한국어 번역도 그 긴장과 힘을 약화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
