  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
  footnotes:
  - marker: a
    text: Or 'guided him.' The Hebrew verb can denote leading or guiding.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 홀로 그를 인도하셨고, 그와 함께한 낯선 신은 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 인도하셨다.’ 히브리어 동사는 ‘인도하다’와 ‘이끌다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신적 이름 יהוה를 한국어 음역으로 옮겨, 호칭인 ‘주님’으로 바꾸지 않고 본문의 인격적 이름을 드러냈습니다.
- source_word: בָּדָד
  english_pob_choice: alone
  chosen_korean: 홀로
  alternatives_korean:
  - 혼자
  - 단독으로
  - 따로
  lexicon: HALOT
  rationale: 야훼가 어떤 동반이나 도움 없이 단독으로 행하셨다는 뜻을 한국어 관용에 맞게 간결하게 살렸습니다.
- source_word: יַנְחֶנּוּ
  english_pob_choice: led him
  chosen_korean: 그를 인도하셨고
  alternatives_korean:
  - 그를 이끄셨고
  - 그를 안내하셨고
  - 그를 지도하셨고
  lexicon: HALOT
  rationale: נחה의 히필형이 여기서는 광야 인도라는 문맥에서 ‘인도하다’가 가장 자연스럽고, ‘그를’이라는 단수 대명사는 히브리어 어미를 그대로 반영했습니다.
- source_word: אֵל נֵכָר
  english_pob_choice: foreign god
  chosen_korean: 낯선 신
  alternatives_korean:
  - 이방 신
  - 외국 신
  - 낯선 하나님
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 하나님과 구별되는 우상적 신을 가리키므로, ‘foreign’의 배타성과 ‘god’의 종교적 대상을 함께 살려 ‘낯선 신’으로 옮겼습니다.
theological_decisions:
- issue: 단수 대명사 ‘그’를 공동체 전체에 적용하는 방식
  chosen_reading: 히브리어의 단수 목적어/대명사를 유지하여 ‘그를’로 옮겼습니다.
  alternative_readings:
  - 공동체 의미를 드러내어 ‘그들을’로 옮김
  rationale: 노래는 이스라엘을 집합적 단수로 의인화하므로, 문법형을 평탄화하지 않고 원문의 형식을 보존했습니다.
  doctrine_reference: 번역 철학 §4(문법형 보존) 및 문맥적 집합단수 처리
