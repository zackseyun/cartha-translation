  terminology: יהוה의 음역 ‘야훼’는 영어 POB의 방침과 일치합니다. אֵל נֵכָר는 한국어 성경 및 현대 종교 언어에서 의미가 명확한 ‘이방 신’으로 고치는 것이 좋습니다. 현 각주의 대안은 본문과 동일한 ‘인도하다’를 제시하여 어휘 대안 기능을 하지 못하므로 ‘이끌다’로 바로잡아야 합니다.
