  lexicon: HALOT
  rationale: 서술 진행을 살리면서, 뒤의 לֵאמֹר 인용 도입과 어울리게 ‘말씀하여 이르셨습니다’로 옮겼습니다. 단순한 ‘말하다’보다 격식이 있으며, 직접 인용이 이어짐을 자연스럽게 보여 줍니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유명사 יְהוָה를 титул이 아니라 신명으로 보존하기 위해 ‘야훼’를 사용했습니다. POB의 स्रोत 직접 렌더링 원칙에 맞습니다.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: on that very day
  chosen_korean: 바로 그 날에
  alternatives_korean:
  - 그 날에
  - 이 바로 그 날에
  lexicon: HALOT
  rationale: ‘그 날’에 ‘바로’를 더해 히브리어 관용구의 강조점—정확한 시점과 긴박성—을 살렸습니다. 한국어로는 ‘바로 그 날에’가 가장 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 말씀하시며
  lexicon: HALOT
  rationale: 히브리어의 전형적인 발화 도입어는 한국어에서 별도의 ‘말하여’ + ‘이르셨습니다’로 중복 번역하기보다, 직설적 인용을 여는 자연스러운 종결로 처리했습니다.
theological_decisions:
- issue: 야훼 신명 표기
