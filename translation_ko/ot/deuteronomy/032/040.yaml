translation:
  language: ko
  text: 내가 하늘을 향해 내 손을 들고 말합니다[a]. “내가 영원히 살아 있음을 두고 맹세합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 영원히 살아 있다’입니다. 그러나 손을 들어 하는 이 표현은 문맥상 자기 자신을 두고 하는 엄숙한 맹세의 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  english_pob_choice: I lift up
  chosen_korean: 들어 올리고
  alternatives_korean:
  - 들고
  - 올리고
  lexicon: HALOT
  rationale: 맹세 동작으로 손을 들어 올리는 구체적 행위를 자연스러운 한국어로 살렸습니다.
- source_word: אֶל שָׁמַיִם
  english_pob_choice: to heaven
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘에
  - 하늘을 향해
  lexicon: HALOT
  rationale: 히브리어의 상향 지시를 간결하게 반영하면서, 맹세 동작의 방향성을 유지했습니다.
- source_word: חַי אָנֹכִי לְעֹלָם
  english_pob_choice: As I live forever
  chosen_korean: 내가 영원히 살아 있습니다
  alternatives_korean:
  - 나는 영원히 삽니다
  - 내가 영원히 살아 있습니다
  lexicon: HALOT
  rationale: 단순한 생존 진술이 아니라 맹세 공식이지만, 한국어 본문에서는 직역을 과도하게 확장하지 않고 살아 계심의 지속성을 드러냈습니다.
theological_decisions:
- issue: 맹세 공식의 힘을 약화시키지 않으면서도 한국어로 과장 없이 옮기는 문제
  chosen_reading: 손을 하늘로 들어 올리는 행동과 ‘내가 영원히 살아 있습니다’라는 직접 진술을 함께 유지했습니다.
  alternative_readings:
  - ‘내가 영원히 삽니다’
  - ‘내가 영원히 살아 있노라’
  rationale: 본문은 여호와의 자기 맹세를 묘사하므로, 행동과 선서를 함께 보존해야 합니다. 다만 현대 한국어에서는 ‘살아 있노라’보다 ‘살아 있습니다’가 합쇼체 본문에 더 적합합니다.
  doctrine_reference: Translation philosophy §3, §6
