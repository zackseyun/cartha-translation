  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
  footnotes:
  - marker: a
    text: Or “from opposite it” or “from afar”; the Hebrew expression indicates that Moses will view the land without entering it.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has “children of Israel” or “Israelites.” The Hebrew reads “sons of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 멀리서 그 땅을 보게 되겠지만[a], 그곳으로는 들어가지 못합니다[b]. 내가 이스라엘 자손에게 주고 있는 땅입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִנֶּגֶד는 ‘맞은편에서’, ‘멀리서’, 또는 ‘대면하여’라는 뜻으로도 옮길 수 있습니다. 여기서는 모세가 그 땅을 들어가지 못한 채 바라본다는 점을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 땅으로 들어가지 못한다’는 뜻입니다. 한국어에서는 뒤의 ‘그 땅’과 중복을 피하기 위해 ‘그곳으로는 들어가지 못합니다’로 다듬었습니다.
    reason: lexical_alternative
