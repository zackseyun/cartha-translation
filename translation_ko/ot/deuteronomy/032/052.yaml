  - 대면하여
  - 멀리 떨어져서
  lexicon: HALOT
  rationale: מִנֶּגֶד는 단순한 시야 거리보다 ‘들어가지 못한 채 바라보는 위치’의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 간결한 ‘멀리서’로 옮겼습니다.
- source_word: תִּרְאֶה
  english_pob_choice: you shall see
  chosen_korean: 보게 되겠지만
  alternatives_korean:
  - 보실 것입니다
  - 보게 됩니다
  - 보게 되리라
  lexicon: HALOT
  rationale: 예언적 미래를 살리면서도 문맥상 금지와 대비를 이루도록, 단정적인 예고형 ‘보게 되겠지만’을 택했습니다.
- source_word: לֹא תָבֹא אֶל הָאָרֶץ
  english_pob_choice: you shall not go there, into the land
  chosen_korean: 그곳으로는 들어가지 못합니다
  alternatives_korean:
  - 그 땅에 들어가지 못합니다
  - 그곳으로는 가지 못합니다
  - 그 땅으로는 들어가지 못합니다
  lexicon: HALOT
  rationale: בוא는 ‘들어가다/가다’ 모두 가능하지만, 뒤의 목적어와 결합해 ‘그곳으로는 들어가지 못합니다’로 옮기면 진입 금지를 분명히 드러내면서도 한국어로 자연스럽습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 직접 드러내는 ‘자손’은 관용적으로 굳어진 성경 한국어이면서도 ‘sons of Israel’의 집합적·언약적 용례를 무리 없이 반영합니다.
