revisions:
- from: 그러나 예스룬은 살이 찌고 발로 찼습니다. 네가 살이 찌고, 두꺼워지고, 기름졌습니다. 그가 자기를 지으신 하나님을 버리고 자기 구원의 바위를 멸시하였습니다.[a]
  to: 그러나 예스룬은 살이 찌고 발로 찼습니다. 너는 살이 찌고, 살이 두툼해지고, 기름졌습니다[a]. 그가 그를 지으신 하나님을 버리고 자기 구원의 반석을 멸시하였습니다.
