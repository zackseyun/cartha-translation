- source_word: צוּר
  english_pob_choice: the Rock
  chosen_korean: 바위
  alternatives_korean:
  - 반석
  - 바위산
  lexicon: HALOT
  rationale: 시편·신명기에서 반복되는 하나님의 은유를 직역하여 유지하되, 본문의 서정성을 해치지 않도록 ‘반석’보다 더 기초적인 ‘바위’를 택했습니다.
theological_decisions:
- issue: 2인칭과 3인칭이 교차하는 히브리 시의 수사
  chosen_reading: ‘예스룬은 … 그가 … 네가 …’의 교차를 그대로 살렸습니다.
  alternative_readings:
  - 모든 절을 3인칭으로 평탄화함
  - 모든 절을 2인칭으로 통일함
  rationale: 본문은 묘사와 직접 책망을 교차시키며 책임 추궁을 강화하므로, 이를 평탄화하지 않고 한국어에서도 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘자기 구원의 바위’의 신학적 은유
  chosen_reading: 하나님을 가리키는 ‘바위’를 은유로 유지했습니다.
  alternative_readings:
  - ‘구원의 바위’ 대신 ‘구원을 주시는 하나님’으로 풀어씀
  - ‘반석’으로 전통적 교회 용어를 사용함
  rationale: 신명기 32장의 반복 표지를 보존하여 하나님의 견고함과 언약적 구원의 이미지를 그대로 드러냅니다.
  doctrine_reference: Deuteronomy 32 song motif
