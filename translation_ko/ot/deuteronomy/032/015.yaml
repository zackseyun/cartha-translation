  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
  footnotes:
  - marker: a
    text: Or possibly, 'you were covered with fat' or 'you became bloated.' The Hebrew term is rare, and the exact nuance is uncertain, though the sense of overfed excess is clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예스룬은 살이 찌고 발로 찼습니다. 네가 살이 찌고, 두꺼워지고, 기름졌습니다. 그가 자기를 지으신 하나님을 버리고 자기 구원의 바위를 멸시하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살이 덮였습니다’ 혹은 ‘살이 불었습니다’로도 옮길 수 있습니다. 히브리어 표현이 드물어 정확한 뉘앙스는 확실하지 않지만, 과식으로 인한 지나침의 의미는 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  english_pob_choice: Jeshurun
  chosen_korean: 예스룬
  alternatives_korean:
  - 여수룬
  - 이스라엘
  lexicon: HALOT
  rationale: 고유칭호를 음역하여 시적 호칭의 힘을 살리고, 곧바로 ‘그가/네가’로 이어지는 문맥의 수사 효과를 유지합니다.
- source_word: וַיִּשְׁמַן / שָׁמַנְתָּ / עָבִיתָ / כָּשִׂיתָ
  english_pob_choice: grew fat / you grew fat / thick / sleek
  chosen_korean: 살이 찌고 / 살이 찌고 / 두꺼워지고 / 기름졌습니다
  alternatives_korean:
  - 비대해지고
  - 살이 올라
  - 둔해지고
  - 살집이 불어
  lexicon: HALOT
  rationale: 과도한 풍요로 인한 육체적 비대함을 구체적으로 살리되, 마지막 दुर्लभ형은 ‘기름졌습니다’로 옮겨 풍성함과 과식의 이미지를 함께 드러냅니다.
- source_word: וַיִּטֹּשׁ
  english_pob_choice: forsook
  chosen_korean: 버리고
  alternatives_korean:
  - 저버리고
  - 떠나고
  - 포기하고
  lexicon: HALOT
  rationale: 언약적 불충실을 뜻하는 동사이지만, 현대 한국어에서는 간결한 ‘버리고’가 의미를 직접적으로 전달합니다.
- source_word: צוּר
  english_pob_choice: the Rock
  chosen_korean: 바위
  alternatives_korean:
  - 반석
  - 바위산
  lexicon: HALOT
  rationale: 시편·신명기에서 반복되는 하나님의 은유를 직역하여 유지하되, 본문의 서정성을 해치지 않도록 ‘반석’보다 더 기초적인 ‘바위’를 택했습니다.
theological_decisions:
- issue: 2인칭과 3인칭이 교차하는 히브리 시의 수사
  chosen_reading: ‘예스룬은 … 그가 … 네가 …’의 교차를 그대로 살렸습니다.
  alternative_readings:
  - 모든 절을 3인칭으로 평탄화함
  - 모든 절을 2인칭으로 통일함
  rationale: 본문은 묘사와 직접 책망을 교차시키며 책임 추궁을 강화하므로, 이를 평탄화하지 않고 한국어에서도 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘자기 구원의 바위’의 신학적 은유
  chosen_reading: 하나님을 가리키는 ‘바위’를 은유로 유지했습니다.
  alternative_readings:
  - ‘구원의 바위’ 대신 ‘구원을 주시는 하나님’으로 풀어씀
  - ‘반석’으로 전통적 교회 용어를 사용함
  rationale: 신명기 32장의 반복 표지를 보존하여 하나님의 견고함과 언약적 구원의 이미지를 그대로 드러냅니다.
  doctrine_reference: Deuteronomy 32 song motif
