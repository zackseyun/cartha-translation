  - 이스라엘
  lexicon: HALOT
  rationale: 고유칭호를 음역하여 시적 호칭의 힘을 살리고, 곧바로 ‘그가/네가’로 이어지는 문맥의 수사 효과를 유지합니다.
- source_word: וַיִּשְׁמַן / שָׁמַנְתָּ / עָבִיתָ / כָּשִׂיתָ
  english_pob_choice: grew fat / you grew fat / thick / sleek
  chosen_korean: 살이 찌고 / 살이 찌고 / 두꺼워지고 / 기름졌습니다
  alternatives_korean:
  - 비대해지고
  - 살이 올라
  - 둔해지고
  - 살집이 불어
  lexicon: HALOT
  rationale: 과도한 풍요로 인한 육체적 비대함을 구체적으로 살리되, 마지막 दुर्लभ형은 ‘기름졌습니다’로 옮겨 풍성함과 과식의 이미지를 함께 드러냅니다.
- source_word: וַיִּטֹּשׁ
  english_pob_choice: forsook
  chosen_korean: 버리고
  alternatives_korean:
  - 저버리고
  - 떠나고
