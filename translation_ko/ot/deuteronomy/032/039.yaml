  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
  footnotes:
  - marker: a
    text: Or 'there is no God with me.' The Hebrew preposition can be rendered more literally as 'with,' but here likely carries the sense 'beside' or 'alongside' in a statement of exclusive deity.
    reason: lexical_alternative
  - marker: b
    text: Or 'I kill and I make alive.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I have shattered, and I will heal.' The verb rendered 'have wounded' can carry a stronger sense of crushing or shattering.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'from my hand,' an idiom for escaping someone's power or control.
    reason: cultural_note
  - marker: e
    text: Or 'I, I am he'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 보십시오. 내가 바로 그임을[e], 나 외에는 신이 없음을[a]. 내가 죽이고 살리며[d], 내가 상하게 하였고[c] 내가 고칠 것입니다. 내 손에서[b] 구해 낼 자가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나와 함께 신이 없다’입니다. 여기서 히브리어 전치사는 문맥상 다른 신이 그와 나란히 존재하지 않는다는 뜻, 곧 배타적 유일성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 손에서’는 권능이나 지배에서 벗어나는 것을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘상하게 하였다’로 옮긴 동사는 더 강하게는 ‘짓부수었다’ 또는 ‘산산이 부수었다’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 죽게 하고 살리며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 더 직역하면 ‘나, 곧 내가 그임을’입니다. 히브리어는 ‘나’를 반복하여 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: רְאוּ עַתָּה
  english_pob_choice: See now
  chosen_korean: 이제 보십시오
  alternatives_korean:
  - 보십시오
  - 이제 보라
  lexicon: HALOT
  rationale: 복수 명령형의 호소를 공손한 현대 표준어로 옮기되, 지금 인식하라는 촉구를 살리기 위해 ‘이제’를 앞에 두었습니다.
- source_word: כִּי אֲנִי אֲנִי הוּא
  english_pob_choice: I, even I, am he
  chosen_korean: 내가 바로 나임을
  alternatives_korean:
  - 내가, 곧 내가 그입니다
  - 내가 바로 그임을
  lexicon: HALOT
  rationale: 히브리어의 중복 대명사 강조를 한국어에서는 ‘바로 나’로 자연스럽게 살렸습니다. ‘그’로 바꾸면 인칭적·자기지시적 강조가 약해져서 피했습니다.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  english_pob_choice: and there is no god beside me
  chosen_korean: 나 외에는 하나님이 없음을
  alternatives_korean:
  - 내 곁에 하나님이 없음을
  - 나와 함께 하나님이 없음을
  lexicon: HALOT
  rationale: עוִם/עִמָּדִי의 동반 의미를 문맥상 배타적 유일성으로 풀어 ‘나 외에는’으로 옮겼습니다. 본문이 다른 신들의 부재를 말하므로 ‘하나님’은 전통을 따라 대문자화하지 않고 일반 명사로 처리했습니다.
- source_word: אָמִית ... וַאֲחַיֶּה ... מָחַצְתִּי ... אֶרְפָּא
  english_pob_choice: I put to death and I make alive; I have wounded, and I will heal
  chosen_korean: 내가 죽이고 내가 살리며, 내가 상하게 하고 내가 고치며
  alternatives_korean:
  - 내가 죽게 하고 내가 살리며, 내가 찌르고 내가 낫게 하며
  - 내가 죽이고 내가 살리고, 내가 짓부수고 내가 고치며
  lexicon: HALOT
  rationale: 동사 대구를 한국어의 병렬 구조로 보존했습니다. מָחַץ의 강한 ‘짓부숨/부서뜨림’ 가능성은 있으나, 여기서는 치유와의 대조가 분명한 ‘상하게 하다’로 과도한 해석을 피했습니다.
- source_word: מִיָּדִי מַצִּיל
  english_pob_choice: who can deliver from my hand
  chosen_korean: 내 손에서 구해낼 자가 없습니다
  alternatives_korean:
  - 내 손에서 건져낼 자가 없습니다
  - 내 손에서 구원할 자가 없습니다
  lexicon: HALOT
  rationale: ‘손’은 권능/지배의 관용구이므로 그대로 두었습니다. מַצִּיל은 ‘deliver/rescue’의 뜻을 살려 ‘구해내다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 배타적 유일성
  chosen_reading: ‘나 외에는 하나님이 없음을’으로 옮겨, 단순한 우위가 아니라 다른 신의 부재를 말하는 배타적 유일성 진술로 읽었습니다.
  alternative_readings:
  - ‘내 곁에 하나님이 없음을’로 더 직역
  - ‘나와 함께 신이 없음을’으로 중립화
  rationale: 문맥은 여호와의 독보적 신적 유일성을 강조하므로, 전통적 완화 없이 본문의 배타성을 드러내야 합니다.
  doctrine_reference: Translation philosophy §3
