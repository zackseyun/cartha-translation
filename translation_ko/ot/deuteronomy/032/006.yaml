source:
  edition: WLC
  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
  footnotes:
  - marker: a
    text: Or 'who created you' or 'who bought you.' The Hebrew verb can mean acquire, possess, buy, or in some contexts create.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석고 지혜 없는 백성아, 너희가 야훼께 이렇게 갚습니까? 그분은 너를 얻으신[a] 네 아버지가 아니십니까? 그분이 너를 만드시고 굳게 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘얻다’, ‘소유하다’, ‘사다’로도, 어떤 문맥에서는 ‘창조하다’로도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  english_pob_choice: repay
  chosen_korean: 보답하다
  alternatives_korean:
  - 갚다
  - 되갚다
  - 되돌려 주다
  lexicon: HALOT
  rationale: 문맥상 여호와께 행한 것을 ‘되돌려 드리는’ 뉘앙스가 핵심이므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘보답하다’로 옮겼습니다.
- source_word: עַם נָבָל וְלֹא חָכָם
  english_pob_choice: O foolish and unwise people
  chosen_korean: 어리석고 무지한 백성들아
  alternatives_korean:
  - 어리석고 지혜 없는 백성들아
  - 미련하고 슬기롭지 못한 백성들아
  lexicon: HALOT
  rationale: נָבָל의 도덕적·언약적 어리석음을 ‘어리석다’로, לֹא חָכָם의 부정 대구를 ‘무지한’으로 살려 직설적 질책을 유지했습니다.
- source_word: קָּנֶךָ
  english_pob_choice: created you / acquired you
  chosen_korean: 너를 얻으신 분
  alternatives_korean:
  - 너를 창조하신 분
  - 너를 사신 분
  - 너를 지니신 분
  lexicon: HALOT
  rationale: קנה는 ‘얻다/획득하다/사다/창조하다’까지 폭이 있어, 뒤의 ‘만드신 분, 세우신 분’과 구별되도록 가장 중립적인 ‘얻으신 분’을 택했습니다.
- source_word: עָשְׂךָ
  english_pob_choice: made you
  chosen_korean: 너를 만드신 분
  alternatives_korean:
  - 너를 지으신 분
  - 너를 조성하신 분
  lexicon: HALOT
  rationale: עשה의 기본적 조성 행위를 한국어의 직접적이고 자연스러운 ‘만드신’으로 옮겼습니다.
- source_word: וַיְכֹנְנֶךָ
  english_pob_choice: established you
  chosen_korean: 너를 세우신 분
  alternatives_korean:
  - 너를 굳게 하신 분
  - 너를 확립하신 분
  - 너를 정하신 분
  lexicon: HALOT
  rationale: כון의 ‘견고하게 세움’의 의미를 현대어에서 가장 간결하게 전달하는 표현은 ‘세우신’입니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: ‘여호와’ 대신 본문 전반의 표준 원칙에 따라 ‘야훼’를 쓰지 않고, 현 문장에서는 출판 가독성을 위해 ‘여호와’로 두지 않고 ‘여호와’에 해당하는 음역을 반영해 ‘여호와’ 대신 본문에서 ‘여호와’ 표기를 쓰지 않도록 조정했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주님
  rationale: 제공된 영어 본문이 고유명사로 Yahweh를 유지하고 있으므로, 한국어 본문에서도 인격적 이름을 드러내는 방향을 따르되, 본 문장에서는 출판용 가독성에 맞춰 문맥상 자연스러운 호칭을 유지하려는 편집 결정을 반영했습니다.
  doctrine_reference: 'Translation philosophy #6 / project default'
- issue: ‘아버지’ 호칭의 존칭 처리
  chosen_reading: ‘그분이 네 아버지가 아니십니까’
  alternative_readings:
  - 그분이 네 아버지가 아니냐
  - 그분이 네 아버지가 아니십니까?
  rationale: 하나님을 직접 가리키는 진술이므로 합쇼체의 존칭 종결을 유지해 경외와 관계성을 함께 살렸습니다.
  doctrine_reference: Korean target style
