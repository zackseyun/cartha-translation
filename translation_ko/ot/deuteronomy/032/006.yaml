revisions:
- from: 이것이 어찌 여호와께 보답하는 일입니까? 어리석고 무지한 백성들아! 그분이 네 아버지가 아니십니까—너를 얻으신 분, 너를 만드신 분, 너를 세우신 분이십니다.[a]
  to: 어리석고 지혜 없는 백성아, 너희가 야훼께 이렇게 갚습니까? 그분은 너를 얻으신[a] 네 아버지가 아니십니까? 그분이 너를 만드시고 굳게 세우셨습니다.
  rationale: 야훼의 고유명사 표기를 회복하고, 수사의문문의 직접적인 질책을 ‘너희가 … 갚습니까?’로 드러냈습니다. 집합적 단수인 ‘백성’에 맞추어 ‘너희’와 ‘너’를 각각 원문의 복수 동사와 단수 접미사의 기능에 따라 유지했습니다. קנה의 선택 번역 ‘얻으신’은 보존하되, 의미 범위 각주를 그 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:03Z'
