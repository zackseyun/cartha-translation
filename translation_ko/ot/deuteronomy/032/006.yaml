  source_fidelity: 개정이 필요합니다. 본문은 יהוה를 고유명사로 유지하므로 ‘야훼’로 옮겨야 합니다. 또한 קָּנֶךָ의 어휘적 대안 주석은 해당 표현에 직접 연결하는 것이 적절합니다. ‘무지한’은 지식 부족을 주로 뜻하므로 לֹא חָכָם의 ‘지혜 없음’에는 ‘지혜 없는’이 더 충실합니다.
  naturalness: ‘어리석고 지혜 없는 백성아, 너희가 야훼께 이렇게 갚습니까?’는 원문의 질책하는 수사의문문을 자연스러운 현대 표준어 합쇼체로 전달합니다. 이어지는 절도 관계절을 과도하게 반복하지 않고 명료하게 구성했습니다.
  terminology: 영어 POB의 Yahweh 및 프로젝트 원칙에 맞추어 ‘야훼’를 사용했습니다. אָבִיךָ는 ‘네 아버지’로, קנה는 문맥상 ‘얻으신’으로 유지하되 창조/사다 등의 대안을 주석으로 보존했습니다.
