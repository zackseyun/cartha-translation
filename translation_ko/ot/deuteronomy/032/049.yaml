  to: 이 아바림 산, 곧 모압 땅 여리고 맞은편에 있는 느보 산으로 올라가십시오. 그리고 내가 이스라엘 자손에게 소유로 주는 가나안 땅을 보십시오.
  rationale: 원문의 명령형과 지리적 관계를 보존하면서, ‘아바림 산’과 ‘느보 산’의 동격을 명시했습니다. 고유지명은 표준 한국어 성서 관행에 따라 한글로 음역했으며, 가나안 땅을 이스라엘 자손에게 소유로 주신다는 현재분사적 표현도 유지했습니다.
