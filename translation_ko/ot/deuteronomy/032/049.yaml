id: DEU.32.49
reference: Deuteronomy 32:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
  footnotes:
  - marker: a
    text: Or 'facing Jericho' or 'over against Jericho.' The Hebrew idiom means geographically opposite or in front of Jericho.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''to the Israelites.'' Hebrew: ''to the sons of Israel.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'as an inheritance.' The Hebrew term denotes a possession or landed holding.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 아바림 산, 곧 모압 땅 여리고 맞은편에 있는 느보 산으로 올라가십시오. 그리고 내가 이스라엘 자손에게 소유로 주는 가나안 땅을 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가십시오
  alternatives_korean:
  - 올라가세요
  - 오르십시오
  lexicon: HALOT
  rationale: 산으로 이동하라는 직접 명령형을 자연스러운 합쇼체로 옮겼습니다.
- source_word: הַר הָעֲבָרִים הַזֶּה
  english_pob_choice: this mountain of the Abarim
  chosen_korean: 이 Abarim의 이 산
  alternatives_korean:
  - 이 아바림 산
  - 아바림의 이 산
  lexicon: HALOT
  rationale: הַר הָעֲבָרִים는 지명으로 보는 것이 적절해 Abarim을 음역하고, 지시어 הַזֶּה를 앞세워 근접성을 살렸습니다.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  english_pob_choice: opposite Jericho
  chosen_korean: 여리고 맞은편에 있습니다
  alternatives_korean:
  - 여리고 앞에 있습니다
  - 여리고를 마주하고 있습니다
  - 여리고 건너편에 있습니다
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 지리적 관용구를 ‘맞은편’으로 옮겨, 단순한 위치가 아니라 대칭적 지형 관계를 드러냈습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: 히브리어의 관용적 집단명칭을 직역하되, 한국어에서 통용되는 성경적 표현인 ‘이스라엘 자손’을 유지했습니다.
- source_word: לַאֲחֻזָּה
  english_pob_choice: as a possession
  chosen_korean: 소유로
  alternatives_korean:
  - 소유로서
  - 기업으로
  - 분깃으로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 단순한 ‘상속’보다 실제로 붙들고 소유하는 땅의 의미가 강하므로, 문맥에 맞게 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: 모압 땅과 가나안 땅의 대비를 어떻게 드러낼지
  chosen_reading: 모세가 약속의 땅을 멀리서 보게 되는 장면으로, 명령형과 지시가 연속되는 문장을 그대로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 설명해 ‘멀리서 바라보십시오’로 정리하는 방식
  - 문장을 더 완만하게 바꾸어 서술형으로 처리하는 방식
  rationale: 본문은 단순한 시각 정보가 아니라, 여호와의 약속과 모세의 마지막 소명 사이를 잇는 서술적 긴장을 담고 있으므로, 명령과 지시 구조를 보존하는 것이 중요합니다.
  doctrine_reference: Deuteronomy 32:49 context; promise-land motif
