  source_fidelity: 핵심 명령, 지리적 위치(모압 땅, 여리고 맞은편), 가나안 땅을 보라는 명령, 그리고 이스라엘 자손에게 소유로 주신다는 내용을 충실히 담고 있습니다. 다만 원문의 동격 구조와 관계절의 수식 범위를 더 분명히 해야 합니다.
