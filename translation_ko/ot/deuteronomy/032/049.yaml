  terminology: ‘이스라엘 자손’, ‘소유’는 각각 בְּנֵי יִשְׂרָאֵל과 אֲחֻזָּה를 무리 없이 반영합니다. ‘네보’는 한국어 성경의 통용 표기인 ‘느보’로 바로잡는 것이 적절합니다. ‘아바림’ 역시 한글로 표기해야 합니다.
  issues:
