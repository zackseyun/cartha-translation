  - severity: low
    issue: ‘네보 산’의 표기
    rationale: 한국어 성경 및 표준적인 성서 지명 표기에서는 일반적으로 ‘느보 산’을 사용합니다.
  - severity: low
    issue: ‘그것은’의 지시 대상
    rationale: 문법적으로 이해할 수는 있으나 산을 가리키는 표현으로 ‘곧 모압 땅 … 있는 느보 산’이라고 관계절을 직접 연결하면 원문의 수식 관계가 더 명료합니다.
  revised_text: 이 아바림 산, 곧 모압 땅 여리고 맞은편에 있는 느보 산으로 올라가십시오. 그리고 내가 이스라엘 자손에게 소유로 주는 가나안 땅을 보십시오.
