  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the hairy heads of the enemy,' or 'from the head of the leaders of the enemy.' The Hebrew phrase is difficult, especially the rare word פַּרְעוֹת.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 화살을 피로 취하게 하고, 내 칼은 살을 삼킬 것입니다 — 죽임당한 자들의 피와 포로들의 피, 원수의 지도자들의 머리에서 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘원수의 머리카락 많은 머리에서’, 혹은 ‘원수의 지도자들의 머리에서’. 히브리어 구절은 특히 희귀어 פַּרְעוֹת 때문에 매우 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  english_pob_choice: I will make drunk
  chosen_korean: 피로 취하게 하고
  alternatives_korean:
  - 피에 흠뻑 적시고
  - 피로 흠뻑 젖게 하고
  lexicon: HALOT
  rationale: 히필형의 ‘술 취하게 하다/취하게 만들다’라는 강한 은유를 살리되, 무기와 결합할 때 자연스러운 한국어로는 ‘피로 취하게 하다’가 가장 가깝습니다.
- source_word: חִצַּי
  english_pob_choice: my arrows
  chosen_korean: 내 화살을
  alternatives_korean:
  - 내 화살들을
  - 내 화살
  lexicon: HALOT
  rationale: 히브리어 복수형과 1인칭 소유격을 직접 반영했습니다.
- source_word: תֹּאכַל בָּשָׂר
  english_pob_choice: will devour flesh
  chosen_korean: 살을 삼킬 것입니다
  alternatives_korean:
