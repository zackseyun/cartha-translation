theological_decisions:
- issue: 난해한 구절 מֵרֹאשׁ פַּרְעוֹת אוֹיֵב의 처리
  chosen_reading: ‘원수의 지도자들의 머리에서’로 매끈하게 읽히게 하되, 본문이 난해한 점은 번역 자체에서 과도하게 단정하지 않았습니다.
  alternative_readings:
  - ‘원수의 머리카락 많은 머리에서’
  - ‘원수의 장수들의 머리에서’
  - ‘원수의 우두머리의 머리에서’
  rationale: 이 문제는 교리보다 어휘·통사상의 난점입니다. 한국어 본문에서는 독자가 이해할 수 있는 전쟁시어로 살리되, 희귀어의 불확실성을 숨기지 않는 방향이 적절합니다.
