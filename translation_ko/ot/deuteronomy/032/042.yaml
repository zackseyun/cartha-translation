translation:
  language: ko
  text: 내 화살을 죽임당한 자들과 포로들의 피로 취하게 하고, 내 칼은 살을 삼킬 것입니다. 그 피는 원수 지도자들의 머리에서부터 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘원수의 머리카락이 풀어진 머리들에서부터’라고 할 수 있습니다. 히브리어 פַּרְעוֹת는 희귀어이며, ‘머리카락이 흩날리는 자들’, ‘지도자들’ 등으로 이해되어 왔습니다.
    reason: lexical_alternative
