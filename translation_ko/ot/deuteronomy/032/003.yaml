  lexicon: HALOT
  rationale: הָבוּ는 인간이 하나님께 무엇을 ‘드러내어 돌리는’ 요청이므로, 단순한 칭찬보다 ‘돌리다’로 상호 방향성을 살렸습니다. גֹדֶל은 ‘위대함’이 가장 직접적입니다.
- source_word: לֵאלֹהֵינוּ
  english_pob_choice: to our God
  chosen_korean: 우리 하나님께
