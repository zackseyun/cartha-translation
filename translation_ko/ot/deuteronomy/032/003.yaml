  naturalness: ‘그것은 내가 ... 때문입니다’는 단독 절로 부자연스럽고 선행 내용을 불필요하게 가리킵니다. ‘내가 ... 선포할 것이니’는 이 구절의 인과적 연결을 자연스러운 현대 합쇼체로 나타냅니다. 또한 각주 표지는 해당 신명 ‘야훼’ 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘야훼’, ‘이름’, ‘선포하다’, ‘우리 하나님’, ‘위대함을 돌리다’는 원문 및 POB의 용어 선택과 일치합니다. 각주는 YHWH라는 히브리어 표기와 전통적 대체 번역을 명확히 밝혀야 합니다.
