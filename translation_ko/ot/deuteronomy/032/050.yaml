translation:
  language: ko
  text: 당신의 형 아론이 호르 산에서 죽어 그의 백성에게로 모인 것처럼, 당신이 올라가는 그 산에서 죽고 당신의 백성에게로 모이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상에게로 모이십시오.’ 히브리어 관용구는 문자적으로 ‘당신의 백성에게로 모이십시오’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  english_pob_choice: and die
  chosen_korean: 그리고 그 산에서 죽으십시오
  alternatives_korean:
  - 그리고 죽으십시오
  - 그 산에서 죽으십시오
  lexicon: HALOT
  rationale: 직접적인 동사 명령/권고를 살리되, 모세에게 향한 신적 명령의 맥락에 맞게 공손한 명령형으로 옮겼습니다.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  english_pob_choice: on the mountain that you are ascending there
  chosen_korean: 당신이 올라가고 있는 그 산에서
  alternatives_korean:
  - 당신이 올라가는 산에서
  - 그 산 위에서
  lexicon: HALOT
  rationale: ‘오르다/올라가다’의 상승 이미지를 유지하되, 한국어에서는 자연스럽게 진행형으로 풀어 현재 진행 중인 상승을 나타냈습니다.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  english_pob_choice: and be gathered to your people
  chosen_korean: 당신의 백성에게로 모이십시오
  alternatives_korean:
  - 당신의 백성에게로 모여지십시오
  - 당신의 백성에게로 거두어지십시오
  - 당신의 조상에게로 모이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면서도 한국어에서는 ‘모이다’로 옮겨 죽음과 공동체적 귀속의 의미를 보존했습니다.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  english_pob_choice: and was gathered to his people
  chosen_korean: 그의 백성에게로 모인 것과 같이 하십시오
  alternatives_korean:
  - 그의 백성에게로 모였던 것처럼 하십시오
  - 그의 조상에게로 모인 것과 같이 하십시오
  lexicon: HALOT
  rationale: 아론에 대한 비교절도 동일한 관용구를 일관되게 유지해 모세와 아론 사이의 어휘적 평행을 드러냈습니다.
theological_decisions:
- issue: 죽음과 ‘백성에게로 모임’의 관용구 처리
  chosen_reading: ‘백성에게로 모이십시오’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘조상에게로 모이십시오’로 해석적으로 옮김
  - ‘죽어 백성 가운데 들어가십시오’로 완화
  rationale: 본문은 단순한 매장 이상을 암시하는 관용구이므로, 그 신학적 여운을 해치지 않기 위해 해석을 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
