revisions:
- from: 그리고 그 산에서 죽으십시오. 당신이 올라가고 있는 그 산에서 죽고, 당신의 백성에게로 모이십시오. 아론 당신의 형이 호르 산에서 죽고 그의 백성에게로 모인 것과 같이 하십시오.[a]
  to: 당신의 형 아론이 호르 산에서 죽어 그의 백성에게로 모인 것처럼, 당신이 올라가는 그 산에서 죽고 당신의 백성에게로 모이십시오.[a]
  rationale: 중복된 첫 문장을 삭제하고, 아론에 관한 비교절을 ‘…것처럼’으로 재구성하여 히브리어의 비교 관계를 자연스럽게 보존했습니다. ‘죽고’와 ‘당신의 백성에게로 모이십시오’의 병렬 명령, 그리고 모세와 아론에게 반복되는 ‘백성에게로 모이다’ 관용구는 유지했습니다.
  reviewer_model: gpt-5.6-terra
