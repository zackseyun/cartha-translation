    rationale: ‘그리고 그 산에서 죽으십시오’ 다음에 ‘당신이 올라가고 있는 그 산에서 죽고’가 이어져, 원문에 없는 동일 명령의 반복이 생겼습니다.
  - severity: medium
    issue: 비교절에 ‘같이 하십시오’를 덧붙임
    rationale: 원문의 כַּאֲשֶׁר는 아론의 죽음과 ‘모임’을 모세에게 주어진 명령과 비교할 뿐입니다. ‘같이 하십시오’는 별도의 수행 명령처럼 들릴 수 있으므로 ‘…것처럼’으로 직접 연결하는 편이 충실합니다.
  - severity: low
