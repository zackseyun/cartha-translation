  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
  footnotes:
  - marker: a
    text: Or 'be gathered to your ancestors.' The Hebrew idiom literally says 'be gathered to your people.'
