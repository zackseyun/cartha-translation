base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
  footnotes:
  - marker: a
    text: Or 'I would blow them away / disperse them.' The Hebrew verb in 'I would scatter them' is rare and difficult, and some understand it as driving them into the corners or removing them from sight.
    reason: lexical_alternative
  - marker: b
    text: Or 'from man' or 'from mortals.' The Hebrew uses a singular collective term for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말하였나니, 내가 그들을 흩어 버리고 사람들 가운데서 그들의 기억을 끊어지게 하리라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 희귀하고 해석이 어려워 '흩어 버리고' 외에 '몰아내고/흩뜨리고'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 사람을 가리키는 표현은 단수 집합명사로서 '사람들 가운데서'뿐 아니라 '사람에게서/인류에서'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 내가 말하였나니
  alternatives_korean:
  - 내가 말하였습니다
  - 내가 선언하였습니다
  lexicon: HALOT
  rationale: 시의적 문맥에서 야훼의 결의된 발화를 자연스럽게 드러내면서도, 단순한 정보 전달보다 선포의 뉘앙스를 살리기 위해 '말하였나니'를 택했습니다.
- source_word: אַפְאֵיהֶם
  english_pob_choice: I would scatter them
  chosen_korean: 내가 그들을 흩어 버리고
  alternatives_korean:
  - 내가 그들을 흩뜨리고
  - 내가 그들을 흩어 놓고
  - 내가 그들을 몰아내고
  lexicon: HALOT
  rationale: 희귀한 동사로서 영어 POB가 지적한 대로 'scatter/disperse' 계열의 의미가 핵심이므로, 한국어에서는 결과를 분명히 보이는 '흩어 버리고'로 옮겼습니다.
- source_word: מֵאֱנוֹשׁ
  english_pob_choice: from mankind
  chosen_korean: 사람들 가운데서
  alternatives_korean:
  - 인류 가운데서
  - 사람에게서
  - 죽을 인간들 가운데서
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 집합적·인간적 범위를 살리되, 한국어에서 너무 직역적인 'from mankind'보다 자연스럽게 '사람들 가운데서'로 표현했습니다.
- source_word: זִכְרָם
  english_pob_choice: their memory
  chosen_korean: 그들의 기억을 끊어지게 하리라
  alternatives_korean:
  - 그들의 기억을 사라지게 하리라
  - 그들에 대한 기억을 끊어지게 하리라
  - 그들의 기억을 없애 버리리라
  lexicon: HALOT
  rationale: זכר의 '기억/기억됨'을 직접 반영하되, 단순 소멸보다 기억의 지속이 끊기는 이미지를 살리기 위해 '끊어지게 하리라'로 옮겼습니다.
theological_decisions:
- issue: 미래형 선언의 성격
  chosen_reading: 예언적 확정 의지를 드러내는 화법으로 읽어 '하리라'를 사용했습니다.
  alternative_readings:
  - 단순 과거 회상으로 '나는 말하였다'로 처리
  - 직설 미래로 '내가 흩어 버리겠다'로 처리
  rationale: 히브리어 시문맥에서 이는 이미 선포된 결의이므로, 영어 POB의 'I would'처럼 확정된 의도를 유지하면서도 한국어에서는 문장 종결을 자연스럽게 구성했습니다.
  doctrine_reference: 예언적 담화의 의지적 미래(공의로운 심판 선언)
