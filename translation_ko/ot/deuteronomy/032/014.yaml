translation:
  language: ko
  text: 소 떼에서 나온 엉긴 젖과 양 떼의 젖, 어린양들과 바산에서 난 수양들과 숫염소들의 기름, 그리고 가장 좋은 밀을 먹었으며, 포도의 피인 거품 이는 포도주를 마셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘밀의 콩팥의 기름’입니다. 이는 가장 좋고 풍성한 밀을 가리키는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘붉은 포도주’로 옮길 수 있습니다. 히브리어는 진하게 발효되어 거품 이는 포도주를 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  english_pob_choice: curds from the herd
  chosen_korean: 소 떼의 굵은 우유
  alternatives_korean:
