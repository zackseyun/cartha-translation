  source_fidelity: 현 초안은 חֶמְאַת בָּקָר를 ‘굵은 우유’로 옮겨 자연스럽지 않고 ‘응고유/엉긴 젖’이라는 유제품의 의미를 충분히 나타내지 못합니다. 또한 열거된 음식과 포도주를 별개의 문장으로 나누어 ‘포도주가 거품쳤습니다’라고 한 것은 תִּשְׁתֶּה(‘당신이 마셨습니다’)의 주어와 구문을 바꾸었습니다. 포도 피와 거품 이는 포도주는 마신 대상입니다.
  naturalness: ‘소 떼의 굵은 우유’와 ‘포도주가 거품쳤습니다’는 현대 표준 한국어 성경 문체로 부자연스럽습니다. 음식 열거를 ‘먹었으며’로, 마지막 대상을 ‘포도의 피인 거품 이는 포도주’로 연결하면 합쇼체의 자연스러운 완결 문장이 됩니다.
