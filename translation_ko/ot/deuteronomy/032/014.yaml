  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the fat of the kidneys of wheat,' an idiom for the finest or richest wheat.
    reason: lexical_alternative
  - marker: b
    text: Or 'red wine'; the Hebrew term may evoke richly fermented or foaming wine.
    reason: lexical_alternative
translation:
  language: ko
  text: 소 떼의 굵은 우유와 양 떼의 젖, 어린 양들의 기름과 바산의 수양들, 염소들, 그리고 밀의 기름기와 포도 피를 마셨습니다. 포도주가 거품쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 ‘밀의 콩팥의 기름기’에 해당하며, 곧 가장 좋은 밀을 가리킵니다.
    reason: source_note
  - marker: b
    text: 또는 ‘붉은 포도주’일 수 있습니다. 히브리어는 발효하며 거품 이는 포도주를 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  english_pob_choice: curds from the herd
  chosen_korean: 소 떼의 굵은 우유
  alternatives_korean:
  - 응고한 우유
  - 버터
  lexicon: HALOT
  rationale: 문맥상 현대적 ‘버터’보다, 젖 제품의 진한 질감을 살리는 ‘굵은 우유’가 더 자연스럽고 원의 이미지에 가깝습니다.
- source_word: חֲלֵב צֹאן
  english_pob_choice: milk from the flock
  chosen_korean: 양 떼의 젖
  alternatives_korean:
  - 양의 젖
  - 목장의 젖
  lexicon: HALOT
  rationale: צֹאן은 작은 가축의 집합명사이므로, 집합성을 살린 ‘양 떼의 젖’이 원문 구조를 잘 반영합니다.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  english_pob_choice: the fat of the kidneys of wheat
  chosen_korean: 밀의 기름기
  alternatives_korean:
  - 밀의 콩팥 기름
  - 밀의 가장 좋은 알곡
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 난해하므로, POB의 본뜻인 최상급·풍부함을 살려 ‘밀의 기름기’로 옮겼습니다.
- source_word: דַם עֵנָב / חָמֶר
  english_pob_choice: the blood of grapes / foaming wine
  chosen_korean: 포도 피를 마셨습니다. 포도주가 거품쳤습니다.
  alternatives_korean:
  - 포도의 피를 마셨습니다. 거품 이는 포도주를 마셨습니다.
  - 포도즙을 마셨습니다.
  lexicon: HALOT
  rationale: ‘포도 피’는 히브리 시어의 강한 비유를 보존하며, ‘거품쳤습니다’는 חָמֶר의 발효·거품 이미지를 살립니다.
theological_decisions:
- issue: 풍요의 이미지 처리
  chosen_reading: 구체적인 목축·농산·음료의 풍요를 그대로 제시했습니다.
  alternative_readings:
  - 축복이나 번영을 추상화한 표현
  - 의미를 풀어 쓴 해설적 번역
  rationale: 이 절은 하나님의 공급을 사물의 열거로 보여 주므로, 비유를 추상화하지 않고 원문의 물질적 풍요 이미지를 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 원어 우선, 시적 이미지 보존
