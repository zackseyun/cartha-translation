    rationale: 현행 본문은 ‘뒤틀린 세대’인데 각주도 ‘뒤틀린 세대’를 대안으로 제시합니다. 각주의 내용과 앵커를 각각 해당 히브리어 어구에 맞추어야 독자가 본문과 대안을 정확히 연결할 수 있습니다.
  - severity: low
    issue: ‘뒤틀린 세대’는 현대 한국어에서 도덕적 패역·왜곡이라는 문맥적 의미가 다소 덜 분명할 수 있습니다.
