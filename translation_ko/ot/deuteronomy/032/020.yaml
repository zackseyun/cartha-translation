  rationale: 히브리어의 ‘얼굴을 숨기다’와 ‘끝’을 유지했습니다. 도덕적 왜곡을 가리키는 דּוֹר תַּהְפֻּכֹת는 현대 한국어에서 더 분명한 ‘비뚤어진 세대’로 옮기고, 복수형의 강조는 각주로 보완했습니다. ‘자녀들’과 ‘신실함이 없는’의 수식 관계를 직접 연결했으며, 모든 어휘 대안 각주를 해당 본문 어구에 배치했습니다.
