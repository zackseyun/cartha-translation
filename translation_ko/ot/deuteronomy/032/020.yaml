base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
  footnotes:
  - marker: a
    text: Or “a perverse generation.” The Hebrew phrase is literally “a generation of perversions/crookednesses.”
    reason: lexical_alternative
  - marker: b
    text: Or “children in whom there is no trustworthiness” or “no fidelity.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다[a]. “나는 그들에게서 내 얼굴을 숨기고, 그들의 끝이 어떻게 될지 보겠습니다. 그들은 뒤틀린 세대[b]이며, 그들 안에는 신실함이 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 말했다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “뒤틀린 세대”를 “비뚤어진 세대”로 옮길 수 있습니다. 히브리어는 문자적으로 “뒤틀림들의 세대”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그가 이르셨습니다
  lexicon: WLC
  rationale: 서술문을 현대 합쇼체로 자연스럽게 옮기되, 이 절이 하나님의 선언을 담고 있으므로 ‘말씀하셨습니다’를 택해 격식을 유지했습니다.
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  english_pob_choice: I will hide my face from them
  chosen_korean: 나는 그들에게서 내 얼굴을 숨기고
  alternatives_korean:
  - 나는 그들에게서 내 얼굴을 가리고
  - 나는 그들에게서 나 자신을 숨기고
  lexicon: HALOT
  rationale: ‘얼굴을 숨기다’라는 관용구를 살려, 단순한 부재가 아니라 은총과 임재의 철회를 드러내도록 했습니다.
- source_word: דּוֹר תַּהְפֻּכֹת
  english_pob_choice: a perverse generation
  chosen_korean: 뒤틀린 세대
  alternatives_korean:
  - 타락한 세대
  - 비뚤어진 세대
  - 뒤바뀐 세대
  lexicon: HALOT
  rationale: 명사적 뉘앙스와 도덕적 왜곡을 함께 살리기 위해, 평이하지만 강한 ‘뒤틀린 세대’를 택했습니다.
- source_word: לֹא אֵמֻן בָּם
  english_pob_choice: in whom there is no faithfulness
  chosen_korean: 그들 안에는 신실함이 없습니다
  alternatives_korean:
  - 그들 안에는 신뢰성이 없습니다
  - 그들 안에는 충실함이 없습니다
  - 그들 안에는 믿을 만함이 없습니다
  lexicon: HALOT
  rationale: 언약적 신뢰성의 결핍을 나타내는 표현으로 ‘신실함’이 가장 간결하면서도 신학적 무게를 잘 담습니다.
theological_decisions:
- issue: ‘내 얼굴을 숨기다’의 관용구 처리
  chosen_reading: 관용구를 그대로 유지해, 하나님이 은총과 돌봄의 표정을 거두시는 언약적 의미를 드러내도록 했습니다.
  alternative_readings:
  - 그들에게서 돌아서겠습니다
  - 그들을 외면하겠습니다
  rationale: 히브리어 표현을 도덕적 감정표현으로만 약화시키지 않고, 신명기의 언약적 경고로 읽히게 하기 위해 직역적 이미지를 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning and theological tension; do not flatten covenant idiom.'
