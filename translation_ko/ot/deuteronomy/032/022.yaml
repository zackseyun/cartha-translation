  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
  footnotes:
  - marker: a
    text: Or 'to the lowest Sheol' or 'to the depths of the grave.' The Hebrew reads 'to Sheol, the lowest/deepest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 분노에 불이 붙어, 스올의 깊은 곳까지 타오르고, 땅과 그 소산을 삼키며, 산들의 기초를 불살라 버리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올의 가장 낮은 곳’ 혹은 ‘무덤의 깊은 곳’으로 옮길 수 있습니다. 히브리어는 ‘스올, 가장 낮은/가장 깊은 곳’입니다.
    reason: lexical_alternative
lexical_decisions:
