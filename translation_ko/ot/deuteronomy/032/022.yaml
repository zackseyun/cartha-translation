  rationale: 강한 파괴성을 드러내는 사역적 뉘앙스를 살려, 산들의 기초에까지 미치는 심판의 이미지를 분명히 합니다.
theological_decisions:
- issue: שְׁאוֹל의 번역
  chosen_reading: 스올로 음역하여 ‘스올의 깊은 곳’으로 옮겼습니다.
  alternative_readings:
  - 무덤
  - 지하 세계
  - 음부
  rationale: 본문은 죽은 자의 영역을 말하지만, 후대적 ‘지옥’ 개념으로 축소하지 않기 위해 고유 개념을 보존합니다.
  doctrine_reference: 원어 우선 원칙; 구약의 사후 세계 개념을 신학적으로 조기 해석하지 않음
