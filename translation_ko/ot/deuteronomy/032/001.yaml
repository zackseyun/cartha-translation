  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
  footnotes:
  - marker: a
    text: Or 'Listen, O heavens ... and may the earth hear.' The Hebrew uses elevated poetic forms of command and appeal.
