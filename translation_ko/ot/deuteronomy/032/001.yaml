  - 귀담아 들으십시오
  lexicon: HALOT
  rationale: 청각적 수용보다 주의 깊은 경청을 요구하는 시적 명령으로 보아, 현대 한국어에서도 격식을 살리면서 강도가 살아 있는 표현을 택했습니다.
- source_word: הַשָּׁמַיִם
