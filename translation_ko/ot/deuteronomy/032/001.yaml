  lexicon: HALOT
  rationale: 천지를 증인처럼 부르는 시적 호격을 살리기 위해 호격 조사 -아를 붙였고, שָׁמַיִם의 복수성을 반영해 복수형을 유지했습니다.
- source_word: וַאֲדַבֵּרָה
  english_pob_choice: and I will speak
  chosen_korean: 내가 말하겠습니다
  alternatives_korean:
  - 내가 말하리라
  - 말하겠습니다
  lexicon: HALOT
  rationale: 화자의 의지와 전개를 나타내는 cohortative를 자연스러운 미래·의지형으로 옮겨, 다음 절과의 병렬을 살렸습니다.
- source_word: אִמְרֵי פִי
  english_pob_choice: the words of my mouth
  chosen_korean: 내 입의 말
  alternatives_korean:
  - 내 입의 말씀
  - 내가 하는 말
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 '입의 말'을 보존하되, 한국어에서는 소유격 순서를 자연스럽게 바꾸어 간결하게 옮겼습니다.
theological_decisions:
- issue: 하늘과 땅에 대한 호격의 기능
  chosen_reading: 우주적 증인을 부르는 시적 소환으로 이해하고 그대로 유지했습니다.
  alternative_readings:
  - 단순한 수사적 도입으로 약화하여 번역
  rationale: 신명기 32장의 선언문맥에서 하늘과 땅은 언약적 증인 역할을 하므로, 그 장중함이 한국어 본문에서도 보이도록 했습니다.
  doctrine_reference: 언약 증언 모티프
- issue: 제1인칭 화자의 직접 발화 유지
  chosen_reading: '''내가 말하겠습니다''로 화자의 의도와 직접성을 유지했습니다.'
  alternative_readings:
  - '''내가 말할 것입니다''처럼 완화'
  rationale: 시적 선언의 긴박한 발화성을 흐리지 않기 위해, 본문이 가진 즉시성을 살린 합쇼체를 사용했습니다.
  doctrine_reference: 문학적-수사적 충실성
