lexical_decisions:
- source_word: ל֥וּ
  english_pob_choice: If only
  chosen_korean: 아, ...더라면
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 희망적·애석적 뉘앙스를 가진 표현으로, 현대 한국어에서는 감탄형 구조를 써서 원문의 염원/탄식의 힘을 살리는 것이 자연스럽습니다.
- source_word: חָכְמ֖וּ
  english_pob_choice: they were wise
  chosen_korean: 그들이 지혜로웠더라면
  alternatives_korean:
  - 그들이 지혜가 있었다면
  - 그들이 지혜를 가졌다면
  lexicon: HALOT
  rationale: חכם의 상태를 조건절로 옮겨, 단순한 지식이 아니라 분별 있는 삶의 상태를 가리키는 점을 살렸습니다.
- source_word: יַשְׂכִּ֣ילוּ
  english_pob_choice: they would understand
  chosen_korean: 이 일을 깨달았을 것입니다
  alternatives_korean:
  - 이것을 이해했을 것입니다
  - 분별했을 것입니다
  lexicon: HALOT
  rationale: 직전의 '지혜로움'과 구분되도록 인지·통찰의 결과를 '깨닫다'로 옮겼고, זֹאת의 지시 대상을 한국어에서 자연스럽게 풀었습니다.
- source_word: לְאַחֲרִיתָֽ/ם
  english_pob_choice: their end
  chosen_korean: 자기들의 끝
  alternatives_korean:
  - 그들의 마지막
  - 그들의 결국
  - 그들의 미래
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 시간적 미래보다 결과와 종결을 함께 담을 수 있어, 경고의 뉘앙스를 살리는 '끝'이 가장 간결합니다.
theological_decisions:
- issue: לְאַחֲרִיתָם의 범위
  chosen_reading: 자기들의 끝은 심판적 결말과 그 결과를 함께 시사합니다.
  alternative_readings:
  - 단순한 미래
  - 마지막 시기
  rationale: 문맥상 이 표현은 중립적 미래가 아니라, 어리석음의 귀결을 성찰하라는 경고로 기능하므로 '끝'을 택하되 심판적 함의를 지우지 않았습니다.
  doctrine_reference: 신명기 32장의 언약적 경고와 보응의 주제
- issue: 첫 절의 문체
  chosen_reading: 탄식형 도입을 사용해 원문의 애석함을 드러냈습니다.
  alternative_readings:
  - 만일 그들이 지혜로웠다면
  - 그들이 지혜로웠다면
  rationale: לּוּ의 optative force는 단순 조건문보다 애석한 바람을 담으므로, 한국어에서도 감탄성 도입으로 원문의 정서를 보존했습니다.
  doctrine_reference: 성경 시가의 수사적·정서적 평행법
