id: DEU.32.31
reference: Deuteronomy 32:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י לֹ֥א כְ/צוּרֵ֖/נוּ צוּרָ֑/ם וְ/אֹיְבֵ֖י/נוּ פְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
  footnotes:
  - marker: a
    text: Or 'their Rock is not like our rock, and even our enemies are judges.' The Hebrew noun פְּלִילִים is literally 'judges/arbiters,' giving the line a forensic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 반석이 우리 반석과 같지 않고, 우리 원수들이 판관들이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘판관들’은 문자적으로 재판관 또는 중재자들을 뜻합니다. 이 표현은 원수들마저 이 사실을 판정한다는 법정적 비유로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  english_pob_choice: Rock
  chosen_korean: 바위
  alternatives_korean:
  - 반석
  - 바위산
  lexicon: HALOT
  rationale: 히브리어 צוּר는 문자적으로 ‘바위’이지만 여기서는 야훼를 가리키는 비유적 호칭입니다. 한국어에서는 전통적 교회어 ‘반석’보다 원문의 은유를 직접 살리는 ‘바위’가 대조 구조를 더 분명히 드러냅니다.
- source_word: צוּרָם
  english_pob_choice: their rock
  chosen_korean: 그들의 바위
  alternatives_korean:
  - 그들의 반석
  lexicon: HALOT
  rationale: 같은 어근을 반복해 이스라엘의 바위와 이방들의 바위를 대비시키는 말장난을 살리기 위해, 첫 절과 동일한 ‘바위’를 사용했습니다.
- source_word: פְּלִילִים
  english_pob_choice: judges
  chosen_korean: 판관들입니다
  alternatives_korean:
  - 재판관들입니다
  - 심판자들입니다
  lexicon: HALOT
  rationale: פְּלִילִים는 ‘판결하는 자들, 재판관들’의 법정적 의미를 가지므로, 단순히 ‘판사’보다 문맥의 공적·사법적 뉘앙스를 살리는 ‘판관들’이 적절합니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  lexicon: HALOT
  rationale: 히브리어 접속사는 단순한 연결이지만, 한국어에서는 두 진술을 병렬로 매끄럽게 잇는 ‘그리고’가 자연스럽습니다.
theological_decisions:
- issue: צוּר를 지칭하는 신적 호칭을 한국어에서 어떻게 보존할지
  chosen_reading: ‘바위’를 유지해 비유적 호칭과 대조를 그대로 드러냈습니다.
  alternative_readings:
  - 반석
  - 보호자
  - 피난처
  rationale: 원문은 동일한 명사를 하나님과 우상적 신뢰 대상 모두에 적용해 강한 대조를 만듭니다. 설명어로 바꾸면 이 긴장이 약해지므로, 은유를 보존하는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: 원문 우선, 신학적 긴장 보존'
- issue: וְאֹיְבֵינוּ פְּלִילִים의 법정적 의미를 문장으로 어떻게 표현할지
  chosen_reading: ‘우리의 원수들은 판관들입니다’로 직역해 판결/판정의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 우리의 원수들조차 판결합니다
  - 우리의 원수들까지도 판결자입니다
  rationale: 영문 POB의 ‘are judges’는 פְּלִילִים의 명사적·법정적 의미를 보존하려는 선택입니다. 한국어에서도 동사화해 풀기보다 명사 ‘판관들’로 옮겨, 원수가 오히려 증인처럼 판결을 내리는 역설을 유지했습니다.
  doctrine_reference: 원문 의미 우선, 법정적 은유 보존
