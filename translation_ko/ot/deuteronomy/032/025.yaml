  text: מִ/חוּץ֙ תְּשַׁכֶּל חֶ֔רֶב וּ/מֵ/חֲדָרִ֖ים אֵימָ֑ה גַּם בָּחוּר֙ גַּם בְּתוּלָ֔ה יוֹנֵ֖ק עִם אִ֥ישׁ שֵׂיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
  footnotes:
  - marker: a
    text: Or 'and from the chambers, dread'; the Hebrew contrasts danger outside with terror within.
    reason: lexical_alternative
  - marker: b
    text: '''Virgin'' renders Hebrew bethulah, a term for a young unmarried woman, often with the implication of virginity; ''young woman'' is a possible alternative in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밖에서는 칼이 사람을 자식 잃게 하고, 안쪽 방들에서는 공포가 덮칩니다—젊은 남자도, 처녀도, 젖먹이도, 백발 노인도 함께입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밖에서는’은 히브리어의 공간 대조를 살린 번역입니다. 다른 가능성으로는 ‘밖으로부터’ 또는 ‘바깥에서는’이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘처녀’는 히브리어 bethulah의 구체성을 살린 번역입니다. 문맥상 ‘젊은 여자’로 완화해 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  english_pob_choice: Outside
  chosen_korean: 밖에서는
  alternatives_korean:
  - 바깥에서는
  - 밖으로는
  lexicon: HALOT
  rationale: 안쪽 방들과의 대조를 살리기 위해 장소 부사를 간결하게 옮겼습니다.
- source_word: תְּשַׁכֶּל
  english_pob_choice: will bereave
  chosen_korean: 사람을 자식 잃게 하고
  alternatives_korean:
  - 자식을 잃게 하고
  - 자식 잃은 자를 만들고
  lexicon: HALOT
  rationale: 동사 자체의 ‘자식 잃음/애끊는 상실’ 의미를 살리되, 한국어에서는 주어인 칼이 사람을 그런 상태로 만든다는 식으로 자연스럽게 옮겼습니다.
- source_word: וּ/מֵ/חֲדָרִ֖ים אֵימָ֑ה
  english_pob_choice: and in the inner rooms, terror
  chosen_korean: 안쪽 방들에서는 공포가 덮입니다
  alternatives_korean:
  - 안쪽 방들에는 공포가 있습니다
  - 방들로부터 공포가 옵니다
  lexicon: HALOT
  rationale: חדרים을 ‘방들’로 옮기고, 병렬되는 위협의 상황을 살리기 위해 공포가 그 공간을 덮는 표현을 택했습니다.
- source_word: בְּתוּלָה
  english_pob_choice: virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 젊은 여자
  lexicon: HALOT
  rationale: 히브리어의 미혼 젊은 여성을 가리키는 구체성을 유지하면서, 한국어에서 과도하게 교회적이거나 설명적인 표현은 피했습니다.
theological_decisions:
- issue: 전쟁과 심판의 총체성
  chosen_reading: 연령과 성별을 가리지 않고 집 안팎 전체를 휩쓰는 재난으로 읽었습니다.
  alternative_readings:
  - 단순한 전쟁 묘사로만 읽기
  - 개별 가족의 슬픔을 강조하기
  rationale: 문맥상 칼과 공포가 ‘밖’과 ‘안쪽 방들’을 모두 덮으며, 젊은 남자·처녀·젖먹이·백발 노인까지 포함하는 총체적 심판을 강조합니다.
  doctrine_reference: 신명기 32장의 언약적 심판 문맥
