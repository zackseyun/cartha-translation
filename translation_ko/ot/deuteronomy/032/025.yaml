  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
  footnotes:
  - marker: a
    text: Or 'and from the chambers, dread'; the Hebrew contrasts danger outside with terror within.
    reason: lexical_alternative
  - marker: b
    text: '''Virgin'' renders Hebrew bethulah, a term for a young unmarried woman, often with the implication of virginity; ''young woman'' is a possible alternative in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밖에서는 칼이 사람들을 자식 잃게 하고, 방 안에서는 공포가 엄습합니다—젊은 남자와 처녀, 젖먹이와 백발의 노인도 예외가 아닙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밖에서는’은 히브리어가 ‘방 안에서’와 이루는 공간 대조를 살린 번역입니다. ‘바깥에서는’ 또는 문맥에 따라 ‘밖으로부터’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘처녀’는 히브리어 bethulah를 옮긴 말로, 일반적으로 미혼의 젊은 여자를 가리키며 처녀성의 함의를 지닐 수 있습니다. ‘젊은 여자’로 옮길 수도 있습니다.
    reason: lexical_alternative
