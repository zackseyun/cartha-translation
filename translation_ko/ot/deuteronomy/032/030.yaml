  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
  footnotes:
  - marker: a
    text: Or 'had delivered them over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떻게 한 사람이 천 명을 뒤쫓고, 두 사람이 만 명을 도망치게 할 수 있겠습니까? 그들의 반석이 그들을 팔아넘기지 않았고, 야훼께서 그들을 넘겨주지 않으셨다면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘넘겨주지 않으셨다면’은 히브리어 הִסְגִּירָם의 사역적 뜻을 살린 번역입니다. ‘팔아넘기지’와 함께 심판으로 인한 인도/인계의 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How could
  chosen_korean: 어떻게 … 할 수 있겠습니까?
  alternatives_korean:
  - 어떻게 …입니까?
  - 어찌 …할 수 있겠습니까?
  lexicon: HALOT
  rationale: 놀라움이 섞인 수사적 질문이므로, 단순한 물음보다 가능성을 묻는 형식으로 옮겨 원문의 불가해함을 살렸습니다.
- source_word: יִרְדֹּף אֶחָד אֶלֶף
  english_pob_choice: one pursue a thousand
  chosen_korean: 한 사람이 천 명을 뒤쫓고
  alternatives_korean:
  - 한 사람이 천 명을 추격하고
  - 한 사람이 천 명을 쫓고
  lexicon: HALOT
  rationale: רדף의 기본 뜻을 살리되, 군사적 대조가 분명하게 드러나도록 한국어에서 자연스러운 ‘뒤쫓다’를 택했습니다.
- source_word: יָנִיסוּ רְבָבָה
  english_pob_choice: put ten thousand to flight
  chosen_korean: 두 사람이 만 명을 도망치게 할 수 있겠습니까
  alternatives_korean:
  - 두 사람이 만 명을 달아나게 할 수 있겠습니까
  - 두 사람이 만 명을 패주하게 할 수 있겠습니까
  lexicon: HALOT
  rationale: הִפְעִיל의 사역성을 반영해 ‘도망치게 하다’로 옮겼고, ‘만 명’으로 수량 대조를 현대 한국어에서 분명하게 유지했습니다.
- source_word: מְכָרָם / הִסְגִּירָם
  english_pob_choice: had sold them / had given them up
  chosen_korean: 그들을 팔아넘기지 않았고, … 그들을 넘겨주지 않으셨다면
  alternatives_korean:
  - 그들을 팔지 않으셨고, … 그들을 내주지 않으셨다면
  - 그들을 넘겨 팔지 않으셨고, … 그들을 넘기지 않으셨다면
  lexicon: HALOT
  rationale: מכר와 סגר의 심판적 용례를 따라 단순한 ‘버리다’보다 강한 ‘팔아넘기다 / 넘겨주다’를 써서 언약적 배신과 처분의 뉘앙스를 보존했습니다.
- source_word: צוּר
  english_pob_choice: their Rock
  chosen_korean: 그들의 반석
  alternatives_korean:
  - 그들의 바위
  - 그들의 견고한 반석
  lexicon: HALOT
  rationale: 신학적 칭호이면서도 이미지가 핵심이므로, 전통적이지만 의미를 보존하는 ‘반석’을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문의 고유한 언약명을 보존하기 위해 본문에서는 ‘야훼’로 옮겼습니다. 이는 ‘the LORD’로 완화하지 않고 히브리어 표지를 드러내려는 프로젝트 기본 방침에 따릅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה / YHWH → 야훼
- issue: צוּר의 신학적 지위
  chosen_reading: 그들의 반석
  alternative_readings:
  - 그들의 반석이신 분
  - 그들의 바위
  rationale: 여기서 ‘반석’은 단순한 암석이 아니라 이스라엘의 하나님을 가리키는 비유적 칭호이므로, 대문자화 대신 한국어 의미를 유지하되 문맥상 신적 호칭으로 읽히게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
