revisions:
- from: 어떻게 한 사람이 천 명을 뒤쫓고, 두 사람이 만 명을 도망치게 할 수 있겠습니까? 그들의 반석이 그들을 팔아넘기지 않았고, 야훼께서 그들을 넘겨주지 않으셨다면 말입니다.[a]
  to: 어떻게 한 사람이 천 명을 뒤쫓고, 두 사람이 만 명을 도망치게 할 수 있겠습니까? 그들의 반석이 그들을 팔아넘기셨고 야훼께서 그들을 넘겨주셨기 때문이 아니라면 말입니다.[a]
  rationale: 수사 의문문의 본문 전반은 유지하되, אִם לֹא כִּי의 조건적·설명적 기능을 한국어의 ‘…기 때문이 아니라면’으로 명확히 반영했습니다. 또한 ‘반석’을 가리키는 동사에 높임을 적용하여 야훼와 병렬을 이루는 신적 주어를 자연스럽게 드러냈습니다. 각주는 הִסְגִּירָם의 문맥상 가능한 대안인 ‘인계하다’를 간결하게 보존합니다.
  reviewer_model: gpt-5.6-terra
