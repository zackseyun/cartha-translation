  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
  footnotes:
  - marker: a
    text: Or 'high places of the earth.' Here the phrase likely refers to elevated, fruitful terrain rather than cultic 'high places.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the yield of the field.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he nursed him on honey from the rock.' The Hebrew verb is literally 'made him suck.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그를 땅의 높은 곳들로 올라타게 하셨습니다[a]. 그가 들의 소산을 먹게 하셨고[b], 바위에서 꿀을 빨게 하셨으며[c], 굳은 바위에서 기름을 빨게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 높은 곳들’입니다. 여기서는 우상 숭배의 ‘산당’이라기보다 높고 비옥한 지형을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들의 산출물’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그를 바위의 꿀로 젖먹이셨습니다.’ 히브리어 동사는 문자적으로 ‘빨게 하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  english_pob_choice: He made him ride
  chosen_korean: 그를 … 올라타게 하셨습니다
  alternatives_korean:
  - 그를 … 타게 하셨습니다
  - 그를 … 태우셨습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미인 ‘타게 하다/올라타게 하다’를 살리되, 한국어에서 자연스럽고 시적 맥락에 맞게 표현했습니다.
- source_word: עַל במותי אָרֶץ
  english_pob_choice: on the heights of the land
  chosen_korean: 땅의 높은 곳들
  alternatives_korean:
  - 땅의 높은 곳에서
  - 땅의 산릉들
  lexicon: HALOT
  rationale: במות는 문자적으로 ‘높은 곳들’이므로, 우상 숭배의 ‘산당’으로 고정하지 않고 지형적·시적 의미를 살려 옮겼습니다.
- source_word: תְּנוּבֹת שָׂדָי
  english_pob_choice: the produce of the field
  chosen_korean: 들의 소산
  alternatives_korean:
  - 밭의 소산
  - 들판의 산물
  lexicon: HALOT
  rationale: תנובות는 ‘소산/산출물’의 뜻이므로 ‘소산’으로 옮겼고, 히브리어 단수 집합을 살려 ‘들’을 썼습니다.
- source_word: וַיֵּנִקֵהוּ דְבַשׁ
  english_pob_choice: he made him suck honey
  chosen_korean: 바위에서 꿀을 빨게 하셨으며
  alternatives_korean:
  - 바위에서 꿀을 먹이셨으며
  - 바위의 꿀을 빨게 하셨으며
  lexicon: HALOT
  rationale: ינק의 핵심은 ‘빨게 하다/젖먹이다’이므로, 풍부한 공급을 받는 이미지를 유지하기 위해 ‘빨게 하다’를 사용했습니다.
- source_word: מִסֶּלַע ... מֵחַלְמִישׁ צוּר
  english_pob_choice: from the rock ... from the flinty rock
  chosen_korean: 바위 ... 굳은 바위
  alternatives_korean:
  - 바위 ... 부싯돌 바위
  - 반석 ... 부싯돌 같은 바위
  lexicon: HALOT
  rationale: סלע와 צור을 모두 ‘바위’ 계열로 유지하되, חלמיש의 강도·단단함을 ‘굳은’으로 반영해 과장된 풍요의 역설을 살렸습니다.
theological_decisions:
- issue: 대상 지시를 본문에서 명시할지 여부
  chosen_reading: 히브리어의 3인칭 대명사 흐름을 유지해 본문에서는 ‘그’로 두었습니다.
  alternative_readings:
  - 주어를 ‘주님’으로, 목적어를 ‘이스라엘’로 명시함
  - 주석 없이 대상명사를 본문에 삽입함
  rationale: 문맥은 대상을 분명히 하지만, 본문은 의도적으로 대명사로 전개되므로 이를 유지하는 편이 원문 흐름을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
