  lexicon: HALOT
  rationale: 히필의 사역적 의미인 ‘타게 하다/올라타게 하다’를 살리되, 한국어에서 자연스럽고 시적 맥락에 맞게 표현했습니다.
- source_word: עַל במותי אָרֶץ
  english_pob_choice: on the heights of the land
  chosen_korean: 땅의 높은 곳들
  alternatives_korean:
