translation:
  language: ko
  text: 그는 그를 땅의 높은 지대들을 타고 다니게 하셨습니다[a]. 그는 들의 소산을 먹었습니다[b]. 그는 그에게 바위에서 나는 꿀을 빨게 하셨으며[c], 부싯돌처럼 단단한 바위에서 나는 기름을 빨게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 높은 곳들’입니다. 여기서는 우상 숭배의 ‘산당’이라기보다 높고 비옥한 지형을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들의 산출물’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게 바위에서 나는 꿀을 젖먹이셨습니다.’ 히브리어 동사는 문자적으로 ‘빨게 하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  english_pob_choice: He made him ride
  chosen_korean: 그를 … 올라타게 하셨습니다
