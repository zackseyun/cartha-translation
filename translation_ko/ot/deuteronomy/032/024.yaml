  source_fidelity: 개정이 필요합니다. 원문의 עִם חֲמַת זֹחֲלֵי עָפָר는 ‘짐승들의 이빨’을 보내는 행위에 동반되는 재앙으로서 ‘땅을 기는 것들의 독’을 결합합니다. 초안의 ‘독과 함께하겠습니다’는 화자 자신이 독과 함께하겠다는 뜻으로 읽힐 수 있습니다. 또한 שֶׁן은 기본적으로 ‘이빨’이며, ‘송곳니’는 가능한 해석이나 원문보다 좁습니다.
