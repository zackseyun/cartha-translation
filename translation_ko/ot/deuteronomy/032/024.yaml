  lexicon: HALOT
  rationale: 직역하면 '이/이빨'이지만 공격적 이미지가 강한 문맥이므로 송곳니로 옮겨 위협을 살렸습니다.
- source_word: זֹחֲלֵי עָפָר
  english_pob_choice: things that crawl in the dust
  chosen_korean: 땅을 기어다니는 것들
  alternatives_korean:
  - 먼지 속을 기어다니는 것들
  - 티끌 속을 기어다니는 것들
  lexicon: HALOT
  rationale: 뱀으로 좁히지 않고 지면을 기어가는 생물 전반을 가리키는 넓은 표현을 유지했습니다.
theological_decisions:
- issue: רֶשֶׁף과 קֶטֶב의 재앙성 표현
  chosen_reading: 두 단어를 모두 일반 명사로 옮기되, 각각 '역병'과 '쓰디쓴 재앙'으로 구분했습니다.
  alternative_readings:
  - רֶשֶׁף을 고유명사 '르셰프'로 처리
  - קֶטֶב을 '죽음' 또는 '멸망'으로 처리
  rationale: 본문은 언약 저주의 시적 열거이므로, 고대 근동 배경의 신명기적 위협을 그대로 살리면서도 신화적 해석을 요구하지 않는 일반 명사 번역이 가장 충실합니다.
  doctrine_reference: 번역 철학 §1, 원어 우선과 본문 기능 우선
- issue: 보호/조롱이 아니라 심판 선언으로서의 1인칭
  chosen_reading: 내가 그들에게… 보내겠습니다로 미래형 심판 선언을 분명히 했습니다.
  alternative_readings:
  - 보내리라
  - 보내겠습니다
  rationale: 직설적 예언 선언의 힘을 유지하면서 현대 한국어 합쇼체의 자연스러운 종결을 택했습니다.
  doctrine_reference: 표준어 현대 문체 지침
