  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
  footnotes:
  - marker: a
    text: Or 'burning fever'; the Hebrew רֶשֶׁף may also echo Resheph, a plague-associated deity name in the ancient Near East.
    reason: lexical_alternative
  - marker: b
    text: Or 'the teeth of beasts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'serpents of the dust'; the Hebrew expression is broader, referring to creatures that crawl along the ground.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 기근으로 쇠약해지고, 역병[a]과 쓰디쓴 파멸에 삼켜질 것입니다. 내가 그들에게 짐승들의 이빨[b]을 보내고, 땅을 기는 것들[c]의 독도 함께 보낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불타는 열병’; 히브리어 רֶשֶׁף은 고대 근동에서 재앙과 관련된 신명과 연관될 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘짐승들의 송곳니’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘땅의 뱀들’; 히브리어 표현은 땅을 기는 생물 전반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
