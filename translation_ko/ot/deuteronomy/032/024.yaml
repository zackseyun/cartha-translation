  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
  footnotes:
  - marker: a
    text: Or 'burning fever'; the Hebrew רֶשֶׁף may also echo Resheph, a plague-associated deity name in the ancient Near East.
    reason: lexical_alternative
  - marker: b
    text: Or 'the teeth of beasts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'serpents of the dust'; the Hebrew expression is broader, referring to creatures that crawl along the ground.
    reason: lexical_alternative
translation:
  language: ko
  text: 굶주림으로 쇠약해지고[a], 역병과 쓰디쓴 재앙에 소모되며, 내가 그들에게 짐승의 송곳니를 보내고[c][b], 땅을 기어다니는 것들의 독과 함께하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불붙는 열병'; 히브리어 רֶשֶׁף은 고대 근동의 재앙 관련 신명과 연결될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '짐승의 이빨'.
    reason: lexical_alternative
  - marker: c
    text: 또는 '땅의 뱀들'; 히브리어 표현은 땅을 기어다니는 생물 전반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  english_pob_choice: wasted by famine
  chosen_korean: 굶주림으로 쇠약해지고
  alternatives_korean:
  - 기근으로 쇠잔해지고
  - 굶주림으로 여위고
  lexicon: HALOT
  rationale: 기근의 결과로 몸이 마르고 약해지는 뜻을 자연스럽게 살리되, judgment 목록의 시적 흐름을 유지했습니다.
- source_word: רֶשֶׁף
  english_pob_choice: plague
  chosen_korean: 역병
  alternatives_korean:
  - 전염병
  - 불붙는 열병
  lexicon: HALOT
  rationale: 문맥상 재앙 목록의 하나로서 병적·파괴적 타격을 가리키므로, 넓고 현대적인 '역병'이 적절합니다.
- source_word: קֶטֶב מְרִירִי
  english_pob_choice: bitter destruction
  chosen_korean: 쓰디쓴 재앙
  alternatives_korean:
  - 쓴멸망
  - 치명적인 재앙
  lexicon: HALOT
  rationale: קֶטֶב의 파괴성을 드러내면서도 'bitter'의 맛 감각과 시적 강도를 보존하기 위해 '쓰디쓴 재앙'으로 옮겼습니다.
- source_word: שֶׁן בְּהֵמוֹת
  english_pob_choice: the fangs of beasts
  chosen_korean: 짐승의 송곳니
  alternatives_korean:
  - 짐승의 이빨
  - 야수의 이빨
  lexicon: HALOT
  rationale: 직역하면 '이/이빨'이지만 공격적 이미지가 강한 문맥이므로 송곳니로 옮겨 위협을 살렸습니다.
- source_word: זֹחֲלֵי עָפָר
  english_pob_choice: things that crawl in the dust
  chosen_korean: 땅을 기어다니는 것들
  alternatives_korean:
  - 먼지 속을 기어다니는 것들
  - 티끌 속을 기어다니는 것들
  lexicon: HALOT
  rationale: 뱀으로 좁히지 않고 지면을 기어가는 생물 전반을 가리키는 넓은 표현을 유지했습니다.
theological_decisions:
- issue: רֶשֶׁף과 קֶטֶב의 재앙성 표현
  chosen_reading: 두 단어를 모두 일반 명사로 옮기되, 각각 '역병'과 '쓰디쓴 재앙'으로 구분했습니다.
  alternative_readings:
  - רֶשֶׁף을 고유명사 '르셰프'로 처리
  - קֶטֶב을 '죽음' 또는 '멸망'으로 처리
  rationale: 본문은 언약 저주의 시적 열거이므로, 고대 근동 배경의 신명기적 위협을 그대로 살리면서도 신화적 해석을 요구하지 않는 일반 명사 번역이 가장 충실합니다.
  doctrine_reference: 번역 철학 §1, 원어 우선과 본문 기능 우선
- issue: 보호/조롱이 아니라 심판 선언으로서의 1인칭
  chosen_reading: 내가 그들에게… 보내겠습니다로 미래형 심판 선언을 분명히 했습니다.
  alternative_readings:
  - 보내리라
  - 보내겠습니다
  rationale: 직설적 예언 선언의 힘을 유지하면서 현대 한국어 합쇼체의 자연스러운 종결을 택했습니다.
  doctrine_reference: 표준어 현대 문체 지침
