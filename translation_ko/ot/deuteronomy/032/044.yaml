source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hoshea''; elsewhere this figure is commonly called Joshua (see Num. 13:16).'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 모세가 와서, 그와 눈의 아들 호세아[a]가 백성에게 이 노래의 모든 말을 들려주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 인물을 여기서 “호세아”라고 부릅니다. 다른 곳에서는 보통 “여호수아”로 알려져 있습니다(민수기 13:16 참조).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 들어와서
  - 이르러
  lexicon: HALOT
  rationale: 문맥상 모세의 동작 전환을 자연스럽게 보여 주는 이동 동사로 옮겼습니다. “와서”는 원문의 진행성과 서술 흐름을 가장 무리 없이 살립니다.
- source_word: וַיְדַבֵּר אֶת כָּל דִּבְרֵי
  english_pob_choice: spoke all the words
  chosen_korean: 이 노래의 모든 말을
  alternatives_korean:
  - 이 노래의 모든 말씀을
  - 이 노래 전체를
  lexicon: HALOT
  rationale: 히브리어의 “모든 말들” 구조를 살리되, 한국어에서는 “말”이 가장 직접적입니다. “말씀”은 다소 종교적 어감을 덧입힐 수 있어 여기서는 원문의 중립성을 우선했습니다.
- source_word: הַ/שִּׁירָה הַ/זֹּאת
  english_pob_choice: this song
  chosen_korean: 이 노래
  alternatives_korean:
  - 이 시
  - 이 노래들
  lexicon: HALOT
  rationale: 이 본문은 모세의 노래를 가리키므로 “노래”가 가장 정밀합니다. “시”는 가능하지만 본문과의 직접 대응성이 약합니다.
- source_word: בְּ/אָזְנֵי הָ/עָם
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 귀에 들려주었습니다
  alternatives_korean:
  - 백성의 듣는 데에서
  - 백성 앞에서
  lexicon: HALOT
  rationale: 관용적으로는 “귀에”가 직역이지만, 한국어에서는 “들려주었습니다”가 공적 낭독의 의미를 자연스럽게 전달합니다. 이 표현은 청각적 공개성을 보존합니다.
- source_word: וְ/הוֹשֵׁעַ בִּן נֽוּן
  english_pob_choice: Hoshea son of Nun
  chosen_korean: 눈의 아들 호세아
  alternatives_korean:
  - 호세아, 눈의 아들
  - 눈의 아들 여호수아
  lexicon: HALOT
  rationale: 히브리어 본문이 여기서는 “호세아”를 쓰므로 그 형태를 유지했습니다. 친숙한 이름 “여호수아”로 조정하지 않아 원문에 있는 이름 형태를 드러냅니다.
theological_decisions:
- issue: 인물 이름을 여호수아로 조정할지, 본문의 호세아를 유지할지
  chosen_reading: 호세아를 유지합니다.
  alternative_readings:
  - 여호수아로 옮깁니다.
  rationale: 이 절의 히브리어 본문은 הוֹשֵׁעַ로 기록되어 있으므로, 독자의 익숙함보다 स्रोत 형태를 우선했습니다. 이는 교리 문제가 아니라 본문 충실성의 문제입니다.
  doctrine_reference: 번역 원칙 §1, §2
