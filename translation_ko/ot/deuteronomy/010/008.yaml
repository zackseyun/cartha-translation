base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: ko
  text: 그때 야훼께서 레위 지파를 따로 구별하여 야훼의 언약궤를 메고, 야훼 앞에 서서 그분을 섬기며, 그분의 이름으로 복을 빌게 하셨습니다. 이것은 오늘날까지도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분의 이름으로 복을 빌게 하셨습니다’는 히브리어의 축복 행위를 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדִּיל
  english_pob_choice: set apart
  chosen_korean: 따로 구별하여
  alternatives_korean:
  - 구별하여
  - 분리하여
  lexicon: HALOT
  rationale: 제의적 목적을 위한 분리라는 뜻을 살리면서, 한국어에서 ‘따로 구별하다’가 ‘set apart’의 선택성과 헌정성을 가장 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사본의 신명기 본문에 있는 하나님의 고유명을 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לְשָׁרְתוֹ
  english_pob_choice: to minister to him
  chosen_korean: 그분을 섬기며
  alternatives_korean:
  - 그분께 봉사하며
  - 그분께 시중들며
  lexicon: HALOT
  rationale: 레위인의 성소 봉사를 가리키므로 ‘섬기다’가 제의적 봉사의 의미를 보존하면서도 현대 한국어로 자연스럽습니다.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  english_pob_choice: and to bless in his name
  chosen_korean: 그분의 이름으로 복을 빌게 하셨습니다
  alternatives_korean:
  - 그분의 이름으로 축복하게 하셨습니다
  - 그분의 이름으로 복을 빌고
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘축복하다’이지만, 한국어에서는 주어가 복을 빌어 주는 행위를 분명히 하도록 ‘복을 빌게 하셨습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 레위 지파의 지정 목적을 ‘minister’로 옮길지 ‘serve’로 옮길지
  chosen_reading: 성소적 봉사의 뉘앙스를 살려 ‘섬기다’로 옮겼습니다.
  alternative_readings:
  - ‘봉사하다’로 옮김
  - ‘섬기다’ 대신 일반적 ‘돕다’로 완화
  rationale: 본문은 일반적 노동이 아니라 야훼 앞에서의 제의적 직무를 말하므로, 교회 제도 용어를 덧씌우지 않으면서도 거룩한 섬김의 성격을 드러내는 표현이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning without importing later ecclesial terminology'
- issue: ‘to bless in his name’의 한국어 표현
  chosen_reading: ‘그분의 이름으로 복을 빌게 하셨습니다’로, 명칭 사용보다 권위 아래 행하는 축복 행위를 강조했습니다.
  alternative_readings:
  - ‘그분의 이름으로 축복하게 하셨습니다’
  - ‘그분의 이름으로 복을 선언하게 하셨습니다’
  rationale: 히브리어 표현은 이름을 매개로 한 권위 있는 축복 행위를 가리키므로, 의미를 과장하지 않으면서도 제의적 기능을 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source meaning without importing doctrinal claims'
