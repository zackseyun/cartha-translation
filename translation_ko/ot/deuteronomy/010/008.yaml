  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 원문의 목적을 나타내는 연속 부정사들(‘메도록, 서서 섬기도록, 축복하도록’)이 현 번역의 연결 어미 구조에서는 마지막 ‘복을 빌게 하셨습니다’에만 직접 걸리는 듯 보일 수 있습니다. 또한 בָּרֵךְ의 직접적인 의미는 ‘축복하다’이므로 ‘복을 빌다’보다 이를 쓰는 편이 정확합니다.
  naturalness: ‘이것은 오늘날까지도 그렇습니다’는 지시 대상이 다소 모호합니다. 지정과 직무의 지속을 가리키도록 앞 절과 연결하면 더 자연스럽고 분명합니다. 수정문은 현대 표준 한국어의 합쇼체에 맞습니다.
  terminology: ‘야훼’, ‘레위 지파’, ‘언약궤’, ‘섬기다’는 적절합니다. ‘그분의 이름으로 축복하다’는 בִּשְׁמוֹ의 권위·대표의 의미를 보존하며, 불필요한 교리적 해석을 덧붙이지 않습니다.
  issues:
