source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
  footnotes:
  - marker: a
    text: Hebrew 'with his brothers.' The singular 'Levi' represents the tribe of Levi in contrast with the other tribes of Israel.
    reason: cultural_note
  - marker: b
    text: Or 'the LORD is his portion.' The Hebrew repeats the inheritance language to stress that Levi's share is not land but the LORD himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 레위는 그의 형제들 가운데서 몫이나 상속을 받지 못합니다. 야훼께서 그의 상속이십니다. 이는 야훼 당신의 하나님께서 그에게 말씀하신 대로입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 형제들’이라고 말합니다. 단수 ‘레위’는 이스라엘의 다른 지파들과 대비되는 레위 지파를 대표합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼께서 그의 몫이십니다.’ 히브리어는 상속 언어를 반복하여 레위의 몫이 땅이 아니라 야훼 자신임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런 까닭에
  - 따라서
  lexicon: HALOT
  rationale: 앞 절의 이유에서 이어지는 결론을 자연스러운 현대 한국어로 살리기 위해 ‘그러므로’를 택했습니다.
- source_word: חֵלֶק וְנַחֲלָה
  english_pob_choice: portion or inheritance
  chosen_korean: 몫이나 상속
  alternatives_korean:
  - 분깃이나 기업
  - 분깃이나 유산
  lexicon: HALOT
  rationale: 두 명사를 구분해 옮기되, 토지 분배 맥락의 관용을 한국어로 드러내기 위해 ‘몫’과 ‘상속’을 사용했습니다.
- source_word: יְהוָה הוּא נַחֲלָתוֹ
  english_pob_choice: Yahweh is his inheritance
  chosen_korean: 야훼께서 그의 상속이십니다
  alternatives_korean:
  - 야훼께서 그의 몫이십니다
  - 야훼께서 그의 기업이십니다
  lexicon: HALOT
  rationale: יְהוָה는 본문 표준에 따라 ‘야훼’로 옮기고, נַחֲלָה의 반복을 살리기 위해 ‘상속’으로 대응시켰습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 그대의 하나님
  lexicon: HALOT
  rationale: 모세의 설교적 직접 호칭을 합쇼체로 옮기기 위해 ‘당신의 하나님’으로 처리했습니다.
theological_decisions:
- issue: 여호와 전통 표기 대신 신명기 본문 표기인 יְהוָה 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용하는 신명기 표기 יְהוָה를 음역해, 하나님 이름과 칭호의 구분을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 레위의 집단 대표성 유지
  chosen_reading: 레위는 ... 받지 못합니다
  alternative_readings:
  - 레위 지파는 ... 받지 못합니다
  - 레위 사람은 ... 받지 못합니다
  rationale: 히브리어 단수 고유명사 לְלֵוִי를 유지해, 개체명으로 말하면서도 지파 전체를 대표하는 의미를 문맥으로 드러내었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
