  to: 그러므로 레위는 그의 형제들과 함께 몫이나 상속 재산을 받지 못합니다.[a] 야훼께서 그의 상속 재산이십니다.[b] 이는 당신의 하나님 야훼께서 그에게 말씀하신 대로입니다.
