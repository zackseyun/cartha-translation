  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고’; 접속사는 단순한 이어짐으로도 읽을 수 있으나, 문맥은 ‘그러므로’라는 추론적 의미도 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘마음의 포피’라고 합니다. 이는 하나님께 대한 내적 저항을 제거하라는 이미지입니다.
    reason: source_note
  - marker: c
    text: 또는 ‘더 이상 목을 굳게 하지 마십시오’ 또는 ‘더 이상 목이 뻣뻣하지 않게 하십시오’.
