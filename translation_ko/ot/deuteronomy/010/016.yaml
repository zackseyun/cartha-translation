theological_decisions:
- issue: 언약적 ‘내적 할례’ 은유 보존
  chosen_reading: ‘마음의 포피를 베다’라는 은유를 그대로 유지했습니다.
  alternative_readings:
  - 마음을 정결하게 하십시오
  - 마음의 완고함을 버리십시오
  rationale: 이 구절은 외적 표식보다 내적 순종을 요구하는 언약적 이미지를 사용하므로, 해석어로 평탄화하지 않고 원문 은유를 유지하는 것이 신학적 긴장을 보존합니다.
