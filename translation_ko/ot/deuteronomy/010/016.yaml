  source_fidelity: The draft correctly retains the Hebrew's concrete metaphor of ‘the foreskin of your heart’ and its prohibition against making the neck hard/stiff. However, ‘마음의 포피를 베고’ is not an appropriate or natural Korean rendering of the circumcision image, and ‘목을 완고하게 하다’ is an awkward collocation that weakens the concrete neck metaphor.
  naturalness: ‘포피를 베다’ is not idiomatic for circumcision or removal in this context. ‘잘라 내십시오’ is clear, formal, and preserves the bodily metaphor. ‘목을 뻣뻣하게 하지 마십시오’ is a natural Korean rendering of the Hebrew idiom while retaining its imagery.
  terminology: ‘마음,’ ‘포피,’ and the inward-circumcision metaphor are retained without doctrinal paraphrase. The imperative-form exhortation is rendered in modern formal-polite 합쇼체. Footnote anchors are placed beside the portions to which they apply.
  issues:
  - severity: medium
    issue: ‘마음의 포피를 베고’ is an unsuitable rendering of the circumcision/removal metaphor.
    rationale: ‘베다’ is not the normal Korean expression here and can sound imprecise or stylistically jarring. ‘마음의 포피를 잘라 내십시오’ preserves the concrete Hebrew image and gives a complete exhortation.
  - severity: medium
    issue: ‘목을 완고하게 하지 마십시오’ is awkward and less faithful to the source image.
    rationale: The Hebrew says literally not to make the neck hard/stiff. In Korean, ‘목을 뻣뻣하게 하지 마십시오’ naturally preserves both the body-part image and the idiom of stubborn resistance.
