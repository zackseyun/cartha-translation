id: DEU.10.6
reference: Deuteronomy 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: Now the sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
  footnotes:
  - marker: a
    text: Beeroth Bene-jaakan may be understood literally as 'the wells of the sons of Jaakan,' but it is rendered here as a place name by transliteration.
    reason: lexical_alternative
  - marker: b
    text: Or 'Eleazar his son served as priest after him.' The Hebrew literally says 'in his place,' indicating succession.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 브에롯 베네-야아간에서 모세라로 떠났습니다[a]. 거기서 아론이 죽었고, 거기서 그가 묻혔으며, 그의 아들 엘르아살이 그의 자리에 제사장으로 섬겼습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브에롯 베네-야아간은 문자적으로는 ‘야아간 자손의 우물들’로 이해할 수 있으나, 여기서는 지명으로 음역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 아들 엘르아살이 그의 뒤를 이어 제사장으로 섬겼다.’ 히브리어는 문자적으로 ‘그의 자리에’라고 하여 계승을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל
  english_pob_choice: Now the sons of Israel
  chosen_korean: 이스라엘 자손이
  alternatives_korean:
  - 이스라엘 아들들이
  - 이스라엘 사람들이
  lexicon: HALOT
  rationale: 히브리어 관용구의 집단·언약적 표현을 살리되, 한국어에서는 자연스러운 문장 흐름을 위해 주어형으로 옮겼습니다.
- source_word: נָֽסְע֛וּ
  english_pob_choice: journeyed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 여행했습니다
  - 이동했습니다
  lexicon: HALOT
  rationale: 광야 여정 문맥에서 ‘진을 걷고 이동하다’의 의미를 자연스럽게 살리는 동사로 옮겼습니다.
- source_word: מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה
  english_pob_choice: from Beeroth Bene-jaakan to Moserah
  chosen_korean: 브에롯 베네-야아간에서 모세라로
  alternatives_korean:
  - 브에롯 베네-야아간에서 모세라까지
  - 야아간 자손의 우물들에서 모세라로
  lexicon: HALOT
  rationale: 지명으로 기능하는 곳은 번역보다 음역을 우선하고, 출발지·도착지 관계는 한국어 조사로 분명히 했습니다.
- source_word: מֵ֤ת אַהֲרֹן֙
  english_pob_choice: Aaron died
  chosen_korean: 아론이 죽었고
  alternatives_korean:
  - 아론이 그곳에서 죽었고
  - 아론은 죽었고
  lexicon: HALOT
  rationale: 히브리어의 위치 부사 ‘거기서’와 결합된 서술을 한국어 어순에 맞게 풀되, 죽음 사실 자체를 직접적으로 옮겼습니다.
- source_word: וַ/יִּקָּבֵ֣ר
  english_pob_choice: he was buried
  chosen_korean: 그가 장사되었으며
  alternatives_korean:
  - 그가 묻혔으며
  - 그가 매장되었으며
  lexicon: HALOT
  rationale: 수동형의 의미를 유지하면서 성경적 문맥에 자연스러운 ‘장사되다’를 택했습니다.
- source_word: וַ/יְכַהֵ֛ן
  english_pob_choice: served as priest
  chosen_korean: 제사장으로 섬겼습니다
  alternatives_korean:
  - 제사장으로 봉사했습니다
  - 제사장 직무를 맡았습니다
  lexicon: HALOT
  rationale: כהן의 ‘제사장 직무를 수행하다’라는 동사 의미를 살리되, 한국어에서는 ‘섬기다’가 가장 자연스럽게 기능을 드러냅니다.
- source_word: תַּחְתָּֽי/ו
  english_pob_choice: in his place
  chosen_korean: 그의 자리에
  alternatives_korean:
  - 그를 대신하여
  - 그의 뒤를 이어
  lexicon: HALOT
  rationale: ‘대신하다/후임이 되다’의 계승 의미를 직접적이고 간결하게 드러내는 표현으로 옮겼습니다.
