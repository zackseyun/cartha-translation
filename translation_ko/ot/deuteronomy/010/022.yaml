  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
  footnotes:
  - marker: a
    text: Or 'with seventy souls.' Hebrew נֶפֶשׁ ('soul/person') here is an idiom for counting persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'your ancestors.' The Hebrew specifically says 'your fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like the stars of heaven' or 'as the stars of the sky.' The sense is numerical abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희 조상들은 일흔 명이었는데 이집트로 내려갔습니다. 그런데 이제 야훼 너희 하나님께서 너희를 하늘의 별처럼 많게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  english_pob_choice: with seventy persons
  chosen_korean: 일흔 명이었는데
  alternatives_korean:
  - 일흔 사람과 함께
  - 일흔 영혼으로
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 ‘영혼’이 아니라 사람 수를 세는 관용구이므로, 한국어도 자연스럽게 인원 수를 드러내는 ‘일흔 명’으로 옮겼습니다.
- source_word: יָרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려갔습니다
  alternatives_korean:
  - 내려왔습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 이집트로 가는 움직임을 나타내는 ירד의 기본 의미를 살리면서, 한국어에서도 정착된 ‘내려가다’로 옮겼습니다.
- source_word: אֲבֹתֶיךָ
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들은
  alternatives_korean:
  - 너희 아버지들은
  - 너희 선조들은
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 한국어에서는 족장들의 집단을 가리킬 때 ‘조상들’이 가장 자연스럽고, 성별을 보존한 맥락도 크게 해치지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유신명은 대체 тит틀이 아니라 음역형 ‘야훼’로 옮겨, POB의 स्रोत-직접 원칙과 일치시켰습니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  english_pob_choice: as numerous as the stars of the heavens
  chosen_korean: 하늘의 별처럼 많게 하셨습니다
  alternatives_korean:
  - 하늘의 별들처럼 수없이 많게 하셨습니다
  - 하늘의 별만큼 많게 하셨습니다
  lexicon: HALOT
  rationale: 비유의 핵심은 단순한 모양 유사성이 아니라 수적 풍성함이므로, ‘별처럼 많게’로 자연스럽게 풀어 의미를 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 구절은 언약의 이름을 직접 사용하므로, 일반 호칭으로 바꾸지 않고 고유명 자체를 보존하는 것이 source-direct 원칙에 더 충실합니다.
  doctrine_reference: 'POB contested terms: יְהוָה/YHWH → 야훼'
