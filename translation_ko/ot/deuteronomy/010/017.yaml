  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
  footnotes:
  - marker: a
    text: 'Or: ''fearsome'' or ''awesome''; Hebrew ''the one to be feared,'' that is, the God who inspires reverent fear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼, 곧 당신들의 하나님은 신들 중의 하나님이시며 주들 중의 주이시며, 크고, 능하시고, 경외할 만하신 하나님이시며, 사람을 편파적으로 대하지 않으시고 뇌물을 받지 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외스러운’, ‘두려운’으로 옮길 수 있습니다. 히브리어는 곧 ‘경외하게 만드는 분’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 신명기의 본문에서 신적 고유명사를 살려야 하므로, 전통적 대체어인 ‘주님’보다 음역인 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 너희의 하나님
  - 여러분의 하나님
  lexicon: WLC
  rationale: 2인칭 복수 소유격을 자연스러운 합쇼체로 옮기기 위해 ‘당신들의’를 사용했고, 문맥상 단수 지칭인 ‘하나님’을 유지했습니다.
- source_word: אֱלֹהֵי הָאֱלֹהִים / וַאֲדֹנֵי הָאֲדֹנִים
  english_pob_choice: God of gods and Lord of lords
  chosen_korean: 신들 중의 하나님이시며 주들 중의 주이시며
  alternatives_korean:
  - 모든 신들의 하나님이시며 모든 주들의 주이시며
  - 신들 위의 하나님이시며 주들 위의 주이시며
  lexicon: HALOT
  rationale: 히브리어의 소유격 중첩을 한국어에서 가장 직접적으로 살리기 위해 ‘중의’를 사용해, 최상급적 우위와 대조를 유지했습니다.
- source_word: הַנּוֹרָא
  english_pob_choice: awesome / awe-inspiring
  chosen_korean: 경외할 만하신
  alternatives_korean:
  - 경외롭게 하시는
  - 두려우신
  - 외경스러우신
  lexicon: HALOT
  rationale: 단순한 ‘멋짐’이 아니라 경외심을 불러일으키는 뜻이므로, ‘경외할 만하신’으로 번역해 두려움과 존중의 긴장을 보존했습니다.
- source_word: לֹא יִשָּׂא פָנִים
  english_pob_choice: who shows no partiality
  chosen_korean: 사람을 편파적으로 대하지 않으시고
  alternatives_korean:
  - 얼굴을 보아 주지 않으시고
  - 사람을 차별하지 않으시고
  - 치우치지 않으시고
  lexicon: HALOT
  rationale: 직역의 관용구보다 의미를 드러내는 한국어로 옮겨, 판결·공의의 문맥에서 ‘편파성 없음’이 분명히 드러나게 했습니다.
- source_word: וְלֹא יִקַּח שֹׁחַד
  english_pob_choice: and takes no bribe
  chosen_korean: 뇌물을 받지 않으십니다
  alternatives_korean:
  - 뇌물을 받지 않으시며
  - 뇌물을 취하지 않으십니다
  - 뇌물을 받아들이지 않으십니다
  lexicon: HALOT
  rationale: 법정·통치 맥락에서 통상적인 한국어 표현을 사용해, 하나님이 공의로운 재판관이심을 분명히 했습니다.
theological_decisions:
- issue: 핵심 직함 열거를 어떻게 처리할지
  chosen_reading: ‘신들 중의 하나님이시며 주들 중의 주이시며’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘모든 신들보다 높으신 하나님이시며 모든 주들보다 높으신 주이시며’
  - ‘지극히 높으신 하나님이시며 지극히 높으신 주이시며’
  rationale: 본문의 수사적 대구와 비교급적 우위를 흐리지 않도록, 해설을 덧붙이기보다 원문의 구조를 살렸습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense; do not paraphrase beyond what the source warrants.'
