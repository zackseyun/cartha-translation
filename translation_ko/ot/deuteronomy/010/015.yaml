revisions:
- from: 그러나 야훼께서는 당신들의 조상들에게 마음을 두셔서 그들을 사랑하시고, 그들 뒤의 그들의 후손—곧 여러분—을 모든 민족들 가운데에서 택하셨습니다. 그것이 바로 오늘의 일입니다.[a]
  to: 그러나[a] 야훼께서는 여러분의 조상들에게 마음을 두셔서 그들을 사랑하시고, 그들 뒤를 이은 후손, 곧 여러분을 모든 민족들 가운데에서 택하셨습니다. 오늘날과 같이 말입니다.
  rationale: רַק의 역접적·제한적 뉘앙스는 본문의 ‘그러나’와 각주의 ‘오직’으로 보존했습니다. חָשַׁק와 לְאַהֲבָה אֹתָם은 ‘마음을 두셔서 그들을 사랑하시고’로, בְּזַרְעָם אַחֲרֵיהֶם בָּכֶם은 ‘그들 뒤를 이은 후손, 곧 여러분’으로 옮겼습니다. 마지막 כַּיּוֹם הַזֶּה는 현재의 확인이라는 원문의 기능을 따라 ‘오늘날과 같이 말입니다’로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:47Z'
review_pass:
  verdict: revise
  source_fidelity: 마지막 히브리어 관용구 כַּיּוֹם הַזֶּה는 ‘오늘의 일입니다’가 아니라 현재의 상태를 가리키는 ‘오늘날과 같이’로 옮겨야 합니다. 또한 אַחֲרֵיהֶם은 ‘그들 뒤의 그들의 후손’보다 ‘그들 뒤를 이은 후손’이 자연스럽고 정확합니다.
  naturalness: 합쇼체와 전반적 문장은 적절하나, ‘그들 뒤의 그들의 후손’은 중복되고 부자연스럽습니다. ‘오늘의 일입니다’는 한국어 관용상 어색할 뿐 아니라 원문의 확증적 현재 지시를 충분히 반영하지 못합니다.
  terminology: ‘야훼’, ‘마음을 두시다’, ‘사랑하시다’, ‘택하셨습니다’는 원문의 관계적 애정과 선택 어휘를 잘 보존합니다. 각주에서는 본문의 신명 표기와 일치하도록 ‘주’ 대신 ‘야훼’를 사용해야 합니다.
  issues:
  - severity: medium
    issue: כַּיּוֹם הַזֶּה의 번역
    rationale: ‘그것이 바로 오늘의 일입니다’는 사건 자체를 ‘오늘의 일’로 말하는 의미가 되기 쉽습니다. 히브리어는 선택된 상태가 현재에도 분명함을 나타내므로 ‘오늘날과 같이’가 적절합니다.
  - severity: low
    issue: בְּזַרְעָם אַחֲרֵיהֶם의 한국어 표현
    rationale: ‘그들 뒤의 그들의 후손’은 소유 표현이 반복되고 ‘뒤의’의 수식 관계가 어색합니다. ‘그들 뒤를 이은 후손’은 계승의 시간적 관계와 집합적 후손의 뜻을 자연스럽게 드러냅니다.
  - severity: low
    issue: 각주의 신명 표기 불일치
    rationale: 본문은 יהוה를 ‘야훼’로 표기하므로, 대안 번역 각주도 ‘주’가 아니라 ‘야훼’로 통일하는 것이 용어 정책과 독자 명료성에 맞습니다.
