translation:
  language: ko
  text: 그러나[a] 야훼께서는 여러분의 조상들에게 마음을 두셔서 그들을 사랑하시고, 그들 뒤를 이은 후손, 곧 여러분을 모든 민족들 가운데에서 택하셨습니다. 오늘날과 같이 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오직 야훼께서 여러분의 조상들을 사랑하시려고 그들에게 마음을 두셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 그런데
  - 그렇지만
  lexicon: HALOT
  rationale: 문맥상 앞선 진술과 대비되는 제한·전환의 기능이 있어, 한국어에서는 ‘그러나’가 가장 자연스럽게 그 역접을 드러냅니다.
- source_word: חָשַׁק
  english_pob_choice: set his affection
  chosen_korean: 마음을 두시다
  alternatives_korean:
  - 애정을 두시다
  - 기뻐하시다
  - 사랑을 두시다
  lexicon: HALOT
  rationale: 동사의 강한 애착·호의를 한국어로 직접 살리되, ‘마음을 두다’가 관계적 선택과 정서적 기울어짐을 함께 나타내어 문맥에 잘 맞습니다.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  english_pob_choice: their offspring after them
  chosen_korean: 그들 뒤의 그들의 후손
  alternatives_korean:
  - 그들의 뒤의 후손
  - 그들 다음의 후손
  - 그들의 씨
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 ‘후손’으로 옮기고, אַחֲרֵיהֶם의 순서를 ‘뒤의’로 보여 주어 혈통적 연속성을 분명히 했습니다.
- source_word: מִכָּל הָעַמִּים
  english_pob_choice: from all the peoples
  chosen_korean: 모든 민족들 가운데에서
  alternatives_korean:
  - 모든 백성들 가운데에서
  - 모든 나라들 가운데에서
  - 모든 사람들 가운데에서
  lexicon: HALOT
  rationale: עַמִּים는 단순한 개인 집합보다 집단·민족 단위를 가리키므로, 한국어에서는 ‘민족들’이 가장 덜 오해를 낳는 표현입니다.
theological_decisions:
- issue: 야훼의 선택과 사랑의 병렬 표현
  chosen_reading: ‘마음을 두시고’, ‘사랑하시고’, ‘택하셨습니다’를 차례로 유지해 선택의 관계성과 주권성을 함께 드러냈습니다.
  alternative_readings:
  - 선택만 강조하는 번역
  - 사랑을 약화시켜 역사적 선발로만 읽히게 하는 번역
  rationale: 히브리어는 관심, 사랑, 선택을 연속적으로 병렬 진술하므로, 어느 하나로 흡수하지 않고 모두 살려야 본문의 신학적 긴장이 유지됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
