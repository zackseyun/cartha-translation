base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
  footnotes:
  - marker: a
    text: Or 'the LORD heard me.' The Hebrew verb can denote both hearing and listening favorably in response.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 처음 때처럼 산에 사십 일과 사십 밤 동안 머물렀습니다. 그때에도 야훼께서 내 말을 들으셨고, 야훼께서는 너를 멸망시키려 하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 내 말을 들어 주셨습니다.’ 히브리어 동사는 단순히 듣는 것과 호의적으로 응답하여 듣는 것을 둘 다 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  english_pob_choice: As for me
  chosen_korean: 내가 말하건대
  alternatives_korean:
  - 나는
  - 그리고 나는
  lexicon: HALOT
  rationale: 독립대명사와 접속사의 결합이 앞말을 받아 강조하는 용법이므로, 단순한 연결보다 화제 전환과 자기대조를 드러내는 표현을 택했습니다.
- source_word: עָמַדְתִּי בָהָר
  english_pob_choice: I stood on the mountain
  chosen_korean: 나는 … 산에 올라가서 … 지냈습니다
  alternatives_korean:
  - 나는 산에 섰습니다
  - 나는 산에 머물렀습니다
  lexicon: HALOT
  rationale: 동사 자체는 ‘서다’이지만, 여기서는 모세가 산에서 40일을 보낸 상황을 가리키므로 한국어에서는 체류의 의미를 살리면서도 원문의 산 관련 이동을 보존하는 방향으로 옮겼습니다.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  english_pob_choice: as at the first time
  chosen_korean: 처음 때와 같이
  alternatives_korean:
  - 첫날들처럼
  - 전과 같이
  lexicon: HALOT
  rationale: 앞선 동일한 40일 기간을 가리키는 비교구이므로, 시간상 ‘처음의 그 때’를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  english_pob_choice: Yahweh listened to me
  chosen_korean: 야훼께서 내 말을 들으셨고
  alternatives_korean:
  - 야훼께서 내 말을 들으셨고
  - 야훼께서 나를 들으셨고
  lexicon: HALOT
  rationale: שׁמע + אֶל의 구문은 단순 청취보다 응답을 수반한 ‘들어 주다’의 뉘앙스를 가지므로, 한국어에서도 ‘내 말을 들으셨다’로 favorably responsive한 의미를 살렸습니다.
- source_word: לֹא אָבָה יְהוָה הַשְׁחִיתֶךָ
  english_pob_choice: Yahweh was not willing to destroy you
  chosen_korean: 야훼께서는 당신을 멸하려 하지 않으셨습니다
  alternatives_korean:
  - 야훼께서는 당신을 멸하고자 하지 않으셨습니다
  - 야훼께서는 당신을 파멸시키려 하지 않으셨습니다
  lexicon: HALOT
  rationale: אָבָה는 의지·동의의 거절을 나타내므로 ‘하려 하지 않으셨습니다’로 volitional nuance를 살렸고, הַשְׁחִית는 문맥상 심판적 파괴를 가리켜 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/주님의 대체 여부와 신명기 본문의 신명사 처리
  chosen_reading: יַהְוֶה를 야훼로 직접 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문의 고유한 언약 이름을 보존해야 하므로 전통적 호칭 대체를 따르지 않고, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וַיִּשְׁמַע의 응답적 청취 여부
  chosen_reading: ‘들으셨습니다’보다 ‘내 말을 들으셨습니다’를 택해 응답성을 살렸습니다.
  alternative_readings:
  - 내 말을 들으셨습니다
  - 내 말을 들어 주셨습니다
  rationale: 본문은 모세의 중보에 대한 하나님의 호의적 응답을 말하므로, 단순 청각보다 ‘들어 주심’의 방향을 한국어에서 과도하게 해석하지 않는 범위로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
