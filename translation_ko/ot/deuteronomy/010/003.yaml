translation:
  language: ko
  text: 그리하여 저는 아카시아나무로 언약궤를 만들고, 처음 것들과 같은 돌판 둘을 다듬었으며[a], 그 두 돌판을 손에 들고 산으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처음 것들과 같은 돌판 둘을 쪼았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  english_pob_choice: ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 상자
  lexicon: HALOT
  rationale: 이 문맥의 אֲרוֹן은 단순한 상자가 아니라 언약의 돌판을 보관하는 성스러운 궤이므로, 기능과 신학적 맥락을 함께 살려 언약궤로 옮겼습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아나무
  alternatives_korean:
  - 아카시아 목재
  - 시팀나무
  lexicon: HALOT
  rationale: 히브리어의 특정 수종을 현대 한국어로 자연스럽게 드러내면서도 고어식 음역을 피하기 위해 아카시아나무로 옮겼습니다.
- source_word: וָאֶפְסֹל
  english_pob_choice: cut
  chosen_korean: 다듬었습니다
  alternatives_korean:
  - 깎았습니다
  - 쪼갰습니다
  lexicon: HALOT
  rationale: 돌판을 형성하는 조각/다듬기의 동작을 반영하려고, 단순한 절단보다 마감된 형상을 만드는 뉘앙스가 있는 다듬었습니다를 택했습니다.
- source_word: לֻחֹת אֲבָנִים
  english_pob_choice: stone tablets
  chosen_korean: 돌판
  alternatives_korean:
  - 돌로 된 판
  - 돌 서판
  lexicon: HALOT
  rationale: 두 개의 stone tablets라는 구체적 물체를 한국어로 간결하고 자연스럽게 살리기 위해 돌판으로 옮겼습니다.
theological_decisions:
- issue: 언약궤의 한국어 표기
  chosen_reading: 언약궤
  alternative_readings:
  - 궤
  - 법궤
  rationale: 단순 물건이 아니라 여호와의 언약 돌판을 담는 성소적 기물이라는 점이 본문 흐름에서 중요하므로, 전통적이지만 문맥을 잘 드러내는 언약궤를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
