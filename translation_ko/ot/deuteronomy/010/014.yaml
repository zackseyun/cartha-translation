lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하고 장엄하게 선언하는 감탄사로, 현대 한국어 합쇼체에서 자연스럽게 유지하려고 '보십시오'를 택했습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God belong
  chosen_korean: 야훼 곧 당신의 하나님께는 … 속해 있습니다
  alternatives_korean:
  - 야훼 당신의 하나님께 속합니다
  - 야훼 곧 당신의 하나님께 속해 있습니다
  lexicon: HALOT
  rationale: 소유 관계를 한국어로는 '…께 속해 있습니다'로 옮겨, ל의 소유/귀속 의미를 분명히 했습니다. '하나님'은 한국어 기본 용례를 따랐고, 여기에 '당신의'를 넣어 언약적 호칭을 살렸습니다.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  english_pob_choice: even the highest heavens
  chosen_korean: 하늘들의 하늘들
  alternatives_korean:
  - 가장 높은 하늘들
  - 하늘의 하늘들
  lexicon: HALOT
  rationale: 히브리어의 직역상 '하늘들의 하늘들'이라는 중첩 표현을 보존해, 원문이 주는 강조와 위계를 드러냈습니다. 본문 안에서는 직역을 유지하고, 영어 POB의 의미 전달을 보완하는 표기는 주석으로 처리했습니다.
- source_word: וְכָל אֲשֶׁר בָּהּ
  english_pob_choice: and all that is in it
  chosen_korean: 그 안에 있는 모든 것
  alternatives_korean:
  - 그 속에 있는 모든 것
  - 그 안의 모든 것
  lexicon: HALOT
  rationale: בָּהּ의 직접적 의미에 맞게 '그 안에 있는'으로 옮겨, 땅의 전 존재/내용을 포괄하는 표현을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יְהוָה가 직접 나오므로, 본 프로젝트 기본값에 따라 '야훼'를 사용해 언약 이름을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: '''하늘들의 하늘들''의 번역 방식'
  chosen_reading: 원문 구조를 살린 직역을 본문에 두고, 의미는 문맥 전체로 전달합니다.
  alternative_readings:
  - 가장 높은 하늘들
  - 하늘의 하늘
  rationale: 우주적 소유 선언의 격을 약화시키지 않기 위해, 의역으로 평준화하지 않고 중첩 구조를 유지했습니다.
  doctrine_reference: Source fidelity / lexical tension preservation
