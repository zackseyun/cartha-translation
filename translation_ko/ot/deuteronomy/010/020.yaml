id: DEU.10.20
reference: Deuteronomy 10:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
  footnotes:
  - marker: a
    text: Or 'hold fast to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall revere the LORD your God'; the Hebrew verb commonly denotes fear with reverence in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 하나님 야훼를 두려워해야 합니다[a]. 그분을 섬기고, 그분에게 매달려야 하며[b], 그분의 이름으로 맹세해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분을 경외해야 합니다.’ 히브리어 동사는 언약적 문맥에서 두려움과 경외를 함께 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분을 굳게 붙들어야 합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC / POB doctrinal default
  rationale: YHWH의 고유한 언약 이름을 제목어로 바꾸지 않고 음역하여, 본문이 드러내는 하나님의 이름 자체를 보존했습니다.
- source_word: תִּירָא
  english_pob_choice: you shall fear
  chosen_korean: 두려워해야 합니다
  alternatives_korean:
  - 경외해야 합니다
  - 경외해야 하며
  lexicon: HALOT
  rationale: ירא는 언약적 맥락에서 경외를 포함하지만, 한국어에서는 ‘두려워하다’가 더 직접적으로 어휘 강도를 살리므로 기본 본문에 두고, 경외 뉘앙스는 각주로 보완했습니다.
- source_word: תַעֲבֹד
  english_pob_choice: you shall serve
  chosen_korean: 섬기고
  alternatives_korean:
  - 봉사하고
  - 예배하고
  lexicon: HALOT
  rationale: עבד의 기본 의미를 따라 ‘섬기다’로 옮겨, 예배적 함의를 유지하면서도 어휘를 지나치게 해석하지 않도록 했습니다.
- source_word: תִדְבָּק
  english_pob_choice: you shall cling
  chosen_korean: 매달려야 하며
  alternatives_korean:
  - 붙어 있어야 하며
  - 굳게 붙어야 하며
  lexicon: HALOT
  rationale: דבק의 관계적 결속 이미지를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘매달리다’를 선택했습니다.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  english_pob_choice: and by his name you shall swear
  chosen_korean: 그분의 이름으로 맹세해야 합니다
  alternatives_korean:
  - 그 이름으로 맹세해야 합니다
  - 그분의 이름으로 서약해야 합니다
  lexicon: HALOT
  rationale: שׁבע의 법적·언약적 행위를 ‘맹세하다’로 직역성 있게 유지했고, בְּשֵׁם은 ‘이름으로’가 가장 분명합니다.
theological_decisions:
- issue: ירא의 공포와 경외의 긴장
  chosen_reading: 본문에는 ‘두려워해야 합니다’를 두고, 의미상 경외를 배제하지 않는 방식으로 번역했습니다.
  alternative_readings:
  - 경외해야 합니다
  - 두려워하며 섬겨야 합니다
  rationale: 언약 명령의 무게를 약화시키지 않기 위해 ‘두려워하다’를 유지하되, 각주에서 전통적 경외 의미를 알려 독자가 오독하지 않도록 했습니다.
  doctrine_reference: 언약 충성의 요구와 하나님의 거룩하심
- issue: 연속 동사의 명령성
  chosen_reading: 히브리어 미완료형의 명령적 기능을 살려 한국어에서는 ‘-해야 합니다’ 연쇄로 옮겼습니다.
  alternative_readings:
  - 직설형 명령문(두려워하십시오 / 섬기십시오)
  rationale: 법문/훈계문 특유의 권면성을 보존하면서도 현대 한국어 합쇼체의 공적 문체를 유지하기에 가장 적절합니다.
  doctrine_reference: '번역 철학: optimal equivalence'
