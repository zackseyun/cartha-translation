  source_fidelity: 원문의 עֹשֶׂה מִשְׁפָּט는 고아와 과부를 위한 정의의 실행을 뜻하므로, 목적 관계를 분명히 드러내는 표현이 더 정확합니다. גֵּר는 단순한 여행자가 아니라 공동체 안에 거주하는 비토착민을 가리키며, 본문의 ‘나그네’는 각주로 이 범위를 밝혀 보완할 수 있습니다. לֶחֶם וְשִׂמְלָה는 직역상 ‘빵과 옷’이지만 기본 생계의 제공을 뜻하므로 ‘먹을 것과 입을 것’은 안전한 의미 번역입니다.
  naturalness: ‘아버지 없는 자와 과부의 정의’는 한국어에서 소유 관계로 읽힐 여지가 있습니다. ‘아버지 없는 이와 과부를 위하여 정의를 행하시며’가 현대 표준어 합쇼체로 더 자연스럽고 의미도 분명합니다. 또한 본문이 ‘빵과 옷’을 그대로 사용한 초안과 달리, 기존 각주 c는 자연스러운 의미 번역을 했다고 설명하여 본문과 맞지 않습니다.
  terminology: ‘아버지 없는 이’는 יָתוֹם의 아버지 상실이라는 법적·사회적 뉘앙스를 보존합니다. ‘나그네’는 성경 한국어의 관례를 따르되, 거주 비토착민이라는 의미는 각주에서 명시합니다. ‘정의를 행하시며’는 מִשְׁפָּט을 단순 판결이 아닌 정의의 실현으로 적절히 옮깁니다.
