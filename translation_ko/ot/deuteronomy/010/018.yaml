  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
  footnotes:
  - marker: a
    text: Or 'the orphan.' Hebrew יָתוֹם refers to one deprived of a father; 'fatherless' preserves the legal-social nuance of the Hebrew expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'the resident foreigner' or 'the foreigner.' Hebrew גֵּר denotes a non-native living among Israel, not merely a passing stranger.
    reason: lexical_alternative
  - marker: c
    text: Literally 'bread and clothing.' 'Food and clothing' expresses the sense of basic provision in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아버지 없는 이와 과부를 위하여 정의를 행하시며, 나그네를 사랑하시고 그에게 먹을 것과 입을 것을 주십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָתוֹם은 일반적인 ‘고아’보다 아버지를 잃은 사람을 더 직접적으로 가리킵니다. 여기서는 그 사회적·법적 뉘앙스를 살려 ‘아버지 없는 이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גֵּר는 단순히 지나가는 여행자가 아니라 이스라엘 가운데 거주하는 비토착민을 뜻합니다. ‘거류민’ 또는 ‘외국인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘빵과 옷’입니다. 여기서는 기본적인 생계 공급이라는 뜻을 살려 ‘먹을 것과 입을 것’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  english_pob_choice: executes justice
  chosen_korean: 정의를 집행하시고
  alternatives_korean:
  - 정의를 행하시고
  - 판결을 내리시고
  - 정의를 수행하시고
  lexicon: HALOT
  rationale: 동사 עשה와 מִשׁפט의 결합은 단순한 ‘행하다’보다 정의를 실제로 집행·시행하는 법정적 뉘앙스를 담으므로, ‘정의를 집행하시고’가 원문의 사법적 힘을 잘 살립니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 아버지 없는 자
  alternatives_korean:
  - 고아
  - 아비 없는 자
  lexicon: HALOT
  rationale: 히브리어는 단순한 사회적 고아보다 아버지를 잃은 상태를 가리키므로, 법적·사회적 뉘앙스를 살려 ‘아버지 없는 자’로 옮겼습니다.
- source_word: גֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인
  - 체류자
  lexicon: HALOT
  rationale: גֵּר는 단순한 스쳐 가는 낯선 사람이 아니라 이스라엘 가운데 거주하는 비토착민이므로, 관용적이면서도 관계적·법적 뉘앙스를 담는 ‘나그네’를 택했습니다.
- source_word: לֶחֶם וְשִׂמְלָה
  english_pob_choice: food and clothing
  chosen_korean: 빵과 옷
  alternatives_korean:
  - 음식과 의복
  - 양식과 의복
  - 먹을 것과 입을 것
  lexicon: HALOT
  rationale: 직역하면 ‘빵과 옷’이지만, 여기서는 생존에 필요한 기본 공급을 가리키는 관용적 표현이므로 한국어로도 가장 직접적인 기본물자 표현을 살렸습니다.
theological_decisions:
- issue: 하나님의 행위와 사랑의 결합
  chosen_reading: ‘정의를 집행하시고’와 ‘사랑하셔서 … 주십니다’를 함께 살려, 법적 정의와 실제 공급이 분리되지 않게 했습니다.
  alternative_readings:
  - 정의만 강조하기
  - 긍휼만 강조하기
  rationale: 본문은 취약한 자들에 대한 하나님의 न्याय적 개입과 애정 어린 돌봄을 함께 말하므로, 둘 중 하나로 환원하지 않고 병렬 구조를 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
