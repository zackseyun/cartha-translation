translation:
  language: ko
  text: 그때에 야훼께서 제게 말씀하셨습니다. 「너를 위하여 돌 두 판을 처음 것과 같은 모양으로 둘 새로 새겨 만들고, 산으로 내게 올라오며, 나무로 궤를 만들어라.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “두 돌 판” 또는 “돌로 된 두 판”으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “나무로 궤를 만들어라”로도 옮길 수 있습니다.
    reason: lexical_alternative
