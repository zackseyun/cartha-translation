  source_fidelity: 수정이 필요합니다. 초안의 ‘너를 위하여’는 히브리어 לְךָ의 수익적·재귀적 뉘앙스를 지나치게 문자적으로 옮겨 한국어에서 어색하며, ‘둘 새로 새겨 만들고’는 ‘두 판’을 다시 수량화하고 ‘새로’라는 표현을 추가합니다. כָּרִאשֹׁנִים은 ‘처음의 돌판들과 같이’로 명확히 옮기는 것이 적절합니다. הָהָרָה의 목적지는 ‘산으로’이며, אֵלַי는 ‘내게로’로 유지해야 합니다.
  naturalness: 합쇼체 대상에 맞추어 인용문 안의 명령을 ‘새기십시오/올라오십시오/만드십시오’로 통일했습니다. ‘돌판 두 개’, ‘나무 궤’는 현대 표준어에서 자연스럽고 간결합니다.
  terminology: יְהוָה는 프로젝트 원칙과 원문에 따라 ‘야훼’로 유지했습니다. אֲרוֹן은 언약의 돌판을 담는 맥락을 보존하도록 ‘궤’로 옮겼습니다.
