  verdict: revise
  source_fidelity: ‘돌판’은 이 절의 히브리어 הַלֻּחֹת(‘그 판들/서판들’)에 직접 명시되지 않은 ‘돌’을 보충합니다. 또한 כַּמִּכְתָּב הָרִאשׁוֹן은 ‘처음 글’보다 ‘첫 기록’이 원문의 기록/글씀 의미와 더 잘 대응합니다. 나머지 핵심 의미, 곧 열 가지 말씀, 불 가운데서의 발화, 집회의 날, 그리고 야훼께서 그것들을 화자에게 주신 사실은 보존됩니다.
  naturalness: ‘회중의 날’은 현대 한국어에서 다소 직역투이고 사건을 가리키는 히브리어 표현으로도 부자연스럽습니다. ‘집회의 날에’가 간결하고 자연스럽습니다. 각주 표지는 설명 대상인 ‘열 가지 말씀’ 바로 뒤에 두어야 합니다.
  terminology: יְהוָה를 ‘야훼’로, עֲשֶׂרֶת הַדְּבָרִים를 ‘열 가지 말씀’으로 옮긴 선택은 적절합니다. 본문이 이미 ‘열 가지 말씀’이라고 번역하므로 각주의 ‘직역하면’은 부정확하며, 전통적 번역어만 제시해야 합니다.
