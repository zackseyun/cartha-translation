id: DEU.10.4
reference: Deuteronomy 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
  footnotes:
  - marker: a
    text: 'Or, traditionally, ''the Ten Commandments.'' Hebrew: ''the ten words.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분께서 그 판들에 첫 기록과 같이, 야훼께서 산 위에서 불 가운데서 집회의 날에 여러분에게 말씀하신 그 열 가지 말씀[a]을 기록하셨고, 야훼께서 그것들을 내게 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘십계명’이라고도 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: And he wrote
  chosen_korean: 기록하였으며
  alternatives_korean:
  - 썼으며
  - 새겼으며
  lexicon: HALOT
  rationale: 돌판에 적는 행위를 한국어로 자연스럽게 드러내면서도, 문맥상 단순 문장 작성보다 문서적 기록의 성격을 살리기 위해 ‘기록하다’를 택했습니다.
- source_word: הַלֻּחֹת
  english_pob_choice: the tablets
  chosen_korean: 돌판에
  alternatives_korean:
  - 판들에
  - 돌판들에
  lexicon: HALOT
  rationale: 출애굽기·신명기 문맥의 언약 돌판을 가리키므로 ‘돌판’이 가장 분명합니다. 히브리어에는 돌이라는 말이 직접 없지만, 문맥상 한국어 독자는 돌판으로 이해하는 것이 자연스럽습니다.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  english_pob_choice: like the first writing
  chosen_korean: 처음 글과 같이
  alternatives_korean:
  - 첫 번째 기록처럼
  - 첫 글과 같이
  lexicon: HALOT
  rationale: כְּ의 비교 의미를 살려 ‘같이’로 옮겼고, מכתב을 ‘글/기록’으로 두어 첫 돌판의 기록과의 동일성을 유지했습니다.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  english_pob_choice: the Ten Words
  chosen_korean: 그 열 가지 말씀
  alternatives_korean:
  - 열 말씀
  - 십계명
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘열 가지 말/말씀’이므로, 전통적 ‘십계명’보다 원문 형태를 드러내는 ‘열 가지 말씀’을 택했습니다. ‘말씀’은 דְּבָרִים의 기본 의미를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체 기본 용례에 따라 하나님의 고유명은 ‘야훼’로 옮겼습니다. 본문이 단순 호칭이 아니라 시내산 언약의 이름을 직접 사용하므로 대체 титул인 ‘주님’은 피했습니다.
- source_word: בְּיוֹם הַקָּהָל
  english_pob_choice: on the day of the assembly
  chosen_korean: 회중의 날에
  alternatives_korean:
  - 모임의 날에
  - 집회의 날에
  lexicon: HALOT
  rationale: קָהָל은 이스라엘의 모인 공동체를 가리키므로 ‘회중’이 가장 적절합니다. 시간 표현은 한국어에서 자연스럽게 ‘-의 날에’로 처리했습니다.
- source_word: וַיִּתְּנֵם
  english_pob_choice: and Yahweh gave them to me
  chosen_korean: 야훼께서 그것들을 내게 주셨습니다
  alternatives_korean:
  - 야훼께서 그것들을 내게 넘겨주셨습니다
  - 야훼께서 그것들을 내게 주셨습니다
  lexicon: HALOT
  rationale: מכתב/דברים를 가리키는 대명사를 한국어에서는 ‘그것들’로 받았습니다. נתן은 문맥상 단순한 전달이므로 ‘주셨습니다’가 가장 सीधे합니다.
theological_decisions:
- issue: 율법의 두 돌판을 가리키는 표현과 전통어의 긴장
  chosen_reading: ‘그 열 가지 말씀’으로 본문에 두고, 전통적 ‘십계명’은 본문이 아니라 해설상 대안으로 남깁니다.
  alternative_readings:
  - 십계명
  - 열 말씀
  rationale: 원문은 명시적으로 ‘열 가지 말씀’이라고 하며, 전통어는 해석을 더합니다. 본문에서는 원문의 형식을 보존하고, 익숙한 교회용어는 필요한 경우 각주로 안내하는 편이 source-first 원칙에 맞습니다.
  doctrine_reference: '번역 원칙: 원문 우선과 전통어 보조'
