revisions:
- from: 오늘 내가 너희에게 명한 여호와 하나님의 명령들과 그의 율례들을 지키는 것은 너희의 복을 위함이라.[a]
  to: 오늘 내가 네게 명령하는 야훼의 계명들과 그분의 율례들을 지키는[a] 것은 네 유익을 위한 것입니다.
  rationale: 단수 2인칭을 «네게/네»로 일관되게 회복하고, 신명을 «야훼»로만 옮겼습니다. «계명들/율례들»의 법·언약 어휘를 유지했으며, 목적 표현은 «네 유익을 위한»으로 직역적 의미 범위를 보존했습니다. 본문의 부정사 구문은 앞 절의 질문에 종속되므로 한국어에서는 «…것은 …입니다»로 자연스럽게 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:51Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어 접미사 ךָ는 단수 «네게/네»인데 초안은 반복하여 복수 «너희»로 바꾸었습니다. 또한 יְהוָה는 고유한 신명인데 «여호와 하나님»은 원문에 없는 «하나님»을 더합니다. לְטוֹב לָךְ는 물질적·영적 ‘복’을 특정하기보다 «네 유익을 위해»로 옮기는 것이 직접적입니다.
  naturalness: «오늘 내가 네게 명령하는 … 지키는 것은 네 유익을 위한 것입니다»는 앞 절의 ‘무엇을 요구하시는가’에 이어지는 부정사 구문의 기능을 한국어에서 자연스럽고 정중한 합쇼체로 재현합니다.
  terminology: מִצְוֺת은 성경의 법·언약 문맥에서 «계명들», חֻקֹּתָיו는 «율례들»이 적절합니다. 신명 יְהוָה는 제공된 POB 방침 및 영어 감사 기록에 따라 «야훼»로 표기합니다. 원 초안의 주석은 ‘신적 보호’를 덧붙여 어휘 의미를 과장하므로, 단순한 번역 대안으로 고칩니다.
  issues:
  - severity: high
    issue: 2인칭 단수 접미사 ךָ를 복수 «너희»로 번역함
    rationale: לְטוֹב לָךְ 및 מְצַוְּךָ의 2인칭은 문법적으로 단수입니다. 공동체를 향한 연설이라는 해석을 이유로 표면 번역의 수를 복수로 바꾸면 원문의 직접 지시를 보존하지 못합니다.
  - severity: high
    issue: «여호와 하나님»이 원문에 없는 명칭을 첨가함
    rationale: 본문은 יְהוָה만 사용합니다. «하나님»의 보충 및 삼위일체적 해설은 본문의 어휘 범위를 넘어가며, 제공된 POB 신명 방침의 «Yahweh»에도 맞지 않습니다.
  - severity: medium
    issue: «복»은 לְטוֹב לָךְ의 일반적 유익을 좁힐 수 있음
    rationale: 이 표현은 ‘네 유익을 위해/네게 좋도록’이라는 목적을 나타냅니다. «유익»이 문맥의 범위를 불필요하게 한정하지 않습니다.
  - severity: medium
    issue: 각주가 «신적 보호»라는 해석적 의미를 추가함
    rationale: שמר의 이 문맥상 의미는 계명과 율례를 지키고 준수하는 것입니다. ‘신적 보호’는 이 용례에서 요구되지 않으며, 영어 POB 각주의 번역 대안도 충실히 반영하지 못합니다.
