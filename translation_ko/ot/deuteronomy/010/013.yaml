source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
  footnotes:
  - marker: a
    text: Or 'to observe' or 'to guard' the commandments of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내가 네게 명령하는 야훼의 계명들과 그분의 율례들을 지키는[a] 것은 네 유익을 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 «준수하는», «따라 지키는».
    reason: לִשְׁמֹר의 ‘keep’에 대한 가능한 한국어 번역 대안을 제시하되, 본문에 없는 신학적 의미를 덧붙이지 않습니다.
lexical_decisions:
- source_word: לִ/שְׁמֹ֞ר
  english_pob_choice: to keep/guard
  chosen_korean: 지키다
  alternatives_korean: 지키다, 간수하다, 준수하다
  lexicon: WLC
  rationale: שמר (shamar)은 단순한 보존을 넘어 신적 명령에 대한 충성스러운 준수와 보호를 의미하므로, 현대적 형식체에서 '지키다'가 가장 적절하다.
- source_word: מִצְוֺ֤ת
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean: 계명, 명령
  lexicon: WLC
  rationale: mitzvot는 명령과 계명을 포괄하며, 현대 한국어에서 '명령들'이 명령의 구체적 성격을 명확히 전달한다.
- source_word: חֻקֹּתָ֔י/ו
  english_pob_choice: his statutes
  chosen_korean: 율례들
  alternatives_korean: 규례, 법도
  lexicon: WLC
  rationale: chukkot은 입법적 규정을 의미하며, '율례'는 성경적 맥락에서 법과 규정을 포괄하는 표준적 번역어이다.
- source_word: לְ/ט֖וֹב
  english_pob_choice: for your good
  chosen_korean: 너희의 복을 위함
  alternatives_korean: 너희에게 좋은 것, 이익을 위함
  lexicon: WLC
  rationale: tov는 물질적, 영적 복을 포괄하며, 문맥상 명령의 목적이 '복'에 있음을 강조하기 위해 '복을 위함'으로 번역하였다.
theological_decisions:
- decision: Yahweh as God
  rationale: '''여호와 하나님''로 번역하여 신적 이름의 위엄과 삼위일체적 관점에서의 하나님성을 현대 독자에게 명확히 전달한다.'
- decision: Plural 'you'
  rationale: 원문 '너희'는 이스라엘 백성 전체를 지칭하므로, 현대 한국어의 복수 대명사 '너희'를 사용하여 공동체적 차원을 유지한다.
