  text: 그곳에서 그들은 구드고다로 출발하였고, 구드고다에서 욧바다로 갔습니다. 그곳은 물의 시내가 흐르는 땅이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물의 시내가 흐르는 땅’은 히브리어 נַחֲלֵי מָיִם(흐르는 물줄기들)을 옮긴 것으로, ‘물길이 있는 땅’ 또는 ‘와디가 있는 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
