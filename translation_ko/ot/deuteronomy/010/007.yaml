  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
  footnotes:
  - marker: a
    text: Or 'a land with watercourses' or 'a land of wadis of water.' The Hebrew phrase נַחֲלֵי מָיִם refers to flowing channels or streams.
