  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'sojourner,' 'resident alien,' or 'stranger.' The Hebrew ger refers to a non-native living among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 외국인을 사랑하십시오. 왜냐하면 여러분도 이집트 땅에서 외국인이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גֵּר는 이스라엘 가운데 거주하는 비토착 거주자를 가리키며, 단순히 지나가는 여행자가 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  english_pob_choice: So love
  chosen_korean: 그러므로 … 사랑하십시오
  alternatives_korean:
  - 그리고 … 사랑하십시오
  - 당신들은 사랑해야 합니다
  lexicon: HALOT
  rationale: 선행 절의 여호와의 사랑을 근거로 한 귀결을 살려, 단순 명령보다 인과적 연결을 드러내는 ‘그러므로’와 공손한 명령형을 택했습니다.
- source_word: הַ/גֵּר
  english_pob_choice: the foreigner
  chosen_korean: 그 외국인
  alternatives_korean:
  - 그 나그네
  - 그 거주 외국인
  - 그 나그네 같은 사람
  lexicon: HALOT
  rationale: גֵּר의 핵심은 이스라엘 가운데 거주하는 비토착 외인이라는 점이므로, 현대 한국어에서 즉시 이해되는 ‘외국인’을 택해 사회적 타자성과 취약성을 살렸습니다.
- source_word: כִּי / גֵרִים
  english_pob_choice: because / foreigners
  chosen_korean: 왜냐하면 … 외국인이었기 때문입니다
  alternatives_korean:
  - 이는 … 외국인이었기 때문입니다
  - 왜냐하면 … 나그네였기 때문입니다
  lexicon: HALOT
  rationale: כִּי의 인과를 자연스러운 현대 문장으로 풀어 ‘왜냐하면’으로 옮기고, 반복되는 גֵרִים은 앞절과 일관되게 ‘외국인’으로 맞췄습니다.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅에서
  - 이집트에
  lexicon: HALOT
  rationale: ‘땅’을 보존하려면 ‘이집트 땅에서’가 가장 자연스럽고, 단순히 ‘이집트에’로 줄일 경우 히브리어의 역사적·언약적 울림이 약해집니다.
theological_decisions:
- issue: גֵּר를 한국어 교회 전통어로 옮길지 여부
  chosen_reading: ‘외국인’으로 옮겨, 낯선 타자에 대한 윤리적 명령을 현대 독자가 즉시 이해하도록 했습니다.
  alternative_readings:
  - 나그네
  - 거류민
  - 거주 외국인
  rationale: 본문은 단순 여행자가 아니라 공동체 안에 살지만 보호가 필요한 비토착 거주자를 가리키므로, 전통적이지만 모호해질 수 있는 ‘나그네’보다 의미가 분명한 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
