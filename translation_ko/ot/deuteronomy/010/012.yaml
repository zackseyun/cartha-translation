source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
  footnotes:
  - marker: a
    text: Or 'require from you' for 'ask of you'; the Hebrew verb can carry the sense of asking in a way that implies obligation.
    reason: lexical_alternative
  - marker: b
    text: '''Fear'' here includes reverence, awe, and obedient devotion toward the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with all your life' for 'with all your soul'; Hebrew nephesh can mean soul, life, or self depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이스라엘아, 야훼 너의 하나님께서 네게 요구하시는 것은 무엇입니까?[a] 오직 야훼 너의 하나님을 경외하고,[b] 그의 모든 길을 걸으며, 그를 사랑하고, 온 마음과 온 영혼을 다해[c] 야훼 너의 하나님을 섬기는 것뿐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요구하시는 것’으로 옮긴 히브리어 שׁאל은 여기서 단순히 묻는다는 뜻을 넘어, 의무를 내포하여 요구한다는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경외하다’는 여기서 두려움과 경외, 그리고 순종하는 헌신을 함께 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영혼’은 히브리어 נֶפֶשׁ의 가능한 번역입니다. 이 말은 문맥에 따라 생명이나 자기 자신, 곧 전 존재를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 전환 표지로서의 시간·담화 전환을 자연스러운 한국어 「이제」로 간결하게 살렸습니다.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  english_pob_choice: what does ... ask of you
  chosen_korean: 무엇을 요구하십니까
  alternatives_korean:
  - 무엇을 물으십니까
  - 무엇을 묻고 계십니까
  lexicon: HALOT
  rationale: שׁאל이 כאן에서는 단순 질문보다 의무를 내포한 ‘묻다/요구하다’의 뜻이므로, POB의 설명을 따라 ‘요구하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약적 고유명사를 제목어 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: לְיִרְאָה
  english_pob_choice: to fear
  chosen_korean: 경외하고
  alternatives_korean:
  - 두려워하고
  - 경배하고
  lexicon: HALOT
  rationale: 이 문맥의 ירא는 단순 공포보다 언약적 경외와 복종을 포함하므로, 한국어로는 ‘경외하다’가 가장 잘 맞습니다.
- source_word: לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  english_pob_choice: with all your heart ... with all your soul
  chosen_korean: 온 마음과 온 영혼을 다하여
  alternatives_korean:
  - 온 마음과 온 생명을 다하여
  - 온 마음과 온 존재를 다하여
  lexicon: HALOT
  rationale: לֵבָב은 내면 전체를 포괄하는 ‘마음’으로, נֶפֶשׁ은 여기서 전통적·신학적 대응을 살려 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아니라 언약의 고유명사 יהוה를 사용하므로, 이를 보존하는 표기가 필요합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: יָרֵא의 신학적 강도
  chosen_reading: 경외하다
  alternative_readings:
  - 존경하다
  - 두려워하다
  rationale: 본문은 하나님을 향한 두려움과 경배적 순종을 함께 요구하므로, 강도를 약화하지 않는 ‘경외하다’로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve theological tension)
