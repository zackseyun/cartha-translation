source:
  edition: WLC
  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
  footnotes:
  - marker: a
    text: Or 'He is the one you praise' or 'He is your boast.' The Hebrew literally says, 'He is your praise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fearsome things' or 'terrifying things.' The Hebrew term denotes deeds that evoke fear and awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 당신의 찬양이시며[a], 당신의 하나님이십니다[b]. 그분은 당신을 위해 이 크고 두려운 일들을 행하셨는데, 당신의 눈이 그것들을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 찬양하는 분’ 혹은 ‘당신의 자랑’. 히브리어는 문자적으로 ‘그분은 당신의 찬양’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두려운 일들’ 혹은 ‘무서운 일들’. 히브리어는 두려움과 경외를 불러일으키는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  english_pob_choice: your praise
  chosen_korean: 당신의 찬양
  alternatives_korean:
  - 당신의 자랑
  - 당신이 찬양하는 분
  - 당신의 영광
  lexicon: HALOT
  rationale: 히브리어의 predicative 구문을 살려 ‘찬양’으로 직역에 가깝게 옮기되, 한국어에서 자연스러운 명사구로 다듬었습니다. ‘자랑’은 오해의 여지가 있어 덜 적절하고, ‘당신이 찬양하는 분’은 의미를 풀어 쓰는 해석이 강합니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 당신의 하느님
  lexicon: HALOT
  rationale: 언약적 직접 호칭을 보존하기 위해 ‘당신의 하나님’으로 옮겼습니다. 본문은 2인칭 단수형이지만 이스라엘 전체를 대표하는 호칭이므로 합쇼체 ‘당신’이 적합합니다.
- source_word: אֲשֶׁר עָשָׂה אִתְּךָ
  english_pob_choice: has done for you
  chosen_korean: 당신을 위해 ... 행하셨는데
  alternatives_korean:
  - 당신과 함께 ... 하셨는데
  - 당신에게 ... 하셨는데
  - 당신을 상대로 ... 하셨는데
  lexicon: HALOT
  rationale: עשה עם/את의 수혜적 의미를 한국어의 ‘~을 위해’로 자연스럽게 드러냈습니다. ‘함께’는 공동행동처럼 들릴 수 있어 문맥의 구원 행위를 충분히 나타내지 못합니다.
- source_word: הַגְּדֹלֹת
  english_pob_choice: great things
  chosen_korean: 이 크고
  alternatives_korean:
  - 이 큰
  - 이 위대한
  - 이 큰 일들을
  lexicon: HALOT
  rationale: 서술적 형용사로서 ‘크다’의 규모·중대성을 살려 ‘크고’로 연결했고, 뒤의 ‘일들’과 함께 자연스러운 한국어 표현을 만들었습니다. ‘위대한’은 평가가 강해 원문의 폭을 좁힐 수 있습니다.
- source_word: הַנּוֹרָאוֹת
  english_pob_choice: awe-inspiring things
  chosen_korean: 두려운 일들
  alternatives_korean:
  - 경외로운 일들
  - 놀라운 일들
  - 무서운 일들
  lexicon: HALOT
  rationale: 이 형용사는 단순한 감탄보다 경외와 두려움을 함께 일으키는 행위를 가리키므로 ‘두려운’으로 보존했습니다. ‘놀라운’은 너무 약하고, ‘무서운’은 부정적 뉘앙스가 더 강합니다.
theological_decisions:
- issue: “그분은 당신의 찬양이시며”의 신학적 압축성
  chosen_reading: 하나님은 이스라엘이 찬양하는 대상이면서 동시에 찬양의 근거이시라는 압축된 표현을 유지했습니다.
  alternative_readings:
  - 당신이 찬양하는 분이시며
  - 당신의 자랑이시며
  rationale: 히브리어는 단순한 수식이 아니라 하나님 자신이 이스라엘의 찬양이라는 역설적 진술을 합니다. 이를 풀어 설명하면 의미는 분명해지지만 시적 압축성과 신학적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: “두려운 일들”의 정서적 강도
  chosen_reading: 하나님의 행위가 경외와 두려움을 함께 불러일으키는 성격을 유지했습니다.
  alternative_readings:
  - 경외로운 일들
  - 무서운 일들
  rationale: 본문은 단지 기적의 놀라움이 아니라, 하나님 앞에서 사람을 떨게 하는 위엄 있는 행위를 말합니다. ‘두려운’은 그 긴장을 비교적 정확히 보존합니다.
  doctrine_reference: Translation philosophy §6
