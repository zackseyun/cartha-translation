- from: 야훼께서 내게 말씀하셨습니다. 「일어나서, 백성 앞에서 길을 떠나십시오. 그들이 들어가서 내가 그들의 조상에게 주기로 맹세한 땅을 차지하게 하려는 것입니다」.[a][b][c]
  to: 야훼께서 내게 말씀하셨습니다. “일어나 백성보다 앞서[a] 길을 떠나십시오. 그들이 들어가서 내가 그들의 조상[c]에게 주겠다고 맹세한 땅을 차지하도록 하십시오.[b]”
  rationale: 직접화법 안의 명령과 그 목적/결과를 한국어 합쇼체 명령문으로 일관되게 유지했습니다. ‘백성보다 앞서’로 모세가 백성을 이끌며 출발한다는 의미를 분명히 했고, ‘주겠다고 맹세한’으로 하나님의 맹세와 땅을 주신다는 내용을 자연스럽게 연결했습니다. 각주 표지는 각각의 관련 어구에 붙였습니다.
