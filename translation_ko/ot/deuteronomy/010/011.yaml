  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
  footnotes:
  - marker: a
    text: Or “ahead of the people.”
    reason: lexical_alternative
  - marker: b
    text: Or “enter and possess the land.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “their fathers”; that is, their forefathers/ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내게 말씀하셨습니다. 「일어나서, 백성 앞에서 길을 떠나십시오. 그들이 들어가서 내가 그들의 조상에게 주기로 맹세한 땅을 차지하게 하려는 것입니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성 앞서”.
    reason: alternative_reading
  - marker: b
    text: 또는 “들어가 그 땅을 차지하게 하려는 것입니다”.
    reason: alternative_reading
  - marker: c
    text: 히브리어 “그들의 아버지들”, 곧 그들의 조상/선조를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신적 고유명사를 보존하기 위해 프로젝트 기본값대로 ‘야훼’를 사용했습니다. ‘주님’은 호칭으로 바뀌어 본문이 지닌 고유명사성을 약화시킵니다.
- source_word: קוּם לֵךְ
  english_pob_choice: Arise, go
  chosen_korean: 일어나서, ... 길을 떠나십시오
  alternatives_korean:
  - 일어나 가십시오
  - 일어나서 가십시오
  lexicon: HALOT
  rationale: 두 명령형의 연속을 한국어에서 자연스럽게 풀어, 긴급한 출발 명령을 ‘일어나서, … 길을 떠나십시오’로 옮겼습니다. ‘길을 떠나다’는 뒤따르는 여행 맥락을 살리면서도 과도하게 직역적이지 않습니다.
- source_word: לִפְנֵי הָעָם
  english_pob_choice: before the people
  chosen_korean: 백성 앞에서
  alternatives_korean:
  - 백성 앞서
  - 백성보다 앞에
  lexicon: HALOT
  rationale: 공간적 의미와 지도자적 선행의 뜻을 함께 담기 위해 ‘백성 앞에서’로 옮겼습니다. 한국어에서 ‘앞서’는 다소 문어적이어서, 명령문의 흐름에는 ‘앞에서’가 더 자연스럽습니다.
- source_word: וְיִרְשׁוּ אֶת הָאָרֶץ
  english_pob_choice: take possession of the land
  chosen_korean: 그 땅을 차지하게 하려는 것입니다
  alternatives_korean:
  - 그 땅을 차지하게 하려는 것입니다
  - 그 땅을 소유하게 하려는 것입니다
  - 그 땅을 차지하게 하십시오
  lexicon: HALOT
  rationale: ירשׁ는 단순 소유보다 실제 점유·획득의 의미가 강하므로 ‘차지하다’로 옮겼습니다. ‘소유하다’는 법적 소유에 치우쳐 정복·입주 뉘앙스를 약화시킵니다.
- source_word: לַאֲבֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 아버지들’이지만, 이 문맥에서는 족장 전승을 가리키는 관용 표현이므로 한국어에서는 의미를 분명히 하는 ‘조상’이 가장 자연스럽습니다. 성별을 불필요하게 부각하지 않으면서도 역사적 참조를 보존합니다.
theological_decisions:
- issue: 야훼의 명령을 보고체로 옮길지, 직접화법의 긴박감을 살릴지
  chosen_reading: 명령 자체는 직접 인용부에서 존대형으로 유지하되, 서술문은 ‘말씀하셨습니다’로 정리했습니다.
  alternative_readings:
  - 말씀하셨다
  - 말씀하셨습니다
  rationale: 본문은 모세에게 주어지는 직접 명령이므로, 한국어에서도 하나님의 말씀은 경건한 존대형으로 처리하는 것이 적절합니다. 다만 직역적 반복을 줄이기 위해 서술문은 자연스러운 현대 문체를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: direct divine speech register'
