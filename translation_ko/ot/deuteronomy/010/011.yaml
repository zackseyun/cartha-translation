  source_fidelity: 본문의 핵심 어휘는 대체로 잘 반영되었으나, ‘그들이 … 차지하게 하려는 것입니다’는 직접 명령 안의 목적/결과절을 설명문으로 바꾸어 원문의 명령적 흐름을 약화합니다. 또한 לִפְנֵי הָעָם은 ‘백성 앞에서’보다 ‘백성보다 앞서’가 선도하여 출발한다는 뜻을 더 분명히 드러냅니다.
  naturalness: 현대 합쇼체 서술과 직접 인용의 존대 명령은 적절합니다. 다만 인용문 안에서 ‘하려는 것입니다’는 화자의 명령으로 자연스럽지 않으므로 ‘…하도록 하십시오’로 고치는 것이 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 편이 명확합니다.
  terminology: ‘야훼’, ‘땅’, ‘차지하다’, ‘조상’은 적절합니다. ‘조상’은 이 문맥에서 히브리어 ‘그들의 아버지들’(족장들)을 자연스럽게 전달하며, 각주에서 직역을 밝혀 보완할 수 있습니다.
