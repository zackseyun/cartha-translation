base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and they were there''; the wording can also imply that they remained there up to the time of speaking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 돌이켜 산에서 내려와, 내가 만든 궤 안에 그 돌판들을 넣었습니다. 그것들은 야훼께서 내게 명령하신 대로 그곳에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그리고 그것들은 그곳에 있었다’라고 합니다. 이 표현은 말하는 시점까지 그것들이 그곳에 계속 남아 있음을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר
  english_pob_choice: Then I turned and came down from the mountain
  chosen_korean: 그때 저는 돌이켜 산에서 내려와서
  alternatives_korean:
  - 그리고 저는 산에서 내려와서
  - 그때 저는 돌아서 산에서 내려왔습니다
  lexicon: HALOT
  rationale: פנה와 ירד의 연속 동작을 한국어 서술 흐름에 맞게 ‘돌이켜 … 내려와서’로 옮겨, 단순 이동보다 방향 전환과 하산의 순서를 드러냈습니다.
- source_word: וָ/אָשִׂם אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן
  english_pob_choice: and I put the tablets in the ark
  chosen_korean: 제가 만든 궤 안에 그 돌판들을 넣었습니다
  alternatives_korean:
  - 제가 만든 궤 속에 그 돌판들을 두었습니다
  - 그 돌판들을 궤에 넣었습니다
  lexicon: HALOT
  rationale: שׂים은 여기서 ‘넣다/두다’가 자연스러우며, אָרוֹן은 언약궤 문맥을 살려 ‘궤’로 옮겼습니다. 한국어에서는 ‘안에’가 위치를 분명히 합니다.
- source_word: אֲשֶׁ֣ר עָשִׂ֑יתִי
  english_pob_choice: that I had made
  chosen_korean: 제가 만든
  alternatives_korean:
  - 내가 만든
  - 제가 만들어 둔
  lexicon: HALOT
  rationale: 관계절은 궤를 수식하는 말이므로 자연스러운 현행형 수식으로 옮겼습니다. 영어의 과거완료는 한국어에서 문맥상 이미 이전에 만든 궤임을 알 수 있어 별도 시제로 강제하지 않았습니다.
- source_word: וַ/יִּ֣הְיוּ שָׁ֔ם
  english_pob_choice: and they are there
  chosen_korean: 그리고 그것들은 그곳에 있었는데
  alternatives_korean:
  - 그리고 그것들은 그곳에 있습니다
  - 그리고 그것들은 그곳에 남아 있었습니다
  lexicon: HALOT
  rationale: היה + שם은 단순 존재를 넘어 ‘그곳에 그대로 있음’을 뜻할 수 있어, 현재적 지속 뉘앙스를 유지하되 한국어는 과거 서술로 자연스럽게 처리했습니다. 영어 주석이 허용한 잔존 의미도 보존합니다.
- source_word: יְהוָֽה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 문맥의 신명기 본문에서 여호와 대용이 아닌 고유명사로서 하나님의 이름을 그대로 옮겼습니다. 프로젝트 기본 용례에 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 명령의 준수와 언약적 충실성 표현
  chosen_reading: “야훼께서 저에게 명령하신 그대로였습니다”로 옮겨, 단순한 사실 보고가 아니라 계명에 대한 정확한 순종을 드러냈습니다.
  alternative_readings:
  - “야훼께서 나에게 명령하신 대로였습니다”
  - “야훼께서 저에게 말씀하신 대로였습니다”
  rationale: 히브리어 כַּאֲשֶׁר צִוַּנִי는 ‘명령하다’의 직접적 의미가 핵심이므로, 완곡한 ‘말씀하다’로 약화시키지 않았습니다. 전승 보존과 순종의 주제를 분명히 하는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 신 10:5의 언약궤 보관과 모세의 순종 강조
