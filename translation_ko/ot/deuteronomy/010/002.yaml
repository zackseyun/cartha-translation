    text: Or 'the commandments'; Hebrew 'the words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 그 판들에, 곧 처음 판들에 있었던 그 말씀들을 기록하겠습니다. 네가 그것들을 깨뜨렸으니, 그것들을 궤 안에 넣어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '명령들'; 히브리어는 '말씀들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  english_pob_choice: And I will write
  chosen_korean: 기록하겠습니다
  alternatives_korean:
  - 쓰겠습니다
  - 적겠습니다
  lexicon: WLC/HALOT
  rationale: 하나님의 언약문을 돌판에 새기는 맥락이므로 단순한 '쓰기'보다 문서화·공적 기록의 뉘앙스를 살려 '기록하다'를 택했습니다.
- source_word: הַדְּבָרִים
  english_pob_choice: the words
  chosen_korean: 그 말씀들
  alternatives_korean:
  - 그 말들
  - 그 명령들
  lexicon: WLC/HALOT
  rationale: 히브리어 דבר는 '말씀/말/일' 범위가 넓지만, 여기서는 돌판에 새겨진 언약 내용이므로 '말씀들'이 가장 자연스럽고, 주석적 확장인 '명령들'은 본문에 두지 않았습니다.
- source_word: וְשַׂמְתָּם בָּאָרוֹן
  english_pob_choice: and you shall put them in the ark
  chosen_korean: 그것들을 궤 안에 넣어야 합니다
  alternatives_korean:
  - 그것들을 궤에 두어야 합니다
  - 그것들을 궤 속에 넣어야 합니다
  lexicon: WLC/HALOT
  rationale: שׂים은 '두다/놓다/넣다'로 넓게 쓰이지만, 뒤의 בָּאָרוֹן이 실제 안치 동작을 가리키므로 '궤 안에 넣다'가 가장 분명합니다.
theological_decisions:
- issue: '''them''의 지시 대상'
  chosen_reading: '''그것들''은 앞의 ''판들''을 가리키는 것으로 옮겼습니다.'
  alternative_readings:
  - '''그것들''을 ''말씀들''로 돌릴 수도 있습니다.'
  rationale: 문법적으로는 인접한 복수 명사들 가운데 어느 쪽도 가능하지만, '궤 안에 넣다'라는 물리적 동작은 돌판 자체를 가리키는 것이 가장 자연스럽고 문맥에 맞습니다.
  doctrine_reference: Deuteronomy 10:1-5 문맥상 언약의 돌판 보존
