  source_fidelity: 수정이 필요합니다. 초안은 ‘처음 판들에 있었던 말씀들’이라는 관계절을 ‘그 판들에, 곧 처음 판들에’로 처리하여, 말씀들이 처음 판들 위에 있었다는 원문의 수식을 현재 기록할 판에 대한 설명처럼 바꾸었습니다. 또한 ‘네가 그것들을 깨뜨렸으니’는 원문의 관계절을 인과절로 바꿉니다. 마지막 동사는 명령형이므로 ‘넣으십시오’로 옮겨야 합니다.
  naturalness: ‘내가 … 기록하겠습니다’와 명령형 ‘넣으십시오’의 조합은 현대 표준어 합쇼체에 자연스럽습니다. ‘그 판들’은 앞 문맥에서 마련할 새 판들을 가리키며, 마지막의 ‘그것들’은 원문의 복수 대명사가 지닌 판들을 가리키는 흐름을 보존합니다.
  terminology: ‘말씀들’은 דְּבָרִים의 폭넓은 의미를 보존하는 적절한 본문어입니다. 대안 ‘계명들’은 각주로 처리하는 것이 좋습니다. ‘궤’는 אָרוֹן에 대한 정착된 문맥적 번역입니다.
