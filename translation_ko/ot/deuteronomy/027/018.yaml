review_pass:
  verdict: revise
  source_fidelity: 히브리어 מַשְׁגֶּה는 눈먼 이를 ‘잘못된 길로 이끌다/길을 잘못 들게 하다’라는 사역적 뜻입니다. 초안의 ‘그릇되게 인도하는’은 뜻을 대체로 전달하지만 현대 한국어에서 다소 부자연스럽고, 길이라는 구체적 상황을 충분히 드러내지 못합니다. 또한 וְאָמַר의 의식적 미래적 응답은 ‘말해야 합니다’보다 ‘말할 것입니다’가 원문의 진술 형식을 더 가깝게 보존합니다.
  naturalness: ‘그릇된 길로 이끄는 자’는 법적·의례적 문맥에 맞는 격식을 유지하면서도 자연스럽습니다. ‘저주를 받습니다’와 ‘모든 백성은 … 말할 것입니다’는 현대 합쇼체로 일관됩니다.
  terminology: ‘눈먼 사람’은 원문의 구체적인 시각 장애 상태를 충실히 반영하며, 한국어가 문법적 성을 표시하지 않는 점에서 원문의 남성 단수형을 부당하게 중화하지 않습니다. ‘아멘’은 전례적 응답어로 유지하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그릇되게 인도하는’의 표현이 어색하고 길을 잘못 들게 하는 구체적 사역 의미가 약합니다.
    rationale: מַשְׁגֶּה는 단순히 부적절하게 안내한다는 뜻보다, 대상이 길을 잃거나 잘못된 길로 가게 하는 뜻입니다.
  - severity: low
    issue: ‘말해야 합니다’가 원문보다 의무의 양태를 더 명시합니다.
    rationale: 의식 규정의 맥락은 있으나, וְאָמַר의 진술적 미래 용법은 ‘말할 것입니다’로 옮겨 원문의 형식을 보존하는 편이 안전합니다.
  revised_text: 길에서 눈먼 사람을 그릇된 길로 이끄는 자는 저주를 받습니다. 모든 백성은 “아멘”이라고 말할 것입니다.[a]
