translation:
  language: ko
  text: 길에서 눈먼 사람을 그릇된 길로 이끄는 자는 저주를 받습니다. 모든 백성은 “아멘”이라고 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “길에서 눈먼 사람을 길을 잘못 들게 하는 자.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed is
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주받습니다
  - 저주받을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 언약적 저주 선언을 현대 합쇼체로 자연스럽게 옮기되, 단순한 감정적 저주가 아니라 선언문이라는 점을 살리기 위해 동사형 표현을 택했습니다.
- source_word: מַשְׁגֶּה
  english_pob_choice: the one who misleads
  chosen_korean: 그릇되게 인도하는 자
  alternatives_korean:
  - 길을 잘못 들게 하는 자
  - 속이는 자
  lexicon: HALOT
  rationale: 히필 분사로서 ‘그릇되게 인도하다/길을 잘못 들게 하다’의 사역적 의미를 반영했습니다. 한국어에서는 법문맥에 맞게 ‘자’로 형식성을 유지했습니다.
- source_word: עִוֵּר
  english_pob_choice: a blind man
  chosen_korean: 눈먼 사람
  alternatives_korean:
  - 맹인
  - 눈먼 남자
  lexicon: HALOT
  rationale: 원문은 남성 단수 형식이지만, 한국어에서는 ‘사람’이 가장 자연스럽고 현대적이며, 신체적 상태를 직접 드러내는 표현으로 법문맥의 일반성을 잘 전달합니다.
- source_word: אָמֵן
  english_pob_choice: Amen
  chosen_korean: “아멘”
  alternatives_korean:
  - “그러합니다”
  - “진실로”
  lexicon: HALOT
  rationale: 예배적·공동체적 응답어로 굳어진 음역을 유지하는 편이 원문의 전례적 울림을 가장 잘 보존합니다.
theological_decisions:
- issue: 공동체 응답의 명령형 뉘앙스
  chosen_reading: “모든 백성은 ‘아멘’이라고 말해야 합니다”
  alternative_readings:
  - “모든 백성은 ‘아멘’이라고 말할 것입니다”
  - “모든 백성은 ‘아멘’이라고 말합니다”
  rationale: 히브리어의 와우+완료형은 이 의식적 맥락에서 규정된 응답을 가리키므로, 한국어에서도 규범적·의례적 의무를 드러내는 ‘말해야 합니다’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
