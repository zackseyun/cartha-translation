  verdict: revise
  source_fidelity: ‘쓰러뜨리다’는 히브리어 נכה가 이 문맥에서 가리키는 치명적 살해의 뜻을 충분히 나타내지 못합니다. ‘죽이다’가 ‘무고한 피’라는 관용구 및 영어 POB의 ‘strike down’이 의도하는 법적·치명적 의미를 정확히 전달합니다. 또한 לְהַכּוֹת는 뇌물을 받는 목적을 나타내므로 ‘죽이려고’로 명시하는 것이 적절합니다.
  naturalness: ‘뇌물을 받아 무고한 사람을 쓰러뜨리는 자’보다 ‘무고한 사람을 죽이려고 뇌물을 받는 자’가 현대 표준 한국어에서 더 자연스럽고 의미가 분명합니다. 저주 선언은 ‘저주받습니다’로, 공동 응답은 ‘말할 것입니다’로 현대 합쇼체를 유지했습니다.
  terminology: ‘뇌물’, ‘아멘’, ‘저주받습니다’는 법률적·언약적 문맥에 적절합니다. ‘무고한 사람’은 무죄한 피해자를 자연스럽게 가리키며, 히브리어의 ‘무고한 피’ 관용구가 지닌 표현상 특징은 각주로 보완했습니다.
