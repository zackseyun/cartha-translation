  source_fidelity: 히브리어 אָרוּר는 미래의 처벌을 예고하기보다 저주를 선언하는 술어적 저주 공식입니다. 따라서 ‘저주를 받을 것입니다’보다는 ‘저주받습니다’가 원문의 선언적 힘을 더 직접적으로 보존합니다. ‘경계표를 옮기는 자’, ‘온 백성’, ‘아멘’은 원문과 영어 감사 기록에 충실합니다.
