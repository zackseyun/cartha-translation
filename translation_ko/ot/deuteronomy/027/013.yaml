translation:
  language: ko
  text: 그리고 이들은 저주[a]를 위하여 에발 산에 설 것입니다. 르우벤, 갓, 아셀, 스불론, 단, 납달리.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주의 선포를 위하여’ 또는 ‘저주하기 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these
  chosen_korean: 그리고 이 사람들은
  alternatives_korean:
  - 그리고 이들은
  - 그리고 이 사람들은
  lexicon: BDB
  rationale: 지시대명사와 접속을 살려 앞 절과의 연결을 자연스럽게 유지하되, 한국어에서는 문맥상 ‘사람들’보다 ‘이들’이 더 직접적일 수 있어 간결하게 옮겼습니다.
- source_word: יַעַמְדוּ
  english_pob_choice: shall stand
  chosen_korean: 서 있을 것입니다
  alternatives_korean:
  - 설 것입니다
  - 서 있어야 합니다
  lexicon: HALOT
  rationale: 미래형 지시로 읽히는 서술을 살려 예정된 위치/배치를 표현했습니다. 의무성보다 진술성이 강하므로 ‘서 있어야 합니다’는 피했습니다.
- source_word: עַל הַקְּלָלָה
  english_pob_choice: for the curse
  chosen_korean: 저주를 위하여
  alternatives_korean:
  - 저주를 위해
  - 저주와 관련하여
  - 저주의 선포를 위하여
  lexicon: HALOT
  rationale: 히브리어는 ‘저주’와의 관련/배치를 간명하게 말하며, 영어 POB도 과도한 설명을 피했습니다. 한국어도 동사 ‘선포하다’를 보태지 않고 관계를 드러내는 표현을 택했습니다.
- source_word: בְּהַר עֵיבָל
  english_pob_choice: on Mount Ebal
  chosen_korean: 에발 산에서
  alternatives_korean:
  - 에발 산 위에서
  - 에발 산에
  lexicon: HALOT
  rationale: 장소표지 בְּ를 한국어 조사 ‘-에서’로 자연스럽게 옮기되, 고유명사는 현대 음역 관례에 따라 ‘에발’로 표기했습니다.
theological_decisions:
- issue: 저주와의 관계를 어떻게 명시할 것인가
  chosen_reading: 본문의 간결함을 따라 ‘저주를 위하여’로 두고, ‘선포’ 같은 동사를 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 저주의 선포를 위하여
  - 저주를 선포하기 위하여
  - 저주를 위한
  rationale: 히브리어는 vv. 12–13의 대구를 통해 의례적 배치를 암시하지만, 직접적으로 ‘선포하다’는 동사를 쓰지 않습니다. 따라서 해석을 과잉 규정하지 않고 긴장을 보존했습니다.
  doctrine_reference: optimal equivalence; preserve theological tension
