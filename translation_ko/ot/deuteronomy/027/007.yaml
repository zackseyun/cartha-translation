base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 화목제물[a]을 드리고, 거기서 먹고, 당신의 하나님 야훼 앞에서 기뻐하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '교제 제물', '화평 제물'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זָבַחְתָּ
  english_pob_choice: you shall sacrifice
  chosen_korean: 드리고
  alternatives_korean:
  - 희생하다
  - 제사하다
  - 바치다
  lexicon: HALOT
  rationale: זבח는 제의적 문맥에서 희생 제사를 드리는 행위를 가리키므로, 한국어에서는 자연스럽고 공손한 제의 표현인 '드리고'로 옮겼습니다. 직역형 '희생하다'는 문맥상 어색하고, '제사하다'는 한국어에서 의미가 다소 경직됩니다.
- source_word: שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 친교제물
  - 화평제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 한 종류의 제사를 가리키므로, 한국어 성서 용례에서 널리 통용되고 제의적 성격을 잘 드러내는 '화목제물'을 택했습니다. EN POB의 'peace offerings'는 의미를 넓게 풀어준 것이므로, 본문에는 제의 범주를 분명히 하는 번역이 더 적합합니다.
- source_word: וְ/שָׂמַחְתָּ
  english_pob_choice: and you shall rejoice
  chosen_korean: 기뻐해야 합니다
  alternatives_korean:
  - 즐거워해야 합니다
  - 환희해야 합니다
  lexicon: HALOT
  rationale: שׂמח는 예배·언약 문맥에서 단순한 감정이 아니라 공적이고 예배적인 기쁨을 뜻하므로 '기뻐해야 합니다'로 옮겼습니다. 합쇼체 문체를 유지하면서도 명령적/권고적 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 표준에 따라 יהוה는 인격적 신명인 '야훼'로 옮겨, '주'라는 대체표현이 가리는 고유 이름을 보존했습니다.
theological_decisions:
- issue: 제의적 자리에서의 기쁨의 성격
  chosen_reading: '''거기서 먹으며, ... 기뻐해야 합니다''를 통해 제사와 식사와 기쁨이 한 예배 행위로 연결됨을 드러냈습니다.'
  alternative_readings:
  - 단순한 축제적 기쁨으로 약화해 옮김
  - '''즐거워하다''로 일반적 감정만 강조'
  rationale: 문맥은 화목제물의 식사와 야훼 앞에서의 기쁨을 함께 제시하므로, 예배적·공동체적 기쁨이라는 제의적 의미를 유지하는 것이 필요합니다.
  doctrine_reference: 토라의 제의 규례와 공동체적 예배 이해
- issue: 여호와/야훼 신명 처리
  chosen_reading: יהוה를 '야훼'로 일관되게 옮겼습니다.
  alternative_readings:
  - '''주''로 대체'
  - '''여호와'' 사용'
  rationale: 히브리어 본문이 고유 신명을 직접 사용하므로, 칭호로 바꾸지 않고 음역하여 신명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
