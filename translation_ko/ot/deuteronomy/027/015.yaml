base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
  footnotes:
  - marker: a
    text: Or 'a molten image.' The Hebrew term refers to an image made by casting, often in metal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man'; the masculine singular here functions as a representative legal formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 우상이나 주조한 우상을 만드는 사람은 저주를 받습니다. 그것은 야훼께서 혐오하시는 것, 곧 장인의 손으로 만든 것이며, 몰래 세워 놓는 것입니다. 그러면 온 백성이 대답하며 말해야 합니다. 「아멘」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַסֵּכָה는 ‘주조한 형상’을 가리키며, 금속을 반드시 명시하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그 사람’은 여기서 대표적 법률 공식으로 기능하는 남성 단수 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받습니다
  alternatives_korean:
