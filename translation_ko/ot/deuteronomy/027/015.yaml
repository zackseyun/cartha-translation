  lexicon: HALOT
  rationale: 언약 저주 선포문의 판결적 힘을 살리면서도 현대 한국어에서 자연스럽고 형식적인 표현으로 옮겼습니다.
- source_word: פֶסֶל וּמַסֵּכָה
  english_pob_choice: a carved image or a cast image
  chosen_korean: 우상이나 주조한 우상
  alternatives_korean:
