  lexicon: HALOT
  rationale: 두 제작 방식의 대비를 살리되 한국어에서 즉시 이해되는 우상 표현으로 옮겼습니다. '주조한'은 금속을 명시하지 않고도 성형된 이미지의 뜻을 반영합니다.
- source_word: תּוֹעֲבַת יְהוָה
  english_pob_choice: an abomination to Yahweh
  chosen_korean: 야훼께서 혐오하시는 것
  alternatives_korean:
  - 야훼께 가증한 것
  - 야훼의 가증한 것
  lexicon: HALOT
  rationale: תועבה의 강한 혐오·가증 의미를 약화하지 않기 위해 전통적 완곡어보다 직접적인 표현을 택했습니다.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  english_pob_choice: the work of the hands of a craftsman
  chosen_korean: 장인의 손으로 만든 것
  alternatives_korean:
  - 장인의 손이 만든 일
  - 공예가의 손으로 만든 것
  lexicon: HALOT
  rationale: 인간 제작물이라는 점을 자연스러운 한국어로 전달하되, 앞의 우상 제작과 연결되는 수공 제작의 뉘앙스를 유지했습니다.
- source_word: וְשָׂם בַּסָּתֶר
  english_pob_choice: and sets it up in secret
  chosen_korean: 몰래 세워 놓는 것입니다
  alternatives_korean:
  - 은밀히 세워 놓는 것입니다
  - 숨겨 두고 세우는 것입니다
  lexicon: HALOT
  rationale: 행위의 은폐성과 설치 동작을 모두 살리기 위해 '몰래 세워 놓다'를 선택했습니다.
