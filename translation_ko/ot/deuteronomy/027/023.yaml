  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
  footnotes:
  - marker: a
    text: Or, more explicitly, 'has sexual relations with his mother-in-law.' The Hebrew uses the idiom 'lies with.'
