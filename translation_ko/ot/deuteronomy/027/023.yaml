  - 잠자리를 같이하는
  lexicon: WLC/HALOT
  rationale: 히브리어의 성관계 완곡어법을 지나치게 풀이하지 않으면서도 의미가 분명하도록, 합쇼체 본문에서는 자연스러운 완곡 표현인 ‘동침하는’을 택했습니다.
- source_word: חֹתַנְתּוֹ
  english_pob_choice: his mother-in-law
  chosen_korean: 자기 시어머니
  alternatives_korean:
  - 그의 어머니
  - 장모
  lexicon: WLC/HALOT
  rationale: 히브리어 חֹתֶנֶת는 ‘시어머니/장모’에 해당하는 인척 관계를 가리키므로, 문맥상 여성 친족을 분명히 드러내는 한국어 ‘시어머니’를 사용했습니다.
- source_word: וְאָמַר כָּל הָעָם
  english_pob_choice: And all the people shall say
  chosen_korean: 그리고 모든 백성은 …이라고 말할 것입니다
  alternatives_korean:
  - 그러면 모든 백성이 …이라고 말할 것입니다
  - 모든 백성은 …이라고 할 것입니다
  lexicon: WLC/HALOT
  rationale: 예전적 선언에 대한 집단 응답을 나타내므로, 미래·의례적 명령의 힘을 살려 ‘말할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 성적 완곡어법의 처리
  chosen_reading: ‘동침하는’으로 완곡어법을 유지하되 의미를 분명하게 했습니다.
  alternative_readings:
  - ‘성관계를 갖는’으로 풀어쓰기
  - ‘잠자리를 같이하는’으로 번역
  rationale: 히브리어 המקרא적 법언의 문체를 보존하면서도, 한국어 독자가 범죄의 성격을 즉시 이해할 수 있게 하려는 선택입니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-language primacy over paraphrase.'
- issue: 회중 응답의 규범적 형식
  chosen_reading: ‘아멘’은 음역으로 남기고, 앞에 인용부호를 두어 응답문임을 드러냈습니다.
  alternative_readings:
  - ‘그렇게 되기를’
  - ‘진실로’
  rationale: אָמֵן은 예전적 승인 응답으로 널리 정착된 표지이므로, 의미를 풀이하기보다 그대로 보존하는 것이 원문과 전통 모두에 충실합니다.
  doctrine_reference: Liturgical formula preservation; lexical transparency.
