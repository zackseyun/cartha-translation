translation:
  language: ko
  text: 자기 시어머니와 동침하는 자는 저주를 받습니다. 그리고 모든 백성은 "아멘"이라고 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘누운다’라는 관용구를 사용합니다. 더 직접적으로는 ‘자기 시어머니와 성관계를 갖는’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받습니다
  alternatives_korean:
