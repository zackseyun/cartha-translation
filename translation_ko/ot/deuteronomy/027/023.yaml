translation:
  language: ko
  text: 자기의 장모와 동침하는[a] 자는 저주를 받을 것입니다. 모든 백성은 “아멘” 하고 응답할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘함께 눕다’라는 관용 표현을 사용합니다. 더 직접적으로는 ‘자기의 장모와 성관계를 갖는’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주받습니다
  - 저주를 받을 것입니다
  lexicon: WLC/HALOT
  rationale: 법정·언약 저주 공식으로서 상태를 나타내는 표현이므로, 현대 한국어에서는 결과를 분명히 드러내는 수동 표현으로 옮겼습니다.
- source_word: שֹׁכֵב עִם
  english_pob_choice: lies with
  chosen_korean: 동침하는
