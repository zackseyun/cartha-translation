  - 저주를 받을 것입니다
  lexicon: WLC/HALOT
  rationale: 법정·언약 저주 공식으로서 상태를 나타내는 표현이므로, 현대 한국어에서는 결과를 분명히 드러내는 수동 표현으로 옮겼습니다.
- source_word: שֹׁכֵב עִם
