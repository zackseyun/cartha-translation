revisions:
- from: 이들은 요단을 건넌 뒤에 그리심 산 위에 서서 백성에게 복을 빌 것입니다. 시므온, 레위, 유다, 잇사갈, 요셉, 베냐민입니다.[a]
  to: 요단을 건널 때에 이들은 백성을 축복하기 위하여 그리심 산에 설 것입니다. 곧 시므온, 레위, 유다, 잇사갈, 요셉[a], 베냐민입니다.
  rationale: 시간 표현을 원문의 ‘~할 때’에 맞추고, 축복 행위의 대상성과 직접성을 ‘백성을 축복하기 위하여’로 살렸습니다. 또한 주석 표지를 요셉에 붙여 주석의 지시 대상을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:49Z'
review_pass:
  verdict: revise
  source_fidelity: ‘요단을 건넌 뒤에’는 בְּעָבְרְכֶם의 기본적인 시간 표현(‘요단을 건널 때’)보다 선후관계를 더 명시합니다. 문맥상 도하 뒤의 의식이지만, 본문 표현의 시간적 유연성을 보존하는 편이 적절합니다. 또한 לְבָרֵךְ는 ‘복을 빌다’보다 ‘축복하다’로 옮길 때 백성을 대상으로 하는 축복 행위를 더 직접적으로 재현합니다.
  naturalness: ‘그리심 산에’가 장소 표현으로 ‘그리심 산 위에’보다 자연스럽습니다. 명단을 별도 문장으로 두는 구성은 가능하나, ‘곧’을 사용해 앞의 ‘이들’과 자연스럽게 연결했습니다.
  terminology: 시므온, 레위, 유다, 잇사갈, 요셉, 베냐민은 표준적인 성경 인명 표기입니다. 요셉에 관한 주석은 본문을 확장하지 않으며, 해당 단어에 직접 표지를 붙이는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 시간 표현이 ‘요단을 건넌 뒤에’로 번역됨
    rationale: 히브리어 בְּעָבְרְכֶם은 ‘건널 때’라는 시간 표현입니다. ‘뒤에’는 문맥적으로 가능하지만 원문보다 명시적인 후속 관계를 부가합니다.
  - severity: medium
    issue: לְבָרֵךְ를 ‘백성에게 복을 빌’로 번역함
    rationale: ‘복을 빌다’는 백성을 위해 복을 기원한다는 뜻으로도 읽힐 수 있습니다. 여기서는 백성을 향하여 행하는 축복을 가리키므로 ‘백성을 축복하기 위하여’가 더 직접적입니다.
  - severity: low
    issue: 주석 표지가 문장 끝에 놓임
    rationale: 주석은 요셉이라는 명칭의 대표적 용법을 설명하므로, 표지를 ‘요셉’ 바로 뒤에 두어 참조 대상을 분명히 해야 합니다.
  revised_text: 요단을 건널 때에 이들은 백성을 축복하기 위하여 그리심 산에 설 것입니다. 곧 시므온, 레위, 유다, 잇사갈, 요셉[a], 베냐민입니다.
