source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
  footnotes:
  - marker: a
    text: Joseph here represents the Joseph tribes, Ephraim and Manasseh, in the tribal listing.
    reason: cross_reference
translation:
  language: ko
  text: 이들은 요단을 건넌 뒤에 그리심 산 위에 서서 백성에게 복을 빌 것입니다. 시므온, 레위, 유다, 잇사갈, 요셉, 베냐민입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 해설 없이 요셉을 적지만, 여기서는 지파 목록 안에서 요셉이 요셉 계열 지파들을 대표합니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These
  chosen_korean: 이들은
  alternatives_korean:
  - 이 사람들은
  - 이들
  lexicon: HALOT
  rationale: 지시대명사 복수를 한국어 문장 첫머리에서 자연스럽게 살려, 이후 절의 동작 주체를 명확하게 했습니다.
- source_word: יַעַמְדוּ
  english_pob_choice: shall stand
  chosen_korean: 서
  alternatives_korean:
  - 설 것입니다
  - 서게 될 것입니다
  lexicon: HALOT
  rationale: 명령적·규범적 예고를 한국어에서는 미래형으로 풀어 주되, 문체를 과도하게 단정적으로 만들지 않기 위해 ‘서’로 이어지는 구성으로 옮겼습니다.
- source_word: לְבָרֵךְ
  english_pob_choice: to bless
  chosen_korean: 복을 빌
  alternatives_korean:
  - 축복하기 위해
  - 축복할
  lexicon: HALOT
  rationale: 히브리어의 목적 부정사를 한국어 동작 목적 표현으로 옮겼고, ‘bless’의 직접적 행위성을 살리기 위해 ‘복을 빌다’를 선택했습니다.
- source_word: בְּעָבְרְכֶם אֶת הַיַּרְדֵּן
  english_pob_choice: when you cross the Jordan
  chosen_korean: 요단을 건넌 뒤에
  alternatives_korean:
  - 요단을 건널 때
  - 요단을 건널 때에
  lexicon: HALOT
  rationale: 문맥상 약속된 장면이 요단 도하 이후에 이루어지는 것으로 자연스럽게 읽히므로, 시간적 선후를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 축복 행위의 표현
  chosen_reading: ‘백성에게 복을 빌’로 옮겨, 제사적/의례적 축복 행위의 공적인 성격을 살렸습니다.
  alternative_readings:
  - ‘백성을 축복할’
  - ‘백성 위에 복을 빌’
  rationale: 히브리어 לְבָרֵךְ는 단순한 인사말이 아니라 공동체를 향한 의례적 축복 행위를 가리키므로, 한국어에서도 그 종교적 행위를 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 지파 명단의 ‘요셉’
  chosen_reading: 본문대로 ‘요셉’을 유지했습니다.
  alternative_readings:
  - ‘요셉 지파’
  - ‘에브라임과 므낫세’
  rationale: 히브리어 본문이 해설 없이 ‘요셉’을 직접 제시하므로, 대표 지파 해석을 본문에 확장해 넣지 않고 주석 없이 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
