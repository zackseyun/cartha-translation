lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주가 있을 것입니다
  lexicon: WLC
  rationale: 형벌 선언의 분명한 법정적 어조를 살리기 위해, 상태를 나타내는 단순 서술보다 ‘저주를 받을 것입니다’를 택했습니다.
- source_word: שֹׁכֵב עִם כָּל בְּהֵמָה
  english_pob_choice: he who lies with any animal
  chosen_korean: 짐승과 동침하는 그 사람
  alternatives_korean:
  - 어떤 동물과 동침하는 자
  - 짐승과 관계하는 사람
  lexicon: WLC
  rationale: 히브리어의 성적 완곡어법을 살리면서도 현대 한국어에서 지나치게 노골적이지 않게 ‘동침하다’로 옮겼습니다. ‘그 사람’은 남성 단수 형태를 반영합니다.
- source_word: וְאָמַר כָּל הָעָם
  english_pob_choice: And all the people shall say
  chosen_korean: 그리고 온 백성은 …이라고 말해야 합니다
