  to: 짐승과 동침하는 남자[a]는 저주를 받을 것입니다. 그리고 온 백성은 “아멘”이라고 말해야 합니다.
  rationale: ‘그 사람’을 ‘남자’로 바꾸어 히브리어 남성 단수 분사의 표지를 한국어에서 실제로 보존했습니다. ‘어떤 짐승’이라는 포괄적 대안과 남성 단수 형태를 설명하는 각주는 유지하되, 해당 명사에 표지를 옮겼습니다. 나머지 표현은 원문의 저주 공식과 의례적 응답을 충실하고 자연스럽게 전달하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:48Z'
