  - 그리고 온 백성은 …라고 해야 합니다
  - 그러면 온 백성은 …라고 말합니다
  lexicon: WLC
  rationale: 의례적 응답 형식을 드러내기 위해 미래·의무 뉘앙스를 가진 ‘말해야 합니다’를 택했습니다.
- source_word: אָמֵן
  english_pob_choice: Amen
  chosen_korean: 아멘
  alternatives_korean:
  - 그렇게 되기를
  - 진실로
  lexicon: WLC
  rationale: אָמֵן은 예배·언약 응답어로서 음역을 보존하는 것이 가장 직접적입니다.
theological_decisions:
- issue: 히브리어 남성 단수 분사 שֹׁכֵב의 표지
  chosen_reading: ‘그 사람’으로 남성 단수의 지시를 살리되, 한국어에서 성별을 과도하게 일반화하지 않았습니다.
  alternative_readings:
  - ‘누구든지’로 중성화
  - ‘그 남자’로 명시
  rationale: 원문은 법조문 맥락에서 남성 단수 형태를 사용하므로, POB의 성별-정확성 원칙을 따라 성중립화보다 원문 표지를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4 (Gender-accurate over gender-neutral)
