  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
  footnotes:
  - marker: a
    text: Or, more literally, “his father’s daughter or his mother’s daughter.”
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 누이, 곧 자기 아버지의 딸이나 자기 어머니의 딸과 동침하는 자는 저주를 받습니다. 모든 백성은 “아멘” 하고 말할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주받습니다
  - 저주받을 자입니다
  lexicon: HALOT
  rationale: 언약적 저주 선언의 법률적·선언적 어조를 살리면서도 현대 한국어에서 자연스럽고 분명하게 표현했습니다.
- source_word: שֹׁכֵב עִם
  english_pob_choice: lies with
  chosen_korean: 동침하는
  alternatives_korean:
  - 잠자리를 같이하는
  - 성관계를 하는
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 드러내되, 본문의 엄중한 법문체와 맞는 절제된 표현을 택했습니다.
- source_word: בַּת אָבִיו / בַת אִמּוֹ
  english_pob_choice: the daughter of his father / the daughter of his mother
  chosen_korean: 자기 아버지의 딸 / 자기 어머니의 딸
  alternatives_korean:
  - 아버지의 딸 / 어머니의 딸
  - 아버지의 딸 / 어머니의 딸
  lexicon: HALOT
  rationale: 영어 POB처럼 친족관계를 투명하게 드러내기 위해 직역에 가깝게 옮겼고, 절 안의 병렬 구조도 보존했습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 백성
  - 모든 사람들
  lexicon: HALOT
  rationale: 출애굽 공동체 전체의 응답을 자연스러운 한국어 집합명사로 옮겼습니다.
theological_decisions:
- issue: 친족 범주의 명시 방식
  chosen_reading: ‘형제의 딸’로 시작해 뒤의 ‘자기 아버지의 딸 또는 자기 어머니의 딸’로 그 범위를 풀어 주었습니다.
  alternative_readings:
  - ‘자기 누이’로 단순화하기
  - ‘친누이 또는 이복/동복누이’로 해석을 확정하기
  rationale: 본문은 친족관계를 법문답게 정의하고 있으므로, 관계를 단순화하거나 혈연 범위를 확정해 버리지 않고 원문의 병렬 설명을 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 공동체 응답의 형식
  chosen_reading: ‘아멘이라고 할 것입니다’로 옮겨 회중의 규정된 응답임을 나타냈습니다.
  alternative_readings:
  - ‘아멘’이라고 말합니다
  - ‘그리할지어다’
  rationale: 히브리어 אָמֵן의 전례적·언약적 응답을 보존하면서, 현대 한국어에서 자연스러운 장래/의무적 응답 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §§2, 4
