translation:
  language: ko
  text: 형제의 딸이나 자기 아버지의 딸 또는 자기 어머니의 딸과 동침하는 자는 저주를 받습니다. 모든 백성은 "아멘"이라고 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 친족 표시는 히브리어의 병렬 법문 구조를 따라 ‘아버지의 딸’과 ‘어머니의 딸’로 풀어 쓴 것입니다.
    reason: source_note
