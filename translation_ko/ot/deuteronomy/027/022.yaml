    issue: ‘형제의 딸’
    rationale: 이는 조카딸을 뜻하며, 원문의 אֲחֹתוֹ(그의 누이)를 잘못 번역한 것입니다. 따라서 본문의 친족 관계와 금지 대상이 실질적으로 변경됩니다.
  - severity: medium
    issue: 각주가 본문 번역 오류를 전제로 함
    rationale: 현 각주는 ‘형제의 딸’을 출발점으로 한 친족 표시에 관한 설명처럼 읽힙니다. 수정 본문에서는 부모에 따른 병렬 명시를 본문에 직접 보존하므로 이 각주는 더 이상 필요하지 않습니다.
