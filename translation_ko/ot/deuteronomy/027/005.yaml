source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
  footnotes:
  - marker: a
    text: Or 'you shall not use an iron tool on them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; rendered 'the LORD' in keeping with the project's standard for the divine name.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그곳에 너는 야훼 네 하나님께 제단을 쌓아야 합니다. 돌로 된 제단을 쌓되, 그 돌들 위에 쇠 연장을 대서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것들 위에 쇠를 휘둘러서는 안 됩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  english_pob_choice: you shall build
  chosen_korean: 쌓아야 합니다
  alternatives_korean:
  - 만들어야 합니다
  - 건축해야 합니다
  lexicon: HALOT
  rationale: 명령·지시문맥의 완료형을 한국어에서 자연스러운 당위형으로 옮겼고, 뒤의 ‘제단을’과 함께 제의적 구조를 살리기 위해 ‘쌓다’를 선택했습니다.
- source_word: שָּׁם
  english_pob_choice: there
  chosen_korean: 거기에
  alternatives_korean:
  - 그곳에
  - 거기에서
  lexicon: HALOT
  rationale: 앞선 문맥이 지시한 특정 장소를 받는 부사이므로, 구어적이지만 문어체에서도 자연스러운 ‘거기에’로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 네 하나님께
  alternatives_korean:
  - 야훼 너의 하나님께
  - 여호와 네 하나님께
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 이름은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격/헌정의 대상 관계는 ‘-께’로 나타냈습니다.
- source_word: מִזְבַּח אֲבָנִים
  english_pob_choice: an altar of stones
  chosen_korean: 돌로 된 제단
  alternatives_korean:
  - 돌 제단
  - 돌들로 된 제단
  lexicon: HALOT
  rationale: 직역상 ‘돌들의 제단’이지만 한국어에서는 재료를 나타내는 관형 표현 ‘돌로 된’이 가장 자연스럽고, 재료 규정을 분명히 드러냅니다.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  english_pob_choice: you shall not wield iron upon them
  chosen_korean: 그 위에 쇠를 대서는 안 됩니다
  alternatives_korean:
  - 그 위에 철을 들이대서는 안 됩니다
  - 그 위에 쇠도끼를 대서는 안 됩니다
  lexicon: HALOT
  rationale: 히필 동사의 ‘휘두르다’보다 돌을 다듬는 행위를 가리키는 금지로서 한국어 ‘대다’가 더 정확하며, 영어 POB의 ‘iron’은 도구를 암시하지만 본문이 명시한 재료어를 유지하기 위해 ‘쇠’로 옮겼습니다.
theological_decisions:
- issue: יהוה(신적 이름) 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 신적 고유명을 ‘야훼’로 보존했습니다. 이는 제단이 특정 언약의 하나님께 드려짐을 분명히 합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
