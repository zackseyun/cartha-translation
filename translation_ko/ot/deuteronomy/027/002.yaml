  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
  footnotes:
  - marker: a
    text: Or 'plaster them with plaster'; the Hebrew noun refers to lime or plaster used as a coating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날, 곧 너희가 요단강을 건너 너의 하나님 야훼께서 네게 주시는 땅에 들어갈 때, 너는 네 자신을 위해 큰 돌들을 세우고 그것들을 석회로 바르라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘석회’는 여기서 돌을 덮는 코팅 재료를 가리킬 수 있으며, 문맥상 ‘석고/회반죽’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם / אֲשֶׁר תַּעַבְרוּ
  english_pob_choice: And on the day when you cross over
  chosen_korean: 그리고 그날, 곧 너희가 … 건널 때
  alternatives_korean:
  - 그리고 그날, 너희가 … 건너는 날
  - 그리고 그날, 곧 너희가 … 건너갈 때
  lexicon: HALOT
  rationale: 히브리어의 עת/조건 결합을 자연스러운 한국어 시간절로 옮기되, 사건의 확정성과 당위를 살렸습니다.
- source_word: הַיַּרְדֵּן
  english_pob_choice: the Jordan
  chosen_korean: 요단강
  alternatives_korean:
  - 요단
  - 요단 강
  lexicon: HALOT
  rationale: 성경 한국어에서 널리 통용되는 고유명사 형태를 택하되, 강의 의미가 분명하도록 합성형을 사용했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 너의 하나님 야훼
  alternatives_korean:
  - 네 하나님 야훼
  - 너의 하나님 여호와
  lexicon: HALOT
  rationale: 신명기의 언약 명칭을 본문대로 야훼로 옮기고, האנוש형 2인칭 단수 소유격을 한국어 소유 표현으로 반영했습니다.
- source_word: וַהֲקֵמֹתָ לְךָ אֲבָנִים גְּדֹלֹות
  english_pob_choice: you shall set up for yourself large stones
  chosen_korean: 너는 네 자신을 위해 큰 돌들을 세우고
  alternatives_korean:
  - 너는 네게 큰 돌들을 세우고
  - 너는 스스로 큰 돌들을 세워
  lexicon: HALOT
  rationale: הקים의 ‘세우다/설치하다’를 살리고, לְךָ의 목적·이익 관계를 ‘네 자신을 위해’로 드러냈습니다.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  english_pob_choice: and plaster them with lime
  chosen_korean: 그것들을 석회로 바르라
  alternatives_korean:
  - 그것들을 석회로 칠하라
  - 그것들을 회반죽으로 바르라
  lexicon: HALOT
  rationale: 동사의 ‘바르다/도포하다’와 명사의 재료인 שִׂיד을 중복 없이 살려, lime의 물질감을 유지했습니다.
theological_decisions:
