  rationale: 신명기의 언약 명칭을 본문대로 야훼로 옮기고, האנוש형 2인칭 단수 소유격을 한국어 소유 표현으로 반영했습니다.
- source_word: וַהֲקֵמֹתָ לְךָ אֲבָנִים גְּדֹלֹות
  english_pob_choice: you shall set up for yourself large stones
