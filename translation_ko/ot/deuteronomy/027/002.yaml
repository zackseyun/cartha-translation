  english_pob_choice: and plaster them with lime
  chosen_korean: 그것들을 석회로 바르라
  alternatives_korean:
  - 그것들을 석회로 칠하라
  - 그것들을 회반죽으로 바르라
  lexicon: HALOT
  rationale: 동사의 ‘바르다/도포하다’와 명사의 재료인 שִׂיד을 중복 없이 살려, lime의 물질감을 유지했습니다.
