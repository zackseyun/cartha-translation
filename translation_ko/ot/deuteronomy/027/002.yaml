  naturalness: 초안의 ‘곧’은 원문에 없는 첨가이며, ‘너는 네 자신을 위해’는 현대 한국어에서 부자연스럽습니다. 또한 ‘바르라’는 해라체이므로 요구된 현대 정중한 합쇼체에 맞춰 ‘바르십시오’로 고쳤습니다.
