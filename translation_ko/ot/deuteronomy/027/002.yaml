  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
  footnotes:
  - marker: a
    text: Or 'plaster them with plaster'; the Hebrew noun refers to lime or plaster used as a coating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 요단강을 건너 네 하나님 야훼께서 네게 주시는 땅으로 갈 그날에, 너는 너를 위해 큰 돌들을 세우고 그것들을 석회[a]로 바르십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘석회’는 돌을 덮는 재료를 가리키며, 문맥상 ‘회반죽’으로도 옮길 수 있습니다.
    reason: lexical_alternative
