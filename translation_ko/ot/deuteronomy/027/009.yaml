base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
  footnotes:
  - marker: a
    text: Or 'Be attentive and listen.' The Hebrew imperative may emphasize either silence or focused attention.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have become a people belonging to the LORD your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세와 레위인 제사장들이 온 이스라엘에게 말했습니다. “이스라엘아, 잠잠히 들으십시오.[a] 오늘 당신은 야훼 당신의 하나님께 속한 백성이 되었습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 깊게 들으십시오.’ 히브리어 명령형은 침묵 자체 또는 집중된 주의를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 야훼 당신의 하나님의 백성이 되었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그러자 ... 말하며 이르기를
  alternatives_korean:
  - 그리고 ... 말했다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 דבר의 발화 행위를 분명히 드러내기 위해 ‘그러자 … 말하며 이르기를’로 옮겼습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the Levitical priests
  chosen_korean: 레위 사람 제사장들
  alternatives_korean:
  - 레위 제사장들
  - 제사장들, 곧 레위 사람들
  lexicon: HALOT
  rationale: 두 명사를 밀착된 소속관계로 보여 주면서도 한국어에서 자연스러운 표현이 되도록 ‘레위 사람 제사장들’로 옮겼습니다.
- source_word: הַסְכֵּת וּשְׁמַע
  english_pob_choice: Be silent and listen
  chosen_korean: 잠잠하고 들으십시오
  alternatives_korean:
  - 조용히 하고 들으십시오
  - 잠잠히 듣고 있으십시오
  lexicon: HALOT
  rationale: 명령의 핵심이 단순한 청취가 아니라 침묵 속의 경청이므로, POB의 어휘적 긴장을 살려 ‘잠잠하고 들으십시오’로 번역했습니다.
- source_word: נִהְיֵיתָ לְעָם לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: you have become a people for Yahweh your God
  chosen_korean: 야훼 당신들의 하나님께 속한 한 백성이 되었습니다
  alternatives_korean:
  - 야훼 당신들의 하나님을 위한 한 백성이 되었습니다
  - 야훼 당신들의 하나님께 속한 백성이 되었습니다
  lexicon: HALOT
  rationale: לְ with היה는 언약적 소속을 나타내므로 ‘~께 속한’으로 옮겼고, ‘한 백성’으로 공동체적 정체성을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 절은 히브리어 본문에 직접 יהוה가 나오므로, 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 표기했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יהוה YHWH → 야훼
- issue: 이스라엘을 향한 단수형 직접 호칭
  chosen_reading: 당신들은 ... 되었습니다
  alternative_readings:
  - 이스라엘이 ... 되었습니다
  - 너희는 ... 되었습니다
  rationale: 히브리어가 이스라엘을 집합적 단수로 부르지만, 한국어 공역 문맥에서는 복수 호칭이 더 자연스러워 공동체 전체를 향한 직접 호칭을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4 and #5'
