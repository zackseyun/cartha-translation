    text: 또는 ‘주의 깊게 들으십시오.’ 히브리어 명령형은 침묵 자체 또는 집중된 주의를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 야훼 당신의 하나님의 백성이 되었습니다.’
    reason: lexical_alternative
