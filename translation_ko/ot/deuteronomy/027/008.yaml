source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
  footnotes:
  - marker: a
    text: Or 'plainly' or 'so as to make them clear.' The Hebrew expression combines a verb meaning 'make clear/explain' with an intensifier.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 그 돌들 위에 이 율법의 모든 말씀을 매우 분명하게 기록해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָתַבְתָּ
  english_pob_choice: And you shall write
  chosen_korean: 기록해야 합니다
  alternatives_korean:
  - 써야 합니다
  - 기록할 것입니다
  lexicon: HALOT
  rationale: 명령적 미래의 용법을 살려 합쇼체의 당위 표현으로 옮겼습니다. 돌에 새기는 맥락이므로 단순한 '쓰기'보다 '기록'이 더 자연스럽습니다.
- source_word: עַל הָאֲבָנִים
  english_pob_choice: on the stones
  chosen_korean: 그 돌들 위에
  alternatives_korean:
  - 돌들 위에
  - 그 위에
  lexicon: HALOT
  rationale: 특정한 돌들을 가리키는 정관사를 반영해 '그 돌들'로 옮겼고, על의 기본 의미를 따라 '위에'를 사용했습니다.
- source_word: הַתּוֹרָה הַזֹּאת
  english_pob_choice: of this law
  chosen_korean: 이 율법의
  alternatives_korean:
  - 이 법의
  - 이 가르침의
  lexicon: HALOT
  rationale: 신명기 문맥의 תּוֹרָה는 단순한 일반 지시보다 언약적 규범을 가리키므로 '율법'이 가장 적절합니다.
- source_word: בַּאֵר הֵיטֵב
  english_pob_choice: very clearly
  chosen_korean: 매우 분명하게
  alternatives_korean:
  - 아주 뚜렷하게
  - 분명히
  lexicon: HALOT
  rationale: באר의 '명확하게 하다'와 הֵיטֵב의 강화 의미를 함께 살려, 기록의 방식이 누구나 알아볼 만큼 분명해야 함을 나타냈습니다.
