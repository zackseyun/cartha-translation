  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
  footnotes:
  - marker: a
    text: Some textual traditions, notably the Samaritan Pentateuch, read “Mount Gerizim” instead of “Mount Ebal.”
    reason: textual_variant
translation:
  language: ko
  text: 여러분이 요단을 건널 때, 내가 오늘 여러분에게 명령하는 이 돌들을 에발 산에 세우고, 그것들에 석회를 발라 입히십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 본문 전승에서는, 특히 사마리아 오경은 “에발 산” 대신 “그리심 산”으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  english_pob_choice: And when you cross
  chosen_korean: 여러분이 요단을 건널 때
  alternatives_korean:
  - 요단을 건너게 되면
  - 여러분이 요단을 건너는 때
  lexicon: HALOT
  rationale: 히브리어의 הזמן적 조건문을 자연스러운 한국어로 옮기되, 문맥상 미래 상황임을 분명히 했습니다.
- source_word: תָּקִימוּ אֶת הָאֲבָנִים הָאֵלֶּה
  english_pob_choice: you shall set up these stones
  chosen_korean: 이 돌들을 에발 산에 세우고
  alternatives_korean:
  - 이 돌들을 세우고
  - 이 돌들을 세워 두고
  lexicon: HALOT
  rationale: תָּקִימוּ는 돌을 ‘세우다/설치하다’의 뜻이므로, 단순한 놓기가 아니라 세워 설치하는 동작을 살렸습니다.
- source_word: מְצַוֶּה אֶתְכֶם הַיּוֹם
  english_pob_choice: which I am commanding you today
  chosen_korean: 내가 오늘 여러분에게 명령하는
  alternatives_korean:
  - 내가 오늘 여러분에게 명령하는 바
  - 내가 오늘 여러분에게 명령하는 이
  lexicon: HALOT
  rationale: 현재 분사형의 지속적·진행적 뉘앙스를 살려 ‘명령하는’으로 옮겼고, 직접 화법의 긴박성을 유지했습니다.
- source_word: בְּהַר עֵיבָל
  english_pob_choice: on Mount Ebal
  chosen_korean: 에발 산에
  alternatives_korean:
  - 에발 산 위에
  - 에발 산에다가
  lexicon: HALOT
  rationale: 산 이름은 현대 한국어 관용에 맞게 음역하고, 전치 관계는 ‘에발 산에’로 간명하게 처리했습니다.
- source_word: וְשַׂדְתָּ ... בַּשִּׂיד
  english_pob_choice: and you shall plaster them with lime
  chosen_korean: 그것들에 석회를 바르십시오
  alternatives_korean:
  - 그것들에 석회를 칠하십시오
  - 그것들에 회반죽을 바르십시오
  lexicon: HALOT
  rationale: שׂוד와 שׂיד의 조합을 한국어에서 중복 없이 자연스럽게 표현하기 위해, 동작은 ‘바르다’로, 재료는 ‘석회’로 옮겼습니다.
theological_decisions:
- issue: 본문의 산 이름과 사마리아 오경 전통 차이
  chosen_reading: 본문은 에발 산으로 번역하고, 대안 전승은 각주에 보존합니다.
  alternative_readings:
  - 그리심 산
  rationale: 제공된 히브리어 본문(WLC/MT)을 우선 따르되, 널리 알려진 본문 차이를 각주로 남겨 독자가 대조할 수 있게 했습니다.
  doctrine_reference: 원문 우선 번역 원칙과 본문 변이 보존 원칙
