  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
  footnotes:
  - marker: a
    text: Or “the whole commandment”; Hebrew singular, used collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세와 이스라엘의 장로들은 백성에게 명령했습니다. “오늘 내가 너희에게 명령하는 모든 계명을 지키십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 ‘계명’을 쓰며, 여기서는 전체 계명을 가리키는 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: HALOT
  rationale: צוה는 권위를 가진 명령을 뜻하므로, 서술문에서는 ‘명령하여’가 가장 직접적이고 자연스럽습니다.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  english_pob_choice: and the elders of Israel
  chosen_korean: 이스라엘의 장로들이
  alternatives_korean:
  - 이스라엘 장로들이
  - 이스라엘의 장로들과
  lexicon: HALOT
  rationale: 히브리어는 모세와 장로들을 함께 주어로 묶고 있으므로, 한국어에서도 ‘이스라엘의 장로들이’로 자연스럽게 유지했습니다.
- source_word: שָׁמֹר אֶת כָּל הַמִּצְוָה
  english_pob_choice: Keep all the commandment
  chosen_korean: 그 모든 계명을 지키십시오
  alternatives_korean:
  - 온전한 그 명령을 지키십시오
  - 그 전체 계명을 지키십시오
  lexicon: HALOT
  rationale: מִצְוָה의 단수 집합적 용법을 살리면서, 현대 한국어에서는 ‘계명’을 쓰는 것이 가장 투명합니다. ‘지키다’는 שׁמר의 순종·준수 의미를 잘 담습니다.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  english_pob_choice: that I am commanding you today
  chosen_korean: 오늘 내가 너희에게 명령하는
  alternatives_korean:
  - 오늘 내가 너희에게 명하는
  - 오늘 내가 너희에게 명령하고 있는
  lexicon: HALOT
  rationale: 현재분사 מְצַוֶּה의 진행·당면성을 살려 ‘명령하는’으로 옮겼고, ‘오늘’은 시간 강조를 그대로 유지했습니다.
theological_decisions:
- issue: 단수형 מִצְוָה의 집합적 의미를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘모든 계명’으로 옮겨 단수 집합적 의미를 유지하되, 한국어에서는 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - ‘그 모든 명령’을 사용해 단수성을 더 직역하는 방식
  - ‘계명들’로 복수화하는 방식
  rationale: 히브리어는 단수형이지만 공동체적 율법 준수를 가리키는 집합적 표현입니다. 한국어에서는 복수화보다 ‘모든 계명’이 원문의 수를 크게 훼손하지 않으면서도 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
