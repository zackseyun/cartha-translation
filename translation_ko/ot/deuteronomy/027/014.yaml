base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
  footnotes:
  - marker: a
    text: Or 'to every Israelite.' The Hebrew reads 'to every man of Israel,' using singular masculine language with representative force.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들은 큰 소리로 이스라엘 모든 사람에게 말하여 대답해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 모든 사람에게’. 히브리어는 대표성을 지닌 남성 단수 표현 ‘이스라엘의 모든 남자’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָנ֣וּ
  english_pob_choice: shall answer
  chosen_korean: 말하여 대답해야 합니다
  alternatives_korean:
  - 대답해야 합니다
  - 응답해야 합니다
  lexicon: HALOT
  rationale: 히브리어 ענה는 단순한 응답보다 공적인 선포에 가까운 경우가 많아, 한국어에서는 ‘말하여 대답하다’로 옮겨 의식적·공적 발화의 뉘앙스를 살렸습니다.
- source_word: הַ/לְוִיִּ֗ם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들은
  alternatives_korean:
  - 레위인들은
  - 레위지파 사람들은
  lexicon: HALOT
  rationale: 본문은 제사장이 아니라 레위 사람들을 직접 가리키므로, 통상적인 한국어 성경 용례를 따르되 원문 범주를 유지하는 ‘레위 사람들’로 옮겼습니다.
- source_word: אֶל כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל
  english_pob_choice: to every man of Israel
  chosen_korean: 이스라엘 모든 사람에게
  alternatives_korean:
  - 이스라엘의 모든 남자에게
  - 이스라엘의 각 사람에게
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 남성 단수 형식을 한국어에서 그대로 재현하면 어색해질 수 있어, 대표성을 유지하면서 자연스러운 ‘이스라엘 모든 사람’으로 옮겼습니다.
- source_word: קוֹל רָֽם
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 높은 목소리로
  - 큰 목소리로
  lexicon: HALOT
  rationale: קוֹל רָם은 공적인 큰 소리의 선포를 뜻하므로, 한국어 관용에 맞는 ‘큰 소리로’가 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: 대표적 남성 단수 אִישׁ의 한국어 처리
  chosen_reading: ‘이스라엘 모든 사람’으로 옮겨, 원문의 남성 단수 형식을 무리하게 한국어 성별 표현으로 고정하지 않으면서도 대표적·공동체적 호출을 살렸습니다.
  alternative_readings:
  - ‘이스라엘의 모든 남자’
  - ‘이스라엘 사람 하나하나에게’
  rationale: 이 절의 초점은 성별 자체보다 공적 언약 선포의 범위에 있으므로, 원문의 대표성을 유지하면서도 한국어 독자에게 자연스럽게 전달하는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
