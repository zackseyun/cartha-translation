  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 분부하여
  lexicon: HALOT
  rationale: צוה는 단순한 안내보다 권위 있는 명령을 뜻하므로, 한국어에서는 ‘명령하여’가 POB의 ‘commanded’와 가장 직접적으로 대응합니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: 고유명사 관행
  rationale: 히브리어 인명 משה는 한국어 성경에서 널리 굳어진 ‘모세’를 따르는 것이 가장 자연스럽습니다.
- source_word: אֶת הָעָם
  english_pob_choice: the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 그 백성에게
  - 민족에게
  lexicon: HALOT
  rationale: 여기서 עָם은 이스라엘 공동체 전체를 가리키므로, ‘백성’이 가장 간결하고 문맥에 맞습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그날에 당장
  lexicon: HALOT
  rationale: 시간 표지를 한국어 서술에 자연스럽게 살리면서도, 원문의 특정일 강조를 유지하기 위해 ‘그날’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르며
  lexicon: HALOT
  rationale: 히브리어의 담화 표지 לֵאמֹר는 뒤따르는 발화를 여는 기능이므로, 한국어에서는 자연스러운 인용 도입인 ‘말했습니다’로 풀었습니다.
