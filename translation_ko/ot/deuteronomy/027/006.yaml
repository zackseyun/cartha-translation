  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'unhewn stones.' The Hebrew says 'whole/complete stones'; 'unhewn' reflects the surrounding instruction that no iron tool be used on them (v. 5).
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님 야훼의 제단을 온전한 돌로 쌓으십시오[a]. 그 위에 당신의 하나님 야훼께 번제를 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다듬지 않은 돌’입니다. 히브리어는 ‘온전한/완전한 돌’이라고 말합니다. ‘다듬지 않은’은 앞선 5절에서 철 연장을 사용하지 말라고 한 문맥을 반영한 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  english_pob_choice: whole stones
  chosen_korean: 온전한 돌
  alternatives_korean:
  - 다듬지 않은 돌
  - 완전한 돌
  - 온전한 돌들
  lexicon: HALOT
  rationale: שְׁלֵמוֹת의 직접 의미인 ‘whole/complete’를 살려 ‘온전한’으로 옮기고, v. 5의 철 연장 금지에서 나오는 ‘다듬지 않은’ 해석은 본문 뜻을 넘는 것으로 보아 각주에 남겼습니다.
- source_word: מִזְבַּח
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 단
  - 제물 바치는 제단
  lexicon: HALOT
  rationale: 제의적 구조물을 가리키는 표준어로 ‘제단’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여기서는 하나님의 고유명 יְהוָה를 제목이 아닌 이름으로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: עוֹלֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제
  alternatives_korean:
  - 불살라 드리는 제물
  - 번제로 드리는 제물
  lexicon: HALOT
  rationale: עוֹלָה의 정착된 제의 용어를 따라 ‘번제’로 옮겨 제의적 기능을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 이름 עצמו를 사용하는 만큼, 호칭으로 대체하지 않고 언약적 고유명을 보존하는 것이 원문 독자 효과를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֲבָנִים שְׁלֵמוֹת의 번역
  chosen_reading: ‘온전한 돌’
  alternative_readings:
  - ‘다듬지 않은 돌’
  rationale: 형용사 עצמו는 ‘whole/complete’를 뜻하므로, 문맥적 해석을 본문에 끌어들이지 않고 직접 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy over translation tradition
