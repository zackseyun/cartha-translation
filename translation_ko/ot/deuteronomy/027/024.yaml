  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
  footnotes:
  - marker: a
    text: Or 'strikes' or 'kills'; the Hebrew verb can cover a range from striking to lethal violence.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 이웃을 은밀히 치는 자는 저주를 받을 것입니다. 모든 백성은 “아멘”이라고 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘치다’에서 심각하게 해치거나 ‘죽이다’에 이르는 넓은 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주를 받을 자입니다
  lexicon: HALOT
  rationale: 문맥은 언약적 저주 선포이므로 상태를 나타내는 ‘저주받다’ 계열이 적절합니다. ‘저주를 받을 것입니다’는 공적 선포의 미래형 어감을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: מַכֵּה
  english_pob_choice: strikes down
  chosen_korean: 쳐서 넘어뜨리는
  alternatives_korean:
  - 치는
  - 공격하는
  - 죽이는
  lexicon: HALOT
  rationale: נכה는 단순 타격부터 치명적 폭력까지 가질 수 있어, 본문은 과도하게 특정하지 않으면서도 중한 폭력을 드러내야 합니다. ‘쳐서 넘어뜨리는’은 무게를 살리되 ‘죽이는’으로 좁히지 않습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 자기 동료
  - 자기 동반자
  lexicon: HALOT
  rationale: רֵעַ는 공동체 안의 동료를 가리키며, 한국어 성경에서 ‘이웃’이 가장 자연스럽고 널리 이해되는 대응어입니다.
- source_word: בַּסָּתֶר
  english_pob_choice: in secret
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 숨은 곳에서
  lexicon: HALOT
  rationale: ‘비밀리에/은밀히’라는 의미를 현대 한국어에서 가장 간결하고 자연스럽게 전달합니다. 여기서는 행위의 숨김성을 강조하는 부사로 처리했습니다.
theological_decisions:
- issue: הָעָם의 범위와 응답 형식
  chosen_reading: ‘모든 백성은 “아멘”이라고 할 것입니다’로 옮겨, 공적 언약 응답의 형식을 보존했습니다.
  alternative_readings:
  - ‘모든 백성이 아멘이라고 말할 것입니다’
  - ‘온 백성이 아멘 할 것입니다’
  rationale: 본문은 공동체 전체의 응답을 요구하는 전례적 구조입니다. ‘할 것입니다’는 예언/의식적 미래를 살리고, ‘아멘’을 음역으로 보존해 응답의 고정된 예배적 성격을 드러냅니다.
  doctrine_reference: 언약 갱신의 공동체적 책임과 공적 동의의 전례성
