revisions:
- from: 저주를 받을 자는 이 율법의 말씀들을 행하여 지키지 않는 자입니다. 그리고 온 백성은 「아멘」이라고 말해야 합니다.[a]
  to: 이 율법의 말씀을 행함으로써 굳게 지키지 않는 사람은 저주를 받습니다. 그리고 온 백성은 “아멘”이라고 말해야 합니다.[a]
  rationale: 저주 공식의 선언적 성격을 현대 합쇼체로 자연스럽게 옮기고, 율법을 실제로 행하는 것과 그 율법을 굳게 유지하는 것의 연결을 더 분명히 했습니다. 각주는 יָקִים의 논쟁 가능한 의미 범위를 보존하며, 본문에 특정 해석을 과도하게 강요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:53Z'
review_pass:
  verdict: revise
  source_fidelity: ‘저주를 받을 자’는 אָרוּר의 저주 선언을 대체로 전달하고, ‘온 백성은 … 말해야 합니다’도 이 문맥의 규정적·예전적 응답을 잘 반영합니다. 그러나 ‘행하여 지키지 않는’은 יָקִים(굳게 세우다/유지하다/확증하다)과 לַעֲשׂוֹת אֹתָם(그것들을 행함으로써)의 관계를 다소 평면적으로 겹쳐 놓습니다. ‘행함으로써 굳게 지키지 않는’은 실제 순종을 통한 율법의 유지라는 두 요소를 더 분명히 보존합니다.
  naturalness: ‘이 율법의 말씀들’보다 집합적 표현인 ‘이 율법의 말씀’이 현대 한국어에서 더 자연스럽습니다. 또한 일반적 저주 선언은 ‘…사람은 저주를 받습니다’로 옮기면 현대 합쇼체 문장으로 자연스럽고 직접적입니다.
  terminology: ‘율법’, ‘말씀’, ‘아멘’은 신명기 언약 문맥과 한국어 성경 용례에 적절합니다. ‘굳게 지키다’는 본문의 ‘uphold’ 의미를 자연스럽게 드러내되, 각주에서 가능한 ‘유지하다/확증하다/굳게 세우다’의 의미 범위를 보존합니다.
  issues:
  - severity: medium
    issue: ‘행하여 지키지 않는’이 원문의 두 요소를 충분히 구별하지 못함
