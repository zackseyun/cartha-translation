reference: Deuteronomy 27:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
  footnotes:
  - marker: a
    text: 'Or ''does not confirm'' or ''does not establish'' the words of this law. The Hebrew verb can carry the sense of maintaining or validating the law''s force; here it is linked with obedience: ''by doing them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 저주를 받을 자는 이 율법의 말씀들을 행하여 지키지 않는 자입니다. 그리고 온 백성은 「아멘」이라고 말해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유지하지 않는’, ‘확립하지 않는’. 히브리어 동사는 율법의 효력을 떠받치거나 확증하는 뜻을 지닐 수 있으며, 여기서는 ‘행하여’와 연결되어 순종의 의미가 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 자
  alternatives_korean:
  - 저주받을 자
  - 저주를 받은 자
  lexicon: WLC
  rationale: 선언형 저주 공식의 효과를 살리면서도 현대 한국어에서 자연스럽고 공적인 어조를 유지하기 위해 ‘저주를 받을 자’로 옮겼습니다.
- source_word: לֹא יָקִים
  english_pob_choice: does not uphold
  chosen_korean: 행하여 지키지 않는
  alternatives_korean:
  - 유지하지 않는
  - 확립하지 않는
  - 지키지 않는
  lexicon: HALOT
  rationale: 히필 יָקִים은 단순히 ‘지키다’보다 말씀의 효력을 실제 순종으로 떠받치고 유지하는 뜻이 있어, 뒤의 목적어절과 함께 ‘행하여 지키지 않는’으로 풀어 두 요소를 모두 드러냈습니다.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  english_pob_choice: the words of this law
  chosen_korean: 이 율법의 말씀들
  alternatives_korean:
  - 이 율법의 말들
  - 이 율법의 가르침
  lexicon: HALOT
  rationale: דִּבְרֵי는 ‘말씀들/말들’이고 תּוֹרָה는 신명기 맥락에서 ‘율법’이 가장 직접적이므로, 복수 표현을 살려 ‘이 율법의 말씀들’로 옮겼습니다.
- source_word: לַעֲשׂוֹת אוֹתָם
  english_pob_choice: by doing them
  chosen_korean: 행하여 지키지 않는
  alternatives_korean:
  - 그것들을 행하지 않는
  - 그것들을 실천하지 않는
  lexicon: HALOT
  rationale: 원문은 율법을 말로만 인정하는 것이 아니라 실제 행함과 연결하므로, 앞절과 자연스럽게 묶이도록 한국어에서는 ‘행하여 지키지 않는’으로 처리했습니다.
- source_word: אָמֵן
  english_pob_choice: Amen
  chosen_korean: 아멘
  alternatives_korean:
  - 진실로
  - 그리하소서
  lexicon: HALOT
  rationale: 예배적·공동체적 응답의 고정 형식이므로 음역을 유지하는 것이 가장 정확합니다.
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם의 의미 범위
  chosen_reading: 이 구절은 율법을 단순히 승인하는 데서 그치지 않고, 실제 순종으로 그 효력을 떠받치지 않는 사람에게 언약 저주를 선포합니다.
  alternative_readings:
  - 율법을 공개적으로 확인하지 않는 사람에 대한 저주
  - 율법을 지키지 않는 사람에 대한 저주
  rationale: ‘uphold/confirm/establish’와 ‘by doing them’이 함께 있어, 말로의 승인보다 실제 행함을 포함하는 의미가 분명하므로 그 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §3, §5
