  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
  footnotes:
  - marker: a
    text: Or 'all the words of this instruction.' The Hebrew torah can mean 'instruction' as well as 'law'; here 'law' fits the covenantal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the God of your ancestors.' The Hebrew reads 'your fathers,' preserving the covenant formula used throughout Deuteronomy.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 건너갈 때에, 네 하나님 야훼께서 네게 주시는 땅, 곧 젖과 꿀이 흐르는 땅에 들어갈 수 있도록, 너는 그 돌들 위에 이 율법의 모든 말씀을 기록하십시오.[a] 이는 네 조상들의 하나님 야훼께서 네게 말씀하신 대로입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 가르침의 모든 말씀’. 히브리어 토라는 ‘율법’뿐 아니라 ‘가르침’도 뜻할 수 있지만, 여기서는 언약적 문맥상 ‘율법’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 아버지들의 하나님’. 히브리어는 신명기에서 반복되는 언약 공식인 남성 복수 ‘아버지들’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ עֲלֵיהֶן
  english_pob_choice: And you shall write on them
  chosen_korean: 그리고 너희는 그 돌들 위에 기록해야 합니다
  alternatives_korean:
  - 그리고 그것들 위에 기록해야 합니다
  - 그 위에 써야 합니다
  lexicon: WLC/HALOT
  rationale: 대상은 앞절의 돌들이므로 ‘그 돌들 위에’가 지시 대상을 분명히 하며, ‘기록하다’는 דין문맥의 공식적 쓰기를 살립니다.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  english_pob_choice: all the words of this law
  chosen_korean: 이 율법의 모든 말씀
  alternatives_korean:
  - 이 율법의 모든 말
  - 이 가르침의 모든 말씀
  lexicon: WLC/HALOT
  rationale: דִּבְרֵי는 단순한 내용보다 ‘말씀들’로, תּוֹרָה는 이 문맥에서 언약적·법적 의미의 ‘율법’이 가장 직접적입니다.
- source_word: בְּעָבְרֶךָ
  english_pob_choice: when you cross over
  chosen_korean: 너희가 건너갈 때
  alternatives_korean:
  - 너희가 건너는 때
  - 너희가 강을 건널 때
  lexicon: WLC/HALOT
  rationale: 요단 횡단을 가리키는 관용적 표현을 자연스러운 현재적 사건으로 살렸고, 공식명 ‘건너갈 때’가 명령문의 시간 조건을 유지합니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: WLC/HALOT
  rationale: 성경적 관용구를 그대로 옮겨 풍요의 이미지를 보존했습니다. ‘젖’은 전통적이지만 본문 어휘를 가장 직접적으로 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신적 고유명은 ‘야훼’로 옮겨 언약 이름의 직접성을 유지합니다.
- source_word: אֱלֹהֶיךָ / אֱלֹהֵי אֲבֹתֶיךָ
  english_pob_choice: your God / the God of your fathers
  chosen_korean: 너희의 하나님 / 너희 조상의 하나님
  alternatives_korean:
  - 너의 하나님 / 네 조상의 하나님
  - 너희 하나님 / 너희 선조의 하나님
  lexicon: project default
  rationale: 복수 호칭을 반영해 청중 전체를 향한 언약 خطاب을 살렸고, ‘조상’보다 본문 대응이 분명한 ‘조상’ 표현을 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용하는 언약명 יהוה를 한국어에서 음역해, 일반 명칭 ‘주님’과 구별되는 고유성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: תּוֹרָה의 의미 범위
  chosen_reading: 율법
  alternative_readings:
