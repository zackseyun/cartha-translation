  lexicon: HALOT
  rationale: 언약 저주 선언문의 판정형을 현대 합쇼체로 자연스럽게 옮기면서, 단순 과거형보다 선언적·법적 어감을 살렸습니다.
- source_word: שֹׁכֵב עִם
  english_pob_choice: lies with
  chosen_korean: 동침하는
  alternatives_korean:
