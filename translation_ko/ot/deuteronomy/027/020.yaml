  lexicon: HALOT
  rationale: 히브리어의 성적 관용구를 너무 노골적이거나 설명적으로 풀지 않고, 문맥상의 법적·성적 금기를 드러내는 표현으로 옮겼습니다.
- source_word: אֵשֶׁת אָבִיו
  english_pob_choice: his father's wife
  chosen_korean: 아버지의 아내
  alternatives_korean:
  - 아버지의 부인
  - 그의 계모
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지해 본문의 범주를 과도하게 특정하지 않았습니다. 영어 POB의 주석처럼 경우에 따라 계모를 가리킬 수 있지만, 본문 자체는 그 용어를 쓰지 않습니다.
- source_word: כְּנַף אָבִיו
  english_pob_choice: his father's covering
  chosen_korean: 자기 아버지의 덮개
  alternatives_korean:
  - 자기 아버지의 치마폭
  - 자기 아버지의 벌거벗음
  lexicon: HALOT
  rationale: כָּנָף의 문자적 뜻을 살리면서도 여기서의 성적 완곡어법을 보존하기 위해 ‘덮개’를 택했습니다. ‘치마폭’은 한국어 문화 배경에 치우치고, ‘벌거벗음’은 원문의 명사 이미지를 넘어섭니다.
- source_word: וְאָמַר כָּל הָעָם אָמֵן
  english_pob_choice: And all the people shall say, ‘Amen.’
  chosen_korean: 그리고 모든 백성은 「아멘」이라고 말할 것입니다
  alternatives_korean:
  - 그러면 모든 백성은 「아멘」이라고 말할 것입니다
  - 모든 백성은 「아멘」이라고 할 것입니다
  lexicon: HALOT
  rationale: 회중의 응답 공식이므로 미래형의 선언적 어조를 유지했고, 아멘은 음역으로 보존했습니다.
theological_decisions:
- issue: 성적 관용구의 직설화 여부
  chosen_reading: 본문의 완곡어법을 유지하여 ‘아버지의 아내’와 ‘아버지의 덮개’라는 두 이미지를 함께 살렸습니다.
  alternative_readings:
  - 아버지의 벌거벗음을 드러냈기 때문입니다
  - 아버지의 결혼 자리를 침범했기 때문입니다
  rationale: 레위기 18:8, 20:11과 연결되는 금기 언어를 평이한 설명으로 평탄화하지 않고, 모호하지만 중요한 상호본문성을 보존하기 위함입니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
