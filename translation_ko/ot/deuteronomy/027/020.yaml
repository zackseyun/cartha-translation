revisions:
- from: 아버지의 아내와 동침하는 사람은 저주를 받을 것입니다. 이는 그가 자기 아버지의 덮개를 드러냈기 때문입니다. 그리고 모든 백성은 「아멘」이라고 말할 것입니다.[a][b]
  to: 자기 아버지의 아내[a]와 동침하는 자는 저주를 받을 것입니다. 그가 자기 아버지의 옷자락[b]을 들추었기 때문입니다. 그리고 모든 백성은 ‘아멘’이라고 응답할 것입니다.
  rationale: 각주 표지를 해당 본문 어구에 연결하고, 서로 뒤바뀐 주석의 적용 대상을 바로잡았습니다. 또한 כְּנַף의 문자적 이미지를 ‘옷자락’으로 옮기되, 그 표현이 성적 완곡어법으로 기능하는 해석적 차원은 각주에서 밝혔습니다. ‘계모’는 본문이 아니라 각주에만 남겨 원문의 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:50Z'
