  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
  footnotes:
  - marker: a
    text: Or 'treats lightly,' 'despises,' or 'shows contempt for.' The Hebrew verb conveys treating someone as insignificant or contemptible.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 아버지나 어머니를 업신여기는[a] 자는 저주를 받습니다. 모든 백성은 “아멘”이라고 말해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘가볍게 여기다’라는 뜻도 있어, ‘업신여기다’, ‘경멸하다’, ‘가볍게 여기다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주받은 자는
  lexicon: HALOT
  rationale: 언약 저주 공식의 선언문이므로 상태를 묘사하는 표현보다 선고형 문장이 자연스럽고, 합쇼체로도 법적·예전적 엄숙성을 살릴 수 있습니다.
- source_word: מַקְלֶה
  english_pob_choice: dishonors
  chosen_korean: 업신여기는
  alternatives_korean:
  - 멸시하는
  - 경멸하는
  - 가볍게 여기는
  lexicon: HALOT
  rationale: 히필의 핵심은 대상을 ‘가볍게/하찮게’ 여기며 존중을 훼손하는 것이므로, 사회적 모욕의 힘을 가진 ‘업신여기다’가 가장 가깝습니다.
- source_word: אָבִיו / אִמּוֹ
  english_pob_choice: his father / his mother
  chosen_korean: 자기 아버지나 어머니
  alternatives_korean:
  - 그의 아버지나 어머니
  - 아버지와 어머니
  lexicon: HALOT
  rationale: 히브리어의 3인칭 소유를 자연스럽게 살리면서도, 영어 POB의 분배적 의미를 따라 부모 어느 한쪽을 해치는 경우를 포함하도록 옮겼습니다.
- source_word: אָמֵן
  english_pob_choice: Amen
  chosen_korean: '"아멘"'
  alternatives_korean:
  - '"그렇게 되기를"'
  - '"진실로"'
  lexicon: HALOT
  rationale: 예전적 응답은 음역을 유지하는 것이 한국 교회 독자에게도 가장 익숙하고, 원문의 응답 형식을 그대로 드러냅니다.
theological_decisions:
- issue: 부모에 대한 죄의 성격
  chosen_reading: 단순한 감정적 미움이 아니라 부모를 하찮게 여기며 공적으로 존중을 훼손하는 행위로 옮겼습니다.
  alternative_readings:
  - 미워하는 자
  - 저주하는 자
  rationale: 히브리어 동사는 ‘가볍게 여기다’의 의미를 가지므로, 명령문의 윤리적 무게와 신명기의 부모 공경 전통을 해치지 않으면서도 원문 범위를 넘지 않게 해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than over-resolve'
