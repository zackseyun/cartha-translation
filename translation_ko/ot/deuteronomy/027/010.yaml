  text: וְ/שָׁ֣מַעְתָּ֔ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/עָשִׂ֤יתָ אֶת מִצְוֺתָ/ו֙ וְ/אֶת חֻקָּ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
  footnotes:
  - marker: a
    text: Or 'obey the voice of the LORD your God.' The Hebrew idiom 'listen to the voice' often includes the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 너희의 하나님 야훼의 음성을 들으며, 내가 오늘 너희에게 명령하는 그의 명령들과 그의 규례들을 행해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 하나님 야훼의 음성에 순종하라’. 히브리어 관용구 ‘~의 음성을 듣다’는 흔히 순종의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  english_pob_choice: So you shall listen
  chosen_korean: 들으며
  alternatives_korean:
  - 들어야 합니다
  - 순종해야 합니다
  lexicon: HALOT
  rationale: שׁמע는 כאן에서 ‘듣다’의 기본 의미를 유지하되, 이어지는 ‘행하다’와 함께 청종의 뜻이 드러나므로 ‘들으며’로 옮겨 히브리어 관용을 살렸습니다.
- source_word: בְּקוֹל
  english_pob_choice: to the voice
  chosen_korean: 음성을
  alternatives_korean:
  - 소리를
  - 말씀을
  lexicon: HALOT
  rationale: ‘voice’의 문자적 대응을 유지하여 ‘야훼의 음성’이라는 언약적 표현을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신성명은 관습적 대체어가 아니라 고유명사로서 ‘야훼’로 옮겨, 원문의 인칭적 언약 이름을 드러냈습니다.
- source_word: מִצְוֺתָיו / חֻקָּיו
  english_pob_choice: his commandments and his statutes
  chosen_korean: 그의 명령들과 그의 규례들
  alternatives_korean:
  - 그의 계명들과 그의 법도들
  - 그의 명령들과 그의 법령들
  lexicon: HALOT
  rationale: מִצְוָה와 חֹק의 구별을 살리면서도 현대 한국어에서 자연스러운 법적·언약적 표현으로 각각 ‘명령들’과 ‘규례들’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘주’로 대체하지 않고 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 신적 호칭이 아니라 언약 이름을 직접 사용하므로, 대체 칭호보다 고유명을 드러내는 번역이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
