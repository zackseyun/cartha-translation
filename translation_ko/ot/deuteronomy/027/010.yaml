translation:
  language: ko
  text: 그러므로 너는 네 하나님 야훼의 음성을 듣고, 내가 오늘 네게 명령하는 그의 명령들과 그의 규례들을 행해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
