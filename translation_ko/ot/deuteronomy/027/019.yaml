review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 מִשְׁפַּט은 이 문맥에서 사회적 약자들에게 마땅히 보장되어야 할 법적 권리 또는 공의를 가리키므로, 단순히 ‘정의’라고만 하면 목적격 관계가 다소 불분명해집니다. וְאָמַר은 의례적 응답을 나타내며 ‘그러면’이라는 명시적 순서 표지는 원문에 없습니다.
  naturalness: ‘정의를 굽게 하는 사람’은 현대 한국어에서 다소 어색하고 추상적입니다. ‘그들에게 마땅히 돌아갈 공의를 왜곡하는 자’가 법률적 문맥과 현대적 자연스러움을 함께 살립니다. 문두의 저주 선언은 ‘…자는 저주를 받을 것입니다’가 합쇼체로 자연스럽습니다.
  terminology: ‘나그네’는 גֵּר의 역사적·사회적 범주를 보존하는 적절한 선택이며, 문화 주석으로 보완한 것도 좋습니다. ‘고아’와 ‘과부’도 자연스럽습니다. אָמֵן은 ‘아멘’으로 음역하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘정의를 굽게 하는’의 의미 관계와 자연스러움
    rationale: מַטֶּה מִשְׁפַּט은 특정 취약 집단에게 속하거나 돌아가야 할 공의/법적 권리를 왜곡하는 행위입니다. 현 번역은 이 관계가 충분히 드러나지 않고 ‘정의를 굽게 하다’도 현대어로 부자연스럽습니다.
  - severity: low
    issue: ‘그러면’의 추가
    rationale: 원문의 접속사 וְ는 단순 연결이며, ‘그러면’이 암시하는 결과·순서 관계를 반드시 요구하지 않습니다.
  - severity: low
    issue: 의례적 응답의 표기
    rationale: ‘아멘’은 인용된 응답 자체이므로 ‘“아멘!” 하고 말할 것입니다’처럼 처리하면 낭독 문맥에서 더 자연스럽습니다.
  revised_text: 나그네와 고아와 과부에게 마땅히 돌아갈 공의를 왜곡하는 자는 저주를 받을 것입니다. 모든 백성은 “아멘!” 하고 말할 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘나그네’는 이스라엘 공동체 안에 거주하는 비토착민을 가리킵니다.
    reason: cultural_note
  revision_rationale: 법적 맥락의 מִשְׁפַּט을 ‘그들에게 마땅히 돌아갈 공의’로 옮겨 보호 대상 집단의 권리라는 의미를 분명히 했고, מַטֶּה는 현대 한국어에서 자연스러운 ‘왜곡하는’으로 표현했습니다. 원문에 없는 ‘그러면’은 삭제했으며, 의례적 응답을 자연스럽게 다듬었습니다. 나그네에 대한 기존 문화 주석은 유지합니다.
