  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
  footnotes:
  - marker: a
    text: Or “turns aside the justice of the sojourner, the fatherless, and the widow.”
    reason: lexical_alternative
  - marker: b
    text: “Sojourner” translates Hebrew ger, a non-native resident living among Israel.
    reason: cultural_note
  - marker: c
    text: “Fatherless” may also be rendered “orphan.”
    reason: lexical_alternative
translation:
  language: ko
  text: 저주를 받을 자는 나그네[a]와 고아와 과부의 정의를 굽게 하는 사람입니다. 그러면 모든 백성이 “아멘”이라고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 이스라엘 공동체 안에 거주하는 비토착민을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 자는
  alternatives_korean:
  - 저주받은 자는
  - 저주가 있을 자는
  lexicon: WLC
  rationale: 언약 저주의 선포문 형식을 살리면서도 현대 한국어에서 자연스럽고 무게감 있게 전달하기 위해 ‘저주를 받을 자’로 옮겼습니다.
- source_word: מַטֶּה מִשְׁפַּ֥ט
  english_pob_choice: perverts the justice due to
  chosen_korean: 정의를 굽게 하는
  alternatives_korean:
  - 정의를 왜곡하는
  - 재판을 굽게 하는
  - 정당한 판결을 틀어버리는
  lexicon: WLC
  rationale: ‘mattēh’의 ‘굽히다/비틀다’ 이미지를 살려 법적 부정을 직접적으로 드러내는 표현으로 옮겼습니다. ‘정의 due to’의 설명적 요소는 한국어에서 부자연스러워 간결하게 ‘정의를 굽게 하는’으로 처리했습니다.
- source_word: גֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인
  - 거주 외국인
  lexicon: WLC
  rationale: 공동체 안에 거주하는 취약한 외래 거주자를 가리키는 법적 의미를 살리되, 한국어 성경에서 널리 알아볼 수 있는 ‘나그네’를 택했습니다.
- source_word: יָתוֹם וְאַלְמָנָה
  english_pob_choice: the fatherless, and the widow
  chosen_korean: 고아와 과부
  alternatives_korean:
  - 부친 없는 자와 과부
  - 고아와 미망인
  lexicon: WLC
  rationale: 히브리어의 사회적 약자 범주를 한국어에서 가장 직접적으로 드러내는 표준 표현입니다. ‘fatherless’의 문자성을 살리기보다 문맥상 관용적 대응인 ‘고아’가 더 자연스럽습니다.
- source_word: וְאָמַר כָּל הָעָם אָמֵן
  english_pob_choice: And all the people shall say… “Amen.”
  chosen_korean: 그러면 모든 백성이 “아멘”이라고 말할 것입니다.
  alternatives_korean:
  - 그리고 모든 백성이 “아멘”이라 할 것입니다.
  - 모든 백성이 “아멘”이라고 답할 것입니다.
  lexicon: WLC
  rationale: 의식적 응답 문맥이므로 미래형 예고보다는 공동체의 반응을 지시하는 형식으로 ‘말할 것입니다’를 유지했고, ‘아멘’은 음역으로 보존했습니다.
theological_decisions:
- issue: 취약한 사회집단을 가리키는 언약법의 삼중 범주 표현
  chosen_reading: 나그네, 고아, 과부
  alternative_readings:
  - 외국인, 고아, 과부
  - 거류민, 고아, 과부
  rationale: 본문은 현대 정치적 범주가 아니라 이스라엘 언약 공동체 안에서 보호받아야 할 사회적 약자를 지칭합니다. ‘나그네’는 그 법적·사회적 위치를 가장 균형 있게 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean; consistency of key terms, or documented exception.'
