source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
  footnotes:
  - marker: a
    text: Or 'where you would sow your seed and water it with your foot,' expressing Egypt's habitual irrigation practices.
    reason: lexical_alternative
  - marker: b
    text: '''With your foot'' likely refers to foot-operated irrigation or to guiding water through channels by foot.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 당신이 들어가 차지하려는 땅이, 당신들이 거기서 나와 온 이집트 땅과 같지 않기 때문입니다. 거기서는 씨앗을 뿌리고 발로 물을 대어, 채소밭처럼 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘발로 물을 대어’는 발로 작동하는 관개 장치나, 발로 물길을 유도하는 방식을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 ... 때문입니다
  alternatives_korean:
  - 왜냐하면 ...이기 때문입니다
  - '...입니다'
  lexicon: HALOT
  rationale: 앞선 설명을 받는 인과를 분명히 하면서도, 한국어에서는 문두의 연결을 자연스럽게 살려 줍니다.
- source_word: בָא שָׁמָּה לְרִשְׁתָּהּ
  english_pob_choice: you are entering to possess
  chosen_korean: 당신이 들어가 차지하려는
  alternatives_korean:
  - 당신이 들어가 소유하려는
  - 당신이 들어가 차지할
  lexicon: HALOT
  rationale: ‘들어가’는 प्रवेश/입성의 동작을, ‘차지하려는’은 ירש의 땅 소유 맥락을 살리며 과도한 신학적 확장을 피합니다.
- source_word: בְרַגְלְךָ
  english_pob_choice: with your foot
  chosen_korean: 발로 물을 대어
  alternatives_korean:
  - 발로
  - 발로 물을 주어
  - 발로 물길을 조절하여
  lexicon: HALOT
  rationale: 직역만 하면 어색하므로, 발로 조작하는 관개 행위를 드러내는 동사를 보태되, 원문의 구체적 이미지는 유지합니다.
- source_word: כְּגַן הַיָּרָק
  english_pob_choice: like a vegetable garden
  chosen_korean: 채소밭처럼
  alternatives_korean:
  - 야채밭처럼
  - 푸성귀밭처럼
  - 채소 정원처럼
  lexicon: HALOT
  rationale: הַיָּרָק은 관개된 소규모 재배지를 가리키므로 현대 한국어에서 가장 자연스러운 ‘채소밭’으로 옮겼습니다.
theological_decisions:
- issue: 애굽의 관개 방식 묘사와 출애굽 기억
  chosen_reading: ‘거기서는 씨앗을 뿌리고 발로 물을 대어’로 옮겨, 애굽의 일상적 관개와 대비를 살렸습니다.
  alternative_readings:
  - ‘발로 관개하여’
  - ‘발로 물길을 돌려’
  rationale: 본문은 약속의 땅과 애굽을 농업 방식으로 대비하며, 출애굽의 기억을 배경으로 삼습니다. 기술적 이미지를 지우지 않는 것이 문맥상 중요합니다.
  doctrine_reference: 출애굽-약속의 땅 대비의 서사적 강조
