  source_fidelity: 개정안은 히브리어의 조건절(כִּי אִם), 강조된 ‘지키다’(שָׁמֹר תִּשְׁמְרוּן), 단수 집합명사 ‘이 모든 계명’, 그리고 사랑하고 걷고 붙드는 동사 연쇄를 보존합니다. 원문의 미완결 연결을 긴 대시로 유지합니다.
  naturalness: 초안에는 영어 ‘carefully’가 그대로 남아 있고, ‘지켜 그것을 행하여 … 매달리면’은 연결 어미와 조건절 종결이 섞여 부자연스럽습니다. ‘힘써 지켜 행하고 … 굳게 붙는다면’으로 고쳐 현대 표준어 합쇼체 성경 문맥에 자연스럽게 맞추었습니다.
  terminology: ‘야훼’는 제공된 번역 원칙과 일치합니다. דבק은 한국어에서 의존적·물리적으로 들릴 수 있는 ‘매달리다’보다, 언약적 결속의 뜻을 자연스럽게 전달하는 ‘굳게 붙다’로 옮겼습니다. ‘그의 모든 길을 따라 걸으며’는 원문의 ‘걷다’ 은유를 유지합니다.
