base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
  footnotes:
  - marker: a
    text: Or 'you diligently keep.' The Hebrew intensifies the verb with an infinitive absolute.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all this commandment' (singular), likely a collective expression for the covenant charge as a whole.
    reason: lexical_alternative
  - marker: c
    text: Or 'hold fast to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 여러분이 내가 여러분에게 명령하는 이 모든 계명을[b] 힘써[a] 지켜 행하고, 여러분의 하나님 야훼를 사랑하며, 그의 모든 길을 따라 걸으며, 그에게 굳게 붙는다면[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘써 지켜’는 히브리어에서 부정사 절대형과 같은 어근의 동사를 함께 써 강조한 표현입니다. ‘부지런히 지키다’ 또는 ‘세심히 지키다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형 ‘이 모든 계명’을 사용합니다. 이는 언약의 요구 전체를 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게 굳게 매달린다면’ 또는 ‘그를 굳게 붙잡는다면’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일
  alternatives_korean:
  - 과연
  - 참으로
  lexicon: HALOT
  rationale: 조건을 여는 표현으로 자연스러운 한국어는 ‘만일’이며, 앞절과의 연결을 살리되 과도한 해석을 덧붙이지 않습니다.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  english_pob_choice: you carefully keep
  chosen_korean: carefully 지켜
  alternatives_korean:
  - 부지런히 지켜
  - 힘써 지켜
  lexicon: HALOT
  rationale: 동사 어근의 중첩이 주는 강조를 한국어에서는 부사적으로 살려, 단순한 준수가 아니라 세심하고 강한 준수를 드러냈습니다.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  english_pob_choice: all this commandment
  chosen_korean: 이 모든 계명
  alternatives_korean:
  - 이 온 계명
  - 이 전체 계명
  lexicon: HALOT
  rationale: 히브리어 단수형을 집합적으로 받아 ‘계명들’로 분산시키지 않고, 하나의 언약적 요구 전체를 가리키는 뜻을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 번역의 기본 원칙에 따라 신명은 대체 титl가 아니라 고유명 ‘야훼’로 옮겨, 언약 이름의 직접성을 보존했습니다.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  english_pob_choice: to walk in all his ways
  chosen_korean: 그의 모든 길로 걸으며
  alternatives_korean:
  - 그의 모든 길 안에서 걸으며
  - 그의 모든 길을 따라 살며
  lexicon: HALOT
  rationale: ‘걷다’의 성경적 은유를 유지해 행위와 삶의 방향성을 살렸고, ‘길’도 직역에 가깝게 보존했습니다.
- source_word: וּלְדָבְקָה בוֹ
  english_pob_choice: and to cling to him
  chosen_korean: 그에게 매달리면
  alternatives_korean:
  - 그에게 붙들리면
  - 그를 굳게 붙잡으면
  lexicon: HALOT
  rationale: דבק의 밀착·부착 의미를 현대 한국어의 ‘매달리다’로 옮겨 관계적 집착과 의존의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 언약 순종의 연쇄 구조를 한국어로 어떻게 살릴지
  chosen_reading: ‘사랑하고, … 걸으며, … 매달리면’의 나열을 유지해 계명 준수의 내용과 방향을 드러냈습니다.
  alternative_readings:
  - ‘사랑하며, … 따르며, … 충실하면’처럼 매끈하게 의역
  - 행위 중심으로만 재구성
  rationale: 본문은 계명의 내용을 설명하는 목적/내용 구문을 이어 주므로, 동사들의 연쇄를 보존해야 언약적 요구의 폭과 긴장이 유지됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
- issue: 하나님 이름의 번역
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문의 יְהוָה는 고유한 언약 이름이므로, 대체 호칭보다 직접 음역을 택해 본문이 지닌 신학적 식별성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
