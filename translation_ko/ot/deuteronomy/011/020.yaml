  - marker: b
    text: ‘성문들’은 문 자체뿐 아니라 성문이 있는 출입 공간까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  english_pob_choice: And you shall write them
  chosen_korean: 너희는 그것들을 … 기록해야 합니다
  alternatives_korean:
  - 너희는 그것들을 … 써야 합니다
  - 너희는 그것들을 … 적어야 합니다
  lexicon: WLC; HALOT
  rationale: 명령적 미래의 법문 맥락을 살려 ‘기록해야 합니다’로 옮겼고, 3인칭 복수 접미사는 앞절의 말씀/계명들을 가리키므로 ‘그것들’로 유지했습니다.
- source_word: מְזוּזוֹת
  english_pob_choice: doorposts
  chosen_korean: 문설주
  alternatives_korean:
  - 문틀
  - 문기둥
  lexicon: HALOT
  rationale: 문의 좌우 기둥을 가리키는 일반 명사로서, later Jewish term인 음역 대신 직접적이고 표준적인 ‘문설주’를 택했습니다.
- source_word: בֵּיתֶךָ
  english_pob_choice: of your house
  chosen_korean: 네 집의
  alternatives_korean:
  - 네 집안의
  - 네 가정의
  lexicon: HALOT
  rationale: בַּיִת의 구체적 의미를 살려 ‘집’으로 번역했고, 언약적 가정/가문 맥락을 해치지 않도록 소유격 형태로 자연스럽게 연결했습니다.
- source_word: וּבִשְׁעָרֶיךָ
  english_pob_choice: and on your gates
  chosen_korean: 네 성문들에
  alternatives_korean:
  - 네 문들에
  - 네 성문 곁에
  - 네 성문에
  lexicon: HALOT
  rationale: שַׁעַר은 단순한 문보다 성읍이나 집단의 출입구를 뜻하는 경우가 많아, POB의 ‘gates’에 맞추어 ‘성문들’로 옮겼습니다.
theological_decisions:
- issue: 집/성문에 계명을 기록하라는 언약적 표지의 성격
  chosen_reading: 이 절은 계명을 공적·사적 생활공간에 새겨 두라는 지속적 순종의 표지로 읽었습니다.
  alternative_readings:
  - 단순한 문자적 장식 지시로만 읽는 해석
  - 후대 유대 관습의 mezuzah 제도와 직접 동일시하는 해석
  rationale: 본문 자체는 공동체 생활공간에 말씀을 상시적으로 부착하라는 명령이며, 후대 제도는 직접 끌어오지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 언약 순종과 말씀의 상시적 기억
