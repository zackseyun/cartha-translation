base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''your eyes, the ones seeing''—an emphatic way of saying they were eyewitnesses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희의 눈이 친히 야훼께서 행하신 그 큰 일을 모두 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘너희의 눈, 보는 눈들’이라는 강조적 표현으로, 너희가 직접 목격했다는 뜻을 강하게 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 앞선 권면을 받치는 이유를 제시하므로, 합쇼체에서 자연스러운 설명 연결인 '이는 … 때문입니다'로 옮겼습니다.
- source_word: עֵינֵיכֶם הָרֹאֹת
  english_pob_choice: your own eyes have seen / are the ones seeing
  chosen_korean: 너희의 눈이 친히 보고
  alternatives_korean:
  - 너희의 눈이 보고
  - 너희 눈으로 직접 보았기
  lexicon: HALOT
  rationale: '''너희의 눈''과 분사적 강조를 살려, 단순 시각이 아니라 직접 목격했다는 점을 ''친히''로 드러냈습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 고유명사로 보존해야 하므로, 관습적 대체호칭 대신 '야훼'를 사용했습니다.
- source_word: מַעֲשֵׂה … הַגָּדֹל
  english_pob_choice: all the great work
  chosen_korean: 그 큰 일을 모두
  alternatives_korean:
  - 그 큰 사역을 모두
  - 그 عظ大한 행사를 모두
  lexicon: HALOT
  rationale: 단수 '일/행위'의 총체를 가리키는 표현이므로, 하나님의 행사를 포괄하는 '그 큰 일'로 옮겼습니다.
theological_decisions:
- issue: 직접 목격의 강조를 한국어에서 어떻게 살릴지
  chosen_reading: '''너희의 눈이 친히 보고''로, 단순 과거 완료보다 목격 증언의 강세를 드러냈습니다.'
  alternative_readings:
  - '''너희의 눈이 보았습니다'''
  - '''너희의 눈으로 보았습니다'''
  rationale: 히브리어는 '너희의 눈, 곧 보는 눈'이라는 강조적 구조로 증인의 직접성을 부각합니다. 이를 한국어에서도 분명히 살려, 권면의 근거가 간접 전언이 아니라 직접 목격임을 보존했습니다.
  doctrine_reference: 본문의 수사적 강조에 대한 번역 결정
