translation:
  language: ko
  text: 스스로 조심하십시오. 너희 마음이 미혹되어[a] 너희가 돌아서서 다른 신들을 섬기고 그들에게 절하지 않도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘설득되다’, ‘유혹되다’, ‘속다’라는 의미 범위를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  english_pob_choice: Be careful
  chosen_korean: 스스로를 조심하여
  alternatives_korean:
  - 주의하십시오
  - 깨어 있으십시오
  - 스스로를 지키십시오
  lexicon: HALOT
  rationale: 재귀적 경고 표현으로서 단순한 주의 촉구보다 자기 자신을 향한 경계의 뉘앙스를 살렸습니다.
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: '...하지 않도록 하십시오'
  alternatives_korean:
  - '...하지 않게 하십시오'
  - '...할까 하여'
  - '...되지 않도록'
  lexicon: HALOT
  rationale: פֶּן의 경고적 부정절을 현대 한국어에서 자연스럽고 격식 있게 풀어 옮겼습니다.
- source_word: יִפְתֶּה
  english_pob_choice: be deceived
  chosen_korean: 미혹되어
  alternatives_korean:
  - 속임을 받아
  - 유혹되어
  - 기만당하여
  lexicon: HALOT
  rationale: 이 동사는 ‘설득되다/유혹되다/속다’의 폭을 가지며, 문맥상 마음이 잘못된 방향으로 끌려가는 경고를 담아 ‘미혹되다’로 옮겼습니다.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  english_pob_choice: and serve other gods
  chosen_korean: 다른 신들을 섬기고
  alternatives_korean:
  - 다른 신들을 섬기며
  - 다른 신들을 섬기게 되고
  - 다른 신들을 예배하고
  lexicon: HALOT
  rationale: עבד는 신들에게 대한 종교적 봉사를 가리키므로, 직접적으로 ‘섬기다’로 옮겨 우상숭배의 행위를 분명히 했습니다.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  english_pob_choice: and bow down to them
  chosen_korean: 그들에게 엎드려 경배하지 않도록 하십시오
  alternatives_korean:
  - 그들 앞에 몸을 굽히지 않도록 하십시오
  - 그들에게 절하지 않도록 하십시오
  - 그들에게 엎드리지 않도록 하십시오
  lexicon: HALOT
  rationale: השתחוה의 문자적 ‘엎드림’과 예배적 의미를 함께 살리기 위해 ‘엎드려 경배하다’로 옮겼습니다.
theological_decisions:
- issue: 경고의 진행 구조
  chosen_reading: 마음의 미혹 → 돌아섬 → 다른 신 섬김 → 엎드려 경배함의 순서를 그대로 드러냈습니다.
  alternative_readings:
  - ‘미혹’과 ‘돌아서다’를 합쳐 더 간결하게 만들 수 있습니다.
  - ‘경배’만으로 마무리해도 의미는 전달됩니다.
  rationale: 히브리어 문장의 단계적 진행이 아포스테이아의 심화 과정을 보여 주므로, 그 흐름을 압축하지 않고 보존했습니다.
  doctrine_reference: 신 11:16의 문맥상 우상숭배 경고
