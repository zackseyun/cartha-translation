  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
  footnotes:
  - marker: a
    text: Hebrew 'the whole commandment'; the singular 'commandment' functions collectively, meaning the full body of commands.
    reason: lexical_alternative
  - marker: b
    text: Or 'be strengthened.' The Hebrew verb can denote becoming strong or being made strong in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'inherit' / 'take possession of' for 'possess' in both occurrences of the verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 오늘 내가 여러분에게 명령하는 모든 계명을 지키십시오. 그러면 여러분은 강해져서, 여러분이 건너가 차지하려는 그 땅에 들어가 그 땅을 차지할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: So keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 간직하십시오
  - 준수하십시오
  - 지키고 따르십시오
  lexicon: HALOT
  rationale: 언약적·법적 문맥에서 שׁמר는 계명을 ‘지키다’로 옮기는 것이 가장 자연스럽고, 현대 한국어에서도 명령형으로 분명하게 전달됩니다.
- source_word: כָּל הַמִּצְוָה
  english_pob_choice: every commandment
  chosen_korean: 모든 계명
  alternatives_korean:
  - 온 계명
  - 하나의 계명 전체
  - 각각의 계명
  lexicon: HALOT
  rationale: 히브리어의 단수형 집합명사를 한국어에서는 ‘모든 계명’으로 풀어, 전체 명령 체계를 포괄하는 뜻을 자연스럽게 살렸습니다.
- source_word: תֶּחֶזְקוּ
  english_pob_choice: you may be strong
  chosen_korean: 강해지고
  alternatives_korean:
  - 힘을 얻고
  - 강건해지고
  - 굳세어지고
  lexicon: HALOT
  rationale: 문맥상 단순한 감정적 용기보다 앞으로의 순종과 정복을 감당할 ‘강함’을 뜻하므로, 결과절의 동작으로 ‘강해지고’가 적절합니다.
- source_word: וִירִשְׁתֶּם / לְרִשְׁתָּהּ
  english_pob_choice: possess / to possess
  chosen_korean: 차지하다
  alternatives_korean:
  - 소유하다
  - 상속하다
  - 점유하다
  lexicon: HALOT
  rationale: ירשׁ는 여기서 땅을 차지하여 자기 것으로 삼는 의미가 핵심이므로, 현대 독자에게 분명한 ‘차지하다’를 택했습니다.
theological_decisions:
- issue: 이동과 점유를 결합한 반복 표현
  chosen_reading: “그 땅으로 들어가 그것을 차지할 수 있습니다… 건너가고 있는 그 땅입니다”로 두 번의 ירשׁ/בוא를 모두 살렸습니다.
  alternative_readings:
  - “들어가서 그 땅을 차지할 수 있습니다”처럼 반복을 한 번만 옮김
  - “상속할 수 있습니다”로 법적 의미를 강조
  rationale: 본문은 들어감과 차지함, 그리고 그 목적을 반복적으로 연결하므로, 한국어에서도 두 동작과 목적절을 모두 드러내 의미 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §6; source-text priority
