base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'that I am giving before you today'; the Hebrew idiom means 'setting before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내가 오늘 너희 앞에 두는 모든 규례와 법도를 행하도록 조심해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 오늘 너희 앞에 주는’이지만, 히브리어 관용구는 ‘너희 앞에 두는/제시하는’ 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: you shall be careful
  chosen_korean: 조심해야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 유의해야 합니다
  lexicon: HALOT
  rationale: לשמר plus לַעֲשׂוֹת의 결합은 단순한 보존보다 ‘주의를 기울여 실행함’을 뜻하므로, ‘조심해야 합니다’가 경고적·명령적 뉘앙스를 잘 살립니다.
- source_word: לַ/עֲשׂוֹת
  english_pob_choice: to do
  chosen_korean: 행하도록
  alternatives_korean:
  - 실행하도록
  - 지키도록
  lexicon: HALOT
  rationale: עשה는 계명을 실제로 수행하는 뜻이므로, 규정들을 ‘행하다’로 옮겨 법문체를 자연스럽게 유지했습니다.
- source_word: הַֽ/חֻקִּים וְ/אֶת הַ/מִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 모든 규례와 법도
  alternatives_korean:
  - 모든 규정과 판결
  - 모든 율례와 판단
  lexicon: HALOT
  rationale: חֻקִּים과 מִשְׁפָּטִים는 둘 다 법적 명령이지만 어감이 다르므로, 한국어에서도 서로 겹치지 않는 두 낱말인 ‘규례’와 ‘법도’로 분리해 대응했습니다.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  english_pob_choice: that I am setting before you
  chosen_korean: 내가 오늘 너희 앞에 두는
  alternatives_korean:
  - 내가 오늘 너희 앞에 주는
  - 내가 오늘 너희 앞에 제시하는
  lexicon: HALOT
  rationale: נתן + לִפְנֵי creates an idiom meaning ‘set before’; ‘두는’이 한국어에서 이 관용을 가장 직접적으로 살리며, ‘오늘’을 함께 붙여 현재적 제시의 긴박함을 보존했습니다.
theological_decisions:
- issue: 언약적 명령문의 강도
  chosen_reading: ‘조심해야 합니다’로 옮겨 단순 정보가 아니라 언약 순종을 요구하는 강한 명령으로 들리게 했습니다.
  alternative_readings:
  - ‘지켜야 합니다’
  - ‘반드시 해야 합니다’
  rationale: 본문은 선택적 권고가 아니라 율법 준수의 요구이므로, 주의 깊은 이행을 드러내는 표현이 문맥상 적절합니다.
  doctrine_reference: 신명기 언약 갱신 문맥
