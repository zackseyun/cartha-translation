  source_fidelity: 히브리어의 ‘주의하여/조심하여 행하라’는 명령, ‘모든’, 그리고 חֻקִּים과 מִשְׁפָּטִים의 구별을 대체로 충실히 반영했습니다. 다만 ‘행하도록 조심해야 합니다’는 한국어에서 목적·방법 관계가 다소 어색하게 들릴 수 있어, 주의 깊은 이행이라는 원문의 결합을 더 직접적으로 표현하는 것이 좋습니다.
  naturalness: ‘주의하여 행해야 합니다’가 현대 표준어 합쇼체에서 자연스럽고, 법적·권면적 문맥에도 잘 맞습니다. 각주 표지는 관용구가 해당하는 ‘너희 앞에 두는’ 바로 뒤에 두어 지시 범위를 분명히 했습니다.
  terminology: ‘규례와 법도’는 חֻקִּים과 מִשְׁפָּטִים을 구별하려는 적절한 선택입니다. ‘법도’는 다소 문어적이지만 본문의 법적·언약적 격식에 부합합니다.
