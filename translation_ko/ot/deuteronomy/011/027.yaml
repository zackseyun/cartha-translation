base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
  footnotes:
  - marker: a
    text: Or 'the blessing that comes when you obey the commandments of the LORD your God.' The Hebrew uses a relative particle with conditional sense.
    reason: lexical_alternative
  - marker: b
    text: '''Listen to'' can also be rendered ''obey,'' since in Hebrew this verb often carries the sense of hearing with responsive obedience.'
