  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
  footnotes:
  - marker: a
    text: Or 'the blessing that comes when you obey the commandments of the LORD your God.' The Hebrew uses a relative particle with conditional sense.
    reason: lexical_alternative
  - marker: b
    text: '''Listen to'' can also be rendered ''obey,'' since in Hebrew this verb often carries the sense of hearing with responsive obedience.'
    reason: lexical_alternative
translation:
  language: ko
  text: 복이 있습니다[a]. 여러분이 야훼 여러분의 하나님께서[b] 오늘 여러분에게 명령하시는 계명들을 들으면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 야훼 여러분의 하나님께서 명령하시는 계명들을 순종하면 그 복이 있습니다.’ 여기서 히브리어 יחס절은 조건의 뜻을 가집니다.
    reason: alternative_reading
  - marker: b
    text: ‘들으면’은 히브리어에서 ‘순종하다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה
  english_pob_choice: the blessing
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 그 복이 있습니다
  - 복입니다
  lexicon: HALOT
  rationale: 앞 절의 ‘복과 저주’ 구도를 이어 가되, 한국어에서는 명사구를 그대로 두기보다 문장으로 풀어 자연스럽게 표현하는 편이 합쇼체 문맥에 맞습니다.
- source_word: תִּשְׁמְעוּ אֶל
  english_pob_choice: if you listen to
  chosen_korean: 들으면
  alternatives_korean:
  - 들어 순종하면
  - 듣고 따르면
  lexicon: HALOT
  rationale: שׁמע with אֶל은 단순 청취보다 응답적 청종을 포함하므로, 기본 의미인 ‘듣다’를 살리면서 조건문으로 처리했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 여호와 여러분의 하나님
  - 야훼 너희 하나님
  lexicon: HALOT
  rationale: יוָּה는 본 지침에 따라 ‘야훼’로 옮기고, 2인칭 복수는 문어체에서 자연스러운 ‘여러분의’로 처리했습니다.
- source_word: מְצַוֶּה אֶתְכֶם הַיּוֹם
  english_pob_choice: which I am commanding you today
  chosen_korean: 오늘 여러분에게 명령하시는
  alternatives_korean:
  - 오늘 여러분에게 명령하는
  - 오늘 여러분에게 명하고 있는
  lexicon: HALOT
  rationale: 분사 מְצַוֶּה의 현재적·진행적 힘을 살려 ‘명령하시는’으로 옮겼고, ‘오늘’은 언약적 긴급성을 유지합니다.
theological_decisions:
- issue: 조건절의 기능과 ‘복’의 표현 방식
  chosen_reading: ‘복이 있습니다… 들으면’으로 조건-결과 구조를 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘그 복은…’로 명사구를 더 직역할 수 있습니다.
  - ‘복을 받을 것입니다’로 결과를 풀 수 있습니다.
  rationale: 히브리어의 יחס/조건적 뉘앙스를 보존하면서도 한국어 독자가 즉시 이해할 수 있는 현대적 문장 구조를 택했습니다.
  doctrine_reference: Deuteronomy covenant blessing formula
- issue: 여호와/주로의 대체 여부
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주님’ 또는 ‘주’로 대체할 수 있습니다.
  rationale: 이 절은 하나님의 언약 이름을 직접 사용하므로, 제목어로 바꾸지 않고 고유명을 보존하는 것이 원문 신학을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
