source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 요단을 건너, 너희의 하나님 야훼[a]께서 너희에게 주시는 땅에 들어가 그것을 차지하려 하기 때문입니다. 너희는 그 땅을 차지하고 그곳에서 살게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’; 전통적으로는 ‘주’로 옮깁니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그런데 / 왜냐하면의 연결을 살린 “-하는데”
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞절의 권면을 받는 근거를 이어 주는 접속으로 이해하여, 한국어에서는 문맥상 자연스러운 연결형으로 처리했습니다.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  english_pob_choice: you are crossing the Jordan
  chosen_korean: 요단을 건너
  alternatives_korean:
  - 요단강을 건너
  - 요단을 건너가
  lexicon: HALOT
  rationale: 히브리어의 동작 진행성을 살리되, 한국어에서는 목적절 안에서 간결하게 ‘요단을 건너’로 옮기는 것이 가장 자연스럽습니다.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם
  english_pob_choice: to take possession of / you will take possession of
  chosen_korean: 차지하려고 / 차지하여
  alternatives_korean:
  - 소유하려고
  - 점유하려고
  - 유업으로 받으려고
  lexicon: HALOT
  rationale: Deuteronomy에서 땅을 ‘상속받는다’보다 실제로 ‘차지한다’는 점이 더 분명하므로, 한국어도 소유·정착의 현실적 함의를 드러내는 표현을 택했습니다.
- source_word: וִישַׁבְתֶּם בָּהּ
  english_pob_choice: live in it
  chosen_korean: 그곳에 살게 될 것입니다
  alternatives_korean:
  - 그 안에 거하게 될 것입니다
  - 그곳에 거주하게 될 것입니다
  lexicon: HALOT
  rationale: ‘거하다’보다 현대 한국어에서 바로 이해되는 ‘살다’가 본문의 정착 의미를 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 기록된 신명은 전통적 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, POB의 원문 추적 가능성을 살렸습니다.
theological_decisions:
- issue: 신명기적 땅 약속의 동사 연쇄(차지하다/살다)
  chosen_reading: ‘차지하다’와 ‘살다’를 분리하여, 약속된 땅을 실제로 점유하고 거주하게 되는 순서를 드러냈습니다.
  alternative_readings:
  - ‘소유하다’와 ‘거주하다’로 일반화
  - 한 번에 ‘차지하여 살다’로 압축
  rationale: 히브리어는 ‘들어가다–차지하다–살다’의 연속을 분명히 보여 주므로, 한국어도 그 순서를 보존하는 편이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: Deuteronomy 11:31 covenant land promise
- issue: 여호와의 이름 표기
  chosen_reading: YHWH는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문의 신명사적 고유성을 유지하기 위해 직역적 음역을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
