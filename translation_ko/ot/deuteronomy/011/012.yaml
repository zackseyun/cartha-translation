translation:
  language: ko
  text: 그 땅은 야훼 당신의 하나님께서 돌보시는 땅입니다[a]. 야훼 당신의 하나님의 눈은 한 해의 처음부터 끝까지 항상 그 땅을 향하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾으시는’ 또는 ‘살피시는’으로 옮길 수 있습니다. 히브리어 동사는 찾다, 살피다, 돌보다라는 뜻을 가질 수 있으며, 여기서는 그 땅을 향한 야훼의 적극적인 관심을 나타냅니다.
    reason: lexical_alternative
