  - 살피시는
  - 관심을 두시는
  lexicon: HALOT
  rationale: 원어의 ‘찾다/살피다’는 뜻을 여기서는 땅에 대한 적극적 관심과 보호를 나타내므로, POB의 의도를 살려 ‘돌보시는’으로 옮겼습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 항상
  alternatives_korean:
  - 끊임없이
  - 늘
  lexicon: HALOT
  rationale: 시간의 끊이지 않는 지속을 나타내며, 합쇼체 문장에서 ‘항상’이 가장 자연스럽고 분명합니다.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  english_pob_choice: the eyes of Yahweh your God are continually on it
  chosen_korean: 야훼 당신들의 하나님의 눈이…그 위에 있습니다
  alternatives_korean:
  - 야훼 당신들의 하나님의 눈이…그 땅에 있습니다
  - 야훼 당신들의 하나님이…살피십니다
  lexicon: HALOT
  rationale: 눈의 이미지를 보존해 원문의 의인적 표현을 살렸고, 한국어에서는 ‘그 위에 있습니다’가 감시/주시의 의미를 가장 자연스럽게 전달합니다.
