translation:
  language: ko
  text: 그 땅은 야훼 당신들의 하나님께서 돌보시는 곳입니다[a]. 야훼 당신들의 하나님의 눈이 해의 시작부터 해의 끝까지 항상 그 위에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾으시는’, ‘살피시는’, ‘돌보시는’으로 옮길 수 있습니다. 히브리어 동사는 찾다, 조사하다, 돌보다의 뜻을 가질 수 있으며, 여기서는 그 땅을 향한 야훼의 적극적인 관심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 토지
  lexicon: HALOT
  rationale: 신명기 문맥에서 약속된 영역을 가리키므로, 한국어에서는 가장 자연스럽고 넓게 통용되는 ‘땅’이 적절합니다.
- source_word: דֹּרֵשׁ אֹתָהּ
  english_pob_choice: cares for
  chosen_korean: 돌보시는
  alternatives_korean:
