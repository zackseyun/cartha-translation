  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
  footnotes:
  - marker: a
    text: Or 'seeks' or 'looks after.' The Hebrew verb can denote seeking, inquiring, or caring for; here it conveys the LORD's active concern for the land.
