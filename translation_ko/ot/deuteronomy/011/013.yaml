  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
  footnotes:
  - marker: a
    text: Hebrew 'if you diligently listen'; the idiom can also carry the sense 'if you carefully obey.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with all your life' or 'with all your being' for 'soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 여러분이 오늘 내가 여러분에게 명하는 나의 계명들에 귀 기울여 듣고[a], 여러분의 하나님 야훼를[b] 사랑하며, 온 마음과 온 영혼을 다하여[c] 그분을 섬기면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘듣다’를 반복한 강조형 표현입니다. 문맥상 ‘주의 깊게 순종하다’라는 뜻도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה는 전통적으로 ‘주’로 옮겨지지만, 여기서는 신적 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נֶפֶשׁ는 ‘영혼’ 외에도 ‘생명’, ‘존재’, ‘목숨’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  english_pob_choice: you indeed listen
  chosen_korean: 정말로 듣고
  alternatives_korean:
  - 귀 기울여 듣고
  - 열심히 순종하고
  - 주의 깊게 듣고
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+미완료형)은 단순 청취보다 강한 응답을 뜻하므로, 본문에는 ‘정말로 듣고’로 반영하고 순종의 뉘앙스는 주석에서 보완했습니다.
- source_word: מִצְוֺתַי
  english_pob_choice: my commandments
  chosen_korean: 내 명령들
  alternatives_korean:
  - 내 계명들
  - 내 명령
  - 내 규례들
  lexicon: HALOT
  rationale: 언약적 요구라는 점은 유지하되, 한국어에서 보다 직접적이고 자연한 복수 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명은 POB 기준에 따라 ‘야훼’로 옮겨, 단순한 호칭이 아니라 드러난 신적 이름임을 보존했습니다.
- source_word: וּלְעָבְדוֹ
  english_pob_choice: and to serve him
  chosen_korean: 그분을 섬기며
  alternatives_korean:
  - 그분을 예배하며
  - 그분께 봉사하며
  lexicon: HALOT
  rationale: עבד는 예배와 봉사를 포함할 수 있지만, 여기서는 언약적 헌신의 폭을 살리기 위해 ‘섬기다’를 기본값으로 택했습니다.
- source_word: וּבְכָל נַפְשְׁכֶם
  english_pob_choice: and with all your soul
  chosen_korean: 온 영혼을 다하여
  alternatives_korean:
  - 온 생명을 다하여
  - 온 존재를 다하여
  - 온 목숨을 다하여
  lexicon: HALOT
  rationale: נֶפֶשׁ의 기본 번역어를 살리면서, ‘다하여’를 더해 전인적 헌신을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 오늘 내가 여러분에게 명하는 말의 화자와 시제 처리
  chosen_reading: 모세의 현재 발화로서 ‘내가 여러분에게 명하는’이라고 옮겼습니다.
  alternative_readings:
  - 오늘 내가 여러분에게 명령하는
  - 오늘 내가 여러분에게 명하노라
  rationale: 현재분사적 표현의 발화성을 살려, 단순 과거 명령이 아니라 지금 들려오는 언약 선포로 읽히게 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: שָׁמֹעַ תִּשְׁמְעוּ의 순종 뉘앙스 처리
  chosen_reading: 본문에는 ‘듣고’를 두고, 강조된 순종 의미는 주석으로 보완했습니다.
  alternative_readings:
  - 정말로 순종하고
  - 반드시 따르고
  rationale: 히브리어 관용구의 청취-순종 중첩을 지키기 위해, 본문을 과도하게 해석하지 않고 의미 폭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
