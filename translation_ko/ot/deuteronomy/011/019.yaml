  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
  footnotes:
  - marker: a
    text: Or 'your sons.' The Hebrew uses a masculine plural form that can function representatively for one's children.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 너희 자녀에게 가르치고, 너희가 집에 앉아 있을 때나 길을 걸을 때나 누워 있을 때나 일어날 때에 그것들에 대해 말해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형을 사용하지만, 여기서는 자녀 전체를 대표적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  english_pob_choice: You shall teach
  chosen_korean: 가르치고
  alternatives_korean:
  - 가르쳐야 합니다
  - 가르치며
  lexicon: HALOT
  rationale: למד의 피엘은 기본적으로 ‘가르치다’이므로, 명령형·권고형의 문맥을 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: אֹתָם
  english_pob_choice: them
  chosen_korean: 그것들을
  alternatives_korean:
  - 그것들
  - 그것을
  lexicon: HALOT
  rationale: 대상은 앞선 문맥의 말씀/명령들이므로, 복수 대명사 감각을 살려 ‘그것들을’로 옮겼습니다.
- source_word: אֶת־בְּנֵיכֶם
  english_pob_choice: to your children
  chosen_korean: 너희 자녀에게
  alternatives_korean:
  - 너희 아들들에게
  - 너희 자식들에게
  lexicon: HALOT
  rationale: 히브리어 남성 복수는 대표적으로 자녀 전체를 가리킬 수 있으므로, 한국어에서는 포괄적인 ‘자녀’가 문맥상 가장 자연스럽습니다.
- source_word: לְדַבֵּר בָּם
  english_pob_choice: speaking of them
  chosen_korean: 그것들에 대해 말해야 합니다
  alternatives_korean:
  - 그것들을 말해야 합니다
  - 그것들에 관해 말해야 합니다
  lexicon: HALOT
  rationale: לְדַבֵּר בָּם은 가르침과 병행되는 말하기의 방식/내용을 나타내므로, 직역보다 한국어 자연성을 살려 ‘~에 대해 말하다’로 옮겼습니다.
theological_decisions:
- issue: 남성 복수 בניכם의 범위
  chosen_reading: ‘너희 자녀’로 포괄 번역했습니다.
  alternative_readings:
  - ‘너희 아들들’로 직역하기
  - 성중립을 피하고 남성형을 그대로 드러내기
  rationale: 언약 교육의 대상은 아들에 한정되지 않고 후손 전체를 가리키는 대표 표현이므로, 의미 범위를 보존하는 쪽이 본문의 의도에 더 충실합니다.
  doctrine_reference: Translation philosophy 4 (gender-accurate representative plural)
