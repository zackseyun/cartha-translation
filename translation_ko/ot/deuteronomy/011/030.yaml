source:
  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
  footnotes:
  - marker: a
    text: Or 'across the Jordan.' The Hebrew expression is a geographic idiom whose exact English sense depends on viewpoint.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'after the road of the going in of the sun'; that is, toward the west.
    reason: lexical_alternative
  - marker: c
    text: Or 'the terebinths of Moreh.' The Hebrew term may refer to large trees of either kind.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요단강 건너편, 해가 지는 길의 뒤쪽에 있는가? 곧 가나안 사람의 땅, 곧 아라바에 사는 자들 가운데서 길갈 맞은편, 모레의 상수리나무들 곁에 있지 않은가?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘요단을 건너서/건너편’이라는 뜻의 지리 관용구입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘해가 들어가는 길 뒤에’입니다. 곧 서쪽을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֵלוֹן은 상수리나무나 떡갈나무 같은 큰 나무를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Are they not
  chosen_korean: 그들은 … 있지 않은가?
  alternatives_korean:
  - 그들은 … 아니냐?
  - … 아닌가?
  lexicon: HALOT
  rationale: 수사적 질문으로서 기대하는 답을 드러내기 위해 반문형으로 옮겼습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단강 건너편
  alternatives_korean:
  - 요단강 저편
  - 요단을 건너서
  lexicon: HALOT
  rationale: 지리적 관용구를 자연스러운 한국어로 옮기되, 강 건너편이라는 공간 감각은 유지했습니다.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  english_pob_choice: behind the way of the setting sun
  chosen_korean: 해가 지는 길의 뒤쪽에
  alternatives_korean:
  - 해가 들어가는 길 뒤에
  - 해지는 길의 뒤에
  lexicon: HALOT
  rationale: 직역적 이미지를 살리면서도 한국어 어순에서 무리하지 않도록 ‘뒤쪽에’로 처리했습니다.
- source_word: אֵלוֹנֵי מֹרֶה
  english_pob_choice: the oaks of Moreh
  chosen_korean: 모레의 상수리나무들
  alternatives_korean:
  - 모레의 참나무들
  - 모레의 떡갈나무들
  lexicon: HALOT
  rationale: אֵלוֹן의 수종 범위를 고려해 일반적으로 이해되는 큰 나무를 뜻하게 하면서, 한국어에서는 상수리나무가 가장 무난한 대응으로 판단했습니다.
theological_decisions:
- issue: 지리 표현의 관점 유지
  chosen_reading: ‘요단강 건너편’과 ‘해가 지는 길의 뒤쪽에’로 옮겨, 히브리어의 공간적 관용구를 평탄화하지 않았습니다.
  alternative_readings:
  - ‘요단강 저편’으로 더 일반화
  - ‘서쪽에’로 방향만 명시
  rationale: 본문은 좌표 정보와 관찰자의 위치 감각을 함께 전달하므로, 해설적 단순화보다 원문 이미지 보존이 더 적절합니다.
  doctrine_reference: 본문의 지리 서술 보존
- issue: 모레의 나무 종류
  chosen_reading: ‘상수리나무들’로 본문을 두고, 수종의 개연성은 주석 가능성으로 남겨 둡니다.
  alternative_readings:
  - ‘떡갈나무들’
  - ‘큰 나무들’
  rationale: 히브리어 אֵלוֹן은 특정 단일 수종으로 고정되기보다 큰 나무 일반을 가리킬 수 있어, 본문에서는 자연스러운 대표어를 택했습니다.
  doctrine_reference: 번역상 어휘 범위 보존
