  source_fidelity: 수사 의문문, 요단강 건너편, 해의 들어감과 관련된 길의 뒤, 아라바에 거주하는 가나안 사람들, 길갈 맞은편, 모레의 나무라는 주요 지리 요소는 반영되었습니다. 그러나 초안은 ‘그들은 … 있는가? … 있지 않은가?’로 의문을 중복하고, ‘가나안 사람의 땅, 곧 아라바에 사는 자들 가운데서’가 히브리어의 ‘아라바에 사는 가나안 사람들의 땅에’를 잘못 연결합니다. 또한 אֵלוֹנֵי의 식물학적 범위를 본문에서 ‘상수리나무들’로 단정하지 않는 편이 안전합니다.
