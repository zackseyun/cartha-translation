revisions:
- from: 그들은 요단강 건너편, 해가 지는 길의 뒤쪽에 있는가? 곧 가나안 사람의 땅, 곧 아라바에 사는 자들 가운데서 길갈 맞은편, 모레의 상수리나무들 곁에 있지 않은가?[a][b][c]
  to: 그 산들은 요단강 건너편[a], 해가 들어가는 길 뒤편[b], 아라바에 사는 가나안 사람들의 땅에, 길갈 맞은편 모레의 큰 나무들[c] 곁에 있지 않습니까?
  rationale: 히브리어의 단일 수사 의문문을 현대 합쇼체의 ‘있지 않습니까?’로 옮기고, 앞 절의 두 산을 가리키는 대명사를 ‘그 산들은’으로 명료하게 처리했습니다. 가나안 사람들을 수식하는 ‘아라바에 사는’을 바로 연결했으며, 방향 표현은 ‘해가 들어가는 길 뒤편’으로 원문의 공간적 이미지를 보존했습니다. 나무 명칭은 본문에서 일반적으로 두고 각주에 어휘 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:51Z'
