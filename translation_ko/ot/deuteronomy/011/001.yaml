base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
  footnotes:
  - marker: a
    text: Or 'And you shall love the LORD your God.' The Hebrew conjunction can be rendered simply 'and'; here it is taken with inferential force from the preceding context.
    reason: alternative_reading
  - marker: b
    text: Or 'his ordinances' for 'his judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼, 당신의 하나님을 사랑하고,[a] 그분께서 맡기신 의무와 그분의 규례들과 그분의 법규들과 그분의 명령들을 평생 지키십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러므로’는 히브리어 접속사 ו를 앞 문맥의 결론으로 읽은 번역입니다. 단순히 ‘그리고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그분의 법규들’은 히브리어 מִשְׁפָּטָיו의 법적 의미를 살린 번역입니다. ‘그분의 법도들’ 또는 ‘그분의 판결들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  english_pob_choice: Therefore you shall love
  chosen_korean: 그러므로 당신들은 … 사랑하고
  alternatives_korean:
  - 그리고 당신들은 … 사랑하고
  - 그래서 당신들은 … 사랑하고
  lexicon: HALOT
  rationale: ו 접속사를 단순한 연결이 아니라 앞 문맥의 결론으로 읽는 POB의 inferential force를 살려 ‘그러므로’로 옮겼습니다. 청중을 향한 권고형은 합쇼체로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 언약적 고유명사를 제목어 ‘주’로 바꾸지 않고, POB 기준에 따라 하나님의 이름을 ‘야훼’로 직접 옮겼습니다.
- source_word: מִשְׁמַרְתּוֹ
  english_pob_choice: his charge
  chosen_korean: 그의 맡기신 일
  alternatives_korean:
  - 그의 직무
  - 그의 책임
  - 그의 맡김
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת의 ‘charge, duty, obligation’ 의미를 살리되 한국어에서 어색하지 않게 ‘맡기신 일’로 풀어, 단순한 ‘계명’과 구별되는 위탁·책무의 뉘앙스를 반영했습니다.
- source_word: וּמִשְׁפָּטָיו
  english_pob_choice: his judgments
  chosen_korean: 그의 법규들
  alternatives_korean:
  - 그의 판단들
  - 그의 규례들
  - 그의 판결들
  - 그의 법도들
  lexicon: HALOT
  rationale: מִשְׁפָּט은 문맥상 ‘judgments/ordinances’ 계열의 법적 항목이며, 앞뒤의 ‘규례들/명령들’과 구별되도록 한국어에서 법규적 성격이 드러나는 표현을 택했습니다.
- source_word: וּמִצְוֺתָיו
  english_pob_choice: his commandments
  chosen_korean: 그의 명령들
  alternatives_korean:
  - 그의 계명들
  lexicon: HALOT
  rationale: מִצְוָה의 기본 의미를 직접적으로 반영하되, 한국어에서 법적 열거의 마지막 항목으로 자연스럽게 읽히도록 ‘명령들’을 사용했습니다.
