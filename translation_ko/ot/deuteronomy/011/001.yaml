    rationale: מִשְׁמַרְתּוֹ는 하나님께서 지키도록 부과하신 책임 또는 요구 사항을 뜻합니다. ‘그의 맡기신 일’은 ‘그의’가 누구를 수식하는지와 무엇이 맡겨졌는지가 분명하지 않습니다.
