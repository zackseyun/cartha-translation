translation:
  language: ko
  text: 그러면 내가 너희 땅에 제때 비, 곧 이른비와 늦은비[a]를 내려 주겠습니다. 너희는 곡식과 새 포도주[b]와 기름[c]을 거둘 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전기비와 후기비’.
    reason: lexical_alternative
  - marker: b
    text: 곧 갓 만들어진 포도주, 또는 단순히 ‘포도주’.
    reason: lexical_alternative
  - marker: c
    text: 여기서 기름은 감람유, 곧 올리브기름을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: then I will give
  chosen_korean: 그러면 내가 … 내려 주겠습니다
  alternatives_korean:
  - 내가 … 주겠습니다
  - 그리고 내가 … 주겠습니다
  lexicon: HALOT
  rationale: 앞 절의 약속에 이어지는 결과·응답 흐름을 살리기 위해 ‘그러면’으로 처리하고, עניינ적으로는 비를 ‘내려 주다’가 자연스럽습니다.
- source_word: מְטַר אַרְצְכֶם בְּעִתּוֹ
  english_pob_choice: the rain for your land in its season
  chosen_korean: 너희 땅에 때를 따라 비
  alternatives_korean:
  - 너희 땅을 위한 비를 그 때에
  - 너희 땅의 제때 비
  lexicon: HALOT
  rationale: מטר는 단순한 ‘비’이며, בְּעִתּוֹ는 농경 문맥에서 ‘때를 따라/제때에’가 가장 직접적입니다. ‘땅’은 ארץ의 언약적·농경적 범위를 살립니다.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  english_pob_choice: the early rain and the late rain
  chosen_korean: 이른비와 늦은비
  alternatives_korean:
  - 이른 비와 늦은 비
  - 전기비와 후기비
  lexicon: HALOT
  rationale: 두 계절비의 대조를 간결하게 드러내는 한국어 관용 표현을 택했습니다. 전통적 용어를 유지하되 현대 독자가 이해하기 쉽게 했습니다.
- source_word: וְתִירֹשְׁךָ
  english_pob_choice: your new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새술
  - 포도주
  lexicon: HALOT
  rationale: תירוש는 단순한 일반 ‘포도주’보다 갓 짜내거나 새로 나온 포도주를 가리키므로, 영어 POB의 ‘new wine’에 맞춰 ‘새 포도주’로 옮겼습니다.
- source_word: וְיִצְהָרֶךָ
  english_pob_choice: your oil
  chosen_korean: 기름
  alternatives_korean:
  - 올리브기름
  - 감람유
  lexicon: HALOT
  rationale: 본문의 상투적 삼중항(곡식, 새 포도주, 기름)을 살리기 위해 기본형 ‘기름’을 택했습니다. 문맥상 올리브기름임은 분명하지만, 본문에서는 간명성을 우선했습니다.
theological_decisions:
- issue: 농경적 복을 문자적 약속으로 유지할지 여부
  chosen_reading: 이 구절은 이스라엘 땅에 대한 계절비와 수확의 구체적 약속으로 유지했습니다.
  alternative_readings:
  - 상징적으로 영적 복으로 확장하는 읽기
  - 번영 신학적으로 일반화하는 읽기
  rationale: 히브리어 본문은 농업과 언약의 맥락에서 직접적으로 말하므로, 본문이 말하는 구체성을 흐리지 않고 그대로 살리는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
