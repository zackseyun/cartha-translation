translation:
  language: ko
  text: 그러면 야훼께서 이 모든 민족을 여러분 앞에서 몰아내실 것이며, 여러분은 여러분보다 더 크고 더 강한 민족들을 차지하게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ / יְהוָה
  english_pob_choice: Yahweh will drive out
  chosen_korean: 야훼께서 … 몰아내실 것이며
  alternatives_korean:
  - 야훼께서 … 내쫓으실 것이며
  - 주께서 … 몰아내실 것이며
  lexicon: HALOT
  rationale: 하느님의 이름은 본문에 나온 Tetragrammaton을 따라 야훼로 옮기고, הוֹרִישׁ의 강제적 제거 의미는 문맥상 자연스러운 ‘몰아내다’로 살렸습니다.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: all these nations
  chosen_korean: 이 모든 민족
  alternatives_korean:
  - 이 모든 나라
  - 이 모든 민족들
  lexicon: HALOT
  rationale: 가나안 정복 문맥에서 גּוֹיִם은 정치·민족 집단을 가리키므로, 한국어에서는 ‘민족’이 가장 무난하게 원문의 범위를 살립니다.
- source_word: מִלִּפְנֵיכֶם
  english_pob_choice: before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분 앞에서부터
  - 여러분의 눈앞에서
  lexicon: HALOT
  rationale: 직역형 ‘여러분 앞에서’가 히브리어의 ‘from before your face/presence’를 자연스럽게 반영하면서도 한국어 문장 흐름을 유지합니다.
- source_word: וִירִשְׁתֶּם גּוֹיִם
  english_pob_choice: you will dispossess nations
  chosen_korean: 여러분은 … 차지하게 될 것입니다
  alternatives_korean:
  - 여러분은 … 차지하실 것입니다
  - 여러분은 … 물려받게 될 것입니다
  lexicon: HALOT
  rationale: ירשׁ은 여기서 ‘상속받다’보다 대상을 제거하고 점유한다는 뜻이 강하므로, ‘차지하다’로 옮겨 정복·소유의 결과를 살렸습니다.
- source_word: גְּדֹלִים וַעֲצֻמִים
  english_pob_choice: greater and mightier
  chosen_korean: 더 크고 더 강한
  alternatives_korean:
  - 더 크고 더 막강한
  - 더 크고 더 위력적인
  lexicon: HALOT
  rationale: גְּדֹלִים과 עֲצֻמִים의 병렬 비교를 한국어에서도 크기와 힘의 대비로 유지했습니다. ‘더 강한’은 현대적이면서도 원문의 힘의 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 하느님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 Tetragrammaton을 사용하므로, 번역 전통의 대체 호칭보다 고유 이름을 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
