    rationale: 원문은 לְפַרְעֹה מֶלֶךְ מִצְרַיִם, 즉 ‘애굽 왕 바로’라고 한 번만 칭합니다.
  - severity: medium
    issue: ‘그의 일들’에는 אֲשֶׁר עָשָׂה(‘그가 행하신’) 관계절이 명시적으로 반영되지 않았습니다.
    rationale: 관계절은 표징들과 일들 모두를 수식하므로 한국어에서도 드러내는 편이 정확합니다.
  - severity: medium
    issue: 각주 c의 대안 번역 ‘바로 ...와 그의 온 땅을 대하여’는 문법적으로 부자연스럽고, 각주 표지가 모두 문장 끝에 몰려 있습니다.
