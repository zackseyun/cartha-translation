- from: 그리고 애굽 한가운데에서 바로, 곧 애굽 왕 바로와 그의 온 땅에 행하신 그의 표징들과 그의 일들입니다—[a][b][c]
  to: 또한 애굽 한가운데에서[b] 애굽 왕 바로와 그의 온 땅에[c] 행하신 그의 표징들과[a] 그가 하신 일들입니다—
  rationale: 원문의 절 연결성과 관계절을 보존하면서, 바로의 중복 및 비원문적 동격 표현을 제거했습니다. 각주 c의 문법을 바로잡고 각주 표지를 해당 표현 뒤에 배치했습니다. 대시와 ‘입니다’는 앞 절의 ‘여러분의 눈이 본 것은’에 이어지는 한국어 문장 구조를 반영합니다.
