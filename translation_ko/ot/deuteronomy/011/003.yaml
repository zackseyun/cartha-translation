id: DEU.11.3
reference: Deuteronomy 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אֹֽתֹתָי/ו֙ וְ/אֶֽת מַעֲשָׂ֔י/ו אֲשֶׁ֥ר עָשָׂ֖ה בְּ/ת֣וֹךְ מִצְרָ֑יִם לְ/פַרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וּ/לְ/כָל אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
  footnotes:
  - marker: a
    text: Or 'his wonders' for 'his signs.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in Egypt'; Hebrew more literally, 'in the midst of Egypt.'
    reason: lexical_alternative
  - marker: c
    text: Or 'against Pharaoh ... and against all his land'; the Hebrew preposition is literally 'to,' but the context is of acts directed in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 애굽 한가운데에서[b] 애굽 왕 바로와 그의 온 땅에[c] 행하신 그의 표징들과[a] 그가 하신 일들입니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 이적들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘애굽 가운데에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘애굽 왕 바로와 그의 온 땅을 향하여’로도 옮길 수 있습니다. 히브리어 전치사는 문자적으로 ‘~에게/~에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  english_pob_choice: his signs
  chosen_korean: 그의 표징들
  alternatives_korean:
  - 그의 징조들
  - 그의 기적의 표징들
  - 그의 이적들
  lexicon: HALOT
  rationale: אוֹת은 문맥상 하나님의 표징, 표지, 징후를 뜻하므로 ‘표징들’이 본문의 의미를 직접적이면서도 과도하게 설명하지 않습니다.
- source_word: מַעֲשָׂיו
  english_pob_choice: his deeds
  chosen_korean: 그의 일들
  alternatives_korean:
  - 그의 행위들
  - 그의 행적들
  - 그의 일하심
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 행한 일, 행위를 가리키므로 ‘일들’이 가장 넓고 직결된 대응입니다. 한국어에서 자연스러운 동시에 ‘표징들’과 병렬을 이룹니다.
- source_word: בְּתוֹךְ מִצְרַיִם
  english_pob_choice: in the midst of Egypt
  chosen_korean: 애굽 한가운데에서
  alternatives_korean:
  - 애굽 가운데에서
  - 애굽에서
  - 애굽 안에서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 문자적 감각인 ‘가운데/한복판’을 살려, 사건이 애굽 내부에서 공개적으로 일어났음을 드러내는 표현을 택했습니다.
- source_word: לְפַרְעֹה ... וּלְכָל אַרְצֹו
  english_pob_choice: to Pharaoh ... and to all his land
  chosen_korean: 바로, 곧 애굽 왕 바로와 그의 온 땅에
  alternatives_korean:
  - 바로와 그의 온 땅을 향하여
  - 바로와 그의 온 땅에게
  - 바로와 그의 온 땅에 대하여
  lexicon: HALOT
  rationale: לְ는 여기서 대상/방향을 표시하므로 직접 ‘-에’로 옮기되, 본문이 단순 목적어 나열이 아니라 심판의 향방을 띤다는 점을 ‘바로, 곧’으로 풀어 주었습니다.
theological_decisions:
- issue: לְ의 방향성 해석(‘to’ vs. ‘against’)
  chosen_reading: 본문의 전치사 방향성은 살리되, 심판적 맥락은 한국어 문맥 전체로 드러내고 ‘대하여/향하여’ 같은 해석적 과잉은 피했습니다.
  alternative_readings:
  - 바로와 그의 온 땅을 대하여
  - 바로와 그의 온 땅을 향하여
  rationale: 히브리어는 문자적으로 ‘~에게/~에’이지만, 앞뒤 문맥상 심판 행위의 대상임이 분명합니다. 다만 본문 자체의 폭을 유지하기 위해 직접적 방향 표지를 선택했습니다.
  doctrine_reference: 문맥적 심판 대상의 표현
