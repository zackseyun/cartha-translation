  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
  footnotes:
  - marker: a
    text: Or 'I am giving before you today a blessing and a curse.' The Hebrew verb can mean 'give,' but in this construction 'setting before you' is more idiomatic in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 오늘 내가 여러분 앞에 복과 저주를 두고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두고 있습니다’는 히브리어 동사 נתן의 ‘주다/놓다/배치하다’ 의미를 한국어에서 자연스럽게 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 감탄/주의 환기의 명령형을 현대 합쇼체로 자연스럽게 옮기되, 본문의 직접적 호소력을 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: נֹתֵן
  english_pob_choice: am setting
  chosen_korean: 두고 있습니다
  alternatives_korean:
  - 세우고 있습니다
  - 주고 있습니다
  - 놓고 있습니다
  lexicon: HALOT
  rationale: ‘before you’와 결합된 נתן의 배치 의미를 한국어에서 가장 자연스럽게 드러내기 위해 ‘두고 있습니다’를 사용했습니다.
- source_word: לִפְנֵיכֶם
  english_pob_choice: before you
  chosen_korean: 여러분 앞에
  alternatives_korean:
  - 너희 앞에
  - 당신들 앞에
  lexicon: HALOT
  rationale: 집합적 청중을 향한 표현으로서 ‘여러분 앞에’가 현대 표준어 합쇼체에 가장 자연스럽습니다.
- source_word: בְּרָכָה וּקְלָלָה
  english_pob_choice: a blessing and a curse
  chosen_korean: 복과 저주
  alternatives_korean:
  - 한 복과 한 저주
  - 축복과 저주
  lexicon: HALOT
  rationale: 히브리어의 무관사 단수 대구를 한국어에서는 관형사 없이 병렬로 옮겨 대조를 간결하게 유지했습니다.
theological_decisions:
- issue: 언약적 선택의 병렬 구조
  chosen_reading: 문장을 해설적으로 풀지 않고, 축복과 저주가 제시되는 대조 자체를 그대로 보존했습니다.
  alternative_readings:
  - ‘복을 주고 저주를 내린다’로 인과를 명시하기
  - 도덕적 일반 원리처럼 확대 해석하기
  rationale: 문맥은 신명기적 언약의 양자택일을 제시하므로, 본문이 말하는 범위를 넘지 않도록 단순한 제시 구조를 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하지 않는 해석을 덧붙이지 말고, 독자가 언약적 대비를 그대로 이해하도록 한다.'
