    rationale: ‘내가 말하는 것은/너희에게 하는 말’은 원문에 명시된 동사가 아니라 문맥상 보완한 표현입니다. 영어 POB 감사 기록처럼 생략과 해석적 보완을 밝히는 각주가 필요합니다.
