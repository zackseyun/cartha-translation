source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
  footnotes:
  - marker: a
    text: 'Hebrew is elliptical: literally, ''for not your children who have not known and who have not seen...'' The sense is that Moses is addressing those who themselves witnessed the LORD''s acts, not the next generation.'
    reason: alternative_reading
  - marker: b
    text: Or 'mighty hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 너희는 알아야 합니다. 내가 지금 말하는 것은, 너희의 하나님 야훼의 훈육과 그분의 위대하심과 그분의 강한 손[b]과 그분의 뻗으신 팔을 알지도 못하고 보지도 못한 너희 자녀들에게 하는 말이 아니라, 너희에게 하는 말입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기에서 동사를 생략하여 직역하면 ‘너희 자녀들이 아니라’입니다. 문맥상 모세는 야훼의 행위를 직접 경험한 현 청중에게 말하고 있으며, 아직 그것을 경험하지 못한 다음 세대에게 말하는 것이 아님을 대조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘강력한 손’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם / הַיּוֹם
  english_pob_choice: And know today
  chosen_korean: 오늘 너희는 알아야 합니다
  alternatives_korean:
  - 오늘 너희는 알 것입니다
  - 오늘 알아 두십시오
  lexicon: HALOT
  rationale: 현재 청중에게 직접 호소하는 명령적/권고적 흐름을 살리면서, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: כִּי לֹא אֶת בְּנֵי/כֶם ...
  english_pob_choice: that I am not speaking to your children
  chosen_korean: 그것은 너희 자녀들에 대한 말이 아니라
  alternatives_korean:
  - 너희 자녀들은 아니라
  - 너희 자녀들에게 말하는 것이 아니라
  lexicon: HALOT
  rationale: 히브리어는 '너희 자녀들' 뒤가 생략된 엘립시스 구조이므로, 한국어에서는 문맥상 요구되는 대비를 자연스럽게 풀어 주었습니다.
- source_word: מוּסַר
  english_pob_choice: discipline
  chosen_korean: 훈육
  alternatives_korean:
  - 징계
  - 교훈
  - 교정
  lexicon: HALOT
  rationale: 여기서는 야훼의 행위가 단순 처벌이 아니라 가르치고 빚어 가는 형성적 의미를 지니므로, '훈육'이 가장 균형 있게 반영합니다.
- source_word: יָדוֹ הַחֲזָקָה
  english_pob_choice: his strong hand
  chosen_korean: 강한 손
  alternatives_korean:
  - 강력한 손
  - 능한 손
  - 힘센 손
  lexicon: HALOT
  rationale: POB의 'strong hand'를 따라 직역성을 유지하면서도, 한국어에서 익숙한 관용 표현인 '손'을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יְהוָה를 '야훼'로 옮겼습니다.
  alternative_readings:
