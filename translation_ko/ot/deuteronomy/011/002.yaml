revisions:
- from: 오늘 너희는 알아야 합니다. 그것은 너희 자녀들에 대한 말이 아니라, 그들은 알지도 못했고 보지도 못한 야훼, 너희 하나님의 훈육과 그분의 크심과 그분의 강한 손[a]과 그분의 펴신 팔입니다.
  to: 오늘 너희는 알아야 합니다. 내가 지금 말하는 것은, 너희의 하나님 야훼의 훈육과 그분의 위대하심과 그분의 강한 손[b]과 그분의 뻗으신 팔을 알지도 못하고 보지도 못한 너희 자녀들에게 하는 말이 아니라, 너희에게 하는 말입니다[a].
  rationale: 문법적으로 성립하지 않는 현 문장을 전면 재구성했습니다. 히브리어의 생략된 대조는 영어 POB 감사 기록의 보완 방향을 따라 ‘내가 지금 말하는 것은 … 아니라, 너희에게 하는 말입니다’로 최소한으로 명시했습니다. 이 보완이 원문에 명시된 동사가 아니라는 점은 각주로 밝혔습니다. 핵심 용어와 하나님의 이름 표기는 유지했고, ‘펴신 팔’은 현대 한국어에서 더 자연스러운 ‘뻗으신 팔’로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
