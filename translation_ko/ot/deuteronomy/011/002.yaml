  rationale: 본문이 신적 고유명칭을 사용하므로, 전통적 대체어보다 고유명칭을 드러내는 표기를 채택했습니다.
  doctrine_reference: source-priority / divine-name transliteration
- issue: 생략된 대비 구조의 보완
  chosen_reading: '''너희 자녀들에 대한 말이 아니라''로 엘립시스를 보완했습니다.'
  alternative_readings:
  - '''너희 자녀들은 아니다''로 직역'
  - 생략을 그대로 두어 불완전하게 번역
  rationale: 히브리어의 생략을 드러내되, 한국어 독자가 모호함 없이 문맥의 대비를 이해하도록 최소한으로 보완했습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence'
