  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
  footnotes:
  - marker: a
    text: Or 'to inherit.' The Hebrew verb can carry both possession and inheritance overtones in covenantal contexts.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heavens,' a standard biblical expression for the sky/heavenly realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분이 차지하려고 건너가고 있는 그 땅은 산과 골짜기의 땅이며, 하늘의 비로 물을 마십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘차지하다’. 히브리어 동사는 언약적 문맥에서 소유와 상속의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘하늘들’로, 하늘/창공을 가리키는 표준적 성경 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  english_pob_choice: But the land
  chosen_korean: 그러나 ... 그 땅은
  alternatives_korean:
  - 그리고 그 땅은
  - 그런데 그 땅은
  lexicon: HALOT
  rationale: 앞절의 애굽과 대비되는 담화를 한국어에서 자연스럽게 살리기 위해 역접 '그러나'를 사용했습니다.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה לְרִשְׁתָּהּ
  english_pob_choice: that you are crossing over to possess
  chosen_korean: 여러분이 차지하려고 건너가고 있는
  alternatives_korean:
  - 여러분이 소유하려고 건너가는
  - 여러분이 상속하려고 건너가는
  lexicon: HALOT
  rationale: ירש의 소유/상속 중첩을 살리되, 여기서는 실제로 들어가 점유하는 뉘앙스가 분명하므로 '차지하다'로 옮겼습니다.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  english_pob_choice: a land of mountains and valleys
  chosen_korean: 산과 골짜기의 땅
  alternatives_korean:
  - 산과 계곡의 땅
  - 산지와 골짜기의 땅
  lexicon: HALOT
  rationale: 지형 대비를 간결하게 살리기 위해 직역적이면서도 자연스러운 '산과 골짜기'를 택했습니다.
- source_word: לִמְטַר הַשָּׁמַיִם תִּשְׁתֶּה מָּיִם
  english_pob_choice: it drinks water from the rain of heaven
  chosen_korean: 하늘의 비로 물을 마십니다
  alternatives_korean:
  - 하늘의 비를 마십니다
  - 하늘에서 내리는 비로 물을 마십니다
  lexicon: HALOT
  rationale: 땅을 의인화한 '마신다'는 이미지를 유지했고, ל + מְטַר는 수원의 출처를 나타내므로 '하늘의 비로'로 자연스럽게 처리했습니다.
