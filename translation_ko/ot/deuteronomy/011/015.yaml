- from: 그리고 내가 네 밭에 풀을 주어 네 가축이 먹게 하며, 네가 먹고 만족할 것입니다.[a][b]
  to: 그리고 내가 네 밭에 네 가축을 위하여 풀[a]을 주겠습니다. 그러면 네가 먹고 배부를 것입니다[b].
  rationale: 미래 약속을 합쇼체 ‘주겠습니다’로 분명히 하고, ‘네 가축을 위하여’라는 목적구를 그대로 보존했습니다. 가축을 위한 풀과 수신자가 먹고 배부르는 일을 두 문장으로 나누어 원문의 의미 관계와 주체 전환을 명료하게 했습니다. 각주 표지는 해당 단어에 직접 붙였습니다.
