  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
  footnotes:
  - marker: a
    text: Or 'vegetation' or 'herbage'; the Hebrew term can refer broadly to plant growth, but here likely means fodder for livestock.
    reason: lexical_alternative
  - marker: b
    text: Or 'be full.' The Hebrew verb denotes being filled or satisfied after eating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 네 밭에 네 가축을 위하여 풀[a]을 주겠습니다. 그러면 네가 먹고 배부를 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초목’이나 ‘식물’. 히브리어는 넓게는 식생을 가리킬 수 있지만, 여기서는 가축의 먹이로 쓰이는 풀을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘만족할 것입니다.’ 히브리어 동사는 먹은 뒤 배부르거나 만족한 상태가 되는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 그리고 내가 … 주어
  alternatives_korean:
  - 그리고 내가 … 제공하여
  - 그러면 내가 … 주어
  lexicon: HALOT
  rationale: מַתַּן의 약속형 미래 뉘앙스를 살려 ‘내가 … 주어’로 옮기고, 앞 문맥의 조건-축복 연속을 반영해 접속사 ‘그리고’를 유지했습니다.
- source_word: עֵשֶׂב
  english_pob_choice: grass
  chosen_korean: 풀
  alternatives_korean:
  - 풀잎
  - 초목
  - 목초
  lexicon: HALOT
  rationale: 가축을 위한 먹이의 문맥에서 넓게는 식생을 가리킬 수 있지만, 한국어에서는 자연스럽고 간결하게 ‘풀’이 가장 적절합니다.
- source_word: בְּשָׂדְךָ
  english_pob_choice: in your field
  chosen_korean: 네 밭에
  alternatives_korean:
  - 네 들에
  - 네 땅에
  - 네 목초지에
  lexicon: HALOT
  rationale: שָׂדֶה의 구체적 농경 공간을 살려 ‘밭’으로 옮겼고, 영어 POB처럼 추상적인 ‘땅’으로 넓히지 않았습니다.
- source_word: לִבְהֶמְתֶּךָ
  english_pob_choice: for your livestock
  chosen_korean: 네 가축이 먹게
  alternatives_korean:
  - 네 가축을 위해
  - 네 짐승에게
  - 네 동물을 위해
  lexicon: HALOT
  rationale: לְ의 목적 용법을 한국어 동사구로 자연스럽게 풀어 ‘네 가축이 먹게’라고 했으며, 집합적 가축 의미를 ‘가축’으로 유지했습니다.
theological_decisions:
- issue: 히브리어 단수 2인칭의 유지
  chosen_reading: ‘네 밭’, ‘네 가축’, ‘네가 먹고’로 단수 직접 호칭을 유지했습니다.
  alternative_readings:
  - 현대 한국어에 맞게 복수화하여 ‘너희 밭들’, ‘너희 가축들’로 조정
  rationale: 언약 خطاب의 대표적 단수형을 그대로 살려 원문 수사적 힘을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: 축복의 범위를 과장하지 않음
  chosen_reading: 가축의 먹이와 사람의 만족이라는 문자적 농경 축복으로만 옮겼습니다.
  alternative_readings:
  - 번영 신학적 표현으로 확장
  - 풍요와 번성으로 의역
  rationale: 본문이 말하는 것은 토지의 생산성과 식사의 만족이지, 본문 밖의 일반화된 번영 선언이 아니므로 그 범위를 넘기지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 3
