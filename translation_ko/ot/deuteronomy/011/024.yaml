  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
  footnotes:
  - marker: a
    text: Or 'as far as the western sea,' traditionally understood as the Mediterranean Sea; literally 'the hindmost/last sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 발바닥이 밟는 모든 곳은 여러분의 소유가 될 것입니다. 광야와 레바논에서부터, 강 곧 유브라데 강에서부터, 서쪽 바다에 이르기까지 여러분의 경계가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서쪽 바다’는 전통적으로 지중해를 가리키는 것으로 이해됩니다. 히브리어 원문은 문자적으로 ‘뒤쪽/마지막 바다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  english_pob_choice: Every place
  chosen_korean: 모든 곳
  alternatives_korean:
  - 각 장소
  - 모든 장소
  - 어느 곳이든
  lexicon: HALOT
  rationale: 분배적 의미를 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘모든 곳’으로 옮겼습니다.
- source_word: תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  english_pob_choice: where the sole of your foot treads
  chosen_korean: 여러분의 발바닥이 밟는
  alternatives_korean:
  - 여러분 발의 바닥이 밟는
  - 여러분의 발바닥이 디디는
  - 여러분의 발이 밟는
  lexicon: HALOT
  rationale: ‘כַּף רֶגֶל’의 구체적 이미지를 살려 ‘발바닥’으로 옮기고, ‘דרך’는 ‘밟다’로 표현해 본문의 생생함을 유지했습니다.
- source_word: לָכֶם יִהְיֶה
  english_pob_choice: will be yours
  chosen_korean: 여러분의 소유가 될 것입니다
  alternatives_korean:
  - 여러분의 것이 될 것입니다
  - 여러분에게 속할 것입니다
  lexicon: HALOT
  rationale: 단순 소유를 넘어 약속된 귀속을 드러내기 위해 ‘소유가 될 것입니다’를 선택했습니다.
- source_word: מִן הַמִּדְבָּר וְהַלְּבָנוֹן
  english_pob_choice: from the wilderness and Lebanon
  chosen_korean: 광야와 레바논에서부터
  alternatives_korean:
  - 광야와 레바논으로부터
  - 광야와 레바논에서
  - 광야부터 레바논까지
  lexicon: HALOT
  rationale: 경계의 시작점을 나타내는 מן을 한국어의 ‘에서부터’로 자연스럽게 옮겨, 지리적 범위를 명확히 했습니다.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  english_pob_choice: from the River, the Euphrates River
  chosen_korean: 강 곧 유브라데 강에서부터
  alternatives_korean:
  - 강, 곧 유브라데 강에서부터
  - 유브라데 강에서부터
  - 강, 유브라데 강에서부터
  lexicon: HALOT
  rationale: ‘הַנָּהָר’의 관용적 칭호 ‘강’과 동격 설명 ‘נְהַר פְּרָת’를 함께 드러내기 위해 ‘강 곧 유브라데 강’으로 옮겼습니다.
- source_word: הַיָּם הָאַחֲרוֹן
  english_pob_choice: the western sea
  chosen_korean: 서쪽 바다
  alternatives_korean:
  - 서해
  - 마지막 바다
  - 후미(後尾)의 바다
  lexicon: HALOT
  rationale: 직역의 낯설음을 줄이면서도 방향성을 보존하기 위해 ‘마지막 바다’보다 지리적 의미가 분명한 ‘서쪽 바다’로 옮겼습니다.
- source_word: גְּבֻלְכֶם
  english_pob_choice: your border
  chosen_korean: 여러분의 경계
  alternatives_korean:
  - 여러분의 경계선
  - 여러분의 국경
  - 여러분의 경계 지역
  lexicon: HALOT
  rationale: 문맥상 영토의 가장자리이므로 ‘경계’가 가장 간결하고 적절합니다.
theological_decisions:
- issue: 지리적 약속의 범위 표현
  chosen_reading: 본문의 영토 약속을 그대로 제시하고, 후대의 성취 방식이나 상징적 해석은 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 상징적 경계로 해석
  - 조건적 약속으로 강조
  rationale: 이 절은 언약적 영토 범위를 선언하는 문장으로, 번역은 본문이 말하는 지리적 약속을 분명히 전달하는 데 집중해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
