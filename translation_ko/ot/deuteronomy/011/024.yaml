base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
  footnotes:
  - marker: a
    text: Or 'as far as the western sea,' traditionally understood as the Mediterranean Sea; literally 'the hindmost/last sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 발바닥으로 밟는 모든 곳은 여러분의 것이 될 것입니다. 광야에서 레바논까지, 그리고 그 강, 곧 유브라데 강에서 서쪽 바다까지가 여러분의 경계가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서쪽 바다’는 전통적으로 지중해를 가리키는 것으로 이해됩니다. 히브리어 원문은 문자적으로 ‘뒤쪽/마지막 바다’입니다.
    reason: lexical_alternative
