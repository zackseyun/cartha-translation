  rationale: ‘הַנָּהָר’의 관용적 칭호 ‘강’과 동격 설명 ‘נְהַר פְּרָת’를 함께 드러내기 위해 ‘강 곧 유브라데 강’으로 옮겼습니다.
- source_word: הַיָּם הָאַחֲרוֹן
  english_pob_choice: the western sea
  chosen_korean: 서쪽 바다
  alternatives_korean:
