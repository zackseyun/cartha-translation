  lexicon: HALOT
  rationale: 경계의 시작점을 나타내는 מן을 한국어의 ‘에서부터’로 자연스럽게 옮겨, 지리적 범위를 명확히 했습니다.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  english_pob_choice: from the River, the Euphrates River
  chosen_korean: 강 곧 유브라데 강에서부터
  alternatives_korean:
  - 강, 곧 유브라데 강에서부터
  - 유브라데 강에서부터
  - 강, 유브라데 강에서부터
