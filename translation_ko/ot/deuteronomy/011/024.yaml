  - 여러분의 경계 지역
  lexicon: HALOT
  rationale: 문맥상 영토의 가장자리이므로 ‘경계’가 가장 간결하고 적절합니다.
theological_decisions:
- issue: 지리적 약속의 범위 표현
  chosen_reading: 본문의 영토 약속을 그대로 제시하고, 후대의 성취 방식이나 상징적 해석은 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 상징적 경계로 해석
  - 조건적 약속으로 강조
  rationale: 이 절은 언약적 영토 범위를 선언하는 문장으로, 번역은 본문이 말하는 지리적 약속을 분명히 전달하는 데 집중해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
