  - 땅이 그 산물을 내지 못할 것이며
  lexicon: HALOT
  rationale: אֲדָמָה와 יְבוּל의 농경적 의미를 살리면서도 한국어에서 자연스러운 ‘소출’로 옮겼습니다.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  english_pob_choice: from the good land
  chosen_korean: 좋은 땅에서
  alternatives_korean:
  - 좋은 땅 위에서
  - 그 좋은 땅에서
  lexicon: HALOT
  rationale: 문맥상 출방/추방의 결과를 나타내는 표현이므로 자연스럽게 ‘좋은 땅에서’로 옮겼습니다. POB의 경계적 뉘앙스보다 한국어 가독성을 우선했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
