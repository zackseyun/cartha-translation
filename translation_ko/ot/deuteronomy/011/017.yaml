translation:
  language: ko
  text: 그러면 야훼의 분노가 여러분에게 타오를 것이며, 그분은 하늘을 닫아 비가 내리지 않게 하실 것입니다. 그러면 땅이 그 소출을 내지 못할 것이며, 여러분은 야훼께서 여러분에게 주시는 좋은 땅에서 속히 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  english_pob_choice: the LORD’s anger will burn against you
  chosen_korean: 야훼의 분노가 여러분에게 타오를 것이며
  alternatives_korean:
  - 야훼께서 여러분에게 진노하실 것이며
  - 야훼의 코가 여러분에게 타오를 것이며
  lexicon: HALOT
  rationale: אַף와 חָרָה의 관용구를 자연스러운 한국어로 옮기되, 단순히 ‘화내다’로 약화하지 않고 불타는 심판의 이미지를 살렸습니다.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  english_pob_choice: and he will shut up the heavens
  chosen_korean: 그분은 하늘을 닫아
  alternatives_korean:
  - 그분은 하늘을 막아
  - 그분은 하늘을 거두어
  lexicon: HALOT
  rationale: 비를 내리지 않기 위해 하늘을 ‘닫다’는 이미지를 직역에 가깝게 살려 문맥의 재앙적 의미를 유지했습니다.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  english_pob_choice: and the ground will not yield its produce
  chosen_korean: 땅이 그 소출을 내지 못할 것이며
  alternatives_korean:
  - 땅이 그 열매를 내지 못할 것이며
  - 땅이 그 산물을 내지 못할 것이며
  lexicon: HALOT
  rationale: אֲדָמָה와 יְבוּל의 농경적 의미를 살리면서도 한국어에서 자연스러운 ‘소출’로 옮겼습니다.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  english_pob_choice: from the good land
  chosen_korean: 좋은 땅에서
  alternatives_korean:
  - 좋은 땅 위에서
  - 그 좋은 땅에서
  lexicon: HALOT
  rationale: 문맥상 출방/추방의 결과를 나타내는 표현이므로 자연스럽게 ‘좋은 땅에서’로 옮겼습니다. POB의 경계적 뉘앙스보다 한국어 가독성을 우선했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본어인 신명 transliteration을 따라 ‘야훼’로 일관되게 표기했습니다.
