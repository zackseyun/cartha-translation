- from: 그러면 야훼의 분노가 여러분에게 타오를 것이며, 그분은 하늘을 닫아 비가 내리지 않게 하실 것입니다. 그러면 땅이 그 소출을 내지 못할 것이며, 여러분은 야훼께서 여러분에게 주시는 좋은 땅에서 속히 멸망할 것입니다.
  to: 그러면 야훼의 분노가 여러분을 향해 타오를 것이며, 그분은 하늘을 닫아 비가 내리지 않게 하실 것입니다. 땅은 그 소출을 내지 못할 것이며, 여러분은 야훼께서 여러분에게 주시는 그 좋은 땅에서 속히 사라질 것입니다.
  rationale: 수정은 מֵעַל הָאָרֶץ의 ‘그 땅으로부터’라는 방향성을 ‘그 좋은 땅에서 … 사라질 것입니다’로 반영하고, 원문의 아동적·심판적 어조와 불타는 분노의 은유를 유지하는 데 한정했습니다. ‘사라지다’는 אבד가 가리키는 파멸·소멸을 전달하되, 죽음·추방 등 구체적 기제를 본문보다 더 확정하지 않습니다.
