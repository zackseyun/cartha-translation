translation:
  language: ko
  text: 그러면 야훼의 분노가 여러분을 향해 타오를 것이며, 그분은 하늘을 닫아 비가 내리지 않게 하실 것입니다. 땅은 그 소출을 내지 못할 것이며, 여러분은 야훼께서 여러분에게 주시는 그 좋은 땅에서 속히 사라질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  english_pob_choice: the LORD’s anger will burn against you
  chosen_korean: 야훼의 분노가 여러분에게 타오를 것이며
  alternatives_korean:
