source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
  footnotes:
  - marker: a
    text: Or 'phylacteries,' referring to small scripture containers later worn in Jewish practice; the Hebrew term is rare and its exact nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 나의 말씀들을 여러분의 마음과 영혼에 두십시오. 그것들을 여러분의 손에 표징으로 매고, 그것들이 여러분의 눈 사이에 표장이 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘띠’ 또는 ‘필리락테리’. 이 히브리어 희귀어는 후대 유대교에서 착용한 작은 성구 상자와 관련지어 이해되기도 하지만, 그 정확한 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  english_pob_choice: you shall place
  chosen_korean: 새겨 두십시오
  alternatives_korean:
  - 두십시오
  - 간직하십시오
  lexicon: HALOT
  rationale: שׂים의 기본 뜻은 ‘두다/놓다/배치하다’이지만, 여기서는 언약적 권면의 문맥상 단순 보관보다 내면화의 뜻을 살리되 원문의 구체성을 유지하는 표현이 적절합니다.
- source_word: דְּבָרַי אֵלֶּה
  english_pob_choice: these words of mine
  chosen_korean: 이 말씀들
  alternatives_korean:
  - 내 말씀들
  - 이 말들
  lexicon: HALOT
  rationale: 지시대명사와 1인칭 소유를 반영하면서도 한국어에서는 ‘말씀들’이 가장 자연스럽고, 발화자의 권위 있는 언어라는 점을 살릴 수 있습니다.
- source_word: וְעַל נַפְשְׁכֶם
  english_pob_choice: and on your soul
  chosen_korean: 여러분의 생명에
  alternatives_korean:
  - 여러분의 영혼에
  - 여러분의 혼에
  lexicon: HALOT
  rationale: נֶפֶשׁ은 ‘영혼’보다 넓게 ‘생명/자기 존재’를 가리킬 수 있으므로, 이 절의 ‘마음’과 병행되는 언약적 강조를 살리기 위해 ‘생명’을 선택했습니다.
- source_word: לְאוֹת
  english_pob_choice: as a sign
  chosen_korean: 표징으로
  alternatives_korean:
  - 표로
  - 징표로
  - 표식으로
  lexicon: HALOT
  rationale: אוֹת는 단순 표식이 아니라 눈에 보이는 언약적 표지의 뉘앙스를 가지므로, 현대 한국어에서 격식 있게 그 기능을 드러내는 ‘표징’이 적절합니다.
- source_word: לְטוֹטָפֹת
  english_pob_choice: as frontlets
  chosen_korean: 띠
  alternatives_korean:
  - 전두 장식
  - 이마 장식
  - 패
  lexicon: HALOT
  rationale: 희귀어 טוֹטָפֹת의 정확한 용례가 불확실하므로, 본문에서 말하는 머리 장식의 기능을 과도하게 규정하지 않으면서도 읽히는 한국어로 최소한의 설명력을 지닌 ‘띠’를 택했습니다.
theological_decisions:
- issue: 손과 눈 사이의 장식/표지 명령을 문자적 관습으로 확정할지 여부
  chosen_reading: 원문의 구체적 이미지를 유지하되, 그것이 순전히 비유인지 문자적 예식인지 단정하지 않았습니다.
  alternative_readings:
  - 마음과 행동에 대한 비유적 권면으로만 읽기
  - 후대 유대교의 필리락테리(성구함) 관습을 암시하는 문자적 지시로 읽기
  rationale: 히브리어는 매우 구체적이지만 본문 자체가 해석을 하나로 닫지 않으므로, 번역은 원문의 긴장을 보존하는 방향이 가장 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
