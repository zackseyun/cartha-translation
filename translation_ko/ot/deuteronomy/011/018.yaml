revisions:
- from: 그러므로 이 말씀들을 여러분의 마음에, 여러분의 생명에 새겨 두십시오. 그것들을 여러분의 손에 매는 표징으로 삼고, 여러분의 눈 사이의 띠가 되게 하십시오.[a]
  to: 그러므로 이 나의 말씀들을 여러분의 마음과 영혼에 두십시오. 그것들을 여러분의 손에 표징으로 매고, 그것들이 여러분의 눈 사이에 표장이 되게 하십시오.[a]
  rationale: 원문의 소유 접미사와 구체적인 동작 표현을 회복하고, 손의 ‘표징’과 눈 사이의 희귀어 ‘표장’을 구별했습니다. 본문은 명령이 비유적인지 문자적인지 판단하지 않으며, 후대 관습과의 관련 가능성 및 어휘상의 불확실성은 해당 어휘의 각주에만 남겼습니다.
