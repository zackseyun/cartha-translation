  rationale: 직역적 이미지를 유지하되 한국어에서 자연스럽게 읽히도록 비교구문으로 처리했습니다. 영어 POB의 우회적 시간 표현보다 히브리어의 공간적 비유를 더 직접적으로 반영했습니다.
