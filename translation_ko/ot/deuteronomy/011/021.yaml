  source_fidelity: 원문의 목적/결과 절(לְמַעַן ... יִרְבּוּ)은 앞선 명령에 따르는 결과를 나타냅니다. 초안의 ‘많아지게 하십시오’는 독자에게 새 명령을 하는 것으로 바꾸므로 수정이 필요합니다. ‘그리하면 … 많아질 것입니다’는 한국어에서 자연스럽게 그 결과를 표현하며, 날들이 늘어남이라는 히브리어 표현도 보존합니다. ‘야훼께서 여러분의 조상들에게 주시겠다고 맹세하신 땅’은 לָתֵת לָהֶם의 수여 대상이 조상들임을 명확히 합니다.
  naturalness: ‘여러분의 날들과 여러분의 아들들의 날이’보다 ‘여러분의 날과 여러분 아들들의 날이’가 현대 표준 한국어에서 더 자연스럽습니다. 또한 각주 표지는 해당 어구에 직접 붙여 독자가 대안을 분명히 알 수 있게 했습니다.
  terminology: יהוה는 프로젝트 방침에 맞게 ‘야훼’로 유지했습니다. בְנֵיכֶם은 ‘여러분 아들들’로 문자적 성별 표지를 유지하고, ‘자녀들’ 대안을 각주에 제시합니다. ‘하늘이 땅 위에 있는 날들’은 원문의 비유적 표현을 보존합니다.
