  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
  footnotes:
  - marker: a
    text: Or 'and the days of your children.' The Hebrew reads 'your sons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'as long as the heavens are above the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여러분의 날들과 여러분의 아들들의 날이, 야훼께서 여러분의 조상들에게 주시기로 맹세하신 땅에서, 하늘이 땅 위에 있는 날들처럼 많아지게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분의 자녀들”. 히브리어는 “여러분의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하늘이 땅 위에 있는 한”이라는 뜻입니다.
    reason: lexical_alternative
