base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
  footnotes:
  - marker: a
    text: Literally, 'their houses.' The Hebrew may refer either to their physical dwellings or, more broadly, to their households.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'all the yĕqûm that was at their feet.' The phrase likely refers to all who and what belonged to or accompanied them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 야훼께서 르우벤의 아들 엘리압의 아들들인 다단과 아비람에게 하신 일, 곧 땅이 입을 벌려 온 이스라엘 한가운데에서 그들과 그들의 집안[a]과 그들의 천막과 그들의 발치에 있던 모든 것[b]을 삼킨 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 집들’입니다. 여기서는 물리적인 집을 가리킬 수도 있고, 더 넓게는 그들에게 속한 집안이나 가구를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 발치에 있던 모든 하예쿰(הַיְקוּם)’입니다. 이 표현은 그들에게 속했거나 그들과 함께 있던 사람과 재산 등을 포괄하여 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר עָשָׂה
  english_pob_choice: and what he did
  chosen_korean: 그리고 … 행하신 일
  alternatives_korean:
  - 그리고 … 하신 일
  - 그리고 … 하신 것
  lexicon: HALOT
  rationale: 회고적 서술로서 단순한 ‘하다’보다 ‘행하신 일’이 본문의 행위성과 공식성을 더 잘 살립니다.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  english_pob_choice: sons of Eliab son of Reuben
  chosen_korean: 르우벤의 아들 엘리압의 아들들
  alternatives_korean:
  - 르우벤 사람 엘리압의 아들들
  - 엘리압과 르우벤의 후손들
  lexicon: HALOT
  rationale: 히브리어의 계보식을 그대로 유지해 ‘엘리압 → 르우벤’의 족보적 층위를 보존했습니다.
- source_word: פָּצְתָה הָאָרֶץ אֶת פִּיהָ
  english_pob_choice: the earth opened its mouth
  chosen_korean: 땅이 입을 벌려
  alternatives_korean:
  - 땅이 그 입을 열어
  - 땅이 입을 벌리고
  lexicon: HALOT
  rationale: ‘입을 벌리다’로 의인화된 비유를 살리되, 한국어에서 자연스럽고 생생하게 들리도록 옮겼습니다.
- source_word: וְאֵת כָּל הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  english_pob_choice: and every living thing at their feet
  chosen_korean: 그들의 발치에 딸린 모든 생명
  alternatives_korean:
  - 그들의 발치에 있던 모든 것
  - 그들의 발밑에 있던 모든 생존물
  lexicon: HALOT
  rationale: הַיְקוּם은 단순히 ‘살아 있는 것’만이 아니라 그들에게 속해 함께 있던 존재/소유를 가리킬 수 있어, POB의 주석을 반영해 ‘발치에 딸린’으로 넓게 옮겼습니다.
- source_word: בְּתֹךְ כָּל יִשְׂרָאֵל
  english_pob_choice: in the midst of all Israel
  chosen_korean: 온 이스라엘 한가운데서
  alternatives_korean:
  - 모든 이스라엘 가운데서
  - 온 이스라엘 가운데서
  lexicon: HALOT
  rationale: 공적이고 가시적인 사건의 장소감을 살리기 위해 ‘한가운데서’를 택했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 주어를 하나님의 언약명 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님께서
  - 여호와께서
  rationale: 토라 본문의 히브리어 מקור이 יהוה이므로, 프로젝트 기본값에 따라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: YHWH transliteration policy
- issue: ‘생명’의 범위
  chosen_reading: ‘모든 생명’으로 넓게 번역해 사람과 소유를 아우를 수 있는 파괴의 전면성을 드러냈습니다.
  alternative_readings:
  - 모든 것
  - 모든 존재
  rationale: 히브리어 הַיְקוּם의 범위를 너무 좁은 ‘짐승’이나 지나치게 추상적인 ‘존재’로 고정하지 않고, POB 주석의 취지를 따라 포괄적으로 처리했습니다.
  doctrine_reference: lexical scope of הַיְקוּם
