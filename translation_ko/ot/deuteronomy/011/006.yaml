- from: 그리고 야훼께서 다단과 아비람 곧 르우벤의 아들 엘리압의 아들들에게 행하신 일—곧 땅이 입을 벌려 그들과 그들의 집안과 그들의 천막들과 그들의 발치에 딸린 모든 생명을 삼켜 버린 일—을, 온 이스라엘 한가운데서 보셨습니다.[a][b]
  to: 또한 야훼께서 르우벤의 아들 엘리압의 아들들인 다단과 아비람에게 하신 일, 곧 땅이 입을 벌려 온 이스라엘 한가운데에서 그들과 그들의 집안[a]과 그들의 천막과 그들의 발치에 있던 모든 것[b]을 삼킨 일입니다.
  rationale: 근거 없는 ‘보셨습니다’를 제거하여 히브리어의 관계절적 구성을 보존했습니다. הַיְקוּם은 해석적으로 ‘생명’에 한정하지 않고 ‘모든 것’으로 옮겼으며, 양쪽 어휘 각주를 해당 본문 어휘에 정확히 연결하고 히브리어 표기를 수정했습니다.
