base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or 'to your ancestors.' The Hebrew reads 'to your fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to their seed.' The Hebrew term can denote offspring collectively or descendants more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 여러분은 야훼께서 여러분의 조상들에게 맹세하여 그들과 그들의 자손에게 주시겠다고 하신 땅에서 오래 살게 될 것입니다. 그 땅은 젖과 꿀이 흐르는 땅입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조상들에게’로도 옮길 수 있습니다. 히브리어는 직역하면 ‘그들의 아버지들에게’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 씨’입니다. 히브리어 זֶרַע는 집합적으로 ‘자손’이나 더 넓게 ‘후손들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן תַּאֲרִיכוּ יָמִים
  english_pob_choice: so that you may live long
  chosen_korean: 그리하여 여러분은 … 오래 살게 될 것입니다
  alternatives_korean:
  - 그래서 여러분은 … 오래 살 것입니다
  - 그리하여 여러분의 날이 길어질 것입니다
  lexicon: HALOT
  rationale: 히브리어 목적/결과 절을 자연스러운 현대 한국어로 옮기되, ‘오래 살다’로 관용적 의미를 살렸습니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: on the land
  chosen_korean: 그 땅에서
  alternatives_korean:
  - 그 땅 위에서
  - 그 땅에
  lexicon: HALOT
  rationale: 문맥상 단순한 지면이 아니라 약속의 땅을 가리키므로, 한국어에서는 자연스럽게 ‘그 땅에서’로 표현했습니다.
- source_word: לַאֲבֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 여러분의 조상들에게
  alternatives_korean:
  - 여러분의 아버지들에게
  - 여러분의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어에서는 혈통적 선조를 가리키는 표준 표현인 ‘조상들’이 가장 자연스럽습니다.
- source_word: וּלְזַרְעָם
  english_pob_choice: and to their offspring
  chosen_korean: 그들의 자손에게
  alternatives_korean:
  - 그들의 씨에게
  - 그들의 후손에게
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서도 한국어 성경 문맥에서 자연스러운 ‘자손’으로 옮겼습니다.
- source_word: זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는
  alternatives_korean:
  - 우유와 꿀이 흐르는
  - 젖과 꿀이 넘쳐나는
  lexicon: HALOT
  rationale: 정착된 성경적 관용구를 유지해 풍요와 비옥함의 이미지를 직접적으로 전달했습니다.
theological_decisions:
- issue: 야훼의 언약적 맹세를 어떻게 드러낼지
  chosen_reading: ‘야훼께서 … 맹세하여 … 주시겠다고 하신’으로 옮겨 언약적 약속과 맹세의 엄숙함을 분명히 했습니다.
  alternative_readings:
  - ‘주님께서 … 약속하신’
  - ‘야훼께서 … 서원하신’
  rationale: כָּשַׁב/שָׁבַע의 맹세 언어를 약화시키지 않고, 본문의 언약적 무게를 보존하기 위해 ‘맹세하다’를 유지했습니다.
  doctrine_reference: 언약과 맹세의 성격(창 22:16-18; 히 6:13-18)
