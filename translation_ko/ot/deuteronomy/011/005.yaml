  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: ko
  text: 그리고 그가 광야에서 너희를 위해 행하신 일, 곧 너희가 이곳에 이를 때까지의 일을[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 번의 עַד를 사용하여 시간적 한계와 도착 지점을 연속적으로 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וַאֲשֶׁר
  english_pob_choice: and what
  chosen_korean: 그리고 그가 행하신 일
  alternatives_korean:
  - 그리고 그가 하신 바
  - 그리고 그가 하신 것
  lexicon: HALOT
  rationale: 연결된 상대 표현을 한국어로는 자연스럽게 ‘일’로 옮겨, 앞 문맥의 행위 목록을 이어 주면서도 과도한 설명을 피했습니다.
- source_word: עָשָׂה לָכֶם
  english_pob_choice: he did for you
  chosen_korean: 너희를 위해 행하신
  alternatives_korean:
  - 너희에게 행하신
  - 너희를 위하여 하신
  lexicon: HALOT
  rationale: לָכֶם은 단순한 방향보다 수혜/대상 관계가 강하므로 ‘너희를 위해’로 옮겨 하나님의 행위가 이스라엘을 위한 것임을 분명히 했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 광야 안에서
  - 들판에서
  lexicon: HALOT
  rationale: מִדְבָּר의 표준 성경적 지시를 살려 ‘광야’로 옮겼습니다. ‘사막’보다 출애굽/광야 여정의 성경적 배경을 더 정확히 드러냅니다.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  english_pob_choice: until you came to this place
  chosen_korean: 너희가 이곳에 이를 때까지
  alternatives_korean:
  - 너희가 이곳에 올 때까지
  - 너희가 이곳까지 이를 때까지
  lexicon: HALOT
  rationale: 두 번의 עַד를 한국어에서 ‘~할 때까지’와 도착 목적어 ‘이곳에’로 자연스럽게 재현해, 시간의 한계와 도착 지점을 함께 살렸습니다.
theological_decisions:
- issue: 본문의 주어를 드러내는 방식
  chosen_reading: 문맥상 주어를 하나님으로 이어받아 ‘그가’로 번역했습니다.
  alternative_readings:
  - ‘주께서’로 명시
  - 주어를 생략한 서술
  rationale: 히브리어는 주어를 생략할 수 있으나, 앞뒤 문맥에서 야훼의 행위를 가리키므로 한국어에서는 대상을 분명하게 하되 새로운 정보를 추가하지 않도록 했습니다.
  doctrine_reference: 문맥적 지시대상 해석
