id: DEU.11.28
reference: Deuteronomy 11:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
  footnotes:
  - marker: a
    text: Or 'obey the commandments of the LORD your God.' The Hebrew verb 'listen' often carries the sense of obedient hearing in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저주는, 여러분이 야훼 너희 하나님의 명령들을 듣지 않고, 내가 오늘 여러분에게 명령하는 길에서 벗어나, 여러분이 알지 못하는 다른 신들을 따라갈 경우입니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼 너희 하나님의 명령들에 순종하지 않으면'로 옮길 수 있습니다. 히브리어 동사 '듣다'는 언약 문맥에서 흔히 순종의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  english_pob_choice: and the curse
  chosen_korean: 그리고 저주는
  alternatives_korean:
  - 그리고 그 저주는
  - 그러나 저주는
  lexicon: HALOT
  rationale: 문맥상 앞절의 복과 짝을 이루는 언약적 대조를 살리되, 한국어에서는 문장 시작의 연결을 자연스럽게 처리했습니다.
- source_word: תִשְׁמְעוּ אֶל
  english_pob_choice: listen to
  chosen_korean: 듣지 않고
  alternatives_korean:
  - 순종하지 않고
  - 경청하지 않고
  lexicon: HALOT
  rationale: 히브리어의 '듣다'를 기본으로 유지하면서, 여기서는 불순종의 조건을 한국어로 자연스럽게 드러냈습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 야훼 여러분의 하나님
  - 주 너희 하나님
  lexicon: HALOT
  rationale: 표준 정책에 따라 יְהוָה는 '야훼'로 옮기고, 소유격은 복수 대상에게 자연스러운 '너희'로 반영했습니다.
- source_word: מִצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  lexicon: HALOT
  rationale: '''계명''도 가능하지만, 본문이 단수적 종교 용어보다 실제 명령의 집합을 가리키므로 보다 직접적인 ''명령들''을 택했습니다.'
- source_word: לָלֶכֶת אַחֲרֵי
  english_pob_choice: to go after
  chosen_korean: 따라갈 경우입니다
  alternatives_korean:
  - 뒤따라갈 경우입니다
  - 가서 따를 경우입니다
  lexicon: HALOT
  rationale: '''뒤따르다/따라가다''는 후행·추종의 뜻을 유지하며, 한국어에서 목적절을 조건절로 풀어 자연스럽게 표현했습니다.'
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 신들
  - 이방 신들
  lexicon: HALOT
  rationale: 히브리어의 일반적 복수 표현을 그대로 살려, 전통적 교회어보다 직접적인 '다른 신들'을 사용했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유 신명사 יְהוָה를 가리키므로, 프로젝트 기준에 따라 언약적 고유명을 보존하는 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שׁמע의 번역에서 '순종하다'를 본문에 직접 넣을지
  chosen_reading: 본문에는 '듣지 않다'를 두고, 순종 의미는 문맥에서 읽히게 했습니다.
  alternative_readings:
  - 순종하지 않다
  - 말을 듣지 않다
  rationale: 히브리어 동사 자체는 '듣다'이며, 언약 문맥에서 순종의 함의를 갖지만 본문을 해석어로 좁히지 않기 위해 기본 의미를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
