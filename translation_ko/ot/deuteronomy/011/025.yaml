  edition: WLC
  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
  footnotes:
  - marker: a
    text: Or, 'No one will be able to stand before you.' The Hebrew idiom 'stand before' can mean to withstand or successfully oppose.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on the face of all the land'; some translate 'all the earth,' but 'land' better fits the immediate context of territory Israel will tread upon.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람 하나도 여러분 앞에 서지 못할 것입니다[a]. 여러분의 하나님 야훼께서 여러분이 밟는 온 땅의 모든 지역 위에 여러분을 두려워하는 마음과 떨림을 두실 것입니다[b]. 이는 그분께서 여러분에게 말씀하신 그대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘앞에 서다’는 ‘버티다’ 또는 ‘맞서 이기다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘온 땅의 표면 위에’입니다. 문맥상 이스라엘이 밟을 정복 지역을 가리키므로 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  english_pob_choice: No man will stand before you
  chosen_korean: 사람 하나도 여러분 앞에 서지 못할 것입니다
  alternatives_korean:
  - 아무도 여러분 앞에 서지 못할 것입니다
  - 사람 하나도 여러분 앞에 맞서지 못할 것입니다
  - 남자 한 사람도 여러분 앞에 서지 못할 것입니다
  lexicon: HALOT
  rationale: אִישׁ의 대표적 단수 표현을 ‘사람 하나도’로 자연스럽게 옮기되, ‘서지 못할’로 히브리어 관용구의 ‘대항하여 버티다/맞서다’의 뜻을 살렸습니다.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  english_pob_choice: the fear and dread of you
  chosen_korean: 여러분을 두려워하는 마음과 떨림
  alternatives_korean:
  - 여러분에 대한 두려움과 떨림
  - 여러분을 향한 공포와 두려움
  - 여러분에 대한 공포와 전율
  lexicon: HALOT
  rationale: 두 명사 פַּחַד와 מוֹרָא의 겹치면서도 다른 강도를 살리기 위해, 단순 반복보다 ‘두려워하는 마음’과 ‘떨림’으로 분리해 표현했습니다.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: on the face of all the land
  chosen_korean: 온 땅의 모든 지역 위에
  alternatives_korean:
  - 온 땅 위에
  - 그 땅 전체 위에
  - 모든 땅의 표면 위에
  lexicon: HALOT
  rationale: 문맥상 정복 대상 지역을 가리키므로 ‘땅’으로 제한하되, פני의 공간적 이미지를 과도하게 직역하지 않고 ‘위에’로 자연스럽게 옮겼습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  english_pob_choice: just as he spoke to you
  chosen_korean: 이는 그분께서 여러분에게 말씀하신 그대로입니다
  alternatives_korean:
  - 이는 그분께서 여러분에게 말씀하신 대로입니다
  - 그분께서 여러분에게 말씀하신 것과 같습니다
  - 그분께서 여러분에게 하신 말씀 그대로입니다
  lexicon: HALOT
  rationale: דִּבֶּר의 기본 의미를 따라 ‘말씀하신’으로 옮기고, 앞선 약속의 성취라는 뉘앙스는 ‘그대로’로 드러냈습니다.
theological_decisions:
- issue: 야훼의 두려움과 떨림을 ‘주다’의 의미를 어떻게 한국어로 살릴지
  chosen_reading: ‘두려워하는 마음과 떨림을 두실 것입니다’로 옮겨, 두려움이 하나님께서 부여하시는 परिणाम임을 드러냈습니다.
  alternative_readings:
  - ‘두려움과 떨림을 주실 것입니다’
  - ‘두려움과 공포를 내리실 것입니다’
  rationale: נתן은 단순한 소유 변화가 아니라 대상에게 어떤 상태를 부여하는 뜻이므로, 한국어에서도 ‘두실 것입니다’로 결과의 부여성을 살리는 편이 본문에 더 가깝습니다.
  doctrine_reference: Deut 11:25; divine sovereignty in covenant blessing/judgment
