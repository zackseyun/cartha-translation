source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
  footnotes:
  - marker: a
    text: Or 'you shall pronounce the blessing on Mount Gerizim and the curse on Mount Ebal.' The Hebrew literally says 'set/give,' and the exact ceremonial action is explained in the surrounding passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 여러분의 하나님 야훼께서 여러분을 차지하려고 들어가는 땅으로 데려가실 때, 여러분은 축복을 그리심 산 위에, 저주를 에발 산 위에 두어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주다/두다’라고 합니다. 이 절만으로는 축복과 저주를 두 산과 관련하여 행하는 정확한 의례 방식이 무엇인지 확정되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼께서 여러분을
  alternatives_korean:
  - 주님께서 여러분을
  - 여호와께서 여러분을
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본어인 ‘야훼’로 살리고, אֱלֹהֶיךָ는 언약적 소속을 드러내는 ‘하나님’으로 옮겼습니다. 다만 이 절의 동사가 2인칭 단수이므로 한국어는 자연스럽게 단수 호응으로 처리했습니다.
- source_word: יְבִיאֲךָ
  english_pob_choice: brings you into
  chosen_korean: 데려가실 때
  alternatives_korean:
  - 들여보내실 때
  - 이끌어 들이실 때
  lexicon: HALOT
  rationale: 히필 בוא의 사역적 의미를 살려 ‘데려가시다/들여보내시다’ 중, 문맥상 약속의 땅으로 인도해 들어가시는 동작이 드러나는 ‘데려가실 때’를 택했습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하려고 들어가는
  alternatives_korean:
  - 소유하려고 들어가는
  - 기업으로 삼으려고 들어가는
  lexicon: HALOT
  rationale: ירשׁ은 단순한 점유보다 언약적 ‘차지함/기업 삼음’의 뉘앙스가 있어, 전치사구 전체를 자연스럽게 풀어 ‘차지하려고 들어가는’으로 옮겼습니다.
- source_word: וְנָתַתָּה אֶת הַבְּרָכָה ... וְאֶת הַקְּלָלָה
  english_pob_choice: you shall set the blessing ... and the curse ...
  chosen_korean: 그 축복을 ... 그 저주를 ... 두어야 합니다
  alternatives_korean:
  - 그 축복을 ... 그 저주를 ... 놓아야 합니다
  - 그 축복을 ... 그 저주를 ... 선포해야 합니다
  lexicon: HALOT
  rationale: נתן의 문자적 ‘주다/두다’ 의미를 살려, 영어 POB의 ‘set’에 대응하는 한국어 ‘두다’를 선택했습니다. 다만 실제 의례 행위의 정확한 방식은 문맥이 설명하므로, 선포로 좁히지 않았습니다.
- source_word: הַבְּרָכָה / הַקְּלָלָה
  english_pob_choice: the blessing / the curse
  chosen_korean: 그 축복 / 그 저주
  alternatives_korean:
  - 그 복 / 그 저주
  - 그 축복 선포 / 그 저주 선포
  lexicon: HALOT
  rationale: 언약문맥의 대조를 분명히 하기 위해 정관성을 살린 ‘그 축복’과 ‘그 저주’를 사용했습니다. ‘복’보다 ‘축복’이 본문에서 의례적·공적 대칭을 더 분명히 드러냅니다.
theological_decisions:
- issue: 여호와/야훼의 예식적 명칭을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 직접 신명기 본문에 나타난 신명기적 언약 이름을 가려지지 않게 드러내기 위해, 프로젝트 기본값대로 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘set/give’의 의례적 동작을 선포로 좁힐지 여부
  chosen_reading: ‘두어야 합니다’로 옮겨, 구체적 의례 방식은 주변 문맥에 맡겼습니다.
  alternative_readings:
  - 선포해야 합니다
  - 놓아야 합니다
  rationale: 히브리어는 축복과 저주를 두 산 위에 ‘두다’고 말할 뿐, 이 절 자체에서는 정확한 행위가 선포인지 배치인지 단정하지 않습니다. 따라서 본문이 말하는 구체성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translational restraint in ceremonial descriptions'
