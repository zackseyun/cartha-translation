translation:
  language: ko
  text: 또 이집트 군대와 그 말들과 그 병거들에게 그분이 하신 일, 곧 그들이 여러분을 뒤쫓을 때에 홍해[a]의 물을 그들 위로 넘치게 하시고 야훼께서 그들을 오늘까지 멸하신 일입니다.
  philosophy: optimal-equivalence
  footnotes:
