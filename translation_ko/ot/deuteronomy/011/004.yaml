lexical_decisions:
- source_word: חֵיל
  english_pob_choice: army
  chosen_korean: 군대
  alternatives_korean:
  - 군사력
  - 무리
  lexicon: HALOT
  rationale: 이 구절은 말들과 병거들과 함께 이집트를 가리키므로, חֵיל은 일반적 힘보다 군사적 집단인 ‘군대’로 옮기는 것이 가장 자연스럽습니다.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  english_pob_choice: to its horses and its chariots
  chosen_korean: 그 말들과 그 병거들에게
  alternatives_korean:
  - 그 말과 그 병거에
  - 그 말들과 그 전차들에
  lexicon: HALOT
  rationale: 집합적 지시를 살려 ‘그 말들과 그 병거들’로 옮겼고, 한국어에서 대상 표지는 자연스럽게 ‘-에게’보다 ‘-들에게’가 더 읽히기 쉬워 그 방향을 택했습니다.
- source_word: הֵצִיף אֶת מֵי יַם סוּף עַל פְּנֵיהֶם
  english_pob_choice: made the waters of the Red Sea overflow over them
  chosen_korean: 홍해의 물을 그 위에 넘치게 하셔서
  alternatives_korean:
  - 홍해의 물이 그들 위로 넘치게 하셔서
  - 홍해의 물로 그들을 덮치게 하셔서
  lexicon: HALOT
  rationale: 하필사형 הֵצִיף의 인과적 의미를 살려 ‘넘치게 하셔서’로 옮겼습니다. ‘그 위에’는 עַל פְּנֵיהֶם의 방향성을 자연스럽게 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명사형은 주어와 구별되는 고유명으로서 ‘야훼’로 옮겨, POB의 स्रोत 직역 원칙과 용례 일관성을 따랐습니다.
theological_decisions:
- issue: יַם סוּף의 표기
  chosen_reading: 본문에는 ‘홍해’를 두고, 원어상 투명성은 각주로 보완합니다.
  alternative_readings:
  - ‘갈대바다’
  - ‘갈대의 바다’
  rationale: 영어 POB가 관용적 지명인 Red Sea를 본문에 두고 Sea of Reeds를 각주로 처리한 방식을 따라, 한국어도 독자성 높은 지명 ‘홍해’를 유지하되 원어 의미를 각주로 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
- issue: ‘오늘까지’의 서술 시점
  chosen_reading: 역사적 결과가 현재까지 지속됨을 나타내는 관용으로 ‘오늘까지’를 유지합니다.
  alternative_readings:
  - ‘이날까지’
  - ‘지금까지’
  rationale: 히브리어 עַד הַיּוֹם הַזֶּה는 서술 시점까지의 지속을 뜻하는 관용구이므로, 의미를 약화하지 않는 표준적 표현을 사용합니다.
  doctrine_reference: HALOT; Hebrew narrative idiom
