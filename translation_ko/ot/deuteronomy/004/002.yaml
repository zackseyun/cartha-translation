  to: 여러분은 내가 여러분에게 명령하는 이 말씀에 더하지도 말고, 그것에서 빼지도 마십시오. 그리하여 내가 여러분에게 명령하는 여러분의 하나님 야훼의 계명들을 지키십시오.[a]
  rationale: 마지막 관계절을 원문대로 화자 ‘나’가 계명들을 명령하는 것으로 바로잡았습니다. ‘그리하여 … 지키십시오’는 לִשְׁמֹר의 목적 용법을 한국어의 자연스러운 권면 문장으로 유지합니다. 각주 내용은 유지하되 기능상 대안 표기 설명으로 분류했습니다.
