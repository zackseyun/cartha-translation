  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
  footnotes:
  - marker: a
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 여러분은 내가 여러분에게 명령하는 이 말씀에 더하지도 말고, 그것에서 빼지도 마십시오. 그리하여 내가 여러분에게 명령하는 여러분의 하나님 야훼의 계명들을 지키십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH)는 전통적으로 ‘주님’ 또는 ‘여호와’로 옮겨 왔습니다. 여기서는 ‘야훼’를 사용했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תֹסִפוּ עַל
  english_pob_choice: add to
  chosen_korean: 더하지도 말고
  alternatives_korean:
  - 보태지도 말고
  - 추가하지도 말고
  lexicon: HALOT
  rationale: 히필 יסף + עַל의 금지 표현을 자연스러운 현대 한국어로 옮기되, 내용에 무엇인가를 덧붙이는 금지를 분명히 했습니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 이 말씀
  alternatives_korean:
  - 그 말씀
  - 그 말
  - 그 일
  lexicon: HALOT
  rationale: 명령의 내용 전체를 가리키는 단수형을 살려, 한국어에서는 문맥상 자연한 ‘이 말씀’으로 옮겼습니다.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  english_pob_choice: take away from it
  chosen_korean: 그것에서 빼지도 말고
  alternatives_korean:
  - 그것에서 덜어내지도 말고
  - 그것에서 감하지도 말고
  lexicon: HALOT
  rationale: גרע의 ‘덜다/감하다/빼다’ 의미를 반영해, 앞의 ‘더하다’와 짝을 이루는 금지로 표현했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 여러분의 하나님 야훼
  alternatives_korean:
  - 여러분의 하나님 여호와
  - 여러분의 하나님 주님
  lexicon: HALOT
  rationale: YHWH는 본문 원칙에 따라 ‘야훼’로 옮기고, 소유격 관계는 한국어 어순상 ‘여러분의 하나님’으로 자연스럽게 배치했습니다.
theological_decisions:
- issue: YHWH의 고유명사 표기
  chosen_reading: ‘야훼’로 직역해 언약의 이름을 드러냈습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문은 טetragrammaton을 직접 사용하므로, 전통적 대체어보다 신적 고유명을 보존하는 것이 स्रोत의 힘을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
