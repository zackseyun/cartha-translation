translation:
  language: ko
  text: 여러분은 내가 여러분에게 명령하는 이 말씀에 더하지도 말고, 그것에서 빼지도 마십시오. 그리하여 여러분의 하나님 야훼께서 여러분에게 명령하시는 그 계명들을 지키십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH), 전통적으로는 ‘주님’ 또는 ‘여호와’로 옮겨 왔습니다. 여기서는 ‘야훼’를 사용했습니다.
    reason: ot_citation
lexical_decisions:
- source_word: לֹא תֹסִפוּ עַל
