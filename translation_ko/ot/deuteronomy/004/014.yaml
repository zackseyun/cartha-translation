source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
  footnotes:
  - marker: a
    text: Or 'decrees and ordinances' for 'statutes and judgments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to inherit it' for 'to possess.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서는 저에게, 여러분에게 규례와 규정들을 가르치라고 명령하셨습니다[a]. 이는 여러분이 건너가 차지하게 될 땅에서 그것들을 행하도록 하신 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘법령과 판결들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅을 상속받게 될’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본 절의 신명기 문맥에서 하나님의 고유 이름을 제목어인 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역해 인격적 이름을 보존했습니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하셨습니다
  alternatives_korean:
  - 명하셨습니다
  - 지시하셨습니다
  lexicon: HALOT
  rationale: 권위 있는 계명을 주는 동사를 현대 한국어의 직접적인 행위 동사로 살려, 단순한 안내가 아니라 명령의 ուժ을 드러냈습니다.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  english_pob_choice: statutes and judgments
  chosen_korean: 규례들과 규정들
  alternatives_korean:
  - 율례들과 법도들
  - 법규들과 판결들
  lexicon: HALOT
  rationale: 전통 교회어인 ‘율례/법도’보다 원문의 법적 두 항목을 현대어로 분명하게 드러내는 쪽을 택했습니다. ‘규정들’은 מִשְׁפָּטִים의 재판적 뉘앙스를 지나치게 좁히지 않으면서도 자연스럽게 대응합니다.
- source_word: לְלַמֵּד אֶתְכֶם
  english_pob_choice: to teach you
  chosen_korean: 여러분에게 … 가르치게
  alternatives_korean:
  - 여러분을 … 가르치게
  - 여러분에게 … 가르치도록
  lexicon: HALOT
  rationale: 히브리어 부정사구의 목적을 한국어로 자연스럽게 옮기면서, ‘가르치다’로 교육적·언약적 전달 행위를 살렸습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하려는
  alternatives_korean:
  - 소유하려는
  - 상속받으려는
  lexicon: HALOT
  rationale: 땅을 ‘소유하다’보다 진입·점유의 동작을 살린 ‘차지하다’가 본문의 가나안 진입 맥락에 더 적합합니다.
theological_decisions:
- issue: 이름-칭호 구분과 언약적 고유성
  chosen_reading: יַהְוֶה를 ‘야훼’로 유지하고, 문맥상의 권위는 ‘명령하셨습니다’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 전통화
  rationale: 본문은 단순한 호칭이 아니라 출애굽/신명기 언약의 발화자로서 하나님의 고유 이름을 강조하므로, 제목어로 대체하지 않고 고유성을 보존하는 것이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
