  source_fidelity: 원문은 ‘야훼께서 그때에 나에게 너희에게 규례들과 משפטים을 가르치라고 명하셨다’와, 그 목적 곧 그들이 건너가 차지할 땅에서 그것들을 행하도록 하셨다는 내용을 말합니다. 초안의 ‘가르치게 하셨습니다’와 ‘행하게 하시려는 것이었습니다’는 대체로 뜻을 전달하지만, 두 겹의 사역 구문이 히브리어의 직접적인 명령과 목적 관계를 다소 흐립니다. 개정문은 명령의 직접성과 목적절을 분명히 보존합니다.
  naturalness: ‘저에게 여러분에게’는 문법적으로 가능하지만 다소 겹쳐 들릴 수 있습니다. ‘저에게, 여러분에게 … 가르치라고’로 쉼을 두고, 목적을 별문장으로 처리하면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘야훼’, ‘규례’, ‘규정’, ‘행하다’, ‘차지하다’는 본문과 프로젝트의 용어 선택에 부합합니다. 다만 복수 접미사와 연결된 법률 용어는 한국어에서 불필요하게 복수화하지 않은 ‘규례와 규정’이 더 자연스럽습니다. 각주도 영어 표현이 아니라 한국어 번역어의 어휘 대안을 설명하도록 고쳤습니다.
