  to: 그때 야훼께서는 저에게, 여러분에게 규례와 규정들을 가르치라고 명령하셨습니다[a]. 이는 여러분이 건너가 차지하게 될 땅에서 그것들을 행하도록 하신 것입니다[b].
  rationale: 개정문은 야훼께서 모세에게 가르치라고 직접 명하신 사실과, 이스라엘이 들어가 차지할 땅에서 법규를 행하도록 하신 목적을 분명히 구분했습니다. ‘차지하게 될’은 לְרִשְׁתָּהּ의 점유·상속 의미와 본문의 미래 지향성을 보존하며, 각주는 각각 해당 번역어에 직접 연결했습니다.
