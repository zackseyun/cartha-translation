  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
  footnotes:
  - marker: a
    text: Or 'to the midst of heaven.' The Hebrew literally says 'to the heart of the heavens,' an idiom for the middle or height of the sky/heavens.
    reason: lexical_alternative
  - marker: b
    text: Or 'thick darkness' or 'deep darkness' for 'thick gloom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 가까이 다가와 산기슭에 서셨습니다. 그 산은 하늘 한가운데까지[a] 불타고 있었으며, 어둠과 구름과 짙은 어둠[b]이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘의 심장까지’입니다. 이는 하늘의 중간이나 높은 곳을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘짙은 흑암’, ‘깊은 어둠’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  english_pob_choice: you came near
  chosen_korean: 가까이 나아가
  alternatives_korean:
  - 다가와
  - 가까이 왔고
  lexicon: HALOT
  rationale: קרב의 기본 의미는 ‘가까이 가다’이므로, 서술 흐름을 살리면서도 자연스러운 합쇼체로 옮겼습니다.
- source_word: תַּחַת הָהָר
  english_pob_choice: at the foot of the mountain
  chosen_korean: 산 밑에
  alternatives_korean:
  - 산 아래에
  - 산 아래쪽에
  lexicon: HALOT
  rationale: 문자적으로는 ‘산 아래/밑’이지만 산 지형 맥락에서는 ‘산 밑’이 가장 자연스럽게 정상적으로 보이는 위치 관계를 전달합니다.
- source_word: עַד לֵב הַשָּׁמַיִם
  english_pob_choice: up to the heart of the heavens
  chosen_korean: 하늘의 한가운데까지
  alternatives_korean:
  - 하늘의 심장까지
  - 하늘의 중심까지
  lexicon: HALOT
  rationale: לֵב의 비유적 용례를 한국어로 그대로 ‘심장’이라 옮기면 어색하므로, 원문의 비유성을 유지하면서 의미를 드러내는 ‘한가운데’로 처리했습니다.
- source_word: וַעֲרָפֶל
  english_pob_choice: thick gloom
  chosen_korean: 짙은 흑암
  alternatives_korean:
  - 짙은 어둠
  - 짙은 캄캄함
  - 두터운 흑암
  lexicon: HALOT
  rationale: עֲרָפֶל은 단순한 어둠보다 더 짙고 가려진 상태를 가리키므로, 앞의 ‘어둠’과 구별되도록 ‘짙은 흑암’으로 옮겼습니다.
theological_decisions:
- issue: 시내산 신현의 이미지 보존
  chosen_reading: 불, 어둠, 구름, 짙은 흑암의 층위를 그대로 살려 신현의 두려움과 장엄함을 약화하지 않았습니다.
  alternative_readings:
  - 일반적인 날씨 묘사처럼 평탄하게 처리함
  rationale: 본문은 단순한 기상 묘사가 아니라 하나님의 임재 현현을 묘사하므로, 이미지의 밀도를 유지하는 것이 문맥과 신학에 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
