  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
  footnotes:
  - marker: a
    text: Or 'in the land of the plain.' The Hebrew term refers to level or plateau country; 'tableland' is used here to reflect the Transjordan uplands more precisely.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 지파 사람들을 위하여는 광야의 고원 지대[a]에 있는 베셀, 갓 지파 사람들을 위하여는 길르앗의 라못, 므낫세 지파 사람들을 위하여는 바산의 골란이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평지의 땅에’. 히브리어 ‘미쇼르’는 평평한 지역 또는 고원 지대를 가리킵니다. 여기서는 요단 동편의 높은 평탄 지형을 반영하여 ‘고원 지대’로 옮겼습니다.
    reason: lexical_alternative
