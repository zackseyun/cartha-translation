  rationale: מִדְבָּר는 단순한 사막보다 황무지·광야의 넓은 자연지대를 가리키므로 ‘광야’가 가장 자연스럽습니다.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  english_pob_choice: in the land of the tableland
  chosen_korean: 평지의 땅
