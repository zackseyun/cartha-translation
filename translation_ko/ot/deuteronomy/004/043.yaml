base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
  footnotes:
  - marker: a
    text: Or 'in the land of the plain.' The Hebrew term refers to level or plateau country; 'tableland' is used here to reflect the Transjordan uplands more precisely.
    reason: lexical_alternative
translation:
  language: ko
  text: 베셀은 광야[a] 곧 평지의 땅에 있었고, 르우벤 사람의 몫이었으며, 길르앗의 라못은 갓 사람의 몫이었고, 바산의 골란은 므낫세 사람의 몫이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평지의 땅에’. 히브리어는 평평하거나 고원인 땅을 가리키며, 여기서는 요단 동편의 고원을 더 정확히 드러내기 위해 ‘평지’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  english_pob_choice: Bezer
  chosen_korean: 베셀
  alternatives_korean:
  - 벳세르
