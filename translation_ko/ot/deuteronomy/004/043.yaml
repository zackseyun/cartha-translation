  rationale: מִישֹׁר는 ‘평평한 땅/고원 평지’의 뜻이어서, POB의 ‘tableland’ 취지를 살리되 한국어에서는 ‘평지의 땅’으로 풀어 옮겼습니다.
- source_word: לָרֻאוּבֵנִי / לַגָּדִי / לַמְנַשִּׁי
  english_pob_choice: for the Reubenite / for the Gadite / for the Manassite
  chosen_korean: 르우벤 사람의 몫 / 갓 사람의 몫 / 므낫세 사람의 몫
  alternatives_korean:
  - 르우벤 지파의 몫
  - 갓 지파의 몫
  - 므낫세 지파의 몫
  lexicon: HALOT
  rationale: 히브리어는 단수 gentillic을 사용하지만 지파 할당을 뜻하므로, 한국어에서는 ‘사람의 몫’으로 자연스럽게 처리해 삼중 병렬을 유지했습니다.
