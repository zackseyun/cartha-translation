translation:
  language: ko
  text: 땅 위의 어떤 기는 것의 형상, 땅 아래 물속에 있는 어떤 물고기의 형상도.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형상’은 히브리어 תַּבְנִית의 번역으로, ‘모양’이나 ‘모사’처럼 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 아래’는 출애굽기 20:4의 ‘땅 아래 물’이라는 관용 표현과 연결되는 말입니다.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  english_pob_choice: form
  chosen_korean: 형상
  alternatives_korean:
  - 모양
  - 형태
  - 상
  - 형식
  lexicon: HALOT
  rationale: 우상 금지 문맥에서 תַּבְנִית는 눈에 보이는 대표성 있는 외형을 가리키므로, 한국어에서는 ‘형상’이 ‘form’의 의미를 비교적 직접적으로 살리면서도 우상 자체를 단정하지 않습니다.
- source_word: רֹמֵשׂ
  english_pob_choice: creeping thing
  chosen_korean: 기는 것
  alternatives_korean:
  - 기어다니는 것
  - 땅을 기는 생물
  - 기어 다니는 짐승
  lexicon: HALOT
  rationale: רֹמֵשׂ는 땅을 따라 기어 움직이는 작은 생물을 가리키므로, ‘기는 것’이 범주를 자연스럽고 간결하게 드러냅니다.
- source_word: בָּאֲדָמָה
  english_pob_choice: on the ground
  chosen_korean: 땅 위의
  alternatives_korean:
  - 땅에 있는
  - 지면 위의
  - 땅에서
  lexicon: HALOT
  rationale: 아ֲדָמָה는 여기서 생물이 움직이는 지면/땅 표면을 뜻하므로, ‘땅 위의’가 문맥에 가장 자연스럽습니다.
- source_word: מִתַּחַת לָאָרֶץ
  english_pob_choice: under the earth
  chosen_korean: 땅 아래
  alternatives_korean:
  - 지하의
  - 땅 밑의
  - 땅 아래쪽
  lexicon: HALOT
  rationale: 히브리어의 관용적 우주론 표현을 살리기 위해, ‘땅 아래’로 옮겨 ‘waters under the earth’와의 성경적 상호연결을 유지했습니다.
theological_decisions:
- issue: ‘형상’의 번역이 우상 제작 금지의 강도를 약화시키는지 여부
  chosen_reading: 문맥상 금지 대상은 피조물의 ‘형상’이며, 본절 자체에는 ‘우상’이라는 말을 덧붙이지 않습니다.
  alternative_readings:
  - 우상의 모습
  - 형체
  - 이미지
  rationale: 본문은 출애굽기 20:4의 금지 표현과 연결되는 대표성 있는 외형을 말하므로, 해석어를 덧입히기보다 본문의 표현을 유지하는 것이 원문 충실성에 더 적합합니다.
  doctrine_reference: 원어 우선 번역 원칙, 우상 금지 본문 병행구(출 20:4)
