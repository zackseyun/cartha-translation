translation:
  language: ko
  text: 땅 위에 기는 모든 것의 형상, 땅 아래 물속에 있는 모든 물고기의 형상도.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형상’은 히브리어 תַּבְנִית의 번역으로, ‘모양’, ‘본뜬 모습’ 또는 ‘이미지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 아래 물’은 땅 아래에 물이 있다는 고대의 우주관을 반영하는 성경의 관용 표현입니다. 출애굽기 20:4의 표현과 비교하십시오.
    reason: cross_reference
