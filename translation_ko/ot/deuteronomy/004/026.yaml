revisions:
- from: 오늘 내가 하늘과 땅을 여러분에게 증인으로 세웁니다. 여러분은 요단을 건너 들어가 차지하려는 그 땅에서 반드시 속히 사라질 것입니다. 그 땅 위에서 오래 살지 못할 것이며, 반드시 멸망할 것입니다.[a][b][c]
  to: 오늘 내가 하늘과 땅을 여러분을 거슬러 증인으로 세웁니다.[a][b] 여러분은 요단을 건너 차지하려는 그 땅에서 반드시 속히 멸망할 것입니다. 그 땅에서 오래 살지 못할 것이며,[c] 반드시 멸망할 것입니다.
  rationale: 증인 소환의 대상이 ‘여러분을 거슬러’임을 명시하여 히브리어 בָכֶם과 영어 감사본의 against you를 반영했습니다. 첫 파멸 선언은 ‘멸망하다’로 옮겨 אָבֹד תֹּאבֵדוּן의 강조된 심판 의미를 살렸고, 각주를 해당 어구에 배치했습니다. 마지막 ‘반드시 멸망할 것입니다’는 הִשָּׁמֵד תִּשָּׁמֵדוּן의 별도 강조를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:05Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 בָכֶם은 법정적·적대적 용법으로 ‘여러분을 거슬러/여러분에게 불리하게’라는 뜻입니다. 초안의 ‘여러분에게 증인으로’는 증언의 대상 또는 수혜자를 뜻하는 것으로 읽힐 수 있어 방향을 바로잡아야 합니다. אָבֹד תֹּאבֵדוּן의 파멸 경고도 ‘사라지다’보다 ‘멸망하다’가 원문의 심판적 어조를 더 정확히 반영합니다.
  naturalness: ‘하늘과 땅을 여러분을 거슬러 증인으로 세웁니다’는 현대 표준 한국어의 격식 있는 법정·언약 표현으로 자연스럽습니다. ‘그 땅에서 오래 살지 못할 것’도 한국어에서 토지와 함께 자연스러운 표현입니다.
  terminology: ‘하늘과 땅’, ‘증인’, ‘차지하다’, ‘멸망하다’는 원문의 언약·법정 및 토지 소유 어휘를 과도한 교리화 없이 적절히 재현합니다. 각주 a도 본문의 ‘거슬러’ 방향성을 보존하도록 수정합니다.
  issues:
  - severity: high
    issue: ‘여러분에게 증인으로’가 בָכֶם의 적대적 법정 방향을 흐립니다.
    rationale: 이는 ‘여러분을 위하여 증인으로’ 또는 ‘여러분에게 증인이 되게’로도 읽힐 수 있습니다. 본문은 하늘과 땅을 이스라엘을 거슬러 증언할 증인으로 소환합니다.
  - severity: medium
