base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
  footnotes:
  - marker: a
    text: Or, 'I take heaven and earth to witness against you today.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heavens and the earth'; the idiom 'heaven and earth' is used in English for this covenant-witness formula.
    reason: cultural_note
  - marker: c
    text: Or, 'You will not live long on it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내가 하늘과 땅을 여러분을 거슬러 증인으로 세웁니다.[a][b] 여러분은 요단을 건너 차지하려는 그 땅에서 반드시 속히 멸망할 것입니다. 그 땅에서 오래 살지 못할 것이며,[c] 반드시 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘오늘 내가 하늘과 땅을 여러분을 거슬러 증언하도록 부릅니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘들’과 ‘땅’이지만, 이 언약-증인 공식에서는 한국어도 관용적으로 ‘하늘과 땅’이라 옮깁니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘그 땅에서 오래 머물지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  english_pob_choice: I call heaven and earth to witness against you
  chosen_korean: 하늘과 땅을 여러분에게 증인으로 세웁니다
  alternatives_korean:
  - 하늘과 땅을 여러분에게 증언하게 합니다
  - 하늘과 땅을 여러분에 대하여 증인으로 부릅니다
  lexicon: HALOT
  rationale: עוּד의 히필은 법정적/언약적 증인 소환의 뜻이므로, 단순한 ‘경고’보다 ‘증인으로 세우다’가 원문의 기능을 더 잘 드러냅니다.
- source_word: מַהֵר
  english_pob_choice: quickly
  chosen_korean: 속히
  alternatives_korean:
  - 빨리
  - 곧
  lexicon: HALOT
  rationale: 추방과 멸망의 임박성을 나타내는 부사로, 현대 문어에서 자연스럽고 엄중한 ‘속히’가 적절합니다.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  english_pob_choice: You will not prolong your days on it
  chosen_korean: 그 땅 위에서 오래 살지 못할 것이며
  alternatives_korean:
  - 그 땅 위에서 날들을 길게 누리지 못할 것이며
  - 그 위에서 오래 머물지 못할 것이며
  lexicon: HALOT
  rationale: ‘날들을 길게 하다’의 히브리어 관용을 한국어에서 자연스럽게 풀되, 결과적으로 ‘오래 살지 못하다’라는 의미를 보존했습니다.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  english_pob_choice: you will surely be destroyed
  chosen_korean: 반드시 멸망할 것입니다
  alternatives_korean:
  - 반드시 멸절될 것입니다
  - 완전히 멸망할 것입니다
  lexicon: HALOT
  rationale: 강조형(부정확한 단순 미래가 아니라 확언된 파멸)을 살리되, 한국어에서 가장 직접적이고 본문 어조에 맞는 ‘멸망하다’를 택했습니다.
theological_decisions:
- issue: 하늘과 땅의 증인 소환
  chosen_reading: 창조 세계를 언약 소송의 증인으로 소환하는 법정적 표현으로 번역했습니다.
  alternative_readings:
  - 단순한 맹세나 경고로 완화하여 번역하는 방식
  rationale: 본문은 언약 위반에 대한 공적 증언 구조를 갖고 있으므로, 그 법정성을 약화하지 않도록 ‘증인으로 세웁니다’라고 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
