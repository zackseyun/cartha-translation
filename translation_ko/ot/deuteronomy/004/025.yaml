id: DEU.4.25
reference: Deuteronomy 4:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
  footnotes:
  - marker: a
    text: Or 'sons and grandsons.' The Hebrew uses masculine descendant terms, but here they likely function generically for one's offspring across generations.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have been long in the land.' The Hebrew verb can emphasize becoming old or being long-settled.
    reason: lexical_alternative
  - marker: c
    text: Or 'the likeness of anything' or 'any form.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 이 땅에서 아들과 손자들을 낳고, 그 땅에서 오래 살면서 타락하여 어떤 형상으로든 새긴 우상을 만들고, 네 하나님 야훼의 눈앞에서 악을 행하여 그분을 진노하게 할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי תוֹלִיד
  english_pob_choice: When you father
  chosen_korean: 네가 ... 아들과 손자들을 낳고
  alternatives_korean:
  - 네가 자녀와 손자들을 낳고
  - 네가 아들과 손자들을 두고
  lexicon: HALOT
  rationale: 히브리어의 미래적 시간절과 ‘낳다’의 생물학적·세대적 이미지를 살리되, 한국어에서는 자연스럽게 ‘낳고’로 풀어 연결했습니다.
- source_word: בָּנִים וּבְנֵי בָנִים
  english_pob_choice: children and grandchildren
  chosen_korean: 아들과 손자들
  alternatives_korean:
  - 자녀와 손자들
  - 아들들과 손자들
  lexicon: HALOT
  rationale: 원문은 남성형 계열 표현이지만 가계의 후손 전체를 가리키는 문맥이므로, 영어 POB의 의미를 따라 세대 계승을 드러내는 표현으로 옮겼습니다.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  english_pob_choice: you have grown old in the land
  chosen_korean: 그 땅에서 오래 살면서
  alternatives_korean:
  - 그 땅에서 늙어가며
  - 그 땅에 오래 머물러
  lexicon: HALOT
  rationale: 동사의 ‘오래됨/오래 거주함’의 뉘앙스를 한국어로 가장 자연스럽게 드러내는 표현을 택했습니다.
- source_word: פֶּסֶל תְּמוּנַת כֹּל
  english_pob_choice: a carved image in the form of anything
  chosen_korean: 어떤 형상으로든 새긴 우상
  alternatives_korean:
  - 어떤 것의 형상으로 새긴 형상
  - 무엇이든 본뜬 새긴 형상
  lexicon: HALOT
  rationale: פֶּסֶל의 조각·제작 이미지를 살리면서, תְּמוּנַת כֹּל의 포괄성을 한국어로 압축해 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 전통적 대체 칭호가 아니라 고유 이름임을 보존했습니다.
theological_decisions:
- issue: ‘형상/우상’ 관련 경고의 강도
  chosen_reading: ‘새긴 우상’으로 옮겨 조각 행위와 우상성 모두를 드러냈습니다.
  alternative_readings:
  - ‘새긴 형상’
  - ‘조각상’
  rationale: פֶּסֶל은 단순한 예술품이 아니라 금지된 우상 제작을 가리키므로, 문맥상 신학적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 우상 금지 본문의 직접성 보존'
- issue: ‘그분을 진노하게 할 것입니다’의 서술 방식
  chosen_reading: 원문의 목적/결과적 표현을 살려 ‘그분을 진노하게 할 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘그분의 진노를 일으킬 것입니다’
  - ‘그분을 화나게 할 것입니다’
  rationale: לְהַכְעִיסוֹ는 단순 감정 표현보다 언약 위반이 불러오는 진노의 결과를 드러내므로, 성경적 어조를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 언약적 진노 표현'
