  lexicon: HALOT
  rationale: 부정 표현과 동사의 진행성을 반영하되, 문맥상 모세와 이스라엘의 대조를 드러내기 위해 한국어에서는 ‘-지 못하지만’으로 자연스럽게 연결했습니다.
- source_word: וִירִשְׁתֶּם
  english_pob_choice: will take possession of
  chosen_korean: 차지할 것입니다
  alternatives_korean:
