  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
  footnotes:
  - marker: a
    text: Or 'I am about to die in this land.' The Hebrew participle can express imminent future action.
    reason: lexical_alternative
  - marker: b
    text: Or 'will possess' or 'will inherit.' The Hebrew verb can denote taking possession of land as an inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 이 땅에서 죽기 때문입니다[a]. 나는 요단을 건너지 못하지만, 여러분은 건너가서 이 좋은 땅을 차지할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 이 땅에서 곧 죽게 됩니다.’ 히브리어 분사는 임박한 미래의 행동을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘차지할 것입니다’ 혹은 ‘상속받을 것입니다.’ 히브리어 동사는 땅을 유산으로 받아 점유하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  english_pob_choice: am dying
  chosen_korean: 죽기 때문입니다
  alternatives_korean:
  - 죽어 가고 있습니다
  - 곧 죽게 됩니다
  lexicon: HALOT
  rationale: 히브리어 분사는 임박한 죽음을 나타내므로, 현재적 진행감과 원인 관계를 함께 살릴 수 있는 표현으로 옮겼습니다.
- source_word: אֵינֶנִּי עֹבֵר
  english_pob_choice: I am not crossing
  chosen_korean: 요단을 건너지 못하지만
  alternatives_korean:
  - 요단을 건너지 않습니다
  - 요단을 건너지 않을 것입니다
  lexicon: HALOT
  rationale: 부정 표현과 동사의 진행성을 반영하되, 문맥상 모세와 이스라엘의 대조를 드러내기 위해 한국어에서는 ‘-지 못하지만’으로 자연스럽게 연결했습니다.
- source_word: וִירִשְׁתֶּם
  english_pob_choice: will take possession of
  chosen_korean: 차지할 것입니다
  alternatives_korean:
  - 소유하게 될 것입니다
  - 상속받을 것입니다
  lexicon: HALOT
  rationale: 땅 약속 문맥의 ‘차지하다/점유하다’ 의미를 살리면서 현대 한국어에서 자연스럽고 명확하게 전달했습니다.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  english_pob_choice: this good land
  chosen_korean: 이 좋은 땅
  alternatives_korean:
  - 이 선한 땅
  - 이 복된 땅
  lexicon: HALOT
  rationale: ‘좋은 땅’이라는 관용적 결합을 유지해 원문의 평가적 표현과 약속의 맥락을 보존했습니다.
theological_decisions:
- issue: 모세의 죽음이 임박했음을 나타내는 분사 처리
  chosen_reading: ‘죽기 때문입니다’로 옮겨, 이미 시작된 임박성을 드러냈습니다.
  alternative_readings:
  - ‘곧 죽게 됩니다’
  - ‘죽어 가고 있습니다’
  rationale: 본문의 분사는 단순 미래 예언보다 임박한 상황을 말하므로, 서술의 긴박함을 유지하는 번역이 적절합니다.
  doctrine_reference: 본문 주석적/문법적 처리
- issue: 땅을 ‘상속하다’보다 ‘차지하다’로 옮김
  chosen_reading: 언약적 상속 개념은 유지하되, 본문 자체의 동작 의미를 살려 ‘차지하다’로 표현했습니다.
  alternative_readings:
  - ‘상속받을 것입니다’
  - ‘소유할 것입니다’
  rationale: 히브리어 ירשׁ는 땅 약속 문맥에서 ‘상속’의 신학적 배경이 있으나, 여기서는 실제로 땅에 들어가 점유하는 의미가 선명하므로 두 층위를 함께 고려했습니다.
  doctrine_reference: 언약/땅 약속의 본문적 의미
