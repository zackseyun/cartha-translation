translation:
  language: ko
  text: 땅에 있는 어떤 짐승의 형상[a], 하늘들에서 나는 날개 달린 어떤 새의 형상[b]도 만들지 말라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모양’, ‘이미지’로도 옮길 수 있습니다. 여기의 תַּבְנִית는 예배용으로 만들어진 표상이라는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘에서’라고도 옮길 수 있습니다. 히브리어는 복수형 ‘하늘들’을 사용하여 눈에 보이는 하늘을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  english_pob_choice: form
  chosen_korean: 형상
  alternatives_korean:
  - 모양
  - 형체
  - 모습
  lexicon: HALOT
  rationale: 우상 제작을 가리키는 문맥에서 תַּבְנִית는 단순한 외형보다 ‘만들어진 대표 형상’의 뜻이 강하므로, 한국어에서는 전통적이지만 본문 의도를 잘 드러내는 ‘형상’이 가장 적절합니다.
- source_word: בְּהֵמָה
