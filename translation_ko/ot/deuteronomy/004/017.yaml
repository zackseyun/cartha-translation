  - 들짐승
  - 가축
  lexicon: HALOT
  rationale: 여기서는 특정 가축이 아니라 땅 위의 모든 동물 범주를 가리키므로, 광범위한 생물군을 자연스럽게 살리는 ‘짐승’을 택했습니다.
- source_word: צִפּוֹר כָּנָף
  english_pob_choice: winged bird
  chosen_korean: 날개 달린 새
  alternatives_korean:
  - 날개 있는 새
  - 날짐승
  - 날개를 가진 새
  lexicon: HALOT
  rationale: 히브리어의 결합어는 날 수 있는 새를 강조하므로, 한국어에서는 직역보다 자연스러운 ‘날개 달린 새’가 구조와 의미를 함께 살립니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘들에서
  alternatives_korean:
  - 하늘에서
  - 하늘에서 나는
  - 하늘의
  lexicon: HALOT
  rationale: 히브리어 복수형을 살리기 위해 ‘하늘들’로 옮겼고, 위치를 나타내는 조사로 문맥상 자연스럽게 ‘에서’를 붙였습니다.
theological_decisions:
- issue: 우상 제작 금지의 표현을 완화하지 않을지 여부
  chosen_reading: ‘형상’과 ‘만들지 말라’로, 제의적 우상 제작 금지를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘모양’을 사용해 약화시키는 번역
  - ‘그림자 같은 것’으로 완화하는 번역
  rationale: 본문은 단순한 묘사 금지가 아니라 숭배용 대표물 제작 금지를 말하므로, 이를 흐리지 않는 직접 번역이 필요합니다.
  doctrine_reference: 출애굽기 20:4; 신명기 4:16-18의 우상 금지 맥락
- issue: ‘하늘들’의 복수형 유지 여부
  chosen_reading: 히브리어 복수형을 반영해 ‘하늘들’로 옮겼습니다.
  alternative_readings:
  - 의미에 맞게 ‘하늘’로 단수화
  - ‘하늘’로 일반화하되 주석 생략
  rationale: 원문 형식을 보존하여 창조 영역의 범주 대비를 살리기 위한 선택입니다.
  doctrine_reference: 히브리어 시적/제의적 복수형 보존 원칙
