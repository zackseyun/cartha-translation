base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
  footnotes:
  - marker: a
    text: Or 'that it may be good for you.' The Hebrew idiom means that things will go well for you.
    reason: lexical_alternative
  - marker: b
    text: '''Your children'' may also be rendered ''your sons'' or more broadly ''your descendants,'' depending on how specifically the term is taken in context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the land.' The Hebrew preposition is literally 'on,' but English often says 'in the land' for this idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 오늘 내가 여러분에게 명령하는 그분의 규례들과 그분의 명령들을 지키십시오. 그러면 여러분과 여러분 뒤를 이을 자녀들이 잘되고, 여러분의 날들이 여러분의 하나님 야훼께서 여러분에게 주시는 땅에서 길어질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘여러분에게 잘될 것입니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자녀들’은 문맥에 따라 ‘아들들’ 또는 더 넓게는 ‘후손들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘땅 위에서’이지만, 한국어에서는 자연스럽게 ‘땅에서’라고도 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  english_pob_choice: So you shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 지켜야 합니다
  - 지키게 하십시오
  lexicon: HALOT
  rationale: 언약 문맥의 שׁמר는 단순 보관이 아니라 충실히 준수하라는 뜻이므로, 현대 합쇼체 명령형으로 간결하게 살렸습니다.
- source_word: חֻקָּיו
  english_pob_choice: his statutes
  chosen_korean: 그분의 규례들
  alternatives_korean:
  - 그분의 율례들
  - 그분의 법규들
  lexicon: HALOT
  rationale: חֻקִּים은 정해진 규정/제정된 조항의 뉘앙스가 있어, 한국어에서는 ‘규례들’이 전통적이면서도 ‘명령들’과 구별됩니다.
- source_word: מִצְוֺתָיו
  english_pob_choice: his commandments
  chosen_korean: 그분의 명령들
  alternatives_korean:
  - 그분의 계명들
  - 그분의 부탁들
  lexicon: HALOT
  rationale: מִצְוֹת는 직접적 명령을 가리키므로, 한국어에서는 의미가 분명한 ‘명령들’을 택해 앞의 ‘규례들’과 병렬을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명은 제목이 아니라 이름이므로, 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 언약 순종의 결과를 나타내는 목적/결과절 표현
  chosen_reading: “그렇게 하면 여러분과 여러분 뒤의 자녀들에게 복이 있을 것이며…”로 옮겨, 단순한 인과를 넘어 순종과 복의 언약적 연결을 드러냈습니다.
  alternative_readings:
  - “그러면 좋을 것입니다”
  - “여러분에게 잘될 것입니다”
  rationale: 히브리어 יִיטַב לְךָ는 관용적으로 ‘형편이 잘되다/복이 있다’는 뜻이므로, 한국어에서는 결과를 자연스럽게 드러내면서도 언약적 의미를 유지했습니다.
  doctrine_reference: 신명기 4:40의 순종-복 약속(언약적 보응)
