theological_decisions:
- issue: 우상 금지의 누적 표현을 한국어에서 어떻게 유지할 것인가
  chosen_reading: ‘새긴 형상’과 ‘어떤 모습’의 이중 표현으로, 금지 대상이 단일 어휘가 아니라 제작된 형상의 범주 전체임을 드러냈습니다.
  alternative_readings:
  - 하나의 단순 표현으로 통합
  - ‘우상’으로만 번역
  rationale: 히브리어는 פֶּסֶל, תְּמוּנָה, סָמֶל, תַּבְנִית를 겹쳐 사용하여 금지의 범위를 넓힙니다. 이를 단일어로 평면화하면 수사적 누적이 약화됩니다.
