  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
  footnotes:
  - marker: a
    text: Or 'your sons and your sons' sons.' The Hebrew uses masculine plural terms that can refer specifically to sons or more broadly to children/descendants in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your heart,' often referring to the inner person, including memory, understanding, and will.
    reason: cultural_note
translation:
  language: ko
  text: 오직 너 자신을 삼가고, 네 자신을 매우 조심하여 지키십시오. 네 눈으로 본 것들을 잊지 않도록 하고, 그것들이 네 마음[b]에서 평생 떠나지 않도록 하십시오. 그것들을 네 자녀[a]와 네 자녀의 자녀에게 알리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형을 사용하지만, 문맥상 자녀나 후손을 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘네 마음’은 기억, 이해, 의지를 포함하는 내면 전체를 가리키는 경우가 많습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 오로지
  lexicon: HALOT
  rationale: 강한 제한과 강조를 드러내는 התחלה로, 한국어에서는 간결한 ‘오직’이 가장 자연스럽게 힘을 살립니다.
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: guard yourself
  chosen_korean: 스스로를 … 지키고
  alternatives_korean:
  - 자신을 조심하고
  - 스스로를 경계하고
  lexicon: HALOT
  rationale: 반사적 경계의 뉘앙스를 살리기 위해 ‘스스로를 지키다’로 옮겼습니다. 이어지는 반복 명령과 함께 자기-감시의 강도를 유지합니다.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  english_pob_choice: and keep your soul very carefully / and watch yourself very closely
  chosen_korean: 스스로를 매우 조심하여 지키고
  alternatives_korean:
  - 네 영혼을 매우 조심하여 지키고
  - 너 자신을 극히 주의하여 지키고
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 좁은 의미의 ‘영혼’보다 인격 전체를 가리키므로, ‘스스로’로 풀어 한국어 독자가 자연스럽게 이해하도록 했습니다. ‘매우’는 מְאֹד의 강조를 반영합니다.
- source_word: וְהוֹדַעְתָּם
  english_pob_choice: Make them known
  chosen_korean: 알리십시오
  alternatives_korean:
  - 가르치십시오
  - 알게 하십시오
  lexicon: HALOT
  rationale: Hiphil의 ‘알게 하다/알리다’ 의미를 직접 반영했습니다. ‘가르치다’는 해석을 더하므로 여기서는 피했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 인간 이해
  chosen_reading: ‘영혼’으로 한정하지 않고 ‘스스로를’로 옮겼습니다.
  alternative_readings:
  - 네 영혼을
  - 네 생명을
  rationale: 이 경고문맥에서 נֶפֶשׁ은 분리된 비물질 실체보다 인격 전체를 가리킵니다. 한국어에서 ‘영혼’으로 고정하면 본문의 경계와 촉구가 좁아질 수 있어, 전체 자아를 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: בָנִים의 지시 범위
  chosen_reading: ‘자녀’로 번역해 다음 세대 전체를 포괄했습니다.
  alternative_readings:
  - 아들들
  - 아들들과 손자들
  rationale: 문맥은 언약 기억의 세대 전승이므로 남성 자손만을 지시한다고 보기 어렵습니다. 한국어 ‘자녀’가 source 의도를 가장 자연스럽게 전달합니다.
  doctrine_reference: Translation philosophy §4
