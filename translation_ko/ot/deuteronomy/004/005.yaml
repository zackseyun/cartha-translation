  source_fidelity: 초안은 규례/법도의 병렬, 야훼라는 신명, 땅 ‘한가운데’라는 표현, 그리고 행위의 목적을 대체로 보존합니다. 그러나 ‘이는 … 명령하신 대로입니다’는 ‘가르쳤다’가 야훼의 명령에 따른 것이라는 수식 관계를 독립 설명문으로 약화합니다. 또한 마지막 문장은 원문의 목적을 더 직접적으로 연결할 수 있습니다.
  naturalness: ‘야훼 내 하나님께서’는 가능하나 ‘야훼, 내 하나님께서’ 또는 ‘내 하나님 야훼께서’가 현대 한국어에서 더 명료합니다. 두 개의 ‘이는’으로 이어지는 초안은 다소 설명적이고 부자연스럽습니다. 문장을 재구성하여 합쇼체의 격식을 유지하면서도 자연스럽게 다듬었습니다.
  terminology: ‘규례와 법도’는 חֻקִּים וּמִשְׁפָּטִים의 법률적 병렬을 보존하는 안전한 번역입니다. יְהוָה는 제공된 번역 방침에 따라 ‘야훼’로 유지했습니다. ‘차지하다’는 לְרִשְׁתָּהּ의 넓은 의미를 무리 없이 반영합니다.
  issues:
