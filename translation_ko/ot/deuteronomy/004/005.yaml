id: DEU.4.5
reference: Deuteronomy 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
  footnotes:
  - marker: a
    text: Or 'decrees and ordinances' for 'statutes and judgments.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the midst of the land'; many translations simplify to 'in the land.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you are entering to possess' or 'you are going there to inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 내가 너희에게 규례와 법도를 가르쳤으니, 이는 야훼 내 하나님께서 내게 명령하신 대로입니다[b][c]. 이는 너희가 들어가 차지할 땅 한가운데서 그렇게 행하게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보라’이지만, 현대 한국어에서는 주의를 끄는 서두로 ‘보십시오’가 더 자연스럽습니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 ‘야훼 내 하나님께서’라는 직접적인 표현을 사용합니다.
    reason: source_note
  - marker: c
    text: ‘명령하신 대로’는 히브리어의 ‘내게 명령하신 것과 같이’를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 단수 명령형으로, 현대 합쇼체에서는 ‘보십시오’가 직접성을 유지하면서도 자연스럽습니다.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  english_pob_choice: statutes and judgments
  chosen_korean: 규례와 법도
  alternatives_korean:
  - 규례들과 판단들
  - 규정과 판결
  lexicon: HALOT
  rationale: 두 법률 용어의 병렬을 살리되, 한국어에서 의미가 비교적 분명한 ‘규례와 법도’로 옮겨 법적 어조를 유지했습니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼 내 하나님
  alternatives_korean:
  - 야훼 나의 하나님
  - 주 나의 하나님
  lexicon: HALOT
  rationale: 이 역본의 기준에 따라 신명기 본문의 하나님의 이름은 ‘야훼’로 옮기고, 소유 관계는 자연스러운 ‘내 하나님’으로 처리했습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 땅 한가운데서
  alternatives_korean:
  - 그 땅 한가운데서
  - 땅 가운데에서
  lexicon: HALOT
  rationale: ‘בְּקֶרֶב’의 중심성 이미지를 살리기 위해 단순한 ‘땅에서’가 아니라 ‘한가운데서’로 옮겼습니다.
- source_word: לַעֲשׂוֹת כֵּן
  english_pob_choice: to do thus / so that you may do so
  chosen_korean: 그렇게 행하게 하려는 것입니다
  alternatives_korean:
  - 그리하여 그렇게 하게 하려는 것입니다
  - 그렇게 하도록 하기 위함입니다
  lexicon: HALOT
  rationale: 목적절의 기능을 살리면서도 한국어 문장으로 자연스럽게 연결되도록 ‘행하게 하려는 것입니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 나타난 언약 이름을 가리고 통상적 호칭으로 완화하지 않기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
