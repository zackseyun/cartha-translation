  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
  footnotes:
  - marker: a
    text: Or 'decrees and ordinances' for 'statutes and judgments.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the midst of the land'; many translations simplify to 'in the land.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you are entering to possess' or 'you are going there to inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 나는 야훼, 내 하나님께서 내게 명령하신 대로 너희에게 규례와 법도를 가르쳤습니다[a]. 이는 너희가 그곳으로 들어가 차지할 땅 한가운데에서[b][c] 그렇게 행하도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례와 법도’는 히브리어의 법률 용어 두 개를 병렬로 옮긴 것입니다. 또는 ‘법령과 판결들’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘땅의 한가운데에서’입니다. 흔히 ‘그 땅에서’로 간략히 번역합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳으로 들어가 그 땅을 상속받을’로 번역할 수 있습니다.
    reason: lexical_alternative
