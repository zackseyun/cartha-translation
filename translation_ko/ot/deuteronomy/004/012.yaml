base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
  footnotes:
  - marker: a
    text: Or 'out of the fire.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sound of words'; alternatively, 'the sound of speech.'
    reason: lexical_alternative
  - marker: c
    text: Or 'likeness' or 'appearance.' The Hebrew emphasizes that no visible representation was seen.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 불 가운데서 너희에게 말씀하셨습니다[a]. 너희는 말씀의 소리를 들었지만[b], 어떤 형상도 보지 못했고[c] 오직 소리만 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불 가운데서부터’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘말들의 소리’입니다. 또는 ‘말소리’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모양’, ‘모습’일 수 있습니다. 히브리어는 보이는 어떤 표현도 보지 못했다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례 / HALOT 관례
  rationale: 본 프로젝트의 기본 표기를 따라 언약적 신명성을 드러내며, 전통 교회어인 ‘여호와’보다 원어 근접형을 유지합니다.
- source_word: מִתּוֹךְ הָאֵשׁ
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데서
  alternatives_korean:
  - 불 속에서
  - 불 가운데로부터
  lexicon: HALOT
  rationale: מִתּוֹךְ의 ‘가운데서’라는 공간적 이미지를 자연스럽게 살리면서, 발화가 불 한가운데서 나왔다는 뜻을 유지합니다.
- source_word: קוֹל דְּבָרִים
  english_pob_choice: the sound of words
  chosen_korean: 말씀의 소리
  alternatives_korean:
  - 말들의 소리
  - 말소리
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어에서는 ‘소리’와 함께 ‘말씀’이 병기되도록 하여 단순한 음성보다 의미를 가진 발화를 드러냅니다.
- source_word: תְמוּנָה
  english_pob_choice: form
  chosen_korean: 형상
  alternatives_korean:
  - 모양
  - 모습
  - 형태
  lexicon: HALOT
  rationale: 여기서는 보이는 신적 표상이 없었다는 대조가 핵심이므로, ‘형상’이 가시적 प्रतिनिध를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 보이는 계시와 들리는 계시의 대비
  chosen_reading: 하나님은 불 가운데서 실제로 말씀하셨지만, 이스라엘은 어떤 가시적 형상도 보지 못했다는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 음성만 들었고 형상은 전혀 없었다
  - 말씀은 들었지만 아무 모습도 나타나지 않았다
  rationale: 본문은 신적 현현을 음성 중심으로 제시하며, 형상 부재를 통해 우상적 표상을 차단합니다. 이를 약화시키지 않도록 설명적 확장을 피했습니다.
  doctrine_reference: 신 4:12의 계시 이해; 우상 금지 문맥
