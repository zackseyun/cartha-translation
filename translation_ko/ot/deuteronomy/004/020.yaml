  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
  footnotes:
  - marker: a
    text: Or 'to be his own people' or 'to be a people for his possession.' The Hebrew literally says 'to be for him a people of inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 여러분을 데려가시고, 철 용광로, 곧 이집트에서 여러분을 이끌어 내셔서, 오늘과 같이 그분의 기업이 될 백성으로 삼으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘철 용광로’입니다. 이는 이집트를 가리키는 비유적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 학술적 음역인 야훼로 옮겨, 언약적 고유성을 보존했습니다.
- source_word: לָקַח
  english_pob_choice: took
  chosen_korean: 택하시고
  alternatives_korean:
  - 데려가시고
  - 취하시고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘가져감’보다 하나님이 이스라엘을 자기 백성으로 선택하여 취하신 뉘앙스가 강하므로, POB의 ‘took’이 담는 선택·소유의 의미를 한국어에서 자연스럽게 드러냈습니다.
- source_word: מִכּוּר הַבַּרְזֶל
  english_pob_choice: out of the iron furnace
  chosen_korean: 철 용광로인
  alternatives_korean:
  - 철로 된 용광로인
  - 쇠 용광로인
  - 철 제련로인
  lexicon: HALOT
  rationale: 비유적 이미지가 강한 표현이므로 ‘철 용광로’로 직역하되, 이집트를 설명하는 동격 구조를 살려 자연스럽게 연결했습니다.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  english_pob_choice: to be for him a people of inheritance
  chosen_korean: 그분의 소유 백성이 되게 하셨습니다
  alternatives_korean:
  - 그분의 기업 백성이 되게 하셨습니다
  - 그분께 속한 백성이 되게 하셨습니다
  - 그분의 상속 백성이 되게 하셨습니다
  lexicon: HALOT
  rationale: נַחֲלָה의 언약적 소유/기업 의미를 한국어에서 가장 자연스럽게 살리기 위해 ‘소유 백성’으로 옮겼습니다. ‘기업 백성’은 교회 전통어감이 강하고, ‘상속 백성’은 현대 한국어에서 의미가 불분명합니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘과 같이
  alternatives_korean:
  - 이 날까지
  - 오늘 이처럼
  - 오늘과 마찬가지로
  lexicon: HALOT
  rationale: 현재까지 지속되는 사실을 가리키는 관용구로서, 현대 한국어에서 자연스러운 ‘오늘과 같이’로 옮겼습니다.
theological_decisions:
- issue: נַחֲלָה의 언약적 소유 의미
  chosen_reading: ‘소유 백성’으로 옮겨, 하나님께 속한 언약 백성이라는 뜻을 드러냈습니다.
  alternative_readings:
  - 기업 백성
  - 소유의 백성
  - 하나님의 소유가 된 백성
  rationale: 본문은 이스라엘의 신분을 단순한 민족적 선택이 아니라 야훼께 속한 언약적 소유로 설명합니다. 한국어에서는 ‘소유 백성’이 그 관계를 가장 간결하고 직접적으로 전달합니다.
  doctrine_reference: Translation philosophy §§1, 5
