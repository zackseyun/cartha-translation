revisions:
- from: 그러나 야훼께서 여러분을 택하시고, 철 용광로인 이집트에서 여러분을 이끌어 내셔서, 오늘과 같이 그분의 소유 백성이 되게 하셨습니다.[a]
  to: 그러나 야훼께서는 여러분을 데려가시고, 철 용광로, 곧 이집트에서 여러분을 이끌어 내셔서, 오늘과 같이 그분의 기업이 될 백성으로 삼으셨습니다.[a]
  rationale: 직접적 동사 의미를 따라 ‘택하시고’를 ‘데려가시고’로 고치고, נַחֲלָה의 기업·상속 어휘를 보존하도록 ‘그분의 기업이 될 백성’으로 수정했습니다. 이집트와 철 용광로의 관계는 ‘곧’으로 명시하되, 원문의 비유를 유지했습니다.
