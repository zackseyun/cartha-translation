review_pass:
  verdict: revise
  source_fidelity: ‘택하시고’는 לָקַח의 기본 의미인 ‘데려가다/취하다’를 ‘선택하다’로 해석하여 확장합니다. 또한 נַחֲלָה는 여기서 이스라엘이 야훼의 ‘기업’이라는 표현이므로, ‘소유 백성’보다 ‘그분의 기업이 될 백성’이 어휘적 대응을 더 잘 보존합니다. ‘철 용광로, 곧 이집트에서’는 두 번의 מִן과 이집트가 그 비유의 지시 대상임을 자연스럽게 반영합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘백성으로 삼으셨습니다’는 목적을 나타내는 לִהְיוֹת 구문을 매끄럽게 옮기며, ‘오늘과 같이’도 원문의 현재 확인 관용구를 유지합니다.
  terminology: 야훼는 제공된 프로젝트 선택과 일치합니다. ‘기업’은 נַחֲלָה의 상속·소유 어휘를 보존하는 전통적이면서도 이해 가능한 성경 용어입니다. 각주에서는 본문의 비유를 설명하되, ‘단련’이라는 해석적 함의는 본문 자체에 명시되지 않으므로 제외했습니다.
  issues:
  - severity: medium
    issue: ‘택하시고’가 לָקַח을 해석적으로 확장합니다.
    rationale: לָקַח의 직접적 의미는 ‘취하다, 데려가다’입니다. 선택의 함의는 문맥에 있을 수 있으나, 동사 자체를 ‘택하다’로 번역하면 원문의 표현을 좁힙니다.
  - severity: medium
    issue: ‘그분의 소유 백성’이 נַחֲלָה의 ‘기업/상속’ 어휘를 평준화합니다.
    rationale: 소유 관계는 맞지만, נַחֲלָה가 지닌 기업·상속의 이미지는 사라집니다. ‘그분의 기업이 될 백성’은 의미와 문맥을 함께 보존합니다.
  - severity: low
    issue: 기존 각주의 ‘단련의 장소’ 설명은 본문보다 해석적입니다.
    rationale: 철 용광로는 혹독한 속박의 비유로 기능하지만, 이 절은 단련의 목적을 명시하지 않습니다. 각주는 문자적 표현과 비유적 지시만 밝혀 두는 편이 안전합니다.
  revised_text: 그러나 야훼께서는 여러분을 데려가시고, 철 용광로, 곧 이집트에서 여러분을 이끌어 내셔서, 오늘과 같이 그분의 기업이 될 백성으로 삼으셨습니다.[a]
