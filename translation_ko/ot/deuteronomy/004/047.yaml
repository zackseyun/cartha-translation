  - 요단을 건너서
  lexicon: HALOT
  rationale: 지리 관용구를 한국어 관용 표현으로 옮기되, 영어 POB의 주석처럼 관점 의존성을 열어 둡니다.
- source_word: מִזְרַח שָׁמֶשׁ
  english_pob_choice: toward the sunrise
  chosen_korean: 해 뜨는 쪽
  alternatives_korean:
  - 동쪽으로
  - 해 뜨는 방향
  lexicon: HALOT
  rationale: 직역적인 ‘해 뜨는 쪽’이 원문의 구체적 이미지와 동쪽 의미를 함께 살려 주어, POB의 ‘toward the sunrise’를 한국어로 자연스럽게 반영합니다.
