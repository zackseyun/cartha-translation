  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
  footnotes:
  - marker: a
    text: Or “across the Jordan” or “on the other side of the Jordan.” The Hebrew expression is a standard geographical idiom whose exact English perspective depends on narrative viewpoint.
    reason: lexical_alternative
  - marker: b
    text: Literally “toward the sunrise,” that is, eastward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그의 땅[a]과 바산 왕 옥의 땅, 곧 요단 건너편[b] 해 뜨는 쪽에 있는 아모리 사람의 두 왕의 땅을 차지하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요단 건너편”, “요단 저편”으로도 옮길 수 있습니다. 히브리어 표현은 서술 관점에 따라 달라지는 표준 지리 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “해 뜨는 쪽”이며, 곧 동쪽을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  english_pob_choice: they took possession of
  chosen_korean: 차지하였습니다
  alternatives_korean:
  - 소유하였습니다
  - 점유하였습니다
  - 빼앗아 차지하였습니다
  lexicon: HALOT
  rationale: 정복 문맥의 ירשׁ이 가진 ‘차지하여 소유하게 되다’는 뜻을 자연스러운 현대 한국어로 살리면서, 단순 소유보다 점유·정복의 뉘앙스를 유지합니다.
- source_word: אַרְצוֹ
  english_pob_choice: his land
  chosen_korean: 그의 땅
  alternatives_korean:
  - 그의 영토
  - 그 땅
  lexicon: HALOT
  rationale: 3인칭 남성 단수 접미사는 직전 문맥의 왕을 가리키므로, 가장 직접적인 대응인 ‘그의 땅’으로 옮겼습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 건너편
  alternatives_korean:
  - 요단 저편
  - 요단을 건너서
  lexicon: HALOT
  rationale: 지리 관용구를 한국어 관용 표현으로 옮기되, 영어 POB의 주석처럼 관점 의존성을 열어 둡니다.
- source_word: מִזְרַח שָׁמֶשׁ
  english_pob_choice: toward the sunrise
  chosen_korean: 해 뜨는 쪽
  alternatives_korean:
  - 동쪽으로
  - 해 뜨는 방향
  lexicon: HALOT
  rationale: 직역적인 ‘해 뜨는 쪽’이 원문의 구체적 이미지와 동쪽 의미를 함께 살려 주어, POB의 ‘toward the sunrise’를 한국어로 자연스럽게 반영합니다.
theological_decisions:
- issue: 지리 표현 ‘요단 건너편’의 관점
  chosen_reading: 본문은 위치를 단정하기보다 서술 관점에 따라 달라질 수 있는 관용구를 그대로 살립니다.
  alternative_readings:
  - 요단 저편
  - 요단을 건너서
  rationale: 히브리어 עֵבֶר הַיַּרְדֵּן은 화자/서술 관점에 따라 다르게 이해될 수 있어, 특정 방향으로 고정하지 않고 열린 표현을 유지했습니다.
  doctrine_reference: 지리·서술 관점에 대한 본문 충실성
