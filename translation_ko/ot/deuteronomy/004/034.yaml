base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
  footnotes:
  - marker: a
    text: Or 'great awesome deeds' or 'great fearsome acts.' The Hebrew expression refers to acts that inspire fear and awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 신이 너희의 눈앞에서 너희 하나님 야훼께서 이집트에서 너희를 위하여 행하신 모든 일처럼, 시험과 표적과 이적과 전쟁과 강한 손과 편 팔과 큰 두려움들[a]로 가서 자신을 위해 한 민족을 다른 민족 가운데서 데려가려고 시도한 적이 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘큰 두려움들’은 공포를 불러일으키는 행위들 또는 그로 인해 생긴 두려움을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  english_pob_choice: has ... ever attempted
  chosen_korean: 시도한 적이 있느냐
  alternatives_korean:
  - 해보려 한 적이 있느냐
  - 감히 해본 적이 있느냐
  lexicon: HALOT
  rationale: 반어적 질문의 핵심은 전례 없는 ‘시도’ 여부이므로, 결과보다 행위의 착수를 드러내는 표현이 적절합니다.
- source_word: אֱלֹהִים
  english_pob_choice: any god
  chosen_korean: 하나님
  alternatives_korean:
  - 어떤 신
  - 어느 신
  lexicon: HALOT
  rationale: 문맥상 참 하나님에 대한 호칭이 아니라 다른 신들과의 비교를 위한 일반 명사이므로, 한국어에서는 앞에 수식어를 두어 ‘하나님이’가 일반명사적 대비를 이루도록 처리했습니다.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  english_pob_choice: a nation from the midst of another nation
  chosen_korean: 한 민족을 다른 민족의 한가운데서
  alternatives_korean:
  - 한 민족을 다른 민족 가운데서
  - 한 민족을 다른 민족 안에서
  lexicon: HALOT
  rationale: ‘가운데서’는 히브리어의 내부성 이미지를 살리면서도 자연스러운 현대 한국어로 전달합니다.
- source_word: וּבְמִלְחָמָה
  english_pob_choice: and by war
  chosen_korean: 전쟁과
  alternatives_korean:
  - 전쟁으로
  - 전투와
  lexicon: HALOT
  rationale: 나열 구조를 살려 앞의 כלי/수단적 표현들과 병렬되도록 했습니다.
- source_word: וּבְיָד חֲזָקָה וּבִזְרֹעַ נְטוּיָה
  english_pob_choice: by a mighty hand, and by an outstretched arm
  chosen_korean: 강한 손과 편 팔로
  alternatives_korean:
  - 능한 손과 뻗은 팔로
  - 강력한 손과 펴신 팔로
  lexicon: HALOT
  rationale: 출애굽기의 관용적 표현을 한국어 성경체에 맞게 간결하게 옮겼습니다. ‘편 팔’은 ‘outstretched arm’의 고정 대응으로 자주 쓰이는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 학술적 전사인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 유일하신 하나님의 구원 행위를 반어적으로 드러내는 질문 구조
  chosen_reading: 첫 절반을 ‘혹 … 시도한 적이 있느냐?’로 옮겨, 야훼의 출애굽이 어느 신도 감히 하지 못한 일이라는 점을 살렸습니다.
  alternative_readings:
  - ‘어느 신이 … 한 적이 있느냐?’로 더 직역
  - ‘감히 … 한 적이 있느냐?’로 강조
  rationale: 본문의 수사적 논점은 행위의 전례 없음과 야훼의 독보성을 드러내는 데 있으므로, 과도한 평탄화 없이 질문의 긴장을 유지했습니다.
  doctrine_reference: 신명기 4:34의 언약사적 유일성 진술
- issue: 이집트에서의 구원 행위를 가리키는 전통적 출애굽 어구
  chosen_reading: ‘강한 손과 편 팔’은 관용구로 유지하고, ‘야훼’로 신적 주어를 분명히 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘강력한 능력과 권능’으로 의역
  - 전통적 ‘능하신 손’ 계열 표현 사용
  rationale: 출애굽의 상징어를 보존해야 본문의 신학적 기억 기능이 살아납니다.
  doctrine_reference: 출애굽 전승과 신명기의 기억 신학
