  source_fidelity: 핵심 동작의 순서와 비교 표현은 대체로 충실합니다. 다만 לַהֲבִיאֲךָ는 문맥상 이스라엘을 그 땅 안으로 들어가게 하시는 뜻이므로 ‘그곳으로 이끄시며’보다 명시적으로 옮기는 편이 낫습니다. 또한 לְהוֹרִישׁ의 대안적 의미를 위한 영어 감사 추적의 각주 a가 한국어 본문에는 빠져 있습니다.
  naturalness: ‘당신들’은 하나님이 이스라엘 공동체에 직접 말씀하시는 문맥에서 다소 부자연스럽고 거리감이 있습니다. 현대 한국어 성서 문체에서는 ‘너희’가 더 자연스럽습니다. ‘오늘 이와 같습니다’도 문장 종결로는 어색하므로 관용구의 현재적·가시적 뜻을 자연스럽게 풀었습니다.
  terminology: נַחֲלָה는 상속으로 받는 땅이라는 의미를 보존해야 합니다. ‘기업’은 전통 성서 용어이지만 현대어에서는 사업체의 뜻이 강할 수 있으므로, 여기서는 의미가 분명한 ‘유산’으로 옮겼습니다. 이는 특정 교리 해석을 덧붙이지 않으면서 ‘inheritance’를 유지합니다.
