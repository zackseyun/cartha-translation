  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'to dispossess' or 'to cause to inherit by dispossessing.' The Hebrew verb carries the sense of removing prior occupants so that another receives the land.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as this day,' an idiom meaning 'as is evident today' or 'as it stands today.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 당신들보다 더 크고 더 강한 민족들을 당신들 앞에서 몰아내시고, 당신들을 그곳으로 이끄시며, 그들의 땅을 당신들에게 기업으로 주시려 하셨습니다[b], 오늘 이와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 ‘오늘과 같이’라는 관용구로, ‘오늘 드러나 있듯이’ 또는 ‘현재 그러하듯이’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  english_pob_choice: to drive out
  chosen_korean: 몰아내시고
  alternatives_korean:
  - 쫓아내시고
  - 몰수하시고
  - 그들을 빼앗으시고
  lexicon: HALOT
  rationale: 히필형 ירשׁ의 원인적 의미를 살려, 기존 점유자를 제거한다는 뜻이 분명하도록 ‘몰아내시고’로 옮겼습니다.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  english_pob_choice: nations greater and mightier than you
  chosen_korean: 당신들보다 더 크고 더 강한 민족들
  alternatives_korean:
  - 당신들보다 더 크고 더 힘센 나라들
  - 당신보다 더 크고 강한 민족들
  lexicon: HALOT
  rationale: 복수 مخاط주을 반영해 ‘당신들’을 쓰고, 비교 표현은 직역에 가깝게 ‘더 크고 더 강한’으로 유지했습니다.
- source_word: לַהֲבִיאֲךָ
  english_pob_choice: to bring you in
  chosen_korean: 당신들을 그곳으로 이끄시며
  alternatives_korean:
  - 당신들을 들어가게 하시며
  - 당신들을 그 땅으로 데려가시며
  lexicon: HALOT
  rationale: 문맥상 약속의 땅 안으로 들여보내는 의미이므로, 자연스러운 한국어로 ‘이끄시며’를 택했습니다.
- source_word: נַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 기업으로
  alternatives_korean:
  - 유업으로
  - 상속 재산으로
  - 기업으로서
  lexicon: HALOT
  rationale: 신명기의 언약-땅 전승을 살리기 위해 교회적 관용인 ‘기업’으로 옮겼으며, 이는 ‘inheritance’의 성격을 압축적으로 드러냅니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘 이와 같습니다
  alternatives_korean:
  - 오늘과 같습니다
  - 오늘 눈앞에 보이는 것과 같습니다
  - 이날과 같습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 현재적·공적 가시성을 살려, 끝맺는 진술로 한국어에서 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 약속의 땅을 ‘기업’으로 옮길지 여부
  chosen_reading: ‘inheritance’의 신학적 무게를 살려 ‘기업으로’ 번역했습니다.
  alternative_readings:
  - 땅을 재산으로
  - 땅을 소유물로
  rationale: 본문은 단순 소유가 아니라 하나님이 주시는 언약적 상속을 말하므로, ‘기업’이 의미를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
