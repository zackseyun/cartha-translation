  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
  footnotes:
  - marker: a
    text: Or 'the Arnon Wadi' or 'the valley of the Arnon.' The Hebrew נַחַל often refers to a streambed or ravine, not necessarily a perennial river.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Sion'; compare Deuteronomy 3:9, where this mountain is also called Sirion by the Sidonians. Here the text explicitly identifies Sion with Hermon.
    reason: cross_reference
translation:
  language: ko
  text: 아르논 골짜기 언덕가에 있는 아로엘에서부터 사자 안에 있는 헤르몬 산, 곧 시온까지이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַחַל은 물길, 와디, 골짜기까지 가리킬 수 있으므로, 지형 문맥에 따라 다르게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘시온’이라 하고, 신명기 3:9에서는 이 산을 시돈 사람들이 ‘시룐’이라 부른다고 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  english_pob_choice: from Aroer
  chosen_korean: 아로엘에서부터
  alternatives_korean:
  - 아로엘로부터
  - 아로엘에서
  lexicon: HALOT
  rationale: 출발점을 나타내는 전치사 מִן의 의미를 한국어에서는 ‘-에서부터’로 자연스럽게 살렸고, 지명은 음역했습니다.
- source_word: עַל שְׂפַת
  english_pob_choice: on the bank of
  chosen_korean: 언덕가에 있는
  alternatives_korean:
  - 가에 있는
  - 둑에 있는
  - 변에 있는
  lexicon: HALOT
  rationale: שְׂפַת의 핵심은 ‘가장자리/변’이지만, 수로 경계 표현으로 한국어에 너무 직역하면 부자연스러워서 지형 문맥에 맞는 ‘-가에 있는’으로 옮겼습니다.
- source_word: נַחַל אַרְנֹן
  english_pob_choice: the Arnon Valley
  chosen_korean: 아르논 골짜기
  alternatives_korean:
  - 아르논 와디
  - 아르논 시내
  - 아르논 계곡
  lexicon: HALOT
  rationale: נַחַל은 상시적 강보다 와디/골짜기 성격이 강하므로, 독자가 지형적 범위를 이해하도록 ‘골짜기’로 번역했습니다.
- source_word: שִׂיאֹן
  english_pob_choice: Sion
  chosen_korean: 시온
  alternatives_korean:
  - 시욘
  - 시온
  lexicon: HALOT
  rationale: 히브리어 철자 שִׂיאֹן의 지명 음역을 따르되, 한국어에서는 익숙한 표기인 ‘시온’을 사용했습니다.
- source_word: הוּא חֶרְמֹן
  english_pob_choice: that is, Hermon
  chosen_korean: 곧 헤르몬 산
  alternatives_korean:
  - 즉 헤르몬
  - 헤르몬 곧
  lexicon: HALOT
  rationale: הוּא는 동격 설명을 여는 표지이므로 ‘곧’으로 풀어, 시온이 헤르몬과 동일시된다는 의미를 분명히 했습니다.
theological_decisions:
- issue: 지명 동일시의 설명 방식
  chosen_reading: ‘시온, 곧 헤르몬 산’으로 옮겨 본문이 직접 주는 동일시를 보존했습니다.
  alternative_readings:
  - 주석으로만 처리
  - ‘헤르몬 산(시온)’처럼 순서를 바꾸기
  rationale: 본문의 הוּא는 단순한 연결이 아니라 해설적 동일시이므로, 본문 안에서 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: 본문비평/역사서술
