revisions:
- from: 하늘에서는 그분께서 당신들에게 그분의 소리를 들려주셔서 당신들을 훈계하셨고, 땅에서는 그분의 큰 불을 보여 주셨으며, 불 가운데에서 그분의 말씀을 들었습니다.[a][b]
  to: 그분께서는 하늘로부터 당신에게 그분의 음성을 들려주시어 당신을 훈계하시려고 하셨고,[a] 땅에서는 그분의 큰 불을 보여 주셨으며, 당신은 불 한가운데에서 그분의 말씀을 들었습니다.[b]
  rationale: 출처를 나타내는 ‘하늘로부터’와 목적을 나타내는 ‘훈계하시려고’를 사용하여 히브리어의 문법 관계를 보존했습니다. ‘음성’으로 신적 발화의 의미를 명확히 했고, 불의 위치 표현과 관련한 대안은 해당 구절에 각주로 연결했습니다.
