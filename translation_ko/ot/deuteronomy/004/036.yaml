    rationale: 전치사 לְ와 부정사 형태는 ‘당신을 훈계하시려고’라는 목적을 나타냅니다.
  - severity: low
    issue: ‘소리’는 신적 발화 문맥의 קוֹל에 비해 덜 구체적입니다.
    rationale: ‘음성’은 하나님의 들리는 말씀이라는 문맥과 한국어 성경 문체에 더 잘 맞습니다.
