source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
  footnotes:
  - marker: a
    text: Or 'to instruct you' or 'to chasten you'; the Hebrew verb can include both corrective and formative discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'from within the fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘에서는 그분께서 당신들에게 그분의 소리를 들려주셔서 당신들을 훈계하셨고, 땅에서는 그분의 큰 불을 보여 주셨으며, 불 가운데에서 그분의 말씀을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훈계하다’는 여기서 교정과 가르침을 함께 포함하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불 한가운데에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: From heaven
  chosen_korean: 하늘에서는
  alternatives_korean:
  - 하늘로부터는
  - 하늘에서
  lexicon: HALOT
  rationale: 지상과의 대비를 살리면서, 히브리어 מקום/출처의 뉘앙스를 한국어 조사로 자연스럽게 드러냈습니다.
- source_word: הִשְׁמִיעֲךָ
  english_pob_choice: he made you hear
  chosen_korean: 들려주셔서
  alternatives_korean:
  - 듣게 하셔서
  - 들으라고 하셔서
  lexicon: HALOT
  rationale: 사역형의 강한 인과를 살리되, 현대 한국어에서 가장 자연스럽게 들리는 ‘들려주다’로 옮겼습니다.
- source_word: לְיַסְּרֶךָּ
  english_pob_choice: to discipline you
  chosen_korean: 훈계하셨고
  alternatives_korean:
  - 훈련시키셨고
  - 징계하셨고
  - 교훈하셨고
  lexicon: HALOT
  rationale: יַסר의 교정·가르침·훈련이 겹치는 의미를 살리기 위해, 단순 교육보다 더 넓은 ‘훈계’로 옮겨 도덕적 형성의 뉘앙스를 유지했습니다.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  english_pob_choice: his great fire
  chosen_korean: 그분의 큰 불
  alternatives_korean:
  - 그분의 큰 화염
  - 그분의 엄청난 불
  lexicon: HALOT
  rationale: אֵשׁ의 기본어휘를 살려 ‘불’로 직역했고, ‘큰’으로 형용사의 직접성을 유지했습니다.
- source_word: וּדְבָרָיו
  english_pob_choice: his words
  chosen_korean: 그분의 말씀
  alternatives_korean:
  - 그분의 말들
  - 그분의 말씀들
  lexicon: HALOT
  rationale: 히브리어 복수형의 구체성을 영어 POB처럼 한국어에서는 신적 발화의 격을 살려 ‘말씀’으로 자연스럽게 옮겼습니다.
- source_word: מִתּוֹךְ הָאֵשׁ
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데에서
  alternatives_korean:
  - 불 한가운데에서
  - 불 속에서
  lexicon: HALOT
  rationale: 문자적 ‘가운데/한가운데’의 의미를 보존하되, 한국어 문맥상 가장 읽기 쉬운 표현으로 정리했습니다.
theological_decisions:
- issue: לְיַסְּרֶךָּ의 징계/교훈 범위
  chosen_reading: ‘훈계하셨고’로 옮겨, 징벌보다 교정·가르침이 함께 있는 의미를 살렸습니다.
  alternative_readings:
  - 징계하셨고
  - 가르치셨고
  - 교정하셨고
  rationale: 신명기 문맥에서 하나님의 계시는 단순한 정보 전달이 아니라 언약적 형성의 목적을 가지므로, 한쪽으로 좁히지 않는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 여호와의 직접적 현현을 나타내는 구체적 표현 유지
  chosen_reading: ‘소리’, ‘큰 불’, ‘말씀’을 추상화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 음성
  - 불꽃
  - 선언
  rationale: 본문은 하나님의 자기계시를 감각적으로 묘사하므로, 의미를 완화하지 않는 것이 저자의 의도와 신학을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
