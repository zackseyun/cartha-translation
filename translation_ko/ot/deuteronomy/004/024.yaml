translation:
  language: ko
  text: 이는 당신의 하나님이신 야훼께서 삼키는 불이시며, 질투하시는[a] 하나님이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질투하시는’은 ‘열심 있는’으로도 옮길 수 있습니다. 히브리어는 특히 우상숭배의 맥락에서 자기 백성에 대한 야훼의 배타적인 언약 요구를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 그러므로 …
  lexicon: HALOT
  rationale: 앞절의 경고를 받는 이유를 자연스러운 설명문으로 이어 주는 연결어이므로, 인과를 분명히 하는 「이는 … 때문입니다」로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와의 전통적 대체어가 아니라 신명기의 신명(神名)을 그대로 드러내는 프로젝트 기본값을 따랐습니다.
- source_word: אֵשׁ אֹכְלָה
  english_pob_choice: a consuming fire
  chosen_korean: 소멸하는 불
  alternatives_korean:
  - 삼키는 불
  - 먹어 치우는 불
  lexicon: HALOT
  rationale: ‘불’이 단순한 존재가 아니라 심판과 거룩함의 힘으로서 대상을 소멸시키는 이미지를 살리기 위해 「소멸하는 불」로 옮겼습니다.
- source_word: קַנָּא
  english_pob_choice: a jealous God
  chosen_korean: 질투하시는 하나님
  alternatives_korean:
  - 열심 있는 하나님
  - 질투하시는 분
  lexicon: HALOT
  rationale: 언약적 배타성과 우상숭배에 대한 배타적 반응을 약화하지 않기 위해 「열심」보다 「질투」를 택했고, 하나님을 주어 호응에 맞게 인격적으로 표현했습니다.
theological_decisions:
- issue: קַנָּא의 번역에서 언약적 배타성 유지
  chosen_reading: 질투하시는 하나님
  alternative_readings:
  - 열심 있는 하나님
  rationale: 본문은 하나님의 열정적 활동보다 우상숭배를 용납하지 않는 언약적 소유권을 강조하므로, 그 긴장을 그대로 드러내는 표현을 유지했습니다.
  doctrine_reference: Theological tension preserved; covenant exclusivity in idolatry context.
