  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
  footnotes:
  - marker: a
    text: Or 'a zealous God.' The Hebrew emphasizes the LORD's exclusive covenant claim over his people, especially in the context of idolatry.
