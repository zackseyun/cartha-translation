source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
  footnotes:
  - marker: a
    text: Or 'a merciful God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not forsake you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the covenant of your ancestors.' The Hebrew says 'your fathers,' referring to Israel's covenant forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님은 자비로운 하나님이십니다[a][b][c]. 그분은 당신을 버리거나 멸망시키거나, 당신의 조상들과 맺으시고 그들에게 맹세하신 언약을 잊지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자비로운 하나님’ 대신 ‘긍휼이 많은 하나님’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘버리다’는 ‘떠나다/내버려두다’의 의미로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 조상들’은 ‘당신의 조상들의 언약’이라는 뜻으로, 언약의 역사적 계승을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֵל רַחוּם
  english_pob_choice: a compassionate God
  chosen_korean: 자비로운 하나님
  alternatives_korean:
  - 긍휼이 많은 하나님
  - 은혜로운 하나님
  lexicon: HALOT
  rationale: רַחוּם은 자비/긍휼의 성품을 가리키므로, 현대 한국어에서 자연스럽고 신학적으로도 무리 없는 ‘자비로운’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약 이름을 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: לֹא יַרְפְּךָ
  english_pob_choice: he will not abandon you
  chosen_korean: 당신을 버리거나
  alternatives_korean:
  - 당신을 떠나거나
  - 당신을 포기하거나
  lexicon: HALOT
  rationale: רפה의 문맥상 의미를 관계 단절의 뉘앙스가 살아 있는 ‘버리다’로 살렸고, English POB의 ‘abandon’과도 맞췄습니다.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית אֲבֹתֶיךָ
  english_pob_choice: or forget the covenant of your fathers
  chosen_korean: 당신의 조상들과 맺으시고 그들에게 맹세하신 언약을 잊지 않으실 것입니다
  alternatives_korean:
  - 당신의 조상들의 언약을 잊지 않으실 것입니다
  - 조상들과의 언약을 잊지 않으실 것입니다
  lexicon: HALOT
  rationale: ‘언약’을 목적어로 분명히 유지하고, 뒤의 ‘그들에게 맹세하신’로 히브리어의 대상을 드러내어 문맥의 역사적·언약적 관계를 살렸습니다.
theological_decisions:
- issue: 언약 이름 야훼의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직역성 있게 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 고유한 신적 이름을 титular 표현으로 환원하지 않고, POB 방침대로 언약적 인격성을 보존하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֲבֹתֶיךָ의 지시 대상
  chosen_reading: ‘당신의 조상들’로 번역해 남성 복수의 역사적 언약 조상을 드러냅니다.
  alternative_readings:
  - 당신의 조상들
  - 당신의 선조들
  rationale: 히브리어의 남성 복수와 족장적 맥락을 유지하면서도, 한국어에서 자연스럽게 읽히도록 정리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
