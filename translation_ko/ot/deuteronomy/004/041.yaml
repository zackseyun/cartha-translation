    text: Or 'across the Jordan' or 'on the other side of the Jordan.' The Hebrew expression is a geographic idiom whose exact English phrasing depends on narrative perspective.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'toward the rising of the sun,' that is, 'eastward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세는 요단강 저편, 해 뜨는 쪽에 세 도시를 따로 떼어 놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요단강 저편’은 히브리어 관용구로, 문맥과 서술 관점에 따라 ‘요단을 건너편’, ‘요단강 건너편’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘해의 떠오름 쪽으로’이며, 뜻은 ‘동쪽으로’입니다.
    reason: lexical_alternative
