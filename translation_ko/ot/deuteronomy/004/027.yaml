- from: 야훼께서 여러분을 여러 민족 가운데로 흩으실 것이며, 여러분은 야훼께서 여러분을 그리로 이끄실 나라들 가운데서 수가 적은 몇 사람만 남게 될 것입니다.[a]
  to: 야훼께서 여러분을 여러 민족 가운데 흩으실 것이며, 야훼께서 여러분을 몰아가실 나라들 가운데서 여러분은 소수만 남게 될 것입니다.[a]
  rationale: The revision retains the verse’s judgment-and-exile force, improves Korean idiom, and makes the lexical alternative for נהג transparent. It also preserves the explicit divine name and the distinction between ‘peoples’ and ‘nations.’
