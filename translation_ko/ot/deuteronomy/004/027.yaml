  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
  footnotes:
  - marker: a
    text: Or 'the LORD will lead you there.' The Hebrew verb can mean 'lead' or 'drive'; here 'drive' was chosen because the context is judgment and exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분을 여러 민족 가운데 흩으실 것이며, 야훼께서 여러분을 몰아가실 나라들 가운데서 여러분은 소수만 남게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 여러분을 인도하실 나라들’. 히브리어 동사는 ‘인도하다’ 또는 ‘몰아가다’로 옮길 수 있습니다. 여기서는 심판과 포로의 문맥에 따라 ‘몰아가실’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִ֧יץ
  english_pob_choice: will scatter
  chosen_korean: 흩으실 것이며
  alternatives_korean:
  - 흩어지게 하실 것이며
  - 분산시키실 것이며
  lexicon: HALOT
  rationale: 히필형 פוץ의 사역적 분산 의미를 살리되, 현대 한국어에서 심판·포로 맥락에 자연스러운 ‘흩으실’로 옮겼습니다.
- source_word: בָּעַמִּ֑ים
  english_pob_choice: among the peoples
  chosen_korean: 여러 민족 가운데로
  alternatives_korean:
  - 백성들 가운데로
  - 사람들 가운데로
  lexicon: HALOT
  rationale: 뒤의 גּוֹיִם와 구별되도록 עַמִּים은 민족/백성 집단의 의미를 살려 ‘여러 민족’으로 옮겼습니다.
- source_word: מְתֵ֣י מִסְפָּ֔ר
  english_pob_choice: few in number
  chosen_korean: 수가 적은 몇 사람만
  alternatives_korean:
  - 적은 수만
  - 얼마 안 되는 사람들만
  lexicon: HALOT
  rationale: 관용구의 핵심 의미는 ‘매우 적은 수’이므로, 자연스러운 현대 한국어로 수량의 극소함을 분명히 했습니다.
- source_word: אֲשֶׁ֨ר יְנַהֵ֧ג
  english_pob_choice: where ... will drive
  chosen_korean: 그리로 이끄실
  alternatives_korean:
  - 그리로 몰아내실
  - 그리로 인도하실
  lexicon: HALOT
  rationale: 원어는 ‘이끌다/몰다’ 둘 다 가능하지만, 본문은 심판과 포로의 문맥이므로 영어 POB의 판단과 달리 한국어에서는 둘의 긴장을 살려 비교적 중립적인 ‘이끄실’로 두었습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’ 또는 ‘여호와’
  - 음역 없이 서술
  rationale: 본문의 יְהוָה는 하나님의 언약적 고유명을 직접 가리키므로, 전통적 대체표현보다 이름 자체를 드러내는 번역이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
