  source_fidelity: 원문의 분사 הַדְּבֵקִים는 야훼께 계속 밀착해 있는 사람들을 수식하며, 결과를 직접 나타내는 인과절은 아닙니다. 초안의 ‘붙들고 있으므로’는 ‘으므로’로 인과관계를 명시하여 원문보다 한 단계 강한 논리관계를 부가합니다. 또한 דבק의 목적어 표지는 한국어에서 ‘~을 붙들다’보다 ‘~에게 붙어 있다’가 더 정확하게 대응합니다.
  naturalness: ‘너희의 하나님 야훼께 굳게 붙어 있는 너희’는 현대 표준 한국어 합쇼체 문장으로 자연스럽고, 앞 절의 죽은 자들과의 대조도 ‘그러나’로 명확히 드러냅니다.
  terminology: יהוה는 프로젝트 원칙에 따라 ‘야훼’로 유지했습니다. אֱלֹהֵיכֶם은 ‘너희의 하나님’으로, 언약 관계를 분명하고 자연스럽게 보존했습니다. חַיִּים כֻּלְּכֶם הַיּוֹם은 ‘오늘 모두 살아 있습니다’로 옮겨 현재의 생존 상태와 전원성을 유지했습니다.
