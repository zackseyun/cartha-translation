lexical_decisions:
- source_word: וְ/אַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러나 너희는
  alternatives_korean:
  - 그리고 너희는
  - 하지만 너희는
  - 그런데 너희는
  lexicon: HALOT
  rationale: 문맥상 바알브올에서 죽은 자들과 대조를 이루는 접속이므로, 한국어에서는 역접을 분명히 드러내는 ‘그러나’를 택했습니다.
- source_word: הַ/דְּבֵקִים
  english_pob_choice: who held fast
  chosen_korean: 붙들고 있으므로
  alternatives_korean:
  - 붙어 있는
  - 매달리고 있으므로
  - 굳게 매어 있으므로
  lexicon: HALOT
  rationale: דבק는 단순 접촉보다 언약적 밀착과 충성을 나타내므로, 현대 한국어에서 관계적·의지적 결속을 살리는 ‘붙들고 있다’로 옮겼습니다.
- source_word: בַּ/יהוָה אֱלֹהֵי/כֶם
  english_pob_choice: to Yahweh your God
  chosen_korean: 너희 하나님 야훼를
  alternatives_korean:
  - 너희 하나님 여호와를
  - 너희의 하나님이신 야훼를
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 소유격 관계는 한국어 목적어 자리에서 자연스럽게 정리했습니다.
- source_word: חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם
  english_pob_choice: are all alive today
  chosen_korean: 오늘 너희 모두가 살아 있습니다
  alternatives_korean:
  - 오늘 너희는 모두 살아 있습니다
  - 오늘 너희 전부가 살아 있습니다
  lexicon: HALOT
  rationale: חַיִּים은 상태를 나타내는 형용사이므로 ‘살아 있습니다’로 직역했고, כֻּלְּכֶם의 포괄성은 ‘너희 모두’로 드러냈습니다.
theological_decisions:
