    rationale: 히브리어 וַיֶּחִי는 문자적으로 ‘그리고 살았다’입니다. ‘살아남다’는 문맥적 함의를 명시하여 원문의 절제된 표현보다 한 단계 해석적입니다. 영어 감사 기록도 이를 본문이 아닌 대안으로 둡니다.
