translation:
  language: ko
  text: 어느 민족이 하나님께서 불 가운데서 말씀하시는 음성을 네가 들은 것처럼 듣고 살았습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아남았습니까?’ 히브리어 동사는 단순히 ‘살다’이지만, 문맥은 불 가운데서 말씀하시는 하나님의 음성을 듣고도 그들이 살아 있었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  english_pob_choice: Has any people heard
  chosen_korean: 어느 민족이 ... 듣고
  alternatives_korean:
  - 어떤 백성이 ... 들었습니까
  - 어느 백성이 ... 들었습니까
  lexicon: HALOT
  rationale: הֲ가 이끄는 수사적 질문이므로 한국어도 질문형을 유지했고, עָם은 이 문맥에서 집단을 가리키는 ‘민족’으로 옮겨 비교 대상의 집합성을 살렸습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 신께서
  - 하나님
  lexicon: HALOT
  rationale: 주어는 이스라엘이 시내/호렙에서 만난 유일하신 하나님이므로 복수형 형태에도 불구하고 단수 의미를 반영해 ‘하나님께서’로 옮겼습니다.
- source_word: מְדַבֵּר
  english_pob_choice: speaking
  chosen_korean: 말씀하시는
  alternatives_korean:
  - 말하고 계시는
  - 말하는
  lexicon: HALOT
  rationale: ‘하나님의 음성’과 결합한 현재 분사적 용법을 한국어의 관용적 종속 표현 ‘말씀하시는’으로 옮겨, 음성이 실제로 발화 중임을 드러냈습니다.
- source_word: וַ/יֶּחִי
  english_pob_choice: and lived
  chosen_korean: 살아남은
  alternatives_korean:
  - 살았습니까
  - 생존한
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘살다’이지만, 이 문맥은 불 가운데서 말씀을 듣고도 죽지 않았다는 결과를 강조하므로 ‘살아남은’이 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 불 가운데서 하나님의 음성을 듣고도 죽지 않았다는 함의
  chosen_reading: 살아남은 적이 있습니까
  alternative_readings:
  - 살았습니까
  - 생존한 적이 있습니까
  - 그리고도 살아 있습니까
  rationale: 히브리어 자체는 ‘살다’이지만, 문맥상 이 경험이 인간에게 치명적일 수 있음에도 이스라엘이 보존되었다는 점이 핵심이므로 이를 과하지 않게 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
