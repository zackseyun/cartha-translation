  - severity: medium
    issue: 각주 a가 수동형 설명과 어긋남
    rationale: ‘보여 주신’은 한국어 문법상 능동 사역 구문입니다. 히브리어 동사가 수동형이라는 점은 ‘보이게 되었다/보여졌다’라는 직역적 설명으로 밝혀야 합니다.
  - severity: medium
    issue: ‘다른 이가 없다’의 지시 범위
    rationale: 원문의 배타성은 야훼 외 다른 신이 없다는 선언입니다. ‘다른 이’는 인간을 포함한 모든 존재가 없다는 뜻으로 오해될 수 있습니다.
