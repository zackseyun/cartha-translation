id: DEU.4.35
reference: Deuteronomy 4:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
  footnotes:
  - marker: a
    text: 'Or, ''You have been shown,'' emphasizing the passive sense: Israel was caused to see these things.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD, he is God'; the pronoun adds emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 이 모든 일을 보여 주신 것은, 여러분이 야훼가 하나님이시며 그 밖에는 다른 이가 없다는 것을 알게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사의 수동 뉘앙스를 살리면 ‘보여 주신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼, 그분이 하나님’이라는 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  english_pob_choice: were shown
  chosen_korean: 보여 주신 것은
  alternatives_korean:
  - 보이신 것은
  - 보여 주셨습니다
  lexicon: HALOT
  rationale: Hophal형은 ‘스스로 본 것’이 아니라 ‘보여짐/보이심’을 뜻하므로, 수동·사역수동의 의미를 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לָדַעַת
  english_pob_choice: so that you might know
  chosen_korean: 알게 하려는 것이었습니다
  alternatives_korean:
  - 알도록 하려는 것이었습니다
  - 알게 하기 위해서였습니다
  lexicon: HALOT
  rationale: 부정사 ל는 목적을 나타내므로, 결과보다 목적을 드러내는 ‘알게 하려는’으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약명의 음역을 따라 POB 기본어인 ‘야훼’를 사용해, 본문이 지칭하는 고유 이름을 제목어로 바꾸지 않았습니다.
- source_word: הוּא הָאֱלֹהִים
  english_pob_choice: he is God
  chosen_korean: 하나님이시며
  alternatives_korean:
  - 그분이 하나님이시며
  - 그가 하나님이시며
  lexicon: HALOT
  rationale: 히브리어의 독립 대명사와 서술어 결합이 주는 강조를 한국어의 존대 서술 ‘-이시며’로 살려, ‘야훼가 하나님’이라는 동일시를 자연스럽게 표현했습니다.
- source_word: אֵין עוֹד מִלְבַדּוֹ
  english_pob_choice: there is no other besides him
  chosen_korean: 그 밖에는 다른 이가 없다는
  alternatives_korean:
  - 그 외에는 다른 이가 없다는
  - 그분 외에는 아무도 없다는
  lexicon: HALOT
  rationale: 배타적 부정을 현대 한국어로 간결하게 옮기되, ‘other’와 ‘besides him’의 이중 배제를 모두 드러내도록 했습니다.
theological_decisions:
- issue: ‘the LORD, he is God’의 강조 유지
  chosen_reading: ‘야훼가 하나님이시며’로 옮겨 독립 대명사가 주는 강조를 살렸습니다.
  alternative_readings:
  - ‘야훼는 하나님이십니다’
  - ‘야훼, 그분이 하나님이십니다’
  rationale: 본문은 단순 동일시가 아니라 ‘야훼, 바로 그분이 하나님’이라는 강조를 담으므로, 한국어에서도 서술 강조를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 배타적 유일신 진술의 강도
  chosen_reading: ‘그 밖에는 다른 이가 없다’로 옮겨, 신학적 확장 없이 본문의 배타성을 보존했습니다.
  alternative_readings:
  - ‘다른 존재는 없다’
  - ‘아무도 없다’
  rationale: 본문의 의도는 야훼의 유일성과 타신 부재를 선언하는 것이므로, 철학적 설명을 덧붙이지 않고 그대로 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
