- from: 이제 이스라엘아, 내가 너희에게 행하도록 가르치는 규례들과 법도들을 들으십시오. 그리하면 너희가 살고 들어가 그 땅을 차지하게 될 것입니다. 그것은 야훼, 곧 너희 조상들의 하나님께서 너희에게 주시는 땅입니다.[a][b][c]
  to: 이제 이스라엘아, 내가 너희에게 행하도록 가르치는 규례들과 법도들을 들으십시오.[a] 그리하여 너희는 살고 들어가, 너희 조상들의 하나님 야훼[c]께서 너희에게 주시는 그 땅을 차지할 것입니다.[b]
  rationale: 원문의 목적·귀결 흐름과 ‘땅’에 대한 관계절을 유지하도록 문장을 재구성했습니다. ‘야훼’, ‘너희 조상들의 하나님’, ‘규례들과 법도들’ 및 ‘차지하다’는 유지하되, 각주를 실제 대상 어휘에 붙이고 영어 감사 기록의 각주 성격에 맞게 정비했습니다.
