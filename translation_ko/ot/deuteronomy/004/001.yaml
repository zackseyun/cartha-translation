  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
  footnotes:
  - marker: a
    text: Or 'the decrees and the ordinances.'
    reason: lexical_alternative
  - marker: b
    text: Or 'possess' or 'inherit' the land.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이제 이스라엘아, 내가 너희에게 행하도록 가르치는 규례들과 법도들을 들으십시오. 그리하면 너희가 살고 들어가 그 땅을 차지하게 될 것입니다. 그것은 야훼, 곧 너희 조상들의 하나님께서 너희에게 주시는 땅입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례들’과 ‘법도들’은 히브리어 חֻקִּים와 מִשְׁפָּטִים의 구별을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘차지하다’는 여기서 ‘소유하다/상속받다’의 의미를 함께 담을 수 있는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어에는 하나님의 이름 YHWH가 직접 나옵니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 새 문단의 전환을 자연스럽게 살리면서도 불필요한 접속을 줄였습니다.
- source_word: שְׁמַע אֶל
  english_pob_choice: listen to
  chosen_korean: 들으십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 들어 순종하십시오
  lexicon: HALOT
  rationale: אֶל과 결합한 שׁמע는 우선적인 의미가 ‘주의 깊게 듣다’이므로, ‘순종하다’로 과도하게 풀지 않고 기본 청취 의미를 살렸습니다.
- source_word: הַחֻקִּים וְאֶל הַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 규례들과 법도들
  alternatives_korean:
  - 율례들과 규정들
  - 규례들과 판단들
  lexicon: HALOT
  rationale: 두 용어를 구별해 옮기되, 한국어 성경에서 비교적 자연스럽고 법적 뉘앙스를 유지하는 ‘규례들/법도들’을 택했습니다.
- source_word: לַעֲשׂוֹת
  english_pob_choice: to do
  chosen_korean: 행하도록
  alternatives_korean:
  - 행하게
  - 실행하도록
  - 지키도록
  lexicon: HALOT
  rationale: 히브리어의 실제 수행 요구를 살리면서 한국어에서는 목적절 흐름상 ‘행하도록’이 가장 자연스럽습니다.
- source_word: וִירִשְׁתֶּם אֶת הָאָרֶץ
  english_pob_choice: take possession of the land
  chosen_korean: 그 땅을 차지하게 될 것입니다
  alternatives_korean:
  - 그 땅을 차지할 것입니다
  - 그 땅을 얻게 될 것입니다
  - 그 땅을 상속받게 될 것입니다
  lexicon: HALOT
  rationale: ירשׁ는 약속의 땅 문맥에서 ‘상속’의 신학적 함의를 가지지만, 여기서는 구체적 점유 행동을 드러내는 ‘차지하다’가 더 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 학술적 전사인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 출애굽-언약 문맥의 신명 표기
  chosen_reading: ‘야훼’와 ‘너희 조상들의 하나님’을 병기하여 언약적 고유성과 관계성을 함께 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 순화
  - ‘여호와 하나님’으로 전통화
  rationale: 본문이 직접 יְהוָה를 사용하므로, 전통적 교회 용어로 완화하지 않고 고유한 언약명을 보존하는 것이 소스 충실도에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
