  - 여러분이 한 말 때문에
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘너희의 말들/말 때문에’라고 하므로, 인칭만으로 뭉개지지 않게 ‘말’의 요소를 살렸습니다.
- source_word: וַיִּשָּׁבַע
  english_pob_choice: he swore
  chosen_korean: 맹세하셨습니다
  alternatives_korean:
  - 맹세하셨습니다
  - 맹세하셨고
  lexicon: HALOT
  rationale: אָרַב/שׁבע 계열의 서원 표현을 한국어 성경 문맥에 맞는 ‘맹세하다’로 옮겨 서원 행위의 엄중함을 드러냈습니다.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  english_pob_choice: that I would not cross the Jordan
  chosen_korean: 내가 요단을 건너지 못하며
  alternatives_korean:
  - 내가 요단을 건너지 않으며
  - 내가 요단을 건너지 못하게 하시며
  lexicon: HALOT
  rationale: 서원의 결과를 자연스러운 한국어로 옮기면서, ‘건너지 못하다’로 금지·불허의 뜻을 분명히 했습니다.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ הַטּוֹבָה
  english_pob_choice: and that I would not enter the good land
  chosen_korean: 그 좋은 땅에 들어가지 못하며
  alternatives_korean:
  - 그 좋은 땅에 들어가지 못하고
  - 그 좋은 땅으로 들어가지 못하며
  lexicon: HALOT
  rationale: ‘좋은 땅’은 토지의 질보다 언약적 평가를 나타내므로 직역을 유지했고, parallel 구조에 맞춰 ‘들어가지 못하다’로 정리했습니다.
theological_decisions:
- issue: ‘because of your words’의 인과 관계를 어떻게 보존할 것인가
  chosen_reading: ‘여러분의 말 때문에’로 옮겨, 본문이 실제로 ‘당신들’이 아니라 ‘당신들의 말’을 언급한다는 점을 유지했습니다.
  alternative_readings:
  - ‘여러분 때문에’
  - ‘여러분의 말들 때문에’
  rationale: 히브리어 עַל דִּבְרֵיכֶם의 어휘적 초점을 보존하는 것이 본문의 뉘앙스와 책임 귀속의 표현을 더 정확히 드러냅니다.
  doctrine_reference: 원문 우선 원칙; 문맥의 긴장을 해소하지 않고 보존
