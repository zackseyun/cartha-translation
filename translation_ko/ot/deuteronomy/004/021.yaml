  lexicon: HALOT
  rationale: 동사의 강한 분노·격노를 반영하되, 현대 한국어 문맥에서 자연스럽고 격조 있게 읽히도록 ‘진노하셨다’를 택했습니다.
- source_word: עַל דִּבְרֵיכֶם
  english_pob_choice: because of your words
  chosen_korean: 여러분의 말 때문에
  alternatives_korean:
