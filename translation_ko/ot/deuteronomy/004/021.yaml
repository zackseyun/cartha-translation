  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
  footnotes:
  - marker: a
    text: Or, 'because of what you said.' The Hebrew reads literally, 'because of your words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 여러분의 말 때문에[a] 나에게 진노하셨고, 내가 요단을 건너지 못하고 여러분의 하나님이신 야훼께서 여러분에게 기업으로 주시는 그 좋은 땅에 들어가지 못할 것이라고 맹세하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 한 말 때문에’. 히브리어는 문자적으로 ‘여러분의 말 때문에’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
