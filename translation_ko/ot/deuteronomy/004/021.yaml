source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
  footnotes:
  - marker: a
    text: Or, 'because of what you said.' The Hebrew reads literally, 'because of your words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분의 말 때문에 나에게 진노하셨고, 내가 요단을 건너지 못하며, 야훼 여러분의 하나님께서 여러분에게 기업으로 주시는 그 좋은 땅에 들어가지 못하리라고 맹세하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 한 말 때문에’. 히브리어는 문자적으로 ‘여러분의 말 때문에’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה / יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC; 프로젝트 기본 용례
  rationale: 히브리어 고유명 יהוה를 프로젝트 기본값에 따라 음역해, 전통적 교회식 대체어보다 원문 식별성을 유지했습니다.
- source_word: הִתְאַנֶּף בִּי
  english_pob_choice: was angry with me
  chosen_korean: 나에게 진노하셨고
  alternatives_korean:
  - 나에게 화를 내셨고
  - 나를 향해 노하셨고
  lexicon: HALOT
  rationale: 동사의 강한 분노·격노를 반영하되, 현대 한국어 문맥에서 자연스럽고 격조 있게 읽히도록 ‘진노하셨다’를 택했습니다.
- source_word: עַל דִּבְרֵיכֶם
  english_pob_choice: because of your words
  chosen_korean: 여러분의 말 때문에
  alternatives_korean:
  - 여러분의 말로 인해
  - 여러분이 한 말 때문에
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘너희의 말들/말 때문에’라고 하므로, 인칭만으로 뭉개지지 않게 ‘말’의 요소를 살렸습니다.
- source_word: וַיִּשָּׁבַע
  english_pob_choice: he swore
  chosen_korean: 맹세하셨습니다
  alternatives_korean:
  - 맹세하셨습니다
  - 맹세하셨고
  lexicon: HALOT
  rationale: אָרַב/שׁבע 계열의 서원 표현을 한국어 성경 문맥에 맞는 ‘맹세하다’로 옮겨 서원 행위의 엄중함을 드러냈습니다.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  english_pob_choice: that I would not cross the Jordan
  chosen_korean: 내가 요단을 건너지 못하며
  alternatives_korean:
  - 내가 요단을 건너지 않으며
  - 내가 요단을 건너지 못하게 하시며
  lexicon: HALOT
  rationale: 서원의 결과를 자연스러운 한국어로 옮기면서, ‘건너지 못하다’로 금지·불허의 뜻을 분명히 했습니다.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ הַטּוֹבָה
  english_pob_choice: and that I would not enter the good land
  chosen_korean: 그 좋은 땅에 들어가지 못하며
  alternatives_korean:
  - 그 좋은 땅에 들어가지 못하고
  - 그 좋은 땅으로 들어가지 못하며
  lexicon: HALOT
  rationale: ‘좋은 땅’은 토지의 질보다 언약적 평가를 나타내므로 직역을 유지했고, parallel 구조에 맞춰 ‘들어가지 못하다’로 정리했습니다.
theological_decisions:
- issue: ‘because of your words’의 인과 관계를 어떻게 보존할 것인가
  chosen_reading: ‘여러분의 말 때문에’로 옮겨, 본문이 실제로 ‘당신들’이 아니라 ‘당신들의 말’을 언급한다는 점을 유지했습니다.
  alternative_readings:
  - ‘여러분 때문에’
  - ‘여러분의 말들 때문에’
  rationale: 히브리어 עַל דִּבְרֵיכֶם의 어휘적 초점을 보존하는 것이 본문의 뉘앙스와 책임 귀속의 표현을 더 정확히 드러냅니다.
  doctrine_reference: 원문 우선 원칙; 문맥의 긴장을 해소하지 않고 보존
