source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
  footnotes:
  - marker: a
    text: 'Hebrew: ''gods.'' The verse rhetorically compares other nations'' deities with the LORD, Israel''s God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whenever we call to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면, 우리 하나님 야훼께서 우리가 그분을 부를 때마다 우리에게 가까이 계신 것처럼, 자기에게 가까이 있는 신들을 가진 큰 민족이 어디 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘신들’이라고 되어 있습니다. 이 절은 다른 민족들의 신들과 이스라엘의 하나님 야훼를 수사적으로 비교합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 그분께 부르짖을 때마다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גּוֹי גָּדוֹל
  english_pob_choice: what great nation is there
  chosen_korean: 어떤 큰 민족이 … 있겠습니까
  alternatives_korean:
  - 어느 큰 나라가 … 있습니까
  - 무슨 큰 민족이 … 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 수사 의문문의 힘을 살리면서, 자연스러운 현대 한국어로 ‘어떤 큰 민족’이라고 옮겼습니다.
- source_word: אֱלֹהִים קְרֹבִים אֵלָיו
  english_pob_choice: gods so near to it
  chosen_korean: 자기에게 이렇게 가까이 있는 신들
  alternatives_korean:
  - 자기에게 가까이 있는 신들
  - 그에게 이렇게 가까운 신들
  lexicon: HALOT
  rationale: 여기서는 열방의 신들을 가리키는 복수 의미가 분명하므로 ‘신들’로 옮기고, קְרֹבִים의 강조를 ‘이렇게 가까이’로 살렸습니다.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  english_pob_choice: as Yahweh our God
  chosen_korean: 우리 하나님 야훼께서
  alternatives_korean:
  - 우리 하나님 여호와께서
  - 우리 하나님께서
  lexicon: HALOT
  rationale: 문맥상 비교 대상이 되는 야훼의 고유 이름을 보존하기 위해 ‘야훼’를 사용했습니다. ‘우리 하나님’은 소유격 관계를 자연스럽게 드러냅니다.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  english_pob_choice: whenever we call on him
  chosen_korean: 우리가 그분을 부를 때마다
  alternatives_korean:
  - 우리가 그분께 부를 때마다
  - 우리가 그분을 부를 때마다 언제나
  lexicon: HALOT
  rationale: בְּכָל + 부정사구의 반복적 상황을 ‘~할 때마다’로 풀었고, קָרָא의 예배/기도적 의미를 살려 ‘부르다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 히브리어 사성자 יהוה를 고유명으로 드러내기 위해 ‘야훼’를 사용했습니다. 이는 본문이 강조하는 언약의 하나님 이름을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘신들’의 해석
  chosen_reading: 열방의 신들을 가리키는 복수 의미
  alternative_readings:
  - 하나님
  - 신적 존재들
  rationale: 형태상 복수이고, 바로 뒤에서 ‘우리 하나님 야훼’와 비교되므로 이 절의 대조는 다른 민족들의 신들과 이스라엘의 하나님 사이의 비교입니다.
  doctrine_reference: Source syntax and English audit note on אֱלֹהִים
