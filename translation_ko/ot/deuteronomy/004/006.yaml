    rationale: ‘너희’는 성서 문체에서는 가능하나 ‘행하십시오’와 함께 쓰일 때 현대 공적 존대 문체가 다소 흔들릴 수 있습니다. 또한 규례에 관한 각주는 해당 단어에 붙이는 것이 참조 대상을 분명히 합니다.
