reference: Deuteronomy 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
  footnotes:
  - marker: a
    text: 'Or, ''Only this great nation is a wise and understanding people.'' The Hebrew רַק can more literally mean ''only,'' but here it likely functions as an emphatic exclamation: ''Surely.'''
    reason: lexical_alternative
  - marker: b
    text: '''Statutes'' translates חֻקִּים, a legal term that can also be rendered ''decrees'' or ''ordinances.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그것들을 지키고 행하십시오. 이것이 바로 여러 민족들 앞에서 너희의 지혜이며 너희의 분별입니다. 그들이 이 모든 규례를 들으면 말할 것입니다. 「이 큰 민족은 참으로 지혜롭고 분별 있는 백성이다」라고.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례’는 히브리어 חֻקִּים의 표준적 법-언약 용어로, ‘법도’나 ‘율례’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם / וַעֲשִׂיתֶם
  english_pob_choice: keep and do
  chosen_korean: 지키고 행하십시오
  alternatives_korean:
  - 지키고 실천하십시오
  - 지키고 따르십시오
  lexicon: HALOT
  rationale: שׁמר와 עשה의 병렬을 한국어에서도 간결하게 살려, 언약적 준수와 실제 이행을 함께 드러내는 표현으로 옮겼습니다.
- source_word: חָכְמַתְכֶם / בִינַתְכֶם
  english_pob_choice: your wisdom / your understanding
  chosen_korean: 너희의 지혜이며 너희의 분별입니다
  alternatives_korean:
  - 너희의 지혜이며 너희의 이해입니다
  - 너희의 지혜이며 너희의 통찰입니다
  lexicon: HALOT
  rationale: חכמה와 בינה의 짝을 각각 지혜/분별로 옮겨, 지성적 능력과 식별력을 함께 드러내면서도 자연스러운 현대 한국어를 유지했습니다.
- source_word: לְעֵינֵי הָעַמִּים
  english_pob_choice: in the sight of the peoples
  chosen_korean: 여러 민족들 앞에서
  alternatives_korean:
  - 민족들의 눈앞에서
  - 백성들 앞에서
  lexicon: HALOT
  rationale: 직역적 ‘눈앞에서’도 가능하지만, 공개적으로 드러나는 시야의 뉘앙스를 살리면서 한국어 문장 흐름에 맞게 정리했습니다.
- source_word: חֻקִּים
  english_pob_choice: statutes
  chosen_korean: 규례
  alternatives_korean:
  - 율례
  - 법도
  lexicon: HALOT
  rationale: PBO의 ‘statutes’를 한국어 법률-언약 문맥에서 자연스럽게 받는 표준적 대응어로 옮겼습니다.
- source_word: רַק
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 오직
  - 분명히
  lexicon: HALOT
  rationale: 여기서 רַק는 ‘오직’의 배타성보다 감탄적 강조로 기능하므로, 단정적 평가를 담는 ‘참으로’가 문맥상 더 적절합니다.
theological_decisions:
- issue: '어조의 직접성: 명령문과 인용문의 구분'
  chosen_reading: 서술부는 합쇼체 명령으로, 민족들의 직접 발화는 따옴표 안의 평서형 진술로 구분했습니다.
  alternative_readings:
  - 모든 문장을 일괄 서술형으로 처리
  - 따옴표 없이 간접화법으로 흡수
  rationale: 원문은 모세의 권면과 열방의 평가를 분명히 구분하므로, 한국어에서도 화자 전환을 보존해 수사적 대비를 살렸습니다.
  doctrine_reference: 문맥적 화자 구분 보존 원칙
- issue: ‘지혜/분별’이 드러내는 언약적 의미
  chosen_reading: 이 구절은 순종 자체를 통해 이스라엘의 지혜와 분별이 공적으로 드러난다고 말합니다.
  alternative_readings:
  - 규례 자체가 곧 별도의 지혜라는 진술로 읽기
  - 민족적 우월성의 선언으로 읽기
  rationale: ‘지키고 행하라’와 ‘이것이 너희의 지혜’의 연결을 유지하여, 순종의 가시적 증거라는 문맥적 의미를 과장 없이 전달했습니다.
  doctrine_reference: 본문의 수사 구조와 언약적 문맥
