revisions:
- from: 그러므로 그것들을 지키고 행하십시오. 이것이 바로 여러 민족들 앞에서 너희의 지혜이며 너희의 분별입니다. 그들이 이 모든 규례를 들으면 말할 것입니다. 「이 큰 민족은 참으로 지혜롭고 분별 있는 백성이다」라고.[a]
  to: 그러므로 여러분은 그것들을 지키고 행하십시오. 이것이 여러 민족 앞에서 여러분의 지혜와 분별이 될 것입니다. 여러 민족이 이 모든 규례[a]를 듣고 이렇게 말할 것입니다. “참으로 이 큰 민족은 지혜롭고 분별 있는 백성이구나.”
  rationale: 원문의 관계절(‘듣고 말할 여러 민족’)과 미래적 진술을 한국어에서 자연스럽고 명확하게 보존했습니다. 현대 합쇼체에 맞추어 복수 청자를 ‘여러분’으로 통일했으며, 규례의 어휘 각주를 해당 단어에 연결했습니다. 원문의 강조사 רַק는 배타적 ‘오직’으로 단정하지 않고 감탄적 ‘참으로’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 אֲשֶׁר יִשְׁמְעוּן וְאָמְרוּ는 ‘여러 민족’에 연결된 관계절로서, 조건절인 ‘그들이 … 들으면’보다 ‘여러 민족이 … 듣고 말할’로 옮기는 편이 원문의 연결과 미래적 전망을 더 정확히 보존합니다. ‘그러므로’는 앞 문맥을 잇는 접속의 의미를 무리 없이 반영합니다.
  naturalness: 합쇼체 명령문은 적절합니다. 그러나 ‘너희’와 ‘행하십시오’의 결합은 현대의 공적 존대 문체에서 다소 혼합된 인상을 줄 수 있어 ‘여러분’을 사용하는 것이 더 자연스럽습니다. 또한 직접 인용문의 종결부호와 각주 표지를 해당 어휘 가까이에 두면 문장 구조가 더 명료해집니다.
  terminology: ‘규례’는 חֻקִּים의 적절한 번역이며, ‘지혜’와 ‘분별’도 חָכְמָה/בִּינָה의 대조를 잘 살립니다. ‘큰 민족’(גּוֹי)과 ‘백성’(עַם)의 구별도 보존됩니다. רַק는 이 문맥에서 ‘참으로’로 처리해도 안전합니다.
  issues:
