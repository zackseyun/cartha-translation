translation:
  language: ko
  text: 요단강 건너편[a], 베스브올 맞은편 골짜기, 아모리 족속의 왕 시혼의 땅, 곧 헤스본에 살던 자를 모세와 이스라엘의 아들들이 이집트에서 나올 때 쳐 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요단강 건너편”이 아니라 “요단강 저편”으로도 옮길 수 있습니다. 히브리어는 ‘요단강 건너편’을 뜻하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단강 건너편
  alternatives_korean:
  - 요단강 저편
  - 요단강을 건너서
  lexicon: HALOT
  rationale: 경계 너머의 지리적 위치를 자연스럽게 살리면서도, ‘beyond’의 관점성과 서술성을 유지합니다.
- source_word: בַּגַּיְא מוּל בֵּית פְּעוֹר
  english_pob_choice: in the valley opposite Beth-peor
  chosen_korean: 베스브올 맞은편 골짜기
  alternatives_korean:
  - 베스브올 맞은편의 골짜기
  - 베스브올 앞 골짜기
  lexicon: HALOT
  rationale: גַּיְא는 여기서 지형 설명이므로 ‘골짜기’가 적절하고, מוּל은 공간적 대응을 나타내어 ‘맞은편’으로 옮겼습니다.
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: and the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성형을 유지해 직역성을 살렸고, POB의 ‘sons of Israel’ 대응을 반영했습니다.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  english_pob_choice: when they came out from Egypt
  chosen_korean: 이집트에서 나올 때
  alternatives_korean:
  - 이집트에서 나왔을 때
  - 이집트에서 나오던 때
  lexicon: HALOT
  rationale: 출애굽의 사건성을 간결하게 드러내는 시간 부사구로 옮겼습니다.
theological_decisions:
- issue: 남성 복수 표현 וּבְנֵי יִשְׂרָאֵל의 처리
  chosen_reading: 이스라엘의 아들들
  alternative_readings:
  - 이스라엘 자손
  - 이스라엘 사람들
  rationale: 원문이 분명히 남성 복수 구성형이므로, 이를 평준화하지 않고 형태를 보존했습니다. 다만 한국어 본문에서는 자연스러운 독해를 위해 ‘아들들’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
