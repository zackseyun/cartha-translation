id: DEU.4.8
reference: Deuteronomy 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
  footnotes:
  - marker: a
    text: 'Or ''instruction'' for ''law'' (Hebrew torah), though here the context is specifically legal: ''statutes and judgments.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이처럼 큰 나라 가운데, 오늘 내가 여러분 앞에 두는 이 모든 율법만큼 의로운 규례와 법도를 가진 나라가 어디 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침’으로 옮길 수 있습니다. 히브리어 토라(torah)는 넓게는 ‘가르침’을 뜻하지만, 여기서는 ‘규례와 법도’가 함께 나와 법적 의미가 두드러집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי גּוֹי גָּדוֹל
  english_pob_choice: And what great nation is there
  chosen_korean: 그렇다면 이처럼 큰 나라가 어디 있겠습니까?
  alternatives_korean:
  - 이처럼 큰 민족이 어디 있겠습니까?
  - 어떤 큰 나라가 있겠습니까?
  lexicon: HALOT
  rationale: 수사 의문문으로서 비교를 이끌어내는 표현이므로, 한국어에서도 자연스러운 반문 형태로 옮겼습니다. גּוֹי는 여기서 정치·공동체적 집단을 가리키므로 '나라'를 택했습니다.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  english_pob_choice: statutes and judgments
  chosen_korean: 규례와 법도
  alternatives_korean:
  - 규정과 판결
  - 율례와 재판
  lexicon: HALOT
  rationale: 두 법 용어의 구분을 살리기 위해 관용적으로 짝을 이루는 법률어를 사용했습니다. חֻקִּים은 정한 규례, מִשְׁפָּטִים은 판단·판결의 성격이 있어 '법도'로 구별했습니다.
- source_word: צַדִּיקִם
  english_pob_choice: as righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 공의로운
  - 옳은
  lexicon: HALOT
  rationale: 규례와 법도가 단순히 유용하다는 뜻이 아니라 하나님 뜻에 합당하게 옳다는 도덕·법적 성격을 드러내기 위해 '의로운'을 선택했습니다.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  english_pob_choice: as all this law
  chosen_korean: 이 모든 율법처럼
  alternatives_korean:
  - 이 모든 율법과 같은
  - 이 모든 가르침처럼
  lexicon: HALOT
  rationale: 본문은 비교 대상 전체를 가리키므로 '처럼'으로 비교를 살렸습니다. תּוֹרָה는 여기서 문맥상 법적 corpus를 가리켜 '율법'이 가장 직접적입니다.
- source_word: נֹתֵן לִפְנֵיכֶם הַיּוֹם
  english_pob_choice: I am setting before you today
  chosen_korean: 오늘 내가 여러분 앞에 두는
  alternatives_korean:
  - 오늘 내가 여러분 앞에 놓는
  - 오늘 내가 너희 앞에 두는
  lexicon: HALOT
  rationale: לִפְנֵיכֶם은 '앞에'라는 공간적 비유를 보존했고, 현대 표준어 청중을 고려해 '여러분'을 사용했습니다. נֹתֵן은 관용적으로 '두는'이 자연스럽습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 문맥의 법적 초점 때문에 본문에는 '율법'을 사용했습니다.
  alternative_readings:
  - instruction(교훈/가르침)
  - 가르침
  rationale: 출애굽기·신명기 문맥에서 여기의 תּוֹרָה는 '규례와 법도'와 함께 묶여 이스라엘의 법 체계를 가리킵니다. 더 넓은 'instruction' 의미는 주석적 여지로만 남기고 본문은 법적 의미를 우선했습니다.
  doctrine_reference: Translation philosophy §1, §5
