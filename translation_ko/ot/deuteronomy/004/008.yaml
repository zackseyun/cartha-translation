  naturalness: 초안의 마지막 ‘오늘 내가 여러분 앞에 두는 이 모든 율법과 같이 말입니다’는 독립된 문장으로 자연스럽지 않고 앞의 비교구문을 중복합니다. 수정안은 현대 표준어 합쇼체의 자연스러운 수사 의문문입니다.
