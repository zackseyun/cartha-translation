  to: 또 이처럼 큰 나라 가운데, 오늘 내가 여러분 앞에 두는 이 모든 율법만큼 의로운 규례와 법도를 가진 나라가 어디 있겠습니까?[a]
  rationale: 비교 대상과 수사 의문문의 구조를 한 문장 안에 복원했습니다. ‘또’는 앞 절과의 접속을 반영하며, ‘이처럼’은 앞 절에서 제시된 비교의 흐름을 자연스럽게 이어 줍니다. 의미상의 확대나 교리적 해석은 추가하지 않았습니다.
