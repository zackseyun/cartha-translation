revisions:
- from: 그 날, 곧 당신이 호렙에서 당신의 하나님 야훼 앞에 섰던 날, 야훼께서 내게 말씀하셨습니다. ‘백성을 내게로 모으라. 그러면 내가 그들에게 내 말을 들려주겠다. 그들이 살아 있는 모든 날 동안 땅 위에서 나를 두려워하는 법을 배우게 하고, 그들의 자녀에게도 가르치게 하려는 것이다.’[a]
  to: 당신이 호렙에서 당신의 하나님 야훼 앞에 섰던 날, 야훼께서 내게 말씀하셨습니다. ‘백성을 내게로 모으라. 내가 그들에게 내 말을 듣게 하겠다. 그러면 그들은 땅 위에서 살아 있는 모든 날 동안 나를 두려워하는 법을 배우고, 자기들의 자녀에게도 가르치도록 하겠다.’[a]
  rationale: 시간 도입부의 중복을 줄이고, 말씀을 듣게 하시는 목적 아래 ‘두려워함을 배움’과 ‘자녀 교육’이 병렬로 이어지도록 고쳤습니다. אֲדָמָה의 의미 범위는 본문의 ‘땅 위에서’와 각주의 ‘그 땅에서’로 보존했습니다.
