  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
  footnotes:
  - marker: a
    text: Or 'on the land.' The Hebrew אֲדָמָה can refer to the earth/ground generally or to the land in a more specific sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 호렙에서 당신의 하나님 야훼 앞에 섰던 날, 야훼께서 내게 말씀하셨습니다. ‘백성을 내게로 모으라. 내가 그들에게 내 말을 듣게 하겠다. 그러면 그들은 땅 위에서 살아 있는 모든 날 동안 나를 두려워하는 법을 배우고, 자기들의 자녀에게도 가르치도록 하겠다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에서’. 히브리어 אֲדָמָה는 일반적으로 땅이나 흙을 가리킬 수도 있고, 더 구체적으로는 특정한 땅을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  english_pob_choice: the day when
  chosen_korean: 그 날
  alternatives_korean:
  - 그 날, …하는 날
  - 그 날에
  lexicon: HALOT
  rationale: 회고문맥의 시간표현을 한국어로 자연스럽게 옮기되, 뒤따르는 절이 그 날을 다시 설명하므로 과도한 직역형 연결어는 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 소스의 고유신명 표기를 그대로 반영하여, 제목이 아니라 이름이라는 점을 드러내는 프로젝트 기본값을 따랐습니다.
- source_word: הַקְהֶל לִי אֶת הָעָם
  english_pob_choice: Assemble the people to me
  chosen_korean: 백성을 내게로 모으라
  alternatives_korean:
  - 백성을 내게로 모으라
  - 백성을 내게 모으라
  - 백성을 모아 내게로 오게 하라
  lexicon: HALOT
  rationale: 히필 명령형의 강제적 소집 의미를 살리면서, לִי를 ‘내게로’로 옮겨 목적지/귀속 방향을 분명히 했습니다.
- source_word: וְאַשְׁמִעֵם אֶת דְּבָרָי
  english_pob_choice: and I will let them hear my words
  chosen_korean: 그러면 내가 그들에게 내 말을 들려주겠다
  alternatives_korean:
  - 내 말을 듣게 하겠다
  - 내 말을 들려주겠다
  - 내 말을 듣도록 하겠다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘듣게 하다’보다 ‘들려주다’를 택했고, ‘말들’의 복수를 ‘말’로 보존하되 한국어 어법에 맞게 정리했습니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: on the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅에서
  - 그 땅에서
  - 땅 위에
  lexicon: HALOT
  rationale: English POB의 ‘earth’와 주석상의 ‘land’ 가능성을 모두 염두에 두되, 문맥을 좁히지 않는 중립적 한국어로 옮겼습니다.
- source_word: וְאֶת בְּנֵיהֶם יְלַמֵּדוּן
  english_pob_choice: and that they may teach their children
  chosen_korean: 그들의 자녀에게도 가르치게 하려는 것이다
  alternatives_korean:
  - 그들의 자녀를 가르치게 하려는 것이다
  - 자녀들에게도 가르치게 하려는 것이다
  lexicon: HALOT
  rationale: בנים을 남성자손으로 제한하지 않고, 문맥의 후대 전승 대상을 포괄하는 ‘자녀’로 옮겼습니다.
theological_decisions:
- issue: ‘fear me’의 한국어 신학적 뉘앙스
  chosen_reading: ‘나를 두려워하는 법을 배우게’
  alternative_readings:
  - 나를 경외하는 법을 배우게
  - 나를 두려워하게
  rationale: 언약 문맥의 ירא는 단순한 공포가 아니라 두려움과 순종을 포함하므로, 너무 순화된 ‘경외’만으로는 긴장을 약화시킬 수 있습니다. ‘두려워하는 법을 배우게’는 의미의 무게를 유지하면서도 한국어로 자연스럽습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
