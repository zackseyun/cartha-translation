  rationale: 본문은 세 법적 범주를 병렬로 제시하므로, 한국어에서도 분리된 항목으로 보이게 해야 원문의 구조와 강조를 보존할 수 있습니다.
  doctrine_reference: 언약 율법의 다양한 범주에 대한 본문 구조 보존
