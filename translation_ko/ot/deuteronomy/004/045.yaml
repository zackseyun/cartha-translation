  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 곧 증언들과 규례들과 법규들입니다. 모세가 이스라엘 자손에게, 그들이 이집트에서 나올 때에, 말한 것들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자녀들’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
