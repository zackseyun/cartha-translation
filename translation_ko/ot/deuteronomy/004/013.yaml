- from: 그는 당신들에게 그의 언약을 선포하셨습니다[a]—곧 그가 당신들에게 행하라고 명령하신 십계명이었습니다. 그리고 그것들을 두 돌판에 쓰셨습니다.
  to: 그분께서는 여러분에게 자신의 언약, 곧 여러분이 행하도록 명령하신 열 말씀[a]을 선포하셨습니다. 그리고 그것들을 두 돌판에 쓰셨습니다.
  rationale: 원문의 동격 구조와 ‘열 말씀’이라는 명칭을 본문에서 보존하고, 전통적 표현인 ‘십계명’은 각주로 옮겼습니다. 또한 지시 대상과 높임말을 자연스러운 현대 격식체에 맞추고, 각주 표지를 설명 대상에 직접 연결했습니다.
