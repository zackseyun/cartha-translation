  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Ten Words''; traditionally, ''the Ten Commandments.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 당신들에게 그의 언약을 선포하셨습니다[a]—곧 그가 당신들에게 행하라고 명령하신 십계명이었습니다. 그리고 그것들을 두 돌판에 쓰셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘열 말씀들’; 전통적으로 ‘십계명’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: declared
  chosen_korean: 선포하셨습니다
  alternatives_korean:
  - 선언하셨습니다
  - 알려 주셨습니다
  - 말씀하셨습니다
  lexicon: HALOT
  rationale: נגד의 히필은 단순한 전달보다 공식적으로 알리고 공표하는 뜻이 강하므로, 언약 문맥의 격식을 살려 ‘선포하셨습니다’로 옮겼습니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  lexicon: HALOT
  rationale: בְּרִית의 표준 성경어는 ‘언약’이므로, 관계적·신학적 무게를 유지하는 표현을 택했습니다.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  english_pob_choice: the Ten Words
  chosen_korean: 십계명
  alternatives_korean:
  - 열 가지 말씀
  - 열 말씀
  lexicon: HALOT
  rationale: 본문은 직역하면 ‘열 말씀들’이지만, 한국어에서 해당 항목을 즉시 이해시키는 공인된 관용 표현이 ‘십계명’이어서 본문에는 이를 두고, 직역 정보는 주석으로 보완했습니다.
- source_word: לַעֲשׂוֹת
  english_pob_choice: to do
  chosen_korean: 행하라고
  alternatives_korean:
  - 지키라고
  - 실행하라고
  lexicon: HALOT
  rationale: 동사의 기본 의미를 살리기 위해 ‘지키다’로 완화하지 않고, ‘행하다’에 명령형 보조를 붙여 원문의 직접성을 유지했습니다.
- source_word: שְׁנֵי לֻחוֹת אֲבָנִים
  english_pob_choice: two tablets of stone
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 석판
  - 돌로 된 두 판
  lexicon: HALOT
  rationale: ‘돌판’은 두 돌판이 돌로 된 판임을 자연스럽게 드러내는 한국어이며, 문맥상 재질과 형태를 함께 전달합니다.
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים의 본문 표기와 전통 표기 관계
  chosen_reading: 본문에는 의미를 즉시 전달하는 ‘십계명’을 두고, 주석에서 히브리어 직역이 ‘열 말씀’임을 밝혔습니다.
  alternative_readings:
  - 열 말씀
  - 십계시
  rationale: 본문 자체의 명칭은 직역상 ‘열 말씀’이지만, 한국어 독자가 이 구절을 오독 없이 읽도록 전통적 항목명인 ‘십계명’을 본문에 채택하되, 원문의 명명법은 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
