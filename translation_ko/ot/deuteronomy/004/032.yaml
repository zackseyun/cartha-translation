  rationale: 본문은 창조 이후의 전 역사를 묻는 맥락이므로 개인 남성보다 인류 전체를 대표하는 의미가 핵심입니다. ‘사람’은 이 대표성을 자연스럽게 드러내면서도 현대 독자가 성별 한정으로 오해할 가능성을 줄입니다.
