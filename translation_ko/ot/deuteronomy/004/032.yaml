theological_decisions:
- issue: אָדָם의 번역에서 대표성 유지와 성별 오해 방지
  chosen_reading: ‘사람’으로 옮겨 창조 인류 전체를 가리키는 대표적 의미를 살렸습니다.
  alternative_readings:
