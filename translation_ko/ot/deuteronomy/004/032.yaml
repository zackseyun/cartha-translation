base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
  footnotes:
  - marker: a
    text: Or 'humankind'; Hebrew 'man' (אָדָם) can refer representatively to humanity as a whole in creation contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 너보다 앞선 옛날에 대하여 물어보십시오. 하나님께서 땅 위에 사람[a]을 창조하신 날부터 하늘 이 끝에서 저 끝까지, 이 크나큰 일과 같은 일이 일어난 적이 있습니까? 또는 이와 같은 일이 들린 적이 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’; 히브리어 ‘사람’(אָדָם)은 창조 문맥에서 인류 전체를 대표적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
