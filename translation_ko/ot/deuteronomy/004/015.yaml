base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
  footnotes:
  - marker: a
    text: Or 'you did not see any likeness' or 'you saw no image.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'watch yourselves very carefully,' literally 'guard yourselves greatly for your souls,' an idiom meaning to be extremely careful.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 여러분은 스스로를 매우 조심하십시오[a][b]. 그분께서 호렙에서 불 가운데서 여러분에게 말씀하시던 날, 여러분은 어떤 형상도 보지 못하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 유사한 모습도 보지 못하였으니’ 또는 ‘어떤 형상도 보지 못하였으니’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘여러분의 영혼들을 위해 크게 지키라’는 뜻이지만, ‘스스로를 매우 조심하십시오’라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  english_pob_choice: watch yourselves very carefully
  chosen_korean: 스스로를 매우 조심하십시오
  alternatives_korean:
  - 여러분 자신을 매우 지키십시오
  - 스스로를 매우 삼가십시오
  lexicon: HALOT
  rationale: נשׁמר와 נֶפֶשׁ의 관용적 결합을 한국어의 자연스러운 반사적 경고로 옮겼습니다. '스스로를'과 '조심하십시오'는 경고의 강도를 살리면서도 직역투를 피합니다.
- source_word: כִּי לֹא רְאִיתֶם כָּל תְּמוּנָה
  english_pob_choice: since you saw no form
  chosen_korean: 어떤 형상도 보지 못하였습니다
  alternatives_korean:
  - 어떤 모습도 보지 못하였습니다
  - 어떤 형체도 보지 못하였습니다
  lexicon: HALOT
  rationale: תְּמוּנָה는 여기서 보이는 '형상/형태'를 가리키므로, 우상적 이미지를 너무 좁히지 않으면서도 문맥의 금지 근거를 드러내는 '형상'을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 그분
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 이 절의 핵심은 호렙 현현 당시의 발화 사실이며, 한국어 본문에서는 직접 신명 표기보다 바로 앞 절 맥락을 이어 받는 지시어로 처리했습니다. 본문 내에서 '야훼'를 반복하면 한국어의 흐름이 불필요하게 끊길 수 있어, 여기서는 대명사로 자연스럽게 연결했습니다.
- source_word: בְּחֹרֵב מִתּוֹךְ הָאֵשׁ
  english_pob_choice: at Horeb from the midst of the fire
  chosen_korean: 호렙에서 불 가운데서
  alternatives_korean:
  - 호렙에서 불 한가운데서
  - 호렙에서 불 속에서
  lexicon: HALOT
  rationale: מִתּוֹךְ הָאֵשׁ의 공간적 생동감을 살려 '불 가운데서'로 옮겼습니다. 이는 단순히 '불에서'보다 현현의 장면성을 더 정확하게 전달합니다.
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם의 의미를 '영혼'으로 좁힐지 여부
  chosen_reading: 반사적 경고로서 '스스로를 매우 조심하십시오'
  alternative_readings:
  - 영혼을 위해 매우 조심하십시오
  - 여러분의 영혼을 지키십시오
  rationale: 히브리어 관용구는 존재론적 영혼론을 말하기보다 자기 경계의 강도를 강조합니다. 따라서 '영혼'을 끌어오지 않고 문맥이 요구하는 경고 의미를 유지했습니다.
  doctrine_reference: 본문이 말하는 바를 과장하지 말고, 관용구의 기능을 우선한다.
- issue: 야훼의 현현을 '형상' 부재로 설명하는 신학적 초점
  chosen_reading: 눈에 보이는 어떤 대표상도 주어지지 않았다는 강조
  alternative_readings:
  - 우상 금지의 직접 진술
  - 하나님의 비가시성에 대한 일반 명제
  rationale: 이 절은 창조주를 형상화하지 못하게 하는 이유를 제공하지만, 그 자체로는 보편적 형이상학보다 호렙 현현의 특수성을 강조합니다. 따라서 '형상' 부재를 그대로 드러내어 다음 문맥의 우상 금지 논거를 살렸습니다.
  doctrine_reference: 문맥적 신학 긴장을 보존하고, 절 하나에 과도한 교리를 부여하지 않는다.
