  naturalness: ‘여러분 자신을 각별히 조심하십시오’는 현대 표준 한국어 합쇼체에서 자연스럽고, 히브리어 관용구의 자기 경계와 강한 강조를 잘 전달합니다. 이유절을 ‘…보지 못하였기 때문입니다’로 처리하면 명료하고 자연스럽습니다.
  terminology: יהוה는 POB의 신명 표기 원칙 및 영어 감사 기록에 맞추어 ‘야훼’로 옮겨야 합니다. תְּמוּנָה의 ‘형상’과 מִתּוֹךְ הָאֵשׁ의 ‘불 한가운데서’는 문맥과 원문에 충실합니다.
