id: DEU.4.3
reference: Deuteronomy 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
  footnotes:
  - marker: a
    text: Or 'everyone who followed Baal-peor.' The Hebrew reads literally 'every man who went after Baal-peor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 눈이 친히 보았습니다. 바알-브올에서 야훼께서 하신 일을 말입니다. 곧 바알-브올을 따라간 모든 사람을 야훼 여러분의 하나님께서 여러분 가운데서 멸하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알-브올을 따른 모든 사람’. 히브리어는 문자적으로 ‘바알-브올 뒤로 간 모든 남자’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  english_pob_choice: Your own eyes have seen
  chosen_korean: 여러분의 눈이 친히 보았습니다
  alternatives_korean:
  - 여러분의 눈으로 보았습니다
  - 여러분이 친히 보았습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘여러분의 눈, 보는 그 눈’이라는 직접적 강조를 담고 있어, 한국어에서는 ‘친히’로 증강된 목격성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명을 전통적 대치어 ‘여호와’나 호칭 ‘주님’이 아니라, 원문 고유명에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: בְּבַעַל פְּעוֹר
  english_pob_choice: at Baal-peor
  chosen_korean: 바알-브올에서
  alternatives_korean:
  - 바알-브올에 대하여
  - 바알-브올 때문에
  lexicon: HALOT
  rationale: ב의 상황/장소적 용법을 살려 사건의 현장을 가리키는 표현으로 ‘-에서’를 택했습니다.
- source_word: כָּל הָאִישׁ
  english_pob_choice: every man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 남자
  - 각 사람
  lexicon: HALOT
  rationale: 히브리어는 문법상 남성 단수이지만, 한국어에서는 이 분배적 용법이 집합적으로 읽히므로 의미를 유지하면서도 자연스럽게 ‘모든 사람’으로 옮겼습니다.
- source_word: הִשְׁמִידוֹ
  english_pob_choice: destroyed
  chosen_korean: 멸하셨습니다
  alternatives_korean:
  - 파괴하셨습니다
  - 진멸하셨습니다
  lexicon: HALOT
  rationale: שמד의 강한 파괴/제거 의미를 살리되, 본문이 공동체 안에서의 제거를 말하므로 한국어에서는 ‘멸하다’가 가장 간결하고 적절합니다.
theological_decisions:
- issue: 신명기적 경고의 직접성
  chosen_reading: 목격을 상기시키는 강한 증언 문장으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 보다 완곡한 회고체로 풀어 쓰기
  - 교훈적 표현으로 일반화하기
  rationale: 본문은 단순한 역사 설명이 아니라 ‘여러분의 눈이 보았다’는 직접 증언으로 순종을 촉구하므로, 그 수사적 압박감을 약화시키지 않았습니다.
  doctrine_reference: '신명기 4장 문맥: 기억과 순종을 촉구하는 언약적 증언'
