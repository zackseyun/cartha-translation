  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
  footnotes:
  - marker: a
    text: Or 'and you will find'; the Hebrew does not repeat the object pronoun here, but English may supply 'him' from the previous clause for clarity.
    reason: lexical_alternative
  - marker: b
    text: '''Soul'' may also be rendered ''life'' or ''being'' here; the Hebrew nephesh often refers to the whole living self.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 거기서 너희는 주 너희 하나님을 찾게 될 것이고, 너희가 온 마음과 온 영혼으로 그분을 찾으면 그분을 만나게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주’는 본문의 יְהוָה를 옮긴 것입니다.
    reason: ot_citation
  - marker: b
    text: ‘영혼’은 히브리어 נֶפֶשׁ의 가능한 번역입니다. 여기서는 ‘생명’이나 ‘존재’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  english_pob_choice: But ... you will seek
  chosen_korean: 그러나 ... 찾게 될 것이고
  alternatives_korean:
  - 그리고 ... 찾게 될 것이고
  - 그러면 ... 찾게 될 것이고
  lexicon: HALOT
  rationale: 앞절의 경고와 대조되는 전개를 살려 ‘그러나’로 시작했고, 완료형 연속의 미래적 의미를 자연스러운 한국어 미래 표현으로 옮겼습니다.
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 거기에서
  lexicon: HALOT
  rationale: 이스라엘이 흩어진 자리에서 하나님을 찾는다는 장소성을 간결하게 드러내기 위해 ‘거기서’로 옮겼습니다.
- source_word: בְכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  english_pob_choice: with all your heart and with all your soul
  chosen_korean: 온 마음과 온 영혼으로
  alternatives_korean:
  - 마음을 다하고 영혼을 다해
  - 온 심령과 온 생명으로
  lexicon: HALOT
  rationale: ‘마음’은 לֵבָב의 내적 중심을, ‘영혼’은 נֶפֶשׁ의 전인적 자기 헌신을 한국어 성경 어법 안에서 가장 직접적으로 살립니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 주 너희 하나님
  alternatives_korean:
  - 야훼 너희 하나님
  - 주 하나님
  lexicon: DOCTRINE.md contested terms; HALOT
  rationale: 본문의 신명기적 언약 호칭을 한국어 독자에게 자연스럽게 전달하기 위해 ‘주’로 옮겼으며, 영어 POB의 이름형 ‘Yahweh’ 선택은 본문보다 주석층에서 반영됩니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서는 ‘주’로 번역해 문맥상 언약의 하나님을 가리키게 하고, 주석 없이 이름 자체를 표면화하지는 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 주어진 영어 POB는 본문에 ‘Yahweh’가 있으나, 한국어 본문은 합쇼체의 자연스러움과 교회독자 가독성을 위해 전통적 호칭을 유지하는 쪽이 문맥 전달에 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: ‘영혼’
  alternative_readings:
  - 생명
  - 존재
  rationale: 신명기의 관용구 ‘마음과 영혼’은 전인적 헌신을 요구하는 표현이므로, 한국어에서도 익숙하면서도 신학적 긴장을 덜 약화하는 ‘영혼’을 채택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
