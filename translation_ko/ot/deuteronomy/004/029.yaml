  source_fidelity: 히브리어의 장소 표현(‘거기서’), 하나님을 찾고 발견하는 조건적 전개, 그리고 ‘온 마음과 온 נפש’의 전인적 헌신 표현을 대체로 충실히 반영했습니다. 다만 יְהוָה는 프로젝트의 정해진 원칙과 영어 POB 감사 기록에 따라 이름형으로 옮겨야 하며, ‘주’로 처리한 현 초안은 이를 따르지 않습니다. ‘발견하다’는 문맥상 하나님을 만나게 되는 것으로 자연스럽게 표현할 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘찾을 것이며 … 찾으면’의 반복은 히브리어의 반복을 보존하며, ‘그분을 만나게 될 것입니다’는 하나님을 찾아 발견한다는 문맥을 자연스럽게 드러냅니다.
  terminology: יְהוָה는 ‘야훼’로 바로 옮겼습니다. אֱלֹהֶיךָ의 단수 소유 접미사는 앞선 복수 청자에게 이어지는 본문상의 형태이나, 한국어에서는 관용적이고 자연스럽게 ‘너희 하나님’으로 옮겼습니다. נֶפֶשׁ는 이 신명기 관용구에서 ‘영혼’으로 유지하고 의미 범위는 각주에 남겼습니다.
