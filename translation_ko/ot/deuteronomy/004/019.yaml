  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
  footnotes:
  - marker: a
    text: Or 'has assigned' or 'has apportioned.' The Hebrew says the LORD 'allotted' these to all the peoples; the wording does not itself say that he approved their worship of them.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'under all the heavens'; many English versions render this idiom as 'under the whole heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 하늘을 향해 눈을 들어 해와 달과 별들, 곧 하늘의 모든 천체를 보고, 그것들에게 이끌려 절하고 섬기는 일이 없도록 주의하십시오. 당신의 하나님이신 야훼께서 그것들을 온 하늘 아래의 모든 백성에게 나누어 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘할당하셨습니다’ 또는 ‘분배하셨습니다’. 히브리어는 야훼께서 이 천체들을 모든 백성에게 ‘나누어 주셨다’고 말하며, 이 표현 자체가 그들이 그것들을 숭배하는 일을 승인하셨다는 뜻은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  english_pob_choice: And beware lest
  chosen_korean: 그리고 주의하십시오
  alternatives_korean:
  - 삼가
  - ~하지 않도록 주의하십시오
  lexicon: HALOT
  rationale: 경고문의 도입부로서 단순한 금지보다 경계하라는 어조를 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: כֹּל צְבָא הַשָּׁמָיִם
  english_pob_choice: all the host of heaven
  chosen_korean: 하늘의 모든 천상들
  alternatives_korean:
  - 하늘의 모든 군대
  - 하늘의 온 천군
  lexicon: HALOT
  rationale: 천체들을 가리키는 문맥이므로 ‘군대’보다 하늘의 배열 전체를 드러내는 표현을 택했습니다. ‘천상들’은 원문의 집합적 표현을 비교적 직접적으로 반영합니다.
- source_word: וְנִדַּחְתָּ
  english_pob_choice: you be drawn away
  chosen_korean: 이끌려 가서
  alternatives_korean:
  - 멀어져서
  - 유혹되어
  lexicon: HALOT
  rationale: 수동적으로 우상숭배 쪽으로 끌려가는 뉘앙스를 살리되, 과도하게 ‘유혹’으로 좁히지 않도록 했습니다.
- source_word: אֲשֶׁר חָלַק יְהוָה אֱלֹהֶיךָ אֹתָם
  english_pob_choice: which Yahweh your God has allotted
  chosen_korean: 야훼 당신의 하나님께서 그것들을 ... 나누어 주셨습니다
  alternatives_korean:
  - '... 분배하셨습니다'
  - '... 배정하셨습니다'
  lexicon: HALOT
  rationale: חלק의 기본 의미를 따라 ‘나누어 주다’로 옮기되, 우주적 배분의 의미가 드러나도록 했습니다. 이는 원문이 그들의 숭배를 승인한다는 뜻이 아님을 보존합니다.
- source_word: לְכֹל הָעַמִּים
  english_pob_choice: to all the peoples
  chosen_korean: 하늘 아래의 모든 백성
  alternatives_korean:
  - 모든 민족에게
  - 모든 ժողովուրդ에게
  lexicon: HALOT
  rationale: ‘peoples’를 한국어 ‘백성’으로 옮겨 집합적이고 다수적인 대상을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 천체를 ‘나누어 주셨다’는 구절의 신학적 함의
  chosen_reading: 이 구절은 야훼께서 천체를 각 백성에게 배분하셨다는 진술을 유지하되, 그들의 천체숭배를 승인하셨다는 뜻으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - 하나님이 열방의 우상숭배를 허락하셨다는 뜻
  - 천체를 사람들의 실제 사용을 위해 주셨다는 뜻
  rationale: 문맥은 분명히 우상숭배 경고이며, חלק의 ‘배분/할당’ 의미를 보존하면서도 승인 의미를 덧씌우지 않는 것이 원문 긴장을 더 잘 살립니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it.'
