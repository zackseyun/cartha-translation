base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
  footnotes:
  - marker: a
    text: 'Hebrew: ''which the LORD your God commanded you.'' The prohibition (''not to make'') is implicit from the context; compare Deuteronomy 4:16.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 자신을 삼가십시오. 너희 하나님 야훼께서 너희와 맺으신 언약을 잊어버리거나, 너희를 위하여 너희 하나님 야훼께서 너희에게 만들지 말라고 명하신 어떤 것의 형상을 본뜬 조각상을 만들지 않도록 하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘너희 하나님 야훼께서 너희에게 명하신 어떤 것의 형상’입니다. ‘만들지 말라고’라는 부정은 본문에 명시되어 있지 않으나, 문맥과 신명기 4:16에 비추어 보충했습니다.
    reason: textual_clarification
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  english_pob_choice: Watch yourselves
  chosen_korean: 스스로를 경계하십시오
  alternatives_korean:
  - 스스로를 지키십시오
  - 주의하십시오
  - 조심하십시오
  lexicon: HALOT
  rationale: 반복적 자기 경계를 요구하는 경고형 명령으로, ‘경계하다’가 reflexive force와 엄중한 경고의 뉘앙스를 비교적 자연스럽게 살립니다.
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 동맹
  - 합의
  lexicon: HALOT
  rationale: 하나님과 이스라엘 사이의 ברית는 한국어 성서 문맥에서 ‘언약’이 가장 정확하고 신학적으로도 표준적인 대응어입니다.
- source_word: פֶּסֶל תְּמוּנַת כֹּל
  english_pob_choice: a carved image, the likeness of anything
  chosen_korean: 새긴 우상, 곧 …의 형상
  alternatives_korean:
  - 새긴 형상
  - 조각한 형상
  - 새긴 상
  - 어떤 모습이든
  lexicon: HALOT
  rationale: פֶּסֶל의 물질적 제작 감각은 ‘새긴’으로, תְּמוּנָה의 대표/형상 의미는 ‘형상’으로 옮겨 구체성과 금지 대상의 범위를 함께 드러냈습니다.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: that Yahweh your God has commanded you not to make
  chosen_korean: 야훼 당신들의 하나님께서 당신들에게 만들지 말라고 명하신 것
  alternatives_korean:
  - 야훼 당신들의 하나님께서 당신들에게 명하신 것
  - 야훼 당신들의 하나님께서 당신들에게 만들 것을 명하신 것
  lexicon: HALOT
  rationale: 히브리어는 부정을 생략한 형태지만 문맥상 금지명령이 분명하므로, ‘만들지 말라고’로 부정을 분명히 드러내어 오해를 막았습니다.
theological_decisions:
- issue: 문맥상 생략된 부정의 보충
  chosen_reading: 마지막 관계절은 금지 의미를 분명히 하도록 ‘만들지 말라고 명하신 것’으로 옮겼습니다.
  alternative_readings:
  - 형식적으로 ‘야훼 당신들의 하나님께서 당신들에게 명하신 것’으로만 옮겨 부정을 생략함
  - 앞 절의 금지 문맥에 맡겨 부정을 암시만 함
  rationale: 직역하면 하나님이 우상 제작을 명하신 듯 오해될 수 있으므로, 바로 앞뒤 문맥과 4:16의 평행을 따라 의도된 금지 의미를 한국어로 명시하는 것이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: optimal equivalence; 문맥이 요구하는 함축을 명료화하되 본문의 주장 범위를 넘지 않음'
