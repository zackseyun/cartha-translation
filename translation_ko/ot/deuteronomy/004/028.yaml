base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
  footnotes:
  - marker: a
    text: Or, more literally, 'which do not see or hear or eat or smell.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그곳에서 여러분은 사람의 손으로 만든 나무와 돌, 곧 보지도 듣지도 먹지도 냄새를 맡지도 못하는 신들을 섬기게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신들’에 해당하는 히브리어 단어는 복수형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  english_pob_choice: you will serve
  chosen_korean: 섬기게 될 것입니다
  alternatives_korean:
  - 섬길 것입니다
  - 봉사하게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 עבד는 여기서 단순 노동보다 우상 섬김의 의미가 강하므로, 예배적·종속적 뉘앙스를 살려 ‘섬기다’로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님들
  - 우상들
  lexicon: HALOT
  rationale: 문맥상 참된 하나님이 아니라 거짓 신들을 가리키므로, 직역에 가까운 ‘신들’을 택했고, 해석적 완화인 ‘우상들’은 뒤의 설명으로 충분히 드러납니다.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  english_pob_choice: the work of human hands
  chosen_korean: 사람의 손이 만든
  alternatives_korean:
  - 인간의 손으로 만든
  - 사람 손의 작품인
  lexicon: HALOT
  rationale: ‘손의 작품’이라는 관용을 한국어로 자연스럽게 풀되, אָדָם의 일반적 의미를 반영해 ‘사람’으로 옮겼습니다.
- source_word: עֵץ וָאֶבֶן
  english_pob_choice: wood and stone
  chosen_korean: 나무와 돌인
  alternatives_korean:
  - 목재와 돌로 된
  - 나무와 돌로 만든
  lexicon: HALOT
  rationale: 재료를 가리키는 병렬 구조를 살려, 우상의 물질성이 바로 보이도록 ‘나무와 돌인’으로 붙였습니다.
- source_word: אֲשֶׁר לֹא יִרְאוּ/ן וְלֹא יִשְׁמְעוּ/ן וְלֹא יֹאכְלוּ/ן וְלֹא יְרִיחֻ/ן
  english_pob_choice: which cannot see or hear or eat or smell
  chosen_korean: 보지도 듣지도 먹지도 냄새 맡지도 못하는
  alternatives_korean:
  - 보지도 듣지도 먹지도 냄새 맡지도 않는
  - 볼 수도 듣을 수도 먹을 수도 냄새 맡을 수도 없는
  lexicon: HALOT
  rationale: 연속된 부정문을 한국어의 대응 구조로 유지해, 우상의 무능력을 강조하는 히브리어의 폴레믹을 살렸습니다.
theological_decisions:
- issue: 지정사 없이 이어지는 열거 구조와 우상 비판의 강도
  chosen_reading: ‘신들’ 뒤에 바로 ‘사람의 손이 만든 나무와 돌인’이라는 동격을 붙여, 우상 숭배의 대상이 실제로는 인간 제작물이라는 대조를 분명히 드러냈습니다.
  alternative_readings:
  - ‘우상들’로 의역해 해석을 앞세우는 방식
  - ‘신들, 곧 사람 손으로 만든 것들’로 더 풀어 쓰는 방식
  rationale: 본문의 논지는 ‘신’으로 불리는 것들이 실제로는 인간이 만든 물질적 물건이라는 역설에 있으므로, 해석을 약화시키지 않고 동격 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 우상 비판 본문 번역 원칙; source-direct polemic preservation
