  source_fidelity: 개정이 필요합니다. 초안의 ‘도망하여 살게 하려고 하셨습니다’는 앞절의 하나님의 행위를 보충하여 목적을 표현하려는 의도는 이해되지만, 본절의 ‘도망하여 … 살다’라는 동사 연쇄를 ‘살게 하다’로 바꾸고 주어를 명시적으로 보충합니다. 또한 ‘지식 없이, 곧 의도치 않게’는 본문의 표현과 해석을 본문 안에서 중복시키므로, 직역적 표현은 본문에 두고 법적 함의는 각주로 처리하는 것이 더 충실합니다.
  naturalness: ‘알지 못하고’와 ‘이전부터 그를 미워하지 않았던 사람이’는 현대 표준어에서 자연스럽고, 법률적 문맥에도 맞습니다. 각주 표지는 해당 표현 바로 뒤에 두어 참조 대상이 분명하도록 조정했습니다.
  terminology: רוֹצֵחַ는 이 문맥에서 유죄가 확정된 ‘살인자’가 아니라 사람의 죽음을 초래한 이를 가리키므로 ‘사람을 죽인 자’를 유지했습니다. בִּבְלִי דַעַת는 ‘알지 못하고’로 옮기고, 비의도적 죽임이라는 문맥적 의미를 각주에서 설명했습니다. מִתְּמֹל שִׁלְשֹׁם의 관용적 의미는 ‘이전부터’로 유지했습니다.
