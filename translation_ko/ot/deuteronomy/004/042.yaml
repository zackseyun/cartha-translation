  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
  footnotes:
  - marker: a
    text: Literally, 'without knowledge'; in this legal context, the sense is that the killing was unwitting or unintentional.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from yesterday or the day before,' an idiom meaning 'previously' or 'formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 죽인 자가 알지 못하고[a] 자기 이웃을 죽였으며, 이전부터[b] 그를 미워하지 않았던 사람이 이 성읍들 가운데 하나로 도망하여 살 수 있도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지식 없이’입니다. 이 법적 문맥에서는 우발적·비의도적 죽임이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어제나 그제부터’입니다. 여기서는 ‘이전부터’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
