  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
  footnotes:
  - marker: a
    text: Literally, 'without knowledge'; in this legal context, the sense is that the killing was unwitting or unintentional.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from yesterday or the day before,' an idiom meaning 'previously' or 'formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 죽인 자가 — 지식 없이, 곧 의도치 않게 — 자기 이웃을 죽였고 이전부터 그를 미워하지 않았던 경우, 그가 그 성읍들 가운데 하나로 도망하여 살게 하려고 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지식 없이’입니다. 이 법적 문맥에서는 우발적·비의도적 살해라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어제나 그제부터’입니다. 여기서는 ‘이전부터’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֵחַ
  english_pob_choice: manslayer
  chosen_korean: 사람을 죽인 자
  alternatives_korean:
  - 살인자
  - 살해한 자
  - 죽인 자
  lexicon: HALOT
  rationale: 이 문맥은 피난성 규정이므로 죄책이 확정된 ‘살인자’보다 사실상 사람의 죽음을 초래한 자를 넓게 가리키는 표현이 적절합니다.
- source_word: בִּבְלִי דַעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이, 곧 의도치 않게
  alternatives_korean:
  - 알지 못하고
  - 무지하게
  - 의도 없이
  lexicon: HALOT
  rationale: 직역하면 ‘지식 없이’이지만, 법적 맥락에서는 우발성과 비의도성이 핵심이므로 본문 안에서 두 뉘앙스를 함께 드러냈습니다.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  english_pob_choice: previously
  chosen_korean: 이전부터
  alternatives_korean:
  - 어제나 그제부터
  - 옛적부터
  - 전에
  lexicon: HALOT
  rationale: 관용구의 문자적 의미를 주해적으로 살리되, 한국어 본문에서는 관계의 지속 부재를 간결하게 드러내는 ‘이전부터’가 가장 자연스럽습니다.
- source_word: וָחָי
  english_pob_choice: and live
  chosen_korean: 살게 하려고 하셨습니다
  alternatives_korean:
  - 그리고 살게 하려
  - 살도록 하려고
  - 살고
  - 살게 하여
  lexicon: HALOT
  rationale: 문맥상 결과가 아니라 목적을 나타내는 절로 읽히므로, 피난성 제도의 목적을 분명히 드러내는 종결 표현을 택했습니다.
theological_decisions:
- issue: 피난성 규정의 목적을 어떻게 옮길 것인가
  chosen_reading: 도망하여 살게 하려고 하셨습니다
  alternative_readings:
  - 도망하여 살게 하려는 것입니다
  - 도망하여 살아남게 하려는 것입니다
  rationale: 본문은 고의 살인이 아닌 경우 생명을 보존하기 위한 법적 보호 장치를 말하므로, 단순 이동이 아니라 생명 보존이라는 목적을 분명히 해야 합니다.
  doctrine_reference: 민수기 35장과 신명기 19장의 피난성 규정
