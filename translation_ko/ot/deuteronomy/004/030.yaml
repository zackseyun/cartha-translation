base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
  footnotes:
  - marker: a
    text: Or 'in future days.' The Hebrew phrase 'in the latter days' can refer broadly to a future time and need not be restricted to a specific end-times scheme.
    reason: alternative_reading
  - marker: b
    text: '''Listen to his voice'' can also be rendered ''obey his voice,'' since the Hebrew expression often includes the sense of heeding obediently.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 환난 가운데 있을 때, 이 모든 일이 당신에게 닥치면, 마지막 날들에[a] 당신은 야훼 당신의 하나님께 돌아와 그의 음성을 들을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미래의 날들에’. 히브리어 표현 ‘마지막 날들’은 넓게는 장차 올 시기를 가리킬 수 있으며, 특정한 종말 도식으로만 제한할 필요는 없습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 음성을 듣다’는 문맥에 따라 ‘그의 음성에 순종하다’로도 옮길 수 있습니다. 히브리어는 종종 들음 속에 순종의 의미를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר
  english_pob_choice: when you are in distress
  chosen_korean: 환난 가운데 있을 때
  alternatives_korean:
  - 고통 가운데 있을 때
  - 곤경에 처할 때
  - 환난 중에
  lexicon: HALOT
  rationale: בַּצַּר는 곤경·환난의 상태를 가리키므로, 시간 부사처럼 자연스럽게 풀어 ‘~있을 때’로 옮기되 ‘환난’으로 긴박한 의미를 살렸습니다.
- source_word: וּמְצָאֻךָ
  english_pob_choice: come upon you
  chosen_korean: 닥치고
  alternatives_korean:
  - 찾아오고
  - 덮치고
  - 임하고
  lexicon: HALOT
  rationale: 재앙들이 주어처럼 사람에게 이르는 문맥이므로 단순한 ‘찾다’보다 ‘닥치다/임하다’가 원문의 상황적 힘을 더 잘 드러냅니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말세에
  - 후일에
  - 마지막 때에
  lexicon: HALOT
  rationale: 이 표현은 미래의 시기를 가리키되 특정 종말 체계로 제한하지 않으므로, 직역적이면서도 한국어로 자연스러운 ‘마지막 날들에’를 택했습니다.
- source_word: וְשַׁבְתָּ עַד יְהוָה אֱלֹהֶיךָ
  english_pob_choice: you will return to Yahweh your God
  chosen_korean: 너희는 야훼 너희 하나님께 돌아와
  alternatives_korean:
  - 너희는 야훼 너희 하나님께로 돌아가
  - 너희는 주 너희 하나님께 돌아와
  - 너희는 회개하여 야훼 너희 하나님께 돌아와
  lexicon: HALOT
  rationale: שׁוּב עַד는 관계적·언약적 ‘돌아감’을 뜻하므로 ‘회개하다’를 덧붙이지 않고 ‘돌아오다’로 유지했고, 이름은 원문의 여호와 대체어 대신 본 프로젝트 기본값인 ‘야훼’를 썼습니다.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  english_pob_choice: listen to his voice
  chosen_korean: 그의 음성을 들을 것입니다
  alternatives_korean:
  - 그의 음성에 귀를 기울일 것입니다
  - 그의 음성에 순종할 것입니다
  - 그의 목소리를 들을 것입니다
  lexicon: HALOT
  rationale: שׁמע בְּקוֹל은 ‘듣다’와 ‘순종하다’의 중첩 의미를 지니므로, 본문은 먼저 청각적 이미지를 살린 ‘음성을 듣다’로 옮기고 순종의 함의는 문맥에 남겨 두었습니다.
theological_decisions:
- issue: ‘latter days’의 종말론적 범위
  chosen_reading: ‘마지막 날들’은 미래의 시기를 가리키되 특정 종말 도식으로 고정하지 않습니다.
  alternative_readings:
