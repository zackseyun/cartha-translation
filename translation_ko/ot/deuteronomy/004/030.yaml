  rationale: 히브리어 관용구의 열린 시간성을 보존하여, 본문이 말하는 회복의 시점을 종말론적으로 과잉해석하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
- issue: ‘return to Yahweh your God’의 회개 표현 여부
  chosen_reading: 언약적 ‘돌아옴’을 유지하고 ‘회개하다’를 명시하지 않았습니다.
  alternative_readings:
  - 회개하여 돌아오다
