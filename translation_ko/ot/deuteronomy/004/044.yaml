lexical_decisions:
- source_word: וְזֹאת
  english_pob_choice: And this is
  chosen_korean: 그리고 이것이
  alternatives_korean:
  - 이것이
  - 자, 이것이
  lexicon: HALOT
  rationale: 접속사와 지시어의 결합을 살려 새 단락을 여는 도입감을 유지하되, 한국어에서는 자연스럽게 '그리고 이것이'로 옮겼습니다.
- source_word: הַתּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  - 가르침
  lexicon: HALOT
  rationale: 신명기 문맥에서 모세가 제시한 언약적 규범을 가리키므로, 프로젝트 기본어인 '율법'이 가장 적절합니다.
- source_word: שָׂם ... לִפְנֵי
  english_pob_choice: set before
  chosen_korean: 앞에 둔
  alternatives_korean:
  - 앞에 놓은
  - 제시한
  - 보여준
  lexicon: HALOT
  rationale: שׂוּם의 '두다/놓다'와 לִפְנֵי의 '앞에'를 함께 살려, 백성 앞에 공적으로 제시한 의미를 간결하게 표현했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 그대로 반영하면서도 한국어 성경에서 널리 통용되는 집합명사 표현을 유지했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성별-정확성 유지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 자손들
  rationale: 원문은 관습적 민족 표지이지만 남성 복수 형태를 지니므로, 이를 중화하지 않고 보존했습니다.
