    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 오늘 알며, 이것을 마음에 새기십시오. 야훼는 하늘 위의 하나님이시며 땅 아래의 이 땅에서도 하나님이시니, 다른 이가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘마음으로 돌려보내다/되돌리다’는 관용구로, 단순 기억이 아니라 내면의 수용과 인정의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘다른 이가 없습니다’는 더 형식적으로는 ‘그 외에는 없습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: know
  chosen_korean: 알며
  alternatives_korean:
