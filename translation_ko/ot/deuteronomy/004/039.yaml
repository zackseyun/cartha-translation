  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
  footnotes:
  - marker: a
    text: 'Hebrew: ''bring it back to your heart'' or ''lay it to heart,'' an idiom for inwardly acknowledging and embracing what is true.'
    reason: lexical_alternative
  - marker: b
    text: Or, more formally, 'there is none else.'
    reason: alternative_reading
translation:
  language: ko
  text: 오늘 야훼께서 위로는 하늘에서, 아래로는 땅에서 하나님이심을 아시고, 그것을 마음에 되새기십시오.[a] 그 밖에는 다른 이가 없습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그것을 당신의 마음으로 되돌리다’입니다. 이는 참된 사실을 마음속으로 인정하고 받아들이라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 형식적으로, ‘그 외에는 없습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: know
  chosen_korean: 알며
  alternatives_korean:
  - 알고
  - 알아
  lexicon: HALOT
  rationale: 문맥상 단순 지식이 아니라 지금 그 사실을 분명히 인식하라는 권고이므로, 합쇼체 흐름 속에서 명령적 뉘앙스를 살린 ‘알며’로 옮겼습니다.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  english_pob_choice: take it to your heart
  chosen_korean: 이것을 마음에 새기십시오
  alternatives_korean:
  - 마음에 되돌리십시오
  - 마음에 가져오십시오
  - 마음에 두십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 외적 정보가 아니라 내면화이므로, 직역보다 ‘마음에 새기다’로 그 의미를 자연스럽게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 살리기 위해 신명기학적 기본값인 ‘야훼’를 사용했습니다. ‘주’는 호칭으로 바뀌어 이름의 직접성이 약해집니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 그 하나님
  lexicon: HALOT
  rationale: 한국어 성경의 표준 신칭을 따르되, 원문의 정관사 포함 표현이 야훼의 유일한 참 하나님 되심을 드러내므로 ‘하나님이시며’로 옮겼습니다.
- source_word: אֵין עוֹד
  english_pob_choice: there is no other
  chosen_korean: 다른 이가 없습니다
  alternatives_korean:
  - 다른 신이 없습니다
  - 그 외에는 없습니다
  - 다른 이가 없으십니다
  lexicon: HALOT
  rationale: 본문의 절대적 배타성을 살리면서도 한국어에서 자연스러운 종결로 정리했습니다. ‘다른 신’은 해석을 덧붙일 수 있어 더 일반적인 ‘다른 이’로 두었습니다.
theological_decisions:
- issue: 하늘과 땅을 포괄하는 하나님의 주권 표현
  chosen_reading: 야훼는 하늘 위와 땅 아래에 계신 하나님이십니다
  alternative_readings:
  - 하늘과 땅의 하나님이십니다
  - 하늘에서도 땅에서도 하나님이십니다
  rationale: 원문의 대비 구조(‘위/아래’)와 우주적 전권을 보존하려고 공간적 범위를 분명히 했습니다.
  doctrine_reference: Translation philosophy §3; monotheistic exclusivity in Deut 4:39
- issue: 완전한 독점적 진술인 אֵין עוֹד
  chosen_reading: 다른 이가 없습니다
  alternative_readings:
  - 그 외에는 없습니다
  - 다른 이가 없으십니다
  rationale: 본문은 여호와의 유일성을 선언할 뿐, 추가 교리적 설명을 붙이지 않습니다. 따라서 단정적이고 간결한 배타 진술로 유지했습니다.
  doctrine_reference: DOCTRINE.md Affirmations; source text exclusivity
