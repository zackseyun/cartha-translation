  rationale: 원문에 없는 ‘그러므로’를 삭제하고, ‘하늘 위/땅 아래’의 병행을 ‘위로는 하늘에서, 아래로는 땅에서’로 바로잡았습니다. 두 권면 동사는 현대 표준어 합쇼체에 맞게 ‘아시고 … 되새기십시오’로 옮겼습니다. 각주 a는 וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ의 관용적 의미를 설명하며 해당 표현 뒤에, 각주 b는 אֵין עוֹד의 대안 표현을 설명하며 절 끝에 배치했습니다.
