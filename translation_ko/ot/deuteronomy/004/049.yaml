translation:
  language: ko
  text: 그리고 요단 동쪽의 모든 아라바와, 아라바 바다, 곧 비스가 산기슭 아래까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 일반적으로 ‘사해’로 알려진 물입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָל / הָעֲרָבָה
  english_pob_choice: and all the Arabah
  chosen_korean: 그리고 …의 모든 아라바
  alternatives_korean:
  - 그리고 …의 모든 평원
  - 그리고 …의 모든 광야 평원
  lexicon: HALOT
  rationale: הָעֲרָבָה는 단순한 ‘평원’보다 지리적 고유명사 ‘아라바’로 옮기는 것이 문맥의 지역명을 더 정확히 보존합니다.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  english_pob_choice: beyond the Jordan eastward
  chosen_korean: 요단 동쪽
  alternatives_korean:
  - 요단을 건너 동쪽으로
  - 요단 건너편 동쪽
  lexicon: HALOT
  rationale: ‘요단 동쪽’은 ‘요단을 넘어/건너편’이라는 관계를 현대 한국어로 자연스럽게 압축하면서, מִזְרָחָה의 동쪽 방향을 분명히 드러냅니다.
- source_word: יָם הָעֲרָבָה
  english_pob_choice: the Sea of the Arabah
  chosen_korean: 아라바 바다
  alternatives_korean:
  - 아라바의 바다
  - 아라바 해
  lexicon: HALOT
  rationale: 히브리어의 직접 표지를 살려 직역하되, 통용되는 ‘사해’로 대체하지 않고 원문 표현을 유지했습니다.
- source_word: אַשְׁדֹּת הַפִּסְגָּה
  english_pob_choice: the slopes of Pisgah
  chosen_korean: 비스가 산기슭
  alternatives_korean:
  - 비스가의 비탈
  - 비스가의 경사면
  lexicon: HALOT
  rationale: אַשְׁדֹּת은 지형상 ‘경사면/기슭’의 뜻이므로, ‘산기슭’이 현대 한국어에서 가장 자연스럽고 지리적 의미를 잘 전달합니다.
theological_decisions:
- issue: 지명 ‘아라바 바다’의 번역 유지 여부
  chosen_reading: 원문 지리명 그대로 ‘아라바 바다’로 유지합니다.
  alternative_readings:
  - ‘사해’로 식별하여 번역
  - ‘아라바의 바다’로 풀이
  rationale: 본문은 지리적 경계를 열거하는 문맥이므로, 후대의 통용 명칭으로 바꾸기보다 원문 지시를 보존하는 편이 주석 가능한 읽기를 지킵니다.
  doctrine_reference: 본문 해석의 지리적·역사적 정확성
- issue: ‘비교 대상 없이 아래/아래쪽’의 공간 표현
  chosen_reading: ‘…산기슭 아래까지’로 공간 관계를 그대로 살립니다.
  alternative_readings:
  - ‘…산기슭 아래편에’
  - ‘…산기슭 남쪽에’
  rationale: תַּחַת의 기본 공간 관계를 완화하지 않고, 지형 묘사로서의 직설성을 유지합니다.
  doctrine_reference: 본문의 지리 묘사 보존
