  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
  footnotes:
  - marker: a
    text: Or 'his offspring after him.' The Hebrew uses singular suffixes, likely treating 'your fathers' as a collective.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by his face' or 'before him'; the phrase here conveys God's own presence in bringing Israel out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이는 그분이 여러분의 조상들을 사랑하시고 그들 뒤의 그들의 자손을 택하셨기 때문입니다[a]. 그분은 자신의 임재[b]와 그분의 큰 능력으로 여러분을 이집트에서 이끌어 내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 뒤의 그의 자손.’ 히브리어는 단수 접미사를 사용하여, 여기서 ‘조상들’을 집합적으로 보는 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 얼굴로’ 또는 ‘그 앞에서’입니다. 여기서는 하나님 자신의 임재가 출애굽을 이루셨다는 뜻으로 이해됩니다.
    reason: lexical_alternative
