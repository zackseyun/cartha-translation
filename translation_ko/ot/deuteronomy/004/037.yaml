  terminology: ‘조상들’, ‘자손’, ‘택하셨습니다’, ‘임재’, ‘큰 능력’, ‘이집트에서 이끌어 내셨습니다’는 문맥과 현대 합쇼체에 적절합니다. 각주에서는 히브리어 접미사가 단수라는 형태적 사실과 집합적 선행사의 가능성을 분명히 밝혔습니다.
