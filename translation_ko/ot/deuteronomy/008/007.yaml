  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
  footnotes:
  - marker: a
    text: Or 'a land of watercourses'; the Hebrew term can refer to streams, torrents, or wadis.
    reason: lexical_alternative
  - marker: b
    text: Or 'deep waters'; the Hebrew may refer to subterranean waters or watery depths.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the plain and in the mountains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼, 당신의 하나님께서 당신을 좋은 땅으로, 곧 물의 시내들이 있는 땅, 샘들과 깊은 물들이 골짜기와 산지에서 흘러나오는 땅으로 인도하고 계시기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물줄기들의 땅’; 히브리어는 시내, 급류, 와디를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊은 물들’; 히브리어는 지하수나 물의 깊이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘평야와 산지에서’.
    reason: lexical_alternative
