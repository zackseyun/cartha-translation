  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'obey the LORD your God.' The Hebrew idiom is literally 'listen to the voice of the LORD your God' and often carries the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 여러분 앞에서 멸망시키시는 민족들처럼, 여러분도 반드시 멸망할 것입니다. 이는 여러분이 여호와 여러분의 하나님의 말씀에 귀를 기울이지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀에 귀를 기울이지 않다’는 히브리어 관용구 ‘목소리에 듣다’의 자연스러운 한국어 표현으로, 청종과 순종의 뜻을 함께 담습니다.
    reason: source_note
lexical_decisions:
- source_word: כַּגּוֹיִם
  english_pob_choice: Like the nations
  chosen_korean: 그 민족들처럼
  alternatives_korean:
  - 그 나라들처럼
  - 열국처럼
  lexicon: HALOT
  rationale: 가나안 땅의 이방 민족들을 가리키므로 한국어로는 자연스럽고 문맥에 맞는 ‘그 민족들’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 인명형 신명은 한국어 성경에서 통용되는 형태인 ‘여호와’로 옮겼습니다. 이 항목은 프로젝트 기본값인 ‘야훼’와의 차이를 보여 주는 번역 관행상 선택입니다.
- source_word: תֹאבֵדוּן
  english_pob_choice: you will perish
  chosen_korean: 반드시 멸망할 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 사라질 것입니다
  lexicon: HALOT
  rationale: אבד의 결과를 강하게 경고하는 문맥이므로, 미래 예고를 약화시키지 않도록 ‘반드시’를 보탰고 ‘멸망하다’로 동일 어근의 파괴성을 살렸습니다.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  english_pob_choice: you did not listen to the voice of Yahweh your God
  chosen_korean: 여호와 여러분의 하나님의 말씀에 귀를 기울이지 않았기 때문입니다
  alternatives_korean:
  - 여호와 여러분의 하나님의 음성에 귀를 기울이지 않았기 때문입니다
  - 여호와 여러분의 하나님의 말씀을 듣지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 직역하면 ‘소리에/목소리에 듣다’이지만 한국어에서는 ‘말씀에 귀를 기울이다’가 자연스러우면서도 청종의 의미를 보존합니다.
theological_decisions:
- issue: שׁמע בְּקוֹל의 관용구를 ‘듣다’와 ‘순종하다’ 중 어떻게 살릴지
  chosen_reading: ‘말씀에 귀를 기울이지 않다’로 옮겨 청종과 순종의 긴장을 함께 보존했습니다.
  alternative_readings:
  - ‘순종하지 않다’
  - ‘말씀을 듣지 않다’
  rationale: 본문은 단순 청각이 아니라 언약적 청종을 요구하므로, 의미를 지나치게 풀어 ‘순종하다’로만 고정하지 않고 한국어 관용 표현으로 원문 구조를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it; optimal equivalence'
