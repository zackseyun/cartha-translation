source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
  footnotes:
  - marker: a
    text: Or 'And you shall keep'; the Hebrew conjunction can be read as simple coordination, though here it likely carries an inferential sense from the preceding context.
    reason: lexical_alternative
  - marker: b
    text: '''Fearing him'' carries the sense of reverent fear before God; alternatively, ''revering him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너는 야훼, 네 하나님[a]의 명령들을 지키고, 그의 길을 따라 걸으며 그를 경외해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘야훼’는 히브리어 고유 이름 יְהוָה를 옮긴 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  english_pob_choice: So you shall keep
  chosen_korean: 그러므로 너희는 … 지켜야 합니다
  alternatives_korean:
  - 그리고 너희는 … 지켜야 합니다
  - 너희는 … 지켜야 합니다
  lexicon: HALOT
  rationale: 문맥상 앞절로부터의 추론을 살려 ‘그러므로’로 옮기고, מִצְוֺת과 결합한 שׁמר는 언약적 의미의 ‘지키다’가 가장 자연스럽습니다.
- source_word: מִצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  lexicon: HALOT
  rationale: 기존 교회어 ‘계명들’도 가능하지만, 여기서는 여러 조항을 가리키는 복수형의 직접적 의미를 살려 ‘명령들’로 옮겼습니다.
- source_word: בִּדְרָכָיו
  english_pob_choice: in his ways
  chosen_korean: 그의 길을 따라
  alternatives_korean:
  - 그의 길 안에서
  - 그의 길대로
  lexicon: HALOT
  rationale: 히브리어 ‘길’은 단순한 공간적 길보다 하나님의 행하시는 방식과 규범을 가리키므로, 한국어에서는 행위의 준거를 드러내는 ‘…을 따라’가 적절합니다.
- source_word: וּלְיִרְאָה אֹתוֹ
  english_pob_choice: and by fearing him
  chosen_korean: 그를 경외해야 합니다
  alternatives_korean:
  - 그를 두려워해야 합니다
  - 그를 경외함으로
  lexicon: HALOT
  rationale: ירא의 핵심은 단순한 존중이 아니라 경외적 두려움이므로, 의미를 약화시키지 않기 위해 ‘경외하다’를 선택했습니다. 동사형으로 문장 흐름도 자연스럽게 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 신명기 본문에서는 여호와 대체어보다 고유 이름의 음역인 ‘야훼’를 사용해 하나님의 언약 이름을 보존합니다.
theological_decisions:
- issue: ‘경외’의 의미 보존
  chosen_reading: 그를 경외해야 합니다
  alternative_readings:
  - 그를 공경해야 합니다
  - 그를 존중해야 합니다
  rationale: 본문의 ירא는 단순한 예의나 존중을 넘어 하나님 앞에서의 경외적 두려움을 포함하므로, 그 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아니라 고유한 언약 이름을 직접 사용하므로, 번역에서도 그 이름을 드러내는 표기가 요구됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
