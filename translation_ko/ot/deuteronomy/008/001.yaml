reference: Deuteronomy 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
  footnotes:
  - marker: a
    text: Or 'the whole commandment.' The Hebrew uses a singular collective expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'inherit.' The Hebrew verb can carry the sense of inheriting or taking possession, depending on context.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'your fathers,' referring to Israel's forefathers/patriarchs.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내가 너희에게 명령하는 모든 계명[a]을 너희는 지켜 행해야 합니다. 그래야 너희가 살고 번성하며, 야훼[c]께서 너희 아버지들에게 맹세하신 땅에 들어가 차지하게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 계명’은 히브리어의 단수 집합 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘차지하다’는 히브리어 동사가 문맥에 따라 ‘상속받다’ 또는 ‘점유하다’를 뜻할 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 신명 יהוה의 고유명을 반영한 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  english_pob_choice: every commandment
  chosen_korean: 모든 계명
  alternatives_korean:
  - 온 계명
  - 계명 전체
  lexicon: HALOT
  rationale: 히브리어의 단수 집합 표현을 한국어에서는 자연스럽게 복수 총칭인 ‘모든 계명’으로 옮겨, 전체성을 살리되 어색한 직역을 피했습니다.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  english_pob_choice: you shall carefully keep ... to do
  chosen_korean: 지켜 행해야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 주의 깊게 지켜 행해야 합니다
  lexicon: HALOT
  rationale: ‘지키다’와 ‘행하다’의 결합이 언약적 순종의 의미를 가장 직접적으로 드러내므로, 영어 POB의 ‘carefully keep’과 ‘to do’를 합쳐 한국어의 자연스러운 순종 표현으로 옮겼습니다.
- source_word: וּרְבִיתֶם
  english_pob_choice: and multiply
  chosen_korean: 번성하고
  alternatives_korean:
  - 증가하고
  - 많아지고
  lexicon: HALOT
  rationale: 출애굽기·신명기 문맥의 언약적 번성 표현을 살려 ‘번성하다’로 옮겼습니다.
- source_word: וִירִשְׁתֶּם אֶת הָאָרֶץ
  english_pob_choice: and possess the land
  chosen_korean: 그 땅에 들어가 차지하게 될 것입니다
  alternatives_korean:
  - 그 땅을 차지하게 될 것입니다
  - 그 땅을 상속받게 될 것입니다
  lexicon: HALOT
  rationale: ירשׁ는 여기서 단순한 상속보다 약속의 땅을 실제로 점유·차지하는 의미가 강하므로, ‘들어가 차지하다’로 풀어 원문의 결과 동작을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대신 신명기 원문의 고유명사 발음을 반영하는 ‘야훼’를 사용해, POB의 요지와 맞추어 하나님의 이름을 직역했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용한 언약적 신명은 호칭으로 대체하지 않고 고유명사로 살려야 하므로 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֲבֹתֵיכֶם의 성별 표기
  chosen_reading: 너희 조상들
  alternative_readings:
  - 너희 아버지들
  - 너희 선조들
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 한국어 성경 문맥에서는 족장들을 가리키는 집합적 의미가 분명하므로 의미를 해치지 않는 범위에서 ‘조상들’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
