  text: וְ/אָכַלְתָּ֖ וְ/שָׂבָ֑עְתָּ וּ/בֵֽרַכְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל הָ/אָ֥רֶץ הַ/טֹּבָ֖ה אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
  footnotes:
  - marker: a
    text: Or 'thank' or 'praise' the LORD your God; the Hebrew says 'bless,' preserving the biblical idiom for speaking well of God in gratitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 먹고 만족하게 되면, 야훼 당신의 하나님을 그분이 당신에게 주신 좋은 땅 때문에 찬양하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬양하십시오’는 히브리어 ברך의 관용적 의미를 살린 번역입니다. 문자적으로는 ‘축복하다’이지만, 하나님을 대상으로 할 때는 ‘찬양하다/감사하다’의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַלְתָּ
  english_pob_choice: you shall eat
  chosen_korean: 먹고
  alternatives_korean:
  - 먹으십시오
  - 먹게 되면
  lexicon: WLC + HALOT
  rationale: 문맥상 권면·예고의 연쇄를 이루므로 한국어에서는 자연스럽게 동사 연결형으로 처리해, 다음 절차로 이어지는 흐름을 살렸습니다.
- source_word: וְ/שָׂבָעְתָּ
  english_pob_choice: be satisfied
  chosen_korean: 만족하게 되면
  alternatives_korean:
  - 배부르게 되면
  - 충분히 먹으면
  lexicon: HALOT
  rationale: 히브리어는 단순한 포만뿐 아니라 흡족함까지 포함하므로, 물리적 ‘배부름’보다 의미 범위를 넓게 드러내는 표현을 택했습니다.
- source_word: וּ/בֵרַכְתָּ אֶת יְהוָה
  english_pob_choice: you shall bless Yahweh
  chosen_korean: 야훼 당신의 하나님을 ... 찬양하십시오
  alternatives_korean:
  - 야훼 당신의 하나님을 ... 축복하십시오
  - 야훼 당신의 하나님을 ... 감사하십시오
  lexicon: HALOT
  rationale: 브라크를 하나님께 대한 관용적 용례로 살리되, 한국어에서는 ‘축복하다’가 어색하고 ‘감사하다’는 의미를 좁히므로, ‘찬양하다’로 옮겨 말 잘함의 종교적 관용어를 전달했습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 그대의 하나님
  lexicon: HALOT
  rationale: 합쇼체 본문과 맞추어 2인칭 인칭대명사를 ‘당신’으로 처리하여 예배적·공적 문체를 유지했습니다.
- source_word: הָ/אָ֥רֶץ הַ/טֹּבָה
  english_pob_choice: the good land
  chosen_korean: 그분이 당신에게 주신 좋은 땅
  alternatives_korean:
  - 좋은 땅
  - 복된 땅
  lexicon: HALOT
  rationale: 문맥상 ‘좋은’은 추상적 평판이 아니라 하나님이 주신 언약의 땅을 가리키므로, 뒤 절의 수여 행위를 함께 드러내는 구조로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기 이름을 그대로 드러내기 위해 전통 대체어 대신 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ברך의 한국어 대응
  chosen_reading: 찬양하십시오
  alternative_readings:
  - 감사하십시오
  - 축복하십시오
  rationale: 하나님을 대상으로 한 ברך의 관용적 의미를 한국어에서 가장 자연스럽게 드러내면서도, ‘감사’로만 축소하지 않기 위해 ‘찬양하다’를 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
