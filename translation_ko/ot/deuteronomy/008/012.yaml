  lexicon: HALOT
  rationale: 경고를 여는 פֶּן의 금지·예방 의미를 한국어로 자연스럽게 살리되, 문맥상 직설적 경계로 들리도록 했습니다.
- source_word: תֹּאכַל וְשָׂבָעְתָּ
  english_pob_choice: when you have eaten and are satisfied
  chosen_korean: 네가 먹어 만족하고
  alternatives_korean:
  - 먹어 배부르고
  - 먹고 흡족해지고
  - 먹어 배가 부르고
  lexicon: HALOT
  rationale: שׂבע의 핵심은 단순히 배가 부른 상태보다 ‘만족/충족’이어서, 음식 섭취 뒤의 충만함을 현대적이고 과도하지 않게 표현했습니다.
- source_word: וּבָתִּים טוֹבִים
  english_pob_choice: good houses
  chosen_korean: 좋은 집들을
