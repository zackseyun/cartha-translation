    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: 그렇지 않도록 하십시오
  alternatives_korean:
  - 그렇지 않게
  - 아니면
  - 그렇게 되지 않도록
  lexicon: HALOT
  rationale: 경고를 여는 פֶּן의 금지·예방 의미를 한국어로 자연스럽게 살리되, 문맥상 직설적 경계로 들리도록 했습니다.
- source_word: תֹּאכַל וְשָׂבָעְתָּ
  english_pob_choice: when you have eaten and are satisfied
  chosen_korean: 네가 먹어 만족하고
  alternatives_korean:
  - 먹어 배부르고
  - 먹고 흡족해지고
  - 먹어 배가 부르고
  lexicon: HALOT
  rationale: שׂבע의 핵심은 단순히 배가 부른 상태보다 ‘만족/충족’이어서, 음식 섭취 뒤의 충만함을 현대적이고 과도하지 않게 표현했습니다.
- source_word: וּבָתִּים טוֹבִים
  english_pob_choice: good houses
  chosen_korean: 좋은 집들을
  alternatives_korean:
  - 아름다운 집들을
  - 훌륭한 집들을
  - 좋은 집들
  lexicon: HALOT
  rationale: טוֹבִים의 기본 의미인 ‘좋은’을 유지해 과도한 미화 없이 번영의 맥락을 드러냈습니다.
- source_word: וְיָשָׁבְתָּ
  english_pob_choice: and lived in them
  chosen_korean: 그 안에 살게 되면
  alternatives_korean:
  - 그 안에 거주하게 되면
  - 그 안에 살면
  - 그 안에 머물게 되면
  lexicon: HALOT
  rationale: ישׁב는 ‘살다/거주하다’이므로, 집을 목적어로 한 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 경고문 시작의 억제적 뉘앙스
  chosen_reading: 직접적인 금지/예방형 표현으로 옮겨, 뒤이어 오는 언약적 경고의 힘을 보존했습니다.
  alternative_readings:
  - ‘만일…’처럼 중립적 조건문으로 완화
  - ‘혹시…’처럼 가능성만 제시
  rationale: פֶּן은 단순 조건이 아니라 ‘그렇게 되지 않도록’ 하는 경고이므로, 문장의 기능을 약화시키지 않도록 했습니다.
  doctrine_reference: 언약 경고의 수사 유지
- issue: 문장 종결 처리
  chosen_reading: 본문이 미완결 연결형 구조이므로, 한국어도 쉼표로 열어 둔 채 끝냈습니다.
  alternative_readings:
  - 완결 종결어미로 문장을 마침
  - 후속절을 암시하는 별도 보충
  rationale: 이 절은 다음 경고로 이어지는 도입부이므로, 원문의 미완결성을 유지하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 구조 보존
