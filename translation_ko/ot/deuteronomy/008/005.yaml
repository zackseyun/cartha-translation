translation:
  language: ko
  text: 그러므로 마음으로 알아 두십시오. 사람이 자기 아들을 훈련하듯이 야훼 당신들의 하나님도 당신들을 훈련하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יסר는 상황에 따라 ‘훈련하다’, ‘징계하다’, ‘교정하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: So know
  chosen_korean: 그러므로 마음으로 알아 두십시오
  alternatives_korean:
  - 그리고 당신은 알아야 합니다
  - 마음으로 아십시오
  lexicon: HALOT
  rationale: 문맥상 앞선 권면에서 이어지는 결과/촉구이므로 ‘그러므로’로 자연스럽게 연결하고, 인지 동사의 권고적 힘을 살려 ‘알아 두십시오’로 옮겼습니다.
- source_word: עִם לְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 마음으로
  alternatives_korean:
  - 마음속으로
  - 당신의 마음에
  lexicon: HALOT
  rationale: 히브리어 관용구는 내면의 인식과 확신을 뜻하므로, 한국어에서는 ‘마음으로’가 가장 자연스럽고 의미를 보존합니다.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  english_pob_choice: disciplines
  chosen_korean: 훈련하십니다
  alternatives_korean:
  - 징계하십니다
  - 바르게 훈계하십니다
  - 교정하십니다
  lexicon: HALOT
  rationale: יסר는 교정, 훈계, 훈련의 뜻을 함께 가질 수 있어 단순한 형벌로 좁히지 않으면서도 형성적·교정적 의미를 살리기 위해 ‘훈련하다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 여호와 당신들의 하나님
  lexicon: HALOT
  rationale: 여기서는 언약적 하나님의 고유명 יְהוָה를 ‘야훼’로 옮기고, 복수형 어미가 암시하는 청중 전체를 반영해 ‘당신들의 하나님’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ברכת/권면의 청자 표현과 한국어 존대
  chosen_reading: 합쇼체 권면형으로 직역하되 청중 전체를 향한 복수성을 반영했습니다.
  alternative_readings:
  - 너희의 하나님
  - 당신의 하나님
  rationale: 히브리어 2인칭 남성 단수는 집합적 청중을 대표하는 경우가 많으므로, 한국어에서는 개별 지시를 넘어서 공동체 전체를 향한 권면으로 읽히도록 ‘당신들의’로 조정했습니다.
  doctrine_reference: Translation philosophy §3; Hebrew second-person singular as corporate address
