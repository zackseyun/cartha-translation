  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
  footnotes:
  - marker: a
    text: Or 'in scarcity' / 'in want' for 'in poverty.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew neḥoshet can mean 'copper' or 'bronze'; here 'copper' is preferred because the verse speaks of material quarried from the hills.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳은 가난한 형편에서[a] 빵을 먹지 않고, 그 안에서 아무것도 부족하지 않을 땅입니다. 그 땅의 돌들은 철이며, 그 산들에서는 구리를[b] 캐낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְמִסְכֵּנֻת는 ‘가난한 형편에서’ 외에 ‘궁핍 가운데서’, ‘부족함 가운데서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְחֹשֶׁת는 문맥에 따라 ‘구리’ 또는 ‘청동’을 뜻할 수 있으나, 여기서는 땅에서 캐내는 자원이라는 점에서 ‘구리’가 더 직접적입니다.
    reason: lexical_alternative
