id: DEU.8.9
reference: Deuteronomy 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
  footnotes:
  - marker: a
    text: Or 'in scarcity' / 'in want' for 'in poverty.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew neḥoshet can mean 'copper' or 'bronze'; here 'copper' is preferred because the verse speaks of material quarried from the hills.
    reason: lexical_alternative
translation:
  language: ko
  text: 먹을 때 가난함 가운데서 빵을 먹지 않을 땅, 그 안에서 아무것도 부족하지 않을 땅, 곧 그 돌들이 철인 땅이며 그 언덕들에서 네가 구리를 캐낼 땅입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가난함’ 외에도 ‘궁핍 가운데서’, ‘부족함 가운데서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְחֹשֶׁת는 문맥에 따라 ‘구리’ 또는 ‘청동’을 뜻할 수 있으나, 여기서는 땅에서 캐내는 자원이라는 점에서 ‘구리’가 더 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  english_pob_choice: in poverty
  chosen_korean: 가난함 가운데서
  alternatives_korean:
  - 궁핍 가운데서
  - 빈궁 가운데서
  - 부족함 가운데서
  lexicon: HALOT
  rationale: 히브리어는 가난, 궁핍, 결핍의 상태를 가리키므로, 현대 한국어에서 자연스럽고 상태를 분명히 드러내는 ‘가난함 가운데서’를 택했습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  - 양식
  lexicon: HALOT
  rationale: 기본 의미는 ‘빵’이며, 일상적 표준어로도 자연스럽게 전달되므로 직역성을 유지하면서 읽기 쉽게 옮겼습니다.
- source_word: תֶחְסַר כֹּל
  english_pob_choice: you will lack nothing
  chosen_korean: 아무것도 부족하지 않을
  alternatives_korean:
  - 아무것도 모자라지 않을
  - 무엇 하나 부족하지 않을
  - 전혀 부족함이 없을
  lexicon: HALOT
  rationale: 완전한 충족을 나타내는 관용구이므로, 반복을 줄이면서도 총체적 부정의 뜻이 살아 있는 표현으로 옮겼습니다.
- source_word: אֲבָנֶיהָ בַרְזֶל / נְחֹשֶׁת
  english_pob_choice: whose stones are iron / you will quarry copper
  chosen_korean: 그 돌들이 철인 땅이며 … 구리를 캐낼
  alternatives_korean:
  - 그 돌들이 철인 땅이며 … 청동을 캘
  - 그 돌들이 철로 된 땅이며 … 구리를 캐낼
  - 그 돌들에 철이 있는 땅이며 … 구리를 캐낼
  lexicon: HALOT
  rationale: ‘stones are iron’의 압축된 병치를 살려 ‘그 돌들이 철인’으로 두었고, נְחֹשֶׁת는 광물 자원으로 캐내는 맥락에 맞게 ‘구리’로 옮겼습니다.
theological_decisions:
- issue: 축복의 총체성 표현
  chosen_reading: ‘아무것도 부족하지 않을 땅’으로, 언약적 풍요와 완전한 공급의 약속을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘모자람이 없는 땅’
  - ‘아무 부족함이 없는 땅’
  rationale: 본문의 תֶחְסַר כֹּל는 단순한 경제적 넉넉함이 아니라 결핍의 부재를 총괄적으로 말하므로, 그 강도를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 신명기 8장의 언약적 공급과 하나님의 돌보심
