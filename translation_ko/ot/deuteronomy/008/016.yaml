  source_fidelity: 개정이 필요합니다. 히브리어의 2인칭 남성 단수 접미사는 이스라엘을 집합적으로 가리킬 수 있으나, 본절에서는 한국어도 단수형 ‘너’를 일관되게 사용하여 원문의 인칭·수 표현을 보존하는 편이 적절합니다. 또한 לְהֵיטִבְךָ는 문자적으로 ‘네게 좋게 하다/네가 잘되게 하다’이며, ‘복을 주다’는 뜻을 더 특정합니다.
  naturalness: 초안의 ‘너희 조상들이 알지 못하던 것을’은 관계절의 수식 대상인 ‘만나’가 뒤에 분명히 제시되지 않아 다소 어색합니다. ‘네 조상들도 알지 못했던 만나를’로 배열하면 자연스럽고 원문의 수식 관계도 명료합니다. 목적의 연쇄는 ‘…하시려는 것이었습니다’로 자연스럽게 표현할 수 있습니다.
  terminology: ‘만나’, ‘낮추시다’, ‘시험하시다’는 적절합니다. ‘조상들’은 현대 한국어에서 אֲבֹתֶיךָ의 자연스러운 번역이지만, 문자적 표현이 ‘아버지들’임을 각주로 밝혀 둘 수 있습니다. אַחֲרִיתֶךָ의 개인적·결과적 뉘앙스는 ‘마침내 네게 잘되게’와 각주로 보존합니다.
