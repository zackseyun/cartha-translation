source:
  edition: WLC
  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
  footnotes:
  - marker: a
    text: Or 'your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'afterward' or 'in your latter end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 광야에서 너희에게 만나를 먹이신 분, 곧 너희 조상들이 알지 못하던 것을, 너희를 낮추고 너희를 시험하여 마침내 너희에게 복을 주시려 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 조상들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘너희 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끝에’ 또는 ‘너희의 나중’으로도 옮길 수 있습니다. 히브리어 אַחֲרִית는 결과적 결말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  english_pob_choice: who fed you
  chosen_korean: 너희에게 만나를 먹이신 분
  alternatives_korean:
  - 너희를 먹이신 분
  - 너희에게 먹을 것을 주신 분
  lexicon: HALOT
  rationale: 히필 분사로서 ‘먹이다/먹게 하다’의 원인을 나타내므로, 하나님을 수식하는 관계절로 자연스럽게 옮겼습니다.
- source_word: מָן
  english_pob_choice: manna
  chosen_korean: 만나
  alternatives_korean:
  - 만나(광야 양식)
  lexicon: HALOT
  rationale: 광야에서 주어진 양식을 가리키는 고유한 성서 용어이므로 음역을 유지했습니다.
- source_word: עַנֹּתְךָ
  english_pob_choice: to humble you
  chosen_korean: 너희를 낮추고
  alternatives_korean:
  - 너희를 겸손하게 하고
  - 너희를 괴롭게 하고
  lexicon: HALOT
  rationale: 문맥상 단순한 고통보다 훈육적 ‘낮춤/겸손케 함’의 의미가 강하므로, 그 긴장을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: נַסֹּתֶךָ
  english_pob_choice: to test you
  chosen_korean: 너희를 시험하여
  alternatives_korean:
  - 너희를 검증하여
  - 너희를 단련하여
  lexicon: HALOT
  rationale: נסה의 대표적 의미를 따라 ‘시험하다’로 옮겼고, 앞의 목적절과 평행을 이루도록 연결했습니다.
- source_word: בְּאַחֲרִיתֶךָ
  english_pob_choice: to do you good in the end
  chosen_korean: 마침내 너희에게 복을 주시려 하셨습니다
  alternatives_korean:
  - 끝내 너희에게 잘되게 하시려 하셨습니다
  - 너희의 나중에 너희에게 좋게 하시려 하셨습니다
  lexicon: HALOT
  rationale: ‘אַחֲרִית’은 단순한 시간표현보다 최종 결과/결말을 가리키므로, ‘마침내’와 ‘복을 주시다’로 종결의 선의를 살렸습니다.
theological_decisions:
- issue: 광야의 낮춤과 시험의 목적
  chosen_reading: 하나님의 공급은 낮춤과 시험을 포함하지만, 최종 목적은 백성의 선을 향한 것입니다.
  alternative_readings:
  - 낮춤과 시험을 주된 징벌로 읽는 해석
  - 선한 목적을 약화시키고 훈련만 강조하는 해석
  rationale: 문장 말미가 결과적 선의를 분명히 하므로, 고난의 현실과 하나님의 유익 의도를 함께 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
