revisions:
- from: 광야에서 너희에게 만나를 먹이신 분, 곧 너희 조상들이 알지 못하던 것을, 너희를 낮추고 너희를 시험하여 마침내 너희에게 복을 주시려 하셨습니다.[a][b]
  to: 광야에서 네 조상들도 알지 못했던 만나를 네게 먹이신 것은 너를 낮추시고 너를 시험하셔서, 마침내 네게 잘되게 하시려는 것이었습니다.[a][b]
  rationale: 원문의 단수 수신자, 만나를 수식하는 관계절, 그리고 ‘결국 네게 좋게 하다’라는 목적을 보존하도록 고쳤습니다. ‘마침내’는 בְּאַחֲרִיתֶךָ의 결과적 시간성을 반영하되, ‘잘되게 하시다’로 לְהֵיטִבְךָ를 ‘복을 주다’보다 덜 해석적으로 옮겼습니다. 각주 a는 ‘조상들’ 뒤, 각주 b는 최종 결과 표현 뒤에 배치하는 것이 의미상 더 정확합니다.
