  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'but by everything that proceeds from the mouth of the LORD.' The Hebrew expression is broader than 'word' alone, though 'word' fits the context well.
    reason: lexical_alternative
  - marker: b
    text: '''Man'' here means humanity in general, not males only.'
    reason: cultural_note
translation:
  language: ko
  text: 그분께서 당신들을 낮추시고 굶주리게 하시며, 당신들과 당신들의 조상들이 알지 못하던 만나[a]를 먹이셨습니다. 이는 사람이 빵[b]만으로 사는 것이 아니라, 야훼의 입에서 나오는 모든 말씀으로 사람이 산다는 것을 당신들에게 알게 하시려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만나’는 광야에서 주신 식량을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 여기서 ‘사람’은 남성만이 아니라 인류 일반을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְעַנְּךָ
  english_pob_choice: he humbled you
  chosen_korean: 당신들을 낮추시고
  alternatives_korean:
  - 당신들을 괴롭게 하시고
  - 당신들을 학대하시고
  lexicon: HALOT
  rationale: ענה의 수동적 고통보다 교육적·훈련적 낮춤을 살려, 광야에서의 징계와 겸손의 의미를 드러내도록 옮겼습니다.
- source_word: וַיַּרְעִבֶךָ
  english_pob_choice: let you hunger
  chosen_korean: 굶주리게 하시며
  alternatives_korean:
  - 배고프게 하시며
  - 굶주리게 두시며
  lexicon: HALOT
  rationale: 히필의 사역성을 살리되, 한국어에서는 하나님이 허락하신 배고픔의 상태를 자연스럽게 표현하는 ‘굶주리게 하시며’가 가장 적절합니다.
- source_word: הַמָּן
  english_pob_choice: the manna
  chosen_korean: 만나
  alternatives_korean:
  - 만나
  - 그 만나
  lexicon: HALOT
  rationale: 광야 양식의 고유명사로 통용되는 ‘만나’를 유지해 본문의 역사적 지칭을 자연스럽게 살렸습니다.
- source_word: מוֹצָא פִי יְהוָה
  english_pob_choice: every word that comes from the mouth of Yahweh
  chosen_korean: 야훼의 입에서 나오는 모든 말씀
  alternatives_korean:
  - 야훼의 입에서 나오는 모든 것
  - 야훼의 입에서 나오는 모든 말
  lexicon: HALOT
  rationale: מוֹצָא의 ‘나오는 것/나옴’이라는 범위를 지키면서도, 문맥상 하나님의 말씀과 명령을 가리키므로 ‘말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: אדם의 대표적 일반화 의미를 한국어에서 어떻게 살릴지
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 남자
  rationale: 히브리어 אדם의 대표적 일반성을 드러내면서도, 문맥상 남성 한정이 아니라 인류 일반을 말한다는 점을 자연스럽게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם adam'
- issue: 사람이 ‘빵’만으로 살지 않는다는 대조 구조와 인용 가능성을 어떻게 유지할지
  chosen_reading: 빵만으로 사는 것이 아니라, … 모든 말씀으로 사람이 산다
  alternative_readings:
  - 빵만으로 살지 않고, … 말씀으로 산다
  - 빵으로만 사는 것이 아니라
  rationale: 본문의 대조와 반복 구조를 한국어에서도 분명히 보이게 하면서, 뒤따르는 정경적 인용과도 연결되도록 직역성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2; Intertextual citation to Deut 8:3
