revisions:
- from: 그분께서 당신들을 낮추시고 굶주리게 하시며, 당신들과 당신들의 조상들이 알지 못하던 만나[a]를 먹이셨습니다. 이는 사람이 빵[b]만으로 사는 것이 아니라, 야훼의 입에서 나오는 모든 말씀으로 사람이 산다는 것을 당신들에게 알게 하시려는 것이었습니다.
  to: 그분께서 너를 낮추시고 굶주리게 하시며, 너와 네 조상들이 알지 못하던 만나[a]를 먹이셨습니다. 이는 사람이[b] 빵만으로 사는 것이 아니라, 야훼의 입에서 나오는 모든 말씀으로 사람이 산다는 것을 네게 알게 하시기 위함이었습니다.
