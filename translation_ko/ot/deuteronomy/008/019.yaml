translation:
  language: ko
  text: 만일 당신이 당신의 하나님 야훼를 정녕 잊고[a] 다른 신들을 따라가 그들을 섬기며 그들에게 절한다면, 나는 오늘 여러분에게 불리하게 증언합니다. 여러분은 반드시 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘잊다’를 반복하여 강하게 강조합니다. ‘정녕 잊고’ 또는 ‘반드시 잊고’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  english_pob_choice: And if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건 경고를 자연스러운 한국어로 풀되, 서술적 연결보다 경고의 조건성을 분명히 드러내기 위해 '만일'을 택했습니다.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  english_pob_choice: you indeed forget
  chosen_korean: 반드시 … 잊고
  alternatives_korean:
  - 정말 … 잊고
  - 확실히 … 잊고
  lexicon: HALOT
  rationale: 부정사절대형의 강조를 한국어 부사보다 의무적·강조적 표현으로 살려, '반드시'로 중첩된 강조를 나타냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 언약명을 '야훼'로 옮겨, 호칭 일반화인 '주님'보다 고유한 신명성을 보존했습니다.
- source_word: וַעֲבַדְתָּם / וְהִשְׁתַּחֲוִיתָ לָהֶם
  english_pob_choice: and serve them and bow down to them
  chosen_korean: 그들을 섬기며 그들에게 절한다
  alternatives_korean:
  - 그들을 섬기며 그들 앞에 엎드린다
  - 그들에게 봉사하며 그들에게 경배한다
  lexicon: HALOT
  rationale: עבד와 השתחוה를 구별해, 첫 동사는 '섬기다'로, 둘째는 물리적·제의적 굴복을 드러내는 '절하다'로 옮겼습니다.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  english_pob_choice: I testify against you today
  chosen_korean: 나는 오늘 당신들에 대하여 증언합니다
  alternatives_korean:
  - 나는 오늘 당신들을 향해 증언합니다
  - 나는 오늘 당신들에게 경고합니다
  lexicon: HALOT
  rationale: העיד의 법정적·증언적 힘을 살려 '증언합니다'로 옮기고, בכם의 대항적 뉘앙스를 한국어 조사로 무리 없이 드러냈습니다.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  english_pob_choice: that you will surely perish
  chosen_korean: 당신들은 반드시 멸망할 것입니다
  alternatives_korean:
  - 당신들은 반드시 망할 것입니다
  - 당신들은 반드시 소멸할 것입니다
  lexicon: HALOT
  rationale: 강한 확실성을 가진 강조형을 '반드시'로 옮기고, 결과를 '멸망'으로 표현해 재난적·언약적 심판의 뉘앙스를 유지했습니다.
theological_decisions:
