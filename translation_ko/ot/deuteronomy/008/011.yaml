translation:
  language: ko
  text: 삼가 주의하여, 너희 하나님 야훼를 잊고 그분의 명령들과 그분의 규례들과 그분의 법도를 지키지 않게 되지 않도록 하십시오. 오늘 내가 너희에게 명령하는 것은 그것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘지키지 않음으로’ 그의 명령들과 그의 규례들과 그의 법도들을.
    reason: lexical_alternative
  - marker: b
    text: 하나님의 이름 יְהוָה는 이 프로젝트의 기본 원칙에 따라 ‘야훼’로 옮겼습니다. 다른 번역 관행으로는 ‘주’가 있습니다.
    reason: ot_citation
