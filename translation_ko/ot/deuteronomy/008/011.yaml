  source_fidelity: 수정이 필요합니다. 히브리어의 모든 2인칭 남성 단수 접미사(לְךָ, אֱלֹהֶיךָ, מְצַוְּךָ)를 초안이 복수형 ‘너희’로 옮겼습니다. 또한 관계절 ‘오늘 내가 너에게 명령하는’은 계명·법규·규례를 수식해야 하는데, 초안은 이를 독립 서술문으로 바꾸어 원문의 문장 구조와 의미 관계를 흐렸습니다.
  naturalness: ‘삼가 주의하여’와 ‘지키지 않게 되지 않도록’은 중복되고 부자연스럽습니다. ‘…지키지 않아 …잊는 일이 없도록 스스로 조심하십시오’는 현대 표준어 합쇼체로 경고의 힘과 인과적 표현을 자연스럽게 살립니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 유지했습니다. מִצְוֺת, מִשְׁפָּטִים, חֻקּוֹת의 구별을 ‘계명들, 법규들, 규례들’로 반영했습니다. ‘그분’은 원문에 없는 경칭적 대명사이므로 제거하고, 소유 관계는 ‘너의 하나님 야훼’ 및 ‘그의’로 명확히 했습니다.
