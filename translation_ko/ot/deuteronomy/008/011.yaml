  - 오늘 내가 너희에게 명령하는 것들입니다
  - 내가 오늘 너희에게 명령하는 것이 그것들입니다
  lexicon: HALOT
  rationale: 현재 분사의 지속성과 ‘오늘’의 긴박함을 살리되, 앞의 삼중 법규를 가리키도록 한국어 종결을 정리했습니다.
