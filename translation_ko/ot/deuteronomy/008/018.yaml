base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'to produce wealth,' 'to make wealth,' or more broadly 'to achieve success.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your fathers,' referring specifically to the covenant ancestors/patriarchs.
    reason: cultural_note
  - marker: c
    text: 'Hebrew idiom: ''as this day,'' meaning ''as is evident today'' or ''as it stands now.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 당신은 야훼 당신의 하나님을 기억해야 합니다. 그것은 그분이 당신에게 재산을 얻을 힘을 주시는 분이기 때문입니다. 이는 그분이 당신의 조상들에게 맹세하신 그분의 언약을 오늘과 같이 이루시려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘당신의 조상들’(fathers)로 되어 있으며, 족장 언약을 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘오늘과 같이’는 ‘오늘 이와 같이 보이는 대로’라는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: But you shall remember
  chosen_korean: 그러므로 당신은 …을 기억해야 합니다
  alternatives_korean:
  - 당신은 기억해야 합니다
  - 그리고 당신은 기억해야 합니다
  lexicon: WLC; discourse context from Deut 8:17-18
  rationale: 직전 절의 자기 공로 착각을 끊고 이어지는 권면이므로 인과·전환을 드러내는 ‘그러므로’를 두었고, 명령적 미래의 힘을 ‘기억해야 합니다’로 살렸습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 야훼, 당신의 하나님
  lexicon: HALOT; POB doctrinal term list
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 언약 관계의 소유격은 자연스러운 현대 한국어로 ‘당신의 하나님’으로 렌더링했습니다.
- source_word: כֹּחַ לַעֲשׂוֹת חָיִל
  english_pob_choice: power to gain wealth
  chosen_korean: 재산을 얻을 힘
  alternatives_korean:
  - 재물을 얻을 힘
  - 부를 얻을 힘
  - 성공할 힘
  lexicon: HALOT
  rationale: 문맥상 17절의 ‘내 능력으로 이 재산을 얻었다’는 자기 귀속을 반박하므로, חָיִל의 경제적 의미를 살린 ‘재산’이 가장 직접적이며 ‘힘’은 כֹּחַ를 반영합니다.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  english_pob_choice: so that he may establish his covenant
  chosen_korean: 이는 그분이 … 언약을 … 이루시려는 것입니다
  alternatives_korean:
  - 이는 그분이 … 언약을 확립하시려는 것입니다
  - 이는 그분이 … 언약을 확인하시려는 것입니다
  lexicon: HALOT; covenantal usage in Deuteronomy
  rationale: הָקִים은 단순 보존보다 역사 속에서 언약을 성취·이루어 가는 뜻이 강하므로, ‘이루시다’로 풀어 문맥의 목적성을 살렸습니다.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  english_pob_choice: that he swore to your fathers
  chosen_korean: 그분이 당신의 조상들에게 맹세하신
  alternatives_korean:
  - 그분이 당신의 아버지들에게 맹세하신
  - 그분이 당신의 선조들에게 맹세하신
  lexicon: HALOT
  rationale: 영어 POB의 ‘fathers’는 족장 언약을 가리키는 문화적 표현이지만, 한국어에서는 오해를 줄이기 위해 ‘조상들’로 자연화하되 의미를 보존했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유한 언약 이름이므로, 제목형 대체어보다 음역을 유지하는 것이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הָקִים with covenant language
  chosen_reading: 이루시다
  alternative_readings:
  - 확립하시다
  - 확인하시다
  - 세우시다
  rationale: 문맥은 언약의 단순한 보존보다 그 언약을 역사 속에서 실현·성취하시는 하나님의 행위를 강조하므로, 한국어에서는 ‘이루다’가 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
