revisions:
- from: 그러므로 당신은 야훼 당신의 하나님을 기억해야 합니다. 그것은 그분이 당신에게 재산을 얻을 힘을 주시는 분이기 때문입니다. 이는 그분이 당신의 조상들에게 맹세하신 그분의 언약을 오늘과 같이 이루시려는 것입니다.[a][b]
  to: 그러나 당신의 하나님 야훼를 기억해야 합니다. 그분께서 당신에게 재물을 얻을 능력을 주시는 분이시기 때문입니다. 이는 그분이 당신의 조상들에게[a] 맹세하신 그분의 언약을 오늘날과 같이[b] 이루시기 위해서입니다.
  rationale: 대조 접속사를 바로잡고, 하나님의 이름과 소유격의 한국어 어순을 자연스럽게 정리했습니다. 이유(‘… 주시는 분이시기 때문입니다’)와 목적(‘… 이루시기 위해서입니다’)을 분명히 하면서, 재물·언약·족장 조상 및 현재적 관용 표현의 의미를 보존했습니다.
