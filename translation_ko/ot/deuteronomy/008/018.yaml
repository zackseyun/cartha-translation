    rationale: 한국어에서는 ‘당신의 하나님 야훼’ 또는 ‘야훼, 당신의 하나님’과 같이 구성해야 합니다. 목적격 조사도 필요합니다.
  - severity: medium
    issue: ‘그것은 … 때문입니다. 이는 … 것입니다’가 지시 대상과 목적 관계를 불명료하게 만듭니다.
    rationale: כי הוא 및 למען를 각각 이유와 목적으로 분명히 연결하는 자연스러운 한국어 문장으로 다듬어야 합니다.
  - severity: low
