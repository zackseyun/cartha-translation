  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of slaves.
  footnotes:
  - marker: a
    text: Or, 'from the house of slavery' or 'from the house of bondage.' The Hebrew is literally 'from the house of slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 마음이 교만해지고, 야훼, 당신의 하나님을 잊게 됩니다. 그분은 당신을 이집트 땅, 곧 종들의 집에서 이끌어 내신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘종들의 집’입니다. ‘노예 상태의 집’ 또는 ‘종살이의 집’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  english_pob_choice: your heart is lifted up
  chosen_korean: 마음이 교만해지고
  alternatives_korean:
  - 마음이 높아지고
  - 마음이 들뜨고
  - 마음이 자만해지고
  lexicon: HALOT
  rationale: 히브리어의 ‘높아짐’ 이미지는 여기서 교만의 상태를 뜻하므로, 한국어에서는 자연스럽게 그 함의를 드러내는 ‘교만해지고’로 옮겼습니다.
- source_word: וְשָׁכַחְתָּ
  english_pob_choice: you forget
  chosen_korean: 잊게 됩니다
  alternatives_korean:
  - 잊습니다
  - 잊어버립니다
  - 잊게 되십니다
  lexicon: HALOT
  rationale: 경고 문맥에서 결과를 나타내는 흐름을 살리기 위해 미래적 결과 표현인 ‘잊게 됩니다’를 사용했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 주 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 야훼 하나님
  - 여호와 당신의 하나님
  lexicon: DOCTRINE.md contested terms
  rationale: 이 구절의 원문은 YHWH이지만, 한국어 본문은 문맥상 직접 호칭이 아니라 서술문이므로 ‘주’+‘당신의 하나님’으로 처리해 합쇼체 흐름을 유지했습니다. 다만 이는 본문 차원의 예배적 호칭을 피한 것이 아니라, 직설적 2인칭 문장 안에서의 자연스러운 대응입니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종들의 집
  alternatives_korean:
  - 노예들의 집
  - 노예 상태의 집
  - 종살이의 집
  lexicon: HALOT
  rationale: 히브리어는 추상명사 ‘slavery’보다 복수 명사 ‘slaves’를 직설적으로 사용하므로, 그 사회적 실상을 살려 ‘종들의 집’으로 옮겼습니다. 전통적 완곡어인 ‘종살이’보다 원문의 구체성이 더 잘 드러납니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문에는 ‘주’로 자연화했으나, 원문 인명성은 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주님
  rationale: 원문은 고유신명 YHWH이지만, 이번 절의 한국어 본문은 합쇼체 문장 안에서 ‘주 당신의 하나님’이 가장 자연스럽습니다. 다만 이는 신명 자체를 일반 명사로 환원한 것이 아니라, 문장 내 호칭 구조를 고려한 결정입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘종들의 집’의 사회적 뉘앙스
  chosen_reading: 노예 제도적 예속을 직설적으로 드러내는 표현으로 처리했습니다.
  alternative_readings:
  - 종살이
  - 노예의 집
  - 예속의 집
  rationale: 출애굽 회상 공식에서 이 표현은 이스라엘의 강제 노역과 종속 상태를 상기시키므로, 완곡화보다 원문의 구체성을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status language
- issue: 합쇼체와 경고문 맥락
  chosen_reading: 서술은 합쇼체로, 경고의 직접성은 유지했습니다.
  alternative_readings:
  - 평서체
  - 명령체
  - 친근한 구어체
  rationale: 원문의 경고는 청자에게 직접 적용되는 문장이라 한국어도 공손한 서술형을 유지하되, 의미의 날카로움은 약화시키지 않았습니다.
  doctrine_reference: Korean target style guidance
