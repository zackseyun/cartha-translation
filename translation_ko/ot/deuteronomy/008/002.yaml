source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
  footnotes:
  - marker: a
    text: Or 'to reveal what was in your heart.' The Hebrew literally says 'to know what was in your heart,' an expression preserved in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 네 하나님 야훼께서 너를 이 사십 년 동안 광야에서 이끄신 모든 길을 기억해야 합니다. 이는 너를 낮추고, 시험하여, 네 마음에 무엇이 있는지, 곧 네가 그의 명령들을 지킬지 안 지킬지를 아시기 위함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘네 마음에 무엇이 있는지’를 말합니다. 영어 POB는 이를 본문에 유지하고, 대안 의미로 ‘네 마음에 무엇이 있었는지를 드러내기’도 가능함을 주석합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: And you shall remember
  chosen_korean: 기억해야 합니다
  alternatives_korean:
  - 기억하십시오
  - 기억할 것입니다
  lexicon: HALOT
  rationale: 명령/권고 성격의 용법을 현대 한국어 합쇼체로 자연스럽게 살리면서, 단순 미래 진술로 오해되지 않게 했습니다.
- source_word: כָּל הַדֶּרֶךְ
  english_pob_choice: all the way
  chosen_korean: 모든 길
  alternatives_korean:
  - 온 길
  - 전체 여정
  lexicon: HALOT
  rationale: 광야에서의 전체 여정을 가리키므로, 문자적이되 자연스러운 ‘모든 길’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명기를 포함한 구약에서 신명기 이름은 대치어 ‘주’가 아니라 고유명 ‘야훼’로 반영했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 사막에서
  - 들판에서
  lexicon: HALOT
  rationale: 이스라엘의 시험과 의존의 장소라는 성경적 맥락을 살려 ‘광야’가 가장 적절합니다.
- source_word: עַנֹּתְךָ
  english_pob_choice: to humble you
  chosen_korean: 너를 낮추고
  alternatives_korean:
  - 너를 겸손하게 하고
  - 너를 괴롭게 하고
  lexicon: HALOT
  rationale: 여기서는 고난을 통해 낮아지게 하는 의미이므로, 현대 한국어에서 가장 직접적인 ‘낮추다’로 옮겼습니다.
- source_word: לְנַסֹּתְךָ
  english_pob_choice: to test you
  chosen_korean: 시험하여
  alternatives_korean:
  - 검증하여
  - 테스트하여
  lexicon: HALOT
  rationale: נסה의 평가적 의미를 간결하게 살려 ‘시험하다’로 번역했습니다.
- source_word: לָדַעַת אֶת אֲשֶׁר בִּלְבָבְךָ
  english_pob_choice: to know what was in your heart
  chosen_korean: 네 마음에 무엇이 있는지
  alternatives_korean:
  - 네 속에 무엇이 있는지
  - 네 마음속이 어떠한지
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’(לֵבָב)과 그 안에 있는 것을 직접 살리되, 한국어에서 자연스럽게 들리도록 구성했습니다.
- source_word: מִצְוֹתָיו
  english_pob_choice: his commandments
  chosen_korean: 그의 명령들
  alternatives_korean:
  - 그의 계명들
  - 그의 율례들
  lexicon: HALOT
  rationale: מצוה의 기본 뜻을 따르되, 한국어에서 율법 조항을 포괄하는 보다 직접적인 표현으로 ‘명령들’을 택했습니다.
theological_decisions:
- issue: ‘to know what was in your heart’의 신학적 긴장 보존
  chosen_reading: 하나님이 시험을 통해 ‘네 마음에 무엇이 있는지’를 아신다고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 네 마음에 무엇이 있는지 드러내기 위함입니다
  - 네 마음을 드러내기 위함입니다
  rationale: 본문은 하나님이 아심이라는 표현을 그대로 사용하므로, 전지 논의를 해소하는 방향으로 완화하지 않고 소스의 표현적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
