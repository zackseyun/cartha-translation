revisions:
- from: 그리고 너는 네 하나님 야훼께서 너를 이 사십 년 동안 광야에서 이끄신 모든 길을 기억해야 합니다. 이는 너를 낮추고, 시험하여, 네 마음에 무엇이 있는지, 곧 네가 그의 명령들을 지킬지 안 지킬지를 아시기 위함입니다.[a]
  to: 너는 네 하나님 야훼께서 지난 사십 년 동안 광야에서 너를 인도하신 온 여정을 기억해야 합니다. 이는 너를 낮추시고 시험하셔서, 네 마음에 무엇이 있는지, 곧 네가 그분의 계명들을 지킬 것인지 아닌지를 알기 위함입니다.[a]
  rationale: 광야 생활 전체를 뜻하는 ‘모든 길’을 ‘온 여정’으로 자연화하고, 기간 표현을 ‘지난 사십 년 동안’으로 다듬었습니다. 하나님의 앎이라는 원문의 표현은 본문에서 ‘알기 위함’으로 그대로 유지했으며, ‘드러내기’는 본문을 대체하지 않는 번역 가능성으로만 각주에 제시했습니다. 각주는 영어 POB에 대한 언급을 제거하고 원문에 직접 근거하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
