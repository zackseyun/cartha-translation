    issue: ‘모든 길’이 여정 전체라는 의미를 다소 부자연스럽고 모호하게 전달합니다.
    rationale: כָּל־הַדֶּרֶךְ는 단순한 여러 길이 아니라 광야에서 걸어온 전 과정을 가리킵니다. ‘온 여정’이 의미와 한국어 관용을 함께 살립니다.
