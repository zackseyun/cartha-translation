base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
  footnotes:
  - marker: a
    text: Or “this prosperity.” The Hebrew חַיִל can denote wealth, resources, strength, or capability depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음속으로 ‘내 힘과 내 손의 능력이 나에게 이 재물을 얻었다’고 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 문맥상 물질적 풍요를 나타냅니다. 히브리어 חַיִל은 여기서 부, 자원, 능력 등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and you say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 그리고 당신은 말합니다
  - 그리하여 마음속으로 말합니다
  lexicon: HALOT
  rationale: 경고문맥이므로 한국어에서는 직접적인 금지형으로 옮겨 권면의 힘을 살렸습니다. 영어의 현재형 지시를 한국어 합쇼체 명령/금지로 자연스럽게 전환했습니다.
- source_word: בִּלְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 당신의 마음에
  - 속으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 독백을 표준적인 현대 한국어로 살리면서도, ‘마음’의 비유를 유지했습니다.
- source_word: כֹּחִי וְעֹצֶם יָדִי
  english_pob_choice: my power and the strength of my hand
  chosen_korean: 내 힘과 내 손의 능력
  alternatives_korean:
  - 내 능력과 내 손의 힘
  - 내 힘과 내 손의 강한 힘
  lexicon: HALOT
  rationale: כֹּחַ와 עֹצֶם의 중첩된 자기능력 주장을 한국어에서 자연스럽게 ‘힘’과 ‘손의 능력’으로 옮겨, 손이라는 구체적 이미지를 유지했습니다.
- source_word: הַחַיִל
  english_pob_choice: this wealth
  chosen_korean: 이 재물
  alternatives_korean:
  - 이 부
  - 이 번영
  - 이 재산
  lexicon: HALOT
  rationale: 문맥상 물질적 풍요를 가리키므로 ‘재물’이 자만의 대상이 되는 축적물을 가장 무난하게 드러냅니다. 영어 POB의 ‘wealth’에 대응하되, 한국어에서 ‘재물’이 더 직접적입니다.
theological_decisions:
- issue: 자기공로 귀속 경고의 어조
  chosen_reading: 금지형으로 번역해 스스로의 힘으로 얻었다는 자만을 직접 경계하게 했습니다.
  alternative_readings:
  - 서술형으로 ‘…라고 말할 때’
  - 완곡하게 ‘…라고 생각하지 마십시오’
  rationale: 본문은 이스라엘이 풍요를 자기 능력에 귀속시키는 태도를 경고하므로, 한국어에서도 경고의 직접성을 약화시키지 않는 표현이 적절합니다.
  doctrine_reference: 신명기 8장 문맥의 언약적 교만 경계
