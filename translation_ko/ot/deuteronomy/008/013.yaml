translation:
  language: ko
  text: 그리고 너희의 소와 양이 불어나고, 너희의 은과 금이 늘어나며, 너희의 모든 소유가 늘어날 것입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 가축’. 히브리어 בקר는 특히 소 같은 큰 가축을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 은과 금이 늘어날 것입니다’. 히브리어는 소유를 나타내는 לָךְ를 통해 ‘너희의’라는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  english_pob_choice: and your herds
  chosen_korean: 너희의 소
  alternatives_korean:
  - 너희의 가축
  - 너희의 소떼
  lexicon: HALOT
  rationale: בקר는 양떼와 대비되는 소 같은 큰 가축을 가리키므로, 문맥상 대응되는 한국어로는 ‘소’가 가장 직접적입니다. 영어 POB의 ‘herds’는 집합적 뉘앙스를 보이지만, 한국어에서는 ‘소떼’보다 ‘소’가 자연스럽고 본문의 축복 목록도 더 선명하게 전달합니다.
- source_word: וְצֹאנְךָ
  english_pob_choice: and your flocks
  chosen_korean: 양
  alternatives_korean:
  - 양떼
  - 가축 떼
  lexicon: HALOT
  rationale: צאן은 작은 가축의 집합어이므로, 앞의 ‘소’와 짝을 이루는 일반적 대응으로 ‘양’을 택했습니다. 한국어에서 ‘양떼’도 가능하지만, 본문은 소와 양의 대조를 간결하게 나열하는 방식이므로 단수 집합명사로 처리했습니다.
- source_word: יִרְבְּיֻן / יִרְבֶּה
  english_pob_choice: multiply / increase
  chosen_korean: 불어나고 / 늘어나며 / 늘어날 것입니다
  alternatives_korean:
  - 번성하고 / 증가하며 / 증가할 것입니다
  - 많아지고 / 많아지며 / 많아질 것입니다
  lexicon: HALOT
  rationale: רבה의 핵심은 수적 증가이므로, 가축에는 ‘불어나고’, 재산에는 ‘늘어나며/늘어날 것입니다’로 자연스럽게 옮겼습니다. 세 번의 반복을 한국어에서 완전히 동일하게 두기보다, 대상에 따라 약간씩 달리해도 원문의 증식 의미는 유지됩니다.
- source_word: וְכֶסֶף וְזָהָב
  english_pob_choice: and silver and gold
  chosen_korean: 너희의 은과 금
  alternatives_korean:
  - 은과 금
  - 너희의 은과 금붙이
  lexicon: HALOT
  rationale: 문법상 히브리어는 뒤의 לָךְ가 소유를 드러내지만, 한국어는 명사구에 소유격을 붙이는 것이 자연스럽습니다. 따라서 영어 POB의 최신 교정처럼 소유를 분명히 하여 ‘너희의 은과 금’으로 옮겼습니다.
theological_decisions:
- issue: 축복 목록의 재산·가축 증가를 어떻게 한국어로 과장 없이 전달할지
  chosen_reading: 본문은 언약적 복으로서 소유와 생산력의 증대를 약속하므로, 현대 한국어의 직설적 표현인 ‘불어나고/늘어나며’로 옮겨 원문의 물질적 축복을 흐리지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘풍성해지고’로 표현
  - 전통적 어감을 살려 ‘번성하고’로 표현
  rationale: 본문은 감정적 위로보다 실제적인 번영의 증가를 말하므로, 의미를 희석하는 완곡어보다 직접적인 증식 표현이 source-direct합니다.
  doctrine_reference: 언약의 복, 신 8장의 경고와 번영 모티프
