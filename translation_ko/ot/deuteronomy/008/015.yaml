base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
  footnotes:
  - marker: a
    text: Or 'venomous snakes.' The Hebrew expression traditionally rendered 'fiery serpents' may refer to snakes whose bite caused a burning sensation.
    reason: lexical_alternative
  - marker: b
    text: Or 'drought' or 'thirst.' The Hebrew term denotes parched dryness in a place without water.
    reason: lexical_alternative
translation:
  language: ko
  text: 광대하고 두려운 광야[a]를 너희를 이끄신 분, 곧 불뱀과 전갈과 물이 없는 목마른 땅을 지나게 하시고, 너희를 위해 바위에서 물을 내신 분[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독사들’. 히브리어 표현은 전통적으로 ‘불뱀’으로 옮기지만, 물어서 타는 듯한 고통을 일으키는 뱀을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부싯돌 같은 바위에서’. 히브리어는 물이 솟아나온 기적의 근원을 강조하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  english_pob_choice: who led you
  chosen_korean: 너희를 이끄신 분
  alternatives_korean:
  - 너를 이끄신 분
  - 너희를 인도하신 분
  lexicon: HALOT
  rationale: 히필 분사형이 야훼의 지속적·과거적 인도 행위를 가리키므로, 한국어에서는 관계절보다 명사화하여 자연스럽게 처리했습니다. 2인칭 단수 접미사는 문맥상 공동체 전체를 향한 خطاب으로 보아 너희로 옮겼습니다.
- source_word: הַגָּדֹל וְהַנּוֹרָא
  english_pob_choice: the great and fearsome
  chosen_korean: 광대하고 두려운
  alternatives_korean:
  - 크고 두려운
  - 크고 무서운
  lexicon: HALOT
  rationale: 두 형용사의 병렬을 살리되, נוֹרָא의 경외·두려움을 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: נָחָשׁ שָׂרָף
  english_pob_choice: fiery serpents
  chosen_korean: 불뱀
  alternatives_korean:
  - 불타는 뱀
  - 독사
  lexicon: HALOT
  rationale: 전통적으로 굳어진 표현이지만, 여기서는 ‘불처럼 타는 고통을 주는 뱀’이라는 의미를 드러내기 위해 간결한 ‘불뱀’을 사용했습니다. 영어 POB의 각주가 시사하는 고통 유발의 의미도 보존합니다.
- source_word: וְצִמָּאוֹן
  english_pob_choice: and thirsty ground
  chosen_korean: 물이 없는 목마른 땅
  alternatives_korean:
  - 목마름
  - 가뭄
  lexicon: HALOT
  rationale: 추상명사 ‘목마름’보다 광야의 환경을 가리키는 구체적 이미지가 문맥에 더 적합하므로, 물이 없고 메마른 땅이라는 뜻을 살려 옮겼습니다.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  english_pob_choice: who brought out water for you
  chosen_korean: 너희를 위해 바위에서 물을 내신 분
  alternatives_korean:
  - 너를 위해 물을 내신 분
  - 너희에게 물을 내신 분
  lexicon: HALOT
  rationale: 히필 분사의 ‘꺼내다/내다’라는 동작성을 살리고, 이어지는 ‘바위에서’와 연결해 기적적 공급의 장면을 한국어에서도 분명하게 했습니다.
- source_word: מִצּוּר הַחַלָּמִישׁ
  english_pob_choice: from the flinty rock
  chosen_korean: 바위에서
  alternatives_korean:
  - 부싯돌 같은 바위에서
  - 딱딱한 바위에서
  lexicon: HALOT
  rationale: ‘צוּר’와 ‘חַלָּמִישׁ’의 중첩된 바위 이미지는 한국어에서 과도하게 직역하면 부자연스러우므로, 본문 의미의 핵심인 ‘바위에서’로 간결하게 살렸습니다.
theological_decisions:
- issue: 광야 묘사의 성격
  chosen_reading: 이 절을 이스라엘의 역사적 광야 여정과 그 안에서의 하나님의 실제 보호로 읽고, 상징화하지 않았습니다.
  alternative_readings:
  - 영적 시련의 은유로 읽기
  - 일반적 곤경의 비유로 약화하기
  rationale: 본문은 야훼께서 실제로 광야를 통과시키고 물을 공급하신 구체적 행위를 회상합니다. 따라서 역사적·서사적 힘을 보존하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
