translation:
  language: ko
  text: 밀과 보리, 포도나무와 무화과나무와 석류가 있는 땅, 올리브기름과 꿀이 나는 땅입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꿀’은 ‘대추 시럽’을 뜻할 수도 있습니다. 히브리어 דְבָשׁ는 이 땅의 산물을 묘사할 때 넓게는 달콤한 시럽을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: a land of
  chosen_korean: …의 땅
  alternatives_korean:
  - 땅
  - 한 땅
  lexicon: HALOT
  rationale: 히브리어의 반복되는 אֶרֶץ를 한국어에서도 두 번 살려, 약속된 땅의 특징을 열거하는 수사적 구조를 유지했습니다.
- source_word: תְּאֵנָה / רִמּוֹן
  english_pob_choice: fig trees / pomegranates
  chosen_korean: 무화과나무와 석류
  alternatives_korean:
  - 무화과나무와 석류나무
  - 무화과와 석류
  lexicon: HALOT
  rationale: 목록의 식물/산물 성격을 살리되 한국어에서는 ‘무화과나무’가 자연스럽고, רִמּוֹן은 열매 중심으로 ‘석류’가 가장 간결합니다.
- source_word: זֵית שֶׁמֶן
  english_pob_choice: olive oil
  chosen_korean: 기름나는 올리브
  alternatives_korean:
  - 올리브 기름
  - 기름을 내는 올리브
  lexicon: HALOT
  rationale: 히브리어의 직역적 구성(올리브 + 기름)을 너무 평준화하지 않기 위해 ‘기름나는’으로 옮겨, 풍요의 산물이라는 뉘앙스를 드러냈습니다.
- source_word: דְבָשׁ
  english_pob_choice: honey
  chosen_korean: 꿀
  alternatives_korean:
  - 당밀
  - 대추 시럽
  lexicon: HALOT
  rationale: 기본 의미는 ‘꿀’이므로 본문에는 표준어를 유지하되, POB 주석의 농경적 대안은 각주로 보존했습니다.
theological_decisions:
- issue: 약속의 땅의 풍요를 나열하는 문장 구조
  chosen_reading: 동일한 ‘…의 땅’ 반복을 유지해 하나님의 선물로서의 풍성함을 강조했습니다.
  alternative_readings:
  - 한 번만 ‘땅’으로 처리하여 문장을 간단히 함
  - 열거를 쉼표 중심으로 평탄화함
  rationale: 본문은 단순 정보 전달보다 풍요와 축복의 누적 효과를 드러내므로, 반복을 줄이지 않는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 신명기 8장의 언약적 축복과 가나안 땅의 선물성
