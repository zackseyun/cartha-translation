  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
  footnotes:
  - marker: a
    text: Or possibly “date syrup” for “honey” (Hebrew דְּבָשׁ), since the term can refer broadly to a sweet syrup in descriptions of the land’s produce.
