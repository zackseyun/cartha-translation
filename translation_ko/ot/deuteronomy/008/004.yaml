    issue: ‘이 열 해 동안’
    rationale: 원문은 ‘이 사십 년’(זֶה אַרְבָּעִים שָׁנָה)이며, 열 해로 바꾼 것은 수치와 본문의 역사적 기간을 변경합니다.
  - severity: medium
