    rationale: בָצֵקָה의 기본 뜻은 ‘붓다/부어오르다’입니다. ‘부르트다’는 물집·짓무름 쪽으로 의미를 좁힐 수 있으므로 각주상의 가능한 이해로 처리하는 편이 원문에 더 충실합니다.
