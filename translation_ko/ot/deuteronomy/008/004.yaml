  to: 당신의 옷은 이 사십 년 동안 해어지지 않았고[a], 당신의 발도 붓지 않았습니다.[b]
  rationale: 원문의 ‘사십 년’을 회복하고, 단수 호칭을 일관되게 유지했습니다. 의복에 대해서는 ‘해어지다’를 유지하되 직역적인 ‘당신 위에서’는 한국어에서 자연스러운 문장으로 처리했습니다. 발에 대해서는 어근의 기본 의미인 ‘붓다’를 본문에 두고, 더 구체적인 물집/부르틈의 이해는 각주로 보존했습니다.
