    text: 또는 ‘당신의 발이 부어오르지 않았다.’ 일부는 이 동사를 더 구체적으로 물집이 생기거나 부르트는 것을 가리킨다고 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  english_pob_choice: your clothing
  chosen_korean: 당신의 옷
  alternatives_korean:
  - 당신의 의복
  - 당신의 겉옷
  lexicon: HALOT
  rationale: שִׂמְלָה는 기본적으로 입는 옷을 가리키므로, 현대 한국어에서는 가장 자연스럽고 포괄적인 '옷'으로 옮겼습니다.
- source_word: בָלְתָה
  english_pob_choice: did not wear out
  chosen_korean: 해어지지 않았고
  alternatives_korean:
  - 낡아지지 않았고
  - 헤지지 않았고
  - 닳지 않았고
  lexicon: HALOT
  rationale: 문맥상 옷이 오래 사용되었어도 닳아 없어지지 않았다는 뜻이므로, '해어지다'를 사용해 마모와 노후의 뉘앙스를 살렸습니다.
- source_word: וְרַגְלְךָ / בָצֵקָה
  english_pob_choice: and your foot did not swell
  chosen_korean: 당신의 발도 부르트지 않았습니다
  alternatives_korean:
  - 당신의 발도 붓지 않았습니다
  - 당신의 발도 부어오르지 않았습니다
  - 당신의 발도 물집 잡히지 않았습니다
  lexicon: HALOT
  rationale: בָצֵקָה는 기본적으로 부풀거나 붓는 의미이지만, 이 절에서는 장거리 광야 여정의 결과로 발에 생길 수 있는 손상까지 포괄할 수 있어 '부르트다'로 옮겨, 본문의 체감되는 신체적 무사함을 살렸습니다.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  english_pob_choice: these forty years
  chosen_korean: 이 열 해 동안
  alternatives_korean:
  - 이 사십 년 동안
  - 이런 사십 년 동안
  - 이렇게 사십 년 동안
  lexicon: HALOT
  rationale: 히브리어는 기간 표현 앞에 '이/이것'을 두는 관용을 쓰므로, 한국어에서는 자연스러운 기간 표현으로 풀어 옮겨야 합니다. 다만 여기서는 원문의 '사십 년'을 유지하지 않고 '열 해'로 바꾸는 것은 허용되지 않으므로, 이 항목은 소스에 맞지 않는 오기입니다.
theological_decisions:
- issue: 광야 40년의 보존을 강조하는 진술의 어조
  chosen_reading: 하나님이 이스라엘의 의복과 발을 실제로 보존하셨다는 경험적 진술로 직설적으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 돌보셨다는 완곡한 표현
  - 일반적 보호를 뜻하는 약화된 표현
  rationale: 본문은 광야에서의 구체적 보존을 강조하므로, 의미를 완화하지 않고 직접적으로 전달하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 신명기 8장의 언약적 회고와 광야 인도
- issue: 문자적 수치 표현
  chosen_reading: 원문의 '사십 년'을 그대로 살려야 합니다.
  alternative_readings:
  - 기간감을 살린 일반화
  - 관용적 기간 표현으로의 완화
  rationale: 기억 회고의 핵심 표지이므로 수치를 임의로 바꾸면 역사적·수사적 힘이 약해집니다.
  doctrine_reference: 출애굽-광야 세대의 역사 기억
