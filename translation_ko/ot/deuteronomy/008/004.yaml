  text: 당신의 옷은 이 사십 년 동안 해어지지 않았고[a], 당신의 발도 붓지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 의복은 당신이 입고 있는 동안 해어지지 않았다.’
