  terminology: עֹלָה는 ‘번제물’, זֶבַח은 특정 제사 종류로 한정하지 않고 ‘희생제물’, יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 옮겼습니다. בָּשָׂר는 이 문맥에서 ‘고기’가 적절합니다.
