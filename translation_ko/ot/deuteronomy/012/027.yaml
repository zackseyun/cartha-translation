  lexicon: HALOT
  rationale: עַל의 제의적 위치 관계를 한국어에서 자연스럽게 풀어 ‘제단 위에’로 옮겼고, YHWH는 본 프로젝트 기준에 따라 ‘야훼’로 표기했습니다.
- source_word: יִשָּׁפֵךְ
  english_pob_choice: shall be poured out
  chosen_korean: 쏟아부어야 합니다
  alternatives_korean:
