  text: 너는 네 번제물의 고기와 피를 야훼 네 하나님의 제단 위에 바쳐야 하며, 네 희생제물의 피는 야훼 네 하나님의 제단 위에 부어질 것입니다. 그리고 너는 고기를 먹어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ עֹלֹתֶיךָ
  english_pob_choice: you shall offer your burnt offerings
  chosen_korean: 번제물을 바쳐야 합니다
  alternatives_korean:
