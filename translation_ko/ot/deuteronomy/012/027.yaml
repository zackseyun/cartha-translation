  - 쏟아져야 합니다
  lexicon: HALOT
  rationale: 수동형의 제의적 처리와 제물의 피가 의도적으로 배출되는 장면을 살려, 단순한 ‘부어야 합니다’보다 더 구체적인 ‘쏟아부어야 합니다’를 택했습니다.
