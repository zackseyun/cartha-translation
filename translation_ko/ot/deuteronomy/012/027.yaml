  text: 너희는 번제물의 고기와 피를 야훼 너희 하나님의 제단 위에 바쳐야 하며, 너희 희생제물의 피는 야훼 너희 하나님의 제단 위에 쏟아부어야 합니다. 그러나 고기는 먹어야 합니다.[a]
