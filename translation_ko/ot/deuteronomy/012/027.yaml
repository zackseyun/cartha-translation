  - 번제물을 해야 합니다
  lexicon: HALOT
  rationale: עָשָׂה가 제사 문맥에서는 단순한 ‘하다’가 아니라 제사를 집행하다/바치다의 뜻으로 쓰이므로, 한국어는 제의 행위를 자연스럽게 드러내는 ‘바치다’를 택했습니다.
- source_word: הַבָּשָׂר וְהַדָּם
  english_pob_choice: the flesh and the blood
  chosen_korean: 고기와 피
  alternatives_korean:
  - 육체와 피
  - 살과 피
  lexicon: HALOT
  rationale: 제의 규정에서 בָּשָׂר는 제물을 가리키는 구체적 물질로서 ‘고기’가 가장 자연스럽고, 피와의 대조도 분명하게 살릴 수 있습니다.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  english_pob_choice: on the altar of Yahweh your God
  chosen_korean: 야훼 너희 하나님의 제단 위에
  alternatives_korean:
  - 야훼 너희 하나님의 제단 위에
