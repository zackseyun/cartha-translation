  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִתַּצְתֶּ֣ם אֶת מִזְבּחֹתָ֗/ם וְ/שִׁבַּרְתֶּם֙ אֶת מַצֵּ֣בֹתָ֔/ם וַ/אֲשֵֽׁרֵי/הֶם֙ תִּשְׂרְפ֣וּ/ן בָּ/אֵ֔שׁ וּ/פְסִילֵ֥י אֱלֹֽהֵי/הֶ֖ם תְּגַדֵּע֑וּ/ן וְ/אִבַּדְתֶּ֣ם אֶת שְׁמָ֔/ם מִן הַ/מָּק֖וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
  footnotes:
  - marker: a
    text: Or 'their Asherim' or 'their sacred poles.' The Hebrew term refers to cult objects associated with Asherah.
    reason: lexical_alternative
  - marker: b
    text: Or 'their idols.' Hebrew 'the carved images of their gods' emphasizes the fashioned nature of these worship objects.
    reason: lexical_alternative
  - marker: c
    text: '''Wipe out their name'' means to remove their memorialized presence and remembrance from that worship site.'
    reason: cultural_note
translation:
  language: ko
  text: 그들의 제단을 헐어 버리며, 그들의 돌기둥을 부수고, 그들의 아세라 목상을 불에 태우며, 그들의 신들의 새긴 형상을 찍어 내고, 그 이름을 그곳에서 없애 버리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 목상’은 아세라와 관련된 숭배용 물건을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새긴 형상’은 단순한 ‘우상’보다 조각·제작된 물건이라는 히브리어의 물질적 뉘앙스를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이름을 그곳에서 없애 버리다’는 그 제의 장소에서 그들의 기억과 표지를 지워 버린다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִתַּצְתֶּם אֶת מִזְבּחֹתָם
  english_pob_choice: tear down their altars
  chosen_korean: 그들의 제단을 헐어 버리며
  alternatives_korean:
  - 그들의 제단을 무너뜨리며
  - 그들의 제단을 허물며
  lexicon: HALOT
  rationale: נתץ는 구조물을 헐거나 무너뜨리는 뜻이므로, 현대 한국어의 자연스러운 표현인 ‘헐어 버리다’로 옮겼습니다.
- source_word: וְשִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  english_pob_choice: shatter their sacred pillars
  chosen_korean: 그들의 돌기둥을 부수고
  alternatives_korean:
  - 그들의 성스러운 기둥을 깨뜨리고
  - 그들의 석주를 부수고
  lexicon: HALOT
  rationale: מַצֵּבָה는 예배용 세운 돌기둥을 가리키므로, 의미를 분명히 하면서도 과도하게 해석하지 않는 ‘돌기둥’이 적절합니다.
- source_word: וַאֲשֵׁרֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ
  english_pob_choice: burn their Asherah poles with fire
  chosen_korean: 그들의 아세라 목상을 불에 태우며
  alternatives_korean:
  - 그들의 아세라 상을 불로 태우며
  - 그들의 아세라 기둥을 불에 태우며
  lexicon: HALOT
  rationale: אֲשֵׁרִים은 아세라와 관련된 숭배용 물건을 가리킬 수 있어, 한국어 독자에게 가장 투명한 ‘아세라 목상’으로 옮겼습니다.
- source_word: וּפְסִילֵי אֱלֹהֵיהֶם תְּגַדֵּעוּן
  english_pob_choice: cut down the carved images of their gods
  chosen_korean: 그들의 신들의 새긴 형상을 찍어 내고
  alternatives_korean:
  - 그들의 신들의 조각한 우상을 베어 내고
  - 그들의 신들의 새긴 우상을 찍어 내고
  lexicon: HALOT
  rationale: פֶּסֶל은 조각된 형상이라는 물질적 측면이 핵심이므로, 단순한 ‘우상’보다 ‘새긴 형상’이 원문의 구체성을 더 잘 살립니다.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם מִן הַמָּקוֹם הַהוּא
  english_pob_choice: destroy their name from that place
  chosen_korean: 그 이름을 그곳에서 없애 버리십시오.
  alternatives_korean:
  - 그 이름을 그곳에서 지워 버리십시오.
  - 그 이름을 그곳에서 말소하십시오.
  lexicon: HALOT
  rationale: שֵׁם은 단순한 호칭이 아니라 그 장소에 남은 기억과 표지를 가리키는 말이므로, 직역을 살리되 자연스러운 한국어로 ‘없애 버리다’라고 옮겼습니다.
theological_decisions:
- issue: 가나안 제의물에 대한 파괴 명령의 강한 명령형 어조
  chosen_reading: 한국어도 연속 명령형으로 처리해 우상숭배를 완전히 제거하라는 급박하고 단호한 어조를 살렸습니다.
  alternative_readings:
  - 서술형으로 완화하는 번역
  - 부드러운 권고형 표현
  rationale: 히브리어의 연속된 명령형은 단순 정보가 아니라 언약적 심판과 분리의 요구를 담고 있으므로, 그 힘을 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve rhetorical force and source-level imperatives.'
