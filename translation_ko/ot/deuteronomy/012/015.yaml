base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in all the desire of your soul''; that is, whenever you desire it.'
    reason: lexical_alternative
  - marker: b
    text: '''Within all your gates'' is a Hebrew idiom for within your towns or settlements.'
    reason: cultural_note
translation:
  language: ko
  text: 다만 네 영혼이 원하는 모든 때에 너는 짐승을 잡아 그 고기를 먹을 수 있습니다. 이는 야훼 당신의 하나님이 당신에게 주신 복에 따른 것입니다. 당신의 모든 성문 안에서 그렇게 하십시오. 부정한 자와 정결한 자가 그것을 함께 먹을 수 있으니, 곧 노루와 사슴처럼 먹을 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 영혼의 모든 욕망 안에서’라는 뜻이지만, 여기서는 ‘네가 원하는 때마다’라는 관용적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문 안에서’는 마을이나 거주지 안을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
