- source_word: תִּזְבַּח וְאָכַלְתָּ בָשָׂר
  english_pob_choice: you may slaughter and eat meat
  chosen_korean: 너는 짐승을 잡아 그 고기를 먹을 수 있습니다
  alternatives_korean:
