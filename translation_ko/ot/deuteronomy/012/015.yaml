revisions:
- from: 다만 네 영혼이 원하는 모든 때에 너는 짐승을 잡아 그 고기를 먹을 수 있습니다. 이는 야훼 당신의 하나님이 당신에게 주신 복에 따른 것입니다. 당신의 모든 성문 안에서 그렇게 하십시오. 부정한 자와 정결한 자가 그것을 함께 먹을 수 있으니, 곧 노루와 사슴처럼 먹을 수 있습니다.[a][b]
  to: 다만 네가 원하는 대로[a], 야훼 네 하나님께서 네게 주신 복에 따라, 너는 네 모든 성문 안에서[b] 짐승을 잡아 고기를 먹을 수 있습니다. 부정한 사람이나 정결한 사람이나 모두 그것을 먹을 수 있습니다. 노루나 사슴을 먹듯이 말입니다.
  rationale: 허용의 주어와 조건들을 한 문장 안에 연결하여 원문의 통사 관계를 회복했습니다. ‘네가 원하는 대로’는 히브리어 관용구를 자연스럽게 옮기면서도 허용의 범위를 보존합니다. 끝의 비교는 먹는 행위에 자연스럽게 연결했습니다.
