  - 너는 잡아먹을 수 있습니다
  lexicon: HALOT
  rationale: 식용 동물의 도살을 가리키므로 ‘잡다’와 ‘고기’로 풀어, 지나치게 일반적인 ‘죽이다’보다 문맥을 정확히 반영했습니다.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ
  english_pob_choice: according to the blessing of Yahweh your God
  chosen_korean: 야훼 당신의 하나님이 당신에게 주신 복에 따른 것입니다
  alternatives_korean:
  - 야훼 당신의 하나님이 주신 복대로입니다
