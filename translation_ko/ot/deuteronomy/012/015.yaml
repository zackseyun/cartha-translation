  lexicon: HALOT
  rationale: 히브리어 관용구의 도시·거주지 의미를 고려하되, 원문 이미지인 ‘성문’을 유지해 문체와 배경을 함께 보존했습니다.
- source_word: הַטָּמֵא וְהַטָּהוֹר
