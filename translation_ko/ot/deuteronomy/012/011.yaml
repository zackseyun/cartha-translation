    issue: לְשַׁכֵּן의 사역형과 해당 각주 앵커가 충분히 반영되지 않았습니다.
    rationale: ‘그분의 이름을 두시려고’는 사역형의 ‘머물게 하다’를 약화하며, 관련 각주가 문장 끝에 붙어 있어 설명 대상이 불분명합니다.
