revisions:
- from: 그분의 이름을 두시려고 야훼 너희 하나님이 선택하실 장소가 있으면, 너희는 내가 너희에게 명령하는 모든 것을 그곳으로 가져가야 합니다. 너희의 번제물, 너희의 희생제물, 너희의 십일조, 너희 손의 기여물, 그리고 너희가 야훼께 서원하는 모든 서원 중 가장 좋은 것들을 가져가야 합니다.[a]
  to: 야훼 너희 하나님께서 자신의 이름이 그곳에 머물게 하시려고 택하실 곳이 있게 되면, 너희는 내가 너희에게 명령하는 모든 것, 곧 너희의 번제물과 희생제물, 너희의 십일조, 너희 손으로 드리는 헌물, 그리고 너희가 야훼께 서원한 것들 가운데 가장 좋은 모든 것을 그곳으로 가져가야 합니다.[a]
  rationale: 사역형 ‘이름이 머물게 하시려고’를 본문에 반영하고, 단 한 번인 명령 동사에 모든 제물 목록을 연결했습니다. 각주는 관련 구절에 앵커를 두고, 인칭 표현만 다른 직역 대안을 제시합니다. ‘서원한 것들’은 원문이 서원 자체와 그 이행물의 구별을 명시하지 않는 점을 보존합니다.
