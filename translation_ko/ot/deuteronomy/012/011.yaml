language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
  footnotes:
  - marker: a
    text: Or more formally, 'for him to cause his name to dwell there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 이름을 두시려고 야훼 너희 하나님이 선택하실 장소가 있으면, 너희는 내가 너희에게 명령하는 모든 것을 그곳으로 가져가야 합니다. 너희의 번제물, 너희의 희생제물, 너희의 십일조, 너희 손의 기여물, 그리고 너희가 야훼께 서원하는 모든 서원 중 가장 좋은 것들을 가져가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그분의 이름이 거기 머물도록 하시려고’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי/כֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 여호와 너희 하나님
  - 야훼 하나님
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 야훼로 옮기고, אֱלֹהֵיכֶם은 관계를 분명히 하기 위해 ‘너희 하나님’으로 옮겼습니다.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  english_pob_choice: the place that ... will choose
  chosen_korean: 선택하실 장소
  alternatives_korean:
  - 선택하실 그곳
  - 택하실 곳
  lexicon: HALOT
  rationale: 지시 대상이 특정 예배 장소임을 살리되, 한국어에서는 ‘장소’가 가장 자연스럽고 문맥상 분명합니다.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  english_pob_choice: for his name to dwell there
  chosen_korean: 그분의 이름을 두시려고
  alternatives_korean:
  - 그분의 이름이 머물게 하시려고
  - 그분의 이름을 거기 두시려고
  lexicon: HALOT
  rationale: ‘이름’이 장소에 머문다는 신명기의 명칭 신학을 살리기 위해 ‘두시려고’로 옮겼으며, 하나님 자신을 장소에 가두는 표현으로 오해되지 않도록 했습니다.
- source_word: עוֹלֹתֵיכֶם וְזִבְחֵיכֶם
  english_pob_choice: your burnt offerings, your sacrifices
  chosen_korean: 너희의 번제물, 너희의 희생제물
  alternatives_korean:
  - 너희의 번제, 너희의 제물
  - 너희의 번제물, 너희의 제사 희생물
  lexicon: HALOT
  rationale: עוֹלָה는 번제물로, זֶבַח은 이 문맥에서 특정 제사 종류보다 넓은 희생제물로 옮기는 편이 원문 범위를 더 잘 반영합니다.
- source_word: מַעְשְׂרֹתֵיכֶם וּתְרֻמַת יֶדְכֶם
  english_pob_choice: your tithes, the contribution of your hand
  chosen_korean: 너희의 십일조, 너희 손의 기여물
  alternatives_korean:
  - 너희의 십일조, 너희 손의 헌물
  - 너희의 십일조, 너희 손의 바침
  lexicon: HALOT
  rationale: מַעֲשֵׂר은 십일조로, תְרֻמָה יָד은 제도용어 ‘거제’보다 손에서 나온 자발적 헌납의 이미지를 살려 ‘기여물’로 옮겼습니다.
- source_word: מִבְחַר נִדְרֵי/כֶם
  english_pob_choice: all the choicest of your vow offerings
  chosen_korean: 너희가 서원하는 모든 서원 중 가장 좋은 것들
  alternatives_korean:
  - 너희 서원의 가장 좋은 것들
  - 너희 서원물 가운데 가장 좋은 것들
  lexicon: HALOT
  rationale: מִבְחַר는 ‘가장 좋은/선택된 것들’이고, נדר는 여기서 서원 자체보다 서원으로 인한 헌납 범주를 가리키지만, 한국어에서는 중복을 피하면서도 원문의 선택성(comparative quality)을 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 여호와께
  lexicon: HALOT
  rationale: 서원 행위의 목적어로서 여격을 자연스럽게 살리되, 본문 전체의 신명 표기를 일관되게 유지했습니다.
theological_decisions:
- issue: YHWH의 번역과 신명기적 명칭 신학
  chosen_reading: 야훼 ... 그분의 이름을 두시려고
  alternative_readings:
  - 여호와 ... 이름을 두시려고
  - 야훼 ... 이름을 거기 두시려고
  rationale: יהוה는 고유한 언약명으로 유지하고, ‘이름’이 거하는 표현은 하나님의 임재를 장소에 국한하지 않으면서도 성소의 선택을 드러내는 신명기적 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md Contested terms; preserve theological tension rather than resolve it
