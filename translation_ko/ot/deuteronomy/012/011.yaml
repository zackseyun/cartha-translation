  source_fidelity: 수정이 필요합니다. וְהָיָה의 미래적 상황 설정은 ‘있으면’보다 ‘있게 되면’이 더 충실하며, לְשַׁכֵּן의 사역형은 ‘이름을 두시려고’보다 ‘이름이 머물게 하시려고’로 드러내는 편이 좋습니다. 또한 תָבִיאוּ는 한 번만 나오므로 ‘가져가야 합니다’의 반복은 제거해야 합니다. שָׁמָּה의 방향성은 ‘그곳으로’로 보존했습니다.
  naturalness: ‘너희 손의 기여물’은 현대 표준 한국어 성서 문맥에서 다소 번역투이므로 ‘너희 손으로 드리는 헌물’로 다듬었습니다. 긴 열거는 ‘곧’으로 연결하여 자연스럽게 만들되 원문의 항목 구조는 유지했습니다. 본문 전체는 현대적 합쇼체로 통일했습니다.
  terminology: יהוה는 프로젝트 방침과 영어 POB를 따라 ‘야훼’로 유지했습니다. עוֹלֹת과 זְבָחִים은 각각 ‘번제물’과 포괄적인 ‘희생제물’로 유지했습니다. נִדְרֵיכֶם은 헌물로 한정하지 않고 ‘서원한 것들’로 옮겨 원문의 범위를 보존했습니다.
