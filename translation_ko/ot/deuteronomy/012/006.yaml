base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
  footnotes:
  - marker: a
    text: Or 'your offering' / 'the contribution from your hand.' The Hebrew phrase literally includes 'hand,' emphasizing what is personally presented.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'your vows'; in this context the sense is likely the offerings associated with vows.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기에서 여러분의 번제와 여러분의 희생제물과 여러분의 십일조와 여러분의 손의 기여물과 여러분의 서원제물과 여러분의 자원제물, 그리고 여러분의 소 떼의 처음 난 것과 양 떼의 처음 난 것을 가져오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘손’을 포함해, 개인이 직접 바쳐 드리는 물품임을 강조합니다.
    reason: source_note
  - marker: b
    text: ‘서원’과 관련된 제물이라는 뜻으로 읽을 수 있으며, 단순히 서원 그 자체만 가리킨다고 보기에는 제의 문맥이 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֹתֵיכֶם
  english_pob_choice: your burnt offerings
  chosen_korean: 여러분의 번제
  alternatives_korean:
  - 여러분의 번제물
  - 여러분의 번제 희생
  lexicon: HALOT
  rationale: עֹלָה는 표준 제의 용어인 ‘번제’가 가장 정확하며, 한국어 성경 전통에서도 기술어로 널리 통용됩니다.
- source_word: תְּרוּמַת יֶדְכֶם
  english_pob_choice: the contribution of your hand
  chosen_korean: 여러분의 손의 기여물
  alternatives_korean:
  - 여러분의 손에서 나온 기여물
  - 여러분의 손의 헌물
  - 여러분의 손의 예물
  lexicon: HALOT
  rationale: 히브리어는 ‘손’을 포함해 개인이 직접 바쳐 드리는 것을 강조하므로, 단순히 ‘헌물’로 평평하게 만들지 않고 손의 이미지를 살렸습니다.
- source_word: נִדְרֵיכֶם / נִדְבֹתֵיכֶם
  english_pob_choice: your vow offerings / your freewill offerings
  chosen_korean: 여러분의 서원제물과 여러분의 자원제물
  alternatives_korean:
  - 여러분의 서원과 여러분의 자원 헌물
  - 여러분의 서원 예물과 자원 예물
  lexicon: HALOT
  rationale: 전자는 서원과 연관된 제물이고, 후자는 자원하여 드리는 제물이므로, 제의 문맥을 드러내는 ‘-제물’을 붙여 구별했습니다.
- source_word: בְּכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  english_pob_choice: the firstborn of your herd and of your flock
  chosen_korean: 여러분의 소 떼의 처음 난 것과 양 떼의 처음 난 것
  alternatives_korean:
  - 여러분의 가축 떼의 처음 난 것과 양 떼의 처음 난 것
  - 여러분의 큰 짐승 떼와 작은 짐승 떼의 처음 난 것
  lexicon: HALOT
  rationale: ‘소 떼/양 떼’는 히브리어의 대가축·소가축 병렬을 자연스럽게 옮기면서, ‘처음 난 것’의 제의적 의미를 유지합니다.
theological_decisions:
- issue: 제물 목록을 한국어에서 어떻게 구분해 드러낼 것인가
  chosen_reading: 번제, 희생제물, 십일조, 손의 기여물, 서원제물, 자원제물로 항목을 분리해 번역했습니다.
  alternative_readings:
  - 제사물/헌물로 넓게 묶어 번역
  - 몇 항목을 일반적인 ‘예물’로 통일
  rationale: 이 절은 제의 항목을 연속 열거하므로, 각 항목의 기능적 차이를 지우지 않고 구분하는 것이 본문의 규범적 지시를 살리는 데 중요합니다.
  doctrine_reference: Deuteronomy 12의 중앙 성소 규정과 제의 구별
