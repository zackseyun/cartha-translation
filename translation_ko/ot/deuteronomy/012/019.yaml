  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
  footnotes:
  - marker: a
    text: Or 'the Levites'; the Hebrew has the singular 'the Levite,' likely used representatively for the Levite as a class.
    reason: lexical_alternative
  - marker: b
    text: Or 'in your land.' The Hebrew literally says 'on your land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인을 평생 네 땅에서 버려두지 않도록 조심하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위인들’. 히브리어는 단수형 ‘레위인’을 쓰지만, 대표 단수로 레위인 계층 전체를 가리키는 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 땅 안에서’. 히브리어는 문자적으로 ‘네 땅 위에서’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 스스로를 조심하십시오
  lexicon: HALOT
  rationale: 자기를 경계하라는 경고 표현으로, 현대 한국어에서 자연스럽고 명령의 긴장을 살립니다.
- source_word: תַּעֲזֹב
  english_pob_choice: forsake
  chosen_korean: 버려두지 않도록
  alternatives_korean:
  - 저버리지 않도록
  - 버리지 않도록
  - 떠나지 않도록
  lexicon: HALOT
  rationale: 언약적·사회적 책임을 저버리는 뜻을 살리면서, 한국어로는 ‘버려두다’가 방치와 외면의 뉘앙스를 함께 담아 더 구체적입니다.
- source_word: אֶת הַלֵּוִי
  english_pob_choice: the Levite
  chosen_korean: 레위인
  alternatives_korean:
  - 레위 사람
  - 레위인들
  lexicon: HALOT
  rationale: 히브리어 단수 정관사 표현을 한국어에서는 대표 단수의 집단명으로 자연스럽게 옮겼습니다. POB의 대표 단수 판단을 반영합니다.
- source_word: כָּל יָמֶיךָ
  english_pob_choice: all your days
  chosen_korean: 평생
  alternatives_korean:
  - 모든 날 동안
  - 네 모든 날에
  - 네가 사는 동안
  lexicon: HALOT
  rationale: 직역적 ‘모든 날’도 가능하지만, 한국어에서는 ‘평생’이 동일한 총체적 기간을 가장 간결하게 전달합니다.
- source_word: עַל אַדְמָתֶךָ
  english_pob_choice: on your land
  chosen_korean: 네 땅에서
  alternatives_korean:
  - 네 땅 위에서
  - 네 땅에
  - 네 땅 안에서
  lexicon: HALOT
  rationale: 전치사 עַל의 문자적 ‘위에/…에서’ 감각을 살리되, 한국어에서 부자연스러운 ‘위에’를 피하고 장소 관계를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 대표 단수 ‘the Levite’의 처리
  chosen_reading: 레위인을 단수로 유지했습니다.
  alternative_readings:
  - 레위인들로 복수화
  rationale: 히브리어는 단수형을 쓰지만 집단 전체를 대표하는 용법이므로, 단수 유지가 원문 형식과 사회적 초점을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
