review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the imperative warning, the representative singular ‘Levite,’ the lifelong scope, and the land-related qualifier. However, ‘버려두다’ adds a somewhat concrete sense of leaving someone unattended, while עזב here more directly expresses forsaking or abandoning one’s obligation toward the Levite.
  naturalness: ‘평생 네 땅에서’ is understandable but places the locative phrase awkwardly after the duration. ‘네 땅에서 사는 모든 날 동안’ expresses the Hebrew sequence and scope more naturally in modern formal Korean.
  terminology: ‘레위인’ is appropriate and preserves the Hebrew representative singular. ‘저버리다’ is a natural formal rendering for the social-covenantal force of עזב without importing a specific doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘버려두지 않도록’ is not the closest Korean rendering of עזב in this context.
    rationale: It can imply leaving someone physically unattended or neglected. ‘저버리지 않도록’ better conveys forsaking the Levite and the associated obligation.
  - severity: low
    issue: The placement of ‘평생 네 땅에서’ is less clear and less idiomatic than a phrase that syntactically joins the duration and land qualifier.
    rationale: The Hebrew’s ‘all your days on your land’ is naturally represented by ‘네 땅에서 사는 모든 날 동안.’
  revised_text: 네 땅에서 사는 모든 날 동안 레위인을 저버리지 않도록 조심하십시오.[a][b]
