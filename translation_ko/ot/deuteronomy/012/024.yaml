  - 그것을 먹으면 안 됩니다
  lexicon: HALOT
  rationale: 금지 명령으로서의 법률 문맥을 살리면서, 목적어 대명사 '그것'을 유지해 바로 앞 문맥의 피를 가리키게 했습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: on the ground
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에
  - 지면에
  lexicon: HALOT
  rationale: 구체적 의식 지시에서 '땅/지면'의 평이한 물리적 표면을 드러내는 표현으로 옮겼습니다.
- source_word: תִּשְׁפְּכֶנּוּ
  english_pob_choice: you shall pour it out
  chosen_korean: 쏟아 부으십시오
  alternatives_korean:
  - 부으십시오
  - 쏟으십시오
  lexicon: HALOT
  rationale: שׁפך의 유출·붓기의 행위를 살리되, 피를 처리하는 의식 동작이라는 점을 자연스럽게 드러내기 위해 '쏟아 부으십시오'로 옮겼습니다.
- source_word: כַּמָּיִם
  english_pob_choice: like water
  chosen_korean: 물처럼
  alternatives_korean:
  - 물같이
  - 물과 같이
  lexicon: HALOT
  rationale: 비교구문을 직역하되 한국어 관용에 맞게 '물처럼'으로 간결하게 표현했습니다.
theological_decisions:
- issue: 목적어 생략과 피의 지시
  chosen_reading: 본문의 '그것'은 앞 문맥에서 이미 언급된 제물의 피를 가리키므로, 한국어 본문에는 '피'를 보충하지 않았습니다.
  alternative_readings:
  - '''피를 먹어서는 안 됩니다''처럼 명시적으로 풀어 쓰기'
  rationale: 히브리어는 대명사 어미로 대상을 가리키며, 이를 그대로 살리는 것이 원문 구조와 금지의 범위를 더 정확히 전달합니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥적 지시어 보존
