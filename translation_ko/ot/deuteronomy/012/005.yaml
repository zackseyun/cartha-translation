revisions:
- from: 그러나 주 당신들의 하나님이 당신들의 모든 지파 가운데서 택하실 곳, 곧 거기에 자신의 이름을 두시려고 하시고 자신의 거처를 두시려고 하시는 그곳으로는 당신들이 찾아가야 하며, 거기로 가야 합니다.[a]
  to: 그러나 당신들은 당신들의 하나님 야훼께서 당신들의 모든 지파 가운데서 자신의 이름을 그곳에 두시고 그분이 거하시기 위해 택하실 곳을 찾아야 하며, 그리로 가야 합니다.[a]
  rationale: 신명을 ‘야훼’로 복원하여 원문 및 영어 POB의 신명 방침을 따랐습니다. ‘거처를 두시려고’는 ‘그분이 거하시기 위해’로 고쳐 히브리어 שכן의 의미를 자연스러운 한국어로 반영했습니다. 본문의 통사적 모호성은 과도하게 해소하지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:50Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. יהוה는 영어 POB의 ‘Yahweh’ 및 제시된 신명 정책과 달리 ‘주’로 대체되어 있어 원문의 신명 표지가 사라졌습니다. 또한 לְשִׁכְנוֹ는 ‘자신의 거처를 두시려고’보다 ‘그분이 거하시기 위해/그분의 거처를 위해’로 옮기는 편이 원문의 ‘거함’ 의미와 압축성을 더 충실히 보존합니다.
  naturalness: 현 문장은 ‘곳, 곧 … 하시는 그곳으로는’이라는 중복과 ‘거처를 두시다’라는 부자연스러운 결합 때문에 현대 표준어 문장으로 매끄럽지 않습니다. 수정문은 원문의 목적어인 ‘곳’을 한 번만 제시하고, ‘찾아야 하며 … 가야 합니다’의 합쇼체 명령적 진술을 유지합니다.
  terminology: יהוה는 ‘야훼’로, אֱלֹהֵיכֶם은 ‘당신들의 하나님’으로 옮겼습니다. ‘이름을 두다’는 히브리어 관용을 유지했습니다. לְשִׁכְנוֹ의 통사적 연결이 논쟁될 수 있으므로, 본문은 최소한으로 ‘그분이 거하시기 위해’라 하고 각주에서 대안적 연결을 명시했습니다.
  issues:
  - severity: high
    issue: יהוה를 ‘주’로 번역함
    rationale: 제공된 영어 POB 본문은 ‘Yahweh’를 사용하며, 번역 결정도 신명을 음역하도록 명시합니다. ‘주’는 원문의 고유 신명을 칭호로 대체합니다.
  - severity: medium
    issue: לְשִׁכְנוֹ를 ‘자신의 거처를 두시려고’로 풀이함
    rationale: ‘거처를 두다’는 한국어에서 자연스럽지 않고, 원문의 ‘거하다/거처를 위해’라는 압축된 표현에 ‘거처를 설치하다’라는 불필요한 동작을 더합니다.
  - severity: medium
    issue: 장소 지시와 문장 구조의 중복
    rationale: ‘택하실 곳, 곧 … 그곳으로는’은 장소를 중복해 제시하며 문장 호응을 무겁게 합니다.
