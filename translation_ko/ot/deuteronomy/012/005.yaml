id: DEU.12.5
reference: Deuteronomy 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
  footnotes:
  - marker: a
    text: Or 'to set his name there for his dwelling'; the Hebrew of this clause is compact, and translations differ on whether it emphasizes God's dwelling, the place as his dwelling, or both.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 당신들은 당신들의 하나님 야훼께서 당신들의 모든 지파 가운데서 자신의 이름을 그곳에 두시고 그분이 거하시기 위해 택하실 곳을 찾아야 하며, 그리로 가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 이름을 그곳에 두시기 위해, 곧 그분의 거처를 위해 택하실 곳’; 이 절의 히브리어는 압축적이어서, ‘거하심/거처를 위해’가 하나님의 이름을 두심과 어떻게 연결되는지, 또는 그 장소 자체를 하나님의 거처로 가리키는지가 번역에 따라 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 다만
  - 오히려
  lexicon: HALOT
  rationale: 앞선 부정 명령에 이어지는 대조적 대안을 자연스럽게 여는 접속사로, 문맥상 ‘그러나’가 가장 간결하고 분명합니다.
- source_word: מָקוֹם
  english_pob_choice: the place
  chosen_korean: 그곳
  alternatives_korean:
  - 그 장소
  - 그 자리
  - 그 장소로
  lexicon: HALOT
  rationale: 본문은 하나님이 택하실 특정한 예배 장소를 가리키므로, 반복을 줄이면서도 지시성을 살리는 ‘그곳’이 적절합니다.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  english_pob_choice: to put his name there
  chosen_korean: 거기에 자신의 이름을 두시려고 하시고
  alternatives_korean:
  - 거기에 자신의 이름을 두려고 하시고
  - 거기에 자신의 이름을 두시며
  - 거기에 자신의 이름을 세우시려고 하시고
  lexicon: HALOT
  rationale: ‘이름을 두다’는 히브리어 관용을 직역에 가깝게 살리며, 하나님의 공적 임재와 권위의 표지를 유지합니다.
- source_word: לְשִׁכְנוֹ
  english_pob_choice: for his dwelling
  chosen_korean: 자신의 거처를 두시려고 하시는
  alternatives_korean:
  - 자신의 거처로
  - 자신이 거하실 곳으로
  - 자신의 거주를 위하여
  lexicon: HALOT
  rationale: 이 형태는 ‘거처/거주’의 명사적 뉘앙스를 지니므로, ‘거처를 두시려고 하시는’으로 풀어 뜻을 분명하게 하되 과도한 신학적 해석은 피했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: ‘야훼’ 대신 본문에는 ‘주 당신들의 하나님’으로 옮겼습니다.
  alternative_readings:
  - 야훼 당신들의 하나님
  - 주님 당신들의 하나님
  rationale: 이 절의 영어 POB가 이미 ‘the LORD your God’로 정리한 상태를 따라, 한국어 본문에서는 문맥상 통용성과 가독성을 고려해 ‘주’로 처리했습니다. 다만 소스 직역 가능성은 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH default rendering; source-grounded auditable translation'
