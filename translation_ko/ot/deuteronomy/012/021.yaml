  source_fidelity: 개정이 필요합니다. 초안은 יְהוָה를 '주'로 옮겨 제공된 영어 POB의 'Yahweh' 원칙 및 원문 표기와 맞지 않으며, וְזָבַחְתָּ를 '살피어'로 옮겨 '도살하다/잡다'라는 뜻을 잃었습니다. 또한 כַּאֲשֶׁר צִוִּיתִךָ의 1인칭 화자(모세)를 '내가 네게 명한 대로'로 밝혀야 합니다.
  naturalness: '''도살하여''는 이 법률 문맥에서 제의 행위로 한정하지 않는 זבח의 뜻을 분명히 하며, 전체를 현대 표준어 합쇼체로 정리했습니다. ''소 떼와 양 떼'' 및 ''네 마음이 원하는 대로''는 자연스럽고 원문의 범위를 보존합니다.'
  terminology: '''야훼''로 신명을 음역하고, בִּשְׁעָרֶיךָ는 직역인 ''네 성문 안에서''를 유지하되 각주에서 도시·거주지의 환유적 용법을 설명했습니다. נֶפֶשׁ는 여기서 독립된 영혼론 용어라기보다 개인의 욕구·식욕을 나타내므로 본문에서는 관용적으로 옮기고 각주에 직역 가능성을 남겼습니다.'
