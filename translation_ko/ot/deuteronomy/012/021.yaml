base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
  footnotes:
  - marker: a
    text: Or 'in your towns'; literally 'within your gates.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whatever your soul desires' / 'according to all your appetite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 하나님 야훼께서 자신의 이름을 두시려고 택하실 곳이 네게서 너무 멀리 있으면, 내가 네게 명한 대로 야훼께서 네게 주신 네 소 떼와 양 떼 가운데서 도살하여, 네 성문 안에서[a] 네 마음이 원하는 대로[b] 먹으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '네 성문 안에서'입니다. 히브리어에서 '성문'은 흔히 각자의 도시나 거주지를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '네 영혼의 모든 욕망에 따라'입니다. 여기서 '영혼'은 개인의 욕구 또는 식욕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָקוֹם
  english_pob_choice: place
  chosen_korean: 장소
  alternatives_korean: 곳, 땅
  lexicon: WLC
  rationale: Contextual reference to the central sanctuary; '장소' is neutral and precise compared to '곳' (too colloquial) or '땅' (too geographical).
- source_word: שְׁעָרֶי/ךָ
  english_pob_choice: gates
  chosen_korean: 성문
  alternatives_korean: 문, 성
  lexicon: WLC
  rationale: Refers to the city limits/judicial area; '성문' preserves the specific legal and spatial boundary implied in Deuteronomy better than generic '문'.
- source_word: אַוַּת נַפְשֶׁ/ךָ
  english_pob_choice: desire of your soul
  chosen_korean: 마음이 원하는 대로
  alternatives_korean: 영혼의 욕심, 모든 소망
  lexicon: WLC
  rationale: Idiomatic expression for personal appetite; '마음이 원하는 대로' balances the literal 'soul' with the functional meaning of 'desire' in modern formal Korean.
theological_decisions:
- decision: Use of '주' for YHWH
  rationale: Maintains the divine name's sanctity while adhering to standard Korean Protestant convention for 'Yahweh' in formal contexts.
- decision: Preservation of '성문 안에서'
  rationale: Retains the theological shift from the Tabernacle/Temple to the local city gates, emphasizing the decentralization of sacrificial eating permitted in this verse.
