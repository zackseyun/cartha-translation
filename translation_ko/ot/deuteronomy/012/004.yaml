  rationale: '''그렇게''는 바로 앞 문맥을 가리키는 지시어이므로, 본문은 앞절의 파괴 방식 전체를 야훼께 적용하지 말라는 금지로 읽어야 합니다.'
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
