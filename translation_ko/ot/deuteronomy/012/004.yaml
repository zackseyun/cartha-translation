    text: 히브리어는 하나님의 이름 יְהוָה를 사용합니다. 전통적으로는 '여호와'로 옮기지만, 여기서는 '야훼'를 택했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן כֵּן
  english_pob_choice: You shall not do so
  chosen_korean: 그렇게 … 하지 마십시오
