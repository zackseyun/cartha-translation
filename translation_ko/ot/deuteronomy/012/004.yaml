  - 여러분의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유격을 분명히 반영해 '당신들의 하나님'으로 옮겼고, 예배 규정의 공동체 خطاب을 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
