translation:
  language: ko
  text: 너희 하나님 야훼께 그렇게 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '그렇게'는 앞 절들에서 명령한 이방 민족의 예배 처소를 파괴하는 방식을 가리킵니다. 이스라엘은 야훼를 그와 같은 방식으로 대해서는 안 됩니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 하나님의 이름 יְהוָה를 사용합니다. 전통적으로는 '여호와'로 옮기지만, 여기서는 '야훼'로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן כֵּן
  english_pob_choice: You shall not do so
  chosen_korean: 그렇게 … 하지 마십시오
  alternatives_korean:
  - 그리하지 마십시오
  - 그렇게 하지 마십시오
  lexicon: HALOT
  rationale: 금지의 핵심은 앞절의 이방 제의 처리를 야훼께 동일하게 적용하지 말라는 데 있으므로, 지시어 כֵּן을 받아 '그렇게'로 옮겨 문맥 연결을 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh / to the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문은 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유 신명은 '야훼'로 옮겨 언약 სახელ의 직접성을 드러냈습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 너희 하나님
  - 여러분의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유격을 분명히 반영해 '당신들의 하나님'으로 옮겼고, 예배 규정의 공동체 خطاب을 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB 기본 원칙에 따라 신명은 본문에서 드러나는 언약 이름을 보존하는 방향으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 금지문의 범위
  chosen_reading: 앞서 언급된 이방 제의 처리 방식을 야훼께 동일하게 행하지 말라는 금지
  alternative_readings:
  - 단순히 특정 제의 장소 파괴만 금지하는 좁은 읽기
  rationale: '''그렇게''는 바로 앞 문맥을 가리키는 지시어이므로, 본문은 앞절의 파괴 방식 전체를 야훼께 적용하지 말라는 금지로 읽어야 합니다.'
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
