  text: 그렇게 야훼 당신들의 하나님께 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '그렇게'는 앞선 절들에서 명령한 이방 제의 처소 처리 방식을 가리킵니다.
