  - 여호와
  rationale: POB 기본 원칙에 따라 신명은 본문에서 드러나는 언약 이름을 보존하는 방향으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 금지문의 범위
  chosen_reading: 앞서 언급된 이방 제의 처리 방식을 야훼께 동일하게 행하지 말라는 금지
  alternative_readings:
