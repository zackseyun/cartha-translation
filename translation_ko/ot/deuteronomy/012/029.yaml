  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: ko
  text: 주 당신의 하나님 야훼께서, 당신이 그들의 땅을 차지하러 들어가는 그 민족들을 당신 앞에서 끊어 버리시고, 당신이 그들을 차지하여 그들의 땅에 살게 되면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘차지하다/소유하다’(ירש)의 정복·정착 맥락을 살려 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: -게 되면
  alternatives_korean:
  - -할 때
  - -하실 때
  lexicon: HALOT
  rationale: 앞절의 미래 상황을 여는 시간·조건적 연결을 한국어 종속절로 자연스럽게 살렸습니다.
- source_word: יַכְרִית
  english_pob_choice: cuts off
  chosen_korean: 끊어 버리시고
  alternatives_korean:
  - 멸하시고
  - 몰아내시고
  lexicon: HALOT
  rationale: כרת의 제거·절단 이미지를 살리면서, 문맥상 민족을 앞에서 제거하신다는 힘을 유지했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 그 민족들
  alternatives_korean:
  - 그 나라들
  - 그 이방 민족들
  lexicon: HALOT
  rationale: 여기서는 특정 토착 집단들을 가리키므로 ‘민족들’이 가장 자연스럽고 직접적입니다.
- source_word: לָרֶשֶׁת אֹתָם / וְיָרַשְׁתָּ אֹתָם
  english_pob_choice: to dispossess / and you dispossess them
  chosen_korean: 차지하러 / 차지하여
  alternatives_korean:
  - 빼앗으러 / 빼앗아
  - 소유하려고 / 소유하고
  lexicon: HALOT
  rationale: ירש의 토지·정착 맥락을 따라 단순 소유보다 ‘차지하다’가 더 정확하며, 문맥상 주민을 몰아내고 그 땅을 차지하는 뜻을 유지합니다.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  english_pob_choice: and dwell in their land
  chosen_korean: 그들의 땅에 살게 되면
  alternatives_korean:
  - 그들의 땅에 거주하게 되면
  - 그들의 땅에 정착하게 되면
  lexicon: HALOT
  rationale: ישב는 ‘살다/거주하다/정착하다’의 뜻이지만, 한국어에서는 ‘살다’가 가장 자연스러우면서도 결과 상태를 잘 드러냅니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 주 당신의 하나님 야훼
  alternatives_korean:
  - 야훼 당신의 하나님
  - 주 너의 하나님
  lexicon: HALOT
  rationale: 야훼는 본문상의 신명이고, 한국어 합쇼체 관용에 맞게 호칭을 앞에 두어 ‘주 당신의 하나님 야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/주/LORD에 해당하는 YHWH의 처리
  chosen_reading: 본문의 신명 יְהוָה는 ‘야훼’로 옮기고, 한국어 경어 흐름을 위해 앞에 ‘주’를 덧붙였습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: POB의 기준은 신명 자체를 보존하는 것이며, 한국어 문장에서는 ‘주’가 호칭 역할을 하고 ‘야훼’가 고유명을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
