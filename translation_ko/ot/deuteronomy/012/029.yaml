  - severity: high
    issue: ‘그들을 차지하러/그들을 차지하여’는 사람을 소유한다는 뜻으로 읽힐 수 있습니다.
    rationale: ירש의 직접목적어는 ‘민족들’이지만, 이 문맥에서는 그들을 몰아내어 그 땅을 차지하는 행위를 뜻합니다. 한국어에서는 ‘그들을 몰아내고’가 의미를 더 정확하고 자연스럽게 전달합니다.
  - severity: low
    issue: 각주가 본문 표현 ‘차지하다’를 전제로 하여 수정된 번역과 맞지 않습니다.
    rationale: 수정 본문에서는 ירש를 ‘몰아내다’로 옮기므로, 각주도 해당 문맥적 의미를 설명하도록 조정해야 합니다.
