base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'your sons after you' or more broadly 'your descendants after you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 먹지 마십시오[a]. 당신과 당신 뒤를 이을 자녀들이 잘되도록, 당신이 야훼께서 보시기에 옳은 일을 행할 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신 뒤를 이을 아들들’; 더 넓게는 ‘당신 뒤를 이을 후손들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  english_pob_choice: eat it
  chosen_korean: 그것을 먹지 마십시오
  alternatives_korean:
  - 그것을 먹어서는 안 됩니다
  - 그것을 먹지 말아야 합니다
  lexicon: HALOT
  rationale: 직접 목적어가 앞서 언급된 피를 가리키므로, 금지형으로 간단하고 직접적으로 옮겼습니다.
- source_word: יִיטַב לְךָ
  english_pob_choice: it may go well with you
  chosen_korean: 당신에게 잘될 것입니다
  alternatives_korean:
  - 당신에게 복이 있을 것입니다
  - 당신이 형통할 것입니다
  lexicon: HALOT
  rationale: 신명기의 언약적 관용구를 현대 한국어로 자연스럽게 살리되, 성공/번영으로 좁히지 않도록 했습니다.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  english_pob_choice: and with your children after you
  chosen_korean: 당신 뒤의 당신의 자녀들에게
  alternatives_korean:
  - 당신 뒤의 당신의 아들들에게
  - 당신 뒤의 당신의 후손들에게
  lexicon: HALOT
  rationale: בנים의 남성형을 그대로 ‘아들들’로 제한하지 않고, 가계의 다음 세대를 가리키는 뜻을 살려 ‘자녀들’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼의 보시기에
  - 야훼 앞에
  lexicon: HALOT
  rationale: ‘눈에’는 히브리어 관용구를 비교적 직접적으로 반영하며, 하나님의 평가를 가시적으로 드러내는 표현을 보존합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 직접 사용하는 신명기적 고유명사를 보존하기 위해, 대체 칭호가 아닌 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘children after you’의 범위
  chosen_reading: 자녀들
  alternative_readings:
  - 아들들
  - 후손들
  rationale: 언약적 결과가 성별에 제한되지 않고 다음 세대로 이어진다는 점을 드러내면서도, 히브리어 가족 언어의 구체성을 유지합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
