base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
  footnotes:
  - marker: a
    text: Or 'dwell securely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희가 요단을 건너, 너희의 하나님 야훼께서 너희에게 기업으로 주시는 땅에 살게 되고, 그분께서 너희의 모든 원수들로부터 사방에서 너희에게 안식을 주시면, 너희는 안전하게 살게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안전하게 거주하다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַרְתֶּם / אֶת הַיַּרְדֵּן
  english_pob_choice: when you cross the Jordan
  chosen_korean: 요단을 건너
  alternatives_korean:
  - 요단을 건너갈 때
  - 요단강을 건너
  lexicon: HALOT
  rationale: 미래 지향적 조건/시점의 흐름을 한국어로 자연스럽게 살리되, ‘요단’은 지명으로 간결하게 유지했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희의 하나님 여호와
  - 너희 하나님 야훼
  lexicon: HALOT
  rationale: 본문의 신명기적 언약명은 프로젝트 기준에 따라 ‘야훼’로 옮기고, 소유관계는 ‘너희의 하나님’으로 분명히 했습니다.
- source_word: מַנְחִיל אֶתְכֶם
  english_pob_choice: is giving you to inherit
  chosen_korean: 너희에게 기업으로 주시는
  alternatives_korean:
  - 너희가 기업으로 받게 하시는
  - 너희에게 상속하게 하시는
  lexicon: HALOT
  rationale: נחל의 사역형은 단순 ‘주다’보다 ‘기업으로 주다’가 소유·상속의 뉘앙스를 더 직접적으로 반영합니다.
- source_word: וְהֵנִיחַ לָכֶם
  english_pob_choice: and he gives you rest
  chosen_korean: 그분께서 너희에게 안식을 주시면
  alternatives_korean:
  - 그분께서 너희에게 휴식을 주시면
  - 그분께서 너희를 쉬게 하시면
  lexicon: HALOT
  rationale: נוח의 ‘쉬게 하다/안식 주다’를 본문 문맥의 평화·정착 의미에 맞춰 ‘안식’을 택했습니다.
- source_word: בֶּטַח
  english_pob_choice: in safety / dwell securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안하게
  - 안심하고
  lexicon: HALOT
  rationale: בטח의 핵심 의미는 안전·신뢰의 상태이므로, 정착 생활의 결과로서 ‘안전하게 살게 될 것입니다’가 자연스럽습니다.
theological_decisions:
- issue: 여호와 / 야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문은 신명기에서 언약적 신명 YHWH를 직접 사용하므로, 프로젝트 기준에 따라 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘안식’의 신학적 뉘앙스
  chosen_reading: 안식
  alternative_readings:
  - 평안
  - 휴식
  rationale: 본문의 ‘그분께서 너희에게 안식을 주시면’은 단순한 신체적 휴식보다, 원수들로부터의 해방과 정착이 동반되는 언약적 안식을 가리킵니다.
  doctrine_reference: Deuteronomy rest motif
