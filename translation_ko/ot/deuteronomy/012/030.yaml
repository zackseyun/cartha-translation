base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: ko
  text: 조심하여 스스로를 지키십시오. 그들 뒤를 따라가다 그들이 여러분 앞에서 멸망한 뒤에 덫에 걸리지 않도록 하십시오. 또 그들의 신들에 대해 묻기를, “이 민족들은 자기들의 신들을 어떻게 섬겼는가? 나도 그와 같이 하겠다”라고 말하지 않도록 하십시오.
  philosophy: formal
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful for yourself
  chosen_korean: 조심하여 스스로를 지키십시오
  alternatives_korean:
  - 스스로 삼가십시오
  - 주의하십시오
  lexicon: הִשָּׁמֶר
  rationale: 단순한 경고보다 자기 보호를 강조하는 재귀적 뉘앙스를 살려, POB의 ‘for yourself’를 반영했습니다.
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵי הֶם
  english_pob_choice: lest you be ensnared after them
  chosen_korean: 그들 뒤를 따라가다 … 덫에 걸리지 않도록 하십시오
  alternatives_korean:
  - 그들을 따라 덫에 빠지지 않도록 하십시오
  - 그들 뒤를 좇다가 올가미에 걸리지 않도록 하십시오
  lexicon: נקש
  rationale: נקש의 ‘덫/올가미에 걸리다’ 이미지를 살리되, 한국어로는 자연스러운 ‘덫에 걸리다’로 옮겼습니다.
- source_word: אַחֲרֵי הִשָּׁמְדָם מִפָּנֶיךָ
  english_pob_choice: after they have been destroyed from before you
  chosen_korean: 그들이 여러분 앞에서 멸망한 뒤에
  alternatives_korean:
  - 그들이 여러분 앞에서 멸절된 뒤에
  - 그들이 여러분 앞에서 사라진 뒤에
  lexicon: שמד
  rationale: 원문의 ‘사라짐’이 아니라 심판적 소멸을 뜻하는 שׁמד의 강한 의미를 반영해 ‘멸망’으로 옮겼습니다.
- source_word: וְפֶן תִּדְרֹשׁ לֵאלֹהֵיהֶם
  english_pob_choice: and lest you inquire about their gods
  chosen_korean: 또 그들의 신들에 대해 묻기를
  alternatives_korean:
  - 또 그들의 신들을 찾기를
  - 또 그들의 신들에게 문의하기를
  lexicon: דרש + אלוהים
  rationale: דרש의 탐문·조사 의미를 살려 ‘묻다’로 옮기고, 문맥상 우상 숭배 대상인 ‘그들의 신들’로 분명히 했습니다.
- source_word: אֵיכָה יַעַבְדוּ הַגּוֹיִם הָאֵלֶּה אֶת אֱלֹהֵיהֶם
  english_pob_choice: How did these nations serve their gods
  chosen_korean: 이 민족들은 자기들의 신들을 어떻게 섬겼는가
  alternatives_korean:
  - 이 민족들은 자기들의 신들을 어떤 식으로 섬겼는가
  - 이 민족들은 자기들의 신들에게 어떻게 예배했는가
  lexicon: עבד
  rationale: עבד는 종교적 봉사/예배의 넓은 범위를 포함하므로, 문맥에 맞는 ‘섬기다’를 유지했습니다.
theological_decisions:
- issue: 우상 숭배를 금지하는 반복 경고의 표현 강도
  chosen_reading: 단순한 정보 탐색이 아니라, 이방 종교 관행을 모방하려는 마음 자체를 경계하는 경고로 번역했습니다.
  alternative_readings:
  - 중립적으로 ‘알아보다’로 약화
  - 명시적 우상 숭배 경고를 덜 드러내는 번역
  rationale: 본문은 관찰이 아니라 모방 의도를 금하므로, POB의 ‘so that I too may do the same’에 맞춰 목적절을 분명히 했습니다.
  doctrine_reference: 언약 백성의 분리와 우상 숭배 금지(신 12장 문맥)
