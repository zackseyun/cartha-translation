base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
  footnotes:
  - marker: a
    text: Or, 'except at the place that the LORD will choose.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in one of your tribes,' that is, within the territory of one of Israel's tribes.
    reason: cultural_note
translation:
  language: ko
  text: 오직 여호와께서 너희 지파 중 하나를 택하신 그 곳에서만 너희 번제를 드리며 내가 네게 명한 모든 것을 거기서 행하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '네 지파 중 하나'는 이스라엘 지파들의 영토 내를 의미합니다.
    source: WLC
lexical_decisions:
- source_word: כִּ֣י אִם
  english_pob_choice: but only
  chosen_korean: 오직
  alternatives_korean: 그러나, 다만
  lexicon: WLC
  rationale: The phrase כִּי אִם functions as a restrictive conjunction here, emphasizing exclusivity of the location. '오직' best captures this exclusive constraint in modern formal Korean.
- source_word: יִבְחַ֤ר
  english_pob_choice: will choose
  chosen_korean: 택하신
  alternatives_korean: 선택하실, 고르실
  lexicon: WLC
  rationale: The verb is future tense but implies a divine decision already established or to be realized. '택하신' (past participle used for future certainty) aligns with the theological weight of God's sovereign choice.
- source_word: שְׁבָטֶ֔י/ךָ
  english_pob_choice: tribes
  chosen_korean: 지파
  alternatives_korean: 부족, 지체
  lexicon: WLC
  rationale: '''지파'' is the standard modern theological term for ''shevet'' in the context of Israel''s tribal structure, avoiding archaic ''부족'' which may carry different connotations.'
- source_word: תַּעֲלֶ֣ה
  english_pob_choice: offer up
  chosen_korean: 드리며
  alternatives_korean: 올려라, 바치라
  lexicon: WLC
  rationale: The verb 'alah' (to go up) in sacrificial context implies bringing an offering to the altar. '드리다' is the standard polite formal term for offering sacrifices.
theological_decisions:
- decision: Centralization of Worship
  rationale: The translation emphasizes the exclusive nature of the worship location ('그 곳에서만'), reflecting the Deuteronomic centralization law which forbids worship at any other place.
- decision: Divine Sovereignty
  rationale: The phrase '여호와께서... 택하신' highlights that the location is not determined by human choice but by Yahweh's sovereign will.
