revisions:
- from: 그렇지만 야훼 당신의 하나님 앞에서, 야훼 당신의 하나님이 택하실 장소에서, 당신과 당신의 아들과 당신의 딸과 당신의 남종과 당신의 여종과 당신의 성문 안에 있는 레위 사람과 함께 그것을 먹어야 합니다. 그리고 당신은 야훼 당신의 하나님 앞에서, 당신의 손이 내미는 모든 일에 기뻐해야 합니다.[a][b]
  to: 오직 당신의 하나님 야훼 앞에서, 당신의 하나님 야훼께서 택하실 곳에서, 당신과 당신의 아들과 당신의 딸과 당신의 남종과 당신의 여종과 당신의 성문 안에 있는 레위인[b]과 함께 그것을 먹어야 합니다. 그리고 당신의 하나님 야훼 앞에서 당신이 손대는 모든 일에 관하여 기뻐해야 합니다.[a]
