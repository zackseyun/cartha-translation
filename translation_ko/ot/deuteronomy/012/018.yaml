  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
  footnotes:
  - marker: a
    text: Or, more literally, 'within your gates,' a Hebrew idiom for those living in your local community.
    reason: cultural_note
  - marker: b
    text: Literally, 'in all the sending forth of your hand'; that is, in all that you do or undertake.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지만 야훼 당신의 하나님 앞에서, 야훼 당신의 하나님이 택하실 장소에서, 당신과 당신의 아들과 당신의 딸과 당신의 남종과 당신의 여종과 당신의 성문 안에 있는 레위 사람과 함께 그것을 먹어야 합니다. 그리고 당신은 야훼 당신의 하나님 앞에서, 당신의 손이 내미는 모든 일에 기뻐해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 손이 내미는 모든 일’은 문자적으로는 ‘손의 모든 내밈/일’이며, 곧 당신이 하는 모든 일·시도하는 모든 일을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문 안에 있는’은 문자적으로는 ‘당신의 문들 안에 있는’입니다. 히브리어 관용구로서 지역 공동체 안에 거주하는 사람을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: Instead
  chosen_korean: 그렇지만
  alternatives_korean:
  - 오직
  - 대신에
  - 그런데
  lexicon: HALOT
  rationale: 이전 절의 금지에 대한 제한적 대비를 살려 ‘오직/대신에’보다 자연스럽고 문맥상 분명한 전환으로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: before Yahweh your God
  chosen_korean: 야훼 당신의 하나님 앞에서
  alternatives_korean:
  - 야훼 당신의 하나님 면전에서
  - 야훼 당신의 하나님 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미인 ‘앞에서/면전에’를 살리되, 한국어에서는 ‘앞에서’가 가장 자연스럽고 의례적 의미도 유지합니다.
- source_word: וְשָׂמַחְתָּ
  english_pob_choice: and you shall rejoice
  chosen_korean: 기뻐해야 합니다
  alternatives_korean:
  - 즐거워해야 합니다
  - 기뻐할 것입니다
  lexicon: HALOT
  rationale: 명령·권면의 힘을 유지하면서 한국어에서 예배적/공동체적 기쁨을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  english_pob_choice: in all that you undertake
  chosen_korean: 당신의 손이 내미는 모든 일에
  alternatives_korean:
  - 당신이 하는 모든 일에
  - 당신의 모든 수고에
  - 당신이 손대는 모든 일에
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀지 않고 ‘손이 내미는’으로 살려, POB의 주석적 선택과 원문의 비유성을 함께 반영했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약명은 직역적 음역인 ‘야훼’로 유지하여 고유명과 호칭을 구별했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 공동체 범주인 ‘게이트/성문’ 표현
  chosen_reading: 당신의 성문 안에 있는 레위 사람
  alternative_readings:
  - 당신의 성읍 안에 있는 레위 사람
  - 당신의 마을 안에 있는 레위 사람
  rationale: בִּשְׁעָרֶיךָ의 관용적 공동체/거주권 표현을 살리기 위해 문자적 이미지인 ‘성문 안에’로 두었습니다.
  doctrine_reference: Source idiom preservation
