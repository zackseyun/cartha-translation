  source_fidelity: ‘그렇지만’은 앞 절의 금지에 대한 כִּי אִם의 제한적 대조(‘오직/다만’)를 충분히 나타내지 못합니다. 또한 ‘당신의 손이 내미는 모든 일’은 한국어 관용으로 자연스럽지 않습니다. 나머지 참여자 목록, 선택하실 장소, 야훼라는 신명, 그리고 기뻐하라는 명령은 원문에 충실합니다.
  naturalness: ‘야훼 당신의 하나님’은 한국어 명사구 어순상 다소 부자연스럽습니다. ‘당신의 하나님 야훼’가 더 자연스럽습니다. ‘레위 사람’보다 성경 용어인 ‘레위인’이 적절하며, ‘당신이 손대는 모든 일’이 히브리어 관용구를 자연스러운 한국어로 전달합니다.
  terminology: יְהוָה는 제공된 POB 결정에 따라 ‘야훼’로 유지했습니다. הַלֵּוִי는 ‘레위인’으로, 남녀 종의 구별은 ‘남종’과 ‘여종’으로 유지했습니다. בִּשְׁעָרֶיךָ의 문자적 ‘성문 안’은 본문에 보존하고 관용적 뜻은 해당 위치의 각주로 설명했습니다.
