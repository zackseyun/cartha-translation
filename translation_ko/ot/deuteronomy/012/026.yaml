source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
  footnotes:
  - marker: a
    text: Or 'your vows'; the Hebrew can refer either to the vows themselves or, in this sacrificial context, to the offerings brought in fulfillment of those vows.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 네가 가진 거룩한 것들과 네 서원 예물은 가지고, 야훼께서 택하실 곳으로 가십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 서원들’; 히브리어는 서원 자체를 가리킬 수도 있고, 이 제의 문맥에서는 그 서원을 이행하기 위해 드리는 예물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: But only
  chosen_korean: 그러나 오직
  alternatives_korean:
  - 오직
  - 다만
  lexicon: HALOT
  rationale: 앞선 허용 사항에 대한 제한과 대비를 함께 드러내기 위해 ‘그러나 오직’으로 옮겼습니다.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  english_pob_choice: your holy things that belong to you
  chosen_korean: 네게 있는 네 거룩한 것들
  alternatives_korean:
  - 네 거룩한 예물들
  - 네가 가진 거룩한 것들
  lexicon: HALOT
  rationale: 문맥상 제의적으로 구별된 물건들을 가리키므로 ‘거룩한 것들’로 넓게 살리고, 소유 관계는 ‘네게 있는’으로 자연스럽게 드러냈습니다.
- source_word: וּנְדָרֶיךָ
  english_pob_choice: and your vow offerings
  chosen_korean: 네 서원 예물
  alternatives_korean:
  - 네 서원들
  - 네가 서원한 것들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘네 서원들’이지만, 희생 제의 맥락에서는 서원 성취를 위한 예물을 가리킬 수 있으므로 ‘서원 예물’로 구체화했습니다.
- source_word: תִּשָּׂא וּבָאתָ
  english_pob_choice: you shall carry and come
  chosen_korean: 가지고 가서…가십시오
  alternatives_korean:
  - 지고 가서…가십시오
  - 들고 가서…가십시오
  lexicon: HALOT
  rationale: ‘지다/들다’의 물리적 이미지보다 제물 운반의 실제 행동을 자연스럽게 전달하기 위해 ‘가지고 가서’로 옮겼습니다.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  english_pob_choice: the place that Yahweh will choose
  chosen_korean: 야훼께서 택하실 곳
  alternatives_korean:
  - 야훼께서 선택하실 곳
  - 야훼께서 고르실 곳
  lexicon: HALOT
  rationale: 신명기의 정형 표현을 살리면서도 한국어에서 자연스러운 ‘택하실 곳’으로 옮겼습니다.
theological_decisions:
- issue: 서원 관련 표현의 제의적 의미
  chosen_reading: ‘서원 예물’로 번역해, 단순한 말의 서원보다 그 이행을 위한 제물을 함께 떠올리게 했습니다.
  alternative_readings:
  - ‘네 서원들’
  - ‘네가 서원한 것’
  rationale: 이 절은 성소로 가져가는 제물을 말하는 문맥이므로, 히브리어의 폭을 유지하되 제의적 함의를 분명히 하는 번역이 필요합니다.
  doctrine_reference: Deuteronomy 12 제의 문맥
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본어에 따라 신명기를 비롯한 구약 본문에서 신명 자체를 드러내는 표기를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
