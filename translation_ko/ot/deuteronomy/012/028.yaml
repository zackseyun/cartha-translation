source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'Keep and hear all these words'; the Hebrew combines verbs for careful keeping and attentive hearing, with obedience implied by the context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons'; here rendered 'children' in the broader sense of offspring/posterity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 말씀을 내가 당신에게 명령하는 대로 삼가 지키고 들으십시오[a]. 그러면 당신과 당신의 자녀에게 영원히 잘될 것입니다[b]. 이는 당신이 야훼 당신의 하나님 보시기에 선하고 바른 일을 하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘지키다’와 ‘듣다’를 함께 써서, 단순 청취가 아니라 주의 깊은 준수와 경청을 함께 요구합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘아들들’은 여기서 후대 전체를 가리키는 언약적 표현이므로, 더 넓은 의미의 ‘자녀’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  english_pob_choice: Be careful to listen to
  chosen_korean: 삼가 지키고 들으십시오
  alternatives_korean:
  - 잘 지키고 들으십시오
  - 주의 깊게 듣고 따르십시오
  - 삼가 듣고 지키십시오
  lexicon: HALOT
  rationale: שׁמר와 שׁמע의 결합은 단순 청취보다 주의 깊은 준수와 경청을 함께 요구하므로, 한국어에서는 두 동사를 모두 살려 ‘지키고 들으십시오’로 옮겼습니다. ‘삼가’는 명령의 긴장을 자연스럽게 살립니다.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말씀
  alternatives_korean:
  - 이 모든 말
  - 이 모든 명령
  - 이 모든 것
  lexicon: HALOT
  rationale: דְּבָרִים는 문자적으로 ‘말씀들’이므로, 명령의 내용을 가리키는 자연스러운 한국어로 ‘말씀’이 가장 직접적입니다.
- source_word: בָּנֶיךָ
  english_pob_choice: your children
  chosen_korean: 당신의 자녀
  alternatives_korean:
  - 당신의 아들들
  - 당신의 자손
  - 당신의 후손
  lexicon: HALOT
  rationale: 언약적 후손을 가리키는 남성 복수형이지만, 여기서는 성별을 좁히기보다 후대 전체를 뜻하는 넓은 의미를 살려 ‘자녀’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: in the eyes of Yahweh your God
  chosen_korean: 야훼 당신의 하나님 보시기에
  alternatives_korean:
  - 야훼 당신의 하나님 앞에서
  - 야훼 당신의 하나님 눈에
  - 야훼 당신의 하나님이 보시기에
  lexicon: HALOT
  rationale: ‘눈에/보시기에’는 히브리어의 평가 관용구를 가장 직접적으로 드러내며, 하나님의 판단 기준을 분명하게 전달합니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 여호와(יהוה)는 개인 이름이므로, 본 프로젝트 기준에 따라 호칭 대체어인 ‘주’가 아니라 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 명령형의 결합 표현
  chosen_reading: 삼가 지키고 들으십시오
  alternative_readings:
  - 삼가 듣고 지키십시오
  - 지켜 듣으십시오
  - 잘 지키고 들으십시오
  rationale: 히브리어의 두 동사(지키다/듣다)를 둘 다 드러내되, 한국어에서 명령의 무게와 자연스러움을 함께 살리기 위해 공손한 명령형으로 정리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (Source transparency over smoothing)
