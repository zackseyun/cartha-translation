  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
  footnotes:
  - marker: a
    text: Or 'the roe deer and the stag.'
    reason: lexical_alternative
  - marker: b
    text: That is, persons who are ritually unclean and persons who are ritually clean may both eat it.
    reason: cultural_note
translation:
  language: ko
  text: 다만 사슴과 노루를 먹듯이 그렇게도 먹을 수 있습니다[a]. 부정한 사람도 정결한 사람도 함께 그것을 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노루와 수사슴’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 다만
  alternatives_korean:
  - 그러나
  - 오직
  - 하지만
  lexicon: HALOT
  rationale: 앞 문맥의 규정을 덧붙여 한정하는 뉘앙스를 한국어에서는 ‘다만’이 가장 자연스럽게 살립니다.
- source_word: כַּאֲשֶׁר ... כֵּן
  english_pob_choice: just as ... so
  chosen_korean: '...듯이 그렇게도'
  alternatives_korean:
  - '...처럼 ...도'
  - '...한 것처럼 ...도'
  lexicon: HALOT
  rationale: 먹는 방식을 비교하는 상응 구조를 한국어에서도 비교로 드러내기 위해 ‘...듯이 그렇게도’로 옮겼습니다.
- source_word: הַצְּבִי / הָאַיָּל
  english_pob_choice: the gazelle / the deer
  chosen_korean: 사슴과 노루
  alternatives_korean:
  - 가젤과 사슴
  - 노루와 수사슴
  lexicon: HALOT
  rationale: 설명역 주석의 대안인 ‘roe deer and the stag’을 반영해, 한국어 독자에게 익숙한 짝인 ‘사슴과 노루’로 자연스럽게 옮겼습니다.
- source_word: הַטָּמֵא / הַטָּהוֹר
  english_pob_choice: the unclean / the clean
  chosen_korean: 부정한 사람도 정결한 사람도
  alternatives_korean:
  - 부정한 자도 정결한 자도
  - 의례상 부정한 사람도 의례상 정결한 사람도
  lexicon: HALOT
  rationale: 문맥상 식사 허용 대상이 사람임을 드러내기 위해 명사를 보충했고, ‘부정한/정결한’은 의례적 상태를 유지했습니다.
theological_decisions:
- issue: 의례적 정결/부정의 범주를 어떻게 드러낼 것인가
  chosen_reading: 부정한 사람도 정결한 사람도 함께 그것을 먹을 수 있습니다
  alternative_readings:
  - 의례상 부정한 사람도 의례상 정결한 사람도 함께 그것을 먹을 수 있습니다
  - 부정한 자도 정결한 자도 함께 그것을 먹을 수 있습니다
  rationale: 이 구절은 도덕적 평가가 아니라 제의적 식사 허용 범위를 말하므로, 본문 의미를 흐리지 않도록 ‘사람’으로 풀어 말하되 상태 대비는 유지했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
