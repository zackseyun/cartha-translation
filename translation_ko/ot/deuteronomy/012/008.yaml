translation:
  language: ko
  text: 오늘 여기서 우리가 하는 대로 하지 마십시오. 각 사람이[a] 자기 눈에 옳은 것은 무엇이든 하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘각 사람’은 분배적 표현으로, 각 개인이 자기 판단에 따라 행동한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  english_pob_choice: You shall not do
  chosen_korean: 하지 마십시오
  alternatives_korean:
  - 하지 말라
  - 하지 않으셔야 합니다
  lexicon: HALOT
  rationale: 법률적 금지의 뉘앙스를 살리면서도 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר ... עֹשִׂים פֹּה הַיּוֹם
  english_pob_choice: as we are doing here today
  chosen_korean: 오늘 여기서 우리가 하는 것과 같이
  alternatives_korean:
  - 오늘 여기서 우리가 하고 있는 것처럼
  - 오늘 여기서 우리가 하는 대로
  lexicon: HALOT
  rationale: 현재 진행 중인 관행을 가리키므로, ‘오늘 여기서’와 ‘우리가 하는 것과 같이’로 현재적 비교를 살렸습니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람은
  alternatives_korean:
  - 각 남자는
  - 각자는
  lexicon: HALOT
  rationale: 히브리어 단수형의 분배적 용법을 반영하되, 한국어에서는 성별을 불필요하게 좁히지 않고 대표적 의미를 살린 표현이 자연스럽습니다.
- source_word: כָּל הַיָּשָׁר בְּעֵינָיו
  english_pob_choice: whatever is right in his own eyes
  chosen_korean: 자기 눈에 옳은 것을
  alternatives_korean:
  - 자기 보기에 옳은 것을
  - 자기 생각에 옳은 것을
  lexicon: HALOT
  rationale: ‘눈에’는 히브리어 관용구의 판단 의미를 보존합니다. ‘옳은 것’은 ישר의 도덕적·규범적 의미를 간결하게 담습니다.
theological_decisions:
- issue: 분배적 단수 표현의 성별 보존
  chosen_reading: ‘각 사람’으로 번역하되, 문맥상 각 개인의 자의적 판단이라는 뜻을 드러냅니다.
  alternative_readings:
  - ‘각 남자’로 직역
  - ‘모든 사람’으로 일반화
  rationale: 원문은 단수 남성형을 사용하지만 의미는 분배적입니다. 한국어 본문은 자연성을 위해 ‘각 사람’으로 옮기면서, 의미상의 개인적 자율 판단이라는 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
