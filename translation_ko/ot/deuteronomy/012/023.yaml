translation:
  language: ko
  text: 오직 피를 먹지 않도록 힘쓰십시오. 피가 생명이므로, 생명을[a] 고기와 함께 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목숨’. 히브리어 네페쉬(נֶפֶשׁ)는 여기서 두 번 모두 피조물의 생명력을 가리키므로, 많은 번역본처럼 ‘생명’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק / Only
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 단지
  - 오직만
  lexicon: HALOT
  rationale: 앞선 허용에 대한 강한 예외·제한을 나타내는 말로, 한국어에서는 문장 첫머리의 "오직"이 가장 자연스럽게 그 기능을 살립니다.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  english_pob_choice: be sure not to eat
  chosen_korean: 먹지 않도록 힘쓰십시오
  alternatives_korean:
  - 반드시 먹지 마십시오
  - 먹지 않도록 단단히 조심하십시오
  - 삼가 먹지 마십시오
  lexicon: HALOT
  rationale: 직역의 "강하라"보다 금지 목적을 위한 강한 주의 촉구가 핵심이므로, 합쇼체 명령으로 "힘쓰십시오"를 택해 의무적 경계를 살렸습니다.
- source_word: הַדָּם / הַנֶּפֶשׁ
  english_pob_choice: the blood / the life
  chosen_korean: 피 / 생명
  alternatives_korean:
  - 피 / 목숨
  - 피 / 혼
  - 피 / 영혼
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ는 추상적 '영혼'이 아니라 동물의 생명력에 해당하므로, POB의 'life'에 맞춰 "생명"으로 옮겨 혈액과의 동일시를 분명히 했습니다.
- source_word: וְלֹא תֹאכַל הַנֶּפֶשׁ עִם הַבָּשָׂר
  english_pob_choice: you shall not eat the life with the flesh
  chosen_korean: 생명을 고기와 함께 먹어서는 안 됩니다
  alternatives_korean:
  - 생명을 살코기와 함께 먹어서는 안 됩니다
  - 생명을 육체와 함께 먹어서는 안 됩니다
  - 생명을 고기와 함께 먹지 말아야 합니다
  lexicon: HALOT
  rationale: בָּשָׂר는 사람에게서 '고기'보다 동물의 먹는 부분을 가리키는 맥락이 강하므로, 한국어에서는 자연스러운 "고기"를 택하되 앞의 "생명"과의 대조를 유지했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 신학적 뉘앙스
  chosen_reading: '"생명"으로 번역해 창조물의 애니메이팅 생명을 가리키도록 했습니다.'
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 본문은 피와 생명의 관계를 설명하지, 인간 영혼론을 전개하지 않습니다. 따라서 '영혼'을 쓰면 본문의 생물학적·제의적 논리를 흐릴 수 있어 '생명'이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
