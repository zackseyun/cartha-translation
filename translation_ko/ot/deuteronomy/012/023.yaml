  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
  footnotes:
  - marker: a
    text: Or 'soul' for 'life' in both occurrences of נֶפֶשׁ; here the Hebrew term refers to the creature's animating life, which is why many translations render it 'life.'
