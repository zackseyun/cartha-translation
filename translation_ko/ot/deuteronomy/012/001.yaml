id: DEU.12.1
reference: Deuteronomy 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
  footnotes:
  - marker: a
    text: Or 'and the ordinances' for 'and the judgments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to inherit' for 'to possess.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'on the earth'; some take this more narrowly as 'on the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 당신들이 주의하여 행해야 할 규례들과 법규들입니다. 곧 당신들의 조상들의 하나님이신 야훼께서 당신들에게 주셔서 차지하게 하신 땅에서, 당신들이 땅 위에 사는 모든 날 동안입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법규들’은 ‘판단들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘차지하게 하신’은 ‘상속하게 하신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘땅 위에’입니다. 문맥상 ‘그 땅에서’로 좁혀 읽는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים וְהַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 규례들과 법규들
  alternatives_korean:
  - 규례들과 판단들
  - 규례들과 규정들
  lexicon: HALOT
  rationale: 두 히브리어 법률 용어를 구분해 살리되, 한국어에서 자연스럽고 공적인 법률 문체를 유지하기 위해 각각 ‘규례들’과 ‘법규들’로 옮겼습니다.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  english_pob_choice: you shall be careful to do
  chosen_korean: 주의하여 행해야 할
  alternatives_korean:
  - 지켜 행해야 할
  - 삼가 행해야 할
  lexicon: HALOT
  rationale: שׁמר의 ‘주의하여 지키다’와 עשה의 ‘행하다’가 함께 있으므로, 단순 준수가 아니라 신중한 실천을 드러내는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자적으로 드러난 신명 자체를 보존하기 위해 관용적 대치어 ‘주’ 대신 ‘야훼’를 사용했습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하게 하신
  alternatives_korean:
  - 소유하게 하신
  - 상속하게 하신
  lexicon: HALOT
  rationale: 신명기적 땅 약속의 맥락에서 단순 소유보다 실제로 ‘차지하다/점유하다’의 의미가 더 분명하므로, 하나님이 그 땅을 주어 소유하도록 하셨다는 동사를 택했습니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: on the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에서
  - 세상에서
  lexicon: HALOT
  rationale: 이 절은 앞의 ‘땅’(territory)과 연결되면서도 마지막에 거주의 지속성을 말하므로, POB의 주석적 긴장을 반영해 ‘땅 위에’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: '신명 12:1의 보존 범위: 약속의 땅과 전 존재 기간'
  chosen_reading: 명령은 약속의 땅에서만이 아니라, 그 땅 위에 사는 모든 날 동안 지속되는 순종을 요구합니다.
  alternative_readings:
  - ‘땅’만을 지시하는 지리적 명령으로 제한하는 읽기
  - ‘땅 위에’를 단순히 ‘살아 있는 동안’의 관용구로만 축소하는 읽기
  rationale: 본문은 מקום(땅)과 הזמן(모든 날)을 함께 묶어, 정착 이후의 계속적 순종을 강조합니다. 따라서 공간과 기간을 모두 드러내는 번역이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 신명기 12장의 언약적 순종과 토지-거주 구조
