base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
  footnotes:
  - marker: a
    text: Or 'the Levite who is in your towns'; literally, 'who is within your gates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희의 하나님 야훼 앞에서 즐거워하여야 합니다—너희와 너희 아들들과 너희 딸들과 너희 남종들과 너희 여종들과 너희 성문 안에 있는 레위인도 그러해야 합니다. 그는 너희와 함께 몫도 기업도 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  english_pob_choice: you shall rejoice
  chosen_korean: 즐거워하여야 합니다
  alternatives_korean:
  - 기뻐하여야 합니다
  - 즐거워해야 합니다
  lexicon: HALOT
  rationale: 예배·언약 문맥의 명령/예정형을 현대 한국어의 자연스러운 의무 표현으로 옮겼습니다. ‘기뻐하다’보다 공적 예배의 반응을 넓게 담는 ‘즐거워하다’가 적절합니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희 하나님 여호와
  - 너희의 하나님 주님
  lexicon: HALOT
  rationale: 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֱלֹהֵיכֶם은 소유 관계를 분명히 하도록 ‘너희의 하나님’으로 풀었습니다.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  english_pob_choice: your male slaves and your female slaves
  chosen_korean: 너희 남종들과 너희 여종들
  alternatives_korean:
  - 너희 남자 종들과 너희 여자 종들
  - 너희 남종들과 너희 여종들
  lexicon: HALOT
  rationale: 힌트가 된 영어 POB의 ‘slaves’ 취지를 반영하되, 현대 한국어에서 법적·사회적 종속성을 드러내는 중립적 표기로 ‘남종/여종’을 사용했습니다. ‘종들’만 쓰면 성별 대구가 흐려집니다.
- source_word: בְּשַׁעֲרֵיכֶם
  english_pob_choice: who is within your gates
  chosen_korean: 너희 성문 안에 있는
  alternatives_korean:
  - 너희 도시 안에 있는
  - 너희 고을 안에 있는
  lexicon: HALOT
  rationale: 직역적인 ‘성문’이 히브리어 관용구와 공동체 경계를 가장 잘 보존합니다. POB의 주석적 대안(‘your towns’)은 본문 밖에서 설명하는 것이 적절합니다.
- source_word: חֵלֶק וְנַחֲלָה
  english_pob_choice: portion or inheritance
  chosen_korean: 몫도 기업도
  alternatives_korean:
  - 분깃도 기업도
  - 몫도 상속 분깃도
  lexicon: HALOT
  rationale: 두 명사를 구별해 반복하는 병렬성을 살리면서, 한국어 성경 전통에서 널리 쓰이는 ‘기업’을 유지했습니다. ‘몫’은 hēleq의 기본 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 공적 예배 명령의 문체
  chosen_reading: ‘즐거워하여야 합니다’로 공동체 전체에 대한 규범적 권면을 살렸습니다.
  alternative_readings:
  - ‘즐거워하십시오’
  - ‘기뻐해야 합니다’
  rationale: 본문은 단순 권유가 아니라 절기 예배 맥락의 규범적 명령입니다. 따라서 합쇼체의 의무형을 쓰되, 하나님께 직접 드리는 기도체로 바꾸지는 않았습니다.
  doctrine_reference: Translation philosophy §2; Hebrew imperative/jussive force in covenant instruction
- issue: 유월·절기 맥락의 포괄성
  chosen_reading: 아들·딸·남종·여종·레위인을 모두 함께 묶어 공동체적 기쁨을 강조했습니다.
  alternative_readings:
  - 가족 중심으로 완화
  - 사회적 하위집단을 생략
  rationale: 본문의 신학적 강조점은 예배가 가족과 종속인, 그리고 제의적 생계가 없는 레위인까지 포괄한다는 데 있습니다. 이를 약화시키지 않도록 모두 명시했습니다.
  doctrine_reference: Deuteronomy covenant communal worship context
