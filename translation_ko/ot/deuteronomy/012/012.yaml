  source_fidelity: 히브리어의 명령적 용법, 열거된 구성원, 레위인이 토지 몫과 기업을 받지 못한 이유를 전반적으로 충실히 옮겼습니다. 다만 원문의 단일 술어가 열거 전체를 지배하는 구조를 ‘레위인도 그러해야 합니다’로 풀면 다소 부가적인 표현이 생기므로, 열거 전체를 한 문장으로 유지하는 편이 더 정확합니다. בְּשְׁעָרֶיךָ의 문자적 표현을 보존하면서 영어 POB의 대안 독법을 각주로 제시하는 것이 적절합니다.
