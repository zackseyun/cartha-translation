  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: ko
  text: 당신의 하나님 야훼[a]께서 당신에게 말씀하신 대로 당신의 영토를 넓혀 주시면, 당신이 “고기를 먹고 싶습니다”라고 말할 때, 고기를 먹고 싶기 때문에 당신이 원하는 만큼 고기를 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼’는 본문의 יהוה를 따른 음역입니다.
    reason: source_note
lexical_decisions:
- source_word: יַרְחִיב ... אֶת גְּבוּלְךָ
  english_pob_choice: enlarges your territory
  chosen_korean: 당신의 영역을 넓혀 주실 때
  alternatives_korean:
  - 당신의 경계를 넓혀 주실 때
  - 당신의 땅을 넓혀 주실 때
  lexicon: רחב / גְּבוּל
  rationale: גְּבוּל은 단순한 행정 경계보다 실제적으로 확장되는 ‘영역’으로 옮기는 것이 문맥상 자연스럽고, ‘넓혀 주실 때’는 동사의 완료적 약속 뉘앙스를 살립니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the LORD your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 주 당신의 하나님
  - 여호와 당신의 하나님
  lexicon: יהוה / אלהים
  rationale: 본문의 יהוה는 POB 기본 원칙에 따라 ‘야훼’로 옮기고, אֱלֹהֶיךָ는 소유격 관계를 분명히 드러내기 위해 ‘당신의 하나님’으로 표현했습니다.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  english_pob_choice: and you say, “I want to eat meat,”
  chosen_korean: 당신이 「나는 고기를 먹고 싶습니다」라고 말하거든
  alternatives_korean:
  - 당신이 「나는 고기를 먹겠습니다」라고 말하거든
  - 당신이 「고기를 먹고 싶습니다」라고 말하거든
  lexicon: אמר + אכל בשר
  rationale: POB가 채택한 ‘I want to eat meat’에 맞춰 의지 표현을 살렸고, 합쇼체 서술 안에서 직접화법도 동일한 격식을 유지했습니다.
- source_word: כִּי תְאַוֶּה נַפְשְׁךָ לֶאֱכֹל בָּשָׂר ... בְּכָל אַוַּת נַפְשְׁךָ
  english_pob_choice: because you crave to eat meat ... according to all the desire of your soul
  chosen_korean: 당신의 영혼이 고기를 먹기를 갈망하므로 … 당신의 영혼의 모든 소원대로
  alternatives_korean:
  - 당신의 마음이 고기를 먹고 싶어 하므로 … 마음이 원하는 대로
  - 당신의 영혼이 고기를 먹고자 간절히 원하므로 … 영혼의 모든 갈망대로
  lexicon: נפש / תאווה / אוָּה
  rationale: נֶפֶשׁ을 단순한 ‘마음’보다 원문 감각이 강한 ‘영혼’으로 유지하고, תְאַוֶּה와 אַוַּת은 ‘갈망/소원’으로 구분해 중복을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문의 יהוה를 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값과 원어 가시성을 우선해 전통적 교회 용례보다 학술적 음역을 채택했습니다.
  doctrine_reference: 출애굽기 3:15; 신명기 12:20
