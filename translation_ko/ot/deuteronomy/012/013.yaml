  lexicon: HALOT
  rationale: 경고형 니팔 명령을 현대 한국어의 자연스러운 명령문으로 옮기되, 법적 경고의 긴박함을 살렸습니다.
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: ~하지 않도록 하십시오
