  rationale: פֶּן의 예방적 부정을 한국어에서는 목적절형 금지 표현으로 옮겨 경고의 기능을 분명하게 했습니다.
- source_word: תַּעֲלֶה
  english_pob_choice: you offer up
  chosen_korean: 드리지
  alternatives_korean:
