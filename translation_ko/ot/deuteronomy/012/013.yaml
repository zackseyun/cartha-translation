  lexicon: HALOT
  rationale: פֶּן의 예방적 부정을 한국어에서는 목적절형 금지 표현으로 옮겨 경고의 기능을 분명하게 했습니다.
- source_word: תַּעֲלֶה
  english_pob_choice: you offer up
  chosen_korean: 드리지
  alternatives_korean:
  - 올리지
  - 바치지
  - 제사하지
  lexicon: HALOT
  rationale: 제단에 올리는 제의 행위를 한국어 성경문맥에서 자연스럽게 드러내기 위해 ‘드리다’를 택했습니다.
- source_word: בְּכָל מָקוֹם אֲשֶׁר תִּרְאֶה
  english_pob_choice: in any place that you see
  chosen_korean: 당신이 보는 모든 곳에서
  alternatives_korean:
  - 당신이 보는 어느 곳에서나
  - 당신이 보는 모든 장소에서
  - 눈에 띄는 곳마다
  lexicon: HALOT
  rationale: בְּכָל מָקוֹם의 범위성을 ‘모든 곳’으로, אֲשֶׁר תִּרְאֶה의 직설적 표현을 ‘당신이 보는’으로 살려 자의적 선택의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 제의 장소의 제한성
  chosen_reading: 번제는 사람이 임의로 보는 곳마다 드릴 수 없다는 경고로 직접 옮겼습니다.
  alternative_readings:
  - 중앙 성소에서만 드리라는 포괄적 교리 진술로 넓혀 옮기기
  - 일반적 예배 금지로 확대 해석하기
  rationale: 이 절의 직접 어휘는 ‘번제물’과 ‘보는 모든 곳’에 초점을 두므로, 본문이 말하는 범위를 넘어 일반화하지 않고 그대로 경고문으로 유지했습니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make.'
