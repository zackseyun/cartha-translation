source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
  footnotes:
  - marker: a
    text: Or, 'in all your undertakings' or 'in all that you put your hand to.' The Hebrew idiom is literally 'in all the sending forth of your hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그곳에서 너희는 야훼 너희 하나님 앞에서 먹고, 너희 손이 하는 모든 일에 대하여 너희와 너희 집안이 기뻐해야 합니다. 야훼 너희 하나님이 너희에게 복을 주신 그 모든 것으로 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 손이 하는 모든 일’은 히브리어 관용구 ‘너희 손의 내보냄/펼침’에 해당하며, ‘너희가 하는 모든 일’ 또는 ‘너희의 모든 수고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  english_pob_choice: you shall eat
  chosen_korean: 먹고
  alternatives_korean:
  - 먹으십시오
  - 먹으리니
  lexicon: HALOT
  rationale: 명령/지시의 연속을 자연스럽게 이어 주는 연결형으로 옮기되, 법규 문맥의 당위성을 살렸습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: before Yahweh your God
  chosen_korean: 야훼 너희 하나님 앞에서
  alternatives_korean:
  - 야훼 너희 하나님 앞에
  - 야훼 너희 하나님 임재 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי의 핵심은 단순한 위치보다 ‘~앞에서’라는 언약적·예배적 대면이므로, 이를 간결하게 살렸습니다.
- source_word: מִשְׁלַח יֶדְכֶם
  english_pob_choice: the work of your hand
  chosen_korean: 너희 손이 하는 모든 일
  alternatives_korean:
  - 너희 손의 모든 일
  - 너희가 손으로 하는 모든 것
  - 너희가 착수하는 모든 일
  lexicon: HALOT
  rationale: 직역의 손 이미지보다 관용적 의미인 ‘무엇을 손을 뻗어 행하는 일/undertakings’를 한국어로 자연스럽게 풀어, 본문이 말하는 삶의 모든 수고를 드러냈습니다.
- source_word: וּבָתֵּי כֶם
  english_pob_choice: you and your households
  chosen_korean: 너희와 너희 집안
  alternatives_korean:
  - 너희와 너희 가정
  - 너희와 너희 식구들
  lexicon: HALOT
  rationale: בָּתִּים는 건물보다 가족 단위를 가리키므로, 예배 자리에서 함께 복을 누리는 공동체성을 살려 ‘집안’으로 옮겼습니다.
- source_word: בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God has blessed you
  chosen_korean: 야훼 너희 하나님이 너희에게 복을 주신
  alternatives_korean:
  - 야훼 너희 하나님이 너희를 복 주신
  - 야훼 너희 하나님이 너희를 복 주신 그
  lexicon: HALOT
  rationale: ברך의 결과 상태를 한국어 완료형으로 반영했고, 영어 POB의 공동체적 you를 따라 복의 수혜 대상을 일관되게 복수로 처리했습니다.
theological_decisions:
- issue: 야훼의 공적 번역 표기
  chosen_reading: 고유명사 יְהוָה를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 번역 관례보다 히브리어 고유명사의 식별성을 우선해, 본문이 언약 이름을 직접 부르는 효과를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 부름 대상의 수적 일관성
  chosen_reading: 앞부분의 복수 명령과 뒤의 ‘너희/너희 집안’ 표현을 그대로 살렸습니다.
  alternative_readings:
  - 모두 단수로 평준화
  - 모두 복수로만 재구성
  rationale: 히브리어는 공동체를 대표하는 복수와 개별 수혜를 가리키는 단수 감각이 함께 작동하므로, 그 긴장을 평준화하지 않고 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source-text meaning and document exceptions'
