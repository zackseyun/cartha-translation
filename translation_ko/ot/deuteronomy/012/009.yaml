translation:
  language: ko
  text: 이는 당신들이 아직 야훼 당신의 하나님께서 당신에게 주시는 안식처와 유업에 이르지 못했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉼’. 히브리어 מְנוּחָה는 추상적 ‘안식’과 더 구체적인 ‘안식처’ 둘 다를 가리킬 수 있으며, 여기서는 땅의 맥락상 후자가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
