  rationale: 가나안 땅을 하나님이 분배하시는 언약적 몫으로 가리키므로, 한국어 성경에서 익숙한 ‘유업’이 ‘inheritance’의 상속·분배 의미를 함께 담습니다.
- source_word: נֹתֵן
