  - 휴식
  - 안식
  lexicon: HALOT
  rationale: 지리적·목적지적 맥락에서 추상적 ‘안식’보다 구체적 장소를 가리키는 ‘안식처’가 원문의 뉘앙스를 더 잘 살립니다.
- source_word: הַנַּחֲלָה
  english_pob_choice: the inheritance
