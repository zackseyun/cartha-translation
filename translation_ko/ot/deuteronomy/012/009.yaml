  lexicon: HALOT
  rationale: 앞 절의 진술을 받는 이유 설명으로서 ‘이는 … 때문입니다’가 현대 한국어에서 자연스럽고, 원문의 인과 관계를 유지합니다.
- source_word: הַמְּנוּחָה
  english_pob_choice: the resting place
  chosen_korean: 안식처
  alternatives_korean:
  - 쉼
  - 휴식
  - 안식
  lexicon: HALOT
  rationale: 지리적·목적지적 맥락에서 추상적 ‘안식’보다 구체적 장소를 가리키는 ‘안식처’가 원문의 뉘앙스를 더 잘 살립니다.
- source_word: הַנַּחֲלָה
  english_pob_choice: the inheritance
  chosen_korean: 유업
  alternatives_korean:
