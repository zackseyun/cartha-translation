  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
  footnotes:
  - marker: a
    text: Or 'the rest.' The Hebrew מְנוּחָה can denote either an abstract 'rest' or a more concrete 'resting place'; here the land-setting favors the more concrete sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여러분이 아직 여러분의 하나님 야훼께서 여러분에게 주시는 안식처와 유업에 이르지 못했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안식’. 히브리어 מְנוּחָה는 추상적인 ‘안식’이나 더 구체적인 ‘안식처’를 가리킬 수 있습니다. 여기서는 땅과 관련된 맥락상 후자가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
