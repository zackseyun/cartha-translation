source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
  footnotes:
  - marker: a
    text: Or 'worshiped their gods there.' The Hebrew verb can mean 'serve' in the sense of religious worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 섬겼던 그 민족들의 모든 장소를, 곧 여러분이 차지하게 될 그들의 신들을 높은 산들 위와 언덕들 위와 모든 푸른 나무 아래에서 반드시 철저히 없애야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘섬겼던’은 여기서 종교적 봉사를 뜻하는 עבד의 의미를 반영한 번역입니다. ‘예배했던’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  english_pob_choice: You must surely destroy
  chosen_korean: 반드시 철저히 없애야 합니다
  alternatives_korean:
  - 반드시 멸해야 합니다
  - 완전히 없애야 합니다
  lexicon: HALOT
  rationale: יִאבֵּד/תְּאַבְּדוּן의 강조된 명령을 자연스러운 현대 한국어로 살리되, 단순히 ‘파괴하다’보다 대상을 없애 버리는 강한 뉘앙스를 전달하기 위해 ‘철저히 없애다’를 선택했습니다.
- source_word: הַמְּקֹמוֹת
  english_pob_choice: all the places
  chosen_korean: 모든 장소를
  alternatives_korean:
  - 모든 곳을
  - 모든 자리들을
  lexicon: HALOT
  rationale: 문맥상 우상 숭배와 관련된 구체적 장소이므로 ‘장소’가 가장 직접적이며, 영어 POB의 ‘places’와도 맞습니다.
- source_word: עָבְדוּ שָׁם
  english_pob_choice: served there
  chosen_korean: 그들이 섬겼던
  alternatives_korean:
  - 그들이 거기서 예배했던
  - 그들이 거기서 섬겼던
  lexicon: HALOT
  rationale: עבד는 신들을 대상으로 ‘섬기다’라는 종교적 봉사를 뜻할 수 있으므로, POB의 ‘served’에 맞춰 ‘섬겼던’으로 옮겼습니다. 한국어에서는 ‘예배하다’보다 동사의 넓은 의미를 더 잘 보존합니다.
- source_word: עַל הֶהָרִים הָרָמִים וְעַל הַגְּבָעֹות
  english_pob_choice: on the high mountains, on the hills
  chosen_korean: 높은 산들 위와 언덕들 위
  alternatives_korean:
  - 높은 산들 위와 산등성이들 위
  - 높은 산들과 언덕들 위
  lexicon: HALOT
  rationale: ‘high mountains’와 ‘the hills’의 병렬을 그대로 살리면서, 한국어에서 자연스러운 위치표현을 위해 ‘위’ 반복 구조를 사용했습니다.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: under every green tree
  chosen_korean: 모든 푸른 나무 아래
  alternatives_korean:
  - 모든 무성한 나무 아래
  - 모든 푸른 잎이 무성한 나무 아래
  lexicon: HALOT
  rationale: רַעֲנָן의 ‘푸르고 무성한’ 이미지를 살리되, 한국어 성경에서 익숙한 상징적 표현인 ‘푸른 나무’로 옮겼습니다.
theological_decisions:
- issue: 우상 숭배 장소 자체에 대한 명령의 초점
  chosen_reading: 명령은 우상 숭배 관행을 추상적으로 금지하기보다, 그와 결부된 구체적 장소들을 철저히 제거하라는 뜻으로 유지했습니다.
  alternative_readings:
  - 더 넓게 ‘우상 숭배를 폐지하라’로 풀어 쓸 수 있습니다.
  rationale: 히브리어 목적어는 ‘모든 장소’이므로, 본문이 지닌 물리적·역사적 초점을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 신명기 12장의 산당 정리와 단일 예배 중심성
- issue: ‘그들의 신들’의 직접성 유지
  chosen_reading: ‘그들의 신들’을 그대로 유지하여, 본문이 주변 민족의 신적 대상을 실제로 지칭함을 드러냈습니다.
  alternative_readings:
  - ‘우상들’로 옮길 수도 있습니다.
  rationale: 원문은 אלוהיהם을 직접적으로 말하므로, 해석을 앞당겨 ‘우상’으로 단정하기보다 원문 표현을 보존하는 것이 좋습니다.
  doctrine_reference: 우상과 신적 존재에 대한 성서적 서술 방식
