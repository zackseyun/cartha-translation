source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
  footnotes:
  - marker: a
    text: Or 'in your towns.' The Hebrew is literally 'within your gates,' an idiom for one's local settlements.
    reason: lexical_alternative
  - marker: b
    text: Or 'your vows that you vow.' The expression likely refers to offerings associated with vows, not merely the vows as spoken promises.
    reason: lexical_alternative
  - marker: c
    text: Or 'the offering from your hand'; traditionally, 'the heave offering of your hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 성문 안에서 네 곡식의 십일조와 네 포도주와 네 기름과 네 소와 네 양의 첫 태생을 먹지 못하며 네가 서원한 모든 서원과 네 기꺼이 드리는 것과 네 손으로 드리는 헌물을 먹지 못하리라.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: '성문: 히브리어는 문자적으로 ''네 성문''이며, 이는 네가 거주하는 지역적 중심지나 마을을 의미하는 관용구입니다.'
    source: WLC
  - marker: b
    text: '네 손으로 드리는 헌물: 이는 기꺼이 드리는 제사나 손으로 들어 올리는 헌물을 의미합니다.'
    source: WLC
lexical_decisions:
- source_word: שְׁעָרֶ֗י/ךָ
  english_pob_choice: gates
  chosen_korean: 성문
  alternatives_korean: 읍문, 마을
  lexicon: שער
  rationale: 원어 '게타르'는 문자적으로 성문이나 성읍의 문을 의미하며, 고대 이스라엘의 지역적 중심지를 나타내는 관용구입니다. '성문'으로 번역하여 공간적 제한을 명확히 하되, 현대 독자가 이해할 수 있도록 '성문'이라는 형식적 표현을 유지합니다.
- source_word: תְרוּמַ֥ת יָדֶֽ/ךָ
  english_pob_choice: contribution of your hand
  chosen_korean: 네 손으로 드리는 헌물
  alternatives_korean: 손의 헌물, 손바침
  lexicon: תְרוּמָה
  rationale: '''테루마''는 들림이나 헌물을 의미하며, ''네 손으로''라는 표현을 추가하여 제사의 주체적 행위를 강조합니다.'
theological_decisions:
- decision: 금기 사항의 포괄적 적용
  rationale: 십일조, 첫 태생, 서원, 헌물 등 모든 성물 (holy things) 을 성문 밖으로 가져가야 함을 명시하여, 성스러운 것과 일반적인 것의 구별을 강조합니다.
