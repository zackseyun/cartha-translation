    issue: 2인칭 단수 원문을 복수 ‘너희/너희 하나님’으로 변경했습니다.
    rationale: 히브리어 תַעֲשֶׂה 및 אֱלֹהֶיךָ는 단수입니다. 한국어의 ‘너는/네’가 이 대표 단수를 자연스럽게 보존합니다.
  - severity: medium
    issue: 마지막 동사를 과거 ‘드렸습니다’로 처리하고 ‘드리다’를 보탰습니다.
    rationale: יִשְׂרְפוּ는 이 문맥에서 반복적·관습적 행위를 가리키며, 본문은 ‘태우다’라고 직접 말합니다. ‘태웁니다’가 시제·상과 어휘를 더 충실히 반영합니다.
  - severity: low
    issue: 각주가 본문과 같은 표현을 반복하고 문장 끝에 배치되어 있습니다.
