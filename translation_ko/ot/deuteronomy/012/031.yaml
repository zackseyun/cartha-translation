  revised_text: 너는 네 하나님 야훼께 그렇게 해서는 안 됩니다. 그들은 자기들의 신들을 위하여 야훼께서 미워하시는 모든 가증한 일을 행해 왔으며, 심지어 자기들의 아들과 딸들을 자기들의 신들을 위하여 불에 태웁니다.
