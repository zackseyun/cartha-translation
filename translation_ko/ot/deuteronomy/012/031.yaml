id: DEU.12.31
reference: Deuteronomy 12:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'every abomination to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 하나님 야훼께 그렇게 해서는 안 됩니다. 그들은 자기들의 신들을 위하여 야훼께서 미워하시는 모든 가증한 일을 행해 왔으며, 심지어 자기들의 아들과 딸들을 자기들의 신들을 위하여 불에 태웁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  english_pob_choice: You shall not do so
  chosen_korean: 너희는 그렇게 하지 말아야 합니다
  alternatives_korean:
  - 그렇게 해서는 안 됩니다
  - 너는 그렇게 하지 말아야 합니다
  lexicon: HALOT
  rationale: 직설적 금지문의 핵심을 살리되, 한국어에서는 집단적 언약 청중을 자연스럽게 드러내기 위해 복수형 ‘너희’를 택했습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 너희 하나님께
  alternatives_korean:
  - 야훼 당신들의 하나님께
  - 야훼 너의 하나님께
  lexicon: HALOT
  rationale: 지명적 관계를 나타내는 ל를 ‘-께’로 옮겨, 금지된 행위가 하나님께 향하는 예배적 관계 속에서 일어남을 드러냈습니다.
- source_word: תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  english_pob_choice: every abomination of Yahweh that he hates
  chosen_korean: 야훼께서 미워하시는 모든 가증한 일
  alternatives_korean:
  - 야훼가 미워하시는 모든 가증한 것
  - 주께서 혐오하시는 모든 가증한 일
  lexicon: HALOT
  rationale: construct를 한국어에서 가장 자연스럽게 풀어 ‘야훼께서 미워하시는’으로 옮기면서, ‘가증한 일’로 강한 도덕·예배적 혐오를 보존했습니다.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  english_pob_choice: burn ... in the fire
  chosen_korean: 불에 태워
  alternatives_korean:
  - 불 속에서 태워
  - 불로 태워
  lexicon: HALOT
  rationale: 히브리어 표현의 문자적 잔혹성을 흐리지 않도록, 실제 소각 행위를 간결한 한국어 동사구로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: ‘יהוה’를 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 직접 원문 표기와의 가시적 대응을 유지하기 위해 학술적 음역을 따랐습니다. 본절은 우상숭배 금지의 근거를 언약명 자체에 두므로 이름을 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘아들들과 딸들’을 포함한 인신희생의 강도
  chosen_reading: ‘심지어 자기들의 아들과 딸들을 불에 태워’로 두어, 본문의 충격적 잔혹성을 완화하지 않았습니다.
  alternative_readings:
  - 자녀들을 불살랐다
  - 그들의 자녀를 불에 드렸다
  rationale: 본문은 단순한 제의가 아니라 자녀 희생을 분명히 말하므로, 완곡화하지 않고 직접적으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; do not flatten theological weight'
