revisions:
- from: 너희는 그렇게 야훼 너희 하나님께 하지 말아야 합니다. 그들은 자기들의 신들을 위하여 야훼께서 미워하시는 모든 가증한 일을 행하였고, 심지어 자기들의 아들과 딸들을 불에 태워 자기들의 신들에게 드렸습니다.[a]
  to: 너는 네 하나님 야훼께 그렇게 해서는 안 됩니다. 그들은 자기들의 신들을 위하여 야훼께서 미워하시는 모든 가증한 일을 행해 왔으며, 심지어 자기들의 아들과 딸들을 자기들의 신들을 위하여 불에 태웁니다.
  rationale: 원문의 단수 수신자, 동사의 상적 차이, 그리고 ‘불에 태우다’라는 직접적 표현을 보존하도록 고쳤습니다. 야훼에 대한 가증함이라는 구성 관계는 한국어에서 자연스러운 관계절 ‘야훼께서 미워하시는’로 풀었으며, 중복되고 무앵커인 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
