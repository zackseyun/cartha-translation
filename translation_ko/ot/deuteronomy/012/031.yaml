review_pass:
  verdict: revise
  source_fidelity: 첫 금지문의 히브리어는 2인칭 남성 단수이므로 ‘너는/네 하나님’으로 유지하는 편이 언약적 대표 단수를 더 충실히 반영합니다. עָשׂוּ의 확립된 행위와 יִשְׂרְפוּ의 반복·습관적 행위를 ‘행해 왔으며 … 태웁니다’로 구분했습니다. 마지막 לֵאלֹהֵיהֶם은 ‘그들의 신들을 위하여’로 옮겨 제의적 방향성을 보존했습니다.
  naturalness: ‘네 하나님 야훼께 그렇게 해서는 안 됩니다’는 현대 표준어 합쇼체에서 자연스럽고, 불필요하게 ‘드렸습니다’를 보태지 않아 원문의 직접성을 유지합니다. ‘아들과 딸들’을 그대로 유지해 성별 명시도 보존했습니다.
  terminology: יהוה는 프로젝트 원칙에 맞게 ‘야훼’로 통일했습니다. תּוֹעֲבָה는 강도를 유지하는 ‘가증한 일’, שָׂנֵא는 ‘미워하시는’으로 옮겼습니다. 기존 각주는 본문과 동일한 문구를 단순 반복하며 해당 어구에 닻도 없으므로 삭제하는 것이 적절합니다.
  issues:
