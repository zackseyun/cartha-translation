  rationale: 수정문은 명령과 그 목적어를 한 문장으로 유지하고, ‘이집트에서 나올 때 길에서’가 야훼께서 미리암에게 하신 행동의 상황을 나타내도록 배열했습니다. 신명과 인명은 유지했으며, 각주 a에서는 원문이 허용하는 상대적 선행의 번역 대안을 불필요한 ‘이미’ 없이 제시했습니다.
