  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
  footnotes:
  - marker: a
    text: Or 'after she has become unclean' or 'after she has been made impure.' The Hebrew says 'after she has been defiled,' without specifying the exact nature of the defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 첫 남편은, 그 여자를 보낸 사람인데, 그 여자가 더럽혀진 뒤에는 다시 그 여자를 아내로 맞이할 수 없습니다. 그것은 야훼 앞에서 가증스러운 일이기 때문입니다. 그리고 여러분은 야훼 ձեր 하나님께서 여러분에게 기업으로 주시는 땅에 죄를 가져와서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더럽혀진 뒤에는’은 ‘부정하게 되다’ 또는 ‘더럽혀지다’의 넓은 뜻을 따른 표현입니다. 본문은 그 오염의 정확한 성격을 구체화하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  english_pob_choice: her first husband
  chosen_korean: 그의 첫 남편
  alternatives_korean:
  - 그의 이전 남편
  - 그의 전 남편
  lexicon: HALOT
  rationale: marital context의 בעל은 ‘남편’이 자연스럽고, הָרִאשׁוֹן은 ‘첫’으로 직역해 법조문의 대비를 살렸습니다.
- source_word: שִׁלְּחָהּ
  english_pob_choice: sent her away
  chosen_korean: 그 여자를 보낸 사람
  alternatives_korean:
  - 그 여자를 내보낸 사람
  - 그 여자를 버린 사람
  lexicon: HALOT
  rationale: שלח의 기본 뜻인 ‘보내다’/‘보내어 떠나게 하다’를 살려, 이 법조문이 이미 이혼 맥락임을 전제하면서도 ‘이혼하다’로 단정하지 않았습니다.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  english_pob_choice: after she has been defiled
  chosen_korean: 그 여자가 더럽혀진 뒤에는
  alternatives_korean:
  - 그 여자가 부정하게 된 뒤에는
  - 그 여자가 더러움에 빠진 뒤에는
  lexicon: HALOT
  rationale: טמא의 수동형이 주는 넓은 의미를 따라 ‘더럽혀지다’를 택해, 의례적/도덕적/관계적 오염 가능성을 좁혀 규정하지 않았습니다.
- source_word: תוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증스러운 일
  alternatives_korean:
  - 혐오스러운 일
  - 끔찍한 일
  lexicon: HALOT
  rationale: 성경적 covenant language의 강한 평가를 보존하기 위해 ‘가증스럽다’를 유지했습니다.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  english_pob_choice: you shall not bring sin upon the land
  chosen_korean: 땅에 죄를 가져와서는 안 됩니다
  alternatives_korean:
  - 땅을 죄짓게 해서는 안 됩니다
  - 땅에 죄를 불러와서는 안 됩니다
  lexicon: HALOT
  rationale: 히필형 חטא의 결과적/귀책적 의미를 살리되, 한국어로는 ‘죄를 가져오다’가 공동체-토지의 책임을 가장 자연스럽게 드러냅니다.
- source_word: נֹתֵן לְךָ נַחֲלָה
  english_pob_choice: is giving you as an inheritance
  chosen_korean: 여러분에게 기업으로 주시는
  alternatives_korean:
  - 여러분에게 상속으로 주시는
  - 여러분에게 유산으로 주시는
  lexicon: HALOT
  rationale: נחלה의 언약적 ‘기업/유업’ 의미를 살려 교회적 관용구 대신 ‘기업’을 사용했습니다.
theological_decisions:
- issue: 여호와(YHWH) 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 표준화된 학술 음역인 ‘야훼’로 옮겨 언약적 신명성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘더럽혀진’의 범위
  chosen_reading: 의례적 부정만으로 한정하지 않고, 법적·관계적 오염 가능성을 열어 둔 표현으로 유지합니다.
  alternative_readings:
  - 성적 부정으로 특정
  - 단순 재혼 이후의 법적 무효로 특정
  rationale: 히브리어 본문이 오염의 정확한 방식은 밝히지 않으므로, 번역도 그 긴장을 해소하지 않고 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
