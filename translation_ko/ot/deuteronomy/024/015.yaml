  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
  footnotes:
  - marker: a
    text: Or 'depends on it for his life.' The Hebrew literally says 'to it he lifts/carries his life,' an idiom expressing urgent dependence on the wage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 날에 그의 품삯을 주어야 합니다. 해가 그것 위로 져서는 안 됩니다. 그가 가난하여 자기 생명을 그것에 두기 때문입니다. 그가 야훼께 당신을 향해 부르짖지 않게 하십시오. 그러면 당신에게 죄가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 날에’라고 하며, 같은 날 지급해야 한다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּיוֹמוֹ
  english_pob_choice: on his day
  chosen_korean: 그의 날에
  alternatives_korean:
  - 그날에
  - 같은 날에
  lexicon: HALOT
  rationale: 히브리어의 소유격 표현을 살려 '그의 날에'로 옮기되, 같은 날 지급해야 한다는 법적 긴급성을 자연스럽게 드러냅니다.
- source_word: שְׂכָרוֹ
  english_pob_choice: his wages
  chosen_korean: 그의 품삯
  alternatives_korean:
  - 그의 임금
  - 그의 삯
  lexicon: HALOT
  rationale: 노동의 대가라는 법문맥을 반영하는 말로 '품삯'을 택해, 단순한 보수보다 고용 노동의 지급액이라는 점을 살렸습니다.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  english_pob_choice: sets his life on it
  chosen_korean: 자기 생명을 그것에 두기 때문입니다
  alternatives_korean:
  - 그것에 자기 생명을 걸기 때문입니다
  - 그것에 의지하여 살아가기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 생명-의존 이미지를 유지하면서, 한국어로는 이해 가능한 방식으로 '자기 생명을 그것에 두다'로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기의 하나님의 고유명은 본 프로젝트 기본값에 따라 '야훼'로 옮겨, 제목어 '주님'으로 대체하지 않았습니다.
theological_decisions:
- issue: 부르짖음에 대한 목적/경고 관계
  chosen_reading: 그가 야훼께 당신을 향해 부르짖지 않게 하십시오
  alternative_readings:
  - 그가 야훼께 당신을 향해 부르짖지 않도록
  - 그가 야훼께 당신을 향해 부르짖지 못하게 하십시오
  rationale: 히브리어의 금지/경고 뉘앙스를 살리면서 한국어 법문체로 자연스럽게 전달하기 위해 '하게 하십시오' 구조를 사용했습니다.
  doctrine_reference: 법문체 번역 원칙
- issue: 마지막 절의 결과 진술
  chosen_reading: 그러면 당신에게 죄가 될 것입니다
  alternative_readings:
  - 그리고 당신에게 죄가 있을 것입니다
  - 그리하여 당신에게 죄가 남을 것입니다
  rationale: 히브리어의 '죄가 되다'를 직선적으로 살려, 행위의 도덕적 귀결을 약화시키지 않았습니다.
  doctrine_reference: 히브리어 חֵטְא 결과 진술
