  source_fidelity: 초안은 품삯을 당일에 지급하라는 핵심, 가난한 노동자의 생계 의존, 야훼께 호소하는 결과, 죄의 귀결을 대체로 담고 있습니다. 그러나 ‘해가 그것 위로 져서는 안 됩니다’는 한국어에서 무엇을 가리키는지 부자연스럽고, ‘자기 생명을 그것에 두다’는 히브리어 관용구의 뜻을 자연스럽게 전달하지 못합니다. 또한 ‘부르짖지 않게 하십시오’는 노동자의 호소를 막으라는 뜻으로 들릴 수 있어, 경고/결과 관계를 더 정확히 표현할 필요가 있습니다.
  naturalness: 현대 한국어 합쇼체 법문으로는 ‘그의 날에’, ‘그것 위로 지다’, ‘생명을 그것에 두다’가 직역투입니다. ‘그날 해가 지기 전에’, ‘그 품삯에 생계를 의지하고’로 고치면 자연스럽고 의미도 보존됩니다.
  terminology: ‘품삯’은 적절하며, 신명사의 고유명 יְהוָה를 ‘야훼’로 옮긴 것도 프로젝트 방침 및 원문에 부합합니다. 마지막 חֵטְא는 ‘당신에게 죄가 있게 될 것입니다’가 한국어에서 자연스럽게 결과적 책임을 나타냅니다.
