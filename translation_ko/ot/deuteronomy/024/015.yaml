revisions:
- from: 그의 날에 그의 품삯을 주어야 합니다. 해가 그것 위로 져서는 안 됩니다. 그가 가난하여 자기 생명을 그것에 두기 때문입니다. 그가 야훼께 당신을 향해 부르짖지 않게 하십시오. 그러면 당신에게 죄가 될 것입니다.[a]
  to: 그의 품삯을 그날 해가 지기 전에 주십시오. 그는 가난하며 그 품삯에 생계를 의지하고 있기 때문입니다.[a] 그가 야훼께 당신을 고발하며 부르짖지 않게 하십시오. 그러면 당신에게 죄가 있게 될 것입니다.
  rationale: 당일 지급과 일몰 전이라는 히브리어의 긴급성을 자연스러운 한국어로 표현했습니다. 생명과 품삯의 관용구는 생계 의존이라는 뜻으로 옮기고 각주에서 문자적 표현을 밝혔습니다. 야훼께 부르짖는 절은 노동자의 호소를 금지하는 뜻이 아니라 고용주에게 주는 경고임을 드러내도록 ‘고발하며 부르짖지 않게 하십시오’로 다듬었습니다.
