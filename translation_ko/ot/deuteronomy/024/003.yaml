  source_fidelity: 히브리어의 법률적 선택 구조와 각 동작(미워함, 이혼 증서 작성·전달, 집에서 내보냄, 또는 후의 남자의 죽음)은 대체로 반영되었습니다. 그러나 원문의 관계절은 ‘죽으면’ 뒤에 덧붙는 동격 설명이 아니라 ‘그녀를 자기 아내로 맞아들인 그 나중 남자’를 수식하므로, 한국어에서도 선행사 안에 통합하는 것이 정확합니다. ‘미워하여’는 원인의 뉘앙스를 다소 강화하므로 단순 접속으로 옮겼습니다.
  naturalness: ‘그 나중 남자’와 ‘죽으면, 곧 … 사람이’의 구성은 현대 표준 한국어에서 다소 부자연스럽고 관계가 불분명합니다. ‘그 뒤의 남자’ 및 관계절을 선행사 앞에 둔 구성으로 고치면 법문 문맥에서도 자연스럽습니다.
  terminology: ‘이혼 증서’는 סֵפֶר כְּרִיתֻת의 공식 문서라는 기능을 적절히 전달합니다. ‘자기 아내로 맞아들인’도 혼인 관용구를 무리 없이 반영합니다. 기존 각주는 원문에 없는 인과 설명을 보태거나 단순 직역 정보를 제공하므로 유지할 필요가 없습니다.
