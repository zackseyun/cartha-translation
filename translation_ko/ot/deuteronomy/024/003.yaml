reference: Deuteronomy 24:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׂנֵאָ/הּ֮ הָ/אִ֣ישׁ הָ/אַחֲרוֹן֒ וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּית֑/וֹ א֣וֹ כִ֤י יָמוּת֙ הָ/אִ֣ישׁ הָ/אַחֲר֔וֹן אֲשֶׁר לְקָחָ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
  footnotes:
  - marker: a
    text: Or, 'comes to hate her.' The Hebrew perfect can be rendered in a simple past-like legal sequence, but the sense is that the latter man develops hostility toward her and proceeds to divorce her.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a book/document of cutting off.' This is a formal written notice dissolving the marriage.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'took her to himself as a wife,' that is, 'married her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그 뒤의 남자가 그 여인을 미워하고, 이혼 증서를 써서 그 여인의 손에 주고, 그 여인을 그의 집에서 내보내거나, 또는 그녀를 자기 아내로 맞아들인 그 뒤의 남자가 죽으면—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂנֵאָהּ / hates her
  english_pob_choice: hates her
  chosen_korean: 그 여인을 미워하여
  alternatives_korean:
  - 그 여인을 싫어하여
  - 그 여인에게 마음이 돌아서
  lexicon: HALOT
  rationale: שׂנא의 기본 의미를 살려 법적 서술의 강도를 약화하지 않고 옮겼습니다. 한국어에서는 ‘미워하다’가 가장 직접적이며, 본문이 요구하는 관계 파탄의 냉랭함을 잘 드러냅니다.
- source_word: סֵפֶר כְּרִיתֻת / certificate of divorce
  english_pob_choice: certificate of divorce
  chosen_korean: 이혼 증서
  alternatives_korean:
  - 이별 증서
  - 이혼 문서
  - 절연 증서
  lexicon: HALOT
  rationale: כְּרִיתֻת는 결혼 관계의 ‘끊어짐/해소’를 뜻하는 기술어이므로, 현대 한국어의 법률 감각을 살려 ‘이혼 증서’로 옮겼습니다. ‘빌’ 같은 전통어보다 본문의 제도적 기능이 분명해집니다.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ / sends her out of his house
  english_pob_choice: sends her out of his house
  chosen_korean: 그의 집에서 내보내거나
  alternatives_korean:
  - 그의 집에서 내쫓거나
  - 그의 집에서 보내거나
  lexicon: HALOT
  rationale: מִבֵּיתוֹ의 공간 표현을 유지하면서, 이혼 절차의 결과를 자연스러운 한국어로 옮겼습니다. ‘내보내다’는 강제적 퇴거와 문맥상의 법적 조치를 함께 담습니다.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה / who took her as his wife
  english_pob_choice: who took her to himself as a wife
  chosen_korean: 그녀를 자기 아내로 맞아들인 사람이
  alternatives_korean:
  - 그녀를 아내로 맞은 사람이
  - 그녀를 자기 아내로 삼은 사람이
  lexicon: HALOT
  rationale: לקח + ל + אשה의 결혼 관용구를 살리되, 한국어에서 너무 직역적인 어순을 피했습니다. ‘맞아들이다’는 혼인을 통해 받아들인다는 뜻을 보여 주면서도 문맥상 자연스럽습니다.
theological_decisions:
- issue: 이혼 증서의 법적·제도적 뉘앙스
  chosen_reading: 본문은 단순한 이별 통보가 아니라 혼인 관계를 공식적으로 해소하는 절차를 말하므로, ‘이혼 증서’로 분명히 드러냈습니다.
  alternative_readings:
  - 이별 증서
  - 절연 문서
  rationale: משפט적 맥락에서 כְּרִיתֻת는 관계의 절단을 공적으로 문서화하는 표현입니다. 한국어 번역에서도 그 법적 효력을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 혼인과 이혼에 대한 율법적 규정(신 24장 맥락)
