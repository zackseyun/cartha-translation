- from: 어떤 사람이 아내를 맞아 아내로 삼았는데, 그가 그녀의 눈에 은혜를 얻지 못하는 일이 생기고, 그가 그녀에게서 어떤 부정한 일을 발견하여 이혼 증서를 써서 그녀의 손에 주고 자기 집에서 내보낼 경우,[a]
  to: 어떤 남자가 여자를 아내로 맞아 혼인하였는데, 그 여자가 그의 눈에 호의를 얻지 못하게 되고, 그가 그 여자에게서 어떤 수치스러운 일[a]을 발견하여 그 여자에게 이혼 증서를 써 주고 그 여자의 손에 넣어 주어 자기 집에서 내보내는 경우라면,
