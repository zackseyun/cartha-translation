source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
  footnotes:
  - marker: a
    text: Or 'a matter of indecency' or 'something shameful.' The Hebrew phrase is deliberately ambiguous and has been interpreted in more than one way.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 아내를 맞아 아내로 삼았는데, 그가 그녀의 눈에 은혜를 얻지 못하는 일이 생기고, 그가 그녀에게서 어떤 부정한 일을 발견하여 이혼 증서를 써서 그녀의 손에 주고 자기 집에서 내보낼 경우,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 עֶרְוַת דָּבָר는 ‘어떤 부정한 일’, ‘수치스러운 어떤 일’ 등으로도 옮길 수 있으며, 의도적으로 모호하게 표현되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקַּח אִישׁ אִשָּׁה
  english_pob_choice: If a man takes a wife
  chosen_korean: 어떤 사람이 아내를 맞아 아내로 삼았는데
  alternatives_korean:
  - 남자가 여자를 취하여 아내로 삼았는데
  - 어떤 남자가 아내를 맞았는데
  lexicon: HALOT
  rationale: 법률 조항의 가정절로 읽히도록 ‘어떤 사람’으로 시작하고, 혼인 성립을 한국어로 자연스럽게 풀어 ‘아내를 맞아 아내로 삼다’로 옮겼습니다.
- source_word: וּבְעָלָהּ
  english_pob_choice: and marries her
  chosen_korean: 아내로 삼았는데
  alternatives_korean:
  - 그리고 그녀와 혼인하였는데
  - 그리고 그녀의 남편이 되었는데
  lexicon: HALOT
  rationale: בעל의 관계 진입을 가리키므로 직역적 소유 뉘앙스를 피하고 혼인 관계를 분명히 하는 표현을 택했습니다.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  english_pob_choice: she does not find favor in his eyes
  chosen_korean: 그녀의 눈에 은혜를 얻지 못하는 일이 생기고
  alternatives_korean:
  - 그의 눈에 호감을 얻지 못하고
  - 그의 마음에 들지 않게 되고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘눈에 은혜를 찾다’를 살리면서, 한국어에서는 관계적 호의의 상실을 ‘은혜를 얻지 못하다’로 옮겼습니다.
- source_word: עֶרְוַת דָּבָר
  english_pob_choice: some indecency
  chosen_korean: 어떤 부정한 일
  alternatives_korean:
  - 어떤 수치스러운 일
  - 어떤 음란한 일
  - 부정한 어떤 일
  lexicon: HALOT
  rationale: 의도적으로 모호한 법률 표현이므로 특정 범주로 좁히지 않고, 의미 범위를 보존하는 중립적 표현을 택했습니다.
- source_word: סֵפֶר כְּרִיתֻת
  english_pob_choice: certificate of divorce
  chosen_korean: 이혼 증서
  alternatives_korean:
  - 이혼서
  - 이별 증서
  - 이혼 문서
  lexicon: HALOT
  rationale: 법적 효력을 가진 문서라는 기능을 분명히 하면서도, 현대 한국어에서 이해 가능한 공문서 표현으로 옮겼습니다.
- source_word: וְנָתַן בְּיָדָהּ
  english_pob_choice: puts it into her hand
  chosen_korean: 그녀의 손에 주고
  alternatives_korean:
  - 그녀의 손에 넣고
  - 그녀의 손에 건네고
  lexicon: HALOT
  rationale: 문서를 실제로 넘겨주는 절차를 구체적으로 보존하기 위해 ‘손에 주다’를 사용했습니다.
theological_decisions:
- issue: Deuteronomy 24:1을 이혼 허용 명령으로 들리게 할지, 사례법의 가정절로 유지할지
  chosen_reading: 가정적 법률 상황의 서두로 번역하여, 이 구절 자체가 이혼을 명령하거나 승인하는 것으로 들리지 않게 했습니다.
  alternative_readings:
  - 이혼을 전제한 허용 규정처럼 읽히는 번역
  - 명령문에 가까운 번역
  rationale: 원문의 כִּי와 이어지는 법률문맥은 1절이 사례법의 전제임을 보여 주므로, 신학적 긴장을 풀지 않고 문맥대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
