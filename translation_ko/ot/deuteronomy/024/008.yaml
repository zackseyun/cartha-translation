  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
  footnotes:
  - marker: a
    text: Traditionally, 'leprosy.' The Hebrew term refers more broadly to a range of skin conditions in the Torah, not specifically to modern Hansen's disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 피부 질환[a]의 증상이 나타난 경우에는, 매우 주의하여 레위 지파의 제사장들이 여러분에게 가르치는 모든 것을 지키고 행하십시오. 내가 그들에게 명령한 대로, 여러분도 주의하여 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘나병’으로 옮겼으나, 히브리어 용어는 토라에서 현대의 한센병보다 더 넓은 범위의 피부 질환을 가리킵니다.
    reason: lexical_alternative
