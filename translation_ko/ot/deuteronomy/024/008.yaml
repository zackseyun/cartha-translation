- from: 피부병 발병의 경우에는 매우 주의하여 지키고 행하십시오. 레위 제사장들이 여러분에게 가르치는 모든 것을 따라야 합니다. 내가 그들에게 명령한 대로, 여러분도 그렇게 주의하여 행해야 합니다.[a]
  to: 피부 질환[a]의 증상이 나타난 경우에는, 매우 주의하여 레위 지파의 제사장들이 여러분에게 가르치는 모든 것을 지키고 행하십시오. 내가 그들에게 명령한 대로, 여러분도 주의하여 행하십시오.
  rationale: 히브리어의 명령 구조를 보존하도록 제사장들의 가르침을 ‘지키고 행하십시오’에 직접 연결했습니다. נֶגַע הַצָּרַעַת은 자연스러운 현대 한국어로 ‘피부 질환의 증상이 나타난 경우’로 옮기고, ‘레위 지파의 제사장들’로 제사장들의 레위 소속을 분명히 했습니다. 비교 표현 כַּאֲשֶׁר…는 ‘내가 그들에게 명령한 대로’로 유지했습니다.
