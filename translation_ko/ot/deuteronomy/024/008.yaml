  source_fidelity: 수정이 필요합니다. 초안은 핵심 의미를 대체로 반영하지만, 제사장들의 지시를 따르는 내용이 독립된 문장으로 분리되어 히브리어의 ‘주의하여 지키고 행하라’는 명령에 직접 연결되지 않습니다. 또한 נֶגַע הַצָּרַעַת은 단순히 ‘발병’이라기보다 해당 피부 질환의 증상·병변에 관한 사안입니다.
  naturalness: ‘피부병 발병의 경우’는 중복적이고 다소 부자연스럽습니다. ‘피부 질환의 증상이 나타난 경우’가 현대 표준어에서 자연스럽습니다. ‘레위 지파의 제사장들’은 ‘레위 제사장들’보다 소속 관계를 분명하게 드러냅니다.
  terminology: צָרַעַת은 현대 한센병으로 한정하지 않고 ‘피부 질환’으로 옮기는 것이 적절합니다. הַכֹּהֲנִים הַלְוִיִּם은 두 집단을 뜻하기보다 레위 지파에 속한 제사장들을 가리키므로 ‘레위 지파의 제사장들’로 명확히 합니다. 각주 표지는 해당 용어 바로 뒤에 붙여야 합니다.
