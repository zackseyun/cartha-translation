review_pass:
  verdict: revise
  source_fidelity: 히브리어는 일관되게 남성 단수 2인칭(‘너’)에게 말합니다. 초안의 ‘너희/너희에게’는 복수로 바꾸어 원문의 수를 잃습니다. 또한 עֶבֶד는 이집트 체류 맥락에서 예속 신분을 뜻하므로 ‘노예’가 더 분명합니다. הַדָּבָר הַזֶּה는 앞선 규례를 가리키는 넓은 표현으로 ‘이 일’이 적절합니다.
  naturalness: ‘너는 … 기억하십시오’ 및 ‘내가 네게 … 명령합니다’는 현대 표준어 합쇼체로 자연스럽고, 법적 권면의 직접성과 현재적 명령의 뉘앙스를 잘 드러냅니다. ‘이 일을 행하라’보다 ‘이 일을 하라’가 이 문맥에서 더 자연스럽습니다.
  terminology: ‘노예’는 이집트에서의 강제 예속이라는 עֶבֶד의 문맥적 의미와 영어 POB의 ‘slave’를 충실히 반영합니다. ‘이집트 땅’과 ‘이 일’은 원문의 구체적 표현 및 포괄성을 보존합니다.
  issues:
