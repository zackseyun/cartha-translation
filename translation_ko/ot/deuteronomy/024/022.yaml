  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a slave in the land of Egypt[a]; therefore I am commanding you to do this thing.
  footnotes:
  - marker: a
    text: Or 'this matter' or 'this command.' Hebrew 'this thing' refers to the preceding instruction about leaving produce for the vulnerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 이집트 땅에서 종이었다는 것을 기억해야 합니다[a]. 그러므로 내가 너희에게 이 일을 행하라고 명령합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 문제’ 또는 ‘이 명령’입니다. 히브리어 ‘이 일’은 앞선 규례, 곧 약한 자를 위해 남겨 두는 곡식에 관한 지시를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: And remember
  chosen_korean: 그리고 … 기억해야 합니다
  alternatives_korean:
  - 그리고 … 기억하십시오
  - 그러므로 … 기억하십시오
  lexicon: HALOT
  rationale: 법적 권면의 명령형 뉘앙스를 한국어에서는 자연스러운 의무 표현으로 옮기되, 앞선 문맥과의 연결을 위해 접속사도 살렸습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이하는 사람
  lexicon: HALOT
  rationale: 이 절의 핵심은 이집트에서의 예속 상태이지만, 한국어 본문에서는 구약의 상투적이고 성경적인 대응어인 ‘종’이 가장 자연스럽고 과도하게 현대적 사회어휘로 밀어붙이지 않습니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅 안에서
  - 이집트에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 보존해 역사적·지리적 배경을 분명히 했습니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 명령
  - 이 문제
  lexicon: HALOT
  rationale: 앞선 규례 전체를 가리키는 רחב한 표현이므로 ‘명령’으로 좁히지 않고, 한국어에서도 절차적 지시를 가리키는 ‘이 일’로 옮겼습니다.
theological_decisions:
- issue: 노예/종 선택
  chosen_reading: 본절은 이스라엘의 과거 예속을 상기시키는 문맥이지만, 본문 자체의 법적 권면을 살려 한국어 본문에서는 ‘종’을 사용했습니다.
  alternative_readings:
  - ‘노예’로 옮겨 예속의 강도를 더 분명히 드러냄
  rationale: 원어 עֶבֶד의 핵심은 종속된 신분이지만, POB 영어가 여기서는 ‘slave’를 택한 이유는 문맥상 역사적 예속을 강조하기 위함입니다. 다만 한국어에서는 ‘노예’가 지나치게 근대적·강한 사회사적 울림을 불러와 법문 맥락을 덜 자연스럽게 만들 수 있어, 본문은 ‘종’으로 두고 lexical note로 긴장을 보존했습니다.
  doctrine_reference: 출애굽 기억을 윤리적 순종의 근거로 삼는 신명기 신학
