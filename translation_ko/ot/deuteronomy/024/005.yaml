  text: כִּֽי יִקַּ֥ח אִישׁ֙ אִשָּׁ֣ה חֲדָשָׁ֔ה לֹ֤א יֵצֵא֙ בַּ/צָּבָ֔א וְ/לֹא יַעֲבֹ֥ר עָלָ֖י/ו לְ/כָל דָּבָ֑ר נָקִ֞י יִהְיֶ֤ה לְ/בֵית/וֹ֙ שָׁנָ֣ה אֶחָ֔ת וְ/שִׂמַּ֖ח אֶת אִשְׁתּ֥/וֹ אֲשֶׁר לָקָֽח־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
  footnotes:
  - marker: a
    text: Or, 'he shall not go out to war'; the Hebrew literally says 'go out with the army,' which may include broader military service, not only direct combat.
    reason: lexical_alternative
  - marker: b
    text: Or, 'nor shall he be assigned any task' or 'nor shall any obligation be laid on him.' The Hebrew is broader than military duty alone.
    reason: alternative_reading
  - marker: c
    text: Or, 'He shall be exempt at home for one year.' The Hebrew phrase may emphasize either his freedom for domestic life or his remaining with his household.
    reason: lexical_alternative
  - marker: d
    text: Or, 'and he shall make glad his wife whom he has married.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 새 아내를 맞이하면 그는 군대와 함께 나가지 말아야 하며, 어떤 일도 그에게 부과되어서는 안 됩니다. 그는 한 해 동안 자기 집을 위해 자유로워야 하며, 그가 맞이한 아내를 즐겁게 해야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘군대와 함께 나가지 말아야 하며’는 직역하면 ‘전쟁에 나가지 말아야 하며’일 수 있으나, 히브리어는 더 넓게 군사 동원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어떤 일도 그에게 부과되어서는 안 됩니다’는 ‘어떤 의무도 지워지지 않아야 합니다’라는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘자기 집을 위해 자유로워야 하며’는 ‘집에서 면제되어 있어야 하며’ 또는 ‘가정생활에 전념할 수 있어야 하며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그가 맞이한 아내를 즐겁게 해야 합니다’는 ‘그가 결혼한 아내를 기쁘게 해야 합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִּקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  english_pob_choice: a man takes a new wife
  chosen_korean: 사람이 새 아내를 맞이하면
  alternatives_korean:
  - 사람이 새 아내를 취하면
  - 사람이 새 아내와 결혼하면
  lexicon: HALOT
  rationale: לָקַח + אִשָּׁה의 관용적 결합을 자연스럽게 살리면서, ‘새’로 최근 혼인이라는 의미를 반영했습니다.
- source_word: בַּצָּבָא
  english_pob_choice: go out with the army
  chosen_korean: 군대와 함께 나가지 말아야 하며
  alternatives_korean:
  - 전쟁에 나가지 말아야 하며
  - 군복무를 하지 말아야 하며
  lexicon: HALOT
  rationale: ‘군대와 함께 나가다’의 군사 동원 이미지를 살리되, 직접 전투만으로 좁히지 않았습니다.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  english_pob_choice: nor shall any duty be imposed on him
  chosen_korean: 어떤 일도 그에게 부과되어서는 안 됩니다
  alternatives_korean:
  - 어떤 의무도 그에게 지워져서는 안 됩니다
  - 어떤 일도 그에게 넘어와서는 안 됩니다
  lexicon: HALOT
  rationale: 법적·행정적 부담이 그에게 지워지지 않는다는 뜻을 한국어 관용으로 옮겼습니다.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת
  english_pob_choice: He shall be free for his household for one year
  chosen_korean: 그는 한 해 동안 자기 집을 위해 자유로워야 하며
  alternatives_korean:
  - 그는 한 해 동안 자기 집에 대해 면제되어야 하며
  - 그는 한 해 동안 집 안에서 자유로워야 하며
  lexicon: HALOT
  rationale: נָקִי의 ‘면제됨/부담 없음’을 ‘자유로워야’로 풀고, לְבֵיתוֹ는 단순 위치보다 가정 단위의 책임을 가리키므로 ‘자기 집을 위해’로 옮겼습니다.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ אֲשֶׁר לָקָח
  english_pob_choice: and he shall make his wife whom he has taken rejoice
  chosen_korean: 그가 맞이한 아내를 즐겁게 해야 합니다
  alternatives_korean:
  - 그가 맞이한 아내를 기쁘게 해야 합니다
  - 그가 취한 아내를 즐겁게 해야 합니다
  lexicon: HALOT
  rationale: שׂמח의 사역적 뉘앙스를 살려 아내에게 기쁨을 주는 행위로 옮겼고, 아내를 ‘맞이한’으로 앞 절의 לָקַח과 연결했습니다.
theological_decisions:
- issue: 혼인 직후 남편의 군사·공적 의무 면제
  chosen_reading: 새 아내를 맞이한 남편은 일정 기간 군사 동원과 공적 부담에서 제외됩니다.
  alternative_readings:
  - 전쟁 참전만 금지됩니다
  - 단지 개인적 휴가를 뜻합니다
  rationale: 본문의 צָבָא와 ‘어떤 일도 부과되지 말라’는 병행을 함께 반영해야 하므로, 전투만이 아니라 더 넓은 공적 의무 면제로 이해했습니다.
  doctrine_reference: 신 24:5; 언약 공동체의 가정 보호 규정
