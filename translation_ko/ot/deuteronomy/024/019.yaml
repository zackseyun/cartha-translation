review_pass:
  verdict: revise
  source_fidelity: The draft conveys the harvest setting, forgotten sheaf, prohibition on retrieval, the three protected groups, and Yahweh's blessing. However, '그것은 ... 위한 것이 되게 하십시오' incorrectly makes the addressee cause the sheaf to become provision; יִהְיֶה states that it is to be/shall be for those persons. The final clause is better rendered as the stated purpose/result of compliance, not merely a present-tense assertion.
  naturalness: The draft has an awkward switch from informal-singular '네가' to formal-polite '하십시오' and then '당신의.' It also repeats '밭/들' where the Hebrew uses the same field setting, and '당신의 손이 하는 모든 일' is less natural than '당신의 손으로 하는 모든 일.'
  terminology: Use '나그네' for גֵּר as a readable rendering, with a note identifying its resident non-native sense. '고아' is natural Korean, though the Hebrew is literally 'fatherless'; the note should describe this Korean lexical issue rather than refer to the English word 'fatherless.' '야훼' correctly follows the supplied naming policy.
  issues:
  - severity: high
    issue: The main clause '그것은 나그네와 고아와 과부를 위한 것이 되게 하십시오' changes the force of יִהְיֶה.
    rationale: The Hebrew says the forgotten sheaf 'shall be for' the sojourner, fatherless, and widow. It is not an additional command to make it become theirs.
  - severity: medium
    issue: 'The draft mixes speech levels and addressee forms: ''네가'' with ''하십시오'' and ''당신의.'''
    rationale: The requested modern formal-polite 합쇼체 requires a consistent addressee form.
  - severity: medium
    issue: Both footnote anchors appear after the final sentence rather than on '나그네' and '고아.'
    rationale: Anchors must identify the precise lexical items explained by their notes.
  - severity: medium
    issue: Footnote b refers to the English term 'fatherless' rather than explaining the Korean rendering and the Hebrew sense.
    rationale: A Korean footnote should be intelligible on its own and accurately explain that '고아' renders a term literally meaning one without a father.
  revised_text: 당신이 밭에서 곡식을 거두다가 밭에 곡식단 하나를 잊어버렸으면, 그것을 가지러 다시 돌아가지 마십시오. 그것은 나그네[a]와 고아[b]와 과부를 위한 것입니다. 그리하면 야훼, 당신의 하나님께서 당신의 손으로 하는 모든 일에 복을 주실 것입니다.
