  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
  footnotes:
  - marker: a
    text: Or 'the foreigner,' 'the resident alien,' or 'the stranger' for 'the sojourner.' The Hebrew term refers to a non-native resident living among Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'the orphan' for 'the fatherless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 밭에서 추수할 때 들에서 곡식단 하나를 잊고 놓쳤거든, 그것을 가지러 다시 돌아가지 말고 그것은 나그네와 고아와 과부를 위한 것이 되게 하십시오. 그리하면 야훼 당신의 하나님께서 당신의 손이 하는 모든 일에 복을 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''나그네''는 히브리어 גֵּר를 옮긴 것으로, 이스라엘 가운데 거주하는 비토착 거주자를 가리킵니다.'
    reason: lexical_alternative
  - marker: b
    text: '''고아''는 이 문맥의 ''fatherless''에 대한 대안 번역입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצִירְךָ / תִקְצֹר
  english_pob_choice: you reap your harvest
  chosen_korean: 밭에서 추수할 때
  alternatives_korean:
  - 곡식을 거둘 때
  - 수확할 때
  lexicon: HALOT
  rationale: 추수/거두기는 농경 법문맥을 자연스럽게 살리면서 'reap'의 곡식 베기 뉘앙스를 유지합니다.
- source_word: עֹמֶר
  english_pob_choice: a sheaf
  chosen_korean: 곡식단 하나
  alternatives_korean:
  - 한 단
  - 한 이삭단
  lexicon: HALOT
  rationale: 여기서는 저장·운반용 곡식 묶음을 가리키므로 '곡식단'이 문맥상 가장 분명합니다.
- source_word: לַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인 거주자
  - 이방인
  lexicon: HALOT
  rationale: הַגֵּר의 법적·사회적 약자성을 살리면서도 한국어 성경문맥에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기 본문의 신명칭은 '야훼'로 음역하여 언약적 고유성을 보존합니다.
theological_decisions:
- issue: 가르침의 문체와 명령의 대상
  chosen_reading: 본문의 법문은 청중에게 직접 주는 명령이므로 한국어도 '하십시오'체로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 권고형으로 완화
  rationale: 히브리어 금령과 규정의 직접성을 유지하려면 한국어에서도 공적 법문체의 명령형이 적절합니다.
  doctrine_reference: Translation philosophy §1, casuistic law style
- issue: 야훼의 복 주심의 목적절
  chosen_reading: '''그리하면 … 복을 주십니다''로 결과·목적 관계를 살렸습니다.'
  alternative_readings:
  - '''… 하시도록'''
  - '''… 복을 받게 됩니다'''
  rationale: לְמַעַן + yiqtol의 의도된 결과를 한국어의 자연스러운 인과 표현으로 전달합니다.
  doctrine_reference: Translation philosophy §5
