revisions:
- from: 네가 밭에서 추수할 때 들에서 곡식단 하나를 잊고 놓쳤거든, 그것을 가지러 다시 돌아가지 말고 그것은 나그네와 고아와 과부를 위한 것이 되게 하십시오. 그리하면 야훼 당신의 하나님께서 당신의 손이 하는 모든 일에 복을 주십니다.[a][b]
  to: 당신이 밭에서 곡식을 거두다가 밭에 곡식단 하나를 잊어버렸으면, 그것을 가지러 다시 돌아가지 마십시오. 그것은 나그네[a]와 고아[b]와 과부를 위한 것입니다. 그리하면 야훼, 당신의 하나님께서 당신의 손으로 하는 모든 일에 복을 주실 것입니다.
  rationale: The revision preserves the casuistic conditional and direct prohibition in consistent 합쇼체, restores the declarative force of 'it shall be for,' and renders the blessing clause as the intended result. It also places each lexical note at its referent and revises the notes for independent Korean clarity.
