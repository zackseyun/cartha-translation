translation:
  language: ko
  text: 해가 질 때 그에게 그 담보물을 반드시 돌려주십시오[a]. 그러면 그가 자기 겉옷을 덮고 누워 당신에게 복을 빌 것입니다. 그러면 그것이 당신의 하나님 야훼 앞에서 당신에게 의가 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저당물’ 또는 ‘담보로 잡은 물건’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것이 당신에게 의로 여겨질 것입니다’ 또는 ‘당신에게 의로운 일이 될 것입니다’.
    reason: lexical_alternative
lexical_decisions:
