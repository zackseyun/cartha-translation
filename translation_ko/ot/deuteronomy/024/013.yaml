  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'the collateral' or 'what was taken in pledge.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it will be counted as righteousness for you' or 'it will be a righteous deed for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 질 때 그에게 저당물을 반드시 돌려주십시오[a]. 그러면 그가 자기 겉옷을 덮고 누울 수 있고, 당신에게 복을 빌 것입니다[b]. 그러면 그것이 당신에게 야훼 당신의 하나님 앞에서 의가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 저당물’ 혹은 ‘저당 잡힌 것’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것이 당신에게 의로 여겨질 것입니다’ 혹은 ‘당신에게 의로운 일이 될 것입니다’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  english_pob_choice: You must surely return
  chosen_korean: 반드시 돌려주십시오
  alternatives_korean:
  - 꼭 돌려주십시오
  - 반드시 되돌려주십시오
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형과 미완료형 결합이 주는 강한 명령의 강조를 한국어의 부사 ‘반드시’로 살렸습니다.
- source_word: הַעֲבוֹט
  english_pob_choice: the pledge
  chosen_korean: 저당물
  alternatives_korean:
  - 담보물
  - 잡힌 물건
  - 전당물
  lexicon: HALOT
  rationale: 문맥상 빌려준 돈의 담보로 잡은 물건을 가리키므로, 단순한 일반어보다 법적 의미가 드러나는 ‘저당물’을 택했습니다.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  english_pob_choice: at sunset
  chosen_korean: 해가 질 때
  alternatives_korean:
  - 해 질 무렵
  - 해가 들어갈 때
  lexicon: HALOT
  rationale: 직역하면 ‘해가 들어옴’이지만, 관용적으로 ‘해가 질 때’가 가장 자연스럽고 뜻도 분명합니다.
- source_word: וּבֵרֲכֶךָּ
  english_pob_choice: and bless you
  chosen_korean: 당신에게 복을 빌 것입니다
  alternatives_korean:
  - 당신을 축복할 것입니다
  - 당신에게 복을 빌어줄 것입니다
  lexicon: HALOT
  rationale: ברך의 기본 의미를 살리되, 가난한 사람이 채권자에게 행하는 말의 성격을 드러내기 위해 ‘복을 빌다’로 옮겼습니다.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  english_pob_choice: and it will be righteousness for you
  chosen_korean: 그것이 당신에게 … 의가 될 것입니다
  alternatives_korean:
  - 그것이 당신에게 의로 여겨질 것입니다
  - 그것이 당신에게 의로운 일이 될 것입니다
  lexicon: HALOT
  rationale: צְדָקָה를 도덕적 선행으로 완화하지 않고, 하나님 앞에서 ‘의’로 인정되는 상태를 가리키는 표현으로 최대한 가깝게 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 구절의 신명은 프로젝트 기본어인 ‘야훼’를 사용해 원문의 고유명사를 유지했습니다.
theological_decisions:
- issue: צְדָקָה의 신학적·법적 뉘앙스
  chosen_reading: 이 행위는 하나님 앞에서 ‘의’로 간주되는 행위입니다.
  alternative_readings:
  - 도덕적으로 선한 일입니다
  - 의로운 공로가 됩니다
  rationale: 본문은 보상적 공로를 말하기보다 언약적·법적 차원에서 옳은 행위를 선언하므로, ‘의’로 유지해 그 긴장을 보존했습니다.
  doctrine_reference: Deuteronomy covenant ethics / righteousness before God
- issue: 야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 고유한 언약 անուն이므로, 일반 호칭으로 바꾸지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: POB name-of-God convention
