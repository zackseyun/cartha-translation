- from: 해가 질 때 그에게 저당물을 반드시 돌려주십시오[a]. 그러면 그가 자기 겉옷을 덮고 누울 수 있고, 당신에게 복을 빌 것입니다[b]. 그러면 그것이 당신에게 야훼 당신의 하나님 앞에서 의가 될 것입니다.
  to: 해가 질 때 그에게 그 담보물을 반드시 돌려주십시오[a]. 그러면 그가 자기 겉옷을 덮고 누워 당신에게 복을 빌 것입니다. 그러면 그것이 당신의 하나님 야훼 앞에서 당신에게 의가 될 것입니다[b].
  rationale: 담보물의 현대적 법률 의미를 분명히 하고, 마지막 절의 어순을 자연스럽게 조정했습니다. 또한 ‘의’에 관한 각주를 해당 본문 어구 뒤로 옮겼습니다. 명령의 강조, 겉옷을 덮고 눕는 상황, 복을 비는 결과, 그리고 하나님 앞에서의 ‘의’라는 원문의 의미와 모호성은 유지했습니다.
  reviewer_model: gpt-5.6-terra
