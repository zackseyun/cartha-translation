  naturalness: 현 초안의 마지막 문장 ‘당신에게 야훼 당신의 하나님 앞에서’는 어순이 부자연스럽습니다. ‘당신의 하나님 야훼 앞에서 당신에게’로 정리하면 원문의 관계를 유지하면서도 자연스럽습니다. ‘자기 겉옷을 덮고 누워’는 잠자리의 덮개로 쓰는 겉옷이라는 문맥을 자연스럽게 나타냅니다.
