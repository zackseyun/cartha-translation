id: DEU.24.6
reference: Deuteronomy 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
  footnotes:
  - marker: a
    text: Or, 'for he would be taking a person's livelihood as a pledge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 두 맷돌이나, 혹은 윗맷돌까지도 저당 잡아서는 안 됩니다. 그것은 생명을 저당 잡는 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 사람의 생계를 저당 잡는 것이기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַחֲבֹל / חֹבֵל
  english_pob_choice: take ... as a pledge / taking ... as a pledge
  chosen_korean: 저당 잡다 / 저당 잡는 것
  alternatives_korean:
  - 담보로 잡다
  - 전당 잡다
  lexicon: HALOT
  rationale: 법률 문맥의 חבל을 현대 한국어 법률감각에 맞게 ‘저당 잡다’로 옮겨, 채무 보증으로 물건을 잡는 행위를 분명하게 드러냈습니다.
- source_word: רֵחַיִם
  english_pob_choice: a pair of millstones
  chosen_korean: 두 맷돌
  alternatives_korean:
  - 맷돌 한 쌍
  - 맷돌들
  lexicon: HALOT
  rationale: 쌍수형이 가리키는 맷돌의 한 벌을 자연스러운 한국어로 압축해 표현했습니다.
- source_word: וָרָכֶב
  english_pob_choice: or even the upper millstone
  chosen_korean: 혹은 윗맷돌까지도
  alternatives_korean:
  - 그리고 윗맷돌도
  - 아니면 윗맷돌도
  lexicon: HALOT
  rationale: 전체 맷돌뿐 아니라 핵심 구성품인 윗맷돌까지 금지된다는 법적 강도를 살리기 위해 ‘까지도’를 넣었습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: a life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 사람의 생계
  lexicon: HALOT
  rationale: 이 절에서 נֶפֶשׁ은 추상적 ‘영혼’이 아니라, 곡식을 갈 수 없게 되어 실제로 위협받는 생명을 뜻하므로 ‘생명’이 가장 직접적입니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미
  chosen_reading: 물질적 생계와 직결된 구체적 생명
  alternative_readings:
  - 영혼
  - 인격
  rationale: 문맥상 이 율법은 채무자의 식량 준비 수단을 빼앗아 생존을 위협하는 행위를 금지합니다. 따라서 인류학적 교리보다 사회윤리적 강도를 우선 반영했습니다.
  doctrine_reference: 신명기 24:6의 법적-윤리적 문맥
