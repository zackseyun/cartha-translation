review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands חבל as taking collateral, רֵחַיִם as the paired millstones, רכב as the upper stone, and נפשׁ as concrete life rather than an immaterial soul. However, ‘두 맷돌’ can be heard as merely two separate stones, and ‘저당 잡다’ is less precise for a creditor’s taking an object as security in this context.
  naturalness: ‘사람은’ is less idiomatic than ‘아무도’ for a prohibition. ‘맷돌 한 벌은 물론 윗돌 하나라도’ clearly and naturally conveys the prohibition of both the complete mill and even its essential upper stone. ‘담보로 잡다’ is natural in this legal context, and ‘사람의 목숨’ makes the concrete force of נפשׁ idiomatic Korean.
  terminology: Replace ‘저당 잡다’ with ‘담보로 잡다.’ A mortgage-specific expression can blur the broader pledge/collateral sense of חבל. Render the dual as ‘맷돌 한 벌’ and retain ‘윗돌’ as the conventional, readily understood designation for the upper millstone.
  issues:
  - severity: medium
    issue: ‘두 맷돌’ is potentially ambiguous.
    rationale: It can denote two individual millstones rather than the paired apparatus indicated by the Hebrew dual. ‘맷돌 한 벌’ better preserves the referent.
  - severity: medium
    issue: ‘저당 잡다’ is not the best term for the collateral action in this verse.
    rationale: ‘저당’ has more specific modern legal associations, whereas חבל here concerns taking an item as a pledge/security. ‘담보로 잡다’ is broader and clearer.
  - severity: low
    issue: The prohibition’s emphatic relation between the whole mill and its upper stone is muted.
    rationale: ‘맷돌 한 벌은 물론 윗돌 하나라도’ naturally represents the legal force conveyed by the coordinated terms and the English audit’s ‘or even.’
  revised_text: 아무도 맷돌 한 벌은 물론 윗돌 하나라도 담보로 잡아서는 안 됩니다. 이는 사람의 목숨을 담보로 잡는 것이기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘이는 사람의 생계를 담보로 잡는 것이기 때문입니다.’
    reason: lexical_alternative
  revision_rationale: The revision preserves the repeated collateral terminology and the concrete life/livelihood sense of נפשׁ while using modern, formal-polite Korean. It also removes ambiguity about the paired millstones and makes explicit that even the upper stone alone may not be taken as collateral.
