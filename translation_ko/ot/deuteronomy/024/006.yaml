translation:
  language: ko
  text: 아무도 맷돌 한 벌은 물론 윗돌 하나라도 담보로 잡아서는 안 됩니다. 이는 사람의 목숨을 담보로 잡는 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이는 사람의 생계를 담보로 잡는 것이기 때문입니다.’
