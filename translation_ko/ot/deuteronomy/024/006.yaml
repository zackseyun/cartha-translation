  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
  footnotes:
  - marker: a
    text: Or, 'for he would be taking a person's livelihood as a pledge.'
