revisions:
- from: 사람은 두 맷돌이나, 혹은 윗맷돌까지도 저당 잡아서는 안 됩니다. 그것은 생명을 저당 잡는 것이기 때문입니다.[a]
  to: 아무도 맷돌 한 벌은 물론 윗돌 하나라도 담보로 잡아서는 안 됩니다. 이는 사람의 목숨을 담보로 잡는 것이기 때문입니다.[a]
  rationale: The revision preserves the repeated collateral terminology and the concrete life/livelihood sense of נפשׁ while using modern, formal-polite Korean. It also removes ambiguity about the paired millstones and makes explicit that even the upper stone alone may not be taken as collateral.
  reviewer_model: gpt-5.6-terra
