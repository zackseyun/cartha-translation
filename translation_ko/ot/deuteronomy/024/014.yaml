revisions:
- from: 당신은 품삯을 받는 가난하고 궁핍한 사람을 억압해서는 안 됩니다. 곧 당신의 형제 가운데 있는 사람이든 당신의 땅 안, 당신의 성문들 안에 있는 당신의 나그네 가운데 있는 사람이든 그러합니다.[a][b]
  to: 품삯을 받고 일하는 가난하고 궁핍한 사람이 당신의 형제 가운데 하나이든, 당신의 땅 곧 당신의 성문들[b] 안에 있는 거류민이든, 그를 착취해서는 안 됩니다.[a]
  rationale: 문장을 금지 명령으로 자연스럽게 재구성하고, 두 대상 범주를 원문의 병렬대로 ‘…이든 …이든’으로 옮겼습니다. 거류민을 수식하는 ‘당신의 땅 곧 당신의 성문들 안에’를 보존했으며, 성문 관용구 각주의 앵커를 해당 표현에 붙였습니다. 신학적 해석을 추가하지 않았습니다.
