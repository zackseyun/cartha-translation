  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
  footnotes:
  - marker: a
    text: Or 'defraud' or 'exploit' a hired worker; the Hebrew verb includes economic oppression.
    reason: lexical_alternative
  - marker: b
    text: '''Within your gates'' is a Hebrew idiom for life within your towns or community jurisdiction.'
    reason: cultural_note
translation:
  language: ko
  text: 품삯을 받고 일하는 가난하고 궁핍한 사람이 당신의 형제 가운데 하나이든, 당신의 땅 곧 당신의 성문들[b] 안에 있는 거류민이든, 그를 착취해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘착취하다’로 번역한 말은 임금을 부당하게 떼어먹거나 주지 않는 일 등을 포함하는 경제적 압박을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문들 안’은 성읍들 안에서의 생활과 공동체의 관할 범위를 가리키는 히브리 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  english_pob_choice: oppress
  chosen_korean: 억압해서는 안 됩니다
  alternatives_korean:
  - 착취해서는 안 됩니다
  - 속여서는 안 됩니다
  - 학대해서는 안 됩니다
  lexicon: HALOT
  rationale: עָשַׁק은 임금 체불 같은 경제적 압제를 포함하므로, 한국어에서는 의미 범위가 넓은 ‘억압하다’가 POB의 ‘oppress’를 가장 잘 반영합니다.
- source_word: שָׂכִיר
  english_pob_choice: hired worker
  chosen_korean: 품삯을 받는 사람
  alternatives_korean:
  - 고용된 일꾼
  - 품꾼
  - 품삯을 받는 일꾼
  lexicon: HALOT
  rationale: 직역하면 ‘품삯을 받는 사람’이며, 현대 한국어에서 법적·경제적 관계를 분명하게 드러내면서도 고어체를 피할 수 있습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: poor and needy
  chosen_korean: 가난하고 궁핍한
  alternatives_korean:
  - 가난하고 필요한
  - 가난하고 빈궁한
  - 가난하고 결핍한
  lexicon: HALOT
  rationale: 두 형용사는 경제적 취약성을 중첩해서 나타내므로, 한국어에서는 자연스럽고 강한 어감의 ‘가난하고 궁핍한’이 적절합니다.
- source_word: מֵאַחֶיךָ / מִגֵּרְךָ
  english_pob_choice: one of your brothers / one of your sojourners
  chosen_korean: 당신의 형제 가운데 있는 사람 / 당신의 나그네 가운데 있는 사람
  alternatives_korean:
  - 당신의 형제들 중 하나 / 당신의 거류민들 중 하나
  - 당신의 동족 / 당신의 이방 체류자
  lexicon: HALOT
  rationale: ‘형제’는 언약 공동체 안의 동족을, ‘나그네’는 공동체 안에 거주하는 보호받는 외인을 살립니다. ‘가운데 있는 사람’은 히브리어의 출신 범주를 한국어에서 자연스럽게 풀어 줍니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 당신의 성문들 안에
  alternatives_korean:
  - 당신의 성읍들 안에
  - 당신의 마을들 안에
  - 당신의 관할 안에
  lexicon: HALOT
  rationale: ‘성문들’은 공동체 생활과 사법 관할의 장소를 가리키는 히브리 관용구이므로, 이미지를 보존하는 번역이 적절합니다.
theological_decisions:
- issue: ‘형제’와 ‘나그네’의 공동체 범위
  chosen_reading: 본문은 이스라엘 공동체 내부의 동족뿐 아니라 그 땅 안에 거주하는 보호받는 외인까지 포함해 같은 금지 명령을 적용합니다.
  alternative_readings:
  - 형제만을 지칭하는 제한된 명령
  - 나그네를 단순한 외국인 방문자로 이해하는 읽기
  rationale: 신명기적 율법 문맥에서 שני 범주는 모두 경제적 보호의 대상입니다. 한국어에서도 두 집단을 병렬로 살려 공적·윤리적 범위를 분명히 해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
