review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the olive tree and the three beneficiary groups. However, “그 뒤에 다시 가지 말라” is too literal and can mean merely not returning physically; the Hebrew harvest idiom prohibits making a second pass over the tree to collect what remains. The final legal assignment is better expressed in Korean as leaving the remainder for those groups.
  naturalness: “네가 … 친다면” is less fitting than the casuistic-temporal “... 칠 때에는,” and “그 뒤에 다시 가지 말라” is unnatural in this agricultural context. A modern formal-polite rendering should use 합쇼체 consistently.
  terminology: “감람나무,” “나그네,” “고아,” and “과부” are appropriate standard Korean biblical/legal terms here. No theological terminology issue is present.
  issues:
  - severity: medium
    issue: The phrase “그 뒤에 다시 가지 말라” does not clearly convey the prohibition on making a second harvesting pass.
    rationale: 'לֹא תְפָאֵר אַחֲרֶיךָ is an olive-harvest idiom: after beating the tree, one must not go back over it to remove remaining fruit. “다시 훑지 마십시오” conveys this without adding interpretive detail.'
  - severity: low
    issue: Register and legal-clause phrasing are uneven.
    rationale: “친다면” is a conditional form, while כִּי in this casuistic instruction is naturally rendered “... 칠 때에는.” “말라/될 것이다” also fails to maintain the requested modern formal-polite 합쇼체.
  revised_text: 네가 네 감람나무를 칠 때에는 그 뒤를 다시 훑지 마십시오. 그것은 나그네와 고아와 과부의 몫으로 남겨 두십시오.
  revised_footnotes: []
