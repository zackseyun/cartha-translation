  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a slave in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: ko
  text: 그리고 기억하십시오. 당신이 이집트에서 종이었고, 야훼 당신의 하나님께서 거기에서 당신을 속량하셨습니다. 그러므로 나는 당신에게 이 일을 하라고 명령합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’은 본문의 예속 상태를 완곡하게 옮긴 표현입니다. 이 절의 압박적 현실을 더 강하게 드러내려면 ‘노예’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: And remember
  chosen_korean: 그리고 기억하십시오
  alternatives_korean:
  - 기억하십시오
  - 그러므로 기억하십시오
  lexicon: HALOT
  rationale: 문맥상 권면형 명령이므로 한국어에서도 명령형으로 옮기되, 앞의 연결어 וְ를 살려 ‘그리고’로 시작했습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종사자
  lexicon: HALOT
  rationale: 이 본문은 이집트에서의 예속 상태를 상기시키지만, 한국어 성경 전통과 문체를 고려하면 ‘종’이 가장 직접적이면서도 자연스럽습니다. 다만 본문의 억압적 현실을 약화시키지 않도록 ‘노예’도 검토 가능했습니다.
- source_word: וַיִּפְדְּךָ
  english_pob_choice: redeemed you
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 구원하셨습니다
  lexicon: HALOT
  rationale: פּדה는 단순한 해방보다 대가를 치르고 건져내는 의미가 있어 ‘속량하다’가 가장 가깝습니다. 구원은 의미가 넓고, 구속은 신학적 울림은 있으나 현대 한국어에서 다소 경직될 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자 그대로의 신명 표기를 따라 ‘야훼’를 사용합니다. 본문이 ‘당신의 하나님’과 구분된 고유명을 드러내므로 ‘주’로 대체하지 않았습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this
  chosen_korean: 이 일을
  alternatives_korean:
  - 이것을
  - 이 일을
  lexicon: HALOT
  rationale: 직전의 법적 지시를 가리키는 דבר는 한국어에서 ‘일’이 가장 자연스럽고 문맥상 적절합니다. ‘이것’은 다소 지시적이고, ‘이 일’은 행위 지시의 성격을 더 분명히 합니다.
theological_decisions:
- issue: 출애굽 기억을 윤리적 의무로 연결하는 방식
  chosen_reading: 하나님의 속량이 곧 순종의 근거가 되도록, ‘그러므로’와 ‘명령합니다’를 유지했습니다.
  alternative_readings:
  - 그래서
  - 당부합니다
  rationale: 본문의 על כן은 단순한 설명이 아니라 구원 경험에서 윤리적 의무로 나아가는 논리를 표시합니다. 따라서 명령의 강도를 약화시키지 않았습니다.
  doctrine_reference: '신명기 언약 신학: 구원-순종 구조'
- issue: 종/노예 선택
  chosen_reading: ‘종’으로 두되, 본문의 예속 현실은 속량과 함께 분명히 드러나도록 했습니다.
  alternative_readings:
  - 노예
  - 하인
  rationale: 이 절은 이집트에서의 비자발적 예속을 상기시키므로 ‘노예’가 더 직접적일 수 있습니다. 그러나 한국어 본문 전체의 흐름과 합쇼체 문체에서는 ‘종’이 지나친 현대적 충격 없이도 본래 뜻을 전달합니다.
  doctrine_reference: 번역 철학 §1; bonded-status terminology
