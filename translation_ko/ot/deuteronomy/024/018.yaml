  to: 그리고 기억하십시오. 당신은 이집트에서 노예였고, 야훼, 당신의 하나님께서 그곳에서 당신을 속량하셨습니다. 그러므로 나는 당신에게 이 일을 하라고 명령합니다.
  rationale: ‘노예’로 수정하여 עֶבֶד가 이집트에서 가리키는 예속의 현실을 직접적으로 반영했습니다. 불필요하게 선택어를 약화시키는 각주는 삭제했습니다. 그 밖에는 원문의 접속, 인칭, 구원 행위, 윤리적 결론과 명령의 강도를 유지했습니다.
