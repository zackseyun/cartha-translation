id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
  footnotes:
  - marker: a
    text: Or 'children' for 'sons'; the Hebrew literally says 'sons' in both clauses.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall die'; the Hebrew more specifically indicates being put to death.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지들은 자식들 때문에 죽임을 당해서는 안 되고, 자식들도 아버지들 때문에 죽임을 당해서는 안 됩니다. 각 사람은 자기 죄 때문에 죽임을 당해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자식들’은 원문의 문자적 표현 ‘아들들’을 문맥상 넓혀 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽임을 당하다’는 원문의 사법적 처형 뉘앙스를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  english_pob_choice: shall be put to death
  chosen_korean: 죽임을 당해서는 안 됩니다 / 죽임을 당해야 합니다
  alternatives_korean:
  - 죽어서는 안 됩니다 / 죽어야 합니다
  - 사형을 받아서는 안 됩니다 / 사형을 받아야 합니다
  lexicon: HALOT
  rationale: 히필형 מות은 단순한 죽음이 아니라 ‘죽임을 당하게 하다’라는 사법적 처형을 가리키므로, 한국어도 자연스러운 수동 표현으로 살렸습니다.
- source_word: אָבוֹת
  english_pob_choice: fathers
  chosen_korean: 아버지들
  alternatives_korean:
  - 부모들
  - 아버지
  lexicon: HALOT
  rationale: 히브리어가 성별이 있는 ‘아버지들’을 말하므로, 일반화한 ‘부모들’보다 원문을 더 직접적으로 반영하는 ‘아버지들’이 적절합니다.
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 자식들
  alternatives_korean:
  - 아들들
  - 아이들
  lexicon: HALOT
  rationale: 원문은 문자적으로는 ‘아들들’이지만, 본문의 법적 원리는 자녀 전체에 적용되므로 문맥상 오해를 줄이기 위해 ‘자식들’을 택했습니다. 다만 역어를 넓힌 점은 주석 없이 본문에서 드러나지 않게 과도하게 확장하지 않았습니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 사람마다
  lexicon: HALOT
  rationale: 분배적 용법을 한국어로 자연스럽게 드러내면서도, ‘남자’로 성별을 불필요하게 강조하지 않기 위해 ‘각 사람’을 썼습니다.
- source_word: בְּחֶטְאוֹ
  english_pob_choice: for his own sin
  chosen_korean: 자기 죄 때문에
  alternatives_korean:
  - 자기 죄로 인해
  - 그의 죄 때문에
  lexicon: HALOT
  rationale: 법정적 책임의 원인을 나타내는 전치사 ב를 한국어의 ‘때문에’로 옮겨, 타인의 죄가 아니라 자기 죄가 처벌 근거라는 점을 분명히 했습니다.
theological_decisions:
- issue: 가문 연좌 처벌의 부정
  chosen_reading: 이 구절은 아버지와 자식 사이에 처형 책임을 전가하지 말고, 각 사람의 자기 죄에 따라 사법적 처벌을 하라는 원칙을 말합니다.
  alternative_readings:
  - 세대 간 모든 결과를 포괄하는 일반 윤리 원칙
  - 단순히 가족 내 형벌 연대를 금지하는 규정
  rationale: 히필형 ‘죽임을 당하다’가 사법적 처형을 가리키므로, 본문은 일반적 운명론보다 연좌적 사형의 금지를 직접 말합니다.
  doctrine_reference: Translation philosophy §1, §3, §4
