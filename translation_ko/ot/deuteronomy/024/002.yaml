translation:
  language: ko
  text: 그 여자는 그의 집에서 나와 가서 다른 남자의 아내가 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다른 남자에게’입니다. 히브리어 관용은 그 여자가 다른 남자와 혼인 관계에 들어감을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  english_pob_choice: and she leaves his house
  chosen_korean: 그의 집에서 나가서
  alternatives_korean:
  - 그의 집을 떠나서
  - 그의 집에서 나가
  lexicon: HALOT
  rationale: יצא는 여기서 집을 벗어나는 이동을 뜻하므로, 한국어에서는 문맥에 맞게 ‘집에서 나가서’로 옮겨 절차적 진행을 살렸습니다.
- source_word: וְהָלְכָה
  english_pob_choice: and goes
  chosen_korean: 나가서
  alternatives_korean:
  - 가서
  - 떠나서
  lexicon: HALOT
  rationale: 이 동사는 앞선 ‘나감’ 다음의 다음 단계 진행을 나타내므로, 중복을 피하면서도 순서를 살리는 ‘나가서’로 처리했습니다.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  english_pob_choice: and becomes another man's wife
  chosen_korean: 다른 남자의 아내가 됩니다
  alternatives_korean:
  - 다른 남자에게 속하게 됩니다
  - 다른 남자와 결혼하게 됩니다
  lexicon: HALOT
  rationale: היה + לְ는 단순 존재가 아니라 새로운 관계/상태로 들어감을 뜻하므로, 결혼 관계를 분명히 드러내는 ‘아내가 됩니다’로 옮겼습니다.
theological_decisions:
- issue: ‘to another man’라는 히브리어 관용구를 한국어에서 어떻게 드러낼지
  chosen_reading: 관용적 의미를 풀어 ‘다른 남자의 아내가 됩니다’로 번역했습니다.
  alternative_readings:
  - 직역하여 ‘다른 남자에게 됩니다’
  - ‘다른 남자에게 속하게 됩니다’
  rationale: 법적 문맥에서 단순 소속이 아니라 혼인 상태의 변화를 말하므로, 원문의 관계적 의미를 한국어로 명시하는 것이 더 정확합니다.
  doctrine_reference: 혼인/이혼 관련 법규문의 문맥적 의미 보존
