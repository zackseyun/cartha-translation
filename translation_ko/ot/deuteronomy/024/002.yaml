  source_fidelity: 현 번역은 여성 단수 주어를 남성인 ‘그는’으로 옮긴 점이 원문과 맞지 않습니다. 또한 וְהָלְכָה(‘그리고 가서’)가 앞의 ‘나가서’와 중복되어 실질적으로 누락되었습니다. 수정문은 여성 주어와 원문의 연속된 동작을 모두 반영합니다.
  naturalness: ‘그 여자는 그의 집에서 나와 가서’는 다소 직역적인 연결이지만, 법규문의 순차적 서술을 보존하면서 현대 한국어에서도 이해 가능합니다. ‘다른 남자의 아내가 됩니다’는 자연스럽고 문맥상 정확합니다.
  terminology: ‘다른 남자의 아내가 됩니다’는 הָיְתָה לְאִישׁ אַחֵר의 혼인 관계 진입을 적절히 드러냅니다. 각주도 여성 지시어로 바로잡아야 합니다.
  issues:
