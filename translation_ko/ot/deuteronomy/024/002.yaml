    rationale: 각주의 ‘그가 다른 남자와’는 여성 주어와 맞지 않으므로 ‘그 여자가 다른 남자와’로 고쳐야 합니다.
  revised_text: 그 여자는 그의 집에서 나와 가서 다른 남자의 아내가 됩니다.[a]
