  - severity: medium
    issue: וְהָלְכָה의 번역 누락
    rationale: ‘그의 집에서 나가서’는 וְיָצְאָה מִבֵּיתוֹ를 옮긴 것이며, 이어지는 ‘그리고 가서’도 번역에 반영되어야 합니다.
  - severity: medium
