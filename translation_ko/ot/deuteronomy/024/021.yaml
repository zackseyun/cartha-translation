  source_fidelity: 원문의 בָּצַר는 포도원 자체를 수확하는 것이 아니라 포도원에서 포도를 거두는 행위입니다. 또한 לֹא תְעוֹלֵל אַחֲרֶיךָ는 수확 후 남은 포도를 거두기 위해 다시 훑어 따지 말라는 뜻이므로, 이를 명시하는 편이 정확합니다. 남은 것은 나그네, 고아, 과부를 위한다는 법적 귀속도 유지했습니다.
  naturalness: 초안의 ‘포도원을 수확할 때’는 한국어에서 목적어 결합이 부자연스럽고 의미도 다소 어긋납니다. ‘포도원에서 포도를 거둘 때’와 ‘남은 것을 거두려고 다시 돌아다니지 마십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘나그네, 고아, 과부’는 히브리어의 사회적 보호 대상 삼중 표현을 간결하게 보존합니다. 여기서 ‘나그네’는 단순 여행자가 아니라 공동체 안에 거주하는 비토착 주민을 가리키는 문맥이지만, 본문에서는 전통적이고 간결한 역어를 유지할 수 있습니다.
