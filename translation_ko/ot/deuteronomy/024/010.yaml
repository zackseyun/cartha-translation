  source_fidelity: 본문의 주된 뜻은 대체로 잘 옮겼습니다. 다만 מַשַּׁאת가 포함하는 대부·채무의 맥락은 ‘무엇이든 빌려 주다’만으로는 다소 흐려질 수 있으나, 문맥상 허용 가능한 간결한 표현입니다. עֲבוֹט은 채무를 위한 담보로 맡긴 물건이므로 ‘담보물’이 ‘전당물’보다 더 넓고 정확합니다.
  naturalness: 합쇼체의 법규적 문체는 자연스럽습니다. ‘그의 집에 들어가서 그의 담보물을 취하지 마십시오’도 이해되지만, 목적을 나타내는 ‘담보물을 가지려고 그의 집에 들어가지 마십시오’가 한국어 어순상 더 자연스럽고 히브리어의 목적 부정사도 잘 반영합니다.
  terminology: ‘전당물’은 전당(질물 대부)이라는 비교적 좁은 거래를 연상시킬 수 있습니다. 본문의 עֲבוֹט에는 일반적인 ‘담보물’이 적절합니다. 기존 각주는 부정 명령을 긍정 명령인 ‘취하십시오’로 바꾸어 본문 뜻을 정반대로 만들므로 반드시 고쳐야 합니다.
  issues:
