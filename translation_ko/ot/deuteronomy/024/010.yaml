    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: ~할 때에는
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 법률 조항의 경우절을 자연스러운 한국어 조건문으로 옮겼습니다. 'When'에 대응하는 시간·상황 조건 표현으로 '...할 때에는'이 가장 무리 없이 맞습니다.
- source_word: תַשֶּׁה
  english_pob_choice: you lend
  chosen_korean: 빌려 줄 때에는
  alternatives_korean:
  - 대출할 때에는
  - 빌려 주실 때에는
  lexicon: HALOT
  rationale: 히필형 נשה는 여기에 '빌려 주다/대부하다'의 뜻이므로, 일반 독자가 이해하기 쉬운 '빌려 주다'로 옮겼습니다.
- source_word: מַשַּׁאת מְאוּמָה
  english_pob_choice: a loan of anything
  chosen_korean: 무엇이든
  alternatives_korean:
  - 아무것이나
  - 어떤 것이라도
  lexicon: HALOT
  rationale: מְאוּמָה가 '아무것이나/무엇이든'의 포괄성을 더하므로, 문맥상 대상이 특정되지 않은 점을 살려 '무엇이든'으로 압축해 옮겼습니다.
- source_word: עֲבֹט / לַעֲבֹט
  english_pob_choice: take his pledge
  chosen_korean: 전당물
  alternatives_korean:
  - 담보물
  - 저당물
  lexicon: HALOT
  rationale: 이 단어는 빚에 대한 담보로 맡긴 물건을 가리키므로, 한국어 법률·성경 문맥에서 비교적 직관적인 '전당물'을 선택했습니다.
theological_decisions:
- issue: 가정 사적 공간에 대한 채권 추심 금지의 직접성
  chosen_reading: 채무자의 집 안으로 들어가 담보를 직접 취하지 말라는 명령으로 옮겼습니다.
  alternative_readings:
  - 그의 물건을 받지 말라는 완화된 표현
  - 그가 내는 전당물을 기다리라는 식의 간접 표현
  rationale: 본문은 단순한 예의가 아니라 타인의 집 안에 들어가 담보를 강제로 취하는 행위를 금지하는 법조항이므로, 금지의 강도를 약화시키지 않도록 직설적으로 번역했습니다.
  doctrine_reference: 신 24:10의 자비로운 채권 관행
- issue: 직접 청자에 대한 금지 명령의 높임말 처리
  chosen_reading: 법조문체를 유지하면서도 현대 한국어 공손체로 '마십시오'를 사용했습니다.
  alternative_readings:
  - 들어가지 마라
  - 들어가면 안 됩니다
  rationale: 모세 율법의 공적·규범적 성격을 살리되, 합쇼체 요구에 맞춰 명령형 공손체를 사용했습니다.
  doctrine_reference: 번역체계/문체
