    rationale: 원문의 לֹא תָבֹא와 לַעֲבֹט은 ‘담보물을 취하려고 그의 집에 들어가지 말라’는 금지입니다. 또한 ‘그가 저당 잡힌 것’은 한국어 문법과 담보 관계의 의미 모두에서 부정확합니다.
