language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
  footnotes:
  - marker: a
    text: Or 'kidnapping a person'; literally 'stealing a soul/person.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to fellow members of Israel, not only biological siblings.'
    reason: cultural_note
  - marker: c
    text: Or 'he enslaves him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 자기 형제들 가운데 하나, 곧 이스라엘 자손 가운데 하나를 납치하여 그를 노예로 삼고 팔면, 그 납치한 자는 죽어야 합니다[b][c]. 그러므로 당신들은 그 악을 여러분 가운데에서 제거해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘형제들’은 여기서 생물학적 형제만이 아니라 이스라엘 공동체의 동료 구성원을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그를 노예로 삼고’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּנֵב נֶפֶשׁ
  english_pob_choice: kidnapping
  chosen_korean: 납치하다
  alternatives_korean:
  - 사람을 훔치다
  - 사람을 빼앗다
  lexicon: HALOT
  rationale: 이 법적 문맥에서 נֶפֶשׁ을 ‘사람’으로 풀어낸 강제적 인신탈취를 현대 한국어 법률어에 맞게 ‘납치’로 옮기는 것이 가장 직접적입니다.
- source_word: מֵאֶחָיו / מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: one of his brothers / from the sons of Israel
  chosen_korean: 자기 형제들 가운데 하나, 곧 이스라엘 자손 가운데 하나
  alternatives_korean:
  - 자기 동족 가운데 하나
  - 이스라엘 사람들 가운데 하나
  lexicon: HALOT
  rationale: ‘형제들’은 언약 공동체 내부의 동료 구성원을 가리키는 가족적 표현을 살리고, 뒤의 ‘이스라엘 자손’이 그 범위를 분명히 해 줍니다.
- source_word: וְהִתְעַמֶּר בּוֹ
  english_pob_choice: he enslaves him
  chosen_korean: 그를 노예로 삼고
  alternatives_korean:
  - 그를 종으로 삼고
  - 그를 노예로 부리고
  lexicon: HALOT
  rationale: 이 동사는 단순한 학대가 아니라 사람을 소유물처럼 종속시켜 팔 수 있게 만드는 상태를 뜻하므로, 본문의 강도를 드러내기 위해 ‘노예로 삼다’로 옮겼습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: purge the evil from your midst
  chosen_korean: 그 악을 여러분 가운데에서 제거해야 합니다
  alternatives_korean:
  - 그 악을 여러분 가운데에서 없애야 합니다
  - 그 악을 여러분 가운데서 도려내야 합니다
  lexicon: HALOT
  rationale: 신명기의 반복 공식으로서 공동체 안의 악을 법적으로 제거하라는 뜻을 살려, 과도한 비유를 피하면서도 공적 제재의 의미가 드러나게 했습니다.
theological_decisions:
- issue: 공동체 내부를 지칭하는 2인칭 단수와 현대 한국어 복수/포괄 표현의 처리
  chosen_reading: ‘당신들은’과 ‘여러분 가운데에서’로 옮겨, 공동체 전체에 주는 법적 명령임을 분명히 했습니다.
  alternative_readings:
  - 너는
  - 너희는
  rationale: 히브리어는 단수형이지만 법전 문맥에서는 이스라엘 공동체 전체에 대한 명령이므로, 현대 한국어에서는 자연스러운 복수 포괄 표현이 더 정확하게 기능합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
