  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
  footnotes:
  - marker: a
    text: Or, 'the man who is indebted to you shall bring the pledge out to you.' The Hebrew expression can emphasize either the creditor's act of lending or the debtor's state of indebtedness.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 밖에 서 있어야 합니다. 그리고 당신이 빌려 준 그 사람은 당신에게 그 전당물을 밖으로 가져나올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘당신이 빌려 준 그 사람’으로도, ‘당신에게 빚진 그 사람’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  english_pob_choice: outside
  chosen_korean: 밖에
  alternatives_korean:
  - 바깥에
  - 밖에서
  lexicon: HALOT
  rationale: 집 안으로 들어가지 않고 바깥에 머물라는 법적 장면을 자연스럽게 드러내는 표현으로 ‘밖에’를 택했습니다.
- source_word: תַּעֲמֹד
  english_pob_choice: you shall stand
  chosen_korean: 서 있어야 합니다
  alternatives_korean:
  - 서야 합니다
  - 서 계셔야 합니다
  - 기다려야 합니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 동작인 ‘서다’를 살리되, 한국어에서 명령형 법조문처럼 읽히도록 ‘서 있어야 합니다’로 옮겼습니다.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  english_pob_choice: to whom you are making the loan
  chosen_korean: 당신이 빌려 준 그 사람은
  alternatives_korean:
  - 당신이 대출해 준 그 사람은
  - 당신에게 빚진 그 사람은
  - 당신이 빌려 준 사람에게는
  lexicon: HALOT
  rationale: נשה는 이 문맥에서 채권자-채무자 관계를 가리키므로, ‘빚진 상태’보다 앞 절의 담보 수령 맥락에 맞는 ‘빌려 준’ 표현을 택했습니다.
- source_word: הָעֲבוֹט
  english_pob_choice: the pledge
  chosen_korean: 전당물
  alternatives_korean:
  - 담보물
  - 저당물
  - 담보
  lexicon: HALOT
  rationale: וַעֲבוֹט은 대출의 보증으로 맡기는 물건이므로, 한국어 법률 감각에 맞으면서도 구약 문맥을 살리는 ‘전당물’을 사용했습니다.
theological_decisions:
- issue: 법 조문의 직접성 유지
  chosen_reading: 채권자가 집 안으로 들어가 압박하는 장면을 완화하지 않고, 밖에 서서 전당물을 받는다는 지시를 그대로 살렸습니다.
  alternative_readings:
  - 정중하게 기다리라는 일반적 예절로 완화
  - 담보를 받는 절차로만 일반화
  rationale: 문맥은 이웃의 집 안 사생활을 보호하는 율법 조항이므로, 단순한 예절 권고가 아니라 법적 제한이라는 점이 분명히 드러나야 합니다.
  doctrine_reference: 신 24:10-13의 가난한 자 보호 규정
- issue: ‘전당물’의 법적 뉘앙스
  chosen_reading: 담보나 물건 일반보다 ‘전당물’로 옮겨, 빚과 결부된 구체적 법적 물건임을 나타냈습니다.
  alternative_readings:
  - 담보
  - 보증물
  - 잡아 둔 물건
  rationale: 히브리어 עבוט은 단순 소유물이 아니라 채권 확보를 위한 물건이므로, 법조문 성격을 보존하는 번역이 필요합니다.
  doctrine_reference: 율법의 공정성과 약자 보호
