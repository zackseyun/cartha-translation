  rationale: 히브리어의 구체적 동작인 ‘서다’를 살리되, 한국어에서 명령형 법조문처럼 읽히도록 ‘서 있어야 합니다’로 옮겼습니다.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
