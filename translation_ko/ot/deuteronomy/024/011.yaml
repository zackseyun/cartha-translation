  - 밖에서
  lexicon: HALOT
  rationale: 집 안으로 들어가지 않고 바깥에 머물라는 법적 장면을 자연스럽게 드러내는 표현으로 ‘밖에’를 택했습니다.
- source_word: תַּעֲמֹד
