  rationale: וַעֲבוֹט은 대출의 보증으로 맡기는 물건이므로, 한국어 법률 감각에 맞으면서도 구약 문맥을 살리는 ‘전당물’을 사용했습니다.
theological_decisions:
- issue: 법 조문의 직접성 유지
  chosen_reading: 채권자가 집 안으로 들어가 압박하는 장면을 완화하지 않고, 밖에 서서 전당물을 받는다는 지시를 그대로 살렸습니다.
  alternative_readings:
  - 정중하게 기다리라는 일반적 예절로 완화
  - 담보를 받는 절차로만 일반화
  rationale: 문맥은 이웃의 집 안 사생활을 보호하는 율법 조항이므로, 단순한 예절 권고가 아니라 법적 제한이라는 점이 분명히 드러나야 합니다.
  doctrine_reference: 신 24:10-13의 가난한 자 보호 규정
- issue: ‘전당물’의 법적 뉘앙스
  chosen_reading: 담보나 물건 일반보다 ‘전당물’로 옮겨, 빚과 결부된 구체적 법적 물건임을 나타냈습니다.
  alternative_readings:
  - 담보
  - 보증물
  - 잡아 둔 물건
  rationale: 히브리어 עבוט은 단순 소유물이 아니라 채권 확보를 위한 물건이므로, 법조문 성격을 보존하는 번역이 필요합니다.
  doctrine_reference: 율법의 공정성과 약자 보호
