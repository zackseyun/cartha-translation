  source_fidelity: 첫 문장의 ‘밖에 서 있어야 합니다’는 בַּחוּץ תַּעֲמֹד의 구체적인 법적 지시를 잘 반영합니다. 그러나 יוֹצִיא의 법조문적 의무를 ‘가져나올 것입니다’라는 단순 미래 진술로 옮긴 것은 약화합니다. 또한 עֲבוֹט은 이 문맥에서 대출의 담보로 내놓는 물건이므로 현대 한국어에서는 ‘전당물’보다 ‘담보물’이 더 정확하고 자연스럽습니다.
  naturalness: ‘당신’은 현대 표준 한국어에서 일반 법조문의 단수 상대를 가리킬 때 다소 부자연스럽거나 대립적으로 들릴 수 있습니다. 합쇼체 문맥에서는 ‘너는/네가/네게’와 ‘-해야 합니다’의 조합이 성경의 직접 법규 خطاب을 자연스럽게 전달합니다. ‘그 전당물’도 지시어가 불필요하게 무겁습니다.
  terminology: ‘담보물’은 הָעֲבוֹט의 법적 기능을 분명히 하면서 현대 독자에게도 명료합니다. נֹשֶׁה בּוֹ는 채권자가 그에게 빌려주는 행위와 그가 채무자라는 상태 어느 쪽을 부각할 수도 있으므로, 본문은 전자를 따르되 각주에서 대안을 보존하는 것이 적절합니다.
