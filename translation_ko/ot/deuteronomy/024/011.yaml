  lexicon: HALOT
  rationale: נשה는 이 문맥에서 채권자-채무자 관계를 가리키므로, ‘빚진 상태’보다 앞 절의 담보 수령 맥락에 맞는 ‘빌려 준’ 표현을 택했습니다.
