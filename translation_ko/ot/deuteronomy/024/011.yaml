  - severity: medium
    issue: ‘전당물’은 원문의 일반적 담보물보다 의미가 좁고 현대어로 덜 자연스럽습니다.
    rationale: 전당물은 특히 전당포에 맡긴 물건을 연상시킬 수 있습니다. עֲבוֹט은 대출을 위한 담보로 내놓는 물건이므로 ‘담보물’이 적절합니다.
