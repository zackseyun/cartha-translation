  source_fidelity: 히브리어는 가난한 사람이 맡긴 담보물을 채권자가 밤새 지닌 채 눕거나 자는 것을 금합니다. 초안의 문장 구조와 금지 명령은 이를 대체로 충실히 전달합니다. 다만 '저당물'은 현대 한국어에서 특히 부동산 저당과 연관되어, 일반적인 동산 담보를 가리키는 עֲבוֹט의 범위보다 좁고 오해를 낳을 수 있습니다.
  naturalness: '''그의 담보물을 가지고 잠자리에 들지 마십시오''는 원문의 다소 낯선 법적 관용을 보존하면서 한국어로도 이해 가능합니다. 각주가 밤새 보관하는 행위라는 문맥적 뜻을 명료하게 설명합니다.'
