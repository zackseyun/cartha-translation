source:
  edition: WLC
  text: וְ/אִם אִ֥ישׁ עָנִ֖י ה֑וּא לֹ֥א תִשְׁכַּ֖ב בַּ/עֲבֹטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/012.yaml
  text: And if he is a poor man[a], you shall not sleep with his pledge.
  footnotes:
  - marker: a
    text: Or 'you shall not lie down with his collateral,' that is, you must not keep overnight the item he gave as security for a loan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 가난한 사람이면, 그의 담보물을 가지고 잠자리에 들지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 담보물과 함께 눕지 마십시오'로 옮길 수 있습니다. 곧 그가 빚의 담보로 맡긴 물건을 밤새 보관해서는 안 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 만일 …이면
  alternatives_korean:
  - 그리고 만일 …이면
  - 그리고 …이면
  - 만약 …이면
  lexicon: HALOT
  rationale: 조건을 이어 주는 연결어로서, 앞 절과의 연속성을 유지하면서도 한국어 법률문체에 자연스럽게 맞췄습니다.
- source_word: אִישׁ עָנִי הוּא
  english_pob_choice: he is a poor man
  chosen_korean: 그가 가난한 사람이면
  alternatives_korean:
  - 그가 가난한 사람이면
  - 그가 빈곤한 사람이면
  - 그가 궁핍한 사람이면
  lexicon: HALOT
  rationale: עָנִי는 이 법률 문맥에서 경제적 가난과 취약함을 가리키므로, 과도하게 추상적인 표현보다 '가난한 사람'이 가장 분명합니다.
- source_word: לֹא תִשְׁכַּב
  english_pob_choice: you shall not sleep
  chosen_korean: 잠자리에 들지 마십시오
  alternatives_korean:
  - 잠들지 마십시오
  - 누워 있지 마십시오
  - 그와 함께 자지 마십시오
  lexicon: HALOT
  rationale: 직역하면 '누워/잠자다'이지만, 여기서는 저당물을 밤새 소지한 채 머무는 행위를 금하는 뜻이므로 한국어에서는 자연스럽게 행위 전체를 드러냈습니다.
- source_word: בַּעֲבֹטוֹ
  english_pob_choice: with his pledge
  chosen_korean: 그의 저당물
  alternatives_korean:
  - 그의 담보물
  - 그의 담보로 받은 물건
  - 그의 전당물
  lexicon: HALOT
  rationale: עֲבוֹט는 빚의 담보로 맡겨진 물건을 뜻하므로, 전통적이면서도 이해하기 쉬운 '저당물'을 택했습니다.
theological_decisions:
- issue: 법률 명령의 직접성
  chosen_reading: 금지 명령을 완곡하게 풀지 않고 직접적으로 '…하지 마십시오'로 옮겼습니다.
  alternative_readings:
  - …하지 말아야 합니다
  - …해서는 안 됩니다
  rationale: 원문의 법률적 금지력을 유지하는 것이 중요하므로, 독자에게 규범성을 분명히 전달하는 형식을 택했습니다.
  doctrine_reference: 언약 율법의 규범성
- issue: 저당물의 밤새 보유 금지
  chosen_reading: '''잠자리에 들지 마십시오''로 옮겨, 물건을 밤새 붙들고 있는 행위를 나타냈습니다.'
  alternative_readings:
  - 그의 저당물을 가지고 있지 마십시오
  - 그의 저당물과 함께 눕지 마십시오
  rationale: 히브리어 표현은 단순한 수면 행위보다 밤을 넘겨 저당물을 보유하는 상황을 가리키므로, POB의 해석을 반영해 의미를 분명히 했습니다.
  doctrine_reference: 가난한 자 보호에 관한 율법의 취지
