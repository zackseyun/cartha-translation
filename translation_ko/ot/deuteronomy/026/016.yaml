  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
  footnotes:
  - marker: a
    text: Or 'Today the LORD your God commands you to do these statutes and judgments.'
    reason: lexical_alternative
  - marker: b
    text: '''Judgments'' may also be rendered ''ordinances'' or ''rules''; the Hebrew term often refers to legal decisions or prescribed judgments.'
    reason: lexical_alternative
  - marker: c
    text: '''Soul'' here translates Hebrew nephesh, which can also mean ''life'' or ''self.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘[a] 당신의 하나님 야훼께서 당신에게 이 규례들과 법규들[b]을 행하라고 명령하십니다. 당신은 온 마음과 온 영혼[c]을 다해 그것들을 지키고 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오늘’은 히브리어 시간 지시 표현으로, ‘이 날’ 또는 ‘이날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘법규들’은 히브리어 מִשְׁפָּטִים의 번역입니다. 이 말은 법적 판결, 규정 또는 법도를 가리킬 수 있으며, 앞의 ‘규례들’과 구별됩니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영혼’은 히브리어 נֶפֶשׁ의 번역으로, 문맥에 따라 ‘생명’ 또는 ‘자기 자신’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  english_pob_choice: This day
  chosen_korean: 이 날에
  alternatives_korean:
  - 오늘
  - 이날
  lexicon: HALOT
  rationale: 지시적 시간 표현을 살려 언약적 엄숙함과 담화상의 강조를 유지하되, 합쇼체 문맥에서 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기의 מְצַוְּךָ를 명령하시는 분의 고유명을 제목으로 대체하지 않고, 본 프로젝트의 표준에 따라 하나님의 이름을 야훼로 옮겼습니다.
- source_word: הַחֻקִּים ... וְאֶת הַמִּשְׁפָּטִים
  english_pob_choice: these statutes and judgments
  chosen_korean: 이 규례들과 이 법도들
  alternatives_korean:
  - 이 규례들과 이 판단들
  - 이 규례들과 이 규칙들
  lexicon: HALOT
  rationale: חֻקִּים은 규례로, מִשְׁפָּטִים은 법도로 옮겨 두 법적 항목의 구분을 유지했습니다. 'judgments'를 한국어 성경어법의 '법도'로 옮기되, 관용적이면서도 법적/언약적 뉘앙스를 살렸습니다.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ
  english_pob_choice: you shall keep and do
  chosen_korean: 지키고 행해야 합니다
  alternatives_korean:
  - 지키고 행하셔야 합니다
  - 지키며 행해야 합니다
  lexicon: HALOT
  rationale: שׁמר/עשה의 반복을 살려 '지키고 행하다'로 직역하되, 명령문의 힘을 한국어에서 자연스럽게 드러내기 위해 의무형으로 처리했습니다.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  english_pob_choice: with all your heart and with all your soul
  chosen_korean: 온 마음을 다하고 온 영혼을 다하여
  alternatives_korean:
  - 온 마음과 온 영혼으로
  - 마음을 다하고 영혼을 다하여
  lexicon: HALOT
  rationale: לֵבָב은 마음, נֶפֶשׁ은 영혼으로 옮기되, 'with all'의 총체성을 '온 ...을 다하고'로 살렸습니다. POB의 'soul'에 대한 주석적 긴장을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 신명기에서 신명(神名) יְהוָה의 처리
  chosen_reading: 야훼로 직접 표기
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 여호와 대용어가 아니라 하나님의 언약 이름을 직접 사용합니다. 본 프로젝트의 원칙에 따라 이를 야훼로 드러내어, 명령의 주체가 단순한 호칭이 아니라 언약적 고유명임을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 히브리어 נֶפֶשׁ의 범위
  chosen_reading: 영혼
  alternative_readings:
  - 생명
  - 자기 자신
  - 목숨
  rationale: 문맥상 '마음'과 병렬을 이루는 총체적 자기 헌신을 표현해야 하므로, 본문 표면 의미인 '영혼'을 택하되 나아가 '생명/자기 자신'의 함의를 배제하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
