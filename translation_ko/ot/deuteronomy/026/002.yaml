  source_fidelity: 현 번역은 첫 소산, 광주리, 선택된 장소라는 핵심 요소를 대체로 보존합니다. 그러나 ‘네 땅에서 거둔 것을—야훼 너의 하나님이 네게 주시는 그 땅에서—’는 관계절의 연결이 부자연스럽고, תָּבִיא(‘가져오다/가져들이다’)를 ‘거두다’로 좁힙니다. 또한 לְשַׁכֵּן שְׁמוֹ שָׁם의 사역적 ‘그의 이름이 그곳에 거하게 하다’를 ‘이름을 그곳에 두다’로 평면화합니다.
  naturalness: 합쇼체 문장 안의 ‘너/네’는 등록(register)이 맞지 않습니다. ‘당신의 하나님이신 야훼께서’와 같은 표현으로 통일하고, 관계절을 ‘당신에게 주시는 땅에서’에 자연스럽게 붙이면 현대 표준어로 더 명료해집니다.
  terminology: יהוה는 정책 및 영어 POB를 따라 ‘야훼’로 유지합니다. מֵרֵאשִׁית는 ‘첫 열매 일부’로, טֶּנֶא는 ‘광주리’로 옮기는 것이 적절합니다. 신명기 특유의 ‘그의 이름이 그곳에 거하게 하시려고’는 직역적이면서도 한국어에서 이해 가능하므로 보존해야 합니다.
