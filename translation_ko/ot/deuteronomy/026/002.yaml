revisions:
- from: 그리고 너는 땅의 모든 열매의 처음 익은 것 가운데서, 곧 네 땅에서 거둔 것을—야훼 너의 하나님이 네게 주시는 그 땅에서—가져다가 광주리에 담고, 야훼 너의 하나님이 자기 이름을 그곳에 두려고 선택하실 곳으로 가야 합니다.[a][b]
  to: 당신의 하나님이신 야훼께서 당신에게 주시는 땅에서 가져온 땅의 모든 소산 중 첫 열매 일부를[a] վերց어 광주리에 담고, 당신의 하나님이신 야훼께서 자기 이름이 그곳에 거하게 하시려고 선택하실 곳으로 가야 합니다.[b]
  rationale: ‘가져온’으로 תביא의 이동 의미를 보존하고, ‘첫 열매 일부’로 מֵרֵאשִׁית의 부분성을 명시했습니다. ‘이름이 그곳에 거하게 하시려고’는 히필의 사역성과 신명기 관용을 유지하며, 인칭 표현은 합쇼체에 맞게 ‘당신의’로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:16Z'
