base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the firstfruits of all the fruit/produce of the ground.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to make his name dwell there,' a Deuteronomic expression for the place the LORD chooses for his worshipful presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 땅의 모든 열매의 처음 익은 것 가운데서, 곧 네 땅에서 거둔 것을—야훼 너의 하나님이 네게 주시는 그 땅에서—가져다가 광주리에 담고, 야훼 너의 하나님이 자기 이름을 그곳에 두려고 선택하실 곳으로 가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘처음 익은 것’은 더 전통적으로 ‘첫 열매/첫 소산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 이름을 그곳에 두다’는 신명기의 ‘이름이 거하다’라는 표현으로, 선택된 예배 장소를 가리키는 관용입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  english_pob_choice: some of the firstfruits of all the fruit of the ground
  chosen_korean: 땅의 모든 열매의 처음 익은 것 가운데서
  alternatives_korean:
  - 첫 열매 가운데서
  - 땅의 모든 소산의 첫 부분 가운데서
  lexicon: HALOT
  rationale: מֵרֵאשִׁית는 단순한 ‘첫 부분’보다 제의적 의미가 있는 ‘처음 익은 것/첫 열매’에 가깝기 때문에, 본문이 허락하는 범위에서 그 제의적 성격을 살렸습니다.
- source_word: תָּבִיא מֵאַרְצְךָ
  english_pob_choice: that you bring in from your land
  chosen_korean: 네 땅에서 거둔 것을
  alternatives_korean:
  - 네 땅에서 가져온 것을
  - 네 땅에서 수확한 것을
  lexicon: HALOT
  rationale: 히필 בוא는 단순한 ‘가져오다’보다 수확물을 공동체적 예배 장소로 ‘가져 들이다’는 뉘앙스를 가지므로, 자연스러운 한국어로 ‘거두다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 주 너의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문에 직접 나온 고유 신명으로, 전통적 대체어보다 음역 ‘야훼’를 사용해 명칭 자체를 보존했습니다.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  english_pob_choice: and put it in a basket
  chosen_korean: 광주리에 담고
  alternatives_korean:
  - 바구니에 담고
  - 광주리에 넣고
  lexicon: HALOT
  rationale: טֶנֶא는 수확물을 담는 용기이므로 한국어 관용에 맞게 ‘광주리’로 옮겼고, 동작의 결과를 자연스럽게 나타내기 위해 ‘담다’를 사용했습니다.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  english_pob_choice: to make his name dwell there
  chosen_korean: 자기 이름을 그곳에 두려고
  alternatives_korean:
  - 자기 이름이 그곳에 거하도록
  - 자기 이름을 그곳에 머물게 하려고
  lexicon: HALOT
  rationale: ‘이름이 거하다’는 신명기적 표현을 한국어에서 직역하면 어색해질 수 있어, 하나님의 임재 장소를 가리키는 관용을 살리되 ‘두다’로 너무 평면화되지 않게 조정했습니다.
theological_decisions:
- issue: הַמָּקוֹם and sanctuary theology in Deuteronomy
  chosen_reading: 야훼 너의 하나님이 자기 이름을 그곳에 두려고 선택하실 곳
  alternative_readings:
  - 야훼 너의 하나님이 선택하실 장소
  - 야훼 너의 하나님이 자기 이름을 두실 곳
  rationale: 이 구절은 하나님이 공간에 갇힌다는 뜻이 아니라, 선택된 예배 장소에 그의 이름이 머문다는 신학적 관용을 담으므로 그 긴장을 유지하는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
