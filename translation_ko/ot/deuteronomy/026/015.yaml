  rationale: 하늘은 ‘굽어보다’의 목적어가 아니라 하나님의 거룩한 처소가 위치한 곳으로 옮겼습니다. 땅을 수식하는 동격구와 ‘조상들에게 맹세하신 대로’라는 언약적 수식을 한 청원문 안에 결속했습니다. 원문의 ‘아버지들’을 본문에 보존하고 넓은 의미의 ‘조상들’을 각주 대안으로 제시했습니다.
