  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew says 'our fathers,' referring to the patriarchs.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘에 있는 당신의 거룩한 처소에서 굽어보시고, 당신의 백성 이스라엘과 당신께서 우리 아버지들[a]에게 맹세하신 대로 우리에게 주신 젖과 꿀이 흐르는 땅에 복을 내려 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조상들에게.’ 히브리어는 ‘우리 아버지들’이라고 하며, 족장들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  english_pob_choice: Look down
  chosen_korean: 굽어보시고
  alternatives_korean:
  - 내려다보시고
  - 살펴보시고
  lexicon: HALOT
  rationale: 하늘 높은 곳에서 아래를 향해 시선을 두라는 청원으로 이해하여, 하나님께 드리는 공손한 명령형인 ‘굽어보시고’가 원문의 방향성과 예배적 어조를 함께 살립니다.
- source_word: מִמְּע֨וֹן קָדְשְׁךָ
  english_pob_choice: from your holy dwelling
  chosen_korean: 거룩한 처소에서
  alternatives_korean:
  - 거룩한 거처에서
  - 거룩한 거주지에서
  lexicon: HALOT
  rationale: מָעוֹן은 ‘처소/거처’로 옮기는 것이 자연스럽고, ‘거룩한’이 하나님의 임재처라는 성격을 분명히 합니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘을
  alternatives_korean:
  - 하늘에서
  - 하늘로부터
  lexicon: HALOT
  rationale: 동사 ‘굽어보다’와 결합할 때 한국어에서는 목적어처럼 이어지는 ‘하늘을 굽어보다’가 가장 자연스럽고, 출처 의미는 문맥상 유지됩니다.
- source_word: וּבָרֵךְ
  english_pob_choice: and bless
  chosen_korean: 복 주십시오
  alternatives_korean:
  - 축복해 주십시오
  - 복을 내려 주십시오
  lexicon: HALOT
  rationale: 동사의 직접성을 살리되, 하나님께 드리는 청원으로는 ‘복 주십시오’가 가장 간결하고 현대적인 합쇼체입니다.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  english_pob_choice: as you swore to our fathers
  chosen_korean: 당신께서 우리 조상들에게 맹세하신 대로
  alternatives_korean:
  - 당신께서 우리 아버지들에게 맹세하신 대로
  - 당신께서 우리 조상들에게 약속하신 대로
  lexicon: HALOT
  rationale: 원문의 ‘아버지들’은 족장들을 가리키는 언약 공식이므로, 한국어에서는 의미를 분명히 하는 ‘조상들’이 오해를 줄입니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: HALOT
  rationale: 정착과 풍요를 나타내는 관용구이므로, 한국어 성경에서 널리 쓰이는 ‘젖과 꿀이 흐르는 땅’을 유지하는 것이 가장 투명합니다.
theological_decisions:
- issue: יהוה를 직접 부르지 않고 2인칭 청원 형식을 유지하는 합쇼체 처리
  chosen_reading: 하나님께 드리는 간청으로서 전 구절을 공손한 청원문으로 옮겼습니다.
  alternative_readings:
  - 평서문처럼 중립적으로 옮김
  - 기도체의 옛스러운 어미를 사용함
  rationale: 이 절은 제의적 기도문이므로, 현대 한국어에서도 하나님께 직접 드리는 공손한 명령/청원 어조를 유지하는 것이 원문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §2, §5
- issue: לַאֲבֹתֵינוּ의 번역
  chosen_reading: ‘우리 조상들’로 옮겨 족장 언약을 넓게 드러냈습니다.
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 원문은 남성 복수형이지만, 한국어에서는 족장들을 가리키는 언약 공식의 뜻을 분명히 하기 위해 ‘조상들’이 자연스럽고 오해가 적습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
