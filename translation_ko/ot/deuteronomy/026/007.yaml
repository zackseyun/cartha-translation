  text: 우리는 우리 조상들의 하나님이신[a] 야훼께 부르짖었고, 야훼께서는 우리의 소리를[b] 들으시고 우리의 고난과 수고와 우리가 겪은 압제를 보셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리 조상들의 하나님’이다. ‘우리 선조들의 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리의 소리’를 들으셨다는 뜻입니다. ‘우리의 부르짖음’을 들으셨다고도 옮길 수 있습니다.
    reason: lexical_alternative
