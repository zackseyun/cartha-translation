base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
  footnotes:
  - marker: a
    text: Hebrew 'the God of our fathers.' The phrase recalls the covenant God of Israel's forefathers; 'ancestors' is a possible inclusive alternative.
    reason: lexical_alternative
  - marker: b
    text: Or 'heard our cry'; literally, 'heard our voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 우리는 우리 조상들의 하나님 야훼께 부르짖었습니다. 그러자 야훼께서 우리의 소리를 들으시고, 우리의 고난과 우리의 수고와 우리의 압제를 보셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리 조상들의 하나님’이다. ‘우리의 조상들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리의 소리’를 들으셨다는 뜻입니다. ‘우리의 부르짖음’을 들으셨다고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  english_pob_choice: we cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 울부짖었습니다
  lexicon: HALOT
  rationale: עמ고한 구원의 호소를 나타내는 동사로, 단순한 말하기보다 절박한 도움의 요청을 살려 ‘부르짖었습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유한 언약 სახელ명 יְהוָה를 제목어로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
- source_word: קֹלֵנוּ
  english_pob_choice: heard our voice
  chosen_korean: 우리의 소리를
  alternatives_korean:
  - 우리의 음성을
  - 우리의 부르짖음을
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘우리의 소리’를 들었다고 말하므로, 자연스러운 한국어이면서도 원문의 관용을 보존해 ‘우리의 소리’를 택했습니다.
- source_word: עָנְיֵנוּ / עֲמָלֵנוּ / לַחֲצֵנוּ
  english_pob_choice: our affliction, our labor, and our oppression
  chosen_korean: 우리의 고난과 우리의 수고와 우리의 압제
  alternatives_korean:
  - 우리의 환난과 우리의 노동과 우리의 억압
  - 우리의 괴로움과 우리의 노고와 우리의 압박
  lexicon: HALOT
  rationale: 세 단어를 서로 구별해, 첫째는 ‘고난’(affliction), 둘째는 ‘수고’(toil/labor), 셋째는 ‘압제’(oppression)로 옮겨 각각의 뉘앙스를 유지했습니다.
theological_decisions:
