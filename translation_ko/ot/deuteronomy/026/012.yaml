  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
  footnotes:
  - marker: a
    text: Or 'in your towns'; literally 'within your gates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제삼년에, 곧 십일조의 해에, 당신의 모든 소산의 십일조를 다 바치기를 마치면, 그것을 레위 사람과 나그네와 아버지 없는 아이와 과부에게 주십시오. 그러면 그들이 당신의 성문 안에서 먹고 배부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 성읍 안에서’; 문자적으로는 ‘당신의 성문 안에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תְכַלֶּה לַעְשֵׂר
  english_pob_choice: When you have finished tithing
  chosen_korean: …를 다 바치기를 마치면
  alternatives_korean:
  - …의 십일조를 마치면
  - …를 십일조하기를 마치면
  lexicon: HALOT
  rationale: תְכַלֶּה는 어떤 행위를 ‘마치다’는 뜻이고, לַעְשֵׂר는 십일조를 드리는 행위를 가리키므로, 한국어에서는 자연스러운 절차 표현인 ‘다 바치기를 마치면’으로 옮겼습니다.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  english_pob_choice: all the tithe of your produce
  chosen_korean: 당신의 모든 소산의 십일조
  alternatives_korean:
  - 당신의 모든 소출의 십일조
  - 당신의 모든 수확의 십일조
  lexicon: HALOT
  rationale: מַעְשַׂר은 ‘십일조’로, תְּבוּאָה는 땅의 소산·산출을 가리키므로 ‘소산’이 본문의 농경적 의미를 가장 직접적으로 살립니다.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  english_pob_choice: in the third year, the year of the tithe
  chosen_korean: 제삼년에, 곧 십일조의 해에
  alternatives_korean:
  - 제삼년에, 곧 십일조의 해에
  - 제삼년, 곧 십일조의 해에
  lexicon: HALOT
  rationale: 두 표현이 병렬로 붙어 있어 연도를 설명적으로 풀어 주되, ‘곧’으로 같은 해를 해설하는 구조를 유지했습니다.
- source_word: לַגֵּר לַיָּתוֹם וְלָאַלְמָנָה
  english_pob_choice: to the Levite, the sojourner, the fatherless, and the widow
  chosen_korean: 레위 사람과 나그네와 아버지 없는 아이와 과부
  alternatives_korean:
  - 레위 사람과 거주 외국인과 고아와 과부
  - 레위 사람과 나그네와 고아와 과부
  lexicon: HALOT
  rationale: גֵּר는 언약 공동체 안에 거주하는 외부인을 가리켜 ‘나그네’가 무난하며, יָתוֹם은 법적·사회적 취약성을 드러내는 관용 표현이어서 ‘아버지 없는 아이’로 옮겼습니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 당신의 성문 안에서
  alternatives_korean:
  - 당신의 성문 안에서
  - 당신의 성읍 안에서
  lexicon: HALOT
  rationale: 직역은 ‘네 성문 안에서’이지만, 한국어에서는 장소를 뜻하는 관용을 살려 ‘성문 안에서’로 두되, 공동체 영역을 암시하는 표현을 유지했습니다.
- source_word: וְשָׂבֵעוּ
  english_pob_choice: and be satisfied
  chosen_korean: 배부를 것입니다
  alternatives_korean:
  - 만족할 것입니다
  - 배불리 먹을 것입니다
  lexicon: HALOT
  rationale: שָׂבֵעַ는 음식을 충분히 먹어 배가 차는 상태를 뜻하므로, 결과를 분명히 드러내는 ‘배부를 것입니다’가 가장 직접적입니다.
theological_decisions:
- issue: 십일조의 제삼년 분배 대상 유지
  chosen_reading: 레위 사람, 나그네, 아버지 없는 아이, 과부를 구체적으로 그대로 유지했습니다.
  alternative_readings:
  - 가난한 사람들
  - 취약한 이웃들
  rationale: 본문은 일반적 자선이 아니라 언약법 안의 구체적 수혜 대상을 열거하므로, 추상화하지 않고 그대로 보존하는 것이 법적·신학적 긴장을 유지합니다.
  doctrine_reference: 신명기 26장 문맥 / 언약 공동체의 책임
