    rationale: 원문의 לִפְנֵי מִזְבַּח יְהוָה אֱלֹהֶיךָ는 ‘야훼, 당신의 하나님의 제단 앞에’라는 소유/속격 관계입니다. 초안은 ‘하나님께서 제단을 두셨다’는 관계절로 바꾸어 의미와 문법적 관계를 변질합니다.
  - severity: medium
    issue: 각주의 전통적 번역 표기 ‘주’
    rationale: 히브리어 YHWH의 한국어 성서 전통 표기는 통상 ‘여호와’입니다. ‘주’는 번역 전통에서 쓰일 수 있는 호칭이지만, 이 각주의 ‘전통적으로’라는 설명에는 ‘여호와’가 더 정확합니다.
  revised_text: 그때 제사장은 당신의 손에서 바구니를 받아 당신의 하나님 야훼의 제단 앞에 놓을 것입니다.[a]
