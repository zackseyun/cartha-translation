lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: Then ... shall take
  chosen_korean: 그때 ... 받아
  alternatives_korean:
  - 그리고 ... 받을 것입니다
  - 그때 ... 가져갈 것입니다
  lexicon: HALOT
  rationale: 의식 절차의 연속을 한국어에서 자연스럽게 드러내기 위해 시간적 연결어 '그때'를 두고, 동작의 핵심은 '받다'로 옮겨 제사장이 바구니를 넘겨받는 장면을 살렸습니다.
- source_word: הַטֶּנֶא
  english_pob_choice: the basket
  chosen_korean: 바구니
  alternatives_korean:
  - 광주리
  - 용기
  lexicon: HALOT
  rationale: 문맥상 첫열매를 담는 용기이므로 일반적이고 명료한 '바구니'가 적절합니다.
- source_word: וְהִנִּיחוֹ
  english_pob_choice: and set it down
  chosen_korean: 내려놓을 것입니다
  alternatives_korean:
  - 놓을 것입니다
  - 두어 놓을 것입니다
  lexicon: HALOT
  rationale: 히필 동사의 공간적 배치를 드러내면서도 한국어에서 과장되지 않게 '내려놓다'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 원칙에 따라 신명은 대체 титул이 아니라 음역형 '야훼'로 보존했습니다.
