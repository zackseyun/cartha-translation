revisions:
- from: 그때 제사장은 당신의 손에서 바구니를 받아 야훼 당신의 하나님께서 두신 제단 앞에 내려놓을 것입니다.[a]
  to: 그때 제사장은 당신의 손에서 바구니를 받아 당신의 하나님 야훼의 제단 앞에 놓을 것입니다.[a]
  rationale: 제단을 수식하는 원문의 속격 관계를 ‘당신의 하나님 야훼의 제단’으로 정확히 복원했습니다. ‘놓을 것입니다’는 הִנִּיחוֹ의 물리적 배치 의미를 과장 없이 옮기며, 의식 절차의 미래적 연속도 보존합니다. 각주는 한국어 성서 전통의 통용 표기에 맞추어 수정했습니다.
  reviewer_model: gpt-5.6-terra
