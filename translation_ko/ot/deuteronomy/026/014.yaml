id: DEU.26.14
reference: Deuteronomy 26:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא אָכַ֨לְתִּי בְ/אֹנִ֜י מִמֶּ֗/נּוּ וְ/לֹא בִעַ֤רְתִּי מִמֶּ֨/נּוּ֙ בְּ/טָמֵ֔א וְ/לֹא נָתַ֥תִּי מִמֶּ֖/נּוּ לְ/מֵ֑ת שָׁמַ֗עְתִּי בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י עָשִׂ֕יתִי כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
  footnotes:
  - marker: a
    text: Or 'in my mourning,' 'in sorrow,' or 'in affliction.'
    reason: lexical_alternative
  - marker: b
    text: Or 'burned any of it' or 'cleared away any of it.' The Hebrew verb can refer to burning or removing.
    reason: lexical_alternative
  - marker: c
    text: Or 'for a dead person' or 'in connection with the dead'; the exact prohibited use is not specified.
    reason: alternative_reading
translation:
  language: ko
  text: 저는 그것의 일부를 슬플 때 먹지도 않았고, 부정한 상태에서 그것의 일부를 치우지도 않았으며, 죽은 자를 위해 그것의 일부를 주지도 않았습니다. 저는 야훼, 나의 하나님께 순종했습니다[b]; 제가 당신께서 명하신 모든 것을 행했습니다.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬퍼하는 중에’, ‘근심 중에’, ‘고난 중에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불태우지도 않았으며’ 혹은 ‘치워 버리지도 않았으며’. 히브리어 동사는 불태우거나 제거하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘죽은 사람에게’, ‘죽은 이와 관련하여’. 정확히 어떤 용법이 금지되는지는 본문이 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  english_pob_choice: while in mourning
  chosen_korean: 슬플 때
  alternatives_korean:
  - 애도 중에
  - 슬퍼하는 중에
  - 근심 중에
  lexicon: HALOT
  rationale: אֹנִי는 슬픔, 애도, 고난의 뜻을 가질 수 있으므로, 제의적 문맥에서 지나치게 좁히지 않으면서도 자연스러운 한국어로 옮겼습니다.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  english_pob_choice: removed any of it
  chosen_korean: 그것의 일부를 치우지도 않았으며
  alternatives_korean:
  - 그것의 일부를 태우지도 않았으며
  - 그것의 일부를 없애지도 않았으며
  - 그것의 일부를 제거하지도 않았으며
  lexicon: HALOT
  rationale: בער는 여기서 단순히 '태우다'로만 좁히기보다, 영어 POB처럼 더 넓은 'removed'의 의미를 반영하는 표현이 적절합니다.
- source_word: בְּטָמֵא
  english_pob_choice: while unclean
  chosen_korean: 부정한 상태에서
  alternatives_korean:
  - 부정할 때
  - 부정한 가운데
  - 부정할 때에
  lexicon: HALOT
  rationale: 의식적 부정함의 상태를 나타내므로, 상태를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: לְמֵת
  english_pob_choice: for the dead
  chosen_korean: 죽은 자를 위해
  alternatives_korean:
  - 죽은 사람을 위해
  - 시신을 위해
  - 죽은 이를 위해
  lexicon: HALOT
  rationale: 히브리어는 정확한 금지 사용을 특정하지 않으므로, POB의 넓은 범위를 따라 장례·죽은 자 관련 용법을 포괄하는 표현으로 유지했습니다.
- source_word: שָׁמַעְתִּי בְּקוֹל
  english_pob_choice: I have obeyed the voice
  chosen_korean: 야훼, 나의 하나님께 순종했습니다
  alternatives_korean:
  - 야훼, 나의 하나님께 들었습니다
  - 야훼, 나의 하나님께 귀를 기울였습니다
  - 야훼, 나의 하나님께 복종했습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순 청취가 아니라 순종을 뜻하므로, 한국어에서도 그 의미를 직접 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그라마톤은 전통 대체어가 아니라 고유명사로서 '야훼'를 유지했습니다.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  english_pob_choice: according to all that you commanded me
  chosen_korean: 당신께서 명하신 모든 것을
  alternatives_korean:
  - 당신께서 명하신 모든 대로
  - 당신께서 명하신 것 모두에 따라
  - 당신께서 저에게 명하신 모든 것을
  lexicon: HALOT
  rationale: 완전한 준수를 나타내는 표현이므로, 진술문의 형식에 맞게 자연스럽고 충실하게 옮겼습니다.
theological_decisions:
- issue: ‘for the dead’의 범위
  chosen_reading: ‘죽은 자를 위해’로 넓게 유지해, 장례 제의인지 시신 관련 금지인지 단정하지 않았습니다.
  alternative_readings:
  - 장례를 위해
  - 죽은 사람에게
  - 시신을 위해
  rationale: 히브리어가 금지된 정확한 사용을 특정하지 않으므로, 본문이 가진 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문의 모호성 보존
- issue: ‘I have obeyed the voice of Yahweh my God’의 어조
  chosen_reading: ‘야훼, 나의 하나님께 순종했습니다’로 직접적 순종 표현을 사용했습니다.
  alternative_readings:
  - 들었습니다
  - 귀를 기울였습니다
  - 따랐습니다
  rationale: 관용구적 의미가 순종이므로, 독자가 언약적 응답을 분명히 이해하도록 직접 표현했습니다.
  doctrine_reference: 언약적 순종
