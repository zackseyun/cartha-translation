  lexicon: HALOT
  rationale: 완전한 준수를 나타내는 표현이므로, 진술문의 형식에 맞게 자연스럽고 충실하게 옮겼습니다.
theological_decisions:
- issue: ‘for the dead’의 범위
  chosen_reading: ‘죽은 자를 위해’로 넓게 유지해, 장례 제의인지 시신 관련 금지인지 단정하지 않았습니다.
  alternative_readings:
  - 장례를 위해
  - 죽은 사람에게
  - 시신을 위해
  rationale: 히브리어가 금지된 정확한 사용을 특정하지 않으므로, 본문이 가진 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문의 모호성 보존
- issue: ‘I have obeyed the voice of Yahweh my God’의 어조
  chosen_reading: ‘야훼, 나의 하나님께 순종했습니다’로 직접적 순종 표현을 사용했습니다.
  alternative_readings:
  - 들었습니다
  - 귀를 기울였습니다
  - 따랐습니다
  rationale: 관용구적 의미가 순종이므로, 독자가 언약적 응답을 분명히 이해하도록 직접 표현했습니다.
  doctrine_reference: 언약적 순종
