  to: 저는 애도 중에[a] 그것 가운데 아무것도 먹지 않았고, 부정한 상태에서 그것 가운데 아무것도 없애지 않았으며[b], 죽은 이를 위하여[c] 그것 가운데 아무것도 주지 않았습니다. 저는 야훼, 나의 하나님의 말씀에 순종했으며, 주께서 제게 명하신 모든 대로 행했습니다.
  rationale: 각주를 각각 애도, 제거, 죽은 이 관련 어구 바로 뒤로 재배치했습니다. ‘그것 가운데 아무것도’는 세 차례의 מִמֶּנּוּ를 과도하게 ‘일부’로 물질화하지 않고 자연스럽게 반영합니다. ‘제게’를 보충하여 히브리어의 1인칭 목적어를 살렸습니다. ‘말씀에 순종했으며’는 שָׁמַע בְּקוֹל의 관용적 순종 의미를 현대 한국어로 자연스럽게 표현합니다.
