  to: 그런 다음 그 당시 직무를 맡고 있는 제사장[a]에게 가서 그에게 이렇게 말하십시오. ‘오늘 제가 당신의 하나님이신 야훼께, 제가 야훼께서 우리 아버지들[c]에게 우리에게 주시겠다고 맹세하신 땅에 들어왔다고 선포합니다[b].’
  rationale: 직무를 맡은 제사장이라는 문맥적 의미를 자연스러운 현대 한국어로 표현하고, ‘야훼, 당신의 하나님’의 동격 및 여격 관계를 문법적으로 명료하게 바로잡았습니다. 약속의 땅에 ‘들어왔다’는 진입 의미를 반영했으며, ‘우리 아버지들’은 원문의 남성 복수를 본문에서 유지했습니다. 각주 표지도 해당 어구에 직접 연결했습니다.
