base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''the priest who will be in those days,'' that is, the priest then serving or in office.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''Today I have declared.'' The Hebrew form likely functions performatively: the speaker makes the declaration by saying it.'
    reason: lexical_alternative
  - marker: c
    text: Or 'our ancestors.' Hebrew 'our fathers' is retained because the wording is masculine and likely refers specifically to the patriarchal forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 날들에 있을 제사장에게 가서 그에게 말하십시오. ‘오늘 저는 야훼 당신의 하나님께, 제가 야훼께서 우리 조상들에게 우리에게 주시겠다고 맹세하신 땅에 왔다고 선포합니다.’[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 날들에 있을 제사장’입니다. 즉 당시 직무를 맡은 제사장을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오늘 저는 선언하였습니다’. 히브리어 완료형은 말하는 행위 자체로 선언을 이루는 수행적 용법일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리 아버지들’/‘우리 아버지들에게’. 히브리어는 남성 복수 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  english_pob_choice: And you shall go
  chosen_korean: 그리고 … 가서
  alternatives_korean:
  - 그리고 … 오셔서
  - 그러고는 … 가서
  lexicon: HALOT
  rationale: 예식 지시 문맥에서 이동 동사를 한국어 자연어로 풀어 ‘가서’로 옮기되, 명령적 연속성을 유지했습니다.
- source_word: הַכֹּהֵן אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  english_pob_choice: the priest who is in office in those days
  chosen_korean: 그 날들에 있을 제사장
  alternatives_korean:
  - 그 날들에 직무 중인 제사장
  - 그 날들에 봉사하는 제사장
  lexicon: HALOT
  rationale: ‘그때 그 자리에 있는/직무를 맡은’ 제사장을 가리키는 표현이므로, 직분 상태를 드러내는 간결한 한국어로 옮겼습니다.
- source_word: הִגַּדְתִּי הַיּוֹם
  english_pob_choice: Today I declare
  chosen_korean: 오늘 저는 … 선포합니다
  alternatives_korean:
  - 오늘 저는 … 선언합니다
  - 오늘 저는 … 말합니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 수행적 용법을 살려 단순 과거보다 현재행위로 읽히는 ‘선포합니다’를 택했습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께
  alternatives_korean:
  - 야훼 당신의 하나님께
  - 여호와 당신의 하나님께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명기적 언약명은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 2인칭 단수 소유격은 ‘당신의’로 보존했습니다.
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  english_pob_choice: that I have come into the land
  chosen_korean: 제가 … 땅에 왔다고
  alternatives_korean:
  - 제가 … 땅에 들어왔다고
  - 제가 … 땅에 도착했다고
  lexicon: HALOT
  rationale: בוא의 도착/진입 의미를 한국어 ‘왔다’로 자연스럽게 살리되, 서약 땅으로의 진입을 맥락상 드러냈습니다.
- source_word: לַאֲבֹתֵינוּ
  english_pob_choice: to our fathers
  chosen_korean: 우리 조상들에게
  alternatives_korean:
  - 우리 아버지들에게
  - 우리 선조들에게
  lexicon: HALOT
  rationale: 문맥상 족장들을 가리키는 남성 복수 표현이지만, 한국어에서는 의미를 살리면서도 오해를 줄이는 ‘조상들’을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명기를 통해 언약명의 사용을 드러내므로, 본문 차원의 고유명을 보존하는 방향을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘우리 조상들’의 성별 표지 보존
  chosen_reading: 우리 조상들에게
  alternative_readings:
  - 우리 선조들에게
  - 우리 조상들에게
  rationale: 히브리어의 남성 복수 표지를 한국어에서 과도하게 중화하지 않으면서도, 문장 전체의 예식적 진술을 해치지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
