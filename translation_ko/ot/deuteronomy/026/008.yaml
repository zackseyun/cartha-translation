translation:
  language: ko
  text: 야훼께서 우리를 이집트에서 강한 손과 뻗은 팔로, 큰 공포와 표징들과 이적들로 이끌어 내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 경외’ 혹은 ‘큰 경외심을 불러일으키는 일들’로 옮길 수 있습니다. 히브리어 용어는 두려움, 공포, 또는 경외심을 불러일으키는 현현을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 히브리어 고유 신명 יְהוָה는 전통적 대체어인 ‘주’가 아니라 고유명으로 드러내는 것이 본문과 주석 전통에 더 직접적이므로 ‘야훼’로 옮겼습니다.
- source_word: וַיּוֹצִאֵנוּ
  english_pob_choice: brought us out
  chosen_korean: 이끌어 내셨습니다
  alternatives_korean:
  - 끌어내셨습니다
  - 데리고 나오셨습니다
  lexicon: HALOT
  rationale: 히필형 יצא의 ‘나오게 하다/밖으로 내보내다’는 뜻을 살리면서, 출애굽 서술의 관용성을 유지하는 표현으로 ‘이끌어 내셨습니다’를 택했습니다.
- source_word: בְּמֹרָא גָּדֹל
  english_pob_choice: with great terror
  chosen_korean: 큰 두려움
  alternatives_korean:
  - 큰 공포
  - 큰 경외
  lexicon: HALOT
  rationale: 모라(מוֹרָא)는 두려움·공포·경외를 아우를 수 있으나, 여기서는 이집트에 임한 야훼의 행위가 불러일으킨 강한 भय의 뉘앙스를 살려 ‘큰 두려움’으로 옮겼습니다.
- source_word: וּבְאֹתוֹת וּבְמֹפְתִים
  english_pob_choice: and with signs and wonders
  chosen_korean: 표징들과 이적들로
  alternatives_korean:
  - 징표들과 기이한 일들로
  - 표적들과 기적들로
  lexicon: HALOT
  rationale: ‘signs and wonders’의 표준적 쌍을 살리되, 오토트와 모프팀의 구별을 유지하기 위해 ‘표징들’과 ‘이적들’을 사용했습니다.
theological_decisions:
- issue: 출애굽 행위의 수단 묘사와 어조
  chosen_reading: 야훼의 구원 행위를 ‘강한 손과 뻗은 팔’ 및 ‘큰 두려움과 표징들과 이적들’로 함께 제시하는 직서적 문장으로 유지했습니다.
  alternative_readings:
  - 의역하여 ‘놀라운 능력으로’로 완화하는 읽기
  - ‘큰 경외’를 택해 긍정적 어조로 바꾸는 읽기
  rationale: 본문은 구원의 능력과 심판의 위압을 함께 말하므로, 두려움의 요소를 희석하지 않고 원문 어조를 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense and avoid paraphrase beyond what the text warrants'
