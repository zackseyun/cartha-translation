  source_fidelity: 히브리어는 시간·조건을 여는 וְהָיָה כִּי 뒤에, 땅에 들어감, 야훼께서 유산으로 주심, 그 땅을 차지함, 그곳에 거주함의 순서를 둡니다. 초안은 이 순서를 대체로 보존하지만, ‘그리고 그때입니다. 곧’ 및 ‘되면입니다’는 원문의 종속절 구조를 부정확하고 비문적으로 만듭니다.
  naturalness: ‘그리고 그때입니다. 곧 … 되면입니다’는 현대 표준 한국어로 자연스럽지 않습니다. 이 절은 다음 절로 이어지는 시간절이므로 ‘…살게 될 때에는,’처럼 종속절로 끝내는 것이 자연스럽고 본문의 연결도 보존합니다. ‘그 안에’보다 땅을 다시 가리키는 ‘그곳에’가 이 문맥에서 더 자연스럽습니다.
  terminology: 야훼는 영어 POB의 Yahweh 및 제시된 명칭 방침과 일치합니다. נַחֲלָה는 ‘유산’으로, ירשׁ는 여기서 ‘차지하다’로 옮길 수 있습니다. 기존 각주는 원문에 없는 ‘언약에 따른 분배’를 단정하거나 단순한 번역 방식을 설명하므로, 원문의 어휘 대안을 제시하는 각주로 교체하는 편이 적절합니다.
