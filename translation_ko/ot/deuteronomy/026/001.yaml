lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 그때입니다. 곧 … 되면입니다
  alternatives_korean:
  - 그리고 … 때입니다
  - 그리고 … 되면
  lexicon: HALOT
  rationale: 히브리어의 서두 관용구가 이어지는 미래 상황을 여는 표현이므로, 문어적이면서도 현대적인 조건-시간 연결로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 야훼 당신의 하나님
  - 당신의 주 하나님
  lexicon: HALOT
  rationale: 여호와 대체어 대신 신명기 본문의 고유한 신명 표기를 살려 야훼로 옮겼고, 소유격 관계는 자연스러운 한국어 어순으로 처리했습니다.
- source_word: נַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 유산으로
  alternatives_korean:
  - 상속받은 소유로
  - 기업으로
  lexicon: HALOT
  rationale: 땅의 언약적 분배와 상속의 뉘앙스를 살리기 위해 단순 소유보다 ‘유산’이 더 직접적이지만, 한국어에서는 서술 자리에서 자연스럽게 기능하도록 부사격으로 풀었습니다.
- source_word: וִירִשְׁתָּהּ
  english_pob_choice: and you take possession of it
  chosen_korean: 그것을 차지하고
  alternatives_korean:
  - 그것을 점유하고
  - 그것을 소유하게 되고
  lexicon: HALOT
  rationale: ירשׁ는 여기서 ‘상속받다’보다 ‘차지하다/점령하여 소유하다’의 행위성을 띠므로, 현대 독자가 바로 이해할 수 있게 ‘차지하고’로 옮겼습니다.
- source_word: וְיָשַׁבְתָּ בָּהּ
  english_pob_choice: and live in it
  chosen_korean: 그 안에 살게 되면입니다
  alternatives_korean:
  - 그 안에 거주하게 되면입니다
  - 그 안에 정착하게 되면입니다
  lexicon: HALOT
  rationale: ישׁב은 단순 거주를 넘어 정주를 뜻할 수 있으나, 문맥상 자연스러운 현대 한국어로 ‘살다’를 택하고 뒤의 조건절 종결을 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 계시된 신명 자체를 보존하기 위해 ‘주’ 대체를 피하고, 문서 지침에 따라 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 땅의 수여와 인간의 점유 순서
  chosen_reading: 하나님이 주시는 유산과 이스라엘이 그것을 차지하고 거주하는 순서를 구분
  alternative_readings:
  - 한 번에 단순히 땅을 받는다고 압축
  - 차지와 거주를 생략
  rationale: 히브리어는 प्रवेश, 주심, 차지함, 거주함의 연쇄를 두므로, 하나님 행위와 인간 행위를 분리해 번역해야 의미가 선명해집니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
