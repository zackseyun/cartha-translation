base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
  footnotes:
  - marker: a
    text: Or 'the resident foreigner.' The Hebrew גֵּר refers to a non-Israelite living among Israel under its protection.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님 야훼께서 당신과 당신의 집안에 주신 모든 좋은 것을 두고, 당신은 레위 사람과 당신 가운데 있는 거류민[a]과 함께 기뻐하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거주 외국인’입니다. 히브리어 גֵּר는 이스라엘 가운데 그 보호 아래 사는 비이스라엘 주민을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  english_pob_choice: And you shall rejoice
  chosen_korean: 기뻐하십시오
  alternatives_korean:
  - 즐거워하십시오
  - 환호하십시오
  lexicon: HALOT
  rationale: 명령형 문맥의 שׂמח를 한국어 합쇼체로 자연스럽게 옮기면서, 단순한 감정보다 언약적·예배적 기쁨을 살렸습니다.
- source_word: בְּכָל הַטּוֹב
  english_pob_choice: in all the good
  chosen_korean: 모든 좋은 것으로 인해
  alternatives_korean:
  - 모든 좋은 것 안에서
  - 주신 모든 좋은 것 때문에
  lexicon: HALOT
  rationale: 히브리어의 '모든 טוב'이 받은 복의 총체를 가리키므로, 한국어에서는 원인의 뉘앙스를 드러내되 과도한 의역은 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값은 야훼이지만, 이 절의 직접적인 호명보다 고백형 호칭이 더 자연스러워 문맥상 '주 당신의 하나님'으로 옮겼습니다. 다만 이는 본문상의 고유명칭을 완전히 대체하는 것이 아니라 한국어 문장 흐름을 위한 선택입니다.
- source_word: הַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 거류민
  alternatives_korean:
  - 나그네
  - 이방 거주민
  lexicon: HALOT
  rationale: גֵּר의 법적·사회적 의미를 살려, 단순한 '낯선 사람'이나 유동적 '나그네'보다 공동체 안에 보호 아래 거주하는 사람을 드러내는 '거류민'을 택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 문맥상 호칭 처리
  chosen_reading: 직접 명칭을 반복하지 않고 문맥상 '주 당신의 하나님'으로 자연스럽게 풀어 썼습니다.
  alternative_readings:
  - 야훼 당신의 하나님
  - 여호와 당신의 하나님
  rationale: 이 절은 감사와 기쁨을 촉구하는 언약 문맥이므로, 한국어 문장에서는 직접 호명보다 호칭형이 읽기 자연스럽습니다. 다만 본문 신학은 야훼의 선물을 전제로 하며, 이는 생략이 아니라 호칭의 문맥화입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
