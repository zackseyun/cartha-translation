base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
  footnotes:
  - marker: a
    text: Or, 'the firstfruits of the ground' or 'the first of the produce of the land.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb here refers specifically to bowing oneself down; 'worship' is a broader interpretive rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 보십시오[a]. 내가 당신께서 내게 주신 땅의 첫 소산을 가져왔습니다[b], 야훼여. 그런 다음 당신의 하나님 야훼 앞에 그것을 내려놓고, 당신의 하나님 야훼 앞에 엎드려 절하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 첫 소산’ 또는 ‘땅의 소출의 첫 부분’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기서 특히 몸을 굽혀 엎드리는 행위를 가리키며, ‘예배하다’는 더 넓은 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 말의 전환을 자연스럽게 살리면서도, 절차적 고백의 흐름을 끊지 않도록 했습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시라
  lexicon: HALOT
  rationale: 화자의 주의를 끄는 지시 표현을 현대 한국어에서 자연스럽고 공손하게 옮겼습니다.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  english_pob_choice: the firstfruits of the ground
  chosen_korean: 땅의 첫 소산
  alternatives_korean:
  - 땅의 첫 열매
  - 땅의 첫수확물
  lexicon: HALOT
  rationale: רֵאשִׁית פְּרִי의 수확물-첫 부분이라는 뜻을 살리면서, 한국어로는 제물의 성격이 드러나는 ‘첫 소산’이 가장 간결합니다.
- source_word: וְהִשְׁתַּחֲוִיתָ
  english_pob_choice: and bow down
  chosen_korean: 엎드려 절하십시오
  alternatives_korean:
  - 절하십시오
  - 몸을 굽혀 경배하십시오
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 ‘예배’보다 몸을 낮추는 행위를 가리키므로, 그 물리적 동작을 분명히 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 호칭과 제의적 응답체
  chosen_reading: 본문의 יְהוָה는 야훼로 옮기고, 제의적 명령은 공손한 합쇼체로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 기본 원칙에 따라 언약 নাম을 ‘야훼’로 보존했고, 공동체 앞에서 낭독되는 의식문으로서 한국어 높임을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
