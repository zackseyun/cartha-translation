base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
  footnotes:
  - marker: a
    text: Or, 'the firstfruits of the ground' or 'the first of the produce of the land.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb here refers specifically to bowing oneself down; 'worship' is a broader interpretive rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오, 야훼여. 내가 주께서 내게 주신 땅의 첫 소산을 가져왔습니다[a]. 그것을 네 하나님 야훼 앞에 내려놓고, 네 하나님 야훼 앞에 엎드려 절하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 첫 열매’ 또는 ‘땅의 소출의 첫 부분’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기서 특히 몸을 굽혀 엎드리는 행위를 가리키며, ‘예배하다’는 더 넓은 해석입니다.
    reason: lexical_alternative
