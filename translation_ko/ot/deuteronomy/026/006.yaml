translation:
  language: ko
  text: 이집트인들은 우리를 학대하고[a] 우리를 괴롭혔으며[b], 우리에게 고된 노역을 부과했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 나쁘게 대하고’, ‘우리에게 해를 끼치고’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리를 억압했으며’, ‘우리에게 고통을 주었으며’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리에게 가혹한 노동을 지웠습니다’, ‘우리에게 힘겨운 노역을 부과했습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ
  english_pob_choice: treated us badly
  chosen_korean: 우리를 악하게 대하고
  alternatives_korean:
  - 우리를 나쁘게 대하고
  - 우리를 학대하고
  - 우리를 해롭게 하고
  lexicon: HALOT
  rationale: רעע의 원인형은 단순한 감정 표현보다 ‘해를 끼치며 나쁘게 대하다’는 뜻이므로, 현대 한국어에서 자연스럽고 의미 범위가 넓은 ‘악하게 대하고’를 택했습니다.
- source_word: וַיְעַנּוּנוּ
  english_pob_choice: afflicted us
  chosen_korean: 우리를 괴롭혔으며
  alternatives_korean:
  - 우리를 억압했으며
  - 우리를 고통스럽게 했으며
  - 우리를 학대했으며
  lexicon: HALOT
  rationale: ענה의 피엘은 억압·학대·고통을 가하는 폭넓은 ‘괴롭힘/압박’을 담으므로, 앞의 ‘악하게 대하다’와 구별되면서도 자연스러운 ‘괴롭혔으며’로 옮겼습니다.
- source_word: וַיִּתְּנוּ עָלֵינוּ עֲבֹדָה קָשָׁה
  english_pob_choice: laid hard labor on us
  chosen_korean: 우리에게 힘든 노역을 지웠습니다
  alternatives_korean:
  - 우리에게 سخت한 노역을 imposed했습니다
  - 우리에게 가혹한 노역을 부과했습니다
  - 우리에게 მძიმე 노역을 얹었습니다
  lexicon: HALOT
  rationale: נתן על은 ‘~위에 두다/부과하다’의 관용적 표현이어서, 억지로 지워진 부담을 살리는 ‘노역을 지웠습니다’가 가장 직접적입니다. עֲבֹדָה קָשָׁה는 강제 노동의 성격을 드러내는 ‘힘든 노역’으로 옮겼습니다.
- source_word: הַמִּצְרִים
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들이
  alternatives_korean:
  - 애굽 사람들이
  - 이집트인들이
  lexicon: HALOT
  rationale: 본문의 জাতিগত/국가적 주어를 현대 한국어에서 자연스럽게 드러내기 위해 고유명사화된 민족 명칭보다 설명적 표현인 ‘이집트 사람들’을 사용했습니다.
theological_decisions:
- issue: 세 단계의 압제 동사를 구별해 번역할지 여부
  chosen_reading: ‘악하게 대하고’, ‘괴롭혔으며’, ‘힘든 노역을 지웠습니다’로 서로 다른 세 동작을 구별했습니다.
  alternative_readings:
  - 두 번째와 세 번째를 모두 ‘억압했다’로 묶기
  - 세 표현을 모두 ‘학대했다’로 강하게 통일하기
  rationale: 히브리어는 의미가 겹치지만 동일하지 않은 동사들을 연속해 사용하므로, 압제의 진행을 보존하는 것이 원문의 수사와 기억의 힘을 살립니다.
  doctrine_reference: Translation philosophy §§1, 5
