  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
  footnotes:
  - marker: a
    text: Or 'the sacred portion' or 'the holy thing'; the Hebrew refers to the consecrated tithe or produce set apart for distribution.
    reason: lexical_alternative
  - marker: b
    text: Or 'the resident foreigner' for 'the sojourner.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the orphan' for 'the fatherless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 당신의 하나님 야훼 앞에서 이렇게 말하십시오. ‘저는 집에서 거룩한 몫[a]을 치워 내고, 그것을 레위인과 나그네[b]와 고아와 과부에게도 주었습니다. 당신께서 제게 명하신 모든 명령대로 하였으며, 당신의 명령을 하나도 어기지 않았고, 그 명령들을 잊지도 않았습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 몫’은 히브리어 הַקֹּדֶשׁ를 반영한 표현으로, 여기서는 집에서 내어 분배하도록 구별한 봉헌 소산을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 이스라엘 가운데 거주하는 외국인, 곧 거류 외국인을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Then you shall say before Yahweh your God
  chosen_korean: 그러면 너는 야훼 당신의 하나님 앞에서 이렇게 말하십시오
  alternatives_korean:
  - 그리하여 야훼 당신의 하나님 앞에서 말하십시오
  - 그런 다음 야훼 당신의 하나님 앞에서 이렇게 말씀하십시오
  lexicon: HALOT
  rationale: 제의적 절차의 연속성을 살려 ‘그러면’으로 옮기고, 직접 인용 앞의 안내 표현은 ‘이렇게 말하십시오’로 자연스럽게 처리했습니다. ‘앞에서’는 לִפְנֵי의 기본 공간적·공적 의미를 반영합니다.
- source_word: בִּעַרְתִּי הַקֹּדֶשׁ
  english_pob_choice: I have removed the holy portion
  chosen_korean: 나는 집에서 거룩한 몫을 치워 내었고
  alternatives_korean:
  - 나는 거룩한 것을 집에서 없애었고
  - 나는 성물을 집에서 치워 내었고
  lexicon: HALOT
  rationale: הַקֹּדֶשׁ는 여기서 ‘거룩한 것’ 일반이 아니라 분배를 위해 구별된 봉헌 몫을 가리키므로, 의미를 살려 ‘거룩한 몫’으로 옮겼습니다. בִּעַרְתִּי의 선언적 완료성을 ‘치워 내었고’로 표현했습니다.
- source_word: וְגַם נְתַתִּיו לַלֵּוִי וְלַגֵּר לַיָּתוֹם וְלָאַלְמָנָה
  english_pob_choice: and I have also given it to the Levite, the sojourner, the fatherless, and the widow
  chosen_korean: 레위인과 나그네와 고아와 과부에게도 그것을 모두 주었습니다
  alternatives_korean:
  - 레위인과 거류하는 외국인과 아버지 없는 자와 과부에게도 그것을 주었습니다
  - 레위인과 나그네와 고아와 과부에게 그것을 주었습니다
  lexicon: HALOT
  rationale: 여기서는 사회적 보호 대상의 목록이므로 관용적이면서도 충분히 직역적인 ‘나그네/고아/과부’를 유지했습니다. נְתַתִּיו의 목적어가 앞선 거룩한 몫이므로 ‘그것을’로 분명히 했습니다.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ וְלֹא שָׁכָחְתִּי
  english_pob_choice: according to all your commandment that you commanded me. I have not transgressed your commandments, nor have I forgotten them.
  chosen_korean: 당신께서 내게 명하신 모든 명령대로 하였으며, 당신의 명령들에서 하나도 어기지 않았고, 그것들을 잊지도 않았습니다.
  alternatives_korean:
  - 당신께서 내게 명하신 모든 계명대로 하였으며, 당신의 계명들을 어기지 않았고, 그것들을 잊지도 않았습니다.
  - 당신께서 내게 명하신 모든 명령대로 하였으며, 당신의 명령들을 지나쳐 어기지 않았고, 그것들을 잊지도 않았습니다.
  lexicon: HALOT
  rationale: כְּכָל מִצְוָה는 단수형이지만 총괄적 의미이므로 ‘모든 명령’으로 자연스럽게 옮겼습니다. לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ는 단순 누락이 아니라 경계선을 넘는 ‘어김’의 뜻이어서 ‘하나도 어기지 않았다’로 번역했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 테트라그람마톤을 직접 사용하므로, 프로젝트 기본값에 따라 언약명 자체를 드러내는 ‘야훼’를 유지했습니다. 문맥상 일반 명칭이 아니라 고유한 신적 이름을 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직접 인용 안의 명령형/공손체
  chosen_reading: 직접 인용은 하나님께 드리는 고백이므로 ‘말하십시오’와 ‘주었습니다’처럼 공손한 서술체를 유지했습니다.
  alternative_readings:
  - 말하라
  - 주었다
  rationale: 합쇼체 본문 흐름을 유지하되, 인용문 내부의 고백은 제의적·공적 발화이므로 현대어 공손체로 통일했습니다. 이는 서술자의 안내와 화자의 고백을 분리해 읽기 쉽게 합니다.
  doctrine_reference: Korean style policy
