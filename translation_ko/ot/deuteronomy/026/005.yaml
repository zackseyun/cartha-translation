  edition: WLC
  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
  footnotes:
  - marker: a
    text: Or, 'My father was a perishing Aramean.' The Hebrew participle can carry the sense 'perishing' as well as 'wandering.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 대답하여 당신의 하나님 야훼 앞에 이렇게 말해야 합니다. “내 아버지는 멸망해 가던 아람 사람이었습니다. 그는 이집트로 내려가 거기에서 나그네로 살았는데, 수가 적었습니다. 그곳에서 그는 크고, 강하고, 수많은 민족이 되었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 아버지는 멸망해 가던 아람 사람이었습니다.’ 히브리어 분사는 ‘멸망해 가다’와 ‘방랑하다’의 뜻을 모두 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  english_pob_choice: you shall answer and say
  chosen_korean: 대답하여 ... 말해야 합니다
  alternatives_korean:
  - 응답하여 ... 말해야 합니다
  - 대답하여 ... 선언해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 예식 도입구를 살려, 단순한 보고가 아니라 공식적인 고백 응답임을 드러내기 위해 ‘대답하다’를 유지했습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: before Yahweh your God
  chosen_korean: 당신의 하나님 야훼 앞에
  alternatives_korean:
  - 당신의 하나님 야훼의 면전에서
  - 당신의 하나님 야훼 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי의 직접적 공간 감각을 살려 ‘앞에’로 옮겼고, 본문 전통에 따라 신명은 야훼로 유지했습니다.
- source_word: אֲרַמִּי אֹבֵד אָבִי
  english_pob_choice: My father was a perishing Aramean
  chosen_korean: 내 아버지는 멸망해 가던 아람 사람이었습니다
  alternatives_korean:
  - 내 아버지는 방랑하던 아람 사람이었습니다
  - 내 아버지는 사라져 가던 아람 사람이었습니다
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 אֹבֵד의 소멸·위기 뉘앙스를 살렸습니다. ‘아람 사람’은 민족적 표지를 직역했고, ‘내 아버지’는 조상 야곱을 대표적으로 가리키는 직설을 보존했습니다.
- source_word: וַיָּגָר שָׁם
  english_pob_choice: and sojourned there
  chosen_korean: 거기에서 나그네로 살았는데
  alternatives_korean:
  - 거기에서 거주하였는데
  - 거기에서 외국인으로 머물렀는데
  lexicon: HALOT
  rationale: גור의 ‘거류하다/나그네로 지내다’ 뜻을 살리되, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: גָּדוֹל עָצוּם וָרָב
  english_pob_choice: great, mighty, and numerous
  chosen_korean: 크고, 강하고, 수많은
  alternatives_korean:
  - 크고, 힘세고, 많은
  - 위대하고, 강하고, 많은
  lexicon: HALOT
  rationale: 세 어구의 누적 효과를 살리면서, עָצוּם의 힘/강함과 רָב의 수적 많음을 한국어 어휘로 구분해 반영했습니다.
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי의 해석 여지
  chosen_reading: ‘멸망해 가던 아람 사람’으로 번역해 소멸 위기 뉘앙스를 본문에 남겼습니다.
  alternative_readings:
  - ‘방랑하던 아람 사람’으로 중립화하는 읽기
  - ‘아람 사람이 내 아버지를 멸하려 했다’는 해석
  rationale: 히브리어 분사 אֹבֵד는 ‘멸망하다/사라지다’ 계열과 ‘방랑하다’ 계열의 여지를 모두 지니므로, 본문이 지닌 긴장과 조상 서사의 비천함을 즉시 평평하게 만들지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
