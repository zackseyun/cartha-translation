translation:
  language: ko
  text: 오늘 당신은 야훼께서 당신의 하나님이심을 선언하였으며, 그분의 길을 따라 걸으며 그분의 법도와 명령과 규정을 지키고 그분의 말씀에 귀를 기울이겠다고 선언하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘선언하였다’에 해당하는 동사는 이 문맥에서 드물게 쓰인 표현으로, 더 격식 있게는 ‘확언하였다’ 또는 ‘엄숙히 인정하였다’로 옮길 수 있습니다. 또한 직역하면 ‘그분의 음성을 듣다’이며, 문맥상 순종하여 듣는 뜻을 포함합니다.
