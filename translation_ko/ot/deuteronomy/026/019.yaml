    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 약속하신 대로’. 직역하면 ‘그가 말씀하신 대로’입니다.
    reason: alternative_reading
  revision_rationale: The revision supplies a natural Korean realization of the Hebrew purposive infinitive sequence (‘…얻게 하시고, …되게 하시려는 것입니다’) without changing its scope or turning ‘spoke’ into ‘promised’ in the main text. It retains the source-oriented lexical choices ‘이름’ and ‘아름다움,’ moves their notes to their actual anchors, and keeps the formal-polite register.
