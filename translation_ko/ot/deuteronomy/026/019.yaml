reference: Deuteronomy 26:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
  footnotes:
  - marker: a
    text: Or 'for renown' at 'for name'; Hebrew 'name' often carries the sense of reputation or renown.
    reason: lexical_alternative
  - marker: b
    text: Or 'for glory' at 'for beauty'; the Hebrew can denote beauty, splendor, or glory.
    reason: lexical_alternative
  - marker: c
    text: Or 'as he promised'; literally, 'as he has spoken.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분이 만드신 모든 민족보다 여러분을 높이 세우시고, 찬양과 이름과 아름다움을 위해, 또한 여러분이 야훼 여러분의 하나님께 속한 거룩한 백성이 되게 하시려는 것입니다[b][a], 그분이 말씀하신 그대로입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이름'에서 '명성'으로 번역할 수 있습니다. 히브리어 '이름'은 종종 평판이나 명성을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '아름다움'에서 '영광'으로 번역할 수 있습니다. 히브리어는 아름다움, 광휘, 영광을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그가 약속하신 대로'. 직역하면 '그가 말씀하신 그대로'입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ / עֶלְיוֹן עַל כָּל הַגּוֹיִם
  english_pob_choice: and to set you high above all the nations
  chosen_korean: 여러분을 높이 세우시고, … 모든 민족보다
  alternatives_korean:
  - 여러분을 높이 두시고
  - 여러분을 높이 올리시고
  lexicon: HALOT
  rationale: '''set you high''의 상승·격상 이미지를 살리기 위해 ''높이 세우시고''를 택했습니다. 비교 구문은 ''…보다''로 자연스럽게 옮겼습니다.'
- source_word: לִתְהִלָּה וּלְשֵׁם וּלְתִפְאָרֶת
  english_pob_choice: for praise and for name and for beauty
  chosen_korean: 찬양과 이름과 아름다움
  alternatives_korean:
  - 찬양과 명성과 영광
  - 찬양과 명성과 아름다움
  lexicon: HALOT
  rationale: POB의 최신 결정처럼 שֵׁם과 תִפְאָרֶת를 각각 '이름'과 '아름다움'으로 유지해 히브리어 병렬과 어감을 보존했습니다. '명성/영광'은 해석적 의미는 있으나 본문 표지를 덜 직접적으로 드러냅니다.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: and for you to be a holy people to Yahweh your God
  chosen_korean: 여러분이 야훼 여러분의 하나님께 속한 거룩한 백성이 되게 하시려는 것입니다
  alternatives_korean:
  - 여러분이 야훼 여러분의 하나님을 위한 거룩한 백성이 되게 하시려는 것입니다
  - 여러분이 야훼 여러분의 하나님께 거룩한 백성이 되게 하시려는 것입니다
  lexicon: HALOT
  rationale: עַם קָדֹשׁ은 '거룩한 백성'으로 자연스럽게 옮기되, לַיהוָה אֱלֹהֶיךָ의 관계/소속성을 한국어에 드러내기 위해 '께 속한'을 넣었습니다. 이는 전통적 '여호와께'보다 POB의 야훼 표기를 따릅니다.
- source_word: כַּאֲשֶׁר דִּבֵּר
  english_pob_choice: as he has spoken
  chosen_korean: 그분이 말씀하신 그대로입니다
  alternatives_korean:
  - 그분이 말씀하신 대로입니다
  - 그분이 말씀하신 바와 같습니다
  lexicon: HALOT
  rationale: דִּבֵּר는 '말하다'의 과거 완료적 진술로 이해해 '말씀하신 그대로입니다'로 자연스럽게 옮겼습니다. POB의 'as he has spoken'에 맞춰 '약속하셨다'로 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 YHWH는 '야훼'로 표기해 원문 식별성을 유지했습니다. 본문 내부의 하나님 칭호와 구분되는 고유명사적 표지를 보존합니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: לַיהוָה אֱלֹהֶיךָ의 관계 표현
  chosen_reading: '''야훼 여러분의 하나님께 속한''으로 소속성을 드러냄'
  alternative_readings:
  - '''야훼 여러분의 하나님을 위한''으로 목적 강조'
  - '''야훼 여러분의 하나님께''로만 단순화'
  rationale: 히브리어의 ל-는 여기서 관계/소속의 뉘앙스를 가지므로, 단순한 방향어로만 축소하지 않고 소속성을 분명히 했습니다. 이는 '거룩한 백성'이라는 언약적 정체성을 강화합니다.
  doctrine_reference: Translation philosophy §1, §3
