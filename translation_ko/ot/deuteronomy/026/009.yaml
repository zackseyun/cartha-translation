base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or possibly 'a land abundant in milk and honey'; the Hebrew idiom depicts fertility and abundance.
    reason: lexical_alternative
  - marker: b
    text: '''Honey'' may in some contexts include syrup such as date syrup, not only bee honey.'
    reason: cultural_note
translation:
  language: ko
  text: 그분이 우리를 이곳으로 데려오시고, 이 땅을 우리에게 주셨습니다[a][b]. 곧 젖과 꿀이 흐르는 땅입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젖과 꿀이 풍성한 땅’일 수 있습니다. 히브리어 관용구는 비옥함과 풍요를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘꿀’은 경우에 따라 벌꿀뿐 아니라 대추 시럽 같은 시럽류를 포함할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  english_pob_choice: he brought us
  chosen_korean: 우리를 데려오시고
  alternatives_korean:
  - 우리를 이곳으로 이끌어오시고
  - 우리를 이곳에 데려오시고
  lexicon: HALOT
  rationale: בוא의 히필형은 ‘가게 하다/데려오다’의 사역적 의미이므로, 주어를 드러내지 않더라도 한국어에서는 자연스럽게 ‘데려오시고’로 옮겼습니다.
- source_word: וַיִּתֶּן לָנוּ
  english_pob_choice: and gave us
  chosen_korean: 우리에게 주셨습니다
  alternatives_korean:
  - 우리에게 허락하셨습니다
  - 우리에게 주셨습니다
  lexicon: HALOT
  rationale: נתן + ל의 단순한 수여 의미를 살려, 과도하게 해석적인 ‘허락하다’보다 평이하고 직접적인 ‘주셨습니다’를 택했습니다.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  english_pob_choice: this land
  chosen_korean: 이 땅
  alternatives_korean:
  - 이 나라
  - 이 지역
  lexicon: HALOT
  rationale: 문맥상 약속된 기업으로 받은 토지를 가리키므로, 한국어에서도 가장 자연스럽고 넓은 범위를 갖는 ‘땅’이 מתאים합니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: HALOT
  rationale: 히브리어 관용구의 풍요와 비옥함의 이미지를 보존하기 위해 직유적 구조를 살렸고, ‘젖’은 성경적 상투구를 유지하되 현대 한국어에서도 이해 가능합니다.
theological_decisions:
- issue: 3인칭 암시적 주어 처리
  chosen_reading: 본문의 명시되지 않은 주어를 드러내지 않고, 앞문맥의 하나님을 가리키는 흐름을 따라 ‘그분이’로 옮겼습니다.
  alternative_readings:
  - 여호와께서 우리를 이곳으로 데려오시고
  - 주님께서 우리를 이곳으로 데려오시고
  rationale: 히브리어는 이 절에서 명시적 주어 없이 3인칭 동사로 이어지므로, 본문 자체에 없는 신명 호칭을 덧붙이기보다 문맥상 지시 대상을 한국어 대명사로 처리해 본문의 연속성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘젖과 꿀’ 관용구의 처리
  chosen_reading: 직역형 이미지를 유지하되, 관용구가 뜻하는 풍요와 비옥함을 함께 드러내는 것으로 이해했습니다.
  alternative_readings:
  - ‘풍요로운 땅’으로 의미 위주 번역
  - ‘젖과 꿀이 풍성한 땅’으로 완화
  rationale: 관용구를 의미로만 바꾸면 원문의 생생한 농경적 이미지를 잃기 쉬우므로, 본문 의미를 해치지 않는 범위에서 이미지와 함의를 함께 살리는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
