translation:
  language: ko
  text: 야훼께서 오늘 너희를 그의 특별한 백성으로 삼으시며[a], 그가 너희에게 말씀하신[b] 것처럼, 너희가 그의 모든 명령을 지키게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 보배로운 소유’; 히브리어는 ‘특별히 귀하게 여기는 백성’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 너희에게 말씀하신 대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: the LORD / Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문 고유명 יהוה를 프로젝트 기본값에 따라 학술적으로 음역해 ‘야훼’로 옮겼습니다. 이는 본문의 신명성(고유명)을 유지하면서도 전통 교회어 ‘여호와’보다 원어 근접성을 더 분명히 드러냅니다.
- source_word: הֶאֱמִירְךָ
  english_pob_choice: has declared
  chosen_korean: 삼으시며
  alternatives_korean:
  - 선언하셨으며
  - 가리키셨으며
  - 택하셨으며
  lexicon: HALOT
  rationale: 이 희귀한 사역형은 언약 맥락에서 야훼의 공식적 선언/지정을 가리키므로, 한국어로는 결과 상태를 자연스럽게 드러내는 ‘삼으시며’로 옮겼습니다. ‘택하셨으며’는 선택을 너무 앞세우고, ‘선언하셨으며’는 대상의 신분화를 충분히 살리지 못합니다.
- source_word: לְעַם סְגֻלָּה
  english_pob_choice: treasured people
  chosen_korean: 그의 특별한 백성
  alternatives_korean:
  - 그의 보배로운 백성
  - 그의 소유된 백성
  - 그의 보물 같은 백성
  lexicon: HALOT
  rationale: עַם과 סְגֻלָּה의 결합은 ‘귀하게 여기는 소유/보배’의 언약적 의미를 가지므로, 본문에서 공동체성을 살려 ‘백성’을 두고 가치 뉘앙스를 ‘특별한’으로 표현했습니다. ‘소유된 백성’은 직역성이 강하지만 한국어에서 부자연스럽습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  english_pob_choice: as he promised you
  chosen_korean: 그가 너희에게 말씀하신 것처럼
  alternatives_korean:
  - 그가 너희에게 약속하신 것처럼
  - 그가 너희에게 말씀하신 대로
  lexicon: HALOT
  rationale: דִּבֶּר는 문자적으로 ‘말하다’이지만 여기서는 이전의 언약적 발화를 가리키므로, 원문 어감을 유지하는 ‘말씀하신’을 택했습니다. ‘약속하신’은 해석을 더 강하게 부여하므로 본문에 필요한 최소한의 명시성만 반영했습니다.
- source_word: וְלִשְׁמֹר כָּל מִצְוֺתָיו
  english_pob_choice: and that you are to keep all his commandments
  chosen_korean: 너희가 그의 모든 명령을 지키게 하셨습니다
  alternatives_korean:
  - 너희가 그의 모든 명령을 지키도록 하셨습니다
  - 그의 모든 계명을 지키게 하셨습니다
  lexicon: HALOT
  rationale: שׁמר는 여기서 언약적 순종을 뜻하므로 ‘지키다’가 가장 자연스럽습니다. מִצְוֺתָיו는 표준적으로 ‘명령’으로 옮겨 현대 한국어에서 과도한 교회어화 없이 분명한 법-언약의 요구를 전달했습니다.
theological_decisions:
- issue: 야훼의 ‘삼으시며’가 담는 언약적 선언과 선택성의 긴장
  chosen_reading: 공식적 언약 선언으로서의 지정이면서도, 문맥상의 선택 은유를 과도하게 확정하지는 않음
  alternative_readings:
  - 직접적인 ‘선택하셨으며’
  - 단순 선언인 ‘선언하셨으며’
  rationale: 이 절은 신분 지정과 선택 언어가 겹치는 문맥이므로, 한국어에서도 결과를 드러내되 선택 교리를 지나치게 고정하지 않도록 했습니다. 이는 본문이 가진 언약적 긴장을 보존하려는 번역 원칙에 부합합니다.
  doctrine_reference: Deut 26:17–19의 언약 갱신 문맥
