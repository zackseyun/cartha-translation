reference: Deuteronomy 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
  footnotes:
  - marker: a
    text: Or 'afraid and soft of heart'; the Hebrew literally speaks of one who is 'fearful and tender/soft of heart.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to his fellow Israelites or fellow soldiers.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 관리들은 계속 백성에게 말하여 이렇게 말해야 합니다. “두렵고 마음이 약한 사람은 누구입니까? 그는 가서 자기 집으로 돌아가게 하십시오. 그가 자기 형제들의 마음을 자기 마음처럼 약하게 하지 않도록 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘형제들’은 동족 이스라엘 사람들 또는 동료 병사들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  english_pob_choice: shall continue
  chosen_korean: 계속해서
  alternatives_korean:
  - 또
  - 더 나아가
  lexicon: HALOT
  rationale: יסף는 문자적으로 ‘더하다’이지만, 여기서는 ‘말하기를 계속하다’는 관용구이므로 한국어도 ‘계속해서’로 자연스럽게 옮겼습니다.
- source_word: הַשֹּׁטְרִים
  english_pob_choice: the officers
  chosen_korean: 관리들
  alternatives_korean:
  - 장교들
  - 감독관들
  lexicon: HALOT
  rationale: 신명기 문맥의 שֹׁטְרִים는 현대 경찰이 아니라 임명된 행정·군사 담당자이므로, 계층적 느낌을 살리면서도 한국어에서 무난한 ‘관리들’을 택했습니다.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  english_pob_choice: fearful and fainthearted
  chosen_korean: 두렵고 마음이 약한
  alternatives_korean:
  - 무서워하고 겁이 많은
  - 두려워하고 마음이 여린
  lexicon: HALOT
  rationale: 직역하면 ‘두려워하고 마음이 부드러운/여린’이지만, 전투 상황의 의미를 살려 ‘마음이 약한’으로 자연스럽게 옮겼습니다.
- source_word: יִמַּס אֶת לְבַב אֶחָיו
  english_pob_choice: he melt the heart of his brothers
  chosen_korean: 자기 형제들의 마음을 녹일까 두렵습니다
  alternatives_korean:
  - 자기 형제들의 마음이 녹을까 두렵습니다
  - 형제들의 마음을 녹일 수 있습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘녹다’ 은유를 그대로 살리되, 한국어 문맥상 원인 제공의 뉘앙스를 담아 ‘녹일까 두렵습니다’로 표현했습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 자기 형제들
  alternatives_korean:
  - 동료 형제들
  - 동료 병사들
  lexicon: HALOT
  rationale: 여기서 ‘형제들’은 혈연보다 동족/동료 전사를 가리키므로, 본문의 친족적 표현을 유지하되 이해를 돕기 위해 ‘자기’를 보탰습니다.
theological_decisions:
- issue: 군사적 대표성 언어 유지
  chosen_reading: ‘사람’ 대신 구체적 개인을 지시하는 ‘사람은 누구입니까?’ 구조를 유지하고, ‘형제들’도 중성화하지 않았습니다.
  alternative_readings:
  - 누구든 두려워하는 자는
  - 동료들의 마음
  rationale: 히브리어는 남성 단수와 친족 복수 표현으로 공동체적 군사 상황을 드러내므로, 이를 평탄화하지 않고 원문의 사회적 결을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
