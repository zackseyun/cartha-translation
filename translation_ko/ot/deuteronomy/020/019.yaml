revisions:
- from: 너는 여러 날 동안 성을 포위하여 싸워 그것을 점령할 때에 그 성의 나무를 베어 버리지 말라 네가 그 나무를 먹으므로 그 나무를 베지 말라 포위하는 자의 앞에 있는 것은 그 성의 나무가 아니기 때문이니라
  to: 당신이 여러 날 동안 한 성을 포위하여 그것을 점령하려고 싸울 때에는, 도끼를 휘둘러 그 성의 나무들을 훼손하지 마십시오. 그 나무에서 나는 것을 먹을 수 있으므로, 그것들을 베어서는 안 됩니다. 들판의 나무가 사람이어서 포위 공격 때에 당신 앞에 나아오겠습니까?[a]
  rationale: 포위와 점령의 목적, 도끼로 나무를 훼손하지 말라는 명령, 나무가 제공하는 먹을거리라는 근거를 원문에 맞게 명료화했습니다. 특히 마지막 난해한 절은 영어 POB의 수사 의문문 독법을 따르되, ‘들판의 나무’와 ‘사람’의 대조 및 대안 독법을 보존했습니다. ‘그 나무에서 나는 것’은 원문이 의도하는 식용 산물을 자연스러운 한국어로 나타낸 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:06Z'
