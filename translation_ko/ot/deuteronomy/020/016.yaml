  - 주님
  rationale: 이 본문은 직접적으로 신명을 사용하므로, 대체 칭호보다 고유명을 보존하는 번역이 출처 충실성과 신학적 식별성을 더 잘 드러냅니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
