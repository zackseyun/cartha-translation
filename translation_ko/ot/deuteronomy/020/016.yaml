translation:
  language: ko
  text: 그러나 야훼 당신의 하나님께서 당신에게 유산으로 주시는 이 민족들의 도시들에서는 숨 쉬는 어떤 것도[a] 살려 두어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호흡하는 것’. 히브리어는 ‘숨 쉬는 모든 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 다만
  lexicon: HALOT
  rationale: 앞선 전쟁 지침과 대비되는 예외를 드러내는 접속이므로, 한국어에서는 역접의 뉘앙스를 자연스럽게 살린 '그러나'가 적절합니다.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  english_pob_choice: from the cities of these peoples
  chosen_korean: 그 도시들—곧 … 이 민족들의 도시들—에서는
  alternatives_korean:
  - 이 민족들의 도시들에서
  - 그 민족들의 도시들에서
  lexicon: HALOT
  rationale: מִן과 '도시들'의 결합을 살리되, 바로 뒤의 수식절을 한국어 삽입구로 풀어 주어 지시 대상을 분명히 했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 원어의 신명에 따라 '야훼'로 옮기고, 2인칭 단수 소유는 문체상 격식을 유지하는 '당신의'로 처리했습니다.
- source_word: נֹתֵן לְךָ נַחֲלָה
  english_pob_choice: is giving you as an inheritance
  chosen_korean: 당신에게 유산으로 주시는
  alternatives_korean:
  - 당신에게 상속으로 주시는
  - 당신에게 기업으로 주시는
  lexicon: HALOT
  rationale: נַחֲלָה의 언약적 땅 분배 의미를 살리기 위해 '유산'을 택했으며, 현재분사 נֹתֵן은 진행형 느낌의 '주시는'으로 옮겼습니다.
- source_word: כָּל נְשָׁמָה
  english_pob_choice: any living thing
  chosen_korean: 숨 쉬는 것은 아무것도
  alternatives_korean:
  - 호흡하는 것은 아무것도
  - 숨 쉬는 모든 것
  lexicon: HALOT
  rationale: 직역상 '호흡/숨'의 이미지가 핵심이므로 '숨 쉬는 것'으로 구체성을 유지했고, 전쟁 문맥의 전면적 금지를 '아무것도 … 않다'로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 처리
  chosen_reading: 원문의 יְהוָה를 '야훼'로 표기했습니다.
  alternative_readings:
