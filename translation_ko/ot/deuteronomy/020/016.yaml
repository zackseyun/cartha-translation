    issue: 도시 명사의 중복과 삽입구 처리
    rationale: 현행 ‘그 도시들—곧 … 이 민족들의 도시들—’은 원문에 없는 반복이며, 한국어 문장 구조를 부자연스럽게 만듭니다. ‘이 민족들의 도시들’을 수식절과 함께 직접 제시하면 의미를 바꾸지 않고 더 충실하고 자연스럽습니다.
