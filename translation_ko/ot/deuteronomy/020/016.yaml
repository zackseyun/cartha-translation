- from: 그러나 그 도시들—곧 야훼 당신의 하나님께서 당신에게 유산으로 주시는 이 민족들의 도시들—에서는 숨 쉬는 것은 아무것도 살려 두어서는 안 됩니다.[a]
  to: 그러나 야훼 당신의 하나님께서 당신에게 유산으로 주시는 이 민족들의 도시들에서는 숨 쉬는 어떤 것도[a] 살려 두어서는 안 됩니다.
  rationale: 원문의 수식 관계를 유지하면서 중복된 삽입구를 제거했습니다. ‘숨 쉬는 어떤 것도’는 כָּל נְשָׁמָה의 전면성을 자연스러운 현대 한국어로 나타내며, ‘살려 두어서는 안 됩니다’는 לֹא תְחַיֶּה의 ‘살아 있게 두지 말라’는 의미를 보존합니다. 역사적으로 어려운 본문의 내용을 완화하거나 확대하지 않았습니다.
