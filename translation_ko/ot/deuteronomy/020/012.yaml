base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
  footnotes:
  - marker: a
    text: Or 'wages war against you.' The Hebrew idiom is literally 'makes war with/against you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lay siege to it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것이 당신과 평화를 이루지 않고 당신과 전쟁을 벌이면[a], 당신은 그것을 포위해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 상대로 전쟁을 벌이면.’ 히브리어 관용구는 문자적으로 ‘당신과 전쟁을 하다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것에 포위 공격을 해야 합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשְׁלִים
  english_pob_choice: make peace
  chosen_korean: 평화를 이루지 않으면
  alternatives_korean:
  - 화친하지 않으면
  - 평화 조약을 맺지 않으면
  - 평화를 제의하지 않으면
  lexicon: HALOT
  rationale: 히필형의 ‘평화를 맺다/이루다’라는 적극적 의미를 살려, 관계를 평화 상태로 전환하지 못하는 상황을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְעָשְׂתָה ... מִלְחָמָה
  english_pob_choice: it makes war against you
  chosen_korean: 당신을 상대로 전쟁을 일으킬 것이니
  alternatives_korean:
  - 당신을 상대로 전쟁을 할 것이니
  - 당신과 전쟁을 벌일 것이니
  - 당신을 향해 전쟁을 할 것이니
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘전쟁을 하다/일으키다’의 능동적 긴장을 살리면서, POB의 ‘makes war’에 대응해 반복적 ‘하다’보다 ‘일으키다’로 공격성을 분명히 했습니다.
- source_word: וְצַרְתָּ עָלֶיהָ
  english_pob_choice: you shall besiege it
  chosen_korean: 당신은 그것을 포위해야 합니다
  alternatives_korean:
  - 당신은 그것을 포위할 것입니다
  - 당신은 그것을 에워싸야 합니다
  - 당신은 그것에 대해 포위 공격을 해야 합니다
  lexicon: HALOT
  rationale: צור의 군사적 의미를 ‘포위하다’로 간명하게 살렸고, 한국어에서는 ‘포위’가 ‘공성/포위전’의 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 대상 국가/도시에 대한 군사 명령의 문체
  chosen_reading: 법조문형 명령을 유지해, 조건문 뒤의 군사적 의무를 직접적으로 표현했습니다.
  alternative_readings:
  - 완화하여 설명하는 방식
  - 해석적 어조로 바꾸는 방식
  rationale: 본문은 전쟁 규정의 법문체이므로, 윤리적 완곡어법으로 희석하지 않고 명령형의 직접성을 보존하는 것이 본문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 신명기 전쟁 규정의 문맥
