    rationale: וּפָקְדוּ는 이 문맥에서 이어지는 행동을 서술하는 형태이므로 ‘세울 것입니다’가 양태를 과도하게 보태지 않습니다.
  - severity: low
    issue: 각주의 대안 문구 ‘백성 위에 … 소집할 것입니다’는 한국어로 다소 경직됩니다.
