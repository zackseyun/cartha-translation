  source_fidelity: 핵심 문장 구조와 어휘 선택은 대체로 원문에 충실합니다. 다만 וְהָיָה כְּכַלֹּת는 단순한 시간절로 자연스럽게 옮길 수 있으므로 ‘그리고 때가 되어’는 불필요하게 내용을 보태고 한국어 표현도 부자연스럽습니다. 또 וּפָקְדוּ는 직설적 미래/서술의 의미인데 ‘세워야 합니다’는 의무의 양태를 추가합니다.
  naturalness: ‘그리고 때가 되어, … 말하기를 마치면’은 현대 표준 한국어에서 어색하게 중복된 시간 표현입니다. 이를 간결한 조건·시간절로 고치고, ‘세워야 합니다’를 ‘세울 것입니다’로 바꾸면 합쇼체의 현대적이고 자연스러운 문장이 됩니다.
  terminology: ‘관리들’은 הַשֹּׁטְרִים의 공적·행정적 역할을 무리 없이 나타내며, ‘군대 지휘관들’은 שָׂרֵי צְבָאוֹת에 적절합니다. ‘백성의 선두’는 בְּרֹאשׁ הָעָם의 위치 이미지를 유지합니다. פקד의 어휘적 폭은 각주에서 유지하되, 한국어 인용문은 자연스럽게 다듬었습니다.
