  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
  footnotes:
  - marker: a
    text: Or 'they shall muster commanders of the armies over the people.' The verb can carry senses such as appoint, muster, or set in charge, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 때가 되어, 관리들이 백성에게 말하기를 마치면, 그들은 군대의 지휘관들을 백성의 선두에 세워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 백성 위에 군대의 지휘관들을 소집할 것입니다.’ 동사는 문맥에 따라 임명하다, 소집하다, 책임을 맡기다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  english_pob_choice: And when ... have finished
  chosen_korean: 그리고 때가 되어 … 말하기를 마치면
  alternatives_korean:
  - 그리고 … 말한 뒤에
  - 그리고 … 말하기가 끝나면
  lexicon: HALOT
  rationale: 히브리어의 시간적 틀을 자연스러운 현대 한국어로 옮기되, 단순한 순서표현보다 완료 후 다음 행동이 이어지는 구조를 살렸습니다.
- source_word: הַשֹּׁטְרִים
  english_pob_choice: the officers
  chosen_korean: 관리들
  alternatives_korean:
  - 관원들
  - 역원들
  lexicon: HALOT
  rationale: 문맥상 백성에게 지시를 전달하는 공적 담당자를 가리키므로, 군사적 맥락까지 너무 좁히지 않으면서 현대 한국어에서 이해되는 ‘관리들’을 택했습니다.
- source_word: שָׂרֵי צְבָאוֹת
  english_pob_choice: commanders of armies
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 사령관들
  - 군사 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 지휘관/우두머리의 뜻이고 צְבָאוֹת는 군대들을 가리키므로, 두 요소를 모두 드러내는 ‘군대의 지휘관들’이 가장 직접적입니다.
- source_word: בְּרֹאשׁ הָעָם
  english_pob_choice: at the head of the people
  chosen_korean: 백성의 선두에
  alternatives_korean:
  - 백성 위에
  - 백성 앞에
  lexicon: HALOT
  rationale: 직역하면 ‘백성의 머리에/선두에’라는 관용으로, 지휘 위치를 보여 주는 이미지를 살리기 위해 ‘선두에’로 옮겼습니다.
