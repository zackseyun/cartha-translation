  text: כֵּ֤ן תַּעֲשֶׂה֙ לְ/כָל הֶ֣/עָרִ֔ים הָ/רְחֹקֹ֥ת מִמְּ/ךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא מֵ/עָרֵ֥י הַ/גּֽוֹיִם הָ/אֵ֖לֶּה הֵֽנָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
  footnotes:
  - marker: a
    text: Or 'So you shall do' or 'In this way you shall do.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'which are not from among the cities of these nations'; the sense is that these cities do not belong to the nations just mentioned.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇게 너희는 매우 멀리 떨어져 있는 모든 성읍들, 곧 이 민족들의 성읍들 가운데 속하지 않은 곳들에 대하여 행하여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 뜻은 ‘이 민족들의 성읍들 가운데 속하지 않은’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성읍들’은 히브리어의 복수형을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: Thus
  chosen_korean: 그렇게
  alternatives_korean:
  - 이와 같이
  - 그와 같이
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 규정을 이어 주는 법령적 연결어로, 문맥의 지시성을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: תַּעֲשֶׂה
  english_pob_choice: you shall do
  chosen_korean: 행하여야 합니다
  alternatives_korean:
  - 해야 합니다
  - 행하십시오
  - 행할 것입니다
  lexicon: HALOT
  rationale: 법규 문맥의 명령·의무를 드러내되, 합쇼체의 공문체에 맞게 ‘행하여야 합니다’로 옮겼습니다.
- source_word: הֶעָרִים הָרְחֹקֹת מִמְּךָ מְאֹד
  english_pob_choice: the cities that are very far from you
  chosen_korean: 매우 멀리 떨어져 있는 모든 성읍들
  alternatives_korean:
  - 너에게서 매우 멀리 떨어진 모든 성읍들
  - 아주 멀리 있는 모든 성읍들
  lexicon: HALOT
  rationale: ‘매우 far’의 강도를 살리면서, 법조문의 대상 범위를 분명히 하기 위해 ‘성읍들’과 ‘모든’의 포괄성을 유지했습니다.
- source_word: הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: these nations
  chosen_korean: 이 민족들의
  alternatives_korean:
  - 이 나라들의
  - 이 나라 민족들의
  - 이 이방 민족들의
  lexicon: HALOT
  rationale: 여기서는 지리·정치적 구분이 핵심이므로 ‘민족들’이 자연스럽고, NT적 함의가 강한 ‘이방’은 피했습니다.
- source_word: לֹא מֵעָרֵי הַגּוֹיִם
  english_pob_choice: which are not among the cities of these nations
  chosen_korean: …속하지 않은 곳들
  alternatives_korean:
  - …에 속하지 않은 성읍들
  - …가 아닌 성읍들
  - …에 포함되지 않은 성읍들
  lexicon: HALOT
  rationale: 히브리어의 מן+부분격 뉘앙스를 한국어 ‘속하다’로 풀어, 해당 범주에 속하지 않음을 분명히 했습니다.
theological_decisions:
- issue: 도시의 범주를 가르는 법적 구분의 보존
  chosen_reading: 이 절은 ‘먼 성읍들’과 ‘이 민족들의 성읍들’ 사이의 법적 구분을 단정적으로 제시하도록 옮겼습니다.
  alternative_readings:
  - 전쟁 절차를 풀어 설명하는 의역
  - 대상을 일반적인 외국 도시로 완화하는 번역
  rationale: 문맥상 이 절은 앞선 전쟁 지침의 적용 범위를 경계 짓는 기능을 하므로, 그 군사·법률적 성격을 약화하지 않고 보존했습니다.
  doctrine_reference: 신명기 20장 문맥의 전쟁법/율법 규정
