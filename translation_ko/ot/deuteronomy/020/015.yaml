revisions:
- from: 그렇게 너희는 매우 멀리 떨어져 있는 모든 성읍들, 곧 이 민족들의 성읍들 가운데 속하지 않은 곳들에 대하여 행하여야 합니다.[a][b]
  to: 너희에게서 아주 멀리 떨어져 있으며 이 민족들의 성읍에 속하지 않는 모든 성읍에 대해서는, 이와 같이 해야 합니다.
  rationale: כֵּן תַּעֲשֶׂה는 앞 절들의 절차를 가리키므로 ‘이와 같이 해야 합니다’로 옮겼습니다. ‘매우 멀리 떨어져 있는’과 ‘이 민족들의 성읍에 속하지 않는’을 모두 ‘모든 성읍’에 걸리는 한정으로 배치하여, 먼 성읍과 바로 언급된 민족들의 성읍을 구별하는 원문의 법적 경계를 보존했습니다. 불필요하고 비문맥적인 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:19Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 범주 구분은 대체로 보존했지만, ‘성읍들 … 곳들에 대하여 행하다’는 히브리어의 관계절 구조와 앞선 지시를 받는 כֵּן תַּעֲשֶׂה를 부자연스럽게 처리합니다. ‘너희는’은 히브리어의 남성 단수 법규적 수신자를 불필요하게 복수화하기도 합니다.
  naturalness: 원문의 ‘모든 성읍들’ 뒤에 ‘곧 … 곳들’을 덧붙인 구성은 선행사와 관계절의 연결이 어색하며, ‘성읍들 가운데 속하지 않은 곳들’은 현대 한국어에서 자연스럽지 않습니다. 지시 대상과 행동을 ‘이와 같이 해야 합니다’로 배열하면 명료하고 합쇼체에도 맞습니다.
  terminology: ‘성읍’과 ‘민족들’은 문맥과 용어상 적절합니다. 다만 ‘속하지 않은 곳들’ 대신 ‘성읍에 속하지 않는 성읍’으로 범주 소속을 분명히 해야 합니다.
  issues:
  - severity: medium
    issue: 관계절의 선행사 및 문장 구조가 부자연스럽습니다.
    rationale: 히브리어는 ‘매우 멀리 있는 모든 성읍들’을 ‘이 민족들의 성읍들에 속하지 않는’이라는 관계절로 한정합니다. 초안의 ‘성읍들, 곧 … 곳들’은 이를 별도의 ‘곳들’로 바꾸어 문법적 연결과 의미를 흐립니다.
  - severity: low
    issue: ‘너희는’이 히브리어의 2인칭 남성 단수 법규 표현을 복수화합니다.
    rationale: 한국어에서는 주어를 생략해 일반적 법규 수신자를 자연스럽게 나타낼 수 있으므로, 수를 임의로 복수화하지 않는 편이 안전합니다.
  - severity: low
    issue: 각주 b는 번역상 별도의 정보나 대안을 제공하지 않습니다.
    rationale: ‘모든 성읍’은 이미 복수 총칭의 범위를 충분히 나타내며, 단순히 히브리어 복수형이라는 설명은 이 절의 독해에 필요한 주석이 아닙니다.
  revised_text: 너희에게서 아주 멀리 떨어져 있으며 이 민족들의 성읍에 속하지 않는 모든 성읍에 대해서는, 이와 같이 해야 합니다.
