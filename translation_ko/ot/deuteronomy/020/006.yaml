  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
  footnotes:
  - marker: a
    text: Or, more formally, 'has not dedicated it' or 'has not begun to use it.' The Hebrew verb here refers to first making ordinary use of the vineyard, likely by enjoying its produce after the initial restricted years (compare Leviticus 19:23–25).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 포도원을 심고도 아직 그것을 사용하지 않은 사람은 누구입니까? 그 사람은 자기 집으로 돌아가게 하십시오[a]. 그렇지 않으면 전쟁에서 죽고 다른 사람이 그것을 사용할까 봐 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘그것을 헌납하지 않은’ 혹은 ‘아직 그것을 처음 사용하지 않은’이라는 뜻일 수 있습니다. 여기서 히브리어 동사는 포도원의 첫 일반적 사용, 곧 초기 제한 기간 뒤에 그 소산을 누리는 행위를 가리키는 것으로 보입니다(레위기 19:23–25 비교).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  english_pob_choice: And who is the man
  chosen_korean: 그리고 … 사람은 누구입니까?
  alternatives_korean:
  - 그리고 … 사람은 누구입니까?
  - 누가 … 사람입니까?
  lexicon: HALOT
  rationale: 남성 단수의 수사적 질문 형식을 살리되, 한국어에서는 자연스러운 법문체로 풀어 ‘누구입니까’로 옮겼습니다.
- source_word: נָטַע כֶּרֶם
  english_pob_choice: has planted a vineyard
  chosen_korean: 포도원을 심고
  alternatives_korean:
  - 포도원을 심은
  - 포도원을 가꾸고
  lexicon: HALOT
  rationale: כֶּרֶם을 표준적인 ‘포도원’으로 옮기고, 완료된 행위를 현재 관련성으로 표현하는 한국어 구문을 택했습니다.
- source_word: וְלֹא חִלְּלוֹ
  english_pob_choice: has not yet enjoyed its fruit
  chosen_korean: 아직 그것을 사용하지 않은
  alternatives_korean:
  - 아직 그 열매를 누리지 않은
  - 아직 그것을 구별해 바치지 않은
  - 아직 그것을 처음 사용하지 않은
  lexicon: HALOT
  rationale: חלל의 관용적 의미를 직역적으로는 ‘구별해 바치다’까지 포함할 수 있지만, 여기서는 포도원의 첫 일반적 사용이라는 문맥을 따라 본문의 기능을 가장 잘 드러내는 ‘사용하다’로 옮겼습니다.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  english_pob_choice: Let him go and return to his house
  chosen_korean: 자기 집으로 돌아가게 하십시오
  alternatives_korean:
  - 가서 자기 집으로 돌아가게 하십시오
  - 그는 집으로 돌아가야 합니다
  lexicon: HALOT
  rationale: yiqtol 연속의 지시문을 한국어 법령체로 자연스럽게 처리하되, 강제적 허용의 뉘앙스를 살렸습니다.
- source_word: יְחַלְּלֶנּוּ
  english_pob_choice: another man enjoy its fruit
  chosen_korean: 다른 사람이 그것을 사용할까 봐 그렇습니다
  alternatives_korean:
  - 다른 사람이 그 열매를 누릴까 봐 그렇습니다
  - 다른 사람이 그것을 처음 사용할까 봐 그렇습니다
  lexicon: HALOT
  rationale: 끝의 대응 동사도 같은 어근 의미를 유지해 ‘사용하다’로 맞추었습니다. 한국어에서 중복되는 ‘열매’를 억지로 넣기보다 원문의 대칭을 살리는 쪽을 택했습니다.
theological_decisions:
- issue: חלל의 의미를 ‘거룩을 훼손하다’로 볼지, ‘첫 사용/이용’으로 볼지
  chosen_reading: 이 문맥에서는 포도원의 처음 일반적 사용을 가리키는 것으로 이해하여 ‘사용하다’로 번역했습니다.
  alternative_readings:
  - 거룩하게 구별된 것을 더럽히다
  - 헌납을 시작하다
  - 열매를 누리다
  rationale: 포도원과 레위기 19:23–25의 맥락상, 이 동사는 제의적 모독이 아니라 금지 기간 뒤의 첫 실사용을 뜻합니다. POB의 영어 감사기록도 이 문맥적 의미를 따릅니다.
  doctrine_reference: 레위기 19:23–25; 신명기 20:6
- issue: 출전 문맥이 군사 면제 규정이므로 명령형의 공적 문체를 어떻게 처리할지
  chosen_reading: ‘그 사람은 … 돌아가게 하십시오’로 번역해 공적·법률적 지시문 톤을 유지했습니다.
  alternative_readings:
  - 그는 돌아가야 합니다
  - 돌아가도 됩니다
  rationale: 본문은 단순 허용이 아니라 전쟁 참여에서의 공식 면제를 규정하므로, 한국어에서도 행정적 지시의 성격이 드러나야 합니다.
  doctrine_reference: 신명기 20장 문맥
