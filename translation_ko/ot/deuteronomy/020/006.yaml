    rationale: 이 동사는 여기서 헌납하다가 아니라 거룩한 제한에서 풀어 일반적으로 사용하다, 특히 포도원의 첫 사용에 들이다라는 뜻입니다. ‘속되게 사용하다’는 형식적 어휘로 가능한 대안을 제시하되, 본문의 문맥적 뜻을 설명해야 합니다.
