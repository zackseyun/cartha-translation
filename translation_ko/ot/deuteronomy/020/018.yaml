    text: Or 'to their gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들의 신들을 위하여[a] 행한 모든 가증한 일에 따라 너희에게 행하도록 가르치지 못하게 하려는 것입니다. 그러면 너희가 야훼 너희 하나님께 죄를 짓게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들에게’.
    reason: לֵאלֹהֵיהֶם의 ל는 여기서 ‘~을 위하여’로도 ‘~에게’로도 옮길 수 있습니다.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  english_pob_choice: so that
  chosen_korean: 하려는 것입니다
  alternatives_korean:
  - 그리하여
  - ~하지 않도록
  lexicon: HALOT
  rationale: 목적/결과 절을 자연스러운 현대 한국어로 풀어, 이어지는 금지 목적을 분명히 하면서도 문장의 논리 흐름을 유지했습니다.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  english_pob_choice: they may not teach you to do
  chosen_korean: 너희에게 행하도록 가르치지 못하게
  alternatives_korean:
  - 너희에게 하도록 가르치지 못하게
  - 너희가 하게 가르치지 못하게
  lexicon: HALOT
  rationale: למד의 핵심 의미인 ‘가르치다’를 살리고, infinitive 목적을 한국어의 ‘행하도록’으로 자연스럽게 옮겼습니다.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  english_pob_choice: according to all their abominations
  chosen_korean: 자기들의 신들을 위해 행한 모든 가증한 일에 따라
  alternatives_korean:
  - 그들의 모든 가증한 일대로
  - 그들의 모든 가증한 행위에 따라
  lexicon: HALOT
  rationale: תועבות를 단순한 추상명사보다 실제 행위로 드러내는 문맥이므로 ‘가증한 일’로 옮기되, 관계절로 ‘신들을 위해 행한’을 보완해 우상 숭배 맥락을 분명히 했습니다.
- source_word: לֵאלֹהֵיהֶם
  english_pob_choice: for their gods
  chosen_korean: 자기들의 신들을 위해
  alternatives_korean:
  - 그들의 신들에게
  - 그들의 신을 향해
  lexicon: HALOT
  rationale: ל의 방향/관계 용법을 한국어의 ‘~을 위해’로 옮겨, 해당 행위가 우상에게 드리는 종교적 행위였음을 드러냈습니다.
- source_word: וַחֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  english_pob_choice: and you would sin against Yahweh your God
  chosen_korean: 너희가 야훼 너희 하나님께 죄를 짓게 됩니다
  alternatives_korean:
  - 너희가 야훼 너희 하나님께 죄를 범하게 됩니다
  - 너희가 야훼 너희 하나님께 죄를 짓습니다
  lexicon: HALOT
  rationale: חטא의 대상 표지 ל를 한국어의 ‘~께 죄를 짓다’로 자연스럽게 처리했고, 출애굽기/신명기 계열의 언약적 표현을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
