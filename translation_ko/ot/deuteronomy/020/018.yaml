  text: 그들이 자기들의 신들을 위해 행한 모든 가증한 일에 따라 너희에게 행하도록 가르치지 못하게 하려는 것입니다. 그러면 너희가 야훼 너희 하나님께 죄를 짓게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들에게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  english_pob_choice: so that
  chosen_korean: 하려는 것입니다
  alternatives_korean:
  - 그리하여
  - ~하지 않도록
  lexicon: HALOT
  rationale: 목적/결과 절을 자연스러운 현대 한국어로 풀어, 이어지는 금지 목적을 분명히 하면서도 문장의 논리 흐름을 유지했습니다.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  english_pob_choice: they may not teach you to do
  chosen_korean: 너희에게 행하도록 가르치지 못하게
  alternatives_korean:
