revisions:
- from: 누가 여자와 약혼하고 아직 데려오지 못한 사람이 있습니까? 그는 자기 집으로 돌아가게 하십시오[c][b][a]. 그가 전쟁에서 죽고 다른 사람이 그녀를 아내로 맞지 않도록 하려는 것입니다.
  to: 또 여자와 약혼하고[a] 아직 그 여자를 아내로 맞아들이지 않은[b] 사람이 누구입니까? 그는 가서 자기 집으로 돌아가게 하십시오. 그가 전쟁에서 죽고 다른 사람이 그 여자를 아내로 맞는[c] 일이 없도록 하십시오.
  rationale: 문두의 수사적 질문을 자연스러운 한국어로 다듬고, 약혼과 혼인 완결의 구별을 유지했습니다. ‘못한’과 해설적 종결을 제거하여, 귀가 명령과 전쟁에서의 사망을 막기 위한 목적을 원문 구조에 가깝게 반영했습니다. 각주 표지도 해당 표현으로 옮기고 c의 부당한 양보 의미를 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:11Z'
review_pass:
  verdict: revise
  source_fidelity: 약혼 후 아직 혼인을 완결하지 않은 남자를 귀가시키며, 그가 전쟁에서 죽어 다른 남자가 그 여자와 혼인하게 되는 일을 막는다는 핵심 의미는 대체로 반영되었습니다. 그러나 ‘데려오지 못한’은 원문의 단순한 미완료를 능력·상황의 불가처럼 바꾸며, 마지막 문장은 ‘하려는 것입니다’라는 해설적 표현으로 원문의 명령과 목적절의 연결을 약화합니다.
  naturalness: ‘누가 여자와 약혼하고 아직 데려오지 못한 사람이 있습니까?’는 ‘누가 … 사람이’의 결합이 부자연스럽습니다. 또한 ‘그녀’보다 앞서 언급한 ‘그 여자’를 되받는 편이 표준 한국어 성경 문체에서 더 자연스럽습니다.
  terminology: אֵרַשׂ는 ‘약혼하다’로 적절하나, 혼인의 완결을 뜻하는 לקח은 ‘아내로 맞아들이다’로 명료하게 옮길 수 있습니다. ‘정혼’은 격식 있는 대안으로 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘데려오지 못한’이 원문의 미완료를 불가능 또는 실패의 뉘앙스로 바꿉니다.
    rationale: וְלֹא לְקָחָהּ는 ‘그 여자를 (아내로) 맞아들이지 않았다’는 뜻이며, ‘못한’의 능력·상황적 함의는 본문에 없습니다.
  - severity: medium
    issue: 마지막 절의 ‘하지 않도록 하려는 것입니다’가 명령문과 목적절을 해설문으로 전환합니다.
    rationale: פֶּן은 귀가시키라는 지시의 목적/우려를 나타냅니다. ‘… 일이 없도록 하십시오’로 명령의 연결을 유지하는 것이 더 충실합니다.
  - severity: low
    issue: 각주 c의 ‘맞을지라도’는 원문의 단순 미래 동사를 양보절로 바꿉니다.
    rationale: יִקָּחֶנָּה는 ‘다른 사람이 그 여자를 아내로 맞다’라는 직설적 결과이며, 양보 의미가 없습니다.
  - severity: low
    issue: 각주 표지가 모두 ‘집으로 돌아가게 하십시오’ 뒤에 붙어 해당 어구와 연결되지 않습니다.
    rationale: a는 약혼, b는 아직 아내로 맞아들이지 않음, c는 다른 사람이 아내로 맞음에 각각 붙여야 합니다.
  revised_text: 또 여자와 약혼하고[a] 아직 그 여자를 아내로 맞아들이지 않은[b] 사람이 누구입니까? 그는 가서 자기 집으로 돌아가게 하십시오. 그가 전쟁에서 죽고 다른 사람이 그 여자를 아내로 맞는[c] 일이 없도록 하십시오.
