id: DEU.20.7
reference: Deuteronomy 20:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
  footnotes:
  - marker: a
    text: Or, more formally, “has betrothed a woman.”
    reason: lexical_alternative
  - marker: b
    text: “Has not taken her” means has not yet completed the marriage by taking her as wife.
    reason: cultural_note
  - marker: c
    text: Or “and another man marry her.”
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 여자와 약혼하고 아직 데려오지 못한 사람이 있습니까? 그는 자기 집으로 돌아가게 하십시오[c][b][a]. 그가 전쟁에서 죽고 다른 사람이 그녀를 아내로 맞지 않도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, “여자를 정혼한 사람.”
    reason: lexical_alternative
  - marker: b
    text: “아직 데려오지 못한”은 아내로 맞이하는 혼인 절차를 아직 마치지 못했다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그리고 다른 사람이 그녀를 아내로 맞을지라도.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  english_pob_choice: And who is the man
  chosen_korean: 누가 ... 사람이 있습니까?
  alternatives_korean:
  - 그리고 누가 ... 사람입니까?
  - 누가 ... 남자가 있습니까?
  lexicon: HALOT
  rationale: 전례적 질문형을 자연스러운 한국어로 옮기되, 남성 단수의 군사적 맥락을 유지했습니다.
- source_word: אֵרַשׂ אִשָּׁה
  english_pob_choice: has become engaged to a woman
  chosen_korean: 여자와 약혼하고
  alternatives_korean:
  - 여자와 정혼하고
  - 여자를 약혼시켰고
  lexicon: HALOT
  rationale: אֵרַשׂ의 공식적 혼인 전 약혼/정혼을 한국어의 '약혼'으로 옮겼습니다.
- source_word: וְלֹא לְקָחָהּ
  english_pob_choice: and has not taken her
  chosen_korean: 아직 데려오지 못한
  alternatives_korean:
  - 아직 데려가지 않은
  - 아직 아내로 맞지 않은
  lexicon: HALOT
  rationale: '''take''의 결혼 관용구를 한국어에서 너무 해석하지 않으면서도, 완결된 혼인 절차가 아직 이루어지지 않았음을 드러냈습니다.'
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  english_pob_choice: Let him go and return to his house
  chosen_korean: 그는 자기 집으로 돌아가게 하십시오
  alternatives_korean:
  - 그는 가서 자기 집으로 돌아가게 하십시오
  - 그는 집으로 돌아가게 하십시오
  lexicon: HALOT
  rationale: 명령형의 허용/명령 의미를 한국어의 '-게 하십시오'로 자연스럽게 표현했고, '집'보다 '자기 집'이 원문의 소유격을 더 분명히 반영합니다.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  english_pob_choice: and another man take her
  chosen_korean: 다른 사람이 그녀를 아내로 맞지 않도록
  alternatives_korean:
  - 다른 사람이 그녀를 데려가지 않도록
  - 다른 남자가 그녀를 취하지 않도록
  lexicon: HALOT
  rationale: 문맥상 'take her'는 결혼 완결을 뜻하므로, 한국어에서는 그 의미를 드러내는 '아내로 맞다'를 채택했습니다.
theological_decisions:
- issue: 전쟁 중 약혼자의 면제 사유를 어떻게 도덕적으로/설교적으로 완화하지 않고 번역할지
  chosen_reading: 본문의 법적·공동체적 보호 장치를 그대로 드러내어, 약혼의 미완결 상태와 전쟁 위험을 직접 연결해 번역했습니다.
  alternative_readings:
  - 더 완곡하게 '결혼한 지 얼마 안 된 사람'으로 풀기
  - 전통적 교회식으로 '신부를 맞지 못한 자'로 순화하기
  rationale: 이 절은 실제 전쟁 규정이므로, 혼인 관용구와 사망 위험을 흐리지 않고 원문의 실무적 긴장을 보존하는 것이 필요합니다.
  doctrine_reference: 신명기 20장의 전쟁 규례
