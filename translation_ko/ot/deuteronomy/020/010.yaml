theological_decisions:
- issue: 전쟁 중 성읍에 대한 먼저의 평화 제의라는 명령의 뉘앙스
  chosen_reading: 본절은 공격 개시보다 먼저 평화를 제의하라는 명령으로 읽었습니다.
  alternative_readings:
  - 단순히 '평화롭게 부르라'는 일반적 권고
  - 전투 전에 항복 권유를 하라는 뜻
  rationale: 히브리어의 동사와 목적어 구조가 단순한 친절의 말보다 공식적 평화 제안/교섭 개시를 지시하므로, 그 긴장을 한국어에서도 유지했습니다.
  doctrine_reference: 신명기 20장 전쟁 규례
