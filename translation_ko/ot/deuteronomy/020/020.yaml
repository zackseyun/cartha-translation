revisions:
- from: 오직 당신이 먹을 수 없는 나무라는 것을 아는 나무만은 그것을 망가뜨리고 베어 버리십시오. 그리고 당신과 전쟁을 벌이는 그 성읍을 향해 공성 장비를 세워, 그것을 함락시킬 때까지 그렇게 하십시오.[a][b]
  to: 다만 먹을거리로 쓰는 나무가 아닌 것을 아는 나무는 파괴하고 베십시오. 그리고 당신과 전쟁을 벌이는 그 성읍을 공격하려고 공성 시설을 건설하십시오.[a] 그 성읍을 함락시킬 때까지 하십시오.[b]
  rationale: '원문의 식용수/비식용수 대조, 벌목과 공성 시설 축조의 병렬, 그리고 성읍의 함락까지라는 시간 한계를 보존했습니다. 다만 제시한 문장에는 ‘그 성읍을 함락시킬 때까지 하십시오’라는 불필요한 ‘하다’가 남아 있으므로, 실제 완성 문장은 아래와 같이 한 문장으로 연결하는 것이 안전합니다: ‘다만 먹을거리로 쓰는 나무가 아닌 것을 아는 나무는 파괴하고 베십시오. 그리고 당신과 전쟁을 벌이는 그 성읍을 공격하려고, 그 성읍을 함락시킬 때까지 공성 시설을 건설하십시오.[a][b]’ 이 완성 문장을 revised_text로 채택해야 합니다.'
  reviewer_model: gpt-5.6-terra
