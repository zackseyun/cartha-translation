source:
  edition: WLC
  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
  footnotes:
  - marker: a
    text: Or 'build a siege ramp' or 'construct siegeworks.' The Hebrew מָצוֹר can refer broadly to siege fortifications rather than one specific structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'until it falls.' The Hebrew literally says 'until you bring it down,' using a verb of descent for the city's defeat.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 당신이 먹을 수 없는 나무라는 것을 아는 나무만은 그것을 망가뜨리고 베어 버리십시오. 그리고 당신과 전쟁을 벌이는 그 성읍을 향해 공성 장비를 세워, 그것을 함락시킬 때까지 그렇게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “공성 경사로를 쌓다”, 혹은 “공성 시설을 건설하다”라는 뜻일 수 있습니다. 히브리어 מָצוֹר는 특정한 한 구조물보다 포위전에 쓰는 여러 방어·공격 시설을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그것이 무너질 때까지”입니다. 히브리어는 문자적으로 “당신이 그것을 내려뜨릴 때까지”라고 말하며, 성읍의 패배를 아래로 내려감의 동작으로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 오직만
  lexicon: HALOT
  rationale: 앞선 금지에 대한 예외를 표시하는 제한적 의미를 한국어에서 가장 자연스럽게 압축해 살렸습니다.
- source_word: עֵץ ... עֵץ מַאֲכָל
  english_pob_choice: trees ... trees for food
  chosen_korean: 나무 ... 먹을 수 없는 나무
  alternatives_korean:
  - 나무 ... 식용 나무
  - 나무 ... 먹는 나무
  lexicon: HALOT
  rationale: 문맥상 살아 있는 과수/식용수목을 가리키므로, 단순한 '나무'를 유지하되 식용 가능성의 부정을 분명히 했습니다.
- source_word: תֵּדַע כִּי לֹא ... הוּא
  english_pob_choice: that you know are not
  chosen_korean: 당신이 ... 것을 아는
  alternatives_korean:
  - 당신이 ... 아니라는 것을 아는
  - 당신이 ... 아닌 것을 아는
  lexicon: HALOT
  rationale: 히브리어의 인지 절을 한국어 관용법으로 풀어, 판별 가능한 식용 여부를 아는 나무라는 뜻을 드러냈습니다.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  english_pob_choice: those you may destroy and cut down
  chosen_korean: 그것을 망가뜨리고 베어 버리십시오
  alternatives_korean:
  - 그것들을 파괴하고 베어 내십시오
  - 그것을 훼손하고 잘라 버리십시오
  lexicon: HALOT
  rationale: שׁחת와 כרת의 결합을 두 동사로 유지하되, 군사·실용적 맥락에 맞게 '망가뜨리다/베다'로 옮겨 파괴와 벌목의 중첩을 살렸습니다.
- source_word: מָצוֹר
  english_pob_choice: siegeworks
  chosen_korean: 공성 장비
  alternatives_korean:
  - 공성 시설
  - 포위 진지
  - 공성 보루
  lexicon: HALOT
  rationale: מָצוֹר의 범위가 특정 구조물 하나로 제한되지 않으므로, 포위 공격에 쓰는 실질적 장비·설비를 포괄하는 표현을 택했습니다.
- source_word: עַד רִדְתָּהּ
  english_pob_choice: until you bring it down
  chosen_korean: 그것을 함락시킬 때까지
  alternatives_korean:
  - 그것을 무너뜨릴 때까지
  - 그것이 함락될 때까지
  lexicon: HALOT
  rationale: 도시의 패배를 뜻하는 하강 동작을 한국어에서 가장 자연스럽게 전쟁 용어인 '함락'으로 풀되, 완료 시점을 분명히 했습니다.
theological_decisions:
- issue: 전쟁 명령문의 어조와 현대 한국어의 명령형
  chosen_reading: 직설적 명령을 살리되 합쇼체 명령형으로 옮겼습니다.
  alternative_readings:
  - 완곡한 허용형으로 낮추기
  - 서술형으로 바꾸기
  rationale: 본문은 군사적 지침을 분명히 제시하므로, 의미를 약화시키지 않도록 직접 명령의 힘을 유지했습니다.
  doctrine_reference: 본문 장르와 법령 문맥의 수사적 강도
- issue: אָתָּה/הוּא의 대상 지시
  chosen_reading: 나무는 '그것을', 성읍은 '그 성읍'으로 구분해 지시 대상을 분명히 했습니다.
  alternative_readings:
  - 모두 복수 대명사처럼 처리하기
  - 모호성을 유지하기
  rationale: 히브리어는 나무와 성읍 모두 단수 지시를 쓰므로, 한국어에서도 개체 단위의 대상을 유지해 문법적·의미적 긴장을 보존했습니다.
  doctrine_reference: 본문의 문법적 개체 지시
