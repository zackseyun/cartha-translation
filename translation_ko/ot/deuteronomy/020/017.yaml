  text: 그러므로[a] 그들을 완전히 진멸해야 합니다—곧 헷 사람, 아모리 사람, 가나안 사람, 브리스 사람, 히위 사람, 여부스 사람을—야훼 당신의 하나님께서 당신에게 명령하신 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들을 반드시 금령 아래 두라’에 가깝고, 동사는 그들을 전적으로 멸망에 바치라는 뜻입니다.
    reason: lexical_alternative
