translation:
  language: ko
  text: 오히려 헷 족속과 아모리 족속과 가나안 족속과 브리스 족속과 히위 족속과 여부스 족속을 반드시 진멸해야 합니다[a]. 야훼 당신의 하나님께서 당신에게 명령하신 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들을 반드시 진멸의 대상으로 바치라’는 뜻입니다. 이 동사는 그들을 완전히 멸망에 바치는 것을 가리킵니다.
    reason: lexical_alternative
