  verdict: revise
  source_fidelity: ‘그러므로’는 כִּי의 문맥상 대조·전환 기능(‘오히려/그 대신’)을 인과로 바꾸므로 수정이 필요합니다. הַחֲרֵם תַּחֲרִימֵם의 강조된 명령은 ‘반드시 진멸해야 합니다’로 보존할 수 있습니다. 여섯 민족 명칭과 ‘야훼 당신의 하나님께서 당신에게 명령하신 대로’도 원문에 충실합니다.
  naturalness: 본문의 겹대시(‘—곧 …을—’)는 한국어 문장 구조상 부자연스럽습니다. 민족 목록을 목적어로 직접 두고, 익숙한 ‘~ 족속’ 명칭을 사용하면 현대 표준어 합쇼체에서 더 명료합니다.
  terminology: ‘야훼’는 프로젝트의 YHWH 표기 원칙과 일치합니다. ‘진멸’은 חרם의 파괴적 결과를 간결히 드러내지만, 각주에서 ‘진멸의 대상으로 바치다’라는 금령의 어휘적 의미를 밝혀 보완하는 것이 적절합니다. ‘금령 아래 두라’는 현대 한국어에서 뜻이 불명확할 수 있습니다.
  issues:
  - severity: high
    issue: 첫 연결어 ‘그러므로’
    rationale: כִּי는 바로 앞 절에서 먼 성읍을 살려 두는 경우와 대비하여 이 절의 가나안 민족에 관한 예외적 명령을 도입합니다. ‘그러므로’는 근거나 결과를 뜻하여 관계를 바꿉니다. ‘오히려’가 대조를 자연스럽게 보존합니다.
  - severity: medium
    issue: 민족 목록을 삽입한 대시 구조
    rationale: ‘그들을 …—곧 …을—…’은 목적어 표지가 중복되고 뒤의 ‘대로입니다’에 부자연스럽게 연결됩니다. 목록을 명령의 직접 목적어로 제시해야 합니다.
  - severity: medium
    issue: 각주의 ‘금령 아래 두라’
    rationale: חרם의 기술적 의미를 전달하려는 의도는 타당하지만, ‘금령’은 현대 독자에게 충분히 자명하지 않습니다. ‘진멸의 대상으로 바치다’와 설명을 사용하면 의미와 문체가 더 분명합니다.
