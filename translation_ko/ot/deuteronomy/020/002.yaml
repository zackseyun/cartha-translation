base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
  footnotes:
  - marker: a
    text: Or 'to the war.' The Hebrew מִלְחָמָה can denote war generally or a specific battle; here the immediate approach to combat favors 'battle.'
    reason: lexical_alternative
  - marker: b
    text: '''The people'' here refers to the assembled Israelite force, but the Hebrew retains the broader term ''people'' rather than a narrower military label such as ''troops.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너희가 전투에 가까이 갈 때에 제사장이 앞으로 나아가 백성에게 말해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁에’. 히브리어 מִלְחָמָה는 일반적인 전쟁이나 특정한 전투를 가리킬 수 있는데, 여기서는 바로 전투에 다가서는 문맥이므로 ‘전투’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘백성’은 모인 이스라엘 군대를 가리키지만, 히브리어는 더 좁은 군사 용어보다 넓은 표현을 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  english_pob_choice: And when you draw near
  chosen_korean: 그리고 너희가 …에 가까이 갈 때에
  alternatives_korean:
  - 그리고 너희가 다가갈 때에
  - 그리고 너희가 접근할 때에
  lexicon: HALOT
  rationale: ידִּי적 미래 상황을 한국어의 시간절로 자연스럽게 옮기면서, ‘가까이 가다’의 접근 의미를 유지했습니다.
- source_word: אֶל הַמִּלְחָמָה
  english_pob_choice: to the battle
  chosen_korean: 전투에
  alternatives_korean:
  - 전쟁에
  - 싸움에
  lexicon: HALOT
  rationale: מִלְחָמָה는 넓게는 전쟁이지만, 문맥상 바로 맞닥뜨리는 교전 상황이어서 ‘전투’가 더 정확합니다.
- source_word: וְנִגַּשׁ
  english_pob_choice: shall come forward
  chosen_korean: 앞으로 나아가
  alternatives_korean:
  - 나아가
  - 다가가
  lexicon: HALOT
  rationale: ‘제사장이’ 군중 앞에 나서는 동작을 한국어로 자연스럽게 살리되, 히브리어의 접근 의미도 보존했습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장이
  alternatives_korean:
  - 사제가
  - 제사장
  lexicon: HALOT
  rationale: 히브리어 כהן의 표준 번역으로 ‘제사장’을 유지했습니다.
- source_word: אֶל הָעָם
  english_pob_choice: to the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 사람들에게
  - 백성에게
  lexicon: HALOT
  rationale: English POB처럼 군사적 함의만으로 좁히지 않고, 히브리어의 더 넓은 ‘백성’ 의미를 살렸습니다.
theological_decisions:
- issue: 전투 직전에서 제사장이 말하는 장면의 직역 정도
  chosen_reading: 의례적·공적 발표의 장면으로 보아, 동작은 ‘앞으로 나아가’로, 발화는 ‘말해야 합니다’로 비교적 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘앞으로 나와 말합니다’
  - ‘전열로 나아가 백성에게 말합니다’
  rationale: 본문은 전쟁 수행의 절차 속에서 제사장의 공적 발화를 묘사하므로, 과도한 해설 없이 서술의 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 신 20:2–4 전쟁 규례
