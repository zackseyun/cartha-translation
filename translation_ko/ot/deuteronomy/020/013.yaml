review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the divine name, the delivery-into-hand idiom, the comprehensive scope ('all'), and the lethal force of the sword idiom. Revision is needed because '그것' leaves the feminine referent unnecessarily opaque in Korean, and '수컷' is ordinarily used of animals and is unsuitable for human inhabitants in modern Korean. The Hebrew זָכָר marks males; '남성' conveys that distinction naturally without adding an age category.
  naturalness: ‘야훼 당신의 하나님께서’ is awkwardly ordered, and ‘그 성읍의 모든 수컷’ is unnatural and dehumanizing in contemporary formal Korean. ‘당신의 하나님 야훼께서’ and ‘그 성읍의 모든 남성’ are natural while retaining the intended specificity. ‘넘겨주실 때’ expresses the verse’s sequential/conditional setting more naturally than the more hypothetical ‘넘겨주시면.’
  terminology: ‘야훼’ appropriately follows the stated POB rendering of the Tetragrammaton. ‘남성’ is preferable to both ‘수컷’ and the more age-suggestive ‘남자’; the footnote preserves the lexical observation that the Hebrew specifies sex.
  issues:
  - severity: medium
    issue: ‘수컷’을 인간 집단에 사용함
    rationale: Korean ‘수컷’ is normally restricted to animals. Although זָכָר literally denotes a male, ‘남성’ is the standard human referent and preserves the Hebrew sex-specific wording.
  - severity: low
    issue: 지시 대상과 문장 연결의 부자연스러움
    rationale: ‘그것’보다 앞 문맥의 성읍을 명시하는 것이 한국어에서 자연스럽고, ‘넘겨주실 때’가 이 지시의 시간적·순차적 관계를 명료하게 드러냅니다.
  revised_text: 당신의 하나님 야훼께서 그 성읍을 당신의 손에 넘겨주실 때, 당신은 그 성읍의 모든 남성을 칼날로 쳐 죽여야 합니다.[a]
  revised_footnotes:
  - marker: a
    text: 히브리어는 더 일반적인 ‘남자들’이라는 말 대신, 성별을 나타내는 ‘남성들’을 사용합니다.
    reason: lexical_alternative
  revision_rationale: 명령의 살상성, 대상의 총체성, 칼의 관용적 이미지를 완화하지 않았습니다. 다만 인간을 가리키는 현대 표준어로 ‘남성’을 사용하고, 성읍이라는 선행사를 분명히 하며, 어순과 시간적 연결을 자연스럽게 다듬었습니다.
