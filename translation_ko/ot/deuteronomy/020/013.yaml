translation:
  language: ko
  text: 야훼 당신의 하나님께서 그것을 당신의 손에 넘겨주시면, 당신은 그 성읍의 모든 수컷을 칼날로 쳐죽여야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘남자들’이 아니라 성별을 표시하는 ‘수컷들’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와 대신 하나님의 고유명사를 음역한 형태를 따라, 본문에 드러난 언약적 인물명을 직접 보이도록 옮겼습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: into your hand
  chosen_korean: 당신의 손에 넘겨주시면
  alternatives_korean:
  - 당신의 손에
  - 당신의 권한 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구가 지배권 부여를 뜻하므로, 이미지와 의미를 함께 살려 ‘넘겨주시면’으로 풀었습니다.
- source_word: זְכוּרָהּ
  english_pob_choice: its males
  chosen_korean: 그 성읍의 모든 수컷
  alternatives_korean:
  - 그 성읍의 모든 남자
  - 그 성읍의 모든 남성
  lexicon: HALOT
  rationale: 히브리어는 성별 표지인 ‘수컷/남성’ 자체를 가리키므로, 사회적 연령 범주를 덧씌우는 ‘남자’보다 어휘적으로 더 직접적인 ‘수컷’을 선택했습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 검의 날로
  lexicon: HALOT
  rationale: 직역적 의미인 ‘칼의 입/날’ 계열의 관용을 한국어의 자연스러운 대응인 ‘칼날로’로 압축해, 과도한 완곡화 없이 이미지를 유지했습니다.
theological_decisions:
- issue: 전쟁 명령의 강도를 완화하지 않는 번역
  chosen_reading: 본문의 명령형과 대상 범위를 그대로 드러내어 ‘모든 수컷을 칼날로 쳐죽여야 합니다’로 옮겼습니다.
  alternative_readings:
  - ‘무찌르셔야 합니다’처럼 완화하기
  - 살상성을 희석해 ‘제압해야 합니다’로 옮기기
  rationale: 히브리어는 야훼가 넘겨주시는 주권적 행위와 그에 따른 치명적 명령을 직접 연결합니다. 본문이 주는 무게를 가리지 않기 위해 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
