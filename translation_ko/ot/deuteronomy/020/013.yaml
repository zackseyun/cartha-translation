revisions:
- from: 야훼 당신의 하나님께서 그것을 당신의 손에 넘겨주시면, 당신은 그 성읍의 모든 수컷을 칼날로 쳐죽여야 합니다.[a]
  to: 당신의 하나님 야훼께서 그 성읍을 당신의 손에 넘겨주실 때, 당신은 그 성읍의 모든 남성을 칼날로 쳐 죽여야 합니다.[a]
  rationale: 명령의 살상성, 대상의 총체성, 칼의 관용적 이미지를 완화하지 않았습니다. 다만 인간을 가리키는 현대 표준어로 ‘남성’을 사용하고, 성읍이라는 선행사를 분명히 하며, 어순과 시간적 연결을 자연스럽게 다듬었습니다.
