  rationale: 사람들이 ‘강제 노역이 된다’는 표현을 ‘강제 노역을 하게 된다’로 고쳐 מַס가 나타내는 강제된 노역 의무를 자연스러운 한국어로 옮겼습니다. 원문의 ‘섬기다’는 별도 동사로 유지했으며, 성문이라는 본문에 없는 대상을 보태지 않았습니다. 각주 표지를 해당 어휘 뒤로 옮겨 적용 범위를 명확히 했습니다.
