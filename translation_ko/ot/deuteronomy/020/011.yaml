  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
  footnotes:
  - marker: a
    text: Or 'answers you with terms of peace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'shall be subject to tribute labor for you.' The Hebrew מַס can denote levy, tribute, or corvée labor; here the context favors forced labor service.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그 성읍이 평화로[a] 응답하고 당신에게 열어 준다면, 그 안에 있는 모든 백성은 당신을 위하여 강제 노역을 하게 되고[b] 당신을 섬길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화의 조건으로 응답하고’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신에게 조공이나 노역의 의무를 지게 되고’. 히브리어 מַס는 부과금, 조공, 부역을 뜻할 수 있는데, 여기서는 강제 노동의 뉘앙스가 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평화
  alternatives_korean:
  - 평안
  - 평화를 위한 조건
  lexicon: HALOT
  rationale: 전쟁 상황에서의 항복 수락을 가리키지만, 히브리어 명사를 살려 ‘평화’로 옮기면 원문의 표현이 보존되고 문맥상 항복의 의미도 드러납니다.
- source_word: תַּעַנְךָ
  english_pob_choice: answers you
  chosen_korean: 응답하고
  alternatives_korean:
  - 대답하고
  - 응하고
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘대답하다/응답하다’를 살려, 도시를 의인화한 원문의 문법을 자연스럽게 반영했습니다.
- source_word: וּפָתְחָה לָךְ
  english_pob_choice: opens to you
  chosen_korean: 당신에게 열어 준다면
  alternatives_korean:
  - 당신에게 열면
  - 당신에게 성문을 열면
  lexicon: HALOT
  rationale: ‘열다’만을 직접 옮겨, 본문에 없는 ‘성문’을 덧붙이지 않으면서도 항복의 결과를 한국어로 분명하게 전달했습니다.
- source_word: לָמַס
  english_pob_choice: forced labor
  chosen_korean: 강제 노역
  alternatives_korean:
  - 노역 공물
  - 조공
  lexicon: HALOT
  rationale: מַס는 조세, 공물, 노역 부담을 모두 가질 수 있으나, 뒤의 ‘섬기다’와 함께 읽을 때 단순한 금전 공물보다 강제된 노동 예속이 더 분명하므로 ‘강제 노역’이 적절합니다.
theological_decisions:
- issue: 정복 전쟁 규정의 예속 언어를 얼마나 직접적으로 옮길지
  chosen_reading: ‘강제 노역이 되고 당신을 섬길 것입니다’로 직설적으로 유지했습니다.
  alternative_readings:
  - 당신에게 조공을 바칠 것입니다
  - 당신에게 복속될 것입니다
  rationale: 본문은 평화 제안을 받아들인 성읍의 사람들을 실제로 예속시키는 결과를 말하므로, 그 강도를 완화하지 않고 원문이 지닌 역사적·윤리적 무게를 드러내는 편이 적합합니다.
  doctrine_reference: 신명기 20:10-11의 전쟁법 문맥
