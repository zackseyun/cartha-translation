base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
  footnotes:
  - marker: a
    text: Or 'Do not lose heart.' The Hebrew idiom is literally 'Do not let your heart grow faint/soft,' referring to a collapse of courage.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not fear, and do not be thrown into panic, and do not be terrified before them.' The three prohibitions intensify the command against fear in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. “이스라엘아, 들으십시오. 오늘 여러분은 여러분의 적들과 싸우러 나아갑니다. 마음이 약해지지 않게 하십시오.[a] 두려워하지 말고, 당황하지도 말고, 그들 앞에서 떨지 마십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘마음이 부드러워지다/약해지다’라는 뜻으로, 용기 상실을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 세 금지문은 두려움에 대한 경고를 점층적으로 강화합니다.
    reason: lexical_alternative
