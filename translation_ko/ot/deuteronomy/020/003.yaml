  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
  footnotes:
  - marker: a
    text: Or 'Do not lose heart.' The Hebrew idiom is literally 'Do not let your heart grow faint/soft,' referring to a collapse of courage.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not fear, and do not be thrown into panic, and do not be terrified before them.' The three prohibitions intensify the command against fear in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. “이스라엘아, 들으십시오. 오늘 여러분은 여러분의 적들과 싸우러 나아갑니다. 마음이 약해지지 않게 하십시오. 두려워하지 말고, 당황하지도 말고, 그들 앞에서 떨지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘마음이 부드러워지다/약해지다’라는 뜻으로, 용기 상실을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 세 금지문은 두려움에 대한 경고를 점층적으로 강화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע יִשְׂרָאֵל
  english_pob_choice: Hear, Israel
  chosen_korean: 이스라엘아, 들으십시오
  alternatives_korean:
  - 이스라엘아, 들으시오
  - 이스라엘아, 들어라
  lexicon: HALOT
  rationale: 언약적 호소문을 살리되, 표준어 합쇼체로 청중에게 직접 요청하는 형태를 유지했습니다.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  english_pob_choice: today you are drawing near to battle
  chosen_korean: 오늘 여러분은 여러분의 적들과 싸우러 나아갑니다
  alternatives_korean:
  - 오늘 여러분은 전투에 가까이 가고 있습니다
  - 오늘 여러분은 전쟁을 향해 다가가고 있습니다
  lexicon: HALOT
  rationale: קְרֵבִים의 ‘가까이 다가가다’ 이미지를 자연스러운 군사 문맥으로 옮겨 ‘싸우러 나아갑니다’로 표현했습니다.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  english_pob_choice: Do not let your heart grow faint
  chosen_korean: 마음이 약해지지 않게 하십시오
  alternatives_korean:
  - 마음이 흐트러지지 않게 하십시오
  - 마음이 낙심하지 않게 하십시오
  - 마음이 힘을 잃지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 용기 상실이므로, 문자적 ‘심장이 약해지다’보다는 한국어에서 같은 효과를 내는 ‘마음이 약해지다’로 옮겼습니다.
- source_word: אַל תִּירְאוּ וְאַל תַּחְפְּזוּ וְאַל תַּעַרְצוּ
  english_pob_choice: Do not fear, or panic, or be terrified
  chosen_korean: 두려워하지 말고, 당황하지도 말고, 그들 앞에서 떨지 마십시오
  alternatives_korean:
  - 두려워하지 말고, 혼란에 빠지지도 말고, 그들 앞에서 무너지지도 마십시오
  - 두려워하지 말고, 패닉에 빠지지도 말고, 그들 앞에서 겁먹지도 마십시오
  lexicon: HALOT
  rationale: 세 금지문이 두려움의 강도를 점층적으로 강조하므로, ‘당황하다/떨다’로 자연스럽게 옮겨 긴장감을 보존했습니다.
theological_decisions:
- issue: 전쟁 직전의 격려 명령을 어떻게 한국어 명령문으로 전달할지
  chosen_reading: 본문의 연속된 금지문과 권면을 살려, 공적인 명령과 위로가 함께 느껴지는 합쇼체로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 위로체
  - 더 강한 군사적 호령체
  rationale: 본문은 단순 정보 전달이 아니라 공동체를 전투 전에 안정시키는 언약적 권면이므로, 명령성과 목회적 격려를 함께 드러내는 균형이 필요합니다.
  doctrine_reference: 신 20:3의 전쟁 규례 맥락
- issue: ‘마음’과 ‘두려움’의 관계를 어떻게 처리할지
  chosen_reading: ‘마음이 약해지지 않게 하십시오’와 ‘두려워하지 말고’로 구분해, 내적 의기소침과 외적 공포를 함께 반영했습니다.
  alternative_readings:
  - ‘낙심하지 마십시오’로 단순화
  - 세 금지문을 하나의 일반적 두려움으로 통합
  rationale: 히브리어는 용기 붕괴, 공포, 당황, 전율을 연속으로 배치하므로, 한국어도 그 긴장을 흐리지 않도록 분리해 표현했습니다.
  doctrine_reference: 전쟁 윤리/언약 공동체 보호
