  lexicon: HALOT
  rationale: 세 금지문이 두려움의 강도를 점층적으로 강조하므로, ‘당황하다/떨다’로 자연스럽게 옮겨 긴장감을 보존했습니다.
theological_decisions:
- issue: 전쟁 직전의 격려 명령을 어떻게 한국어 명령문으로 전달할지
  chosen_reading: 본문의 연속된 금지문과 권면을 살려, 공적인 명령과 위로가 함께 느껴지는 합쇼체로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 위로체
  - 더 강한 군사적 호령체
  rationale: 본문은 단순 정보 전달이 아니라 공동체를 전투 전에 안정시키는 언약적 권면이므로, 명령성과 목회적 격려를 함께 드러내는 균형이 필요합니다.
  doctrine_reference: 신 20:3의 전쟁 규례 맥락
- issue: ‘마음’과 ‘두려움’의 관계를 어떻게 처리할지
  chosen_reading: ‘마음이 약해지지 않게 하십시오’와 ‘두려워하지 말고’로 구분해, 내적 의기소침과 외적 공포를 함께 반영했습니다.
  alternative_readings:
  - ‘낙심하지 마십시오’로 단순화
  - 세 금지문을 하나의 일반적 두려움으로 통합
  rationale: 히브리어는 용기 붕괴, 공포, 당황, 전율을 연속으로 배치하므로, 한국어도 그 긴장을 흐리지 않도록 분리해 표현했습니다.
  doctrine_reference: 전쟁 윤리/언약 공동체 보호
