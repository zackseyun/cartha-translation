revisions:
- from: 오직 여자들과 어린아이들과 가축과 성읍 안에 있는 모든 것—그 성읍의 모든 전리품—은 네가 네 자신을 위해 노략할 수 있습니다. 그리고 네 원수들의 전리품을 먹을 수 있습니다. 이는 야훼 네 하나님이 네게 주신 것입니다.[a]
  to: 오직 여자들과 어린아이들과 가축과 성읍 안에 있는 모든 것, 곧 그 성읍의 모든 전리품은 당신이 당신의 전리품으로 노획할 수 있습니다. 그리고 야훼 당신의 하나님께서 당신에게 주신 당신 원수들의 전리품을 먹을 수 있습니다.[a]
