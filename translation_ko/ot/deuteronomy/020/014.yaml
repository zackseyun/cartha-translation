base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
  footnotes:
  - marker: a
    text: Or, 'you shall eat the spoil of your enemies.' The Hebrew verb is literally 'eat' and can extend to making use of or consuming what is taken.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 여자들과 어린아이들과 가축과 성읍 안에 있는 모든 것, 곧 그 성읍의 모든 전리품은 당신이 당신의 전리품으로 노획할 수 있습니다. 그리고 야훼 당신의 하나님께서 당신에게 주신 당신 원수들의 전리품을 먹을 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘먹다’이며, 여기서는 취한 전리품을 사용하거나 누리는 행위를 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 오직만
  lexicon: HALOT
  rationale: 앞선 명령에 대한 예외를 표시하는 제한어이므로, 한국어에서는 간결한 ‘오직’이 가장 자연스럽고 제약의 힘을 잘 살립니다.
- source_word: הַטַּף
  english_pob_choice: the little children
  chosen_korean: 어린아이들
  alternatives_korean:
  - 아이들
  - 어린 자녀들
  lexicon: HALOT
  rationale: טַף는 단순한 ‘자녀’보다 어린 연령층을 가리키는 뉘앙스가 있어, ‘어린아이들’이 POB의 의미를 가장 직접적으로 반영합니다.
- source_word: תָּבֹז לָךְ
  english_pob_choice: you may take as plunder for yourself
  chosen_korean: 네가 네 자신을 위해 노략할 수 있습니다
  alternatives_korean:
  - 네가 스스로 노략할 수 있습니다
  - 네가 너를 위하여 탈취할 수 있습니다
  lexicon: HALOT
  rationale: בָּזַז의 ‘노략하다/약탈하다’ 의미를 살리되, 허용·승인된 행위라는 법문체를 반영해 ‘할 수 있습니다’로 옮겼습니다.
- source_word: וְאָכַלְתָּ
  english_pob_choice: and you may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 취할 수 있습니다
  - 소비할 수 있습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘먹다’이지만, 전리품을 실제로 섭취하는 뜻만이 아니라 ‘자유롭게 사용하다’는 비유적 확장을 포함하므로, 본문과 함께 읽히도록 직역을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 언약적 고유 이름을 보존합니다.
theological_decisions:
- issue: 전리품에 대한 허용 표현의 법문체
  chosen_reading: ‘~할 수 있습니다’로 허용을 드러내는 번역
  alternative_readings:
  - ‘~해야 합니다’의 명령형
  - 단순 미래형 ‘~할 것입니다’
  rationale: 히브리어는 여기서 전리품 취득을 허가하는 규정으로 기능하므로, 한국어에서는 강제 명령보다 허용의 뉘앙스를 드러내는 것이 본문 기능에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
