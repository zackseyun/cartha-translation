  to: 이는 너희 하나님 야훼께서 너희와 함께 가셔서 너희를 위하여 너희의 적들과 싸우시고 너희를 구원하시기 때문입니다.[a]
  rationale: 원문의 לָכֶם을 ‘너희를 위하여’로 명시하여 하나님이 백성을 대신하여 싸우신다는 의미를 복원했습니다. 신명, 동행, 전투, 구원이라는 원문의 순서와 의미 관계를 유지하면서 문장을 자연스러운 합쇼체로 정리했습니다. 각주는 הוֹשִׁיעַ의 ‘구원/구출’ 범위와 전쟁 문맥의 ‘승리’ 함의를 보존하도록 소폭 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:59Z'
