base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
  footnotes:
  - marker: a
    text: Or 'to deliver you' or 'to give you victory.' The Hebrew verb can denote rescue or deliverance, here in the context of battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희 하나님 야훼께서 너희와 함께 가셔서 너희를 위하여 너희의 적들과 싸우시고 너희를 구원하시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 건져 내시다’ 혹은 ‘너희에게 승리를 주시다’로 옮길 수 있습니다. 히브리어 동사는 구출이나 구원을 뜻할 수 있으며, 여기서는 전투의 맥락에 놓여 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명 יְהוָה는 POB 원칙에 따라 ‘야훼’로 옮겨 신적 고유명과 언약적 인격성을 유지했습니다.
- source_word: הַהֹלֵךְ עִמָּכֶם
  english_pob_choice: is the one who goes with you
  chosen_korean: 너희와 함께 가셔서
  alternatives_korean:
  - 너희와 함께 가시는 분이
  - 너희와 함께 가십니다
  lexicon: HALOT
  rationale: 분사적 진행성을 한국어에서 자연스럽게 살리기 위해 ‘~가셔서’로 연결해, 계속 함께 동행하시는 분의 뉘앙스를 반영했습니다.
- source_word: לְהִלָּחֵם לָכֶם עִם אֹיְבֵיכֶם
  english_pob_choice: to fight for you against your enemies
  chosen_korean: 너희의 적들과 싸워
  alternatives_korean:
  - 너희를 위해 너희 적들과 싸워
  - 너희 편에서 너희 적들과 싸워
  lexicon: HALOT
  rationale: ‘לָכֶם’의 유익을 문맥상 이미 포함하므로, ‘너희의 적들과 싸워’로 간결하게 처리하되 대립 관계를 분명히 했습니다.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  english_pob_choice: to save you
  chosen_korean: 너희를 구원하실 것이기 때문입니다
  alternatives_korean:
  - 너희를 구해 주실 것이기 때문입니다
  - 너희를 구출하실 것이기 때문입니다
  lexicon: HALOT
  rationale: 히필 동사 ישׁע는 전쟁 맥락에서도 ‘구원/구출’의 폭을 가지므로, 신학적 울림을 보존하는 ‘구원하시다’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 직설적으로 신명을 사용하므로, 제목형 대체어보다 언약적 고유명 ‘야훼’가 원문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 전쟁 맥락의 לְהוֹשִׁיעַ
  chosen_reading: 구원하실
  alternative_readings:
  - 구해 주실
  - 구출하실
  rationale: 즉각적 전투 상황을 넘어서 하나님의 구원 행위를 함께 드러내기 위해 ‘구원하다’를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
