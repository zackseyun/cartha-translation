  source_fidelity: ‘너희의 적들과 싸워’는 전투의 상대(עִם אֹיְבֵיכֶם)는 전달하지만, לָכֶם의 여격, 곧 ‘너희를 위하여/너희를 위해서’라는 수혜 의미를 명시하지 않아 원문의 한 요소가 빠졌습니다. 이를 보완하면 원문의 동행, 대적과의 전투, 구원 목적이 모두 충실히 반영됩니다.
