base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
  footnotes:
  - marker: a
    text: Or 'inaugurate it.' The Hebrew verb refers to formally beginning the use of the new house, often with a dedicatory sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 관리자들이 백성에게 말해야 합니다. 「새 집을 지었으나 아직 헌정하지 않은 사람이 누구입니까? 그는 자기 집으로 돌아가게 하십시오. 전쟁에서 죽을까 하여, 다른 사람이 그 집을 헌정할 수도 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 새 집을 공식적으로 사용 시작하게 하거나 헌정하는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  english_pob_choice: the officers
  chosen_korean: 관리자들
  alternatives_korean:
  - 관리관들
  - 장교들
  lexicon: HALOT
  rationale: 군사적·행정적 맥락의 공적 전달자라는 점은 살리되, 한국어에서 ‘officers’의 직역감이 지나치게 군사화되지 않도록 ‘관리자들’로 옮겼습니다.
- source_word: בָּנָה בַיִת חָדָשׁ
  english_pob_choice: has built a new house
  chosen_korean: 새 집을 지었으나
  alternatives_korean:
  - 새 집을 세웠으나
  - 새 집을 마련했으나
  lexicon: HALOT
  rationale: בַּיִת의 기본 뜻을 따라 ‘집’을 유지했고, ‘지었다’로 건축 행위를 자연스럽게 살렸습니다.
- source_word: וְלֹא חֲנָכוֹ / יַחְנְכֶנּוּ
  english_pob_choice: and has not dedicated it / dedicate it
  chosen_korean: 헌정하지 않은 / 헌정할
  alternatives_korean:
  - 봉헌하지 않은 / 봉헌할
  - 헌당하지 않은 / 헌당할
  lexicon: HALOT
  rationale: חנך의 ‘정식으로 사용을 시작하다, 헌정하다’라는 의미를 반복적으로 살리기 위해 같은 어근을 한국어에서도 일관되게 ‘헌정하다’로 옮겼습니다.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  english_pob_choice: lest he die in the battle
  chosen_korean: 전쟁에서 죽을까 하여
  alternatives_korean:
  - 전투에서 죽을까 하여
  - 전쟁 중에 죽을까 하여
  lexicon: HALOT
  rationale: פֶּן의 예방적 경고를 한국어의 ‘-까 하여’로 자연스럽게 표현했고, ‘battle’를 문맥상 넓은 ‘전쟁’으로 옮겼습니다.
