base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'horse and chariot'; the Hebrew singulars likely function collectively for military forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'a people greater than you.' The phrase likely emphasizes that the enemy force is larger in number.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'who brought you up from the land of Egypt,' echoing the exodus as the ground for Israel's confidence.
    reason: cross_reference
translation:
  language: ko
  text: 당신이 적군과 맞서 싸우러 나가서 말과 병거를 보며, 당신보다 더 많은 백성을 보더라도 그들을 두려워하지 마십시오. 당신과 함께 계시는 야훼, 당신의 하나님께서 바로 당신을 이집트 땅에서 올라오게 하신 분이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말과 병거’는 히브리어 단수형을 집합적으로 읽은 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신보다 더 많은 백성’은 적군의 수적 우세를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵצֵא לַמִּלְחָמָה
  english_pob_choice: you go out to battle
  chosen_korean: 맞서 싸우러 나가다
  alternatives_korean:
  - 전쟁하러 나가다
  - 전투하러 나가다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 이동이 아니라 적대적 군사 행동을 뜻하므로, 자연스러운 합쇼체로 ‘맞서 싸우러 나가서’라고 옮겼습니다.
- source_word: סוּס וָרֶכֶב
  english_pob_choice: horses and chariots
  chosen_korean: 말과 병거
  alternatives_korean:
  - 말과 전차
  - 말과 전투마차
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 군사력을 집합적으로 가리킬 수 있어, 영어 POB의 집합적 이해에 따라 한국어도 복수보다 집합명사로 간결하게 옮겼습니다.
- source_word: עַם רַב מִמְּךָ
  english_pob_choice: a people more numerous than you
  chosen_korean: 당신보다 더 많은 백성
  alternatives_korean:
  - 당신보다 더 수많은 민족
  - 당신보다 수가 많은 군대
  lexicon: HALOT
  rationale: 비교의 핵심은 전력보다 수적 우세이므로, ‘백성’과 ‘더 많은’으로 숫자의 우세를 직접 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 신명기를 드러내는 고유명사 ‘야훼’를 유지했습니다.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: who brought you up from the land of Egypt
  chosen_korean: 당신을 이집트 땅에서 올라오게 하신 분
  alternatives_korean:
  - 당신을 이집트 땅에서 이끌어 내신 분
  - 당신을 이집트 땅에서 올라오게 하신 이
  lexicon: HALOT
  rationale: 출애굽의 관용구 ‘올라오게 하다’는 단순한 탈출보다 언약사적 상향 이동을 함축하므로 그대로 보존했습니다.
theological_decisions:
- issue: 신명기 본문의 두려움 금지와 출애굽 근거의 결합
  chosen_reading: 두려워하지 마십시오… 야훼, 당신의 하나님께서 바로 당신을 이집트에서 올라오게 하신 분이기 때문입니다.
  alternative_readings:
  - 그들을 두려워하지 마십시오. 왜냐하면…
  - 그들을 무서워하지 마십시오. …
  rationale: 금지는 명령형으로, 근거는 출애굽 기억으로 제시되어 이스라엘의 신뢰가 현재 전력보다 야훼의 과거 구원 행위에 있음을 분명히 했습니다.
  doctrine_reference: 신명기 20:1의 언약적 전쟁 신학
