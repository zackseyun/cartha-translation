base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'horse and chariot'; the Hebrew singulars likely function collectively for military forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'a people greater than you.' The phrase likely emphasizes that the enemy force is larger in number.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'who brought you up from the land of Egypt,' echoing the exodus as the ground for Israel's confidence.
    reason: cross_reference
translation:
  language: ko
  text: 당신이 적들과 싸우러 나가 말과 병거[a]와 당신보다 수가 많은 백성[b]을 보게 될 때, 그들을 두려워하지 마십시오. 이는 당신의 하나님 야훼께서 당신과 함께 계시며, 당신을 이집트 땅에서 올라오게 하신 분이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말과 병거’. 히브리어의 단수형들은 군사력을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신보다 더 큰 백성’. 이 표현은 적의 수적 우세를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
