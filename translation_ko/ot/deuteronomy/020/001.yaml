  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 신명기를 드러내는 고유명사 ‘야훼’를 유지했습니다.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: who brought you up from the land of Egypt
  chosen_korean: 당신을 이집트 땅에서 올라오게 하신 분
  alternatives_korean:
