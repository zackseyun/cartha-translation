  lexicon: HALOT
  rationale: 출애굽의 관용구 ‘올라오게 하다’는 단순한 탈출보다 언약사적 상향 이동을 함축하므로 그대로 보존했습니다.
theological_decisions:
- issue: 신명기 본문의 두려움 금지와 출애굽 근거의 결합
  chosen_reading: 두려워하지 마십시오… 야훼, 당신의 하나님께서 바로 당신을 이집트에서 올라오게 하신 분이기 때문입니다.
  alternative_readings:
  - 그들을 두려워하지 마십시오. 왜냐하면…
  - 그들을 무서워하지 마십시오. …
  rationale: 금지는 명령형으로, 근거는 출애굽 기억으로 제시되어 이스라엘의 신뢰가 현재 전력보다 야훼의 과거 구원 행위에 있음을 분명히 했습니다.
  doctrine_reference: 신명기 20:1의 언약적 전쟁 신학
