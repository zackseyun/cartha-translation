  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
  footnotes:
  - marker: a
    text: Or, more literally, 'will return your captivity'; the Hebrew idiom means to restore someone from a state of distress or exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'and he will return and gather you.'
    reason: alternative_reading
  - marker: c
    text: Or 'from all the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼 당신의 하나님께서 당신의 처지를 회복하시고 당신에게 긍휼을 베푸실 것이며, 야훼 당신의 하나님께서 당신을 흩으신 모든 백성 가운데서 당신을 다시 모으실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘당신의 포로됨을 돌이키다’이지만 여기서는 비참한 처지의 회복을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 다시 돌아와 당신을 모으실 것입니다’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘모든 나라들 가운데서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 공용 번역 관행 및 프로젝트 기본
  rationale: 언약 이름을 살리기 위해 프로젝트 기본을 따랐으며, 전통적 교회 용어인 ‘여호와’보다 원문 음가를 더 직접적으로 반영합니다.
- source_word: שָׁב יְהוָה אֱלֹהֶיךָ אֶת שְׁבוּתְךָ
  english_pob_choice: will restore your fortunes
  chosen_korean: 당신의 처지를 회복하시고
  alternatives_korean:
  - 당신의 포로 상태를 돌이키시고
  - 당신의 포로됨을 회복하시고
  - 당신의 운명을 회복하시고
  lexicon: HALOT
  rationale: 이 관용구는 단순한 ‘포로 귀환’보다 비참한 상태의 반전과 회복을 뜻하므로, 문맥에 맞게 ‘처지를 회복하다’로 옮겼습니다.
- source_word: וְרִחֲמֶךָ
  english_pob_choice: and have compassion on you
  chosen_korean: 당신에게 긍휼을 베푸실 것이며
  alternatives_korean:
  - 당신을 불쌍히 여기실 것이며
  - 당신에게 자비를 베푸실 것이며
  lexicon: HALOT
  rationale: רחם의 핵심은 연민 어린 자비이므로, 현대 한국어에서 자연스럽고 성경적 뉘앙스를 유지하는 ‘긍휼을 베풀다’를 택했습니다.
- source_word: וְקִבֶּצְךָ מִכָּל הָעַמִּים
  english_pob_choice: and he will gather you again from all the peoples
  chosen_korean: 다시 모으실 것이며 … 모든 백성 가운데서 당신을
  alternatives_korean:
  - 다시 모으실 것이며 … 모든 민족 가운데서 당신을
  - 다시 모으실 것이며 … 모든 나라들 가운데서 당신을
  lexicon: HALOT
  rationale: קבץ는 흩어진 백성을 재집합시키는 뜻이므로 ‘모으다’가 적절하며, עמים는 여기서 민족 집단을 가리키는 넓은 표현이어서 ‘백성’으로 옮겼습니다.
- source_word: מִכָּל הָעַמִּים
  english_pob_choice: from all the peoples
  chosen_korean: 모든 백성 가운데서
  alternatives_korean:
  - 모든 민족 가운데서
  - 모든 나라 가운데서
  lexicon: HALOT
  rationale: 히브리어 복수형은 ‘민족들/백성들’의 넓은 범위를 가리키므로, 문맥상 가장 자연스러운 ‘백성들’ 계열을 사용했습니다.
theological_decisions:
- issue: שׁוּב שְׁבוּת idiom의 신학적·문맥적 의미
  chosen_reading: 포로 귀환 그 자체보다, 하나님이 언약 백성의 비참한 상태를 회복시키는 약속으로 읽고 ‘처지를 회복하시다’로 번역했습니다.
  alternative_readings:
  - ‘당신의 포로됨을 돌이키시다’
  - ‘당신의 포로를 돌이키시다’
  rationale: 이어지는 절반이 이미 ‘흩으신 모든 백성 가운데서 다시 모으다’라는 구체적 회복을 말하므로, 첫 절은 관용구의 총체적 회복 의미를 살리는 것이 더 정확합니다.
  doctrine_reference: 언약 회복과 포로기 귀환 신학
