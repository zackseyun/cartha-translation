translation:
  language: ko
  text: 그때에 당신의 하나님 야훼께서 당신의 형편을 회복시키시고 당신에게 자비를 베푸실 것이며, 당신의 하나님 야훼께서 당신을 흩어 놓으신 모든 민족 가운데서 당신을 다시 모으실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘당신의 포로 상태를 돌이키다’이지만 여기서는 비참한 형편을 회복한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 돌아와 당신을 모으실 것입니다’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘모든 나라들 가운데서’.
    reason: lexical_alternative
