base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
  footnotes:
  - marker: a
    text: Or 'turn back' or 'repent' to the LORD your God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'obey the voice of the LORD'; the expression means to heed what he says.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 네 하나님 야훼의 음성에 순종하고[a] 이 율법책에 기록되어 있는 그분의 계명과 규례를 지키며, 온 마음과 온 영혼을 다하여 네 하나님 야훼께 돌아오면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘음성에 순종하다’는 단순히 소리를 듣는 것이 아니라, 그가 말하는 바를 따르고 순종한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아오다’는 회개와 언약 관계로의 귀환을 함축할 수 있으나, 히브리어 동사의 기본 비유는 ‘돌아오다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמַע בְּקוֹל
  english_pob_choice: you obey the voice
  chosen_korean: 음성에 순종하여
  alternatives_korean:
  - 음성을 듣고
  - 음성에 귀 기울여
  - 말씀을 따라
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순 청취가 아니라 그 말에 복종하는 뜻이므로, 한국어에서는 ‘음성에 순종하여’로 옮겨 소리 자체보다 순종의 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 신적 고유명은 ‘야훼’로 옮겨, 호칭인 ‘주’로 바꾸지 않고 이름의 직접성을 유지했습니다.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  english_pob_choice: his commandments and his statutes
  chosen_korean: 그의 명령들과 그의 규례들
  alternatives_korean:
  - 그의 계명들과 그의 율례들
  - 그의 명령들과 그의 법도들
  lexicon: HALOT
  rationale: 두 어휘의 병렬을 살리되, 한국어 성경 전통어를 기계적으로 고정하지 않고 문맥상 자연스러운 ‘명령들 / 규례들’로 구분했습니다.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  english_pob_choice: in this book of the law
  chosen_korean: 이 율법책에
  alternatives_korean:
  - 이 율법의 책에
  - 이 토라의 책에
  - 이 율법 두루마리에
  lexicon: HALOT
  rationale: 토라 문맥에서 ‘율법책’이 가장 간결하고 자연스러우며, ‘이’와의 지시 관계도 잘 드러납니다.
- source_word: כִּי תָשׁוּב אֶל יְהוָה אֱלֹהֶיךָ
  english_pob_choice: if you return to Yahweh your God
  chosen_korean: 당신의 온 마음과 온 영혼으로 야훼 당신의 하나님께 돌아오면
  alternatives_korean:
  - 야훼 당신의 하나님께 돌아서면
  - 야훼 당신의 하나님께 회개하면
  - 야훼 당신의 하나님께 되돌아오면
  lexicon: HALOT
  rationale: שׁוּב는 단순 이동이 아니라 언약적 ‘돌아옴’을 뜻하므로, POB의 ‘return’에 맞춰 ‘돌아오면’으로 옮겼습니다.
theological_decisions:
- issue: שׁוּב(돌아오다)의 회개/회복 뉘앙스
  chosen_reading: ‘돌아오다’를 기본으로 두고 회개 의미를 직접 단정하지 않았습니다.
  alternative_readings:
  - 회개하다
  - 돌아서다
  - 회복하다
  rationale: 본문은 순종과 언약적 귀환을 함께 말하지만, 히브리어 동사의 기본 이미지는 ‘돌아감’이므로 그 은유를 보존하는 편이 본문의 긴장을 더 잘 전달합니다.
  doctrine_reference: 번역 원칙 §3 — 신학적 긴장을 해소하지 말고 보존할 것
