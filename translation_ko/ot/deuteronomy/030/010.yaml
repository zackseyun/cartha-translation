- from: 만일 당신이 야훼 당신의 하나님의 음성에 순종하여, 이 율법책에 기록된 그의 명령들과 그의 규례들을 지키며, 당신의 온 마음과 온 영혼으로 야훼 당신의 하나님께 돌아오면.[a][b]
  to: 만일 네 하나님 야훼의 음성에 순종하고[a] 이 율법책에 기록되어 있는 그분의 계명과 규례를 지키며, 온 마음과 온 영혼을 다하여 네 하나님 야훼께 돌아오면,[b]
  rationale: 한국어의 중복된 소유 표현을 ‘네 하나님 야훼’로 바로잡고, 원문의 두 조건을 자연스럽게 연결했습니다. ‘계명과 규례’의 병렬 및 ‘돌아오다’의 비유적 개방성을 보존했습니다. 각주 a는 히브리어 관용구에, 각주 b는 שׁוּב의 가능한 뉘앙스에 직접 연결했습니다.
