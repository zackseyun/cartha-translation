  naturalness: ‘야훼 당신의 하나님’은 한국어에서 동일한 소유 관계가 중복되어 부자연스럽고, 성경 문맥의 자연스러운 어순은 ‘네 하나님 야훼’입니다. ‘온 마음과 온 영혼으로’보다 ‘온 마음과 온 영혼을 다하여’가 현대 표준어에서 더 자연스럽습니다.
