revisions:
- from: 야훼 당신의 하나님이 당신의 조상들이 소유했던 땅으로 당신을 데려가실 것이며, 당신은 그것을 차지할 것입니다[a]. 또 그분은 당신에게 복을 주시고, 당신을 조상들보다 더 번성하게 하실 것입니다[b].
  to: 야훼, 당신의 하나님께서 당신의 조상들이 소유했던[a] 땅으로 당신을 데려가실 것이며, 당신은 그 땅을 차지할 것입니다. 그분은 당신에게 선을 베푸시고[b], 당신을 당신의 조상들보다 더 많게 하실 것입니다.
  rationale: 각주 표지를 해당 어구로 옮겨 앵커를 바로잡았습니다. 하나님의 이름 뒤에 쉼표와 주격 조사를 보완하고, 지시 대상을 ‘그 땅’으로 명료하게 했습니다. 또한 ‘선을 베푸시다’와 ‘더 많게 하시다’로 각각 הֵיטִיב과 רבה의 직접적인 의미를 보존했습니다.
  reviewer_model: gpt-5.6-terra
