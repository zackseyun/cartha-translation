source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
  footnotes:
  - marker: a
    text: Or 'that your fathers inherited' / 'that your fathers took possession of.' The Hebrew verb can carry both inheritance and possession nuances.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will do you good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 당신의 하나님께서 당신의 조상들이 소유했던[a] 땅으로 당신을 데려가실 것이며, 당신은 그 땅을 차지할 것입니다. 그분은 당신에게 선을 베푸시고[b], 당신을 당신의 조상들보다 더 많게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 조상들이 상속받았던’, ‘당신의 조상들이 차지했던’. 히브리어 동사는 상속과 소유의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 당신에게 복을 주시고’, ‘그분은 당신을 번영하게 하시고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하느님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 여호와 대신 하나님의 고유명 야훼를 살리고, אֱלֹהֶיךָ는 언약적 소유 관계를 드러내는 ‘당신의 하나님’으로 옮겼습니다.
- source_word: וֶהֱבִיאֲךָ ... אֶל הָאָרֶץ
  english_pob_choice: will bring you into the land
  chosen_korean: '...땅으로 당신을 데려가실 것이며'
  alternatives_korean:
  - '...땅으로 당신을 인도하실 것이며'
  - '...땅에 들어가게 하실 것이며'
  lexicon: HALOT
  rationale: 히필 동사는 ‘들여오다/데려가다’의 사역적 의미를 가지므로, 문맥상 자연스러운 ‘데려가실 것이며’로 옮겼습니다.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  english_pob_choice: that your fathers possessed
  chosen_korean: 당신의 조상들이 소유했던
  alternatives_korean:
  - 당신의 조상들이 상속받았던
  - 당신의 조상들이 차지했던
  lexicon: HALOT
  rationale: יָרַשׁ는 상속과 소유/점유의 뉘앙스를 함께 가질 수 있어, 여기서는 이미 가졌던 땅이라는 점을 살려 ‘소유했던’으로 옮겼습니다.
- source_word: וִירִשְׁתָּהּ
  english_pob_choice: and you will possess it
  chosen_korean: 당신은 그것을 차지할 것입니다
  alternatives_korean:
  - 당신은 그것을 소유할 것입니다
  - 당신은 그것을 상속할 것입니다
  lexicon: HALOT
  rationale: 같은 어근의 반복을 살리면서도 한국어에서 능동적 정복·점유의 감각이 살아나는 ‘차지할 것입니다’를 택했습니다.
- source_word: וְהֵיטִבְךָ
  english_pob_choice: and he will prosper you
  chosen_korean: 또 그분은 당신에게 복을 주시고
  alternatives_korean:
  - 또 그분은 당신에게 좋게 하시고
  - 또 그분은 당신을 번영하게 하시고
  lexicon: HALOT
  rationale: 직역하면 ‘당신에게 선을 행하시다’이지만, 문맥상 축복의 결과를 나타내므로 한국어에서는 ‘복을 주시고’로 자연스럽게 풀었습니다.
- source_word: וְהִרְבְּךָ
  english_pob_choice: and multiply you
  chosen_korean: 당신을 조상들보다 더 번성하게 하실 것입니다
  alternatives_korean:
  - 당신의 수를 조상들보다 더 많게 하실 것입니다
  - 당신을 더 크게 늘리실 것입니다
  lexicon: HALOT
  rationale: ‘번성하게 하다’는 רבה의 수적 증가와 번영의 함의를 함께 살리며, 뒤의 비교구조와도 자연스럽게 연결됩니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: ‘야훼’로 유지하여 고유한 언약 անուն을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘여호와’로 번역
  rationale: 본문은 신적 칭호가 아니라 여호와의 고유명 יְהוָה를 사용하므로, 번역에서도 이를 가려지지 않게 해야 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֲבֹתֶיךָ의 번역
  chosen_reading: ‘조상들’로 옮겨 남성 복수의 직접성을 유지합니다.
  alternative_readings:
  - ‘선조들’로 중립화
  - ‘조부모들’로 완화
  rationale: 히브리어는 명시적으로 ‘아버지들’의 복수형이지만, 한국어에서는 문맥상 포괄적 의미를 드러내기 위해 ‘조상들’을 택하되, 성별 표지는 과도하게 중립화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
