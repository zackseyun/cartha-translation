base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
  footnotes:
  - marker: a
    text: Or 'his ordinances' for 'his judgments' (מִשְׁפָּטָיו).
    reason: lexical_alternative
  - marker: b
    text: Or 'that you may live and become many, and the LORD your God will bless you.' The Hebrew verbal sequence can be understood as result or promise.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'that you are entering there to possess it,' preserving the directional adverb 'there.' English may also be rendered more smoothly, 'that you are entering to possess.'
    reason: lexical_alternative
  - marker: d
    text: Or 'to inherit it' for 'to possess it' (לְרִשְׁתָּהּ), especially in land-promise contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 오늘 당신에게 명령하는 것은 이것입니다. 당신의 하나님 야훼를 사랑하고, 그의 길들을 따라 걸으며, 그의 계명과 규례와 법도를 지키십시오. 그러면 당신은 살고 번성할 것이며, 당신이 그곳으로 들어가 차지할 땅에서 당신의 하나님 야훼께서 당신에게 복을 주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법도’로 옮긴 히브리어 미쉬파팀(מִשְׁפָּטִים)은 문맥에 따라 ‘판결들’ 또는 ‘법규들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘당신이 그곳으로 들어가 그것을 차지할 땅’입니다. ‘그곳’이라는 방향 부사와 땅을 가리키는 ‘그것’이 포함되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와의 이름 표기인 יְהוָה를 직접 사용하므로, POB의 원칙에 따라 고유한 언약 이름을 그대로 옮겼습니다.
- source_word: לָלֶכֶת בִּדְרָכָיו
  english_pob_choice: to walk in his ways
  chosen_korean: 그의 길들로 걸으며
  alternatives_korean:
  - 그의 길을 따라가며
  - 그의 길로 행하며
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 삶의 행실을 뜻하는 ‘걷다’의 이미지를 유지했습니다.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  english_pob_choice: his commandments, his statutes, and his judgments
  chosen_korean: 그의 계명과 그의 규례와 그의 법도
  alternatives_korean:
  - 그의 명령들과 그의 규례들과 그의 판단들
  - 그의 계명과 그의 법령과 그의 판결
  lexicon: HALOT
  rationale: 세 항목의 법적/언약적 구분을 살리되, 한국어 성경에서 알아보기 쉬운 표준 대응어를 사용했습니다. ‘judgments’는 여기서 ‘법도’보다 직역감이 약하지만, 문맥상 규범적 판례/판단의 뉘앙스를 포괄하도록 보존했습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess it
  chosen_korean: 차지하려고
  alternatives_korean:
  - 소유하려고
  - 기업으로 받으려고
  lexicon: HALOT
  rationale: 가나안 땅 약속 맥락에서 ירשׁ는 단순 소유보다 ‘차지하다/기업으로 받다’의 언약적 의미가 강해 ‘차지하다’를 택했습니다.
theological_decisions:
- issue: 조건문/결과문으로 이어지는 동사의 흐름
  chosen_reading: ‘살고 번성하게 하며… 복 주시게 하려는 것입니다’로 결과-목적 흐름을 한 문장 안에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘살고 번성할 것이며… 복 주실 것입니다’처럼 단순 미래로 처리
  - ‘살기 위해 번성하기 위해’처럼 목적만 강조
  rationale: 히브리어의 연속 동사들은 순수 미래 진술보다 순종의 결과와 목적을 함께 나타내므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: Deuteronomy covenant blessing syntax
- issue: ‘그 땅’의 지시와 ‘차지하다’의 언약적 의미
  chosen_reading: ‘당신이 차지하려고 들어가는 그 땅’으로 번역해 진입과 소유의 긴장을 함께 살렸습니다.
  alternative_readings:
  - ‘들어가 차지할 땅’
  - ‘들어가서 소유할 땅’
  rationale: 문맥상 단순한 이동이 아니라 약속의 땅을 실제로 점유하는 행위가 핵심이므로, 진입과 점유를 모두 드러냈습니다.
  doctrine_reference: Land promise in Deuteronomy
