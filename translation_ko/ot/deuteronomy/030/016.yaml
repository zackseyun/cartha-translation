review_pass:
  verdict: revise
  source_fidelity: 초안은 야훼, 계명·규례·법도, 땅을 차지한다는 핵심 의미를 대체로 보존합니다. 그러나 וְחָיִיתָ, וְרָבִיתָ, וּבֵרַכְךָ의 연속을 ‘...하게 하며 ... 복 주시게 하려는 것입니다’로 옮기면 하나님께 복을 주시도록 명령의 목적이 설정된 듯한 문법적 관계가 됩니다. 본문은 순종의 결과/약속으로, 사람이 살고 번성하며 야훼께서 복을 주시는 흐름으로 옮기는 것이 정확합니다.
  naturalness: ‘곧’의 반복, ‘야훼 곧 당신의 하나님’, ‘그의 길들로 걸으며’, ‘복 주시게 하려는 것입니다’는 현대 표준어의 격식 있는 문장으로 부자연스럽거나 의미 관계가 불명확합니다. 문장을 두 문장으로 나누고 ‘그의 길들을 따라 걸으며’ 및 미래 결과 표현을 사용하면 합쇼체 문체 안에서 자연스럽습니다.
  terminology: יְהוָה는 POB 방침과 원문에 맞추어 ‘야훼’로 유지했습니다. מִצְוֺתָיו/חֻקֹּתָיו/מִשְׁפָּטָיו는 ‘계명/규례/법도’로 구별할 수 있습니다. 기존 각주 a는 영어 단어 ‘judgments’를 설명하고 본문 내 닻도 불분명하므로, 히브리어 משפטים의 가능한 의미를 설명하도록 고쳤습니다.
  issues:
