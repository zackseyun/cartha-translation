    rationale: 한국어 번역의 각주가 영어 ‘judgments’를 직접 설명하며, 어느 한국어 표현에 연결되는지 명확하지 않습니다. ‘법도’ 뒤에 닻을 두고 원어의 대안을 제시해야 합니다.
