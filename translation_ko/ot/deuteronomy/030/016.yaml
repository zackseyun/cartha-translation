revisions:
- from: 곧 내가 오늘 당신에게 명령하는 것은 이것입니다. 곧 야훼 곧 당신의 하나님을 사랑하고, 그의 길들로 걸으며, 그의 계명과 그의 규례와 그의 법도를 지켜서, 당신이 살고 번성하게 하며, 당신이 차지하려고 들어가는 그 땅에서 야훼 당신의 하나님이 당신을 복 주시게 하려는 것입니다.[a][b]
  to: 내가 오늘 당신에게 명령하는 것은 이것입니다. 당신의 하나님 야훼를 사랑하고, 그의 길들을 따라 걸으며, 그의 계명과 규례와 법도를 지키십시오. 그러면 당신은 살고 번성할 것이며, 당신이 그곳으로 들어가 차지할 땅에서 당신의 하나님 야훼께서 당신에게 복을 주실 것입니다.[a][b]
  rationale: 명령의 내용을 합쇼체 명령문으로 명료하게 제시하고, 뒤따르는 세 동사를 순종의 결과/약속으로 바로잡았습니다. ‘그곳’과 목적어 접미사의 정보는 본문과 각주에 보존했으며, משפטים 관련 각주를 한국어 본문에 직접 연결했습니다.
