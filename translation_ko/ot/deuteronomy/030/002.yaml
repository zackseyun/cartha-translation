  source_fidelity: 개정이 필요합니다. 히브리어의 동사와 소유 접미사는 일관되게 단수(‘너’)인데, 초안은 ‘너희’로 복수화했습니다. 또한 본문에 없는 당위의 보조 표현 ‘-해야 합니다’와 접속 추론어 ‘그러므로’를 넣었고, 둘째 문장이 서술어 없이 단절되어 있습니다. 본 절은 앞 절에서 시작된 조건적·연속적 문맥에 속하므로 한국어에서도 ‘-하면’으로 연결해 보존하는 것이 안전합니다.
  naturalness: ‘네가 네 자녀와 함께 온 마음을 다하고 온 생명을 다하여’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽고, 히브리어의 단수 수신자와 가족의 참여를 함께 드러냅니다. ‘온 생명으로’보다는 ‘온 생명을 다하여’가 이 병렬 표현에서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘순종하다’, ‘자녀’, ‘온 마음’, ‘온 생명’은 각각 신명, שׁמע בְּקוֹל의 관용적 의미, בנים의 포괄적 용법, לֵבָב 및 נֶפֶשׁ의 범위를 무리 없이 반영합니다. ‘온 생명’은 נֶפֶשׁ의 ‘생명/존재’ 범위를 살리며, 대안은 각주로 남깁니다.
  issues:
  - severity: high
    issue: 단수 수신자를 복수로 변경함
    rationale: וְשַׁבְתָּ, וְשָׁמַעְתָּ, אֱלֹהֶיךָ, מְצַוְּךָ, לְבָבְךָ, נַפְשֶׁךָ는 모두 남성 단수형 또는 단수 소유 접미사입니다. ‘너희’가 아니라 ‘너’로 옮겨야 합니다.
  - severity: medium
    issue: 본문에 없는 ‘그러므로’와 ‘-해야 합니다’를 첨가함
    rationale: 절두 וְ는 여기서 ‘그러므로’라는 논리적 결론을 명시하지 않으며, 완료형 연속은 문맥상 조건적·미래적 전개에 속합니다. 의무를 직접 표지하는 ‘-해야 합니다’는 원문의 형식을 과도하게 특정합니다.
  - severity: high
    issue: 둘째 문장이 미완성 문장임
    rationale: ‘곧 내가 … 모든 것대로, 온 마음으로, 온 생명으로’에는 이를 이끄는 동사와 완결 구조가 없습니다. ‘순종하면’에 수식어구를 결속해 절의 통사 관계를 회복해야 합니다.
  - severity: low
    issue: 각주 b와 c의 인칭 및 본문 표기가 불일치함
    rationale: 본문이 단수로 고쳐지면 ‘너희 아들들/너희 생명’도 ‘네 아들들/네 생명’으로 고쳐야 하며, 본문의 ‘온 생명을 다하여’에 맞추어 대안을 명료하게 제시해야 합니다.
