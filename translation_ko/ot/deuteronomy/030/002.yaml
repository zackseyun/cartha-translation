  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
  footnotes:
  - marker: a
    text: Or 'and listen to his voice.' The Hebrew idiom often carries the stronger sense 'obey.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your sons'; here rendered 'your children' because the term can function generically for offspring in this covenant context.
    reason: lexical_alternative
  - marker: c
    text: Or 'with all your life' or 'with all your whole being' for 'with all your soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 네 하나님 야훼께로 돌아와, 오늘 내가 네게 명령하는 모든 것에 따라 네 자녀와 함께[b] 온 마음을 다하고 온 생명을 다하여[c] 그의 음성에 순종하면[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성에 귀를 기울이면.’ 히브리어 관용구는 흔히 더 강한 뜻의 ‘순종하다’를 포함합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘네 아들들’입니다. 여기서는 언약 문맥에서 후손 전체를 가리킬 수 있으므로 ‘네 자녀’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘온 영혼을 다하여’, ‘온 존재를 다하여’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתָּ
  english_pob_choice: and you return
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 회개해
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미를 따라 구체적인 ‘돌아오다’를 살리되, 회개라는 신학적 해석어로 좁히지 않았습니다.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  english_pob_choice: and obey his voice
  chosen_korean: 그의 음성에 순종해야 합니다
  alternatives_korean:
  - 그의 음성을 들어야 합니다
  - 그의 음성에 귀 기울여야 합니다
  lexicon: HALOT
  rationale: שׁמע + בְּקוֹל은 단순 청취보다 ‘듣고 따르다/순종하다’의 관용법이므로, 한국어에서도 ‘순종하다’로 힘을 분명히 했습니다.
- source_word: אַתָּה וּבָנֶיךָ
  english_pob_choice: you and your children
  chosen_korean: 너희와 너희 자녀
  alternatives_korean:
  - 너희와 너희 아들들
  - 너와 네 자녀
  lexicon: HALOT
  rationale: בנים의 집합적 용법을 따라 남성으로 한정하지 않고 ‘자녀’로 옮겨, 언약 문맥의 대표성을 살렸습니다.
- source_word: וּבְכָל נַפְשֶׁךָ
  english_pob_choice: and with all your soul
  chosen_korean: 온 생명으로
  alternatives_korean:
  - 온 영혼으로
  - 온 혼신을 다해
  lexicon: HALOT
  rationale: נפשׁ는 ‘생명/자기 존재’까지 아우를 수 있어, 관용적 쌍구를 유지하면서도 현대 한국어에서 더 자연스럽고 본래의 총체성을 살리는 ‘온 생명으로’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유한 언약 이름을 제목어로 숨기지 않고 직접 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘순종’으로 옮긴 שׁמע 관용법
  chosen_reading: 그의 음성에 순종해야 합니다
  alternative_readings:
  - 그의 음성을 들어야 합니다
  rationale: 히브리어 관용구는 ‘듣다’보다 ‘듣고 따르다’의 요구를 담는 경우가 많으므로, 본문이 요구하는 언약적 응답을 분명히 하기 위해 순종 표현을 택했습니다.
  doctrine_reference: HALOT on שׁמע + בְּקוֹל
