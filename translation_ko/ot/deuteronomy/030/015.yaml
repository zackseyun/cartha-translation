  text: רְאֵ֨ה נָתַ֤תִּי לְ/פָנֶ֨י/ךָ֙ הַ/יּ֔וֹם אֶת הַֽ/חַיִּ֖ים וְ/אֶת הַ/טּ֑וֹב וְ/אֶת הַ/מָּ֖וֶת וְ/אֶת הָ/רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
  footnotes:
  - marker: a
    text: Or 'I have given before you' or 'I have placed before you.'
    reason: lexical_alternative
  - marker: b
    text: '''Evil'' may also be rendered ''harm'' or ''calamity'' in some contexts; here the Hebrew sets it in direct contrast with ''good.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 오늘 당신 앞에 생명과 선[b], 그리고 죽음과 악을 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 당신 앞에 주었습니다’ 혹은 ‘내가 당신 앞에 놓았습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘악’은 어떤 문맥에서는 ‘해악’ 또는 ‘재앙’으로도 옮길 수 있으나, 여기서는 ‘선’과의 직접 대비를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보세요
  lexicon: HALOT
  rationale: 독자에게 주의를 환기하는 명령형으로, 현대적이면서도 본문의 직접성을 살려 공적 권고체인 「보십시오」를 택했습니다.
- source_word: נָתַתִּי לְפָנֶיךָ
  english_pob_choice: I have set before you
  chosen_korean: 내가 … 당신 앞에 … 두었습니다
  alternatives_korean:
  - 내가 … 당신 앞에 … 주었습니다
  - 내가 … 당신 앞에 … 놓았습니다
  lexicon: HALOT
  rationale: ‘주다’보다 ‘두다/놓다’가 ‘앞에 제시하다’는 배열의 뜻을 더 분명히 드러내므로, 선택지를 펼쳐 놓는 뉘앙스를 살려 번역했습니다.
- source_word: הַטּוֹב
  english_pob_choice: good
  chosen_korean: 선
  alternatives_korean:
  - 좋음
  - 좋은 것
  - 복
  lexicon: HALOT
  rationale: 히브리어의 대구를 살리면서, ‘생명/죽음/악’과 병렬되는 추상명사로서 ‘선’이 가장 간결하고 원문 구조에 가깝습니다.
- source_word: הָרָע
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 해악
  - 재앙
  - 나쁨
  lexicon: HALOT
  rationale: 본문이 ‘선’과 직접 대조를 이루므로, 단순한 불운보다 도덕적·실존적 대립을 드러내는 ‘악’이 POB의 ‘evil’에 가장 잘 대응합니다.
theological_decisions:
- issue: הָרָע의 윤리적 대조 보존
  chosen_reading: ‘악’으로 번역하여 ‘선’과의 직접 대조를 유지합니다.
  alternative_readings:
  - ‘해악’
  - ‘재앙’
  rationale: 문맥상 언약의 선택을 제시하는 구절이므로, 결과적 불행만이 아니라 도덕적·신학적 대립을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 신명기 30:15의 언약적 선택 구조
