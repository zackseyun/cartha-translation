translation:
  language: ko
  text: 그러면 야훼 당신의 하나님께서 이 모든 저주를 당신의 원수들과 당신을 미워하는 자들 위에, 곧 당신을 추격한 자들 위에 내리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
