translation:
  language: ko
  text: 야훼 당신의 하나님께서 이 모든 저주를 당신의 원수들과 당신을 미워하며 당신을 추격한 자들 위에 내리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 맹세’. 신명기에서는 이 말이 흔히 언약의 저주나 제재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: will put
  chosen_korean: 내리실 것입니다
  alternatives_korean:
  - 두실 것입니다
  - 가하실 것입니다
  - 두리실 것입니다
  lexicon: HALOT
  rationale: 저주를 사람들 ‘위에’ 두는 뜻을 한국어로 자연스럽게 살리면서, דין/징벌의 강도를 담아 ‘내리실 것입니다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 주 당신의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, 2인칭 단수 소유 관계는 합쇼체의 ‘당신의’로 유지했습니다.
- source_word: כָּל הָאָלֹת הָאֵלֶּה
  english_pob_choice: all these curses
  chosen_korean: 이 모든 저주
  alternatives_korean:
  - 이 모든 curses
  - 이 모든 맹세
  - 이 모든 재앙
  lexicon: HALOT
  rationale: 신명기의 언약 문맥에서 אָלוֹת은 단순한 ‘맹세’보다 언약적 저주/제재를 가리키므로 ‘저주’가 가장 직접적입니다.
- source_word: אֹיְבֶיךָ וְעַל שֹׂנְאֶיךָ
  english_pob_choice: your enemies and on those who hate you
  chosen_korean: 당신의 원수들과 당신을 미워하는 자들 위에
  alternatives_korean:
  - 당신의 적들과 당신을 미워하는 자들 위에
  - 당신의 원수들과 당신의 미워하는 자들 위에
  lexicon: HALOT
  rationale: אויב와 שׂנא의 대상을 각각 ‘원수들’과 ‘미워하는 자들’로 구분해 병렬성을 살렸고, עַל의 방향성을 ‘위에’로 처리했습니다.
- source_word: אֲשֶׁר רְדָפֽוּךָ
  english_pob_choice: who pursued you
  chosen_korean: 곧 당신을 추격한 자들
  alternatives_korean:
  - 곧 당신을 추격한 자들
  - 곧 당신을 박해한 자들
  - 곧 당신을 쫓아온 자들
  lexicon: HALOT
  rationale: רָדַף은 문맥상 단순 추적보다 적대적 추격이므로, 한국어에서 가장 자연스럽고 강한 ‘추격한’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 직함 ‘주’로 바꾸지 않고 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אָלוֹת의 문맥적 의미
  chosen_reading: 언약적 저주
  alternative_readings:
  - 맹세
  - 임precations
  rationale: 신명기 30장의 흐름은 축복과 저주의 언약 제재를 반복하므로, 본문의 אָלוֹת은 ‘저주’로 읽는 것이 문맥에 부합합니다.
  doctrine_reference: Deuteronomy covenant sanctions context
