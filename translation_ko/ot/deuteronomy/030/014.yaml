theological_decisions:
- issue: ‘그 말씀’의 범위
  chosen_reading: 본문의 דָּבָר를 한 가지 좁은 항목으로 못 박지 않고, 언약적 권면 전체를 가리키는 ‘그 말씀’으로 유지했습니다.
  alternative_readings:
  - 그 일
  - 그 명령
  rationale: 직전 문맥의 율법/명령을 배경으로 하면서도, 본문 자체의 어휘 폭을 보존해 독자가 문맥 속에서 의미를 판단하도록 했습니다.
  doctrine_reference: original-language primacy; preserve lexical breadth without over-specification
- issue: ‘행하실 수 있습니다’의 주체
  chosen_reading: 문장 흐름상 2인칭 일반 진술을 공손한 합쇼체로 처리해, 독자에게 직접 적용되는 권면으로 들리도록 했습니다.
  alternative_readings:
  - 그것을 행할 수 있습니다
  - 그것을 행하도록 하십시오
  rationale: 원문의 목적 진술을 한국어에서 명료하게 전달하면서도, 명령문으로 과도하게 전환하지 않도록 했습니다.
  doctrine_reference: register alignment for modern formal-polite Korean
