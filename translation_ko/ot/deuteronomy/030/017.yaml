  - 멀어지고
  lexicon: HALOT
  rationale: 이 동사는 수동적으로 잘못된 방향으로 밀려나는 뉘앙스를 가지므로, 우상숭배로 이끄는 유혹의 성격을 드러내는 표현으로 옮겼습니다.
- source_word: וְהִשְׁתַּחֲוִיתָ לֵאלֹהִים אֲחֵרִים וַעֲבַדְתָּם
  english_pob_choice: and bow down to other gods and serve them
  chosen_korean: 다른 신들에게 절하며 그들을 섬기면
