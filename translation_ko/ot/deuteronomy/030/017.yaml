translation:
  language: ko
  text: 그러나 만일 네 마음이 돌아서고, 네가 듣지 않으며, 유혹되어 다른 신들에게 절하며 그들을 섬기면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유혹되어’는 원문의 수동적 이탈 뉘앙스를 살린 번역입니다. 원문 동사는 ‘끌려가다/치우쳐 가다’의 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣지 않다’는 언약 문맥에서 ‘순종하지 않다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
