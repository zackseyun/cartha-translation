  lexicon: HALOT
  rationale: ‘절하다’는 원문의 몸을 굽혀 경배하는 행위를 직접 반영하며, ‘다른 신들’은 신명기의 정형적 우상숭배 표현을 그대로 살립니다.
theological_decisions:
- issue: 우상숭배로 향하는 내적·외적 타락의 연쇄
  chosen_reading: 마음의 방향 전환, 듣지 않음, 유혹됨, 절함, 섬김의 순서를 그대로 유지했습니다.
  alternative_readings:
  - ‘듣지 않다’를 ‘순종하지 않다’로 명시하기
  - ‘유혹되어’를 더 강한 ‘끌려가다’로 옮기기
  rationale: 본문은 언약 불순종의 진행을 단계적으로 제시하므로, 해석을 덧붙이기보다 연쇄 구조를 보존하는 것이 source-direct합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
