  rationale: ‘마음’에 대한 פנֶה의 방향 전환을 한국어 관용으로 자연스럽게 옮기되, 언약적 이탈의 의미가 살아나도록 ‘돌아서다’를 택했습니다.
- source_word: וְנִדַּחְתָּ
