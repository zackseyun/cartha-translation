source:
  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
  footnotes:
  - marker: a
    text: Or 'is not beyond you' or 'is not hidden from you.' The Hebrew verb can carry the sense of being extraordinary, inaccessible, or beyond one's grasp.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 오늘 너희에게 명령하는 이 계명이 너희에게 너무 어려운 것도 아니고, 멀리 있는 것도 아니기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게서 벗어난 것이 아니다’ 또는 ‘너희에게 숨겨진 것이 아니다.’ 히브리어 동사는 놀랍거나, 접근할 수 없거나, 손에 닿지 않는다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְוָה הַזֹּאת
  english_pob_choice: this commandment
  chosen_korean: 이 계명
  alternatives_korean:
  - 이 명령
  - 이 가르침
  lexicon: HALOT
  rationale: מִצְוָה는 율법적·언약적 문맥에서 ‘계명’이 가장 자연스럽고, POB의 ‘commandment’도 그 뜻을 따릅니다.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  english_pob_choice: that I am commanding you today
  chosen_korean: 내가 오늘 너희에게 명령하는
  alternatives_korean:
  - 내가 오늘 너에게 명령하는
  - 내가 오늘 너희에게 명하는
  lexicon: HALOT
  rationale: 현재분사형의 지속적·즉시적 뉘앙스를 살려 ‘명령하는’으로 옮기고, 청중 전체를 향한 모세의 호소이므로 복수 ‘너희’로 처리했습니다.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  english_pob_choice: is not too difficult for you
  chosen_korean: 너희에게 너무 어려운 것도 아니고
  alternatives_korean:
  - 너희에게 숨겨진 것도 아니고
  - 너희 능력 밖의 것도 아니고
  - 너희에게서 먼 것도 아니고
  lexicon: HALOT
  rationale: פלא의 의미 범위가 ‘숨겨짐/기이함/감당 불가’까지 아우르지만, 문맥상 12–14절의 접근 가능성을 살려 ‘너무 어려운’으로 옮겼습니다.
- source_word: וְלֹא רְחֹקָה הִוא
  english_pob_choice: nor is it far away
  chosen_korean: 멀리 있는 것도 아니기 때문입니다
  alternatives_korean:
  - 멀리 떨어진 것도 아니기 때문입니다
  - 먼 곳에 있는 것도 아니기 때문입니다
  lexicon: HALOT
  rationale: רָחוֹק의 공간적 거리를 한국어의 자연스러운 ‘멀리 있는’으로 옮겨, 앞 구절과 병렬 구조를 유지했습니다.
theological_decisions:
- issue: לֹא נִפְלֵאת의 신학적 긴장 보존
  chosen_reading: ‘너희에게 너무 어려운 것도 아니고’로 옮겨, 계명의 접근 가능성을 드러내되 인간의 자력 가능성에 대한 교리를 부가하지 않았습니다.
  alternative_readings:
  - ‘너희에게 숨겨진 것도 아니고’
  - ‘너희 능력 밖의 것도 아니고’
  rationale: 본문은 언약 백성에게 주어진 계명의 가깝고 분명한 성격을 강조하므로, 후대의 능력론 논쟁으로 확장하지 않고 본문 자체의 초점을 유지했습니다.
  doctrine_reference: 본문 고유의 접근성 강조를 유지하고, 인간 능력에 대한 별도 교리화는 유보합니다.
