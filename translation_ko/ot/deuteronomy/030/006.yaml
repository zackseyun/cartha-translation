id: DEU.30.6
reference: Deuteronomy 30:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
  footnotes:
  - marker: a
    text: Or 'the heart of your descendants.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'circumcise your heart'—a metaphor for inward transformation and covenant devotion.
    reason: cultural_note
  - marker: c
    text: Or 'with all your life' / 'with all your self' for 'with all your soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님께서 당신의 마음과 당신의 후손의 마음을 할례하셔서, 당신이 온 마음과 온 영혼으로 야훼 당신의 하나님을 사랑하게 하시며, 그리하여 당신이 살아가게 하실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 후손들의 마음’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘마음을 할례하다’는 내면의 변화와 언약적 헌신을 가리키는 은유입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘온 생명으로’ / ‘온 자기로’에 해당할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  english_pob_choice: will circumcise
  chosen_korean: 할례하셔서
  alternatives_korean:
  - 베어 내셔서
  - 제거하셔서
  lexicon: HALOT
  rationale: 히브리어 מול의 핵심 이미지를 그대로 살리기 위해 한국어에서도 ‘할례하다’를 유지했습니다. 마음에 대한 은유이지만, 언약적 변화를 드러내는 표지를 보존하는 것이 중요합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 하나님의 고유 이름을 직역 관행대로 ‘야훼’로 옮겨, 본문이 단순한 호칭이 아니라 언약적 이름을 사용한다는 점을 드러냈습니다.
- source_word: לְבָבְךָ / לְבַב זַרְעֶךָ
  english_pob_choice: your heart / the heart of your offspring
  chosen_korean: 당신의 마음 / 당신의 후손의 마음
  alternatives_korean:
  - 당신의 심장 / 당신의 자손의 마음
  - 당신의 내면 / 당신의 후손들의 마음
  lexicon: HALOT
  rationale: לֵבָב의 내적 인격 의미를 한국어 ‘마음’으로 자연스럽게 살렸고, זֶרַע는 ‘후손’으로 옮겨 집합적 의미를 유지했습니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: your soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자기
  lexicon: HALOT
  rationale: 이 고정된 신명기적 사랑의 공식에서는 ‘마음과 영혼’이 본문의 총체적 헌신을 가장 잘 전달합니다. 영어 POB의 ‘soul’ 선택을 따라 신학적 울림을 보존했습니다.
- source_word: לְמַעַן חַיֶּיךָ
  english_pob_choice: so that you may live
  chosen_korean: 그리하여 당신이 살아가게 하실 것입니다
  alternatives_korean:
  - 그래서 당신이 살게 하실 것입니다
  - 당신의 생명이 계속되게 하실 것입니다
  lexicon: HALOT
  rationale: לְמַעַן의 목적·결과를 한국어의 자연스러운 미래 결과로 옮겼습니다. 단순 생존보다 언약 안에서의 삶의 지속을 드러내기 위해 ‘살아가다’를 택했습니다.
theological_decisions:
- issue: 마음의 할례 은유 유지
  chosen_reading: ‘할례하셔서’로 직역에 가까운 은유를 본문에 유지했습니다.
  alternative_readings:
  - 마음을 바꾸셔서
  - 마음을 깨끗하게 하셔서
  rationale: 본문은 내적 변화와 언약 충성을 할례 이미지로 표현합니다. 이를 풀어 쓰면 원문의 신학적 긴장이 약해지므로 은유를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘영혼’의 선택
  chosen_reading: נֶפֶשׁ을 ‘영혼’으로 렌더링했습니다.
  alternative_readings:
  - 생명
  - 자기
  rationale: 이 구절은 마음과 영혼의 총체적 사랑을 요구하는 전통적 공식이므로, 너무 설명적으로 풀지 않고 본문의 울림을 유지했습니다.
  doctrine_reference: Translation philosophy §§3, 5, 6
