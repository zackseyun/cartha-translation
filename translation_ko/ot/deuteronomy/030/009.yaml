revisions:
- from: 그러면 야훼 당신의 하나님께서 당신의 손으로 하는 모든 일과 당신의 태의 열매와 당신의 가축의 새끼와 당신의 땅의 소산을 복되게 하셔서 넉넉하게 하실 것입니다. 이는 야훼께서 다시 당신을 기뻐하시어 복되게 하실 것이기 때문입니다. 그가 당신의 조상들을 기뻐하신 것과 같이 말입니다.[a][b]
  to: 당신의 하나님 야훼께서는 당신의 손으로 하는 모든 일과 당신의 태의 열매[a]와 당신의 가축과 당신의 땅의 소산에서 당신을 풍성하게 하셔서 복을 누리게 하실 것입니다. 야훼께서는 당신에게 복을 베푸시려고 다시 당신을 두고 기뻐하시기를, 당신의 조상들[b]을 두고 기뻐하신 것같이 하실 것입니다.
  rationale: 수정문은 יתר 히필을 ‘풍성하게 하시다’로, 세 병렬 항목의 전치사 בְ를 ‘~에서’로 반영했습니다. 두 번의 לְטוֹבָה/לְטוֹב은 한국어 문맥에서 ‘복을 누리게 하시다’와 ‘복을 베푸시려고’로 각각 자연스럽게 풀되, 본문에 없던 ‘기뻐하시어 복되게 하다’라는 인과 관계는 제거했습니다. ‘다시’는 יָשׁוּב의 갱신 의미를 보존하며, 비교절도 야훼의 기쁨이라는 동일 술어에 직접 연결했습니다.
