source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
  footnotes:
  - marker: a
    text: Or 'will give you plenty' / 'will prosper you'; the Hebrew verb carries the sense of causing abundance or surplus.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your fathers'; that is, the forefathers or ancestors of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 야훼 당신의 하나님께서 당신의 손으로 하는 모든 일과 당신의 태의 열매와 당신의 가축의 새끼와 당신의 땅의 소산을 복되게 하셔서 넉넉하게 하실 것입니다. 이는 야훼께서 다시 당신을 기뻐하시어 복되게 하실 것이기 때문입니다. 그가 당신의 조상들을 기뻐하신 것과 같이 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 태의 열매’는 직역적 이미지입니다. 의미상 ‘자손’으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들’은 히브리어 ‘아버지들’에 해당하며, 여기서는 이스라엘의 족장들과 선조들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  english_pob_choice: will make you abound
  chosen_korean: 넉넉하게 하실 것입니다
  alternatives_korean:
  - 풍성하게 하실 것입니다
  - 풍족하게 하실 것입니다
  - 많이 얻게 하실 것입니다
  lexicon: HALOT
  rationale: 히필형 יתר는 ‘넘치게 하다, 많게 하다’의 사역 의미를 가지므로, 결과를 직접 드러내는 ‘넉넉하게 하다’로 옮겨 풍성한 증가의 뜻을 살렸습니다.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  english_pob_choice: in all the work of your hand
  chosen_korean: 당신의 손으로 하는 모든 일
  alternatives_korean:
  - 당신 손의 모든 일
  - 당신이 하는 모든 일
  - 당신의 모든 수고
  lexicon: HALOT
  rationale: 히브리어 관용구의 손(단수)은 실제 노동과 수행을 가리키므로, 한국어에서도 ‘손으로 하는’이라고 풀어 구체성과 관용성을 함께 살렸습니다.
- source_word: בִּפְרִי בִטְנְךָ / בְהֶמְתְּךָ / אַדְמָתְךָ
  english_pob_choice: the fruit of your womb / your livestock / the fruit of your ground
  chosen_korean: 당신의 태의 열매 / 당신의 가축의 새끼 / 당신의 땅의 소산
  alternatives_korean:
  - 당신의 자손 / 당신의 가축 / 당신의 땅의 열매
  - 태의 열매 / 가축 / 땅의 소산
  - 당신의 몸의 열매 / 가축 떼 / 땅의 소출
  lexicon: HALOT
  rationale: 세 개의 병렬 축복 항목을 원문의 이미지대로 유지했습니다. ‘태의 열매’는 출산의 비유를 살리고, בהמה는 단순한 ‘가축’, אדמה는 경작지의 결실을 뜻하므로 ‘땅의 소산’으로 옮겼습니다.
- source_word: לְטוֹבָה / לְטוֹב
  english_pob_choice: for good / for good
  chosen_korean: 복되게
  alternatives_korean:
  - 좋게
  - 선하게
  - 당신에게 유익하게
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘좋음’이 아니라 언약적 복과 유익을 가리키므로, 반복되는 לשׂוּשׂ와 결합해 자연스러운 결과 동사인 ‘복되게 하다’로 묶었습니다.
- source_word: יָשׁוּב ... לָשׂוּשׂ עָלֶיךָ
  english_pob_choice: will again rejoice over you
  chosen_korean: 다시 당신을 기뻐하시어
  alternatives_korean:
  - 다시 당신을 기뻐하실 것이며
  - 다시 당신 위에 기뻐하시어
  - 다시 당신을 즐거워하시어
  lexicon: HALOT
  rationale: שׂוּשׂ는 기쁨의 환호를 나타내지만 한국어에서는 ‘기뻐하시어’가 가장 자연스럽고, 뒤의 결과 절과도 잘 이어집니다.
- source_word: כַּאֲשֶׁר שָׂשׂ עַל אֲבֹתֶיךָ
  english_pob_choice: just as he rejoiced over your fathers
  chosen_korean: 그가 당신의 조상들을 기뻐하신 것과 같이 말입니다
  alternatives_korean:
  - 그가 당신의 아버지들을 기뻐하신 것과 같이 말입니다
  - 그가 당신의 조상들 위에 기뻐하신 것과 같이 말입니다
  lexicon: HALOT
  rationale: אָבוֹת는 문맥상 족장들을 포함한 ‘조상들’을 가리키므로 한국어에서는 오해를 줄이기 위해 ‘조상들’로 옮기되, 원문의 남성 복수 집합을 해치지 않도록 유지했습니다.
theological_decisions:
- issue: 야훼의 이름과 인격적 주어 처리
  chosen_reading: ‘야훼’와 함께 존대 능동형(‘하실 것입니다’)으로 번역해 언약적 주도권과 인격성을 살렸습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 처리
  - 무표지 3인칭 서술로 처리
  rationale: 본문은 יְהוָה를 직접 사용하므로 고유명 ‘야훼’를 유지하는 것이 source-direct하며, 축복의 주체가 하나님이심을 한국어 문장에서도 분명히 해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אֲבֹתֶיךָ의 성별-정확성
  chosen_reading: 메인 텍스트는 ‘조상들’로 옮겼습니다.
  alternative_readings:
  - 당신의 아버지들
  - 당신의 선조들
  rationale: 한국어의 ‘조상들’은 족장 전승을 포함하는 자연스러운 집합명사로서, 원문의 역사적 지시를 과도하게 좁히지 않으면서도 현대 독자에게 오해를 줄입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
