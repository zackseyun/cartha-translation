  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
  footnotes:
  - marker: a
    text: Or "turn back"; in context this can also carry the sense of covenantal repentance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew "listen to the voice of the LORD"; the idiom often implies obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 돌아와[a] 야훼의 음성에 귀를 기울이고[b], 내가 오늘 네게 명령하는 그의 모든 계명을 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오다’는 문맥상 언약적 회심의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼의 음성을 듣다’이며, 이 관용구는 종종 순종의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And you
  chosen_korean: 그리고 너희는
  alternatives_korean:
  - 그리고 너는
  - 그런즉 너희는
  lexicon: HALOT
  rationale: 히브리어의 2인칭 단수형을 살리되, 문맥상 이스라엘 공동체를 향한 언약적 권면이므로 한국어는 자연스러운 집단 호칭으로 풀었습니다.
- source_word: תָשׁוּב
  english_pob_choice: shall return
  chosen_korean: 돌아와
  alternatives_korean:
  - 돌아올 것입니다
  - 돌이켜
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다’를 살리면서, 문맥상 언약적 회복의 뉘앙스가 드러나도록 과도한 해석어는 피했습니다.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  english_pob_choice: listen to the voice of Yahweh
  chosen_korean: 야훼의 음성에 귀를 기울이고
  alternatives_korean:
  - 야훼의 음성을 들으며
  - 야훼께 순종하고
  lexicon: HALOT
  rationale: בְּקוֹל을 직역하면 ‘음성에/소리에’이므로 ‘귀를 기울이다’로 옮겨 히브리 관용구를 드러냈습니다. 동시에 문맥상 순종의 함의도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기 본문의 신명은 ‘야훼’로 옮겨, 인격적 고유명으로서의 특성을 보존했습니다.
- source_word: וְעָשִׂיתָ אֶת כָּל מִצְוֺתָיו
  english_pob_choice: you shall do all his commandments
  chosen_korean: 그의 모든 명령을 행할 것입니다
  alternatives_korean:
  - 그의 모든 계명을 지킬 것입니다
  - 그의 모든 명령들을 할 것입니다
  lexicon: HALOT
  rationale: עָשָׂה는 기본적으로 ‘행하다/하다’이므로 ‘행하다’로 가까이 옮겼고, מִצְוֺת는 신명기의 언약적·법적 문맥을 살리되 한국어에서는 ‘명령’이 자연스럽습니다.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  english_pob_choice: that I am commanding you today
  chosen_korean: 내가 오늘 너에게 명령하는
  alternatives_korean:
  - 내가 오늘 너에게 명하는
  - 내가 오늘 너에게 명령하고 있는
  lexicon: HALOT
  rationale: 분사형 מְצַוְּךָ의 지속적·현재적 힘을 살려 ‘명령하는’으로 옮기고, ‘오늘’을 유지해 신명기의 현재적 언약 강조를 보존했습니다.
theological_decisions:
- issue: שׁוּב를 회개로 명시할지 여부
  chosen_reading: 돌아오다/돌아와
  alternative_readings:
  - 회개하다
  - 돌이키다
  rationale: 본문은 회복과 순종의 맥락에 있지만, 히브리어 자체는 ‘회개’를 명시하지 않습니다. 따라서 ‘돌아오다’로 두어 언약적 귀환과 회개의 긴장을 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: שׁמע בְּקוֹל을 곧바로 ‘순종하다’로 풀지 여부
  chosen_reading: 야훼의 음성에 귀를 기울이고
  alternative_readings:
  - 야훼에게 순종하고
  - 야훼의 음성을 듣고
  rationale: 이 관용구는 순종을 함의하지만, 바로 뒤 절에서 ‘그의 모든 명령을 행하다’가 이어지므로 첫 동사군은 더 투명하게 유지했습니다. 이렇게 하면 두 표현의 관계가 보존됩니다.
  doctrine_reference: Translation philosophy §1 and §3
