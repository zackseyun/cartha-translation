source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֥עַ בְּ/קֹל֖/וֹ וּ/לְ/דָבְקָה ב֑/וֹ כִּ֣י ה֤וּא חַיֶּ֨י/ךָ֙ וְ/אֹ֣רֶךְ יָמֶ֔י/ךָ לָ/שֶׁ֣בֶת עַל הָ/אֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ/תֵ֥ת לָ/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
  footnotes:
  - marker: a
    text: Or 'by obeying his voice'; the Hebrew idiom 'listen to his voice' often includes the sense of heeding or obeying.
    reason: lexical_alternative
  - marker: b
    text: Or 'and by clinging to him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to your ancestors'; Hebrew 'fathers' is retained because the text immediately names Abraham, Isaac, and Jacob.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와 당신의 하나님을 사랑하고, 그의 목소리를 듣고, 그에게 붙어 있으십시오. 그분은 당신의 생명이시며 당신의 날들의 길이이시니, 당신의 조상들인 아브라함과 이삭과 야곱에게 주시겠다고 여호와께서 맹세하신 땅에 당신이 거주하게 하시려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 목소리를 듣고’는 히브리어 관용구로서 ‘그의 목소리에 순종하고’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘붙어 있으십시오’는 ‘그에게 매달리다/그에게 충실히 따르다’의 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  english_pob_choice: by loving
  chosen_korean: 사랑하고
  alternatives_korean:
  - 사랑함으로
  - 사랑하는 것으로
  lexicon: HALOT
  rationale: לְ+부정사구가 앞 문맥의 선택/순종을 이어 주는 수단·방식 표현이므로, 한국어에서는 자연스러운 연결형 동사로 옮겼습니다.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  english_pob_choice: by listening to his voice
  chosen_korean: 그의 목소리를 듣고
  alternatives_korean:
  - 그의 목소리에 순종하고
  - 그의 음성을 들으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 기본 이미지를 살리되, 청종의 함의를 문맥 속에 남기기 위해 직설적으로 ‘듣다’로 옮겼습니다.
- source_word: וּלְדָבְקָה בוֹ
  english_pob_choice: and by holding fast to him
  chosen_korean: 그에게 붙어 있으십시오
  alternatives_korean:
  - 그에게 굳게 매달리십시오
  - 그에게 밀착하십시오
  lexicon: HALOT
  rationale: דבק의 언약적 결속 뉘앙스를 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘붙어 있다’를 택했습니다.
- source_word: אֲדָמָה
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 토지
  - 땅덩이
  lexicon: HALOT
  rationale: 약속의 지리적·언약적 의미를 유지하기 위해 ‘땅’으로 번역했습니다.
theological_decisions:
- issue: יהוה의 표기와 구약 인용의 신명칭 처리
  chosen_reading: 본문과 인용 맥락 모두에서 여호와의 언약적 자기계시를 드러내는 표기로 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 신명기 본문 자체이므로 히브리어 신명칭을 한국어로 표기할 때 일반 독자가 즉시 인지하는 형태를 택했습니다.
  doctrine_reference: 번역은 본문 이해를 해치지 않는 범위에서 프로젝트 표준과 수용성을 균형 있게 반영해야 합니다.
- issue: ‘그분은 당신의 생명이시며’의 지시 대상
  chosen_reading: ‘그분’은 앞의 ‘여호와 당신의 하나님’을 가리킵니다.
  alternative_readings:
  - 순종의 행위 전체를 가리킨다고 볼 수도 있습니다.
  rationale: 가장 가까운 선행사는 여호와이므로, 삶의 근원이 하나님 자신이라는 신명기의 신학을 분명히 살렸습니다.
  doctrine_reference: 문법적으로 가능한 추상화보다 직접적 인격 지시를 우선하되, 본문의 신학을 과잉 해석하지 않습니다.
