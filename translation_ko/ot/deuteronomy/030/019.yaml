  to: 오늘 내가 하늘과 땅을[a] 너희를 거슬러 증인으로 세웁니다[b]. 내가 네 앞에 생명과 죽음, 복과 저주를 두었습니다. 생명을 택하십시오. 그러면 너와 네 자손[c]이 살 것입니다.
