id: DEU.30.19
reference: Deuteronomy 30:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
  footnotes:
  - marker: a
    text: Or 'the heavens and the earth.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew has a legal/covenantal sense: ''I call heaven and earth to witness against you today.'''
    reason: cultural_note
  - marker: c
    text: Or 'your descendants'; Hebrew 'your seed/offspring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 오늘 너희에게 하늘과 땅을 증인으로 불러 세우노라. 내가 네 앞에 생명과 죽음, 복과 저주를 두었으니, 생명을 택하십시오. 그리하면 너와 네 자손이 살 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들과 땅’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 언약적·법정적 의미를 지닙니다. 곧 ‘내가 오늘 너희에게 하늘과 땅을 증인으로 불러 세운다’는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘네 자손들’; 히브리어는 ‘네 씨/자손’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  english_pob_choice: I call heaven and earth to witness against you
  chosen_korean: 하늘과 땅을 증인으로 불러 세우노라
  alternatives_korean:
  - 하늘과 땅을 너희에게 증언합니다
  - 하늘과 땅을 증인으로 삼아 너희에게 경고합니다
  lexicon: HALOT
  rationale: עוּד의 히필은 단순한 ‘증언’보다 법정적·언약적 차원의 증인 소환을 가리키므로, 한국어도 ‘증인으로 불러 세우다’로 그 형식을 살렸습니다.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  english_pob_choice: heaven and earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 하늘과 땅들
  lexicon: HALOT
  rationale: 히브리어의 전형적인 전체성 표현을 한국어의 자연스러운 대응인 ‘하늘과 땅’으로 옮겨, 증인 공식의 관용성을 유지했습니다.
- source_word: הַחַיִּים וְהַמָּוֶת
  english_pob_choice: life and death
  chosen_korean: 생명과 죽음
  alternatives_korean:
  - 삶과 죽음
  - 생과 사
  lexicon: HALOT
  rationale: 언약적 선택의 두 결과를 대조하는 기본 어휘이므로, 원문의 추상성을 살려 ‘생명과 죽음’으로 옮겼습니다.
- source_word: נָתַתִּי לְפָנֶיךָ
  english_pob_choice: I have set before you
  chosen_korean: 내가 네 앞에 ... 두었으니
  alternatives_korean:
  - 내가 네 앞에 ... 놓았으니
  - 내가 네 앞에 ... 제시하였으니
  lexicon: HALOT
  rationale: ‘앞에 두다’는 선택지를 제시하는 문맥에 맞고, 한국어에서도 직접적이며 자연스럽습니다.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  english_pob_choice: blessing and curse
  chosen_korean: 복과 저주
  alternatives_korean:
  - 축복과 저주
  - 복과 저주의 선택
  lexicon: HALOT
  rationale: ‘축복’도 가능하지만, 언약적 대비를 간결하게 살리는 기본 대응으로 ‘복과 저주’를 택했습니다.
- source_word: וּבָחַרְתָּ
  english_pob_choice: Choose life
  chosen_korean: 생명을 택하십시오
  alternatives_korean:
  - 생명을 선택하십시오
  - 생명을 고르십시오
  lexicon: HALOT
  rationale: 명령형의 직접성을 살리면서도 현대 한국어에서 가장 자연스러운 공적 어조인 ‘택하십시오’를 사용했습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 후손
  - 네 씨
  - 네 자녀들
  lexicon: HALOT
  rationale: זֶרַע의 언약적 연속성을 한국어에서 가장 넓고 이해하기 쉬운 ‘자손’으로 옮겼습니다.
theological_decisions:
- issue: 언약 소송의 법정적 음색 보존
  chosen_reading: 이 구절은 단순한 권고가 아니라 하늘과 땅을 증인으로 세우는 언약 소송의 형식으로 읽고 번역했습니다.
  alternative_readings:
  - 일반적인 경고문으로 완화해 번역
  - 도덕적 권면으로 평탄화
  rationale: 원문은 증인 소환과 선택 제시를 통해 이스라엘 앞에 언약적 책임을 선명하게 드러내므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: '신명기 언약 구조 / Translation philosophy #1'
- issue: 2인칭 단수의 대표성 유지
  chosen_reading: 히브리어 2인칭 단수에 맞춰 ‘너’와 ‘네’를 유지하되, 합쇼체 명령형 ‘택하십시오’를 사용해 한국어 독자에게 자연스럽게 들리게 했습니다.
  alternative_readings:
  - 너희
  - 너희들
  rationale: 모세가 이스라엘 전체를 대표하여 말하는 구조를 살리면서도, 현대 한국어의 공적 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 'Translation philosophy #4'
