revisions:
- from: 그것은 하늘에 있지 않습니다. 그러므로 여러분은 「누가 우리를 위해 하늘로 올라가 그것을 우리에게 가져와서 우리에게 들려주어 우리가 그것을 행하게 하겠는가?」라고 말해서는 안 됩니다.[a]
  to: 그것은 여러분이 「누가 우리를 위하여 하늘로 올라가 그것을 가져와, 우리가 그것을 행하도록 우리에게 들려주겠는가?」라고 말할 만큼 하늘에 있는 것이 아닙니다.[a]
  rationale: 원문의 ‘하늘에 있지 않다—말하기를’ 구문을 한국어의 ‘...라고 말할 만큼 하늘에 있는 것이 아닙니다’로 재구성하여, 가정적 اعتراض의 기능을 보존했습니다. 또한 마지막 절을 ‘우리가 그것을 행하도록’으로 옮겨 목적 관계와 행위 주체를 바로잡았습니다. 각 대명사의 반복은 한국어 문맥상 필요한 범위에서 줄였으며, 각주에는 보다 직역적인 사역 표현을 제시했습니다.
