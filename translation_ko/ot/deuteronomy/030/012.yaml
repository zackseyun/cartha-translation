id: DEU.30.12
reference: Deuteronomy 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
  footnotes:
  - marker: a
    text: Or 'Who will ascend for us to heaven and take it for us and cause us to hear it, that we may do it?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 여러분이 「누가 우리를 위하여 하늘로 올라가 그것을 가져와, 우리가 그것을 행하도록 우리에게 들려주겠는가?」라고 말할 만큼 하늘에 있는 것이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 우리를 위하여 하늘로 올라가 그것을 우리를 위하여 가져다가 우리에게 그것을 듣게 하여 우리가 그것을 행하도록 하겠는가?’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא ... הִוא
  english_pob_choice: It is not in heaven
  chosen_korean: 그것은 하늘에 있지 않습니다
  alternatives_korean:
  - 그것은 하늘에 있는 것이 아닙니다
  - 그것은 하늘에 있지 않습니다
  lexicon: HALOT
  rationale: 명령/말씀이 멀리 있지 않다는 문맥을 살리면서, 한국어에서는 ‘하늘에 있지 않습니다’가 가장 자연스럽고 간결합니다.
- source_word: בַשָּׁמַיִם
  english_pob_choice: in heaven
  chosen_korean: 하늘에
  alternatives_korean:
  - 하늘들에
  - 하늘나라에
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 접근 불가능한 하늘의 영역을 가리키므로, 표준 한국어에서는 ‘하늘에’가 적절합니다.
- source_word: לֵאמֹר
  english_pob_choice: that you should say
  chosen_korean: 말해서는 안 됩니다
  alternatives_korean:
  - 이라고 말해서는 안 됩니다
  - 말하도록 되어 있지 않습니다
  lexicon: HALOT
  rationale: 가정적 반응을 도입하는 기능을 한국어에서 직접적으로 풀어, 앞절과 이어지는 금지의 의미를 분명하게 했습니다.
- source_word: מִי יַעֲלֶה לָּנוּ ... וְיַשְׁמִעֵנוּ אֹתָהּ
  english_pob_choice: Who will go up for us ... and make us hear it
  chosen_korean: 누가 우리를 위해 하늘로 올라가 그것을 우리에게 가져와서 우리에게 들려주어
  alternatives_korean:
  - 누가 우리 대신 하늘로 올라가 그것을 우리에게 가져와서 우리에게 들려주어
  - 누가 우리를 위해 하늘로 올라가 그것을 우리에게 전해 주어
  lexicon: HALOT
  rationale: ‘올라가’는 עלה의 상향 운동을 살리고, ‘들려주어’는 히필형 ‘듣게 하다’의 사역적 의미를 반영합니다. POB의 ‘make us hear it’에 맞추어 ‘전해 주어’보다 덜 해석적으로 유지했습니다.
- source_word: וְנַעֲשֶׂנָּה
  english_pob_choice: so that we may do it
  chosen_korean: 우리가 그것을 행하게
  alternatives_korean:
  - 우리가 그것을 행하도록
  - 우리가 그것을 하게
  lexicon: HALOT
  rationale: עשה를 단순히 ‘하다’보다, 명령을 수행하는 의미가 분명한 ‘행하다’로 옮겼습니다. 목적/결과 관계는 뒤의 구조로 자연스럽게 드러납니다.
theological_decisions:
- issue: ‘하늘’의 신학적 거리감과 계시의 접근성
  chosen_reading: 율법/말씀이 인간의 불가능한 탐색 대상이 아니라 가까이 주어진 현실이라는 점을 강조했습니다.
  alternative_readings:
  - 단순한 지리적 진술로만 읽는 방식
  - 추상적으로 ‘불가능한 곳에 있다’고 완화하는 방식
  rationale: 문맥상 이 구절은 계명이 원거리 신비가 아니라 순종 가능한 말씀임을 말하므로, ‘하늘에 있지 않습니다’라는 직설을 유지했습니다.
  doctrine_reference: 신명기 30:11-14의 언약 순종 가능성
- issue: 사역동사 ‘make us hear’의 처리
  chosen_reading: ‘들려주어’로 옮겨, 외부에서 와서 말씀을 전달해 주는 사역적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘우리에게 들려주어’의 완전 직역
  - ‘우리에게 선포하여’로의 해석적 정리
  rationale: 히브리어 히필의 원인적 의미를 지키되, 한국어 문장 안에서 자연스럽게 읽히도록 조정했습니다.
  doctrine_reference: 언약 말씀의 전달성과 청종
