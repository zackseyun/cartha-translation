    rationale: ‘우리가 행하게 하겠습니까’는 וְנַעֲשֶׂנָּה(“우리가 그것을 행하도록/행하게”)보다 ‘누가 우리를 행하게 만들겠는가’로 읽히기 쉽습니다. 목적 관계를 명시해야 합니다.
