  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
  footnotes:
  - marker: a
    text: Or 'across the sea' / 'on the other side of the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bring it to us' for 'get it for us'; the Hebrew verb literally means 'take,' but in context it implies obtaining and bringing within reach.
    reason: lexical_alternative
  - marker: c
    text: Literally 'make us hear it,' a causative expression meaning to cause someone to hear, that is, to declare or explain it to them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그것은 바다 건너편에 있지 않으므로, 여러분이 ‘누가 우리를 위하여 바다 건너편으로 건너가서 그것을 우리를 위하여 가져와 우리에게 그것을 들려주어 우리가 그것을 행하도록 하겠습니까?’ 하고 말할 것이 아닙니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 건너편에’는 문자적으로 바다의 저편에 있음을 뜻합니다. 문맥에 따라 ‘바다 너머에’ 또는 ‘바다를 건너서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가져와’는 히브리어로 문자적으로는 ‘취하여’라는 뜻입니다. 여기서는 그것을 얻어 우리에게 가져오는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘들려주어’는 히브리어 ‘듣다’의 사역형을 반영합니다. 곧 우리에게 듣게 하다, 즉 선포하거나 설명하여 알게 하다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  english_pob_choice: beyond the sea / across the sea
  chosen_korean: 바다 건너편에
  alternatives_korean:
  - 바다 너머에
  - 바다 건너에
  lexicon: HALOT
  rationale: אֶל עֵבֶר / מֵעֵבֶר의 공간적 ‘저편’ 의미를 살려, 자연스러운 한국어로는 ‘바다 건너편에’가 가장 직접적입니다.
- source_word: לֵאמֹר
  english_pob_choice: that you should say
  chosen_korean: 여러분이 이렇게 말해야 할 이유가 없습니다
  alternatives_korean:
  - 말하기를
  - 말해야 한다고
  lexicon: HALOT
  rationale: 문맥상 가상의 반론을 도입하는 표현이므로, 단순 인용이 아니라 ‘그런 말을 해야 할 이유/상황이 없다’는 수사적 기능을 드러냈습니다.
- source_word: וְיִקָּחֶהָ לָּנוּ
  english_pob_choice: and get it for us
  chosen_korean: 그것을 우리에게 가져오고
  alternatives_korean:
  - 그것을 우리를 위해 구해오고
  - 그것을 우리를 위해 가져오고
  lexicon: HALOT
  rationale: 히브리어 ‘취하다/가져오다’의 맥락상 의미를 따라, 단순히 소유를 취한다기보다 손에 닿게 ‘가져오다’로 옮겼습니다.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  english_pob_choice: and make us hear it
  chosen_korean: 우리로 하여금 그것을 듣게 하여
  alternatives_korean:
  - 그것을 우리에게 들려주어
  - 우리에게 그것을 알게 하여
  lexicon: HALOT
  rationale: 히필의 사역/인과적 뉘앙스를 살리면서도, 한국어에서는 ‘듣게 하다’가 원문의 구조를 가장 직접적으로 반영합니다.
- source_word: וְנַעֲשֶׂנָּה
  english_pob_choice: so that we may do it
  chosen_korean: 우리가 행하게 하겠습니까
  alternatives_korean:
  - 우리가 그것을 행하게 되겠습니까
  - 우리가 그것을 행할 수 있겠습니까
  lexicon: HALOT
  rationale: 결과절의 목적성을 살려 ‘행하다’로 옮기되, 앞 문장 전체와 함께 수사적 질문 구조가 되도록 마무리했습니다.
theological_decisions:
- issue: 수사적 질문의 전달 방식
  chosen_reading: 본문은 실제 가능성을 묻는 질문이 아니라, 율법의 접근 가능성을 강조하는 반문으로 읽었습니다.
  alternative_readings:
  - 단순 정보 질문
  - 수사성을 약화한 평서적 진술
  rationale: 문맥상 ‘누가 건너가서…?’는 불가능성을 강조하는 반문이므로, 한국어도 질문 형식을 유지해 그 긴장을 보존했습니다.
  doctrine_reference: 신명기 30:11-14 문맥
