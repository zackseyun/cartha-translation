revisions:
- from: 그리고 그것은 바다 건너편에 있지 않습니다. 그래서 여러분이 이렇게 말해야 할 이유가 없습니다. ‘누가 우리를 위해 바다 건너편으로 건너가서 그것을 우리에게 가져오고, 우리로 하여금 그것을 듣게 하여 우리가 행하게 하겠습니까?’[a][b][c]
  to: 또한 그것은 바다 건너편에 있지 않으므로, 여러분이 ‘누가 우리를 위하여 바다 건너편으로 건너가서 그것을 우리를 위하여 가져와 우리에게 그것을 들려주어 우리가 그것을 행하도록 하겠습니까?’ 하고 말할 것이 아닙니다.[a][b][c]
  rationale: 직접 인용을 도입하는 히브리어 구문을 ‘… 하고 말할 것이 아닙니다’로 보존하고, 목적절을 ‘우리가 그것을 행하도록’으로 고쳐 원문의 목적 관계를 명확히 했습니다. 각주 표지는 해당 어휘가 나오는 위치에 맞추어 유지했습니다.
  reviewer_model: gpt-5.6-terra
