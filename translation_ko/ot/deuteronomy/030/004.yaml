  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
  footnotes:
  - marker: a
    text: Or 'your banished ones' or 'your dispersed ones.' The Hebrew refers to those driven away or scattered.
    reason: lexical_alternative
  - marker: b
    text: '''At the end of the heavens'' is a Hebrew idiom for the farthest possible place.'
    reason: cultural_note
  - marker: c
    text: Or 'he will bring you.' The Hebrew verb is more literally 'he will take you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 너의 쫓겨난 자들이 하늘의 끝에 있을지라도, 거기서 야훼 너의 하나님께서 너희를 모으실 것이며, 거기서 너희를 데려가실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 끝’은 가장 멀리 떨어진 곳을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘끌어오실 것입니다’. 히브리어 동사는 더 문자적으로는 ‘데려가실 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדַּחֲךָ
  english_pob_choice: your outcasts
  chosen_korean: 너의 쫓겨난 자들
  alternatives_korean:
  - 너의 버림받은 자들
  - 너의 흩어진 자들
  lexicon: HALOT
  rationale: נדח의 핵심은 쫓겨나 흩어진 상태이므로, ‘쫓겨난 자들’이 원문의 결과 상태를 살리면서도 과도한 해석을 피합니다.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  english_pob_choice: at the end of the heavens
  chosen_korean: 하늘의 끝
  alternatives_korean:
  - 하늘 끝자락
  - 하늘의 가장 먼 곳
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, ‘하늘’로 유지하여 원문의 높은 문체와 공간적 극단성을 보존했습니다.
- source_word: יְקַבֶּצְךָ
  english_pob_choice: will gather you
  chosen_korean: 모으실 것이며
  alternatives_korean:
  - 다시 모으실 것이며
  - 모아 주실 것이며
  lexicon: HALOT
  rationale: קבץ의 기본 의미인 ‘모으다’를 직접 살렸고, 원문에 없는 ‘다시’를 덧붙이지 않았습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 주 너의 하나님
  lexicon: HALOT
  rationale: יהוה는 본 지침에 따라 ‘야훼’로 옮기고, 뒤의 אֱלֹהֶיךָ는 표준적인 언약 호칭인 ‘너의 하나님’으로 렌더링했습니다.
theological_decisions:
- issue: 이스라엘을 향한 단수 2인칭의 집단적 의미
  chosen_reading: ‘너의’와 ‘너희를’의 조합으로 단수 호칭의 언약적 집단성을 유지했습니다.
  alternative_readings:
  - 전면 복수화한 ‘너희의 흩어진 자들’
  - 직역형 단수 일관화
  rationale: 히브리어는 이스라엘을 단수로 부르면서도 흩어진 구성원을 가리키므로, 한국어에서는 문맥상 자연스러운 집합적 표현을 병행해 원문 효과를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5'
- issue: ‘하늘의 끝’ 관용구 처리
  chosen_reading: 공간적 극단을 가리키는 관용구로 이해해 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘가장 먼 하늘 끝까지’로 확장
  - 의미 번역으로 ‘아무리 멀리 떨어져 있어도’
  rationale: 원문의 수사적 과장을 약화시키지 않기 위해 관용구를 보존하고, 필요 최소한의 한국어 자연성만 부여했습니다.
  doctrine_reference: POB lexical audit for Deut 30:4
