  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
  footnotes:
  - marker: a
    text: Or 'and you take them to heart'; literally, 'and you bring back to your heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일, 곧 내가 네 앞에 둔 복과 저주가 네게 임할 때에, 네 하나님 야훼께서 너를 쫓아 보내신 모든 민족들 가운데서 네가 이것들을 마음에 되새기면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들을 마음에 두면’. 직역하면 ‘네 마음에 되돌리면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 이 모든 일이
  alternatives_korean:
  - 그때 이 모든 일이
  - 그리고 때가 되어 이 모든 일이
  lexicon: HALOT
  rationale: 미래의 상황을 여는 서두로 자연스러운 한국어 연결을 택하되, 히브리어의 서사적 전환감을 살렸습니다.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  english_pob_choice: the blessing and the curse
  chosen_korean: 복과 저주
  alternatives_korean:
  - 축복과 저주
  - 복과 저주
  lexicon: HALOT
  rationale: 언약적 대조를 간결하게 드러내는 표현으로, 신명기의 문맥상 ‘복/저주’가 가장 직접적입니다.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  english_pob_choice: and you take them to heart
  chosen_korean: 이것들을 마음에 되돌리면
  alternatives_korean:
  - 이것들을 마음에 새기면
  - 이것들을 생각해 보면
  lexicon: HALOT
  rationale: 직역은 ‘마음으로 돌려보내다/되돌리다’에 가까우므로, 현대 한국어에서 그 내적 반성을 드러내는 ‘마음에 되돌리다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희의 하나님 여호와
  - 너희 하나님 야훼
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신명기의 יהוה는 ‘야훼’로 옮기고, 언약 호칭인 ‘너희의 하나님’을 함께 유지했습니다.
- source_word: שָׁמָּה
  english_pob_choice: there
  chosen_korean: 그리로
  alternatives_korean:
  - 거기로
  - 거기
  lexicon: HALOT
  rationale: 포로/추방의 장소성을 살리기 위해 단순한 위치 지시보다 이동 방향을 드러내는 ‘그리로’를 사용했습니다.
theological_decisions:
- issue: 언약 저주와 추방의 표현
  chosen_reading: ‘야훼께서 너희를 그리로 흩으신’으로, 주어를 하나님께 두어 포로 상태가 우연이 아니라 언약적 심판의 결과임을 드러냈습니다.
  alternative_readings:
  - ‘너희가 흩어진’
  - ‘너희가 가게 된’
  rationale: 히브리어 히필 הִדִּיחֲךָ는 ‘몰아내다/흩으시다’의 능동적 조치로 읽히므로, 하나님의 주권적 행위를 분명히 하는 번역이 본문 의도에 맞습니다.
  doctrine_reference: 신명기 30장 언약 축복과 저주, 포로와 회복의 신학
