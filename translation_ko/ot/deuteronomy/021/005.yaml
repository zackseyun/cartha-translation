  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
  footnotes:
  - marker: a
    text: Or 'every injury,' 'every stroke,' or 'every affliction.' The Hebrew term is broader than 'assault' but in this legal setting likely refers to cases involving bodily harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람의 아들인 제사장들이 나아와야 합니다. 이는 야훼 당신의 하나님께서 그들을 택하셔서 그분을 섬기게 하시고 야훼의 이름으로 복 주게 하셨기 때문이며, 그들의 말에 따라 모든 분쟁과 모든 상해가 결정될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상처’, ‘타격’, ‘재난’. 히브리어 נגע는 ‘상해’보다 넓은 의미를 가지며, 이 법적 문맥에서는 신체적 피해와 관련된 사건을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  english_pob_choice: shall come forward
  chosen_korean: 나아와야 합니다
  alternatives_korean:
  - 다가와야 합니다
  - 앞으로 나와야 합니다
  lexicon: HALOT
  rationale: 제의·법적 절차에서 공식적으로 출석해 행동을 시작하는 뉘앙스를 살려, 단순한 공간 이동보다 절차적 진입을 드러냈습니다.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  english_pob_choice: the priests, the sons of Levi
  chosen_korean: 레위 사람의 아들인 제사장들
  alternatives_korean:
  - 레위 지파 제사장들
  - 레위의 제사장들
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 살려 ‘제사장들’과 그 출신 표지를 함께 드러냈습니다. ‘레위 사람의 아들’은 원문의 관계를 보존하면서도 자연스럽게 읽힙니다.
- source_word: לְשָׁרְתוֹ
  english_pob_choice: to minister to him
  chosen_korean: 그분을 섬기게 하시고
  alternatives_korean:
  - 그분을 섬기도록
  - 그분 앞에서 봉사하게 하시고
  lexicon: HALOT
  rationale: 제사장 직분의 성전 봉사를 가리키므로, 일반적 ‘섬기다’보다 직무 수행의 의미를 반영하되 지나치게 교회식 표현으로 고정하지 않았습니다.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  english_pob_choice: and to bless in the name of Yahweh
  chosen_korean: 야훼의 이름으로 복 주게 하셨기 때문이며
  alternatives_korean:
  - 야훼의 이름으로 축복하게 하셨기 때문이며
  - 야훼 이름으로 복을 빌게 하셨기 때문이며
  lexicon: HALOT
  rationale: שׁם יְהוָה는 권위의 근거를 나타내므로 ‘이름으로’로 직역적 구조를 유지했습니다. ‘복 주다’는 제사장 축복의 선언적 성격을 살립니다.
- source_word: וְעַל פִּיהֶם
  english_pob_choice: and by their word
  chosen_korean: 그들의 말에 따라
  alternatives_korean:
  - 그들의 판정에 따라
  - 그들의 입에서 나온 말에 따라
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 입 위에/에 따라’라는 관용구로, 법정 판결의 권위를 뜻합니다. 한국어에서는 결과 기준을 드러내는 ‘말에 따라’가 가장 자연스럽습니다.
- source_word: כָּל רִיב וְכָל נָגַע
  english_pob_choice: every dispute and every injury
  chosen_korean: 모든 분쟁과 모든 상해
  alternatives_korean:
  - 모든 논쟁과 모든 상처
  - 모든 분쟁과 모든 손상
  lexicon: HALOT
  rationale: רִיב는 법적 분쟁, נָגַע는 이 문맥에서 신체적 해를 포함한 손상/상해의 폭을 가질 수 있어, 영어 POB의 재검토 취지에 맞게 ‘상해’로 넓게 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 제사장 축복의 권위
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고, 축복은 제사장들이 야훼의 이름에 근거하여 행하는 선언으로 표현했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 나타난 언약명과 제사장 직무의 권위 근거를 분명히 드러내기 위해, 프로젝트 기본값에 따라 야훼를 사용했습니다. 이는 단순한 대체어가 아니라 원문 신학 구조를 보존하는 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
