revisions:
- from: 그리고 레위 사람의 아들인 제사장들이 나아와야 합니다. 이는 야훼 당신의 하나님께서 그들을 택하셔서 그분을 섬기게 하시고 야훼의 이름으로 복 주게 하셨기 때문이며, 그들의 말에 따라 모든 분쟁과 모든 상해가 결정될 것입니다.[a]
  to: 레위 자손인 제사장들이 나아올 것입니다. 이는 야훼 당신의 하나님께서 그들을 택하셔서 그분을 섬기고 야훼의 이름으로 복을 빌게 하셨기 때문입니다. 그들의 말에 따라 모든 분쟁과 모든 상해가 판결될 것입니다.[a]
  rationale: 계보 표현을 원문에 맞고 자연스러운 ‘레위 자손’으로 바로잡았습니다. 미래 서술을 유지하기 위해 ‘나아와야 합니다’를 ‘나아올 것입니다’로 고쳤고, 원문의 두 부정사(섬기다, 축복하다)를 한국어에서 명확하게 전달하도록 인과절을 다듬었습니다. ‘그들의 말에 따라’와 ‘판결될 것입니다’는 עַל־פִּיהֶם 및 משפט적 문맥의 판정 기능을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:11Z'
