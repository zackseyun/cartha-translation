  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
  footnotes:
  - marker: a
    text: Or 'the garments of her captivity' or 'the clothes she wore when captured.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 포로 상태의 옷을[a] 자기 몸에서 벗고 당신의 집에 머물며 자기 아버지와 어머니를 한 달 동안 애도해야 합니다. 그 후에 당신은 그녀에게 들어가 그녀의 남편이 될 수 있고, 그녀는 당신의 아내가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 포로로 잡혔을 때 입고 있던 옷’ 또는 ‘그녀의 포로 상태와 관련된 옷’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִירָה ... מֵעָלֶיהָ
  english_pob_choice: She shall remove ... from herself
  chosen_korean: 자기 몸에서 벗고
  alternatives_korean:
  - 자기에게서 벗고
  - 자기 위에서 벗고
