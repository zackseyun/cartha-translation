  source_fidelity: 히브리어의 순서와 핵심 법적·혼인 표현은 대체로 충실합니다. 다만 שִׂמְלַת שִׁבְיָהּ는 단순히 ‘포로의 옷’이라기보다 포로 상태/포로로 잡힌 때와 관련된 옷을 가리키므로, 현 번역은 소유 관계로 오해될 여지가 있습니다. 각주 표지도 해당 어구 바로 뒤에 두는 것이 적절합니다.
