  lexicon: HALOT
  rationale: 히필의 제거·벗김 동작을 자연스러운 현대 한국어로 옮기되, 원문의 자기 관련성을 살렸습니다.
- source_word: שִׂמְלַת שִׁבְיָהּ
  english_pob_choice: the clothing of her captivity
  chosen_korean: 포로의 옷
  alternatives_korean:
  - 포로 상태의 옷
  - 그 포로 상태의 옷
  - 포로 때 입었던 옷
  lexicon: HALOT
  rationale: 직역적 소유격을 유지하면서도 한국어에서 가장 직접적으로 이해되는 표현으로 옮겼습니다. 포로 신분과 관련된 옷이라는 점을 드러냅니다.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  english_pob_choice: and remain in your house
  chosen_korean: 당신의 집에 머물며
  alternatives_korean:
  - 당신의 집에 살며
  - 당신의 집에 거하며
  - 당신의 집에 머물러
  lexicon: HALOT
  rationale: 법문 맥락의 지속적 거주를 나타내는 ישב를 ‘머물다’로 옮겨, 딱딱한 ‘살다’보다 문맥에 맞게 처리했습니다.
- source_word: יֶרַח יָמִים
  english_pob_choice: for a month of days
  chosen_korean: 한 달 동안
  alternatives_korean:
  - 한 달의 날들 동안
  - 한 달 동안의 기간
  - 한 달
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 ‘한 달’이므로, 한국어에서는 자연스러운 현대 표현으로 옮기되 기간의 충실성을 유지했습니다.
- source_word: וּבְעַלְתָּהּ
  english_pob_choice: and be her husband
  chosen_korean: 그녀의 남편이 될 수 있고
  alternatives_korean:
  - 그녀를 아내로 삼을 수 있고
  - 그녀와 결혼할 수 있고
  - 그녀의 남편이 되고
  lexicon: HALOT
  rationale: בעל의 관계적 의미를 단순한 ‘결혼하다’로만 지우지 않고, 결과적 혼인 관계를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 전쟁 포로 여성과의 혼인 규정에서 성행위와 혼인 관계를 어떻게 드러낼지
  chosen_reading: ‘그녀에게 들어가’와 ‘그녀의 남편이 될’이라는 두 요소를 모두 살려, 본문이 성적 접근과 혼인 성립을 구분함을 드러냈습니다.
  alternative_readings:
  - ‘그녀와 결혼할 수 있고’로 완화
  - ‘그녀와 동침할 수 있고’로 직접화
  rationale: 본문은 법적 허용과 혼인 성립을 함께 규정하므로, 어느 한쪽으로만 평준화하지 않는 것이 원문의 의미를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 3
