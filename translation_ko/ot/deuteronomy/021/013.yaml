  terminology: ‘그녀에게 들어가’, ‘그녀의 남편이 될 수 있고’, ‘그녀는 당신의 아내가 될 것입니다’는 성적 접근과 혼인 관계라는 원문의 구별을 과도하게 완화하거나 해석적으로 확대하지 않고 잘 드러냅니다.
