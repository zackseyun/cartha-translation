id: DEU.21.22
reference: Deuteronomy 21:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
  footnotes:
  - marker: a
    text: Or, 'worthy of death' or 'under a sentence of death.' The Hebrew phrase is literally 'a sin/judgment of death.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'on a stake.' The Hebrew literally says 'on a tree.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 죽을 만한 죄를 범하여 사형에 처해지고, 당신이 그를 나무에 달면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽을 만한 자’, 혹은 ‘사형 선고 아래 있는 자’입니다. 히브리어 표현은 문자적으로 ‘죽음의 죄/판정’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘말뚝에’. 히브리어는 문자적으로 ‘나무에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי יִהְיֶה
  english_pob_choice: And if there is
  chosen_korean: 만일 어떤 사람이
  alternatives_korean:
  - 만일
  - 그리고 만일
  lexicon: HALOT
  rationale: 법조문 형식의 조건절을 자연스럽게 시작하기 위해 '만일'을 썼고, 존재 표현은 한국어에서 자연스러운 주어 도입으로 풀어 옮겼습니다.
- source_word: בְ/אִישׁ
  english_pob_choice: in a man
  chosen_korean: 어떤 사람이
  alternatives_korean:
  - 한 남자에게
  - 사람에게
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 법률 주어이지만, 한국어에서는 '사람'으로 풀어도 법조문 문맥이 유지되므로 과도한 직역을 피했습니다.
- source_word: מִשְׁפַּט מָוֶת
  english_pob_choice: deserving death
  chosen_korean: 죽을 만한 죄
  alternatives_korean:
  - 사형에 해당하는 죄
  - 죽음의 판결을 받을 죄
  lexicon: HALOT
  rationale: 문자적으로는 '죽음의 판결/판정'이지만, 한국어 법률 문맥에서는 '죽을 만한 죄'가 해당 죄의 중대성과 판결 가능성을 함께 가장 자연스럽게 드러냅니다.
- source_word: וְ/הוּמָת
  english_pob_choice: and he is put to death
  chosen_korean: 사형에 처해지고
  alternatives_korean:
  - 죽임을 당하고
  - 죽게 되고
  lexicon: HALOT
  rationale: 히필/히훌형의 수동적 법률 처분을 한국어 법어인 '사형에 처하다'로 옮겨, 단순한 살해보다 사법적 처결을 분명히 했습니다.
- source_word: וְ/תָלִיתָ אֹת֖/וֹ עַל עֵץ
  english_pob_choice: and you hang him on a tree
  chosen_korean: 당신이 그를 나무에 달면
  alternatives_korean:
  - 당신이 그를 나무에 매달면
  - 그를 나무에 달면
  lexicon: HALOT
  rationale: עֵץ을 POB의 'tree'에 맞춰 '나무'로 옮겼고, משפט 문맥의 처형 후 부착 행위를 한국어 동사 '달다'로 간결하게 반영했습니다.
theological_decisions:
- issue: עַל עֵץ의 직역과 법적 뉘앙스
  chosen_reading: 나무에 달면
  alternative_readings:
  - 나무에 매달면
  - 못에 달면
  rationale: 본문은 처형 도구를 구체화하기보다 '나무'라는 히브리어 표현 자체를 보존하므로, 후대 인용과의 연관성을 위해 직역을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 마스큘린 단수 법률 주어의 한국어화
  chosen_reading: 어떤 사람이
  alternative_readings:
  - 한 남자가
  - 누군가
  rationale: 히브리어 אישׁ의 남성형을 과도하게 성별 중립화하지 않으면서도, 한국어 법조문의 읽기 자연스러움을 위해 포괄적 인간 주어로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
