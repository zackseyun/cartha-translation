  source_fidelity: 주절의 법적 순서와 핵심 의미는 대체로 보존했으나, ‘당신이’는 히브리어의 비특정 법률상 2인칭을 한국어에서 부자연스럽고 지나치게 특정적으로 만들며, 각주 a의 대안은 원문의 ‘죄/사형 판정’ 구문을 ‘사람’으로 잘못 바꿉니다.
  naturalness: ‘그를 나무에 매달면’이 법률적 조건문 안에서 자연스럽습니다. ‘당신이’는 한국어 성경 문체와 법률적 일반 지시 모두에 부적절하므로 생략하는 것이 좋습니다.
  terminology: ‘사형에 처해지고’와 ‘나무에 매달면’은 משפט מות 및 תלה/עץ의 법적·물리적 의미를 적절히 전달합니다. ‘죽을 만한 죄’는 자연스러운 본문 표현으로 유지하되, 각주에서는 그 법적 의미와 문자적 구조를 정확히 밝혀야 합니다.
