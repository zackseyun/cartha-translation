source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
  footnotes:
  - marker: a
    text: Or 'the son of the unloved wife' or 'the less loved wife.' The Hebrew literally contrasts 'loved' and 'hated,' but in family-law contexts the latter can denote one who is comparatively less favored rather than actively detested.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 자기에게 있는 재산을 아들들에게 상속시켜 줄 날에, 사랑받는 아내의 아들을 장자인 미움받는 아내의 아들보다 앞세워 장자로 대우해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미움받는 아내’는 여기서 반드시 적극적인 증오의 대상만을 뜻하지 않습니다. 법률·가정 문맥에서는 상대적으로 덜 사랑받거나 덜 선호되는 아내를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  english_pob_choice: And on the day
  chosen_korean: 그리고 … 할 날에
  alternatives_korean:
  - 그리고 그 날에
  - 그가 … 할 때
  lexicon: HALOT
  rationale: 법률 문맥의 시간 도입으로 읽어, 단순한 서술 연결과 시점 표현을 함께 살리는 쪽을 택했습니다.
- source_word: הַנְחִילוֹ אֵת אֲשֶׁר יִהְיֶה לוֹ
  english_pob_choice: he gives his sons as an inheritance what belongs to him
  chosen_korean: 자기의 소유를 그의 아들들에게 유산으로 나눠 줄
  alternatives_korean:
  - 그의 유산을 그의 아들들에게 나눠 줄
  - 그의 아들들에게 상속을 넘겨 줄
  lexicon: HALOT
  rationale: 히필 נחל은 ‘상속하게 하다/유산으로 나누다’의 뜻이므로, ‘소유’와 ‘아들들에게 유산으로’의 구조로 재현해 원문의 상속 행위를 드러냈습니다.
- source_word: לְבַכֵּר
  english_pob_choice: treat ... as firstborn
  chosen_korean: 첫째 아들로 삼아
  alternatives_korean:
  - 장자로 삼아
  - 첫째의 권리를 주어
  lexicon: HALOT
  rationale: בכר의 법적 의미는 단순 호칭이 아니라 장자의 지위 부여이므로, 한국어로는 ‘첫째 아들로 삼다’로 옮겨 권리 부여의 뉘앙스를 살렸습니다.
- source_word: בֶּן הָאֲהוּבָה / בֶן הַשְּׂנוּאָה
  english_pob_choice: the son of the loved wife / the son of the hated wife
  chosen_korean: 사랑받는 아들 / 미움받는 아들
  alternatives_korean:
  - 사랑받는 아내의 아들 / 미움받는 아내의 아들
  - 덜 사랑받는 아들 / 덜 사랑받는 아들
  lexicon: HALOT
  rationale: 히브리어의 대비는 관계적 선호를 나타내는 법률적 표현이지만, 문맥상 ‘아내’가 암시되므로 본문에서는 간결하게 ‘아들’로 유지하고, 관계적 배경은 번역문 전체에서 이해되도록 했습니다.
- source_word: הַבְּכֹר
  english_pob_choice: who is the firstborn
  chosen_korean: 바로 장자이기 때문입니다
  alternatives_korean:
  - 그가 장자이기 때문입니다
  - 그가 맏아들이기 때문입니다
  lexicon: HALOT
  rationale: 마지막 절은 미움받는 아들이 실제 장자임을 설명하므로, 이유절로 풀어 한국어 문장 흐름을 자연스럽게 만들었습니다.
theological_decisions:
- issue: ‘loved / hated’ 대비의 강도
  chosen_reading: 본문에는 ‘사랑받는’과 ‘미움받는’의 강한 대비를 유지했습니다.
  alternative_readings:
  - ‘선호받는’과 ‘덜 선호받는’
  - ‘사랑받는’과 ‘덜 사랑받는’
  rationale: 원문은 אהב/שׂנא의 강한 대조를 사용하므로, 법률 문장의 긴장을 약화시키지 않도록 본문에서는 직설적으로 옮기고, 필요 시 독자가 관계적 관용법으로 이해할 수 있도록 열어 두었습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
