  to: 그리고 그가 자기에게 있는 재산을 아들들에게 상속시켜 줄 날에, 사랑받는 아내의 아들을 장자인 미움받는 아내의 아들보다 앞세워 장자로 대우해서는 안 됩니다.[a]
  rationale: 아내를 명시하여 원문의 여성형 관계 표현과 앞 절의 문맥을 보존했습니다. 마지막 ‘장자’를 ‘미움받는 아내의 아들’에 직접 연결하고, 금지의 법적 의미를 ‘장자로 대우하다’로 옮겼습니다. 각주는 שׂנואה의 가능한 비교적 용법을 유지합니다.
