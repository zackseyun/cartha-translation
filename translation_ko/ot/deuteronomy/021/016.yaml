  source_fidelity: 현 번역은 상속을 나누는 법적 상황을 대체로 반영하지만, ‘사랑받는 아들의 권리를 미움받는 아들의 앞에 세워’는 원문의 비교 구조를 불명확하게 하고, 두 아들이 각각 ‘사랑받는 아내’와 ‘미움받는 아내’의 아들임을 누락합니다. 또한 마지막 ‘장자’는 이유절이 아니라 미움받는 아내의 아들을 수식하는 동격적 사실입니다.
  naturalness: ‘자기에게 있는 재산을 아들들에게 상속시켜 줄 날에’와 ‘장자인 … 아들보다 앞세워 장자로 대우해서는 안 됩니다’가 현대 표준어 법률 문맥에서 자연스럽고, 원문의 금지와 우선권 비교를 명료하게 전달합니다.
  terminology: ‘장자’는 הַבְּכֹר의 법적 지위를 적절히 옮깁니다. אהובה/שׂנואה는 문맥상 아내를 명시하여 옮기며, ‘미움받는’의 비교적 의미 가능성은 각주에서 보존합니다.
  issues:
