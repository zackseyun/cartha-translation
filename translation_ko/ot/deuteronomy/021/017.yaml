revisions:
- from: 그러나 그는 미운 아내의 장남을 첫째로 인정하여, 자기 소유 가운데 있는 모든 것의 두 몫을 그에게 주어야 합니다. 이는 그가 자기의 기력의 첫 열매이기 때문입니다[b][c]. 첫째 아들의 권리는 그에게 있습니다.
  to: 그러나 그는 사랑받지 못한 아내의 아들[a], 곧 맏아들을 인정하고, 자신에게 있는 모든 것 가운데서 두 몫[b]을 그에게 주어야 합니다. 그는 아버지의 기력의 첫 열매이기 때문입니다[c]. 맏아들의 권리는 그에게 있습니다.
  rationale: ‘사랑받지 못한 아내’는 혼인 관계에서의 대비를 자연스럽게 반영하며 불필요하게 강한 정서 판단을 피합니다. ‘맏아들’과 ‘맏아들의 권리’는 본문의 법적 상속 지위를 일관되게 나타냅니다. 또한 ‘아버지의 기력’이라고 밝혀 히브리어 접미사의 지시 대상을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:16Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 상속 규정과 ‘두 몫’은 대체로 충실합니다. 그러나 ‘미운 아내’는 이 문맥에서 사랑을 덜 받는 아내라는 관계적 대비를 충분히 드러내지 못하며, ‘자기의 기력’은 기력의 소유자가 아버지임을 한국어에서 모호하게 합니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽지만, ‘자기의 기력의 첫 열매’는 소유 관계가 불분명하고 다소 어색합니다. ‘아버지의 기력의 첫 열매’로 명시하면 자연스럽고 원문의 지시 대상도 분명해집니다.
  terminology: בְּכוֹר는 법적 지위를 가진 ‘맏아들’로, מִשְׁפַּט הַבְּכֹרָה는 ‘맏아들의 권리’로 일관되게 옮길 수 있습니다. שְׂנוּאָה는 문맥상 ‘사랑받지 못한 아내’가 적절합니다.
  issues:
  - severity: medium
    issue: ‘미운 아내’의 번역
    rationale: שְׂנוּאָה는 문자적으로 ‘미움받는/미운’이지만, 바로 앞 절의 사랑받는 아내와의 대조 및 영어 POB의 판단을 고려하면 여기서는 덜 사랑받거나 사랑받지 못한 아내를 가리킵니다. ‘미운 아내’는 한국어에서 아내가 주관적으로 밉다는 뜻으로도 쉽게 읽힙니다.
