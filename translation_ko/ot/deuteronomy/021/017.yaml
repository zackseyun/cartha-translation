  - 사랑받지 못한 아내
  rationale: 히브리어는 문자적으로 ‘미워진/미운’이지만, 여기서는 사랑받는 아내와의 대비 속에서 덜 선호되는 배우자를 가리키므로 한국어에서도 과도하게 강한 정서적 단정을 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
