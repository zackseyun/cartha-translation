reference: Deuteronomy 21:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
  footnotes:
  - marker: a
    text: Or 'the son of the hated wife.' The Hebrew term can be rendered more literally as 'hated,' but here likely denotes the less favored or unloved wife in contrast to the loved wife.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a mouth of two,' an idiom meaning a double share or double portion.
    reason: lexical_alternative
  - marker: c
    text: Or 'the first of his strength.' The Hebrew expression refers to the first issue as the first expression of the father's generative power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 미운 아내의 장남을 첫째로 인정하여, 자기 소유 가운데 있는 모든 것의 두 몫을 그에게 주어야 합니다. 이는 그가 자기의 기력의 첫 열매이기 때문입니다[b][c]. 첫째 아들의 권리는 그에게 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 직역은 ‘둘의 한 입(또는 몫)’이라는 관용구로, 두 배 몫을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 힘의 첫째’로도 옮길 수 있습니다. 이 표현은 아버지의 생식력의 첫 표현, 곧 첫 자식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  english_pob_choice: shall acknowledge
  chosen_korean: 첫째로 인정하여
  alternatives_korean:
  - 인정해야 합니다
  - 알아보아
  lexicon: HALOT
  rationale: 법적 맥락에서 단순한 인지가 아니라 첫째 아들의 지위를 공식적으로 인정하는 뜻이므로 ‘첫째로 인정하여’로 옮겼습니다.
- source_word: בֶּן הַשְּׂנוּאָה
  english_pob_choice: the son of the unloved wife
  chosen_korean: 미운 아내의 장남
  alternatives_korean:
  - 사랑받지 못한 아내의 아들
  - 미움받는 아내의 아들
  lexicon: HALOT
  rationale: 문맥상 혼인 감정보다는 선호의 대비가 핵심이므로 ‘사랑받지 못한’의 의미를 담되, 아들의 법적 지위를 분명히 하기 위해 ‘장남’으로 옮겼습니다.
- source_word: פִּי שְׁנַיִם
  english_pob_choice: a double portion
  chosen_korean: 두 몫
  alternatives_korean:
  - 두 배 몫
  - 두 몫의 분깃
  lexicon: HALOT
  rationale: 관용구의 법정상 의미는 ‘두 몫’으로 자연스럽고 분명하게 드러나며, ‘두 배 몫’보다 한국어 법률 문맥에 덜 어색합니다.
- source_word: רֵאשִׁית אֹנוֹ
  english_pob_choice: the firstfruits of his vigor
  chosen_korean: 자기의 기력의 첫 열매
  alternatives_korean:
  - 자기의 힘의 첫째
  - 자기의 생식력의 첫 결과
  lexicon: HALOT
  rationale: 직역하면 ‘기력/힘의 첫’이지만, ‘첫 열매’가 히브리어의 비유적 표현을 살리면서도 출생의 첫 결과라는 의미를 잘 드러냅니다.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  english_pob_choice: the right of the firstborn
  chosen_korean: 첫째 아들의 권리
  alternatives_korean:
  - 장자의 권리
  - 장자권
  lexicon: HALOT
  rationale: 본절은 상속의 법적 권리를 말하므로 ‘권리’를 분명히 하되, ‘첫째 아들’로 앞문장의 지위를 이어 주었습니다.
theological_decisions:
- issue: שְּׂנוּאָה의 정서 강도
  chosen_reading: 미운 아내
  alternative_readings:
  - 미움받는 아내
  - 사랑받지 못한 아내
  rationale: 히브리어는 문자적으로 ‘미워진/미운’이지만, 여기서는 사랑받는 아내와의 대비 속에서 덜 선호되는 배우자를 가리키므로 한국어에서도 과도하게 강한 정서적 단정을 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
