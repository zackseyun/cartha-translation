id: DEU.21.8
reference: Deuteronomy 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
  footnotes:
  - marker: a
    text: Or, more literally, 'and the blood will be atoned for them.' The Hebrew uses 'the blood' as a legal expression for liability arising from bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서 구속하신 주님의 백성 이스라엘을 위하여 속죄해 주시고, 무고한 피가 주님의 백성 이스라엘 가운데 남아 있게 하지 마십시오. 그러면 그들은 그 피 흘림에 대한 죄책에서 속죄를 받을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפֵּר
  english_pob_choice: Make atonement
  chosen_korean: 속죄해 주십시오
  alternatives_korean:
  - 속죄하십시오
  - 대속해 주십시오
  - 죄를 덮어 주십시오
  lexicon: HALOT
  rationale: 제사·법정적 맥락의 כּפר는 한국어 교회어의 단순한 ‘사하소서’보다 ‘속죄하다’가 더 직접적으로 대응하며, 청원형으로 옮기기 위해 ‘-해 주십시오’를 붙였습니다.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  english_pob_choice: for your people Israel
  chosen_korean: 주님의 백성 이스라엘
  alternatives_korean:
  - 주님의 백성, 이스라엘
  - 이스라엘인 주님의 백성
  lexicon: HALOT
  rationale: לְ는 여기서 유익/대상 표시이므로 ‘위하여’와 함께 자연스럽게 옮겼고, ‘your people Israel’은 언약적 소유 관계를 살려 ‘주님의 백성 이스라엘’로 표현했습니다.
- source_word: אֲשֶׁר פָּדִיתָ
  english_pob_choice: whom you redeemed
  chosen_korean: 주님께서 구속하신
  alternatives_korean:
  - 주님께서 속량하신
  - 주님께서 건지신
  lexicon: HALOT
  rationale: פּדה는 단순한 ‘구해내다’보다 값 치름/해방의 뉘앙스를 포함하므로, 출애굽적 구속 언어를 살리는 ‘구속하다’를 선택했습니다.
- source_word: דָּם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 죄 없는 피
  - 억울한 피
  lexicon: HALOT
  rationale: 히브리어의 관용적 법률 표현을 그대로 살리기 위해 ‘무죄한 피’로 옮겼습니다. ‘억울한 피’는 의미는 통하지만 משפט적 강도를 약화시킬 수 있습니다.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  english_pob_choice: Then the bloodguilt will be atoned for them
  chosen_korean: 그러면 그들의 피의 죄책이 속죄될 것입니다
  alternatives_korean:
  - 그러면 그 피가 그들에게 속죄될 것입니다
  - 그러면 그들의 피값이 속죄될 것입니다
  - 그러면 그들의 피의 책임이 속죄될 것입니다
  lexicon: HALOT
  rationale: 마지막 절의 הַדָּם는 문자 그대로 ‘피’이지만 문맥상 ‘피 흘림에 대한 법적 책임’이므로, POB의 ‘bloodguilt’를 반영해 ‘피의 죄책’으로 풀어 뜻을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 호칭과 직접 호소
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 주님께 직접 호소하는 기도문이므로 한국어 합쇼체 경건 문맥에 맞는 ‘주님’을 본문 호칭으로 두었습니다. 다만 원어의 고유명성은 원문 주해에서 보존됩니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → the LORD'
- issue: דָּם의 문맥상 의미
  chosen_reading: 피의 죄책
  alternative_readings:
  - 피
  - 피흘림의 죄책
  - 피값
  rationale: 문맥은 무죄한 피 자체가 아니라 해결되지 않은 살인의 책임과 오염을 다루므로, 마지막 절을 ‘피의 죄책’으로 옮겨 법적·제의적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
