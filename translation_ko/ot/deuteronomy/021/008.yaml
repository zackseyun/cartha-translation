    rationale: 피해자의 무고함을 나타내는 관용적 법률·성서 표현으로 ‘무고한 피’가 더 자연스럽습니다.
  revised_text: 주님, 주님께서 구속하신 주님의 백성 이스라엘을 위하여 속죄해 주시고, 무고한 피가 주님의 백성 이스라엘 가운데 남아 있게 하지 마십시오. 그러면 그들은 그 피 흘림에 대한 죄책에서 속죄를 받을 것입니다.
