source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
  footnotes:
  - marker: a
    text: Or, 'you shall let her go free,' literally 'you shall send her away for herself.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'You must not exploit her for gain.' The Hebrew verb is rare and likely carries the sense of treating her as an object of economic use.
    reason: lexical_alternative
  - marker: c
    text: Or, 'because you have violated her.' The Hebrew can denote affliction, humiliation, or sexual violation depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그 여자를 기뻐하지 않으면, 그 여자가 원하는 대로 보내 주어야 합니다[a]. 돈을 받고 그 여자를 절대로 팔아서는 안 됩니다. 그 여자를 물건처럼 다루어서도 안 됩니다[b]. 이는 그 여자를 욕되게 하였기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자를 자유롭게 보내 주어야 합니다.’ 직역하면 ‘그 여자를 그 자신을 위하여 보내라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 여자를 이익을 위해 이용해서는 안 됩니다.’ 이 히브리어 동사는 드물며, 사람을 경제적 용도로 물건처럼 다루는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 여자를 욕보였기 때문입니다.’ 이 히브리어는 문맥에 따라 괴롭게 함, 굴욕, 또는 성적 침해를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  english_pob_choice: But if it happens that
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 조건문을 자연스럽게 여는 표현으로 옮기되, 앞 문맥과의 대비를 ‘그러나’로 살렸습니다.
- source_word: לֹא חָפַצְתָּ בָּהּ
  english_pob_choice: you do not delight in her
  chosen_korean: 그 여자를 기뻐하지 않으면
  alternatives_korean:
  - 그 여자에게 더 이상 마음이 없으면
  - 그 여자를 원하지 않으면
  lexicon: HALOT
  rationale: חפץ의 ‘기뻐하다/마음에 들다’ 뉘앙스를 살려, 단순한 욕구보다 인격적 호감의 부재를 드러냈습니다.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  english_pob_choice: you shall let her go where she wishes
  chosen_korean: 그녀를 자기 뜻대로 가게 해야 하며
  alternatives_korean:
  - 그녀를 자유롭게 보내야 하며
  - 그녀를 자기 자신을 위해 보내야 하며
  lexicon: HALOT
  rationale: 직역하면 ‘자기 자신을 위하여 보내다’이므로, 해방과 자기결정권의 의미를 한국어로 자연스럽게 드러냈습니다.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  english_pob_choice: you must certainly not sell her for money
  chosen_korean: 돈을 받고 절대로 팔아서는 안 됩니다
  alternatives_korean:
  - 은으로도 팔아서는 안 됩니다
  - 어떤 대가로도 팔아서는 안 됩니다
  lexicon: HALOT
  rationale: 동사 반복의 강조를 ‘절대로’로 옮기고, כֶּסֶף를 현대 독자에게 즉시 통하는 ‘돈’으로 옮겼습니다.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  english_pob_choice: You must not treat her as merchandise
  chosen_korean: 그녀를 물건처럼 다루어서는 안 됩니다
  alternatives_korean:
  - 그녀를 이익의 수단으로 삼아서는 안 됩니다
  - 그녀를 상품처럼 취급해서는 안 됩니다
  lexicon: HALOT
  rationale: 희귀 동사의 경제적 대상화 의미를 보존하되, 한국어에서 가장 직접적으로 비인격화·상품화를 드러내는 표현을 택했습니다.
- source_word: עִנִּיתָהּ
  english_pob_choice: you have humiliated her
  chosen_korean: 그녀를 욕되게 하였기 때문입니다
  alternatives_korean:
  - 그녀를 학대하였기 때문입니다
  - 그녀를 겁탈하였기 때문입니다
  lexicon: HALOT
  rationale: ענה의 폭넓은 의미 가운데 본문이 분명히 말하는 수치·모욕의 차원을 유지하면서도, 본문보다 더 특정한 법적·성적 판단으로 좁히지 않았습니다.
theological_decisions:
- issue: 본절의 윤리적 강도와 여성의 처지
  chosen_reading: 본문의 규정이 여성에 대한 남성의 소유권·매매권을 제한하는 것임을 드러내되, 주어진 히브리어 표현을 넘어 본문을 지나치게 특정한 범주로 단정하지는 않았습니다.
  alternative_readings:
  - 합의된 이혼 조항처럼 완화하여 번역하기
  - 본문에 없는 성적 범죄 명칭을 본문에 직접 삽입하기
  rationale: 본문은 해방, 매매 금지, 대상화 금지를 통해 이미 강한 보호 논리를 제시하므로, 번역은 그 긴장을 보존해야 합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
