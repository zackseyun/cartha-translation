  lexicon: HALOT
  rationale: 이 문맥의 נָשִׁים은 단순한 여자가 아니라 결혼 관계의 아내를 뜻하므로 그 의미를 분명히 했습니다.
- source_word: אֲהוּבָה / שְׂנוּאָה
  english_pob_choice: loved / unloved
  chosen_korean: 사랑받고 / 사랑받지 못하며
  alternatives_korean:
  - 사랑받는 / 미움을 받은
  - 사랑받는 / 미운
  lexicon: HALOT
  rationale: שְׂנוּאָה를 곧바로 ‘미움받은’으로 세게 옮기기보다, 사랑의 결핍이라는 대조를 살리는 ‘사랑받지 못한’으로 옮겨 문맥의 법적 대비를 유지했습니다.
- source_word: וְיָלְדוּ לוֹ בָנִים
  english_pob_choice: have borne him sons
  chosen_korean: 그에게 아들을 낳았는데
  alternatives_korean:
  - 그에게 아들들을 낳았는데
  - 그를 위해 아들을 낳았는데
  lexicon: HALOT
  rationale: בָנִים의 남성형 복수는 여기서 ‘아들들’이 자연스럽지만, 한국어 문장 흐름상 집합적으로 ‘아들’을 사용해도 원문의 자녀-후손 맥락을 보존할 수 있습니다.
- source_word: הַבֵּן הַבְּכוֹר
  english_pob_choice: the firstborn son
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: 법문에서의 בכור를 한국어로는 관용적이면서도 의미가 분명한 ‘맏아들’로 옮겨, 전통 교회어 ‘장자’보다 서술형 문맥에 맞게 했습니다.
theological_decisions:
