base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
  footnotes:
  - marker: a
    text: Or 'hated' for 'unloved'; the Hebrew term can carry the stronger sense, but here likely marks the wife who is not favored in contrast to the loved wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람에게 두 아내가 있는데, 한 아내는 사랑받고 다른 아내는 사랑받지 못하며, 사랑받는 아내와 사랑받지 못하는 아내가 모두 그에게 아들들을 낳았는데, 사랑받지 못하는 아내의 아들이 맏아들이면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미움을 받은’으로 옮길 수 있습니다. 히브리어 표현은 더 강한 뜻을 가질 수 있지만, 여기서는 사랑받는 아내와 대비되는 사랑받지 못하는 아내를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִהְיֶיןָ לְאִישׁ
  english_pob_choice: a man has
  chosen_korean: 어떤 사람에게 아내 둘이 있어서
