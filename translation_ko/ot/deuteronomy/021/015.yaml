source:
  edition: WLC
  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
  footnotes:
  - marker: a
    text: Or 'hated' for 'unloved'; the Hebrew term can carry the stronger sense, but here likely marks the wife who is not favored in contrast to the loved wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람에게 아내 둘이 있어서, 하나는 사랑받고 다른 하나는 사랑받지 못하며, 사랑받는 아내와 사랑받지 못한 아내 둘 다 그에게 아들을 낳았는데, 사랑받지 못한 아내의 아들이 맏아들일 때에는[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미움을 받은’으로도 옮길 수 있습니다. 히브리어는 더 강한 뜻을 가질 수 있지만, 여기서는 사랑받는 아내와 대비되는 덜 사랑받는 아내를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִהְיֶיןָ לְאִישׁ
  english_pob_choice: a man has
  chosen_korean: 어떤 사람에게 아내 둘이 있어서
  alternatives_korean:
  - 어떤 사람에게 두 아내가 있으면
  - 어떤 사람에게는 아내 둘이 있으면
  lexicon: HALOT
  rationale: 히브리어의 소유/존재 구문을 한국어 법문체로 자연스럽게 풀어, 단순 조건문과 소유 상태를 함께 드러냈습니다.
- source_word: שְׁתֵּי נָשִׁים
  english_pob_choice: two wives
  chosen_korean: 아내 둘
  alternatives_korean:
  - 두 아내
  - 두 여자
  lexicon: HALOT
  rationale: 이 문맥의 נָשִׁים은 단순한 여자가 아니라 결혼 관계의 아내를 뜻하므로 그 의미를 분명히 했습니다.
- source_word: אֲהוּבָה / שְׂנוּאָה
  english_pob_choice: loved / unloved
  chosen_korean: 사랑받고 / 사랑받지 못하며
  alternatives_korean:
  - 사랑받는 / 미움을 받은
  - 사랑받는 / 미운
  lexicon: HALOT
  rationale: שְׂנוּאָה를 곧바로 ‘미움받은’으로 세게 옮기기보다, 사랑의 결핍이라는 대조를 살리는 ‘사랑받지 못한’으로 옮겨 문맥의 법적 대비를 유지했습니다.
- source_word: וְיָלְדוּ לוֹ בָנִים
  english_pob_choice: have borne him sons
  chosen_korean: 그에게 아들을 낳았는데
  alternatives_korean:
  - 그에게 아들들을 낳았는데
  - 그를 위해 아들을 낳았는데
  lexicon: HALOT
  rationale: בָנִים의 남성형 복수는 여기서 ‘아들들’이 자연스럽지만, 한국어 문장 흐름상 집합적으로 ‘아들’을 사용해도 원문의 자녀-후손 맥락을 보존할 수 있습니다.
- source_word: הַבֵּן הַבְּכוֹר
  english_pob_choice: the firstborn son
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: 법문에서의 בכור를 한국어로는 관용적이면서도 의미가 분명한 ‘맏아들’로 옮겨, 전통 교회어 ‘장자’보다 서술형 문맥에 맞게 했습니다.
theological_decisions:
- issue: שְׂנוּאָה의 강도
  chosen_reading: ‘사랑받지 못한’으로 옮겨, 적극적 증오라기보다 선호에서 밀린 상태를 드러냈습니다.
  alternative_readings:
  - 미움을 받은
  - 미운
  rationale: 이 본문은 상속 질서를 다루는 가족법 맥락이므로, 관계적 비선호를 표현하는 번역이 원문의 대비를 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: 원문 의미 우선, 과도한 정서 강도 부여 금지'
