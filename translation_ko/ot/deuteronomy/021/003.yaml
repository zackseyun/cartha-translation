revisions:
- from: 죽임을 당한 사람에게 가장 가까운 성읍이 있는 경우, 그 성읍의 장로들은 아직 멍에에 매여 일하지도, 멍에를 끌어보지도 않은[a] 암송아지[b] 한 마리를 가져와야 합니다.
  to: 죽임을 당한 사람에게 가장 가까운 성읍의 장로들은, 한 번도 일을 시킨 적이 없고 멍에를 메고 끈 적도 없는[a] 어린 암소[b] 한 마리를 가져와야 합니다.
  rationale: 두 부정 관계절을 각각 ‘일을 시킨 적이 없음’과 ‘멍에를 메고 끈 적이 없음’으로 분리하여 원문의 반복과 의미 구별을 보존했습니다. 법률 절차의 주체를 한국어에서 자연스럽게 ‘가장 가까운 성읍의 장로들’로 제시했으며, 본절에 없는 제의적 단정을 번역에서 제거했습니다. 각주 a는 멍에를 끄는 조건에, 각주 b는 עֶגְלַת בָּקָר의 어휘 범위에 정확히 연결했습니다.
