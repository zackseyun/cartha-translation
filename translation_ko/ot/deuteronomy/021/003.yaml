review_pass:
  verdict: revise
  source_fidelity: 초안은 חָלָל을 ‘죽임을 당한 사람’으로 옮기고, 가장 가까운 성읍의 장로들이 암컷 소를 취한다는 법적 절차를 대체로 충실히 반영합니다. 그러나 ‘멍에에 매여 일하지도’는 첫 관계절(그 짐승으로 일을 시키지 않은 것)에 ‘멍에’ 조건을 앞당겨 추가하므로, 두 조건을 분리해야 합니다. ‘있는 경우’도 히브리어의 절차 도입을 다소 부자연스러운 조건문으로 바꿉니다.
  naturalness: ‘암송아지’도 이해 가능하지만, 노역에 쓰이지 않은 עֶגְלָה의 통상적 의미에는 ‘어린 암소’가 더 자연스럽고 정확합니다. ‘일을 시킨 적도 없고 멍에를 메고 끈 적도 없는’은 두 히브리어 관계절을 현대 표준 한국어로 명료하게 구별합니다.
  terminology: ‘성읍’, ‘장로들’, ‘멍에’는 법률·의례 문맥에 적절합니다. 본절 자체는 이 동물을 ‘제물’이라고 부르지 않으므로, 번역 및 결정 근거에서 제물의 무흠성이나 희생용 동물이라는 해석을 단정하지 않는 것이 좋습니다.
