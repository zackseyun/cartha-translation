  text: וְ/הָיָ֣ה הָ/עִ֔יר הַ/קְּרֹבָ֖ה אֶל הֶ/חָלָ֑ל וְ/לָֽקְח֡וּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֜וא עֶגְלַ֣ת בָּקָ֗ר אֲשֶׁ֤ר לֹֽא עֻבַּד֙ בָּ֔/הּ אֲשֶׁ֥ר לֹא מָשְׁכָ֖ה בְּ/עֹֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
  footnotes:
  - marker: a
    text: Or "to the corpse" or "to the slain one." The Hebrew term refers to a person who has been killed.
    reason: lexical_alternative
  - marker: b
    text: Or simply "a heifer." The phrase more fully specifies a young female bovine from the cattle herd.
    reason: lexical_alternative
  - marker: c
    text: Literally, "which has not pulled in a yoke," that is, one not previously used for draft labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽임을 당한 사람에게 가장 가까운 성읍의 장로들은, 한 번도 일을 시킨 적이 없고 멍에를 메고 끈 적도 없는[a] 어린 암소[b] 한 마리를 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “멍에로 끌지 않은”입니다. 곧 멍에를 메고 끄는 일에 사용된 적이 없는 짐승을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 소 떼에 속한 어린 암컷 소를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הַקְּרֹבָה
  english_pob_choice: the city nearest
  chosen_korean: 가장 가까운 성읍
  alternatives_korean:
  - 가까운 성읍
  - 가장 인접한 성읍
  lexicon: HALOT
  rationale: 거주지 대신 법적 단위인 성읍을 살리고, 비교급의 의미를 한국어의 관용적 표현인 ‘가장 가까운’으로 옮겼습니다.
- source_word: אֶל הֶחָלָל
  english_pob_choice: to the slain man
  chosen_korean: 죽임을 당한 사람에게
  alternatives_korean:
  - 죽은 사람에게
  - 살해된 사람에게
  - 시체에게
  lexicon: HALOT
  rationale: חָלָל은 단순한 시체보다 ‘살해된/죽임을 당한 사람’을 가리키므로, 개인성을 유지하는 표현을 택했습니다.
- source_word: עֶגְלַת בָּקָר
  english_pob_choice: a heifer of the herd
  chosen_korean: 암송아지 한 마리
  alternatives_korean:
  - 암소 한 마리
  - 송아지 한 마리
  - 젊은 암소 한 마리
  lexicon: HALOT
  rationale: עֶגְלָה는 어린 암컷 소를 뜻하므로 ‘암송아지’로 옮겼고, 수량을 분명히 하기 위해 ‘한 마리’를 보충했습니다.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ / אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  english_pob_choice: that has not been worked with and has not pulled in a yoke
  chosen_korean: 아직 멍에에 매여 일하지도, 멍에를 끌어보지도 않은
  alternatives_korean:
  - 아직 일에 사용되지도, 멍에를 끌어보지도 않은
  - 아직 부려지지도, 멍에를 맨 적도 없는
  lexicon: HALOT
  rationale: 두 분사적 절의 핵심은 ‘노동에 사용되지 않음’과 ‘멍에를 끌어본 적 없음’이므로, 반복을 살리되 한국어에서 자연스럽게 압축했습니다.
theological_decisions:
- issue: 제물의 무흠성/미사용 상태를 어떻게 드러낼지
  chosen_reading: 노역에 사용되지 않았고 멍에를 멘 적도 없는 짐승이라는 제의적 적합성을 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 ‘어린 암송아지’라고만 옮겨 중립화하기
  - ‘부리지 않은’ 정도로 완화하기
  rationale: 본문은 희생용 동물의 이전 사용 이력을 금지하므로, 단순 연령 정보보다 ‘아직 사용되지 않음’을 함께 밝혀 제의적 의미를 보존했습니다.
  doctrine_reference: 제의 규정의 정결성 및 예식적 분리
