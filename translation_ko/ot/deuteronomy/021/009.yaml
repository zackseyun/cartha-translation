  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'remove the blood of the innocent from among you.' The Hebrew idiom 'innocent blood' can imply the community's liability for unatoned bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 그 가운데서 무죄한 피를 제거해야 합니다. 이는 너희가 야훼 보시기에 옳은 일을 행해야 하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 가운데서 무죄한 자의 피를 없애라.’ 히브리어 관용구 ‘무죄한 피’는 공동체에 속죄되지 않은 유혈 책임이 남아 있음을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: So you
  chosen_korean: 그러므로 너희는
  alternatives_korean:
  - 그리고 너는
  - 너는
  lexicon: HALOT
  rationale: 문맥상 앞선 규례의 결론을 이어 주는 전환이므로 ‘그러므로’로 담고, 단수형 표지보다 공동체 전체에 대한 법적 적용이 자연스러워 한국어에서는 복수 호칭을 택했습니다.
- source_word: תְּבַעֵ֛ר
  english_pob_choice: shall purge
  chosen_korean: 제거해야 합니다
  alternatives_korean:
  - 정화해야 합니다
  - 불태워 없애야 합니다
  lexicon: HALOT
  rationale: בער의 핵심은 공동체에서 더럽힘/책임을 없애는 법정적 제거이므로, ‘purge’의 의미를 살리되 한국어에서는 자연스러운 법률 문체로 ‘제거하다’로 옮겼습니다.
- source_word: הַ/דָּם הַ/נָּקִי
  english_pob_choice: the innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 의로운 피
  - 무죄한 자의 피
  lexicon: HALOT
  rationale: 직역하면 ‘무죄한 피’이며, 피 자체보다 무죄한 사람의 유혈과 그에 따른 공동체 책임을 가리키는 관용을 보존하기 위해 ‘무죄한 피’로 유지했습니다.
- source_word: בְּ/עֵינֵ֥י יְהוָֽה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼의 눈에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽게 살리면서도 평가의 기준이 야훼께 있음을 드러내기 위해 ‘보시기에’를 택했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
