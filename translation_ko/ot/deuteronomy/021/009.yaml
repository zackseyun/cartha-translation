  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'remove the blood of the innocent from among you.' The Hebrew idiom 'innocent blood' can imply the community's liability for unatoned bloodshed.
