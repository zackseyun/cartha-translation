  rationale: 본문의 יְהוָה를 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’로 옮겨 언약 სახელ의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
