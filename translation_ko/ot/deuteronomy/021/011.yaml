lexical_decisions:
- source_word: בַּשִּׁבְיָה
  english_pob_choice: among the captives
  chosen_korean: 전쟁 포로 가운데서
  alternatives_korean:
  - 포로들 가운데서
  - 포로 가운데
  lexicon: HALOT
  rationale: 히브리어의 집합적·장소적 의미를 살리면서, 한국어에서는 ‘전쟁 포로’가 מצב을 더 분명히 드러내므로 자연스럽게 옮겼습니다.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  english_pob_choice: a woman beautiful in form
  chosen_korean: 얼굴이 고운 여자
  alternatives_korean:
  - 아름다운 몸매의 여자
  - 외모가 아름다운 여자
  lexicon: HALOT
  rationale: 문자적으로는 ‘형태/용모가 아름다운 여자’이지만, 한국어에서 ‘얼굴이 고운’은 외양의 아름다움을 비교적 직접적으로 살리면서도 부자연스러운 직역을 피합니다.
- source_word: וְחָשַׁקְתָּ בָהּ
  english_pob_choice: and you desire her
  chosen_korean: 그에게 마음이 끌려
  alternatives_korean:
  - 그를 욕망하여
  - 그를 원하게 되어
  lexicon: HALOT
  rationale: 히브리어의 강한 욕구를 지나치게 완곡하게 만들지 않으면서도, 현대 한국어에서 법문체로 읽히는 표현을 택했습니다.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  english_pob_choice: and take her for yourself as a wife
  chosen_korean: 그를 아내로 삼으려 하거든
  alternatives_korean:
  - 그를 아내로 맞이하려 하거든
  - 그와 결혼하려 하거든
  lexicon: HALOT
  rationale: ‘take … for a wife’의 관용구를 한국어 법문체로 옮기되, 영어 POB의 주석이 지적한 결혼 관용 의미를 반영했습니다.
theological_decisions:
- issue: 전쟁 포로 여성에 대한 본문의 직설적 법문 표현을 어떻게 유지할지
  chosen_reading: 욕망과 취함의 긴장을 완화하지 않고 법문체로 직서했습니다.
  alternative_readings:
  - ‘아내로 선택하려 하거든’처럼 완곡하게 처리
  - 의도적 강제성을 덧붙여 해석적으로 확장
  rationale: 본문은 도덕 평가를 덧붙이지 않고 상황을 법적으로 서술하므로, 번역도 본문의 불편한 긴장을 해소하지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
