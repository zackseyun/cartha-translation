- from: 그의 아버지와 어머니가 그를 붙잡아 그를 그의 성읍의 장로들에게, 곧 그의 거처의 성문으로 끌고 나가야 합니다.[a][b]
  to: 그의 아버지와 그의 어머니는 그를 붙잡아 그의 성읍의 장로들에게, 그리고 그가 사는 곳의 성문으로 데리고 나가야 합니다.[a][b]
  rationale: 병렬 접속을 ‘그리고’로 보존하고, הוציא의 통상적 의미에 맞게 ‘데리고 나가다’로 수정했습니다. מקום의 해석 가능성을 본문에서는 ‘그가 사는 곳’으로 자연스럽게 유지하고, 마을이라는 문맥적 대안과 문자적 표현은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:15Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 동작 순서와 목적지 두 곳(‘그의 성읍의 장로들에게’와 ‘그의 곳의 성문으로’)을 모두 반영해야 합니다. 현 번역의 ‘곧’은 두 목적지를 동격으로 만들어 접속사 וְ(‘그리고’)의 병렬을 바꾸며, ‘끌고’는 הוֹצִיאוּ(데리고/이끌어 내다)보다 강한 강제성을 덧붙입니다.
  naturalness: ‘그의 거처의 성문’은 현대 한국어에서 부자연스럽고 주거의 출입문을 연상시킬 수 있습니다. ‘그가 사는 곳의 성문’은 מקום의 문자적 범위를 유지하면서 자연스럽습니다.
  terminology: ‘성읍의 장로들’과 ‘성문’은 법적·공적 문맥에 맞습니다. 성문이 재판이 이루어지는 공적 장소였다는 설명은 본문에 추가하지 않고 각주로 처리하는 것이 적절합니다.
  issues:
  - severity: high
    issue: ‘곧’이 장로들과 성문을 동격으로 연결함
    rationale: 원문은 אֶל זִקְנֵי עִירוֹ וְאֶל שַׁעַר מְקֹמוֹ, 곧 ‘그의 성읍의 장로들에게 그리고 그의 곳의 성문으로’라고 두 목적지를 병렬로 제시합니다. ‘곧’은 이 구조를 변경합니다.
  - severity: medium
    issue: ‘끌고 나가다’가 동사의 강도를 과도하게 한정함
    rationale: תפשׂ는 붙잡는 행위를 나타내지만, הוציא는 ‘데리고/이끌어 내다’입니다. ‘끌고’는 원문이 명시하지 않은 거친 강제를 덧붙일 수 있습니다.
  - severity: medium
    issue: ‘그의 거처의 성문’의 의미와 한국어 자연스러움
    rationale: מקום은 문자적으로 ‘곳/장소’이며 문맥상 그가 속한 지역 공동체를 가리킵니다. ‘거처’는 집이나 주거지를 지나치게 구체화할 수 있습니다.
  revised_text: 그의 아버지와 그의 어머니는 그를 붙잡아 그의 성읍의 장로들에게, 그리고 그가 사는 곳의 성문으로 데리고 나가야 합니다.[a][b]
