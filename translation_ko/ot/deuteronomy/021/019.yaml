id: DEU.21.19
reference: Deuteronomy 21:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָ֥פְשׂוּ ב֖/וֹ אָבִ֣י/ו וְ/אִמּ֑/וֹ וְ/הוֹצִ֧יאוּ אֹת֛/וֹ אֶל זִקְנֵ֥י עִיר֖/וֹ וְ/אֶל שַׁ֥עַר מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
  footnotes:
  - marker: a
    text: That is, the city gate as the public place where local elders heard legal matters.
    reason: cultural_note
  - marker: b
    text: 'Or ''the gate of his town.'' Hebrew: ''the gate of his place.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지와 그의 어머니는 그를 붙잡아 그의 성읍의 장로들에게, 그리고 그가 사는 곳의 성문으로 데리고 나가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 성문은 지역 장로들이 법적 사안을 심리하던 공적 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그의 마을의 성문’. 히브리어는 문자적으로 ‘그의 곳의 성문’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  english_pob_choice: shall seize him
  chosen_korean: 그를 붙잡아
  alternatives_korean:
  - 그를 붙들어
  - 그를 잡아
  lexicon: HALOT
  rationale: תפשׂ는 단순 접촉이 아니라 법적 조치를 위한 강한 제압을 나타내므로, 현대 한국어에서 자연스럽고 그 강도를 살리는 ‘붙잡다’가 적절합니다.
- source_word: אָבִיו וְאִמּוֹ
  english_pob_choice: his father and his mother
  chosen_korean: 그의 아버지와 어머니가
  alternatives_korean:
  - 아버지와 어머니가
  - 그 아버지와 그 어머니가
  lexicon: HALOT
  rationale: 히브리어는 아버지와 어머니를 각각 소유격으로 분명히 가리키므로, 한국어에서도 둘 다에 ‘그의’를 유지해 공동 행위임을 보존했습니다.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  english_pob_choice: bring him out
  chosen_korean: 그를 … 끌고 나가야 합니다
  alternatives_korean:
  - 그를 데리고 나가야 합니다
  - 그를 밖으로 데려가야 합니다
  lexicon: HALOT
  rationale: הוציא는 단순 이동보다 공적인 심문 장소로 ‘밖으로’ 인도하는 뜻이 강하므로, 문맥의 법정적 성격을 살려 ‘끌고 나가다’로 옮겼습니다.
- source_word: אֶל זִקְנֵי עִירוֹ וְאֶל שַׁעַר מְקֹמוֹ
  english_pob_choice: to the elders of his city and to the gate of his place
  chosen_korean: 그의 성읍의 장로들에게, 곧 그의 거처의 성문으로
  alternatives_korean:
  - 그의 성읍 장로들에게, 그리고 그의 곳의 문으로
  - 그의 마을 장로들에게, 곧 그 마을 문으로
  lexicon: HALOT
  rationale: ‘성읍의 장로들’은 지역 재판권을 지닌 공적 지도자를 가리키고, ‘장소의 성문’은 문자적으로는 ‘거처의 성문’이지만 실제로는 공개 재판 장소인 성문을 뜻하므로 두 의미를 함께 드러냈습니다.
theological_decisions:
- issue: legal-public forum implied by 'the gate of his place'
  chosen_reading: ‘성문’은 단순한 출입구가 아니라 공동체가 판결을 듣는 공적 심판 장소로 이해했습니다.
  alternative_readings:
  - 단순히 집/마을의 문으로 이해함
  - 성읍의 문으로 평탄화함
  rationale: 본문의 ‘성문’은 고대 이스라엘의 재판 공간을 가리키는 관용 표현이므로, 이를 드러내지 않으면 법적 절차의 의미가 약화됩니다.
  doctrine_reference: 신 21:19의 공동체 법정 절차
