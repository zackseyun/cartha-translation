reference: Deuteronomy 21:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
  footnotes:
  - marker: a
    text: Or 'When a man has ...' The Hebrew legal formula can be rendered either 'if' or 'when.'
    reason: alternative_reading
  - marker: b
    text: '''Listen'' here carries the sense of heeding or obeying parental instruction.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'to the voice of his father and to the voice of his mother.' 'Voice' is an idiom for authoritative instruction.
    reason: lexical_alternative
  - marker: d
    text: Or 'and they discipline him.' The Hebrew conjunction can be read straightforwardly, while the context also supports the concessive sense 'though they discipline him.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 어떤 사람에게 반항적이고 고집 센 아들이 있어, 그의 아버지의 소리에도 그의 어머니의 소리에도 듣지 않고, 그들이 그를 징계해도 그는 그들에게 듣지 않으면,[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 법률 공식은 ‘만일’로도, ‘~할 때’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘듣다’는 부모의 가르침을 ‘귀담아듣고 따르다’는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘아버지의 소리와 어머니의 소리’입니다. 여기서 ‘소리’는 권위 있는 지시를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 접속사는 단순한 ‘그리고’로도 읽히지만, 문맥상 ‘징계해도’라는 양보 의미도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 때
  - ~할 때
  lexicon: WLC/법률 관용구
  rationale: 카주이스틱 법문 서두의 조건문을 한국어 법률문체로 자연스럽게 살리기 위해 ‘만일’을 썼습니다. 영어 POB의 ‘If’와 같은 조건성을 유지합니다.
- source_word: בֵּן סוֹרֵר וּמוֹרֶה
  english_pob_choice: a stubborn and rebellious son
  chosen_korean: 반항적이고 고집 센 아들
  alternatives_korean:
  - 고집스럽고 반항적인 아들
  - 완고하고 불순종하는 아들
  lexicon: HALOT
  rationale: סוֹרֵר/מוֹרֶה의 결합은 단순한 성격 묘사보다 지속적 저항과 반역성을 함께 가리키므로, 일상적이면서도 강한 어감을 주는 표현으로 옮겼습니다.
- source_word: שֹׁמֵעַ בְּקוֹל
  english_pob_choice: does not listen to the voice of
  chosen_korean: …의 소리에도 듣지 않고
  alternatives_korean:
  - …의 말에도 듣지 않고
  - …의 음성에도 듣지 않고
  lexicon: HALOT
  rationale: ‘voice of’는 단순 청각이 아니라 권위 있는 지시를 뜻하는 관용구이므로 ‘소리/말’ 가운데 원문 결을 살릴 수 있는 ‘소리’를 택했습니다. ‘듣다’는 שמע의 반복을 유지합니다.
- source_word: וְיִסְּרוּ אֹתוֹ
  english_pob_choice: and though they discipline him
  chosen_korean: 그들이 그를 징계해도
  alternatives_korean:
  - 그들이 그를 훈계해도
  - 그들이 그를 바로잡아도
  - 그들이 그를 징벌해도
  lexicon: HALOT
  rationale: יסר는 단순 처벌보다 교정적 훈육을 포함하므로 ‘징계’가 가장 균형이 좋습니다. 문맥상 양보를 드러내는 ‘-해도’로 영어 POB의 허용된 양보 해석을 반영했습니다.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  english_pob_choice: he does not listen to them
  chosen_korean: 그는 그들에게 듣지 않으면
  alternatives_korean:
  - 그는 그들에게 순종하지 않으면
  - 그는 그들의 말을 듣지 않으면
  lexicon: HALOT
  rationale: 마지막 שמע 반복을 살리기 위해 ‘듣다’를 유지했고, 문장 전체가 법조문 조건문이므로 한국어에서는 종결을 열어 두는 형태로 옮겼습니다.
theological_decisions:
- issue: 법문에서의 조건문과 양보문 결합
  chosen_reading: 원문을 조건문으로 시작하되, ‘그들이 그를 징계해도’로 양보 가능성을 본문 속에 드러냈습니다.
  alternative_readings:
  - ‘그리고 그들이 그를 징계하고도’처럼 단순 병렬로 읽을 수 있음
  rationale: 영어 POB가 주석으로 허용한 양보 의미를 본문에 반영하면, 후속 법정 절차의 긴장을 더 분명하게 전달할 수 있습니다.
  doctrine_reference: 신 21:18–21 법조문 문맥
- issue: ‘voice’의 의미
  chosen_reading: ‘아버지의 소리/어머니의 소리’로 직역하되, 권위 있는 지시의 관용구임을 유지했습니다.
  alternative_readings:
  - ‘아버지의 말과 어머니의 말’
  - ‘아버지의 음성’
  rationale: 전통적 완역으로 의미를 풀어버리면 원문의 표현력이 약해지므로, 주석 없이도 독자가 관용구의 낯섦을 느끼도록 했습니다.
  doctrine_reference: 신명기 법문체와 셈어 관용구
