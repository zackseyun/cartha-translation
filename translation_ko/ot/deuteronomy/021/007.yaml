id: DEU.21.7
reference: Deuteronomy 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָנ֖וּ וְ/אָמְר֑וּ יָדֵ֗י/נוּ לֹ֤א שפכה אֶת הַ/דָּ֣ם הַ/זֶּ֔ה וְ/עֵינֵ֖י/נוּ לֹ֥א רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'this blood.' The phrase is a legal idiom denying responsibility for the killing.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not witness it.' Hebrew 'our eyes did not see' uses concrete body-part language to deny eyewitness knowledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 대답하여 말해야 합니다[a]. ‘우리 손이 이 피를 흘리지 않았고[b], 우리 눈이 그것을 보지 못했습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 공적 응답의 공식으로, 여기서는 공개적으로 무죄를 선언하는 절차를 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘이 피’입니다. 여기서는 살인 책임을 부인하는 법적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  english_pob_choice: Then they shall answer and say
  chosen_korean: 그들은 대답하여 말해야 합니다
  alternatives_korean:
  - 그들은 응답하여 말해야 합니다
  - 그들은 대답하고 말해야 합니다
  lexicon: HALOT
  rationale: 법적·공적 선언 공식으로서 ‘대답하다’가 מתאים하고, 합쇼체 문맥에서 ‘말해야 합니다’가 절차적 선언의 형식을 살립니다.
- source_word: יָדֵינוּ לֹא שפכה אֶת הַדָּם הַזֶּה
  english_pob_choice: Our hands did not shed this blood
  chosen_korean: 우리 손이 이 피를 흘리지 않았고
  alternatives_korean:
  - 우리 손이 이 피를 쏟지 않았고
  - 우리 손이 이 피흘림에 관여하지 않았고
  lexicon: HALOT
  rationale: ‘손’과 ‘피’의 구체적 표현을 살리고, שפך־דם의 관용구를 한국어에서도 직접적인 ‘피를 흘리다’로 옮겨 책임 부인을 드러냈습니다.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  english_pob_choice: and our eyes did not see it
  chosen_korean: 우리 눈이 그것을 보지 못했습니다
  alternatives_korean:
  - 우리 눈이 그것을 목격하지 못했습니다
  - 우리 눈이 그것을 보지 않았습니다
  lexicon: HALOT
  rationale: ‘눈’의 신체 이미지와 무책임 부인의 의미를 유지하되, 한국어에서 자연스러운 목적어 ‘그것’을 보충해 문장을 명료하게 했습니다.
theological_decisions:
- issue: 혈흔에 대한 부정이 곧 살인 책임 부인이라는 법적 관용구의 처리
  chosen_reading: 직역보다 관용구의 법적 의미를 드러내되, 원문의 ‘피’와 ‘손/눈’ 이미지는 그대로 보존했습니다.
  alternative_readings:
  - ‘이 피를 흘리지 않았다’만 직역해 의미를 독자가 추론하게 하는 방식
  - ‘이 사람을 죽이지 않았다’처럼 해석을 앞세우는 방식
  rationale: 본문은 단순한 물리적 진술이 아니라, 살인 사건에 대한 무책임을 공적으로 선언하는 공식문구입니다. 따라서 의미를 분명히 하면서도 원문의 신체적·법적 어휘를 지켰습니다.
  doctrine_reference: 신명기 21장의 무죄 선언과 공동체적 속죄 절차
