translation:
  language: ko
  text: 그러면 그 성읍의 모든 남자는[a] 그를 돌로 쳐서 죽게 하십시오. 이렇게 하여 여러분 가운데서 악을 제거하십시오. 그러면 온 이스라엘이 듣고 두려워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성읍의 모든 사람’; 히브리어는 문자적으로 ‘그 성읍의 모든 남자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  english_pob_choice: shall stone him
  chosen_korean: 그를 돌로 쳐 죽여야 합니다
  alternatives_korean:
  - 그를 돌로 쳐야 합니다
  - 그를 돌로 칩니다
  lexicon: HALOT
  rationale: 법정·형벌 문맥의 רגם은 단순히 던진다는 뜻이 아니라 처형으로서의 투석을 가리키므로, 의미를 분명히 드러내는 표현을 선택했습니다.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  english_pob_choice: all the men of his city
  chosen_korean: 그 성읍의 모든 남자
  alternatives_korean:
  - 그 성읍의 모든 사람
  - 그 성읍의 모든 시민
  lexicon: HALOT
  rationale: 히브리어의 남성형 복수 표현을 평준화하지 않고, 본문이 가리키는 집단 책임의 주체를 한국어에서도 유지했습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: you shall purge the evil from your midst
  chosen_korean: 여러분 가운데서 악을 제거하십시오
  alternatives_korean:
  - 여러분 가운데서 악을 소멸하십시오
  - 여러분 가운데서 악을 없애십시오
  lexicon: HALOT
  rationale: בּער의 관용적 법문 표현은 공동체에서 악을 치워 없앤다는 뜻이므로, 한국어에서는 ‘제거하다’로 담아 Deuteronomy의 공식적 법문 어조를 살렸습니다.
- source_word: וְכָל יִשְׂרָאֵל יִשְׁמְעוּ וְיִרָאוּ
  english_pob_choice: and all Israel shall hear and fear
  chosen_korean: 그러면 온 이스라엘이 듣고 두려워할 것입니다
  alternatives_korean:
  - 그러면 온 이스라엘이 듣고 무서워할 것입니다
  - 그러면 온 이스라엘이 듣고 경외할 것입니다
  lexicon: HALOT
  rationale: שׁמע와 ירא의 병렬을 그대로 살려, 결과적 경고의 기능을 가진 ‘듣고 두려워하다’의 직설적 의미를 유지했습니다.
theological_decisions:
- issue: 공동체 형벌의 법문 어조
  chosen_reading: 그 성읍의 모든 남자가 그를 돌로 쳐 죽여야 합니다
  alternative_readings:
  - 그 성읍의 모든 사람이 그를 돌로 쳐 죽여야 합니다
  - 그 성읍의 모든 남자가 그를 돌로 칩니다
  rationale: 히브리어 법문은 집단적 집행 책임을 남성형으로 명시하므로, 본문의 사회-법적 구조를 흐리지 않기 위해 중성화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: Deuteronomy의 공식적 정화 सूत्र
  chosen_reading: 여러분 가운데서 악을 제거하십시오
  alternative_readings:
  - 여러분 가운데서 악을 없애십시오
  - 여러분 가운데서 악을 치우십시오
  rationale: 반복되는 언약-법문 공식의 무게를 살리기 위해, 일상적 표현보다 규범적·공적 뉘앙스가 있는 ‘제거하다’를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
