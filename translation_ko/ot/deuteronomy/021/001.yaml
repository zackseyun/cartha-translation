source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
  footnotes:
  - marker: a
    text: Or 'When a slain person is found ...' The Hebrew is grammatically masculine singular ('a slain man'), though the law's principle concerns an unidentified homicide generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신의 하나님 야훼께서 당신에게 주셔서 차지하게 하시는 땅에서, 살해된 한 남자가 들에 쓰러져 있는 것이 발견되고 누가 그를 쳤는지 알려지지 않았으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חָלָל은 문법상 남성 단수이며, 폭력으로 죽임당한 사람을 가리킵니다. 그러나 이 규정은 신원이 밝혀지지 않은 살해 사건에 관한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא / נוֹפֵל
  english_pob_choice: is found / lying
  chosen_korean: 발견되는데, … 들에 엎드러져 죽은 채로
  alternatives_korean:
  - 발견되는데, … 들에 쓰러져
  - 발견되는데, … 들에 누워 있는
  lexicon: HALOT
  rationale: 법조문 조건문으로 ‘발견되는데’가 자연스럽고, נֹפֵל은 단순한 ‘fallen’보다 시신의 상태를 드러내는 ‘엎드러져 죽은 채로’가 מקור의 상황을 더 정확히 살립니다.
- source_word: חָלָל
  english_pob_choice: a slain man
  chosen_korean: 어떤 사람이
  alternatives_korean:
  - 한 죽임당한 사람
  - 한 살해된 사람
  lexicon: HALOT
  rationale: 히브리어가 문법적으로 남성 단수이지만, 법의 원리는 신원을 알 수 없는 살인 사건 일반을 가리키므로 한국어에서는 성별을 드러내지 않는 ‘어떤 사람’으로 옮기되, 문맥의 폭력성을 유지했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 규범에 따라 신명기는 하나님의 이름을 ‘야훼’로 옮기며, 2인칭은 법문체의 공손한 ‘당신’으로 맞췄습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 소유하게 하시는
  alternatives_korean:
  - 차지하게 하시는
  - 상속하게 하시는
  lexicon: HALOT
  rationale: רִשְׁתָּהּ는 단순 점유보다 언약적 토지 수여의 뉘앙스를 가지므로, 본문 흐름을 살려 ‘소유하게 하시는’으로 옮겼습니다.
- source_word: לֹא נוֹדַע מִי הִכָּהוּ
  english_pob_choice: it is not known who struck him
  chosen_korean: 누가 그를 쳤는지 알려지지 않으면
  alternatives_korean:
  - 누가 그를 죽였는지 알려지지 않으면
  - 누가 그를 친 사람인지 알 수 없으면
  lexicon: HALOT
  rationale: נכה는 직역상 ‘치다/때리다/치다(타격하다)’이므로 ‘쳤는지’가 어휘 구분을 살리며, 이미 앞의 ‘죽은 채로’가 살해 상황을 전달합니다.
theological_decisions:
- issue: 문법상 남성 단수 חָלָל의 번역
  chosen_reading: 성별을 드러내지 않는 ‘어떤 사람’으로 옮겼습니다.
  alternative_readings:
  - ‘한 남자’로 옮김
  - ‘죽임당한 사람’으로 옮김
  rationale: 히브리어 형태는 남성 단수이지만, 문맥상 규정의 적용 대상은 신원 미상의 살인 사건 일반이므로 한국어에서는 과도한 성별 한정을 피하는 편이 원문의 법적 기능을 더 잘 드러냅니다.
  doctrine_reference: 'POB 번역 원칙: 문법적 성별과 법적 일반성의 균형'
