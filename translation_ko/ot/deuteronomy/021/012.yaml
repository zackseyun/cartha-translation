  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
  footnotes:
  - marker: a
    text: Or, 'and let her nails grow.' The Hebrew literally reads, 'and she shall do her nails,' which is idiomatic and debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그 여자를 네 집 안으로 데려가십시오. 그 여자는 머리를 깎고 손톱을 다듬어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘손톱을 기르다.’ 히브리어는 문자적으로 ‘그녀가 자기 손톱을 하다’라고 되어 있는 관용적 표현이며, 그 의미에 대해서는 해석이 갈립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  english_pob_choice: then you shall bring her
  chosen_korean: 그 여자를 당신의 집 안으로 데려가십시오
  alternatives_korean:
  - 그 여자를 데려가십시오
  - 그 여자를 당신의 집으로 데려가십시오
  lexicon: HALOT
  rationale: 법률 문맥의 연속 지시를 한국어 명령형으로 옮겼으며, בוא의 사역적 의미를 자연스럽게 '데려가다'로 살렸습니다.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  english_pob_choice: into your house
  chosen_korean: 당신의 집 안으로
  alternatives_korean:
  - 당신의 집으로
  - 당신의 집 한가운데로
  lexicon: HALOT
  rationale: תּוֹךְ의 내부성은 '안'으로 충분히 드러나므로, 한국어에서 어색한 '한가운데'보다 직역성과 가독성의 균형을 택했습니다.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  english_pob_choice: and she shall shave her head
  chosen_korean: 그녀는 머리를 깎고
  alternatives_korean:
  - 그녀는 머리를 밀고
  - 그녀는 머리카락을 밀어
  lexicon: HALOT
  rationale: גלח은 구체적 제모 행위를 가리키므로, 관용적으로도 통하는 '머리를 깎다'를 선택했습니다.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  english_pob_choice: and trim her nails
  chosen_korean: 손톱을 다듬을 것입니다
  alternatives_korean:
  - 손톱을 손질할 것입니다
  - 손톱을 기를 것입니다
  lexicon: HALOT
  rationale: עשה+손톱은 관용구라서 본문이 분명하게 말하는 '다듬다/손질하다'를 본문에 두고, 반대 해석은 각주로 보존하는 것이 가장 균형적입니다.
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ의 관용적 의미
  chosen_reading: 본문은 손톱을 다듬는 동작으로 이해해 번역했습니다.
  alternative_readings:
  - 손톱을 기르게 하라는 뜻으로 이해할 수 있습니다.
  rationale: 히브리어 표현이 문자적으로는 '손톱을 하다'여서 해석이 갈리므로, POB의 본문 번역은 자연스러운 한국어로 제시하되 대안 독법은 각주로 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
