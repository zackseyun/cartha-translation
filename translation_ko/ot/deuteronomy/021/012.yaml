  to: 그 여자를 네 집 안으로 데려가십시오. 그 여자는 머리를 깎고 손톱을 다듬어야 합니다.[a]
  rationale: 본문의 법규적 의무를 한국어 ‘…해야 합니다’로 명확히 하고, 직접 호칭으로서 부자연스러운 ‘당신의’를 ‘네’로 바꾸었습니다. 손톱에 관한 히브리어 관용 표현의 불확실성은 본문에서 해결하지 않고 각주에 대안 독법으로 보존했습니다.
