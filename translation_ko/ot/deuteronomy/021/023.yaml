    rationale: ‘하나님께 저주받은 자’는 가능한 해석이지만, 하나님이 직접 저주하셨다는 뜻을 강하게 특정합니다. ‘하나님의 저주 아래 있는 자’는 선택된 영어 POB 독법을 유지하면서도 히브리어의 압축성과 모호성을 더 잘 보존합니다.
