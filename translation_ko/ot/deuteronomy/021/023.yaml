  edition: WLC
  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
  footnotes:
  - marker: a
    text: Or, 'for the hanged one is cursed by God'; alternatively, 'for hanging is an affront to God.' The Hebrew phrase is concise and can be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 시체를 나무 위에 밤새도록 두어서는 안 됩니다. 반드시 바로 그날 그를 묻어야 합니다. 나무에 달린 자는 하나님의 저주 아래 있는 자이기 때문입니다.[a] 또 여러분의 하나님 야훼께서 여러분에게 기업으로 주시는 땅을 더럽히지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축적이어서, ‘나무에 달린 자는 하나님께 저주받은 자이다’로도, 또는 ‘나무에 다는 일은 하나님께 대한 모독이다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְלָתוֹ
  english_pob_choice: his corpse
  chosen_korean: 그의 시체
  alternatives_korean:
  - 그의 몸
  - 그의 죽은 몸
  lexicon: HALOT
  rationale: נְבֵלָה는 죽은 몸, 곧 시체를 가리키므로 완곡한 ‘몸’보다 ‘시체’가 원문의 법적·현실적 강도를 더 잘 드러냅니다.
- source_word: תָלִין
  english_pob_choice: shall not remain all night
  chosen_korean: 밤새 두어서는 안 됩니다
  alternatives_korean:
  - 밤새 머물러서는 안 됩니다
  - 그날 밤 그대로 두어서는 안 됩니다
  lexicon: HALOT
  rationale: לון의 이 용법은 하룻밤 머묾을 뜻하므로, ‘밤새 두다’로 금지의 시간을 분명하게 살렸습니다.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  english_pob_choice: you shall surely bury him
  chosen_korean: 그를 반드시 그날에 장사해야 합니다
  alternatives_korean:
  - 그를 반드시 묻어야 합니다
  - 그를 꼭 그날에 묻어야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 ‘반드시’로 반영했고, 문맥상 정중한 법령 문체에 맞춰 ‘장사하다’를 택했습니다.
- source_word: קִלְלַת אֱלֹהִים תָּלוּי
  english_pob_choice: a hanged man is under God's curse
  chosen_korean: 나무에 달린 자는 하나님께 저주받은 자이기 때문입니다
  alternatives_korean:
  - 나무에 달린 자는 하나님의 저주 아래 있기 때문입니다
  - 나무에 매달린 자는 하나님께 저주받은 자이기 때문입니다
  lexicon: HALOT
  rationale: 압축된 히브리어 표현을 따라 원인절로 옮기되, POB의 핵심 해석을 반영해 ‘하나님께 저주받은 자’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기 언약 문맥에서 신명기 호칭을 ‘야훼’로 일관되게 옮겨, 인명적 고유성을 보존했습니다.
theological_decisions:
- issue: קִלְלַת אֱלֹהִים תָּלוּי의 의미
  chosen_reading: 나무에 달린 자가 하나님께 저주받은 상태라는 뜻으로 읽었습니다.
  alternative_readings:
  - 나무에 달린 것이 하나님에 대한 모독/저주라는 뜻
  - 하나님이 그를 저주하셨다는 뜻
  rationale: 히브리어는 매우 압축적이므로 한 가지로 과도하게 단정하지 않고, 공개 처형된 자가 저주 아래 놓인 표지를 지닌다는 법적·신학적 기능을 살렸습니다.
  doctrine_reference: 주석적 모호성은 해소하지 말고 보존합니다.
- issue: ‘장사하다’와 시체 처리의 법적 뉘앙스
  chosen_reading: 단순 매장이 아니라 그날 안에 시체를 제거하는 법적 의무로 읽었습니다.
  alternative_readings:
  - 그날 안에 묻으라는 단순 장례 지시
  - 시신 모독 방지 규정
  rationale: 문맥상 목표는 밤새 노출로 인한 땅의 더러움 방지이므로, 한국어에서도 법규적 긴급성을 유지했습니다.
  doctrine_reference: 언약 땅의 거룩함과 부정의 전이를 보존합니다.
