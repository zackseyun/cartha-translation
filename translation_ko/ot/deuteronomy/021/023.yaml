  source_fidelity: ‘그날에 장사해야 합니다’는 당일 매장의 명령과 강조를 대체로 잘 반영합니다. 그러나 קִלְלַת אֱלֹהִים תָּלוּי는 해석상 논쟁적인 압축 표현이므로, 본문에서 ‘하나님께 저주받은 자’라고 단정하기보다 ‘하나님의 저주 아래 있는 자’로 옮겨 여지를 보존하는 편이 더 충실합니다.
  naturalness: ‘밤새도록 두어서는 안 됩니다’, ‘바로 그날 그를 묻어야 합니다’는 현대 표준어 합쇼체 법규 문맥에서 자연스럽습니다. ‘장사하다’는 현대어에서 장례 절차 전반이나 직업을 뜻할 수도 있어, כאן의 매장 행위에는 ‘묻다’가 더 직접적입니다.
  terminology: ‘시체’, ‘나무’, ‘더럽히다’, ‘기업’, ‘야훼’는 적절합니다. 하나님의 이름에 붙은 소유·수여 대상은 히브리어의 단수 집합적 청자를 한국어에서 자연스럽게 전달하도록 ‘여러분’으로 통일했습니다.
