  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
  footnotes:
  - marker: a
    text: Hebrew literally, 'gives him/it into your hand'; the singular suffix likely refers collectively to the enemy force, hence 'them' in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'and you capture captives from them.' The Hebrew uses a cognate verb-noun expression for taking prisoners.
    reason: lexical_alternative
translation:
  language: ko
  text: “너희가 너희의 원수들에 대하여 전쟁하러 나가면, 야훼 너희 하나님께서 그들을 너희 손에 넘기시고, 너희가 그들을 포로로 사로잡게 될 때…”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의/그것의 손에 넘기시고’에 가깝지만, 여기서는 ‘원수들’을 집합적으로 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들로부터 포로들을 사로잡게 될 때’로 옮길 수 있습니다. 히브리어는 ‘사로잡다’와 ‘포로’의 어근을 반복하는 동족어 표현을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  english_pob_choice: When you go out to war
  chosen_korean: “너희가 … 전쟁하러 나가면”
  alternatives_korean:
  - “너희가 전쟁에 나가면”
  - “너희가 싸우러 나가면”
  lexicon: HALOT
  rationale: 법조문 서두의 상황 제시이므로 ‘면’으로 처리해 사례법의 조건/상황 뉘앙스를 살렸고, תֵצֵא의 이동 이미지는 ‘나가면’으로 자연스럽게 반영했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: “야훼 너희 하나님”
  alternatives_korean:
  - “주 너희 하나님”
  - “여호와 너희 하나님”
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 고유명사를 신분칭호로 바꾸지 않고, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: into your hand
  chosen_korean: “너희 손에 넘기시고”
  alternatives_korean:
  - “너희 손 안에 두시고”
  - “너희의 권세 아래 두시고”
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 권세/지배 아래 두는 뜻이므로, 이미지를 살리면서 한국어에서는 ‘넘기시고’로 결과를 분명하게 표현했습니다.
- source_word: וְשָׁבִיתָ שִׁבְיֹו
  english_pob_choice: and you take them captive
  chosen_korean: “너희가 그들을 포로로 사로잡게 될 때”
  alternatives_korean:
  - “너희가 그들을 포로로 잡게 될 때”
  - “너희가 그들을 사로잡을 때”
  lexicon: HALOT
  rationale: 동족어 표현(‘사로잡다’/‘포로’)을 한국어에서도 어느 정도 반영해, 단순한 승리가 아니라 포로를 취하는 전쟁 행위를 드러냈습니다.
