  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
  footnotes:
  - marker: a
    text: Hebrew literally, 'gives him/it into your hand'; the singular suffix likely refers collectively to the enemy force, hence 'them' in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'and you capture captives from them.' The Hebrew uses a cognate verb-noun expression for taking prisoners.
    reason: lexical_alternative
translation:
  language: ko
  text: “네가 네 원수들과 싸우러 나가면, 야훼 네 하나님께서 그들을[a] 네 손에 넘기시고, 네가 그들을 포로로 사로잡게 될 때…”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를/그것을 네 손에 넘기시고’라고 합니다. 단수 접미사는 복수인 ‘원수들’을 집합적으로 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게서 포로들을 사로잡게 될 때’로 옮길 수 있습니다. 히브리어는 ‘사로잡다’와 ‘포로’의 어근을 반복하는 동족어 표현을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  english_pob_choice: When you go out to war
  chosen_korean: “너희가 … 전쟁하러 나가면”
  alternatives_korean:
