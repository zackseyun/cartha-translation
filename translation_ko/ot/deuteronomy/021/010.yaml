  - “주 너희 하나님”
  - “여호와 너희 하나님”
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 고유명사를 신분칭호로 바꾸지 않고, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: into your hand
  chosen_korean: “너희 손에 넘기시고”
  alternatives_korean:
  - “너희 손 안에 두시고”
  - “너희의 권세 아래 두시고”
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 권세/지배 아래 두는 뜻이므로, 이미지를 살리면서 한국어에서는 ‘넘기시고’로 결과를 분명하게 표현했습니다.
- source_word: וְשָׁבִיתָ שִׁבְיֹו
  english_pob_choice: and you take them captive
  chosen_korean: “너희가 그들을 포로로 사로잡게 될 때”
  alternatives_korean:
  - “너희가 그들을 포로로 잡게 될 때”
  - “너희가 그들을 사로잡을 때”
  lexicon: HALOT
  rationale: 동족어 표현(‘사로잡다’/‘포로’)을 한국어에서도 어느 정도 반영해, 단순한 승리가 아니라 포로를 취하는 전쟁 행위를 드러냈습니다.
