  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
  footnotes:
  - marker: a
    text: Or 'to a perennial wadi,' 'to a ravine with an ever-flowing stream.' The Hebrew phrase נַחַל אֵיתָן likely refers to a wadi or ravine characterized by enduring flow, not merely rough terrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 장로들은 그 암송아지를 물이 끊이지 않는 와디[a]로 끌고 내려가야 합니다. 그곳은 경작되지도 않고 씨가 뿌려지지도 않은 곳입니다. 그리고 그 와디에서 그 암송아지의 목을 꺾어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물이 계속 흐르는 와디’, ‘견고한 골짜기’로 옮길 수 있습니다. 히브리어 נַחַל אֵיתָן은 지속적인 물줄기가 있는 와디나 골짜기를 가리킬 수 있으나, 견고하거나 거친 지형을 뜻하는 것으로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר הַהִוא
  english_pob_choice: the elders of that city
  chosen_korean: 그 성읍의 장로들
  alternatives_korean:
  - 그 도시의 장로들
  - 그 마을의 장로들
  lexicon: WLC / HALOT
  rationale: 법적 문맥의 זִקְנִים은 ‘장로들’이 자연스럽고, עִיר는 여기서 ‘성읍’이 관용적이며 한국어 법률 문체에도 잘 맞습니다.
- source_word: הָעֶגְלָה
  english_pob_choice: the heifer
  chosen_korean: 암송아지
  alternatives_korean:
  - 송아지
  - 어린 암소
  lexicon: HALOT
  rationale: עגלה는 어린 암소를 가리키므로 ‘암송아지’가 성별과 연령을 함께 드러내며, 제의·법률 맥락에서 충분히 정확합니다.
- source_word: אֶל נַחַל אֵיתָן
  english_pob_choice: to a perennial wadi[a]
  chosen_korean: 흐르는 물이 있는 영속적인 와디
  alternatives_korean:
  - 영속적인 와디
  - 지속적으로 흐르는 와디
  - 마르지 않는 와디
  lexicon: HALOT
  rationale: נַחַל은 ‘와디/하천골’ 계열의 지형어이고, אֵיתָן은 ‘영속적인, 계속되는’의 뜻이어서 두 요소를 함께 살렸습니다. ‘흐르는 물이 있는’은 POB의 주석 취지(마른 골짜기가 아님)를 한국어로 풀어 준 것입니다.
- source_word: וְעָרְפוּ
  english_pob_choice: they shall break the heifer’s neck
  chosen_korean: 그 암송아지의 목을 꺾어야 합니다
  alternatives_korean:
  - 목을 부러뜨려야 합니다
  - 목을 꺾어야 합니다
  lexicon: HALOT
  rationale: ערף는 단순한 도살이 아니라 목을 뒤에서 꺾는 특수한 의식 행위이므로, 그 독특한 동작을 드러내는 표현을 택했습니다.
