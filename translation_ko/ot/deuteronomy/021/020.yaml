source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
  footnotes:
  - marker: a
    text: Or 'he does not obey us.' The Hebrew idiom is literally 'he does not listen to our voice,' where listening carries the sense of heeding or obeying.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들이 그의 도시의 장로들에게 이렇게 말해야 합니다. ‘우리의 이 아들은 완고하고 반항적이며, 우리 말을 듣지 않습니다[a]. 탐식가이고 술꾼입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 순종하지 않는다.’ 히브리어 관용구는 문자적으로 ‘우리의 목소리를 듣지 않는다’라는 뜻이며, 여기서는 귀 기울여 따르거나 순종한다는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: Then they shall say
  chosen_korean: 그러면 그들이 … 말해야 합니다
  alternatives_korean:
  - 그리고 그들이 … 말합니다
  - 그때 그들이 … 말합니다
  lexicon: HALOT
  rationale: 법적 절차의 연속을 자연스러운 한국어로 옮기되, 원문의 의무·절차성을 살려 ‘말해야 합니다’로 표현했습니다.
- source_word: אֶל זִקְנֵי עִירוֹ
  english_pob_choice: the elders of his city
  chosen_korean: 그 도시의 장로들에게
  alternatives_korean:
  - 그 성읍의 장로들에게
  - 그 마을의 장로들에게
  lexicon: HALOT
  rationale: ‘장로들’은 공동체 지도자라는 법적 의미를 유지하고, עִיר는 문맥상 ‘도시’로 무난하게 옮겼습니다.
- source_word: סוֹרֵר וּמֹרֶה
  english_pob_choice: stubborn and rebellious
  chosen_korean: 고집이 세고 반항적이며
  alternatives_korean:
  - 고집스럽고 반역적이며
  - 완고하고 반항적이며
  lexicon: HALOT
  rationale: 두 형용사의 중첩된 비난을 한국어 자연문으로 살리되, 첫 항목의 완고함과 둘째 항목의 적극적 저항을 구분해 표현했습니다.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  english_pob_choice: he does not listen to our voice
  chosen_korean: 우리 말을 듣지 않고
  alternatives_korean:
  - 우리의 목소리를 듣지 않고
  - 우리에게 순종하지 않고
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 의미는 ‘우리의 소리에 귀 기울이지 않다’이지만, 한국어에서는 ‘우리 말을 듣지 않다’가 그 순종의 뜻을 가장 자연스럽게 드러냅니다.
- source_word: זוֹלֵל
  english_pob_choice: a glutton
  chosen_korean: 탐식가이며
  alternatives_korean:
  - 식탐이 심하며
  - 먹성만 좋은
  lexicon: HALOT
  rationale: 술꾼과 짝을 이루는 비난 목록이므로 단순한 ‘낭비꾼’보다 식탐을 가리키는 표현이 맞습니다.
- source_word: וְסֹבֵא
  english_pob_choice: a drunkard
  chosen_korean: 술꾼입니다
  alternatives_korean:
  - 술주정뱅이입니다
  - 과음하는 자입니다
  lexicon: HALOT
  rationale: 습관적 음주를 가리키는 비난을 현대 한국어에서 분명하게 전달하는 표준 표현으로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문의 말투
  chosen_reading: 직접 인용 안에서는 비난 진술을 평서형으로 두고, 외부 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용문 전체를 높임말로 통일
  - 인용문을 더 구어체로 처리
  rationale: 법정 진술의 생생함을 유지하기 위해 인용문 내부는 원문의 직접 발화를 따라가되, 본문 서술은 현대 공손체를 유지했습니다.
  doctrine_reference: 본문 장르와 화법 일치
