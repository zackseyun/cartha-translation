  source_fidelity: 현 번역은 주요 지명과 지형어를 대체로 보존했지만, 히브리어의 목적어 열거를 문장 종결형인 ‘입니다’로 처리하여 앞 절에서 이어지는 ‘보이셨습니다’의 목적어라는 통사 관계가 사라졌습니다. 또한 ‘평야와 여리고 골짜기’를 병렬로 두면 הַכִּכָּר와 בִּקְעַת יְרֵחוֹ의 긴밀한 지리적 연결이 충분히 드러나지 않습니다.
  naturalness: ‘그리고 … 입니다’는 성경 본문의 계속되는 열거로서 자연스럽지 않습니다. ‘또 … 보이셨습니다’로 앞 절의 동사를 한국어에서 자연스럽게 보충하고, ‘여리고 골짜기의 평야’로 연결하면 현대 표준어 합쇼체 문장으로 매끄럽습니다.
  terminology: ‘네게브’, ‘종려나무의 성읍’, ‘소알’은 적절합니다. ‘종려나무의 성읍’은 여리고의 별칭이므로 ‘여리고 골짜기’와 연결되도록 표현하는 것이 좋습니다. 각주 a는 유지할 수 있으나, 각주 b는 실제 번역어인 ‘여리고 골짜기의 평야’와 그 지형어 범위를 명시해야 합니다.
