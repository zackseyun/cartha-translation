  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
  footnotes:
  - marker: a
    text: Or 'yet'; the Hebrew adverb can mark that no prophet like Moses had arisen thereafter in Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘에 모세와 같은 예언자는 다시는 일어나지 않았습니다. 그를 야훼께서 얼굴과 얼굴을 맞대어 아셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시’ 또는 ‘더 이상’으로도 옮길 수 있습니다. 히브리어 부사는 모세 이후 이스라엘에 그와 같은 예언자가 더 나타나지 않았다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹֽא ... עוֹד
  english_pob_choice: And no ... again
  chosen_korean: 다시는 ... 않았습니다
  alternatives_korean:
  - 더 이상 ... 없었습니다
  - 그 후로 ... 없었습니다
  lexicon: HALOT
  rationale: 부정과 시간적 ‘다시/더 이상’의 뉘앙스를 자연스러운 한국어로 옮겨, 모세와 같은 예언자가 이후에 나타나지 않았다는 종결 진술을 살렸습니다.
- source_word: נָבִיא
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: HALOT
  rationale: 표준어 합쇼체 본문에서는 현대 독자가 이해하기 쉬운 ‘예언자’를 택하되, המקרא의 נָבִיא 기능을 보존했습니다.
- source_word: קָם
  english_pob_choice: has arisen
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 등장했습니다
  - 나타났습니다
  lexicon: HALOT
  rationale: קָם의 비유적 용례를 ‘일어나다’로 옮겨, 예언자의 출현/발흥을 나타내는 동사를 유지했습니다.
- source_word: פָּנִים אֶל פָּנִים
  english_pob_choice: face to face
  chosen_korean: 얼굴과 얼굴을 맞대어
  alternatives_korean:
  - 얼굴과 얼굴로
  - 직접
  lexicon: HALOT
  rationale: 직접적이고 생생한 관용구를 살리기 위해 추상화된 ‘직접’보다 얼굴 이미지가 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 본문에서는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유한 이름을 가리키므로, 제목적 대체어보다 음역형 ‘야훼’를 사용해 본문 구별성과 소스 직접성을 보존했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
