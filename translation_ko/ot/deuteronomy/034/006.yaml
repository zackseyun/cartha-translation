base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
  footnotes:
  - marker: a
    text: The subject of 'he buried' is not named in this verse; the previous context points to the LORD.
    reason: alternative_reading
  - marker: b
    text: 'Or ''no one knows.'' Hebrew: ''no man knows.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 모압 땅의 골짜기에, 벧브올 맞은편에 묻었습니다. 오늘까지도 아무도 그의 묘지를 알지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 ‘그를 묻었다’의 주어는 본문에 명시되지 않으며, 앞 절의 문맥은 야훼를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘아무도/어떤 사람도’의 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  english_pob_choice: he buried
  chosen_korean: 묻었습니다
  alternatives_korean:
  - 장사했습니다
  - 매장했습니다
  lexicon: WLC / HALOT
  rationale: 동사는 능동형으로 서술되며, 주어는 본문에서 명시되지 않습니다. 한국어는 주어를 드러내지 않고 자연스럽게 과거 서술형으로 옮겼습니다.
- source_word: בַגַּיְ
  english_pob_choice: in the valley
  chosen_korean: 골짜기에
  alternatives_korean:
  - 계곡에
  - 골짜기 안에
  lexicon: WLC / HALOT
  rationale: גַּיְ는 문맥상 ‘골짜기/계곡’을 가리키지만, 현대 한국어 성경 문체에서는 ‘골짜기’가 가장 자연스럽고 폭넓게 이해됩니다.
- source_word: בְּאֶרֶץ מוֹאָב
  english_pob_choice: in the land of Moab
  chosen_korean: 모압 땅의
  alternatives_korean:
  - 모압 땅에 있는
  - 모압 지방의
  lexicon: WLC / HALOT
  rationale: ‘땅’을 유지해 히브리어의 구체적 지리 표현을 살렸고, 조사 구조는 한국어 문장 흐름에 맞게 정리했습니다.
- source_word: מוּל בֵּית פְּעוֹר
  english_pob_choice: opposite Beth-peor
  chosen_korean: 벧브올 맞은편에
  alternatives_korean:
  - 벧브올 건너편에
  - 벧브올 마주편에
  lexicon: WLC / HALOT
  rationale: מוּל은 위치 관계를 나타내므로 ‘맞은편에’가 가장 간결하고 현대적인 대응입니다. 지명은 음역해 보존했습니다.
- source_word: קְבֻרָתוֹ
  english_pob_choice: his burial place
  chosen_korean: 묘지
  alternatives_korean:
  - 무덤
  - 매장지
  - 장지
  lexicon: WLC / HALOT
  rationale: 여기서는 단순한 ‘무덤’보다 ‘그가 묻힌 장소’라는 의미가 분명해야 하므로 ‘묘지’로 옮겼습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지도
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: WLC / HALOT
  rationale: 현재까지 이어지는 서술의 지속성을 살리되, 한국어 문장에서는 ‘오늘까지도’가 가장 자연스럽습니다.
theological_decisions:
- issue: 본문의 숨은 주어
  chosen_reading: 주어를 한국어 본문에 밝히지 않고 ‘묻었습니다’로 처리했습니다.
  alternative_readings:
  - ‘주님께서 묻었습니다’처럼 주어를 명시하기
  - 수동태로 ‘그가 묻혔습니다’로 옮기기
  rationale: 직전 문맥상 야훼가 주어임을 짐작할 수 있지만, 이 절 자체는 주어를 명시하지 않습니다. 본문의 생략을 그대로 살려 해석을 본문에 과도하게 주입하지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3
