  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
  footnotes:
  - marker: a
    text: Literally, 'the strong hand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the mighty hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the great terror' or 'the fearsome deeds.'
    reason: lexical_alternative
  - marker: d
    text: Literally, 'before the eyes of all Israel,' that is, publicly and in full view of the nation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 큰 손과, 모세가 온 이스라엘의 눈앞에서 행한 그 큰 두려움에 대하여도 그렇습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 강한 손’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 강한 손’, 곧 능력의 표현으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 큰 두려움’, 혹은 ‘두려움을 주는 행위들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘온 이스라엘의 눈앞에서’, 곧 백성이 모두 보는 공개적 자리에서라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּד הַחֲזָקָה
  english_pob_choice: the mighty hand
  chosen_korean: 그 큰 손
  alternatives_korean:
  - 그 강한 손
  - 그 위력 있는 손
  - 그 전능한 손
  lexicon: WLC + POB audit trail
  rationale: 히브리어의 직역적 이미지를 살리되, 한국어에서 자연스러운 수식어로 ‘큰’을 택해 손의 강한 힘과 능력을 드러냈습니다.
- source_word: הַמּוֹרָא הַגָּדוֹל
  english_pob_choice: the great awe
  chosen_korean: 그 큰 두려움
  alternatives_korean:
  - 그 큰 경외
  - 그 큰 공포
  - 그 두려운 일들
  lexicon: WLC + HALOT
  rationale: מוֹרָא는 ‘두려움/경외/공포’를 아우르므로, 문맥의 공적·가시적 위력을 살려 ‘두려움’으로 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  english_pob_choice: that Moses did
  chosen_korean: 모세가 행한
  alternatives_korean:
  - 모세가 한
  - 모세가 행한 바
  - 모세가 행했던
  lexicon: WLC + POB audit trail
  rationale: 히브리어 עָשָׂה의 기본 의미를 따라 ‘행하다’로 옮기고, 문맥상 앞의 명사구들을 수식하는 관계절 구조를 살렸습니다.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  english_pob_choice: before the eyes of all Israel
  chosen_korean: 온 이스라엘의 눈앞에서
  alternatives_korean:
  - 모든 이스라엘의 목전에서
  - 온 이스라엘이 보는 앞에서
  - 온 이스라엘 앞에서
  lexicon: WLC + POB audit trail
  rationale: '직역적 이미지인 ‘눈앞’을 유지해 공개성과 목격성을 분명히 했습니다. '
theological_decisions:
- issue: 이 절의 마무리 표현이 모세의 행위를 어떻게 요약하는가
  chosen_reading: 모세의 공개적으로 드러난 능력과 두려움을 불러일으키는 행위를 요약하는 표현으로 읽고, 그 범위를 넘는 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘강한 손’과 ‘두려운 일들’을 더 문자적으로 살리는 읽기
  - ‘경외’로 옮겨 긍정적 경건 반응을 더 강조하는 읽기
  rationale: 본문은 신명기의 결론부에서 모세의 사역을 요약하므로, 원문의 압축된 수사와 공적 성격을 유지하는 것이 중요합니다. ‘큰 두려움’은 경외와 공포의 범위를 모두 열어 둡니다.
  doctrine_reference: 본문의 요약적 찬사와 공적 증언을 유지하는 번역 원칙
