  source_fidelity: ‘그 큰 손’은 הַיָּד הַחֲזָקָה(‘강한 손’)의 형용사와 뜻이 맞지 않으며, ‘그렇습니다’는 원문에 없는 단정적 서술을 더합니다. 또한 ‘큰 두려움’은 한국어에서 모세가 ‘행한’ 대상과 자연스럽게 연결되지 않습니다. ‘큰 권능’과 ‘큰 위엄’은 각각 손의 능력이라는 환유와 모라의 경외를 불러일으키는 공적 위엄을 자연스럽게 전달합니다.
