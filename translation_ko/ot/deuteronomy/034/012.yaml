  text: 또한 모세가 온 이스라엘의 눈앞에서 행한 모든 큰 권능과 모든 큰 위엄 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 강한 손’입니다.
