    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 두려움’, ‘큰 공포’, 또는 ‘두려움을 불러일으키는 큰 일들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘온 이스라엘의 눈앞에서’이며, 온 백성이 보는 공개적인 자리에서라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּד הַחֲזָקָה
  english_pob_choice: the mighty hand
  chosen_korean: 그 큰 손
  alternatives_korean:
