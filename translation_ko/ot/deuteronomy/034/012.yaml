  rationale: 히브리어 עָשָׂה의 기본 의미를 따라 ‘행하다’로 옮기고, 문맥상 앞의 명사구들을 수식하는 관계절 구조를 살렸습니다.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  english_pob_choice: before the eyes of all Israel
  chosen_korean: 온 이스라엘의 눈앞에서
  alternatives_korean:
  - 모든 이스라엘의 목전에서
  - 온 이스라엘이 보는 앞에서
  - 온 이스라엘 앞에서
  lexicon: WLC + POB audit trail
  rationale: '직역적 이미지인 ‘눈앞’을 유지해 공개성과 목격성을 분명히 했습니다. '
theological_decisions:
- issue: 이 절의 마무리 표현이 모세의 행위를 어떻게 요약하는가
  chosen_reading: 모세의 공개적으로 드러난 능력과 두려움을 불러일으키는 행위를 요약하는 표현으로 읽고, 그 범위를 넘는 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘강한 손’과 ‘두려운 일들’을 더 문자적으로 살리는 읽기
  - ‘경외’로 옮겨 긍정적 경건 반응을 더 강조하는 읽기
  rationale: 본문은 신명기의 결론부에서 모세의 사역을 요약하므로, 원문의 압축된 수사와 공적 성격을 유지하는 것이 중요합니다. ‘큰 두려움’은 경외와 공포의 범위를 모두 열어 둡니다.
  doctrine_reference: 본문의 요약적 찬사와 공적 증언을 유지하는 번역 원칙
