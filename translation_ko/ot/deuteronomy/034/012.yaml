  - 그 위력 있는 손
  - 그 전능한 손
  lexicon: WLC + POB audit trail
  rationale: 히브리어의 직역적 이미지를 살리되, 한국어에서 자연스러운 수식어로 ‘큰’을 택해 손의 강한 힘과 능력을 드러냈습니다.
- source_word: הַמּוֹרָא הַגָּדוֹל
