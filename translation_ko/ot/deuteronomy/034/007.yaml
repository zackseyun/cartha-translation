  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Now Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
  footnotes:
  - marker: a
    text: Or 'his eyesight had not failed.' The Hebrew literally says 'his eye had not grown dim.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his vitality had not abated' or 'his natural force was not diminished.' The Hebrew idiom speaks of bodily freshness or vigor remaining.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 죽을 때 백이십 세였습니다. 그의 눈은 흐려지지 않았고[a], 그의 기력도 쇠하지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 시력이 약해지지 않았습니다.’ 히브리어는 문자적으로 ‘그의 눈이 흐려지지 않았다’고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 활력이 줄지 않았습니다’ 또는 ‘그의 타고난 기력이 약해지지 않았습니다.’ 히브리어 관용구는 몸의 신선함이나 기력이 그대로 남아 있음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  english_pob_choice: Now Moses
  chosen_korean: 모세는
  alternatives_korean:
  - 그리고 모세는
  - 모세가
  lexicon: HALOT
  rationale: 서술의 자연스러운 흐름을 살리면서도, 문두의 연결을 과장하지 않기 위해 한국어에서는 단순 주어 제시로 처리했습니다.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  english_pob_choice: was one hundred twenty years old
  chosen_korean: 백이십 세였습니다
  alternatives_korean:
  - 백이십 살이었습니다
  - 일백이십 세였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 나이를 뜻하므로, 표준적이고 문어적인 ‘백이십 세’로 옮겼습니다.
- source_word: לֹא כָהֲתָה עֵינֹו
  english_pob_choice: his eye had not grown dim
  chosen_korean: 그의 눈은 흐려지지 않았고
  alternatives_korean:
  - 그의 눈은 어두워지지 않았고
  - 그의 시력은 약해지지 않았고
  lexicon: HALOT
  rationale: ‘눈’의 단수 이미지를 유지하되, 한국어에서는 관용적으로 ‘흐려지다’가 시력 저하를 가장 자연스럽게 드러냅니다.
- source_word: וְלֹא נָס לֵחֹה
  english_pob_choice: and his vigor had not fled
  chosen_korean: 그의 기력도 쇠하지 않았습니다
  alternatives_korean:
  - 그의 활력도 달아나지 않았습니다
  - 그의 생기 또한 줄지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 몸의 신선함/기력을 가리키므로, ‘쇠하지 않았다’로 물리적 활력을 간결하게 살렸습니다.
theological_decisions:
- issue: 모세의 노쇠 여부를 어떻게 표현할지
  chosen_reading: 단순히 장수했다는 정보가 아니라, 죽음 직전까지 시력과 기력이 보존되었음을 분명히 드러냈습니다.
  alternative_readings:
  - 나이만 언급하고 신체 상태는 완화하여 번역
  - 비유적으로만 처리
  rationale: 본문은 모세의 마지막 상태를 두 개의 병렬 부정절로 강조하므로, 장수와 더불어 신체적 온전함을 함께 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: 신명기 34:7 문맥 — 모세의 죽음과 마지막 상태에 대한 서술
