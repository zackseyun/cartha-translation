  rationale: ל의 관계성을 그대로 살리면서 반복되는 대상 목록을 한국어 조사로 자연스럽게 풀어 ‘~에’로 마무리했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직역해 고유한 언약적 이름을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: POB 기준은 יְהוָה를 대체 칭호가 아니라 하나님의 이름으로 드러내는 것이므로, 본문 의미와 감사 가능한 추적성을 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
