  source_fidelity: 원문의 שָׁם(‘그곳’)과 בְּאֶרֶץ מוֹאָב(‘모압 땅에서’)를 모두 반영하고, עַל־פִּי יְהוָה는 문장 안에서 ‘야훼의 말씀대로’로 자연스럽게 옮겼습니다. 초안의 ‘모압 땅에서 거기서’는 동일한 장소 표현이 부자연스럽게 중복됩니다.
  naturalness: ‘모세는 야훼의 종으로서’보다 동격 표현인 ‘모세 곧 야훼의 종은’이 원문의 호칭 구조를 더 충실히 살립니다. ‘야훼의 말씀대로입니다’라는 독립 문장은 앞 문장에 붙여 자연스러운 현대 표준어 합쇼체 문장으로 고쳤습니다.
