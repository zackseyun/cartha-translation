base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
  footnotes:
  - marker: a
    text: Literally, 'upon the mouth of the LORD'; the idiom can also be rendered 'at the command of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼의 종으로서 모압 땅에서 거기서 죽었습니다. 야훼의 말씀대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입 위에’입니다. 이 관용구는 ‘야훼의 말씀대로’ 또는 ‘야훼의 명령에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨졌습니다
  - 별세했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서 מקור의 핵심 사건인 ‘죽다’를 직접적으로 반영했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 섬김을 받는 자
  lexicon: HALOT
  rationale: 여기서는 모세의 신분을 드러내는 존칭적 칭호이므로 ‘종’이 가장 적절하며, ‘노예’는 본문의 위상과 맞지 않습니다.
- source_word: בְּאֶרֶץ מוֹאָב
  english_pob_choice: in the land of Moab
  chosen_korean: 모압 땅에서
  alternatives_korean:
  - 모압에서
  - 모압 지역에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅/land’가 분명하므로 이를 살리되, 한국어에서는 ‘~에서’로 자연스럽게 옮겼습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로입니다
  alternatives_korean:
  - 야훼의 명령대로입니다
  - 야훼의 입에서 나온 대로입니다
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘입’은 유지하지 않되, 관용구의 뜻인 ‘말씀/명령에 따라’라는 의미를 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: 모세의 호칭인 עֶבֶד יְהוָה의 한국어 톤
  chosen_reading: ‘야훼의 종’으로 번역하여 부르심과 충성의 관계를 드러냈습니다.
  alternative_readings:
  - ‘야훼의 노예’
  - ‘야훼를 섬기는 종’
  rationale: 이 칭호는 모세의 존귀한 소명과 소속을 나타내므로, 한국어에서도 전통적이면서도 본문의 위상을 훼손하지 않는 ‘종’을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested servant/slave context dependence
