source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'was filled with the Spirit of wisdom.' The Hebrew can be understood more generally as a spirit of wisdom or more specifically as divine empowerment.
    reason: alternative_reading
  - marker: b
    text: Or 'the Israelites' or 'the children of Israel.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누눈의 아들 여호수아는 지혜의 영으로 충만했습니다[a]. 이는 모세가 그에게 안수했기 때문입니다. 그래서 이스라엘 자손들은 그의 말을 들었고, 야훼께서 모세에게 명령하신 대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜의 영으로 가득했습니다.’ 히브리어는 이를 일반적으로 지혜의 영으로, 또는 더 구체적으로 신적 능력이 부여된 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  english_pob_choice: was full of the spirit of wisdom
  chosen_korean: 지혜의 영으로 충만했습니다
  alternatives_korean:
  - 지혜의 영이 충만했습니다
  - 지혜의 영으로 가득했습니다
  - 지혜의 영을 충만히 받았습니다
  lexicon: HALOT
  rationale: 히브리어의 상태 서술인 ‘full of’와 명사구 ‘spirit of wisdom’를 자연스러운 한국어로 옮기되, 영의 성격을 지나치게 규정하지 않도록 ‘지혜의 영’으로 보존했습니다.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  english_pob_choice: had laid his hands on him
  chosen_korean: 그에게 안수했기 때문입니다
  alternatives_korean:
  - 그에게 두 손을 얹었기 때문입니다
  - 그에게 손을 얹었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성경 문맥에 널리 쓰이는 ‘안수하다’로 옮겨, 공식적 행위라는 의미를 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문의 남성 복수 가족 언어를 살려 직역에 가깝게 옮겼습니다. POB의 ‘sons of Israel’을 한국어에서도 유지해 원문 표지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: רוח חכמה를 성령으로 명시할지 여부
  chosen_reading: ‘지혜의 영’으로 두어, 성령으로 단정하지 않았습니다.
  alternative_readings:
  - ‘성령’으로 구체화
  - ‘지혜의 영’을 일반적 품성으로 축소
  rationale: 본문은 여호수아에게 부여된 신적 지혜의 역량을 말하지만, 히브리어 표현 자체가 성령을 명시하지는 않으므로 번역에서 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: ‘이스라엘의 아들들’을 중성 집합명사로 완화할지 여부
  chosen_reading: 원문의 남성 복수 표현을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들은
  - 이스라엘 백성은
  rationale: 히브리어의 가족-언약적 남성 복수 표지를 보존해, 본문의 형식을 희석하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §4 Gender-accurate over gender-neutral
