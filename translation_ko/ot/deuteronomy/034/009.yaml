  naturalness: 초안의 ‘충만했는데’는 요청된 현대 합쇼체 문맥에서 뒤 문장의 ‘때문입니다’ 및 ‘행했습니다’와 종결 방식이 일관되지 않습니다. 또한 ‘이스라엘의 아들들’은 한국어에서 부자연스럽고 이스라엘이라는 집단의 남성 자녀만을 뜻하는 것으로 오해될 수 있습니다. 관용적이고 원문의 혈연·언약 집단 표지도 유지하는 ‘이스라엘 자손들’이 적절합니다.
  terminology: ‘지혜의 영’, ‘안수’, ‘야훼’는 원문의 의미와 프로젝트 용어 선택을 적절히 반영합니다. רוּחַ를 ‘성령’으로 특정하지 않았습니다. 각주의 기존 대안은 본문 표현과 실질적으로 구별되지 않아, 자연스러운 대안 표현과 원문의 해석 가능성을 설명하도록 바로잡았습니다.
