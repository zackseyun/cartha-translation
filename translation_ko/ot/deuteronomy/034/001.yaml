base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
  footnotes:
  - marker: a
    text: Or 'the LORD caused him to see all the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 모압 평지에서 느보산, 곧 여리고 맞은편에 있는 비스가의 꼭대기로 올라갔습니다. 야훼께서 그에게 온 땅을 보여 주셨습니다. 곧 길르앗에서부터 단까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보여 주셨습니다’는 히필 ראה를 자연스럽게 옮긴 것입니다. 직역하면 ‘보게 하셨습니다’가 될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올랐습니다
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה는 위로 이동하는 뜻이므로, 현대 한국어에서는 자연스러운 ‘올라갔습니다’가 방향성을 가장 잘 살립니다.
- source_word: מֵעַרְבֹת מוֹאָב
  english_pob_choice: from the plains of Moab
  chosen_korean: 모압 평지에서
  alternatives_korean:
  - 모압의 평지에서
  - 모압 광야 평원에서
  lexicon: HALOT
  rationale: עַרְבוֹת는 이 지역의 평지/스텝 지대를 가리키므로, 간결하게 ‘모압 평지’로 옮겼습니다.
- source_word: וַיַּרְאֵהוּ יְהוָה
  english_pob_choice: the LORD showed him
  chosen_korean: 야훼께서 그에게 … 보여 주셨습니다
  alternatives_korean:
  - 주님께서 그에게 … 보여 주셨습니다
  - 야훼께서 그에게 … 보게 하셨습니다
  lexicon: HALOT
  rationale: 히필 ראה의 사역적 의미를 살리되, 한국어에서는 ‘보여 주셨습니다’가 가장 자연스럽고 원문의 원인-결과를 드러냅니다.
- source_word: אֶת כָּל הָאָרֶץ
  english_pob_choice: all the land
  chosen_korean: 온 땅
  alternatives_korean:
  - 모든 땅
  - 그 땅 전체
  lexicon: HALOT
  rationale: הָאָרֶץ는 여기서 단순한 지구가 아니라 약속된 땅의 범위를 가리키므로, ‘온 땅’으로 옮겨 전체성을 간결하게 살렸습니다.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  english_pob_choice: Gilead as far as Dan
  chosen_korean: 곧 길르앗에서부터 단까지
  alternatives_korean:
  - 길르앗에서 단까지
  - 길르앗부터 단까지
  lexicon: HALOT
  rationale: עַד는 범위의 끝을 나타내므로 ‘부터 …까지’ 구조로 옮겼고, 앞의 ‘곧’은 뒤의 열거적 구체화를 자연스럽게 이어 줍니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어휘에 따라 תetragrammaton은 통상적 대체어보다 고유명사적 음역인 ‘야훼’로 유지해, 본문이 드러내는 하나님의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
