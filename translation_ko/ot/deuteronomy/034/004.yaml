base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
  footnotes:
  - marker: a
    text: Or “to your seed.” The Hebrew uses a singular collective noun.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 그에게 말씀하셨습니다. 「이것이 내가 아브라함과 이삭과 야곱에게 맹세하며 ‘내가 네 후손에게 이것을 주겠다’고 말한 그 땅입니다. 내가 네 눈으로 그것을 보게 하였으나, 너는 거기로 건너가지 못할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 זֶרַע는 집합적 단수로, 영어 POB처럼 ‘offspring’ 또는 ‘seed’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주께서
  alternatives_korean:
  - 야훼께서
  - 주님께서
  lexicon: 표준 성경 용례 / 프로젝트 용어집
  rationale: 히브리어 원문은 신명기 내에서 하나님의 언약적 발화를 나타내지만, 한국어 본문은 문맥상 직접 발화 주체를 자연스럽게 드러내는 ‘주께서’로 옮겼습니다. 본 프로젝트 기본값인 야훼는 본문보다 각주나 주석에서 다루는 편이 더 적절한 경우입니다.
- source_word: זֹאת הָאָרֶץ
  english_pob_choice: This is the land
  chosen_korean: 이것이 … 그 땅입니다
  alternatives_korean:
  - 이 땅입니다
  - 이 나라입니다
  lexicon: HALOT
  rationale: הָאָרֶץ는 약속의 문맥에서 단순한 ‘땅/지역’보다 ‘그 땅’이 자연스럽고, 지시어 זֹאת의 현재적 지시를 살리기 위해 ‘이것이 … 그 땅입니다’로 옮겼습니다.
- source_word: לְזַרְעֲךָ
  english_pob_choice: to your offspring
  chosen_korean: 네 후손에게
  alternatives_korean:
  - 네 씨에게
  - 네 자손에게
  - 네 자손들에게
  lexicon: HALOT
  rationale: זרע의 집합적 단수는 한국어에서 문맥상 ‘후손’이 가장 자연스럽고, 영어 주해가 지적한 단수-집합성을 과도하게 분해하지도 않습니다.
- source_word: הֶרְאִיתִיךָ בְעֵינֶיךָ
  english_pob_choice: I have let you see it with your own eyes
  chosen_korean: 내가 네 눈으로 그것을 보게 하였으나
  alternatives_korean:
  - 내가 네 눈으로 그것을 보게 했으나
  - 내가 그것을 네게 보여 주었으나
  - 네 눈으로 그것을 보게 하였으나
  lexicon: HALOT
  rationale: הִפעִיל의 사역성을 살려 단순한 ‘보여 주다’보다 ‘보게 하다’로 옮겼고, בְעֵינֶיךָ는 관용적으로 ‘네 눈으로’로 표현했습니다.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  english_pob_choice: but you will not cross over there
  chosen_korean: 그러나 너는 거기로 건너가지 못할 것입니다
  alternatives_korean:
  - 그러나 너는 거기를 건너지 못할 것입니다
  - 그러나 너는 그곳으로 건너지 못할 것입니다
  - 그러나 너는 거기 들어가지 못할 것입니다
  lexicon: HALOT
  rationale: עבר는 단순한 ‘들어가다’보다 경계 너머로 ‘건너가다’의 공간적 이미지를 유지하는 것이 원문에 더 가깝기 때문에 이를 택했습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 처리
  chosen_reading: 본문에는 ‘주께서’로 두고, 야훼는 별도 주석에서 다룰 수 있게 합니다.
  alternative_readings:
  - 야훼께서
  - 여호와께서
  rationale: 이 절은 직설 인용과 역사서적 서술이 이어지는 문맥이라 한국어 가독성을 우선해 ‘주께서’로 자연화했습니다. 다만 프로젝트 기본 원칙상 야훼는 본문-주석 체계에서 보존할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
