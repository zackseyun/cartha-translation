reference: Deuteronomy 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
  footnotes:
  - marker: a
    text: Or 'prostrate yourself to them.' The Hebrew verb refers to the act of bowing down in reverence.
    reason: lexical_alternative
  - marker: b
    text: Or 'punishing' or 'calling to account' for the iniquity of fathers. The Hebrew says 'visiting,' a judicial term broad enough to include both reckoning and punishment.
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the third and on the fourth'; 'generations' is supplied in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 절하지도 말고 섬기지도 마십시오[a]. 나는 야훼, 당신의 하나님, 곧 질투하시는 하나님이기 때문입니다. 나는 조상들의 죄악을 자녀에게, 그리고 삼대와 사대까지, 나를 미워하는 자들에게 벌하십니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 엎드려 절하다.’ 히브리어 동사는 경의를 표하며 몸을 굽히는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벌하며’ 또는 ‘책임을 물으며.’ 히브리어는 ‘찾아오다/살피다’라는 법정적 용어를 쓰며, 책임 추궁과 처벌을 모두 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘세 번째와 네 번째까지’입니다. ‘세대들’은 영어에서 보충한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁתַּחֲוֶה
  english_pob_choice: bow down
  chosen_korean: 절하지도 말고
  alternatives_korean:
  - 엎드려 절하지도 말고
  - 경배하지도 말고
  lexicon: HALOT
  rationale: כָּוָה계 동사는 몸을 굽혀 경배하는 구체적 행위를 가리키므로, ‘절하다’로 옮겨 동작성을 살리고 ‘섬기다’와 구별했습니다.
- source_word: וְלֹא תָעָבְדֵם
  english_pob_choice: serve them
  chosen_korean: 섬기지도 마십시오
  alternatives_korean:
  - 봉사하지도 마십시오
  - 그들을 섬기지도 마십시오
  lexicon: HALOT
  rationale: עבד는 이 문맥에서 우상/신에게 드리는 예배적 섬김을 뜻하므로, 예배를 뜻하는 ‘경배하다’와 분리해 ‘섬기다’로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약적 고유명사인 여호와의 음역을 따라, 본 프로젝트 기본값인 ‘야훼’를 사용해 신적 이름을 제목어로 바꾸지 않았습니다.
- source_word: אֵל קַנָּא
  english_pob_choice: a jealous God
  chosen_korean: 질투하시는 하나님
  alternatives_korean:
  - 질투하시는 신
  - 열심이 많은 하나님
  lexicon: HALOT
  rationale: קַנָּא의 언약적 배타성을 한국어로 자연스럽게 드러내기 위해 형용사구보다 동사형 서술인 ‘질투하시는’으로 옮겼습니다.
- source_word: פֹּקֵד עֲוֺן אָבוֹת ...
  english_pob_choice: visiting the iniquity of fathers ...
  chosen_korean: 조상들의 죄악을 ... 벌하십니다
  alternatives_korean:
  - 조상들의 죄악을 ... 찾아내십니다
  - 조상들의 죄악을 ... 갚으십니다
  lexicon: HALOT
  rationale: פּקד는 단순 처벌보다 ‘찾아다니며 묻고 심판하다’의 법정적 뉘앙스가 있어, 문맥상 결과를 분명히 하는 ‘벌하다’로 번역하되 범위를 좁혔습니다.
- source_word: לְשֹׂנְאָי
  english_pob_choice: of those who hate me
  chosen_korean: 나를 미워하는 자들에게
  alternatives_korean:
  - 나를 미워하는 사람들에게
  - 나를 미워하는 자들 위에
  lexicon: HALOT
  rationale: 끝의 관계절이 심판의 대상을 한정하므로, ‘나를 미워하는 자들’이 조상 대자대손의 기계적 자동 처벌이 아니라 지속적 반역의 대상임을 드러내도록 옮겼습니다.
theological_decisions:
- issue: ‘질투하시는 하나님’의 표현 강도
  chosen_reading: 문맥의 언약적 배타성을 따라 ‘질투하시는 하나님’으로 직역성 있게 유지했습니다.
  alternative_readings:
  - 열심 있는 하나님
  - 배타적으로 요구하시는 하나님
  rationale: 이 단어는 감정적 질투만이 아니라 다른 신을 허락하지 않는 언약적 전속권을 뜻하므로, 완화하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: 조상의 죄악이 자녀에게 미치는 범위
  chosen_reading: 문장 끝의 ‘나를 미워하는 자들에게’가 심판의 대상을 한정하는 것으로 두었습니다.
  alternative_readings:
  - 후손에게 죄책이 자동 전가된다는 읽기
  - 세대별 개인 책임을 약화시키는 읽기
  rationale: 히브리어 어순과 POB 주석을 따라, 본문이 단순한 세대적 자동 처벌 공식을 말한다기보다 하나님을 미워하는 반역의 연속성 안에서의 심판을 말하도록 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
