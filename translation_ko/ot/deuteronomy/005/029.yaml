id: DEU.5.29
reference: Deuteronomy 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
  footnotes:
  - marker: a
    text: Or, 'If only they had such a heart as this.' The Hebrew opening is an idiom of longing, literally 'Who will give...?'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 그들이 이런 마음을 항상 지니면 좋겠습니다. 곧 나를 두려워하고 내 모든 명령을 그들의 모든 날 동안 지키며, 그리하여 그들과 그들의 자녀에게 영원히 잘되게 하려는 것입니다![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아’는 히브리어 מִי יִתֵּן의 소망 표현을 살린 감탄적 번역입니다. 직역하면 ‘누가 주겠습니까?’이지만, 본문은 실제 질문이 아니라 간구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that
  chosen_korean: 아
  alternatives_korean:
  - 오,
  - 누가 주겠습니까?
  - 만일
  lexicon: HALOT
  rationale: 히브리어 관용구의 소망·갈망을 한국어 감탄사로 옮겨, 수사적 질문이 아니라 바람의 뉘앙스를 살렸습니다.
- source_word: לְבָבָם זֶה
  english_pob_choice: such a heart as this
  chosen_korean: 이런 마음
  alternatives_korean:
  - 이 마음
  - 이와 같은 마음
  - 그런 마음
  lexicon: HALOT
  rationale: לֵב/לְבָב은 단순한 감정보다 의지와 내적 태도를 포함하므로, 합쇼체에서 자연스러운 ‘마음’으로 옮기되 질적 지시를 ‘이런’으로 살렸습니다.
- source_word: לְיִרְאָה אֹתִי וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  english_pob_choice: to fear me and to keep all my commandments
  chosen_korean: 나를 두려워하고 내 모든 명령을 지키며
  alternatives_korean:
  - 나를 경외하고 내 모든 계명을 지키며
  - 나를 두려워하며 내 모든 명령을 준수하며
  lexicon: HALOT
  rationale: ‘두려워하다’는 언약적 경외를 담는 성경적 관용을 유지했고, מצוות을 ‘계명’보다 본문 흐름에 맞는 ‘명령’으로 옮겼습니다.
- source_word: וְ/לִ/בְנֵי/הֶם
  english_pob_choice: and with their children
  chosen_korean: 그들의 자녀에게
  alternatives_korean:
  - 그들의 아들들에게
  - 그들의 자손에게
  lexicon: HALOT
  rationale: 문법적으로는 남성형이지만 문맥상 후손 일반을 가리키므로, 의미를 살려 ‘자녀’로 옮겼습니다.
theological_decisions:
- issue: לְבָבָם의 내적 인간 이해
  chosen_reading: ‘마음’은 단순한 생각이 아니라 하나님 앞의 내적 태도와 의지를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘생각’
  - ‘내적 소원’
  rationale: 본문의 순종은 인지 정보가 아니라 전인적 내면에서 나오는 것으로 제시되므로, 성경적 인간 이해를 흐리지 않도록 ‘마음’을 보존했습니다.
  doctrine_reference: 번역 원칙 §6; source meaning preservation
- issue: לְעֹלָם־־־־의 지속성
  chosen_reading: ‘영원히’로 옮겨, 세대에 걸친 지속을 간결하게 드러냈습니다.
  alternative_readings:
  - ‘영원토록’
  - ‘끝없이’
  rationale: 문맥상 언약적 복이 오래 지속된다는 뜻이므로, 과장 없이 표준적이고 자연스러운 종결 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §3; continuity of blessing
