  lexicon: HALOT
  rationale: 뒤이어 재산 목록이 이어지므로 ‘집’을 물리적 소유로 읽는 것이 자연스럽습니다. 다만 한국어에서도 ‘집’은 가정/재산의 함의를 함께 가질 수 있습니다.
theological_decisions:
- issue: 두 금지 동사의 구분을 한국어로 보존할 것인가
  chosen_reading: 첫째는 ‘탐내다’, 둘째는 ‘원하다’로 구분해 반복을 완화하면서도 서로 다른 동사를 살렸습니다.
  alternative_readings:
  - 두 동사를 모두 ‘탐내다’로 통일
  - 두 동사를 모두 ‘원하다’로 통일
  rationale: 히브리어는 관련되지만 동일하지 않은 두 동사를 의도적으로 병렬시킵니다. 한국어에서도 그 차이를 남겨 두어 계명의 수사 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
