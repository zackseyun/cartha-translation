  lexicon: HALOT
  rationale: 이 문맥은 가정 내 소유 항목의 열거이므로 종속적 신분이 분명합니다. 한국어에서는 ‘남종/여종’이 성별 구분과 고대 가정 종속성을 비교적 직접적으로 드러냅니다.
