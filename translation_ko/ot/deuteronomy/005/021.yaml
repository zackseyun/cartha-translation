  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male slave, his female slave, his ox, his donkey[b], or anything that belongs to your neighbor.
  footnotes:
  - marker: a
    text: Or 'you shall not crave.' The Hebrew uses a different verb here than the earlier 'covet,' likely to intensify or vary the prohibition rather than simply repeat it.
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also carry the broader sense of household or estate, though the following list of possessions favors the property sense here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이웃의 아내를 탐내지 마십시오. 또 이웃의 집, 그의 밭, 그의 남종, 그의 여종, 그의 소, 그의 나귀, 또는 이웃에게 속한 그 어떤 것도 원하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원하지 마십시오’는 앞의 ‘탐내지 마십시오’와 구별되는 두 번째 동사의 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 단순한 건물만이 아니라 가정 또는 재산권을 아우를 수 있지만, 이어지는 목록이 재산 항목들로 구성되므로 ‘집’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  english_pob_choice: covet
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 욕심내지 마십시오
  - 탐하지 마십시오
  lexicon: HALOT
  rationale: חמד의 불의한 소유 욕구를 한국어에서 가장 자연스럽고 윤리적 뉘앙스를 살려 옮기기 위해 ‘탐내다’를 택했습니다.
- source_word: תִתְאַוֶּה
  english_pob_choice: desire
  chosen_korean: 원하지 마십시오
  alternatives_korean:
  - 갈망하지 마십시오
  - 바라지 마십시오
  - 욕하지 마십시오
  lexicon: HALOT
  rationale: 앞의 ‘탐내다’와 구별되는 두 번째 동사를 한국어에서 너무 강하게 반복하지 않으면서도, 소유를 향한 의지적 욕구를 드러내는 표현으로 옮겼습니다.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  english_pob_choice: male slave / female slave
  chosen_korean: 남종 / 여종
  alternatives_korean:
  - 남자 노예 / 여자 노예
  - 종 / 여종
  - 하인 / 여종
  lexicon: HALOT
  rationale: 이 문맥은 가정 내 소유 항목의 열거이므로 종속적 신분이 분명합니다. 한국어에서는 ‘남종/여종’이 성별 구분과 고대 가정 종속성을 비교적 직접적으로 드러냅니다.
- source_word: בֵּית רֵעֶךָ
  english_pob_choice: your neighbor’s house
  chosen_korean: 이웃의 집
  alternatives_korean:
  - 이웃의 가정
  - 이웃의 집안
  - 이웃의 가옥
  lexicon: HALOT
  rationale: 뒤이어 재산 목록이 이어지므로 ‘집’을 물리적 소유로 읽는 것이 자연스럽습니다. 다만 한국어에서도 ‘집’은 가정/재산의 함의를 함께 가질 수 있습니다.
theological_decisions:
- issue: 두 금지 동사의 구분을 한국어로 보존할 것인가
  chosen_reading: 첫째는 ‘탐내다’, 둘째는 ‘원하다’로 구분해 반복을 완화하면서도 서로 다른 동사를 살렸습니다.
  alternative_readings:
  - 두 동사를 모두 ‘탐내다’로 통일
  - 두 동사를 모두 ‘원하다’로 통일
  rationale: 히브리어는 관련되지만 동일하지 않은 두 동사를 의도적으로 병렬시킵니다. 한국어에서도 그 차이를 남겨 두어 계명의 수사 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
