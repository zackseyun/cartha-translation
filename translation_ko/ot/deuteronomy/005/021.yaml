base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male slave, his female slave, his ox, his donkey[b], or anything that belongs to your neighbor.
  footnotes:
  - marker: a
    text: Or 'you shall not crave.' The Hebrew uses a different verb here than the earlier 'covet,' likely to intensify or vary the prohibition rather than simply repeat it.
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also carry the broader sense of household or estate, though the following list of possessions favors the property sense here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃의 아내를 탐내지 마십시오. 또한 이웃의 집[b], 그의 밭, 그의 남자 노예와 여자 노예, 그의 소와 나귀, 또는 이웃에게 속한 어떤 것도 원하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원하지 마십시오’는 앞의 ‘탐내지 마십시오’와 구별되는 두 번째 동사를 옮긴 것입니다. ‘갈망하지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 단순한 건물뿐 아니라 가정이나 재산을 가리킬 수도 있습니다. 그러나 이어지는 목록이 재산 항목들로 구성되어 있으므로 여기서는 ‘집’으로 옮겼습니다.
    reason: lexical_alternative
