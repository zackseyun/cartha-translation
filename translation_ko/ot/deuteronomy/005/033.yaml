- from: 너희 하나님 야훼께서 너희에게 명하신 모든 길로 걸어가야 합니다. 그리하면 너희가 살고, 복을 받고, 너희가 차지할 땅에서 너희의 날들이 길어질 것입니다.[a]
  to: 너희 하나님 야훼께서 너희에게 명하신 그 모든 길을 따라 걸어가야 합니다. 그러면 너희가 살고, 너희가 잘되고, 너희가 차지할[a] 땅에서 오래 살 것입니다.
