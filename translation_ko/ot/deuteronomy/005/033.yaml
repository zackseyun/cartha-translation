  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
  footnotes:
  - marker: a
    text: Or 'the land that you will inherit.' The Hebrew verb can carry both possession and inheritance senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 하나님 야훼께서 너희에게 명하신 모든 길로 걸어가야 합니다. 그리하면 너희가 살고, 복을 받고, 너희가 차지할 땅에서 너희의 날들이 길어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희가 상속할 땅에서”로도 옮길 수 있습니다. 히브리어 동사는 소유와 상속의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל הַ/דֶּרֶךְ
  english_pob_choice: in all the way
  chosen_korean: 모든 길로
  alternatives_korean:
  - 그 모든 길로
  - 온전한 길로
  - 모든 길에서
  lexicon: HALOT
  rationale: 히브리어의 단수 ‘길’ 이미지를 살리면서, 한국어에서는 ‘모든 길로’가 동사 ‘걸어가다’와 자연스럽게 결합하여 출애굽기-신명기의 언약적 행보 이미지를 유지합니다.
- source_word: צִוָּה
  english_pob_choice: has commanded
  chosen_korean: 명하신
  alternatives_korean:
  - 명령하신
  - 분부하신
  lexicon: HALOT
  rationale: 하나님의 권위 있는 명령을 드러내되, 현대 한국어에서 가장 직접적이고 자연스러운 표현은 ‘명하다’입니다.
- source_word: תֵּלֵכוּ
  english_pob_choice: You shall walk
  chosen_korean: 걸어가야 합니다
  alternatives_korean:
  - 걸어가십시오
  - 가야 합니다
  - 행해야 합니다
  lexicon: HALOT
  rationale: ‘걸어가다’는 히브리어의 윤리적 삶의 은유를 살리고, 단순한 이동보다 삶의 방식 전체를 뜻하는 ‘walk’의 의미를 자연스럽게 전달합니다.
- source_word: וְ/טוֹב לָ/כֶם
  english_pob_choice: that it may go well with you
  chosen_korean: 복을 받고
  alternatives_korean:
  - 잘되며
  - 평안하게 되며
  - 좋은 일이 있게 되며
  lexicon: HALOT
  rationale: 직역의 ‘너희에게 좋을 것입니다’보다, 언약적 복의 결과를 한국어로 분명히 드러내는 표현이어서 ‘복을 받고’로 옮겼습니다.
- source_word: וְ/הַאֲרַכְתֶּם יָמִים
  english_pob_choice: you may prolong your days
  chosen_korean: 너희의 날들이 길어질 것입니다
  alternatives_korean:
  - 너희 날수를 길게 할 것입니다
  - 오래 살게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘날들을 길게 하다’를 한국어로 자연스럽게 재현하면서도, 단순한 수명보다 언약적 장수의 약속을 보존합니다.
- source_word: תִּֽירָשׁוּן
  english_pob_choice: you will possess
  chosen_korean: 차지할
  alternatives_korean:
  - 상속할
  - 기업으로 받을
  - 소유할
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘상속’보다 땅을 실제로 받아 점유한다는 뜻이 강하므로, 신명기의 토지-수취 어감을 살리는 ‘차지하다’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기 언약명은 고유한 신적 이름이므로, 프로젝트 기준에 따라 ‘야훼’로 직역에 가깝게 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 언약적 복의 표현
  chosen_reading: 복을 받고
  alternative_readings:
  - 잘되고
  - 평안하고
  - 좋게 되고
  rationale: 본절의 목적절은 단순한 성공이 아니라 순종에 대한 언약적 복을 말하므로, 의미를 분명히 드러내는 방향을 택했습니다.
  doctrine_reference: Deuteronomy covenant blessing language
