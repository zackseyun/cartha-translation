  source_fidelity: 개정이 필요합니다. 초안은 히브리어의 핵심 요소를 대체로 담았지만, ‘여호와의 음성’을 먼저 말한 뒤 ‘살아 계신 하나님께서 … 말씀하시는 소리’를 덧붙여 원문의 단일한 구문을 중복·분절합니다. 또한 ‘말씀하시는 소리’는 ‘음성’(קוֹל)보다 부자연스럽고, ‘들은 뒤에도’는 원문에 없는 시간적 순서를 다소 강조합니다.
  naturalness: 개정문은 원문의 수식 관계를 따라 ‘살아 계신 하나님께서 불 가운데에서 말씀하시는 음성’을 한 덩어리로 처리하고, 한국어의 자연스러운 반문형 ‘누가 있겠습니까?’를 유지합니다. ‘육체를 지닌 모든 사람’은 히브리어 관용구를 이해 가능한 한국어로 옮기면서 각주로 그 직역적 표현과 의미를 보완합니다.
  terminology: ‘살아 계신 하나님’은 אֱלֹהִים חַיִּים의 문맥상 단수 칭호를 정확하고 자연스럽게 옮깁니다. ‘불 가운데에서’는 מִתּוֹךְ הָאֵשׁ의 내부·중심 이미지를 보존합니다. ‘살아남은’은 וַיֶּחִי의 놀라운 생존 의미를 문맥 안에서 자연스럽게 드러내며, 특정 교리적 해석을 더하지 않습니다.
