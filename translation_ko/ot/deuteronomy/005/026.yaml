  text: 살아 계신 하나님께서 불 가운데에서 말씀하시는 음성을 우리처럼 듣고도 살아남은 사람이 육체를 지닌 모든 사람[a] 가운데 누가 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
