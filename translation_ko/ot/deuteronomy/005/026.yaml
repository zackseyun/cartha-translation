  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
  footnotes:
  - marker: a
    text: Hebrew 'all flesh,' an idiom for mortal humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: “우리와 같이 여호와의 음성을 들은 뒤에도 살아 있는 사람이 육체를 가진 모든 사람 중에 누가 있겠습니까? 살아 계신 하나님께서 불 가운데에서 말씀하시는 소리를 들었는데도 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모든 육체’는 죽을 수밖에 없는 인간을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: “...말입니다”로 이어지는 이유 제시형 문장
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞 문맥의 두려움과 요청을 뒷받침하는 이유를 제시하므로, 한국어에서는 문장 전체를 반문형 이유 제시로 자연스럽게 살렸습니다.
- source_word: כָל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 육체를 가진 모든 사람
  alternatives_korean:
  - 모든 육체
  - 모든 인간
  lexicon: HALOT
  rationale: 직역 어감은 살리되 한국어에서 이해 가능한 표현으로 옮겨, 인간의 유한성과 피조성을 드러내는 관용적 뜻을 유지했습니다.
- source_word: אֱלֹהִים חַיִּים
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 살아 있는 하나님
  - 생존하시는 하나님
  lexicon: HALOT
  rationale: 하나님의 생명성과 인격적 현존을 자연스럽게 드러내는 한국어 관용을 택했으며, 문맥상 단수 칭호로 읽었습니다.
- source_word: מִתּוֹךְ הָאֵשׁ
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데에서
  alternatives_korean:
  - 불 한가운데에서
  - 불 속에서
  lexicon: HALOT
  rationale: ‘가운데에서’로 בתוך/중앙의 이미지를 보존하면서도 한국어 문장 흐름을 해치지 않도록 했습니다.
theological_decisions:
- issue: ‘all flesh’의 인간 이해
  chosen_reading: 육체를 가진 모든 사람
  alternative_readings:
  - 모든 육체
  - 모든 인간
  rationale: 히브리어 관용이 강조하는 인간의 유한성과 피조성을 약화시키지 않으면서도, 현대 한국어 독자가 즉시 이해할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘living God’의 신학적 칭호
  chosen_reading: 살아 계신 하나님
  alternative_readings:
  - 살아 있는 하나님
  - 생명하신 하나님
  rationale: 문맥상 이스라엘의 유일하신 하나님을 가리키므로 복수적 뉘앙스를 피하고, 전통적이되 현대적인 한국어 칭호로 유지했습니다.
  doctrine_reference: Affirmations; Translation philosophy §1
