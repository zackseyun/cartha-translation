  lexicon: HALOT
  rationale: 앞 문맥의 두려움과 요청을 뒷받침하는 이유를 제시하므로, 한국어에서는 문장 전체를 반문형 이유 제시로 자연스럽게 살렸습니다.
- source_word: כָל בָּשָׂר
