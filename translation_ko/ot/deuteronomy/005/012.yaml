  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
  footnotes:
  - marker: a
    text: Or 'Keep the Sabbath day' or 'Guard the Sabbath day.' The Hebrew verb emphasizes careful observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 안식일을 거룩하게 지키십시오[a]. 이는 당신의 하나님 야훼께서 명령하신 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안식일을 준수하십시오’ 혹은 ‘안식일을 보호하십시오’로 옮길 수 있습니다. 히브리어 동사는 주의 깊게 지키는 것을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  english_pob_choice: Observe
  chosen_korean: 기억하여 거룩하게 지키십시오
  alternatives_korean:
  - 지키십시오
  - 준수하십시오
  - 살피며 지키십시오
  lexicon: HALOT
  rationale: 히브리어는 단순 보존보다 주의 깊은 준수를 요구하는 명령형이며, 한국어에서는 ‘지키다’에 ‘거룩하게’의 목적을 붙여 예배적·언약적 준수의 뉘앙스를 살렸습니다.
- source_word: יוֹם הַשַׁבָּת
  english_pob_choice: the Sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 안식일 날
  - 안식의 날
  lexicon: HALOT
  rationale: 문맥상 특정한 절기일을 가리키므로 한국어에서는 관용적으로 ‘안식일’이 가장 자연스럽고, 영어의 ‘Sabbath day’와 같은 특정일 지시를 유지합니다.
- source_word: לְקַדְּשׁוֹ
  english_pob_choice: to keep it holy
  chosen_korean: 거룩하게 지키십시오
  alternatives_korean:
  - 그것을 거룩하게 하십시오
  - 그것을 성별하십시오
  lexicon: HALOT
  rationale: 목적의 לְ + 동사구를 한국어 목적어 없이 자연스럽게 풀어, ‘거룩하게 하다’의 상태적 결과를 강조하는 ‘지키다’와 결합했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신성 4문자 יהוה는 칭호가 아니라 고유명으로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 안식일 계명의 핵심 동사 뉘앙스
  chosen_reading: ‘기억하여 거룩하게 지키십시오’로 옮겨 단순 휴식이 아니라 언약적 준수와 구별의 의미를 드러냈습니다.
  alternative_readings:
  - ‘안식일을 지키십시오’
  - ‘안식일을 지키고 거룩하게 하십시오’
  rationale: 히브리어 שָׁמוֹר는 단순히 하루를 ‘쉬는 것’보다 सावधान한 준수와 보호의 뉘앙스가 있어, 한국어에서도 경건한 관찰을 분명히 해야 합니다.
  doctrine_reference: 신명기 5:12의 안식일 계명 이해
- issue: 하나님 이름의 번역
  chosen_reading: ‘야훼’로 표기하여 본문 속 언약적 고유명을 유지했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문이 יְהוָה를 직접 사용하므로, 번역본의 관례적 대체어보다 고유명 표기가 원문 관찰에 더 충실합니다.
  doctrine_reference: YHWH 표기 원칙
