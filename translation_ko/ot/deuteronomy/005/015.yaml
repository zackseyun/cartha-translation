revisions:
- from: 그리고 당신은 이집트 땅에서 노예였던 것을 기억해야 합니다[a]. 야훼 당신의 하나님이 거기서 강한 손과 펴신 팔로 당신을 이끌어 내셨으므로[b], 그러므로 야훼 당신의 하나님이 안식일을 지키라고 당신에게 명령하셨습니다.
  to: 당신이 이집트 땅에서 노예였던 것을 기억하십시오. 야훼, 당신의 하나님께서 강한 손과 뻗은 팔로[a] 그곳에서 당신을 이끌어 내셨습니다. 그러므로 야훼, 당신의 하나님께서 당신에게 안식일을 지키도록[b] 명령하셨습니다.
  rationale: 문장의 논리 구조를 원문에 맞게 정리하고, 명령적 어조를 자연스러운 합쇼체로 바로잡았습니다. 또한 신명과 ‘당신의 하나님’의 동격 관계를 쉼표로 명확히 했으며, 관용구를 ‘강한 손과 뻗은 팔’로 충실하게 옮겼습니다. 두 각주는 실제 설명 대상에 직접 연결되도록 재배치하고, 안식일 표현의 히브리어 직역 및 관용적 의미를 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:19Z'
