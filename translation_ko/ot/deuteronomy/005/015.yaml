base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a slave in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
  footnotes:
  - marker: a
    text: Or 'with a mighty hand.' The Hebrew idiom emphasizes the LORD's powerful act of deliverance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to do the Sabbath day'; the Hebrew idiom means to keep or observe it.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 이집트 땅에서 노예였던 것을 기억하십시오. 야훼, 당신의 하나님께서 강한 손과 뻗은 팔로[a] 그곳에서 당신을 이끌어 내셨습니다. 그러므로 야훼, 당신의 하나님께서 당신에게 안식일을 지키도록[b] 명령하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘강한 손과 뻗은 팔’입니다. 이 히브리어 관용구는 야훼의 강력한 구원 행위를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘안식일을 하도록’입니다. 히브리어 표현은 안식일을 지키거나 준수하라는 뜻입니다.
    reason: lexical_alternative
