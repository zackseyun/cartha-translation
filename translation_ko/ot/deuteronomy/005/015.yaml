base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a slave in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
  footnotes:
  - marker: a
    text: Or 'with a mighty hand.' The Hebrew idiom emphasizes the LORD's powerful act of deliverance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to do the Sabbath day'; the Hebrew idiom means to keep or observe it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 이집트 땅에서 노예였던 것을 기억해야 합니다[a]. 야훼 당신의 하나님이 거기서 강한 손과 펴신 팔로 당신을 이끌어 내셨으므로[b], 그러므로 야훼 당신의 하나님이 안식일을 지키라고 당신에게 명령하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예’는 히브리어 עֶבֶד가 가리키는 예속 상태를 드러내며, 여기서는 이집트에서의 억압과 해방을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘강한 손과 뻗은 팔’입니다. 히브리어 관용구는 야훼의 강력한 구원 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: And remember
  chosen_korean: 그리고 당신은 … 기억해야 합니다
  alternatives_korean:
  - 그리고 기억하십시오
  - 기억해야 합니다
  lexicon: WLC/HALOT
  rationale: 명령형 맥락의 기억 촉구를 살리되, 현대 표준어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종살이하는 자
  lexicon: HALOT
  rationale: 출애굽 전의 억압적 신분을 분명히 드러내기 위해, POB의 'slave'에 대응하는 '노예'를 택했습니다.
- source_word: בְּיָד חֲזָקָה וּבִזְרֹעַ נְטוּיָה
  english_pob_choice: with a strong hand and an outstretched arm
  chosen_korean: 강한 손과 펴신 팔
  alternatives_korean:
  - 능한 손과 펼친 팔
  - 강력한 손과 뻗은 팔
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 옮기되, 한국어에서 자연스러운 ‘펴신 팔’로 하나님의 구원 행위를 표현했습니다.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַּׁבָּת
  english_pob_choice: to observe the Sabbath day
  chosen_korean: 안식일을 지키라고
  alternatives_korean:
  - 안식일을 행하라고
  - 안식일을 준행하라고
  lexicon: HALOT
  rationale: 직역상의 ‘하다’보다 한국어 관용에 맞는 ‘지키다’가 מקור의 명령 의도를 더 분명하게 전달합니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 절은 출애굽 구원과 언약 명령을 연결하므로, 경칭 대체어보다 고유 신명인 야훼를 유지하는 것이 원문과 프로젝트 기준에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 출애굽의 구원 동기를 설명하는 관용구
  chosen_reading: 강한 손과 펴신 팔
  alternative_readings:
  - 힘센 손과 뻗은 팔
  - 능한 손과 펴신 팔
  rationale: 하나님의 능력 있는 구원을 나타내는 히브리어 관용구를 약화시키지 않기 위해, 전통적이지만 원문 의미를 충분히 담는 표현으로 옮겼습니다.
  doctrine_reference: 출 6:6; 신 4:34의 관용구 반복
