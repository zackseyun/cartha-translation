  alternative_readings:
  - 힘센 손과 뻗은 팔
  - 능한 손과 펴신 팔
  rationale: 하나님의 능력 있는 구원을 나타내는 히브리어 관용구를 약화시키지 않기 위해, 전통적이지만 원문 의미를 충분히 담는 표현으로 옮겼습니다.
