theological_decisions:
- issue: 여호와의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 절은 출애굽 구원과 언약 명령을 연결하므로, 경칭 대체어보다 고유 신명인 야훼를 유지하는 것이 원문과 프로젝트 기준에 부합합니다.
