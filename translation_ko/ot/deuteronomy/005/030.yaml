lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가라
  lexicon: HALOT
  rationale: לֵךְ의 명령형을 한국어 명령 연결형으로 자연스럽게 옮겨, 이어지는 ‘말하십시오’와 함께 파송-전달의 흐름을 살렸습니다.
- source_word: אֱמֹר
  english_pob_choice: say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 이르십시오
  lexicon: HALOT
  rationale: 단순한 발화 명령으로서 ‘say’의 기능을 반영하되, 공적 명령 상황에 맞는 합쇼체로 다듬었습니다.
- source_word: שׁוּבוּ
  english_pob_choice: Return
  chosen_korean: 돌아가십시오
  alternatives_korean:
  - 되돌아가십시오
  - 다시 가십시오
  lexicon: HALOT
  rationale: שׁוּבוּ의 핵심 의미는 ‘돌아가다’이며, 이 문맥에서는 출발지로 돌아가라는 해산 명령이므로 한국어로는 ‘돌아가십시오’가 가장 직접적입니다.
- source_word: לְאָהֳלֵיכֶם
  english_pob_choice: to your tents
  chosen_korean: 너희의 장막으로
  alternatives_korean:
  - 너희의 천막으로
  - 너희 집으로
  lexicon: HALOT
  rationale: אָהֶל의 문자적 의미를 살려 ‘장막’으로 옮겼습니다. 광야의 역사적 배경과 구체성을 보존하기 위해 ‘집’보다 직역성이 높은 표현을 택했습니다.
theological_decisions:
- issue: 해산 명령의 공적 어조
  chosen_reading: 하나님께서 모세를 통해 백성에게 내려보내는 명령의 어조를 살려, 합쇼체의 직접 명령으로 번역했습니다.
  alternative_readings:
  - 부드러운 권유체로 완화
  - 서술형으로 처리
  rationale: 본문은 단순 안내가 아니라 시내 산 신현 이후의 공식적 해산 명령이므로, 명령성의 강도를 보존하는 것이 의미상 중요합니다.
  doctrine_reference: 출애굽기 19–20장의 시내 산 언약 맥락
