id: DEU.5.23
reference: Deuteronomy 5:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/שָׁמְעֲ/כֶ֤ם אֶת הַ/קּוֹל֙ מִ/תּ֣וֹךְ הַ/חֹ֔שֶׁךְ וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וַ/תִּקְרְב֣וּ/ן אֵלַ֔/י כָּל רָאשֵׁ֥י שִׁבְטֵי/כֶ֖ם וְ/זִקְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
  footnotes:
  - marker: a
    text: Or 'the sound' instead of 'the voice'; Hebrew qol can denote either, but here 'voice' best fits the context of God speaking from the darkness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 여러분이 어둠 한가운데서 나오는 그 소리를 들었고[a], 산은 불에 타고 있었습니다. 그러자 여러분은 모두—곧 여러분의 지파의 모든 우두머리와 여러분의 장로들이—내게 다가왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음성’. 히브리어 qol은 ‘소리’와 ‘음성’을 모두 뜻할 수 있으나, 여기서는 하나님이 말씀하시는 문맥상 ‘소리’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקּוֹל
  english_pob_choice: the voice
  chosen_korean: 그 소리
  alternatives_korean:
  - 그 음성
  - 그 목소리
  lexicon: HALOT
  rationale: קול은 문맥에 따라 ‘소리’와 ‘음성’을 모두 가질 수 있는데, 본문은 하나님이 어둠 가운데서 말씀하시는 장면이므로 영어 POB의 설명을 따라 ‘소리’로 두되, 신적 발화의 인격성을 해치지 않도록 자연스럽게 살렸습니다.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  english_pob_choice: from the midst of the darkness
  chosen_korean: 어둠 한가운데서 나오는
  alternatives_korean:
  - 어둠 가운데서 나오는
  - 어둠 속에서 나오는
  lexicon: HALOT
  rationale: תּוֹךְ의 ‘한가운데, 중심’이라는 뜻을 살려 단순한 ‘어둠 속에서’보다 더 직접적으로 공간적 이미지를 전달했습니다.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  english_pob_choice: while the mountain was burning with fire
  chosen_korean: 산은 불에 타고 있었습니다
  alternatives_korean:
  - 산은 불타고 있었습니다
  - 산은 불길에 휩싸여 있었습니다
  lexicon: HALOT
  rationale: בֹּעֵר בָּאֵשׁ의 지속적·생생한 상태를 한국어 현재진행형이 아니라 서술형 진행 표현으로 옮겨 장면의 배경성을 살렸습니다.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  english_pob_choice: all the heads of your tribes
  chosen_korean: 여러분의 지파의 모든 우두머리
  alternatives_korean:
  - 여러분의 지파의 모든 지도자
  - 여러분의 모든 지파 우두머리
  lexicon: HALOT
  rationale: רָאשֵׁי를 직역하면 ‘머리들’이지만, 여기서는 지파를 대표하는 지도자를 뜻하므로 ‘우두머리’로 옮겨 히브리어의 은유를 유지했습니다.
- source_word: וְזִקְנֵיכֶם
  english_pob_choice: and your elders
  chosen_korean: 여러분의 장로들
  alternatives_korean:
  - 여러분의 늙은이들
  - 여러분의 원로들
  lexicon: HALOT
  rationale: זִקְנֵי는 단순한 나이 많은 사람보다 공동체의 공인된 장로를 가리키므로, 한국어에서도 제도적·사회적 기능이 드러나는 ‘장로들’을 택했습니다.
theological_decisions:
- issue: 하나님이 ‘소리’로 들리시는 표현의 번역 강도
  chosen_reading: ‘그 소리’로 직역적 긴장을 유지하되, 문맥상 하나님이 말씀하신다는 점이 자연스럽게 드러나도록 했습니다.
  alternative_readings:
  - ‘그 음성’으로 더 분명히 인격성을 강조하는 읽기
  - ‘그 말씀’으로 의미를 풀어 쓰는 읽기
  rationale: 원문 קול은 소리/음성의 중의성을 지니며, 본문은 그 신적 발화가 어둠 가운데서 들렸음을 강조합니다. 의미를 과도하게 정리하지 않고 양가성을 보존했습니다.
  doctrine_reference: 신적 계시의 청각적 현현
- issue: ‘산은 불에 타고 있었습니다’의 시각적 긴장
  chosen_reading: 배경 묘사로서 산의 불타는 상태를 유지해 시내 산 현현의 두려움과 장엄함을 살렸습니다.
  alternative_readings:
  - ‘산이 불타고 있었습니다’로 더 간결하게 처리
  - ‘산은 불길에 휩싸여 있었습니다’로 더 강하게 묘사
  rationale: 본문은 청중이 들은 것과 동시에 보았던 현상을 병치하여 현장감을 줍니다. 과장하거나 약화하지 않고 중간 강도로 옮겼습니다.
  doctrine_reference: 시내/호렙 현현의 표지
