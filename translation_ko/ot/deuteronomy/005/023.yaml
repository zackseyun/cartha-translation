revisions:
- from: 그런데 여러분이 어둠 한가운데서 나오는 그 소리를 들었고[a], 산은 불에 타고 있었습니다. 그러자 여러분은 모두—곧 여러분의 지파의 모든 우두머리와 여러분의 장로들이—내게 다가왔습니다.
  to: 여러분이 어둠 한가운데에서 그 음성을 들었을 때, 산은 불타고 있었습니다. 그러자 여러분의 모든 지파 우두머리와 장로들이 모두 내게 가까이 왔습니다.[a]
  rationale: 시간절과 산의 불타는 상태를 유지하면서, קול의 문맥상 의미를 ‘음성’으로 바로잡았습니다. 또한 지파 지도자와 장로라는 사회적 직분을 자연스러운 현대 한국어로 표현했습니다. 각주 표지는 본문에서 허용되는 어휘 대안을 명시하는 데 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:13Z'
