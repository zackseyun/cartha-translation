lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: Six days
  chosen_korean: 엿새 동안은
  alternatives_korean:
  - 여섯 날 동안은
  - 여섯 날은
  lexicon: HALOT
  rationale: 히브리어의 수사구는 기간을 나타내므로 한국어에서도 자연스러운 기간 표현인 '엿새 동안'으로 옮겼습니다. 문맥상 율법적 권면의 리듬을 살리기 위해 조사 '은'을 붙였습니다.
- source_word: תַּעֲבֹד
  english_pob_choice: you shall labor
  chosen_korean: 수고하고
  alternatives_korean:
  - 일하고
  - 노동하고
  lexicon: HALOT
  rationale: עבד는 여기서 단순한 '일하다'보다 생업적 수고를 가리키므로, 안식 규정과 대비되는 뉘앙스를 살려 '수고하다'를 택했습니다. 한국어에서는 앞 동사와 병렬되도록 동사형으로 처리했습니다.
- source_word: וְעָשִׂיתָ כָּל מְלַאכְתֶּךָ
  english_pob_choice: and do all your work
  chosen_korean: 네 모든 일을 하라
  alternatives_korean:
  - 네 모든 일을 행하라
  - 네 모든 업무를 하라
  lexicon: HALOT
  rationale: עשה와 מְלָאכָה의 결합은 '해야 할 일/일거리'를 뜻하므로, 현대 한국어에서 가장 자연스러운 '네 모든 일'로 옮겼습니다. '일을 하라'는 명령형을 유지하면서도 법문체의 간결함을 살렸습니다.
theological_decisions:
- issue: 법문체에서의 명령/지시의 힘
  chosen_reading: 직설적 명령형인 '…하라'로 옮겨, 허용이 아니라 언약 규정의 지시성을 드러냈습니다.
  alternative_readings:
  - …할 수 있다
  - …해도 된다
  rationale: 본문은 안식일 계명과 연결된 율법 문맥이므로 허용문으로 약화시키지 않고, 원문의 규범적 힘을 한국어 법문체로 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; covenantal legal register'
