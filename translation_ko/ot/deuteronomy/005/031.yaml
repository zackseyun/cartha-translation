base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
  footnotes:
  - marker: a
    text: Or 'the whole commandment.' The Hebrew uses a singular noun here, followed by the plural 'statutes' and 'judgments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to inherit it' or 'to take possession of it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 여기서 나와 함께 서 있어야 합니다. 내가 당신에게 모든 명령과 규례들과 법도를 말하여, 당신이 그것들을 그들에게 가르치게 하겠습니다. 그러면 그들이 내가 그들에게 주어 차지하게 하려는 그 땅에서 그것들을 행할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 단수 명사 ‘명령’을 쓰고 있으며, 뒤이어 복수형 ‘규례들’과 ‘법도들’이 나옵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 차지하게 하려는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  english_pob_choice: stand here with me
  chosen_korean: 여기서 나와 함께 서 있어야 합니다
  alternatives_korean:
  - 여기서 나와 함께 머물러야 합니다
  - 여기서 나와 함께 있어야 합니다
  lexicon: HALOT
  rationale: עָמַד의 직접적 동작인 ‘서다’를 살리고, פֹּה와 עִמָּדִי의 근접성과 동행성을 한국어 어순에 맞게 표현했습니다.
- source_word: אֵת כָּל הַמִּצְוָה
  english_pob_choice: all the commandment
  chosen_korean: 모든 명령
  alternatives_korean:
  - 모든 계명
  - 온전한 명령
  lexicon: HALOT
  rationale: 히브리어의 단수 מִצְוָה를 그대로 살리면서, 한국어에서는 자연스러운 ‘모든 명령’으로 옮겨 총체성을 반영했습니다.
- source_word: הַחֻקִּים וְהַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 규례들과 법도들
  alternatives_korean:
  - 율례들과 판단들
  - 규정들과 판결들
  lexicon: HALOT
  rationale: 법적·언약적 어감을 유지하면서 표준적인 성경 용례에 맞는 ‘규례’와 ‘법도’로 구분해 옮겼습니다.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  english_pob_choice: that you shall teach them
  chosen_korean: 당신이 그것들을 그들에게 가르치게 하겠습니다
  alternatives_korean:
  - 당신이 그것들을 그들에게 가르칠 것입니다
  - 당신은 그것들을 그들에게 가르쳐야 합니다
  lexicon: HALOT
  rationale: 지시의 목적과 위임의 뉘앙스를 살려, 모세에게 주어지는 하나님의 발화로서 자연스러운 한국어 위임형으로 표현했습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하게 하려는
  alternatives_korean:
  - 소유하게 하려는
  - 차지하려는
  lexicon: HALOT
  rationale: ‘inherit’보다 더 직접적인 점유·점령의 감각을 주는 ‘차지하다’를 택해, 약속의 땅 맥락을 분명히 했습니다.
theological_decisions:
- issue: מִצְוָה / חֻקִּים / מִשְׁפָּטִים의 삼중 표현
  chosen_reading: ‘명령, 규례들, 법도들’로 구별을 유지해 단순한 ‘율법’으로 뭉개지지 않게 했습니다.
  alternative_readings:
  - 율법과 규례와 법도
  - 계명과 규례와 판례
  rationale: 본문은 언약 교훈의 전체성과 구분을 강조하므로, 세 항목을 서로 다른 한국어로 남겨 소스의 법적 질감을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
