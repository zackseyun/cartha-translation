  verdict: revise
  source_fidelity: 현 초안의 ‘가르치게 하겠습니다’는 히브리어 תְּלַמְּדֵם(‘당신이 그들에게 가르칠’)을 하나님이 모세에게 가르치도록 ‘하게 하겠다’는 사역 표현으로 바꾸어 놓습니다. 또한 ‘주어 차지하게 하려는’은 땅을 주시는 분과 땅을 차지하는 자의 관계를 다소 불분명하게 합니다. 이를 바로잡아 명령, 가르침, 땅의 수여와 차지의 관계를 보존했습니다.
  naturalness: 합쇼체를 유지하되, 직접 호칭의 반복을 줄이고 문장을 현대 한국어에서 자연스럽게 정리했습니다. ‘서 있으십시오’는 פֹּה עֲמֹד עִמָּדִי의 지속적·엄숙한 명령을 자연스럽게 전달합니다.
  terminology: מִצְוָה / חֻקִּים / מִשְׁפָּטִים의 구별은 ‘명령 / 규례 / 법도’로 유지했습니다. מִצְוָה의 단수·집합적 용법은 본문에서 ‘모든 명령’으로 옮기고 주석으로 명시했습니다.
  issues:
  - severity: high
    issue: ‘당신이 그것들을 그들에게 가르치게 하겠습니다’
    rationale: 이는 ‘내가 당신이 가르치게 하겠다’라는 사역·허용의 의미가 될 수 있으나, 본문의 미완료형은 모세가 그 가르침을 수행할 것을 말합니다. ‘가르칠 것입니다’로 고쳐야 합니다.
  - severity: medium
    issue: ‘내가 그들에게 주어 차지하게 하려는 그 땅’
    rationale: ‘차지하게 하려는’은 누가 차지하는지와 누가 그렇게 하게 하는지를 흐립니다. לָהֶם과 여성 단수 접미사를 반영하여 ‘내가 그들에게 주어 그들이 차지할 땅’으로 명확히 하는 것이 안전합니다.
  - severity: low
    issue: 각주 표지가 모두 절 끝에 배치됨
    rationale: a는 ‘명령’의 단수에, b는 ‘차지할 땅’의 소유/상속 표현에 각각 붙여야 각주 앵커가 가리키는 대상을 분명히 알 수 있습니다.
