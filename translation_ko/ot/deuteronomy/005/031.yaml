- from: 그러나 당신은 여기서 나와 함께 서 있어야 합니다. 내가 당신에게 모든 명령과 규례들과 법도를 말하여, 당신이 그것들을 그들에게 가르치게 하겠습니다. 그러면 그들이 내가 그들에게 주어 차지하게 하려는 그 땅에서 그것들을 행할 것입니다.[a][b]
  to: 그러나 당신은 여기서 나와 함께 서 있으십시오. 내가 당신에게 모든 명령[a]과 규례들과 법도들을 말하겠습니다. 당신은 그것들을 그들에게 가르칠 것입니다. 그러면 그들이 내가 그들에게 주어 그들이 차지할 땅[b]에서 그것들을 행할 것입니다.
  rationale: 수정은 תְּלַמְּדֵם의 주체와 동작을 보존하고, לָהֶם לְרִשְׁתָּהּ의 수여자·수혜자·땅 지시 관계를 한국어로 명료하게 드러냅니다. 법률적 삼중 표현과 단수 ‘명령’의 정보는 유지했으며, 각주는 실제 해당 어구에 연결했습니다.
