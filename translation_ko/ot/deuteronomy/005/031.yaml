translation:
  language: ko
  text: 그러나 당신은 여기서 나와 함께 서 있으십시오. 내가 당신에게 모든 명령[a]과 규례들과 법도들을 말하겠습니다. 당신은 그것들을 그들에게 가르칠 것입니다. 그러면 그들이 내가 그들에게 주어 그들이 차지할 땅[b]에서 그것들을 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 단수 명사 ‘명령’을 쓰고 있으며, 뒤이어 복수형 ‘규례들’과 ‘법도들’이 나옵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅을 상속받기 위해’ 또는 ‘그 땅을 차지하기 위해’로 옮길 수 있습니다.
    reason: lexical_alternative
