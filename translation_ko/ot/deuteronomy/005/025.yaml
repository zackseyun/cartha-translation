  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; rendered ''the LORD'' in keeping with the project''s standard practice. Alternative: ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이제 왜 우리가 죽어야 합니까? 이 큰 불이 우리를 삼킬 것입니다. 우리가 계속해서 야훼 우리 하나님의 음성을 더 듣는다면, 우리는 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 본 역본은 이를 ‘야훼’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 문맥상 직전 상황을 받은 결론적 도입이므로, 한국어에서는 연결감이 살아 있는 간결한 ‘이제’가 가장 자연스럽습니다.
- source_word: תֹאכְלֵנוּ
  english_pob_choice: will consume us
  chosen_korean: 우리를 삼킬 것입니다
  alternatives_korean:
  - 우리를 먹어 버릴 것입니다
  - 우리를 집어삼킬 것입니다
  lexicon: HALOT
  rationale: 불을 주어로 한 파괴적 이미지이므로 ‘삼키다’가 ‘consume’의 힘과 심상을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공적 본문에서 하나님의 고유명을 보존하기 위해 관용적 대치어보다 음역 ‘야훼’를 채택합니다.
- source_word: קוֹל
  english_pob_choice: the voice
  chosen_korean: 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: HALOT
  rationale: 하나님의 말씀하시는 소리를 가리키는 문맥이므로 ‘음성’이 ‘voice’의 경외감과 구체성을 함께 살립니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 토라의 언약적 신명기를 직접 사용하므로, 본문이 가진 고유명과 계시성을 유지하는 쪽이 더 소스-직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 사람들이 두려움 속에서 말하는 직설적 결과 진술의 시제
  chosen_reading: 죽을 것입니다
  alternative_readings:
  - 죽게 될 것입니다
  - 죽습니다
  rationale: 히브리어의 결과 진술과 한국어의 예고적 미래가 맞물리므로, 두려운 필연성을 드러내는 미래형이 가장 적절합니다.
  doctrine_reference: Deut 5:25 narrative speech register
