base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
  footnotes:
  - marker: a
    text: Or 'besides me.' The Hebrew literally reads 'before my face,' which can express both presence and exclusivity.
    reason: alternative_reading
translation:
  language: ko
  text: 너는 내 앞에 다른 신들을 두어서는 안 됩니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나 외에.’ 히브리어는 문자적으로 ‘내 얼굴 앞에’라고 되어 있으며, 이는 ‘내 앞에’ 또는 ‘내 면전에서’라는 뜻과 ‘나 외에’라는 배타적 뜻을 함께 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  english_pob_choice: You shall have no
  chosen_korean: 너는 … 두지 말아야 합니다
  alternatives_korean:
  - 너는 … 없어야 합니다
  - 너는 … 가지지 말아야 합니다
  lexicon: HALOT
  rationale: ‘있다/되다’와 ‘너에게’의 관계를 한국어로 자연스럽게 풀면 소유 금지의 명령이 되므로, 합쇼체에서는 ‘두지 말아야 합니다’가 우상/신적 대상의 보유 금지를 가장 자연스럽게 전달합니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 이방 신들
  - 다른 신격들
  lexicon: HALOT
  rationale: 문맥상 야훼와 경쟁하는 실재적 신들을 가리키므로, ‘신들’이 직설적입니다. ‘이방’은 מקור에 없는 민족적 뉘앙스를 더하므로 본문에는 넣지 않았습니다.
- source_word: עַל פָּנָי
  english_pob_choice: before me
  chosen_korean: 나 외에
  alternatives_korean:
  - 내 앞에
  - 내 앞에서
  - 내 면전에서
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘내 얼굴/앞’이지만, 금지문의 용법에서는 배타성을 드러내는 ‘나 외에’가 한국어로 가장 자연스럽고, 영어 POB의 각주가 지적한 ‘besides me’ 가능성도 함께 살립니다.
theological_decisions:
- issue: עַל פָּנָי의 의미를 ‘before me’와 배타성 모두 살릴지 여부
  chosen_reading: 본문은 배타적 금지를 드러내는 ‘나 외에’로 옮기고, 주석 각주로 ‘내 앞에/내 면전에서’라는 공간적 뉘앙스를 암시합니다.
  alternative_readings:
  - 내 앞에 다른 신들을 두지 말아야 합니다
  - 내 면전에서 다른 신들을 두지 말아야 합니다
  rationale: 이 구절은 단순한 위치 표현을 넘어 언약적 배타성을 요구하므로, 한국어 본문은 의미를 분명히 하되 히브리어의 ‘얼굴 앞’ 표현이 가진 긴장은 각주로 보존하는 편이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 (Preserve theological tension rather than resolve it)'
