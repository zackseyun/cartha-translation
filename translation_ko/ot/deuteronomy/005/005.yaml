base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the face/presence of the fire,'' an idiom meaning ''because of the fire.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 그때 야훼와 여러분 사이에 서서 야훼의 말씀을 여러분에게 전해 드렸습니다. 여러분이 불 때문에 두려워하여 산에 올라가지 않았기 때문입니다. 말하자면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘불의 얼굴/앞에서’이지만, 여기서는 관용적으로 ‘불 때문에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֠נֹכִי עֹמֵ֨ד
  english_pob_choice: I was standing
  chosen_korean: 제가 그때 … 서서
  alternatives_korean:
  - 제가 서 있었습니다
  - 제가 서 있던 상태였습니다
  lexicon: HALOT
  rationale: 1인칭 강조 대명사와 진행적 분사를 자연스러운 과거 서술인 ‘… 서서’로 옮겨, 모세의 중재 위치를 현재적 장면감 없이도 드러냈습니다.
- source_word: בֵּין יְהוָ֤ה וּבֵינֵיכֶם
  english_pob_choice: between Yahweh and you
  chosen_korean: 야훼와 여러분 사이에
  alternatives_korean:
  - 야훼와 여러분 사이에
  - 주님과 여러분 사이에
  lexicon: HALOT
  rationale: 이 본문은 언약 이름 יְהוָה를 직접 사용하므로 프로젝트 기본값대로 ‘야훼’를 유지했습니다.
- source_word: לְהַגִּ֥יד לָכֶ֖ם אֶת דְּבַר יְהוָ֑ה
  english_pob_choice: to declare to you the word of Yahweh
  chosen_korean: 야훼의 말씀을 여러분에게 전해 드렸습니다
  alternatives_korean:
  - 야훼의 말씀을 여러분에게 선포했습니다
  - 야훼의 말씀을 여러분에게 알렸습니다
  lexicon: HALOT
  rationale: נגד의 히필은 단순 전달보다 공식적/중개적 전달을 가리키므로, ‘전해 드리다’로 모세의 중재적 역할을 살렸습니다.
- source_word: יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  english_pob_choice: you were afraid because of the fire
  chosen_korean: 여러분이 불 때문에 두려워하여
  alternatives_korean:
  - 여러분이 불을 두려워하여
  - 여러분이 불 앞에서 두려워하여
  lexicon: HALOT
  rationale: ‘불의 얼굴/앞에서’라는 관용구의 인과적 의미를 한국어에서 자연스러운 원인 표현으로 옮겼습니다.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  english_pob_choice: and did not go up the mountain
  chosen_korean: 산에 올라가지 않았기 때문입니다
  alternatives_korean:
  - 산에 올라가지 않았기 때문입니다
  - 산으로 올라오지 않았기 때문입니다
  lexicon: HALOT
  rationale: עלה + בהר의 방향성을 살리되, 한국어에서는 ‘산에 올라가다’가 가장 자연스럽고 문맥상 정확합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하자면,
  alternatives_korean:
  - 말하여 이르기를,
  - 이르시되,
  lexicon: HALOT
  rationale: 다음 절의 직접 화법 도입을 예고하는 담화 표지이므로, 한국어에서도 연결감을 유지하는 표현으로 처리했습니다.
