  rationale: 본문이 시내/호렙 언약 맥락에서 신명기적 하나님의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유명사성을 살린 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
