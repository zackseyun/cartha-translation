translation:
  language: ko
  text: '그때에 저는 야훼와 여러분 사이에 서 있었습니다. 야훼의 말씀을 여러분에게 전하기 위해서였습니다. 여러분이 불 때문에[a] 두려워하여 산에 올라가지 않았기 때문입니다. 야훼께서 이렇게 말씀하셨습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘불의 얼굴/앞에서’이지만, 여기서는 관용적으로 ‘불 때문에’라는 뜻입니다.
    reason: lexical_alternative
