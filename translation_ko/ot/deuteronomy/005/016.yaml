base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
  footnotes:
  - marker: a
    text: Or, 'that it may be well with you.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'in the land that the LORD your God is giving you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 아버지와 네 어머니를 공경하십시오[a]. 이것은 야훼 당신의 하나님께서 당신에게 명령하신 대로입니다[b]. 그러면 당신의 날들이 길어지고, 야훼 당신의 하나님께서 당신에게 주시는 땅에서 당신에게 잘될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신에게 잘되게 하려는 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘야훼 당신의 하나님께서 당신에게 주시는 땅에서입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  english_pob_choice: Honor
  chosen_korean: 공경하십시오
  alternatives_korean:
  - 존중하십시오
  - 영광을 돌리십시오
  lexicon: HALOT
  rationale: 부모를 ‘무겁게 여기다’는 원뜻을 관계적·윤리적으로 자연스럽게 살리면서, 명령형 합쇼체에 어울리는 표준 표현으로 옮겼습니다.
- source_word: אָבִיךָ ... אִמֶּךָ
  english_pob_choice: your father and your mother
  chosen_korean: 네 아버지와 네 어머니
  alternatives_korean:
  - 당신의 아버지와 당신의 어머니
  - 아버지와 어머니
  lexicon: HALOT
  rationale: 히브리어의 대칭을 살려 아버지와 어머니를 각각 분명히 적었습니다. 합쇼체 본문에서는 직접 인칭 대명사를 자연스럽게 최소화하되, 소유 관계는 분명히 유지했습니다.
- source_word: כַּאֲשֶׁר צִוְּךָ
  english_pob_choice: as ... commanded you
  chosen_korean: 명령하신 대로입니다
  alternatives_korean:
  - 명령하신 것처럼입니다
  - 명령하신 그대로입니다
  lexicon: HALOT
  rationale: 비교절의 의미를 한국어에서 가장 자연스럽게 전달하면서, 부모 공경 계명이 시내 언약의 기존 명령에 근거함을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기적 하나님의 이름을 титular한 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: on the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅 위에서
  - 그 땅 안에서
  lexicon: HALOT
  rationale: אֲדָמָה는 여기서 하나님이 주시는 언약의 땅을 가리키므로, 한국어에서는 자연스러운 공간 표현인 ‘땅에서’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와/주라는 대체 칭호가 아니라 야훼의 직접 표기를 사용하므로, 신명기 본문 고유의 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 부모 공경 명령에 붙은 약속의 성격
  chosen_reading: 장수와 형통의 약속을 본문 그대로 유지하되, 이를 개인적 보장으로도 국가적 상징으로도 축소하지 않습니다.
  alternative_readings:
  - 개인의 절대적 장수 보장
  - 공동체적 상징에 불과한 약속
  rationale: 히브리어 본문은 언약적 순종에 연결된 실제 약속을 말하지만, 해석을 한쪽으로 강제하지 않습니다. 번역은 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
