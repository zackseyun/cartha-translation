base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: ko
  text: 그리고 여러분은 말했습니다. ‘보십시오, 야훼 우리 하나님께서 우리에게 그의 영광과 그의 위대하심을 보여 주셨고, 우리는 불 가운데에서 나오는 그의 음성을 들었습니다. 오늘 우리는 하나님께서 사람과 말씀하셔도 그가 아직 살아 있다는 것을 보았습니다.’
  philosophy: formal
lexical_decisions:
- source_word: וַתֹּאמְרוּ / And you said
  english_pob_choice: And you said
  chosen_korean: 그리고 여러분은 말했습니다
  alternatives_korean:
  - 그리고 당신들은 말했습니다
  - 그리고 여러분이 말했습니다
  lexicon: אמר
  rationale: 직접 인용 앞의 서술을 자연스럽게 풀어, 복수 청자를 분명히 하면서도 구어체로 흐르지 않게 했습니다.
- source_word: כְּבֹדוֹ וְאֶת גָּדְלוֹ
  english_pob_choice: his glory and his greatness
  chosen_korean: 그의 영광과 그의 위대하심
  alternatives_korean:
  - 그의 영광과 그의 عظ대함
  - 그의 영광과 그의 크심
  lexicon: כבוד / גדול
  rationale: ‘위대하심’은 신적 위엄과 크기를 함께 살리며, 단순한 물리적 ‘크기’보다 본문 의도를 더 잘 드러냅니다.
- source_word: קֹלוֹ ... מִתּוֹךְ הָאֵשׁ
  english_pob_choice: we have heard his voice from the midst of the fire
  chosen_korean: 우리는 불 가운데에서 나오는 그의 음성을 들었습니다
  alternatives_korean:
  - 우리는 불 한가운데서 그의 음성을 들었습니다
  - 우리는 불 가운데서 그의 소리를 들었습니다
  lexicon: קול
  rationale: ‘음성’은 하나님의 말씀하심을 더 정확히 반영하고, ‘불 가운데에서 나오는’은 מן־תוך의 방향성을 살립니다.
- source_word: וָחָי
  english_pob_choice: and he still lives
  chosen_korean: 그가 아직 살아 있다는 것을
  alternatives_korean:
  - 그가 살아 있다는 것을
  - 그가 여전히 산다는 것을
  lexicon: חיה
  rationale: POB의 ‘still lives’를 한국어에서 자연스럽게 풀어, 하나님의 말씀하심과 사람의 생존 사이의 놀라운 긴장을 보존했습니다.
theological_decisions:
- issue: יְהוָה אֱלֹהֵינוּ의 신명기적 호칭
  chosen_reading: 야훼 우리 하나님
  alternative_readings:
  - 주 우리 하나님
  - 여호와 우리 하나님
  rationale: 프로젝트 기본값에 따라 야훼를 사용해 원어 신명성을 보존하고, 전통 교회어 ‘여호와’로 순치하지 않았습니다.
  doctrine_reference: YHWH transliteration policy
- issue: יְדַבֵּר אֱלֹהִים אֶת הָאָדָם וָחָי의 의미
  chosen_reading: 하나님께서 사람과 말씀하셔도 그가 아직 살아 있다는 것
  alternative_readings:
  - 하나님께서 사람과 말씀하시면 그가 살아 있다는 것
  - 하나님이 사람과 말씀하셔도 사람이 산다는 것
  rationale: 미완료/일반적 진술의 여지를 살려 ‘may speak’의 긴장을 유지했고, 결과절은 ‘아직 살아 있다’로 인간이 죽지 않고 견딘 충격을 강조했습니다.
  doctrine_reference: divine speech and human survival in Sinai theophany
