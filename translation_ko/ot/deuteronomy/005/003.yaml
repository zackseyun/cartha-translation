id: DEU.5.3
reference: Deuteronomy 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew reads 'our fathers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'cut this covenant.'
    reason: lexical_alternative
  - marker: c
    text: 'Some understand the contrast rhetorically: not with our fathers alone, but especially with us who are here alive today.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 우리 조상들과 맺으신 것이 아니라, 오늘 여기 살아 있는 우리와 맺으신 언약입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 고유명사로서의 신적 이름을 보존하기 위해 ‘야훼’로 옮겼습니다. 본절은 언약의 주체를 분명히 드러내므로 титул인 ‘주’로 바꾸지 않았습니다.
- source_word: כָּרַת ... אֶת הַבְּרִית
  english_pob_choice: made this covenant
  chosen_korean: 언약을 맺으신
  alternatives_korean:
  - 언약을 세우신
  - 언약을 끊으신
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘언약을 자르다’를 한국어 자연스러운 표현인 ‘언약을 맺다’로 옮기되, 대상이 분명하도록 ‘그것은’과 연결했습니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  lexicon: HALOT
  rationale: 직역하면 ‘우리 아버지들’이지만, 한국어에서는 혈통적 선조를 가리키는 ‘조상들’이 더 자연스럽고 오해가 적습니다. 영어 POB의 각주가 허용하는 어휘적 대안에 해당합니다.
- source_word: אִתָּנוּ / אֲנַחְנוּ אֵלֶּה / כֻּלָּנוּ חַיִּים
  english_pob_choice: with us—with us who are all here alive today
  chosen_korean: 오늘 여기 살아 있는 우리
  alternatives_korean:
  - 오늘 여기 있는 우리
  - 오늘 여기 살아 있는 우리 모두
  lexicon: HALOT
  rationale: 히브리어의 ‘with us—우리, 곧 이들—모두 살아 있음’이라는 강조를 한국어에서는 중복 어구보다 ‘오늘 여기 살아 있는 우리’로 압축해 살리되, 현재 생존한 세대라는 대비를 분명히 했습니다.
theological_decisions:
- issue: 이 구절이 조상들과의 언약 관계를 완전히 부정하는지, 아니면 현재 세대에게 언약이 직접 적용됨을 강조하는지
  chosen_reading: 본문의 대조를 그대로 살려 ‘우리 조상들과 맺으신 것이 아니라, 오늘 여기 살아 있는 우리와’라고 옮겼습니다.
  alternative_readings:
  - ‘조상들과만이 아니라 우리와’라는 완화된 해석
  - 언약 갱신을 강조하는 해석
  rationale: 히브리어에는 ‘오직’에 해당하는 제한어가 없으므로, 해석을 미리 봉합하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 해석을 본문 밖에서 조정하지 않고 문맥에 맡김
