reference: Deuteronomy 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
  footnotes:
  - marker: a
    text: Or “Listen, Israel.” The Hebrew imperative can denote attentive hearing that leads to obedience, not mere auditory reception.
    reason: lexical_alternative
  - marker: b
    text: “Judgments” may also be rendered “ordinances” or “rules.” The Hebrew term refers to legal decisions or prescribed norms.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 온 이스라엘을 불러 그들에게 말했습니다. 「이스라엘아, 오늘 내가 너희에게 말하는 규례들과 법규들[b]을 들으십시오[a]. 그것들을 배우고 지켜 행하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「들으십시오」는 단순한 청각이 아니라 순종을 수반하는 경청을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘법규’는 ‘법도’나 ‘규정’으로도 옮길 수 있습니다. 여기서는 משפטים의 법적·규범적 성격을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 불러모아
  lexicon: HALOT
  rationale: 회중 전체를 향해 부르는 서술적 동작을 자연스럽게 살리면서, 과도하게 공적 의례성을 더하지 않기 위해 ‘불러’를 선택했습니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 전체
  lexicon: HALOT
  rationale: 언약 공동체 전체를 가리키는 집합적 표현을 간결하게 살리기 위해 ‘온 이스라엘’을 택했습니다.
- source_word: הַחֻקִּים וְאֶת הַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 규례들과 법규들
  alternatives_korean:
  - 율례들과 판결들
  - 규례들과 규정들
  - 조례들과 법도들
  lexicon: HALOT
  rationale: 두 법률 용어의 구별을 유지하되, 한국어에서 서로 다른 두 범주의 언약 규범으로 읽히도록 ‘규례’와 ‘법규’를 대응시켰습니다. ‘법규’는 משפטים의 법적·규범적 성격을 전달하면서도 지나치게 사법적이지 않게 합니다.
- source_word: בְּאָזְנֵיכֶם
  english_pob_choice: in your hearing
  chosen_korean: 너희의 귀에
  alternatives_korean:
  - 너희가 듣는 가운데
  - 너희의 들음 속에
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설성을 살리기 위해 문자적 이미지인 ‘귀에’를 유지했습니다. 다만 한국어 문맥에서는 자연스럽게 읽히도록 전체 문장을 다듬었습니다.
theological_decisions:
- issue: שְׁמַע יִשְׂרָאֵל의 명령 강도
  chosen_reading: “이스라엘아 … 들으십시오.”
  alternative_readings:
  - “이스라엘아, 들으십시오.”
  - “이스라엘아, 들으라.”
  rationale: שׁמע는 단순 청취가 아니라 순종을 향한 경청을 포함하므로, 현대 합쇼체로도 명령의 무게가 살아나도록 ‘들으십시오’를 사용했습니다. 인용문 내부에서는 백성 전체를 향한 설교적 호소로 읽히게 했습니다.
  doctrine_reference: 번역 철학 §6 (읽기 쉬운 현대어, 그러나 명령의 신학적 무게 유지)
- issue: 끝부분 목적절의 표현
  chosen_reading: “그것들을 배우고 지켜서 실행하십시오.”
  alternative_readings:
  - “그것들을 배우고 지키십시오, 곧 실행하기 위해.”
  - “그것들을 배워 지키고 행하십시오.”
  rationale: 히브리어의 ‘배우다–지키다–행하다’의 연쇄를 끊지 않으면서, 목적/결과 관계를 한국어로 자연스럽게 드러내기 위해 ‘지켜서 실행하다’를 택했습니다.
  doctrine_reference: 번역 철학 §5 (핵심 용어의 일관성, 또는 근거 있는 예외)
