translation:
  language: ko
  text: 나는 야훼 당신의 하나님입니다[a]. 내가 당신을 이집트 땅에서, 노예들의 집에서 이끌어 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예들의 집에서’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘노예들의 집에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 내가 …이다
  - 나는 …이다
  lexicon: HALOT
  rationale: 첫 인칭 독립대명사의 자기 선언을 한국어에서 자연스러운 서술문으로 옮겨, 신적 자기계시의 엄숙함을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약명 יְהוָה를 번역어로 치환하지 않고 음역하여, 본문이 드러내는 고유한 신명성을 보존했습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 노예들의 집에서
  alternatives_korean:
  - 노예 생활의 집에서
  - 종살이의 집에서
  - 속박의 집에서
  lexicon: HALOT
  rationale: עֲבָדִים의 복수형을 반영해 '노예들'로 옮기고, 전통적 추상어보다 구체적 종속 상태를 드러내도록 했습니다.
- source_word: הוֹצֵאתִיךָ
  english_pob_choice: brought you out
  chosen_korean: 이끌어 냈습니다
  alternatives_korean:
  - 데리고 나왔습니다
  - 끌어냈습니다
  lexicon: HALOT
  rationale: 히필형의 '밖으로 나오게 하다'는 뜻을 한국어에서 자연스럽고 힘 있게 드러내기 위해 '이끌어 내다'를 사용했습니다.
theological_decisions:
- issue: 언약명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 시내 언약의 도입부에서 신적 고유명을 직접 사용하므로, 제목어가 아닌 고유명으로 표기해 자기계시의 강조를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עֲבָדִים의 사회적 강도
  chosen_reading: 노예들
  alternative_readings:
  - 종들
  - 종살이하는 사람들
  - 노동자들
  rationale: 출애굽 문맥에서 핵심은 단순한 고용 관계가 아니라 실제 속박 상태이므로, 전통적 완화어보다 '노예들'을 택해 해방의 강도를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms analogy for δοῦλος
