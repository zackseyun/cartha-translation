    rationale: 제공된 형태 מִצְוֹתָו는 ‘그의 계명’을 뜻합니다. 문맥적 조화 가능성을 이유로 본문을 ‘내 계명’으로 바꾸면 원문 표면형의 긴장이 사라집니다.
