translation:
  language: ko
  text: 그러나 나를 사랑하고 내 계명을 지키는 자들에게는 천대까지 인자하심을 베푸십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 본문 형태는 ‘그의 계명’으로 읽히지만, 문맥의 직접 화법에는 ‘내 계명’이 잘 맞습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  english_pob_choice: but showing
  chosen_korean: 그러나 … 베푸십니다
  alternatives_korean:
  - 그리고 … 베푸십니다
  - 또 … 베푸십니다
  lexicon: HALOT
  rationale: 앞 절의 심판 진술과 대조되는 이어짐을 한국어에서도 분명히 드러내기 위해 역접 ‘그러나’를 살렸고, 분사적 계속성을 ‘베푸십니다’로 자연스럽게 옮겼습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·신실한 사랑을 한국어 교회 언어에서 오해 없이 전달할 수 있는 표현으로 ‘인자하심’을 택했습니다. ‘긍휼’만으로는 언약적 사랑의 무게가 약해집니다.
- source_word: לַאֲלָפִים
  english_pob_choice: to thousands
  chosen_korean: 천대까지
  alternatives_korean:
  - 수천 명에게
  - 천 대까지
  - 수천 세대까지
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘수천/천들’로 되어 있어, 문맥상 확장된 ‘세대’는 넣지 않고 한국어 관용에 맞는 ‘천대까지’로 간결하게 옮겼습니다.
- source_word: מִצְוֹתָו
  english_pob_choice: his commandments
  chosen_korean: 내 계명
  alternatives_korean:
  - 그의 계명
  - 그분의 계명
  - 내 명령
  lexicon: HALOT
  rationale: 제공된 히브리어 형태는 3인칭 남성 단수 접미사로 읽히지만, 바로 앞뒤의 1인칭 직접 화법과 함께 보면 본문 전체의 발화자는 하나님이십니다. 영어 POB의 주석처럼 본문 변이를 드러내되, 한국어 본문은 문맥에 맞는 ‘내 계명’으로 두고 별도 각주로 본문 형태 차이를 표시했습니다.
theological_decisions:
- issue: ‘his commandments’와 문맥의 1인칭 화법 사이의 긴장
  chosen_reading: 본문은 문맥상 하나님께서 직접 말씀하시는 1인칭으로 읽히므로 한국어 본문에는 ‘내 계명’을 두고, 히브리어 표면형이 ‘그의 계명’으로 읽힐 수 있다는 점은 각주로 보존합니다.
  alternative_readings:
  - 그의 계명
  - my commandments와 his commandments 사이의 본문 전승 차이를 본문에 혼합해 표기
  rationale: 본문의 직접 화법을 해치지 않으면서도, 제공된 히브리어 형태가 문맥 기대와 어긋난다는 사실을 숨기지 않기 위해서입니다. 이는 원어 우선과 긴장 보존이라는 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy #1 (original-language primacy) and #3 (preserve theological tension rather than resolve it)'
