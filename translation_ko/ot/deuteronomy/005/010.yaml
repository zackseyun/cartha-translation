  source_fidelity: 수정이 필요합니다. 제공된 WLC 본문은 마지막 말을 3인칭 남성 단수 소유 접미사로 표기하므로, 본문 번역은 문맥에 맞추어 이를 ‘내 계명’으로 조화시키지 않고 ‘그의 계명’으로 옮겨야 합니다. 또한 לַאֲלָפִים에는 ‘세대’가 명시되어 있지 않으므로 ‘천대까지’는 원문에 없는 명사를 보충합니다.
  naturalness: ‘그러나 나를 사랑하고 그의 계명을 지키는 수천 명에게 변함없는 사랑을 베푸십니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘수천 명’의 ‘명’은 한국어에서 수량 명사를 자연스럽게 하기 위한 최소한의 보충이며, 원문의 대상이 되는 사람들을 문맥상 드러냅니다.
  terminology: חֶסֶד는 ‘변함없는 사랑’으로 옮겨 신실하고 지속적인 사랑의 뜻을 명료하게 전달했습니다. ‘계명’은 מִצְוֹת에 대한 정착된 적절한 번역입니다. 제공된 본문의 ‘그의 계명’과 문맥상 예상되는 ‘내 계명’의 긴장은 각주에서 보존합니다.
