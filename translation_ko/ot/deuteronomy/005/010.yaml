base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
  footnotes:
  - marker: a
    text: Some manuscripts and translations read 'my commandments,' which fits the surrounding first-person speech; the Hebrew text provided here reads 'his commandments.'
