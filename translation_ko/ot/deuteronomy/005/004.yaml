    text: 직역하면 ‘얼굴과 얼굴로’입니다. 이는 직접 대하여 말씀하셨다는 뜻의 히브리어 관용 표현입니다. 신명기 4:12에서는 이스라엘이 음성은 들었으나 어떤 형상도 보지 못했다고 합니다.
    reason: פָּנִים בְּפָנִים의 관용적 의미를 설명하고, 직접적 대면이라는 표현과 형상을 보지 못했다는 본문의 긴장을 해소하지 않은 채 보존합니다.
