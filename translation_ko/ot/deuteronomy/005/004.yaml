translation:
  language: ko
  text: 야훼께서 그 산에서 불 가운데서 얼굴과 얼굴을 마주하듯 여러분과 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  english_pob_choice: face to face
  chosen_korean: 얼굴과 얼굴을 마주하듯
  alternatives_korean:
  - 면전에서
  - 직접
  lexicon: HALOT
  rationale: 히브리어 관용구의 직접적이고 인격적인 대면성을 살리면서, 문자 그대로의 시각적 대면으로 오해될 가능성은 ‘-하듯’으로 완화했습니다.
- source_word: דִּבֶּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 선포하셨습니다
  lexicon: HALOT
  rationale: 하나님의 발화를 한국어 성경체에 자연스럽게 옮기되, 단순한 구어체 ‘말하다’보다 계시적 발화의 무게를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기 본문의 신적 고유명을 음역한 야훼를 유지했습니다.
- source_word: מִתּוֹךְ הָאֵשׁ
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데서
  alternatives_korean:
  - 불의 한가운데서
  - 불 속에서
  lexicon: HALOT
  rationale: ‘midst’의 중심성은 유지하되, 한국어에서는 ‘불 가운데서’가 가장 자연스럽고 위엄 있는 표현입니다.
theological_decisions:
- issue: ‘얼굴과 얼굴’ 표현이 신적 현현을 문자적 시각 경험으로 오해하게 할 가능성
  chosen_reading: 관용구를 보존하되 ‘-하듯’을 넣어 직접적 대면의 의미를 유지하면서도 시각적 오해는 피했습니다.
  alternative_readings:
  - 직접 여러분과 말씀하셨습니다
  - 여러분과 인격적으로 말씀하셨습니다
  rationale: 문맥상 이스라엘은 불 가운데서 음성을 들었지 형상을 본 것은 아니므로, 표현의 긴장감을 해치지 않으면서도 직역성을 일부 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
