revisions:
- from: 이 말씀들을 야훼께서 산 위에서 온 회중에게, 불 가운데에서, 구름과 짙은 어둠 속에서, 큰 소리로 말씀하시고 더 이상 하지 않으셨습니다. 그리고 그것들을 두 개의 돌판에 쓰시고 제게 주셨습니다.[a]
  to: 이 말씀들을 야훼께서 산에서 여러분의 온 회중에게 불과 구름과 짙은 어둠 가운데에서 큰 소리로 말씀하시고, 더 보태지 않으셨습니다.[a] 그리고 이 말씀들을 두 돌판에 기록하시어 내게 주셨습니다.
  rationale: 원문의 2인칭 소유 의미를 ‘여러분의 온 회중’으로 보완했습니다. 발화의 근원으로 병렬된 세 명사구는 ‘불과 구름과 짙은 어둠 가운데에서’로 일관되게 옮겼습니다. וְלֹא יָסָף는 본문에서 ‘더 보태지 않으셨습니다’로 번역하고, ‘계속 말씀하지 않으셨다’라는 가능한 이해는 바로 뒤의 각주에서 보존했습니다. 마지막 절은 원문의 목적어 반복을 한국어의 자연스러운 생략으로 처리하되, ‘이 말씀들을 두 돌판에 기록하시어 내게 주셨습니다’로 기록과 전달의 내용을 유지했습니다.
  reviewer_model: gpt-5.6-terra
