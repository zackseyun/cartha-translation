  source_fidelity: 수정이 필요합니다. 초안은 전반적인 의미와 야훼라는 신명 표기는 충실하나, כָּל קְהַלְכֶם의 2인칭 소유 의미(‘여러분의’)가 빠졌습니다. 또한 ‘더 이상 하지 않으셨습니다’는 무엇을 하지 않으셨다는 것인지 불명확하여 וְלֹא יָסָף의 의미를 자연스럽게 전달하지 못합니다. 히브리어의 중의성은 본문과 각주로 보존할 수 있습니다.
  naturalness: ‘불 가운데에서, 구름과 짙은 어둠 속에서’는 병렬된 명사구에 조사와 표현이 섞여 다소 부자연스럽습니다. ‘불과 구름과 짙은 어둠 가운데에서’로 통일하는 것이 자연스럽습니다. 또한 대명사를 반복하여 ‘그것들을 … 그것들을’이라고 하기보다, 두 번째 목적어는 한국어에서 생략하는 편이 명료하고 자연스럽습니다.
  terminology: ‘야훼’, ‘회중’, ‘돌판’, ‘큰 소리’는 현대 한국어의 격식 있는 성경 문체에 적절합니다. 다만 ‘온 회중’은 원문의 ‘your assembly’를 충분히 반영하도록 ‘여러분의 온 회중’으로 고칩니다.
  issues:
