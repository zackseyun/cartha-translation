  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
  footnotes:
  - marker: a
    text: Or, 'and he did not continue' (the Hebrew phrase can be understood as 'he added no more' or 'he did not continue speaking').
    reason: alternative_reading
translation:
  language: ko
  text: 이 말씀들을 야훼께서 산에서 여러분의 온 회중에게 불과 구름과 짙은 어둠 가운데에서 큰 소리로 말씀하시고, 더 보태지 않으셨습니다.[a] 그리고 이 말씀들을 두 돌판에 기록하시어 내게 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 말씀하시기를 계속하지 않으셨다’로 옮길 수 있습니다. 히브리어 표현은 ‘더 보태지 않으셨다’ 또는 ‘말씀하시기를 계속하지 않으셨다’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 주님의 고유 이름을 드러내기 위해 POB의 영어 선택을 따라 한국어도 야훼로 옮겼습니다.
- source_word: כָּל קְהַלְכֶם
  english_pob_choice: all your assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 공동체
  - 온 백성
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로, 제도적 뉘앙스보다 집합성을 살려 온 회중으로 옮겼습니다.
- source_word: קוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 우렁찬 소리로
  - 큰 음성으로
  lexicon: HALOT
  rationale: 직역하면 큰 소리/음성이며, 한국어에서는 큰 소리로가 자연스럽고 발화의 강도를 잘 드러냅니다.
- source_word: וְלֹא יָסָף
  english_pob_choice: and he added no more
  chosen_korean: 더 이상 하지 않으셨습니다
  alternatives_korean:
  - 더하지 않으셨습니다
  - 계속하지 않으셨습니다
  lexicon: HALOT
  rationale: 히브리어는 '더하지 않다'와 '계속하지 않다' 둘 다 가능하므로, 본문 흐름에 맞게 말씀이 더 이어지지 않았다는 의미를 살려 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 직접적 신명 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 출애굽기의 계시 장면이므로, 공통 번역 관행의 대체 тит툴보다 신명 자체를 드러내는 표기가 원문 충실성과 신학적 투명성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְלֹא יָסָף의 중의성 보존
  chosen_reading: 더 이상 하지 않으셨습니다
  alternative_readings:
  - 더 이상 계속하지 않으셨습니다
  - 더하지 않으셨습니다
  rationale: 이 표현은 완결성과 중단성을 모두 열어 두는 중의성이 있으므로, 단정적으로 하나만 확정하지 않고 문맥상 자연스러운 한국어로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
