  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
  footnotes:
  - marker: a
    text: Or 'for falsehood,' 'wrongfully,' or 'emptily.' The Hebrew can include false or empty use of the LORD's name, not only one specific kind of misuse.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not hold guiltless' or 'will not acquit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와 당신의 하나님의 이름을 헛되이 부르지 마십시오[a][b]. 여호와께서는 자기 이름을 헛되이 부르는 자를 결코 죄없다 하지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛되이’는 거짓, 공허함, 무가치함, 또는 부당한 사용까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘결코 죄없다 하지 않으십니다’는 ‘무죄로 여기지 않으십니다’, ‘면책하지 않으십니다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  english_pob_choice: take
  chosen_korean: 부르지 마십시오
  alternatives_korean:
  - 들지 마십시오
  - 메지 마십시오
  - 감당하지 마십시오
  lexicon: HALOT
  rationale: ‘이름을 take’라는 관용은 한국어에서 직역보다 자연스러운 ‘이름을 부르다/부르짖다’로 옮겨야 의미가 전달됩니다. 여기서는 단순 호출이 아니라 하나님의 이름을 입에 올려 사용하는 행위를 가리키므로 ‘부르지 마십시오’가 가장 간결합니다.
- source_word: לַשָּׁוְא
  english_pob_choice: in vain
  chosen_korean: 헛되이
  alternatives_korean:
  - 헛되게
  - 공허하게
  - 거짓되게
  lexicon: HALOT
  rationale: שָׁוְא는 공허함, 허무, 거짓됨, 무가치함을 아우르므로 한국어 관용구인 ‘헛되이’가 범위를 지나치게 좁히지 않으면서도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본 프로젝트 기본값은 ‘야훼’이지만, 이 절의 영어 POB와 오랜 한국어 성경 전통은 관용적으로 ‘여호와’를 사용합니다. 본 문맥에서는 독자가 즉시 पहचान할 수 있는 예전적 고유명 표기를 따르되, 의미는 원문의 신명성 유지에 맞춥니다.
- source_word: יְנַקֶּה (נקה)
  english_pob_choice: will not leave unpunished
  chosen_korean: 결코 죄없다 하지 않으십니다
  alternatives_korean:
  - 결코 용서하지 않으십니다
  - 결코 벌하지 않으십니다
  - 무죄하다고 선언하지 않으십니다
  lexicon: HALOT
  rationale: נקה는 단순한 감정적 비난이 아니라 법정적 무죄 선언/면책의 부정을 뜻합니다. 한국어에서는 ‘죄없다 하지 않다’가 ‘hold guiltless / acquit’의 법적 뉘앙스를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 신명기 5:11의 금지 범위
  chosen_reading: 주요 본문은 관용구를 유지해 하나님의 이름을 ‘헛되이 부르는’ 금지를 드러내고, 특정한 거짓 맹세만으로 좁히지 않았습니다.
  alternative_readings:
  - 거짓으로 하나님의 이름을 부르지 말라
  - 하나님의 이름을 함부로 사용하지 말라
  - 하나님의 이름을 공허하게 사용하지 말라
  rationale: 원문 לַשָּׁוְא는 거짓말, 공허한 사용, 무가치한 사용을 모두 포괄할 수 있어 의미 범위를 보존하는 것이 중요합니다. 따라서 본문은 익숙한 금지 형식을 유지하고, 그 의미의 폭은 번역 선택에 남겨 둡니다.
  doctrine_reference: 'Translation philosophy: preserve documented lexical/theological tension rather than collapsing it'
