translation:
  language: ko
  text: 여러분의 하나님 야훼께서 여러분에게 명령하신 그대로 주의하여 행하십시오. 오른쪽으로도 왼쪽으로도 벗어나지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘오른쪽이나 왼쪽으로 벗어나지 말라’는 관용 표현으로, 하나님께서 명하신 것에서 어느 방향으로도 이탈하지 말라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: be careful
  chosen_korean: 반드시 행하도록 주의하십시오
  alternatives_korean:
  - 조심하십시오
  - 주의 깊게 지키십시오
  - 삼가 행하십시오
  lexicon: HALOT
  rationale: שׁמר + 목적 부정사 구조는 단순한 보관보다 ‘주의를 기울여 순종하다’는 뜻이 강하므로, 현대 한국어에서 자연스러운 권면형으로 옮겼습니다.
- source_word: לַ/עֲשׂוֹת
  english_pob_choice: to do
  chosen_korean: 행하도록
  alternatives_korean:
  - 하도록
  - 실행하도록
  - 행하여
  lexicon: HALOT
  rationale: עשה는 여기서 명령받은 행동의 수행을 가리키므로, 법적·순종적 맥락을 살려 ‘행하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 여호와 대신 하나님의 고유명사인 ‘야훼’를 사용해 언약 이름을 드러냈습니다.
- source_word: לֹא תָסֻרוּ יָמִין וּ/שְׂמֹאל
  english_pob_choice: do not turn aside to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도 벗어나지 마십시오
  alternatives_korean:
  - 오른쪽이나 왼쪽으로 치우치지 마십시오
  - 우로나 좌로나 떠나지 마십시오
  lexicon: HALOT
  rationale: 관용구의 핵심은 어떤 방향으로도 명령에서 이탈하지 않는다는 뜻이므로, ‘벗어나지 마십시오’로 자연스럽게 풀어 의미를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
