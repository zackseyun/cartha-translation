lexical_decisions:
- source_word: תַעֲנֶה ... עֵד
  english_pob_choice: bear false witness
  chosen_korean: 거짓 증언을 하다
  alternatives_korean:
  - 거짓 증언하다
  - 거짓으로 증언하다
  - 거짓말로 증언하다
  lexicon: HALOT
  rationale: 법정 맥락의 ענה + עֵד 결합을 한국어에서 가장 자연스럽게 살리면서, 단순히 '답하다'가 아니라 증언 행위를 분명히 드러냈습니다.
- source_word: בְרֵעֲךָ
  english_pob_choice: against your neighbor
  chosen_korean: 이웃에게
  alternatives_korean:
  - 이웃을 상대로
  - 이웃에 대하여
  - 동료에게
  lexicon: HALOT
  rationale: בְ가 증언의 대상 관계를 나타내므로 한국어는 목적어 표지 '에게'로 옮겨, 법정에서 누군가를 향해 불리우는 증언이라는 점을 자연스럽게 표현했습니다.
- source_word: שָׁוְא
  english_pob_choice: 'false'
  chosen_korean: 거짓
  alternatives_korean:
  - 헛된
  - 허망한
  - 거짓된
  lexicon: HALOT
  rationale: 이 구절은 '거짓 증언'이라는 법적 관용구로 읽히므로, שָׁוְא의 '허무함'보다 허위성에 초점을 맞춘 '거짓'이 가장 정확합니다.
theological_decisions:
- issue: 계명 문장의 금지 명령 형식
  chosen_reading: 한국어는 직접 금지형 '...하지 마십시오'로 옮겨, 히브리어 금령의 명령성을 분명히 했습니다.
  alternative_readings:
  - '...하지 말라'
  - '...해서는 안 됩니다'
  rationale: 율법 조항의 직접성과 권위를 살리면서도 현대 표준어 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: 신명기 율법의 언약적 금령
