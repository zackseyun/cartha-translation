  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
  footnotes:
  - marker: a
    text: Or 'the voice of your words'; Hebrew קול דבריכם uses an auditory idiom.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have done well in all that they have said.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 여러분이 내게 말씀하실 때에 하신 말씀의 소리를 들으셨고, 주님께서 내게 말씀하셨습니다. 「내가 이 백성이 네게 한 말의 소리를 들었다. 그들은 네게 한 모든 말이 옳았다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 말의 소리’; 히브리어 קול דבריכם는 청각적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 말한 모든 것이 옳았다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB 영어는 Yahweh를 쓰지만, 한국어 본문은 이 문맥의 자연스러운 신칭으로 ‘주님’을 택했습니다. 본 절은 화자-서술 흐름이 중심이라 이름의 음역을 본문에 직접 드러내기보다, 표준적 예배 언어로 읽히는 ‘주님’이 적절합니다.
- source_word: קוֹל דִּבְרֵיכֶם
  english_pob_choice: the sound of your words
  chosen_korean: 말씀하실 때에 하신 말씀의 소리
  alternatives_korean:
  - 당신들의 말의 소리
  - 말소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’이고, דִּבְרֵיכֶם은 ‘너희의 말’이므로 청각적 관용구를 살려 ‘말씀… 하신 말씀의 소리’로 옮겼습니다. 직역형 ‘말의 소리’도 가능하지만 한국어에서는 반복이 어색해 문맥상 자연스럽게 다듬었습니다.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  english_pob_choice: they have spoken well in all that they have said
  chosen_korean: 네게 한 모든 말이 옳았다
  alternatives_korean:
  - 네게 한 모든 말이 잘되었다
  - 네게 한 모든 말이 좋았다
  lexicon: HALOT
  rationale: הֵיטִיבוּ는 단순히 ‘잘했다’보다 판단적 승인에 가깝기 때문에, 발화 내용의 타당성을 드러내는 ‘옳았다’로 옮겼습니다. 말한 행위 자체와 평가를 함께 담아 POB의 의미 범위를 유지합니다.
theological_decisions:
- issue: 야훼(주님) 호칭의 한국어 처리
  chosen_reading: 본문에서는 ‘주님’으로 번역하고, 주석 없이도 읽히는 현대 한국어 예배어를 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원문은 여호와 신명인데, 본문 흐름상 직접 음역보다 주님 호칭이 문장 전체를 더 자연스럽게 살립니다. 다만 POB의 신명 보존 원칙과는 긴장이 있으므로, 본문 안에서는 통용성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
