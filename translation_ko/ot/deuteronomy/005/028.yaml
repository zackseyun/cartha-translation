  to: 야훼께서 여러분이 내게 말할 때에 여러분의 말소리를 들으셨습니다. 야훼께서 내게 말씀하셨습니다. “내가 이 백성이 네게 한 말소리를 들었습니다. 그들은 말한 모든 면에서 잘했습니다.”[a][b]
