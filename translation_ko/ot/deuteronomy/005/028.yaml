  source_fidelity: 수정이 필요합니다. יְהוָה는 원문에 두 차례 명시되어 있고 영어 POB도 ‘Yahweh’를 채택하므로, ‘주님’으로 일반화하면 신명을 보존하지 못합니다. 또한 첫 구절의 ‘말씀하실 때에 하신 말씀’은 원문의 ‘너희가 내게 말할 때에 너희 말소리’를 불필요하게 중복하고, 백성의 발화를 높이는 ‘말씀’은 문맥상 적절하지 않습니다.
  naturalness: ‘여러분이 내게 말할 때에 여러분의 말소리’는 히브리어의 청각 관용구를 유지하면서도 자연스럽습니다. 인용문 마지막은 הֵיטִיבוּ의 행위 평가와 ‘그들이 말한 모든 것’의 범위를 함께 반영하여 ‘그들은 말한 모든 면에서 잘했습니다’로 옮겼습니다.
  terminology: 신명 יְהוָה는 POB의 선택을 따라 ‘야훼’로 통일했습니다. 사람들의 발화에는 ‘말’을, 야훼의 발화에는 존칭 서술어 ‘말씀하셨습니다’를 사용했습니다.
