  rationale: פֶסֶל의 물질적·제작적 성격을 살려 ‘조각한’으로 옮겼고, 해석을 앞세운 ‘우상’은 본절만으로는 이르다고 보았습니다.
- source_word: כָּל תְּמוּנָה
  english_pob_choice: any likeness
  chosen_korean: 어떤 형상이든지
  alternatives_korean:
