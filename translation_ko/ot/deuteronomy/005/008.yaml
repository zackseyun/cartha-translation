translation:
  language: ko
  text: 너를 위하여 조각한 형상[a]이나, 위의 하늘에 있는 것이나 아래의 땅에 있는 것이나 땅 아래 물속에 있는 것의 어떤 형상이든지[b] 만들지 말라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상’. 히브리어는 흔히 우상 숭배와 관련된 조각된 형상을 가리키지만, 여기서는 구체적인 뜻을 살려 ‘조각한 형상’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어떤 모양이든지’.
    reason: lexical_alternative
