theological_decisions:
- issue: 본절의 금지 범위와 우상숭배 해석의 분리
  chosen_reading: 형상을 만드는 행위 자체를 금지하는 본문의 진술만 옮기고, 그것을 예배·경배 금지로 확대하는 해석은 다음 절에 맡겼습니다.
  alternative_readings:
  - ‘우상을 만들지 말라’로 해석을 앞당기는 번역
  rationale: 본문은 ‘만들다’의 금지에 초점이 있으며, 예배 행위에 대한 금지는 다음 절에서 이어집니다. 문맥의 진행을 보존하기 위해 의미 확장을 자제했습니다.
  doctrine_reference: Translation philosophy §§1, 3
