  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
  footnotes:
  - marker: a
    text: Or 'an idol' for 'a carved image'; the Hebrew term often refers to an image used in idolatry, but the more concrete wording is retained here.
    reason: lexical_alternative
  - marker: b
    text: Or 'any form' for 'any likeness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희를 위하여 조각한 형상[a]이나, 위 하늘에 있는 것, 아래 땅에 있는 것, 땅 아래 물속에 있는 어떤 형상이든지 [b]만들지 말라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상’으로 옮길 수 있으나, 여기서는 히브리어의 더 구체적인 ‘조각한 형상’이라는 뜻을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 형상’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
