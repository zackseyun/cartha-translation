  - 어떤 형상
  lexicon: HALOT
  rationale: כָּל의 포괄성을 한국어 관용에 맞게 ‘어떤 …든지’로 풀어, 뒤따르는 영역 규정이 모든 대표 양식을 포괄함을 드러냈습니다.
- source_word: בַּשָּׁמַיִם מִמַּעַל / בָּאָרֶץ מִתָּחַת / בַּמַּיִם מִתַּחַת לָאָרֶץ
  english_pob_choice: of what is in the heavens above, or on the earth beneath, or in the waters under the earth
  chosen_korean: 위 하늘에 있는 것, 아래 땅에 있는 것, 땅 아래 물속에 있는 것
  alternatives_korean:
  - 하늘 위에 있는 것, 땅 아래 있는 것, 땅 아래 물속에 있는 것
  - 위의 하늘에 있는 것, 아래의 땅에 있는 것, 땅 아래 물속에 있는 것
  lexicon: HALOT
  rationale: 히브리어의 상하 우주 질서를 보존하면서도 한국어 어순을 자연스럽게 다듬었습니다. ‘위/아래’는 지시 관계를 살리고, ‘물속에 있는 것’은 בַּמַּיִם의 자연스러운 현대어 표현으로 옮겼습니다.
theological_decisions:
- issue: 본절의 금지 범위와 우상숭배 해석의 분리
  chosen_reading: 형상을 만드는 행위 자체를 금지하는 본문의 진술만 옮기고, 그것을 예배·경배 금지로 확대하는 해석은 다음 절에 맡겼습니다.
  alternative_readings:
  - ‘우상을 만들지 말라’로 해석을 앞당기는 번역
  rationale: 본문은 ‘만들다’의 금지에 초점이 있으며, 예배 행위에 대한 금지는 다음 절에서 이어집니다. 문맥의 진행을 보존하기 위해 의미 확장을 자제했습니다.
  doctrine_reference: Translation philosophy §§1, 3
