  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: ko
  text: 당신은 가까이 가서 야훼 우리 하나님께서 말씀하시는 모든 것을 들으십시오. 그리고 야훼 우리 하나님께서 당신에게 말씀하시는 모든 것을 우리에게 전해 주십시오. 그러면 우리는 듣고 행하겠습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 본문은 첫 동사와 마지막 응답에서 '듣다'의 반복을 통해, 단순 청취가 아니라 순종을 전제하는 들음을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: קְרַב אַתָּה
  english_pob_choice: You go near
  chosen_korean: 당신은 가까이 가서
  alternatives_korean:
  - 당신이 가까이 오십시오
  - 가까이 가십시오
  lexicon: קָרַב
  rationale: 명령의 동작을 자연스럽게 살리되, 본문의 전면적 직접지시를 현대 한국어 합쇼체로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: the LORD our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 주 우리 하나님
  lexicon: יהוה
  rationale: 프로젝트 기본어인 '야훼'를 유지하여 원문 고유명과 외경성/검증 가능성을 살렸습니다.
- source_word: וּשֲׁמָע / וְשָׁמַעְנוּ
  english_pob_choice: hear / we will hear
  chosen_korean: 들으십시오 / 듣고
  alternatives_korean:
  - 들으시고 / 들을 것이며
  - 들으십시오 / 우리가 듣겠습니다
  lexicon: שׁמע
  rationale: 첫 번째는 명령으로, 마지막은 응답적 순종을 나타내는 완료적 뉘앙스를 살려 '듣고 행하겠습니다'로 자연스럽게 연결했습니다.
- source_word: יֹאמַר ... יְדַבֵּר
  english_pob_choice: says / speaks
  chosen_korean: 말씀하시는 / 말씀하시는
  alternatives_korean:
  - 말하는 / 이르시는
  lexicon: אמר / דבר
  rationale: 두 동사가 모두 하나님의 발화를 가리키므로, 한국어에서는 중복을 피하면서도 하나님의 권위 있는 발화를 드러내는 '말씀하시다'로 옮겼습니다.
theological_decisions:
- issue: 두 동사의 차이(אמר/דבר)를 한국어에서 어떻게 처리할지
  chosen_reading: '''말씀하시는''을 반복해 발화의 권위를 유지하되, 한국어 중복으로 인한 어색함은 감수했습니다.'
  alternative_readings:
  - '''말씀하시는''과 ''말씀하시는/말하시는''으로 구분'
  - 둘 다 단순히 '말씀하시는'으로 통일
  rationale: 본문은 두 표현 모두 야훼의 발화를 강조하므로, 일반적 의역보다 신적 발화의 무게를 보존하는 쪽이 소스 충실성에 더 부합합니다.
  doctrine_reference: 신 5:27의 언약적 중개 장면
- issue: 모세의 발화 대상과 화자의 관계를 현대 독자에게 어떻게 예의 있게 전달할지
  chosen_reading: 직접 명령형이지만, 한국어에서는 '당신은 ... 하십시오'로 옮겨 본문의 긴박성과 공적 장면을 유지했습니다.
  alternative_readings:
  - '''너는 ... 해라'''
  - '''당신이 ... 하십시오'''
  rationale: 회중 앞에서의 정식 요청이라는 맥락을 살리면서도, 현대 표준어의 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 언약 중재와 회중의 동의 구조
