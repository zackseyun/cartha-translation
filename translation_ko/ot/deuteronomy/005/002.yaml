  rationale: 1인칭 복수 소유격은 한국어에서도 자연스럽게 '우리 하나님'으로 옮겨 언약적 소속 관계를 분명히 했습니다.
- source_word: כָּרַת בְּרִית
  english_pob_choice: made a covenant
