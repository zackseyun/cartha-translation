  - 언약을 만드셨습니다
  - 언약을 자르셨습니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 '언약을 자르다'라는 배경은 살리되, 한국어 본문은 관용적으로 '언약을 맺다'가 의미를 가장 정확하고 자연스럽게 전달합니다.
- source_word: בְּחֹרֵב
  english_pob_choice: at Horeb
  chosen_korean: 호렙에서
  alternatives_korean:
  - 호렙에
  - 호렙에서
  lexicon: HALOT
  rationale: 지명 חֹרֵב은 음역해 '호렙'으로 두고, 장소 표지는 문맥상 자연스러운 부사격 '에서'로 처리했습니다.
theological_decisions:
- issue: יהוה의 표기와 번역
  chosen_reading: 본문에서는 '야훼'를 사용해 하나님의 언약적 이름을 직접 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 시내/호렙 언약의 체결을 회상하므로, 단순한 호칭보다 언약 이름을 보존하는 것이 본문의 신학적 무게를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
