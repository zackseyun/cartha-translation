    rationale: ‘아말렉의 기억을 하늘 아래에서 지워’는 단지 하늘 아래라는 장소에서 지우는 듯 들릴 수 있습니다. ‘하늘 아래에서 아말렉에 대한 기억을 지워’로 두어 원문의 관용적 전 범위를 더 잘 드러냅니다.
