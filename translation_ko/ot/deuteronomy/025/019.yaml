revisions:
- from: 야훼 너의 하나님이 너를 둘러싼 네 모든 원수에게서 사방으로부터 너에게서 쉬게 하시고, 야훼 너의 하나님이 네게 상속으로 주어 소유하게 하시는 땅에서, 너는 아말렉의 기억을 하늘 아래에서 지워 버려야 합니다. 잊어서는 안 됩니다.[a]
  to: 야훼 너의 하나님께서 네 주위의 모든 원수에게서 너에게 안식을 주실 때, 곧 야훼 너의 하나님께서 네게 상속 재산으로 주시어 차지하게 하시는 땅에서, 너는 하늘 아래에서 아말렉에 대한 기억[a]을 지워야 합니다. 잊지 마십시오.
  rationale: 원문의 시간절(‘…안식을 주실 때’)과 ‘원수에게서’의 관계를 회복하고, 토지 수여·점유의 목적 관계를 자연스러운 합쇼체로 정리했습니다. ‘하늘 아래에서’는 원문의 관용적 범위를 보존하되 아말렉에 대한 기억을 지우라는 명령을 명확히 수식하도록 배치했습니다. 각주는 본문과 중복되지 않게 고치고 해당 어휘에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:44Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ‘מִכָּל אֹיְבֶיךָ מִסָּבִיב’을 ‘너를 둘러싼 네 모든 원수에게서 사방으로부터 너에게서’로 옮겨, ‘모든 주변 원수에게서 안식을 주심’이라는 수식 관계와 의미가 무너졌습니다. 또한 ‘미תחת השמים’은 단순한 행위 장소가 아니라 전 범위에서 지워 냄을 나타내므로 문장 배치를 바로잡는 것이 좋습니다. 수정문은 원문의 시간 상황절, 땅의 상속과 점유, 아말렉에 대한 기억을 지움, 마지막 금지를 보존합니다.
  naturalness: ‘너의/네’와 합쇼체 종결의 혼용 자체는 가능하지만, ‘너에게서 쉬게 하시고’는 현대 표준어로 비문에 가깝습니다. ‘너에게 … 안식을 주실 때’와 ‘차지하게 하시는 땅’은 현대적이면서도 격식 있는 성서 문체입니다.
  terminology: ‘야훼’와 ‘하나님’은 제공된 POB 용어 결정을 따릅니다. זֵכֶר는 본문에서 자연스러운 ‘기억’으로 옮기되, 주석은 구별되는 대안인 ‘기념’으로 정정합니다. ‘상속’은 토지의 נַחֲלָה에 적합하며, ‘상속으로’보다 ‘상속 재산으로’가 한국어에서 더 명료합니다.
  issues:
  - severity: high
    issue: 원수와 안식의 관계가 잘못 번역됨
    rationale: ‘너를 둘러싼 네 모든 원수에게서 사방으로부터 너에게서 쉬게 하시고’는 원문 ‘네 주위의 모든 원수에게서 네게 안식을 주실 때’를 중복되고 부자연스럽게 뒤집습니다.
  - severity: medium
