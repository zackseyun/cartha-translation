base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
  footnotes:
  - marker: a
    text: Or 'the memory of Amalek.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 너의 하나님께서 네 주위의 모든 원수에게서 너에게 안식을 주실 때, 곧 야훼 너의 하나님께서 네게 상속 재산으로 주시어 차지하게 하시는 땅에서, 너는 하늘 아래에서 아말렉에 대한 기억[a]을 지워야 합니다. 잊지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아말렉의 기념’.
    reason: זֵכֶר의 어휘적 대안입니다. 본문의 ‘기억’과 구별되는 한국어 표현을 제시합니다.
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 야훼 하나님
  lexicon: WLC / POB doctrinal term list
  rationale: 본문의 고유한 신명 יְהוָה를 POB 기준에 따라 ‘야훼’로 옮기고, אַלֹהֶיךָ는 소유격 관계를 살려 ‘너의 하나님’으로 자연스럽게 표현했습니다.
- source_word: בְּהָנִיחַ
  english_pob_choice: gives you rest
  chosen_korean: 너를 ... 쉬게 하시고
  alternatives_korean:
  - 너에게 안식을 주시고
  - 너를 쉬게 하셨을 때
  lexicon: HALOT
  rationale: 미완료적 상황절의 동사로서 ‘안식’보다 동작성을 살린 ‘쉬게 하시고’가 원문의 인과·상황적 흐름을 더 직접적으로 반영합니다.
- source_word: זֵכֶר
  english_pob_choice: the remembrance
  chosen_korean: 기억
  alternatives_korean:
  - 기념
  - 기억의 흔적
  lexicon: HALOT
  rationale: זֵכֶר는 문맥상 ‘기억/기념됨’의 뜻이므로, POB의 대안 주석을 반영해 본문은 간결하게 ‘기억’으로 두었습니다.
- source_word: תִּמְחֶה
  english_pob_choice: you shall blot out
  chosen_korean: 지워 버려야 합니다
  alternatives_korean:
  - 말소해야 합니다
  - 지워야 합니다
  lexicon: HALOT
  rationale: ‘blot out’의 소거·말살 효과를 현대 한국어에서 자연스럽게 살리기 위해 ‘지워 버려야 합니다’를 택했습니다.
- source_word: מִתַּחַת הַשָּׁמָיִם
  english_pob_choice: from under heaven
  chosen_korean: 하늘 아래에서
  alternatives_korean:
  - 하늘 밑에서
  - 하늘 아래로부터
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 무리 없는 표현인 ‘하늘 아래에서’로 옮겨 범위를 보존했습니다.
theological_decisions:
- issue: 야훼를 인명으로 직접 번역할지, 전통적 대치어를 사용할지
  chosen_reading: 본문에서 신명은 대치어 없이 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 יְהוָה를 반복적으로 사용하므로, 본문의 언약적 고유명을 드러내기 위해 POB 기준을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
