theological_decisions:
- issue: 형벌적·언약적 경고의 강도
  chosen_reading: ‘가증한 사람’과 ‘불의를 행하는 사람’을 병렬로 두어, 단순한 도덕적 실수보다 하나님 앞에서의 심각한 언약 위반이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘혐오스러운’처럼 더 완곡하게 번역
  - ‘잘못을 저지르는 사람’처럼 일반화
  rationale: 원문의 תוֹעֲבָה와 עָוֶל은 둘 다 강한 윤리적 판단을 담고 있으므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Deuteronomy covenant ethics; glossary default for יְהוָה → 야훼
