  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'everyone who does wrong' / 'everyone who commits injustice.' The Hebrew עָוֶל can denote wrong, injustice, or unrighteousness; here it refers especially to dishonest dealing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일을 하는 사람은 누구나, 곧 불의를 행하는 사람은 모두 야훼 당신의 하나님께는 가증한 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָוֶל은 ‘잘못’, ‘불의’, ‘불의함’ 또는 ‘부정직한 행위’를 뜻할 수 있습니다. 여기서는 특히 부정직한 거래를 포함한 불의를 가리킵니다.
    reason: lexical_alternative
