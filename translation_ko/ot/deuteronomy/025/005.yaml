id: DEU.25.5
reference: Deuteronomy 25:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּ/מֵ֨ת אַחַ֤ד מֵ/הֶם֙ וּ/בֵ֣ן אֵֽין ל֔/וֹ לֹֽא תִהְיֶ֧ה אֵֽשֶׁת הַ/מֵּ֛ת הַ/ח֖וּצָ/ה לְ/אִ֣ישׁ זָ֑ר יְבָמָ/הּ֙ יָבֹ֣א עָלֶ֔י/הָ וּ/לְקָחָ֥/הּ ל֛/וֹ לְ/אִשָּׁ֖ה וְ/יִבְּמָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'has no child'; the Hebrew text specifically says 'son.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'shall not be outside to a strange man,' meaning she is not to marry outside the family obligation.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'her husband's brother'; traditionally this is the duty later called levirate marriage.
    reason: cultural_note
  - marker: d
    text: '''Go in to her'' is a Hebrew idiom for marital sexual union.'
    reason: lexical_alternative
translation:
  language: ko
  text: 형제들이 함께 거주하다가 그들 가운데 하나가 죽고 아들이 없으면, 죽은 사람의 아내는 밖의 낯선 사람에게 시집가지 못합니다. 그의 남편의 형제가 그녀에게 들어가 그녀를 자기 아내로 맞아들여, 형사취수의 의무를 그녀에게 이행해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחִים
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 형제들(남자 형제)
  - 동족들
  lexicon: HALOT
  rationale: 문맥상 죽은 남자의 형제가 이어서 법적 의무를 지는 구조이므로, 성별이 드러나는 ‘형제들’이 가장 직접적입니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께 거주하다
  alternatives_korean:
  - 함께
  - 같이 살다
  lexicon: HALOT
  rationale: 단순한 동시성을 넘어 같은 집안/생활권에 있는 상황을 나타내므로, 한국어에서는 자연스럽게 ‘함께 거주하다’로 옮겼습니다.
- source_word: וּבֵן אֵין לוֹ
  english_pob_choice: has no son
  chosen_korean: 아들이 없으면
  alternatives_korean:
  - 아이가 없으면
  - 자식이 없으면
  lexicon: HALOT
  rationale: 히브리어가 ‘아들’(son)이라고 분명히 말하므로, 더 넓은 의미로 풀지 않고 좁은 표현을 유지했습니다.
- source_word: אֵשֶׁת הַמֵּת
  english_pob_choice: the wife of the dead man
  chosen_korean: 죽은 사람의 아내
  alternatives_korean:
  - 죽은 남자의 아내
  - 그의 과부
  lexicon: HALOT
  rationale: ‘과부’는 결과적으로 맞지만, 히브리어의 소유-관계 구조를 드러내는 직역성을 살리기 위해 ‘죽은 사람의 아내’로 옮겼습니다.
- source_word: יְבָמָהּ / וְיִבְּמָהּ
  english_pob_choice: Her husband's brother / perform the duty of a brother-in-law to her
  chosen_korean: 형사취수의 의무를 그녀에게 이행하다
  alternatives_korean:
  - 남편의 형제가 그녀와 형사취수 관계를 맺다
  - 시동생/형님으로서의 의무를 다하다
  lexicon: HALOT
  rationale: 히브리어의 전문 법률 용어를 본문에서 바로 풀어 주되, 한국어 독자가 제도적 성격을 알아볼 수 있도록 ‘형사취수’라는 설명적 표현을 사용했습니다.
- source_word: יָבֹא עָלֶיהָ
  english_pob_choice: shall go in to her
  chosen_korean: 그녀에게 들어가
  alternatives_korean:
  - 그녀와 동침하고
  - 그녀에게 들어가 그와 관계하고
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면서도 한국어에서 과도하게 노골적이지 않게 표현했습니다.
- source_word: לְקָחָהּ לוֹ לְאִשָּׁה
  english_pob_choice: take her as his wife
  chosen_korean: 그녀를 자기 아내로 맞아들여
  alternatives_korean:
  - 그녀를 자기 아내로 삼아
  - 그녀를 아내로 맞이하여
  lexicon: HALOT
  rationale: ‘take … as his wife’의 법적·가정적 수용을 한국어의 ‘맞아들이다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: levirate obligation terminology
  chosen_reading: 본문에는 제도의 법적 성격을 드러내기 위해 ‘형사취수의 의무’라고 제시했습니다.
  alternative_readings:
  - ‘시동생의 의무’처럼 관계만 풀어 쓰기
  - ‘레위라트 결혼’ 같은 음역/학술 용어 사용
  rationale: 히브리어 본문은 단순한 재혼이 아니라 죽은 형제의 이름과 가계를 잇는 제도적 의무를 말하므로, 독자에게 기능을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 신 25:5의 가족-상속 규정, 문맥상 가문 보존 의무
- issue: outside/stranger contrast
  chosen_reading: ‘밖의 낯선 사람에게 시집가지 못합니다’로 법적 금지를 유지했습니다.
  alternative_readings:
  - ‘가문 밖으로 나가지 못합니다’
  - ‘낯선 사람과 결혼하지 못합니다’
  rationale: 본문의 금지는 단순한 지리적 ‘밖’이 아니라 가족/가문 질서 밖으로 나가는 것을 막는 것이므로, 그 긴장을 보존하면서도 한국어로 분명히 전달했습니다.
  doctrine_reference: 이스라엘 가족법과 혼인 규정
