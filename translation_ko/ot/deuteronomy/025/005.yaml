  rationale: 원문의 조건절, ‘아들’이라는 제한, 가족 의무 관계 밖의 남자에 대한 금지, 남편의 형제가 아내로 맞아들이며 의무를 수행하는 순서를 보존했습니다. 기존의 ‘형사취수’가 낳을 수 있는 서열·방향의 과도한 특정은 피했습니다.
