review_pass:
  verdict: revise
  source_fidelity: ‘형사취수’는 통상 죽은 형의 아내를 아우가 맞아들이는 경우를 가리키므로, 형제의 연령·서열을 특정하지 않는 히브리어 יָבָם/יִבֵּם의 범위보다 좁습니다. 또한 ‘그의 남편의 형제’는 한국어에서 지시 관계가 어색하고 잠재적으로 모호합니다. 이를 ‘죽은 이의 형제’ 및 ‘남편의 형제로서의 의무’로 고쳤습니다. ‘아들’은 원문의 제한된 표현을 유지합니다.
