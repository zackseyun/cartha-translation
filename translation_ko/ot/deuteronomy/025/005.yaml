  terminology: ‘형사취수’는 한국어 관습상 특정 방향의 혼인 관행을 뜻할 수 있어 중립적인 전문 용어로 안전하지 않습니다. 원문의 제도적 동사에는 ‘남편의 형제로서의 의무를 이행하다’를 사용하여 관계와 의무를 보존하되 서열이나 후대의 제도 범위를 덧붙이지 않았습니다.
