  verdict: revise
  source_fidelity: 첫 문장은 마흔 번을 상한으로 삼고 초과를 금지한다는 뜻을 대체로 전달합니다. 그러나 ‘이들보다 더 많은 매질을 더하게 되면’은 히브리어의 ‘이보다 더 많은 매질로 그를 더 때리다’라는 구조를 부자연스럽고 중복되게 옮겼으며, ‘그렇게 하다가’는 פֶּן이 나타내는 예방 목적을 충분히 드러내지 못합니다.
  naturalness: ‘당신 눈앞에서 천하게 되기’는 현대 한국어에서 다소 어색하고, ‘천하다’가 사회적 신분의 낮음을 뜻하는 것으로 읽힐 수 있습니다. ‘업신여김을 받다’는 공개적으로 경멸받거나 모욕당한다는 문맥상 의미를 자연스럽게 전달합니다.
  terminology: אָחִיךָ의 가족적 표현은 ‘당신의 형제’로 유지할 수 있습니다. 각주 b는 영어 POB 감사 기록과 달리 ‘더하지 말라’만 설명하고 있으므로, 해당 표현의 공동체적 용례를 설명하도록 고쳤습니다.
