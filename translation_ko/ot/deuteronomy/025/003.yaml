    issue: 초과 처벌을 나타내는 후반절의 표현이 부정확하고 부자연스럽습니다.
    rationale: ‘이들보다 더 많은 매질을 더하게 되면’은 ‘매질을 더하다’라는 어색한 결합을 이루며, עַל־אֵלֶּה מַכָּה רַבָּה의 ‘이보다 더 많은/과도한 매질로’라는 뜻을 명료하게 표현하지 못합니다.
