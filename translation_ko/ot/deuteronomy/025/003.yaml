  to: 그는 그를 마흔 번[a] 때릴 수 있으나, 더 때려서는 안 됩니다[b]. 이보다 더 많은 매질로 그를 때려 당신의 형제가 당신의 눈앞에서 업신여김을 받지 않게 하려는 것입니다.
