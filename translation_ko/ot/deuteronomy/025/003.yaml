  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
  footnotes:
  - marker: a
    text: Or, 'forty lashes' or 'forty blows.' The Hebrew specifies the number forty; the instrument or exact form of each strike is not stated here.
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' here means a fellow member of the covenant community; the law limits punishment so that he is not treated as contemptible.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 마흔 번[a] 때릴 수 있으나 그 이상은 안 됩니다[b]. 그렇게 하다가 이들보다 더 많은 매질을 더하게 되면 당신의 형제가 당신 눈앞에서 천하게 되기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정확한 횟수로서 ‘마흔’을 말하며, 각 타격의 도구나 형식은 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘더하지 말라’입니다. 여기서는 정해진 형벌 한도를 넘기지 말라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים
  english_pob_choice: forty times
  chosen_korean: 마흔 번
  alternatives_korean:
  - 마흔 차례
  - 사십 번
  - 마흔 대
  lexicon: HALOT
  rationale: 히브리어의 핵심은 정해진 수의 상한이므로, 한국어에서는 자연스러운 수량 표현인 ‘마흔 번’으로 옮겨 실제 타격 횟수를 분명히 했습니다.
- source_word: יַכֶּנּוּ
  english_pob_choice: He may strike him
  chosen_korean: 때릴 수 있으나
  alternatives_korean:
  - 때려도 되나
  - 때리게 할 수 있으나
  - 칠 수 있으나
  lexicon: HALOT
  rationale: 법 조항의 허용 한계를 나타내므로 단순 미래형보다 허용 의미가 드러나는 표현을 택했습니다.
- source_word: לֹא יֹסִיף
  english_pob_choice: but no more
  chosen_korean: 그 이상은 안 됩니다
  alternatives_korean:
  - 더는 더하지 말아야 합니다
  - 더 이상은 추가하지 말아야 합니다
  - 더는 안 됩니다
  lexicon: HALOT
  rationale: ‘더하다/증가하다’의 금지를 한국어 법률 문체에 자연스럽게 풀어, 허용 한도의 초과 금지를 명확히 했습니다.
- source_word: וְנִקְלָה
  english_pob_choice: be degraded
  chosen_korean: 천하게 되기
  alternatives_korean:
  - 수치스럽게 되기
  - 멸시받게 되기
  - 비천하게 되기
  lexicon: HALOT
  rationale: 히브리어는 내적 감정만이 아니라 공개적으로 천하게/경멸받는 상태를 가리키므로, 윤리적·사회적 저하를 함께 담는 ‘천하게 되기’를 선택했습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 당신의 형제자매가 아닌 형제
  - 당신의 동족
  - 당신의 이웃
  lexicon: HALOT
  rationale: 언약 공동체 안의 형제 관계를 보존하기 위해 직역적 친족어를 유지했습니다. 다만 한국어에서는 호칭의 자연스러움을 위해 ‘형제’로 옮겼습니다.
theological_decisions:
- issue: 공동체 내부의 인격적 한계로서의 형제 호칭
  chosen_reading: ‘형제’는 처벌 대상이 언약 공동체의 동료라는 점을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 동족
  - 이웃
  - 공동체의 사람
  rationale: 법의 제한 근거가 단순한 신분 분류가 아니라 같은 언약 안에 있는 사람을 지나치게 모욕하지 말라는 데 있으므로, 가족적 호칭을 보존하는 것이 본문의 윤리적 힘을 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
