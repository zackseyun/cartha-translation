translation:
  language: ko
  text: 그 손을 잘라내셔야 합니다[a]; 당신의 눈이 불쌍히 여기지 말아야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 손바닥’입니다. 히브리어 כַּף는 손바닥을 가리킬 수 있지만, 여기서는 ‘손’이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 눈이 아끼지 말아야 합니다’입니다. 히브리어는 ‘눈’을 들어 자비를 거두는 관용구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  english_pob_choice: you shall cut off
  chosen_korean: 잘라내셔야 합니다
  alternatives_korean:
  - 잘라버리셔야 합니다
  - 절단하셔야 합니다
  lexicon: HALOT
  rationale: קצץ의 직접적 의미를 따라 물리적으로 ‘잘라내다’로 옮겼습니다. 법조문의 कठ한 명령성을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: כַּפָּהּ
  english_pob_choice: her hand / her palm
  chosen_korean: 그 손
  alternatives_korean:
  - 그 손바닥
  - 그 손의 바닥
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥’도 가리킬 수 있지만, 여기서는 형벌 규정의 문맥에서 ‘손’이 더 자연스럽고 직접적입니다.
- source_word: תָחוֹס עֵינֶךָ
  english_pob_choice: your eye shall not pity
  chosen_korean: 당신의 눈이 불쌍히 여기지 말아야 합니다
  alternatives_korean:
  - 당신의 눈이 아껴주지 말아야 합니다
  - 당신의 눈이 동정하지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 ‘눈’ 주어를 유지했고, חוס의 의미를 ‘불쌍히 여기다’로 옮겨 자비를 거두라는 뜻을 드러냈습니다.
theological_decisions:
- issue: 히브리어 관용구의 직역 유지
  chosen_reading: ‘당신의 눈이 불쌍히 여기지 말아야 합니다’로 옮겨 눈을 주어로 한 히브리어 표현을 보존했습니다.
  alternative_readings:
  - ‘그에게 자비를 베풀지 말아야 합니다’로 더 풀어 옮김
  rationale: 이 구절은 법률 문체의 공식을 그대로 드러내는 것이 중요하므로, 관용구를 평탄화하지 않고 원문 형식을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve significant lexical and idiomatic form'
