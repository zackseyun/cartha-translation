  yaml_path: translation/ot/deuteronomy/025/012.yaml
  text: you shall cut off her hand[b][a]; your eye shall not pity.
  footnotes:
  - marker: a
    text: Or 'her palm.' The Hebrew word can refer specifically to the palm of the hand, though 'hand' is the more natural English rendering here.
