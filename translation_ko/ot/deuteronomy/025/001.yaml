id: DEU.25.1
reference: Deuteronomy 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
  footnotes:
  - marker: a
    text: Or 'When there is a dispute between men.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'to the judgment'; that is, to judicial proceedings or to court.
    reason: lexical_alternative
  - marker: c
    text: '''Acquit'' and ''condemn'' render courtroom terms: literally, ''declare righteous'' and ''declare wicked/guilty.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 사람들이 서로 다툼이 있어서 재판에 나아가면, 재판관들은 그들 사이를 판결하여 의로운 사람은 의롭다 하고 악인은 악하다 할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 남성 복수형을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어 מִשְׁפָּט은 여기서 추상적 '판단'보다 재판 절차나 법정을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 법정에서 '의롭다/악하다'고 선언하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  english_pob_choice: If there is
  chosen_korean: 만일 ... 있어서
  alternatives_korean:
  - 사람들 사이에 다툼이 생기면
  - 사람들 사이에 분쟁이 있을 때
  lexicon: HALOT
  rationale: 법률적 가정문으로서 조건의 힘을 살리기 위해 '만일'을 택했고, יִהְיֶה의 존재문 성격은 한국어에서 자연스러운 서술로 풀었습니다.
- source_word: רִיב
  english_pob_choice: dispute
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 송사
  lexicon: HALOT
  rationale: 법정 문맥이지만 한국어에서 너무 기술적인 '송사'보다, 실제 갈등과 소송을 함께 포괄하는 '다툼'이 더 직접적이고 자연스럽습니다.
- source_word: אֶל הַמִּשְׁפָּט
  english_pob_choice: to court
  chosen_korean: 재판에 나아가면
  alternatives_korean:
  - 법정에 가면
  - 판결을 받으러 가면
  lexicon: HALOT
  rationale: מִשְׁפָּט를 추상적 '판단'이 아니라 사법 절차로 읽어, 법정 출두의 뉘앙스를 살리는 '재판에 나아가면'으로 옮겼습니다.
- source_word: וּשְׁפָטוּם
  english_pob_choice: and the judges decide between them
  chosen_korean: 재판관들은 그들 사이를 판결하여
  alternatives_korean:
  - 재판관들은 그들 사이를 심판하여
  - 재판관들은 그들 사이에서 재판하여
  lexicon: HALOT
  rationale: 히브리어의 복수 서술을 한국어에서는 주어를 명시해 풀었고, '판결하다'로 법적 결정 행위를 드러냈습니다.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק / וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  english_pob_choice: they shall acquit the righteous / and condemn the wicked
  chosen_korean: 의로운 사람은 의롭다 하고 악인은 악하다 할 것입니다
  alternatives_korean:
  - 의로운 사람은 무죄라 하고 악인은 유죄라 할 것입니다
  - 의로운 사람은 변호해 주고 악인은 정죄할 것입니다
  lexicon: HALOT
  rationale: 히필 משפט 용례의 법정적 대조를 살리되, '의롭다 하다/악하다 하다'로 선언적 판결의 형식을 유지했습니다. '무죄/유죄'는 뜻은 분명하지만 원문의 '의/악' 대조를 덜 드러냅니다.
theological_decisions:
- issue: צדּיק / רָשָׁע의 의미를 도덕 평가로만 좁힐지, 법정 판결로 읽을지
  chosen_reading: 법정에서 내려지는 선언으로 보아 '의로운 사람은 의롭다 하고 악인은 악하다 한다'고 옮겼습니다.
  alternative_readings:
  - 도덕적으로 의로운 자와 악한 자를 일반적으로 말하는 읽기
  - 무죄/유죄의 현대 법률용어로 치환하는 읽기
  rationale: 문맥이 '재판에 나아가면'과 '재판관들'을 포함하므로, 본문은 인격 평가보다 판결 선언을 말합니다. 다만 한국어에서는 고전적 교회어보다 직접적인 판결 표현을 택해 법정성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
