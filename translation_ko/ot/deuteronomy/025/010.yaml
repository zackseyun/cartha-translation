base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/010.yaml
  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
  footnotes:
  - marker: a
    text: Or, more literally, “The house of the removed sandal.” The Hebrew compresses the ritual shame-title into a terse expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 이름은 이스라엘에서 「그의 신발이 벗겨진 사람의 집」이라 불릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, 「벗겨진 신발의 집」입니다. 히브리어는 수치 명칭을 매우 간결하게 압축합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא
  english_pob_choice: shall be called
  chosen_korean: 불릴 것입니다
  alternatives_korean:
  - 이라 불릴 것입니다
  - 라 불리게 될 것입니다
  lexicon: HALOT
  rationale: 수동적 명명 공식을 자연스러운 현대 한국어로 옮기면서도, 법적·공적 선언의 톤을 유지했습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: in Israel
  chosen_korean: 이스라엘에서
  alternatives_korean:
  - 이스라엘 안에서
  - 이스라엘 가운데
  lexicon: HALOT
  rationale: 이 명칭이 공동체 안에서 통용되는 범위를 나타내므로, 장소·영역을 드러내는 「-에서」가 가장 간결하고 자연스럽습니다.
- source_word: בֵּית חֲלוּץ הַנָּעַל
  english_pob_choice: The house of him whose sandal was removed
  chosen_korean: 그의 신발이 벗겨진 사람의 집
  alternatives_korean:
  - 그의 신발이 벗겨진 자의 집
  - 벗겨진 신발의 집
  lexicon: HALOT
  rationale: 히브리어의 수치명칭을 그대로 살리되, 압축된 표현을 한국어에서 이해 가능하게 풀었습니다. '신발'은 현대 독자에게 가장 자연스러우며, 의례적 수치를 전달합니다.
theological_decisions:
- issue: 의례적 수치명칭의 보존
  chosen_reading: 문자적으로는 다소 길어지더라도, 성문의 공개적 수치 표식을 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡한 가족명칭으로 순화하는 번역
  - 의례적 의미를 약화한 단순 별칭 번역
  rationale: 본문은 레위라트 거절의 결과로 붙는 공개적 불명예 명칭을 말하므로, 그 사회적·법적 무게를 흐리지 않는 것이 중요합니다.
  doctrine_reference: 신 25:5-10의 계대결혼(형사취수) 규례와 공동체적 수치 표지
- issue: 직역성과 가독성의 균형
  chosen_reading: ‘그의 신발이 벗겨진 사람’으로 옮겨, 히브리어의 압축된 수식을 보존하면서도 독자가 의례를 추적할 수 있게 했습니다.
  alternative_readings:
  - ‘신발이 벗겨진 자’
  - ‘신발 벗김의 집’
  rationale: 전자는 다소 난해하고 후자는 지나치게 축약되므로, 원문의 수동 의미와 명칭 기능을 함께 드러내는 중간 선택이 필요합니다.
  doctrine_reference: 본문 의미 전달과 명칭 관용구의 보존
