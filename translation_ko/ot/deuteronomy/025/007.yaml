source:
  edition: WLC
  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
  footnotes:
  - marker: a
    text: Or, more literally, 'to establish a name for his brother in Israel.' The idiom refers to preserving the deceased brother’s family line and standing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to brother-in-law me,' a technical expression for fulfilling the levirate duty by marrying a deceased brother’s widow.
    reason: cultural_note
translation:
  language: ko
  text: 만일 그 남자가 자기 형제의 아내를 맞이하기를 원하지 않으면, 그의 형제의 아내는 성문으로 올라가 장로들에게 말해야 합니다. 「내 형제의 이름을 이스라엘 가운데 세우기를 내 시숙이 거절합니다[a]; 그는 나에게 시숙의 의무를 행하려 하지 않습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘에서 그의 형제의 이름을 세우다’입니다. 이는 죽은 형제의 가문과 지위를 이어 주는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘나에게 시숙 역할을 하다’라는 기술적 표현으로, 죽은 형제의 아내와 결혼하여 레위라트 의무를 수행하는 것을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  english_pob_choice: his brother’s widow
  chosen_korean: 자기 형제의 아내
  alternatives_korean:
  - 자기 형제의 과부
  - 형제의 아내
  lexicon: HALOT
  rationale: 레위라트 결혼의 상대를 가리키는 말이므로, 직역적이면서도 현대 한국어에서 이해 가능한 ‘형제의 아내’로 옮겼습니다. ‘과부’는 상태를 강조하지만 관계를 덜 직접적으로 드러냅니다.
- source_word: לָקַחַת
  english_pob_choice: to take
  chosen_korean: 맞이하기를 원하지 않으면
  alternatives_korean:
  - 데려가기를 원하지 않으면
  - 아내로 취하기를 원하지 않으면
  lexicon: HALOT
  rationale: 히브리어의 ‘취하다/데려가다’는 결혼 맥락에서 혼인 의사를 뜻하므로, 법적 문맥을 살려 자연스럽게 ‘맞이하다’로 풀었습니다.
- source_word: לְהָקִים ... שֵׁם
  english_pob_choice: to raise up a name
  chosen_korean: 이름을 ... 세우기를
  alternatives_korean:
  - 이름을 ... 일으키기를
  - 이름을 ... 세우기를
  - 이름을 ... 남기기를
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서는 ‘이름을 세우다’가 다소 직관적으로 들리므로 ‘세우다’를 택했습니다. 이는 죽은 형제의 가문과 명맥을 이어 주는 의미를 반영합니다.
- source_word: יַבְּמִי
  english_pob_choice: to perform the duty of a brother-in-law to me
  chosen_korean: 시숙의 의무를 행하려 하지 않습니다
  alternatives_korean:
  - 형부/시동생의 의무를 행하려 하지 않습니다
  - 레위라트 의무를 다하려 하지 않습니다
  lexicon: HALOT
  rationale: יַבֵּם의 기술적 의미를 한국어로 풀어, 고대 제도를 모르는 독자도 ‘형제의 아내에 대한 의무’를 이해할 수 있게 했습니다. ‘시숙’은 여기서 관계의 법적·가족적 성격을 가장 가깝게 드러냅니다.
theological_decisions:
- issue: 레위라트 규정의 기술적 용어 처리
  chosen_reading: 전문 용어를 본문에 직접 도입하기보다, ‘형제의 아내’와 ‘시숙의 의무’로 풀어 설명했습니다.
  alternative_readings:
  - ‘레위라트 결혼’이라고 직접 표기
  - 더 축약된 친족어만 사용
  rationale: 이 절은 교리 논쟁 본문이 아니라 법적 절차 본문이므로, 의미를 분명히 하면서도 낯선 학술 용어를 본문 중심에 두지 않는 편이 원문 기능에 더 충실합니다.
  doctrine_reference: '번역 원칙: optimal equivalence; 법률적·관계적 의미의 명료성 우선'
