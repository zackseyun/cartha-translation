  source_fidelity: 수정이 필요합니다. יְבִמְתּוֹ는 단순한 ‘형제의 아내’가 아니라 죽은 형제의 과부를 가리키므로 ‘형제의 과부’로 밝혀야 합니다. 또한 יָבָם/יַבְּמִי는 형의 여부를 특정하지 않는 남편의 형제를 뜻하므로 ‘시숙’은 부정확합니다. ‘남편의 형제’ 및 그 의무라는 중립적 표현이 원문에 충실합니다.
  naturalness: 합쇼체의 법률적·서술적 흐름은 대체로 자연스럽습니다. 다만 ‘시숙의 의무’는 현대 한국어에서 관계 범위가 제한되고 다소 불투명하므로 ‘남편의 형제로서의 의무’로 풀어 쓰는 편이 명료합니다.
  terminology: ‘형제의 과부’는 레위라트 혼인 문맥의 대상을 정확하게 나타냅니다. ‘이름을 세우다’는 히브리어 관용구를 보존할 수 있으며, 각주에서 죽은 형제의 가문과 명맥을 잇는 뜻을 설명하는 것이 적절합니다. ‘남편의 형제’는 연령을 전제하는 ‘시숙’보다 정확합니다.
