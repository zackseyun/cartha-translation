  to: 만일 그 남자가 자기 형제의 과부를 아내로 맞이하기를 원하지 않으면, 그의 형제의 과부는 성문으로 올라가 장로들에게 말해야 합니다. 「남편의 형제가 이스라엘 가운데 자기 형제의 이름을 세워 주기를 거절합니다[a]. 그는 나에게 남편의 형제로서의 의무를 행하려 하지 않습니다[b].」
  rationale: 원문의 친족 관계와 법적 맥락을 더 정확히 드러내기 위해 ‘형제의 아내’를 ‘형제의 과부’로, 연령을 전제하는 ‘시숙’을 ‘남편의 형제’로 고쳤습니다. ‘아내로 맞이하다’는 לָקַחַת의 혼인 문맥을 자연스럽게 표현하면서도 과도한 해석을 피합니다. 두 절의 거절·비동의 표현과 ‘이름을 세우다’라는 관용구는 유지했습니다.
