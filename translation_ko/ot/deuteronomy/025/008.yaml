  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
  footnotes:
  - marker: a
    text: Or, more explicitly in context, “to marry her.” The Hebrew literally says “to take her,” a common idiom for taking a woman in marriage.
