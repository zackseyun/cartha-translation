translation:
  language: ko
  text: 그 고을의 장로들이 그를 불러 그에게 말할 것이며, 그가 버티며 “나는 그 여자를 아내로 맞이하고 싶지 않습니다”라고 말하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그 여자를 취하다”라고 되어 있으며, 문맥상 “아내로 맞이하다”라는 혼인 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  english_pob_choice: shall call
  chosen_korean: 불러
  alternatives_korean:
  - 부를 것이며
  - 호출할 것이며
  lexicon: HALOT
  rationale: 법률 서술의 순차적 진행을 살려, 장로들의 공식적 요청을 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: זִקְנֵי עִירוֹ
  english_pob_choice: the elders of his city
  chosen_korean: 그 고을의 장로들
  alternatives_korean:
  - 그 성읍의 장로들
  - 그 도시의 장로들
  lexicon: HALOT
  rationale: זִקְנֵי는 공동체의 원로/지도층을 가리키므로 ‘장로들’로 옮기고, עִיר는 한국어에서 자연스러운 ‘고을’로 처리해 법적·공동체적 뉘앙스를 살렸습니다.
- source_word: לֹא חָפַצְתִּי
  english_pob_choice: I do not desire
  chosen_korean: 나는 … 하고 싶지 않습니다
  alternatives_korean:
  - 나는 …을 원하지 않습니다
  - 나는 …을 바라지 않습니다
  lexicon: HALOT
  rationale: חָפֵץ의 ‘기꺼이 원하다/마음에 두다’라는 뜻을 한국어의 ‘하고 싶다/원하다’로 풀어, 단순한 감정보다 의사와 의향을 드러냈습니다.
- source_word: לְקַחְתָּהּ
  english_pob_choice: to take her
  chosen_korean: 그 여자를 아내로 맞이하고
  alternatives_korean:
  - 그 여자를 취하고
  - 그 여자를 데려가고
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘그녀를 취하다’이지만, 문맥상 결혼을 뜻하는 관용구이므로 본문에는 자연스럽게 풀고, 결혼 의미를 명시해 오해를 줄였습니다.
theological_decisions:
- issue: ‘take her’의 혼인 관용구 처리
  chosen_reading: 본문은 ‘아내로 맞이하다’로 옮겨 혼인 행위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘그 여자를 취하다’로 더 직역하기
  - 각주로만 혼인 의미를 처리하기
  rationale: 신명기의 문맥상 이는 단순한 소유 취득이 아니라 혼인 체결을 뜻하는 관용구이므로, 한국어 독자가 법적 의미를 즉시 파악하도록 명시하는 편이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 신 25:8의 형사취수 관련 규정
- issue: 대화체 문장의 높임과 절차적 법률 문체
  chosen_reading: 서술은 평서형 법률 문체로, 직접 화법은 예의 있는 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 고전적인 성경체로 조정하기
  - 직접화법을 중립체로 낮추기
  rationale: 본문이 공동체 장로와 당사자 사이의 공식 절차를 묘사하므로, 현대 표준어의 합쇼체가 원문의 공적·절차적 성격을 가장 잘 반영합니다.
  doctrine_reference: 번역 문체 원칙
