base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
  footnotes:
  - marker: a
    text: Hebrew 'stone'; that is, a stone weight used in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 온전하고 공정한 무게추[a]가 있어야 합니다. 온전하고 공정한 에바[b]가 있어야 합니다. 그래야 야훼, 당신의 하나님께서 당신에게 주시는 땅에서 당신의 날이 길어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘돌’입니다. 여기서는 거래에 쓰는 돌추를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 에바는 고대 이스라엘의 건량 단위입니다.
    reason: cultural_background
lexical_decisions:
- source_word: אֶבֶן
  english_pob_choice: weight
  chosen_korean: 저울추
  alternatives_korean:
  - 돌
  - 무게추
  lexicon: HALOT
  rationale: 직역하면 ‘돌’이지만, 상업적 맥락에서는 거래용 돌추를 가리키므로 한국어에서는 의미가 드러나는 ‘저울추’가 가장 자연스럽습니다.
- source_word: שְׁלֵמָה וָצֶדֶק
  english_pob_choice: full and just
  chosen_korean: 정확한 … 공정한
  alternatives_korean:
  - 온전한 … 의로운
  - 완전한 … 정직한
  lexicon: HALOT
  rationale: 저울과 되에 붙는 형용사로서 ‘부족함 없이 정확함’과 ‘공정함’을 함께 살리는 표현이므로, 상거래 맥락에서 읽히는 한국어로 옮겼습니다.
- source_word: אֵיפָה
  english_pob_choice: ephah
  chosen_korean: 되
  alternatives_korean:
  - 에바
  - 측량
  lexicon: HALOT
  rationale: אֵיפָה는 곡물용 건량 단위이므로, 현대 한국어에서 기능이 즉시 이해되는 ‘되’를 택하되, 원문의 구체적 도량형 성격을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신성명은 ‘야훼’로 일관되게 옮겼습니다.
- source_word: נֹתֵן לָךְ
  english_pob_choice: is giving you
  chosen_korean: 주시는
  alternatives_korean:
  - 주고 계시는
  - 주실
  lexicon: HALOT
  rationale: 현재분사적 뉘앙스를 살리면서도 신명기의 언약적 진술에 어울리는 자연스러운 현재형으로 옮겼습니다.
theological_decisions:
- issue: 언약적 순종과 수명/토지의 연결
  chosen_reading: 정확한 도량형 준수가 야훼의 땅에서 오래 사는 언약적 복과 연결된다는 뜻으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 일반적 도덕 교훈으로 완화
  - ‘땅’의 언약성을 약화
  rationale: 본문은 상거래 윤리를 넘어, 이스라엘의 땅에서의 삶이 야훼 앞의 공정함과 연결된다는 신명기적 언약 논리를 드러냅니다.
  doctrine_reference: 신명기 25:15의 언약 순종-복 연결
