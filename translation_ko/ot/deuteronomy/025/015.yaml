  source_fidelity: 수정이 필요합니다. שְׁלֵמָה는 상거래 도량형에서 ‘온전한/부족하지 않은’을 뜻하는데, 초안의 ‘정확한’은 그 뜻을 일부 전달하지만 원문의 ‘온전함’을 좁힙니다. 또한 אֵיפָה는 고대 이스라엘의 특정 건량 단위이므로 한국의 전통 단위인 ‘되’로 번역하면 서로 다른 단위를 동일시하게 됩니다. ‘에바’로 음역하고 주석으로 설명하는 편이 원문에 충실합니다.
  naturalness: ‘온전하고 공정한 무게추’와 ‘온전하고 공정한 에바’는 현대 표준 한국어의 법적·윤리적 권면 문맥에서 자연스럽습니다. ‘당신의 날들이’ 대신 ‘당신의 날이 길어질 것’으로 하여 한국어의 자연스러움을 높이면서 히브리어의 ‘날이 길어지다’라는 표현을 보존했습니다.
