reference: Deuteronomy 25:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
  footnotes:
  - marker: a
    text: Or, 'spit before him.' Some interpreters take the Hebrew as indicating spitting in front of the man rather than directly in his face.
    reason: lexical_alternative
  - marker: b
    text: '''Build up his brother’s house'' means to establish or continue his brother’s family line and household through levirate marriage.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 형제의 과부가 장로들의 눈앞에 그에게 나아와 그의 발에서 신을 벗기고 그의 얼굴에 침을 뱉으며 응답하여 말해야 합니다. ‘자기 형제의 집을 세우지 않는 그 남자에게는 이렇게 해야 합니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 형제의 과부’는 레위라트 결혼 맥락에서, 죽은 형제의 이름과 가문을 이어 주어야 하는 법적 대상자를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘자기 형제의 집을 세우다’는 형제의 가문과 계보를 이어 가문을 존속시키는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  english_pob_choice: his brother’s widow
  chosen_korean: 그의 형제의 과부
  alternatives_korean:
  - 그의 형수
  - 그의 형제의 아내
  lexicon: HALOT
  rationale: 레위라트 결혼 문맥에서 단순한 ‘형수’보다 ‘형제의 과부’가 법적 관계와 상실된 배우자 상태를 더 분명하게 드러냅니다.
- source_word: לְעֵינֵי הַזְּקֵנִים
  english_pob_choice: in the sight of the elders
  chosen_korean: 장로들의 눈앞에
  alternatives_korean:
  - 장로들 앞에서
  - 장로들의 앞에서
  lexicon: HALOT
  rationale: 직역의 ‘to the eyes of’에 가까운 공개·증인성은 유지하되, 한국어 법문체로 자연스럽게 옮겼습니다.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  english_pob_choice: remove his sandal from on his foot
  chosen_korean: 그의 발에서 신을 벗기고
  alternatives_korean:
  - 그의 발에서 샌들을 벗기고
  - 그의 발에서 신발을 벗겨
  lexicon: HALOT
  rationale: 히브리어의 단수 신발과 제거 동작을 살리면서, 현대 한국어에서는 ‘신’을 써서 간결하고 법적 서술에 맞게 했습니다.
- source_word: וְיָרְקָה בְּפָנָיו
  english_pob_choice: spit in his face
  chosen_korean: 그의 얼굴에 침을 뱉으며
  alternatives_korean:
  - 그의 얼굴에 침을 뱉고
  - 그 앞에 침을 뱉으며
  lexicon: HALOT
  rationale: POB의 직접적 이해를 따라 수치의 행위를 약화하지 않았고, 한국어 관용으로도 가장 분명한 표현을 택했습니다.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  english_pob_choice: who will not build up his brother’s house
  chosen_korean: 자기 형제의 집을 세우지 않는
  alternatives_korean:
  - 자기 형제의 집을 세우기를 거부하는
  - 자기 형제의 가문을 세우지 않는
  lexicon: HALOT
  rationale: ‘집을 세우다’라는 히브리어 관용을 보존하여, 형제의 가문과 계보를 이어 주는 의미를 드러냈습니다.
theological_decisions:
- issue: 레위라트 거절에 대한 공개 수치 의례의 강도 유지
  chosen_reading: 침을 그의 얼굴에 뱉는 직접적 수치 행위로 옮겼습니다.
  alternative_readings:
  - ‘그 앞에 침을 뱉다’로 완화하는 번역
  - 행위의 수치성을 덜 드러내는 표현
  rationale: 원문과 POB가 지시하는 공개적 모욕의 강도를 약화시키지 않는 것이 법문맥의 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
