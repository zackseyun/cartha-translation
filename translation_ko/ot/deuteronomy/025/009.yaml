revisions:
- from: 그의 형제의 과부가 장로들의 눈앞에 그에게 나아와 그의 발에서 신을 벗기고 그의 얼굴에 침을 뱉으며 응답하여 말해야 합니다. ‘자기 형제의 집을 세우지 않는 그 남자에게는 이렇게 해야 합니다.’[a][b]
  to: 그의 형제의 과부가[a] 장로들이 보는 앞에서 그에게 다가가 그의 발에서 신을 벗기고 그의 얼굴에 침을 뱉고 대답하여 말해야 합니다. “자기 형제의 집을 세우지 않는 그 사람에게는 이렇게 해야 합니다.”[b]
  rationale: ‘자기’는 이 문장에서 인용된 말의 주체인 여자를 가리키기보다, ‘그 사람’의 형제를 가리키도록 해석되는 것이 자연스럽습니다. 따라서 본문에는 원문의 문자적 표현을 보존하되, 각주에서 소유 관계를 명시하여 한국어의 잠재적 모호성을 해소했습니다. 각주 표지도 각각 설명하는 표현 바로 뒤로 옮겼습니다.
