  lexicon: HALOT
  rationale: 소유 금지의 법률적 금령을 한국어로 자연스럽게 옮기면 ‘두지 마십시오’가 가장 간결하고 직접적입니다.
- source_word: בְּכִיסְךָ
  english_pob_choice: in your bag
  chosen_korean: 주머니에
  alternatives_korean:
  - 자루에
