  chosen_reading: 금지 명령을 완곡하게 낮추지 않고 직접적인 명령형으로 유지했습니다.
  alternative_readings:
  - 해서는 안 됩니다
  - 가지면 안 됩니다
  rationale: 본문은 공적·법적 금령이므로, 현대 한국어에서도 명령의 강도를 분명히 드러내는 합쇼체 부정 명령이 적절합니다.
  doctrine_reference: 신명기 25:13의 공정한 거래 규례
