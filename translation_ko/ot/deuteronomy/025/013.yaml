translation:
  language: ko
  text: 주머니에 큰 것과 작은 것, 두 가지 저울추를 두지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  english_pob_choice: You shall not have
  chosen_korean: 두지 마십시오
  alternatives_korean:
  - 가지지 마십시오
  - 두어 두지 마십시오
  lexicon: HALOT
  rationale: 소유 금지의 법률적 금령을 한국어로 자연스럽게 옮기면 ‘두지 마십시오’가 가장 간결하고 직접적입니다.
- source_word: בְּכִיסְךָ
  english_pob_choice: in your bag
  chosen_korean: 주머니에
  alternatives_korean:
  - 자루에
  - 가방에
  lexicon: HALOT
  rationale: כִּיס는 금전이나 물건을 넣는 주머니/자루를 가리키므로, 현대 한국어에서는 ‘주머니’가 가장 자연스럽고 간결합니다.
- source_word: אֶבֶן וָאָבֶן
  english_pob_choice: differing weights / a stone and a stone
  chosen_korean: 두 가지 저울추
  alternatives_korean:
  - 저울추와 저울추
  - 돌과 돌
  lexicon: HALOT
  rationale: 직역하면 ‘돌과 돌’이지만, 거래용 돌무게를 뜻하는 관용을 드러내기 위해 ‘저울추’로 옮겼습니다. 영어 POB의 주석 취지를 반영해 ‘두 가지’로 중복성과 부정직함을 살렸습니다.
- source_word: גְּדוֹלָה וּקְטַנָּה
  english_pob_choice: a large and a small
  chosen_korean: 큰 것과 작은 것
  alternatives_korean:
  - 큰 저울추와 작은 저울추
  - 크고 작은 것
  lexicon: HALOT
  rationale: 두 저울추의 불균형을 나타내는 대조를 자연스럽게 살리기 위해 ‘큰 것과 작은 것’으로 표현했습니다.
theological_decisions:
