lexical_decisions:
- source_word: זָכ֕וֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하시오
  - 떠올리십시오
  lexicon: HALOT
  rationale: 직접적인 명령형을 한국어 합쇼체로 옮겨, 기억하라는 언약적 요구를 자연스럽고 분명하게 살렸습니다.
- source_word: עָשָׂה לְךָ
  english_pob_choice: did to you
  chosen_korean: 여러분에게 행한 일
  alternatives_korean:
  - 여러분에게 한 일
  - 여러분에게 해친 일
  lexicon: HALOT
  rationale: עשה + לְךָ의 방향성을 살려 ‘여러분에게’로 옮기고, 피해의 뉘앙스를 지나치게 덧붙이지 않기 위해 ‘행한 일’을 택했습니다.
- source_word: בַּ/דֶּ֖רֶךְ
  english_pob_choice: on the way
  chosen_korean: 길에서
  alternatives_korean:
  - 도중에
  - 길 위에서
  lexicon: HALOT
  rationale: 여정의 맥락을 간결하게 전달하는 표현으로, 전치사 בְּ의 장소/상황 의미를 자연스럽게 반영했습니다.
- source_word: מִ/מִּצְרַֽיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서 나올 때
  alternatives_korean:
  - 이집트에서
  - 이집트로부터
  lexicon: HALOT
  rationale: POB의 ‘from Egypt’보다 한국어에서는 출애굽 사건의 결과를 함께 드러내는 ‘나올 때’가 יותר 자연스러우면서도 원문의 출발점을 보존합니다.
