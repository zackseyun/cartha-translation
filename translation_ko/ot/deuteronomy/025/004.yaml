lexical_decisions:
- source_word: לֹא תַחְסֹם
  english_pob_choice: You shall not muzzle
  chosen_korean: 망을 씌우지 마십시오
  alternatives_korean:
  - 입에 재갈을 물리지 마십시오
  - 입을 막지 마십시오
  lexicon: HALOT
  rationale: חסם은 짐승의 입을 막아 먹지 못하게 하는 뜻이므로, 한국어로는 농경 상황에서 자연스러운 ‘망을 씌우다’가 가장 직접적입니다. ‘재갈을 물리다’는 말을 붙잡는 뉘앙스가 강해 여기서는 덜 적절합니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 외양간 소
  lexicon: HALOT
  rationale: 농사와 탈곡 문맥의 작업 짐승을 가리키므로 ‘소’가 가장 자연스럽고, 특별히 성별을 강조하지 않아도 됩니다.
- source_word: בְּדִישׁוֹ
  english_pob_choice: while it is threshing
  chosen_korean: 곡식을 밟아 떠는
  alternatives_korean:
  - 타작하는
  - 그 타작 중에 있는
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 탈곡/타작 중에’이지만, 한국어에서는 작업 행위를 풀어 ‘곡식을 밟아 떠는’이 상황을 가장 분명하게 전달합니다. ‘타작하는’도 가능하지만, 여기서는 탈곡의 구체적 장면이 드러나도록 했습니다.
