  - 두 에바
  lexicon: HALOT
  rationale: 반복 표현을 유지해 서로 다른 두 도량형을 대비시키는 원문 효과를 살렸고, 고유한 고대 건량 단위를 그대로 보존했습니다.
- source_word: גְּדוֹלָה וּקְטַנָּה
  english_pob_choice: a large and a small
  chosen_korean: 큰 것과 작은 것
  alternatives_korean:
  - 큰 것과 작은 것 하나씩
  - 큰 것과 작은 것의
  lexicon: HALOT
  rationale: 형용사 대조를 한국어에서도 간결하게 살려, 부정직한 이중 잣대를 드러내도록 했습니다.
theological_decisions:
