translation:
  language: ko
  text: 당신은 집에 에바와 에바, 곧 큰 것과 작은 것을 두어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에바는 고대 히브리의 건량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה
  english_pob_choice: You shall not have
  chosen_korean: 두어서는 안 됩니다
  alternatives_korean:
  - 가지고 있어서는 안 됩니다
  - 두지 않아야 합니다
  lexicon: HALOT
  rationale: negated imperfect의 금지 의미를 한국어 법률체로 자연스럽게 옮기되, 단순 소유보다 도량형을 '두다'는 맥락을 살렸습니다.
- source_word: בְּבֵיתְךָ
  english_pob_choice: in your house
  chosen_korean: 집에
  alternatives_korean:
  - 집 안에
  - 가정에
  lexicon: HALOT
  rationale: 저장된 도량형이 놓인 물리적 공간을 가리키므로, 문어체에서 자연스러운 '집에'로 옮겼습니다.
- source_word: אֵיפָה וְאֵיפָה
  english_pob_choice: an ephah and an ephah
  chosen_korean: 에바와 에바
  alternatives_korean:
  - 에바 하나와 다른 에바 하나
  - 두 에바
  lexicon: HALOT
  rationale: 반복 표현을 유지해 서로 다른 두 도량형을 대비시키는 원문 효과를 살렸고, 고유한 고대 건량 단위를 그대로 보존했습니다.
- source_word: גְּדוֹלָה וּקְטַנָּה
  english_pob_choice: a large and a small
  chosen_korean: 큰 것과 작은 것
  alternatives_korean:
  - 큰 것과 작은 것 하나씩
  - 큰 것과 작은 것의
  lexicon: HALOT
  rationale: 형용사 대조를 한국어에서도 간결하게 살려, 부정직한 이중 잣대를 드러내도록 했습니다.
theological_decisions:
- issue: 고대 측정 단위 보존
  chosen_reading: 에바를 음역해 유지합니다.
  alternative_readings:
  - 그릇
  - 되
  - 측량 단위
  rationale: 본문은 일반적 '측정'이 아니라 히브리 고유의 건량 단위를 전제로 하므로, 의미를 평준화하지 않고 역사적·법적 뉘앙스를 보존합니다.
  doctrine_reference: 본문 충실성과 역사적 맥락 보존
