lexical_decisions:
- source_word: לֹא יִהְיֶה
  english_pob_choice: You shall not have
  chosen_korean: 두어서는 안 됩니다
  alternatives_korean:
  - 가지고 있어서는 안 됩니다
  - 두지 않아야 합니다
  lexicon: HALOT
  rationale: negated imperfect의 금지 의미를 한국어 법률체로 자연스럽게 옮기되, 단순 소유보다 도량형을 '두다'는 맥락을 살렸습니다.
- source_word: בְּבֵיתְךָ
  english_pob_choice: in your house
  chosen_korean: 집에
  alternatives_korean:
  - 집 안에
  - 가정에
  lexicon: HALOT
  rationale: 저장된 도량형이 놓인 물리적 공간을 가리키므로, 문어체에서 자연스러운 '집에'로 옮겼습니다.
- source_word: אֵיפָה וְאֵיפָה
  english_pob_choice: an ephah and an ephah
  chosen_korean: 에바와 에바
  alternatives_korean:
