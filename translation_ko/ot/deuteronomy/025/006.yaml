  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'shall rise up upon the name of his dead brother'—that is, he will carry on his brother's line and standing within Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 낳는 첫아들은 죽은 형제의 이름을 이어, 그 형제의 이름이 이스라엘에서 지워지지 않게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 죽은 형제의 이름 위에 일어설 것입니다’입니다. 이는 그 아이가 죽은 형제의 계보와 이스라엘 안에서의 지위를 이어 간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 첫아들
  alternatives_korean:
  - 맏아들
  - 첫째 아들
  lexicon: HALOT
  rationale: 법적·가족적 맥락에서 ‘첫아들’이 בכור의 의미를 자연스럽게 드러내며, 맏아들보다 현대 한국어에서 덜 구어적입니다.
- source_word: תֵּלֵד
  english_pob_choice: whom she bears
  chosen_korean: 그녀가 낳는
  alternatives_korean:
  - 그녀가 출산하는
  - 그녀가 낳을
  lexicon: HALOT
  rationale: 여성 단수 주어를 분명히 살리면서도, 법문체에 맞는 간결한 현재형으로 옮겼습니다.
- source_word: יָקוּם עַל שֵׁם
  english_pob_choice: shall rise up in the name of
  chosen_korean: 이름으로 일어서서
  alternatives_korean:
  - 이름 위에 서서
  - 이름을 이어받아
  lexicon: HALOT
  rationale: 직역에 치우치지 않으면서도, 단순한 ‘이름 짓기’가 아니라 죽은 형제의 이름과 가문적 지위를 이어받는 법적 계승을 드러내기 위해 ‘일어서서’와 ‘이름으로’를 결합했습니다.
- source_word: יִמָּחֶה
  english_pob_choice: may not be blotted out
  chosen_korean: 지워지지 않게
  alternatives_korean:
  - 지워지지 않도록
  - 말소되지 않게
  lexicon: HALOT
  rationale: 이름이 기록에서 제거되는 이미지를 한국어에서 자연스럽게 전달하는 표현으로, ‘말소’보다 읽기 쉬우면서도 본문 의미를 유지합니다.
theological_decisions:
- issue: ורוי/오리지널의 법적·씨족적 의미를 한국어에서 어떻게 보존할지
  chosen_reading: 이 아들은 단순히 같은 이름을 받는 것이 아니라, 죽은 형제의 이름과 그 사람의 이스라엘 안에서의 자리까지 이어받는 것으로 읽히도록 옮겼습니다.
  alternative_readings:
  - 그의 이름을 그대로 물려받는다
  - 죽은 형제의 개인 이름을 그대로 붙인다
  rationale: 히브리어 עַל שֵׁם은 이 문맥에서 개인 명명보다 계보와 명분의 지속을 뜻하므로, 그 법적·사회적 무게를 살리는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
