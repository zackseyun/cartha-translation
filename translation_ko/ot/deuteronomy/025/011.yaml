    reason: cultural_note
  - marker: c
    text: 또는 ‘그의 공격자에게서’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 남성의 생식기를 완곡하게 가리킵니다.
    reason: lexical_alternative
