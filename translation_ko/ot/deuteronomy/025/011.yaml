  text: 한 남자와 그의 형제가 서로 싸울 때[a][b], 그들 가운데 한 사람의 아내가 그를 때리는 사람에게서 자기 남편을 구하려고 가까이 다가와 손을 뻗어 그 사람의 생식기를 붙잡으면[c][d],
