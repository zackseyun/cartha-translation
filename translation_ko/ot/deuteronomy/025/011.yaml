  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
  footnotes:
  - marker: a
    text: Or 'when men fight together.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man and his brother'; 'brother' here can mean a fellow man or compatriot, not necessarily a biological sibling.
    reason: cultural_note
  - marker: c
    text: Or 'from the hand of his attacker.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'his genitals,' a euphemistic expression for the male private parts.
    reason: lexical_alternative
translation:
  language: ko
  text: 남자들이 함께 싸우다가 한 사람과 그의 형제에게서, 그 둘 중 하나의 아내가 자기 남편을 때리는 사람의 손에서 구하려고 가까이 다가와 손을 뻗어 그의 사타구니를 붙잡으면[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 남자들의 실제 몸싸움을 가리키는 조건적 사례를 제시할 수도 있고, ‘남자들이 함께 싸울 때’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘형제’는 여기서 혈연 형제뿐 아니라 동료나 동족을 뜻할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘공격하는 사람의 손에서’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 남성의 생식기를 완곡하게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / יִנָּצוּ
  english_pob_choice: If / are fighting
  chosen_korean: 남자들이 함께 싸우다가
  alternatives_korean:
  - 남자들이 함께 싸우면
  - 남자들이 함께 다투다가
  lexicon: HALOT
  rationale: 법률 사례의 조건문을 한국어로 자연스럽게 옮기되, 실제 몸싸움의 상황을 살려 ‘싸우다가’로 표현했습니다.
- source_word: אֲנָשִׁים ... אִישׁ וְאָחִיו
  english_pob_choice: men ... a man and his brother
  chosen_korean: 한 사람과 그의 형제
  alternatives_korean:
  - 한 사람과 그의 동료
  - 한 사람과 그의 형제 같은 사람
  lexicon: HALOT
  rationale: ‘형제’는 혈연만이 아니라 동료/동족을 가리킬 수 있으나, 원문 표현을 살리기 위해 직역에 가깝게 유지했습니다.
- source_word: אֵשֶׁת הָאֶחָד
  english_pob_choice: the wife of one
  chosen_korean: 그 둘 중 하나의 아내
  alternatives_korean:
  - 한 사람의 아내
  - 그들 중 한 사람의 아내
  lexicon: HALOT
  rationale: 두 남자 중 한 사람의 아내임이 분명하므로, 한국어에서는 관계가 즉시 드러나도록 풀어 옮겼습니다.
- source_word: מִיַּד מַכֵּהוּ
  english_pob_choice: from the hand of the one striking him
  chosen_korean: 때리는 사람의 손에서
  alternatives_korean:
  - 공격하는 사람의 손에서
  - 그를 치는 자의 손에서
  lexicon: HALOT
  rationale: ‘손’ 이미지를 유지하면서도 한국어 독자가 이해하기 쉬운 문맥적 표현으로 옮겼습니다.
- source_word: בִּמְבֻשָׁיו
  english_pob_choice: his genitals
  chosen_korean: 그의 사타구니
  alternatives_korean:
  - 그의 생식기
  - 그의 성기
  - 그의 사적인 부분
  lexicon: HALOT
  rationale: 원문의 완곡어법을 한국어에서도 지나치게 해부학적으로 만들지 않으면서, 남성의 은밀한 신체 부위를 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: 본절의 완곡한 신체 표현을 얼마나 직접적으로 드러낼 것인가
  chosen_reading: ‘사타구니’로 옮겨 원문의 완곡성을 어느 정도 유지하면서도 독자가 실제 신체 부위를 알아차리게 했습니다.
  alternative_readings:
  - ‘성기’로 더 직접적으로 옮김
  - ‘사적인 부분’처럼 더 완곡하게 옮김
  rationale: 원문은 노골적 용어를 피한 완곡 표현이므로, 한국어도 그 긴장을 보존하는 쪽이 source-direct합니다. 다만 본문 의미를 अस्प؟
  doctrine_reference: 해당 없음
