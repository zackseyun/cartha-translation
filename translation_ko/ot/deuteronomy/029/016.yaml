  - 그들의 우상들
  lexicon: HALOT
  rationale: 경멸적 뉘앙스는 본문 주석으로 남기되, 본문에서는 의미를 분명히 하는 ‘우상들’을 사용했습니다.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  english_pob_choice: wood and stone, silver and gold
  chosen_korean: 곧 나무와 돌, 은과 금
  alternatives_korean:
  - 나무와 돌, 은과 금
  - 나무와 돌로 된 것들, 은과 금으로 된 것들
  lexicon: WLC
  rationale: 재료 목록을 한국어의 병렬 표현으로 살리고, 앞의 ‘우상들’에 대한 동격 설명임을 ‘곧’으로 분명히 했습니다.
- source_word: אֲשֶׁר עִמָּהֶם
  english_pob_choice: that were among them
  chosen_korean: 그것들은 그들 가운데 있었습니다
  alternatives_korean:
  - 그들과 함께 있었습니다
  - 그들 사이에 있었습니다
  lexicon: HALOT
  rationale: 문맥상 주변 민족들 가운데 존재하던 우상들을 가리키므로, ‘그들 가운데’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 강한 우상숭배 비난의 보존
  chosen_reading: ‘혐오스러운 것들’과 ‘우상들’을 본문에 함께 두어, 원문의 두 개의 경멸적 표현을 분리해 유지했습니다.
  alternative_readings:
  - 가증한 것들과 우상
  - 우상숭배 대상들
  rationale: 히브리어는 서로 다른 경멸어를 연속 사용합니다. 이를 하나로 완화하지 않고 분리해 옮겨 본문의 비판 강도를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 관계절의 지시 대상
  chosen_reading: ‘그들 가운데 있었습니다’를 유지해, 앞서 언급된 민족들의 영역 안에 있던 우상들을 가리키게 했습니다.
  alternative_readings:
  - 그들과 함께 있었습니다
  - 그들 소유였습니다
  rationale: 관계절은 이스라엘이 아니라 앞선 문맥의 민족들을 향합니다. 소유 의미로 고정하면 문맥을 좁힐 수 있어, 존재 위치를 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3
