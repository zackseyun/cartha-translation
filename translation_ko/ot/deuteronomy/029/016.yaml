  lexicon: WLC
  rationale: 2인칭 복수 과거의 회상 어조를 살리면서, 문맥 연결을 위해 종결형보다 연결형 ‘-았는데’를 택했습니다.
- source_word: שִׁקּוּצֵיהֶם
