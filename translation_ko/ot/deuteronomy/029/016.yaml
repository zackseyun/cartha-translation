  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
  footnotes:
  - marker: a
    text: Or 'their abominations.' The Hebrew שִׁקּוּצִים is a strong term of disgust, often used for idolatrous objects.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew גִּלּוּלִים is a contemptuous word for idols, possibly carrying a crude nuance like 'dung-idols.'
    reason: lexical_alternative
  - marker: c
    text: Or 'that were with them,' referring to the surrounding nations through whose lands Israel passed.
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 그들 가운데 있던 그들의 가증한 것들과 우상들[a], 곧 나무와 돌, 은과 금[c][b]을 보았습니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׁקּוּצִים는 우상숭배 대상에 자주 쓰이는 강한 혐오 표현으로, ‘혐오스러운 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גִּלּוּלִים는 우상을 깎아내리는 경멸어로, 직역하면 ‘똥우상’ 같은 거친 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들과 함께 있던’으로 볼 수 있으며, 이는 이스라엘이 지나온 주변 민족들을 가리킬 수 있습니다.
    reason: alternative_reading
