  - 그들의 혐오물
  lexicon: HALOT
  rationale: שִׁקּוּץ의 강한 혐오·가증 의미를 현대 한국어로 자연스럽게 옮기기 위해 ‘혐오스러운 것들’을 선택했습니다.
- source_word: גִּלֻּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
