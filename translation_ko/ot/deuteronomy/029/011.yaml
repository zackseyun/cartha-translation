reference: Deuteronomy 29:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
  footnotes:
  - marker: a
    text: Or, 'and into his oath-bound curse'; the Hebrew term can denote an oath that includes covenant sanctions or curses.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'is cutting with you today,' a Hebrew idiom for making a covenant.
    reason: cultural_note
translation:
  language: ko
  text: 야훼 당신의 하나님의 언약 안으로, 그리고 그의 맹세 안으로 들어가게 하려는 것입니다. 이는 야훼 당신의 하나님께서 오늘 당신과 함께 맺고 계시는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 저주가 따르는 맹세’로도 옮길 수 있습니다. 히브리어 אָלָה는 언약 제재나 저주를 포함하는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오늘 당신과 함께 언약을 자르고 계시는 것입니다’입니다. 히브리어 관용구로 ‘언약을 맺다’라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  english_pob_choice: so that you may enter
  chosen_korean: 들어가게 하려는 것입니다
  alternatives_korean:
  - 들어가게 하시려고
  - 지나가게 하려는 것입니다
  lexicon: HALOT
  rationale: 히브리어 목적·결과 용법을 살리되, 언약 문맥에서 자연스럽게 읽히도록 ‘들어가다’로 옮겼습니다. 단순한 공간 이동보다 언약에 참여하는 뜻을 드러냅니다.
- source_word: בִּבְרִית
  english_pob_choice: into the covenant
  chosen_korean: 언약 안으로
  alternatives_korean:
  - 언약 속으로
  - 언약 가운데
  lexicon: HALOT
  rationale: ‘in/into’의 관계를 한국어에서는 ‘안으로’로 풀어, 언약에 진입한다는 의미를 분명하게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 신명기의 여호와 표기를 쓰지 않고, 하나님의 고유명사인 야훼를 직접 옮겼습니다.
- source_word: וּבְאָלָתוֹ
  english_pob_choice: and into his oath
  chosen_korean: 그리고 그의 맹세 안으로
  alternatives_korean:
  - 그리고 그의 맹세와 함께
  - 그리고 그의 저주 안으로
  lexicon: HALOT
  rationale: אָלָה는 맹세를 가리킬 수 있지만, 언약 제재나 저주의 뉘앙스도 품습니다. 본문에는 기본 의미인 ‘맹세’를 두고, 제재의 긴장은 주석으로 보존했습니다.
- source_word: כֹּרֵת
  english_pob_choice: is making
  chosen_korean: 맺고 계시는 것입니다
  alternatives_korean:
  - 만드시는 것입니다
  - 자르고 계시는 것입니다
  lexicon: HALOT
  rationale: ‘언약을 자르다’라는 히브리 관용구를 직역하면 한국어에서 난해하므로, 현대 한국어에서 자연스러운 ‘맺다’로 옮기되 현재 진행성을 살렸습니다.
theological_decisions:
- issue: אָלָה를 본문에서 어떻게 드러낼지
  chosen_reading: ‘맹세’로 번역하고 저주/제재의 의미는 주석으로 보존합니다.
  alternative_readings:
  - ‘저주’로 번역합니다.
  - ‘저주가 포함된 맹세’로 확장해 번역합니다.
  rationale: 본문의 흐름은 언약 체결과 함께하는 맹세를 말하지만, 단어 자체는 언약 제재를 포함할 수 있습니다. 본문을 과도하게 해석하지 않으면서도 그 긴장을 잃지 않기 위해 주석 처리했습니다.
  doctrine_reference: Translation philosophy §3 — 신학적 긴장 보존
