  rationale: טַף는 단순한 ‘자녀’보다 어린아이/부양 자녀의 뉘앙스가 강하므로, 한국어에서는 자연스럽고 구체적인 ‘어린 자녀들’로 옮겼습니다.
- source_word: וְגֵרְךָ
  english_pob_choice: and the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인 거주자
  - 객
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 공동체 안에 거주하는 이방인 거주자를 가리키므로, 교회 용어의 관성보다 사회적·공간적 뉘앙스를 살리는 ‘나그네’로 옮겼습니다.
- source_word: בְּקֶרֶב מַחֲנֶיךָ
  english_pob_choice: in the midst of your camp
  chosen_korean: 당신들의 진영 한가운데
  alternatives_korean:
  - 당신들의 진영 가운데
  - 당신들의 진영 안에
  - 당신들의 진중에
  lexicon: HALOT
  rationale: ‘한가운데’는 בְּקֶרֶב의 중심적 위치를 분명히 드러내며, 언약 공동체 안에 포함된다는 의미도 함께 살립니다.
- source_word: מֵחֹטֵב עֵצֶיךָ ... עַד שֹׁאֵב מֵימֶיךָ
  english_pob_choice: from the one who chops your wood to the one who draws your water
  chosen_korean: 당신들의 나무를 패는 사람부터 당신들의 물을 긷는 사람까지
  alternatives_korean:
  - 당신들의 장작패는 사람부터 당신들의 물길어 오는 사람까지
  - 당신들의 나무꾼부터 당신들의 물긷는 사람까지
  - 당신들의 나무를 자르는 사람부터 당신들의 물을 퍼 올리는 사람까지
  lexicon: HALOT
  rationale: 히브리어 분사구는 낮은 신분의 반복적 노동을 나타내므로, 직업명보다 행위를 드러내는 현재형 표현으로 옮겨 범위와 사회적 대비를 보존했습니다.
theological_decisions:
- issue: 공동체 포함 범위
  chosen_reading: 이 구절은 이스라엘 혈통 내부만이 아니라, 진영 안의 나그네와 가장 낮은 노동자까지 포함해 언약 공동체 전체를 가리킵니다.
  alternative_readings:
  - 이스라엘 사람들만 열거한 것이다
  - 노동자들은 단지 비유적 표현이다
  rationale: 본문의 직접적인 열거는 포함의 폭을 좁히지 않으며, 사회적 범주 전체를 드러냅니다. 이는 교리적 확장이라기보다 히브리어 문장의 평이한 의미를 보존하는 선택입니다.
  doctrine_reference: Translation philosophy §1, §3
