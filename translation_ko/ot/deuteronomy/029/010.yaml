translation:
  language: ko
  text: 당신들의 어린 자녀들과 당신들의 아내들과, 당신들의 진영 한가운데 있는 나그네, 곧 당신들의 나무를 패는 사람부터 당신들의 물을 긷는 사람까지입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린 자녀들’은 히브리어 טַף가 특히 어린아이들 또는 부양 자녀들을 가리킨다는 점을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 히브리어 גֵּר가 공동체 안에 거주하는 이방인 거주자를 가리킨다는 점을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  english_pob_choice: your little ones
  chosen_korean: 당신들의 어린 자녀들
  alternatives_korean:
  - 당신들의 자녀들
  - 당신들의 어린아이들
