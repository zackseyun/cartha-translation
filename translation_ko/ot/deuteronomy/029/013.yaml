  lexicon: HALOT
  rationale: 신명기적 문맥에서 בְּרִית의 언약적·신학적 무게를 살리기 위해 ‘언약’을 채택했습니다.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  english_pob_choice: and this oath
  chosen_korean: 이 맹세
  alternatives_korean:
  - 이 저주
  - 이 서약
  lexicon: HALOT
  rationale: אָלָה는 문맥상 맹세이면서도 그 안에 저주 조항을 포함할 수 있어, 본문에서는 의미의 긴장을 살려 ‘맹세’로 두었습니다.
theological_decisions:
- issue: אָלָה의 번역에서 맹세와 저주 사이의 긴장
  chosen_reading: 본문에는 ‘맹세’로 두고, 저주 가능성은 주석에서 열어 둡니다.
  alternative_readings:
  - 저주
  - 서약
  rationale: 언약 체결 문맥에서 אָלָה는 단순한 감정적 저주가 아니라 서약에 결부된 제재를 가리킬 수 있으므로, 한쪽으로만 고정하지 않고 의미 범위를 보존했습니다.
  doctrine_reference: 언약 제재의 다의성을 보존해야 한다는 원칙
