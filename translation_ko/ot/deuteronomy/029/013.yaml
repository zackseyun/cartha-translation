  text: 그리고 내가 이 언약과 이 맹세를 너희와만 맺는 것이 아닙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 언약을 자르다’입니다. 본문에서는 한국어 관용에 따라 ‘맺다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 저주.’ 히브리어 אָלָה는 맹세 자체를 가리키기도 하고, 그 맹세에 수반된 저주 제재를 가리키기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אִתְּכֶם לְבַדְּכֶם
  english_pob_choice: And it is not with you alone
  chosen_korean: 그리고 내가 너희와만이 아니라
