  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘언약을 자르다’를 한국어 본문에서는 통상적인 언약 행위로 자연스럽게 옮기되, 관용의 행위성을 유지했습니다.
- source_word: הַבְּרִית הַזֹּאת
  english_pob_choice: this covenant
  chosen_korean: 이 언약
  alternatives_korean:
