  - 모든 민족이 말할 것입니다
  lexicon: HALOT
  rationale: 예언적 미래 진술의 흐름을 살려 자연스럽게 미래로 옮기고, 문맥 연결을 나타내는 접속은 ‘그러면’으로 처리했습니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
