  rationale: 이 절은 민족들이 야훼의 심판 행위를 묻는 장면이므로, 언약의 고유 이름을 보존하는 것이 문맥상 더 직접적입니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
