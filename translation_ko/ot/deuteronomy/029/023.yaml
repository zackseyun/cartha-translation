  source_fidelity: 핵심 의미는 충실합니다. וְאָמְרוּ는 예언적 문맥에 맞게 미래로, יְהוָה는 ‘야훼’로, חֳרִי הָאַף는 불의 은유를 보존한 ‘불타는 분노’로 옮겼습니다. 다만 접속사 וְ를 ‘그러면’으로 옮기면 원문에 없는 조건·귀결의 뉘앙스가 생깁니다.
