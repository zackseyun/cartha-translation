  - 모든 민족들
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 심판을 보고 반응하는 외국 집단 전체를 가리키므로, 지리적·정치적 뉘앙스를 유지하면서도 한국어에서 자연스러운 ‘민족’으로 옮겼습니다.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  english_pob_choice: Why this great burning anger
  chosen_korean: 왜 이 큰 타오르는 분노입니까
  alternatives_korean:
  - 왜 이 큰 불타는 분노입니까
  - 왜 이 큰 격렬한 분노입니까
  lexicon: HALOT
  rationale: 히브리어의 ‘왜/무엇 때문에’라는 질문 구조와 ‘불타는/타오르는’의 불의 은유를 살렸고, הָאַף의 관용적 ‘분노’를 직역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
