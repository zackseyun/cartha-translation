  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 직함으로 대체하지 않고, 주어진 번역 원칙에 따라 고유명사 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 대체 여부
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직역합니다.
  alternative_readings:
