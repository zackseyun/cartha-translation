  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
  footnotes:
  - marker: a
    text: Or 'every man of Israel.' The Hebrew is literally 'every man of Israel,' a distributive expression.
    reason: lexical_alternative
  - marker: b
    text: '''Your heads'' may also be understood idiomatically as ''your leaders'' or, with the next word taken closely, ''the heads of your tribes.'''
    reason: alternative_reading
translation:
  language: ko
  text: 오늘 여러분은 모두 야훼 여러분의 하나님 앞에 서 있습니다. 여러분의 우두머리들, 여러분의 지파들, 여러분의 장로들, 여러분의 관리들 — 이스라엘의 모든 남자들이 그렇습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 모든 남자’이며, 분배적 표현일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 우두머리들’은 관용적으로 ‘여러분의 지도자들’로 이해될 수도 있으며, 다음 말과 밀접하게 묶어 ‘지파들의 우두머리들’로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּבִים
  english_pob_choice: are standing
  chosen_korean: 서 있습니다
  alternatives_korean:
