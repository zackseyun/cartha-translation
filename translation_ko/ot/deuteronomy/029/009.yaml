  - 서 있지요
  - 자리를 잡고 있습니다
  lexicon: HALOT
  rationale: 현재의 집합된 모습을 나타내는 분사적 의미를 살려, 단순 명령이 아니라 하나님 앞에 ‘서 있는’ 상태를 자연스럽게 표현했습니다.
- source_word: רָאשֵׁיכֶם
  english_pob_choice: your heads
  chosen_korean: 여러분의 우두머리들
