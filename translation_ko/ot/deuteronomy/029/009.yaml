  lexicon: HALOT
  rationale: 히브리어의 문자적 비유를 그대로 옮기기보다, 이어지는 목록 속에서 신분·직분을 가리키는 관용적 뜻을 한국어로 분명하게 드러냈습니다.
- source_word: שֹׁטְרֵיכֶם
  english_pob_choice: your officers
  chosen_korean: 여러분의 관리들
  alternatives_korean:
