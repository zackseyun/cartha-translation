  lexicon: HALOT
  rationale: 신명기적 행정 맥락에서 שֹׁטְרִים는 단순한 서기관보다 행정 집행 책임자에 가깝기 때문에, 기능을 살려 ‘관리들’로 옮겼습니다.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 이스라엘의 모든 남자들
  alternatives_korean:
  - 이스라엘의 모든 남자들
  - 이스라엘의 모든 사람들
  - 이스라엘의 모든 남성들
  lexicon: HALOT
  rationale: אִישׁ의 남성 단수 분배 용법을 반영하여, 성별 표지를 지우지 않고 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약의 신적 이름을 직접 사용하므로, 대체 칭호가 아니라 고유 নাম의 음역을 유지해 신명기 본문의 언약적 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 집합 목록의 사회적 지칭
  chosen_reading: ‘우두머리들, 지파들, 장로들, 관리들’의 목록을 유지했습니다.
  alternative_readings:
  - ‘지도자들’로 통합
  - ‘지파의 우두머리들’로 묶기
  rationale: 히브리어의 열거 구조를 평탄화하지 않고 유지하여, 공동체 전체가 계층별로 하나님 앞에 선다는 문맥을 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
