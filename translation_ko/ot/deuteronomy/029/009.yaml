base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
  footnotes:
  - marker: a
    text: Or 'every man of Israel.' The Hebrew is literally 'every man of Israel,' a distributive expression.
    reason: lexical_alternative
  - marker: b
    text: '''Your heads'' may also be understood idiomatically as ''your leaders'' or, with the next word taken closely, ''the heads of your tribes.'''
    reason: alternative_reading
translation:
  language: ko
  text: 오늘 여러분 모두는 야훼 여러분의 하나님 앞에 서 있습니다. 여러분의 우두머리들[b], 여러분의 지파들, 여러분의 장로들, 여러분의 관리들, 곧 이스라엘의 모든 남자들[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 모든 남자’이며, ‘이스라엘의 남자 한 사람 한 사람’이라는 분배적 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 우두머리들’은 관용적으로 ‘여러분의 지도자들’로 이해할 수도 있으며, 다음 말과 밀접하게 묶어 ‘여러분의 지파들의 우두머리들’로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
