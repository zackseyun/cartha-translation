  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
  footnotes:
  - marker: a
    text: Or 'this curse.' The Hebrew term can denote an oath that carries a curse.
    reason: alternative_reading
  - marker: b
    text: Or possibly 'to sweep away the watered land with the dry,' that is, to destroy everything alike.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이 맹세의 말씀들을 들을 때에, 마음속으로 스스로를 축복하며 말하기를, ‘내게 평강이 있으리라. 내가 마음의 완고함대로 걸어가더라도’—그리하여 물이 많은 것을 목마른 것과 함께 쓸어버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 저주’입니다. 히브리어 용어는 저주를 동반한 맹세를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘물이 많은 땅을 마른 땅과 함께 쓸어버린다’는 뜻일 수 있습니다. 곧 모든 것을 가리지 않고 멸한다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  english_pob_choice: oath
  chosen_korean: 맹세
  alternatives_korean:
  - 저주
  - 언약의 저주
  lexicon: HALOT
  rationale: 이 문맥에서는 들은 ‘말씀들’과 직접 연결되는 언약적 선서가 전면에 나오므로 ‘맹세’가 본문 흐름을 가장 자연스럽게 살립니다. 다만 санк션 성격은 문맥에 남아 있습니다.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  english_pob_choice: he blesses himself in his heart
  chosen_korean: 마음속으로 스스로를 축복하며
  alternatives_korean:
  - 마음속으로 스스로를 축하하며
  - 마음속으로 자신이 복되다고 여기며
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 살려 ‘스스로를 축복하다’로 옮겼습니다. 자기확신의 아이러니도 비교적 그대로 드러납니다.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  english_pob_choice: I will have peace
  chosen_korean: 내게 평강이 있으리라
  alternatives_korean:
  - 내게 평안이 있으리라
  - 나는 안전할 것이다
  lexicon: HALOT
  rationale: שָׁלוֹם의 폭넓은 의미를 살리되, 한국어에서 예언적·언약적 어감이 있는 ‘평강’을 택했습니다. 자기안일의 선언이라는 뉘앙스도 유지됩니다.
- source_word: שְׁרִרוּת לִבִּי
  english_pob_choice: the stubbornness of my heart
  chosen_korean: 마음의 완고함
  alternatives_korean:
  - 내 마음의 완고함
  - 내 마음의 고집
  lexicon: HALOT
  rationale: שְׁרִרוּת은 단순한 취향이 아니라 굳은 고집과 완고함을 뜻하므로 ‘완고함’이 가장 직접적입니다. 소유격은 한국어에서 자연스럽게 처리했습니다.
- source_word: הָרָוָה אֶת הַצְּמֵאָה
  english_pob_choice: the well-watered with the thirsty
  chosen_korean: 물이 많은 것을 목마른 것과 함께
  alternatives_korean:
  - 물기가 많은 것을 메마른 것과 함께
  - 젖은 것을 마른 것과 함께
  lexicon: HALOT
  rationale: 난해한 관용구를 해석으로 단정하지 않고, 원문의 병렬적 대비를 최대한 보존했습니다. POB의 주석적 긴장을 따라 ‘well-watered/thirsty’의 이미지를 유지했습니다.
theological_decisions:
- issue: הָאָלָה의 언약적 무게를 어떻게 드러낼 것인가
  chosen_reading: 본문에는 ‘맹세’를 두되, 그 안에 저주가 수반되는 언약적 선언이라는 긴장은 유지합니다.
  alternative_readings:
  - 저주
  - 맹세와 저주
  rationale: 문맥상 단순한 저주보다 ‘들어야 할 언약 조항’이 먼저이므로, 본문은 ‘맹세’가 더 정확합니다. 동시에 אָלָה의 제재 성격을 지워버리지 않도록 해석을 과도하게 순화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: וְ/הַצְּמֵאָה의 난해한 이미지를 어떻게 처리할 것인가
  chosen_reading: 원문의 모호성을 풀어버리지 않고 ‘물이 많은 것과 목마른 것’이라는 상징을 그대로 남겼습니다.
  alternative_readings:
  - 물이 많은 땅과 마른 땅
  - 젖은 것과 마른 것
  rationale: 이 절은 의도적으로 해석 여지를 남기는 표현이므로, 본문에서 하나의 설명으로 고정하지 않았습니다. 독자가 경고의 급진성을 그대로 느끼도록 보존하는 것이 바람직합니다.
  doctrine_reference: Translation philosophy §3
