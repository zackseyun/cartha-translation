reference: Deuteronomy 29:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
  footnotes:
  - marker: a
    text: Or 'the later generation.' The Hebrew expression refers to a future generation after the present one, not necessarily the final generation.
    reason: lexical_alternative
  - marker: b
    text: Or 'its diseases' for 'its sicknesses.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'which the LORD has made sick in it' or 'has afflicted in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다음 세대—곧 너희 뒤에 일어날 너희 자녀와 먼 땅에서 오는 외국인이—그 땅의 재앙과 야훼께서 그 땅 안에 내리신 질병을 보며 말할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다음 세대’는 문자적으로는 ‘나중 세대’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘질병’은 문자적으로 ‘병들음들/질환들’의 복수 개념을 간명하게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼께서 그 땅 안에 내리신’은 문자적으로 ‘그 땅 안에서 병들게 하신/괴롭게 하신’의 뜻을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: הַדּוֹר הָאַחֲרוֹן
  english_pob_choice: the generation to come
  chosen_korean: 다음 세대
  alternatives_korean:
  - 후세대
  - 나중 세대
  lexicon: HALOT
  rationale: 미래의 세대를 가리키는 뜻을 자연스러운 현대 한국어로 옮겼습니다. 종말론적 ‘마지막 세대’처럼 들리지 않도록 했습니다.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  english_pob_choice: your children who rise up after you
  chosen_korean: 너희 뒤에 일어날 너희 자녀
  alternatives_korean:
  - 너희 뒤에 올 너희 아들들
  - 너희 뒤를 이을 너희 자손
  lexicon: HALOT
  rationale: בנים의 포괄적 의미를 살려 ‘자녀’로 옮기고, ‘뒤에 일어날’로 후속 세대의 출현을 살렸습니다.
- source_word: וְהַנָּכְרִי
  english_pob_choice: the foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 타국인
  - 이방인
  lexicon: HALOT
  rationale: עַם 바깥의 사람이라는 민족적·지리적 뉘앙스를 현대어로 분명하게 전달하는 표현을 택했습니다.
- source_word: מַכּוֹת הָאָרֶץ
  english_pob_choice: the plagues of that land
  chosen_korean: 그 땅의 재앙
  alternatives_korean:
  - 그 땅의 재난
  - 그 땅의 치명타
  lexicon: HALOT
  rationale: מכות는 여기서 언약 저주의 징벌적 재난을 가리키므로 ‘재앙’이 가장 직접적입니다.
- source_word: תַּחֲלֻאֶיהָ
  english_pob_choice: its sicknesses
  chosen_korean: 질병
  alternatives_korean:
  - 병들음
  - 병환
  lexicon: HALOT
  rationale: 토지에 덮인 병적 상태를 자연스럽게 살리되, 한국어에서는 복수형을 굳이 드러내지 않고 ‘질병’으로 압축했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 원칙대로 신명사 יְהוָה는 호칭이 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 여호와 대체어를 쓰지 않고 하나님의 언약 이름을 사용하므로, 한국어 본문에서도 그 고유성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘질병’과 ‘재앙’의 병치
  chosen_reading: 재앙과 ... 질병
  alternative_readings:
  - 재난과 ... 병들음
  - 징벌과 ... 병
  rationale: 땅에 대한 심판이 외적 재앙과 내부적 병증으로 함께 묘사된다는 긴장을 살리기 위해 두 표현을 모두 유지했습니다.
  doctrine_reference: 본문의 평행구조와 언약 저주 문맥
