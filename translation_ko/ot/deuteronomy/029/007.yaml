  source_fidelity: 히브리어의 두 등위 동사(‘우리가 그들의 땅을 취하고/차지하고’, ‘그것을 주었다’)와 여성 단수 대명사 목적어(‘그 땅을’) 및 분배 대상의 집단적 의미를 대체로 잘 반영했습니다. 다만 ‘차지하여’는 앞 동사를 뒤 동사의 수단·선행 행위처럼 연결하므로, 원문의 단순 병렬을 더 충실히 반영하는 ‘차지하고’가 적절합니다.
  naturalness: ‘르우벤 사람들’, ‘갓 사람들’은 현대 한국어에서 지파를 가리키는 표현으로 다소 어색하고 개인들의 집합처럼 들릴 수 있습니다. 이 문맥의 집단적·부족적 지시를 자연스럽게 나타내는 ‘르우벤 지파’, ‘갓 지파’가 더 좋습니다.
  terminology: ‘기업으로’는 נַחֲלָה의 토지 상속·분배 의미를 보존하는 성경적이며 자연스러운 용어입니다. ‘므낫세 반 지파’도 חֲצִי שֵׁבֶט의 통상적이고 정확한 표현입니다. 고유명사 표기는 일관됩니다.
  issues:
