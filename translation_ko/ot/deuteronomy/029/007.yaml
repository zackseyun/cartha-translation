  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'and the half-tribe of Manasseh.' The Hebrew uses the gentilic form 'the Manassite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 그들의 땅을 차지하여 르우벤 사람들과 갓 사람들과 므낫세 반 지파에게 기업으로 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  english_pob_choice: and we took
  chosen_korean: 그리고 우리는 … 차지하여
  alternatives_korean:
  - 그리고 우리는 … 취하여
  - 그리고 우리는 … 가져
  lexicon: HALOT
  rationale: 점진적 서술 속에서 לקח의 기본 의미는 'take'이지만, 정복 문맥에서는 '차지하다'가 결과를 더 자연스럽게 드러냅니다. 지나치게 강한 '빼앗다'는 원문의 동사를 넘어섭니다.
- source_word: אַרְצָם
  english_pob_choice: their land
  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그들의 나라
  - 그들의 영토
  lexicon: HALOT
  rationale: 아레츠는 여기서 패배한 왕들의 소유권이 있던 영토를 가리키므로, 한국어에서는 가장 직접적인 '땅'이 적절합니다.
- source_word: לְנַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 기업으로
  alternatives_korean:
  - 상속으로
  - 유산으로
  lexicon: HALOT
  rationale: נַחֲלָה는 언약적 분배를 포함한 '상속받은 몫'을 뜻하므로, 한국어 성경 용례에 맞는 '기업'이 의미를 잘 보존합니다.
- source_word: לָראוּבֵנִי / וְלַגָּדִי / וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  english_pob_choice: to the Reubenites, the Gadites, and the half-tribe of the Manassites
  chosen_korean: 르우벤 사람들, 갓 사람들, 므낫세 반 지파
  alternatives_korean:
  - 르우벤 지파, 갓 지파, 므낫세 반 지파
  - 르우벤 사람들, 갓 사람들, 므낫세 사람들의 반 지파
  lexicon: HALOT
  rationale: 히브리어의 민족형/형용사형을 한국어에서는 집단명사로 풀어 '사람들'로 옮기면 자연스럽고, חֲצִי שֵׁבֶט은 직역해 '반 지파'로 살렸습니다. POB의 'Manassites'처럼 집단성을 유지하면서도 한국어 가독성을 확보합니다.
