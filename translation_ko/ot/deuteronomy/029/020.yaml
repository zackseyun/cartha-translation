source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
  footnotes:
  - marker: a
    text: Or 'the oath-curses of the covenant.' The Hebrew term can refer specifically to covenant curses invoked by oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 이스라엘의 모든 지파 가운데서 그를 골라 내어 재앙을 내리실 것이며, 이 책, 곧 이 율법책에 기록된 언약의 모든 저주에 따라 그렇게 하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약의 맹세 저주들’입니다. 히브리어는 언약 맥락에서 맹세로 불러내는 저주를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילֹו
  english_pob_choice: will single him out
  chosen_korean: 그를 골라 내어
  alternatives_korean:
  - 그를 구별하여
  - 그를 따로 떼어 내어
  lexicon: HALOT
  rationale: הִבְדִּיל의 사역형은 누군가를 집단에서 떼어 놓는 뜻이므로, 심판 맥락에서 ‘골라 내어’가 대상화된 처리를 자연스럽게 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 본문의 신명기적 언약 이름을 본문 그대로 드러내기 위해 YHWH를 ‘야훼’로 옮겼습니다.
- source_word: לְרָעָה
  english_pob_choice: for disaster
  chosen_korean: 재앙을 내리실 것이며
  alternatives_korean:
  - 악을 내리실 것이며
  - 해악을 내리실 것이며
  - 재난을 내리실 것이며
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 언약 저주의 결과로 오는 파괴적 심판이므로, ‘재앙’이 가장 분명합니다.
- source_word: כְּכֹל אָל֣וֹת הַבְּרִית
  english_pob_choice: according to all the curses of the covenant
  chosen_korean: 언약의 모든 저주에 따라
  alternatives_korean:
  - 언약의 모든 저주대로
  - 언약의 모든 저주를 따라
  lexicon: HALOT
  rationale: כְּכֹל은 대응·일치의 뜻이므로 ‘...에 따라’로 옮기고, אָלוֹת은 언약 맥락의 저주 조항을 가리켜 ‘저주’로 직역에 가깝게 유지했습니다.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  english_pob_choice: in this book of the law
  chosen_korean: 이 책, 곧 이 율법책에
  alternatives_korean:
  - 이 율법책에
  - 이 율법의 책에
  lexicon: HALOT
  rationale: סֵפֶר은 ‘책/두루마리’ 모두 가능하나 한국어 본문에서는 자연스럽게 ‘책’으로 두고, תּוֹרָה는 언약 규범을 가리키므로 ‘율법책’으로 구체화했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 신명기 본문은 언약 이름 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: לְרָעָה의 의미
  chosen_reading: 재앙을 내리실 것이며
  alternative_readings:
  - 악을 내리실 것이며
  - 해를 끼치실 것이며
  rationale: 본문은 하나님의 도덕적 악행이 아니라 언약 위반자에게 내리는 징벌을 말하므로, 심판의 결과를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: readable modern Korean; do not import doctrinal claims the text does not make'
