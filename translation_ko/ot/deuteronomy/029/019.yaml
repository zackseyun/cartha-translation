revisions:
- from: 야훼께서는 그를 용서하기를 결코 원하지 않으실 것입니다. 그러므로 야훼의 분노와 그의 질투가 그 사람에게 타올라, 이 책에 기록된 모든 저주가 그에게 내려앉을 것이며, 야훼께서는 그의 이름을 하늘 아래에서 지워 버리실 것입니다.[a]
  to: 야훼께서는 그를 용서하려 하지 않으실 것입니다. 이는 그때에 야훼의 분노와 질투가 그 남자를 향하여 타오르고, 이 책에 기록된 모든 저주[a]가 그에게 내려앉으며, 야훼께서 그의 이름을 하늘 아래에서 지워 버리실 것이기 때문입니다.
  rationale: 설명적·시간적 접속인 כִּי אָז를 ‘이는 그때에 … 것이기 때문입니다’로 바로잡고, 남성 단수 지시어와 심판의 불타는 이미지를 보존했습니다. 저주가 ‘내려앉는’ 지속적 이미지는 유지했으며, 각주 표지를 해당 어휘로 옮겼습니다.
