id: DEU.29.19
reference: Deuteronomy 29:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
  footnotes:
  - marker: a
    text: Or 'every oath-curse'; the Hebrew term can denote a curse invoked in covenant oath context, not merely a general malediction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 그를 용서하기를 결코 원하지 않으실 것입니다. 그러므로 야훼의 분노와 그의 질투가 그 사람에게 타올라, 이 책에 기록된 모든 저주가 그에게 내려앉을 것이며, 야훼께서는 그의 이름을 하늘 아래에서 지워 버리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 맹세-저주'. 히브리어 אָלָה는 일반적인 저주뿐 아니라 언약 맹세 문맥의 저주를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 POB의 기준대로 야훼를 사용했습니다.
- source_word: יֹאבֶה ... לִסְלֹחַ לוֹ
  english_pob_choice: will not be willing to forgive him
  chosen_korean: 그를 용서하기를 결코 원하지 않으실 것입니다
  alternatives_korean:
  - 그를 용서하려 하지 않으실 것입니다
  - 그를 용서할 뜻이 없으실 것입니다
  lexicon: HALOT
  rationale: אבה의 핵심은 능력이 아니라 의지이므로, '원하지 않으실 것입니다'로 volitional force를 살렸습니다.
- source_word: אַף ... יֶעְשַׁן
  english_pob_choice: the anger ... will burn
  chosen_korean: 분노가 ... 타올라
  alternatives_korean:
  - 분노가 ... 불탈 것입니다
  - 분노가 ... 연기처럼 피어오를 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 비유를 유지하되 한국어에서는 자연스럽게 '타오르다'로 옮겨 분노의 격렬함을 보존했습니다.
- source_word: קִנְאָתוֹ
  english_pob_choice: his jealousy
  chosen_korean: 그의 질투
  alternatives_korean:
  - 그의 열심
  - 그의 열정적 질투
  lexicon: HALOT
  rationale: 언약 심판 문맥에서 קנאה는 질투/열심의 긴장을 가지지만, 여기서는 직접적인 의미인 '질투'를 택했습니다.
- source_word: הָאִישׁ הַהוּא
  english_pob_choice: that man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수이지만 한국어에서는 문맥상 자연스러운 지시를 위해 '그 사람'으로 옮겼습니다.
- source_word: וְרָבְצָה בּוֹ
  english_pob_choice: will settle on him
  chosen_korean: 그에게 내려앉을 것이며
  alternatives_korean:
  - 그에게 머물 것이며
  - 그에게 덮칠 것이며
  lexicon: HALOT
  rationale: רבץ의 '엎드리다/눕다' 이미지를 저주가 지속적으로 임하는 상태로 살려 '내려앉다'를 선택했습니다.
- source_word: כָּל הָאָלָה
  english_pob_choice: every curse
  chosen_korean: 모든 저주
  alternatives_korean:
  - 모든 맹세-저주
  - 모든 언약 저주
  lexicon: HALOT
  rationale: 본문의 즉각적 의미는 '저주'이므로 본문에는 간결하게 두고, 언약 맹세의 뉘앙스는 각주로 처리했습니다.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  english_pob_choice: will blot out his name
  chosen_korean: 그의 이름을 ... 지워 버리실 것입니다
  alternatives_korean:
  - 그의 이름을 ... 말소하실 것입니다
  - 그의 이름을 ... 없애 버리실 것입니다
  lexicon: HALOT
  rationale: שֵׁם의 삭제는 기억과 후손의 소멸을 아우르는 관용구이므로, 한국어에서 익숙한 '지워 버리다'로 옮겼습니다.
theological_decisions:
- issue: 언약 저주 어휘의 처리
  chosen_reading: 본문에는 '모든 저주'를 두고, 각주로 '맹세-저주' 가능성을 밝혔습니다.
  alternative_readings:
  - 모든 맹세-저주
  - 온갖 저주
  rationale: 신명기 문맥에서 אָלָה는 단순한 악담이 아니라 언약 맹세와 결부된 저주이므로, 본문 가독성과 주석 가능성을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 신적 정서의 비유 유지
  chosen_reading: '''분노와 그의 질투가 ... 타올라''로 히브리어의 생생한 비유를 유지했습니다.'
  alternative_readings:
  - 분노가 ... 불타오를 것입니다
  - 분노가 ... 격해질 것입니다
  rationale: 원문은 하나님의 심판을 완곡하게 풀지 않고 감정적·언약적 긴장을 드러내므로, 그 이미지가 약화되지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
