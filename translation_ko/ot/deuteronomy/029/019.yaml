  verdict: revise
  source_fidelity: ‘그러므로’는 히브리어 כִּי אָז(‘이는/왜냐하면 그때에’)의 설명적·시간적 연결을 결과 접속으로 바꾸므로 수정이 필요합니다. 또한 הָאִישׁ הַהוּא의 남성 단수를 ‘그 남자’로 명시하고, 분노와 질투가 그를 향해 타오르는 원문의 심판 이미지를 더 자연스럽게 재현했습니다.
  naturalness: ‘이는 그때에 … 것이기 때문입니다’는 합쇼체의 현대 한국어에서 앞 문장의 이유를 자연스럽게 연결합니다. ‘분노와 질투가 그 남자를 향하여 타오르고’는 원문의 병렬된 주어와 심판의 방향을 매끄럽게 드러냅니다.
  terminology: יַהְוֶה는 초안의 방침대로 ‘야훼’로 유지했습니다. קִנְאָה는 직역적 핵심어인 ‘질투’를 유지했고, אָלָה는 본문에서 ‘저주’로 번역하되 언약 맹세 문맥의 ‘맹세-저주’ 뉘앙스를 해당 어휘 바로 뒤 각주로 보존했습니다.
