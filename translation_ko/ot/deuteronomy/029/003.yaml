translation:
  language: ko
  text: 그러나 야훼께서는 이 날까지 여러분에게 알 마음과 볼 눈과 들을 귀를 주지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  english_pob_choice: But ... not
  chosen_korean: 그러나 ... 않으셨습니다
  alternatives_korean:
  - 그리고 ... 않으셨습니다
  - 그런데 ... 않으셨습니다
  lexicon: HALOT
  rationale: 앞선 문맥과의 대비를 살리면서 부정문을 자연스럽게 잇기 위해 역접인 ‘그러나’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사명의 고유성을 살려 전통적 대체어가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: לֵב לָדַעַת
  english_pob_choice: a heart to know
  chosen_korean: 알고자 하는 마음
  alternatives_korean:
  - 알아야 할 마음
  - 앎의 마음
  - 깨닫는 마음
  lexicon: HALOT
  rationale: 히브리어 לֵב의 인지·의지 중심을 ‘마음’으로 살리되, לָדַעַת는 단순 지식보다 ‘알고자 하는’ 동작성으로 옮겼습니다.
- source_word: וְעֵינַיִם לִרְאוֹת / וְאָזְנַיִם לִשְׁמֹעַ
  english_pob_choice: or eyes to see, or ears to hear
  chosen_korean: 보려고 하는 눈도, 들으려고 하는 귀도
  alternatives_korean:
  - 보는 눈도, 듣는 귀도
  - 볼 눈도, 들을 귀도
  lexicon: HALOT
  rationale: 병렬 구조를 유지하면서 목적성을 드러내는 부정사 표현을 한국어의 ‘-려고 하는’으로 옮겼습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘에 이르기까지
  alternatives_korean:
  - 이 날까지
  - 오늘까지
  lexicon: HALOT
  rationale: 서사적 종결표현으로서 현재까지 지속되는 상태를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 여호와께서 감각과 이해의 능력을 주지 않으셨다는 진술
  chosen_reading: 본문을 약화하지 않고, 야훼께서 이스라엘에게 실제로 ‘알고 보고 듣는’ 내적 능력을 주지 않으셨다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 허용적 의미로 완화하여 ‘이루지 못하게 하셨다’고 표현하는 방식
  - 이스라엘의 책임만 강조하고 하나님의 행위를 배경화하는 방식
  rationale: 히브리어가 직접적으로 ‘주지 않으셨다’고 말하므로, 신학적 난제를 해소하려고 본문의 서술을 완화하지 않았습니다. 동시에 그 긴장을 해석으로 풀어버리지 않기 위해 문장 자체를 그대로 유지했습니다.
  doctrine_reference: 하나님의 주권과 인간 책임의 긴장을 본문 수준에서 보존
