revisions:
- from: 그러나 야훼께서는 오늘에 이르기까지 여러분에게 알고자 하는 마음도, 보려고 하는 눈도, 들으려고 하는 귀도 주지 않으셨습니다.[a]
  to: 그러나 야훼께서는 이 날까지 여러분에게 알 마음과 볼 눈과 들을 귀를 주지 않으셨습니다.
  rationale: 목적·기능을 나타내는 히브리어 부정사를 한국어의 간결한 ‘알 마음과 볼 눈과 들을 귀’로 옮겨, 원문의 병렬 구조와 인식의 비유를 보존했습니다. ‘이 날까지’로 서사적 시간 지시를 유지했으며, 불필요한 문체 각주는 삭제했습니다.
