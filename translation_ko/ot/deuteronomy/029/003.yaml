  source_fidelity: 히브리어는 야훼께서 이스라엘에게 ‘알기 위한 마음, 보기 위한 눈, 듣기 위한 귀’를 주지 않으셨다고 직접 진술합니다. 초안의 ‘알고자 하는/보려고 하는/들으려고 하는’은 לְ+부정사의 목적·기능 표현을 화자의 의지나 욕구로 바꾸므로, 원문의 뜻을 다소 좁힙니다. 또한 עַד הַיּוֹם הַזֶּה는 발화 시점의 ‘오늘’이라기보다 서사 안의 ‘이 날까지’를 가리킵니다.
  naturalness: ‘알 마음과 볼 눈과 들을 귀’는 한국어 성경 문체에서 자연스럽고, 병렬성과 간결함을 보존합니다. ‘이 날까지’는 본문의 서사적 시간 지시를 정확히 살립니다.
  terminology: ‘야훼께서는’은 제시된 번역 정책 및 영어 POB의 Yahweh와 일치합니다. ‘마음’은 לֵב의 비유적·인식적 표현을 유지하며, ‘알다’도 ידע의 직접적인 의미를 보존합니다.
