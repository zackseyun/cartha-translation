  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'intoxicating drink.' The Hebrew term refers broadly to fermented strong drink, not necessarily a specific beverage.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 빵도 먹지 않았고 포도주나 독주도 마시지 않았습니다. 이는 너희가 내가 야훼 너희 하나님임을 알게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독주’는 와인과 구별되는 발효성 강한 음료를 넓게 가리키며, 특정 술 한 종류로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 기본어휘는 ‘빵’이며, 포도주/독주와의 병렬을 현대 한국어로 자연스럽게 살리기 위해 ‘빵’으로 옮겼습니다.
- source_word: יַיִן
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: 히브리어 יַיִן의 표준 대응은 ‘포도주’이며, 뒤의 ‘독주’와 구별도 분명해집니다.
- source_word: שֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 독한 술
  - 알코올성 음료
  - 술
  lexicon: HALOT
  rationale: POB의 ‘strong drink’는 와인 이외의 발효성 강한 음료를 넓게 가리키므로, 한국어 성경에서 널리 쓰이는 ‘독주’가 가장 간결하고 범위를 잘 반영합니다.
- source_word: לְמַעַן תֵּדְעוּ
  english_pob_choice: so that you might know
  chosen_korean: 이는 너희가 … 알게 하려는 것이었습니다
  alternatives_korean:
  - 그래서 너희가 … 알도록
  - 그 목적은 너희가 … 알게 하는 데 있었습니다
  lexicon: HALOT
  rationale: לְמַעַן의 목적 의미를 드러내되, 현대 문체에서 자연스러운 목적절로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사를 가리지 않도록 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와 대체어 대신 신명기 본문의 신명 사용을 어떻게 드러낼지
  chosen_reading: ‘내가 야훼 너희 하나님’으로 직역해, 목적은 출애굽/광야 경험이 야훼의 정체를 알게 하는 데 있음을 보존했습니다.
  alternative_readings:
  - ‘내가 주 너희 하나님’
  - ‘내가 너희의 하나님 야훼임을’
  rationale: 본문의 핵심은 단순한 신적 호칭이 아니라 언약 이름의 자기계시이므로, 제목형 ‘주’로 대체하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
