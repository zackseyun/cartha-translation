source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
  footnotes:
  - marker: a
    text: Or 'a root producing gall and wormwood.' The Hebrew רֹאשׁ can be rendered more traditionally as 'gall,' but here it likely refers broadly to poisonous produce.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데에 오늘 야훼 우리 하나님에게서 마음이 돌아서 그 나라들의 신들을 섬기러 가는 남자나 여자, 가문이나 지파가 없도록 하십시오. 너희 가운데에 독성 있는 것과 쑥을 맺는 뿌리가 없도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “쓸개와 쑥을 맺는 뿌리.” 히브리어 רֹאשׁ은 전통적으로 “쓸개”로 옮기기도 하지만, 여기서는 넓게 독성 있는 산물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: ~하지 않도록 하십시오
  alternatives_korean:
  - ~하면 안 됩니다
  - ~하지 않게 하십시오
  lexicon: HALOT
  rationale: 경고와 예방의 뉘앙스를 살리기 위해, 단순한 예측보다 금지·주의의 종결형으로 옮겼습니다.
- source_word: אִישׁ אוֹ אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자
  alternatives_korean:
  - 사람 한 명
  - 남성이나 여성
  lexicon: HALOT
  rationale: 히브리어의 명시적 성별 병렬을 유지해 개인 단위의 포괄성을 흐리지 않도록 했습니다.
- source_word: מִשְׁפָּחָה / שֵׁבֶט
  english_pob_choice: clan / tribe
  chosen_korean: 종족이나 지파
  alternatives_korean:
  - 가문이나 지파
  - 가족이나 지파
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 현대 한국어의 '가족'보다 더 큰 친족 집단을 가리키므로 '종족'으로, שֵׁבֶט은 이스라엘의 부족 단위를 가리키므로 '지파'로 옮겼습니다.
- source_word: לְבָבֹו פֹנֶה
  english_pob_choice: whose heart is turning away
  chosen_korean: 마음이 … 돌아서
  alternatives_korean:
  - 마음이 돌아서고 있는
  - 마음이 돌아가는
  lexicon: HALOT
  rationale: 진행·예비적 이탈을 드러내기 위해 '돌아서'로 처리하되, 한국어 문맥에서는 자연스럽게 상태적 의미를 전달했습니다.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  english_pob_choice: the gods of those nations
  chosen_korean: 그 나라들의 신들
  alternatives_korean:
  - 그 민족들의 신들
  - 그 이방 민족들의 신들
  lexicon: HALOT
  rationale: הַגּוֹיִם은 주변 '나라들/민족들'을 가리키므로, 본문 흐름에 맞게 '나라들'을 택했습니다.
- source_word: רֹאשׁ וְלַעֲנָה
  english_pob_choice: poisonous fruit and wormwood
  chosen_korean: 쓴 독초와 쑥
  alternatives_korean:
  - 독과 쑥
  - 독초와 쑥
  lexicon: HALOT
  rationale: רֹאשׁ의 독성 식물/독물 이미지를 한국어에서 가장 자연스럽게 전달하기 위해 '쓴 독초'로 옮겼고, לַעֲנָה는 관용적 성경어인 '쑥'을 유지했습니다.
theological_decisions:
- issue: 공동체 경고문의 수사 유지
  chosen_reading: 두 번의 '없도록 하십시오'로 경고의 반복 구조를 살렸습니다.
  alternative_readings:
  - 첫 절만 명령형으로 처리하고 뒤 절은 설명문으로 옮김
  - 하나의 문장으로 압축
  rationale: 히브리어 פֶּן의 경고 반복을 한국어에서도 분명히 드러내어, 공동체 내부의 숨은 배교 가능성을 강하게 경계하는 본문의 힘을 유지했습니다.
  doctrine_reference: 신명기 29장 언약 경고의 문맥
