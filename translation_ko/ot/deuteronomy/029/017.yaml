revisions:
- from: 너희 가운데에 남자나 여자, 또는 종족이나 지파가 있어서, 오늘 마음이 야훼 우리 하나님에게서 돌아서 그 나라들의 신들을 섬기러 가려 하는 자가 없도록 하십시오. 너희 가운데에 쓴 독초와 쑥을 맺는 뿌리가 없도록 하십시오.[a]
  to: 너희 가운데에 오늘 야훼 우리 하나님에게서 마음이 돌아서 그 나라들의 신들을 섬기러 가는 남자나 여자, 가문이나 지파가 없도록 하십시오. 너희 가운데에 독성 있는 것과 쑥을 맺는 뿌리가 없도록 하십시오.[a]
  rationale: The revision preserves the Hebrew warning's repeated פֶּן structure while making the four-part subject list grammatical in Korean. It replaces the ethnically misleading '종족' with '가문' and renders רֹאשׁ broadly enough to retain the source's lexical uncertainty. The footnote now accurately presents the traditional alternative and keeps the phrase's root-bearing syntax.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the repeated warning, the individual-to-collective sequence, the departure from Yahweh, and service of other gods. However, '종족' is not a suitable equivalent for מִשְׁפָּחָה in this intracommunity kinship sequence; '가문' is more accurate. The rendering '쓴 독초와 쑥' also narrows רֹאשׁ to a particular plant and introduces an unnecessary '쓴' qualification. The footnote's proposed alternative does not preserve the source phrase's 'root bearing' construction.
  naturalness: 'The current first clause is somewhat strained: ''종족이나 지파가 있어서 ... 자가'' does not smoothly allow the relative phrase to modify each of the four possible subjects. Recasting the list before the shared predicate produces clear, modern formal Korean. The formal warning ending ''없도록 하십시오'' is retained to reflect the cautionary force of פֶּן in a self-contained Korean rendering.'
  terminology: '''야훼 우리 하나님'' and ''지파'' are appropriate. ''가문'' better denotes the kinship group expressed by מִשְׁפָּחָה than ''종족,'' which normally denotes an ethnic people. ''독성 있는 것'' preserves the lexical breadth of רֹאשׁ without prematurely identifying it as a specific herb or as gall.'
  issues:
  - severity: medium
    issue: '''종족'' for מִשְׁפָּחָה'
    rationale: '''종족'' ordinarily denotes an ethnic group, whereas מִשְׁפָּחָה here is a kinship subdivision alongside an individual and a tribe. ''가문'' is a closer Korean social equivalent.'
  - severity: medium
    issue: The first sentence has an awkward and potentially unclear modifier structure.
    rationale: In '남자나 여자, 또는 종족이나 지파가 있어서, ... 자가,' the final '자가' fits a person but not naturally a clan or tribe. A shared predicate after the entire list better reflects the Hebrew.
  - severity: medium
    issue: The rendering and footnote for רֹאשׁ and לַעֲנָה require correction.
    rationale: '''쓴 독초'' identifies רֹאשׁ as an herb and adds ''bitter,'' neither of which is required by the Hebrew. The footnote alternative, ''독을 맺는 쓴 쑥,'' omits the root construction and changes the coordination of the two terms.'
  revised_text: 너희 가운데에 오늘 야훼 우리 하나님에게서 마음이 돌아서 그 나라들의 신들을 섬기러 가는 남자나 여자, 가문이나 지파가 없도록 하십시오. 너희 가운데에 독성 있는 것과 쑥을 맺는 뿌리가 없도록 하십시오.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “쓸개와 쑥을 맺는 뿌리.” 히브리어 רֹאשׁ은 전통적으로 “쓸개”로 옮기기도 하지만, 여기서는 넓게 독성 있는 산물을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew warning's repeated פֶּן structure while making the four-part subject list grammatical in Korean. It replaces the ethnically misleading '종족' with '가문' and renders רֹאשׁ broadly enough to retain the source's lexical uncertainty. The footnote now accurately presents the traditional alternative and keeps the phrase's root-bearing syntax.
