  alternatives_korean:
  - 이날
  - 이제
  lexicon: HALOT
  rationale: 반복되는 הזמן 표지를 그대로 살려 현재의 언약 장면을 강조했습니다.
theological_decisions:
- issue: ‘오늘 여기 우리와 함께 있지 않은 사람들’의 범위
  chosen_reading: 구체적 범위를 정하지 않고 그대로 번역하여, 부재한 이스라엘 사람들, 미래 세대, 또는 둘 다를 포함할 수 있는 여지를 남겼습니다.
  alternative_readings:
  - 오늘 모임에 물리적으로 없는 이스라엘 사람들
  - 아직 태어나지 않은 미래 세대
  - 부재한 동시대 사람들과 미래 언약 공동체 둘 다
  rationale: 히브리어는 대상을 의도적으로 열어 두므로, 번역도 그 긴장을 해소하지 않고 유지하는 것이 본문의 의미를 더 충실하게 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
