translation:
  language: ko
  text: 하지만 오늘 여기 우리와 함께 서 있는 사람들과, 오늘 여기 우리와 함께 있지 않은 사람들과도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오늘 여기 우리와 함께 있지 않은 사람들’은 이스라엘 가운데 그 자리에 없던 사람들, 미래 세대, 또는 둘 다를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: but
  chosen_korean: 하지만
  alternatives_korean:
  - 왜냐하면
  - 그러나
  lexicon: HALOT
  rationale: 문맥상 앞선 ‘너희만과 언약을 맺는 것이 아니다’라는 진술을 이어 받으며 대조하므로, 원문의 흐름을 살려 역접 연결어로 옮겼습니다.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ עֹמֵד
  english_pob_choice: whoever is standing here with us
  chosen_korean: 오늘 여기 우리와 함께 서 있는 사람들
  alternatives_korean:
  - 오늘 여기 우리와 함께 있는 사람들
  - 오늘 여기 우리 곁에 서 있는 사람들
  lexicon: HALOT
  rationale: ‘서 있다’는 구체적 자세를 유지하되 한국어에서는 분사구로 자연스럽게 풀어, 회중 앞에 실제로 서 있는 자들을 가리키는 의미를 살렸습니다.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ הַיּוֹם
  english_pob_choice: and with whoever is not here with us today
  chosen_korean: 오늘 여기 우리와 함께 있지 않은 사람들
  alternatives_korean:
  - 오늘 여기 우리와 함께 없는 사람들
  - 오늘 이 자리에 없는 사람들
  lexicon: HALOT
  rationale: 원문의 존재 부정과 장소 부정을 함께 반영하면서도, 한국어에서 ‘우리와 함께 있지 않은’이 가장 직접적으로 대조를 드러내므로 이를 택했습니다.
- source_word: הַיּוֹם
  english_pob_choice: today
