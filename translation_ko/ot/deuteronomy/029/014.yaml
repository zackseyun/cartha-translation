revisions:
- from: 하지만 오늘 여기 우리와 함께 서 있는 사람들과, 오늘 여기 우리와 함께 있지 않은 사람들과도 그러합니다.[a]
  to: 하지만 오늘 여기 우리와 함께 서 있는 사람들과, 오늘 여기 우리와 함께 있지 않은 사람들과도 언약과 맹세를 맺습니다.[a]
  rationale: 앞 절에서 이어지는 언약 체결의 동작을 ‘언약과 맹세를 맺습니다’로 명시하여, 두 부류의 사람이 그 언약의 대상이라는 원문의 구조를 자연스럽게 드러냈습니다. 부재한 사람들의 범위는 본문이 특정하지 않으므로 각주에서 가능한 범위만 제시하고 본문에는 해석을 덧붙이지 않았습니다.
