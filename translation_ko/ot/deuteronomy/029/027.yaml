  source_fidelity: 개정이 필요합니다. 초안의 ‘그러므로’는 히브리어 본문에 없는 논리 접속어이며, 마지막 문장 ‘그것이 오늘날과 같습니다’는 כַּיּוֹם הַזֶּה의 현재 상태를 가리키는 관용구를 어색하게 처리하고 선행사도 불분명하게 만듭니다. ‘뽑아내시고’와 ‘내던지셨습니다’는 각각 נתשׁ와 השליך의 강한 추방 이미지를 충실히 반영합니다.
  naturalness: ‘오늘날에도 그러합니다’는 한국어 합쇼체에서 자연스러우며, 히브리어의 ‘이 날과 같이/오늘날과 같이’라는 관용적 현재 지시를 명료하게 전달합니다. ‘던져 버리셨습니다’보다 ‘내던지셨습니다’가 문어적 성경 문맥에서 더 자연스럽고, 원문의 강도도 유지합니다.
  terminology: ‘야훼’는 제시된 방침에 맞습니다. ‘진노, 격분, 큰 분노’는 세 겹의 분노 어휘를 합치지 않고 보존합니다. ‘땅’은 אַדָמָה 및 אֶרֶץ의 문맥상 적절합니다.
  issues:
