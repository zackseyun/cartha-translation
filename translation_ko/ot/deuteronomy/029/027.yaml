    issue: 본문에 없는 ‘그러므로’가 추가되었습니다.
    rationale: וַיִּתְּשֵׁם은 단순 서술 접속으로 시작하며, 이 절 자체에 ‘그러므로’에 해당하는 명시적 인과 접속어가 없습니다.
  - severity: medium
    issue: ‘그것이 오늘날과 같습니다’는 כַּיּוֹם הַזֶּה의 관용적 의미를 부자연스럽게 옮깁니다.
    rationale: 이 표현은 추방된 상태가 ‘오늘날에도 그러함’을 가리킵니다. ‘그것’의 지시 대상도 문맥상 불명확합니다.
  revised_text: 야훼께서 진노와 격분과 큰 분노로 그들을 그들의 땅에서 뽑아내시고, 다른 땅으로 내던지셨습니다. 오늘날에도 그러합니다.[a]
