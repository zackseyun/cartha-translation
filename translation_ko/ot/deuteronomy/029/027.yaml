  lexicon: HALOT
  rationale: 히브리어가 뜻이 겹치는 분노 표현을 누적해 심판의 강도를 높이므로, 세 겹의 정서를 한국어에서도 구분되게 살렸습니다.
- source_word: וַיַּשְׁלִכֵם אֶל אֶרֶץ אַחֶרֶת
  english_pob_choice: and cast them into another land
  chosen_korean: 다른 땅으로 던져 버리셨습니다
