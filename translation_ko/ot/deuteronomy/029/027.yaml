  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'plucked them up' or 'tore them out' for 'uprooted them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as this day,' an idiom meaning 'as is evident today' or 'as it is this day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 그들을 그들의 땅에서 진노와 격분과 큰 분노로 뽑아내셔서 다른 땅으로 던져 버리셨습니다. 그것이 오늘날과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘오늘날과 같이’라는 관용구로, 현재 눈앞에 확인되는 상태를 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  english_pob_choice: uprooted them
  chosen_korean: 뽑아내셨습니다
  alternatives_korean:
