source:
  edition: WLC
  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
  footnotes:
  - marker: a
    text: Or 'and what we passed through among the nations through which you passed.' The Hebrew can be rendered more literally, but the main text expresses the sense more idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여러분이 우리가 이집트 땅에서 살았던 일과 우리가 여러분이 지나온 민족들 가운데를 지나온 일을 알고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로는 ‘우리가 이집트 땅에서 살았던 것과 우리가 여러분이 지나온 민족들 가운데를 지나온 것’으로 옮길 수 있습니다. 본문은 한국어에서 더 자연스럽게 읽히도록 ‘것’을 ‘일’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 그러므로 …
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 קשר을 한국어에서 가장 자연스럽게 드러내는 표현입니다.
- source_word: יָשַׁבְנוּ בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: how we lived in the land of Egypt
  chosen_korean: 우리가 이집트 땅에 살았던 일
  alternatives_korean:
  - 우리가 이집트 땅에 거했던 일
  - 우리가 이집트에 살았던 일
  lexicon: HALOT
  rationale: יָשַׁבנוּ의 ‘거하다/살다’ 의미를 현대 한국어의 자연스러운 서술로 옮기되, ‘땅’이라는 성경적 표현을 유지했습니다.
- source_word: בְּקֶרֶב הַגּוֹיִם
  english_pob_choice: through the midst of the nations
  chosen_korean: 여러 민족들 가운데를
  alternatives_korean:
  - 민족들 한가운데를
  - 여러 나라들 가운데를
  lexicon: HALOT
  rationale: בְּקֶרֶב의 ‘가운데/한복판’ 의미와 이동 동사를 함께 살리기 위해 ‘가운데를’로 옮겼습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 여러 민족들
  alternatives_korean:
  - 민족들
  - 나라들
  lexicon: HALOT
  rationale: 토라 문맥에서 גוים는 흔히 ‘민족들/나라들’을 뜻하므로, 한국어에서는 ‘여러 민족들’이 가장 자연스럽습니다.
theological_decisions:
- issue: 반복되는 עברנוּ(우리가 지나온 / 여러분이 지나온) 구조를 어떻게 드러낼지
  chosen_reading: ‘여러분이 지나온 … 우리가 지나온 일’로 두 번의 이동 경험을 모두 살렸습니다.
  alternative_readings:
  - 앞의 동사를 한 번만 살려 매끄럽게 정리하는 방식
  - ‘통과한’으로 단순화하는 방식
  rationale: 히브리어의 반복은 대조와 공통 경험을 강조하므로, 이를 과도하게 평준화하지 않고 유지하는 쪽이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 본문의 역사적 회상과 언약적 경고 구조
- issue: אֵת אֲשֶׁר의 구조를 어떻게 처리할지
  chosen_reading: ‘… 일’로 실질적 명사화하여 한국어에서 자연스럽게 만들었습니다.
  alternative_readings:
  - 직역하여 ‘… 한 것’을 반복하는 방식
  - ‘무엇을’로 옮기는 방식
  rationale: 히브리어의 יחס절을 한국어에서 그대로 모사하면 불명확해지므로, 의미를 유지하는 범위에서 사건 전체를 가리키는 표현으로 정리했습니다.
  doctrine_reference: 히브리어 יחס절의 의미 전달
