revisions:
- from: 제가 너희를 사십 년 동안 광야로 이끌었으나, 너희의 옷은 너희 몸에서 닳지 않았고, 너희의 신도 너희 발에서 닳지 않았습니다.[a]
  to: 내가 너희를 사십 년 동안 광야에서 이끌었고, 너희가 입은 옷은 닳지 않았으며, 너의 신은 네 발에서 닳지 않았습니다.[a]
  rationale: 장소 표현을 ‘광야에서’로, 접속 관계를 비대조적 연결로 바로잡았습니다. 신적 화자의 1인칭을 ‘내가’로 고치고, 마지막 절의 단수 전환을 본문과 각주에서 보존했습니다. ‘너희가 입은 옷’은 ‘너희 위에서’라는 히브리어의 의복 착용 의미를 자연스러운 한국어로 옮긴 것입니다.
