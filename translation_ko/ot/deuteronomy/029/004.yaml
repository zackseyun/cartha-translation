  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
  footnotes:
  - marker: a
    text: 'Hebrew shifts from plural to singular in the final clause: literally, ''your sandal did not wear out from on your foot.'' The singular likely addresses Israel as a corporate whole or uses a distributive singular.'
