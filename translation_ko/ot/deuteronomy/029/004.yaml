translation:
  language: ko
  text: 내가 너희를 사십 년 동안 광야에서 이끌었고, 너희가 입은 옷은 닳지 않았으며, 너의 신은 네 발에서 닳지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 마지막 절에서 복수 호칭에서 단수 호칭으로 바뀝니다. 직역하면 ‘너의 신은 네 발 위에서 닳지 않았다’입니다. 이 단수는 이스라엘 전체를 하나의 집단으로 가리키거나, 각 사람에게 적용하는 분배적 단수일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹלֵךְ
  english_pob_choice: I led
  chosen_korean: 이끌었습니다
  alternatives_korean:
  - 인도했습니다
  - 가게 했습니다
  lexicon: HALOT
  rationale: 하나님이 백성을 광야에서 목적 있게 움직이게 하신 뜻을 자연스럽게 살리기 위해, 기계적인 ‘가게 하다’보다 ‘이끌다’를 택했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 사막
  - 들판
  lexicon: HALOT
  rationale: 출애굽 이후의 이스라엘 여정을 가리키는 성경적 표현으로는 ‘광야’가 가장 정확하고 문맥에도 맞습니다.
- source_word: שַׂלְמֹתֵיכֶם / נַעַלְךָ
  english_pob_choice: your clothes ... your sandal
  chosen_korean: 너희의 옷 ... 너희의 신
  alternatives_korean:
  - 너희의 의복 ... 너희의 샌들
  - 너희의 옷 ... 너희의 신발
  lexicon: HALOT
  rationale: 상반절의 복수형 ‘옷’과 하반절의 단수형 ‘신’을 구분해 옮겨, 히브리어의 수 변화와 사물의 구체성을 함께 살렸습니다.
- source_word: בָּלוּ / בָלְתָה
  english_pob_choice: did not wear out
  chosen_korean: 닳지 않았고
  alternatives_korean:
  - 헤어지지 않았고
  - 낡지 않았고
  lexicon: HALOT
  rationale: 옷과 신의 상태를 말하는 동사 בלה의 물리적 의미를 현대 한국어의 ‘닳다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 복수에서 단수로 바뀌는 마지막 절의 주소 방식
  chosen_reading: 마지막 절도 한국어에서는 ‘너희의 신 / 너희 발’로 옮기되, 히브리어의 단수형 신을 각주로 설명합니다.
  alternative_readings:
  - 마지막 절을 복수화하여 ‘너희의 신들 ... 너희의 발들’처럼 매끈하게 처리
  - 단수형을 그대로 살려 ‘네 신 ... 네 발’로 옮기기
  rationale: 히브리어는 마지막 절에서 단수 소유격을 사용해 이스라엘을 집합적으로 또는 분배적으로 가리키는 긴장을 드러냅니다. 한국어 본문은 가독성을 위해 복수 호칭을 유지하고, 각주로 원문의 단수 전환을 밝혔습니다.
  doctrine_reference: Translation philosophy §1, §5
