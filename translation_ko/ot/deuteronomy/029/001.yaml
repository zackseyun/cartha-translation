  to: 모세가 온 이스라엘을 불러 그들에게 말했습니다. “너희는 야훼께서 이집트 땅에서 바로와 그의 모든 신하와 그의 온 땅에 너희 눈앞에서 행하신 모든 일을 보았습니다.”[a]
