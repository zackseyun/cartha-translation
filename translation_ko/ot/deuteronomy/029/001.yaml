base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
  footnotes:
  - marker: a
    text: Or “against Pharaoh and against all his servants and against all his land.” The Hebrew preposition can be rendered more interpretively in context to show that the LORD’s acts in Egypt were acts of judgment upon them.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 온 이스라엘을 불러 그들에게 말했습니다. “너희는 야훼께서 이집트 땅에서 바로와 그의 모든 신하와 그의 온 땅에 너희 눈앞에서 행하신 모든 일을 보았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바로와 그의 모든 신하와 그의 온 땅에 맞서.” 히브리어 전치사는 문맥상 야훼의 행위가 그들에 대한 심판이었음을 드러내도록 더 해석적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 회중을 향해 사람들을 부르는 서술이므로, 현대 한국어에서 자연스럽고 직접적인 ‘불러’로 옮겼습니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 온 이스라엘 백성
  - 모든 이스라엘
  lexicon: HALOT
  rationale: 이스라엘 전체 공동체를 가리키는 집합 표현으로, ‘온 이스라엘’이 간결하고 원문 범위를 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기 본문의 יְהוָה를 ‘야훼’로 옮겨 고유한 언약명을 보존했습니다.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָי/ו וּלְכָל אַרְצ/וֹ
  english_pob_choice: to Pharaoh and to all his servants and to all his land
  chosen_korean: 바로와 그의 모든 신하와 그의 온 땅에 대해
  alternatives_korean:
  - 바로와 그의 모든 신하와 그의 온 땅에게
  - 바로와 그의 모든 신하와 그의 온 땅을 향해
  lexicon: HALOT
  rationale: 반복된 전치사 ל의 대상성을 살리되, 문맥상 이집트에 대한 야훼의 심판 행위를 드러내기 위해 ‘~에 대해’로 처리했습니다.
theological_decisions:
- issue: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ의 방향성
  chosen_reading: 본문에는 단순한 ‘~에게’보다 심판의 대상이라는 함의를 살린 ‘~에 대해’로 옮겼습니다.
  alternative_readings:
  - 바로와 그의 모든 신하와 그의 온 땅에게
  - 바로와 그의 모든 신하와 그의 온 땅을 향해
  rationale: 영어 POB가 주석에서 밝히듯, 히브리어 전치사 ל는 문맥상 ‘against’의 의미를 가질 수 있습니다. 본문은 그 긴장을 지우지 않기 위해 한국어에서도 대상성을 유지하되, 심판적 맥락을 자연스럽게 드러냈습니다.
  doctrine_reference: Deut 29:1 lexical-theological context; POB footnote on ל as interpretive alternative
