    reason: cultural_note
translation:
  language: ko
  text: 그가 오늘 너희를 자신을 위한 한 백성으로[a] 세우시고, 친히 너희의 하나님이 되시려는 것입니다. 이는 그가 너희에게 말씀하신 대로이며, 또 너희 조상들[b], 곧 아브라함과 이삭과 야곱에게 맹세하신 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 문자적으로 옮기면 ‘그 자신을 위하여 한 백성으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 조상들’은 아브라함, 이삭, 야곱을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여
  alternatives_korean:
  - 이는
  - 그래서
  lexicon: HALOT
  rationale: 목적/결과를 잇는 표현으로, 앞뒤 문맥을 자연스럽게 연결하면서도 의도된 목적성을 유지합니다.
- source_word: הָקִים אֹתְךָ
