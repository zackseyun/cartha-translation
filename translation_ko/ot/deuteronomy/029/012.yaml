  lexicon: HALOT
  rationale: 언약적 지위로 ‘세우다/세우시다’가 원문의 ‘일으켜 세워 확립하다’는 뉘앙스를 가장 간결하게 살립니다.
- source_word: לוֹ לְעָם
  english_pob_choice: for himself as a people
  chosen_korean: 자기 백성으로
  alternatives_korean:
  - 자기에게 속한 백성으로
