  lexicon: HALOT
  rationale: PB OPO의 ‘for himself as a people’를 한국어로 옮기되, 소유·언약 소속의 관계를 드러내는 ‘자기 백성’이 가장 자연스럽습니다.
- source_word: וְהוּא יִהְיֶה לְּךָ לֵאלֹהִים
  english_pob_choice: and he himself may be your God
  chosen_korean: 그 자신이 너희의 하나님이 되게 하시려는 것입니다
  alternatives_korean:
  - 그가 너희의 하나님이 되실 것입니다
  - 그분이 너희의 하나님이 되게 하시고
  lexicon: HALOT
  rationale: 표준적 언약 공식인 ‘너희의 하나님’으로 옮기되, וְהוּא의 강조를 ‘그 자신이’로 살렸습니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 문맥상 아브라함·이삭·야곱을 가리키므로, 한국어에서 오해를 줄이기 위해 의미를 풀어 ‘조상들’로 옮겼습니다. 성별 표지를 드러내기보다 다음 이름 열거가 의미를 명확히 합니다.
theological_decisions:
- issue: 언약 공식의 보존
  chosen_reading: “자기 백성”과 “너희의 하나님”을 함께 유지하여 상호 언약 관계를 드러냈습니다.
  alternative_readings:
  - ‘한 백성으로’만 옮기기
  - ‘하나님이 되시리라’로 단순화하기
  rationale: 본절은 이스라엘이 야훼께 속한 백성이 되며, 야훼가 그들의 하나님이 되신다는 언약 공식을 진술합니다. 두 요소를 함께 보존해야 신학적 긴장이 약화되지 않습니다.
  doctrine_reference: 언약 신학 / 신명기 29:12
