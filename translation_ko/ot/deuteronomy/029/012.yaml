base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
  footnotes:
  - marker: a
    text: Or, more literally, 'for himself as a people.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your fathers'; that is, the patriarchs Abraham, Isaac, and Jacob.
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 오늘 그가 너희를 자기 백성으로 세우시고, 그 자신이 너희의 하나님이 되게 하시려는 것입니다. 이는 그가 너희에게 말씀하신 대로이며, 또 너희 조상들 곧 아브라함과 이삭과 야곱에게 맹세하신 대로입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘자기 자신에게 한 백성으로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 조상들’은 곧 아브라함, 이삭, 야곱을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여
  alternatives_korean:
  - 이는
  - 그래서
  lexicon: HALOT
  rationale: 목적/결과를 잇는 표현으로, 앞뒤 문맥을 자연스럽게 연결하면서도 의도된 목적성을 유지합니다.
- source_word: הָקִים אֹתְךָ
  english_pob_choice: may establish you
  chosen_korean: 너희를 ... 세우시고
  alternatives_korean:
  - 너희를 ... 확립하시고
  - 너희를 ... 세우셔서
  lexicon: HALOT
  rationale: 언약적 지위로 ‘세우다/세우시다’가 원문의 ‘일으켜 세워 확립하다’는 뉘앙스를 가장 간결하게 살립니다.
- source_word: לוֹ לְעָם
  english_pob_choice: for himself as a people
  chosen_korean: 자기 백성으로
  alternatives_korean:
  - 자기에게 속한 백성으로
  - 한 백성으로
  lexicon: HALOT
  rationale: PB OPO의 ‘for himself as a people’를 한국어로 옮기되, 소유·언약 소속의 관계를 드러내는 ‘자기 백성’이 가장 자연스럽습니다.
- source_word: וְהוּא יִהְיֶה לְּךָ לֵאלֹהִים
  english_pob_choice: and he himself may be your God
  chosen_korean: 그 자신이 너희의 하나님이 되게 하시려는 것입니다
  alternatives_korean:
  - 그가 너희의 하나님이 되실 것입니다
  - 그분이 너희의 하나님이 되게 하시고
  lexicon: HALOT
  rationale: 표준적 언약 공식인 ‘너희의 하나님’으로 옮기되, וְהוּא의 강조를 ‘그 자신이’로 살렸습니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 문맥상 아브라함·이삭·야곱을 가리키므로, 한국어에서 오해를 줄이기 위해 의미를 풀어 ‘조상들’로 옮겼습니다. 성별 표지를 드러내기보다 다음 이름 열거가 의미를 명확히 합니다.
theological_decisions:
- issue: 언약 공식의 보존
  chosen_reading: “자기 백성”과 “너희의 하나님”을 함께 유지하여 상호 언약 관계를 드러냈습니다.
  alternative_readings:
  - ‘한 백성으로’만 옮기기
  - ‘하나님이 되시리라’로 단순화하기
  rationale: 본절은 이스라엘이 야훼께 속한 백성이 되며, 야훼가 그들의 하나님이 되신다는 언약 공식을 진술합니다. 두 요소를 함께 보존해야 신학적 긴장이 약화되지 않습니다.
  doctrine_reference: 언약 신학 / 신명기 29:12
