translation:
  language: ko
  text: 그러므로 이 언약의 말씀들을 지키고 행하십시오[a]. 그리하면 여러분이 하는 모든 일에서 지혜롭게 행동하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜롭게 행동하게 될 것입니다’ 혹은 ‘성공하게 될 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: keep
  chosen_korean: 지키고
  alternatives_korean:
  - 보존하고
  - 지켜
  lexicon: HALOT
  rationale: 언약 문맥의 שׁמר는 단순한 감시보다 언약적 의무를 ‘지키다/준수하다’는 뜻이므로, 현대 한국어에서는 ‘지키고’가 가장 자연스럽고 직접적입니다.
- source_word: אֶת דִּבְרֵי הַ/בְּרִית הַ/זֹּאת
  english_pob_choice: the words of this covenant
  chosen_korean: 이 언약의 말씀들
  alternatives_korean:
  - 이 언약의 말들
  - 이 언약의 조항들
  lexicon: HALOT
  rationale: דִּבְרֵי는 언약의 내용·진술을 가리키므로 ‘말씀들’이 원문 형식을 살리면서도 한국어 성경 문체에 자연스럽습니다.
- source_word: וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם
  english_pob_choice: do them
  chosen_korean: 행하십시오
  alternatives_korean:
  - 그것들을 행하십시오
  - 실행하십시오
  lexicon: HALOT
  rationale: 히브리어 복수 대명사 ‘그것들’의 지시를 살리면 다소 무거워져, 언약 준수의 실제 이행을 드러내는 ‘행하다’로 옮기되 명령형은 합쇼체로 유지했습니다.
- source_word: תַּשְׂכִּ֔ילוּ
  english_pob_choice: act wisely
  chosen_korean: 지혜롭게 행동하게 될 것입니다
  alternatives_korean:
  - 형통하게 될 것입니다
  - 성공하게 될 것입니다
  lexicon: HALOT
  rationale: שׂכל은 ‘지혜롭게 행동하다’와 ‘성공하다/형통하다’의 의미 범위를 가지므로, 본문에 명시된 지혜의 뉘앙스를 앞세우되 결과적 성취 가능성도 배제하지 않도록 옮겼습니다.
- source_word: אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּן
  english_pob_choice: in all that you do
  chosen_korean: 여러분이 하는 모든 일에서
  alternatives_korean:
  - 여러분이 행하는 모든 것에서
  - 여러분이 하는 모든 일에
  lexicon: HALOT
  rationale: 범위 표지인 כָּל אֲשֶׁר를 한국어로 자연스럽게 풀어 ‘모든 일에서’라고 하여, 약속된 지혜가 삶 전체에 미친다는 뜻을 살렸습니다.
theological_decisions:
- issue: תַּשְׂכִּילוּ의 결과를 지혜/성공 중 어디에 더 두드러지게 둘지
  chosen_reading: 본문의 직접 표현인 ‘지혜롭게 행동하다’를 주된 의미로 두고, 결과적 형통의 가능성은 열어 둡니다.
  alternative_readings:
  - 형통하게 될 것입니다
  - 성공하게 될 것입니다
  rationale: 이 구절은 언약 준수와 그에 따른 삶의 분별/성공을 연결하지만, 원문에 없는 번영 신학을 덧입히지 않기 위해 ‘지혜롭게 행동하다’로 번역했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
