id: DEU.29.25
reference: Deuteronomy 29:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ וַ/יַּֽעַבְדוּ֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲוּ֖וּ לָ/הֶ֑ם אֱלֹהִים֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/לֹ֥א חָלַ֖ק לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
  footnotes:
  - marker: a
    text: Or, 'and which had not been allotted to them.' The Hebrew has an implicit singular subject, likely referring to God.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 가서 다른 신들을 섬기고 그들에게 절했습니다. 그 신들은 자기들이 알지 못하던 신들이며, 하나님께서 자기들에게 나누어 주지 않으신 신들이었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들에게 나누어 주어지지 않은’으로 옮길 수 있습니다. 히브리어에는 암시된 단수 주어가 있으며, 문맥상 하나님을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: they went
  chosen_korean: 가서
  alternatives_korean:
  - 가고
  - 떠나서
  lexicon: HALOT
  rationale: ‘가서’는 뒤따르는 행위로 이어지는 히브리어 서술 흐름을 자연스럽게 살리면서도, 단순한 이동보다 배교의 진행을 드러냅니다.
- source_word: וַיַּעַבְדוּ
  english_pob_choice: served
  chosen_korean: 섬기고
  alternatives_korean:
  - 예배하고
  - 봉사하고
  lexicon: HALOT
  rationale: 앞의 동사와 구별되게 ‘섬기다’로 옮겨, 뒤의 절함과 중복되지 않도록 했습니다.
- source_word: וַיִּשְׁתַּחֲוּוּ לָהֶם
  english_pob_choice: bowed down to them
  chosen_korean: 그들에게 절했습니다
  alternatives_korean:
  - 그들 앞에 엎드렸습니다
  - 그들을 경배했습니다
  lexicon: HALOT
  rationale: ‘절하다’는 몸을 굽혀 엎드리는 구체적 동작을 보존하며, 앞의 ‘섬기다’와 의미를 구분합니다.
- source_word: וְלֹא חָלַק לָהֶם
  english_pob_choice: and whom he had not allotted to them
  chosen_korean: 그에게서 자기들에게 할당되지 않은
  alternatives_korean:
  - 그가 자기들에게 나누어 주지 않은
  - 그들에게 배정되지 않은
  lexicon: HALOT
  rationale: חלק의 ‘할당하다/나누어 주다’라는 의미를 살렸고, 영어 POB처럼 암시된 주어를 문맥상 하나님으로 이해해 ‘그에게서’로 드러냈습니다.
theological_decisions:
- issue: 절망(절하다)과 섬김의 이중 표현
  chosen_reading: ‘섬기고’와 ‘절했습니다’를 함께 두어, 우상숭배를 단순한 내적 신념이 아니라 행위와 예배의 전도로 제시했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘예배했다’로 통합
  - 둘 다 ‘섬겼다’로 통합
  rationale: 히브리어는 서로 다른 두 동사(עבד, שׁחה)를 사용하므로, 의미 구분을 유지하는 편이 본문의 강도를 더 잘 드러냅니다.
  doctrine_reference: 우상숭배 경고와 언약 배반의 묘사
- issue: 암시된 단수 주어
  chosen_reading: ‘그에게서’로 옮겨, ‘할당하지 않으신’ 주어를 문맥상 하나님으로 읽는 해석을 반영했습니다.
  alternative_readings:
  - ‘그들로부터’
  - 주어를 생략해 ‘할당되지 않은’
  rationale: 히브리어는 단수 동사를 사용하므로, POB의 주석처럼 문맥상 하나님을 주어로 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 하나님의 주권과 언약적 분배
