base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
  footnotes:
  - marker: a
    text: Or 'brimstone and salt, a burning.' 'Sulfur' is used for clear modern English; 'brimstone' preserves traditional diction.
    reason: lexical_alternative
translation:
  language: ko
  text: 유황과 소금, 곧 불타는 황폐함이 그 온 땅에 있습니다. 거기에는 씨를 뿌리지 못하고, 싹도 트지 못하며, 아무 풀도 돋아나지 못합니다. 그것은 소돔과 고모라, 아드마와 스보임의 전복과 같았는데, 야훼께서 그의 분노와 그의 진노로 뒤엎으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유황’은 מקור의 물질명에 대한 현대적 표현이며, 전통적 ‘브리미스톤’보다 직관적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּפְרִית
  english_pob_choice: sulfur
  chosen_korean: 유황
  alternatives_korean:
  - 유황석
  - 브리미스톤
  lexicon: HALOT
  rationale: 히브리어는 광물/원소로서의 유황을 가리키므로, 현대 한국어의 직접 대응인 ‘유황’이 가장 분명합니다.
- source_word: וָמֶלַח
  english_pob_choice: and salt
  chosen_korean: 소금
  alternatives_korean:
  - 염분
  - 소금과 함께
  lexicon: HALOT
  rationale: ‘소금’은 문자적으로 정확하며, 유황과의 결합이 황폐와 불모를 나타내는 관용적 대비를 살립니다.
- source_word: שְׂרֵפָה
  english_pob_choice: a burning waste
  chosen_korean: 불타는 황폐함
  alternatives_korean:
  - 불타는 황무지
  - 타버린 황폐
  - 소각
  lexicon: HALOT
  rationale: 이 명사는 단순한 ‘불탐’보다 결과로서의 황폐 상태를 함께 나타내므로, ‘불타는 황폐함’으로 처리해 문맥의 상태 묘사를 살렸습니다.
- source_word: כָל אַרְצָהּ
  english_pob_choice: is all its land
  chosen_korean: 그 온 땅에 있습니다
  alternatives_korean:
  - 그 온 땅이 그렇습니다
  - 그 땅 전체가 그렇습니다
  lexicon: HALOT
  rationale: 히브리어는 무동사 절로 땅의 상태를 진술하므로, 한국어에서는 자연스럽게 ‘그 온 땅에 있습니다’로 풀어 전체 토지를 범위로 드러냈습니다.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  english_pob_choice: it is not sown, and it does not sprout, and no grass grows in it
  chosen_korean: 씨를 뿌리지 못하고, 싹도 트지 못하며, 아무 풀도 돋아나지 못합니다
  alternatives_korean:
  - 뿌려지지 않고 자라지 않으며 풀도 나지 못합니다
  - 씨가 뿌려지지 않고 싹도 나지 않으며 풀도 자라지 못합니다
  lexicon: HALOT
  rationale: 연속된 부정 서술을 한국어의 병렬 구조로 살려, 경작 불가·생장 불가·초목 불가의 삼중 금지를 또렷하게 표현했습니다.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  english_pob_choice: like the overthrow ... which Yahweh overthrew
  chosen_korean: 소돔과 고모라, 아드마와 스보임의 전복과 같았는데
  alternatives_korean:
  - 소돔과 고모라, 아드마와 스보임이 뒤엎어진 것과 같았는데
  - '...의 멸망과 같았는데'
  lexicon: HALOT
  rationale: ‘전복/뒤엎다’의 어근 반복을 살려, 심판의 파괴를 단순 ‘멸망’보다 원문에 더 가깝게 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와 대체어가 아니라 신명기의 고유한 하나님의 이름을 직접 쓰므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘분노’와 ‘진노’의 이중 표현
  chosen_reading: 그의 분노와 그의 진노
  alternative_readings:
  - 그의 분노와 격노
  - 그의 화와 진노
  rationale: בְּאַפּוֹ וּבַחֲמָתוֹ는 감정의 강도를 누적하는 병렬 표현이므로, 두 한국어 명사를 유지해 심판의 తీవ్ర함을 약화하지 않았습니다.
  doctrine_reference: 시적/수사적 병렬의 보존
