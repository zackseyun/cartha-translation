  lexicon: HALOT
  rationale: ‘전복/뒤엎다’의 어근 반복을 살려, 심판의 파괴를 단순 ‘멸망’보다 원문에 더 가깝게 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와 대체어가 아니라 신명기의 고유한 하나님의 이름을 직접 쓰므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘분노’와 ‘진노’의 이중 표현
  chosen_reading: 그의 분노와 그의 진노
  alternative_readings:
  - 그의 분노와 격노
  - 그의 화와 진노
  rationale: בְּאַפּוֹ וּבַחֲמָתוֹ는 감정의 강도를 누적하는 병렬 표현이므로, 두 한국어 명사를 유지해 심판의 తీవ్ర함을 약화하지 않았습니다.
  doctrine_reference: 시적/수사적 병렬의 보존
