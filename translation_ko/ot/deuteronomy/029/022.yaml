  rationale: 문장 구조를 현대 한국어에 맞게 바로잡고, 원문의 불모 상태를 나타내는 부정 서술을 능력 표현 없이 옮겼습니다. 유황·소금·불탐이 땅의 황폐 상태를 이루는 관계를 명료하게 했으며, הפך의 명사와 동사에 ‘뒤엎으심/뒤엎으셨다’를 사용하여 원문의 어근 반복을 보존했습니다. 각주를 유황에 직접 연결하고 한국어 문장으로 정비했습니다.
