base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
  footnotes:
  - marker: a
    text: Or 'brimstone and salt, a burning.' 'Sulfur' is used for clear modern English; 'brimstone' preserves traditional diction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 온 땅은 유황[a]과 소금으로 뒤덮인, 불에 타 황폐한 땅입니다. 그 땅에는 씨가 뿌려지지 않고, 싹이 나지 않으며, 어떤 풀도 돋아나지 않습니다. 이는 야훼께서 그의 분노와 진노로 뒤엎으신 소돔과 고모라, 아드마와 스보임의 뒤엎으심과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유황석’. 히브리어 גָּפְרִית는 유황을 뜻합니다. 전통적인 영어 표현 ‘brimstone’에 해당하는 번역도 가능하지만, 현대 한국어에서는 ‘유황’이 가장 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּפְרִית
  english_pob_choice: sulfur
  chosen_korean: 유황
  alternatives_korean:
