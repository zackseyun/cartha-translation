  - 타버린 황폐
  - 소각
  lexicon: HALOT
  rationale: 이 명사는 단순한 ‘불탐’보다 결과로서의 황폐 상태를 함께 나타내므로, ‘불타는 황폐함’으로 처리해 문맥의 상태 묘사를 살렸습니다.
- source_word: כָל אַרְצָהּ
  english_pob_choice: is all its land
  chosen_korean: 그 온 땅에 있습니다
  alternatives_korean:
  - 그 온 땅이 그렇습니다
  - 그 땅 전체가 그렇습니다
  lexicon: HALOT
  rationale: 히브리어는 무동사 절로 땅의 상태를 진술하므로, 한국어에서는 자연스럽게 ‘그 온 땅에 있습니다’로 풀어 전체 토지를 범위로 드러냈습니다.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  english_pob_choice: it is not sown, and it does not sprout, and no grass grows in it
  chosen_korean: 씨를 뿌리지 못하고, 싹도 트지 못하며, 아무 풀도 돋아나지 못합니다
  alternatives_korean:
  - 뿌려지지 않고 자라지 않으며 풀도 나지 못합니다
