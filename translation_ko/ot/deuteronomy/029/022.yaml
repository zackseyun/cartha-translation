  rationale: ‘소금’은 문자적으로 정확하며, 유황과의 결합이 황폐와 불모를 나타내는 관용적 대비를 살립니다.
- source_word: שְׂרֵפָה
  english_pob_choice: a burning waste
  chosen_korean: 불타는 황폐함
  alternatives_korean:
