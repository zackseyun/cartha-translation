  - 브리미스톤
  lexicon: HALOT
  rationale: 히브리어는 광물/원소로서의 유황을 가리키므로, 현대 한국어의 직접 대응인 ‘유황’이 가장 분명합니다.
- source_word: וָמֶלַח
  english_pob_choice: and salt
  chosen_korean: 소금
  alternatives_korean:
