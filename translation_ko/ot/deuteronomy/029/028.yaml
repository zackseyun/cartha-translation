  naturalness: 초안의 ‘속하고 … 속하니, 우리가 … 행하게 하려는 것입니다’는 문장 연결과 목적절의 주체가 다소 어색합니다. 두 대조 절을 완결된 문장으로 처리하고 목적을 별도 문장으로 제시하면 현대 표준어 합쇼체로 자연스럽습니다.
