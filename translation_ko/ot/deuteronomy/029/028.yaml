  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
  footnotes:
  - marker: a
    text: Or 'The secret things belong to the LORD our God, but the things revealed belong to us and to our children forever.'
    reason: lexical_alternative
  - marker: b
    text: '''This law'' may also be rendered ''this instruction''; in Deuteronomy the term refers to the covenantal teaching Moses sets before Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 감추어진 것들은 야훼 우리 하나님께 속하지만[a], 드러난 것들은 영원히 우리와 우리 자손에게 속합니다. 이는 우리가 이 율법[b]의 모든 말씀을 행하도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀한 것들은 야훼 우리 하나님께 속하고, 드러난 것들은 우리와 우리 자손에게 영원히 속한다.’
    reason: lexical_alternative
  - marker: b
    text: ‘이 율법’은 ‘이 가르침’으로도 옮길 수 있으며, 신명기에서는 모세가 이스라엘 앞에 제시하는 언약적 가르침을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  english_pob_choice: the hidden things
  chosen_korean: 숨은 것들
  alternatives_korean:
  - 숨겨진 것들
  - 비밀한 것들
  lexicon: HALOT
  rationale: סתר의 분사형이 명사처럼 쓰인 표현으로, 한국어에서는 ‘숨은 것들’이 가장 자연스럽고 원문의 ‘감추어진 상태’를 잘 살립니다.
- source_word: לַיהוָה אֱלֹהֵינוּ
  english_pob_choice: belong to Yahweh our God
  chosen_korean: 야훼 우리 하나님께 속하고
  alternatives_korean:
  - 야훼 우리 하나님께 속하며
  - 야훼 우리 하나님께 принадлеж합니다
  lexicon: HALOT
  rationale: 소유 관계를 나타내는 לְ를 한국어의 ‘~께 속하다’로 옮겨, 단순한 방향이 아니라 귀속을 분명히 드러냈습니다.
- source_word: וְהַנִּגְלֹת
  english_pob_choice: but the revealed things
  chosen_korean: 드러난 것들은
  alternatives_korean:
  - 드러난 것들은 또
  - 그리고 드러난 것들은
  lexicon: HALOT
  rationale: גלה의 수동 분사에 맞춰 ‘드러난’으로 옮기고, 앞절과의 대조를 살리기 위해 문맥상 ‘그리고’보다 ‘but’에 해당하는 대비를 한국어 어순으로 구현했습니다.
- source_word: לָנוּ וּלְבָנֵינוּ עַד עוֹלָם
  english_pob_choice: belong to us and to our children forever
  chosen_korean: 우리와 우리 자손에게 영원히 속하니
  alternatives_korean:
  - 우리와 우리 자녀에게 영원히 속하니
  - 우리와 우리 후손에게 영원히 속하니
  lexicon: HALOT
  rationale: בנים은 여기서 혈연적 후손을 가리키므로 ‘자손’이 문맥에 가장 적합하며, עַד עוֹלָם은 간결하게 ‘영원히’로 옮겼습니다.
- source_word: לַעֲשׂוֹת אֶת כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  english_pob_choice: so that we may do all the words of this law
  chosen_korean: 우리가 이 율법의 모든 말씀을 행하게 하려는 것입니다
  alternatives_korean:
  - 우리가 이 율법의 모든 말씀을 지키게 하려는 것입니다
  - 우리가 이 율법의 모든 말을 행하게 하려는 것입니다
  lexicon: HALOT
  rationale: דברי는 ‘말씀들/말들’이지만, 신명기의 규범적 맥락에서는 ‘율법의 모든 말씀’이 원문의 법적·언약적 무게를 가장 잘 보존합니다.
theological_decisions:
- issue: 감추어진 것과 드러난 것의 범위
  chosen_reading: 본문은 하나님께 속한 감추어진 것과 이스라엘에게 주어진 드러난 것을 대조하되, 그 범주를 지나치게 특정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 모든 신비에 대한 일반적 인식론적 진술
  - 문맥의 축복과 저주에만 한정된 진술
  rationale: 원문은 범주를 상세히 풀지 않으므로, 번역도 그 긴장을 보존해야 합니다. 문맥은 해석을 돕지만, 본문 자체의 대조를 넘어 과도하게 규정하지 않았습니다.
  doctrine_reference: 신학적 긴장을 해소하지 않고 보존
