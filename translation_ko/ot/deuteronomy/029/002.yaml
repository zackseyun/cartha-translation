  text: הַ/מַּסּוֹת֙ הַ/גְּדֹלֹ֔ת אֲשֶׁ֥ר רָא֖וּ עֵינֶ֑י/ךָ הָ/אֹתֹ֧ת וְ/הַ/מֹּפְתִ֛ים הַ/גְּדֹלִ֖ים הָ/הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/002.yaml
  text: the great trials that your eyes saw[a], those great signs and wonders.
  footnotes:
  - marker: a
    text: Or 'the great testings.' Older English versions sometimes have 'the great temptations,' but here the sense is testing or proving, not enticement to sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 눈이 직접 본 큰 시험들과, 곧 그 큰 표적들과 기사를 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַסּוֹת는 여기서 ‘유혹’이 아니라 ‘시험’ 또는 ‘검증’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת
  english_pob_choice: the great trials
  chosen_korean: 큰 시험들
  alternatives_korean:
  - 큰 시련들
  - 큰 검증들
  lexicon: HALOT
  rationale: מַסּוֹת는 유혹보다 ‘시험/검증’의 뜻이므로, 현대 한국어에서 자연스럽고 오해가 적은 ‘시험들’로 옮겼습니다.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  english_pob_choice: that your eyes saw
  chosen_korean: 그분의 눈이 직접 본
  alternatives_korean:
  - 네가 본
  - 눈으로 본
  lexicon: HALOT
  rationale: 히브리어는 ‘네 눈이 보았다’는 직설적 관용구로, 직접 목격했다는 강조를 살려 ‘눈이 직접 본’으로 유지했습니다.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  english_pob_choice: those great signs and wonders
  chosen_korean: 큰 표적들과 기사들
  alternatives_korean:
  - 큰 징조들과 이적들
  - 큰 표징들과 기적들
  lexicon: HALOT
  rationale: אוֹת와 מוֹפֵת의 묶음을 한국어 성경 문맥에 맞게 ‘표적들과 기사들’로 옮겨, 둘의 병렬성과 초자연적 행위를 함께 살렸습니다.
theological_decisions:
- issue: ‘네 눈이 본’의 직접 목격 강조
  chosen_reading: 직접 경험한 하나님의 행위를 기억시키는 표현으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘보았다’로 평탄화
  - ‘경험했다’로 의미를 풀어쓰기
  rationale: 본문의 수사적 힘은 이스라엘이 애굽과 광야에서 실제로 목격한 사건을 상기시키는 데 있으므로, 직접성의 강조를 보존했습니다.
  doctrine_reference: 신명기 29장의 언약 갱신과 증언 강조
