  lexicon: WLC / HALOT
  rationale: מִלְחָמָה는 단순한 충돌보다 넓은 전쟁/전투를 가리키므로, 목적을 나타내는 표현으로 대응해 적대적 의도를 분명히 했습니다.
- source_word: וַנַּכֵּם
  english_pob_choice: we struck them down
  chosen_korean: 우리는 그들을 쳐부수었습니다
  alternatives_korean:
  - 우리는 그들을 쳤습니다
  - 우리는 그들을 무찔렀습니다
  lexicon: WLC / HALOT
  rationale: נכה의 구체적 ‘치다/때리다’ 의미를 유지하면서, 전투 맥락에서의 결정적 패배를 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 전쟁 서술의 강한 동사 처리
  chosen_reading: ‘쳐부수었습니다’로 번역해 군사적 패배의 강도를 분명히 드러냈습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘패배시켰습니다’
  rationale: 본문은 단순한 경쟁 승리가 아니라 실제 전투에서의 निर्ण적 제압을 말하므로, 완곡화하지 않고 서술의 힘을 살리는 것이 적절합니다.
  doctrine_reference: 신명기 29장 문맥의 역사적 회고
- issue: 직접 خطاب의 호칭 처리
  chosen_reading: 2인칭 복수는 ‘당신들이’로 옮겨 회중 전체에 대한 직접 호소를 유지했습니다.
  alternative_readings:
  - ‘너희가’
  - ‘여러분이’
  rationale: 본문의 청중 지칭을 현대 한국어에서 분명하게 하되, 구어체로 흐르지 않도록 ‘당신들’을 사용했습니다.
  doctrine_reference: 신명기 29장 언약 갱신 خطاب
