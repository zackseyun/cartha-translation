base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
  footnotes:
  - marker: a
    text: Or 'and you came to this place.' The Hebrew narrative form can be rendered with simple coordination or with a temporal sense in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'and we defeated them.' The Hebrew verb literally means 'we struck them,' often in contexts of military defeat.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들이 이곳에 이르렀을 때[a], 헤스본의 왕 시혼과 바산의 왕 옥이 우리를 전쟁을 위해 맞으러 나왔고[b], 우리는 그들을 쳐부수었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 당신들이 이곳에 왔을 때.’ 히브리어 서술형은 한국어에서 단순 연결이나 시간 부사절로 모두 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전투 중에.’ 히브리어는 문자적으로 ‘전쟁을 위해’이지만, 문맥상 적대적 의도를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ אֶל הַמָּקוֹם הַזֶּה
  english_pob_choice: When you came to this place
  chosen_korean: 당신들이 이곳에 이르렀을 때
  alternatives_korean:
  - 그리고 당신들이 이곳에 왔을 때
  - 당신들이 이곳에 도착했을 때
  lexicon: WLC / HALOT
  rationale: 이동 완료를 나타내는 완료 서술을 한국어에서는 시간 부사절로 자연스럽게 풀어, 본문의 사건 진행을 살렸습니다.
- source_word: וַיֵּצֵא סִיחֹן ... וְעוֹג ... לִקְרָאתֵנוּ
  english_pob_choice: came out to meet us
  chosen_korean: 우리를 맞으러 나왔고
  alternatives_korean:
  - 우리와 맞서려고 나왔고
  - 우리에게 맞서 나왔고
  lexicon: WLC / HALOT
  rationale: לִקְרָאתֵנוּ의 기본 뜻인 ‘맞으러/마주하러’는 살리되, 군사적 긴장은 뒤의 ‘전쟁을 위해’가 드러내므로 과도하게 해석하지 않았습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: in battle
  chosen_korean: 전쟁을 위해
  alternatives_korean:
  - 전쟁으로
  - 전투를 위해
  lexicon: WLC / HALOT
  rationale: מִלְחָמָה는 단순한 충돌보다 넓은 전쟁/전투를 가리키므로, 목적을 나타내는 표현으로 대응해 적대적 의도를 분명히 했습니다.
- source_word: וַנַּכֵּם
  english_pob_choice: we struck them down
  chosen_korean: 우리는 그들을 쳐부수었습니다
  alternatives_korean:
  - 우리는 그들을 쳤습니다
  - 우리는 그들을 무찔렀습니다
  lexicon: WLC / HALOT
  rationale: נכה의 구체적 ‘치다/때리다’ 의미를 유지하면서, 전투 맥락에서의 결정적 패배를 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 전쟁 서술의 강한 동사 처리
  chosen_reading: ‘쳐부수었습니다’로 번역해 군사적 패배의 강도를 분명히 드러냈습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘패배시켰습니다’
  rationale: 본문은 단순한 경쟁 승리가 아니라 실제 전투에서의 निर्ण적 제압을 말하므로, 완곡화하지 않고 서술의 힘을 살리는 것이 적절합니다.
  doctrine_reference: 신명기 29장 문맥의 역사적 회고
- issue: 직접 خطاب의 호칭 처리
  chosen_reading: 2인칭 복수는 ‘당신들이’로 옮겨 회중 전체에 대한 직접 호소를 유지했습니다.
  alternative_readings:
  - ‘너희가’
  - ‘여러분이’
  rationale: 본문의 청중 지칭을 현대 한국어에서 분명하게 하되, 구어체로 흐르지 않도록 ‘당신들’을 사용했습니다.
  doctrine_reference: 신명기 29장 언약 갱신 خطاب
