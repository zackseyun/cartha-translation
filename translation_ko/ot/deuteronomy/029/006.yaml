  rationale: לִקְרָאתֵנוּ의 기본 뜻인 ‘맞으러/마주하러’는 살리되, 군사적 긴장은 뒤의 ‘전쟁을 위해’가 드러내므로 과도하게 해석하지 않았습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: in battle
  chosen_korean: 전쟁을 위해
  alternatives_korean:
  - 전쟁으로
