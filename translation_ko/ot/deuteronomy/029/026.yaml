  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: ko
  text: 여호와의 분노가 그 땅에 불타올라, 이 책에 기록된 모든 저주를 그 위에 가져오게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호와’는 본문 히브리어 יְהוָה를 가리키는 전통적 한국어 표기입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: the anger ... burned
  chosen_korean: 분노가 ... 불타올라
  alternatives_korean:
  - 진노가 ... 불붙어
  - 분노가 ... 타올라
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘타오름’ 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘불타올라’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 본문은 하나님의 언약명 YHWH를 가리키므로 고유명사로 처리해야 하며, 이 절의 한국어 초안에서는 기존 교회용 표기인 ‘여호와’를 사용했습니다.
- source_word: בָּאָרֶץ הַהִוא
  english_pob_choice: against that land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 땅을 향해
  - 그 땅 위에
  lexicon: HALOT
  rationale: 분노가 향하는 대상이라는 점은 문맥상 분명하므로, 한국어에서는 목적격보다 자연스러운 ‘그 땅에’로 옮기되 심판의 방향성을 유지했습니다.
- source_word: כָּל הַקְּלָלָה
  english_pob_choice: every curse
  chosen_korean: 모든 저주
  alternatives_korean:
  - 온 저주
  - 각각의 저주
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사라도 문맥상 총체성을 나타내므로 한국어에서는 관용적으로 ‘모든 저주’가 가장 분명합니다.
theological_decisions:
- issue: 언약 저주를 ‘bring upon it’로 옮기는 방식
  chosen_reading: 심판 행위가 우연한 결과가 아니라 하나님의 의도적 집행으로 읽히도록 ‘가져오게 하셨습니다’로 번역했습니다.
  alternative_readings:
  - 가져오려고 하셨습니다
  - 가져오게 하려고 하셨습니다
  rationale: 문맥상 분노의 결과가 곧 언약 저주의 실행이므로, 목적과 결과를 함께 드러내는 종결 표현이 가장 적절합니다.
  doctrine_reference: 신명기 언약의 축복과 저주 구조
