revisions:
- from: 여호와의 분노가 그 땅에 불타올라, 이 책에 기록된 모든 저주를 그 위에 가져오게 하셨습니다.[a]
  to: 야훼께서 그 땅을 향해 진노하셔서 이 책에 기록된 모든 저주를 그 땅 위에 내리셨습니다.
  rationale: 수정문은 히브리어의 강한 분노와 그 결과로 땅에 언약 저주가 임하는 뜻을 보존합니다. ‘그 땅을 향해’는 분노의 대상을, ‘그 땅 위에’는 עָלֶיהָ의 심판이 임하는 방향을 구별해 나타냅니다. YHWH는 영어 POB의 ‘Yahweh’와 일치하도록 ‘야훼’로 음역했으며, 별도 주석은 본문 이해에 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:05Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘분노가 불타오르다’, ‘이 책에 기록된 모든 저주’라는 핵심 의미를 대체로 반영합니다. 그러나 ‘분노가 … 가져오게 하셨습니다’는 주어가 ‘분노’에서 존대 주체인 ‘여호와’로 문법적으로 부자연스럽게 전환됩니다. 히브리어의 주체와 심판의 실행을 한국어에서 명료하게 드러낼 필요가 있습니다.
  naturalness: ‘그 땅에 불타올라’는 분노의 대상인지 장소인지 다소 흐리고, ‘가져오게 하셨습니다’는 이 문맥에서 어색하며 사역 의미를 불필요하게 더합니다. ‘그 땅을 향해 진노하셔서 … 내리셨습니다’가 현대 표준어 합쇼체로 자연스럽고 문맥도 분명합니다.
  terminology: 영어 POB의 YHWH 방침(Yahweh)에 맞추어 한국어에서도 음역인 ‘야훼’를 사용했습니다. ‘저주’와 ‘이 책’은 적절합니다. 땅에 저주가 임하는 משפט적 표현은 ‘그 땅 위에 내리셨습니다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 문장 주어와 종결 어미의 불일치
    rationale: ‘여호와의 분노가 … 불타올라’의 문법적 주어는 ‘분노’인데, 뒤의 ‘가져오게 하셨습니다’는 여호와를 존대 주체로 전제합니다. 원문의 인과 관계를 유지하면서 여호와를 문장 주체로 밝혀야 합니다.
  - severity: low
    issue: ‘가져오게 하셨습니다’의 불필요한 사역성
    rationale: לְהָבִיא는 저주를 땅 위에 가져오는/임하게 하는 행위를 나타내며, 한국어 ‘내리셨습니다’가 심판 시행을 자연스럽게 전달합니다.
  - severity: low
    issue: 신명 표기의 영어 POB 방침 불일치
    rationale: 영어 감사 기준이 YHWH를 ‘Yahweh’로 음역하므로, 한국어도 전통적 ‘여호와’ 대신 ‘야훼’로 맞추는 것이 명칭 정책과 감사 추적에 더 일관됩니다.
  revised_text: 야훼께서 그 땅을 향해 진노하셔서 이 책에 기록된 모든 저주를 그 땅 위에 내리셨습니다.
