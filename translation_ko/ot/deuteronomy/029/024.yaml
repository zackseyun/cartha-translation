translation:
  language: ko
  text: 그들은 ‘야훼, 곧 그들의 조상들의 하나님과 맺으신 언약을 저버렸기 때문입니다. 그분은 그들을 이집트 땅에서 이끌어 내실 때 그들과 그 언약을 맺으셨습니다.’라고 말할 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 조상들의 하나님’으로 되어 있습니다. ‘그들의 조상의 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: Then they will say
  chosen_korean: 그들은 …라고 말할 것입니다
  alternatives_korean:
  - 그들은 …라고 할 것입니다
  - 그때 그들은 …라고 말할 것입니다
  lexicon: HALOT
  rationale: 문맥상 주변 민족의 반응을 이어 주는 서술이므로 미래형으로 자연스럽게 옮기되, 원문의 담화 흐름을 반영했습니다.
- source_word: עַל אֲשֶׁר עָזְבוּ
  english_pob_choice: Because they forsook
  chosen_korean: …을 저버렸기 때문입니다
  alternatives_korean:
  - …을 버렸기 때문입니다
  - …을 떠났기 때문입니다
  lexicon: HALOT
  rationale: 단순한 이탈이 아니라 언약에 대한 의도적 배반을 뜻하므로, 관계와 책임을 함께 드러내는 ‘저버리다’를 택했습니다.
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 협정
  lexicon: HALOT
  rationale: 하나님과 이스라엘의 결속 관계를 가리키는 표준적 성경 용례를 따라 ‘언약’으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי אֲבֹתָם
  english_pob_choice: Yahweh, the God of their fathers
  chosen_korean: 야훼, 곧 그들의 조상들의 하나님
  alternatives_korean:
  - 야훼, 곧 그들의 조상들의 하나님
  - 야훼, 곧 그들의 조상의 하나님
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 ‘야훼’를 유지하고, אֱלֹהֵי אֲבֹתָם의 직구조를 살려 ‘그들의 조상들의 하나님’으로 옮겼습니다.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: when he brought them out of the land of Egypt
  chosen_korean: 그들을 이집트 땅에서 이끌어 내실 때
  alternatives_korean:
  - 그들을 이집트 땅에서 이끌어 내실 때
  - 그들을 이집트 땅에서 인도하여 내실 때
  lexicon: HALOT
  rationale: 출애굽의 행위를 문맥에 맞게 자연스러운 서술로 풀어 옮기되, ‘땅에서’와 ‘이끌어 내다’로 원문의 장소·행위를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약의 고유명인 יהוה를 직접 사용하므로, 대체 칭호보다 음역형 ‘야훼’를 유지해 본문의 신학적 특정성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֱלֹהֵי אֲבֹתָם의 인칭성
  chosen_reading: 그들의 조상들의 하나님
  alternative_readings:
  - 그들의 조상의 하나님
  - 그들의 선조들의 하나님
  rationale: 히브리어의 복수형 ‘아버지들/조상들’ 구조를 보존해 족장-언약의 연속성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
