  - 협정
  lexicon: HALOT
  rationale: 하나님과 이스라엘의 결속 관계를 가리키는 표준적 성경 용례를 따라 ‘언약’으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי אֲבֹתָם
  english_pob_choice: Yahweh, the God of their fathers
  chosen_korean: 야훼, 곧 그들의 조상들의 하나님
  alternatives_korean:
  - 야훼, 곧 그들의 조상들의 하나님
  - 야훼, 곧 그들의 조상의 하나님
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 ‘야훼’를 유지하고, אֱלֹהֵי אֲבֹתָם의 직구조를 살려 ‘그들의 조상들의 하나님’으로 옮겼습니다.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: when he brought them out of the land of Egypt
  chosen_korean: 그들을 이집트 땅에서 이끌어 내실 때
  alternatives_korean:
  - 그들을 이집트 땅에서 이끌어 내실 때
  - 그들을 이집트 땅에서 인도하여 내실 때
  lexicon: HALOT
  rationale: 출애굽의 행위를 문맥에 맞게 자연스러운 서술로 풀어 옮기되, ‘땅에서’와 ‘이끌어 내다’로 원문의 장소·행위를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
