translation:
  language: ko
  text: 그들은 ‘야훼, 곧 그들의 조상의 하나님[a]께서 그들을 이집트 땅에서 이끌어 내실 때 그들과 맺으신 언약을 저버렸기 때문입니다.’라고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 아버지들의 하나님’입니다. ‘그들의 조상들의 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: Then they will say
  chosen_korean: 그들은 …라고 말할 것입니다
  alternatives_korean:
