  - …을 떠났기 때문입니다
  lexicon: HALOT
  rationale: 단순한 이탈이 아니라 언약에 대한 의도적 배반을 뜻하므로, 관계와 책임을 함께 드러내는 ‘저버리다’를 택했습니다.
