id: DEU.19.1
reference: Deuteronomy 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
  footnotes:
  - marker: a
    text: Or 'destroys' or 'eliminates'; Hebrew 'cuts off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 하나님 야훼께서 네게 그들의 땅을 주시는 민족들을 끊어 내시고[a], 네가 그들을 쫓아내고 그들의 도시들과 집들에 거주하게 되면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘끊어 내시고’입니다. 다른 가능성으로는 ‘멸하시고’, ‘제거하시고’가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 여호와 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 원문의 고유명사를 드러내기 위해 하나님의 이름은 번역어가 아니라 음역 관용형으로 처리했습니다. 한국어 성경 독자성도 고려해 본문에서는 '여호와'를 사용했습니다.
- source_word: יַכְרִית
  english_pob_choice: cuts off
  chosen_korean: 끊어 버리시고
  alternatives_korean:
  - 멸하시고
  - 제거하시고
  - 끊으시고
  lexicon: HALOT
  rationale: 히필형 כרת의 직유적 의미를 살리되, 한국어에서는 관계를 끊어 없애는 강한 동작을 자연스럽게 담는 '끊어 버리시다'가 본문에 가장 적절합니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 그 민족들
  alternatives_korean:
  - 그 나라들
  - 그 이방 민족들
  lexicon: HALOT
  rationale: 정치적 실체보다는 가나안 정착 문맥의 집단을 가리키므로 '민족들'이 자연스럽고, '이방'은 원문에 없는 해석을 덧붙일 수 있어 피했습니다.
- source_word: וִירִשְׁתָּם
  english_pob_choice: you dispossess them
  chosen_korean: 그들을 쫓아내어
  alternatives_korean:
  - 그들을 차지하여
  - 그들을 소유하여
  - 그들을 점유하여
  lexicon: HALOT
  rationale: 여기서 ירש는 사람을 '상속'하는 뜻이 아니라 그들을 땅에서 몰아내는 결과를 가리키므로, 한국어에서는 결과를 분명히 하는 '쫓아내어'로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 본문에는 '여호와'를 유지하고, 필요 시 주석에서 히브리어 원형 יְהוָה를 환기합니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 야훼 이름이 직접 나오는 본문이지만, 한국어 POB 본문 가독성과 수용성을 위해 기존 한국교회 독자에게 익숙한 음역 관용형을 택했습니다. 이는 원문의 고유명사성을 약화시키지 않으면서도 읽기 흐름을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 동사의 종결과 문장 흐름
  chosen_reading: 미래 조건을 '되면'으로 자연스럽게 이어 주되, 원문의 확정적 상황감을 유지합니다.
  alternative_readings:
  - 하게 되면
  - 할 때
  - 만일
  rationale: כִּי의 문맥상 이 절은 가정적이면서도 기대되는 미래 상황을 열어 주므로, 한국어에서는 조건과 시점을 함께 나타내는 '되면'이 가장 자연스럽습니다.
  doctrine_reference: Deuteronomy의 법률적-예언적 문맥
