lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  english_pob_choice: three cities
  chosen_korean: 여러 성읍
  alternatives_korean:
  - 세 성읍
  - 세 도시
  lexicon: HALOT
  rationale: 본문은 숫자 '셋'이 분명하므로 수량을 살리되, 한국어에서 규정·법률 문맥의 עִיר는 '성읍'이 더 자연스럽습니다. 다만 첫 절의 명령형 흐름을 살리기 위해 문장 전체를 간결하게 처리했습니다.
- source_word: תַּבְדִּיל
  english_pob_choice: you shall set apart
  chosen_korean: 구별하여 두어야 합니다
  alternatives_korean:
  - 구별해야 합니다
  - 따로 떼어 두어야 합니다
  - 분리하여 두어야 합니다
  lexicon: HALOT
  rationale: בדל의 핵심은 '구별하다/분리하다'이며, 문맥상 도피성으로 지정하는 법적 뉘앙스가 있습니다. '구별하여 두어야 합니다'는 분리와 지정의 의미를 함께 살립니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 네가 차지하도록
  alternatives_korean:
  - 네가 소유하도록
  - 네가 상속받도록
  - 차지하게 하시는
  lexicon: HALOT
  rationale: ירש는 땅 문맥에서 '차지하다/소유하다/상속받다'의 범위를 가지는데, 여기서는 하나님이 주시는 땅을 실제로 점유해 들어간다는 의미가 두드러집니다. '차지하도록'은 POB의 'possess'를 자연스럽게 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 고유명사는 신적 칭호가 아니라 언약 이름이므로, 본문에 맞게 '야훼'로 옮깁니다. 이는 POB의 표준 용례를 한국어로 일관되게 반영한 것입니다.
theological_decisions:
- issue: יהוה(יְהוָה)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 야훼께서 이스라엘에게 땅을 주시는 언약적 행위를 말하므로, 고유명사인 신명을 제목이나 대명사로 바꾸지 않고 음역 표기를 유지하는 것이 본문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
