source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
  footnotes:
  - marker: a
    text: Or 'against anyone' / 'against a person.' The Hebrew says 'against a man,' using a masculine singular form in a representative legal sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by the mouth of two witnesses or by the mouth of three witnesses.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a case shall be established.' The Hebrew verb is the same as earlier in the verse ('shall stand'), creating a legal parallel.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 증인만으로는 어떤 죄악이나 어떤 죄에 관해서도, 곧 그가 범하는 어떤 죄에 관해서도 사람에 대하여 서지 못합니다. 두 증인의 증언이나 세 증인의 증언에 따라 그 일이 서게 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한 증인’과 ‘두 증인/세 증인’의 대비로 증거의 성립 조건을 말합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘두 증인의 입으로 또는 세 증인의 입으로’입니다.
    reason: lexical_alternative
  - marker: c
    text: 같은 동사 ‘서다’가 앞뒤에 반복되어 법적 성립을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָקוּם ... יָקוּם
  english_pob_choice: shall not stand ... shall stand
  chosen_korean: 서지 못합니다 ... 서게 됩니다
  alternatives_korean:
  - 설 수 없습니다 ... 설 수 있습니다
  - 확립되지 않습니다 ... 확립됩니다
  lexicon: HALOT
  rationale: 법정 문맥의 קום 반복을 한국어에서도 ‘서다’로 살려, 증언의 유효성/성립 여부라는 법적 이미지를 유지했습니다.
- source_word: עֵד אֶחָד
  english_pob_choice: a single witness
  chosen_korean: 한 증인만으로는
  alternatives_korean:
  - 한 증인은
  - 오직 한 증인은
  lexicon: HALOT
  rationale: 증인 하나만으로는 부족하다는 뜻을 자연스러운 한국어로 풀되, ‘단일 증인’이라는 법적 한계를 분명히 했습니다.
- source_word: בְּאִישׁ
  english_pob_choice: against a man
  chosen_korean: 사람에 대하여
  alternatives_korean:
  - 한 남자에 대하여
  - 어떤 사람에 대하여
  lexicon: HALOT
  rationale: 히브리어의 대표적 남성 단수 표현을 반영하되, 한국어에서는 법 조항의 일반성을 살려 ‘사람’으로 옮겼습니다.
- source_word: עַל פִּי שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  english_pob_choice: on the testimony of two witnesses ... three witnesses
  chosen_korean: 두 증인의 증언이나 세 증인의 증언에 따라
  alternatives_korean:
  - 두 증인의 입에 따라 ... 세 증인의 입에 따라
  - 두 증인의 증언으로 ... 세 증인의 증언으로
  lexicon: HALOT
  rationale: 직역의 ‘입에 따라’라는 관용구를 한국어 법률문맥에 맞게 ‘증언에 따라’로 옮겨, 의미를 분명하게 했습니다.
- source_word: דָּבָר
  english_pob_choice: a matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 사건
  - 그 사안
  - 그 일이
  lexicon: HALOT
  rationale: 법정 문맥의 ‘사건/사안’ 중, 히브리어의 포괄적 ‘matter’를 가장 자연스럽게 드러내는 표현으로 ‘그 일’을 선택했습니다.
theological_decisions:
- issue: 대표적 남성 단수 표현 אִישׁ의 처리
  chosen_reading: 사람에 대하여
  alternative_readings:
  - 한 남자에 대하여
  - 어떤 사람에 대하여
  rationale: 원문의 남성형 단수는 유지하되, 한국어 본문에서는 법률 규정의 일반 적용을 살리기 위해 성별을 전면에 두지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
