  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
  footnotes:
  - marker: a
    text: Or 'a false witness.' The Hebrew phrase literally reads 'a witness of violence/wrong,' which can denote a malicious or false accuser in court.
    reason: lexical_alternative
  - marker: b
    text: Or 'rebellion' or 'apostasy.' The Hebrew word can refer to serious deviation or defection; here it is rendered more generally as 'wrongdoing' to fit the legal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 악의적인 증인이 어떤 사람에게 일어나 그에 대하여 반역을 증언하면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '거짓 증인.' 히브리어 구절은 문자적으로 '폭력/그릇됨의 증인'이라고 읽히며, 법정에서는 악의적이거나 거짓된 고발자를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '반역' 또는 '배교.' 히브리어 단어는 심각한 일탈이나 배신을 가리킬 수 있으며, 여기서는 법적 맥락에 맞게 더 일반적인 '반역'으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - إذا
  - 그때
  - 그리고
  lexicon: HALOT
  rationale: 법률 문맥의 가정 조건을 한국어 법조문식 표현인 '만일'로 옮겨, 조건문의 성격을 자연스럽게 드러냈습니다.
- source_word: עֵד חָמָס
  english_pob_choice: a malicious witness
  chosen_korean: 악의적인 증인
  alternatives_korean:
  - 거짓 증인
  - 폭력의 증인
  - 악한 증인
  lexicon: HALOT
  rationale: 직역하면 '폭력/그릇됨의 증인'이지만, 법정에서의 해로운 증언이라는 문맥을 살려 '악의적인 증인'으로 옮겼습니다. POB의 'malicious witness'와 대응됩니다.
- source_word: יָקוּם
  english_pob_choice: rises up
  chosen_korean: 일어나
  alternatives_korean:
  - 나서
  - 등장하여
  - 들어서
  lexicon: HALOT
  rationale: קום의 구체적 동작 이미지를 살리되 한국어 법률 문체에서 자연스러운 '일어나'로 표현했습니다.
- source_word: סָרָה
  english_pob_choice: rebellion / wrongdoing
  chosen_korean: 반역
  alternatives_korean:
  - 잘못
  - 배반
  - 일탈
  lexicon: HALOT
  rationale: 이 어근은 '벗어남, 이탈'에서 강한 위반까지 포괄하지만, 이 절의 법정 고발 맥락에서는 POB가 남겨 둔 긴장을 살리면서도 가장 강한 쪽인 '반역'이 적절합니다.
theological_decisions:
- issue: 'סָרָה의 범위: 단순한 잘못인지, 더 강한 반역/배교인지'
  chosen_reading: '''반역''으로 옮겨 법정 고발의 중대성과 이탈의 강도를 살렸습니다.'
  alternative_readings:
  - 잘못
  - 배교
  - 일탈
  rationale: 영문 POB가 주석에서 이 단어의 범위를 'rebellion'과 'apostasy'까지 열어 두었으므로, 본문 자체는 더 일반화하지 않고 강한 법적·언약적 위반의 뉘앙스를 유지했습니다.
  doctrine_reference: Deuteronomy 19:16 lexical ambiguity; POB footnote b
