source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'Now this is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
  footnotes:
  - marker: a
    text: Literally, 'from yesterday and the day before.' The idiom means 'previously' or 'beforehand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 도피할 수 있는 살인자의 규정입니다. 그가 그리로 도망하여 살아야 할 때, 곧 이웃을 고의 없이 치고, 이전부터 그를 미워하지 않았던 경우입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이전부터’는 문자적으로 ‘어제와 그 전날로부터’라는 관용구입니다. 즉 ‘이전에, 미리’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  english_pob_choice: provision
  chosen_korean: 규정
  alternatives_korean:
  - 법
  - 조항
  - 사례
  lexicon: HALOT
  rationale: 법률 문맥의 דְּבַר는 ‘일반적 말’보다 해당 사건에 대한 법적 규정이나 조항을 가리키므로, 현대 한국어에서는 ‘규정’이 가장 자연스럽고 정확합니다.
- source_word: הָרֹצֵחַ
  english_pob_choice: manslayer
  chosen_korean: 살인자
  alternatives_korean:
  - 죽인 자
  - 살해자
  - 사람을 죽인 자
  lexicon: HALOT
  rationale: 도피 성읍 문맥에서는 책임 여부가 완전히 확정되지 않은 경우도 포함되지만, 한국어의 전통적 ‘살인자’는 법적 범주를 간결하게 드러내므로 본문은 이를 따르되, 문맥상 유죄 판정과는 구별됩니다.
- source_word: בִּבְלִי דַעַת
  english_pob_choice: without intent
  chosen_korean: 고의 없이
  alternatives_korean:
  - 무지하게
  - 알지 못하고
  - 의도 없이
  lexicon: HALOT
  rationale: 직역하면 ‘지식 없이’이지만, 이 법률 문맥에서는 책임성의 결여를 나타내므로 ‘고의 없이’가 현대 한국어에서 가장 분명하게 그 법적 의미를 전달합니다.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  english_pob_choice: in times past
  chosen_korean: 이전부터
  alternatives_korean:
  - 옛날부터
  - 예전부터
  - 과거에
  lexicon: HALOT
  rationale: 관용구의 핵심은 ‘바로 이전의 과거에 이미’라는 의미이므로, 본문에는 간결한 ‘이전부터’를 두고, 시간적 뉘앙스는 문맥으로 살렸습니다.
theological_decisions:
- issue: 도피 성읍 규정에서의 ‘살인자’ 범주
  chosen_reading: 본문의 법적 초점은 고의적 살해가 아니라, 결과적으로 사람이 죽은 경우 중 과실적/비고의적 사건을 가르는 규정에 있습니다.
  alternative_readings:
  - ‘살인자’ 대신 ‘사람을 죽인 자’로 순화
  - ‘살인자’를 강한 유죄 판정으로 읽기
  rationale: 히브리어 문맥과 전체 도피 성읍 규정은 의도성의 유무를 핵심 기준으로 삼으므로, 번역도 책임성 판단을 본문 밖으로 과도하게 밀어내지 않도록 유지했습니다.
  doctrine_reference: 민수기 35장; 여호수아 20장 도피 성읍 규정
