  to: 이는 그리로 도피하여 살 수 있는 사람을 죽인 자에 관한 규정입니다. 곧 어떤 사람이 고의 없이 이웃을 쳤고, 이전부터[a] 그를 미워하지 않았던 경우입니다.
  rationale: 법적 문맥의 구조를 보존하여, 도피하여 생명을 보전할 수 있는 ‘사람을 죽인 자’에 관한 규정임을 분명히 했습니다. 고의성의 부재와 이전의 적의 부재를 원문의 두 병렬 조건대로 유지했으며, 논쟁적 법적 책임 판단을 덧붙이지 않았습니다.
