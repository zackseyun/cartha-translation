  source_fidelity: ‘살인자’는 이 도피성 문맥에서 아직 고의적 살인으로 확정되지 않은 הָרֹצֵחַ를 한국어에서 지나치게 유죄적으로 들리게 할 수 있으므로 ‘사람을 죽인 자’가 더 정확합니다. 또한 원문의 ‘그리로 도피하여 살다’는 단순히 도피할 가능성이나 ‘살아야 할 때’가 아니라, 도피하여 생명을 보전하는 사람을 수식합니다.
  naturalness: 초안의 ‘그가 그리로 도망하여 살아야 할 때’는 한국어 문장 구조상 부자연스럽고 원문의 법적 정의 구조를 흐립니다. ‘그리로 도피하여 살 수 있는 사람을 죽인 자에 관한 규정’으로 고치면 현대의 격식 있는 합쇼체에서 자연스럽습니다.
  terminology: דְּבַר의 법률적 용례에 ‘규정’은 적절합니다. בִּבְלִי דַעַת는 이 문맥에서 ‘고의 없이’로 옮길 수 있습니다. מִתְּמֹל שִׁלְשֹׁם은 ‘이전부터’로 유지하되, 해당 어구 바로 뒤에 각주 표지를 두어 문자적 관용구를 명확히 밝혀야 합니다.
