  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
  footnotes:
  - marker: a
    text: Literally, 'because his heart is hot.' The Hebrew idiom expresses inflamed anger.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from yesterday or the day before,' a Hebrew idiom meaning 'previously' or 'formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면 피의 보복자가 살인자를 뒤쫓을 수 있습니다. 그의 마음이 뜨겁고, 길이 멀기 때문에 그를 따라잡아 그를 죽여 버릴 수 있습니다. 그러나 그는 죽을 죄가 없고, 이전부터 그를 미워한 것도 아니기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘그의 마음이 뜨겁다’입니다. 분노가 격해진 상태를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘어제나 그 전날부터’입니다. 여기서는 ‘이전부터’라는 뜻입니다.
    reason: lexical_alternative
