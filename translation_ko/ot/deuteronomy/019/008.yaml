  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
  footnotes:
  - marker: a
    text: Or 'to your ancestors' in both occurrences of 'to your fathers.' The Hebrew is literally 'to your fathers,' referring to Israel's patriarchal forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 야훼 너의 하나님이, 그가 너의 조상들에게 맹세하신 것처럼, 너의 경계를 넓히시고 너에게 그 조상들에게 주기로 말씀하신 온 땅을 주시면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너의 조상들에게’는 히브리어의 문자적 표현입니다. 문맥상 이스라엘의 족장들을 가리키므로 ‘너의 조상들’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 앞선 문맥과 이어지는 조건절이므로 접속을 살린 ‘그리고’와 조건을 드러내는 ‘만일’을 함께 두었습니다.
- source_word: יַרְחִיב
  english_pob_choice: enlarges
  chosen_korean: 넓히시고
  alternatives_korean:
  - 확장하시고
  - 더 넓게 하시고
  lexicon: HALOT
  rationale: רחב의 사역적 의미를 자연스럽게 살려 영토가 넓어지는 장면을 ‘넓히시고’로 표현했습니다.
- source_word: גְּבֻלְךָ
  english_pob_choice: your territory
  chosen_korean: 너의 경계
  alternatives_korean:
  - 너의 영토
  - 너의 경계선
  lexicon: HALOT
  rationale: גְּבוּל은 경계, 국경, 영토를 아울러 가리킬 수 있어, 본문에서는 확장되는 땅의 한계를 드러내는 ‘경계’가 가장 직접적입니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 너의 조상들에게
  alternatives_korean:
  - 너의 아버지들에게
  - 너의 선조들에게
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘fathers’를 한국어에서 오해 없이 전달하면서, 약속의 족장들을 가리키는 문맥을 반영해 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 여호와의 고유 이름을 제목어로 대체하지 않고, 프로젝트 표준에 따라 ‘야훼’로 음역해 언약적 인격성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
