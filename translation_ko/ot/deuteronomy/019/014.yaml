  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
  footnotes:
  - marker: a
    text: Or 'landmark' for 'boundary marker.' The Hebrew refers to the property boundary as fixed by a marker.
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃의 경계표를, 옛 세대들이 정한 그것을, 당신의 기업 안에서 움직여서는 안 됩니다. 곧 당신이 땅에서 기업으로 받을 땅에서, 야훼 당신의 하나님께서 당신에게 주어 그것을 차지하게 하시는 땅에서 그렇게 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경계표지’로 옮길 수 있습니다. 히브리어는 고정된 경계를 표시하는 표식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹ֤א תַסִּיג֙
  english_pob_choice: You shall not move
  chosen_korean: 움직여서는 안 됩니다
  alternatives_korean:
  - 옮겨서는 안 됩니다
  - 뒤로 옮겨서는 안 됩니다
  - 빼서는 안 됩니다
  lexicon: HALOT
  rationale: 경계선을 뒤로 밀어내는 법적 위반을 현대 한국어로 자연스럽게 드러내되, 방향을 지나치게 좁히지 않고 금지의 의미를 분명히 살렸습니다.
- source_word: גְּב֣וּל
  english_pob_choice: boundary marker
  chosen_korean: 경계표
  alternatives_korean:
  - 경계
  - 표지
  - 경계석
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘경계’보다 실제로 옮길 수 있는 물리적 표식을 가리키므로, POB의 ‘boundary marker’에 맞춰 ‘경계표’로 옮겼습니다.
- source_word: רִאשֹׁנִ֑ים
  english_pob_choice: the former generations
  chosen_korean: 옛 세대들이
  alternatives_korean:
  - 이전 세대들이
  - 먼저 있던 이들이
  - 조상들이
  lexicon: HALOT
  rationale: 경계를 처음 정한 선대 집단을 가리키므로, 혈연적 ‘조상들’보다 법적·역사적 뉘앙스가 드러나는 ‘옛 세대들’이 더 정확합니다.
- source_word: נַחֲלָה / תִּנְחַל
  english_pob_choice: inheritance / you will inherit
  chosen_korean: 기업 / 기업으로 받을
  alternatives_korean:
  - 유업 / 유업으로 받을
  - 상속분 / 받을
  - 분깃 / 차지할
  lexicon: HALOT
  rationale: 토지 분배의 언약적·법적 용어를 살리기 위해 전통적 성경어인 ‘기업’을 사용했고, 동사도 ‘기업으로 받을’로 맞춰 반복 어감을 유지했습니다.
- source_word: יְהוָה אֱלֹהֶי/ךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하느님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 신명기의 원문에 있는 신명(神名)을 그대로 반영하여 ‘야훼’를 사용했고, 한국어 관용을 따르되 번역 원칙에 맞게 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 경계 침범 금지의 법적 강도
  chosen_reading: 단순한 예의 권고가 아니라 이웃의 땅 경계를 침범하는 행위를 금지하는 언약법의 명령으로 읽었습니다.
  alternative_readings:
  - 일반적인 이웃 배려의 권면
  - 재산 분쟁에 대한 실무 지침
  rationale: 본문은 소유 경계의 이동을 금지하는 법문이므로, 윤리적 권면으로 약화하지 않고 공동체의 토지 정의를 지키는 명령으로 번역했습니다.
  doctrine_reference: Deut 19:14의 언약 공동체 토지 규례
