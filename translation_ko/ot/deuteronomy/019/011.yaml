  source_fidelity: ‘그를 해치려고’는 매복의 적대적·계획적 성격과 문맥상 부합하지만, אָרַב 자체에 명시된 목적절은 아니므로 본문에서는 빼는 것이 더 직접적입니다. 또한 וְקָם עָלָיו의 ‘그에게 맞서 일어나다’를 드러내고, 타격·죽음·도피의 행위 연쇄를 유지했습니다.
  naturalness: 수정문은 한국어 법문 문맥에서 자연스럽게 조건을 제시하며, 원문의 미완결 조건절에 맞추어 끝에 쉼표를 두었습니다. ‘그에게 맞서 일어나’는 다소 직역적이지만 적대적 행동의 개시를 보존하는 자연스러운 표현입니다.
  terminology: רֵעֵהוּ는 ‘자기 이웃’, עָרִים은 ‘성읍들’로 유지했습니다. 각주에서 נֶפֶשׁ을 ‘그의 생명/혼’으로 설명한 것은 원문의 문법을 정확히 반영하지 못하므로, ‘생명에 이르도록’이라는 직역적 설명으로 바로잡았습니다.
