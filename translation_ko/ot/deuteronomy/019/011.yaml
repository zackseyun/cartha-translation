base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
  footnotes:
  - marker: a
    text: Or 'strikes him mortally' or 'strikes him so that he dies.' The Hebrew expression is literally 'strikes him [in] life/soul,' an idiom for delivering a lethal blow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 어떤 사람이 자기 이웃을 미워하여 그를 해치려고 매복했다가 일어나 그를 쳐서 죽게 한 뒤, 이 성읍들 가운데 하나로 도망하면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘그의 생명/혼을 쳤다’는 뜻으로, 치명적인 타격을 가했다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 또 만일
  lexicon: HALOT
  rationale: 앞절과 대조되는 법 조항의 전환을 살리기 위해 ‘그러나’로 시작하고, 조건문은 ‘만일’로 옮겼습니다.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  english_pob_choice: who hates his neighbor
  chosen_korean: 자기 이웃을 미워하여
  alternatives_korean:
  - 자기 이웃을 미워하는
  - 자기 동료를 미워하여
  lexicon: HALOT
  rationale: רֵעַ의 법적·관계적 의미를 ‘이웃’으로 옮기고, 동작의 결과를 이어 주는 한국어 문장 흐름에 맞게 처리했습니다.
- source_word: וְאָרַב לוֹ וְקָם עָלָיו
  english_pob_choice: and lies in wait for him, and rises up against him
  chosen_korean: 그를 해치려고 매복했다가 일어나
  alternatives_korean:
  - 그를 기다렸다가 공격하고
  - 그를 습격하려고 일어나
  lexicon: HALOT
  rationale: אָרַב은 의도적 매복을, קָם עָלָיו는 적대적 행동 개시를 가리키므로 ‘매복했다가 일어나’로 이어서 살렸습니다.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  english_pob_choice: and strikes him so that he dies
  chosen_korean: 그를 쳐서 죽게 한 뒤
  alternatives_korean:
  - 그를 쳐서 치명상을 입혀 죽게 한 뒤
  - 그를 쳐서 죽이게 한 뒤
  lexicon: HALOT
  rationale: נֶפֶשׁ을 한국어 본문에서는 과도하게 해석하지 않고, POB의 주석이 지적한 ‘치명적 타격’의 결과를 자연스럽게 ‘죽게 한 뒤’로 나타냈습니다.
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  english_pob_choice: to one of these cities
  chosen_korean: 이 성읍들 가운데 하나로 도망하면
  alternatives_korean:
  - 이 성읍들 가운데 하나로 피하면
  - 이 성읍들 중 하나로 달아나면
  lexicon: HALOT
  rationale: 문맥상 도피성으로 향하는 도주를 분명히 하되, 원문의 ‘도시들’은 관용적으로 ‘성읍들’로 옮겼습니다.
theological_decisions:
- issue: 살인 의도의 점층적 서술 보존
  chosen_reading: ‘미워하여 … 매복했다가 … 일어나 … 쳐서 죽게 한 뒤’로 원문의 행위 연쇄를 그대로 살렸습니다.
  alternative_readings:
  - ‘그를 살해하고’처럼 하나의 판정어로 압축하는 번역
  rationale: 히브리어는 단일 판정어보다 의도적 폭력의 단계들을 나열하므로, 법문체의 긴장과 책임의 축적을 보존하는 쪽이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: '법문 해석: 원문의 명시적 행위 연쇄를 유지하여 해석을 과잉 압축하지 않음.'
