base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
  footnotes:
  - marker: a
    text: Or 'the rest' or 'those who are left.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like this evil thing,' that is, an evil act of this kind.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew singular, addressing Israel as a corporate whole: ''in your midst.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 남은 자들은 듣고 두려워하여, 다시는 너희 가운데에서 이와 같은 악한 일을 하지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘남은 자들’ 또는 ‘남아 있는 사람들’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이 악한 일과 같이’이며, 곧 이런 종류의 악한 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 이스라엘을 집단적으로 부르는 2인칭 남성 단수 형태로, ‘너희 가운데에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  english_pob_choice: those who remain
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남아 있는 사람들
  - 나머지 사람들
  - 남은 이들
  lexicon: HALOT
  rationale: 재판적 경고 문맥에서 남겨진 사람들을 가리키므로, 자연스럽고 성경적 어휘인 '남은 자들'로 옮겼습니다.
- source_word: יִשְׁמְעוּ
  english_pob_choice: shall hear
  chosen_korean: 듣고
  alternatives_korean:
  - 들을 것이며
  - 듣게 될 것이며
  - 들어서
  lexicon: HALOT
  rationale: 원문의 기본 의미는 '듣다'이므로, 사전적 확장 없이 간결하게 '듣고'로 옮겼습니다.
- source_word: וְיִרָאוּ
  english_pob_choice: and fear
  chosen_korean: 두려워하며
  alternatives_korean:
  - 두려워하고
  - 경외하며
  - 무서워하며
  lexicon: HALOT
  rationale: 여기서는 처벌의 억제 효과를 나타내는 두려움이므로, 문맥상 자연한 '두려워하며'를 선택했습니다.
- source_word: בְּקִרְבֶּךָ
  english_pob_choice: in your midst
  chosen_korean: 너희 가운데에서
  alternatives_korean:
  - 너희 가운데
  - 너희 중에
  - 너희 한가운데에서
  lexicon: HALOT
  rationale: 히브리어 2인칭 단수의 공동체적 주소를 한국어에서는 자연스럽게 복수적 공동체 표현인 '너희 가운데에서'로 풀어, 공동체 내부라는 뜻을 살렸습니다.
theological_decisions:
- issue: 공동체를 향한 단수 주소의 한국어 처리
  chosen_reading: 히브리어 단수 어미를 직역적으로 표시하지 않고, 한국어의 자연스러운 공동체 خطاب인 '너희'로 옮겼습니다.
  alternative_readings:
  - '''네 가운데에서''처럼 단수형을 유지하는 번역'
  - '''너희 가운데''로 완전히 풀어 쓰는 번역'
  rationale: 한국어에서는 이스라엘을 집단적 단수로 부르는 표현을 그대로 살리면 어색해질 수 있으므로, 본문의 공동체적 경고 기능을 유지하는 방향으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy #4 and #5'
