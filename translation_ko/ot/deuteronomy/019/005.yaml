  to: 그러나 어떤 사람이 자기 이웃과 함께 나무를 베려고 숲에 들어가, 도끼를 휘둘러 나무를 베다가 도끼날이 자루에서 빠져 나와[a] 그의 이웃을 맞혀 그 이웃이 죽으면, 그 사람은 이 성읍들 가운데 하나로 도망하여 살 수 있습니다.
