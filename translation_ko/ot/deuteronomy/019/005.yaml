  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
  footnotes:
  - marker: a
    text: Literally, 'the iron slips off from the wood.' Here 'the iron' refers to the axe-head, and 'the wood' refers to the wooden handle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사람이 자기 이웃과 함께 나무를 베려고 숲으로 들어갔다가, 그의 손이 도끼를 휘둘러 나무를 찍는데, 쇠날이 자루에서 빠져 나가 그의 이웃을 맞혀 그가 죽게 되면, 그는 이 성읍들 가운데 하나로 도망하여 살 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손이 도끼로 나무를 자른다’는 식의 표현이며, 여기서 사건의 초점은 우발적 사고입니다.
    reason: source_note
lexical_decisions:
- source_word: וַאֲשֶׁר
  english_pob_choice: But if
  chosen_korean: 그러나 …되면
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 사례법적 조건문이므로 단순 연결보다 예외적 상황을 여는 전환을 살려 ‘그러나 …되면’으로 옮겼습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 그의 친구
  - 그의 동료
  lexicon: HALOT
  rationale: 법문맥에서 רֵעַ는 친한 친구보다 사회적·공동체적 ‘이웃/동포’의 뜻이 강하므로 ‘자기 이웃’이 적절합니다.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  english_pob_choice: the iron head slips from the handle
  chosen_korean: 쇠날이 자루에서 빠져 나가
  alternatives_korean:
  - 쇠가 자루에서 떨어져 나가
  - 철머리가 자루에서 미끄러져
  lexicon: HALOT
  rationale: הַבַּרְזֶל은 재질이 아니라 도끼의 쇠날/도끼날을 가리키고, מִן הָעֵץ는 여기서 나무 자루를 뜻하므로 사건의 핵심인 ‘자루에서 빠짐’을 분명히 했습니다.
- source_word: אֶל אַחַת הֶעָרִים הָאֵלֶּה
  english_pob_choice: to one of these cities
  chosen_korean: 이 성읍들 가운데 하나로
  alternatives_korean:
  - 이 도시들 가운데 하나로
  - 이 성읍들 중 하나로
  lexicon: HALOT
  rationale: 문맥상 앞서 언급된 도피성들을 가리키므로 ‘이 성읍들 가운데 하나로’가 지시성을 자연스럽게 살립니다.
theological_decisions:
- issue: 도피성 규정의 결과 표현
  chosen_reading: ‘도망하여 살 수 있습니다’로 옮겨, 도피 자체가 무죄 선언이 아니라 생명을 보전하는 보호 조치임을 드러냈습니다.
  alternative_readings:
  - ‘피하여 살 수 있습니다’
  - ‘달아나서 살 것입니다’
  rationale: 히브리어 וָחָי 는 단순 생존 결과를 가리키므로, 법적 보호의 목적을 드러내되 과도한 신학적 해석은 넣지 않았습니다.
  doctrine_reference: 신 19장 도피성 규정
