    issue: ‘나무를 찍는데’ 및 죽은 사람의 지시 대상
    rationale: כרת는 여기서 나무를 베어 넘어뜨리는 행위이므로 ‘나무를 베다가’가 더 자연스럽습니다. 또한 ‘그 이웃이 죽으면’으로 사망자가 이웃임을 명시하면 한국어 문장의 모호성이 사라집니다.
