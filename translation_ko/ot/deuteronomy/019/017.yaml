translation:
  language: ko
  text: 그러면 다툼이 있는 두 사람이 야훼 앞, 곧 그 때에 직무를 맡고 있는 제사장들과 재판관들 앞에 서야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘다툼이 있는’이며, 또한 ‘사건이 있는’ 또는 ‘서로 다투는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 때에 직무를 맡고 있는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  english_pob_choice: then ... shall stand
  chosen_korean: 서야 합니다
  alternatives_korean:
  - 서야 한다
  - 서야 합니다
  lexicon: HALOT
  rationale: 법정 절차의 다음 단계라는 점을 살리면서, 현대 한국어에서 자연스러운 의무 표현으로 옮겼습니다.
- source_word: שְׁנֵי הָאֲנָשִׁים
  english_pob_choice: the two men
  chosen_korean: 두 사람
  alternatives_korean:
  - 두 남자
  - 두 사람들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형이지만, 한국어에서는 법적 당사자를 성별보다 역할로 드러내는 것이 자연스러워 ‘두 사람’으로 옮겼습니다.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  english_pob_choice: who have the dispute
  chosen_korean: 다툼이 있는
  alternatives_korean:
  - 분쟁이 있는
  - 그들에게 다툼이 있는
  - 사건이 있는
  lexicon: HALOT
  rationale: רִיב의 기본 의미인 분쟁/다툼을 살리되, 한국어 법률문맥에서 무리하지 않도록 간결하게 표현했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼 앞에
  - 여호와 앞
  lexicon: HALOT
  rationale: 이 절의 יְהוָה는 고유한 언약 이름이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, ‘앞’으로 심판/출석의 문맥을 보존했습니다.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  english_pob_choice: before the priests and the judges
  chosen_korean: 제사장들과 재판관들 앞
  alternatives_korean:
  - 제사장들과 재판장들 앞
  - 제사장들과 재판관들 앞에
  lexicon: HALOT
  rationale: כֹּהֲנִים은 ‘제사장들’이 정착된 표현이고, שֹׁפְטִים는 법적 판결 기능을 분명히 하는 ‘재판관들’이 더 직접적입니다.
- source_word: אֲשֶׁר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם
  english_pob_choice: who are in office in those days
  chosen_korean: 그 때에 직무를 맡고 있는
  alternatives_korean:
  - 그 날들에 있는
  - 그 때에 그 자리에 있는
  - 그 때에 직무에 있는
  lexicon: HALOT
  rationale: 직역적 ‘있다’보다, 당시의 공식 직분 수행을 드러내는 한국어 표현이 더 정확하고 자연스럽습니다.
theological_decisions:
- issue: יהוה의 표기와 재판 절차의 종교적 위치
  chosen_reading: ‘야훼 앞’은 단순 장소가 아니라 언약 주권자 앞에서의 공적 재판 절차를 뜻하는 것으로 보았습니다.
  alternative_readings:
  - ‘야훼 앞에’의 단순 공간적 의미
  - ‘주님 앞’으로 완화한 읽기
  rationale: 문맥은 제사장과 재판관이 함께 서는 공적 심리이며, 하나님의 이름을 유지해야 절차의 신학적 무게가 살아납니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
