    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 문맥으로부터의 결론을 나타내는 접속 부사로, 합쇼체 문장에서 자연스럽고 간결하게 인과·결론 관계를 드러냅니다.
- source_word: מְצַוְּךָ
  english_pob_choice: am commanding you
  chosen_korean: 내가 너에게 명령하여
  alternatives_korean:
  - 내가 너를 명령하여
  - 내가 너에게 명령합니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 현재적·지속적 명령 뉘앙스를 살리기 위해 ‘명령하여’로 옮기고, 직접 화법의 생동감을 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하여
  - 이르러
  lexicon: HALOT
  rationale: 법률 문맥의 인용 도입 표현을 한국어의 자연스러운 동사로 풀어, 문장 구조를 과도하게 딱딱하게 만들지 않으면서도 원문의 연결을 보존했습니다.
- source_word: תַּבְדִּיל
  english_pob_choice: shall set apart
  chosen_korean: 따로 구별하여 두어야 합니다
  alternatives_korean:
  - 세워 두어야 합니다
  - 따로 지정하여야 합니다
  lexicon: HALOT
  rationale: בדל의 기본 의미인 ‘나누다/분리하다’를 살리면서, 이 문맥에서의 공적 지정과 분리의 두 층위를 함께 반영했습니다.
- source_word: לָךְ
  english_pob_choice: for yourself
  chosen_korean: 너를 위해
  alternatives_korean:
  - 스스로를 위해
  - 너 자신을 위해
  lexicon: HALOT
  rationale: 히브리어의 목적·수혜 뉘앙스를 한국어에서 자연스럽게 전달하되, 명령의 수혜자가 청자 공동체임을 과도하게 개인화하지 않도록 했습니다.
theological_decisions:
- issue: 히브리어 단수 2인칭의 공동체적 호칭
  chosen_reading: 본문의 형식을 따라 단수 ‘너’를 유지했습니다.
  alternative_readings:
  - ‘너희’로 공동체를 드러내기
  - 무인칭 표현으로 바꾸기
  rationale: 언약 율법의 수사학적 단수 호칭을 보존해 원문 형식을 살리고, 독자가 공동체적 적용은 문맥에서 읽도록 했습니다.
  doctrine_reference: '번역 원칙: 원문 형식 보존 및 문맥 기반 해석'
