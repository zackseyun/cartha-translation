  terminology: נפש는 ‘생명’으로 유지하는 것이 적절합니다. 각주 b는 생명 표현을 설명하지만 초안에서는 절 끝의 ‘발’ 뒤에 붙어 있어, 설명 대상인 ‘생명’ 바로 뒤로 옮겨야 합니다. 각주 a는 첫 절에 붙입니다.
