  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
  footnotes:
  - marker: a
    text: Or 'shall not spare' or 'shall not show compassion.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'life for life'; נֶפֶשׁ here refers to life, not specifically 'soul' in a later theological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 눈은 긍휼히 여겨서는 안 됩니다.[a] 생명은 생명으로[b], 눈은 눈으로, 이는 이로, 손은 손으로, 발은 발로 갚아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아끼지 말아야 합니다’ 또는 ‘긍휼을 베풀어서는 안 됩니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘생명은 생명으로’. 여기서 נֶפֶשׁ는 후대의 신학적 의미의 ‘영혼’이 아니라 ‘생명’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָח֖וֹס עֵינֶ֑ךָ
  english_pob_choice: Your eye shall not pity
  chosen_korean: 당신의 눈은 긍휼을 베풀어서는 안 됩니다
  alternatives_korean:
  - 당신의 눈은 불쌍히 여기지 말아야 합니다
  - 당신은 아끼지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’이 주어가 되는 관용구로 자비/유감을 뜻하는 חוס를 씁니다. 직역의 이미지와 법조문의 단호함을 살리되, 한국어에서는 자연스러운 합쇼체 법문으로 옮겼습니다.
- source_word: נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ
  english_pob_choice: life for life
  chosen_korean: 생명은 생명으로
  alternatives_korean:
  - 목숨은 목숨으로
  - 영혼은 영혼으로
  lexicon: HALOT
  rationale: 이 구절의 נֶפֶשׁ는 후대의 신학적 ‘영혼’보다 ‘생명/목숨’의 의미입니다. POB의 판단을 따라 사법적 보응의 등가성을 분명히 드러내는 ‘생명’을 택했습니다.
- source_word: עַ֤יִן ... שֵׁ֣ן ... יָ֥ד ... רֶ֥גֶל
  english_pob_choice: eye ... tooth ... hand ... foot
  chosen_korean: 눈 ... 이빨 ... 손 ... 발
  alternatives_korean:
  - 눈 ... 이를 ... 손 ... 발
  - 안 ... 치아 ... 손 ... 다리
  lexicon: HALOT
  rationale: 열거되는 신체 부위는 문자 그대로의 법정 공식이므로 그대로 옮겼습니다. ‘שֵׁן’은 일반 한국어 법문에서는 ‘이빨’이 더 직접적이어서 선택했습니다.
theological_decisions:
- issue: 레퀴스 탈리오니스(동해 보응) 공식을 일반 원칙으로 완화할지 여부
  chosen_reading: '구체적인 법문 형식을 그대로 유지했습니다: ‘생명은 생명으로, 눈은 눈으로…’'
  alternative_readings:
  - ‘범죄에 상응하는 처벌’처럼 일반화하기
  - ‘보복은 비례해야 합니다’로 풀어쓰기
  rationale: 히브리어 본문은 고정된 사법 공식으로 제시하므로, 이를 추상적 원리로 바꾸면 본문의 수사와 토라 내 상호연결이 약해집니다. 따라서 긴장과 직설성을 보존했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 본문이 지닌 법적·문학적 형식을 보존'
