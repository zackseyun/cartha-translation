translation:
  language: ko
  text: 그가 그의 형제에게 하려고 꾀한 것 그대로 그에게 행하십시오. 그러면 너희 가운데서 악을 제거하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָח(‘형제’)는 이 법적 문맥에서 언약 공동체의 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  english_pob_choice: you shall do
  chosen_korean: 행하십시오
  alternatives_korean:
  - 하시게 됩니다
  - 해야 합니다
  lexicon: HALOT
  rationale: 법정·공동체적 명령의 힘을 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞췄습니다.
- source_word: כַּאֲשֶׁר זָמַם לַעֲשׂוֹת
  english_pob_choice: just as he intended to do
  chosen_korean: 하려고 꾀한 것 그대로
  alternatives_korean:
  - 하려고 의도한 것 그대로
  - 하려고 계획한 것 그대로
  lexicon: HALOT
  rationale: זָמַם은 단순한 계획보다 해칠 의도를 품은 ‘꾀함’의 뉘앙스를 담을 수 있어, 보복의 대응성도 드러나게 했습니다.
- source_word: לְאָחִיו
  english_pob_choice: to his brother
  chosen_korean: 그의 형제에게
  alternatives_korean:
  - 그의 동족에게
  - 그의 동료에게
  lexicon: HALOT
  rationale: 직역형인 ‘형제’가 원문의 אָח를 가장 직접적으로 살리며, 문맥상 언약 공동체의 동료를 가리키는 넓은 의미는 본문을 흐리지 않는 범위에서 유지됩니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: So you shall purge the evil from your midst
  chosen_korean: 그러면 너희 가운데서 악을 제거하실 것입니다
  alternatives_korean:
  - 그러면 너희 가운데서 악을 없애십시오
  - 그러면 너희 가운데서 악을 씻어내십시오
  lexicon: HALOT
  rationale: Deuteronomistic formula인 ביעור를 ‘제거하다’로 옮겨 공동체에서 악을 몰아내는 법적·언약적 의미를 살렸습니다.
theological_decisions:
- issue: 문장 주체와 명령형의 한국어 처리
  chosen_reading: 첫 절은 공동체에 대한 명령형으로, 둘째 절은 결과 절로 처리했습니다.
  alternative_readings:
  - 두 절을 모두 평서문으로 처리
  - 둘째 절도 명령형으로 처리
  rationale: 히브리어 법문체의 명령과 결과 구조를 한국어에서 자연스럽게 보존하기 위해, 앞절은 직접 명령으로, 뒷절은 그에 따른 결과 진술로 옮겼습니다.
  doctrine_reference: Deuteronomy legal discourse; covenant-community discipline
