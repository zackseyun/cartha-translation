revisions:
- from: 만일 여러분이 이 모든 계명을 지켜 행하고, 내가 오늘 여러분에게 명하는 그것을—곧 야훼 여러분의 하나님을 사랑하고 그의 길로 모든 날을 걷는 것을—하면, 여러분은 이 셋에 더하여 또 세 성읍을 더할 것입니다.[a]
  to: 만일 여러분이 오늘 내가 여러분에게 명하는 이 모든 계명[a]을 지켜 행하고, 야훼 여러분의 하나님을 사랑하며 평생토록 그의 길을 따라 걸으면, 이 셋 외에 세 성읍을 더할 것입니다.
  rationale: 수식 관계를 한국어 조건절 안에서 명료하게 재구성했습니다. ‘지켜 행하고’와 사랑하고 걷는 행위를 함께 조건으로 제시하여, 계명을 실제로 준수하는 내용이라는 원문의 흐름을 보존했습니다. ‘그의 길을 따라 걸으며’는 원문의 ‘걷다’ 비유를 유지하고, ‘평생토록’은 ‘모든 날’을 자연스럽게 반영합니다. ‘이 셋 외에 세 성읍’을 사용하여 기존 세 성읍에 추가한다는 뜻을 간결하게 옮겼습니다.
