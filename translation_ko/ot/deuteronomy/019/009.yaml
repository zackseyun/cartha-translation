translation:
  language: ko
  text: 만일 여러분이 오늘 내가 여러분에게 명하는 이 모든 계명[a]을 지켜 행하고, 야훼 여러분의 하나님을 사랑하며 평생토록 그의 길을 따라 걸으면, 이 셋 외에 세 성읍을 더할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이 모든 계명’에서 ‘계명’을 단수로 씁니다. 한국어 번역도 단수형 ‘계명’으로 이를 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמֹר
  english_pob_choice: you keep
  chosen_korean: 지켜
  alternatives_korean:
  - 지키고
  - 준수하여
  lexicon: HALOT
  rationale: 계명과 언약 관계에서 שׁמר는 단순한 인지가 아니라 실제 준수를 뜻하므로, 한국어로는 ‘지켜’가 가장 자연스럽고 직접적입니다.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  english_pob_choice: all this commandment
  chosen_korean: 이 모든 계명
  alternatives_korean:
  - 이 모든 명령
  - 이 온 계명
  lexicon: HALOT
  rationale: 히브리어는 단수형 ‘계명’이므로 복수화하지 않고, כָּל의 포괄성을 살려 ‘이 모든 계명’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 대체 호칭이 아니라 고유명으로 처리해야 하므로, 프로젝트 기본어에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  english_pob_choice: and to walk in his ways
  chosen_korean: 그의 길로 ... 걷는 것을
  alternatives_korean:
  - 그의 길로 걷는 것을
  - 그의 길을 따라 행하는 것을
  lexicon: HALOT
  rationale: ‘걷다’의 비유를 유지해 언약적 삶의 지속성을 살렸고, ‘그의 길로’는 בְּדְרָכָיו의 방향성을 자연스럽게 드러냅니다.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  english_pob_choice: then you shall add for yourself three more cities
  chosen_korean: 여러분은 ... 또 세 성읍을 더할 것입니다
  alternatives_korean:
  - 여러분은 ... 세 성읍을 더할 것입니다
  - 여러분은 ... 세 성읍을 추가할 것입니다
  lexicon: HALOT
  rationale: יָסַף는 ‘더하다/추가하다’의 뜻이므로, 한국어에서는 ‘더할 것입니다’가 가장 सीधे하고 문맥에 맞습니다.
theological_decisions:
- issue: 여호와/야훼의 한국어 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고, 전통적 대체어 ‘주’는 쓰지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님의 이름을 직접 포함하므로, 독자가 언약적 고유명을 인식하도록 대체 번역을 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
