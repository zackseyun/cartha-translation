source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
  footnotes:
  - marker: a
    text: Or 'every killer'; the Hebrew term here is broader than 'murderer' in this cities-of-refuge context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it shall be for fleeing there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자신을 위해 길을 준비하고, 당신의 하나님 야훼께서 당신에게 기업으로 주시는 땅의 경계를 세 부분으로 나누십시오. 그러면 피신할 곳으로 모든 살해자가 그리로 도망할 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살해자’는 이 도피성 문맥에서 ‘살인자’보다 넓은 범주의 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “거기서 도망하기 위한 것이 되게 하십시오”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  english_pob_choice: you shall prepare the road for yourself
  chosen_korean: 자신을 위해 길을 준비하고
  alternatives_korean:
  - 길을 마련하고
  - 도로를 준비하고
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘준비하다’와 도로/통행로의 실제적 의미를 살려, 법적·지리적 맥락에 맞게 자연스럽게 옮겼습니다.
- source_word: וְשִׁלַּשְׁתָּ אֶת גְּבוּל אַרְצְךָ
  english_pob_choice: you shall divide into three parts the territory of your land
  chosen_korean: 당신의 ... 땅의 경계를 세 부분으로 나누십시오
  alternatives_korean:
  - 당신 땅의 지역을 세 부분으로 나누십시오
  - 당신의 땅의 경계를 삼등분하십시오
  lexicon: HALOT
  rationale: שִׁלַּשְׁתָּ의 ‘셋으로 나누다’라는 뜻을 분명히 드러내되, גְּבוּל을 단순한 선보다 ‘경계/영역’의 넓은 의미로 받아 문맥에 맞게 처리했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 당신의 하나님 여호와
  - 당신의 하나님
  lexicon: 고유명사/성호
  rationale: 본문의 신명기적 언약 명칭을 따라 신명 יְהוָה를 ‘야훼’로 일관되게 옮기고, אֱלֹהֶיךָ는 관계를 살려 ‘당신의 하나님’으로 번역했습니다.
- source_word: כָּל רֹצֵחַ
  english_pob_choice: every manslayer
  chosen_korean: 모든 살해자
  alternatives_korean:
  - 모든 살인자
  - 모든 사람을 죽인 자
  - 모든 살해한 자
  lexicon: HALOT
  rationale: 이 장의 도피성 규정에서 רֹצֵחַ는 의도적 살인자보다 더 넓은 범주의 ‘죽인 자’를 가리킬 수 있으므로, 죄책을 미리 확정하지 않는 표현을 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 YHWH를 음역하여 언약적 고유명을 보존하는 편이 원문 감각을 더 잘 드러내며, 본 절의 법적 지시문에서도 신명 고유명을 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רֹצֵחַ의 범위
  chosen_reading: 모든 살해자
  alternative_readings:
  - 모든 살인자
  - 모든 살인한 자
  rationale: 도피성 문맥상 이 단어를 곧바로 ‘살인자’로 한정하면 본문이 아직 밝히지 않은 고의성 판단을 앞서게 됩니다. 따라서 더 넓은 법적 범위를 유지하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
