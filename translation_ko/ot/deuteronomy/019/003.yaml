  source_fidelity: 수정이 필요합니다. וְהָיָה לָנוּס שָׁמָּה의 목적/결과적 표현은 앞선 명령의 목적을 나타내므로, 초안의 서술형 ‘도망할 수 있습니다’보다 ‘피할 수 있게 하십시오’가 적절합니다. 또한 רֹצֵחַ는 이 문맥에서 고의적 살인자로 한정되지 않으므로 ‘사람을 죽인 자’가 ‘살해자’보다 자연스럽고 범위를 보존합니다.
  naturalness: ‘피신할 곳으로 모든 살해자가 그리로 도망할 수 있습니다’는 조사 결합이 부자연스럽고, ‘피신할 곳’과 ‘그리로’가 의미상 중복됩니다. ‘사람을 죽인 자마다 그리로 피할 수 있게 하십시오’로 고치면 현대 한국어 합쇼체의 법률적 지시문으로 자연스럽습니다. ‘자신을 위해 길을 준비하고’는 ‘길을 마련하고’로 다듬는 것이 더 자연스럽습니다.
  terminology: ‘야훼’와 ‘하나님’, ‘기업’은 원문의 신명 및 상속 표현을 적절히 보존합니다. גְּבוּל은 여기서 경계선 자체보다 땅의 공간적 범위이므로 ‘땅의 영역’으로 옮기는 것이 ‘땅의 경계’보다 문맥에 맞습니다.
