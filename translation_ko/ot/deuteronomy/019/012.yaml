  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
  footnotes:
  - marker: a
    text: Or "the blood avenger." The Hebrew phrase גֹּאֵל הַדָּם is a technical legal expression for the person responsible to avenge the shedding of blood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그의 성읍 장로들은 사람을 보내어 그곳에서 그를 데려다가 피의 복수자[a]의 손에 넘길 것이며, 그는 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “피를 갚는 자”. 히브리어 גֹּאֵל הַדָּם은 살해에 대한 피의 보복을 수행할 책임이 있는 사람을 가리키는 기술적 법률 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי עִירוֹ
  english_pob_choice: the elders of his city
  chosen_korean: 그 성읍의 장로들
  alternatives_korean:
  - 그 도시의 장로들
  - 그 성읍의 원로들
  lexicon: HALOT
  rationale: זִקְנֵי는 공동체의 공적 책임을 지는 지도층을 가리키므로 ‘장로들’이 적절하며, עִיר는 여기서 행정적 공동체로서 ‘성읍’이 자연스럽습니다.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  english_pob_choice: take him from there
  chosen_korean: 거기에서 그를 데려다가
  alternatives_korean:
  - 거기에서 그를 데려오고
  - 거기에서 그를 붙들어
  lexicon: HALOT
  rationale: לקח의 기본 의미를 살리되, 이 피신처-소환 문맥에서는 과도한 강제성을 덧붙이지 않도록 ‘데려가다’ 계열로 옮겼습니다.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  english_pob_choice: hand him over to
  chosen_korean: 그를 ...의 손에 넘기고
  alternatives_korean:
  - 그를 ...에게 넘기고
  - 그를 ...의 수중에 넘기고
  lexicon: HALOT
  rationale: בְּיַד은 법적 관용구로서 ‘권한 아래로 넘기다’를 뜻하므로, 한국어에서는 ‘손에 넘기다’가 가장 직접적입니다.
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 피의 복수자
  alternatives_korean:
  - 피의 원수 갚는 자
  - 피를 복수하는 자
  lexicon: HALOT
  rationale: 영어 POB의 주석이 밝히듯 이는 기술적 법률 용어이므로, 전통적 교회어보다 기능을 드러내는 ‘피의 복수자’로 옮겼습니다.
- source_word: וָמֵת
  english_pob_choice: and he shall die
  chosen_korean: 그는 죽습니다
  alternatives_korean:
  - 그는 죽을 것입니다
  - 그리하여 죽습니다
  lexicon: HALOT
  rationale: 히브리어의 결과 진술을 한국어 합쇼체로 간결하게 반영했습니다.
theological_decisions:
- issue: גֹּאֵל הַדָּם의 법적·사회적 성격
  chosen_reading: ‘피의 복수자’로 옮겨, 혈연 책임과 법적 집행 기능을 함께 드러냈습니다.
  alternative_readings:
  - ‘피를 갚는 친족’처럼 친족 관계를 더 분명히 드러내는 번역
  - 전통적 완곡어법인 ‘피를 갚는 자’
  rationale: 본문은 감정적 복수보다 공동체 법질서 안에서의 책임자라는 점이 핵심이므로, 기술적 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: 민수기 35장, 여호수아 20장과의 맥락적 일치
