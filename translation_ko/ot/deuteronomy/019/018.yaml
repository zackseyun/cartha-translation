lexical_decisions:
- source_word: וְ/דָרְשׁ֥וּ ... הֵיטֵ֑ב
  english_pob_choice: And the judges shall investigate thoroughly
  chosen_korean: 재판관들은 철저히 조사할 것입니다
  alternatives_korean:
  - 재판관들은 자세히 조사할 것입니다
