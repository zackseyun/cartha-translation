  lexicon: דָרַשׁ / הֵיטֵב
  rationale: הֵיטֵב의 강도를 살려 단순한 ‘조사’보다 ‘철저히 조사’로 옮겼고, שֹׁפְטִים은 본문 맥락상 재판관으로 옮기는 것이 자연합니다.
- source_word: הַ/שֹּׁפְטִ֖ים
  english_pob_choice: the judges
  chosen_korean: 재판관들은
  alternatives_korean:
