  - 심판자들은
  lexicon: שֹׁפְטִים
  rationale: 법정 문맥의 공적 직무를 드러내기 위해 ‘재판관’으로 옮겼습니다.
- source_word: עֵד שֶׁ֨קֶר֙ ... עָנָ֥ה
  english_pob_choice: a false witness ... has testified falsely
  chosen_korean: 거짓 증인이고 ... 거짓으로 증언한 것이 드러나면
  alternatives_korean:
  - 거짓 증인이고 ... 거짓 증언한 것이 드러나면
  - 거짓 증인이고 ... 거짓으로 증언하였으면
  lexicon: עֵד שֶׁקֶר / עָנָה
  rationale: עֵד שֶׁקֶר의 반복된 강조를 살려 ‘거짓 증인’과 ‘거짓으로 증언하다’를 병기 구조로 옮겼습니다.
- source_word: בְ/אָחִי/ו
  english_pob_choice: against his brother
  chosen_korean: 자기 형제에게
  alternatives_korean:
  - 자기 형제에 대해
  - 자기 동족에게
  lexicon: אָח
  rationale: 히브리어 אָח의 넓은 친족·동족 의미가 있으나, 직역적이면서도 관계성을 유지하는 ‘형제’가 본문 반복과 잘 맞습니다.
theological_decisions:
- issue: 법정 판결 후 거짓 증언의 판정 조건을 어떻게 연결할지
  chosen_reading: ‘그리고 보십시오’ 뒤에 조건문을 자연스럽게 이어, 조사 결과 거짓 증언이 확인되는 상황을 드러냈습니다.
  alternative_readings:
  - ‘보십시오’ 없이 단순히 조건절로 바로 연결
  - ‘그때’로 시간적 연결을 강조
  rationale: 히브리어 וְהִנֵּה는 결과 확인의 전환을 표시하므로, 한국어에서는 ‘그리고 보십시오’로 살려 판정의 발견성을 드러냈습니다.
  doctrine_reference: 문법-담화 전환
