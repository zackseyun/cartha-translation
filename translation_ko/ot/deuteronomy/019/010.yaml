  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 피값/혈죄의 법적 의미
  chosen_reading: 피값이 당신에게 돌아올 것입니다
  alternative_readings:
  - 피의 책임이 당신에게 있을 것입니다
  - 피값이 당신 위에 있을 것입니다
  rationale: 문맥은 단순한 물리적 피가 아니라 살인에 대한 법적 책임을 말하므로, 독자가 형벌적·공동체적 책임을 이해하도록 ‘피값’으로 표기했습니다.
  doctrine_reference: Deuteronomy 19:10 homicide asylum law
