  source_fidelity: 개정이 필요합니다. 초안의 ‘그렇게 하면 피값이 당신에게 돌아올 것입니다’는 앞 절이 실현될 경우 혈죄가 발생한다는 조건·결과 관계로 읽혀, 무죄한 피가 흘려지는 것과 혈죄를 함께 막고자 하는 히브리어의 목적/예방 취지를 뒤집습니다. דָּמִים은 이 문맥에서 ‘피값’(보상금)보다 살인에 따른 ‘혈죄/피의 책임’을 가리킵니다.
