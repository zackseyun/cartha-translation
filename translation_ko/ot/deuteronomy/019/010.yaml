translation:
  language: ko
  text: 무죄한 피가, 야훼 당신의 하나님이 유산으로 당신에게 주시는 땅 가운데서 흘려지지 않게 하십시오. 그렇게 하면 피값이 당신에게 돌아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘피가 당신 위에 있을 것입니다.’ 히브리어 관용구는 무죄한 피를 흘린 데 대한 법적 책임, 곧 피값을 뜻합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  english_pob_choice: may not be shed
  chosen_korean: 흘려지지 않게 하십시오
  alternatives_korean:
  - 쏟아지지 않게 하십시오
  - 흘리지 않게 하십시오
  lexicon: HALOT
  rationale: 피에 대한 수동적 법률 표현을 한국어로 자연스럽게 옮기되, 결과가 금지되는 의미를 분명히 드러내기 위해 ‘흘려지다’를 썼습니다.
- source_word: דָּם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 무고한 피
  - 죄 없는 피
  - 무죄한 사람의 피
  lexicon: HALOT
  rationale: 히브리어 법률 관용구를 짧고 강하게 살리기 위해 ‘무죄한 피’를 택했습니다. 이는 단순한 설명보다 원문의 압축성을 더 잘 보존합니다.
- source_word: בְּקֶרֶב אַרְצְךָ
  english_pob_choice: in the midst of your land
  chosen_korean: 당신의 땅 가운데서
  alternatives_korean:
  - 당신의 땅 안에서
  - 당신 땅 한가운데서
  lexicon: HALOT
  rationale: ‘가운데’의 공간적 중심성을 살리면서도 한국어 법률문체로 자연스럽게 들리도록 ‘땅 가운데서’로 옮겼습니다.
- source_word: דָּמִים
  english_pob_choice: bloodguilt would be upon you
  chosen_korean: 피값이 당신에게 돌아올 것입니다
  alternatives_korean:
  - 피의 책임이 당신에게 돌아올 것입니다
  - 피값이 당신 위에 있을 것입니다
  lexicon: HALOT
  rationale: 문자적 ‘피들’보다 히브리어 관용구가 뜻하는 법적 책임을 드러내기 위해 ‘피값’으로 옮겼습니다. 다만 ‘upon you’의 부담감은 ‘돌아올 것입니다’로 반영했습니다.
theological_decisions:
