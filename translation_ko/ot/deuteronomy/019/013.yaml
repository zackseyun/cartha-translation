id: DEU.19.13
reference: Deuteronomy 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תָח֥וֹס עֵֽינְ/ךָ֖ עָלָ֑י/ו וּ/בִֽעַרְתָּ֧ דַֽם הַ/נָּקִ֛י מִ/יִּשְׂרָאֵ֖ל וְ/ט֥וֹב לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
  footnotes:
  - marker: a
    text: Or, 'Your eye shall not spare him.' The Hebrew idiom literally mentions the eye as the seat of pity or compassion.
    reason: lexical_alternative
  - marker: b
    text: That is, remove the bloodguilt incurred by the shedding of innocent blood from the community of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 눈이 그를 불쌍히 여기지 못하게 하십시오[a]. 그리하여 무죄한 피를 이스라엘에서 제거하십시오[b]. 그러면 당신에게 잘될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 눈이 그를 아끼지 못하게 하십시오’입니다. 히브리어 관용구는 눈을 연민의 자리로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 무죄한 피를 흘림으로 생긴 피의 책임을 이스라엘 공동체에서 제거하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָח֥וֹס עֵֽינְ/ךָ֖ עָלָ֑י/ו
  english_pob_choice: Your eye shall not pity him
  chosen_korean: 그의 눈이 그를 불쌍히 여기지 못하게 하십시오
  alternatives_korean:
  - 당신의 눈이 그를 불쌍히 여기지 못하게 하십시오
  - 그를 불쌍히 여기지 마십시오
  - 당신의 눈이 그를 아끼지 못하게 하십시오
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’이 자비/연민의 자리라는 관용구를 사용하므로, 본문 이미지와 법정적 엄중함을 살리면서도 한국어로는 ‘불쌍히 여기다’로 자연스럽게 옮겼습니다.
- source_word: וּ/בִֽעַרְתָּ֧
  english_pob_choice: but you shall purge
  chosen_korean: 그리하여 ... 제거하십시오
  alternatives_korean:
  - 그리고 ... 불사르십시오
  - 그리고 ... 없애십시오
  - 그러나 ... 정결하게 하십시오
  lexicon: HALOT
  rationale: 신명기 법문맥에서 בער는 문자적 ‘불태우다’보다 공동체에서 죄책/악을 ‘제거하다, 없애다’는 뜻이므로, ‘제거하십시오’가 POB의 ‘purge’에 가장 가깝습니다.
- source_word: דַֽם הַ/נָּקִ֛י
  english_pob_choice: the innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 무죄한 자의 피
  - 의로운 피
  - 죄 없는 피
  lexicon: HALOT
  rationale: 히브리어는 ‘피가 무죄하다’는 법적 관용을 유지하므로, ‘무죄한 피’가 가장 직접적이며 혈흔 자체와 피흘림에 따른 책임을 함께 드러냅니다.
- source_word: וְ/ט֥וֹב לָֽ/ךְ
  english_pob_choice: and it shall go well with you
  chosen_korean: 그러면 당신에게 잘될 것입니다
  alternatives_korean:
  - 그리하면 당신에게 복될 것입니다
  - 그러면 당신이 잘될 것입니다
  - 그리고 당신에게 유익할 것입니다
  lexicon: HALOT
  rationale: 신명기적 언약 공식의 결과 구문을 현대 한국어로 자연스럽게 옮기되, 보상보다 순종의 결과를 나타내는 ‘잘될 것입니다’를 유지했습니다.
theological_decisions:
- issue: 여기서의 ‘불쌍히 여기지 않음’의 성격
  chosen_reading: 사적 복수가 아니라, 공동체를 더럽히는 고의적 살인에 대한 공적 사법 집행의 엄중함을 드러냅니다.
  alternative_readings:
  - 개인이 원한을 품고 잔혹함을 정당화하는 명령으로 오해될 수 있습니다.
  rationale: 문맥상(19:11–12) 이 명령은 도피 성읍 규정 뒤에 이어지는 재판 절차와 연결되므로, 번역은 사적 보복이 아니라 법적 책임의 집행으로 읽히게 해야 합니다.
  doctrine_reference: 신명기 19:11-13의 재판·공동체 정결 문맥
- issue: ‘무죄한 피를 ... 제거하십시오’의 의미
  chosen_reading: 피 자체를 물리적으로 치운다는 뜻이 아니라, 이스라엘 공동체에 남은 피의 책임과 혈죄를 제거하라는 뜻으로 읽습니다.
  alternative_readings:
  - 문자적으로 피를 치우라는 의미로 오해될 수 있습니다.
  rationale: POB의 주석처럼 ‘피를 제거한다’는 표현은 공동체에 부과된 혈죄를 없애는 언약적·법적 표현이므로, 한국어도 그 의미를 드러내야 합니다.
  doctrine_reference: 공동체 정결과 혈죄 개념
