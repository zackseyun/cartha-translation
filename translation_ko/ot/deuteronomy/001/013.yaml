source:
  edition: WLC
  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
  footnotes:
  - marker: a
    text: Or 'known' or 'recognized'; the Hebrew may emphasize men of established reputation among the tribes.
    reason: lexical_alternative
  - marker: b
    text: Or 'leaders.' Literally 'heads.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분 자신을 위해 지혜롭고 분별력이 있으며 잘 알려진[a] 남자들을 여러분의 지파들 가운데서 뽑으십시오. 내가 그들을 여러분의 우두머리[b]로 세우겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알려진’, ‘인정받는’으로 옮길 수 있습니다. 히브리어는 지파들 가운데서 알려져 있거나 인정받는 사람이라는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘머리들’입니다. 곧 ‘우두머리들’ 또는 ‘지도자들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  english_pob_choice: Choose
  chosen_korean: 뽑으십시오
  alternatives_korean:
  - 선택하십시오
  - 가져오십시오
  lexicon: HALOT
  rationale: 문맥상 후보를 선발하라는 뜻이므로, 단순한 ‘가져오다’보다 선출 의미를 분명히 하는 동사로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 여러분을 위해
  alternatives_korean:
  - 여러분 자신을 위해
  - 여러분에게
  lexicon: HALOT
  rationale: 선택의 책임이 공동체 자신에게 있다는 반사적 뉘앙스를 살리되, 한국어에서는 자연스럽게 ‘여러분을 위해’로 표현했습니다.
- source_word: וִידֻעִים
  english_pob_choice: well-known
  chosen_korean: 잘 알려진
  alternatives_korean:
  - 알려진
  - 인지된
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘앎’보다 공동체 안에서의 공적 인지도와 평판을 가리키므로, 이를 드러내는 표현을 택했습니다.
- source_word: בְּרָאשֵׁיכֶם
  english_pob_choice: as your heads
  chosen_korean: 여러분의 우두머리로
  alternatives_korean:
  - 여러분의 머리로
  - 여러분의 지도자로
  lexicon: HALOT
  rationale: 히브리어의 ‘머리들’은 지도자 비유이므로, 한국어에서는 오해 없이 기능을 전달하는 ‘우두머리’로 옮겼습니다.
theological_decisions:
- issue: 남성 복수 명사 אֲנָשִׁים의 성별 표지
  chosen_reading: ‘남자들’로 명시하지는 않았지만, 이어지는 문맥이 지파의 대표로 세워질 남성 지도자를 전제하므로 ‘남자들’보다 직무 중심의 ‘지혜롭고 분별력 있으며 잘 알려진 사람들’로 옮기지 않고, source의 남성성을 유지한 ‘남자들’을 사용했습니다.
  alternative_readings:
  - 사람들
  - 지도자들
  rationale: 히브리어가 명시적으로 남성 복수를 사용하므로 성별 표지를 지우지 않는 것이 원문에 더 충실합니다. 다만 한국어 가독성을 위해 뒤의 직무 표현은 자연스럽게 조정했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
