  terminology: ‘우두머리’는 רָאשֵׁי의 지도자 비유를 적절히 전달합니다. ‘잘 알려진’은 וִידֻעִים의 가능한 의미를 보존하며, 각주에서 ‘인정받는’이라는 대안을 제시하는 것이 더 자연스럽습니다.
