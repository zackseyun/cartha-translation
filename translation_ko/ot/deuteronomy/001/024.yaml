  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
  footnotes:
  - marker: a
    text: Or “the Wadi of Eshcol” or “the Brook of Eshcol”; the Hebrew term can denote a valley with a seasonal watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 방향을 돌려 산지로 올라가 에스골 골짜기[a]까지 이르러 그 땅을 정탐하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 나할(נַחַל)은 ‘골짜기’ 외에 계절에 따라 물이 흐르는 물길을 가리킬 수도 있으므로, ‘에스골 와디’ 또는 ‘에스골 시내’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יִּפְנוּ
  english_pob_choice: they turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌았습니다
  - 방향을 틀었습니다
  lexicon: HALOT
  rationale: פנה의 서술적 연속 동작을 자연스럽게 살려, 이동의 전환을 나타내는 ‘돌아서서’로 옮겼습니다.
- source_word: וַ/יַּעֲלוּ הָ/הָרָ/ה
  english_pob_choice: went up into the hill country
  chosen_korean: 산지로 올라가
  alternatives_korean:
  - 산으로 올라가
  - 산지로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 상향 이동을 ‘올라가’로 살리고, הָהָרָה의 방향성을 한국어의 ‘산지로’로 압축했습니다.
- source_word: נַ֣חַל אֶשְׁכֹּ֑ל
  english_pob_choice: the Valley of Eshcol
  chosen_korean: 에스골 골짜기
  alternatives_korean:
  - 에스골 와디
  - 에스골 시내
  lexicon: HALOT
  rationale: נחל의 지형 감각을 유지하되, 현대 한국어 성경 문맥에서 자연스러운 지명 표현인 ‘골짜기’를 기본으로 택했습니다.
- source_word: וַֽ/יְרַגְּל֖וּ אֹתָֽ/הּ
  english_pob_choice: and spied it out
  chosen_korean: 그것을 정탐하였습니다
  alternatives_korean:
  - 그것을 살펴보았습니다
  - 그곳을 정찰하였습니다
  lexicon: HALOT
  rationale: רגל의 정탐/정찰 의미를 살려 단순한 관찰보다 군사·첩보적 뉘앙스가 드러나는 ‘정탐하다’를 선택했습니다.
