  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
  footnotes:
  - marker: a
    text: Or “the Wadi of Eshcol” or “the Brook of Eshcol”; the Hebrew term can denote a valley with a seasonal watercourse.
