  source_fidelity: 본문의 이동·상승·도착·정탐의 순서는 대체로 충실합니다. 그러나 ‘그것’은 바로 앞의 ‘에스골 골짜기’를 가리키는 것으로 읽히기 쉬운 반면, 히브리어 여성 단수 목적어는 문맥상 정탐 대상인 그 땅/지역을 가리킵니다. 이를 명시하는 편이 안전합니다.
  naturalness: 합쇼체와 문장 흐름은 자연스럽습니다. 다만 ‘방향을 돌려’와 ‘그 땅을’은 지시 대상과 이동의 전환을 더 분명하고 자연스럽게 드러냅니다.
