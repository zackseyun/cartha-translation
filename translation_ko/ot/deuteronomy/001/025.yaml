base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
  footnotes:
  - marker: a
    text: Or 'they reported to us'; literally, 'they brought us back word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 손에 그 땅의 열매를 얼마쯤 가지고 우리에게로 내리고, 우리에게 말을 가져와서 이렇게 말했습니다. 「야훼 우리 하나님이 우리에게 주고 계신 그 땅은 좋습니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 우리에게 보고했다’; 문자적으로는 ‘우리에게 말을 가져왔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם מִפְּרִי הָאָרֶץ
  english_pob_choice: they took in their hands some of the fruit of the land
  chosen_korean: 손에 그 땅의 열매를 얼마쯤 가지고
  alternatives_korean:
  - 그 땅의 열매를 손에 들고
  - 그 땅의 열매 몇 가지를 손에 가지고
  lexicon: HALOT
  rationale: לקח과 בְיָדָם의 구체성을 살리되, 한국어에서는 ‘가지고’가 자연스럽게 손에 든 상태를 나타내므로 과도하게 직역하지 않았습니다. מִן의 부분성을 반영해 ‘얼마쯤’으로 샘플의 뉘앙스를 살렸습니다.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  english_pob_choice: brought it down to us
  chosen_korean: 우리에게로 내리고
  alternatives_korean:
  - 우리에게로 가져오고
  - 우리에게로 내려오게 하고
  lexicon: HALOT
  rationale: הִפְעִיל 형태의 ‘내리다’라는 방향성을 보존해, 단순한 ‘가져오다’보다 원문의 공간적 뉘앙스를 살렸습니다.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  english_pob_choice: they brought us back word
  chosen_korean: 우리에게 말을 가져와서
  alternatives_korean:
  - 우리에게 보고해서
  - 우리에게 답을 가져와서
  lexicon: HALOT
  rationale: שוב + דָבָר의 관용구를 한국어로 자연스럽게 옮기되, ‘말’로 두어 ‘보고’로 평평하게 만들지 않았습니다. ‘가져와서’는 ‘back’의 회수된 응답이라는 감각을 유지합니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 야훼, 우리의 하나님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼고, 언약적 호칭인 ‘우리 하나님’은 한국어 문장 흐름에 맞게 붙여 썼습니다.
- source_word: נֹתֵן לָנוּ
  english_pob_choice: is giving to us
  chosen_korean: 우리에게 주고 계신
  alternatives_korean:
  - 우리에게 주시는
  - 우리에게 주고 있는
  lexicon: HALOT
  rationale: 현재분사적 지속성을 살리기 위해 진행형 ‘주고 계신’을 택했습니다. English POB가 보존한 ‘is giving to us’의 현재적 수여 감각을 반영합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직역하여 언약 이름의 고유성을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 텔트라그람마톤을 직접 사용하므로, 일반적인 대체어보다 고유 신명 표기를 유지하는 것이 स्रोत 충실성에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
