translation:
  language: ko
  text: 이 악한 세대의 이 사람들 가운데서 한 사람도 내가 너희 조상들에게 주겠다고 맹세한 그 좋은 땅을 보지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘너희 아버지들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאֶה אִישׁ
  english_pob_choice: Not one man ... shall see
  chosen_korean: 한 사람도 ... 보지 못할 것입니다
  alternatives_korean:
  - 한 사람도 ... 볼 수 없을 것입니다
  - 그 누구도 ... 보지 못할 것입니다
  lexicon: HALOT
  rationale: אִם이 맹세적 부정 구문으로 쓰인 점을 반영해 조건문처럼 옮기지 않고, 분배적 표현인 איש을 한국어의 자연스러운 부정 표현인 ‘한 사람도’로 살렸습니다.
- source_word: בָּאֲנָשִׁים הָאֵלֶּה הַדּוֹר הָרָע הַזֶּה
  english_pob_choice: among these men of this evil generation
  chosen_korean: 이 악한 세대의 이 사람들 가운데서
  alternatives_korean:
  - 이 악한 세대 가운데 있는 이 사람들 중
  - 이 악한 세대의 이 사람들 가운데
  lexicon: HALOT
  rationale: בְּ + אֲנָשִׁים은 ‘~가운데서/~중에서’의 부분적 의미이므로 이를 살렸고, הַדּוֹר הָרָע הַזֶּה는 도덕적 평가가 분명한 ‘이 악한 세대’로 옮겼습니다.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  english_pob_choice: the good land
  chosen_korean: 그 좋은 땅
  alternatives_korean:
  - 좋은 땅
  - 그 아름다운 땅
  lexicon: HALOT
  rationale: הָאָרֶץ הַטּוֹבָה는 약속의 땅을 가리키는 직접적 표현이므로, ‘좋은’의 의미를 유지하면서 지시어를 붙여 문맥상 대상이 분명하게 드러나도록 했습니다.
- source_word: לַאֲבֹתֵיכֶם
  english_pob_choice: to your fathers / to your ancestors
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 문맥상 족장들을 가리키므로 한국어에서는 관용적이면서도 원문 의미를 해치지 않는 ‘조상들’을 택했습니다.
theological_decisions:
- issue: ‘fathers’의 번역에서 성별 표지 유지와 문맥적 자연스러움의 균형
  chosen_reading: 너희 조상들에게
  alternative_readings:
  - 너희 아버지들에게
  - 너희 선조들에게
  rationale: 원문은 남성 복수형이지만, 이 문맥의 지시 대상은 이스라엘의 족장/선조들이므로 한국어에서는 성별을 전면화하는 표현보다 의미를 분명히 하는 ‘조상들’이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
