  lexicon: HALOT
  rationale: צוה의 권위 있는 명령의 뜻을 살려, 한국어에서는 가장 직접적이고 자연스러운 ‘명령했습니다’를 택했습니다.
- source_word: בָּעֵת הַהִוא
