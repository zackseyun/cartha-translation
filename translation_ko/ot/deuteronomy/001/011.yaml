translation:
  language: ko
  text: 야훼, 곧 여러분의 조상의[a] 하나님께서 그분이 여러분에게 말씀하신[b] 그대로 여러분을 지금보다 천 배나 많게 하시고 여러분에게 복을 주시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 조상들의 하나님’입니다. 히브리어는 문자적으로 ‘여러분의 아버지들의 하나님’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분이 여러분에게 약속하신 대로’입니다. 히브리어는 문자적으로 ‘그분이 여러분에게 말씀하신 대로’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה는 POB의 영어처럼 신적 칭호로 대체하지 않고 음역하여, 언약 이름을 직접 드러내는 방식으로 옮겼습니다.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: the God of your fathers
  chosen_korean: 여러분의 조상의 하나님
  alternatives_korean:
  - 여러분의 아버지들의 하나님
  - 여러분의 조상들의 하나님
  lexicon: HALOT
  rationale: 직역은 ‘아버지들’이지만, 한국어에서는 covenant-historical idiom을 자연스럽게 살리면서도 원문의 남성형 계보 표현을 과도하게 완화하지 않도록 ‘조상’으로 옮겼습니다.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  english_pob_choice: make you a thousand times as many as you are
  chosen_korean: 여러분을 지금보다 천 배나 많게 하시고
  alternatives_korean:
  - 여러분에게 천 배를 더하시고
  - 여러분을 천 배로 늘리시고
  lexicon: HALOT
  rationale: 증가를 뜻하는 יסף와 수량 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘많게 하시고’로 옮겼으며, ‘천 배’가 과장적 축복 공식을 유지합니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  english_pob_choice: just as he has spoken to you
  chosen_korean: 그분이 여러분에게 말씀하신 그대로
  alternatives_korean:
  - 그분이 여러분에게 약속하신 그대로
  - 그분이 여러분에게 말씀하신 것처럼
  lexicon: HALOT
  rationale: 히브리어 동사 דבר의 기본값인 ‘말씀하다/말하다’를 보존하여, 영어 POB의 문맥적 ‘promised’보다 원문에 더 가까운 ‘말씀하신 그대로’로 처리했습니다.
theological_decisions:
- issue: 야훼의 직접 호명과 축복 기원의 문체
  chosen_reading: 본문은 3인칭 축원형으로 처리하되, 한국어에서 경건한 기원 표현인 ‘-시기를 바랍니다’를 사용해 원문의 축복 요청 성격을 살렸습니다.
  alternative_readings:
  - 명령형으로 바꾸어 ‘복 주십시오’라고 옮김
  - 서술형으로 ‘복 주십니다’라고 옮김
  rationale: 원문은 기도문이라기보다 축복 선언/기원에 가까운 optative이므로, 한국어에서도 직접적인 간청과 선언 사이의 어조를 유지하는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (optative/blessing forms)
