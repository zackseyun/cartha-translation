  source_fidelity: 원문의 축원형(יֹסֵף … וִיבָרֵךְ), ‘천 배’, 그리고 דִּבֶּר의 기본 의미인 ‘말씀하다’를 대체로 잘 보존했습니다. 다만 ‘그분이 여러분에게 말씀하신 그대로’가 대시로 삽입되어 문장 전체와의 수식 관계가 불분명합니다. 이를 야훼께서 하실 증가와 축복 전체를 수식하도록 재배치하는 것이 원문에 더 충실합니다.
  naturalness: 현 문장은 ‘…말씀하신 그대로 — 바랍니다’의 연결이 한국어로 다소 부자연스럽고, ‘복 주시기를’보다는 ‘복을 주시기를’이 현대 표준어 문장에서는 더 매끄럽습니다. 각주 표지도 해당 어구에 직접 붙이는 편이 명확합니다.
  terminology: ‘야훼’는 영어 POB의 Yahweh 및 제시된 방침과 일치합니다. ‘여러분의 조상의 하나님’은 한국어에서 자연스럽지만, 각주는 히브리어의 문자적 ‘아버지들’을 정확히 밝혀야 합니다. b 각주는 본문과 사실상 같은 표현을 대안으로 제시하므로, 실제 대안인 ‘약속하신 대로’를 제시하도록 고쳐야 합니다.
