- from: 야훼, 곧 여러분의 조상의 하나님께서 여러분을 지금보다 천 배나 많게 하시고, 여러분에게 복 주시기를 — 그분이 여러분에게 말씀하신 그대로 — 바랍니다.[a][b]
  to: 야훼, 곧 여러분의 조상의[a] 하나님께서 그분이 여러분에게 말씀하신[b] 그대로 여러분을 지금보다 천 배나 많게 하시고 여러분에게 복을 주시기를 바랍니다.
  rationale: 축원형은 ‘-시기를 바랍니다’로 유지하되, ‘말씀하신 그대로’를 야훼께서 하실 두 행동 전체에 자연스럽게 연결했습니다. ‘복을 주시기를’로 목적격을 보완했으며, 각주를 해당 어구에 배치하고 b 각주의 무의미한 반복을 실제 번역 대안으로 교정했습니다.
