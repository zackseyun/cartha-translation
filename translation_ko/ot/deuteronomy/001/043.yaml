  source_fidelity: 히브리어의 서술 순서와 핵심 의미는 대체로 반영되었습니다. 다만 אֶת־פִּי יְהוָה는 한국어 본문에서 ‘야훼의 입을 거슬러 반역했고’라고 하면 지나치게 직역적이고 어색합니다. 본문에서는 관용적 의미인 ‘야훼의 말씀을 거역했습니다’로 옮기고, 각주에서 문자적 표현을 밝혀야 합니다. וַתָּזִדוּ는 단순한 ‘거만함’보다 권위를 무시한 주제넘고 방자한 행동을 나타내므로 이를 더 분명히 반영했습니다.
  naturalness: ‘제가’는 모세의 1인칭 회고 서술에 불필요한 공손성을 더하므로 ‘내가’가 자연스럽습니다. 또한 ‘거만하게 행동하며, 산지로 올라갔습니다’는 병렬 연결이 매끄럽지 않아, 모두 과거 서술로 병렬 처리했습니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 유지했습니다. ‘말씀’은 פִּי(입)의 히브리어 관용적 뜻을 자연스러운 한국어로 전달하며, 각주가 문자적 표현과 명령의 의미를 보존합니다. ‘주제넘게 행동했습니다’는 זיד의 참람하고 방자한 뉘앙스를 ‘거만하게’보다 충실하게 드러냅니다.
