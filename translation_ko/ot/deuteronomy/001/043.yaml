language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
  footnotes:
  - marker: a
    text: Hebrew literally, "against the mouth of the LORD"; that is, against what the LORD had commanded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제가 여러분에게 말했지만, 여러분은 듣지 않았습니다. 여러분은 야훼의 입을 거슬러 반역했고, 거만하게 행동하며, 산지로 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “야훼의 입을 거슬러”라고 하며, 곧 야훼께서 말씀하신 명령에 대하여 거역했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵי/כֶם
  english_pob_choice: So I spoke to you
  chosen_korean: 그래서 제가 여러분에게 말했지만
  alternatives_korean:
  - 그리고 제가 여러분에게 말했지만
  - 그때 제가 여러분에게 말했지만
  lexicon: HALOT
  rationale: 말하다의 완료적 서술과 앞절과의 이어짐을 살려 ‘그래서’로 처리했고, 2인칭 복수는 공손한 직접 화법에서 자연스러운 ‘여러분’으로 옮겼습니다.
- source_word: וְ/לֹא שְׁמַעְתֶּם
  english_pob_choice: but you did not listen
  chosen_korean: 여러분은 듣지 않았습니다
  alternatives_korean:
  - 여러분은 듣지 않았습니다만
  - 여러분은 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 여기서 ‘듣다/귀 기울이다’의 기본 의미를 살리되, 뒤의 반역 진술과 구별되도록 ‘순종하다’는 피했습니다.
- source_word: אֶת פִּי יְהוָה
  english_pob_choice: against the mouth of Yahweh
  chosen_korean: 야훼의 입을 거슬러
  alternatives_korean:
  - 야훼의 입에 대하여
  - 야훼의 명령을 거슬러
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘입’을 보존해 하나님의 말씀·명령을 가리키는 관용구를 드러냈고, POB의 ‘mouth’ 선택을 한국어에서 가장 자연스럽게 반영했습니다.
- source_word: וַתַּמְרוּ
  english_pob_choice: you rebelled
  chosen_korean: 반역했고
  alternatives_korean:
  - 거역했고
  - 반항했고
  lexicon: HALOT
  rationale: מרה는 권위에 대한 반역·거역을 뜻하므로, 문맥상 강도를 살리면서도 현대 한국어에서 분명한 ‘반역하다’를 택했습니다.
- source_word: וַתָּזִדוּ
  english_pob_choice: acted presumptuously
  chosen_korean: 거만하게 행동하며
  alternatives_korean:
  - 오만하게 행동하며
  - 함부로 행동하며
  - 주제넘게 행동하며
  lexicon: HALOT
  rationale: זיד의 ‘방자함/교만/무모한 자기확신’의 뉘앙스를 살려, 앞의 반역과 겹치지 않으면서 태도의 불손함을 드러내는 표현으로 옮겼습니다.
- source_word: הָ/הָרָ/ה
  english_pob_choice: into the hill country
  chosen_korean: 산지로 올라갔습니다
  alternatives_korean:
  - 산지로 올라갔습니다
  - 산간지대로 올라갔습니다
  - 산악지대로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’와 방향형 지명형을 함께 반영해, 지형적 상승을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 하나님의 고유명사인 야훼를 유지해 본문의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘입’의 관용구 보존
  chosen_reading: 야훼의 입을 거슬러
  alternative_readings:
  - 야훼의 명령을 거슬러
  - 야훼께 불순종하여
  rationale: 본문의 ‘입’은 단순한 신체기관이 아니라 야훼께서 말씀하신 바를 가리키는 관용구이므로, 이를 직접 보존해 말과 명령의 권위를 드러냈습니다.
  doctrine_reference: 도 1:43의 히브리 관용구 해석
