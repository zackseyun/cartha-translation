base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
  footnotes:
  - marker: a
    text: Or 'to scout out a place for you to camp.'
    reason: lexical_alternative
  - marker: b
