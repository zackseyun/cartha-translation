  to: 여러분보다 앞서 길을 가시며, 여러분이 진을 칠 곳을 찾아 주시고[a], 밤에는 불 가운데서, 낮에는 구름 가운데서 여러분이 갈 길을 보여 주셨습니다.[b]
  rationale: 원문의 ‘길을 보여 주다’가 밤의 불과 낮의 구름 모두에 걸리는 구조를 한국어에서도 보존했습니다. ‘진을 칠 곳’으로 야영의 의미를 회복했으며, 각주 표지를 해당 어구에 붙여 참조 대상을 명확히 했습니다.
