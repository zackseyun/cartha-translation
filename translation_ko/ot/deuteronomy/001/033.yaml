translation:
  language: ko
  text: 여러분보다 앞서 길을 가며 여러분을 위해 머물 곳을 찾아보시고, 밤에는 불 가운데서 여러분에게 길을 보여 주시며, 낮에는 구름 가운데서 인도하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 진을 칠 곳을 찾아보시고’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분이 갈 그 길 안에서 여러분에게 보이시려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  english_pob_choice: who went before you
  chosen_korean: 여러분보다 앞서 길을 가며
  alternatives_korean:
  - 여러분 앞서 가며
  - 여러분 앞에 가서
  lexicon: HALOT
  rationale: הלך의 분사적/관계절적 용법을 자연스럽게 살리되, ‘앞서’와 ‘길을 가며’로 인도자의 선행성을 드러냈습니다.
- source_word: לָתוּר לָכֶם מָקוֹם לַחֲנֹתְכֶם
  english_pob_choice: to search out a place for you to camp
  chosen_korean: 여러분을 위해 머물 곳을 찾아보시고
  alternatives_korean:
  - 여러분이 진을 칠 곳을 찾아보시고
  - 여러분이 머무를 자리를 살펴보시고
  lexicon: HALOT
  rationale: תור의 ‘찾아 살피다/탐색하다’ 의미를 반영하되, 현대 한국어에서는 ‘진을 치다’보다 ‘머물 곳을 찾아보다’가 덜 군사적이고 본문의 목적을 잘 드러냅니다.
- source_word: בָּאֵשׁ לַיְלָה ... וּבֶעָנָן יוֹמָם
  english_pob_choice: in fire by night ... and in the cloud by day
  chosen_korean: 밤에는 불 가운데서 ... 낮에는 구름 가운데서
  alternatives_korean:
  - 밤에는 불로 ... 낮에는 구름으로
  - 밤에는 불기둥으로 ... 낮에는 구름기둥으로
  lexicon: HALOT
  rationale: 출애굽 광야 인도 장면의 상징적 표현을 유지하면서, 전치사 구조에 맞춰 ‘가운데서’로 옮겨 밤/낮의 대조를 살렸습니다.
theological_decisions:
- issue: 33절이 32절의 여호와 언급에 종속된 상대절 구조라는 점
  chosen_reading: 주어를 새로 덧붙이지 않고, 앞 구절의 야훼를 이어받는 인도 행위로 번역했습니다.
  alternative_readings:
  - ‘야훼께서 여러분보다 앞서 길을 가며…’처럼 주어를 명시하는 번역
  rationale: 히브리어는 본절만 떼어 읽으면 생략된 주어가 있지만, 문맥상 앞 절의 야훼를 계속 지칭하므로 불필요한 보충 없이 연결성을 보존했습니다.
  doctrine_reference: 문맥 계승과 지시 대명/관계절의 연결
