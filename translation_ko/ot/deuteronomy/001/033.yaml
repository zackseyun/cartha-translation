  - severity: low
    issue: ‘머물 곳’이 야영의 구체성을 약화함
    rationale: לַחֲנֹתְכֶם은 단순 체류보다 ‘진을 치다, 야영하다’를 뜻합니다. ‘진을 칠 곳’이 목적과 상황을 더 정확히 전달합니다.
  - severity: low
