  source_fidelity: 원문의 연속된 명령(‘돌아서서/방향을 바꾸어’, ‘출발하여’, ‘가십시오’)과 광범위한 지리 목록을 유지했습니다. 다만 לָכֶם은 여기서 한국어로 ‘여러분을 위해’라고 직역하면 목적·수혜 의미가 과도하게 부여되므로 관용적 강조로 처리하여 생략하는 것이 충실합니다. שְׁכֵנָיו는 문자적으로 ‘그의 이웃들’이지만 영토 목록 문맥에서는 인접 지역들을 가리킬 수 있으므로 ‘그 주변 모든 곳’으로 자연스럽게 옮겼습니다.
  naturalness: ‘뒤돌아 서서 여러분을 위해 길을 떠나’는 현대 공적 한국어에서 부자연스럽고, ‘뒤돌아’는 원문이 요구하지 않는 후방 방향을 암시할 수 있습니다. ‘돌아서서 출발하여’가 명령의 흐름을 자연스럽게 보존합니다. שְׁפֵלָה는 ‘낮은 들’보다 ‘평지’가 자연스럽고 일반 독자에게도 명확합니다.
