  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
  footnotes:
  - marker: a
    text: Or “in the Shephelah,” the name of the western lowland/foothill region.
    reason: lexical_alternative
translation:
  language: ko
  text: 뒤돌아 서서 여러분을 위해 길을 떠나 아모리 사람의 산지와 그들의 이웃들 모두에게로, 곧 아라바와 산지와 낮은 들과 네겝과 바닷가와 가나안 사람의 땅과 레바논으로 가고, 큰 강 유브라데 강에 이르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낮은 들’은 히브리어 שְׁפֵלָה(셰펠라), 곧 서쪽 저지대/구릉 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  english_pob_choice: Turn
  chosen_korean: 뒤돌아 서서
  alternatives_korean:
  - 돌아서
  - 방향을 바꾸어
  lexicon: HALOT
  rationale: פנה의 명령형은 단순 이동보다 방향 전환을 먼저 강조하므로, 출발 명령 앞의 전환 동작을 자연스럽게 드러냈습니다.
- source_word: וּסְעוּ לָכֶם
  english_pob_choice: and set out for yourselves
  chosen_korean: 여러분을 위해 길을 떠나
  alternatives_korean:
  - 그리고 떠나십시오
  - 그리고 출발하십시오
  lexicon: HALOT
  rationale: נסע는 여기서 진영을 풀고 출발하는 뉘앙스가 있으나, 한국어에서는 그 절차를 과도하게 풀지 않고 ‘길을 떠나’로 살렸습니다. לָכֶם은 반사적 강조로 보고 ‘여러분을 위해’로 반영했습니다.
- source_word: הַר הָאֱמֹרִי
  english_pob_choice: the hill country of the Amorites
  chosen_korean: 아모리 사람의 산지
  alternatives_korean:
  - 아모리 사람들의 산지
  - 아모리 산지
  lexicon: HALOT
  rationale: הַר은 단일 산보다 산지/구릉지를 가리키므로 ‘산지’로 옮겼고, 집단 지명은 한국어에서 자연스러운 단수 소유형으로 처리했습니다.
- source_word: וּבַשְּׁפֵלָה
  english_pob_choice: in the lowland
  chosen_korean: 낮은 들
  alternatives_korean:
  - 저지대
  - 세펠라
  lexicon: HALOT
  rationale: שְׁפֵלָה는 특정 지명인 세펠라를 가리킬 수 있지만, 본문 열거에서는 지형적 뜻이 우선이므로 의미를 드러내는 ‘낮은 들’을 택했습니다.
- source_word: וּבְחוֹף הַיָּם
  english_pob_choice: and on the coast of the sea
  chosen_korean: 바닷가
  alternatives_korean:
  - 바다 해안
  - 바닷가 언덕
  lexicon: HALOT
  rationale: חוֹף는 해안/가를 뜻하므로, 반복적 지리 열거 속에서 간결하게 ‘바닷가’로 옮겼습니다.
- source_word: נְהַר פְּרָת
  english_pob_choice: the Euphrates River
  chosen_korean: 유브라데 강
  alternatives_korean:
  - 유프라테스 강
  - 유브라테스 강
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경의 널리 알려진 음역을 따르되, ‘강’이 중복되지 않도록 자연스러운 표기를 선택했습니다.
theological_decisions:
- issue: 지리 목록의 범위와 종결
  chosen_reading: 아라바, 산지, 낮은 들, 네겝, 바닷가, 가나안 사람의 땅, 레바논에서 유브라데 강까지의 광역 경계를 한 문장으로 유지했습니다.
  alternative_readings:
  - 지역명을 쉼표로 더 세분하거나 일부를 풀어 설명하는 방식
  - ‘세펠라’ 같은 학술 지명을 본문에 직접 쓰는 방식
  rationale: 본문은 약속의 땅 경계를 열거하는 진술이므로, 설명을 덧붙이기보다 나열의 리듬과 범위를 보존하는 것이 청중 이해에 더 충실합니다.
  doctrine_reference: 토지 약속/경계 진술(신 1:7 문맥)
- issue: 명령형 어조
  chosen_reading: 모세의 직접 명령을 현대 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하는 방식
  - 구어체 반말 명령으로 옮기는 방식
  rationale: 원문의 명령성을 약화하지 않으면서도, 한국어 성경 문체에 맞는 공적이고 읽기 쉬운 어조를 유지하기 위함입니다.
  doctrine_reference: 본문 화행 보존
