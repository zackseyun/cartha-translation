  - severity: low
    issue: 기존 각주의 기능 부족
    rationale: ‘여러분 때문에’가 원문을 직접 반영한다는 각주는 번역 자체를 반복할 뿐 독자에게 실질적인 정보를 거의 주지 않습니다. 영어 감사 기록의 관련 본문 비교 각주를 한국어로 옮기는 편이 더 유익합니다.
