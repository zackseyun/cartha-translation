base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
  footnotes:
  - marker: a
    text: Or 'The LORD was angry against me because of you.'
    reason: lexical_alternative
  - marker: b
    text: Compare Numbers 20:12, where Moses' exclusion from entering the land is connected to his own failure at Meribah; Deuteronomy here emphasizes the people's role in the matter.
    reason: cross_reference
translation:
  language: ko
  text: 야훼께서 여러분 때문에 저에게도 진노하시며 말씀하셨습니다. “너도 그곳에 들어가지 못할 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 민수기 20:12과 비교하십시오. այնտեղ에서는 모세가 그 땅에 들어가지 못하게 된 일이 므리바에서의 모세 자신의 실패와 관련됩니다. 그러나 여기 신명기는 이 일에서 백성의 역할을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유 신명은 직역 대상이므로 전통적 대치어인 ‘주’가 아니라 학술적 음역 ‘야훼’를 사용했습니다.
- source_word: הִתְאַנַּף
  english_pob_choice: was angry
  chosen_korean: 진노하셨습니다
  alternatives_korean:
  - 노여워하셨습니다
  - 화를 내셨습니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 강한 분노 표지를 살리되, 한국어 성경체에서 자연스러운 ‘진노하다’로 옮겼습니다.
- source_word: בִּגְלַלְכֶם
  english_pob_choice: because of you
  chosen_korean: 여러분 때문에
  alternatives_korean:
  - 여러분 때문에
  - 여러분으로 말미암아
  - 여러분으로 인하여
  lexicon: HALOT
  rationale: 원문의 원인·계기를 직접 드러내는 표현으로, 현대 한국어에서 가장 자연스럽고 분명한 ‘때문에’를 택했습니다.
- source_word: לֹא תָבֹא שָׁם
  english_pob_choice: shall not enter there
  chosen_korean: 거기로 들어가지 못한다
  alternatives_korean:
  - 거기로 들어가서는 안 된다
  - 거기로 들어가지 못할 것이다
  lexicon: HALOT
  rationale: בוא의 목적지 진입 의미를 ‘들어가다’로 살리고, 금지/불가능의 선언을 한국어 미래 부정형으로 표현했습니다.
theological_decisions:
- issue: 문맥상 모세의 출입 금지와 관련된 책임의 초점
  chosen_reading: 본문 자체의 진술대로, 야훼께서 모세에게도 진노하셨고 그것이 ‘여러분 때문에’라고 말합니다.
  alternative_readings:
  - 민수기 20장의 모세 자신의 실패를 전면에 두는 조화적 읽기
  - 이스라엘 백성의 책임만을 강조하는 단선적 읽기
  rationale: 신명기 1:37의 표현이 지닌 긴장을 그대로 유지하여, 다른 본문을 본문 안으로 끌어들여 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
