revisions:
- from: 야훼께서 여러분 때문에 저에게도 진노하셨으니, 이르시기를 “너도 거기로 들어가지 못한다” 하셨습니다.[a]
  to: 야훼께서 여러분 때문에 저에게도 진노하시며 말씀하셨습니다. “너도 그곳에 들어가지 못할 것이다.”[a]
  rationale: 원문의 ‘야훼께서 내게도 … 진노하셨다, 말씀하시기를’이라는 구조와 두 번의 גַּם(‘도’)을 자연스러운 현대 합쇼체로 보존했습니다. 불필요하게 인과를 강화하던 ‘으니’를 제거하고, 영어 감사 기록의 비교 각주를 반영하되 본문 안에서 책임 문제를 조화시키거나 해소하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:02Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. ‘야훼’, ‘여러분 때문에’, ‘저에게도’, ‘너도’, 그리고 목적지에 들어가지 못한다는 뜻을 잘 반영합니다. 다만 원문의 ‘진노하셨다 … 말씀하시기를’이라는 발화 연결을 한국어에서 더 직접적으로 나타내는 편이 좋습니다.
  naturalness: 초안의 ‘진노하셨으니, 이르시기를 … 하셨습니다’는 인과관계처럼 읽히고, ‘이르시기를’과 ‘하셨습니다’의 결합도 현대 합쇼체 문장으로 다소 부자연스럽습니다. ‘진노하시며 말씀하셨습니다’가 자연스럽고 원문 구조에도 가깝습니다.
  terminology: ‘야훼’는 제시된 명명 방침과 일치하며, ‘진노하시다’는 격식 있는 성경 문맥에 적절합니다. ‘그곳’은 שָׁם의 지시성을 자연스럽게 보존합니다.
  issues:
