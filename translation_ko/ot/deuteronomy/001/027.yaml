base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the hatred of the LORD''; the phrase is rendered idiomatically as ''Because the LORD hates us.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'to hand us over to the Amorites'; Hebrew literally, 'to give us into the hand of the Amorites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 여러분은 천막들 안에서 투덜거리며 말했습니다[a]. ‘야훼께서 우리를 미워하셔서 우리를 이집트 땅에서 인도해 내어, 우리를 아모리 사람들의 손에 넘겨 주시어 우리를 멸망시키려 하신다[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여호와의 미움 안에서’에 가깝지만, 여기서는 원인의 뜻을 살려 ‘투덜거리며’라고 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아모리 사람들의 손에 우리를 주어’입니다. ‘손에’는 권세 아래 넘겨짐을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  english_pob_choice: you grumbled
  chosen_korean: 투덜거리며
  alternatives_korean:
  - 투덜거렸습니다
  - 원망하며
  lexicon: HALOT
  rationale: רגן의 부정적이고 불만 섞인 중얼거림을 현대 한국어에서 자연스럽게 살리기 위해 ‘투덜거리며’로 옮겼습니다.
- source_word: בְאָהֳלֵיכֶם
  english_pob_choice: in your tents
  chosen_korean: 천막들 안에서
  alternatives_korean:
  - 장막들 안에서
  - 너희 천막 안에서
  lexicon: HALOT
  rationale: 광야의 구체적 배경을 살리면서도 복수형을 드러내기 위해 ‘천막들 안에서’로 번역했습니다.
- source_word: בְּשִׂנְאַת יְהוָה
  english_pob_choice: Because the LORD hates us
  chosen_korean: 야훼께서 우리를 미워하셔서
  alternatives_korean:
  - 야훼의 미움 때문에
  - 야훼께서 우리를 미워하시기에
  lexicon: HALOT
  rationale: 히브리어의 ב+명사구를 원인으로 풀어, 이스라엘의 주장인 ‘야훼께서 우리를 미워하신다’는 뜻이 분명히 드러나도록 했습니다.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  english_pob_choice: to give us into the hand of the Amorites
  chosen_korean: 우리를 아모리 사람들의 손에 넘겨 주시어
  alternatives_korean:
  - 우리를 아모리 사람들의 손에 주시어
  - 우리를 아모리 사람들에게 넘겨 주시어
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 유지하되 한국어에서는 ‘넘겨 주시어’로 자연스럽게 풀어, 타인의 권세 아래 맡겨짐을 살렸습니다.
