translation:
  language: ko
  text: 여러분은 천막 안에서 불평하며 이렇게 말했습니다. “야훼께서 우리를 미워하셔서[a] 우리를 이집트 땅에서 인도해 내시고, 우리를 아모리 사람들의 손에[b] 넘겨주어 우리를 멸망시키려고 하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼의 미움 때문에’라고 합니다. 여기서 이 표현은 원인을 나타내며, ‘야훼께서 우리를 미워하셔서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아모리 사람들의 손에 우리를 주어’입니다. ‘손에’는 다른 이의 권세 아래 넘겨짐을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
