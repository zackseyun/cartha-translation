  rationale: 각주 a를 원문에서 실제로 설명하는 ‘야훼의 미움’ 구절에 연결하고, 각주 b를 ‘손에’ 관용구에 연결했습니다. 또한 출애굽 사건과 그에 대한 이스라엘의 आरोप된 목적을 과거 시제로 옮겨 원문의 문맥을 반영했습니다. ‘불평하며’는 רגן의 불만 섞인 중얼거림을 자연스럽게 전달하며, ‘천막 안에서’는 복수 소유자에게 분배적으로 적용되는 히브리어 표현을 한국어답게 옮긴 것입니다.
