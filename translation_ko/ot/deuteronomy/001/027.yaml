  terminology: ‘야훼’, ‘이집트 땅’, ‘아모리 사람들’, ‘멸망시키다’는 적절합니다. ‘손에 넘겨주시어’는 히브리어의 ‘손에 주다’ 관용구와 그 지배 아래 넘겨짐의 뜻을 잘 보존합니다.
