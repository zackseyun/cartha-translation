  - 이것들은 … 말입니다
  lexicon: HALOT
  rationale: 서두의 선언문 구조를 살리기 위해 지시어와 복수형 명사를 유지했고, דְּבָרִים는 여기서 모세의 발화 전체를 가리키므로 ‘말들’이 가장 직접적입니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 저편[a]
  alternatives_korean:
  - 요단 건너편
  - 요단의 반대편
  lexicon: HALOT
  rationale: 지리적 관점이 양방향으로 가능하다는 주석을 반영해 ‘저편’을 택했고, 한국어에서도 관용적이면서 원문 거리감을 잘 보존합니다.
- source_word: בַּמִּדְבָּר / בָּעֲרָבָה
  english_pob_choice: in the wilderness, in the Arabah
  chosen_korean: 광야, 아라바
  alternatives_korean:
  - 광야, 들판
  - 사막, 아라바
  lexicon: HALOT
  rationale: מִדְבָּר는 단순한 사막보다 성경적 ‘광야’가 더 정확하고, עֲרָבָה는 일반 명사보다 지명적 용법이 강해 음역 ‘아라바’를 유지했습니다.
- source_word: מוֹל סוּף ... בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  english_pob_choice: opposite Suph, between Paran, Tophel, Laban, Hazeroth, and Dizahab
  chosen_korean: 수프 맞은편, 파란과 도벨과 라반과 하세롯과 디 자하브 사이에서
  alternatives_korean:
  - 수프 맞은편, 파란과 토펠과 라반과 하세롯과 디자하브 사이에서
  - 수프 맞은편, 파란·도벨·라반·하세롯·디 자하브 사이에서
  lexicon: HALOT
  rationale: 열거된 지명들을 원문 순서대로 음역했고, בֵּין … וּבֵין의 구조를 한국어 ‘사이에서’로 옮겨 경계/위치 표시를 드러냈습니다. דִי זָהָב은 문자적 번역보다 지명 음역이 원문 의도에 맞습니다.
theological_decisions:
- issue: '문장의 기능: 본문 머리말인지 서사 문장인지'
  chosen_reading: 서술형이지만 책의 서두를 여는 제목성 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 역사 서술문
  - 독립된 표제문
  rationale: ‘이것들은 …입니다’로 시작해 모세의 발언을 도입하는 선언적 기능을 살리되, 문장 자체는 한국어 문체상 완결된 서술로 처리했습니다.
  doctrine_reference: 본문 기능/담화 구조
- issue: ‘요단 저편’의 시점 문제
  chosen_reading: 한쪽 시점만 고정하지 않고, 지리적 상대성을 열어 두는 표현으로 옮겼습니다.
  alternative_readings:
  - 요단 건너편으로 고정
  - 요단의 반대편으로 풀이
  rationale: 영문 주석이 명시하듯 히브리어 표현은 관점에 따라 달리 렌더링될 수 있으므로, 해석을 과도하게 고정하지 않는 번역이 적절합니다.
  doctrine_reference: 본문 지리표현의 양의성
