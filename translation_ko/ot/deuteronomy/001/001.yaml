  source_fidelity: ‘곧 수프 맞은편’의 ‘곧’은 아라바와 수프 맞은편을 동격 또는 설명 관계로 만들지만, 히브리어는 이를 그렇게 표시하지 않고 연속된 지리적 위치 표현으로 열거합니다. 또한 수프(סוּף) 및 지명들의 음역은 원음과 통용 성경 지명 표기에 맞추어 조정하는 것이 좋습니다.
  naturalness: ‘이것들은 … 말들입니다’는 히브리어 복수를 기계적으로 반영하여 한국어 서두 문장으로 다소 부자연스럽습니다. 한국어에서는 집합적으로 ‘이것은 … 한 말입니다’라고 하는 편이 자연스럽고, 원문의 담화 도입 기능도 유지합니다.
