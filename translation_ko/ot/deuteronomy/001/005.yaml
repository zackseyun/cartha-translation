source:
  edition: WLC
  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
  footnotes:
  - marker: a
    text: Or 'Across the Jordan' or 'On the other side of the Jordan.' The Hebrew expression is geographically relative and can be rendered in more than one natural English way.
    reason: lexical_alternative
  - marker: b
    text: Or 'this instruction.' The Hebrew torah can mean 'law' or more broadly 'instruction'; here 'law' was chosen because of the covenantal-legal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 요단 건너편[a], 모압 땅에서 모세는 이 율법[b]을 설명하기 시작하여 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단 건너’나 ‘요단강 저편’으로 옮길 수 있습니다. 히브리어 표현은 지리적으로 상대적인 말이라 자연스러운 한국어가 여러 가지일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 가르침’으로 옮길 수 있습니다. 히브리어 토라는 ‘율법’ 또는 더 넓게는 ‘가르침’을 뜻할 수 있으나, 여기서는 언약적·법적 문맥 때문에 ‘율법’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: Beyond the Jordan
  chosen_korean: 요단 건너편
  alternatives_korean:
  - 요단 강 건너편
  - 요단의 저편
  - 요단 동편
  lexicon: HALOT
  rationale: 히브리어 표현은 화자의 기준점에 따라 상대적으로 쓰이는 지리 관용구이므로, 자연스러운 한국어로는 간결한 ‘요단 건너편’이 원문의 상대적 방향성을 잘 살립니다.
- source_word: בְּאֶרֶץ מוֹאָב
  english_pob_choice: in the land of Moab
  chosen_korean: 모압 땅에서
  alternatives_korean:
  - 모압 지역에서
  - 모압의 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ는 지리·정치적 문맥에서 ‘땅’이 기본값이므로, ‘모압 땅’이 원문의 지역 표지를 가장 직접적으로 옮깁니다.
- source_word: הוֹאִיל
  english_pob_choice: began
  chosen_korean: 설명하기 시작하여
  alternatives_korean:
  - 해설하기 시작하여
  - 풀어 밝히기 시작하여
  - 해명하기 시작하여
  lexicon: HALOT
  rationale: 이 구조에서는 הוֹאִיל이 뒤따르는 פעול과 함께 어떤 행위의 개시를 나타내므로, 한국어는 ‘~하기 시작하여’로 자연스럽게 살렸습니다.
- source_word: בֵּאֵר אֶת הַתּוֹרָה הַזֹּאת
  english_pob_choice: to explain this law
  chosen_korean: 이 율법을 설명하기
  alternatives_korean:
  - 이 가르침을 설명하기
  - 이 토라를 설명하기
  - 이 율법을 해설하기
  lexicon: HALOT
  rationale: 신명기의 언약-법적 문맥에서는 תּוֹרָה를 ‘율법’으로 옮기는 것이 가장 적절하며, בֵּאֵר는 내용을 분명히 풀어 주는 의미이므로 ‘설명하다’가 직역성과 가독성의 균형이 좋습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: ‘율법’으로 옮겨 언약적·규범적 성격을 드러냈습니다.
  alternative_readings:
  - ‘가르침’으로 더 넓게 옮기는 방식
  - 음역 ‘토라’로 남기는 방식
  rationale: 본절은 모세가 백성 앞에서 신명기적 규범을 풀어 주는 도입부이므로, ‘율법’이 원문의 법적·언약적 힘을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency / documented exception)
