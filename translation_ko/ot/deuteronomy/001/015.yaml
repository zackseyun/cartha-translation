revisions:
- from: 그래서 나는 여러분의 지파의 우두머리들인 지혜롭고 지식 있는 사람들을 데려다가, 여러분 위에 우두머리로 세웠습니다. 곧 천인장과 백인장과 오십인장과 십인장과 여러분의 지파를 위한 관리들입니다.[a]
  to: 그래서 나는 각 지파의 우두머리들, 곧 지혜롭고 널리 알려진 남자들을 택하여 여러분을 다스릴 우두머리들로 세웠습니다. 그들은 천 명을 맡은 지휘관들, 백 명을 맡은 지휘관들, 오십 명을 맡은 지휘관들, 십 명을 맡은 지휘관들, 그리고 각 지파의 관리들이었습니다.[a]
  rationale: 히브리어 수동 분사 וִידֻעִים의 직접적인 의미인 ‘알려진’을 본문에 반영하고, 문맥적 대안인 ‘지식이나 분별을 갖춘’을 각주에 보존했습니다. 또한 남성 복수 명사 אֲנָשִׁים을 ‘남자들’로 옮겼으며, 직함의 단계적 구조와 각 지파에 속한 관리라는 뜻을 자연스러운 현대 한국어로 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:06Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. וִידֻעִים은 ידע에서 온 수동 분사로서 우선적으로 ‘알려진/인정받는’이라는 뜻입니다. 초안의 ‘지식 있는’은 영어 감사 기록에서 채택한 문맥적 해석을 따르지만, 히브리어 형태가 지닌 더 직접적인 뜻을 본문에서 지우므로 각주로만 처리할 대안이 아닙니다. 또한 אֲנָשִׁים의 남성 지시를 본문에 반영하는 편이 적절합니다.
  naturalness: ‘여러분의 지파의’는 겹친 소유 표현으로 다소 어색하므로 ‘각 지파의’가 자연스럽습니다. ‘여러분 위에 우두머리로’도 가능하지만 복수 보어와 통치 관계를 분명히 한 ‘여러분을 다스릴 우두머리들로’가 현대 한국어에서 더 매끄럽습니다. 계층 직함은 ‘천 명을 맡은 지휘관’ 등으로 풀어 쓰면 현대 독자가 오해 없이 이해할 수 있습니다.
  terminology: רָאשֵׁי/רָאשִׁים의 반복은 ‘우두머리들’로 유지했습니다. שָׂרֵי는 계층별 책임을 나타내도록 ‘…을 맡은 지휘관들’로, שֹׁטְרִים은 행정적 하위 관원을 포괄하는 ‘관리들’로 옮겼습니다. וִידֻעִים의 문맥적 ‘지식 있는’ 해석은 가능한 대안으로 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: וִידֻעִים을 본문에서 ‘지식 있는’으로 단정함
    rationale: 이 말은 수동형 ‘알려진, 인정받는’이 직접적인 의미입니다. ‘지식 있는’은 문맥상 가능한 해석이지만 형태상 우선 의미를 대체하지 않도록 본문과 각주의 배치를 조정해야 합니다.
  - severity: low
    issue: אֲנָשִׁים의 남성 지시가 ‘사람들’로 중화됨
    rationale: 히브리어가 남성 복수 명사로 표현하므로, 의미를 불필요하게 중화하지 않고 ‘남자들’로 반영하는 것이 원문 충실성에 맞습니다.
  - severity: low
    issue: ‘여러분의 지파의’ 및 직함 나열의 자연스러움
    rationale: ‘각 지파의’가 더 자연스럽고, 수량 단위를 맡은 지휘관으로 풀어 쓰면 현대 한국어의 이해도와 행정적 층위가 함께 보존됩니다.
