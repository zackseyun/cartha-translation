  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
  footnotes:
  - marker: a
    text: Or 'well-known men' for 'knowledgeable men'; the Hebrew term can denote those who are known or recognized, though in this context it likely refers to men marked by knowledge or discernment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 각 지파의 우두머리들, 곧 지혜롭고 널리 알려진 남자들을 택하여 여러분을 다스릴 우두머리들로 세웠습니다. 그들은 천 명을 맡은 지휘관들, 백 명을 맡은 지휘관들, 오십 명을 맡은 지휘관들, 십 명을 맡은 지휘관들, 그리고 각 지파의 관리들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘널리 알려진 남자들’이라고도, 문맥에 따라 ‘지식이나 분별을 갖춘 남자들’이라고도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  english_pob_choice: the heads of your tribes
  chosen_korean: 여러분의 지파의 우두머리들
  alternatives_korean:
  - 여러분의 지파의 지도자들
  - 여러분의 지파의 수장들
  lexicon: HALOT
  rationale: רֹאשׁ의 직유적 의미를 살리면서, 행정적 문맥에서의 수위(首位) 개념을 한국어의 자연스러운 ‘우두머리’로 옮겼습니다.
- source_word: חֲכָמִים וִידֻעִים
  english_pob_choice: wise and knowledgeable men
  chosen_korean: 지혜롭고 지식 있는 사람들
  alternatives_korean:
  - 지혜롭고 잘 알려진 사람들
  - 지혜롭고 분별력 있는 사람들
  lexicon: HALOT
  rationale: חָכָם은 단순한 정보량보다 실천적 지혜를, יָדַע 계열은 지식이나 인지된 역량을 가리키므로 ‘지식 있는’으로 처리해 POB의 선택을 반영했습니다.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  english_pob_choice: and appointed them as heads over you
  chosen_korean: 여러분 위에 우두머리로 세웠습니다
  alternatives_korean:
  - 여러분 위에 우두머리로 임명했습니다
  - 여러분을 다스리는 우두머리로 삼았습니다
  lexicon: HALOT
  rationale: נתן + 목적어 + 보충어는 임명/배치를 뜻하므로 ‘세웠습니다’로 옮겨 직무 부여의 행위를 분명히 했습니다.
- source_word: שָׂרֵי... וְשֹׁטְרִים
  english_pob_choice: commanders ... and officers
  chosen_korean: 천인장과 백인장과 오십인장과 십인장과 ... 관리들
  alternatives_korean:
  - 지휘관들과 관리들
  - 우두머리들과 서기관들
  lexicon: HALOT
  rationale: שַׂר은 계층화된 권위 직함이므로 관례적 행정·군사 직함인 ‘-인장’으로 구체화했고, שֹׁטְרִים은 단순한 ‘서기관’보다 넓은 행정 감독을 가리켜 ‘관리들’로 옮겼습니다.
theological_decisions:
- issue: 계층적 행정 구조의 표현
  chosen_reading: 본문의 군사-행정 직함들을 그대로 살려, 공동체 질서가 실제로 층위화되어 있었음을 드러냈습니다.
  alternative_readings:
  - 보다 완화하여 ‘지도자들’로 통일하는 번역
  - 현대 행정어로만 평준화하는 번역
  rationale: 출애굽기/신명기의 조직 구조는 단순한 일반 지도력이 아니라 실제 직분 체계를 전제하므로, 직함의 층위를 보존하는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 공동체 질서와 지도력의 소명
- issue: ‘지식 있는’의 의미
  chosen_reading: 여기서는 단순한 인지도보다, 지도에 적합한 지식과 분별을 지닌 사람이라는 뜻으로 이해했습니다.
  alternative_readings:
  - ‘잘 알려진 사람들’로 이해
  - ‘유명한 사람들’로 이해
  rationale: 히브리어 ידע 계열은 문맥에 따라 ‘알려진’일 수 있으나, 이 절의 선정 기준은 지혜와 더불어 자질을 말하므로 지식/분별의 의미가 더 적절합니다.
  doctrine_reference: 성경의 지혜와 분별
