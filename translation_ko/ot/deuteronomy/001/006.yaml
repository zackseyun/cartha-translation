  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
  footnotes:
  - marker: a
    text: Hebrew Horeb, the name used here for the mountain also associated with Sinai.
    reason: cross_reference
  - marker: b
    text: Or “Enough for you; stay no longer at this mountain.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 우리 하나님께서 호렙[a]에서 우리에게 말씀하셨습니다. “너희가 이 산에 머문 것은 이제 충분합니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘호렙’. 이 이름은 시나이와도 관련된 산을 가리키는 데 사용됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 “너희에게는 충분합니다. 이 산에 더 머물지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와나 주님으로 돌리지 않고, 하나님의 고유명을 음역한 ‘야훼’를 사용해 מקור의 인격적 이름을 보존했습니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 신들
  - 우리의 하나님
  lexicon: HALOT
  rationale: 복수형 어형이지만 이 문맥에서는 이스라엘의 유일하신 하나님을 가리키므로, 한국어로는 자연스럽고 신학적으로 정확한 ‘우리 하나님’으로 옮겼습니다.
- source_word: רַב לָכֶם שֶׁבֶת
  english_pob_choice: You have stayed ... long enough
  chosen_korean: 머문 지는 충분합니다
  alternatives_korean:
  - 머무신 것이 충분합니다
  - 이 산에 머문 것이 너무 오래되었습니다
  - 이 산에 더 머물 필요가 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘רַב לָכֶם’의 충분·과다의 뜻을 살려, 직역보다 한국어에서 같은 압박감을 주는 ‘머문 지는 충분합니다’로 옮겼습니다.
- source_word: בְּחֹרֵב / בָּהָר הַזֶּה
  english_pob_choice: at Horeb / at this mountain
  chosen_korean: 호렙에서 / 이 산
  alternatives_korean:
  - 호렙에
  - 이 산에서
  lexicon: HALOT
  rationale: 장소 부사구는 ‘호렙에서’로, 이어지는 지시 구문은 ‘이 산’으로 유지하여 본문의 지리적 표지를 그대로 드러냈습니다.
theological_decisions:
- issue: 야훼라는 하나님의 이름을 본문에 직접 반영할지 여부
  chosen_reading: 본문에 고유명 ‘야훼’를 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 אָנֹכִי가 아닌 יְהוָה를 직접 사용하므로, 칭호로 완화하지 않고 하나님의 언약 이름을 드러내는 것이 원문 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
