source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
  footnotes:
  - marker: a
    text: Or 'Hear disputes among your brothers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'judge justly.' The Hebrew uses the noun צֶדֶק (tsedeq), which can carry the sense of both righteousness and justice in judicial contexts.
    reason: lexical_alternative
  - marker: c
    text: Or 'the resident alien with him' or 'the foreigner residing with him.' The Hebrew גֵּר (ger) refers to a non-native resident living among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 여러분의 재판관들에게 명령하여 말했습니다. “여러분의 형제들 사이의 사건을 들으십시오. 그리고 한 사람과 그의 형제 사이, 또는 그와 함께 있는 거류민 사이에서 의롭게 판결하십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제들 사이의 분쟁을 들으십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의롭게 판결하십시오.’ 히브리어 צֶדֶק(tsedeq)은 법정 문맥에서 의와 정의의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그와 함께 사는 거류 외국인’ 혹은 ‘그와 함께 거주하는 외국인.’ 히브리어 גֵּר(ger)는 이스라엘 가운데 사는 비토착 거주자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  english_pob_choice: I commanded
  chosen_korean: 내가 … 명령하여
  alternatives_korean:
  - 내가 … 지시하여
  - 내가 … 명하여
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 뜻하므로, 모세의 법적 권위를 살리는 ‘명령하여’가 가장 직접적입니다.
- source_word: שֹׁפְטֵיכֶם
  english_pob_choice: your judges
  chosen_korean: 여러분의 재판관들에게
  alternatives_korean:
  - 여러분의 판관들에게
  - 여러분의 판사들에게
  lexicon: HALOT
  rationale: 법정 문맥의 שׁפט는 재판을 맡은 사람을 가리키므로, 현대 한국어에서는 ‘재판관’이 가장 자연스럽고 기능적으로 가깝습니다.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  english_pob_choice: Hear cases between your brothers
  chosen_korean: 여러분의 형제들 사이의 사건을 들으십시오
  alternatives_korean:
  - 여러분의 형제들 사이의 분쟁을 들으십시오
  - 여러분의 형제들 사이에서 들으십시오
  lexicon: HALOT
  rationale: שמע는 단순 청취보다 재판적 ‘청문’을 뜻하므로 ‘사건을 들으십시오’로 풀어 법정 맥락을 분명히 했습니다.
- source_word: צֶדֶק
  english_pob_choice: righteously
  chosen_korean: 의롭게 판결하십시오
  alternatives_korean:
  - 공정하게 판결하십시오
  - 정당하게 판결하십시오
  lexicon: HALOT
  rationale: צֶדֶק은 이 문맥에서 판결의 방식과 기준을 나타내므로, ‘의롭게’로 옮겨 도덕적·법적 뉘앙스를 함께 살렸습니다.
- source_word: גֵּרוֹ
  english_pob_choice: the resident foreigner with him
  chosen_korean: 그와 함께 있는 거류민
  alternatives_korean:
  - 그와 함께 사는 외국인
  - 그와 함께 있는 거주 외국인
  lexicon: HALOT
  rationale: גֵּר는 단순한 외국인이 아니라 공동체 안에 정착해 사는 타지 거주자를 가리키므로, POB의 의미를 살려 ‘거류민’으로 번역했습니다.
theological_decisions:
- issue: אֲחֵיכֶם / אָחִיו의 남성형 친족 언어
  chosen_reading: 형제들 / 그의 형제
  alternative_readings:
  - 동포들 / 그의 동료
  - 이스라엘 사람들 / 그의 이웃
  rationale: 원문은 남성 복수·단수 친족어를 사용하므로, 그 결을 지우지 않고 공동체적 법 질서를 드러내는 ‘형제들 / 그의 형제’를 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
- issue: צֶדֶק의 משפט적 의미
  chosen_reading: 의롭게 판결하십시오
  alternative_readings:
  - 공의롭게 판결하십시오
  - 정의롭게 판결하십시오
  rationale: צֶדֶק은 법정 문맥에서 ‘의/정의’가 겹치지만, 동사 ‘판결하다’와 결합해 결과보다 판결의 정당성을 강조하는 ‘의롭게’가 가장 균형적입니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
