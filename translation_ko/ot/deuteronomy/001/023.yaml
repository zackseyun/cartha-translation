theological_decisions:
- issue: 모세의 평가 표현을 어떻게 옮길지
  chosen_reading: “그 말이 내 눈에 좋게 여겨졌으므로”로 옮겨, 단순한 감정이 아니라 제안의 적절성에 대한 승인이라는 뜻을 유지했습니다.
  alternative_readings:
  - 그 말이 마음에 들었으므로
  - 그 일이 좋았으므로
  rationale: 본문은 제안 자체에 대한 평가를 말하므로, 개인적 기분보다 판단·승인의 뉘앙스를 보존했습니다.
  doctrine_reference: 본문 해석상 의미 보존 원칙
- issue: 남성 복수 표현의 번역
  chosen_reading: שְׁנֵים עָשָׂר אֲנָשִׁים을 “열두 사람”보다 “열두 사람, 곧 각 지파마다 한 사람씩”으로 풀어, 대표 선발의 기능을 드러냈습니다.
  alternative_readings:
  - 열두 남자
  - 열두 사람
  rationale: 대상은 대표로 뽑힌 인물들이므로, 수사적 핵심은 성별보다 대표성에 있습니다. 이어지는 분배구를 함께 살리는 것이 본문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 본문 문맥의 대표 선출 의미
