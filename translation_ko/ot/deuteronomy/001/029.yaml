  text: Then I said to you, ‘Do not be terrified of them, and do not fear them.’
translation:
  language: ko
  text: 그때 내가 여러분에게 말했습니다. ‘그들을 두려워하지 말고, 그들 때문에 무서워하지 마십시오.’[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 두 개의 서로 다른 두려움 동사를 나란히 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: לֹא תַעַרְצוּן
  english_pob_choice: Do not be terrified
  chosen_korean: “두려워하지 말고”
  alternatives_korean:
  - “겁내지 말고”
  - “무서워하지 말고”
  lexicon: עָרַץ
  rationale: 히브리어 עָרַץ는 단순한 감정적 두려움보다 강한 위축·공포를 가리켜, POB의 “be terrified”를 한국어로는 “두려워하다”로 옮기되 자연스럽게 “두려워하지 말고”로 표현했습니다.
- source_word: וְלֹא תִירְאוּן
  english_pob_choice: and do not fear
  chosen_korean: “무서워하지 마십시오”
  alternatives_korean:
  - “두려워하지 마십시오”
  - “겁내지 마십시오”
  lexicon: יָרֵא
  rationale: 같은 ‘두려움’ 어휘를 반복하되, 앞 절의 표현과 구분을 살려 두 번째는 ‘무서워하다’로 옮겨 히브리어의 병렬 금지를 한국어에서도 드러냈습니다.
- source_word: מֵהֶם
  english_pob_choice: of them
  chosen_korean: “그들 때문에”
  alternatives_korean:
  - “그들을”
  - “그들로부터”
  lexicon: מִן + הֵם
  rationale: 히브리어 전치사 מן은 여기서 두려움의 원인/대상을 가리키므로, 한국어에서는 자연스럽게 원인 의미를 살린 “그들 때문에”로 풀었습니다.
theological_decisions:
- issue: 두 개의 두려움 금지 표현을 어떻게 살릴지
  chosen_reading: 본문의 이중 금지를 그대로 유지해, 단순 중복이 아니라 공포와 위축을 모두 배제하는 강조로 보이게 했습니다.
  alternative_readings:
  - 한 번만 “두려워하지 마십시오”로 단순화
  - 둘째 절을 생략
  rationale: 히브리어는 서로 다른 동사와 부정 병렬을 사용하므로, 한국어에서도 두 번의 금지를 유지하는 것이 원문의 강조를 가장 잘 보존합니다.
  doctrine_reference: 문법·수사적 평행 구조 보존
- issue: 발화 화자와 청중 호칭
  chosen_reading: 모세의 회고 발화로서 1인칭 과거와 2인칭 복수 대상을 자연스럽게 살렸습니다.
  alternative_readings:
  - 직설적 현재형
  - 존대 생략
  rationale: 본문 서술의 회상적 성격을 살려 ‘그때 내가 여러분에게 말했습니다’로 옮기면, 화자-청중 관계가 분명해집니다.
  doctrine_reference: 서사적 시점 보존
