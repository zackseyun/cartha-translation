lexical_decisions:
- source_word: וַתַּעֲנוּ אֹתִי
  english_pob_choice: And you answered me
  chosen_korean: 너희가 내게 대답하여
  alternatives_korean:
  - 너희가 나에게 응답하여
  - 너희가 내게 답하여
  lexicon: WLC/HALOT
  rationale: 동사 ענה의 대화 맥락상 ‘대답하다’가 가장 직접적이며, 목적어 ‘내게’를 살려 화자-응답 구조를 분명히 했습니다.
- source_word: וַתֹּאמְרוּ
  english_pob_choice: and said
  chosen_korean: 말하기를
  alternatives_korean:
  - 그리고 말하여
  - 또 말하여
  lexicon: WLC/HALOT
  rationale: 히브리어의 연결된 발화를 한국어에서 자연스럽게 이어 주되, 응답 내용 도입이라는 기능을 유지했습니다.
- source_word: טוֹב הַדָּבָר
  english_pob_choice: The thing ... is good
  chosen_korean: 그 일은 ... 좋습니다
  alternatives_korean:
  - 그 말은 ... 좋습니다
  - 그 제안은 ... 좋습니다
  lexicon: WLC/HALOT
  rationale: דָּבָר는 여기서 앞서 제시된 말/사안을 가리키므로 ‘그 일’이 너무 특정한 해석을 덧붙이지 않으면서도 한국어에서 자연스럽습니다.
- source_word: דִּבַּרְתָּ לַעֲשׂוֹת
  english_pob_choice: you have spoken ... to do / for us to do
  chosen_korean: 당신이 말한 ... 우리가 행하기에
  alternatives_korean:
  - 당신이 말씀하신 ... 우리가 하기에
  - 당신이 말한 ... 우리가 시행하기에
  lexicon: WLC/HALOT
  rationale: 완료 동사 ‘말한’은 이미 제시된 발화를 가리키고, לַעֲשׂוֹת는 단순한 ‘하기’보다 ‘행하다’가 다소 더 공식적이고 문어적인 대응입니다.
theological_decisions:
- issue: 모세에 대한 직접 호칭의 재현
  chosen_reading: ‘당신이 말한’으로 높임말을 사용해, 청자에게 전달된 공적 응답의 격식을 살렸습니다.
  alternative_readings:
  - ‘네가 말한’
  - ‘말한 바가’
  rationale: 본문은 이스라엘의 집단적 응답을 기록한 서술이므로, 한국어 합쇼체로 공적·서술적 톤을 유지하는 편이 적절합니다.
  doctrine_reference: 번역 문체와 담화 등록
