source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
  footnotes:
  - marker: a
    text: Or, more literally, 'for I am not in your midst.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lest you be defeated before your enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 저에게[a] 말씀하셨습니다. “그들에게 말하십시오. 올라가지도 말고 싸우지도 마십시오. 내가 너희 가운데 있지 않으니[b], 너희는 원수들 앞에서 쓰러질 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내게’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용해 언약적 신명 자체를 드러냈습니다.
- source_word: אֱמֹר לָהֶם
  english_pob_choice: Tell them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
  - 그들에게 이르십시오
  - 그들에게 말하시오
  lexicon: HALOT
  rationale: 명령형 전달을 한국어에서 가장 자연스럽고 공손하게 옮기기 위해 ‘말하십시오’를 택했습니다.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  english_pob_choice: Do not go up or fight
  chosen_korean: 올라가지도 말고 싸우지도 마십시오
  alternatives_korean:
  - 올라가지 마십시오. 그리고 싸우지 마십시오
  - 올라가거나 싸우지 마십시오
  lexicon: HALOT
  rationale: עלה와 לחם의 군사적 금지 명령을 한국어로 간명하게 살리면서도, 영어 POB의 결합된 금지 어감을 반영했습니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: I am not among you
  chosen_korean: 내가 너희 가운데 있지 않으니
  alternatives_korean:
  - 내가 너희 가운데에 없으니
  - 내가 너희 한가운데 있지 않으니
  lexicon: HALOT
  rationale: 직역의 ‘너희 가운데’로 하나님의 임재 부재를 보존하되, 한국어로 자연스럽게 풀어 썼습니다.
- source_word: וְלֹא תִּנָּגְפוּ
  english_pob_choice: lest you be struck down
  chosen_korean: 너희가 … 쓰러지지 않도록
  alternatives_korean:
  - 너희가 … 패하지 않도록
  - 너희가 … 맞아 쓰러지지 않도록
  lexicon: HALOT
  rationale: נגשף의 피동적 ‘맞아 쓰러짐/패배’의 경고를 살리기 위해 단순 미래 부정이 아니라 목적·방지형으로 옮겼습니다.
theological_decisions:
- issue: יַהְוֶה의 한국어 표기
  chosen_reading: 본문에서는 ‘야훼’로 표기해 언약적 신명성을 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 직접 발화를 포함하므로, 익숙한 대체어보다 고유 신명을 보존하는 편이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 마지막 절의 경고 뉘앙스
  chosen_reading: ‘너희가 원수들 앞에서 쓰러지지 않도록’으로 결과 경고를 드러냈습니다.
  alternative_readings:
  - 너희가 원수들 앞에서 패하지 않도록
  - 너희가 원수들 앞에서 쓰러질 것이다
  rationale: 히브리어는 출정 금지의 이유를 제시하는 경고 문맥이므로, 한국어에서도 단순 진술이 아니라 방지/경고 구조로 유지했습니다.
  doctrine_reference: 문맥-통사적 경고 표현
