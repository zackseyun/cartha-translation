    text: 히브리어의 표현은 이동에 걸리는 시간을 나타내는 관용구로, 직역하면 ‘열한 날의 길’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 호렙은 이 본문에 나오는 히브리어 지명이며, 흔히 시내산과 연관됩니다.
    reason: alternative_reading
