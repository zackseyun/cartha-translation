base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
  footnotes:
  - marker: a
    text: Or 'the Amorite'—Hebrew singular used collectively for the Amorite population; the plural sense is reflected by the following plural verbs.
    reason: lexical_alternative
  - marker: b
    text: Or 'that mountain'; here 'hill country' reflects the regional sense of the Hebrew word.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 산지에 살던 아모리 사람들이 나와 여러분을 맞으러 와서, 벌들이 하듯이 여러분을 추격하고 세일에서 호르마까지 여러분을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아모리 사람’ 단수형을 쓰지만, 뒤의 복수 동사들은 아모리 사람들 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산’은 여기서 개별 산봉우리보다 ‘산지’라는 지역 의미를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 그 아모리 사람들
  alternatives_korean:
  - 아모리족
  - 아모리 사람
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 뒤의 복수 동사들이 집단 전체를 가리키므로, 복수 집단을 드러내는 한국어 복수 표현이 더 정확합니다.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  english_pob_choice: who lived in that hill country
  chosen_korean: 그 산지에 살고 있던 그곳
  alternatives_korean:
  - 그 산에 살고 있던
  - 그 산지에 거주하던
  lexicon: HALOT
  rationale: הַר는 여기서 단일 ‘산’보다 지역 전체인 ‘산지’로 읽는 것이 자연스럽고, 참여분사 구문은 ‘살고 있던’으로 옮겨 지속된 거주를 나타냈습니다.
- source_word: לִקְרַאתְכֶם
  english_pob_choice: to meet you
  chosen_korean: 여러분을 맞서 와서
  alternatives_korean:
  - 여러분을 만나러 와서
  - 여러분과 맞닥뜨리러
  lexicon: HALOT
  rationale: 직역적 ‘맞으러/만나러’보다 문맥상 적대적 대면을 드러내야 하므로, 기본 의미를 유지하면서 충돌 뉘앙스를 살린 표현을 택했습니다.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  english_pob_choice: as bees do
  chosen_korean: 벌들이 하듯
  alternatives_korean:
  - 벌이 하듯
  - 벌들이 하는 것처럼
  lexicon: HALOT
  rationale: 비유의 관용적 힘을 살리되 과도한 설명을 덧붙이지 않기 위해, 짧고 생생한 ‘벌들이 하듯’으로 옮겼습니다.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  english_pob_choice: they struck you down
  chosen_korean: 여러분을 쳤습니다
  alternatives_korean:
  - 여러분을 내리쳤습니다
  - 여러분을 무찔렀습니다
  lexicon: HALOT
  rationale: כתת의 폭력성과 패배의 결과를 담되, 전투 서술의 직접성을 유지하기 위해 ‘쳤습니다’를 사용했습니다.
theological_decisions:
- issue: 적대적 동사구 לִקְרַאתְכֶם의 뉘앙스
  chosen_reading: 단순한 ‘만남’이 아니라 적대적 대면을 뜻하는 것으로 읽어 ‘맞서 와서’로 옮겼습니다.
  alternative_readings:
  - 여러분을 만나러 와서
  - 여러분을 대하러 와서
  rationale: 문맥 전체가 공격과 패주를 묘사하므로, 어휘의 기본 의미를 지키면서도 전투적 긴장을 분명히 해야 합니다.
  doctrine_reference: 서사 문맥의 의미 우선 원칙
