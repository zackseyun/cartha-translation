  text: וַ/תֵּשְׁב֥וּ בְ/קָדֵ֖שׁ יָמִ֣ים רַבִּ֑ים כַּ/יָּמִ֖ים אֲשֶׁ֥ר יְשַׁבְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
  footnotes:
  - marker: a
    text: Hebrew literally, 'many days, like the days that you remained.' The final phrase is elliptical and may mean 'for a long time, as long as you had remained there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 여러분은 가데스에서 많은 날을 머물렀습니다. 곧 여러분이 거기 머물렀던 날수만큼입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  english_pob_choice: So you remained
  chosen_korean: 그러므로 여러분은 … 머물렀습니다
  alternatives_korean:
  - 그리고 여러분은 … 있었습니다
  - 그리하여 여러분은 … 거주하셨습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 살려 원인-결과 흐름을 '그러므로'로 옮기고, ישׁב는 문맥상 장기 체류를 뜻하므로 '머물렀습니다'가 가장 자연스럽습니다.
- source_word: בְּקָדֵשׁ
  english_pob_choice: at Kadesh
  chosen_korean: 가데스에서
  alternatives_korean:
  - 가데스에
  - 가데스 안에
  lexicon: HALOT
  rationale: 지명은 음역하고, 장기 체류의 장소 표시는 한국어에서 '에서'가 가장 무난합니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: many days
  chosen_korean: 많은 날을
  alternatives_korean:
  - 오랜 날을
  - 긴 시간을
  lexicon: HALOT
  rationale: 히브리어의 '많은 날들'이라는 직설적 표현을 살리되, 한국어에서는 목적격으로 풀어 자연스럽게 읽히도록 했습니다.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  english_pob_choice: like the days that you remained there
  chosen_korean: 곧 여러분이 거기 머물렀던 날수만큼입니다
  alternatives_korean:
  - 여러분이 거기 머물렀던 날들처럼입니다
  - 여러분이 거기 머물렀던 기간만큼입니다
  lexicon: HALOT
  rationale: כ-의 비교/기준 감각과 생략된 반복 구조를 반영해 '날수만큼'으로 옮겼고, '거기'는 앞의 가데스를 받도록 보충했습니다.
