revisions:
- from: 우리가 어디로 올라가겠습니까? 우리 형제들이 우리 마음을 녹였습니다[a]. 그들이 말하기를 ‘그 백성은 우리보다 더 크고 키가 크며, 성읍들은 크고 하늘에 닿도록 견고하고, 게다가 우리[e]는 거기서 아낙 자손들을 보았습니다.’
  to: 우리가 어디로 올라가겠습니까? 우리 형제들이 우리 마음을 녹였습니다[a]. 그들이 이렇게 말했습니다. “그 백성은 우리보다 더 크고 키가 크며, 성읍들은 크고 하늘에 닿을 만큼 요새화되어 있으며[b], 게다가 우리는 거기서 아낙 자손들을 보았습니다[c].”
  rationale: 삭제되지 않은 [e] 앵커를 제거하고, 원문의 세 주석상 핵심(마음이 녹음, 하늘까지의 요새화라는 과장, 아낙 자손)을 한국어 본문과 주석에서 일관되게 처리했습니다. 직접 인용 안의 ‘우리는’은 보고를 한 형제들의 시점을 반영하므로 유지했습니다.
