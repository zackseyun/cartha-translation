id: DEU.1.28
reference: Deuteronomy 1:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
  footnotes:
  - marker: a
    text: Or 'have made our hearts melt'; that is, 'have discouraged us.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fortified in the heavens,' a hyperbolic expression for extremely high fortifications.
    reason: cultural_note
  - marker: c
    text: Or 'Anakites' or 'descendants of Anak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 어디로 올라가겠습니까? 우리 형제들이 우리 마음을 녹였습니다[a]. 그들이 이렇게 말했습니다. “그 백성은 우리보다 더 크고 키가 크며, 성읍들은 크고 하늘에 닿을 만큼 요새화되어 있으며[b], 게다가 우리는 거기서 아낙 자손들을 보았습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 마음을 녹였다’입니다. 곧 우리를 낙심시켰다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘하늘에 있는/하늘까지 요새화된’이라는 과장적 표현으로, 성읍의 방어 시설이 매우 높다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘아낙 사람들’ 또는 ‘아낙의 후손들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  english_pob_choice: Where are we going up?
  chosen_korean: 우리가 어디로 올라가겠습니까?
  alternatives_korean:
  - 우리는 어디로 올라갑니까?
  - 어디로 우리가 올라가겠습니까?
  lexicon: HALOT
  rationale: אָנָה의 방향 질문과 עֹלִים의 이동 이미지를 살리되, 한국어에서는 자연스러운 합쇼체 의문문으로 옮겼습니다.
- source_word: הֵמַסּוּ אֶת לְבָבֵנוּ
  english_pob_choice: have melted our hearts
  chosen_korean: 우리 마음을 녹였습니다
  alternatives_korean:
  - 우리 마음을 녹여 버렸습니다
  - 우리를 낙심시켰습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘마음을 녹이다’라는 비유를 보존해 감정적·용기 상실의 이미지를 드러냈습니다.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  english_pob_choice: The people are greater and taller than we are
  chosen_korean: 그 백성은 우리보다 더 크고 키가 크며
  alternatives_korean:
  - 그 백성은 우리보다 더 크고 높으며
  - 그 백성은 우리보다 더 عظ대하고 키가 크며
  lexicon: HALOT
  rationale: גָּדוֹל은 크기/위대함을, רָם은 키가 큰 상태를 가리키므로 두 요소를 분리해 자연스럽게 표현했습니다.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  english_pob_choice: the cities are great and fortified up to the heavens
  chosen_korean: 성읍들은 크고 하늘에 닿도록 견고하고
  alternatives_korean:
  - 성읍들은 크고 하늘까지 견고하며
  - 성읍들은 크고 하늘에 이르도록 요새화되어 있고
  lexicon: HALOT
  rationale: בַּשָּׁמָיִם의 과장법을 직역보다 완화된 한국어 관용으로 살리되, ‘하늘에 닿도록’으로 높은 성벽의 과장을 유지했습니다.
- source_word: וְגַם
  english_pob_choice: and besides
  chosen_korean: 게다가
  alternatives_korean:
  - 또한
  - 그리고
  lexicon: HALOT
  rationale: 보고된 말에 추가되는 부담스러운 정보를 누적하는 뉘앙스를 한국어 관용으로 옮겼습니다.
- source_word: בְּנֵי עֲנָקִים
  english_pob_choice: the sons of the Anakim
  chosen_korean: 아낙 자손들
  alternatives_korean:
  - 아낙 사람들
  - 아낙 사람의 자손들
  lexicon: HALOT
  rationale: 히브리어의 민족명/계보 표현을 살리면서도 한국어에서 이해하기 쉬운 고유 집단명으로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문 안의 화자 시점과 보고체 유지
  chosen_reading: 모세의 보고문 안에서 회중의 두려움을 간접인용으로 유지해, 본문의 비난적·경고적 효과를 살렸습니다.
  alternative_readings:
  - 직접화법을 더 줄여 서술형으로 평탄화하는 번역
  - 해석을 덧붙여 ‘낙심시켰다’로 의미만 제시하는 번역
  rationale: 본문은 불신의 보고가 공동체를 무너뜨린 장면이므로, 비유와 인용 구조를 유지하는 편이 수사적 충격을 보존합니다.
  doctrine_reference: 신명기 1장의 불신앙 경고와 공동체 책임
- issue: ‘하늘에 닿도록’의 과장법 처리
  chosen_reading: 형용사적 과장법을 사실 묘사로 낮추지 않고, 거대한 성읍에 대한 공포의 언어로 살렸습니다.
  alternative_readings:
  - ‘매우 높다’로 의미만 평탄화
  - ‘하늘까지 닿았다’로 과도하게 문자화
  rationale: 히브리어의 과장 표현은 두려움의 심리와 보고의 왜곡된 체감을 드러내므로, 그 수사성을 보존하는 것이 본문 의도에 맞습니다.
  doctrine_reference: 성경 히브리어의 수사적 과장법
