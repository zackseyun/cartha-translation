  - severity: low
    issue: ‘크게 번성하게 하셨습니다’는 הִרְבָּה의 기본 의미보다 의역적입니다.
    rationale: Hiphil רבה는 이 문맥에서 백성을 ‘많게 하다, 수를 늘리다’라는 뜻입니다. ‘많게 하셨습니다’가 더 직접적입니다.
  - severity: low
