  text: 여러분의 하나님 야훼께서 여러분을 많게 하셨습니다. 보십시오, 오늘 여러분은 하늘의 별처럼 수가 많습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC; POB divine-name convention
  rationale: 원문은 신적 칭호가 아니라 여호와의 고유명사 יְהוָה를 사용하므로, 한국어도 전통적 대치어인 ‘여호와’나 칭호인 ‘주님’이 아니라 학술적 음역 ‘야훼’로 옮겨 이름 자체를 보존했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 여러분의 하나님
  - 너희의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유격을 현대 합쇼체에 맞게 공손하게 풀어 ‘당신들의 하나님’으로 옮겼고, 언약 맥락의 יח singular title을 ‘하나님’으로 유지했습니다.
- source_word: הִרְבָּה
  english_pob_choice: has multiplied
  chosen_korean: 크게 번성하게 하셨습니다
  alternatives_korean:
  - 증가시키셨습니다
  - 많게 하셨습니다
  lexicon: HALOT
  rationale: Hiphil의 ‘많게 하다/번성시키다’라는 원뜻을 살리면서, 집단이 크게 불어난 결과를 한국어에서 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  english_pob_choice: as numerous as the stars of the heavens
  chosen_korean: 하늘의 별들처럼 수가 많아졌습니다
  alternatives_korean:
  - 하늘의 별들처럼 많아졌습니다
  - 하늘의 별같이 무수합니다
  lexicon: HALOT
  rationale: 비교구문과 ‘לָרֹב’의 수적 다수를 자연스럽게 결합해, 직역의 어색함 없이 ‘하늘의 별들처럼 수가 많아졌습니다’로 재현했습니다.
