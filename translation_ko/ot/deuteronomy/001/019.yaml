  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
  footnotes:
  - marker: a
    text: Or 'great and terrible wilderness.' The Hebrew adjective can denote that which inspires fear, awe, or dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리는 호렙을 떠나, 여러분이 보았던 그 크고 두려운 광야[a] 전체를 지나 아모리 사람들의 산지로 가는 길을 따라, 야훼 우리 하나님께서 우리에게 명령하신 대로 갔습니다. 그리고 우리는 가데스-바네아까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘크고 무서운 광야’로 옮길 수 있습니다. 히브리어 형용사는 두려움, 경외, 공포를 불러일으키는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע
  english_pob_choice: we set out
  chosen_korean: 우리는 떠났습니다
  alternatives_korean:
  - 우리는 길을 떠났습니다
  - 우리는 출발했습니다
  lexicon: HALOT
  rationale: נסע의 핵심은 진영을 걷고 이동을 시작하는 것이므로, ‘떠났습니다’가 출발 동작을 간결하고 자연스럽게 살립니다.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  english_pob_choice: and went through all that great and fearsome wilderness
  chosen_korean: 그 큰 두려운 광야[a]를 지나
  alternatives_korean:
  - 그 광야 전체를 지나
  - 그 온 광야를 지나
  lexicon: HALOT
  rationale: הלך와 목적격 표지는 단순한 ‘갔습니다’보다 ‘지나’가 광야를 횡단했다는 의미를 더 정확히 드러냅니다.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  english_pob_choice: great and fearsome
  chosen_korean: 큰 두려운
  alternatives_korean:
  - 크고 두려운
  - 크고 무서운
  lexicon: HALOT
  rationale: גָּדוֹל은 ‘큰’으로, נוֹרָא는 경외와 두려움을 일으키는 성격을 살려 ‘두려운’으로 옮겼습니다. '무서운'보다 서술문에 덜 구어적입니다.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  english_pob_choice: on the way to the hill country of the Amorites
  chosen_korean: 아모리 사람들의 산지로 가는 길을 따라
  alternatives_korean:
  - 아모리 사람들의 산지 쪽으로 가는 길에서
  - 아모리 사람들의 산지를 향한 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 목적지를 향한 ‘길’이며, הַר은 단일 산보다 집합적 ‘산지’가 자연스럽습니다. ‘따라’는 이동 경로의 뉘앙스를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 절대역으로는 신성호칭 대체어 ‘주’보다 고유명사인 야훼를 유지해 स्रोत의 직접성을 보존합니다.
theological_decisions:
- issue: 여호와/야훼 신명 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 음역하고, ‘우리 하나님’과 병렬 구조를 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 출애굽-언약 문맥에서 신명은 단순 호칭이 아니라 계시된 이름이므로, 대체어로 바꾸지 않고 고유명칭을 살리는 편이 본문 의도를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
