  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
  footnotes:
  - marker: a
    text: Or 'would be prey' or 'would become spoil.'
    reason: lexical_alternative
  - marker: b
    text: '''Do not know good or evil'' is a Hebrew expression for lacking mature discernment.'
    reason: cultural_note
  - marker: c
    text: Or 'they shall inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분의 어린아이들[a], 곧 여러분이 노략물이 될 것이라고 말한 그 아이들과, 오늘날 선과 악을 알지 못하는 여러분의 자녀들은 그곳으로 들어갈 것입니다. 내가 그들에게 그것을 주겠으며[c][b], 그들은 그것을 차지할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노리개가 될’ 또는 ‘노획물이 될’.
    reason: lexical_alternative
  - marker: b
    text: ‘선과 악을 알지 못한다’는 히브리어 관용구로, 성숙한 분별력이 아직 없다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들이 그것을 기업으로 받을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  english_pob_choice: your little ones
  chosen_korean: 여러분의 어린아이들
  alternatives_korean:
  - 여러분의 자녀들
  - 여러분의 어린 것들
  lexicon: HALOT
  rationale: טַף는 단순한 자녀 일반보다 어린아이들/연약한 부양 자녀를 가리키므로, 약한 처지를 드러내는 표현을 살렸습니다.
- source_word: לָבַז יִהְיֶה
  english_pob_choice: would become plunder
  chosen_korean: 노략물이 될 것이라고
  alternatives_korean:
  - 전리품이 될 것이라고
  - 노획물이 될 것이라고
  - 약탈물이 될 것이라고
  lexicon: HALOT
  rationale: בַּז는 적에게 빼앗기는 전리품/노략물의 뜻이어서, 현대 한국어에서 가장 직접적인 ‘노략물’로 옮겼습니다.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  english_pob_choice: who today do not know good or evil
  chosen_korean: 오늘날 선과 악을 알지 못하는
  alternatives_korean:
  - 오늘날 선악을 분별하지 못하는
  - 오늘 선과 악을 알지 못하는
  lexicon: HALOT
  rationale: 이 표현은 미성숙한 분별력의 관용구이므로, 해석을 과도하게 풀지 않고 원문의 관용적 구조를 유지했습니다.
- source_word: יִירָשׁוּהָּ
  english_pob_choice: they shall possess it
  chosen_korean: 그들은 그것을 차지할 것입니다
  alternatives_korean:
  - 그들은 그것을 소유할 것입니다
  - 그들은 그것을 기업으로 받을 것입니다
  - 그들은 그것을 물려받을 것입니다
  lexicon: HALOT
  rationale: 여기서는 약속된 땅을 실제로 점유하고 차지하는 뜻이 강조되므로, ‘차지하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: “선과 악을 알지 못하는” 표현의 신학적 함의
  chosen_reading: 이 표현을 도덕적 미성숙/분별력 부족을 나타내는 히브리 관용구로 유지하고, 죄책 여부나 책임 연령에 대한 교리적 결론은 내리지 않았습니다.
  alternative_readings:
  - 무죄 상태에 대한 진술
  - 언약적 책임 면제의 진술
  rationale: 본문은 다음 세대와 멸망받는 성인 세대를 대비하지만, 관용구 자체가 후대의 책임 연령 논쟁을 결정하지는 않으므로 문구를 보존해 긴장을 남겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
