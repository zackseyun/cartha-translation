translation:
  language: ko
  text: 예분네의 아들 갈렙만은 그 땅을 볼 것입니다. 내가 그가 밟은 땅을 그와 그의 아들들에게[a] 줄 것입니다. 이는 그가 야훼를 온전히 따랐기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 자녀들’이나 ‘그의 후손들’; 히브리어는 문자적으로 ‘그의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  english_pob_choice: except
  chosen_korean: ~만은 / 제외하고는
  alternatives_korean:
  - ~를 제외하고
  - ~를 빼고
  lexicon: HALOT
  rationale: 앞 문장의 판결에서 칼렙을 예외로 세우는 말이므로, 한국어에서는 자연스럽고 분명한 예외 표시인 ‘~만은’으로 옮겼습니다.
- source_word: יִרְאֶ֔/נָּה
  english_pob_choice: he shall see it
  chosen_korean: 그 땅을 볼 것입니다
  alternatives_korean:
  - 그 땅을 보게 될 것입니다
  - 그것을 볼 것입니다
  lexicon: HALOT
  rationale: 여성형 대명사 접미사는 바로 앞의 ‘땅’을 가리키므로, 목적어를 ‘그 땅’으로 드러내어 의미 연결을 분명히 했습니다.
- source_word: וּ/לְ/בָנָ֑י/ו
  english_pob_choice: and to his sons
  chosen_korean: 그의 아들들에게
  alternatives_korean:
  - 그의 자녀들에게
  - 그의 후손들에게
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘아들들’을 말하므로, 성별을 중화하지 않고 기본 의미를 보존했습니다.
- source_word: מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה
  english_pob_choice: he has fully followed Yahweh
  chosen_korean: 야훼를 온전히 따랐기
  alternatives_korean:
  - 야훼를 완전히 따랐기
  - 야훼를 끝까지 따랐기
  lexicon: HALOT
  rationale: 관용구 ‘뒤를 가득 채우다’는 충실한 추종을 뜻하므로, 이를 한국어의 자연스러운 표현인 ‘온전히 따르다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 인용된 본문이 직접적으로 언약 이름을 사용하므로, 프로젝트 기준에 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 칼렙에게 주어지는 약속의 범위
  chosen_reading: 칼렙 개인에게는 ‘그 땅을 볼 것’이라는 약속이, 그와 그의 아들들에게는 ‘그 땅을 받을 것’이라는 약속이 구분되어 제시됩니다.
  alternative_readings:
  - 문장 전체를 한 번에 풀어 ‘칼렙과 그의 자손이 그 땅을 볼 것이다’로 완화하는 읽기
  - ‘그의 아들들’을 ‘그의 자녀들/후손들’로 일반화하는 읽기
  rationale: 히브리어는 시각적 보상(볼 것)과 분배의 약속(주겠다)을 구분하므로, 그 구별을 흐리지 않도록 번역했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 Gender-accurate over gender-neutral
