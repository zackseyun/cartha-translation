  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
  footnotes:
  - marker: a
    text: Hebrew literally, 'you rebelled against the mouth of the LORD your God,' an idiom meaning to resist or defy his command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 올라가기를 원하지 않았고, 야훼 여러분의 하나님께 반역했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 문자적으로 ‘야훼 여러분의 하나님의 입을 거역했다’는 뜻으로, 곧 그의 명령을 거스른다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִיתֶם לַעֲלֹת
  english_pob_choice: you were not willing to go up
  chosen_korean: 올라가기를 원하지 않았고
  alternatives_korean:
  - 올라가기를 거부했고
  - 올라가기를 원치 않았고
  lexicon: HALOT
  rationale: אבה의 ‘기꺼이 하다/원하다’라는 뜻을 살려, 단순한 거절보다 의지의 부재를 드러내는 표현으로 옮겼습니다.
- source_word: וַתַּמְרוּ אֶת פִּי
  english_pob_choice: you rebelled against the command
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 명령을 거역했습니다
  - 말씀에 거슬렀습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입/말’은 명령에 대한 저항을 뜻하므로, 문맥의 강한 불순종을 직접 드러내는 ‘반역하다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֵי/כֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 야훼 여러분의 하나님님
  - 여호와 여러분의 하나님
  lexicon: DOCTRINE.md contested terms / HALOT
  rationale: 고유명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 2인칭 복수 소유격은 자연스러운 한국어로 ‘여러분의 하나님’으로 표현했습니다.
theological_decisions:
- issue: ‘וַתַּמְרוּ אֶת פִּי’의 관용구 처리
  chosen_reading: 직역적 이미지보다 의미 중심으로 ‘반역했습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘입을 거슬렀습니다’
  - ‘명령에 반항했습니다’
  rationale: 한국어에서 ‘입’ 이미지를 그대로 두면 의미가 흐려지므로, 본문의 핵심인 권위 거부를 분명히 전달하는 방향이 더 적절합니다.
  doctrine_reference: 문맥상 불순종과 권위 거부를 강조하는 신명기 내러티브
- issue: 여호와 명칭의 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 약정에 따라 신적 고유명사를 대체 титула가 아닌 고유명사로 유지해 원문 식별성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
