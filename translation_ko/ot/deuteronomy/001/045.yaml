id: DEU.1.45
reference: Deuteronomy 1:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
  footnotes:
  - marker: a
    text: Or 'did not hear your voice ... nor give ear to you.' The Hebrew uses two near-parallel verbs for hearing/listening, emphasizing that the LORD did not respond to their plea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 여러분은 돌아와서 야훼 앞에서 울었지만, 야훼께서는 여러분의 목소리를 들으시지 않았고 여러분에게 귀를 기울이지도 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 목소리를 듣지 않으시고 … 여러분에게 귀를 기울이지 않으셨습니다.’ 히브리어는 ‘듣다/귀를 기울이다’의 뜻을 가진 서로 가까운 두 동사를 나란히 써서, 야훼께서 그들의 간청에 응답하지 않으셨음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  english_pob_choice: Then you returned
  chosen_korean: 그러고 나서 여러분은 돌아와서
  alternatives_korean:
  - 그때 여러분은 돌아와서
  - 그리고 여러분은 돌아와서
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻인 ‘돌아오다/되돌아가다’를 자연스러운 서술로 살리면서, 서사 진행을 나타내는 הנַו-연속의 느낌은 ‘그러고 나서’로 옮겼습니다.
- source_word: וַתִּבְכּוּ
  english_pob_choice: and wept
  chosen_korean: 울었지만
  alternatives_korean:
  - 울었습니다
  - 통곡했지만
  lexicon: HALOT
  rationale: בכה는 기본적으로 ‘울다’이므로 과장 없이 평이한 동사를 택했습니다. 뒤의 부정 응답과의 대조를 드러내기 위해 문맥상 ‘-지만’을 사용했습니다.
- source_word: בְּקֹלְכֶם
  english_pob_choice: your voice
  chosen_korean: 여러분의 목소리
  alternatives_korean:
  - 여러분의 소리
  - 여러분이 한 말
  lexicon: HALOT
  rationale: קוֹל은 문자적으로 ‘목소리/소리’이므로, 청원 자체를 너무 풀지 않고 ‘목소리’로 옮겨 원문의 표현을 유지했습니다.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  english_pob_choice: or pay attention to you
  chosen_korean: 여러분에게 귀를 기울이지도 않으셨습니다
  alternatives_korean:
  - 여러분을 들으려 하지도 않으셨습니다
  - 여러분의 말을 들어주시지도 않았습니다
  lexicon: HALOT
  rationale: האזין은 단순히 듣는 것보다 ‘귀를 기울여 주의 깊게 듣다’의 뜻이 있으므로, 두 번째 평행동사를 중복 없이 자연스럽게 살려 ‘귀를 기울이지 않다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 대신 고유신명 יְהוָה를 쓰므로, 프로젝트 기본값에 따라 하나님의 고유명칭을 ‘야훼’로 일관되게 표기했습니다.
theological_decisions:
- issue: 두 동사의 평행을 어떻게 살릴 것인가
  chosen_reading: ‘듣지 않으셨습니다’와 ‘귀를 기울이지도 않으셨습니다’로 두 단계의 거절을 함께 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 ‘듣지 않으셨습니다’로 단순화하기
  - ‘응답하지 않으셨습니다’로 통합하기
  rationale: 히브리어는 שׁמע와 האזין의 근접 평행을 통해 간청에 대한 야훼의 비응답을 강조하므로, 같은 뜻으로 평평하게 만들지 않고 두 표현의 뉘앙스 차이를 보존했습니다.
  doctrine_reference: 본문의 수사적 평행법과 응답 거절의 강조
