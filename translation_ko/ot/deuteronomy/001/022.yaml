  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
  footnotes:
  - marker: a
    text: Or 'spy out the land for us.' The Hebrew verb can denote searching out or investigating; 'explore' was chosen as a clear modern rendering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the way by which we should go up in it.' 'Go up' reflects the common biblical idiom for ascending into the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희 모두가 내게 가까이 와서 말했습니다. ‘우리보다 앞서 사람들을 보내어, 그들이 우리를 위해 그 땅을 탐색하고[a] 우리가 그 땅으로 올라가야 할[b] 길과 우리가 들어갈 성읍들에 관하여 돌아와 우리에게 소식을 전하게 합시다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘탐색하다’ 또는 ‘정탐하다’로 옮길 수 있습니다. 여기서는 땅을 조사한다는 문맥에 따라 ‘탐색하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘우리가 그 안으로 올라가야 할 길’입니다. ‘올라가다’는 그 땅으로 들어가는 성경적 관용 표현을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  english_pob_choice: Then all of you came near to me
  chosen_korean: 너희 모두가 내게 가까이 와서
  alternatives_korean:
  - 너희 모두가 내게 다가와서
  - 너희 전원이 내게 와서
  lexicon: HALOT
  rationale: קָרַב의 기본 의미인 ‘가까이 오다/다가오다’를 살리면서, כֻּלְּכֶם의 포괄성을 ‘너희 모두’로 반영했습니다.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  english_pob_choice: Let us send men
  chosen_korean: 사람들을 보내어
  alternatives_korean:
  - 남자들을 보내어
  - 몇 사람을 보내어
  lexicon: HALOT
  rationale: 문맥상 정탐 임무를 맡는 인원을 가리키지만, 한국어에서는 남성성 강조보다 기능 중심의 ‘사람들’이 자연스럽습니다. 다만 번역은 ‘보내다’라는 명령형 제안을 분명히 유지했습니다.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  english_pob_choice: so that they may explore the land for us
  chosen_korean: 그들이 우리를 위해 그 땅을 탐색하고
  alternatives_korean:
  - 그들이 우리를 위해 그 땅을 정탐하고
  - 그들이 우리를 위해 그 땅을 살펴보고
  lexicon: HALOT
  rationale: חָפַר는 여기서 탐문·조사하다의 뜻이므로, POB의 ‘explore’를 따라 ‘탐색하다’로 옮겨 ‘정탐’보다 과도한 첩보 뉘앙스를 줄였습니다.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  english_pob_choice: and bring us back word
  chosen_korean: 우리에게 다시 소식을 전하게 합시다
  alternatives_korean:
  - 우리에게 보고하게 합시다
  - 우리에게 말을 돌려오게 합시다
  lexicon: HALOT
  rationale: 히필의 שׁוּב + דָּבָר는 ‘소식을/보고를 가져오다’의 관용이므로, 현대 한국어에서 자연스러운 ‘소식을 전하다’로 풀었습니다.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  english_pob_choice: of the way by which we should go up into it
  chosen_korean: 우리가 올라가야 할 길
  alternatives_korean:
  - 우리가 올라갈 길
  - 우리가 그 안으로 올라가야 할 길
  lexicon: HALOT
  rationale: עָלָה의 지형적 관용어인 ‘올라가다’를 유지해 땅에 들어가는 행위를 ‘오르다’로 드러냈습니다. ‘가야 할’은 조언·지시의 맥락을 반영합니다.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  english_pob_choice: and of the cities into which we shall come
  chosen_korean: 우리가 들어갈 성읍들
  alternatives_korean:
  - 우리가 들어가게 될 성읍들
  - 우리가 가게 될 도시들
  lexicon: HALOT
  rationale: עָרִים는 ‘도시’보다 성경적 지리맥락을 살리는 ‘성읍’이 적절하며, ‘into which we shall come’를 ‘들어갈’로 간결하게 반영했습니다.
theological_decisions:
- issue: 정탐 요청의 성격
  chosen_reading: 본문은 아직 실행이 아니라, 약속의 땅을 가기 위한 사전 조사 요청으로 읽었습니다.
  alternative_readings:
  - 군사적 정찰의 뉘앙스를 강하게 읽는 해석
  - 불신의 표출로만 읽는 해석
  rationale: 히브리어 동사 חָפַר와 문맥은 ‘탐색/조사’의 요청을 분명히 하며, 본문 자체는 명시적으로 동기 판단을 덧붙이지 않습니다.
  doctrine_reference: 본문 문맥 주해
- issue: ‘올라가다’의 유지
  chosen_reading: ‘올라가다’를 그대로 살려 가나안 입성과 관련된 성경적 공간 감각을 보존했습니다.
  alternative_readings:
  - ‘들어가다’로 완전히 평문화하는 번역
  - ‘상승하다’처럼 직역하는 번역
  rationale: 히브리어 עָלָה는 여기서 단순 이동이 아니라 약속의 땅으로 ‘오르다’는 관용을 지니므로, 평문화하되 핵심 이미지는 유지하는 것이 적절합니다.
  doctrine_reference: 성서 히브리어 관용법
