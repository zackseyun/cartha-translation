  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
  footnotes:
  - marker: a
    text: Or 'rashly went up' / 'presumptuously went up.' The Hebrew verb is rare and conveys overconfident or reckless action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the mountain'; in this context it likely refers more broadly to the hill country.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 당신들은 내게 대답하며 말했습니다. 「우리가 야훼께 죄를 지었습니다. 우리 자신이 올라가서 싸우겠습니다. 우리 하나님 야훼께서 우리에게 명령하신 모든 것에 따라 하겠습니다.」 그러고는 각 사람이 자기 전쟁 무기를 차고, 여러분은 무모하게 산지로 올라가려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘산’이지만, 문맥상 가나안의 산지 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  english_pob_choice: Then you answered and said to me
  chosen_korean: 그러자 당신들은 내게 대답하며 말했습니다
  alternatives_korean:
  - 그러자 여러분은 내게 대답하여 말했습니다
  - 그러자 당신들은 내게 응답하며 말했습니다
  lexicon: WLC + discourse context
  rationale: 대화의 응답 동작을 자연스럽게 살리되, 모세에게 하는 직접 발화를 분명히 드러내기 위해 ‘내게 대답하며 말했습니다’로 옮겼습니다.
- source_word: חָטָאנוּ לַיהוָה
  english_pob_choice: We have sinned against Yahweh
  chosen_korean: 우리가 야훼께 죄를 지었습니다
  alternatives_korean:
  - 우리가 야훼께 범죄했습니다
  - 우리가 야훼께 죄를 범했습니다
  lexicon: HALOT
  rationale: ל + יְהוָה의 피해/대상 관계를 한국어의 ‘-께 죄를 지었습니다’로 자연스럽게 드러냈습니다. ‘야훼’는 본문의 고유신명 표기를 보존합니다.
- source_word: וְנִלְחַמְנוּ
  english_pob_choice: and fight
  chosen_korean: 그리고 싸우겠습니다
  alternatives_korean:
  - 그리고 전쟁하겠습니다
  - 그리고 전투하겠습니다
  lexicon: HALOT
  rationale: נלחם의 전투 참여 의미를 현대 한국어에서 가장 직접적으로 전달하는 동사로 ‘싸우겠습니다’를 택했습니다.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ יְהוָה אֱלֹהֵינוּ
  english_pob_choice: according to all that Yahweh our God commanded us
  chosen_korean: 우리 하나님 야훼께서 우리에게 명령하신 모든 것에 따라 하겠습니다
  alternatives_korean:
  - 우리 하나님 야훼께서 우리에게 명령하신 대로 하겠습니다
  - 야훼 우리 하나님이 우리에게 명하신 모든 대로 하겠습니다
  lexicon: HALOT
  rationale: ‘כְּכֹל אֲשֶׁר’의 포괄성을 살려 ‘모든 것에 따라’로 옮겼고, 주어-서술 관계를 분명히 하기 위해 ‘우리 하나님 야훼께서’로 정리했습니다.
- source_word: וַתַּחְגְּרוּ ... כְּלֵי מִלְחַמְתּוֹ
  english_pob_choice: Then each man strapped on his weapons of war
  chosen_korean: 그러고는 각 사람이 자기 전쟁 무기를 차고
  alternatives_korean:
  - 그러고는 각 사람이 자기 전쟁 도구를 차고
  - 그러고는 각 사람이 자기 무장을 하고
  lexicon: HALOT
  rationale: חגר의 ‘허리에 차다/장비하다’는 동작을 ‘차고’로 자연스럽게 살렸고, כְּלֵי מִלְחָמָה는 ‘전쟁 무기’로 비교적 직설적으로 옮겼습니다.
- source_word: הָהָרָה
  english_pob_choice: into the hill country
  chosen_korean: 산지로
  alternatives_korean:
  - 산으로
  - 산지로 올라가
  lexicon: HALOT
  rationale: 문맥상 단일한 산이 아니라 산지 전체를 가리키므로 ‘산지로’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기에서 직접 신명기 표기 יְהוָה를 사용하므로, 프로젝트 기준에 따라 신명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וַתָּהִינוּ의 부정적 뉘앙스
  chosen_reading: 무모하게 산지로 올라가려 했습니다
  alternative_readings:
  - 성급하게 산지로 올라갔습니다
  - 대담하게 산지로 올라갔습니다
  rationale: 문맥이 금지 후의 불순종과 자기확신을 드러내므로, 단순한 ‘올라갔습니다’보다 책임 있는 부정 평가가 드러나는 ‘무모하게’로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
