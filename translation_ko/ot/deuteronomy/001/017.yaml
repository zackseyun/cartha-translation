source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'recognize faces in judgment,' an idiom meaning to show partiality or favoritism.
    reason: lexical_alternative
  - marker: b
    text: Or 'You shall not be afraid before any man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 재판에서는 편파적으로 대하지 마십시오[a]. 작은 사람이나 큰 사람이나 똑같이 들으십시오. 어떤 사람 앞에서도 두려워하지 마십시오[b]. 재판은 하나님께 속한 것이기 때문입니다. 그리고 여러분에게 너무 어려운 일은 내게 가져오십시오. 내가 그것을 들을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘재판에서 얼굴들을 알아보다’라는 관용구로, 편파적 대우나 편애를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어떤 사람 앞에서도 무서워하지 마십시오’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  english_pob_choice: show partiality
  chosen_korean: 편파적으로 대하다
  alternatives_korean:
  - 얼굴을 알아보다
  - 사람을 봐주다
  - 치우치다
  lexicon: HALOT
  rationale: 법정 문맥의 관용구로서 ‘얼굴을 알아보다’의 직역보다, 판결에서 한쪽으로 기우는 의미를 분명히 드러내는 ‘편파적으로 대하다’가 원문의 법적·윤리적 힘을 가장 잘 살립니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: in judgment
  chosen_korean: 재판에서는
  alternatives_korean:
  - 판결에서는
  - 정의에서는
  - 소송에서는
  lexicon: HALOT
  rationale: 여기서 미슈파트는 추상적 ‘정의’보다 재판 행위를 가리키므로, 독자가 법정 상황을 즉시 이해할 수 있는 ‘재판’으로 옮겼습니다.
- source_word: כַּקָּטֹן כַּגָּדֹל תִּשְׁמָעוּן
  english_pob_choice: you shall hear the small and the great alike
  chosen_korean: 작은 사람이나 큰 사람이나 똑같이 들으십시오
  alternatives_korean:
  - 가난한 사람이나 부유한 사람이나 똑같이 들으십시오
  - 작은 자와 큰 자를 차별 없이 들으십시오
  lexicon: HALOT
  rationale: 사회적 지위가 낮고 높은 사람을 대비하는 표현이므로, 한국어에서도 자연스럽고 평이한 대비인 ‘작은 사람/큰 사람’을 사용해 차별 없는 청취를 분명히 했습니다.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  english_pob_choice: be intimidated by any man
  chosen_korean: 어떤 사람 앞에서도 두려워하지 마십시오
  alternatives_korean:
  - 어떤 사람에게도 위축되지 마십시오
  - 어떤 사람 앞에서도 겁내지 마십시오
  - 어떤 사람 때문에 두려워하지 마십시오
  lexicon: HALOT
  rationale: ‘두려워하다’의 일반 의미는 있으나, 법정에서 사람 앞에 위축되는 뉘앙스가 있어 자연스러운 현대어로 압축해 표현했습니다.
- source_word: הַמִּשְׁפָּט לֵאלֹהִים הוּא
  english_pob_choice: for the judgment belongs to God
  chosen_korean: 재판은 하나님께 속한 것이기 때문입니다
  alternatives_korean:
  - 판결은 하나님께 속해 있기 때문입니다
  - 재판권은 하나님께 있기 때문입니다
  lexicon: HALOT
  rationale: ‘belongs to God’의 소유·권위 개념을 한국어에서는 ‘~께 속한 것’으로 자연스럽게 옮겨, 재판의 최종 권위가 하나님께 있음을 분명히 했습니다.
theological_decisions:
- issue: ‘어떤 사람 앞에서도 두려워하지 마십시오’의 번역이 ‘편파적으로 대하지 마십시오’와 분리되는 이유
  chosen_reading: 두 개의 금지 명령을 각각 살려, 재판의 공정성과 사람에 대한 두려움이라는 서로 다른 왜곡을 모두 드러냈습니다.
  alternative_readings:
  - 한 문장으로 묶어 ‘아무도 편들지 말고 두려워하지 마십시오’
  - ‘어떤 사람을 봐주지 마십시오’로 통합
  rationale: 히브리어는 편파 금지와 사람을 두려워하는 금지를 병렬로 제시하므로, 한국어도 두 금지를 분리해 원문의 구조와 강조를 보존했습니다.
  doctrine_reference: 법적 공정성과 하나님 주권의 병렬 강조
