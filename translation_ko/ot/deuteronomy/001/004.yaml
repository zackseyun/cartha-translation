  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
  footnotes:
  - marker: a
    text: Or possibly, 'who lived in Ashtaroth and Edrei.' The Hebrew names both places with repeated 'in,' and the precise relationship between them is not fully explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 헤스본에 거주하던 아모리 족속의 왕 시혼과, 아스다롯과 에드레이에 거주하던 바산 왕 옥을 친 후에[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 지명 앞에 전치사 ‘에/에서’를 반복해 적고 있어, 정확히 ‘아스다롯과 에드레이’의 관계가 무엇인지는 분명하지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  english_pob_choice: after he had struck down
  chosen_korean: 그가 ... 친 후에
  alternatives_korean:
  - 그가 ... 무찌른 뒤에
  - 그가 ... 쳐서 이긴 후에
  - '...한 다음에'
  lexicon: HALOT
  rationale: אַחֲרֵי + 동사구는 앞선 사건의 완료를 나타내므로 한국어에서는 ‘친 후에’로 자연스럽게 순서를 살렸습니다. נכה의 강한 타격감을 살리기 위해 ‘무찌르다’보다 직접적인 ‘치다’를 택했습니다.
- source_word: מֶלֶךְ הָאֱמֹרִי
  english_pob_choice: king of the Amorites
  chosen_korean: 아모리 족속의 왕
  alternatives_korean:
  - 아모리인의 왕
  - 아모리 사람들의 왕
  lexicon: HALOT
  rationale: 히브리어의 민족명 속격을 현대 한국어에서는 ‘~족속의 왕’으로 옮겨 자연스럽고도 집단성을 분명히 드러냈습니다.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  english_pob_choice: who lived in Heshbon
  chosen_korean: 헤스본에 거주하던
  alternatives_korean:
  - 헤스본에 살던
  - 헤스본에 머물던
  - 헤스본에 거하던
  lexicon: HALOT
  rationale: יוֹשֵׁב는 단순한 ‘있다’보다 거주를 뜻하므로, 현대 문어체에서 격식을 유지하는 ‘거주하던’으로 옮겼습니다.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  english_pob_choice: who lived in Ashtaroth at Edrei
  chosen_korean: 아스다롯과 에드레이에 거주하던
  alternatives_korean:
  - 아스다롯에, 에드레이에 거주하던
  - 아스다롯에 있는 에드레이에 거주하던
  - 아스다롯과 에드레이에 살던
  lexicon: HALOT
  rationale: 두 번의 ב가 연속된 압축 구조는 정확한 지리 관계가 완전히 분명하지 않으므로, English POB의 보수적 판단을 따라 두 지명을 함께 제시하되 관계를 과도하게 풀지 않았습니다.
theological_decisions:
- issue: דַּק한 지리 관계의 불명확성
  chosen_reading: ‘아스다롯과 에드레이에 거주하던’으로 두 지명을 병렬 제시해 관계를 단정하지 않았습니다.
  alternative_readings:
  - ‘아스다롯에 있는 에드레이에 거주하던’
  - ‘아스다롯과 에드레이에서 거주하던’
  rationale: 본문의 반복된 전치사 구조는 장소 관계를 완전히 명시하지 않으므로, 해석을 좁히기보다 원문의 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: source transparency and textual humility
