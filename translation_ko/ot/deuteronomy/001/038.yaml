review_pass:
  verdict: revise
  source_fidelity: 본문은 여호수아가 모세 앞에 서 있으며 그가 그 땅에 들어가고, 모세가 그를 강하게 해야 하는 이유가 그가 이스라엘로 하여금 그 땅을 상속받게 할 것이기 때문이라는 뜻을 대체로 충실히 전달합니다. 다만 한국어 문장에서는 ‘곧 … 그가’의 중복이 부자연스럽고, ‘기업으로 얻게 하다’는 현대어로 다소 어색합니다.
  naturalness: ‘당신 앞에 서 있는 눈의 아들 여호수아, 바로 그가’로 어순을 정리하면 히브리어의 강조를 유지하면서도 자연스럽습니다. ‘유산으로 받게 하다’는 히필 נחל의 사역적 의미와 상속 의미를 현대 표준어로 분명하게 표현합니다.
  terminology: ‘여호수아’, ‘이스라엘’은 적절합니다. 원문의 명령 ‘강하게 하십시오’도 넓은 의미를 보존합니다. 각주에서 여호수아에게 주체 높임인 ‘주실/분배하실’을 쓰는 것은 본문 문체 및 높임법과 일관되지 않으므로 ‘줄/분배할’로 고칩니다.
  issues:
  - severity: low
    issue: 주어와 관계절의 중복
    rationale: ‘눈의 아들 여호수아, 곧 당신 앞에 서 있는 그가’는 동일 지시어가 겹쳐 한국어로 다소 부자연스럽습니다. 어순을 바꾸고 ‘바로 그가’로 강조를 처리할 수 있습니다.
  - severity: medium
    issue: 각주의 부적절한 주체 높임
    rationale: 각주의 ‘주실 것입니다’, ‘분배하실 것입니다’는 여호수아에게 주체 높임을 적용합니다. 본문은 여호수아를 높이지 않으며, 해당 높임은 한국어에서 불필요한 의미·문체상의 차이를 만듭니다.
  - severity: low
    issue: ‘기업으로 얻게 하다’의 현대어 자연성
    rationale: ‘기업’은 성서 전통 용어이지만 현대 일반어에서는 뜻이 즉시 분명하지 않고 ‘기업으로 얻게 하다’의 결합도 어색합니다. ‘유산으로 받게 하다’는 상속의 의미와 사역 구문을 자연스럽게 전달합니다.
  revised_text: 당신 앞에 서 있는 눈의 아들 여호수아, 바로 그가 그곳으로 들어갈 것입니다. 그를 강하게 하십시오. 그가 이스라엘이 그것을 유산으로 받게 할 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그가 그것을 이스라엘에게 유산으로 줄 것입니다’ 혹은 ‘그가 그것을 이스라엘에게 분배할 것입니다’.
    reason: lexical_alternative
  revision_rationale: 관계절과 강조 대명사의 한국어 어순을 자연스럽게 정리했습니다. נחל의 히필이 지닌 ‘상속받게 하다/유산으로 주다/분배하다’의 범위를 본문과 각주에서 보존했으며, 각주의 불필요한 주체 높임을 제거했습니다. 여성형 목적어 대명사의 지시 대상은 문맥상 약속의 땅이므로 원문의 모호성을 과도하게 해석하지 않는 범위에서 ‘그것’을 유지했습니다.
