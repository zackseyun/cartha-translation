  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
  footnotes:
  - marker: a
    text: Or 'he will give it to Israel as an inheritance' or 'he will apportion it to Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 눈의 아들 여호수아[a], 곧 당신 앞에 서 있는 그가 그곳으로 들어갈 것입니다. 그를 강하게 하십시오. 그가 이스라엘에게 그것을 기업으로 얻게 할 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 이스라엘에게 그것을 유업으로 주실 것입니다’ 혹은 ‘그가 그것을 이스라엘에게 분배하실 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: Joshua son of Nun
  chosen_korean: 눈의 아들 여호수아
  alternatives_korean:
  - 여호수아, 눈의 아들
  - 여호수아
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 알려진 형태인 ‘여호수아’를 쓰고, פּטרונيمיק은 자연스러운 ‘눈의 아들’로 옮겼습니다.
- source_word: הָעֹמֵד לְפָנֶיךָ
  english_pob_choice: who stands before you
  chosen_korean: 당신 앞에 서 있는
  alternatives_korean:
  - 당신 앞에 서 있는 사람
  - 당신을 섬기는
  lexicon: HALOT
  rationale: 분사구문은 ‘서 있는’으로 직역해 관계절의 현재 지속성을 살리고, ‘섬기는’이라는 해석은 본문보다 나아간 뜻이라 본문에는 두지 않았습니다.
- source_word: הוּא יָבֹא שָׁמָּה
  english_pob_choice: he will go in there
  chosen_korean: 그가 그곳으로 들어갈 것입니다
  alternatives_korean:
  - 그가 그곳으로 갈 것입니다
  - 그가 들어갈 것입니다
  lexicon: HALOT
  rationale: שָׁמָּה의 방향성을 살리면서 단순한 이동보다 ‘들어가다’가 약속의 땅 진입 문맥을 더 분명히 드러냅니다.
- source_word: יַנְחִלֶנָּה
  english_pob_choice: he will cause Israel to inherit it
  chosen_korean: 이스라엘에게 그것을 기업으로 얻게 할
  alternatives_korean:
  - 이스라엘이 그것을 기업으로 받게 할
  - 이스라엘에게 그것을 상속하게 할
  lexicon: HALOT
  rationale: נחל의 히필은 ‘기업으로 얻게 하다/상속하게 하다’의 뜻이므로, 한국어 관용을 살리되 ‘기업’ 표현을 유지해 유업·상속의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: יַנְחִלֶנָּה의 여성형 목적어 대명사 처리
  chosen_reading: 그 대명사는 앞선 약속의 땅을 가리키므로 ‘그것을’로 밝혔습니다.
  alternative_readings:
  - 대명사를 생략하여 ‘이스라엘에게 기업으로 얻게 할 것이기 때문입니다’로 옮길 수 있습니다.
  rationale: 문맥상 대상은 이스라엘이 들어갈 땅이며, 한국어에서는 지시대상을 드러내야 의미가 또렷해집니다.
  doctrine_reference: 문맥상 참조 대상을 보충하는 번역 원칙
