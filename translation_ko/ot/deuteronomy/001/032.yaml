lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  english_pob_choice: Yet in this matter
  chosen_korean: 그러나 이 일에 대해서는
  alternatives_korean:
  - 그런데 이 일에 대해서는
  - 하지만 이 일에 대해서는
  - 이 일에 대해서는
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘말’이 아니라 바로 앞에서 언급한 사건·사안을 가리키므로 ‘일/사안’으로 옮겼고, 앞뒤 문맥상 책망의 전환을 살려 ‘그러나’로 시작했습니다.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  english_pob_choice: you did not believe
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 믿고 있지 않았습니다
  - 신뢰하지 않았습니다
  lexicon: HALOT
  rationale: 부정문과 미완료형의 지속적 태도를 한국어에서는 자연스러운 과거 부정으로 옮기되, 언약적 불신이라는 핵심을 살리기 위해 ‘믿다’를 기본으로 유지했습니다.
- source_word: בַּ/יהוָה אֱלֹהֵי/כֶם
  english_pob_choice: in Yahweh your God / in the LORD your God
  chosen_korean: 주 당신들의 하나님
  alternatives_korean:
  - 야훼 여러분의 하나님
  - 주님 당신들의 하나님
  - 주 너희 하나님
  lexicon: HALOT
  rationale: 본문은 여호와 신앙 대상에 대한 불신을 말하므로 POB 원칙에 따라 하나님의 이름을 주로 직역하되, 한국어 문맥에서는 존칭 관계를 드러내는 ‘주 당신들의 하나님’이 가장 자연스럽습니다.
theological_decisions:
- issue: ב עם אמן의 의미를 ‘믿다/신뢰하다’ 중 어떻게 표현할지
  chosen_reading: ‘믿지 않았습니다’
  alternative_readings:
  - ‘신뢰하지 않았습니다’
  - ‘주를 믿지 않았습니다’
  rationale: 이 구절의 책망은 하나님의 말씀과 약속을 받아들이지 않은 태도를 가리키므로, 한국어 본문에서는 가장 직접적인 ‘믿다’를 택하고 문맥상 대상은 하나님으로 분명히 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
