  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
  footnotes:
  - marker: a
    text: Or, “the mountain of the Amorites.” The Hebrew can refer either to a mountain region or to hill country more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 여러분에게 말했습니다. 「여러분은 아모리 사람들의 산지에 이르렀습니다. 그곳은 야훼 우리 하나님께서 우리에게 주고 계신 곳입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아모리 사람들의 산.” 히브리어는 산지 전체를 가리키는 말로도, 더 넓은 구릉 지대를 가리키는 말로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  english_pob_choice: And I said to you
  chosen_korean: 제가 여러분에게 말했습니다
  alternatives_korean:
  - 그리고 내가 너희에게 말했습니다
  - 그때 제가 여러분에게 말했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 살리되, 현대 한국어에서 자연스러운 직접화법 도입으로 옮겼습니다. אֲלֵכֶם의 복수를 반영해 단수 친근체보다 '여러분'을 택했습니다.
- source_word: בָּאתֶם עַד
  english_pob_choice: You have come to
  chosen_korean: 여러분은 …에 이르렀습니다
  alternatives_korean:
  - 여러분은 …에 왔습니다
  - 여러분은 …까지 왔습니다
  lexicon: HALOT
  rationale: 도착·도달의 완료를 나타내는 동사를 써서 'come to'의 성취된 도착을 살렸습니다. '이르렀습니다'가 문맥상 가장 자연스럽고 격식 있습니다.
- source_word: הַר הָאֱמֹרִי
  english_pob_choice: the hill country of the Amorites
  chosen_korean: 아모리 사람들의 산지
  alternatives_korean:
  - 아모리 사람들의 산
  - 아모리 사람들의 산악지대
  lexicon: HALOT
  rationale: הַר는 단일 산보다 산지/산악 지형을 가리킬 수 있으므로 '산지'로 옮겼습니다. 집합적 표지를 반영해 '아모리 사람들의'로 풀었습니다.
- source_word: יְהוָה אֱלֹהֵינוּ נֹתֵן לָנוּ
  english_pob_choice: Yahweh our God is giving us
  chosen_korean: 야훼 우리 하나님께서 우리에게 주고 계신
  alternatives_korean:
  - 야훼 우리 하나님께서 우리에게 주시는
  - 야훼 우리 하나님께서 우리에게 주고 있습니다
  lexicon: HALOT
  rationale: יהוה는 본문 원형을 따라 '야훼'로, 분사 נֹתֵן은 현재적·진행적 의미를 살려 '주고 계신'으로 옮겼습니다. 수여 방향을 드러내기 위해 '우리에게'를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
