revisions:
- from: 광야[a], 곧 당신들이 보았던 곳에서, 야훼 당신들의 하나님께서 당신들을 안아 옮기셨습니다. 마치 한 사람이 자기 아들을 안아 옮기듯이[b], 당신들이 걸어온 모든 길을 따라, 당신들이 이곳에 이르기까지 그러하셨습니다.
  to: 또 네가 보았던 광야에서, 야훼 네 하나님께서는 너희가 이곳에 이르기까지 걸어온 모든 길에서 한 사람이 자기 아들을 안고 가듯이 너를 안고 가셨습니다.[a][b]
  rationale: 관계절을 ‘네가 보았던 광야’로 바로 연결하고, 원문의 단수(네가, 네 하나님, 너를)와 복수(너희가 걸어온, 너희가 이르기까지) 교대를 보존했습니다. ‘한 사람’과 ‘자기 아들’을 유지하면서, ‘안고 가다’로 נשא의 운반·보호 이미지를 자연스럽게 표현했습니다. 각주 표지는 해당 어휘가 나오는 ‘광야’와 비유 표현 뒤에 배치했습니다.
