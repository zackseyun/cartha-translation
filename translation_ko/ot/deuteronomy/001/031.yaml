source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
  footnotes:
  - marker: a
    text: Or 'in the desert.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'as a man carries his son'; some translations render more generically, 'as one carries a child.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 네가 보았던 광야에서, 야훼 네 하나님께서는 너희가 이곳에 이르기까지 걸어온 모든 길에서 한 사람이 자기 아들을 안고 가듯이 너를 안고 가셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사막에서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 사람이 자기 아들을 지니듯이’입니다. 일부 번역은 더 포괄적으로 ‘어린아이를 안고 가듯이’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  english_pob_choice: and in the wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 광야에서
  - 사막
  lexicon: HALOT
  rationale: מִדְבָּר는 이스라엘의 출애굽·광야 여정을 가리키는 표준 표현이므로, 문맥상 더 자연스럽고 신학적 배경을 살리는 ‘광야’로 옮겼습니다.
- source_word: אֲשֶׁר רָאִיתָ
  english_pob_choice: where you saw
  chosen_korean: 곧 당신들이 보았던 곳에서
  alternatives_korean:
  - 당신이 보았던 곳에서
  - 당신들이 보았던 것처럼
  lexicon: HALOT
  rationale: 관계절을 한국어로 자연스럽게 풀어 ‘광야’가 지시하는 그 장소를 분명히 하되, 직접 경험을 강조하는 원문의 흐름을 유지했습니다.
- source_word: נְשָׂאֲךָ
  english_pob_choice: carried you
  chosen_korean: 안아 옮기셨습니다
  alternatives_korean:
  - 데리고 가셨습니다
  - 업어 옮기셨습니다
  - 품에 안고 옮기셨습니다
  lexicon: HALOT
  rationale: נשא의 핵심은 ‘들어 옮기다/짊어지다’이지만, 이어지는 아버지-아들 비유와 함께 보호·돌봄의 이미지를 살려 한국어로는 ‘안아 옮기셨습니다’가 가장 적절합니다.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  english_pob_choice: just as a man carries his son
  chosen_korean: 마치 한 사람이 자기 아들을 안아 옮기듯이
  alternatives_korean:
  - 한 사람이 자기 아들을 업듯이
  - 아버지가 자기 아들을 안아 옮기듯이
  - 한 사람이 자기 아이를 옮기듯이
  lexicon: HALOT
  rationale: 히브리어는 ‘한 남자/사람’과 ‘그의 아들’을 분명히 말하므로, 성별과 혈연의 이미지를 유지하되 한국어에서는 자연스러운 비교문으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: ‘יְהוָה’는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 호칭이 아닌 언약 이름 עצמו를 사용하므로, 프로젝트 기본 원칙에 따라 고유명사성을 보존하는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 광야에서의 하나님의 돌보심 비유
  chosen_reading: ‘안아 옮기셨습니다’로 번역해 보호와 돌봄의 이미지를 살렸습니다.
  alternative_readings:
  - 짊어지셨습니다
  - 업어 옮기셨습니다
  - 데리고 가셨습니다
  rationale: 문맥은 단순한 이동이 아니라, 부모가 자녀를 돌보듯 백성을 안전하게 이끄신 하나님의 신실한 보살핌을 강조합니다. 따라서 물리적 운반보다 관계적·돌봄의 뉘앙스를 드러냈습니다.
  doctrine_reference: 'Translation philosophy §2: Preserve concrete imagery and covenantal care'
