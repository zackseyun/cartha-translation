  naturalness: 초안의 ‘광야, 곧 당신들이 보았던 곳에서’는 장소를 중복 지시하여 어색하고, ‘안아 옮기셨습니다’는 현대 한국어에서 다소 부자연스럽습니다. 수식 관계를 재배치하면 현대적이면서도 격식 있는 합쇼체 문장이 됩니다.
  terminology: ‘광야’와 ‘야훼’, 그리고 ‘한 사람/자기 아들’은 적절합니다. אִישׁ을 ‘아버지’로 강화하지 않고, בְּנוֹ를 ‘아들’로 보존해야 합니다.
