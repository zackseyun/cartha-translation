  to: 보십시오. 야훼, 당신의 하나님께서 그 땅을 당신 앞에 주셨습니다. 올라가서 차지하십시오. 야훼, 당신 아버지들의 하나님께서 당신에게 말씀하신 대로 하십시오. 두려워하지도 말고 낙심하지도 마십시오.[a]
  rationale: 원문의 통사 구조를 바로잡고, ‘아버지들’이라는 언약 공식을 본문에서 보존했습니다. ‘말씀하신 대로 하십시오’의 ‘하십시오’는 한국어에서 비교절 뒤의 명령을 자연스럽게 완결할 뿐, 원문의 ‘올라가서 차지하십시오’가 요구하는 행동을 반복·명시할 뿐입니다. 모든 명령은 현대 표준어 합쇼체로 유지했습니다.
