  - 반말형 직설체
  rationale: 모세의 권면은 단순 정보가 아니라 순종을 요구하는 직접 명령이므로, 존대형 명령으로 그 권위를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy — source-direct imperative preserved in modern formal-polite Korean
