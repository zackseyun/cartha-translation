base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
  footnotes:
  - marker: a
    text: Or 'the God of your ancestors.' The Hebrew reads 'your fathers,' a covenant formula preserved in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 야훼, 당신의 하나님께서 그 땅을 당신 앞에 주셨습니다. 올라가서 차지하십시오. 야훼, 당신 아버지들의 하나님께서 당신에게 말씀하신 대로 하십시오. 두려워하지도 말고 낙심하지도 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신 조상들의 하나님’. 히브리어는 ‘당신 아버지들의 하나님’이라고 하며, 언약 공식을 본문에 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 명령형의 주의 환기 기능을 살리되, 현대 표준어 합쇼체로 자연스럽고 공적인 어조를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’로 옮기고, 교회식 대체어로 완화하지 않았습니다.
- source_word: נָתַן ... לְפָנֶיךָ
  english_pob_choice: has set ... before you
  chosen_korean: 그 땅을 당신 앞에 두셨습니다
  alternatives_korean:
  - 그 땅을 당신 앞에 놓으셨습니다
  - 그 땅을 당신 앞에 주셨습니다
  lexicon: HALOT
  rationale: ‘before you’의 배치를 한국어 자연어로 풀어, 땅이 진입 가능한 상태로 제시되었음을 드러냈습니다.
- source_word: רֵשׁ
  english_pob_choice: take possession
  chosen_korean: 차지하십시오
  alternatives_korean:
  - 소유하십시오
  - 점령하십시오
  - 차지하시오
  lexicon: HALOT
  rationale: 정복/상속 문맥의 능동적 점유를 짧고 힘 있게 살리면서도 현대 한국어에서 이해가 쉬운 동사를 택했습니다.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  english_pob_choice: the God of your fathers
  chosen_korean: 당신의 조상들의 하나님
  alternatives_korean:
  - 당신의 아버지들의 하나님
  - 당신의 선조들의 하나님
  lexicon: HALOT
  rationale: 영어 주석의 대로 본문은 ‘fathers’라는 언약 공식을 반영하지만, 한국어에서는 남성 한정의 오해를 줄이면서도 전승적 공식을 보존하기 위해 ‘조상들’로 옮겼습니다.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  english_pob_choice: Do not fear or be dismayed
  chosen_korean: 두려워하지 말고, 놀라지 마십시오
  alternatives_korean:
  - 두려워하지 말고 낙심하지 마십시오
  - 두려워하지 말고 두려워서 떨지 마십시오
  lexicon: HALOT
  rationale: ‘fear’와 ‘be dismayed’의 병렬을 한국어에서 의미가 겹치지 않게 유지하면서, 현대 독자가 바로 이해할 수 있는 금지 표현으로 다듬었습니다.
theological_decisions:
