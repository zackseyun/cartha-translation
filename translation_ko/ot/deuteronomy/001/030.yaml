  to: 여러분의 하나님 야훼께서 여러분보다 앞서 가시며, 친히 여러분을 위하여 싸우실 것입니다. 이집트에서 여러분이 보는 앞에서 여러분을 위하여 행하신 모든 일처럼 싸우실 것입니다.[a]
