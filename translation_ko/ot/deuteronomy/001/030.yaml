  source_fidelity: 개정이 필요합니다. 초안은 ‘친히’로 강조를 잘 살렸고 ‘여러분을 위해’는 문맥상 עָשָׂה אִתְּכֶם의 적절한 의미 번역입니다. 그러나 비교구 כְּכֹל אֲשֶׁר의 ‘모든 일’이 빠졌으며, 원문에 없는 ‘같이 하실 것입니다’를 덧붙여 과거의 행위를 미래에 반복하신다는 별도 서술로 바꾸었습니다. 비교구는 야훼께서 싸우신다는 진술에 직접 연결되어야 합니다.
  naturalness: ‘당신들’은 현대 표준어의 공적·종교적 خطاب에서 부자연스럽고 거리감 또는 대립적 뉘앙스를 낼 수 있습니다. 복수 청자를 향한 현대 합쇼체에는 ‘여러분’이 자연스럽습니다. 또한 ‘여러분 앞서 가시는 그분이’보다 ‘여러분보다 앞서 가시는 …께서’가 자연스럽고 관계를 분명히 합니다.
  terminology: ‘야훼’와 ‘하나님’은 주어진 명칭 방침 및 한국어 기독교 성서 용례에 부합합니다. ‘친히’는 독립 인칭대명사 הוּא의 강조를 적절히 반영합니다. 각주에서는 히브리어의 ‘with you’를 밝혀 두되, 본문의 문맥적 ‘여러분을 위하여’ 번역을 설명합니다.
