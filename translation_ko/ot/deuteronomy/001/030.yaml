  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
  footnotes:
  - marker: a
    text: 'Hebrew: ''did with you.'' The phrase refers to what the LORD did on Israel''s behalf in Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 하나님 야훼께서 여러분보다 앞서 가시며, 친히 여러분을 위하여 싸우실 것입니다. 이집트에서 여러분이 보는 앞에서 여러분을 위하여 행하신 모든 일처럼 싸우실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희와 함께 행하신’입니다. 여기서는 이집트에서 야훼께서 이스라엘을 위하여 행하신 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 이름형 표기를 따라, טetragrammaton은 칭호가 아니라 고유한 신명으로서 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 당신들의 신들
  - 여러분의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유격이 붙은 ישראל의 하나님을 자연스러운 현대 한국어로 풀어 ‘당신들의 하나님’이라 옮겼습니다.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  english_pob_choice: who goes before you
  chosen_korean: 당신들 앞서 가시는
  alternatives_korean:
  - 당신들 앞에 가시는
  - 당신들보다 앞서 가시는
  lexicon: HALOT
  rationale: 진행 중인 특징적 행동을 나타내는 분사구문을, 한국어에서는 ‘앞서 가시는’으로 간결하게 살렸습니다.
- source_word: עָשָׂה אִתְּכֶם
  english_pob_choice: he did with you
  chosen_korean: 당신들을 위해 하신 것
  alternatives_korean:
  - 당신들과 함께 하신 것
  - 당신들에게 하신 것
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘너희와 함께 하셨다’이지만, 문맥상 출애굽 사건에서 이스라엘 편에서 행하신 일을 가리키므로 POB의 주석 취지를 따라 ‘당신들을 위해’로 의미를 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: ‘야훼’로 표기하여 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’로 음역
  - ‘주님’으로 대체
  rationale: 본문은 신명기에서 야훼의 인도와 전투를 강조하므로, 칭호 대체보다 고유명 보존이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
