  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
  footnotes:
  - marker: a
    text: Or 'Look' or 'Behold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'possess the land'; the Hebrew verb can also carry the sense of inheriting or taking possession.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'your fathers,' referring specifically to Abraham, Isaac, and Jacob.
    reason: alternative_reading
  - marker: d
    text: Or 'their seed after them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 여러분 앞에 땅을 두었습니다. 들어가서 그 땅을 차지하십시오. 야훼께서 여러분의 조상들—아브라함, 이삭, 야곱에게 그들과 그들 뒤의 그들의 씨에게 주시겠다고 맹세하신 그 땅입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’, ‘살펴보라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 문맥상 청중을 향한 강한 주의를 요구하는 명령형이므로, 현대 한국어에서 자연스럽고 공손한 직접 명령인 ‘보십시오’로 옮겼습니다.
- source_word: נָתַתִּי לִפְנֵיכֶם
  english_pob_choice: I have set ... before you
  chosen_korean: 내가 여러분 앞에 땅을 두었습니다
  alternatives_korean:
  - 내가 여러분 앞에 땅을 세워 두었습니다
  - 내가 여러분 앞에 땅을 주었습니다
  lexicon: HALOT
  rationale: נָתַן + לִפְנֵי의 ‘앞에 놓다/두다’는 가시적이고 즉각적인 제시를 뜻하므로, ‘두었습니다’가 ‘set ... before you’를 가장 자연스럽게 살립니다.
- source_word: וּרְשׁוּ
  english_pob_choice: take possession of
  chosen_korean: 그 땅을 차지하십시오
  alternatives_korean:
  - 그 땅을 소유하십시오
  - 그 땅을 점유하십시오
  - 그 땅을 차지하여 가지십시오
  lexicon: HALOT
  rationale: ירשׁ은 단순 소유보다 상속받아 점유하는 뉘앙스를 가지므로, 현대어에서 동적이면서도 본문 힘을 살리는 ‘차지하십시오’를 택했습니다.
- source_word: לַאֲבֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 여러분의 조상들
  alternatives_korean:
  - 여러분의 아버지들
  - 여러분의 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 바로 뒤에 아브라함·이삭·야곱을 열거하므로 한국어에서는 자연스러운 집합 명사 ‘조상들’로 옮겨 특정 족장들을 가리키는 뜻을 분명히 했습니다.
- source_word: לְזַרְעָם אַחֲרֵיהֶם
  english_pob_choice: to their offspring after them
  chosen_korean: 그들 뒤의 그들의 씨
  alternatives_korean:
  - 그들 뒤의 그들의 자손
  - 그들 뒤의 그들의 후손
  lexicon: HALOT
  rationale: זֶרַע의 집합적·단수적 표현을 보존하려고 관용적 ‘씨’를 유지했고, ‘뒤의’는 ‘after them’의 시간적/세대적 연속을 직역에 가깝게 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 여호와 이름이 직접 나오므로, 프로젝트 기본값에 따라 언약명 ‘야훼’를 본문에 유지해 신학적·어휘적 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
