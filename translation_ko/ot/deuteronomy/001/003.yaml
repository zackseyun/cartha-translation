  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
  footnotes:
  - marker: a
    text: Or 'to the Israelites.' The Hebrew reads 'to the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'commanded him to them' or 'commanded him concerning them'; the sense is that Moses spoke what the LORD had commanded him for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 사십 년째 되는 해 열한 번째 달, 그 달 첫째 날에 모세는 이스라엘 자손에게[a] 야훼께서 그들에게 전하라고 그에게 명하신 모든 대로 말하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 압축된 표현으로, 직역하면 “그에게 그들에게 명하신”입니다. “그들에게 전하라고 그에게 명하신” 또는 “그들에 관하여 그에게 명하신”으로 이해될 수 있습니다.
    reason: lexical_alternative
