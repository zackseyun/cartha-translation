id: DEU.1.12
reference: Deuteronomy 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵיכָ֥ה אֶשָּׂ֖א לְ/בַדִּ֑/י טָרְחֲ/כֶ֥ם וּ/מַֽשַּׂאֲ/כֶ֖ם וְ/רִֽיבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
  footnotes:
  - marker: a
    text: Or 'your strife' or 'your legal cases' for 'your disputes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 나 홀로 너희의 수고와 너희의 짐과 너희의 다툼을 감당할 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다툼’은 ‘분쟁’이나 ‘송사(법적 사건)’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How can
  chosen_korean: 어찌 … 수 있겠습니까?
  alternatives_korean:
  - 어떻게 … 할 수 있겠습니까?
  - 어찌 … 할 수 있습니까?
  lexicon: HALOT
  rationale: 수사적 탄식과 불가능성을 나타내는 물음이므로, 현대 합쇼체에서는 ‘어찌 … 수 있겠습니까?’가 자연스럽게 긴박감을 살립니다.
- source_word: לְבַדִּי
  english_pob_choice: I alone
  chosen_korean: 나 홀로
  alternatives_korean:
  - 혼자
  - 나만
  lexicon: HALOT
  rationale: ‘I alone’의 강조를 살리면서도 문장 흐름이 자연스럽도록 ‘나 홀로’로 옮겼습니다.
- source_word: טָרְחֲכֶם
  english_pob_choice: your trouble
  chosen_korean: 너희의 수고
  alternatives_korean:
  - 너희의 고된 짐
  - 너희의 어려움
  lexicon: HALOT
  rationale: טֹרַח는 부담이 되는 수고·고생의 뉘앙스를 가지므로, 다음의 ‘짐’과 중복되지 않게 ‘수고’로 구분했습니다.
- source_word: מַשַּׂאֲכֶם
  english_pob_choice: your burden
  chosen_korean: 너희의 짐
  alternatives_korean:
  - 너희의 부담
  - 너희의 무거운 짐
  lexicon: HALOT
  rationale: מַשָּׂא의 기본 의미인 ‘짐, 부담’을 가장 직접적으로 드러내는 표현으로 ‘짐’을 택했습니다.
- source_word: רִיבְכֶם
  english_pob_choice: your disputes
  chosen_korean: 너희의 다툼
  alternatives_korean:
  - 너희의 분쟁
  - 너희의 송사
  lexicon: HALOT
  rationale: רִיב는 다툼, 분쟁, 소송의 뜻을 가질 수 있으나, 문맥상 백성 사이의 분쟁과 재판 사안을 함께 포괄하도록 ‘다툼’으로 옮겼습니다.
theological_decisions:
- issue: 모세의 질문 어조
  chosen_reading: 직역보다 한국어 수사 의문형으로 처리해, 모세가 혼자 감당할 수 없음을 강하게 드러냈습니다.
  alternative_readings:
  - 직설형으로 평서화
  - 더 완곡한 표현으로 약화
  rationale: 본문의 감정적·수사적 힘을 보존하는 것이 중요하므로, 단순 정보 전달보다 불가능성의 강조를 살렸습니다.
  doctrine_reference: 본문 수사적 장치 보존
