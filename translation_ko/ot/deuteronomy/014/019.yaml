  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
  footnotes:
  - marker: a
    text: Or 'every swarming thing that flies' / 'every winged swarming thing.' The Hebrew phrase combines שֶׁרֶץ ('swarming thing') with עוֹף ('flying creature, bird'), likely referring especially to flying insects rather than birds in the ordinary sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 새들이 우글거리는 모든 것은 여러분에게 부정합니다[a]. 그것은 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘우글거리는 것’(שֶׁרֶץ)과 ‘날다/날개 달린 생물’(עוֹף)을 함께 써서, 일반적인 ‘새’라기보다 날아다니는 작은 생물, 특히 곤충류를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁרֶץ הָע֔וֹף
  english_pob_choice: every swarming thing of the birds / every swarming thing that flies
  chosen_korean: 새들이 우글거리는 모든 것
  alternatives_korean:
  - 날아다니는 모든 우글거리는 것
  - 날개 달린 우글거리는 모든 것
  lexicon: HALOT
  rationale: שֶׁרֶץ와 עוֹף의 결합은 일반적인 ‘새’ 범주라기보다 날아다니는 작은 생물들을 가리킬 수 있어, 한국어에서는 직역 어순보다 의미가 드러나는 ‘새들이 우글거리는’으로 옮겼습니다.
- source_word: טָמֵא
  english_pob_choice: unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 더럽습니다
  - 불결합니다
  lexicon: HALOT
  rationale: 레위기·신명기의 정결 범주를 유지하기 위해 ‘불결’보다 제의적 상태를 나타내는 ‘부정’으로 옮겼습니다.
- source_word: לֹא יֵאָכֵלוּ
  english_pob_choice: they shall not be eaten
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 먹으면 안 됩니다
  - 먹히지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어 수동형 금지문을 한국어에서 자연스러운 금지 표현으로 풀되, 금지의 규범성을 살렸습니다.
theological_decisions:
- issue: 정결/부정 범주의 유지
  chosen_reading: 이 절의 טָמֵא는 도덕적 ‘더러움’이 아니라 식용 금지와 연결된 정결상의 ‘부정’으로 읽었습니다.
  alternative_readings:
  - 일반적 오염 상태로 완화하는 번역
  - 도덕적 부정으로 해석하는 번역
  rationale: 문맥이 식물·동물 식이 규례이므로, 제의적 정결 개념을 흐리지 않도록 번역했습니다.
  doctrine_reference: 구약 정결법의 의례적 구분
