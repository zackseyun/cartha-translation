  source_fidelity: 개정이 필요합니다. 초안의 ‘새들이 우글거리는’은 히브리어 שֶׁרֶץ הָעוֹף를 ‘새들이 우글거린다’는 뜻으로 바꾸어, 날아다니는 떼 지어 다니는 생물이라는 수식 관계와 범주를 훼손합니다. 본문은 날아다니는/날개 달린 떼 지어 다니는 생물을 가리키며, 문맥상 특히 곤충류를 포함합니다. יֵאָכֵלוּ의 복수 수동 금지는 한국어에서 자연스러운 복수 지시 표현으로 반영했습니다.
  naturalness: ‘날아다니며 떼 지어 다니는 모든 것’은 현대 표준어로 자연스럽고 원문의 범주를 지나치게 좁히지 않습니다. ‘여러분에게는 부정한 것입니다’은 식이·정결 규례의 제의적 의미를 살리면서도 ‘여러분에게 부정합니다’보다 자연스럽습니다.
  terminology: טָמֵא는 도덕적 비난이나 일반 위생 상태가 아니라 정결 규례상의 범주이므로 ‘부정한’으로 유지하는 것이 적절합니다. עוֹף를 단순히 ‘새’로 한정하지 않고 ‘날아다니는’으로 옮겨 שֶׁרֶץ와의 결합을 반영했습니다.
