  source_fidelity: 핵심 의미와 법적 허용의 뉘앙스는 대체로 충실합니다. 다만 נְבֵלָה를 한국어에서 흔히 사람의 시신을 뜻하는 ‘시체’로 옮기면 동물 사체라는 문맥이 흐려집니다. 또한 원문의 집단 خطاب에 맞추어 ‘너희’를 일관되게 쓰는 편이 적절합니다.
  naturalness: ‘너희는 … 너는’의 혼용은 현대 한국어 번역문에서 어색합니다. ‘너희 성문 안에 사는 거류민’과 ‘그에게 주어 먹게 할 수도 있고’가 더 자연스럽고, 허용의 법적 기능도 분명히 합니다.
  terminology: ‘거류민’과 ‘외국인’의 구별, ‘거룩한 백성’, ‘야훼’, ‘어린 염소를 어미의 젖에 삶다’는 적절합니다. 단, ‘시체’는 ‘짐승의 사체’로 명시해야 합니다. 현 초안의 e, f 각주는 본문 앵커와 내용이 일치하지 않아 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘시체’가 동물 사체라는 뜻을 충분히 드러내지 못합니다.
