id: DEU.14.21
reference: Deuteronomy 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
  footnotes:
  - marker: a
    text: Or, 'anything that dies naturally' or 'dead animal.' The Hebrew נְבֵלָה refers to an animal carcass not slaughtered in a permitted way.
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' translates גֵּר, a resident foreigner living among Israel; this differs from ''foreigner'' (נָכְרִי) in the next clause.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'within your gates,' a Hebrew idiom for those living within your community or towns.
    reason: cultural_note
  - marker: d
    text: Or, more formally, 'You shall give it ... and he shall eat it; or sell it to a foreigner.' The Hebrew legal style can be rendered either as permission or instruction.
    reason: alternative_reading
  - marker: e
    text: Or, traditionally, 'You shall not boil a kid in its mother's milk.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 어떤 짐승의 사체[a]도 먹어서는 안 됩니다. 너희는 너희 성문 안에 사는 거류민[b][c]에게 그것을 주어 먹게 할 수도 있고, 외국인에게 팔 수도 있습니다[d]. 너희는 야훼[e] 너희 하나님께 속한 거룩한 백성이기 때문입니다. 너희는 어린 염소를 어미의 젖에 삶아서는 안 됩니다[f].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְבֵלָה는 허용된 방식으로 도살되지 않은 동물의 사체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 성문 안에’이며, 공동체나 성읍의 관할 안에 있는 사람들을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘거류민’(גֵּר)은 다음 절의 ‘외국인’(נָכְרִי)과 구별되는, 공동체 안에 거주하는 비토착민을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 법문은 ‘주고 그가 먹게 하라 … 팔라’와 같은 명령형으로도 옮길 수 있으나, 문맥상 이스라엘 사람이 먹지 못하는 사체를 처분할 수 있다는 허용을 나타냅니다.
    reason: alternative_reading
  - marker: e
    text: 히브리어 하나님의 이름 יהוה를 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: f
    text: 전통적으로는 ‘새끼 염소를 그 어미의 젖에 삶지 말지니라’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  english_pob_choice: carcass
  chosen_korean: 시체
  alternatives_korean:
  - 가축의 사체
  - 죽은 동물
  - 부정한 사체
  lexicon: HALOT
  rationale: 문맥상 허용된 방식으로 잡아 죽이지 않은 동물의 사체를 가리키므로, 식용 금지의 법적 의미를 살리는 표현을 택했습니다.
- source_word: גֵּר
  english_pob_choice: sojourner
  chosen_korean: 거류민
  alternatives_korean:
  - 나그네
  - 체류 외국인
  - 이주민
  lexicon: HALOT
  rationale: 이스라엘 공동체 안에 거주하는 비토착민의 사회적 지위를 드러내기 위해, 단순한 '외국인'보다 구별되는 '거류민'을 사용했습니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 네 성문 안
  alternatives_korean:
  - 네 성읍 안에
  - 네 도시 안에
  - 너희 지역 안에
  lexicon: HALOT
  rationale: 직역에 가까우면서도 한국어로는 공동체 경계와 관할을 함께 떠올리게 하는 관용구로 옮겼습니다.
- source_word: עַם קָדוֹשׁ
  english_pob_choice: a holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 성스러운 백성
  - 거룩한 민족
  lexicon: HALOT
  rationale: 언약적 구별성을 나타내는 표준 표현을 유지해, 단순한 종교적 경외감보다 하나님께 구별된 정체성을 드러냈습니다.
- source_word: גְּדִי בַּחֲלֵב אִמּוֹ
  english_pob_choice: a young goat in its mother's milk
  chosen_korean: 어린 염소를 어미의 젖에 삶아서는 안 됩니다
  alternatives_korean:
  - 새끼 염소를 그 어미의 젖에 삶아서는 안 됩니다
  - 어린 염소를 어미 젖으로 삶아서는 안 됩니다
  lexicon: HALOT
  rationale: ‘삶다’는 동사의 직접적 의미를 살리고, ‘어미의 젖’으로 원문의 구체적 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약명 사용을 드러내기 위해 관례적 번역어를 피하고, 원문이 가진 고유한 하나님의 이름을 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 허용/금지의 법적 문장 구조
  chosen_reading: ‘주어… 먹게 할 수 있고, 또… 팔 수도 있습니다’
  alternative_readings:
  - ‘주어… 먹게 해야 합니다, 또… 팔아야 합니다’
  - ‘줄 수 있으며… 팔 수 있습니다’
  rationale: 히브리어 법문은 소비 금지와 처분 허용을 동시에 말하므로, 의무보다 허용의 뜻이 자연스럽게 드러나도록 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
