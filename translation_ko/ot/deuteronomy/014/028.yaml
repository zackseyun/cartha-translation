id: DEU.14.28
reference: Deuteronomy 14:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
  footnotes:
  - marker: a
    text: Hebrew 'within your gates' refers to one's local towns or settlements under one's jurisdiction.
    reason: cultural_note
  - marker: b
    text: Or 'each third year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 삼 년이 끝날 때마다, 그 해의 모든 소출의 십일조를 꺼내어 네 성문 안에 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네 성문 안에’는 자기 관할 아래의 지역 읍이나 정착지를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘매 셋째 해’.
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  english_pob_choice: At the end of every three years
  chosen_korean: 세 해가 끝날 때마다
  alternatives_korean:
  - 매 삼 년마다
  - 각 셋째 해마다
  lexicon: HALOT
  rationale: 반복되는 삼년 주기를 자연스러운 한국어로 옮기되, 시간의 종결점을 나타내는 원문의 구조를 유지했습니다.
- source_word: תּוֹצִיא
  english_pob_choice: you shall bring out
  chosen_korean: 밖으로 내어
  alternatives_korean:
  - 가져내어
  - 꺼내어
  lexicon: HALOT
  rationale: 히필의 ‘밖으로 나오게 하다’는 동작을 살려, 저장된 십일조를 실제로 꺼내는 의미를 분명히 했습니다.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  english_pob_choice: all the tithe of your produce
  chosen_korean: 그 해의 모든 소출의 십일조
  alternatives_korean:
  - 그 해의 모든 추수의 십일조
  - 그 해의 모든 소산의 십일조
  lexicon: HALOT
  rationale: תְּבוּאָה를 농산물의 ‘소출’로 옮겨, 단순한 곡식에 국한하지 않고 산출물 전체를 포괄하게 했습니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 네 성문 안에
  alternatives_korean:
  - 네 성읍 안에
  - 네 문 안에
  lexicon: HALOT
  rationale: 직역 이미지를 살리면서도 한국어에서 이해 가능한 표현으로 옮겼고, 지칭하는 지역 공동체의 뜻은 본문 차원에서 너무 풀지 않았습니다.
theological_decisions:
- issue: 연례적이지만 삼년 주기의 의무를 어떻게 드러낼지
  chosen_reading: ‘세 해가 끝날 때마다’로 옮겨, 주기의 반복성과 해가 마무리된 시점을 함께 드러냈습니다.
  alternative_readings:
  - 매 삼 년마다
  - 각 셋째 해마다
  rationale: 원문의 מִקְצֵה가 가리키는 시간의 종결감과 שָׁלֹשׁ שָׁנִים의 반복적 성격을 모두 보존하는 쪽이 본문의 규정성을 더 잘 전달합니다.
  doctrine_reference: 신명기 14장의 십일조 규례
- issue: ‘within your gates’의 공간 범주
  chosen_reading: ‘네 성문 안에’로 직역해 원문의 이미지와 공동체 경계감을 유지했습니다.
  alternative_readings:
  - 네 성읍 안에
  - 네 마을 안에
  rationale: 전통적 관용구를 너무 풀어버리면 법규의 지역적·행정적 범주가 흐려질 수 있어, 본문 이미지를 우선했습니다.
  doctrine_reference: 신명기 14:28의 지역 공동체 규정
