  source_fidelity: 히브리어 מִקְצֵה שָׁלֹשׁ שָׁנִים의 반복되는 삼 년 주기와 시간적 종결점, תּוֹצִיא의 ‘꺼내다/밖으로 내다’, כָּל מַעְשַׂר תְּבוּאָתְךָ의 포괄적 십일조, 그리고 בִּשְׁעָרֶיךָ의 문자적 ‘성문 안에’가 전반적으로 충실히 반영되어 있습니다. 다만 ‘밖으로 내어’는 한국어에서 다소 부자연스럽고, ‘꺼내어’가 원문의 구체적 동작을 더 자연스럽고 정확하게 전달합니다.
  naturalness: 합쇼체의 규정문으로 자연스럽습니다. ‘삼 년이 끝날 때마다’가 ‘세 해가 끝날 때마다’보다 시간 표현에서 조금 더 매끄럽고, ‘꺼내어’가 ‘밖으로 내어’보다 현대 표준어에서 자연스럽습니다.
  terminology: ‘소출’, ‘십일조’, ‘성문 안’은 적절합니다. ‘성문 안’은 문자적으로는 물리적 공간처럼 들릴 수 있으나, 본문의 히브리어 이미지를 보존하고 각주가 관용적 의미를 설명하므로 유지할 수 있습니다. 대안 각주의 ‘매 셋째 해마다’는 ‘매’와 ‘마다’가 중복되므로 ‘매 셋째 해’로 고칩니다.
