base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
  footnotes:
  - marker: a
    text: Or 'a people for his treasured possession.' The Hebrew סְגֻלָּה refers to a specially valued possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 당신들이 주 당신의 하나님께 속한 거룩한 백성이기 때문입니다. 주께서 당신들을 택하셔서, 땅 위에 있는 모든 민족 가운데서 자기의 소중한 백성이 되게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 보배로운 소유’로 옮길 수 있습니다. 히브리어 סְגֻלָּה는 특별히 값지게 여기는 소유를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם קָדוֹשׁ
  english_pob_choice: a holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 거룩한 ժողովուրդ
  - 성결한 백성
  - 거룩한 사람들
  lexicon: HALOT
  rationale: עַם은 집합적 ‘백성’이 자연스럽고, קָדוֹשׁ는 의례적·언약적 구별의 의미를 살려 ‘거룩한’으로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 주 당신의 하나님께 속한
  alternatives_korean:
  - 주 당신의 하나님께
  - 주 당신의 하나님을 위한
  - 주 당신의 하나님에게
  lexicon: HALOT
  rationale: ל는 단순 방향보다 소속·관계의 뜻이 강하므로, 한국어에서 관계를 가장 분명히 드러내는 ‘~께 속한’으로 옮겼습니다.
- source_word: בָּחַר
  english_pob_choice: has chosen
  chosen_korean: 택하셔서
  alternatives_korean:
  - 선택하셔서
  - 고르셔서
  - 뽑으셔서
  lexicon: HALOT
  rationale: 하나님의 주권적 선택을 드러내는 표준적인 표현으로 ‘택하다’를 사용했습니다.
- source_word: לְעַם סְגֻלָּה
  english_pob_choice: a treasured people
  chosen_korean: 자기의 소중한 백성
  alternatives_korean:
  - 보배로운 백성
  - 소유된 백성
  - 특별히 아끼는 백성
  lexicon: HALOT
  rationale: סְגֻלָּה의 ‘특별히 값지게 여겨 소유한 것’이라는 뜻을 살리되, 한국어에서 자연스럽고 ‘백성’과 함께 읽히는 ‘소중한 백성’으로 옮겼습니다.
- source_word: מִכֹּל הָעַמִּים
  english_pob_choice: out of all the peoples
  chosen_korean: 땅 위에 있는 모든 민족 가운데서
  alternatives_korean:
  - 모든 백성 가운데서
  - 모든 민족들 중에서
  - 땅 위의 모든 민족들 가운데서
  lexicon: HALOT
  rationale: 문맥상 보편적 범위를 나타내므로 ‘땅 위에 있는’과 ‘모든 민족 가운데서’를 결합해 히브리어의 포괄성을 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘treasured possession’의 번역 방향
  chosen_reading: ‘소중한 백성’으로 옮겨 백성-언약 관계를 살리고, ‘소유물’처럼 들릴 수 있는 표현은 본문이 사람 공동체를 가리킨다는 점에서 피했습니다.
  alternative_readings:
  - 소중한 소유
  - 보배로운 소유
  - 특별한 소유물
  rationale: סְגֻלָּה는 분명히 ‘값지게 여겨 따로 간직한 것’의 뜻이지만, כאן은 사물이 아니라 이스라엘 공동체를 말하므로 인격적·공동체적 뉘앙스를 유지하는 번역이 더 적절합니다.
  doctrine_reference: 언약적 선택과 소속성을 보존하되, 물건화하는 표현은 지양합니다.
