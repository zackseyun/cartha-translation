lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  english_pob_choice: These are the animals
  chosen_korean: 이것은 여러분이 먹을 수 있는 짐승들입니다
  alternatives_korean:
  - 이것은 여러분이 먹을 수 있는 동물들입니다
  - 이것은 여러분이 먹을 수 있는 가축들입니다
  - 이것은 여러분이 먹을 수 있는 짐승입니다
  lexicon: HALOT
  rationale: 히브리어는 단수형으로 집합 범주를 도입하지만, 뒤따르는 목록 전체를 가리키는 뜻이어서 한국어에서는 복수 서술로 풀어 주었습니다. '짐승들'은 정결/부정결 식물류가 아닌 육상 동물 범주를 자연스럽게 드러냅니다.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  english_pob_choice: that you may eat
  chosen_korean: 여러분이 먹을 수 있는
  alternatives_korean:
  - 여러분이 먹을 수 있는 것
  - 여러분이 먹을 자
  lexicon: HALOT
  rationale: 허용의 의미를 살려 '먹을 수 있는'으로 옮겼습니다. 명령형처럼 들리는 '먹어야 할' 뉘앙스는 피했습니다.
- source_word: שׁוֹר
  english_pob_choice: the ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 외양간 소
  - 우
  lexicon: HALOT
  rationale: 법률 문맥의 단일 가축 명칭으로서 '소'가 가장 자연스럽고, 성별이 지나치게 한정되는 '황소'는 피했습니다.
- source_word: שֵׂה כְשָׂבִים / שֵׂה עִזִּים
  english_pob_choice: the sheep, and the goat
  chosen_korean: 양과 염소
  alternatives_korean:
  - 양과 염소
  - 어린양과 염소
  - 양 한 마리와 염소 한 마리
  lexicon: HALOT
  rationale: 히브리어의 '한 마리의 ~' 구조를 한국어에서는 반복 없이 범주명으로 자연스럽게 정리했습니다. '양'과 '염소'가 서로 대응하는 허용 가축 목록을 분명히 보여 줍니다.
