  lexicon: HALOT
  rationale: 히브리어의 '한 마리의 ~' 구조를 한국어에서는 반복 없이 범주명으로 자연스럽게 정리했습니다. '양'과 '염소'가 서로 대응하는 허용 가축 목록을 분명히 보여 줍니다.
