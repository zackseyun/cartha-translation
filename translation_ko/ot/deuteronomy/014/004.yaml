  - 여러분이 먹을 자
  lexicon: HALOT
  rationale: 허용의 의미를 살려 '먹을 수 있는'으로 옮겼습니다. 명령형처럼 들리는 '먹어야 할' 뉘앙스는 피했습니다.
- source_word: שׁוֹר
  english_pob_choice: the ox
  chosen_korean: 소
  alternatives_korean:
