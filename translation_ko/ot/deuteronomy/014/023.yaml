base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
  footnotes:
  - marker: a
    text: Or, 'to cause his name to dwell there' or 'to set his name there.' The Hebrew preserves the idiom of the LORD placing his name at the chosen sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 야훼 너희 하나님 앞, 곧 그가 그의 이름을 그곳에 두려고 택하실 곳에서 너희의 곡식과 새 포도주와 기름의 십일조, 그리고 너희 소와 양의 처음 난 것들을 먹어야 합니다. 이는 너희가 평생 야훼 너희 하나님을 경외하는 법을 배우게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 그의 이름을 그곳에 두려고’는 히브리어 관용구를 따른 번역이며, ‘그의 이름을 그곳에 거하게 하려고’ 또는 ‘그의 이름을 그곳에 두시려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: before Yahweh your God
  chosen_korean: 야훼 너희 하나님 앞
  alternatives_korean:
  - 야훼 너희 하나님 앞에서
  - 야훼 너희 하나님 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미는 ‘앞, 면전에서’이므로, 제의적·언약적 맥락을 살려 간결하게 ‘앞’으로 옮겼습니다.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  english_pob_choice: for his name to dwell there
  chosen_korean: 그가 그의 이름을 그곳에 두려고
  alternatives_korean:
  - 그의 이름이 그곳에 거하도록
  - 그의 이름을 그곳에 두시려고
  lexicon: HALOT
  rationale: 히브리어 관용구의 신학적 긴장을 살리기 위해 ‘이름을 두다’로 옮겼고, ‘거하다’로 풀어 의미를 흐리지 않았습니다.
- source_word: מַעְשַׂר
  english_pob_choice: the tithe
  chosen_korean: 십일조
  alternatives_korean:
  - 열째 몫
  - 열분의 일
  lexicon: HALOT
  rationale: 제의적·율법적 용어로 굳어진 표현이므로 ‘십일조’가 가장 자연스럽고 정확합니다.
- source_word: תִּירֹשְׁךָ
  english_pob_choice: your new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 새 포도즙
  lexicon: HALOT
  rationale: תירוש는 일반적인 포도주가 아니라 갓 짠/새 포도주를 가리키므로, POB의 구분을 따라 ‘새 포도주’로 옮겼습니다.
- source_word: בְּכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  english_pob_choice: the firstborn of your herd and your flock
  chosen_korean: 너희 소와 양의 처음 난 것들
  alternatives_korean:
  - 너희 떼와 양 떼의 맏배들
  - 너희 가축 떼의 첫 새끼들
  lexicon: HALOT
  rationale: בכורות는 가축의 ‘처음 난 것들’이며, בקר/צאן의 짝을 한국어로 자연스럽게 살려 제물 규정을 분명히 했습니다.
- source_word: לְיִרְאָה
  english_pob_choice: to fear
  chosen_korean: 경외하는 법을
  alternatives_korean:
  - 두려워하는 법을
  - 경외하도록
  lexicon: HALOT
  rationale: ירא의 핵심은 단순 공포가 아니라 언약적 경외이므로, 의미를 약화하지 않으면서도 한국어에서 자연스럽게 읽히는 ‘경외하다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 고유명사성을 보존하는 음역을 사용해, 단순 호칭 대체보다 본문이 지닌 신명 표지를 드러냈습니다.
  doctrine_reference: 'Contested terms: יְהוָה / YHWH'
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם의 신학적 긴장
  chosen_reading: 그가 그의 이름을 그곳에 두려고
  alternative_readings:
  - 그의 이름이 그곳에 거하도록
  - 그의 이름을 그곳에 세우려고
  rationale: 하나님의 임재를 ‘이름’의 거처로 표현하는 신명기의 관용구를 직역 쪽으로 유지하여, 초월성과 선택된 성소의 긴장을 지우지 않았습니다.
  doctrine_reference: Translation philosophy §3
