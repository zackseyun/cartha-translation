  - 여호와
  rationale: 공인된 본문 전통의 신적 고유명사를 가리기보다 드러내는 것이 이 절의 언약적 지시를 더 직접적으로 전달한다고 보았습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
