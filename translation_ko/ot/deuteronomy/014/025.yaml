base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/025.yaml
  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
  footnotes:
  - marker: a
    text: Or, 'exchange it for silver' or 'turn it into money.' The Hebrew literally mentions 'silver,' which in context functions as money.
    reason: lexical_alternative
  - marker: b
    text: Or, 'wrap up the silver in your hand,' that is, secure it in your possession for the journey.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 은으로 바꾸고[a], 그 은을 손에 묶어 두고[b], 야훼 당신의 하나님이 선택하실 곳으로 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은으로 교환하고’ 또는 ‘돈으로 바꾸고’라는 뜻입니다. 히브리어는 문자적으로 ‘은’을 말하지만, 여기서는 돈의 기능으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘은을 손에 싸매고’라는 뜻입니다. 곧 여행을 위해 은을 안전하게 지닌 채로 두라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  english_pob_choice: you shall turn it into silver
  chosen_korean: 그것을 은으로 바꾸고
  alternatives_korean:
  - 그것을 돈으로 바꾸고
  - 그것을 은으로 교환하고
  lexicon: HALOT
  rationale: 문맥상 운반하기 어려운 것을 은으로 바꾸는 교환 행위이므로, ‘바꾸다’로 거래적 의미를 살리되 כֶּסֶף의 문자적 의미인 ‘은’을 유지했습니다.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  english_pob_choice: bind the silver in your hand
  chosen_korean: 그 은을 손에 묶어 두고
  alternatives_korean:
  - 그 은을 손에 싸매고
  - 그 은을 손에 안전하게 넣어 두고
  - 그 돈을 가지고
  lexicon: HALOT
  rationale: צָרַר의 ‘묶다/싸매다’ 이미지를 살려, 여행을 위해 은을 안전하게 보관한다는 뜻을 구체적으로 전달했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님이
  alternatives_korean:
  - 야훼 너의 하나님이
  - 여호와 당신의 하나님이
  lexicon: HALOT
  rationale: ציווי 문맥의 정중한 2인칭을 한국어 합쇼체로 옮기되, 프로젝트 기본어인 ‘야훼’를 유지하고 ‘하나님’을 표준 표기로 반영했습니다.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחַר
  english_pob_choice: to the place that ... will choose
  chosen_korean: …하실 곳으로 가십시오
  alternatives_korean:
  - 선택하실 곳으로 가십시오
  - 택하실 곳으로 가십시오
  lexicon: HALOT
  rationale: 미래형 יחס절의 의미를 한국어의 ‘선택하실’로 자연스럽게 살렸고, 목적지 이동을 ‘가십시오’로 명시했습니다.
theological_decisions:
