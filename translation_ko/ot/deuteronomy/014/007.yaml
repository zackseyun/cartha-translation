base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
  footnotes:
  - marker: a
    text: Or 'rabbit.' The Hebrew animal term likely refers to a hare, though exact zoological identification is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'hyrax.' Traditional English 'coney' is archaic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 되새김질하는 것들과 굽이 갈라진 것들 가운데서 다음 것들은 먹어서는 안 됩니다. 낙타와 산토끼[a]와 바위너구리[b]입니다. 그것들은 되새김질은 하지만 굽이 갈라져 있지 않기 때문입니다. 그것들은 너희에게 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토끼’. 히브리어 동물명은 일반적으로 산토끼를 가리키는 것으로 이해되지만, 정확한 동물학적 동일시에는 논란이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하이랙스’. ‘바위너구리’는 전통적 명칭이며, 하이랙스는 더 전문적인 동물명입니다.
    reason: lexical_alternative
