revisions:
- from: 그러나[a] 너희는 굽이 갈라지고 되새김질하는 것들 가운데서 이것을 먹어서는 안 됩니다. 곧 낙타와 토끼와 바위너구리입니다. 그것들은 되새김질은 하지만 굽을 갈라놓지 않기[b] 때문입니다. 그것들은 너희에게 부정합니다.
  to: 그러나 너희는 되새김질하는 것들과 굽이 갈라진 것들 가운데서 다음 것들은 먹어서는 안 됩니다. 낙타와 산토끼[a]와 바위너구리[b]입니다. 그것들은 되새김질은 하지만 굽이 갈라져 있지 않기 때문입니다. 그것들은 너희에게 부정합니다.
  rationale: 원문의 병렬된 분류 표현을 그 순서대로 회복하고, 굽에 관한 부정 진술을 자연스러운 상태 표현으로 수정했습니다. 영어 POB 감사 기록의 두 동물명 관련 각주를 각각 해당 한국어 동물명에 정확히 연결했습니다. ‘부정합니다’는 정결법의 핵심 용어를 해석적으로 좁히지 않고 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:55Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ‘굽이 갈라지고 되새김질하는’으로 히브리어의 두 분류 표현 순서를 뒤집었고, 두 조건을 하나의 결합된 수식어처럼 제시합니다. 원문은 먼저 되새김질하는 것들, 이어서 굽이 갈라진 것들 가운데서 열거된 동물들을 제외합니다. 또한 원문의 ‘굽이 갈라지지 않았다’는 진술은 ‘굽을 갈라놓지’보다 상태를 나타내는 표현이 더 충실합니다.
  naturalness: ‘되새김질은 하지만 굽이 갈라져 있지 않기 때문입니다’는 현대 표준어 합쇼체로 자연스럽고, 법규 문맥에도 적절합니다. ‘다음 것들은’은 목적어 표지와 열거를 매끄럽게 연결합니다.
  terminology: ‘부정합니다’는 טְמֵאִים의 정결법 용어를 적절히 보존합니다. אַרְנֶבֶת는 본문에서 ‘산토끼’로 옮기고 ‘토끼’를 각주 대안으로 두는 편이 영어 POB의 어휘 판단과 불확실성을 충실히 반영합니다. הַשָּׁפָן의 ‘바위너구리’는 유지하되 ‘하이랙스’를 각주로 제시합니다.
