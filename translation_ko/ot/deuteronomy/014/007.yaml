  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
  footnotes:
  - marker: a
    text: Or 'rabbit.' The Hebrew animal term likely refers to a hare, though exact zoological identification is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'hyrax.' Traditional English 'coney' is archaic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나[a] 너희는 굽이 갈라지고 되새김질하는 것들 가운데서 이것을 먹어서는 안 됩니다. 곧 낙타와 토끼와 바위너구리입니다. 그것들은 되새김질은 하지만 굽을 갈라놓지 않기[b] 때문입니다. 그것들은 너희에게 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오직’. 히브리어는 앞 규정에 대한 제한/예외를 나타냅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나누지 않기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 그러나만
  lexicon: HALOT
  rationale: 앞 절의 규정에 대한 예외·제한을 표시하는 접속부로서, 현대 한국어에서 가장 자연스럽게 대립과 제한을 함께 드러냅니다.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  english_pob_choice: from among those that chew the cud
  chosen_korean: 되새김질하는 것들 가운데서
  alternatives_korean:
  - 되새김질하는 것들 중에서
  - 되새김질하는 짐승들 가운데서
  lexicon: HALOT
  rationale: 관용적 표현을 직역으로만 두지 않고, 법규 문맥에 맞게 ‘되새김질하다’로 살리면서 대상을 포괄적으로 표현했습니다.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  english_pob_choice: from among those that have a divided hoof
  chosen_korean: 굽이 갈라지고
  alternatives_korean:
  - 굽이 나뉘고
  - 갈라진 굽을 가진
  lexicon: HALOT
  rationale: ‘divided hoof’를 한국어에서 통용되는 법규적 표현으로 자연스럽게 옮겼습니다. 본문 반복구와 맞추어 동일 어휘를 유지했습니다.
- source_word: הָאַרְנֶבֶת
  english_pob_choice: the hare
  chosen_korean: 토끼
  alternatives_korean:
  - 산토끼
  - 들토끼
  lexicon: HALOT
  rationale: 영어 POB 각주가 zoological identification의 불확실성을 반영하지만, 한국어 독자에게는 ‘토끼’가 가장 즉시 이해되는 대응어이므로 본문에는 자연어를 택했습니다.
- source_word: הַשָּׁפָן
  english_pob_choice: the rock badger
  chosen_korean: 바위너구리
  alternatives_korean:
  - 바위사향쥐
  - 하이랙스
  lexicon: HALOT
  rationale: 영어 POB의 ‘rock badger’에 대응하는 한국어 관용 표현으로, 정확한 분류명보다 본문 가독성을 우선했습니다.
- source_word: טְמֵאִים הֵם לָכֶם
  english_pob_choice: They are unclean for you
  chosen_korean: 그것들은 너희에게 부정합니다
  alternatives_korean:
  - 그것들은 너희에게 부정합니다
  - 그것들은 너희에게 깨끗하지 않습니다
  lexicon: HALOT
  rationale: 정결법 문맥의 טָמֵא를 전통 교회어인 ‘부정하다’로 옮겨, 제의적·언약적 범주를 흐리지 않고 유지했습니다.
theological_decisions:
- issue: 정결/부정 용어의 범위
  chosen_reading: ‘부정합니다’로 유지하여 법규적·언약적 부정 상태를 드러냅니다.
  alternative_readings:
  - ‘의식적으로 부정합니다’
  - ‘제의적으로 부정합니다’
  rationale: 본문은 부정의 성격을 설명하기보다 해당 동물의 금지 상태를 선언하므로, 번역문은 해석을 덧붙이지 않고 원어의 범주를 그대로 보존하는 편이 더 투명합니다.
  doctrine_reference: 'Translation philosophy: preserve lexical transparency and covenantal purity categories without narrowing טָמֵא to a single doctrinal gloss.'
