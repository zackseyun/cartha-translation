  - 제 종류대로
  lexicon: Hebrew formula
  rationale: 창세기와 음식 정결 규정에서 반복되는 분류 공식이므로, ‘종류’와 조사 ‘-대로’를 써서 계통·종별 분류의 뜻을 그대로 살렸습니다.
