  lexicon: HALOT
  rationale: דַּיָּה는 전통적으로 ‘kite’로 옮겨지는 낱말이므로, 한국어 관용에 맞는 ‘솔개’를 사용해 서로 다른 히브리어 용어를 구분했습니다.
- source_word: לְמִינָהּ
