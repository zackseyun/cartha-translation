  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
  footnotes:
  - marker: a
    text: The identification of several birds in this verse is uncertain. 'Hawk' for תַּחְמָס may also be rendered 'owl' or another bird; 'gull' for שָׁחַף has also been rendered 'cuckoo'; and 'falcon' for נֵץ may also be rendered 'hawk.'
