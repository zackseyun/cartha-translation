    text: 히브리어로는 문자적으로 ‘타조의 딸’이지만, 여기서는 타조를 가리키는 관용적인 종명입니다.
    reason: cultural_note
  - marker: b
    text: 이 구절에 나오는 몇몇 새의 정확한 식별은 확실하지 않습니다. ‘매’로 옮긴 히브리어 단어는 올빼미나 다른 새를 가리킬 수도 있고, ‘갈매기’는 뻐꾸기 또는 다른 바닷새로, ‘송골매’는 매로 옮길 수도 있습니다. ‘그 종류들’은 히브리어의 분류 표현입니다.
    reason: lexical_alternative
