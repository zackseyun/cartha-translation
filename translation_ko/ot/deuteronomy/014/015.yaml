  - marker: b
    text: Hebrew literally, 'daughter of the ostrich,' an idiomatic species name for the ostrich.
    reason: cultural_note
translation:
  language: ko
  text: 타조와[a] 매와 갈매기와 송골매와 그 종류들입니다[b].
  philosophy: optimal-equivalence
  footnotes:
