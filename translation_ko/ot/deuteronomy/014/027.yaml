revisions:
- from: 그리고 레위인도 네 성문 안에 있거든, 그를 버려 두어서는 안 됩니다. 그는 너와 함께 몫도 유산도 없기 때문입니다.[a][b][c]
  to: 네 성문 안에 있는 레위인을[a] 버려두어서는 안 됩니다[b]. 그에게는 너와 함께 누릴 분깃이나 기업이 없기 때문입니다[c].
  rationale: 원문의 관계절 구조를 보존하고, עזב의 실질적 방치를 나타내는 ‘버려두다’를 유지했습니다. ‘분깃이나 기업’으로 חֵלֶק וְנַחֲלָה의 법적·토지 배정 문맥을 살리되, 본문에는 설명을 과도하게 덧붙이지 않았습니다. ‘너와 함께 누릴’은 עִמָּךְ의 ‘너와 함께/너희 가운데’라는 관계를 자연스러운 한국어로 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:53Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 관계절(‘네 성문 안에 있는’)과 금지 명령을 조건절로 바꾼 초안은 문장 구조를 다소 변형합니다. 또한 חֵלֶק וְנַחֲלָה는 이 문맥에서 ‘몫’보다 전통적·법적 의미를 지닌 ‘분깃’과 ‘기업’이 더 정확합니다.
  naturalness: ‘네 성문 안에 있거든’은 현대 한국어에서 조건을 새로 설정하는 듯하고, ‘너와 함께 몫도 유산도 없다’는 다소 부자연스럽습니다. 관계절과 ‘너와 함께 누릴 분깃이나 기업’이라는 표현이 현대적인 합쇼체 문장으로 더 자연스럽습니다.
  terminology: ‘레위인’은 적절합니다. נַחֲלָה는 여기서 개인적 상속 재산을 주로 뜻하는 ‘유산’보다 토지 상속 분깃을 가리키는 성경적 용어 ‘기업’이 적절합니다. חֵלֶק은 ‘분깃’으로 옮기는 것이 해당 짝말을 잘 보존합니다.
