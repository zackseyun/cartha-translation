    issue: 관계절을 조건절로 변경함
    rationale: אֲשֶׁר בִּשְׁעָרֶיךָ는 ‘네 성문 안에 있는’이라는 레위인을 수식하는 관계절입니다. ‘있거든’은 조건적 뉘앙스를 더합니다.
  - severity: medium
