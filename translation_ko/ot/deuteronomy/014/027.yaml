source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
  footnotes:
  - marker: a
    text: Hebrew 'within your gates' is an idiom for one's towns or local communities.
    reason: cultural_note
  - marker: b
    text: Or 'you shall not forsake him' or 'you shall not abandon him.'
    reason: lexical_alternative
  - marker: c
    text: That is, the Levite has no normal tribal land allotment among Israel.
    reason: cross_reference
translation:
  language: ko
  text: 네 성문 안에 있는 레위인을[a] 버려두어서는 안 됩니다[b]. 그에게는 너와 함께 누릴 분깃이나 기업이 없기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네 성문 안’은 여러 성읍과 지역 공동체를 가리키는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그를 버려서는 안 됩니다’ 또는 ‘그를 저버려서는 안 됩니다’.
    reason: lexical_alternative
  - marker: c
    text: 즉, 레위인은 이스라엘 가운데서 일반적인 지파의 토지 분깃을 받지 못합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  english_pob_choice: And the Levite
  chosen_korean: 레위인도
  alternatives_korean:
  - 그리고 레위인은
  - 또한 레위인은
  lexicon: HALOT
  rationale: 레위인을 일반 집단명으로 그대로 옮기되, 앞의 문맥과 연결되는 첨가 의미를 살려 '도'를 넣어 포함 관계를 드러냈습니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 네 성문 안에
  alternatives_korean:
  - 네 성읍 안에
  - 네 마을 안에
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자 이미지를 살리면서도 한국어에서 자연스러운 공동체 지시로 읽히도록 '성문 안에'로 옮겼습니다.
- source_word: לֹא תַעַזְבֶנּוּ
  english_pob_choice: you shall not neglect him
  chosen_korean: 그를 버려 두어서는 안 됩니다
  alternatives_korean:
  - 그를 외면해서는 안 됩니다
  - 그를 저버려서는 안 됩니다
  lexicon: HALOT
  rationale: עזב의 핵심은 단순한 감정적 '포기'보다 실제 돌봄의 부재를 포함하므로, 사회적 의무를 드러내는 '버려 두다'를 택했습니다.
- source_word: חֵלֶק וְנַחֲלָה
  english_pob_choice: portion or inheritance
  chosen_korean: 몫도 유산도
  alternatives_korean:
  - 분깃도 기업도
  - 분배 몫도 상속 유산도
  lexicon: HALOT
  rationale: 두 명사를 구분해 번역해, 레위인이 이스라엘의 정상적인 지파 토지 분배에 참여하지 못한다는 점을 한국어로도 분명히 했습니다.
theological_decisions:
- issue: 레위인의 결핍이 가리키는 바
  chosen_reading: 이 구절은 레위인이 이스라엘의 일반적인 지파 토지 몫을 받지 못했기 때문에 공동체의 지속적 돌봄이 필요하다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 사회적으로 소외되어 있다는 뜻으로만 읽는 방법
  rationale: '''몫과 유산''의 병렬은 신명기 문맥에서 토지 분배 부재를 가리키는 표지이므로, 그 배경을 본문 밖 설명으로 과장하지 않으면서도 번역에 반영했습니다.'
  doctrine_reference: 신명기 18:1-2, 여호수아 13:14
