    rationale: 이 구절의 ‘분깃과 기업’은 레위인에게 없는 이스라엘 내의 토지 상속·배정 몫을 가리킵니다. ‘기업’이 한국어 성경 용례와 문맥상 의미에 더 맞습니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 배치됨
    rationale: 각 주석이 설명하는 표현 바로 뒤에 표지를 두면 독자가 성문 관용구, 동사의 대안 번역, 토지 분깃 배경을 더 명확히 연결할 수 있습니다.
