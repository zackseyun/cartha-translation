  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
  footnotes:
  - marker: a
    text: The identification of the Hebrew bird names in this verse is uncertain. 'Eagle' may possibly refer to a large vulture; 'bearded vulture' is traditionally 'ossifrage'; and 'black vulture' is rendered by some as 'osprey' or 'sea eagle.'
    reason: lexical_alternative
translation:
  language: ko
  text: '또 여러분이 그 새들 가운데서 먹어서는 안 되는 것은 다음과 같습니다: 독수리, 수염수리, 검은독수리입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 히브리어 새 이름들의 정확한 종 식별은 확실하지 않습니다. ‘독수리’로 옮긴 נֶשֶׁר은 큰 독수리류 또는 큰 독수리와 비슷한 새를 가리킬 수 있습니다. פֶּרֶס는 전통적으로 ossifrage라고 불린 수염수리로 이해되며, ‘검은독수리’로 옮긴 עָזְנִיָּה는 물수리 또는 바다독수리로 번역되기도 합니다.
    reason: lexical_alternative
