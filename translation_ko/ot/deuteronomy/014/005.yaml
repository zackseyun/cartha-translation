  rationale: 산악 지대의 염소류를 지칭하며, '산양'이 가장 명확한 번역임.
- source_word: דִישֹׁ֖ן
  english_pob_choice: ibex
  chosen_korean: 야생염소
  alternatives_korean: 야생염소, 이벡스
  lexicon: WLC
  rationale: 확실하지 않은 종명이나, '야생염소'로 번역하여 일반 독자에게 이해되도록 함.
- source_word: תְא֥וֹ
  english_pob_choice: antelope
  chosen_korean: 사슴
  alternatives_korean: 사슴, 영양
  lexicon: WLC
  rationale: 전통적으로 사슴류로 번역되나, 실제 종명은 불확실하므로 '사슴'으로 통일하되 주석에서 '영양'을 언급함.
- source_word: זָֽמֶר
  english_pob_choice: mountain sheep
  chosen_korean: 산양
  alternatives_korean: 산양, 산양
  lexicon: WLC
  rationale: 산악 지대의 양류를 지칭하며, '산양'으로 번역함.
theological_decisions:
