  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
  footnotes:
  - marker: a
    text: Several animal names in this verse are uncertain. 'Roebuck' may also be 'fallow deer' or 'red deer'; 'wild goat' may be 'ibex'; 'ibex' may also be 'addax'; 'antelope' may be 'wild ox' or 'aurochs'; 'mountain sheep' may be 'chamois' or 'mountain goat.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사슴과 노루와 고라니와 산양과 야생염소와 사슴과 산양이니라.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 본 절의 동물 이름들은 불확실한 부분이 많습니다. '사슴'은 '노루'나 '사슴'일 수 있으며, '야생염소'는 '이벡스'일 수 있습니다. '영양'은 '야생 소'나 '우록'일 수 있고, '산양'은 '샤모아'나 '산염소'일 수 있습니다.
    source: WLC
lexical_decisions:
- source_word: אַיָּ֥ל
