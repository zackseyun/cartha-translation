  rationale: 히브리어 원문의 동물명이 현대 생물학적 분류와 완벽히 일치하지 않을 수 있으므로, 번역 본문에서는 가장 일반적인 명칭을 사용하되, 주석을 통해 학문적 불확실성을 명시하여 성경의 정확성을 유지함.
