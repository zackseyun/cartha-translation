lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  english_pob_choice: You shall surely tithe
  chosen_korean: 반드시 드려야 합니다
  alternatives_korean:
  - 십일조를 드려야 합니다
  - 반드시 십일조를 바쳐야 합니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형 반복은 강한 의무를 나타내므로, 한국어에서는 ‘반드시’로 그 강조를 살리고 ‘드려야 합니다’로 명령적 의무를 자연스럽게 표현했습니다.
- source_word: תְּבוּאַת
  english_pob_choice: produce
  chosen_korean: 소산
  alternatives_korean:
  - 산출물
  - 수확
  - 소출
  lexicon: HALOT
  rationale: ‘produce’에 해당하는 넓은 농산물 개념을 한국어 ‘소산’으로 옮기면 지나치게 한정하지 않으면서도 성경적 어감을 유지할 수 있습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your seed
  chosen_korean: 밭에서 나는
  alternatives_korean:
  - 네 씨앗의
  - 네가 뿌린
  lexicon: HALOT
  rationale: 직역하면 ‘네 씨’이지만, 이 절에서는 실제로 거두는 농산물을 가리키므로 앞뒤 문맥을 따라 ‘밭에서 나는’으로 풀어 자연스럽게 받았습니다.
- source_word: שָׁנָה שָׁנָה
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 해마다 계속
  - 매년
  lexicon: HALOT
  rationale: 반복을 통한 분배적 의미를 한국어의 관용적 표현 ‘해마다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 십일조 명령의 법적 강도
  chosen_reading: 명령형의 반복을 살려 자발적 권고가 아니라 반드시 이행해야 하는 의무로 번역했습니다.
  alternative_readings:
  - ‘매년 십일조를 드리십시오’처럼 보다 부드럽게 표현
  - ‘꼭 십일조를 하십시오’처럼 완화된 권고로 표현
  rationale: 본문의 부정사 절대형은 단순 권유보다 강한 규범성을 가지므로, 이를 약화하지 않는 것이 원문 의도를 보존합니다.
  doctrine_reference: 언약적 율법의 규정에 대한 충실한 반영
- issue: ‘your seed’의 농업적 이미지 보존
  chosen_reading: ‘씨’의 직역보다 농경 맥락이 드러나는 표현을 택해 실제 수확물의 의미를 보존했습니다.
  alternative_readings:
  - ‘네 씨의 모든 소산’처럼 직역
  - ‘네가 뿌린 모든 것’처럼 설명
  rationale: 이 절의 초점은 씨 자체가 아니라 밭에서 난 산출물에 있으므로, 이미지보다 의미를 우선해 이해 가능하게 옮겼습니다.
  doctrine_reference: 문맥 우선의 의미 전달
