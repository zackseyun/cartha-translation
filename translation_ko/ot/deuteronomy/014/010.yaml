  - 더럽다
  rationale: 본문은 도덕적 오염이 아니라 식이·정결 범주의 판정을 말하므로, 한국어로도 의례적 구분이 살아 있는 ‘부정하다’가 가장 정확합니다.
  doctrine_reference: 레위기/신명기의 정결법 어휘 일관성
