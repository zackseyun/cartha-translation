lexical_decisions:
- source_word: וְ/כֹל אֲשֶׁר אֵין לוֹ
  english_pob_choice: But anything that does not have
  chosen_korean: 그러나 … 없는 것은 무엇이든
  alternatives_korean:
  - 그리고 … 없는 것은 무엇이든
  - 하지만 … 없는 것은 무엇이든
  lexicon: HALOT
  rationale: 문맥상 앞선 허용 규정과 대비되는 금지이므로 역접을 살리되, 전면적 범위를 나타내는 표현은 한국어 자연성을 고려해 ‘무엇이든’으로 옮겼습니다.
- source_word: סְנַפִּיר
  english_pob_choice: fins
  chosen_korean: 지느러미
  alternatives_korean:
