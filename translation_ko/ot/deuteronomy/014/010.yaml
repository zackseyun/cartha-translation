  lexicon: HALOT
  rationale: 정결 규정의 기술어 טָמֵא는 전통적 용례를 살리되, 현대 한국어에서 통용되는 성경적 법정·의례 용법으로 ‘부정하다’를 택했습니다. ‘여러분에게’는 לָכֶם의 관계적 지시를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 정결/부정 규정의 용어 선택
  chosen_reading: טָמֵא를 ‘부정하다’로 옮겨 의례적 부정 상태를 나타냈습니다.
  alternative_readings:
