  - 핀
  lexicon: HALOT
  rationale: 물고기의 지느러미를 가리키는 표준 한국어 표현은 ‘지느러미’이므로 이를 사용했습니다.
- source_word: וְ/קַשְׂקֶשֶׂת
  english_pob_choice: scales
  chosen_korean: 비늘
  alternatives_korean:
  - 비늘들
  - 비늘판
  lexicon: HALOT
  rationale: 어류의 겉면을 가리키는 일반적이고 성경 문맥에 적절한 대응어는 ‘비늘’입니다.
- source_word: טָמֵא הוּא לָכֶם
  english_pob_choice: it is unclean for you
  chosen_korean: 그것은 여러분에게 부정합니다
  alternatives_korean:
  - 그것은 여러분에게 부정합니다
  - 그것은 여러분에게 깨끗하지 않습니다
  lexicon: HALOT
  rationale: 정결 규정의 기술어 טָמֵא는 전통적 용례를 살리되, 현대 한국어에서 통용되는 성경적 법정·의례 용법으로 ‘부정하다’를 택했습니다. ‘여러분에게’는 לָכֶם의 관계적 지시를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 정결/부정 규정의 용어 선택
  chosen_reading: טָמֵא를 ‘부정하다’로 옮겨 의례적 부정 상태를 나타냈습니다.
  alternative_readings:
  - 깨끗하지 않다
  - 더럽다
  rationale: 본문은 도덕적 오염이 아니라 식이·정결 범주의 판정을 말하므로, 한국어로도 의례적 구분이 살아 있는 ‘부정하다’가 가장 정확합니다.
  doctrine_reference: 레위기/신명기의 정결법 어휘 일관성
