  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
  footnotes:
  - marker: a
    text: Or 'because the LORD your God blesses you.' The Hebrew conjunction can be read causally as well as temporally here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그 길이 너무 멀어서 그것을 가지고 갈 수 없고, 여호와 당신의 하나님께서 자기 이름을 두시려고 택하실 그 곳이 당신에게서 너무 멀리 있으면, 여호와 당신의 하나님께서 당신을 복 주실 때에[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호와’는 본문의 하나님의 이름 יְהוָה를 반영한 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 앞절의 지시를 이어 받는 조건절이므로 연결성은 살리되, 한국어 법문체에서는 ‘그리고 만일’이 자연스럽습니다.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  english_pob_choice: the journey is too long for you
  chosen_korean: 그 길이 너무 멀어서
  alternatives_korean:
  - 그 길이 너무 길어서
  - 그 여정이 당신에게 너무 길어서
  - 그 길이 당신에게 너무 멀어져서
  lexicon: HALOT
  rationale: 직역의 ‘길이 커지다’보다 문맥상 거리 과다를 드러내는 ‘너무 멀다’가 한국어로 더 정확하고 자연스럽습니다.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  english_pob_choice: to put his name there
  chosen_korean: 자기 이름을 두시려고
  alternatives_korean:
  - 그의 이름을 두시려고
  - 자기 이름을 두려고
  - 그의 이름을 세우시려고
  lexicon: HALOT
  rationale: 신명기의 전형적 표현인 ‘이름을 두다’를 유지해 선택된 예배처의 언약적 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project default / Korean ecclesial usage
  rationale: 한국어 본문은 기존 POB 영어판의 ‘Yahweh’에 대응하는 학술 음역보다, 현재 한국어 성경 독자에게 식별 가능한 표기를 우선하여 ‘여호와’를 사용했습니다.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: when Yahweh your God blesses you
  chosen_korean: 여호와 당신의 하나님께서 당신을 복 주실 때에
  alternatives_korean:
  - 여호와 당신의 하나님께서 당신을 복 주시기 때문에
  - 여호와 당신의 하나님께서 당신을 축복하실 때에
  lexicon: HALOT
  rationale: כי의 시간적 용법을 따라 ‘...하실 때에’로 옮겨, 많은 소출이 생기는 상황을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: כי의 시간적/원인적 중의성
  chosen_reading: 본문은 ‘복 주실 때에’로 옮기되, 원인적 뉘앙스는 문맥상 배경으로 남겨 둡니다.
  alternative_readings:
  - ‘복 주시기 때문에’
  - ‘복 주시면’
  rationale: 히브리어 כי는 여기서 시간과 원인을 모두 암시할 수 있으나, 짐을 멀리 운반해야 하는 상황의 계기를 말하는 문맥에는 시간적 번역이 더 분명합니다.
  doctrine_reference: 신 14:24의 문맥적 접속사 해석
