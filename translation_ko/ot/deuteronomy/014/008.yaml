id: DEU.14.8
reference: Deuteronomy 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
  footnotes:
  - marker: a
    text: Or 'the swine.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'does not chew cud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 돼지는 발굽이 갈라졌지만 되새김질을 하지 않으므로, 여러분에게 부정한 것입니다. 여러분은 그 고기를 먹어서는 안 되며, 그 사체를 만져서도 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  english_pob_choice: the pig
  chosen_korean: 돼지
  alternatives_korean:
  - 돼지새끼
  - 멧돼지
  lexicon: HALOT
  rationale: 현대 한국어에서 가장 자연스럽고 명확한 동물명으로 옮겼습니다. 영어 POB의 'pig'에 대응하며, '멧돼지'는 다른 동물을 가리키므로 배제했습니다.
- source_word: מַפְרִיס פַּרְסָה
  english_pob_choice: has a split hoof
  chosen_korean: 갈라진 굽은 있지만
  alternatives_korean:
  - 굽이 둘로 갈라졌지만
  - 발굽이 갈라져 있지만
  lexicon: HALOT
  rationale: 발굽의 분할 상태를 자연스럽게 살리되, 토라의 식별 기준이라는 점이 드러나도록 간결하게 옮겼습니다.
- source_word: גֵרָה
  english_pob_choice: chew the cud
  chosen_korean: 되새기지
  alternatives_korean:
  - 되새김질하지
  - 되씹지
  lexicon: HALOT
  rationale: 율법 문맥에서 정형화된 표현인 '되새기다'를 사용해 동물학적 기준을 분명히 했습니다.
- source_word: טָמֵא
  english_pob_choice: unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정합니다
  - 부정한 것입니다
  lexicon: HALOT
  rationale: 제의적/율법적 상태를 나타내는 טָמֵא를 관습적이지 않은 '부정하다'로 직접 옮겨, 단순한 위생 문제가 아니라 언약 공동체의 정결 범주임을 드러냈습니다.
- source_word: מִבְּשָׂרָם
  english_pob_choice: any of its flesh
  chosen_korean: 그 고기
  alternatives_korean:
  - 그 살
  - 그 육체
  lexicon: HALOT
  rationale: 히브리어의 구체적 '살/고기'를 한국어에서 자연스럽고 식용 맥락에 맞는 '고기'로 옮겼습니다. 문장 전체의 금지 사항을 고려해 과도한 직역을 피했습니다.
- source_word: וּבְנִבְלָתָם
  english_pob_choice: their carcass
  chosen_korean: 그 사체
  alternatives_korean:
  - 그 주검
  - 그 시체
  lexicon: HALOT
  rationale: 죽은 동물의 법적 용어에 해당하는 נְבֵלָה를 '사체'로 옮겨, 단순한 '죽은 몸'보다 규범적이고 구체적인 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 토라 정결 규정의 의미 범위
  chosen_reading: טָמֵא를 '부정합니다'로 옮겨, 도덕적 악이 아니라 언약적·제의적 부정 상태를 나타내도록 했습니다.
  alternative_readings:
  - 더럽습니다
  - 불결합니다
  rationale: 본문은 돼지의 식용 금지와 사체 접촉 금지를 다루는 율법 조항이므로, 후대 교리적 함의를 덧붙이지 않고 본문의 법적 범주를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 금지문의 직접성
  chosen_reading: '''먹어서는 안 됩니다''와 ''만져서는 안 됩니다''로 직접 금지형을 유지했습니다.'
  alternative_readings:
  - 먹지 마십시오
  - 접촉하지 마십시오
  rationale: 히브리어 명령문의 강도를 보존하되, 현대 한국어 합쇼체에 맞게 자연스럽게 조정했습니다.
  doctrine_reference: Translation philosophy §1, §5
