revisions:
- from: 그리고 돼지는, 갈라진 굽은 있지만 되새기지 않으므로, 여러분에게 부정합니다. 여러분은 그 고기를 먹어서는 안 되며, 그 사체도 만져서는 안 됩니다.[a][b]
  to: 돼지는 발굽이 갈라졌지만 되새김질을 하지 않으므로, 여러분에게 부정한 것입니다. 여러분은 그 고기를 먹어서는 안 되며, 그 사체를 만져서도 안 됩니다.
  rationale: 부정확한 ‘멧돼지’ 대안 각주와 본문을 반복할 뿐인 각주를 삭제했습니다. 본문은 돼지의 갈라진 발굽, 되새김질하지 않음, 율법상의 부정, 고기 섭취 및 사체 접촉 금지를 모두 보존하며, 현대 합쇼체 문장으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:50Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. אולם הַחֲזִיר는 일반적인 ‘돼지’이지 ‘멧돼지’가 아니며, מִבְּשָׂרָם과 נִבְלָתָם의 금지 대상은 각각 고기와 사체입니다. 개정문은 이를 직접적이고 자연스럽게 유지합니다.
  naturalness: ‘갈라진 굽은 있지만’보다 ‘발굽이 갈라졌지만’이 현대 표준 한국어에서 더 자연스럽고 정확합니다. 또한 ‘여러분에게 부정합니다’는 서술어 용법으로 다소 어색할 수 있어 ‘여러분에게 부정한 것입니다’로 다듬었습니다.
  terminology: טָמֵא는 율법·제의 문맥의 정결 범주를 보존하는 ‘부정한’으로, נְבֵלָה는 죽은 동물의 몸을 가리키는 ‘사체’로 유지했습니다. ‘되새김질’은 גֵרָה의 동물학적 기준을 명료하게 전달합니다.
  issues:
  - severity: medium
    issue: 각주 a의 ‘또는 멧돼지’
    rationale: הַחֲזִיר의 어휘 대안은 ‘돼지/swine’이지, 별개의 동물종을 가리킬 수 있는 ‘멧돼지’가 아닙니다. 따라서 이 각주는 부정확합니다.
  - severity: medium
    issue: 각주 b의 내용과 표지 위치
    rationale: 본문이 이미 ‘되새김질을 하지 않으므로’라고 번역하므로 ‘직역하면 되새기지 않는다’는 각주는 유의미한 대안을 제공하지 않습니다. 또한 두 표지가 문장 끝에 함께 놓여 어느 단어를 받는지 불명확합니다.
  - severity: low
    issue: ‘갈라진 굽’ 표현
    rationale: פַּרְסָה는 동물의 발굽을 뜻하므로 ‘발굽이 갈라졌지만’이 더 통상적이며 명료합니다.
  revised_text: 돼지는 발굽이 갈라졌지만 되새김질을 하지 않으므로, 여러분에게 부정한 것입니다. 여러분은 그 고기를 먹어서는 안 되며, 그 사체를 만져서도 안 됩니다.
  revised_footnotes: []
  revision_rationale: 부정확한 ‘멧돼지’ 대안 각주와 본문을 반복할 뿐인 각주를 삭제했습니다. 본문은 돼지의 갈라진 발굽, 되새김질하지 않음, 율법상의 부정, 고기 섭취 및 사체 접촉 금지를 모두 보존하며, 현대 합쇼체 문장으로 다듬었습니다.
