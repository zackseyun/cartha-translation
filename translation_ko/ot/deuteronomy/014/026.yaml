  terminology: ‘야훼’, ‘포도주’, ‘독주’는 원문의 구별과 프로젝트의 명칭 방침을 따릅니다. נֶפֶשׁ을 ‘마음’으로 옮긴 것은 한국어에서 욕구를 나타내는 자연스러운 관용이며, 각주로 그 의미 범위를 보완합니다. בַּיִת는 여기서 ‘집안’으로 옮길 수 있습니다.
