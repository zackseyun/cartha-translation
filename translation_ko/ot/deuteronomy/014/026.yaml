source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
  footnotes:
  - marker: a
    text: Hebrew 'the silver'; that is, money.
    reason: lexical_alternative
  - marker: b
    text: Or 'whatever your soul desires ... whatever your soul asks for.' Here 'soul' refers to personal desire or appetite.
    reason: lexical_alternative
  - marker: c
    text: '''Strong drink'' refers to an intoxicating beverage other than wine.'
    reason: cultural_note
translation:
  language: ko
  text: 그 은[a]을 네 마음[b]이 원하는 모든 것, 곧 소나 양이나 포도주나 독주[c]나 네 마음이 구하는 모든 것을 사는 데 쓰십시오. 그리고 거기에서 야훼 네 하나님 앞에서 먹고, 너와 네 집안이 기뻐하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은’이라고 하며, 여기서는 돈을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음’은 여기서 개인의 욕구와 갈망을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘독주’는 포도주가 아닌 취하게 하는 음료를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  english_pob_choice: spend the silver
  chosen_korean: 그 은을 … 써서
  alternatives_korean:
  - 그 돈을 … 쓰고
  - 그 은을 … 사용하여
  lexicon: HALOT
  rationale: 매매·소비 문맥이므로 단순한 ‘주다’보다 ‘써서’가 원문의 실제 용도를 살립니다. ‘은’은 문자적으로 유지하되 한국어에서는 돈의 뜻을 자연스럽게 전달합니다.
- source_word: נַפְשְׁךָ / נַפְשֶׁךָ
  english_pob_choice: your appetite
  chosen_korean: 네 마음이 원하는 것
  alternatives_korean:
  - 네 영혼이 원하는 것
  - 네가 원하는 것
  lexicon: HALOT
  rationale: 여기 נֶפֶשׁ은 추상적 ‘영혼’보다 먹고 마시는 맥락의 ‘욕구/갈망’을 가리키므로, 과도하게 영적화하지 않고 ‘마음이 원하는 것’으로 옮겼습니다.
- source_word: וּבַשֵּׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 강한 술
  - 독한 술
  - 술
  lexicon: HALOT
  rationale: יין(포도주)과 구별되는 발효성 음료라는 점을 드러내기 위해, 현대 한국어에서 의미 구분이 분명한 ‘독주’를 선택했습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: before Yahweh your God
  chosen_korean: 야훼 너희 하나님 앞에서
  alternatives_korean:
  - 야훼 네 하나님 앞에서
  - 주 너의 하나님 앞에서
  lexicon: HALOT
  rationale: 본문의 예배적 표지를 살려 ‘앞에서’를 유지했고, 신명기의 공동체적 호소에 맞게 ‘너희 하나님’으로 옮겼습니다.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  english_pob_choice: and rejoice, you and your household
  chosen_korean: 너와 네 집안이 기뻐하십시오
  alternatives_korean:
  - 너와 네 집안이 기뻐하십시오
  - 너와 네 집안이 즐거워하십시오
  lexicon: HALOT
  rationale: ‘집안’은 בַּיִת의 사회적 단위를 자연스럽게 살리며, 예배 자리의 공동 기쁨을 한국어 합쇼체로 분명하게 전합니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 언약명은 일반 명칭 ‘주’로 희석하지 않고, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: ‘독주’가 음주를 암시하는지 여부
  chosen_reading: 포도주와 독주
  alternative_readings:
  - 포도주와 술
  - 포도주와 강한 술
  rationale: 히브리어는 포도주와 별도의 취하는 음료를 병기하므로, 이를 완화하지 않고 두 범주를 모두 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
