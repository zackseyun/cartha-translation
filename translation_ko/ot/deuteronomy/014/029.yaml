id: DEU.14.29
reference: Deuteronomy 14:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
  footnotes:
  - marker: a
    text: Or 'the resident foreigner' for 'the sojourner.' The Hebrew term refers to a non-Israelite living among Israel.
    reason: lexical_alternative
  - marker: b
    text: Literally 'within your gates,' an idiom for those living within your towns or local community.
    reason: cultural_note
translation:
  language: ko
  text: 레위 사람도 와야 합니다. 그는 당신과 함께 몫도 유산도 없기 때문입니다. 그리고 당신의 성문 안에 있는 나그네와 고아와 과부도 와서 먹고 배부를 것입니다. 이는 당신의 하나님 야훼께서 당신이 하는 모든 일에 복을 주시기 위함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 히브리어 גֵּר의 표준적 대응으로, 이스라엘 가운데 거주하는 비이스라엘인이라는 의미를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문 안’은 마을이나 지역 공동체 안에 속한 사람들을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא הַלֵּוִי
  english_pob_choice: And the Levite shall come
  chosen_korean: 레위 사람도 와야 합니다
  alternatives_korean:
  - 레위 사람은 와야 합니다
  - 그리고 레위인이 옵니다
  lexicon: HALOT
  rationale: 법적·지시문 맥락에서 기대되는 동작을 한국어 의무 표현으로 옮겼고, הַלֵּוִי는 직역적으로 ‘레위 사람’으로 두어 직분을 과잉 해석하지 않았습니다.
- source_word: חֵלֶק וְנַחֲלָה
  english_pob_choice: portion or inheritance
  chosen_korean: 몫도 유산도
  alternatives_korean:
  - 분깃도 유산도
  - 분배 몫도 상속분도
  lexicon: HALOT
  rationale: 쌍어구의 경제·상속 의미를 살리되 한국어에서 자연스러운 대구로 ‘몫 / 유산’을 택했습니다.
- source_word: הַגֵּר ... אֲשֶׁר בִּשְׁעָרֶיךָ
  english_pob_choice: the sojourner ... who are within your gates
  chosen_korean: 당신의 성문 안에 있는 나그네
  alternatives_korean:
  - 당신의 성문 안에 있는 거류민
  - 당신의 성읍 안에 있는 타국인
  lexicon: HALOT
  rationale: גֵּר는 ‘나그네’가 표준적이면서도 단순한 동태·거주 상태를 유지하며, ‘성문 안’은 공동체 경계의 관용구를 비교적 직접적으로 보존합니다.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  english_pob_choice: and they shall eat and be satisfied
  chosen_korean: 와서 먹고 배부를 것입니다
  alternatives_korean:
  - 와서 먹고 만족할 것입니다
  - 와서 먹고 충분히 먹을 것입니다
  lexicon: HALOT
  rationale: ‘배부르다’는 ‘만족/충족’의 결과를 한국어 관용으로 자연스럽게 옮기며, 본문의 공급 목적을 선명하게 드러냅니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 당신의 하나님 여호와
  - 당신의 하나님 주
  lexicon: HALOT
  rationale: 문서의 기준에 따라 יהוה를 ‘야훼’로 옮기고, 소유격 관계를 유지해 언약적 호칭을 보존했습니다.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ ... אֲשֶׁר תַּעֲשֶׂה
  english_pob_choice: in all the work of your hands that you do
  chosen_korean: 당신이 하는 모든 일
  alternatives_korean:
  - 당신의 손으로 하는 모든 일
  - 당신이 행하는 모든 일
  lexicon: HALOT
  rationale: 히브리어의 ‘손의 일’ 관용을 한국어에서는 더 자연스러운 총칭 ‘하는 모든 일’로 풀되, 행위 전체를 포괄하는 의미를 유지했습니다.
theological_decisions:
- issue: 성문 안에 있는 사람들의 범주를 어떻게 옮길지
  chosen_reading: ‘나그네, 고아, 과부’를 공동체 내부의 보호 대상 집단으로 보존했습니다.
  alternative_readings:
  - ‘거류민, 고아, 과부’로 더 직역하기
  - ‘타국인, 고아, 과부’로 옮기기
  rationale: 본문은 레위인과 함께 사회적 약자를 같은 식탁의 수혜자로 묶어 말하므로, 교회적·도덕적 완화 없이 취약한 집단 구분을 그대로 드러내는 편이 원문의 의도를 더 잘 반영합니다.
  doctrine_reference: 사회적 약자 보호와 언약 공동체의 의무
- issue: 축복의 결과를 목적절로 처리할지
  chosen_reading: ‘... 위함입니다’로 옮겨 לְמַעַן의 목적성을 드러냈습니다.
  alternative_readings:
  - ‘... 하여 야훼께서 복을 주실 것입니다’
  - ‘... 그래서 야훼께서 복을 주십니다’
  rationale: לְמַעַן은 단순 예언보다 목적·결과의 연결을 강하게 나타내므로, 한국어에서도 결과 목적을 분명히 하는 표현이 더 적합합니다.
  doctrine_reference: 문법적 목적절의 보존
