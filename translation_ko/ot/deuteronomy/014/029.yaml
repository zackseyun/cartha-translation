revisions:
- from: 레위 사람도 와야 합니다. 그는 당신과 함께 몫도 유산도 없기 때문입니다. 그리고 당신의 성문 안에 있는 나그네와 고아와 과부도 와서 먹고 배부를 것입니다. 이는 당신의 하나님 야훼께서 당신이 하는 모든 일에 복을 주시기 위함입니다.[a][b]
  to: 레위인은 당신과 함께 받을 몫이나 유산이 없으므로, 그도 올 것이며, 당신의 성문 안에 사는 나그네[a], 고아, 과부도 와서 먹고 배부를 것입니다. 그리하여 당신의 하나님 야훼께서 당신이 하는 모든 일에 복을 주실 것입니다.[b]
  rationale: 레위인을 포함한 모든 수혜 집단이 와서 먹고 배부른다는 히브리어의 병렬 구조를 보이도록 문장을 재구성했습니다. ‘와야 합니다’의 직접적 의무 뉘앙스는 미래적·기대적 서술로 조정했습니다. 또한 각주 [b]의 실제 설명 대상인 ‘성문 안’ 바로 뒤로 표지를 옮겼습니다. 목적/결과 관계는 ‘그리하여’와 축복의 미래 표현으로 자연스럽게 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:53Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 레위인에게 토지 몫과 유산이 없다는 이유, 거류 외국인·고아·과부를 포함한 이들의 먹음과 배부름, 그리고 야훼의 축복이라는 핵심을 대체로 보존합니다. 다만 וּבָא와 וְאָכְלוּ의 미래/예상 서술을 각각 ‘와야 합니다’라는 의무 표현 및 다른 집단만의 행동처럼 분리한 것은 원문의 병렬 범위를 다소 흐립니다. 레위인과 세 취약 집단 모두가 와서 먹는다는 구조를 분명히 하는 편이 안전합니다.
  naturalness: ‘레위인’은 현대 한국어 성경 문체에서 ‘레위 사람’보다 자연스럽고 정확합니다. ‘성문 안’은 본문의 관용구를 보존하되 ‘사는’을 보충하면 한국어 문장 안에서 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두어 참조 범위를 명확히 해야 합니다.
  terminology: יהוה는 프로젝트 방침에 맞추어 ‘야훼’로 유지했습니다. גֵּר는 본문에서는 전통적 대응어인 ‘나그네’를 유지하고, 각주에서 이스라엘 가운데 사는 비이스라엘인이라는 사회적 지위를 설명합니다. חֵלֶק וְנַחֲלָה는 ‘몫이나 유산’으로 쌍어구를 보존했습니다.
  issues:
  - severity: medium
    issue: ‘레위 사람도 와야 합니다’가 원문의 서술적 미래/기대 표현을 직접적인 의무로 바꾸며, 뒤의 ‘와서 먹고’가 나그네·고아·과부에게만 연결되어 보입니다.
    rationale: 히브리어는 레위인 및 ‘성문 안에 있는’ 세 집단을 함께 제시한 뒤 복수 동사 ‘그들이 먹고 배부를 것이다’를 사용합니다. 한국어에서도 레위인을 포함한 집단 전체가 와서 먹는다는 연결을 드러내야 합니다.
  - severity: low
    issue: 각주 표지 [a], [b]가 문장 끝에 함께 놓여 있어 각각 ‘나그네’와 ‘성문 안’ 중 어느 표현을 설명하는지 불명확합니다.
    rationale: 어휘·문화 각주는 해당 단어나 관용구 직후에 표지하여 앵커 범위를 명확히 하는 것이 적절합니다.
  revised_text: 레위인은 당신과 함께 받을 몫이나 유산이 없으므로, 그도 올 것이며, 당신의 성문 안에 사는 나그네[a], 고아, 과부도 와서 먹고 배부를 것입니다. 그리하여 당신의 하나님 야훼께서 당신이 하는 모든 일에 복을 주실 것입니다.[b]
  revised_footnotes:
