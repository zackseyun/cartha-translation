  rationale: 본문은 고대 식물·동물 분류 체계를 따르므로, 현대 과학적 재분류를 적용하지 않고 원문 배열을 보존하는 것이 더 충실합니다.
  doctrine_reference: 성경 본문의 역사적 맥락 존중
