base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/018.yaml
  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
  footnotes:
  - marker: a
    text: Or 'the heron' for 'the stork'; the exact identification of several birds in this verse is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ibis' or 'the plover' for 'the heron.'
    reason: lexical_alternative
  - marker: c
    text: Traditional English versions often read 'lapwing'; the Hebrew term is more likely 'hoopoe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 황새와 그 종류에 따른 왜가리와, 물총새와 박쥐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀 조류명은 정확한 종 식별이 불확실합니다. 여기서는 원어 우선으로 번역했습니다.
    reason: source_note
  - marker: b
    text: 전통 번역은 이 희귀 조류명을 다르게 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  english_pob_choice: the stork
  chosen_korean: 황새
  alternatives_korean:
  - 왜가리
  lexicon: HALOT, BDB
  rationale: POB가 표준적으로 'stork'를 택한 점을 따라, 한국어도 가장 직접적인 대응어인 '황새'로 옮겼습니다. 본문에서 정확한 종 식별은 불확실하지만, 관습적 동물명 중에서는 이 대응이 가장 자연스럽습니다.
- source_word: הָאֲנָפָה
  english_pob_choice: the heron
  chosen_korean: 왜가리
  alternatives_korean:
  - 따오기
  - 도요새
  lexicon: HALOT, BDB
  rationale: POB의 'heron'에 맞추어 한국어에서는 같은 물새류를 가리키는 '왜가리'를 사용했습니다. 정확한 종은 불확실하므로, 분류상 근접한 일반 명칭을 택했습니다.
- source_word: לְמִינָהּ
  english_pob_choice: according to its kind
  chosen_korean: 그 종류에 따른
  alternatives_korean:
  - 그 종류대로
  - 그 종류를 따라
  lexicon: HALOT, BDB
  rationale: 문구의 반복 공식성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 '그 종류에 따른'으로 옮겼습니다.
- source_word: הַדּוּכִיפַת
  english_pob_choice: the hoopoe
  chosen_korean: 물총새
  alternatives_korean:
  - 후투티
  - 뿔새
  lexicon: HALOT, BDB
  rationale: 히브리어 희귀 조류명은 전통 번역과 학술 판단이 엇갈리지만, POB가 원어 우선으로 'hoopoe'를 택한 점을 고려하면 한국어의 일반적 대응어로는 현대 독자가 이해하기 쉬운 '물총새'를 채택할 수 있습니다. 다만 이는 식별 불확실성을 전제한 번역입니다.
- source_word: הָעֲטַלֵּף
  english_pob_choice: the bat
  chosen_korean: 박쥐
  alternatives_korean:
  - 날다람쥐
  lexicon: HALOT, BDB
  rationale: 히브리어가 분명히 박쥐를 가리키므로 직역을 유지했습니다. 다이어트 목록 안에서 비조류가 포함된 점도 그대로 드러납니다.
theological_decisions:
- issue: 희귀 조류명들의 불확실한 식별
  chosen_reading: 본문의 종 식별 불확실성을 드러내되, 현대 한국어 독자가 이해할 수 있는 일반 명칭으로 옮겼습니다.
  alternative_readings:
  - 음역 중심 처리
  - 전통 교회 용어 우선
  rationale: 이 절은 정확한 생물학적 식별보다 부정한 날짐승 목록의 범주를 전달하는 것이 핵심이므로, 독자 이해와 원문 범주성을 함께 살리는 방향을 택했습니다.
  doctrine_reference: 성경 번역학의 원문 우선 원칙
- issue: 박쥐를 날짐승 목록에 포함한 원문의 분류 방식
  chosen_reading: 현대 분류와 다르더라도 목록 구조를 그대로 유지했습니다.
  alternative_readings:
  - 괄호 설명 추가
  - 현대 과학 분류로 재구성
  rationale: 본문은 고대 식물·동물 분류 체계를 따르므로, 현대 과학적 재분류를 적용하지 않고 원문 배열을 보존하는 것이 더 충실합니다.
  doctrine_reference: 성경 본문의 역사적 맥락 존중
