language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
  footnotes:
  - marker: a
    text: Or 'children of the LORD your God.' The Hebrew is masculine plural, literally 'sons.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'between your eyes,' that is, on the forehead.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 야훼, 여러분의 하나님의 아들들입니다[a]. 죽은 이를 위하여 몸에 상처를 내지 말고, 눈 사이[b]에 머리카락을 밀어 대머리 자국을 내지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형으로, 문자적으로는 ‘아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여러분의 눈 사이에’이며, 이마 부위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형 בָּנִים을 사용하므로, 본문이 드러내는 형태를 살려 ‘아들들’로 옮겼습니다. ‘자녀들’은 의미를 풀어주지만 원문의 성별 표지를 약화시킵니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 여호와 이름(יהוה)은 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다. 이 선택은 언약적 고유명을 본문에서 직접 드러내려는 것입니다.
- source_word: תִתְגֹּדְדוּ
  english_pob_choice: cut yourselves
  chosen_korean: 몸을 상처 내지
  alternatives_korean:
  - 자해하지
  - 칼로 몸을 베지
  lexicon: HALOT
  rationale: 이 동사는 애도 관행으로서의 자해를 가리키므로, 직설적이면서도 자연스러운 한국어로 ‘몸을 상처 내지’라고 옮겼습니다. ‘자해’는 의미는 분명하지만 다소 현대 심리 용어로 좁아질 수 있습니다.
- source_word: בֵּין עֵינֵיכֶם
  english_pob_choice: between your eyes
  chosen_korean: 눈 사이에
  alternatives_korean:
  - 이마에
  - 눈썹 사이에
  lexicon: HALOT
  rationale: 히브리어의 직역형을 살려 ‘눈 사이에’로 두고, 신체 위치를 한국어로도 바로 보이게 했습니다. POB의 주석 취지대로 이는 이마 부위를 가리킵니다.
- source_word: לָמֵת
  english_pob_choice: for the dead
  chosen_korean: 죽은 사람을 위하여
  alternatives_korean:
  - 죽은 이를 위해
  - 죽은 자를 위하여
  lexicon: HALOT
  rationale: 문맥상 애도 대상을 가리키므로 한국어로는 대상성을 분명히 하여 ‘죽은 사람을 위하여’라고 옮겼습니다. ‘죽은 자’는 가능하지만 다소 문어적·추상적입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 출애굽기 3장 이후 계시된 언약 이름을 본문에서 직접 드러내기 위해 ‘야훼’를 유지했습니다. 이는 POB의 개정된 신명기 번역 방향과 일치합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 남성 복수 ‘아들들’의 보존
  chosen_reading: 아들들
  alternative_readings:
  - 자녀들
  rationale: 본문은 공동체 전체를 가리키더라도 히브리어 표면형은 남성 복수입니다. 성별 표지를 지우지 않고 원문 형태를 드러내는 것이 해석상 더 투명합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
