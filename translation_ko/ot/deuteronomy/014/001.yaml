  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לָמֵת(죽은 이를 위하여)가 두 금지 사항 모두에 걸리는 애도 목적어임이 더 분명하게 드러나도록 문장 순서를 조정하는 것이 좋습니다. קָרְחָה는 단순한 자연 발생의 ‘대머리 자리’가 아니라 머리카락을 밀어 만든 삭발 자국/대머리 자국을 뜻하므로 이를 명시했습니다.
  naturalness: ‘당신들은’과 ‘당신들의’의 반복은 현대 표준 한국어 성경 문체에서 부자연스럽고 거리감이 있습니다. ‘여러분’으로 통일하고, ‘대머리 자리’를 ‘머리카락을 밀어 대머리 자국’으로 풀어 자연스럽고 구체적인 표현으로 다듬었습니다.
  terminology: יהוה는 프로젝트 선택을 따라 ‘야훼’로 유지했습니다. בָּנִים의 남성 복수 표지를 보존하여 ‘아들들’로 유지했습니다. תִתְגֹּדְדוּ는 애도 의례의 자기 상해를 가리키므로 ‘몸에 상처를 내다’가 적절합니다.
