revisions:
- from: 당신들은 야훼 곧 당신들의 하나님께 속한 아들들입니다. 죽은 사람을 위하여 몸을 상처 내지 말고, 당신들의 눈 사이에 대머리 자리를 만들지 마십시오.[a][b]
  to: 여러분은 야훼, 여러분의 하나님의 아들들입니다[a]. 죽은 이를 위하여 몸에 상처를 내지 말고, 눈 사이[b]에 머리카락을 밀어 대머리 자국을 내지 마십시오.
  rationale: 원문의 어순과 의미 관계를 더 선명하게 하되, ‘아들들’, ‘야훼’, ‘눈 사이’라는 원문 중심의 선택은 유지했습니다. ‘머리카락을 밀어 대머리 자국을 내다’는 קָרְחָה의 의도적인 삭발 행위를 자연스러운 현대 한국어로 전달합니다.
