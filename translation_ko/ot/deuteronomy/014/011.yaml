  alternatives_korean:
  - 모든
  - 각각의
  - 아무
  lexicon: HALOT
  rationale: 히브리어 כָּל의 포괄성을 한국어에서 자연스럽게 살리기 위해, 허용 범주 안에서 제한 없는 의미를 나타내는 ‘무엇이든’을 택했습니다.
- source_word: צִפּוֹר
  english_pob_choice: bird
  chosen_korean: 새
  alternatives_korean:
  - 새들
  - 조류
  - 날짐승
  lexicon: HALOT
  rationale: 의례·식규정 문맥에서 צִפּוֹר는 일반적인 ‘새’를 뜻하므로, 일상적이면서도 정확한 ‘새’로 옮겼습니다.
- source_word: טְהֹרָה
  english_pob_choice: clean
  chosen_korean: 깨끗한
  alternatives_korean:
  - 정결한
  - 순결한
  lexicon: HALOT
  rationale: 음식 규정의 분류 용어로는 ‘정결한’이 가능하지만, 현대 한국어에서 의미가 덜 직접적일 수 있어 허용된 식용 범주를 드러내는 ‘깨끗한’을 사용했습니다.
- source_word: תֹּאכֵלוּ
  english_pob_choice: you may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹어도 됩니다
  - 먹으십시오
  - 먹습니다
  lexicon: HALOT
  rationale: 여기서는 명령이라기보다 허용을 나타내므로, 법규의 허가 의미를 자연스럽게 전달하는 ‘먹을 수 있습니다’로 옮겼습니다.
