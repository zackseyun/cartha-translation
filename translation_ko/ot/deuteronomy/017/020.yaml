  source_fidelity: 초안은 핵심 어휘와 목적 구문을 대체로 충실히 반영합니다. 그러나 히브리어의 목적절을 독자에게 직접 명령하는 ‘하십시오’로 옮겨, 앞 절의 왕이 율법을 기록하고 읽는 행위에 딸린 목적이라는 문법적 관계가 바뀌었습니다. 또한 ‘날을 오래 누리게’는 한국어에서 부자연스럽고, 왕과 아들들의 왕조적 통치 지속이라는 문맥을 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘명령에서 오른쪽으로나 왼쪽으로나 벗어나다’는 이해 가능하나, 정관사와 성경적 용례를 고려한 ‘그 계명에서 오른쪽으로도 왼쪽으로도 벗어나다’가 더 자연스럽습니다. 목적절 전체를 서술형으로 연결하면 현대 한국어 합쇼체 문장으로도 매끄럽습니다.
  terminology: ‘마음이 높아지다’, ‘형제들’, ‘오른쪽/왼쪽’, ‘아들들’, ‘이스라엘 가운데서’는 원문의 관용어와 범위를 잘 보존합니다. מִצְוָה에는 성경 문체상 ‘계명’을 사용하고, מַמְלַכְתּוֹ와 ‘날을 길게 하다’의 결합은 ‘오래도록 왕으로 다스리다’로 관용적으로 옮기되 왕조 지속의 문맥을 유지했습니다.
