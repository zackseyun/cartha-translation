base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
  footnotes:
  - marker: a
    text: Or 'above his fellow Israelites.' The Hebrew reads 'above his brothers,' using covenant kinship language.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그의 마음이 형제들[a]보다 높아지지 않고, 그가 그 계명에서 오른쪽으로도 왼쪽으로도 벗어나지 않게 하며, 그와 그의 아들들이 이스라엘 가운데서 오래도록 왕으로 다스리게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동료 이스라엘 사람들보다’입니다. 히브리어는 언약적 친족 언어로 ‘형제들보다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי / לְמַעַן
  english_pob_choice: so that ... not / in order that
  chosen_korean: 지 않게 하고 / 그리하여 ... 하려는 것입니다
  alternatives_korean:
  - ~하지 않도록
  - ~하지 않게 하여
  lexicon: HALOT
  rationale: 예방 목적의 לְבִלְתִּי와 최종 목적의 לְמַעַן을 한국어로 자연스럽게 분리해, 경고와 목적 관계가 분명히 드러나도록 했습니다.
- source_word: רוּם לְבָבוֹ
  english_pob_choice: be lifted up / his heart
  chosen_korean: 그의 마음이 ... 높아지지
  alternatives_korean:
  - 마음이 들뜨지
  - 마음이 교만해지지
  lexicon: HALOT
  rationale: ‘마음’과 ‘높아지다’의 히브리어 관용구를 살려, 교만의 함의를 유지하면서도 과도한 해석어를 덧붙이지 않았습니다.
- source_word: מֵאֶחָיו
  english_pob_choice: above his brothers
  chosen_korean: 형제들보다
  alternatives_korean:
  - 동료 이스라엘 사람들보다
  - 형제들 위로
  lexicon: HALOT
  rationale: 본문의 친족-언약 언어를 그대로 살려 ‘형제들’을 유지했고, 비교 의미는 조사 ‘보다’로 분명히 했습니다.
- source_word: סוּר מִן הַמִּצְוָה יָמִין וּשְׂמֹאול
  english_pob_choice: turn aside from the commandment to the right or to the left
  chosen_korean: 명령에서 오른쪽으로나 왼쪽으로나 벗어나지
  alternatives_korean:
  - 명령을 좌우로 치우치지
  - 명령에서 좌로나 우로나 벗어나지
  lexicon: HALOT
  rationale: 히브리어의 ‘오른쪽/왼쪽’ 관용구를 직역하되 한국어 어순에 맞게 정리하여, 규범에서 이탈하지 말라는 의미를 선명하게 보존했습니다.
- source_word: מַמְלַכְתּוֹ
  english_pob_choice: in his kingdom
  chosen_korean: 그의 왕국에서
  alternatives_korean:
  - 그의 통치 아래서
  - 그의 나라에서
  lexicon: HALOT
  rationale: מצב의 지속을 뜻하는 문맥에서 ‘왕국’은 왕적 통치의 영역을 직접 드러내며, 영어 POB의 ‘kingdom’과도 대응됩니다.
theological_decisions:
- issue: 형제들(מֵאֶחָיו)의 범위
  chosen_reading: 형제들
  alternative_readings:
  - 동료 이스라엘 사람들
  - 친족
  rationale: 본문은 언약 공동체 내부의 동족 의식을 드러내는 표현으로 ‘형제들’을 사용합니다. 범위 확장은 주석에서 설명할 수 있으나 본문은 원형을 유지하는 편이 더 소스-충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 왕국에서 날을 오래 누리게 하려는 목적 구조
  chosen_reading: 그리하여 ... 하려는 것입니다
  alternative_readings:
  - 그래야 ... 오래 살게 됩니다
  - 그 결과 ... 오래 다스리게 됩니다
  rationale: 히브리어는 순종의 결과를 왕과 그의 아들들의 장수 및 왕조 지속과 연결합니다. 이를 완곡하게 바꾸기보다 목적/결과 구조를 명시해 신학적 인과를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
