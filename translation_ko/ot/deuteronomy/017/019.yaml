base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
  footnotes:
  - marker: a
    text: Or 'read from it.' The Hebrew says literally 'read in it.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to revere the LORD his God.'
    reason: lexical_alternative
  - marker: c
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그것은 그와 함께 있어야 하며, 그는 평생 동안 그것을 읽어야 합니다. 이는 그가 야훼 그의 하나님을 두려워하는 법을 배우고, 이 율법의 모든 말씀과 이 규례들을 지켜 행하게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것을 읽어야 합니다’는 히브리어의 문자적 ‘그 안에서 읽다’를 한국어로 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워하는’은 단순한 공포가 아니라 언약적 경외와 순종을 포함합니다.
    reason: theological_note
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  english_pob_choice: And it shall be with him
  chosen_korean: 그것은 그와 함께 있어야 하며
  alternatives_korean:
  - 그것은 그와 함께 있어야 합니다
  - 그것은 그 곁에 있어야 합니다
  lexicon: HALOT
  rationale: 왕의 곁에 두어야 하는 율법서의 지속적 소지를 나타내므로, ‘함께 있어야’로 자연스럽고 직역에 가깝게 옮겼습니다.
- source_word: וְקָרָא בוֹ
  english_pob_choice: and he shall read in it
  chosen_korean: 그는 … 그것을 읽어야 합니다
  alternatives_korean:
  - 그는 그것 안에서 읽어야 합니다
  - 그는 그것에서 읽어야 합니다
  lexicon: HALOT
  rationale: 히브리어 전치사 בּוֹ의 ‘안에서/그 안에서’라는 감각은 유지하되, 한국어에서는 ‘그것을 읽다’가 가장 자연스러워 본문 본의가 흐려지지 않는 범위에서 매끄럽게 처리했습니다.
- source_word: יְהוָה אֱלֹהָיו
  english_pob_choice: Yahweh his God
  chosen_korean: 야훼 그의 하나님
  alternatives_korean:
  - 야훼 그의 하나님
  - 주 그의 하나님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기의 언약명 יְהוָה는 ‘야훼’로 옮기고, 소유격 관계는 간결하게 유지했습니다.
- source_word: לִשְׁמֹר אֶת כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת וְאֶת הַחֻקִּים הָאֵלֶּה
  english_pob_choice: to keep all the words of this law and these statutes
  chosen_korean: 이 율법의 모든 말씀과 이 규례들을 지켜 행하게 하려는 것입니다
  alternatives_korean:
  - 이 율법의 모든 말씀과 이 규례들을 지키게 하려는 것입니다
  - 이 율법의 모든 말씀과 이 규례들을 지켜 지키게 하려는 것입니다
  lexicon: HALOT
  rationale: דִּבְרֵי הַתּוֹרָה는 ‘율법의 말씀들’로, חֻקִּים는 법적 조항성을 살려 ‘규례들’로 옮겼습니다. לַעֲשֹׂתָם의 ‘행하다/실행하다’는 관용을 한국어 성경체에 맞게 ‘지켜 행하다’로 구현했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 이름 יְהוָה는 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 여호와의 이름을 직접 사용하므로, 프로젝트 기준에 따라 언약명 자체를 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יִרְאָה의 번역
  chosen_reading: ‘두려워하는’으로 옮겼습니다.
  alternative_readings:
  - 경외하는
  - 존경하는
  rationale: 언약 문맥에서 ירא는 경외와 순종을 포함하지만, 본문은 율법 낭독이 여호와를 향한 경외적 복종으로 이어짐을 말하므로 ‘두려워하다’가 긴장을 가장 직접적으로 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
