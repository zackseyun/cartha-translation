  source_fidelity: 현 초안은 מִלִּפְנֵי הַכֹּהֲנִים הַלְוִיִּם를 별도 문장으로 풀어 ‘본을 따라야 합니다’라는 명시적 의무로 바꾸었습니다. 이는 히브리어의 ‘…에게서/…앞으로부터’라는 수식 관계를 과도하게 해석하고, 기록 행위에 직접 연결된 원문의 구조를 분리합니다. 이를 본문 한 문장 안에서 ‘레위 사람 제사장들 앞에서’로 옮기고 각주로 가능한 모본 의미를 설명하는 편이 원문과 영어 POB의 처리에 충실합니다.
  naturalness: ‘자기 왕국의 왕좌’보다 ‘그의 왕국의 왕좌’가 현대 표준어 문어체에서 자연스럽습니다. 또한 원문의 필사 명령과 그 출처·위치 수식을 한 문장으로 유지하면 문맥과 문장 흐름이 더 명료합니다.
  terminology: ‘율법’, ‘사본’, ‘레위 사람 제사장들’은 이 문맥에 적절합니다. 다만 ‘레위 사람 제사장들’은 히브리어의 관용적 번역이므로, 각주에는 직역형 ‘제사장들, 곧 레위 사람들’을 제시해야 합니다.
