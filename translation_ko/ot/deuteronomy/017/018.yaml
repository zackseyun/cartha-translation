revisions:
- from: 그가 자기 왕국의 왕좌에 앉을 때에는, 이 율법의 사본을 책에 기록해야 합니다. 그것은 레위 사람 제사장들 앞에 있는 본을 따라야 합니다.[a][b]
  to: 그가 그의 왕국의 왕좌에 앉을 때에, 그는 레위 사람 제사장들[b] 앞에서[a] 이 율법의 사본을 책에 기록해야 합니다.
  rationale: 원문의 시간절, 필사 명령, 그리고 제사장들과 관련된 출처·위치 표현을 하나의 문장으로 복원했습니다. מִלִּפְנֵי의 정확한 기능에 대한 해석적 확장은 각주로 옮겨, 가능한 ‘권위 있는 모본’ 의미를 알리면서도 본문에서 단정하지 않았습니다. 각주 표지도 각각 해당 어구 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:06Z'
