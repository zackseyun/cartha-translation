id: DEU.17.18
reference: Deuteronomy 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'from the copy kept before the Levitical priests,' indicating an authorized exemplar in priestly custody.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the priests, the Levites'; traditionally rendered 'the Levitical priests.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 왕국의 왕좌에 앉을 때에, 그는 레위 사람 제사장들[b] 앞에서[a] 이 율법의 사본을 책에 기록해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘레위 사람 제사장들 앞에서’라고 합니다. 이는 제사장들 앞에 있거나 그들이 보관하는 권위 있는 본에서 사본을 만들라는 뜻일 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어를 직역하면 ‘제사장들, 곧 레위 사람들’입니다. 전통적으로 ‘레위 사람 제사장들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  english_pob_choice: And when he sits
  chosen_korean: 그가 …에 앉을 때에는
  alternatives_korean:
  - 그가 …에 앉으면
  - 그가 …에 앉게 되면
  lexicon: HALOT
  rationale: 히브리어의 시간적 조건절을 한국어 법률문체로 자연스럽게 옮기기 위해 ‘~할 때에는’으로 처리했습니다.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  english_pob_choice: on the throne of his kingdom
  chosen_korean: 자기 왕국의 왕좌
  alternatives_korean:
  - 그의 왕국의 왕좌
  - 왕국의 왕좌
  lexicon: HALOT
  rationale: כִּסֵּא의 구체적 왕권 이미지를 살려 ‘왕좌’로 옮기고, 소유격은 자연스러운 한국어로 정리했습니다.
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  english_pob_choice: a copy of this law
  chosen_korean: 이 율법의 사본
  alternatives_korean:
  - 이 율법의 복사본
  - 이 율법의 한 부본
  lexicon: HALOT
  rationale: מִשְׁנֵה는 ‘반복’이 아니라 ‘사본/복본’의 뜻이므로, 법적 문맥에 맞는 ‘사본’을 선택했습니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in a book
  chosen_korean: 책에
  alternatives_korean:
  - 두루마리에
  - 문서에
  lexicon: HALOT
  rationale: 히브리어 סֵפֶר는 문맥상 필사된 기록 매체를 가리키지만, 한국어 본문에서는 간결하게 ‘책에’로 옮겨 일반 독자가 이해하기 쉽게 했습니다.
- source_word: מִלִּפְנֵי הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: from before the Levitical priests
  chosen_korean: 레위 사람 제사장들 앞에 있는 본
  alternatives_korean:
  - 레위 사람 제사장들 앞에서
  - 레위 사람 제사장들 앞에 보관된 본
  lexicon: HALOT
  rationale: Pob의 감사주석처럼 כאן은 단순한 공간이 아니라 공인된 원본/모본의 위치를 뜻할 수 있으므로, ‘본’으로 그 의미를 드러냈습니다.
theological_decisions:
- issue: 율법의 범위를 한국어로 어떻게 표시할지
  chosen_reading: ‘율법’으로 옮겼습니다.
  alternative_readings:
  - ‘교훈’으로 옮김
  - ‘토라’로 음역
  rationale: 이 문맥은 왕이 필사해야 할 규범적 법문을 말하므로, 즉각적인 법적 의미를 살리는 ‘율법’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 제사장들 앞에 있는 기준 본의 의미
  chosen_reading: 본문에는 ‘앞에 있는 본’으로 두고, 원본/모본의 가능성을 드러냈습니다.
  alternative_readings:
  - ‘제사장들 앞에서’
  - ‘제사장들이 보관한 사본에서’
  rationale: 히브리어는 공인된 모본의 위치를 암시하지만 그 구체적 관리 형태를 단정하지 않으므로, 본문은 직역에 가깝게 유지하고 의미를 최소한으로만 밝혔습니다.
  doctrine_reference: Translation philosophy §3, §5
