revisions:
- from: 그리고 그는 자신을 위해 아내를 많이 두어서는 안 됩니다[a], 그리하여 그의 마음이 돌아서지 않게 해야 합니다. 또한 그는 자신을 위해 은과 금도 크게 많이 두어서는 안 됩니다.
  to: 그는 자신의 마음이 돌아서지 않도록 자신을 위하여 아내를 많이 두어서는 안 됩니다[a]. 또한 자신을 위하여 은과 금을 지나치게 많이 쌓아 두어서도 안 됩니다.
  rationale: 중간 절을 첫 금지에 자연스럽게 연결하여 ‘lest’의 경고적 기능을 보존하고, 병렬 금지라는 가능한 독법은 각주에서 명시했습니다. 재물에 대해서는 ‘쌓아 두다’를 사용하여 자연스러운 한국어를 이루면서도 ‘지나치게 많이’로 מְאֹד의 과도함과 반복되는 축적 금지를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:57Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 번째와 세 번째 금지, 그리고 ‘은과 금’의 구체적 병렬은 대체로 충실합니다. 그러나 중간 절을 ‘그리하여 … 해야 합니다’로 옮기면 히브리어의 경계/결과 뉘앙스가 별도의 의무 명령으로 바뀌고, ‘그리하여’는 원문에 없는 인과를 다소 확정적으로 부가합니다.
  naturalness: ‘크게 많이 두다’는 현대 한국어에서 어색하며, 은과 금에는 ‘지나치게 많이 쌓아 두다’가 자연스럽습니다. 중간 절은 ‘돌아서지 않도록’으로 첫 금지에 연결하는 편이 간결하고 자연스럽습니다.
  terminology: ‘아내’, ‘마음’, ‘은과 금’은 적절합니다. ‘많이 두다’는 아내에 관해서는 자연스럽고, 재물에는 ‘쌓아 두다’를 사용하되 ‘많이/지나치게’로 과도한 축적이라는 의미를 보존할 수 있습니다.
