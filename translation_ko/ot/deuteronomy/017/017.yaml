base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
  footnotes:
  - marker: a
    text: Or, 'and his heart shall not turn away.' The Hebrew may be read as a coordinate prohibition rather than an explicit purpose/result clause.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자신의 마음이 돌아서지 않도록 자신을 위하여 아내를 많이 두어서는 안 됩니다[a]. 또한 자신을 위하여 은과 금을 지나치게 많이 쌓아 두어서도 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그의 마음도 돌아서서는 안 됩니다.’ 히브리어는 이 절을 앞선 금지의 목적 또는 결과로, 혹은 병렬된 별도의 금지로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  english_pob_choice: multiply
  chosen_korean: 많이 두어서는 안 됩니다 / 크게 많이 두어서는 안 됩니다
  alternatives_korean:
  - 늘려서는 안 됩니다
  - 많이 취해서는 안 됩니다
  lexicon: HALOT
  rationale: 히필형 רבה가 단순한 소유가 아니라 과도한 증식을 뜻하므로, 첫째는 아내에 대해, 둘째는 은과 금에 대해 반복되는 금지의 구조를 살려 번역했습니다.
- source_word: נָשִׁים
  english_pob_choice: wives
  chosen_korean: 아내
  alternatives_korean:
  - 여자들
  - 부인들
  lexicon: HALOT
  rationale: 왕에 대한 규례 문맥에서 일반적인 ‘여자들’이 아니라 혼인 관계의 상대를 가리키므로, 표준적이고 현대적인 ‘아내’로 옮겼습니다.
- source_word: יָסוּר לְבָבוֹ
  english_pob_choice: lest his heart turn away
  chosen_korean: 그의 마음이 돌아서지 않게 해야 합니다
  alternatives_korean:
  - 그의 마음이 돌아서지 않도록
  - 그의 마음이 떠나지 않게 해야 합니다
  lexicon: HALOT
  rationale: סור의 ‘돌아서다/벗어나다’ 이미지를 살리면서, 히브리어의 경고 문구를 한국어의 목적·경계 표현으로 자연스럽게 옮겼습니다.
- source_word: כֶסֶף וְזָהָב
  english_pob_choice: silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 돈과 금
  - 은화와 금
  lexicon: HALOT
  rationale: 구체적 병렬 표현을 그대로 살려, ‘돈’처럼 추상화하지 않고 왕의 재물 축적 금지를 분명히 드러냈습니다.
theological_decisions:
- issue: 중간 절의 관계를 결과/목적절로 볼지, 병렬 금지로 볼지
  chosen_reading: ‘그리하여 그의 마음이 돌아서지 않게 해야 합니다’로 옮겨, 첫 번째 금지의 경고적 이유를 드러냈습니다.
  alternative_readings:
  - ‘그리고 그의 마음이 돌아서지 않게 해야 합니다’처럼 별도의 병렬 금지로 읽기
  rationale: 히브리어 문장은 두 가지로 읽힐 수 있지만, 문맥상 아내의 다수를 금하는 이유를 제시하는 경고로 읽는 것이 가장 자연스럽습니다. 다만 원문의 긴장을 지우지 않기 위해 원인-결과의 단정적 해설은 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
