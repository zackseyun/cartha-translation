  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
  footnotes:
  - marker: a
    text: Hebrew 'acts in presumptuousness'; also 'acts arrogantly' or 'acts willfully.' The phrase denotes deliberate, defiant refusal rather than accidental failure.
    reason: lexical_alternative
  - marker: b
    text: Or 'by not obeying.' Hebrew 'not listening' often carries the sense of refusing to heed or obey in legal contexts.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively transliterated ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그곳에서 당신의 하나님 야훼[c]를 섬기려고 서 있는 제사장이나 재판관의 말을 듣기를 거부하고[b] 방자하게 행동하는[a] 그 사람은 죽어야 합니다. 당신은 이스라엘에서 악을 제거하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘방자하게 행하다’, 또는 ‘교만하게/고의적으로 행하다’에 해당하는 표현입니다. 이는 단순한 실수나 무지와 달리 의도적이고 도전적인 불복종을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣지 않다’는 법적 문맥에서 권위 있는 판단을 듣고 따르기를 거부하다, 곧 순종하지 않다는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 신명 יהוה는 여기서 ‘야훼’로 음역했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  english_pob_choice: But the man
  chosen_korean: 그러나 그 사람
  alternatives_korean:
  - 그리고 그 사람
  - 이제 그 사람
  lexicon: HALOT
  rationale: 문맥상 앞선 법 규정에 대한 위반 결과를 이어 받으므로 ‘그러나’가 적절하며, אִישׁ의 단수 남성 성격을 유지해 ‘그 사람’으로 옮겼습니다.
- source_word: יַעֲשֶׂה בְזָדוֹן
  english_pob_choice: acts presumptuously
  chosen_korean: 고의로 행하는
  alternatives_korean:
  - 오만하게 행하는
  - 무례하게 행하는
  - 방자하게 행하는
  lexicon: HALOT
  rationale: בְזָדוֹן은 단순 실수가 아니라 의도적이고 도전적인 행위를 가리키므로, 법문체에서 자연스러우면서도 그 의도를 드러내는 ‘고의로 행하는’으로 옮겼습니다.
- source_word: לְבִלְתִּי שְׁמֹעַ
  english_pob_choice: by not listening
  chosen_korean: 말을 듣지 않고
  alternatives_korean:
  - 듣지 않으려고
  - 순종하지 않고
  - 귀 기울이지 않고
  lexicon: HALOT
  rationale: 히브리어 שׁמע는 문맥상 단순 청취보다 권위를 ‘듣고 따름’을 포함하므로, 한국어에서도 자연스럽게 ‘말을 듣지 않고’로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명 יְהוָה는 관용적 대체어가 아니라 고유한 신적 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  english_pob_choice: who stands there to minister
  chosen_korean: 그곳에서 섬기도록 서 있는
  alternatives_korean:
  - 그곳에 서서 섬기는
  - 그곳에서 봉사하도록 서 있는
  lexicon: HALOT
  rationale: 성소적 봉사를 나타내는 שׁרת는 일반적 ‘봉사’보다 ‘섬기다’가 더 직접적이며, 장소 부사 ‘שם’은 ‘그곳에서’로 살렸습니다.
- source_word: וּבִעַרְתָּ הָרָע
  english_pob_choice: So you shall purge the evil
  chosen_korean: 악을 제거하십시오
  alternatives_korean:
  - 악을 없애십시오
  - 악을 제거해야 합니다
  - 악을 소멸하십시오
  lexicon: HALOT
  rationale: Deuteronomy의 법정 공식에서 בער는 공동체에서 악을 제거하는 뜻이므로, 한국어에서는 공적 명령형으로 ‘악을 제거하십시오’가 가장 정확합니다.
theological_decisions:
- issue: YHWH의 표기와 직접성
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 언약적 고유명 יְהוָה를 사용하므로, 호칭적 대체어보다 이름 자체를 드러내는 ‘야훼’가 स्रोत의 직접성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 법문체의 처벌 진술
  chosen_reading: 죽어야 합니다
  alternative_readings:
  - 반드시 죽습니다
  - 죽을 것입니다
  rationale: 히브리어 משפט 문맥의 결과 규정은 의무적 사형 판결을 뜻하므로, 현대 합쇼체에서도 법적 강제를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
