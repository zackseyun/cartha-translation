review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 관계절 ‘이 악한 일을 한’(אֲשֶׁר עָשׂוּ אֶת־הַדָּבָר הָרָע הַזֶּה)을 누락했으며, 마지막 결과절 ‘그들이 죽을 것이다/죽게 된다’(וָמֵתוּ)를 단순한 의무 표현으로 흡수했습니다. 또한 ‘끌어내다’는 가능하나 ‘데리고 나가다’가 원문의 중립적인 ‘bring out’를 더 자연스럽게 반영합니다.
  naturalness: ‘너는 … 해야 합니다’는 현대의 정중한 법률적 문체에서 자연스럽습니다. ‘네 성문으로’는 히브리어 복수형을 한국어의 집합적 단수로 자연스럽게 옮긴 것이며, 문화 주석으로 보완할 수 있습니다.
  terminology: ‘성문’, ‘그 남자나 그 여자’, ‘돌로 쳐서 죽게 하다’는 법적·서사적 문맥과 원문의 성별 구분 및 처형 방식을 적절히 반영합니다. 기존 b 주석은 본문에 이미 명시된 ‘돌’을 단지 재진술하므로, הַדָּבָר의 ‘일/사안’이라는 어휘 대안을 설명하도록 교체해야 합니다.
  issues:
  - severity: high
    issue: ‘이 악한 일을 한’이라는 관계절이 누락되었습니다.
    rationale: 히브리어는 처벌 대상자를 ‘이 악한 일을 한’ 남자 또는 여자로 한정합니다. 이 절을 빼면 대상 식별과 범죄 행위의 명시가 사라집니다.
  - severity: medium
    issue: 마지막 결과절이 충분히 드러나지 않습니다.
    rationale: וָמֵתוּ는 돌로 치는 행위의 결과로 그들이 죽는다는 절입니다. ‘죽게 해야 합니다’로 옮기면 법적 지시의 문체를 유지하면서 결과를 명시할 수 있습니다.
  - severity: low
    issue: 각주 b가 영어 감사 기록의 어휘 대안과 일치하지 않습니다.
    rationale: 영어 각주 b는 דָּבָר의 ‘thing/matter’ 대안을 설명합니다. 한국어 각주도 ‘일/사안’의 의미 범위를 설명하는 편이 본문 앵커와 더 적절합니다.
  revised_text: 그러면 너는 이 악한 일[b]을 한 그 남자나 그 여자를 네 성문으로[a] 데리고 나가서, 그 남자나 그 여자를 돌로 쳐서 죽게 해야 합니다.
  revised_footnotes:
  - marker: a
    text: ‘성문’은 고대 이스라엘에서 공적 재판과 법적 절차가 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 ‘다바르’는 이 법적 문맥에서 ‘일’ 또는 ‘사안’을 뜻할 수 있습니다.
    reason: lexical_alternative
