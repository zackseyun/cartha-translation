revisions:
- from: 그러면 너는 그 남자나 그 여자를 네 성문으로 끌어내고, 그 남자나 그 여자에게 돌을 던져 돌로 쳐 죽여야 합니다.[a][b]
  to: 그러면 너는 이 악한 일[b]을 한 그 남자나 그 여자를 네 성문으로[a] 데리고 나가서, 그 남자나 그 여자를 돌로 쳐서 죽게 해야 합니다.
  rationale: 누락된 관계절을 복원하고, 돌로 치는 행위 뒤의 죽음이라는 결과를 명시했습니다. ‘성문’의 문화적 의미는 본문에 풀어 넣지 않고 각주에 유지했으며, b 각주는 해당 히브리어 어휘의 법적 문맥상 대안을 설명하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
