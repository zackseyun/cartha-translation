reference: Deuteronomy 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֽוֹצֵאתָ֣ אֶת הָ/אִ֣ישׁ הַ/ה֡וּא אוֹ֩ אֶת הָ/אִשָּׁ֨ה הַ/הִ֜וא אֲשֶׁ֣ר עָ֠שׂוּ אֶת הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֶל שְׁעָרֶ֔י/ךָ אֶת הָ/אִ֕ישׁ א֖וֹ אֶת הָ/אִשָּׁ֑ה וּ/סְקַלְתָּ֥/ם בָּ/אֲבָנִ֖ים וָ/מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
  footnotes:
  - marker: a
    text: '"Your gates" refers to the town gates, the customary public place of judgment and legal proceedings in ancient Israel.'
    reason: cultural_note
  - marker: b
    text: Or "this evil matter." The Hebrew word can mean "thing" or "matter" in a legal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너는 이 악한 일[b]을 한 그 남자나 그 여자를 네 성문으로[a] 데리고 나가서, 그 남자나 그 여자를 돌로 쳐서 죽게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 고대 이스라엘에서 공적 재판과 법적 절차가 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 ‘다바르’는 이 법적 문맥에서 ‘일’ 또는 ‘사안’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  english_pob_choice: then you shall bring out
  chosen_korean: 그러면 너는 … 끌어내고
  alternatives_korean:
  - 그리고 너는 … 끌어내고
  - 그때 너는 … 끌어내고
  lexicon: HALOT
  rationale: 법적 절차의 순차성을 살려 ‘그러면’으로 연결했고, 동사는 한국어에서 자연스러운 처벌 집행 표현인 ‘끌어내다’로 옮겼습니다.
- source_word: הָאִישׁ … הָאִשָּׁה
  english_pob_choice: that man or that woman
  chosen_korean: 그 남자나 그 여자
  alternatives_korean:
  - 그 사람이나 그 여자
  - 그 남자나 그 여인
  lexicon: HALOT
  rationale: 히브리어의 성별 대조를 그대로 살려 남자/여자를 유지했으며, 반복된 지시성을 ‘그’로 반영했습니다.
- source_word: שְׁעָרֶיךָ
  english_pob_choice: to your gates
  chosen_korean: 네 성문으로
  alternatives_korean:
  - 네 문으로
  - 네 성문들로
  lexicon: HALOT
  rationale: 문맥상 재판과 처형이 이루어지는 공동체의 성문을 가리키므로, 축약하지 않고 ‘성문’으로 옮겼습니다.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  english_pob_choice: and you shall stone them with stones
  chosen_korean: 돌을 던져 돌로 쳐 죽여야 합니다
  alternatives_korean:
  - 돌로 쳐야 합니다
  - 돌을 던져야 합니다
  lexicon: HALOT
  rationale: 히브리어의 ‘돌들로’라는 구체적 수단을 살리면서, 한국어에서 자연스럽고 명확한 형벌 표현으로 옮겼습니다.
theological_decisions:
- issue: 성별을 구분한 법적 표현
  chosen_reading: 그 남자나 그 여자
  alternative_readings:
  - 그 사람
  rationale: 본문은 남녀를 각각 명시하므로, 성중립화하지 않고 원문의 법적 책임 대상을 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 성문을 공적 재판 장소로 암시하는 방식
  chosen_reading: 네 성문으로
  alternative_readings:
  - 네 문으로
  - 네 성읍으로
  rationale: ‘성문’은 이스라엘 공동체의 공적 심판 장소라는 문화적 기능을 보존하면서도, 본문 자체의 구체성을 유지합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
