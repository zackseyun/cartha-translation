  text: 그들이 당신에게 가르쳐 주는 가르침[a]에 따라, 또 그들이 당신에게 말해 주는 판결에 따라 행하십시오. 그들이 당신에게 일러 주는 말[b]에서 오른쪽으로나 왼쪽으로나 벗어나지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’ 또는 ‘가르침’으로 옮길 수 있습니다. 히브리어 토라의 기본 의미는 가르침 또는 지시입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사안’ 또는 ‘판정’으로 옮길 수 있습니다. 여기서 ‘말’은 선포된 법적 판단을 가리킵니다.
    reason: lexical_alternative
