translation:
  language: ko
  text: 그들이 너희에게 가르치는 율법에 따라, 그리고 그들이 너희에게 말하는 판결에 따라 너희는 행해야 합니다. 그들이 너희에게 일러 주는 말에서 오른쪽으로도, 왼쪽으로도, 벗어나서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침’ ‘교훈’으로도 옮길 수 있습니다. 히브리어 torah의 기본 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘말씀’ ‘사건’ ‘판정’으로도 옮길 수 있습니다. 여기서의 ‘말’은 선포된 법적 판단을 가리킵니다.
    reason: lexical_alternative
