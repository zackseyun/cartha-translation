revisions:
- from: 당신 위에 왕을 반드시 세워야 합니다. 곧 야훼 당신의 하나님께서 택하시는 자여야 합니다. 당신의 형제들 가운데에서 당신 위에 왕을 세워야 하며, 당신의 형제가 아닌 이방 사람을 당신 위에 둘 수 없습니다.[a][b]
  to: 너희의 하나님 야훼께서 택하시는 왕을 너희 위에 반드시 세우십시오. 너희 형제들[a] 가운데에서 너희 위에 왕을 세우십시오. 너희 형제가 아닌 이방인[b], 곧 너희 형제가 아닌 자를 너희 위에 왕으로 세울 수 없습니다.
  rationale: 본문의 강조된 명령(‘반드시’), 야훼의 선택, ‘형제들 가운데’라는 자격 요건, 그리고 이방인을 ‘너희 형제가 아닌 자’로 풀이하는 관계절을 모두 유지했습니다. 대표적 단수인 히브리어 수신자는 현대 한국어의 공동체 법규 문맥에서 자연스러운 ‘너희’로 옮겼으며, 합쇼체 명령형을 일관되게 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:24Z'
