  verdict: revise
  source_fidelity: 초안은 왕을 세우라는 강조 명령, 야훼의 선택, 공동체 내부의 자격, 이방인 금지를 대체로 반영합니다. 그러나 ‘당신 위에’와 ‘야훼 당신의 하나님’은 히브리어의 대표적 단수 خطاب을 한국어에서 부자연스럽게 처리했습니다. 또한 마지막의 ‘곧 당신의 형제가 아닌 자’라는 설명절을 본문에서 생략하여, 이를 명시적으로 복원할 필요가 있습니다.
  naturalness: 현대 표준어 합쇼체에서 공동체를 향한 법규적 호소에는 ‘너희’가 ‘당신’보다 자연스럽고 오해가 적습니다. ‘너희의 하나님 야훼’ 및 ‘너희 위에 왕을 세우십시오’는 명료하고 자연스럽습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. אַחֶיךָ는 ‘형제들’로 유지하되, 이스라엘 공동체 구성원을 가리키는 문맥적 의미를 주석으로 설명합니다. אִישׁ נָכְרִי는 한국어 성경 문맥에 자연스러운 ‘이방인’으로 옮기고, 뒤의 ‘너희 형제가 아닌 자’를 본문에 남겨 언약 공동체 밖의 사람이라는 한정을 보존합니다.
