reference: Deuteronomy 17:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
  footnotes:
  - marker: a
    text: Hebrew 'from among your brothers' uses kinship language for a fellow member of Israel; that is, one from among your own people.
    reason: lexical_alternative
  - marker: b
    text: Or 'a foreigner' for 'a foreign man.' The Hebrew is literally 'a foreign man, one who is not your brother.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희의 하나님 야훼께서 택하시는 왕을 너희 위에 반드시 세우십시오. 너희 형제들[a] 가운데에서 너희 위에 왕을 세우십시오. 너희 형제가 아닌 이방인[b], 곧 너희 형제가 아닌 자를 너희 위에 왕으로 세울 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 혈연만이 아니라 이스라엘 공동체의 동료 구성원을 가리키는 친족 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘이방인 남자, 곧 네 형제가 아닌 자’입니다. 뒤의 표현은 이방인이 언약 공동체의 구성원이 아님을 설명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  english_pob_choice: You shall surely set
  chosen_korean: 반드시 세워야 합니다
  alternatives_korean:
  - 반드시 두어야 합니다
  - 정녕 세워야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 한국어 법문체에서 자연스럽게 살리기 위해 의무·강조를 함께 드러냈습니다.
- source_word: עָלֶיךָ
  english_pob_choice: over yourself
  chosen_korean: 당신 위에
  alternatives_korean:
  - 스스로 위에
  - 자기 위에
  lexicon: HALOT
  rationale: 반복되는 2인칭 단수의 반사적 의미를 살리되, 한국어 법률 문맥에서 가장 직접적인 표현으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 신명기의 언약명 יְהוָה를 프로젝트 기본값에 따라 야훼로 옮겨 고유성을 보존했습니다.
- source_word: מִקֶּרֶב אַחֶיךָ
  english_pob_choice: From among your brothers
  chosen_korean: 당신의 형제들 가운데에서
  alternatives_korean:
  - 당신의 형제들 중에서
  - 당신의 동족 가운데에서
  lexicon: HALOT
  rationale: 혈연어를 그대로 유지해 언약 공동체 내부의 자격 조건을 드러내면서도, 한국어로 자연스럽게 다듬었습니다.
- source_word: אִישׁ נָכְרִי
  english_pob_choice: a foreign man
  chosen_korean: 이방 사람
  alternatives_korean:
  - 낯선 사람
  - 외국인
  lexicon: HALOT
  rationale: 문맥상 왕직에 대한 배제 조항이므로, 남성성을 과도하게 부각하기보다 ‘이방 사람’으로 옮겨 자연스러움과 배제 의미를 함께 살렸습니다.
theological_decisions:
- issue: 야훼의 고유명 유지
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’로 표기
  - ‘주’로 대체
  rationale: 본문은 단순 호칭이 아니라 이스라엘에 계시된 언약의 이름을 사용하므로, 제목어 대체보다 고유명 보존이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אַחֶיךָ의 대표적 남성 복수 유지
  chosen_reading: ‘형제들’로 옮겼습니다.
  alternative_readings:
  - ‘동족’으로 중립화
  - ‘형제자매’로 확대
  rationale: 히브리어는 남성형 친족어를 쓰지만 공동체 전체를 대표하는 법적 언어이므로, 본문 형태를 유지하고 의미는 문맥으로 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
