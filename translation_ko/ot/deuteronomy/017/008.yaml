- source_word: בֵּין דִּין לְדִין
  english_pob_choice: between one legal claim and another
  chosen_korean: 한 법적 주장과 다른 법적 주장 사이
  alternatives_korean:
  - 한 송사와 다른 송사 사이
  - 한 판결과 다른 판결 사이
  - 한 소송과 다른 소송 사이
  lexicon: HALOT
  rationale: דין은 여기서 판결 자체보다 다투어지는 법적 청구나 주장에 가깝기 때문에, 절차보다 분쟁 내용을 드러내는 표현을 택했습니다.
- source_word: וּבֵין נֶגַע לָנֶגַע
  english_pob_choice: between one injury and another
  chosen_korean: 한 상처와 다른 상처 사이
  alternatives_korean:
  - 한 재앙과 다른 재앙 사이
  - 한 질병과 다른 질병 사이
  - 한 타격과 다른 타격 사이
  lexicon: HALOT
  rationale: נגע는 상처·타격·재앙 등을 포함할 수 있으나, 앞의 법정 분쟁 목록과 함께 읽을 때 신체적 손상 사건을 가장 무리 없이 반영합니다.
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 너희 성문 안의 다툼거리들
  alternatives_korean:
  - 너희 성문 안에서
  - 너희 성읍들 안에서
  lexicon: HALOT
  rationale: ‘성문’은 고대 이스라엘의 지역 재판 장소를 가리키는 문화적 표현이므로, 그 배경을 유지하면서도 한국어로는 자연스럽게 풀어 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 표준 용례에 따라 신적 고유명사는 ‘야훼’로 옮겨, 호칭 ‘주’와 구별했습니다.
theological_decisions:
- issue: 지역 재판에서 중앙 성소로의 상향 이동 표현
  chosen_reading: ‘일어나서… 올라가야 합니다’로 두 동사를 함께 살려, 판결의 권위가 더 높은 재판 자리로 옮겨지는 흐름을 나타냈습니다.
  alternative_readings:
  - ‘가서 물어보아야 합니다’
  - ‘중앙 성소로 가야 합니다’
  rationale: 히브리어의 וְקַמְתָּ וְעָלִיתָ는 단순 이동이 아니라 결정적 상향 이동을 강조하므로, 행위의 동작성과 위계성을 함께 살려야 합니다.
  doctrine_reference: 본문 문맥상 사법권의 상향 이관
- issue: 하나님 이름의 번역
  chosen_reading: ‘야훼 너의 하나님’
  alternative_readings:
  - ‘여호와 너의 하나님’
  - ‘주 너의 하나님’
  rationale: 본문의 יְהוָה는 인격적 언약 이름이므로, 본문에서 호칭으로 완화하지 않고 고유명으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
