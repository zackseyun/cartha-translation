revisions:
- from: 어떤 판결을 내리기 어려운 일이 있거든—곧 피와 피 사이, 한 법적 주장과 다른 법적 주장 사이, 그리고 한 상처와 다른 상처 사이, 곧 너희 성문 안의 다툼거리들에 관한 일이면—너는 일어나서, 야훼 너의 하나님께서 선택하실 곳으로 올라가야 합니다.[a][b][c][d]
  to: 재판할 일이 너무 어려워서 판결을 내릴 수 없거든—곧 피와 피 사이, 한 법적 다툼과 다른 법적 다툼 사이, 그리고 한 상처와 다른 상처 사이, 네 성문들 안에서 일어나는 분쟁의 일이면—너는 일어나 네 하나님 야훼께서 택하실 곳으로 올라가야 합니다.[a][b][c][d]
  rationale: 단수 청자를 일관되게 유지하고, 성문과 분쟁의 관계를 자연스러운 한국어 어순으로 바로잡았습니다. ‘법적 다툼’은 דִּין의 법정상 분쟁 의미를 살리면서 ‘법적 주장’보다 현대 한국어에서 자연스럽게 표현합니다. ‘상처’ 및 관련 대안은 원문의 의미 범위를 보존하도록 각주에 유지했습니다.
