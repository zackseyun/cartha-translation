source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
  footnotes:
  - marker: a
    text: Or 'acquire many horses for himself.' The Hebrew verb means 'make many' or 'increase.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''bring the people back to Egypt.'' The verb is causative: the king is forbidden to cause a return.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'You shall not add to return by this way again,' an idiom meaning 'You must never return again by this way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 그는 자기 자신을 위해 말을 많이 늘려서는 안 되며, 백성을 이집트로 돌아가게 해서 말을 많이 늘려서도 안 됩니다. 주께서 여러분에게 말씀하셨습니다. 「너희는 다시는 이 길로 돌아가서는 안 된다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자신을 위해 말을 많이 획득하다’일 수 있습니다. 히브리어 동사는 ‘많게 하다’, ‘늘리다’의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성을 이집트로 데려오다’입니다. 동사는 사역형이므로, 왕이 돌아오게 ‘하게 하는’ 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘다시는 이 길로 돌아오는 일을 더하지 말라’는 뜻으로, ‘이제 다시는 이 길로 돌아가서는 안 된다’는 관용적 금지 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 문맥상 왕에 대한 규정을 제한하는 접속사이므로, 현대 한국어에서 자연스럽고 제한성을 분명히 하는 ‘다만’으로 옮겼습니다.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  english_pob_choice: must not multiply horses for himself
  chosen_korean: 자기 자신을 위해 말을 많이 늘려서는 안 되며
  alternatives_korean:
  - 자기를 위해 말을 많이 모아서는 안 되며
  - 자기에게 말을 많이 두어서는 안 되며
  lexicon: HALOT
  rationale: 히필의 ‘많게 하다/늘리다’와 לּוֹ의 자기 위한 성격을 함께 살려, 직역적이되 한국어에서 통하는 표현으로 구성했습니다.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  english_pob_choice: nor cause the people to return to Egypt
  chosen_korean: 백성을 이집트로 돌아가게 해서
  alternatives_korean:
  - 백성을 이집트로 되돌려 보내서
  - 백성이 이집트로 돌아가게 해서
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘돌아가게 하다’로 옮겼고, ‘백성’을 유지해 주체를 일반화하지 않았습니다.
- source_word: לֹא תֹסִפוּן לָשׁוּב בַּדֶּרֶךְ הַזֶּה עוֹד
  english_pob_choice: You must never return again by this way.
  chosen_korean: 너희는 다시는 이 길로 돌아가서는 안 된다
  alternatives_korean:
  - 너희는 이 길로 다시 돌아와서는 안 된다
  - 너희는 다시 이 길로 돌아오지 말아야 한다
  lexicon: HALOT
  rationale: ‘추가하다/거듭하다’의 관용적 금지를 한국어에서 자연스러운 강한 금지문인 ‘다시는 … 안 된다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 주께서
  alternative_readings:
