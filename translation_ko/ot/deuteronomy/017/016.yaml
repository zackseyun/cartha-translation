  - 주님께서
  rationale: 이 본문은 이미 ‘주께서 여러분에게 말씀하셨습니다’라는 인용 구조로 되어 있어, 본문 안에서는 고유명 표기를 반복하기보다 화자 표지를 자연스럽게 유지했습니다.
  doctrine_reference: POB divine-name rendering policy for OT narration
