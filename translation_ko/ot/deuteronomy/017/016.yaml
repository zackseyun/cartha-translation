  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘돌아가게 하다’로 옮겼고, ‘백성’을 유지해 주체를 일반화하지 않았습니다.
- source_word: לֹא תֹסִפוּן לָשׁוּב בַּדֶּרֶךְ הַזֶּה עוֹד
  english_pob_choice: You must never return again by this way.
  chosen_korean: 너희는 다시는 이 길로 돌아가서는 안 된다
  alternatives_korean:
  - 너희는 이 길로 다시 돌아와서는 안 된다
  - 너희는 다시 이 길로 돌아오지 말아야 한다
  lexicon: HALOT
  rationale: ‘추가하다/거듭하다’의 관용적 금지를 한국어에서 자연스러운 강한 금지문인 ‘다시는 … 안 된다’로 옮겼습니다.
