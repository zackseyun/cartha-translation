source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
  footnotes:
  - marker: a
    text: Literally, 'on the mouth of two witnesses or three witnesses.' The Hebrew idiom means legal testimony or evidence.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the one who is to die'; that is, the person liable to capital punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 증인이나 세 증인의 증언에 따라 죽을 사람은 처형되어야 합니다[a][b]. 한 증인의 증언만으로는 그를 처형해서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘두 증인 또는 세 증인의 입에 따라’입니다. 이는 법정 증언이나 증거를 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘죽을 사람’이라는 축약적 표현을 사용하며, 사형에 처해질 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  english_pob_choice: on the testimony of
  chosen_korean: 증언에 의하여
  alternatives_korean:
  - 증거에 의하여
  - 말에 의하여
  - 진술에 근거하여
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입에 따라/의하여’는 법정 증언을 뜻하므로, 한국어에서는 자연스러운 법률 문체인 ‘증언에 의하여’로 옮겨 그 사법적 의미를 살렸습니다.
- source_word: שְׁנַ֣יִם עֵדִ֗ים ... שְׁלֹשָׁ֥ה עֵדִ֖ים
  english_pob_choice: two witnesses or three witnesses
  chosen_korean: 두 증인이나 세 증인
  alternatives_korean:
  - 두 증인 또는 세 증인
  - 두세 증인
  lexicon: HALOT
  rationale: 원문의 반복 구조를 살려 ‘증인’을 두 번 유지했고, 법정 문맥의 병렬성을 보존하기 위해 ‘이나’로 연결했습니다.
- source_word: יוּמַ֣ת הַ/מֵּ֑ת
  english_pob_choice: the one to die shall be put to death
  chosen_korean: 죽을 자는 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 사형당할 자는 반드시 죽임을 당해야 합니다
  - 죽을 사람은 반드시 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 축약적 분사 표현은 이미 사형 대상자를 가리키므로, ‘죽을 자’로 간결하게 살리되 Hoph'al의 강한 사법적 수동을 ‘죽임을 당해야 합니다’로 반영했습니다.
- source_word: עֵד אֶחָד
  english_pob_choice: one witness
  chosen_korean: 한 증인
  alternatives_korean:
  - 단 한 명의 증인
  - 증인 하나
  lexicon: HALOT
  rationale: 단수 대조를 분명히 하기 위해 ‘한 증인’을 사용해 앞의 복수형과 대응시켰습니다.
theological_decisions:
- issue: הַמֵּת의 지시 대상
  chosen_reading: ‘죽을 자’로 옮겨, 이미 죽은 사람이 아니라 사형에 처해질 대상자를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 사형수
  - 정죄된 자
  - 이미 죽은 자
  rationale: 문맥은 이미 죽은 사람의 상태가 아니라 사형 선고를 위한 증거 기준을 규정합니다. 한국어에서는 법률적 의미를 유지하면서도 원문의 축약성을 지나치게 해설하지 않는 표현이 적절합니다.
  doctrine_reference: 형사 재판의 증거 규정과 사형 관련 법규 문맥
