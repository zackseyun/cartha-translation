  - severity: medium
    issue: 조건·조사·확증의 문장 연결이 부자연스러움
    rationale: ‘조사하면’ 뒤에 ‘보십시오’와 ‘…라는 것입니다’가 이어져 한국어 문장 구조가 불안정합니다. 히브리어의 법적 조사 맥락을 살려 ‘조사하십시오’와 조사 결과의 확증을 분명히 해야 합니다.
