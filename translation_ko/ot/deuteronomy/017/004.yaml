- from: 그리고 그것이 당신에게 보고되고, 당신이 듣고, 철저히 조사하면, 보십시오, 이 일이 이스라엘에서 일어난 것이 참되고 확실하다는 것입니다.[a]
  to: 그 일이 당신에게 전해져 당신이 듣게 되면, 철저히 조사하십시오. 보십시오, 이 가증한 일이 이스라엘에서 행해졌다는 사실이 참되고 확실합니다.[a]
  rationale: 수동적 통보(‘전해져’), 철저한 법적 조사(‘철저히 조사하십시오’), 조사 결과의 이중 확증(‘참되고 확실합니다’)을 보존했습니다. 특히 누락된 תּוֹעֵבָה의 평가를 ‘가증한 일’로 회복했습니다. 주석은 אֱמֶת נָכוֹן הַדָּבָר를 ‘그 일이 참되고 확정되었다’로 읽는 가능한 어순·표현상의 대안을 간결하게 제시합니다.
