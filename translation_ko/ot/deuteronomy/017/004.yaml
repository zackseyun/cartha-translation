translation:
  language: ko
  text: 그리고 그것이 당신에게 보고되고, 당신이 듣고, 철저히 조사하면, 보십시오, 이 일이 이스라엘에서 일어난 것이 참되고 확실하다는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일은 참되고 확실하다’ 또는 ‘그 일은 참되고 확정되었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  english_pob_choice: and it is reported to you
  chosen_korean: 그리고 그것이 당신에게 보고되고
  alternatives_korean:
  - 그리고 당신에게 전해지고
  - 그리고 당신이 듣게 되고
  lexicon: HALOT
  rationale: 수동적 통보의 뜻을 살려 ‘보고되다’로 옮겨, 누군가가 사건을 공식적으로 전달하는 법정 맥락을 드러냈습니다.
- source_word: וְשָׁמָעְתָּ
  english_pob_choice: and you hear of it
  chosen_korean: 당신이 듣고
  alternatives_korean:
  - 당신이 그것을 듣고
  - 당신이 전해 듣고
  lexicon: HALOT
  rationale: 앞절의 보고를 이어받아 ‘듣다’를 직역에 가깝게 유지했으며, 한국어에서는 중복을 피하려고 목적어를 생략했습니다.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  english_pob_choice: and you investigate thoroughly
  chosen_korean: 철저히 조사하면
  alternatives_korean:
  - 면밀히 조사하면
  - 세심히 살피면
  lexicon: HALOT
  rationale: 법정 조사 맥락의 דרש를 ‘조사하다’로 옮기고, הֵיטֵב의 강화를 ‘철저히’로 반영했습니다.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  english_pob_choice: it is true and certain that
  chosen_korean: 이 일이 … 참되고 확실하다는 것입니다
  alternatives_korean:
  - 그 일이 … 참되고 확실하다는 것입니다
  - 그 일이 … 진실하고 확정되었다는 것입니다
  lexicon: HALOT
  rationale: אֱמֶת과 נָכוֹן의 이중 확인을 ‘참되고 확실하다’로 분리해 살렸고, 한국어 법정 문체에 맞게 종결을 정리했습니다.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  english_pob_choice: this abomination
  chosen_korean: 이 일
  alternatives_korean:
  - 이 가증한 일
  - 이 역겨운 일
  lexicon: HALOT
  rationale: 문장 전체를 자연스럽게 만들기 위해 본문에서 직접는 ‘이 일’로 두되, 강한 평가어 ‘가증한’은 theologically significant term이므로 주석 대신 본문 내에 다른 요소와 함께 유지하지 않고 번역의 최종 판단을 반영했습니다.
theological_decisions:
- issue: תּוֹעֵבָה의 강한 평가를 한국어에서 어떻게 보존할지
  chosen_reading: 이 일
  alternative_readings:
  - 이 가증한 일
  - 이 역겨운 행위
  rationale: 본문의 핵심은 조사 후 확정된 사실을 선언하는 법정 절차에 있으며, ‘가증한’의 강한 평가를 본문에 직접 넣으면 뒤의 ‘참되고 확실하다’와의 문맥 균형이 깨질 수 있어, 여기서는 사실 확인을 우선해 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
