  source_fidelity: 수동형 וְהֻגַּד의 통보 의미와 조사 명령의 법적 맥락은 대체로 반영되었으나, תּוֹעֵבָה를 단순히 ‘이 일’로 옮겨 원문의 강한 도덕적·언약적 평가를 누락했습니다. 또한 ‘참되고 확실하다는 것입니다’는 문장 종결과 논리 연결이 어색하며, 확증되는 내용이 ‘이 가증한 일이 이스라엘에서 행해졌다’는 사실임을 더 분명히 해야 합니다.
  naturalness: 초안의 ‘그것이 당신에게 보고되고, 당신이 듣고, 철저히 조사하면’은 조건절과 서술 연결이 매끄럽지 않고, ‘보십시오, …라는 것입니다’도 현대 표준어 합쇼체 문장으로 부자연스럽습니다. 법률적·공적 문맥에 맞춰 조건과 조사 지시를 분명히 한 문장으로 다듬는 것이 자연스럽습니다.
  terminology: תּוֹעֵבָה는 신명기에서 강한 평가를 지닌 핵심어이므로 ‘가증한 일’로 보존하는 것이 적절합니다. ‘참되고 확실하다’는 אֱמֶת נָכוֹן의 이중 확증을 무리 없이 반영합니다. ‘이스라엘’은 고유명사로 적절합니다.
  issues:
