base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
  footnotes:
  - marker: a
    text: Or 'according to the decision that they declare to you.' The Hebrew word דָּבָר can mean 'word,' 'matter,' or 'decision' in a judicial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 야훼께서 택하실 그곳에서 그들이 너에게 알려 주는 말에 따라 행해야 합니다.[a] 너는 그들이 너에게 가르치는 모든 것을 따라 행하도록 주의해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 너에게 선언하는 판결에 따라’로 옮길 수 있습니다. 히브리어 דָּבָר는 법정 문맥에서 ‘말’, ‘사안’, 또는 ‘판결’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall act
  chosen_korean: 행해야 합니다
  alternatives_korean:
  - 해야 합니다
  - 행하십시오
  lexicon: HALOT
  rationale: עשה는 ‘하다/행하다’처럼 넓지만, 이 문맥에서는 판결에 대한 준수 의무를 나타내므로 법률 문맥에 자연스러운 ‘행하다’를 택했습니다.
- source_word: עַל פִּי הַדָּבָר
  english_pob_choice: according to the word
  chosen_korean: 판결대로
  alternatives_korean:
  - 말대로
  - 그 말에 따라
  - 결정대로
  lexicon: HALOT
  rationale: דָּבָר는 여기서 법정적 맥락의 ‘말씀/사건/판결’ 중 특히 판결·결정의 뜻을 띠므로, 한국어에서는 의미를 분명히 드러내는 ‘판결’로 옮겼습니다.
- source_word: יָגִּידוּ לְךָ
  english_pob_choice: they declare to you
  chosen_korean: 너희에게 알려 주는
  alternatives_korean:
  - 너희에게 선언하는
  - 너희에게 말하는
  - 너희에게 공표하는
  lexicon: HALOT
  rationale: נגד의 히필은 공식적으로 ‘알리다/선언하다’의 뉘앙스를 가지지만, 한국어에서는 법정적 전달을 너무 딱딱하게 만들지 않으면서도 권위 있는 전달을 살려 ‘알려 주는’으로 번역했습니다.
- source_word: יוֹרוּךָ
  english_pob_choice: they instruct you
  chosen_korean: 가르치는
  alternatives_korean:
  - 지시하는
  - 훈계하는
  - 가르쳐 주는
  lexicon: HALOT
  rationale: ירה의 히필은 율법적 ‘가르치다/지시하다’의 뜻이 강하므로, 단순한 정보 전달보다 규범적 지도를 드러내는 ‘가르치는’을 선택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 대체어가 아니라 신명기 본문의 언약명 자체를 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
