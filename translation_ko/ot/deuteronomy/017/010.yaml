  naturalness: 초안은 대체로 자연스럽지만, ‘그곳은 야훼께서 선택하실 곳이며’은 원문의 전치사구를 별도의 설명 문장으로 풀어 원문의 문장 연결을 다소 바꿉니다. ‘야훼께서 택하실 그곳에서’로 두면 더 직접적이고 자연스럽습니다.
  terminology: 야훼는 프로젝트 방침 및 원문 יהוה에 맞습니다. 법적 문맥은 ‘알려 주는 말’과 ‘가르치는 모든 것’으로 보존하되, ‘판결’이라는 가능한 문맥적 해석은 각주에서 제시하는 것이 적절합니다.
