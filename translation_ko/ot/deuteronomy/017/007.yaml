revisions:
- from: 증인들의 손이 먼저 그 사람에게 있어 그를 죽이게 하고, 그 뒤에는 온 백성의 손이 있어야 합니다. 그렇게 하여 당신들 가운데서 악을 제거해야 합니다.
  to: 증인들이 먼저 그를 죽이는 일에 손을 대고, 그 뒤에 온 백성이 손을 대야 합니다. 그리하여 공동체 가운데서 악을 제거해야 합니다.
  rationale: 법적 집행의 역사적 내용을 불필요하게 구체화하지 않으면서, 증인이 먼저 참여하고 온 백성이 뒤따른다는 원문의 순서를 ‘손을 대다’라는 자연스러운 관용으로 보존했습니다. 마지막 공식은 개인 호칭의 수 문제를 피하기 위해 공동체적 범위를 명시하여 옮겼습니다.
