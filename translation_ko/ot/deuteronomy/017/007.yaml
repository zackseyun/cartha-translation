  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
  footnotes:
  - marker: a
    text: Or 'from among you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the hand of the witnesses ... and the hand of all the people,' a legal idiom assigning the witnesses the first responsibility in carrying out the sentence.
    reason: cultural_note
translation:
  language: ko
  text: 증인들의 손이 먼저 그 사람에게 있어 그를 죽이게 하고, 그 뒤에는 온 백성의 손이 있어야 합니다. 그렇게 하여 당신들 가운데서 악을 제거해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַד הָעֵדִים
  english_pob_choice: The hand of the witnesses
  chosen_korean: 증인들의 손
  alternatives_korean:
  - 증인들의 책임
  - 증인들
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 여기서 법적 책임과 행위의 주체를 가리키는 관용으로 보이므로, 한국어에서는 자연스럽게 복수 소유형으로 옮겨 그 기능을 드러냈습니다.
- source_word: בּוֹ בָרִאשֹׁנָה לַהֲמִיתוֹ
  english_pob_choice: against him to put him to death
  chosen_korean: 먼저 그 사람에게 있어 그를 죽이게 하고
  alternatives_korean:
  - 먼저 그에게 대하여 그를 죽이게 하고
  - 먼저 그를 죽이도록 하고
  lexicon: HALOT
  rationale: ‘먼저’와 ‘죽이게 하고’로 법적 절차의 선행성을 살렸고, ‘그 사람에게 있어’로 원문의 전치적 관계를 과도하게 풀지 않으면서도 한국어 문장을 자연스럽게 만들었습니다.
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  english_pob_choice: and afterward the hand of all the people
  chosen_korean: 그 뒤에는 온 백성의 손이 있어야 합니다
  alternatives_korean:
  - 그리고 나서 온 백성의 손이 따라야 합니다
  - 그 후에는 모든 백성의 손이 있어야 합니다
  lexicon: HALOT
  rationale: ‘온 백성’은 공동체 전체를 가리키는 집합적 표현으로 옮겼고, ‘그 뒤에는’으로 순서를 분명히 했습니다.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  english_pob_choice: So you shall purge the evil from your midst
  chosen_korean: 그렇게 하여 당신들 가운데서 악을 제거해야 합니다
  alternatives_korean:
  - 그렇게 하여 당신들 가운데서 악을 정결하게 해야 합니다
  - 그렇게 하여 당신들 가운데서 악을 없애야 합니다
  lexicon: HALOT
  rationale: Deuteronomy의 상투적 법정-언약 공식으로서 בער는 여기서 ‘제거하다’가 가장 직접적이며, 공동체 내부에서 악을 치워 내는 뜻을 보존합니다.
theological_decisions:
- issue: 공동체의 참여가 드러나는 법적 집행 공식
  chosen_reading: 증인들이 먼저 책임지고, 그 뒤에 온 백성이 동참하여 악을 제거하는 절차로 옮겼습니다.
  alternative_readings:
  - 증인과 백성이 함께 즉시 집행하는 것으로 옮길 수 있습니다.
  - 증인들의 증언만 강조하고 집행의 공동성을 약화시킬 수 있습니다.
  rationale: 원문은 증인들에게 첫 책임을 부여하고 공동체 전체의 후속 참여를 요구하므로, 둘 사이의 순서를 분명히 하되 집행의 공동성을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
