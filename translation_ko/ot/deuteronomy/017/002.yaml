  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
  footnotes:
  - marker: a
    text: Or 'in one of your towns/cities'; literally 'in one of your gates.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by violating his covenant' or 'to break his covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신 가운데, 곧 당신에게 야훼 당신의 하나님이 주시는 성문들 가운데 하나 안에서, 남자나 여자가 야훼 당신의 하나님 보시기에 악한 일을 하여 그분의 언약을 어기는 일이 있으면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 한 성읍 안에서'; 문자적으로는 '당신의 성문들 가운데 하나 안에서'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그분의 언약을 위반하여' 혹은 '그분의 언약을 깨뜨려'.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִרְבְּךָ / אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  english_pob_choice: among you / within one of your gates that Yahweh your God is giving you
  chosen_korean: 당신 가운데, 곧 당신에게 야훼 당신의 하나님이 주시는 성문들 가운데 하나 안에서
  alternatives_korean:
  - 당신의 한 성읍 안에서
  - 당신의 문들 가운데 하나에서
  - 당신 가운데
  lexicon: HALOT
  rationale: בְּקִרְבְּךָ의 공동체적 범위와 בְּאַחַד שְׁעָרֶיךָ의 문자적 '성문' 이미지를 함께 살려, 관용적 의미와 원문 표지를 둘 다 보존했습니다.
- source_word: אִישׁ אוֹ אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자가
  alternatives_korean:
  - 남자든 여자든
  - 어떤 남자나 여자든
  - 사람이
  lexicon: HALOT
  rationale: 히브리어의 남성-여성 병렬을 그대로 살려 성별 대구를 지우지 않았습니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: who does what is evil in the eyes of Yahweh your God
  chosen_korean: 야훼 당신의 하나님 보시기에 악한 일을 하여
  alternatives_korean:
  - 야훼 당신의 하나님 눈에 악한 일을 하여
  - 야훼 당신의 하나님 앞에서 악을 행하여
  lexicon: HALOT
  rationale: '''악한 일을 하다''는 히브리어 관용구를 자연스럽게 옮기면서, ''보시기에''로 평가 기준이 하나님께 있음을 유지했습니다.'
- source_word: לַעֲבֹר בְּרִיתוֹ
  english_pob_choice: by transgressing his covenant
  chosen_korean: 그분의 언약을 어기는 일이 있으면
  alternatives_korean:
  - 그분의 언약을 범하는 일이 있으면
  - 그분의 언약을 위반하는 일이 있으면
  - 그분의 언약을 깨뜨리는 일이 있으면
  lexicon: HALOT
  rationale: עָבַר의 언약 위반 용법을 한국어의 '어기다'로 옮겨, 지나치게 법률문서화하지 않으면서도 실제적 위반 의미를 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 언약 위반 표현
  chosen_reading: יהוה를 '야훼'로 두고, 언약 위반은 '그분의 언약을 어기는'으로 직역 성격을 유지했습니다.
  alternative_readings:
  - 여호와
  - 그분의 언약을 깨뜨리는
  rationale: 프로젝트 기본값에 따라 신명기의 여호와 표제는 야훼로 유지하는 것이 원문 추적성과 일관성에 더 적합합니다. 또한 언약 위반은 다음 절의 구체적 죄목을 미리 해설하지 않고 일반 범주로 남겨 두는 편이 본문 흐름에 맞습니다.
  doctrine_reference: 원문-직역 우선과 언약 범주의 보존
