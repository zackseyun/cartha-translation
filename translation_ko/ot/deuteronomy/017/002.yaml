  naturalness: 초안의 ‘당신에게 야훼 당신의 하나님이’와 ‘그분의 언약을 어기는 일이 있으면’은 수식 관계와 조건문의 핵심이 다소 어색합니다. ‘당신의 하나님 야훼께서’ 및 ‘…남자나 여자가 발견되면’으로 고치면 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다.
