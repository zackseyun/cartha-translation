  english_pob_choice: among you / within one of your gates that Yahweh your God is giving you
  chosen_korean: 당신 가운데, 곧 당신에게 야훼 당신의 하나님이 주시는 성문들 가운데 하나 안에서
  alternatives_korean:
  - 당신의 한 성읍 안에서
  - 당신의 문들 가운데 하나에서
  - 당신 가운데
  lexicon: HALOT
  rationale: בְּקִרְבְּךָ의 공동체적 범위와 בְּאַחַד שְׁעָרֶיךָ의 문자적 '성문' 이미지를 함께 살려, 관용적 의미와 원문 표지를 둘 다 보존했습니다.
- source_word: אִישׁ אוֹ אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자가
  alternatives_korean:
  - 남자든 여자든
  - 어떤 남자나 여자든
  - 사람이
  lexicon: HALOT
  rationale: 히브리어의 남성-여성 병렬을 그대로 살려 성별 대구를 지우지 않았습니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: who does what is evil in the eyes of Yahweh your God
  chosen_korean: 야훼 당신의 하나님 보시기에 악한 일을 하여
  alternatives_korean:
  - 야훼 당신의 하나님 눈에 악한 일을 하여
  - 야훼 당신의 하나님 앞에서 악을 행하여
  lexicon: HALOT
  rationale: '''악한 일을 하다''는 히브리어 관용구를 자연스럽게 옮기면서, ''보시기에''로 평가 기준이 하나님께 있음을 유지했습니다.'
- source_word: לַעֲבֹר בְּרִיתוֹ
  english_pob_choice: by transgressing his covenant
  chosen_korean: 그분의 언약을 어기는 일이 있으면
  alternatives_korean:
