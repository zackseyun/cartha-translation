translation:
  language: ko
  text: 야훼 당신의 하나님이 당신에게 주시는 땅으로 들어가 그것을 차지하고 거기에 살다가, “나는 내 위에 왕을 세우겠습니다. 나를 둘러싼 모든 민족들처럼 말입니다”라고 말하게 되면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나 위에 왕을 임명하겠습니다.” 히브리어는 문자적으로 “나 위에/내게 왕을 세우겠습니다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 일반적인 ‘주님’ 대신 신명기 본문의 언약적 고유명사인 יְהוָה를 ‘야훼’로 옮기고, 2인칭 단수의 친밀한 언약 호칭은 문맥상 공손한 ‘당신의 하나님’으로 표현했습니다.
- source_word: נֹתֵן לָךְ
  english_pob_choice: is giving you
  chosen_korean: 주시는
  alternatives_korean:
  - 주고 계신
  - 줄
  lexicon: HALOT
  rationale: 분사형은 현재적·지속적 느낌을 살려 ‘주시는’으로 옮겨 하나님의 능동적 선물을 드러냈습니다.
- source_word: וִירִשְׁתָּהּ וְיָשַׁבְתָּה בָּהּ
  english_pob_choice: you take possession of it and live in it
  chosen_korean: 그것을 차지하고 거기에 살다가
  alternatives_korean:
  - 그것을 소유하고 거기에 거주하고
  - 그 땅을 차지하여 그 안에 살고
  lexicon: HALOT
  rationale: ירשׁ는 단순 소유보다 ‘차지하다/점유하다’가 땅 문맥의 구체성을 더 잘 살리고, ישׁב는 ‘거주하다’보다 현대적이면서도 의미를 해치지 않는 ‘살다’로 옮겼습니다.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  english_pob_choice: I will set a king over myself
  chosen_korean: 나는 내 위에 왕을 세우겠습니다
  alternatives_korean:
  - 나는 나에게 왕을 세우겠습니다
  - 나는 내게 왕을 임명하겠습니다
  lexicon: HALOT
  rationale: ‘עָלַי’의 ‘나 위에/나를 다스리도록’이라는 위계적 뉘앙스를 살려 직역에 가까운 ‘내 위에 왕을 세우겠습니다’로 옮겼습니다.
- source_word: כְּכָל הַגּוֹיִם
  english_pob_choice: like all the nations
  chosen_korean: 나를 둘러싼 모든 민족들처럼
  alternatives_korean:
  - 모든 민족들처럼
  - 주변의 모든 나라들처럼
  lexicon: HALOT
  rationale: 후행 수식어 ‘주변에 있는’의 공간적 감각을 살려 ‘나를 둘러싼’으로 구체화하고, גּוֹיִם은 이 문맥에서 ‘민족들’이 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼 번역
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 번역 관행보다 히브리어 고유명을 드러내는 원칙을 따랐고, 이 구절은 하나님 이름 자체가 문장 전면에 나오는 본문이므로 대체 표제를 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
