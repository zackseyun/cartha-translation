base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
  footnotes:
  - marker: a
    text: Or 'and shall not presume any longer' or 'and shall not act arrogantly again.' The Hebrew verb conveys willful, insolent defiance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 온 백성이 그것을 듣고 두려워하며, 다시는 함부로 행하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יזיד는 '주제넘게 여기다/함부로 행하다/거만하게 굴다'의 뜻을 가지며, 본문은 단순한 내적 교만보다 고의적이고 방자한 반항을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  english_pob_choice: And all the people
  chosen_korean: 그러면 온 백성이
  alternatives_korean:
  - 그리고 모든 백성이
  - 그리하여 온 백성이
  lexicon: HALOT
  rationale: 문맥상 판결의 공개적 결과를 나타내므로 연결어는 자연스럽게 옮기고, הָעָם은 반복되는 '이스라엘' 없이도 '온 백성'으로 충분히 드러납니다.
- source_word: יִשְׁמְעוּ
  english_pob_choice: shall hear
  chosen_korean: 그것을 듣고
  alternatives_korean:
  - 듣게 되고
  - 들을 것입니다
  lexicon: HALOT
  rationale: 법적 판결이 공적으로 알려져 백성이 '듣는' 상황이므로, 대상이 암시되는 한국어로 자연스럽게 옮겼습니다.
- source_word: וְיִרָאוּ
  english_pob_choice: and fear
  chosen_korean: 두려워하며
  alternatives_korean:
  - 경외하며
  - 무서워하며
  lexicon: HALOT
  rationale: 히브리어의 ירא는 여기서 공적 징계가 낳는 두려움을 가리키므로, '경외'보다 일반적이고 직접적인 '두려워하다'가 문맥에 더 가깝습니다.
- source_word: וְלֹא יְזִידוּן
  english_pob_choice: and shall not act presumptuously
  chosen_korean: 다시는 함부로 행하지 않을 것입니다
  alternatives_korean:
  - 다시는 주제넘게 행동하지 않을 것입니다
  - 다시는 교만하게 행하지 않을 것입니다
  - 다시는 무례히 행하지 않을 것입니다
  lexicon: HALOT
  rationale: זיד의 핵심은 단순한 실수가 아니라 고의적이고 거만한 무모함이므로, 한국어에서는 '함부로 행하다'로 공적 권위에 대한 무례하고 제멋대로인 행위를 담았습니다.
theological_decisions:
- issue: 공포의 대상과 성격을 명시할지 여부
  chosen_reading: '''두려워하며''로 옮겨, 두려움의 대상이 하나님인지 형벌인지 본문이 직접 규정하지 않는 긴장을 그대로 둡니다.'
  alternative_readings:
  - 하나님을 두려워하며
  - 형벌을 두려워하며
  rationale: 히브리어는 단순히 '두려워하다'만 말하므로, 해석을 좁히기보다 본문의 간결함과 여운을 유지하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
