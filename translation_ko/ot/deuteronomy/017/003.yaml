translation:
  language: ko
  text: 그가 가서 다른 신들을 섬기고 그들에게 절하거나 해나 달이나 하늘의 모든 군대에게 절하면, 곧 내가 명령하지 않은 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 모든 군대’는 하늘의 천체 배열을 가리킬 수 있으며, 어떤 문맥에서는 하늘 존재들을 떠올리게 할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 명령하지 않은’은 특히 ‘하늘의 모든 군대’를 가리키거나, 더 넓게는 앞의 우상숭배 전체를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעֲבֹד
  english_pob_choice: goes and serves
  chosen_korean: 가서 … 섬기고
  alternatives_korean:
  - 가서 … 경배하고
  - 가서 … 예배하고
  lexicon: HALOT
  rationale: 히브리어 동사 흐름을 따라 ‘가서’로 조건절의 진행을 살리고, עבד는 뒤의 ‘절하다’와 구분되도록 ‘섬기다’로 옮겨 우상숭배의 행위적 성격을 유지했습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들을
  alternatives_korean:
  - 외국 신들을
  - 이방 신들을
  lexicon: HALOT
  rationale: 본문은 단순히 ‘다른’ 신들을 말하므로, 민족적 뉘앙스를 덧붙이는 ‘이방’이나 ‘외국’은 피했습니다.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  english_pob_choice: bows down to them
  chosen_korean: 그들에게 절하거나
  alternatives_korean:
  - 그들 앞에 엎드리거나
  - 그들을 경배하거나
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 엎드리는 동작이므로 ‘절하다’로 살리고, 이미 ‘섬기고’가 있으므로 ‘경배하다’로 의미를 합치지 않았습니다.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  english_pob_choice: all the host of heaven
  chosen_korean: 하늘의 모든 군대
  alternatives_korean:
  - 하늘의 모든 천군
  - 하늘의 온 군대
  lexicon: HALOT
  rationale: צָבָא의 기본 군사적 뜻을 살려 직역하되, 성경적 관용구임을 유지하려고 ‘하늘의 모든 군대’로 옮겼습니다. 여기에는 천체들의 집합뿐 아니라 경우에 따라 하늘 존재들을 연상시킬 여지도 남습니다.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  english_pob_choice: which I have not commanded
  chosen_korean: 곧 내가 명령하지 않은 것입니다
  alternatives_korean:
  - 내가 명령하지 않은 것입니다
  - 내가 금하지 않은 것입니다
  lexicon: HALOT
  rationale: 히브리어는 명령 부재를 말하므로 ‘금하지 않았다’로 강화하지 않고, 문맥상 앞의 우상숭배 전체를 받아들일 수 있도록 연결형으로 처리했습니다.
theological_decisions:
- issue: 마지막 절의 관계절 범위
  chosen_reading: ‘내가 명령하지 않은 것’은 앞서 말한 다른 신들 숭배와 하늘의 군대 숭배 전체를 가리킬 수 있게 두었습니다.
  alternative_readings:
  - 오직 ‘하늘의 모든 군대’만을 수식한다
  - ‘섬기고 절하는’ 전체 행위를 총괄한다
  rationale: 히브리어 관계절의 연결이 문맥상 다소 유동적이므로, 한쪽으로 과도하게 확정하지 않고 모호성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
