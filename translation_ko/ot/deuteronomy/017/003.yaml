  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
  footnotes:
  - marker: a
    text: Or, more specifically, 'to all the heavenly host.' The phrase can refer to the array of heavenly bodies, and in some contexts may also evoke heavenly beings.
    reason: lexical_alternative
