translation:
  language: ko
  text: 그가 가서 다른 신들을 섬기고 그들에게 절하거나, 해나 달이나 하늘의 온 군대에게 절하여, 내가 명령하지 않은 일을 하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 온 군대’는 하늘의 천체들의 집합을 가리킬 수 있으며, 어떤 문맥에서는 하늘 존재들을 떠올리게 할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 명령하지 않은’이라는 말은 특히 ‘하늘의 온 군대’를 가리킬 수도 있고, 더 넓게는 앞에서 말한 섬김과 절함의 행위 전체를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעֲבֹד
  english_pob_choice: goes and serves
  chosen_korean: 가서 … 섬기고
