  source_fidelity: 초안은 עבד와 שׁחה를 각각 ‘섬기고’와 ‘절하다’로 구별한 점, ‘다른 신들’을 선택한 점, 그리고 마지막 관계절의 범위가 유동적임을 각주로 밝힌 점은 원문에 대체로 충실합니다. 그러나 ‘그들에게 절하거나 해나 달이나 하늘의 모든 군대에게 절하면’은 접속 범위가 부자연스럽고, 해·달·하늘의 군대가 ‘절하다’의 대상으로 병렬된다는 원문의 구조를 한국어에서 명료하게 드러내지 못합니다. 또한 ‘곧’은 원문에 없는 단정적 설명 관계를 더합니다.
  naturalness: ‘하늘의 모든 군대’는 직역으로는 가능하나 현대 한국어에서 천체 또는 천상 존재의 집합을 뜻하는 성경적 표현으로 즉시 이해되기 어렵습니다. ‘하늘의 온 군대’가 더 관용적이고 자연스럽습니다. 원문이 앞 절에서 이어지는 조건절의 일부이므로, 번역도 ‘…하면’으로 자연스럽게 이어지게 하는 편이 좋습니다.
