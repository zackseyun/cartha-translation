  to: 당신은 레위인 제사장들과 그 당시 직무를 맡고 있는 재판관에게 가서 문의하십시오. 그러면 그들이 당신에게 그 사건에 대한 판결을 알려 줄 것입니다.[a]
  rationale: 문체를 현대 표준 합쇼체로 일관되게 고치고, 당시 재직 중인 재판관이라는 관계절의 뜻을 명료하게 했습니다. ‘문의하십시오’는 וְדָרַשְׁתָּ의 공식적 질의 행위를, ‘그 사건에 대한 판결’은 דְּבַר הַמִּשְׁפָּט의 법정 결정을 자연스럽게 나타냅니다. 복수 주어 ‘제사장들과 … 재판관’에 따른 ‘그들이’는 히브리어 복수 동사와도 부합합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:48:01Z'
