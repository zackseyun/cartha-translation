  source_fidelity: 핵심 법정 절차와 ‘레위인 제사장들’, 재판관, 문의, 권위 있는 사법적 결정이라는 의미는 대체로 충실합니다. 그러나 ‘그 시대에 있는 재판관’은 אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם가 가리키는 당시의 현직 담당자라는 뜻을 자연스럽게 충분히 드러내지 못합니다.
