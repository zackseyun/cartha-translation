id: DEU.17.9
reference: Deuteronomy 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָאתָ֗ אֶל הַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם וְ/אֶל הַ/שֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/דָרַשְׁתָּ֙ וְ/הִגִּ֣ידוּ לְ/ךָ֔ אֵ֖ת דְּבַ֥ר הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
  footnotes:
  - marker: a
    text: Or, more formally, 'the word of the judgment.' The Hebrew expression refers to the authoritative judicial decision.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 레위인 제사장들과 그 당시 직무를 맡고 있는 재판관에게 가서 문의하십시오. 그러면 그들이 당신에게 그 사건에 대한 판결을 알려 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘판결의 말씀’. 이 히브리어 표현은 권위 있는 사법적 결정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  english_pob_choice: And you shall come
  chosen_korean: 그리고 너는 …에게 가서
  alternatives_korean:
  - 그리고 너는 …에게 오고
  - 그러고는 …에게 나아가
  lexicon: HALOT
  rationale: 법정 절차를 향한 이동을 자연스러운 현대 한국어로 옮기되, 명령·지시의 미래형 힘을 살리기 위해 ‘가서’를 택했습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the Levitical priests
  chosen_korean: 레위인 제사장들
  alternatives_korean:
  - 레위 제사장들
  - 레위 족속 제사장들
  lexicon: HALOT
  rationale: 히브리어는 제사장들이 레위 지파에 속함을 나타내므로, 한국어에서는 간결하고 직역성이 있는 ‘레위인 제사장들’로 옮겼습니다.
- source_word: הַשֹּׁפֵט
  english_pob_choice: the judge
  chosen_korean: 재판관
  alternatives_korean:
  - 판사
  - 심판관
  lexicon: HALOT
  rationale: 고대 이스라엘의 משפט 맥락에서는 단순 직무명보다 공식적인 사법 권위를 드러내는 ‘재판관’이 더 적절합니다.
- source_word: דְּבַר הַמִּשְׁפָּט
  english_pob_choice: the decision in the case
  chosen_korean: 판결
  alternatives_korean:
  - 재판의 결정
  - 판정
  - 판결의 말씀
  lexicon: HALOT
  rationale: 문자적으로는 ‘재판/판결의 말’이지만, 문맥상 권위를 가진 사법적 결정을 가리키므로 현대 한국어의 법률 용어인 ‘판결’로 압축했습니다.
theological_decisions:
- issue: 법정 권위의 전달 방식
  chosen_reading: 제사장들과 재판관이 분쟁의 최종 판결을 권위 있게 알려 주는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 단순한 조언이나 중재로 약화하는 번역
  - ‘판단’처럼 비공식적 의미로 완화하는 번역
  rationale: 본문은 단순 상담이 아니라 공식적·규범적 사법 판정을 말하므로, 그 권위와 절차성을 보존해야 합니다.
  doctrine_reference: 신명기 17:8-13의 공적 재판 규정
- issue: ‘그 시대에 있는’의 시간성
  chosen_reading: 특정 인물 이름이 아니라 당시 현직 재판관을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - ‘그 날들에 있을 자’처럼 직역하는 번역
  - 미래형 인물 예언으로 읽는 번역
  rationale: 문맥상 현재 사건을 판결할 그때의 담당자를 지칭하므로, 제도적·동시대적 의미를 분명히 하는 것이 적절합니다.
  doctrine_reference: 율법의 실무적 재판 절차
