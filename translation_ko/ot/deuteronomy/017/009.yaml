  terminology: ‘레위인 제사장들’, ‘재판관’, ‘판결’은 적절합니다. 다만 דְּבַר הַמִּשְׁפָּט의 사건 관련성을 본문에서 ‘그 사건에 대한 판결’로 밝혀 영어 감사 기록의 ‘decision in the case’ 및 히브리어의 법정 문맥을 더 잘 반영할 수 있습니다.
