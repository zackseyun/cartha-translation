  source_fidelity: 현 번역은 원문의 금지 대상을 반대로 옮겼습니다. 히브리어는 ‘흠이나 어떤 나쁜 것이 있는’ 소나 שֶׂה를 제물로 바치는 일을 금하지만, 초안은 ‘흠 없는’ 짐승을 바치지 말라고 하여 의미가 역전되었습니다. 또한 שׁוֹר를 ‘수소’, שֶׂה를 ‘어린 양’으로 한정한 것은 원문의 성별·연령 범위보다 좁습니다.
  naturalness: ‘당신들의 하나님’은 현대 표준 한국어 성서 문맥에서 부자연스럽고, 히브리어의 단수 2인칭 소유 표현에도 맞지 않습니다. 일반적 단수 청자를 반영한 ‘네 하나님’이 자연스럽습니다. 수정문은 합쇼체 금지문으로 자연스럽습니다.
  terminology: ‘제물로 바치다’는 זבח의 제의적 의미를 적절히 나타내며, ‘흠’, ‘가증한 것’, ‘야훼’도 적절합니다. שֶׂה는 본문에서 ‘양’으로 옮기되 염소도 포함할 수 있음을 각주로 보존해야 합니다.
