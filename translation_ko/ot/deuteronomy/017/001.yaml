  text: 너는 흠이나 어떤 나쁜 것이든 있는 소나 양[a]을 네 하나님 야훼께 제물로 바쳐서는 안 됩니다. 그것은 네 하나님 야훼께 가증한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 더 넓은 무리 가축 용어로, 양이나 염소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  english_pob_choice: You shall not sacrifice
  chosen_korean: 바쳐서는 안 됩니다
  alternatives_korean:
