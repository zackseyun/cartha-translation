  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
  footnotes:
  - marker: a
    text: Hebrew שֶׂה is a broader flock term and can refer to a sheep or a goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 흠 없는 수소나 어린 양은 야훼 당신들의 하나님께 바쳐서는 안 됩니다[a]. 그 안에 어떤 흠이나 다른 나쁜 것도 있어서는 안 되니, 그것은 야훼 당신들의 하나님께 가증한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 더 넓은 무리 가축 용어로, 양이나 염소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  english_pob_choice: You shall not sacrifice
  chosen_korean: 바쳐서는 안 됩니다
  alternatives_korean:
  - 희생제물로 드려서는 안 됩니다
  - 제사드려서는 안 됩니다
  lexicon: HALOT
  rationale: 제의적 문맥의 זבח를 단순 도살이 아니라 제물로 바치는 행위로 이해해, 금지문의 자연스러운 한국어로 옮겼습니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 수소
  alternatives_korean:
  - 소
  - 황소
  lexicon: HALOT
  rationale: 제사 규정의 가축 문맥에서 שׁוֹר는 일반적 ‘소’보다 더 구체적인 수소가 가장 자연스럽고, 불필요하게 암수 구분을 바꾸지 않습니다.
- source_word: שֶׂה
  english_pob_choice: sheep
  chosen_korean: 어린 양
  alternatives_korean:
  - 양
  - 가축
  - 양이나 염소
  lexicon: HALOT
  rationale: POB의 각주가 밝히듯 이 말은 더 넓게는 양/염소를 가리킬 수 있지만, 본문 흐름에서는 제의적 가축을 가리키는 읽기와 한국어 가독성을 함께 살려 ‘어린 양’으로 옮겼습니다.
- source_word: מוּם / כֹּל דָּבָר רָע
  english_pob_choice: blemish / any bad thing
  chosen_korean: 흠 ... 어떤 흠이나 다른 나쁜 것도
  alternatives_korean:
  - 흠 ... 어떤 흠이나 악한 것도
  - 흠 ... 어떤 결함이나 나쁜 것도
  lexicon: HALOT
  rationale: מוּם의 제의적 결격을 ‘흠’으로, 뒤따르는 כֹּל דָּבָר רָע를 의미를 약화하지 않으면서도 한국어로 자연스럽게 풀어 ‘어떤 흠이나 다른 나쁜 것도’로 옮겼습니다.
- source_word: תוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 역겨운 것
  - 혐오스러운 것
  lexicon: HALOT
  rationale: תוֹעֵבָה의 강한 제의적·윤리적 혐오를 한국어 성서어휘에서 널리 쓰이는 ‘가증한 것’으로 보존했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 공통 번역어 ‘주님’으로 완화하지 않고, POB 기준에 따라 언약명 ‘야훼’를 직접 드러내어 원문 경고의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
