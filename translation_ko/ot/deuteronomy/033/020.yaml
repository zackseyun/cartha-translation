base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
  footnotes:
  - marker: a
    text: Or 'Blessed be he who enlarges Gad'; the subject may be understood implicitly as God, though the Hebrew does not state it explicitly.
    reason: alternative_reading
  - marker: b
    text: '''Like a lioness'' may also be rendered ''like a lion''; the Hebrew term can denote a powerful lion more generally.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'arm, even crown of the head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갓에 관하여 그는 이렇게 말하였습니다. “갓을 넓혀 주는 이는[a] 복을 받습니다. 갓은 암사자[b]처럼 자리 잡고, 팔뿐 아니라 정수리까지[c] 찢습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “갓을 넓혀 주시는 이는 복되십니다.” 히브리어는 갓을 넓혀 주는 이가 누구인지를 명시하지 않으며, 하나님을 암시하는 것으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: “암사자”는 “사자”로도 옮길 수 있습니다. 히브리어 낱말은 강한 사자를 일반적으로 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “팔, 곧 머리의 정수리”입니다.
    reason: lexical_alternative
