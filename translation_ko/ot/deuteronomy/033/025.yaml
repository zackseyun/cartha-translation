  rationale: 본문의 금속 이미지와 축복 문맥을 함께 살리면서도, 어휘상의 불확실성은 주석으로 보존했습니다.
  doctrine_reference: '번역 원칙: 해석을 지나치게 단정하지 말고, 원문의 긴장과 모호성을 필요한 곳에서 유지한다.'
