revisions:
- from: 야훼여, 그의 힘을 복 주시고, 그의 손이 한 일을 기쁘게 받아 주십시오. 그를 거슬러 일어나는 자들의 허리를 치시고, 그를 미워하는 자들이 다시는 일어나지 못하게 하십시오.[a]
  to: 야훼여, 그의 힘에 복을 주시고, 그의 손으로 하는 일을 기꺼이 받아 주십시오. 그를 거슬러 일어나는 자들과 그를 미워하는 자들의 허리를 부수시고, 그들이 다시는 일어나지 못하게 하십시오.[a]
  rationale: 문법적으로 병렬인 두 적대 집단이 모두 최종 결과절의 대상임을 명확히 하고, ‘부수시고’로 원문의 강한 동사를 반영했습니다. ‘손으로 하는 일’은 히브리어의 ‘그의 손들의 일’을 자연스러운 한국어로 옮긴 것입니다. 각주는 한국어 독자에게 직접적으로 기능하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:01Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그를 미워하는 자들’이 ‘다시는 일어나지 못하게’의 주어처럼 배치되어, 앞의 ‘그를 거슬러 일어나는 자들’은 ‘허리를 치시고’의 대상에만 남습니다. 히브리어는 두 부류를 함께 ‘허리를 부수고 다시 일어서지 못하게’ 해 달라는 청원으로 연결합니다. 이를 문장 구조에서 분명히 해야 합니다.
  naturalness: 기도체의 합쇼체와 전반적 문체는 자연스럽습니다. 다만 ‘그의 손이 한 일’보다 ‘그의 손으로 하는 일을’이 פֹּעַל יָדָיו의 계속적이고 포괄적인 뜻을 더 자연스럽게 살립니다. ‘부수시고’는 מְחַץ의 강한 뜻을 ‘치시고’보다 충실히 전달합니다.
  terminology: ‘야훼’, ‘복을 주시고’, ‘힘’, ‘허리’는 적절합니다. 각주에서 영어 ‘loins’를 그대로 제시하지 말고 히브리어 신체 이미지와 그 비유적 함의를 한국어로 설명하는 편이 표준 한국어 독자에게 자연스럽습니다.
  issues:
  - severity: medium
    issue: 마지막 절의 수식·연결 범위가 불명확합니다.
    rationale: 원문은 ‘그를 거슬러 일어나는 자들’과 ‘그를 미워하는 자들’을 병렬로 두고, 이들이 다시 일어서지 못하도록 해 달라고 청원합니다. 개정문은 두 집단 모두에 ‘다시는 일어나지 못하게’가 적용됨을 명시합니다.
  - severity: low
    issue: מְחַץ의 강도가 ‘치시고’에서 다소 약화됩니다.
    rationale: 이 동사는 부수다, 산산이 깨뜨리다의 뜻을 지니므로 ‘허리를 부수시고’가 원문의 강한 시적 표현을 더 잘 보존합니다.
  - severity: low
    issue: 각주가 영어 낱말을 기준으로 설명합니다.
    rationale: 한국어 번역 각주는 ‘loins’라는 영어어휘 대신 해당 히브리어 표현과 그 문화적 이미지를 직접 설명해야 합니다.
