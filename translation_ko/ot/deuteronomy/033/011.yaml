source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
  footnotes:
  - marker: a
    text: Or 'his wealth' or 'his army' for 'his strength'; the Hebrew term can denote strength, resources, or military force.
    reason: lexical_alternative
  - marker: b
    text: Literally 'Crush the loins of those who rise against him.' 'Loins' is a Hebrew image for strength.
    reason: cultural_note
translation:
  language: ko
  text: 야훼여, 그의 힘을 복 주시고, 그의 손이 한 일을 기쁘게 받아 주십시오. 그를 거슬러 일어나는 자들의 허리를 치시고, 그를 미워하는 자들이 다시는 일어나지 못하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허리’는 문자적으로는 ‘loins’에 해당하며, 히브리어에서는 힘과 생명력의 중심을 가리키는 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ / Bless
  english_pob_choice: Bless
  chosen_korean: 복 주시고
  alternatives_korean:
  - 축복하시고
  - 복을 내리시고
  lexicon: HALOT
  rationale: 히브리어 명령형을 하나님께 드리는 직접 청원으로 옮겨, 단순한 감정표현보다 실제적 복의 요청을 살렸습니다.
- source_word: יְהוָה / Yahweh
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기 사상과 POB 원칙에 따라 신명기 이름을 음역해 고유명을 보존했습니다.
- source_word: מָתְנַיִם / the loins
  english_pob_choice: the loins
  chosen_korean: 허리
  alternatives_korean:
  - 허리춤
  - 옆구리
  - 가랑이
  lexicon: HALOT
  rationale: 한국어에서는 ‘허리’가 힘과 중심부를 뜻하는 자연스러운 대응어이며, 원문의 신체 은유를 무리 없이 전달합니다.
- source_word: קָמָיו / those who rise against him
  english_pob_choice: those who rise against him
  chosen_korean: 그를 거슬러 일어나는 자들
  alternatives_korean:
  - 그의 대적들
  - 그를 치러 일어나는 자들
  lexicon: HALOT
  rationale: 동사 קום의 ‘일어나다’ 이미지를 살리면서, נגד/על의 대립 의미를 한국어 ‘거슬러’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 원문의 단수 대명사 ‘his/him’의 지시 대상
  chosen_reading: 가까운 문맥의 레위 지파를 가리키는 것으로 이해해 단수형 의미를 그대로 반영했습니다.
  alternative_readings:
  - 레위의 대표적 제사장 직분을 포괄적으로 가리킨다고 볼 수 있습니다.
  rationale: 앞뒤 문맥이 레위에 대한 축복이므로, 본문을 넓게 풀기보다 원문의 단수 지시를 유지하는 편이 더 정확합니다.
  doctrine_reference: 문맥상 지시 대상 유지 원칙
- issue: יאר의 요청문이 포함된 축복 기도체의 어조
  chosen_reading: 하나님께 드리는 간청형으로 ‘주십시오 / 치시고 / 하십시오’를 사용했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘복하십니다’처럼 옮길 수 있습니다.
  rationale: 히브리어 명령형/청원형의 기도적 긴장을 보존하기 위해 직접 청원체를 유지했습니다.
  doctrine_reference: 기도문 번역의 화행 보존
