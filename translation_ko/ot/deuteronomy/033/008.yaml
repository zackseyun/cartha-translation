reference: Deuteronomy 33:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/לֵוִ֣י אָמַ֔ר תֻּמֶּ֥י/ךָ וְ/אוּרֶ֖י/ךָ לְ/אִ֣ישׁ חֲסִידֶ֑/ךָ אֲשֶׁ֤ר נִסִּית/וֹ֙ בְּ/מַסָּ֔ה תְּרִיבֵ֖/הוּ עַל מֵ֥י מְרִיבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
  footnotes:
  - marker: a
    text: Or 'for your godly man' or 'for your loyal one.' The Hebrew expression can denote one marked by covenant loyalty.
    reason: lexical_alternative
  - marker: b
    text: Massah means 'testing,' and Meribah is associated with 'quarreling/contention' (see Exod 17:1–7; Num 20:1–13).
    reason: cross_reference
translation:
  language: ko
  text: 레위에 대해서는 이렇게 말씀하셨습니다. “주님의 둠밈과 우림은 주님의 신실한 이[a]에게 속합니다. 그분께서는 그를 맛사에서 시험하셨고[b], 므리바의 물에서 그와 다투셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 경건한 이’ 또는 ‘주님의 충성스러운 이’로도 옮길 수 있습니다. 히브리어 표현은 언약적 신실함을 지닌 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 맛사는 ‘시험’이라는 뜻이며, 므리바는 ‘다툼/분쟁’과 관련됩니다(출 17:1–7; 민 20:1–13 참조).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי / לְלֵוִי
  english_pob_choice: And of Levi
  chosen_korean: 레위에 대하여는
  alternatives_korean:
  - 레위에 관하여는
  - 레위에 대해서는
  - 레위에게는
  lexicon: WLC/HALOT
  rationale: 문맥상 레위 지파에 대한 축복 진술이므로, 히브리어 ל의 범위를 살려 ‘~에 대하여는’으로 자연스럽게 옮겼습니다.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  english_pob_choice: Your Thummim and your Urim
  chosen_korean: 당신의 둠밈과 우림
  alternatives_korean:
  - 당신의 둠밈과 우림들
  - 당신의 완전함과 빛
  - 당신의 둠밈과 당신의 우림
  lexicon: HALOT
  rationale: 두 항목은 제사장적 기술 용어이므로 음역을 유지했습니다. 순서는 히브리어와 영어 POB를 따라 ‘둠밈과 우림’으로 두었습니다.
- source_word: לְאִישׁ חֲסִידֶךָ
  english_pob_choice: your faithful one
  chosen_korean: 당신의 신실한 이
  alternatives_korean:
  - 당신의 경건한 사람
  - 당신의 충성스러운 이
  - 당신의 신실한 사람
  lexicon: HALOT
  rationale: חָסִיד는 언약적 신실함/경건함을 내포하므로 ‘신실한 이’가 의미를 가장 덜 좁히면서도 현대 한국어로 자연스럽습니다. 영어 POB의 개정 취지처럼 성별을 불필요하게 고정하지 않았습니다.
- source_word: בְּמַסָּה / עַל מֵי מְרִיבָה
  english_pob_choice: at Massah / at the waters of Meribah
  chosen_korean: 맛사에서 / 므리바의 물가에서
  alternatives_korean:
  - 맛사에서 / 므리바의 물에서
  - 시험에서 / 다툼의 물가에서
  - 맛사에서 / 므리바의 물에서
  lexicon: HALOT
  rationale: 두 지명은 사건-지명 결합을 보존하기 위해 음역했습니다. ‘물가에서’는 עַל מֵי의 장소성을 자연스럽게 전달하면서도 본문이 가리키는 사건을 유지합니다.
theological_decisions:
- issue: אֲשֶׁר נִסִּיתוֹ의 대상과 문맥적 지시
  chosen_reading: ‘그를 시험하셨고’로 옮겨, 레위와 관련된 대표적 인물을 특정하지 않고 본문의 모호성을 유지했습니다.
  alternative_readings:
  - 아론을 가리킴
  - 레위를 집합적으로 가리킴
  - 제사장적 대표자를 가리킴
  rationale: 히브리어 단수 표현은 여러 해석을 허용하므로, 영어 POB의 유보적 처리처럼 번역에서도 특정 인물로 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
