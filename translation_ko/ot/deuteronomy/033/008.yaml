- from: 레위에 대하여는 이렇게 말씀하셨습니다. "당신의 둠밈과 우림은 당신의 신실한 이에게 속합니다[a]. 당신께서는 그를 맛사에서 시험하셨고[b], 므리바의 물가에서 그와 다투셨습니다."
