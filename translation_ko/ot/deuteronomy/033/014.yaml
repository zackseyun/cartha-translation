    reason: lexical_alternative
  - marker: b
    text: ‘달마다’는 히브리어 יְרָחִים가 어원상 ‘달/월’과 연결되며, 달 주기로 반복되는 산물을 암시할 수 있음을 반영한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֶגֶד
  english_pob_choice: choicest
  chosen_korean: 가장 좋은
  alternatives_korean:
  - 귀한
  - 좋은
  - 가장 귀한
  lexicon: HALOT
  rationale: 문맥상 단순한 물건보다 ‘뛰어난 가치의 산물’이라는 뜻이어서, 한국어에서는 자연스럽고 평가적 뉘앙스가 살아 있는 ‘가장 좋은’으로 옮겼습니다.
- source_word: תְּבוּאֹת
  english_pob_choice: produce
  chosen_korean: 산물
  alternatives_korean:
  - 소출
  - 수확물
  - 생산물
  lexicon: HALOT
  rationale: 땅이 내는 넓은 범위의 산물을 가리키므로, 농작물로만 좁히지 않는 ‘산물’이 원문의 포괄성을 잘 살립니다.
- source_word: גֶּרֶשׁ
  english_pob_choice: yield
  chosen_korean: 소출
  alternatives_korean:
  - 산물
  - 열매
  - 생산
  lexicon: HALOT
  rationale: ‘달마다’와 평행을 이루는 반복적 생산의 뉘앙스를 살리기 위해, 농경적이면서도 자연스러운 ‘소출’을 선택했습니다.
- source_word: יְרָחִים
  english_pob_choice: the months
  chosen_korean: 달마다
  alternatives_korean:
  - 한 달 한 달
  - 달들
  - 월마다
  lexicon: HALOT
  rationale: 히브리어가 어원상 ‘달’과 연결되지만 실제로는 월별의 시간을 뜻하므로, 의미를 드러내는 관용적 표현인 ‘달마다’를 썼습니다.
theological_decisions:
- issue: ‘the sun’과 ‘the months’의 농경적-우주적 병렬을 어떻게 한국어로 살릴지
  chosen_reading: ‘해와 함께 … 달마다’로 옮겨, 햇빛과 월별 생산이라는 두 이미지를 모두 보이게 했습니다.
  alternative_readings:
  - ‘태양의 … 월들의 …’처럼 더 직역하는 방식
  - ‘해가 내는 … 달이 내는 …’처럼 의역하는 방식
  rationale: 원문은 농산물의 풍성함을 해와 달의 질서와 연결하는 시적 병렬이므로, 지나치게 해설적이지 않으면서도 자연스러운 한국어로 그 긴장을 유지했습니다.
  doctrine_reference: 창조 질서와 공급에 대한 시적 축복 표현
