  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
  footnotes:
  - marker: a
    text: Or, 'Moses commanded us a law, the inheritance of the assembly of Jacob.' The Hebrew syntax is compressed and may be read with 'inheritance' in close apposition to 'law.'
