base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
  footnotes:
  - marker: a
    text: Or, 'Moses commanded us a law, the inheritance of the assembly of Jacob.' The Hebrew syntax is compressed and may be read with 'inheritance' in close apposition to 'law.'
    reason: alternative_reading
  - marker: b
    text: '''Law'' may also be rendered ''instruction,'' and ''inheritance'' may also be rendered ''heritage'' or ''possession.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 우리에게 율법을 명하셨습니다. 그것은 야곱의 회중의 유산입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모세는 우리에게 율법을 명하셨습니다. 곧 야곱의 회중의 유산입니다.” 히브리어 문장은 압축되어 있으며, ‘유산’은 앞의 ‘율법’과 밀접한 동격 관계로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘율법’은 ‘가르침’으로도 옮길 수 있고, ‘유산’은 ‘기업’, ‘유업’, 또는 ‘소유’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 토라
  lexicon: HALOT
  rationale: 이 구절은 모세가 이스라엘에게 공적으로 주는 언약적 규범을 말하므로, 일반적인 ‘가르침’보다 ‘율법’이 원문의 공적·규범적 힘을 더 잘 살립니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령했으니
  alternatives_korean:
  - 명령했습니다
  - 주었습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: צוה의 기본 의미인 권위 있는 ‘명령’을 유지해야 하므로, 단순한 ‘주다’보다 ‘명령하다’ 계열이 더 정확합니다.
- source_word: מוֹרָשָׁה
  english_pob_choice: an inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속
  - 기업
  - 소유
  lexicon: HALOT
  rationale: מוֹרָשָׁה는 세습적으로 받아 소유하는 것을 뜻하므로 ‘유산’이 가장 자연스럽고, 영어 POB의 ‘inheritance’와도 잘 대응합니다.
- source_word: קְהִלַּת יַעֲקֹב
  english_pob_choice: the assembly of Jacob
  chosen_korean: 야곱의 회중
  alternatives_korean:
  - 야곱의 집회
  - 야곱의 공동체
  - 야곱의 회당
  lexicon: HALOT
  rationale: קְהִלָּה는 종교 제도보다 ‘모인 공동체’의 뜻이 강하므로, 전통적 교회 용어인 ‘회당’이나 제도적 뉘앙스의 ‘교회’보다 ‘회중’이 원문에 가깝습니다.
theological_decisions:
- issue: מוֹרָשָׁה의 문장 관계
  chosen_reading: ‘율법’과 ‘유산’을 병렬로 살려, 모세가 준 율법이 곧 야곱의 회중에게 주어진 유산이라는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘모세가 우리에게 율법을 명령했습니다. 그것은 야곱의 회중의 유산입니다.’
  - ‘모세가 우리에게 명령한 율법, 곧 야곱의 회중의 유산입니다.’
  rationale: 히브리어는 압축되어 있어 관계를 너무 단정하지 않는 것이 좋습니다. POB의 유보적 처리처럼, 율법과 유산 사이의 밀접한 연결을 유지하되 한국어에서는 자연스러운 서술로 풀었습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
