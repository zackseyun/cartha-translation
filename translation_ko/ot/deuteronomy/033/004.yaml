    text: 또는 “모세는 우리에게 율법을 명하셨습니다. 곧 야곱의 회중의 유산입니다.” 히브리어 문장은 압축되어 있으며, ‘유산’은 앞의 ‘율법’과 밀접한 동격 관계로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘율법’은 ‘가르침’으로도 옮길 수 있고, ‘유산’은 ‘기업’, ‘유업’, 또는 ‘소유’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision restores ‘우리에게’ for לָנוּ, avoids adding a causal relation, and represents מוֹרָשָׁה קְהִלַּת יַעֲקֹב as ‘the inheritance of Jacob’s assembly.’ The demonstrative ‘그것은’ makes the Korean grammatical while retaining the audit trail’s linked/appositional reading; footnote a records the compressed alternative rather than presenting it as certain.
