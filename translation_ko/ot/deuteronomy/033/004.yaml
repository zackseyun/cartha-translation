revisions:
- from: 모세가 우리를 위해 율법을 명령했으니, 야곱의 회중에게는 유산입니다.[a][b]
  to: 모세는 우리에게 율법을 명하셨습니다. 그것은 야곱의 회중의 유산입니다.[a][b]
  rationale: The revision restores ‘우리에게’ for לָנוּ, avoids adding a causal relation, and represents מוֹרָשָׁה קְהִלַּת יַעֲקֹב as ‘the inheritance of Jacob’s assembly.’ The demonstrative ‘그것은’ makes the Korean grammatical while retaining the audit trail’s linked/appositional reading; footnote a records the compressed alternative rather than presenting it as certain.
  reviewer_model: gpt-5.6-terra
