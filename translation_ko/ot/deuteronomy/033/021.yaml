  rationale: 본문의 ‘가장 좋은 몫’은 רֵאשִׁית가 영토 분배 문맥에서 가리키는 앞선·좋은 몫을 자연스럽게 반영합니다. מְחֹקֵק은 본문에서 ‘통치자’로 번역하고 각주에서 ‘율법을 세우는 이’ 및 모세로 보는 해석 가능성을 밝혀, 어느 한 해석을 본문에 강요하지 않았습니다. 마지막 절은 한국어의 자연스러운 서술을 위해 ‘판결들을 시행하다’로 다듬었습니다.
