id: DEU.33.21
reference: Deuteronomy 33:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
  footnotes:
  - marker: a
    text: Or 'the portion of the lawgiver was reserved.' The Hebrew term can mean 'ruler' or 'lawgiver,' and some take it as a reference to Moses.
    reason: alternative_reading
  - marker: b
    text: Or 'the justice of the LORD' or 'the righteous acts of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신을 위하여 가장 좋은 몫을 택하였으니, 거기에는 통치자의 몫이 보존되어 있었습니다[a]. 그는 백성의 우두머리들과 함께 나아와 야훼의 의를 행하고, 이스라엘과 함께 그분의 판결들을 시행하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법을 세우는 이의 몫’이라고 할 수 있습니다. 히브리어 מְחֹקֵק은 ‘통치자’ 또는 ‘율법을 세우는 이’를 뜻할 수 있으며, 일부는 이를 모세에 대한 언급으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼의 정의’ 혹은 ‘야훼의 의로운 행위’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא / רֵאשִׁית
  english_pob_choice: He chose the best land
  chosen_korean: 자신을 위해 가장 좋은 몫을 택하였으니
  alternatives_korean:
  - 처음 몫을 택하였으니
  - 첫 몫을 택하였으니
  - 가장 좋은 땅을 택하였으니
  lexicon: HALOT
  rationale: רֵאשִׁית는 여기서 시간적 ‘처음’보다 분배된 몫의 앞서고 좋은 부분을 가리키므로, 한국어에서는 ‘가장 좋은 몫’으로 자연스럽게 옮겼습니다.
- source_word: חֶלְקַת מְחֹקֵק
  english_pob_choice: the portion of the ruler
  chosen_korean: 율법을 세우는 이의 몫
  alternatives_korean:
  - 통치자의 몫
  - 율법사의 몫
  - 법을 세우는 이의 몫
  lexicon: HALOT
  rationale: מְחֹקֵק은 ‘율법을 세우는 자’ 또는 ‘통치자’를 뜻할 수 있으나, 문맥의 압축성과 POB의 주석상 긴장을 살려 직역에 가까운 ‘율법을 세우는 이’로 옮겼습니다.
- source_word: וַיֵּתֵא / רָאשֵׁי עָם
  english_pob_choice: He came with the heads of the people
  chosen_korean: 백성의 우두머리들과 함께 나아왔고
  alternatives_korean:
  - 백성의 지도자들과 함께 나아왔고
  - 백성의 머리들과 함께 나아왔고
  - 백성의 우두머리들과 함께 왔고
  lexicon: HALOT
  rationale: ‘heads of the people’의 비유적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘우두머리들’로 옮겼고, 동사는 출정/도착의 움직임을 드러내는 ‘나아왔고’로 처리했습니다.
- source_word: צִדְקַת יְהוָה
  english_pob_choice: the righteousness of Yahweh
  chosen_korean: 야훼의 의
  alternatives_korean:
  - 여호와의 의
  - 야훼의 정의
  - 야훼의 의로운 행위
  lexicon: HALOT
  rationale: יהוה는 본문 원문에 따라 ‘야훼’로 두었고, צִדְקַת는 여기서 언약적 기준에 따른 ‘의’로 옮기는 것이 가장 직접적입니다.
- source_word: וּמִשְׁפָּטָיו
  english_pob_choice: his judgments
  chosen_korean: 그분의 판단들
  alternatives_korean:
  - 그분의 판결들
  - 그분의 규례들
  - 그분의 심판들
  lexicon: HALOT
  rationale: מִשְׁפָּט는 문맥에 따라 ‘판단/판결/규례’가 가능하지만, 여기서는 하나님의 न्याय적 결정과 시행을 함께 드러내는 ‘판단들’이 가장 포괄적입니다.
theological_decisions:
- issue: מְחֹקֵק의 정체를 특정 인물로 한정할지 여부
  chosen_reading: ‘율법을 세우는 이’로 일반화하여, 모세를 단정하지 않고 해석상의 여지를 남겼습니다.
  alternative_readings:
  - 모세를 가리키는 ‘율법사/율법을 세우는 자’
  - ‘통치자’로 일반화
  rationale: 본문은 압축적이며 전통적으로 모세 또는 지도권을 가리키는 것으로 논의되어 왔으므로, 특정 인물 확정 대신 원문의 긴장을 보존했습니다.
  doctrine_reference: 해석학적 불확실성은 본문이 허용하는 범위 안에서 유지한다.
