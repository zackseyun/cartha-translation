  source_fidelity: ‘율법을 세우는 이’는 מְחֹקֵק의 가능한 뜻이지만, 원문의 압축성과 논쟁성을 본문에서 한쪽으로 기울게 합니다. 영어 POB의 기본 선택 및 문맥에 맞추어 ‘통치자’로 옮기고, ‘율법을 세우는 이’는 각주로 보존하는 편이 더 충실합니다. וּמִשְׁפָּטָיו의 복수는 ‘판결들’로 반영하되, 한국어에서는 ‘시행하다’와 결합하는 것이 자연스럽습니다.
  naturalness: 합쇼체는 일관되게 유지되어 있습니다. 다만 ‘판단들을 행하였습니다’는 한국어 결합이 다소 부자연스럽습니다. ‘판결들을 시행하였습니다’가 משפט의 사법적·규범적 뉘앙스와 문장 자연스러움을 함께 살립니다.
  terminology: יהוה는 초안의 원칙대로 ‘야훼’로 유지합니다. צִדְקַת는 ‘의’로, מִשְׁפָּטִים은 ‘판결들’로 옮깁니다. מְחֹקֵק의 ‘통치자/율법을 세우는 이’ 양의성을 본문과 각주로 각각 보존합니다.
