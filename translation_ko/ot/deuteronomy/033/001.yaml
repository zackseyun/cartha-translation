source:
  edition: WLC
  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'Now this is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel,' a standard collective expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 야훼께서 하나님의 사람 모세가 이스라엘 자손에게 그의 죽음 전에 복을 빌며 한 복입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת הַבְּרָכָה
  english_pob_choice: Now this is the blessing
  chosen_korean: 이것은 … 복입니다
  alternatives_korean:
  - 이제 이것은 … 복입니다
  - 그리고 이것은 … 복입니다
  lexicon: HALOT
  rationale: 문맥 전환을 알리는 여는 표현을 현대 한국어로 자연스럽게 살리되, 히브리어의 지시성을 유지하기 위해 ‘이것은’으로 시작했습니다. ‘복’은 본문의 공식적 축복 선언을 간결하게 담습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님 사람
  lexicon: HALOT
  rationale: 히브리어의 관용적 칭호를 직역하기보다, 한국어 성경에서 널리 인식되는 ‘하나님의 사람’으로 옮겨 예언자/신적 위임자의 호칭을 보존했습니다.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 영어 POB의 성별 표지를 그대로 따라가기보다, 한국어에서 관용적이면서도 집합적 의미를 분명히 하는 ‘이스라엘 자손’을 택했습니다. ‘백성’은 집합성은 살리지만 원문의 친족 표지를 약화합니다.
- source_word: לִפְנֵי מוֹתוֹ
  english_pob_choice: before his death
  chosen_korean: 그의 죽음 전에
  alternatives_korean:
  - 죽기 전에
  - 그가 죽기 전에
  lexicon: HALOT
  rationale: 히브리어의 명사구를 살린 시간 표현으로 옮겨, 서술의 마무리감을 유지했습니다. ‘그의 죽음 전에’는 문어적이면서도 직역성이 높습니다.
theological_decisions:
- issue: ‘sons of Israel’의 성별-표지 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 원문은 בני(아들들)라는 남성 복수를 사용하지만, 한국어에서는 이를 문자적으로 ‘아들들’로 풀면 오해가 커질 수 있습니다. ‘이스라엘 자손’은 집합적 의미와 족장-가계 표지를 함께 보존합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4 (Gender-accurate over gender-neutral)
