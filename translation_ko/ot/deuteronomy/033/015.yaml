  rationale: 이 절은 지형 묘사 자체보다 야훼의 복이 땅의 가장 오래되고 높은 곳에까지 미친다는 축복적 울림이 핵심이므로, 공간적 세부보다 시적·축복적 의미를 우선했습니다.
  doctrine_reference: 신 33:13-16의 축복 시편적 문맥
