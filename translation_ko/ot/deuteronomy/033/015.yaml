  lexicon: HALOT
  rationale: קֶדֶם은 여기서 방향의 ‘동쪽’보다 시간적 의미인 ‘옛/오래된’이 더 자연스럽고, עוֹלָם과의 병렬도 살릴 수 있습니다.
- source_word: מִמֶּגֶד
  english_pob_choice: from the abundance of
  chosen_korean: 풍성한 것에서
