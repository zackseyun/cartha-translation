    reason: lexical_alternative
  - marker: b
    text: ‘풍성한 것’은 히브리어 מִמֶּגֶד의 ‘귀한 산물/진귀한 소출’이라는 뉘앙스를 포괄적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  english_pob_choice: from the choicest things of
  chosen_korean: 가장 좋은 것에서
  alternatives_korean:
