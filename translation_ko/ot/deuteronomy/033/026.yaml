revisions:
- from: 야훼와 같은 이가 없습니다, 예슈룬이여. 그는 하늘 위를 타시며 당신을 도우시고, 그의 위엄으로 하늘을 덮으십니다.[a][b][c]
  to: 하나님과 같은 분은 없습니다, 여수룬이여.[a] 그분은 너를 도우시려고 하늘을 타시며, 그분의 위엄 가운데 창공을 타십니다.[b][c]
  rationale: 원문의 두 병행 행(‘하늘을 타시며’ / ‘창공을 타십니다’)을 회복하고, 원문에 없는 ‘덮으십니다’를 제거했습니다. אֵל은 ‘하나님’으로 번역하여 특정 신명을 본문에 추가하지 않았으며, 여수룬 문화 주석의 표지를 그 이름에 직접 연결했습니다.
