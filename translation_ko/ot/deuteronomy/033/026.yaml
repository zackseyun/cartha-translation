    reason: lexical_alternative
translation:
  language: ko
  text: 야훼와 같은 이가 없습니다, 예슈룬이여. 그는 하늘 위를 타시며 당신을 도우시고, 그의 위엄으로 하늘을 덮으십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 예슈룬은 이스라엘을 가리키는 시적 호칭입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 도움을 위해’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구름 사이를’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  english_pob_choice: There is none like God
  chosen_korean: 야훼와 같은 이가 없습니다
  alternatives_korean:
  - 하나님과 같은 이가 없습니다
  - 신과 같은 이는 없습니다
  lexicon: HALOT
  rationale: אַין + כָּאֵל의 비교 부정문을 자연스러운 한국어로 옮겼고, 본문 맥락상 ישראל의 하나님을 가리키므로 ‘야훼’로 구체화했습니다.
- source_word: יְשֻׁרוּן
  english_pob_choice: Jeshurun
  chosen_korean: 예슈룬
  alternatives_korean:
  - 이스라엘
  - 올곧은 자
  lexicon: HALOT
  rationale: 시적 호칭이므로 음역을 유지했습니다. 본문 주석 없이도 인물명처럼 읽히도록 현대 표기 ‘예슈룬’을 사용했습니다.
- source_word: רֹכֵב שָׁמַיִם
  english_pob_choice: who rides on the heavens
  chosen_korean: 하늘 위를 타시며
  alternatives_korean:
  - 하늘에 타고 계시며
  - 하늘을 타시며
  lexicon: HALOT
  rationale: ‘타다’는 직역을 유지하되, 한국어에서 자연스럽게 주어의 위엄 있는 이동을 드러내도록 ‘하늘 위를 타시며’로 다듬었습니다.
- source_word: בְעֶזְרֶךָ
  english_pob_choice: to help you / for your help
  chosen_korean: 당신을 도우시고
  alternatives_korean:
  - 당신을 돕기 위해
  - 당신의 도움을 위해
  lexicon: HALOT
  rationale: 전치사 ב + עֵזֶר는 목적/유익을 나타내므로, POB의 선택처럼 도움의 목적을 살려 동사구로 옮겼습니다.
- source_word: וּבְגַאֲוָתוֹ שְׁחָקִים
  english_pob_choice: and in his majesty on the skies
  chosen_korean: 그의 위엄으로 하늘을 덮으십니다
  alternatives_korean:
  - 그의 위엄으로 하늘 위에 계십니다
  - 그의 위엄으로 하늘에 계십니다
  lexicon: HALOT
  rationale: גַּאֲוָה는 하나님께 적용될 때 ‘위엄/존귀’의 뜻이 자연스럽고, שְׁחָקִים는 시적 병행을 살려 ‘하늘’로 번역했습니다. ‘덮으십니다’는 장엄한 광역성을 한국어로 자연스럽게 풀어낸 표현입니다.
theological_decisions:
- issue: אֵל의 지시 대상
  chosen_reading: 시적 비교에서 ישראל의 하나님을 가리키는 호칭으로 이해해 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 일반 명사 ‘하나님’
  - 고유명사 ‘엘’
  rationale: 본문 전체가 야훼의 유일성과 위엄을 찬양하므로, 단순 일반명사보다 본문에서 암시되는 언약적 주어를 드러내는 번역이 적절합니다.
  doctrine_reference: OT divine-name rendering policy; source-language primacy
