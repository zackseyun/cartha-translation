lexical_decisions:
- source_word: וּלְדָן
  english_pob_choice: And of Dan
  chosen_korean: 단에 대하여
  alternatives_korean:
  - 그리고 단에게
  - 단에 관하여
  lexicon: HALOT
  rationale: 지파 축복의 전환 공식이므로, 관계를 분명히 하되 한국어에서는 자연스러운 ‘대하여’를 택해 문맥의 공시성을 살렸습니다.
- source_word: גּוּר אַרְיֵה
  english_pob_choice: a lion’s cub
  chosen_korean: 사자 새끼
  alternatives_korean:
  - 어린 사자
  - 사자 새끼
  - 사자 새끼 한 마리
  lexicon: HALOT
  rationale: 히브리어 결합구는 어린 사자를 가리키며, ‘사자 새끼’가 의미와 이미지 둘 다를 가장 सीधे하게 살립니다.
- source_word: יְזַנֵּק
  english_pob_choice: he leaps out
  chosen_korean: 뛰쳐나옵니다
  alternatives_korean:
  - 튀어나옵니다
  - 솟구쳐 나옵니다
  - 도약합니다
  lexicon: HALOT
  rationale: 갑작스럽고 힘 있는 도약의 동작을 한국어 동사 하나로 옮기기 위해 ‘뛰쳐나옵니다’를 선택했습니다.
- source_word: מִן הַבָּשָׁן
  english_pob_choice: from Bashan
  chosen_korean: 바산에서
  alternatives_korean:
  - 바산으로부터
  - 바산에서부터
  lexicon: HALOT
  rationale: מן의 출처 의미를 표준적인 조사 표현으로 옮겼고, 고유지명 ‘바산’은 음역을 유지했습니다.
theological_decisions:
- issue: 지파 축복의 예언적 비유를 직역할지 완화할지
  chosen_reading: 사자 새끼와 도약 이미지를 그대로 유지해 단의 힘과 기민함을 드러내도록 했습니다.
  alternative_readings:
  - 의인화된 비유를 풀어 설명하기
  - ‘용맹하다’로 의미를 평문화하기
  rationale: 본문은 축복의 시적 비유이므로, 해석을 앞세우지 않고 이미지 자체를 보존하는 편이 מקור의 뜻을 더 잘 전달합니다.
  doctrine_reference: 창세기 49장과의 지파 축복 전통
