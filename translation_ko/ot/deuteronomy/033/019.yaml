  source_fidelity: 핵심 의미는 대체로 충실하지만, עַמִּים의 복수 집단성을 더 분명히 하고, 복수인 זִבְחֵי를 본문에 반영하는 편이 좋습니다. 또한 마지막 구절의 ‘빨다’라는 은유와 ‘모래에 감추어진 것들’의 모호성을 각각 각주로 보완해야 합니다.
