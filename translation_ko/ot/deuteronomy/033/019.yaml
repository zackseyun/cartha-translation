  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
  footnotes:
  - marker: a
    text: Or 'They will summon peoples to a mountain.' The Hebrew does not specify the mountain's identity.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'they will suck the abundance of the seas,' a metaphor for drawing sustenance or wealth from the sea.
    reason: lexical_alternative
  - marker: c
    text: Or 'the hidden things/hidden riches of the sand.' The phrase likely refers to resources associated with the seashore or sandy regions.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성들을 산으로 부를 것이며[a] 거기서 의로운 제사를 드릴 것이니[b] 이는 그들이 바다의 풍성한 것과 모래 속에 숨은 보물에서 빨아들이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산으로 여러 백성을 부를 것이다.’ 히브리어는 그 산의 정체를 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘의로운 제사들’을 드릴 것이다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘바다의 풍성함을 빨아들인다’는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 백성들
  alternatives_korean:
  - 민족들
  - 여러 백성들
  lexicon: HALOT
  rationale: 복수 עצם עַם의 집합적 대상을 자연스러운 현대 한국어로 옮기되, 여러 집단을 가리키는 의미를 살려 ‘백성들’로 번역했습니다.
- source_word: הַר
  english_pob_choice: the mountain
  chosen_korean: 산
  alternatives_korean:
  - 그 산
  - 어떤 산
  lexicon: HALOT
  rationale: 히브리어가 특정 산을 명시하지 않으므로 본문 자체의 모호성을 살려 일반적인 ‘산’으로 두었습니다.
- source_word: זִבְחֵי צֶדֶק
  english_pob_choice: righteous sacrifices
  chosen_korean: 의로운 제사
  alternatives_korean:
  - 의의 제사
  - 의로운 희생제물
  lexicon: HALOT
  rationale: צֶדֶק의 윤리적·예배적 성격을 살리되, 현대 한국어에서 더 자연스럽고 제의적 맥락이 분명한 ‘의로운 제사’로 옮겼습니다.
- source_word: יִינָקוּ
  english_pob_choice: will draw from
  chosen_korean: 빨아들이기 때문입니다
  alternatives_korean:
  - 끌어들이기 때문입니다
  - 빨아먹기 때문입니다
  lexicon: HALOT
  rationale: 동사의 직유적 이미지인 ‘빨다’를 살리면서도 한국어에서 어색하지 않게 ‘빨아들이기 때문입니다’로 처리해, 바다와 모래에서 자원을 얻는 은유를 보존했습니다.
theological_decisions:
- issue: 산의 정체성
  chosen_reading: 본문이 특정 산을 밝히지 않는 것으로 두고, 지명 해석을 본문 밖에서 확정하지 않았습니다.
  alternative_readings:
  - 시온 산
  - 어느 산당/성소
  - 그들의 산지
  rationale: 번역문에서 산의 정체를 명시하면 히브리어의 의도적 불특정성을 해치므로, 원문이 허용하는 범위 안에서만 번역했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 침묵하는 지점은 침묵을 유지합니다.
- issue: ‘의로운 제사’의 성격
  chosen_reading: 후대 교리 범주를 덧씌우지 않고, 언약적·예배적으로 합당한 제사로 남겼습니다.
  alternative_readings:
  - 의로 드리는 제사
  - 의롭게 드리는 제사
  rationale: צֶדֶק은 제사의 도덕적·예배적 적합성을 가리키므로, 이를 과도하게 신학화하지 않고 본문이 말하는 품질만 드러냈습니다.
  doctrine_reference: 의와 예배의 적합성은 유지하되, 해석은 최소화합니다.
