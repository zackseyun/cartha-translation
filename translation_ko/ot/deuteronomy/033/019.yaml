  terminology: ‘의로운 제사들’은 זִבְחֵי צֶדֶק의 복수와 예배적 성격을 무리 없이 반영합니다. עַמִּים은 개인들이 아니라 복수의 집단을 뜻하므로 ‘여러 민족’이 더 분명합니다.
