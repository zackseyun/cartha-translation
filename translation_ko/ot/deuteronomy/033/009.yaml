  naturalness: ‘아버지와 어머니에 대하여 말하기를’보다 ‘아버지와 어머니를 두고 …라고 말하였고’가 현대 표준 한국어의 문장 연결로 더 자연스럽습니다. 합쇼체 문체도 일관되게 유지했습니다.
  terminology: ‘말씀’과 ‘언약’은 적절합니다. ‘형제들’과 ‘아들들’은 원문의 남성 복수 친족어를 그대로 보존합니다. ‘보지 않았습니다’는 직역을 유지하고, 관계적 무시·외면의 가능성은 해당 위치의 각주에서만 제시합니다.
