  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
  footnotes:
  - marker: a
    text: Or, more literally, 'I have not seen him.' Here the sense is likely 'I have not regarded him' or 'taken notice of him' in the context of covenant loyalty over family ties.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지와 어머니에 대하여 말하기를, ‘나는 그를 보지 않았습니다’ 하였고, 그의 형제들을 인정하지 않았으며 그의 아들들을 알지 않았습니다. 그들은 주님의 말씀을 지켰고 주님의 언약을 지켰기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘보지 않았다’는 단순한 시각 부정보다 ‘인정하지 않았다/눈여겨보지 않았다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  english_pob_choice: who said
  chosen_korean: 말하기를
  alternatives_korean:
  - 말한
  - 말하는 이가
  lexicon: HALOT
  rationale: 분사구가 앞선 대상(레위)을 수식하므로, 한국어에서는 자연스러운 관형적/서술적 연결인 ‘말하기를’로 옮겼습니다.
- source_word: לְאָבִיו וּלְאִמּוֹ
  english_pob_choice: of his father and his mother
  chosen_korean: 그의 아버지와 어머니에 대하여
  alternatives_korean:
  - 그의 아버지와 어머니에게
  - 그의 아버지와 어머니를 두고
  lexicon: HALOT
  rationale: ל의 관계 표지를 한국어에서는 ‘-에 대하여’로 풀어, 뒤따르는 부정 진술의 방향을 분명히 했습니다.
- source_word: לֹא רְאִיתִיו
  english_pob_choice: I have not seen him
  chosen_korean: 나는 그를 보지 않았습니다
  alternatives_korean:
  - 나는 그를 눈여겨보지 않았습니다
  - 나는 그를 인정하지 않았습니다
  lexicon: HALOT
  rationale: 본문의 직접적 동사는 ‘보다’이므로 기본 의미를 살리되, 한국어에서는 부자연스러운 직역을 피하고 문맥상 강한 거리두기를 유지했습니다.
- source_word: שָׁמְרוּ אִמְרָתֶךָ
  english_pob_choice: they kept your word
  chosen_korean: 주님의 말씀을 지켰고
  alternatives_korean:
  - 당신의 말씀을 지켰고
  - 주님의 말을 지켰고
  lexicon: HALOT
  rationale: 직접 청자는 문맥상 하나님이므로 ‘주님’으로 옮겼고, אִמְרָה는 이 문맥에서 ‘말씀’이 가장 자연스럽습니다.
- source_word: וּבְרִיתְךָ יִנְצֹרוּ
  english_pob_choice: and guarded your covenant
  chosen_korean: 주님의 언약을 지켰기 때문입니다
  alternatives_korean:
  - 주님의 언약을 지켜서입니다
  - 주님의 언약을 보호했기 때문입니다
  lexicon: HALOT
  rationale: יִנְצֹרוּ의 ‘지키다/보호하다’ 의미를 살리되, 앞의 שׁמר와의 중복을 한국어에서 지나치게 분리하지 않고 자연스럽게 병렬했습니다.
theological_decisions:
- issue: 9절의 대명사와 주체가 레위 개인인지, 레위 지파 전체인지
  chosen_reading: 레위를 대표하는 단수 표현과 레위 지파를 가리키는 복수 이유절을 함께 살렸습니다.
  alternative_readings:
  - 레위 개인의 일화로만 읽기
  - 레위 지파의 집단적 충성을 평탄화하여 단수/복수 구분을 없애기
  rationale: 히브리어가 단수 상대절과 복수 이유절을 병행하므로, 한국어도 이를 매끄럽게 합쳐 버리지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, 문법적-신학적 긴장 보존
