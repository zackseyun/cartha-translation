id: DEU.33.5
reference: Deuteronomy 33:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
  footnotes:
  - marker: a
    text: Or, 'And the LORD became king in Jeshurun'; others understand, 'And he [Moses] became king in Jeshurun.' The Hebrew does not explicitly identify the subject.
    reason: alternative_reading
  - marker: b
    text: '''Jeshurun'' is a poetic name for Israel.'
    reason: cultural_note
  - marker: c
    text: Or, 'the heads of the people assembled together, the tribes of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성의 우두머리들과 이스라엘의 지파들이 함께 모였을 때, 그가 여수룬[a]에서 왕이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여수룬’은 이스라엘을 가리키는 시적 이름입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘여호와께서 여수룬에서 왕이셨습니다.’ 또는 ‘그[모세]가 여수룬에서 왕이었습니다.’ 히브리어는 주어를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And he was / became
  chosen_korean: 그가 …이었습니다
  alternatives_korean:
  - 그가 …이 되었습니다
  - 그가 …이었습니다
  lexicon: HALOT
  rationale: 서술 동사의 결과 상태를 자연스러운 합쇼체로 옮기되, 히브리어의 ‘왕 됨’ 진술을 과도하게 해석하지 않도록 단순한 과거 서술로 처리했습니다.
- source_word: בִישֻׁרוּן
  english_pob_choice: in Jeshurun
  chosen_korean: 여수룬에서
  alternatives_korean:
  - 여수룬 안에서
  - 여수룬 가운데
  lexicon: HALOT
  rationale: 여수룬은 이스라엘의 시적 명칭이므로 음역을 유지했고, 전치사 ב는 가장 सीधे한 장소 표지인 ‘-에서’로 옮겼습니다.
- source_word: רָאשֵׁי עָם
  english_pob_choice: the heads of the people
  chosen_korean: 백성의 우두머리들
  alternatives_korean:
  - 백성의 지도자들
  - 백성의 머리들
  lexicon: HALOT
  rationale: 직역의 ‘머리들’ 이미지는 살리되 한국어에서는 ‘우두머리들’이 관용적으로 통치·대표 집단을 잘 드러내므로 선택했습니다.
- source_word: יַחַד שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: the tribes of Israel as one
  chosen_korean: 이스라엘의 지파들이 하나가 되었습니다
  alternatives_korean:
  - 이스라엘의 지파들이 함께 있었습니다
  - 이스라엘의 지파들이 하나로 모였습니다
  lexicon: HALOT
  rationale: יַחַד의 연합·일치 뉘앙스를 살려, 단순 동시성을 넘는 ‘하나 됨’으로 옮겼습니다. 이는 지파들의 공동 결집을 강조하지만, 원문 이상의 정치적 상황을 덧붙이지는 않습니다.
theological_decisions:
- issue: ‘그가’와 ‘왕’의 지시 대상이 명시되지 않는 점
  chosen_reading: 원문의 주어 불명확성을 그대로 유지했습니다.
  alternative_readings:
  - 여호와께서 여수룬에서 왕이 되셨습니다
  - 모세가 여수룬에서 왕이 되었습니다
  rationale: 히브리어는 주어를 분명히 밝히지 않으므로, 해석을 단정하기보다 문장의 अस्पष्ट성을 보존했습니다. 이는 본문이 허용하는 범위 안에서 독자의 판단을 남겨 두는 처리입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: 지파들의 모임을 제도적 즉위식으로 구체화할지 여부
  chosen_reading: 단지 지도자들과 지파들의 연합된 집합으로 표현했습니다.
  alternative_readings:
  - 공적 즉위 장면
  - 언약적 총회 장면
  rationale: 문맥은 통합된 집회를 보여 주지만, 정치적·예전적 성격을 본문 이상으로 특정할 근거는 없습니다. 따라서 연합과 집합의 핵심만 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
