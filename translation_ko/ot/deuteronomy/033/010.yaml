  source_fidelity: 첫 병행구에서 יוֹרוּ(‘그들이 가르칠 것이다’)는 ‘주님의 규례들’과 ‘주님의 율법’ 모두에 걸립니다. 초안의 ‘율법을 전할 것입니다’도 넓게 가능하지만, 동사의 반복된 교육 기능을 흐리므로 ‘가르칠 것입니다’로 통일하는 편이 원문에 더 충실합니다. כָלִיל은 제단에서 온전히 태우는 제물을 가리키므로 ‘온전히 태워 드리는 번제’가 의미를 명료하게 보존합니다.
  naturalness: ‘향을 두고’와 ‘제물을 놓을 것입니다’는 현대 한국어 제의 문맥에서 다소 직역투입니다. ‘향을 드리고’와 ‘번제를 올릴 것입니다’가 자연스럽고, 합쇼체 문체에도 잘 맞습니다.
