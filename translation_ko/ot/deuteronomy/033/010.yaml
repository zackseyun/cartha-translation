  to: 그들은 야곱에게 주님의 규례들을 가르치고 이스라엘에게 주님의 율법[a]을 가르칠 것입니다. 그들은 주님 앞에[b] 향을 드리고 주님의 제단 위에 온전히 태워 드리는 번제를 올릴 것입니다.
