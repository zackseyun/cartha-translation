  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
  footnotes:
  - marker: a
    text: Or 'your instruction' for 'your law' (תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: Literally 'at your nose/nostril,' an anthropomorphic expression for incense presented before God.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 야곱에게 주님의 규례들을 가르치고 이스라엘에게 주님의 율법을 전할 것입니다. 그들은 주님 앞에 향을 두고, 주님의 제단 위에 온전히 불살라 드릴 제물을 놓을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’ 대신 ‘가르침’으로 옮길 수 있습니다(תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 코/콧구멍에’라는 뜻의 인체 비유로, 향을 하나님 앞에 드리는 제의적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  english_pob_choice: they will teach
  chosen_korean: 가르치고
  alternatives_korean:
  - 전하고
  - 교수하고
  lexicon: HALOT
  rationale: 히필형 ירה는 법적·제의적 문맥에서 ‘가르치다/지시하다’의 뜻이므로, 현대 한국어에서는 가장 자연스럽고 직접적인 ‘가르치고’로 옮겼습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 판단들
  - 주님의 법도들
  lexicon: HALOT
  rationale: 여기서는 언약 백성에게 전달되는 하나님의 법적 명령이라는 뜻이 강하므로, ‘판단들’보다 한국어 성경에서 익숙한 제의·법적 규범의 뉘앙스를 살린 ‘규례들’을 택했습니다.
- source_word: וְתוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 가르침
  - 주님의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה는 넓게는 ‘가르침’이 될 수 있지만, 본문 병행구에서 משפט과 짝을 이루는 언약 규범이므로 POB의 ‘law’를 따라 ‘율법’으로 옮겼습니다.
- source_word: קְטוֹרָה
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향로에 올리는 향
  - 향기로운 제물
  lexicon: HALOT
  rationale: 제의 문맥에서 קְטוֹרָה는 분향 재료를 가리키므로, 간결하고 표준적인 제의어인 ‘향’을 사용했습니다.
- source_word: בְּאַפֶּךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님의 코앞에
  - 주님의 콧구멍에
  lexicon: HALOT
  rationale: 직역하면 인체를 가리키는 비유지만, 제의적으로는 하나님 앞에 드리는 분향을 뜻하므로 한국어에서는 오해를 피하면서도 본래의 의례적 의미를 살려 ‘주님 앞에’로 옮겼습니다.
- source_word: כָלִיל
  english_pob_choice: whole burnt offering
  chosen_korean: 온전히 불살라 드릴 제물
  alternatives_korean:
  - 전번제
  - 온전한 번제
  lexicon: HALOT
  rationale: כָּלִיל은 전적으로 불사르는 제물을 뜻하므로, 독자가 의미를 바로 이해할 수 있도록 동작을 풀어 ‘온전히 불살라 드릴 제물’로 표현했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  rationale: 이 절의 히브리어 본문에는 יהוה가 직접 표기되어 있지 않고, 2인칭 대명사와 직접 호응하는 문맥상 번역어는 인용 대상이 아닌 화자-청자 관계를 자연스럽게 살리는 ‘주님’이 적절합니다.
  doctrine_reference: POB divine-name rendering policy
- issue: 제의적 ‘앞에’의 의미
  chosen_reading: 주님 앞에
  alternative_readings:
  - 주님의 코앞에
  - 주님의 콧구멍에
  rationale: 인간 신체를 가리키는 표현을 그대로 살리면 오히려 본문의 제의적 의미가 가려지므로, 하나님께 향이 드려지는 예배 행위를 드러내는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §6
