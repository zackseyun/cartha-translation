source:
  edition: WLC
  text: לְ/בִנְיָמִ֣ן אָמַ֔ר יְדִ֣יד יְהֹוָ֔ה יִשְׁכֹּ֥ן לָ/בֶ֖טַח עָלָ֑י/ו חֹפֵ֤ף עָלָי/ו֙ כָּל הַ/יּ֔וֹם וּ/בֵ֥ין כְּתֵיפָ֖י/ו שָׁכֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
  footnotes:
  - marker: a
    text: Or 'dwells securely beside him,' or 'dwells securely under him/over him'; the Hebrew preposition is compact and may express nearness or protective oversight.
    reason: lexical_alternative
  - marker: b
    text: Literally 'between his shoulders.' Some understand this figuratively of protective closeness; others take it topographically of Benjamin's hill country or the sanctuary located in Benjamin's territory.
    reason: alternative_reading
translation:
  language: ko
  text: 베냐민에 대하여는 이렇게 말했습니다. “야훼께 사랑받는 이는 그 곁에서 안전하게 거합니다[a]. 야훼께서 그를 온종일 감싸 보호하시며, 그는 그의 어깨 사이에 거합니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 아래에서/위에서 안전하게 거한다’로도 옮길 수 있습니다. 히브리어 전치사는 압축적이어서 가까이함이나 보호를 위한 위엄 있는 돌봄을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 어깨 사이에’입니다. 이를 보호받는 친밀함의 비유로 보기도 하고, 베냐민 지파의 산지 또는 그 지경에 있던 성소를 가리키는 지형적 표현으로 보기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  english_pob_choice: of Benjamin
  chosen_korean: 베냐민에 대하여
  alternatives_korean:
  - 베냐민에게
  - 베냐민에 관해
  lexicon: HALOT
  rationale: 지파별 축복 서문의 기능을 살려 한국어에서는 소속을 드러내는 ‘~에 대하여’로 자연스럽게 처리했습니다.
- source_word: יְדִיד יְהֹוָה
  english_pob_choice: the beloved of Yahweh
  chosen_korean: 야훼의 사랑을 받은 이
  alternatives_korean:
  - 야훼의 사랑하는 이
  - 야훼의 사랑을 입은 자
  lexicon: HALOT
  rationale: יְדִיד은 단순한 형용사보다 ‘사랑을 받은 자/이’의 관계를 강하게 띱니다. ‘사랑을 받은 이’로 옮겨 친밀성과 선택의 뉘앙스를 살렸습니다.
- source_word: לָבֶטַח
  english_pob_choice: in safety
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 안심하여
  lexicon: HALOT
  rationale: 보호 아래의 안정 상태를 현대 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: חֹפֵף עָלָיו כָּל הַיּוֹם
  english_pob_choice: he shields him all the day
  chosen_korean: 그가 그를 온종일 덮어 주시며
  alternatives_korean:
  - 그가 그를 온종일 보호하시며
  - 그가 그 위를 온종일 덮으시며
  lexicon: HALOT
  rationale: חֹפֵף의 보호적 ‘덮음’ 이미지를 유지하면서, 주어가 야훼임을 고려해 높임을 사용했습니다. ‘온종일’은 כָּל הַיּוֹם의 지속성을 살립니다.
- source_word: וּבֵין כְּתֵיפָיו
  english_pob_choice: between his shoulders
  chosen_korean: 그의 어깨 사이에
  alternatives_korean:
  - 그의 어깨들 사이에
  - 그 어깨 사이에
  lexicon: HALOT
  rationale: כתף의 직유적 이미지를 가능한 한 그대로 보존했습니다. 지형적 해석 가능성은 본문에 과도하게 반영하지 않고 주석 여지를 남겼습니다.
theological_decisions:
- issue: 야훼 이름과 보호 주어의 표기
  chosen_reading: 본문의 하나님의 이름은 ‘야훼’로 옮기고, 보호 행위의 주어도 야훼로 읽히도록 높임 표현을 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙대로 신명기는 텍스트상 드러나는 신적 고유명을 보존하는 것이 적절합니다. 한국 교회 관용어보다 स्रोत 직접성을 우선했습니다.
  doctrine_reference: Tetragrammaton transliteration policy
- issue: 마지막 절의 중의성
  chosen_reading: ‘그의 어깨 사이에 거합니다’로 직역 구조를 유지해, 인칭과 공간 관계의 중의성을 본문 수준에서 남겨 두었습니다.
  alternative_readings:
  - 베냐민이 그의 어깨 사이에 거한다
  - 야훼가 베냐민의 어깨 사이에 거하신다
  rationale: 히브리어의 압축된 표현은 보호의 친밀성인지, 지형적 언급인지 단정하기 어렵습니다. 본문에서 해소하지 않고 독자에게 남기는 것이 소스에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
