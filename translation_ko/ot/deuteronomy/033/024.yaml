id: DEU.33.24
reference: Deuteronomy 33:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/אָשֵׁ֣ר אָמַ֔ר בָּר֥וּךְ מִ/בָּנִ֖ים אָשֵׁ֑ר יְהִ֤י רְצוּי֙ אֶחָ֔י/ו וְ/טֹבֵ֥ל בַּ/שֶּׁ֖מֶן רַגְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
  footnotes:
  - marker: a
    text: Or “Blessed above sons is Asher.” The Hebrew comparison may be read as comparative or superlative.
    reason: lexical_alternative
  - marker: b
    text: “His brothers” likely refers to the other tribes of Israel.
    reason: cultural_note
  - marker: c
    text: The image “dip his foot in oil” likely conveys abundance or prosperity, but the Hebrew is left literal.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀에 대하여 말하였습니다. 「아셀은 아들들 가운데 가장 복이 많은 자입니다[a]. 그의 형제들에게서 호의를 얻기를 바라며[b], 그의 발이 기름에 잠기기를 바랍니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「아들들보다 더 복되다」. 히브리어의 비교 표현은 비교적 의미 또는 최상급 의미로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 「그의 형제들」은 문맥상 이스라엘의 다른 지파들을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 「발을 기름에 잠그다」는 풍요나 번영을 시사하는 이미지로 보이지만, 히브리어의 문자적 표현을 본문에서 그대로 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר
  english_pob_choice: And of Asher
  chosen_korean: 아셀에 대하여
  alternatives_korean:
  - 아셀을 두고
  - 아셀에 관하여
  lexicon: HALOT
  rationale: 문맥상 지파에 대한 축복 선언의 도입이므로 「대하여」가 가장 자연스럽고, 히브리어 전치사의 보고/진술 기능을 잘 드러냅니다.
- source_word: בָּרוּךְ מִבָּנִים
  english_pob_choice: Most blessed among sons
  chosen_korean: 아들들 가운데 가장 복이 많은 자입니다
  alternatives_korean:
  - 아들들보다 더 복되다
  - 아들들 가운데 복된 자입니다
  - 아들들 위에 복 받은 자입니다
  lexicon: HALOT
  rationale: 히브리어의 비교/최상급 뉘앙스를 살리면서도 한국어에서 「가장 복이 많은」으로 자연스럽게 옮겼습니다. 「아들들」은 원문 성별 표지를 보존합니다.
- source_word: רְצוּי אֶחָיו
  english_pob_choice: may he be favored by his brothers
  chosen_korean: 그의 형제들에게서 호의를 얻기를 바라며
  alternatives_korean:
  - 그의 형제들에게서 받아들여지기를 바라며
  - 그의 형제들에게서 사랑받기를 바라며
  - 그의 형제들에게 기쁨이 되기를 바라며
  lexicon: HALOT
  rationale: רְצוּי의 핵심은 ‘받아들여짐/호의로 여김’이므로 「호의를 얻다」로 옮겼습니다. 아셀의 ‘형제들’은 문맥상 이스라엘의 다른 지파들을 가리킵니다.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  english_pob_choice: and may he dip his foot in oil
  chosen_korean: 그의 발이 기름에 잠기기를 바랍니다
  alternatives_korean:
  - 그의 발을 기름에 담그기를 바랍니다
  - 그의 발이 기름 속에 잠기기를 바랍니다
  - 그의 발을 기름에 적시기를 바랍니다
  lexicon: HALOT
  rationale: POB처럼 비유를 과도하게 풀이하지 않고, 이미지의 풍성함을 살리기 위해 문자적 표현을 유지했습니다. 한국어에서는 동사와 목적어 관계를 자연스럽게 하기 위해 ‘발이…잠기다’로 다듬었습니다.
theological_decisions:
- issue: 기름에 발을 ‘잠그는’ 이미지의 처리
  chosen_reading: 주요 본문에서는 풍요와 번영을 암시하는 비유를 문자적으로 유지하고, 상징 해설은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 올리브 재배의 풍성함에 대한 직접적 언급
  - 안전, 사치, 번영에 대한 비유적 표현
  rationale: 히브리어의 시적 긴장과 생생한 이미지를 보존하는 것이 우선이므로, 본문에서 의미를 과잉 해석하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
