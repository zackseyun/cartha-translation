  rationale: 개정문은 מֵרִבְבֹת קֹדֶשׁ의 방향성(‘~로부터’)과 의미상의 불확실성을 보존하고, 원문에 없는 ‘만군’ 및 수행 존재의 특정화를 제거했습니다. אשדת의 전통적 본문 번역은 유지하되, 그 어휘적 불확실성과 대안은 해당 위치의 각주에서 밝혔습니다. 마지막 절은 한국어의 자연스러운 서술과 원문의 발출 이미지를 위해 ‘나왔습니다’로 다듬었습니다.
