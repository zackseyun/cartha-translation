source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
  footnotes:
  - marker: a
    text: Or 'from myriads of holy ones.' The Hebrew phrase may refer to holy attendants rather than abstract holiness.
    reason: alternative_reading
  - marker: b
    text: Hebrew אשדת is difficult and uncertain; traditionally rendered 'a fiery law,' but it may also denote fiery flashes or fire proceeding from his right hand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. “야훼께서 시내에서 오시고, 세일에서 그들에게 비치셨으며, 바란 산에서 빛나셨고, 거룩한 무리의 만군 가운데서 오셨으며, 그의 오른손에서 그들을 위한 불타는 율법이 있었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구절은 ‘거룩한 자들/거룩한 무리’ 또는 ‘거룩함’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אשדת는 뜻이 분명하지 않으며, 전통적으로는 ‘불타는 율법’으로 옮기지만 다른 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: —
  rationale: 원문의 고유명사이므로 주어를 ‘야훼’로 옮겨, 제목이 아닌 하나님의 이름이라는 점을 보존했습니다.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  english_pob_choice: and dawned from Seir upon them
  chosen_korean: 세일에서 그들에게 비치셨으며
  alternatives_korean:
  - 세일에서 그들에게 dawn하셨으며
  - 세일에서 그들 위에 빛나셨으며
  lexicon: —
  rationale: זָרַח의 빛/새벽 이미지를 살리되 한국어에서는 ‘비치시다’가 시적이면서도 자연스러워 선택했습니다.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  english_pob_choice: from myriads of holiness
  chosen_korean: 거룩한 무리의 만군 가운데서
  alternatives_korean:
  - 거룩함의 만군 가운데서
  - 거룩한 자들의 만군 가운데서
  lexicon: —
  rationale: 구절 자체가 애매하므로 ‘거룩한 무리’로 군중/수행체 이미지를 남기면서도, 문맥상 하늘의 수종자들을 연상시키는 복수성을 유지했습니다.
- source_word: אשדת
  english_pob_choice: a fiery law
  chosen_korean: 불타는 율법
  alternatives_korean:
  - 불의 율법
  - 불타는 법령
  - 불붙는 율법
  lexicon: —
  rationale: 난해어의 의미 불확실성을 완전히 해소하지 않고, 시내산 계시 문맥에 맞는 전통적 핵심 의미를 한국어로 옮겼습니다.
theological_decisions:
- issue: 시적 신현(theophany)에서 주어의 지칭
  chosen_reading: 문맥상 시내·세일·바란을 통해 오시는 언약의 하나님을 가리키므로, 번역문은 인격적 이름 ‘야훼’를 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 주어를 표지하는 읽기
  - 후대 기독론적 예표를 본문에 반영하는 읽기
  rationale: 모세의 축복문이라는 구약 본래의 역사-신학적 장면을 보존해야 하므로, 후대 해석을 본문어휘에 덧입히지 않았습니다.
  doctrine_reference: 구약 본문 우선 원칙; 번역 철학 1, 3
- issue: מֵרִבְבֹת קֹדֶשׁ의 의미
  chosen_reading: ‘거룩한 무리의 만군 가운데서’로 옮겨, 본문이 암시할 수 있는 하늘 존재들의 동반을 열어 두었습니다.
  alternative_readings:
  - ‘거룩함의 만군 가운데서’
  - ‘거룩한 자들의 만군 가운데서’
  rationale: 히브리어가 단일한 해석으로 고정되지 않으므로, 주석적 확정 대신 애매성을 본문에 남겼습니다.
  doctrine_reference: 번역 철학 3
