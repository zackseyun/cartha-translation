base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
  footnotes:
  - marker: a
    text: Or 'and may his men be numbered.' The Hebrew of the final clause is difficult and has also been understood as a prayer that Reuben not become insignificant or excluded from the tribal count.
    reason: alternative_reading
translation:
  language: ko
  text: 르우벤이 살고 죽지 않기를 바랍니다. 그의 사람들의 수가 적기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 사람들이 수에 들기를.’ 히브리어의 마지막 구절은 어렵습니다. 이는 르우벤이 미미해지거나 지파의 수에서 제외되지 않기를 비는 말로도 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  english_pob_choice: May ... live
  chosen_korean: 살고
  alternatives_korean:
  - 살기를
  - 생존하기를
  lexicon: HALOT
  rationale: 히브리어 생명 소망의 분사형/청유적 뉘앙스를 한국어에서 자연스러운 병렬 청유로 옮겼습니다.
- source_word: רְאוּבֵן
  english_pob_choice: Reuben
  chosen_korean: 르우벤
  alternatives_korean:
  - 루벤
  - 레우벤
  lexicon: 표준 외래어 표기
  rationale: 성경 인명은 현대 외래어 표기법에 따라 음역하되, 국내 교회 관용형도 고려 가능한 범위에서 르우벤을 택했습니다.
- source_word: מְתָיו
  english_pob_choice: his men
  chosen_korean: 그의 사람들이
  alternatives_korean:
  - 그의 남자들이
  - 그의 백성이
  lexicon: HALOT
  rationale: 어휘가 난해하여 POB의 'his men'에 대응하는 집단적 의미를 살렸습니다. 한국어에서는 직역형 '남자들'보다 문맥상 집단을 가리키는 '사람들'이 더 자연스럽습니다.
- source_word: מִסְפָּר
  english_pob_choice: few
  chosen_korean: 적기를
  alternatives_korean:
  - 적은 수이기를
  - 수효가 적기를
  - 셀 수 있기를
  lexicon: HALOT
  rationale: 마지막 절의 압축된 표현을 한국어에서는 '적다'의 청유형으로 풀어, 'few in number'라는 POB의 본문 의미를 간결하게 반영했습니다.
theological_decisions:
- issue: 마지막 구절 מְתָיו מִסְפָּר의 모호성
  chosen_reading: 본문은 르우벤의 존속을 빌되, 그 수가 적다는 현실적 축복으로 읽었습니다.
  alternative_readings:
  - '''그의 사람들이 번호로 기록되기를''이라는 인구조사/편제 의미'
  - '''그의 사람들이 적지 않기를''로의 완화된 역독'
  rationale: 마소라 본문의 문장이 매우 간결하고 해석이 갈립니다. POB의 본문 의미를 따라 과도한 해석을 피하면서도, 축복이 곧바로 번영만을 뜻하지 않는 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
