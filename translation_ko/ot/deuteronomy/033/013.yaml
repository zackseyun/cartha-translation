source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
  footnotes:
  - marker: a
    text: Or 'from the precious things of heaven.'
    reason: lexical_alternative
  - marker: b
    text: '''The deep'' likely refers to subterranean waters beneath the land.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 요셉에 관해서는 그가 말했습니다. 「야훼께서 그 땅을 복 주시기를 — 하늘의 가장 좋은 것들과 이슬과, 아래에 누운 깊은 곳에서 나오는 것들과 함께 — 」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיוֹסֵף
  english_pob_choice: And of Joseph
  chosen_korean: 그리고 요셉에 관해서는
  alternatives_korean:
  - 그리고 요셉에게
  - 그리고 요셉을 두고
  lexicon: HALOT
  rationale: 지파 축복의 도입부로서 ל+인명은 관계 대상이나 주제를 여는 표현이므로, 한국어에서는 ‘관해서는’이 문맥상 가장 자연스럽고 형식적입니다.
- source_word: מְבֹרֶכֶת
  english_pob_choice: Blessed ... be
  chosen_korean: 복 주시기를
  alternatives_korean:
  - 복되기를
  - 복을 받기를
  lexicon: HALOT
  rationale: 히브리어 분사형 축복 공식을 한국어의 기원형으로 옮겨, 선언적 상태보다 축복의 발화를 드러내도록 했습니다.
- source_word: מִמֶּגֶד שָׁמַיִם
  english_pob_choice: with the choicest gifts/things of heaven
  chosen_korean: 하늘의 가장 좋은 것들과
  alternatives_korean:
  - 하늘의 가장 귀한 것들과
  - 하늘의 좋은 것들과
  lexicon: HALOT
  rationale: מֶגֶד는 ‘귀한/좋은, 택함 받은 산물’의 뉘앙스이므로 ‘가장 좋은 것들’로 압축해 과잉 해석 없이 가치의 최상성을 살렸습니다.
- source_word: מִטָּל
  english_pob_choice: with dew
  chosen_korean: 이슬과
  alternatives_korean:
  - 이슬과 함께
  - 이슬로
  lexicon: HALOT
  rationale: 앞뒤의 병렬 열거를 따라 한국어에서는 간결하게 나열형으로 옮겨, 축복의 공급물 목록이라는 구조를 유지했습니다.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  english_pob_choice: and from the deep lying beneath
  chosen_korean: 아래에 누운 깊은 곳에서 나오는 것들과 함께
  alternatives_korean:
  - 아래에 누운 깊은 곳으로부터
  - 아래에 자리한 깊음에서
  lexicon: HALOT
  rationale: תְּהוֹם과 רֹבֶצֶת תָּחַת의 이미지를 살려, 단순한 지하수로 축소하지 않고 ‘아래에 누운 깊은 곳’으로 형상적 표현을 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 신학적 지시어가 아닌 고유한 언약 이름으로 보아, POB 기준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
