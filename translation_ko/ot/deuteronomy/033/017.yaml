- from: 그의 맏소는 위엄이 있고, 그의 뿔들은 들소의 뿔입니다. 그 뿔로 그는 여러 민족을 함께 뿔로 받아 땅 끝까지 치실 것입니다. 이것이 에브라임의 만만이고, 이것이 므낫세의 천천입니다.[a][b]
