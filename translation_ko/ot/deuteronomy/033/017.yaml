  rationale: 수컷 황소의 비유를 ‘맏황소’로 명확히 하고, 뿔로 공격한다는 동작을 자연스러운 현대 합쇼체로 옮겼습니다. 수량 표현은 원문의 복수 및 수적 대조를 유지하되 현대 독자에게 분명한 ‘수만/수천’으로 조정했습니다. רְאֵם의 동물학적 불확실성은 본문에서 단정하지 않고 역주에 보존했습니다.
