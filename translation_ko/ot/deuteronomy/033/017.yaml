  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
  footnotes:
  - marker: a
    text: Or 'the horns of a wild bull.' The Hebrew רְאֵם likely refers to a powerful wild bovine, traditionally rendered 'unicorn' in older English versions.
    reason: lexical_alternative
  - marker: b
    text: Or 'ten thousands of Ephraim.' The Hebrew רִבְבֹות denotes very large numbers and is contrasted with 'thousands of Manasseh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 맏황소에게는 위엄이 있고, 그 뿔은 들소의 뿔입니다. 그 뿔로 그는 여러 민족을 함께 땅 끝까지 들이받을 것입니다. 이들은 에브라임의 수만이며, 이들은 므낫세의 수천입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רְאֵם은 강한 야생 소 계열의 동물을 가리키는 말로 보입니다. 정확한 동물의 동일시는 확실하지 않으며, 전통적인 일부 번역은 이를 ‘유니콘’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רִבְבֹות은 문자적으로 ‘만들’, 곧 만 단위의 큰 수를 뜻하며, 뒤의 ‘수천’과 대조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹור שׁוֹרוֹ
  english_pob_choice: his firstborn bull
  chosen_korean: 그의 맏소
  alternatives_korean:
  - 그의 첫째 소
  - 그의 처음 난 황소
  lexicon: HALOT
  rationale: בְּכֹור는 ‘맏-’로, שׁוֹר는 소/황소 계열의 가축으로 옮기되, 시적 병행에서 자연스럽고 원문 이미지도 살리는 ‘맏소’가 가장 간결합니다.
- source_word: הָדָר לוֹ
  english_pob_choice: has majesty
  chosen_korean: 위엄이 있고
  alternatives_korean:
  - 장엄함이 있고
  - 위엄을 지니고
  lexicon: HALOT
  rationale: הָדָר는 명사적 ‘위엄/장엄’의 뜻이어서, 한국어에서는 서술형으로 풀어 ‘위엄이 있고’라고 옮기는 것이 자연스럽습니다.
- source_word: קַרְנֵי רְאֵם
  english_pob_choice: the horns of a wild ox
  chosen_korean: 들소의 뿔들
  alternatives_korean:
  - 야생 소의 뿔들
  - 들황소의 뿔들
  - 유니콘의 뿔들
  lexicon: HALOT
  rationale: רְאֵם은 전통적 ‘유니콘’보다 강한 야생 우제류를 가리키므로, POB의 판단을 따라 ‘들소’로 옮겨 역주 없이도 자연스럽고 덜 오해되는 표현을 택했습니다.
- source_word: יְנַגַּח
  english_pob_choice: he will gore
  chosen_korean: 뿔로 받아
  alternatives_korean:
  - 받아 들이받을
  - 뿔로 들이받아
  lexicon: HALOT
  rationale: נָגַח는 뿔로 받거나 들이받는 동작이므로, 한국어에서는 동물적 이미지를 살리면서도 문맥상 민족들을 향한 공격을 드러내는 ‘뿔로 받아’로 옮겼습니다.
- source_word: רִבְבֹות / אַלְפֵי
  english_pob_choice: myriads / thousands
  chosen_korean: 만만 / 천천
  alternatives_korean:
  - 무수한 무리 / 수천
  - 만의 무리 / 천의 무리
  lexicon: HALOT
  rationale: 두 수량 표현의 대조를 살리기 위해 관용적으로 ‘만만 / 천천’을 택했으며, 원문의 시적 병렬을 압축적으로 전달합니다.
theological_decisions:
- issue: 야생동물 이미지의 해석을 본문 안에서 어디까지 드러낼지
  chosen_reading: 맏소와 들소의 뿔 이미지를 보존해, 요셉의 힘과 에브라임·므낫세의 번성을 비유적으로 연결했습니다.
  alternative_readings:
  - 이미지를 완전히 평이한 ‘강한 소’로 완화할 수 있습니다.
  - ‘유니콘’ 같은 전통어를 유지할 수 있습니다.
  rationale: 본문은 동물적 힘의 비유를 통해 지파의 압도적 확장과 정복을 말하므로, 그 긴장과 생동감을 약화시키지 않는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 비유적 축복 문맥에서 원문의 수사적 힘을 유지합니다.
