  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
  footnotes:
  - marker: a
    text: Or 'Your enemies will submit deceitfully to you'; the Hebrew verb can suggest forced or feigned submission.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will tread on their heights/strongholds'; some understand 'their backs' here, but 'high places' is the more direct rendering of the Hebrew noun.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이여, 당신은 복되십니다! 야훼께 구원받은 백성인 당신과 같은 이가 누구겠습니까? 야훼는 당신을 돕는 방패이시며 당신의 위엄의 칼이십니다. 당신의 원수들은 당신에게 굴복하는 체할 것이며[a], 당신은 그들의 높은 곳들을 밟으실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 원수들이 당신에게 거짓으로 복종할 것입니다’; 히브리어 동사는 강요되거나 가장된 복종을 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 그들의 높은 곳들/요새를 밟을 것입니다’; 일부는 여기서 ‘그들의 등’을 뜻한다고 보기도 하지만, ‘높은 곳들’이 히브리어 명사의 더 직접적인 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복됩니다
  - 행복하십니다
  - 복되시옵니다
  lexicon: HALOT
  rationale: אַשְׁרֵי/אַשְׁרֶיךָ의 축복 선언을 현대 한국어에서 가장 자연스럽고 경건하게 살리기 위해 ‘복되십니다’를 택했습니다. ‘행복’은 정서적 느낌이 강하고, ‘복되시옵니다’는 지나치게 고어적입니다.
- source_word: עַם נוֹשַׁע בַּיהוָה
  english_pob_choice: a people saved by Yahweh
  chosen_korean: 야훼로 말미암아 구원받은 백성
  alternatives_korean:
  - 야훼에 의해 구원받은 백성
  - 야훼께 구원받은 백성
  - 야훼로 인해 구원된 백성
  lexicon: HALOT
  rationale: נוֹשַׁע의 수동적 의미를 살리면서 ‘by Yahweh’를 원인·행위 주체로 드러내기 위해 ‘야훼로 말미암아’로 옮겼습니다. ‘백성’은 집합 명사로서 문맥상 이스라엘 전체를 자연스럽게 담습니다.
- source_word: מָגֵן עֶזְרֶךָ וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  english_pob_choice: the shield of your help and the sword of your majesty
  chosen_korean: 당신의 도움의 방패이시며 당신의 위엄의 칼이십니다
  alternatives_korean:
  - 당신을 돕는 방패이시며 당신의 위엄의 칼이십니다
  - 당신의 도움의 방패와 당신의 위엄의 칼이십니다
  - 당신의 도움을 위한 방패이시며 당신의 위엄의 칼이십니다
  lexicon: HALOT
  rationale: 문법적으로 압축된 두 명사구를 한국어에서도 병렬적으로 살리되, 하나님을 주어로 분명히 보이게 하려면 서술형으로 풀어야 합니다. ‘גַּאֲוָה’는 부정적 ‘교만’보다 여기서는 영예·위엄의 뜻이 더 적절하므로 ‘위엄’으로 옮겼습니다.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  english_pob_choice: Your enemies will come cringing to you
  chosen_korean: 당신의 원수들이 당신 앞에서 굴복할 것이며
  alternatives_korean:
  - 당신의 원수들이 당신에게 아첨하며 굴복할 것이며
  - 당신의 원수들이 당신 앞에 굽신거릴 것이며
  - 당신의 원수들이 당신에게 굴복하는 체할 것이며
  lexicon: HALOT
  rationale: כחשׁ의 ‘거짓 복종/억지 복종’ 뉘앙스는 살리되, 현대 한국어에서 자연스럽고 품위 있게 표현하기 위해 ‘굴복하다’를 기본으로 하고 ‘앞에서’로 대상을 드러냈습니다. 영어 POB의 각주가 지적한 강제·가식적 복종의 긴장은 본문에는 과장되지 않게 유지했습니다.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  english_pob_choice: you will tread on their high places
  chosen_korean: 당신은 그들의 높은 곳들을 밟으실 것입니다
  alternatives_korean:
  - 당신은 그들의 산당들을 밟으실 것입니다
  - 당신은 그들의 높은 곳을 짓밟으실 것입니다
  - 당신은 그들의 높은 곳을 밟고 지나가실 것입니다
  lexicon: HALOT
  rationale: בָּמוֹת의 기본 의미를 따라 ‘높은 곳들’로 옮겨 지형적·군사적 이미지를 보존했습니다. ‘산당’은 종교적 의미를 강하게 불러올 수 있어 이 문맥에서는 과도합니다.
theological_decisions:
