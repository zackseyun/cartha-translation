  rationale: 시적 축복 선언을 현대 합쇼체로 유지하면서도, 이스라엘을 향한 경탄과 존귀를 함께 전달하도록 높임 표현을 사용했습니다.
  doctrine_reference: 'POB Korean style guide: modern formal-polite poetry'
