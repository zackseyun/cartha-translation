  - 주님
  rationale: 본문에 직접 나타난 신명 יְהוָה를 한국어에서 음역으로 드러내어, 명칭 자체가 가진 언약적·계시적 성격을 보존했습니다. 이는 전통적 대체어보다 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
