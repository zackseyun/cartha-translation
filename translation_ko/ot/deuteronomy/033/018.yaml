lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  english_pob_choice: And of Zebulun
  chosen_korean: 그리고 스불론에 대하여는
  alternatives_korean:
  - 그리고 스불론에게
  - 그리고 스불론에 관하여는
  lexicon: HALOT
  rationale: 히브리어 전치사 ל가 축복의 대상/주제를 여는 용법이므로, 한국어에서는 ‘-에 대하여는’으로 시작해 다음 지파 축복의 화제를 자연스럽게 드러냈습니다.
- source_word: שְׂמַח
  english_pob_choice: Rejoice
  chosen_korean: 기뻐하라
  alternatives_korean:
  - 즐거워하라
  - 환호하라
  lexicon: HALOT
  rationale: 명령형의 권면을 살리면서도 축복 문맥에 맞는 직접적인 동사로 옮겼습니다.
- source_word: בְּ/צֵאתֶךָ
  english_pob_choice: in your going out
  chosen_korean: 네가 나아갈 때에
  alternatives_korean:
  - 네가 나갈 때에
  - 네 출정에서
  - 네 활동하는 자리에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘나아감/나감’이지만, 문맥상 이동·출정·활동의 영역을 모두 포괄할 수 있어 ‘나아갈 때에’로 옮겨 원문의 이미지와 문맥적 범위를 함께 살렸습니다.
- source_word: בְּ/אֹהָלֶיךָ
  english_pob_choice: in your tents
  chosen_korean: 네 장막들 안에서
  alternatives_korean:
  - 네 장막들에서
  - 네 집 안에서
  - 네 장막에서
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘장막들’을 유지해 집합적·유목적 이미지를 보존했고, 평행구를 따라 장소성도 드러나게 했습니다.
theological_decisions:
- issue: 지파를 향한 축복문에서의 직설적 명령형
  chosen_reading: ‘기뻐하라’라는 명령형을 그대로 살려 축복의 선언적이고 권면적인 성격을 드러냈습니다.
  alternative_readings:
  - ‘기뻐할지어다’
  - ‘즐거워하라’
  rationale: 본문은 서술이 아니라 모세의 축복 발언이므로, 완곡하게 풀기보다 히브리어 명령의 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 신명기 33장의 축복 선언 구조
