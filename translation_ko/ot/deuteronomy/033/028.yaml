  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
  footnotes:
  - marker: a
    text: Or 'the eye of Jacob.' The Hebrew word can mean either 'eye' or 'spring/fountain'; the main text follows the sense that best fits the imagery of agricultural abundance.
    reason: lexical_alternative
  - marker: b
    text: Or 'dwelt securely, by itself.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 이스라엘은 안전하게 홀로[b] 살고, 야곱의 샘[a]은 곡식과 새 포도주의 땅에 있으며, 그의 하늘도 이슬을 떨어뜨립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 눈’. 히브리어 עֵין은 ‘눈’ 또는 ‘샘’을 뜻할 수 있습니다. 여기서는 곡식과 새 포도주의 땅이라는 풍요의 이미지에 맞추어 ‘샘’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘따로’. 히브리어 בָּדָד은 홀로 있음, 분리되어 있음의 뜻을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  english_pob_choice: lived
  chosen_korean: 살게 됩니다
