- source_word: עֵין יַעֲקֹב
  english_pob_choice: Jacob’s fountain
  chosen_korean: 야곱의 샘
  alternatives_korean:
  - 야곱의 눈
  - 야곱의 우물
  lexicon: HALOT
  rationale: עין이 '눈'과 '샘/근원'을 가질 수 있지만, 이어지는 비옥한 땅의 이미지에 맞추어 '샘'으로 옮겼습니다. 한국어에서는 '샘'이 시적·농경적 풍요를 가장 자연스럽게 드러냅니다.
- source_word: יַעַרְפוּ טָל
  english_pob_choice: dripped dew
  chosen_korean: 이슬을 쏟아 냅니다
  alternatives_korean:
  - 이슬을 떨어뜨립니다
  - 이슬이 뚝뚝 흐릅니다
  lexicon: HALOT
  rationale: ערף의 시적 의미인 '방울져 내리다/흘러내리다'를 살리되, 한국어 시어로는 '쏟아 내다'가 하늘의 풍성한 이슬 이미지를 가장 강하게 전달합니다.
theological_decisions:
- issue: בָּדָד의 의미 범위
  chosen_reading: '''홀로''를 고립이 아니라 안전한 구별의 상태로 읽었습니다.'
  alternative_readings:
  - 외따로
  - 따로
  rationale: 축복의 문맥상 부정적 고립이 아니라, 다른 민족들과 구별된 평안한 거주를 뜻합니다. 한국어 '홀로'는 그 긴장을 보존하면서도 축복의 안정감을 유지합니다.
  doctrine_reference: Translation philosophy §3
