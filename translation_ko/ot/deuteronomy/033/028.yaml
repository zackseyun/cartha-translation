  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
  footnotes:
  - marker: a
    text: Or 'the eye of Jacob.' The Hebrew word can mean either 'eye' or 'spring/fountain'; the main text follows the sense that best fits the imagery of agricultural abundance.
    reason: lexical_alternative
  - marker: b
    text: Or 'dwelt securely, by itself.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 이스라엘은 안전하게, 홀로 살게 됩니다[a]. 야곱의 샘은 곡식과 새 포도주의 땅에 있으며[b], 그의 하늘마저 이슬을 쏟아 냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 안전하게, 따로 살게 됩니다.’ 히브리어는 ‘안전하게’와 ‘홀로/따로’의 뉘앙스를 함께 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야곱의 눈이요, 곡식과 새 포도주의 땅에 있습니다.’ 여기서는 풍요의 이미지에 맞추어 ‘샘’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  english_pob_choice: lived
  chosen_korean: 살게 됩니다
  alternatives_korean:
  - 거주하게 됩니다
  - 거하게 됩니다
  lexicon: HALOT
  rationale: שׁכן의 거주 의미를 살리면서도 현대 합쇼체 문장으로 자연스럽게 옮겼습니다. '살다'가 POB의 'lived'와 가장 가까우며, 정착한 삶의 상태를 드러냅니다.
- source_word: בֶּטַח
  english_pob_choice: in safety
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 안심하고
  lexicon: HALOT
  rationale: 부사적 용법을 살려 이스라엘의 보호된 상태를 간결하게 표현했습니다. '안전하게'가 본문의 안정감과 축복의 뉘앙스를 잘 전달합니다.
- source_word: עֵין יַעֲקֹב
  english_pob_choice: Jacob’s fountain
  chosen_korean: 야곱의 샘
  alternatives_korean:
  - 야곱의 눈
  - 야곱의 우물
  lexicon: HALOT
  rationale: עין이 '눈'과 '샘/근원'을 가질 수 있지만, 이어지는 비옥한 땅의 이미지에 맞추어 '샘'으로 옮겼습니다. 한국어에서는 '샘'이 시적·농경적 풍요를 가장 자연스럽게 드러냅니다.
- source_word: יַעַרְפוּ טָל
  english_pob_choice: dripped dew
  chosen_korean: 이슬을 쏟아 냅니다
  alternatives_korean:
  - 이슬을 떨어뜨립니다
  - 이슬이 뚝뚝 흐릅니다
  lexicon: HALOT
  rationale: ערף의 시적 의미인 '방울져 내리다/흘러내리다'를 살리되, 한국어 시어로는 '쏟아 내다'가 하늘의 풍성한 이슬 이미지를 가장 강하게 전달합니다.
theological_decisions:
- issue: בָּדָד의 의미 범위
  chosen_reading: '''홀로''를 고립이 아니라 안전한 구별의 상태로 읽었습니다.'
  alternative_readings:
  - 외따로
  - 따로
  rationale: 축복의 문맥상 부정적 고립이 아니라, 다른 민족들과 구별된 평안한 거주를 뜻합니다. 한국어 '홀로'는 그 긴장을 보존하면서도 축복의 안정감을 유지합니다.
  doctrine_reference: Translation philosophy §3
