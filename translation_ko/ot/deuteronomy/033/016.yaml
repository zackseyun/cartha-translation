reference: Deuteronomy 33:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
  footnotes:
  - marker: a
    text: Or 'the goodwill of him who dwelt in the bush.' The Hebrew phrase alludes to God's appearance to Moses in the burning bush.
    reason: lexical_alternative
  - marker: b
    text: Or 'the prince among his brothers' or 'the consecrated one among his brothers.' The Hebrew נְזִיר emphasizes being set apart, and in Joseph's case may also imply preeminence.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 땅의 가장 좋은 것들과 그 충만함[a], 또 떨기나무 가운데 거하신 이의 호의가 — 그것이 요셉의 머리 위와, 그의 형제들 가운데서 구별된 이의 정수리 위에 임하기를.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떨기나무 가운데 거하신 이의 호의’입니다. 이 히브리어 구절은 떨기나무 가운데서 모세에게 나타나신 하나님의 사건을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּגֶד
  english_pob_choice: with the choicest things of
  chosen_korean: 가장 좋은 것들과
  alternatives_korean:
  - 땅의 좋은 것들과
  - 귀한 것들과
  lexicon: HALOT
  rationale: 축복의 맥락에서 מֶגֶד는 ‘좋은 것/귀한 산물’의 의미를 가지므로, ‘가장 좋은 것들’이 자연스럽고 축복의 풍성함을 살립니다.
- source_word: אֶרֶץ וּמְלֹאָהּ
  english_pob_choice: the earth and its fullness
  chosen_korean: 땅과 그 충만함
  alternatives_korean:
  - 세상과 그 충만함
  - 땅과 그것이 가득 찬 것
  lexicon: HALOT
  rationale: 시적 평행을 살리면서도 히브리어의 관용구를 직접 반영하기 위해 ‘땅과 그 충만함’으로 옮겼습니다.
- source_word: רְצוֹן שֹׁכְנִי סְנֶה
  english_pob_choice: the favor of the one who dwelt in the bush
  chosen_korean: 떨기나무 가운데 거하신 이의 호의
  alternatives_korean:
  - 떨기나무에 거하신 이의 은총
  - 가시덤불 속에 거하신 이의 호의
  lexicon: HALOT
  rationale: 출애굽기 3장의 가시떨기나무 현현을 가리키는 표현이므로, ‘떨기나무 가운데 거하신 이’로 직역에 가깝게 살리고 ‘호의’로 רְצוֹן의 의미를 담았습니다.
- source_word: נְזִיר אֶחָיו
  english_pob_choice: the one set apart from his brothers
  chosen_korean: 형제들 가운데서 구별된 이
  alternatives_korean:
  - 형제들 가운데서 세워진 이
  - 형제들 가운데서 거룩히 구별된 이
  - 형제들 가운데서 군림하는 이
  lexicon: HALOT
  rationale: נְזִיר은 기본적으로 ‘구별된/헌신된’ 뜻이므로, 전통적 신앙어보다 본래 의미가 드러나는 ‘구별된 이’로 옮겼습니다. 다만 문맥상 탁월함의 뉘앙스는 남겨 두었습니다.
theological_decisions:
- issue: ‘떨기나무 가운데 거하신 이’의 신학적 지시 대상
  chosen_reading: 출애굽기 3장의 떨기나무 현현을 가리키는 하나님에 대한 우회적 칭호로 보았습니다.
  alternative_readings:
  - 시내/호렙 전반의 신현을 가리키는 보다 일반적인 표현
  - 단순한 시적 수식어
  rationale: 문맥상 모세에게 나타나신 하나님의 사건을 분명히 환기하므로, 그 암시를 지우지 않고 그대로 보존하는 것이 원문 의도를 가장 잘 살립니다.
  doctrine_reference: 원문 우선 원칙에 따라, 본문이 암시하는 신현의 긴장을 번역에서 유지합니다.
