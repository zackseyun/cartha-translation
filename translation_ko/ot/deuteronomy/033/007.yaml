  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
  footnotes:
  - marker: a
    text: Or, 'May his hands be sufficient for him.' The Hebrew clause is difficult and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이것은 유다를 위해 그가 말한 것입니다. “야훼여, 유다의 소리를 들으시고 그의 백성에게 그를 데려가소서. 그의 손들이 그를 위하여 힘을 내게 하시고, 그의 대적들을 대적하는 도움이 되게 하소서.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손들이 그에게 충분하게 하시고’로도 옮길 수 있습니다. 히브리어 구절은 어렵고 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת / לִיהוּדָה
  english_pob_choice: And this he said for Judah
  chosen_korean: 그리고 이것은 유다를 위해 그가 말한 것입니다
  alternatives_korean:
  - 그리고 이것은 유다에 관하여 그가 말한 것입니다
  - 그리고 이것은 유다에게 그가 말한 것입니다
  lexicon: HALOT
  rationale: 도입 공식의 ‘And this he said’와 주제 표지 ‘for Judah’를 자연스러운 현대 한국어로 옮기되, 축복 진술의 초점을 유다에게 두었습니다.
- source_word: שְׁמַע יְהוָה
  english_pob_choice: Hear, Yahweh
  chosen_korean: 야훼여, 유다의 소리를 들으시고
  alternatives_korean:
  - 야훼여, 들으소서, 유다의 소리를
  - 야훼여, 유다의 소리를 들으소서
  lexicon: HALOT
  rationale: 직접 호소의 호격을 살려 ‘야훼여’로 두고, 명령형은 현대 경어체 ‘들으시고’로 풀어 한국어 기도문 어감을 유지했습니다.
- source_word: קוֹל יְהוּדָה
  english_pob_choice: the voice of Judah
  chosen_korean: 유다의 소리
  alternatives_korean:
  - 유다의 음성
  - 유다의 외침
  lexicon: HALOT
  rationale: קוֹל의 기본 의미를 따라 ‘소리’로 옮겨, ‘외침’처럼 의미를 좁히지 않고 원문의 이미지와 여지를 보존했습니다.
- source_word: יָדָיו רָב לוֹ
  english_pob_choice: Let his hands strive for him
  chosen_korean: 그의 손들이 그를 위하여 힘을 내게 하시고
  alternatives_korean:
  - 그의 손들이 그를 위하여 다투게 하시고
  - 그의 손들이 그를 위하여 변론하게 하시고
  - 그의 손들이 그를 위하여 충분하게 하시고
  lexicon: HALOT
  rationale: 이 난해한 절은 ‘다투다/겨루다’와 ‘충분하다’ 사이의 긴장을 그대로 두면서, 한국어로는 문맥상 자연스러운 ‘힘을 내다’로 옮겨 손의 활동성과 자력(自力)을 드러냈습니다.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  english_pob_choice: and be a help against his adversaries
  chosen_korean: 그의 대적들을 대적하는 도움이 되게 하소서
  alternatives_korean:
  - 그의 대적들에 맞서는 도움이 되게 하소서
  - 그의 원수들에게서 돕는 이가 되게 하소서
  lexicon: HALOT
  rationale: מִן의 대항/분리 뉘앙스를 살려 ‘대적들을 대적하는’으로 옮겨, 단순한 원조가 아니라 적대자에 맞서는 도움임을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 옮겨, 본문에 직접 나타난 신명법적 표지를 가렸습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 난해한 절 יָדָיו רָב לוֹ의 처리
  chosen_reading: 그의 손들이 그를 위하여 힘을 내게 하시고
  alternative_readings:
  - 그의 손들이 그를 위하여 다투게 하시고
  - 그의 손들이 그에게 충분하게 하시고
  rationale: 히브리어의 압축성과 해석의 긴장을 완전히 해소하지 않고, 전투적 맥락에 맞는 활동성은 살리되 본문의 모호성은 과도하게 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve textual tension where the Hebrew is difficult'
