  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
  footnotes:
  - marker: a
    text: Hebrew 'they sit down' is uncertain; the verb has also been understood as 'they were gathered,' 'they crouch,' or even 'they were struck down.'
    reason: alternative_reading
  - marker: b
    text: Or 'each takes up from your words' / 'bears your sayings'; the Hebrew expression is rare and difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 참으로 백성들을 사랑하십니다. 그의 모든 거룩한 이들이 주님의 손안에 있으며, 그들은 주님의 발아래에 앉아 있고, 각 사람은 주님의 말씀을 받아들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 뜻이 불확실하여 ‘앉아 있다’ 외에도 ‘모여 있다’, ‘웅크리다’, 심지어 ‘쓰러지다’로도 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘각 사람이 주님의 말씀에서 받아들인다’ / ‘주님의 말씀을 짊어진다’. 히브리어 표현이 드물고 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 과연
  - 실로
  - 또한
  lexicon: HALOT
  rationale: 문맥에서 אַף는 덧붙임보다 강조의 감탄사적 용법이므로, 한국어에서는 자연스럽게 ‘참으로’로 옮겨 원문의 강조를 살렸습니다.
- source_word: חֹבֵב
  english_pob_choice: loves
  chosen_korean: 사랑하십니다
  alternatives_korean:
  - 사랑합니다
  - 좋아하십니다
  - 아끼십니다
  lexicon: HALOT
  rationale: 분사형은 지속적 성향을 나타내므로 현재적 진술로 옮기되, 하나님의 대상에 대한 직접적인 사랑을 가장 분명하게 드러내는 ‘사랑하십니다’를 택했습니다.
- source_word: כָּל קְדֹשָׁיו
  english_pob_choice: all his holy ones
  chosen_korean: 그의 모든 거룩한 이들
  alternatives_korean:
  - 그의 모든 성도들
  - 그의 모든 성자들
  - 그의 모든 거룩한 자들
  lexicon: HALOT
  rationale: ‘holy ones’는 교회적 용어인 ‘성도’로 고정하기보다 형용사적 의미를 드러내는 ‘거룩한 이들’이 원문에 더 가깝고, 주석적 해석을 덜 앞세웁니다.
- source_word: תֻּכּוּ לְרַגְלֶךָ
  english_pob_choice: they sit down at your feet
  chosen_korean: 그들은 주님의 발아래에 앉아 있고
  alternatives_korean:
  - 그들은 주님의 발아래에 엎드려 있고
  - 그들은 주님의 발아래에 모여 있고
  - 그들은 주님의 발아래에 무릎 꿇고 있고
  lexicon: HALOT
  rationale: 동사의 뜻이 어렵지만, ‘발아래’와 함께 읽을 때 배움·복종의 자세를 나타내는 ‘앉아 있고’가 가장 자연스럽고, 다만 원문의 불확실성을 과도하게 단정하지 않도록 현재분사적 진행으로 처리했습니다.
- source_word: יִשָּׂא מִדַּבְּרֹתֶיךָ
  english_pob_choice: each receives your words
  chosen_korean: 각 사람은 주님의 말씀을 받아들입니다
  alternatives_korean:
  - 각 사람은 주님의 말씀을 받습니다
  - 각 사람은 주님의 말씀을 받아 올립니다
  - 각 사람은 주님의 말씀을 품습니다
  lexicon: HALOT
  rationale: 희귀한 표현은 ‘말씀’을 수동적으로 받는 뜻으로 이해될 수 있으므로, 한국어에서는 문맥상 가장 자연스러운 ‘받아들입니다’로 옮겨 수용의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 시적 인칭 전환 보존
  chosen_reading: ‘그는 … 사랑하십니다’와 ‘주님의 손안에/주님의 발아래/주님의 말씀’의 3인칭·2인칭 혼합을 그대로 살렸습니다.
  alternative_readings:
  - 모든 인칭을 3인칭으로 정리함
  - 모든 인칭을 2인칭으로 정리함
  rationale: 히브리어는 의도적으로 인칭을 오가며 축복의 시적 긴장을 형성하므로, 이를 평탄화하면 원문의 특징이 사라집니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘거룩한 이들’의 범주를 특정하지 않음
  chosen_reading: ‘거룩한 이들’로 유지해 천사/이스라엘/성도 중 하나로 미리 한정하지 않았습니다.
  alternative_readings:
  - 성도
  - 천사들
  - 이스라엘의 거룩한 백성
  rationale: 본문 자체가 범주를 단정하지 않으므로, 해석을 앞당기지 않는 번역이 원문 존중에 더 적합합니다.
  doctrine_reference: Translation philosophy §3
