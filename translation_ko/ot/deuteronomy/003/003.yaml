source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
  footnotes:
  - marker: a
    text: Or, more literally, 'until no survivor was left to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼 우리 하나님께서도 바산 왕 옥과 그의 온 백성을 우리 손에 넘겨 주셨습니다. 그래서 우리가 그를 쳐서 그에게는 남은 생존자가 하나도 없게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그에게 남은 생존자가 하나도 없을 때까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신명은 한국어에서도 보편적 대체칭호가 아니라 음역형으로 드러내는 것이 원문과 POB의 취지에 맞습니다.
- source_word: בְּיָדֵנוּ
  english_pob_choice: into our hand
  chosen_korean: 우리 손에 넘겨 주셨습니다
  alternatives_korean:
  - 우리 손에 주셨습니다
  - 우리 권세 아래 두셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서는 ‘넘겨 주셨습니다’가 군사적 인도·양도를 자연스럽고 분명하게 전달합니다.
- source_word: וַנַּכֵּהוּ
  english_pob_choice: we struck him down
  chosen_korean: 우리가 그를 쳐서
  alternatives_korean:
  - 우리가 그를 쳤습니다
  - 우리가 그를 무찔렀습니다
  lexicon: HALOT
  rationale: 전투 문맥의 נכה는 단순한 ‘패배’보다 물리적 타격을 유지하는 것이 원문 강도를 보존하므로 ‘쳐서’로 옮겼습니다.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  english_pob_choice: until he had no survivor left
  chosen_korean: 그에게는 남은 생존자가 하나도 없게 하였습니다
  alternatives_korean:
  - 그에게 남은 생존자가 하나도 없게 하였습니다
  - 그에게는 남겨진 자가 하나도 없게 하였습니다
  lexicon: HALOT
  rationale: 히브리어의 종결적 완전 소멸 표현을 현대 한국어로 자연스럽게 풀되, ‘생존자’로 남김의 범위를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 전쟁 행위와 인간의 행위 병치
  chosen_reading: 야훼께서 우리 손에 넘겨 주셨고, 우리가 그를 쳐서 멸했습니다.
  alternative_readings:
  - 하나님이 하셨으므로 인간 행위는 약화됨
  - 인간의 군사적 승리로만 읽음
  rationale: 본문은 신적 주권과 인간의 실제 행위를 함께 진술하므로, 둘 중 하나로 흡수하지 않고 그대로 병렬로 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
- issue: 멸절 표현의 강도
  chosen_reading: 남은 생존자가 하나도 없게 하였습니다
  alternative_readings:
  - 완전히 물리쳤습니다
  - 아무도 남지 않게 했습니다
  rationale: 본문의 טוטאַל한 전멸 의미를 약화하지 않기 위해, 완곡한 ‘패배’보다 잔존자 부재를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
