lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  english_pob_choice: And to Machir
  chosen_korean: 므낫세의 아들 마길에게
  alternatives_korean:
  - 마길에게
  - 그리고 마길에게
  lexicon: HALOT
  rationale: מָכִיר은 인명으로 음역하되, 본문 앞부분의 문맥상 마길이 므낫세와 연결된 인물임이 드러나므로 관계를 간단히 풀어 주었습니다. 접속사 וּ는 앞선 분배 진술과의 연결을 살려 ‘그리고’의 의미를 반영할 수 있지만, 한국어에서는 자연스러운 서술 흐름을 위해 생략했습니다.
- source_word: נָתַתִּי
  english_pob_choice: I gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 주었고
  - 내주었습니다
  lexicon: HALOT
  rationale: 완료형 נתן은 서술 과거의 ‘주었습니다’가 가장 자연스럽고 직접적입니다. 분배·할당의 문맥이지만, 영어 POB처럼 동사 자체의 기본 의미를 유지했습니다.
- source_word: הַ/גִּלְעָד
  english_pob_choice: Gilead
  chosen_korean: 길르앗
  alternatives_korean:
  - 길르앗 땅
  - 길르앗 지역
  - 그 길르앗
  lexicon: HALOT
  rationale: 지명으로서의 고유명사이므로 관용적인 성경 표기 ‘길르앗’을 사용했습니다. 히브리어 정관사는 한국어 지명에서는 보통 드러내지 않으므로 따로 번역하지 않았습니다.
theological_decisions:
- issue: 분배 진술의 화자와 시제
  chosen_reading: 모세의 회고적 진술로 이해하여 단순 과거형으로 옮겼습니다.
  alternative_readings:
  - 완료형 뉘앙스를 살려 ‘주었습니다’ 대신 ‘주었노라’ 식으로 고어화하는 읽기
  - 미래/선언적 의미를 강조해 ‘줄 것입니다’로 옮기는 읽기
  rationale: 히브리어 완료형과 문맥은 이미 이루어진 분배를 회고하는 진술로 읽히므로, 현대 한국어에서는 단순 과거가 가장 투명합니다.
  doctrine_reference: 신명기 3장 문맥의 역사 서술
