translation:
  language: ko
  text: 그때에 우리는 요단 건너편에 있던 아모리 사람들의 두 왕의 손에서 그 땅을 차지했습니다. 그 땅은 아르논 와디[a]에서 헤르몬 산까지 이릅니다.
  philosophy: optimal-equivalence
  footnotes:
