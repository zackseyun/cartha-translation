base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
  footnotes:
  - marker: a
    text: Or 'from the Arnon Valley' or 'from the Arnon River'; the Hebrew נחל can refer to a wadi, streambed, or valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 우리는 요단 건너편[a]에 있는 아모리 사람의 두 왕의 손에서 그 땅을 빼앗았습니다. 아르논 와디에서부터 헤르몬 산까지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단강 건너편에서’. 히브리어 בְּעֵבֶר הַיַּרְדֵּן은 ‘요단 건너편’이라는 지리 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  english_pob_choice: we took
  chosen_korean: 우리는 … 빼앗았습니다
  alternatives_korean:
  - 우리는 … 취했습니다
  - 우리는 … 차지했습니다
  lexicon: HALOT
  rationale: 문맥상 이스라엘이 땅을 점유하게 된 사건이므로 단순한 ‘취하다’보다 결과를 더 분명히 드러내는 ‘빼앗았습니다’를 택했습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: …의 손에서
  alternatives_korean:
  - …로부터
  - …의 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘손에서’로 옮겨 소유·지배의 뉘앙스를 유지했습니다.
- source_word: מִנַּחַל אַרְנֹן
  english_pob_choice: from the Wadi Arnon
  chosen_korean: 아르논 와디에서부터
  alternatives_korean:
  - 아르논 골짜기에서부터
  - 아르논 시내에서부터
  lexicon: HALOT
  rationale: נחל의 지리 용례를 반영해 ‘와디’를 사용했고, 고유명사는 음역해 지명감을 보존했습니다.
- source_word: עַד הַר חֶרְמוֹן
  english_pob_choice: as far as Mount Hermon
  chosen_korean: 헤르몬 산까지
  alternatives_korean:
  - 헤르몬 산에 이르기까지
  - 헤르몬 산으로부터
  lexicon: HALOT
  rationale: 영역의 경계를 나타내는 עַד의 범위를 한국어의 종결 경계 표현 ‘까지’로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 지리 표현의 역사적·서술적 성격
  chosen_reading: 본문을 전투적 점령 서술로 유지하되, 해석을 덧붙이지 않고 지명과 경계를 그대로 제시했습니다.
  alternative_readings:
  - 영토 수여의 의미를 더 강하게 풀어 쓰는 번역
  - 군사적 정복을 완화하는 번역
  rationale: 문맥이 이스라엘의 실제 점유를 말하지만, 히브리어 동사의 기본 의미와 서술 톤을 보존하는 것이 우선입니다.
  doctrine_reference: 민수기 21장 및 신명기 2–3장의 정복/점유 서술
