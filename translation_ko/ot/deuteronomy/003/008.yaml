  terminology: ‘요단’, ‘아모리 사람’, ‘아르논’, ‘헤르몬 산’은 적절합니다. נחל의 의미 범위를 반영하는 각주는 요단강 표현의 단순한 조사 차이보다 ‘와디’의 어휘 대안을 제시하는 것이 원문 및 영어 감사 기록에 더 충실합니다.
