  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
  footnotes:
  - marker: a
    text: Or 'Mount Hermon'; the Hebrew text here has simply 'Hermon.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form 'the Amorite' is collective here, hence 'the Amorites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시돈 사람들은 헤르몬을 시르욘이라 부르고, 아모리 사람들은 그것을 스니르라 부릅니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤르몬 산’; 여기의 히브리어 본문은 단순히 ‘헤르몬’이라고만 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 형태는 단수형처럼 보이지만 집합적으로 쓰였으므로, 한국어에서는 ‘아모리 사람들’로 옮겼습니다.
    reason: lexical_alternative
