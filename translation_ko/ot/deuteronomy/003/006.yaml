  - 우리가 ... 한 것과 같았습니다
  - 우리가 ... 했던 것과 같았습니다
  lexicon: HALOT
  rationale: 회상적 비교를 자연스러운 서술체로 옮기기 위해 과거 회상 뉘앙스를 살렸습니다.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  english_pob_choice: to Sihon king of Heshbon
  chosen_korean: 헤스본 왕 시혼에게
  alternatives_korean:
  - 헤스본 왕 시혼에게 대하여
  - 헤스본 왕 시혼에 대하여
  lexicon: HALOT
  rationale: ל의 목적어 표지를 한국어에서는 여격/대상 표지로 처리하는 것이 가장 자연스럽습니다.
- source_word: הַחֲרֵם
  english_pob_choice: utterly destroying
  chosen_korean: 철저히 진멸하였습니다
  alternatives_korean:
  - 완전히 진멸하였습니다
  - 철저히 멸하였습니다
  lexicon: HALOT
  rationale: 앞의 חרם를 반복적으로 강조하는 절대부정형으로, 한국어에서는 ‘철저히’가 완전성을 살리면서도 본문의 강도를 유지합니다.
- source_word: מְתִם
  english_pob_choice: men
  chosen_korean: 남자
  alternatives_korean:
  - 사람
  - 남성
  lexicon: HALOT
  rationale: 본문의 삼항열(남자/여자/어린아이들) 구조를 보존하기 위해 중성화하지 않고 성별 구분을 직접 드러냈습니다.
theological_decisions:
- issue: ḥerem(חרם) 전쟁 언어의 강도 유지
  chosen_reading: ‘진멸하다 / 철저히 진멸하다’로 두 번의 חרם를 각각 살려, 본문의 총체적 심판성을 약화시키지 않았습니다.
  alternative_readings:
  - ‘완전히 멸하다’
  - ‘저주 아래 두다’
  rationale: 본문은 단순한 패배가 아니라 성별·연령을 포함한 전면적 파괴를 말하므로, 완곡한 표현보다 स्रोत의 강도를 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
