  source_fidelity: 핵심 동사 חרם를 ‘진멸하다’로 옮긴 것은 전쟁 맥락에서의 전면적 파괴와 기술적 강도를 대체로 충실히 반영합니다. 그러나 각 성읍과 그 안의 남자·여자·어린아이를 함께 가리키는 히브리어의 범위를 더 명료하게 나타내는 편이 좋습니다. 또한 각주에 제시된 ‘저주 아래 두다’는 이 문맥의 חרם를 부정확하게 이해시킬 수 있습니다.
  naturalness: 초안의 ‘…진멸하였는데, 곧 … 같았습니다. 곧…’는 연결이 다소 부자연스럽고 ‘곧’의 반복이 원문의 단순 비교·설명 관계보다 강합니다. 한 문장 안에서 비교절과 결과를 자연스럽게 연결하도록 다듬었습니다.
  terminology: ‘진멸’은 חרם의 엄중하고 총체적인 의미를 보존하는 데 적절합니다. ‘헤스본 왕 시혼’도 고유명사와 칭호 처리에 문제가 없습니다. 각주는 ‘저주’가 아니라 ‘진멸에 바치다’ 및 ‘헤렘 아래 두다’라는 대안을 제시해야 합니다.
