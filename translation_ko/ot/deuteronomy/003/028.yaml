  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
  footnotes:
  - marker: a
    text: Or 'command Joshua' or 'charge Joshua.' The Hebrew verb can denote giving a formal charge; 'commission' highlights the official entrusting of leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'make him courageous.' The paired verbs 'strengthen' and 'encourage' render a common Hebrew exhortation to firmness and courage.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''he will give them the land as an inheritance.'' The Hebrew verb is causative: Joshua will be the agent through whom the people come to possess their inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여호수아에게 명하시고, 그를 강하게 하며 용기를 북돋우십시오. 그는 이 백성 앞에서 건너갈 것이며, 그가 당신이 보게 될 그 땅을 그들이 차지하게 할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명하시고’는 צוה의 공식적 위임 성격을 살린 번역입니다. 보다 직접적으로는 ‘명령하시고’ 또는 ‘맡기시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용기를 북돋우십시오’는 ‘강하게 하다/담대하게 하다’라는 쌍을 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들이 차지하게 할 것입니다’는 히필 동사 יַנְחִיל의 사역적 의미—곧 상속을 실제로 성취하게 하는 것—를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו
  english_pob_choice: commission
  chosen_korean: 명하시고
  alternatives_korean:
  - 맡기시고
  - 위임하시고
  - 명령하시고
  lexicon: HALOT
  rationale: 이 구절에서 צוה는 단순한 지시보다 여호수아에게 공식적인 책임을 부여하는 뜻이 강하므로, 한국어에서는 자연스럽게 ‘명하시고’로 옮겨 간결하게 처리했습니다.
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  english_pob_choice: strengthen him and encourage him
  chosen_korean: 그를 강하게 하며 용기를 북돋우십시오
  alternatives_korean:
  - 그를 굳세게 하며 담대하게 하십시오
  - 그를 강하게 하며 격려하십시오
  lexicon: HALOT
  rationale: חזק와 אמץ의 짝을 각각 살리되, 한국어에서 반복이 어색하지 않도록 ‘강하게 하다’와 ‘용기를 북돋우다’로 분리해 두 동사의 보완적 뉘앙스를 보존했습니다.
- source_word: לִפְנֵי הָעָם הַזֶּה
  english_pob_choice: before this people
  chosen_korean: 이 백성 앞에서
  alternatives_korean:
  - 이 백성 앞서
  - 이 백성보다 앞장서
  lexicon: HALOT
  rationale: לִפְנֵי는 공간적 ‘앞에’와 지도적 ‘앞서’를 함께 담을 수 있어, 한국어에서는 직역에 가깝지만 자연스러운 ‘앞에서’로 옮겨 지도자적 위치를 유지했습니다.
- source_word: וְהוּא יַנְחִיל אֹתָם אֶת הָאָרֶץ
  english_pob_choice: and he will cause them to inherit the land
  chosen_korean: 그가 그들이 차지하게 할 것입니다
  alternatives_korean:
  - 그가 그들에게 그 땅을 기업으로 얻게 할 것입니다
  - 그가 그들에게 그 땅을 유산으로 주게 할 것입니다
  lexicon: HALOT
  rationale: נחל의 히필은 ‘상속하게 하다/기업으로 얻게 하다’의 사역 의미이므로, 한국어에서는 결과 중심으로 자연스럽게 ‘차지하게 하다’로 옮겨 사역성을 드러냈습니다.
theological_decisions:
- issue: 모세가 직접 진입하지 못하는 땅을 ‘보게 될’ 정도로 제한된 허용을 어떻게 살릴지
  chosen_reading: ‘당신이 보게 될 그 땅’으로 옮겨, 모세에게 허락된 시각적 열람과 प्रवेश 불가의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - ‘당신이 볼 그 땅’
  - ‘당신이 바라보게 될 땅’
  rationale: 히브리어 יחס절은 모세가 그 땅을 보지만 들어가지는 못한다는 문맥을 전제하므로, 지나치게 완화하지 않고 미래형으로 유지하는 것이 본문 의도를 잘 보존합니다.
  doctrine_reference: 민수기 27:12-14; 신명기 34:1-4
- issue: 여호수아의 역할을 단순한 안내가 아니라 백성을 땅에 ‘들어가게 하는’ 지도자로 제시하는 점
  chosen_reading: ‘그들이 차지하게 할 것입니다’로 옮겨 여호수아가 상속의 집행자라는 사역적 의미를 드러냈습니다.
  alternative_readings:
  - ‘그들에게 그 땅을 줄 것입니다’
  - ‘그들이 그 땅을 상속받게 할 것입니다’
  rationale: 본문의 히필 동사는 여호수아가 유산을 실제로 분배·성취하게 하는 주체임을 강조하므로, 한국어에서도 그 능동성을 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 여호수아 1:6-9; 신명기 31:7-8
