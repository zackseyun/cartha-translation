  naturalness: ‘여호수아에게 임무를 맡기고, 그를 강하게 하고 용기를 북돋우십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 세 명령을 명료하게 연결합니다. 마지막 문장에는 ‘그 땅을’을 복원하여 문법성과 의미를 모두 갖추었습니다.
