  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 사방형 이름 יְהוָה를 한국어 기본값인 ‘야훼’로 옮겨, 호칭이 아니라 고유한 언약 이름이라는 점을 보존했습니다.
- source_word: בָּעֵת הַהִוא
  english_pob_choice: at that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시각에
  - 그 무렵에
  lexicon: HALOT
  rationale: 시간 부사는 문맥상 자연스러운 한국어인 ‘그때’로 간명하게 처리해 서술 흐름을 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀드렸습니다
  alternatives_korean:
  - 말했습니다
  - 이르기를
  lexicon: HALOT
  rationale: 직접 화법 도입부를 한국어 서술에 맞게 ‘말씀드렸습니다’로 풀어, 이어질 발화가 하나님께 드리는 말임을 분명히 했습니다.
theological_decisions:
- issue: 하나님께 드리는 발화의 존칭 표현
  chosen_reading: ‘말씀드렸습니다’로 격식을 유지하되, 본문 자체의 직접 청원성은 ‘간구하여’로 드러냈습니다.
  alternative_readings:
  - 말했습니다
  - 간청했습니다
  rationale: 모세의 하나님께 대한 직접 발화를 현대 합쇼체로 옮기면서도, 동사의 선택으로 경외와 간절함을 함께 보존했습니다.
