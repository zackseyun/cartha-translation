  lexicon: HALOT
  rationale: חנן의 히트파엘은 단순한 요청보다 은혜를 구하는 간절한 간구를 나타내므로, 현대 한국어에서 격식 있고 강한 뉘앙스를 살릴 수 있는 ‘간구하다’를 택했습니다.
- source_word: יְהוָה
