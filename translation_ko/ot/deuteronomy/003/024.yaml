source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
  footnotes:
  - marker: a
    text: Hebrew 'Adonai YHWH'; alternatively, 'O Lord Yahweh.' The main text uses 'Lord GOD' to avoid the awkward English sequence 'Lord LORD' while still distinguishing the two divine titles.
    reason: alternative_reading
translation:
  language: ko
  text: 주 야훼여[a], 주께서는 주의 종에게 주의 위대하심과 주의 강한 손을 보여 주기 시작하셨습니다. 하늘이나 땅에 주께서 하신 일들과 주의 위력 있는 행위들과 같은 일을 할 수 있는 어떤 신이 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: 아도나이 야훼(אַדֹנָי יהוה).'
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: O Lord Yahweh
  chosen_korean: 주 야훼여
  alternatives_korean:
  - 주 하나님이여
  - 주 여호와여
  lexicon: HALOT
  rationale: 아도나이와 YHWH가 함께 나온 호격으로, 경배적 호칭인 ‘주’와 고유명사 ‘야훼’를 함께 살려 두 칭호를 구분했습니다.
- source_word: הַחִלּוֹתָ
  english_pob_choice: you have begun
  chosen_korean: 주께서는 ... 보여 주기 시작하셨습니다
  alternatives_korean:
  - 보이기 시작하셨습니다
  - 보여 주셨습니다
  lexicon: HALOT
  rationale: 완료형의 시작-현재 관련성을 살려 ‘시작하셨습니다’로 옮겼고, 목적절의 동사구는 한국어에서 자연스럽게 ‘보여 주기 시작하셨습니다’로 풀었습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 하인
  lexicon: HALOT
  rationale: 하나님께 드리는 겸손한 자기 호칭이므로, 본문상 통상적인 ‘종’을 택했습니다.
- source_word: גָּדְלְךָ / יָדְךָ הַחֲזָקָה
  english_pob_choice: your greatness / your strong hand
  chosen_korean: 주의 위대하심과 주의 강한 손
  alternatives_korean:
  - 주의 크심과 주의 능한 손
  - 주의 위엄과 주의 강한 손
  lexicon: HALOT
  rationale: ‘위대하심’은 גָּדְלְךָ의 명사적 의미를 살리고, ‘강한 손’은 히브리어 관용구를 직역하여 하나님의 능력 행사를 드러냅니다.
- source_word: מִי אֵל ... אֲשֶׁר יַעֲשֶׂה
  english_pob_choice: what god is there ... who can do
  chosen_korean: 어떤 신이 있겠습니까? ... 할 수 있는
  alternatives_korean:
  - 누가 신이겠습니까? ... 할 수 있는
  - 어떤 신이 ... 할 수 있습니까
  lexicon: HALOT
  rationale: 수사적 질문의 대조를 살려 ‘어떤 신이 있겠습니까?’로 옮기고, 가능성의 뜻은 한국어 관용인 ‘할 수 있는’으로 표현했습니다.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  english_pob_choice: deeds like your deeds and mighty acts like yours
  chosen_korean: 주의 행하신 일들과 같은 일들 ... 주의 큰 능력과 같은 일
  alternatives_korean:
  - 주의 일들과 같은 일들 ... 주의 능력의 큰 일들
  - 주의 행적과 같은 행적들 ... 주의 능력과 같은 능력들
  lexicon: HALOT
  rationale: 평행법을 유지하되, 한국어에서는 ‘행하신 일들’과 ‘큰 능력’으로 자연스럽게 다듬어 반복을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 프로젝트의 기본 원칙에 따라 YHWH는 고유신명 ‘야훼’로 직접 옮겨, ‘주’와 구별되는 언약 이름을 드러냈습니다.
  doctrine_reference: '프로젝트 용어집: יהוה / YHWH 기본값'
- issue: 본문의 수사적 비교가 강조하는 유일신 신앙
  chosen_reading: 하늘이나 땅에 주와 견줄 신은 없다는 선언으로 유지
  alternative_readings:
  - 단순한 찬양 문구로 완화
  - 과장법으로 축소
  rationale: 본문은 하나님의 비교 불가능성을 선포하므로, 그 긴장을 약화하지 않고 그대로 한국어 수사문으로 살렸습니다.
  doctrine_reference: 신명기의 야훼 유일성 선포
