  source_fidelity: 본문의 두 비교구(‘주의 행하신 일들과 같은’ 및 ‘주의 위력 있는 행위들과 같은’)는 하나의 수사 의문문 안에서 함께 이어져야 합니다. 초안은 이를 두 개의 질문으로 나누어 두 번째 절에서 ‘주의 큰 능력’ 자체를 ‘할 수 있는’ 대상으로 만들어 히브리어 כִגְבוּרֹתֶיךָ(‘주의 위력 있는 행위들’)의 뜻을 바꾸었습니다.
