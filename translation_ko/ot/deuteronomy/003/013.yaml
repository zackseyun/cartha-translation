revisions:
- from: 그리고 길르앗의 나머지와 온 바산, 곧 옥의 왕국을 나는 므낫세 반 지파에게 주었습니다. 곧 아르곱의 온 지역, 즉 온 바산입니다. 그곳은 레바임의 땅이라고 불렸습니다.[a]
  to: 또 길르앗의 나머지와 온 바산, 곧 옥의 왕국은 내가 므낫세 반 지파에게 주었습니다. 아르곱 전 지역, 곧 온 바산은 르바임의 땅이라고 불립니다.[a]
  rationale: 원문의 분배 진술을 유지하면서, 아르곱과 바산에 관한 보충 구절을 ‘르바임의 땅’이라는 명칭 진술에 문법적으로 연결했습니다. רְפָאִים은 민족명으로 음역하고, 전통적 ‘거인들’ 해석은 각주에만 남겼습니다. 현재적·관습적 명칭을 나타내는 יִקָּרֵא는 ‘불립니다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
