  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the land of the giants.' 'Rephaim' is the Hebrew name of an ancient people associated with this region.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길르앗의 나머지와 온 바산, 곧 옥의 왕국을 나는 므낫세 반 지파에게 주었습니다. 곧 아르곱의 온 지역, 즉 온 바산입니다. 그곳은 레바임의 땅이라고 불렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘거인들의 땅’. ‘레바임’은 이 지역과 관련된 고대 민족의 히브리어 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  english_pob_choice: the rest of Gilead
  chosen_korean: 길르앗의 나머지
  alternatives_korean:
  - 길르앗의 나머지 부분
  - 남은 길르앗
  lexicon: HALOT
  rationale: 남겨진 몫이라는 뜻을 살리면서도 현대 한국어에서 자연스럽고 간결하게 표현했습니다.
- source_word: מַמְלֶכֶת עוֹג
  english_pob_choice: the kingdom of Og
  chosen_korean: 옥의 왕국
  alternatives_korean:
  - 옥의 나라
  - 옥이 다스리던 왕국
  lexicon: HALOT
  rationale: 지배 영역을 가리키는 직설적 표현을 유지해 정치적·지리적 의미를 분명하게 했습니다.
- source_word: חֶבֶל הָאַרְגֹּב
  english_pob_choice: all the region of Argob
  chosen_korean: 아르곱의 온 지역
  alternatives_korean:
  - 아르곱의 모든 구역
  - 아르곱의 온 영토
  lexicon: HALOT
  rationale: חֶבֶל을 문자적 ‘줄’이 아니라 지역 단위로 이해해, 본문의 지리적 용법을 반영했습니다.
- source_word: אֶרֶץ רְפָאִים
  english_pob_choice: the land of the Rephaim
  chosen_korean: 레바임의 땅
  alternatives_korean:
  - 르파임의 땅
  - 거인들의 땅
  lexicon: HALOT
  rationale: 본문의 고유명사적 용법을 따라 음역을 유지했습니다. 전통적 해석인 ‘거인들의 땅’은 본문에 없는 해석을 본문에 넣지 않기 위해 주석으로만 남기는 것이 적절합니다.
theological_decisions:
- issue: רְפָאִים을 본문에서 어떻게 이해할 것인가
  chosen_reading: 본문은 ‘레바임’이라는 민족/지명적 표지를 그대로 유지하고, 해석적 확장인 ‘거인들’은 본문에 넣지 않았습니다.
  alternative_readings:
  - 거인들의 땅
  - 르파임의 땅
  rationale: 히브리어 자체는 여기서 민족명/지명으로 기능하므로, 번역문에서는 원문의 범위를 넘지 않도록 했습니다.
  doctrine_reference: '원문 우선 원칙: 본문이 직접 말하는 것과 전통적 해석을 구분해 보존'
