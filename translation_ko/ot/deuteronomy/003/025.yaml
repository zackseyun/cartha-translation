base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
  footnotes:
  - marker: a
    text: Or 'this good mountain.' The Hebrew can refer either to a specific mountain or to the mountainous region west of the Jordan.
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 제가 건너가서 요단 강 건너편의 그 좋은 땅, 이 좋은 산지와 레바논을 보게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 좋은 산’. 히브리어는 특정한 산을 가리킬 수도 있고, 요단 서쪽의 산악 지대를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  english_pob_choice: Please let me cross over
  chosen_korean: 부디 제가 건너가서
  alternatives_korean:
  - 제가 건너가게 해 주십시오
  - 부디 건너가게 해 주십시오
  lexicon: HALOT
  rationale: 1인칭 청유형의 간청을 자연스러운 현대 한국어로 살려, 요청의 간절함을 '부디'와 '해 주십시오'로 옮겼습니다.
- source_word: הָאָרֶץ הַטּוֹבָה
  english_pob_choice: the good land
  chosen_korean: 그 좋은 땅
  alternatives_korean:
  - 그 좋은 땅덩어리
  - 그 복된 땅
  lexicon: HALOT
  rationale: אָרֶץ는 이 문맥에서 약속의 지역을 가리키므로 '땅'이 가장 직접적이며, '좋은'은 본문의 평가를 그대로 반영합니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 강 건너편의
  alternatives_korean:
  - 요단 강 건너의
  - 요단 강 저편의
  lexicon: HALOT
  rationale: '''בְּעֵבֶר''의 상대적 위치를 한국어의 관용적 표현인 ''건너편''으로 옮겨, 화자의 현재 위치 기준을 분명히 했습니다.'
- source_word: הָהָר הַטּוֹב הַזֶּה
  english_pob_choice: this good hill country
  chosen_korean: 이 좋은 산지
  alternatives_korean:
  - 이 좋은 산
  - 이 좋은 산악지대
  lexicon: HALOT
  rationale: הָהָר를 단일 산보다 산지 전체를 가리키는 집합적 표현으로 보고, POB의 해석을 따라 '산지'로 옮겼습니다.
theological_decisions:
- issue: הָהָר의 지리적 범위
  chosen_reading: '''이 좋은 산지''로 번역해 단일 산이 아니라 가나안의 산악 지역을 가리키는 뜻을 살렸습니다.'
  alternative_readings:
  - 이 좋은 산
  - 이 좋은 산악지대
  rationale: 문맥상 요단 너머의 땅, 레바논과 병렬로 놓인 표현이므로 특정 봉우리보다 광역 지형을 뜻하는 읽기가 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
