source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
  footnotes:
  - marker: a
    text: Or 'from Aroer, which is by the Wadi Arnon.' The Hebrew נחל can refer to a wadi, ravine, or valley.
    reason: lexical_alternative
  - marker: b
    text: Or 'half of Mount Gilead.' Here 'hill country of Gilead' is preferred because the Hebrew הַר often refers to a mountainous region in territorial descriptions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리는 이 땅을 차지했습니다. 곧 아르논 골짜기에 있는 아로엘에서부터 시작하여 길르앗 산지의 절반과 그 성읍들을 차지했으며, 나는 그것을 르우벤 사람들과 갓 사람들에게 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 와디, 협곡, 골짜기처럼 여러 지형을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하르(산)는 종종 단일 산이 아니라 산지 전체를 가리키므로, 여기서는 ‘산지’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  english_pob_choice: we took possession of
  chosen_korean: 차지했습니다
  alternatives_korean:
  - 소유했습니다
  - 점유했습니다
  - 차지하였습니다
  lexicon: HALOT
  rationale: 정복·분배 문맥의 ירשׁ은 단순한 ‘상속’보다 적극적인 ‘차지하다/점유하다’가 어울리며, 자연스러운 현대 한국어로는 ‘차지했습니다’가 가장 간명합니다.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  english_pob_choice: from Aroer, which is on the Valley of the Arnon
  chosen_korean: 아르논 골짜기에 있는 아로엘에서부터
  alternatives_korean:
  - 아르논 골짜기 곁에 있는 아로엘에서부터
  - 아르논 시내에 있는 아로엘에서부터
  lexicon: HALOT
  rationale: 아로엘은 음역하고, נחל을 지리적 맥락에 맞게 ‘골짜기’로 옮겼습니다. POB의 ‘from Aroer’는 출발점을 살리기 위해 ‘에서부터’로 반영했습니다.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  english_pob_choice: and half the hill country of Gilead
  chosen_korean: 길르앗 산지의 절반
  alternatives_korean:
  - 길르앗 산의 절반
  - 길르앗의 절반의 산지
  lexicon: HALOT
  rationale: הַר는 이곳에서 단일 산보다 산지/산악 지역을 가리키므로, 분배 문맥에 맞게 ‘산지’로 옮겼습니다.
- source_word: וְעָרָיו
  english_pob_choice: with its cities
  chosen_korean: 그 성읍들
  alternatives_korean:
  - 그 도시들
  - 그리고 그 성읍들
  lexicon: HALOT
  rationale: 지방 분할 서술에서는 대상 지역에 딸린 부속 도시들을 뜻하므로, 한국어에서는 ‘그 성읍들’이 가장 직접적입니다.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  english_pob_choice: to the Reubenites and the Gadites
  chosen_korean: 르우벤 사람들과 갓 사람들에게
  alternatives_korean:
  - 르우벤 지파와 갓 지파에게
  - 르우벤 사람들과 갓 사람들
  lexicon: HALOT
  rationale: 형태상 단수형이지만 집합적으로 지파 집단을 가리키므로, 한국어 성경의 관용을 따르되 ‘사람들’로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: 1인칭 복수에서 1인칭 단수로의 전환
  chosen_reading: “우리는 … 차지했습니다” 다음에 “나는 … 주었습니다”로, 모세가 공동체의 점유와 자신의 분배 행위를 구분해 말하는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - 둘 다 ‘우리는’으로 통일
  - 둘 다 간접화법으로 완화
  rationale: 본문의 인칭 전환은 문체적 우연이 아니라 서술상 의미가 있으므로 보존해야 합니다. 앞부분은 공동체의 점유, 뒷부분은 모세의 배분 권한을 드러냅니다.
  doctrine_reference: 민수기·신명기 분배 서술의 문맥상 역할 구분
