  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
  footnotes:
  - marker: a
    text: Or 'the plain' or 'the plateau' for 'the tableland.' The Hebrew term refers to the level upland region east of the Jordan.
    reason: lexical_alternative
  - marker: b
    text: Salecah is also spelled 'Salkah' in English transliteration.
    reason: alternative_reading
translation:
  language: ko
  text: 평지의 모든 성읍과 길르앗과 바산과 살르가와 에드레이까지, 곧 바산에 있는 옥의 왕국의 성읍들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַמִּישֹׁר는 문자적으로 ‘평지’이지만, 여기서는 요단 동편의 비교적 평탄한 고지대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 살르가는 영어 표기 Salecah의 대안 철자 Salkah로도 알려져 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל עָרֵי
  english_pob_choice: all the cities
  chosen_korean: 모든 성읍
  alternatives_korean:
  - 모든 도시
  - 모든 읍
  lexicon: HALOT
  rationale: 열거형 지명 목록에서 עָרִים는 통치·영토 맥락의 성읍으로 옮기는 것이 자연스럽고, 영어 POB의 'cities'와도 대응됩니다.
- source_word: הַמִּישֹׁר
  english_pob_choice: the tableland
  chosen_korean: 평지
  alternatives_korean:
  - 고원지대
  - 대지
  lexicon: HALOT
  rationale: 영어 POB는 본문 의미를 더 정확히 보존하기 위해 'plain' 대신 'tableland' 계열 의미를 유지하고 있으나, 한국어에서는 지형의 평탄한 고지대를 간결하게 드러내는 '평지'가 가장 읽기 쉽고 무난합니다.
- source_word: סַלְכָה
  english_pob_choice: Salecah
  chosen_korean: 살르가
  alternatives_korean:
  - 살레가
  - 살카
  lexicon: HALOT
  rationale: 고유지명은 음역하되, 한국어 음운에 맞춰 표기했습니다. 영어 POB의 각주처럼 대체 철자 가능성은 본문이 아니라 주석 단계에서 다루는 것이 적절합니다.
- source_word: אֶדְרֶעִי
  english_pob_choice: Edrei
  chosen_korean: 에드레이
  alternatives_korean:
  - 에드레
  - 에드르에이
  lexicon: HALOT
  rationale: 고유지명은 현대 외래어 표기 방식에 따라 음역했습니다.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  english_pob_choice: the cities of the kingdom of Og
  chosen_korean: 옥의 왕국의 성읍들
  alternatives_korean:
  - 옥의 나라의 성읍들
  - 옥의 왕도들
  lexicon: HALOT
  rationale: 히브리어의 소유·소속 관계를 직역해 '옥의 왕국의 성읍들'로 옮기되, 한국어 어순에 맞춰 뒤에 풀어 주었습니다. '왕국'은 영어 POB의 'kingdom'에 대응합니다.
- source_word: בַּבָּשָׁן
  english_pob_choice: in Bashan
  chosen_korean: 바산에 있는
  alternatives_korean:
  - 바산의
  - 바산에
  lexicon: HALOT
  rationale: 전치사 ב의 위치 의미를 살려 '바산에 있는'으로 처리해, 옥의 왕국이 바산 안에 있었다는 점을 분명히 했습니다.
theological_decisions:
- issue: 지형어 הַמִּישֹׁר의 한국어 처리
  chosen_reading: '''평지''로 번역해 본문의 영토 목록을 자연스럽게 유지했습니다.'
  alternative_readings:
  - 고원지대
  - 평원
  rationale: 영어 POB는 이 어휘의 지형적 특수성을 보존하려 했지만, 본절은 지형 설명보다 정복 영토의 범위를 나열하는 기능이 중심이므로 한국어에서는 과도한 설명 없이 '평지'가 가장 균형 잡힌 선택입니다.
  doctrine_reference: 지리·역사 서술의 직역 균형
