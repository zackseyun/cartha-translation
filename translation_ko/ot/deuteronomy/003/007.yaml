lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: But all
  chosen_korean: 그러나 …은
  alternatives_korean:
  - 그리고 …은
  - 또 …은
  lexicon: HALOT
  rationale: 문맥상 앞의 진멸 진술과 대비되는 전환이므로, 한국어에서는 ‘그러나’로 약한 역접을 살리고 ‘모든’의 포괄성을 함께 반영했습니다.
- source_word: הַ/בְּהֵמָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 떼
  - 짐승
  lexicon: HALOT
  rationale: 이 문맥의 בְּהֵמָה는 도시 주민의 가축을 가리키므로, 현대 한국어에서 자연스럽고 구체적인 ‘가축’으로 옮겼습니다.
- source_word: וּ/שְׁלַל הֶ/עָרִים
  english_pob_choice: and the spoil of the cities
  chosen_korean: 성읍들의 전리품
  alternatives_korean:
  - 성읍들의 노획물
  - 성읍에서 나온 전리품
  lexicon: HALOT
  rationale: שָׁלָל의 전쟁 약탈물 의미를 살려 ‘전리품’으로 옮기고, 속격 구조는 ‘성읍들의’로 직접 반영했습니다.
- source_word: בַּזּוֹנוּ לָֽ/נוּ
  english_pob_choice: we took as plunder for ourselves
  chosen_korean: 우리가 노략하여 우리 것을 삼았습니다
  alternatives_korean:
  - 우리가 전리품으로 취하였습니다
  - 우리가 약탈하여 우리 몫으로 삼았습니다
  lexicon: HALOT
  rationale: בזז의 ‘약탈하다/노략하다’ 의미를 살리되, 결과를 분명히 하기 위해 ‘우리 것을 삼았습니다’로 마무리했습니다.
theological_decisions:
- issue: 약탈 행위의 윤리적 완곡화 여부
  chosen_reading: 원문이 말하는 전쟁 전리품의 취득을 그대로 드러내기 위해 ‘전리품’, ‘노략’ 같은 직설적 표현을 유지했습니다.
  alternative_readings:
  - ‘가지게 되었습니다’처럼 완곡하게 표현
  - ‘획득했습니다’처럼 중립화
  rationale: 본문은 전쟁 문맥에서 얻은 전리품을 서술하므로, 의미를 약화시키는 중립적 표현보다 원문의 군사적 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Deuteronomy 3:7 literary-historical context
