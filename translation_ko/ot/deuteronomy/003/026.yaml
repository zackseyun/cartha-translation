  lexicon: HALOT
  rationale: 문맥상 모세가 백성 때문에 자신에게 임한 일이라고 설명하므로, 원인의 뉘앙스를 직접 드러냈습니다.
- source_word: וְלֹא שָׁמַע אֵלַי
  english_pob_choice: and did not listen to me
  chosen_korean: 내 말을 들으려 하지 않으셨습니다
  alternatives_korean:
  - 내 말을 듣지 않으셨습니다
  - 내 청을 들어주지 않으셨습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל의 ‘귀 기울여 듣다/들어주다’ 의미를 살리면서, 거절의 뉘앙스를 자연스럽게 반영했습니다.
- source_word: רַב לָךְ
  english_pob_choice: Enough from you
  chosen_korean: 너에게는 충분하다
  alternatives_korean:
  - 그만하면 되었다
  - 이제 그만해라
  lexicon: HALOT
  rationale: 히브리어 관용구의 급격한 중단·거절의 힘을 유지하되, 한국어 문장으로는 가장 직접적이고 공적 문체에 맞는 표현을 사용했습니다.
- source_word: אַל תּוֹסֶף דַּבֵּר … עוֹד
  english_pob_choice: do not speak to me again
  chosen_korean: 다시는 내게 말하지 마라
  alternatives_korean:
  - 더 이상 내게 말하지 마라
  - 이 일로는 다시 말하지 마라
  lexicon: HALOT
  rationale: ‘다시/더 이상’의 반복 금지 의미를 압축해 반영했고, 한국어 명령문으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 발화에 대한 한국어 존대 처리
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 인용 안의 금지 명령은 평서형 명령 ‘말하지 마라’로 옮겼습니다.
  alternative_readings:
  - 말하지 마십시오
  - 말하지 말라
  rationale: 본문의 거친 거절감을 보존하면서도 현대 표준어의 읽기 흐름을 해치지 않도록, 직설적 명령을 그대로 살렸습니다.
  doctrine_reference: Narrative speech register; source-direct force preservation
- issue: ‘진노’의 강도 보존
  chosen_reading: ‘진노하셨고’로 옮겨 신적 분노의 무게를 유지했습니다.
  alternative_readings:
  - 화를 내셨고
  - 분노하셨고
  rationale: 하나님의 감정 진술을 완화하지 않고, 본문의 심판적 긴장을 드러내기 위해 강한 어휘를 선택했습니다.
  doctrine_reference: Source-semantic preservation
