translation:
  language: ko
  text: 그러나 야훼께서는 여러분 때문에[a] 내게 진노하셨고 내 말을 듣지 않으셨습니다. 야훼께서 내게 말씀하셨습니다. “그만해라.[b] 이 일에 관하여 다시는 내게 말하지 마라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘여러분으로 말미암아’ 또는 ‘여러분을 위하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘네게 충분하다’이며, 여기서는 더 이상의 요청을 단호하게 거절하는 관용적 표현입니다.
    reason: lexical_alternative
