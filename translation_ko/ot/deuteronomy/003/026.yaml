  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
  footnotes:
  - marker: a
    text: Or 'for your sake' / 'on your account.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Enough for you,' an idiom of sharp dismissal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 여러분 때문이라고 하시며 내게 진노하셨고, 내 말을 들으려 하지 않으셨습니다. 야훼께서 내게 말씀하셨습니다. “너에게는 충분하다. 이 일에 관하여 다시는 내게 말하지 마라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러분 때문이라고’는 히브리어 לְמַעַנְכֶם의 원인적 의미를 드러낸 번역입니다.
    reason: source_note
  - marker: b
    text: ‘너에게는 충분하다’는 히브리어 רַב לָךְ의 직역에 가까운 표현으로, 단순한 ‘그만’보다 단호한 거절의 뉘앙스를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר יְהוָה בִּי
  english_pob_choice: Yahweh was angry with me
  chosen_korean: 야훼께서는 … 내게 진노하셨고
