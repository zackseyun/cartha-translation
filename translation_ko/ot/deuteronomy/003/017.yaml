source:
  edition: WLC
  text: וְ/הָֽ/עֲרָבָ֖ה וְ/הַ/יַּרְדֵּ֣ן וּ/גְבֻ֑ל מִ/כִּנֶּ֗רֶת וְ/עַ֨ד יָ֤ם הָֽ/עֲרָבָה֙ יָ֣ם הַ/מֶּ֔לַח תַּ֛חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּ֖ה מִזְרָֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
  footnotes:
  - marker: a
    text: Or 'from Chinnereth'; the Hebrew preserves the place-name in a form commonly transliterated either way.
    reason: lexical_alternative
  - marker: b
    text: That is, the Dead Sea.
    reason: alternative_reading
translation:
  language: ko
  text: 또 요단을 경계로 하는 아라바는 긴네렛에서부터 아라바의 바다, 곧 소금 바다까지, 비스가 산기슭 아래 동쪽까지였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘긴네렛’은 히브리어 지명의 음역입니다. ‘킨네렛’으로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 사해입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 평야
  - 열곡 평원
  lexicon: HALOT
  rationale: 문맥상 일반 명사 ‘평야’보다 지명으로 기능하는 ‘아라바’를 음역하는 것이 경계 설명의 지리적 고유성을 더 정확히 살립니다.
- source_word: וְהַיַּרְדֵּן
  english_pob_choice: the Jordan
  chosen_korean: 요단
  alternatives_korean:
  - 요르단 강
  - 요단강
  lexicon: HALOT
  rationale: 히브리어의 지명 표현을 한국 성경에서 널리 쓰는 ‘요단’으로 옮겨, 경계 목록의 간결함을 유지했습니다.
- source_word: מִכִּנֶּרֶת
  english_pob_choice: from Kinnereth
  chosen_korean: 긴네렛에서부터
  alternatives_korean:
  - 킨네렛에서부터
  - 긴네렛으로부터
  lexicon: HALOT
  rationale: 고유지명은 현대 음역 원칙에 따라 ‘긴네렛’으로 옮겼고, 출발점을 나타내는 מִ를 자연스럽게 살리기 위해 ‘-에서부터’를 붙였습니다.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  english_pob_choice: the Sea of the Arabah, the Salt Sea
  chosen_korean: 아라바의 바다, 곧 소금 바다
  alternatives_korean:
  - 아라바 바다, 소금 바다
  - 아라바의 바다, 곧 사해
  lexicon: HALOT
  rationale: 원문이 먼저 지리명을 말하고 이어 동격으로 ‘소금 바다’를 붙이므로, ‘곧’으로 설명적 동격을 표시해 두 표현의 관계를 드러냈습니다.
- source_word: אַשְׁדֹּת הַפִּסְגָּה
  english_pob_choice: the slopes of Pisgah
  chosen_korean: 비스가 산기슭 아래
  alternatives_korean:
  - 비스가의 비탈 아래
  - 비스가 경사 아래
  lexicon: HALOT
  rationale: אַשְׁדֹּת는 이 지형 문맥에서 산의 경사면/산기슭을 가리키므로, 자연스러운 한국어 지리 표현인 ‘산기슭 아래’로 옮겼습니다.
theological_decisions:
- issue: 지명 열거의 처리와 해석 개입 최소화
  chosen_reading: 본문의 경계 목록을 설명적으로 확장하지 않고, 지리적 고유명과 방향 관계만 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘사해’로 의역
  - ‘강’이나 ‘열곡’ 같은 지형 설명 추가
  rationale: 이 절은 신학적 논증보다 경계 기술이 핵심이므로, 원문에 없는 해석적 확장을 피하고 지명 자체의 기능을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 본문의 지리·역사적 정확성 및 절제된 번역 원칙
