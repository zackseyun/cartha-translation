translation:
  language: ko
  text: 그때 우리는 그의 모든 성읍을 점령했습니다. 우리가 그들에게서[a] 빼앗지 않은 성읍은 하나도 없었습니다. 곧 육십 성읍, 아르곱의 온 지역, 바산에 있는 옥의 왕국이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 단수인 옥이 아니라 옥의 백성이나 군대를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 포로로 잡았습니다
