  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא לָקַ֖חְנוּ מֵֽ/אִתָּ֑/ם שִׁשִּׁ֥ים עִיר֙ כָּל חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
  footnotes:
  - marker: a
    text: Hebrew 'from them,' likely referring to Og's people or forces, not Og alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 그때 그의 모든 성읍을 점령했습니다. 그들 가운데서 우리가 빼앗지 않은 성읍은 하나도 없었습니다. 곧 육십 성읍, 아르곱의 온 지역, 바산에 있는 옥의 왕국입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 옥 한 사람보다 옥의 백성이나 군세를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 포로로 잡았습니다
  - 사로잡았습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 전쟁 서술에서 לכד는 단순히 ‘가지다’보다 군사적으로 점거·함락시키는 뜻이 분명하므로, 현대 한국어의 자연스러운 전쟁어법인 ‘점령했습니다’로 옮겼습니다.
- source_word: כָּל עָרָיו / שִׁשִּׁים עִיר
  english_pob_choice: all his cities / sixty cities
  chosen_korean: 그의 모든 성읍 / 육십 성읍
  alternatives_korean:
  - 그의 모든 도시 / 육십 도시
  - 그의 모든 읍 / 육십 읍
  lexicon: HALOT
  rationale: עִיר/עָרָיו는 문맥상 도시 집합을 가리키므로 성경 문체에 맞는 ‘성읍’을 유지했습니다. 수사 ‘육십 성읍’도 같은 어휘를 맞춰 통일했습니다.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  english_pob_choice: there was not a city that we did not take from them
  chosen_korean: 그들 가운데서 우리가 빼앗지 않은 성읍은 하나도 없었습니다
  alternatives_korean:
  - 그들 가운데서 우리가 취하지 않은 성읍은 하나도 없었습니다
  - 우리가 그들에게서 빼앗지 않은 성읍은 하나도 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 이중 부정과 상대절을 한국어의 자연스러운 평서로 옮겼습니다. לָקַח는 여기서 ‘취하다’보다 정복 맥락의 ‘빼앗다’가 원문의 전리품/탈취 뉘앙스를 더 잘 드러냅니다.
- source_word: מֵאִתָּם
  english_pob_choice: from them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들로부터
  - 그들에게서
  lexicon: HALOT
  rationale: 영어 주석처럼 복수 대명사는 옥 한 사람보다 그의 백성이나 군세를 가리킬 가능성이 크므로, 관계를 분명히 하되 매끈하게 ‘그들 가운데서’로 풀었습니다.
- source_word: כָּל חֶבֶל אַרְגֹּב / מַמְלֶכֶת עוֹג בַּבָּשָׁן
  english_pob_choice: all the region of Argob / the kingdom of Og in Bashan
  chosen_korean: 아르곱의 온 지역, 바산에 있는 옥의 왕국
  alternatives_korean:
  - 아르곱의 모든 지역, 바산의 옥 왕국
  - 아르곱 온 지역, 바산에 있는 옥의 왕국
  lexicon: HALOT
  rationale: חֶבֶל은 ‘지역, 구역’의 뜻이므로 ‘온 지역’으로 넓이를 살렸습니다. 마지막 구는 두 명사구를 붙여, 앞의 지역이 바로 옥의 왕국임을 명확히 했습니다.
theological_decisions:
- issue: 전승된 지명·왕국 표현의 직역 정도
  chosen_reading: ‘바산에 있는 옥의 왕국’으로 직역해 지리·정치적 귀속 관계를 드러냈습니다.
  alternative_readings:
  - ‘바산의 옥 왕국’
  - ‘바산에 있던 옥의 나라’
  rationale: 본문은 단순한 소유 표시가 아니라 왕국의 소재지를 함께 제시하므로, 관계를 분명히 하는 쪽이 원문의 역사 서술 기능에 더 충실합니다.
  doctrine_reference: 역사 서술의 지리적·정치적 정확성
