revisions:
- from: 므낫세의 아들 야일은 아르곱의 온 지역을 차지하여, 그것을 길르시 사람의 경계와 마아가 사람의 경계까지 이르렀습니다. 그리고 그것을 자기 이름을 따라, 곧 바산을 ‘야일의 마을들’이라고 불렀는데, 그것이 오늘날까지 이릅니다.[a][b]
  to: 므낫세의 아들 야일은 아르곱의 온 지역, 곧 그술 사람과 마아갓 사람의 경계까지 이르는 곳을 차지했습니다. 그는 바산의 그것들을 자기 이름을 따라 하봇야일이라고 불렀으며, 그 이름은 오늘날까지 남아 있습니다.[a][b]
  rationale: 원문의 지리적 범위와 복수 목적어를 회복하고, 잘못된 지명 표기와 부자연스러운 종결 표현을 고쳤습니다. 논쟁적인 압축 구문은 본문에서 최소한으로 해석하되, 대안적 이해 가능성은 각주에 보존했습니다.
