  source_fidelity: 초안은 지리적 범위를 나타내는 구문을 ‘그것을 ... 경계까지 이르렀습니다’로 옮겨 야일의 행위와 지역의 범위를 혼동시키며, 히브리어의 남성 복수 목적어를 단수 ‘그것’으로 바꾸었습니다. 또한 ‘오늘날까지 이릅니다’는 명칭의 지속을 뜻하는 결말을 자연스럽게 전달하지 못합니다. 그술(גְּשׁוּר)과 마아갓(מַעֲכָה)의 지명도 바로잡아야 합니다.
  naturalness: 수정문은 ‘아르곱의 온 지역, 곧 … 경계까지 이르는 곳’을 야일이 차지했다는 구조를 분명히 하고, 명명 대상의 복수를 유지하면서도 현대 표준 한국어 합쇼체로 자연스럽게 읽히게 합니다.
  terminology: 고유명사는 야일, 므낫세, 아르곱, 그술, 마아갓, 바산으로 음역하고, 지명으로 기능하는 חַוֹּת יָאִיר는 본문에서 ‘하봇야일’로 보존합니다. 그 어휘적 의미는 각주에서 제시합니다.
  issues:
  - severity: high
    issue: 지리 범위 구문의 주어와 의미가 바뀜
    rationale: ‘그것을 길르시 사람의 경계와 마아가 사람의 경계까지 이르렀습니다’는 문법적으로 부자연스럽고, 야일이 무엇을 차지했는지와 아르곱 지역이 어디까지 이르는지를 혼동합니다. 원문은 아르곱의 온 지역이 두 집단의 경계까지 이른다는 범위를 나타냅니다.
