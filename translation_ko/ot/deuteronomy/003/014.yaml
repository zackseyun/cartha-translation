  lexicon: HALOT
  rationale: חֶבֶל은 이 지리 문맥에서 일정한 구역을 가리키므로, 현대 한국어에서 자연스러운 ‘지역’으로 옮겼습니다.
- source_word: עַד גְּב֥וּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  english_pob_choice: as far as the border of the Geshurites and the Maacathites
  chosen_korean: 길르시 사람의 경계와 마아가 사람의 경계까지
  alternatives_korean:
  - 그술 사람의 경계와 마아가 사람의 경계까지
  - 게술 사람과 마아가 사람의 경계까지
  lexicon: HALOT
  rationale: 민족명 형용사형을 사람-집단으로 옮기고, גבול은 ‘경계’로 번역해 경계선의 의미를 살렸습니다.
- source_word: וַיִּקְרָא אֹתָם עַל שְׁמוֹ
  english_pob_choice: he called them, that is, Bashan
  chosen_korean: 그것을 자기 이름을 따라
  alternatives_korean:
  - 그것들을 자기 이름을 따라
  - 자기 이름으로 그것들을 불렀습니다
  lexicon: HALOT
  rationale: 히브리어가 압축적이어서 ‘이름을 따르다’의 관용을 풀어, 명명 행위의 기준이 자기 이름임을 드러냈습니다.
- source_word: חַוֺּת יָאִיר
  english_pob_choice: Havvoth-jair
  chosen_korean: ‘야일의 마을들’
  alternatives_korean:
  - 하봇-야일
  - 야일의 촌락들
  lexicon: HALOT
  rationale: 고유 지명으로 남길 수 있지만, 본문 뜻이 ‘마을들/촌락들’로 이해될 수 있어 의미를 드러내는 번역을 본문에 두고, 필요한 경우 지명형은 대안으로 볼 수 있습니다.
theological_decisions:
- issue: 히브리어 압축 구문의 지시 관계
  chosen_reading: ‘그것을’이 가리키는 대상을 한국어에서는 앞의 지역 전체로 받아, 명명 행위가 영토와 정착지들에 대한 것임을 드러냈습니다.
  alternative_readings:
  - ‘그것들을’로 직역해 정착지들을 직접 가리키기
  - ‘그 지역을’로 단수화해 풀기
  rationale: 히브리어는 남성 복수 목적어와 뒤따르는 지시를 압축해 두었으므로, 한국어에서는 독자가 오해하지 않도록 문맥적 지시를 분명히 했습니다.
  doctrine_reference: 본문 해석상의 구문 처리
- issue: ‘바산’을 명명 대상에 포함시키는 구문
  chosen_reading: 영어 POB의 해석을 따라 ‘곧 바산을’로 삽입해, 본문이 바산 지역을 하봇-야일로 부른다는 점을 드러냈습니다.
  alternative_readings:
  - 삽입 없이 직역해 애매성을 남기기
  - ‘바산에 있는 야일의 마을들’로 풀기
  rationale: 히브리어의 생략·압축을 한국어에서 과도하게 모호하게 두지 않으면서도, 본문이 허용하는 범위를 넘지 않도록 절제해 반영했습니다.
  doctrine_reference: 본문의 통사적 모호성
