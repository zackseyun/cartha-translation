base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
  footnotes:
  - marker: a
    text: Or, more smoothly, 'all the kingdoms that you are crossing over to.' The Hebrew more literally says 'which you are crossing there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바로 그때 여호수아에게 명령하여 말했습니다. “너희 눈은 야훼 너희 하나님이 이 두 왕에게 행하신 모든 것을 보았습니다. 그러므로 야훼께서는 너희가 건너가고 있는 모든 왕국에도 그렇게 행하실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘너희가 건너가고 있는 모든 왕국들’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘네가 거기 건너가고 있는’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת יְהוֹשֻׁעַ צִוֵּיתִי
  english_pob_choice: And I commanded Joshua
  chosen_korean: 내가 바로 그때 여호수아에게 명령하여
  alternatives_korean:
  - 내가 여호수아에게 지시하여
  - 내가 여호수아에게 명하여
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 뜻하므로, 현대 한국어에서는 '명령하다'가 가장 직접적입니다. בָּעֵת הַהִוא의 시간감을 살려 '바로 그때'로 자연스럽게 옮겼습니다.
- source_word: עֵינֶיךָ הָרֹאֹת
  english_pob_choice: Your eyes have seen
  chosen_korean: 너희 눈은
  alternatives_korean:
  - 네 눈은
  - 너는 직접 보았다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '보는 너의 눈'이라는 강조 표현이므로, 한국어에서도 '너희 눈은'으로 증언의 직접성을 살렸습니다. 2인칭 단수 형태는 뒤의 문맥상 청중 전체를 향한 회상으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 여호와 너희 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 원문에 있는 신명은 본문 그대로 야훼로 옮겼고, אֱלֹהֵיכֶם은 표준적 단수 지시로서 '너희 하나님'으로 처리했습니다. English POB의 신명 선택을 한국어에서도 반영했습니다.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  english_pob_choice: through which you are passing
  chosen_korean: 너희가 건너가고 있는 모든 왕국에도
  alternatives_korean:
  - 너희가 그리로 건너가고 있는 모든 왕국에도
  - 너희가 지나가고 있는 모든 왕국에도
  lexicon: HALOT
  rationale: עֹבֵר שָׁמָּה는 이동 중인 상태를 가리키며, POB의 'through which you are passing'에 맞춰 한국어에서는 '건너가고 있는'으로 옮겼습니다. 지리적 흐름과 출애굽-정복 서사를 함께 드러냅니다.
theological_decisions:
- issue: יְהוָה의 표기와 발화 인용문 안의 직설성
  chosen_reading: 야훼를 본문에 직접 표기하고, 인용문은 여호수아에게 주어지는 하나님의 약속을 그대로 살렸습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 야훼의 이름과 그분의 행동을 평행으로 제시하므로, 공적 독자에게도 신명성과 약속의 대응이 드러나도록 직접 표기하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
