revisions:
- from: 그때 내가 여러분에게 명령하며 말했습니다. “야훼 여러분의 하나님께서 여러분에게 이 땅을 주셔서 소유하게 하셨습니다. 여러분은 무장한 채로 여러분의 형제들 곧 이스라엘 자손 앞을 건너가십시오. 곧 용사들 모두입니다.”[a][b][c]
  to: 그때 내가 여러분에게 명령했습니다. “야훼 여러분의 하나님께서 이 땅을 여러분이 차지하도록 여러분에게 주셨습니다. 여러분 가운데 모든 용사들은 무장하고 여러분의 형제들[a], 곧 이스라엘 자손보다 앞서 건너가십시오.[b][c]”
  rationale: 원문의 직접화법 구조와 합쇼체를 유지하면서, לִפְנֵי의 선도·선행 의미와 כָּל בְּנֵי חָיִל의 수식 범위를 바로잡았습니다. ‘차지하도록’은 לְרִשְׁתָּהּ의 목적 용법을 자연스러운 한국어로 재현합니다. 각 주석 표지는 해당 표현 가까이에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:04Z'
review_pass:
  verdict: revise
  source_fidelity: ‘앞을 건너가십시오’는 לִפְנֵי(‘~보다 앞서/앞에’)를 ‘~의 앞을’로 잘못 연결하여 의미와 문법이 어색합니다. 또한 כָּל בְּנֵי חָיִל은 명령을 수행할 ‘모든 용사들’을 가리키므로 주어로 분명히 처리하는 것이 원문 구조에 더 충실합니다.
  naturalness: 현대 합쇼체에서 ‘명령하며 말했습니다’보다 ‘명령했습니다’가 자연스럽습니다. ‘여러분의 형제들인 이스라엘 자손보다 앞서 건너가십시오’는 군사적으로 앞서 나아간다는 뜻을 명확하고 자연스럽게 전달합니다.
  terminology: 야훼, 하나님, 이스라엘 자손, 용사라는 용어 선택은 적절합니다. ירשׁ는 이 문맥에서 ‘차지하다’가 자연스럽고, חֲלוּצִים은 ‘무장하고’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: ‘여러분의 형제들 곧 이스라엘 자손 앞을 건너가십시오’
    rationale: לִפְנֵי אֲחֵיכֶם은 형제들의 ‘앞을’ 통과한다는 뜻이 아니라, 형제들보다 앞서 건너간다는 뜻입니다. 현 번역은 한국어 문법상도 ‘형제들의 앞부분을 건너다’처럼 읽힙니다.
  - severity: medium
    issue: ‘곧 용사들 모두입니다’
    rationale: כָּל בְּנֵי חָיִל은 직접화법 끝의 독립 서술이 아니라, 무장하여 앞서 건너가야 할 사람들을 한정하는 표현입니다. ‘여러분 가운데 모든 용사들은’으로 명령문의 주어를 밝혀야 합니다.
  - severity: low
    issue: ‘명령하며 말했습니다’
    rationale: 히브리어의 וָאֲצַו … לֵאמֹר는 한국어에서 ‘명령했습니다’로 옮기면 직접화법 도입 기능이 자연스럽게 살아납니다.
