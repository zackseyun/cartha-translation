id: DEU.3.18
reference: Deuteronomy 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
  footnotes:
  - marker: a
    text: Or 'your fellow Israelites'; the Hebrew reads 'your brothers, the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'equipped for battle' for 'armed.'
    reason: lexical_alternative
  - marker: c
    text: '''Men of valor'' refers to able fighting men, not merely inward courage.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 내가 여러분에게 명령하며 말했습니다. “야훼 여러분의 하나님께서 여러분에게 이 땅을 주셔서 소유하게 하셨습니다. 여러분은 무장한 채로 여러분의 형제들 곧 이스라엘 자손 앞을 건너가십시오. 곧 용사들 모두입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 히브리어의 직역이며, 문맥상 같은 이스라엘 공동체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무장한 채로’는 ‘전투 장비를 갖춘’의 의미를 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘용사들’은 단지 내면적 용기를 뜻하지 않고, 실제로 싸울 수 있는 사람들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו
  english_pob_choice: And I commanded
  chosen_korean: 내가 ... 명령하며
  alternatives_korean:
  - 내가 ... 명하였고
  - 내가 ... 지시하며
  lexicon: HALOT
  rationale: צוה의 직접적 의미를 따라 서술 동사로 ‘명령하며’를 택해, 이어지는 직접화법 도입을 자연스럽게 살렸습니다.
- source_word: בָּעֵת הַהִוא
  english_pob_choice: at that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시각에
  - 그 당시
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간 부사를 한국어 서술에 맞게 간결한 ‘그때’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 여호와 여러분의 하나님
  - 야훼, 여러분의 하나님
  lexicon: HALOT
  rationale: 원문 고유명사는 프로젝트 기본값에 따라 ‘야훼’로 유지하고, ‘하나님’은 소유격 구성으로 자연스럽게 연결했습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess it
  chosen_korean: 소유하게
  alternatives_korean:
  - 차지하게
  - 소유하도록
  - 점유하게
  lexicon: HALOT
  rationale: ירשׁ는 단순한 ‘받다’보다 실제 점유·소유의 의미가 강하므로, 한국어에서는 목적적 동사구 ‘소유하게’로 처리했습니다.
- source_word: חֲלוּצִים
  english_pob_choice: armed
  chosen_korean: 무장한 채로
  alternatives_korean:
  - 무장하여
  - 전투 장비를 갖춘 채로
  - 전투 태세를 갖추고
  lexicon: HALOT
  rationale: 전투에 대비한 상태를 분명히 드러내면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  english_pob_choice: your brothers ... the sons of Israel
  chosen_korean: 여러분의 형제들 곧 이스라엘 자손
  alternatives_korean:
  - 여러분의 형제들인 이스라엘 자손
  - 여러분의 동족 곧 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 병렬·동격 구조를 살려 ‘형제들 곧 이스라엘 자손’으로 유지해, 형제 관계와 집단 정체성을 함께 드러냈습니다.
- source_word: כָּל בְּנֵי חָיִל
  english_pob_choice: all the men of valor
  chosen_korean: 용사들 모두
  alternatives_korean:
  - 모든 용사
  - 모든 전투력 있는 사람들
  - 모든 힘 있는 자들
  lexicon: HALOT
  rationale: חַיִל의 군사적·용맹적 의미를 살려 ‘용사들’로 옮기고, כָּל을 뒤로 돌려 한국어 어순에 맞게 ‘모두’로 정리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문은 יְהוָה를 직접 사용하므로, 본문에서는 전통 대체어 ‘주’ 대신 신명 표기 ‘야훼’를 유지해 출처의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → 야훼'
- issue: 군사적 명령의 직설성
  chosen_reading: 무장한 채로 ... 앞을 건너가십시오
  alternative_readings:
  - 전투 태세를 갖추고 ... 앞서 건너가십시오
  - 준비된 채로 ... 앞을 건너가십시오
  rationale: 본문은 단순 이동이 아니라 전열을 갖춘 선도 통과를 명령하므로, 완곡하게 누그러뜨리지 않고 군사적 긴장을 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
