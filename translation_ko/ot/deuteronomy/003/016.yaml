  naturalness: ‘레우벤 사람들’보다 성경 지명·인명 표기에 널리 쓰이는 ‘르우벤’ 및 집단을 분명히 하는 ‘르우벤 지파와 갓 지파’가 현대 한국어 성경 문맥에서 더 자연스럽습니다. 경계 구문은 쉼표와 ‘곧’을 사용해 원문의 동격적 설명을 명료하게 했습니다.
