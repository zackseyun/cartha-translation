base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
  footnotes:
  - marker: a
    text: Or “the border of the Ammonites.” The Hebrew reads “the sons of Ammon,” a kinship expression for the people of Ammon.
    reason: lexical_alternative
  - marker: b
    text: Hebrew נחל can refer to a stream, wadi, or the valley associated with it; here “Valley” is used because the next phrase speaks of “the middle of the valley” as the boundary.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 지파와 갓 지파에게는 길르앗에서 아르논 골짜기[b]까지, 곧 그 골짜기 한가운데를 경계로 하여, 또 얍복 골짜기까지, 곧 암몬 자손[a]의 경계까지 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암몬 자손’은 히브리어의 친족 표현입니다. 문맥상 ‘암몬 사람들’ 또는 ‘암몬인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נחל은 시내, 와디, 또는 그 물길과 관련된 골짜기를 가리킬 수 있습니다. 여기서는 이어지는 ‘그 골짜기 한가운데’라는 표현과 호응하도록 ‘골짜기’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי / לַגָּדִי
  english_pob_choice: to the Reubenites / to the Gadites
  chosen_korean: 레우벤 사람들 / 갓 사람들
  alternatives_korean:
  - 르우벤 지파 사람들 / 갓 지파 사람들
  - 르우벤인들 / 갓인들
  lexicon: HALOT
  rationale: 히브리어 gentilics는 단순 개인 이름이 아니라 부족 집단을 가리키므로, 한국어에서는 자연스럽고 집단성을 드러내는 ‘사람들’을 택했습니다.
- source_word: נַחַל
  english_pob_choice: Valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 와디
  - 시내
  - 계곡
  lexicon: HALOT
  rationale: 본문은 이어서 ‘골짜기의 한가운데’라고 설명하므로, POB의 Valley 선택을 살려 한국어도 지형적 의미가 드러나는 ‘골짜기’로 옮겼습니다.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  english_pob_choice: the middle of the valley as a border
  chosen_korean: 골짜기의 한가운데를 경계로 하여
  alternatives_korean:
  - 골짜기의 한가운데를 경계로
  - 골짜기 한가운데가 경계가 되도록
  lexicon: HALOT
  rationale: תּוֹךְ은 ‘한가운데/중심’을 뜻하고, וּגְבֻל은 그 위치가 경계선이라는 점을 덧붙이므로, 한국어에서는 문장 관계를 분명하게 하기 위해 ‘경계로 하여’로 자연화했습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 보존하기 위해 ‘암몬 자손’을 택했습니다. 이는 POB의 ‘sons of Ammon’에 대응하며, 민족 집단을 혈연적 표현으로 유지합니다.
theological_decisions:
- issue: 경계선 표현의 지리적/법적 성격
  chosen_reading: 이 구절은 단순한 지명 나열이 아니라, 각 지파에 분배된 영토의 경계를 법적으로 확정하는 진술로 읽었습니다.
  alternative_readings:
  - 지리적 범위만 설명하는 중립적 진술
  - 서술적 여행 기록
  rationale: ‘주었습니다’와 반복되는 ‘경계’ 표현은 분배 행위와 경계 설정을 함께 드러내므로, 소유권 부여의 의미를 약화시키지 않도록 했습니다.
  doctrine_reference: 민수기 32장; 여호수아 13장과의 지파 분배 맥락
