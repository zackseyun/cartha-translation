- from: 레우벤 사람들과 갓 사람들에게는 길르앗에서 아르논 골짜기까지 — 곧 골짜기의 한가운데를 경계로 하여 — 그리고 얍복 골짜기까지, 곧 암몬 자손의 경계를 주었습니다.[a][b]
