    reason: lexical_alternative
translation:
  language: ko
  text: 오직 너희 아내들과 너희 어린 자녀들[a]과 너희 가축은—나는 너희에게 가축이 많다는 것을 알고 있습니다—내가 너희에게 준 너희 성읍들[b] 안에 남아 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 자녀들’. 이 히브리어 말은 어린 자녀나 부양가족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도시들’. 이 히브리어 단어는 규모가 다양한 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
