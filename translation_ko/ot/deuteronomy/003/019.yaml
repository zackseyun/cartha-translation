  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
  footnotes:
  - marker: a
    text: Or 'your children' for 'your little ones.' The Hebrew term refers to small children or dependents.
    reason: lexical_alternative
  - marker: b
