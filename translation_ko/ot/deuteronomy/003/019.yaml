  - 너희 종속원들
  lexicon: HALOT
  rationale: טַף는 단순한 ‘자녀’보다 어린 자녀나 부양가족을 가리키므로, 본문 맥락을 살려 ‘어린 것들’로 옮겼습니다.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  english_pob_choice: your livestock / much livestock
  chosen_korean: 너희 가축 / 가축이 많다는 것
  alternatives_korean:
  - 너희 짐승들 / 많은 짐승들
  - 너희 가축떼 / 많은 가축떼
  lexicon: HALOT
  rationale: מִקְנֶה는 소에 한정되지 않는 가축 전반을 뜻하므로 ‘가축’을 사용했고, 반복되는 ‘많다’는 진술은 한국어에서는 ‘가축이 많다는 것’으로 자연스럽게 살렸습니다.
- source_word: בְּעָרֵיכֶם
  english_pob_choice: in your towns
  chosen_korean: 너희 성읍들 안에
  alternatives_korean:
  - 너희 도시들 안에
  - 너희 마을들 안에
  lexicon: HALOT
  rationale: עִיר는 ‘도시/성읍’ 모두 가능하지만, 신명기의 정착·분배 문맥에서는 ‘성읍들’이 가장 무난하여 POB의 ‘towns’에 대응시켰습니다.
theological_decisions:
- issue: ‘머물러 있어야 합니다’로 יֵשְׁבוּ의 상황적 의미를 어떻게 반영할지
  chosen_reading: 전투에 나가는 무리와 대비되는 ‘거주/체류’의 뜻을 살려 ‘머물러 있어야 합니다’로 옮겼습니다.
  alternative_readings:
  - 살아야 합니다
  - 거주해야 합니다
  - 있어야 합니다
  rationale: 문맥상 단순한 거주 진술이 아니라, 다른 이들이 나가는 동안 가족과 가축이 그 성읍들에 남아 있어야 한다는 의미이므로, 자연스러운 현대어로 그 기능을 드러냈습니다.
  doctrine_reference: 문맥상 명령/예외 규정의 의미 유지
