revisions:
- from: 야훼께서 여러분의 형제들에게도 여러분에게 하신 것처럼 안식을 주시고, 그들도 야훼 너희 하나님이 요단 저편에서 그들에게 주시는 땅을 차지하게 될 때까지입니다[c][b]. 그런 다음 각 사람은 내가 여러분에게 준 자기 소유로 돌아갈 수 있습니다.
  to: 야훼께서 여러분의 형제들에게도 여러분에게 안식을 주신 것처럼 안식을 주시고, 그들도 야훼 여러분의 하나님께서 그들에게 주시는 요단 저편에 있는 땅을 차지할 때까지입니다[b]. 그때에 각 사람은 내가 여러분에게 준 자기 기업으로 돌아갈 수 있습니다[c].
  rationale: 인칭을 일관되게 하고, 요단 저편이라는 위치 표현이 ‘땅’을 수식하도록 바로잡았습니다. 또한 근거 없는 c 각주를 제거하고, 원문 לִירֻשָּׁתוֹ 및 영어 POB 감사 기록에 맞춰 마지막 ‘기업’에 대한 어휘 대안 각주로 교체했습니다. 원문의 미완결 ‘~까지’ 구문과 문맥상 허용을 나타내는 ‘돌아갈 수 있습니다’는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:27Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 안식, 형제들, 요단 저편, 귀환의 기본 의미를 대체로 반영합니다. 그러나 ‘야훼 너희 하나님’은 한국어 인칭 일치가 어색하며, ‘요단 저편에서 그들에게 주시는 땅’은 전치사구가 ‘주시는’ 행위에 붙어 의미가 불분명해질 수 있습니다. 히브리어의 בְּעֵבֶר הַיַּרְדֵּן은 땅의 위치를 수식하므로 이를 명확히 했습니다.
  naturalness: ‘여러분의 하나님’으로 인칭을 통일하고, ‘요단 저편에 있는 땅’으로 수식 관계를 자연스럽게 했습니다. 본 절은 앞 절의 명령에 이어지는 ‘~까지’ 절이므로 그 구문을 유지했습니다. ‘기업’은 여기서 배분받은 토지라는 뜻으로 현대 성경 문체에서 자연스럽고 정확합니다.
  terminology: יְהוָה는 정책과 영어 POB에 따라 ‘야훼’로 유지했습니다. יָנִיחַ는 정착과 안전을 포함하는 ‘안식을 주시고’로, ירשׁ/יְרֻשָּׁה는 각각 ‘차지하다’와 ‘기업’으로 구별했습니다. ‘형제들’ 및 ‘각 사람’은 원문의 남성형·분배적 표현을 유지합니다.
  issues:
  - severity: medium
    issue: ‘야훼 너희 하나님’의 인칭 혼용
    rationale: 문맥의 2인칭 복수 호칭은 ‘여러분’으로 옮겼으므로 ‘여러분의 하나님’으로 통일해야 자연스럽습니다.
  - severity: medium
    issue: ‘요단 저편에서 그들에게 주시는 땅’의 수식 관계 불명확
    rationale: 원문은 ‘요단 저편에 있는 땅’을 가리킵니다. 초안의 ‘에서’는 하나님이 그 장소에서 땅을 주신다는 뜻으로도 읽힐 수 있습니다.
  - severity: medium
    issue: 각주 c의 내용과 표지 위치가 원문 및 영어 감사 기록과 맞지 않음
    rationale: 초안의 c 각주는 ‘그 땅을 차지하게 될 때까지’라는 대안을 제시하지만, 해당 표현은 원문상 쟁점이나 영어 POB의 c 각주 대상이 아닙니다. c는 마지막의 יְרֻשָּׁתוֹ(기업/소유지)에 붙이는 것이 적절합니다.
  revised_text: 야훼께서 여러분의 형제들에게도 여러분에게 안식을 주신 것처럼 안식을 주시고, 그들도 야훼 여러분의 하나님께서 그들에게 주시는 요단 저편에 있는 땅을 차지할 때까지입니다[b]. 그때에 각 사람은 내가 여러분에게 준 자기 기업으로 돌아갈 수 있습니다[c].
  revised_footnotes:
