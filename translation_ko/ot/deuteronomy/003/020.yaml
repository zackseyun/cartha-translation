  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
  footnotes:
  - marker: a
    text: Or 'to your fellow Israelites.' The Hebrew says 'your brothers,' using a masculine kinship term for fellow members of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan.' The phrase is relative to the speaker's location east of the river.
    reason: lexical_alternative
  - marker: c
    text: Or 'to his inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분의 형제들에게도 여러분에게 하신 것처럼 안식을 주시고, 그들도 야훼 너희 하나님이 요단 저편에서 그들에게 주시는 땅을 차지하게 될 때까지입니다[c][b]. 그런 다음 각 사람은 내가 여러분에게 준 자기 소유로 돌아갈 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘요단 강 건너편에서’. 이 표현은 화자의 위치를 기준으로 한 상대적 지시입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그 땅을 차지하게 될 때까지’. 히브리어는 ‘차지하다/소유하다’의 뉘앙스를 가집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 언약적 하나님의 고유명을 살리기 위해 전통적 대체칭호 ‘주’보다 음역형 ‘야훼’를 사용합니다.
- source_word: לַאֲחֵיכֶם
  english_pob_choice: to your brothers
  chosen_korean: 여러분의 형제들에게
  alternatives_korean:
  - 여러분의 형제자매들에게
  - 여러분의 동족들에게
  lexicon: HALOT
  rationale: 히브리어 복수 친족어의 남성 대표형을 그대로 반영하되, 한국어에서는 ‘형제들’보다 조사와 결합이 자연스러운 ‘형제들에게’로 옮겼습니다.
- source_word: יָנִיחַ
  english_pob_choice: gives rest
  chosen_korean: 안식을 주시고
  alternatives_korean:
  - 쉼을 주시고
  - 평안을 주시고
  lexicon: HALOT
  rationale: 문맥상 단순 휴식보다 정착과 전쟁 종료를 포함하는 ‘rest’의 의미가 강하므로, 신명기적 주제에 맞는 ‘안식’을 택했습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 저편에서
  alternatives_korean:
  - 요단 건너편에서
  - 요단 강 건너편에서
  lexicon: HALOT
  rationale: 화자의 동쪽 위치를 기준으로 한 상대적 표현을 살려 ‘저편’으로 옮겼습니다.
- source_word: אִישׁ לִירֻשָּׁתוֹ
  english_pob_choice: Then each of you may return to his possession
  chosen_korean: 각 사람은 ... 자기 소유로 돌아갈 수 있습니다
  alternatives_korean:
  - 각자는 ... 자기 기업으로 돌아갈 수 있습니다
  - 각 사람은 ... 자기 상속분으로 돌아갈 수 있습니다
  lexicon: HALOT
  rationale: 분배된 토지의 귀속을 자연스럽게 드러내기 위해 ‘소유’로 옮겼고, 분배 대상의 개별성을 ‘각 사람’으로 표현했습니다.
theological_decisions:
- issue: ‘형제들’의 남성형 유지
  chosen_reading: 여러분의 형제들에게
  alternative_readings:
  - 여러분의 형제자매들에게
  - 여러분의 동족들에게
  rationale: 히브리어 אָח의 남성형을 본문 그대로 유지해 공동체 내부의 대표적 남성 표지를 지우지 않았습니다. 다만 한국어에서는 포괄 의미가 자연스럽게 전달되도록 문맥을 보완했습니다.
  doctrine_reference: Translation philosophy §4
- issue: ‘안식’의 신학적 뉘앙스
  chosen_reading: 안식을 주시고
  alternative_readings:
  - 쉼을 주시고
  - 평안을 주시고
  rationale: 이 구절의 rest는 단순 휴식이 아니라 약속의 땅에서의 전쟁 종결과 정착을 포함하는 언약적 안식이므로, 신명기 전체의 주제에 맞는 ‘안식’을 사용했습니다.
  doctrine_reference: Deuteronomy land-rest motif
