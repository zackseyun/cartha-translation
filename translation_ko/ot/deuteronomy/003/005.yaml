  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
  footnotes:
  - marker: a
    text: Or 'villages of the open country' or 'unwalled towns.' The Hebrew contrasts these settlements with the fortified cities just described.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 성읍은 높은 성벽과 두 짝의 문과 빗장을 갖춘 요새화된 성읍들이었습니다. 이 밖에도 성벽 없는 들판의 성읍들이 매우 많았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개방된 들판의 마을들’ 또는 ‘성벽 없는 성읍들’이라고 할 수 있습니다. 히브리어는 이 정착지들을 앞서 언급한 요새화된 성읍들과 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻר֛וֹת
  english_pob_choice: fortified
  chosen_korean: 요새화된
  alternatives_korean:
  - 성곽으로 둘러싼
  - 견고한
  lexicon: HALOT
  rationale: 성을 공격으로부터 방어하도록 강화된 상태를 가리키므로, 현대 한국어에서 의미가 분명한 ‘요새화된’으로 옮겼습니다.
- source_word: חוֹמָ֥ה גְבֹהָ֖ה
  english_pob_choice: with a high wall
  chosen_korean: 높은 성벽
  alternatives_korean:
  - 높은 벽
  - 높은 담
  lexicon: HALOT
  rationale: 히브리어는 단수형 ‘성벽’에 형용사 ‘높은’이 붙은 표현이므로, 한국어에서도 단수 의미를 살려 ‘높은 성벽’으로 옮겼습니다.
- source_word: דְּלָתַ֣יִם וּבְרִ֑יחַ
  english_pob_choice: double doors, and bars
  chosen_korean: 문들과, 빗장이 있는
  alternatives_korean:
  - 쌍문과, 빗장이 있는
  - 성문들과, 빗장이 있는
  lexicon: HALOT
  rationale: דְּלָתַיִם은 쌍수형으로 문짝 쌍을 뜻하므로, ‘문들’로 옮겨 이중성을 과도하게 특정하지 않으면서도 구조를 살렸고, בְרִיחַ는 출입구를 잠그는 ‘빗장’이 자연스럽습니다.
- source_word: הַפְּרָזִ֖י
  english_pob_choice: rural towns
  chosen_korean: 광야의 성읍들
  alternatives_korean:
  - 들판의 성읍들
  - 성벽 없는 성읍들
  - 시골 마을들
  lexicon: HALOT
  rationale: 이 표현은 요새화된 성읍과 대비되는 성벽 없는 개방 지역의 정착지를 가리키므로, 본문의 대조를 살릴 수 있는 ‘광야의 성읍들’을 채택했습니다.
