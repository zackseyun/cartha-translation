reference: Deuteronomy 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
  footnotes:
  - marker: a
    text: Or 'the giants.' Hebrew 'Rephaim,' likely the name of an ancient people associated with great size.
    reason: alternative_reading
  - marker: b
    text: Or 'by an ordinary cubit' or 'according to the common cubit.' Hebrew literally, 'by the cubit of a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바산의 왕 옥만이 르바임의 남은 자 가운데서 남아 있었습니다[a]. 보십시오, 그의 침상은 철 침상이었습니다. 그것이 암몬 자손의 랍바에 있지 않습니까? 그 길이는 아홉 규빗이요, 너비는 네 규빗[b]이며, 사람의 규빗으로 잰 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거인들’. 히브리어 ‘르바임’은 큰 체구와 관련된 고대 집단의 이름일 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘보통 규빗으로’ 혹은 ‘일반 규빗에 따라’. 히브리어는 문자적으로 ‘사람의 규빗으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק / נִשְׁאַר מִיֶּתֶר
  english_pob_choice: only ... was left of the remnant of
  chosen_korean: 오직 ...만이 ... 가운데서 남아 있었습니다
  alternatives_korean:
  - '...만 남았습니다'
  - '...만이 살아남았습니다'
  lexicon: HALOT
  rationale: ‘רַק’의 배타성과 ‘נִשְׁאַר מִיֶּתֶר’의 잔존 의미를 함께 살려, 옥이 그 집단의 유일한 생존자라는 뉘앙스를 자연스럽게 표현했습니다.
- source_word: הָרְפָאִים
  english_pob_choice: the Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 레파임
  lexicon: HALOT
  rationale: 본문의 고유 집단명은 해석어인 ‘거인들’보다 음역이 더 직접적이므로, 원형을 보존하는 ‘르바임’을 택했습니다.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  english_pob_choice: his bed was a bed
  chosen_korean: 그의 침상은 철 침상이었습니다
  alternatives_korean:
  - 그의 침대는 철 침대였습니다
  - 그의 침상은 철로 된 침상이었습니다
  lexicon: HALOT
  rationale: 반복 구조가 강조하는 대구를 살리되, 현대 한국어에서 가장 자연스러운 ‘침상’으로 옮겼습니다. 원문의 물건이 사람의 크기를 드러내는 표지이므로 ‘침상’이 무난합니다.
- source_word: בְּאַמַּת אִישׁ
  english_pob_choice: by the cubit of a man
  chosen_korean: 사람의 규빗으로 잰 것입니다
  alternatives_korean:
  - 보통 규빗으로 잰 것입니다
  - 일반적인 규빗으로 잰 것입니다
  lexicon: HALOT
  rationale: 직역형 표현을 유지하되, 한국어에서는 측정 기준을 분명히 드러내기 위해 ‘잰 것입니다’로 풀어 자연스럽게 만들었습니다.
theological_decisions:
- issue: הָרְפָאִים을 민족명으로 보존할지, ‘거인들’로 풀어쓸지
  chosen_reading: 민족/집단명으로 보존하여 ‘르바임’으로 옮김
  alternative_readings:
  - 거인들
  rationale: 본문은 옥을 이 집단의 잔존자로 제시하지만, 히브리어 자체는 고유한 집단명을 사용합니다. 해석을 본문에 앞세우기보다 독자가 문맥으로 추론하도록 두는 편이 원문에 더 가깝습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: עֶרֶשׂ를 ‘침상’으로 볼지 ‘관/들것’ 계열로 볼지
  chosen_reading: 침상
  alternative_readings:
  - 침대
  - 관
  - 들것
  rationale: 직접 언급된 치수는 옥의 거대한 체구를 부각하는 효과를 내며, 그 목적에는 일반적인 ‘침상’이 가장 잘 맞습니다. 장례용 물건으로 단정할 근거는 본문 자체에 충분하지 않습니다.
  doctrine_reference: 번역 철학 §1, §6
