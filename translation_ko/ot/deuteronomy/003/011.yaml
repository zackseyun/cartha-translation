- from: 바산의 왕 옥만이 르바임의 남은 자 가운데서 남아 있었습니다[a]. 보십시오, 그의 침상은 철 침상이었습니다. 그것이 암몬 자손의 랍바에 있지 않습니까? 그 길이는 아홉 규빗이요, 너비는 네 규빗[b]이며, 사람의 규빗으로 잰 것입니다.
  to: 바산의 왕 옥만이 르바임 가운데 남은 자였습니다[a]. 보십시오, 그의 침상은 철 침상이었습니다. 그것이 암몬 자손의 랍바에 있지 않습니까? 그 길이는 아홉 규빗이요, 너비는 네 규빗[b]인데, 사람의 규빗을 기준으로 한 것입니다.
