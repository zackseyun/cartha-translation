  - 그들 때문에 두려워하지 마십시오
  lexicon: HALOT
  rationale: יִרא의 금지형은 단순한 감정뿐 아니라 위협 앞의 두려움을 가리키므로, 직접적이고 자연스러운 금지문으로 옮겼습니다.
