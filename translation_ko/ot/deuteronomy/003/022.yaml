lexical_decisions:
- source_word: לֹא תִּירָאוּם
  english_pob_choice: Do not fear them
  chosen_korean: 그들을 두려워하지 마십시오
  alternatives_korean:
  - 그들을 무서워하지 마십시오
  - 그들 때문에 두려워하지 마십시오
  lexicon: HALOT
  rationale: יִרא의 금지형은 단순한 감정뿐 아니라 위협 앞의 두려움을 가리키므로, 직접적이고 자연스러운 금지문으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약명 יהוה를 전통적 대치어가 아니라 고유명으로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 너희의 하나님
  - 여러분의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유격을 반영하면서, 문어체 합쇼체에 맞게 ‘당신들의’로 옮겼습니다.
- source_word: הַנִּלְחָם לָכֶם
  english_pob_choice: the one who fights for you
  chosen_korean: 당신들을 위하여 싸우시는 분
  alternatives_korean:
  - 여러분을 위해 싸우시는 분
  - 여러분 편에서 싸우시는 분
  lexicon: HALOT
  rationale: 분사구문은 지속적·특징적 행위를 나타내므로 ‘싸우시는 분’으로 옮기고, ל의 유익/대리 의미를 ‘위하여’로 살렸습니다.
theological_decisions:
- issue: 하나님의 이름과 주어 강조
  chosen_reading: ‘야훼 당신들의 하나님께서’로 하나님의 이름과 소유격을 함께 드러내고, ‘싸우시는 분이시기 때문입니다’로 존재론적 설명보다 행위 중심의 위로를 살렸습니다.
  alternative_readings:
  - ‘주님은 여러분의 하나님이시니’
  - ‘야훼, 당신들의 하나님이 당신들을 위해 싸우십니다’
  rationale: 히브리어의 독립 대명사 הוּא가 주어를 강조하므로, 한국어에서도 주어를 분명히 하되 과도한 신학적 해석 없이 위로의 이유를 직접 제시했습니다.
  doctrine_reference: 언약적 보호에 대한 신명기적 진술
