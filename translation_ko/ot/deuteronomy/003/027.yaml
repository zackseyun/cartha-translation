source:
  edition: WLC
  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
  footnotes:
  - marker: a
    text: Hebrew literally 'sea-ward,' a conventional way of saying 'westward.'
    reason: cultural_note
  - marker: b
    text: Or 'this Jordan River.' Hebrew simply says 'this Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 피스가 꼭대기로 올라가서 서쪽과 북쪽과 남쪽과 동쪽으로 눈을 들어 보십시오. 또 눈으로 보십시오. 이는 당신이 이 요단을 건너지 못할 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘바다 쪽으로’라는 말로 서쪽을 가리키는 관용적 방향 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 단순히 ‘이 요단’이라고 하며, 필요하면 ‘이 요단강’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה רֹאשׁ הַפִּסְגָּה
  english_pob_choice: Go up to the top of Pisgah
  chosen_korean: 피스가 꼭대기로 올라가서
  alternatives_korean:
  - 피스가 정상으로 올라가서
  - 피스가 산꼭대기로 올라가서
  lexicon: HALOT
  rationale: רֹאשׁ을 ‘꼭대기’로 옮겨 산의 꼭대기라는 공간감을 살리고, פִּסְגָּה는 고유지명으로 음역하여 원문 지명을 보존했습니다.
- source_word: וְשָׂא עֵינֶיךָ / וּרְאֵה בְעֵינֶיךָ
  english_pob_choice: lift up your eyes ... and see with your eyes
  chosen_korean: 눈을 들어 보십시오. 또 눈으로 보십시오.
  alternatives_korean:
  - 눈을 들어 보십시오. 또 직접 보십시오.
  - 눈을 들어 보십시오. 또 눈으로 직접 보십시오.
  lexicon: HALOT
  rationale: 히브리어의 ‘눈을 들어’와 ‘눈으로 보라’의 이중 표현을 두 번의 동작으로 살려, 단순한 ‘바라보라’로 약화되지 않게 했습니다.
- source_word: יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  english_pob_choice: westward and northward and southward and eastward
  chosen_korean: 서쪽과 북쪽과 남쪽과 동쪽으로
  alternatives_korean:
  - 서쪽으로와 북쪽으로와 남쪽으로와 동쪽으로
  - 서쪽과 북쪽과 남쪽과 동쪽을 향하여
  lexicon: HALOT
  rationale: 방향 부사들의 병렬 구조를 한국어에서도 ‘~쪽으로’로 일정하게 맞춰, 지시 방향의 나열을 분명하게 전달했습니다.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  english_pob_choice: this Jordan
  chosen_korean: 이 요단
  alternatives_korean:
  - 이 요단강
  - 이 요단강을
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘이 요단’이라고 하므로, 강이라는 보충어를 넣지 않고 POB의 절제된 처리와 원문의 지시성을 따랐습니다.
theological_decisions:
- issue: 명령형과 예언적 단언의 어조
  chosen_reading: 명령문은 정중한 합쇼체로 옮기되, 마지막 절은 단순한 미래 예고가 아니라 모세에게 주어진 제한을 분명히 드러내도록 했습니다.
  alternative_readings:
  - 더 완곡한 권고형으로 바꾸는 방식
  - 종결을 ‘건너지 못합니다’로 중화하는 방식
  rationale: 원문은 명령과 이유 제시로 이루어진 직설적 구조이므로, 한국어에서도 명령성과 금지적 현실을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 본문의 서술적·명령적 문맥 보존
