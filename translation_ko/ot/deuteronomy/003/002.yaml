  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: ko
  text: 그러자 야훼께서 제게 말씀하셨습니다. “그를 두려워하지 마십시오. 내가 그와 그의 모든 백성과 그의 땅을 네 손에 넘겨주었습니다. 네가 헤스본에 살던 아모리 사람들의 왕 시혼에게 한 것처럼 그에게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: PB의 기본 원칙에 따라 신명기는 언약의 이름을 고유명으로 보존해야 하므로, 전통적 대체어인 ‘여호와’나 일반 호칭 ‘주’ 대신 ‘야훼’로 옮겼습니다.
- source_word: אַל תִּירָא אֹת֔וֹ
  english_pob_choice: Do not fear him
  chosen_korean: 그를 두려워하지 마십시오
  alternatives_korean:
  - 그를 무서워하지 마십시오
  - 그를 두려워하지 말아야 합니다
  lexicon: HALOT
  rationale: 부정 명령형의 직접성과 대상 대명사 ‘그’를 살리면서, 현대 한국어에서 자연스러운 공손 명령형으로 옮겼습니다.
- source_word: בְיָדְךָ
  english_pob_choice: into your hand
  chosen_korean: 네 손에
  alternatives_korean:
  - 네 권력 아래
  - 네 힘에
  lexicon: HALOT
  rationale: 히브리어의 ‘손에’ 관용구를 그대로 살려, 넘겨짐과 통제권 부여의 이미지를 유지했습니다.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ לְסִיחֹן
  english_pob_choice: and you shall do to him just as you did to Sihon
  chosen_korean: 네가 그에게 한 것처럼 그대로 그에게 하십시오
  alternatives_korean:
  - 그에게 행한 것처럼 그에게도 행하십시오
  - 시혼에게 했던 대로 그에게 하십시오
  lexicon: HALOT
  rationale: עָשָׂה의 넓은 의미를 좁히지 않고, 뒤따르는 비교절을 따라 행동의 기준을 분명히 드러냈습니다.
theological_decisions:
- issue: 야훼의 말씀이 모세에게 직접 전달되는 서술의 문체
  chosen_reading: ‘그러자 … 말씀하셨습니다’로 서술하고, 인용문 안에서는 공손한 명령형을 유지했습니다.
  alternative_readings:
  - 직설적 반말 명령형
  - 더 전통적인 ‘말씀하여 이르시되’
  rationale: 서사문은 현대 표준어의 공손체를 따르되, 하나님의 직접 명령은 내용상 명령성을 유지해야 하므로 ‘-십시오’로 옮겼습니다.
  doctrine_reference: Narrative register and divine speech in Korean POB style
