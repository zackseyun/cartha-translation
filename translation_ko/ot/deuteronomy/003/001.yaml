  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
  footnotes:
  - marker: a
    text: Or 'on the road to Bashan.' The Hebrew idiom literally says 'the way of Bashan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 우리는 바산으로 가는 길로 올라갔습니다. 바산 왕 옥이 우리에게, 그와 그의 모든 백성과 함께, 에드레이에서 싸우러 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바산으로 가는 길에서’. 히브리어 관용구는 문자적으로는 ‘바산의 길’이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַנֵּפֶן וַנַּעַל
  english_pob_choice: Then we turned and went up
  chosen_korean: 그러고 나서 우리는 ... 올라갔습니다
  alternatives_korean:
  - 그다음 우리는 방향을 돌려 올라갔습니다
  - 우리는 돌아서서 올라갔습니다
  lexicon: HALOT
  rationale: 연속된 서사 동작을 한국어 자연문으로 옮기되, '올라가다'가 העלה의 상향 이동을 살리므로 유지했습니다.
- source_word: דֶּרֶךְ הַבָּשָׁן
  english_pob_choice: by the way of Bashan
  chosen_korean: 바산으로 가는 길로
  alternatives_korean:
  - 바산의 길로
  - 바산 길로
  lexicon: HALOT
  rationale: 히브리어의 דרך 관용구를 직역식 소유격보다 목적지/경로 감각이 드러나는 표현으로 옮겨, 영어 POB의 주석된 관용구 의미를 한국어에 반영했습니다.
- source_word: לִקְרָאתֵנוּ
  english_pob_choice: to meet us
  chosen_korean: 우리에게 ... 나왔습니다
  alternatives_korean:
  - 우리를 맞으러 나왔습니다
  - 우리와 마주하러 나왔습니다
  lexicon: HALOT
  rationale: לִקְרָא의 '맞다/마주하다' 의미를 전쟁 문맥에서 한국어 동사구로 풀어, 단순 이동과 대면의 의미를 함께 살렸습니다.
- source_word: הוּא וְכָל עַמּוֹ לַמִּלְחָמָה
  english_pob_choice: he and all his people, for battle
  chosen_korean: 그와 그의 모든 백성이 ... 싸우러
  alternatives_korean:
  - 그와 그의 모든 백성이 ... 전투를 위해
  - 그와 그의 모든 백성이 ... 전쟁하러
  lexicon: HALOT
  rationale: עַם을 '백성'으로 두고, לַמִּלְחָמָה는 문맥상 '싸우러'로 자연스럽게 풀어 전투 의도를 분명히 했습니다.
theological_decisions:
- issue: 전쟁 서술의 행위자와 의도
  chosen_reading: 본문은 이스라엘의 이동과 옥의 선제적 출전을 서술하는 역사 내러티브로 읽고, 신학적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님의 심판 내러티브로 강조하는 읽기
  - 이스라엘의 정당방위 서술로 강조하는 읽기
  rationale: 히브리어 원문은 단순한 사건 진행을 전하며, 이 절 자체에는 평가적 진술이 없으므로 서술을 과잉 해석하지 않는 것이 적절합니다.
  doctrine_reference: 역사서 내러티브의 서술적 절제
