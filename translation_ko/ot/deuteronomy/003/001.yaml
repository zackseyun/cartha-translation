revisions:
- from: 그러고 나서 우리는 바산으로 가는 길로 올라갔습니다. 바산 왕 옥이 우리에게, 그와 그의 모든 백성과 함께, 에드레이에서 싸우러 나왔습니다.[a]
  to: 그러자 우리는 방향을 돌려 바산 길로 올라갔습니다. 바산 왕 옥이 그와 그의 모든 백성과 함께 에드레이에서 우리를 맞아 싸우려고 나왔습니다.[a]
  rationale: 원문의 두 연속 동사 ‘방향을 돌리다’와 ‘올라가다’를 모두 살렸습니다. 옥과 그의 모든 백성이 전투를 목적으로 이스라엘을 맞으러 나온 사건 및 에드레이의 장소 관계를 자연스러운 합쇼체 서술로 옮겼습니다. ‘바산 길’의 범위와 목적지에 관한 관용적 이해는 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:20Z'
