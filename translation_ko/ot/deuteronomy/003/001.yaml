    rationale: לִקְרָאתֵנוּ는 ‘우리를 맞아/우리에게 맞서’이며, הוּא וְכָל־עַמּוֹ는 옥과 그의 모든 백성이 함께 출전한 주어입니다. 쉼표로 삽입하면 관계가 불명확해집니다.
