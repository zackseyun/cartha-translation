translation:
  language: ko
  text: 그러자 우리는 방향을 돌려 바산 길로 올라갔습니다. 바산 왕 옥이 그와 그의 모든 백성과 함께 에드레이에서 우리를 맞아 싸우려고 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바산으로 가는 길로’. 히브리어 표현은 문자적으로 ‘바산의 길’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן וַנַּעַל
  english_pob_choice: Then we turned and went up
  chosen_korean: 그러고 나서 우리는 ... 올라갔습니다
  alternatives_korean:
