  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
  footnotes:
  - marker: a
    text: Or 'wells.' The Hebrew more precisely refers to cisterns cut into rock for storing water.
    reason: lexical_alternative
  - marker: b
    text: Or 'and you will eat and be full.' The Hebrew verbs continue the sequence of what will happen when Israel enters the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네가 채우지 않은 좋은 것으로 가득한 집들과, 네가 파지 않은 도랑 파인 물통들과, 네가 심지 않은 포도원들과 올리브나무들을 얻게 될 것이며—먹고 배부르게 될 것입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물통들’은 כאן의 בֹרֹת가 가리키는 바위에 파낸 물 저장용 구덩이의 기능을 드러내기 위한 의역입니다. 더 직역하면 ‘우물들/저수조들’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 두 동사는 결과를 나타내는 연속으로 읽을 수 있어, 미래적 의미를 분명히 하여 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָתִּים מְלֵאִים כָּל טוּב
  english_pob_choice: houses full of every good thing
  chosen_korean: 좋은 것으로 가득한 집들
  alternatives_korean:
  - 온갖 좋은 것으로 가득한 집들
  - 모든 좋은 것으로 가득한 집들
  lexicon: HALOT
  rationale: 집을 물질적 축복의 항목으로 보되, כָּל טוּב의 넓은 의미를 살려 ‘좋은 것’으로 옮겼습니다. ‘온갖’은 자연스럽지만 원문의 열거적 사실성을 조금 보강합니다.
- source_word: בֹרֹת חֲצוּבִים
  english_pob_choice: hewn cisterns
  chosen_korean: 도랑 파인 물통들
  alternatives_korean:
  - 바위에 파낸 물 저장고들
  - 파인 우물들
  lexicon: HALOT
  rationale: 한국어에서 고대 근동의 cistern을 직역하기보다 기능이 드러나는 표현을 택할 수 있으나, 원문의 바위 절개 이미지를 살리기 위해 ‘파다/파인’의 감각을 유지했습니다. 다만 본문 용어는 물 저장용 구덩이를 가리키므로 ‘물통’은 의역 범위 안에서 읽힐 수 있어 대안과 함께 검토가 필요합니다.
- source_word: וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ
  english_pob_choice: and you eat and are satisfied
  chosen_korean: 먹고 배부르게 될 것입니다
  alternatives_korean:
  - 먹고 만족하게 될 것입니다
  - 먹고 흡족하게 될 것입니다
  lexicon: HALOT
  rationale: 결과를 나타내는 연속 동사로 읽어 미래적 의미를 분명히 했습니다. ‘배부르다’는 식사 후 포만을 직접적으로 드러내며, 문맥상 충분합니다.
theological_decisions:
- issue: 본문의 축복 목록과 다음 절의 경고 관계
  chosen_reading: 이 절은 약속된 풍요의 목록을 그대로 제시하고, 경고의 뉘앙스는 다음 절에 두었습니다.
  alternative_readings:
  - 이 절 안에 경고를 미리 덧붙이는 번역
  - 축복을 곧바로 비판적으로 해석하는 번역
  rationale: 원문은 집, 물 저장 시설, 포도원, 올리브나무를 나열하며 하나님의 공급을 강조할 뿐, 아직 경고를 명시하지 않습니다. 따라서 본문 자체의 힘을 유지했습니다.
  doctrine_reference: Translation philosophy item 3
- issue: 히브리어 2인칭 단수의 유지
  chosen_reading: 한국어에서도 단수형 ‘네가/될 것입니다’를 사용해 언약적 단수 خطاب을 보존했습니다.
  alternative_readings:
  - 복수형 ‘너희가’로 풀어 쓰기
  - 집단적 의미를 드러내기 위해 공동체 문장으로 재구성하기
  rationale: 신명기의 전형적인 언약 خطاب을 보존하는 것이 원문의 수사 효과를 살립니다. 한국어에서는 단수 ‘네가’가 자연스럽고, 공동체 적용도 해치지 않습니다.
  doctrine_reference: Translation philosophy item 4
