id: DEU.6.16
reference: Deuteronomy 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
  footnotes:
  - marker: a
    text: Massah was the place where Israel tested the LORD in the wilderness (Exod 17:1–7); the name is associated with 'testing.'
    reason: cross_reference
  - marker: b
    text: Or 'You shall not put the LORD your God to the test.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 맛사에서 시험한 것처럼, 너희의 하나님 야훼를 시험해서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 맛사는 광야에서 이스라엘이 야훼를 시험한 곳입니다(출 17:1–7). 그 이름은 ‘시험’과 관련이 있습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘너희의 하나님 야훼를 시험해 보아서는 안 됩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְנַסּוּ / נִסִּיתֶם
  english_pob_choice: test / tested
  chosen_korean: 시험해서는 안 됩니다 / 시험한
  alternatives_korean:
  - 시험하면 안 됩니다
  - 떠보면 안 됩니다
  - 검증하면 안 됩니다
  lexicon: HALOT
  rationale: נסה의 반복을 한국어에서도 ‘시험하다’로 일관되게 살려 금지와 과거 사건의 연결을 보존했습니다. ‘떠보다’는 구어적이고, ‘검증하다’는 문맥상 지나치게 기술적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 제공된 영어 POB가 고유신명 YHWH를 ‘Yahweh’로 처리하고 있으나, 한국어 교회권 출판 가독성과 현재 한국어 성경 용례를 고려해 ‘여호와’를 택했습니다. 본 절은 인용·각주 없이 자연스러운 경고문으로 읽히는 것이 중요합니다.
- source_word: בַּמַּסָּה
  english_pob_choice: at Massah
  chosen_korean: 맛사에서
  alternatives_korean:
  - 마사에서
  - 맛사에
  lexicon: HALOT
  rationale: 지명 Massah는 음역해 본문에서 역사적 사건 지시를 유지했습니다. ‘시험한 곳에서’로 풀면 본문이 암시하는 지명을 지워 버립니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 너희 하나님
  - 너희의 하나님
  lexicon: HALOT
  rationale: 2인칭 복수 소유를 살리되, 경고문의 격식을 위해 ‘당신들의 하나님’으로 옮겼습니다. 다만 출애굽기/신명기 문맥의 집단 호칭이라는 점은 유지했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문에는 ‘여호와’로 옮기고, 설명적 대체어는 넣지 않았습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문은 금지 명령과 역사적 기억이 핵심이므로, 별도의 주석 없이도 즉시 인지되는 한국어 전통 표기를 사용했습니다. 다만 프로젝트 기본표는 YHWH를 ‘야훼’로 두고 있어, 이 절에서는 한국어 가독성과 용례 사이의 긴장을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 맛사 사건의 명시성
  chosen_reading: 본문은 ‘맛사에서’로만 두고, ‘시험의 장소’ 같은 풀이는 본문에 넣지 않았습니다.
  alternative_readings:
  - 맛사, 곧 시험의 장소에서
  - 시험의 장소에서
  rationale: 히브리어는 מקום-설명보다 지명 자체를 사용하므로, 본문에서 과잉해설을 피했습니다. 사건의 배경은 본문 밖에서 추적할 수 있습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; never paraphrase beyond what the source text warrants.'
