base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
  footnotes:
  - marker: a
    text: Or 'in Egypt'; the Hebrew preposition can be read locatively, but here it likely carries the sense of judgments directed against Egypt, Pharaoh, and his household.
    reason: lexical_alternative
  - marker: b
    text: Or 'terrible' or 'harmful' signs and wonders; Hebrew 'grievous' emphasizes the devastating effect of these acts on Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 우리 눈앞에서 이집트에서[a], 바로와 그의 온 집안을 상대로[b] 크고도 두려운 표적과 이적을 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이집트를 향하여' 또는 '이집트에 대하여'. 히브리어 전치사는 장소를 가리킬 수도 있고, 문맥상 이집트가 심판의 대상임을 나타낼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그의 온 궁정'. 히브리어 '집'은 종종 가족·왕실 또는 궁정 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약명 יהוה를 제목어가 아니라 이름으로 드러내기 위해 한국어에서는 '야훼'로 옮겼습니다.
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 베푸셨습니다
  - 행하셨습니다
  lexicon: HALOT
  rationale: '''주다''의 기본 의미를 살리면서, 표적과 이적을 하나님이 백성에게 드러내 주신 것으로 자연스럽게 표현했습니다.'
- source_word: אוֹתֹת וּמֹפְתִים
  english_pob_choice: signs and wonders
  chosen_korean: 표적들과 이적들
  alternatives_korean:
  - 징표들과 기적들
  - 표징들과 놀라운 일들
  lexicon: HALOT
  rationale: 표적/이적의 쌍을 유지해 출애굽 전승의 관용적 어감을 살렸고, 본문의 병렬 구조를 한국어에서도 드러냈습니다.
- source_word: וְרָעִים
  english_pob_choice: grievous
  chosen_korean: 해로운
  alternatives_korean:
  - 무서운
  - 심각한
  - 괴로운
  lexicon: HALOT
  rationale: '''악한''으로 옮기면 하나님 행위의 도덕적 악처럼 들릴 수 있어 피하고, 이집트에 미친 파괴적 효과를 드러내는 ''해로운''을 선택했습니다.'
theological_decisions:
- issue: בְּמִצְרַיִם의 방향성
  chosen_reading: 이집트에서
  alternative_readings:
  - 이집트에 대하여
  - 이집트에
  rationale: 공간적 의미를 기본으로 두되, 이어지는 '바로와 그의 온 집안에'와의 병렬을 해치지 않도록 한국어에서는 자연스러운 장소 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
