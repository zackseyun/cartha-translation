  source_fidelity: 본문의 ‘야훼는 하나입니다’는 אֶחָד의 기본 의미를 따르려는 점에서 적절합니다. 다만 한국어에서 하나님을 가리켜 ‘하나입니다’라고 하면 자연스럽지 않으므로 ‘한 분이십니다’가 더 정확하고 관용적입니다. 압축된 히브리어의 구문적 모호성은 각주로 보존해야 합니다.
  naturalness: ‘들어라’는 해라체이므로, 지정된 현대 합쇼체와 일치하지 않습니다. ‘들으십시오’로 고쳐야 합니다. 또한 기존 각주의 ‘야훼만입니다’는 한국어 문장으로 불완전하고 의미 관계도 불명확합니다.
  terminology: ‘야훼’와 ‘우리 하나님’은 프로젝트의 용어 선택 및 히브리어 원문에 부합합니다. ‘한 분이십니다’는 하나님에 대한 합쇼체 존칭과 한국어의 자연스러운 수사를 함께 충족하며, ‘유일하십니다’처럼 배타성 해석을 본문에 선결하지 않습니다.
