  - 우리의 하나님
  lexicon: HALOT
  rationale: 형태상 복수형 어미가 있어도 언약 문맥에서는 단수로 기능하므로, 한국어에서는 표준적인 단수 호칭 '하나님'으로 옮기는 것이 가장 분명합니다.
- source_word: אֶחָד
