  - 유일하십니다
  lexicon: HALOT
  rationale: 히브리어의 가장 직접적인 의미는 '하나'이므로, 본문이 허용하는 단일성·유일성의 신학적 여지를 남기면서도 한국어 문장으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 마지막 절의 구문적 모호성
  chosen_reading: 야훼 우리 하나님, 야훼는 하나입니다.
  alternative_readings:
  - 야훼는 우리 하나님이시며, 야훼만 하나입니다.
  - 야훼 우리 하나님은 하나의 야훼이십니다.
  rationale: 히브리어는 서술구조가 압축되어 있어 '야훼는 하나입니다'와 '야훼만이다' 계열 해석이 모두 가능하므로, 본문에서는 가장 직접적인 단일성 진술을 유지하고 대안은 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it); Contested terms table for יְהוָה
