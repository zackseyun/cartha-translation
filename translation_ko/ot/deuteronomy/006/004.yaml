  rationale: 본문의 고유신명은 지칭적 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 음역형인 '야훼'로 옮겨 원문이 가진 고유명성을 보존합니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
