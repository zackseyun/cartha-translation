    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 말씀하신 대로[b], 여러분 앞에서[a] 여러분의 모든 원수를 쫓아내기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신 앞에서’이며, 적들이 길이나 눈앞에서 제거됨을 나타내는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘말씀하셨다’입니다. 여기서는 앞서 주어진 하나님의 말씀이 계속 유효하다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
