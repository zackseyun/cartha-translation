translation:
  language: ko
  text: 주님께서 말씀하신 대로, 그분이 여러분의 모든 원수를 여러분 앞에서 쫓아내시려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신 앞에서’이며, 적이 길에서 제거되는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘말씀하셨다’입니다. 여기서는 앞서 주어진 하나님의 말씀이 계속 유효하다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  english_pob_choice: to drive out
  chosen_korean: 쫓아내시려는 것입니다
  alternatives_korean:
  - 몰아내시려는 것입니다
  - 내쫓으시는 것입니다
  - 밀어내시는 것입니다
  lexicon: HALOT
  rationale: 전쟁 문맥에서 אויב를 제거하는 목적을 나타내므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘쫓아내다’를 택했습니다.
- source_word: אֹיְבֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 여러분의 모든 원수
  alternatives_korean:
  - 당신의 모든 원수
  - 여러분의 모든 적
  lexicon: HALOT
  rationale: 2인칭 단수 소유격을 한국어 공적 문체에서 자연스럽게 풀어 ‘여러분의’로 옮기고, אויב는 단순한 적대자를 넘어서는 대립 관계를 드러내기 위해 ‘원수’를 사용했습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: from before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분의 앞에서
  - 여러분의 존재 앞에서
  - 여러분의 면전에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해도 한국어에서는 어색하지 않도록 하면서, 적들이 ‘앞에서’ 제거되는 공간적 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 원어는 여호와의 이름이지만, 문맥상 직접 호명보다 서술적 진술이어서 한국어 본문에서는 ‘주님’으로 옮기고, 필요 시 주석에서 하나님의 이름을 드러낼 수 있습니다.
- source_word: דִּבֶּר
  english_pob_choice: has spoken
  chosen_korean: 말씀하신 대로
  alternatives_korean:
  - 말씀하셨습니다
  - 말씀하신 것입니다
  - 말씀해 오신 대로
  lexicon: HALOT
  rationale: 완료형의 지속적 효력을 살리기 위해 단순 과거보다 ‘말씀하신 대로’가 적절하며, 앞선 명령/약속과의 연결을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 여호와의 이름을 본문에서 직접 드러낼지 여부
  chosen_reading: 공개용 본문에서는 ‘주님’으로 번역하고, 이름 자체는 주석 처리하지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 서술문으로서 하나님의 이름을 강조하기보다, 그분이 이미 말씀하신 내용의 확실성을 강조합니다. 따라서 한국어 본문에서는 전통적으로 널리 이해되는 ‘주님’을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
