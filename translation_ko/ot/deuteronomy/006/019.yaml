  rationale: 본문의 원어는 여호와의 이름이지만, 문맥상 직접 호명보다 서술적 진술이어서 한국어 본문에서는 ‘주님’으로 옮기고, 필요 시 주석에서 하나님의 이름을 드러낼 수 있습니다.
- source_word: דִּבֶּר
  english_pob_choice: has spoken
  chosen_korean: 말씀하신 대로
  alternatives_korean:
  - 말씀하셨습니다
  - 말씀하신 것입니다
  - 말씀해 오신 대로
  lexicon: HALOT
  rationale: 완료형의 지속적 효력을 살리기 위해 단순 과거보다 ‘말씀하신 대로’가 적절하며, 앞선 명령/약속과의 연결을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 여호와의 이름을 본문에서 직접 드러낼지 여부
  chosen_reading: 공개용 본문에서는 ‘주님’으로 번역하고, 이름 자체는 주석 처리하지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 서술문으로서 하나님의 이름을 강조하기보다, 그분이 이미 말씀하신 내용의 확실성을 강조합니다. 따라서 한국어 본문에서는 전통적으로 널리 이해되는 ‘주님’을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
