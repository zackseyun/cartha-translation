base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
  footnotes:
  - marker: a
    text: Hebrew 'tomorrow'; here used idiomatically for a future time, hence 'in time to come.'
    reason: lexical_alternative
  - marker: b
    text: Or 'What are the testimonies and the statutes and the judgments...?' The Hebrew wording is more literal, while the main text brings out the implied sense of asking their meaning.
    reason: lexical_alternative
translation:
  language: ko
  text: 훗날 당신의 아들이 당신에게 묻기를, 「야훼 우리 하나님이 너희에게 명하신 증거들과 규례들과 법도들은 무엇이냐?」 하거든[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내일’은 여기서 관용적으로 장래를 가리키므로 ‘훗날’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘증거들과 규례들과 법도들은 무엇이냐?’이지만, 질문의 취지를 한국어에서 자연스럽게 살리기 위해 다듬었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִשְׁאָלְךָ ... מָחָר
  english_pob_choice: When your son asks you in time to come
  chosen_korean: 훗날 당신의 아들이 당신에게 묻기를
  alternatives_korean:
  - 그때 당신의 아들이 당신에게 묻기를
  - 장차 당신의 아들이 당신에게 묻기를
  lexicon: HALOT
  rationale: כִּי는 여기서 미래의 상황을 여는 표현이고 מָחָר는 관용적으로 ‘훗날/장차’의 뜻이므로, 미래 상황을 자연스럽게 드러내는 ‘훗날’로 옮겼습니다.
- source_word: הָעֵדֹת וְהַחֻקִּים וְהַמִּשְׁפָּטִים
  english_pob_choice: the testimonies and the statutes and the judgments
  chosen_korean: 증거들과 규례들과 법도들
  alternatives_korean:
  - 증언들과 규례들과 판단들
  - 증거들과 법률들과 판결들
  lexicon: HALOT
  rationale: 세 항목의 구별을 살리기 위해 각각 다른 한국어 대응을 유지했습니다. עֵדוֹת는 언약의 ‘증거들’, חֻקִּים은 관례적 법규의 ‘규례들’, מִשְׁפָּטִים은 판결/규범의 ‘법도들’로 번역해 중첩을 피했습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 야훼 하나님
  lexicon: HALOT
  rationale: 신명기의 언약명은 공통 번역 관행을 따르기보다 고유명 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
- source_word: צִוָּה ... אֶתְכֶם
  english_pob_choice: commanded you
  chosen_korean: 너희에게 명하신
  alternatives_korean:
  - 너희에게 명령하신
  - 너희에게 명하셨던
  lexicon: HALOT
  rationale: 원문은 복수 대상에게 주어진 명령을 가리키므로 ‘너희에게’로 살리고, 문맥상 이미 이루어진 명령을 나타내는 분사적 성격을 살려 ‘명하신’으로 옮겼습니다.
theological_decisions:
- issue: 언약 교육 장면의 직접 인용문 안에서의 호칭과 대명사
  chosen_reading: 본문 설명은 2인칭 복수 ‘너희’로 유지하고, 아들의 질문은 ‘당신’으로 자연스럽게 구분했습니다.
  alternative_readings:
  - 아들이 너에게 묻기를
  - 아들이 당신에게 묻기를
  rationale: 히브리어는 아들에게 직접 말하는 2인칭 단수/복수의 층위를 구별합니다. 한국어에서는 부모에게 묻는 상황을 자연스럽게 살리되, 질문 내용의 수신자가 공동체 전체임을 ‘너희’로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
