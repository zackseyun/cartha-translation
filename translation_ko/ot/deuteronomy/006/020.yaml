- from: 훗날 당신의 아들이 당신에게 묻기를, 「야훼 우리 하나님이 너희에게 명하신 증거들과 규례들과 법도들은 무엇이냐?」 하거든[a][b]
  to: 훗날 당신의 아들이 당신에게 ‘야훼 우리 하나님께서 너희에게 명하신 증거들과 규례들과 법도들은 무엇입니까?’ 하고 물을 때에[a]
