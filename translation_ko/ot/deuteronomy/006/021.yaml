base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were slaves to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
  footnotes:
  - marker: a
    text: Or 'and you shall say.' The Hebrew conjunction can be rendered simply 'and'; 'then' brings out the instructional sequence from the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a mighty hand.' The Hebrew idiom refers to the LORD's powerful act of deliverance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너는 네 아들에게 이렇게 말해야 합니다. ‘우리는 이집트에서 바로의 종이었으나, 야훼께서 강한 손으로 우리를 이집트에서 이끌어 내셨습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 너는 말해야 합니다.’ 히브리어 접속사는 단순한 ‘그리고’로도 옮길 수 있으나, 앞 절과의 교육적 순서를 드러내기 위해 ‘그때’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘강한 손으로.’ 히브리어 관용구는 야훼의 강력한 구원 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: then you shall say
  chosen_korean: 그때 너는 … 말해야 합니다
  alternatives_korean:
  - 그리고 너는 … 말해야 합니다
  - 너는 … 말해야 합니다
  lexicon: HALOT
  rationale: 앞 절의 지시를 이어 주는 순차적 뉘앙스를 살려 ‘그때’로 옮기고, 명령형의 지시성을 ‘말해야 합니다’로 자연스럽게 반영했습니다.
- source_word: לְבִנְךָ
  english_pob_choice: to your son
  chosen_korean: 네 아들에게
  alternatives_korean:
  - 네 자녀에게
  - 네 아들에게(남성형 유지)
  lexicon: HALOT
  rationale: 히브리어가 남성 단수 ‘아들’로 특정하므로, 성 중립화하지 않고 직접적으로 옮겼습니다.
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: HALOT
  rationale: 출애굽 서술의 예속 상태를 드러내면서도 한국어 성서 문맥에서 지나치게 낯설지 않은 ‘종’을 기본값으로 택했습니다. 다만 본문은 ‘바로의 종이었으나’로 소유·예속 관계를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전 합의된 고유한 신명 표기를 따라 대체 호칭 대신 ‘야훼’를 사용했습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 강력한 손으로
  - 능한 손으로
  - 힘센 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 하나님의 구원 행위의 강력함을 살렸고, 전통적인 ‘능한 손’보다 현대 한국어에서 더 مباشرة하게 이해되도록 했습니다.
theological_decisions:
- issue: עֲבָדִים의 한국어 대응어 선택
  chosen_reading: ‘종’으로 기본 의미를 살리되, 본문에서는 ‘바로의 종’으로 번역해 예속 관계를 분명히 했습니다.
  alternative_readings:
  - 노예
  - 종들
  - 하인
  rationale: 출애굽의 역사적·신학적 강조점은 단순한 고용 관계가 아니라 강압적 예속입니다. 한국어에서는 ‘종’이 지나친 현대화 없이도 그 관계를 드러내며, 문맥이 이미 억압성을 충분히 보강합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status terminology policy
- issue: 지시문체의 한국어 처리
  chosen_reading: 직설적 미래·의무를 ‘말해야 합니다’로 옮겼습니다.
  alternative_readings:
  - 너는 말할 것이다
  - 너는 말해야 한다
  rationale: 히브리어의 교훈적 지시를 현대 합쇼체로 자연스럽게 전달하면서, 단순 서술이 아니라 언약 교육의 명령임을 보존했습니다.
  doctrine_reference: Korean target style policy; source imperative/apodosis force
