  source_fidelity: 핵심 어휘는 대체로 충실합니다. ‘손’, ‘표’, ‘눈 사이’를 유지하고 טֹטָפֹת를 후대의 ‘경문’으로 본문에서 단정하지 않은 점이 좋습니다. 다만 ‘전두 장식이 되어야 합니다’는 히브리어의 지시적 연속을 다소 부자연스럽고 비인칭적인 의무 진술로 만들며, 첫 절의 연결형 ‘묶고’와도 문체상 균형이 맞지 않습니다.
  naturalness: ‘그것들을 손에 표로 묶고’는 수식 관계가 잠시 불분명하고, ‘눈 사이의 전두 장식이 되어야 합니다’는 현대 표준 한국어에서 어색합니다. 두 절을 각각 합쇼체 지시문으로 옮기면 자연스럽고 원문의 연속된 명령성을 더 잘 드러냅니다.
  terminology: ‘표’는 אוֹת에 적절하며, ‘전두 장식’은 드문 טֹטָפֹת를 특정 후대 물건으로 확정하지 않는 안전한 표현입니다. 각주에서는 ‘유대 관행’보다 ‘유대교 관행’이 자연스럽고 역사적 지시도 분명합니다.
