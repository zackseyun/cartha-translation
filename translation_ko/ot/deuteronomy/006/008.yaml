base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
  footnotes:
  - marker: a
    text: Or 'phylacteries,' referring to small cases worn in later Jewish practice; the Hebrew term is rare and more literally denotes forehead ornaments or bands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 손에 표로 묶고, 그것들이 눈 사이의 전두 장식이 되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경문.’ 이는 후대 유대 관행에서 사용된 작은 상자들을 가리키며, 히브리어 원어는 희귀하여 더 문자적으로는 이마 장식이나 띠를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  english_pob_choice: And you shall bind them
  chosen_korean: 그것들을 … 묶고
  alternatives_korean:
  - 그것들을 매고
  - 그것들을 묶어 두고
  lexicon: HALOT
  rationale: 명령·지시적 연속을 한국어에서는 연결어미로 처리하되, 구체적 동작인 ‘묶다’를 살려 본문의 물질적 이미지를 보존했습니다.
- source_word: לְאוֹת
  english_pob_choice: as a sign
  chosen_korean: 표로
  alternatives_korean:
  - 표로서
  - 징표로
  lexicon: HALOT
  rationale: לְ의 용법을 반영해 기능·목적을 나타내는 ‘표로’라고 옮겼습니다. ‘징표’도 가능하지만, 본문이 요구하는 상징성을 간결하게 드러내는 ‘표’가 더 직접적입니다.
- source_word: טֹטָפֹת
  english_pob_choice: as frontlets
  chosen_korean: 전두 장식이 되어야 합니다
  alternatives_korean:
  - 전두띠가 되어야 합니다
  - 이마 장식이 되어야 합니다
  - 경문이 되어야 합니다
  lexicon: HALOT
  rationale: 희귀어 טֹטָפֹת의 정확한 대상은 논쟁적이므로, 본문이 가리키는 이마 쪽 장식물을 드러내는 설명적 표현을 사용했습니다. 전통적 용어인 ‘경문’은 후대 관행을 바로 들여오기 쉬워 본문에는 두지 않았습니다.
- source_word: בֵּין עֵינֶיךָ
  english_pob_choice: between your eyes
  chosen_korean: 눈 사이의
  alternatives_korean:
  - 이마의
  - 눈앞의
  lexicon: HALOT
  rationale: 히브리어의 직역적 공간 표현을 살려 ‘눈 사이의’로 유지했습니다. 이 표현이 문자적 착용인지 상징적 표현인지 번역에서 미리 결정하지 않도록 했습니다.
theological_decisions:
- issue: 이 명령을 후대 유대인의 경문(פילקטרי) 관행으로 특정할지, 본문의 일반적·상징적 지시로 남길지
  chosen_reading: 본문의 구체적 신체 이미지를 유지하되, 후대 관행으로 단정하지 않습니다.
  alternative_readings:
  - ‘경문’으로 번역해 후대 관행을 직접 반영함
  - 완전히 비유적으로 풀어 ‘항상 기억하라’로 의역함
  rationale: 히브리어는 실제 신체 부착을 연상시키는 구체적 표현을 사용하지만, 그 범위와 방식은 본문만으로 확정되지 않습니다. 따라서 번역은 긴장을 해소하지 않고 그대로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
