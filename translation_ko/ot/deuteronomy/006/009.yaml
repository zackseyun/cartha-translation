  text: 그것들을 집의 문설주와 네 성문에 기록하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְזוּזֹת는 문의 좌우 기둥, 곧 문설주를 가리킵니다.
