lexical_decisions:
- source_word: וּכְתַבְתָּם
  english_pob_choice: You shall write them
  chosen_korean: 기록하십시오
  alternatives_korean:
  - 쓰십시오
  - 적으십시오
  lexicon: HALOT
  rationale: 명령형으로 기능하는 동사이므로 현대 합쇼체 명령으로 옮겼고, 돌이나 표면에 새겨 두는 맥락을 고려해 단순한 ‘쓰기’보다 ‘기록하다’가 더 자연스럽습니다.
- source_word: מְזוּזֹת
  english_pob_choice: doorposts
  chosen_korean: 문설주
  alternatives_korean:
  - 문틀
  - 문기둥
  - 문짝
  lexicon: HALOT
  rationale: 히브리어는 문의 좌우 기둥/세로재를 가리키므로, ‘문설주’가 가장 정확하고 한국어 성경 문맥에서도 익숙한 대응입니다.
- source_word: בֵּיתֶךָ
  english_pob_choice: of your house
  chosen_korean: 집의
  alternatives_korean:
  - 가정의
  - 집안의
  lexicon: HALOT
  rationale: ‘집’이 הבית의 구체적 건축·거처 의미를 가장 직접적으로 보존하며, 소유격 구조도 자연스럽게 살릴 수 있습니다.
- source_word: וּבִשְׁעָרֶיךָ
  english_pob_choice: and on your gates
  chosen_korean: 네 성문에
  alternatives_korean:
  - 네 문들에
  - 네 문어귀에
  - 네 성문들과 그 문설주에
  lexicon: HALOT
  rationale: שַׁעַר는 단순한 문보다 성읍/거처의 출입구를 가리키므로 ‘성문’이 폭넓은 출입구 의미를 보존합니다. 장소를 나타내는 전치사 기능은 한국어 조사 ‘에’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 계명 기록의 적용 범위와 문자성
  chosen_reading: 본문은 언약 말씀을 물리적으로 문설주와 성문에 적어 두라는 직접 명령으로 옮겼습니다.
  alternative_readings:
  - 비유적으로 가정과 공동체 전반에 새기라는 뜻으로 완화
  - ‘적어 두다’로 낮춰 상징성을 강조
  rationale: 히브리어 동사와 장소 표지가 구체적 실천을 지시하므로, 상징화하거나 약화하지 않고 직접적 의미를 유지했습니다.
  doctrine_reference: 신명기 6장 쉐마 전승, 언약 순종의 가시적 표지
