translation:
  language: ko
  text: 야훼를 잊지 않도록 조심하십시오. 그분은 당신들을 이집트 땅에서, 노예살이하던 집에서 이끌어 내신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘노예들의 집’입니다. 이 표현은 이스라엘이 노예로 있던 곳, 곧 ‘노예 상태의 집’을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful
