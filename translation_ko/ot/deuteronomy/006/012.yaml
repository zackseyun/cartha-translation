  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’을 유지해 히브리어의 관용적 이미지와 병행 구조를 살리고, עֲבָדִים는 문맥상 소속/상태를 드러내는 ‘종들’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 신명표가 직접 나오므로, 계시된 언약 이름을 제목어로 대체하지 않고 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עֲבָדִים의 사회적 실재성
  chosen_reading: ‘종들’로 옮겨 예속 상태를 드러냈습니다.
  alternative_readings:
  - 노예들
  - 노역자들
  - 종살이
  rationale: 출애굽의 기억을 상기시키는 문맥에서 이집트의 억압적 예속을 흐리지 않도록, 관습적 완곡어보다 구체성을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status language principle
