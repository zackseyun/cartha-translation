  lexicon: HALOT
  rationale: ‘땅’을 유지해 히브리어의 표현을 보존하면서, 현대 한국어에서는 ‘이집트 땅’이 가장 자연스럽습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: out of the house of slaves
  chosen_korean: 종들의 집
