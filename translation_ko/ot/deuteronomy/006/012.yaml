source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of slaves.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'from the house of slavery.' The Hebrew is literally 'from the house of slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 조심하십시오. 당신이 야훼를 잊지 않도록 하십시오. 그분은 당신을 이집트 땅, 곧 종들의 집에서 이끌어 내신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종들의 집’은 히브리어를 더 직역하면 ‘종들의 집’이며, 관용적으로는 ‘종살이의 집’ 또는 ‘노예 상태의 집’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 경계하십시오
  - 스스로 조심하십시오
  lexicon: HALOT
  rationale: 경고의 뉘앙스를 살리면서 현대 한국어에서 자연스럽고 직접적인 명령으로 옮겼습니다.
- source_word: תִּשְׁכַּח
  english_pob_choice: you forget
  chosen_korean: 잊지 않도록 하십시오
  alternatives_korean:
  - 잊으십시오
  - 잊을까 조심하십시오
  - 잊지 마십시오
  lexicon: HALOT
  rationale: פֶּן이 이끄는 경고 구조를 살려 부정 목적형으로 옮기되, 합쇼체에 맞게 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기를 전통적 대체어로 바꾸지 않고, 프로젝트 기본 용례에 따라 고유명사로 음역했습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 애굽 땅
  - 이집트에서
  - 이집트 땅에서
  lexicon: HALOT
  rationale: ‘땅’을 유지해 히브리어의 표현을 보존하면서, 현대 한국어에서는 ‘이집트 땅’이 가장 자연스럽습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: out of the house of slaves
  chosen_korean: 종들의 집
  alternatives_korean:
  - 노예들의 집
  - 노예 신세의 집
  - 노예 상태의 집
  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’을 유지해 히브리어의 관용적 이미지와 병행 구조를 살리고, עֲבָדִים는 문맥상 소속/상태를 드러내는 ‘종들’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 신명표가 직접 나오므로, 계시된 언약 이름을 제목어로 대체하지 않고 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עֲבָדִים의 사회적 실재성
  chosen_reading: ‘종들’로 옮겨 예속 상태를 드러냈습니다.
  alternative_readings:
  - 노예들
  - 노역자들
  - 종살이
  rationale: 출애굽의 기억을 상기시키는 문맥에서 이집트의 억압적 예속을 흐리지 않도록, 관습적 완곡어보다 구체성을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status language principle
