  source_fidelity: 개정이 필요합니다. 초안의 ‘조상들에게 맹세하신 그 땅’은 히브리어의 맹세 내용(‘당신에게 주시겠다고’)을 충분히 드러내지 못하며, 이어지는 ‘성읍들’을 주시는 목적·결과와의 연결도 다소 불분명합니다. 원문의 수여 약속과 성읍의 비건축성을 명시하는 편이 더 충실합니다.
  naturalness: ‘당신’의 반복은 원문 인칭을 보존하지만, 문장 구조상 수여의 대상과 맹세를 받은 대상을 분명히 배열하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다. ‘성읍’은 고대의 עיר를 가리키는 성서 문맥에 적합하며, ‘도시’보다 작은 정착지까지 포괄할 수 있습니다.
  terminology: ‘야훼’는 영어 POB 및 제시된 정책과 일치합니다. ‘조상들’은 한국어로 자연스러운 번역이지만, 히브리어 אָבוֹת의 남성 친족어를 투명하게 알리는 각주를 유지해야 합니다. 아브라함, 이삭, 야곱의 이름도 정확합니다.
