base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
  footnotes:
  - marker: a
    text: Or 'your ancestors.' The Hebrew says 'your fathers,' and the context specifically names Abraham, Isaac, and Jacob.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님께서 당신을 당신의 조상들에게—아브라함과 이삭과 야곱에게—맹세하신 그 땅으로 인도하여 들어가게 하실 때, 당신이 짓지 않은 크고 좋은 도시들을 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들’은 직역 ‘아버지들’의 한국어 자연화입니다. 문맥은 아브라함, 이삭, 야곱을 구체적으로 지시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 언약명 יהוה를 제목어로 바꾸지 않고 음역으로 보존했습니다. POB의 ‘Yahweh’ 선택을 따라 한국어도 ‘야훼’로 옮겨 신적 고유성을 유지했습니다.
- source_word: יְבִיאֲךָ
  english_pob_choice: brings you into
  chosen_korean: 인도하여 들어가게 하실 때
  alternatives_korean:
  - 데려가실 때
  - 들여보내실 때
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 단순 이동이 아니라 ‘들어가게 하다’의 인도성을 드러냈습니다. 문맥상 약속의 땅으로의 진입을 자연스럽게 표현합니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 당신의 조상들에게
  alternatives_korean:
  - 당신의 아버지들에게
  - 당신의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 남성 복수지만, 한국어 ‘아버지들’은 부자연스러워서 POB 주석의 허용 범위 안에서 ‘조상들’로 옮겼습니다. 이어지는 아브라함, 이삭, 야곱의 명시가 그 의미를 분명히 합니다.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  english_pob_choice: great and good cities
  chosen_korean: 크고 좋은 도시들
  alternatives_korean:
  - 크고 훌륭한 도시들
  - 크고 아름다운 도시들
  lexicon: HALOT
  rationale: גדול은 크기, טוב는 질적 선함/좋음을 가리키므로 이를 직역에 가깝게 반영했습니다. ‘좋은’은 원문의 평가를 과하게 풀지 않으면서도 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼로 표기된 신명기 서술의 신명 사용
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기하고 ‘주’로 대체하지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 언약의 역사와 맹세를 강조하므로, 하나님의 고유명을 보존하는 것이 원문의 신학적 강도를 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לַאֲבֹתֶיךָ의 친족 용어 처리
  chosen_reading: 남성 복수의 친족어를 한국어에서는 ‘조상들’로 옮겼습니다.
  alternative_readings:
  - 아버지들
  - 선조들
  rationale: 히브리어의 성별 정보를 완전히 지우지 않으면서도, 한국어에서 자연스럽고 문맥상 명확한 표현을 택했습니다. 바로 뒤의 족장 명단이 이 지시 대상을 구체화합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
