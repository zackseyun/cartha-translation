  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: ko
  text: 여호와께서 우리에게 이 모든 규례를 지키라 명령하셨습니다. 곧 여호와 우리 하나님을 경외하여 우리에게 복이 되게 하시고, 오늘과 같이 우리를 살게 하시려는 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 유익을 위해’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּנוּ / commanded us
  english_pob_choice: commanded us
  chosen_korean: 우리에게 ... 명령하셨습니다
  alternatives_korean:
  - 우리에게 ... 이르셨습니다
  - 우리에게 ... 명하셨습니다
  lexicon: צוה
  rationale: 원문의 명령 행위를 분명히 드러내기 위해 ‘명령하셨습니다’를 택했습니다.
- source_word: יְהוָה / LORD
  english_pob_choice: the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: יהוה
  rationale: 히브리어 본문의 신명기적 하나님의 고유명을 직접 반영하기 위해 표준 번역 관행에 따라 ‘여호와’를 사용했습니다.
- source_word: לְיִרְאָה אֶת־יְהוָה / to fear the LORD
  english_pob_choice: to fear the LORD our God
  chosen_korean: 여호와 우리 하나님을 경외하여
  alternatives_korean:
  - 여호와 우리 하나님을 두려워하여
  - 여호와 우리 하나님을 경외하도록
  lexicon: ירא
  rationale: 단순한 공포보다 언약적 경외를 가리키므로 ‘경외하다’를 택했고, 목적을 자연스럽게 살리기 위해 연결어 ‘하여’를 사용했습니다.
- source_word: לְטוֹב לָנוּ / for our good
  english_pob_choice: for our good
  chosen_korean: 우리에게 복이 되게 하시고
  alternatives_korean:
  - 우리의 유익을 위해
  - 우리의 좋은 것을 위해
  lexicon: טוב
  rationale: 문맥상 규례의 목적이 백성의 선과 복리에 있음을 살려 ‘복이 되게 하시고’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 목적/결과 관계
  chosen_reading: 규례 준수와 경외는 하나님이 우리에게 복을 주시고 생명을 보존하시려는 선한 উদ্দেশ과 연결됩니다.
  alternative_readings:
  - 단순 병렬 진술로 읽기
  - ‘우리에게 좋게 하시려는 것’으로만 완화해 읽기
  rationale: 원문은 ‘지키라—경외하라—우리의 유익—우리의 생명 보존’의 목적사슬을 이루므로, 그 신학적 인과를 보존했습니다.
  doctrine_reference: 신명기 6장 언약 순종과 생명
