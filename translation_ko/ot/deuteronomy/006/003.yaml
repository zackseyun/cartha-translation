  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ יִשְׂרָאֵל֙ וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וַ/אֲשֶׁ֥ר תִּרְבּ֖וּ/ן מְאֹ֑ד כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or, 'the God of your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'as the LORD, the God of your fathers, promised you, a land flowing with milk and honey.' The Hebrew wording is compressed and can be understood with 'a land flowing with milk and honey' in apposition to what the LORD spoke concerning.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘아, 들으시고 그것을 행하도록 주의하십시오. 그러면 당신에게 잘되고, 당신들이 크게 번성하게 될 것입니다. 이는 야훼, 당신들의 조상의 하나님이 당신들에게 말씀하신 대로입니다. 곧 젖과 꿀이 흐르는 그 땅에서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신들의 조상의 하나님’입니다. 히브리어는 ‘당신들의 아버지들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼, 당신들의 조상의 하나님이 당신들에게 약속하신 대로, 젖과 꿀이 흐르는 땅에서’입니다. 히브리어 구문은 압축되어 있어 ‘젖과 꿀이 흐르는 땅’이 야훼께서 말씀하신 내용에 동격으로 연결될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  english_pob_choice: hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으십시오
  - 들으시며
  - 들으라
  lexicon: HALOT
  rationale: שׁמע는 문맥에 따라 ‘듣다/경청하다/순종하다’의 폭이 있으므로, 호명된 이스라엘에게 하는 직접 요청으로서 ‘들으시고’로 옮겨 청취와 응답 가능성을 함께 살렸습니다.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  english_pob_choice: be careful to do it
  chosen_korean: 그것을 행하도록 주의하십시오
  alternatives_korean:
  - 지켜서 행하십시오
  - 행하도록 조심하십시오
  - 주의하여 행하십시오
  lexicon: HALOT
  rationale: שׁמר + 부정사 구조의 ‘주의 깊은 준수 후 실행’ 의미를 살려, 단순한 내적 보존이 아니라 실제 실행까지 포함하도록 표현했습니다.
- source_word: אֲשֶׁר יִיטַב לְךָ / וַאֲשֶׁר תִּרְבּוּן מְאֹד
  english_pob_choice: that it may go well with you ... that you may multiply greatly
  chosen_korean: 그러면 당신에게 잘되고, 당신들이 크게 번성하게 될 것입니다
  alternatives_korean:
  - 그러면 당신에게 복이 있고, 당신들이 크게 많아지게 될 것입니다
  - 그러면 당신에게 좋고, 당신들이 크게 증가하게 될 것입니다
  lexicon: HALOT
  rationale: 신명기의 전형적 복 약속 표현을 ‘잘되다’로 살리고, רבה의 수적 증대를 ‘번성하다’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 신적 고유명사를 보존하기 위해 관례적 대체호칭이 아니라 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  english_pob_choice: the God of your fathers
  chosen_korean: 당신들의 조상의 하나님
  alternatives_korean:
  - 당신들의 아버지들의 하나님
  - 당신들의 조상들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 ‘아버지들’ 계열 표현을 한국어에서 가장 자연스럽고 문맥상 무리 없이 전달하는 방식으로 ‘조상’으로 옮겼습니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: in a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 그 땅에서
  alternatives_korean:
  - 젖과 꿀이 흐르는 땅에서
  - 젖과 꿀이 흐르는 그 땅 안에서
  lexicon: HALOT
  rationale: ‘흐르는 젖과 꿀’이라는 고정된 약속의 땅 묘사를 보존하되, 영어 수정안의 연결 관계를 따라 장소 부사구로 자연스럽게 맺었습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 여호와 대용 제목이 아니라 언약적 고유명사를 직접 사용하므로, 본문 감각을 살리기 위해 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 이스라엘에 대한 명령형 존대
  chosen_reading: 이스라엘아, 들으시고 ... 주의하십시오
  alternative_readings:
  - 이스라엘아, 들으라 ... 주의하라
  - 이스라엘아, 들으십시오 ... 주의하십시오
  rationale: 직접 호소가 포함된 모세의 권면을 현대 합쇼체로 옮기되, 성경 본문 고유의 엄중한 권면 성격은 유지했습니다.
  doctrine_reference: POB Korean style guide
