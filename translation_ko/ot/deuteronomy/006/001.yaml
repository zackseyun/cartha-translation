  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: Now this is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
  footnotes:
  - marker: a
    text: Or 'And this is the commandment—the statutes and the judgments.' The opening conjunction can be rendered 'and,' and 'judgments' may also be translated 'ordinances.'
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH; alternatively, some translations use ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Or 'to take possession of it' or 'to inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것이 그 명령, 곧 야훼 여러분의 하나님께서 여러분을 가르치도록 명령하신 규례들과 법규들입니다. 여러분이 건너가 들어가는 그 땅에서 그것들을 행하고 그 땅을 차지하도록 하신 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법규들’은 여기서 משפטים의 법적·판정적 뉘앙스를 살린 번역입니다. 다른 번역 가능성으로는 ‘판결들’ 또는 ‘법령들’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 히브리어 본문의 신명 יְהוָה를 옮긴 것입니다. 전통적 교회 번역에서는 이를 ‘여호와’로 표기하거나 ‘주님’으로 번역하기도 합니다.
    reason: source_note
  - marker: c
    text: ‘차지하다’는 לָרִשְׁתָּהּ의 점유·상속의 뜻을 간결하게 옮긴 것입니다. 다른 가능성으로는 ‘소유하다’, ‘차지하여 소유하다’ 또는 ‘상속받다’가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת / הַמִּצְוָה
  english_pob_choice: Now this is the commandment
  chosen_korean: 이것이 곧 그 명령입니다
  alternatives_korean:
  - 그리고 이것이 그 명령입니다
  - 이것이 그 계명입니다
  lexicon: HALOT
  rationale: 여기서는 새 단락을 여는 연결사와 지시어를 살려 '이것이 곧'으로 옮겼고, מִצְוָה는 앞뒤 문맥을 포괄하는 단일 지시로서 '명령'이 자연스럽습니다.
- source_word: הַחֻקִּים וְהַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 곧 규례들과 법규들
  alternatives_korean:
  - 곧 규례들과 판단들
  - 곧 율례들과 규례들
  lexicon: HALOT
  rationale: חֻקִּים은 고정된 규정이라는 점을 살려 '규례들'로, מִשְׁפָּטִים은 법적 판결·규정의 뉘앙스를 살려 '법규들'로 옮겨 두 범주의 구분을 유지했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 여호와 여러분의 하나님
  lexicon: HALOT
  rationale: השם הנגלה of the divine name is preserved as '야훼' in line with the project default, and the 2인칭 복수는 문체상 '여러분의'로 공손하게 처리했습니다.
- source_word: לְלַמֵּד אֶתְכֶם
  english_pob_choice: to teach you
  chosen_korean: 가르치라고
  alternatives_korean:
  - 가르치도록
  - 가르쳐 주시라고
  lexicon: HALOT
  rationale: 동사의 목적을 드러내는 부정사 용법을 한국어 명령 목적형으로 자연스럽게 옮겨, 뒤의 행위 목적절과 잘 이어지도록 했습니다.
- source_word: לַעֲשׂוֹת ... לְרִשְׁתָּהּ
  english_pob_choice: so that you may do them ... to possess it
  chosen_korean: 여러분이 건너가 들어가는 그 땅에서 그것들을 행하여 그것을 차지하게 하려는 것입니다
  alternatives_korean:
  - 여러분이 들어가 차지할 그 땅에서 그것들을 행하게 하려는 것입니다
  - 여러분이 건너가 들어가는 땅에서 그것들을 실천하여 그것을 얻으려는 것입니다
  lexicon: HALOT
  rationale: ‘행하다’는 מצוות을 실제로 수행한다는 의미를 유지하고, רִשְׁתָּהּ는 단순한 소유보다 적극적 점유의 뜻이 있어 '차지하다'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה 번역
  chosen_reading: '''야훼''를 본문에 직접 사용했습니다.'
  alternative_readings:
  - '''주님'''
  - '''여호와'''
  rationale: 본문의 고유한 신명성을 가리기보다 원문 그대로 드러내는 것이 이 절의 계시적 성격과 공적 가시성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 단수 '명령'과 복수 '규례들/법규들'의 관계
  chosen_reading: 단수 헤딩 뒤에 복수 항목을 덧붙이는 구조를 유지했습니다.
  alternative_readings:
  - 모두 복수로 평준화하여 '명령들, 규례들, 법규들'
  - 단순화하여 '이것이 곧 율법입니다'
  rationale: 히브리어의 단수-복수 대비를 지워 버리면 원문의 요약+확장 구조가 약화되므로, 본문의 구조를 드러내는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
