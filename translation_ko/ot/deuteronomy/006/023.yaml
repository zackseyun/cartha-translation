language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
  footnotes:
  - marker: a
    text: 'Or ''to our ancestors.'' Hebrew: ''to our fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분이 우리를 거기서 이끌어 내셨으니, 우리를 이끌어 들이셔서 그 조상들에게 맹세하신 땅을 우리에게 주시려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 조상들.’ 히브리어는 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתָנוּ / And us
  english_pob_choice: And us
  chosen_korean: 그리고 우리를
  alternatives_korean:
  - 또 우리를
  - 그리하여 우리를
  lexicon: HALOT
  rationale: 문두의 접속과 대상을 함께 살리되, 한국어에서는 자연스럽게 ‘그리고 우리를’로 이어 주어 문맥의 연속성을 유지했습니다.
- source_word: הוֹצִיא
  english_pob_choice: brought ... out
  chosen_korean: 이끌어 내셨으니
  alternatives_korean:
  - 데리고 나오셨으니
  - 꺼내셨으니
  lexicon: HALOT
  rationale: 출애굽의 관용적 동사를 살리면서도 현대 한국어에서 자연스러운 동작성을 위해 ‘이끌어 내다’로 옮겼습니다.
- source_word: הָבִיא אֹתָנוּ
  english_pob_choice: he might bring us in
  chosen_korean: 우리를 이끌어 들이셔서
  alternatives_korean:
  - 우리를 들이시려
  - 우리를 데리고 들어오셔서
  lexicon: HALOT
  rationale: ‘brought us out’와 대응되는 출입 구조를 살리기 위해 ‘이끌어 들이시다’를 택했고, 목적절의 흐름에 맞게 연결했습니다.
- source_word: לָתֵת לָנוּ אֶת הָאָרֶץ
  english_pob_choice: to give us the land
  chosen_korean: 그 땅을 우리에게 주시려는
  alternatives_korean:
  - 그 땅을 우리에게 주려고
  - 그 땅을 우리에게 주시기 위해
  lexicon: HALOT
  rationale: 주시는 행위의 목적을 분명히 하되, 한국어 목적 표현으로 ‘주시려는’이 가장 매끈하여 선택했습니다.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵינוּ
  english_pob_choice: that he swore to our fathers
  chosen_korean: 그 조상들에게 맹세하신
  alternatives_korean:
  - 우리 조상들에게 맹세하신
  - 우리의 아버지들에게 맹세하신
  lexicon: HALOT
  rationale: 히브리어의 ‘우리의 아버지들’은 언약 조상들을 가리키므로, 영어 주석의 대안도 반영해 ‘조상들’로 옮기되 맹세 언어는 보존했습니다.
theological_decisions:
- issue: לַאֲבֹתֵינוּ의 가족-언약 지시 대상
  chosen_reading: 그 조상들
  alternative_readings:
  - 우리의 아버지들
  - 우리 조상들
  rationale: 직역상 ‘아버지들’이 가능하지만, 한국어에서는 언약적 가리킴을 더 분명히 하면서도 남성 친족표현의 협소함을 피하기 위해 ‘조상들’로 처리했습니다. 영어 POB의 각주 취지와도 부합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: נִשְׁבַּע의 언약적 맹세
  chosen_reading: 맹세하신
  alternative_readings:
  - 약속하신
  rationale: 본문은 단순한 약속보다 하나님이 맹세로 보증하신 언약의 무게를 강조하므로, 그 신학적 강도를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
