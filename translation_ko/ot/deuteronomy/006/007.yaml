  source_fidelity: ‘그것을 말해야 합니다’는 히브리어 דִּבֶּר בְּ의 대상-전치사 구문을 충분히 반영하지 못합니다. ‘그것에 대하여 말해야 합니다’가 ‘그 말씀에 대해 말하다’라는 뜻을 더 정확히 드러냅니다. 또한 2인칭 단수 소유를 일반적인 높임말 ‘당신의’로 옮기면 현대 한국어에서 하나님을 직접 높여 부르는 듯한 어감이 생길 수 있으므로, 본문의 수신자를 가리키는 ‘네’가 더 적절합니다.
  naturalness: ‘집에 앉아 있을 때’와 ‘길을 걸을 때’는 자연스럽습니다. 병렬을 ‘때에나’로 통일하고 ‘누울 때’를 사용하면 간결하면서도 원문의 일상적 시간 상황을 잘 살립니다.
  terminology: ‘아들들’은 남성 복수인 בָּנִים을 보존하는 적절한 선택입니다. שׁנן의 반복적·세심한 교육의 강도는 ‘부지런히 가르치다’로 무난하게 반영됩니다. 각주 표지는 해당 어휘 바로 뒤에 배치하여 내용과 표지의 연결을 바로잡았습니다.
