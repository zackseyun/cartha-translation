source:
  edition: WLC
  text: וְ/שִׁנַּנְתָּ֣/ם לְ/בָנֶ֔י/ךָ וְ/דִבַּרְתָּ֖ בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
  footnotes:
  - marker: a
    text: Or 'impress them on'; the Hebrew verb literally has the sense of sharpening, here used metaphorically for repeated, careful instruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your sons'; by extension this instruction applies within the household more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 말씀을 당신의 아들들에게 부지런히 가르치고, 집에 앉아 있을 때나 길을 걸을 때나 누워 있을 때나 일어날 때에 그것을 말해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아들들’이므로, 본문은 원문 형식을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 시간표현은 집 안에서의 일상 전체를 포괄하는 반복적 상황을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  english_pob_choice: you shall teach them diligently
  chosen_korean: 부지런히 가르치고
  alternatives_korean:
  - 날카롭게 하여
  - 되새겨 가르치고
  - 깊이 새겨 가르치고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘날을 세우다/날카롭게 하다’의 뜻이지만, 여기서는 반복적이고 세심한 교육을 가리키므로 ‘부지런히 가르치고’로 옮겨 원문의 강한 교육적 뉘앙스를 자연스럽게 살렸습니다.
- source_word: לְבָנֶיךָ
  english_pob_choice: to your sons
  chosen_korean: 당신의 아들들에게
  alternatives_korean:
  - 당신의 자녀들에게
  - 당신의 아들들에게
  lexicon: HALOT
  rationale: 히브리어는 2인칭 남성 단수 소유가 붙은 복수형 ‘아들들’이므로, 성별이 드러나는 원형을 유지해 ‘아들들에게’로 옮겼습니다.
- source_word: וְדִבַּרְתָּ בָּם
  english_pob_choice: and you shall speak of them
  chosen_korean: 그것을 말해야 합니다
  alternatives_korean:
  - 그것에 대해 말해야 합니다
  - 그것들을 말해야 합니다
  - 그것을 이야기해야 합니다
  lexicon: HALOT
  rationale: דבר 뒤의 전치사 ב는 관용적으로 ‘~에 대해/말하다’의 뜻이므로, 문맥상 자연한 ‘그것을 말하다’로 풀어 너무 구어적이거나 직역투인 표현을 피했습니다.
- source_word: בְּשִׁבְתְּךָ ... וּבְקוּמֶךָ
  english_pob_choice: when you sit ... and when you rise
  chosen_korean: 집에 앉아 있을 때나 ... 일어날 때에
  alternatives_korean:
  - 집에 앉을 때나 ... 일어날 때나
  - 집에 있을 때나 ... 일어날 때나
  - 집에 앉아 있을 때나 ... 잠자리에 들 때나 일어날 때에
  lexicon: HALOT
  rationale: 일련의 시간 부사구를 한국어의 자연스러운 일상 리듬으로 옮겨, ‘앉아 있을 때/일어날 때’의 반복적 상시성을 살렸습니다.
theological_decisions:
- issue: 성별이 명시된 교육 대상 유지
  chosen_reading: ‘아들들’이라는 원문 성별 표지를 본문에서 유지합니다.
  alternative_readings:
  - ‘자녀들’로 일반화한다
  rationale: 본문은 בנים의 문법적·어휘적 형태를 분명히 드러내므로, 의미 확장을 본문이 아닌 주석적 범위로 두는 편이 원문에 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
