  source_fidelity: 개정이 필요합니다. 초안은 마지막 ‘그분께서 우리에게 명령하신 그대로입니다’를 독립 문장으로 처리하여 כַּאֲשֶׁר צִוָּנוּ가 ‘지켜 행하다’를 수식하는 원문 구조를 잃었습니다. 또한 יְהוָה를 본문에서 ‘주’로 바꾼 것은 고유명 ‘야훼’를 보존하는 POB 원칙 및 영어 감사 기록과 맞지 않습니다.
  naturalness: ‘그분께서 우리에게 명령하신 그대로’는 행위 조건 안에 배치하면 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 조건절 구조도 명확해집니다.
  terminology: צְדָקָה는 교리적으로 과도하게 한정하지 않는 ‘의’로 유지할 수 있습니다. יְהוָה는 ‘야훼’로 옮겨야 하며, אֱלֹהֵינוּ는 ‘우리 하나님’으로 유지합니다. 단수 מִצְוָה의 통합적 성격은 본문 ‘이 모든 명령’ 및 각주에서 보완합니다.
