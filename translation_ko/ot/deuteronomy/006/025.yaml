  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
  footnotes:
  - marker: a
    text: Or 'justice for us.' The Hebrew צְדָקָה can denote what is right or just, though 'righteousness' best fits this covenantal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'this whole commandment.' The singular 'commandment' likely refers to the instruction as a unified whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 야훼 우리 하나님 앞에서 그분께서 우리에게 명령하신 그대로 이 모든 명령을 지켜 행하면, 그것이 우리에게 의[a]가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’입니다. 히브리어 צְדָקָה는 옳음이나 정의를 뜻할 수도 있으나, 이 언약적 문맥에서는 ‘의’가 더 잘 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 전체 명령’입니다. 히브리어 ‘명령’은 단수형이며, 여기서는 하나로 통합된 지시를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צְדָקָה는 여기서 언약적 맥락의 ‘의’로 이해하는 것이 자연스럽고, ‘정의’보다 하나님 앞에서의 올바름과 적절함을 더 잘 드러냅니다.
- source_word: תִּהְיֶה לָּנוּ
  english_pob_choice: it will be ... for us
  chosen_korean: 우리에게 … 될 것입니다
  alternatives_korean:
  - 우리에게 …일 것입니다
  - 우리 것으로 여겨질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 서술적 구조를 살려 직역에 가깝게 옮기되, 한국어 문장으로 자연스럽게 다듬었습니다.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: we are careful to do
  chosen_korean: 지켜 행하면
  alternatives_korean:
  - 조심하여 행하면
  - 지키며 행하면
  lexicon: HALOT
  rationale: שׁמר+עשה의 결합은 단순한 ‘지키다’보다 ‘주의 깊게 지키며 행하다’의 뉘앙스가 있어, 간결하게 ‘지켜 행하다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 야훼 우리 하나님
  - 여호와 우리 하나님
  lexicon: HALOT
  rationale: 본문의 고유명은 원칙상 ‘야훼’가 바람직하지만, 여기서는 한국어 독자에게 더 자연스럽고 경건한 호칭인 ‘주 우리 하나님’으로 처리해 문맥의 공적 낭독성을 살렸습니다.
theological_decisions:
- issue: צְדָקָה를 ‘의’로 옮길 때의 언약적 의미
  chosen_reading: 이 구절은 순종이 하나님 앞에서 ‘의’로 간주된다는 언약적 진술을 말하며, 이후의 교리적 체계로 과도하게 좁히지 않습니다.
  alternative_readings:
  - 순종이 우리에게 ‘정의’가 된다
  - 법정적 ‘의롭다 하심’으로만 한정한다
  rationale: 히브리어 자체는 실제 순종과 의의 연결을 말하지만, 그 의미를 한 가지 신학 체계로만 환원할 근거는 없습니다.
  doctrine_reference: 언약적 의의 진술을 그대로 보존합니다.
