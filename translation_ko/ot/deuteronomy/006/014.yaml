lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  english_pob_choice: You shall not go after
  chosen_korean: 따라가서는 안 됩니다
  alternatives_korean:
  - 뒤따라가서는 안 됩니다
  - 쫓아가서는 안 됩니다
  lexicon: HALOT
  rationale: ‘가다’의 히브리어 관용구를 한국어의 자연스러운 금지 표현 ‘따라가다’로 옮겨, 단순 이동이 아니라 충성·추종의 의미를 살렸습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 하나님들
  - 외국 신들
  lexicon: HALOT
  rationale: 본문의 대조는 야훼 외의 신적 존재들을 가리키므로, 문맥을 과도하게 좁히지 않는 ‘다른 신들’이 가장 직접적입니다.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  english_pob_choice: the gods of the peoples
  chosen_korean: 민족들의 신들
  alternatives_korean:
  - 백성들의 신들
  - 나라들의 신들
  lexicon: HALOT
  rationale: 여기서 הָעַמִּים은 주변의 집단들을 가리키므로 ‘민족들’이 자연스럽고, 소유 관계를 한국어로 간결하게 드러내기 위해 ‘민족들의 신들’로 옮겼습니다.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  english_pob_choice: who are around you
  chosen_korean: 너희 주위에 있는
  alternatives_korean:
  - 너희를 둘러싼
  - 너희 주변에 있는
  lexicon: HALOT
  rationale: 상대절이 ‘민족들’을 꾸미는 만큼, 위치 관계를 분명하게 드러내는 ‘너희 주위에 있는’이 가장 자연스럽습니다.
theological_decisions:
- issue: אַחֲרֵי의 금지 의미
  chosen_reading: 여기서는 단순한 이동 금지가 아니라, 다른 신들을 향한 추종과 충성을 금하는 언약적 명령으로 읽습니다.
  alternative_readings:
  - 우상 제단 쪽으로 물리적으로 가는 행위만 금하는 것으로 읽기
  rationale: 신명기에서 ‘~을 따르다’는 반복적으로 예배적 충성과 소속을 뜻하므로, 직역을 유지하되 의미를 축소하지 않도록 번역했습니다.
  doctrine_reference: 신명기 6장 전체의 언약 충성 주제
