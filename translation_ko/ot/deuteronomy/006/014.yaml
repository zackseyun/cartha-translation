- issue: אַחֲרֵי의 금지 의미
  chosen_reading: 여기서는 단순한 이동 금지가 아니라, 다른 신들을 향한 추종과 충성을 금하는 언약적 명령으로 읽습니다.
  alternative_readings:
  - 우상 제단 쪽으로 물리적으로 가는 행위만 금하는 것으로 읽기
  rationale: 신명기에서 ‘~을 따르다’는 반복적으로 예배적 충성과 소속을 뜻하므로, 직역을 유지하되 의미를 축소하지 않도록 번역했습니다.
  doctrine_reference: 신명기 6장 전체의 언약 충성 주제
