  rationale: 본문의 대조는 야훼 외의 신적 존재들을 가리키므로, 문맥을 과도하게 좁히지 않는 ‘다른 신들’이 가장 직접적입니다.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  english_pob_choice: the gods of the peoples
  chosen_korean: 민족들의 신들
  alternatives_korean:
