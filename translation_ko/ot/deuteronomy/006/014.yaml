  - 나라들의 신들
  lexicon: HALOT
  rationale: 여기서 הָעַמִּים은 주변의 집단들을 가리키므로 ‘민족들’이 자연스럽고, 소유 관계를 한국어로 간결하게 드러내기 위해 ‘민족들의 신들’로 옮겼습니다.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  english_pob_choice: who are around you
  chosen_korean: 너희 주위에 있는
