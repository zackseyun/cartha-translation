  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 관용적 대체어가 아니라 ‘야훼’를 사용했습니다.
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  english_pob_choice: his statutes and his commandments
  chosen_korean: 그의 모든 규례와 그의 모든 계명
  alternatives_korean:
  - 그의 모든 율례와 그의 모든 계명
