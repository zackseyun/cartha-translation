  to: 이는 당신이 야훼, 당신의 하나님을 두려워하며[a], 내가 당신에게 명하는 그의 모든 규례와 계명을 지키고, 당신과 당신의 아들과 당신의 손자가[b] 평생토록 그렇게 하여, 당신의 날들이 길어지게[c] 하려는 것입니다.
  rationale: 목적을 나타내는 두 번의 לְמַעַן을 한국어의 ‘이는 … 하려는 것입니다’로 재현했습니다. ‘두려워하며 … 지키고’는 히브리어의 결합된 목적을 자연스럽게 보존하되, 어느 한 행위가 다른 행위의 단순한 결과라는 해석을 강요하지 않습니다. 세대 목록, 평생이라는 범위, 날들의 연장도 유지했으며, 각주 표지는 각 대상 어구에 직접 연결했습니다.
