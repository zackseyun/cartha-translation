base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
  footnotes:
  - marker: a
    text: Or 'revere the LORD your God.' The Hebrew verb can include reverence and awe as well as fear.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you and your son and the son of your son.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your days may be long.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신이 야훼, 당신의 하나님을 두려워하며[a], 내가 당신에게 명하는 그의 모든 규례와 계명을 지키고, 당신과 당신의 아들과 당신의 손자가[b] 평생토록 그렇게 하여, 당신의 날들이 길어지게[c] 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 히브리어 동사는 ‘두려워하다’뿐 아니라 ‘경외하다’, ‘경외심을 품다’의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신과 당신의 아들과 당신의 아들의 아들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘당신의 날들이 길어지게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּירָא
  english_pob_choice: you may fear
  chosen_korean: 두려워하여
  alternatives_korean:
