  lexicon: HALOT
  rationale: 두 용어의 구별을 살리면서, 서로 다른 두 항목임을 분명히 드러내기 위해 각각 ‘규례’와 ‘계명’으로 옮겼습니다.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  english_pob_choice: you and your son and your grandson
  chosen_korean: 당신과 당신의 아들과 당신의 손자까지
  alternatives_korean:
  - 당신과 당신의 아들과 당신의 아들의 아들까지
  - 당신과 당신의 자손과 후손까지
  lexicon: HALOT
  rationale: 히브리어의 세대적 구체성을 유지하기 위해 ‘아들’과 ‘손자’를 그대로 살렸고, 끝의 ‘까지’로 범위를 표시했습니다.
- source_word: יַאֲרִכֻן יָמֶיךָ
  english_pob_choice: your days may be prolonged
  chosen_korean: 당신의 날들이 길어지게 됩니다
  alternatives_korean:
  - 당신의 날들이 길게 됩니다
  - 당신의 생애가 길어지게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 ‘날들’과 동사의 연장을 한국어에서 자연스럽게 표현하면서도, 결과절의 약속을 직접 드러내는 형태로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 본문은 고유한 언약 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문은 단순한 호칭이 아니라 יהוה라는 고유한 신명입니다. 이를 대체어로 바꾸면 언약적 인격성이 약화되므로 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ירא의 의미 범위
  chosen_reading: ‘두려워하다’의 긴장을 유지했습니다.
  alternative_readings:
  - 경외하다
  - 공경하다
  rationale: 본문은 하나님을 향한 경외와 두려움, 그리고 그에 근거한 순종을 함께 묶습니다. 한국어에서 이를 너무 부드럽게 만들지 않기 위해 ‘두려워하다’를 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it
