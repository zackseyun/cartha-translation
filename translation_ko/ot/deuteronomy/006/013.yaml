id: DEU.6.13
reference: Deuteronomy 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
  footnotes:
  - marker: a
    text: Or 'revere the LORD your God'; the Hebrew verb includes reverential fear and awe, not merely terror.
    reason: lexical_alternative
  - marker: b
    text: Or 'worship him'; the Hebrew verb commonly means 'serve' and in context includes worshipful service.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님 야훼를 두려워하십시오. 그분만 섬기고, 그분의 이름으로 맹세하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 하나님을 경외하십시오’. 히브리어 동사는 단순한 공포가 아니라 경외와 엄중한 두려움을 함께 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분을 예배하십시오’. 히브리어 동사는 보통 ‘섬기다’를 뜻하며, 여기서는 예배적 섬김까지 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와를 대체어로 쓰지 않고 신명기의 원문 고유명을 그대로 드러내기 위해 ‘야훼’로 옮겼습니다.
- source_word: תִּירָא
  english_pob_choice: you shall fear
  chosen_korean: 두려워하십시오
  alternatives_korean:
  - 경외하십시오
  - 두려워하셔야 합니다
  lexicon: HALOT
  rationale: ירא의 핵심에는 경외가 포함되지만, 본문은 단순 존중보다 더 강한 언약적 두려움을 요구하므로 ‘두려워하십시오’가 가장 직접적입니다.
- source_word: תַעֲבֹד
  english_pob_choice: you shall serve
  chosen_korean: 섬기고
  alternatives_korean:
  - 봉사하고
  - 예배하고
  lexicon: HALOT
  rationale: עבד는 넓게 ‘섬기다’를 뜻하며 여기서는 예배를 포함할 수 있으나, 본문이 요구하는 충성의 행위를 직접 드러내기 위해 ‘섬기다’로 옮겼습니다.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  english_pob_choice: and by his name you shall swear
  chosen_korean: 그분의 이름으로 맹세하십시오
  alternatives_korean:
  - 그분의 이름으로 서약하십시오
  - 그 이름으로 맹세하십시오
  lexicon: HALOT
  rationale: ‘by his name’의 도구·근거 의미를 한국어의 ‘~으로’로 살리고, תִּשָּׁבֵעַ는 문맥상 ‘맹세하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘fear’를 ‘revere’로 완화할지 여부
  chosen_reading: 본문에는 ‘두려워하십시오’를 유지했습니다.
  alternative_readings:
  - 경외하십시오
  - 두려워하며 경외하십시오
  rationale: יאר의 의미 범위에 경외가 포함되지만, 본문은 하나님 앞의 언약적 엄중함을 유지해야 하므로 완화된 표현만으로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘serve’에 예배 의미를 본문에 직접 넣을지 여부
  chosen_reading: 본문에는 ‘섬기고’를 유지했습니다.
  alternative_readings:
  - 예배하고
  - 경배하고 섬기고
  rationale: עבד는 예배적 뉘앙스를 포함할 수 있으나, 원문의 핵심 동사는 봉사/섬김이므로 본문은 그 어휘를 보존하고 예배 의미는 문맥에 맡겼습니다.
  doctrine_reference: Translation philosophy §1, §5
