base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
  footnotes:
  - marker: a
    text: Or 'a zealous God.' The Hebrew emphasizes the LORD's exclusive covenant claim over his people.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from upon the face of the ground/earth,' an idiom for being removed completely.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여러분 가운데 계시는 야훼 여러분의 하나님이 질투하시는 하나님이시므로, 야훼 여러분의 하나님께서 여러분에게 진노하셔서 여러분을 땅 위에서 멸하실까 하여서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열심을 내시는 하나님’. 히브리어는 자기 백성에게 요구하시는 야훼의 배타적인 언약적 권리를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅의 얼굴 위로부터’. 완전히 제거됨을 나타내는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל קַנָּא
  english_pob_choice: a jealous God
  chosen_korean: 질투하시는 하나님
  alternatives_korean:
  - 열심이 있으신 하나님
  - 열망하시는 하나님
  lexicon: HALOT
  rationale: 히브리어는 언약적 배타성을 가진 하나님의 질투를 가리키므로, 의미를 희석하는 ‘열심’보다 관계적 긴장을 살리는 ‘질투하시는’이 더 직접적입니다.
- source_word: בְּקִרְבֶּךָ
  english_pob_choice: in your midst
  chosen_korean: 당신 가운데에
  alternatives_korean:
  - 당신 안에
  - 당신들 가운데에
  lexicon: HALOT
  rationale: 여기서는 하나님이 백성 한가운데 임재하신다는 공간적·공동체적 뜻이므로, 개인 내면화가 되는 ‘당신 안에’보다 ‘당신 가운데에’가 맞습니다.
- source_word: יֶחֱרֶה אַף
  english_pob_choice: the anger ... burn
  chosen_korean: 진노하셔서
  alternatives_korean:
  - 분노가 타올라
  - 노가 타서
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타오르는 분노 이미지를 살리되, 한국어 법·경고문맥에서는 ‘진노하셔서’가 자연스럽고 엄중합니다.
- source_word: וְהִשְׁמִידְךָ
  english_pob_choice: and he destroy you
  chosen_korean: 당신을 멸하지 않도록
  alternatives_korean:
  - 당신을 없애지 않도록
  - 당신을 진멸하지 않도록
  lexicon: HALOT
  rationale: 히브리어는 단순 파괴보다 완전한 제거를 뜻하지만, 현대 한국어에서 과도하게 고어적인 표현을 피하면서도 강도를 유지하기 위해 ‘멸하다’를 썼습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅의 얼굴에서
  - 땅 위에서
  lexicon: HALOT
  rationale: POB의 각주가 밝히듯 이 표현은 완전한 제거를 뜻하는 관용구이므로, 직역에 가까운 ‘땅의 표면에서’로 그 강도를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 고유한 신명이며, 프로젝트 기본값에 따라 주어가 아닌 신적 고유명으로 ‘야훼’를 유지합니다.
theological_decisions:
- issue: 언약적 질투의 보존
  chosen_reading: ‘질투하시는 하나님’으로 번역해 언약적 배타성을 드러냈습니다.
  alternative_readings:
  - ‘열심이 있으신 하나님’으로 완화할 수 있습니다.
  - ‘열성적인 하나님’으로 옮길 수 있습니다.
  rationale: 본문은 우상숭배에 대한 감정적 질투가 아니라, 자기 백성에 대한 배타적 언약 권리를 말하므로, 전통적·신학적으로 긴장을 지우지 않는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
- issue: 신명기적 경고의 직접성
  chosen_reading: ‘멸하지 않도록 하십시오’로 경고를 직접적으로 살렸습니다.
  alternative_readings:
  - ‘없애지 않도록 하십시오’로 더 완곡하게 옮길 수 있습니다.
  - ‘진멸하지 않도록 하십시오’로 더 문자적으로 옮길 수 있습니다.
  rationale: 본문은 언약 위반의 결과를 강하게 경고하므로, 현대어로도 경고의 무게를 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: Source-driven covenant warning register
