base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
  footnotes:
  - marker: a
    text: Or, 'inherit the good land.' The Hebrew verb can mean 'inherit,' 'possess,' or 'take possession of'; here it refers to Israel's entering and possessing the land promised by oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 보시기에 옳고 좋은 일을 해야 합니다. 그리하면 여러분이 잘되고, 들어가서 야훼께서 여러분의 조상들에게 맹세하신 그 좋은 땅을 차지하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상속하게 될 것입니다.’ 히브리어 동사는 ‘상속하다’, ‘소유하다’, ‘차지하다’의 뜻을 가질 수 있으며, 여기서는 맹세로 약속된 땅에 들어가 점유하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
