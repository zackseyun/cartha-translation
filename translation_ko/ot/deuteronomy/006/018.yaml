  - 여호와 앞에서
  lexicon: HALOT
  rationale: 평가의 관용구를 직역해 출처 언어의 비유를 보존했습니다.
- source_word: וְיָרַשְׁתָּ
  english_pob_choice: take possession of
  chosen_korean: 차지하게 될 것입니다
  alternatives_korean:
