  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
  footnotes:
  - marker: a
    text: Or, 'inherit the good land.' The Hebrew verb can mean 'inherit,' 'possess,' or 'take possession of'; here it refers to Israel's entering and possessing the land promised by oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 눈에 옳고 좋은 일을 행해야 합니다. 그러면 그분께서 복을 주셔서, 여러분이 들어가서 여호와께서 여러분의 조상들에게 맹세하신 그 좋은 땅을 차지하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상속하게 될 것입니다.’ 히브리어 동사는 ‘상속하다’, ‘소유하다’, ‘차지하다’의 뜻을 가질 수 있으며, 여기서는 맹세로 약속된 땅에 들어가 점유하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: you shall do
  chosen_korean: 행해야 합니다
  alternatives_korean:
  - 해야 합니다
  - 행할 것입니다
  lexicon: HALOT
  rationale: 명령·권고의 지시력을 살리면서, 현대 한국어 합쇼체에서 자연스럽게 들리도록 옮겼습니다.
- source_word: הַיָּשָׁר וְהַטּוֹב
  english_pob_choice: what is right and good
  chosen_korean: 옳고 좋은 일
  alternatives_korean:
  - 바르고 선한 일
  - 의롭고 좋은 일
  lexicon: HALOT
  rationale: 두 형용사의 병렬을 유지하되 한국어에서는 자연스럽게 한 구로 묶어 윤리적 적합성을 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 여호와의 눈에
  alternatives_korean:
  - 여호와 보시기에
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 평가의 관용구를 직역해 출처 언어의 비유를 보존했습니다.
- source_word: וְיָרַשְׁתָּ
  english_pob_choice: take possession of
  chosen_korean: 차지하게 될 것입니다
  alternatives_korean:
  - 상속하게 될 것입니다
  - 소유하게 될 것입니다
  lexicon: HALOT
  rationale: 이 절에서는 약속의 땅을 실제로 들어가 점유하는 뉘앙스가 강하므로, 단순한 '상속'보다 능동적 점유를 드러냈습니다.
- source_word: הָאָרֶץ הַטֹּבָה
  english_pob_choice: the good land
  chosen_korean: 그 좋은 땅
  alternatives_korean:
  - 좋은 땅
  - 그 복된 땅
  lexicon: HALOT
  rationale: 형용사적 평가를 그대로 살리고, 문맥상 앞서 언급된 약속의 땅을 가리키는 지시성을 '그'로 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 프로젝트 기본값은 '야훼'이지만, 본문/주석 체계상 사용자 제공 영어 본문이 'Yahweh'를 사용하며 한국어 POB의 현행 표기 관습을 고려해 '여호와'로 옮겼습니다.
theological_decisions:
- issue: יַעַשׂ־טוֹב/יִיטַב clause of covenantal outcome
  chosen_reading: 순종의 결과로 복과 땅의 점유가 이어지는 언약적 약속으로 옮겼습니다.
  alternative_readings:
  - 단순한 도덕 권고로 약화시키는 읽기
  - 번영 약속으로만 좁히는 읽기
  rationale: 본문은 행위 윤리와 언약 성취를 함께 묶습니다. '그러면 그분께서 복을 주셔서'와 '차지하게 될 것입니다'로 결과 구조를 분명히 했습니다.
  doctrine_reference: 신명기 6:18의 언약 순종-복 약속 구조
- issue: Divine name rendering
  chosen_reading: 본문에서는 공적 가독성을 위해 '여호와'를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절의 본문 가독성과 한국어 성경의 널리 알려진 전통 표기를 우선했습니다. 다만 이는 원문 신명사적 이름의 대체 표기 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
