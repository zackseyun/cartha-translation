  - marker: b
    text: Hebrew 'might' (me'od) is literally related to 'muchness' and can denote strength, intensity, or resources.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 온 마음과 온 영혼과 온 힘을 다하여 야훼 당신의 하나님을 사랑해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘영혼’(nephesh)은 ‘생명’ 또는 ‘자기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘힘’(me'od)은 문자적으로는 ‘많음/충만함’에 가깝고, 힘·강도·자원까지 아울러 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  english_pob_choice: And you shall love
  chosen_korean: 사랑해야 합니다
  alternatives_korean:
  - 사랑할 것입니다
