  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
  footnotes:
  - marker: a
    text: Or 'in your heart.' The Hebrew reads literally 'on your heart,' an idiom for keeping these words continually in one's inner life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 오늘 너에게 명령하는 이 말씀들은 네 마음에 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 마음속에.’ 히브리어는 문자적으로 ‘네 마음 위에’라고 읽히며, 이는 이 말씀들을 늘 내면에 간직하라는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말씀들
  alternatives_korean:
  - 이 말들
  - 이 말씀
  lexicon: HALOT
  rationale: דְּבָרִים의 기본값인 ‘말씀/말들’ 가운데, 문맥상 이미 주어진 언약적 가르침을 가리키므로 한국어에서는 단순한 ‘말들’보다 ‘이 말씀들’이 자연스럽고도 원문에 가깝습니다.
- source_word: מְצַוְּךָ
  english_pob_choice: I am commanding you
  chosen_korean: 내가 … 명령하는
  alternatives_korean:
  - 내가 … 명령하는 중인
  - 내가 … 명하고 있는
  lexicon: HALOT
  rationale: 분사형의 현재적·지속적 뉘앙스를 살려, 완료형보다 ‘명령하는’이 화자의 직접적 명령 행위를 더 잘 드러냅니다.
- source_word: עַל לְבָבֶךָ
  english_pob_choice: on your heart
  chosen_korean: 네 마음에
  alternatives_korean:
  - 네 마음 위에
  - 네 마음속에
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘위에’가 가능하지만, 한국어에서는 관용적 표현인 ‘마음에’가 원문의 내면화된 보유라는 뜻을 가장 자연스럽게 전달합니다.
- source_word: לְבָב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  lexicon: HALOT
  rationale: 히브리어 לְבָב은 인지·의지·정서를 포괄하므로, 한국어 성경 문맥에서 폭넓은 내면을 담는 ‘마음’이 적절합니다.
theological_decisions:
- issue: ‘on your heart’의 비유적 내면화
  chosen_reading: ‘네 마음에 있어야 합니다’로 옮겨, 말씀을 단지 외부 규범이 아니라 내면에 간직해야 하는 것으로 표현했습니다.
  alternative_readings:
  - ‘네 마음 위에 있어야 합니다’의 더 직역적인 형태
  - ‘네 마음속에 있어야 합니다’의 더 설명적인 형태
  rationale: 원문의 신체 은유를 지나치게 낯설게 만들지 않으면서도, 그 의미인 지속적 기억과 내면화를 보존하려는 선택입니다.
  doctrine_reference: Translation philosophy §1, §6
