  rationale: 히브리어의 부정사 절대형과 미완료형의 강조를 한국어에서는 반복형이 아니라 부사구로 자연스럽게 살려, 강한 의무와 강조를 함께 표현했습니다.
- source_word: מִצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 명령들
