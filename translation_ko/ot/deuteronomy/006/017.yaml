  rationale: POB의 'testimonies'는 단순한 법조문보다 하나님의 언약적 증언을 가리키므로, 그 증언성을 살려 '증언들'로 번역했습니다.
- source_word: חֻקָּיו
  english_pob_choice: his statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 정한 법규들
  lexicon: HALOT
  rationale: חֻקִּים은 정해진 규정이라는 점이 핵심이므로, 한국어 성서어휘에서 널리 쓰이면서도 지나치게 교회 전통에 치우치지 않는 '규례들'을 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명기 본문의 여호와 대체어가 아니라 고유한 신명 '야훼'를 직접 반영했습니다.
