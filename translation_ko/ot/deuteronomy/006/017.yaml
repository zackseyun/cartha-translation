translation:
  language: ko
  text: 너희는 야훼 너희 하나님[a]의 명령들과 그의 증언들과 그의 규례들을 부지런히 지켜야 합니다. 그것들은 그분이 너희에게 명령하신 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반드시 지켜야 합니다’ 또는 ‘신중히 지켜야 합니다’. 히브리어는 부정사 절대형과 동사형을 함께 써서 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  english_pob_choice: shall diligently keep
  chosen_korean: 부지런히 지켜야 합니다
