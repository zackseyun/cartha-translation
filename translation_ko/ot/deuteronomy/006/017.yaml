  lexicon: HALOT
  rationale: חֻקִּים은 정해진 규정이라는 점이 핵심이므로, 한국어 성서어휘에서 널리 쓰이면서도 지나치게 교회 전통에 치우치지 않는 '규례들'을 선택했습니다.
- source_word: יְהוָה
