  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
  footnotes:
  - marker: a
    text: Or 'must surely keep' / 'shall carefully observe'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Testimonies'' can also be rendered ''decrees'' or ''covenant stipulations.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 야훼 너희 하나님[a]의 계명과 그분의 증언[b]과 규례, 곧 그분께서 너희에게 명령하신 것을 반드시 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반드시 지켜야 합니다’ 또는 ‘신중히 지켜야 합니다’. 히브리어는 부정사 절대형과 동사형을 함께 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘증언’은 ‘증거’, ‘언약 규정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  english_pob_choice: shall diligently keep
