id: DEU.18.3
reference: Deuteronomy 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
  footnotes:
  - marker: a
    text: 'Or ''from those who offer a sacrifice.'' The Hebrew repeats the sacrificial root for emphasis: literally, ''from sacrificers of the sacrifice.'''
    reason: lexical_alternative
  - marker: b
    text: '''Shoulder'' translates a word literally meaning ''arm''; in this context it refers to the animal’s foreleg or shoulder portion.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the cheeks' or 'the jawbones.' The Hebrew form is dual.
    reason: lexical_alternative
  - marker: d
    text: Traditionally 'the maw.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 제사장들의 몫이니, 곧 백성에게서, 곧 제물을 바치는 자들에게서 받는 몫입니다. 그것은 소든지 양이든지 간에, 그가 제사장에게 어깨와 두 볼과 위를 주어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּט הַכֹּהֲנִים
  english_pob_choice: the priests’ due
  chosen_korean: 제사장들의 몫
  alternatives_korean:
  - 제사장들의 권리
  - 제사장들의 규례
  - 제사장들의 분깃
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפַּט은 추상적 ‘판결’이 아니라 제사장에게 정당하게 배당된 몫을 가리키므로, 한국어에서는 자연스럽고 법적 뉘앙스가 있는 ‘몫’으로 옮겼습니다.
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  english_pob_choice: from the people ... from those who sacrifice a sacrifice
  chosen_korean: 백성에게서, 곧 제물을 바치는 자들에게서
  alternatives_korean:
  - 백성 가운데서, 곧 제사를 드리는 자들에게서
  - 이스라엘 백성에게서, 곧 제물 바치는 자들에게서
  lexicon: HALOT
  rationale: ‘백성’과 ‘제물을 바치는 자들’을 병렬로 유지해 원문의 범주를 드러내고, 반복된 희생 제의 어근은 ‘제물을 바치는 자들’로 충분히 반영했습니다.
- source_word: הַזְּרֹעַ
  english_pob_choice: the shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 앞다리
  - 팔
  - 어깨 부분
  lexicon: HALOT
  rationale: 이 동물 제의 분배 맥락에서는 문자적 ‘팔’보다 몸통에서 떼어 주는 부위를 가리키는 ‘어깨’가 가장 자연스럽고, POB의 설명과도 맞습니다.
- source_word: הַלְּחָיַיִם
  english_pob_choice: the two cheeks
  chosen_korean: 두 볼
  alternatives_korean:
  - 두 뺨
  - 볼
  - 턱뼈
  lexicon: HALOT
  rationale: 히브리어가 쌍수형이므로 ‘두’라는 수를 살렸고, 현대 한국어에서 자연스러운 신체 부위 표현인 ‘볼’을 택했습니다.
- source_word: הַקֵּבָה
  english_pob_choice: the stomach
  chosen_korean: 위
  alternatives_korean:
  - 위장
  - 배속
  - 첫째 위
  lexicon: HALOT
  rationale: 문맥상 제물의 내장을 가리키며, POB가 archaic한 ‘maw’ 대신 명확한 현대어를 택한 것을 따라 한국어에서도 짧고 정확한 ‘위’를 사용했습니다.
