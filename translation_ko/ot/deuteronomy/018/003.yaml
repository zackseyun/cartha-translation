revisions:
- from: 이것은 제사장들의 몫이니, 곧 백성에게서, 곧 제물을 바치는 자들에게서 받는 몫입니다. 그것은 소든지 양이든지 간에, 그가 제사장에게 어깨와 두 볼과 위를 주어야 합니다.
  to: 이것이 백성에게서, 곧 희생 제물을 바치는 자들에게서 제사장들이 받을 몫입니다. 소든지 양이든지 희생 제물을 바치는 사람은 제사장에게 앞다리[a]와 두 볼[b]과 위[c]를 주어야 합니다.
  rationale: 중복되고 불분명한 문장 구조를 원문의 규정 구조에 맞게 고쳤습니다. ‘희생 제물을 바치는 자들’로 제의적 맥락을 드러내되, 원문이 별도의 희생 종류를 특정하지 않는 점은 유지했습니다. 의무 주체는 원문의 단수 동사가 나타내는 분배적 용법에 따라 ‘사람은’으로 표현했습니다. 동물 부위의 의미 범위는 본문과 주를 함께 사용하여 보존했습니다.
  reviewer_model: gpt-5.6-terra
