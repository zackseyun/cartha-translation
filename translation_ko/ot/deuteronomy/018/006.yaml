id: DEU.18.6
reference: Deuteronomy 18:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
  footnotes:
  - marker: a
    text: Literally, 'from one of your gates.' Here 'gates' refers metonymically to a town or civic settlement.
    reason: cultural_note
  - marker: b
    text: Or, 'with all his heart’s desire' / 'with all the longing of his soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람이 온 이스라엘에 있는 네 성읍들[a] 가운데 그가 거주하는 어느 한 곳에서 와서, 온 마음으로 갈망하여[b] 야훼께서 선택하실 곳으로 오면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 성문들 가운데 하나에서’입니다. 여기서 ‘성문’은 도시나 공동체를 가리키는 환유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그의 마음의 모든 갈망을 따라’ / ‘그의 영혼의 모든 간절한 소망을 따라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַד שְׁעָרֶיךָ
  english_pob_choice: from one of your gates
  chosen_korean: 이스라엘의 온 성읍들 가운데 한 곳에서
  alternatives_korean:
  - 문들 가운데 한 곳에서
  - 성문들 가운데 한 곳에서
  lexicon: HALOT
  rationale: ‘성문’이 직역이지만, 본문에서 성문은 도시/공동체를 가리키는 환유이므로 한국어에서는 의미를 드러내는 ‘성읍들’이 더 자연스럽고 오해가 적습니다.
- source_word: מִכָּל יִשְׂרָאֵל
  english_pob_choice: out of all Israel
  chosen_korean: 이스라엘의 온 성읍들 가운데
  alternatives_korean:
  - 온 이스라엘에서
  - 이스라엘 곳곳에서
  lexicon: HALOT
  rationale: 분포적 기원을 나타내므로 ‘온 이스라엘’의 범위감을 살리되, 앞 구절과 결합해 출발지를 한국어 문맥에 맞게 풀었습니다.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  english_pob_choice: where he is residing
  chosen_korean: 그가 거주하는 곳에서
  alternatives_korean:
  - 그가 나그네로 머무는 곳에서
  - 그가 살고 있는 곳에서
  lexicon: HALOT
  rationale: גָּר는 단순 거주보다 ‘잠시 머무는’ 뉘앙스를 포함할 수 있지만, 여기서는 레위인의 지역 거주를 말하므로 과도한 확대 없이 ‘거주하는’으로 옮겼습니다.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  english_pob_choice: with all the desire of his soul
  chosen_korean: 온 마음의 갈망을 품고
  alternatives_korean:
  - 그의 영혼의 모든 갈망으로
  - 온 영혼의 소망으로
  lexicon: HALOT
  rationale: 직역하면 ‘영혼의 욕망’이 되지만 한국어에서는 부자연스러워서, 전체 인격의 간절한 원함을 드러내는 ‘온 마음의 갈망’으로 옮겼습니다.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  english_pob_choice: that Yahweh will choose
  chosen_korean: 야훼께서 선택하실 곳으로
  alternatives_korean:
  - 야훼께서 택하실 곳으로
  - 주님이 선택하실 곳으로
  lexicon: HALOT
  rationale: 본문의 신명기적 표현은 특정한 ‘장소’ 선택을 가리키므로 ‘곳’이 필요합니다. 또한 יְהוָה는 POB 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제의적 중심지의 미리 정해진 장소성
  chosen_reading: ‘그가 거주하는 곳’과 ‘야훼께서 선택하실 곳’의 대비를 유지해, 레위인이 현재 거주지에서 자발적으로 중앙 예배 장소로 이동하는 뜻을 살렸습니다.
  alternative_readings:
  - ‘성막’ 또는 ‘성소’로 구체화
  - ‘주님이 정하실 성전’으로 해석
  rationale: 히브리어는 여기서 단지 ‘장소’(הַמָּקוֹם)라고만 말하므로, 후대적 제도나 건물을 본문에 앞질러 넣지 않았습니다.
  doctrine_reference: 신명기 12장의 중앙 성소 모티프
