- from: 레위 사람이 이스라엘의 온 성읍들 가운데 한 곳에서, 곧 그가 거주하는 곳에서 오고, 온 마음의 갈망을 품고 야훼께서 선택하실 곳으로 오면[a][b]
  to: 레위 사람이 온 이스라엘에 있는 네 성읍들[a] 가운데 그가 거주하는 어느 한 곳에서 와서, 온 마음으로 갈망하여[b] 야훼께서 선택하실 곳으로 오면,
