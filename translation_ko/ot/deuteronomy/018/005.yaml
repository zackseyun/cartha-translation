  to: 이는 야훼 당신의 하나님께서 당신의 모든 지파 가운데서 그를 택하시어, 그와 그의 아들들이 늘 야훼의 이름으로 서서 섬기도록 하셨기 때문입니다.[a]
  rationale: 'The revision removes the unsupported and unclear "그러해야 합니다" and attaches "그와 그의 아들들" and the durative phrase directly to the purpose of their being chosen: standing and ministering in Yahweh''s name. It preserves the masculine plural "아들들," the divine name, and the concrete priestly verbs while using natural modern formal Korean.'
