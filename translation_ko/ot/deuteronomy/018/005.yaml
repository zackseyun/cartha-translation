source:
  edition: WLC
  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
  footnotes:
  - marker: a
    text: Or 'all the days.' The Hebrew expression can be rendered more literally, but here it refers to enduring, ongoing priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼 당신의 하나님께서 당신의 모든 지파 가운데서 그를 택하시어, 그와 그의 아들들이 늘 야훼의 이름으로 서서 섬기도록 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 날들’입니다. 이 표현은 여기서 그와 그의 아들들의 제사장 직무가 지속적으로 이어짐을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 규정에 대한 이유를 제시하는 연결사로, 현대 한국어에서는 '이는'이 자연스럽고 설명적 기능을 잘 살립니다.
- source_word: בָּחַר
  english_pob_choice: has chosen
  chosen_korean: 택하셔서
  alternatives_korean:
  - 선택하셔서
  - 고르셔서
  lexicon: HALOT
  rationale: 제의적·언약적 맥락에서 단순한 선택보다 '택하다'가 더 정확하며, 결과절 연결을 위해 연결형으로 옮겼습니다.
- source_word: לַעֲמֹד לְשָׁרֵת
  english_pob_choice: to stand and minister
  chosen_korean: 서서 섬기게 하셨기 때문입니다
  alternatives_korean:
  - 서서 봉사하게 하셨기 때문입니다
  - 서서 직무를 수행하게 하셨기 때문입니다
  lexicon: HALOT
  rationale: ‘서다’와 ‘섬기다’의 구체적 예배 직무 이미지를 살리되, 한국어에서는 목적구보다 결과·의도 표현으로 풀어 자연스럽게 했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 여호와의 이름으로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: POB의 야훼 용례를 따라 신명 자체를 보존했고, 제사장의 직무가 그 이름의 권위 아래 이루어진다는 점을 유지했습니다.
- source_word: הוּא וּבָנָיו כָּל הַיָּמִים
  english_pob_choice: he and his sons all the days
  chosen_korean: 그는 그의 아들들과 함께 모든 날 동안 그러해야 합니다
  alternatives_korean:
  - 그와 그의 아들들은 모든 날 동안 그래야 합니다
  - 그와 그의 아들들은 늘 그렇게 해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 '그는... 그의 아들들'을 보존하면서, 'all the days'는 직역투를 피하고도 지속성을 분명히 하는 '모든 날 동안'으로 옮겼습니다.
theological_decisions:
- issue: 야훼 신명 보존
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יְהוָה가 직접 나오므로 POB의 기본 원칙에 따라 고유신명 자체를 드러내는 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제사장 계승의 남성 지시
  chosen_reading: 그는 그의 아들들과 함께
  alternative_readings:
  - 그와 그의 자녀들과 함께
  - 그와 그의 후손과 함께
  rationale: 히브리어가 아들들(בָנָיו)을 명시하므로, 제사장 직분의 세습적·부계적 계승을 흐리지 않도록 그대로 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
