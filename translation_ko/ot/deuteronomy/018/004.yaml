  terminology: ‘곡식’, ‘새 포도주’, ‘기름’, ‘첫 소출’은 원문의 어휘 구별을 무리 없이 보존합니다. ‘양털’은 גֵּז의 구체적인 산물을 자연스럽게 표현하며, ‘양 떼’는 초안 및 영어 감사 기록의 ‘flock’과도 조응합니다. לוֹ는 원문의 단수를 보존하여 ‘그에게’로 유지합니다.
