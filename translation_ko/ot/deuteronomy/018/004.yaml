  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
  footnotes:
  - marker: a
    text: Or 'the first portion of your grain, your wine, and your oil.'
    reason: lexical_alternative
  - marker: b
    text: '''New wine'' translates a Hebrew term often used for freshly produced wine.'
    reason: cultural_note
  - marker: c
    text: Or 'the first of the shearing of your flock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 곡식의 첫 소출과 새 포도주와 기름의 첫 소출, 그리고 양 떼의 첫 털을 그에게 주어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 곡식, 새 포도주, 기름의 첫 부분’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘새로 만든 포도주’에 흔히 쓰이는 용어를 사용합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘네 양 떼를 깎아 얻은 것의 첫 몫’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: the firstfruits
  chosen_korean: 첫 소출
  alternatives_korean:
  - 첫 열매
  - 첫 몫
  - 처음 난 것
  lexicon: HALOT
  rationale: 수확물의 첫 부분을 가리키는 רֵאשִׁית를 제의적 맥락에 맞게 한국어로는 ‘첫 소출’로 옮겨, 헌납의 의미와 우선성을 함께 살렸습니다.
- source_word: דָּגָן
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 곡물
  - 납작한 곡식
  lexicon: HALOT
  rationale: דָּגָן은 일반적인 곡류를 가리키므로, 현대 한국어에서 자연스럽고 범위가 넓은 ‘곡식’이 적절합니다.
- source_word: תִּירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 갓 빚은 포도주
  lexicon: HALOT
  rationale: תִּירוֹשׁ는 갓 만들어진 포도주, 곧 새 포도주를 뜻하므로, 단순한 ‘포도주’보다 상태를 드러내는 ‘새 포도주’가 원문 구분을 잘 보존합니다.
- source_word: גֵּז צֹאן
  english_pob_choice: the fleece of your flock
  chosen_korean: 양 떼의 첫 털
  alternatives_korean:
  - 양 떼의 첫 깎음
  - 양 떼의 첫 양털
  lexicon: HALOT
  rationale: גֵּז는 깎아 얻는 털/양털을 가리키므로, 문맥상 첫 번째로 깎은 몫이라는 점을 드러내는 ‘첫 털’이 간결하면서도 원문의 구체성을 유지합니다.
theological_decisions:
- issue: לוֹ의 단수 대명사 처리
  chosen_reading: ‘그에게’로 두어, 문법상의 단수 형태를 유지하되 문맥상 제사장/레위인 수령을 과도하게 특정하지 않았습니다.
  alternative_readings:
  - ‘그들에게’로 집합적 의미를 드러내는 번역
  - ‘제사장에게’로 명시하는 번역
  rationale: 히브리어는 단수 대명사를 쓰지만, 주변 법문 전체에서는 제의적 수령자를 가리킵니다. 한국어 본문에서는 형태를 따라 ‘그에게’로 옮기고, 해석의 범위를 열어 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 토라의 제의법 맥락과 문법적 단수-집합 용법
