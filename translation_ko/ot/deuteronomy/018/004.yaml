  source_fidelity: 히브리어 רֵאשִׁית는 ‘곡식, 새 포도주, 기름’의 세 항목 전체를 수식합니다. 초안은 ‘곡식의 첫 소출’과 ‘기름의 첫 소출’처럼 나누어 표현하여 ‘새 포도주’가 그 범위에 분명히 포함되는 구조가 약해집니다. 또한 גֵּז צֹאן의 ‘첫 번째 깎은 몫’을 ‘첫 털’로 옮긴 표현은 다소 부자연스럽고 의미가 불명확합니다.
