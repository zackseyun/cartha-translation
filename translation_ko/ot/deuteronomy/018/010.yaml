  rationale: 금지의 범위와 열거 순서는 유지했습니다. 다만 현대 한국어에서 더 자연스러운 공동체 금지 표현으로 다듬고, 불의 의례에 관한 히브리어 관용구의 모호성을 보존했습니다. 어려운 두 점복 용어의 본문·각주 연결을 바로잡았으며, ‘마술’이 지닌 오락적 함의를 피하기 위해 מְכַשֵּׁף를 ‘주술을 행하는 사람’으로 수정했습니다.
