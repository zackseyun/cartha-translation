- from: 당신들 가운데에는 자기 아들이나 딸을 불로 지나가게 하는 사람[a], 점을 치는 사람, 복술하는 사람[b][c], 징조를 해석하는 사람, 마술을 행하는 사람이 있어서는 안 됩니다[d].
