source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
  footnotes:
  - marker: a
    text: Or 'burns his son or his daughter in the fire' or 'offers his son or his daughter in the fire.' The Hebrew literally says 'makes his son or his daughter pass through the fire.'
    reason: alternative_reading
  - marker: b
    text: '''Tells fortunes'' renders a difficult Hebrew term also translated ''soothsayer'' or, more literally in older English, ''observer of times.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'practices augury' / 'divines by omens.'
    reason: lexical_alternative
  - marker: d
    text: Or 'practices witchcraft.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데에는 자기 아들이나 딸을 불 가운데로 지나가게 하는 사람[a], 점을 치는 사람, 길흉을 점치는 사람[b], 징조를 해석하는 사람[c], 주술을 행하는 사람이 없어야 합니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 아들이나 딸을 불에 태우는 사람’ 또는 ‘자기 아들이나 딸을 불에 바치는 사람’. 히브리어는 문자적으로 ‘자기 아들이나 딸을 불 가운데로 지나가게 하는 사람’이라고 되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘길흉을 점치는 사람’은 해석하기 어려운 히브리어를 옮긴 표현으로, ‘점술하는 사람’ 또는 더 옛말로는 ‘시기를 살피는 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘징조로 점치는 사람’ 또는 ‘징조를 통해 점치는 사람’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘마술을 행하는 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִמָּצֵא בְךָ
  english_pob_choice: There must not be found among you
  chosen_korean: 당신들 가운데에는 … 있어서는 안 됩니다
  alternatives_korean:
  - 당신들 가운데에서 … 발견되어서는 안 됩니다
  - 너희 가운데 … 있어서는 안 됩니다
  lexicon: WLC / prohibition syntax
  rationale: 공동체 내 금지 규정의 문맥을 살려, 단순한 존재 진술이 아니라 ‘있어서는 안 된다’는 규범적 금지를 자연스럽게 옮겼습니다.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  english_pob_choice: who makes his son or his daughter pass through the fire
  chosen_korean: 자기 아들이나 딸을 불로 지나가게 하는 사람
  alternatives_korean:
  - 자기 아들이나 딸을 불에 태우는 사람
  - 자기 아들이나 딸을 불에 바치는 사람
  lexicon: HALOT
  rationale: 히브리어의 ‘지나가게 하다’라는 관용을 본문에서 보존하되, 한국어로는 행위의 폭력성과 의례성을 드러내도록 직역에 가깝게 옮겼습니다.
- source_word: קֹסֵם קְסָמִים / מְעוֹנֵן / מְנַחֵשׁ
  english_pob_choice: one who practices divination, tells fortunes, interprets omens
  chosen_korean: 점을 치는 사람, 복술하는 사람[b][c], 징조를 해석하는 사람
  alternatives_korean:
  - 점술하는 사람
  - 서낙을 읽는 사람
  - 점괘를 푸는 사람
  lexicon: HALOT
  rationale: 첫 항목은 ‘점치다’로, 뒤의 두 어려운 술법 용어는 POB의 구분을 따라 서로 겹치지 않게 ‘복술하다’와 ‘징조를 해석하다’로 옮겨, 점복 계열의 서로 다른 기술들을 구별했습니다.
- source_word: מְכַשֵּׁף
  english_pob_choice: practices sorcery
  chosen_korean: 마술을 행하는 사람[d]
  alternatives_korean:
  - 주술을 행하는 사람
  - 무당질을 하는 사람
  lexicon: HALOT
  rationale: 공개 번역문에서는 현대 표준어로 의미가 분명한 ‘마술을 행하다’를 택해, 금지된 비밀주술의 성격을 드러내면서도 지나치게 문화적으로 특정된 표현은 피했습니다.
theological_decisions:
- issue: 어린 자녀를 불로 지나가게 한다는 표현의 처리
  chosen_reading: 히브리어의 관용적 표현을 본문에서 유지하고, 구체적 행위의 성격은 본문이 직접 말하는 범위 안에서만 드러내었습니다.
  alternative_readings:
  - 자기 아들이나 딸을 불에 태우는 사람
  - 자기 아들이나 딸을 불에 바치는 사람
  rationale: 본문은 이교적 아동 관련 의례를 금지하지만, 이 절 자체는 ‘불로 지나가게 하다’라는 표현을 사용하므로, 본문 이상의 세부를 단정하지 않기 위해 관용구를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
