  source_fidelity: 초안은 예언의 불성취, 야훼께서 말씀하지 않으셨다는 판정, 예언자의 참람한 발언, 그리고 그를 두려워하지 말라는 결론을 대체로 충실히 옮겼습니다. 다만 조건절의 ‘말하지만’은 히브리어의 조건·판정 구조보다 양보/대조를 강하게 암시하므로 수정하는 편이 정확합니다.
