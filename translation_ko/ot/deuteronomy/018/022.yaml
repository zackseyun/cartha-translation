id: DEU.18.22
reference: Deuteronomy 18:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
  footnotes:
  - marker: a
    text: Or 'the word' instead of 'the matter' for Hebrew דָּבָר; the term can refer both to the spoken message and to the event foretold.
    reason: lexical_alternative
  - marker: b
    text: Or 'does not occur or come to pass.'
    reason: lexical_alternative
  - marker: c
    text: '''Presumptuously'' conveys arrogant, willful presumption in speaking without the LORD''s authorization.'
    reason: cultural_note
translation:
  language: ko
  text: 예언자가 야훼의 이름으로 말한 것이 일어나지도 이루어지지도 않으면, 그것은 야훼께서 말씀하지 않으신 일입니다.[a] 그 예언자는 그것을 주제넘게 말한 것이니, 그를 두려워해서는 안 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일’은 히브리어 דָּבָר를 옮긴 말입니다. 이 단어는 여기서 예언의 말과 그 말이 가리키는 성취될 일을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주제넘게’는 야훼의 권한 없이 오만하고 제멋대로 말한 태도를 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַנָּבִיא
  english_pob_choice: the prophet / a prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 프로펫
  lexicon: HALOT
  rationale: 법적 문맥의 נָבִיא를 한국어 성경어 가운데 표준적이면서도 현대적으로 전달되는 ‘예언자’로 옮겼습니다. 반복되는 정관적 표현은 문맥상 일반적 사례를 가리키므로 그대로 살렸습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 명으로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: ‘이름으로’는 권위 아래 말한다는 관용구를 자연스럽게 살리며, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 말
  - 그 사건
  - 그 말씀
  lexicon: HALOT
  rationale: דָּבָר는 여기서 예언의 내용과 성취 여부를 함께 가리키므로, 두 번 모두 같은 대상을 자연스럽게 지시하는 ‘그 일’로 옮겼습니다. 영어 POB의 반복을 한국어에서도 유지했습니다.
- source_word: בְּזָדוֹן
  english_pob_choice: presumptuously
  chosen_korean: 주제넘게
  alternatives_korean:
  - 오만하게
  - 방자하게
  - 감히
  lexicon: HALOT
  rationale: זָדוֹן의 핵심은 권한 없이 뻔뻔하게 나서는 태도이므로, 현대 한국어에서 그 뉘앙스를 비교적 직접적으로 드러내는 ‘주제넘게’를 택했습니다.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  english_pob_choice: you shall not fear him
  chosen_korean: 그를 두려워해서는 안 됩니다
  alternatives_korean:
  - 그 앞에서 두려워하지 마십시오
  - 그를 무서워해서는 안 됩니다
  lexicon: HALOT
  rationale: גור는 여기서 두려움/위축의 의미이므로, 법적 금지의 어조를 살린 합쇼체로 옮겼습니다. 직접 금지의 힘을 유지하기 위해 ‘두려워해서는 안 됩니다’로 정리했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 신명으로, 프로젝트 기준에 따라 서술적 대체어보다 음역형 ‘야훼’를 사용해 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언 검증의 성격
  chosen_reading: 성취 여부에 따른 객관적 판별로만 옮김
  alternative_readings:
  - 예언 직분 전반에 대한 포괄적 교리 진술
  - 후대적 영분별 원리의 확장
  rationale: 본문은 예언이 실제로 성취되었는지 여부와, 그로 인해 그 말이 야훼께서 하신 말씀이 아님이 드러난다는 법적 판정에 초점을 둡니다. 이를 넘어선 교리적 확장을 덧붙이지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; do not import doctrinal claims the text does not make'
