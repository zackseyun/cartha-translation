translation:
  language: ko
  text: 당신은 야훼 당신의 하나님 앞에서 흠이 없어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온전한’ 혹은 ‘완전한’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠이 없어야 합니다
  alternatives_korean:
  - 온전해야 합니다
  - 완전해야 합니다
  - 책망할 것이 없어야 합니다
  lexicon: HALOT
  rationale: 이 단어는 단순한 물리적 ‘온전함’보다 하나님 앞에서의 도덕적·언약적 결함 없음에 초점이 있으므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘흠이 없어야 합니다’로 옮겼습니다.
- source_word: תִּהְיֶה
  english_pob_choice: you shall be
  chosen_korean: ~해야 합니다
  alternatives_korean:
  - ~일 것입니다
  - ~하십시오
  - ~이 되십시오
  lexicon: HALOT
  rationale: 히브리어 미완료형이 여기서는 권고적·명령적 의무를 나타내므로, 합쇼체에서 가장 자연스러운 규범 표현인 ‘~해야 합니다’로 처리했습니다.
- source_word: עִם
  english_pob_choice: with
  chosen_korean: 앞에서
  alternatives_korean:
  - 함께
  - 과 더불어
  - 대하여
  lexicon: HALOT
  rationale: 직역하면 ‘함께’이지만, 본문은 야훼와의 관계적·언약적 삶의 방향을 말하므로 한국어에서는 ‘앞에서’가 하나님 앞에 서는 책임성과 관계성을 더 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기 전통과 POB 규범에 따라 여호와나 주님이 아니라 신명 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: תָּמִים의 신학적 범위
  chosen_reading: 죄 없는 완전무결이 아니라, 야훼 앞에서 결함 없는 언약적 충성으로 이해했습니다.
  alternative_readings:
  - 도덕적 완전성
  - 전인적 온전함
  - 단순한 외적 무흠
  rationale: 문맥은 점술과 가증한 행위를 금지하는 18:9–14 단락이므로, 여기서는 절대적 무죄성보다 분열되지 않은 언약적 성실함을 요구합니다.
  doctrine_reference: '번역 원칙: 문맥이 요구하는 신학적 긴장을 보존하고, 과도하게 신학화를 하거나 약화하지 않습니다.'
