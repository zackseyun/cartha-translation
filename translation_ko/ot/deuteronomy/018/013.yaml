  rationale: 본문의 신명기 전통과 POB 규범에 따라 여호와나 주님이 아니라 신명 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: תָּמִים의 신학적 범위
  chosen_reading: 죄 없는 완전무결이 아니라, 야훼 앞에서 결함 없는 언약적 충성으로 이해했습니다.
  alternative_readings:
  - 도덕적 완전성
  - 전인적 온전함
  - 단순한 외적 무흠
  rationale: 문맥은 점술과 가증한 행위를 금지하는 18:9–14 단락이므로, 여기서는 절대적 무죄성보다 분열되지 않은 언약적 성실함을 요구합니다.
  doctrine_reference: '번역 원칙: 문맥이 요구하는 신학적 긴장을 보존하고, 과도하게 신학화를 하거나 약화하지 않습니다.'
