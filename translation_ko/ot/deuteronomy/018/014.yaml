revisions:
- from: 이 나라들은, 곧 당신이 쫓아내는 이 나라들은, 점쟁이들과 점술가들에게 귀를 기울이지만, 당신은 그렇지 않습니다. 야훼 당신의 하나님께서는 그런 것을 당신에게 허락하지 않으셨습니다.[a][b]
  to: 당신이 쫓아내는 이 나라들은[a] 점쟁이들과 점술가들에게[b] 귀를 기울입니다. 그러나 당신에게는 야훼 당신의 하나님께서 그렇게 하도록 허락하지 않으셨습니다.[c]
  rationale: 중복된 명사구를 제거하여 원문의 문장 구조를 충실히 따랐습니다. 원문의 타동사 ‘주다’와 생략된 목적어가 문맥상 허용되지 않은 점복 행위를 가리킨다는 점은 유지하되, 한국어에서는 ‘그렇게 하도록 허락하지 않으셨습니다’로 자연스럽게 표현했습니다. 각주를 해당 어휘 및 보충 구문 바로 뒤에 배치하여 적용 범위를 명확히 했습니다.
