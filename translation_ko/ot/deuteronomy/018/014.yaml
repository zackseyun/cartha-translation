id: DEU.18.14
reference: Deuteronomy 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
  footnotes:
  - marker: a
    text: Or 'which you are driving out' or 'which you are taking possession of'; the Hebrew verb can include both taking possession and dispossessing prior inhabitants.
    reason: lexical_alternative
  - marker: b
    text: '''Soothsayers'' translates a term for practitioners of omen-reading or augury.'
    reason: cultural_note
  - marker: c
    text: Hebrew literally, 'but you, not so has the LORD your God given to you'; the object ('this,' i.e., such practices) is implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 나라들은, 곧 당신이 쫓아내는 이 나라들은, 점쟁이들과 점술가들에게 귀를 기울이지만, 당신은 그렇지 않습니다. 야훼 당신의 하나님께서는 그런 것을 당신에게 허락하지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘차지하다’와 ‘몰아내다/쫓아내다’의 뜻을 함께 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 두 명칭은 점복이나 징조 해석에 관여하는 관행을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: these nations
  chosen_korean: 이 나라들은
  alternatives_korean:
  - 이 민족들은
  - 이 이방 나라들은
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 주변의 비이스라엘 집단을 가리키며, 한국어에서는 문맥상 자연스러운 ‘나라들’이 가장 직접적입니다.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  english_pob_choice: which you are dispossessing
  chosen_korean: 당신이 쫓아내는
  alternatives_korean:
  - 당신이 차지하는
  - 당신이 점유해 가는
  lexicon: HALOT
  rationale: ירשׁ은 단순한 ‘상속’보다 기존 거주자를 밀어내며 소유를 얻는 뜻을 포함하므로, 문맥의 힘을 살려 ‘쫓아내는’으로 옮겼습니다.
- source_word: אֶל מְעֹנְנִים וְאֶל קֹסְסִים
  english_pob_choice: to soothsayers and diviners
  chosen_korean: 점쟁이들과 점술가들에게
  alternatives_korean:
  - 길흉을 점치는 사람들과 점치는 자들에게
  - 점괘를 보는 사람들과 점술사들에게
  lexicon: HALOT
  rationale: 두 명칭 모두 점복·예언적 조짐 읽기를 가리키므로, 한국어에서 의미가 겹치되 구분되는 일반어인 ‘점쟁이’와 ‘점술가’로 옮겨 독자가 관행적 점복 행위를 떠올리게 했습니다.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God has not allowed you to do this / has not given this to you
  chosen_korean: 야훼 당신의 하나님께서는 그런 것을 당신에게 허락하지 않으셨습니다
  alternatives_korean:
  - 야훼 당신의 하나님께서는 그것을 당신에게 주지 않으셨습니다
  - 야훼 당신의 하나님께서는 이런 일을 당신에게 맡기지 않으셨습니다
  lexicon: HALOT
  rationale: נָתַן의 기본값은 ‘주다’이지만, 여기서는 문맥상 이 관행들을 이스라엘에 허용하지 않으셨다는 뜻이 자연스러우므로, POB의 해석 방향을 따라 ‘허락하지 않으셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름을 כיצד 옮길 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 언약명으로, 프로젝트 기본어인 ‘야훼’를 유지해 원문 표지를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘허락하지 않으셨습니다’의 함의
  chosen_reading: 금지보다는 부여/허용의 부재를 강조하는 표현
  alternative_readings:
  - 명시적 금지인 ‘해서는 안 됩니다’
  - ‘주지 않으셨습니다’로 더 직역
  rationale: 히브리어는 직접적인 금지문보다 ‘너희에게 그런 것을 주지 않으셨다’는 방식으로 이스라엘의 정체성과 다른 민족의 관행을 대비하므로, 그 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
