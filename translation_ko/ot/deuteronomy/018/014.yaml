  source_fidelity: 핵심 대조와 점복 관행의 의미는 대체로 적절합니다. 다만 현행 본문은 ‘이 나라들은’이 불필요하게 반복되고, ‘그런 것을 당신에게 허락하지’는 한국어에서 목적어와 허용 구문의 결합이 다소 부자연스럽습니다. 또한 원문의 생략된 목적어를 보충한 부분에 대한 주석 표지가 필요합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘이 나라들은, 곧 당신이 쫓아내는 이 나라들은’은 중복으로 인해 부자연스럽습니다. ‘그렇게 하도록 허락하지 않으셨습니다’가 현대 표준 한국어에서 더 자연스럽고 문맥도 명확합니다.
  terminology: ‘야훼’, ‘점쟁이들’, ‘점술가들’은 적절합니다. ירשׁ의 문맥상 강한 의미를 ‘쫓아내는’으로 옮긴 것은 가능하나, 그 어휘 범위를 설명하는 주석은 해당 구절 가까이에 배치해야 합니다. 점복 관련 두 명칭과 생략된 목적어에 대한 주석도 각각의 위치에 맞추어 분리합니다.
