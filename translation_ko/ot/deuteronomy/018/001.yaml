id: DEU.18.1
reference: Deuteronomy 18:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
  footnotes:
  - marker: a
    text: Or, more literally, “the offerings by fire of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: “His inheritance” may refer collectively to Levi/the Levite; compare the parallel statement in Deuteronomy 18:2, where the LORD is said to be their inheritance.
    reason: cross_reference
translation:
  language: ko
  text: 레위 사람 제사장들—곧 레위의 온 지파는—이스라엘 가운데서 몫도 기업도 없을 것입니다. 그들은 야훼께 드리는 화제물을 먹을 것입니다. 그것이 곧 그의 기업입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제물’은 문자적으로는 ‘불로 드리는 제물’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 기업’은 문맥상 레위 지파를 집합적으로 가리키는 표현일 수 있으며, 18:2의 평행구에서는 야훼께서 그들의 기업이라고 말씀하십니다.
    reason: cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: The Levitical priests
  chosen_korean: 레위 사람 제사장들
  alternatives_korean:
  - 레위 제사장들
  - 레위 사람인 제사장들
  lexicon: HALOT
  rationale: 히브리어는 제사장들이 레위 지파에 속함을 밝히는 결합어이므로, 한국어에서는 자연스럽고 간결하게 ‘레위 사람 제사장들’로 옮겨 그 소속을 분명히 했습니다.
- source_word: כָּל שֵׁבֶט לֵוִי
  english_pob_choice: all the tribe of Levi
  chosen_korean: 레위의 온 지파
  alternatives_korean:
  - 레위의 모든 지파
  - 레위 온 지파
  lexicon: HALOT
  rationale: כָּל이 지파 전체를 가리키는 강조이므로 ‘온’으로 살려, 제사장 집단만이 아니라 레위 지파 전체를 포함하는 범위를 드러냈습니다.
- source_word: חֵלֶק וְנַחֲלָה
  english_pob_choice: portion or inheritance
  chosen_korean: 몫도 기업도
  alternatives_korean:
  - 분깃도 기업도
  - 상속분도 기업도
  lexicon: HALOT
  rationale: 두 용어는 땅과 소유의 배분권을 가리키는 거의 동의적 쌍이어서, 한국어에서는 병렬 부정으로 ‘몫도 기업도’라고 옮겨 의미의 중복과 법적 뉘앙스를 함께 살렸습니다.
- source_word: אִשֵּׁי יְהוָה
  english_pob_choice: the food offerings of Yahweh
  chosen_korean: 야훼께 드리는 화제물
  alternatives_korean:
  - 야훼의 화제물
  - 야훼께 드리는 불살라 드리는 제물
  lexicon: HALOT
  rationale: אִשֵּׁי는 직역하면 ‘불로 드리는 제물’이지만, 제사장들이 먹는 제의적 제물을 가리키므로 ‘화제물’로 번역해 제사 맥락을 보존했습니다. 예전 교회 용어보다 원문의 제의적 의미가 분명해지도록 했습니다.
- source_word: וְנַחֲלָת֖וֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 기업
  alternatives_korean:
  - 그의 상속분
  - 야훼의 기업
  lexicon: HALOT
  rationale: 문맥상 단수 소유 대명사는 레위 지파를 집합적으로 가리키는 표현으로 보이므로, 히브리어의 대명사 형태를 살려 ‘그의 기업’으로 두었습니다.
theological_decisions:
- issue: וְנַחֲלָת֖וֹ의 지시 대상
  chosen_reading: ‘그의 기업’은 문맥상 레위 지파를 집합적으로 가리키는 표현으로 보았습니다.
  alternative_readings:
  - 야훼의 기업으로 읽는 해석
  - 레위인들의 기업으로 풀어 쓰는 해석
  rationale: 바로 앞의 ‘레위의 온 지파’와 연결되며, 이어지는 18:2에서 야훼 자신이 그들의 기업이라고 말하므로, 본절은 레위 지파의 몫을 설명하는 집합적 소유 표현으로 읽는 것이 가장 자연합니다.
  doctrine_reference: 신 18:2 평행구
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 יהוה가 직접 나오므로, 프로젝트 기본값에 따라 언약적 신명인 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
