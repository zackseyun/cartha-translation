source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
  footnotes:
  - marker: a
    text: Or 'the matter' or 'the message'; Hebrew davar can refer broadly to a word, message, or matter. In this prophetic context, 'word' best fits.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 마음속으로 ‘야훼께서 말씀하지 않으신 그 말을 우리가 어떻게 알 수 있겠습니까?’라고 말한다면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일’, ‘그 메시지’로도 옮길 수 있습니다. 히브리어 דָּבָר는 넓게 말, 메시지, 일을 가리킬 수 있지만, 이 예언적 문맥에서는 ‘말’이 가장 적합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건을 여는 연결어로서 앞 문맥과의 연속성을 살리면서도, 한국어에서는 ‘그리고 만일’이 자연스럽고 문맥상 무리 없는 조건 표현입니다.
- source_word: בִּלְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음에
  - 속으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 발화를 한국어에서는 ‘마음속으로’가 가장 자연스럽게 옮기면서, 단순한 외적 말이 아닌 내면의 생각을 드러냅니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말
  alternatives_korean:
  - 그 말씀
  - 그 일
  - 그 메시지
  lexicon: HALOT
  rationale: 예언 진위 판별의 문맥에서 דָּבָר는 단순한 ‘말씀’보다 ‘말’/‘말한 내용’을 뜻하는 넓은 의미가 살아 있습니다. 여기서는 한국어에서 가장 직접적인 표현인 ‘그 말’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 용례에 따라 신성명 יְהוָה는 ‘야훼’로 표기해, 대체 칭호가 아니라 언약의 고유한 이름이라는 점을 보존했습니다.
theological_decisions:
- issue: 예언의 진위를 묻는 문장의 직접성
  chosen_reading: ‘야훼께서 말씀하지 않으신 그 말’이라고 직접 옮겨, 말씀이 실제로 야훼에게서 나왔는지 여부를 분명히 하였습니다.
  alternative_readings:
  - ‘야훼께서 말하지 않으신 일’
  - ‘야훼께서 선포하지 않으신 메시지’
  rationale: 이 절의 초점은 예언적 발화의 출처를 가리는 데 있으므로, 문맥이 요구하는 ‘말’의 직접성을 유지하는 것이 중요합니다.
  doctrine_reference: 신 18:21 문맥상 거짓 예언 판별
- issue: 직접인용의 말투
  chosen_reading: 인용문 안에서는 공손한 질문형을 유지해, 이스라엘 공동체가 묻는 말로 자연스럽게 들리도록 하였습니다.
  alternative_readings:
  - 더 구어적인 반말형
  - 더 경건한 체언형 질문
  rationale: 본문은 공동체 내부의 질문을 기록한 것이므로, 현대 표준어 합쇼체를 유지하되 인용문의 질문성을 분명히 살리는 것이 적절합니다.
  doctrine_reference: 표준어 문체 가이드
