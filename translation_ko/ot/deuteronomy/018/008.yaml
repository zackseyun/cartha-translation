    rationale: לְבַד는 여기서 균등한 제의 몫과 개인적·가문 관련 수입을 구별하거나 추가하는 표현입니다. 초안은 ‘그의 가문의 소유를 팔아서 얻는 것 외에는’이라고 하여 그 수입을 제외하는 조건처럼 만들고, ‘그렇습니다’라는 지시어 때문에 문장 의미도 불명확해집니다.
  - severity: medium
    issue: 각주의 대안 인용문도 본문의 잘못된 ‘외에는’ 구조를 반복함
    rationale: 각주는 대안 독해를 설명해야 하지만, 현 인용문은 원문의 관계를 정확히 드러내지 못합니다. ‘외에/별도로’로 고쳐야 합니다.
