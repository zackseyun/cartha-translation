- from: 그들은 동일한 몫을 먹습니다[a]. 다만 그의 가문의 소유를 팔아서 얻는 것 외에는 그렇습니다.
  to: 그들은 조상에게서 물려받은 재산을 팔아 얻는 것과는 별도로 똑같은 몫을 먹습니다[a].
  rationale: ‘외에는’과 불명확한 ‘그렇습니다’를 제거하고, לְבַד의 ‘별도로/그에 더하여’라는 관계를 ‘…와는 별도로’로 옮겼습니다. ‘똑같은 몫’은 반복된 חֵלֶק כְּחֵלֶק의 균등 분배를 자연스럽게 나타냅니다. 마지막 구절의 특정 해석은 영어 POB 감사 기록과 일치시키되, 각주에서 히브리어의 난해성과 대안적 범위를 보존했습니다.
