  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
  footnotes:
  - marker: a
    text: Or, 'besides what he receives from selling family possessions'; the Hebrew of the final clause is difficult and may refer more generally to income connected with his ancestral house.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 동일한 몫을 먹습니다[a]. 다만 그의 가문의 소유를 팔아서 얻는 것 외에는 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 가문의 소유를 팔아 받는 것 외에는’; 마지막 절의 히브리어는 난해하여, 조상 대대로 이어진 집안과 연결된 수입을 더 넓게 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  english_pob_choice: equal portions
  chosen_korean: 동일한 몫
  alternatives_korean:
  - 똑같은 몫
  - 같은 몫
  - 균등한 몫
  lexicon: HALOT
  rationale: 반복 구조는 ‘몫이 몫과 같다’는 분배의 동등성을 나타내므로, 현대 한국어에서는 ‘동일한 몫’이 가장 자연스럽고 원문의 대칭성을 살립니다.
- source_word: יֹאכֵלוּ
  english_pob_choice: they shall eat
  chosen_korean: 먹습니다
  alternatives_korean:
  - 먹게 됩니다
  - 받아 먹습니다
  - 섭취합니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 동사 ‘먹다’를 그대로 살려, 단순 지급이 아니라 제의적 몫을 실제로 누리는 이미지를 유지합니다.
- source_word: לְבַד
  english_pob_choice: besides
  chosen_korean: 다만 … 외에는
  alternatives_korean:
  - … 밖에는
  - … 이외에
  - … 외에
  lexicon: HALOT
  rationale: ‘별도로/덧붙여’의 의미를 담되, 뒤 절이 예외·보충 정보를 주는 구조를 한국어로 가장 분명하게 드러내는 방식입니다.
- source_word: מִמְכָּרָיו עַל הָאָבוֹת
  english_pob_choice: what comes from the sale of his patrimony
  chosen_korean: 그의 가문의 소유를 팔아서 얻는 것
  alternatives_korean:
  - 그의 유산을 팔아 얻는 것
  - 그의 상속 재산을 처분해서 얻는 것
  - 조상 대대로 물려받은 소유를 팔아 얻는 것
  lexicon: HALOT
  rationale: 문법상 압축된 표현이라 직역하면 난해하므로, POB의 해석처럼 가족/조상 유산과 연결된 판매 수익이라는 뜻을 한국어로 풀어 주되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 마지막 절의 압축된 소유·판매 표현의 의미
  chosen_reading: 제사장/레위인의 공적 몫과 별개로, 가문에 속한 소유를 처분해 얻는 개인적 수입이 추가될 수 있다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그의 조상 집안에 따라 정해진 몫
  - 조상들의 규정에 따른 판매 수익
  - 가문이 보유한 재산을 파는 것 자체
  rationale: 본문은 분배의 공평성을 말하면서도 사적 재산 관련 수입 가능성을 별도로 남겨 두므로, 그 긴장을 해소하지 않고 문맥상 가장 자연스러운 독해를 따릅니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
