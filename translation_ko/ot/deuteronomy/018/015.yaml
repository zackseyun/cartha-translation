  to: 너희 하나님 야훼께서 너희를 위하여 너희 가운데, 곧 너희 형제들 가운데서 나와 같은 예언자 한 사람을 세우실 것입니다.[a][b] 너희는 그에게 귀를 기울여야 합니다.
  rationale: 집합적 청자를 가리키는 한국어 ‘너희’를 사용하여 현대 한국어의 자연스러움을 높였습니다. ‘곧’을 넣어 ‘너희 가운데서’와 ‘너희 형제들 가운데서’의 동격적·재한정 관계를 보존했습니다. ‘세우실 것입니다’는 여기서 예언자를 일으켜 마련하거나 임명한다는 히브리어 יקים의 의미를 자연스러운 한국어로 전달합니다. 메시아적 동일시는 본문에 넣지 않고 각주에만 유지했습니다.
  reviewer_model: gpt-5.6-terra
