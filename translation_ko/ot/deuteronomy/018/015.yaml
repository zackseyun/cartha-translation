reference: Deuteronomy 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
  footnotes:
  - marker: a
    text: Or 'from your midst, from your fellow Israelites.' The Hebrew 'from your brothers' uses a masculine kinship term that here refers to members of Israel generally.
    reason: lexical_alternative
  - marker: b
    text: This verse is later applied to the Messiah in the New Testament; the Hebrew here, however, reads simply 'a prophet like me.'
    reason: cross_reference
translation:
  language: ko
  text: 너희 하나님 야훼께서 너희를 위하여 너희 가운데, 곧 너희 형제들 가운데서 나와 같은 예언자 한 사람을 세우실 것입니다.[a][b] 너희는 그에게 귀를 기울여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘너희 형제들’은 남성 친족어 형태이지만, 여기서는 이스라엘 공동체 구성원을 가리키는 대표적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 신약에서 메시아에게 적용되지만, 히브리어 본문 자체는 여기서 단순히 ‘나와 같은 한 예언자’라고 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  english_pob_choice: a prophet
  chosen_korean: 한 예언자
  alternatives_korean:
  - 예언자
  - 선지자
  lexicon: HALOT
  rationale: 히브리어의 부정관사적 단수 성격을 살려 ‘한 예언자’로 옮겨, 특정 직분명만이 아니라 한 인물을 가리키는 문장을 자연스럽게 유지했습니다.
- source_word: מִקִּרְבְּךָ
  english_pob_choice: from among you
  chosen_korean: 당신 가운데에서
  alternatives_korean:
  - 당신의 한복판에서
  - 당신들 가운데에서
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 한가운데에서’이므로, 출처가 외부가 아니라 공동체 내부임을 드러내는 표현으로 옮겼습니다.
- source_word: מֵאַחֶיךָ
  english_pob_choice: from your brothers
  chosen_korean: 당신의 형제들 가운데에서
  alternatives_korean:
  - 당신의 형제들로부터
  - 당신의 동족들 가운데에서
  - 이스라엘 동족들 가운데에서
  lexicon: HALOT
  rationale: 남성 복수 친족어의 형식을 유지하면서도, 문맥상 이스라엘 공동체 구성원을 가리키는 대표적 표현으로 자연스럽게 풀었습니다.
- source_word: יָקִים לְךָ
  english_pob_choice: will raise up for you
  chosen_korean: 당신을 위해 … 일으키실 것입니다
  alternatives_korean:
  - 당신을 위해 … 세우실 것입니다
  - 당신을 위해 … 일으켜 세우실 것입니다
  lexicon: HALOT
  rationale: קום의 ‘일으키다/세우다’ 의미를 살리되, 한국어에서 예언자나 지도자를 하나님이 세우신다는 뉘앙스를 자연스럽게 전달했습니다.
- source_word: תִּשְׁמָעוּן
  english_pob_choice: you must listen
  chosen_korean: 귀를 기울여야 합니다
  alternatives_korean:
  - 들어야 합니다
  - 순종해야 합니다
  lexicon: HALOT
  rationale: שׁמע의 의미 범위를 고려해 단순 청취보다 ‘주의 깊게 듣다’에 가까운 한국어로 옮겨, 명령의 강도를 유지하되 지나친 해석인 ‘순종하다’는 피했습니다.
theological_decisions:
- issue: 후대 메시아 적용을 본문에 직접 반영할지 여부
  chosen_reading: 본문은 ‘나와 같은 한 예언자’라는 즉각적 의미를 유지하고, 후대의 메시아적 적용은 본문 밖 해석으로 남깁니다.
  alternative_readings:
  - ‘메시아 같은 예언자’처럼 명시적으로 메시아화하는 번역
  - ‘그 예언자’처럼 특정화하는 번역
  rationale: 히브리어는 단순히 ‘한 예언자 like me’라고 말하며, 본문 자체에 메시아라는 명칭을 넣지 않습니다. 따라서 원문이 말하는 정도까지만 본문에 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어휘에 따라 יהוה를 학술적 표기인 ‘야훼’로 옮겨, 원문 고유명사의 식별성을 유지했습니다.
  doctrine_reference: Project glossary
- issue: שמוע의 번역 강도
  chosen_reading: ‘귀를 기울여야 합니다’로 옮겨 청취와 응답의 요구를 함께 암시합니다.
  alternative_readings:
  - ‘들어야 합니다’
  - ‘순종해야 합니다’
  rationale: 문맥상 예언자의 말을 단순히 듣는 것이 아니라 받아들이라는 요구가 있으나, 본문이 직접 ‘복종하다’의 동사만을 쓰지는 않으므로 과잉해석을 피했습니다.
  doctrine_reference: HALOT; Translation philosophy §§1,4
