  terminology: ‘내 이름으로’, ‘다른 신들의 이름으로’, ‘예언자’, ‘죽어야 합니다’는 원문의 직접 화법, 종교 용어, 법적 결과를 적절히 반영합니다. ‘죽어야 합니다’는 히브리어의 간결한 사형 선고를 불필요하게 처형 방식으로 구체화하지 않습니다.
