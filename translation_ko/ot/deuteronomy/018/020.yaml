  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
  footnotes:
  - marker: a
    text: Or 'acts presumptuously' / 'speaks arrogantly.' The Hebrew verb conveys willful presumption or arrogant overstepping.
    reason: lexical_alternative
  - marker: b
    text: Or 'must die' or 'is to be put to death.' The Hebrew gives the legal death sentence in a terse form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 이름으로 내가 말하라고 명령하지 않은 말을 주제넘게 하는 예언자, 또는 다른 신들의 이름으로 말하는 그 예언자는 죽어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주제넘게’는 히브리어 동사의 의도적 월권과 오만한 넘음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽어야 합니다’는 히브리어의 간결한 법정 선고를 한국어로 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 오직
  lexicon: HALOT
  rationale: 앞절의 참된 예언자와 대비되는 강한 전환을 한국어에서 자연스럽게 표시하면서, 법조문 특유의 단호함을 유지합니다.
- source_word: יָזִיד
  english_pob_choice: presumptuously
  chosen_korean: 주제넘게
  alternatives_korean:
  - 감히
  - 분수 없이
  - 교만하게
  lexicon: HALOT
  rationale: 의도적 월권과 오만한 넘음을 함께 드러내는 말로, 단순한 ‘담대함’이 아니라 금지된 경계를 넘는 뉘앙스를 살립니다.
- source_word: לְדַבֵּר דָּבָר
  english_pob_choice: speaks a word
  chosen_korean: 말하라고 명령하지 않은 말을
  alternatives_korean:
  - 말하라고 하지 않은 말을
  - 말하도록 명령하지 않은 말을
  - 말할 어떤 말을
  lexicon: HALOT
  rationale: 히브리어의 ‘말하다 + דבר(말/말씀)’ 구조를 살리되, 한국어에서는 반복을 줄여 법적 금지 내용이 분명하게 읽히도록 했습니다.
- source_word: בִּשְׁמִי
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 의해
  - 내 이름을 내세워
  lexicon: HALOT
  rationale: 하나님의 직접 화법을 그대로 살려, ‘야훼’로 풀어 쓰지 않고 1인칭 소유 표현을 유지했습니다.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  english_pob_choice: in the name of other gods
  chosen_korean: 다른 신들의 이름으로
  alternatives_korean:
  - 다른 신의 이름으로
  - 타신들의 이름으로
  - 다른 신들을 내세워
  lexicon: HALOT
  rationale: 다른 신을 호출해 권위 근거로 삼는 행위를 직역에 가깝게 옮겨, 대조되는 종교적 충성을 선명하게 드러냅니다.
- source_word: וּמֵת
  english_pob_choice: shall die
  chosen_korean: 죽어야 합니다
  alternatives_korean:
  - 반드시 죽어야 합니다
  - 죽을 것입니다
  - 죽게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 법정 선고를 한국어 법률문체로 자연스럽게 옮기면서, 수동적 처형 표현보다 판결의 결과를 직접 드러냅니다.
theological_decisions:
- issue: 불법 예언에 대한 사형 선고의 문체
  chosen_reading: ‘죽어야 합니다’로 옮겨, 단순 예측이 아니라 법적 판결 선고로 읽히게 했습니다.
  alternative_readings:
  - ‘죽습니다’
  - ‘사형에 처해야 합니다’
  - ‘반드시 죽어야 합니다’
  rationale: 본문은 행위의 결과를 알리는 서술이 아니라 언약 공동체 안에서의 재판적 선언입니다. 그래서 단순 미래보다 규범적 판결 어감을 살리되, 원문의 간결함을 과도하게 풀지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 하나님의 직접 화법 보존
  chosen_reading: ‘내 이름으로’라는 1인칭 표현을 유지해, 본문 안에서 하나님의 직접 발화를 그대로 드러냈습니다.
  alternative_readings:
  - ‘여호와의 이름으로’
  - ‘주님의 이름으로’
  rationale: 히브리어는 하나님 자신의 입으로 말하는 구조이므로, 후대의 대치어를 넣기보다 원문의 직접 화법을 유지하는 편이 문맥과 신학적 긴장을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
