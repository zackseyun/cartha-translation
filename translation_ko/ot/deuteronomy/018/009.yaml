id: DEU.18.9
reference: Deuteronomy 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
  footnotes:
  - marker: a
    text: Or 'like the abominations of those nations'; the Hebrew preposition can express comparison or conformity.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님이신 야훼께서 당신에게 주시는 땅에 들어갈 때에는, 그 민족들의 가증한 일들을 따라 행하는 법을 배우지 말아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 민족들의 가증한 일들처럼’; 히브리어 전치사는 비교와 준거의 의미를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB가 고유한 언약 이름을 살리기 위해 야훼를 택하므로, 한국어도 관용적 대체어인 ‘주’ 대신 야훼로 옮겨 원문 고유명성을 보존했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 나라
  lexicon: HALOT
  rationale: 신명기 문맥의 언약적 지시 대상이지만, 한국어에서는 ‘땅’이 가장 직접적이며 자연스러워 원문의 지시성을 유지했습니다.
- source_word: נֹתֵן לָךְ
  english_pob_choice: is giving you
  chosen_korean: 주시는
  alternatives_korean:
  - 주고 계시는
  - 주실
  lexicon: HALOT
  rationale: 분사형의 현재적·임박적 뉘앙스를 살려 ‘주시는’으로 옮겼습니다. ‘주실’은 미래로만 좁아질 수 있습니다.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  english_pob_choice: you shall not learn to do
  chosen_korean: 행하는 법을 배우지 말아야 합니다
  alternatives_korean:
  - 따라 행하는 법을 배우지 말아야 합니다
  - 그것들을 하도록 배우지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어 ‘배우다 + 하다’ 구성을 한국어의 자연스러운 관용인 ‘행하는 법을 배우다’로 풀되, 금지의 초점을 유지했습니다.
- source_word: כְּתוֹעֲבֹת
  english_pob_choice: according to the abominations
  chosen_korean: 가증한 일들
  alternatives_korean:
  - 가증한 것들
  - 가증스러운 관습들
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 강한 도덕·언약적 비난을 약화시키지 않기 위해 ‘가증한 일들’로 옮겼습니다. ‘관습들’은 의미를 좁힐 수 있습니다.
theological_decisions:
- issue: 여호와(야훼)의 표기와 호칭
  chosen_reading: 본문에는 고유명 ‘야훼’를 사용하고, ‘당신의 하나님’으로 관계 호칭을 함께 유지했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’ 표기
  rationale: 본문의 יְהוָה를 제목적 호칭으로 환원하지 않고, 언약 이름과 관계 호칭을 함께 드러내기 위해 ‘야훼’와 ‘당신의 하나님’을 병기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: כְּ의 비교/준거 뉘앙스
  chosen_reading: ‘그 민족들의 가증한 일들을 따라 행하는’으로 옮겨 준거·동화의 의미를 살렸습니다.
  alternative_readings:
  - ‘그 민족들의 가증한 일들처럼’
  - ‘그 민족들의 가증한 일들에 따라’
  rationale: כְּ가 단순한 비교만이 아니라 그 행위를 본받아 맞추는 뉘앙스를 담으므로, 한국어에서는 ‘따라 행하는’으로 자연스럽게 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
