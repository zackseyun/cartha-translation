revisions:
- from: 주 당신의 하나님 야훼께서 당신에게 주시는 땅에 들어갈 때, 당신은 그 민족들의 가증한 일들을 따라 행하는 법을 배우지 말아야 합니다.[a]
  to: 당신의 하나님이신 야훼께서 당신에게 주시는 땅에 들어갈 때에는, 그 민족들의 가증한 일들을 따라 행하는 법을 배우지 말아야 합니다.[a]
  rationale: 원문에 없는 ‘주’를 삭제하고, יְהוָה אֱלֹהֶיךָ의 동격 관계를 ‘당신의 하나님이신 야훼’로 명료하게 다듬었습니다. 그 밖의 표현은 원문의 금지 명령, 가증함의 강도, 그리고 כְ의 본받음/준거 뉘앙스를 유지하므로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:46:57Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 시간절, ‘야훼 당신의 하나님’, 땅을 주심, 금지, 그리고 민족들의 가증한 행위를 본받는다는 의미를 대체로 충실히 반영합니다. 그러나 본문의 고유명사 야훼 앞에 없는 호칭 ‘주’를 추가한 것은 원문과 POB의 야훼 표기 방침에 맞지 않습니다.
  naturalness: ‘당신의 하나님이신 야훼께서’는 원문의 동격 관계를 현대 표준 한국어로 명료하고 자연스럽게 나타냅니다. 주절에서는 주어 ‘당신은’을 생략해도 존대 종결과 문맥상 대상이 분명하며, 문장이 더 매끄러워집니다.
  terminology: ‘야훼’, ‘땅’, ‘가증한 일들’, ‘따라 행하는 법을 배우지 말아야 합니다’는 각각 יְהוָה, הָאָרֶץ, תּוֹעֲבֹת, לֹא תִלְמַד לַעֲשׂוֹת כְּ의 의미와 강도를 적절히 보존합니다. 각주도 כְ의 비교 및 준거 가능성을 적절히 제시합니다.
  issues:
