    issue: ‘야훼’ 앞에 ‘주’를 추가함
    rationale: 히브리어는 ‘야훼, 당신의 하나님’(יְהוָה אֱלֹהֶיךָ)이라고 하며, 별도의 ‘주’라는 호칭이 없습니다. ‘주 당신의 하나님 야훼’는 불필요한 호칭을 더할 뿐 아니라 야훼를 보존하려는 번역 원칙과도 충돌합니다.
