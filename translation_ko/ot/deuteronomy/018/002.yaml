  edition: WLC
  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
  footnotes:
  - marker: a
    text: Or 'his kinsmen.' The Hebrew says 'his brothers,' referring to his fellow Israelites, specifically the other tribes.
    reason: lexical_alternative
  - marker: b
    text: Or 'as he said to him.' The verb is the ordinary Hebrew word for 'speak'; 'promised' is possible by implication but is more interpretive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 그의 형제들[a] 가운데 기업이 없을 것이며, 야훼께서 친히 그의 기업이십니다. 그분께서 그에게 말씀하신 대로[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 직역이며, 여기서는 레위인과 같은 이스라엘 백성, 특히 다른 지파들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말씀하신 대로’는 히브리어의 일반적인 동사 ‘말하다’에 가깝고, ‘약속하신 대로’는 의미상 가능한 해석이지만 더 해석적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  english_pob_choice: inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속분
  - 소유
  lexicon: HALOT
  rationale: 신명기의 분배·유업 문맥에서 נַחֲלָה는 단순 소유보다 ‘배당된 몫/유업’의 뜻이 강하므로, 한국어 성경에서 자연스럽고 신학적 중량감이 있는 ‘기업’을 택했습니다.
- source_word: בְּקֶרֶב אֶחָיו
  english_pob_choice: among his brothers
  chosen_korean: 그의 형제들 가운데서
  alternatives_korean:
  - 그의 형제들 사이에서
  - 그의 동족 가운데서
  lexicon: HALOT
  rationale: בְּקֶרֶב은 관계적·공간적 포함을 나타내므로, 현대 한국어에서는 자연스럽게 ‘가운데서’로 옮겨 원문의 ‘among’ 관계를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 여호와 대용어가 아니라 신적 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לֽוֹ
  english_pob_choice: as he spoke to him
  chosen_korean: 그분께서 그에게 말씀하신 대로입니다
  alternatives_korean:
  - 그분께서 그에게 말씀하신 것처럼입니다
  - 그분께서 그에게 하신 말씀대로입니다
  lexicon: HALOT
  rationale: דִּבֶּר는 기본적으로 ‘말하다’이므로, ‘약속하셨다’로 좁히지 않고 말씀의 행위 자체를 보존하되 한국어에서는 관용적으로 자연스러운 ‘말씀하신 대로’로 처리했습니다.
theological_decisions:
- issue: 야훼가 레위인의 ‘기업’이라는 진술의 처리
  chosen_reading: 설명적 확장을 덧붙이지 않고, 야훼 자신이 그의 기업이라는 직설적 진술을 유지했습니다.
  alternative_readings:
  - ‘야훼께서 그의 몫이십니다’처럼 의미를 풀어씀
  - 레위 지파의 땅 분배와 대비되는 신학을 부연 설명
  rationale: 원문은 신학적 함의를 해설하기보다 압축적으로 제시하므로, 그 긴장과 강도를 그대로 살리는 편이 source-direct 합니다.
  doctrine_reference: Translation philosophy §1 and §3
