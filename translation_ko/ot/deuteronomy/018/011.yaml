    reason: lexical_alternative
translation:
  language: ko
  text: 또는 주문을 거는 자[a], 또는 영매[b]나 심령술사[c]에게 묻는 자, 또는 죽은 자에게 묻는 자[d]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘묶음을 묶는 자’라는 관용구이며, 여기서는 주술적 주문을 거는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: אוֹב는 죽은 자의 영 또는 그 영과 접촉한다고 여겨지는 영매를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: יִדְּעֹנִי는 오컬트적 지식을 다루는 사람을 가리키며, ‘신접한 자’ 또는 전통적으로 ‘박수’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역에 가까이 옮기면 ‘죽은 자를 찾는 자’입니다. 문맥상 죽은 자에게 문의하거나 자문을 구하는 행위를 가리킵니다.
    reason: lexical_alternative
