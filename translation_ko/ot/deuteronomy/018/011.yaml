base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
  footnotes:
  - marker: a
    text: Or 'charmer' for 'one who casts spells'; the Hebrew idiom is literally 'one who binds a binding,' referring to magical incantation.
    reason: lexical_alternative
  - marker: b
    text: Or 'one who inquires of a ghost' for 'one who consults a medium.'
    reason: lexical_alternative
  - marker: c
    text: Or 'wizard' for 'spiritist,' though 'wizard' can sound misleading in modern English.
    reason: lexical_alternative
  - marker: d
    text: Or 'one who consults the dead' or 'one who inquires of the dead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 spells를 거는 자[a], 또는 무당[b]이나 영매[c]에게 묻는 자, 또는 죽은 자[d]를 찾는 자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘묶는 묶음’에 가깝지만, 여기서는 주술적 주문을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: אוֹב는 종종 사자와 접촉하는 매체 또는 그런 매체에게 묻는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: יִדְּעֹנִי는 초자연적 지식을 전하는 사람, 곧 영매적 인물을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘죽은 자를 상의하는 자’ 또는 ‘죽은 자에게 묻는 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  english_pob_choice: one who binds a spell
  chosen_korean: spells를 거는 자
  alternatives_korean:
  - 주문을 거는 자
  - 주술을 묶는 자
  - 마법을 부리는 자
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 의미는 ‘묶다/묶임’이지만, 문맥상 금지된 주술 행위를 가리키므로 현대 한국어에서는 행위를 직접 드러내는 표현이 가장 분명합니다.
- source_word: שֹׁאֵל אוֹב
  english_pob_choice: one who consults a medium
  chosen_korean: 무당
  alternatives_korean:
  - 영매
  - 점술가
  - 혼령에게 묻는 자
  lexicon: HALOT
  rationale: POB의 ‘consults a medium’는 단순한 상담이 아니라 사자와 접촉하는 금지 행위를 뜻하므로, 한국어에서는 독자가 곧바로 이해할 수 있는 점복·영매 계열 표현이 적합합니다.
- source_word: וְ/יִדְּעֹנִי
  english_pob_choice: a spiritist
  chosen_korean: 영매
  alternatives_korean:
  - 무당
  - 주술사
  - 접신자
  lexicon: HALOT
  rationale: יִדְּעֹנִי는 초자연적 지식을 매개하는 사람을 가리키므로, 현대 한국어에서 의미를 가장 중립적으로 전달하는 ‘영매’를 택했습니다.
- source_word: וְ/דֹרֵשׁ אֶל הַ/מֵּתִים
  english_pob_choice: one who seeks the dead
  chosen_korean: 죽은 자를 찾는 자
  alternatives_korean:
  - 죽은 자에게 묻는 자
  - 죽은 자를 상의하는 자
  - 죽은 자와 접촉하려는 자
  lexicon: HALOT
  rationale: 히브리어는 죽은 자에게 접촉·문의하는 강한 금지어를 사용하므로, 한국어에서도 직역에 가까운 형태를 유지해 의미의 날카로움을 보존했습니다.
theological_decisions:
- issue: 주술·강신 용어를 한국 교회 전통어로 완전히 순화할지 여부
  chosen_reading: 문맥이 요구하는 금지된 비술 행위를 드러내기 위해 ‘spells’, ‘무당’, ‘영매’, ‘죽은 자를 찾는 자’처럼 구체적이고 직설적인 표현을 사용했습니다.
  alternative_readings:
  - 전통적이고 완곡한 ‘주술사’, ‘요술하는 자’, ‘점쟁이’로 완화한다
  rationale: 이 절은 단순한 미신 비판이 아니라 이스라엘에게 금지된 점술·강신·사자 접촉 행위를 열거합니다. 따라서 독자가 실제로 무엇이 금지되는지 분명히 알 수 있도록 source-direct하게 옮겼습니다.
  doctrine_reference: 신명기 18:10-12의 금지 목록; 번역 원칙
