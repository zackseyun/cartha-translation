base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: ko
  text: 호렙에서, 곧 모임의 날에 당신이 야훼 당신의 하나님께 구한 것과 같습니다. 곧 말하기를, “야훼 내 하나님의 음성을 다시는 듣지 않게 해 주십시오. 이 큰 불도 다시는 보지 않게 해 주십시오. 그러면 내가 죽을까 두렵습니다.”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘모임’은 여기서 히브리어 קָהָל의 공적 집합을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘다시는’은 히브리어 אֹסֵף의 반복 중단 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה / אֱלֹהֶיךָ
  english_pob_choice: the LORD your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 주 당신의 하나님
  lexicon: YHWH, אלהים
  rationale: 원문이 언약적 신명 체계를 가리키므로 POB 기본값인 ‘야훼’를 살리고, 소유격은 자연스러운 2인칭 존칭 없이 ‘당신의 하나님’으로 옮겼습니다.
- source_word: בְּחֹרֵב בְּיוֹם הַקָּהָל
  english_pob_choice: at Horeb on the day of the assembly
  chosen_korean: 호렙에서, 곧 모임의 날에
  alternatives_korean:
  - 호렙에서 회중의 날에
  - 호렙에서 집회의 날에
  lexicon: חֹרֵב, קָהָל
  rationale: ‘קָהָל’을 제도적 ‘회중’보다 그 사건성을 드러내는 ‘모임’으로 번역해, 시내 산 언약 체험의 현장성과 공적 집합을 함께 살렸습니다.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ ... וְלֹא אֶרְאֶה עוֹד
  english_pob_choice: Let me not continue to hear ... and let me not see ... anymore
  chosen_korean: 다시는 듣지 않게 해 주십시오 ... 다시는 보지 않게 해 주십시오
  alternatives_korean:
  - 계속 듣지 않게 해 주십시오 ... 더 이상 보지 않게 해 주십시오
  - 더 듣지 않게 해 주십시오 ... 다시 보지 않게 해 주십시오
  lexicon: אוסיף, שמע, ראה
  rationale: אָסֵף의 완료·증가 뉘앙스를 한국어에서 ‘다시는’으로 자연스럽게 재현하여, 일회적 금지가 아니라 반복 중단의 뜻을 살렸습니다.
theological_decisions:
- issue: 백성의 요청을 직접 인용하는 화법의 호칭과 존칭
  chosen_reading: 인용문 안에서는 하나님께 드리는 청원체를 유지하되, 본문 서술은 평서형 합쇼체로 번역했습니다.
  alternative_readings:
  - 인용문 전체를 서술체로 평준화
  - 기도문처럼 과도하게 경어를 높임
  rationale: 원문은 모세가 백성의 말을 인용하는 구조이므로, 바깥 서술과 안쪽 직접화법의 층위를 구분해 독자가 발화 주체를 분명히 알게 해야 합니다.
  doctrine_reference: 구조적 인용 화법 보존
