  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
  footnotes:
  - marker: a
    text: Or, 'I will call him to account.' The Hebrew says literally, 'I will require it from him,' expressing divine accountability for refusing the prophet's words.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 사람이 내 이름으로 말하는 내 말을 듣지 않으면, 나 자신이 그에게 그것을 요구할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 직역은 ‘그에게서 그것을 요구하겠다’입니다. 이는 단순한 문의가 아니라, 하나님의 말씀을 거부한 책임을 묻는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 그리하면
  - 그러면
  lexicon: HALOT
  rationale: 앞 절의 경고를 이어 주는 접속으로서 자연스러운 한국어 연결어를 택하되, 법적·예언적 문맥의 전개를 유지했습니다.
- source_word: לֹא יִשְׁמַע אֶל
  english_pob_choice: does not listen to
  chosen_korean: 듣지 않으면
  alternatives_korean:
  - 귀를 기울이지 않으면
  - 순종하지 않으면
  lexicon: HALOT
  rationale: שׁמע의 핵심인 ‘듣다/귀 기울이다’의 의미를 살리되, 여기서는 예언자의 말을 받아들이지 않는 반응을 자연스럽게 드러내는 표현을 선택했습니다.
- source_word: אֶת־דְּבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말씀들
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘말들’의 개별성을 과도하게 부각하기보다, 한국어에서 자연스러운 하나의 묶음인 ‘내 말’로 옮겨도 원의가 유지됩니다.
- source_word: בִּשְׁמִי
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 권위로
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 유지해, 하나님이 위임하신 대표 발언이라는 예언적 권위를 분명하게 드러냈습니다.
- source_word: אָנֹכִי אֶדְרֹשׁ מֵעִמּוֹ
  english_pob_choice: I myself will require it from him
  chosen_korean: 나 자신이 그에게 그것을 요구할 것입니다
  alternatives_korean:
  - 내가 그에게 그것을 따질 것입니다
  - 내가 그에게 책임을 물을 것입니다
  lexicon: HALOT
  rationale: דרשׁ의 법정적·책임 추궁 의미를 살리면서, ‘그에게서’라는 방향성을 한국어 목적어화로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: דרשׁ의 책임 추궁 표현을 어떻게 살릴 것인가
  chosen_reading: ‘요구할 것입니다’로 옮겨 하나님의 직접적인 책임 추궁을 유지했습니다.
  alternative_readings:
  - ‘책임을 물을 것입니다’
  - ‘그를 심판하겠습니다’
  rationale: 본문은 불순종에 대한 신적 책임 추궁을 말하지만 구체적 형벌 방식은 밝히지 않습니다. 따라서 강한 종말론적 해석으로 좁히지 않고, 원문의 엄중한 법적 뉘앙스를 보존했습니다.
  doctrine_reference: 본문의 경고 강도와 범위를 원문 수준에서 유지
- issue: 예언자의 말에 대한 불응의 성격
  chosen_reading: ‘듣지 않으면’으로 옮겨 청각적 불이행과 응답 거부를 함께 담았습니다.
  alternative_readings:
  - ‘순종하지 않으면’
  - ‘받아들이지 않으면’
  rationale: 히브리어 שׁמע는 단순 청취를 넘는 응답의 의미를 가질 수 있지만, 여기서 본문이 직접 말하는 것은 ‘듣지 않음’입니다. 따라서 과도한 해석을 피하면서도 실제 뜻을 드러내는 표현을 택했습니다.
  doctrine_reference: 청종의 불응과 언약적 책임
