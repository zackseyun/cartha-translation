translation:
  language: ko
  text: 내가 그들을 위해 그들의 형제들[a] 가운데서 너와 같은 한 예언자를 일으키겠습니다. 내가 내 말을 그의 입에 두겠습니다. 그는 내가 그에게 명령하는 모든 것을 그들에게 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 친족’ 또는 ‘그들의 동족(이스라엘 백성)’; 히브리어는 문자적으로 ‘그들의 형제들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  english_pob_choice: a prophet
  chosen_korean: 예언자 하나
  alternatives_korean:
  - 예언자
  - 선지자
  lexicon: HALOT
  rationale: 히브리어 անarthrous 명사에 맞춰 단수성과 비한정성을 살리되, 현대 표준어에서 source-direct한 ‘예언자’를 택했습니다.
- source_word: אָקִים
  english_pob_choice: I will raise up
  chosen_korean: 일으켜 세우고
  alternatives_korean:
  - 일으키고
  - 세워 주고
  - 세우고
  lexicon: HALOT
  rationale: קום의 히필이 지닌 ‘일으키다/세우다’의 소집·임명 뉘앙스를 살리면서 한국어에서 자연스러운 동작 표현으로 옮겼습니다.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  english_pob_choice: from among their brothers
  chosen_korean: 그들의 형제들[a] 가운데서
  alternatives_korean:
  - 그들의 형제들 가운데서
  - 그들의 친족 가운데서
  - 그들의 동족 가운데서
  lexicon: HALOT
  rationale: 직역의 ‘형제들’ 구조를 유지하되, 한국어에서는 ‘가운데서’로 מִקֶּרֶב의 ‘from among’ 뜻을 자연스럽게 드러냈습니다.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  english_pob_choice: and I will put my words in his mouth
  chosen_korean: 내 말을 그의 입에 넣어 주겠으며
  alternatives_korean:
  - 내 말을 그의 입에 두겠으며
  - 내 말을 그의 입에 넣겠으며
  - 내 말을 그의 입속에 두겠으며
  lexicon: HALOT
  rationale: 예언자적 위임 공식의 비유를 그대로 살리면서, ‘넣어 주다’로 신적 부여와 능동적 위임을 드러냈습니다.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  english_pob_choice: all that I command him
  chosen_korean: 내가 그에게 명령하는 모든 것을
  alternatives_korean:
  - 내가 그에게 명령할 모든 것을
  - 내가 그에게 명하는 모든 것을
  lexicon: HALOT
  rationale: 완전한 범위를 나타내는 ‘모든 것’을 살리면서, 현재형적 미래를 한국어의 자연스러운 관용으로 처리했습니다.
theological_decisions:
- issue: 예언자의 정체를 본문에서 어떻게 제시할 것인가
  chosen_reading: 본문은 모세와 같은 한 예언자를 약속하는 형태를 유지하고, 메시아적 동일시를 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 집단적 예언자 계열로 읽기
  - 종말론적 단일 예언자, 곧 메시아로 읽기
  rationale: 히브리어 본문 자체가 명시적 동일시를 하지 않으므로, 주석적 해석을 본문 번역에 선반영하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: אֲחֵיהֶם의 지시 범위를 어떻게 드러낼 것인가
  chosen_reading: ‘형제들’의 남성 복수형을 유지하되, 한국어 각주로 동족/이스라엘 구성원 뜻을 밝힙니다.
  alternative_readings:
  - 형제
  - 친족
  - 동족
  rationale: 형태상 남성 복수의 친족 용어를 지우지 않으면서도, 현대 독자가 혈연 남매로 오해하지 않도록 문맥적 의미를 보조해야 합니다.
  doctrine_reference: Translation philosophy §4
