source:
  edition: WLC
  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
  footnotes:
  - marker: a
    text: Or 'is dispossessing them'; the Hebrew verb can emphasize causing the nations to lose possession of the land as well as driving them out.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들을 행하는 사람은 누구든지 야훼께 가증한 자입니다. 이런 가증한 일들 때문에 야훼 네 하나님께서 그들을 네 앞에서 쫓아내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 מוֹרִישׁ는 여기서 ‘쫓아내다’뿐 아니라 그들이 그 땅의 소유를 잃게 하다라는 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹעֲבַת יְהוָה
  english_pob_choice: an abomination to Yahweh
  chosen_korean: 야훼께 가증한 자
  alternatives_korean:
  - 야훼께 가증한 일
  - 야훼께 혐오스러운 것
  lexicon: HALOT
  rationale: תוֹעֵבָה는 단순한 ‘싫어함’보다 언약적·도덕적 혐오를 가리키므로, 행위자 표현인 כָּל עֹשֵׂה אֵלֶּה에 맞춰 ‘가증한 자’로 옮겼습니다.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  english_pob_choice: everyone who does these things
  chosen_korean: 이런 일들을 행하는 사람은 누구든지
  alternatives_korean:
  - 이런 일들을 하는 자는 모두
  - 이런 일들을 행하는 자마다
  lexicon: HALOT
  rationale: כָּל + 분사구문은 포괄적 일반 진술이므로, 한국어에서는 ‘누구든지’로 자연스럽게 보편성을 살렸습니다.
- source_word: מוֹרִישׁ אֹתָם
  english_pob_choice: is driving them out
  chosen_korean: 그들을 … 쫓아내고 계십니다
  alternatives_korean:
  - 그들을 … 몰아내고 계십니다
  - 그들에게서 그 땅을 빼앗고 계십니다
  lexicon: HALOT
  rationale: 히필 ירש는 ‘추방하다/축출하다’와 ‘땅을 상속에서 빼앗다’의 뉘앙스를 모두 가질 수 있으므로, 문맥상 전면에는 ‘쫓아내다’를 두고 진행 중인 현재형으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼, 곧 당신의 하나님
  alternatives_korean:
  - 야훼 당신의 하나님
  - 야훼 하나님
  lexicon: HALOT
  rationale: 신명기의 직접 호칭을 살리면서, 한국어에서 어순이 불자연해질 수 있어 삽입구 ‘곧’으로 관계를 분명히 했습니다.
theological_decisions:
- issue: 가증함을 행위가 아닌 행위자에게 귀속시키는 표현
  chosen_reading: 행위 자체의 혐오성을 유지하되, כָּל עֹשֵׂה אֵלֶּה를 ‘행하는 사람’으로 받아 ‘야훼께 가증한 자’로 옮겼습니다.
  alternative_readings:
  - ‘이런 일들은 야훼께 가증합니다’
  - ‘이런 일을 하는 모든 사람은 야훼께 가증한 존재입니다’
  rationale: 본문은 단순한 행위 비난을 넘어 그러한 행위를 지속하는 자를 언약 공동체 밖으로 규정하는 경고이므로, 주어의 인격적 책임을 드러내는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 신명기 18:9-14의 금지 조항과 언약적 정결 개념
- issue: מוֹרִישׁ의 현재진행적 뉘앙스
  chosen_reading: ‘쫓아내고 계십니다’로 현재 진행을 살려, 심판이 이미 작동 중임을 드러냈습니다.
  alternative_readings:
  - ‘쫓아내십니다’
  - ‘몰아내십니다’
  rationale: 영문 POB의 ‘is driving out’처럼 히브리어 동사도 결과만이 아니라 진행 중인 실행을 강조하므로, 한국어에서도 진행형을 사용해 동적 뉘앙스를 보존했습니다.
  doctrine_reference: 여호수아 정복 서사의 신적 주권과 심판 집행
