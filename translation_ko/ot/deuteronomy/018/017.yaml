  - 그들이 말한 것이 옳았습니다
  lexicon: HALOT
  rationale: 히필 הֵיטִיבוּ의 평가 기능을 한국어에서는 ‘잘’로 간결하게 살리고, 뒤따르는 יחס절을 영어 POB처럼 자연스럽게 흡수했습니다.
theological_decisions:
- issue: 야훼의 직접 화법을 한국어 존대 체계로 어떻게 처리할지
  chosen_reading: 서술문은 합쇼체를 유지하되, 야훼의 발화는 「…말씀하셨습니다」로 존대하여 표기했습니다.
  alternative_readings:
  - 『그들이 잘 말하였습니다』
  - 「그들이 잘 말하였다」
  rationale: 본문은 야훼의 직접 발화를 전달하므로 한국어 공손체로도 신적 화자의 위엄을 드러내는 것이 적절합니다.
  doctrine_reference: '번역 원칙: direct address to God uses honorific verb endings'
- issue: 히브리어 יחס절의 직역 정도
  chosen_reading: 영어 POB의 ‘have spoken well’에 맞추어 한국어도 평가를 하나의 관용적 표현으로 압축했습니다.
  alternative_readings:
  - 그들이 말한 것을 잘하였습니다
  - 그들이 무엇을 말하였는지 잘하였습니다
  rationale: 원문은 ‘그들이 말한 것에 대해 잘하였다/잘 말하였다’는 평가를 담고 있으므로, 한국어에서도 의미 손실 없이 간결하게 전달하는 것이 적절합니다.
  doctrine_reference: source-direct, optimal-equivalence
