  source_fidelity: 송곳으로 귀를 문에 대고 뚫는 행위와 종속 신분의 지속을 대체로 반영했으나, 현행 ‘그의 귀와 문에 대고 뚫으십시오’는 귀와 문을 각각 뚫는 듯하게도 읽힐 수 있습니다. 또한 עֶבֶד עוֹלָם은 ‘평생 당신의 것이 됩니다’보다 ‘평생 당신의 노예가 될 것입니다’가 원문의 술어와 관계를 더 직접적으로 반영합니다.
  naturalness: ‘그의 귀를 문에 대고 송곳으로 뚫으십시오’가 현대 표준 한국어에서 동작의 순서와 도구를 더 명료하게 나타냅니다. ‘평생 당신의 것이 됩니다’는 사람을 물건처럼 지칭하는 부자연스러운 중복 표현이므로 피하는 편이 좋습니다.
  terminology: מַרְצֵעַ의 ‘송곳’ 및 עֶבֶד/אָמָה의 ‘노예/여자 노예’는 법적 종속 상태를 일관되게 드러냅니다. עוֹלָם은 이 법 조항에서는 무한한 시간으로 단정하지 않고 ‘평생’으로 옮기는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 귀와 문의 관계가 불명료함
    rationale: ‘그의 귀와 문에 대고 뚫으십시오’는 송곳으로 귀를 뚫어 문에 박는 동작보다 귀와 문을 모두 뚫는다는 뜻으로도 이해될 수 있습니다. 히브리어의 בְאָזְנוֹ וּבַדֶּלֶת와 문맥상 귀를 문에 대고 뚫는 관계를 명시하는 편이 안전합니다.
