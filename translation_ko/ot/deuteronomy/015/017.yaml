    rationale: 원문은 ‘그가 네게 평생의 노예가 될 것이다’라는 구조입니다. ‘당신의 것’은 ‘노예’와 의미가 겹치며, 사람을 가리키는 자연스러운 법률적 서술도 아닙니다.
