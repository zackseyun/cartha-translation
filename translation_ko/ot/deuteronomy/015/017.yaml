source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your slave permanently. And you shall do the same for your female slave.
  footnotes:
  - marker: a
    text: Or 'forever'; the Hebrew can also be rendered 'for life' in this legal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 송곳을 가져다가 그의 귀를 문에 대고 뚫으십시오. 그러면 그는 평생 당신의 노예가 될 것입니다[a]. 당신의 여자 노예에게도 똑같이 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영구히’; 히브리어는 이 법적 문맥에서 ‘평생 동안’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  english_pob_choice: the awl
  chosen_korean: 송곳
  alternatives_korean:
  - 송곳칼
  - 뚫는 도구
  lexicon: HALOT
  rationale: 마르체아는 구멍을 뚫는 도구이므로 기능을 살려 송곳으로 옮겼습니다. 한국어 성경에서 익숙한 법적·의식적 맥락도 유지됩니다.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  english_pob_choice: put it through his ear and into the door
  chosen_korean: 그의 귀와 문에 대고 뚫으십시오
  alternatives_korean:
  - 그의 귀를 뚫어 문에 대십시오
  - 그의 귀를 문에 대고 뚫으십시오
  lexicon: HALOT
  rationale: 히브리어는 송곳을 귀와 문에 ‘대고/넣어’ 뚫는 동작을 뜻하므로, 의식적 행위를 분명히 드러내되 과도한 설명은 피했습니다.
- source_word: עֶבֶד עוֹלָם
  english_pob_choice: your slave permanently
  chosen_korean: 평생 당신의 것이 됩니다
  alternatives_korean:
  - 영원히 당신의 노예가 됩니다
  - 평생 노예가 됩니다
  lexicon: HALOT
  rationale: עוֹלָם은 이 법적 문맥에서 ‘평생/영구히’의 지속을 가리키므로, ‘평생’으로 옮겨 과도한 영원성을 피했습니다. 다만 관계의 귀속성을 살리기 위해 ‘당신의 것’ 표현을 더했습니다.
- source_word: אֲמָתְךָ
  english_pob_choice: your female slave
  chosen_korean: 여자 노예
  alternatives_korean:
  - 여종
  - 여자 종
  - 여성 노예
  lexicon: HALOT
  rationale: 같은 절의 עֶבֶד를 ‘노예’로 옮겼으므로, אָמָה도 같은 강도의 종속 상태를 드러내도록 ‘여자 노예’로 맞췄습니다.
theological_decisions:
- issue: 본문의 bonded-status 용어를 약화시키지 않는 번역
  chosen_reading: ‘노예’로 옮겨 법적 종속성을 분명히 드러냈습니다.
  alternative_readings:
  - 종
  - 종복
  - 종의
  rationale: 이 절은 종신적 예속 관계를 규정하는 법 조항이므로, 완곡한 ‘종’보다 ‘노예’가 원문의 사회·법적 무게를 더 정확히 반영합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, contested terms (bonded status terminology)
- issue: עוֹלָם의 범위
  chosen_reading: ‘평생’으로 번역해 계약적·법적 지속을 나타냈습니다.
  alternative_readings:
  - 영원히
  - 영구히
  rationale: 레위기 25장의 희년 규정과 함께 읽을 때, כאן의 지속은 절대적 무한보다 법적 지속을 뜻하므로 ‘평생’이 더 정확합니다.
  doctrine_reference: Leviticus 25 / Translation philosophy on legal זמן expressions
