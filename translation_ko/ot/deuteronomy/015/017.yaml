- from: 그런 다음 송곳을 가져다가 그의 귀와 문에 대고 뚫으십시오[a]. 그러면 그는 당신의 노예가 평생 당신의 것이 됩니다. 그리고 당신의 여자 노예에게도 똑같이 하십시오.
  to: 그런 다음 송곳을 가져다가 그의 귀를 문에 대고 뚫으십시오. 그러면 그는 평생 당신의 노예가 될 것입니다[a]. 당신의 여자 노예에게도 똑같이 하십시오.
  rationale: 귀와 문 사이의 물리적 관계를 한국어 문장 안에서 명료하게 하고, עֶבֶד עוֹלָם을 ‘평생 당신의 노예가 될 것입니다’로 직역에 가깝고 자연스럽게 정리했습니다. עוֹלָם의 법적 지속성에 관한 각주는 해당 표현에 연결하고, 본문과 중복되지 않는 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
