revisions:
- from: 이는 야훼 당신의 하나님께서 당신에게 복을 주셨기 때문입니다. 그분께서 당신에게 말씀하신 그대로입니다[a]. 당신은 많은 민족에게 빌려줄 것이나, 당신은 꾸지 않을 것이며, 당신은 많은 민족을 다스릴 것이나, 그들이 당신을 다스리지는 못할 것입니다.
  to: 야훼 당신의 하나님께서 당신에게 약속하신 대로 복을 주셨으므로, 당신은 많은 민족들에게 빌려줄 것이나 꾸지는 않을 것이며, 많은 민족들을 다스릴 것이나 그들이 당신을 다스리지는 않을 것입니다[a].
  rationale: 본문을 원문의 인과 관계에 맞춰 한 문장으로 재구성했습니다. 언약 문맥과 영어 POB의 번역 선택을 따라 דִּבֶּר를 본문에서는 ‘약속하신 대로’로 옮기되, 문자적 대안 ‘말씀하신 대로’는 각주에 남겼습니다. 또한 원문의 단순 미래 부정을 보존하도록 ‘다스리지는 못할 것입니다’를 ‘다스리지는 않을 것입니다’로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:49:51Z'
