base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
  footnotes:
  - marker: a
    text: Or, 'has spoken to you.' The Hebrew literally says 'spoken,' but in this covenant context it carries the sense of promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님께서 당신에게 약속하신 대로 복을 주셨으므로, 당신은 많은 민족들에게 빌려줄 것이나 꾸지는 않을 것이며, 많은 민족들을 다스릴 것이나 그들이 당신을 다스리지는 않을 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 말씀하신 대로.’ 히브리어는 문자적으로 ‘말씀하셨다’라고 되어 있으나, 이 언약 문맥에서는 약속의 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
