  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
  footnotes:
  - marker: a
    text: Or, 'has spoken to you.' The Hebrew literally says 'spoken,' but in this covenant context it carries the sense of promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼 당신의 하나님께서 당신에게 복을 주셨기 때문입니다. 그분께서 당신에게 말씀하신 그대로입니다[a]. 당신은 많은 민족에게 빌려줄 것이나, 당신은 꾸지 않을 것이며, 당신은 많은 민족을 다스릴 것이나, 그들이 당신을 다스리지는 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 말씀하신 것입니다.’ 히브리어는 문자적으로 ‘말씀하셨다’라고 되어 있으나, 언약 문맥에서는 약속의 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 מקור 텍스트 원칙에 따라 여호와 대신 고유한 신명인 야훼를 음역으로 살렸습니다.
- source_word: בֵּרַכְךָ
  english_pob_choice: has blessed you
  chosen_korean: 복을 주셨기 때문입니다
  alternatives_korean:
  - 복 주셨습니다
  - 복하셨기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 결과가 현재 문맥에 이어지는 뜻을 살려, 과거 시제보다 한국어에서 자연스러운 결과 상태 표현으로 옮겼습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  english_pob_choice: just as he promised you
  chosen_korean: 당신에게 말씀하신 그대로입니다
  alternatives_korean:
  - 당신에게 약속하신 대로입니다
  - 당신에게 말씀하신 대로입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘말씀하셨다’이지만, 언약 문맥에서 약속의 힘을 갖기 때문에 ‘말씀하신 그대로’로 옮겨 약속의 확정성을 드러냈습니다.
- source_word: וְהַעֲבַטְתָּ / לֹא תַעֲבֹט
  english_pob_choice: you will lend / you will not borrow
  chosen_korean: 빌려줄 것이나, 당신은 꾸지 않을 것이며
  alternatives_korean:
  - 대출해 줄 것이나, 당신은 빌리지 않을 것이며
  - 빌려주게 될 것이나, 당신은 빌려 쓰지 않을 것이며
  lexicon: HALOT
  rationale: 히브리어의 대조를 살리기 위해 ‘빌려주다 / 꾸다’의 짝을 사용했습니다. 한국어에서 상호대차의 관계가 가장 분명하게 드러납니다.
- source_word: גּוֹיִם רַבִּים
  english_pob_choice: many nations
  chosen_korean: 많은 민족
  alternatives_korean:
  - 많은 나라들
  - 많은 이방 민족
  lexicon: HALOT
  rationale: 정치·경제적 대조를 유지하되 한국어에서 자연스러운 집합명사인 ‘민족’을 택했습니다. 반복되는 ‘많은’도 원문의 수량 강조를 살립니다.
theological_decisions:
- issue: דִּבֶּר לָךְ의 의미를 ‘말씀하다’로 둘지 ‘약속하다’로 둘지
  chosen_reading: ‘말씀하신 그대로입니다’로 두어 문자적 의미를 유지하되, 문맥상 약속의 성격을 드러냈습니다.
  alternative_readings:
  - ‘당신에게 약속하신 대로입니다’
  - ‘당신에게 말씀하신 대로입니다’
  rationale: 율법의 언약 문맥에서 ‘말씀하다’는 단순 발화가 아니라 신실한 약속을 포함하므로, 본문 의미를 축소하지 않으면서도 한국어에서 자연스럽게 전달했습니다.
  doctrine_reference: 언약 신실성 / 약속의 성취
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트 기본 원칙에 따라 신명은 대체 칭호가 아니라 고유명사로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
