  lexicon: HALOT
  rationale: 완료형의 결과가 현재 문맥에 이어지는 뜻을 살려, 과거 시제보다 한국어에서 자연스러운 결과 상태 표현으로 옮겼습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  english_pob_choice: just as he promised you
  chosen_korean: 당신에게 말씀하신 그대로입니다
  alternatives_korean:
  - 당신에게 약속하신 대로입니다
  - 당신에게 말씀하신 대로입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘말씀하셨다’이지만, 언약 문맥에서 약속의 힘을 갖기 때문에 ‘말씀하신 그대로’로 옮겨 약속의 확정성을 드러냈습니다.
- source_word: וְהַעֲבַטְתָּ / לֹא תַעֲבֹט
  english_pob_choice: you will lend / you will not borrow
  chosen_korean: 빌려줄 것이나, 당신은 꾸지 않을 것이며
  alternatives_korean:
  - 대출해 줄 것이나, 당신은 빌리지 않을 것이며
  - 빌려주게 될 것이나, 당신은 빌려 쓰지 않을 것이며
  lexicon: HALOT
  rationale: 히브리어의 대조를 살리기 위해 ‘빌려주다 / 꾸다’의 짝을 사용했습니다. 한국어에서 상호대차의 관계가 가장 분명하게 드러납니다.
- source_word: גּוֹיִם רַבִּים
  english_pob_choice: many nations
  chosen_korean: 많은 민족
  alternatives_korean:
  - 많은 나라들
  - 많은 이방 민족
  lexicon: HALOT
  rationale: 정치·경제적 대조를 유지하되 한국어에서 자연스러운 집합명사인 ‘민족’을 택했습니다. 반복되는 ‘많은’도 원문의 수량 강조를 살립니다.
theological_decisions:
- issue: דִּבֶּר לָךְ의 의미를 ‘말씀하다’로 둘지 ‘약속하다’로 둘지
  chosen_reading: ‘말씀하신 그대로입니다’로 두어 문자적 의미를 유지하되, 문맥상 약속의 성격을 드러냈습니다.
  alternative_readings:
  - ‘당신에게 약속하신 대로입니다’
  - ‘당신에게 말씀하신 대로입니다’
  rationale: 율법의 언약 문맥에서 ‘말씀하다’는 단순 발화가 아니라 신실한 약속을 포함하므로, 본문 의미를 축소하지 않으면서도 한국어에서 자연스럽게 전달했습니다.
  doctrine_reference: 언약 신실성 / 약속의 성취
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트 기본 원칙에 따라 신명은 대체 칭호가 아니라 고유명사로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
