  rationale: 본문의 יְהוָה를 프로젝트 기본 원칙에 따라 고유한 언약명으로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
