reference: Deuteronomy 15:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a slave in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
  footnotes:
  - marker: a
    text: Or 'servant' for 'slave'; the Hebrew עֶבֶד can denote either, but here the bondage of Egypt makes 'slave' the stronger rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'ransomed you.' The Hebrew verb carries the sense of redeeming or buying back from bondage.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'this thing'; that is, the instruction being given here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 이집트 땅에서 종이었음을 기억해야 합니다[a]. 야훼 당신의 하나님이 당신을 속량하셨습니다[b][c]. 그러므로 나는 오늘 이 일을 당신에게 명령합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’으로도 옮길 수 있습니다. 히브리어 עֶבֶד는 ‘종’과 ‘노예’를 모두 뜻할 수 있지만, 여기서는 이집트의 억압받는 예속 상태가 두드러지므로 더 강한 표현이 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘값 주고 되사셨습니다.’ 히브리어 동사는 종살이에서 건져내기 위한 속량, 곧 되삼의 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘이 일’을 가리킵니다. 곧 여기서 주어진 지시를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  english_pob_choice: And you shall remember
  chosen_korean: 그리고 당신은 … 기억해야 합니다
  alternatives_korean:
  - 그리고 기억하십시오
  - 당신은 기억해야 합니다
  lexicon: HALOT
  rationale: 법적·권면적 문맥에서 단순 미래보다 의무를 띤 권고로 읽히므로, 한국어에서는 ‘기억해야 합니다’로 명령의 힘을 살렸습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종사자
  lexicon: HALOT
  rationale: 본절은 이집트의 압제 아래 있던 상태를 회상하는 문맥이지만, 한국어 성경 전통에서 ‘종’이 עֶבֶד의 기본 대응이며 문맥상 예속의 강도는 뒤의 ‘속량하셨습니다’가 보완합니다.
- source_word: וַיִּפְדְּךָ
  english_pob_choice: redeemed you
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 되사셨습니다
  lexicon: HALOT
  rationale: פָּדָה의 핵심은 값 주고 되사서 해방하는 의미이므로, 교회어 ‘구속’보다 보다 직설적인 ‘속량’이 본문의 해방·매입 뉘앙스를 잘 드러냅니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 명령
  lexicon: HALOT
  rationale: דָּבָר는 단순히 ‘말’이 아니라 여기서는 바로 앞의 주어진 지시 전체를 가리키므로, 한국어에서는 자연스럽지만 범위를 너무 좁히지 않는 ‘이 일’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
