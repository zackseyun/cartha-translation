source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמַ֣ר אֵלֶ֔י/ךָ לֹ֥א אֵצֵ֖א מֵ/עִמָּ֑/ךְ כִּ֤י אֲהֵֽבְ/ךָ֙ וְ/אֶת בֵּיתֶ֔/ךָ כִּי ט֥וֹב ל֖/וֹ עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'I will not leave you' or 'I will not go free from you.' The Hebrew literally says 'I will not go out from being with you.'
    reason: lexical_alternative
  - marker: b
    text: '''Household'' renders ''house'' in the sense of the people and domestic sphere under the master''s care, not merely the building.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 당신에게 말하기를, ‘나는 당신 곁에서 떠나지 않겠습니다.’ 이는 그가 당신과 당신의 집안을 사랑하고, 당신과 함께 있는 것이 그에게 좋기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신 곁에서 나가지 않겠습니다’입니다. 이곳의 히브리어는 해방을 뜻하는 관용법으로, 보다 자연하게는 ‘당신을 떠나지 않겠습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''집안''은 단순한 건물이 아니라 주인의 보호 아래 있는 사람들과 생활권을 가리킵니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And if
  chosen_korean: 그리고 …하기를
  alternatives_korean:
  - 만일 …하면
  - 그리고 만일
  lexicon: WLC / HALOT
  rationale: 히브리어의 관용적 법률 서두를 한국어에서 자연스러운 조건 제시로 풀어, 문맥의 casuistic 흐름을 유지했습니다.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  english_pob_choice: I will not go out from you
  chosen_korean: 나는 당신 곁에서 떠나지 않겠습니다
  alternatives_korean:
  - 나는 당신에게서 나가지 않겠습니다
  - 나는 당신과 함께 있던 자리에서 나가지 않겠습니다
  lexicon: WLC / HALOT
  rationale: 직역상의 '나가다' 이미지를 살리면서도, 한국어에서 관계적 분리를 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: בֵּיתֶךָ
  english_pob_choice: your household
  chosen_korean: 당신의 집안
  alternatives_korean:
  - 당신의 집
  - 당신의 가족
  lexicon: WLC / HALOT
  rationale: 단순한 건물보다 사람과 생활권을 포함하는 뜻이므로, '집안'으로 옮겨 가정과 종들을 포괄하는 의미를 살렸습니다.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  english_pob_choice: because it is good for him with you
  chosen_korean: 당신과 함께 있는 것이 그에게 좋기 때문입니다
  alternatives_korean:
  - 당신과 함께 있으면 그에게 좋기 때문입니다
  - 그가 당신과 함께 있어서 좋기 때문입니다
  lexicon: WLC / HALOT
  rationale: 히브리어의 보편적 평가 진술을 자연스러운 한국어 주어구로 풀어, 의미를 흐리지 않으면서 읽기 쉬운 형태로 처리했습니다.
theological_decisions:
- issue: 종의 자발적 잔류와 사랑의 동기
  chosen_reading: 이 절은 강제적 소유가 아니라, 주인과 그 집안에 대한 사랑과 선의 때문에 종이 남기를 원한다는 점을 드러냅니다.
  alternative_readings:
  - 단순한 노동 조건의 만족으로만 이해하는 읽기
  - 법적 귀속 관계만 강조하는 읽기
  rationale: 본문은 '사랑하다'와 '좋다'를 동기로 제시하므로, 관계적·윤리적 차원을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 신 15:16 문맥의 종 해방 규정
- issue: בַּיִת의 공동체적 의미
  chosen_reading: '''집안''으로 번역해 물리적 건물보다 가구와 생활공동체를 가리키게 했습니다.'
  alternative_readings:
  - 집
  - 가족
  rationale: English POB의 'household'와 동일하게, 히브리어 '집'의 사회적 범위를 보존해야 문맥의 가족-가사 차원이 살아납니다.
  doctrine_reference: 고대 근동 가족/가사 구조
