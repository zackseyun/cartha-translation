revisions:
- from: 그리고 그가 당신에게 말하기를, ‘나는 당신 곁에서 떠나지 않겠습니다.’ 이는 그가 당신과 당신의 집안을 사랑하고, 당신과 함께 있는 것이 그에게 좋기 때문입니다.[a][b]
  to: 그리고 만일 그가 당신에게 ‘나는 당신에게서 떠나지 않겠습니다’라고 말한다면, 이는 그가 당신과 당신의 집안을 사랑하고 당신과 함께 지내는 것이 그에게 좋기 때문입니다.[a][b]
  rationale: The revision restores the Hebrew conditional structure, uses natural modern formal Korean, and preserves the legal-contextual nuance of ‘go out’ through a restrained footnote. It retains ‘집안’ for the social scope of בַּיִת and avoids doctrinal or moral claims beyond the wording of the verse.
