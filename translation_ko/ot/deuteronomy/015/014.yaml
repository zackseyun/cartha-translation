  source_fidelity: 원문의 강조형 הַעֲנֵיק תַּעֲנִיק은 ‘반드시 넉넉히 마련하여 주어야 합니다’로 의무성과 풍성한 제공의 뜻을 보존했습니다. צֹאן은 양만이 아니라 염소도 포함하므로 ‘양과 염소 떼’로 바로잡았습니다. 마지막 절도 야훼께서 ‘너에게’ 복 주신 것을 근거로 그에게 주라는 구문을 반영했습니다.
