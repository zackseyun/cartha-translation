base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
  footnotes:
  - marker: a
    text: Or 'you shall surely provide for him liberally'; the Hebrew uses an emphatic verbal form meaning to supply abundantly at release.
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 양과 염소 떼와 타작마당과 포도주 짜는 틀에서 나오는 것으로 그에게 반드시 넉넉히 마련하여 주어야 합니다.[a] 야훼 너의 하나님께서 너에게 복 주신 것 가운데서 그에게 주어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반드시 넉넉히 마련하여 주어야 합니다’는 히브리어의 부정사 절대형과 동사형이 결합한 강조 표현을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  english_pob_choice: You shall surely furnish him
  chosen_korean: 반드시 넉넉히 내주어야 합니다
  alternatives_korean:
  - 반드시 공급해야 합니다
  - 반드시 주어야 합니다
  - 넉넉히 갖추어 주어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+동사형)은 단순 명령보다 강한 의무를 나타내므로, ‘반드시’로 강세를 살리고 문맥상 해방 시 제공을 뜻하는 동사를 ‘내주다’로 옮겼습니다.
- source_word: מִצֹּאנְךָ
  english_pob_choice: from your flock
  chosen_korean: 너의 양 떼
  alternatives_korean:
  - 너의 가축 떼
  - 너의 양과 염소 떼
  - 너의 무리
  lexicon: HALOT
  rationale: צאן은 양과 염소를 포함하는 집합 명사이지만, 한국어에서는 문맥의 농목 축복 삼중 구조를 살리면서 가장 자연스러운 집합 표현인 ‘양 떼’를 택했습니다.
- source_word: וּמִגָּרְנְךָ וּמִיִּקְבֶךָ
  english_pob_choice: from your threshing floor ... from your winepress
  chosen_korean: 타작마당과 포도즙틀에서
  alternatives_korean:
  - 타작마당과 포도틀에서
  - 타작마당과 포도주 틀에서
  - 곡식과 포도즙에서
  lexicon: HALOT
  rationale: גורן과 יקב은 각각 타작마당과 포도즙틀을 가리키는 구체적 농업 이미지이므로, 추상화하지 않고 원문의 감각을 보존했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 주 너의 하나님
  - 야훼 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 하나님의 언약명 יְהוָה는 관습적 대체어보다 고유명사 ‘야훼’로 옮겨, 본문의 신적 주체를 제목이 아니라 이름으로 드러냈습니다.
theological_decisions:
- issue: 축복에 근거한 해방 선물의 의무성
  chosen_reading: 해방된 종에게 주는 물질적 예물은 야훼의 축복을 근거로 반드시 주어야 하는 의무로 번역했습니다.
  alternative_readings:
  - 그에게 넉넉히 베풀라는 권고로 완화할 수 있음
  - 단순한 선물 권유로 읽을 수 있음
  rationale: 본문은 ‘반드시’에 해당하는 강조형과 ‘야훼가 복 주신 것에서’라는 근거를 함께 제시하므로, 자발적 호의보다 규범적 의무가 더 강하게 드러나야 합니다.
  doctrine_reference: 신명기 15:14 문맥의 해방 규정
- issue: 대상 지시의 성별 유지
  chosen_reading: ‘그에게’로 남성 단수 대명사를 유지했습니다.
  alternative_readings:
  - ‘그 사람에게’로 성별 비특정화
  - ‘그들에게’로 일반화
  rationale: 히브리어 원문과 영어 POB 모두 단수 남성 대명사를 유지하므로, 문법적 대상을 흐리지 않기 위해 그대로 반영했습니다.
  doctrine_reference: 본문 대명사 일치 원칙
