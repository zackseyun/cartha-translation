  - 주님
  rationale: 이 번역본의 기본 원칙에 따라 신성명 יהוה는 고유 신명으로서 ‘야훼’로 표기해 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 명령문의 한국어 종결과 직접 화법
  chosen_reading: 합쇼체의 명령·금지형(바쳐야 합니다 / 안 됩니다)
  alternative_readings:
