revisions:
- from: 너희의 소와 양에서 태어나는 모든 첫 새끼 수컷은 너희 하나님 야훼께 바쳐야 합니다. 너희는 소의 첫 새끼를 부려서는 안 되며, 양의 첫 새끼의 털도 깎아서는 안 됩니다.[a][b]
  to: 네 소 떼와 작은 가축 떼에서 태어나는 처음 난 모든 수컷은 네 하나님 야훼께 거룩하게 구별하여 바쳐야 합니다. 네 소의 처음 난 것은 부려서는 안 되며, 네 작은 가축 떼의 처음 난 것의 털을 깎아서도 안 됩니다.
  rationale: 히브리어의 단수 대명사와 명령을 ‘네’로 보존하고, בקר와 צאן의 범주를 ‘소 떼’와 ‘작은 가축 떼’로 구별했습니다. קדש는 ‘거룩하게 구별하여 바치다’로, 노동 금지와 털 깎기 금지는 자연스러운 합쇼체로 옮겼습니다. 의미상 필수적이지 않고 앵커가 부정확한 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:53Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 2인칭 남성 단수(‘네’)이며, בקר와 צאן을 구별합니다. 초안의 ‘너희’는 수를 바꾸고, ‘소와 양’은 각각의 집단 명사를 개별 동물로 다소 좁힙니다. 또한 צאן은 양에 한정되지 않을 수 있으므로 ‘양 떼’보다 ‘작은 가축 떼’가 원문의 범위를 더 잘 보존합니다.
  naturalness: ‘처음 난 수컷’과 ‘부리다’, ‘털을 깎다’는 현대 표준어 합쇼체에서 자연스럽고 명확합니다. ‘네 가축 떼와 작은 가축 떼’는 다소 반복적이지만 원문의 두 가축 범주를 보존하는 안전한 표현입니다.
  terminology: קדש의 제의적 의미는 ‘거룩하게 구별하여 바치다’로 명시하는 것이 단순한 헌납보다 정확합니다. יהוה는 프로젝트 원칙과 본문에 따라 ‘야훼’로 유지합니다. ‘처음 난 것’은 בְּכוֹר를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: 2인칭 단수인 히브리어를 ‘너희’로 복수화했습니다.
    rationale: אַתָּה 계열의 접미사와 명령형은 모두 단수입니다. 한국어에서 ‘네’로 보존할 수 있습니다.
  - severity: medium
    issue: ‘소와 양’은 בקר와 צאן의 집단적·포괄적 의미를 축소합니다.
    rationale: בקר는 소 떼/큰 가축, צאן은 양·염소를 포함할 수 있는 작은 가축 떼를 가리킵니다.
  - severity: medium
    issue: ‘바치다’만으로는 קדש의 거룩하게 구별하는 제의적 의미가 충분히 드러나지 않습니다.
    rationale: ‘거룩하게 구별하여 바치다’는 성별과 헌납의 두 요소를 함께 보존합니다.
  - severity: medium
    issue: 각주 a는 본문의 자연스러운 번역을 불필요하게 ‘될 수도 있다’고 처리하며, 각주 b는 본문 끝에 놓여 야훼에 대한 주석의 연결 지점이 불명확하고 내용도 중복됩니다.
    rationale: 이 구절의 한국어 번역에는 해당 대안이나 신명 표기 설명을 위한 각주가 필수적이지 않습니다. 각주를 제거하면 앵커와 내용 문제가 함께 해소됩니다.
  revised_text: 네 소 떼와 작은 가축 떼에서 태어나는 처음 난 모든 수컷은 네 하나님 야훼께 거룩하게 구별하여 바쳐야 합니다. 네 소의 처음 난 것은 부려서는 안 되며, 네 작은 가축 떼의 처음 난 것의 털을 깎아서도 안 됩니다.
  revised_footnotes: []
