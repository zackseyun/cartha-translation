  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
  footnotes:
  - marker: a
    text: Or 'All the firstborn male that is born from your herd and your flock.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; rendered 'the LORD' following the project's default for the divine name.
    reason: alternative_reading
translation:
  language: ko
  text: 네 소 떼와 작은 가축 떼에서 태어나는 처음 난 모든 수컷은 네 하나님 야훼께 거룩하게 구별하여 바쳐야 합니다. 네 소의 처음 난 것은 부려서는 안 되며, 네 작은 가축 떼의 처음 난 것의 털을 깎아서도 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  english_pob_choice: Every firstborn
  chosen_korean: 모든 첫 새끼
  alternatives_korean:
  - 첫 새끼마다
  - 모든 맏배
  lexicon: HALOT
  rationale: כָּל + 단수형은 분배적 의미가 자연스러워 한국어에서도 ‘모든’으로 풀되, প্রথম태생 동물의 구체성을 살리기 위해 ‘첫 새끼’로 옮겼습니다.
- source_word: אֲשֶׁר יִוָּלֵד
  english_pob_choice: that is born
  chosen_korean: 태어나는
  alternatives_korean:
  - 태어난
  - 출생하는
  lexicon: HALOT
  rationale: 미완료 수동형의 지속적·일반적 성격을 살려 현재분사형 ‘태어나는’으로 자연스럽게 표현했습니다.
- source_word: תַּקְדִּישׁ לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: you shall consecrate to Yahweh your God
  chosen_korean: 너희 하나님 야훼께 바쳐야 합니다
  alternatives_korean:
  - 너희 하나님 야훼께 거룩하게 구별해야 합니다
  - 너희 하나님 야훼께 성별해야 합니다
  lexicon: HALOT
  rationale: קדש의 제의적 ‘구별하여 드림’ 의미를 살리되 현대 한국어에서는 ‘바치다’가 가장 읽기 쉬우면서도 헌납·전용의 뜻을 유지합니다.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  english_pob_choice: You shall not work with the firstborn of your ox
  chosen_korean: 소의 첫 새끼를 부려서는 안 되며
  alternatives_korean:
  - 소의 첫 새끼로 일해서는 안 되며
  - 첫 새끼 소를 일에 사용해서는 안 되며
  lexicon: HALOT
  rationale: עבד는 이 문맥에서 노동에 ‘사용하다’는 뜻이므로, 한국어 관용에 맞게 ‘부리다’로 옮겨 금지의 실질을 분명히 했습니다.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  english_pob_choice: nor shear the firstborn of your flock
  chosen_korean: 양의 첫 새끼의 털도 깎아서는 안 됩니다
  alternatives_korean:
  - 양의 첫 새끼를 깎아서는 안 됩니다
  - 첫 새끼 양의 털도 깎아서는 안 됩니다
  lexicon: HALOT
  rationale: גזז의 구체적 행위는 ‘깎다/깎아내다’이므로, 양털을 전제로 한 한국어로 자연스럽게 풀어 금지 대상이 분명하게 드러나게 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 번역본의 기본 원칙에 따라 신성명 יהוה는 고유 신명으로서 ‘야훼’로 표기해 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 명령문의 한국어 종결과 직접 화법
  chosen_reading: 합쇼체의 명령·금지형(바쳐야 합니다 / 안 됩니다)
  alternative_readings:
  - 해라체
  - 해야 한다체
  rationale: 본문은 율법 조항이므로 현대 표준어의 공적·규범적 문체를 유지하면서도 읽기 부담이 적은 합쇼체로 정리했습니다.
  doctrine_reference: Korean target style guidance
