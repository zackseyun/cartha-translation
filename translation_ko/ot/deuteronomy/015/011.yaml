revisions:
- from: 그러므로 그 땅 가운데에서 가난한 사람이 끊어지지 않을 것입니다[a]. 그러므로 내가 너에게 명령하며 말합니다. “너는 반드시 네 손을 펴서 네 형제에게, 네 곤고한 사람에게[b], 그리고 네 땅에 있는 네 가난한 사람에게 내밀어야 합니다.”
  to: 가난한 이들이 그 땅 가운데에서 결코 끊어지지 않을 것이기 때문입니다. 그러므로 내가 너에게 다음과 같이 명령합니다. “너는 반드시 네 손을 펴서 네 형제[a]와 네 곤고한 이[b]와 네 땅에 있는 네 가난한 이에게 내밀어야 합니다.”
  rationale: 원문의 인과 구조(כִּי … עַל כֵּן)를 ‘…이기 때문입니다. 그러므로’로 명확히 복원했습니다. 강조형 פָּתֹחַ תִּפְתַּח은 ‘반드시 네 손을 펴서’로, 손을 열어 베푼다는 비유는 ‘내밀어야 합니다’로 유지했습니다. 각주 a를 실제 설명 대상인 ‘네 형제’에 붙였고, 두 빈곤 관련 명사는 구별하면서도 자연스러운 현대 합쇼체로 다듬었습니다.
