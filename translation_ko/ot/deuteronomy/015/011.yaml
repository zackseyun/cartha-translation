  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
  footnotes:
  - marker: a
    text: Or 'to your fellow Israelite.' The Hebrew says 'to your brother,' using covenant kinship language with representative force.
    reason: lexical_alternative
  - marker: b
    text: '''Afflicted one'' translates a term that can denote one who is poor, lowly, or afflicted; ''poor one'' and ''needy one'' are also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이들이 그 땅 가운데에서 결코 끊어지지 않을 것이기 때문입니다. 그러므로 내가 너에게 다음과 같이 명령합니다. “너는 반드시 네 손을 펴서 네 형제[a]와 네 곤고한 이[b]와 네 땅에 있는 네 가난한 이에게 내밀어야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 동료 이스라엘인에게’입니다. 히브리어는 ‘네 형제’라고 하여 언약적 친족 언어를 대표적으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곤고한 이’는 가난, 낮아짐, 고통을 아우를 수 있는 표현입니다. ‘가난한 이’ 또는 ‘궁핍한 이’도 가능합니다.
    reason: lexical_alternative
