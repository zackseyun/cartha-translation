base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
  footnotes:
  - marker: a
    text: Or 'to your fellow Israelite.' The Hebrew says 'to your brother,' using covenant kinship language with representative force.
    reason: lexical_alternative
  - marker: b
    text: '''Afflicted one'' translates a term that can denote one who is poor, lowly, or afflicted; ''poor one'' and ''needy one'' are also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 땅 가운데에서 가난한 사람이 끊어지지 않을 것입니다[a]. 그러므로 내가 너에게 명령하며 말합니다. “너는 반드시 네 손을 펴서 네 형제에게, 네 곤고한 사람에게[b], 그리고 네 땅에 있는 네 가난한 사람에게 내밀어야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 동료 이스라엘인에게’입니다. 히브리어는 ‘네 형제’라고 하여 언약적 친족 언어를 대표적으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곤고한 사람’은 가난, 낮아짐, 고통을 아우를 수 있는 표현입니다. ‘가난한 사람’ 또는 ‘궁핍한 사람’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֶחְדַּל אֶבְיוֹן מִקֶּרֶב הָאָרֶץ
  english_pob_choice: will never cease from the midst of the land
  chosen_korean: 그 땅 가운데에서 가난한 사람이 끊어지지 않을 것입니다
  alternatives_korean:
  - 그 땅 가운데에서 가난한 사람이 없어지지 않을 것입니다
  - 그 땅에서 가난한 사람이 사라지지 않을 것입니다
  lexicon: HALOT
  rationale: אֶבְיוֹן은 문맥상 집단적·일반적 의미의 ‘가난한 사람들’을 가리키므로 한국어는 복수감이 드러나는 자연한 단수 일반표현으로 옮겼고, מִקֶּרֶב은 ‘가운데에서’로 보존했습니다.
- source_word: מְצַוְּךָ
  english_pob_choice: I am commanding you
  chosen_korean: 내가 너에게 명령하며
  alternatives_korean:
  - 내가 너에게 명령합니다
  - 내가 너에게 명령하고 있습니다
  lexicon: HALOT
  rationale: 분사형의 직접적이고 현재적인 명령성을 살리기 위해 단순 과거식보다 진행감 있는 표현을 택했습니다.
- source_word: לְאָחִיךָ
  english_pob_choice: to your brother
  chosen_korean: 네 형제에게
  alternatives_korean:
  - 네 동족에게
  - 네 친족에게
  - 네 동료 이스라엘인에게
  lexicon: HALOT
  rationale: 언약적 친족 언어를 평탄하게 풀지 않고 ‘형제’로 직역해 대표성 있는 관계를 유지했습니다.
- source_word: לַעֲנִיֶּךָ וּלְאֶבְיֹנְךָ
  english_pob_choice: to your afflicted one ... and to your poor one
  chosen_korean: 네 곤고한 사람에게, 그리고 네 가난한 사람에게
  alternatives_korean:
  - 네 괴로운 사람에게, 그리고 네 궁핍한 사람에게
  - 네 낮아진 사람에게, 그리고 네 궁핍한 사람에게
  lexicon: HALOT
  rationale: עָנִי와 אֶבְיוֹן의 어감 차이를 한국어에서 구분하려고, 앞항은 ‘곤고한’, 뒷항은 ‘가난한’으로 나누어 번역했습니다.
- source_word: בְּאַרְצֶךָ
  english_pob_choice: in your land
  chosen_korean: 네 땅에 있는
  alternatives_korean:
  - 네 땅 안에 있는
  - 네 땅에서
  lexicon: HALOT
  rationale: 뒤따르는 수혜 대상의 위치를 자연스럽게 연결하면서도, 언약적 지리 개념인 ‘땅’을 유지했습니다.
theological_decisions:
- issue: 형제 호칭의 범위
  chosen_reading: 네 형제에게
  alternative_readings:
  - 네 동족에게
  - 네 동료 이스라엘인에게
  rationale: 본문은 언약 공동체 내부의 대표적 호칭을 사용하므로, 평탄화된 집단 명칭보다 ‘형제’가 관계적·언약적 뉘앙스를 더 직접적으로 드러냅니다.
  doctrine_reference: 'Translation philosophy: source-direct covenantal language'
- issue: 가난한 자를 향한 반복 명령의 강도
  chosen_reading: 반드시 네 손을 펴서 ... 내밀어야 합니다
  alternative_readings:
  - 네 손을 펴야 합니다
  - 기꺼이 내어주어야 합니다
  rationale: ‘반드시’와 ‘펼다’의 조합으로 히브리어의 강조형(פָּתֹחַ תִּפְתַּח)을 살려 자비의 의무를 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve emphatic command force'
