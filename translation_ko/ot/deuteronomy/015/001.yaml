  alternative_readings:
  - 해제해야 합니다
  - 탕감해야 합니다
  - 풀어야 합니다
  rationale: 이 절은 단순한 일반적 해방이 아니라 칠년 율법에 따른 제도적 면제를 도입하므로, 독자가 법적·언약적 배경을 바로 읽도록 ‘면제’로 옮겼습니다.
