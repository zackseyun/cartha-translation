lexical_decisions:
- source_word: מִקֵּץ
  english_pob_choice: At the end of
  chosen_korean: 끝날 때마다
  alternatives_korean:
  - 매번 끝날 때
  - 끝에
  lexicon: HALOT
  rationale: מִ + קֵץ의 관용적 시간 표현을 한국어로 자연스럽게 옮기되, 반복되는 율법 규정을 드러내기 위해 ‘매번’의 반복성을 살렸습니다.
- source_word: שֶׁבַע שָׁנִים
  english_pob_choice: every seven years
  chosen_korean: 일곱 해
  alternatives_korean:
  - 매 칠 년
  - 칠 년마다
  lexicon: HALOT
  rationale: 문맥상 반복되는 칠년 주기를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘일곱 해’로 옮겼습니다.
- source_word: שְׁמִטָּה
  english_pob_choice: a release
  chosen_korean: 면제
  alternatives_korean:
  - 해제
  - 탕감
  - 석방
  lexicon: HALOT
  rationale: שְׁמִטָּה는 여기서 칠년채무면제 규정을 가리키므로, 너무 일반적인 ‘해제’보다 법적 효력이 드러나는 ‘면제’가 본문의 제도적 의미를 더 잘 반영합니다.
theological_decisions:
- issue: שְׁמִטָּה의 제도적 의미를 어떻게 드러낼지
  chosen_reading: 일반적인 ‘풀어 줌’보다 율법 규정으로서의 채무 면제를 드러내는 표현을 사용했습니다.
  alternative_readings:
  - 해제해야 합니다
  - 탕감해야 합니다
  - 풀어야 합니다
  rationale: 이 절은 단순한 일반적 해방이 아니라 칠년 율법에 따른 제도적 면제를 도입하므로, 독자가 법적·언약적 배경을 바로 읽도록 ‘면제’로 옮겼습니다.
  doctrine_reference: 신명기 15장 채무 면제 규정
