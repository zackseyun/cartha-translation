  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: ko
  text: 다만 여러분이 여러분의 하나님 야훼의 음성을 carefully 듣고, 이 모든 계명을 행하도록 오늘 내가 여러분에게 명령하는 것을 다 지키기만 한다면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם / if only
  english_pob_choice: if only
  chosen_korean: 다만 … 하기만 한다면
  alternatives_korean:
  - 오직 … 한다면
  - 만일 … 한다면
  lexicon: —
  rationale: 강조와 조건을 함께 나타내는 רַק אִם의 뉘앙스를 한국어의 「다만 … 하기만 한다면」으로 옮겨, 희망적·제한적 조건을 살렸습니다.
- source_word: שָׁמֹעַ תִּשְׁמַע
  english_pob_choice: you carefully listen
  chosen_korean: carefully 듣고
  alternatives_korean:
  - 귀를 기울여 듣고
  - 자세히 들으면
  lexicon: —
  rationale: 히브리어의 반복형은 단순 청취보다 ‘주의 깊고 확실한 순종적 청취’를 뜻하므로, 문맥상 「carefully」를 살려 ‘carefully 듣고’로 간결하게 반영했습니다.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the voice of the LORD your God
  chosen_korean: 여러분의 하나님 야훼의 음성
  alternatives_korean:
  - 여러분의 하나님 야훼의 소리
  - 여러분의 하나님 주님의 음성
  lexicon: 야훼
  rationale: יהוה는 본문 원어에 따라 ‘야훼’로 옮겼고, ‘קוֹל’은 단순 소리보다 인격적 부르심을 지닌 ‘음성’이 더 적절합니다.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: being careful to do
  chosen_korean: 행하도록 … 다 지키기만 한다면
  alternatives_korean:
  - 지켜 행하도록
  - 지켜서 행하기 위해
  lexicon: —
  rationale: ‘지키다’와 ‘행하다’의 병렬을 유지하되, 앞의 ‘지키다’와 뒤의 ‘행하다’를 자연스러운 한국어 조건절로 재구성해 명령-순종 관계를 분명히 했습니다.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  english_pob_choice: all this commandment
  chosen_korean: 이 모든 계명
  alternatives_korean:
  - 이 모든 명령
  - 이 모든 율법
  lexicon: —
  rationale: 문맥상 단일한 토라 조항 집합을 가리키므로, 한국어 성경 관용을 따라 ‘계명’으로 옮기되 ‘all’의 포괄성을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 원어 하나님의 이름 יהוה를 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값과 원어 추적성을 따르며, 본절은 LXX 인용문이 아니므로 ‘주님’으로 대체할 근거가 없습니다.
  doctrine_reference: 출 3:15; 신 6:4 관련 야훼 명칭 표기 원칙
