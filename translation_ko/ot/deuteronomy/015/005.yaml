    rationale: 목표 언어가 한국어인 완결된 번역문이 아니며, שָׁמֹעַ תִּשְׁמַע의 강조는 자연스러운 한국어 부사구로 옮겨야 합니다.
  - severity: medium
    issue: 원문의 단수 2인칭을 "여러분"으로 복수화함
    rationale: 히브리어의 ‘네 하나님’, ‘네게’는 문법적으로 단수입니다. 집단 이스라엘을 향한 대표적 단수일 수 있으므로 한국어에서도 단수를 보존하는 편이 안전합니다.
