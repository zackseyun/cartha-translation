- from: 다만 여러분이 여러분의 하나님 야훼의 음성을 carefully 듣고, 이 모든 계명을 행하도록 오늘 내가 여러분에게 명령하는 것을 다 지키기만 한다면,
  to: 다만 네 하나님 야훼의 음성에 귀 기울여 듣고, 오늘 내가 네게 명령하는 이 모든 계명을 지켜 행하기만 한다면,
