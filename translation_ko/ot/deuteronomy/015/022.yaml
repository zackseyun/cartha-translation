  rationale: 비교구가 앞선 동사 ‘먹다’를 수식하도록 고쳐 원문의 구문과 의미를 보존했습니다. ‘모두’로 양쪽 범주에 동일하게 허용되는 뜻을 드러냈고, ‘성읍’과 각주를 통해 히브리어 ‘성문’ 관용구의 의미와 문자적 표현을 함께 반영했습니다.
