source:
  edition: WLC
  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
  footnotes:
  - marker: a
    text: Hebrew 'within your gates,' an idiom for within your towns or local communities.
    reason: cultural_note
  - marker: b
    text: That is, those who are ritually unclean and those who are ritually clean may both eat it.
    reason: lexical_alternative
translation:
  language: ko
  text: 성문 안에서 그것을 먹을 수 있습니다[a]. 부정한 사람과 정결한 사람이 함께 먹을 수 있으니[b], 들사슴과 노루와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘성문 안에서’는 성읍이나 지역 공동체 안에서라는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 즉, 의례적으로 부정한 사람과 의례적으로 정결한 사람이 모두 그것을 먹을 수 있다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  english_pob_choice: within your gates
  chosen_korean: 성문 안에서
  alternatives_korean:
  - 성문들 안에서
  - 성읍 안에서
  - 당신의 지역 안에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자 이미지를 살리되, 한국어에서는 자연스러운 공간 표현인 ‘성문 안에서’로 옮겼습니다.
- source_word: הַטָּמֵא / וְהַטָּהוֹר
  english_pob_choice: the unclean / the clean
  chosen_korean: 부정한 사람과 정결한 사람
  alternatives_korean:
  - 부정한 자와 정결한 자
  - 더러운 사람과 깨끗한 사람
  - 의례적으로 부정한 사람과 의례적으로 정결한 사람
  lexicon: HALOT
  rationale: 여기서는 음식 규례 문맥의 의례적 상태를 가리키므로, 오해를 줄이면서도 신학적 구분을 드러내는 ‘부정한 사람 / 정결한 사람’을 택했습니다.
- source_word: יַחְדָּו
  english_pob_choice: alike
  chosen_korean: 함께
  alternatives_korean:
  - 똑같이
  - 동일하게
  - 함께 먹을 수 있으니
  lexicon: HALOT
  rationale: 두 범주가 동등하게 먹을 수 있다는 분배적 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 처리했습니다.
- source_word: כַּצְּבִי וְכָאַיָּל
  english_pob_choice: as the gazelle and the deer
  chosen_korean: 들사슴과 노루와 같습니다
  alternatives_korean:
  - 영양과 사슴과 같습니다
  - 사슴과 노루와 같습니다
  - 들사슴과 사슴과 같습니다
  lexicon: HALOT
  rationale: 비교 대상은 희생 제의의 제한 밖에 있는 야생 짐승의 예시이므로, 현대 한국어에서 자연스럽고 구분이 되는 동물명으로 옮겼습니다.
theological_decisions:
- issue: ‘부정한/정결한’의 윤리적 오독 가능성
  chosen_reading: 의례적 음식 규례의 상태를 가리키는 표현으로 이해해 번역했습니다.
  alternative_readings:
  - 도덕적으로 더러운/깨끗한 것으로 읽는 해석
  - 단순히 ‘먹을 수 있는/없는 사람’으로 완화하는 해석
  rationale: 본문의 문맥이 제의·식품 규정이므로, 도덕적 평가로 오해되지 않도록 의례적 의미를 유지해야 합니다.
  doctrine_reference: 레위기 11장 및 신명기 식규정의 정결/부정 개념
- issue: ‘성문 안’의 관용구 처리
  chosen_reading: 히브리어 관용구를 직역하되 한국어 주석 없이도 문맥상 이해되도록 했습니다.
  alternative_readings:
  - ‘당신의 성읍 안에서’로 의미화
  - ‘당신의 지역에서’로 의역
  rationale: 원문 이미지인 ‘문(gates)’을 보존하는 것이 POB의 소스-직결 원칙에 더 부합합니다.
  doctrine_reference: 고대 이스라엘의 성읍/공동체 생활 배경
