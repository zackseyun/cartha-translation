lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나 다만
  lexicon: HALOT
  rationale: 앞선 허용을 제한하는 예외 표지로서 ‘다만’이 자연스럽고, 명령문 전체의 법규 문체를 유지합니다.
- source_word: דָּמוֹ
  english_pob_choice: its blood
  chosen_korean: 그 피
  alternatives_korean:
  - 그것의 피
  - 그 짐승의 피
  lexicon: HALOT
  rationale: 히브리어의 직접목적표지와 소유격은 문맥상 동물의 피를 가리키므로, 한국어에서는 간결하게 ‘그 피’로 옮기되 대상이 암시되도록 했습니다.
- source_word: עַל הָאָרֶץ תִּשְׁפְּכֶנּוּ כַּמָּיִם
  english_pob_choice: you shall pour it out on the ground like water
  chosen_korean: 땅에 물처럼 쏟아 버려야 합니다
  alternatives_korean:
  - 땅에 물처럼 부어야 합니다
  - 땅에 물같이 쏟아야 합니다
  lexicon: HALOT
  rationale: ‘쏟아 버리다’는 제의적 폐기 행위를 자연스럽게 드러내며, ‘물처럼’의 비유를 그대로 살립니다.
theological_decisions:
- issue: 피를 먹지 말라는 금지의 범위
  chosen_reading: 본문의 명령을 그대로 살려, 피를 먹는 행위를 금지하고 땅에 쏟아 버리라고만 말합니다.
  alternative_readings:
  - ‘생명력’ 같은 해석어를 넣어 혈액-생명 연계를 더 강하게 드러내는 번역
  rationale: 이 절 자체는 행위 규정에 집중하며, 피의 생명성에 대한 신학적 설명을 직접 추가하지 않습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 교리적 설명을 본문에 덧붙이지 않는다.'
