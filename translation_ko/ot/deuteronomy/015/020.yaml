- from: 그것을 너와 너의 집안이 해마다 야훼 너의 하나님 앞에서 먹을지니, 야훼께서 선택하실 곳에서 먹어야 합니다.[a]
  to: 당신과 당신의 집안은 해마다 야훼께서 선택하실 곳에서 야훼, 당신의 하나님 앞에서 그것을 먹어야 합니다.[a]
  rationale: 원문의 단일 식사 명령을 보존하고, 중앙 성소의 장소 한정과 야훼의 임재 앞이라는 제의적 수식어를 한 문장 안에 결속했습니다. 현대 합쇼체로 문체를 일관되게 조정했으며, 각주는 לִפְנֵי의 자연스러운 어휘 대안을 제시합니다.
