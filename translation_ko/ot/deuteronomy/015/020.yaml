  verdict: revise
  source_fidelity: 원문의 목적어 접미사(‘그것을’), 연례적 표현(‘해마다’), 야훼 앞에서의 식사, 야훼께서 선택하실 장소, 그리고 ‘당신과 당신의 집안’이라는 주체를 보존했습니다. 초안은 원문에 한 번만 있는 ‘먹다’를 문장 끝에서 중복하여, 장소절이 별도의 식사 명령처럼 읽히게 했습니다.
  naturalness: 초안은 ‘먹을지니’와 ‘먹어야 합니다’를 한 문장에 함께 사용하여 문체가 혼합되어 있습니다. 현대 합쇼체로 통일하고, 장소와 ‘야훼 앞에서’라는 수식어를 한 동사에 자연스럽게 연결했습니다.
  terminology: יְהוָה는 POB 방침에 따라 ‘야훼’로 유지했습니다. בֵּיתֶךָ는 가구 구성원을 포함하는 ‘당신의 집안’으로, לִפְנֵי는 제의적 임재의 의미를 유지하는 ‘앞에서’로 옮겼습니다.
