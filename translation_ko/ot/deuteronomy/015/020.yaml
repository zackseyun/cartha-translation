    rationale: 히브리어 תֹאכֲלֶנּוּ는 한 번만 나오며, ‘야훼께서 선택하실 곳에서’는 그 식사의 장소를 한정합니다. 초안의 두 번째 ‘먹어야 합니다’는 원문에 없는 동작을 반복합니다.
  - severity: medium
    issue: 문체 종결의 혼합
    rationale: ‘먹을지니’는 문어적 성경체이고 ‘먹어야 합니다’는 현대 합쇼체입니다. 요청된 현대 공식-공손체에 맞추어 종결을 ‘먹어야 합니다’로 통일하는 것이 안전합니다.
