theological_decisions:
- issue: 야훼 앞에서 먹는 제의적 표현의 처리
  chosen_reading: ‘앞에서’로 번역해 단순한 위치가 아니라 예배적 임재 앞에서의 식사를 드러냈습니다.
  alternative_readings:
  - ‘면전에서’
  - ‘앞에’
  rationale: 이 구절은 단순한 식사 지시가 아니라 성소에서 야훼 앞에 드리는 언약적 행위를 말하므로, 문맥의 제의성을 드러내는 번역이 필요합니다.
