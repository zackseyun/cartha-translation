  source_fidelity: 수정이 필요합니다. 히브리어 동사는 남성 단수 2인칭이므로 ‘너희/너희 손’이 아니라 ‘너/네 손’으로 옮겨야 합니다. 또한 דֵּי는 강조 동사 자체가 아니라 필요한 양의 충분성을 한정하므로, ‘넉넉히’는 대출 행위의 태도보다 필요한 것을 충족하는 양을 나타내도록 문맥상 처리하는 편이 적절합니다.
  naturalness: ‘그에게 필요한 만큼 무엇이든 넉넉히 빌려 주다’는 수식 관계가 다소 겹치고 자연스럽지 않습니다. ‘그에게 필요한 것을 넉넉히 빌려 주다’는 현대 표준어 합쇼체로 자연스럽고, 필요한 것을 충족시키는 의미를 잘 전달합니다.
  terminology: ‘손을 펴다’와 ‘빌려 주다’는 본문의 관용적·법률적 표현을 적절히 보존합니다. 문맥상 대조를 나타내는 כִּי는 ‘오히려’로 옮길 수 있습니다. 각 동사의 반복 강조는 각주에서 명시하는 것이 안전합니다.
  issues:
