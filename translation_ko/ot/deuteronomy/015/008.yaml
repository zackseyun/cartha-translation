    issue: 2인칭 수가 단수에서 복수로 바뀌었습니다.
    rationale: 원문의 תִּפְתַּח, יָדְךָ, תַּעֲבִיטֶנּוּ는 모두 2인칭 남성 단수입니다. 한국어 번역도 ‘너는/네 손’으로 일치시켜야 합니다.
  - severity: low
