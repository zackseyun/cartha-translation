lexical_decisions:
- source_word: כִּי
  english_pob_choice: Instead
  chosen_korean: 대신
  alternatives_korean:
  - 그러므로
  - 왜냐하면
  - 오히려
  lexicon: HALOT
  rationale: 앞절의 냉담한 거절 금지와 대조되는 전환이므로, 한국어에서도 대조를 분명히 드러내는 ‘대신’이 문맥상 가장 자연스럽습니다.
- source_word: פָתֹחַ תִּפְתַּח אֶת יָדְךָ
  english_pob_choice: you must open your hand
  chosen_korean: 너희 손을 펴 주어야 하며
  alternatives_korean:
  - 너는 네 손을 펴야 하며
  - 손을 활짝 열어야 하며
  - 네 손을 넓게 펴야 하며
  lexicon: HALOT
  rationale: 히브리어의 ‘손을 펴다’라는 관용구를 살리되, 한국어에서는 관용적이고 자연스러운 ‘손을 펴 주다’로 옮겨 자비로운 내어줌의 뜻을 드러냈습니다.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  english_pob_choice: and surely lend him
  chosen_korean: 넉넉히 빌려 주어야 합니다
  alternatives_korean:
  - 반드시 빌려 주어야 합니다
  - 확실히 빌려 주어야 합니다
  - 충분히 빌려 주어야 합니다
  lexicon: HALOT
  rationale: 동사의 반복이 강조를 이루므로 의무성과 충분성을 함께 담는 표현이 필요했습니다. 한국어에서는 ‘넉넉히 빌려 주다’가 단순 대출보다 후한 공급의 뉘앙스를 잘 살립니다.
- source_word: דֵּי מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  english_pob_choice: enough for whatever he lacks
  chosen_korean: 그에게 필요한 만큼 무엇이든
  alternatives_korean:
  - 그가 부족한 것이라면 무엇이든
  - 그의 결핍에 따라 충분히
  - 그가 모자라는 만큼 무엇이든
  lexicon: HALOT
  rationale: ‘부족하다/결핍’의 중첩을 한국어에서 지나치게 반복하지 않으면서, 범위를 넓게 여는 ‘무엇이든’으로 히브리어의 개방형 수량 표현을 반영했습니다.
theological_decisions:
- issue: 가난한 형제에 대한 의무의 강도
  chosen_reading: 이 절은 자선을 권하는 수준이 아니라, 필요한 만큼 실제로 빌려 주어야 하는 공동체적 의무를 말합니다.
  alternative_readings:
  - 권면적인 친절
  - 선택적 호의
  rationale: 이전 동사의 강조형과 ‘필요한 만큼’의 명시가 결합되어, 단순한 권고보다 구체적 책임을 표현하는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: 신명기 15장의 가난한 자를 향한 언약 공동체의 책임
- issue: 공손법과 명령형의 처리
  chosen_reading: 직접 명령을 한국어 합쇼체의 의무 표현으로 옮겨, 본문의 권위와 현대 문체를 함께 유지했습니다.
  alternative_readings:
  - 직설적 명령형
  - 완곡한 권유형
  rationale: 히브리어의 강한 명령성을 약화하지 않으면서도, 한국어 성경 문체에 맞는 공적인 읽기를 위해 ‘-아야 합니다’ 구조를 사용했습니다.
  doctrine_reference: 번역 문체상 결정
