  rationale: 원문의 단수 مخاطبة를 ‘너는/네 손’으로 회복하고, 필요한 것에 충분히 빌려 주라는 구문을 자연스러운 한국어로 다듬었습니다. ‘오히려’는 앞절의 완고한 거절 금지와의 대조를 반영하며, 각주는 두 반복 동사구의 강조를 더 정확히 설명합니다.
