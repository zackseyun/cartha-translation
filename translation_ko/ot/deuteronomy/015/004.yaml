translation:
  language: ko
  text: 그러나[a] 너희 가운데에는 가난한 사람이 없어야 합니다. 이는 야훼께서 너희의 하나님이 너희에게 상속으로 주시는 땅에서 너희에게 반드시 복을 주실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그렇지만’, ‘다만’. 히브리어 אֶפֶס는 앞의 지시를 제한하거나 예외를 덧붙이는 표지입니다.
    reason: lexical_alternative
