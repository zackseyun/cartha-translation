  to: 그러나[a] 너희 가운데에는 가난한 사람이 없어야 합니다. 너희의 하나님이신 야훼께서 너희에게 상속 재산으로 주시고 너희가 차지할 땅에서 반드시 너희에게 복을 주실 것이기 때문입니다.
