  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
  footnotes:
  - marker: a
    text: Or 'You may exact payment from a foreigner.' The Hebrew verb refers to pressing or demanding repayment in a debt context.
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' here refers to a fellow member of the Israelite covenant community.'
    reason: cultural_note
  - marker: c
    text: Literally 'your hand shall release'; the idiom means to let go of or remit your claim in the year of release.
    reason: lexical_alternative
translation:
  language: ko
  text: 이방인에게는 상환을 요구할 수 있으나[a], 당신의 형제에게 있는 당신의 것은 무엇이든지 놓아주어야 합니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상환을 요구하다’는 빚의 문맥에서 갚으라고 압박하거나 지급을 청구한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘형제’는 이스라엘 언약 공동체에 속한 동료를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 ‘당신의 손은 놓아주어야 한다’입니다. 이 관용구는 면제의 해에 빚에 대한 청구를 포기하거나 면제하라는 뜻입니다.
    reason: lexical_alternative
