theological_decisions:
- issue: ‘형제’의 범위
  chosen_reading: 본문의 대조를 살려 ‘이방인’과 구별되는 언약 공동체 내부의 동료를 뜻하는 ‘형제’로 유지했습니다.
  alternative_readings:
