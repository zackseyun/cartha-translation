  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
  footnotes:
  - marker: a
    text: Or 'You may exact payment from a foreigner.' The Hebrew verb refers to pressing or demanding repayment in a debt context.
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' here refers to a fellow member of the Israelite covenant community.'
    reason: cultural_note
  - marker: c
    text: Literally 'your hand shall release'; the idiom means to let go of or remit your claim in the year of release.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이방인에게는 독촉할 수 있으나, 형제에게 있는 것은 무엇이든지 당신의 손이 풀어 주어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독촉하다’는 빚 문맥에서 상환을 압박하거나 요구한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘형제’는 이스라엘 언약 공동체의 동료를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 ‘당신의 손이 풀어 주어야 합니다’입니다. 이 관용구는 빚에 대한 청구를 놓아 주거나 면제하라는 뜻입니다.
    reason: lexical_alternative
