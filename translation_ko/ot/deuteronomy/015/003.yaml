  source_fidelity: 히브리어는 ‘외국인/이방인에게는 (상환을) 요구할 수 있으나, 네 형제에게 있는 네 것은 무엇이든지 놓아주어야 한다’는 대조를 이룹니다. 초안의 큰 뜻은 맞지만, ‘형제에게 있는 것은’에는 소유 관계가 충분히 드러나지 않으며, ‘당신의 손이 풀어 주어야 합니다’는 한국어에서 부자연스럽고 ‘손’이 무엇을 푸는지 불명확합니다.
  naturalness: ‘이방인’은 이 법률·성경 문맥에서 사용할 수 있으나, ‘독촉하다’에는 상환 대상이 명시되지 않아 약간 불완전합니다. ‘상환을 요구하다’가 현대의 격식 있는 한국어로 더 분명합니다. 관용구는 본문에서 자연스러운 ‘놓아주다’로 옮기고 문자적 손의 이미지는 주석에서 밝혀야 합니다.
  terminology: ‘형제’는 원문의 관계 용어를 보존하며, 주석에서 이스라엘 언약 공동체 안의 동료라는 법적·사회적 범위를 설명하는 것이 적절합니다. ‘이방인’은 여기서 민족적·언약 공동체 밖의 사람이라는 고대 법률적 구분을 나타내며, 현대적 종교 평가로 읽히지 않도록 주석 표현을 절제했습니다.
