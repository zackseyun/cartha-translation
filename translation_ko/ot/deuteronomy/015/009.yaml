source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
  footnotes:
  - marker: a
    text: Literally, 'your eye be evil'—a Hebrew idiom for being stingy or begrudging toward someone in need.
    reason: lexical_alternative
  - marker: b
    text: Or 'the year of remission' or 'the year of cancellation.'
    reason: lexical_alternative
  - marker: c
    text: '''Brother'' here refers to a fellow member of the covenant community, not necessarily a biological sibling.'
    reason: cultural_note
translation:
  language: ko
  text: 마음속에 사악한 생각을 품지 않도록 조심하십시오. ‘일곱째 해, 곧 면제의 해[b]가 가까웠다’ 하고, 가난한 형제[c]를 인색한 눈으로 바라보며[a] 그에게 아무것도 주지 않는 일이 없도록 하십시오. 그가 당신을 두고 야훼께 부르짖으면, 당신에게 죄가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 도움이 필요한 사람을 인색하거나 아까워하는 태도를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘면제의 해’는 ‘탕감의 해’ 또는 ‘해제의 해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘형제’는 여기서 생물학적 형제만이 아니라 언약 공동체의 동료 구성원을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 삼가십시오
  lexicon: HALOT
  rationale: 경고 명령의 힘을 살리면서도 현대 한국어에서 자연스럽고 합쇼체에 맞습니다.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  english_pob_choice: there be in your heart a wicked thought
  chosen_korean: 마음속에 불량한 생각
  alternatives_korean:
  - 마음속에 사악한 생각
  - 마음속에 악한 생각
  lexicon: HALOT
  rationale: דָבָר를 여기서는 내적 의도/생각으로 보고, בְלִיַּעַל의 도덕적 악성을 한국어로 압축해 전달했습니다.
- source_word: וְרָעָה עֵינְךָ
  english_pob_choice: your eye be evil
  chosen_korean: 악한 눈을 보이고
  alternatives_korean:
  - 눈이 악하게 되어
  - 눈이 인색하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어 문맥에서는 ‘~눈을 보이다’로 인색함의 의미가 드러나게 했습니다.
- source_word: שְׁנַת הַשְּׁמִטָּה
  english_pob_choice: the year of release
  chosen_korean: 면제의 해
  alternatives_korean:
  - 해방의 해
  - 탕감의 해
  lexicon: HALOT
  rationale: Deut 15의 שמיטה는 빚과 의무의 해제를 가리키므로, ‘면제’가 가장 간결하고 제도적 의미를 잘 나타냅니다.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  english_pob_choice: your poor brother
  chosen_korean: 가난한 형제
  alternatives_korean:
  - 가난한 형제자매
  - 가난한 동족
  lexicon: HALOT
  rationale: אָח를 혈연보다 언약 공동체의 동족/형제 언어로 보고, 소스의 대표적 남성 단수 호칭을 유지했습니다.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  english_pob_choice: then he may cry out against you to Yahweh
  chosen_korean: 그는 당신을 두고 야훼께 부르짖을 것이며
  alternatives_korean:
  - 그가 당신을 상대로 야훼께 호소할 것이며
  - 그가 당신을 두고 야훼께 외칠 것이며
  lexicon: HALOT
  rationale: 법정적 호소의 뉘앙스를 살리면서도 ‘부르짖다’로 억울한 호소의 강도를 유지했습니다. Tetragrammaton은 프로젝트 기본값에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 야훼(יְהוָה) 표기
  chosen_reading: 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기 문맥에서 언약 이름을 가리고 일반 호칭으로 완화하지 않고, 프로젝트 기본 원칙에 따라 직접 표기했습니다.
  doctrine_reference: Contested terms — יְהוָה / YHWH → 야훼
- issue: ‘악한 눈’ 관용구의 처리
  chosen_reading: 본문에는 관용구를 보존하고, 한국어가 자연스럽게 읽히도록 ‘악한 눈을 보이고’로 옮겼습니다.
  alternative_readings:
  - 인색해지고
  - 구두쇠처럼 굴고
  rationale: 본문의 도덕적 긴장과 문학적 표면을 유지하는 것이 중요하므로, 설명적 의역으로 완전히 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence — source-text sense and texture preserved without unnecessary paraphrase'
