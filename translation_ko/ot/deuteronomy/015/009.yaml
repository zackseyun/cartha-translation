    text: 히브리어 관용구로, 도움이 필요한 사람을 인색하거나 아까워하는 태도를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘면제의 해’는 ‘탕감의 해’ 또는 ‘해제의 해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘형제’는 여기서 생물학적 형제만이 아니라 언약 공동체의 동료 구성원을 가리킵니다.
    reason: cultural_note
