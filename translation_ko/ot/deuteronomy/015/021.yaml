translation:
  language: ko
  text: 그러나 몸에 흠이 있어서, 곧 절름발이이거나 눈먼 것이라면[a] — 어떤 나쁜 흠이든지 — 그것을 야훼 당신의 하나님께 바쳐서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “어떤 나쁜/악한 흠”이라는 뜻으로, 곧 제물로 받아들일 수 없는 심한 신체적 결함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 …이라면
  alternatives_korean:
  - 그리고 만약
  - 만약
  lexicon: HALOT
  rationale: 앞절의 바침 규정에 이어지는 예외 조항이므로, 한국어에서는 조건문 앞에 역접을 살린 '그러나'가 문맥을 가장 자연스럽게 드러냅니다.
- source_word: מוּם
  english_pob_choice: defect
  chosen_korean: 흠
  alternatives_korean:
  - 결함
  - 흠집
  - 흠결
  lexicon: HALOT
  rationale: 제사 규정 문맥에서 חוּם은 희생제물의 신체적 결함을 뜻하므로, 지나치게 기술적이지 않으면서도 의례적 맥락에 맞는 '흠'이 적절합니다.
- source_word: כֹּל מוּם רָע
  english_pob_choice: any bad defect
  chosen_korean: 어떤 나쁜 흠이든지
  alternatives_korean:
  - 어떤 심각한 흠이든지
  - 어떤 악한 흠이든지
  lexicon: HALOT
  rationale: רָע는 여기서 도덕적 '악'보다 제물로 부적합한 '나쁜/불량한' 상태를 가리키므로, 원문 긴장을 살리기 위해 직역에 가까운 '나쁜 흠'을 택했습니다.
- source_word: לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께
  alternatives_korean:
  - 야훼 당신의 하나님께
  - 주 당신의 하나님께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יהוה는 '야훼'로 옮기고, ל는 제물의 바쳐짐 방향을 나타내므로 '…께 바치다'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제물의 신체적 결함을 금하는 제의 규정의 강도
  chosen_reading: 문자적으로 '어떤 나쁜 흠이든지'를 유지해, 단순한 미관상 문제보다 제의상 부적합을 강조했습니다.
  alternative_readings:
  - 어떤 심각한 흠이든지
  - 어떤 큰 결함이든지
  rationale: 히브리어 רָע를 해석적으로 완화하면 제의적 부적격의 강도가 약해질 수 있으므로, 원문의 평가적 어감을 그대로 드러냈습니다.
  doctrine_reference: 제의법 문맥에서의 번역 일관성 및 원문 긴장 보존
