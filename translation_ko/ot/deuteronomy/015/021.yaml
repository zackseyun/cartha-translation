translation:
  language: ko
  text: 그러나 그것에 흠이 있으면—곧 절거나 눈이 멀었거나, 어떤 심한 흠이든지[a]—그것을 야훼, 당신의 하나님께 제물로 바쳐서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
