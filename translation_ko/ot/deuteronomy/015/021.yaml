    text: '히브리어: “모든 나쁜/악한 흠.” 여기서 “나쁜/악한”은 도덕적 악이라기보다 제물로 부적합하게 만드는 흠을 뜻할 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 …이라면
  alternatives_korean:
  - 그리고 만약
  - 만약
  lexicon: HALOT
  rationale: 앞절의 바침 규정에 이어지는 예외 조항이므로, 한국어에서는 조건문 앞에 역접을 살린 '그러나'가 문맥을 가장 자연스럽게 드러냅니다.
- source_word: מוּם
