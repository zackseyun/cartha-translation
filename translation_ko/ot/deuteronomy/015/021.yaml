  lexicon: HALOT
  rationale: 제사 규정 문맥에서 חוּם은 희생제물의 신체적 결함을 뜻하므로, 지나치게 기술적이지 않으면서도 의례적 맥락에 맞는 '흠'이 적절합니다.
- source_word: כֹּל מוּם רָע
  english_pob_choice: any bad defect
  chosen_korean: 어떤 나쁜 흠이든지
