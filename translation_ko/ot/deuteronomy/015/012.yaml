  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''send him out''; after ''a Hebrew man or a Hebrew woman,'' the Hebrew continues with a masculine singular form used generically for the released person. The law applies to either a Hebrew man or woman.'
