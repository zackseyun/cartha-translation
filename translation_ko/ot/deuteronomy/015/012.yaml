translation:
  language: ko
  text: 네 형제, 곧 히브리 남자나 히브리 여자가 네게 팔려 여섯 해 동안 너를 섬기면, 일곱째 해에 너는 그를[a] 자유롭게 네 곁에서 내보내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘히브리 남자나 히브리 여자’ 뒤에서 ‘그를’에 해당하는 남성 단수형을 사용합니다. 이 법조항의 앞선 표현은 히브리 남자와 히브리 여자 모두를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
