  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''send him out''; after ''a Hebrew man or a Hebrew woman,'' the Hebrew continues with a masculine singular form used generically for the released person. The law applies to either a Hebrew man or woman.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 형제인 히브리 사람이나 히브리 여인이 네게 팔려 와서 너를 섬기면, 그는 여섯 해 동안 섬기고 일곱째 해에는 그를 네 곁에서 자유롭게 내보내야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘히브리 사람이나 히브리 여인’ 뒤에 남성 단수형을 이어 쓰며, 이는 남녀 모두에게 적용되는 법조항임을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
  english_pob_choice: is sold
  chosen_korean: 팔려 와서
  alternatives_korean:
  - 팔려서
  - 네게 팔려
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살리되, 한국어에서는 자연스러운 이동·유입 뉘앙스를 함께 드러내는 ‘팔려 와서’가 법문맥에 가장 적절합니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 네 형제인
  alternatives_korean:
  - 네 형제
  - 네 동족인
  lexicon: HALOT
  rationale: 공동체적·언약적 친족 표현을 살려 ‘형제’로 옮기고, 문장 안에서 수식 관계가 분명하도록 ‘인’을 붙였습니다.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  english_pob_choice: a Hebrew man or a Hebrew woman
  chosen_korean: 히브리 사람이나 히브리 여인
  alternatives_korean:
  - 히브리 남자나 히브리 여자
  - 히브리 남성이나 히브리 여성
  lexicon: HALOT
  rationale: 성별 표지가 있는 ‘히브리 남자/여자’의 범주를 한국어의 중립적이고 문어적인 표현으로 유지했습니다.
- source_word: וַעֲבָדְךָ
  english_pob_choice: and serves you
  chosen_korean: 너를 섬기면
  alternatives_korean:
  - 너를 위해 일하면
  - 너의 종으로 있으면
  lexicon: HALOT
  rationale: עבד의 기본 의미인 봉사·노동을 법문맥에 맞게 ‘섬기다’로 옮겨, 관계적 종속과 실제 노동을 함께 포괄했습니다.
- source_word: תְּשַׁלְּחֶנּוּ
  english_pob_choice: you shall send him out
  chosen_korean: 그를 네 곁에서 자유롭게 내보내야 합니다
  alternatives_korean:
  - 그를 내보내야 합니다
  - 그를 자유롭게 보내야 합니다
  lexicon: HALOT
  rationale: שלח의 ‘보내다/내보내다’ 이미지를 살리면서, 이어지는 חָפְשִׁי를 반영해 해방의 결과를 한국어에서 분명히 했습니다.
- source_word: חָפְשִׁי
  english_pob_choice: free
  chosen_korean: 자유롭게
  alternatives_korean:
  - 자유한 상태로
  - 자유인으로
  lexicon: HALOT
  rationale: 명사적 상태를 한국어 부사구로 자연스럽게 풀어, ‘내보내다’와 결합된 해방의 의미를 분명히 했습니다.
theological_decisions:
- issue: 남녀 모두에게 적용되는 법문에서 뒤의 단수 남성 대명사 사용
  chosen_reading: 본문의 남성 단수 대명사를 그대로 반영해 ‘그를’로 두고, 앞의 ‘히브리 사람이나 히브리 여인’이 남녀 모두를 포괄함을 본문 자체가 드러내도록 했습니다.
  alternative_readings:
  - ‘그를/그녀를’로 성중립화
  - ‘그 사람을’로 일반화
  rationale: 히브리어가 남녀를 함께 언급한 뒤 단수 남성형을 쓰는 구조를 매끈하게 중화하지 않고, 원문의 문법적 형식을 보존하는 것이 audit trail에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
