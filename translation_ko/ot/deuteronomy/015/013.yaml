translation:
  language: ko
  text: 네가 그를 네 곁에서 자유인으로 보내 줄 때에는, 그를 빈손으로 보내서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 그를 네 곁에서 자유인으로 보내면’. 히브리어 접속사는 조건적(‘만일’)으로도 시간적(‘~할 때’)으로도 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  english_pob_choice: And when
  chosen_korean: 그리고 … 할 때에는
  alternatives_korean:
  - 그리고 … 하면
  - 그리고 … 할 때
  - 만일 … 하면
  lexicon: HALOT
  rationale: 접속사 조합은 조건적·시간적으로 모두 읽힐 수 있으므로, 법 조항의 예견된 상황을 살려 ‘그리고 … 할 때에는’으로 옮겼습니다.
- source_word: תְשַׁלְּחֶ֥/נּוּ
  english_pob_choice: you send him away
  chosen_korean: 그를 … 보내게 될
  alternatives_korean:
  - 그를 … 보내면
  - 그를 … 놓아줄 때
  - 그를 … 해방시킬 때
  lexicon: HALOT
  rationale: שלח의 ‘보내다/내보내다’ 의미를 유지해 반복을 살렸고, 문맥상 종살이 상태에서의 풀어줌을 자연스럽게 드러내기 위해 ‘보내게 될’로 옮겼습니다.
- source_word: חָפְשִׁ֖י
  english_pob_choice: free
  chosen_korean: 자유롭게
  alternatives_korean:
  - 자유로운 상태로
  - 자유인으로
  - 자유롭게 풀려
  lexicon: HALOT
  rationale: 형용사 ‘자유로운’의 상태를 한국어 부사구로 자연화하되, 해방의 의미가 약화되지 않도록 ‘자유롭게’로 번역했습니다.
- source_word: רֵיקָם
  english_pob_choice: empty-handed
  chosen_korean: 빈손으로
  alternatives_korean:
  - 아무것도 없이
  - 헛되이
  - 빈 채로
  lexicon: HALOT
  rationale: 관용적 부사 ‘빈손으로’가 헌납·배려 없이 보내지 말라는 뜻을 가장 자연스럽게 전달하므로 이를 택했습니다.
theological_decisions:
- issue: 종의 해방 후 최소한의 제공 의무
  chosen_reading: 본문의 금지는 단순한 석방이 아니라, 해방과 함께 빈손으로 내보내지 말라는 실질적 배려를 요구합니다.
  alternative_readings:
  - 단순히 풀어주기만 하면 된다는 읽기
  - 정서적 위로나 말뿐의 작별로 축소하는 읽기
  rationale: 직전 절의 종 해방 규정과 연결된 법적·윤리적 요구를 유지해야 하므로, 물질적 빈손 해방을 분명히 드러냈습니다.
  doctrine_reference: 신명기 15장 해방 규정, 사회적 책임과 언약 공동체의 배려
