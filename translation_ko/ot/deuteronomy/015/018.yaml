  text: לֹא יִקְשֶׁ֣ה בְ/עֵינֶ֗/ךָ בְּ/שַׁלֵּֽחֲ/ךָ֙ אֹת֤/וֹ חָפְשִׁי֙ מֵֽ/עִמָּ֔/ךְ כִּ֗י מִשְׁנֶה֙ שְׂכַ֣ר שָׂכִ֔יר עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
  footnotes:
  - marker: a
    text: Or, 'worth twice the wages of a hired worker.' The Hebrew expression compares the value of his six years of service to that of hired labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 당신에게서 자유롭게 보내는 것이 당신에게는 어렵게 여겨지지 않아야 합니다. 그는 여섯 해 동안 당신을 섬겼으니, 품꾼의 삯의 갑절에 해당합니다. 야훼 당신의 하나님께서 당신이 하는 모든 일에 복을 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  english_pob_choice: shall not seem hard to you
  chosen_korean: 어렵게 여겨지지 않아야 합니다
  alternatives_korean:
  - 당신에게 어렵지 않아야 합니다
  - 당신 눈에 힘들게 보이지 않아야 합니다
  lexicon: HALOT
  rationale: ‘hard in your eyes’라는 관용구를 한국어의 평가 표현으로 옮기되, 법문체의 자연스러움을 유지했습니다.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  english_pob_choice: when you send him away free from you
  chosen_korean: 그를 당신에게서 자유롭게 보내는 것
  alternatives_korean:
  - 그를 당신에게서 놓아 자유롭게 할 때
  - 그를 당신에게서 해방하여 보낼 때
  lexicon: HALOT
  rationale: חָפְשִׁי의 해방/자유의 의미를 살려 ‘자유롭게 보내다’로 옮겼고, ‘from you’는 관계적 출처를 직접적으로 반영했습니다.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  english_pob_choice: for double the wages of a hired worker
  chosen_korean: 품꾼의 삯의 갑절에 해당합니다
  alternatives_korean:
  - 품꾼의 삯의 두 배에 해당합니다
  - 품꾼에게 주는 삯의 갑절입니다
  lexicon: HALOT
  rationale: מִשְׁנֶה를 ‘갑절’로, שָׂכִיר를 관용적인 ‘품꾼’으로 옮겨 비교 가치를 분명히 했습니다.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: and Yahweh your God will bless you
  chosen_korean: 야훼 당신의 하나님께서 당신이 하는 모든 일에 복을 주실 것입니다
  alternatives_korean:
  - 야훼 당신의 하나님께서 복 주실 것입니다
  - 야훼 당신의 하나님께서 당신의 모든 일에 복을 내리실 것입니다
  lexicon: HALOT
  rationale: 언약의 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했고, 결과 약속의 미래 의미를 한국어 미래형으로 반영했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겨 언약 이름을 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 신명기의 직접 표기인 하나님의 이름을 사용하므로, 번역 전통보다 स्रोत 직역성과 감사 가능성을 우선했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: עבד 문맥의 지위 표현
  chosen_reading: 여기서는 ‘섬겼습니다’로 옮기되, 앞절 문맥이 종살이/해방 법문임을 전제했습니다.
  alternative_readings:
  - ‘노예로 일했습니다’
  - ‘종으로 섬겼습니다’
  rationale: 이 절의 초점은 노동의 대가와 해방의 정당성에 있으므로, 동사적 용례를 살리면서도 주변 법문이 지위 문제를 이미 충분히 밝히도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
