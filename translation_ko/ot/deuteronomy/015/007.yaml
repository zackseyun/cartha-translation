revisions:
- from: 만일 네게 네 형제 가운데 한 가난한 사람이 네 땅의 네 성문들 가운데 한 곳에 있을지라도, 곧 야훼 너의 하나님이 네게 주시는 그 땅에서라면, 너는 네 마음을 완고하게 하지 말고 네 가난한 형제에게 네 손을 움켜쥐지 말아야 합니다.[a]
  to: 네 하나님 야훼께서 네게 주시는 땅, 곧 네 성문들 가운데 한 곳에 네 형제 중 가난한 사람이 하나 있으면[a], 너는 네 마음을 완고하게 하지 말고, 네 가난한 형제에게 손을 닫아 쥐지 마십시오.[b]
  rationale: The revision changes the concessive condition to a standard legal conditional, restores a clear relationship between the land and its gates, and renders the closed-hand idiom in natural Korean without reducing its concrete image. It retains ‘야훼’ and ‘형제,’ while placing both notes at their relevant textual anchors.
