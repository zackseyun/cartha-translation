source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
  footnotes:
  - marker: a
    text: Or 'in one of your towns'; literally 'within one of your gates.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' and ''brother'' here use familial language for fellow members of the covenant community.'
    reason: cultural_note
translation:
  language: ko
  text: 네 하나님 야훼께서 네게 주시는 땅, 곧 네 성문들 가운데 한 곳에 네 형제 중 가난한 사람이 하나 있으면[a], 너는 네 마음을 완고하게 하지 말고, 네 가난한 형제에게 손을 닫아 쥐지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 성문들 가운데 한 곳에’는 문자적으로 성문을 가리키지만, 여기서는 성읍이나 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 여기서 언약 공동체의 동료 구성원을 가리키는 가족 언어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  english_pob_choice: If there is
  chosen_korean: 만일 … 있을지라도
  alternatives_korean:
  - 만일 … 있다면
  - …이 있을 때
  lexicon: HALOT
  rationale: 법조문형 조건문을 살려 ‘만일 … 있을지라도’로 시작하면, 단순한 존재 진술이 아니라 뒤따르는 금지 명령의 조건을 자연스럽게 드러낼 수 있습니다.
- source_word: אֶבְיוֹן
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 궁핍한 사람
  - 가난한 자
  lexicon: HALOT
  rationale: 아브요ן은 가난하고 궁핍한 상태의 사람을 가리키므로, 현대 한국어에서 자연스러운 ‘가난한 사람’이 뜻을 가장 분명하게 전달합니다.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  english_pob_choice: within one of your gates
  chosen_korean: 네 성문들 가운데 한 곳에
  alternatives_korean:
  - 네 성문들 안에
  - 네 성읍들 가운데
  lexicon: HALOT
  rationale: ‘성문들’은 도시/공동체를 가리키는 히브리어의 문자적 표지이므로, 본문 이미지를 살리되 한국어로는 위치를 풀어 ‘가운데 한 곳에’라고 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 주 너의 하나님
  lexicon: HALOT
  rationale: 이 번역은 여호와를 대체하는 관습적 호칭보다 신명기의 원어 고유명사를 직접 드러내는 원칙을 따르므로 ‘야훼’를 유지합니다.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ וְלֹא תִקְפֹּץ אֶת יָדְךָ
  english_pob_choice: you shall not harden your heart or shut your hand
  chosen_korean: 너는 네 마음을 완고하게 하지 말고 네 손을 움켜쥐지 말아야 합니다
  alternatives_korean:
  - 네 마음을 굳게 하지 말고 네 손을 닫지 말아야 합니다
  - 네 마음을 강퍅하게 하지 말고 네 손을 거두지 말아야 합니다
  lexicon: HALOT
  rationale: ‘마음을 완고하게 하다’는 히브리 관용을 직접 반영하고, ‘손을 움켜쥐다’는 닫아 쥔 손의 구체적 이미지를 살리면서 자선을 거부하는 동작을 드러냅니다.
theological_decisions:
- issue: 언약 공동체 내부의 형제 언어(אַחֶיךָ / אָחִיךָ)
  chosen_reading: 형제
  alternative_readings:
  - 동족
  - 동료 이스라엘 사람
  - 친족
  rationale: 이 절은 경제적 의무를 혈연적이면서도 언약적인 ‘형제’ 관계로 규정하므로, 그 신학적·사회적 긴장을 약화하지 않기 위해 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
