  lexicon: Project default / theological name policy
  rationale: 본문의 신명기적 언약 이름을 제목형 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 의무 표현의 강도
  chosen_reading: ‘반드시 주십시오’로 의무성과 강조를 함께 살렸습니다.
  alternative_readings:
  - ‘주어야 합니다’
  - ‘꼭 주어야 합니다’
  rationale: 단순한 권고가 아니라 베풂을 강하게 명하는 문맥이므로, 강조를 약화하지 않는 한국어 명령형이 적절합니다.
  doctrine_reference: Deuteronomy 15:10 문맥상 자선 명령
- issue: יהוה의 번역
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 문맥상 신명기의 언약 명칭이므로 일반 칭호로 대체하지 않고, 텍스트가 지시하는 고유한 신명 표현을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
