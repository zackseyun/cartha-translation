  lexicon: HALOT
  rationale: 레 15:10의 핵심은 주는 행위에 대한 내적 꺼림·서운함의 부재이므로, 현대 한국어에서 자연스럽고 정서적 저항을 담는 표현을 택했습니다.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  english_pob_choice: because on account of this thing
  chosen_korean: 이는 이 일 때문에
  alternatives_korean:
  - 이는 이 일로 말미암아
