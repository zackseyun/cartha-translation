base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
  footnotes:
  - marker: a
    text: Or, 'your heart shall not be grieved' or 'you shall not be resentful' when you give to him.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in every sending out of your hand'; that is, in all that your hand undertakes.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게 반드시 주십시오[a]. 그리고 그에게 줄 때에 마음이 상하지[b] 않아야 합니다. 이는 이 일 때문에 야훼 당신의 하나님께서 당신의 모든 일과 당신의 손이 내딛는 모든 일에 복을 주실 것이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 반드시 주라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 마음이 상하지/아프지’입니다. 즉, 주는 일을 못마땅해하거나 서운해하지 말라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이 일 때문에’입니다. ‘이 일’은 앞의 아낌없는 나눔을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  english_pob_choice: You shall surely give
  chosen_korean: 반드시 주십시오
  alternatives_korean:
  - 꼭 주십시오
  - 기필코 주십시오
  lexicon: HALOT
  rationale: 부정확한 완화 없이 히브리어의 강조(부정사 절대형+미완료형)를 한국어 명령으로 자연스럽게 살렸습니다.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  english_pob_choice: your heart shall not be troubled
  chosen_korean: 마음이 상하지 않아야 합니다
  alternatives_korean:
  - 마음이 괴로워하지 않아야 합니다
  - 마음이 섭섭해하지 않아야 합니다
  lexicon: HALOT
  rationale: 레 15:10의 핵심은 주는 행위에 대한 내적 꺼림·서운함의 부재이므로, 현대 한국어에서 자연스럽고 정서적 저항을 담는 표현을 택했습니다.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  english_pob_choice: because on account of this thing
  chosen_korean: 이는 이 일 때문에
  alternatives_korean:
  - 이는 이 일로 말미암아
  - 이는 이 일로 인해
  lexicon: HALOT
  rationale: דָּבָר를 추상화해 ‘이 일’로 옮겨, 명령한 구제 행위 자체가 복의 근거라는 인과를 간결하게 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Project default / theological name policy
  rationale: 본문의 신명기적 언약 이름을 제목형 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 의무 표현의 강도
  chosen_reading: ‘반드시 주십시오’로 의무성과 강조를 함께 살렸습니다.
  alternative_readings:
  - ‘주어야 합니다’
  - ‘꼭 주어야 합니다’
  rationale: 단순한 권고가 아니라 베풂을 강하게 명하는 문맥이므로, 강조를 약화하지 않는 한국어 명령형이 적절합니다.
  doctrine_reference: Deuteronomy 15:10 문맥상 자선 명령
- issue: יהוה의 번역
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 문맥상 신명기의 언약 명칭이므로 일반 칭호로 대체하지 않고, 텍스트가 지시하는 고유한 신명 표현을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
