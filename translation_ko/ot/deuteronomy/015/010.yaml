base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
  footnotes:
  - marker: a
    text: Or, 'your heart shall not be grieved' or 'you shall not be resentful' when you give to him.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in every sending out of your hand'; that is, in all that your hand undertakes.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게 반드시 주십시오[a]. 그에게 줄 때에는 마음이 언짢지 않게 하십시오[b]. 이 일 때문에 야훼[c] 당신의 하나님께서 당신의 모든 일과 당신이 손대는 모든 일에 복을 주실 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주다’라는 동사의 부정사 절대형과 미완료형을 함께 써서 명령을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘당신의 마음이 나쁘게 되지 않게’라는 표현입니다. 주는 일을 불쾌하게 여기거나 마지못해 하지 말라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 신명 YHWH를 음역한 것입니다.
    reason: alternative_reading
  - marker: d
    text: 직역하면 ‘당신의 손의 모든 뻗침/보냄’입니다. 당신이 손대거나 착수하는 모든 일을 뜻합니다.
    reason: lexical_alternative
