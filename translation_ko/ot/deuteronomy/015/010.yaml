- from: 그에게 반드시 주십시오[a]. 그리고 그에게 줄 때에 마음이 상하지[b] 않아야 합니다. 이는 이 일 때문에 야훼 당신의 하나님께서 당신의 모든 일과 당신의 손이 내딛는 모든 일에 복을 주실 것이기 때문입니다[c].
  to: 그에게 반드시 주십시오[a]. 그에게 줄 때에는 마음이 언짢지 않게 하십시오[b]. 이 일 때문에 야훼[c] 당신의 하나님께서 당신의 모든 일과 당신이 손대는 모든 일에 복을 주실 것입니다[d].
  rationale: 핵심 동사 יֵרַע가 나타내는 베풂에 대한 부정적 마음가짐을 ‘마음이 언짢지 않게’로 보완하고, מִשְׁלַח יָדֶךָ를 한국어 관용 표현인 ‘손대는 모든 일’로 바로잡았습니다. 원문의 강조, 인과 관계, 야훼라는 신명, 그리고 미래의 축복 약속은 유지했습니다.
