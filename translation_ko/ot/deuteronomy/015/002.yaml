source:
  edition: WLC
  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
  footnotes:
  - marker: a
    text: Or 'remission' or 'cancellation' for 'release' (Hebrew shemittah), the formal dropping of debt claims in the sabbatical year.
    reason: lexical_alternative
  - marker: b
    text: '''Brother'' here refers to a fellow member of the covenant community; some translations render more interpretively as ''fellow Israelite'' or similar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「이것이 면제의 규정입니다. 각 채권자는 자기 손으로 빌려준 것을 그의 이웃에게서 면제해야 합니다[a]. 그는 자기 이웃이나 자기 형제를 억압해서는 안 됩니다[b]. 이는 야훼께 면제가 선포되었기 때문입니다」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘탕감’, ‘취소’로도 옮길 수 있습니다. כאן의 שְׁמִטָּה는 안식년의 채무 면제를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘형제’는 언약 공동체의 구성원을 가리킵니다. 일부 번역은 더 풀어서 ‘동료 이스라엘 사람’처럼 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  english_pob_choice: release
  chosen_korean: 면제
  alternatives_korean:
  - 해제
  - 탕감
  - 방면
  lexicon: HALOT
  rationale: 희년·안식년 문맥의 채무를 공식적으로 내려놓는 제도라는 점을 살려, 법적·경제적 뉘앙스가 분명한 ‘면제’로 옮겼습니다.
- source_word: בַּעַל מַשֵּׁה יָד / מַשֵּׁה
  english_pob_choice: every creditor / has lent
  chosen_korean: 각 채권자는 자기 손으로 빌려준 것
  alternatives_korean:
  - 모든 채권자는 자기 손으로 대여한 것
  - 각 빚진 자는
  lexicon: HALOT
  rationale: ‘채권자’는 법적 관계를 자연스럽게 드러내고, ‘자기 손’은 히브리어의 손-행위 관용을 보존하면서도 한국어로 읽히는 표현입니다.
- source_word: לֹא יִגֹּשׂ
  english_pob_choice: shall not press
  chosen_korean: 억압해서는 안 됩니다
  alternatives_korean:
  - 독촉해서는 안 됩니다
  - 강제로 받으려 해서는 안 됩니다
  lexicon: HALOT
  rationale: 단순한 연락이나 독촉보다 채무를 강하게 밀어붙이는 압박을 가리키므로, 법적·관계적 압력을 포괄하는 ‘억압하다’로 살렸습니다.
- source_word: רֵעֵהוּ / אָחִיו
  english_pob_choice: neighbor / brother
  chosen_korean: 이웃 / 형제
  alternatives_korean:
  - 동료 / 형제
  - 동족 / 형제
  lexicon: HALOT
  rationale: POB의 ‘neighbor’와 ‘brother’를 각각 ‘이웃’과 ‘형제’로 직역해, 사회적 대상과 언약 공동체 내 형제성을 구분했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기 본문의 신명기 이름을 ‘야훼’로 표기하고, 여격 표지를 살려 ‘-께’로 옮겼습니다.
theological_decisions:
- issue: 안식년 채무 면제의 공적 선포 성격
  chosen_reading: 개인의 호의가 아니라 야훼께 선포된 제도적 면제로 읽었습니다.
  alternative_readings:
  - 관대한 상환 유예
  - 사적 채무 탕감
  rationale: 본문은 ‘규정/면제’와 ‘선포되었다’는 공적 법률 언어를 사용하므로, 사적 친절보다 언약 공동체의 제도적 명령으로 드러내는 것이 맞습니다.
  doctrine_reference: Deuteronomy 15:2 sabbatical release ordinance
