  - 그들의 아세라 나무
  lexicon: HALOT
  rationale: 아세라 관련 숭배 물체를 지시하므로, 한국어 성경 독자가 이해하기 쉬운 ‘목상’을 택하되, 단순한 우상 일반으로 흐르지 않도록 아세라 명칭을 유지했습니다.
- source_word: פְסִילֵיהֶם
  english_pob_choice: their carved images
  chosen_korean: 그들의 새긴 우상
  alternatives_korean:
  - 그들의 조각한 형상
  - 그들의 조각 우상
  - 그들의 새긴 형상
  lexicon: HALOT
  rationale: פֶּסֶל의 ‘새긴/조각한’ 형상이라는 구체성을 살리면서도, 본문이 금지하는 대상임을 드러내기 위해 ‘우상’을 사용했습니다.
theological_decisions:
- issue: 우상 숭배 대상 파괴 명령의 강도 보존
  chosen_reading: ‘허물고, 깨뜨리며, 베어 내고, 불에 태우십시오’처럼 연속된 강한 명령형으로 옮겼습니다.
  alternative_readings:
  - ‘치워 버리십시오’ 같은 완화된 표현
  - 설명적 의역으로 정리하는 방식
  rationale: 히브리어 동사들이 실제적 파괴 행위를 연속적으로 명령하므로, 본문의 엄중함과 분명한 경계 설정을 약화시키지 않도록 직접적인 동작어를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
