  lexicon: HALOT
  rationale: כִּי אִם의 강한 대조와 כֹּה의 지시성을 함께 살리기 위해, 자연스러운 현대 한국어로는 ‘그러나 이렇게’가 가장 간결하고 문맥에 맞습니다.
- source_word: מַצֵּבֹתָם
  english_pob_choice: their pillars
  chosen_korean: 그들의 석주
  alternatives_korean:
  - 그들의 기둥
  - 그들의 성석
  - 그들의 서 있는 돌
  lexicon: HALOT
  rationale: 문맥상 우상 숭배와 관련된 세워진 돌기둥을 가리키므로, 단순한 건축기둥보다 ‘석주’가 더 구체적이고, POB의 cultural note를 반영하면서도 본문 의미를 유지합니다.
- source_word: אֲשֵׁירֵיהֶם
  english_pob_choice: their Asherah poles
  chosen_korean: 그들의 아세라 목상
  alternatives_korean:
  - 그들의 아세라 상
