  source_fidelity: ‘아세라 목상’은 אֲשֵׁרִים을 목조 조각상으로 특정하여, 베어 내라는 동사와 해당 물체의 불확정성을 충분히 반영하지 못합니다. 또한 פְּסִילִים은 ‘새긴 형상’으로 옮기는 편이 조각된 이미지라는 어휘적 의미를 더 정확히 보존합니다. 대조·지시 표현과 네 가지 파괴 명령의 강도는 대체로 잘 반영되었습니다.
  naturalness: ‘그러나 그들에게는 이렇게 하십시오:’은 원문의 ‘그들에게 이렇게 하라’는 구조를 자연스러운 현대 합쇼체로 드러냅니다. 각 목적어에 각주를 직접 붙이고 동사를 병렬하면 읽기에도 명료합니다.
  terminology: מַצֵּבֹת은 ‘석주’로 유지하되 대안 각주를 둡니다. אֲשֵׁרִים은 논쟁적인 물체의 형태를 본문에서 단정하지 않도록 ‘아세라 상징물’로 옮기고, 각주에서 흔히 목재 숭배물로 이해됨을 설명합니다. פְּסִילִים은 ‘새긴 형상’으로 옮기며 ‘우상’을 대안으로 처리합니다.
