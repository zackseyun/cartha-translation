base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
  footnotes:
  - marker: a
    text: Or 'their sacred pillars' or 'their standing stones.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew Asherim; likely wooden cult objects associated with the goddess Asherah.
    reason: cultural_note
  - marker: c
    text: Or 'their idols'; Hebrew more specifically 'their carved images.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그러나 그들에게는 이렇게 하십시오: 그들의 제단을 허물고, 그들의 석주[a]를 깨뜨리며, 그들의 아세라 상징물[b]을 베어 내고, 그들의 새긴 형상[c]을 불에 태우십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 성스러운 기둥’ 또는 ‘그들의 세워진 돌’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 아세림(Asherim). 아세라와 관련된 숭배 물체를 가리키며, 흔히 목재 물체였을 것으로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 우상’입니다. 히브리어는 더 구체적으로 ‘그들의 새긴 형상’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
