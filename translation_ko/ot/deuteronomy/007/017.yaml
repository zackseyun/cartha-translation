  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
  footnotes:
  - marker: a
    text: Or “drive them out.” The Hebrew verb carries the sense of causing them to lose possession of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 「마음속으로 ‘이 민족들은 나보다 수가 많으니, 내가 어떻게 그들을 내쫓을 수 있겠는가?’라고 말하면」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 몰아내다.” 히브리어 동사는 그들로 하여금 그 땅의 소유권을 잃게 하는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאמַר בִּלְבָבְךָ
  english_pob_choice: you say in your heart
  chosen_korean: 마음속으로 …라고 말하면
  alternatives_korean:
  - 속으로 …라고 생각하면
  - 마음에 …라고 말하면
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 발화를 가리키므로, ‘마음속으로’와 ‘말하면’로 내부 독백을 자연스럽게 살렸습니다.
- source_word: הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: these nations
  chosen_korean: 이 민족들은
  alternatives_korean:
  - 이 나라들은
  - 이 나라 백성들은
  lexicon: HALOT
  rationale: 문맥상 가나안의 개별 정치체를 가리키지만 한국어에서는 ‘민족들’이 집단성과 인칭적 뉘앙스를 함께 잘 전달합니다.
- source_word: רַבִּים … מִמֶּנִּי
  english_pob_choice: are more numerous than I
  chosen_korean: 나보다 수가 많으니
  alternatives_korean:
  - 나보다 더 많으니
  - 나보다 수적으로 많으니
  lexicon: HALOT
  rationale: 비교 의미를 분명히 하되, 직역투를 줄여 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: לְהוֹרִישָׁם
  english_pob_choice: dispossess them
  chosen_korean: 그들을 내쫓을 수 있겠는가
  alternatives_korean:
  - 그들을 몰아낼 수 있겠는가
  - 그들의 땅을 빼앗을 수 있겠는가
  lexicon: HALOT
  rationale: 히브리어는 단순 추방보다 ‘상속권/점유권을 잃게 하다’는 뉘앙스가 있으나, 한국어 본문에서는 문맥상 가장 직접적인 결과인 추방을 드러내되 각주로 보완했습니다.
