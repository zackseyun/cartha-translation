base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of slaves[b], from the hand of Pharaoh king of Egypt.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'from the house of slavery.' The Hebrew is literally 'from the house of slaves.'
    reason: lexical_alternative
  - marker: b
    text: '''With a strong hand'' may also be rendered ''with a mighty hand,'' a common idiom for the LORD''s powerful deliverance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서 여러분을 사랑하시고 여러분의 조상들에게 맹세하신 맹세를 지키시기 때문에, 야훼께서 강한 손으로[b] 여러분을 이끌어 내시고 노예들의 집에서[a], 곧 이집트 왕 파라오의 손에서 여러분을 속량하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘노예들의 집’입니다. 전통적으로는 ‘노예 생활의 집’ 또는 ‘종살이하던 집’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강한 손’은 히브리어 관용구 בְּיָד חֲזָקָה를 직접 반영한 표현입니다. ‘능한 손’ 또는 ‘강력한 손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  english_pob_choice: because Yahweh loves you
  chosen_korean: 야훼께서 여러분을 사랑하시기 때문에
  alternatives_korean:
  - 야훼의 여러분을 향한 사랑 때문에
  - 야훼께서 여러분을 사랑하므로
  lexicon: HALOT
  rationale: מִן + אהב은 원인 관계를 나타내므로, 의미를 자연스럽게 드러내되 원문의 인과성을 유지해 옮겼습니다.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  english_pob_choice: and because he is keeping the oath
  chosen_korean: 그리고 여러분의 조상들에게 맹세하신 맹세를 지키시기 때문에
  alternatives_korean:
  - 그리고 그 맹세를 지키시며
  - 그리고 그 맹세를 지키고 계시기 때문에
  lexicon: HALOT
  rationale: 지속적·신실한 언약 준수의 뉘앙스를 살리기 위해 현재형 존대 표현으로 옮겼습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a mighty hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 권능의 손으로
  - 능한 손으로
  lexicon: HALOT
  rationale: 관용구의 손상을 피하면서도 חֲזָקָה의 직역 성분을 살려 현대 한국어에서 자연스러운 ‘강한 손’으로 옮겼습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종들의 집에서
  alternatives_korean:
  - 노예들의 집에서
  - 종살이의 집에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘종들의 집’이지만, 한국어에서는 ‘집’이 공간을 넘어 상태·영역을 함께 드러내도록 처리했습니다. 문맥상 이집트의 예속 상태를 분명히 합니다.
- source_word: וַיִּפְדְּךָ
  english_pob_choice: redeemed you
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구원하셨습니다
  - 되찾아 주셨습니다
  lexicon: HALOT
  rationale: פדה의 구속·대가 지불의 의미를 보존하기 위해 ‘속량하다’를 택했습니다. 출애굽 맥락의 신학적 무게를 유지합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기에서 하나님의 고유 이름을 직접 사용하므로, 대체 칭호 대신 음역형 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 출애굽 구속 언어
  chosen_reading: 속량하셨습니다
  alternative_readings:
  - 구원하셨습니다
  - 건져 내셨습니다
  rationale: 이 문맥은 단순한 구조가 아니라 언약적 해방과 소유권의 전환을 포함하므로, 구속의 의미를 지닌 ‘속량하다’를 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
