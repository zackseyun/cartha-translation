  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
  footnotes:
  - marker: a
    text: Or, more inclusively, 'No one will stand before you.' The Hebrew reads 'man' (אִישׁ) in a representative singular sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들의 왕들을 당신의 손에 넘기실 것이며, 당신은 그들의 이름을 하늘 아래에서 사라지게 하셔야 합니다. 아무도 당신 앞에 맞서 서지 못할 것이며, 당신이 그들을 멸망시킬 때까지 그러할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ은 여기서 대표적 단수로 쓰여 ‘남자’가 아니라 ‘아무도/어떤 사람도’라는 총칭 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן / מַלְכֵיהֶם
  english_pob_choice: he will give their kings
  chosen_korean: 그는 그들의 왕들을 당신의 손에 넘기실 것이며
  alternatives_korean:
  - 그는 그들의 왕들을 당신의 손에 주실 것이며
  - 그는 그들의 왕들을 당신의 손에 넘기고
  lexicon: HALOT
  rationale: 예언적 미래를 반영해 ‘넘기실 것’으로 옮기고, 복수 소유격 ‘그들의 왕들’을 그대로 살렸습니다. ‘주실’도 가능하지만, 전쟁 문맥의 처분·인도 의미를 더 분명히 드러내기 위해 ‘넘기다’를 택했습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: into your hand
  chosen_korean: 당신의 손에
  alternatives_korean:
  - 당신의 권세 아래
  - 당신의 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 ‘손에’로 직역하되, 한국어에서도 패전과 인도됨의 이미지를 충분히 전달합니다.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  english_pob_choice: you shall make their name perish
  chosen_korean: 그들의 이름을 하늘 아래에서 사라지게 하셔야 합니다
  alternatives_korean:
  - 그들의 이름을 멸하시어 없애셔야 합니다
  - 그들의 이름을 지워 버리셔야 합니다
  lexicon: HALOT
  rationale: אבד의 사동형과 목적어 ‘이름’을 살려 단순한 사람의 파괴보다 기억·명성의 소멸이라는 뜻을 반영했습니다. ‘사라지게 하다’는 ‘name perish’의 직역성과 한국어 자연성을 함께 유지합니다.
- source_word: מִתַּחַת הַשָּׁמָיִם
  english_pob_choice: from under heaven
  chosen_korean: 하늘 아래에서
  alternatives_korean:
  - 하늘 아래로부터
  - 온 하늘 아래에서
  lexicon: HALOT
  rationale: 히브리어의 전형적 총체성 표현을 한국어 관용으로 옮겼습니다. ‘하늘 아래에서’가 가장 간결하면서도 범위의 전면성을 보존합니다.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  english_pob_choice: No man will stand before you
  chosen_korean: 아무도 당신 앞에 맞서 서지 못할 것이며
  alternatives_korean:
  - 남자도 당신 앞에 서지 못할 것이며
  - 사람 하나도 당신 앞에 서지 못할 것이며
  lexicon: HALOT
  rationale: 대표적 단수 אִישׁ의 성별 표지를 그대로 살리기보다, 전투 맥락에서의 대표적 총칭을 한국어 자연어로 반영해 ‘아무도’로 옮겼습니다. ‘맞서 서다’는 단순한 위치가 아니라 적대적 대항을 드러냅니다.
- source_word: עַד הִשְׁמִידְךָ אֹתָם
  english_pob_choice: until you have destroyed them
  chosen_korean: 당신이 그들을 멸망시킬 때까지
  alternatives_korean:
  - 당신이 그들을 완전히 멸할 때까지
  - 당신이 그들을 없앨 때까지
  lexicon: HALOT
  rationale: שמד의 강한 멸절 의미를 살리기 위해 ‘멸망시키다’를 사용했습니다. 완료 시점을 나타내는 ‘until’은 한국어에서 자연스러운 종결 표현으로 옮겼습니다.
theological_decisions:
- issue: אִישׁ의 대표적 단수와 한국어 성별 표지
  chosen_reading: ‘아무도 당신 앞에 맞서 서지 못할 것’으로 번역해 대표적 단수의 총칭성을 드러냈습니다.
  alternative_readings:
  - ‘남자도 당신 앞에 서지 못할 것’
  - ‘어떤 사람도 당신 앞에 서지 못할 것’
  rationale: 히브리어 אִישׁ은 남성형이지만 문맥상 대표적 총칭으로 쓰였습니다. 한국어에서는 현대 독자가 오해하지 않도록 총칭 의미를 우선 전달하되, 남성형을 억지로 유지하지는 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
