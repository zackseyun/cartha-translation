review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וְהַאֲבַדְתָּ는 이 문맥에서 미래적 결과/명령의 연속이지 ‘반드시 해야 한다’라는 의무 양태를 뜻하지 않습니다. 또한 עַד 이하의 시간 한정은 ‘아무도 맞서 서지 못함’에 직접 연결하는 편이 원문의 구문과 의미를 더 정확히 드러냅니다. ‘이름을 사라지게 하다’는 אבד 사동형과 ‘이름’의 목적어 관계를 적절히 보존합니다.
  naturalness: 초안의 ‘사라지게 하셔야 합니다’는 신적 약속의 문맥에서 부자연스럽고 의미를 의무로 바꿉니다. ‘당신이 … 때까지 그러할 것입니다’도 지시 대상이 다소 불분명합니다. 시간절을 앞세운 한 문장으로 정리하면 현대 한국어로 더 자연스럽습니다. 본문상 주어는 앞 문맥의 주님이므로 ‘주님께서는’으로 명시했습니다.
  terminology: ‘주님’은 이 절의 생략된 3인칭 주어가 앞 문맥의 YHWH임을 한국어에서 자연스럽게 드러냅니다. ‘멸망시키다’는 שׁמד의 강한 파괴 의미를 문맥에 맞게 전달합니다. אִישׁ은 문맥상 총칭적 단수이므로 ‘아무도’가 자연스럽고 충실하며, 각주에서는 이 용법을 ‘남자’라는 어휘 뜻 자체와 혼동하지 않도록 설명을 다듬었습니다.
  issues:
  - severity: high
    issue: ‘당신은 … 사라지게 하셔야 합니다’가 וְהַאֲבַדְתָּ를 의무·당위로 번역합니다.
    rationale: 히브리어 접속사와 완료형은 이 약속/예언 문맥에서 미래적 결과를 이어 갑니다. ‘해야 합니다’는 원문에 없는 의무 양태를 더하므로 ‘사라지게 할 것입니다’로 고쳐야 합니다.
  - severity: medium
    issue: ‘당신이 그들을 멸망시킬 때까지 그러할 것입니다’의 ‘그러할’은 선행 내용을 불명확하게 되풀이합니다.
    rationale: עַד הִשְׁמִידְךָ אֹתָם은 ‘아무도 맞서 서지 못한다’의 종점을 한정합니다. ‘네가 그들을 멸망시킬 때까지 아무도 … 못할 것입니다’로 연결하면 원문의 관계가 명료합니다.
  - severity: low
    issue: 각주의 ‘남자가 아니라’라는 표현이 אִישׁ의 기본 어휘 의미를 지나치게 배제합니다.
    rationale: אִישׁ은 기본적으로 ‘남자/사람’을 뜻할 수 있으나, 여기서는 총칭적으로 기능합니다. 각주는 문맥상 용법을 설명해야 합니다.
