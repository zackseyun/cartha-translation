- from: 그는 그들의 왕들을 당신의 손에 넘기실 것이며, 당신은 그들의 이름을 하늘 아래에서 사라지게 하셔야 합니다. 아무도 당신 앞에 맞서 서지 못할 것이며, 당신이 그들을 멸망시킬 때까지 그러할 것입니다.[a]
  to: 주님께서는 그들의 왕들을 네 손에 넘기실 것이며, 너는 그들의 이름을 하늘 아래에서 사라지게 할 것입니다. 네가 그들을 멸망시킬 때까지 아무도 네 앞에 맞서 서지 못할 것입니다.[a]
  rationale: 미래적 약속을 의무 표현으로 바꾼 ‘하셔야 합니다’를 미래 표현으로 교정하고, ‘~때까지’ 절을 ‘아무도 맞서 서지 못함’에 직접 연결했습니다. 아울러 신적 주어를 문맥에 따라 ‘주님’으로 자연스럽게 명시하고, אִישׁ의 총칭 용법을 설명하는 각주는 유지하되 어휘 의미를 과도하게 제한하지 않도록 수정했습니다.
