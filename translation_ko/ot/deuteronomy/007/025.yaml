  lexicon: HALOT
  rationale: 금지문의 윤리적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 동사형을 택했습니다.
- source_word: תִּוָּקֵשׁ בּוֹ
  english_pob_choice: lest you be ensnared by it
  chosen_korean: 그것으로 덫에 걸리지 않도록 하십시오
  alternatives_korean:
  - 그것에 잡히지 않도록 하십시오
  - 그것에 걸려들지 않도록 하십시오
  lexicon: HALOT
  rationale: יָקַשׁ의 ‘올무/덫’ 이미지를 살리면서, 한국어에서 경고문으로 자연스러운 표현을 사용했습니다.
- source_word: יְהוָה
