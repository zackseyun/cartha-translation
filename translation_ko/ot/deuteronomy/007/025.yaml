  rationale: 프로젝트 기준에 따라 신성명은 ‘야훼’로 옮겨, 고유한 신적 이름을 보존했습니다.
theological_decisions:
- issue: 히브리어 אַל־תַחְמֹד의 금지 강도
  chosen_reading: 단순한 소유 욕구가 아니라, 우상에 붙은 금·은을 자기 것으로 취하려는 탐욕을 직접 금하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘원하지 말라’로 완화해 옮길 수 있습니다.
  - ‘탐심을 품지 말라’로 더 내면화할 수 있습니다.
  rationale: 문맥이 우상 파괴 명령과 결부되어 있으므로, 단순 선호가 아니라 금지된 취득 욕망을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 우상과 관련된 재산 취득의 금지
- issue: 마지막 대명사 הוּא의 가리킴
  chosen_reading: ‘그것’이 우상 자체, 그 위의 금·은, 또는 그에 얽힌 행위 전체를 포괄적으로 가리키도록 두었습니다.
  alternative_readings:
  - ‘그 우상은’으로 구체화할 수 있습니다.
  - ‘그 금과 은은’으로 좁힐 수 있습니다.
  rationale: 히브리어의 긴장과 범위를 좁히지 않고 보존해, 독자가 문맥상 의도된 포괄적 경고를 읽도록 했습니다.
  doctrine_reference: 해석의 긴장 보존
