  alternatives_korean:
  - 불에 태우십시오
  - 불 가운데서 태우십시오
  lexicon: HALOT
  rationale: 히브리어의 수단/방식 표현을 간결한 한국어로 옮겨, 명령의 강도를 유지했습니다.
- source_word: תַּחְמֹד
  english_pob_choice: shall not covet
