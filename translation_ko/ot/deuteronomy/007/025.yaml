source:
  edition: WLC
  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'the silver and gold on them.' The Hebrew conjunction is 'and'; English 'or' in a prohibition can naturally express either item individually.
    reason: lexical_alternative
  - marker: b
    text: Or 'lest you be trapped by it.' The Hebrew verb carries the imagery of being caught in a snare.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 신들의 새긴 우상들을 불로 태우십시오[a]. 그 위에 있는 은이나 금을 탐내지 말고, 그것을 자신을 위해 가져가서는 안 됩니다. 그것으로 덫에 걸리지 않도록 하십시오[b]. 그것은 야훼 당신의 하나님께 가증한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 있는 은과 금’입니다. 히브리어 접속사는 ‘그리고’이지만, 부정 명령에서는 영어처럼 각 항목을 개별적으로 가리키는 뜻으로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것에 붙잡히지 않도록 하십시오’입니다. 히브리어 동사는 올무에 걸린다는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  english_pob_choice: carved images
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  lexicon: HALOT
  rationale: פֶּסֶל의 구체적 조형성을 살리되, 문맥상 우상 숭배 대상을 드러내는 ‘우상’으로 자연스럽게 옮겼습니다.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  english_pob_choice: shall burn ... with fire
  chosen_korean: 불로 태우십시오
  alternatives_korean:
  - 불에 태우십시오
  - 불 가운데서 태우십시오
  lexicon: HALOT
  rationale: 히브리어의 수단/방식 표현을 간결한 한국어로 옮겨, 명령의 강도를 유지했습니다.
- source_word: תַּחְמֹד
  english_pob_choice: shall not covet
  chosen_korean: 탐내지 말고
  alternatives_korean:
  - 탐하지 말고
  - 탐심을 품지 말고
  lexicon: HALOT
  rationale: 금지문의 윤리적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 동사형을 택했습니다.
- source_word: תִּוָּקֵשׁ בּוֹ
  english_pob_choice: lest you be ensnared by it
  chosen_korean: 그것으로 덫에 걸리지 않도록 하십시오
  alternatives_korean:
  - 그것에 잡히지 않도록 하십시오
  - 그것에 걸려들지 않도록 하십시오
  lexicon: HALOT
  rationale: יָקַשׁ의 ‘올무/덫’ 이미지를 살리면서, 한국어에서 경고문으로 자연스러운 표현을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기준에 따라 신성명은 ‘야훼’로 옮겨, 고유한 신적 이름을 보존했습니다.
theological_decisions:
- issue: 히브리어 אַל־תַחְמֹד의 금지 강도
  chosen_reading: 단순한 소유 욕구가 아니라, 우상에 붙은 금·은을 자기 것으로 취하려는 탐욕을 직접 금하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘원하지 말라’로 완화해 옮길 수 있습니다.
  - ‘탐심을 품지 말라’로 더 내면화할 수 있습니다.
  rationale: 문맥이 우상 파괴 명령과 결부되어 있으므로, 단순 선호가 아니라 금지된 취득 욕망을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 우상과 관련된 재산 취득의 금지
- issue: 마지막 대명사 הוּא의 가리킴
  chosen_reading: ‘그것’이 우상 자체, 그 위의 금·은, 또는 그에 얽힌 행위 전체를 포괄적으로 가리키도록 두었습니다.
  alternative_readings:
  - ‘그 우상은’으로 구체화할 수 있습니다.
  - ‘그 금과 은은’으로 좁힐 수 있습니다.
  rationale: 히브리어의 긴장과 범위를 좁히지 않고 보존해, 독자가 문맥상 의도된 포괄적 경고를 읽도록 했습니다.
  doctrine_reference: 해석의 긴장 보존
