- from: 그들의 신들의 새긴 우상들을 불로 태우십시오[a]. 그 위에 있는 은이나 금을 탐내지 말고, 그것을 자신을 위해 가져가서는 안 됩니다. 그것으로 덫에 걸리지 않도록 하십시오[b]. 그것은 야훼 당신의 하나님께 가증한 것이기 때문입니다.
  to: 그들의 신들의 조각상들을 불에 태우십시오. 그 위에 있는 은이나 금을 탐내어 자기 것으로 가져가지 마십시오[a]. 그렇게 하면 그것 때문에 올무에 걸릴 수 있기 때문입니다[b]. 그것은 야훼 당신의 하나님께 가증한 것이기 때문입니다.
  rationale: 조각된 형상이라는 어휘 의미를 자연스러운 현대 한국어로 바로잡고, פֶּן 절의 경고 기능을 보존했습니다. 또한 은과 금의 접속사에 관한 각주를 해당 어구에 정확히 연결했으며, 각주 설명을 한국어 독자에게 직접 유효하도록 수정했습니다. 마지막 대명사 ‘그것’은 원문의 넓고 다소 유동적인 지시 대상을 유지합니다.
