  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, פְּסִילֵי אֱלֹהֵיהֶם는 ‘그들의 신들의 새긴 우상들’보다 ‘그들의 신들의 조각상들’로 옮기는 편이 히브리어의 조각된 형상이라는 구체성을 살리면서 한국어 문법과 의미를 더 정확히 반영합니다. 또한 פֶּן תִּוָּקֵשׁ בּוֹ는 결과 경고를 나타내므로 ‘…않도록 하십시오’보다는 ‘…올무에 걸릴 수 있기 때문입니다’가 원문의 논리 관계를 더 자연스럽게 드러냅니다.
  naturalness: 초안의 ‘그들의 신들의 새긴 우상들’은 수식 관계가 어색하고 ‘새긴’과 ‘우상’의 결합도 현대 표준어에서 매끄럽지 않습니다. 금지 명령은 ‘탐내어 자기 것으로 가져가지 마십시오’로 연결하면 간결하고 자연스럽습니다. 각 문장은 합쇼체를 유지합니다.
  terminology: ‘야훼’, ‘하나님’, ‘가증한 것’은 프로젝트의 명칭 및 신학 용어 선택과 일치합니다. 마지막 ‘그것’은 조각상, 그 위의 귀금속, 또는 그와 결부된 취득 행위를 포괄할 수 있는 히브리어 대명사의 가리킴을 과도하게 한정하지 않습니다.
  issues:
  - severity: medium
    issue: 첫 문장의 ‘새긴 우상들’ 표현
    rationale: פֶּסֶל은 조각하거나 새겨 만든 형상을 뜻합니다. ‘새긴 우상’은 한국어에서 부자연스럽고, ‘우상’은 이미 문맥상 함의를 지녀 조형적 의미가 흐려질 수 있습니다. ‘신들의 조각상들’이 자연스럽고 구체적입니다.
  - severity: medium
    issue: 각주 a의 앵커가 관련 어구와 떨어져 있음
    rationale: 각주의 내용은 은·금 사이의 접속 관계에 관한 것인데, 초안에서는 ‘불로 태우십시오’ 뒤에 붙어 있습니다. ‘은이나 금’ 뒤로 옮겨야 독자가 각주의 대상 어구를 분명히 알 수 있습니다.
