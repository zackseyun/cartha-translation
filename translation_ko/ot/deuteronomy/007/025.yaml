    rationale: 한국어 번역 각주는 한국어 독자에게 히브리어 ‘은과 금’과 번역문의 ‘은이나 금’의 관계를 직접 설명해야 합니다. ‘영어처럼’이라는 설명은 한국어 번역의 각주로 적절하지 않습니다.
