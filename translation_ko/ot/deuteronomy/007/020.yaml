translation:
  language: ko
  text: 또 야훼 당신의 하나님께서는 그들 가운데로 말벌을 보내실 것입니다. 그들 가운데 남아 있는 자들과 당신 앞에서 숨어 있는 자들이 멸망할 때까지 그러하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공포’ 또는 ‘공황’. 일부는 ‘말벌’을 하나님께서 보내시는 두려움을 비유적으로 가리키는 말로 이해합니다.
    reason: lexical_alternative
