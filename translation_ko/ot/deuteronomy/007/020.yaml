revisions:
- from: 또 주 당신의 하나님께서 그들 가운데에 말벌을 보내셔서, 당신 앞에서 남아 있는 자들과 숨어 있는 자들이 멸망할 때까지 하실 것입니다.[a]
  to: 또 야훼 당신의 하나님께서는 그들 가운데로 말벌을 보내실 것입니다. 그들 가운데 남아 있는 자들과 당신 앞에서 숨어 있는 자들이 멸망할 때까지 그러하실 것입니다.[a]
  rationale: 불명확한 보조 동사 구조를 제거하고, ‘말벌을 보내심’이 남아 있거나 숨어 있는 자들의 멸망 때까지 계속된다는 원문의 시간적 관계를 분명히 했습니다. ‘당신 앞에서’는 ‘숨어 있는 자들’에 연결되도록 배열했습니다. 신명은 영어 POB의 번역 방침과 원문 표기를 따라 ‘야훼’로 바로잡았으며, 말벌의 비유적 해석 가능성은 각주에만 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:38Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 야훼께서 ‘그들 가운데’ 말벌을 보내시며, 이스라엘 앞에서 남아 있는 자들과 숨어 있는 자들이 멸망할 때까지 그 일이 계속됨을 말합니다. 초안의 ‘보내셔서 … 멸망할 때까지 하실 것입니다’는 무엇을 ‘하실’ 것인지 불명확하고, ‘당신 앞에서’가 ‘남아 있는’에도 걸리는 듯한 구조가 되었습니다. 또한 יְהוָה는 영어 POB의 ‘Yahweh’ 결정과 일치하게 ‘야훼’로 옮기는 것이 적절합니다.
  naturalness: 수정문은 합쇼체를 유지하면서도 동사의 목적과 ‘~할 때까지’의 범위를 자연스럽고 분명하게 드러냅니다.
  terminology: הַצִּרְעָה는 본문에서 ‘말벌’로 유지하고, 비유적 가능성은 주석에 보존합니다. יְהוָה는 ‘야훼’, אֱלֹהֶיךָ는 ‘당신의 하나님’으로 옮깁니다.
  issues:
  - severity: high
    issue: 문장 종결부 ‘멸망할 때까지 하실 것입니다’가 의미상 불완전합니다.
    rationale: 히브리어의 동사는 ‘보내실 것이다’이며, ‘멸망할 때까지’는 그 행동의 지속/종점을 나타냅니다. 초안은 ‘하실 것입니다’의 내용을 제시하지 않아 한국어 문장으로 부자연스럽고 의미가 흐려집니다.
  - severity: medium
    issue: ‘당신 앞에서’의 수식 범위가 모호합니다.
    rationale: מִפָּנֶיךָ는 문맥상 특히 ‘숨어 있는 자들’, 곧 이스라엘 앞을 피해 숨는 자들을 수식합니다. 이를 ‘숨어 있는 자들’ 가까이에 두어 병렬 구조와 의미를 분명히 해야 합니다.
  - severity: medium
    issue: 신명 יְהוָה의 번역이 영어 POB의 ‘Yahweh’ 결정과 불일치합니다.
    rationale: 원문에 신명 יְהוָה가 직접 사용되었고 제공된 POB 결정도 이를 ‘Yahweh’로 번역합니다. 한국어에서도 음역 ‘야훼’를 사용하여 해당 결정을 반영합니다.
  - severity: low
    issue: 각주 ‘공포/패닉’은 현대 표준어 주석 문체로 다소 혼합되어 있습니다.
    rationale: ‘공포 또는 공황’으로 표현하면 현대 한국어 주석으로 더 자연스럽고, 해석 가능성도 과도하게 확정하지 않습니다.
