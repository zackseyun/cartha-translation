base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
  footnotes:
  - marker: a
    text: Or 'And you shall keep' or 'Therefore you shall keep'; the Hebrew conjunction can be read as simple coordination or as drawing an inference from the preceding verses.
    reason: lexical_alternative
  - marker: b
    text: '''Judgments'' may also be rendered ''ordinances'' or ''rules''; the Hebrew term refers to legal decisions or prescribed judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너는 오늘 내가 네게 명령하는 그 명령과 율례들과 규례들을 지키며, 그것들을 행해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러므로’는 앞 절들과의 결론적 연결을 반영한 번역입니다. 히브리어 접속사는 단순한 ‘그리고’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘규례들’은 히브리어 מִשְׁפָּטִים의 가능한 번역 가운데 하나입니다. 이 말은 ‘판결들’ 또는 ‘법적 결정들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  english_pob_choice: So you shall keep
  chosen_korean: 그러므로 너는 지켜야 합니다
  alternatives_korean:
  - 그리고 너는 지켜야 합니다
  - 너는 지켜야 합니다
  - 너는 지켜 지켜야 합니다
  lexicon: HALOT
  rationale: וְ의 문맥적 인과/결론 흐름을 살려 ‘그러므로’로 옮기고, שׁמר는 언약적 문맥에서 자연스러운 ‘지키다’로 번역했습니다.
- source_word: הַמִּצְוָה
  english_pob_choice: the commandment
  chosen_korean: 그 명령
  alternatives_korean:
  - 그 계명
  - 그 명령들
  - 그 명령사항
  lexicon: HALOT
  rationale: 단수 מִצְוָה의 형태를 유지하되, 현대 한국어에서 자연스러운 법·언약 문맥을 위해 ‘명령’으로 옮겼습니다.
- source_word: הַחֻקִּים / הַמִּשְׁפָּטִים
  english_pob_choice: the statutes and the judgments
  chosen_korean: 그 율례들과 그 규례들
  alternatives_korean:
  - 그 규례들과 그 판결들
  - 그 법규들과 그 판단들
  - 그 규정들과 그 법도들
  lexicon: HALOT
  rationale: 두 복수 법률 용어의 병렬을 한국어에서도 구분해 유지했습니다. חֻקִּים은 관례적으로 ‘율례’, מִשְׁפָּטִים은 법적 판단/규범의 뜻을 살린 ‘규례’로 옮겼습니다.
- source_word: לַעֲשׂוֹתָם
  english_pob_choice: to do them
  chosen_korean: 그것들을 행해야 합니다
  alternatives_korean:
  - 그것들을 해야 합니다
  - 그것들을 실천해야 합니다
  - 그것들을 지켜 행해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 순종 표현인 עשה를 ‘행하다’로 살렸고, 앞의 ‘지키다’와 구분되도록 결과적 의무를 자연스럽게 풀었습니다.
theological_decisions:
- issue: 언약적 법 조항의 삼중 병렬을 한국어에서 어떻게 유지할지
  chosen_reading: ‘명령’—‘율례들’—‘규례들’의 삼중 구조를 분명히 보존했습니다.
  alternative_readings:
  - ‘계명’—‘율법’—‘법도’처럼 전통적 교회 용어로 묶는 방식
  - 세 항목을 ‘법’ 하나로 단순화하는 방식
  rationale: 이 절은 서로 겹치지만 구별되는 법적 용어를 누적해 언약적 무게를 더합니다. 한국어에서도 각각을 따로 살려야 히브리어의 수사적 압력이 보존됩니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
