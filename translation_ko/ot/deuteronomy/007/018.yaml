  source_fidelity: 수정이 필요합니다. 초안의 ‘바로 그분들을 위해’는 히브리어 본문에 없는 요소이며, מֵהֶם(그들을)과 לְפַרְעֹה וּלְכָל מִצְרַיִם(파라오와 온 이집트에/에게)의 대상 관계를 혼동합니다. 이를 삭제하고 야훼께서 파라오와 온 이집트에 행하신 일을 기억하라는 구조로 바로잡아야 합니다.
  naturalness: ‘그들을 두려워하지 마십시오’와 ‘반드시 기억하십시오’는 현대 표준어 합쇼체로 자연스럽고, 권면·명령의 어조도 적절합니다. ‘온 이집트에 행하신 일’은 집합적으로 가리킨 מִצְרַיִם을 자연스럽게 보존합니다.
  terminology: יְהוָה는 POB 방침에 따라 ‘야훼’로 유지하고, אֱלֹהֶיךָ는 ‘당신의 하나님’으로 옮깁니다. 파라오와 이집트에 대한 행위는 본문이 구체적으로 규정하지 않으므로 ‘행하신 일’로 중립적으로 유지합니다.
