  rationale: 출애굽의 구원 행위를 떠올리게 하는 본문에서 고유한 언약 이름을 드러내는 것이 본문의 의도에 더 직접적입니다. '주님'으로 대체하면 명칭과 호칭의 구분이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
