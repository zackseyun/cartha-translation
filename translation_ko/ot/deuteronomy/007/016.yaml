  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
  footnotes:
  - marker: a
    text: Or 'you shall eat up' or 'you shall destroy.' The Hebrew verb literally means 'eat/consume' and is used here idiomatically of total defeat.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall not pity them.' Literally, 'your eye shall not spare them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for it is a snare to you.' The Hebrew pronoun may refer generally to the idolatrous situation, though the most immediate sense is serving their gods.
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 야훼 너희 하나님이 너희에게 주시는 모든 민족을 멸하십시오[a]. 그들을 불쌍히 여기지 말고[b], 그들의 신들을 섬기지도 마십시오. 그것은 너희에게 올무가 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹어 치워라’, ‘멸하라’. 히브리어 동사는 문자적으로는 ‘먹다/삼키다’를 뜻하지만, 여기서는 관용적으로 완전한 패배를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 불쌍히 여기지 말라’. 문자적으로는 ‘너희의 눈이 그들을 아끼지 말라’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것은 너희에게 올무가 된다’. 히브리어 대명사는 우상 섬김의 상황 전체를 가리킬 수도 있으나, 가장 직접적인 뜻은 그들의 신들을 섬기는 행위입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  english_pob_choice: you shall consume
  chosen_korean: 멸하십시오
  alternatives_korean:
  - 삼키십시오
  - 잡아먹으십시오
  - 소멸시키십시오
  lexicon: HALOT
  rationale: 전쟁/심판 문맥의 אכל은 단순 섭식보다 ‘완전히 없애다’는 관용적 의미를 띠므로, 한국어에서는 그 효과를 자연스럽게 드러내는 ‘멸하다’가 가장 적합합니다.
- source_word: כָּל הָעַמִּים
  english_pob_choice: all the peoples
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 민족들
  - 모든 사람들
  lexicon: HALOT
  rationale: עַמִּים의 복수는 개별 집단들을 가리키므로 ‘백성’이 문맥상 가장 가까우며, ‘모든’으로 포괄성을 유지했습니다.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  english_pob_choice: Your eye shall not spare them
  chosen_korean: 그들을 불쌍히 여기지 말고
  alternatives_korean:
  - 눈길을 주어 아끼지 말고
  - 그들을 불쌍히 보지 말고
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘눈이 아끼지 않다’이지만, 한국어에서는 의미를 자연스럽게 살려 ‘불쌍히 여기지 말고’로 옮기되, 무자비한 요구의 강도를 유지했습니다.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  english_pob_choice: and you shall not serve their gods
  chosen_korean: 그들의 신들을 섬기지도 마십시오
  alternatives_korean:
  - 그들의 신들을 예배하지도 마십시오
  - 그들의 신들을 섬기지 마십시오
  lexicon: HALOT
  rationale: עבד는 단순한 예배 행위보다 충성적 섬김을 포함하므로, 전통적이지만 범위가 좁은 ‘예배’보다 ‘섬기다’가 원문을 더 잘 보존합니다.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  english_pob_choice: for that would be a snare to you
  chosen_korean: 그것은 너희에게 올무가 될 것입니다
  alternatives_korean:
  - 그것은 너희에게 함정이 될 것입니다
  - 그것은 너희에게 덫이 될 것입니다
  lexicon: HALOT
  rationale: מוֹקֵשׁ은 ‘덫/올무’ 계열의 비유이므로, 한국어에서 관용성과 이미지가 모두 살아 있는 ‘올무’를 채택했습니다. 대명사 해석은 문맥상 우상 섬김의 결과를 가리키는 것으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용하여 고유한 신명을 보존했습니다.
theological_decisions:
- issue: 명령문의 강도와 윤리적 충격을 완화할지 여부
  chosen_reading: 본문의 전쟁-심판 명령을 직접적으로 살려 ‘멸하십시오’와 ‘불쌍히 여기지 말고’를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘물리치십시오’ 또는 ‘제거하십시오’로 약화
  - ‘아끼지 말고’처럼 더 직역적으로 유지
  rationale: 원문은 적대 집단에 대한 총체적 배제를 요구하는 강한 언어를 사용하므로, 이를 순화하면 저자의 의도와 신학적 긴장이 약화됩니다. 한국어도 그 긴장을 보존해야 합니다.
  doctrine_reference: Source-directed rendering; preserve lexical/theological tension
- issue: ‘그들의 신들’을 ‘예배하다’로 좁힐지 여부
  chosen_reading: ‘섬기다’로 두어 우상 숭배와 언약적 충성을 함께 포괄했습니다.
  alternative_readings:
  - ‘예배하다’로 제한
  - ‘경배하다’로 표현
  rationale: 히브리어 עבד는 단지 예식 행위보다 삶 전체의 종속과 봉사를 포함하므로, ‘섬기다’가 문맥의 우상 숭배 경고를 더 넓고 정확하게 전달합니다.
  doctrine_reference: Lexical scope of עבד in covenantal contexts
