source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
  footnotes:
  - marker: a
    text: Or 'and know' or 'so know'; the Hebrew conjunction can be read as simple continuation or as an inference from the preceding context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew חֶסֶד; often rendered 'steadfast love,' with nuances of covenant loyalty, lovingkindness, or mercy.
    reason: lexical_alternative
  - marker: c
    text: Or 'for a thousand generations.' The expression denotes enduring covenant faithfulness across an immense span.
    reason: lexical_alternative
  - marker: d
    text: Or 'to those who love him and to those who keep his commandments, to a thousand generations'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 당신의 하나님이신 야훼께서 바로 하나님이시며 신실하신 하나님이심을 알아 두십시오.[a] 그분은 그분을 사랑하는 사람들과 그분의 계명을 지키는 사람들에게 언약을 지키시고 한결같은 사랑을 베푸시되,[b][d] 천 세대까지 그렇게 하십니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러므로’는 앞 문맥에서 이끌어 낸 결론을 드러낸 번역입니다. 히브리어 접속사 וְ는 단순히 ‘그리고’로, 또는 ‘그러므로/그래서’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד는 ‘한결같은 사랑’으로 옮겼습니다. 문맥에 따라 ‘인애’, ‘언약적 충성’, ‘자비’ 등으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘천 세대까지’입니다. 이는 하나님의 언약적 신실하심이 매우 오랜 세대에 걸쳐 지속됨을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 어순상 ‘천 세대까지’는 하나님께서 언약과 한결같은 사랑을 지키시는 기간을 나타내며, 앞의 ‘그분을 사랑하는 사람들과 그분의 계명을 지키는 사람들에게’라는 구절 전체와 연결하여 이해할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: Know, therefore
  chosen_korean: 그러므로 너는 ... 알아야 합니다
  alternatives_korean:
  - 그리고 알아야 합니다
  - 그래서 알아야 합니다
  lexicon: WLC/WIVU
  rationale: 앞 절에서 이어지는 귀결을 살리기 위해 접속사 וְ를 단순한 ‘그리고’가 아니라 결론 표지 ‘그러므로’로 옮겼고, 2인칭 단수 완료형의 권고적 힘은 ‘알아야 합니다’로 자연스럽게 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본값에 따라 언약적 신명은 학술적 음역인 ‘야훼’로 옮겨, 전통 교회 용례보다 원문 표지성을 유지했습니다.
- source_word: הַנֶּאֱמָן
  english_pob_choice: faithful
  chosen_korean: 신실하신
  alternatives_korean:
  - 신뢰할 만한
  - 신실한
  lexicon: HALOT
  rationale: 언약 문맥에서 ‘faithful’은 단순한 성격 묘사보다 언약에 대한 변함없는 신실성을 가리키므로, 하나님께 대한 존칭을 반영해 ‘신실하신’으로 옮겼습니다.
- source_word: הַבְּרִית וְהַחֶסֶד
  english_pob_choice: the covenant and the steadfast love
  chosen_korean: 언약과 사랑
  alternatives_korean:
  - 언약과 한결같은 사랑
  - 언약과 인애
  lexicon: HALOT
  rationale: חֶסֶד는 문맥상 언약적 충성과 사랑의 중첩 의미를 가지지만, 한국어에서 과도하게 해설적이지 않게 하면서도 의미 범위를 남기기 위해 기본 텍스트는 ‘사랑’으로 두었습니다.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  english_pob_choice: for those who love him and for those who keep his commandments
  chosen_korean: 자기를 사랑하는 사람들과 자기 계명을 지키는 사람들에게
  alternatives_korean:
  - 그를 사랑하는 이들과 그의 계명을 지키는 이들에게
  - 자기를 사랑하며 자기 계명을 지키는 사람들에게
  lexicon: WLC
  rationale: לְ의 수혜자 용법을 살려 ‘~에게/들에게’로 구분했고, 병렬 구조를 한국어에서도 유지했습니다. 2인칭에서 3인칭으로 넘어가는 대상 지시를 자연스럽게 풀어 ‘자기/그분’을 사용했습니다.
- source_word: לְאֶלֶף דּוֹר
  english_pob_choice: to a thousand generations
  chosen_korean: 천 대에 이르기까지
  alternatives_korean:
  - 천 세대에 이르기까지
  - 천 대까지
  lexicon: HALOT
  rationale: 관용적 과장 표현을 한국어로 자연스럽게 전달하기 위해 직역형 ‘천 세대’보다 문맥상 지속 기간을 살리는 ‘천 대에 이르기까지’를 택했습니다.
theological_decisions:
- issue: חֶסֶד의 번역 범위
  chosen_reading: ‘사랑’으로 기본 번역하되, 언약적 충성과 지속성을 문장 전체에서 보존합니다.
  alternative_readings:
  - 한결같은 사랑
  - 인애
  - 언약적 사랑
  rationale: 이 절은 하늘 추상어보다 하나님이 언약에 대해 보이시는 실제적 태도를 강조하므로, 지나치게 교리화된 용어보다 본문이 요구하는 관계적 의미를 직접적으로 드러냈습니다.
  doctrine_reference: 언약 신학; 번역 철학 §3
- issue: ‘그분이 하나님이시며’의 강조
  chosen_reading: הוּא הָאֱלֹהִים의 강조를 ‘그분이 하나님이시며’로 살려 유일신 고백의 힘을 유지합니다.
  alternative_readings:
  - 그분은 하나님이십니다
  - 그분이 바로 하나님이십니다
  rationale: 히브리어의 대명사 강조를 반영해 단순 서술보다 고백적 확증을 강화했으며, 두 번의 ‘하나님’ 반복은 본문의 강조를 충분히 전달합니다.
  doctrine_reference: 신명기적 유일신 고백
