source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
  footnotes:
  - marker: a
    text: Literally, 'before you.' The phrase here means that the LORD will place these enemies into your power.
    reason: lexical_alternative
  - marker: b
    text: Or 'great panic' or 'great tumult.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼 당신들의 하나님께서 그들을 당신들 앞에 넘기시고, 그들이 멸망할 때까지 큰 혼란에 빠뜨리실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '당신들 앞에'입니다. 여기서는 적들을 당신들의 권세 아래 두신다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''큰 혼란''은 ''큰 공포'' 또는 ''큰 소동''으로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 여호와 당신들의 하나님
  - 야훼 너의 하나님
  lexicon: HALOT
  rationale: 이 절은 언약의 신적 이름 יְהוָה를 직접 사용하므로 POB의 원칙을 따라 '야훼'로 옮겼고, 복수 مخاط수에 맞게 '당신들의 하나님'으로 자연스럽게 처리했습니다.
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  english_pob_choice: will give them over to you
  chosen_korean: 그들을 당신들 앞에 넘기시고
  alternatives_korean:
  - 그들을 당신들께 넘기시고
  - 그들을 당신들 손에 넘기시고
  - 그들을 당신들 앞에 두시고
  lexicon: HALOT
  rationale: נתן과 '앞에'는 단순히 주다보다 적에게 넘어가게 하여 지배 아래 두는 의미이므로, 군사적 함의를 살려 '넘기시고'로 옮겼습니다. '앞에'는 원문 이미지를 보존합니다.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  english_pob_choice: throw them into great confusion
  chosen_korean: 큰 혼란에 빠뜨리실 것입니다
  alternatives_korean:
  - 큰 공포에 빠뜨리실 것입니다
  - 큰 소동에 빠뜨리실 것입니다
  - 크게 혼란케 하실 것입니다
  lexicon: HALOT
  rationale: המם과 명사 מְהוּמָה는 전쟁 맥락에서 공포, 혼란, 소동을 뜻하므로, 동사와 명사를 한 자연스러운 표현으로 묶어 '큰 혼란에 빠뜨리실 것입니다'로 옮겼습니다.
- source_word: עַד הִשָּׁמְדָם
  english_pob_choice: until they are destroyed
  chosen_korean: 그들이 멸망할 때까지
  alternatives_korean:
  - 그들이 파멸할 때까지
  - 그들이 완전히 멸절될 때까지
  - 그들이 소멸될 때까지
  lexicon: HALOT
  rationale: שׁמד의 결과 상태를 한국어에서는 자연스럽게 '멸망하다'로 옮겨, 완료될 때까지라는 종결 의미를 분명히 했습니다.
theological_decisions:
- issue: 신적 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 하나님의 고유명으로서, 대체 칭호가 아니라 이름 자체를 드러내는 '야훼'를 유지하는 것이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
