  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
  footnotes:
  - marker: a
    text: Or "a treasured possession for himself." The Hebrew says literally "a people of treasured possession," combining the ideas of a people and a specially valued possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신이 야훼, 당신의 하나님께 속한 거룩한 백성이기 때문입니다. 야훼, 당신의 하나님께서는 땅 위에 있는 모든 민족 가운데서 당신을 택하셔서, 자신을 위한 특별한 소유가 될 백성[a]이 되게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자신의 보배로운 소유가 될 백성.” 히브리어는 문자적으로 “특별한 소유의 백성”으로, 백성과 특별히 귀하게 여겨지는 소유라는 두 뜻을 함께 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם קָדוֹשׁ
  english_pob_choice: a holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 거룩한 사람들
  - 성스러운 백성
  lexicon: HALOT
  rationale: ‘עַם’은 집단/백성을 가리키므로 ‘백성’이 자연스럽고, ‘קָדוֹשׁ’는 언약적으로 구별된 상태를 나타내어 ‘거룩한’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학문적 음역인 ‘야훼’로 옮겼습니다.
- source_word: לְעַם סְגֻלָּה
  english_pob_choice: a treasured people
  chosen_korean: 소중한 백성
  alternatives_korean:
  - 보배로운 백성
  - 귀한 소유 백성
  - 보배로운 소유
  lexicon: HALOT
  rationale: ‘סְגֻלָּה’는 특별히 귀하게 여겨지는 소유의 뉘앙스를 가지지만, 여기서는 ‘עַם’이 분명하므로 ‘백성’을 살리면서 가치 강조를 위해 ‘소중한’으로 옮겼습니다.
- source_word: מִכֹּל הָעַמִּים
  english_pob_choice: from all the peoples
  chosen_korean: 모든 민족 가운데서
  alternatives_korean:
  - 모든 민족들 중에서
  - 모든 백성들 가운데서
  lexicon: HALOT
  rationale: 전치사 מִן은 비교 우위가 아니라 선택의 출처를 표시하므로, 선민 사상을 과도하게 덧붙이지 않도록 ‘가운데서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 선택 표현과 우월성 함의
  chosen_reading: ‘모든 민족 가운데서 당신을 선택하여’로 옮겨, 선택의 사실은 분명히 하되 내재적 우월성 판단은 덧붙이지 않았습니다.
  alternative_readings:
  - 모든 민족들보다 택하여
  - 모든 민족 위에 세워
  rationale: 본문은 선택의 근거와 범위를 말할 뿐, 다른 민족보다 본질적으로 우월하다고 단정하지 않습니다. 따라서 선택 언어의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
