base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
  footnotes:
  - marker: a
    text: Or 'to your ancestors.' The Hebrew reads 'to your fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 여러분을 사랑하시고, 복을 주시며, 번성하게 하실 것입니다. 그는 여러분의 태의 열매와 땅의 열매—곧 여러분의 곡식과 새 포도주와 기름, 소 떼의 새끼와 양 떼의 새끼들—에게 복을 주실 것입니다. 이것은 그가 여러분의 조상들에게[a] 여러분에게 주겠다고 맹세하신 땅에서 이루어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분의 아버지들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  english_pob_choice: He will love you
  chosen_korean: 사랑하시고
  alternatives_korean:
  - 사랑할 것이며
  - 사랑하실 것이며
  lexicon: HALOT
  rationale: 언약적 사랑의 뜻을 살리되, 한국어에서는 뒤의 축복 동사들과 자연스럽게 이어지도록 연결형으로 처리했습니다.
- source_word: וּבֵרַכְךָ
  english_pob_choice: bless you
  chosen_korean: 복 주시며
  alternatives_korean:
  - 축복하시며
  - 복을 주시며
  lexicon: HALOT
  rationale: ברך의 기본 의미를 직접 살려 ‘복 주다’로 옮겼습니다.
- source_word: פְּרִי בִטְנְךָ
  english_pob_choice: the fruit of your womb
  chosen_korean: 태의 열매
  alternatives_korean:
  - 배의 열매
  - 몸의 열매
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역하되, 생식의 축복이라는 구체성을 유지했습니다.
- source_word: שְׁגַר אֲלָפֶיךָ
  english_pob_choice: the offspring of your herds
  chosen_korean: 소 떼의 새끼
  alternatives_korean:
  - 가축 떼의 새끼
  - 떼의 새끼
  lexicon: HALOT
  rationale: 영어 POB가 복수의 무리들을 반영하므로 한국어도 소유격 단수보다 ‘소 떼’로 자연스럽게 옮겼습니다.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  english_pob_choice: the young of your flock
  chosen_korean: 양 떼의 어린 것들
  alternatives_korean:
  - 양 떼의 새끼
  - 양 떼의 새끼들
  lexicon: HALOT
  rationale: 어색한 직역보다 목축 축복의 의미가 드러나는 자연스러운 표현을 택했습니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 여러분의 조상들에게
  alternatives_korean:
  - 여러분의 아버지들에게
  - 여러분의 조부들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 약속 전승의 대상을 한국어로는 문맥상 ‘조상들’이 가장 분명합니다.
theological_decisions:
- issue: ‘fathers’의 성별 보존 여부
  chosen_reading: ‘아버지들’의 직역보다 문맥상 ‘조상들’로 옮겼습니다.
  alternative_readings:
  - 여러분의 아버지들에게
  - 여러분의 선조들에게
  rationale: 이 구절은 언약 약속의 계승을 가리키므로, 한국어 독자에게는 혈통 조상이라는 의미가 분명한 표현이 더 오해가 적습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
