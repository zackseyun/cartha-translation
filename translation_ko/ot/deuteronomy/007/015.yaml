id: DEU.7.15
reference: Deuteronomy 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
  footnotes:
  - marker: a
    text: Or 'the harmful/grievous diseases of Egypt.' The Hebrew adjective can denote what is bad, evil, harmful, or grievous.
    reason: lexical_alternative
  - marker: b
    text: Or 'that you experienced.' The Hebrew 'known' may carry experiential force here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신에게서 모든 질병을 제거하실 것입니다[a]. 또한 당신이 알았던[b] 이집트의 모든 악한 질병도 당신에게 내리지 않으실 것입니다. 오히려 그것들을 당신을 미워하는 모든 사람에게 내리실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '해로운/심한 질병'입니다. 히브리어 형용사는 나쁨, 악함, 해로움, 심함의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신이 경험했던'입니다. 히브리어 '알다'는 여기서 경험적 의미를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC/HALOT
  rationale: יהוה의 고유명칭을 관습적 대체어인 '주님'으로 바꾸지 않고, POB의 원칙대로 음역해 신적 이름을 보존했습니다.
- source_word: וְהֵסִיר
  english_pob_choice: will remove
  chosen_korean: 제거하실 것입니다
  alternatives_korean:
  - 없애실 것입니다
  - 치워 버리실 것입니다
  lexicon: HALOT
  rationale: 히필형 סור의 원인적 의미를 살려, 질병을 '멀리 보내다'는 뜻보다 분명한 '제거하다'로 옮겼습니다.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  english_pob_choice: the evil diseases of Egypt
  chosen_korean: 이집트의 모든 악한 질병
  alternatives_korean:
  - 이집트의 모든 해로운 질병
  - 이집트의 모든 grievous 질병
  lexicon: HALOT
  rationale: הָרָעִים의 '악한/해로운/심한' 뉘앙스를 직역에 가깝게 살리되, 한국어로는 자연스러운 '악한 질병'을 택했습니다.
- source_word: אֲשֶׁר יָדַעְתָּ
  english_pob_choice: that you have known
  chosen_korean: 당신이 알았던
  alternatives_korean:
  - 당신이 알게 된
  - 당신이 경험했던
  lexicon: HALOT
  rationale: יָדַע의 인식적 의미를 유지하면서도, 이 맥락에서 가능한 경험적 함의를 과도하게 해석하지 않도록 중립적으로 옮겼습니다.
- source_word: לֹא יְשִׂימָם בָּךְ / וּנְתָנָם
  english_pob_choice: will he put on you / he will put them on
  chosen_korean: 당신에게 내리지 않으실 것입니다 / 그것들을 ...에게 내리실 것입니다
  alternatives_korean:
  - 당신 위에 두지 않으실 것입니다 / 그것들을 ... 위에 두실 것입니다
  - 당신에게 놓지 않으실 것입니다 / 그것들을 ...에게 놓으실 것입니다
  lexicon: HALOT
  rationale: 질병을 사람 '위에 놓다'는 히브리어 관용을 한국어에서 가장 자연스럽게 살릴 수 있는 동사로 '내리다'를 선택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 고유명칭을 '야훼'로 음역해 본문에서 직접 드러나게 했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신적 칭호가 아니라 언약적 이름 יהוה를 사용하므로, POB의 표준에 따라 대체 번역을 피하고 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: 질병 보호 약속의 범위
  chosen_reading: 언약적 보호 약속으로 읽되, 보편적 무병 교리로 확대하지 않았습니다.
  alternative_readings:
  - 모든 상황에서의 개인적 무병 보장
  - 비육체적 고난에 대한 은유
  rationale: 히브리어는 이집트의 질병들을 구체적으로 말하므로, 본문의 직접 의미를 유지하면서 교리적 과장을 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Never import doctrinal claims the text does not make; preserve the source text''s plain sense'
