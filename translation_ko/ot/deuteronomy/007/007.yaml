language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
  footnotes:
  - marker: a
    text: Or, 'set his love on you.' The Hebrew verb conveys strong attachment or affection.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러 민족보다 너희가 더 많아서 야훼께서 너희에게 마음을 두시고 너희를 택하신 것이 아닙니다[a]. 너희는 모든 민족 가운데서 가장 적은 수였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게 사랑을 두셨다.’ 히브리어 동사는 강한 애착이나 애정을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא מֵרֻבְּכֶם מִכָּל הָעַמִּים
  english_pob_choice: It was not because you were more numerous than all the peoples
  chosen_korean: 여러 민족보다 너희가 더 많아서…가 아닙니다 / 너희는 모든 민족 가운데서 가장 적은 수였습니다
  alternatives_korean:
  - 너희가 모든 민족보다 수가 많아서…가 아닙니다
  - 너희가 다른 모든 민족보다 많아서…가 아닙니다
  lexicon: HALOT
  rationale: 부정어 לֹא와 비교 구문이 원인 부정을 이루므로, 한국어에서는 ‘…해서가 아닙니다’로 인과를 살리고, מֵרֻבְּכֶם과 מִכָּל הָעַמִּים의 비교는 ‘여러 민족보다…더 많아서’로 자연스럽게 옮겼습니다.
- source_word: חָשַׁק
  english_pob_choice: set his affection on
  chosen_korean: 마음을 두시고
  alternatives_korean:
  - 사랑을 두시고
  - 애정을 두시고
  - 붙드시고
  lexicon: HALOT
  rationale: חָשַׁק은 강한 애착·선호를 뜻하므로, 한국어에서는 관계적 선택의 뉘앙스를 살리는 ‘마음을 두시고’를 택했습니다. ‘사랑을 두시고’도 가능하지만 문맥의 선택성과 애착을 함께 드러내는 표현으로 보았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 원문의 하나님의 이름 יְהוָה를 보존하기 위해 관용적 대체칭호 대신 음역형 ‘야훼’를 사용했습니다.
- source_word: וַיִּבְחַר
  english_pob_choice: and chose
  chosen_korean: 택하신
  alternatives_korean:
  - 선택하신
  - 고르신
  lexicon: HALOT
  rationale: 언약 문맥의 בחר는 ‘택하다’가 가장 안정적으로 대응하므로, 신학적·어휘적 연속성을 살려 ‘택하신’으로 옮겼습니다.
- source_word: הַמְעַט
  english_pob_choice: the fewest
  chosen_korean: 가장 적은 수
  alternatives_korean:
  - 가장 적었습니다
  - 가장 수가 적었습니다
  - 가장 미미했습니다
  lexicon: HALOT
  rationale: 형태상 단수이지만 집합의 수적 적음을 나타내므로, 한국어에서는 자연스럽게 ‘가장 적은 수’로 옮겨 비교 대조를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 한국어로 어떻게 드러낼지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 여호와 대체칭호가 아니라 언약의 고유명 יְהוָה를 직접 사용하므로, 이를 가리는 번역보다 이름 자체를 드러내는 ‘야훼’가 원문의 효과를 더 충실히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 선택 언어를 교리적으로 과도하게 확장할지 여부
  chosen_reading: 너희를 택하신
  alternative_readings:
  - 너희를 예정하신
  - 너희를 구별하여 택하신
  rationale: 본문은 이스라엘을 향한 야훼의 선택을 말할 뿐이므로, 체계신학적 용어를 덧붙이지 않고 본문 수준의 언어인 ‘택하신’만 유지했습니다.
  doctrine_reference: 'Translation philosophy #3'
