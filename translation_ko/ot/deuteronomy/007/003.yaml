base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
  footnotes:
  - marker: a
    text: Or, more formally, 'you shall not make marriages with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 혼인 관계를 맺지[a] 마십시오. 당신의 딸을 그의 아들에게 주지 말고, 그의 딸을 당신의 아들의 아내로 맞아들이지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 혼인하지 마십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִתְחַתֵּן
  english_pob_choice: intermarry
  chosen_korean: 혼인 관계를 맺다
  alternatives_korean:
  - 서로 결혼하다
  - 혼인하다
  lexicon: HALOT
  rationale: 히트파엘 형태는 단순히 ‘결혼하다’보다 상호적·관계적 결합을 가리키므로, 한국어에서는 직역보다 ‘혼인 관계를 맺다’가 그 사회적 금지를 더 정확히 드러냅니다.
- source_word: בָּם
  english_pob_choice: with them
  chosen_korean: 그들과
  alternatives_korean:
  - 그들 가운데서
  - 그들과 함께
  lexicon: HALOT
  rationale: 바가 붙은 3인칭 복수는 앞선 민족들을 가리키므로, 혼인 금지의 대상 관계를 가장 자연스럽게 보이도록 ‘그들과’로 옮겼습니다.
- source_word: תִתֵּן / תִקַּח
  english_pob_choice: give / take
  chosen_korean: 주어서는 안 되고 / 데려와서도 안 됩니다
  alternatives_korean:
  - 주어서는 안 되고 / 취해서도 안 됩니다
  - 주어서는 안 되고 / 데려가서도 안 됩니다
  lexicon: HALOT
  rationale: 히브리어는 ‘주다’와 ‘취하다’의 기본 동사를 유지하며 혼인 맥락으로 이해시키므로, 한국어도 동사 자체를 살리되 ‘데려오다’로만 옮겨 문맥상 아내를 들이는 의미를 분명히 했습니다.
theological_decisions:
- issue: 혼인 금지의 범위와 이유를 본절에 어디까지 반영할지
  chosen_reading: 본절 자체의 금지 명령만 드러내고, 다음 절의 신학적 이유는 덧붙이지 않았습니다.
  alternative_readings:
  - 언약적 순결을 해치는 이방 혼인 전반의 금지로 확대 설명
  - 민족적 배타로 읽히도록 단순화
  rationale: 히브리어 본문은 여기서 특정 민족들과의 혼인 금지를 명령할 뿐이므로, 본절이 말하지 않는 동기나 범위를 번역문에 미리 주입하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
