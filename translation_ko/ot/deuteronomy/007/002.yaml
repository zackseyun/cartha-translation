source:
  edition: WLC
  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
  footnotes:
  - marker: a
    text: Or, 'you shall surely put them under the ban.' The Hebrew uses the verb חרם with an intensifying construction, denoting total devotion to destruction.
    reason: lexical_alternative
  - marker: b
    text: Or, 'show them no mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신의 하나님께서 그들을 당신 앞에 넘겨 주시고, 당신이 그들을 치면, 당신은 그들을 완전히 진멸해야 합니다. 그들과 언약을 맺어서는 안 되며, 그들에게 은혜를 베풀어서도 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 앞에’로도 옮길 수 있습니다. 히브리어 לְפָנֶיךָ는 직역하면 ‘당신 앞에’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들에게 은혜를 베풀다’는 히브리어 חנן의 기본 의미를 반영한 표현입니다. 문맥상으로는 ‘그들에게 호의를 보여서도 안 됩니다’ 또는 ‘그들을 불쌍히 여겨서도 안 됩니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם / יְהוָה אֱלֹהֶיךָ
  english_pob_choice: gives them over to you
  chosen_korean: 그들을 당신 앞에 넘겨 주시고
  alternatives_korean:
  - 그들을 당신에게 넘겨 주시고
  - 그들을 당신 손에 넘겨 주시고
  lexicon: HALOT
  rationale: נתן의 전쟁 문맥상 ‘넘겨 주다’가 자연스럽고, לְפָנֶיךָ의 ‘before you’는 ‘당신 앞에’로 옮겨 하나님이 적을 당신의 처분 아래 두신다는 뜻을 드러냅니다.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  english_pob_choice: you shall utterly devote them to destruction
  chosen_korean: 그들을 완전히 진멸해야 합니다
  alternatives_korean:
  - 그들을 전적으로 진멸해야 합니다
  - 그들을 완전히 바쳐 멸해야 합니다
  lexicon: HALOT
  rationale: חרם의 핵심은 단순한 전멸이 아니라 전면적 ‘진멸/바침’인데, 한국어에서 ‘완전히 진멸하다’가 그 강도를 가장 직접적으로 전달하면서도 현대 독자에게 읽히는 표현입니다.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  english_pob_choice: You shall make no covenant with them
  chosen_korean: 그들과 언약을 맺어서는 안 되며
  alternatives_korean:
  - 그들과 언약을 세워서는 안 되며
  - 그들과 조약을 맺어서는 안 되며
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 ‘언약을 맺다’로 옮겨, 성경적 관계 설정 금지라는 의미를 그대로 살렸습니다.
- source_word: וְלֹא תְחָנֵּם
  english_pob_choice: show them no favor
  chosen_korean: 그들에게 은혜를 베풀어서도 안 됩니다
  alternatives_korean:
  - 그들에게 호의를 보여서도 안 됩니다
  - 그들에게 불쌍히 여겨서도 안 됩니다
  lexicon: HALOT
  rationale: חנן은 ‘호의/은혜를 베풀다’의 뜻이므로, 본문이 요구하는 거절의 강도를 살리기 위해 ‘은혜를 베풀다’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: חרם의 한국어 표상
  chosen_reading: ‘완전히 진멸하다’로 옮겨 חרם의 총체성과 제의적 무게를 함께 드러냈습니다.
  alternative_readings:
  - ‘저주 아래 두다’
  - ‘전적으로 멸절하다’
  - ‘바쳐 진멸하다’
  rationale: 본문의 חרם은 단순 군사적 승리가 아니라 하나님께 전적으로 속하게 하여 제거하는 개념이므로, 너무 완화된 표현이나 설명적 의역을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 5
