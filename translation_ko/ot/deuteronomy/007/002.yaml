revisions:
- from: 야훼 당신의 하나님께서 그들을 당신 앞에 넘겨 주시고, 당신이 그들을 치면, 당신은 그들을 완전히 진멸해야 합니다. 그들과 언약을 맺어서는 안 되며, 그들에게 은혜를 베풀어서도 안 됩니다.[a][b]
  to: 당신의 하나님 야훼께서 그들을 당신 앞에 넘겨주셔서 당신이 그들을 치실 때, 당신은 그들을 온전히 바쳐 진멸해야 합니다.[a] 그들과 언약을 맺어서는 안 되며, 그들에게 호의를 보여서도 안 됩니다.[b]
  rationale: 수정문은 נתן의 군사 문맥상 ‘넘겨주다’, נכה의 군사적 의미인 ‘치다’, כרת ברית의 관용 표현인 ‘언약을 맺다’를 유지합니다. חרם은 ‘온전히 바쳐 진멸하다’로 옮기고 각주에서 가능한 번역을 제시하여 원문의 제의적 의미와 강조를 보존했습니다. תְחָנֵּם은 현대 한국어에 자연스러운 ‘호의를 보이다’로 옮기되 ‘자비’라는 문맥상 가능한 대안을 각주로 남겼습니다. 각주 앵커도 각각 실제로 설명하는 어구 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:36Z'
