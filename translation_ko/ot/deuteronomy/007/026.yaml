base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
  footnotes:
  - marker: a
    text: Or 'under the ban'; traditionally, 'accursed.' The Hebrew term refers to something devoted to destruction under divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 가증한 것을 네 집으로 들이지 말아야 합니다. 그것처럼 너도 멸망에 바쳐진 존재가 될까 봐 두렵습니다. 너는 그것을 반드시 혐오해야 하고 반드시 역겨워해야 하니, 그것은 멸망에 바쳐진 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '멸망에 바쳐진'. 히브리어 חֵרֶם은 하나님의 심판 아래 멸망에 넘겨진 대상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֵבָה
  english_pob_choice: abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 가증물
  - 혐오스러운 것
  lexicon: HALOT
  rationale: 우상적·의례적으로 혐오스러운 대상을 가리키는 강한 어휘이므로, 한국어에서도 의미를 약화시키지 않는 '가증한 것'을 택했습니다.
- source_word: בֵּיתֶךָ
  english_pob_choice: your house
  chosen_korean: 네 집
  alternatives_korean:
  - 네 가정
  - 네 집안
  lexicon: HALOT
  rationale: 본문의 구체적 이미지인 '집'을 살리되, 현대 한국어에서 직접적인 금지 명령의 어조를 유지하기 위해 '네 집'으로 옮겼습니다.
- source_word: חֵרֶם
  english_pob_choice: devoted to destruction
  chosen_korean: 멸망에 바쳐진
  alternatives_korean:
  - 진멸에 바쳐진
  - 저주 아래 놓인
  lexicon: HALOT
  rationale: POB의 핵심 용례인 'devoted to destruction'을 따라, 단순한 저주보다 하나님의 심판 아래 멸망에 넘겨진 상태를 드러내는 표현으로 옮겼습니다.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ / וְתַעֵב תְּתַעֲבֶנּוּ
  english_pob_choice: You shall utterly detest it / and utterly abhor it
  chosen_korean: 반드시 혐오해야 하고 반드시 역겨워해야
  alternatives_korean:
  - 철저히 혐오해야 하고 철저히 역겨워해야
  - 반드시 가증히 여겨야 하고 반드시 미워해야
  lexicon: HALOT
  rationale: 히브리어의 강조형 반복을 한국어의 '반드시'로 살리면서, 두 동사를 구분해 병렬의 힘을 보존했습니다.
theological_decisions:
- issue: חֵרֶם의 신학적 함의
  chosen_reading: '''멸망에 바쳐진''으로 일관되게 번역해, 우상적 대상이 하나님의 심판 아래 놓인 상태를 드러냈습니다.'
  alternative_readings:
  - '''저주받은'''
  - '''진멸당할 것인'''
  rationale: 이 표현은 단순한 감정적 혐오가 아니라, 그 대상과 접촉한 사람까지 같은 심판 범주에 들어갈 수 있음을 경고합니다. 따라서 전통적 '저주받은'보다 심판-진멸의 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
