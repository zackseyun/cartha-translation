revisions:
- from: 그리고 너는 가증한 것을 네 집으로 들이지 말아야 합니다. 그것처럼 너도 멸망에 바쳐진 존재가 될까 봐 두렵습니다. 너는 그것을 반드시 혐오해야 하고 반드시 역겨워해야 하니, 그것은 멸망에 바쳐진 것이기 때문입니다.[a]
  to: 너는 가증한 것을 네 집 안으로 들여서는 안 됩니다. 그러면 너도 그것과 같이 멸망에 바쳐진 것[a]이 될 것입니다. 너는 그것을 철저히 가증히 여기고 철저히 혐오해야 합니다. 그것은 멸망에 바쳐진 것이기 때문입니다.
  rationale: 결과를 나타내는 히브리어 접속사를 ‘그러면 … 될 것입니다’로 옮겨, 원문에 없는 화자의 두려움을 제거했습니다. חֵרֶם의 두 용례는 동일하게 번역했으며, 각주는 첫 용례에 연결하고 실제 대안을 제시했습니다. 두 강조형 명령은 서로 다른 한국어 동사와 ‘철저히’의 반복으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:26Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘될까 봐 두렵습니다’는 화자의 두려움을 표현하는 내용을 추가하며, 히브리어의 결과적 경고(‘너도 그것과 같이 헤렘이 될 것이다’)를 충실히 옮기지 못합니다. 이를 결과절로 바로잡아야 합니다. חֵרֶם의 반복은 ‘멸망에 바쳐진 것’으로 유지할 수 있습니다.
  naturalness: ‘반드시 역겨워해야’는 현대 한국어에서 다소 부자연스럽습니다. ‘철저히 가증히 여기고 철저히 혐오해야 합니다’는 두 강조형 동사를 구별하면서도 현대의 격식 있는 합쇼체에 자연스럽습니다. ‘네 집 안으로 들여서는 안 됩니다’도 금지 명령을 명료하게 전달합니다.
  terminology: ‘가증한 것’은 תּוֹעֵבָה의 강한 종교·도덕적 혐오의 의미를 적절히 보존합니다. חֵרֶם은 본문에서 일관되게 ‘멸망에 바쳐진 것’으로 옮기고, 각주는 전통적 및 대안적 표현을 제시하도록 정비했습니다.
  issues:
  - severity: high
    issue: ‘될까 봐 두렵습니다’가 결과 경고를 화자의 두려움으로 바꿈
    rationale: וְהָיִיתָ חֵרֶם כָּמֹהוּ는 청자가 그 대상과 같이 헤렘이 된다는 결과를 말합니다. ‘두렵습니다’는 원문에 없는 1인칭 화자 태도를 더합니다.
  - severity: medium
    issue: 각주가 본문 표현을 그대로 ‘또는’으로 반복하고 앵커가 해당 용어에서 떨어져 있음
    rationale: 본문과 같은 ‘멸망에 바쳐진’을 대안으로 제시하는 것은 정보가 되지 않습니다. חֵרֶם의 첫 용례에 앵커를 두고 실제 대안인 ‘진멸에 바쳐진’ 및 전통적 표현을 밝혀야 합니다.
  - severity: medium
    issue: ‘반드시 역겨워해야’의 어색한 결합
    rationale: 한국어에서 ‘역겨워하다’는 이 문맥의 규범적 명령으로 매끄럽지 않습니다. 두 히브리어 동사의 병렬과 강조는 ‘가증히 여기다’와 ‘혐오하다’로 자연스럽게 살릴 수 있습니다.
