  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
  footnotes:
  - marker: a
    text: Literally, 'to his/their face'; the idiom can also be understood as 'before him/them' or 'in his/their presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신을 미워하는 이들에게, 그들을 멸하시려고 그들의 면전에서[a] 갚으십니다. 그분은 자신을 미워하는 자에게 지체하지 않으시며, 그의 면전에서[a] 갚으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의/그들의 얼굴을 향하여’입니다. 이 관용구는 문맥에 따라 ‘그의/그들 앞에서’ 또는 ‘그의/그들의 면전에서’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  english_pob_choice: and repays
  chosen_korean: 갚으시며
  alternatives_korean:
  - 보상하시며
  - 되갚으시며
  lexicon: HALOT
  rationale: פּיעל형 שׁלם의 ‘되갚다, 갚다’ 의미를 살려, 현대 한국어에서 자연스럽고 사법적 상응을 드러내는 ‘갚으시다’로 옮겼습니다.
- source_word: לְשֹׂנְאָיו / לְשֹׂנְאוֹ
  english_pob_choice: those who hate him / with the one who hates him
  chosen_korean: 자신을 미워하는 이들 / 자신을 미워하는 이
  alternatives_korean:
  - 그의 원수들
  - 그를 미워하는 자들
  lexicon: HALOT
  rationale: 분사형은 단순한 감정 상태가 아니라 그분을 미워하는 사람들의 특징을 가리키므로, ‘원수’보다 원문에 더 밀착한 ‘자신을 미워하는 이들’로 렌더링했습니다.
- source_word: אֶל פָּנָיו
  english_pob_choice: to their face
  chosen_korean: 그들의 얼굴 앞에서
  alternatives_korean:
  - 그들 앞에서
  - 그들의 면전에서
  lexicon: HALOT
  rationale: 직역적 관용구를 보존하되 한국어에서 의미가 분명하도록 ‘얼굴 앞에서’로 옮기고, 영어 POB 주석의 ‘before him/them, in his/their presence’ 가능성을 반영했습니다.
- source_word: לְהַאֲבִידוֹ
  english_pob_choice: to destroy them
  chosen_korean: 그들을 멸하십니다
  alternatives_korean:
  - 그들을 멸망시키십니다
  - 그들을 파멸시키십니다
  lexicon: HALOT
  rationale: האביד의 히필은 단순한 약화가 아니라 완전한 멸망/파멸을 뜻하므로, 강도를 유지하는 ‘멸하다’를 선택했습니다.
- source_word: יְאַחֵר
  english_pob_choice: he does not delay
  chosen_korean: 지체하지 않으시고
  alternatives_korean:
  - 늦추지 않으시고
  - 머뭇거리시지 않고
  lexicon: HALOT
  rationale: 문맥상 하나님의 즉각적 응답을 나타내므로, 자연스러운 현대 표현인 ‘지체하지 않으시고’를 택했습니다.
theological_decisions:
- issue: 하나님의 직접적 보응과 심판 언어
  chosen_reading: 하나님이 미워하는 자들에게 직접 갚으시고 멸하시는 것으로 유지했습니다.
  alternative_readings:
  - 간접적 결과 언어로 완화하기
  - 징계 일반론으로 바꾸기
  rationale: 원문은 보응의 주체를 하나님으로 명시하며 개인적·직접적 심판을 말하므로, 그 긴장을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 신학적 긴장 보존'
- issue: ‘얼굴 앞에서’ 관용구 처리
  chosen_reading: 직역을 살린 ‘그들의 얼굴 앞에서’로 유지하고 주석[a]로 더 자연스러운 의미 가능성을 밝혔습니다.
  alternative_readings:
  - ‘그들 앞에서’로 평탄화하기
  - 주석 없이 자연어로만 처리하기
  rationale: 히브리어 관용구의 직접성을 유지하면서도 한국어 독자가 오해하지 않도록 문맥상 가능한 ‘그들 앞에서/면전에서’ 의미를 주석으로 열어 두었습니다.
  doctrine_reference: 어휘·관용구의 다의성 보존
