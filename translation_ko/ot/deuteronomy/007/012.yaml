  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
  footnotes:
  - marker: a
    text: Or 'these ordinances' or 'these rules' for 'these judgments.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term often used for loyal, covenantal love; alternatively, ''covenant faithfulness'' or ''lovingkindness.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'to your ancestors'; Hebrew specifically says 'to your fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 이 법규들을 듣고 지켜 행하면, 야훼 너희 하나님께서 너희를 위하여 그 언약과 그가 너희 조상들에게 맹세하신 그 변함없는 사랑을 지키실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이 규례들' 혹은 '이 명령들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''변함없는 사랑''은 히브리어 hesed의 언약적 사랑을 옮긴 것입니다. 또는 ''언약 신실하심'', ''인자''로도 볼 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 '너희 아버지들'이지만, 이 문맥에서는 조상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  english_pob_choice: And because
  chosen_korean: 너희가 … 하면
  alternatives_korean:
  - 그리고 그 결과
  - 그리고 … 때문에
  - 그리고 …하면
  lexicon: HALOT
  rationale: 히브리어 관용구는 조건에 따른 결과를 여는 표현이므로, 한국어에서는 자연스러운 조건문으로 풀어 뜻의 인과 관계를 살렸습니다.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  english_pob_choice: these judgments
  chosen_korean: 이 법규들
  alternatives_korean:
  - 이 판단들
  - 이 규례들
  - 이 명령들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים는 법적 판정과 규범을 함께 띠므로, 한국어에서는 현대 독자가 이해하기 쉬운 '법규들'로 옮기되 법적 성격을 유지했습니다.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  english_pob_choice: and keep and do them
  chosen_korean: 지켜 행하면
  alternatives_korean:
  - 지키고 행하면
  - 지켜서 행하면
  - 잘 지키고 실천하면
  lexicon: HALOT
  rationale: 두 동사 '지키다'와 '행하다'를 모두 살리되, 한국어 문장에서는 조건절 안에서 압축해 반복을 줄였습니다.
- source_word: הַחֶסֶד
  english_pob_choice: the steadfast love
  chosen_korean: 그 변함없는 사랑
  alternatives_korean:
  - 그 인자하심
  - 그 한결같은 사랑
  - 그 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 충실한 사랑의 뉘앙스를 살리기 위해, 정서적 사랑으로만 좁히지 않는 '변함없는 사랑'을 택했습니다.
- source_word: לַאֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '아버지들'이지만, 이 문맥의 족장들을 자연스럽게 가리키도록 하면서도 한국어 가독성을 위해 '조상들'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 기본 원칙에 따라 언약 이름을 제목 대치어로 바꾸지 않고, 신명기 문맥의 인격적 언약성을 드러내는 '야훼'를 유지했습니다.
  doctrine_reference: Translation philosophy / divine name policy
- issue: חֶסֶד의 covenantal force
  chosen_reading: 변함없는 사랑
  alternative_readings:
  - 언약 신실하심
  - 인자
  - 자비
  rationale: 이 절에서는 야훼께서 맹세하신 언약과 병렬을 이루므로, 단순 감정이 아니라 언약에 묶인 지속적 사랑이라는 점을 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3, §5
