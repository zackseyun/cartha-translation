revisions:
- from: 너희가 이 법규들을 듣고 지켜 행하면, 야훼 너희 하나님께서 너희를 위하여 그 언약과 그가 너희 조상들에게 맹세하신 그 변함없는 사랑을 지키실 것입니다.[a][b][c]
  to: 너희가 이 법규들을 듣고 지켜 행하면, 야훼 너희 하나님께서 너희를 위하여 그 언약과, 그분께서 너희 조상들에게 맹세하신 변함없는 사랑을 지키실 것입니다.[a][b][c]
  rationale: 본문의 의미는 유지하면서, 원문의 여격을 각주에서 정확히 반영하고, 법률 용어의 대안을 더 가깝게 조정했으며, 한국어 문장의 불필요한 지시어 반복을 줄였습니다. ‘조상들에게’는 족장들을 가리키는 문맥상 자연스럽고 원문의 의미를 훼손하지 않으므로 본문에 유지했습니다.
