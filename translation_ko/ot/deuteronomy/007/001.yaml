- from: 여호와 당신의 하나님이 당신이 차지하러 들어가는 그 땅으로 당신을 데려가셔서, 당신 앞에서 많은 민족들—헷 사람, 기르가스 사람, 아모리 사람, 가나안 사람, 브리스 사람, 히위 사람, 여부스 사람—곧 당신보다 수가 많고 강한 일곱 민족을 몰아내실 때,[a][b]
  to: 당신의 하나님 여호와께서 당신이 차지하려고 들어가는 땅으로 당신을 들어가게 하시고, 당신 앞에서 많은 민족들, 곧 헷 사람과 기르가스 사람과 아모리 사람과 가나안 사람과 브리스 사람과 히위 사람과 여부스 사람, 당신보다 수가 많고 강한 일곱 민족을 몰아내실 때,[a][b]
  rationale: 본문의 시간적 도입(‘…하실 때’)을 유지하면서, בוא의 사역적 의미를 ‘들어가게 하시고’로 명확히 했습니다. 일곱 민족의 명단과 그 수적·군사적 우세를 하나의 목적어 및 동격 설명으로 정리했습니다. 각주 a는 원문 ירשׁ에, 각주 b는 רבים ועצומים의 비교 표현에 각각 올바르게 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:25Z'
