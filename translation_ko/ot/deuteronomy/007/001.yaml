base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
  footnotes:
  - marker: a
    text: Or 'dispossesses before you many nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'more numerous and stronger than you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 하나님 여호와께서 당신이 차지하려고 들어가는 땅으로 당신을 들어가게 하시고, 당신 앞에서 많은 민족들, 곧 헷 사람과 기르가스 사람과 아모리 사람과 가나안 사람과 브리스 사람과 히위 사람과 여부스 사람, 당신보다 수가 많고 강한 일곱 민족을 몰아내실 때,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 상속받으려고’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신보다 더 많고 더 강한’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 한국어 교회어 전통과 가독성을 고려해 고유명사 형태로 옮겼습니다. 다만 POB의 원칙상 본래의 신명 경계를 드러내는 번역 선택이며, 본문 맥락상 인칭 대명사처럼 기능하는 호칭은 아닙니다.
- source_word: יְבִיאֲךָ
  english_pob_choice: brings you into
  chosen_korean: 당신을 데려가셔서
  alternatives_korean:
  - 당신을 데려가실 때
  - 당신을 이끌고 들어가셔서
  - 당신을 그 땅 안으로 데려가셔서
  lexicon: HALOT
  rationale: 히필 בוא의 인도/도착 의미를 살리되, 한국어에서는 ‘데려가다’가 자연스럽고 목적지 진입을 충분히 나타냅니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to possess
  chosen_korean: 차지하러
  alternatives_korean:
  - 소유하러
  - 점유하러
  - 차지하려고
  lexicon: HALOT
  rationale: ירש의 정복-상속 맥락을 반영해 단순 소유보다 능동적 점유를 드러내는 ‘차지하다’를 택했습니다.
- source_word: וְנָשַׁל גּוֹיִם רַבִּים מִפָּנֶיךָ
  english_pob_choice: drives out before you many nations
  chosen_korean: 당신 앞에서 많은 민족들을 몰아내실 때
  alternatives_korean:
  - 당신 앞에서 많은 민족들을 쫓아내실 때
  - 당신 앞에서 많은 민족들을 내쫓으실 때
  - 당신 앞에서 많은 민족들을 몰아내시고
  lexicon: HALOT
  rationale: נשל의 제거/축출 의미를 한국어의 ‘몰아내다’로 옮겨, 단순 이동이 아니라 하나님이 주도하시는 축출 행위를 드러냈습니다.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  english_pob_choice: seven nations greater and mightier than you
  chosen_korean: 곧 당신보다 수가 많고 강한 일곱 민족을
  alternatives_korean:
  - 곧 당신보다 더 많고 더 강한 일곱 민족을
  - 곧 당신보다 수가 많고 힘센 일곱 민족을
  - 곧 당신보다 크고 강한 일곱 민족을
  lexicon: HALOT
  rationale: רבים/עצומים의 병렬 대비를 살려 ‘수가 많고 강한’으로 옮겼습니다. 여기서 ‘많다’는 단순 수량이 아니라 상대적 우세를 포함하므로 POB의 주석 방향을 반영했습니다.
theological_decisions:
- issue: 본절의 신명사 번역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 원문에는 יְהוָה가 직접 나오며, 한국어 본문에서는 통용성과 발음 인식이 높은 ‘여호와’를 사용했습니다. 다만 이는 전통 표기 선택이며, 원어의 언약적 호칭이라는 성격은 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 민족 축출의 주체와 시제 감각
  chosen_reading: 하나님이 주도적으로 ‘몰아내실 때’
  alternative_readings:
  - ‘몰아내십니다’로 직설
  - ‘몰아내시고’로 연결
  rationale: 히브리어 연속 동사 구조를 한국어에서 조건-상황 종속절로 자연스럽게 풀어, 약속의 땅 진입과 축출이 하나님의 주도 행위임을 분명히 했습니다.
  doctrine_reference: 서술 문맥의 행위 주체 보존
