translation:
  language: ko
  text: 당신은 모든 민족보다 복을 받을 것입니다[a]. 당신 가운데에는 불임인 남자나 여자가 없을 것이며[b], 당신의 가축 가운데에도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족보다 더’. 히브리어 전치사는 여기서 비교의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어는 남성형과 여성형을 모두 명시합니다: ‘불임인 남자나 여자’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  english_pob_choice: You will be blessed
  chosen_korean: 복을 받을 것입니다
  alternatives_korean:
  - 복되게 될 것입니다
  - 복되실 것입니다
  lexicon: HALOT
  rationale: 수동적 축복 상태를 자연스러운 현대 한국어로 옮기되, 주체가 스스로 복을 만드는 뜻이 아니라 주어지는 복임을 살렸습니다.
- source_word: מִכָּל הָעַמִּים
  english_pob_choice: above all peoples
  chosen_korean: 모든 민족보다
  alternatives_korean:
  - 모든 민족들 가운데서
  - 모든 민족들 위에
  lexicon: HALOT
  rationale: 히브리어 מן의 비교 용법을 한국어 비교구문으로 옮겨, 우열 비교의 힘을 유지했습니다.
- source_word: עָקָר וַעֲקָרָה
  english_pob_choice: a barren man or woman
  chosen_korean: 수컷이나 암컷인 불임자
  alternatives_korean:
  - 불임인 남자나 여자
  - 불임한 남성이나 여성
  lexicon: HALOT
  rationale: 히브리어의 남성형/여성형 대구를 살리면서, 가축 문맥과의 대비를 위해 '수컷/암컷'을 사용해 생식 불가능한 개체 일반을 드러냈습니다.
- source_word: וּבִבְהֶמְתֶּךָ
  english_pob_choice: or among your livestock
  chosen_korean: 당신의 가축 가운데도 그러하지 않을 것입니다
  alternatives_korean:
  - 당신의 가축 중에도 없을 것입니다
  - 당신의 짐승 가운데도 없을 것입니다
  lexicon: HALOT
  rationale: בהמה를 현대 한국어의 포괄적 집합명사인 '가축'으로 옮겨, 사람과 가축 모두에서 불임이 없다는 대조를 분명히 했습니다.
theological_decisions:
- issue: 히브리어의 남성형·여성형 불임 표현을 한국어에서 어떻게 보존할지
  chosen_reading: 사람 항목에서는 '수컷이나 암컷인 불임자'로 성별 대구를 드러냈습니다.
  alternative_readings:
  - 불임인 남자나 여자
  - 불임자
  rationale: 본문은 단순히 '아무도'가 아니라 남성형과 여성형을 병렬로 제시하므로, 한국어에서도 성별 표지를 지워버리지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: 이스라엘을 향한 언약적 단수 호칭을 어떻게 처리할지
  chosen_reading: '''당신''을 단수로 유지해 공동체 전체를 가리키는 언약적 주소를 보존했습니다.'
  alternative_readings:
  - '''너희''로 복수화'
  - '''당신들''로 확대'
  rationale: 히브리어 단수 호칭의 형식을 유지하는 것이 본문의 언약적 직접성을 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
