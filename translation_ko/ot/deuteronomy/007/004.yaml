  source_fidelity: 히브리어의 단수 ‘당신의 아들’과 뒤이은 복수 동사 ‘그들은’을 보존한 점, ‘다른 신들’, 신명 יְהוָה를 ‘야훼’로 옮긴 점, 그리고 신속한 멸망의 경고를 유지한 점은 원문에 충실합니다. 다만 ‘나를 따르지 못하게’는 원문의 ‘나를 따르는 데서 돌이키게 하다’보다 불가능·강제의 뉘앙스를 더하며, 마지막 절은 분노를 문법상 주어로 삼은 뒤 존대 동사로 야훼의 행위를 잇는 구조가 부자연스럽습니다.
  naturalness: ‘나를 따르는 데서 돌이키고’가 히브리어 관용구와 한국어의 자연스러운 인과 표현을 함께 살립니다. 마지막 문장은 ‘야훼의 분노가 ... 타오르고, 야훼께서 ... 멸하실 것입니다’로 주어를 명시하면 현대 한국어 합쇼체에서 명료하고 자연스럽습니다.
