language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from after me,'' an idiom meaning ''from following me.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and he will serve other gods'; the Hebrew shifts from singular ('your son') to plural ('they will serve'), which may broaden the warning from one son to the resulting family line or community.
    reason: alternative_reading
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 당신의 아들을 나를 따르지 못하게 돌이키고, 그들은 다른 신들을 섬길 것입니다. 그러면 야훼의 분노가 당신들에게 타올라, 당신을 속히 멸하실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 뒤에서’라는 관용구로, ‘나를 따르다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 ‘당신의 아들’에서 복수 ‘그들은’으로 바뀌어, 경고가 한 아들을 넘어 후손/가문 전체의 결과를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 야훼는 히브리어 하나님의 고유명사 YHWH를 옮긴 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: יָסִיר
  english_pob_choice: will turn ... away
  chosen_korean: 돌이키고
  alternatives_korean:
  - 멀어지게 하고
  - 떠나게 하고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서, 한국어에서는 ‘돌이키다’가 관계·방향 전환을 자연스럽게 드러냅니다.
- source_word: מֵאַחֲרַי
  english_pob_choice: from following me
  chosen_korean: 나를 따르지 못하게
  alternatives_korean:
  - 내 뒤에서
  - 나를 따라가지 않게
  lexicon: HALOT
  rationale: 직역하면 ‘내 뒤에서’이지만, 관용적으로는 ‘따르다’가 뜻을 정확히 전달합니다. 부정 보조를 넣어 ‘따라가지 못하게’로 관계 단절을 분명히 했습니다.
- source_word: וְעָבְדוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: and they will serve other gods
  chosen_korean: 그들은 다른 신들을 섬길 것입니다
  alternatives_korean:
  - 그는 다른 신들을 섬길 것입니다
  - 다른 신들을 섬기게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 ‘그들은’으로 옮겼고, ‘섬기다’로 우상 숭배의 종교적 행위를 직접적으로 표현했습니다.
- source_word: וְחָרָה אַף יְהוָה
  english_pob_choice: then the anger of Yahweh will burn
  chosen_korean: 그러면 야훼의 분노가 ... 타올라
  alternatives_korean:
  - 그러면 야훼의 진노가 ... 일어나
  - 그러면 야훼의 노여움이 ... 타올라
  lexicon: HALOT
  rationale: ‘타오르다’가 분노의 불붙음이라는 히브리어 관용을 살리며, ‘분노’는 신적 진노의 강도를 현대어로 분명하게 전달합니다.
- source_word: וְהִשְׁמִידְךָ מַהֵר
  english_pob_choice: and he will quickly destroy you
  chosen_korean: 당신을 속히 멸하실 것입니다
  alternatives_korean:
  - 당신을 빨리 멸망시키실 것입니다
  - 당신을 신속히 없애실 것입니다
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 ‘멸하다’로 옮겨 경고의 무게를 유지했습니다. 부사 ‘속히’가 זמן의 긴급성을 간결하게 반영합니다.
theological_decisions:
- issue: 여호와(יהוה) 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유명사를 титlular ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 신적 이름을 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 인칭과 복수의 긴장
  chosen_reading: ‘당신의 아들’은 단수로 유지하고, 뒤의 ‘그들은’은 복수로 유지했습니다.
  alternative_readings:
  - 단수로 평준화하여 ‘그는’으로 옮김
  - 복수 의미를 일반화해 공동체 전체로만 옮김
  rationale: 히브리어가 단수에서 복수로 전환하는 긴장을 지우지 않기 위해, 한 아들에서 시작하되 그 결과가 복수적·가문적 확산을 갖는 구조를 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy 3, 4
