source:
  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
  footnotes:
  - marker: a
    text: Or 'dispossess these nations from before you little by little.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the beasts of the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 하나님 야훼께서 이 민족들을 네 앞에서 조금씩 쫓아내실 것입니다[a]. 너는 그들을 빨리 멸할 수 없을 것입니다. 그렇지 않으면 야생 짐승들이 너를 해칠 만큼 많아질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 민족들을 네 앞에서 차차 몰아내실 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘들의 짐승들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל / יְהוָה
  english_pob_choice: will drive out / Yahweh
  chosen_korean: 쫓아내실 것입니다
  alternatives_korean:
  - 몰아내실 것입니다
  - 내쫓으실 것입니다
  - 쫓아버리실 것입니다
  lexicon: HALOT
  rationale: נשל은 이 문맥에서 땅 앞에서 민족들을 제거하는 뜻이므로, 현대 한국어로는 ‘쫓아내다’가 가장 자연스럽고 전투-영토적 의미를 잘 살립니다.
- source_word: הַגּוֹיִם הָאֵל
  english_pob_choice: these nations
  chosen_korean: 이 민족들을
  alternatives_korean:
  - 이 나라들을
  - 저 민족들을
  - 이 나라 백성들을
  lexicon: HALOT
  rationale: 지시사 הָאֵל의 근접성을 살려 ‘이’로 옮기고, כאן의 גּוֹיִם은 정치적 집단으로서 ‘민족들’이 자연스럽습니다.
- source_word: מְעַט מְעָט
  english_pob_choice: little by little
  chosen_korean: 조금씩
  alternatives_korean:
  - 조금씩 조금씩
  - 서서히
  - 차차
  lexicon: HALOT
  rationale: 반복으로 강조된 점진성을 한국어에서는 ‘조금씩’이 가장 간결하게 전달합니다.
- source_word: כַּלֹּתָם מַהֵר
  english_pob_choice: finish them off quickly
  chosen_korean: 빨리 멸하지 못할 것입니다
  alternatives_korean:
  - 빨리 없애지 못할 것입니다
  - 빨리 끝내지 못할 것입니다
  - 신속히 멸망시키지 못할 것입니다
  lexicon: HALOT
  rationale: כלה는 여기서 민족들을 완전히 끝장내는 뜻이므로 ‘멸하다’가 어감상 충분히 강하고, ‘빨리’는 מַהֵר의 부사적 의미를 담습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals
  chosen_korean: 들의 들짐승
  alternatives_korean:
  - 들의 짐승
  - 광야의 짐승
  - 들의 야생동물
  lexicon: HALOT
  rationale: 직역에 가까운 ‘들의 들짐승’으로 원문의 ‘field/open country’ 이미지를 살리되, 현대 한국어에서도 이해 가능하게 했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 본래 고유한 신적 이름이므로, POB 기준에 따라 제목어 ‘야훼’로 옮겨 언약적 이름성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
