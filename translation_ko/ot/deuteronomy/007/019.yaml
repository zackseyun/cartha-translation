base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
  footnotes:
  - marker: a
    text: Or 'the great testings.' The Hebrew term can denote severe tests or trials.
    reason: lexical_alternative
  - marker: b
    text: Or 'to all the nations.' Hebrew 'peoples' is more literal.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 눈이 본 그 큰 시험들과 표적들과 이적들, 그리고 야훼 당신의 하나님께서 당신을 인도하여 내실 때 보이신 그 강한 손과 펴신 팔을 기억하십시오.[a] 야훼 당신의 하나님께서는 당신이 두려워하는 모든 민족들에게도 그렇게 하실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시험들’은 ‘검증들’ 또는 ‘시련들’로도 옮길 수 있습니다. 히브리어는 혹독한 시험이나 검증을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 백성들에게’입니다. 히브리어 ‘백성들’은 여기서 여러 민족 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  english_pob_choice: the great trials
  chosen_korean: 큰 시험들
  alternatives_korean:
  - 큰 시련들
  - 큰 검증들
  lexicon: HALOT
  rationale: מַסּוֹת는 여기서 하나님이 허락하신 엄중한 시험/검증의 사건들을 가리키므로, ‘큰 시험들’이 자연스럽고 원문 의미를 잘 보존합니다.
- source_word: רָאוּ עֵינֶיךָ
  english_pob_choice: your eyes saw
  chosen_korean: 그분이 보신
  alternatives_korean:
  - 당신이 보신
  - 당신의 눈이 본
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’까지 직접 언급하는 강조법이므로, ‘보신’으로 처리하되 직전 문맥의 2인칭을 한국어 흐름상 자연스럽게 유지했습니다.
- source_word: הָאֹתֹת / הַמֹּפְתִים
  english_pob_choice: the signs / the wonders
  chosen_korean: 그 표적들과 그 기적들
  alternatives_korean:
  - 그 징조들과 그 이적들
  - 그 표적들과 그 놀라운 일들
  lexicon: HALOT
  rationale: ‘표적’은 오ֹת의 표준 대응어이고, מוֹפְתִים은 놀라움을 일으키는 초자연적 행위이므로 ‘기적들’이 현대 한국어에서 가장 분명합니다.
- source_word: הַיָּד הַחֲזָקָה / הַזְּרֹעַ הַנְּטוּיָה
  english_pob_choice: the mighty hand / the outstretched arm
  chosen_korean: 그 강한 손과 그 펴신 팔
  alternatives_korean:
  - 그 능한 손과 그 펴신 팔
  - 그 힘센 손과 그 편 팔
  lexicon: HALOT
  rationale: ‘강한 손’과 ‘펼친 팔’은 출애굽 전승의 관용구를 살리면서도 현대 한국어에서 과도하게 낯설지 않게 옮긴 표현입니다.
- source_word: יְהוָה אֱלֹהֶי/ךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 여호와 당신의 하나님
  lexicon: DOCTRINE.md
  rationale: 여호와 대신 신명기의 दिव이름 관례에 따라 ‘야훼’를 유지하고, 문맥의 직접 호소를 존대형으로 옮겼습니다.
theological_decisions:
- issue: 2인칭 단수 خطاب을 한국어에서 어떤 높임으로 옮길지
  chosen_reading: 모세의 설교적 직접 호소를 살려 ‘당신’과 높임을 사용했습니다.
  alternative_readings:
  - ‘너’로 직역
  - 일반 서술형으로 완화
  rationale: 본문은 이스라엘에게 직접 말하는 언약적 권면이므로, 현대 표준어의 공손한 직접 호칭인 ‘당신’을 사용해 수신자 대면성을 유지했습니다.
  doctrine_reference: POB Korean style policy
- issue: ‘펼친 팔’과 같은 신체 은유를 그대로 보존할지
  chosen_reading: 은유를 보존했습니다.
  alternative_readings:
  - ‘능력’으로 풀어쓰기
  - ‘강권하시는 손길’로 의역
  rationale: 본문의 핵심은 야훼의 구원 행위를 몸의 이미지로 증언하는 데 있으므로, 원문의 비유적 힘을 약화시키지 않도록 직유를 유지했습니다.
  doctrine_reference: Source transparency / metaphor preservation
