    rationale: אֵל גָּדוֹל וְנוֹרָא는 앞의 ‘야훼 너의 하나님’에 대한 동격 설명입니다. 한국어에서도 주어를 이어 주는 편이 더 직접적입니다.
  - severity: medium
    issue: 각주 b가 본문 표현과 동일하여 대안 기능을 하지 못함
    rationale: 현 본문의 ‘당신들 가운데’와 각주 b의 ‘당신들 가운데’가 동일합니다. ‘너희와 함께’처럼 실제 번역 대안을 제시해야 합니다.
