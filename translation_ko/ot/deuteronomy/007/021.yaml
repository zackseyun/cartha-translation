revisions:
- from: 그들을 두려워하지 마십시오. 야훼 당신의 하나님이 당신들 가운데 계시기 때문입니다. 그는 크고 두려우신 하나님이십니다.[a][b][c]
  to: 그들을 두려워하지 마십시오[a]. 너희 하나님 야훼께서 너희 가운데 계시니[b], 크고 두려우신 하나님이십니다[c].
  rationale: 공동체를 대표하는 히브리어 2인칭 단수를 한국어 공동체 호칭 ‘너희’로 일관되게 처리했습니다. 야훼의 임재와 그분의 위대하고 경외스러운 성품을 나타내는 원문의 동격 관계를 유지했으며, 각주를 해당 어구에 직접 연결하고 b 각주가 실질적인 대안을 제공하도록 고쳤습니다.
