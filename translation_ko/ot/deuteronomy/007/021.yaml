translation:
  language: ko
  text: 그들을 두려워하지 마십시오[a]. 너희 하나님 야훼께서 너희 가운데 계시니[b], 크고 두려우신 하나님이십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 때문에 겁에 질리지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희와 함께’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘경외로우신’; 히브리어는 하나님께서 경외의 두려움을 불러일으키시는 분임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲרֹץ מִפְּנֵיהֶם
  english_pob_choice: Do not dread them
  chosen_korean: 그들을 두려워하지 마십시오
  alternatives_korean:
  - 그들 때문에 떨지 마십시오
  - 그들 앞에서 겁내지 마십시오
  lexicon: HALOT
  rationale: ערץ의 핵심은 단순한 일반적 ‘두려움’보다 겁먹고 떨리는 공포이므로, 한국어에서는 자연스럽고 직설적인 금지형으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 신명기의 언약 문맥에서 신명사는 ‘야훼’로 보존하고, 2인칭 단수 소유는 합쇼체에 맞게 ‘당신의’로 옮겼습니다.
- source_word: בְּקִרְבְּךָ
  english_pob_choice: in your midst
  chosen_korean: 당신들 가운데
  alternatives_korean:
  - 당신의 한가운데
  - 당신 안에
  lexicon: HALOT
  rationale: 공동체적 임재를 나타내는 표현이므로, 개인 내면을 뜻할 수 있는 ‘안에’보다 회중적 뉘앙스의 ‘가운데’를 택했습니다.
- source_word: אֵל גָּדוֹל וְנוֹרָא
  english_pob_choice: a great and fearsome God
  chosen_korean: 크고 두려우신 하나님
  alternatives_korean:
  - 크고 경외로우신 하나님
  - 크고 무서우신 하나님
  lexicon: HALOT
  rationale: גָּדוֹל은 ‘크다’의 기본 뜻을 살리고, וְנוֹרָא는 단순한 공포보다 경외를 일으키는 속성을 담아 존대 형용으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 여호와 대체를 따르지 않고, 신명사의 고유성을 살리는 학술적 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘두려우신’의 경외 의미
  chosen_reading: 두려우신 하나님
  alternative_readings:
  - 무서우신 하나님
  - 경외로우신 하나님
  rationale: וְנוֹרָא는 단순한 공포 조장이 아니라 하나님 앞의 경외를 포함하므로, 두려움과 경외가 함께 느껴지는 표현을 택했습니다.
  doctrine_reference: HALOT on נורא; reverent fear in covenant language
