base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
  footnotes:
  - marker: a
    text: Or 'take away understanding' or 'deprive of sense'; Hebrew 'take away the heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 음행과 포도주와 새 포도주가 마음을 빼앗습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해를 빼앗는다’ 혹은 ‘분별력을 잃게 한다’. 히브리어는 직역하면 ‘마음을 빼앗는다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 문란
  - 창녀짓
  lexicon: HALOT
  rationale: 호세아서의 문맥에서 זְנוּת은 단순한 사생활 문제가 아니라 언약적 불충실함까지 띠는 성적 타락을 가리키므로, 한국어 성경에서 널리 쓰이면서도 직설적인 ‘음행’이 가장 적절합니다.
- source_word: יַיִן
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: 히브리어 יַיִן의 표준 대응은 ‘포도주’이며, 본문이 알코올 음료 일반이 아니라 포도주를 가리키므로 ‘술’보다 정확합니다.
- source_word: תִּירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 갓 만든 포도주
  - 신 포도주
  lexicon: HALOT
  rationale: יַיִן과 구별되는 תִּירוֹשׁ의 어휘적 대비를 살리기 위해 ‘새 포도주’로 옮겼습니다. ‘새 술’은 음료 범주를 흐릴 수 있고, ‘새 포도주’가 원문의 대조를 가장 잘 보존합니다.
- source_word: לֵב
  english_pob_choice: the heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 이해
  - 생각
  lexicon: HALOT
  rationale: 히브리어 לֵב은 감정뿐 아니라 이해와 의지를 포함하는 내면 전체를 가리키므로, 한국어의 포괄적 표현인 ‘마음’으로 옮겨 원문의 인간학적 폭을 유지했습니다.
theological_decisions:
- issue: 마지막 관용구를 해석적으로 풀지 않고 어떻게 옮길 것인가
  chosen_reading: ‘마음을 빼앗습니다’로 옮겨, 내적 판단력의 상실을 암시하되 본문의 직유를 유지했습니다.
  alternative_readings:
  - 마음을 빼앗아 갑니다
  - 이해력을 잃게 합니다
  - 분별력을 앗아 갑니다
  rationale: 본문은 도덕적 경고를 위해 신체-내면의 이미지를 사용합니다. ‘마음’의 상실이라는 히브리어 표현을 직접 살리면서도, 한국어에서 자연스럽게 읽히도록 ‘빼앗습니다’로 처리했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
