id: HOS.4.5
reference: Hosea 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
  footnotes:
  - marker: a
    text: Or 'a prophet also will stumble with you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will silence' or 'I will cut off'; the Hebrew verb can carry related senses in a judgment context.
    reason: lexical_alternative
  - marker: c
    text: '''Your mother'' likely refers metaphorically to the people, nation, or covenant community.'
    reason: cultural_note
translation:
  language: ko
  text: 너는 낮에 걸려 넘어질 것이며, 예언자도[c] 밤에 너와 함께 걸려 넘어질 것입니다. 나는 네 어머니를[a] 멸하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 어머니’는 비유적으로 백성, 민족, 또는 언약 공동체를 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 이 심판 문맥에서 ‘멸하다’ 외에도 ‘잠잠하게 하다’ 또는 ‘끊어 버리다’라는 관련 의미로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘예언자’에는 관사가 없습니다. 특정 예언자를 가리킬 수도 있고, 예언자들을 대표하여 가리키는 말일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשַׁלְתָּ / וְכָשַׁל
  english_pob_choice: you will stumble / will stumble
  chosen_korean: 걸려 넘어지고 / 걸려 넘어질 것입니다
  alternatives_korean:
  - 넘어지고 / 넘어질 것입니다
  - 실족하고 / 실족할 것입니다
  lexicon: HALOT
  rationale: כשל의 비유적 의미를 살려 단순한 ‘넘어지다’보다 ‘걸려 넘어지다’로 옮기면 심판 경고의 이미지를 더 분명하게 전달할 수 있습니다. 두 절에서 같은 동사를 일관되게 처리했습니다.
- source_word: הַיּוֹם / לָיְלָה
  english_pob_choice: by day / by night
  chosen_korean: 낮에 / 밤에
  alternatives_korean:
  - 낮에 / 야간에
  - 낮 동안 / 밤중에
  lexicon: HALOT
  rationale: 낮-밤의 대조를 자연스럽게 드러내는 한국어로 옮겼습니다. 전치사적 용법을 과도하게 직역하기보다 시간 대비를 선명하게 유지했습니다.
- source_word: נָבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 그 예언자
  - 한 예언자
  lexicon: HALOT
  rationale: 히브리어의 무관사 형태를 반영해 대표적 직분명으로 옮겼습니다. 본문상 특정 인물을 지정하기보다, 백성과 함께 넘어질 예언자 계층을 가리키는 효과를 살렸습니다.
- source_word: וְדָמִיתִי
  english_pob_choice: I will destroy
  chosen_korean: 내가 … 멸하겠습니다
  alternatives_korean:
  - 내가 … 끊어 버리겠습니다
  - 내가 … 잠잠하게 하겠습니다
  lexicon: HALOT
  rationale: 문맥상 심판 선언이므로 기본값은 ‘멸하다’로 잡았습니다. 다만 이 동사는 ‘잠잠하게 하다’나 ‘끊어 버리다’의 관련 의미도 가능하므로, 해석의 여지를 본문 자체에서 지우지 않도록 영어 주석에 대응되는 대안은 유지했습니다.
- source_word: אִמֶּךָ
  english_pob_choice: your mother
  chosen_korean: 네 어머니
  alternatives_korean:
  - 너의 어머니
  - 네 어미
  lexicon: HALOT
  rationale: 직역을 유지해 호세아의 가족 은유를 본문에서 그대로 보존했습니다. 이는 민족/공동체를 지칭하는 비유일 가능성이 있지만, 그 해석은 본문 밖에서 다루는 것이 적절합니다.
theological_decisions:
- issue: ‘네 어머니’의 비유적 지시 대상
  chosen_reading: 본문에서는 비유를 풀지 않고 ‘네 어머니’를 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘로 명시함
  - 공동체/민족으로 풀어 씀
  rationale: 호세아서의 가족 은유가 지닌 긴장과 심판의 충격을 보존하기 위해, 지시 대상을 본문에서 해석적으로 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
