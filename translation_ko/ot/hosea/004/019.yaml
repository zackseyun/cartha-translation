  lexicon: HALOT
  rationale: 히브리어 בוש의 결과적·법정적 뉘앙스를 살려, 단순 감정 상태보다 ‘수치를 당하다’가 판단과 굴욕의 의미를 더 잘 보존합니다.
theological_decisions:
- issue: ‘바람’의 정체를 특정할지 여부
  chosen_reading: 일차 본문에서는 자연 이미지인 ‘바람’을 유지하고, 그것이 심판의 도구인지는 단정하지 않았습니다.
  alternative_readings:
  - ‘영’으로 읽을 수 있습니다.
  - ‘하나님의 바람’ 같은 해석을 본문에 반영할 수 있습니다.
  rationale: 주변 문맥이 우상적 제사와 그에 따른 수치를 분명히 말하지만, 원문은 바람의 정체를 해석적으로 규정하지 않으므로 시적 모호성을 그대로 남기는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
