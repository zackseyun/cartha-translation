  lexicon: HALOT
  rationale: 생략된 명령의 대상이 있는 간결한 히브리어를 현대 한국어의 자연스러운 금지/비개입 명령으로 옮겼습니다. ‘내버려 두십시오’는 단절과 방임의 뜻을 살립니다.
- source_word: אֶפְרָיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
