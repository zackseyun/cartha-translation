  lexicon: HALOT
  rationale: 문맥이 우상 숭배에 대한 예언적 책망이므로, 단순한 ‘형상’보다 종교적 대상과 경멸적 뉘앙스를 함께 담는 ‘우상들’이 적절합니다.
- source_word: הַנַּח לוֹ
  english_pob_choice: leave him alone
  chosen_korean: 그를 내버려 두십시오
  alternatives_korean:
