  lexicon: HALOT
  rationale: ‘חבר’의 수동 분사로서 ‘함께 묶임/연결됨’의 의미를 살리면서, 예언적 비난의 강한 결박감을 한국어로 자연스럽게 드러내기 위해 ‘결속되었습니다’를 택했습니다.
