theological_decisions:
- issue: 에브라임의 지시 대상
  chosen_reading: 본문의 이름을 그대로 유지하여, 문자적으로는 에브라임이면서 동시에 북왕국 전체를 가리키는 예언적 표지를 보존했습니다.
  alternative_readings:
  - 북이스라엘로 풀어쓰는 번역
  - 이스라엘로 일반화하는 번역
  rationale: 시적·예언적 압축을 해소하지 않고, 청자가 문맥에서 그 집단적 의미를 읽어내도록 남겨 두는 것이 원문의 수사와 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
- issue: 마지막 명령의 힘
  chosen_reading: 에브라임을 더 이상 말리거나 붙잡지 말고 우상 숭배의 길에 그대로 두라는 단호한 비개입 명령으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘그를 떠나게 하십시오’
  - ‘그를 버려 두십시오’라는 더 강한 방임
  rationale: 히브리어의 짧고 절박한 명령문은 단순한 설명보다 심판적 단절을 드러냅니다. 한국어에서는 ‘내버려 두십시오’가 그 냉혹한 톤을 가장 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve the source''s terse prophetic force.'
