  text: אַ֥ךְ אִ֛ישׁ אַל יָרֵ֖ב וְ/אַל יוֹכַ֣ח אִ֑ישׁ וְ/עַמְּ/ךָ֖ כִּ/מְרִיבֵ֥י כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
  footnotes:
  - marker: a
    text: Or 'rebuke' for 'reprove'; the Hebrew verb can denote correction, rebuke, or legal argument.
    reason: lexical_alternative
  - marker: b
    text: The comparison may echo the gravity of resisting priestly judgment in the law; compare Deuteronomy 17:12.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 아무도 다투지[a] 말고, 아무도 책망하지 마십시오. 당신의 백성은 제사장과 다투는 자들과 같습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투다’는 히브리어 ריב의 법적·논쟁적 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 비교는 제사장 판결을 거스르는 행위의 심각성을 시사할 수 있습니다. 신명기 17:12를 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그렇지만
  - 하지만
  - 오직
  lexicon: HALOT
  rationale: 앞선 진술에서 급하게 전환하는 대조 표지이므로, 현대 한국어에서는 ‘그러나’가 문맥의 반전을 가장 자연스럽게 드러냅니다.
- source_word: יָרֵב / כִּמְרִיבֵי
  english_pob_choice: contend / those who contend
  chosen_korean: 다투다 / 다투는 자들
  alternatives_korean:
  - 변론하다 / 변론하는 자들
  - 다투어 말하다 / 다투는 사람들
  - 시비하다 / 시비하는 자들
  lexicon: HALOT
  rationale: ריב은 단순한 말다툼보다 대립·논쟁·송사적 다툼까지 포함할 수 있어 ‘다투다’가 의미 범위를 가장 넓고도 자연스럽게 살립니다.
- source_word: יוֹכַח
  english_pob_choice: reprove
  chosen_korean: 책망하다
  alternatives_korean:
  - 꾸짖다
  - 질책하다
  - 바로잡다
  lexicon: HALOT
  rationale: יכח은 훈계·책망·논증의 뉘앙스를 함께 가질 수 있으므로, ‘책망하다’가 교정과 경책의 긴장을 무리 없이 보존합니다.
- source_word: כֹהֵן
  english_pob_choice: a priest
  chosen_korean: 제사장
  alternatives_korean:
  - 한 제사장
  - 사제
  - 성직자
  lexicon: HALOT
  rationale: 히브리어 כֹהֵן은 제의적 직분을 가리키므로, 한국어 성경의 표준적이고 소스에 충실한 ‘제사장’이 적절합니다.
theological_decisions:
- issue: 마지막 절의 비교문 해석
  chosen_reading: 백성이 제사장의 판단과 권위를 거스르며 다투는 자들 같다는 비교로 유지합니다.
  alternative_readings:
  - 신명기 17:12의 제사장 판결 거부를 더 직접적으로 암시하는 표현
  - 언약 소송 이미지로 백성 자체를 제사장 विरोध자와 동일시하는 읽기
  rationale: 원문은 분명 비교문이므로, 본문이 허용하는 범위를 넘는 법적·신학적 해석을 본문에 미리 확정하지 않고 긴장을 그대로 보존합니다.
  doctrine_reference: 해석의 긴장을 본문 수준에서 유지
