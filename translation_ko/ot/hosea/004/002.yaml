id: HOS.4.2
reference: Hosea 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָלֹ֣ה וְ/כַחֵ֔שׁ וְ/רָצֹ֥חַ וְ/גָנֹ֖ב וְ/נָאֹ֑ף פָּרָ֕צוּ וְ/דָמִ֥ים בְּ/דָמִ֖ים נָגָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
  footnotes:
  - marker: a
    text: Hebrew literally, 'bloods touch bloods,' an idiom meaning that acts of bloodshed come one after another.
    reason: lexical_alternative
  - marker: b
    text: '''Cursing'' may also be understood as oath-violation or false swearing in this covenant-lawsuit context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저주와 거짓말과 살인과 도둑질과 간음이 터져 나옵니다[a]. 유혈이 유혈을 잇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주’는 이 언약 소송 문맥에서 거짓 맹세나 맹세 위반을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  english_pob_choice: Cursing
  chosen_korean: 맹세
  alternatives_korean:
  - 저주
  - 욕설
  - 맹세 위반
  lexicon: HALOT
  rationale: 이 문맥의 אָלֹה는 언약 법정의 비난 항목으로서 맹세와 관련된 위반 행위를 가리킬 수 있어, 한국어에서는 전통적 교회어투의 ‘저주’보다 중립적인 ‘맹세’가 본문의 법정적 뉘앙스를 더 잘 살립니다.
- source_word: כַחֵשׁ
  english_pob_choice: lying
  chosen_korean: 거짓말
  alternatives_korean:
  - 속임
  - 거짓
  - 거짓말하기
  lexicon: HALOT
  rationale: 동사 כחשׁ는 거짓말하고 속이는 행위를 뜻하므로, vice list의 나열감에 맞게 자연스러운 명사형 ‘거짓말’로 옮겼습니다.
- source_word: פָּרָצוּ
  english_pob_choice: break out
  chosen_korean: 퍼져 나갑니다
  alternatives_korean:
  - 터져 나갑니다
  - 돌발합니다
  - 무너져 나갑니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘뚫고 나가다/터져 나오다’이지만, 여기서는 앞의 죄악들이 한꺼번에 확산되는 모습을 묘사하므로 현대 한국어에서 가장 자연스럽게 그 흐름을 살리는 ‘퍼져 나갑니다’를 택했습니다.
- source_word: דָמִים בְּדָמִים נָגָעוּ
  english_pob_choice: bloodshed follows bloodshed
  chosen_korean: 피 흘림이 피 흘림을 잇습니다
  alternatives_korean:
  - 피 흘림이 피 흘림을 따릅니다
  - 피가 피에 닿습니다
  - 피 흘림이 피 흘림을 잇고 잇습니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘피들이 피들에 닿는다’는 관용구를 현대 독자가 이해할 수 있도록, 연속적 폭력의 누적을 드러내는 ‘피 흘림이 피 흘림을 잇습니다’로 옮겼습니다.
theological_decisions:
- issue: אָלֹה의 의미 범위
  chosen_reading: ‘맹세’로 옮기되, 언약적 위반과 거짓 맹세의 가능성을 열어 둡니다.
  alternative_readings:
  - ‘저주’
  - ‘맹세 위반’
  - ‘거짓 맹세’
  rationale: 호세아 4장 2절은 언약 소송의 비난 목록이므로, 단순한 욕설보다 맹세의 파기·왜곡을 포함하는 넓은 의미가 더 적절합니다.
  doctrine_reference: 언약 신실성과 제3계명 관련 해석
- issue: דָמִים בְּדָמִים נָגָעוּ의 관용구
  chosen_reading: 폭력과 유혈이 끊이지 않고 이어지는 상태를 뜻하는 관용구로 이해합니다.
  alternative_readings:
  - 문자적으로 ‘피가 피에 닿는다’
  - ‘혈흔이 혈흔을 잇는다’
  rationale: 히브리어의 이미지가 매우 강하므로, 의미를 평탄화하지 않되 현대어로는 연속적 유혈의 누적을 분명히 해야 합니다.
  doctrine_reference: 죄의 누적성과 공동체적 붕괴
