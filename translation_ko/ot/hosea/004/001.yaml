  source_fidelity: ‘다투실 일이 있으시니’는 רִיב의 현재적인 법정·고발 의미를 장래의 다툼 가능성처럼 들리게 할 수 있습니다. ‘송사를 제기하십니다’로 옮기면 야훼께서 주민들을 상대로 제기하시는 고발/소송이라는 본문의 법정적 비유를 더 정확히 드러냅니다. 나머지 핵심어들은 원문에 충실합니다.
  naturalness: 합쇼체는 유지되어 있으며, ‘이스라엘 자손들아’는 예언서의 호격으로 자연스럽습니다. 다만 법정적 문맥에서는 ‘그 땅의 주민들과 다투실 일이 있으시니’보다 ‘그 땅 주민들을 상대로 송사를 제기하십니다’가 현대 한국어에서 더 명료하고 자연스럽습니다.
  terminology: 야훼, 이스라엘 자손, 진실, 신실함, 하나님을 아는 지식은 일관되고 적절합니다. חֶסֶד의 넓은 의미는 본문에서 ‘신실함’으로 절제해 유지하고, 각주에서 언약적 신실함·인애·충성·자비의 가능성을 제시합니다.
