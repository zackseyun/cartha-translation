id: HOS.4.1
reference: Hosea 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
  footnotes:
  - marker: a
    text: Or 'children of Israel.' The Hebrew is literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD has a lawsuit against' or 'the LORD has a controversy with.'
    reason: lexical_alternative
  - marker: c
    text: Or 'steadfast love,' 'loyalty,' or 'mercy' for 'covenant faithfulness.'
    reason: lexical_alternative
  - marker: d
    text: '''Land'' may refer specifically to the land of Israel; some translate ''earth.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손들아, 야훼의 말씀을 들으십시오. 야훼께서 그 땅[a] 주민들을 상대로 송사를 제기하십니다[b]. 그 땅에 진실도 없고, 신실함도 없고[c], 하나님을 아는 지식도 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 땅’은 특히 이스라엘 땅을 가리킬 수 있으며, 일부 번역은 ‘온 땅’으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅 주민들과 송사가 있으시다’, ‘그들을 상대로 소송을 제기하신다’, ‘그들을 고발하신다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘언약적 신실함’, ‘인애’, ‘충성’, ‘자비’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어라
  lexicon: HALOT
  rationale: 예언자적 호소의 명령형을 살리면서 현대 표준어의 공손한 직설 명령으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 직역을 유지하되, 한국어에서는 관용적인 성경식 표현인 ‘자손들’이 자연스럽습니다.
- source_word: רִיב לַיהוָה עִם
  english_pob_choice: has a case against / has a lawsuit against / has a controversy with
  chosen_korean: 다투실 일이 있으시니
  alternatives_korean:
  - 소송이 있으시니
  - 고발하실 일이 있으시니
  - 송사하실 일이 있으시니
  lexicon: HALOT
  rationale: רִיב의 법정적·논쟁적 뉘앙스를 살리되, 너무 기술적인 법률어보다 예언서의 경고 톤을 드러내는 표현을 택했습니다.
- source_word: אֵין אֱמֶת וְאֵין חֶסֶד
  english_pob_choice: there is no truth, no faithfulness
  chosen_korean: 진실도 없고, 신실함도 없고
  alternatives_korean:
  - 진리도 없고, 인애도 없고
  - 참됨도 없고, 언약적 신실함도 없고
  lexicon: HALOT
  rationale: אֱמֶת는 ‘진실’, חֶסֶד는 문맥상 언약적 충성을 가리키므로 ‘신실함’으로 옮겨 이중의 결핍을 간결하게 표현했습니다.
- source_word: דַּעַת אֱלֹהִים
  english_pob_choice: knowledge of God
  chosen_korean: 하나님을 아는 지식
  alternatives_korean:
  - 하나님에 대한 지식
  - 하나님을 아는 것
  lexicon: HALOT
  rationale: 단순 정보가 아니라 관계적·윤리적 인식을 뜻하는 구성어이므로, 한국어 성경어법에 맞는 ‘하나님을 아는 지식’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 고유명사이므로, POB의 원칙에 따라 ‘야훼’로 직역적 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חֶסֶד의 의미 범위
  chosen_reading: 신실함
  alternative_readings:
  - 인애
  - 자비
  - 언약적 신실함
  rationale: 호세아의 언약 고발 문맥에서 חֶסֶד은 감정적 친절보다 언약에 대한 신실한 충성을 가리키므로, 한국어에서는 짧고 직접적인 ‘신실함’으로 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
