id: HOS.4.10
reference: Hosea 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
  footnotes:
  - marker: a
    text: Or 'play the prostitute' / 'commit whoredom.' The Hebrew verb can denote prostitution specifically and, in Hosea, often carries overtones of covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'multiply.' The Hebrew literally has 'break out,' here likely meaning increase in offspring or population.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew is terse: ''they have abandoned the LORD, to keep.'' The sense is likely that they have stopped giving heed to or observing the LORD; some understand an implied object such as ''his law'' or ''his ways.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 먹어도 만족하지 못할 것이며, 성적 부정을 행해도 늘어나지 않을 것입니다. 이는 그들이 야훼를 버리고 음행을 지키기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָֽכְלוּ֙ ... וְ/לֹ֣א יִשְׂבָּ֔עוּ
  english_pob_choice: They will eat, but not be satisfied
  chosen_korean: 그들은 먹어도 만족하지 못할 것입니다
  alternatives_korean:
  - 먹지만 배부르지 않을 것입니다
  - 먹어도 배부르지 않을 것입니다
  lexicon: HALOT
  rationale: אָכְלוּ와 יִשְׂבָּעוּ의 대비를 자연스러운 현대 한국어로 살리되, 심판 예고의 미래적 뉘앙스를 유지했습니다.
- source_word: הִזְנוּ
  english_pob_choice: commit sexual immorality
  chosen_korean: 성적 부정을 행해도
  alternatives_korean:
  - 음행을 해도
  - 창녀처럼 행해도
  - 간음을 해도
  lexicon: HALOT
  rationale: 호세아서의 זנה는 문자적 성행위와 언약적 부정의 겹침을 가질 수 있어, 한국어에서는 너무 협소한 ‘간음’보다 포괄적인 ‘성적 부정’을 택했습니다.
- source_word: יִפְרֹצוּ
  english_pob_choice: increase
  chosen_korean: 늘어나지 않을 것입니다
  alternatives_korean:
  - 번성하지 않을 것입니다
  - 불어나지 않을 것입니다
  - 퍼지지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 성행위의 결과인 자손·인구 증가를 가리키므로, 직역적 ‘번성’보다 현대 독자가 바로 이해하는 ‘늘어나다’를 사용했습니다.
- source_word: כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־
  english_pob_choice: because they have abandoned Yahweh, to cherish prostitution
  chosen_korean: 이는 그들이 야훼를 버리고 음행을 지키기 때문입니다
  alternatives_korean:
  - 이는 그들이 야훼를 버리고 음행을 추구하기 때문입니다
  - 이는 그들이 야훼를 버리고 음행을 좇기 때문입니다
  - 이는 그들이 야훼를 버리고 음행을 간수하기 때문입니다
  lexicon: HALOT
  rationale: לִשְׁמֹר의 난해한 용례를 영어 POB의 해석에 따라 ‘음행을 지키다’로 옮겨, 본문이 말하는 역설적 충성의 대상이 야훼가 아니라 음행임을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호세아의 언약적 고발을 제목어 ‘주’로 희석하지 않았습니다.
theological_decisions:
- issue: זנה의 의미 범위
  chosen_reading: ‘성적 부정’으로 옮겨 문자적 행위와 호세아서의 언약 불성실 배경을 함께 열어 두었습니다.
  alternative_readings:
  - ‘음행’으로 더 전통적으로 번역
  - ‘창녀질’처럼 더 강하게 번역
  - 영적 우상숭배로만 옮김
  rationale: 본문의 즉각적 대비는 실제 성행위와 그 좌절된 결과를 가리키지만, 호세아서 전체의 상징성도 배제하지 않도록 했습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장 보존'
- issue: לִשְׁמֹר의 난해한 종속구
  chosen_reading: ‘음행을 지키기’로 옮겨, 본문이 야훼를 버린 뒤 엉뚱한 대상에 충성하는 역설을 드러냈습니다.
  alternative_readings:
  - ‘그를 지키기’처럼 인칭목적어를 보충
  - ‘그의 율법을 지키기’로 해석
  - 본문을 불완전한 것으로 보고 의미를 유보
  rationale: 히브리어가 매우 간결하므로 임의의 법/율법을 삽입하기보다, 문맥이 암시하는 ‘음행’과 연결해 최소한으로 풀었습니다.
  doctrine_reference: '번역 원칙 §1: 원문 우선성과 주석 가능한 난해성 유지'
