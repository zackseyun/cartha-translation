source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
  footnotes:
  - marker: a
    text: Or 'consort with prostitutes' for 'go apart with prostitutes.' The Hebrew verb is literally 'separate themselves/go apart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'temple prostitutes' for 'cult prostitutes.' The Hebrew refers to women associated with illicit cultic sexual practice.
    reason: lexical_alternative
  - marker: c
    text: The final verb is rare and may mean 'be thrown down,' 'be confounded,' or more generally 'come to ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희 딸들이 몸을 팔아도, 너희 며느리들이 간음해도 벌하지 않겠습니다. 이는 그 남자들 자신이 창녀들과 따로 가며[a], 제의 창녀들과 함께 제사를 드리기 때문입니다[b]. 분별이 없는 백성은 무너집니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘따로 가다’ 또는 ‘분리되다’라는 뜻입니다. 문맥에서는 창녀들과 따로 물러나 함께하는 행위를 완곡하게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘거룩하게 구별된 여자들’입니다. 문맥상 불법적 제의와 관련된 여성들을 가리키며, ‘제의 창녀들’로 이해되기도 합니다. 실제 제의 성매매를 뜻하는지, 또는 더 넓게 제의에 관련된 여성들을 뜻하는지는 논의가 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 희귀 동사로, ‘무너지다’, ‘혼란에 빠지다’, 또는 더 넓게 ‘멸망에 이르다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְק֨וֹד
  english_pob_choice: I will not punish
  chosen_korean: 벌하지 않겠다고 하겠다
  alternatives_korean:
  - 책망하지 않겠다고 하겠다
  - 심판하지 않겠다고 하겠다
  - 벌을 내리지 않겠다고 하겠다
  lexicon: HALOT
  rationale: פקד이 심판 문맥에서 ‘벌하다/벌을 내리다’의 뜻으로 쓰이므로, 현대 한국어에서 직접적이고 분명한 표현을 택했습니다.
- source_word: תִזְנֶינָה
  english_pob_choice: prostitute themselves
  chosen_korean: 몸을 팔 때에도
  alternatives_korean:
  - 음행할 때에도
  - 창녀 짓을 할 때에도
  - 음란하게 행할 때에도
  lexicon: HALOT
  rationale: זנה의 구체적·비유적 성격을 살리되, 한국어에서 너무 낡지 않으면서도 행위의 노골성을 유지하는 표현으로 옮겼습니다.
- source_word: כִּי הֵם עִם הַזֹּנוֹת יְפָרֵדוּ
  english_pob_choice: for the men themselves go apart with prostitutes
  chosen_korean: 그것은 남자들 자신이 창녀들과 함께 떼를 지어 따로 가며
  alternatives_korean:
  - 남자들 자신이 창녀들과 함께 따로 가며
  - 남자들 자신이 창녀들과 어울려 가며
  - 남자들 자신이 창녀들과 분리되어 가며
  lexicon: HALOT
  rationale: פרד의 기본뜻인 ‘떼어지다/따로 가다’를 살리면서, 문맥상 성적 접촉을 암시하는 완곡한 동작을 한국어로 자연스럽게 표현했습니다.
- source_word: הַקְּדֵשׁוֹת
  english_pob_choice: cult prostitutes
  chosen_korean: 몸을 파는 여자들과
  alternatives_korean:
  - 신전 창녀들과
  - 성전 창녀들과
  - 제의 창녀들과
  lexicon: HALOT
  rationale: ‘cult prostitutes’의 제의적·성적 결합 의미를 유지하면서도, 한국어 본문에서는 과도한 세부 제도화를 피하고 본문의 비난 대상이 분명히 드러나게 했습니다.
- source_word: וְעָם לֹא יָבִין יִלָּבֵט
  english_pob_choice: and a people without understanding comes to ruin
  chosen_korean: 분별이 없는 백성은 무너집니다
  alternatives_korean:
  - 깨닫지 못하는 백성은 무너집니다
  - 이해가 없는 백성은 무너집니다
  - 분별하지 못하는 백성은 망합니다
  lexicon: HALOT
  rationale: לא יבין을 관용적으로 ‘분별이 없다’로 옮겨, 무지와 도덕적 무감각을 함께 드러내고, 희귀 동사 יִלָּבֵט은 자연스러운 결과 표현인 ‘무너집니다’로 처리했습니다.
theological_decisions:
- issue: 하나님이 딸들과 며느리들을 벌하지 않겠다는 진술의 범위
  chosen_reading: 이 진술은 여인들의 죄를 무시한다는 뜻이 아니라, 남자들 자신도 같은 성적·제의적 타락에 가담하고 있으므로 그들을 특정하여 벌하지 않겠다고 말하는 문맥입니다.
  alternative_readings:
  - 여인들만 예외적으로 면책된다는 뜻
  - 남자들의 죄와 무관하게 전면적으로 벌하지 않겠다는 뜻
  rationale: 접속사 כִּי가 이유를 제시하므로, 본문은 책임의 편향이 아니라 공동 가담을 드러내는 고발로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: 본문 문맥이 드러내는 공동책임과 심판의 정당성 유지
