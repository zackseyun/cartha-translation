id: HOS.4.8
reference: Hosea 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַטַּ֥את עַמִּ֖/י יֹאכֵ֑לוּ וְ/אֶל עֲוֺנָ֖/ם יִשְׂא֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
  footnotes:
  - marker: a
    text: Or, 'They eat the sin offering of my people.' The Hebrew word can mean either 'sin' or 'sin offering.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'and to their iniquity he/they lift(s) up his soul'; the Hebrew idiom means to desire or crave, and the singular 'his soul' is grammatically difficult in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 백성의 죄를 먹으며, 그들의 죄악에 욕구를 두고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 속죄제물을 먹는다.’ 히브리어 חַטַּאת은 ‘죄’와 ‘속죄제물’ 둘 다를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 죄악에 자기/그들의 영혼을 들어 올린다’인데, 이 히브리어 관용구는 욕망하거나 갈망한다는 뜻입니다. 문법상 단수 ‘그의 영혼’은 문맥상 다소 난해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 속죄제물
  - 죄 제물
  lexicon: HALOT
  rationale: 문맥상 제사장들의 탐욕과 백성의 도덕적 타락을 함께 겨냥하므로, मुख्य 본문은 추상적 의미의 ‘죄’로 두어 윤리적 책망을 살렸습니다. 제사 제물의 가능성은 주석에서 보존합니다.
- source_word: יֹאכֵלוּ
  english_pob_choice: feed on
  chosen_korean: 먹으며
  alternatives_korean:
  - 먹고
  - 삼키며
  lexicon: HALOT
  rationale: 히브리어 동사의 기본 의미를 그대로 살리되, 비유적 착취의 뉘앙스가 드러나도록 자연스러운 ‘먹으며’로 옮겼습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성의
  alternatives_korean:
  - 내 ժողովրդի
  - 내 민족의
  lexicon: HALOT
  rationale: 첫 사람 단수 소유격을 직접 반영해 하나님의 언약 백성을 가리키는 표지를 유지했습니다.
- source_word: עֲוֺנָם
  english_pob_choice: their iniquity
  chosen_korean: 그들의 죄악
  alternatives_korean:
  - 그들의 악
  - 그들의 죄책
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 의미를 살려 ‘죄악’으로 옮겼습니다. ‘죄책’이나 ‘벌받을 죄’도 가능하지만, 여기서는 평행구에 맞는 윤리적 무게가 더 중요합니다.
- source_word: יִשְׂאוּ נַפְשׁוֹ
  english_pob_choice: they set their appetite on
  chosen_korean: 욕구를 두고 있습니다
  alternatives_korean:
  - 갈망하고 있습니다
  - 탐욕을 부리고 있습니다
  lexicon: HALOT
  rationale: ‘들어 올리다 + 영혼/생명’의 관용구는 단순한 감정 이상으로 향한 갈망을 뜻하므로, 현대 한국어로는 ‘욕구를 두다’가 가장 무리 없이 그 의미를 전달합니다. 원문의 관용성과 불편한 문법성은 주석에 남깁니다.
theological_decisions:
- issue: חַטַּאת의 제의적 의미와 윤리적 의미 중 어느 쪽을 본문에 둘지
  chosen_reading: 본문에는 ‘죄’를 두고, 가능한 ‘속죄제물’ 의미는 주석으로 남깁니다.
  alternative_readings:
  - 속죄제물
  rationale: 이 절은 제사장들의 부패를 고발하는 문맥이므로, 백성의 제물을 먹는 제의적 배경이 있어도 मुख्य 책망은 백성의 죄를 이익의 대상으로 삼는 데 있습니다. 따라서 주본문은 보다 넓은 윤리적 의미를 택하되, 제의적 해석 가능성은 지우지 않았습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
