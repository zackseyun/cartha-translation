reference: Hosea 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
  footnotes:
  - marker: a
    text: Or 'they burn incense.' The Hebrew verb can refer specifically to burning incense or more broadly to making offerings go up in smoke.
    reason: lexical_alternative
  - marker: b
    text: The tree names are traditionally identified as oak, poplar, and terebinth; exact botanical equivalents are not fully certain.
    reason: cultural_note
  - marker: c
    text: Hosea often uses sexual unfaithfulness as imagery for covenant unfaithfulness; here the wording also plainly describes literal sexual sin.
    reason: cross_reference
translation:
  language: ko
  text: 산들의 꼭대기에서 그들은 제사를 드리고, 언덕들에서 떡갈나무와 포플러와 테레빈스나무 아래에서 분향합니다[a][b]. 그 그늘이 좋기 때문입니다. 그러므로 너희 딸들은 음행하고[c], 너희 며느리들은 간음합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문맥상 분향을 가리키기도 하고, 더 넓게는 제물을 불살라 올리는 행위를 가리키기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 세 나무 이름은 전통적으로 떡갈나무, 포플러, 테레빈스나무로 이해되지만, 정확한 식물학적 대응은 확정적이지 않습니다.
    reason: cultural_note
  - marker: c
    text: 호세아는 종종 성적 불신실함을 언약 불성실의 이미지로 사용하지만, 여기서는 문자적인 성적 죄도 분명히 드러납니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְזַבֵּחוּ
  english_pob_choice: they sacrifice
  chosen_korean: 제사를 드리고
  alternatives_korean:
  - 제사합니다
  - 희생제물을 바치고
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살리되, 한국어 성경체에서 자연스러운 ‘제사를 드리다’로 옮겼습니다.
- source_word: יְקַטֵּרוּ
  english_pob_choice: they burn incense / they burn offerings
  chosen_korean: 분향합니다
  alternatives_korean:
  - 향을 피웁니다
  - 제물을 불살라 드립니다
  lexicon: HALOT
  rationale: קטר는 문맥상 산당 제의에서의 분향 행위를 가리키는 것으로 읽는 것이 가장 직접적이므로, 좁은 의미를 반영해 ‘분향합니다’로 옮겼습니다.
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  english_pob_choice: under oak and poplar and terebinth
  chosen_korean: 떡갈나무와 포플러와 상수리나무 아래에서
  alternatives_korean:
  - 참나무와 포플러와 테레빈스나무 아래에서
  - 참나무와 버드나무와 상수리나무 아래에서
  lexicon: HALOT
  rationale: 세 나무 이름은 특정한 성소성 그늘을 이루는 식생으로 제시되므로, 너무 일반화하지 않으면서도 한국어 독자가 이해할 수 있는 통용명을 택했습니다.
- source_word: תִּזְנֶינָה
  english_pob_choice: your daughters prostitute themselves
  chosen_korean: 너희 딸들은 몸을 팝니다
  alternatives_korean:
  - 너희 딸들은 창녀처럼 행동합니다
  - 너희 딸들은 음행합니다
  lexicon: HALOT
  rationale: זנה는 문맥상 성적 타락을 뜻하며, 한국어에서 직설적이면서도 지나치게 구어적이지 않은 표현으로 ‘몸을 팝니다’를 택했습니다.
- source_word: תְּנָאַפְנָה
  english_pob_choice: commit adultery
  chosen_korean: 간음합니다
  alternatives_korean:
  - 간음을 행합니다
  - 외도합니다
  lexicon: HALOT
  rationale: נאף의 핵심 의미는 간음이므로, 성경적·법적 뉘앙스를 유지하는 ‘간음합니다’가 가장 직접적입니다.
theological_decisions:
- issue: 이 구절의 성적 언어를 상징적 우상숭배로만 볼지, 실제 성적 죄로도 볼지
  chosen_reading: 본문은 산당 제의와 연결된 실제 성적 타락을 직접 말하면서도, 호세아서 전체의 언약 불성실 이미지와도 긴장 속에 놓인 것으로 보았습니다.
  alternative_readings:
  - 순전히 영적 간음의 비유로만 읽기
  - 오직 사회적 비유가 아니라 문자적 성행위만으로 읽기
  rationale: ‘너희 딸들’과 ‘너희 며느리들’이라는 구체적 주어와 두 개의 성적 동사가 병렬로 놓여 있으므로, 본문이 실제 성적 죄를 가리키는 직접성을 살려야 합니다. 동시에 호세아서의 상징 언어를 지우지 않도록 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: source가 허용하는 신학적 긴장을 보존'
