  terminology: ‘제사장’, ‘벌하다’, ‘길’, ‘행실’은 적절합니다. דְּרָכָיו와 מַעֲלָלָיו의 도덕적·행위적 의미 및 אָשִׁיב לוֹ의 보응 의미를 ‘그의 길 때문에’와 ‘그의 행실에 따라 그에게 갚겠습니다’로 보존합니다.
