  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֥ה כָ/עָ֖ם כַּ/כֹּהֵ֑ן וּ/פָקַדְתִּ֤י עָלָי/ו֙ דְּרָכָ֔י/ו וּ/מַעֲלָלָ֖י/ו אָשִׁ֥יב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
  footnotes:
  - marker: a
    text: Or 'like the people, like the priest.' The Hebrew is a terse comparison meaning that priest and people alike will face the same judgment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses singular pronouns ('him,' 'his'), which may function distributively for the group or may narrow the focus to the priest.
    reason: alternative_reading
translation:
  language: ko
  text: '그리고 이렇게 될 것입니다: 백성이나 제사장이나 마찬가지입니다.[a] 내가 그의 길 때문에 그를 벌하고, 그의 행실에 따라 그에게 갚겠습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 압축된 비교구문은 직역하면 ‘백성과 같이, 제사장과 같이’입니다. 이는 백성과 제사장이 모두 같은 심판 아래 놓인다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 뒤에서 단수 대명사를 사용합니다. 이 단수는 집단의 각 사람을 분배적으로 가리킬 수도 있고, 제사장에게 초점을 좁힐 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָעָם כַּכֹּהֵן
  english_pob_choice: like people, like priest
  chosen_korean: 백성 같고 제사장 같습니다
  alternatives_korean:
  - 백성처럼 제사장처럼
  - 백성 같듯 제사장 같습니다
  - 백성이나 제사장이나 같습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 대구를 살리기 위해 두 항목을 병렬로 짧게 대응시켰습니다. 관사 없는 명사구의 간결함을 유지하되, 한국어에서는 자연스럽게 연결해 격언적 어조를 살렸습니다.
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 벌하고
  alternatives_korean:
  - 벌하겠습니다
  - 문책하고
  - 찾아가 처분하고
  lexicon: HALOT
  rationale: פקד의 심판 문맥에서 ‘벌하다’가 현재 한국어로 판정적·사법적 의미를 가장 직접적으로 전달합니다. 앞뒤 절의 병렬을 위해 동사형을 유지했습니다.
- source_word: עָלָיו
  english_pob_choice: him
  chosen_korean: 그의
  alternatives_korean:
  - 그에게
  - 그를
  - 그 사람의
  lexicon: HALOT
  rationale: 히브리어의 단수 접미사를 그대로 반영해 ‘그의’로 처리했습니다. 집단적/분배적 지시 가능성을 풀어 쓰지 않고, 원문의 수를 보존했습니다.
- source_word: דְּרָכָיו / מַעֲלָלָיו
  english_pob_choice: his ways / his deeds
  chosen_korean: 길 / 행실
  alternatives_korean:
  - 행동 / 행위
  - 삶의 길 / 행실들
  - 행로 / 소행
  lexicon: HALOT
  rationale: ‘길’은 اخلاق적 삶의 방식이라는 성경적 은유를 살리고, ‘행실’은 평가적 뉘앙스를 유지합니다. ‘deeds’의 결과성은 ‘행실’로 자연스럽게 전달됩니다.
- source_word: אָשִׁיב לֽוֹ
  english_pob_choice: repay him
  chosen_korean: 그에게 갚겠습니다
  alternatives_korean:
  - 그에게 되돌리겠습니다
  - 그에게 보응하겠습니다
  - 그에게 되갚겠습니다
  lexicon: HALOT
  rationale: 보응·상환의 의미를 갖는 히필 שוב를 현대 한국어의 ‘갚다’로 옮겨, 심판과 상응하는 보복적 상환을 간결하게 드러냈습니다.
theological_decisions:
- issue: 단수 대명사 ‘그의/그에게’의 처리
  chosen_reading: 단수 표현을 유지해, 앞선 ‘백성/제사장’의 병렬이 분배적 의미로 적용될 수 있게 두었습니다.
  alternative_readings:
  - 복수로 풀어 ‘그들의/그들에게’로 매끈하게 번역
  - 직접적으로 제사장만 가리키는 것으로 한정
  rationale: 히브리어는 집단 비교 뒤에 단수 접미사를 사용하므로, 한국어에서도 그 긴장을 지우지 않는 것이 원문 투명성에 더 적합합니다. 문맥상 제사장 책임이 강하지만, 본절의 격언적 구조는 집단 전체에 대한 심판을 열어 둡니다.
  doctrine_reference: 원문의 수적 긴장 보존
