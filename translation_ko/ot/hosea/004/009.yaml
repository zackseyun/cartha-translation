  source_fidelity: 수정이 필요합니다. 초안의 ‘그의 길을 벌하고’는 히브리어 עָלָיו דְּרָכָיו가 뜻하는 ‘그의 길/행위 때문에 그를 벌하다’를 ‘길 자체를 벌하다’로 바꾸어 버립니다. 또한 ‘그의 행실을 그에게 갚겠습니다’는 한국어에서 목적어 관계가 부자연스럽습니다. 수정문은 단수 대명사와 백성·제사장의 동등한 심판이라는 압축된 대구를 유지합니다.
