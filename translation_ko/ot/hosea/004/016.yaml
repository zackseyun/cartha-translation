id: HOS.4.16
reference: Hosea 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י כְּ/פָרָ֣ה סֹֽרֵרָ֔ה סָרַ֖ר יִשְׂרָאֵ֑ל עַתָּה֙ יִרְעֵ֣/ם יְהוָ֔ה כְּ/כֶ֖בֶשׂ בַּ/מֶּרְחָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
  footnotes:
  - marker: a
    text: Or 'like a sheep in an open space' or 'in a spacious place.' The Hebrew image may imply either open pasturage or vulnerable exposure under judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이스라엘이 고집 센 암송아지처럼 고집스럽기 때문입니다. 이제 야훼께서 그들을 넓은 곳의 어린 양처럼 먹이실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넓은 곳에 있는 양처럼’, ‘넓은 공간에서’. 히브리어 이미지는 열린 목초지의 의미일 수도 있고, 심판 아래의 취약한 노출을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 곧
  lexicon: HALOT
  rationale: 이전 진술의 근거를 잇는 설명 기능을 한국어로 자연스럽게 살리면서도, 단순 인과 이상의 예언적 진술 흐름을 유지합니다.
- source_word: כְּפָרָה סֹרֵרָה
  english_pob_choice: as stubborn as a stubborn heifer
  chosen_korean: 고집 센 암송아지처럼
  alternatives_korean:
  - 반항하는 암소처럼
  - 고집스러운 암송아지처럼
  - 길들지 않은 암송아지처럼
  lexicon: HALOT
  rationale: פָּרָה는 암소/암송아지의 암컷 가축 이미지를 가지므로, 한국어에서는 너무 일반적인 ‘소’보다 ‘암송아지’가 원문 이미지와 더 가깝습니다. סֹרֵרָה의 완고함은 ‘고집 센’으로 자연스럽게 옮겼습니다.
- source_word: סָרַר
  english_pob_choice: is stubborn
  chosen_korean: 고집스럽기
  alternatives_korean:
  - 반항하기
  - 완고하기
  - 거역하기
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서 그대로 중첩하기보다, 앞의 형용사구와 뒤의 서술을 연결해 반복적 강조를 살리면서도 문장을 매끄럽게 구성했습니다.
- source_word: יִרְעֵם
  english_pob_choice: will pasture them
  chosen_korean: 먹이실 것입니다
  alternatives_korean:
  - 기르실 것입니다
  - 목양하실 것입니다
  - 풀 뜯게 하실 것입니다
  lexicon: HALOT
  rationale: רעה는 ‘치다/먹이다/목양하다’의 뜻을 가지며, 여기서는 가축 은유를 유지하되 한국어에서 ‘먹이실 것입니다’가 가장 넓고 자연스럽습니다. ‘목양하다’는 지나치게 교회적일 수 있습니다.
- source_word: כְּכֶבֶשׂ בַּמֶּרְחָב
  english_pob_choice: like a lamb in a broad place
  chosen_korean: 넓은 곳의 어린 양처럼
  alternatives_korean:
  - 넓은 들판의 양처럼
  - 탁 트인 곳의 어린 양처럼
  - 넓은 곳에서의 어린 양처럼
  lexicon: HALOT
  rationale: כֶבֶשׂ는 어린 양/양새끼를 가리키므로 ‘어린 양’으로 옮겼고, בַּמֶּרְחָב는 ‘넓은 곳’으로 직역해 POB가 보존한 해석의 긴장(풍성한 목초지인지, 노출된 넓은 공간인지)을 남겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 표준에 따라 여호와 대신 신명기적 고유명 ‘야훼’를 사용해 מקור어의 직접성을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 이미지가 보호인지 심판적 노출인지의 긴장
  chosen_reading: ‘넓은 곳의 어린 양처럼’이라는 표현을 그대로 유지해, 목초지의 공급처럼 보이면서도 통제되지 않은 노출/방치의 가능성을 함께 남겼습니다.
  alternative_readings:
  - 야훼께서 그들을 기쁘게 먹이실 것입니다
  - 야훼께서 그들을 광야 같은 넓은 곳에 내버려 두실 것입니다
  rationale: 히브리어 מרחב는 넓고 열린 공간을 가리켜 돌봄과 노출의 양면성을 둘 다 열어 두므로, 한국어에서도 어느 한쪽으로 단정하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문이 허용하는 해석적 긴장을 보존합니다.
