base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
  footnotes:
  - marker: a
    text: Beth-aven means 'house of wickedness' or 'house of iniquity,' likely a polemical name for Bethel.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 네가 음행을 저지르더라도, 이스라엘아, 유다는 죄를 짓지 말아야 합니다. 또 길갈로 가지도 말고, 벧아웬으로 올라가지도 말며, 「야훼께서 살아 계신다」고 맹세하지도 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벧아웬은 ‘악의 집’ 또는 ‘불의의 집’이라는 뜻일 수 있으며, 아마도 베델을 비꼬아 부른 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם זֹנֶה אַתָּה
  english_pob_choice: Though you prostitute yourself
  chosen_korean: 비록 네가 음행을 저지르더라도
  alternatives_korean:
  - 비록 네가 창녀처럼 굴더라도
  - 비록 네가 음란하게 행하더라도
  - 비록 네가 음행을 하더라도
  lexicon: HALOT
  rationale: 예언서의 언약 불성실 은유를 유지하되, 현대 한국어에서 지나치게 생경하거나 노골적인 표현은 피하고자 「음행을 저지르다」를 택했습니다.
- source_word: אַל יֶאְשַׁם
  english_pob_choice: let not Judah become guilty
  chosen_korean: 유다는 죄를 짓지 말아야 합니다
  alternatives_korean:
  - 유다가 죄책을 지지 말아야 합니다
  - 유다가 유죄가 되지 말아야 합니다
  - 유다가 죄를 담당하지 말아야 합니다
  lexicon: HALOT
  rationale: אשם의 ‘죄책을 지다/유죄가 되다’ 의미를 살리면서도, 한국어에서 자연스럽고 경고문답게 들리는 「죄를 짓지 말아야 합니다」로 옮겼습니다.
- source_word: בֵּית אָוֶן
  english_pob_choice: Beth-aven
  chosen_korean: 벧아웬
  alternatives_korean:
  - 벧아웬(‘악의 집’)
  - 베델
  - 불의의 집
  lexicon: HALOT
  rationale: 본문의 의도적 조어와 폄칭을 살리기 위해 음역을 유지했고, 전통 지명 베델로 평준화하지 않았습니다.
- source_word: חַי יְהוָה
  english_pob_choice: ‘As Yahweh lives’
  chosen_korean: 「야훼께서 살아 계신다」
  alternatives_korean:
  - 「야훼의 삶으로 맹세한다」
  - 「야훼의 생명을 두고」
  - 「주님께서 살아 계신다」
  lexicon: HALOT
  rationale: 맹세 공식의 직역형을 살리면서, 여호와 대신 본문상의 신명 표기 יְהוָה를 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 이스라엘의 언약 불성실을 드러내는 성적 은유
  chosen_reading: 「음행을 저지르다」를 유지해 은유를 직접 보이게 했습니다.
  alternative_readings:
  - ‘불충실하다’로 완화하기
  - ‘영적 간음’으로 해석어를 덧붙이기
  rationale: 호세아의 수사적 충격과 언약 배반의 도덕적 무게를 보존하기 위해, 원문의 성적 은유를 약화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
- issue: 여호와 신명 표기의 한국어 처리
  chosen_reading: 본문과 맹세문 모두에서 יְהוָה를 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명을 사용하므로, 호칭으로 대체하지 않고 고유명을 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
