base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
  footnotes:
  - marker: a
    text: Beth-aven means 'house of wickedness' or 'house of iniquity,' likely a polemical name for Bethel.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 네가 음행을 하더라도, 이스라엘아, 유다는 죄를 짓지 말아야 합니다. 또 길갈로 가지도 말고, 벧아웬으로[a] 올라가지도 말며, 「야훼께서 살아 계신다」고 맹세하지도 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벧아웬은 ‘악의 집’ 또는 ‘불의의 집’이라는 뜻일 수 있으며, 아마도 베델을 비꼬아 부른 이름입니다.
    reason: lexical_alternative
