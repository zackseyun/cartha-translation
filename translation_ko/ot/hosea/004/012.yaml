reference: Hosea 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַמִּ/י֙ בְּ/עֵצ֣/וֹ יִשְׁאָ֔ל וּ/מַקְל֖/וֹ יַגִּ֣יד ל֑/וֹ כִּ֣י ר֤וּחַ זְנוּנִים֙ הִתְעָ֔ה וַ/יִּזְנ֖וּ מִ/תַּ֥חַת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
  footnotes:
  - marker: a
    text: Or 'their wood' or, more interpretively, 'their wooden idol.' The Hebrew is literally 'his wood,' likely a collective singular referring to a wooden cult object used in divination.
    reason: lexical_alternative
  - marker: b
    text: Or 'a spirit of prostitution' or 'a spirit of unfaithfulness.' The Hebrew keeps the prostitution metaphor explicit.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from under their God,' an idiom for departing from the proper allegiance and authority of their God.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성은 그들의 나무 조각에게[a] 묻고, 그들의 막대기가 그들에게 알려 줍니다. 음행의 영이[b] 그들을 미혹하였기 때문입니다. 그들은 그들의 하나님 아래에서 벗어나[c] 음행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 나무’입니다. 문맥상 백성 전체가 점술에 사용하는 목재 물체를 가리키는 집합적 단수 표현입니다. ‘그들의 나무’ 또는, 더 해석적으로는 ‘그들의 목제 우상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘매춘의 영’, ‘불성실의 영’. 히브리어는 음행의 은유를 분명히 유지합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 하나님 아래에서’. 이는 그들의 하나님께 마땅히 드려야 할 충성과 그분의 권위 아래 있는 অবস্থ태에서 이탈함을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  english_pob_choice: My people
  chosen_korean: 내 백성
  alternatives_korean:
  - 나의 백성
  - 내 겨레
  lexicon: HALOT
  rationale: 1인칭 소유가 결합된 עַם의 언약적 호칭을 자연스럽게 살려 ‘내 백성’으로 옮겼습니다.
- source_word: בְּעֵצוֹ
  english_pob_choice: their piece of wood
  chosen_korean: 자기 나무
  alternatives_korean:
  - 그들의 나무
  - 나무 조각
  - 자기 목제 우상
  lexicon: HALOT
  rationale: 문맥상 점술에 쓰는 목재 물체를 가리키므로, 사물의 구체성을 살리면서도 과도하게 해석하지 않는 ‘자기 나무’를 택했습니다.
- source_word: רוּחַ זְנוּנִים
  english_pob_choice: a spirit of whoredom
  chosen_korean: 음행의 영
  alternatives_korean:
  - 음란의 영
  - 음행하는 영
  - 부정의 영
  lexicon: HALOT
  rationale: 예언서의 성적 은유를 유지하되 한국어에서 지나치게 낯설거나 공격적으로 들릴 수 있는 ‘whoredom’의 직역을 조정해, 메타포의 힘과 가독성을 함께 살렸습니다.
- source_word: הִתְעָה
  english_pob_choice: has led them astray
  chosen_korean: 그들을 미혹하였기 때문입니다
  alternatives_korean:
  - 그들을 길에서 벗어나게 하였기 때문입니다
  - 그들을 속였기 때문입니다
  lexicon: HALOT
  rationale: ‘mislead/lead astray’의 의미를 예언문맥에 맞게 ‘미혹하다’로 옮겨, 우상 숭배로의 이탈과 속임의 뉘앙스를 함께 드러냈습니다.
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  english_pob_choice: departing from under their God
  chosen_korean: 자기 하나님 아래에서 떠나
  alternatives_korean:
  - 자기 하나님 아래로부터 떠나
  - 자기 하나님을 버리고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘from under’의 통치·소속 이탈 이미지를 보존하기 위해, 문자성을 살린 ‘아래에서 떠나’로 옮겼습니다.
theological_decisions:
- issue: זנה의 예언적 성적 은유 보존
  chosen_reading: 마지막 절을 ‘음행하였습니다’로 유지하여, 단순한 종교적 배반이 아니라 언약 불성실의 성적 은유를 드러냈습니다.
  alternative_readings:
  - ‘불성실하였습니다’
  - ‘우상숭배하였습니다’
  rationale: 호세아의 표현은 의도적으로 충격적인 성적 언어로 이스라엘의 배교를 묘사하므로, 의미를 완화하면 본문의 수사적·신학적 강도가 약해집니다.
  doctrine_reference: 예언서의 언약 배반 표상
- issue: ‘from under their God’ 관용구 처리
  chosen_reading: ‘자기 하나님 아래에서 떠나’로 직역적 이미지를 유지했습니다.
  alternative_readings:
  - ‘자기 하나님을 떠나’
  - ‘자기 하나님에게서 떨어져’
  rationale: 문자적 이미지를 보존하면, 단순한 지리적 이동이 아니라 하나님의 권위와 보호 아래에서 이탈한 행위라는 의미가 더 분명해집니다.
  doctrine_reference: 언약적 소속과 권위의 상실
