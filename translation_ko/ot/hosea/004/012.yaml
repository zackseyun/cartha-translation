    rationale: 각주 a, b, c가 각각 나무, ‘음행의 영’, ‘하나님 아래에서’라는 별개 표현을 설명하므로 해당 어구 뒤에 배치해야 독자가 각주의 적용 범위를 혼동하지 않습니다.
  - severity: low
