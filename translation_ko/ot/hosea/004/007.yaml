  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/רֻבָּ֖/ם כֵּ֣ן חָֽטְאוּ לִ֑/י כְּבוֹדָ֖/ם בְּ/קָל֥וֹן אָמִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
  footnotes:
  - marker: a
    text: Or 'As they multiplied, so they sinned against me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will exchange their glory for disgrace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 많아질수록 더욱 죄를 지었습니다. 그들의 영광을 수치로 바꾸겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 번성할수록, 그만큼 내게 죄를 지었습니다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 영광을 수치와 맞바꾸겠습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: כְּרֻבָּם כֵּן
  english_pob_choice: The more they increased, the more they sinned against me
  chosen_korean: 그들이 많아질수록 더욱
  alternatives_korean:
  - 그들이 번성할수록 더욱
  - 그들이 많아진 만큼 곧바로
  lexicon: HALOT
  rationale: כְּ + רבה와 כֵּן의 상관 구조를 한국어의 ‘-할수록 ... 더욱’으로 자연스럽게 살려, 증가와 죄의 증대가 대응된다는 뜻을 보존했습니다.
- source_word: חָטְאוּ לִי
  english_pob_choice: they sinned against me
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 내게 죄를 지었습니다
  - 나를 거슬러 죄를 지었습니다
  lexicon: HALOT
  rationale: חטא + ל는 여기서 하나님을 향한 범죄를 뜻하므로 한국어에서는 ‘죄를 짓다’로 옮기되, 문맥상 대상이 하나님임은 앞뒤 연결로 분명합니다.
- source_word: כְּבוֹדָם
  english_pob_choice: their glory
  chosen_korean: 그들의 영광
  alternatives_korean:
  - 그들의 존귀
  - 그들의 명예
  lexicon: HALOT
  rationale: כבוד의 핵심 의미를 ‘영광’으로 두어, 원문이 가진 높아짐과 반전의 대비를 그대로 살렸습니다.
- source_word: בְּקָל֥וֹן
  english_pob_choice: into disgrace
  chosen_korean: 수치로
  alternatives_korean:
  - 치욕으로
  - 불명예로
  lexicon: HALOT
  rationale: קָלוֹן은 shame/disgrace를 가리키므로, 변화의 결과를 드러내는 ‘수치로’가 자연스럽고 압축적입니다.
- source_word: אָמִיר
  english_pob_choice: I will change
  chosen_korean: 바꾸겠습니다
  alternatives_korean:
  - 바꿀 것입니다
  - 바꾸어 버리겠습니다
  lexicon: HALOT
  rationale: 첫인칭 미래의 परिवर्तन/교환 의미를 살려, ‘영광’을 ‘수치’로 전환하는 능동적 심판을 분명히 드러냈습니다.
theological_decisions:
- issue: ‘그들의 영광’의 지시 대상
  chosen_reading: 해석을 덧붙이지 않고 그대로 두었습니다.
  alternative_readings:
  - 그들의 제사장적 명예
  - 그들의 지위와 번영
  - 야훼 자신이 그들의 영광
  rationale: 히브리어가 지시 대상을 특정하지 않으므로, 본문이 가진 반전의 힘을 유지하기 위해 주석적 확장을 본문에 넣지 않았습니다.
  doctrine_reference: 의도된 모호성 보존
