translation:
  language: ko
  text: 그들이 많아질수록, 그만큼 내게 죄를 지었습니다.[a] 내가 그들의 영광을 수치로 바꾸겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 번성할수록, 그만큼 내게 죄를 지었습니다.’
