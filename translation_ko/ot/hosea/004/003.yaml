theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨 호세아의 언약 심판이 미치는 지역적·창조적 파괴를 함께 드러냅니다.
  alternative_readings:
  - ‘땅’ 대신 ‘지면’
  - ‘땅’ 대신 ‘온 땅’
  rationale: 문맥상 이스라엘의 땅을 가리키는 동시에, 그 땅의 붕괴가 인간·동물·어류 전체로 확장되는 심판의 총체성을 보여 주므로 ‘땅’이 가장 적절합니다.
  doctrine_reference: 언약 심판과 창조 질서의 훼손
- issue: יֵאָסֵפוּ의 심판 뉘앙스
  chosen_reading: ‘사라집니다’로 옮겨 제거·상실의 결과를 드러냅니다.
  alternative_readings:
  - ‘거둬집니다’
  - ‘모여집니다’
  rationale: 이 동사는 단순한 집합보다 심판에 따른 제거를 암시하므로, 한국어에서도 소멸의 결과가 드러나게 하는 것이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 심판의 전면성
