source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
  footnotes:
  - marker: a
    text: Or 'the earth mourns.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' best fits Hosea's immediate context of judgment on Israel.
    reason: alternative_reading
  - marker: b
    text: Or 'are swept away' or more literally 'are gathered.' The sense is that even the fish are removed under the judgment described.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 땅이[a] 애통하고, 그 안에 사는 모든 이가 들짐승과 하늘의 새와 함께 쇠약해지며, 바다의 물고기들까지도 거두어집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세계’로 옮길 수 있습니다. 여기서는 호세아의 직접적인 문맥상 이스라엘의 땅을 가리키는 뜻이 가장 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 יֵאָסֵפוּ는 ‘거두어지다’, ‘모이다’ 또는 문맥상 ‘제거되다’라는 뜻을 가질 수 있습니다. 여기서는 심판으로 인해 제거됨을 뜻합니다.
    reason: lexical_alternative
