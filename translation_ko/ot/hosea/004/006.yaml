id: HOS.4.6
reference: Hosea 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
  footnotes:
  - marker: a
    text: Or 'perish,' 'are silenced,' or 'are cut off' for 'are destroyed.'
    reason: lexical_alternative
  - marker: b
    text: '''Law'' translates Hebrew torah, which can also mean ''instruction.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'your sons' if the masculine plural is taken more narrowly.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성은 지식이 없어서 망합니다[a]. 당신이 지식을 거부하였으므로, 나도 당신이 내게 제사장이 되지 못하게 거부합니다. 당신이 당신의 하나님의 율법[b][c]을 잊었으므로, 나도 당신의 자녀를 잊겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끊어집니다’, ‘잠잠해집니다’, ‘잘려 나갑니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘율법’으로 옮긴 히브리어 토라(תּוֹרָה)는 여기서 ‘가르침’이라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 아들들’로 좁게 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  english_pob_choice: are destroyed
  chosen_korean: 망합니다
  alternatives_korean:
  - 멸망합니다
  - 끊어집니다
  - 소멸됩니다
  lexicon: HALOT
  rationale: 문맥이 심판 선언이므로 단순 소멸보다 파멸·몰락의 결과를 드러내는 ‘망하다’가 자연스럽고 힘이 있습니다.
- source_word: מִבְּלִי הַדָּעַת
  english_pob_choice: for lack of knowledge
  chosen_korean: 지식이 없어서
  alternatives_korean:
  - 지식이 부족해서
  - 지식이 없으므로
  - 알지 못해서
  lexicon: HALOT
  rationale: 부재로 인한 파멸이라는 인과를 한국어로 간결하게 살리기 위해 ‘지식이 없어서’로 옮겼습니다.
- source_word: מִכַּהֵן לִי
  english_pob_choice: from being priest to me
  chosen_korean: 내게 제사장이 되지 못하게
  alternatives_korean:
  - 내게 제사장으로 서지 못하게
  - 내 앞에서 제사장 직분을 맡지 못하게
  lexicon: HALOT
  rationale: כהן의 제의적 역할을 드러내되, ‘being priest to me’의 배제를 한국어의 부정 가능 표현으로 자연스럽게 반영했습니다.
- source_word: תּוֹרַת אֱלֹהֶיךָ
  english_pob_choice: the law of your God
  chosen_korean: 당신의 하나님의 율법
  alternatives_korean:
  - 당신의 하나님의 가르침
  - 당신의 하나님의 토라
  lexicon: HALOT
  rationale: 본문은 언약적 규범의 상실을 가리키므로 ‘율법’이 가장 직접적이며, 토라의 넓은 의미는 각주 없이도 문맥상 유지됩니다.
theological_decisions:
- issue: 제사장 배제의 수사
  chosen_reading: ‘내게 제사장이 되지 못하게’로 옮겨, 하나님께 대한 제사장직의 상실을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘제사장 노릇을 못하게’
  - ‘제사장이 되지 못하게’
  rationale: 히브리어는 단순한 직분 상실이 아니라 하나님을 향한 제의적 접근권의 박탈을 말하므로, 관계성을 살린 표현을 택했습니다.
  doctrine_reference: Hosea 4:6의 언약적 심판 맥락
- issue: 자녀/후손의 의미
  chosen_reading: ‘당신의 자녀’로 옮겨, 히브리어 복수형의 넓은 후손 의미를 반영했습니다.
  alternative_readings:
  - ‘당신의 아들들’
  - ‘당신의 아들 자손’
  rationale: 문맥상 남성 후손에 한정하기보다 전체 후손에 대한 심판을 가리키므로, 한국어에서는 포괄적인 ‘자녀’가 더 정확합니다.
  doctrine_reference: 히브리어 복수형의 포괄적 용법
