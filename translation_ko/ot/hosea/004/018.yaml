  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
  footnotes:
  - marker: a
    text: Or, 'When their drink has gone sour' or 'When their drunkenness is past.' The Hebrew opening is difficult and may refer either to the end of a drinking bout or to drink that has turned aside/spoiled.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'her shields'; likely a metaphor for her rulers or protectors.
    reason: lexical_alternative
  - marker: c
    text: 'The clause ''they dearly love shame'' is difficult Hebrew. Some take the middle term more literally: ''they love, Give shame!'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 술이 떨어지면 그들은 몸을 팔아 음행합니다. 그들의 방패들은 수치를 몹시 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 술이 떨어지면’은 히브리어가 술잔치의 끝이나 술이 시든 상태를 가리킬 수 있어, 본문이 다소 난해합니다.
    reason: source_note
lexical_decisions:
- source_word: סָר סָבְאָם
  english_pob_choice: When their drink is gone
  chosen_korean: 그들의 술이 떨어지면
  alternatives_korean:
  - 그들의 마실 것이 사라지면
  - 그들의 술자리가 끝나면
  - 그들의 취기가 지나가면
  lexicon: HALOT
  rationale: 동사 סָר와 명사 סָבְאָם의 결합은 ‘마시던 상태가 끝남/사라짐’의 뜻을 가지므로, 한국어에서는 자연스럽게 ‘술이 떨어지면’으로 옮겨 음주 장면의 구체성을 살렸습니다.
- source_word: הַזְנֵה הִזְנוּ
  english_pob_choice: they give themselves to prostitution
  chosen_korean: 그들은 몸을 팔아 음행합니다
  alternatives_korean:
  - 그들은 창녀 짓을 합니다
  - 그들은 음행에 빠집니다
  - 그들은 음란하게 행합니다
  lexicon: HALOT
  rationale: 어근 זנה의 성적·언약적 배반 이미지를 유지하되, 현대 한국어에서 과도하게 고어적인 표현을 피하기 위해 ‘몸을 팔아 음행합니다’로 옮겼습니다.
- source_word: קָלוֹן
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  - 불명예
  lexicon: HALOT
  rationale: קָלוֹן은 단순한 부끄러움보다 공적이고 도덕적인 수치/치욕의 뉘앙스가 강하므로 ‘수치’가 가장 직접적입니다.
- source_word: מָגִנֶּיהָ
  english_pob_choice: her shields
  chosen_korean: 그들의 방패들
  alternatives_korean:
  - 그들의 통치자들
  - 그들의 보호자들
  - 그녀의 방패들
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘방패들’이지만, 남성 복수 접미사와 여성 단수 접미사의 흔들림을 고려해 문맥상 지시 대상을 자연스럽게 ‘그들의’로 처리하되, 은유 자체는 보존했습니다.
theological_decisions:
- issue: 호세아의 성적 타락 비유를 완화할지 여부
  chosen_reading: ‘몸을 팔아 음행합니다’로 비유의 거친 성격을 그대로 살렸습니다.
  alternative_readings:
  - ‘그들은 부정합니다’
  - ‘그들은 신실하지 않습니다’
  rationale: 본문은 언약적 배신을 성적 불륜 이미지로 직설적으로 드러내므로, 이를 추상화하면 예언의 충격과 신학적 긴장이 약화됩니다.
  doctrine_reference: Translation philosophy §3, §6
