  - severity: low
    issue: 각주가 ‘위대한 왕’이라는 대안적 이해를 누락함
    rationale: 영어 POB 감사 기록은 야렙을 칭호로 볼 경우 ‘복수하는 왕’ 또는 ‘위대한 왕’이라는 가능성을 보존합니다. 논쟁적인 어휘의 모호성을 충분히 보존하도록 이를 포함하는 것이 안전합니다.
