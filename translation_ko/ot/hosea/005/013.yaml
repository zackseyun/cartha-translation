id: HOS.5.13
reference: Hosea 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨רְא אֶפְרַ֜יִם אֶת חָלְי֗/וֹ וִֽ/יהוּדָה֙ אֶת מְזֹר֔/וֹ וַ/יֵּ֤לֶךְ אֶפְרַ֨יִם֙ אֶל אַשּׁ֔וּר וַ/יִּשְׁלַ֖ח אֶל מֶ֣לֶךְ יָרֵ֑ב וְ/ה֗וּא לֹ֤א יוּכַל֙ לִ/רְפֹּ֣א לָ/כֶ֔ם וְ/לֹֽא יִגְהֶ֥ה מִ/כֶּ֖ם מָזֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
  footnotes:
  - marker: a
    text: Or possibly 'to the avenging king' or 'to the great king'; the Hebrew 'Jareb' may be understood as a title rather than a personal name.
    reason: alternative_reading
translation:
  language: ko
  text: 에브라임이 자신의 병을 보고, 유다가 자신의 상처를 보았습니다. 그때 에브라임은 앗수르로 가서 야렙 왕에게 보냈지만, 그는 여러분을 고칠 수 없으며 여러분의 상처를 낫게 할 수도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야렙 왕’은 고유명사로 읽을 수 있지만, 히브리어는 ‘복수하는 왕’, ‘쟁투하는 왕’, 또는 ‘위대한 왕’이라는 칭호로 이해될 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָלְיוֹ
  english_pob_choice: his sickness
  chosen_korean: 자기의 병
  alternatives_korean:
  - 자기의 질병
  - 자기의 앓음
  lexicon: HALOT
  rationale: 국가적 상태를 비유하는 의료 이미지를 살리기 위해, 현대어로 자연스러운 ‘병’을 택했습니다.
- source_word: מְזֹרוֹ / מָזוֹר
  english_pob_choice: his wound / your wound
  chosen_korean: 자기의 상처 / 여러분의 상처
  alternatives_korean:
  - 자기의 부상 / 여러분의 부상
  - 자기의 종기 / 여러분의 종기
  lexicon: HALOT
  rationale: 문맥상 육체적 상처의 이미지를 유지해야 하므로, 의미를 과도하게 좁히지 않는 ‘상처’로 옮겼습니다.
- source_word: מֶלֶךְ יָרֵב
  english_pob_choice: King Jareb
  chosen_korean: 야렙 왕
  alternatives_korean:
  - 쟁투하는 왕
  - 복수하는 왕
  - 야레브 왕
  lexicon: HALOT
  rationale: POB의 본문은 고유명사처럼 유지하되, 한국어 음역은 현대 표기 관행에 맞춰 ‘야렙’으로 옮겼습니다.
- source_word: לִרְפֹּא / יִגְהֶה
  english_pob_choice: heal / cure
  chosen_korean: 고칠 수는 없으며 ... 낫게 할 수도 없습니다
  alternatives_korean:
  - 치유할 수는 없으며 ... 치료할 수도 없습니다
  - 고쳐 주실 수는 없으며 ... 회복시킬 수도 없습니다
  lexicon: HALOT
  rationale: 두 동사를 각각 살려 반복 구조를 유지하면서도, 한국어에서 자연스럽고 구별되는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘에브라임/유다’의 병과 상처를 현재 청자에게 직접적으로 말하는 2인칭으로 전환할지 여부
  chosen_reading: 마지막 절의 ‘여러분’을 유지해, 예언적 경고의 직접성을 살렸습니다.
  alternative_readings:
  - 모든 인칭을 3인칭으로 맞춰 ‘그들을’로 옮김
  - 본문을 따라 일관되게 2인칭을 유지
  rationale: 히브리어 본문은 마지막 두 동사에서 2인칭 복수 대상을 사용하므로, 예언의 직접 경고라는 수사를 드러내기 위해 한국어도 이를 반영했습니다.
  doctrine_reference: 예언문학의 수사적 전환과 청중 직접 호소
- issue: ‘지금까지의 정치적 의존’에 대한 신학적 평가
  chosen_reading: 앗수르와 야렙 왕은 치유의 근원이 될 수 없다는 점을 분명히 했습니다.
  alternative_readings:
  - 정치적 동맹 자체를 중립적으로 서술
  - 치유 불가능성 대신 단순한 실패로 약화
  rationale: 문맥상 핵심은 인간 동맹이 언약 심판을 치료하지 못한다는 데 있으므로, 부정적 평가를 약화하지 않았습니다.
  doctrine_reference: 언약적 심판과 우상화된 외교 의존에 대한 선지자적 비판
