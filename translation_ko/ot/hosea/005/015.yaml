id: HOS.5.15
reference: Hosea 5:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
  footnotes:
  - marker: a
    text: Or, 'until they bear their guilt' or 'until they are found guilty.' The Hebrew verb can denote guilt incurred or guilt acknowledged; the context of seeking the LORD favors 'acknowledge their guilt.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they will seek me early.' The Hebrew idiom likely expresses diligent or earnest seeking rather than merely seeking at an early hour.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 가고 내 처소로 돌아가리라. 그들이 자기 죄를 인정하고 내 얼굴을 찾을 때까지이며, 그들이 환난 중에 나를 간절히 찾으리라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 죄를 인정하다’는 יֶאְשְׁמוּ의 한 해석입니다. 이 동사는 ‘죄책을 지다’ 또는 ‘유죄가 되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간절히 찾다’는 יְשַׁחֲרֻנְנִי의 관용적 의미를 따른 번역입니다. 직역하면 ‘일찍 나를 찾다’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ / אָשׁוּבָה
  english_pob_choice: I will go / I will return
  chosen_korean: 내가 가고 내 처소로 돌아가리라
  alternatives_korean:
  - 내가 가서 내 곳으로 돌아가리라
  - 내가 떠나 내 거처로 돌아가리라
  lexicon: HALOT
  rationale: הלך와 שוב의 연속 동작을 한국어에서도 간결한 평행 구조로 살리되, מקום을 문맥에 맞게 ‘처소’로 옮겨 하나님의 물러가심을 공간적 이미지로 유지했습니다.
- source_word: יֶאְשְׁמוּ
  english_pob_choice: they acknowledge their guilt
  chosen_korean: 자기 죄를 인정하고
  alternatives_korean:
  - 자기 죄를 지고
  - 죄책을 깨닫고
  - 유죄로 드러나고
  lexicon: HALOT
  rationale: 이 동사는 ‘죄책을 지다’와 ‘죄를 인정하다’의 여지가 있으나, 뒤따르는 ‘내 얼굴을 찾고’와 평행을 이루는 회개적 흐름을 살려 ‘죄를 인정하다’로 옮겼습니다.
- source_word: וּבִקְשׁוּ פָנַי
  english_pob_choice: and seek my face
  chosen_korean: 내 얼굴을 찾을 때까지
  alternatives_korean:
  - 나를 찾을 때까지
  - 내 은혜를 구할 때까지
  lexicon: HALOT
  rationale: ‘얼굴을 찾다’는 히브리어 관용을 보존하여 하나님의 임재와 관계 회복의 뉘앙스를 유지했습니다.
- source_word: יְשַׁחֲרֻנְנִי
  english_pob_choice: they will seek me earnestly
  chosen_korean: 그들이 환난 중에 나를 간절히 찾으리라
  alternatives_korean:
  - 그들이 환난 중에 나를 일찍 찾으리라
  - 그들이 환난 중에 나를 부지런히 찾으리라
  lexicon: HALOT
  rationale: שׁחר의 직역인 ‘이르게 찾다’보다 관용적 의미인 ‘간절히 찾다’가 문맥의 강한 추구를 더 정확히 드러내므로, POB의 해석을 따라 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 물러가심의 성격
  chosen_reading: ‘내가 가고… 돌아가리라’를 언약적 심판의 철수로 옮기되, 형이상학적 부재나 완전한 버림으로 단정하지 않았습니다.
  alternative_readings:
  - 절대적 버림
  - 인간의 체감상 부재
  rationale: 본문은 관계적·사법적 철수를 말하며, 회개와 ‘내 얼굴’ 찾기를 통해 다시 만남의 여지를 남깁니다. 이 긴장을 그대로 보존했습니다.
  doctrine_reference: 언약적 심판과 회복의 긴장
- issue: 직접목적어 ‘내 얼굴’의 신학적 기능
  chosen_reading: ‘내 얼굴’은 단순한 시선이 아니라 하나님의 임재와 호의 회복을 가리키는 관용으로 유지했습니다.
  alternative_readings:
  - 내게로 돌아옴
  - 내 호의를 구함
  rationale: 히브리어 관용을 풀어 쓰면 의미는 전달되지만, 본문의 예언적·예배적 울림이 약해질 수 있어 직역적 표현을 채택했습니다.
  doctrine_reference: 성경적 관용구 보존
