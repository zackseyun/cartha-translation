  source_fidelity: 원문의 세 차례 청각 명령, 세 대상(제사장들·이스라엘의 집·왕의 집), 그리고 미스바와 다볼의 올무/그물 비유를 유지합니다. 다만 초안의 ‘넷’은 명백한 오기이며, ‘그물이 펼쳐져 있었다’라고만 하면 ‘너희가 … 그물이 되었다’는 히브리어의 주어와 술어 관계가 약화됩니다. 이를 바로잡았습니다. לָכֶם הַמִּשְׁפָּט의 압축성과 가능한 불리한 의미는 본문과 각주에서 보존했습니다.
