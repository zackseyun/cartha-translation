id: HOS.5.1
reference: Hosea 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
  footnotes:
  - marker: a
    text: Or 'For the judgment is against you.' The Hebrew phrase is compact and may mean either that judgment pertains to them or is directed against them.
    reason: alternative_reading
  - marker: b
    text: Mizpah and Tabor are place names, likely evoking well-known sites in Israel associated here with entrapment imagery.
    reason: cultural_note
translation:
  language: ko
  text: 이것을 들으십시오, 제사장들이여. 주의를 기울이십시오, 이스라엘의 집이여. 귀를 기울이십시오, 왕의 집이여. 심판은 너희에게 해당합니다.[a] 너희가 미스바에서는 올무가 되었고, 다볼 위에서는 펼쳐진 그물이 되었기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축되어 있어 ‘심판이 너희와 관련되어 있다’는 뜻일 수도 있고, ‘심판이 너희를 향한다’는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 미스바와 다볼은 지명입니다. 여기서는 올무와 그물의 비유와 관련하여 언급됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  english_pob_choice: Hear this
  chosen_korean: 이것을 들으십시오
  alternatives_korean:
  - 들으십시오
  - 이 말을 들으십시오
  lexicon: HALOT
  rationale: 예언적 소환의 첫 명령형을 자연스러운 현대 한국어로 옮기면서, 지시대명사 ‘이것’으로 המקרא의 직접적 호소를 유지했습니다.
- source_word: הַקְשִׁיבוּ
  english_pob_choice: pay attention
  chosen_korean: 주의를 기울이십시오
  alternatives_korean:
  - 귀 기울이십시오
  - 주의하십시오
  lexicon: HALOT
  rationale: 첫 번째 ‘듣다’보다 강한 집중 요구를 드러내기 위해, 주의를 집중하라는 의미를 분명히 살렸습니다.
- source_word: הַאֲזִינוּ
  english_pob_choice: give ear
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 들으십시오
  - 귀 기울이십시오
  lexicon: HALOT
  rationale: 세 번째 청각 명령을 앞선 두 표현과 구별되게 유지하여, 히브리어의 수사적 고조를 반영했습니다.
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  english_pob_choice: For the judgment is for you
  chosen_korean: 심판이 너희에게 있기 때문입니다
  alternatives_korean:
  - 심판이 너희를 향하기 때문입니다
  - 판결이 너희에게 있기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘권리’보다 예언적 책망과 심판의 뜻이 분명하므로 ‘심판’을 택했고, לָכֶם의 압축성을 ‘너희에게’로 최대한 보존했습니다.
- source_word: פַח
  english_pob_choice: trap
  chosen_korean: 올무
  alternatives_korean:
  - 덫
  - 함정
  lexicon: HALOT
  rationale: 포획 도구의 비유를 한국어 성경 문맥에서 익숙하면서도 함의가 분명한 ‘올무’로 옮겼습니다.
- source_word: רֶשֶׁת פְּרוּשָׂה
  english_pob_choice: a net spread out
  chosen_korean: 넷이 펼쳐져 있었고
  alternatives_korean:
  - 펼쳐진 그물이었고
  - 그물이 펼쳐져 있었고
  lexicon: HALOT
  rationale: 히브리어의 상태 묘사를 살리기 위해 진행/완료의 모습으로 옮겼으며, 시적 병렬을 위해 ‘~였고’ 구조를 사용했습니다.
theological_decisions:
- issue: כִּי לָכֶם הַמִּשְׁפָּט의 의미
  chosen_reading: 문맥상 하나님이 그들을 향해 내리시는 심판으로 읽되, 히브리어의 압축성은 열어 둡니다.
  alternative_readings:
  - ‘심판이 너희에게 속해 있다’는 중립적 법적 의미
  - ‘판결이 너희의 몫이다’라는 제도적 의미
  rationale: 바로 뒤의 ‘올무’와 ‘넷’ 이미지가 책망과 유죄성을 강화하므로, 한국어 본문은 심판의 뉘앙스를 분명히 하되 원문의 압축된 표현을 과도하게 확장하지 않았습니다.
  doctrine_reference: 예언서의 언약 심판 모티프
