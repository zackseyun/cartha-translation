  text: וַ/אֲנִ֥י כָ/עָ֖שׁ לְ/אֶפְרָ֑יִם וְ/כָ/רָקָ֖ב לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
  footnotes:
  - marker: a
    text: Or 'like decay' or 'like rottenness.' The Hebrew image is of internal corruption and wasting away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 에브라임에게는 나방 같고, 유다 집에는 썩음 같겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부패’ 혹은 ‘썩어감’입니다. 히브리어 이미지는 내부에서 진행되는 부패와 소모를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: So I
  chosen_korean: 그러므로 내가
  alternatives_korean:
  - 그리고 내가
  - 하지만 내가
  lexicon: HALOT
  rationale: 독립 대명사와 접속 표현이 새 단락의 신적 선언을 이끄는 점을 반영하면서, 앞선 책망과 심판의 흐름에 따른 결과를 자연스럽게 살렸습니다.
- source_word: כָעָשׁ
  english_pob_choice: like a moth
  chosen_korean: 나방 같고
  alternatives_korean:
  - 나방처럼
  - 좀벌레 같고
  lexicon: HALOT
  rationale: 원문의 비유를 그대로 살려, 서서히 갉아먹고 훼손하는 이미지를 유지했습니다.
- source_word: וְכָרָקָב
  english_pob_choice: and like rot
  chosen_korean: 썩음 같겠습니다
  alternatives_korean:
  - 썩어짐 같겠습니다
  - 부패 같겠습니다
  - 썩은 것 같겠습니다
  lexicon: HALOT
  rationale: רָקָב의 핵심 뜻인 내부적 부패와 붕괴를 간결하게 드러내기 위해 ‘썩음’을 택했습니다.
- source_word: לְאֶפְרָיִם / לְבֵית יְהוּדָה
  english_pob_choice: to Ephraim / to the house of Judah
  chosen_korean: 에브라임에게 / 유다 집에는
  alternatives_korean:
  - 에브라임에 / 유다 집에
  - 에브라임을 향해 / 유다 집을 향해
  lexicon: HALOT
  rationale: 에브라임과 유다 집이라는 히브리어의 구체적 집단 지칭을 유지했고, ל-의 대상/관계 표지를 한국어 조사로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 자기비유를 직설적 심판 이미지로 보존할지 여부
  chosen_reading: ‘나방’과 ‘썩음’이라는 명사적 비유를 유지하여, 하나님이 에브라임과 유다에 대해 점진적 파괴의 심판자로 자신을 드러내는 원문 이미지를 보존했습니다.
  alternative_readings:
  - ‘나방처럼 갉아먹겠다’처럼 동사적으로 풀어 쓰는 번역
  rationale: 원문은 명시적 동사 설명보다 비유 자체를 전면에 둡니다. 이를 보존하는 편이 예언 문체의 날카로움과 긴장을 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve the source text''s plain sense without paraphrase beyond what it warrants.'
