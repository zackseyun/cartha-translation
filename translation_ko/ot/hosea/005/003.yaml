  source_fidelity: ‘몸을 팔다’는 현대 한국어에서 주로 생계형 성매매를 뜻하여, 호세아서의 언약 배반을 고발하는 비유적 동사 הִזְנֵיתָ의 의미를 지나치게 좁힐 수 있습니다. ‘음행하였습니다’는 성적 비유를 유지하면서도 본문의 고발적·예언적 용법을 더 충실히 전달합니다. כִּי עַתָּה의 설명적 연결은 ‘이제 … 하였으므로’로 반영했습니다.
  naturalness: ‘지금은, 에브라임아’는 한국어 문맥에서 다소 부자연스럽고 문장 연결이 약합니다. ‘에브라임아, 네가 이제 음행하였으므로’가 현대적인 합쇼체 문장으로 자연스럽습니다. ‘내게 숨겨져 있지 않습니다’도 수동 의미를 자연스럽게 보존합니다.
  terminology: 에브라임, 이스라엘은 유지했습니다. טמא의 결과적 도덕적·예전적 오염은 ‘더럽혀졌습니다’로 유지했습니다. 성적 은유는 ‘음행’ 및 각주에서 ‘창녀 노릇’이라는 직역적 표현으로 명시하되, 특정 교리적 해석을 본문에 덧붙이지 않았습니다.
