base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
  footnotes:
  - marker: a
    text: Or, 'you have played the prostitute.' The Hebrew uses prostitution imagery for covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Israel has become unclean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 에브라임을 압니다. 이스라엘은 내게 숨겨져 있지 않습니다. 에브라임아, 네가 이제 음행하였으므로[a] 이스라엘이 더럽혀졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘네가 창녀 노릇을 하였다.’ 히브리어는 언약에 대한 불성실을 성적 매춘의 이미지로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘이스라엘은 부정하게 되었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 내가 … 압니다
  alternatives_korean:
  - 내가 … 알고 있습니다
  - 내가 … 알았습니다
  lexicon: HALOT
  rationale: 하나님의 지속적이고 현재적인 인식을 드러내기 위해 한국어 현재형을 사용했습니다. 문맥상 단순 과거보다 ‘압니다’가 예언적 선언의 힘을 더 잘 살립니다.
- source_word: נִכְחַד מִמֶּנִּי
  english_pob_choice: is not hidden from me
  chosen_korean: 내게서 숨겨지지 않습니다
  alternatives_korean:
  - 내게서 감춰지지 않습니다
  - 내게서 숨을 수 없습니다
  lexicon: HALOT
  rationale: 수동적 ‘숨겨지다/감춰지다’의 의미를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: הִזְנֵיתָ
  english_pob_choice: you have played the prostitute
  chosen_korean: 네가 몸을 팔았습니다
  alternatives_korean:
  - 네가 창녀처럼 행동했습니다
  - 네가 음행을 저질렀습니다
  - 네가 창기 노릇을 했습니다
  lexicon: HALOT
  rationale: 호세아서의 언약 불성실 비유를 흐리지 않으면서, 현대 한국어 독자가 즉시 감지할 수 있는 노골성을 유지하기 위해 직설적으로 옮겼습니다. ‘몸을 팔다’는 성적·언약적 함의를 함께 전달합니다.
- source_word: נִטְמָא
  english_pob_choice: is defiled
  chosen_korean: 더럽혀졌습니다
  alternatives_korean:
  - 부정하게 되었습니다
  - 부정해졌습니다
  - 더럽습니다
  lexicon: HALOT
  rationale: 결과 상태를 나타내는 수동 표현으로 옮겨, 도덕적·예전적 오염의 뉘앙스를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 언약 불성실의 성적 은유를 얼마나 직접적으로 살릴지
  chosen_reading: 주된 은유를 완화하지 않고 ‘몸을 팔다’로 직접 유지했습니다.
  alternative_readings:
  - ‘불성실했습니다’로 완화
  - ‘음행을 저질렀습니다’로 일반화
  rationale: 호세아서의 신학적 고발은 성적 은유를 통해 언약 파기를 드러냅니다. 이를 완화하면 예언적 충격과 본문의 직접성이 줄어듭니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
