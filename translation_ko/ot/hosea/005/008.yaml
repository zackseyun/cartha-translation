  text: תִּקְע֤וּ שׁוֹפָר֙ בַּ/גִּבְעָ֔ה חֲצֹצְרָ֖ה בָּ/רָמָ֑ה הָרִ֨יעוּ֙ בֵּ֣ית אָ֔וֶן אַחֲרֶ֖י/ךָ בִּנְיָמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
  footnotes:
  - marker: a
    text: Beth-aven likely functions as a polemical name for Bethel, sounding like 'house of wickedness' or 'house of vanity.'
    reason: cultural_note
  - marker: b
    text: 'Or ''Sound the alarm at Beth-aven: The enemy is behind you, Benjamin!'''
    reason: lexical_alternative
translation:
  language: ko
  text: 기브아에서 나팔을 불고, 라마에서 뿔나팔을 불며, 벧아웬에서 전쟁 함성을 높이십시오. “베냐민아, 네 뒤에 있다!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벧아웬은 베델을 겨냥한 조롱성 이름으로 쓰였을 가능성이 있으며, ‘사악함의 집’ 또는 ‘헛됨의 집’이라는 말놀이를 연상시킵니다.
    reason: cultural_note
  - marker: b
    text: '또는 ‘벧아웬에서 경보를 울리십시오: 원수가 네 뒤에 있다, 베냐민아!’로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  english_pob_choice: Blow the horn
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 뿔나팔을 불고
  - 호른을 불고
  lexicon: HALOT
  rationale: תִּקְעוּ는 악기를 불어 울리라는 군사적 명령이고, שׁוֹפָר는 금속 나팔과 구별되는 뿔나팔 계열이므로, 앞 절은 일반적 기능을 살려 ‘나팔을 불고’로 옮겼습니다.
- source_word: חֲצֹצְרָה
  english_pob_choice: the trumpet
  chosen_korean: 뿔나팔
  alternatives_korean:
  - 나팔
  - 트럼펫
  lexicon: HALOT
  rationale: 앞의 שׁוֹפָר와 다른 악기이므로, 한국어에서도 구별이 드러나도록 ‘뿔나팔’로 구체화했습니다.
- source_word: הָרִיעוּ
  english_pob_choice: raise the battle cry
  chosen_korean: 전쟁 함성을 높이십시오
  alternatives_korean:
  - 외치십시오
  - 경보를 울리십시오
  - 함성을 지르십시오
  lexicon: HALOT
  rationale: 전쟁 경보의 뉘앙스를 살리면서도, 단순한 ‘외치다’보다 군사적 급박함이 드러나도록 ‘전쟁 함성을 높이다’로 옮겼습니다.
- source_word: בֵּית אָוֶן
  english_pob_choice: Beth-aven
  chosen_korean: 벧아웬
  alternatives_korean:
  - 벧에웬
  - 벧아벤
  - 사악함의 집
  lexicon: HALOT
  rationale: 본문의 고유 지명을 음역으로 보존해, 베델을 겨냥한 조롱성 별칭이라는 해석은 본문이 아니라 주해층에서 다루도록 했습니다.
theological_decisions:
- issue: בֵּית אָוֶן의 조롱성 의미를 본문에 직접 풀어쓸지 여부
  chosen_reading: 본문에는 ‘벧아웬’을 유지하고, 함의는 독자가 인지할 수 있도록 간접적으로 남깁니다.
  alternative_readings:
  - ‘사악함의 집’으로 번역
  - ‘벧엘’로 대체
  rationale: 히브리어는 지명 형식으로 제시되므로, 본문에서 해석을 덧씌우기보다 원문 형태를 보존하는 편이 더 투명합니다. 다만 호세아의 풍자적 의도는 번역이 지우지 않도록 해야 합니다.
  doctrine_reference: 'Translation philosophy: Translate titles; transliterate names; Preserve theological tension rather than resolve it.'
