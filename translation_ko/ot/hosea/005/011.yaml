  text: עָשׁ֥וּק אֶפְרַ֖יִם רְצ֣וּץ מִשְׁפָּ֑ט כִּ֣י הוֹאִ֔יל הָלַ֖ךְ אַחֲרֵי צָֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: ko
  text: 에브라임은 억압을 당하고, 공의로 말미암아 짓눌렸습니다. 그가 더러움을 따라가기로 작정하였기 때문입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘심판’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 מִשְׁפָּט는 ‘공의’, ‘심판’, ‘재판’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׁוּק
  english_pob_choice: is oppressed
  chosen_korean: 억압을 당하고
  alternatives_korean:
  - 압제를 받고
  - 억눌리고
  lexicon: עָשׁוּק
  rationale: 수동적 피해 상태를 드러내기 위해 ‘억압을 당하다’를 택했습니다. 다만 문맥상 계속되는 상태를 자연스럽게 보이도록 연결형으로 처리했습니다.
- source_word: רְצ֣וּץ
  english_pob_choice: crushed
  chosen_korean: 짓눌렸습니다
  alternatives_korean:
  - 부서졌습니다
  - 꺾였습니다
  lexicon: רָצַץ
  rationale: ‘crushed’의 물리적·폭력적 강도를 살리기 위해 ‘짓눌리다’를 선택했습니다.
- source_word: מִשְׁפָּ֑ט
  english_pob_choice: in judgment
  chosen_korean: 공의로 말미암아
  alternatives_korean:
  - 심판으로
  - 재판으로
  lexicon: מִשְׁפָּט
  rationale: 여기서는 단순한 법정 절차보다 하나님 앞의 공의/정의 질서가 무너진 결과라는 뜻이 강하므로 ‘공의’를 택했습니다.
- source_word: צָו
  english_pob_choice: filth
  chosen_korean: 더러움
  alternatives_korean:
  - 오물
  - 부정함
  - 더러운 것
  lexicon: צָו
  rationale: POB의 ‘filth’를 반영하되, 한국어에서 도덕적·종교적 부정성을 전달하는 가장 무난한 표현으로 ‘더러움’을 사용했습니다.
theological_decisions:
- issue: מִשְׁפָּט의 범위
  chosen_reading: ‘공의’로 번역해 단순한 법정 판결이 아니라 언약적·도덕적 질서의 파괴를 드러냈습니다.
  alternative_readings:
  - ‘심판’으로 번역해 징계의 의미를 강조하는 읽기
  - ‘재판’으로 번역해 사법적 처분을 강조하는 읽기
  rationale: 문맥상 이 절은 에브라임이 왜 짓눌렸는지를 설명하므로, 결과의 원인을 하나님의 정의 질서와 연결하는 번역이 더 넓은 본문 의미를 보존합니다.
  doctrine_reference: 구약의 מִשְׁפָּט는 종종 사법적 판결을 넘어 하나님의 공의와 질서를 가리킵니다.
