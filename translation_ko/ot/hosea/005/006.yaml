id: HOS.5.6
reference: Hosea 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
  footnotes:
  - marker: a
    text: Or 'he has departed from them' or 'he has removed himself from them.'
    reason: lexical_alternative
  - marker: b
    text: The mention of flocks and herds likely implies coming with sacrificial animals to seek the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 양 떼와 소 떼를 데리고[a] 야훼를 찾으러 가겠지만, 그분을 찾지 못할 것입니다. 그분은 그들에게서 떠나셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 양 떼와 소 떼는 제사 동물을 데리고 나아가는 제의적 접근을 시사합니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 חָלַץ는 여기서 ‘떠나다’ 또는 ‘물러나다’라는 관계적 단절을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם
  english_pob_choice: with their flocks
  chosen_korean: 양 떼를 데리고
  alternatives_korean:
  - 그들의 양 떼와 함께
  - 그들의 양 떼를 가지고
  lexicon: HALOT
  rationale: צֹאן은 양 떼를 가리키며, 전치 ב는 동반/수단의 뜻으로 쓰였으므로 한국어에서는 자연스럽게 ‘데리고’로 옮겨 동반적 뉘앙스를 살렸습니다.
- source_word: וּבִבְקָרָם
  english_pob_choice: and with their herds
  chosen_korean: 소 떼를 데리고
  alternatives_korean:
  - 그리고 그들의 소 떼와 함께
  - 그리고 그들의 가축 떼를
  lexicon: HALOT
  rationale: בָּקָר은 대체로 소 떼를 가리키며, 앞의 ‘양 떼’와 대응시키기 위해 ‘소 떼’로 옮겼습니다.
- source_word: יֵלְכוּ לְבַקֵּשׁ
  english_pob_choice: they will go to seek
  chosen_korean: 찾으러 가겠지만
  alternatives_korean:
  - 찾기 위해 가겠지만
  - 구하려고 가겠지만
  lexicon: HALOT
  rationale: 히브리어의 동사 연속은 목적을 띤 이동을 나타내므로, 현대 한국어에서는 ‘찾으러 가다’가 가장 자연스럽고 목적 관계도 분명하게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 표기 대신 학술적 음역인 ‘야훼’를 사용해 고유한 신명자를 보존했습니다.
- source_word: וְלֹא יִמְצָאוּ
  english_pob_choice: but they will not find him
  chosen_korean: 그분을 찾지 못할 것입니다
  alternatives_korean:
  - 그를 찾지 못할 것입니다
  - 그러나 찾지 못할 것입니다
  lexicon: HALOT
  rationale: 하나님을 목적어로 둘 때 ‘찾다’는 관계적·은총적 발견을 뜻하므로, 한국어에서도 대상을 분명히 하여 ‘그분을’로 옮겼습니다.
- source_word: חָלַץ מֵהֶם
  english_pob_choice: he has withdrawn from them
  chosen_korean: 그분이 그들에게서 떠나셨기 때문입니다
  alternatives_korean:
  - 그분이 그들에게서 물러나셨기 때문입니다
  - 그분이 그들을 떠나셨기 때문입니다
  lexicon: HALOT
  rationale: חָלַץ는 여기서 ‘물러나다/떠나다’의 관계적 단절을 나타내므로, 완료된 상태를 현재 결과와 함께 드러내는 ‘떠나셨기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼를 찾는 행위의 의미
  chosen_reading: 양 떼와 소 떼를 데리고 찾아가지만, 이미 떠나신 야훼를 만나지 못하는 심판의 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 종교적으로 하나님을 찾으려 했으나 실패한 일반 진술로 읽을 수 있습니다.
  rationale: 가축의 언급은 제의적 접근을 시사하므로, 본문은 ‘찾기’ 자체를 비판한다기보다 야훼의 이미 떠나신 상태 때문에 그들의 제의가 무효가 된다는 점을 드러냅니다.
  doctrine_reference: Hosea 5:6 context; divine withdrawal in covenant judgment
