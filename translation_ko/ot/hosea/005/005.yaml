  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
  footnotes:
  - marker: a
    text: Or 'The majesty of Israel testifies to his face' / 'before him.' The Hebrew can be read with a more literal spatial idiom, but the main text renders the likely judicial sense.
    reason: lexical_alternative
  - marker: b
    text: '''In their guilt'' may also be rendered ''in their iniquity'' or ''because of their guilt.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'Judah also will stumble with them.' The Hebrew verb form differs from the previous clause and may be understood in more than one temporal sense.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘의 교만이 그의 얼굴 앞에서 그를 증언하며, 이스라엘과 에브라임은 자기들의 죄악 때문에 걸려 넘어질 것입니다. 유다도 그들과 함께 걸려 넘어질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘이스라엘의 위엄/교만이 그의 얼굴 앞에서’로도 읽을 수 있으나, 본문은 법정적 의미를 살려 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘자기들의 죄악’은 ‘자기들의 죄책’ 또는 ‘죄악으로 말미암아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 유다의 동사는 앞 절과 같은 미래형으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  english_pob_choice: testifies
  chosen_korean: 증언하며
  alternatives_korean:
  - 대답하며
  - 증언합니다
  - 고발하며
  lexicon: HALOT
  rationale: 문맥이 법정적 고발이므로 ענה를 단순한 ‘대답’보다 ‘증언’으로 옮겨, 이스라엘의 교만이 오히려 불리한 증거가 된다는 뜻을 살렸습니다.
- source_word: גְאֽוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 위엄
  - 자존심
  - 긍지
  lexicon: HALOT
  rationale: 이 구절은 심판과 책망의 맥락이어서 중립적 ‘위엄’보다 도덕적 뉘앙스가 분명한 ‘교만’이 원문의 의도를 더 잘 드러냅니다.
- source_word: בְּפָנָיו
  english_pob_choice: against him
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그에게 대하여
  - 그를 향해
  - 그의 앞에서
  lexicon: HALOT
  rationale: 영어 본문처럼 법정적 의미를 살리되, 히브리어의 직역적 공간 관용구를 어느 정도 보존해 ‘얼굴 앞에서’로 옮겼습니다.
- source_word: בַּעֲוֺנָם
  english_pob_choice: in their guilt
  chosen_korean: 자기들의 죄악 때문에
  alternatives_korean:
  - 자기들의 죄악 가운데
  - 자기들의 죄책 속에서
  - 자기들의 악행 때문에
  lexicon: HALOT
  rationale: עון은 죄악과 그 책임/형벌을 함께 가리킬 수 있으므로, 한국어에서는 결과 원인을 드러내는 ‘때문에’를 써서 넘어짐의 근거를 자연스럽게 전달했습니다.
- source_word: יִכָּשְׁלוּ / כָּשַׁל
  english_pob_choice: will stumble
  chosen_korean: 걸려 넘어질 것입니다
  alternatives_korean:
  - 넘어질 것입니다
  - 비틀거릴 것입니다
  - 실족할 것입니다
  lexicon: HALOT
  rationale: כשל의 핵심 이미지는 ‘발이 걸려 넘어짐’이므로, 은유를 살리면서도 현대 한국어에서 읽기 자연한 ‘걸려 넘어질 것입니다’를 택했습니다.
