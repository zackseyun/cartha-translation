source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
  footnotes:
  - marker: a
    text: Or 'a spirit of prostitution' or 'a spirit of harlotry.' The Hebrew uses sexual-infidelity imagery for covenant unfaithfulness and idolatry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 행위는 그들이 그들의 하나님께로 돌아오지 못하게 합니다. 그들 안에는 음행의 영이 있어서[a], 야훼를 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음란의 영’, ‘창기의 영’. 히브리어는 성적 불충실의 이미지를 통해 언약 불신실성과 우상숭배를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנוּ
  english_pob_choice: do not allow
  chosen_korean: 돌아오지 못하게 합니다
  alternatives_korean:
  - 돌아오도록 허락하지 않습니다
  - 돌아올 수 없게 합니다
  lexicon: HALOT
  rationale: נתן의 부정형이 여기서는 ‘허락하다’의 관용적 의미로 쓰여, 행위가 회개와 귀환을 가로막는다는 뜻이므로 한국어로는 자연스럽게 ‘돌아오지 못하게 합니다’라고 옮겼습니다.
- source_word: מַעַלְלֵיהֶם
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 행적
  - 그들의 행실
  lexicon: HALOT
  rationale: עֲלָלִים 계열의 명사는 단순한 행동보다 도덕적 평가가 담긴 ‘행위’가 적절하며, 호세아의 책망 어조를 살릴 수 있습니다.
- source_word: רוּחַ זְנוּנִים
  english_pob_choice: a spirit of whoredom
  chosen_korean: 음행의 영
  alternatives_korean:
  - 음란의 영
  - 창기의 영
  lexicon: HALOT
  rationale: 예언서의 언약 불신실성 은유를 유지하되, 한국어에서 ‘whoredom’의 직설성과 상징성을 함께 담기 위해 ‘음행의 영’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와가 아니라 신명기적 텍스트의 고유한 신명을 드러내기 위해 프로젝트 기본값인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: ‘알다’의 언약적 의미
  chosen_reading: ‘야훼를 알지 못합니다’로 유지해 관계적·언약적 인식을 보존했습니다.
  alternative_readings:
  - 야훼를 인정하지 않습니다
  - 야훼와 관계가 없습니다
  rationale: ידע는 단순 인지가 아니라 언약 관계를 포함하므로, 해설적 표현으로 좁히지 않고 원문의 긴장을 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘음행의 영’의 예언적 은유
  chosen_reading: 성적 배경을 약화시키지 않는 직설적 표현을 택했습니다.
  alternative_readings:
  - 부정한 영
  - 음란한 영
  rationale: 호세아는 우상숭배와 언약 파기를 혼인/성적 은유로 고발하므로, 완곡한 표현보다 예언적 충격을 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3
