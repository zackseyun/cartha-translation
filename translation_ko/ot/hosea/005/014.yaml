  - severity: medium
    issue: 아주 분명한 ‘carry off’의 의미가 ‘가져갈’에서 약화됨
    rationale: אֶשָּׂא는 포식자 비유 안에서 빼앗아 가져가는 행위를 가리킵니다. ‘빼앗아 갈 것’이 자연스러우면서도 원문의 위협적 이미지를 더 잘 보존합니다.
  - severity: low
