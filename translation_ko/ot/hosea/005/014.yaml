source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֤י כַ/שַּׁ֨חַל֙ לְ/אֶפְרַ֔יִם וְ/כַ/כְּפִ֖יר לְ/בֵ֣ית יְהוּדָ֑ה אֲנִ֨י אֲנִ֤י אֶטְרֹף֙ וְ/אֵלֵ֔ךְ אֶשָּׂ֖א וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
  footnotes:
  - marker: a
    text: Or 'fierce lion' for the first lion image; the Hebrew term can carry a nuance of strength or ferocity.
    reason: lexical_alternative
  - marker: b
    text: Or 'none can deliver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 에브라임에게는 사자 같고, 유다 집에는 젊은 사자 같으니라. 내가, 바로 내가 찢고 지나갈 것이며, 내가 가져갈 것이요, 구해 줄 자가 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사자’는 본문의 שַּׁחַל이 지닌 기본 의미를 따랐습니다. 이 단어는 ‘사나운 사자’의 뉘앙스를 띨 수 있지만, 여기서는 평행문과 동사들이 이미 위협성을 충분히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구해 줄 자가 없을 것입니다’는 문자적으로는 ‘건져 줄 자가 없다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָנֹכִי כַשַּׁחַל לְאֶפְרַיִם
  english_pob_choice: For I am like a lion to Ephraim
  chosen_korean: 에브라임에게는 사자 같고
  alternatives_korean:
  - 에브라임에게는 사나운 사자 같고
  - 에브라임에게는 사자처럼
  lexicon: HALOT
  rationale: שַּׁחַל은 기본적으로 ‘사자’이며, 본문 뒤의 포식 동작이 이미 위협의 강도를 드러내므로 ‘사나운’을 덧붙이지 않고 간결하게 옮겼습니다.
- source_word: וְכַכְּפִיר לְבֵית יְהוּדָה
  english_pob_choice: and like a young lion to the house of Judah
  chosen_korean: 유다 집에는 젊은 사자 같으니라
  alternatives_korean:
  - 유다 집에는 사자 새끼 같으니라
  - 유다 집에는 어린 사자 같으니라
  lexicon: HALOT
  rationale: כְּפִיר은 ‘젊은 사자’가 가장 자연스럽고, ‘사자 새끼’보다 시적 평행을 더 잘 살립니다.
- source_word: אֲנִי אֲנִי אֶטְרֹף וְאֵלֵךְ אֶשָּׂא
  english_pob_choice: I, I myself, will tear and go away; I will carry off
  chosen_korean: 내가, 바로 내가 찢고 지나갈 것이며, 내가 가져갈 것이요
  alternatives_korean:
  - 내가, 내가 스스로 찢고 가버릴 것이며, 내가 빼앗아 갈 것이요
  - 내가, 내가 직접 찢고 떠날 것이며, 내가 운반해 갈 것이요
  lexicon: HALOT
  rationale: 반복된 אָנֹכִי/אֲנִי는 강한 강조이므로 ‘내가, 바로 내가’로 살렸고, אֶטְרֹף와 אֶשָּׂא는 포식자 이미지에 맞게 ‘찢고 지나갈’과 ‘가져갈’로 자연스럽게 옮겼습니다.
- source_word: וְאֵין מַצִּיל
  english_pob_choice: and there is no one to rescue
  chosen_korean: 구해 줄 자가 없을 것입니다
  alternatives_korean:
  - 건져 줄 자가 없을 것입니다
  - 구원할 자가 없을 것입니다
  lexicon: HALOT
  rationale: מַצִּיל은 즉각적인 구조자를 가리키므로 ‘구해 줄 자’가 가장 직관적이며, 문맥상 무력함을 분명히 드러냅니다.
theological_decisions:
- issue: 여호와의 자신 계시가 포식자 이미지로 표현되는 점
  chosen_reading: 심판의 맥락에서 사자 비유를 그대로 유지해, 에브라임과 유다에 대한 파괴적 심판을 직접적으로 드러냈습니다.
  alternative_readings:
  - 이미지를 완화하여 일반적 징벌 표현으로 바꾸기
  - 사자 비유를 은유적으로만 흐리게 처리하기
  rationale: 히브리어는 사자/젊은 사자와 이어지는 포식 동사를 분명히 사용하므로, 이를 약화하면 본문의 심판 경고가 흐려집니다.
  doctrine_reference: 예언서의 심판 경고와 하나님의 거룩한 공의
