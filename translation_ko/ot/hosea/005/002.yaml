  source_fidelity: 첫 절은 שֵׂטִים와 הֶעְמִיקוּ를 자연스럽게 반영하며, ‘살육 속으로 깊이 들어갔습니다’는 살육에 깊이 빠져든다는 비유를 보존합니다. 다만 מוּסָר는 일반적으로 단순한 언어적 ‘책망’보다 징계·훈육 또는 교정의 뜻이므로, 본문의 심판 문맥에서 ‘책망’은 의미 범위를 다소 좁힙니다.
  naturalness: ‘나는 그들 모두에게 책망입니다’는 한국어에서 명사 서술이 다소 부자연스럽고, ‘책망’ 자체가 사람의 정체성이 되는 표현도 어색합니다. ‘징계하는 이입니다’는 원문의 명사절과 화자의 역할을 유지하면서 현대 한국어 합쇼체로 더 자연스럽습니다.
