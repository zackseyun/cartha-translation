base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
  footnotes:
  - marker: a
    text: Or 'The apostates have sunk deep in slaughter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I am discipline for all of them' or 'I am instruction for all of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 반역자들은 살육 속으로 깊이 들어갔습니다. 그러나 나는 그들 모두에게 책망입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배교자들은 살육 속으로 깊이 들어갔습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 그들 모두에게 징계입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁחֲטָה
  english_pob_choice: into slaughter
  chosen_korean: 살육 속으로
  alternatives_korean:
  - 살육으로
  - 도살 속으로
  - 살해 속으로
  lexicon: HALOT
  rationale: 명사적 상태를 한국어에서 자연스럽게 옮기기 위해 '속으로'를 사용해, 단순한 행위가 아니라 그 상태/영역 안으로 깊이 빠져드는 뜻을 살렸습니다.
- source_word: שֵׂטִים
  english_pob_choice: the rebels
  chosen_korean: 반역자들
  alternatives_korean:
  - 배교자들
  - 돌이킨 자들
  - 일탈한 자들
  lexicon: HALOT
  rationale: 어근의 ‘돌이킴/벗어남’과 예언서의 고발적 뉘앙스를 함께 살리면서, 한국어로는 ‘반역자들’이 가장 직접적으로 불순종과 언약 파기를 드러냅니다.
- source_word: מוּסָר
  english_pob_choice: a rebuke
  chosen_korean: 책망입니다
  alternatives_korean:
  - 징계입니다
  - 훈육입니다
  - 가르침입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 교육이 아니라 하나님의 엄중한 질책과 교정의 뜻이 강하므로, ‘책망’이 합쇼체 문장에서도 가장 자연스럽고 긴장감을 보존합니다.
- source_word: לְכֻלָּם
  english_pob_choice: to all of them
  chosen_korean: 그들 모두에게
  alternatives_korean:
  - 그들 모두를 향한
  - 그들 모두를 위해
  - 그들 모두에 대하여
  lexicon: HALOT
  rationale: ל의 범위를 자연스럽게 살리면서, 책망의 대상이 전원임을 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: מוּסָר의 성격
  chosen_reading: 하나님은 자기 백성 전체에게 임하는 책망으로 자신을 제시하십니다.
  alternative_readings:
  - 하나님은 그들에게 주시는 가르침이라고 말하십니다.
  - 하나님은 훈육 자체라고 말하십니다.
  rationale: 호세아의 문맥은 단순한 교훈보다 언약 위반에 대한 예언적 책망과 징계를 가리키므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예언적 심판의 경고를 보존하되, 문맥이 허용하는 범위를 넘는 교리적 해석은 피합니다.
