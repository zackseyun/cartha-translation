  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
  footnotes:
  - marker: a
    text: Or 'an object of horror' for 'a desolation.' The Hebrew term can include the sense of devastation that causes astonishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of punishment' or 'in the day of judgment' for 'in the day of rebuke.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I have made known what is sure.' The final phrase emphasizes the certainty and reliability of the announced judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 책망의 날에 폐허가 될 것입니다.[a][b] 이스라엘의 지파들 가운데서 나는 확실한 것을 알렸습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘폐허’는 ‘공포의 대상’ 또는 ‘황무지’로도 옮길 수 있습니다. 히브리어 표현에는 파괴되어 경악을 불러일으키는 상태라는 뉘앙스가 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘책망의 날’은 ‘징벌의 날’ 또는 ‘심판의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘확실한 것’은 선포된 심판의 확실성과 신뢰성을 강조합니다.
    reason: lexical_alternative
