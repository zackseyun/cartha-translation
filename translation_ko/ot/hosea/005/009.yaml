source:
  edition: WLC
  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
  footnotes:
  - marker: a
    text: Or 'an object of horror' for 'a desolation.' The Hebrew term can include the sense of devastation that causes astonishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of punishment' or 'in the day of judgment' for 'in the day of rebuke.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I have made known what is sure.' The final phrase emphasizes the certainty and reliability of the announced judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 책망의 날에 황폐함이 될 것입니다. 이스라엘의 지파들 가운데서 나는 확실한 것을 알려 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐함’은 ‘공포의 대상’ 또는 ‘황무지’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘책망의 날’은 ‘징벌의 날’ 또는 ‘심판의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘확실한 것’은 선포된 심판의 확실성과 신뢰성을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
  - 북이스라엘
  - 이스라엘
  lexicon: HALOT
  rationale: 본문은 지명을 직접 사용하므로, 메타포적 의미를 주석 없이 본문에 풀어쓰지 않고 음역으로 살렸습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a desolation
  chosen_korean: 황폐함
  alternatives_korean:
  - 황무지
  - 폐허
  - 재앙의 대상
  lexicon: HALOT
  rationale: ו/לְשַׁמָּה의 핵심은 파괴되어 버린 상태를 가리키므로, 현대 한국어에서 자연스러운 ‘황폐함’으로 옮겼습니다.
- source_word: בְּיוֹם תּוֹכֵחָה
  english_pob_choice: in the day of rebuke
  chosen_korean: 책망의 날에
  alternatives_korean:
  - 꾸짖음의 날에
  - 징벌의 날에
  - 심판의 날에
  lexicon: HALOT
  rationale: תּוֹכֵחָה의 기본 의미인 ‘책망/꾸짖음’을 유지하되, 예언 문맥의 징계 뉘앙스는 전체 문맥이 드러내도록 했습니다.
- source_word: נֶאֱמָנָה
  english_pob_choice: what is sure / what is certain
  chosen_korean: 확실한 것
  alternatives_korean:
  - 확실한 말씀
  - 신실한 것
  - 확정된 것
  lexicon: HALOT
  rationale: 문장 끝의 명사적 표현은 ‘확실한 것’으로 옮겨, ‘신뢰할 만한/확정된’ 뜻을 한국어로 간결하게 드러냈습니다.
theological_decisions:
- issue: בְּשִׁבְטֵי יִשְׂרָאֵל의 관계 의미
  chosen_reading: 이스라엘의 지파들 가운데서
  alternative_readings:
  - 이스라엘의 지파들에 대하여
  - 이스라엘의 지파들 안에서
  rationale: preposition ב의 범위/영역 의미를 살려, ‘지파들 가운데서’로 옮겨 선언이 그 공동체 안에서 공적으로 알려졌음을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
