  source_fidelity: 본문은 전반적으로 히브리어의 두 절 구조와 핵심 의미를 잘 따릅니다. 다만 לְשַׁמָּה는 에브라임이 처하게 될 파괴된 상태를 가리키므로, 한국어에서는 ‘황폐함이 되다’보다 ‘폐허가 되다’가 더 자연스럽고 명확합니다. בְּשִׁבְטֵי יִשְׂרָאֵל은 ‘이스라엘의 지파들 가운데’로 유지할 수 있으며, הוֹדַעְתִּי נֶאֱמָנָה는 ‘확실한 것을 알렸습니다’로 충실하게 옮길 수 있습니다.
  naturalness: ‘황폐함이 될 것입니다’는 명사 ‘황폐함’과 ‘되다’의 결합이 다소 부자연스럽습니다. ‘폐허가 될 것입니다’가 현대 표준 한국어에서 예언적 심판의 결과를 자연스럽게 표현합니다. 또한 각 주석 표지는 해당 표현 바로 뒤에 두는 편이 독자의 이해와 주석 연결에 적절합니다.
  terminology: ‘에브라임’, ‘책망의 날’, ‘이스라엘의 지파들’, ‘확실한 것’은 원문의 명칭과 의미 범위를 보존합니다. ‘폐허’는 שַׁמָּה의 황폐·파괴 및 경악을 불러일으키는 상태라는 의미에 적합하며, 대안 번역은 주석에서 보완합니다.
