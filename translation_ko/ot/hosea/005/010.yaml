base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
  footnotes:
  - marker: a
    text: Or 'like those who remove a boundary line.' The image may refer literally to shifting property markers or figuratively to violating limits set by God.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 방백들은 경계표를 옮기는 자들처럼 되었습니다.[a] 그들에게 내 진노를 물처럼 쏟아붓겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경계표를 옮기는 자들’은 문자적으로 토지 경계표를 옮기는 일을 가리킬 수 있으며, 비유적으로는 하나님께서 정하신 한계를 범하는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  english_pob_choice: the princes of Judah
  chosen_korean: 유다의 방백들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 관리들
  lexicon: HALOT
  rationale: שָׂרִים은 통치자, 방백, 고관의 뜻을 가지며, 예언서의 정치·공적 책임 맥락을 살려 ‘방백들’로 옮겼습니다.
- source_word: כְּמַסִּיגֵי גְּבוּל
  english_pob_choice: like those who move a boundary marker
  chosen_korean: 경계표를 옮기는 자들처럼
  alternatives_korean:
  - 경계를 옮기는 자들처럼
  - 경계선을 없애는 자들처럼
  lexicon: HALOT
  rationale: 이 표현은 토지 경계표를 몰래 옮기는 구체적 이미지를 담고 있으므로, 추상화하지 않고 ‘경계표’를 유지해 법적·상징적 뉘앙스를 함께 살렸습니다.
- source_word: אֶשְׁפּוֹךְ כַּמַּיִם עֶבְרָתִי
  english_pob_choice: I will pour out my wrath like water
  chosen_korean: 내 진노를 물처럼 쏟아붓겠습니다
  alternatives_korean:
  - 내 분노를 물처럼 쏟겠습니다
  - 내 격분을 물처럼 쏟아붓겠습니다
  lexicon: HALOT
  rationale: שׁפך의 심판 용법은 ‘쏟아붓다’가 자연스럽고 강렬하며, עֶבְרָה는 ‘진노’가 예언적 심판 문맥에 가장 적합합니다.
theological_decisions:
- issue: ‘경계표’ 이미지의 범위
  chosen_reading: 본문의 구체적 경계표 이미지를 유지하되, 그것이 단순한 토지 경계 침범인지 더 넓은 언약 위반의 비유인지 본문에서 단정하지 않았습니다.
  alternative_readings:
  - 실제 토지 경계의 불법 이동
  - 하나님이 정하신 한계를 넘는 비유적 위반
  rationale: 히브리어는 의도적으로 구체적 법률 이미지를 사용하지만 적용 범위를 확정하지 않으므로, 한국어도 같은 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
