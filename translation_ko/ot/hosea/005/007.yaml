id: HOS.5.7
reference: Hosea 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
  footnotes:
  - marker: a
    text: Or 'a month will devour them and their portions.' The Hebrew חֹדֶשׁ can mean either 'new moon' or 'month.'
    reason: alternative_reading
  - marker: b
    text: '''Foreign children'' may refer to children from covenantally illicit unions or, more broadly, to a generation estranged from the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼를 배반했습니다. 그들이 이방의 자녀들을 낳았기 때문입니다.[b] 이제 새달이[a] 그들과 그들의 몫을 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘새달’(חֹדֶשׁ)은 ‘한 달’을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘이방의 자녀들’은 언약에 어긋난 결합에서 난 자녀들을 가리킬 수도 있고, 더 넓게는 야훼에게서 멀어진 세대를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  english_pob_choice: with Yahweh
  chosen_korean: 야훼에게
  alternatives_korean:
  - 야훼와
  - 야훼를 향하여
  - 야훼에 대하여
  lexicon: HALOT
  rationale: ב + YHWH가 배반의 대상과 관련된 관계를 나타내므로, 한국어는 표준적 목적어 표지인 ‘-에게’로 그 배반의 방향을 자연스럽게 드러냈습니다.
- source_word: בָּגָדוּ
  english_pob_choice: have dealt faithlessly
  chosen_korean: 신실하지 않았습니다
  alternatives_korean:
  - 배반했습니다
  - 간사하게 행했습니다
  - 언약을 저버렸습니다
  lexicon: HALOT
  rationale: בגד의 핵심은 언약적 불성실이므로, ‘신실하지 않았습니다’가 관계적·언약적 뉘앙스를 가장 직접적으로 살립니다.
- source_word: בָנִים זָרִים
  english_pob_choice: foreign children
  chosen_korean: 외국의 자녀들
  alternatives_korean:
  - 낯선 자녀들
  - 이방의 자녀들
  - 외래의 자녀들
  lexicon: HALOT
  rationale: ‘זָרִים’의 ‘낯선/이방의’ 의미를 살리되, 한국어에서 가장 직관적인 표현으로 ‘외국의 자녀들’을 택해 문장의 수수께끼 같은 여지를 유지했습니다.
- source_word: חֹדֶשׁ
  english_pob_choice: the new moon
  chosen_korean: 새달
  alternatives_korean:
  - 초하루
  - 한 달
  - 새월
  lexicon: HALOT
  rationale: 본문의 제의적 달력 이미지를 살리기 위해 ‘새달’을 택했습니다. 이는 ‘달/초하루’의 축제적 울림을 보존하면서도 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: ‘foreign children’의 범위
  chosen_reading: 혈통만이 아니라 언약적 이탈과 부정한 결합이 낳은 자녀까지 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - 단순히 이방인과의 혼인에서 난 자녀
  - 야훼에게서 멀어진 세대에 대한 비유
  rationale: 호세아서의 예언적 고발은 민족 범주로만 축소되면 안 되므로, 원문이 허용하는 긴장을 풀지 않고 남겨 두었습니다.
  doctrine_reference: 언약적 신실성의 파괴를 본문 그대로 드러내기
- issue: חֹדֶשׁ의 의미
  chosen_reading: 제의적 ‘새달’로 읽되, 심판의 시점을 동시에 암시하도록 번역했습니다.
  alternative_readings:
  - ‘한 달’로서 곧 닥칠 짧은 기간
  - ‘초하루’라는 특정 절기
  rationale: 호세아서의 달력·예배 배경을 고려하면 ‘새달’이 가장 문맥에 맞지만, 단순한 기간 의미도 가능하므로 한국어에서도 제의성과 시간성을 함께 남겼습니다.
  doctrine_reference: 어휘적 중의성을 본문 안에 보존하기
