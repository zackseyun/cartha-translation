translation:
  language: ko
  text: 에브라임의 영광은 새처럼 날아가 버릴 것입니다. 출생에서, 태중에서, 잉태에서부터입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 문맥상 특히 자녀와 생식의 풍요를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘출생과 태와 잉태/임신에서부터’라는 세 겹의 표현으로, 모든 단계에서 자녀를 잃는다는 뜻을 드러냅니다.
    reason: lexical_alternative
