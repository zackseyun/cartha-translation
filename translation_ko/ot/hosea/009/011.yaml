theological_decisions:
- issue: '''their glory''의 의미를 본문에서 얼마나 풀어 설명할 것인가'
  chosen_reading: 본문에는 ‘영광’을 그대로 두고, 그 구체적 함의는 문맥이 암시하도록 남겼습니다.
  alternative_readings:
