  rationale: POB의 영어도 ‘their glory’를 유지해 메타포를 보존하므로, 한국어도 본문에서 의미를 좁히지 않고 긴장을 남기는 편이 더 충실합니다.
  doctrine_reference: 본문의 비유적 표현을 과잉 해석하지 않고 문맥적 암시를 보존합니다.
