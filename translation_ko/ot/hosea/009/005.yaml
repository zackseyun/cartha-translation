id: HOS.9.5
reference: Hosea 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַֽה תַּעֲשׂ֖וּ לְ/י֣וֹם מוֹעֵ֑ד וּ/לְ/י֖וֹם חַג יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
  footnotes:
  - marker: a
    text: Or 'appointed time' or 'festival' for 'appointed assembly.' The Hebrew מוֹעֵד can refer broadly to an appointed time or specifically to a sacred gathering.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 임명된 회중의 날에 무엇을 하시겠습니까? 야훼의 절기의 날에 무엇을 하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘임명된 회중’은 מוֹעֵד의 기본 뜻인 ‘정해진 때’와 제의적 ‘모임’을 함께 반영한 번역입니다. 문맥에 따라 ‘정해진 때’ 또는 ‘절기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇을
  alternatives_korean:
  - 어떻게
  lexicon: HALOT
  rationale: 수사적 질문을 직접적으로 살려, 미래 상황에서 그들이 할 수 있는 일을 묻는 구조를 한국어로 자연스럽게 옮겼습니다.
- source_word: מוֹעֵד
  english_pob_choice: appointed assembly
  chosen_korean: 임명된 회중
  alternatives_korean:
  - 정해진 때
  - 정기 집회
  - 절기 집회
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진 때’와 ‘거룩한 모임’의 중의를 보존하면서, 다음 절의 חַג와 구별되도록 집회 쪽 뉘앙스를 살렸습니다.
- source_word: חַג
  english_pob_choice: feast
  chosen_korean: 절기
  alternatives_korean:
  - 잔치
  - 축제
  - 명절
  lexicon: HALOT
  rationale: חַג는 제의적 축일을 가리키므로, 한국어에서 성격을 분명히 드러내는 ‘절기’를 택해 앞의 מוֹעֵד와 어휘적 차이를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명 יְהוָה를 대체 호칭이 아니라 음역인 ‘야훼’로 옮겨, 본문이 가진 언약명 사용을 그대로 드러냈습니다.
theological_decisions:
- issue: מוֹעֵד와 חַג의 병렬 의미 보존
  chosen_reading: 두 표현을 각각 ‘임명된 회중’과 ‘절기’로 구별해 번역합니다.
  alternative_readings:
  - 둘 다 ‘절기’ 계열로 평탄화함
  - 둘 다 ‘축제’로 일반화함
  rationale: 본문은 두 개의 관련되지만 동일하지 않은 제의 용어를 병렬로 사용합니다. 이를 구분해야 이스라엘이 지키지 못할 성일들의 수사적 압박이 살아납니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5: Consistency of key terms, or documented exception'
- issue: 여호와/야훼의 번역
  chosen_reading: יהוה는 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - the LORD
  rationale: 본문이 야훼의 고유명을 직접 사용하므로, 호칭으로 바꾸지 않고 이름을 보존하는 것이 출처 충실성과 신학적 투명성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
