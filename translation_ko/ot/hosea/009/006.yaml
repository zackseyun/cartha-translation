  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
  footnotes:
  - marker: a
    text: Or 'nettles will inherit their silver treasures.' The Hebrew plant term is uncertain and may refer more specifically to nettles or similar overgrowth.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들은 멸망에서 떠났습니다. 이집트가 그들을 모으고, 멤피스가 그들을 묻을 것입니다. 쐐기풀이 그들의 은으로 된 귀중품들을 차지할 것입니다.[a] 그들의 장막에는 가시나무가 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쐐기풀이 그들의 은으로 된 귀중품들을 이어받을 것입니다.’ 히브리어 식물명은 확정하기 어려우며, 쐐기풀 또는 이와 비슷한 무성한 잡초를 가리킬 수 있습니다.
    reason: קִמּוֹשׂ의 식물 동정은 불확실하며, יִירָשֵׁם에는 ‘차지하다’ 외에 ‘이어받다’라는 대안적 뉘앙스가 있습니다.
lexical_decisions:
- source_word: מִשֹּׁד
  english_pob_choice: from destruction
  chosen_korean: 멸망에서 떠났습니다
  alternatives_korean:
