id: HOS.9.6
reference: Hosea 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
  footnotes:
  - marker: a
    text: Or 'nettles will inherit their silver treasures.' The Hebrew plant term is uncertain and may refer more specifically to nettles or similar overgrowth.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들은 멸망에서 떠났습니다. 이집트가 그들을 모으고, 므놉이 그들을 묻을 것입니다. 그들의 은의 귀한 것들을 쐐기풀이 차지할 것이며, 그들의 장막에는 가시나무가 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쐐기풀이 그들의 은의 귀한 것들을 이어받을 것입니다.’ 히브리어 식물어는 확정이 어려우며, 더 구체적으로는 쐐기풀 또는 이와 비슷한 잡초를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשֹּׁד
  english_pob_choice: from destruction
  chosen_korean: 멸망에서 떠났습니다
  alternatives_korean:
  - 파멸에서 떠났습니다
  - 파괴에서 떠났습니다
  - 멸망을 피해 떠났습니다
  lexicon: HALOT
  rationale: שֹׁד는 폭력적 붕괴와 파멸을 가리키므로, 단순한 이동이 아니라 재난을 피해 떠나는 뉘앙스를 살려야 합니다. 한국어에서는 ‘멸망에서 떠났습니다’가 간결하면서도 심판의 맥락을 유지합니다.
- source_word: מֹף
  english_pob_choice: Memphis
  chosen_korean: 므놉
  alternatives_korean:
  - 멤피스
  - 멥피스
  lexicon: HALOT
  rationale: 히브리어 지명 מֹף의 음역을 따르되, 한국어 성경에서 널리 알려진 전통 표기가 없으므로 현대 음역으로 처리했습니다. 본문 기능상 고유명사 보존이 중요합니다.
- source_word: מַחְמַד לְכַסְפָּם
  english_pob_choice: the precious things of their silver
  chosen_korean: 그들의 은의 귀한 것들
  alternatives_korean:
  - 그들의 은으로 된 소중한 것들
  - 그들의 귀한 은 물건들
  - 그들의 은의 보물
  lexicon: HALOT
  rationale: מַחְמַד는 ‘귀한 것, 바라는 것’의 뜻이므로 은 자체보다 은과 연관된 귀중품을 가리킨다고 보아 ‘귀한 것들’로 옮겼습니다. ‘은의’는 소유격 구조를 따라 원문의 결합을 유지합니다.
- source_word: קִמּוֹשׂ
  english_pob_choice: nettles
  chosen_korean: 쐐기풀
  alternatives_korean:
  - 쐐기풀이
  - 잡초
  - 가시덤불
  lexicon: HALOT
  rationale: 이 식물어는 황폐한 곳을 뒤덮는 가시적 잡초를 가리키며, 영어 POB도 특정 식물로 좁혀 제시했습니다. 한국어에서는 가장 자연스러운 대응인 ‘쐐기풀’로 옮기되, 확정적 식물 동정은 피했습니다.
- source_word: חוֹחַ
  english_pob_choice: thorns
  chosen_korean: 가시나무
  alternatives_korean:
  - 가시
  - 엉겅퀴
  - 찔레
  lexicon: HALOT
  rationale: חוֹחַ는 일반적인 가시덤불을 가리키므로, 시적 병행을 살리면서도 현대 독자가 바로 이해할 수 있는 ‘가시나무’로 옮겼습니다.
theological_decisions:
- issue: כִּי הִנֵּה의 수사적 도입어 처리
  chosen_reading: “보십시오”로 시작해 경고와 선언의 긴박함을 살렸습니다.
  alternative_readings:
  - “보라”
  - 생략
  - “이는”
  rationale: 히브리어 כִּי הִנֵּה는 단순 정보 전달이 아니라 예언적 강조와 주목 요청의 기능을 하므로, 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고도 엄숙합니다.
  doctrine_reference: 예언서의 경고 선언 문체 보존
- issue: הָלְכוּ מִשֹּׁד의 방향성
  chosen_reading: ‘멸망에서 떠났습니다’로, 구출이 아니라 재난을 피해 도망한 상황을 드러냈습니다.
  alternative_readings:
  - 멸망을 피해 달아났습니다
  - 멸망에서 벗어났습니다
  - 멸망 때문에 떠났습니다
  rationale: 문맥은 안전한 탈출이 아니라 심판 아래의 피난과 결국 이집트에서의 죽음이므로, 지나친 성공 뉘앙스를 피해야 합니다.
  doctrine_reference: 호세아서의 심판-망명 모티프
