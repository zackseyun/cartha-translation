id: HOS.9.9
reference: Hosea 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
  footnotes:
  - marker: a
    text: Gibeah refers to the notorious outrage at Gibeah in Judges 19–21, invoked here as a comparison for Israel's corruption.
    reason: cross_reference
  - marker: b
    text: Or, more literally, 'They have gone deep; they have corrupted themselves/as in corruption.' The Hebrew is terse and idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 Gibeah의 날과 같이 깊이 타락했습니다[a]. 그분은 그들의 죄악을 기억하시며, 그들의 죄를 벌하실 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gibeah는 사사기 19–21장의 기브아 사건을 가리키며, 이스라엘의 타락을 비유적으로 드러내는 비교입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 매우 압축된 표현으로, 직역하면 ‘그들은 깊이 들어갔다; 그들은 자신을 부패시켰다/부패 안에 있었다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  english_pob_choice: have gone deep into corruption
  chosen_korean: 깊이 타락했습니다
  alternatives_korean:
  - 깊이 부패했습니다
  - 깊이 스스로를 부패시켰습니다
  - 타락의 심연 속으로 빠져들었습니다
  lexicon: HALOT
  rationale: 두 동사가 함께 만드는 압축된 관용을 한국어로 자연스럽게 풀어, ‘깊이’와 ‘타락’의 결합으로 깊어진 도덕적 붕괴를 살렸습니다.
- source_word: כִּימֵי הַגִּבְעָה
  english_pob_choice: as in the days of Gibeah
  chosen_korean: Gibeah의 날과 같이
  alternatives_korean:
  - 기브아의 날처럼
  - 기브아 시대와 같이
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 ‘~와 같이’로 옮기고, 지명은 원형에 가까운 음역을 유지했습니다.
- source_word: יִזְכּוֹר עֲוֺנָם יִפְקֹד חַטֹּאותָם
  english_pob_choice: he will remember their iniquity; he will punish their sins
  chosen_korean: 그분은 그들의 죄악을 기억하시며, 그들의 죄를 벌하실 것입니다
  alternatives_korean:
  - 그분은 그들의 죄를 기억하시며, 그들의 죄를 징벌하실 것입니다
  - 그분은 그들의 죄악을 기억하시고 그들의 죄를 찾아내실 것입니다
  lexicon: HALOT
  rationale: פקד는 심판 문맥에서 ‘벌하다/징벌하다’의 의미가 분명하므로, 현대 한국어에서 판단이 즉시 드러나는 ‘벌하실 것입니다’로 옮겼습니다. עון은 도덕적 잘못의 무게를 드러내는 ‘죄악’이 적절합니다.
theological_decisions:
- issue: 9절의 3인칭 단수 주어가 암시하는 심판자
  chosen_reading: 명시되지 않았지만 문맥상 하나님을 가리키므로 ‘그분’으로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 채 수동적으로 옮김
  - ‘그가’로 직역
  rationale: 히브리어는 주어를 직접 쓰지 않지만, 호세아서의 예언 심판 문맥에서는 기억하시고 벌하시는 분이 하나님으로 분명하므로 문맥적 지시를 한국어에 반영했습니다.
  doctrine_reference: 예언서 문맥에서의 암시적 신적 주어 처리
- issue: Gibeah 언급의 기능
  chosen_reading: 기브아의 악명 높은 사건을 환기하는 비교로 유지했습니다.
  alternative_readings:
  - 주석 없이 지명만 번역
  - 사건 설명을 본문에 삽입
  rationale: 본문 자체는 간결한 비교를 제시하므로, 의미를 풀어써서 본문을 확장하기보다 비교 관계를 보존하고 사건 식별은 각주로 처리하는 편이 원문에 충실합니다.
  doctrine_reference: 본문-주석 구분 원칙
