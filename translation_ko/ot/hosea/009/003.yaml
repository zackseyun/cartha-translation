id: HOS.9.3
reference: Hosea 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
  footnotes:
  - marker: a
    text: Or 'dwell in the land of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Egypt'' may be understood literally or as a typological image of renewed bondage/exile; the Hebrew preserves the tension alongside the reference to Assyria.'
    reason: alternative_reading
  - marker: c
    text: Or 'eat what is unclean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 땅에 머물지 못할 것입니다. 에브라임은 이집트로 돌아가고, 앗수르에서는 부정한 음식을 먹을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 땅’은 ‘주님의 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이집트’는 문자적으로 이해할 수도 있고, 다시 포로와 속박의 상태를 가리키는 유형적 이미지로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘부정한 것을 먹을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹ֥א יֵשְׁב֖וּ
  english_pob_choice: will not remain
  chosen_korean: 머물지 못할 것입니다
  alternatives_korean:
  - 거주하지 못할 것입니다
  - 살지 못할 것입니다
  - 거하지 못할 것입니다
  lexicon: HALOT
  rationale: 부정문 미래 문맥에서 지속적 거주 불가를 자연스럽게 드러내기 위해 ‘머물다’를 택했습니다. 단순한 ‘살다’보다 추방의 결과를 더 분명하게 보여 줍니다.
- source_word: בְּאֶרֶץ יְהוָה
  english_pob_choice: in the land of Yahweh
  chosen_korean: 야훼의 땅
  alternatives_korean:
  - 여호와의 땅
  - 주님의 땅
  lexicon: HALOT
  rationale: 본문의 소유격 관계를 살려 ‘야훼의 땅’으로 옮겼습니다. 프로젝트 기본값에 따라 신명은 음역형 ‘야훼’를 유지했습니다.
- source_word: וְשָׁב אֶפְרַיִם מִצְרַ֔יִם
  english_pob_choice: Ephraim will return to Egypt
  chosen_korean: 에브라임은 이집트로 돌아가고
  alternatives_korean:
  - 에브라임은 애굽으로 돌아가고
  - 에브라임은 이집트로 되돌아가고
  lexicon: HALOT
  rationale: 히브리어의 ‘돌아가다’와 지명을 직접 반영해 간결하게 옮겼습니다. 본문이 지닌 ‘이집트’의 문자적·상징적 긴장은 주석 없이 본문에 남겨 두었습니다.
- source_word: וּבְאַשּׁוּר טָמֵא יֹאכֵלוּ
  english_pob_choice: and in Assyria they will eat unclean food
  chosen_korean: 앗수르에서는 부정한 음식을 먹을 것입니다
  alternatives_korean:
  - 앗수르에서는 부정한 것을 먹을 것입니다
  - 앗수르에서는 더러운 음식을 먹을 것입니다
  lexicon: HALOT
  rationale: טָמֵא의 의례적·언약적 부정성을 살리기 위해 ‘부정한’으로 옮겼습니다. ‘음식’을 보충해 한국어 문장으로 자연스럽게 만들되, 먹는 대상의 정결 규례 위반이라는 의미를 유지했습니다.
theological_decisions:
- issue: ‘이집트’의 문자적·상징적 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘이집트’라는 지명을 그대로 두고, 그것이 실제 장소인지 혹은 포로 상태의 상징인지 결론짓지 않았습니다.
  alternative_readings:
  - ‘이집트’를 곧바로 포로·속박의 상징으로 풀어 쓰기
  - ‘앗수르’만 실제 목적지로 보고 ‘이집트’를 조정하기
  rationale: 히브리어는 ‘에브라임이 이집트로 돌아간다’고 말한 뒤 곧바로 앗수르를 언급하므로, 두 지명 사이의 긴장을 보존하는 것이 본문 충실도에 더 적합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: טָמֵא의 성격을 단순한 위생적 부정으로 약화할지 여부
  chosen_reading: ‘부정한 음식’으로 번역하여 정결/부정의 제의적·언약적 의미를 유지했습니다.
  alternative_readings:
  - ‘더러운 음식’
  - ‘부정한 것들’
  rationale: 문맥은 야훼의 땅을 떠난 결과로 정결 규례를 지키지 못하는 상황을 말하므로, 의례적 부정의 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: Cultic purity language in Torah/Hosea
