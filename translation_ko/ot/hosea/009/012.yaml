  source_fidelity: 개정이 필요합니다. 초안의 ‘벌하여’는 וְשִׁכַּלְתִּים(자녀를 잃게 하다/상실하게 하다)에 없는 일반적 ‘처벌’ 개념을 보태며, 자녀 상실이라는 동사의 핵심을 흐립니다. מֵאָדָם의 난해하고 강한 범위는 ‘한 사람도 남지 않게’로 보존할 수 있습니다. 마지막 절은 하나님의 떠남이 일어나는 때의 화를 말하므로 조건절을 문장에 자연스럽게 연결해야 합니다.
  naturalness: ‘내가 그들을 떠날 때입니다’는 앞 문장과 문법적으로 매끄럽게 연결되지 않고, ‘화가 있습니다’도 이 미래적 심판 선언에서는 다소 부자연스럽습니다. ‘내가 그들에게서 떠날 때에는 참으로 그들에게 화가 있을 것입니다’가 현대 한국어의 격식 있는 합쇼체에 자연스럽습니다.
  terminology: ‘자녀’는 בְּנֵיהֶם의 포괄적 의미를 잘 반영합니다. ‘자식을 잃게 하다’는 שׁכל의 비통한 상실 의미를 직접 나타내며, ‘그들에게서 떠나다’는 하나님 자신의 심판적 철수를 과도한 신학적 해설 없이 충실히 전달합니다.
