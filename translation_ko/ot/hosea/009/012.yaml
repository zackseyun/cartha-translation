id: HOS.9.12
reference: Hosea 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
  footnotes:
  - marker: a
    text: Or 'their sons' for 'their children.' The Hebrew noun can specifically mean sons, but often refers more broadly to offspring.
    reason: lexical_alternative
  - marker: b
    text: Or 'when I turn away from them.' The Hebrew may emphasize God's withdrawal of favor and presence in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자녀를 길러도 나는 그들을 벌하여 사람 하나 남지 않게 하겠습니다. 참으로 그들에게 화가 있습니다. 내가 그들을 떠날 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 아들들’로도 옮길 수 있습니다. 히브리어 명사는 아들을 가리킬 수 있지만, 자손 전반을 뜻하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들에게서 돌아설 때’로도 옮길 수 있습니다. 히브리어는 하나님의 은혜와 임재의 철수를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: Even if
  chosen_korean: ~해도
  alternatives_korean:
  - 비록 ~하더라도
  - 설령 ~해도
  lexicon: HALOT
  rationale: 여기서는 양보적 조건을 나타내므로 한국어도 양보 표현으로 옮기는 것이 자연스럽습니다.
- source_word: יְגַדְּלוּ אֶת בְּנֵיהֶם
  english_pob_choice: they raise their children
  chosen_korean: 자녀를 길러도
  alternatives_korean:
  - 자녀를 키워도
  - 아들을 길러도
  lexicon: HALOT
  rationale: בנים은 문맥상 자녀/자손의 넓은 뜻이 가능하므로 ‘자녀’가 무난하며, יגדל의 양육 의미는 ‘기르다’가 잘 드러냅니다.
- source_word: וְשִׁכַּלְתִּים
  english_pob_choice: I will bereave them
  chosen_korean: 나는 그들을 벌하여 사람 하나 남지 않게 하겠습니다
  alternatives_korean:
  - 나는 그들에게서 자녀를 빼앗겠습니다
  - 나는 그들을 상실의 슬픔에 빠뜨리겠습니다
  lexicon: HALOT
  rationale: שׁכל의 핵심은 자녀를 잃는 비통한 상실이므로 ‘벌하여’와 ‘사람 하나 남지 않게’로 심판과 상실의 효과를 함께 드러냈습니다.
- source_word: בְּשׂוּרִי מֵהֶם
  english_pob_choice: when I depart from them
  chosen_korean: 내가 그들을 떠날 때입니다
  alternatives_korean:
  - 내가 그들에게서 돌아설 때입니다
  - 내가 그들로부터 물러날 때입니다
  lexicon: HALOT
  rationale: סור의 핵심은 떠남/돌아섬이므로, 하나님의 임재와 호의의 철수를 직접적으로 드러내는 ‘떠날 때’가 적절합니다.
theological_decisions:
- issue: 마지막 절의 ‘떠남’의 의미
  chosen_reading: 하나님이 그들에게서 떠나시는 심판적 철수를 뜻합니다.
  alternative_readings:
  - 하나님이 그들에게서 돌아서시는 뜻
  - 백성이 하나님에게서 떠나는 뜻
  rationale: 1인칭 어미가 하나님 자신의 행동을 가리키므로, 언약적 심판으로서의 임재 철수를 보존하는 번역이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §3
