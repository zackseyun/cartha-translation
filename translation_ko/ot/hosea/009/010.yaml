id: HOS.9.10
reference: Hosea 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
  footnotes:
  - marker: a
    text: Or 'in the beginning of its season.' The image is of the earliest, especially prized fig.
    reason: lexical_alternative
  - marker: b
    text: '''Shame'' likely refers contemptuously to the idol associated with Baal-peor.'
    reason: alternative_reading
  - marker: c
    text: 'Or ''your ancestors.'' Hebrew: ''your fathers.'''
    reason: lexical_alternative
  - marker: d
    text: Compare Numbers 25:1–5, where Israel joined itself to Baal-peor.
    reason: cross_reference
translation:
  language: ko
  text: 내가 광야에서 포도를 발견한 듯이 이스라엘을 발견했고, 무화과나무가 처음 열매를 맺을 때의 이른 열매를 보듯이 여러분의 조상들을 보았습니다[a][c]. 그들은 바알브올에게로 가서 수치에 자신을 바쳤고[d][b], 그들이 사랑한 것을 닮아 가증한 것들이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 열매 맺는 시기의 처음에’. 이는 특히 귀하게 여겨지는 가장 이른 무화과를 가리키는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수치’는 바알브올과 관련된 우상을 조롱하여 가리키는 말일 가능성이 큽니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘여러분의 선조들’. 히브리어는 ‘여러분의 아버지들’입니다.
    reason: lexical_alternative
  - marker: d
    text: 민수기 25:1–5을 비교해 보십시오. 그곳에서 이스라엘은 바알브올과 결합했습니다.
    reason: cross_reference
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  english_pob_choice: Like grapes in the wilderness
  chosen_korean: 광야의 포도송이 같을 때
  alternatives_korean:
  - 광야의 포도처럼
  - 들판 없는 곳의 포도송이처럼
  lexicon: WLC/HALOT
  rationale: כְּ의 비교를 살리고, מִדְבָּר는 예언서 문맥의 상징성을 반영해 '광야'로 옮겼습니다. 한국어에서는 시간절처럼 들리기 쉬우나, '...같을 때'로 원문의 비유적 발견 장면을 자연스럽게 전달합니다.
- source_word: כְּבִכּוּרָה בִתְאֵנָה בְּרֵאשִׁיתָהּ
  english_pob_choice: like the first-ripe fruit on the fig tree in its first season
  chosen_korean: 무화과나무의 처음 익은 첫 열매 같을 때
  alternatives_korean:
  - 무화과나무의 맏열매 같을 때
  - 무화과나무의 첫 익은 열매 같을 때
  lexicon: WLC/HALOT
  rationale: בִּכּוּרָה의 '처음 익은/가장 귀한 열매' 뉘앙스를 살려 '처음 익은 첫 열매'로 옮겼습니다. בְּרֵאשִׁיתָהּ는 나무의 첫 수확 시기를 가리키므로, 영어 POB의 해석을 따라 '첫 열매'와 결합했습니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 여러분의 조상들
  alternatives_korean:
  - 여러분의 아버지들
  - 여러분의 선조들
  lexicon: WLC/HALOT
  rationale: 히브리어는 문자적으로 '너희의 아버지들'이지만, 한국어에서는 혈통적 선조를 뜻하는 '조상들'이 가장 자연스럽습니다. 다만 남성 복수의 직접성을 덜 드러내는 대안이므로, 본문은 흐름을 우선하고 주석에서 원문 표현을 감지할 수 있게 했습니다.
- source_word: לַבֹּשֶׁת
  english_pob_choice: to shame
  chosen_korean: 수치에
  alternatives_korean:
  - 수치로
  - 수치라는 것에
  - 수치의 신에게
  lexicon: WLC/HALOT
  rationale: בֹּשֶׁת의 폴레믹한 '수치'를 유지해, 우상명을 직역하거나 해석적으로 고정하지 않았습니다. 영어 POB처럼 우상에 대한 조롱적 명칭의 중첩 가능성을 열어 두었습니다.
- source_word: וַיִּהְי֥וּ שִׁקּוּצִ֖ים
  english_pob_choice: and they became detestable
  chosen_korean: 그들이 가증한 것이 되었습니다
  alternatives_korean:
  - 그들은 혐오스러운 자들이 되었습니다
  - 그들은 가증스러운 존재가 되었습니다
  lexicon: WLC/HALOT
  rationale: שִׁקּוּצִים은 사람에게 적용될 때 '가증한 것/혐오스러운 것'의 상태 변화를 나타냅니다. 한국어에서는 서술적 형용사보다 명사화가 원문의 충격을 더 직접적으로 살립니다.
theological_decisions:
- issue: אֲבוֹתֵיכֶם의 세대 지칭
  chosen_reading: '''여러분의 조상들''로 옮겨, 남성 복수의 원문 의미를 유지하되 한국어 수용성을 확보했습니다.'
  alternative_readings:
  - '''여러분의 아버지들'''
  - '''여러분의 선조들'''
  rationale: 히브리어는 분명히 '아버지들'이지만, 한국어 본문에서 지나친 직역은 어색할 수 있습니다. 다만 역사적-언약적 계보를 가리키는 지시를 보존해야 하므로 완전 중성화는 피했습니다.
  doctrine_reference: Gender-accurate over gender-neutral.
- issue: לַבֹּשֶׁת의 우상 암시
  chosen_reading: 본문에서는 '수치'로 유지해 우상/수치의 폴레믹한 중의성을 보존했습니다.
  alternative_readings:
  - '''수치의 신에게'''
  - '''수치스러운 것에'''
  rationale: 호세아서의 비난 수사는 명시적 해설보다 조롱적 명칭을 그대로 살릴 때 더 강하게 드러납니다. 본문을 과도하게 해석해 특정 신명으로 고정하지 않고, 독자가 우상숭배의 수치를 읽어 내도록 두는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
