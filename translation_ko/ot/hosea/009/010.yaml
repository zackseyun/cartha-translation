  source_fidelity: 현 번역의 큰 뜻은 대체로 맞지만, 두 비교구를 ‘…같을 때’로 처리하여 히브리어의 비유가 시간절로 바뀌었습니다. 또한 ‘바알브올로 들어가’는 בָּאוּ의 자연스러운 한국어 대응이 아니며, 마지막 비교는 ‘그들이 사랑한 것처럼’보다 사랑한 대상을 닮았다는 뜻을 드러내야 합니다.
  naturalness: ‘광야의 포도송이 같을 때’와 ‘처음 익은 첫 열매 같을 때’는 현대 표준 한국어에서 부자연스럽고 의미상 시간 표현으로 읽힙니다. ‘광야에서 포도를 발견한 듯이’, ‘…이른 열매를 보듯이’로 고치면 비유와 문장 흐름이 자연스럽습니다.
  terminology: ‘광야’, ‘이스라엘’, ‘바알브올’, ‘수치’, ‘가증한 것들’은 원문의 예언자적·논쟁적 어조를 적절히 보존합니다. לַבֹּשֶׁת는 특정 우상명으로 단정하지 않고 ‘수치에’로 유지하되 주석에서 우상 지시 가능성을 밝혀 두는 것이 타당합니다.
