id: HOS.9.17
reference: Hosea 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
  footnotes:
  - marker: a
    text: Or 'they have not obeyed him.' The Hebrew expression literally speaks of not listening to him, with obedience implied in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님이 그들을 거부하실 것입니다. 이는 그들이 그분께 듣지 않았기 때문입니다. 그들은 민족들 가운데 떠도는 자들이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그분께 듣지 않았다’입니다. 이 표현은 문맥상 ‘그분께 순종하지 않았다’는 뜻을 함의합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאַסֵם
  english_pob_choice: will reject them
  chosen_korean: 그들을 거부하실 것입니다
  alternatives_korean:
  - 그들을 버리실 것입니다
  - 그들을 물리치실 것입니다
  - 그들을 내치실 것입니다
  lexicon: HALOT
  rationale: מאס는 거절·거부의 의미를 가지므로, 언약적 심판의 힘을 살리면서도 현대 한국어에서 자연스러운 ‘거부하실 것입니다’를 택했습니다.
- source_word: אֱלֹהַי
  english_pob_choice: My God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격을 분명히 드러내기 위해 ‘나의 하나님’으로 옮겼습니다. 호세아의 예언자적 1인칭 발화를 유지합니다.
- source_word: לֹא שָׁמְעוּ לוֹ
  english_pob_choice: they have not listened to him
  chosen_korean: 그분께 듣지 않았기 때문입니다
  alternatives_korean:
  - 그분께 순종하지 않았기 때문입니다
  - 그분의 말씀을 듣지 않았기 때문입니다
  lexicon: HALOT
  rationale: שׁמע + ל의 ‘듣다/경청하다’라는 기본 이미지를 살리기 위해 직역에 가까운 표현을 사용했습니다. 문맥상 불순종이 함의되지만, 이를 지나치게 명시적으로 풀지 않았습니다.
- source_word: נֹדְדִים
  english_pob_choice: wanderers
  chosen_korean: 떠도는 자들
  alternatives_korean:
  - 유랑자들
  - 방랑자들
  - 떠돌이들
  lexicon: HALOT
  rationale: נדד의 떠돎·유랑의 의미를 한국어로 자연스럽게 옮기기 위해 ‘떠도는 자들’을 택했습니다. 포로/유배의 이동성을 드러내면서도 과도하게 좁히지 않습니다.
theological_decisions:
- issue: 예언자의 소유격 표현 ‘My God’ 보존
  chosen_reading: ‘나의 하나님’으로 유지하여 호세아의 직접적 고백을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘하나님’으로 완화
  - ‘내 하나님’으로 구어화
  rationale: 소유격은 본문에 분명히 있으며, 예언자적·언약적 관계를 드러내므로 삭제하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: שׁמע의 의미를 ‘듣다’로 유지할지 ‘순종하다’로 풀어낼지
  chosen_reading: 본문에서는 ‘듣지 않았기 때문입니다’로 유지했습니다.
  alternative_readings:
  - ‘순종하지 않았기 때문입니다’
  rationale: 히브리어 관용구가 순종을 함축하지만, 본문이 지닌 어휘적 긴장을 보존하기 위해 더 해석적인 표현은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
