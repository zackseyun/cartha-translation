    rationale: ‘듣다’는 보통 ‘말을 듣다’ 또는 ‘말에 귀 기울이다’처럼 목적어와 결합합니다. 원문의 לֹא שָׁמְעוּ לוֹ는 문자적으로 ‘그에게 듣지 않았다’이지만, 한국어 본문에서는 ‘그분의 말을 듣지 않았다’가 자연스럽고 의미상 충실합니다.
  - severity: low
    issue: 주어 표지와 처소 표현을 다듬을 수 있습니다.
    rationale: ‘나의 하나님께서’는 존대 문체에 더 자연스럽고, ‘민족들 가운데서’는 민족들 사이에 흩어져 떠도는 의미를 분명하게 합니다.
