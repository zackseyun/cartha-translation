    rationale: 각주 a는 ‘민족들처럼 환호하며’라는 난해하고 압축된 구문에, 각주 b는 ‘창녀의 삯’에 붙어야 합니다. 또한 b는 אֶתְנָן의 의미를 설명해야 독자가 본문의 은유를 올바르게 이해할 수 있습니다.
