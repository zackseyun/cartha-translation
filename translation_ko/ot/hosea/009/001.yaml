id: HOS.9.1
reference: Hosea 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
  footnotes:
  - marker: a
    text: Or 'to exult like the nations.' The Hebrew phrase is compressed and may be rendered in more than one natural English way.
    reason: lexical_alternative
  - marker: b
    text: '''A prostitute’s payment'' refers to the wages or hire associated with prostitution, here used metaphorically for Israel’s idolatrous gain.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘아, 다른 민족들처럼 환호하며 기뻐하지 마십시오. 당신은 당신의 하나님을 떠나 음행하였고, 모든 타작마당에서 창녀의 삯을 사랑하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 표현은 압축되어 있어 '기뻐하다' 또는 '환호하다'로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''당신의 하나님을 떠나''는 히브리어의 מֵעַל를 관계적·언약적 이탈로 드러낸 옮김입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  english_pob_choice: Do not rejoice
  chosen_korean: 기뻐하지 마십시오
  alternatives_korean:
  - 즐거워하지 마십시오
  - 환호하지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형은 금지이며, שׂמח는 기본적으로 기쁨/환희를 뜻하므로 현대 합쇼체에서는 자연스러운 금지형으로 옮겼습니다.
- source_word: אֶל גִּיל כָּעַמִּים
  english_pob_choice: with exultation like the peoples
  chosen_korean: 다른 민족들처럼 환호하며
  alternatives_korean:
  - 민족들처럼 기뻐하며
  - 백성들처럼 환희에 차서
  lexicon: HALOT
  rationale: 압축된 히브리어 표현을 한국어에서는 부사구로 풀어, 이스라엘이 주변 민족들과 같은 방식으로 축하해서는 안 된다는 점을 드러냈습니다.
- source_word: זָנִיתָ מֵ/עַל אֱלֹהֶיךָ
  english_pob_choice: you have played the prostitute away from your God
  chosen_korean: 당신은 당신의 하나님을 떠나 음행하였고
  alternatives_korean:
  - 당신의 하나님에게서 떠나 창녀 짓을 하였고
  - 당신은 당신의 하나님에게서 벗어나 음행하였고
  lexicon: HALOT
  rationale: 호세아서의 언약 배반 비유를 완화하지 않기 위해 음행 이미지를 유지하되, מֵעַל은 관계적 이탈로 이해되어 '떠나'로 옮겼습니다.
- source_word: אֶתְנָן
  english_pob_choice: a prostitute’s payment
  chosen_korean: 창녀의 삯
  alternatives_korean:
  - 음행의 삯
  - 창기의 삯
  lexicon: HALOT
  rationale: אֶתְנָן은 창녀에게 주는 대가/삯을 가리키므로, 한국어 성경의 통상적이면서도 직설적인 표현인 '삯'을 택했습니다.
theological_decisions:
- issue: 호세아의 성적 은유를 얼마나 직접적으로 살릴 것인가
  chosen_reading: 주된 경고와 언약 배반의 강도를 유지하기 위해 '음행하였고'를 본문에 남겼습니다.
  alternative_readings:
  - '''부정하였고''처럼 더 추상적으로 옮김'
  - '''창녀 짓을 하였고''로 더 노골적으로 옮김'
  rationale: 호세아는 우상숭배를 성적 불륜으로 형상화하므로, 은유를 추상화하면 본문의 예언적 충격과 신학적 결속이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
