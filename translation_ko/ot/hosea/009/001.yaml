  source_fidelity: 본문은 금지(אַל+미완료형), 이스라엘의 음행/배교 은유, 그리고 모든 곡식 타작마당에서의 ‘창녀의 삯’을 사랑함이라는 핵심을 대체로 충실히 옮겼습니다. 다만 דָּגָן(곡식)이 본문에서 빠져 있어 보완하는 것이 좋습니다. ‘다른 민족들’의 ‘다른’은 원문에 명시되지 않았으므로 ‘민족들’로 유지하는 편이 더 직접적입니다.
  naturalness: ‘민족들처럼 환호하며 기뻐하지 마십시오’는 압축된 히브리어 표현을 현대 한국어로 자연스럽게 풀어 낸 표현입니다. 합쇼체도 일관됩니다. ‘곡식 타작마당마다’는 원문의 농경 어휘를 살리면서도 자연스럽습니다.
  terminology: ‘음행하였고’는 זָנִיתָ의 성적 은유를 유지하며, ‘창녀의 삯’은 אֶתְנָן의 구체적인 의미를 보존합니다. 각주 b는 현행처럼 מֵעַל의 번역 선택을 설명하기보다 אֶתְנָן의 문화적·은유적 의미를 설명해야 하며, 해당 말에 직접 붙어야 합니다.
