source:
  edition: WLC
  text: תֵּן לָ/הֶ֥ם יְהוָ֖ה מַה תִּתֵּ֑ן תֵּן לָ/הֶם֙ רֶ֣חֶם מַשְׁכִּ֔יל וְ/שָׁדַ֖יִם צֹמְקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
  footnotes:
  - marker: a
    text: Or 'a bereaving womb.' The Hebrew participle can carry the sense of causing loss of children; 'miscarrying womb' makes the reproductive judgment more explicit in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 주십시오, 야훼여—무엇을 주시겠습니까? 그들에게 임신하지 못하는 태와 마른 젖가슴을 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이를 잃게 하는 태’로도 옮길 수 있습니다. 히브리어 분사형은 자녀를 잃게 하는 뜻을 담을 수 있어, 문맥상 생식 심판을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן / תִּתֵּן
  english_pob_choice: Give / what will you give?
  chosen_korean: 주십시오 / 무엇을 주시겠습니까?
  alternatives_korean:
  - 주십시오 / 무엇을 주셔야 합니까?
  - 주시옵소서 / 무엇을 주시렵니까?
  lexicon: WLC; HALOT
  rationale: 직접적인 호소와 수사적 질문을 살려, 하나님께 드리는 간청의 긴장감을 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC; doctrine term
  rationale: 본문의 여호와문자표기(테트라그라마톤)를 POB 관례에 따라 고유한 신적 이름인 ‘야훼’로 옮겼습니다.
- source_word: רֶחֶם מַשְׁכִּיל
  english_pob_choice: a miscarrying womb
  chosen_korean: 임신하지 못하는 태
  alternatives_korean:
  - 유산하는 태
  - 아이를 잃게 하는 태
  - 불임의 태
  lexicon: HALOT
  rationale: 문맥상 출산 실패를 뜻하는 심판 이미지가 핵심이므로, ‘태’로 번역하되 결과를 직접 드러내는 ‘임신하지 못하는’으로 표현했습니다. ‘태’는 womb의 직접 대응어로, 이 문맥에서 생식 기관의 심판을 분명히 드러냅니다.
- source_word: שָׁדַיִם צֹמְקִים
  english_pob_choice: dry breasts
  chosen_korean: 마른 젖가슴
  alternatives_korean:
  - 메마른 젖가슴
  - 마른 젖
  - 시든 젖가슴
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 유지하기 위해 ‘젖가슴’을 택했고, צֹמְקִים의 건조함은 간결한 ‘마른’으로 살렸습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호소의 존칭과 명령형 처리
  chosen_reading: ‘주십시오’와 ‘주시겠습니까?’로, 기도체의 간청과 수사적 질문을 함께 살렸습니다.
  alternative_readings:
  - ‘주옵소서’
  - ‘주실 것입니까?’
  rationale: 본문은 예언적 탄원과 심판 요청이 함께 있는 구절이므로, 지나치게 전통적 기도문체로 고정하지 않고 현대 합쇼체로 긴장을 유지했습니다.
  doctrine_reference: POB Korean style guideline for direct address to God
