id: HOS.9.8
reference: Hosea 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
  footnotes:
  - marker: a
    text: Or, 'Ephraim is a watchman with my God; the prophet is a fowler’s snare on all his ways.' The Hebrew syntax is difficult, and some take the first clause more positively before the verse turns to accusation.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'hostility,' with the sense of hatred or enmity.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임의 파수꾼은 내 하나님과 함께 있습니다[a]. 선지자는 그의 모든 길에 덫이 되는 새잡이 올무입니다[b], 그리고 그의 하나님의 집에는 적대가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘에브라임은 내 하나님과 함께 있는 파수꾼이다. 선지자는 그의 모든 길에 새잡이의 올무이다.’ 히브리어 통사는 어렵고, 어떤 이들은 첫 절을 더 긍정적으로 읽은 뒤, 뒤의 절에서 고발로 전환된다고 봅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘적대’로, 미움이나 원한의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  english_pob_choice: watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 감시자
  - 망보는 자
  - 초소병
  lexicon: HALOT
  rationale: 감독·경계의 의미를 살리면서도 예언자적 경계 이미지와 잘 맞는 표준어를 택했습니다.
- source_word: עִם אֱלֹהָי
  english_pob_choice: with my God
  chosen_korean: 내 하나님과 함께
  alternatives_korean:
  - 내 하나님과
  - 하나님과 함께
  - 내 하나님 곁에
  lexicon: HALOT
  rationale: עִם의 기본값인 ‘함께/with’를 살리되, 1인칭 소유격을 ‘내 하나님’으로 드러내어 화자 시점을 보존했습니다.
- source_word: פַּח יָקוֹשׁ
  english_pob_choice: a fowler’s snare
  chosen_korean: 새잡이 올무
  alternatives_korean:
  - 새잡이 덫
  - 포수의 덫
  - 덫
  lexicon: HALOT
  rationale: 직역만 하면 어색하므로 ‘새잡이’와 ‘올무’로 포획의 이미지를 자연스럽게 옮겼습니다.
- source_word: מַשְׂטֵמָה
  english_pob_choice: hostility
  chosen_korean: 적대
  alternatives_korean:
  - 증오
  - 원한
  - 적개심
  lexicon: HALOT
  rationale: 단순 감정보다 관계적 반대와 적대 행위를 포괄하는 표현으로, 문맥의 공개적 비난을 넓게 담습니다.
theological_decisions:
- issue: ‘내 하나님’과 ‘그의 하나님’의 대조
  chosen_reading: 두 소유격을 그대로 유지해 ‘내 하나님’과 ‘그의 하나님의 집’을 구분했습니다.
  alternative_readings:
  - 둘 다 ‘하나님’으로 평탄화
  - 둘 다 같은 시점으로 조정
  rationale: 히브리어가 주는 긴장과 분리를 줄이지 않고, 화자와 대상 사이의 거리감을 그대로 드러내는 편이 원문 충실성에 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 첫 절의 해석 난점
  chosen_reading: 문맥의 고발성을 살린 기본 본문을 본문에 두고, 첫 절의 대안 독법은 각주로 보완했습니다.
  alternative_readings:
  - ‘에브라임은 내 하나님과 함께 있는 파수꾼이다’로 긍정적으로 읽기
  rationale: 히브리어 통사 구조가 어렵기 때문에, 본문은 가장 자연스러운 비난 구조로 두되 대안 해석 가능성을 삭제하지 않았습니다.
  doctrine_reference: Translation philosophy §3
