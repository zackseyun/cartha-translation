- from: 에브라임의 파수꾼은 내 하나님과 함께 있습니다[a]. 선지자는 그의 모든 길에 덫이 되는 새잡이 올무입니다[b], 그리고 그의 하나님의 집에는 적대가 있습니다.
  to: 에브라임의 파수꾼은 내 하나님과 함께 있습니다[a]. 선지자는 그의 모든 길에 새잡이의 올무입니다. 그의 하나님의 집에는 적대가 있습니다[b].
  rationale: 수정문은 히브리어의 소유격 대조(‘내 하나님’/‘그의 하나님’)와 문맥상 불분명한 ‘그의’를 그대로 보존합니다. ‘새잡이의 올무’로 포획 비유를 자연스러운 한국어로 바로 옮기고, ‘적대’에 관한 각주를 해당 낱말에 정확히 연결했습니다.
