  - 원한
  - 적개심
  lexicon: HALOT
  rationale: 단순 감정보다 관계적 반대와 적대 행위를 포괄하는 표현으로, 문맥의 공개적 비난을 넓게 담습니다.
theological_decisions:
- issue: ‘내 하나님’과 ‘그의 하나님’의 대조
  chosen_reading: 두 소유격을 그대로 유지해 ‘내 하나님’과 ‘그의 하나님의 집’을 구분했습니다.
  alternative_readings:
  - 둘 다 ‘하나님’으로 평탄화
  - 둘 다 같은 시점으로 조정
  rationale: 히브리어가 주는 긴장과 분리를 줄이지 않고, 화자와 대상 사이의 거리감을 그대로 드러내는 편이 원문 충실성에 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 첫 절의 해석 난점
  chosen_reading: 문맥의 고발성을 살린 기본 본문을 본문에 두고, 첫 절의 대안 독법은 각주로 보완했습니다.
  alternative_readings:
  - ‘에브라임은 내 하나님과 함께 있는 파수꾼이다’로 긍정적으로 읽기
  rationale: 히브리어 통사 구조가 어렵기 때문에, 본문은 가장 자연스러운 비난 구조로 두되 대안 해석 가능성을 삭제하지 않았습니다.
  doctrine_reference: Translation philosophy §3
