  - 하나님과 함께
  - 내 하나님 곁에
  lexicon: HALOT
  rationale: עִם의 기본값인 ‘함께/with’를 살리되, 1인칭 소유격을 ‘내 하나님’으로 드러내어 화자 시점을 보존했습니다.
- source_word: פַּח יָקוֹשׁ
  english_pob_choice: a fowler’s snare
  chosen_korean: 새잡이 올무
  alternatives_korean:
