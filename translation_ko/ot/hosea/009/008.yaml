  lexicon: HALOT
  rationale: 감독·경계의 의미를 살리면서도 예언자적 경계 이미지와 잘 맞는 표준어를 택했습니다.
- source_word: עִם אֱלֹהָי
  english_pob_choice: with my God
  chosen_korean: 내 하나님과 함께
  alternatives_korean:
