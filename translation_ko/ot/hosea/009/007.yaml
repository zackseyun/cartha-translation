reference: Hosea 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
  footnotes:
  - marker: a
    text: Or, 'The prophet is foolish; the inspired man is mad.' The Hebrew phrase 'man of the spirit' may mean one claiming spiritual inspiration.
    reason: lexical_alternative
  - marker: b
    text: 'Some understand this line as the people''s scornful description of the true prophet: ''The prophet is a fool; the man of the spirit is mad.'' The Hebrew does not explicitly mark it as a quotation.'
    reason: alternative_reading
  - marker: c
    text: Or 'the abundance of your guilt and great hostility/hatred.' The final noun may refer to enmity or animosity, and its precise object is not stated.
    reason: lexical_alternative
translation:
  language: ko
  text: 징벌의 날이 이르렀습니다. 보응의 날도 이르렀습니다. 이스라엘은 그것을 알게 될 것입니다. 예언자는 어리석은 자요, 영의 사람은 미친 사람입니다[a][b]. 이는 당신의 죄악이 많고 적대감이 크기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자는 어리석은 자요, 영감받은 사람은 미친 사람입니다.’ 히브리어의 ‘영의 사람’은 자칭 영적 영감을 주장하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 어떤 이들은 이 행을 백성이 참예언자를 비웃는 말로 이해합니다. ‘예언자는 어리석은 자요, 영의 사람은 미친 사람입니다.’ 히브리어는 이것을 명시적으로 인용문으로 표시하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘당신의 죄악의 많음과 큰 적대감 때문에.’ 마지막 명사는 적의, 반감, 증오를 가리킬 수 있으며, 그 정확한 대상은 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ יְמֵי הַפְּקֻדָּה
  english_pob_choice: The days of punishment have come
  chosen_korean: 징벌의 날이 이르렀습니다
  alternatives_korean:
  - 벌의 날이 왔습니다
  - 책벌의 날이 이르렀습니다
  - 심판의 날이 이르렀습니다
  lexicon: HALOT
  rationale: פְּקֻדָּה는 예언서 문맥에서 징벌적 ‘방문/처리’의 의미이므로, 현대 한국어에서는 ‘징벌’이 판단의 공적·형벌적 뉘앙스를 가장 분명하게 살립니다.
- source_word: בָּאוּ יְמֵי הַשִּׁלֻּם
  english_pob_choice: The days of repayment have come
  chosen_korean: 보응의 날도 이르렀습니다
  alternatives_korean:
  - 갚음의 날도 이르렀습니다
  - 되갚음의 날도 이르렀습니다
  - 보수의 날도 이르렀습니다
  lexicon: HALOT
  rationale: שִׁלֻּם은 ‘지불/되갚음’의 뜻이므로, 선행하는 ‘징벌’과 병행되도록 ‘보응’으로 옮겨 결과가 되돌아온다는 의미를 살렸습니다.
- source_word: אִישׁ הָרוּחַ
  english_pob_choice: the man of the spirit
  chosen_korean: 영의 사람
  alternatives_korean:
  - 영적인 사람
  - 영을 받은 사람
  - 성령의 사람
  lexicon: HALOT
  rationale: 히브리어 표현을 지나치게 신학화하지 않으면서도 직역성을 유지하려면 ‘영의 사람’이 가장 가깝습니다. 여기서 ‘영’은 문맥상 인간의 영감/영적 주장일 수 있어 대문자화하지 않았습니다.
- source_word: עַל רֹב עֲוֺנְךָ
  english_pob_choice: because of the greatness of your iniquity
  chosen_korean: 이는 당신의 죄악이 크기 때문입니다
  alternatives_korean:
  - 당신의 큰 죄악 때문에
  - 당신의 죄악의 크기 때문에
  - 당신의 죄가 매우 크기 때문에
  lexicon: HALOT
  rationale: רֹב은 ‘많음/큼’을 뜻하므로 ‘크기 때문입니다’로 압축해 자연스러운 한국어를 만들되, עָוֹן의 도덕·언약적 무게는 ‘죄악’으로 보존했습니다.
- source_word: וְרַבָּה מַשְׂטֵמָה
  english_pob_choice: and your great hostility
  chosen_korean: 당신의 적대감이 크기 때문입니다
  alternatives_korean:
  - 당신의 큰 적대감 때문에
  - 당신의 증오가 크기 때문입니다
  - 당신의 원한이 크기 때문입니다
  lexicon: HALOT
  rationale: מַשְׂטֵמָה는 적대/반감을 가리키므로, 한국어에서는 ‘적대감’이 가장 중립적이면서도 관계적 적대 상태를 잘 드러냅니다.
theological_decisions:
- issue: ‘예언자’와 ‘영의 사람’에 대한 조롱이 인용문인지 서술인지
  chosen_reading: 본문 흐름상 심판 날에 드러나는 예언적 조롱/판정으로 읽되, 따옴표로 명시적 인용은 하지 않습니다.
  alternative_readings:
  - 백성이 참예언자를 비웃는 말을 인용한 것
  - 거짓 예언자만을 겨냥한 풍자
  rationale: 히브리어는 이 구절을 인용문으로 표지하지 않으며, 직전의 ‘이스라엘은 그것을 알게 될 것입니다’와 이어질 때 심판 선언으로 읽는 흐름이 자연스럽습니다. 따라서 본문은 중립적으로 유지하고 해석상의 여지를 각주로 남깁니다.
  doctrine_reference: 해석상 긴장을 보존하고 본문에 없는 화자 표지를 덧씌우지 않음
- issue: ‘영’의 지시 대상
  chosen_reading: 성령으로 단정하지 않고 인간의 영감/영적 주장 가능성을 열어 둡니다.
  alternative_readings:
  - 하나님의 영에 감동된 사람
  - 성령의 사람
  rationale: 이 문맥은 비난의 병렬 구조이며, 히브리어는 여기서 구체적으로 ‘성령’을 요구하지 않습니다. 따라서 한국어도 ‘영’으로 두어 신학적 특수화를 피합니다.
  doctrine_reference: 본문이 명시하지 않는 교리적 구체화를 피함
