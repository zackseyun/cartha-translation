id: HOS.9.16
reference: Hosea 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
  footnotes:
  - marker: a
    text: Or 'its root is dried up.' The Hebrew has a plural suffix ('their root'), though 'Ephraim' is a singular collective name.
    reason: lexical_alternative
  - marker: b
    text: Or 'the beloved/precious ones of their womb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임이 징계를 받았습니다[a]. 그 뿌리는 말라 버렸고, 열매를 맺지 못할 것입니다. 비록 그들이 아이를 낳더라도[b], 저는 그들의 태중의 사랑스러운 자들을 죽이겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뿌리가 말라 버렸습니다.’ 히브리어는 ‘그들의 뿌리’라는 복수 접미사를 쓰지만, ‘에브라임’은 형태상 단수 집합명사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 낳는 사랑스러운/소중한 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻכָּה
  english_pob_choice: is stricken
  chosen_korean: 징계를 받았습니다
  alternatives_korean:
  - 타격을 입었습니다
  - 매를 맞았습니다
  - 쳐졌습니다
  lexicon: HALOT
  rationale: 원문은 נכה의 수동형으로, 단순 상태보다 심판 아래 놓인 결과를 나타냅니다. 한국어에서는 ‘징계를 받다’가 현대어로 자연스럽고, 예언적 심판의 무게도 유지합니다.
- source_word: שָׁרְשָׁם
  english_pob_choice: their root
  chosen_korean: 그 뿌리
  alternatives_korean:
  - 그들의 뿌리
  - 그 뿌리가
  lexicon: HALOT
  rationale: 히브리어는 복수 접미사를 가지지만, 에브라임은 집합명사처럼 쓰입니다. 한국어 본문에서는 흐름을 살려 ‘그 뿌리’로 두고, 각주에서 복수형 뉘앙스를 설명합니다.
- source_word: פְּרִי
  english_pob_choice: fruit
  chosen_korean: 열매
  alternatives_korean:
  - 소산
  - 산출물
  - 자녀
  lexicon: HALOT
  rationale: 농경 은유를 그대로 살리는 기본어입니다. 뒤의 출산 절과 연결될 때, 열매 없음에서 자녀 상실로 심판이 확대되는 효과가 유지됩니다.
- source_word: מַחֲמַדֵּי בִטְנָם
  english_pob_choice: the cherished ones of their womb
  chosen_korean: 태중의 사랑스러운 자들
  alternatives_korean:
  - 태중의 소중한 자들
  - 태중의 귀한 자들
  - 자궁의 사랑받는 자들
  lexicon: HALOT
  rationale: 마ֲחֲמַדֵּי의 핵심은 ‘사랑스럽고 소중한’ 대상입니다. ‘태중의 사랑스러운 자들’은 자녀를 가리키는 정서적 가치를 살리면서도, 원문의 충격적 심판 진술을 약화시키지 않습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: ‘저는 그들의 태중의 사랑스러운 자들을 죽이겠습니다’로 1인칭 직접 발화를 유지합니다.
  alternative_readings:
  - 그들은 죽을 것입니다
  - 죽음에 이를 것입니다
  rationale: 히브리어는 1인칭 단수의 능동적 심판 선언입니다. 이를 비인칭 결과로 완화하지 않고, 예언자적 경고의 직접성을 보존합니다.
  doctrine_reference: 신적 주권과 언약적 심판의 직접성
