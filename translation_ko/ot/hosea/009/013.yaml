id: HOS.9.13
reference: Hosea 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
  footnotes:
  - marker: a
    text: Or "as I saw, Ephraim was planted like Tyre in a pleasant place." The Hebrew syntax of the comparison is compressed.
    reason: alternative_reading
  - marker: b
    text: Or "to the slayer" or "to slaughter." The Hebrew says literally "to the killer/slayer."
    reason: lexical_alternative
  - marker: c
    text: Hebrew "his sons"; translated "his children" here to reflect the likely collective sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은, 내가 본 바로는, 좋은 곳에 심긴 것처럼 두로와 같습니다[a][b]. 그러나 에브라임은 자기 자녀를 살해자에게 내주어야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 보았듯이, 에브라임은 좋은 곳에 두로처럼 심겨 있었습니다.” 히브리어 비교 구문은 압축되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “살해자”보다 “도살자”로도 옮길 수 있습니다. 히브리어는 문자적으로 “죽이는 자/살해자”를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 “그의 아들들”이지만, 여기서는 집단적 후손을 가리키는 말로 보아 “자녀”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
  - 에브라임 지파
  - 북이스라엘
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 따랐습니다. 문맥상 북왕국을 가리키더라도 본문 표지는 ‘에브라임’이므로 이를 유지하는 편이 원문에 더 가깝습니다.
- source_word: כַּאֲשֶׁר רָאִיתִי
  english_pob_choice: as I have seen
  chosen_korean: 내가 본 바로는
  alternatives_korean:
  - 내가 보았듯이
  - 내가 보니
  lexicon: HALOT
  rationale: 비교절의 압축된 히브리어 구문을 한국어로 자연스럽게 풀되, 예언자의 관찰 발화를 분명히 드러냈습니다.
- source_word: בְנָוֶה
  english_pob_choice: in a pleasant pasture
  chosen_korean: 좋은 곳에
  alternatives_korean:
  - 아름다운 곳에
  - 쾌적한 목초지에
  - 좋은 목초지에
  lexicon: HALOT
  rationale: נָוֶה는 안식처/거처/목초지까지 포괄할 수 있어, 여기서는 심겨진 이미지와 어울리도록 비교적 넓은 ‘좋은 곳’으로 옮겼습니다. 영어 POB의 해석 흔적도 함께 반영했습니다.
- source_word: אֶל הֹרֵג
  english_pob_choice: to the killer
  chosen_korean: 살해자에게
  alternatives_korean:
  - 살육자에게
  - 죽이는 자에게
  - 살인자에게
  lexicon: HALOT
  rationale: 능동 분사 הֹרֵג의 개인적 행위자를 살려 ‘살해자’로 옮겼습니다. ‘학살’ 같은 추상명사보다 원문의 행위 주체가 더 분명해집니다.
- source_word: בָּנָיו
  english_pob_choice: his children
  chosen_korean: 자녀를
  alternatives_korean:
  - 아들들을
  - 자식을
  lexicon: HALOT
  rationale: 히브리어가 형식상 ‘아들들’이지만 집단적 후손을 가리키는 문맥이므로, POB의 판단을 따라 현대 한국어에서 자연스러운 ‘자녀’로 옮겼습니다.
theological_decisions:
- issue: 비교 구문과 심판 구문의 긴장을 보존할지, 의미를 평탄하게 정리할지
  chosen_reading: 좋은 곳에 심긴 이미지와 ‘자녀를 살해자에게 내주어야 함’의 급반전을 그대로 유지했습니다.
  alternative_readings:
  - 번영했으나 결국 멸망할 것입니다
  - 에브라임은 번성한 뒤 자녀를 잃게 됩니다
  rationale: 본문의 힘은 안전하게 심긴 이미지와 잔혹한 종결의 대비에 있으므로, 해석적 요약으로 평탄화하지 않았습니다.
  doctrine_reference: '번역 원칙: 원문의 표면적 은유와 긴장을 보존하여 독자가 본문의 충격을 그대로 접하게 함.'
