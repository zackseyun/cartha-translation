  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
  footnotes:
  - marker: a
    text: Or 'new wine will disappoint her' or 'new wine will prove false to her.' The Hebrew verb can carry the sense of failing to deliver what was expected.
    reason: lexical_alternative
translation:
  language: ko
  text: 타작마당과 포도주 틀은 그들에게 먹을 것을 주지 못하고, 새 포도주는 그녀에게 속일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 '기대에 못 미치다', '속이다', '헛되게 하다'의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן וָיֶקֶב
  english_pob_choice: threshing floor and winepress
  chosen_korean: 타작마당과 포도주 틀
  alternatives_korean:
  - 타작마당과 술틀
  - 곡식마당과 포도주 틀
  lexicon: HALOT
  rationale: գֹּרֶן과 יֶקֶב의 구체적 농업 이미지를 살리기 위해 각각 타작마당과 포도주 틀로 옮겼습니다. '타작마당'은 수확의 장소성을, '포도주 틀'은 압착 장치를 분명히 드러냅니다.
- source_word: יִרְעֵם
  english_pob_choice: will not feed them
  chosen_korean: 그들에게 먹을 것을 주지 못하고
  alternatives_korean:
  - 그들을 먹이지 못하고
  - 그들을 먹일 수 없고
  - 그들에게 양식을 주지 못하고
  lexicon: HALOT
  rationale: רעה의 기본 뜻인 '먹이다/먹을 것을 주다'를 따라, 비인격적 주어인 타작마당과 포도주 틀에 자연스러운 한국어로 옮겼습니다. '먹이지 않다'보다 '먹을 것을 주지 못하다'가 공급 실패의 뉘앙스를 더 잘 드러냅니다.
- source_word: תִּירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 갓 짠 포도주
  - 신 포도주
  lexicon: HALOT
  rationale: תִּירוֹשׁ은 일반적인 '포도주'보다 수확 직후의 새 포도주를 가리키므로, 농경 심판 문맥을 유지하는 '새 포도주'가 가장 적절합니다.
- source_word: יְכַחֶשׁ
  english_pob_choice: will fail
  chosen_korean: 속일 것입니다
  alternatives_korean:
  - 실패할 것입니다
  - 기대를 저버릴 것입니다
  - 헛될 것입니다
  lexicon: HALOT
  rationale: כחש는 '속이다/기대를 저버리다/거짓이 되다'의 범위를 가지므로, 새 포도주를 주어로 할 때 '속이다'가 의인화와 기대 배반의 의미를 함께 살립니다.
- source_word: בָּהּ
  english_pob_choice: her
  chosen_korean: 그녀에게
  alternatives_korean:
  - 그들에게
  - 그것에게
  - 이스라엘에게
  lexicon: HALOT
  rationale: 3인칭 여성 단수 접미사는 이스라엘/에브라임을 여성 단수로 의인화한 표현이므로, 본문 이미지를 유지해 '그녀에게'로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 대명사 보존
  chosen_reading: 이스라엘을 여성 단수로 의인화한 표현을 그대로 살려 '그녀에게'로 번역했습니다.
  alternative_readings:
  - 집합명사로 보고 '그들에게'로 완화
  - 땅을 지시하는 것으로 보고 '그것에게'로 처리
  rationale: 호세아는 민족을 신부/아내 이미지로 자주 다루므로, 여성형 지시를 평탄화하지 않는 것이 본문의 예언적 수사와 정서를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
