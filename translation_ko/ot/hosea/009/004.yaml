source:
  edition: WLC
  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'like bread of mourners.' The phrase likely refers to food associated with mourning and therefore conveying ritual uncleanness.
    reason: lexical_alternative
  - marker: b
    text: Or 'for their appetite' or 'for themselves.' The Hebrew phrase means the bread is only for their own use, not fit to be brought into the house of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼께 포도주를 붓지 못하며, 그들의 제사도 그분을 기쁘게 하지 못할 것입니다. 그것들은 상주들의 떡과 같아서, 그것을 먹는 자는 모두 부정하게 될 것입니다. 이는 그들의 떡이 오로지 자기들만을 위한 것이어서, 야훼의 집에 들어가지 못하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상주들의 떡처럼.’ 이 표현은 죽음과 관련된 음식, 곧 제의적 부정함을 띤 음식을 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 욕구를 위해서’ 혹은 ‘그들 자신을 위해서.’ 히브리어는 그 떡이 오직 자기들만의 소비를 위한 것이며, 야훼의 집에 들여갈 수 없음을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִסְּכ֨וּ ... יַיִן
  english_pob_choice: will not pour out wine offerings
  chosen_korean: 포도주를 붓지 못하며
  alternatives_korean:
  - 포도주를 붓지 못하며
  - 포도주 붓는 제물을 바치지 못하며
  lexicon: HALOT
  rationale: נסך는 제의 문맥에서 ‘붓다/붓는 제물’의 뜻이므로, 한국어에서는 자연스럽게 ‘포도주를 붓다’로 옮기되 제의 행위를 유지했습니다.
- source_word: זִבְחֵיהֶם כְּלֶחֶם אוֹנִים
  english_pob_choice: their sacrifices will not please him. They will be like mourners’ bread to them
  chosen_korean: 그들의 제사도 그분을 기쁘게 하지 못할 것입니다. 그것들은 상주들의 떡과 같아서
  alternatives_korean:
  - 그들의 제사도 그분을 기쁘게 하지 못할 것입니다. 그것들은 상주들의 떡과 같아서
  - 그들의 제사는 상주들의 떡과 같아
  lexicon: HALOT
  rationale: זבח은 ‘제사’가 가장 자연스럽고, כְּלֶחֶם אוֹנִים은 죽음과 연관된 부정함을 지닌 ‘상주들의 떡’이라는 관용을 살려 옮겼습니다.
- source_word: יִטַמָּאוּ
  english_pob_choice: will become unclean
  chosen_korean: 부정하게 될 것입니다
  alternatives_korean:
  - 부정하게 될 것입니다
  - 더럽혀질 것입니다
  lexicon: HALOT
  rationale: 성결·제의 문맥의 טמא는 도덕적 ‘더러움’보다 ‘부정함’이 핵심이므로, 제의적 불결을 드러내는 표준어를 택했습니다.
- source_word: לְנַפְשָׁם
  english_pob_choice: for themselves alone
  chosen_korean: 오로지 자기들만을 위한 것
  alternatives_korean:
  - 오로지 자기들만을 위한 것
  - 자기들만을 위한 것
  lexicon: HALOT
  rationale: נפש는 여기서 생명/자기 자신/욕구의 뉘앙스를 가지며, 문맥상 성전 반입 불가의 이유를 분명히 하므로 ‘오로지 자기들만’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 옮기고, 성전 문맥의 언약 이름을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지해 원문 고유명과 제의적 맥락을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: ‘상주들의 떡’의 부정함 성격
  chosen_reading: 죽음과 연결된 제의적 부정함으로 이해했습니다.
  alternative_readings:
  - 단순한 슬픔의 음식
  - 도덕적으로 더러운 음식
  rationale: 제사의 수용성과 성전 출입 가능성이 논점이므로, 감정적 비유가 아니라 시체 접촉과 연결된 제의적 불결로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
