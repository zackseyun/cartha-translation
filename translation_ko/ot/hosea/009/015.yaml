id: HOS.9.15
reference: Hosea 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
  footnotes:
  - marker: a
    text: Or 'for there I hated them.' The Hebrew conjunction can be read causally ('for/because') or with emphatic force ('indeed').
    reason: lexical_alternative
  - marker: b
    text: '''My house'' may refer more specifically to the LORD''s land, sanctuary, or covenant household; the Hebrew leaves the image compact.'
    reason: cultural_note
  - marker: c
    text: Or 'All their rulers are rebellious/stubborn.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 모든 악이 길갈에 있습니다[a]. 참으로 거기에서 나는 그들을 미워했습니다. 그들의 행위의 악함 때문에 나는 내 집에서 그들을 쫓아내고[b] 더 이상 그들을 사랑하지 않겠습니다. 그들의 모든 지도자들은 반역자들입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 내가 그들을 미워했다.’ 히브리어 접속사는 원인('왜냐하면')으로도, 강조('참으로')로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 집’은 더 구체적으로는 야훼의 땅, 성소, 또는 언약 가족을 가리킬 수 있습니다. 히브리어는 이 이미지를 압축적으로 제시합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 모든 통치자들은 반역적입니다/고집스럽습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  english_pob_choice: All their evil
  chosen_korean: 그들의 모든 악
  alternatives_korean:
  - 그들의 모든 악행
  - 그들의 온갖 악함
  lexicon: HALOT
  rationale: כָּל이 단수 추상명사 רָעָה를 집합적으로 받으므로, 전체성을 살린 ‘그들의 모든 악’이 가장 간결하고 자연스럽습니다.
- source_word: בַּגִּלְגָּל
  english_pob_choice: at Gilgal
  chosen_korean: 길갈에
  alternatives_korean:
  - 길갈에서
  - 길갈 안에
  lexicon: HALOT
  rationale: ב의 장소 용법을 따라 지명 표지는 한국어에서도 ‘-에’로 옮기는 것이 가장 자연스럽습니다.
- source_word: מִבֵּיתִי
  english_pob_choice: out of my house
  chosen_korean: 내 집에서 그들을 쫓아내고
  alternatives_korean:
  - 내 집으로부터 그들을 내쫓고
  - 내 집에서 그들을 몰아내고
  lexicon: HALOT
  rationale: מִ의 분리 의미와 גָּרַשׁ의 추방 뉘앙스를 함께 드러내기 위해 ‘쫓아내다’를 택했고, ‘내 집’은 본문의 압축된 비유를 그대로 유지했습니다.
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  english_pob_choice: I will no longer love them
  chosen_korean: 더 이상 그들을 사랑하지 않겠습니다
  alternatives_korean:
  - 그들을 더 이상 사랑하지 않겠습니다
  - 다시는 그들을 사랑하지 않겠습니다
  lexicon: HALOT
  rationale: אָסַף의 관용적 의미가 ‘계속/더하다’에서 끝남을 나타내므로, 한국어에서는 중단의 뜻을 분명히 하는 ‘더 이상 … 않겠습니다’가 적절합니다.
- source_word: כָּל שָׂרֵיהֶם סֹרְרִים
  english_pob_choice: All their princes are rebels
  chosen_korean: 그들의 모든 지도자들은 반역자들입니다
  alternatives_korean:
  - 그들의 모든 통치자들은 반역적입니다
  - 그들의 모든 방백들은 완고합니다
  lexicon: HALOT
  rationale: שָׂרִים은 정치적 지도자층을 가리키므로 ‘지도자들’이 무난하고, סֹרְרִים은 단순한 고집보다 반역성/불복종이 강해 ‘반역자들’이 문맥상 더 적합합니다.
theological_decisions:
- issue: 하나님의 강한 미움 표현
  chosen_reading: ‘나는 그들을 미워했습니다’를 그대로 유지했습니다.
  alternative_readings:
  - 나는 그들을 거절했습니다
  - 나는 그들을 배척했습니다
  rationale: שָׂנֵא의 직접적 정서를 약화하지 않고, 예언 문맥의 언약적 심판 선언을 원문 강도로 보존하기 위해서입니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘내 집’의 의미 범위
  chosen_reading: ‘내 집’으로 비유를 보존했습니다.
  alternative_readings:
  - 내 땅
  - 내 성소
  - 내 백성
  rationale: 본문은 의미를 좁히지 않고 압축된 이미지를 유지하므로, 한국어도 해석을 과잉 특정하지 않고 원문의 긴장을 살리는 편이 좋습니다.
  doctrine_reference: Translation philosophy §3
