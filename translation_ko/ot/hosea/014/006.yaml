    rationale: 히브리어의 남성 단수는 이스라엘이라는 단수 집합체의 문법적 표현입니다. 한국어는 문법 성을 보존할 필요가 없으므로 ‘이스라엘은’으로 직접 밝혀 단수 집합체와 문맥상의 지시 대상을 자연스럽게 유지하는 편이 낫습니다.
