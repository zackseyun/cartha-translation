id: HOS.14.6
reference: Hosea 14:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶהְיֶ֤ה כַ/טַּל֙ לְ/יִשְׂרָאֵ֔ל יִפְרַ֖ח כַּ/שּֽׁוֹשַׁנָּ֑ה וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
  footnotes:
  - marker: a
    text: Or 'it will blossom like a lily, and it will strike its roots like Lebanon.' The Hebrew presents Israel as a singular collective.
    reason: lexical_alternative
  - marker: b
    text: Lebanon evokes firmness and grandeur, likely through its famed deep-rooted trees; the Hebrew does not explicitly say 'cedars.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 이스라엘에게 이슬과 같을 것입니다[a]. 그는 백합처럼 꽃필 것이며[b], 레바논처럼 뿌리를 뻗을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이스라엘을 단수 집합체로 표현하므로, 뒤의 동사와 소유격도 단수형으로 이어집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘백합’이라 하며, 특정 꽃의 세부 종을 좁혀 말하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  english_pob_choice: I will be
  chosen_korean: 나는 …일 것입니다
  alternatives_korean:
  - 나는 …입니다
  - 나는 …이 되겠습니다
  lexicon: HALOT
  rationale: 언약적 약속의 미래 시제를 살려 하나님 자신의 미래적 자기진술을 자연스러운 합쇼체로 옮겼습니다.
- source_word: כַ/טַּל
  english_pob_choice: like the dew
  chosen_korean: 이슬과 같을 것입니다
  alternatives_korean:
  - 이슬처럼 될 것입니다
  - 이슬처럼
  lexicon: HALOT
  rationale: 비유 표지 כ를 반영해 생명을 주는 농경적 이미지를 유지했습니다.
- source_word: יִפְרַח כַּ/שּׁוֹשַׁנָּה
  english_pob_choice: he will blossom like the lily
  chosen_korean: 백합처럼 꽃필 것이며
  alternatives_korean:
  - 백합처럼 피어날 것이며
  - 백합처럼 꽃을 피울 것이며
  lexicon: HALOT
  rationale: יִפְרַח의 꽃 피다 이미지를 살리면서, 이어지는 꽃 비유와 어울리는 간결한 표현을 택했습니다.
- source_word: וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו
  english_pob_choice: and he will strike his roots
  chosen_korean: 뿌리를 뻗을 것입니다
  alternatives_korean:
  - 뿌리를 내릴 것입니다
  - 뿌리를 뻗게 할 것입니다
  lexicon: HALOT
  rationale: 히필의 어감은 뿌리가 단단히 내려가고 퍼지는 동작을 가리키므로, 한국어에서는 자연스럽게 '뿌리를 뻗다'로 옮겼습니다.
- source_word: כַ/לְּבָנֽוֹן
  english_pob_choice: like Lebanon
  chosen_korean: 레바논처럼
  alternatives_korean:
  - 레바논의 백향목처럼
  - 레바논 땅처럼
  lexicon: HALOT
  rationale: 본문은 구체적으로 백향목이 아니라 레바논 자체를 제시하므로, 해석을 보태지 않고 지명을 그대로 유지했습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 단수 표현
  chosen_reading: 이스라엘을 단수 집합체로 보고 "그는 … 그의"로 유지했습니다.
  alternative_readings:
  - '"그것은 … 그 뿌리"로 중립화'
  - '"그들은 … 그들의"로 복수화'
  rationale: 히브리어는 이스라엘을 단수 남성 동사와 소유격으로 다루므로, 집합명사로서의 단수 이미지를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 레바논 이미지의 범위
  chosen_reading: 레바논을 그대로 두고 백향목을 본문에 넣지 않았습니다.
  alternative_readings:
  - '"레바논의 백향목처럼"으로 명시'
  - '"레바논처럼 깊게 뿌리내릴 것"으로 설명'
  rationale: 본문의 표면 의미를 보존하고, 해석적 보충은 최소화해야 한다는 원칙에 따랐습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
