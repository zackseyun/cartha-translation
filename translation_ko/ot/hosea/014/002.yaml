id: HOS.14.2
reference: Hosea 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
  footnotes:
  - marker: a
    text: Or 'because of your iniquity.' The Hebrew preposition can express cause as well as the sphere in which Israel has stumbled.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘아, 야훼 당신의 하나님께로 돌아오십시오. 당신이 당신의 죄악으로 말미암아 걸려 넘어졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 죄악 때문에’. 히브리어 전치사 ב는 원인과 상태/영역을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아가십시오
  - 회개하십시오
  lexicon: HALOT
  rationale: שוב의 기본 의미인 ‘돌아가다/되돌아오다’를 살리면서, 예언자적 회개의 함의를 너무 좁게 한정하지 않기 위해 존댓말 명령형으로 옮겼습니다.
- source_word: עַד יְהוָה אֱלֹהֶיךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께
  alternatives_korean:
  - 여호와 당신의 하나님께
  - 야훼 네 하나님께
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기본값에 따라 야훼로 옮겼고, 2인칭 단수 소유격은 예언 선포의 직접 호소를 살려 ‘당신의 하나님’으로 처리했습니다.
- source_word: כִּי כָשַׁלְתָּ
  english_pob_choice: for you have stumbled
  chosen_korean: 당신이 ... 걸려 넘어졌기 때문입니다
  alternatives_korean:
  - 당신이 ... 넘어졌기 때문입니다
  - 당신이 ... 비틀거렸기 때문입니다
  lexicon: HALOT
  rationale: כשל의 은유적 ‘넘어지다/걸려 넘어지다’ 의미를 살려, 단순한 실패보다 더 생생한 이미지를 주는 표현으로 옮겼습니다.
- source_word: בַּעֲוֺנֶךָ
  english_pob_choice: in your iniquity
  chosen_korean: 당신의 죄악으로 말미암아
  alternatives_korean:
  - 당신의 죄악 안에서
  - 당신의 죄악 때문에
  lexicon: HALOT
  rationale: ב의 원인/영역 가능성을 한국어에서 자연스럽게 담기 위해 ‘말미암아’를 택해, 본문의 압축된 인과-상태 표현을 유지했습니다.
theological_decisions:
- issue: 여호와 전통 번역 대신 YHWH의 고유명사적 표기 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본 원칙에 따라 언약 이름을 고유명사로 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שוב의 예언자적 호출을 어떻게 한국어로 드러낼지
  chosen_reading: 돌아오십시오
  alternative_readings:
  - 회개하십시오
  - 돌아가십시오
  rationale: 문맥상 회개가 함의되지만, 본문의 핵심 동작은 ‘하나님께로 돌아옴’이므로 명령형을 유지하되 의미를 과도하게 신학화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
