source:
  edition: WLC
  text: אֶרְפָּא֙ מְשׁ֣וּבָתָ֔/ם אֹהֲבֵ֖/ם נְדָבָ֑ה כִּ֛י שָׁ֥ב אַפִּ֖/י מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
  footnotes:
  - marker: a
    text: Hebrew 'from him'; some translations smooth the number shift to 'from them.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 그들의 타락을 고치고, 그들을 값없이 사랑하겠습니다. 이는 내 진노가 그에게서 돌아섰기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마지막 대명사를 단수 ‘그에게서’로 둡니다. 일부 번역은 앞의 복수에 맞추어 ‘그들에게서’로 매끈하게 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְפָּא
  english_pob_choice: I will heal
  chosen_korean: 고치고
  alternatives_korean:
  - 치유하고
  - 회복하고
  lexicon: HALOT
  rationale: רפא의 기본 의미를 살리면서도 한국어에서 신체적·도덕적 회복 모두에 자연스럽게 들리는 동사를 택했습니다. 문맥상 언약적 타락의 치유라는 의미가 분명하므로 ‘고치다’가 간결합니다.
- source_word: מְשׁוּבָתָם
  english_pob_choice: their apostasy
  chosen_korean: 그들의 타락
  alternatives_korean:
  - 그들의 배교
  - 그들의 돌아섬
  lexicon: HALOT
  rationale: מְשׁוּבָה는 ‘돌아섬/이탈/배교’의 뜻을 가지며, 호세아서의 언약적 반역을 가리킵니다. 한국어에서는 현대 독자가 이해하기 쉬운 ‘타락’을 택하되, 단순한 도덕적 추락만이 아니라 하나님께서 떠난 상태라는 뉘앙스를 유지했습니다.
- source_word: נְדָבָה
  english_pob_choice: freely
  chosen_korean: 값없이
  alternatives_korean:
  - 자원하여
  - 자발적으로
  - 은혜로
  lexicon: HALOT
  rationale: נְדָבָה의 ‘자원함/자유의지/자유로운 헌물’ 배경을 한국어 부사로 옮기기 위해 ‘값없이’를 선택했습니다. 이는 강요나 공로가 아닌 무조건적 은혜의 사랑을 자연스럽게 드러냅니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그들에게서
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 접미사를 그대로 반영해 ‘그에게서’로 옮겼습니다. 앞의 복수 표현과의 수적 긴장을 평준화하지 않고 보존하는 것이 원문에 더 가깝습니다.
theological_decisions:
- issue: 끝부분의 단수 대명사 유지
  chosen_reading: ‘그에게서’로 번역해 히브리어의 단수 형태를 보존했습니다.
  alternative_readings:
  - 그들에게서
  rationale: 본문은 앞의 복수 대상에서 마지막에 단수로 전환합니다. 일부 번역은 이를 자연스럽게 맞추지만, POB의 원칙상 이런 긴장을 해소하지 않고 드러내는 편이 원문 증언에 더 충실합니다.
  doctrine_reference: translation philosophy §§1, 3, 5
