id: HOS.14.3
reference: Hosea 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קְח֤וּ עִמָּ/כֶם֙ דְּבָרִ֔ים וְ/שׁ֖וּבוּ אֶל יְהוָ֑ה אִמְר֣וּ אֵלָ֗י/ו כָּל תִּשָּׂ֤א עָוֺן֙ וְ/קַח ט֔וֹב וּֽ/נְשַׁלְּמָ֥ה פָרִ֖ים שְׂפָתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
  footnotes:
  - marker: a
    text: Or “forgive all guilt” for “take away all iniquity”; the Hebrew idiom literally speaks of bearing away guilt.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the bulls of our lips,” a metaphor for spoken praise, confession, or vows offered in place of animal sacrifice. Some ancient witnesses and interpreters understand this as “the fruit of our lips.”
    reason: alternative_reading
translation:
  language: ko
  text: 말을 가지고 야훼께로 돌아오십시오. 그에게 말씀드리십시오. “모든 죄악을 없애 주시고[a], 선한 것을 받아 주십시오. 그러면 우리가 우리 입술의 황소들을 드리겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 죄책을 용서해 주십시오.” 히브리어 관용구는 문자적으로 죄악을 ‘지니고 가다’, 곧 제거한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “우리 입술의 황소들”입니다. 말로 드리는 찬양, 고백, 또는 서원을 희생 제물에 비유한 표현입니다. 옛 번역과 해석 전통에는 이를 “입술의 열매”로 이해하는 경우도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  english_pob_choice: Take words with you
  chosen_korean: 말들을 가지고
  alternatives_korean:
  - 말씀을 가지고
  - 간구의 말을 가지고
  lexicon: HALOT
  rationale: 복수형 דְּבָרִים의 기본 뜻인 ‘말들’을 살리되, 한국어에서는 자연스럽게 도구·동반의 의미를 드러내는 ‘가지고’로 옮겼습니다.
- source_word: וְשׁוּבוּ אֶל יְהוָה
  english_pob_choice: and return to Yahweh
  chosen_korean: 야훼께로 돌아오십시오
  alternatives_korean:
  - 야훼께로 돌아가십시오
  - 주님께로 돌아오십시오
  lexicon: HALOT
  rationale: שׁוּב의 언약적 회개 의미를 ‘돌아오다’로 보존했고, יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: כָּל תִּשָּׂא עָוֺן
  english_pob_choice: Take away all iniquity
  chosen_korean: 모든 죄악을 없애 주시고
  alternatives_korean:
  - 모든 죄악을 거두어 주시고
  - 모든 죄책을 용서해 주시고
  lexicon: HALOT
  rationale: נשא עון의 ‘지니고 가다/제거하다’라는 관용을 반영하되, 한국어에서 기도문으로 자연스러운 ‘없애 주시고’로 옮겨 죄의 제거와 용서를 함께 드러냈습니다.
- source_word: וְקַח טוֹב
  english_pob_choice: and receive what is good
  chosen_korean: 선한 것을 받아 주십시오
  alternatives_korean:
  - 좋은 것을 받아 주십시오
  - 선을 받아 주십시오
  lexicon: HALOT
  rationale: טוֹב를 추상명사 ‘선’으로만 두면 어색해질 수 있어, 요청의 대상이 분명한 ‘선한 것’을 택했고, שְׂפָתֵינוּ와 연결되는 제의적 청원을 고려해 하나님께서 ‘받아 주시다’로 표현했습니다.
- source_word: פָרִים שְׂפָתֵינוּ
  english_pob_choice: the fruit of our lips
  chosen_korean: 입의 황소들로 갚겠습니다
  alternatives_korean:
  - 입술의 황소들로 갚겠습니다
  - 입의 열매로 갚겠습니다
  lexicon: HALOT
  rationale: 마소라 본문의 직역인 ‘입의 황소들’을 유지해 희생제의적 은유를 보존했습니다. 한국어에서는 ‘입술’보다 פשוט한 ‘입’이 더 자연스럽고, 동사의 결과를 살리기 위해 ‘갚겠습니다’를 사용했습니다.
theological_decisions:
- issue: 회개 초청의 어조
  chosen_reading: ‘돌아오십시오’로 높임을 유지하되, 직접 उद्धन된 청원은 정중한 기도체로 전환했습니다.
  alternative_readings:
  - ‘돌아오라’와 같은 평서형 명령
  - 전면적인 서술형 완화
  rationale: 예언자적 권면과 회중의 기도적 응답이 한 절 안에 함께 있으므로, 외적 권면은 합쇼체로, 하나님께 드리는 말은 청원체로 구분해 원문의 화행을 살렸습니다.
  doctrine_reference: 'POB translation philosophy #3'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 언약명 יְהוָה를 한국어 본문에서 가려지지 않도록 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → Yahweh'
