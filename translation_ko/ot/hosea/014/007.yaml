language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵֽלְכוּ֙ יֹֽנְקוֹתָ֔י/ו וִ/יהִ֥י כַ/זַּ֖יִת הוֹד֑/וֹ וְ/רֵ֥יחַֽ ל֖/וֹ כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
  footnotes:
  - marker: a
    text: Or 'Its branches will go out' or 'Its tender shoots will spread.' The Hebrew verb is literally 'go,' used here in the sense of extending outward.
    reason: lexical_alternative
  - marker: b
    text: Or 'its beauty' or 'its majesty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 싹들이[a] 퍼져 나가고, 그 아름다움은 올리브나무 같으며[b], 그 향기는 레바논 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 가지들이 나갈 것입니다’ 또는 ‘그 연한 새순들이 퍼져 나갈 것입니다’. 히브리어 동사는 문자적으로는 ‘가다’이며, 여기서는 바깥으로 뻗어 나가는 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 위엄’ 또는 ‘그 영화’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  english_pob_choice: will spread out
  chosen_korean: 퍼져 나가고
  alternatives_korean:
  - 나가고
  - 뻗어 나가고
  - 퍼질 것입니다
  lexicon: HALOT
  rationale: 동사는 문자적으로는 ‘가다’이지만, 식물의 싹이 바깥으로 확장되는 문맥이므로 한국어에서는 자연스럽게 ‘퍼져 나가다’가 원뜻과 비유를 함께 살립니다.
- source_word: יֹנְקוֹתָיו
  english_pob_choice: its shoots
  chosen_korean: 그의 가지들
  alternatives_korean:
  - 그의 싹들
  - 그의 새순들
  - 그의 연한 가지들
  lexicon: HALOT
  rationale: 히브리어는 싹/순을 가리키지만, 한국어에서는 식물 비유를 유려하게 살리면서도 독자가 이해하기 쉬운 ‘가지들’이 가장 자연스럽습니다. 다만 ‘새순들’도 가능한 대안이므로 의미 범위를 완전히 좁히지 않도록 복수형으로 처리했습니다.
- source_word: הוֹדוֹ
  english_pob_choice: its splendor
  chosen_korean: 그의 아름다움
  alternatives_korean:
  - 그의 splendor
  - 그의 영광
  - 그의 위엄
  lexicon: HALOT
  rationale: 이 단어는 위엄, 아름다움, 영화의 뜻을 가질 수 있어, 본문의 수목 비유에서는 외형적 번성과 매력을 드러내는 ‘아름다움’이 가장 자연스럽습니다. ‘영광’은 지나치게 신학적으로 들릴 수 있습니다.
- source_word: כַזַּיִת
  english_pob_choice: like the olive tree
  chosen_korean: 올리브나무 같으며
  alternatives_korean:
  - 올리브나무처럼
  - 감람나무 같으며
  - 올리브처럼
  lexicon: HALOT
  rationale: 비교 대상은 올리브 ‘나무’로 이해하는 것이 한국어에서 가장 자연스럽고, 식물 이미지도 분명합니다. 기존 교회어인 ‘감람나무’는 가능하지만, 현대 표준어로는 ‘올리브나무’가 직관적입니다.
- source_word: לֹו
  english_pob_choice: its fragrance
  chosen_korean: 그의 향기는
  alternatives_korean:
  - 그의 냄새는
  - 그의 향내는
  - 그 향기는
  lexicon: HALOT
  rationale: 히브리어의 소유 접미사는 복원된 이스라엘을 가리키므로 한국어도 소유 표현을 유지합니다. 긍정적 시향을 살리기 위해 ‘냄새’보다 ‘향기’를 택했습니다.
theological_decisions:
- issue: 복원된 이스라엘을 가리키는 3인칭 단수 소유격
  chosen_reading: ‘그의’로 옮겨 집단을 식물 비유 속의 단수 주어로 유지했습니다.
  alternative_readings:
  - ‘그것의’로 중립화하기
  - ‘그녀의’ 또는 다른 성별화 표현 사용하기
  rationale: 히브리어는 문법적으로 남성 단수 소유격이지만, 문맥상 대상은 회복된 이스라엘/에브라임 전체입니다. 한국어에서는 집단을 대상화한 식물 비유를 살리면서도 성별 오해를 피하기 위해 ‘그의’가 가장 무난합니다.
  doctrine_reference: 번역 원칙 §6 (가독성 있는 현대어)
