id: HOS.14.10
reference: Hosea 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
  footnotes:
  - marker: a
    text: Or 'upright' or 'right' for 'straight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'rebels' for 'transgressors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 지혜로워 이 일들을 깨닫겠습니까? 누가 분별력이 있어 그것들을 알겠습니까? 야훼의 길은 곧습니다[a]. 의인들은 그 길을 걷습니다. 그러나 반역자들은 그 길에서 걸려 넘어집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바르다’ 또는 ‘올바르다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘범법자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  english_pob_choice: Who is wise?
  chosen_korean: 누가 지혜롭습니까?
  alternatives_korean:
  - 누가 지혜로운 사람입니까?
  - 지혜로운 자가 누구입니까?
  lexicon: HALOT
  rationale: 수사적 질문의 형식을 살리면서, 표준어 합쇼체로 자연스럽게 옮겼습니다. '지혜로운 사람'은 뜻은 분명하지만 다소 풀어쓰는 느낌이 있어 간결한 형용사형을 택했습니다.
- source_word: וְיָבֵן אֵלֶּה / וְיֵדָעֵם
  english_pob_choice: Let him understand these things / Let him know them
  chosen_korean: 그는 이 일들을 깨달아야 합니다 / 그것들을 알아야 합니다
  alternatives_korean:
  - 그는 이 일들을 이해해야 합니다
  - 그는 그것들을 알게 되어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 권면적 용법을 한국어에서는 '-아야 합니다'로 자연스럽게 풀었습니다. '깨닫다'는 בין의 인식·분별 뉘앙스를, '알다'는 ידע의 기본 의미를 유지합니다.
- source_word: יְשָׁרִים דַּרְכֵי יְהוָה
  english_pob_choice: the ways of Yahweh are straight
  chosen_korean: 여호와의 길들은 곧습니다
  alternatives_korean:
  - 야훼의 길들은 곧습니다
  - 여호와의 길은 바릅니다
  lexicon: HALOT
  rationale: 여기서는 영어 POB의 본문 표기와 달리 한국어 기본 관용을 따라 '여호와'를 사용했습니다. '곧다'는 길/걷기/넘어짐의 이미지와 함께 ישר의 공간적·도덕적 의미를 함께 살립니다.
- source_word: וְצַדִּקִים יֵלְכוּ בָם
  english_pob_choice: the righteous walk in them
  chosen_korean: 의인들은 그 길들로 걸어가지만
  alternatives_korean:
  - 의인들은 그 길들 안에서 걸어가지만
  - 의인들은 그 길들을 따라 걸어가지만
  lexicon: HALOT
  rationale: '''의인''은 צַדִּיקִים의 표준적인 번역이며, ''걸어가다''는 히브리어의 삶의 방식 은유를 한국어에서도 자연스럽게 전달합니다. 전치사는 문맥상 ''로/으로''를 택해 길 이미지에 어울리게 했습니다.'
- source_word: וּפֹשְׁעִים יִכָּשְׁלוּ בָם
  english_pob_choice: but transgressors stumble in them
  chosen_korean: 반역자들은 그 길들에서 걸려 넘어집니다
  alternatives_korean:
  - 범법자들은 그 길들에서 넘어집니다
  - 죄인들은 그 길들에서 걸려듭니다
  lexicon: HALOT
  rationale: פֹשְׁעִים은 단순한 실수보다 언약에 대한 적극적 저항·배반의 뉘앙스가 있어 '반역자들'로 옮겼습니다. כשל의 동작성을 살려 '걸려 넘어집니다'를 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 구절의 source는 יְהוָה를 사용하지만, 한국어 POB 본문에서는 기존 교회적 독해 가능성을 고려해 '여호와'를 채택했습니다. 다만 이는 정통 교회용 대체가 아니라 한국어 가독성을 위한 표기 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: תחביר적 수사질문과 권면형의 처리
  chosen_reading: 누가 지혜롭습니까? 그는 이 일들을 깨달아야 합니다. 누가 분별력이 있습니까? 그는 그것들을 알아야 합니다.
  alternative_readings:
  - 누구든 지혜로운 사람은 이 일들을 깨달으십시오
  - 지혜로운 사람이라면 이 일들을 이해해야 합니다
  rationale: 히브리어의 수사적 질문 뒤 권면을 한국어에서 직접적 명령형보다 중립적인 의무·권고형으로 옮겨, 본문의 지혜문학적 초청을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
