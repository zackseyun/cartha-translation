id: HOS.14.8
reference: Hosea 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשֻׁ֨בוּ֙ יֹשְׁבֵ֣י בְ/צִלּ֔/וֹ יְחַיּ֥וּ דָגָ֖ן וְ/יִפְרְח֣וּ כַ/גָּ֑פֶן זִכְר֖/וֹ כְּ/יֵ֥ין לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
  footnotes:
  - marker: a
    text: Or 'they will grow grain' / 'they will be revived with grain.' The Hebrew phrase is compressed and may evoke grain springing to life or abundant grain production.
    reason: lexical_alternative
  - marker: b
    text: '''His renown'' may also be rendered ''his remembrance'' or, less likely in context, ''its renown.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 그늘에 사는 이들은 돌아올 것입니다[a]. 그들은 곡식처럼 살아나고 포도나무처럼 꽃필 것이며[b], 그의 명성은 레바논의 포도주 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 곡식을 키울 것입니다’ 혹은 ‘그들은 곡식으로 소생할 것입니다.’ 히브리어 표현은 매우 압축되어 있어 곡식이 살아나는 이미지와 풍성한 곡식의 생산을 함께 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 명성’은 ‘그의 기억’으로도 옮길 수 있으며, 문맥상 덜 가능하지만 ‘그것의 명성’으로 볼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  english_pob_choice: will return
  chosen_korean: 돌아올 것입니다
  alternatives_korean:
  - 되돌아올 것입니다
  - 다시 거할 것입니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다/되돌아가다’를 살리면서, 회복의 뉘앙스를 자연스러운 한국어 미래형으로 옮겼습니다.
- source_word: יֹשְׁבֵי בְצִלּוֹ
  english_pob_choice: Those who dwell in his shade
  chosen_korean: 그의 그늘에 사는 이들은
  alternatives_korean:
  - 그의 그늘에 거하는 이들은
  - 그의 그늘 아래 앉아 있는 이들은
  lexicon: HALOT
  rationale: ‘거주하는 자들’이라는 분사적 명사를 자연스럽게 풀어 ‘사는 이들’로 옮겼고, צֵל의 보호 이미지는 ‘그늘’로 유지했습니다.
- source_word: יְחַיּוּ דָגָן
  english_pob_choice: they will revive like grain
  chosen_korean: 곡식처럼 살아나고
  alternatives_korean:
  - 곡식을 살릴 것이고
  - 곡식이 살아나듯 될 것이고
  - 곡식처럼 소생하고
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 ‘살아나다’로 풀어, 곡식의 소생/번성 이미지를 문맥상 자연스럽게 전달했습니다.
- source_word: זִכְרוֹ
  english_pob_choice: his renown
  chosen_korean: 그의 명성
  alternatives_korean:
  - 그의 기억
  - 그의 기념
  - 그의 회상
  lexicon: HALOT
  rationale: 문맥상 레바논의 포도주와 비교되는 것은 ‘기억’보다 퍼져 나가는 평판이므로, ‘명성’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 3인칭 남성 단수 소유격의 지시 대상
  chosen_reading: ‘그의’로 옮겨, 히브리어의 단수 소유격을 그대로 보존했습니다.
  alternative_readings:
  - ‘그들의’로 집합적 복수화
  - 지시 대상을 이스라엘/에브라임으로 명시
  rationale: 본문은 단수 소유격으로 시적으로 인격화된 대상을 유지하므로, 한국어에서도 해석을 미리 고정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 시적 인격화와 문법적 단수의 보존
