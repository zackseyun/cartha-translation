- from: 사마리아는 자신의 죄를 져야 합니다[a]. 이는 그가 자신의 하나님을 배반했기 때문입니다. 그들은 칼에 쓰러질 것이며, 그들의 어린아이들은 짓부서질 것이고[b], 그들의 임신한 여자들은 배가 갈릴 것입니다.
