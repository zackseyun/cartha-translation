source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
  footnotes:
  - marker: a
    text: Or 'Samaria shall be held guilty' or 'Samaria shall suffer for her guilt.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their infants shall be dashed in pieces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사마리아는 죄의 책임을 져야 합니다[a]. 이는 자기 하나님을 거역했기 때문입니다. 그들은 칼에 쓰러질 것이며, 그들의 어린아이들은 짓부서질 것이고[b], 그들의 임신부들은 배가 찢길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사마리아는 유죄로 여겨질 것입니다’ 또는 ‘사마리아는 자기 죄값을 치를 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 갓난아이들은 산산이 부서질 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  english_pob_choice: shall bear her guilt
  chosen_korean: 자신의 죄를 져야 합니다
  alternatives_korean:
  - 유죄로 판결될 것입니다
  - 죄를 져야 합니다
  - 자기 죄값을 치를 것입니다
  lexicon: HALOT
  rationale: אשם의 ‘죄책을 짊어지다/책임을 지다’라는 뜻을 살려, 단순한 유죄 선언보다 죄의 책임과 결과를 함께 드러내도록 옮겼습니다.
- source_word: מָרְתָה
  english_pob_choice: has rebelled
  chosen_korean: 배반했기 때문입니다
  alternatives_korean:
  - 반역했기 때문입니다
  - 거역했기 때문입니다
  - 반항했기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 하나님께 대한 언약적 거역을 가리키므로, ‘반역’의 강한 의미를 살리되 한국어에서 자연스러운 ‘배반하다’로 옮겼습니다.
- source_word: עֹלְלֵיהֶם יְרֻטָּשׁוּ
  english_pob_choice: their little children shall be dashed to pieces
  chosen_korean: 그들의 어린아이들은 짓부서질 것이고
  alternatives_korean:
  - 그들의 어린아이들은 산산이 부서질 것이고
  - 그들의 갓난아이들은 짓부서질 것이고
  - 그들의 어린 자녀들은 짓부서질 것이고
  lexicon: HALOT
  rationale: עֹלְלִים의 아주 어린 자녀라는 뉘앙스를 반영하면서, 전쟁 재앙의 폭력을 희석하지 않도록 ‘짓부서지다’로 직접적으로 옮겼습니다.
- source_word: וְהָרִיּוֹתָיו יְבֻקָּעוּ
  english_pob_choice: their pregnant women ripped open
  chosen_korean: 그들의 임신한 여자들은 배가 갈릴 것입니다
  alternatives_korean:
  - 그들의 임신한 여자들은 배가 찢길 것입니다
  - 그들의 임신부들은 배가 갈릴 것입니다
  - 그들의 해산한 여자들은 배가 갈릴 것입니다
  lexicon: HALOT
  rationale: בקע의 ‘가르다/찢다’ 의미를 노골적이되 완곡하지 않게 살려, 전쟁 폭력의 참혹함을 분명히 드러내도록 했습니다.
theological_decisions:
- issue: 사마리아의 인칭과 집단 폭력의 대상이 바뀌는 구조
  chosen_reading: 첫 문장은 사마리아를 여성화된 도시로서 단수로 두고, 뒤의 재앙 묘사는 그 주민들을 가리키는 복수로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 전 구절을 일관되게 단수로 처리하기
  - 사마리아의 의인화를 약화시키고 중성적으로 옮기기
  rationale: 히브리어는 사마리아를 죄책을 지는 여성적 실체로 말한 뒤, 이어서 그 내부 주민들의 참상을 복수 형태로 묘사합니다. 이 문학적 구조를 한국어에서도 보존하는 편이 원문 충실도에 더 맞습니다.
  doctrine_reference: 번역 원칙 §§3, 4, 6
- issue: 폭력적 심판 묘사의 직설성
  chosen_reading: 심판의 이미지를 완곡하게 돌리지 않고 본문의 강도를 그대로 살렸습니다.
  alternative_readings:
  - 읽기 편하도록 약화하기
  - 직접적 표현을 완화해 우회적으로 번역하기
  rationale: 본문은 의도적으로 매우 잔혹한 심판을 말하므로, 번역에서도 그 충격과 경고를 흐리지 않는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 6
