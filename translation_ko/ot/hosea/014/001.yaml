  naturalness: ‘자신의 죄를 져야 합니다’는 다소 어색하고 의무를 뜻하는 뉘앙스를 낼 수 있습니다. ‘죄의 책임을 져야 합니다’가 문맥상 심판으로 인한 책임 부담을 더 자연스럽게 드러냅니다. ‘임신한 여자들’은 가능하지만 ‘임신부들’이 현대 표준어에서 더 간결하며, ‘배가 찢길 것입니다’가 해당 폭력 행위를 자연스럽고 직접적으로 표현합니다.
  terminology: ‘사마리아’, ‘하나님’, ‘칼에 쓰러지다’, ‘어린아이들’은 적절합니다. 사마리아의 여성 의인화는 한국어에서 대명사로 억지로 표시하지 않고 ‘자기 하나님’으로 자연스럽게 보존할 수 있습니다.
