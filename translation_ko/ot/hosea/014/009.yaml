base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
  footnotes:
  - marker: a
    text: Or, 'Ephraim says, "What have I to do anymore with idols?"' The Hebrew can be read as Ephraim's confession before the LORD's reply.
    reason: alternative_reading
  - marker: b
    text: Or, 'I look on him' or 'I care for him.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'from me your fruit comes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임아, 내가 더 이상 우상들과 무슨 상관이 있겠습니까?[a] 내가 그에게 응답하였고 그를 살필 것입니다[b]. 나는 무성한 노송나무와 같습니다. 네 열매는 내게서 나옵니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘에브라임이 말합니다. “내가 우상들과 더 이상 무슨 상관이 있겠습니까?”’ 히브리어는 에브라임의 고백 뒤에 주님의 응답이 이어지는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘그를 바라볼 것입니다’ 또는 ‘그를 돌볼 것입니다’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면, ‘내게서 네 열매가 발견됩니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  english_pob_choice: what have I to do anymore with idols?
  chosen_korean: 내가 더 이상 우상들과 무슨 상관이 있겠습니까?
  alternatives_korean:
  - 내가 더 이상 우상들과 무슨 관계가 있겠습니까?
  - 내가 더 이상 우상들과 무슨 일이 있겠습니까?
  lexicon: HALOT
  rationale: 무슨 상관이 있겠습니까?는 히브리어 관용구의 단절·결별 의미를 자연스럽게 살리며, עֲצַבִּים은 문맥상 ‘우상들’이 가장 분명합니다.
- source_word: עָנִיתִי וַאֲשׁוּרֶנּוּ
  english_pob_choice: I have answered him and will look after him
  chosen_korean: 내가 그에게 응답하였고, 그를 살펴보며 지킬 것입니다
  alternatives_korean:
  - 내가 그에게 응답하였고, 그를 돌볼 것입니다
  - 내가 그에게 응답하였고, 그를 주목할 것입니다
  lexicon: HALOT
  rationale: עָנָה는 여기서 ‘대답하다/응답하다’로 옮기고, וַאֲשׁוּרֶנּוּ는 단순히 ‘보다’보다 보호적 뉘앙스가 살아 있는 ‘살펴보며 지키다’로 풀어 한국어로도 돌봄의 의미를 유지했습니다.
- source_word: כִּבְרוֹשׁ רַעֲנָן
  english_pob_choice: like a flourishing cypress
  chosen_korean: 무성한 노송나무와 같으며
  alternatives_korean:
  - 무성한 잣나무와 같으며
  - 푸르고 무성한 노송나무와 같으며
  lexicon: HALOT
  rationale: בְּרוֹשׁ은 한국어 성경에서 전통적으로 노송나무/잣나무로 갈리지만, 현대어에서 식물 이미지가 분명한 ‘노송나무’를 택했고, רַעֲנָן의 생기·무성함은 ‘무성한’으로 반영했습니다.
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  english_pob_choice: from me your fruit is found
  chosen_korean: 내게서 네 열매가 발견됩니다
  alternatives_korean:
  - 내게서 네 열매가 나옵니다
  - 네 열매는 내게서 얻어집니다
  lexicon: HALOT
  rationale: נִמְצָא의 ‘발견되다’를 살려 원문의 형식을 유지했고, 열매의 근원이 하나님께 있음을 한국어로도 분명히 드러냈습니다.
- source_word: אֶפְרַיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
  - 에프라임
  lexicon: Korean biblical proper-name usage
  rationale: 한국어 성경 관용과 현대 외래어 표기를 고려해 ‘에브라임’으로 적었습니다.
theological_decisions:
- issue: 첫 구절의 발화 주체와 문장 연결
  chosen_reading: 본문은 에브라임을 부른 뒤 곧바로 하나님의 응답과 자기 비유가 이어지는 형태로 처리하고, 주체 해석의 여지는 각주로 남겼습니다.
  alternative_readings:
  - 첫 절을 에브라임의 고백으로 읽는 해석
  - 첫 절부터 끝까지 야훼의 말씀으로 읽는 해석
  rationale: 히브리어는 첫 절의 발화 주체가 모호하지만, 뒤이은 1인칭 동사들이 하나님의 직접 화법을 강하게 시사합니다. 따라서 본문은 자연스럽게 이어 읽되, 해석상의 긴장은 유지했습니다.
  doctrine_reference: '번역 원칙: 해소되지 않은 본문 긴장은 각주로 보존한다.'
