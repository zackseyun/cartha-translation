base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
  footnotes:
  - marker: a
    text: Or 'the orphan.' The Hebrew term literally denotes one without a father and often refers more broadly to the vulnerable.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may also be understood causally: ''For in you the fatherless finds mercy.'''
    reason: alternative_reading
translation:
  language: ko
  text: 앗수르는 우리를 구원하지 않을 것입니다. 우리는 말을 타지 않을 것이며, 다시는 우리 손으로 만든 것에게 ‘우리 하나님’이라고 말하지 않을 것입니다. 주님 안에서 아버지 없는 이가 긍휼을 입습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고아’. 히브리어는 문자적으로 아버지가 없는 이를 가리키며, 더 넓게는 보호받기 어려운 취약한 이를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘왜냐하면 주님 안에서 아버지 없는 이가 긍휼을 입기 때문입니다’로도 이해할 수 있습니다.
    reason: alternative_reading
