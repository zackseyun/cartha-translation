  rationale: 히브리어의 אשר는 설명적·근거 제시적 기능을 가질 수 있지만, 한국어에서는 문맥의 시적 힘을 유지하는 쪽이 더 적절하여 명시적 접속사를 덧붙이지 않았습니다.
