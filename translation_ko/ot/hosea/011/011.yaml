    rationale: יֶחֶרְדוּ는 두 비교구를 함께 지배하는 하나의 복수 동사입니다. 한국어에서도 두 비교구 뒤에 하나의 종결 서술어를 두는 편이 구조와 의미를 더 충실히 반영합니다.
  - severity: low
    issue: ‘나오다’는 본문에 명시되지 않은 관점을 다소 고정합니다.
    rationale: 동사의 기본 뜻은 ‘떨다’이며 이동은 문맥과 조류 비유에서 함의됩니다. ‘오다’는 문맥상 야훼께로의 접근을 표현할 수 있으나, 이 해석적 보충은 각주로 투명하게 밝혀야 합니다.
