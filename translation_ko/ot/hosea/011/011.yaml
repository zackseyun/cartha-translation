review_pass:
  verdict: revise
  source_fidelity: 히브리어 יֶחֶרְדוּ는 기본적으로 ‘떨다’이며, 이 문맥에서는 이집트와 앗수르로부터 야훼께 돌아오는 움직임을 동반한 떨림으로 이해될 수 있습니다. 초안의 ‘떨며 나오고 … 나올 것입니다’는 이동 방향을 지나치게 ‘나오다’로 고정하고, 두 병행 구절을 각각 별도의 서술로 처리하여 원문의 한 동사 구조를 흐립니다. ‘떨며 올 것입니다’는 문맥상 접근의 뉘앙스를 반영하면서 각주로 어휘적 대안을 보존합니다. וְהוֹשַׁבְתִּים의 사역적 의미는 ‘살게 하겠습니다’로 적절히 살아 있습니다.
  naturalness: ‘이집트에서 새처럼 떨며 나오고, 앗수르 땅에서 비둘기처럼 나올 것입니다’는 첫 절의 연결형과 둘째 절의 종결형이 병렬 구조 안에서 다소 어색하며, ‘떨며’가 첫 비교에만 직접 걸리는 듯 보입니다. 두 출처·비유를 먼저 병렬로 제시하고 하나의 서술어를 두면 현대 표준 한국어로도 자연스럽습니다. ‘그들을 그들의 집에 살게 하겠습니다’는 ‘그들을 그들의 집에서 살게 하겠습니다’가 더 자연스럽습니다.
  terminology: ‘야훼’는 제공된 POB 방침에 부합하며, ‘야훼의 말씀입니다’는 נְאֻם יְהוָה를 현대 합쇼체 예언 공식으로 자연스럽게 반영합니다. ‘앗수르’와 ‘비둘기’도 적절합니다.
