translation:
  language: ko
  text: 그들은 이집트에서 새처럼, 앗수르 땅에서 비둘기처럼 떨며 올 것입니다. 내가 그들을 그들의 집에서 살게 하겠습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 기본적으로 ‘떨다’라는 뜻입니다. 문맥에서는 이집트와 앗수르에서 떨며 오는 모습을 가리킬 수 있으나, ‘떨 것입니다’으로도 옮길 수 있습니다.
    reason: lexical_alternative
