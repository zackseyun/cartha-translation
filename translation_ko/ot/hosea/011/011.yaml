  - 주님의 말씀입니다
  rationale: 예언서의 공식 종결구를 현대 합쇼체로 옮기되, 선언적·예언적 어조는 ‘말씀입니다’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve prophetic formulae with modern formal register'
