base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'They will tremble like a bird from Egypt ... and like a dove from the land of Assyria.' The Hebrew verb can emphasize trembling itself, though in context it likely includes the idea of coming in trembling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이집트에서 새처럼 떨며 나오고, 앗수르 땅에서 비둘기처럼 나올 것입니다. 내가 그들을 그들의 집에 살게 하겠습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘떨다’ 자체를 강조할 수 있으며, 문맥상 ‘떨며 오다/나오다’의 뜻도 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  english_pob_choice: will come trembling
  chosen_korean: 떨며 나오고
  alternatives_korean:
  - 떨고
  - 떨며 오고
  - 두려움에 떨며
  lexicon: HALOT
  rationale: חרד의 핵심은 떨림이지만, 문맥상 이동의 뉘앙스도 함께 있으므로 ‘떨며 나오고’로 두 요소를 함께 살렸습니다.
- source_word: כְצִפּוֹר
  english_pob_choice: like a bird
  chosen_korean: 새처럼
