  - 앗수르의 땅에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 반영하되 한국어에서는 자연스럽게 ‘앗수르 땅에서’로 옮겼습니다.
- source_word: וְהוֹשַׁבְתִּים
  english_pob_choice: and I will settle them
  chosen_korean: 내가 그들을 그들의 집에 살게 하겠습니다
  alternatives_korean:
  - 내가 그들을 정착시키겠습니다
  - 내가 그들을 거주하게 하겠습니다
  - 내가 그들에게 살 곳을 주겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도 현대 한국어에서 자연스럽고 회복의 의미가 드러나는 표현으로 옮겼습니다.
