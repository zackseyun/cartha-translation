  - 작은 새처럼
  - 참새처럼
  lexicon: HALOT
  rationale: צִפּוֹר는 특정 종보다 일반적인 작은 새를 가리키므로, 과도한 구체화를 피한 ‘새처럼’이 가장 안전합니다.
- source_word: מֵאֶרֶץ אַשּׁוּר
  english_pob_choice: from the land of Assyria
  chosen_korean: 앗수르 땅에서
  alternatives_korean:
