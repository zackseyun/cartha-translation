  text: בְּ/חַבְלֵ֨י אָדָ֤ם אֶמְשְׁכֵ/ם֙ בַּ/עֲבֹת֣וֹת אַהֲבָ֔ה וָ/אֶהְיֶ֥ה לָ/הֶ֛ם כִּ/מְרִ֥ימֵי עֹ֖ל עַ֣ל לְחֵי/הֶ֑ם וְ/אַ֥ט אֵלָ֖י/ו אוֹכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
  footnotes:
  - marker: a
    text: Or 'with human cords.' The Hebrew idiom may emphasize humane, gentle leading rather than literal cords belonging to a man.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to him ... fed him'; many translations smooth this to 'to them ... fed them' to match the surrounding plurals.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 사람의 줄로[a], 사랑의 끈으로 그들을 이끌었습니다. 나는 그들에게 그들의 턱에서 멍에를 들어 올리는 사람들처럼 대하였고, 그에게[b] 몸을 굽혀 먹을 것을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적 ‘사람의 줄’보다 사람답고 온화한 인도를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그에게 … 먹을 것을 주었습니다’라는 단수 형태입니다. 많은 번역본은 앞의 복수에 맞추어 ‘그들에게 … 주었습니다’로 자연스럽게 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵ֨י אָדָ֤ם
  english_pob_choice: with cords of a man
  chosen_korean: 사람의 줄로
  alternatives_korean:
  - 인간의 줄로
  - 사람의 끈으로
  lexicon: HALOT
  rationale: אָדָם을 ‘사람’으로 옮겨 성별을 불필요하게 특정하지 않으면서도, POB의 ‘cords of a man’이 가진 인간적·온화한 인도를 살렸습니다.
- source_word: אֶמְשְׁכֵ/ם֙
  english_pob_choice: I drew them
  chosen_korean: 그들을 이끌고
  alternatives_korean:
  - 그들을 끌고
  - 그들을 당겨
  lexicon: HALOT
  rationale: 문맥상 단순 물리적 끌기보다 인도와 끌어당김의 뉘앙스가 함께 있어 ‘이끌다’가 가장 자연스럽고 절제된 대응입니다.
- source_word: בַּ/עֲבֹת֣וֹת אַהֲבָ֔ה
  english_pob_choice: with ropes of love
  chosen_korean: 사랑의 끈으로
  alternatives_korean:
  - 사랑의 밧줄로
  - 사랑의 줄로
  lexicon: HALOT
  rationale: עֲבוֹתוֹת의 굵은 밧줄 이미지를 살리되, 한국어 시어로는 ‘끈’이 지나친 거칠음 없이 애정의 이미지를 더 잘 전달합니다.
- source_word: עַל לְחֵי/הֶם
  english_pob_choice: from their jaws
  chosen_korean: 그들의 턱에서
  alternatives_korean:
  - 그들의 뺨에서
  - 그들의 주둥이에서
  lexicon: HALOT
  rationale: 가축의 멍에가 닿는 부위를 한국어로는 ‘턱’이 가장 직접적으로 보여 주며, 영어 POB의 ‘jaws’도 이 육축 이미지를 유지합니다.
theological_decisions:
- issue: 신의 돌봄을 묘사하는 생생한 육축 비유
  chosen_reading: 멍에를 들어 올리고 몸을 굽혀 먹을 것을 주는 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘위로하고 돌보셨습니다’처럼 추상화할 수 있음
  rationale: 원문은 하나님의 사랑을 단순한 감정이 아니라 인도·해방·공급의 행동으로 보여 주므로, 비유를 완화하지 않고 보존하는 것이 의미를 더 정확히 드러냅니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: 문장 내 대명사 전환(복수에서 단수)
  chosen_reading: 마소라 본문의 단수 ‘그에게’를 본문에 유지했습니다.
  alternative_readings:
  - 복수 ‘그들에게’로 평준화
  rationale: POB도 이 긴장을 보존하듯, 본문의 단수는 이스라엘을 집합적 ‘아들’로 보는 표현일 수 있으므로 매끈하게 고치지 않고 남겼습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
