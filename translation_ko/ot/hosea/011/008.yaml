id: HOS.11.8
reference: Hosea 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
  footnotes:
  - marker: a
    text: Admah and Zeboiim were cities associated with the same overthrow as Sodom and Gomorrah; the comparison evokes total destruction (see Deuteronomy 29:23).
    reason: cross_reference
  - marker: b
    text: Or 'My heart is changed within me.' The Hebrew image is more literally that God's heart is 'turned over,' expressing intense inner upheaval.
    reason: lexical_alternative
  - marker: c
    text: Or 'all my pity is kindled' / 'my compassion grows warm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임아, 내가 어떻게 너를 내주겠느냐? 이스라엘아, 내가 어떻게 너를 넘기겠느냐? 내가 어떻게 너를 아드마처럼 만들겠느냐? 어떻게 너를 스보임처럼 두겠느냐? 내 마음이 내 안에서 뒤집혔고[c][b], 내 모든 긍휼이 함께 끓어오릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘내 마음이 내 안에서 바뀌었다’입니다. 히브리어 이미지는 더 문자적으로는 하나님의 마음이 ‘뒤집힌’ 것으로, 강한 내적 격동을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 모든 긍휼이 뜨거워진다’ / ‘내 긍휼이 달아오른다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How can
  chosen_korean: 어떻게
  alternatives_korean:
  - 어찌
  - 어떻게야
  lexicon: HALOT
  rationale: 반복되는 수사적 질문의 놀람과 망설임을 자연스럽게 살리기 위해 현대 한국어의 ‘어떻게’를 사용했습니다.
- source_word: אֶתֶּנְךָ / אֲמַגֶּנְךָ
  english_pob_choice: give you up / hand you over
  chosen_korean: 내주겠느냐 / 넘기겠느냐
  alternatives_korean:
  - 버리겠느냐 / 넘기겠느냐
  - 넘겨주겠느냐 / 넘기겠느냐
  lexicon: HALOT
  rationale: 심판에 넘기는 법정적·파국적 뉘앙스를 살리면서도 서로 다른 히브리어 동사를 구분하기 위해 ‘내주다’와 ‘넘기다’를 나누어 옮겼습니다.
- source_word: כְאַדְמָה / כִּצְבֹאיִם
  english_pob_choice: like Admah / like Zeboiim
  chosen_korean: 아드마처럼 / 스보임처럼
  alternatives_korean:
  - 아드마 같이 / 스보임 같이
  - 아드마와 같이 / 스보임과 같이
  lexicon: HALOT
  rationale: 소돔·고모라와 함께 전복된 도시들의 고유명칭을 본문에서 그대로 보존해, 심판의 역사적 암시를 흐리지 않도록 했습니다.
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  english_pob_choice: My heart is turned over within me
  chosen_korean: 내 마음이 내 안에서 뒤집혔고
  alternatives_korean:
  - 내 마음이 내 안에서 바뀌었고
  - 내 마음이 내 속에서 뒤집혔고
  lexicon: HALOT
  rationale: ‘뒤집히다’는 히브리어의 역전·전도 이미지를 비교적 직접적으로 살리며, 하나님의 내적 격동을 추상화하지 않습니다.
- source_word: נִחוּמָי
  english_pob_choice: my compassions
  chosen_korean: 내 모든 긍휼
  alternatives_korean:
  - 내 모든 자비
  - 내 모든 연민
  lexicon: HALOT
  rationale: 복수형 감정 표현의 풍성함을 살리기 위해 ‘긍휼’을 사용했고, ‘모든’으로 집합적 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 하나님의 감정 표현을 어떻게 번역할 것인가
  chosen_reading: 하나님의 마음이 뒤집히고 긍휼이 끓어오르는 생생한 표현을 유지했습니다.
  alternative_readings:
  - ‘내가 생각을 바꾸었다’처럼 추상화하기
  - 감정적 표현을 완화하기
  rationale: 본문은 하나님의 심정을 신체적·정서적 이미지로 드러내므로, 그 긴장과 생동감을 풀어버리지 않고 그대로 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §3
- issue: 아드마와 스보임의 이름을 본문에 둘지 여부
  chosen_reading: 고유명사를 본문에 유지했습니다.
  alternative_readings:
  - ‘멸망한 성읍들처럼’으로 풀어쓰기
  rationale: 심판의 비교 대상이 되는 도시 이름 자체가 신학적·수사적 기능을 갖기 때문에, 설명은 주석으로 두고 본문은 보존하는 편이 적합합니다.
  doctrine_reference: Translation philosophy §1
