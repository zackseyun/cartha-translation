revisions:
- from: 그들이 부르면 부를수록 그들은 그들 앞에서 더 멀어졌습니다. 그들은 바알들에게 제사를 드리고 우상들에 향을 피웠습니다.[a][b]
  to: 그들을 부를수록[a], 그들은 그들에게서 멀어져 갔습니다. 그들은 바알들에게 제사를 드리고 우상들에게[b] 향을 피웠습니다.
  rationale: 첫 절을 주어 생략의 ‘그들을 부를수록’으로 고쳐, 히브리어의 불특정 복수 주어를 특정하지 않으면서도 부름의 대상을 살렸습니다. 이어지는 מִפְּנֵיהֶם를 ‘그들에게서 멀어져 갔습니다’로 옮겨 이탈의 의미를 정확히 반영했습니다. 제의의 수혜 대상은 ‘우상들에게’로 다듬었고, 각주 표지를 관련 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:38Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 מִפְּנֵיהֶם는 ‘그들 앞에서’가 아니라 ‘그들에게서/그들의 곁을 떠나’라는 이탈의 뜻입니다. 또한 현 번역의 ‘그들이 부르면’은 ‘부름을 받는 대상’을 빠뜨리고, 두 ‘그들’의 관계를 불필요하게 흐립니다. 주어를 생략한 한국어 상관 구문으로 히브리어의 불특정 복수 주어와 관계적 모호성을 보존할 수 있습니다.
  naturalness: ‘그들을 부를수록, 그들은 그들에게서 멀어져 갔습니다’는 현대 표준 한국어로 자연스럽고, 원문의 비례적 상관 관계를 명확히 드러냅니다. ‘우상들에게 향을 피웠습니다’가 제의 행위의 대상 표시에도 더 자연스럽습니다.
  terminology: ‘바알들’의 복수성과 ‘우상’이라는 פְּסִילִים의 통상적 한국어 대응을 유지했습니다. קטר의 제의적 뜻은 ‘향을 피우다’로 적절히 전달됩니다. 각주에서 ‘새긴 형상들’이라는 어휘적 대안을 보존합니다.
  issues:
  - severity: high
    issue: ‘그들 앞에서 더 멀어졌습니다’
    rationale: מִן + פָּנִים은 이 문맥에서 ‘~에게서 떠나다/멀어지다’를 뜻합니다. ‘그들 앞에서’는 공간적 위치로 오해하게 하며 관계적 이탈이라는 원뜻을 전달하지 못합니다.
  - severity: medium
    issue: ‘그들이 부르면’에 부름의 대상이 없음
    rationale: קָרְאוּ לָהֶם에는 ‘그들에게/그들을 향해’ 부른 대상이 표현되어 있습니다. 한국어에서 주어는 생략해도 되지만, 대상은 ‘그들을’로 드러내야 두 절의 상관 관계가 보존됩니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주 a는 첫 절의 대안 독법에, 각주 b는 ‘우상들’에 바로 붙이는 편이 해당 범위를 명확히 합니다.
  revised_text: 그들을 부를수록[a], 그들은 그들에게서 멀어져 갔습니다. 그들은 바알들에게 제사를 드리고 우상들에게[b] 향을 피웠습니다.
