id: HOS.11.2
reference: Hosea 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
  footnotes:
  - marker: a
    text: Or 'As they called them, so they went away from them.' The Hebrew leaves the subject of 'called' unspecified.
    reason: alternative_reading
  - marker: b
    text: Or 'to carved images.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 부르면 부를수록 그들은 그들 앞에서 더 멀어졌습니다. 그들은 바알들에게 제사를 드리고 우상들에 향을 피웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 그들을 부르자, 그들은 그들에게서 돌아섰습니다.’ 히브리어는 ‘부르다’의 주어를 분명히 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘새긴 형상들에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  english_pob_choice: they called to them
  chosen_korean: 그들이 부르면
  alternatives_korean:
  - 그들이 그들에게 불렀습니다
  - 그들이 그들을 불렀습니다
  lexicon: HALOT
  rationale: 히브리어는 주어가 분명히 제시되지 않은 채 ‘~에게 부르다’의 형태를 쓰므로, 한국어에서도 주어를 특정하지 않고 조건적·상관적 표현으로 옮겨 원문의 압축성을 살렸습니다.
- source_word: כֵּן
  english_pob_choice: the more
  chosen_korean: 부를수록
  alternatives_korean:
  - 그러면
  - 그렇게
  - 더욱
  lexicon: HALOT
  rationale: 앞절과의 상관 구조를 한국어의 ‘-ㄹ수록’으로 자연스럽게 옮기면 ‘the more ... the more ...’의 비례 관계가 가장 분명하게 드러납니다.
- source_word: לַבְּעָלִים
  english_pob_choice: to the Baals
  chosen_korean: 바알들에게
  alternatives_korean:
  - 바알들에게
  - 바알들에게로
  - 바알들에게 제사를
  lexicon: HALOT
  rationale: 복수형 בְּעָלִים은 여러 바알 신격/숭배 대상을 가리키므로, 단수 고유명사보다 복수 표현을 유지하는 것이 원문에 가깝습니다.
- source_word: לַפְּסִלִים
  english_pob_choice: to idols
  chosen_korean: 우상들에
  alternatives_korean:
  - 조각한 형상들에
  - 새긴 우상들에
  lexicon: HALOT
  rationale: פְּסִילִים는 조각된 숭배 형상을 뜻하지만, 문맥상 우상숭배를 직접적으로 드러내는 ‘우상들’이 가장 자연스럽고, 형상적 뉘앙스는 본문 전체의 조롱적 맥락에 충분히 보존됩니다.
- source_word: יְקַטֵּרוּן
  english_pob_choice: burning incense
  chosen_korean: 향을 피웠습니다
  alternatives_korean:
  - 분향했습니다
  - 향을 사르고 있었습니다
  lexicon: HALOT
  rationale: קטר의 제의적 용례는 ‘향을 피우다/사르다’로 자연스럽게 옮길 수 있으며, 우상에게 드리는 행위를 한국어 독자가 즉시 이해하도록 하는 데 유리합니다.
theological_decisions:
- issue: ‘그들이 부르면’의 주어와 대상이 생략된 압축 표현
  chosen_reading: 주어를 특정하지 않고, 관계적 압박과 이탈의 상관 구조만 드러내는 번역을 택했습니다.
  alternative_readings:
  - 하나님이 부르셨을 수 있음
  - 예언자들이 불렀을 수 있음
  - 그들이 불림을 받았다는 의미일 수 있음
  rationale: 히브리어는 발화 주체를 명시하지 않아 해석 가능성을 열어 둡니다. 이를 특정 인물로 좁히면 본문이 의도한 모호성과 긴장이 사라지므로, 원문의 열린 구조를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
