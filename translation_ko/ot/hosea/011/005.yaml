id: HOS.11.5
reference: Hosea 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
  footnotes:
  - marker: a
    text: Or, 'He will not return to the land of Egypt, but Assyria—he will be his king.' The Hebrew construction is compressed and can be represented more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Return'' in the final clause may also carry the sense ''turn back'' or ''repent.'' The Hebrew preserves both physical and spiritual overtones.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이집트 땅으로 돌아가지 않을 것입니다[a]. 그러나 앗수르가 그의 왕이 될 것입니다. 이는 그들이 돌아가기를 거부했기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 이집트 땅으로 돌아가지 않을 것이며, 앗수르—그가 그의 왕이 될 것입니다.’ 히브리어 문장은 압축되어 있어 이렇게 더 형식적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 ‘돌아가다’는 ‘되돌아가다’ 또는 ‘돌이키다’의 뜻을 함께 가질 수 있습니다. 히브리어는 이러한 지리적·영적 뉘앙스를 모두 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  english_pob_choice: He will not return
  chosen_korean: 돌아가지 않을 것입니다
  alternatives_korean:
  - 돌아오지 않을 것입니다
  - 되돌아가지 않을 것입니다
  lexicon: HALOT
  rationale: 부정된 שוב의 미래적 예언 진술을 자연스러운 합쇼체로 옮기되, 뒤의 לָשׁוּב과의 어근 연결을 살리기 위해 ‘돌아가다’ 계열을 유지했습니다.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  english_pob_choice: to the land of Egypt
  chosen_korean: 이집트 땅으로
  alternatives_korean:
  - 이집트로
  - 이집트의 땅으로
  lexicon: HALOT
  rationale: ‘땅’(아레츠)을 드러내어 출애굽과 종속의 기억을 보존하되, 한국어에서는 ‘이집트 땅으로’가 가장 자연스럽고 형식적입니다.
- source_word: וְאַשּׁוּר הוּא מַלְכּוֹ
  english_pob_choice: but Assyria will be his king
  chosen_korean: 오히려 앗수르가 그의 왕이 될 것입니다
  alternatives_korean:
  - 그러나 앗수르가 그의 왕이 될 것입니다
  - 그리고 앗수르가 그의 왕입니다
  lexicon: HALOT
  rationale: 접속사 וְ를 문맥상 역접으로 처리해 ‘오히려’로 옮겼습니다. ‘그의 왕’이라는 소유격 구조를 유지해 앗수르의 외세 지배라는 은유를 보존했습니다.
- source_word: מֵאֲנוּ לָשׁוּב
  english_pob_choice: they have refused to return
  chosen_korean: 그들이 돌아오기를 거부했기 때문입니다
  alternatives_korean:
  - 그들이 돌아오기를 마다했기 때문입니다
  - 그들이 되돌아오기를 거부했기 때문입니다
  lexicon: HALOT
  rationale: ‘거부하다’로 מאן의 강한 거절을 살렸고, 한국어 목적절 구성으로 원문의 이유절을 자연스럽게 재현했습니다. ‘돌아오다’는 본절의 שוב 반복을 보존합니다.
theological_decisions:
- issue: מֵאֲנוּ의 주어가 명시되지 않는 점
  chosen_reading: 주어를 본문에 덧붙이지 않고 ‘그들이’로 처리해, 문맥상 집단을 암시하되 원문이 생략한 주어를 과잉해석하지 않았습니다.
  alternative_readings:
  - ‘내 백성이’로 구체화하기
  - ‘이스라엘이’로 명시하기
  rationale: 히브리어는 3인칭 복수 동사를 사용하지만 이 절 안에 명시 주어가 없습니다. 한국어는 자연스러움을 위해 대명사를 보탰지만, 해설적 명시는 피했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 직접 말하지 않는 주어의 과잉보충 금지
- issue: שוב의 반복 번역
  chosen_reading: 첫 절과 마지막 절 모두 ‘돌아가다/돌아오다’ 계열을 유지해, 지리적 귀환과 언약적 회심의 긴장을 함께 남겼습니다.
  alternative_readings:
  - 첫 절은 ‘되돌아가다’, 마지막 절은 ‘회개하다’로 구분하기
  - 둘 다 ‘되돌아오다’로 통일하기
  rationale: 호세아는 שוב를 물리적 귀환과 영적 전환의 이중 가능성 속에서 자주 사용합니다. 이를 한 가지 뜻으로 좁히지 않기 위해 동일한 어근을 살렸습니다.
  doctrine_reference: 번역 철학 §3, 신학적 긴장 보존
