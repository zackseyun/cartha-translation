  naturalness: ‘야훼를 따라 걸을 것입니다’, ‘사자처럼 포효하실 것입니다’, ‘떨며 올 것입니다’은 현대 표준어 합쇼체에서 자연스럽습니다. 다만 ‘그가 포효하시면’은 원문의 문법과 달리 조건을 만들므로 ‘이는 그 자신이 포효하실 것이며’로 고칩니다.
  terminology: ‘야훼’, ‘사자’, ‘포효’, ‘아들들’은 원문과 프로젝트의 용어 선택을 적절히 반영합니다. ‘아들들’은 히브리어 בָנִים의 남성 복수형을 보존하되, 집단적 의미 가능성은 각주에서 안내합니다.
