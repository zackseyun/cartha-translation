id: HOS.11.10
reference: Hosea 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרֵ֧י יְהוָ֛ה יֵלְכ֖וּ כְּ/אַרְיֵ֣ה יִשְׁאָ֑ג כִּֽי ה֣וּא יִשְׁאַ֔ג וְ/יֶחֶרְד֥וּ בָנִ֖ים מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
  footnotes:
  - marker: a
    text: Literally, 'from the sea.' Here 'the sea' likely means 'the west' as a geographical direction.
    reason: lexical_alternative
  - marker: b
    text: Or 'children' for 'sons'; the Hebrew is literally masculine plural.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼를 따라 걸을 것입니다. 그가 사자처럼 포효하실 것입니다. 그가 포효하시면, 아들들이 바다에서 떨며 올 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바다에서’입니다. 여기서는 ‘바다’가 지리적으로 ‘서쪽’을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 남성 복수형 ‘아들들’입니다. 문맥상 ‘자녀들’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי
  english_pob_choice: after
  chosen_korean: 따라
  alternatives_korean:
  - 뒤에
  - 뒤따라
  - 후에
  lexicon: HALOT
  rationale: אַחֲרֵי는 단순한 시간적 ‘후에’보다 ‘따라/뒤따라’의 추종 관계를 드러내므로, 한국어에서는 ‘야훼를 따라 걸을 것입니다’로 옮겨 원문의 동작 이미지를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 본문에 나오는 고유 신명으로, 프로젝트 기본값에 따라 전통적 대체호칭 대신 학술 음역인 ‘야훼’를 사용했습니다.
- source_word: יִשְׁאָג
  english_pob_choice: will roar
  chosen_korean: 포효하실 것입니다
  alternatives_korean:
  - 으르렁거리실 것입니다
  - 울부짖으실 것입니다
  - 포효할 것입니다
  lexicon: HALOT
  rationale: 사자의 울음소리를 가리키는 שאג의 강한 동물적 이미지를 살리기 위해 ‘포효하다’를 택했습니다.
- source_word: בָנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아이들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형의 ‘아들들’이므로, 성중립화하지 않고 형태를 그대로 반영했습니다.
- source_word: מִיָּם
  english_pob_choice: from the west
  chosen_korean: 바다에서
  alternatives_korean:
  - 서쪽에서
  lexicon: HALOT
  rationale: מִיָּם은 문자적으로 ‘바다에서’이며, 이 본문에서는 지리적 관용상 서쪽을 가리킬 수 있지만 본문 표면형을 우선해 본문에는 ‘바다에서’를 두었습니다.
theological_decisions:
- issue: 야훼의 포효와 귀환의 긴장
  chosen_reading: 이 구절은 야훼의 사자 같은 포효에 대한 응답으로, 백성이 두려움 속에서 움직여 오는 장면을 드러냅니다.
  alternative_readings:
  - 단순히 공포만 묘사하는 것으로 읽을 수도 있습니다.
  rationale: 문맥상 회복과 귀환(호 11:8–11)의 흐름이 강하므로, 한국어에서도 ‘떨며 올 것입니다’로 움직임을 살리되, 본문에 없는 목적어를 덧붙여 과도하게 해석하지는 않았습니다.
  doctrine_reference: 문맥에 근거해 회복의 방향을 드러내되, 본문의 긴장을 보존합니다.
