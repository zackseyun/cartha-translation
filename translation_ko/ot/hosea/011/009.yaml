  source_fidelity: 본문의 주된 번역은 대체로 히브리어를 충실히 따른다. 특히 마지막 절을 ‘성읍에 들어가지 않겠습니다’로 문자적으로 옮긴 것은 논쟁적인 בְּעִיר의 모호성을 본문에서 보존한다. 다만 각주 표지와 각주 내용이 서로 맞지 않아, 어휘·대안 독법의 근거가 잘못된 위치에 연결되어 있다.
  naturalness: ‘내 분노의 격정을 실행하지 않겠습니다’는 직역의 흔적이 강하여 현대 한국어로 다소 부자연스럽다. ‘내 맹렬한 분노를 쏟아 내지 않겠습니다’가 심판의 분노를 실제로 시행하지 않겠다는 뜻을 자연스럽게 전달한다. 신적 칭호에는 ‘당신들 가운데 계신 거룩한 분’이 더 자연스럽고 현대적이다.
  terminology: ‘에브라임’, ‘하나님’, ‘멸하다’, ‘거룩한 분’은 적절하다. ‘성읍’은 עיר의 문자적 의미를 보존하는 데 적합하다. 마지막 절의 해석상 어려움은 본문을 의역하여 해소하지 말고 각주에서 밝혀야 한다.
