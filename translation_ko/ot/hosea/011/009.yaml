id: HOS.11.9
reference: Hosea 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
  footnotes:
  - marker: a
    text: Or, more literally, 'I will not come into the city.' The Hebrew of the final clause is difficult, and some take it as a statement that God will not enter as a destroyer.
    reason: alternative_reading
  - marker: b
    text: Or 'my burning anger.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will not return to destroy Ephraim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 분노의 격정을 실행하지 않겠습니다[a]. 나는 다시는 에브라임을 멸하지 않겠습니다[b]. 나는 하나님이지 사람이 아니며, 당신들 가운데 있는 거룩한 이입니다[c]. 나는 성읍으로 들어가지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘성읍으로 들어가지 않겠습니다.’ 히브리어의 마지막 절은 어렵고, 어떤 이들은 하나님이 멸망시키는 자로 들어가지 않으신다는 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 불타는 분노.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘에브라임을 다시 멸하지 않겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶֽעֱשֶׂה חֲרוֹן אַפִּי
  english_pob_choice: carry out the fierceness of my anger
  chosen_korean: 내 분노의 격정을 실행하다
  alternatives_korean:
  - 내 진노의 불길을 행하다
  - 내 분노를 쏟다
  lexicon: WLC/HALOT
  rationale: עשה는 여기서 분노를 ‘행하다’는 관용으로 쓰였고, חֲרוֹן אַף는 분노의 뜨거운 격정을 가리키므로 ‘실행하다’와 ‘격정’으로 판단적이고 폭력적인 뉘앙스를 살렸습니다.
- source_word: אָשׁוּב לְשַׁחֵת אֶפְרָיִם
  english_pob_choice: again destroy Ephraim
  chosen_korean: 다시 에브라임을 멸하다
  alternatives_korean:
  - 에브라임을 다시 멸하다
  - 에브라임을 파멸시키다
  lexicon: WLC/HALOT
  rationale: שׁוּב + 부정사는 ‘다시’의 반복 뉘앙스를 주며, לְשַׁחֵת는 심판적 파괴를 뜻하므로 ‘멸하다’가 가장 직접적입니다.
- source_word: אֵל ... וְלֹא אִישׁ
  english_pob_choice: I am God and not a man
  chosen_korean: 나는 하나님이지 사람이 아니며
  alternatives_korean:
  - 나는 하나님이고 사람이 아니며
  - 나는 하나님이지 인간이 아니며
  lexicon: WLC/HALOT
  rationale: 절대적 대비를 분명히 하기 위해 ‘이지 … 아니며’ 구조를 썼고, אִישׁ은 일반적인 인류를 가리키는 대조이므로 ‘사람’이 자연스럽습니다.
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  english_pob_choice: the Holy One in your midst
  chosen_korean: 당신들 가운데 있는 거룩한 이
  alternatives_korean:
  - 당신들 가운데 계신 거룩하신 분
  - 당신들 가운데 있는 거룩한 분
  lexicon: WLC/HALOT
  rationale: קָדוֹשׁ를 서술적 칭호로 읽어 ‘거룩한 이’로 옮기면, 전통적 정형어에 기대지 않으면서도 신적 자기지시의 무게를 유지할 수 있습니다.
- source_word: וְלֹא אָבוֹא בְּעִיר
  english_pob_choice: I will not come into the city
  chosen_korean: 나는 성읍으로 들어가지 않겠습니다
  alternatives_korean:
  - 나는 성읍 안으로 들어가지 않겠습니다
  - 나는 성읍에 오지 않겠습니다
  lexicon: WLC/HALOT
  rationale: בְּעִיר를 문자적으로 살려 ‘성읍’으로 옮겼고, 출입 동작을 드러내기 위해 ‘들어가지 않겠습니다’로 처리했습니다.
theological_decisions:
- issue: 하나님의 절제된 심판 선언과 언약적 거룩함의 긴장
  chosen_reading: 본문은 에브라임에 대한 전면적 멸절을 거두시는 하나님의 선언을, ‘나는 하나님이지 사람이 아니며’와 ‘거룩한 이’라는 이유로 설명합니다.
  alternative_readings:
  - 감정의 급변을 강조하는 단순한 인간적 후회 표현
  - 불변성 교리를 먼저 해명하는 철학적 조정
  rationale: 히브리어는 심판을 완전히 철회한다고 말하지 않고 ‘다시 멸하지 않겠다’고 하므로, 거룩하신 하나님의 자비와 심판의 긴장을 그대로 보존했습니다.
  doctrine_reference: 언약적 거룩함과 심판의 유보를 함께 유지
