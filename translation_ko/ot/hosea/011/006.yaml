  source_fidelity: 주문은 칼의 파괴적 움직임, 성읍들, 빗장들, 그리고 그들의 계책이라는 원인절을 대체로 충실히 반영합니다. 다만 בַּדָּיו는 복수형이므로 ‘빗장들’로 옮기는 것이 적절합니다. 마지막 אָכָלָה는 문맥상 목적어가 생략되어 있으나, 영어 POB의 ‘devour them’에 맞추어 한국어에서는 ‘그들을’로 보충할 수 있습니다.
  naturalness: 현 번역의 ‘그의 빗장을 삼키며, 그들의 계책 때문에 삼켜 버릴 것입니다’는 ‘삼키다’의 반복과 마지막 목적어 생략 때문에 다소 부자연스럽고 의미 연결이 흐립니다. ‘없애며 … 그들을 집어삼킬 것입니다’가 현대의 격식 있는 문체에서 더 명료하고 자연스럽습니다.
  terminology: ‘성읍’, ‘빗장’, ‘계책’은 예언서의 격식과 군사적 심판 문맥에 잘 맞습니다. 단, ‘빗장’은 원문의 복수를 반영하여 ‘빗장들’로 해야 합니다.
