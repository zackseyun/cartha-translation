id: HOS.11.6
reference: Hosea 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חָלָ֥ה חֶ֨רֶב֙ בְּ/עָרָ֔י/ו וְ/כִלְּתָ֥ה בַדָּ֖י/ו וְ/אָכָ֑לָה מִֽ/מֹּעֲצ֖וֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
  footnotes:
  - marker: a
    text: Or 'A sword will fall in his cities' or 'A sword will rage in his cities.' The Hebrew verb is difficult and may denote whirling, falling, or writhing/raging movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'his gate-bars'; some understand the Hebrew as 'his rulers,' but the context of cities under attack favors defensive bars.
    reason: alternative_reading
translation:
  language: ko
  text: 칼이 그의 성읍들[a]을 휩쓸고, 그의 빗장[b]을 삼키며, 그들의 계책 때문에 삼켜 버릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 성읍들에서 칼이 떨어질 것입니다’ 혹은 ‘그의 성읍들에서 칼이 사납게 휘몰아칠 것입니다.’ 히브리어 동사는 난해하며, 휩쓸다·떨어지다·날뛰다/사납게 움직이다의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 성문 빗장들’; 어떤 해석은 이를 ‘그의 통치자들’로 보기도 하지만, 성읍이 공격받는 문맥은 방어용 빗장을 더 잘 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה חֶרֶב
  english_pob_choice: A sword will whirl through
  chosen_korean: 칼이 …을 휩쓸고
  alternatives_korean:
  - 칼이 …을 치고
  - 칼이 …을 덮치고
  - 칼이 …을 휘돌아
  lexicon: HALOT
  rationale: חול의 난해한 동작상을 그대로 풀어, 단순한 ‘내리다’보다 파괴적으로 휩쓸고 지나가는 이미지를 살렸습니다.
- source_word: בְּעָרָיו
  english_pob_choice: his cities
  chosen_korean: 그의 성읍들
  alternatives_korean:
  - 그의 도시들
  - 그의 성들
  lexicon: HALOT
  rationale: 도시의 뜻을 현대 한국어로 자연스럽게 옮기되, 예언서 문맥에 맞는 성읍이라는 표현을 유지했습니다.
- source_word: בַדָּיו
  english_pob_choice: his bars
  chosen_korean: 그의 빗장
  alternatives_korean:
  - 그의 문빗장
  - 그의 성문 빗장
  - 그의 지도자들
  lexicon: HALOT
  rationale: 문맥상 성읍 방어시설이 무너지는 장면이므로, 상징적 해석보다 물리적 방어 장치인 빗장을 택했습니다.
- source_word: וְכִלְּתָה / וְאָכָלָה
  english_pob_choice: will consume ... and devour
  chosen_korean: 삼키며, … 삼켜 버릴 것입니다
  alternatives_korean:
  - 삼켜 없애며 … 먹어 치울 것입니다
  - 완전히 없애며 … 집어삼킬 것입니다
  lexicon: HALOT
  rationale: כלה와 אכל의 중첩된 소멸 이미지를 살리기 위해 ‘삼키다/삼켜 버리다’를 반복해 강도를 보존했습니다.
- source_word: מִמֹּעֲצֹתֵיהֶם
  english_pob_choice: because of their counsels
  chosen_korean: 그들의 계책 때문에
  alternatives_korean:
  - 그들의 계획 때문에
  - 그들의 꾀 때문에
  - 그들의 모의 때문에
  lexicon: HALOT
  rationale: מן의 원인적 용법을 반영해 ‘때문에’로 옮기고, עצות의 조언/계획/모의 중 예언적 심판 문맥에 맞는 ‘계책’을 택했습니다.
theological_decisions:
- issue: 히브리어 동사의 난해한 움직임 표현
  chosen_reading: ‘휩쓸고’로 옮겨 칼의 역동적이고 파괴적인 움직임을 드러냈습니다.
  alternative_readings:
  - ‘떨어지고’로 평이하게 처리
  - ‘날뛰고’로 의인화 강조
  rationale: 본문은 단순 낙하보다 심판의 질주와 소용돌이 이미지를 함께 담고 있으므로, 의미를 약화하지 않는 방향을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Maintain the source’s tension and force.'
- issue: ‘그의’와 ‘그들의’의 인칭 혼합
  chosen_reading: ‘그의 성읍들/빗장’과 ‘그들의 계책’을 그대로 살렸습니다.
  alternative_readings:
  - 모두 ‘그들의’로 통일
  - 모두 ‘그의’로 통일
  rationale: 히브리어의 단수-복수 전환을 평탄화하지 않고 보존하여, 집단적 이스라엘에 대한 인칭 전환의 긴장을 드러냈습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
