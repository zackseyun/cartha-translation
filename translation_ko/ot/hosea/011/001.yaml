  source_fidelity: ‘이집트에서 내 아들을 불렀습니다’는 한국어에서 ‘이집트 안에서 불렀다’로도 자연스럽게 읽혀, מִמִּצְרַיִם의 출발점·탈출 맥락이 충분히 드러나지 않습니다. ‘이집트에서 … 불러냈습니다’는 원문의 ‘이집트로부터’를 자연스럽게 반영합니다. 나머지는 이스라엘을 남성 단수의 아들로 의인화한 원문과 시간적 כִּי 해석을 충실히 보존합니다.
  naturalness: ‘어렸을 때’와 ‘불러냈습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘불러냈습니다’는 장소 수식의 모호성을 해소하면서도 출애굽 회고의 문맥에 잘 맞습니다.
