  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
  footnotes:
  - marker: a
    text: Or 'For Israel was a boy, and I loved him.' The Hebrew opening can be read causally ('for/because') or temporally ('when'); the temporal sense fits the verse's retrospective narration. Also, 'out of Egypt I called my son' is later cited in Matthew 2:15.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 어렸을 때에 내가 그를 사랑하였고, 이집트에서 내 아들을 불러냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫머리 כִּי는 ‘~때문에’보다 ‘~했을 때에’처럼 시간적 의미로도 읽을 수 있으며, 이 절에는 회고적 서술이 더 잘 맞습니다. 또한 “이집트에서 내 아들을 불러냈습니다”는 마태복음 2:15에서 인용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: ~했을 때에
  alternatives_korean:
  - ~이므로
  - ~때문에
  lexicon: HALOT
  rationale: כִּי는 여기서 원인보다는 회고적 시간 부사절을 여는 용법이므로, 한국어도 시간 관계를 분명히 드러내는 표현이 가장 적절합니다.
- source_word: נַעַר
  english_pob_choice: child
  chosen_korean: 어린아이
  alternatives_korean:
  - 아이
  - 소년
  - 청년
  lexicon: HALOT
  rationale: 이스라엘의 초기 상태를 가리키는 비유이므로, 연령과 미성숙을 함께 드러내는 ‘어린아이’가 가장 자연스럽습니다.
- source_word: וּמִמִּצְרַיִם
  english_pob_choice: and out of Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 이집트로부터
  - 이집트 밖에서
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살리되, 출애굽 회상을 담은 한국어 관용으로는 ‘이집트에서’가 가장 간결합니다.
- source_word: לִבְנִי
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 나의 아들
  - 내 아들을 향하여
  lexicon: HALOT
  rationale: ל이 ‘호명 대상’을 나타내는 문맥으로 보아 ‘내 아들’을 직접목적어처럼 옮기면 가장 자연스럽고, 이스라엘을 집단적 아들로 부르는 표현도 유지됩니다.
theological_decisions:
- issue: 이스라엘의 집단적 아들됨과 마태복음의 후대 인용
  chosen_reading: 주어진 호세아서 본문은 우선 이스라엘 공동체를 ‘내 아들’로 부르는 역사적 의미를 유지했습니다.
  alternative_readings:
  - 메시아 예언처럼 보이도록 번역하기
  rationale: 본문 자체의 1차 의미를 보존해야 하므로, 후대의 그리스도론적 적용은 본문 번역에 흡수하지 않고 해석의 층위로 남겨 두는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 본문-정경 간 긴장 보존
