id: HOS.11.3
reference: Hosea 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֤י תִרְגַּ֨לְתִּי֙ לְ/אֶפְרַ֔יִם קָחָ֖/ם עַל זְרֽוֹעֹתָ֑י/ו וְ/לֹ֥א יָדְע֖וּ כִּ֥י רְפָאתִֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''taking them in his arms''; the Masoretic Text has a difficult third-person form/suffix in this clause. Many interpreters understand the sense as continuing the LORD''s first-person speech: ''I took them in my arms.'''
    reason: textual_variant
translation:
  language: ko
  text: 그러나 나는 에브라임이 걷도록 가르쳤고, 그들을 내 팔에 안았으나, 그들은 내가 그들을 고쳤다는 것을 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절 중간에서 ‘그들의 팔에/내 팔에’에 해당하는 표현이 난해한 형태를 보입니다. 많은 해석자들은 문맥상 계속되는 야훼의 1인칭 발화로 이해하여 ‘내 팔에 안았다’는 뜻으로 봅니다.
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  english_pob_choice: taught ... to walk
  chosen_korean: 걷도록 가르쳤고
  alternatives_korean:
  - 걸음마를 가르쳤고
  - 걷도록 훈련시켰고
  - 걷게 했고
  lexicon: HALOT
  rationale: רגל의 이 용법은 아이가 걷는 법을 익히게 하는 양육 이미지를 담으므로, 한국어에서는 자연스러우면서도 구체적인 ‘걷도록 가르쳤고’가 가장 잘 맞습니다.
- source_word: קָחָם / עַל זְרֹעֹתָיו
  english_pob_choice: taking them in my arms / in his arms
  chosen_korean: 그들을 내 팔에 안았으나
  alternatives_korean:
  - 그들을 그의 팔에 안았으나
  - 그들을 팔에 품었으나
  - 그들을 품에 안았으나
  lexicon: HALOT
  rationale: 본문의 사본상 형태는 애매하지만, 문맥상 1인칭 신적 발화가 지속됩니다. 따라서 본문 의미를 살리면서도 한국어에서는 ‘내 팔에 안다’로 자연스럽게 옮겼습니다.
- source_word: וְלֹא יָדְעוּ כִּי רְפָאתִים
  english_pob_choice: but they did not know that I healed them
  chosen_korean: 그들은 내가 그들을 고쳤다는 것을 알지 못했습니다
  alternatives_korean:
  - 그러나 그들은 내가 그들을 고쳤다는 것을 알지 못했습니다
  - 그들은 내가 그들을 치유했다는 것을 알지 못했습니다
  - 그들은 내가 그들을 회복시켰다는 것을 알지 못했습니다
  lexicon: HALOT
  rationale: רפא는 기본적으로 ‘고치다/치유하다’의 뜻이므로, 신체적·관계적 회복을 함께 암시할 수 있는 ‘고쳤다’를 택해 본문의 구체성을 보존했습니다.
theological_decisions:
- issue: 하나님의 돌봄을 부모적 이미지로 유지할지 여부
  chosen_reading: 하나님이 에브라임을 걷도록 가르치고 팔에 안으시는 부모적 돌봄 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 일반적인 보호와 인도 이미지로 완화하기
  - 직유성을 약화해 추상적으로 옮기기
  rationale: 히브리어는 친밀한 양육과 보호를 드러내므로, 이를 완화하지 않고 직접적으로 번역하는 것이 본문의 정서와 신학을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 중간 절의 본문상 인칭 긴장
  chosen_reading: 문맥의 1인칭 발화를 기준으로 본문을 매끄럽게 읽되, 한국어 본문은 애매한 형태를 과도하게 노출하지 않았습니다.
  alternative_readings:
  - ‘그가 그들을 그의 팔에 안았다’처럼 형태를 그대로 반영하기
  - ‘내 팔에’로 본문을 평탄화해 읽기
  rationale: MT의 난해한 형태를 무시하지 않되, 본문 전체의 화자 일관성을 우선해 독자가 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
