source:
  edition: WLC
  text: וְ/עַמִּ֥/י תְלוּאִ֖ים לִ/מְשֽׁוּבָתִ֑/י וְ/אֶל עַל֙ יִקְרָאֻ֔/הוּ יַ֖חַד לֹ֥א יְרוֹמֵם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
  footnotes:
  - marker: a
    text: Or, 'Together they do not exalt him,' or 'No one at all exalts him.' The Hebrew of the final clause is difficult.
    reason: alternative_reading
  - marker: b
    text: '''Turning away'' renders a Hebrew term often translated ''backsliding'' or ''apostasy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성은 나에게서 돌아서기를 고집합니다. 그들이 지극히 높으신 분께 부르짖어도, 그는 전혀 그들을 일으켜 세우지 않으십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 함께 그를 높이지 않습니다’, 혹은 ‘아무도 그를 높이지 않습니다.’ 마지막 절의 히브리어는 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  english_pob_choice: My people
  chosen_korean: 내 백성
  alternatives_korean:
  - 나의 백성
  - 내 민족
  lexicon: HALOT
  rationale: 1인칭 접미사의 언약적 소속을 살리면서, 호세아의 예언적 호칭에 자연스러운 ‘백성’을 택했습니다.
- source_word: תְלוּאִים לִמְשׁוּבָתִי
  english_pob_choice: are bent on turning away from me
  chosen_korean: 나에게서 돌아서기를 고집합니다
  alternatives_korean:
  - 나에게서 떠나 있기를 합니다
  - 나의 배교에 매달려 있습니다
  - 나에게서 등 돌리기를 합니다
  lexicon: HALOT
  rationale: תלא와 מְשׁוּבָה의 난해한 결합을 직역하기보다, 문맥상 완고하게 ‘돌아서는’ 태도를 한국어의 자연스러운 관용으로 옮겼습니다.
- source_word: עַל
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 이
  - 높으신 하나님
  lexicon: HALOT
  rationale: אֶל־עַל의 관용구를 인격적 호칭으로 살리되, 신학적 용어를 과도하게 정형화하지 않고 ‘가장 높으신 분’으로 옮겼습니다.
- source_word: יְרוֹמֵם
  english_pob_choice: he does not lift them up
  chosen_korean: 그는 그들을 함께 일으켜 세우지 않으십니다
  alternatives_korean:
  - 그는 그들을 들어 올리지 않으십니다
  - 그는 그들을 높이지 않으십니다
  - 그는 그들을 구원하지 않으십니다
  lexicon: HALOT
  rationale: רוּם 계열의 ‘들어 올리다/높이다’ 의미를 살리면서, 문맥상 도움·회복의 거절을 한국어로 자연스럽게 드러내기 위해 ‘일으켜 세우다’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 주체가 하나님인지, 사람들인지가 문법적으로 압축되어 있습니다.
  chosen_reading: 본문 흐름에 따라 ‘그가 그들을 일으켜 세우지 않으심’으로 읽었습니다.
  alternative_readings:
  - 함께 그들이 그를 높이지 않습니다
  - 아무도 그를 높이지 않습니다
  rationale: 앞절의 ‘가장 높으신 분께 부르짖더라도’와의 대비가 강하므로, 하나님의 응답 부재를 드러내는 읽기가 문맥상 가장 자연스럽습니다. 다만 히브리어가 허용하는 대안 해석은 주석으로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
