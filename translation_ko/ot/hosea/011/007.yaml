    rationale: 각주 표지와 설명 대상이 불일치합니다. 표지를 마지막 절로 옮겨야 독자가 대안 해석의 적용 범위를 알 수 있습니다.
  - severity: medium
    issue: ‘그들을 함께 일으켜 세우지 않으십니다’의 ‘함께’가 목적어에 걸려 ‘그들을 한데 일으키지 않는다’는 뜻으로 읽힙니다.
