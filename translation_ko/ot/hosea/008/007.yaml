  - 이방인들이 그것을 먹어 버릴 것입니다
  lexicon: HALOT
  rationale: זָרִים는 ‘타인/외인’의 뜻이므로, 단순한 국적 표지보다 외부인을 드러내는 ‘낯선 사람들’이 문맥에 잘 맞습니다.
