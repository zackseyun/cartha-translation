  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
  footnotes:
  - marker: a
    text: Or 'storm' or 'tempest' for 'whirlwind.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'The standing grain has no צמח'; the noun can mean 'sprout' or 'growth,' but here likely refers to the grain head/ear needed to make flour.
    reason: lexical_alternative
  - marker: c
    text: Or 'Perhaps it may yield, but strangers will swallow it up.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그들이 바람을 뿌리고 회오리바람을[a] 거둘 것이기 때문입니다. 밭에 선 곡식에는 이삭이[b] 없어 가루를 내지 못합니다. 혹 가루를 낸다 해도[c], 타국 사람들이 그것을 삼켜 버릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회오리바람’은 ‘폭풍’ 또는 ‘광풍’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צֶמַח는 일반적으로 ‘싹’이나 ‘자람’을 뜻할 수 있습니다. 여기서는 가루를 얻는 데 필요한 곡식의 이삭을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아마 가루를 낼지도 모르지만, 타국 사람들이 그것을 삼켜 버릴 것입니다.’
    reason: alternative_reading
