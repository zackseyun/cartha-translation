id: HOS.8.7
reference: Hosea 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
  footnotes:
  - marker: a
    text: Or 'storm' or 'tempest' for 'whirlwind.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'The standing grain has no צמח'; the noun can mean 'sprout' or 'growth,' but here likely refers to the grain head/ear needed to make flour.
    reason: lexical_alternative
  - marker: c
    text: Or 'Perhaps it may yield, but strangers will swallow it up.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그들이 바람을 뿌리고, 회오리바람을 거둘 것이기 때문입니다. 서 있는 곡식에는 이삭이 없어, 가루를 내지 못합니다. 설령 그것이 산출되더라도, 낯선 사람들이 그것을 삼켜 버릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회오리바람’은 ‘폭풍’ 또는 ‘소용돌이치는 바람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘서 있는 곡식에는 צמח가 없다’는 뜻으로, 여기서는 가루를 만들 이삭/머리의 부재를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘혹 그것이 산출되더라도, 낯선 사람들이 그것을 삼켜 버릴 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  lexicon: HALOT
  rationale: 농사 비유의 구체적 감각을 살려, 추상적인 ‘영’보다 ‘바람’이 씨 뿌림/거둠의 대조를 더 직접적으로 드러냅니다.
- source_word: וְסוּפָתָה
  english_pob_choice: and the whirlwind
  chosen_korean: 회오리바람
  alternatives_korean:
  - 폭풍
  - 소용돌이바람
  lexicon: HALOT
  rationale: סוּפָה는 파괴적인 폭풍/회오리바람을 가리키므로, 예언적 강화 효과를 살린 ‘회오리바람’이 적절합니다.
- source_word: קָמָה ... צֶמַח ... קֶמַח
  english_pob_choice: The standing grain has no head; it will yield no flour.
  chosen_korean: 서 있는 곡식에는 이삭이 없어, 가루를 내지 못합니다
  alternatives_korean:
  - 밭에 선 곡식은 머리가 없어 밀가루를 내지 못합니다
  - 서 있는 곡식은 싹이 없어 가루를 만들지 못합니다
  lexicon: HALOT
  rationale: ‘קָמָה’는 밭에 선 곡식을, ‘צֶמַח’는 여기서는 가루 생산에 필요한 이삭/머리의 결여를 가리키므로 ‘이삭’으로 옮겨 농업적 의미를 분명히 했습니다.
- source_word: זָרִים יִבְלָעֻהוּ
  english_pob_choice: strangers will swallow it up
  chosen_korean: 낯선 사람들이 그것을 삼켜 버릴 것입니다
  alternatives_korean:
  - 외국인들이 그것을 삼킬 것입니다
  - 이방인들이 그것을 먹어 버릴 것입니다
  lexicon: HALOT
  rationale: זָרִים는 ‘타인/외인’의 뜻이므로, 단순한 국적 표지보다 외부인을 드러내는 ‘낯선 사람들’이 문맥에 잘 맞습니다.
theological_decisions:
- issue: 농사 은유의 처리
  chosen_reading: 바람을 뿌리고 회오리바람을 거두는 징계의 비유를 그대로 살렸습니다.
  alternative_readings:
  - 비유를 풀어 ‘헛된 일을 하면 재앙을 받는다’로 의역
  rationale: 본문은 추상화보다 감각적인 씨뿌림/거둠 이미지를 통해 심판의 인과를 말하므로, 해설을 덧붙이지 않고 직유를 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
