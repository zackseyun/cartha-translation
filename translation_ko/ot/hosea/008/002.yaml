id: HOS.8.2
reference: Hosea 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ֖/י יִזְעָ֑קוּ אֱלֹהַ֥/י יְֽדַעֲנ֖וּ/ךָ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
  footnotes:
  - marker: a
    text: Or 'they cry out.' The Hebrew verb can emphasize an urgent cry for help.
    reason: lexical_alternative
  - marker: b
    text: '''We know you'' can carry covenantal overtones of acknowledged relationship, not merely intellectual awareness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 내게 부르짖습니다. “내 하나님이시여, 우리 이스라엘은 주님을 압니다!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르짖습니다’는 히브리어 동사가 절박하게 도움을 호소하는 외침을 나타낼 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘압니다’는 단순한 지식보다 언약적 관계의 함의를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  english_pob_choice: To me
  chosen_korean: 내게
  alternatives_korean:
  - 저에게
  - 나에게
  lexicon: HALOT
  rationale: ל + 1인칭 단수 접미사는 여기서 하나님께 향하는 직접적 방향을 나타내므로, 한국어에서는 구어적이면서도 자연스러운 ‘내게’로 옮겨 부르짖음의 대상을 분명히 했습니다.
- source_word: יִזְעָקוּ
  english_pob_choice: they cry
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 외칩니다
  - 소리칩니다
  lexicon: HALOT
  rationale: זעק은 단순 발화보다 절박한 호소의 뉘앙스가 강하므로, ‘부르짖다’가 상황의 긴급성과 간구성을 가장 잘 드러냅니다.
- source_word: יְדַעֲנ֖וּךָ
  english_pob_choice: we know you
  chosen_korean: 주님을 압니다
  alternatives_korean:
  - 주님을 압니다
  - 주님을 알고 있습니다
  - 주님을 인정합니다
  lexicon: HALOT
  rationale: ידע는 여기서 언약적 함의를 가질 수 있지만 기본 의미는 ‘알다’이므로, 본문이 주장하는 관계성을 과도하게 해석하지 않도록 간단히 ‘압니다’로 유지했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: we—Israel—
  chosen_korean: 우리—이스라엘이—
  alternatives_korean:
  - 이스라엘이
  - 우리 이스라엘이
  - 우리, 이스라엘이
  lexicon: HALOT
  rationale: 이스라엘은 화자들의 자의식적 동격 삽입으로 기능하므로, 중간 삽입부를 살리는 대시 표기가 원문의 급작스러운 자기지시를 가장 잘 보존합니다.
theological_decisions:
- issue: ‘안다’의 언약적 무게를 어떻게 보존할지
  chosen_reading: 본문의 고백을 ‘주님을 압니다’로 직역에 가깝게 두되, 본문 밖에서 그 고백의 공허함을 해석하도록 남겨 두었습니다.
  alternative_readings:
  - 주님을 인정합니다
  - 주님과 언약 관계에 있습니다
  rationale: 호세아서 문맥상 ‘알다’는 언약적 차원을 가질 수 있으나, 본절 자체는 이스라엘의 주장만 제시하므로 해석을 본문 안에 과잉 주입하지 않는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 이스라엘의 발화 구조를 어떻게 재현할지
  chosen_reading: 따옴표로 직접 화법을 살리고, ‘우리—이스라엘이—’를 삽입해 급작스러운 자기표명을 유지했습니다.
  alternative_readings:
  - '그들이 내게 부르짖습니다: ‘내 하나님이시여, 이스라엘은 주님을 압니다.’'
  - 그들이 내게 부르짖습니다. ‘내 하나님이시여, 우리는 주님을 압니다.’
  rationale: 히브리어의 어순은 단순 진술보다 대화적이고 단절된 효과를 내므로, 이를 매끈하게 평준화하지 않고 한국어에서도 그 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
