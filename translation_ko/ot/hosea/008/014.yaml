id: HOS.8.14
reference: Hosea 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
  footnotes:
  - marker: a
    text: Or 'temples.' The Hebrew word can refer to palaces or temple-like structures.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 이스라엘을 지으신 분을 잊고 궁전들을[a] 세웠으며, 유다는 견고한 성읍들을 많이 세웠습니다. 그러므로 내가 그 성읍들에 불을 보내리니, 그것이 그 성채들을 삼켜 버릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֵיכָלוֹת는 ‘궁전들’ 또는 ‘성전들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂהוּ
  english_pob_choice: his Maker
  chosen_korean: 자기 지으신 분
  alternatives_korean:
  - 자기 만드신 분
  - 창조주
  lexicon: HALOT
  rationale: 동사 עשה의 분사형과 3인칭 남성 단수 접미사는 이스라엘을 지으신 분을 가리키므로, ‘자기 지으신 분’이 직접적이면서도 ‘Maker’의 관계적 뉘앙스를 잘 살립니다.
- source_word: הֵיכָלוֹת
  english_pob_choice: palaces
  chosen_korean: 궁전들
  alternatives_korean:
  - 성전들
  - 궁전 같은 건물들
  lexicon: HALOT
  rationale: 히브리어 היכל은 궁전과 성전 모두를 뜻할 수 있지만, 문맥상 인간의 안전장치와 권력 기반을 강조하므로 ‘궁전들’이 본문 흐름에 가장 맞습니다.
- source_word: עָרִים בְּצֻרוֹת
  english_pob_choice: fortified cities
  chosen_korean: 견고한 성읍들
  alternatives_korean:
  - 요새 성읍들
  - 방벽을 두른 성읍들
  lexicon: HALOT
  rationale: ‘성읍들’은 도시를 뜻하는 עָרִים을 자연스럽게 옮기며, בְּצֻרוֹת는 군사적 방어를 지닌 상태를 나타내므로 ‘견고한’이 간결하고 정확합니다.
- source_word: אַרְמְנֹתֶיהָ
  english_pob_choice: her citadels
  chosen_korean: 그들의 견고한 성채들
  alternatives_korean:
  - 그녀의 성채들
  - 그들의 궁전들
  lexicon: HALOT
  rationale: אָרְמון은 궁전/성채의 뜻 범위가 있으며, 여기서는 문맥상 방어 거점이므로 ‘성채들’이 적절합니다. 영어 POB의 대명사 이동을 한국어에서는 자연스럽게 ‘그들의’로 받아 문맥의 집합적 참조를 드러냈습니다.
theological_decisions:
- issue: הֵיכָלוֹת의 의미 범위 보존
  chosen_reading: 본문에는 ‘궁전들’을 두고, 주석으로 다른 가능성(성전들)을 열어 두지 않았습니다.
  alternative_readings:
  - 성전들
  - 궁전들과 성전들
  rationale: 이 절은 종교적 경건보다 정치·군사적 안전에 의존하는 죄를 고발하므로, ‘궁전들’이 주된 의미를 가장 잘 드러냅니다. 다만 한국어 본문에서 과도하게 해석을 좁히지 않도록 의미 범위는 유지를 전제로 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: 이스라엘/유다의 주체 분리
  chosen_reading: 이스라엘과 유다를 구분해 번역하고, 뒤의 심판 선언은 유다를 향한 것으로 유지했습니다.
  alternative_readings:
  - 두 절반을 하나의 집단으로 평준화하는 번역
  - 대명사 구분을 생략하는 번역
  rationale: 히브리어는 먼저 이스라엘을 책망한 뒤 유다를 따로 언급하므로, 두 주체를 흐리지 않는 것이 본문의 수사와 신학적 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
