base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
  footnotes:
  - marker: a
    text: Or, 'it is no god.' The Hebrew directly says, 'and it is not God,' denying true deity to the idol.
    reason: lexical_alternative
  - marker: b
    text: Or, 'will be broken into pieces' or 'will become fragments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 이스라엘에서 나온 것이기 때문입니다. 한 장인이 그것을 만들었고, 그것은 하나님이 아닙니다.[a] 참으로 사마리아의 송아지는 산산조각이 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것은 신이 아니다.’ 히브리어는 문자적으로 ‘그리고 그것은 하나님이 아니다’라고 말하며, 우상의 참된 신성을 부정합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산산이 부서질 것이다’ 혹은 ‘파편이 될 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיִּשְׂרָאֵל
  english_pob_choice: from Israel
  chosen_korean: 이스라엘에서 나온 것
  alternatives_korean:
  - 이스라엘에서
  - 이스라엘로부터 나온 것
  - 이스라엘의 것
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살려 우상의 기원이 이스라엘 자체임을 드러내기 위해 ‘에서 나온 것’으로 옮겼습니다.
- source_word: חָרָשׁ עָשָׂהוּ
  english_pob_choice: a craftsman made it
  chosen_korean: 한 장인이 그것을 만들었으나
  alternatives_korean:
  - 한 기술자가 그것을 만들었으나
  - 한 공예가가 그것을 만들었으나
  - 장인이 그것을 만들었습니다
  lexicon: HALOT
  rationale: חָרָשׁ은 금속 세공인으로 좁히기보다 ‘장인’으로 넓게 잡아, 인간이 만든 물건이라는 대비를 자연스럽게 살렸습니다.
- source_word: וְלֹא אֱלֹהִים הוּא
  english_pob_choice: and it is not God
  chosen_korean: 그것은 하나님이 아닙니다
  alternatives_korean:
  - 그것은 신이 아닙니다
  - 그것은 하나님이 아닙니다만
  - 그것은 신이 아닙니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 부정을 따라 우상이 참된 신성이 없음을 분명히 하되, 문맥상 한국어에서 가장 강한 신격 부정인 ‘하나님이 아닙니다’를 사용했습니다.
- source_word: שְׁבָבִים
  english_pob_choice: splinters
  chosen_korean: 산산조각
  alternatives_korean:
  - 조각들
  - 파편들
  - 부스러기
  lexicon: HALOT
  rationale: 무너져 부서지는 결과를 강하게 보여 주기 위해 ‘산산조각’으로 옮겼습니다. 이는 단순한 조각보다 파괴의 감각을 더 잘 드러냅니다.
theological_decisions:
- issue: 우상의 신성 부정 표현
  chosen_reading: ‘그것은 하나님이 아닙니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘그것은 신이 아닙니다’
  - ‘그것은 진짜 하나님이 아닙니다’
  rationale: 히브리어는 우상이 실제 신성이 없다고 단정합니다. 이를 완화하지 않고 직접적으로 옮겨, 본문의 논박적 힘을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
