  source_fidelity: 첫 절의 히브리어는 동사 זָנַח의 주어를 명시하지 않으며, 문맥상 하나님을 주어로 읽는 본문 번역은 가능하지만 송아지를 주어로 읽을 가능성도 있습니다. 초안은 이 대안을 각주에서 보존하지 않았고, ‘사마리아의 너의 송아지’는 히브리어의 호격 ‘사마리아여’와 2인칭 소유를 정확히 반영하지 못합니다. נִקָּיוֹן은 도덕적 무죄와 제의적 깨끗함을 아우를 수 있으므로 ‘깨끗해질 수 없다’로 옮기고 각주에서 범위를 밝혔습니다.
  naturalness: ‘사마리아여, 네 송아지’가 표준어에서 자연스럽고 호격 관계를 분명히 합니다. ‘그들을 향하여’는 ‘그들을 향해’가 더 자연스럽습니다. ‘순결하지 못하다’는 현대 한국어에서 성적 순결을 우선 연상시킬 수 있어 이 문맥의 도덕적·제의적 폭을 충분히 전달하지 못합니다.
  terminology: ‘송아지’는 원문의 기본 명사를 유지합니다. 하나님의 분노에는 예언서 문맥에 적합한 ‘내 분노가 … 타오릅니다’를 유지했습니다. ‘깨끗함’ 관련 각주는 ‘무죄/정결’의 의미 가능성을 밝혀 원문의 의미 범위를 보존합니다.
