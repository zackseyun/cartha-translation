  rationale: 이 단어는 도덕적·제의적 ‘깨끗함/순결/무죄’의 뜻을 모두 가질 수 있으나, 한국어에서는 ‘순결하지 못하다’가 죄책과 부정함을 함께 아우르며 본문의 수사적 질문을 잘 전달합니다.
