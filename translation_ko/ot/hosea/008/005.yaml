id: HOS.8.5
reference: Hosea 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
  footnotes:
  - marker: a
    text: Or, 'Your calf has rejected you, O Samaria.' The Hebrew syntax allows the calf to be read as the subject of the opening verb, though the main text takes God as the implied subject.
    reason: alternative_reading
  - marker: b
    text: '''Innocence'' may also be rendered ''purity'' or ''cleanness.'' The Hebrew term can carry both moral and cultic overtones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사마리아의 너의 송아지를 버리셨습니다. 내 분노가 그들을 향하여 타오릅니다. 그들이 언제까지 순결하지 못하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘송아지’는 우상적 형상을 가리킵니다. 영어 POB처럼 본문에서는 기본 명사를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘순결’은 여기서 도덕적·제의적 ‘깨끗함/무죄’의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  english_pob_choice: has rejected
  chosen_korean: 버리셨습니다
  alternatives_korean:
  - 거절하셨습니다
  - 내치셨습니다
  - 버리셨습니다
  lexicon: HALOT
  rationale: 동사는 ‘거절하다/버리다/내치다’의 뜻을 가지며, 문맥상 하나님이 우상과 그에 속한 자들을 거부하신다는 뜻을 분명히 해야 하므로 자연스러운 합쇼체로 옮겼습니다.
- source_word: עֶגְלֵךְ
  english_pob_choice: your calf
  chosen_korean: 너의 송아지
  alternatives_korean:
  - 너의 송아지 상
  - 너의 송아지 우상
  - 너의 송아지
  lexicon: HALOT
  rationale: 기본 명사 ‘송아지’를 본문에 유지하여, 영어 POB처럼 해석을 과도하게 덧붙이지 않고 우상적 대상임은 문맥이 드러내게 했습니다.
- source_word: חָרָה אַפִּי
  english_pob_choice: my anger burns
  chosen_korean: 내 분노가 ... 타오릅니다
  alternatives_korean:
  - 내 진노가 ... 타오릅니다
  - 내 노여움이 ... 일어납니다
  - 내 분노가 ... 이글거립니다
  lexicon: HALOT
  rationale: ‘코/분노가 타다’라는 히브리어 관용구를 한국어에서도 자연스럽게 살리기 위해 ‘분노가 타오릅니다’로 옮겼습니다.
- source_word: בָּם
  english_pob_choice: against them
  chosen_korean: 그들을 향하여
  alternatives_korean:
  - 그들에게
  - 그들 위에
  - 그들을 향해
  lexicon: HALOT
  rationale: 분노가 향하는 방향성을 드러내기 위해 ‘향하여’를 사용했습니다. 복수 대명사는 사마리아의 우상숭배에 연루된 백성을 가리키는 것으로 보아 복수로 유지했습니다.
- source_word: נִקָּיֹן
  english_pob_choice: innocence
  chosen_korean: 순결
  alternatives_korean:
  - 무죄
  - 깨끗함
  - 정결
  lexicon: HALOT
  rationale: 이 단어는 도덕적·제의적 ‘깨끗함/순결/무죄’의 뜻을 모두 가질 수 있으나, 한국어에서는 ‘순결하지 못하다’가 죄책과 부정함을 함께 아우르며 본문의 수사적 질문을 잘 전달합니다.
theological_decisions:
- issue: חָרָה אַפִּי와 함께 나타나는 하나님의 분노 표현
  chosen_reading: 하나님의 실제 분노를 ‘내 분노’로 직접 표기했습니다.
  alternative_readings:
  - ‘내 진노’로 완화하여 표기
  - ‘분노하십니다’로 동사화
  rationale: 예언서의 언약적 심판 진술을 약화하지 않기 위해 감정적 완곡어법보다 본문의 직접성을 살렸습니다.
  doctrine_reference: 언약 심판과 하나님의 거룩한 분노에 대한 예언서 문맥
