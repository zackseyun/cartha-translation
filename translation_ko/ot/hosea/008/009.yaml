    issue: כִּי의 인과 연결이 번역에서 누락되었습니다.
    rationale: 본문은 앞선 고발에 대한 이유를 제시합니다. 독립 평서문으로만 처리하면 원문의 논리적 연결이 사라집니다.
  - severity: medium
    issue: ‘혼자 헤매는’은 בּוֹדֵד לּוֹ에 없는 ‘방황’의 의미를 더합니다.
    rationale: 이 어구의 직접적 의미는 ‘홀로 있는/고독한, 제 홀로 있는’입니다. 들나귀의 일반적 이미지에서 ‘헤매다’를 보충하는 것은 안전하지 않습니다.
  - severity: medium
    issue: ‘사랑하는 이들’은 אֲהָבִים의 연인·정부 은유를 약화합니다.
    rationale: 호세아서의 의도적인 혼인/성적 불신실 비유를 유지하려면 ‘연인들’이 더 직접적이며, 정치적 동맹으로 해설하지 않아야 합니다.
