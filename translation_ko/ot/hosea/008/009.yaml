  rationale: 인과 접속사 ‘왜냐하면/…때문입니다’를 회복하고, ‘홀로 있는’이라는 원문의 고립 이미지를 과잉 해석 없이 유지했습니다. 또한 ‘연인들’을 사용해 원문의 혼인 불성실 은유와 ‘고용하다’의 거래적 어감을 보존했습니다. 히브리어의 압축된 비유 구문은 한국어에서 ‘…처럼 말입니다’로 자연스럽게 연결했습니다.
