base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
  footnotes:
  - marker: a
    text: Or 'like a wild donkey by itself' or 'a solitary wild donkey.'
    reason: lexical_alternative
  - marker: b
    text: '''Lovers'' preserves Hosea''s metaphor of covenant unfaithfulness; the political referent is foreign allies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 앗수르로 올라갔기 때문입니다. 홀로 있는 들나귀처럼 말입니다[a]. 에브라임은 연인들을 고용하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 홀로 있는 들나귀처럼’이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘연인들’은 언약에 대한 불성실을 나타내는 호세아서의 혼인 비유를 보존한 표현입니다. 문맥상 외국 세력과의 관계를 가리키지만, 본문은 이를 직접적으로 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ אַשּׁוּר
  english_pob_choice: have gone up to Assyria
  chosen_korean: 앗수르로 올라갔습니다
  alternatives_korean:
  - 앗수르에 갔습니다
  - 앗수르로 갔습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘올라가다’ 관용을 살려, 단순 이동이 아니라 이방 권력으로 의지하러 올라가는 뉘앙스를 보존했습니다.
- source_word: פֶּרֶא בּוֹדֵד ל֑/וֹ
  english_pob_choice: like a wild donkey wandering alone
  chosen_korean: 마치 혼자 헤매는 들나귀 같았습니다
  alternatives_korean:
  - 마치 외로운 들나귀 같았습니다
  - 마치 홀로 있는 들나귀 같았습니다
  lexicon: HALOT
  rationale: ‘들나귀’로 동물 이미지를 유지하고, 분리된 상태를 나타내는 표현은 한국어에서 자연스러운 ‘혼자 헤매는’으로 옮겨 고립감과 방황을 함께 드러냈습니다.
- source_word: הִתְנוּ אֲהָבִים
  english_pob_choice: has hired lovers
  chosen_korean: 사랑하는 이들을 고용했습니다
  alternatives_korean:
  - 사랑하는 이들을 샀습니다
  - 연인들을 고용했습니다
  lexicon: HALOT
  rationale: 호세아의 은유를 살리되 한국어에서 ‘lovers’의 직역이 지나치게 노골적일 수 있어, 관계의 매매성을 드러내는 ‘고용했습니다’와 관계 대상 표현을 함께 사용했습니다.
theological_decisions:
- issue: 호세아의 혼인/간음 은유 유지
  chosen_reading: 정치적 동맹을 직접 설명하기보다, ‘사랑하는 이들을 고용했습니다’라는 은유를 보존했습니다.
  alternative_readings:
  - 에브라임은 동맹을 맺었습니다
  - 에브라임은 원조를 샀습니다
  rationale: 본문은 외교 정책을 은유적으로 죄의 언어로 형상화하므로, 의미를 풀어 쓰기보다 은유를 유지해야 언약 불신실의 신학적 강도가 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
