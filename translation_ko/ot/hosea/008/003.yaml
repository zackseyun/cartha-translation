  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
  footnotes:
  - marker: a
    text: Or 'Israel has cast off the good.' The Hebrew may also be rendered more literally with 'the good' rather than 'what is good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 선한 것을 버렸습니다[a]. 원수가 그를 뒤쫓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘이 선한 것을 버렸습니다.’ 히브리어는 ‘선한 것’을 좀 더 직접적으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  english_pob_choice: has rejected
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 거절했습니다
  - 내버렸습니다
  - 물리쳤습니다
  lexicon: HALOT
  rationale: 이 동사는 의도적으로 내치거나 거절하는 뜻을 가지므로, 문어체이면서도 현대 한국어에서 자연스러운 ‘버렸습니다’로 그 강한 거부감을 살렸습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: 고유명사
  rationale: 문맥상 민족 전체를 가리키는 고유명사이므로 표준 음역을 유지했습니다.
- source_word: טוֹב
  english_pob_choice: the good / what is good
  chosen_korean: 선한 것
  alternatives_korean:
  - 좋은 것
  - 선
  - 옳은 것
  lexicon: HALOT
  rationale: 히브리어 טוֹב가 여기서는 명사적으로 쓰여 단순한 ‘좋음’이 아니라 도덕적·언약적 선을 가리키므로, 의미를 넓게 살린 ‘선한 것’이 가장 안정적입니다.
- source_word: יִרְדְּפוֹ
  english_pob_choice: will pursue him
  chosen_korean: 그를 뒤쫓을 것입니다
  alternatives_korean:
  - 그를 추격할 것입니다
  - 그를 추적할 것입니다
  - 그들을 뒤쫓을 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 나타내며, 접미사 3인칭 남성 단수는 이스라엘을 단수 인격으로 의인화한 문맥을 반영해 ‘그를’로 옮겼습니다.
theological_decisions:
- issue: ישראל을 단수로 의인화한 표현
  chosen_reading: 이스라엘을 민족 전체이면서도 단수 인격처럼 다루어 ‘그를’로 옮겼습니다.
  alternative_readings:
  - 그들을
  rationale: 히브리어 접미사는 단수형이며, 예언 문맥에서 이스라엘을 한 인격처럼 묘사하는 방식이 보존되어야 본문의 수사와 긴장이 사라지지 않습니다.
  doctrine_reference: Translation philosophy §4 (형태-의미 대응)
