id: HOS.8.13
reference: Hosea 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
  footnotes:
  - marker: a
    text: Hebrew has an unusual expression, literally something like 'the sacrifices of my offerings.' It may also be understood as 'my sacrificial gifts' or, less likely, 'my beloved sacrifices.'
    reason: lexical_alternative
  - marker: b
    text: Or 'takes no pleasure in them' / 'is not pleased with them.'
    reason: lexical_alternative
  - marker: c
    text: '''Return to Egypt'' may refer to an actual return, or more broadly to a return to bondage and exile under the image of Egypt.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 제물들의 제사[a]에 관하여, 그들은 고기를 제사하고 그것을 먹습니다. 그러나 야훼께서는 그들을 받아들이지 않으십니다[b]. 이제 그분께서 그들의 죄악을 기억하시고 그들의 죄를 벌하실 것입니다. 그들은 이집트로 돌아갈 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 제물들의 제사’에 가까운 특이한 표현입니다. ‘내 예물들’ 또는 덜 가능하게는 ‘내 사랑하는 제사들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 기뻐하지 않으십니다’ / ‘그들에게서 기쁨을 찾지 않으십니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘이집트로 돌아간다’는 실제 귀환일 수도 있고, 더 넓게는 이집트 이미지로 표현된 종속과 유배로의 회귀일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  english_pob_choice: the sacrifices of my offerings
  chosen_korean: 내 제물들의 제사
  alternatives_korean:
  - 내 예물들의 제사
  - 내 제사드림들의 제사
  - 내 희생제물들의 제사
  lexicon: HALOT
  rationale: 히브리어의 어색한 결합을 그대로 살리되, ‘זִבְחֵי’의 ‘제사들’과 ‘הַבְהָבַי’의 ‘제물/예물’ 의미를 반영해 직역에 가깝게 옮겼습니다.
- source_word: לֹא רָצָם
  english_pob_choice: does not accept them
  chosen_korean: 그들을 받아들이지 않으십니다
  alternatives_korean:
  - 그들을 기뻐하지 않으십니다
  - 그들에게서 기쁨을 찾지 않으십니다
  lexicon: HALOT
  rationale: 제사 문맥에서 רצה는 단순한 감정이 아니라 제사를 ‘받아들이다’는 의미가 강하므로, POB의 선택을 따라 ‘받아들이지 않으십니다’로 옮겼습니다.
- source_word: וְיִפְקֹד חַטֹּאותָם
  english_pob_choice: and punish their sins
  chosen_korean: 그들의 죄를 벌하실 것입니다
  alternatives_korean:
  - 그들의 죄를 찾아 물으실 것입니다
  - 그들의 죄를 심판하실 것입니다
  lexicon: HALOT
  rationale: פקד는 심판 문맥에서 ‘벌하다/찾아 묻다’의 의미를 가지므로, 한국어로는 판결과 집행이 드러나는 ‘벌하실 것입니다’가 가장 자연스럽습니다.
- source_word: מִצְרַיִם יָשׁוּבוּ
  english_pob_choice: they will return to Egypt
  chosen_korean: 이집트로 돌아갈 것입니다
  alternatives_korean:
  - 이집트로 되돌아갈 것입니다
  - 애굽으로 돌아갈 것입니다
  lexicon: HALOT
  rationale: 본문의 지리명 ‘Egypt’를 그대로 보존하되, 현대 한국어 표기법에 따라 ‘이집트’로 옮겼습니다. 상징적/문자적 귀환의 긴장은 원문처럼 그대로 남겼습니다.
theological_decisions:
- issue: 야훼의 제사 거절 표현
  chosen_reading: 하나님이 제사를 ‘받아들이지 않으신다’는 법정·예배적 판정으로 유지합니다.
  alternative_readings:
  - 그들을 좋아하지 않으신다
  - 그들의 제사에 기쁘지 않으시다
  rationale: 히브리어는 단순 감정보다 제의적 수납 거부를 말하므로, 예배와 심판의 긴장을 약화시키지 않도록 ‘받아들이지 않으신다’로 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: ‘이집트로 돌아감’의 의미
  chosen_reading: 지리적 이집트를 본문에 유지하고, 문자적 귀환과 종속/포로의 상징 가능성을 열어 둡니다.
  alternative_readings:
  - 다시 종속 상태로 돌아간다
  - 포로와 압제의 상징으로서 이집트를 가리킨다
  rationale: 원문이 직접 ‘이집트’를 말하므로, 해석을 한쪽으로 고정하지 않고 호세아의 예언적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
