id: HOS.8.1
reference: Hosea 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
  footnotes:
  - marker: a
    text: Or 'like a vulture.' The Hebrew נֶשֶׁר can refer more broadly to a large bird of prey.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have transgressed/broken my covenant.' Literally, 'they have crossed my covenant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my instruction.' Hebrew תּוֹרָה can mean 'law,' 'instruction,' or 'teaching.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나팔을 네 입에 대십시오! 독수리처럼 야훼의 집 위로 덮치니, 이는 그들이 내 언약을 어기고 내 율법을 거슬러 반역하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  english_pob_choice: Put the trumpet to your mouth
  chosen_korean: 나팔을 네 입에 대십시오
  alternatives_korean:
  - 나팔을 네 입천장에 대십시오
  - 나팔을 네 입술에 대십시오
  lexicon: HALOT
  rationale: 히브리어는 동사 없이 매우 압축적으로 ‘네 입에/입천장에, 나팔’이라고 말합니다. 한국어에서는 경고를 울리라는 명령으로 자연스럽게 풀되, 구체적 이미지인 ‘입’은 유지했습니다.
- source_word: כַּנֶּשֶׁר
  english_pob_choice: like an eagle
  chosen_korean: 독수리처럼
  alternatives_korean:
  - 수리처럼
  - 솔개처럼
  lexicon: HALOT
  rationale: נשר는 큰 맹금류를 가리킬 수 있으므로 한국어 관용과 위협적 비유를 살려 기본값인 ‘독수리’로 옮겼습니다.
- source_word: עַל בֵּית יְהוָה
  english_pob_choice: over the house of Yahweh
  chosen_korean: 야훼의 집 위로
  alternatives_korean:
  - 야훼의 집을 향하여
  - 야훼의 집 위에
  lexicon: HALOT
  rationale: עַל의 공간적 위상을 살려 ‘위로’로 옮기면, 심판으로 덮치는 포식자 이미지가 자연스럽게 드러납니다. יְהוָה는 본문 원칙에 따라 ‘야훼’로 표기했습니다.
- source_word: עָבְרוּ בְרִיתִי
  english_pob_choice: they have transgressed my covenant
  chosen_korean: 그들이 내 언약을 어기고
  alternatives_korean:
  - 그들이 내 언약을 넘어가고
  - 그들이 내 언약을 깨고
  lexicon: HALOT
  rationale: עָבְרוּ는 문자적으로 ‘건너가다/지나가다’이지만 언약 문맥에서는 위반을 뜻합니다. 한국어에서는 의미를 분명히 하되, 언약 위반의 법적 성격을 유지했습니다.
- source_word: וְ/עַל תּוֹרָתִי פָּשָׁעוּ
  english_pob_choice: and rebelled against my law
  chosen_korean: 내 율법을 거슬러 반역하였기 때문입니다
  alternatives_korean:
  - 내 가르침을 거슬러 반역하였기 때문입니다
  - 내 법에 반역하였기 때문입니다
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 언약-법의 뉘앙스가 강하므로 ‘율법’이 가장 적절합니다. פָּשַׁע는 단순 위반보다 강한 ‘반역’의 뜻을 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와로 표기
  - 주님으로 대체
  rationale: 이 프로젝트의 기준에 따라 신명기적 언약 이름을 제목어로 치환하지 않고 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘야훼의 집’의 지시 대상
  chosen_reading: 성전으로 좁히지 않고, 본문이 허용하는 언약 공동체/영역의 모호성을 유지했습니다.
  alternative_readings:
  - 야훼의 성전
  - 야훼의 백성
  rationale: 호세아서의 심판 맥락에서 ‘집’은 성전만이 아니라 야훼께 속한 공동체 전체를 울릴 수 있으므로, 원문의 범위를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
