  rationale: ‘지금/이제’에 뒤따르는 완료형의 결과 상태를 자연스러운 한국어로 풀어, 현재 처지를 나타내는 문맥을 살렸습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
