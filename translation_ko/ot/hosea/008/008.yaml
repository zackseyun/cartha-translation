translation:
  language: ko
  text: 이스라엘이 삼켜졌습니다[a]; 이제 그들은 여러 나라 가운데, 아무도 기뻐하지 않는 그릇처럼 되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무도 원하는 그릇처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלַע
  english_pob_choice: is swallowed up
  chosen_korean: 삼켜졌습니다
  alternatives_korean:
  - 흡수되었습니다
  - 집어삼켜졌습니다
  - 먹혀 버렸습니다
  lexicon: HALOT
  rationale: 니팔형의 ‘삼키다/집어삼키다’라는 수동적 피동 의미를 살려, 심판으로 완전히 잠식된 상태를 강하게 드러내는 표현을 택했습니다.
- source_word: עַתָּה הָיוּ
  english_pob_choice: now they are among the nations
  chosen_korean: 이제 그들은 여러 나라 가운데
  alternatives_korean:
  - 이제 그들은 민족들 가운데
  - 지금 그들은 나라들 가운데
  lexicon: HALOT
  rationale: ‘지금/이제’에 뒤따르는 완료형의 결과 상태를 자연스러운 한국어로 풀어, 현재 처지를 나타내는 문맥을 살렸습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 나라 가운데
  alternatives_korean:
  - 민족들 가운데
  - 이방 민족들 가운데
  lexicon: HALOT
  rationale: 예언서 문맥에서 גוים는 외국의 나라들을 가리키므로, 교회적·후대 신학적 색채가 덜한 ‘여러 나라’로 옮겼습니다.
- source_word: כִּכְלִי אֵין חֵפֶץ בּוֹ
  english_pob_choice: like a vessel in which there is no delight
  chosen_korean: 아무도 기뻐하지 않는 그릇처럼
  alternatives_korean:
  - 아무도 원하지 않는 그릇처럼
  - 기뻐함이 없는 그릇처럼
  lexicon: HALOT
  rationale: ‘그릇’은 כלי의 기본적·비유적 의미를 살리고, ‘기뻐하지 않는’은 חֵפֶץ의 부재를 한국어로 자연스럽게 드러내면서도 단순한 비선호를 보존합니다.
theological_decisions:
- issue: ‘그릇’ 비유의 평가 뉘앙스
  chosen_reading: 사람들에게서 가치와 기쁨을 잃은 물건처럼 된 상태로 이해했습니다.
  alternative_readings:
  - 단순히 버려진 물건처럼
  - 쓸모없게 된 그릇처럼
  rationale: 본문은 단순한 실용성 결핍보다 ‘기뻐함/원함’의 부재를 말하므로, 심판으로 인한 거절과 무가치화의 뉘앙스를 유지했습니다.
  doctrine_reference: 호세아 8:8 문맥의 언약 파기와 심판 선언
