  lexicon: HALOT
  rationale: 예언서 문맥에서 גוים는 외국의 나라들을 가리키므로, 교회적·후대 신학적 색채가 덜한 ‘여러 나라’로 옮겼습니다.
- source_word: כִּכְלִי אֵין חֵפֶץ בּוֹ
  english_pob_choice: like a vessel in which there is no delight
  chosen_korean: 아무도 기뻐하지 않는 그릇처럼
  alternatives_korean:
  - 아무도 원하지 않는 그릇처럼
  - 기뻐함이 없는 그릇처럼
  lexicon: HALOT
  rationale: ‘그릇’은 כלי의 기본적·비유적 의미를 살리고, ‘기뻐하지 않는’은 חֵפֶץ의 부재를 한국어로 자연스럽게 드러내면서도 단순한 비선호를 보존합니다.
