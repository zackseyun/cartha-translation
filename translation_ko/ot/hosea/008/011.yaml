base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/011.yaml
  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
  footnotes:
  - marker: a
    text: Or 'for sin offerings' in both occurrences of 'for sinning'; the Hebrew form can be understood in a cultic sense, but the context favors the idea that these altars became occasions for sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 에브라임이 죄를 짓기 위해 제단을 많이 만들었기 때문입니다. 그 제단들은 그에게 죄를 짓는 데 쓰이는 제단들이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 표현은 제의적으로 ‘속죄제를 위하여’라고 이해될 수도 있으나, 여기서는 문맥상 ‘죄를 짓다’라는 뜻이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 원문의 이유 제시를 현대 한국어에서 자연스럽게 드러내면서도, 예언적 진술의 설명 기능을 유지하기 위해 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: הִרְבָּה
  english_pob_choice: has multiplied
  chosen_korean: 제단을 많이 만들었기
  alternatives_korean:
  - 제단을 늘렸기
  - 제단을 증대시켰기
  lexicon: HALOT
  rationale: Hiphil의 증가·증식 의미를 살리되, 한국어에서는 ‘많이 만들다’가 제단의 다수화와 반복적 행위를 가장 직접적으로 드러냅니다.
- source_word: לַחֲטֹא
  english_pob_choice: for sinning
  chosen_korean: 죄를 지으려고
  alternatives_korean:
  - 죄를 짓기 위해
  - 죄를 위한
  lexicon: HALOT
  rationale: POB의 문맥 판단에 따라 제의적 ‘속죄제’보다 동작적 의미를 따랐고, 목적/결과를 자연스럽게 나타내는 ‘죄를 지으려고’로 옮겼습니다.
- source_word: הָיוּ לוֹ מִזְבְּחוֹת
  english_pob_choice: they have become ... to him
  chosen_korean: 그 제단들은 그에게 … 제단이 되었습니다
  alternatives_korean:
  - 그 제단들은 그에게 …가 되었습니다
  - 그 제단들은 그에게 …으로 변했습니다
  lexicon: HALOT
  rationale: לוֹ의 방향성/귀속을 살려 ‘그에게’로 유지했고, 결과 상태를 나타내는 היוּ를 ‘되었습니다’로 옮겨 원문의 귀결을 분명히 했습니다.
theological_decisions:
- issue: לַחֲטֹא의 의미를 ‘죄를 짓다’로 유지할지, ‘속죄제’로 볼지
  chosen_reading: 문맥상 우상 제단이 죄의 계기가 되었다는 비판으로 읽어 ‘죄를 짓다’의 동사적 의미를 유지했습니다.
  alternative_readings:
  - ‘속죄제/죄를 위한 제물’의 제의적 의미
  - ‘죄를 위한 제단’의 명사화된 의미
  rationale: 호세아의 직접적인 고발 맥락에서는 제단의 수가 늘어남이 오히려 범죄의 통로가 되었다는 역설이 핵심이므로, 제의적 완화 없이 원문의 풍자를 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 예언서의 풍자와 심판 진술을 완화하지 않음.
