  source_fidelity: 첫 번째 절반은 원문의 인과관계와 ‘죄를 짓기 위하여’라는 동사적 해석을 잘 반영합니다. 그러나 두 번째 절반의 ‘죄를 짓게 하는’은 원문의 반복된 לַחֲטֹא(‘죄를 짓기 위하여/죄짓는 데’)를 사역적으로 바꾸므로, 같은 표현의 반복과 에브라임에게 귀속되는 행위를 더 직접적으로 보존하는 편이 안전합니다.
  naturalness: ‘이는 … 때문입니다’와 합쇼체 문체는 자연스럽습니다. 수정안의 ‘죄를 짓는 데 쓰이는 제단들’은 반복을 완전히 동일하게 재현하지는 않지만, 한국어에서 자연스럽게 목적·용도를 드러내며 사역 의미를 피합니다.
