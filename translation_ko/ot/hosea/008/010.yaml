id: HOS.8.10
reference: Hosea 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֛ם כִּֽי יִתְנ֥וּ בַ/גּוֹיִ֖ם עַתָּ֣ה אֲקַבְּצֵ֑/ם וַ/יָּחֵ֣לּוּ מְּעָ֔ט מִ/מַּשָּׂ֖א מֶ֥לֶךְ שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
  footnotes:
  - marker: a
    text: Or 'Even though they give among the nations'; the Hebrew likely carries the sense of paying or hiring foreign allies in context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of 'and they will begin to diminish' is difficult; alternatives include 'and they will writhe a little' or 'and they will become few because of the burden/tribute.'
    reason: alternative_reading
  - marker: c
    text: '''The burden of the king of princes'' may refer to the oppressive tribute imposed by an imperial overlord.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 민족들 가운데서 값을 치르더라도,[a] 이제 내가 그들을 모으겠습니다. 그들은 고관들의 왕의 짐 때문에 조금씩 줄어들기 시작할 것입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 민족들 가운데서 주더라도’로 옮길 수 있습니다. 히브리어 동사는 기본적으로 ‘주다’라는 뜻이지만, 문맥에서는 외세의 도움이나 동맹을 얻기 위해 대가를 치르는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조금씩 줄어들기 시작할 것입니다’에 해당하는 히브리어 표현은 어렵습니다. ‘조금 몸부림칠 것입니다’ 또는 ‘그 짐이나 공물 때문에 수가 적어질 것입니다’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘고관들의 왕’은 여러 하위 통치자나 관리들 위에 있는 제국의 최고 통치자를 가리킬 수 있습니다. ‘짐’은 그가 부과하는 압박이나 공물을 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְנוּ בַּגּוֹיִם
  english_pob_choice: they hire among the nations
  chosen_korean: 나라들 가운데서 삯을 주더라도
  alternatives_korean:
  - 나라들 가운데서 주더라도
  - 나라들 가운데서 흥정하더라도
  - 나라들 가운데서 동맹을 사더라도
  lexicon: HALOT
  rationale: נתן의 기본 뜻은 ‘주다’이지만, 문맥상 이스라엘이 열국에 외교적 도움이나 동맹을 얻기 위해 비용을 지불하는 뉘앙스가 있으므로 ‘삯을 주다’로 옮겨 거래성과 의존성을 드러냈습니다.
- source_word: אֲקַבְּצֵם
  english_pob_choice: I will gather them
  chosen_korean: 내가 그들을 모으겠습니다
  alternatives_korean:
  - 내가 그들을 모으겠습니다
  - 내가 그들을 집합시키겠습니다
  - 내가 그들을 거두겠습니다
  lexicon: HALOT
  rationale: קבץ는 기본적으로 ‘모으다/집합시키다’이므로 직역을 유지했습니다. 문맥상 심판의 수습이라는 함의는 본문 밖에서 읽히게 두었습니다.
- source_word: וַיָּחֵלּוּ מְּעָט
  english_pob_choice: they will begin to diminish
  chosen_korean: 그들은 점점 줄어들 것입니다
  alternatives_korean:
  - 그들은 조금 고통받기 시작할 것입니다
  - 그들은 조금씩 쇠약해질 것입니다
  - 그들은 줄어들기 시작할 것입니다
  lexicon: HALOT
  rationale: 원문은 형태와 의미가 어렵지만, 영어 POB의 판단에 따라 מעט과 결합된 축소 의미를 한국어 자연문으로 살려 ‘점점 줄어들다’로 옮겼습니다.
- source_word: מֶלֶךְ שָׂרִים
  english_pob_choice: the king of princes
  chosen_korean: 왕들 위의 왕
  alternatives_korean:
  - 방백들의 왕
  - 고관들의 왕
  - 왕과 방백들
  lexicon: HALOT
  rationale: מצרוף는 매우 압축적이어서 문자형을 그대로 살리기보다, 상위 통치자를 가리키는 위계적 구도를 한국어에서 이해되도록 ‘왕들 위의 왕’으로 풀었습니다.
theological_decisions:
- issue: יִתְנוּ בַגּוֹיִם의 정치·외교적 함의
  chosen_reading: 이스라엘이 열국에 의존해 대가를 치르며 도움을 사는 모습으로 읽었습니다.
  alternative_readings:
  - 단순히 열국 가운데서 무언가를 주는 뜻
  - 성적인 은유를 그대로 살리는 읽기
  rationale: 호세아 8장의 문맥은 정치적 배신과 이방 의존을 다루므로, 본 구절도 외교적 거래와 종속을 드러내는 쪽으로 이해하는 것이 적절합니다.
  doctrine_reference: 호 8:9-10 문맥 해석
