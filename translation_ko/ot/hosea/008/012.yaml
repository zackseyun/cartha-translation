translation:
  language: ko
  text: 내가 그를 위하여 내 율법의 수많은 것들을 기록하였으나, 그것들은 낯선 것으로 여겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그를 위하여 내 가르침/토라의 수많은 것들을 쓸지라도, 그것들은 낯선 것으로 여겨질 것입니다.’ 히브리어 첫 동사는 미완료형이며, תּוֹרָה는 ‘율법’ 외에 ‘가르침’이나 ‘토라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אכתוב
  english_pob_choice: Though I wrote
  chosen_korean: 내가 ... 기록하였으나
  alternatives_korean:
  - 내가 ... 썼으나
  - 내가 ... 기록할 것이나
  lexicon: HALOT
  rationale: 히브리어 완료/미완료의 문맥상 용법을 따라, 이미 주어진 계시를 가리키는 과거적 회상으로 옮기면서 역접 관계를 분명히 하기 위해 '-었으나'를 사용했습니다.
- source_word: לוֹ
  english_pob_choice: for him
  chosen_korean: 그를 위하여
  alternatives_korean:
  - 그에게
  - 그를 위해
  lexicon: HALOT
  rationale: ל + 3인칭 남성 단수는 수혜 대상의 의미를 가지므로, 문맥상 이스라엘을 향한 하나님의 배려를 드러내는 '그를 위하여'가 자연스럽습니다.
- source_word: תורתי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 가르침
  - 내 토라
  lexicon: HALOT
  rationale: 예언서의 언약적 문맥에서 תּוֹרָה는 단순한 일반 '가르침'보다 하나님의 언약 규범인 '율법'이 더 직접적으로 대응합니다.
- source_word: זר
  english_pob_choice: foreign
  chosen_korean: 낯선
  alternatives_korean:
  - 이방의
  - 외래의
  - 외국의
  lexicon: HALOT
  rationale: זר는 '남의 것, 속하지 않은 것'이라는 뉘앙스를 가지므로, 한국어에서는 관계적 소외를 드러내는 '낯선'이 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: מ법/율법의 언약적 성격
  chosen_reading: 하나님이 이스라엘을 위해 이미 베푸신 언약적 율법을 말합니다.
  alternative_readings:
  - 일반적 도덕 규범
  - 단순한 교육적 교훈
  rationale: 호세아서의 문맥에서 תורה는 하나님의 백성에게 주신 언약 규범이므로, 이를 약화시키지 않기 위해 '율법'을 유지했습니다.
  doctrine_reference: 언약 신학 / 토라의 계시적 성격
