id: HOS.2.8
reference: Hosea 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִי שָׂ֥ךְ אֶת דַּרְכֵּ֖/ךְ בַּ/סִּירִ֑ים וְ/גָֽדַרְתִּי֙ אֶת גְּדֵרָ֔/הּ וּ/נְתִיבוֹתֶ֖י/הָ לֹ֥א תִמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
  footnotes:
  - marker: a
    text: Or 'with briars' or 'with thornbushes.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shifts from 'your way' to 'her paths'; the translation preserves this rhetorical change rather than smoothing it out.
    reason: alternative_reading
  - marker: c
    text: Or 'and I will fence her in with a wall.' The Hebrew phrase is terse and may mean that God will erect a barrier around her.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 가시로 네 길을 막고, 그녀의 담을 둘러쌓아 그녀가 자기 길을 찾지 못하게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가시덤불로’ 혹은 ‘가시나무로’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 2인칭 ‘네 길’에서 3인칭 ‘그녀의 길들’로 바뀝니다. 이 번역은 그 수사적 전환을 매끄럽게 만들지 않고 살립니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그녀를 담으로 둘러막겠다.’ 히브리어 표현은 매우 압축적이며, 하나님이 장벽을 세우신다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 대한 귀결을 나타내므로, 한국어에서는 인과·추론 관계를 자연스럽게 드러내는 '그러므로'가 적절합니다.
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 보게, 내가
  lexicon: HALOT
  rationale: 주의를 끄는 선언적 표현을 살리되, 현대 합쇼체 문맥에서 자연스럽게 들리도록 '보십시오'로 옮겼습니다.
- source_word: שָׂךְ / בַּסִּירִים
  english_pob_choice: hedging up ... with thorns
  chosen_korean: 가시로 네 길을 막고
  alternatives_korean:
  - 가시덤불로 네 길을 두르고
  - 가시나무로 네 길을 에워싸고
  lexicon: HALOT
  rationale: 히브리어는 길을 장애물로 막는 농경적·이미지적 표현이므로, '막고'로 obstruction을 살리면서 '가시'를 사용해 고통스러운 방해의 이미지를 유지했습니다.
- source_word: וְגָדַרְתִּי אֶת גְּדֵרָהּ
  english_pob_choice: I will wall in her wall
  chosen_korean: 그녀의 담을 둘러쌓아
  alternatives_korean:
  - 그녀의 담을 둘러막아
  - 그녀의 담을 쌓아 둘러
  lexicon: HALOT
  rationale: 히브리어의 축자적 긴장(동족어 반복)을 그대로 옮기기보다, 담을 세워 차단한다는 의미를 한국어로 분명하게 드러냈습니다.
- source_word: וּנְתִיבוֹתֶיהָ לֹא תִמְצָא
  english_pob_choice: she will not find her paths
  chosen_korean: 그녀가 자기 길을 찾지 못하게 하겠습니다
  alternatives_korean:
  - 그녀가 그녀의 길들을 찾지 못하게 하겠습니다
  - 그녀가 자기 오솔길들을 찾지 못하게 하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 결과절을 한국어 목적·결과 구문으로 자연스럽게 풀어, 결국 그가 길을 발견하지 못하게 되는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 인칭 전환 보존
  chosen_reading: 네 길 / 그녀의 담 / 그녀가 자기 길
  alternative_readings:
  - 모두 2인칭으로 통일
  - 모두 3인칭으로 통일
  rationale: 히브리어의 2인칭에서 3인칭으로의 전환을 매끄럽게 하나로 통일하면 수사적 움직임이 사라집니다. 본문이 가진 직접 호소와 거리 두기를 함께 살리기 위해 인칭 전환을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
