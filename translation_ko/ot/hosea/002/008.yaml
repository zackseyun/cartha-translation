    rationale: גָּדַרְתִּי와 גְּדֵרָהּ의 결합은 담/장벽을 만들거나 그것으로 막는 강한 폐쇄 이미지를 나타냅니다. 한국어에서는 ‘그녀의 담을 쌓아’가 더 충실하고 자연스럽습니다.
