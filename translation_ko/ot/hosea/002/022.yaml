id: HOS.2.22
reference: Hosea 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י בֶּ/אֱמוּנָ֑ה וְ/יָדַ֖עַתְּ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
  footnotes:
  - marker: a
    text: Or 'in fidelity' or, more formally, 'in faith.' The Hebrew term carries the sense of reliability and covenant faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 나 자신에게 신실함으로 정혼시키고, 너는 야훼를 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실함’은 여기서 믿음의 주체적 태도보다, 언약에 대한 신뢰성과 충실성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  english_pob_choice: And I will betroth you
  chosen_korean: 내가 너를 ... 정혼시키고
  alternatives_korean:
  - 내가 너와 약혼하고
  - 내가 너를 ... 혼인 약속시키고
  lexicon: HALOT
  rationale: ארשׂ는 단순한 결혼이 아니라 정혼/약혼의 혼인 전 언약 관계를 가리키므로, 한국어도 교회적 상투어보다 법적·관계적 무게가 있는 ‘정혼하다’를 택했습니다.
- source_word: לִי
  english_pob_choice: to myself
  chosen_korean: 나 자신에게
  alternatives_korean:
  - 나에게
  - 내게
  lexicon: HALOT
  rationale: 직역은 ‘나에게’이지만, 문맥의 언약적 결속을 살리기 위해 ‘나 자신에게’로 옮겨, 단순한 방향성보다 하나님 편의 자기-결속을 드러냈습니다.
- source_word: בֶּאֱמוּנָה
  english_pob_choice: in faithfulness
  chosen_korean: 신실함으로
  alternatives_korean:
  - 성실함으로
  - 믿음으로
  - 충실함으로
  lexicon: HALOT
  rationale: אֱמוּנָה는 여기서 인간의 주관적 ‘믿음’보다 언약에 대한 신뢰성과 신실성을 뜻하므로, 한국어에서는 그 핵심을 가장 직접적으로 드러내는 ‘신실함’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 대체칭호가 아니라 고유명사이므로, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: בֶּאֱמוּנָה의 신학적 긴장
  chosen_reading: ‘신실함으로’를 본문에 두어, 관계적 신뢰와 언약적 충실성을 함께 보존했습니다.
  alternative_readings:
  - 믿음으로
  - 충성으로
  rationale: 호세아서의 혼인-언약 비유에서는 하나님의 신실하심이 핵심이므로, 한국어도 ‘믿음’으로 좁히거나 ‘충성’으로 윤리화하지 않고 언약적 의미를 살리는 표현을 유지했습니다.
  doctrine_reference: 언약 신실성의 보존
- issue: וְיָדַעַתְּ의 관계적 인식
  chosen_reading: ‘알게 될 것입니다’로 유지해, 단순 인지보다 언약적 관계 인식을 본문이 스스로 말하게 했습니다.
  alternative_readings:
  - 깊이 알게 될 것입니다
  - 야훼를 인정하게 될 것입니다
  rationale: 히브리어 ידע의 관계적 깊이는 문맥이 충분히 드러내므로, 본문을 과도하게 확장하지 않는 것이 더 충실합니다.
  doctrine_reference: 본문의 의미 확장 자제
