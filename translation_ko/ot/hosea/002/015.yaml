  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
  footnotes:
  - marker: a
    text: Or possibly 'her nose ring.' The Hebrew נֶזֶם can refer to a ring, often specifically a nose ring or earring.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 바알들의 날들 때문에 그녀를 벌하겠습니다. 그 날들에 그녀는 그들에게 향을 피우고, 자기 반지와 장신구로 몸을 꾸미며, 자기 연인들을 따라갔지만 나를 잊었습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반지’는 히브리어 נֶזֶם의 가능한 뜻 가운데 하나입니다. 이 단어는 코걸이나 귀걸이를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  english_pob_choice: I will punish her
  chosen_korean: 내가 그녀에게 벌하겠습니다
  alternatives_korean:
  - 내가 그녀를 징벌하겠습니다
  - 내가 그녀에게 책임을 물겠습니다
  lexicon: HALOT
  rationale: עַל과 함께 쓰인 פקד는 심판·책벌의 의미가 분명하므로, ‘벌하다’로 옮겨 재판적 뉘앙스를 자연스럽게 살렸습니다.
- source_word: יְמֵי הַבְּעָלִים
  english_pob_choice: the days of the Baals
  chosen_korean: 바알들의 날들
  alternatives_korean:
  - 바알들의 시대
  - 바알들에게 바친 날들
  lexicon: HALOT
  rationale: 복수형 ‘바알들’을 유지해 우상 숭배의 다중성을 살렸고, יְמֵי는 ‘날들’로 직역해 그 기간/기회들의 뉘앙스를 보존했습니다.
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  english_pob_choice: when she burned incense to them
  chosen_korean: 그들에게 향을 피우고
  alternatives_korean:
  - 그들에게 제물을 연기나게 하며
  - 그들에게 향을 올리고
  lexicon: HALOT
  rationale: הקטיר는 제의적 연기 올림을 가리키므로, 우상에게 드린 예배 행위를 드러내는 ‘향을 피우다’가 가장 자연스럽고 직접적입니다.
- source_word: נִזְמָהּ וְחֶלְיָתָהּ
  english_pob_choice: her ring and her jewelry
  chosen_korean: 자기 반지와 장신구
  alternatives_korean:
  - 자기 코걸이와 장신구
  - 자기 반지와 보석
  lexicon: HALOT
  rationale: נֶזֶם은 코걸이 가능성도 있으나, 본문만으로 특정할 수 없으므로 본문에는 넓게 ‘반지’로 두고, 구체성은 주석으로 남겼습니다. חֶלְיָה는 장식품 전체를 뜻하므로 ‘장신구’가 적절합니다.
- source_word: וְאֹתִי שָׁכְחָה
  english_pob_choice: but forgot me
  chosen_korean: 그녀가 … 나를 잊었기 때문입니다
  alternatives_korean:
  - 그리고 나를 잊었습니다
  - 그러나 나를 잊었습니다
  lexicon: HALOT
  rationale: 문맥상 사랑하는 대상들을 좇은 행위와 여호와를 잊은 행위가 대비되므로, 한국어에서는 원인절로 풀어 그 대조를 분명하게 했습니다.
theological_decisions:
- issue: יהוה의 음역과 종결 공식
  chosen_reading: 야훼의 말씀이십니다
  alternative_readings:
  - 여호와의 말씀이십니다
  - 주님의 말씀이십니다
  rationale: 본문의 סוף식은 예언자적 선언문이며, 텍스트의 여호와 이름을 보존하기 위해 ‘야훼’로 옮겼습니다. 종결은 한국어에서 통용되는 선포형으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
