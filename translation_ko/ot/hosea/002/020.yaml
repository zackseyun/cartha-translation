id: HOS.2.20
reference: Hosea 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
  footnotes:
  - marker: a
    text: Literally, 'cut a covenant.' Hebrew commonly uses 'cut' as the idiom for making a covenant.
    reason: lexical_alternative
  - marker: b
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 그들을 위하여 들짐승과 하늘의 새와 땅에 기는 것들과 더불어 언약을 맺겠으며, 활과 칼과 전쟁을 땅에서 꺾고 그들이 안전히 눕게 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָרַתִּי
  english_pob_choice: I will make
  chosen_korean: 내가 … 언약을 맺겠으며
  alternatives_korean:
  - 내가 … 언약을 끊겠으며
  - 내가 … 언약을 세우겠으며
  lexicon: HALOT
  rationale: 히브리어 כרת ברית의 관용구는 문자적으로는 ‘언약을 자르다’이지만, 한국어에서는 ‘언약을 맺다’가 관용과 의미를 가장 자연스럽게 살립니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 들짐승
  alternatives_korean:
  - 들판의 짐승들
  - 들의 짐승
  lexicon: HALOT
  rationale: ‘들짐승’이 무리지어 사는 야생 동물을 가장 간결하게 드러내며, ‘field’의 목가적 배경은 ‘들의’로 보완했습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새
  alternatives_korean:
  - 하늘의 새들
  - 하늘의 날짐승
  lexicon: HALOT
  rationale: 히브리어의 시적 병행성을 살리면서도 현대 한국어에서 자연스럽고 읽기 쉬운 표현으로 옮겼습니다.
- source_word: רֶמֶשׂ הָאֲדָמָה
  english_pob_choice: the creeping things of the ground
  chosen_korean: 땅의 기는 것들
  alternatives_korean:
  - 땅의 기어 다니는 것들
  - 흙에서 기는 것들
  lexicon: HALOT
  rationale: רֶמֶשׂ의 ‘기어 다니는’ 성격을 보존하되, 한국어에서는 분류적 표현인 ‘기는 것들’이 가장 압축적이고 시적입니다.
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  english_pob_choice: bow and sword and war
  chosen_korean: 활과 칼과 전쟁
  alternatives_korean:
  - 활과 칼과 싸움
  - 활·칼·전쟁
  lexicon: HALOT
  rationale: 구체 무기에서 전쟁 일반으로 확장되는 열거를 그대로 살려, 추상화하지 않고 병렬 구조를 유지했습니다.
- source_word: וְהִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח
  english_pob_choice: I will make them lie down in safety
  chosen_korean: 그들이 안전하게 눕게 하겠습니다
  alternatives_korean:
  - 그들이 안전히 누우게 하겠습니다
  - 그들이 평안히 눕게 하겠습니다
  lexicon: HALOT
  rationale: 사역형의 원인성을 살리면서도 목가적 평안을 자연스러운 현대 한국어로 전달했습니다.
theological_decisions:
- issue: לָהֶם과 반복되는 עִם의 구문 관계
  chosen_reading: ‘그들을 위하여’로 옮겨, 언약의 직접 수혜자와 언약의 상대 항목인 피조세계 사이의 구분을 유지했습니다.
  alternative_readings:
  - ‘그들과’로 단순화
  - ‘그들을 향하여’로 의역
  rationale: 히브리어는 לָהֶם(그들을 위하여)과 뒤이은 עִם(…와 함께)을 구분하므로, 한국어에서도 그 구분을 남겨 두는 편이 문장 구조와 신학적 초점을 더 잘 보존합니다.
  doctrine_reference: 창조 질서의 화해와 언약적 평화
- issue: מִן הָאָרֶץ의 범위
  chosen_reading: ‘이 땅에서’로 옮겨, 문맥상 회복될 삶의 자리와 땅의 질서를 드러냈습니다.
  alternative_readings:
  - ‘이 땅으로부터’
  - ‘이 땅에서/세상에서’
  rationale: 호세아서의 회복 문맥에서는 ‘땅/땅의 삶의 자리’가 더 정확하며, ‘earth’의 우주론적 뉘앙스를 과도하게 확대하지 않습니다.
  doctrine_reference: 언약적 회복과 땅의 평화
