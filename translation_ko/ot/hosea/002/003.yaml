  lexicon: HALOT
  rationale: 히브리어 복수 명령형의 직접 화행을 살려, 현대 한국어에서는 공손한 명령인 ‘-십시오’를 사용해 자연스럽고 분명하게 옮겼습니다.
- source_word: לַאֲחֵיכֶם
