    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘루하마’(Ruhamah)는 상징적 이름이며, ‘긍휼을 입은 이’ 또는 ‘긍휼을 받은 이’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  english_pob_choice: Say
  chosen_korean: “...라 하십시오”
