- source_word: עַמִּי
  english_pob_choice: My people
  chosen_korean: ‘내 백성’
  alternatives_korean:
  - ‘내 백성이’
  - ‘내 사람들’
  - ‘암미’
  lexicon: HALOT
  rationale: 이 표현은 의미상 ‘내 백성’이지만, 호세아서의 상징적 이름 ‘암미’의 뜻을 되살리는 말이므로 본문에는 의미를 번역하고, 이름 형태는 각주로 보존하는 편이 적절합니다.
- source_word: רֻחָמָה
  english_pob_choice: Shown mercy
  chosen_korean: ‘긍휼을 입은 자’
  alternatives_korean:
  - ‘긍휼을 받은 자’
  - ‘자비를 입은 자’
  - ‘긍휼을 입은’
  lexicon: HALOT
  rationale: 수동적 분사 의미를 살리되, 한국어에서 상징 이름처럼 들리도록 명사화한 표현을 택했습니다. ‘긍휼’은 하나님의 자비로운 돌보심을 비교적 직접적으로 드러냅니다.
theological_decisions:
- issue: 호세아의 상징적 이름을 본문에서 음역할지 의미 번역할지
  chosen_reading: 본문에서는 의미로 번역하고, 이름-반향은 각주에서 보존했습니다.
  alternative_readings:
  - 본문에 ‘암미’, ‘루하마’를 그대로 두기
  - 의미 번역 없이 음역만 사용하기
  rationale: 이 두 이름은 단순 호칭이 아니라 회복의 반전을 선포하는 예언적 표지이므로, 한국어 독자가 즉시 뜻을 이해하도록 본문에서는 의미를 드러내는 것이 더 적절합니다. 동시에 상징명 자체의 연결은 각주로 남겨 원문 추적성을 보존했습니다.
  doctrine_reference: 'translation philosophy: original-language primacy; preserve significant alternatives in footnotes'
