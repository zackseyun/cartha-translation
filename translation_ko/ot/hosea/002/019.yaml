  source_fidelity: 첫 절은 원문의 사역적 미래 의미를 대체로 충실히 옮겼습니다. 그러나 둘째 절의 히브리어 수동형은 바알들(또는 그 이름들)이 더 이상 기억/언급되지 않는다는 진술인데, 초안의 ‘기억되지 않게 하겠습니다’는 하나님이 그렇게 되게 하신다는 사역 구문으로 바꾸어 놓았습니다. 또한 ‘그들의 이름으로 기억되지’는 한국어에서 부자연스럽고 의미가 불분명합니다.
  naturalness: ‘이름들을’과 ‘그들의 이름으로 기억되지 않게 하겠습니다’의 결합은 현대 한국어에서 다소 중복되고 어색합니다. ‘바알들의 이름’ 및 ‘그 이름들이 다시는 기억되지 않을 것입니다’가 자연스럽고 명료합니다. ‘그 여인’은 호세아서의 비유적 여성 지시 대상을 보존하는 안전한 표현입니다.
  terminology: ‘바알들’은 이 문맥의 복수 신명(神名)을 적절히 보존합니다. ‘기억되지 않다’를 본문에 유지하고, ‘언급되다/불려지다’의 문맥상 가능한 뜻은 각주로 제시하는 것이 영어 POB의 어휘 판단 및 원문의 모호성에 부합합니다.
