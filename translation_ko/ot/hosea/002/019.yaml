base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
  footnotes:
  - marker: a
    text: Or, 'they will no longer be mentioned again.' The Hebrew verb can denote either being remembered or being mentioned, and in context both ideas support the end of Baal worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바알들의 이름들을 그 여인의 입에서 제거하겠고, 그들이 다시는 그들의 이름으로 기억되지 않게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기억되지 않다’는 여기서 ‘더 이상 언급되거나 불려지지 않다’는 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  english_pob_choice: And I will remove
  chosen_korean: 내가 ... 제거하겠고
  alternatives_korean:
  - 내가 ... 없애겠고
  - 내가 ... 치워버리겠고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘제거하다’로 옮기고, 미래 예언 서술의 연속성을 위해 연결어미를 사용했습니다.
- source_word: שְׁמוֹת הַבְּעָלִים
  english_pob_choice: the names of the Baals
  chosen_korean: 바알들의 이름들
  alternatives_korean:
  - 바알들의 이름
  - 바알 우상들의 이름들
  lexicon: HALOT
  rationale: 복수형 ‘바알들’을 고유한 우상들에 대한 지칭으로 살리고, ‘이름들’도 복수성을 유지해 우상 호칭의 삭제라는 뜻을 분명히 했습니다.
- source_word: מִפִּיהָ
  english_pob_choice: from her mouth
  chosen_korean: 그 여인의 입에서
  alternatives_korean:
  - 그녀의 입에서
  - 그 여인의 입술에서
  lexicon: HALOT
  rationale: 히브리어 관용을 직역해 ‘입’의 이미지를 보존하면서, 한국어에서는 문맥상 대상인 여인을 명확히 하도록 ‘그 여인’을 썼습니다.
- source_word: וְלֹא יִזָּכְרוּ עוֹד בִּשְׁמָם
  english_pob_choice: and they will no longer be remembered by name
  chosen_korean: 그들이 다시는 그들의 이름으로 기억되지 않게 하겠습니다
  alternatives_korean:
  - 그들이 다시는 이름으로 언급되지 않게 하겠습니다
  - 그들이 더 이상 이름으로 기억되지 않게 하겠습니다
  lexicon: HALOT
  rationale: יִזָּכְרוּ는 ‘기억되다/언급되다’의 여지가 있지만, 문맥상 바알 숭배의 종결을 강조하는 ‘기억되지 않다’가 자연스럽고, בִּשְׁמָם은 ‘그들의 이름으로’로 비교적 직역했습니다.
theological_decisions:
- issue: ‘바알들’의 지시 대상
  chosen_reading: 가나안의 우상 신들을 가리키는 표현으로 읽고 ‘바알들’로 그대로 살렸습니다.
  alternative_readings:
  - 일반적인 ‘주인들’ 또는 ‘주들’로 읽을 수 있음
  rationale: 호세아서의 우상숭배 비판과 혼인 비유 안에서, 단순한 일반 명사보다 우상 이름을 유지하는 것이 신학적 대비를 더 분명히 드러냅니다.
  doctrine_reference: 호세아 2장 우상숭배 심판 문맥
