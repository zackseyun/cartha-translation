language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
  footnotes:
  - marker: a
    text: Or 'the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land'; 'earth' is used here to preserve the poetic pairing with 'the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 야훼께서 말씀하십니다. 나는 하늘들에게 응답하고, 그들은 땅에 응답할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘땅/세상’을 뜻할 수 있습니다. 여기서는 ‘하늘들’과의 시적 대구를 살리기 위해 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그때
  lexicon: HALOT
  rationale: 예언 문맥의 정형화된 시간 표현을 살리되, 현대 한국어에서 자연스러운 부사구로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언자적 화행 공식의 무게를 살리면서도, 한국어에서는 동적 화법보다 직접 화법이 더 자연스러워 ‘말씀하십니다’로 옮겼습니다.
- source_word: אֶעֱנֶה / יַעֲנ֥וּ
  english_pob_choice: I will answer / they shall answer
  chosen_korean: 응답하고
  alternatives_korean:
  - 대답하고
  - 응답하여
  lexicon: HALOT
  rationale: ענה의 반복을 한국어에서도 유지하기 위해 같은 어근 의미를 반복해 ‘응답하다’로 옮겼습니다. ‘대답하다’는 인간 대화로 좁아질 수 있어 피했습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘의 영역
  lexicon: HALOT
  rationale: 문맥상 땅과 대조되는 시적 병행을 살리면서, 복수형 뉘앙스를 반영하기 위해 ‘하늘들’로 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지면
  - 세상
  lexicon: HALOT
  rationale: 여기서는 ‘하늘들’과의 대구를 유지하면서도 후속 맥락의 농경적 함의를 자연스럽게 담는 ‘땅’이 적절합니다.
theological_decisions:
- issue: ענה 반복의 시적·신학적 긴장 보존
  chosen_reading: ‘응답하다’를 반복하여 하나님-하늘-땅의 연쇄적 응답을 그대로 드러냈습니다.
  alternative_readings:
  - ‘비를 내리다’ 또는 ‘풍성하게 하다’로 뜻을 풀어 쓰기
  rationale: 본문은 동일 동사를 세 번 반복해 상호 대응의 시적 구조를 형성합니다. 농경적 결과를 미리 풀어 쓰면 이 반복과 긴장이 약화되므로, 해석을 과도하게 닫지 않고 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
