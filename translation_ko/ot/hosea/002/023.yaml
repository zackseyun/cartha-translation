revisions:
- from: 그 날에 야훼께서 말씀하십니다. 나는 하늘들에게 응답하고, 그들은 땅에 응답할 것입니다.[a]
  to: 그 날에 이런 일이 일어날 것입니다. 야훼의 말씀입니다. 내가 하늘에 응답하고, 하늘은 땅에 응답할 것입니다.[a]
  rationale: וְהָיָה의 미래적 도입을 ‘이런 일이 일어날 것입니다’로 보완하고, נְאֻם יְהוָה를 합쇼체의 ‘야훼의 말씀입니다’로 옮겼습니다. ענה의 반복과 하늘→땅의 의인화된 응답 연쇄는 유지하되, 한국어의 자연스러운 집합 명사 용법에 따라 ‘하늘’로 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:50:56Z'
