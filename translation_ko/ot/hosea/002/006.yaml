translation:
  language: ko
  text: 그리고 그 여자의 자녀들에게는 내가 긍휼을 베풀지 않겠습니다. 그들이 음행의 자녀들이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행의 자녀들’은 직역에 가까운 표현입니다. 원문은 성적 불충실의 강한 이미지를 사용하여 언약적 불충실을 나타냅니다. ‘음행으로 난 자녀들’ 또는 ‘매춘의 자녀들’로도 옮길 수 있으나, 이는 원문의 압축된 표현을 다소 해석하여 풀어쓴 것입니다.
    reason: lexical_alternative
