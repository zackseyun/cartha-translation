source:
  edition: WLC
  text: וְ/אֶת בָּנֶ֖י/הָ לֹ֣א אֲרַחֵ֑ם כִּֽי בְנֵ֥י זְנוּנִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/006.yaml
  text: And I will not show compassion to her children[a], for they are children of whoredom.
  footnotes:
  - marker: a
    text: Or 'children of prostitution' or 'children of harlotry.' The Hebrew preserves the stark imagery of sexual unfaithfulness that symbolizes covenant infidelity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그녀의 자녀들에게는 긍휼을 베풀지 않을 것입니다. 그들은 음란의 자녀들이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음란의 자녀들’은 원문의 강한 성적·언약적 불충실 이미지에 해당하며, 더 완화된 번역으로는 ‘음행의 자녀들’ 또는 ‘불신실함의 자녀들’이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת / וְ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: HALOT
  rationale: 문장 연결 기능을 자연스럽게 살리되, 히브리어의 다음 절 전개를 매끄럽게 이어 줍니다.
- source_word: בָּנֶיהָ
  english_pob_choice: her children
  chosen_korean: 그녀의 자녀들
  alternatives_korean:
  - 그녀의 아이들
  - 그녀의 아들들
  lexicon: HALOT
  rationale: בנים은 문맥상 성별을 특정하지 않는 후손/자녀를 가리킬 수 있으므로, 원문의 대표적 의미를 과잉 한정하지 않는 ‘자녀들’이 적절합니다.
- source_word: לֹא אֲרַחֵם
  english_pob_choice: I will not show compassion
  chosen_korean: 긍휼을 베풀지 않을 것입니다
  alternatives_korean:
  - 불쌍히 여기지 않을 것입니다
  - 자비를 베풀지 않을 것입니다
  lexicon: HALOT
  rationale: רחם의 동작적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘긍휼을 베풀다’로 옮겼습니다. 이는 단순 감정이 아니라 적극적 자비의 거절을 표현합니다.
- source_word: בְנֵי זְנוּנִים
  english_pob_choice: children of whoredom
  chosen_korean: 음란의 자녀들
  alternatives_korean:
  - 창기의 자녀들
  - 음행의 자녀들
  - 음란의 소생
  lexicon: HALOT
  rationale: 호세아서의 선지자적 성적 불충실 이미지와 도덕적 긴장을 유지하되, 한국어에서 지나치게 노골적이거나 옛말투인 표현을 피하면서 원문의 강도를 보존했습니다.
theological_decisions:
- issue: בְנֵי זְנוּנִים의 비유적·충격적 표현 유지
  chosen_reading: ‘음란의 자녀들’로 직역에 가깝게 유지하여 언약적 불신실의 상징을 보존합니다.
  alternative_readings:
  - ‘음행의 자녀들’
  - ‘불신실함의 자녀들’
  rationale: 본문은 실제 혈통 주장보다 호세아의 혼인-언약 비유 안에서 이스라엘의 불신실을 고발합니다. 따라서 의미를 완화하는 추상어보다 비유의 날카로움을 살리는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
