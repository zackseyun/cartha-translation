source:
  edition: WLC
  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
  footnotes:
  - marker: a
    text: Or 'appoint for themselves one leader.' The Hebrew literally says 'one head.'
    reason: lexical_alternative
  - marker: b
    text: '''From the land'' may refer to coming up out of exile or to a restored ascent into the land; the Hebrew leaves the exact nuance open.'
    reason: alternative_reading
  - marker: c
    text: Jezreel is both a place name and a theologically charged name in Hosea, echoing themes of scattering and sowing.
    reason: cultural_note
translation:
  language: ko
  text: 유다의 자손들과 이스라엘의 자손들이 함께 모여, 자기들을 위하여 한 지도자를 세우고[a], 땅에서 올라갈 것입니다[b]. 이스르엘의 날이 클 것이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들을 위하여 한 우두머리를 세우고.’ 히브리어는 직역하면 ‘한 머리’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅에서’는 포로 상태에서 올라오는 것을 가리킬 수도 있고, 회복된 땅으로 올라가는 것을 가리킬 수도 있습니다. 히브리어는 정확한 뉘앙스를 열어 둡니다.
    reason: alternative_reading
  - marker: c
    text: 이스르엘은 지명인 동시에 호세아서에서 흩음과 씨 뿌림의 주제를 함께 떠올리게 하는 신학적으로 뜻깊은 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  english_pob_choice: will be gathered together
  chosen_korean: 함께 모이고
  alternatives_korean:
  - 모일 것입니다
  - 함께 모일 것입니다
  lexicon: HALOT
  rationale: נִקְבְּצוּ의 수동적·상태적 뉘앙스를 살려 단순한 ‘모이다’보다 공동체적 결집이 드러나도록 옮겼습니다.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Judah / the sons of Israel
  chosen_korean: 유다의 자손들 / 이스라엘의 자손들
  alternatives_korean:
  - 유다의 백성들 / 이스라엘의 백성들
  - 유다 사람들 / 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역형 병행을 살리면서, 성별을 지우지 않는 ‘자손들’을 택해 재통합의 대상을 분명히 했습니다.
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  english_pob_choice: they will appoint for themselves one head
  chosen_korean: 자기들을 위해 한 머리를 세우며
  alternatives_korean:
  - 자기들을 위해 한 지도자를 세우며
  - 자기들 위에 한 통치자를 두며
  lexicon: HALOT
  rationale: רֹאשׁ의 비유를 ‘머리’로 유지해 본문의 이미지를 보존하되, 한국어에서 자연스럽게 이해되도록 ‘세우다’를 사용했습니다.
- source_word: וְעָלוּ מִן הָאָרֶץ
  english_pob_choice: they will go up from the land
  chosen_korean: 땅에서 올라올 것입니다
  alternatives_korean:
  - 그 땅에서 올라갈 것입니다
  - 그 땅에서 올라와 나올 것입니다
  lexicon: HALOT
  rationale: עלה의 상승 이미지를 살려 직역에 가깝게 옮겼으며, ‘땅’은 אֶרֶץ의 넓은 의미를 열어 두기 위해 ‘the land’보다 덜 특정적인 표현으로 처리했습니다.
- source_word: יִזְרְעֶאל
  english_pob_choice: Jezreel
  chosen_korean: 이스르엘
  alternatives_korean:
  - 이즈르엘
  - 예스르엘
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역했고, 본문 의미를 훼손하지 않도록 보편적 표기보다 원음에 가깝게 유지했습니다.
theological_decisions:
- issue: ‘one head’의 의미를 특정 통치자나 메시아로 좁힐지 여부
  chosen_reading: 메시아적·정치적 신원을 본문에서 단정하지 않고 ‘한 머리’라는 비유를 그대로 보존했습니다.
  alternative_readings:
  - 한 왕
  - 한 지도자
  - 메시아적 통치자
  rationale: 히브리어는 통합된 지도성을 말하지만 이 절 자체에서 인물을 특정하지 않으므로, 해석을 앞서지 않고 본문의 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘땅에서 올라올 것’의 정확한 방향성과 의미
  chosen_reading: 포로 귀환, 회복된 땅으로의 상승, 또는 군사적 집결 가능성을 열어 둔 채 공간적 이미지를 유지했습니다.
  alternative_readings:
  - 포로에서 올라올 것
  - 회복된 땅으로 올라갈 것
  - 전투를 위해 올라갈 것
  rationale: 문맥상 회복의 뉘앙스는 분명하지만, 히브리어 표현 자체가 하나로 고정되지 않으므로 해석을 과도하게 구체화하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
