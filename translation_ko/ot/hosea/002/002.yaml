  source_fidelity: 원문의 연속된 미래 동작(모임, 한 지도자의 임명, 땅에서 올라감)과 ‘땅에서’의 공간적 모호성은 대체로 보존되어 있습니다. 다만 רֹאשׁ אֶחָד의 직역인 ‘한 머리’는 한국어에서 사람을 가리키는 비유로 자연스럽지 않아, 본문에서는 의미상 동등한 ‘한 지도자’로 옮기고 직역을 각주로 밝혀야 합니다. 또한 ‘올라올’은 화자 쪽으로 오는 방향을 덧붙이므로 원문의 방향을 열어 둔 ‘올라갈’이 더 적절합니다.
