source:
  edition: WLC
  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
  footnotes:
  - marker: a
    text: Or 'which they made for Baal.' The Hebrew is terse and may refer either to making an image of Baal from the silver and gold or to using those gifts in Baal worship more generally.
    reason: alternative_reading
  - marker: b
    text: '''Fresh oil'' refers to olive oil as an agricultural product; many translations simply read ''oil.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀는 내가 그녀에게 곡식과 새 포도주와 기름을 주고, 은과 금을 풍성히 주었음을 알지 못했습니다. 그들은 그것을 바알을 위하여 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 간결하게 ‘그들이 바알을 위하여 만들었다’라고 하며 목적어를 생략합니다. 은과 금으로 바알을 위한 물건이나 신상을 만들었다는 뜻으로, 또는 그것들을 바알 숭배에 사용했다는 더 넓은 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא
  english_pob_choice: But she
  chosen_korean: 그녀는
  alternatives_korean:
  - 그러나 그녀는
  - 그런데 그녀는
  lexicon: WLC
  rationale: 앞절과의 대조는 문맥이 충분히 드러내므로, 한국어에서는 과도한 접속사보다 주어를 먼저 두어 자연스럽게 이어가도록 했습니다.
- source_word: לֹא יָדְעָה
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 깨닫지 못했습니다
  - 인정하지 못했습니다
  lexicon: HALOT
  rationale: ידע의 기본 의미를 따라 직접적으로 옮기되, 문맥상 ‘알아차리지 못하고 인정하지도 않았다’는 뉘앙스를 한국어 독자가 읽어낼 수 있게 했습니다.
- source_word: הַדָּגָן וְהַתִּירוֹשׁ וְהַיִּצְהָר
  english_pob_choice: the grain, the new wine, and the oil
  chosen_korean: 곡식과 새 포도주와 기름
  alternatives_korean:
  - 곡식과 새 포도주와 새 기름
  - 곡식과 포도주와 기름
  lexicon: HALOT
  rationale: 농산물의 삼중 목록을 살리면서, תירוש는 ‘새 포도주’로, יִצְהָר는 기본 의미인 ‘기름’으로 옮겨 과도한 해석 없이 한국어 관용을 따랐습니다.
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ
  english_pob_choice: multiplied silver for her
  chosen_korean: 은을 크게 더해 주고
  alternatives_korean:
  - 은을 많이 더해 주고
  - 은을 증가시켜 주고
  - 은을 풍성하게 해 주고
  lexicon: HALOT
  rationale: 히필의 ‘많게 하다/증가시키다’를 반영하면서도, 한국어에서는 자원 제공의 풍성함을 자연스럽게 드러내기 위해 ‘크게 더해 주고’로 옮겼습니다.
- source_word: וְזָהָב עָשׂוּ לַבָּעַל
  english_pob_choice: gold, which they made into Baal
  chosen_korean: 금을 주신 것이 바로 나인 줄 알지 못했습니다. 그것으로 그들은 바알을 만들었습니다
  alternatives_korean:
  - 금을 주신 것이 바로 나인 줄 알지 못했습니다. 그것을 바알을 위해 썼습니다
  - 금을 주신 것이 바로 나인 줄 알지 못했습니다. 그것으로 바알 우상을 만들었습니다
  - 금을 주신 것이 바로 나인 줄 알지 못했습니다. 그것을 바알에게 바쳤습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 구조와 POB의 해석을 따라, 은과 금이 바알 숭배에 사용되었음을 드러내되 ‘바알을 만들었습니다’로 우상 제작의 직설성을 살렸습니다.
theological_decisions:
- issue: לַבָּעַל의 우상 숭배 지시
  chosen_reading: 고유명사 바알로 유지하고, 그 금과 은이 우상 제작에 쓰였다는 의미를 본문에 직접 드러냈습니다.
  alternative_readings:
  - ‘주인’처럼 일반 명사로 옮김
  - ‘바알에게 바쳤습니다’처럼 헌납 의미로만 처리
  rationale: 문맥상 여기의 בַּעַל은 가나안 신 바알을 가리키므로, 일반적 ‘주인’으로 완화하지 않고 우상숭배의 고발을 유지했습니다.
  doctrine_reference: 구약의 우상숭배 비판과 언약 배신의 맥락
