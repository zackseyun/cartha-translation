id: HOS.2.16
reference: Hosea 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
  footnotes:
  - marker: a
    text: Or 'speak tenderly to her.' Literally, 'speak to her heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 그를 꾀어 내어 광야로 데리고 가서 그의 마음에 말하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음에 다정히 말하겠습니다.’ 직역하면 ‘그의 마음에 말하겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 심판 문맥에서 전환되는 귀결을 나타내므로, 인과·전환을 분명히 드러내는 ‘그러므로’가 적절합니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 예언적 주의 환기 기능을 살리면서도 현대 한국어 독자에게 자연스러운 직설형 명령으로 처리했습니다.
- source_word: מְפַתֶּיהָ
  english_pob_choice: I am going to allure her
  chosen_korean: 내가 그를 꾀어 내어
  alternatives_korean:
  - 내가 그를 유혹하여
  - 내가 그를 설득하여
  - 내가 그를 구애하여
  lexicon: HALOT
  rationale: פתה의 관계 회복적·설득적 뉘앙스를 살리되, 부정적 ‘유혹’의 뉘앙스는 피하고, 회복을 향한 적극적 끌어들임을 드러내는 ‘꾀어 내다’를 택했습니다.
- source_word: וְהֹלַכְתִּיהָ
  english_pob_choice: I will lead her
  chosen_korean: 데리고 가서
  alternatives_korean:
  - 인도하여
  - 데려가서
  - 이끌어
  lexicon: HALOT
  rationale: הולך의 사역적 의미를 살리면서, 광야로 향하는 이동과 하나님의 주도성을 한국어 동사구로 자연스럽게 표현했습니다.
- source_word: עַל לִבָּהּ
  english_pob_choice: speak to her heart
  chosen_korean: 그의 마음에 말하겠습니다
  alternatives_korean:
  - 그의 마음에 다정히 말하겠습니다
  - 그에게 마음을 다해 말하겠습니다
  - 그의 심장에 말하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 드러내어 ‘마음에 말하다’로 옮겼습니다. 이는 위로·호소·설득의 폭을 유지하며 해석을 과도하게 좁히지 않습니다.
theological_decisions:
- issue: 하나님의 회복 행동을 나타내는 פתה의 의미 범위
  chosen_reading: ‘꾀어 내다’로 옮겨, 강압이 아니라 관계 회복을 위한 적극적 끌어당김을 드러냈습니다.
  alternative_readings:
  - 유혹하다
  - 설득하다
  - 구애하다
  rationale: 문맥상 죄를 부추기는 유혹이 아니라 징계 후 다시 언약 관계로 부르시는 행동이므로, 원문의 긴장과 따뜻함을 함께 보존해야 합니다.
  doctrine_reference: Translation philosophy §3, §6
