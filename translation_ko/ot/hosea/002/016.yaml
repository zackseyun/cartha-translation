  rationale: 여성 지시 대상에 맞게 대명사를 수정하고, 기만 또는 유인의 부가 뉘앙스를 피하도록 פתה를 ‘타일러’로 옮겼습니다. 히브리어 ‘마음에 말하다’의 비유를 보존하면서 현대 한국어에 자연스러운 ‘마음에 대고 말하다’를 사용했으며, 각주에서 해석적 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
