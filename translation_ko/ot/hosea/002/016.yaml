lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 심판 문맥에서 전환되는 귀결을 나타내므로, 인과·전환을 분명히 드러내는 ‘그러므로’가 적절합니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
