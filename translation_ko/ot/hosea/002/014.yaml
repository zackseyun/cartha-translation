  - 내 애인들
  - 내 연인들
  lexicon: HALOT
  rationale: 직역적인 ‘내 애인들’은 현대 한국어에서 지나치게 노골적이거나 경박하게 들릴 수 있어, 호세아서의 간음 은유를 유지하면서도 문체를 과도하게 흔들지 않는 표현을 선택했습니다.
theological_decisions:
- issue: אֶתְנָה의 성적·우상숭배적 은유를 본문에서 어느 정도 드러낼지
  chosen_reading: 본문에는 ‘삯’으로 두어 거래성을 살리고, 직접적인 설명은 하지 않았습니다.
  alternative_readings:
  - 더 노골적으로 ‘기생의 삯’으로 옮김
  - 중성적으로 ‘임금’으로 옮김
  rationale: 호세아서 전체 문맥이 이미 간음 은유를 제공하므로, 본절에서는 원문이 직접 말하는 경제적 보상 어휘를 유지하는 편이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-direct metaphor preservation.'
