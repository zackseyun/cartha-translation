base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
  footnotes:
  - marker: a
    text: Or 'hire'; the Hebrew term can carry the sense of a prostitute's wages in Hosea's infidelity metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그의 포도나무와 무화과나무를 황폐하게 하겠습니다. 그것들에 대해 그가 말하기를 ‘이것들은 내 사랑하는 자들이 내게 준 내 삯입니다’ 하였기 때문입니다. 내가 그것들을 숲으로 만들겠고, 들의 짐승들이 그것들을 먹어 치울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삯’은 일반적인 ‘보수’보다 더 거래적이고, 호세아서의 간음 비유 안에서는 성적 함의를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  english_pob_choice: I will lay waste
  chosen_korean: 황폐하게 하겠습니다
  alternatives_korean:
  - 초토화하겠습니다
  - 파괴하겠습니다
  - 폐허로 만들겠습니다
  lexicon: HALOT
  rationale: 하필 형태의 שׁמם은 단순 파괴보다 ‘황폐함/폐허 상태’로 만드는 뜻이 강하므로, 현대 한국어에서 자연스러우면서도 심판의 강도를 살리는 표현을 택했습니다.
- source_word: גַּפְנָהּ / וּתְאֵנָתָהּ
  english_pob_choice: her vine and her fig tree
  chosen_korean: 그의 포도나무와 무화과나무
  alternatives_korean:
  - 그의 포도덩굴과 무화과나무
  - 그의 포도나무와 무화과나무들
  lexicon: HALOT
  rationale: 히브리어의 단수 표지는 그대로 두되, 한국어에서는 자연스럽게 ‘포도나무’와 ‘무화과나무’로 옮겨 농경 이미지를 보존했습니다.
- source_word: אֶתְנָה
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 품삯
  - 보수
  - 임금
  lexicon: HALOT
  rationale: אֶתְנָה는 단순한 보수보다 거래·성적 은유가 섞인 ‘삯’의 뉘앙스를 담기에 적절하며, POB가 본문에 직접 풀지 않은 의미의 과잉 명시도 피할 수 있습니다.
- source_word: מְאַהֲבַי
  english_pob_choice: my lovers
  chosen_korean: 내 사랑하는 자들
  alternatives_korean:
  - 내 연인들
  - 내 애인들
  - 내 연인들
  lexicon: HALOT
  rationale: 직역적인 ‘내 애인들’은 현대 한국어에서 지나치게 노골적이거나 경박하게 들릴 수 있어, 호세아서의 간음 은유를 유지하면서도 문체를 과도하게 흔들지 않는 표현을 선택했습니다.
theological_decisions:
- issue: אֶתְנָה의 성적·우상숭배적 은유를 본문에서 어느 정도 드러낼지
  chosen_reading: 본문에는 ‘삯’으로 두어 거래성을 살리고, 직접적인 설명은 하지 않았습니다.
  alternative_readings:
  - 더 노골적으로 ‘기생의 삯’으로 옮김
  - 중성적으로 ‘임금’으로 옮김
  rationale: 호세아서 전체 문맥이 이미 간음 은유를 제공하므로, 본절에서는 원문이 직접 말하는 경제적 보상 어휘를 유지하는 편이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-direct metaphor preservation.'
