  source_fidelity: 수정이 필요합니다. 초안의 ‘하였기 때문입니다’는 히브리어 אֲשֶׁר אָמְרָה(‘그녀가 말한’)를 인과절로 바꾸어 원문에 없는 이유·근거의 의미를 더합니다. 또한 여성 단수 접미사와 동사에 맞추어 ‘그녀’로 일관되게 옮겨야 합니다.
  naturalness: ‘그녀가 그것들을 두고 말하기를’은 원문의 관계절을 자연스러운 현대 한국어로 재현합니다. ‘내 연인들’은 מְאַהֲבַי의 복수 ‘나의 연인들/정부들’이라는 비유적 표현을 자연스럽고 절제된 문체로 전달합니다.
  terminology: ‘황폐하게 하겠습니다’, ‘포도나무와 무화과나무’, ‘삯’, ‘연인들’, ‘들의 짐승들’은 원문의 농경·거래·간음 비유와 심판 어휘를 적절히 보존합니다. ‘삯’에 각주 표지를 직접 붙여 성적 함의 가능성을 해당 어휘에 연결했습니다.
