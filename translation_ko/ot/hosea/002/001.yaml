revisions:
- from: 그러나 이스라엘 자손의 수는 바닷가의 모래처럼 되어서 헤아리거나 셀 수 없을 것입니다. 그리고 그들에게 “너희는 내 백성이 아니다”라고 말하던 그곳에서, 그들에게 “살아 계신 하나님의 자손들”이라고 말할 것입니다.[a]
  to: 그러나 이스라엘 자손의 수는 바다의 모래처럼 되어, 헤아리거나 셀 수 없을 것입니다. 그들에게 “너희는 내 백성이 아니다”라고 일컬어지던 곳에서, 그들에게 “살아 계신 하나님의 아들들”이라고 일컬어질 것입니다.[a]
  rationale: 원문의 수동형 반복을 ‘일컬어지다’로 보존하고, ‘바다의 모래’로 원문의 비유를 더 가깝게 옮겼습니다. 후반의 ‘아들들’은 원문의 בני를 반영하되, 한국어에서 가능한 ‘자녀들’ 대안은 각주로 제시했습니다.
