  source_fidelity: 초두의 전환과 수의 무수함은 대체로 잘 옮겼습니다. 그러나 원문의 두 수동 동사 יֵאָמֵר를 초안의 ‘말하던/말할 것입니다’가 능동으로 처리하여, 발화 주체를 특정하지 않는 원문의 표현을 보존하지 못했습니다. 또한 ‘바닷가의 모래’보다 כְּחוֹל הַיָּם에 가까운 ‘바다의 모래’가 적절합니다.
  naturalness: 수정문은 현대 표준어 합쇼체 문장으로 자연스럽습니다. 인용문 안의 선언형 ‘아니다’는 인용된 선포 내용이므로 유지할 수 있으며, 본문 서술은 ‘-습니다/-것입니다’로 통일했습니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 한국어 성경 관용 표현으로 적절합니다. 후반의 בְּנֵי אֵל חָי는 원문의 남성 복수 표현을 반영하여 ‘살아 계신 하나님의 아들들’로 옮겼습니다. 각주에는 두 표현 모두의 히브리어가 문자적으로 ‘아들들’임과 ‘자녀들’이라는 가능한 대안을 밝혔습니다.
