reference: Hosea 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
  footnotes:
  - marker: a
    text: Or “children of Israel” and “children of the living God.” The Hebrew has “sons” in both phrases.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 자손의 수는 바다의 모래처럼 되어, 헤아리거나 셀 수 없을 것입니다. 그들에게 “너희는 내 백성이 아니다”라고 일컬어지던 곳에서, 그들에게 “살아 계신 하나님의 아들들”이라고 일컬어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘 자손’과 ‘살아 계신 하나님의 아들들’에 해당하는 두 표현 모두 문자적으로 ‘아들들’을 사용합니다. 두 표현은 ‘자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 בני를 살리면서도 한국어에서는 ‘자손’이 성별 표지를 과도하게 부각하지 않으면서 원문과 문맥의 집합적 의미를 자연스럽게 드러냅니다.
- source_word: כְּחוֹל הַיָּם
  english_pob_choice: like the sand of the sea
  chosen_korean: 바닷가의 모래처럼
  alternatives_korean:
  - 바다의 모래처럼
  - 바닷모래처럼
  lexicon: HALOT
  rationale: 고정 관용구의 비유를 유지하되 한국어로는 ‘바닷가의 모래처럼’이 가장 자연스럽고 널리 통용되는 수량 불가능성의 표현입니다.
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  english_pob_choice: which cannot be measured or counted
  chosen_korean: 헤아리거나 셀 수 없을 것입니다
  alternatives_korean:
  - 측량할 수도 없고 셀 수도 없습니다
  - 헤아릴 수도 없고 셀 수도 없습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 한국어 관용으로 옮기되, ‘헤아리다/세다’로 실제 불가능성을 분명히 하여 원문의 강조를 보존합니다.
- source_word: לֹא עַמִּי אַתֶּם
  english_pob_choice: You are not my people
  chosen_korean: 너희는 내 백성이 아니다
  alternatives_korean:
  - 너희는 내 백성이 아닙니다
  - 너희는 내 백성이 아니라고
  lexicon: HALOT
  rationale: 언약 소속의 부정이라는 원문의 공식을 직역에 가깝게 살리되, 한국어에서도 선포문처럼 또렷하게 들리도록 했습니다.
- source_word: בְּנֵי אֵל חָי
  english_pob_choice: Sons of the living God
  chosen_korean: 살아 계신 하나님의 자손들
  alternatives_korean:
  - 살아 계신 하나님의 아들들
  - 살아 계신 하나님의 자녀들
  lexicon: HALOT
  rationale: POB의 남성 복수 표지를 한국어 ‘자손들’로 옮겨 원문 대응을 유지하면서도, 한국어 독자에게는 성별 한정으로 과도하게 읽히지 않도록 했습니다.
theological_decisions:
- issue: 초두 접속사 וְהָיָה의 반전 효과
  chosen_reading: “그러나”로 시작해 심판 선언에서 회복 선언으로의 전환을 드러냈습니다.
  alternative_readings:
  - 그리고
  - 또는
  rationale: 문맥상 앞선 ‘내 백성이 아니다’라는 선언에서 풍성한 회복 약속으로 급격히 전환되므로, 단순한 나열보다 대조를 드러내는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, optimal equivalence
- issue: ‘내 백성’과 ‘하나님의 자손들’의 언약적 역전
  chosen_reading: ‘내 백성이 아니다’와 ‘살아 계신 하나님의 자손들’의 대비를 그대로 보존했습니다.
  alternative_readings:
  - 내 백성이 아니며
  - 하나님의 자녀들
  rationale: 본문의 핵심은 신분 역전과 언약 회복이므로, 이를 희석하는 완곡어보다 원문의 선포성과 평행 구조를 유지하는 것이 적절합니다.
  doctrine_reference: 호세아 2:1의 회복-언약 주제
