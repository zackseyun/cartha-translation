  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה תִּקְרְאִ֖י אִישִׁ֑/י וְ/לֹֽא תִקְרְאִי לִ֥/י ע֖וֹד בַּעְלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
  footnotes:
  - marker: a
    text: Hebrew baʿli can mean 'my master,' 'my lord,' or even 'my husband'; here it is rendered 'My Baal' to preserve the wordplay and likely allusion to Baal worship in Hosea’s context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에[a] — 야훼의 말씀입니다 — 너는 나를 ‘내 남편’이라 부르고, 다시는 나를 ‘내 바알’이라 부르지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 바알리(baʿli)는 ‘내 주인’, ‘내 주님’, 또는 ‘내 남편’을 뜻할 수도 있습니다. 여기서는 호세아서 문맥의 말장난과 바알 숭배의 연상을 살리기 위해 ‘내 바알’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 때에
  lexicon: HALOT
  rationale: 예언서의 표준 시점 표현으로, 미래의 언약적 전환을 자연스럽게 살리는 한국어 관용을 따랐습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 무게를 살리면서도, 하나님의 고유명 יְהוָה를 '야훼'로 직접 옮겼습니다.
- source_word: אִישִׁי
  english_pob_choice: My husband
  chosen_korean: 내 남편
  alternatives_korean:
  - 나의 남편
  - 내 남자
  lexicon: HALOT
  rationale: 혼인 관계의 친밀함을 드러내는 문맥이므로 '남편'이 가장 분명하며, 1인칭 소유를 유지해 관계 회복의 뉘앙스를 살렸습니다.
- source_word: בַּעְלִי
  english_pob_choice: My Baal
  chosen_korean: 내 바알
  alternatives_korean:
  - 내 주인
  - 내 주님
  - 내 남편
  lexicon: HALOT
  rationale: בעל의 일반적 의미를 풀기보다, 호세아서의 바알 숭배 연상을 보존하기 위해 음역형 '바알'을 유지했습니다. 앞의 '내 남편'과의 대조가 핵심입니다.
theological_decisions:
- issue: בַּעְלִי를 일반적 친밀 표현으로 완화할지, 바알 숭배를 암시하는 말장난을 보존할지
  chosen_reading: '''내 바알''로 직역해 우상숭배적 호칭의 긴장을 보존했습니다.'
  alternative_readings:
  - 내 주인
  - 내 남편
  - 내 주님
  rationale: 본문은 언약적 혼인 언어와 바알 연상을 의도적으로 충돌시켜, 하나님과 이스라엘의 관계 회복과 우상 숭배의 단절을 함께 드러냅니다. 이를 완화하면 호세아서의 신학적 긴장이 사라집니다.
  doctrine_reference: 문서화된 의미 긴장 보존; 우상숭배/언약 관계 대비
