source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
  footnotes:
  - marker: a
    text: Jezreel sounds like 'God sows' and functions symbolically in Hosea as well as as a place/name.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅은 곡식과 새 포도주와 기름에 응답할 것이며, 그들은 이스르엘에 응답할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이스르엘은 ‘하나님이 씨를 뿌리신다’는 뜻을 떠올리게 하며, 호세아서에서 지명인 동시에 상징적으로도 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  english_pob_choice: and the earth
  chosen_korean: 땅은
  alternatives_korean:
  - 땅
  - 땅과
  - 온 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘지면/온 땅’으로 옮길 수 있는데, 이 시적 연쇄에서는 자연의 생산이 응답하는 이미지가 핵심이므로 한국어에서는 가장 자연스러운 ‘땅’을 택했습니다.
- source_word: תַּעֲנֶה / יַעֲנוּ
  english_pob_choice: will answer
  chosen_korean: 응답할 것이며
  alternatives_korean:
  - 대답할 것이며
  - 응할 것이며
  - 대답하듯 할 것이며
  lexicon: HALOT
  rationale: ענה의 반복은 단순 공급보다 ‘응답’의 상호성에 초점이 있으므로, 영어 POB의 ‘answer’를 살려 같은 동사를 반복했습니다.
- source_word: הַדָּגָן
  english_pob_choice: the grain
  chosen_korean: 곡식
  alternatives_korean:
  - 곡물
  - 알곡
  - 곡식들
  lexicon: HALOT
  rationale: דָּגָן은 일반적인 곡식/곡물 생산물을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘곡식’으로 옮겼습니다.
- source_word: הַתִּירוֹשׁ וְאֶת הַיִּצְהָר
  english_pob_choice: the new wine, and the oil
  chosen_korean: 새 포도주와 기름
  alternatives_korean:
  - 새 포도주와 새 기름
  - 새 포도주와 올리브 기름
  - 포도주와 기름
  lexicon: HALOT
  rationale: תִּירוֹשׁ은 새 포도주, יִצְהָר은 일반적으로 올리브 기름을 가리키지만 여기서는 농산물 삼중구조를 살려 ‘기름’으로 처리했습니다.
- source_word: יִזְרְעֶאל
  english_pob_choice: Jezreel
  chosen_korean: 이스르엘
  alternatives_korean:
  - 예스르엘
  - 이스르엘
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했으며, 본문에서는 이름 자체를 보존했습니다.
theological_decisions:
- issue: 시적 인격화된 ‘응답’의 유지 여부
  chosen_reading: 생산물이 단순히 ‘공급한다’가 아니라 서로에게 ‘응답한다’는 구조를 유지했습니다.
  alternative_readings:
  - 땅은 곡식과 새 포도주와 기름을 낼 것이며, 그것들은 이스르엘을 위해 공급할 것입니다.
  rationale: 문맥은 하늘-땅-소출-이스르엘로 이어지는 회복의 연쇄를 그리므로, 상호 응답의 표현을 유지해야 본문의 수사와 신학적 이미지를 보존할 수 있습니다.
  doctrine_reference: 'Translation philosophy #3 and #5'
- issue: 이스르엘의 상징적 의미를 본문에 풀어쓸지 여부
  chosen_reading: 본문에는 고유명사만 두고, 상징적 의미는 본문 밖으로 넘겼습니다.
  alternative_readings:
  - 하나님이 씨를 뿌리신다
  - 하나님이 심으신다
  rationale: 호세아는 이름의 의미를 활용하지만, 번역 본문에서 의미를 치환하면 이름-말놀이가 사라지므로 본문은 음역을 유지하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #2'
