  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
  footnotes:
  - marker: a
    text: Or 'lest I strip her naked.' The Hebrew particle can be rendered more formally as 'lest,' introducing the threatened consequence.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''kill her with thirst.'' The Hebrew is more literally causative: ''cause her to die by thirst.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면[a] 내가 그녀를 벌거벗기고, 그녀가 태어난 날처럼 드러내 보이겠습니다. 또 그녀를 광야처럼 만들고, 메마른 땅처럼 만들며, 갈증으로 죽게 하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그녀를 벌거벗길까 하여.’ 히브리어 입자는 더 형식적으로는 ‘~하지 않으면’ 또는 ‘~할까 하여’로 옮길 수 있으며, 앞선 경고에 따르는 위협의 결과를 이끕니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈증으로 죽이겠습니다.’ 히브리어는 더 직역하면 ‘갈증으로 죽게 하다’라는 사역적 표현입니다.
    reason: lexical_alternative
