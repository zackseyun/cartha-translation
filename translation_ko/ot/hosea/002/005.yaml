  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하고, 심판 선언의 병렬 구조를 명료하게 드러냅니다. ‘그 여자’ 대신 문맥상 여성 의인화 대상을 가리키는 ‘그녀’를 사용해 불필요하게 낮춰 들릴 수 있는 뉘앙스를 피했습니다.
