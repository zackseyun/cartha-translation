base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
  footnotes:
  - marker: a
    text: Or 'lest I strip her naked.' The Hebrew particle can be rendered more formally as 'lest,' introducing the threatened consequence.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''kill her with thirst.'' The Hebrew is more literally causative: ''cause her to die by thirst.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면 내가 그 여자의 옷을 벗기고, 그녀가 태어난 날처럼 그녀를 드러내며[a], 그녀를 광야처럼, 메마른 땅처럼 만들고[b], 목말라 죽게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌거벗기고.’ 히브리어 입자는 더 형식적으로는 ‘~하지 않으면’/‘~할까 하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈증으로 죽게 하겠습니다.’ 히브리어는 더 직접적으로는 ‘목마름으로 죽게 하다’라는 사역적 표현입니다.
    reason: lexical_alternative
