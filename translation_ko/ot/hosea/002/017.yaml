language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֨תִּי לָ֤/הּ אֶת כְּרָמֶ֨י/הָ֙ מִ/שָּׁ֔ם וְ/אֶת עֵ֥מֶק עָכ֖וֹר לְ/פֶ֣תַח תִּקְוָ֑ה וְ/עָ֤נְתָה שָּׁ֨מָּ/ה֙ כִּ/ימֵ֣י נְעוּרֶ֔י/הָ וִּ/כְ/י֖וֹם עֲלֹתָ֥/הּ מֵ/אֶֽרֶץ מִצְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'she will sing there'; the Hebrew verb can denote a responsive answer and, in context, may imply singing.
    reason: lexical_alternative
  - marker: b
    text: The Valley of Achor recalls the place associated with Achan's judgment (Josh 7:24-26), turning a place of trouble into a doorway of hope.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 거기서 나는 그녀에게 포도원들을 주고, 아골 골짜기를 희망의 문으로 주겠습니다.[b] 그곳에서 그녀는 젊은 날처럼, 이집트 땅에서 올라온 날처럼 응답할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에서 그녀가 노래할 것입니다’로도 옮길 수 있습니다. 히브리어 동사는 응답을 뜻할 수 있으며, 문맥상 노래의 뉘앙스를 띨 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아골 골짜기는 여호수아 7:24-26에서 아간의 심판과 연결된 장소를 떠올리게 하며, ‘환난의 자리’를 ‘희망의 문’으로 바꾸는 역전을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: I will give
  chosen_korean: 나는 … 주겠습니다
  alternatives_korean:
  - 나는 … 줄 것입니다
  - 나는 … 주겠습니다
  lexicon: HALOT
  rationale: 예언적 약속의 미래형으로 이해하여 ‘주겠습니다’로 옮기고, 단순한 소유 이전의 은혜로운 부여라는 뉘앙스를 살렸습니다.
- source_word: כְּרָמֶיהָ
  english_pob_choice: her vineyards
  chosen_korean: 그녀의 포도원들을
  alternatives_korean:
  - 그녀의 포도원
  - 그녀의 포도나무들
  lexicon: HALOT
  rationale: כֶּרֶם은 개별 포도나무보다 포도원을 가리키는 것이 보통이므로 복수형을 살려 ‘포도원들’로 옮겼습니다.
- source_word: עֵמֶק עָכוֹר
  english_pob_choice: the Valley of Achor
  chosen_korean: 아골 골짜기
  alternatives_korean:
  - 아코르 골짜기
  - 아골 계곡
  lexicon: HALOT
  rationale: 지명은 통용되는 성경식 표기를 따르되, 여호수아 7장의 연상을 살리기 위해 음역형을 유지했습니다.
- source_word: לְפֶתַח תִּקְוָה
  english_pob_choice: a door of hope
  chosen_korean: 희망의 문으로
  alternatives_korean:
  - 희망의 문으로
  - 희망의 문이 되게
  lexicon: HALOT
  rationale: פֶּתַח의 기본 의미인 ‘열린 문/문’에 맞추되, ל를 결과·기능의 ‘-로’로 옮겨 ‘희망의 문’이라는 비유를 자연스럽게 전달했습니다.
- source_word: וְעָנְתָה
  english_pob_choice: she will answer
  chosen_korean: 응답할 것입니다
  alternatives_korean:
  - 대답할 것입니다
  - 노래로 응답할 것입니다
  lexicon: HALOT
  rationale: 기본 의미인 ‘대답하다/응답하다’를 유지해, 본문이 열어 두는 노래의 가능성을 지나치게 구체화하지 않았습니다.
theological_decisions:
- issue: וְעָנְתָה의 의미 범위
  chosen_reading: 본문은 ‘응답할 것입니다’로 두어, 회복의 기쁨이 노래일 수 있다는 여지는 남기되 노래를 본문에 확정하지 않았습니다.
  alternative_readings:
  - 노래할 것입니다
  - 노래로 응답할 것입니다
  rationale: 히브리어 동사의 핵심 의미는 응답/대답이므로, 메시아적·전례적 이미지를 앞서 주입하기보다 본문이 가진 긴장을 보존하는 편이 더 적절합니다.
  doctrine_reference: '번역 원칙 §3: 문맥이 허용하는 다의성을 불필요하게 해소하지 말 것'
