revisions:
- from: 그리고 거기서 나는 그녀에게 그녀의 포도원들을 주고, 아골 골짜기를 희망의 문으로 삼겠습니다. 그곳에서 그녀는 자기 젊은 날들과 같이, 곧 이집트 땅에서 올라오던 날과 같이 응답할 것입니다.[a][b]
  to: 그리고 거기서 나는 그녀에게 포도원들을 주고, 아골 골짜기를 희망의 문으로 주겠습니다.[b] 그곳에서 그녀는 젊은 날처럼, 이집트 땅에서 올라온 날처럼 응답할 것입니다.[a]
  rationale: 원문의 동사 의미와 출애굽 회상의 완료성을 더 정확히 반영하고, 현대 한국어의 자연스러움을 높였습니다. 또한 각주 표지를 해당 어휘와 직접 연결했습니다. 본문의 ‘응답하다’는 유지하여 ‘노래하다’라는 해석적 가능성을 본문에 확정하지 않았습니다.
