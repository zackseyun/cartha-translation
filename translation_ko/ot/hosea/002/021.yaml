  naturalness: 초안은 대체로 자연스럽지만, 지정된 합쇼체와 달리 ‘하겠다’ 평서형을 사용합니다. ‘약혼시키겠습니다’는 다소 문어적이지만, 화자가 상대를 자신에게 정혼하게 한다는 히브리어의 구체적 혼인 비유와 방향성을 보존하는 안전한 표현입니다.
  terminology: ‘의’, ‘정의’, ‘한결같은 사랑’, ‘긍휼’은 적절합니다. 특히 חֶסֶד를 ‘한결같은 사랑’으로 옮긴 것은 현대어로 충성스럽고 지속적인 사랑의 의미를 잘 전달합니다. 각 명사 앞의 반복된 ‘~로’도 히브리어의 전치사 반복을 잘 반영합니다.
