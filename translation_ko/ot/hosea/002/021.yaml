  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
  footnotes:
  - marker: a
    text: Or 'steadfast love.' The Hebrew חֶסֶד denotes loyal, covenantal love and mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 영원히 내게 약혼시키겠습니다. 내가 의와 정의와 한결같은 사랑과 긍휼로 너를 내게 약혼시키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한결같은 사랑’으로 옮긴 히브리어 חֶסֶד는 충성스럽고 언약적인 사랑과 자비를 함께 가리킵니다.
    reason: lexical_explanation
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  english_pob_choice: I will betroth you
  chosen_korean: 약혼하겠다
  alternatives_korean:
  - 정혼하겠다
  - 신부로 맞이하겠다
  lexicon: HALOT
  rationale: 히브리어 ארשׂ는 결혼 자체보다 ‘약혼/정혼’의 예비적 혼인 관계를 가리키므로, 언약적 혼인 이미지를 살리되 의미를 과장하지 않도록 ‘약혼하겠다’로 옮겼습니다.
- source_word: לִי
  english_pob_choice: to myself
  chosen_korean: 너와
  alternatives_korean:
  - 내게
  - 나에게
  lexicon: HALOT
  rationale: 문맥상 하나님이 신부를 자기에게로 취하시는 관계를 나타내므로, 한국어에서는 서술이 자연스럽도록 동사와 함께 처리하되 ‘내가 너와 … 약혼하겠다’로 개인적 언약 관계를 드러냈습니다.
- source_word: בְּחֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인애
  - 언약 사랑
  - 신실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 충성과 자비를 함께 지니므로, 전통 용어를 기계적으로 고정하기보다 현대 한국어에서 그 지속성과 언약성을 드러내는 ‘한결같은 사랑’으로 옮겼습니다.
- source_word: וּבְרַחֲמִים
  english_pob_choice: and in compassion
  chosen_korean: 긍휼로
  alternatives_korean:
  - 동정으로
  - 자비로
  - 불쌍히 여김으로
  lexicon: HALOT
  rationale: רַחֲמִים은 자애로운 불쌍히 여김과 깊은 연민을 뜻하므로, 한국어 성경 어휘로 널리 통용되는 ‘긍휼’이 간결하면서도 정서를 보존합니다.
theological_decisions:
- issue: 신적 화자의 혼인-언약 비유 보존
  chosen_reading: ‘약혼하겠다’를 유지해 결혼으로 단순화하지 않고, 반복되는 언약적 관계의 예비성과 충성을 살렸습니다.
  alternative_readings:
  - 결혼하겠다
  - 내 신부로 삼겠다
  - 내가 너를 내 것으로 삼겠다
  rationale: 호세아의 핵심 이미지는 회복의 언약을 혼인 은유로 선포하는 데 있으므로, 비유를 평탄화하지 않고 원문의 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
