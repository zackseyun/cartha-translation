reference: Hosea 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
  footnotes:
  - marker: a
    text: Or 'snatch away' for 'take away' (וְהִצַּלְתִּי), emphasizing sudden removal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'her nakedness'; the term can also carry the sense of shame through exposure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 돌아와 제때에 내 곡식을 되찾고, 정한 때에 내 새 포도주를 되찾으며, 그녀의 벌거벗음을 가리기 위한 내 양털과 내 아마를 빼앗아 가겠습니다.[a] 그녀의 벌거벗음[b]을 가릴 것을 빼앗아 가겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빼앗아 가다’로 옮긴 히브리어는 문맥상 갑작스럽게 거두어 제거하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그녀의 벌거벗음’입니다. 노출에서 비롯되는 수치의 함의도 있을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן / אָשׁוּב
  english_pob_choice: Therefore / I will return
  chosen_korean: 그러므로 내가 돌아와서
  alternatives_korean:
  - 그러므로 내가 돌아가서
  - 그래서 내가 돌아와
  lexicon: HALOT
  rationale: לָכֵן의 인과를 ‘그러므로’로 분명히 살리고, אָשׁוּב는 반복적 심판 행위를 시작하는 ‘돌아와서’로 자연스럽게 옮겼습니다.
- source_word: וְלָקַחְתִּי דְגָנִי / וְתִירוֹשִׁי
  english_pob_choice: and take back my grain / and my new wine
  chosen_korean: 내 곡식을 그 때에 거두어 가고, 내 새 포도주를 그 시기에 거두어 가며
  alternatives_korean:
  - 내 곡식을 제때에 가져가고, 내 새 포도주를 그 시기에 가져가며
  - 내 곡식을 때맞춰 거두고, 내 새 포도주를 시기에 거두어 가며
  lexicon: HALOT
  rationale: לקח은 단순 ‘가지다’보다 소유를 되찾는 역전의 뉘앙스가 있어 ‘거두어 가다’로 옮겼고, דגן·תירוש는 각각 ‘곡식’, ‘새 포도주’로 농경적 감각을 살렸습니다.
- source_word: וְהִצַּלְתִּי צַמְרִי וּפִשְׁתִּי
  english_pob_choice: and I will take away my wool and my flax
  chosen_korean: 내 양털과 내 삼베를 빼앗아 가겠습니다
  alternatives_korean:
  - 내 양털과 내 아마를 빼앗아 가겠습니다
  - 내 양털과 내 삼을 거두어 가겠습니다
  lexicon: HALOT
  rationale: הִצִּיל은 ‘빼앗아 빼내다/건져내다’의 강한 제거 뉘앙스가 있어 ‘빼앗아 가다’로 옮겼고, פשתה는 원재료인 ‘삼베’보다는 ‘아마’가 더 직역이지만 문맥상 옷감/소재를 자연스럽게 드러내는 표현으로 처리했습니다.
- source_word: לְכַסּוֹת אֶת עֶרְוָתָהּ
  english_pob_choice: which were to cover her nakedness
  chosen_korean: 그녀의 벌거벗은 몸을 가리려고
  alternatives_korean:
  - 그녀의 벌거벗음을 가리려고
  - 그녀의 수치를 가리려고
  lexicon: HALOT
  rationale: עֶרְוָה의 구체적 이미지를 보존하기 위해 ‘수치’로 완화하지 않고 ‘벌거벗은 몸’으로 옮겼으며, 목적 부정사구는 ‘가리려고’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 말하는 주체인 야훼의 소유권 회복을 한국어에서 얼마나 분명히 드러낼지
  chosen_reading: ‘내 곡식 / 내 새 포도주 / 내 양털 / 내 삼베’의 반복으로 소유권 회복과 심판적 회수를 분명히 드러냈습니다.
  alternative_readings:
  - 소유격을 완화해 자연스러운 한국어로만 처리하기
  - 반복을 줄여 문장을 매끈하게 만들기
  rationale: 본문은 이스라엘이 자기 것으로 여긴 생산물이 사실 야훼의 선물이었음을 드러내므로, 소유격 반복을 유지하는 것이 예언적 반전을 더 충실히 전달합니다.
  doctrine_reference: Hosea 2장 문맥의 언약적 심판과 회수의 표현
- issue: עֶרְוָה를 ‘수치’로 완화할지, ‘벌거벗은 몸’의 직설성을 유지할지
  chosen_reading: 직설적인 신체 이미지인 ‘벌거벗은 몸’을 유지했습니다.
  alternative_readings:
  - 그녀의 수치
  - 그녀의 부끄러운 상태
  rationale: 호세아의 비유는 도덕적 추상어보다 노출된 몸의 이미지를 통해 관계 파괴와 수치를 강하게 전달하므로, 본문의 수사적 긴장을 보존했습니다.
  doctrine_reference: 예언서의 상징 언어와 심판 이미지
