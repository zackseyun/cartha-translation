source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
  footnotes:
  - marker: a
    text: Or 'has played the whore'; the Hebrew uses explicit sexual imagery for covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'has done shamefully' or possibly 'has put them to shame.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'she who conceived them,' echoing 'their mother' in poetic parallelism.
    reason: lexical_alternative
  - marker: d
    text: Or 'my drinks' / 'my drink-supply.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 어머니가 음행하였고[a], 그들을 잉태한 이가 수치스럽게 행하였기[b][c] 때문입니다. 그녀가 말하였습니다. “나는 내 정부들을 따라가겠습니다. 그들은 내 빵과 내 물, 내 양모와 내 아마, 내 기름과 내 마실 것을 주는 이들입니다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘창녀 짓을 하였다’. 히브리어는 언약 불성실을 드러내는 노골적인 성적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수치를 끼쳤다’ 또는 ‘부끄러운 일을 하였다’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들을 잉태한 이’로, 앞의 ‘그들의 어머니’와 시적 평행을 이룹니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내 마실 것들’ 또는 ‘내 마실 것의 공급’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  english_pob_choice: has prostituted herself
  chosen_korean: 음행하였기
  alternatives_korean:
