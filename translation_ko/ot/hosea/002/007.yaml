  source_fidelity: 수정이 필요합니다. הֹבִישָׁה는 이 문맥에서 어머니의 행위를 가리켜 ‘수치스럽게 행하였다/부끄러운 일을 하였다’로 옮기는 것이 적절합니다. 초안의 ‘수치를 당하였기’는 수치를 입은 상태로 뜻을 바꾸었습니다. 또한 שִׁקּוּיָי의 ‘마실 것’에 대응하는 대안 각주 표지가 빠져 있습니다.
  naturalness: ‘내 밀애자들’은 현대 표준어에서 다소 부자연스럽고 은밀한 연애의 뉘앙스가 앞섭니다. 문맥의 불륜적 관계를 자연스럽게 드러내는 ‘내 정부들’을 사용하고, 인과 절의 반복을 현대 합쇼체 문장으로 다듬었습니다.
  terminology: ‘음행하다’는 זָנְתָה의 성적 비유를 보존합니다. ‘정부들’은 מְאַהֲבַי의 불법적 연인이라는 문맥적 힘을 유지합니다. ‘양모’와 ‘아마’는 원자재를 가리키는 원문의 의미에 부합합니다.
  issues:
  - severity: high
    issue: הֹבִישָׁה를 ‘수치를 당하였기’로 번역함
    rationale: 원문과 영어 감사 번역이 지지하는 뜻은 주어가 수치스럽게 행동했다는 것입니다. ‘수치를 당하다’는 수동적 피해 의미를 부여하여 의미를 바꿉니다.
  - severity: medium
