  - 간음하였기
  - 부정하였기
  lexicon: HALOT
  rationale: 예언서의 성적 비유와 언약 불성실의 강도를 살리되, 현대 한국어 문장에서는 직접적이면서도 문맥상 자연스러운 ‘음행하다’를 택했습니다.
- source_word: הֹבִישָׁה
  english_pob_choice: has acted shamefully
  chosen_korean: 수치를 당하였기
  alternatives_korean:
  - 수치스럽게 행하였기
  - 부끄럽게 하였기
  - 수치를 끼쳤기
  lexicon: HALOT
  rationale: 히필의 ‘수치를 겪게/당하게 하다’와 ‘수치스럽게 행하다’의 긴장을 보존하면서, 주어인 ‘잉태한 이’의 상태를 한국어로 자연스럽게 옮겼습니다.
- source_word: הוֹרָתָם
  english_pob_choice: she who conceived them
  chosen_korean: 그들을 잉태한 이
  alternatives_korean:
  - 그들을 밴 이
  - 그들의 어머니
  - 그들을 임신한 이
  lexicon: HALOT
  rationale: 직역보다 분사적/관계절적 기능을 드러내어 앞의 ‘어머니’와의 시적 병행을 살렸습니다.
- source_word: מְאַהֲבַי
  english_pob_choice: my lovers
  chosen_korean: 내 밀애자들
  alternatives_korean:
  - 내 애인들
  - 내 연인들
  - 나를 사랑하는 이들
  lexicon: HALOT
  rationale: 호세아서의 우상숭배적·불법적 관계를 반영하여, 단순한 애정 표현보다 성적/언약적 불륜의 뉘앙스를 지닌 표현을 선택했습니다.
- source_word: צַמְרִי וּפִשְׁתִּי
  english_pob_choice: my wool and my flax
  chosen_korean: 내 양모와 내 아마
  alternatives_korean:
  - 내 양털과 내 삼베
  - 내 양모와 내 삼
  - 내 양털과 내 아마
  lexicon: HALOT
  rationale: פשתה는 ‘아마/아마섬유’가 원뜻이므로, 해석을 덧붙인 ‘삼베’보다 원자재를 직접 가리키는 ‘아마’를 유지했습니다.
theological_decisions:
- issue: 예언적 결혼-음행 비유의 강도 유지
  chosen_reading: ‘음행하였기’와 ‘내 밀애자들’로 성적 비유를 직접 살렸습니다.
  alternative_readings:
  - ‘부정하였기’와 ‘내가 사랑하는 이들’로 완화
  - ‘간음하였기’로 윤리적 죄목에 초점
  rationale: 호세아는 이스라엘의 언약 배반을 결혼/성적 비유로 고발하므로, 비유를 완화하지 않고 원문의 충격과 신학적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
