  revised_text: 내가 그를 나를 위하여 그 땅에 뿌리고[a], 《긍휼을 받지 못한 이》에게 긍휼을 베풀며, 《내 백성이 아닌 자》에게 ‘너는 내 백성이다’라고 말하겠습니다. 그러면 그는 ‘나의 하나님’이라고 말할 것입니다[b].
