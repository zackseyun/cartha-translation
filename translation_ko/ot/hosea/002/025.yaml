source:
  edition: WLC
  text: וּ/זְרַעְתִּ֤י/הָ לִּ/י֙ בָּ/אָ֔רֶץ וְ/רִֽחַמְתִּ֖י אֶת לֹ֣א רֻחָ֑מָה וְ/אָמַרְתִּ֤י לְ/לֹֽא עַמִּי֙ עַמִּ/י אַ֔תָּה וְ/ה֖וּא יֹאמַ֥ר אֱלֹהָֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
  footnotes:
  - marker: a
    text: Hebrew names traditionally transliterated Lo-ruhamah and Lo-ammi; here translated 'No Mercy' and 'Not My People' to preserve the wordplay of judgment reversed into restoration.
    reason: alternative_reading
  - marker: b
    text: Or 'in the earth.' The Hebrew can mean either 'land' or 'earth'; 'land' fits Hosea's covenant-restoration context more specifically.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'and he will say.' The singular masculine likely personifies the restored people as a single respondent.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 땅에 그녀를 나 자신을 위하여 심을 것이며[a], 내가 「No Mercy」에게 자비를 베풀 것이며, 내가 「Not My People」에게 말하기를 「너는 내 백성이다」 하겠고, 그는 「나의 하나님」이라 말할 것입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’이 될 수 있으나, 호세아의 언약적 회복 문맥에서는 ‘그 땅’이 더 구체적입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그가 말하리라’의 남성 단수형을 따랐습니다. 회복된 백성을 하나의 응답자로 의인화한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 상징적 이름을 한국어로 풀지 않고 영어 표지를 유지하여, 본문의 이름 반전과 회복의 수사학을 드러냈습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  english_pob_choice: I will sow her
  chosen_korean: 내가 그 땅에 그녀를 나 자신을 위하여 심을 것이며
  alternatives_korean:
  - 내가 그녀를 심을 것이며
  - 내가 그녀를 뿌릴 것이며
  lexicon: HALOT
  rationale: זרע의 농경적 의미를 살리되, 호세아의 회복-반전 문맥에서 ‘심다’가 영어 POB의 ‘sow’와 가장 가깝습니다. 대상을 ‘그녀’로 유지해 원문의 3인칭 여성형을 반영했습니다.
- source_word: לִּי
  english_pob_choice: for myself
  chosen_korean: 나 자신을 위하여
  alternatives_korean:
  - 나를 위해
  - 내게
  lexicon: HALOT
  rationale: 단순한 수혜보다 여호와의 주권적 회복 행위를 드러내기 위해 목적/소유 뉘앙스를 살려 옮겼습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 땅에
  - 세상에
  lexicon: HALOT
  rationale: 호세아서의 언약적·토지적 맥락에서는 ‘땅’보다 ‘그 땅’이 더 자연스럽고, promised land의 특정성을 유지합니다.
- source_word: וְרִחַמְתִּי
  english_pob_choice: I will have mercy on / I will show mercy
  chosen_korean: 자비를 베풀 것이며
  alternatives_korean:
  - 긍휼을 베풀 것이며
  - 불쌍히 여길 것이며
  lexicon: HALOT
  rationale: רחם의 핵심은 연민/자비의 회복이므로, 한국어에서는 공적이고 현대적인 ‘자비를 베풀다’가 가장 분명합니다. 이름 ‘No Mercy’의 역전을 보존합니다.
- source_word: לֹא רֻחָמָה
  english_pob_choice: No Mercy
  chosen_korean: 「No Mercy」
  alternatives_korean:
  - 「자비 없음」
  - 「불쌍히 여김을 받지 못한 자」
  - 「로루하마」
  lexicon: HALOT
  rationale: 호세아의 상징적 이름을 번역하지 않고 영어 POB의 표지를 그대로 유지해, 본문의 반전 구조를 한국어 독자에게도 즉시 드러나게 했습니다.
theological_decisions:
- issue: 상징적 자녀 이름을 한국어로 번역하지 않고 영어 표지를 유지할지 여부
  chosen_reading: 본문에서는 영어 표지 「No Mercy」와 「Not My People」을 유지했습니다.
  alternative_readings:
  - 「자비 없음」과 「내 백성이 아님」
  - 로루하마와 로암미
  rationale: 이 절의 신학적 핵심은 심판 이름이 회복 이름으로 뒤집히는 데 있으므로, 번역어를 덧씌워 의미를 고정하기보다 원어-의미 긴장을 눈에 보이게 남기는 편이 POB의 주석적 투명성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
- issue: 히브리어 3인칭 단수 ‘he will say’의 인칭 유지
  chosen_reading: ‘그는’이라고 유지했습니다.
  alternative_readings:
  - ‘그들이’
  - ‘그것이’
  rationale: 히브리어의 남성 단수형을 그대로 반영하여, 회복된 백성이 집합적으로 한 사람처럼 응답하는 인격화 효과를 보존합니다.
  doctrine_reference: 'Translation philosophy: gender-accurate over gender-neutral'
