source:
  edition: WLC
  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
  footnotes:
  - marker: a
    text: Or 'Bring a case against your mother' / 'Plead against your mother.' The Hebrew verb ריב can carry legal-disputational force.
    reason: lexical_alternative
  - marker: b
    text: '''Prostitutions'' renders a Hebrew term often used in Hosea both for literal sexual misconduct and, metaphorically, for covenant unfaithfulness through idolatry.'
    reason: cultural_note
translation:
  language: ko
  text: “너희 어머니를 상대로 다투어라[a], 다투어라. 그녀는 내 아내가 아니며, 나는 그녀의 남편이 아니다. 그녀가 그녀의 얼굴에서 음행을[b], 그녀의 젖가슴 사이에서 간음을 없애게 하여라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투어라’는 히브리어 ריב의 대립적·법적 뉘앙스를 살린 번역이며, ‘소송을 제기하라’ 또는 ‘고발하라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘음행’은 호세아서에서 문자적인 성적 타락을 가리키는 동시에 우상숭배를 통한 언약 불성실의 비유로도 쓰입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם רִיבוּ
  english_pob_choice: Contend with your mother, contend
  chosen_korean: “너희 어머니와 다투어라, 다투어라”
  alternatives_korean:
  - “너희 어머니와 논쟁하라, 논쟁하라”
  - “너희 어머니에게서 소송을 제기하라, 소송을 제기하라”
  - “너희 어머니를 상대로 다투어라, 다투어라”
  lexicon: HALOT
  rationale: ריב의 대립·법적 분쟁 뉘앙스를 살리되, 현대 한국어에서는 ‘다투다’가 가장 직관적으로 반복 명령의 긴박함을 전달합니다. 영어 POB의 ‘Contend’가 과도한 법정화로 굳어지지 않도록 했습니다.
- source_word: אִשְׁתִּי / אִישָׁהּ
  english_pob_choice: my wife / her husband
  chosen_korean: “내 아내가 아니고, 나는 그녀의 남편이 아니기 때문이다”
  alternatives_korean:
  - “내 아내가 아니고, 나는 그녀의 남편이 아니기 때문이다”
  - “내 아내가 아니며, 나는 그녀의 남편이 아니다”
  - “내 아내가 아니라, 나는 그녀의 남편이 아니다”
  lexicon: HALOT
  rationale: 히브리어의 혼인 언어를 그대로 살려 언약 파기의 비유를 유지했습니다. ‘아내/남편’이 가장 자연스럽고, 메시아적·교회적 확장 해석을 본문에 미리 넣지 않도록 했습니다.
- source_word: זְנוּנֶיהָ
  english_pob_choice: her prostitutions
  chosen_korean: “음행을”
  alternatives_korean:
  - “그녀의 음행을”
  - “그녀의 매춘 행위를”
  - “그녀의 창기의 행위를”
  lexicon: HALOT
  rationale: 호세아서의 זנונים는 문자적 성적 타락과 우상숭배의 비유를 함께 지닙니다. 한국어 ‘음행’은 그 강도와 성경적 용례를 비교적 직접적으로 보존하면서도 지나치게 현대적 비속어로 흐르지 않습니다.
- source_word: וְנַאֲפוּפֶיהָ
  english_pob_choice: her adulteries
  chosen_korean: “간음을”
  alternatives_korean:
  - “그녀의 간음을”
  - “그녀의 간음 행위를”
  - “간음들을”
  lexicon: HALOT
  rationale: נאף의 행위를 직접 지시하는 말로, 한국어 ‘간음’이 가장 단단하고 본문적입니다. 복수형의 반복적·누적적 뉘앙스는 문맥과 병렬 구조로 충분히 드러납니다.
- source_word: מִפָּנֶיהָ / מִבֵּין שָׁדֶיהָ
  english_pob_choice: from her face / from between her breasts
  chosen_korean: “자기 얼굴에서 … 자기 젖가슴 사이에서”
  alternatives_korean:
  - “자기 얼굴에서 … 자기 가슴 사이에서”
  - “자기 얼굴 앞에서 … 자기 가슴 사이에서”
  - “자기 얼굴에서 … 자기 유방 사이에서”
  lexicon: HALOT
  rationale: 지시적·육체적 이미지를 보존하기 위해 공간 표현을 직역 쪽으로 유지했습니다. ‘젖가슴’은 다소 직설적이지만 שָׁדַיִם의 구체성을 살려 호세아서의 노골성을 약화시키지 않습니다.
theological_decisions:
- issue: 언약 파기와 혼인 비유의 유지
  chosen_reading: 본절의 혼인 언어를 본문에서 그대로 유지하고, ‘언약 불성실’로 풀어쓰지 않았습니다.
  alternative_readings:
  - “그녀는 내 언약의 아내가 아니다”처럼 해석을 본문에 삽입
  rationale: 호세아는 실제 혼인 비유로 이스라엘의 배신을 드러냅니다. 해설을 본문에 섞으면 예언자의 상징 행동이 약해지므로, 독자가 비유의 충격을 그대로 받도록 했습니다.
  doctrine_reference: 예언서 해석 원칙 / 비유 보존
- issue: 성적 언어의 강도 유지
  chosen_reading: ‘음행’과 ‘간음’을 완화하지 않고 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘불성실’
  - ‘부정’
  - ‘도덕적 타락’
  rationale: 호세아는 우상숭배를 성적 배신의 언어로 드러내며 죄의 심각성을 드러냅니다. 완화 번역은 원문의 수사적 충격과 신학적 날카로움을 흐리게 합니다.
  doctrine_reference: 예언적 책망의 수사 / 우상숭배와 언약 배반
