base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
  footnotes:
  - marker: a
    text: Or 'former husband.' The Hebrew reads literally 'my first husband.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 그녀의 연인들을 뒤쫓겠지만, 따라잡지 못할 것입니다. 그들을 찾겠지만, 발견하지 못할 것입니다. 그러고서 그녀는 말할 것입니다, “나는 가서 내 첫 남편에게 돌아가겠습니다. 그때가 지금보다 내게 더 좋았기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전 남편’. 히브리어는 문자적으로 ‘내 첫 남편’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבֶיהָ
  english_pob_choice: her lovers
  chosen_korean: 자기의 연인들
  alternatives_korean:
  - 사랑하는 이들
  - 애인들
  lexicon: HALOT
  rationale: 호세아서의 혼인 비유에서 מדובר는 단순한 애정 대상이 아니라 불륜적 관계를 가리키므로, 관계의 타락성을 살리기 위해 ‘연인들’로 옮겼습니다.
- source_word: תַשִּׂיג
  english_pob_choice: she will overtake
  chosen_korean: 따라잡지 못할 것입니다
  alternatives_korean:
  - 붙잡지 못할 것입니다
  - 잡지 못할 것입니다
  lexicon: HALOT
  rationale: ‘뒤쫓다/따라잡다’의 추적 이미지를 살리면서, 실패의 결과를 자연스러운 한국어로 분명하게 표현했습니다.
- source_word: אִישִׁי הָרִאשׁוֹן
  english_pob_choice: my first husband
  chosen_korean: 내 첫 남편
  alternatives_korean:
  - 내 전 남편
  - 내 처음 남편
  lexicon: HALOT
  rationale: 문자적으로는 ‘첫 남편’이 가장 가깝고, POB의 각주가 지적하듯 ‘former husband’의 가능성을 열어 두되 본문에서는 혼인 비유를 직접 유지했습니다.
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  english_pob_choice: for it was better for me then than now
  chosen_korean: 그때가 지금보다 내게 더 좋았기 때문입니다
  alternatives_korean:
  - 그때가 현재보다 내게 더 나았기 때문입니다
  - 그때 내 형편이 지금보다 더 좋았기 때문입니다
  lexicon: HALOT
  rationale: ‘אָז/מֵעָתָּה’의 시간 대비를 살리면서, 원문의 평가절을 한국어 관용에 맞게 매끄럽게 옮겼습니다.
theological_decisions:
- issue: 혼인-언약 비유의 직설성 유지
  chosen_reading: ‘연인들’과 ‘첫 남편’을 그대로 살려, 관계의 불성실과 회복 갈망을 혼인 언어로 드러냈습니다.
  alternative_readings:
  - ‘동맹자들’이나 ‘의지하던 대상들’처럼 완화하여 번역
  rationale: 본문은 호세아 전체의 혼인-언약 비유 안에 있으며, 정치적·종교적 의미를 함축하더라도 표층의 성적/혼인적 이미지를 지우면 본문의 충격과 설득력이 약화됩니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
