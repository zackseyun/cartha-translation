id: HOS.2.13
reference: Hosea 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּי֙ כָּל מְשׂוֹשָׂ֔/הּ חַגָּ֖/הּ חָדְשָׁ֣/הּ וְ/שַׁבַּתָּ֑/הּ וְ/כֹ֖ל מוֹעֲדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
  footnotes:
  - marker: a
    text: Or 'I will cause all her mirth to cease.'
    reason: lexical_alternative
  - marker: b
    text: '''Appointed festivals'' translates a term that can also mean ''appointed times''; here it refers to set religious observances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그녀의 모든 기쁨을 끝내겠습니다—그녀의 절기들, 그녀의 초하루들, 그녀의 안식일들, 그리고 그녀의 모든 정해진 때들을 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정해진 때들’은 절기/제의적 기념일을 가리키는 말로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: I will put an end to
  chosen_korean: 끝내겠습니다
  alternatives_korean:
  - 멈추게 하겠습니다
  - 그치게 하겠습니다
  lexicon: HALOT
  rationale: 사역형 שׁבת의 ‘그치게 하다’라는 강한 인과를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מְשׂוֹשָׂהּ
  english_pob_choice: her rejoicing
  chosen_korean: 그녀의 모든 기쁨
  alternatives_korean:
  - 그녀의 환희
  - 그녀의 즐거움
  lexicon: HALOT
  rationale: 단순 감정이 아니라 축제적 기쁨의 총체를 가리키므로, 뒤의 절기 목록을 포괄하도록 ‘모든 기쁨’으로 옮겼습니다.
- source_word: חַגָּהּ חָדְשָׁהּ וְשַׁבַּתָּהּ וְכֹל מוֹעֲדָהּ
  english_pob_choice: her feasts, her new moons, her Sabbaths, and all her appointed times
  chosen_korean: 그녀의 절기들, 그녀의 초하루들, 그녀의 안식일들, 그리고 그녀의 모든 정해진 때들
  alternatives_korean:
  - 그녀의 명절들, 그녀의 새달들, 그녀의 안식일들, 그리고 그녀의 모든 정해진 시기들
  - 그녀의 축제들, 그녀의 새 달들, 그녀의 안식일들, 그리고 그녀의 모든 지정된 때들
  lexicon: HALOT
  rationale: 히브리어가 예배 달력의 항목들을 나열하므로, ‘절기/초하루/안식일/정해진 때’로 각각 구분해 문화적·제의적 의미를 살렸습니다. ‘초하루들’은 חֹדֶשׁ의 월삭 예배를 드러내기 위한 선택입니다.
theological_decisions:
- issue: 열거된 항목들의 범위
  chosen_reading: 이 구절은 이스라엘의 제의적 즐거움과 예배 달력 전체가 심판으로 중단된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 사회적 잔치와 일반적 즐거움까지 포함하는 넓은 의미로 읽을 수도 있습니다.
  rationale: ‘절기들, 초하루들, 안식일들, 정해진 때들’이라는 배열이 전형적인 제의 달력 언어이므로, 본문이 예배 관행의 중단을 말한다는 점을 살렸습니다.
  doctrine_reference: 호세아 2:13 문맥의 언약 심판
