id: HOS.1.4
reference: Hosea 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
  footnotes:
  - marker: a
    text: Or “for the blood of Jezreel” or “for the bloodguilt of Jezreel.” The Hebrew idiom literally reads “the bloods of Jezreel.”
    reason: lexical_alternative
  - marker: b
    text: Jezreel is both the child's symbolic name and the name of the place associated with Jehu's violent acts.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. 「그의 이름을 이스르엘이라 불러라. 조금 있으면 내가 이스르엘의 피의 죄[a]에 대하여 예후의 집을 벌하고, 이스라엘 집의 왕국을 끝내 버리겠다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스르엘의 피”나 “이스르엘의 피 흘림에 따른 죄”로도 옮길 수 있습니다. 히브리어 관용구는 문자적으로는 “이스르엘의 피들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Tetragrammaton
  rationale: 본문의 신명문을 제목으로 바꾸지 않고 고유신명으로 드러내기 위해, 영어 POB의 Yahweh에 맞춰 야훼로 옮겼습니다.
- source_word: קְרָא שְׁמוֹ
  english_pob_choice: Call his name
  chosen_korean: 그의 이름을 …이라 불러라
  alternatives_korean:
  - 그를 …이라 이름 지어라
  - 그의 이름을 …로 하라
  lexicon: HALOT
  rationale: 히브리어 관용구의 명령형 구조를 살리면서도 한국어에서 자연스럽게 들리도록 ‘이름을 …이라 불러라’로 옮겼습니다.
- source_word: דְּמֵי יִזְרְעֶאל
  english_pob_choice: the bloodshed of Jezreel
  chosen_korean: 이스르엘의 피의 죄
  alternatives_korean:
  - 이스르엘의 피
  - 이스르엘의 유혈
  lexicon: HALOT
  rationale: 복수형 ‘피들’의 관용적 의미를 단순한 유혈이 아니라 피 흘림에 따른 죄책까지 포괄하도록, 영어 주석의 대안 가능성도 반영해 ‘피의 죄’로 옮겼습니다.
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: I will put an end to
  chosen_korean: 끝내 버리겠다
  alternatives_korean:
  - 끝내겠다
  - 멈추게 하겠다
  lexicon: HALOT
  rationale: 힐힐형 ‘끝나게 하다/그치게 하다’의 단호한 심판 뉘앙스를 살리기 위해, 단순한 중립 표현보다 종결감을 주는 ‘끝내 버리겠다’를 선택했습니다.
theological_decisions:
- issue: 예후의 집에 대한 심판의 범위
  chosen_reading: 예후의 집에 대한 징계와 이스라엘 왕국의 종말을, 본문이 제시하는 긴장 그대로 유지했습니다.
  alternative_readings:
  - 예후의 폭력이 본질적으로 악하다고 단정하는 해석
  - 예후의 집 전체보다 뒤이은 왕조 계승 문제에 한정하는 해석
  rationale: 본문은 심판 선언을 분명히 하지만, 예후 사건에 대한 역사신학적 평가를 해소해 주지는 않으므로 번역에서 그 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
