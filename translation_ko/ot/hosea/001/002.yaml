  - severity: medium
    issue: 인용문 명령형의 높임말 불일치
    rationale: 번역의 지정 문체가 현대 공식 합쇼체인데 ‘두어라’는 해라체입니다. 본문 전체의 문체 요구에 맞춰 합쇼체 명령형으로 고쳐야 합니다.
  - severity: low
    issue: 도입구의 어색한 한국어 표현
    rationale: ‘말씀하신 시작’은 수식 관계가 자연스럽지 않습니다. 원문의 도입구/표제적 모호성을 보존하면서 ‘하신 말씀의 시작’으로 다듬을 수 있습니다.
  - severity: low
