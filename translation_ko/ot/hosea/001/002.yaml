  naturalness: ‘여호와께서 호세아를 통해 말씀하신 시작입니다’는 현대 한국어에서 부자연스럽습니다. ‘여호와께서 호세아를 통하여 하신 말씀의 시작입니다’가 도입구의 명사적 성격을 유지하면서도 자연스럽습니다. 목표 합쇼체에 맞추어 인용문 안의 명령도 ‘맞이하십시오/두십시오’로 통일하는 것이 적절합니다.
