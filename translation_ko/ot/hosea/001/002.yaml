base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
  footnotes:
  - marker: a
    text: Or 'When the LORD first spoke through Hosea.' The Hebrew opening can be construed as an incipit or as a temporal clause.
    reason: alternative_reading
  - marker: b
    text: Or 'a wife of prostitution' and 'children of prostitution.' The Hebrew זְנוּנִים can denote sexual immorality broadly or prostitution more specifically.
    reason: lexical_alternative
  - marker: c
    text: Literally 'for the land, committing whoredom, commits whoredom from after the LORD,' an emphatic Hebrew expression for extreme covenant unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 호세아를 통하여 하신 말씀의 시작입니다.[a] 여호와께서 호세아에게 말씀하셨습니다. “가서 음행하는 여자를 아내로 맞이하고 음행의 자녀들을 두십시오.[b] 이 땅이 여호와를 떠나 음행을 거듭하고 있기 때문입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호와께서 호세아를 통하여 하신 말씀의 시작’은 ‘여호와께서 처음 호세아를 통하여 말씀하셨을 때’로도 이해될 수 있습니다. 히브리어 도입구는 표제처럼 또는 시간 절처럼 해석될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘음행하는 여자’와 ‘음행의 자녀들’은 각각 ‘매춘의 여자/자녀들’로도 옮길 수 있습니다. 히브리어 ‘음행’은 성적 부도덕 일반이나 매춘을 가리킬 수 있으며, 여기서는 언약적 불성실의 비유도 포함합니다. ‘음행의 자녀들’은 자녀들이 직접 음행했다는 뜻으로 한정되지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘여호와를 떠나’는 문자적으로 ‘여호와를 따르는 데서 떠나’라는 히브리어 관용구를 풀어 옮긴 것입니다. ‘음행을 거듭하다’는 히브리어의 강조 표현을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּ֥ת דִּבֶּר יְהוָ֖ה בְּ/הוֹשֵׁ֑עַ
  english_pob_choice: The beginning of the word of Yahweh through Hosea
  chosen_korean: 여호와께서 호세아를 통해 말씀하신 시작입니다
  alternatives_korean:
  - 호세아를 통해 여호와의 말씀이 시작됩니다
  - 여호와께서 호세아를 통해 처음 말씀하셨을 때입니다
  lexicon: HALOT
  rationale: תְּחִלַּת + דִּבֶּר의 도입구를 ‘시작’으로 살리고, בְּהוֹשֵׁעַ는 바로 뒤의 אֶל הוֹשֵׁעַ와 구별되도록 ‘호세아를 통해’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 본문 기록은 영어 POB가 ‘Yahweh’를 사용하므로, 한국어 본문에서는 통용성을 고려해 ‘여호와’로 옮겼습니다.
- source_word: לֵךְ קַח לְךָ אֵשֶׁת זְנוּנִים וְיַלְדֵי זְנוּנִים
  english_pob_choice: Go, take for yourself a wife of whoredom and children of whoredom
  chosen_korean: 가서 음행하는 여자를 아내로 맞이하고 음행한 자식들을 두어라
  alternatives_korean:
  - 가서 음행의 아내와 음행의 자식들을 취하여라
  - 가서 음행의 여자를 아내로 삼고 음행한 자식들을 두어라
  lexicon: HALOT
  rationale: לֵךְ קַח לְךָ의 명령 구조를 유지하되, 한국어에서는 ‘아내로 맞이하다’가 결혼 맥락을 자연스럽게 드러냅니다. זְנוּנִים은 도덕적·언약적 불성실을 포함하는 강한 표현이어서 ‘음행’으로 옮겼습니다.
- source_word: כִּֽי זָנֹ֤ה תִזְנֶה הָ/אָ֔רֶץ מֵֽ/אַחֲרֵ֖י יְהוָֽה
  english_pob_choice: for the land utterly commits whoredom by turning away from Yahweh
  chosen_korean: 이 땅이 여호와를 떠나 음행을 거듭하고 있기 때문이다
  alternatives_korean:
  - 이 땅이 여호와를 떠나 참으로 음행하고 있기 때문이다
  - 이 땅이 여호와의 뒤를 떠나 음행을 심히 저지르고 있기 때문이다
  lexicon: HALOT
  rationale: זָנֹה תִזְנֶה의 강조를 한국어 관용에 맞게 ‘음행을 거듭하다’로 살렸고, מֵאַחֲרֵי יְהוָה는 직역보다 의미가 분명한 ‘여호와를 떠나’로 옮겼습니다.
theological_decisions:
- issue: 호세아의 결혼 명령에 담긴 충격적 성적 비유를 얼마나 직접적으로 살릴지
  chosen_reading: ‘음행’이라는 직접적 표현을 유지해 언약 불성실의 충격을 보존했습니다.
  alternative_readings:
  - 정숙하지 않은 여자
  - 부정한 여자
  - 간음한 여자
  rationale: 호세아는 이스라엘의 언약 파기를 강하게 드러내기 위해 의도적으로 날카로운 성적 비유를 사용하므로, 이를 완화하면 예언적 효과가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
