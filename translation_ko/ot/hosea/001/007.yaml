- from: 그러나 나는 유다의 집을 불쌍히 여기고, 그들을 야훼 그들의 하나님으로 구원하겠습니다. 내가 그들을 활로, 칼로, 전쟁으로, 말로, 기병으로 구원하지는 않겠습니다.[a]
  to: 그러나 나는 유다의 집에 자비를 베풀고, 그들의 하나님 야훼로 말미암아 그들을 구원하겠습니다.[a] 나는 활이나 칼이나 전쟁이나 말이나 기병으로 그들을 구원하지 않겠습니다.
  rationale: 원문의 대조, ‘유다의 집’이라는 관용구, רחם의 자비, 구원의 반복, 그리고 군사 수단의 부정을 유지했습니다. 수단을 나타내는 בַּיהוָה אֱלֹהֵיהֶם만 한국어 문법과 현대적 자연스러움을 위해 ‘그들의 하나님 야훼로 말미암아’로 다듬었고, 대안적 매개 표현은 각주로 보존했습니다.
