id: HOS.1.7
reference: Hosea 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
  footnotes:
  - marker: a
    text: Or 'through the LORD their God'; the Hebrew preposition can express means or agency. The main text uses 'by' because the following clause contrasts the LORD with military means of deliverance.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 유다의 집을 불쌍히 여기고, 그들을 야훼 그들의 하나님으로 구원하겠습니다. 내가 그들을 활로, 칼로, 전쟁으로, 말로, 기병으로 구원하지는 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 그들의 하나님을 통해”. 히브리어 전치사 ב는 수단이나 매개를 모두 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또는
  lexicon: WLC
  rationale: 앞 절의 심판 선언과 대조를 이루는 접속이므로, 한국어에서는 단순한 연결보다 역접인 '그러나'가 본문의 긴장을 더 분명히 드러냅니다.
- source_word: בֵּית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다의 집
  alternatives_korean:
  - 유다
  - 유다의 가문
  lexicon: WLC
  rationale: 히브리어 관용구를 살리기 위해 '유다의 집'으로 옮겼습니다. 이는 민족/왕국을 가리키는 예언서적 표현을 유지합니다.
- source_word: אֲרַחֵם
  english_pob_choice: I will have compassion
  chosen_korean: 불쌍히 여기겠습니다
  alternatives_korean:
  - 긍휼을 베풀겠습니다
  - 자비를 보이겠습니다
  lexicon: WLC
  rationale: רחם의 자비/연민 뉘앙스를 한국어에서 자연스럽게 드러내는 표현으로 옮겼습니다. 다만 문맥상 하나님의 정서적 돌보심을 보여 주는 말이므로 단순한 제도적 '용서'로 약화하지 않았습니다.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  english_pob_choice: by Yahweh their God
  chosen_korean: 야훼 그들의 하나님으로
  alternatives_korean:
  - 야훼 그들의 하나님을 통하여
  - 야훼 그들의 하나님 안에서
  lexicon: WLC
  rationale: 전치사 ב의 수단/매개 의미를 살려, 구원이 야훼 자신으로 말미암는다는 점을 드러내는 표현으로 옮겼습니다. '으로'는 한국어에서 가장 간결하게 도구·수단 의미를 담습니다.
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה בְּסוּסִים וּבְפָרָשִׁים
  english_pob_choice: by bow, or by sword, or by war, by horses, or by horsemen
  chosen_korean: 활로, 칼로, 전쟁으로, 말로, 기병으로
  alternatives_korean:
  - 활이나 칼이나 전쟁이나 말이나 기병으로
  - 활, 칼, 전쟁, 말, 기병으로
  lexicon: WLC
  rationale: 연속된 ב 전치사를 한국어 수단격 '—으로'로 일정하게 옮겨, 구원이 군사적 수단에서 오지 않는다는 열거의 리듬을 살렸습니다. '기병'은 פרשים의 군사적 의미를 가장 간단히 드러냅니다.
theological_decisions:
- issue: 야훼의 구원이 군사 수단과 대조되는 방식
  chosen_reading: 하나님의 구원은 활·칼·전쟁·말·기병 같은 인간 군사력의 수단에서 오지 않고, 야훼 자신으로부터 옵니다.
  alternative_readings:
  - 야훼가 군사 수단을 사용하지 않고 직접 구원하신다
  - 군사력도 하나님의 도구일 수 있으나 여기서는 배제된다
  rationale: 본문은 반복되는 부정으로 인간적 전쟁 도구를 배제하면서, 유다의 구원이 오직 야훼께 달려 있음을 강조합니다. 이 긴장을 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
