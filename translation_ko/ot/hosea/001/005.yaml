  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
  footnotes:
  - marker: a
    text: Or 'I will shatter the bow of Israel'; the 'bow' represents Israel's military strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 이스라엘의 활을 이스르엘 골짜기에서 꺾겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘활’은 이스라엘의 군사적 힘을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / בַּיּוֹם הַהוּא
  english_pob_choice: And on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날에는
  - 그날에 이르러
  lexicon: HALOT
  rationale: 예언적 시간 표지를 자연스러운 현대 한국어로 압축하되, 심판의 특정 시점을 가리키는 뉘앙스를 유지했습니다.
- source_word: וְשָׁבַרְתִּי
  english_pob_choice: I will break
  chosen_korean: 꺾겠습니다
  alternatives_korean:
  - 부러뜨리겠습니다
  - 깨뜨리겠습니다
  - 꺾어 버리겠습니다
  lexicon: HALOT
  rationale: 활을 부러뜨린다는 물리적 파괴를 살리면서도, 전쟁 능력을 무력화하는 함의를 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: קֶשֶׁת יִשְׂרָאֵל
  english_pob_choice: the bow of Israel
  chosen_korean: 이스라엘의 활
  alternatives_korean:
  - 이스라엘의 활시위
  - 이스라엘의 군사력
  lexicon: HALOT
  rationale: 원문의 구체적 군사 이미지를 본문에서 보존했습니다. 메타포를 해설로 바꾸지 않고, 독자가 군사적 상징성을 읽어 내도록 했습니다.
- source_word: בְּעֵמֶק יִזְרְעֶאל
  english_pob_choice: in the Valley of Jezreel
  chosen_korean: 이스르엘 골짜기에서
  alternatives_korean:
  - 이스르엘의 골짜기에서
  - 예스르엘 골짜기에서
  lexicon: HALOT
  rationale: 지명을 음역하고 지형어는 ‘골짜기’로 옮겨, 장소 표지를 직접적으로 전달했습니다.
theological_decisions:
- issue: ‘활’의 의미를 군사력으로 풀어 쓸지 여부
  chosen_reading: 본문에는 ‘이스라엘의 활’을 그대로 두어 군사 상징을 보존했습니다.
  alternative_readings:
  - 이스라엘의 군사력을 부수겠습니다
  - 이스라엘의 힘을 꺾겠습니다
  rationale: 히브리어의 구체적 전쟁 이미지를 유지하는 편이 예언적 선포의 날카로움을 살리며, 상징적 의미는 독자가 문맥에서 파악할 수 있습니다.
  doctrine_reference: 'optimal equivalence: 원문의 평이한 뜻을 유지하되, 본문이 실제로 사용한 이미지를 해설로 대체하지 않습니다.'
