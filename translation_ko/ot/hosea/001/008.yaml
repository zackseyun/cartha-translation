base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/008.yaml
  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
  footnotes:
  - marker: a
    text: Lo-ruhamah means 'Not shown mercy' or 'No mercy.' The name's meaning is important in the surrounding context, though the name itself is transliterated in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 로-루하마[a]에게 젖을 뗀 뒤, 임신하여 아들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 로-루하마는 ‘긍휼히 여김을 받지 못한 이’ 또는 ‘긍휼 없음’이라는 뜻입니다. 이 이름의 의미는 주변 문맥에서 중요하지만, 본문에서는 음역으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  english_pob_choice: After she had weaned
  chosen_korean: 젖뗀 뒤에
  alternatives_korean:
  - 젖을 뗀 뒤에
  - 젖을 뗀 후에
  - 젖을 떼자
  lexicon: HALOT
  rationale: גמל의 이 문맥상 뜻은 '젖떼다'이며, 영어 POB의 시간 순서를 따라 한국어에서는 자연스럽게 '…뒤에'로 선행 사건을 드러냈습니다.
- source_word: לֹא רֻחָמָה
  english_pob_choice: Lo-ruhamah
  chosen_korean: Lo-루하마
  alternatives_korean:
  - 로-루하마
  - 로-루함마
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 유지했고, 히브리어 합성 이름의 형태를 보존하기 위해 하이픈을 살렸습니다.
- source_word: וַתַּהַר
  english_pob_choice: she conceived
  chosen_korean: 임신하여
  alternatives_korean:
  - 수태하여
  - 잉태하여
  lexicon: HALOT
  rationale: הרה는 출생 서술에서 '임신하다/잉태하다'로 옮길 수 있으며, 현대 문어체에서는 '임신하여'가 가장 자연스럽고 분명합니다.
- source_word: וַתֵּלֶד
  english_pob_choice: gave birth
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 아들을 출산했습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: ילד의 서술적 의미를 현대 한국어로 자연스럽게 살려 '낳았습니다'를 택했습니다.
theological_decisions:
- issue: 이름의 의미를 본문에서 풀어 쓰지 않고 음역만 유지할지 여부
  chosen_reading: 본문에는 음역만 두고, 이름의 의미는 주석에서 다루는 방식이 적절합니다.
  alternative_readings:
  - '''긍휼을 받지 못한 자''로 번역'
  - '''긍휼 없음''을 본문에 병기'
  rationale: 영어 POB도 본문에서는 음역을 유지하고 의미는 각주로 처리합니다. 본문 서술의 흐름을 해치지 않으면서 문맥적 신학 의미를 보존합니다.
  doctrine_reference: 호세아 1장의 표징적 자녀 이름 사용
