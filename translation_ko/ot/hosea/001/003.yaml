id: HOS.1.3
reference: Hosea 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח אֶת גֹּ֖מֶר בַּת דִּבְלָ֑יִם וַ/תַּ֥הַר וַ/תֵּֽלֶד ל֖/וֹ בֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
  footnotes:
  - marker: a
    text: Or 'married Gomer' / 'took Gomer as his wife.' The Hebrew literally says 'took,' with the marital sense supplied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그가 가서 디블라임의 딸 고멜을 데려왔습니다. 그녀가 임신하여 그에게 아들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자 그대로 ‘데려오다/취하다’라고 말합니다. 결혼 의미는 문맥에서 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: So he went
  chosen_korean: 가서
  alternatives_korean:
  - 그리고 갔습니다
  - 그는 갔습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사적 진행을 살리되, 한국어에서는 앞 절과 자연스럽게 이어지는 연결형 ‘가서’가 가장 간결하고 자연스럽습니다.
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 데려갔습니다
  - 맞아들였습니다
  lexicon: HALOT
  rationale: 직역하면 ‘취했습니다/데려왔습니다’에 가깝고, 결혼 문맥의 함의를 지니지만 본문 자체는 ‘아내로 삼아’라고 명시하지 않으므로, 한국어에서는 관계의 성립을 드러내되 과잉 해석을 피하는 표현을 택했습니다.
- source_word: בַּת דִּבְלָיִם
  english_pob_choice: daughter of Diblaim
  chosen_korean: 디블라임의 딸
  alternatives_korean:
  - 디블라임 딸
  - 디블라임의 딸이라는
  lexicon: HALOT
  rationale: ‘딸 + 고유명사’의 족보적 표현을 그대로 살린 번역입니다. 고유명사는 현대 음역에 맞춰 옮겼습니다.
- source_word: וַתַּהַר
  english_pob_choice: she conceived
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 수태하여
  lexicon: HALOT
  rationale: 히브리어 הרה는 ‘잉태하다/임신하다’의 뜻이며, 현대 한국어에서는 ‘임신하여’가 가장 이해하기 쉽고 본문 의미를 정확히 전달합니다.
- source_word: וַתֵּלֶד לֹו בֵּן
  english_pob_choice: and bore him a son
  chosen_korean: 그에게 아들을 낳았습니다
  alternatives_korean:
  - 그에게 아들을 낳아 주었습니다
  - 그에게 한 아들을 낳았습니다
  lexicon: HALOT
  rationale: ילד의 출산 의미를 자연스럽게 살렸고, לוֹ는 출산 관계에서 한국어의 여격 ‘그에게’로 옮겼습니다. ‘아들’은 무관사 히브리어의 자연스러운 서술을 따라 ‘한’ 없이도 충분합니다.
theological_decisions:
- issue: וַיִּקַּח의 결혼 함의와 명시성
  chosen_reading: 본문에는 ‘데려왔다’로 두고 결혼 의미는 앞뒤 문맥에서 읽히도록 했습니다.
  alternative_readings:
  - 아내로 맞이했습니다
  - 결혼했습니다
  rationale: 히브리어 동사는 문맥상 결혼을 뜻할 수 있지만, 본 절은 그 행위를 직접 명시하지 않습니다. 앞 절의 명령과 연결해 읽히게 하면서도 본 절의 어휘를 과도하게 확장하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하는 만큼만 번역
- issue: ‘임신하다/잉태하다’의 표현 선택
  chosen_reading: ‘임신하여’로 옮겨 현대 한국어 독자가 즉시 이해하도록 했습니다.
  alternative_readings:
  - 잉태하여
  - 수태하여
  rationale: 원문의 생물학적·서사적 의미는 유지되며, 현대 문맥에서 가장 직관적인 표현입니다. 다만 신학적 완곡어법으로 의미를 약화시키지 않도록 ‘낳았습니다’와 짝지었습니다.
  doctrine_reference: 명료성 우선, 그러나 원문의 사실 진술 유지
