base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/009.yaml
  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
  footnotes:
  - marker: a
    text: Or, “and I will not be yours,” with many understanding the covenant sense as “and I will not be your God.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀하셨습니다. “그의 이름을 ‘내 백성이 아님’이라 부르십시오. 이는 너희가 내 백성이 아니며, 내가 너희의 것이 되지 않을 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희에게 있지 않을 것이다’로 옮길 수 있습니다. 많은 이들은 이 표현을 언약적 의미로 이해하여 ‘내가 너희의 하나님이 되지 않을 것이다’라고 풀이합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  english_pob_choice: Call his name
  chosen_korean: 그의 이름을 …이라 부르라
  alternatives_korean:
  - 그의 이름을 …이라고 하라
  - 그 이름을 …이라 지으라
  lexicon: HALOT
  rationale: 예언적 표징 이름 명령을 한국어로 자연스럽게 옮기되, ‘이름을 부르라’는 명명 공식의 기능을 살렸습니다.
- source_word: לֹא עַמִּי
  english_pob_choice: Not-My-People
  chosen_korean: ‘내 백성이 아님’
  alternatives_korean:
  - ‘내 백성이 아니다’
  - ‘로암미’
  lexicon: HALOT
  rationale: 고유명사로 기능하는 상징 이름이므로 의미역을 유지하고, 따옴표로 이름 기능을 드러냈습니다.
- source_word: אַתֶּם לֹא עַמִּי
  english_pob_choice: you are not my people
  chosen_korean: 너희가 내 백성이 아니요
  alternatives_korean:
  - 너희는 내 백성이 아니요
  - 너희는 내 소유 백성이 아니요
  lexicon: HALOT
  rationale: עַם + 1인칭 접미사의 언약적 귀속 부정을 직설적으로 살려 ‘내 백성’으로 옮겼습니다.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  english_pob_choice: and I am not yours
  chosen_korean: 내가 너희에게 속하지 않을 것이기 때문입니다
  alternatives_korean:
  - 내가 너희의 하나님이 되지 않을 것이기 때문입니다
  - 내가 너희 것이 아니기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 언약 공식과 미래형 뉘앙스를 살리면서, 본문에 없는 ‘하나님’을 본문 본문에 덧붙이지 않도록 했습니다.
theological_decisions:
- issue: 마지막 절의 언약 파기 표현
  chosen_reading: 본문에는 ‘하나님’ 또는 ‘너희의 것’/‘너희의 하나님’ 같은 완성형을 넣지 않고, ‘내가 너희에게 속하지 않을 것’으로 간결하게 유지했습니다.
  alternative_readings:
  - 내가 너희의 하나님이 되지 않을 것입니다
  - 내가 너희 것이 아닐 것입니다
  rationale: 히브리어는 출애굽기적 언약 공식을 암시하지만 직접 말하지는 않으므로, 본문에 없는 신학적 완결을 피하고 언약의 단절을 그대로 드러냈습니다.
  doctrine_reference: 언약 신학 / 본문 중심 번역 원칙
