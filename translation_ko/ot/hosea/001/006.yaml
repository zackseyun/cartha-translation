id: HOS.1.6
reference: Hosea 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּ֤הַר עוֹד֙ וַ/תֵּ֣לֶד בַּ֔ת וַ/יֹּ֣אמֶר ל֔/וֹ קְרָ֥א שְׁמָ֖/הּ לֹ֣א רֻחָ֑מָה כִּי֩ לֹ֨א אוֹסִ֜יף ע֗וֹד אֲרַחֵם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי נָשֹׂ֥א אֶשָּׂ֖א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
  footnotes:
  - marker: a
    text: Lo-ruhamah sounds like 'not shown compassion' or 'no mercy.'
    reason: lexical_alternative
  - marker: b
    text: Or possibly, 'for I will surely take them away.' The Hebrew of the final clause is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀는 다시 잉태하여 딸을 낳았습니다[a]. 그리고 그가 그에게 말했습니다. “그녀의 이름을 로루하마라고 부르십시오. 이는 내가 더 이상 이스라엘 집을 불쌍히 여기지 않을 것이기 때문입니다[b]. 내가 분명히 그들을 용서해야 할 이유가 없기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 로루하마는 ‘불쌍히 여김을 받지 않음’ 또는 ‘긍휼 없음’이라는 뜻을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들을 반드시 거두어 가리라’로 옮길 수도 있습니다. 히브리어 마지막 절은 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  english_pob_choice: Then she conceived again
  chosen_korean: 다시 잉태하여
  alternatives_korean:
  - 다시 임신하여
  - 또 잉태하여
  lexicon: HALOT
  rationale: וַתַּהַר는 ‘잉태하다/임신하다’의 서술형 진행을 나타내며, עוֹד는 ‘다시’의 반복성을 더합니다. 한국어에서는 자연스럽고 간결하게 ‘다시 잉태하여’로 옮기는 것이 원문 흐름을 잘 살립니다.
- source_word: וַתֵּלֶד בַּת
  english_pob_choice: and gave birth to a daughter
  chosen_korean: 딸을 낳았습니다
  alternatives_korean:
  - 딸을 출산했습니다
  - 딸을 낳았습니다
  lexicon: HALOT
  rationale: ילד + בַּת는 문자 그대로 ‘딸을 낳다’입니다. 현대 한국어에서 가장 자연스러우면서도 원문의 직접성을 유지하는 표현입니다.
- source_word: לֹא רֻחָמָה
  english_pob_choice: Lo-ruhamah
  chosen_korean: 로루하마
  alternatives_korean:
  - 로-루하마
  - 노-루하마
  lexicon: HALOT
  rationale: 고유명사는 본문에서 음역으로 유지하는 것이 원칙입니다. 이름 자체가 רחם 계열의 의미를 담고 있으므로, 본문에서는 음역을 두고 의미는 뒤의 설명절에서 드러나게 했습니다.
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  english_pob_choice: I will no longer again show compassion
  chosen_korean: 내가 더 이상 이스라엘 집을 불쌍히 여기지 않을 것이기 때문입니다
  alternatives_korean:
  - 내가 더 이상 이스라엘 집을 긍휼히 여기지 않을 것이기 때문입니다
  - 내가 더 이상 이스라엘 집에 자비를 베풀지 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: אֲרַחֵם는 רחם의 어근상 ‘불쌍히 여기다/긍휼히 여기다’의 뜻을 가집니다. 여기서는 이름 로루하마의 의미와 연결되도록 ‘불쌍히 여기지 않을’로 옮겼고, ‘더 이상’으로 반복 중지를 드러냈습니다.
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  english_pob_choice: that I should surely forgive them
  chosen_korean: 내가 분명히 그들을 용서해야 할 이유가 없기 때문입니다
  alternatives_korean:
  - 내가 분명히 그들을 용서할 것이기 때문입니다
  - 내가 반드시 그들을 사면할 것이기 때문입니다
  - 내가 분명히 그들을 거두어 가야 할 것이기 때문입니다
  lexicon: HALOT
  rationale: נשׂא의 관용적 용법은 문맥상 ‘용서하다/사면하다’로 이해될 수 있지만, 히브리어는 매우 난해합니다. 본문에는 심판의 거절을 분명히 드러내되, 의미를 단정적으로 매끄럽게 만들지 않도록 ‘용서해야 할 이유가 없다’는 식으로 긴장을 남겼습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 집
  lexicon: HALOT
  rationale: 히브리어의 관용구 ‘house of Israel’을 그대로 살려 언약적·공동체적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 난해한 마지막 절의 의미 처리
  chosen_reading: 심판 문맥에서 ‘용서가 보류됨’을 드러내되, 히브리어의 불확실성을 본문 내 설명으로 완전히 해소하지 않았습니다.
  alternative_readings:
  - ‘내가 그들을 반드시 용서하리라’
  - ‘내가 그들을 반드시 거두어 가리라’
  rationale: כִּי נָשֹׂא אֶשָּׂא לָהֶם은 본문상 매우 어렵고 다양한 해석이 가능합니다. 한국어 본문은 POB의 선택을 따르되, 의미를 지나치게 확정해 원문의 긴장을 지우지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: 고유명사 로루하마의 처리
  chosen_reading: 이름은 음역으로 두고, 의미는 주변 설명에서 드러나게 했습니다.
  alternative_readings:
  - 이름을 ‘긍휼 없음’으로 번역
  - 이름을 ‘불쌍히 여기지 않음’으로 번역
  rationale: 표지 이름은 문자적 번역보다 음역이 더 적절합니다. 동시에 이름이 지닌 신학적 의미는 바로 뒤의 ‘불쌍히 여기지 않다’는 진술로 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; consistency of key terms'
