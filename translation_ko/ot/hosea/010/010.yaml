  verdict: revise
  source_fidelity: ‘그들 위로 모여들 것입니다’는 עֲלֵיהֶם의 적대적 용법을 한국어에서 부자연스럽고 불명확하게 옮깁니다. ‘그들을 치려고 모일 것입니다’가 심판·군사적 문맥의 ‘그들을 대적하여’를 자연스럽게 반영합니다. 마지막 구절은 난해한 독법을 본문에서 ‘두 죄악 때문에’로 보수적으로 유지할 수 있습니다.
  naturalness: ‘민족들이 그들 위로 모여들 것입니다’는 현대 표준 한국어에서 어색합니다. ‘여러 민족이 그들을 치려고 모일 것입니다’가 자연스럽고 의미가 분명합니다. 또한 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
  terminology: ‘징계하겠습니다’는 יסר의 교정적 심판 의미를 적절히 전달합니다. עמים는 이방 민족들의 집합을 가리키므로 ‘여러 민족’이 적절합니다. 난해한 עינתם은 ‘두 죄악’으로 두되, 각주에서 대안 독법을 밝혀 본문의 불확실성을 보존합니다.
