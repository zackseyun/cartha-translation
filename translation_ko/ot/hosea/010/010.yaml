id: HOS.10.10
reference: Hosea 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אַוָּתִ֖/י וְ/אֶסֳּרֵ֑/ם וְ/אֻסְּפ֤וּ עֲלֵי/הֶם֙ עַמִּ֔ים בְּ/אָסְרָ֖/ם לִ/שְׁתֵּ֥י עינת/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
  footnotes:
  - marker: a
    text: Or 'I will chasten them.' The verb can denote corrective discipline.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'for their two iniquities'; possibly 'for their double guilt.' The consonantal form has also prompted the alternative reading 'for their two eyes,' but that sense fits the context less well.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 원할 때, 내가 그들을 징계하겠습니다. 그들이 두 죄악 때문에 묶일 때, 민족들이 그들 위로 모여들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 징벌하겠습니다.’ 이 동사는 교정적 징계를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 두 죄악을 위해’입니다. 전통적으로는 ‘그들의 두 불의’로도 이해되며, 일부는 ‘그들의 두 눈’으로 읽기도 하지만 문맥에는 덜 어울립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  english_pob_choice: When I desire
  chosen_korean: 내가 원할 때
  alternatives_korean:
  - 내 뜻대로
  - 내가 바라면
  - 내가 원할 때마다
  lexicon: HALOT
  rationale: ב + 1인칭 단수 접미사가 붙은 אַוָּה/אַוָה는 하나님의 의지·소원을 가리키므로, 시간 부사처럼 자연스럽게 풀어도 원문의 조건적 뉘앙스를 살릴 수 있습니다.
- source_word: וְאֶסֳּרֵם
  english_pob_choice: I will discipline them
  chosen_korean: 내가 그들을 징계하겠습니다
  alternatives_korean:
  - 내가 그들을 훈계하겠습니다
  - 내가 그들을 징벌하겠습니다
  - 내가 그들을 징치하겠습니다
  lexicon: HALOT
  rationale: יסר는 교정적 훈육과 징계를 모두 포함할 수 있으므로, 심판 맥락에서는 ‘징계하다’가 가장 균형 있게 원문 의미를 드러냅니다.
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  english_pob_choice: and peoples will be gathered against them
  chosen_korean: 민족들이 그들 위로 모여들 것입니다
  alternatives_korean:
  - 민족들이 그들을 향해 모일 것입니다
  - 백성들이 그들에 맞서 모여들 것입니다
  - 민족들이 그들 위에 모여들 것입니다
  lexicon: HALOT
  rationale: עַמִּים의 복수 집합성을 살리되, 전쟁·심판 문맥의 적대성을 ‘그들 위로’로 간결하게 반영했습니다.
- source_word: לִשְׁתֵּי עינתם
  english_pob_choice: for their two iniquities
  chosen_korean: 두 죄악 때문에
  alternatives_korean:
  - 두 불의 때문에
  - 그들의 두 죄 때문에
  - 그들의 두 죄악 때문에
  lexicon: HALOT
  rationale: 끝 표현은 전통적으로 여러 이해가 있으나, 본문 문맥상 죄책/불의를 가리키는 독법을 따르면서 한국어에서는 자연스럽고 간결하게 처리했습니다.
theological_decisions:
- issue: 끝 구절의 난해한 히브리어 표현 עינתם의 처리
  chosen_reading: ‘두 죄악’으로 이해하되, 구체적 두 항목은 단정하지 않습니다.
  alternative_readings:
  - ‘두 불의’
  - ‘두 죄’
  - ‘두 눈’으로 보는 문자적 읽기
  rationale: 문맥은 심판과 책임을 요구하므로 죄책 의미를 유지하는 것이 적절하지만, 원문이 특정한 두 죄를 명시하지는 않으므로 해석을 과잉 확정하지 않았습니다.
  doctrine_reference: 원문 우선의 원칙을 따르며, 본문이 말하지 않는 세부 신학을 덧붙이지 않습니다.
