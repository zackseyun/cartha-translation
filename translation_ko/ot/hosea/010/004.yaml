id: HOS.10.4
reference: Hosea 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
  footnotes:
  - marker: a
    text: Or 'false oaths'; the Hebrew noun can also carry the sense of an oath invoking a curse.
    reason: lexical_alternative
  - marker: b
    text: Literally 'cutting a covenant.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew רֹאשׁ refers to a poisonous or bitter plant; exact identification is uncertain. Some render 'hemlock' or 'gall.'
    reason: lexical_alternative
  - marker: d
    text: Or 'justice springs up like poison weed,' if מִשְׁפָּט is taken with bitter irony.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 헛된 말을 합니다. 거짓 맹세를 하며, 언약을 맺습니다. 그러므로 정의가 밭의 고랑들 위에 독초처럼 솟아납니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거짓 맹세’로도 옮길 수 있으며, 히브리어 명사는 저주를 부르는 맹세의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘언약을 자르다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 רֹאשׁ은 독성 또는 쓴맛이 나는 식물을 가리키며, 정확한 식물 동정은 불확실합니다. ‘독초’ 또는 ‘쑥/독쑥’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 문맥에 따라 ‘정의가 독초처럼 솟아난다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  english_pob_choice: They speak mere words
  chosen_korean: 그들은 헛된 말을 합니다
  alternatives_korean:
  - 그들은 말만 합니다
  - 그들은 말들을 합니다
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 공허한 말함을 강조하므로, 직역보다 한국어에서 자연스럽고 책망의 뉘앙스를 살리는 ‘헛된 말’을 택했습니다.
- source_word: אָלוֹת שָׁוְא
  english_pob_choice: swearing false oaths
  chosen_korean: 거짓 맹세를 하며
  alternatives_korean:
  - 헛된 맹세를 하며
  - 저주를 동반한 거짓 맹세를 하며
  lexicon: HALOT
  rationale: אָלוֹת는 맹세이면서 저주적 함의를 가질 수 있지만, 문맥상 거짓됨이 핵심이므로 ‘거짓 맹세’로 옮기고 중복 설명은 각주로 처리하지 않았습니다.
- source_word: כָּרֹת בְּרִית
  english_pob_choice: making covenants
  chosen_korean: 언약을 맺습니다
  alternatives_korean:
  - 언약을 자릅니다
  - 조약을 맺습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 ‘자르다’를 살릴 수도 있지만, 현대 한국어에서는 ‘언약을 맺다’가 의미를 가장 분명하게 전달합니다.
- source_word: וּפָרַח
  english_pob_choice: springs up
  chosen_korean: 솟아납니다
  alternatives_korean:
  - 싹돕니다
  - 피어납니다
  - 번성합니다
  lexicon: HALOT
  rationale: 부정적 비유와 함께 쓰이므로 긍정적 뉘앙스의 ‘피어납니다/번성합니다’보다, 급격히 올라오는 이미지를 가진 ‘솟아납니다’가 적절합니다.
- source_word: כָּרֹאשׁ
  english_pob_choice: like poison weed
  chosen_korean: 독초처럼
  alternatives_korean:
  - 쑥처럼
  - 쓴풀처럼
  - 독성 식물처럼
  lexicon: HALOT
  rationale: 식물의 정확한 동정은 불확실하므로, POB의 ‘poison weed’에 맞춰 독성 이미지를 살리는 포괄적 표현 ‘독초처럼’을 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: judgment
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  - 공의
  lexicon: HALOT
  rationale: 이 구절에서는 결과로 나타나는 공적 질서/판정의 왜곡을 뜻하므로, POB의 대안 주석처럼 ‘justice’의 아이러니를 살려 ‘정의’로 옮겼습니다.
- source_word: עַל תַּלְמֵי שָׂדָי
  english_pob_choice: on the furrows of the field
  chosen_korean: 밭의 고랑들 위에
  alternatives_korean:
  - 밭고랑 위에
  - 갈아놓은 밭의 고랑 위에
  lexicon: HALOT
  rationale: תֶּלֶם은 쟁기질로 생긴 고랑이므로, ‘밭의 고랑들 위에’가 농경 이미지를 자연스럽게 유지합니다.
theological_decisions:
- issue: מִשְׁפָּט을 ‘정의’로 옮길지 ‘심판/판결’로 옮길지
  chosen_reading: ‘정의’로 옮겨, 본문이 말하는 역설적·풍자적 의미를 살렸습니다.
  alternative_readings:
  - 심판
  - 판결
  rationale: 이 절은 거짓 맹세와 언약 파기의 결과로 사회 전체에 퍼지는 왜곡을 묘사하므로, 긍정적 가치어인 ‘정의’를 유지해야 예언적 아이러니가 드러납니다.
  doctrine_reference: Translation philosophy §5 (핵심어 일관성 및 문맥에 따른 문서화된 예외)
