  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
  footnotes:
  - marker: a
    text: Or, 'because we do not fear the LORD' or 'because we have not feared the LORD.' The Hebrew perfect may describe either their settled condition or their culpable past failure.
    reason: lexical_alternative
  - marker: b
    text: Or, 'what will he do for us?' The Hebrew form is formally future; the main text renders the rhetorical sense of inability.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그들은 말할 것입니다. 「우리에게는 왕이 없습니다. 우리가 야훼를 두려워하지 않았기 때문입니다[a]. 왕이 우리를 위해 무엇을 할 수 있겠습니까?[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리가 야훼를 두려워하지 않기 때문입니다’ 혹은 ‘우리가 야훼를 두려워해 오지 않았기 때문입니다.’ 히브리어 완료형은 그들의 굳어진 상태나 책임 있는 과거의 실패를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘왕이 우리를 위해 무엇을 하겠습니까?’ 히브리어 형태는 형식상 미래이지만, 본문은 수사적으로 왕의 무능력을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  english_pob_choice: For now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 지금
  - 이에 이제
  lexicon: HALOT
  rationale: 문맥상 뒤따르는 말의 원인을 설명하는 도입이므로 ‘그러므로’로 앞선 문맥과 연결하고, ‘עַתָּה’는 자연스러운 현재·임박성 표현인 ‘이제’로 옮겼습니다.
- source_word: יֹאמְרוּ
