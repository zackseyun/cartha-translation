source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
  footnotes:
  - marker: a
    text: Or, 'because we do not fear the LORD' or 'because we have not feared the LORD.' The Hebrew perfect may describe either their settled condition or their culpable past failure.
    reason: lexical_alternative
  - marker: b
    text: Or, 'what will he do for us?' The Hebrew form is formally future; the main text renders the rhetorical sense of inability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 그들은 말할 것입니다. 「우리에게는 왕이 없습니다. 이는 우리가 야훼를 두려워하지 않았기 때문입니다. 왕이 우리를 위해 무엇을 하겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리가 야훼를 두려워하지 않기 때문입니다’ 혹은 ‘우리가 야훼를 두려워해 오지 않았기 때문입니다.’ 히브리어 완료형은 그들의 굳어진 상태나 책임 있는 과거 실패를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘왕이 우리를 위해 무엇을 하겠습니까?’ 히브리어 형태는 형식상 미래이지만, 본문은 수사적 무능력의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  english_pob_choice: For now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 지금
  - 이에 이제
  lexicon: HALOT
  rationale: 문맥상 뒤따르는 말의 원인을 설명하는 도입이므로 ‘그러므로’로 앞선 문맥과 연결하고, ‘עַתָּה’는 자연스러운 현재·임박성 표현인 ‘이제’로 옮겼습니다.
- source_word: יֹאמְרוּ
  english_pob_choice: they will say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말합니다
  - 말하리라
  lexicon: HALOT
  rationale: 예언적 미래로 쓰인 미완료형을 한국어 미래 종결로 옮겨, 장차 나타날 고백이라는 점을 드러냈습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기를 전통적 대체어가 아니라 프로젝트 기본값인 ‘야훼’로 옮겨, 고유한 이름성을 보존했습니다.
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  english_pob_choice: what can he do for us?
  chosen_korean: 왕이 우리를 위해 무엇을 하겠습니까?
  alternatives_korean:
  - 왕이 우리를 위해 무엇을 할 수 있겠습니까?
  - 왕이 우리에게 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 무능력·무력함을 살리기 위해 단순 미래보다 실제 효력을 묻는 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘야훼를 두려워하지 않았다’의 뉘앙스
  chosen_reading: ‘두려워하지 않았다’를 본문에 유지했습니다.
  alternative_readings:
  - 야훼를 공경하지 않았다
  - 야훼를 경외하지 않았다
  rationale: 히브리어 ירא는 단순 존중보다 언약적 경외와 순종의 결여를 포함하므로, 그 긴장을 약화시키지 않기 위해 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 신학적 긴장 보존'
