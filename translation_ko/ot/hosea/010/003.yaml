  rationale: 예언적 미래로 쓰인 미완료형을 한국어 미래 종결로 옮겨, 장차 나타날 고백이라는 점을 드러냈습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기를 전통적 대체어가 아니라 프로젝트 기본값인 ‘야훼’로 옮겨, 고유한 이름성을 보존했습니다.
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  english_pob_choice: what can he do for us?
  chosen_korean: 왕이 우리를 위해 무엇을 하겠습니까?
  alternatives_korean:
  - 왕이 우리를 위해 무엇을 할 수 있겠습니까?
  - 왕이 우리에게 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 무능력·무력함을 살리기 위해 단순 미래보다 실제 효력을 묻는 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘야훼를 두려워하지 않았다’의 뉘앙스
  chosen_reading: ‘두려워하지 않았다’를 본문에 유지했습니다.
  alternative_readings:
  - 야훼를 공경하지 않았다
  - 야훼를 경외하지 않았다
  rationale: 히브리어 ירא는 단순 존중보다 언약적 경외와 순종의 결여를 포함하므로, 그 긴장을 약화시키지 않기 위해 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 신학적 긴장 보존'
