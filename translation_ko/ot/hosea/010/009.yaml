id: HOS.10.9
reference: Hosea 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
  footnotes:
  - marker: a
    text: Or, 'The war against the children of iniquity in Gibeah did not overtake them,' or, 'shall not overtake them.' The Hebrew of this clause is difficult.
    reason: alternative_reading
  - marker: b
    text: Gibeah recalls the outrage and civil war in Judges 19–21, which Hosea uses as a paradigm of Israel's deep-rooted corruption.
    reason: cross_reference
translation:
  language: ko
  text: 기브아의 날들부터 너는 죄를 지었습니다, 이스라엘아. 거기에서 그들은 머물러 있었습니다. 기브아에서, 불의의 자녀들에게 닥칠 전쟁이 그들을 따라잡지 않겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기브아의 불의의 자녀들에 대한 전쟁이 그들을 따라잡지 않았다’ 혹은 ‘따라잡지 않을 것이다.’ 이 히브리어 절은 어렵습니다.
    reason: alternative_reading
  - marker: b
    text: 기브아는 사사기 19–21장의 만행과 내전 을 떠올리게 하며, 호세아는 이를 이스라엘의 깊이 뿌리박힌 부패의 전형으로 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: מִימֵי הַגִּבְעָה
  english_pob_choice: From the days of Gibeah
  chosen_korean: 기브아의 날들부터
  alternatives_korean:
  - 기브아 때부터
  - 기브아의 날로부터
  lexicon: HALOT
  rationale: מן + ימים의 시간적 출발점을 살리되, 한국어에서 자연스러운 서술어 앞 위치를 위해 간결하게 옮겼습니다.
- source_word: חָטָאתָ יִשְׂרָאֵל
  english_pob_choice: you have sinned, O Israel
  chosen_korean: 너는 죄를 지었습니다, 이스라엘아
  alternatives_korean:
  - 네가 죄를 지었습니다, 이스라엘아
  - 이스라엘아, 네가 죄를 지었습니다
  lexicon: HALOT
  rationale: 직접적인 예언자적 책망을 살리기 위해 2인칭 단수로 옮겼고, 합쇼체를 유지했습니다.
- source_word: עָמָדוּ
  english_pob_choice: they have remained
  chosen_korean: 그들은 머물러 있었습니다
  alternatives_korean:
  - 그들은 서 있었습니다
  - 그들은 계속 서 있었습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘서다’보다 지속된 상태를 드러내는 ‘머물러 있다’가 더 적절하여, POB의 durative 판단을 반영했습니다.
- source_word: בְּנֵי עַלְוָה
  english_pob_choice: the children of iniquity
  chosen_korean: 불의의 자녀들
  alternatives_korean:
  - 죄악의 자녀들
  - 불법의 자녀들
  - 악인들
  lexicon: HALOT
  rationale: 히브리어 관용구의 도덕적 성격을 보존하되, ‘자녀들’이라는 비유적 표현을 유지해 호세아의 예언적 어조를 살렸습니다.
theological_decisions:
- issue: 난해한 종결절 לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה의 한국어 처리
  chosen_reading: 질문형으로 옮겨, ‘기브아에서, 불의의 자녀들에게 닥칠 전쟁이 그들을 따라잡지 않겠습니까?’라고 했습니다.
  alternative_readings:
  - 기브아에서 불의의 자녀들에 대한 전쟁이 그들을 따라잡지 않았습니다
  - 기브아에서 불의의 자녀들에 대한 전쟁이 그들을 따라잡지 않을 것입니다
  rationale: 히브리어의 통사적 난점을 그대로 드러내면서도 예언적 경고의 힘을 살리기 위해, POB의 해석을 따라 수사적 질문으로 처리했습니다.
  doctrine_reference: '번역 원칙: 본문의 긴장과 난해함을 해소하지 말고 보존한다'
