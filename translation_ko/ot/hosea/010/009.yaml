  source_fidelity: 핵심 의미와 난해한 종결절의 수사 의문문 처리는 원문 및 영어 POB의 선택을 대체로 따릅니다. 그러나 ‘기브아의 날들부터’는 현대 한국어에서 부자연스럽고, 마지막 절의 ‘불의의 자녀들에게 닥칠 전쟁’은 히브리어의 עַל(‘~을 치는/대적하는’) 관계를 ‘~에게 닥치는’ 것으로 바꾸어 의미 관계를 흐립니다.
  naturalness: ‘기브아 시대부터’와 ‘거기에 그대로 머물러 있습니다’가 자연스러운 현대 표준어 합쇼체입니다. 또한 전쟁이 ‘그들을 따라잡는다’는 표현은 한국어에서 다소 어색하므로 ‘그들에게 닥치다’로 자연화하되, 전쟁의 대상은 ‘불의의 자녀들을 치는’으로 명시합니다.
  terminology: ‘기브아’, ‘이스라엘’, ‘불의의 자녀들’은 유지할 수 있습니다. ‘불의의 자녀들’은 히브리어의 비유적 구성 표현을 보존합니다.
