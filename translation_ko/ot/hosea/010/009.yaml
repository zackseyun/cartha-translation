revisions:
- from: 기브아의 날들부터 너는 죄를 지었습니다, 이스라엘아. 거기에서 그들은 머물러 있었습니다. 기브아에서, 불의의 자녀들에게 닥칠 전쟁이 그들을 따라잡지 않겠습니까?[a][b]
