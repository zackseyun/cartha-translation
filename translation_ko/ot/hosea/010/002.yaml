  verdict: revise
  source_fidelity: ‘죄책을 져야 합니다’는 יֶאְשָׁמוּ의 심판 선언을 의무 표현으로 바꾸므로 미래의 결과/유죄 상태로 고쳐야 합니다. מַצֵּבוֹת은 우상 자체라기보다 제의에 쓰인 세운 돌기둥이므로 ‘우상 기둥’은 과도하게 특정합니다. ‘그분’은 원문의 대명사가 남겨 둔 행위자에 관한 여지를 다소 좁히므로 ‘그가’가 더 적절합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, 예언적 심판 선언에 맞는 자연스러운 미래 표현을 사용합니다. ‘세운 돌기둥’은 다소 설명적이지만 문화적으로 특정된 물건을 자연스럽고 정확하게 전달합니다.
  terminology: ‘마음’, ‘제단’, ‘죄책’, ‘세운 돌기둥’을 사용했습니다. ‘세운 돌기둥’은 מַצֵּבוֹת의 물질적·제의적 의미를 보존하면서 특정한 ‘우상’과 동일시하지 않습니다.
  issues:
