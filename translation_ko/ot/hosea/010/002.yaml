id: HOS.10.2
reference: Hosea 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
  footnotes:
  - marker: a
    text: Or 'Their heart is smooth/deceitful.' The Hebrew verb can carry the idea of smoothness or slipperiness, yielding the sense of insincerity; here it is rendered 'divided' because the context emphasizes split loyalty.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be held guilty' or 'they will suffer for their guilt.'
    reason: lexical_alternative
  - marker: c
    text: '''Sacred pillars'' refers to cultic standing stones used in worship.'
    reason: cultural_note
translation:
  language: ko
  text: 그들의 마음은 나뉘어 있습니다[a]. 이제 그들은 자기 죄책을 져야 합니다[b]. 그분이 친히 그들의 제단을 무너뜨리시고, 그들의 우상 기둥을 파괴하실 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나뉘어 있습니다’는 문자적 ‘smooth/divided’의 가능성 가운데, 문맥이 요구하는 ‘양분된 충성’의 뜻을 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘유죄가 되다/죄책을 지다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우상 기둥’은 예배에 사용된 세운 돌기둥을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק לִבָּם
  english_pob_choice: Their heart is divided
  chosen_korean: 그들의 마음은 나뉘어 있습니다
  alternatives_korean:
  - 그들의 마음은 분열되어 있습니다
  - 그들의 마음은 갈라져 있습니다
  - 그들의 심장은 나뉘어 있습니다
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 내면 전체를 가리키므로 ‘마음’을 유지하고, חָלַק의 분열된 상태를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יֶאְשָׁמוּ
  english_pob_choice: they will bear guilt
  chosen_korean: 그들은 자기 죄책을 져야 합니다
  alternatives_korean:
  - 그들은 유죄 판결을 받을 것입니다
  - 그들은 죄책을 지게 될 것입니다
  - 그들은 죄를 담당하게 될 것입니다
  lexicon: HALOT
  rationale: אשׁם은 ‘유죄가 되다’와 ‘죄의 결과를 감당하다’의 뜻을 함께 가질 수 있어, ‘죄책을 지다’로 책임과 형벌의 뉘앙스를 함께 살렸습니다.
- source_word: הוּא יַעֲרֹף ... יְשֹׁדֵד
  english_pob_choice: He himself will tear down ... he will devastate
  chosen_korean: 그분이 친히 ... 무너뜨리시고 ... 파괴하실 것입니다
  alternatives_korean:
  - 그가 ... 허무시고 ... 황폐하게 하실 것입니다
  - 그분이 ... 끊어버리시고 ... 약탈하실 것입니다
  - 그분이 ... 찍어내리시고 ... 멸하실 것입니다
  lexicon: HALOT
  rationale: יַעֲרֹף는 문자적으로는 ‘목을 꺾다’에 가깝지만 제단에 대해선 파괴의 관용적 표현이 적절하므로 ‘무너뜨리시고’로 옮겼고, יְשֹׁדֵד는 ‘약탈하다’보다 파괴 행위가 분명한 ‘파괴하다’를 택했습니다.
- source_word: מַצֵּבוֹתָם
  english_pob_choice: their sacred pillars
  chosen_korean: 그들의 우상 기둥
  alternatives_korean:
  - 그들의 기둥
  - 그들의 세운 돌기둥
  - 그들의 성스러운 기둥
  lexicon: HALOT
  rationale: מַצֵּבוֹת은 예배에 쓰인 세운 돌기둥을 가리키므로, 우상 숭배 문맥을 분명히 하되 현대 독자가 이해하기 쉽도록 ‘우상 기둥’으로 옮겼습니다.
theological_decisions:
- issue: 문장 중 ‘그분’의 지시 대상
  chosen_reading: 문맥상 야훼께서 심판 행위의 주체이므로, 인칭 대명사를 ‘그분’으로 옮겨 하나님의 직접적 심판 행위를 드러냈습니다.
  alternative_readings:
  - 익명의 심판 도구를 주어로 볼 수 있음
  - 단순히 ‘그가’로 옮길 수 있음
  rationale: 호세아서의 심판 문맥에서는 하나님이 최종 행위자이므로, 본문이 가진 신학적 무게를 약화시키지 않도록 직접적 주체성을 살렸습니다.
  doctrine_reference: 예언서의 심판 주체는 종종 도구적 행위자를 넘어 하나님 자신으로 읽는다.
