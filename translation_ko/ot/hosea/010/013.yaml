id: HOS.10.13
reference: Hosea 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲרַשְׁתֶּם רֶ֛שַׁע עַוְלָ֥תָ/ה קְצַרְתֶּ֖ם אֲכַלְתֶּ֣ם פְּרִי כָ֑חַשׁ כִּֽי בָטַ֥חְתָּ בְ/דַרְכְּ/ךָ֖ בְּ/רֹ֥ב גִּבּוֹרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
  footnotes:
  - marker: a
    text: Or 'falsehood' or 'lies' for 'deceit.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from plural verbs ('you have plowed/reaped/eaten') to singular forms ('you trusted ... your way ... your warriors'), likely addressing Israel as a collective singular.
    reason: cultural_note
  - marker: c
    text: Or 'your mighty men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 악을 갈고 불의를 거두었으며, 속임수의 열매를 먹었습니다. 이는 네가 네 길을 의지하고, 네 용사들의 무리를 의지했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속임수’는 ‘거짓’ 또는 ‘거짓말’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 단수형으로 바뀌어 이스라엘을 집단적 단수로 부릅니다.
    reason: cultural_note
  - marker: c
    text: ‘네 용사들’ 또는 ‘네 강한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרַשְׁתֶּם רֶשַׁע
  english_pob_choice: you have plowed wickedness
  chosen_korean: 악을 갈다
  alternatives_korean:
  - 악을 경작하다
  - 악을 밭갈다
  lexicon: HALOT
  rationale: 농경 은유를 그대로 살려 ‘갈다’로 옮기면 뒤따르는 ‘거두다’, ‘먹다’와의 연쇄가 유지됩니다. ‘악’은 도덕적 악행의 직접성을 드러냅니다.
- source_word: עַוְלָתָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 부정
  - 불의로움
  lexicon: HALOT
  rationale: 앞의 ‘악’과 구별되면서도 사회적·도덕적 굴곡을 함께 담는 말로 ‘불의’가 가장 자연스럽습니다.
- source_word: כָּחַשׁ
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 거짓
  - 기만
  - 거짓말
  lexicon: HALOT
  rationale: 열매의 비유에 맞게 결과물처럼 먹는 대상으로 들리도록 ‘속임수’로 옮겼습니다. 단순한 발화의 거짓말보다 더 넓은 기만의 뉘앙스를 살립니다.
- source_word: בְּדַרְכְּךָ
  english_pob_choice: in your way
  chosen_korean: 네 길
  alternatives_korean:
  - 네 방식
  - 네 행로
  - 네 행위의 길
  lexicon: HALOT
  rationale: 이스라엘의 자기 선택한 삶의 방향, 정책, 행보를 포괄하는 표현으로 ‘길’을 유지하는 것이 히브리어 은유를 가장 잘 보존합니다.
- source_word: גִּבּוֹרֶיךָ
  english_pob_choice: your warriors / your mighty men
  chosen_korean: 네 용사들의 무리
  alternatives_korean:
  - 네 용사들
  - 네 강한 자들
  - 네 군사들
  lexicon: HALOT
  rationale: 군사력에 대한 의존을 드러내면서도 단순한 개인 명단이 아니라 집합적 규모를 보이기 위해 ‘무리’를 덧붙였습니다.
theological_decisions:
- issue: 2인칭 복수에서 단수로의 전환
  chosen_reading: 문맥상 이스라엘을 집단적 단수로 부르는 것으로 보고, 앞부분의 ‘너희는’과 뒤의 ‘네가/네’ 사이의 전환을 그대로 살렸습니다.
  alternative_readings:
  - 모두를 일관되게 복수로 평준화
  - 한국어에서 번호 전환을 완전히 숨기기
  rationale: 히브리어 예언 문체의 수사적 전환을 지우지 않고, 공동체 전체에 대한 책망이라는 효과를 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve the source''s sense without paraphrase beyond what the text warrants.'
