id: HOS.10.5
reference: Hosea 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עֶגְלוֹת֙ בֵּ֣ית אָ֔וֶן יָג֖וּרוּ שְׁכַ֣ן שֹֽׁמְר֑וֹן כִּי אָבַ֨ל עָלָ֜י/ו עַמּ֗/וֹ וּ/כְמָרָי/ו֙ עָלָ֣י/ו יָגִ֔ילוּ עַל כְּבוֹד֖/וֹ כִּֽי גָלָ֥ה מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: ko
  text: 사마리아 주민들은 벧아웬의 송아지들 때문에 떨며, 그 백성은 그것으로 말미암아 슬퍼하고, 그 우상 제사장들은 그것으로 말미암아, 그 영광 때문에 통곡합니다. 그것이 그들에게서 떠났기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: לְ/עֶגְלוֹת֙
  english_pob_choice: the calves
  chosen_korean: 송아지들
  alternatives_korean:
  - 송아지
  - 황소상
  - 송아지 우상
  lexicon: עֵגֶל
  rationale: 우상숭배 대상인 צעיר 소형 형상을 가리키므로, 문맥상 단순한 가축이 아니라 우상으로 쓰인 ‘송아지들’로 옮겼습니다.
- source_word: בֵּ֣ית אָ֔וֶן
  english_pob_choice: Beth-aven
  chosen_korean: 벧아웬
  alternatives_korean:
  - 벧엘
  - 허무의 집
  lexicon: בֵּית־אָוֶן
  rationale: 지명형을 보존하되, 본문이 이미 풍자적 지명 ‘벧아웬’을 사용하므로 음역을 유지했습니다.
- source_word: יָג֖וּרוּ / יָגִ֔ילוּ
  english_pob_choice: tremble ... wail
  chosen_korean: 떨며 ... 통곡합니다
  alternatives_korean:
  - 두려워합니다 ... 기뻐합니다
  - 전율하며 ... 울부짖습니다
  lexicon: גור / גיל
  rationale: 먼저는 두려움의 떨림을, 뒤는 POB가 채택한 ‘wail’을 반영해 강한 애도·비탄의 어조인 ‘통곡합니다’로 옮겼습니다.
- source_word: כְּמָרָי/ו
  english_pob_choice: its idolatrous priests
  chosen_korean: 우상 제사장들
  alternatives_korean:
  - 제사장들
  - 우상 사제들
  - 이교 제사장들
  lexicon: כֹּמֵר
  rationale: כֹּמֵר의 종교적·우상 숭배적 뉘앙스를 살리기 위해 ‘우상 제사장들’로 번역했습니다.
theological_decisions:
- issue: ‘그 영광’의 지시 대상
  chosen_reading: 송아지 우상의 ‘영광’으로 이해하여, 그것이 떠남으로써 우상의 영광이 사라졌다는 아이러니를 드러냈습니다.
  alternative_readings:
  - 사마리아의 영광
  - 하나님의 영광
  rationale: 문맥상 ‘그것’과 연결된 대상은 벧아웬의 송아지이므로, 우상에 부여된 거짓 영광이 사라진다는 풍자 구조를 보존해야 합니다.
  doctrine_reference: Hosea 10:5의 문맥상 우상 비판
