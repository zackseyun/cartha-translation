source:
  edition: WLC
  text: זִרְע֨וּ לָ/כֶ֤ם לִ/צְדָקָה֙ קִצְר֣וּ לְ/פִי חֶ֔סֶד נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/עֵת֙ לִ/דְר֣וֹשׁ אֶת יְהוָ֔ה עַד יָב֕וֹא וְ/יֹרֶ֥ה צֶ֖דֶק לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
  footnotes:
  - marker: a
    text: Or 'fallow ground.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until he comes and teaches you righteousness.' The Hebrew verb can mean 'teach,' but the farming imagery in this verse favors 'rains.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 자신을 위하여 의를 심고, 인애에 따라 거두십시오. 너희는 자신을 위하여 묵힌 땅[a]을 갈아엎으십시오. 이제 야훼를 찾을 때입니다. 그분께서 오셔서 너희에게 의를 비처럼 내리실[b] 때까지 야훼를 찾으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈지 않은 땅’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분께서 오셔서 너희에게 의를 가르치실 때까지’. 히브리어 동사는 ‘가르치다’를 뜻할 수도 있지만, 이 절의 농경 이미지는 ‘비처럼 내리다’를 더 강하게 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִרְעוּ
  english_pob_choice: Sow
  chosen_korean: 심고
  alternatives_korean:
  - 뿌리고
  - 파종하고
  lexicon: HALOT
  rationale: 농경 비유를 살리되 현대 한국어에서 자연스러운 동사로 옮겼습니다. '심다'는 씨 뿌림의 행위를 충분히 담으면서도 문맥의 권면체와 잘 맞습니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 너희 자신을 위해
  alternatives_korean:
  - 너희를 위해
  - 너희에게
  lexicon: HALOT
  rationale: 반복되는 여격이 자기 책임과 자기 유익을 강조하므로, 단순한 '너희에게'보다 반사적·수혜적 뉘앙스를 드러냈습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 자비
  - 언약적 사랑
  lexicon: HALOT
  rationale: חסד의 언약적·관계적 두께를 살리기 위해 한국 교회어에서 널리 쓰이지만 다소 전문적인 '인애'를 택했습니다. 단순 감정적 사랑으로 약화시키지 않기 위함입니다.
- source_word: נִיר
  english_pob_choice: unplowed ground
  chosen_korean: 묵은 땅
  alternatives_korean:
  - 갈지 않은 땅
  - 휴경지
  lexicon: HALOT
  rationale: 개역 전통의 표현을 무비판적으로 따르기보다, כאן의 농경 이미지인 '갈지 않은/다듬어지지 않은 땅'을 현대어로 분명하게 전달하는 쪽을 택했습니다.
theological_decisions:
- issue: וְיֹרֶה צֶדֶק의 의미
  chosen_reading: 문맥상 '의를 내리실'로 옮겨, 야훼께서 비처럼 의를 베푸시는 농경 은유를 살렸습니다.
  alternative_readings:
  - '''의를 가르치실'''
  rationale: 문맥 전체가 심기, 거두기, 땅을 가는 농경 비유로 이어지므로 '가르치다'보다 '내리다/비처럼 주다'가 더 일관됩니다. 다만 히브리어 동사의 의미 범위는 열어 두어야 합니다.
  doctrine_reference: 문맥 우선 원칙과 다의어 보존을 함께 적용합니다.
