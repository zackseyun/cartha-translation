  naturalness: 합쇼체는 적절합니다. 그러나 ‘야훼를 찾을 때가 이르렀으니 … 그러하십시오’는 ‘그러하다’의 지시 대상과 ‘~때까지’의 수식 범위가 다소 불명확합니다. 이를 직접적인 명령으로 풀면 현대 한국어에서 더 자연스럽고 명료합니다.
  terminology: ‘의’, ‘인애’, ‘야훼’는 일관되고 적절합니다. ‘묵은 땅’은 관습적인 표현이지만 현대어에서 오래된 땅으로 오해될 여지가 있어, 휴경·미경작의 뜻을 더 잘 드러내는 ‘묵힌 땅’이 적절합니다. ‘의를 비처럼 내리실’은 ירה의 강우 이미지를 한국어로 분명히 살립니다.
