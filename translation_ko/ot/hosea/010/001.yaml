source:
  edition: WLC
  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
  footnotes:
  - marker: a
    text: Or, 'Israel is an emptying vine' or 'a spreading vine.' The Hebrew adjective is difficult; the main text follows the sense favored by the context of abundant fruit and prosperous land.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he brings forth fruit for himself.' The Hebrew may carry a reflexive or self-serving nuance.
    reason: lexical_alternative
  - marker: c
    text: Or, 'standing stones' or 'cult pillars.' These were stone monuments used in worship, here in a condemned idolatrous setting.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘은 무성한 포도나무이며 자신을 위해 열매를 맺습니다[a][b]. 그의 열매가 많아질수록 그는 제단들을 더 많이 늘렸고, 그의 땅이 좋아질수록 그들은 제의 돌기둥들을 더욱 아름답게 꾸몄습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘은 비워지는 포도나무’ 혹은 ‘퍼져 나가는 포도나무’로 옮길 수 있습니다. 히브리어 형용사의 뜻은 확실하지 않지만, 풍성한 열매와 번성한 땅을 언급하는 문맥에 따라 본문은 ‘무성한’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 열매를 맺습니다’로 옮길 수 있습니다. 히브리어는 반사적 또는 자기이익적 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세운 돌들’ 또는 ‘숭배 기둥들’로 옮길 수 있습니다. 이는 예배에 쓰인 돌기둥으로, 여기서는 정죄되는 우상 숭배의 맥락에 놓여 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  english_pob_choice: luxuriant vine
  chosen_korean: 열매를 맺는 무성한 포도나무
  alternatives_korean:
  - 무성한 포도나무
  - 퍼져 나가는 포도나무
  - 텅 빈 포도나무
  lexicon: HALOT
  rationale: 문맥상 번성한 포도나무의 이미지가 뒤의 풍성한 열매와 맞물리므로 ‘무성한 포도나무’로 살리고, ‘열매를 맺는’으로 이어지는 역설적 풍요를 드러냈습니다.
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  english_pob_choice: yields fruit for himself
  chosen_korean: 자기의 열매를 맺습니다
  alternatives_korean:
  - 자기 자신을 위해 열매를 맺습니다
  - 자기에게 유익하도록 열매를 맺습니다
  - 열매를 자기에게 돌립니다
  lexicon: HALOT
  rationale: 직역하면 반사/자기이익 뉘앙스가 있지만, 포도나무 비유를 자연스럽게 유지하려고 본문에서는 ‘자기의 열매’로 두고, 자기지향성은 바로 뒤의 우상화 결과로 드러나게 했습니다.
- source_word: כְּרֹב לְפִרְיוֹ הִרְבָּה לַמִּזְבְּחוֹת
  english_pob_choice: The more his fruit increased, the more he multiplied altars
  chosen_korean: 그의 열매가 많아질수록 그는 제단들을 더 많이 세웠고
  alternatives_korean:
  - 그의 열매가 많아질수록 그는 제단들을 더 늘렸고
  - 열매가 많을수록 그는 제단들을 더 많게 했고
  lexicon: HALOT
  rationale: 비례 구조 ‘~할수록’과 히필의 ‘늘리다/많게 하다’를 살려, 우상 숭배의 증가가 번성과 함께 진행된다는 점을 분명히 했습니다.
- source_word: מַצֵּבוֹת
  english_pob_choice: sacred pillars
  chosen_korean: 우상 기둥들
  alternatives_korean:
  - 기둥들
  - 세운 돌들
  - 거룩한 기둥들
  lexicon: HALOT
  rationale: 이 표지는 예배용 석조물이지만 문맥상 정죄되는 우상 숭배의 대상이므로, 현대 독자가 기능을 즉시 이해하도록 ‘우상 기둥들’로 옮겼습니다.
theological_decisions:
- issue: 본문 첫머리의 포도나무 형상과 뒤이은 정죄의 관계
  chosen_reading: 이스라엘의 번성과 풍요가 오히려 제단과 우상 기둥을 늘리는 데 사용된다는 예언자적 역설로 읽었습니다.
  alternative_readings:
  - 첫 구를 ‘텅 빈 포도나무’로 읽는 해석
  rationale: 열매, 땅의 좋음, 제단의 증가가 연속으로 나타나므로, 풍요 자체가 아니라 그 풍요의 오용을 고발하는 구조를 보존하는 것이 문맥에 가장 적합합니다.
  doctrine_reference: Translation philosophy §1, §3
