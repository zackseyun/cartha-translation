revisions:
- from: 이스라엘은 열매를 맺는 무성한 포도나무로서 자기의 열매를 맺습니다[a]. 그의 열매가 많아질수록 그는 제단들을 더 많이 세웠고, 그의 땅이 좋아질수록 그들은 우상 기둥들을 더 좋게 만들었습니다[b][c].
  to: 이스라엘은 무성한 포도나무이며 자신을 위해 열매를 맺습니다[a][b]. 그의 열매가 많아질수록 그는 제단들을 더 많이 늘렸고, 그의 땅이 좋아질수록 그들은 제의 돌기둥들을 더욱 아름답게 꾸몄습니다[c].
  rationale: 첫 구의 포도나무 형상과 열매 맺음의 술어를 분리하여 히브리어의 구조를 더 충실히 반영했습니다. לּוֹ의 자기지향적 뉘앙스를 본문에 살리고, מַצֵּבוֹת는 특정 교리적 규정 없이 제의적 돌기둥으로 옮겼습니다. 각주 표지를 해당 어구에 맞게 재배치하고 영어 잔재를 한국어로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
