id: HOS.10.8
reference: Hosea 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
  footnotes:
  - marker: a
    text: Or 'the high places of wickedness.' Hebrew aven can function as a place-name and also mean 'wickedness' or 'iniquity,' likely with intentional wordplay here.
    reason: alternative_reading
translation:
  language: ko
  text: 아웬[a]의 산당들은, 곧 이스라엘의 죄는 멸망할 것입니다. 가시와 엉겅퀴가 그들의 제단들 위에 자라날 것이며, 그들은 산들에게는 「우리를 덮어라!」 하고, 언덕들에게는 「우리 위에 무너져라!」 하고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악의 산당들’로 옮길 수 있습니다. 히브리어 אָוֶן은 여기서 지명처럼도, ‘악’ 또는 ‘죄악’이라는 뜻으로도 읽힐 수 있어 의도적인 말놀이가 있을 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת אָוֶן
  english_pob_choice: the high places of Aven
  chosen_korean: 아웬의 산당은
  alternatives_korean:
  - 아웬의 높은 곳은
  - 아웬의 제의적 산당은
  lexicon: HALOT
  rationale: בָּמוֹת는 제의적 장소를 가리키므로 보편적인 ‘산당’을 택했고, אָוֶן은 POB의 선택을 따라 고유지명처럼 처리하되 한국어에서는 소유격으로 자연스럽게 연결했습니다.
- source_word: חַטַּאת יִשְׂרָאֵל
  english_pob_choice: the sin of Israel
  chosen_korean: 이스라엘의 죄
  alternatives_korean:
  - 이스라엘의 죄악
  - 이스라엘의 죄 제물
  lexicon: HALOT
  rationale: 문맥상 חַטַּאת은 ‘죄’로 읽는 것이 가장 자연스럽고, 제의적 ‘속죄제/속제물’ 의미는 이 자리에서 맞지 않아 배제했습니다.
- source_word: ק֣וֹץ וְדַרְדַּ֔ר
  english_pob_choice: thorn and thistle
  chosen_korean: 가시와 엉겅퀴
  alternatives_korean:
  - 가시와 잡초
  - 가시덤불과 엉겅퀴
  lexicon: HALOT
  rationale: 황폐와 저주의 이미지를 살리는 표준 식물군 표현으로 옮겼고, 단수 집합적 뉘앙스는 한국어 자연성을 위해 복수 표지를 두드러지게 하지 않았습니다.
- source_word: כַּסּ֔וּ/נוּ
  english_pob_choice: Cover us!
  chosen_korean: 우리를 덮어라!
  alternatives_korean:
  - 우리를 가려라!
  - 우리를 숨겨라!
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘덮다’이므로 직설적 명령형으로 옮겨, 종말적 심판 앞의 절박한 요청을 보존했습니다.
theological_decisions:
- issue: אָוֶן을 지명으로 유지할지, ‘악/죄악’의 일반명사로 풀지 여부
  chosen_reading: 주본문에서는 ‘아웬’으로 유지했습니다.
  alternative_readings:
  - ‘악의 산당’
  - ‘죄악의 산당’
  rationale: 히브리어는 지명과 조롱적 의미를 함께 품을 수 있어, 본문에서는 POB의 선택을 따라 지명 감각을 살리고 의미의 중첩은 독자가 인지하도록 남겨 두는 편이 더 충실합니다.
  doctrine_reference: '번역 원칙 3: 문맥이 허용하는 신학적 긴장을 해소하지 말고 보존합니다.'
