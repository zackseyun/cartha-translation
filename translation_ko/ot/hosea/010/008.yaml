  source_fidelity: 히브리어의 기본 의미와 절 구조는 대체로 잘 반영했습니다. 다만 בָּמוֹת와 נִשְׁמְדוּ는 모두 복수이므로 ‘산당들은’으로 일치시키는 것이 정확하며, נִשְׁמְדוּ는 단순히 붕괴하는 것보다 심판으로 ‘멸망하다/파괴되다’라는 뜻이 더 분명합니다. מִזְבְּחוֹתָם의 복수도 ‘제단들’로 드러내는 편이 충실합니다.
  naturalness: 합쇼체 문체와 인용 명령문의 긴박감은 자연스럽습니다. 다만 ‘아웬의 산당은, 곧 이스라엘의 죄는’은 주제 표지가 중복되고 수 일치가 어색합니다. ‘아웬의 산당들은, 곧 이스라엘의 죄는’으로 정리하면 자연스럽고 원문의 동격 관계도 유지됩니다.
  terminology: ‘산당’, ‘아웬’, ‘가시와 엉겅퀴’, ‘제단’, ‘덮어라’는 적절합니다. אָוֶן의 지명성과 ‘악/죄악’의 의미 중첩을 알리는 각주는 본문에서 ‘아웬’ 바로 뒤에 붙여야 해당 어휘를 정확히 가리킵니다.
