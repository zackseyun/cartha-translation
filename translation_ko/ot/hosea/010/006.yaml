  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
  footnotes:
  - marker: a
    text: Hebrew 'King Yareb.' The name may instead be understood as a title such as 'the avenging king' or 'the contending king.'
    reason: alternative_reading
  - marker: b
    text: Or 'because of his counsel' / 'because of its plan.' The Hebrew may refer to Israel's own policy or counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것도 아시리아로 예물로 실려 갈 것입니다. 야레브 왕에게 드려질 것입니다. 에브라임은 수치를 받을 것이며, 이스라엘은 자기 계획 때문에 부끄러워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야레브 왕’. 이 이름은 ‘복수하는 왕’ 또는 ‘다투는 왕’ 같은 칭호로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 계획 때문에’ / ‘그것의 계획 때문에’. 히브리어는 이스라엘 자신의 정책이나 계획을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 그것도
  alternatives_korean:
  - 심지어
  - 또한
  lexicon: HALOT
  rationale: 문맥상 바로 앞의 금송아지/우상까지 포함하는 강조를 나타내므로, 단순한 병렬보다 강조가 살아 있는 ‘그것도’가 적절합니다.
- source_word: לְאַשּׁוּר
  english_pob_choice: to Assyria
  chosen_korean: 아시리아로
  alternatives_korean:
  - 아시리아에게
  - 아시리아를 향해
  lexicon: HALOT
  rationale: 유배가 아니라 운반의 종착점을 가리키므로 한국어에서는 방향격 ‘-로’가 자연스럽고 원문의 목적지 의미를 잘 살립니다.
- source_word: מִנְחָה
  english_pob_choice: as tribute
  chosen_korean: 예물로
  alternatives_korean:
  - 조공으로
  - 공물로
  - 제물로
  lexicon: HALOT
  rationale: 이 구절은 앗시리아 왕에게 바치는 정치적 헌납을 가리키므로 ‘예물’이 무난하되, 통치자에게 바치는 공납의 성격을 함께 담아냅니다.
- source_word: לְמֶלֶךְ יָרֵב
  english_pob_choice: for King Yareb
  chosen_korean: 야레브 왕에게
  alternatives_korean:
  - 야레브 왕을 위해
  - 야레브 왕에게 바쳐질
  - 복수하는 왕에게
  lexicon: HALOT
  rationale: יַרֵב을 설명적 번역으로 풀기보다, 프로젝트 방침에 따라 이름/칭호의 모호함을 보존해 음역했습니다.
theological_decisions:
- issue: יָרֵב의 처리
  chosen_reading: 본문에는 해석을 확정하지 않고 ‘야레브 왕’으로 음역해 모호성을 유지했습니다.
  alternative_readings:
  - ‘복수하는 왕’
  - ‘대적하는 왕’
  - 앗시리아 왕에 대한 서술적 칭호
  rationale: 히브리어 형태가 고유명처럼도, 서술적 칭호처럼도 읽힐 수 있으므로, 본문에 해석을 넣기보다 주석적 여지를 남기는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §§2–3
