  to: 그것도 아시리아로, 야레브 왕[a]에게 바치는 공물로 실려 갈 것입니다. 에브라임은 수치를 받을 것이며, 이스라엘은 자기 계책 때문에[b] 부끄러워할 것입니다.
  rationale: 원문의 단일 수동 구문을 한국어에서도 유지하고, 정치적 헌납물의 의미를 ‘공물’로 명확히 했습니다. 야레브의 정체와 마지막 접미사의 지시 대상에 관한 해석상 여지는 본문에서 과도하게 확정하지 않고 각주로 보존했습니다.
