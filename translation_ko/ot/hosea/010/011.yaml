  naturalness: ‘암송아지’는 가능하지만, 일에 익은 가축이라는 비유에서는 ‘어린 암소’가 현대 표준어에서 더 자연스럽습니다. 또한 각주 표지는 해당 어구에 붙여야 하며, 절 끝에 세 표지를 한꺼번에 붙이면 각주의 지시 대상이 불분명합니다.
