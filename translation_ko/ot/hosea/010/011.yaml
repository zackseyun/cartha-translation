  rationale: 난해한 עָבַרְתִּי עַל טוּב צַוָּארָהּ의 대안적 직역을 각주에 보존하면서, 영어 POB가 선택한 문맥적 의미인 ‘아끼다/면제하다’를 한국어 본문에 자연스럽게 반영했습니다. 또한 각주 표지를 해당 어구로 옮기고, 농경 비유와 히브리어 대명사 선행사의 모호성을 유지했습니다.
