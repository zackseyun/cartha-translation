reference: Hosea 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
  footnotes:
  - marker: a
    text: Or, 'but I passed over her lovely neck.' The Hebrew of this clause is difficult; the main text reflects the sense that Ephraim had previously been spared the heavier burden.
    reason: alternative_reading
  - marker: b
    text: Or, 'I will harness Ephraim.' Literally, 'I will cause Ephraim to ride,' likely an idiom for putting the animal under harness or yoke.
    reason: lexical_alternative
  - marker: c
    text: '''Harrow'' refers to breaking up and smoothing the soil after plowing; alternatively, ''break up the clods.'''
    reason: cultural_note
translation:
  language: ko
  text: 에브라임은 타작하기를 좋아하는 일에 익은 어린 암소였습니다. 그러나 내가 그 아름다운 목을 아꼈습니다.[a] 내가 에브라임에게 멍에를 씌우겠습니다.[b] 유다는 밭을 갈 것이며, 야곱은 그를 위하여 써레질할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 표현은 난해합니다. 본문은 에브라임의 목에 더 무거운 멍에를 아직 지우지 않으셨다는 뜻으로 옮겼습니다. 달리, “그 아름다운 목 위로 지나갔다”로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “에브라임을 타게 하겠다”에 가깝습니다. 농경 문맥에서는 동물에게 멍에를 씌워 부리다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘써레질’은 쟁기질 뒤에 흙을 부수고 고르는 작업을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  english_pob_choice: a trained heifer
  chosen_korean: 훈련된 암송아지
  alternatives_korean:
  - 길들인 암송아지
  - 배운 암송아지
  lexicon: HALOT
  rationale: 젊은 암소가 일에 익숙해진 이미지를 자연스럽게 살리되, 노동 동물의 비유를 유지하기 위해 ‘암송아지’로 옮겼습니다.
- source_word: אֹהַבְתִּי לָדוּשׁ
  english_pob_choice: that loved to thresh
  chosen_korean: 타작하기를 좋아하는
  alternatives_korean:
  - 타작하는 것을 좋아하는
  - 타작을 즐기는
  lexicon: HALOT
  rationale: 동사의 습관적 선호를 간결하게 살리기 위해 ‘-하기를 좋아하는’으로 옮겼습니다.
- source_word: עָבַרְתִּי עַל טוּב צַוָּארָהּ
  english_pob_choice: but I spared her fair neck
  chosen_korean: 그녀의 아름다운 목을 그냥 지나쳤습니다
  alternatives_korean:
  - 그녀의 아름다운 목을 아꼈습니다
  - 그녀의 아름다운 목 위로 지나갔습니다
  lexicon: HALOT
  rationale: 히브리어 표현이 관용적이고 난해하므로, 문맥상 무거운 멍에를 아직 지우지 않으신 뜻을 ‘그냥 지나쳤습니다’로 드러냈습니다.
- source_word: אַרְכִּיב אֶפְרַיִם
  english_pob_choice: I will put Ephraim to the yoke
  chosen_korean: 에브라임을 멍에에 메우겠습니다
  alternatives_korean:
  - 에브라임을 멍에에 매겠습니다
  - 에브라임에게 멍에를 씌우겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘타게 하다/타고 있게 하다’는 관용을 농경 이미지로 분명히 하되, 한국어로는 멍에를 메우는 표현이 가장 직접적입니다.
- source_word: יַחֲרֹשׁ / יְשַׂדֶּד
  english_pob_choice: Judah will plow; Jacob will harrow for him
  chosen_korean: 유다는 밭을 갈 것이며, 야곱은 그를 위해 써레질할 것입니다
  alternatives_korean:
  - 유다는 쟁기질할 것이며, 야곱은 그를 위해 써레질할 것입니다
  - 유다는 갈고, 야곱은 그를 위해 흙덩이를 부술 것입니다
  lexicon: HALOT
  rationale: ‘plow’와 ‘harrow’의 농사 단계 차이를 살리기 위해 ‘밭을 갈다’와 ‘써레질하다’를 구분해 옮겼습니다.
theological_decisions:
- issue: 농경 비유의 징계적 뉘앙스
  chosen_reading: 이 절은 에브라임을 쉬운 일에서 더 ծանր한 노동으로 옮기시는 하나님의 징계적 비유로 읽었습니다.
  alternative_readings:
  - 단순한 농사 분담 묘사로 읽을 수 있습니다.
  - ‘그녀의 아름다운 목’을 ‘지나치다’보다 더 부드럽게 이해할 수 있습니다.
  rationale: 호세아 10장의 문맥은 책망과 심판이므로, 비유의 징계성을 약화시키지 않도록 했습니다.
  doctrine_reference: 문맥 우선 해석; 징계와 심판의 예언적 수사 보존
