base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
  footnotes:
  - marker: a
    text: Shalman may refer to Shalmaneser, but the exact historical identification is uncertain.
    reason: alternative_reading
  - marker: b
    text: Or more literally, 'a mother was dashed upon children.' The Hebrew expression is terse and graphic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희 백성 가운데서 소란이 일어나고, 너희의 모든 요새가 무너질 것입니다 — 전쟁의 날에 샬만이 벧아르벨을 무너뜨렸듯이; 어머니들은 자녀들과 함께 짓밟혀 산산이 부서졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 샬만은 살만에셀을 가리킬 수 있으나, 정확한 역사적 동일시는 확정할 수 없습니다.
    reason: cross_reference
  - marker: b
    text: 더 직역하면 ‘어머니가 자녀들 위에 짓밟혔다’는 뜻입니다. 히브리어 표현은 매우 압축적이고 잔혹합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם שָׁאוֹן
  english_pob_choice: The tumult will arise
  chosen_korean: 소란이 일어나고
  alternatives_korean:
  - 폭동이 일어나고
  - 소동이 일어나고
  - 요란이 일어나고
  lexicon: WLC; HALOT
  rationale: שָׁאוֹן은 전쟁 맥락의 큰 소란·혼란을 가리키므로, 현대 한국어에서 자연스럽고 강한 표현인 ‘소란이 일어나고’로 옮겼습니다.
- source_word: בְּעַמֶּךָ
  english_pob_choice: among your people
  chosen_korean: 너희 백성 가운데서
  alternatives_korean:
  - 너희 백성 안에
  - 너희 백성 가운데
  - 너희 사람들 가운데서
  lexicon: WLC; HALOT
  rationale: ב의 범위적 용법을 살려, 소란이 ‘너희 백성 가운데서’ 터져 나온다는 뜻을 분명히 했습니다.
- source_word: מִבְצָרֶיךָ / יוּשַּׁד
  english_pob_choice: all your fortresses will be devastated
  chosen_korean: 너희의 모든 요새가 무너질 것입니다
  alternatives_korean:
  - 너희의 모든 성채가 황폐해질 것입니다
