  - 너희의 모든 견고한 성읍이 함락될 것입니다
  lexicon: WLC; HALOT
  rationale: מִבְצָר은 방어 시설을 가리키므로 ‘요새’로 옮겼고, יוּשַּׁד의 폭력적 파괴·약탈의 뉘앙스를 ‘무너질 것입니다’로 간결하게 담았습니다.
- source_word: שַׁלְמַן / בֵּית אַרְבֵאל
  english_pob_choice: Shalman devastated Beth-arbel
  chosen_korean: 샬만이 벧아르벨을 무너뜨렸듯이
  alternatives_korean:
  - 샬만이 벧아르벨을 파괴했듯이
  - 살만이 벧아르벨을 멸망시켰듯이
  - 샬만이 벧아르벨을 쳐부쉈듯이
  lexicon: WLC; HALOT
  rationale: 고유명사는 원형을 살려 음역했고, 본문이 제시하는 역사적 불확실성을 해소하지 않고 그대로 남기기 위해 설명을 덧붙이지 않았습니다.
- source_word: אֵם עַל בָּנִים רֻטָּשָׁה
  english_pob_choice: mothers were dashed to pieces with their children
  chosen_korean: 어머니들은 자녀들과 함께 짓밟혀 산산이 부서졌습니다
  alternatives_korean:
  - 어머니들은 자녀들과 함께 산산이 부서졌습니다
  - 어머니는 자녀들 위에 짓밟혀 산산이 부서졌습니다
  - 어머니들은 자녀들 위에 내동댕이쳐졌습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 압축적이고 잔혹한 표현을 살리되, 한국어에서는 모성-자녀의 동반 파괴를 분명히 하기 위해 ‘자녀들과 함께’로 옮겼습니다.
theological_decisions:
