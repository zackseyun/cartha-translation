  rationale: 본문은 전쟁 심판의 충격을 의도하므로, 정서적으로 순화하지 않고 원문의 공포를 드러내는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: preserve the source’s rhetorical force and tension'
