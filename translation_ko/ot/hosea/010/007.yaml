id: HOS.10.7
reference: Hosea 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִדְמֶ֥ה שֹׁמְר֖וֹן מַלְכָּ֑/הּ כְּ/קֶ֖צֶף עַל פְּנֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
  footnotes:
  - marker: a
    text: Or 'Samaria is destroyed'; the Hebrew verb may denote being brought to an end, destroyed, or silenced.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a chip on the surface of the waters'; some understand the image as a small piece of wood or debris floating helplessly.
    reason: lexical_alternative
translation:
  language: ko
  text: 사마리아는 끊어졌습니다. 그 왕은 물 위의 거품 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사마리아가 멸망했습니다’; 히브리어 동사는 끝장남, 파괴됨, 또는 잠잠해짐을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘물 위의 작은 나뭇조각 같습니다’; 어떤 이들은 이 이미지를 물 위에 떠다니는 작은 나무조각이나 부유물로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  english_pob_choice: is cut off
  chosen_korean: 끊어졌습니다
  alternatives_korean:
  - 멸망했습니다
  - 사라졌습니다
  - 끊겼습니다
  lexicon: HALOT
  rationale: 니팔형의 문맥상 의미를 단순한 ‘침묵’보다 종결·절단의 뉘앙스로 이해한 POB 결정을 따라, 한국어에서는 짧고 직접적인 ‘끊어졌습니다’가 가장 자연스럽고 파괴적 종결감을 살립니다.
- source_word: שֹׁמְרוֹן
  english_pob_choice: Samaria
  chosen_korean: 사마리아
  alternatives_korean:
  - 사마리야
  lexicon: 고유명사 표기 관행
  rationale: 북왕국의 수도를 가리키는 표준 성서 지명으로 ‘사마리아’를 사용합니다.
- source_word: מַלְכָּהּ
  english_pob_choice: her king
  chosen_korean: 그 왕
  alternatives_korean:
  - 그녀의 왕
  - 그 도시의 왕
  lexicon: 문맥/지시대명사
  rationale: 히브리어의 여성형 소유격이 사마리아라는 도시를 의인화하지만, 한국어에서는 ‘그 왕’이 더 자연스럽고, 앞 절의 주어와 연결되는 소유 관계를 무리 없이 전달합니다.
- source_word: כְּקֶצֶף
  english_pob_choice: like foam
  chosen_korean: 물 거품 같습니다
  alternatives_korean:
  - 거품 같습니다
  - 물 위의 거품 같습니다
  - 물거품 같습니다
  lexicon: HALOT
  rationale: קֶצֶף의 기본 의미를 따라 ‘거품’으로 옮기되, 물 위에서 곧 사라지는 무력함을 살리기 위해 ‘물 위의 거품 같습니다’로 풀었습니다.
theological_decisions:
- issue: 사마리아와 왕의 병렬 구문을 어떻게 처리할지
  chosen_reading: 도시가 끊어졌고 그 왕은 물 위의 거품 같은 것으로 제시되는 병렬적 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 사마리아가 멸망했고 왕은 물 위의 거품 같습니다.
  - 사마리아는 사라졌고 그 왕은 물 위의 거품 같습니다.
  rationale: 본문은 도시의 파국과 왕의 허무한 유동성을 나란히 제시하므로, 둘을 한 문장 안에서 병렬적으로 드러내는 것이 원문의 심판 강도를 가장 잘 보존합니다.
  doctrine_reference: 호세아 10장의 예언적 심판 선언
- issue: מַלְכָּהּ의 여성형 소유격
  chosen_reading: 사마리아를 의인화한 여성형 소유격을 한국어에서는 별도 설명 없이 ‘그 왕’으로 자연화했습니다.
  alternative_readings:
  - 그녀의 왕
  - 사마리아의 왕
  rationale: 히브리어의 성별 표지는 문법적 표지이므로, 한국어에서는 어색한 성별 표기를 보존하기보다 도시-왕 관계를 매끄럽게 전달하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 성서 히브리어의 의인화 표현
