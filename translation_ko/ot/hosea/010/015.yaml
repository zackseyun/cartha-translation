  lexicon: HALOT
  rationale: 히브리어의 반복 강조를 한국어에서 가장 무리 없이 옮긴 표현으로, 단순한 ‘악’보다 중첩된 강세를 드러냅니다.
- source_word: נִדְמֹה נִדְמָה
