base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
  footnotes:
  - marker: a
    text: Hebrew repeats 'evil' ('the evil of your evil') for emphasis; hence 'your great evil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will surely be destroyed' or 'will be completely silenced.' The Hebrew uses an infinitive absolute with the verb for emphasis.
    reason: alternative_reading
translation:
  language: ko
  text: 이와 같이 베델이 너희에게 행하였습니다. 이는 너희의 큰 악 때문입니다[a]. 새벽에 이스라엘의 왕은 완전히 끊어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘악’을 반복해 강조합니다. 그래서 ‘너희의 큰 악’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘완전히 끊어질 것입니다’는 반복 강조를 살린 번역입니다. ‘틀림없이 멸망할 것입니다’ 또는 ‘완전히 사라질 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  english_pob_choice: Thus
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그렇게
  - 그리하여
  lexicon: HALOT
  rationale: 지시적 결과 연결을 자연스럽게 살리면서도 예언 문체의 단호함을 유지합니다.
- source_word: רָעַת רָעַתְכֶם
  english_pob_choice: your great evil
  chosen_korean: 너희의 큰 악
  alternatives_korean:
  - 너희의 심한 악
  - 너희의 악 중의 악
  lexicon: HALOT
  rationale: 히브리어의 반복 강조를 한국어에서 가장 무리 없이 옮긴 표현으로, 단순한 ‘악’보다 중첩된 강세를 드러냅니다.
- source_word: נִדְמֹה נִדְמָה
  english_pob_choice: will be utterly cut off
  chosen_korean: 완전히 끊어질 것입니다
  alternatives_korean:
  - 완전히 멸망할 것입니다
  - 완전히 사라질 것입니다
  - 틀림없이 끊어질 것입니다
  lexicon: HALOT
  rationale: נִדְמָה의 강한 단절·제거 의미와 반복 강조를 살리되, 왕의 몰락을 한국어에서 자연스럽게 전달합니다.
theological_decisions:
- issue: 베델의 지칭 방식
  chosen_reading: 지명 베델을 그대로 두어 우상 숭배 중심지에 대한 심판을 메타적으로 드러냈습니다.
  alternative_readings:
  - 베델을 ‘하나님의 집’으로 풀이하기
  - 베델을 우상 자체의 은유로 풀어쓰기
  rationale: 본문이 실제 지명을 사용하므로, 해석을 본문 안에 과도하게 넣지 않고 장소명 자체의 예언적 기능을 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; translate names as names unless context requires otherwise.'
- issue: נִדְמָה נִדְמָה의 강도
  chosen_reading: ‘완전히 끊어질 것입니다’로 반복 강조를 반영했습니다.
  alternative_readings:
  - ‘틀림없이 끊어질 것입니다’
  - ‘완전히 멸망할 것입니다’
  rationale: 절대적 확정성과 심판의 단호함을 보존하되, 번역이 과도하게 주석화되지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve emphatic source tension in readable modern Korean.'
