  - 틀림없이 끊어질 것입니다
  lexicon: HALOT
  rationale: נִדְמָה의 강한 단절·제거 의미와 반복 강조를 살리되, 왕의 몰락을 한국어에서 자연스럽게 전달합니다.
theological_decisions:
- issue: 베델의 지칭 방식
  chosen_reading: 지명 베델을 그대로 두어 우상 숭배 중심지에 대한 심판을 메타적으로 드러냈습니다.
  alternative_readings:
  - 베델을 ‘하나님의 집’으로 풀이하기
  - 베델을 우상 자체의 은유로 풀어쓰기
  rationale: 본문이 실제 지명을 사용하므로, 해석을 본문 안에 과도하게 넣지 않고 장소명 자체의 예언적 기능을 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; translate names as names unless context requires otherwise.'
- issue: נִדְמָה נִדְמָה의 강도
  chosen_reading: ‘완전히 끊어질 것입니다’로 반복 강조를 반영했습니다.
  alternative_readings:
  - ‘틀림없이 끊어질 것입니다’
  - ‘완전히 멸망할 것입니다’
  rationale: 절대적 확정성과 심판의 단호함을 보존하되, 번역이 과도하게 주석화되지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve emphatic source tension in readable modern Korean.'
