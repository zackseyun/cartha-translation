base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
  footnotes:
  - marker: a
    text: Hebrew repeats 'evil' ('the evil of your evil') for emphasis; hence 'your great evil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will surely be destroyed' or 'will be completely silenced.' The Hebrew uses an infinitive absolute with the verb for emphasis.
    reason: alternative_reading
translation:
  language: ko
  text: 이처럼 벧엘이 너희에게 행하였습니다. 이는 너희의 큰 악 때문입니다[a]. 새벽에 이스라엘의 왕은 완전히 끊어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘악’을 반복하여 강조합니다. 그래서 ‘너희의 큰 악’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 부정사 절대형과 동사를 함께 써서 강조합니다. ‘틀림없이 멸망할 것입니다’ 또는 ‘완전히 사라질 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
