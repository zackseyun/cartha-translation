  rationale: 인과 접속을 제거하고, 우상 제작 및 인간 장인의 작품이라는 원문의 논지를 유지했습니다. 특히 마지막 절의 난해한 히브리어는 본문에서 일반적 제사자에게 송아지 우상에게 입맞추라고 하는 조롱조의 읽기로 옮기고, 인간 제사를 뜻할 수 있는 오래된 대안 독해는 각주로 명확히 보존했습니다.
