source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: And now they continue to sin and make for themselves cast images from their silver[a], idols according to their own understanding, all of it the work of craftsmen. Of them they say[b], ‘Those who sacrifice men kiss calves!’
  footnotes:
  - marker: a
    text: Or, 'those who sacrifice humans kiss calves,' taking 'human' as the object of 'sacrifice' rather than as a generic reference to the sacrificers.
    reason: alternative_reading
  - marker: b
    text: That is, calf-idols, likely referring to the cult images associated with Bethel and Samaria.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이제 그들은 계속 죄를 짓고, 자기 은으로 부어 만든 형상들, 곧 자기들의 생각대로 만든 우상들을 만듭니다. 그것들은 모두 장인들의 작품입니다. 그 우상들에게 그들은 말합니다. “제사하는 사람들은 송아지들에게 입맞춤하여라!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람을 제물로 바치는 자들이 송아지들에게 입맞춤합니다.’ 히브리어의 ‘사람’은 제사의 대상, 곧 인간 제사를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘송아지들’은 송아지 우상들을 가리키며, 베델과 사마리아의 제의 형상들을 염두에 둔 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 문맥상 현재의 죄악이 이어지는 전환을 드러내므로, 접속성과 시점을 함께 살린 표현을 택했습니다.
- source_word: כִּתְבוּנָם
  english_pob_choice: according to their own understanding
  chosen_korean: 자기의 이해대로
  alternatives_korean:
  - 자기의 지혜대로
  - 자기의 깨달음대로
  lexicon: HALOT
  rationale: תבונה는 여기서 인간이 스스로 판단해 만든 것이라는 풍자적 뉘앙스를 가지므로, 단순 기술(skill)보다 ‘이해’가 본문의 논박을 더 잘 드러냅니다.
- source_word: מַסֵּכָה / עֲצַבִּים
  english_pob_choice: cast images ... idols
  chosen_korean: 부어 만든 형상들, 곧 ... 우상들
  alternatives_korean:
  - 주조한 우상들
  - 부어 만든 우상들
  lexicon: HALOT
  rationale: מַסֵּכָה의 물질적 제작성을 살려 ‘부어 만든 형상’으로 옮기고, 뒤의 עֲצַבִּים은 종교적 대상을 분명히 하도록 ‘우상’으로 옮겼습니다.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  english_pob_choice: all of it the work of craftsmen
  chosen_korean: 그것은 모두 장인의 작품입니다
  alternatives_korean:
  - 모두 장인들의 작품입니다
  - 전부 장인의 수작입니다
  lexicon: HALOT
  rationale: ‘장인’은 חָרָשִׁים의 자연스러운 현대어이며, 하나님이 아닌 인간 손의 산물이라는 조롱을 한국어로도 분명히 전달합니다.
- source_word: זֹבְחֵי אָדָם ... עֲגָלִים יִשָּׁקוּן
  english_pob_choice: Those who sacrifice men kiss calves!
  chosen_korean: 사람을 제물로 바치는 자들이 송아지에 입맞춤합니다!
  alternatives_korean:
  - 사람들을 제사하는 자들이 송아지에 입맞춤합니다!
  - 사람을 바치는 자들이 송아지에 입맞춤합니다!
  lexicon: HALOT
  rationale: 본문의 압축성과 중의성을 고려하되, English audit trail이 채택한 ‘사람을 제물로 바치는 자들’의 읽기를 본문에 반영해 독자가 히브리어의 난점을 그대로 보도록 했습니다.
theological_decisions:
- issue: זֹבְחֵי אָדָם의 구문 중의성
  chosen_reading: ‘사람을 제물로 바치는 자들’로 읽어, 송아지 우상 숭배를 향한 조롱의 진술로 옮겼습니다.
  alternative_readings:
  - ‘사람들[men]이 제사하는 자들’로 읽는 subject-generic 해석
  - ‘사람을 제물로 바치는 자들’ 대신 ‘사람을 죽여 제사하는 자들’의 직접적 인간제사 해석
  rationale: 히브리어는 문법적으로 압축되어 있어 주어적/목적어적 해석이 모두 가능하므로, English POB의 footnote와 최신 재판정의 문제의식을 따라 본문에는 문맥상 더 직접적인 독해를 두고, 대안은 숨기지 않았습니다.
  doctrine_reference: 본문의 해석 난점은 평탄화하지 말고, 가능한 읽기들을 문서화해 보존합니다.
