id: HOS.13.1
reference: Hosea 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
  footnotes:
  - marker: a
    text: Or, 'he was exalted in Israel' or 'he became prominent in Israel.' The Hebrew clause is terse and may be read as either passive/resultative or active-reflexive.
    reason: alternative_reading
  - marker: b
    text: '''Through Baal'' may also be understood as ''through Baal worship'' or ''in/with Baal.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임이 말할 때에는 떨림이 있었습니다. 그는 이스라엘에서 스스로 높아졌습니다.[a] 그러나 바알로 말미암아 죄를 지어 죽었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 이스라엘에서 높임을 받았습니다’라고도 옮길 수 있습니다. 히브리어 절이 매우 압축되어 있어 수동적·결과적 의미와 능동적·자기고양 의미를 모두 허용합니다.
    reason: alternative_reading
  - marker: b
    text: ‘바알로 말미암아’는 ‘바알을 통해’ 또는 ‘바알 숭배로 인해’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  english_pob_choice: When ... spoke
  chosen_korean: 말할 때는
  alternatives_korean:
  - 말하자
  - 말할 때
  lexicon: HALOT
  rationale: כ plus 동사적 구성은 시간 부사절로 처리하는 것이 자연스럽고, 한국어에서는 ‘말할 때’가 원문의 시간 관계를 가장 직접적으로 살립니다.
- source_word: רְתֵת
  english_pob_choice: trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 떨림이 있었습니다
  - 두려움
  - 진동
  lexicon: HALOT
  rationale: 명사 רְתֵת은 떨림·전율을 뜻하므로, 원문의 압축성을 살리면서도 현대 한국어로 자연스러운 ‘떨림’으로 옮겼습니다.
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  english_pob_choice: he exalted himself in Israel
  chosen_korean: 그는 이스라엘에서 스스로 높아졌습니다
  alternatives_korean:
  - 그는 이스라엘에서 높임을 받았습니다
  - 그는 이스라엘에서 높아졌습니다
  - 그는 이스라엘에서 높임을 받으며 두드러졌습니다
  lexicon: HALOT
  rationale: נשא는 ‘들어 올리다/높이다’의 뜻을 가지며, 문맥상 수동보다 자기고양의 뉘앙스가 더 잘 살아납니다. 그래서 ‘스스로 높아졌습니다’로 처리해 주체적 오만과 이후 타락의 흐름을 드러냈습니다.
- source_word: בַּבַּעַל
  english_pob_choice: through Baal
  chosen_korean: 바알 때문에
  alternatives_korean:
  - 바알으로 인해
  - 바알로 말미암아
  - 바알로
  lexicon: HALOT
  rationale: ב는 여기서 원인·관계의 뜻을 띨 수 있으므로, 우상숭배의 원인을 분명히 드러내는 한국어 표현으로 ‘바알 때문에’를 택했습니다.
theological_decisions:
- issue: 에브라임의 ‘죽음’의 범위
  chosen_reading: 개인적 죽음으로 단정하지 않고, 선지자적 심판 선언의 강한 종결로 남겨 두었습니다.
  alternative_readings:
  - 공동체적·정치적 죽음
  - 영적 죽음
  - 문자적 개인의 죽음
  rationale: 호세아서의 문맥상 ‘죽었습니다’는 실제 죽음, 국가적 붕괴, 언약적 파멸을 모두 포괄할 수 있어, 원문의 심판 효과를 훼손하지 않도록 과도한 해석을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
