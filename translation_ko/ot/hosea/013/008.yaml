  naturalness: ‘들의 들짐승’은 ‘들’과 ‘들짐승’이 불필요하게 겹쳐 현대 표준어로 어색합니다. ‘한 들짐승’은 자연스럽고 단수 원문도 반영합니다. ‘그들의 마음을 둘러싼 것을 찢어 열고’는 한국어 문장으로 자연스러우면서도 난해한 원문의 구조를 보존합니다.
