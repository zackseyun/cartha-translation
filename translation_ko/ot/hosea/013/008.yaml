id: HOS.13.8
reference: Hosea 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶפְגְּשֵׁ/ם֙ כְּ/דֹ֣ב שַׁכּ֔וּל וְ/אֶקְרַ֖ע סְג֣וֹר לִבָּ֑/ם וְ/אֹכְלֵ֥/ם שָׁם֙ כְּ/לָבִ֔יא חַיַּ֥ת הַ/שָּׂדֶ֖ה תְּבַקְּעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
  footnotes:
  - marker: a
    text: Or 'the covering of their heart,' possibly meaning 'their chest' or 'breast.' The Hebrew phrase is rare and difficult.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a lion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 곰처럼, 새끼를 잃은 곰처럼 공격하겠습니다. 그들의 마음의 둘레를 찢어 열고, 거기서 사자처럼 그들을 삼키겠습니다. 들의 들짐승이 그들을 찢어 놓을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 마음의 둘레’로 옮긴 히브리어 표현은 희귀하고 난해하며, ‘가슴’ 또는 ‘가슴의 덮개’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사자처럼’은 ‘암사자처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  english_pob_choice: I will attack them
  chosen_korean: 내가 그들을 … 공격하겠습니다
  alternatives_korean:
  - 내가 그들을 만나겠습니다
  - 내가 그들을 마주치겠습니다
  lexicon: HALOT
  rationale: פגשׁ는 기본적으로 ‘만나다/마주치다’이지만, 심판 맥락과 이어지는 포식자 비유를 따라 한국어에서는 적대적 의미를 드러내는 ‘공격하겠습니다’가 더 적절합니다.
- source_word: סְג֣וֹר לִבָּ֑/ם
  english_pob_choice: the enclosure of their heart
  chosen_korean: 그들의 마음의 둘레
  alternatives_korean:
  - 그들의 마음의 덮개
  - 그들의 가슴
  - 그들의 마음의 외피
  lexicon: HALOT
  rationale: 희귀하고 난해한 구절이므로, 의미를 단정해 ‘가슴’으로 평탄화하기보다 ‘둘레’로 둘러싼 구조를 살려 본문이 지닌 모호성을 보존했습니다.
- source_word: כְּלָבִיא
  english_pob_choice: like a lioness
  chosen_korean: 사자처럼
  alternatives_korean:
  - 암사자처럼
  - 사자(수사자)처럼
  lexicon: HALOT
  rationale: לָבִיא는 문맥상 강한 사자류를 가리킬 수 있어, 한국어에서는 성별을 단정하는 표현보다 중립적인 ‘사자처럼’이 본문과 개정 기록의 긴장을 가장 잘 보존합니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: a wild beast of the field
  chosen_korean: 들의 들짐승
  alternatives_korean:
  - 들판의 들짐승
  - 들의 짐승
  - 야생 들짐승
  lexicon: HALOT
  rationale: 히브리어의 ‘들/야생’ 이미지를 살리기 위해 관용적인 ‘들짐승’을 쓰되, 속격을 드러내는 ‘들의’로 뒤의 소속 관계를 유지했습니다.
- source_word: תְּבַקְּעֵם
  english_pob_choice: will rip them apart
  chosen_korean: 그들을 찢어 놓을 것입니다
  alternatives_korean:
  - 그들을 갈라놓을 것입니다
  - 그들을 찢어발길 것입니다
  - 그들을 찢을 것입니다
  lexicon: HALOT
  rationale: בקע는 ‘가르다/쪼개다’의 폭력성을 가지므로, 한국어에서도 결과를 강하게 드러내는 ‘찢어 놓을 것입니다’가 가장 자연스럽고 직역적입니다.
theological_decisions:
- issue: 하나님의 1인칭 심판 선언과 포식자 비유의 강도
  chosen_reading: 직접적인 1인칭 심판 언어와 동물적 폭력 이미지를 완화하지 않고 유지했습니다.
  alternative_readings:
  - 일반적인 심판 표현으로 완화하기
  - 동물 비유를 상징적으로 돌려 말하기
  rationale: 히브리어 본문은 언약 심판의 주체를 하나님 자신으로 제시하므로, 표현의 거칠음을 누그러뜨리기보다 독자가 그 긴장을 그대로 읽도록 두었습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 해소하지 않고 보존)
