  source_fidelity: 히브리어의 두 1인칭 단수 미완료형을 문맥에 따른 회고적 과거로 옮긴 것은 가능한 해석이며, 이 선택의 형태론적 대안은 각주 a에서 적절히 보존했습니다. לְךָ의 단수 호격적 대상은 ‘너에게’로, 무관사 מֶלֶךְ은 ‘왕’으로 자연스럽게 반영되었습니다. 둘째 절에 명시되지 않은 목적어를 ‘그’로 보충한 것도 바로 앞의 ‘왕’을 가리키므로 충실합니다. בְּאַפִּי와 בְּעֶבְרָתִי의 어휘적 강도 차이도 각각 ‘분노’와 ‘진노’로 대체로 유지됩니다.
