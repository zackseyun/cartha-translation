base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/011.yaml
  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
  footnotes:
  - marker: a
    text: Or, more formally, 'I give you a king in my anger, and I take him away in my wrath.' The Hebrew verbal forms are imperfects and can be rendered more literally as present/future, but the context supports a retrospective sense.
    reason: alternative_reading
  - marker: b
    text: Hebrew simply says 'and I took'; the object 'him' is implied from 'a king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 분노 가운데 왕을 주었고, 내 진노 가운데 그를 거두어 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 미완료형이어서 문자적으로는 ‘준다/줄 것이다’가 가능하지만, 문맥상 회고적 과거로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 둘째 절의 목적어는 히브리어에서 생략되어 있으나, 앞의 ‘왕’이 자연스러운 지시 대상입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  english_pob_choice: I gave
  chosen_korean: 주었고
  alternatives_korean:
  - 줍니다
  - 주겠습니다
  lexicon: HALOT
  rationale: 히브리어 미완료형이지만 문맥상 이스라엘에게 왕을 허락하셨던 일을 회고하는 의미가 분명하므로, 한국어에서는 과거 회고형이 자연스럽습니다.
- source_word: לְךָ
  english_pob_choice: you
  chosen_korean: 너에게
  alternatives_korean:
  - 당신에게
  - 네게
  lexicon: HALOT
  rationale: 2인칭 단수 목적어를 한국어에서는 간결하게 ‘너에게’로 옮겨, 이스라엘을 단수로 부르는 화법을 살렸습니다.
- source_word: וְאֶקַּח
  english_pob_choice: and I took him away
  chosen_korean: 거두어 갔습니다
  alternatives_korean:
  - 빼앗았습니다
  - 데려갔습니다
  - 거두었습니다
  lexicon: HALOT
  rationale: לקח은 기본적으로 ‘취하다/가져가다’이지만 왕권의 문맥에서는 제거의 뜻이 강하므로, 제거와 회수를 함께 드러내는 ‘거두어 갔습니다’가 가장 가깝습니다.
- source_word: בְּעֶבְרָתִי
  english_pob_choice: in my wrath
  chosen_korean: 내 진노 가운데
  alternatives_korean:
  - 내 분노 가운데
  - 내 격분 가운데
  lexicon: HALOT
  rationale: עֶבְרָה는 단순한 분노보다 더 강한 격앙된 진노를 가리키므로, 예언문체의 무게를 살리는 ‘진노’가 적절합니다.
theological_decisions:
- issue: 첫 절의 시제와 하나님의 행위 회고
  chosen_reading: 과거 회고로 번역하여, 하나님이 이스라엘에게 왕을 주셨다가 다시 거두어 가신 심판의 서술로 읽습니다.
  alternative_readings:
  - 형태를 따라 현재/미래형으로 번역할 수 있습니다.
  - ‘주고 … 거두어 갑니다’로 일반적 진술처럼 읽을 수 있습니다.
  rationale: 문맥이 왕정의 부여와 철회를 통한 징계를 회상하고 있으므로, 한국어에서는 과거형이 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 섭리와 심판의 역사성
