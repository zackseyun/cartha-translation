review_pass:
  verdict: revise
  source_fidelity: 초안은 난해한 אֱהִי를 수사 의문문으로 처리한 점과 왕·재판관·지도자들의 정치적 문맥을 대체로 충실히 반영합니다. 그러나 וְיוֹשִׁיעֲךָ의 조롱조 청유/도전의 어감을 ‘구원할 수 있느냐?’라는 능력 질문으로 바꾸었고, 마지막 절을 문법적으로 미완성인 ‘그들이’로 끝냈습니다. 왕과 재판관들을 함께 겨냥하는 본문의 수사적 질문 구조를 한국어에서 완결되게 পুন구성할 필요가 있습니다.
  naturalness: ‘네가 … 말하던 그들이’는 문장 종결이 되지 않아 현대 한국어로 부자연스럽고 의미도 불완전합니다. ‘그가 … 구원하게 하십시오’는 수사적 도전의 맥락에서 자연스럽고, 이어지는 ‘… 말하던 네 재판관들은 어디 있습니까?’는 원문의 병렬을 명료하게 드러냅니다. 합쇼체를 일관되게 유지했습니다.
  terminology: ‘성읍’은 예언서 문맥에 적절하며, שֹׁפְטֶיךָ는 직접적으로 ‘재판관들’로 유지했습니다. שָׂרִים는 현대적이고 포괄적인 ‘지도자들’로 옮기되, 각주에서 ‘관원들’과 ‘통치자들’의 가능성을 제시했습니다. ‘구원’은 ישׁע의 문맥상 적절한 핵심 용어입니다.
  issues:
  - severity: high
