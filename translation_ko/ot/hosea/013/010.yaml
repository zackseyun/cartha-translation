  - severity: medium
    issue: ‘구원할 수 있느냐?’는 원문의 수사적 도전/청유 어조를 능력 여부의 질문으로 좁힙니다.
    rationale: 문맥상 왕에게 구원해 보라고 도전하는 표현이므로 ‘구원하게 하십시오’가 원문의 조롱조 권유에 더 가깝습니다.
  - severity: low
    issue: 각주 b의 표지가 ‘지도자들’이 아니라 문장 끝에 놓여 있습니다.
    rationale: 어휘 대안 각주는 해당 어휘 바로 뒤에 두는 것이 독자의 이해와 각주 연결에 적절합니다.
