id: HOS.13.10
reference: Hosea 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱהִ֤י מַלְכְּ/ךָ֙ אֵפ֔וֹא וְ/יוֹשִֽׁיעֲ/ךָ֖ בְּ/כָל עָרֶ֑י/ךָ וְ/שֹׁ֣פְטֶ֔י/ךָ אֲשֶׁ֣ר אָמַ֔רְתָּ תְּנָ/ה לִּ֖/י מֶ֥לֶךְ וְ/שָׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
  footnotes:
  - marker: a
    text: Or, less likely, 'I would be your king; where then is anyone who can save you...?' The Hebrew opening is difficult.
    reason: alternative_reading
  - marker: b
    text: '''Princes'' may also be rendered ''officials'' or ''rulers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 지금 네 왕이 어디 있느냐 — 그가 네 모든 성읍에서 너를 구원할 수 있느냐? 네 재판관들도 어디 있느냐? 네가 “내게 왕과 지도자들을 주십시오”라고 말하던 그들이.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫머리의 히브리어는 난해하여, 여기서는 수사 의문문으로 옮겼습니다. 다른 가능성으로는 ‘내가 네 왕이 되리라’에 가까운 읽기도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 שָׂרִים는 여기서 ‘지도자들’ 또는 ‘관원들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי מַלְכְּךָ אֵפוֹא
  english_pob_choice: Where now is your king
  chosen_korean: 지금 네 왕이 어디 있느냐
  alternatives_korean:
  - 네 왕이 어디 있느냐
  - 이제 네 왕이 어디 있느냐
  lexicon: HALOT
  rationale: 첫머리의 קשה 형식은 문맥상 비웃는 질문으로 읽는 것이 가장 자연스러우므로, 한국어도 직접적인 의문문으로 옮겼습니다. אֵפוֹא의 시간·강조 기능은 ‘지금’으로 살렸습니다.
- source_word: וְיוֹשִׁיעֲךָ
  english_pob_choice: that he may save you
  chosen_korean: 그가 너를 구원할 수 있느냐
  alternatives_korean:
  - 그가 너를 구원하게 하라
  - 그가 너를 구원하겠느냐
  lexicon: HALOT
  rationale: 히필 동사의 ‘구원하다/건지다’ 의미를 살리되, 수사적 조롱의 힘을 유지하려고 가능성 질문 형태로 옮겼습니다.
- source_word: בְּכָל עָרֶיךָ
  english_pob_choice: in all your cities
  chosen_korean: 네 모든 성읍에서
  alternatives_korean:
  - 네 모든 도시에서
  - 네 모든 성읍 안에서
  lexicon: HALOT
  rationale: בְּ + 장소는 자연스러운 위치 관계로 처리했고, 예언서 문맥에 맞게 ‘성읍’을 택했습니다.
- source_word: וְשֹׁפְטֶיךָ
  english_pob_choice: and your judges
  chosen_korean: 네 재판관들도
  alternatives_korean:
  - 네 판관들도
  - 네 심판관들도
  lexicon: HALOT
  rationale: שׁפט의 기본 어휘값은 ‘재판하다/판결하다’이므로 ‘재판관’이 가장 직접적입니다. 왕과 병렬되는 정치적 지도자라는 점은 문맥이 보완합니다.
- source_word: מֶלֶךְ וְשָׂרִים
  english_pob_choice: a king and princes
  chosen_korean: 왕과 지도자들
  alternatives_korean:
  - 왕과 고관들
  - 왕과 방백들
  - 왕과 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 통치·행정 엘리트를 가리키므로, 현대 한국어에서 과도하게 고어적이지 않으면서도 직무적 뉘앙스를 살리는 ‘지도자들’을 채택했습니다.
theological_decisions:
- issue: אֱהִי의 난해한 첫 구문 해석
  chosen_reading: 비난조 수사 의문문으로 읽어, 북이스라엘이 의지하던 왕권의 무능을 드러내는 표현으로 처리했습니다.
  alternative_readings:
  - ‘내가 네 왕이 되리라’ 식의 선언문
  - ‘내가 네 왕이었으니…’에 가까운 재구성
  rationale: 본문의 진행은 회개 촉구가 아니라 심판의 조롱이므로, 선언문보다 질문형이 문맥과 예언적 어조를 더 잘 반영합니다.
  doctrine_reference: 예언서의 언약 심판과 인간 왕권의 한계
- issue: ‘왕과 지도자들’의 정치적 뉘앙스
  chosen_reading: 종교적 직분어보다 정치·행정 지도자 어휘로 옮겼습니다.
  alternative_readings:
  - ‘왕과 방백들’
  - ‘왕과 관원들’
  rationale: 히브리어 שָׂרִים는 제도적 권력층을 가리키므로, 교회적 또는 지나치게 전통적인 용어로 완화하지 않고 문맥의 정치성을 유지했습니다.
  doctrine_reference: 이스라엘의 왕정에 대한 예언적 평가
