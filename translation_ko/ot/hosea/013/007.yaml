  rationale: נָמֵר의 통상적 대응어인 ‘표범’을 사용해 비교 구문을 자연스러운 한국어로 옮겼습니다.
- source_word: עַל דֶּרֶךְ
  english_pob_choice: by the way
  chosen_korean: 길가에
  alternatives_korean:
  - 길 위에
