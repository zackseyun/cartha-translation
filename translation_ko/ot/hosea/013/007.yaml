  lexicon: HALOT
  rationale: 사냥감 길목에서의 매복 이미지를 살리기 위해 ‘길가에’로 옮겼습니다.
- source_word: אָשׁוּר
  english_pob_choice: I lurked
  chosen_korean: 숨어 있었습니다
  alternatives_korean:
