  - 지켜보고 있었습니다
  lexicon: HALOT
  rationale: 문자 형태가 ‘앗수르’로도 보일 수 있지만, 문맥과 병행 이미지가 동사적 독법을 지지하므로 ‘숨어 있다’로 옮겨 잠복·매복의 의미를 드러냈습니다.
theological_decisions:
- issue: 하나님을 포식자로 비유하는 심판 이미지
  chosen_reading: 사자와 표범의 비유를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
