    text: 또는 ‘표범처럼 길가에서 지켜보고 있었다’ 또는 ‘표범처럼 길에서 매복했다.’ 마지막 히브리어 낱말은 해석이 어렵습니다. 이것을 지명 ‘앗수르’가 아니라, ‘지켜보다’ 또는 ‘엿보다’라는 뜻의 1인칭 동사로 이해할 수 있습니다.
