  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
  footnotes:
  - marker: a
    text: Or 'like a leopard I watched by the way' or 'like a leopard I lay in wait by the road.' The final verb is difficult and may be understood as a first-person verb of watching or lurking, rather than the place-name 'Assyria.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 그들에게 사자가 되었고[a], 표범처럼 길가에 숨어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘표범처럼 길가에서 지켜보았다’ 혹은 ‘표범처럼 길에서 매복했다.’ 마지막 동사는 어렵고, 지명 ‘앗수르’가 아니라 1인칭 동사로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  english_pob_choice: So I became
  chosen_korean: 그래서 내가 … 되었고
  alternatives_korean:
  - 그리고 내가 …였습니다
  - 그때 내가 … 되었습니다
  lexicon: HALOT
  rationale: 결과적·진행적 뉘앙스를 살려 단순한 상태 동사보다 ‘되었다’로 옮기되, 문맥의 판단 선언성을 반영해 ‘그래서’로 연결했습니다.
- source_word: שָׁחַל
