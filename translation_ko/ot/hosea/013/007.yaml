  lexicon: HALOT
  rationale: 히브리어 어휘의 기본 의미인 포식자 사자를 직접 살려, 심판 이미지의 강도를 약화하지 않았습니다.
- source_word: כְּנָמֵר
  english_pob_choice: like a leopard
  chosen_korean: 표범처럼
  alternatives_korean:
