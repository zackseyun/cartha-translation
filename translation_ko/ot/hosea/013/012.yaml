source:
  edition: WLC
  text: צָרוּר֙ עֲוֺ֣ן אֶפְרָ֔יִם צְפוּנָ֖ה חַטָּאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/012.yaml
  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
  footnotes:
  - marker: a
    text: Or 'hidden' for 'stored away'; the Hebrew can mean concealed or kept in reserve, likely with the sense that Ephraim’s sin is being kept for future reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임의 죄악은 묶여 있고, 그의 죄는 간직되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감추어져 있습니다.’ 히브리어는 감추어 둠과 간직해 둠의 뜻을 모두 지닐 수 있습니다. 이 심판 문맥에서는 에브라임의 죄가 장차 심판을 위해 보존되어 있다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  english_pob_choice: is bound up
  chosen_korean: 묶여 있습니다
  alternatives_korean:
  - 매여 있습니다
  - 묶여져 있습니다
  - 감겨 있습니다
  lexicon: HALOT
  rationale: 수동 분사형이 가리키는 ‘묶여 있는’ 상태를 자연스러운 현대 한국어로 옮겼습니다. ‘저장되어 있습니다’와의 병렬도 유지합니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 죄
  - 악행
  - 불의
  lexicon: HALOT
  rationale: 이 용어는 단순한 죄보다 도덕적 왜곡과 책임의 무게를 함께 담으므로, 보다 무게감 있는 ‘죄악’이 적절합니다.
- source_word: צְפוּנָה
  english_pob_choice: is stored away
  chosen_korean: 저장되어 있습니다
  alternatives_korean:
  - 감추어져 있습니다
  - 간직되어 있습니다
  - 쌓여 있습니다
  lexicon: HALOT
  rationale: 문맥상 단순히 숨겨진 상태가 아니라 미래의 정산을 위해 보관된 느낌을 살려 ‘저장되어 있습니다’로 옮겼습니다.
- source_word: חַטָּאתוֹ
  english_pob_choice: his sin
  chosen_korean: 그의 죄
  alternatives_korean:
  - 그의 허물
  - 그의 범죄
  - 그의 죄책
  lexicon: HALOT
  rationale: 어근의 기본 의미인 ‘죄’를 유지하되, 에브라임을 가리키는 3인칭 단수 소유격을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 문맥상 ‘감춤’과 ‘보관됨’의 긴장
  chosen_reading: 이 구절은 에브라임의 죄가 단순히 감추어진 것이 아니라, 심판을 위해 보존된 상태라는 예언적 이미지를 전달합니다.
  alternative_readings:
  - 그저 보이지 않게 숨겨졌다는 뜻으로만 읽을 수 있습니다.
  rationale: 히브리어의 두 수동 분사와 호세아의 심판 문맥을 함께 고려하면, 죄의 제거보다 ‘보관된 책임’의 의미를 유지하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy §3: theological tension should be preserved rather than resolved.'
