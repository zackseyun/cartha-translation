id: HOS.13.14
reference: Hosea 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
  footnotes:
  - marker: a
    text: Or, 'Shall I ransom them from the hand of Sheol? Shall I redeem them from death?'—taking the opening lines as rhetorical questions of judgment rather than promises of deliverance.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew אֱהִי may also be understood as ''I will be'' or ''let me be'': ''I will be your plagues, O Death; I will be your destruction, O Sheol.'''
    reason: alternative_reading
  - marker: c
    text: 'Traditional rendering influenced by the Greek tradition: ''Where, O Death, is your sting? Where, O Sheol, is your victory/sting?'' Compare 1 Corinthians 15:55.'
    reason: cross_reference
translation:
  language: ko
  text: 내가 그들을 스올의 손에서 속량하겠고, 죽음에서 구속하겠다. 죽음아, 너의 재앙들이 어디 있느냐? 스올아, 너의 멸망이 어디 있느냐? 동정은 내 눈에서 숨겨질 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 스올의 손에서 속량하겠느냐? 내가 그들을 죽음에서 구속하겠느냐?’—첫 행들을 심판의 수사적 질문으로 보는 해석.
    reason: alternative_reading
  - marker: b
    text: '히브리어 אֱהִי는 ‘내가 되겠다’ 또는 ‘내가 되게 하겠다’로도 이해될 수 있습니다: ‘죽음아, 내가 너의 재앙이 되겠다; 스올아, 내가 너의 멸망이 되겠다.’'
    reason: alternative_reading
  - marker: c
    text: '전통적 번역은 헬라어 전승의 영향을 받았습니다: ‘죽음아, 네 가시가 어디 있느냐? 스올아, 네 승리/가시가 어디 있느냐?’ 고린도전서 15:55와 비교하십시오.'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד שְׁאוֹל
  english_pob_choice: from the hand of Sheol
  chosen_korean: 스올의 손에서
  alternatives_korean:
  - 스올의 권세에서
  - 스올에서
  lexicon: HALOT
  rationale: ‘손’이라는 구체적 은유를 살리되, 한국어에서는 소유격보다 처소·기원격을 써서 ‘~의 손에서’로 자연스럽게 옮겼습니다.
- source_word: אֶפְדֵּם / אֶגְאָלֵם
  english_pob_choice: I will ransom them / I will redeem them
  chosen_korean: 속량하겠고, … 구속하겠다
  alternatives_korean:
  - 사서 되찾겠다, … 구속하겠다
  - 속량하겠다, … 되찾겠다
  lexicon: HALOT
  rationale: פּדה와 גאל의 두 어휘 차이를 한국어에서 완전히 분리하기는 어렵지만, ‘속량’과 ‘구속’을 나란히 두어 반복만 하지 않으면서도 구원 행위를 두 단계로 구분했습니다.
- source_word: אֱהִי דְבָרֶיךָ מָוֶת אֱהִי קָטָבְךָ שְׁאוֹל
  english_pob_choice: O Death, where are your plagues? O Sheol, where is your destruction?
  chosen_korean: 죽음아, 너의 재앙들이 어디 있느냐? 스올아, 너의 멸망이 어디 있느냐?
  alternatives_korean:
  - 죽음아, 너의 쏘는 것이 어디 있느냐? 스올아, 너의 쏘는 것이 어디 있느냐?
  - 죽음아, 네 재앙이 어디 있느냐? 스올아, 네 파괴가 어디 있느냐?
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 질문형으로 옮기되, דְבָרֶיךָ는 전통적 ‘쏘는 것’보다 히브리어의 직접적 의미를 반영한 ‘재앙들’로, קָטָב은 ‘멸망’으로 옮겼습니다.
- source_word: נֹחַם יִסָּתֵר מֵעֵינָי
  english_pob_choice: Compassion will be hidden from my eyes
  chosen_korean: 동정은 내 눈에서 숨겨질 것이다
  alternatives_korean:
  - 긍휼은 내 눈에서 가려질 것이다
  - 불쌍히 여김은 내 눈에서 숨겨질 것이다
  lexicon: HALOT
  rationale: נֹחַם의 범위를 ‘동정’으로 옮겨, 하나님 편의 유보된 연민·돌이킴을 간결하게 드러내되 ‘내 눈에서 숨겨질 것이다’라는 수동형을 유지했습니다.
theological_decisions:
- issue: ‘죽음/스올’에 대한 선언을 승리의 조롱으로 읽을지, 심판적 반문으로 읽을지
  chosen_reading: 본문의 본문형 문장을 따라 구원 선언 뒤의 조롱 섞인 도전으로 유지했습니다.
  alternative_readings:
  - ‘내가 그들을 속량하겠느냐? 내가 그들을 구속하겠느냐?’라는 심판의 반문
  rationale: 히브리어의 일인칭 미완료와 이어지는 직접 호명은 승리의 선포로 읽히며, 본문 내부의 긴장을 보존하기 위해 주석적 반문을 본문으로 흡수하지 않았습니다.
  doctrine_reference: Hosea 13:14; 1 Corinthians 15:55 수용사를 고려하되, 본문 자체의 1차 의미를 우선함
