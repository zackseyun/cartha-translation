  terminology: ‘스올’, ‘속량’, ‘구속’, ‘재앙’, ‘멸망’은 원문의 의미 범위와 POB의 어휘 결정을 적절히 반영합니다. נֹחַם에는 ‘긍휼’이 ‘동정’보다 신적 연민/긍휼의 문맥에 더 적합합니다.
