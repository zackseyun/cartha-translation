id: HOS.13.5
reference: Hosea 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י יְדַעְתִּ֖י/ךָ בַּ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ תַּלְאֻבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/005.yaml
  text: I knew you in the wilderness[b][a], in a land of severe drought.
  footnotes:
  - marker: a
    text: Or 'I cared for you' or 'I acknowledged you'; the Hebrew verb can carry relational or covenantal overtones beyond simple cognition.
    reason: lexical_alternative
  - marker: b
    text: Or 'in a land of burning heat,' 'in a land of thirst,' or 'in a parched land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 광야에서 알았고, 메마른 땅에서 알았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내가 너를 돌보았고', '내가 너를 인정하였고'. 히브리어 동사는 단순한 인지보다 관계적·언약적 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '메마른 땅에서', '갈증의 땅에서', '타는 듯한 땅에서'.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיךָ
  english_pob_choice: I knew you
  chosen_korean: 내가 너를 ... 알았고
  alternatives_korean:
  - 내가 너를 ... 알았으며
  - 내가 너를 ... 돌보았고
  - 내가 너를 ... 인정하였고
  lexicon: HALOT
  rationale: ידע의 기본 뜻은 '알다'이므로 본문에서는 그 어휘 핵심을 살리되, 언약적 관계의 뉘앙스는 본문 문맥이 들리도록 두었습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들에서
  - 사막에서
  lexicon: HALOT
  rationale: 호세아의 출애굽 기억을 살리는 표준적인 성경 용례로, '광야'가 가장 자연스럽고 신학적 연상도 보존합니다.
- source_word: בְּאֶרֶץ
  english_pob_choice: in a land
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅 안에서
  - 한 땅에서
  lexicon: HALOT
  rationale: 히브리어의 מקום/장소 표현을 한국어 자연어로 옮기면 '땅에서'가 가장 간결하며, 뒤의 수식구와 함께 어려운 환경을 잘 드러냅니다.
- source_word: תַּלְאֻבוֹת
  english_pob_choice: of severe drought
  chosen_korean: 메마른
  alternatives_korean:
  - 심한 가뭄의
  - 극심한 갈증의
  - 타는 듯한
  lexicon: HALOT
  rationale: 이 희귀어는 심한 건조·갈증 상태를 가리키므로, 현대 한국어에서 의미를 분명히 전달하는 '메마른'을 택했습니다.
theological_decisions:
- issue: ידע의 번역에서 관계적·언약적 의미를 본문에 얼마나 드러낼지
  chosen_reading: 본문은 '알다'를 유지하고, 돌보심·인정하심의 뉘앙스는 열어 둡니다.
  alternative_readings:
  - 내가 너를 돌보았고
  - 내가 너를 인정하였고
  rationale: 히브리어 동사는 단순 인지보다 관계적 앎을 함축할 수 있지만, 본문 자체가 그 의미를 명시적으로 풀어주지는 않으므로 주된 번역은 어휘 핵심을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 — 신학적 긴장을 해소하지 말고 보존합니다.
