  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
  footnotes:
  - marker: a
    text: Or 'since the land of Egypt' or 'out of the land of Egypt.' The Hebrew phrase may emphasize either the LORD's relationship to Israel from the time of the exodus or his saving action in bringing them out.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall know no God besides me.' The Hebrew verb can be understood with covenantal/prohibitive force as well as declarative force.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 이집트 땅으로부터 네 하나님 야훼이며[b], 너는 나 외에는 어떤 하나님도 알지 못하며, 나 외에는 구원자가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 땅에서’, ‘이집트 땅으로부터’, 혹은 ‘이집트 땅 이후로’. 히브리어 표현은 야훼의 구원 행위와 출애굽 때부터의 언약 관계를 모두 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트 땅으로부터의’, ‘이집트 땅에서의’로도 이해할 수 있습니다. 이 구절은 출애굽의 역사적 시작점과 그로 인한 언약 관계를 함께 가리킬 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְאָנֹכִי
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 그런데 나는
  lexicon: HALOT
  rationale: 문맥상 대조적 강조가 분명하므로, 단순한 연결보다 역접을 살린 ‘그러나 나는’이 원문의 힘을 더 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 기준에 따라 여호와라는 대체 호칭 대신 신명기적-언약적 고유명사로서 ‘야훼’를 사용합니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅으로부터
  alternatives_korean:
  - 이집트 땅에서부터
  - 이집트 땅에서
  lexicon: HALOT
  rationale: 전치사 מִן 계열의 출발점 의미를 살리면서, 출애굽의 역사적 배경을 자연스러운 한국어로 옮겼습니다.
- source_word: לֹא תֵדָע
  english_pob_choice: you know no
  chosen_korean: 너는 … 알지 못하며
  alternatives_korean:
  - 너는 … 알지 못할 것이며
  - 너는 … 알지 못해야 하며
  lexicon: HALOT
  rationale: 이 동사는 선언적 진술과 금지적 뉘앙스를 함께 가질 수 있으므로, 한국어에서는 ‘알지 못하며’로 현재적 배타 진술을 살렸습니다.
- source_word: מוֹשִׁיעַ אַיִן בִּלְתִּי
  english_pob_choice: there is no savior except me
  chosen_korean: 나 외에는 구원자가 없습니다
  alternatives_korean:
  - 나 외에는 구원자가 없으며
  - 나 말고는 구원자가 없습니다
  lexicon: HALOT
  rationale: 존재부정과 배타성을 함께 담는 표현으로, 한국어에서는 가장 자연스러운 단정문 형태로 옮겼습니다.
theological_decisions:
- issue: ‘알다’의 선언적/금지적 이중 가능성
  chosen_reading: ‘너는 나 외에는 어떤 하나님도 알지 못하며’로 번역해, 사실 진술과 언약적 금지의 뉘앙스를 함께 열어 둡니다.
  alternative_readings:
  - ‘너는 나 외에는 어떤 하나님도 알지 말아야 하며’
  - ‘너는 나 외에는 어떤 하나님도 알지 못할 것이다’
  rationale: 히브리어 동사는 문맥상 선언과 금지를 둘 다 반영할 수 있으므로, 한국어에서도 한쪽으로만 고정하지 않고 중립적으로 유지했습니다.
  doctrine_reference: 언약적 배타성, 우상 금지
