base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
  footnotes:
  - marker: a
    text: Or 'since the land of Egypt' or 'out of the land of Egypt.' The Hebrew phrase may emphasize either the LORD's relationship to Israel from the time of the exodus or his saving action in bringing them out.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall know no God besides me.' The Hebrew verb can be understood with covenantal/prohibitive force as well as declarative force.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 이집트 땅에서부터[a] 네 하나님 야훼입니다. 너는 나 외에 다른 하나님을 알지 못하며[b], 나 외에는 구원자가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 땅으로부터’ 또는 ‘이집트 땅에서 나온 때부터’. 히브리어 표현은 야훼께서 이스라엘을 이집트에서 이끌어 내신 구원 행위나 출애굽 때부터 이어진 관계를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너는 나 외에 다른 하나님을 알아서는 안 된다.’ 히브리어 동사는 선언으로도, 언약적 금지의 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
