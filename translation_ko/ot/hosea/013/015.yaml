id: HOS.13.15
reference: Hosea 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
  footnotes:
  - marker: a
    text: 'Or ''For he is fruitful among brothers.'' The Hebrew can be rendered more formally, but the context favors a concessive sense: despite Ephraim''s prosperity, judgment is coming.'
    reason: lexical_alternative
  - marker: b
    text: '''The wind of the LORD'' could also be rendered ''the breath of the LORD,'' but here ''wind'' fits the parallel with ''east wind'' and ''rising from the wilderness.'''
    reason: alternative_reading
  - marker: c
    text: Or 'he will plunder the treasury of every precious object.' The Hebrew subject may be understood as the east wind or, less likely, the personified Ephraim/attacker.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그의 형제들 가운데서 번성할지라도, 동풍, 곧 광야에서 올라오는 야훼의 바람이 와서 그의 샘을 마르게 하고 그의 샘물을 말려 버리며, 온갖 귀한 기물의 보물 창고를 약탈할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 형식적으로 ‘형제들 가운데서 열매를 맺는다’로도 옮길 수 있지만, 문맥은 에브라임의 번성에 대한 양보를 더 잘 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: ‘야훼의 바람’은 여기서 ‘야훼의 숨결’로도 옮길 수 있으나, ‘동풍’ 및 ‘광야에서 올라옴’과의 관계 때문에 ‘바람’이 더 적절합니다.
    reason: alternative_reading
  - marker: c
    text: 마지막 약탈의 주어는 동풍으로 이해하는 것이 가장 자연스럽지만, 덜 가능하게는 사람화된 에브라임이나 침입자로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Though
  chosen_korean: -할지라도
  alternatives_korean:
  - -이지만
  - -하더라도
  - 비록
  lexicon: HALOT
  rationale: 문맥상 풍요에 대한 역접·양보를 나타내므로, 단순한 원인보다 양보 표현인 '-할지라도'가 더 적절합니다.
- source_word: בֵּן אַחִים
  english_pob_choice: among his brothers
  chosen_korean: 그의 형제들 가운데서
  alternatives_korean:
  - 형제들 가운데
  - 형제들 중에
  - 형제들 사이에서
  lexicon: HALOT
  rationale: 직역하면 다소 어색하지만, POB의 관용적 이해를 따라 소속·공동체 내 번성을 자연스럽게 살렸습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the wind of Yahweh
  chosen_korean: 야훼의 바람
  alternatives_korean:
  - 야훼의 영
  - 야훼의 숨결
  - 여호와의 바람
  lexicon: HALOT
  rationale: 앞의 동풍과 평행을 이루므로 meteorological sense인 '바람'을 유지했고, 하나님의 주권적 개입은 '야훼의'로 드러냈습니다.
- source_word: מְקוֹרוֹ / מַעְיָנוֹ
  english_pob_choice: his spring / his fountain
  chosen_korean: 그의 샘 / 그의 샘터
  alternatives_korean:
  - 그의 원천 / 그의 샘
  - 그의 근원 / 그의 샘물
  lexicon: HALOT
  rationale: 두 개의 물 근원 표현을 한국어로 구분해 반복을 살리되, 자연스러운 현대어로 '샘'과 '샘터'를 택했습니다.
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  english_pob_choice: the storehouse of every precious vessel
  chosen_korean: 온갖 귀한 그릇이 들어 있는 창고
  alternatives_korean:
  - 모든 값진 기물이 있는 창고
  - 온갖 보배로운 기물이 든 창고
  - 모든 귀한 물건의 창고
  lexicon: HALOT
  rationale: אוֹצַר은 단순 '보물'보다 저장소/창고의 뜻이 살아 있으며, כְּלִי חֶמְדָּה는 귀중한 기물·그릇의 구체성을 보존하는 것이 좋습니다.
theological_decisions:
- issue: 야훼의 바람의 성격
  chosen_reading: 자연적 동풍이면서도 야훼의 주권 아래 있는 심판의 도구로 읽었습니다.
  alternative_readings:
  - 성령에 대한 인격적 지시로 읽는 해석
  - 단순한 기상현상으로만 읽는 해석
  rationale: 문맥이 동풍과 광야에서 올라오는 이미지에 맞추어 기상 현상을 가리키므로, '바람'을 유지하되 출처를 야훼에게 돌려 심판의 신학을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3; Contested terms: רוּחַ'
