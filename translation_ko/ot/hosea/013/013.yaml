    rationale: בְּמִשְׁבַּר בָּנִים은 문자적으로 ‘자녀들의 미쉬바르’이며, 출산 때 아이가 나오는 곳 또는 해산의 자리로 이해되는 난해한 표현입니다. ‘문턱’은 한국어 관용도 아니고 원문에 없는 건물 출입구 이미지를 강하게 도입합니다.
