id: HOS.13.13
reference: Hosea 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶבְלֵ֥י יֽוֹלֵדָ֖ה יָבֹ֣אוּ ל֑/וֹ הוּא בֵן֙ לֹ֣א חָכָ֔ם כִּֽי עֵ֥ת לֹֽא יַעֲמֹ֖ד בְּ/מִשְׁבַּ֥ר בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
  footnotes:
  - marker: a
    text: Or 'birth pains.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'he does not stand at the mishbar of sons,' an idiom for failing to come forth at birth; some render 'at the mouth/opening of the womb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여인의 해산의 고통이 그에게 임합니다[a]; 그는 어리석은 아들[b]입니다. 때가 되면 그는 태어나는 문턱에 서 있지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘출산의 고통’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그는 아들들의 미쉬바르에 서 있지 않습니다’이며, 출생 순간에 나오지 못하는 관용구입니다. ‘태어나는 문턱’은 이 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵ֥י יֽוֹלֵדָ֖ה
  english_pob_choice: The labor pains of a woman giving birth
  chosen_korean: 여인의 해산의 고통
  alternatives_korean:
  - 출산의 진통
  - 해산하는 여인의 진통
  - 산고
  lexicon: HALOT
  rationale: יולדה의 출산 상황과 결합된 חבלים는 문자적 ‘끈’보다 해산 고통의 관용적 의미가 적절하므로, 현대 한국어에서 자연스러운 ‘해산의 고통’으로 옮겼습니다.
- source_word: יָבֹ֣אוּ ל֑/וֹ
  english_pob_choice: come upon him
  chosen_korean: 그에게 임합니다
  alternatives_korean:
  - 그에게 찾아옵니다
  - 그를 덮칩니다
  lexicon: HALOT
  rationale: 도래·임함의 이미지를 살리면서도 심판적 뉘앙스로 과도하게 좁히지 않기 위해 ‘임합니다’를 선택했습니다.
- source_word: בֵן֙ לֹ֣א חָכָ֔ם
  english_pob_choice: an unwise son
  chosen_korean: 어리석은 아들
  alternatives_korean:
  - 지혜 없는 아들
  - 분별 없는 아들
  lexicon: HALOT
  rationale: 문장 구조상 서술적 표현이므로 ‘어리석은 아들’이 가장 간결하며, 지혜의 결핍을 드러내는 히브리어 표현을 잘 전달합니다.
- source_word: בְּ/מִשְׁבַּ֥ר בָּנִֽים
  english_pob_choice: at the opening of the womb
  chosen_korean: 태어나는 문턱
  alternatives_korean:
  - 태의 문
  - 자궁의 입구
  - 열리는 태문
  lexicon: HALOT
  rationale: 직역하면 난해한 관용구이므로, 출생 직전의 ‘문턱’ 이미지를 살려 의미를 전달하되 본문의 비유적 긴장도 유지했습니다.
theological_decisions:
- issue: 출생 비유의 유지 여부
  chosen_reading: 본문의 아들/출산 비유를 풀어 설명하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 에브라임을 명시해 ‘에브라임은 ...’으로 풀어 씀
  rationale: 히브리어 본문은 명시적 명칭 없이 3인칭 남성 단수와 출산 은유를 사용하므로, 해석을 본문 안에 과도하게 주입하지 않고 독자가 문맥으로 파악하게 두는 편이 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
