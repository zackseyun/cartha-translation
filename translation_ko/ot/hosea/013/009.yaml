  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִֽׁחֶתְ/ךָ֥ יִשְׂרָאֵ֖ל כִּֽי בִ֥/י בְ/עֶזְרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
  footnotes:
  - marker: a
    text: Or, 'You have destroyed yourself, Israel, for in me is your help.' The Hebrew of this verse is difficult, and some also understand it more literally as, 'Your destruction, Israel…'
    reason: alternative_reading
translation:
  language: ko
  text: 주께서 너를 멸하셨습니다, 이스라엘아. 이는 너의 도움이 내 안에 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이스라엘아, 너는 스스로 멸망하였습니다. 이는 내 안에 네 도움이 있기 때문입니다.’ 히브리어 본문은 매우 어렵고, 어떤 이들은 더 문자적으로 ‘이스라엘아, 너의 멸망이…’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  english_pob_choice: He has destroyed you
  chosen_korean: 주께서 너를 멸하셨습니다
  alternatives_korean:
  - 너는 스스로 멸망하였습니다
  - 너의 멸망이었습니다
  lexicon: HALOT
  rationale: 히브리어는 어간과 용법이 압축되어 있어 주어를 명시적으로 드러내지 않지만, 기본적으로 ‘멸하다/파괴하다’의 완료형 진술로 읽는 것이 가장 직접적입니다. 한국어는 문맥상 주어를 ‘주께서’로 보완해 자연스럽게 옮겼습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘아
  alternatives_korean:
  - 이스라엘
  lexicon: 고유명사
  rationale: 호격의 뉘앙스를 살리기 위해 한국어에서는 호격 조사 ‘-아’를 붙였습니다.
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - ~이므로
  lexicon: HALOT
  rationale: 문장 앞의 파괴 진술에 대한 이유를 밝히는 인과 관계이므로, 현대 한국어에서 가장 자연스러운 설명 구조로 옮겼습니다.
- source_word: בִי
  english_pob_choice: in me
  chosen_korean: 내 안에
  alternatives_korean:
  - 내게
  - 나에게서
  lexicon: HALOT
  rationale: 전치사 ב의 기본값인 ‘안에’의 의미를 살리되, 한국어에서는 ‘내 안에’가 본문이 말하는 도움의 근원을 가장 सीधे하게 전달합니다.
- source_word: בְעֶזְרֶךָ
  english_pob_choice: your help
  chosen_korean: 너의 도움
  alternatives_korean:
  - 네 도움
  - 너를 돕는 이
  lexicon: HALOT
  rationale: עֵזֶר는 ‘도움/원조’라는 명사이므로, 동사화하지 않고 명사구로 보존했습니다.
theological_decisions:
- issue: 히브리어의 압축성과 주어 보완
  chosen_reading: 주어는 한국어 본문에서 ‘주께서’로 보완하되, 원문의 진술 구조와 인과 관계를 유지했습니다.
  alternative_readings:
  - 너는 스스로 멸망하였습니다, 이스라엘아
  - 이스라엘아, 네 멸망이 바로 이것이다
  rationale: 본문은 문법적으로 매우 압축되어 있어 한국어에서는 완전한 문장으로 풀어 써야 합니다. 다만 과도한 해석으로 reflexive 의미를 본문에 고정하지 않고, 원문의 핵심 대조—이스라엘의 멸망과 하나님 안에 있는 도움—를 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
