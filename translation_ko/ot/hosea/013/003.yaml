  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
  footnotes:
  - marker: a
    text: Or 'from a lattice.' The Hebrew term can refer to a window opening or latticework.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 아침 구름 같고, 일찍 사라지는 이슬 같으며, 타작마당에서 휩쓸려 가는 겨 같고, 창문[a]에서 나오는 연기 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단어는 창문 개구부 또는 격자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
