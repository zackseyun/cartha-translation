  text: לָ/כֵ֗ן יִֽהְיוּ֙ כַּ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֣ים הֹלֵ֑ךְ כְּ/מֹץ֙ יְסֹעֵ֣ר מִ/גֹּ֔רֶן וּ/כְ/עָשָׁ֖ן מֵ/אֲרֻבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
  footnotes:
  - marker: a
    text: Or 'from a lattice.' The Hebrew term can refer to a window opening or latticework.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 아침 구름 같고, 일찍 사라지는 이슬 같으며, 타작마당에서 휩쓸려 가는 겨 같고, 창문에서 나오는 연기 같을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아르부아는 창문 개구부나 격자(라티스)를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 대한 귀결을 나타내므로, 한국어에서도 인과·결과를 분명히 드러내는 연결어가 적절합니다.
- source_word: כַּעֲנַן בֹּקֶר
  english_pob_choice: like the morning cloud
  chosen_korean: 아침 구름 같고
  alternatives_korean:
  - 아침 구름처럼
  - 아침의 구름 같고
  lexicon: HALOT
  rationale: 덧없고 금세 사라지는 이미지를 살리기 위해 직관적인 비유 형태로 옮겼습니다.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  english_pob_choice: and like the dew that goes away early
  chosen_korean: 일찍 사라지는 이슬 같으며
  alternatives_korean:
  - 아침에 사라지는 이슬 같으며
  - 이른 이슬처럼 사라지며
  lexicon: HALOT
  rationale: מַשְׁכִּים과 הֹלֵךְ의 빠른 소멸감을 자연스러운 한국어로 압축해, 이슬이 곧 사라지는 이미지를 유지했습니다.
- source_word: יְסֹעֵר מִגֹּרֶן
  english_pob_choice: whirled from the threshing floor
  chosen_korean: 타작마당에서 휩쓸려 가는 겨
  alternatives_korean:
  - 타작마당에서 몰려가는 겨
  - 타작마당에서 바람에 날리는 겨
  lexicon: HALOT
  rationale: 겨를 뜻하는 מֹץ와 격렬하게 흩날리는 동사를 함께 살려, 타작의 현장감과 소멸성을 보존했습니다.
- source_word: מֵאֲרֻבָּה
  english_pob_choice: from a window
  chosen_korean: 창문에서 나오는 연기
  alternatives_korean:
  - 창문에서 나가는 연기
  - 문틈에서 나오는 연기
  lexicon: HALOT
  rationale: 아르부아의 기본적 의미를 따라 ‘창문’으로 옮기되, 연기가 밖으로 빠져나가는 그림을 한국어로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예언적 심판 비유의 강도 유지
  chosen_reading: 이스라엘의 덧없음과 소멸을 단순한 쇠퇴가 아니라 곧 사라질 실재로 강하게 표현했습니다.
  alternative_readings:
  - 완곡하게 ‘사라질 것입니다’로만 처리하는 번역
  - 감정적 뉘앙스를 덜어 ‘없어질 것입니다’로 약화하는 번역
  rationale: 본문의 네 겹 비유는 존재의 불안정성과 소멸을 연속적으로 강조하므로, 이를 약화하지 않는 것이 문맥에 충실합니다.
  doctrine_reference: Hosea 13:1-3의 우상숭배와 심판 맥락
