base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/006.yaml
  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
  footnotes:
  - marker: a
    text: Or, 'According to their pasture' or 'As they were pastured.' The Hebrew expression is compact and may describe the circumstance of their abundance.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their heart was lifted up,' an idiom for becoming proud.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 풀을 뜯을 때에[a] 그들은 배불렀습니다. 배부르자 그들의 마음이 높아졌습니다[b]. 그러므로 그들은 저를 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축적이어서 ‘그들의 목초지에 따라’, ‘그들이 풀을 뜯던 때에’, 또는 ‘그들이 먹이를 얻었을 때에’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 마음이 높아졌다’이며, 교만해졌다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  english_pob_choice: As their pasture
  chosen_korean: 그들의 목초지처럼
  alternatives_korean:
  - 그들의 목초지에 따라
  - 그들이 풀을 뜯던 대로
  - 그들이 먹이를 얻은 때에
  lexicon: HALOT
  rationale: כְ는 비유적·상황적 용법을 살려 ‘처럼’으로 처리했고, מַרְעִית는 자연스러운 ‘목초지’로 옮겨 풍요의 상황을 간결하게 드러냈습니다.
- source_word: וַיִּשְׂבָּעוּ / שָׂבְעוּ
  english_pob_choice: they were satisfied / they were satisfied
  chosen_korean: 그들은 만족했습니다 / 그들은 만족했고
  alternatives_korean:
  - 그들은 배불렀습니다
  - 그들은 충족되었습니다
  - 그들은 흡족했습니다
  lexicon: HALOT
  rationale: שׂבע의 반복을 한국어에서도 반복으로 살리되, 첫째는 상태 진입을 나타내는 ‘만족했습니다’, 둘째는 서술 진행을 잇는 ‘만족했고’로 두어 점층을 보존했습니다.
- source_word: וַיָּרָם לִבָּם
  english_pob_choice: their heart was lifted up
  chosen_korean: 그들의 마음은 높아졌습니다
  alternatives_korean:
  - 그들의 마음은 교만해졌습니다
  - 그들의 마음이 들떠 올랐습니다
  - 그들의 심장은 높아졌습니다
  lexicon: HALOT
  rationale: 직역적 은유를 그대로 옮기면서도 현대 한국어에서 자연스러운 ‘마음은 높아졌습니다’를 택해, 문맥상 교만의 함의를 독자가 읽어내도록 했습니다.
- source_word: שְׁכֵחֽוּנִי
  english_pob_choice: they forgot me
  chosen_korean: 그들은 저를 잊었습니다
  alternatives_korean:
  - 그들은 저를 잊어버렸습니다
  - 그들은 저를 무시했습니다
  - 그들은 저를 소홀히 했습니다
  lexicon: HALOT
  rationale: 하나님을 목적어로 둔 שכח의 직접적이고 언약적인 힘을 살려 ‘저를 잊었습니다’로 옮겼습니다.
theological_decisions:
- issue: 풍요가 낳는 내적 교만의 표현
  chosen_reading: ‘마음은 높아졌습니다’로 히브리어 은유를 보존하고, 교만이라는 해석어는 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 그들의 마음은 교만해졌습니다
  - 그들은 교만해졌습니다
  rationale: 본문은 풍요→만족→마음의 상승→하나님 망각의 흐름을 보여 주므로, 은유를 유지해야 원문의 신학적 긴장과 수사 효과가 살아납니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
