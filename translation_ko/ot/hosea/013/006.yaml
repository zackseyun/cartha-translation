  source_fidelity: 원문의 כְּמַרְעִיתָם은 목초지 자체와의 단순 비유라기보다 먹이를 얻고 풀을 뜯는 상황 또는 그에 따른 풍요를 가리키므로, ‘그들의 목초지처럼’은 한국어에서 의미 관계가 불분명합니다. שׂבע의 반복, ‘마음이 높아짐’의 은유, 그리고 하나님을 잊는 결과는 보존해야 합니다.
