id: HOS.7.16
reference: Hosea 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
  footnotes:
  - marker: a
    text: Or, 'but not to the Most High.' This reading understands 'upward' as an elliptical reference to God, influenced by the wording of the previous verse.
    reason: alternative_reading
  - marker: b
    text: '''A deceitful bow'' may also mean ''a slack,'' ''treacherous,'' or ''faulty'' bow—that is, a bow that cannot be trusted to shoot true.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 돌아서되 위로 향하지는 않습니다. 그들은 속이는 활 같습니다. 그들의 고관들은 혀의 오만함 때문에 칼에 쓰러질 것입니다. 이것이 이집트 땅에서 그들의 조롱거리가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 분께로는 아니다’. 이 읽기는 바로 앞절의 표현에 비추어 ‘위로’를 하나님을 가리키는 생략 표현으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשׁוּבוּ
  english_pob_choice: They turn
  chosen_korean: 그들은 돌아서되
  alternatives_korean:
  - 그들은 돌아가되
  - 그들은 돌아오되
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미를 살리면서, 문맥상 단순한 물리적 복귀보다 방향 전환과 영적 이탈의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: לֹא עָל
  english_pob_choice: but not upward
  chosen_korean: 위로 향하지는 않습니다
  alternatives_korean:
  - 위로는 아니합니다
  - 지극히 높으신 분께로는 아닙니다
  lexicon: HALOT
  rationale: 히브리어의 방향 표현을 본문 수준에서 유지해 ‘위로’로 옮겼고, ‘지극히 높으신 분’이라는 해석은 본문이 직접 말하지 않으므로 본문에는 넣지 않았습니다.
- source_word: כְּקֶשֶׁת רְמִיָּה
  english_pob_choice: like a deceitful bow
  chosen_korean: 속이는 활 같습니다
  alternatives_korean:
  - 기만하는 활 같습니다
  - 믿을 수 없는 활 같습니다
  - 헛발질하는 활 같습니다
  lexicon: HALOT
  rationale: רְמִיָּה의 ‘속임/배신/불신뢰’의 뜻을 활의 이미지로 살려, 표적을 제대로 맞히지 못하는 결함 있는 활이라는 비유를 간결하게 전달했습니다.
- source_word: מִזַּעַם לְשׁוֹנָם
  english_pob_choice: because of the rage of their tongue
  chosen_korean: 혀의 오만함 때문에
  alternatives_korean:
  - 혀의 격노 때문에
  - 혀의 분노 때문에
  - 혀의 무례함 때문에
  lexicon: HALOT
  rationale: זַעַם은 여기서 단순한 감정 분노보다 공격적이고 거만한 말투를 가리키는 쪽이 자연스러워, 문맥상 의미를 드러내는 ‘오만함’으로 옮겼습니다.
theological_decisions:
- issue: ‘위로’의 방향 표현과 ‘지극히 높으신 분’ 해석
  chosen_reading: 본문에는 방향어를 유지하고, 하나님을 직접 지칭하는 해석은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 지극히 높으신 분께로는 아닙니다
  - 하나님께로 향하지는 않습니다
  rationale: 히브리어 본문은 여기서 명시적으로 ‘지극히 높으신 분’을 말하지 않으므로, 문맥적 해석 가능성은 인정하되 본문 번역은 과잉해석을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3
