  naturalness: ‘돌아서되’와 ‘속이는 활 같습니다’는 이해할 수 있으나 현대 표준어 합쇼체에서는 각각 ‘돌이키지만’과 ‘믿을 수 없는 활과 같습니다’가 더 자연스럽습니다. ‘위로’의 난해한 방향 표현은 유지하되 각주 표지를 해당 어구에 직접 붙이는 것이 명료합니다.
