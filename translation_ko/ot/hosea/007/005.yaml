    issue: ‘조롱하는 자들과 손을 내밀었습니다’의 의미 및 결합이 불명확함
    rationale: 한국어 ‘~와 손을 내밀다’는 원문의 연대·교제 함의보다 도움을 베푸는 행위로 이해될 수 있습니다. 히브리어의 손을 뻗는 이미지를 살려 대상의 방향을 나타내고, 연대의 함의는 각주에서 설명하는 것이 안전합니다.
