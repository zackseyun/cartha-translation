id: HOS.7.5
reference: Hosea 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֣וֹם מַלְכֵּ֔/נוּ הֶחֱל֥וּ שָׂרִ֖ים חֲמַ֣ת מִ/יָּ֑יִן מָשַׁ֥ךְ יָד֖/וֹ אֶת לֹצְצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
  footnotes:
  - marker: a
    text: Or 'On our king's day'; some understand this as a royal feast day, but 'day of our king' is the more literal wording.
    reason: lexical_alternative
  - marker: b
    text: '''The heat of wine'' may also be understood as ''wine''s burning'' or, less likely, ''the poison of wine.'''
    reason: lexical_alternative
  - marker: c
    text: That is, he associated himself with scoffers by extending his hand to them.
    reason: cultural_note
translation:
  language: ko
  text: 우리 왕의 날에<a> 방백들이 포도주의 열기<b>로 병이 났습니다. 그는 조롱하는 자들과 손을 내밀었습니다<c>.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 왕의 날에’; 어떤 이들은 이를 왕의 잔칫날로 이해하지만, ‘우리 왕의 날’이 더 문자적인 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포도주의 열기’는 ‘포도주의 불타는 기운’ 또는 덜 가능하게는 ‘포도주의 독성’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 그는 손을 내밀어 조롱하는 자들과 어울렸다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  english_pob_choice: On the day of our king
  chosen_korean: 우리 왕의 날에
  alternatives_korean:
  - 우리 왕의 기념일에
  - 우리 왕의 잔칫날에
  lexicon: HALOT
  rationale: 히브리어는 직역하면 “우리 왕의 날”이므로, ‘우리 왕의 날에’로 비교적 직결해 왕실 행사일 가능성은 주석으로만 열어 둡니다.
- source_word: הֶחֱל֥וּ
  english_pob_choice: made themselves sick
  chosen_korean: 병이 났습니다
  alternatives_korean:
  - 스스로 병들었습니다
  - 스스로 아프게 되었습니다
  lexicon: HALOT
  rationale: 동사 חלה의 히필은 문맥상 술 취함으로 인한 자초한 병듦을 가리키므로, ‘병이 났습니다’로 자연스럽게 옮겼습니다.
- source_word: חֲמַ֣ת מִיָּ֑יִן
  english_pob_choice: the heat of wine
  chosen_korean: 포도주의 열기
  alternatives_korean:
  - 포도주의 뜨거움
  - 포도주의 불타는 기운
  lexicon: HALOT
  rationale: חמה는 여기서 문자적 ‘열기/뜨거움’의 이미지가 가장 살기 때문에, ‘포도주의 열기’로 옮겨 음주의 격렬함을 보존했습니다.
- source_word: לֹצְצִֽים
  english_pob_choice: mockers
  chosen_korean: 조롱하는 자들
  alternatives_korean:
  - 비웃는 자들
  - 조소하는 자들
  lexicon: HALOT
  rationale: לצים는 ‘조롱하는 자들/비웃는 자들’의 뜻이므로, 현대 한국어에서 의미가 분명한 ‘조롱하는 자들’을 택했습니다.
theological_decisions:
- issue: ‘그는’의 지시 대상과 손을 내민 행위의 의미
  chosen_reading: 히브리어 단수 동사를 따라 ‘그는’을 유지하고, 앞의 ‘우리 왕’에 가장 자연스럽게 연결되도록 했습니다.
  alternative_readings:
  - 문맥상 왕이 아니라 일반적인 궁정 인물을 가리킨다고 넓게 볼 수도 있습니다.
  - ‘손을 내밀다’를 ‘어울리다/교제하다’로 풀어 쓸 수도 있습니다.
  rationale: 원문은 단수 동사만 제시하고 있어 주어를 과도하게 명시하지 않는 것이 안전합니다. 동시에 앞선 왕 언급 때문에 왕을 가장 자연스러운 지시 대상으로 유지했습니다.
  doctrine_reference: 문맥 우선의 지시 대상 판단
- issue: ‘손을 내밀었습니다’의 문화적 함의
  chosen_reading: 직역을 유지하되, 조롱하는 자들과의 연대/동참이라는 함의를 문장 안에서 열어 두었습니다.
  alternative_readings:
  - ‘조롱하는 자들과 어울렸습니다’처럼 의미를 더 풀어 쓸 수 있습니다.
  rationale: 히브리어 관용구의 이미지를 보존해야 하므로, 본문은 직역에 가깝게 두고 독자가 사회적 동참의 뉘앙스를 읽도록 했습니다.
  doctrine_reference: 관용구의 이미지 보존
