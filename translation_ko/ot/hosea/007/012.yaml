id: HOS.7.12
reference: Hosea 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יֵלֵ֗כוּ אֶפְר֤וֹשׂ עֲלֵי/הֶם֙ רִשְׁתִּ֔/י כְּ/ע֥וֹף הַ/שָּׁמַ֖יִם אֽוֹרִידֵ֑/ם אַיְסִרֵ֕/ם כְּ/שֵׁ֖מַע לַ/עֲדָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
  footnotes:
  - marker: a
    text: Or, 'I will chasten them' or 'I will punish them.' The Hebrew verb can denote corrective discipline or punitive chastisement.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. It may also mean 'according to what was proclaimed in their assembly' or 'as their congregation has heard.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 갈 때에 내가 내 그물을 그들 위에 펼치겠습니다. 하늘의 새들처럼 내가 그들을 내려오게 하겠습니다. 내가 그들의 모임에 전해진 소식에 따라 그들을 징계하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 벌하겠습니다.’ 히브리어 동사는 교정적인 징계나 처벌을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 난해합니다. ‘그들의 모임에서 선포된 대로’ 또는 ‘그들의 회중이 들은 대로’라는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  english_pob_choice: As they go
  chosen_korean: 그들이 가는 동안
  alternatives_korean:
  - 그들이 갈 때
  - 그들이 가면
  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 זמן적 의미를 살리면서, 한국어에서는 ‘가는 동안’이 가장 자연스럽고 문맥의 연속성을 잘 드러냅니다.
- source_word: אֶפְרוֹשׂ ... רִשְׁתִּי עֲלֵי הֶם
  english_pob_choice: I will spread my net over them
  chosen_korean: 내 그물을 그들 위에 펼치겠습니다
  alternatives_korean:
  - 내 그물을 그들 위에 펼치겠습니다
  - 내 그물을 그들 위에 던지겠습니다
  lexicon: HALOT
  rationale: פָּרַשׂ와 ‘그물’의 결합은 포획 이미지를 가지므로 ‘펼치겠습니다’가 문자적이면서도 자연스럽습니다.
- source_word: כְּעוֹף הַשָּׁמַיִם
  english_pob_choice: like the birds of the heavens
  chosen_korean: 하늘의 새들처럼
  alternatives_korean:
  - 하늘의 새들처럼
  - 공중의 새들처럼
  lexicon: HALOT
  rationale: ‘하늘’은 원문의 הַשָּׁמַיִם를 직접 반영하고, ‘새들처럼’은 집합적 표현을 한국어에 자연스럽게 옮깁니다.
- source_word: אוֹרִידֵם
  english_pob_choice: I will bring them down
  chosen_korean: 내가 그들을 끌어내리겠습니다
  alternatives_korean:
  - 내가 그들을 끌어내리겠습니다
  - 내가 그들을 떨어뜨리겠습니다
  lexicon: HALOT
  rationale: 히필형의 ‘내려가게 하다’는 뜻을 유지하면서, 포획 비유 안에서 강제성을 드러내는 ‘끌어내리다’가 적절합니다.
- source_word: אַיְסִרֵם
  english_pob_choice: I will chasten them
  chosen_korean: 내가 그들을 징계하겠습니다
  alternatives_korean:
  - 내가 그들을 징계하겠습니다
  - 내가 그들을 훈계하겠습니다
  - 내가 그들을 벌하겠습니다
  lexicon: HALOT
  rationale: יסר는 교정적 징계와 형벌적 책망을 모두 포함할 수 있으므로, 문맥의 심판성을 유지하면서도 교정의 뉘앙스를 남기는 ‘징계하다’를 택했습니다.
- source_word: כְּשֵׁמַע לַעֲדָתָם
  english_pob_choice: according to the report to their assembly
  chosen_korean: 그들의 모임에 들린 소문에 따라
  alternatives_korean:
  - 그들의 모임에 들린 소문에 따라
  - 그들의 회중이 들은 대로
  - 그들의 모임에서 들은 소문에 따라
  lexicon: HALOT
  rationale: שֵׁמַע는 ‘소문/들림/보고’의 뜻을 가질 수 있어, 원문의 난해함을 보존하면서도 한국어로는 ‘들린 소문’이 가장 무난하게 대응됩니다. עֲדָה는 ‘회중’보다 중립적인 ‘모임’으로 옮겼습니다.
theological_decisions:
- issue: אַיְסִרֵם의 징계/처벌 뉘앙스
  chosen_reading: ‘징계하겠습니다’로 옮겨, 단순한 보복이 아니라 경고적·교정적 심판의 성격을 함께 드러냈습니다.
  alternative_readings:
  - 벌하겠습니다
  - 처벌하겠습니다
  - 훈계하겠습니다
  rationale: 예언서의 심판 발화는 회복 가능성을 배제하지 않는 경우가 많으므로, יסר의 의미 범위를 좁히지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3
- issue: 마지막 절의 난해한 구문 보존
  chosen_reading: 의미를 매끈하게 확정하기보다 ‘그들의 모임에 들린 소문에 따라’로 비교적 직역적인 형태를 유지했습니다.
  alternative_readings:
  - 그들의 회중이 들은 대로
  - 그들의 집회에서 선포된 대로
  - 그들의 모임에 알려진 대로
  rationale: 원문의 구문이 모호하므로, 본문에서 해석을 과잉 확정하지 않고 독자가 난점을 인지하도록 하는 것이 source-grounded 번역 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3
