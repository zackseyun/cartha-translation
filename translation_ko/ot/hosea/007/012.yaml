revisions:
- from: 그들이 가는 동안 내가 내 그물을 그들 위에 펼치겠습니다. 하늘의 새들처럼 내가 그들을 끌어내리겠습니다. 내가 그들의 모임에 들린 소문에 따라 그들을 징계하겠습니다.[a][b]
  to: 그들이 갈 때에 내가 내 그물을 그들 위에 펼치겠습니다. 하늘의 새들처럼 내가 그들을 내려오게 하겠습니다. 내가 그들의 모임에 전해진 소식에 따라 그들을 징계하겠습니다.[a][b]
  rationale: 마지막 절의 모호한 관계를 중립적인 ‘모임에 전해진 소식’으로 유지하고, ‘소문’이 더하는 부정적 함의와 ‘모임에 들린’의 과도한 장소적 확정을 피했습니다. 사역동사에는 불필요한 ‘끌다’의 의미를 더하지 않았습니다. 또한 각주 a를 실제 설명 대상인 ‘징계하겠습니다’ 뒤에 배치하여 앵커 불일치를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:12Z'
review_pass:
  verdict: revise
  source_fidelity: 앞부분의 포획 비유와 אַיְסִרֵם의 ‘징계’는 대체로 충실합니다. 그러나 כְּשֵׁמַע לַעֲדָתָם에서 ‘소문’은 원문의 שֵׁמַע가 지닌 중립적인 ‘들림/소식/전언’보다 불필요하게 부정적인 뉘앙스를 더하며, ‘모임에 들린’은 לַ의 관계를 지나치게 장소적으로 확정합니다. ‘그들의 모임에 전해진 소식에 따라’는 원문의 난해함을 보존하면서 영어 POB의 audit trail에도 더 가깝습니다.
  naturalness: ‘그들이 가는 동안’도 가능하지만, כַּאֲשֶׁר의 시간적 용법에는 ‘그들이 갈 때에’가 더 간결하고 자연스럽습니다. ‘끌어내리겠습니다’는 원문의 사역형에 없는 ‘끌다’의 구체적 동작을 보태므로 ‘내려오게 하겠습니다’로 고쳤습니다. 이는 한국어에서 다소 문어적이지만 예언문과 합쇼체에 자연스럽게 어울립니다.
  terminology: ‘징계하겠습니다’는 יסר의 교정적이면서도 심판적인 범위를 적절히 유지합니다. עֵדָה는 교회 제도 용어를 피하여 ‘모임’으로 유지했습니다. ‘소문’은 ‘소식’으로 바꾸어 평가적 함의를 피했습니다.
  issues:
  - severity: medium
    issue: 각주 표지 a가 ‘그들이 가는 동안’ 뒤에 놓여 있으나, 각주 내용은 אַיְסִרֵם(‘징계하겠습니다’)의 어휘 대안을 설명합니다.
    rationale: 각주 앵커는 설명 대상 어구에 붙어야 합니다. 현재 위치는 독자가 ‘가는’의 대안 설명으로 오해하게 합니다.
  - severity: medium
    issue: ‘그들의 모임에 들린 소문’은 난해한 마지막 구절을 부정적이고 장소적인 뜻으로 과도하게 특정합니다.
    rationale: שֵׁמַע는 ‘소문’에 한정되지 않으며, לַעֲדָתָם도 단순한 장소격으로 확정하기 어렵습니다. ‘모임에 전해진 소식’이 더 중립적이고 원문 및 영어 audit trail의 모호성을 보존합니다.
  - severity: low
    issue: ‘끌어내리겠습니다’는 ‘끌다’라는 수단을 덧붙입니다.
    rationale: אוֹרִידֵם은 기본적으로 ‘내려오게 하다/내리다’이므로, 추가된 물리적 동작 없이 옮기는 편이 더 충실합니다.
