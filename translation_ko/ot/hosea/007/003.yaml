    text: Or 'and by their deceit, the officials.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 악으로 왕을 기쁘게 하고, 그들의 거짓으로는 고관들을 기쁘게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 속임수로는 고관들을 기쁘게 합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָתָם
  english_pob_choice: By their evil
  chosen_korean: 그들의 악으로
  alternatives_korean:
  - 그들의 악을 통해
  - 그들의 악행으로
  - 그들의 악으로 인해
  lexicon: HALOT
  rationale: ב의 수단·원인 용법을 살려 ‘-으로’로 옮겼고, 영어 POB의 ‘evil’을 따라 ‘악’으로 간명하게 표현했습니다.
- source_word: יְשַׂמְּחוּ
  english_pob_choice: they make ... glad
  chosen_korean: 기쁘게 하고
  alternatives_korean:
  - 기쁘게 만듭니다
  - 즐겁게 합니다
  - 즐거워하게 합니다
  lexicon: HALOT
  rationale: 피엘형의 사역적 의미를 살려 ‘기쁘게 하다’로 옮겼으며, 한국어에서 가장 자연스러운 결과상 표현으로 처리했습니다.
- source_word: שָׂרִים
  english_pob_choice: the princes
  chosen_korean: 고관들
  alternatives_korean:
  - 방백들
  - 통치자들
  - 관리들
  lexicon: HALOT
  rationale: שׂרים은 궁정·정치적 고위 인물을 가리키므로, ‘왕’과의 병렬을 살리면서도 현대 독자가 이해하기 쉬운 ‘고관들’로 옮겼습니다.
theological_decisions:
- issue: 왕과 고관들을 향한 비판적 병행 구조
  chosen_reading: 한 사회의 지도층이 악과 거짓으로 통치자를 만족시키는 부패한 상태를 드러내는 문장으로 유지했습니다.
  alternative_readings:
  - 단순히 개인적 도덕 실패로 좁히는 읽기
  - 정치적 비유를 약화해 일반적 교훈으로 바꾸는 읽기
  rationale: 본문은 ‘악/거짓’과 ‘왕/고관들’의 평행을 통해 지도층 전체의 타락을 고발하므로, 그 긴장을 약화하지 않고 직설적으로 옮기는 것이 소스에 충실합니다.
  doctrine_reference: 예언서의 언약적 고발과 공적 책임
