  - 이스라엘의 위엄
  lexicon: HALOT
  rationale: 문맥상 긍정적 ‘위엄’보다 부정적 의미의 ‘교만’이 더 직접적으로 드러납니다.
- source_word: בְּפָנָיו
  english_pob_choice: against him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그를 향하여
  - 그의 얼굴 앞에서
  - 그에게
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴/앞’ 표현을 살리면서도 한국어에서는 자연스럽게 증언이 서는 자리의 의미를 전달하도록 했습니다.
- source_word: בְּכָל זֹאת
  english_pob_choice: in all this
  chosen_korean: 이 모든 일 가운데서도
  alternatives_korean:
  - 이 모든 가운데
  - 이 모든 일을 겪으면서도
  - 그럼에도 불구하고
  lexicon: HALOT
  rationale: 히브리어의 범위감과 문맥상 양보적 뉘앙스를 함께 살리되, 본문을 과도하게 의역하지 않도록 했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
