  - 주님
  rationale: 표제어 지침에 따라 신적 고유명사는 대체 титул이 아니라 음역형 ‘야훼’로 유지했습니다.
  doctrine_reference: Divine name rendering policy / original-language primacy
- issue: ‘그의’의 단수 지시 대상
  chosen_reading: 이스라엘을 가리키는 단수 지시를 유지했습니다.
  alternative_readings:
  - 집단을 나타내는 복수로 풀어 ‘그들의’로 변경
  - 문맥상 공동체 전체를 뜻한다고 완전히 평탄화
  rationale: 히브리어 단수 어미를 평탄화하지 않고 보존해, 집단명 ‘이스라엘’과 단수 지시 사이의 긴장을 유지했습니다.
  doctrine_reference: Preserve grammatical tension rather than smoothing number shifts
