translation:
  language: ko
  text: 이스라엘의 교만이 그를 거슬러 증언합니다[a]. 그러나 그들은 그들의 하나님이신 야훼께로 돌아오지 않고, 이 모든 일 가운데서도 그를 찾지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 앞에서’ 또는 ‘그의 얼굴을 향하여’. 히브리어는 문자적으로 ‘그의 얼굴 안에서/앞에서’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 모든 일에도 불구하고’.
    reason: lexical_alternative
