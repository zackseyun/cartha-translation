base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
  footnotes:
  - marker: a
    text: Or 'to his face' or 'before him'; the Hebrew literally reads 'in/against his face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'despite all this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 교만이 그의 앞에서 증언하지만[a], 그들은 자기들의 하나님이신 야훼께로 돌아오지 않고, 이 모든 일 가운데서도 그를 찾지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴/앞에서’입니다. 여기서는 법정적 문맥에 맞게 ‘그의 앞에서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 모든 일에도 불구하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  english_pob_choice: testifies
  chosen_korean: 증언하지만
  alternatives_korean:
  - 대답하지만
  - 응답하지만
  - 증언합니다
  lexicon: HALOT
  rationale: 예언적 고발 문맥에서 ‘답하다’보다 법정적·증언적 뉘앙스를 살려 ‘증언하다’로 옮겼습니다.
- source_word: גְּאוֹן יִשְׂרָאֵל
