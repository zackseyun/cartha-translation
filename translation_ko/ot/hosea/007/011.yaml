  - severity: low
    issue: 두 히브리어 묘사의 구별이 본문에서 약화됨
    rationale: ‘분별없는 비둘기’만으로는 פוֹתָה와 אֵין לֵב의 두 표현이 하나로 합쳐집니다. 비둘기의 어리석음과 에브라임의 무분별함을 각각 드러내는 것이 더 가깝습니다.
