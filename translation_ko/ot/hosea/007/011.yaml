base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
  footnotes:
  - marker: a
    text: Literally, 'without heart,' an idiom meaning without understanding or sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 분별없는 비둘기처럼 되어 버렸습니다. 그들은 이집트에 부르고, 앗수르로 갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음이 없다’는 뜻이지만, 여기서는 분별이나 이해가 없다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: has become
  chosen_korean: 되어 버렸습니다
  alternatives_korean:
  - 되었습니다
  - 되어 있습니다
  lexicon: HALOT
  rationale: 결과 상태를 나타내는 완료적 뉘앙스를 살리면서, 선지자적 책망의 느낌도 자연스럽게 드러냅니다.
- source_word: כְּיוֹנָה פוֹתָה
  english_pob_choice: like a silly dove
  chosen_korean: 분별없는 비둘기처럼
  alternatives_korean:
  - 어리석은 비둘기처럼
  - 철없는 비둘기처럼
  - 순진한 비둘기처럼
  lexicon: HALOT
  rationale: פוֹתָה는 단순한 귀여움이 아니라 판단력 부족과 속기 쉬움을 가리키므로, 한국어에서는 '분별없는'이 의미를 가장 직접적으로 드러냅니다.
- source_word: אֵין לֵב
  english_pob_choice: without sense
  chosen_korean: 분별이 없습니다
  alternatives_korean:
  - 마음이 없습니다
  - 이해가 없습니다
  - 생각이 없습니다
  lexicon: HALOT
  rationale: 히브리어 לֵב는 정서보다 판단·이해를 포함할 수 있으므로, 직역의 '마음'보다 의미 중심의 '분별'이 문맥에 더 가깝습니다.
- source_word: מִצְרַיִם / אַשּׁוּר
  english_pob_choice: Egypt / Assyria
  chosen_korean: 이집트 / 앗수르
  alternatives_korean:
  - 애굽 / 아시리아
  lexicon: HALOT
  rationale: 지명은 현대 표준 음역을 따르되, 예언서의 역사적 지평을 유지하기 위해 본문에서 일반적으로 통용되는 고유명으로 옮겼습니다.
theological_decisions:
- issue: 에브라임의 지시 대상
  chosen_reading: 본문의 고유명 '에브라임'을 그대로 유지해, 북이스라엘을 가리키는 예언적 메타님으로 읽히게 했습니다.
  alternative_readings:
  - 이스라엘
  - 북이스라엘
  rationale: 원문은 해석어보다 이름 자체를 사용하므로, 본문에서는 지시 대상을 풀어쓰지 않고 독자가 문맥으로 인식하도록 두는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 고유명은 번역보다 음역을 우선하는 번역 철학
