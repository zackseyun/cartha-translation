  text: 내가 이스라엘을 고치려 할 때에[a] 에브라임의 죄악이 드러나고 사마리아의 악행도 드러납니다. 그들이 거짓을 행하기 때문입니다.[b] 도둑이 들어오고, 약탈대가 밖에서 약탈합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
