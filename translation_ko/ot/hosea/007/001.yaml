  source_fidelity: 첫 절의 시간 절과 하나님의 1인칭은 대체로 정확합니다. 그러나 ‘약탈 무리가 밖에서 벗겨 갑니다’는 פשט의 약탈·침탈 의미를 한국어로 자연스럽게 전달하지 못하며, 무엇을 벗기는지도 불분명합니다. ‘약탈대가 밖에서 약탈합니다’가 גדוד과 בַּחוּץ의 대조를 자연스럽게 보존합니다.
  naturalness: 합쇼체는 대체로 일관되지만, 기존 마지막 절의 ‘벗겨 갑니다’는 현대 표준 한국어 문장으로 매우 부자연스럽습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해와 주석 연결에 적절합니다.
  terminology: ‘에브라임’, ‘사마리아’는 적절합니다. עָוֹן에는 ‘죄악’이 한국어 성경 문체와 윤리적 무게를 더 잘 전달하며, רָעוֹת는 문맥상 ‘악행’으로 옮길 수 있습니다. שָׁקֶר의 ‘거짓을 행하다’도 원문의 행위 동사를 잘 반영합니다.
