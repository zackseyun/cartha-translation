  - marker: c
    text: Or, 'a band of robbers plunders outside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘을 고치려 할 때에 에브라임의 불의가 드러나며 사마리아의 악한 행위가 나타납니다. 그들이 거짓을 행하기 때문입니다. 도둑이 들어오고, 약탈 무리가 밖에서 벗겨 갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 이스라엘을 고쳤을 때에’, ‘내가 이스라엘을 고치고 있을 때에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 속임을 행합니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘약탈하는 무리가 밖에서 노략질합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי לְיִשְׂרָאֵל
  english_pob_choice: When I would heal Israel
  chosen_korean: 내가 이스라엘을 고치려 할 때에
  alternatives_korean:
  - 내가 이스라엘을 고칠 때에
  - 내가 이스라엘을 치유하려 할 때에
  - 내가 이스라엘을 치유할 때에
  lexicon: HALOT
  rationale: 조건·동시의 כ 구문과 1인칭 하나님의 발화를 살려, 미래 지향의 의도까지 담을 수 있는 ‘고치려 할 때에’를 택했습니다.
- source_word: וְנִגְלָה עֲוֺן אֶפְרַיִם
  english_pob_choice: the iniquity of Ephraim is uncovered
  chosen_korean: 에브라임의 불의가 드러나며
  alternatives_korean:
  - 에브라임의 죄악이 드러나며
  - 에브라임의 불법이 드러나며
  - 에브라임의 죄가 드러나며
  lexicon: HALOT
  rationale: עָוֹן의 무게를 살리되 한국어에서 자연스럽고 윤리적 함의를 유지하는 ‘불의’로 옮겼습니다.
- source_word: וְרָעוֹת שֹׁמְרוֹן
  english_pob_choice: the evil deeds of Samaria
  chosen_korean: 사마리아의 악한 행위가 나타납니다
  alternatives_korean:
  - 사마리아의 악들이 나타납니다
  - 사마리아의 악한 일들이 나타납니다
  - 사마리아의 사악함이 나타납니다
  lexicon: HALOT
  rationale: 복수형 רָעוֹת을 행위 중심으로 드러내기 위해 ‘악한 행위’로 옮겼고, 정치·도시 표지인 ‘사마리아’를 유지했습니다.
- source_word: פָעֲלוּ שָׁקֶר
  english_pob_choice: they practice falsehood
  chosen_korean: 그들이 거짓을 행하기 때문입니다
  alternatives_korean:
  - 그들이 거짓을 실천하기 때문입니다
  - 그들이 속임을 행하기 때문입니다
  - 그들이 거짓을 일삼기 때문입니다
  lexicon: HALOT
  rationale: ‘행하다’ 동사를 살려 지속적·습관적 행위를 나타내면서, שָׁקֶר의 직접적 의미를 ‘거짓’으로 반영했습니다.
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  english_pob_choice: a raiding band strips outside
  chosen_korean: 약탈 무리가 밖에서 벗겨 갑니다
  alternatives_korean:
  - 약탈 무리가 밖에서 노략질합니다
  - 침략 무리가 밖에서 약탈합니다
  - 약탈대가 바깥에서 벗깁니다
  lexicon: HALOT
  rationale: פָּשַׁט의 ‘벗기다/벗겨 가다’ 이미지를 살리되, גדוד의 집단성을 ‘약탈 무리’로 옮겨 집 안의 도둑과 대비되게 했습니다.
theological_decisions:
- issue: 하나님의 치유 행위와 죄의 노출의 시간관계
  chosen_reading: 하나님이 이스라엘을 고치려 하시는 바로 그 때에 에브라임과 사마리아의 죄가 드러난다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 이미 치유가 이루어진 뒤 죄가 드러났다는 과거 사건으로 읽을 수 있습니다.
  - ‘치유하는 중에’라는 진행적 뉘앙스로 읽을 수 있습니다.
  rationale: 히브리어 כ 구문은 시점·상황을 모두 열어 두지만, 문맥상 회복 시도와 동시적으로 폭로되는 죄를 강조합니다.
  doctrine_reference: 호세아의 예언적 심판-회복 긴장
