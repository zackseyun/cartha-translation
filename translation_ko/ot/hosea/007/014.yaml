  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
  footnotes:
  - marker: a
    text: Or, 'they gather themselves for grain and new wine.' The Hebrew verb here is difficult and may refer either to assembling themselves or to gashing/cutting themselves in ritual lament.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 마음으로 내게 부르짖지 않고, 자기들의 침상에서 통곡하며, 곡식과 새 포도주를 위해 모여들고[a], 나에게서 돌아섭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 난해합니다. ‘곡식과 새 포도주를 위해 모여들다’로 이해할 수도 있고, 의례적 애곡 가운데 ‘자기 몸을 베거나 상처 내다’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ אֵלַי בְּלִבָּם
  english_pob_choice: cry out to me from their heart
  chosen_korean: 마음으로 내게 부르짖지 않고
  alternatives_korean:
  - 진심으로 내게 부르짖지 않고
  - 마음에서 내게 부르짖지 않고
  lexicon: HALOT
  rationale: זעק의 강한 호소를 살려 ‘부르짖다’로 옮기고, בְּלִבָּם은 외형적 울부짖음과 대비되는 내면의 진실성을 나타내므로 ‘마음으로’가 자연스럽습니다.
- source_word: יְיֵלִילוּ עַל מִשְׁכְּבוֹתָם
  english_pob_choice: wail on their beds
  chosen_korean: 침상에서만 통곡합니다
  alternatives_korean:
  - 침상 위에서 통곡합니다
  - 침상에서 울부짖습니다
  lexicon: HALOT
  rationale: ילל의 통곡/울부짖음을 현대 한국어에서 힘 있게 살리되, 개인적이고 내향적인 애통의 장면을 ‘침상에서만’으로 드러냈습니다.
- source_word: יִתְגּוֹרָרוּ
  english_pob_choice: they gather themselves
  chosen_korean: 서로 모여들기만 하며
  alternatives_korean:
  - 자기들끼리 모여들며
  - 곡식과 새 포도주를 위해 모이며
  - 자해하며
  lexicon: HALOT
  rationale: 본문의 난해한 동사는 영어 POB의 현행 본문처럼 ‘모여들다’ 계열로 처리하되, 오해를 줄이기 위해 목적의 전면화를 피하고 문맥상 집단적 종교행위를 나타내는 흐름을 살렸습니다.
- source_word: יָסוּרוּ בִי
  english_pob_choice: they turn away from me
  chosen_korean: 나를 떠나 갑니다
  alternatives_korean:
  - 내게서 돌아섭니다
  - 나에게서 멀어집니다
  lexicon: HALOT
  rationale: סור עם ב는 관계적 이탈과 이반을 뜻하므로, 단순한 이동이 아닌 언약적 이탈을 드러내는 ‘떠나 갑니다’로 옮겼습니다.
theological_decisions:
- issue: יִתְגּוֹרָרוּ의 난해성 처리
  chosen_reading: ‘모여들다’ 쪽으로 옮기되, 자해·의례적 통곡으로 단정하지는 않았습니다.
  alternative_readings:
  - 자해합니다
  - 자기 몸을 찢습니다
  - 곡식과 새 포도주를 위해 모입니다
  rationale: 주어진 본문과 최신 POB 개정 방향을 따라, 해석을 과도하게 확정하는 표현은 피하고 문맥상 집단적 종교 행위의 모호성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
