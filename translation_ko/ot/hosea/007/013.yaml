source:
  edition: WLC
  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
  footnotes:
  - marker: a
    text: 'Or, ''Yet I would redeem them''; some take the verb as past: ''But I redeemed them.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게 화가 있습니다. 그들이 나에게서 떠돌아갔기 때문입니다. 그들에게 파멸이 있습니다. 그들이 나에게 반역하였기 때문입니다. 내가 그들을 속량하려 하지만, 그들은 나를 거슬러 거짓을 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 내가 그들을 속량하려 한다.” 어떤 이들은 이를 과거로 이해하여 “그러나 내가 그들을 속량하였다”로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: א֤וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬픔이 있습니다
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 탄식과 심판의 경고를 함께 드러내는 표현으로, 현대 한국어에서 자연스럽고 무게감 있게 전달합니다.
- source_word: נָדְד֣וּ מִמֶּ֔נִּי
  english_pob_choice: have wandered away from me
  chosen_korean: 내게서 떠돌아다녔습니다
  alternatives_korean:
  - 내게서 떠났습니다
  - 내게서 도망했습니다
  - 내게서 떠돌았습니다
  lexicon: HALOT
  rationale: נָדַד의 ‘떠남/유랑’과 언약적 거리감을 살리기 위해 단순한 ‘떠났다’보다 분리와 방황의 뉘앙스를 가진 표현을 택했습니다.
- source_word: שֹׁ֥ד לָהֶ֖ם
  english_pob_choice: Destruction is theirs
  chosen_korean: 파멸이 그들에게 있습니다
  alternatives_korean:
  - 파멸이 그들 몫입니다
  - 멸망이 그들에게 있습니다
  lexicon: HALOT
  rationale: 히브리어의 명사구를 살려 결과가 ‘그들에게 속해 있다’는 판결문 같은 어감을 보존했습니다.
- source_word: פָ֣שְׁעוּ בִ֑י
  english_pob_choice: have rebelled against me
  chosen_korean: 내게 반역하였기 때문입니다
  alternatives_korean:
  - 내게 범죄하였기 때문입니다
  - 내게서 배반하였기 때문입니다
  lexicon: HALOT
  rationale: פשע는 단순한 죄보다 언약적 불충성과 반역을 가리키므로, ‘반역’이 문맥을 가장 직접적으로 드러냅니다.
- source_word: וְ/אָנֹכִ֣י אֶפְדֵּ֔ם
  english_pob_choice: Though I would redeem them
  chosen_korean: 내가 그들을 속량하려 하였으나
  alternatives_korean:
  - 내가 그들을 속량하려 하건만
  - 내가 그들을 속량하겠지만
  - 내가 그들을 속량하였다
  lexicon: HALOT
  rationale: 불완전형의 열려 있는 의미를 살려, 과거 완료로 확정하지 않고 하나님의 구속 의지를 대조적으로 표현했습니다.
- source_word: דִּבְּר֥וּ עָלַ֖י כְּזָבִֽים
  english_pob_choice: they speak lies against me
  chosen_korean: 그들은 내게 거짓말을 합니다
  alternatives_korean:
  - 그들은 내게 거짓을 말합니다
  - 그들은 나를 향해 거짓을 말합니다
  lexicon: HALOT
  rationale: עָלַי의 대항성을 살리면서도 한국어에서는 가장 자연스러운 직접목적어 구조로 옮겼습니다.
theological_decisions:
- issue: וְאָנֹכִי אֶפְדֵּם의 시제와 함의
  chosen_reading: ‘속량하려 하였으나’로 옮겨, 하나님의 구속 의지와 이스라엘의 지속되는 거짓 사이의 긴장을 보존했습니다.
  alternative_readings:
  - ‘내가 그들을 속량합니다’
  - ‘내가 그들을 속량하겠습니다’
  - ‘내가 그들을 속량하였습니다’
  rationale: 히브리어 미완료형을 단정된 과거로 닫지 않고, 본문이 드러내는 하나님의 마음과 인간의 배반을 함께 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
