  to: 그들에게 화가 있습니다. 그들이 나에게서 떠돌아갔기 때문입니다. 그들에게 파멸이 있습니다. 그들이 나에게 반역하였기 때문입니다. 내가 그들을 속량하려 하지만, 그들은 나를 거슬러 거짓을 말합니다.[a]
