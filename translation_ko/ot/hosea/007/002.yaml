id: HOS.7.2
reference: Hosea 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
  footnotes:
  - marker: a
    text: Or 'say to themselves.' The Hebrew idiom is literally 'say to their heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all their wickedness.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'before my face,' an idiom expressing direct exposure to God's presence and scrutiny.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 마음속으로[a] 「내가 그들의 모든 악[b]을 기억한다」고 말하지 않습니다. 이제 그들의 행위가 그들을 에워쌉니다. 그것들은 내 얼굴 앞에 있습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음속으로’는 히브리어 관용구 ‘자기들의 마음에 말하다’를 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그들의 모든 사악함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 얼굴 앞에’로, 하나님의 임재 앞에 직접 노출되어 있음을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל יֹאמְרוּ לִלְבָבָם
  english_pob_choice: And they do not say in their heart
  chosen_korean: 그들은 자기 마음속으로도 …고 말하지 않습니다
  alternatives_korean:
  - 그들은 자기 속으로도 …고 말하지 않습니다
  - 그들은 스스로에게도 …고 말하지 않습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘말하다 + 마음/마음속’은 내적 성찰을 가리키므로, 한국어에서는 자연스러운 합쇼체로 옮기되 ‘마음속으로도’로 내면성을 살렸습니다.
- source_word: כָּל רָעָתָם
  english_pob_choice: all their evil
  chosen_korean: 그들의 모든 악
  alternatives_korean:
  - 그들의 모든 악행
  - 그들의 모든 사악함
  lexicon: HALOT
  rationale: רָעָה는 단순한 행위만이 아니라 도덕적 악 전체를 가리키므로, 본문이 포괄하는 책임의 범위를 살려 ‘모든 악’으로 옮겼습니다.
- source_word: סְבָבוּם מַעַלְלֵיהֶם
  english_pob_choice: their deeds surround them
  chosen_korean: 그들의 행위가 그들을 에워싸고 있습니다
  alternatives_korean:
  - 그들의 행위가 그들을 둘러싸고 있습니다
  - 그들의 행위가 그들을 포위하고 있습니다
  lexicon: HALOT
  rationale: 동사는 단순한 공간적 주변이 아니라 죄의 행위가 사람을 둘러싼다는 비유를 담으므로, ‘에워싸고 있습니다’가 압박감과 포위 이미지를 함께 살립니다.
- source_word: נֶגֶד פָּנַי הָיוּ
  english_pob_choice: they are before my face
  chosen_korean: 그것들은 내 얼굴 앞에 있습니다
  alternatives_korean:
  - 그것들은 내 앞에 있습니다
  - 그것들은 내 얼굴 앞에 놓여 있습니다
  lexicon: HALOT
  rationale: ‘얼굴 앞에’는 하나님의 직접적인 현전과 감찰을 드러내는 관용구이므로, 평이한 ‘내 앞에’로 약화시키지 않고 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 하나님의 감찰을 나타내는 ‘얼굴 앞에’ 관용구 보존
  chosen_reading: ‘그것들은 내 얼굴 앞에 있습니다’
  alternative_readings:
  - ‘그것들은 내 앞에 있습니다’
  rationale: 본문의 표현은 단순한 위치가 아니라 하나님의 즉각적 인지와 심판 아래 드러난 상태를 강조하므로, 관용구의 시각적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
