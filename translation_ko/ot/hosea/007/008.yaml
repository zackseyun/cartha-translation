translation:
  language: ko
  text: 에브라임은 여러 민족[a] 가운데 섞여 들어갑니다. 에브라임은 뒤집지 않은 빵이 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
