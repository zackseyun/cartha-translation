  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶפְרַ֕יִם בָּ/עַמִּ֖ים ה֣וּא יִתְבּוֹלָ֑ל אֶפְרַ֛יִם הָיָ֥ה עֻגָ֖ה בְּלִ֥י הֲפוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
  footnotes:
  - marker: a
    text: Or 'mingles himself among the nations.'
    reason: lexical_alternative
  - marker: b
    text: The image is of bread left unturned while baking—burned on one side and underdone on the other.
    reason: cultural_note
translation:
  language: ko
  text: 에브라임은 여러 민족들[a] 가운데서 섞여 듭니다. 에브라임은 뒤집지 않은 케이크가 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데서 섞여 듭니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 굽는 동안 뒤집지 않은 빵을 가리키며, 한쪽은 타고 다른 쪽은 덜 익은 상태를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  english_pob_choice: mixes himself
  chosen_korean: 섞여 듭니다
  alternatives_korean:
  - 자기 자신을 섞습니다
  - 어울려 듭니다
  - 뒤섞입니다
  lexicon: HALOT
  rationale: 히트폴엘의 반사적 뉘앙스를 살리되, 한국어에서는 ‘자기 자신을’의 노출보다 ‘섞여 듭니다’가 자연스럽고 예언적 비판의 뜻을 유지합니다.
- source_word: בָּעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 여러 민족들
  alternatives_korean:
  - 백성들 가운데
  - 민족들 가운데
  - 나라들 가운데
  lexicon: HALOT
  rationale: עַמִּים는 ‘민족들/백성들’을 뜻할 수 있으므로, 외국 집단들과의 혼재라는 뜻을 살려 ‘여러 민족들’로 옮겼습니다.
- source_word: עֻגָה
  english_pob_choice: cake
  chosen_korean: 케이크
  alternatives_korean:
  - 떡
  - 납작빵
  - 빵
  lexicon: HALOT
  rationale: 원문의 비유는 구운 둥근 빵 종류를 가리키며, 한국어에서는 현대 독자가 즉시 떠올릴 수 있는 ‘케이크’가 비유의 형상을 가장 직접적으로 전달합니다.
- source_word: בְּלִי הֲפוּכָה
  english_pob_choice: not turned
  chosen_korean: 뒤집지 않은
  alternatives_korean:
  - 뒤집지 않은 채인
  - 뒤집히지 않은
  - 뒤집지 않은 상태의
  lexicon: HALOT
  rationale: 빵을 굽는 과정에서 한 번도 뒤집지 않아 한쪽은 타고 다른 쪽은 덜 익은 상태를 가리키므로, 간결하게 ‘뒤집지 않은’으로 렌더링했습니다.
theological_decisions:
- issue: ‘에브라임’의 지시 대상
  chosen_reading: 본문의 고유명사 ‘에브라임’을 그대로 두어, 북이스라엘을 대표하는 언약사적 이름으로 읽게 했습니다.
  alternative_readings:
  - 이스라엘
  - 북왕국
  rationale: 원문은 해석어가 아니라 ‘에브라임’을 사용하므로, 본문 투명성을 위해 주석적 풀이는 본문에 끌어오지 않았습니다.
  doctrine_reference: Original-language primacy over interpretive substitution; translate names, do not paraphrase the referent into the main text.
