  lexicon: HALOT
  rationale: 직역 형태를 유지해 오븐 비유의 연결고리를 보존했습니다. POB가 제시한 문화적/비유적 긴장도 함께 남깁니다.
- source_word: בֹעֵר כְּאֵשׁ לֶהָבָה
  english_pob_choice: it burns like a flaming fire
  chosen_korean: 타오르며 불꽃 같은 불이 됩니다
  alternatives_korean:
  - 불길처럼 타오릅니다
  - 화염처럼 불붙습니다
  lexicon: HALOT
  rationale: בער와 ‘불꽃 같은 불’의 이중 강화를 살려, 단순한 ‘불타다’보다 점층적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 매복/잠복 표현의 처리
  chosen_reading: ‘포위된 곳에 있는’으로 완화된 공간 이미지를 사용해, 매복과 공격 준비의 의미를 직접적인 한국어로만 고정하지 않았습니다.
  alternative_readings:
  - ‘매복하는 가운데’
  - ‘잠복하며’
  rationale: 히브리어 구문이 압축적이고 은유적이므로, 해석을 과도하게 단정하지 않고 적절한 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve tension rather than resolve it
