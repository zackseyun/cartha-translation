id: HOS.7.6
reference: Hosea 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי קֵרְב֧וּ כַ/תַּנּ֛וּר לִבָּ֖/ם בְּ/אָרְבָּ֑/ם כָּל הַ/לַּ֨יְלָה֙ יָשֵׁ֣ן אֹֽפֵ/הֶ֔ם בֹּ֕קֶר ה֥וּא בֹעֵ֖ר כְּ/אֵ֥שׁ לֶהָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
  footnotes:
  - marker: a
    text: Or 'in their ambush' or 'while they lie in wait.' The Hebrew phrase carries the sense of plotting or lurking for an attack.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their baker.' Within the extended oven metaphor, this likely refers figuratively to the one tending or stirring up their heated plot.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 자기들의 마음으로 포위된 곳에 있는 오븐처럼 가까이 다가갑니다. 온밤 그들의 제빵사는 잠들어 있다가 아침이 되면 그것이 타오르며 불꽃 같은 불이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매복하는 가운데’ 또는 ‘매복하며’. 히브리어 구문은 공격을 위한 숨어 기다림과 음모의 뉘앙스를 지닙니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 제빵사’입니다. 오븐 비유의 연장선에서, 열기를 일으키거나 부추기는 자를 비유적으로 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּֽי קֵרְבוּ
  english_pob_choice: For they draw near
  chosen_korean: 그들은 ... 가까이 다가갑니다
  alternatives_korean:
  - 가까이 옵니다
  - 다가옵니다
  lexicon: HALOT
  rationale: קרב의 이동 이미지를 살려 ‘가까이 다가갑니다’로 옮기되, 예언서 문맥의 긴박감을 유지했습니다.
- source_word: כַתַּנּוּר
  english_pob_choice: like an oven
  chosen_korean: 오븐처럼
  alternatives_korean:
  - 화덕처럼
  - 가마처럼
  lexicon: HALOT
  rationale: 비유의 핵심인 ‘oven’ 이미지를 직접 살려, 불길한 내적 열기를 현대 한국어로 전달했습니다.
- source_word: בְּאָרְבָּם
  english_pob_choice: in their lying in wait
  chosen_korean: 포위된 곳에 있는
  alternatives_korean:
  - 매복하는 동안의
  - 매복 속에 있는
  lexicon: HALOT
  rationale: 원문의 ארב는 매복/잠복의 뜻이지만, 한국어로는 자연스러운 문장 흐름을 위해 ‘포위된 곳’으로 풀어 비유적 긴장을 살렸습니다.
- source_word: אֹפֵהֶם
  english_pob_choice: their baker
  chosen_korean: 그들의 제빵사
  alternatives_korean:
  - 그들의 빵 굽는 사람
  - 그들을 위해 굽는 사람
  lexicon: HALOT
  rationale: 직역 형태를 유지해 오븐 비유의 연결고리를 보존했습니다. POB가 제시한 문화적/비유적 긴장도 함께 남깁니다.
- source_word: בֹעֵר כְּאֵשׁ לֶהָבָה
  english_pob_choice: it burns like a flaming fire
  chosen_korean: 타오르며 불꽃 같은 불이 됩니다
  alternatives_korean:
  - 불길처럼 타오릅니다
  - 화염처럼 불붙습니다
  lexicon: HALOT
  rationale: בער와 ‘불꽃 같은 불’의 이중 강화를 살려, 단순한 ‘불타다’보다 점층적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 매복/잠복 표현의 처리
  chosen_reading: ‘포위된 곳에 있는’으로 완화된 공간 이미지를 사용해, 매복과 공격 준비의 의미를 직접적인 한국어로만 고정하지 않았습니다.
  alternative_readings:
  - ‘매복하는 가운데’
  - ‘잠복하며’
  rationale: 히브리어 구문이 압축적이고 은유적이므로, 해석을 과도하게 단정하지 않고 적절한 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve tension rather than resolve it
