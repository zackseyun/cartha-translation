revisions:
- from: 그들은 자기들의 마음으로 포위된 곳에 있는 오븐처럼 가까이 다가갑니다. 온밤 그들의 제빵사는 잠들어 있다가 아침이 되면 그것이 타오르며 불꽃 같은 불이 됩니다.[a][b]
  to: 그들은 매복하면서 화덕 같은 마음으로 가까이 다가옵니다[a]. 밤새 그들의 제빵사는 잠들어 있고[b], 아침에는 불꽃이 이는 불처럼 타오릅니다.
  rationale: 매복을 포위로 바꾼 오역을 바로잡고, 화덕 비유와 불길의 동적 이미지를 자연스러운 한국어로 회복했습니다. 마지막 절은 원문의 압축된 단수 지시와 비유적 연결을 특정 해석으로 고정하지 않도록 무주어로 옮겼습니다. 각주 표지는 해당 본문 표현 뒤에 배치했습니다.
