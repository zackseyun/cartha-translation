  text: כִּֽי קֵרְב֧וּ כַ/תַּנּ֛וּר לִבָּ֖/ם בְּ/אָרְבָּ֑/ם כָּל הַ/לַּ֨יְלָה֙ יָשֵׁ֣ן אֹֽפֵ/הֶ֔ם בֹּ֕קֶר ה֥וּא בֹעֵ֖ר כְּ/אֵ֥שׁ לֶהָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
  footnotes:
  - marker: a
    text: Or 'in their ambush' or 'while they lie in wait.' The Hebrew phrase carries the sense of plotting or lurking for an attack.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their baker.' Within the extended oven metaphor, this likely refers figuratively to the one tending or stirring up their heated plot.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 매복하면서 화덕 같은 마음으로 가까이 다가옵니다[a]. 밤새 그들의 제빵사는 잠들어 있고[b], 아침에는 불꽃이 이는 불처럼 타오릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 매복 중에’ 또는 ‘그들이 매복할 때’. 히브리어 표현은 공격을 위해 숨어 기다리거나 음모를 꾸미는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 제빵사’입니다. 화덕 비유의 연장선에서, 이 말은 열기를 돌보거나 부추기는 자를 비유적으로 가리킬 수 있습니다.
    reason: cultural_note
