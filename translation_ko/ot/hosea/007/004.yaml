source:
  edition: WLC
  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
  footnotes:
  - marker: a
    text: Or 'burning' instead of 'heated.' The Hebrew participle can emphasize the oven's active heat.
    reason: lexical_alternative
  - marker: b
    text: Or 'who stops stoking it' or 'who ceases stirring it.' The Hebrew verb is difficult in this context and may refer to the baker's pausing his tending of the oven.
    reason: lexical_alternative
  - marker: c
    text: Or 'until it rises.' The Hebrew likely refers to the dough's fermenting or leavening process.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두는 간음하는 자들입니다[a]. 그것은 제빵사가 반죽을 치대는 일에서 손을 떼어, 부풀 때까지 뜨거운 화덕을 달구어 두는 모습과 같습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불타는’. 히브리어 분사는 화덕의 능동적 열기를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 달구는 일을 멈추는’ 혹은 ‘그것을 젓는 일을 멈추는’. 이 동사는 이 문맥에서 뜻이 어렵고, 제빵사가 화덕을 돌보는 일을 잠시 멈추는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부풀 때까지’. 히브리어는 반죽의 발효 또는 부풀어 오름 과정을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  english_pob_choice: All of them
  chosen_korean: 그들 모두는
  alternatives_korean:
  - 모두가
  - 그들은 모두
  lexicon: HALOT
  rationale: 전체를 포괄하는 분포적 강조를 살려 ‘그들 모두는’으로 옮겼습니다.
- source_word: מְנָאֲפִים
  english_pob_choice: adulterers
  chosen_korean: 간음하는 자들
  alternatives_korean:
  - 음행하는 자들
  - 간음자들
  lexicon: HALOT
  rationale: 히브리어 분사형의 명사적 복수 의미를 살려, 도덕적 비난을 유지하면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: תַנּוּר בֹּעֵרָה
  english_pob_choice: an oven heated
  chosen_korean: 뜨거운 화덕
  alternatives_korean:
  - 달궈진 화덕
  - 불타는 화덕
  lexicon: HALOT
  rationale: 가정용 제빵 이미지에 맞춰 ‘화덕’으로 옮기고, פעול형이 나타내는 높은 열기를 ‘뜨거운’으로 반영했습니다.
- source_word: מֵאֹפֶה יִשְׁבּוֹת מֵעִיר
  english_pob_choice: who stops stirring from
  chosen_korean: 제빵사가 반죽을 치대는 일에서 손을 떼어
  alternatives_korean:
  - 제빵사가 저어 주는 일을 멈추어
  - 제빵사가 달구는 일을 멈추어
  lexicon: HALOT
  rationale: 난해한 동사구는 영어 POB의 해석을 참고하되, 제빵 맥락에서 한국어로 가장 자연스럽고 오해가 적은 ‘손을 떼다’로 처리했습니다.
- source_word: מִלּוּשׁ בָּצֵק עַד חֻמְצָתוֹ
  english_pob_choice: from the kneading of the dough until its leavening
  chosen_korean: 반죽을 치대는 일에서 … 부풀 때까지
  alternatives_korean:
  - 반죽을 치는 때부터 … 발효될 때까지
  - 반죽을 치댄 뒤 … 부풀기까지
  lexicon: HALOT
  rationale: 시간의 시작과 끝을 모두 살리되, ‘부풀다’로 לחם의 발효/팽창 과정을 현대 한국어에서 자연스럽게 전달했습니다.
theological_decisions:
- issue: 호세아의 ‘간음’ 이미지가 언약적 배신까지 포함하는지
  chosen_reading: 본문의 직접적 어휘는 ‘간음하는 자들’로 두고, 언약적 함의는 본문 문맥이 드러내도록 두었습니다.
  alternative_readings:
  - ‘언약을 배신하는 자들’
  - ‘음란한 백성’
  rationale: 원어의 구체적 도덕 용어를 확장 번역으로 대체하면, 호세아서가 의도한 긴장과 은유의 힘이 약해지므로 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
