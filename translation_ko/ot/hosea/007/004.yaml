  source_fidelity: 초안은 후반부의 행위와 시간 관계를 바꾸었습니다. 히브리어는 제빵사가 반죽을 치대는 때부터 그것이 발효될 때까지 화덕의 불을 일으키거나 돌보는 일을 그친다는 난해한 비유를 말합니다. ‘반죽을 치대는 일에서 손을 떼어 … 화덕을 달구어 두는’은 반죽하는 일을 멈추는 주체·행위를 본문과 다르게 만들고, ‘달구어 두는’은 히브리어의 ‘그치다’를 반대로 옮깁니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서도, 제빵 비유의 순서와 주체를 명확히 합니다. ‘불을 지피는 일’은 문맥상 자연스러운 본문 번역이며, 난해한 히브리어 동사의 다른 가능성은 주석에서 보존합니다.
  terminology: ‘간음하는 자들’은 מְנָאֲפִים의 직접적인 표현을 유지하며 언약적 은유를 본문에 덧붙이지 않습니다. תַנּוּר는 제빵 맥락에 맞게 ‘화덕’으로, חֻמְצָתוֹ는 ‘발효’로 옮겼습니다. 각 주석 표지는 해당 어휘·구절 바로 뒤로 재배치했습니다.
