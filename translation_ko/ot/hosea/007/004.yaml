theological_decisions:
- issue: 호세아의 ‘간음’ 이미지가 언약적 배신까지 포함하는지
  chosen_reading: 본문의 직접적 어휘는 ‘간음하는 자들’로 두고, 언약적 함의는 본문 문맥이 드러내도록 두었습니다.
  alternative_readings:
  - ‘언약을 배신하는 자들’
  - ‘음란한 백성’
  rationale: 원어의 구체적 도덕 용어를 확장 번역으로 대체하면, 호세아서가 의도한 긴장과 은유의 힘이 약해지므로 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
