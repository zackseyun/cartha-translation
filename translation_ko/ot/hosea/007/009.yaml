id: HOS.7.9
reference: Hosea 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
  footnotes:
  - marker: a
    text: Or 'Foreigners have consumed his strength.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'gray hair has been sprinkled on him,' an image of decline and aging.
    reason: cultural_note
translation:
  language: ko
  text: 이방인들이 그의 힘을 삼켜 버렸으나[a] 그는 알지 못합니다. 심지어 그에게 흰머리가 흩뿌려졌는데도[b] 그는 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들이 그의 힘을 소모시켰으나’라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘흰머리가 그에게 흩뿌려졌다’입니다. 노쇠와 쇠퇴가 드러나는 시적 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  english_pob_choice: have devoured
  chosen_korean: 삼켜 버렸으나
  alternatives_korean:
  - 먹었습니다
  - 먹어 버렸으나
  - 삼켰습니다
  lexicon: HALOT
  rationale: אכל의 비유적 용법을 살려 단순한 ‘먹다’보다 파괴적 소비의 뉘앙스를 드러내기 위해 ‘삼켜 버리다’를 택했습니다.
- source_word: זָרִים
  english_pob_choice: Strangers
  chosen_korean: 이방인들
  alternatives_korean:
  - 낯선 자들
  - 외국인들
  - 타자들
  lexicon: HALOT
  rationale: 시문맥에서 إسرائيل/이스라엘을 잠식하는 외부 세력을 가리키므로, 단순한 낯선 사람보다 성경적·예언적 대비가 선명한 ‘이방인들’이 적절합니다.
- source_word: כֹּחוֹ
  english_pob_choice: his strength
  chosen_korean: 그의 힘
  alternatives_korean:
  - 그의 능력
  - 그의 권세
  - 그의 세력
  lexicon: HALOT
  rationale: כֹּחַ의 기본 의미를 직역하되, 국가적 소모와 쇠퇴의 이미지를 자연스럽게 전달하기 위해 ‘힘’을 사용했습니다.
- source_word: שֵׂיבָה
  english_pob_choice: gray hair
  chosen_korean: 흰머리
  alternatives_korean:
  - 백발
  - 새치
  - 노쇠
  lexicon: HALOT
  rationale: 노쇠의 징후로서 구체적 이미지를 살리기 위해 추상적인 ‘노년’보다 ‘흰머리’를 택했습니다.
- source_word: זָרְקָה בּוֹ
  english_pob_choice: is sprinkled on him
  chosen_korean: 그에게는 뿌려져 있는데
  alternatives_korean:
  - 그 위에 흩어져 있는데
  - 그에게 군데군데 나 있는데
  - 그에게 퍼져 있는데
  lexicon: HALOT
  rationale: 동사의 기본적인 ‘뿌리다/흩뿌리다’의 이미지를 유지하여, 흰머리가 군데군데 나타나는 시적 표현을 살렸습니다.
theological_decisions:
- issue: 반복되는 ‘그는 알지 못합니다’의 기능
  chosen_reading: 인식하지 못하는 영적·사회적 둔감함을 강조하는 반복으로 보존했습니다.
  alternative_readings:
  - 단순한 정보 부족으로 약화해 표현하기
  - 두 번째 반복을 삭제해 문장을 간결화하기
  rationale: 히브리어의 반복은 쇠퇴를 알아차리지 못하는 완고함과 무감각을 강조하므로, 이를 그대로 살려 예언적 책망의 강도를 유지했습니다.
  doctrine_reference: 예언서의 책망 화법과 인간의 영적 무감각
