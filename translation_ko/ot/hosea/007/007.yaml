review_pass:
  verdict: revise
  source_fidelity: ‘나를 찾는 자’는 אֵין קֹרֵא ... אֵלַי(‘내게 부르짖는/나를 부르는 이가 없다’)를 충분히 반영하지 못합니다. 또한 주석은 שֹׁפְטֵיהֶם(‘그들의 재판관들’)에 걸려야 하나 현행 앵커는 마지막 절에 붙어 있습니다. ‘화덕’은 תַּנּוּר(oven)의 일상적 조리 화덕 이미지를 ‘가마’보다 더 직접적으로 전달합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서 병렬적 고발의 흐름을 자연스럽게 살립니다. ‘쓰러졌습니다’는 왕들의 정치적 몰락·죽음 어느 쪽도 단정하지 않는 ‘have fallen’에 적절합니다.
  terminology: ‘재판관들’을 본문에 유지하고, 통치 권위 전반을 가리킬 수 있다는 어휘적 가능성은 해당 단어에 붙인 주석으로 보존합니다. ‘부르짖는’은 하나님께 도움을 청해 부르는 문맥을 자연스럽게 나타내며, 특정 교리적 해석을 더하지 않습니다.
  issues:
  - severity: high
    issue: 마지막 절의 ‘나를 찾는 자’
    rationale: 히브리어 קֹרֵא ... אֵלַי는 ‘나에게 부르짖다/나를 부르다’이지 단순히 ‘찾다’가 아닙니다.
  - severity: medium
    issue: 각주 앵커 위치
    rationale: 각주는 ‘재판관들/통치자들’의 어휘 대안을 설명하지만 현행 앵커는 ‘없습니다’ 뒤에 있어 지시 대상이 불명확합니다.
  - severity: low
    issue: ‘가마’의 이미지
    rationale: תַּנּוּר는 여기서 ‘오븐, 화덕’에 가까우므로 ‘화덕’이 원문의 생활 이미지와 한국어의 자연스러운 대응 면에서 더 적절합니다.
  revised_text: 그들은 모두 화덕처럼 뜨겁고, 자기들의 재판관들[a]을 삼켜 버립니다. 그들의 왕들은 모두 쓰러졌습니다. 그들 가운데 나에게 부르짖는 자가 없습니다.
