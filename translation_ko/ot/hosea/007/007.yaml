  to: 그들은 모두 화덕처럼 뜨겁고, 자기들의 재판관들[a]을 삼켜 버립니다. 그들의 왕들은 모두 쓰러졌습니다. 그들 가운데 나에게 부르짖는 자가 없습니다.
