id: HOS.7.7
reference: Hosea 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
  footnotes:
  - marker: a
    text: Or 'their rulers.' The Hebrew word can refer more broadly to governing authorities, not only judicial officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두는 가마처럼 뜨겁고, 자기들의 재판관들을 삼켜 버립니다. 그들의 왕들은 모두 넘어졌습니다. 그들 가운데 나를 찾는 자가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자들’. 히브리어 단어는 재판관뿐 아니라 더 넓은 의미의 통치 권위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  english_pob_choice: All of them
  chosen_korean: 그들 모두는
  alternatives_korean:
  - 모두
  - 그들 전부는
  lexicon: HALOT
  rationale: 총칭적 판단을 드러내는 표현으로, 영어 POB의 포괄성을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יֵחַמּוּ כַּתַּנּוּר
  english_pob_choice: are hot like an oven
  chosen_korean: 가마처럼 뜨겁고
  alternatives_korean:
  - 화덕처럼 뜨겁고
  - 오븐처럼 뜨겁고
  - 가마처럼 달아오르고
  lexicon: HALOT
  rationale: 비유를 그대로 살리되 한국어 성경에서 자연스러운 이미지인 ‘가마’를 택해, 단순한 감정표현으로 축소하지 않았습니다.
- source_word: אֶת שֹׁפְטֵיהֶם
  english_pob_choice: their judges
  chosen_korean: 자기들의 재판관들을
  alternatives_korean:
  - 자기들의 심판자들을
  - 자기들의 통치자들을
  lexicon: HALOT
  rationale: 직역상 ‘재판관들’이 가장 직접적이지만, 예언서 문맥의 정치적 함의를 고려해 ‘자기들의’로 소유를 분명히 했습니다. 영어 POB의 주석상 넓은 의미도 가능하나 본문은 원어를 우선했습니다.
- source_word: נָפָלוּ
  english_pob_choice: have fallen
  chosen_korean: 넘어졌습니다
  alternatives_korean:
  - 무너졌습니다
  - 쓰러졌습니다
  - 몰락했습니다
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 한국어로 자연스럽게 드러내면서, 왕권의 붕괴를 지나치게 해석하지 않도록 ‘넘어졌습니다’를 선택했습니다.
theological_decisions:
- issue: ‘가마처럼 뜨겁다’는 이미지를 어떤 내적 상태로 구체화할지 여부
  chosen_reading: 원문이 말하는 은유를 유지하고, 정욕·분노·음모 중 하나로 좁히지 않았습니다.
  alternative_readings:
  - 정욕으로 달아올랐습니다
  - 분노로 뜨겁습니다
  - 음모로 달아올랐습니다
  rationale: 본문 자체는 열기의 은유를 제시할 뿐, 그 열이 정확히 어떤 정념인지는 명시하지 않습니다. 불필요한 해석을 덧붙이지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: translation philosophy §1, §3
- issue: שֹׁפְטֵיהֶם을 ‘재판관들’로 좁힐지 ‘통치자들’까지 포함할지 여부
  chosen_reading: 본문에는 ‘재판관들’을 두고, 더 넓은 정치적 함의는 주석 없이 과잉반영하지 않았습니다.
  alternative_readings:
  - 통치자들
  - 지도자들
  rationale: 영어 POB도 본문은 judges로 두고 주석으로 rulers 가능성을 남깁니다. 한국어 본문은 어휘상 직접 대응을 따르는 것이 가장 투명합니다.
  doctrine_reference: translation philosophy §3, §5
