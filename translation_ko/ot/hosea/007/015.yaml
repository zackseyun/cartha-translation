  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
  footnotes:
  - marker: a
    text: Or 'I disciplined' or 'I chastened'; the Hebrew verb can carry either corrective or formative force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 그들을 훈련하고 그들의 팔을 강하게 하였는데, 그들은 내게 악을 꾀합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '징계하고', '훈계하고'로도 옮길 수 있습니다. 히브리어 동사는 교정적 의미와 형성적 의미를 둘 다 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: 'וַאֲנִי / English POB: Though I'
  english_pob_choice: Though I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그런데 나는
  - 하지만 나는
  - 비록 내가
  lexicon: HALOT
  rationale: 문맥상 하나님의 선행과 이스라엘의 악한 응답 사이의 대조가 핵심이므로, 한국어에서는 자연스러운 대조 접속사로 역접을 살렸습니다. '비록 내가'도 가능하지만, 본절 전체의 진술형 리듬에는 '그러나 나는'이 더 간결합니다.
- source_word: יִסַּרְתִּי
  english_pob_choice: I trained
  chosen_korean: 훈련하고
  alternatives_korean:
  - 훈계하고
  - 징계하고
  - 가르치고
  lexicon: HALOT
  rationale: 핵심은 단순한 처벌이 아니라 팔을 강하게 하는 것과 평행을 이루는 형성적·준비적 행위이므로, '훈련하다'를 택했습니다. '훈계하다'나 '징계하다'는 문맥상 더 강한 교정/처벌 뉘앙스를 띱니다.
- source_word: חִזַּקְתִּי זְרוֹעֹתָם
  english_pob_choice: strengthened their arms
  chosen_korean: 그들의 팔을 강하게 하였는데
  alternatives_korean:
  - 그들의 팔을 굳세게 하였는데
  - 그들의 힘을 강하게 하였는데
  - 그들의 팔을 튼튼하게 하였는데
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지 '팔'을 살리고, חזק의 직접적 의미인 '강하게 하다'를 유지했습니다. '힘'으로 바꾸면 비유가 약해집니다.
- source_word: יְחַשְּׁבוּ רָע־ אֵלַי
  english_pob_choice: they devise evil against me
  chosen_korean: 그들은 내게 악을 꾀합니다
  alternatives_korean:
  - 그들은 내게 악을 계획합니다
  - 그들은 나를 해칠 음모를 꾸밉니다
  - 그들은 내게 해악을 생각합니다
  lexicon: HALOT
  rationale: חשב + רע는 단순한 생각이 아니라 악한 의도와 계획을 뜻하므로 '꾀하다'가 적절합니다. '내게'는 원문의 방향성을 살리되 한국어 관용에 맞게 'against me'의 적대 의미를 전달합니다.
theological_decisions:
- issue: 하나님의 이스라엘에 대한 קודם 행위의 성격 (יִסַּרְתִּי)
  chosen_reading: 주된 본문은 징벌보다 형성·준비의 의미를 드러내도록 '훈련하고'로 번역했습니다.
  alternative_readings:
  - 징계하고
  - 훈계하고
  - 교정하고
  rationale: 바로 뒤의 '그들의 팔을 강하게 하였다'가 함께 읽히며, 하나님의 행위는 단순한 처벌이 아니라 능력을 부여하는 은혜로운 돌봄으로 제시됩니다. 문맥이 허용하는 어휘 범위는 주석적 각주나 대안 번역으로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
