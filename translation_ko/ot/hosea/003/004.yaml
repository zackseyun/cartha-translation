  terminology: ‘이스라엘 자손’, ‘통치자’, ‘제물’, ‘기둥’, ‘에봇’, ‘데라빔’은 원문의 의미 범위와 전문 용어성을 적절히 보존합니다. 각주 표지는 반드시 해당 용어 바로 뒤에 배치해야 합니다.
