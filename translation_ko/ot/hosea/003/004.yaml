id: HOS.3.4
reference: Hosea 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
  footnotes:
  - marker: a
    text: Or 'standing stone' or 'sacred pillar'; the Hebrew term refers to a cultic stone monument.
    reason: lexical_alternative
  - marker: b
    text: Or 'teraphim'; that is, household cult objects or idols.
    reason: lexical_alternative
  - marker: c
    text: '''Ephod'' is a Hebrew cultic term, often referring to a priestly garment or associated ritual object.'
    reason: cultural_note
translation:
  language: ko
  text: 많은 날 동안 이스라엘 자손은 왕도 통치자도 없이, 제물도 기둥도 없이, 에봇도 데라빔도 없이 지내게 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기둥’은 제의적 돌기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘데라빔’은 가정용 제의 물건 또는 우상을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘에봇’은 히브리어 제의 용어로, 흔히 제사장 복식이나 관련 의례 물건을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָמִים רַבִּים
  english_pob_choice: many days
  chosen_korean: 많은 날 동안
  alternatives_korean:
  - 오랜 기간
  - 오랫동안
  lexicon: HALOT
  rationale: 히브리어의 시간표현을 비교적 직접적으로 살리되, 한국어에서는 뒤의 구문과 자연스럽게 이어지도록 ‘동안’을 보탰습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 남성 중심을 일반화한 완곡어법보다 원문의 집합 표현을 가깝게 살렸습니다.
- source_word: שָׂר
  english_pob_choice: prince
  chosen_korean: 통치자
  alternatives_korean:
  - 군왕
  - 방백
  - 지도자
  lexicon: HALOT
  rationale: 영어 POB의 ‘prince’는 한국어에서 왕자보다 행정·통치적 지위를 드러내는 말이 더 적절하므로, 정치적 상위 권력자를 가리키는 ‘통치자’로 옮겼습니다.
- source_word: מַצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 석주
  - 우상 기둥
  - 성석
  lexicon: HALOT
  rationale: 본문의 기본 의미를 간결하게 반영하되, 문맥상 제의적 돌기둥임을 과도하게 해설하지 않는 직역적 표현을 택했습니다.
- source_word: תְרָפִים
  english_pob_choice: household idols
  chosen_korean: 데라빔
  alternatives_korean:
  - 가정 우상
  - 집안 우상
  lexicon: HALOT
  rationale: 영어 POB가 음역과 설명을 병기한 항목으로 처리했으므로, 한국어도 고유한 제의 용어로 인식시키기 위해 음역을 유지했습니다.
theological_decisions:
- issue: 제의 항목들의 성격이 모두 정당한 예배인지, 아니면 일부는 금지된 우상숭배인지
  chosen_reading: 본문의 긴장을 풀지 않고 그대로 유지했습니다. 즉, 정치적 지도력의 부재와 함께 제의 장치의 결핍이 진술되며, 그 항목들에는 제물처럼 정상적 제의와 기둥·데라빔처럼 문제적 제의가 함께 포함됩니다.
  alternative_readings:
  - 모든 항목을 금지된 우상숭배로만 이해함
  - 모든 항목을 정당한 예배 장치로만 이해함
  rationale: 히브리어 목록 자체가 서로 다른 종교적 평가가 가능한 용어들을 병치하므로, 해석을 통일해버리면 본문의 의도된 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
