  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: ko
  text: 내가 그에게 말하였습니다. “너는 여러 날 동안 나를 위해 머물러야 합니다. 너는 음행해서는 안 되며, 남자에게 속해서도 안 됩니다. 나도 또한 너를 향할 것입니다.”
  philosophy: formal
lexical_decisions:
- source_word: יָמִים רַבִּים תֵּשְׁבִי לִי
  english_pob_choice: You must remain for me many days
  chosen_korean: 여러 날 동안 나를 위해 머물러야 합니다
  alternatives_korean:
  - 오랜 날 동안 나를 위해 지내야 합니다
  - 많은 날 동안 나와 함께 있어야 합니다
  lexicon: יָמִים רַבִּים / ישב
  rationale: 시간 표현은 직역하되, 한국어에서 자연스러운 문장으로 옮기기 위해 ‘여러 날 동안’과 ‘머물러야 합니다’를 선택했습니다. ‘나를 위해’는 לִי의 관계적 소속감을 살립니다.
- source_word: לֹא תִזְנִי
  english_pob_choice: you must not prostitute yourself
  chosen_korean: 너는 음행해서는 안 되며
  alternatives_korean:
  - 너는 창녀 노릇을 해서는 안 되며
  - 너는 몸을 팔아서는 안 되며
  lexicon: זנה
  rationale: 동사의 도덕적·성적 일탈을 직접 드러내되, 현대 한국어에서 과도하게 상징화되지 않도록 ‘음행하다’로 옮겼습니다. POB의 직접적 표현을 유지합니다.
- source_word: וְלֹא תִהְיִי לְאִישׁ
  english_pob_choice: you must not belong to a man
  chosen_korean: 남자에게 속해서도 안 됩니다
  alternatives_korean:
  - 남자의 것이어서도 안 됩니다
  - 남편이 되어서는 안 됩니다
  lexicon: היה ל + איש
  rationale: POB의 ‘belong to a man’을 따라 소유·귀속 관계를 살렸고, 결혼 여부로만 축소하지 않기 위해 ‘속하다’를 택했습니다.
- source_word: וְגַם אֲנִי אֵלָיִךְ
  english_pob_choice: and I also will be toward you
  chosen_korean: 나도 또한 너를 향할 것입니다
  alternatives_korean:
  - 나도 또한 너에게 그러할 것입니다
  - 나도 또한 너와 함께하겠습니다
  lexicon: אל + אליך
  rationale: עָל/אֶל의 방향성을 살려 ‘향하다’로 옮겨, POB가 보존한 관계의 미완결성과 긴장을 유지했습니다. 단순한 ‘함께하다’보다 원문의 방향성을 더 드러냅니다.
theological_decisions:
- issue: 마지막 절구의 관계 표현
  chosen_reading: ‘나도 또한 너를 향할 것입니다’로 번역해, 언약적 관계 회복을 암시하되 완결된 화해로 지나치게 단정하지 않았습니다.
  alternative_readings:
  - ‘나도 또한 너에게 속하겠습니다’
  - ‘나도 또한 너에게 충실하겠습니다’
  rationale: 히브리어의 방향 표현을 보존하면서, 이후 문맥에서 드러날 회복의 긴장과 조건성을 열어 두기 위함입니다.
  doctrine_reference: 호세아서의 언약적 상징과 회복 서사
