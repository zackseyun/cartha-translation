id: HOS.3.2
reference: Hosea 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶכְּרֶ֣/הָ לִּ֔/י בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר כָּ֑סֶף וְ/חֹ֥מֶר שְׂעֹרִ֖ים וְ/לֵ֥תֶךְ שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
  footnotes:
  - marker: a
    text: A lethech was likely a dry measure equal to half a homer.
    reason: cultural_note
  - marker: b
    text: Or 'for fifteen pieces of silver.' The Hebrew literally says 'fifteen silver,' with the monetary unit understood from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 은 열다섯 세겔과 보리 한 호멜과 한 레테크로 그녀를 나 자신을 위해 샀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 호멜은 고대의 마른 곡물 단위입니다.
    reason: cultural_note
  - marker: b
    text: 레테크는 아마도 호멜의 절반에 해당하는 마른 곡물 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  english_pob_choice: I bought her
  chosen_korean: 샀습니다
  alternatives_korean:
  - 구입했습니다
  - 획득했습니다
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 대가를 지불하고 취득하는 뜻으로 이해되므로, 현대 한국어에서는 가장 자연스럽고 직접적인 ‘샀습니다’가 적절합니다.
- source_word: לִּי
  english_pob_choice: for myself
  chosen_korean: 나 자신을 위해
  alternatives_korean:
  - 나를 위해
  - 내게
  lexicon: HALOT
  rationale: 소유·이익의 뉘앙스를 살려, 단순한 여격보다 자기 관련성을 드러내는 표현으로 옮겼습니다.
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  english_pob_choice: for fifteen shekels of silver
  chosen_korean: 은 열다섯 세겔
  alternatives_korean:
  - 열다섯 은 세겔
  - 은 열다섯 조각
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘열다섯 은’이지만 화폐 문맥이므로 단위를 분명히 하면서도 원문의 의미를 반영해 ‘은 열다섯 세겔’로 옮겼습니다.
- source_word: חֹמֶר
  english_pob_choice: a homer
  chosen_korean: 보리 한 호멜
  alternatives_korean:
  - 한 호멜
  - 호멜 한 되
  lexicon: HALOT
  rationale: 호멜은 고대 건량 단위이므로 음역을 유지했고, 뒤의 곡물이 보리이므로 한국어에서는 자연스럽게 ‘보리 한 호멜’로 구성했습니다.
- source_word: לֵתֶךְ
  english_pob_choice: a lethech
  chosen_korean: 한 레테크
  alternatives_korean:
  - 레테크 반 호멜
  - 한 반 호멜
  lexicon: HALOT
  rationale: 정확한 환산보다 고유 단위 자체를 보존하는 것이 원문에 더 충실하므로 음역을 유지했습니다.
theological_decisions:
- issue: 포로/구속을 암시하는 구매 표현의 직역 정도
  chosen_reading: 매매 행위를 직접 드러내는 ‘샀습니다’로 옮겨, 본문의 충격적이고 상징적인 결을 약화시키지 않았습니다.
  alternative_readings:
  - 구해 주었습니다
  - 데려왔습니다
  - 받아들였습니다
  rationale: 호세아 3:2는 단순한 동거 재개가 아니라 대가 지불을 통한 취득을 말하므로, 완화된 표현은 본문의 사회적·상징적 무게를 흐릴 수 있습니다.
  doctrine_reference: 호세아서의 상징적 행위 예언
- issue: 고대 계량 단위 보존
  chosen_reading: 호멜과 레테크를 음역해 보존하고, 본문에서는 현대 환산을 붙이지 않았습니다.
  alternative_readings:
  - 현대 단위로 환산
  - 반 호멜로 의역
  rationale: 정확한 현대 환산은 본문이 제공하지 않는 정보를 추가할 수 있으므로, 원문 단위를 보존하는 편이 더 안전합니다.
  doctrine_reference: 본문 충실성과 주해적 절제
