source:
  edition: WLC
  text: אַחַ֗ר יָשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בִקְשׁוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וְ/אֵ֖ת דָּוִ֣ד מַלְכָּ֑/ם וּ/פָחֲד֧וּ אֶל יְהוָ֛ה וְ/אֶל טוּב֖/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
  footnotes:
  - marker: a
    text: Or 'and they will fear the LORD and his goodness.' The Hebrew verb can be rendered 'fear' or, in this construction, 'come trembling toward.'
    reason: lexical_alternative
  - marker: b
    text: '''David their king'' may refer either to David as the representative royal figure or to a future Davidic ruler; the Hebrew leaves the expression unexpanded.'
    reason: alternative_reading
  - marker: c
    text: '''In the latter days'' is a prophetic expression that can also be rendered ''in the last days'' or ''in days to come.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 이스라엘 자손은 돌아와서 야훼 자기들의 하나님과 그들의 왕 다윗을 찾고, 마지막 날들에 야훼와 그의 선하심을 향하여 떨며 나아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼와 그의 선하심을 두려워할 것입니다.’ 히브리어 동사는 ‘두려워하다’로도, 이 구문에서는 ‘떨며 향하여 나아가다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 왕 다윗’은 다윗 자신을 대표적 왕적 인물로 가리킬 수도 있고, 장차 올 다윗계 통치자를 가리킬 수도 있습니다. 히브리어는 이 표현을 더 풀지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘마지막 날들’은 예언적 표현으로, ‘마지막 때에’ 또는 ‘오는 날들에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 이후에
  - 그 뒤에
  lexicon: HALOT
  rationale: 앞선 절의 상태 뒤에 이어질 시간을 가리키므로, 자연스러운 연결 표현인 ‘그 후에’로 옮겼습니다.
- source_word: יָשֻׁבוּ
  english_pob_choice: will return
  chosen_korean: 돌아와서
  alternatives_korean:
  - 되돌아올 것입니다
  - 돌아올 것입니다
  lexicon: HALOT
  rationale: 물리적 귀환과 언약적 회복의 뉘앙스를 함께 살리기 위해, 예언적 연속성을 드러내는 연결형으로 표현했습니다.
- source_word: וּבִקְשׁוּ
  english_pob_choice: and seek
  chosen_korean: 찾고
  alternatives_korean:
  - 구하고
  - 간구하고
  lexicon: HALOT
  rationale: בקשׁ의 기본 의미인 ‘찾다/구하다’ 가운데, 대상이 분명한 추구를 자연스럽게 드러내는 ‘찾다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: יהוה는 신적 고유명으로서 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְאֵת דָּוִד מַלְכָּם
  english_pob_choice: and David their king
  chosen_korean: 그들의 왕 다윗을
  alternatives_korean:
  - 다윗 그들의 왕을
  - 그들의 왕인 다윗을
  lexicon: HALOT
  rationale: 직접목적 표지를 반영하면서도 한국어 어순을 자연스럽게 하기 위해 ‘그들의 왕 다윗을’로 옮겼습니다.
- source_word: וּפָחֲדוּ אֶל
  english_pob_choice: they will come in fear to / come trembling toward
  chosen_korean: 떨며 나아갈 것입니다
  alternatives_korean:
  - 두려움으로 나아갈 것입니다
  - 떨며 다가갈 것입니다
  lexicon: HALOT
  rationale: פחדו + אֶל의 결합은 단순한 감정의 두려움보다 ‘떨며 다가감’의 의미를 띠므로, 경외 섞인 접근을 드러내는 표현을 택했습니다.
- source_word: טוּבֹו
  english_pob_choice: his goodness
  chosen_korean: 그의 선하심
  alternatives_korean:
  - 그의 선함
  - 그의 복
  lexicon: HALOT
  rationale: טוּב는 단순한 추상 명사 ‘좋음’보다 하나님의 호의와 선함을 함께 포괄하므로, 한국어 성경 문맥에 맞는 ‘선하심’으로 옮겼습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말세에
  - 후일에
  lexicon: HALOT
  rationale: 예언적 종말 표현을 유지하되, ‘last days’의 직접성을 살리기 위해 ‘마지막 날들’로 옮겼습니다.
theological_decisions:
- issue: פחדו אֶל יְהוָה וְאֶל טוּבוֹ의 의미
  chosen_reading: ‘떨며 나아갈 것입니다’로 옮겨, 야훼와 그의 선하심을 향한 경외 섞인 접근을 드러냈습니다.
  alternative_readings:
  - 야훼와 그의 선하심을 두려워할 것입니다
  - 야훼와 그의 선하심을 향해 경외할 것입니다
  rationale: אֶל이 방향성을 가지므로, 단순 감정보다 ‘향하여 나아감’이 더 정확합니다. 동시에 פחד의 떨림을 유지해 하나님의 선하심 앞에서의 경외를 보존했습니다.
  doctrine_reference: 예언적 회복과 경외의 결합을 보존함
