  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
  footnotes:
  - marker: a
    text: Or 'a wife loved by another and committing adultery.' The Hebrew אִשָּׁה can mean 'woman' or 'wife,' and רֵעַ can mean 'companion,' 'associate,' or in context possibly 'husband.'
    reason: lexical_alternative
  - marker: b
    text: '''Raisin cakes'' likely refers to pressed cakes of raisins, possibly associated with celebratory or idolatrous practices.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 다시 내게 말씀하셨습니다[a]. “가서, 다른 이에게 사랑받고 간음하는 여자를 사랑하라. 이는 야훼께서 이스라엘 자손을 사랑하시는 것과 같으니, 그들이 다른 신들에게 돌아서고 건포도 과자를 사랑하기 때문입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 나에게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘건포도 과자’는 잔칫음식 또는 우상 숭배와 관련된 음식일 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 본문의 언약적 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 본문이 가진 고유한 신명 표지를 보존했습니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 또다시
  - 여전히
  lexicon: HALOT
  rationale: 명령이 새로 반복되는 흐름을 한국어에서 가장 자연스럽게 드러내는 말은 ‘다시’입니다.
- source_word: אִשָּׁה אֲהֻבַת רֵעַ וּמְנָאָפֶת
  english_pob_choice: a woman loved by another and committing adultery
  chosen_korean: 다른 이에게 사랑받고 간음하는 여자
  alternatives_korean:
  - 다른 사람에게 사랑받는 아내이며 간음하는 여자
  - 동료에게 사랑받고 간음하는 여자
  - 다른 남자에게 사랑받고 간음하는 여자
  lexicon: HALOT
  rationale: אִשָּׁה를 여기서는 무정관사 구조를 살려 ‘여자’로 두고, רֵעַ는 문맥상 ‘다른 이’로 번역해 원문의 모호성을 과도하게 해소하지 않았습니다. ‘간음하는’은 분사적 지속성을 살렸습니다.
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: just as Yahweh loves the children of Israel
  chosen_korean: 이는 야훼께서 이스라엘 자손을 사랑하시는 것과 같으니
  alternatives_korean:
  - 야훼께서 이스라엘 자손을 사랑하시는 것처럼
  - 야훼의 이스라엘 자손에 대한 사랑과 같이
  lexicon: HALOT
  rationale: 비교구문을 ‘것과 같으니’로 옮겨 원문의 대응 관계를 분명히 했고, ‘이스라엘 자손’은 언약적 집단 표현을 살리기 위해 유지했습니다.
- source_word: אֲשִׁישֵׁי עֲנָבִים
  english_pob_choice: raisin cakes
  chosen_korean: 건포도 과자
  alternatives_korean:
  - 건포도 떡
  - 포도과자
  - 건포도 케이크
  lexicon: HALOT
  rationale: 관용적으로 알려진 의미를 살리되 현대 한국어에서 자연스러운 음식명인 ‘건포도 과자’를 택했습니다.
theological_decisions:
- issue: 여자 표현의 구체화 여부
  chosen_reading: 본문의 불확정성을 따라 특정 인물명이나 ‘아내’로 단정하지 않고 ‘여자’로 옮겼습니다.
  alternative_readings:
  - ‘아내’로 번역해 혼인 관계를 분명히 함
  - 호세아의 기존 아내로 해석해 인물 정체를 보강함
  rationale: 히브리어 본문은 여기서 인물의 신분을 명시적으로 확정하지 않으므로, 번역도 그 긴장을 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: 텍스트가 허용하는 범위 안에서 해석 쟁점을 열어 둠
- issue: 이스라엘의 배역과 하나님의 사랑 사이의 대비
  chosen_reading: ‘사랑하시는 것과 같으니’로 옮겨, 하나님의 사랑과 이스라엘의 배반이 정면으로 대비되도록 했습니다.
  alternative_readings:
  - 단순 병렬 ‘그리고 그들이 다른 신들에게 돌아서며’
  - 완화된 비교 표현
  rationale: 원문의 비교·대조 구조를 한국어에서도 드러내야 본문의 수사적 충격이 유지됩니다.
  doctrine_reference: optimal equivalence; source rhetoric preservation
