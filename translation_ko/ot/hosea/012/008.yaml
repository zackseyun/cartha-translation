  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
  footnotes:
  - marker: a
    text: Hebrew 'Canaan.' The word can also be understood as 'Canaanite' or, by extension, 'merchant/trader'; the commercial sense fits the context of dishonest scales.
    reason: alternative_reading
translation:
  language: ko
  text: 상인은 손에 거짓 저울을 들고, 억압하기를 좋아합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가나안’입니다. 이는 ‘가나안 사람’으로도, 문맥상 ‘상인’으로도 이해될 수 있습니다. 속임의 저울이라는 문맥은 상업적 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַעַן
  english_pob_choice: A merchant
  chosen_korean: 가나안 사람
  alternatives_korean:
  - 상인
  - 장사꾼
  - 가나안
  lexicon: HALOT
  rationale: 히브리어는 문맥상 ‘상인’으로도 읽히지만, 본문이 의도적으로 지명/민족명 ‘가나안’을 울리게 할 수 있으므로 한국어 본문에는 그 긴장을 살리되, 주석으로 상업적 의미를 밝혔습니다.
- source_word: בְּיָד֛וֹ
  english_pob_choice: in his hand
  chosen_korean: 손에
  alternatives_korean:
  - 그의 손에
  - 손 안에
  lexicon: HALOT
  rationale: 사기 저울을 ‘손에’ 들고 있다는 구체적 이미지를 간결하게 살리는 표현입니다.
- source_word: מֹאזְנֵ֥י מִרְמָ֖ה
  english_pob_choice: deceptive scales
  chosen_korean: 속임수 저울
  alternatives_korean:
  - 거짓 저울
  - 속이는 저울
  - 사기 저울
  lexicon: HALOT
  rationale: 명사 מִרְמָה는 단순한 ‘거짓’보다 ‘속임수/기만’의 의미가 강하므로, 저울 자체가 기만에 물든다는 점을 드러내는 표현을 택했습니다.
- source_word: לַעֲשֹׁ֥ק
  english_pob_choice: to oppress
  chosen_korean: 억압하기를
  alternatives_korean:
  - 착취하기를
  - 속여 빼앗기를
  - 압제하기를
  lexicon: HALOT
  rationale: 상거래 맥락에서는 ‘착취하다/속여 빼앗다’가 가능하지만, 동사의 넓은 의미 범위와 예언자적 고발의 강도를 살려 ‘억압하다’를 유지했습니다.
theological_decisions:
- issue: 'כְּנַעַן의 본문 내 기능: 지명/민족명 울림을 살릴지, 상인 의미로 평탄화할지'
  chosen_reading: 본문에는 ‘가나안 사람’으로 두고, 상업적 뜻은 주석으로 처리했습니다.
  alternative_readings:
  - 상인
  - 장사꾼
  - 가나안
  rationale: 문맥상 상업적 의미가 강하지만, 예언자적 말장난/비유 가능성을 본문에서 완전히 제거하지 않기 위해 지명형을 보존했습니다. 이렇게 하면 ‘가나안=상인’의 의미와 ‘가나안/가나안 사람’의 경멸적 울림을 함께 추적할 수 있습니다.
  doctrine_reference: Translation philosophy §1 (원문 우선), §3 (문학적·신학적 긴장 보존)
