source:
  edition: WLC
  text: וַ/יִּבְרַ֥ח יַעֲקֹ֖ב שְׂדֵ֣ה אֲרָ֑ם וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ בְּ/אִשָּׁ֔ה וּ/בְ/אִשָּׁ֖ה שָׁמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/013.yaml
  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
  footnotes:
  - marker: a
    text: Or 'to the country of Aram.' The Hebrew literally says 'the field of Aram.'
    reason: lexical_alternative
  - marker: b
    text: Or 'guarded' or 'watched over.' The verb may refer to keeping or tending flocks.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 아람의 들판으로[a] 도망하였고, 이스라엘은 아내를 위하여 섬겼으며, 또 아내를 위하여 양을 지켰습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람의 나라로’입니다. 히브리어는 문자적으로 ‘아람의 들판’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지켰다’, ‘돌보았다’입니다. 이 동사는 문맥상 가축을 지키거나 돌보는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망하였고
  alternatives_korean:
  - 달아났고
  - 도망쳤고
  - 피했고
  lexicon: HALOT
  rationale: ברח는 도망치다/달아나다의 뜻이므로, ‘도망하였고’가 서술적 흐름을 살리면서도 과도한 해석을 피합니다.
- source_word: שְׂדֵה אֲרָם
  english_pob_choice: to the field of Aram
  chosen_korean: 아람의 들판으로
  alternatives_korean:
  - 아람의 나라로
  - 아람의 시골로
  - 아람 땅으로
  lexicon: HALOT
  rationale: שָׂדֶה의 문자적 이미지를 살려 ‘들판’으로 두되, 한국어 조사로 목적지를 자연스럽게 표시했습니다.
- source_word: וַיַּעֲבֹד
  english_pob_choice: served
  chosen_korean: 섬겼으며
  alternatives_korean:
  - 일했으며
  - 봉사했으며
  - 종사했으며
  lexicon: HALOT
  rationale: 이 동사는 단순 노동보다 ‘봉사/섬김’의 뉘앙스를 지니므로, 야곱-라반 서사에 맞게 ‘섬기다’로 옮겼습니다.
- source_word: שָׁמָר
  english_pob_choice: kept watch
  chosen_korean: 양을 지켰습니다
  alternatives_korean:
  - 지켰습니다
  - 감시하였습니다
  - 보호하였습니다
  lexicon: HALOT
  rationale: 문맥상 가축을 돌보고 지키는 뜻이므로, 영어 주석의 가능성을 반영해 ‘양을 지켰습니다’로 구체화했습니다.
theological_decisions:
- issue: 야곱/이스라엘의 이름 병행 유지
  chosen_reading: ‘야곱’과 ‘이스라엘’을 모두 구분해 유지했습니다.
  alternative_readings:
  - ‘야곱’으로만 통일
  - ‘이스라엘’로만 통일
  rationale: 히브리어는 인물과 민족의 정체성을 함께 환기하므로, 두 이름의 대비를 평준화하지 않고 살렸습니다.
  doctrine_reference: 본문의 수사적 병행과 언약-정체성 강조
