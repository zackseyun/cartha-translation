  text: 야훼, 만군의 하나님이시며 — 야훼는 그의 기념 이름입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זִכְרוֹ는 ‘그의 기억’이라기보다, 하나님이 기억되거나 불리는 이름이라는 뜻으로 이해할 수 있습니다.
