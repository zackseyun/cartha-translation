lexical_decisions:
- source_word: וַֽ/יהוָ֖ה
  english_pob_choice: And Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 그리고 야훼
  - 그러나 야훼
  - 주님
  lexicon: HALOT
  rationale: 문두 접속사는 한국어에서 자연스럽게 생략할 수 있으며, 본문 핵심은 יהוה의 고유명칭을 드러내는 데 있습니다. 이 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵ֣י הַ/צְּבָא֑וֹת
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 천군의 하나님
  - 군대들의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: אֱלֹהֵי הַצְּבָאוֹת의 관용적 신칭을 한국어 성경 문맥에 맞게 ‘만군의 하나님’으로 옮겼습니다. ‘hosts’의 광범위한 의미를 가장 자연스럽게 살립니다.
- source_word: יְהוָ֖ה זִכְרֽוֹ
  english_pob_choice: Yahweh is his memorial name
  chosen_korean: 야훼는 그의 기념 이름입니다
  alternatives_korean:
  - 야훼는 그의 기념입니다
  - 야훼는 그의 기억될 이름입니다
  - 야훼는 그의 이름입니다
  lexicon: HALOT
  rationale: זִכְרוֹ는 단순한 ‘기억’보다 하나님이 어떻게 불리고 기억되는지의 문맥적 의미를 담으므로, 영어 POB의 ‘memorial name’에 맞춰 ‘기념 이름’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기와 후반절의 동일어 반복
  chosen_reading: 앞의 יהוה와 뒤의 יהוה를 모두 ‘야훼’로 옮기고, 후반절은 ‘기념 이름’으로 의미를 밝혔습니다.
  alternative_readings:
  - 앞은 ‘야훼’, 뒤는 ‘주님’
  - 앞은 ‘야훼’, 뒤는 ‘그의 기념’
  rationale: 히브리어는 동일한 신명 יהוה를 두 번 반복합니다. 이를 같은 한국어 고유명으로 일관되게 옮겨 반복 효과를 보존하고, זִכְרוֹ의 관용적 의미는 별도로 풀어 주었습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
