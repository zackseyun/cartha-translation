  - 불법
  lexicon: HALOT
  rationale: 포괄적인 도덕적 악을 간단하고 직접적으로 드러내면서도, 우상숭배적 죄의 뉘앙스를 문맥상 열어 두기 위해 '악'으로 옮겼습니다.
- source_word: שָׁוְא
  english_pob_choice: nothing
  chosen_korean: 헛것
  alternatives_korean:
