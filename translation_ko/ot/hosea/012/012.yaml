id: HOS.12.12
reference: Hosea 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
  footnotes:
  - marker: a
    text: Or, 'Surely Gilead is wickedness'; the Hebrew particle can be read as emphatic rather than conditional.
    reason: alternative_reading
  - marker: b
    text: Or, 'they are surely worthlessness / falsehood'; the Hebrew expression is compressed and can emphasize emptiness, vanity, or falseness.
    reason: lexical_alternative
  - marker: c
    text: The image may compare their many altars to the piles of stones commonly seen along plowed field furrows.
    reason: cultural_note
translation:
  language: ko
  text: 만일 길르앗이 악이라면, 그들은 분명히 헛것이 되었습니다. 길갈에서는 그들이 수소들을 제사하고, 참으로 그들의 제단은 밭의 고랑 위의 돌무더기와 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '길르앗이 악하다'; 히브리어 입자는 조건이 아니라 강조로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그들은 분명히 헛됨 / 거짓됨이 되었다'; 히브리어 표현이 압축되어 있어 공허함, 허무함, 거짓됨의 의미를 모두 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 이미지는 그들의 많은 제단을 밭의 고랑들을 따라 흔히 보이는 돌무더기와 비교할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일에
  lexicon: HALOT
  rationale: 히브리어의 조건적 형태를 살리되, 예언적 수사에서의 긴장도 유지하기 위해 단정적으로 풀지 않고 조건문으로 옮겼습니다.
- source_word: אָוֶן
  english_pob_choice: iniquity
  chosen_korean: 악
  alternatives_korean:
  - 불의
  - 죄악
  - 불법
  lexicon: HALOT
  rationale: 포괄적인 도덕적 악을 간단하고 직접적으로 드러내면서도, 우상숭배적 죄의 뉘앙스를 문맥상 열어 두기 위해 '악'으로 옮겼습니다.
- source_word: שָׁוְא
  english_pob_choice: nothing
  chosen_korean: 헛것
  alternatives_korean:
  - 허무
  - 무가치함
  - 헛됨
  lexicon: HALOT
  rationale: 예언적 책망에서의 공허함과 무가치함을 현대 한국어로 자연스럽게 전달하기 위해 '헛것'을 선택했습니다.
- source_word: גַּם
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 추가 정보 이상의 강조를 나타내므로, 한국어에서 자연스럽고 강조가 살아 있는 '참으로'로 처리했습니다.
- source_word: כְּגַלִּים
  english_pob_choice: like stone heaps
  chosen_korean: 돌무더기와 같이
  alternatives_korean:
  - 돌더미와 같이
  - 돌무지처럼
  - 돌무더기처럼
  lexicon: HALOT
  rationale: 갈림(heaps)의 이미지를 한국어로 구체화하되, 밭고랑 위에 놓인 돌무더기라는 비유적 장면이 드러나도록 했습니다.
theological_decisions:
- issue: 오프닝 절의 אִם 처리
  chosen_reading: 조건문 형태인 '만일'을 유지해, 길르앗에 대한 선지자적 고발의 압축성과 긴장을 보존했습니다.
  alternative_readings:
  - '''길르앗이 악이니'''
  - '''길르앗이 참으로 악하다면'''
  rationale: אִם은 예언문맥에서 조건과 강조를 모두 가질 수 있으므로, 한 방향으로 해석을 고정하지 않고 원문의 수사적 여지를 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
