  - 헛됨
  lexicon: HALOT
  rationale: 예언적 책망에서의 공허함과 무가치함을 현대 한국어로 자연스럽게 전달하기 위해 '헛것'을 선택했습니다.
- source_word: גַּם
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 추가 정보 이상의 강조를 나타내므로, 한국어에서 자연스럽고 강조가 살아 있는 '참으로'로 처리했습니다.
- source_word: כְּגַלִּים
  english_pob_choice: like stone heaps
  chosen_korean: 돌무더기와 같이
  alternatives_korean:
  - 돌더미와 같이
  - 돌무지처럼
  - 돌무더기처럼
  lexicon: HALOT
  rationale: 갈림(heaps)의 이미지를 한국어로 구체화하되, 밭고랑 위에 놓인 돌무더기라는 비유적 장면이 드러나도록 했습니다.
theological_decisions:
- issue: 오프닝 절의 אִם 처리
  chosen_reading: 조건문 형태인 '만일'을 유지해, 길르앗에 대한 선지자적 고발의 압축성과 긴장을 보존했습니다.
  alternative_readings:
  - '''길르앗이 악이니'''
  - '''길르앗이 참으로 악하다면'''
  rationale: אִם은 예언문맥에서 조건과 강조를 모두 가질 수 있으므로, 한 방향으로 해석을 고정하지 않고 원문의 수사적 여지를 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
