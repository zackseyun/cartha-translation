id: HOS.12.11
reference: Hosea 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִבַּ֨רְתִּי֙ עַל הַ/נְּבִיאִ֔ים וְ/אָנֹכִ֖י חָז֣וֹן הִרְבֵּ֑יתִי וּ/בְ/יַ֥ד הַ/נְּבִיאִ֖ים אֲדַמֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
  footnotes:
  - marker: a
    text: Or 'I spoke to the prophets.' The Hebrew preposition can be understood in more than one way here, though the parallel lines favor mediated speech through the prophets.
    reason: alternative_reading
  - marker: b
    text: Or 'by the hand of the prophets,' a Hebrew idiom for agency.
    reason: lexical_alternative
  - marker: c
    text: Or 'I used similitudes' / 'I spoke in comparisons.' The Hebrew verb is difficult and may refer to figurative or parabolic speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 예언자들을 통해 말하였고[a] — 내가 환상들을 크게 늘렸으며[b][c], 예언자들의 손을 통해 비유들을 제시하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자들에게 말하였다.’ 이 전치사는 여기서 ‘~에게’로도 읽힐 수 있지만, 평행구는 매개적 발화를 더 강하게 시사합니다.
    reason: alternative_reading
  - marker: b
    text: ‘내가’는 히브리어 독립대명사의 강조를 반영합니다.
    reason: source_note
  - marker: c
    text: 또는 ‘환상들을 많게 하였다’ / ‘환상들을 증대시켰다.’ כאן의 동사는 계시의 빈도와 양을 늘린다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  english_pob_choice: I spoke through the prophets
  chosen_korean: 예언자들을 통해 말하였고
  alternatives_korean:
  - 예언자들에게 말하였고
  - 예언자들에 관해 말하였고
  lexicon: HALOT
  rationale: עַל이 여기서는 단순한 ‘~에 대하여’보다 매개적 발화를 가리키는 문맥이므로, POB의 해석을 따라 ‘통해’로 옮겨 예언자 매개 계시의 의미를 살렸습니다.
- source_word: וְאָנֹכִי
  english_pob_choice: I myself
  chosen_korean: 내가
  alternatives_korean:
  - 나 자신이
  - 그리고 내가
  lexicon: HALOT
  rationale: 히브리어 독립대명사의 강조는 앞 절의 동사 형태만으로도 어느 정도 드러나므로, 한국어에서는 과도한 중복을 피하면서도 주어를 분명히 했습니다.
- source_word: חָזוֹן הִרְבֵּיתִי
  english_pob_choice: multiplied visions
  chosen_korean: 환상들을 크게 늘렸으며
  alternatives_korean:
  - 환상들을 많이 주었으며
  - 환상들을 번성하게 하였으며
  lexicon: HALOT
  rationale: רבה의 사역적 의미를 반영하되, ‘환상’을 구체적 계시 형식으로 유지하고 ‘크게 늘리다’로 수량·빈도의 증대를 자연스럽게 표현했습니다.
- source_word: וּבְיַד הַנְּבִיאִים אֲדַמֶּה
  english_pob_choice: through the hand of the prophets I gave parables
  chosen_korean: 예언자들의 손을 통해 비유들을 제시하였습니다
  alternatives_korean:
  - 예언자들의 손으로 비유들을 주었습니다
  - 예언자들의 손을 통해 유사한 말들을 하였습니다
  lexicon: HALOT
  rationale: בְיַד의 관용적 수단성을 살려 ‘손을 통해’라고 옮겼고, אֲדַמֶּה는 난해한 어근을 무리하게 해석하지 않고 POB의 ‘parables’에 맞춰 ‘비유들’로 처리했습니다.
theological_decisions:
- issue: 예언적 계시의 매개 방식
  chosen_reading: 하나님이 예언자들을 매개로 말씀하시고, 환상과 비유라는 여러 방식으로 계시하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 예언자들에게 단순히 말씀하셨다는 뜻
  - 비유는 후대 해석자의 설명일 뿐이라는 뜻
  rationale: 평행 구조가 직접 خطاب보다 매개적 계시를 강하게 시사하므로, 원문의 계시론적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
