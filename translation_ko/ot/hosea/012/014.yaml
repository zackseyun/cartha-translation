id: HOS.12.14
reference: Hosea 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/נָבִ֕יא הֶעֱלָ֧ה יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וּ/בְ/נָבִ֖יא נִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
  footnotes:
  - marker: a
    text: That is, likely Moses in the exodus context.
    reason: cross_reference
  - marker: b
    text: Or 'he was guarded' or 'he was preserved.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자를 통해 야훼께서 이스라엘을 이집트에서 올려 오셨고, 예언자를 통해 그가 지켜졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 출애굽 맥락의 모세를 가리키는 것으로 보입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그가 지켜졌습니다’, ‘그가 보존되었습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָבִיא / בְּנָבִיא
  english_pob_choice: by a prophet
  chosen_korean: 예언자를 통해
  alternatives_korean:
  - 예언자로
  - 예언자로 말미암아
  - 예언자에 의해
  lexicon: HALOT
  rationale: 히브리어 בְּ는 여기서 수단·매개를 나타내므로, 한국어에서는 ‘~을/를 통해’가 가장 자연스럽게 매개성과 반복 평행을 함께 살립니다.
- source_word: הֶעֱלָה
  english_pob_choice: brought ... up
  chosen_korean: 올려 오셨고
  alternatives_korean:
  - 올라오게 하셨고
  - 이끌어 내셨고
  - 데리고 올라오셨고
  lexicon: HALOT
  rationale: עלה의 히필은 ‘올려오다/올라오게 하다’의 출애굽적 표현을 살리므로, 단순한 ‘끌어내다’보다 상향 이동 이미지를 보존하는 표현을 택했습니다.
- source_word: נִשְׁמָר
  english_pob_choice: he was guarded / he was kept / he was preserved
  chosen_korean: 지켜졌습니다
  alternatives_korean:
  - 보호받았습니다
  - 보존되었습니다
  - 지켜졌습니다
  lexicon: HALOT
  rationale: נשׁמר의 수동 의미를 한국어에서 가장 간결하게 드러내면서, 계속적인 보호·보존의 뉘앙스를 함께 담을 수 있는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사는 ‘야훼’로 옮겨, 제목어 ‘주’로 환원하지 않고 이름 자체를 드러냈습니다.
theological_decisions:
- issue: 본문의 ‘예언자’가 누구인지 명시하지 않음
  chosen_reading: 주본문에서는 ‘예언자’를 그대로 두어, 출애굽 맥락에서 모세를 독자가 추론하도록 남겼습니다.
  alternative_readings:
  - ‘그 예언자’로 옮겨 모세를 암시적으로 특정하기
  - ‘모세’로 풀어 번역하기
  rationale: 히브리어에는 정관사가 없고, 이 절은 하나님의 구원과 보존이 예언자적 매개를 통해 이루어졌다는 수사에 초점이 있으므로, 인물을 명시적으로 해석해 버리지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 식별은 주석/각주로 처리
