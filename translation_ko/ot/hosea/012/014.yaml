revisions:
- from: 예언자를 통해 야훼께서 이스라엘을 이집트에서 올려 오셨고, 예언자를 통해 그가 지켜졌습니다.[a][b]
  to: 예언자를 통하여[a] 야훼께서 이스라엘을 이집트에서 이끌어 올리셨고, 예언자를 통하여 이스라엘은 지켜졌습니다.[b]
  rationale: 암시된 둘째 행의 주어를 ‘이스라엘’로 밝혀 한국어 대명사 모호성을 제거했습니다. הֶעֱלָה의 ‘올리다’ 의미는 ‘이끌어 올리셨고’로 보존했으며, 반복 구조와 예언자의 부정성을 유지했습니다. 각주 내용과 앵커도 각각 인물 식별 및 נִשְׁמָר의 어휘 대안에 맞게 정리했습니다.
  reviewer_model: gpt-5.6-terra
