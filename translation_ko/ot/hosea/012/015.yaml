base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
  footnotes:
  - marker: a
    text: Or 'his blood' or 'his bloodshed will remain on him.' The Hebrew 'bloods' often carries the sense of bloodguilt in judicial contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'his master will return his reproach to him.'
    reason: alternative_reading
translation:
  language: ko
  text: 에브라임이 쓰라린 분노를 불러일으켰습니다. 그의 피값이 그에게 남을 것이며, 그의 주님이 그의 수치를 그에게 갚으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피값’은 문자적으로는 ‘피’이지만, 재판·책임 문맥에서 ‘혈죄/피흘림의 죄책’의 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 주님’은 문자형을 그대로 옮긴 ‘그의 주인’으로도 볼 수 있으나, 문맥상 하나님을 가리키는 호칭입니다.
    reason: theological_note
lexical_decisions:
- source_word: הִכְעִ֥יס
  english_pob_choice: has provoked
  chosen_korean: 불러일으켰습니다
  alternatives_korean:
  - 격노하게 했습니다
  - 분노하게 했습니다
  - 노하게 했습니다
  lexicon: HALOT
  rationale: 히필형 כעס의 ‘자극하여 분노하게 하다’는 힘을 현대 한국어에서 가장 자연스럽게 살리기 위해 ‘불러일으키다’를 택했습니다.
- source_word: תַּמְרוּרִ֑ים
  english_pob_choice: bitter anger
  chosen_korean: 쓰라린 분노
  alternatives_korean:
  - 쓴 분노
  - 극심한 분노
  - 비통한 분노
  lexicon: HALOT
  rationale: 복수형 명사가 강도와 쓰라림을 나타내므로, 단순한 감정보다 강한 정서를 드러내는 ‘쓰라린 분노’가 문맥상 적절합니다.
- source_word: וְדָמָיו
  english_pob_choice: his bloodguilt
  chosen_korean: 피값
  alternatives_korean:
  - 피의 죄
  - 피흘림의 죄책
  - 피흘린 죄
  lexicon: HALOT
  rationale: 직역한 ‘피들’은 한국어에서 의미가 불분명하므로, 법정·보응 문맥의 책임을 드러내는 ‘피값’으로 옮겼습니다.
- source_word: וְחֶרְפָּתוֹ
  english_pob_choice: his disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 모욕
  - 불명예
  lexicon: HALOT
  rationale: חרפה의 공적 수치와 모욕의 뉘앙스를 현대 한국어로 간결하게 담기 위해 ‘수치’를 선택했습니다.
theological_decisions:
- issue: אֲדֹנָיו의 지시 대상과 호칭
  chosen_reading: 하나님을 가리키는 호칭으로 이해하여 ‘그의 주님’으로 옮겼습니다.
  alternative_readings:
  - 그의 주인
  - 그의 주
  rationale: 예언 문맥에서 에브라임의 피값과 수치를 갚으시는 분은 하나님이므로, ‘주인’보다 인격적·심판적 호칭인 ‘주님’이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: translate titles; preserve referent by context'
