  verdict: revise
  source_fidelity: ‘피값’은 피에 대한 보상·대가를 뜻하는 한국어 표현이므로, 히브리어 דָּמָיו가 이 문맥에서 나타내는 피 흘림의 죄책/혈죄와는 맞지 않습니다. 이를 ‘피 흘림의 죄책’으로 바로잡아야 합니다. 나머지 절의 심판적 병렬과 ‘그의 주’라는 호칭은 대체로 잘 반영되어 있습니다.
  naturalness: ‘에브라임이 쓰라린 분노를 불러일으켰습니다’는 자연스럽고 합쇼체에도 적합합니다. ‘그의 피 흘림의 죄책’은 다소 무겁지만 예언서의 법정적 문맥에서 명료하고 자연스럽습니다.
  terminology: דָּמִים의 법정적 의미에는 ‘피 흘림의 죄책’을 사용합니다. אֲדֹנָיו는 본문에 신명(神名)이 없으므로 ‘그의 주님’으로 옮기되, 각주에서는 가능한 대안인 ‘그의 주인’과 마지막 절의 직역적 표현을 함께 제시합니다.
