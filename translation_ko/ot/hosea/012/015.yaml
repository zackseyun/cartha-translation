  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
  footnotes:
  - marker: a
    text: Or 'his blood' or 'his bloodshed will remain on him.' The Hebrew 'bloods' often carries the sense of bloodguilt in judicial contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'his master will return his reproach to him.'
    reason: alternative_reading
translation:
  language: ko
  text: 에브라임이 쓰라린 분노를 불러일으켰습니다. 그의 피 흘림의 죄책이 그에게 남을 것이며,[a] 그의 주님이 그의 수치를 그에게 되갚으실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 피가 그에게 남을 것이다’ 또는 ‘그의 피 흘림이 그에게 남을 것이다.’ 히브리어 ‘피들’은 재판과 책임의 문맥에서 피 흘림의 죄책을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 주인께서 그의 수치를 그에게 돌려주실 것이다.’
    reason: alternative_reading
