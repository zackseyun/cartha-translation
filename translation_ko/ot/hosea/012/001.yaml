id: HOS.12.1
reference: Hosea 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
  footnotes:
  - marker: a
    text: Or, 'Judah is still unruly against God, against the Holy One who is faithful.' The Hebrew of this clause is difficult, especially the verb rendered 'walks' and whether 'holy ones' refers to God or to heavenly beings.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'with the holy ones'; this may also be understood as 'with the Holy One,' referring to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 거짓으로 나를 에워쌌고, 이스라엘의 집은 속임수로 나를 에워쌌습니다. 그러나 유다는 아직 하나님과 함께 다니고[a], 거룩하신 분과 함께 신실합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다는 아직 하나님을 거슬러 제멋대로 행동하며, 신실하신 거룩한 분을 거스른다”로 이해할 수 있습니다. 히브리어의 이 절은, 특히 ‘다니고’로 옮긴 동사의 뜻과 문장 구조가 난해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 “거룩한 이들”입니다. 이를 하나님을 가리키는 단수 표현으로 이해할 수도 있고, 거룩한 존재들로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  english_pob_choice: has surrounded me
  chosen_korean: 둘러쌌고
  alternatives_korean:
  - 에워쌌고
  - 둘러싸고
  lexicon: HALOT
  rationale: 히브리어 완료형의 포위 이미지를 자연스러운 현대 한국어로 살리면서, 하나님의 주변이 거짓으로 에워싸였다는 뜻을 분명히 합니다.
- source_word: בְּכַחַשׁ
  english_pob_choice: with lies
  chosen_korean: 거짓으로
  alternatives_korean:
  - 거짓말로
  - 허위로
  lexicon: HALOT
  rationale: כחש는 단순한 허위 진술보다 언약적 불성실을 포함하는 ‘거짓’을 뜻하므로, 문맥상 가장 넓고 직접적인 한국어를 택했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘의 집
  alternatives_korean:
  - 이스라엘 집안
  - 이스라엘 집
  lexicon: HALOT
  rationale: 예언서의 집합명사 구조를 보존하려고 직역에 가까운 형태를 유지했습니다.
- source_word: וּבְמִרְמָה
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 간계로
  lexicon: HALOT
  rationale: מִרְמָה는 속임, 기만, 사기를 포괄하므로, 앞의 ‘거짓’과 구별되면서도 자연스러운 ‘속임수’가 적절합니다.
- source_word: וִיהוּדָה עֹד רָד עִם אֵל וְעִם קְדוֹשִׁים נֶאֱמָן
  english_pob_choice: but Judah still roams with God and is faithful with the Holy One
  chosen_korean: 그러나 유다만은 아직 하나님과 함께 다니며, 거룩하신 분에게는 신실합니다
  alternatives_korean:
  - 그러나 유다는 아직 하나님과 함께 거닐며, 거룩하신 분에게 신실합니다
  - 그러나 유다는 아직 하나님과 함께 다니며, 거룩한 이들과 함께 신실합니다
  lexicon: HALOT
  rationale: רָד는 난해하지만, POB의 핵심 선택처럼 긍정적 대비를 살려 ‘다니다’ 계열로 옮겼습니다. קְדוֹשִׁים은 복수형이지만 여기서는 하나님을 가리키는 것으로 읽는 전통을 따라 ‘거룩하신 분’으로 처리했습니다.
theological_decisions:
- issue: 유다 절의 난해한 동사 רָד와 קְדוֹשִׁים의 해석
  chosen_reading: 본문은 에브라임/이스라엘의 거짓과 대조되는 유다의 지속적인 하나님 동행과 신실함을 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 유다가 아직 하나님을 거슬러 불안정하게 돌아다닌다는 부정적 읽기
  - ‘거룩한 이들/천상 존재들’과 함께라는 집단적 읽기
  rationale: 히브리어가 문법적으로 어려우나, 뒤의 ‘신실합니다’가 긍정적 진술을 강하게 지지하므로 본문에 드러난 대비를 보존하는 번역을 택했습니다. 동시에 가능한 대안은 주석으로 남겨 해석 긴장을 지웠습니다.
  doctrine_reference: '번역 원칙: 애매한 본문은 해석을 과도하게 확정하지 말고, 본문이 허용하는 긴장을 유지합니다.'
