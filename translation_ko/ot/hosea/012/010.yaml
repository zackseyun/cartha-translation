id: HOS.12.10
reference: Hosea 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
  footnotes:
  - marker: a
    text: Or 'the appointed time' or 'the festival.' The phrase may allude to the Feast of Booths, when Israel dwelt in temporary shelters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 애굽 땅에서부터 너의 하나님인 야훼다. 나는 다시 너를 장막들에 살게 할 것이다. 정해진 절기의 날들처럼.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 때’ 또는 ‘절기’로 번역할 수 있습니다. 이 표현은 이스라엘이 임시 거처에 살았던 초막절을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  english_pob_choice: Yet I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 그런데 나는
  lexicon: HALOT
  rationale: 접속사 וְ는 앞선 책망과 대비되는 전환으로 읽히므로, 한국어에서도 역접의 흐름을 살려 '그러나'로 옮겼습니다. אָנֹכִי의 강조는 주어를 분명히 드러내는 '나는'으로 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자적 신명 표기인 יְהוָה는 본 프로젝트 기본어인 '야훼'로 옮겨, 호칭으로 환원하지 않고 고유명을 보존했습니다.
- source_word: מֵ/אֶ֣רֶץ מִצְרַ֑יִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 애굽 땅에서부터
  alternatives_korean:
  - 이집트 땅에서부터
  - 애굽 땅으로부터
  lexicon: HALOT
  rationale: 출애굽을 환기하는 관용적 표현이므로 '애굽 땅에서부터'로 자연스럽게 옮기되, 원문의 출발점 의미를 유지했습니다.
- source_word: עֹ֛ד אוֹשִֽׁיבְ/ךָ֥
  english_pob_choice: I will again make you dwell
  chosen_korean: 나는 다시 너를 … 살게 할 것이니
  alternatives_korean:
  - 나는 다시 너를 거하게 할 것이니
  - 나는 다시 너를 살도록 하겠으니
  lexicon: HALOT
  rationale: עֹד는 반복의 의미를 살려 '다시'로, 히필형 אוֹשִׁיבְךָ는 사역적 의미를 반영해 '살게 할 것'으로 옮겼습니다.
- source_word: בָ/אֳהָלִ֖ים
  english_pob_choice: in tents
  chosen_korean: 장막들에
  alternatives_korean:
  - 천막들에
  - 텐트들에
  lexicon: HALOT
  rationale: 문자적으로는 '텐트'이나, 성경 문맥에서 절기 연상과 자연스러운 한국어 성경 문체를 고려해 '장막들'을 선택했습니다.
- source_word: כִּ/ימֵ֥י מוֹעֵֽד
  english_pob_choice: as in the days of the appointed feast
  chosen_korean: 정해진 절기의 날들처럼
  alternatives_korean:
  - 정한 때의 날들처럼
  - 명절의 날들처럼
  lexicon: HALOT
  rationale: מוֹעֵד는 '정해진 때/절기'의 뜻을 모두 가지므로, 본문 맥락의 절기성을 살려 '정해진 절기'로 옮겼습니다.
theological_decisions:
- issue: מוֹעֵד을 특정 절기로 좁힐지 여부
  chosen_reading: 본문은 특정 절기명을 본문에 넣지 않고, 절기 일반을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 초막절을 직접 가리키는 것으로 본문에 반영
  - 단순한 '정한 때'로만 처리
  rationale: 문맥상 초막절을 연상시킬 수 있으나, 히브리어 자체는 명시적으로 절기명을 말하지 않으므로 본문은 넓게 유지하고 해석 가능성은 주석적 수준에 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
