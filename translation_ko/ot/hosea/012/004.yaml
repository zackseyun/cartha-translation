id: HOS.12.4
reference: Hosea 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/בֶּ֖טֶן עָקַ֣ב אֶת אָחִ֑י/ו וּ/בְ/אוֹנ֖/וֹ שָׂרָ֥ה אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/004.yaml
  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
  footnotes:
  - marker: a
    text: Or, 'he took his brother by the heel.' The Hebrew verb evokes Jacob’s birth narrative and can carry the extended sense of supplanting.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he strove with a divine being'; the following verse identifies the figure as 'the angel,' so Hosea preserves the tension rather than flattening it.
    reason: alternative_reading
translation:
  language: ko
  text: 태에서 그는 자기 형의 발꿈치를 잡았고[a], 그의 힘으로 하나님[b]과 겨루었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기 형의 발꿈치를 붙잡았다.’ 히브리어 동사는 야곱의 출생 이야기를 떠올리게 하며, 더 넓게는 ‘제치다’라는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 신적 존재와 겨루었습니다.’ 바로 다음 절은 그 인물을 ‘천사’로 밝히므로, 호세아는 이 긴장을 해소하지 않고 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  english_pob_choice: In the womb
  chosen_korean: 태에서
  alternatives_korean:
  - 자궁에서
  - 배 속에서
  lexicon: HALOT
  rationale: 출생 이전을 가리키는 문맥이므로, 신체 내부를 뜻하는 일반적 표현보다 ‘태’가 더 간결하고 자연스럽게 원문 의미를 살립니다.
- source_word: עָקַב
  english_pob_choice: grasped ... heel
  chosen_korean: 발꿈치를 잡았고
  alternatives_korean:
  - 발꿈치를 움켜쥐었고
  - 형의 발꿈치를 붙잡았고
  - 형을 발꿈치로 제쳤고
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘발꿈치-잡음’의 구체적 이미지를 살리되, ‘supplanted’처럼 해석을 앞세우지 않기 위해 기본 동작을 직접적으로 옮겼습니다.
- source_word: וּבְאוֹנוֹ
  english_pob_choice: in his strength
  chosen_korean: 자기 힘으로는
  alternatives_korean:
  - 그의 힘으로
  - 그의 기력으로
  - 그의 장성함으로
  lexicon: HALOT
  rationale: אוֹן의 의미 범위(힘, 기력, 정력)를 고려하되, 문맥상 지나치게 특정한 생물학적 뉘앙스는 피하고 ‘힘’으로 넓고 분명하게 옮겼습니다.
- source_word: שָׂרָה אֶת אֱלֹהִים
  english_pob_choice: contended with God
  chosen_korean: 하나님과 다투었습니다
  alternatives_korean:
  - 하나님과 씨름했습니다
  - 하나님과 겨루었습니다
  - 신적 존재와 다투었습니다
  lexicon: HALOT
  rationale: שָׂרָה는 단순한 논쟁보다 대립적 ‘다툼/겨룸’을 뜻하므로, 서술의 긴장감을 유지하는 표현을 택했습니다. 한국어 ‘다투다’는 관계를 해석하지 않으면서도 대항의 의미를 담습니다.
theological_decisions:
- issue: אֱלֹהִים의 지시 대상과 12:5와의 긴장 유지
  chosen_reading: 본문에는 ‘하나님’으로 두고, 다음 절이 그 대상을 ‘천사’로 밝히는 긴장을 해소하지 않습니다.
  alternative_readings:
  - 신적 존재
  - 천사
  rationale: 히브리어 본문은 כאן אֱלֹהִים을 사용하므로, 본문 자체의 표현을 우선 살려야 합니다. 호세아 12:5의 설명과 함께 읽을 때 의도된 긴장이 생기므로, 이를 평평하게 만들지 않았습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장은 조화시키지 말고 보존한다.'
