  source_fidelity: 원문의 בַּבֶּטֶן, עָקַב, וּבְאוֹנוֹ, שָׂרָה אֶת־אֱלֹהִים의 의미를 전반적으로 충실히 옮겼습니다. 다만 ‘자기 힘으로는’의 보조사 ‘는’은 원문에 없는 대조를 암시하므로 제거하는 것이 적절하며, שָׂרָה에는 논쟁의 뉘앙스가 강한 ‘다투다’보다 경쟁·대결의 뜻을 유지하는 ‘겨루다’가 더 알맞습니다.
  naturalness: ‘태에서’와 ‘자기 형의 발꿈치’는 자연스럽고 문맥에 맞습니다. ‘그의 힘으로’가 ‘자기 힘으로는’보다 현대 한국어 문장 안에서 매끄럽습니다. 또한 각주 표지는 해당 어휘 가까이에 두어 참조 대상을 분명히 했습니다.
  terminology: ‘하나님’은 אֱלֹהִים의 본문상 표현을 자연스럽게 반영합니다. ‘겨루었습니다’는 야곱 전승의 대결을 보존하면서 ‘씨름하다’처럼 구체화하지 않습니다. 각주의 ‘신적 존재’ 및 ‘천사’는 본문과 다음 절 사이의 지시 대상 긴장을 적절히 보존합니다.
