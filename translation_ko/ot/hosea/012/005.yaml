    reason: alternative_reading
translation:
  language: ko
  text: 그는 천사와 겨루어 이기고[a], 울며 그에게 은혜를 구했습니다. 벧엘에서 그를 만났고[b], 거기서 우리와 말씀하셨습니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 겨루었다’ / ‘그에게 은혜를 간청했다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘우리와’입니다. 일부는 인칭을 매끄럽게 하기 위해 ‘그와’로 이해합니다. 본문은 마소라 본문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  english_pob_choice: strove
  chosen_korean: 겨루어
  alternatives_korean:
  - 다투어
  - 맞서 싸워
  - 씨름하여
  lexicon: HALOT
  rationale: 야곱 이야기의 문맥상 단순한 싸움보다 ‘겨루다’가 대결과 지속적 힘겨룸을 자연스럽게 드러내며, 본문의 상호적 긴장을 살립니다.
- source_word: מַלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: HALOT
  rationale: 이 문맥의 מַלְאָךְ는 초자연적 존재를 가리키므로 일반적 의미의 ‘사자’보다 ‘천사’가 독자에게 소스 의미를 더 분명하게 전달합니다.
- source_word: וַיִּתְחַנֶּן לוֹ
  english_pob_choice: sought his favor
  chosen_korean: 그에게 은혜를 구했습니다
  alternatives_korean:
  - 그에게 간청했습니다
  - 그의 호의를 구했습니다
  - 그에게 자비를 빌었습니다
  lexicon: HALOT
  rationale: חנן의 뉘앙스는 단순 요청보다 은혜/호의를 구하는 태도이므로, 한국어에서는 ‘은혜를 구하다’가 POB의 의미 선택을 가장 잘 반영합니다.
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  english_pob_choice: and there he spoke with us
  chosen_korean: 거기서 우리에게 말씀하셨습니다
  alternatives_korean:
  - 거기서 그와 말씀하셨습니다
  - 거기서 우리와 말씀하셨습니다
  lexicon: HALOT
  rationale: 마소라 본문의 ‘우리에게/우리와’는 본문이 의도적으로 보존한 인칭 전환이므로, 한국어도 이를 평준화하지 않고 그대로 살렸습니다.
theological_decisions:
- issue: 마소라 본문의 1인칭 복수 종결절
  chosen_reading: ‘우리에게’로 본문을 유지하여 야곱의 경험을 공동체적 기억으로 연결했습니다.
  alternative_readings:
