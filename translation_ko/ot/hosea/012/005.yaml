  rationale: 본문의 낯선 인칭 전환은 해소하기보다 보존하는 편이 소스 충실성과 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: preserve textual/theological tension rather than harmonize it.'
