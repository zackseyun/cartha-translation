id: HOS.12.2
reference: Hosea 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
  footnotes:
  - marker: a
    text: Or 'shepherds the wind'; the Hebrew verb is literally 'pastures/feeds/shepherds.'
    reason: lexical_alternative
  - marker: b
    text: The 'east wind' was associated with scorching, destructive force; the phrase can suggest both futility and harm.
    reason: cultural_note
  - marker: c
    text: Or 'falsehood and devastation' / 'deceit and destruction.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'cut a covenant,' a standard idiom for making a covenant or treaty.
    reason: lexical_alternative
  - marker: e
    text: Probably oil sent as tribute or diplomatic payment to Egypt.
    reason: cultural_note
translation:
  language: ko
  text: 에브라임은 바람을 먹고 동풍을 따라 하루 종일 쫓아다니며[a], 거짓과 파괴를 더합니다. 그들은 앗시리아와 언약을 맺고[d], 기름이 이집트로 실려 갑니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바람을 목양한다’; 히브리어 동사는 문자적으로 ‘풀을 뜯기다/먹이다/목양하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘언약을 자르다’는 언약이나 조약을 맺는 표준 관용구입니다.
    reason: lexical_alternative
  - marker: e
    text: 아마도 외교적 공물이나 지불로서의 기름을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֶפְרַיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
  - 에브라임
  - 이스라엘
  lexicon: HALOT
  rationale: 히브리어 고유명사를 보존해, 북왕국을 가리키는 메타포가 아닌 원문 표지를 살렸습니다.
- source_word: רֹעֶה רוּחַ
  english_pob_choice: feeds on wind
  chosen_korean: 바람을 먹고
  alternatives_korean:
  - 바람을 목양하고
  - 바람을 풀 뜯듯 먹고
  lexicon: HALOT
  rationale: רעה의 기본 의미인 ‘먹이다/먹다/목양하다’의 이미지를 한국어에서 자연스럽게 살리되, 허무한 것을 취한다는 비유를 유지했습니다.
- source_word: וְרֹדֵף קָדִים
  english_pob_choice: and pursues the east wind
  chosen_korean: 동풍을 따라 … 쫓아다니며
  alternatives_korean:
  - 동풍을 쫓으며
  - 동풍을 추격하며
  lexicon: HALOT
  rationale: קָדִים은 지역적 함의를 가진 ‘동풍’이므로 보존했고, רדף는 ‘쫓다/추격하다’로 옮겼습니다.
- source_word: כָּזָב וָשֹׁד
  english_pob_choice: lies and destruction
  chosen_korean: 거짓과 파괴
  alternatives_korean:
  - 거짓과 멸망
  - 속임수와 파괴
  lexicon: HALOT
  rationale: כָּזָב는 ‘거짓’, שֹׁד는 ‘파괴/약탈/황폐’의 뜻을 가지므로, 원문의 도덕적·사회적 비난을 간결하게 살렸습니다.
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  english_pob_choice: They make a covenant with Assyria
  chosen_korean: 그들은 앗시리아와 언약을 맺고
  alternatives_korean:
  - 그들은 앗시리아와 조약을 맺고
  - 그들은 앗시리아와 계약을 맺고
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 ‘언약을 맺다’로 옮겨, 정치적 조약이면서도 언약적 형식을 지닌 표현을 보존했습니다.
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  english_pob_choice: oil is carried to Egypt
  chosen_korean: 기름이 이집트로 실려 갑니다
  alternatives_korean:
  - 기름이 이집트로 보내집니다
  - 기름이 이집트로 운반됩니다
  lexicon: HALOT
  rationale: יוּבָל의 수동형을 자연스러운 한국어 수동 표현으로 옮겼고, ‘기름’은 원문처럼 일반 명칭을 유지해 제사적·외교적 함의를 열어 두었습니다.
theological_decisions:
- issue: 예언적 비유를 해석으로 풀어쓰기보다 유지할 것인지
  chosen_reading: ‘바람을 먹고 동풍을 따라’라는 비유를 본문에 그대로 두었습니다.
  alternative_readings:
  - 허무한 것을 추구하며
  - 헛된 정책을 좇으며
  rationale: 이 구절의 예언자적 날카로움은 비유 자체에 있으므로, 의미를 설명문으로 바꾸지 않고 원문의 이미지를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 주어의 수 변화
  chosen_reading: 앞부분은 에브라임 단수 동작으로, 뒷부분은 ‘그들은’ 복수로 옮겼습니다.
  alternative_readings:
  - 전 구절을 단수로 통일
  - 전 구절을 복수로 통일
  rationale: 히브리어가 집합적 단수에서 복수로 이동하는 흐름을 평탄화하지 않고 드러내어, 원문의 수사적 변화를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
