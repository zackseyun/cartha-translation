  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶפְרַ֔יִם אַ֣ךְ עָשַׁ֔רְתִּי מָצָ֥אתִי א֖וֹן לִ֑/י כָּל יְגִיעַ֕/י לֹ֥א יִמְצְאוּ לִ֖/י עָוֺ֥ן אֲשֶׁר חֵֽטְא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
  footnotes:
  - marker: a
    text: Or “I have found strength for myself”; the Hebrew word can mean strength, wealth, or substance, but here likely refers to material wealth.
    reason: lexical_alternative
  - marker: b
    text: Or “In all my gains they will not find any iniquity in me that would be sin.” The Hebrew of this clause is compressed and allows slightly different construals.
    reason: alternative_reading
  - marker: c
    text: Or 'iniquity that is sin'.
    reason: previous_rendering
translation:
  language: ko
  text: 에브라임이 말합니다[a]. “내가 반드시 부자가 되었고, 내게서 재물을 찾았습니다[b][c]. 나의 모든 수고 가운데서 그들은 내게서 죄가 되는 죄악을 찾지 못할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에브라임이 말하기를”로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “내가 내 힘을 찾았다”로도 옮길 수 있습니다. 히브리어 אוֹן은 여기서 힘, 재물, 실체를 뜻할 수 있지만, 문맥상 물질적 재물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “나를 위하여 재물을 찾았습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 반드시
  alternatives_korean:
  - 참으로
  - 정녕
  lexicon: HALOT
  rationale: 에브라임의 자기확신을 드러내는 강조로 이해하여, 자연스러운 확신 표현인 ‘반드시’로 옮겼습니다.
- source_word: עָשַׁרְתִּי
  english_pob_choice: I have become rich
  chosen_korean: 부자가 되었고
  alternatives_korean:
  - 부유해졌고
  - 부자가 되었습니다
  lexicon: HALOT
  rationale: 획득된 상태를 나타내는 완료 뉘앙스를 살려 ‘부자가 되었고’로 옮겼습니다.
- source_word: מָצָאתִי א֖וֹן לִ֑/י
  english_pob_choice: I have found wealth for myself
  chosen_korean: 내게서 재물을 찾았습니다
  alternatives_korean:
  - 내 몫의 재물을 찾았습니다
  - 나 자신을 위한 부를 찾았습니다
  lexicon: HALOT
  rationale: אוֹן은 이 문맥에서 물질적 이익을 가리키므로 ‘재물’로 옮겼고, לִי는 자기 자신을 위한 획득을 자연스럽게 드러내도록 처리했습니다.
- source_word: כָּל יְגִיעַ֕/י
  english_pob_choice: all my labor
  chosen_korean: 나의 모든 수고
  alternatives_korean:
  - 나의 모든 노동
  - 나의 모든 애씀
  lexicon: HALOT
  rationale: 단순한 행위보다 수고와 애씀의 총체를 가리키므로, 한국어에서는 가장 자연스럽고 포괄적인 ‘수고’로 번역했습니다.
- source_word: עָוֺן אֲשֶׁר חֵטְא
  english_pob_choice: iniquity that is sin
  chosen_korean: 죄가 되는 죄악
  alternatives_korean:
  - 죄인 죄악
  - 곧 죄인 죄악
  lexicon: HALOT
  rationale: 압축된 히브리어의 수식 관계를 한국어에서 그대로 직역하면 어색해지므로, ‘죄악’이 ‘죄’로 판정될 만한 성격임을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 에브라임의 발화가 자기변호라는 점
  chosen_reading: 직접화법을 유지하고, 본문 자체는 그 주장에 동의하지 않도록 번역했습니다.
  alternative_readings:
  - 비판적 뉘앙스를 본문 안에 더 노골적으로 넣는 번역
  rationale: 선지자적 비판은 문맥이 담당하며, 본절은 에브라임의 자만 섞인 주장 자체를 그대로 들려줍니다. 따라서 번역도 그 수사적 긴장을 보존했습니다.
  doctrine_reference: 본문의 화자 의도와 정경적 비판의 긴장을 보존
