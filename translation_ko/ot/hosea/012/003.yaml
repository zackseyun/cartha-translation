id: HOS.12.3
reference: Hosea 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רִ֥יב לַֽ/יהוָ֖ה עִם יְהוּדָ֑ה וְ/לִ/פְקֹ֤ד עַֽל יַעֲקֹב֙ כִּ/דְרָכָ֔י/ו כְּ/מַעֲלָלָ֖י/ו יָשִׁ֥יב לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
  footnotes:
  - marker: a
    text: Or 'The LORD has a case against Judah' or 'The LORD has a controversy with Judah.' The Hebrew uses legal-dispute language.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will call Jacob to account.' The Hebrew expression literally means 'to visit upon,' often in the sense of punishment or judicial reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 유다를 상대로 고발하실 것이며[a], 야곱을 그 길들대로 벌하실 것입니다[b]. 그의 행위대로 그에게 갚아 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다와 법정 분쟁을 벌이신다’ ‘유다와 송사를 가지신다’. 히브리어는 법적 다툼을 뜻하는 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야곱을 책임을 묻다’로 이해할 수 있습니다. 히브리어 표현은 문자적으로는 ‘위에 들르다/임하다’의 뜻이며, 여기서는 심판이나 법적 결산의 의미로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב / עִם יְהוּדָה
  english_pob_choice: has a charge against Judah
  chosen_korean: 유다를 상대로 고발하실 것이며
  alternatives_korean:
  - 유다에 대해 다투실 것이며
  - 유다와 논쟁하실 것이며
  - 유다를 상대로 소송을 제기하실 것이며
  lexicon: HALOT
  rationale: רִיב은 예언서에서 법정적 분쟁을 가리키므로, 한국어로는 단순한 감정적 다툼보다 법적·언약적 대립을 드러내는 표현이 필요합니다. '고발하실 것이며'는 공적 책망과 법적 책문을 함께 살리면서 현대 한국어로 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 관행적 학술 음역
  rationale: 여기서는 문맥상 신적 호칭이 아니라 여호와/야훼의 고유명으로서의 Tetragrammaton이므로, 본 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: לִפְקֹד עַל
  english_pob_choice: will punish
  chosen_korean: 벌하실 것입니다
  alternatives_korean:
  - 살피실 것입니다
  - 권문하실 것입니다
  - 그 위에 벌을 내리실 것입니다
  lexicon: HALOT
  rationale: פקד + עַל은 심판 문맥에서 '벌하다/징계하다'의 뜻이 분명하므로, '벌하실 것입니다'가 가장 직접적으로 대응합니다.
- source_word: כִּדְרָכָיו
  english_pob_choice: according to his ways
  chosen_korean: 그 길들대로
  alternatives_korean:
  - 그 행실대로
  - 그 행위 방식대로
  - 그 길에 따라
  lexicon: HALOT
  rationale: דְּרָכִים은 문자 그대로 '길들'이지만 도덕적 행실을 가리키는 비유이므로, 이미지와 의미를 함께 살리는 '그 길들대로'를 택했습니다.
- source_word: כְּמַעֲלָלָיו
  english_pob_choice: according to his deeds
  chosen_korean: 그의 행위대로
  alternatives_korean:
  - 그의 행실대로
  - 그의 일들대로
  - 그의 행동대로
  lexicon: HALOT
  rationale: מַעֲלָלִים은 실제로 행한 일들을 가리키며 예언적 심판 맥락에서는 도덕적 평가를 띱니다. '행위'가 가장 무난하면서도 무게감이 있습니다.
- source_word: יָשִׁיב לוֹ
  english_pob_choice: he will repay him
  chosen_korean: 갚아 주실 것입니다
  alternatives_korean:
  - 보응하실 것입니다
  - 되돌려 주실 것입니다
  - 보상하실 것입니다
  lexicon: HALOT
  rationale: שׁוּב 히필 + לוֹ는 단순한 반환이 아니라 보응/상응하는 되갚음의 뜻이므로, 현대 한국어에서 그 의미를 자연스럽게 드러내는 '갚아 주실 것입니다'를 사용했습니다.
theological_decisions:
- issue: 유다와 야곱의 구분 유지
  chosen_reading: 유다는 야훼의 고발 대상, 야곱은 이어지는 심판과 보응의 대상이 되도록 둘 다 본문에 남겨 구분을 유지했습니다.
  alternative_readings:
  - 야곱을 곧 유다의 다른 이름으로 처리하여 구분을 약화시키는 읽기
  - 두 명칭을 모두 이스라엘 전체로 평면화하는 읽기
  rationale: 본문은 유다와 야곱을 함께 언급하므로, 예언적 수사 안의 긴장을 지우지 않고 그대로 드러내는 것이 원문 충실성에 더 적합합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
