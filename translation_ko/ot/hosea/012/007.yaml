  naturalness: ‘네 하나님으로 말미암아’는 다소 무거우나 원문의 비통상적 전치사 구성을 보존하는 데 적절합니다. 다만 단수 호칭을 복원하고 각 명령을 분명히 하면 현대 한국어 합쇼체에서 더 자연스럽습니다. ‘한결같은 사랑’은 ‘인애’보다 현대 독자에게 더 투명하면서 חֶסֶד의 지속적 사랑의 뜻을 잘 전달합니다.
  terminology: שׁוּב은 ‘돌아오십시오’로, חֶסֶד는 ‘한결같은 사랑’으로, מִשְׁפָּט은 윤리적·사회적 의미의 ‘정의’로, קוה는 ‘기다리십시오’로 옮겼습니다. ‘회개’처럼 해석을 좁히는 표현은 사용하지 않았습니다.
