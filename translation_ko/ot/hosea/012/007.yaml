source:
  edition: WLC
  text: וְ/אַתָּ֖ה בֵּ/אלֹהֶ֣י/ךָ תָשׁ֑וּב חֶ֤סֶד וּ/מִשְׁפָּט֙ שְׁמֹ֔ר וְ/קַוֵּ֥ה אֶל אֱלֹהֶ֖י/ךָ תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
  footnotes:
  - marker: a
    text: Or 'return to your God'; the Hebrew literally has 'by/with your God return,' an unusual construction that may express means, relation, or direction.
    reason: lexical_alternative
  - marker: b
    text: '''Wait'' can also be rendered ''hope'' or ''look expectantly.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 너희 하나님으로 말미암아 돌아오고, 인애와 정의를 지키며, 네 하나님을 항상 기다리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 하나님께 돌아오라’로 옮길 수 있습니다. 히브리어는 직역하면 ‘너희 하나님으로/과 함께 돌아오라’는 이례적 구문입니다.
    reason: alternative_reading
  - marker: b
    text: ‘기다리며’는 ‘소망하며’ 또는 ‘간절히 바라며’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  english_pob_choice: by your God
  chosen_korean: 너희 하나님으로 말미암아
  alternatives_korean:
  - 너희 하나님에게
  - 너희 하나님과 함께
  - 너희 하나님께
  lexicon: HALOT
  rationale: ב 접두사는 수단·관계·영역을 나타낼 수 있으므로, 한국어에서는 ‘-으로 말미암아’로 옮겨 반환의 근거와 매개를 드러내되, 영어 POB가 지적한 이례적 구조를 너무 매끈하게 평탄화하지 않았습니다.
- source_word: תָשׁוּב
  english_pob_choice: return
  chosen_korean: 돌아오고
  alternatives_korean:
  - 돌이키고
  - 회개하고
  - 되돌아오고
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다/되돌아가다’를 살려, 회개라는 신학적으로 좁은 표현으로 미리 규정하지 않았습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성과 사랑의 결을 함께 담는 한국어 성경 용례를 고려해 ‘인애’를 택했습니다. 문맥상 윤리적 실천 항목으로도 자연스럽습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 심판
  - 판결
  lexicon: HALOT
  rationale: 이 권면 문맥에서는 מִשְׁפָּט가 재판 행위보다 사회적·윤리적 올바름을 가리키므로 ‘정의’가 가장 직접적입니다.
- source_word: וְקַוֵּה
  english_pob_choice: wait
  chosen_korean: 기다리며
  alternatives_korean:
  - 소망하며
  - 바라며
  - 기대하며
  lexicon: HALOT
  rationale: קוה는 기다림과 기대를 함께 내포하므로, 한국어에서는 행위의 지속성을 살리는 ‘기다리며’로 옮기고 그 희망의 뉘앙스는 문맥으로 보존했습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 항상
  alternatives_korean:
  - 끊임없이
  - 늘
  - 언제나
  lexicon: HALOT
  rationale: תָּמִיד의 지속성은 한국어 합쇼체 권면에서 ‘항상’이 가장 자연스럽고 간결합니다.
theological_decisions:
- issue: ‘돌아오다’가 단순 이동인지 회개적 소환인지
  chosen_reading: 회개로 한정하지 않고 언약적 귀환의 의미를 보존했습니다.
  alternative_readings:
  - 회개하십시오
  - 돌이키십시오
  rationale: 히브리어 שׁוּב 자체는 더 넓은 ‘돌아옴’을 가리키므로, 본문이 요구하는 언약적 복귀를 드러내되 교리적으로 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
