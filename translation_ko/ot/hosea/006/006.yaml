base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
  footnotes:
  - marker: a
    text: Or 'mercy' or 'loyal love' for 'steadfast love' (Hebrew חֶסֶד), a term that can include covenant faithfulness as well as mercy.
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''from burnt offerings''; here the Hebrew expresses preference: ''rather than burnt offerings'' or ''more than burnt offerings.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 제사보다 한결같은 사랑[a]을 원하며, 번제보다 하나님을 아는 것[b]을 원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד는 ‘자비’, ‘신실한 사랑’, ‘언약적 충성’을 포함할 수 있는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘번제들로부터’라고 말합니다. 여기서는 ‘번제보다’ 또는 ‘번제보다 더’라는 선호의 비교를 나타냅니다.
    reason: lexical_alternative
