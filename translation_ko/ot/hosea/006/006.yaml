theological_decisions:
- issue: 제사 거부가 절대적 부정인지, 비교적 우선순위인지
  chosen_reading: 언약적 인자와 하나님을 아는 지식이 형식적 제사보다 우선한다는 비교적 진술
  alternative_readings:
  - 제사 제도 자체를 전면 부정하는 진술
  rationale: 본문은 부정과 비교를 함께 사용해 제의 자체보다 언약적 실재를 우선시키며, 예언서 특유의 대조를 보존하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
