  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
  footnotes:
  - marker: a
    text: Or 'mercy' or 'loyal love' for 'steadfast love' (Hebrew חֶסֶד), a term that can include covenant faithfulness as well as mercy.
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''from burnt offerings''; here the Hebrew expresses preference: ''rather than burnt offerings'' or ''more than burnt offerings.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 원하는 것은 인자입니다[b][a], 제사가 아니라. 하나님을 아는 지식입니다, 번제보다 더.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 히브리어 חֶסֶד의 언약적 사랑, 자비, 신실함을 함께 아우를 수 있는 전통적 한국어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘번제에서’이지만, 여기서는 ‘번제보다 더’라는 선호 비교를 뜻합니다.
    reason: lexical_alternative
