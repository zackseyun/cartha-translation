id: HOS.6.5
reference: Hosea 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֗ן חָצַ֨בְתִּי֙ בַּ/נְּבִיאִ֔ים הֲרַגְתִּ֖י/ם בְּ/אִמְרֵי פִ֑/י וּ/מִשְׁפָּטֶ֖י/ךָ א֥וֹר יֵצֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
  footnotes:
  - marker: a
    text: Or, 'and my judgment goes forth like light.' The Hebrew text as pointed reads 'your judgments,' but some interpreters understand the sense as God's judgment/justice going forth.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 나는 예언자들을 통하여 그들을 찍어냈고, 내 입의 말들로 그들을 죽였습니다[a]. 그리고 네 판결들은 빛처럼 나아갑니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘내 판결이 빛처럼 나아간다.’ 히브리어 본문은 문자 그대로는 ‘네 판결들’로 읽히지만, 일부 해석자들은 하나님의 판결/의가 빛처럼 나아간다는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 이 때문에
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언의 결과를 잇는 결론 표지이므로, 한국어에서는 문맥에 맞는 공식적 연결어인 ‘그러므로’가 가장 자연스럽습니다.
- source_word: חָצַבְתִּי
  english_pob_choice: I have hewn
  chosen_korean: 찍어냈고
  alternatives_korean:
  - 깎아냈고
  - 다듬어냈고
  lexicon: HALOT
  rationale: 원어의 강한 절단·다듬음 이미지를 살리되, 한국어에서는 예언자들을 수단으로 삼아 단호하게 다루셨다는 은유가 드러나도록 ‘찍어냈고’로 옮겼습니다.
- source_word: בַּנְּבִיאִים
  english_pob_choice: by the prophets
  chosen_korean: 예언자들을 통하여
  alternatives_korean:
  - 예언자들로 말미암아
  - 예언자들을 통해
  lexicon: HALOT
  rationale: beth의 도구적 용법을 자연스럽게 풀어, 하나님이 예언자들을 매개로 행동하신다는 뜻을 분명히 했습니다.
- source_word: וּמִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 네 판결들은
  alternatives_korean:
  - 너의 심판은
  - 네 율례들은
  lexicon: HALOT
  rationale: 원문 표지의 2인칭 어미를 반영하여 ‘네’로 유지했고, משפט의 법정·판결 의미를 따라 ‘판결들’로 옮겨 사안의 드러남과 판정의 의미를 살렸습니다.
theological_decisions:
- issue: בְּאִמְרֵי פִי의 강한 심판적 발화
  chosen_reading: 내 입의 말들로 그들을 죽였습니다
  alternative_readings:
  - 내 입의 말로 그들을 죽였습니다
  - 내 입에서 나온 말씀으로 그들을 죽였습니다
  rationale: 원어의 복수형 ‘말들’과 직접적 심판 행위를 보존해, 신적 발화가 실제로 파괴적 효력을 가진다는 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: 신적 말씀의 কার্য효력과 예언자적 심판 선언
- issue: וּמִשְׁפָּטֶיךָ의 2인칭 유지
  chosen_reading: 네 판결들은 빛처럼 나아갑니다
  alternative_readings:
  - 내 판결들은 빛처럼 나아갑니다
  - 판결은 빛처럼 나아갑니다
  rationale: 마소라 본문의 2인칭 어미를 본문대로 살려, 난해함을 평탄화하지 않고 독자가 본문의 긴장을 보도록 했습니다.
  doctrine_reference: 본문의 이질적 독법을 보존하는 원문 우선 원칙
