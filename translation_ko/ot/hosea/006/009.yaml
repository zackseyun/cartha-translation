    rationale: זִמָּה는 이 문맥에서 단순한 무례함보다 수치스럽고 흉악한 악행/범죄를 뜻합니다. ‘불손한’은 의미 강도와 범주를 충분히 전달하지 못합니다.
  - severity: low
