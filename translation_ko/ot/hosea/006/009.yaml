    rationale: ‘사람들처럼 매복하는 자들처럼’은 ‘처럼’이 중복되고 ‘사람들’과 ‘매복하는 자들’이 병렬되지 않아 문법·문체상 부자연스럽습니다. 원문의 난해함을 보존하되 중복 없이 옮겨야 합니다.
