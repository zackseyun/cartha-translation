id: HOS.6.9
reference: Hosea 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/חַכֵּ֨י אִ֜ישׁ גְּדוּדִ֗ים חֶ֚בֶר כֹּֽהֲנִ֔ים דֶּ֖רֶךְ יְרַצְּחוּ שֶׁ֑כְמָ/ה כִּ֥י זִמָּ֖ה עָשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: alternatively, ''as robbers lie in wait for a man, so a band of priests murders on the way to Shechem.'''
    reason: alternative_reading
  - marker: b
    text: Or 'shameful crime,' 'wickedness.' The Hebrew term denotes a heinous or outrageous act.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 매복하여 기다리는 자들처럼[a], 제사장들의 무리가 세겜으로 가는 길에서 살인을 저지릅니다. 참으로[b] 그들은 악행을 저질렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 어렵습니다. 달리 ‘마치 강도들이 한 사람을 기다리듯, 제사장들의 무리가 세겜으로 가는 길에서 살인을 저지른다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘수치스러운 죄’, ‘악행’. 히브리어는 흉악하거나 수치스러운 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  english_pob_choice: And like men lying in wait
  chosen_korean: 그리고 사람들처럼 매복하는 자들처럼
  alternatives_korean:
  - 그리고 한 사람의 약탈자처럼
  - 그리고 길목에 숨어 기다리는 사람들처럼
  - 그리고 매복한 약탈자들처럼
  lexicon: HALOT
  rationale: 히브리어의 압축된 비교구는 직접적인 ‘기다림’보다 적대적 매복의 이미지를 드러냅니다. 한국어에서는 ‘매복하는 자들’이 문맥의 폭력성과 비교구를 자연스럽게 살립니다.
- source_word: חֶבֶר כֹּהֲנִים
  english_pob_choice: a band of priests
  chosen_korean: 제사장들의 무리
  alternatives_korean:
  - 제사장들의 집단
  - 제사장들의 한 떼
  - 제사장들의 동아리
  lexicon: HALOT
  rationale: חֶבֶר는 중립적 ‘모임’보다 결속된 무리 또는 무리를 뜻하므로, 공격적 문맥에서는 ‘무리’가 가장 적절합니다.
- source_word: דֶּרֶךְ יְרַצְּחוּ שֶׁכְמָה
  english_pob_choice: murders on the way to Shechem
  chosen_korean: 세겜으로 가는 길에서 살인합니다
  alternatives_korean:
  - 세겜으로 가는 길목에서 살인합니다
  - 세겜으로 가는 도중에 살인합니다
  - 세겜으로 향하는 길에서 죽입니다
  lexicon: HALOT
  rationale: דֶּרֶךְ는 ‘길/도로’이며 장소명과 결합해 이동 경로를 나타냅니다. יְרַצְּחוּ는 단순 ‘죽이다’보다 ‘살인하다’가 רצח의 범죄성을 더 정확히 드러냅니다.
- source_word: זִמָּה
  english_pob_choice: wickedness
  chosen_korean: 악행
  alternatives_korean:
  - 수치스런 죄
  - 흉악한 일
  - 사악함
  lexicon: HALOT
  rationale: זִמָּה는 맥락상 도덕적으로 극악하고 수치스러운 행위를 가리키므로, 한국어로는 너무 좁지 않으면서도 강한 비난을 담는 ‘악행’이 적절합니다.
theological_decisions:
- issue: 애매한 첫 비교구의 처리
  chosen_reading: 제사장들을 길목에 매복하는 폭력적 무리로 비유하는 이미지를 유지했습니다.
  alternative_readings:
  - ‘한 사람의 약탈자’로 더 구체화할 수 있습니다.
  - 본문이 축약·난해하므로 재구성된 문장으로 풀 수 있습니다.
  rationale: 히브리어가 매우 압축되어 있어 해석을 과도하게 단정하지 않으면서도, 문맥의 고발—제사장들의 폭력성과 배신성—을 유지하는 쪽이 바람직합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: זִמָּה의 강도
  chosen_reading: 도덕적 비난의 강도를 살려 ‘악행’으로 옮겼습니다.
  alternative_readings:
  - ‘수치스런 죄’로 더 구체화할 수 있습니다.
  - ‘악독한 일’로도 번역할 수 있습니다.
  rationale: 이 단어는 단순한 잘못이 아니라 수치스럽고 흉악한 범죄를 가리킬 수 있어, 문맥에 맞는 강한 평가를 남겨 두는 것이 좋습니다.
  doctrine_reference: Source semantics of זִמָּה in prophetic denunciation
