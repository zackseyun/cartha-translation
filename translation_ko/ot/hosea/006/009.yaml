- from: 그리고 사람들처럼 매복하는 자들처럼, 제사장들의 무리가 세겜으로 가는 길에서 살인합니다. 참으로 그들은 악행을 저질렀습니다.[a][b]
  to: 그리고 매복하여 기다리는 자들처럼[a], 제사장들의 무리가 세겜으로 가는 길에서 살인을 저지릅니다. 참으로[b] 그들은 악행을 저질렀습니다.
