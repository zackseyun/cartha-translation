source:
  edition: WLC
  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
  footnotes:
  - marker: a
    text: Or 'let us pursue' or 'let us strive after' to know the LORD.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'His going forth'; possibly 'his appearing.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''may he come to us like the rain.'' The Hebrew verb can be taken as a wish, though the context also supports a confident future: ''he will come.'''
    reason: alternative_reading
  - marker: d
    text: '''Spring rain'' translates Hebrew ''latter rain,'' the late seasonal rain important for crops.'
    reason: cultural_note
translation:
  language: ko
  text: 우리가 야훼를 압시다. 야훼를 알기를 힘써 추구합시다.[a] 그의 나아가심은 새벽처럼 확실하며,[b] 그는 우리에게 비처럼, 땅을 적시는 봄비처럼 오실 것입니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘써 추구합시다’는 ‘뒤쫓다, 추구하다’라는 뜻의 히브리어를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 나아가심’은 ‘그의 나타나심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 ‘그는 오실 것입니다’라는 확신으로도, ‘그가 우리에게 오시기를’이라는 소망으로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘봄비’는 곡식을 돕는 늦은 계절의 비를 가리키는 농경적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה / לָדַעַת
  english_pob_choice: So let us know / to know
  chosen_korean: 우리가 알자 / 알기를
  alternatives_korean:
  - 우리가 알게 하소서
  - 우리가 알아가자
  lexicon: HALOT
  rationale: ידע의 공동체적 권면과 언약적 ‘앎’을 살리기 위해 단순 인지보다 결단을 담은 ‘알자 / 알기를’로 옮겼습니다.
- source_word: נִרְדְּפָה
  english_pob_choice: let us press on
  chosen_korean: 힘써 따르자
  alternatives_korean:
  - 추구하자
  - 뒤쫓자
  lexicon: HALOT
  rationale: רדף의 문자적 뜻인 ‘뒤쫓다’보다, 여기서 ‘알기’와 결합된 지속적이고 의지적인 추구를 한국어로 자연스럽게 드러내는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 기존 영어 POB가 ‘Yahweh’를 사용하지만, 한국어 본문에서는 독자 가독성과 본문 일관성을 위해 기존 한국어 성서 전통에서 널리 인지되는 음역 ‘여호와’를 사용했습니다.
- source_word: מוֹצָאוֹ
  english_pob_choice: His going forth
  chosen_korean: 그의 나아가심
  alternatives_korean:
  - 그의 나감
  - 그의 나타나심
  lexicon: HALOT
  rationale: מוצא의 ‘나아감/나감’ 이미지를 유지하되, 새벽의 비유와 연결되는 하나님의 움직임을 자연스럽게 드러내는 ‘나아가심’을 선택했습니다.
- source_word: כְשַׁחַר נָכוֹן
  english_pob_choice: as sure as the dawn
  chosen_korean: 새벽처럼 분명하며
  alternatives_korean:
  - 새벽처럼 확실하며
  - 새벽처럼 견고하며
  lexicon: HALOT
  rationale: שׁחר와 נכון의 결합은 단순한 시간 비교를 넘어 확실성과 변함없음을 강조하므로, 한국어에서는 ‘분명하다’로 그 확실성을 살렸습니다.
- source_word: כַגֶּשֶׁם / כְּמַלְקוֹשׁ / יוֹרֶה
  english_pob_choice: like the rain / like the spring rain that waters the earth
  chosen_korean: 비와 같이, 땅을 적시는 봄비와 같이
  alternatives_korean:
  - 비처럼, 땅을 적시는 이른비처럼
  - 비처럼, 땅을 적시는 늦은비처럼
  lexicon: HALOT
  rationale: גשם과 מלקוש의 농경적 이미지를 살리면서, 영어 POB의 ‘spring rain’ 취지를 따라 한국어 독자가 즉시 이해할 수 있는 ‘봄비’로 옮겼습니다.
