revisions:
- from: 그러므로 우리가 여호와를 알자. 여호와를 알기를 힘써 따르자. 그의 나아가심은 새벽처럼 분명하며, 그는 우리에게 비와 같이, 땅을 적시는 봄비와 같이 오실 것입니다.[a][b][c][d]
  to: 우리가 야훼를 압시다. 야훼를 알기를 힘써 추구합시다.[a] 그의 나아가심은 새벽처럼 확실하며,[b] 그는 우리에게 비처럼, 땅을 적시는 봄비처럼 오실 것입니다.[c][d]
  rationale: 신명 표기를 POB 방침에 맞추고, 권면형을 현대 합쇼체로 고쳤습니다. רדף는 ‘따르다’ 대신 ‘힘써 추구하다’로 옮겨 ‘야훼를 알기’ 위해 지속적으로 힘쓴다는 뜻을 보존했습니다. 접속사에 불필요한 인과를 부여한 ‘그러므로’는 제거했습니다. 나아가심 및 오심의 문법적·해석적 여지는 각주로 보존했습니다.
