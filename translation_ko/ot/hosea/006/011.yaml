  rationale: 히브리어 2인칭 여성 단수 접미사는 유다를 집합명사처럼 부르는 표현이므로, 한국어에서는 공동체 지칭으로 옮겨 자연스럽게 처리했습니다.
- source_word: שָׁת קָצִיר
  english_pob_choice: a harvest is appointed
  chosen_korean: 추수가 정해져 있습니다
  alternatives_korean:
  - 추수가 नियुक्त되어 있습니다
  - 추수가 지정되어 있습니다
  - 추수가 마련되어 있습니다
  lexicon: HALOT
  rationale: שׁית의 ‘두다/정하다’ 의미를 살려, 수확의 시기가 ‘정해졌다’는 뜻으로 옮겼습니다. ‘추수’는 קָצִיר의 기본 의미를 유지합니다.
- source_word: בְּשׁוּבִי שְׁבוּת עַמִּי
  english_pob_choice: when I restore the fortunes of my people
  chosen_korean: 내가 내 백성의 형편을 회복할 때
  alternatives_korean:
  - 내가 내 백성의 포로 상태를 되돌릴 때
  - 내가 내 백성의 포로를 돌아오게 할 때
  - 내가 내 백성의 운명을 회복할 때
  lexicon: HALOT
  rationale: 보통의 회복 공식으로 읽히는 구문이므로 ‘형편을 회복하다’로 자연스럽게 옮기되, 문자적 ‘포로/포로 상태’ 해석 가능성은 본문 주석 없이 과도하게 특정하지 않도록 했습니다.
theological_decisions:
- issue: ‘추수’의 심판적 뉘앙스를 본문에서 얼마나 드러낼지
  chosen_reading: 본문에는 해석을 덧붙이지 않고 ‘추수’ 자체를 유지했습니다.
  alternative_readings:
  - 심판의 추수
  - 축복의 추수
  - 회복의 추수
  rationale: 호세아서 문맥상 경고의 울림이 있지만, 이어지는 절은 회복 언어를 포함하므로 긴장을 보존하기 위해 메타포를 무표지로 두었습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolving it.'
