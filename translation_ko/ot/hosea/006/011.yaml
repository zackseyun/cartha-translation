  - marker: b
    text: 또는 ‘내가 내 백성의 포로 상태를 되돌릴 때.’ 히브리어 표현은 ‘내가 내 백성의 형편을 회복할 때’라는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 심지어
  - 더구나
  lexicon: HALOT
  rationale: 앞절에 이어 유다를 덧붙이는 추가 의미를 자연스러운 현대 한국어로 살렸습니다.
