review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the additive גַּם, the appointed harvest, and the restoration formula. However, לָךְ is feminine singular, referring to personified Judah; rendering it as ‘너희를 위한’ both changes the addressee to plural and creates an awkward double construction with ‘유다에게는.’ The temporal restoration clause should be syntactically connected to the appointment of the harvest.
  naturalness: ‘유다에게는 너희를 위한’ is unnatural and internally inconsistent. Recasting the verse with ‘유다에게도’ and placing the temporal clause before the main predicate gives clear, modern formal Korean while preserving the Hebrew’s compact expression.
  terminology: ‘추수’ appropriately retains the unqualified metaphor. ‘내 백성의 형편을 회복하다’ is a natural rendering of the prophetic restoration formula and does not over-specify whether שְבוּת denotes captivity or restored fortunes. The alternative footnote is revised to make the captivity-oriented reading idiomatic Korean.
  issues:
  - severity: high
    issue: The singular feminine ‘for you’ is rendered as plural ‘너희를 위한.’
    rationale: לָךְ addresses Judah as a grammatically feminine singular entity. The plural shifts the source grammar and is compounded by the simultaneous use of ‘유다에게는.’
  - severity: medium
    issue: The main clause and the temporal clause are poorly connected.
    rationale: The draft’s two independent sentences leave ‘내가 … 회복할 때입니다’ semantically and syntactically incomplete; בְּשׁוּבִי should modify the appointment of the harvest.
  - severity: low
    issue: Footnote b’s ‘포로 상태를 되돌릴 때’ is awkward Korean.
    rationale: ‘포로 생활을 되돌릴 때’ more idiomatically presents the captivity-oriented alternative without deciding the debated sense in the main text.
  revised_text: 유다에게도, 내가 내 백성의 형편을 회복할 때에 추수가 정해져 있습니다.[a][b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘유다를 위해 추수가 마련되어 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 내 백성의 포로 생활을 되돌릴 때.’ 히브리어 표현은 ‘내가 내 백성의 형편을 회복할 때’라는 뜻일 수도 있습니다.
    reason: alternative_reading
  revision_rationale: The revision restores the singular reference to Judah without using an incongruous second-person plural, links the restoration clause to the appointed harvest, and retains the source’s unresolved harvest metaphor and restoration-language ambiguity.
