  text: 또한 유다에게는 너희를 위한 추수가 정해져 있습니다. 내가 내 백성의 형편을 회복할 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 위해 추수가 정해져 있습니다.’
