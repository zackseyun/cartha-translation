revisions:
- from: 또한 유다에게는 너희를 위한 추수가 정해져 있습니다. 내가 내 백성의 형편을 회복할 때입니다.[a][b]
  to: 유다에게도, 내가 내 백성의 형편을 회복할 때에 추수가 정해져 있습니다.[a][b]
  rationale: The revision restores the singular reference to Judah without using an incongruous second-person plural, links the restoration clause to the appointed harvest, and retains the source’s unresolved harvest metaphor and restoration-language ambiguity.
  reviewer_model: gpt-5.6-terra
