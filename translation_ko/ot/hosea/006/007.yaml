  source_fidelity: 본문은 כְּאָדָם을 ‘아담처럼’으로 옮기고 대안 독법을 각주에 보존하며, ‘언약을 어겼습니다’와 ‘거기서’를 통해 히브리어의 핵심 의미를 대체로 충실히 반영합니다. 다만 בָּגְדוּ בִי는 하나님을 향한 배반/배신을 뜻하므로 한국어에서는 직접 목적어를 취한 표현이 더 정확하고 자연스럽습니다. 또한 וְ의 문맥상 대조를 ‘그러나’로 드러내는 것이 적절합니다.
  naturalness: ‘나에게 신의를 저버렸습니다’는 ‘신의를 저버리다’의 일반적인 결합과 다소 어긋나며, ‘나를 배신했습니다’가 현대 표준 한국어에서 자연스럽고 분명합니다. ‘거기서’는 자연스럽습니다.
