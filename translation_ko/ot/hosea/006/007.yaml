  text: 그들은 아담처럼 언약을 어겼습니다. 거기서 그들은 나에게 신의를 저버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람처럼’, ‘인류처럼’. 히브리어 אָדָם은 아담 개인을 가리킬 수도 있고, 일반적인 사람이나 인류를 가리킬 수도 있습니다.
    reason: alternative_reading
