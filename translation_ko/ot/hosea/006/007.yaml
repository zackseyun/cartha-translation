  - 인류처럼
  rationale: 히브리어 אָדָם의 인칭명사/보통명사 중 본문은 POB의 판단처럼 아담 개인을 가리킬 가능성이 충분하므로, 그 신학적 연관성을 본문에 보존했습니다. 일반적 의미는 주석으로 남겨 긴장을 지웠습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3; Contested terms table for אָדָם'
