base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
  footnotes:
  - marker: a
    text: Or, 'like man' or 'like humankind.' The Hebrew אָדָם can refer either to Adam personally or to humanity in general.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 아담처럼 언약을 어겼습니다. 거기서 그들은 나를 배신했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람처럼’ 또는 ‘인류처럼’. 히브리어 אָדָם은 아담 개인을 가리킬 수도 있고, 일반적인 사람이나 인류를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그들은
  alternatives_korean:
  - 그러나 그들은
  - 하지만 그들은
  lexicon: HALOT
  rationale: 앞 절과의 대비는 문맥이 드러내므로 한국어에서는 접속어를 굳이 덧붙이지 않고 주어를 앞세워 자연스럽게 반영했습니다.
- source_word: כְּאָדָם
  english_pob_choice: like Adam
  chosen_korean: 아담처럼
  alternatives_korean:
  - 사람처럼
  - 인류처럼
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 고유명사 읽기를 살려 번역했습니다. 본문 주석으로는 인간 일반을 가리킬 가능성도 남겨 두었습니다.
- source_word: עָבְרוּ בְרִית
  english_pob_choice: transgressed the covenant
  chosen_korean: 언약을 어겼습니다
  alternatives_korean:
  - 언약을 범했습니다
  - 언약을 위반했습니다
  lexicon: HALOT
  rationale: בְּרִית와 결합한 עבר의 언약적 위반 의미를 살리되, 한국어에서 가장 자연스럽고 분명한 표현으로 옮겼습니다.
- source_word: בָּגְדוּ בִי
  english_pob_choice: dealt faithlessly with me
  chosen_korean: 나에게 신의를 저버렸습니다
  alternatives_korean:
  - 나를 배신했습니다
  - 나에게 불충했습니다
  lexicon: HALOT
  rationale: בגד의 핵심 뜻인 언약적 불충실과 배신을 살리면서, 현대 한국어에서 너무 구어적이거나 약한 표현은 피했습니다.
theological_decisions:
- issue: כְּאָדָם의 해석
  chosen_reading: 아담처럼
  alternative_readings:
