id: HOS.6.1
reference: Hosea 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
  footnotes:
  - marker: a
    text: Or 'and he will heal us ... and he will bind us up'; the Hebrew conjunction is simply 'and,' but English 'but' makes the contrast clearer.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'has torn' evokes the image of an animal tearing prey, underscoring the severity of the LORD's judgment.
    reason: cultural_note
translation:
  language: ko
  text: 자, 우리가 야훼께로 돌아갑시다. 그분께서 우리를 찢으셨지만 우리를 고쳐 주실 것입니다. 우리를 치셨지만 우리의 상처를 싸매 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Come
  chosen_korean: 오너라
  alternatives_korean:
  - 가자
  - 자, 가자
  lexicon: HALOT
  rationale: 복수 권면으로 시작하는 호소문이므로 한국어에서는 자연스러운 초청·촉구 표현인 ‘오너라’가 원문의 호소력을 잘 살립니다.
- source_word: וְנָשׁוּבָה
  english_pob_choice: let us return
  chosen_korean: 우리가 … 돌아가자
  alternatives_korean:
  - 우리가 … 돌아서자
  - 우리가 … 회개하자
  lexicon: HALOT
  rationale: שוב의 핵심은 언약적 ‘돌아감’이므로 ‘회개하다’보다 방향성을 살린 ‘돌아가자’가 더 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 고유 신명은 ‘야훼’로 옮겨, 제목 대체가 아니라 이름 자체를 드러냈습니다.
- source_word: טָרָף
  english_pob_choice: has torn us
  chosen_korean: 우리를 찢으셨으나
  alternatives_korean:
  - 우리를 찢으셨으니
  - 우리를 찢으셨지만
  lexicon: HALOT
  rationale: 맹수가 먹잇감을 찢는 이미지를 유지하기 위해 ‘찢으셨다’를 택했고, 앞뒤 대비는 한국어의 접속어로 자연스럽게 살렸습니다.
- source_word: וְ/יִרְפָּאֵ֑/נוּ
  english_pob_choice: but he will heal us
  chosen_korean: 우리를 고치실 것이며
  alternatives_korean:
  - 우리를 치유하실 것이며
  - 우리를 낫게 하실 것이며
  lexicon: HALOT
  rationale: 의학적·회복적 이미지를 모두 담을 수 있는 ‘고치다’가 본문에 가장 넓고 자연스럽습니다.
- source_word: יַ֖ךְ
  english_pob_choice: has struck us
  chosen_korean: 우리를 치셨으나
  alternatives_korean:
  - 우리를 때리셨으나
  - 우리를 상하게 하셨으나
  lexicon: HALOT
  rationale: יַךְ의 강한 타격성을 살리되, 성경 문맥에서 익숙한 동사 ‘치다’로 간결하게 옮겼습니다.
- source_word: וְ/יַחְבְּשֵֽׁ/נוּ
  english_pob_choice: but he will bind us up
  chosen_korean: 우리를 싸매실 것입니다
  alternatives_korean:
  - 우리를 감싸매실 것입니다
  - 우리를 붕대로 감아 주실 것입니다
  lexicon: HALOT
  rationale: 상처를 묶어 치료하는 뜻을 살리기 위해 ‘싸매다’를 선택했고, 과도한 설명은 피했습니다.
theological_decisions:
- issue: 야훼의 심판과 회복의 긴장
  chosen_reading: ‘찢으셨으나 … 고치실 것이며, … 치셨으나 … 싸매실 것입니다’로 심판과 회복을 한 문장 안에 함께 보존했습니다.
  alternative_readings:
  - 모두 미래형으로 통일
  - 접속을 모두 ‘그리고’로 처리
  rationale: 본문은 하나님이 상처를 내시는 분이면서 동시에 치유하시는 분이라는 긴장을 드러내므로, 어느 한쪽으로 완화하지 않도록 대비를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
