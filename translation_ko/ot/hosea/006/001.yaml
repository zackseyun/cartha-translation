revisions:
- from: 오너라. 우리가 야훼께로 돌아가자. 그분이 우리를 찢으셨으나 우리를 고치실 것이며, 우리를 치셨으나 우리를 싸매실 것입니다.[a]
  to: 자, 우리가 야훼께로 돌아갑시다. 그분께서 우리를 찢으셨지만 우리를 고쳐 주실 것입니다. 우리를 치셨지만 우리의 상처를 싸매 주실 것입니다.
  rationale: 복수 공동 권면과 현대 합쇼체를 ‘자, 우리가 … 돌아갑시다’로 반영했습니다. 두 대구를 각각 독립 문장으로 정리하여 심판과 회복의 대조를 분명히 했습니다. 마지막 치료 비유는 한국어의 자연스러운 목적어 결합을 위해 ‘우리의 상처’를 명시했으며, 원문의 회복 의미를 변경하지 않습니다. 기존 각주는 수정된 본문에 맞지 않고 그 설명도 수·문체 면에서 부정확하여 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:49Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 찢음/침과 치유/상처를 싸맴의 대비 및 과거 심판과 미래 회복의 시간 관계를 잘 보존했습니다. 다만 ‘오너라’는 히브리어 복수 명령의 공동 권면을 정확히 나타내지 못하고, 현대 표준어 합쇼체에도 맞지 않습니다.
  naturalness: 현 번역은 ‘돌아가자’와 ‘것입니다’가 섞여 문체가 일관되지 않으며, ‘우리를 고치실 것이며’ 뒤에 새 대조절이 이어져 연결도 다소 부자연스럽습니다. ‘우리를 싸매실’은 한국어에서 사람 자체를 묶는 뜻으로 들릴 수 있으므로, 은유의 대상인 상처를 명시하는 편이 자연스럽습니다.
  terminology: ‘야훼’, ‘찢으셨다’, ‘치셨다’는 원문의 신명과 심판 이미지를 적절히 반영합니다. ‘상처를 싸매 주시다’는 חבש의 치료 은유를 자연스러운 현대 한국어로 보존합니다.
  issues:
  - severity: medium
    issue: ‘오너라’의 수와 문체
    rationale: ‘오너라’는 통상 단수·친근하거나 고풍스러운 명령으로 들립니다. לְכוּ는 복수 명령이며 이어지는 ‘우리가 … 갑시다’라는 공동 권면을 도입하므로, 현대 합쇼체에서는 ‘자, 우리가 … 갑시다’가 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: 합쇼체 문체 불일치
    rationale: ‘돌아가자’는 해라체/친근한 권유인데 문장 끝은 ‘것입니다’로 합쇼체입니다. 목표 문체에 맞게 ‘돌아갑시다’로 통일해야 합니다.
  - severity: low
    issue: ‘우리를 싸매실’의 자연스러움
    rationale: 히브리어의 접미사는 문자상 ‘우리를’이나, 한국어 ‘싸매다’는 보통 상처를 목적어로 취합니다. ‘우리의 상처를 싸매 주실 것입니다’는 치료 은유를 자연스럽게 전달하며, 소유 표현은 문맥상 암시된 상처를 명시할 뿐입니다.
  - severity: low
    issue: 기존 각주의 부정확성
    rationale: 기존 각주는 ‘오너라’가 복수 권면을 살린다고 설명하지만, 해당 한국어 표현은 복수 표지가 아니며 수정문에는 적용되지 않습니다. 삭제하는 것이 맞습니다.
