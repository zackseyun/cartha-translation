id: HOS.6.2
reference: Hosea 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְחַיֵּ֖/נוּ מִ/יֹּמָ֑יִם בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י יְקִמֵ֖/נוּ וְ/נִחְיֶ֥ה לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
  footnotes:
  - marker: a
    text: Or 'in two days'; the Hebrew temporal expression may denote a short interval leading into the third day.
    reason: lexical_alternative
  - marker: b
    text: '''Raise us up'' may also be understood more generally as ''restore us'' or ''set us on our feet.'''
    reason: lexical_alternative
  - marker: c
    text: Many Christians see the 'third day' wording as typologically anticipating the Messiah's resurrection, though the verse directly speaks of the people's restoration.
    reason: cross_reference
  - marker: d
    text: Or 'live in his presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이틀 뒤에 우리를 소생시키시며, 셋째 날에 우리를 일으키시리니 — 우리가 그의 앞에서 살게 하시려는 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이틀 뒤에’는 히브리어의 시간 표현이 ‘이틀 안에/이틀 후에’처럼 짧은 간격을 가리킬 수 있다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일으키시리니’는 더 넓게는 ‘회복시키시리니’ 또는 ‘다시 세우시리니’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 많은 그리스도인은 ‘셋째 날’ 표현을 메시아의 부활과 유형적으로 연결해 이해합니다.
    reason: cross_reference
  - marker: d
    text: ‘그의 앞에서’는 ‘그의 임재 안에서’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  english_pob_choice: he will revive us
  chosen_korean: 우리를 소생시키시며
  alternatives_korean:
  - 우리를 살리시며
  - 우리를 회복시키시며
  lexicon: HALOT
  rationale: חיה의 사역형은 단순한 생존보다 생명을 되돌리는 ‘소생’의 뜻이 자연스럽고, 회복 문맥에서도 생명 부여의 힘을 살릴 수 있습니다.
- source_word: מִיֹּמָיִם
  english_pob_choice: after two days
  chosen_korean: 이틀 뒤에
  alternatives_korean:
  - 이틀 후에
  - 이틀 만에
  lexicon: HALOT
  rationale: 시간 부사구는 한국어에서 ‘이틀 뒤에’가 가장 자연스럽고, POB가 제시한 ‘after two days’의 짧은 간격 뉘앙스를 잘 반영합니다.
- source_word: יְקִמֵנוּ
  english_pob_choice: he will raise us up
  chosen_korean: 우리를 일으키시리니
  alternatives_korean:
  - 우리를 들어 올리시리니
  - 우리를 세우시리니
  lexicon: HALOT
  rationale: קום의 사역형은 ‘일으키다/세우다/들어 올리다’가 가능하지만, 앞의 ‘소생’과 평행을 이루며 넘어져 있던 자를 다시 일으키는 이미지가 가장 분명합니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 임재 안에서
  - 그 앞에
  lexicon: HALOT
  rationale: לְפָנָיו는 관계적 거리감을 유지한 채 가장 직접적으로 ‘그의 앞에서’로 옮기는 것이 원문에 충실합니다.
theological_decisions:
- issue: ‘셋째 날’ 표현을 그리스도의 부활 예언으로 명시할지 여부
  chosen_reading: 본문의 직접 대상인 공동체 회복 진술을 유지하고, 본문 안에는 기독론적 해석을 명시하지 않았습니다.
  alternative_readings:
  - 일부 그리스도인은 ‘셋째 날’을 메시아의 부활을 예표하는 표현으로 읽습니다.
  rationale: 히브리어 본문은 1인칭 복수의 회복과 생명을 말하므로, 번역은 우선 원문이 직접 말하는 의미를 보존해야 합니다. 다만 정경적/유형론적 독법의 가능성은 배제하지 않습니다.
  doctrine_reference: 원문 우선 원칙과 유형론적 읽기 가능성의 공존
