  source_fidelity: 히브리어 לְךָ는 에브라임과 유다를 각각 단수로 인격화하여 부르는 표현이므로, 본문의 ‘너희와’는 수를 맞추어 ‘너를’로 고치는 것이 좋습니다. 다만 חַסְדְּכֶם은 복수 소유 접미사를 지니므로 두 대상의 공동된 태도를 가리키는 ‘너희의 충성’은 유지할 수 있습니다. חֶסֶד를 단순한 감정적 ‘사랑’으로 옮기면 이 문맥의 관계적 충실성과 지속성의 의미가 약해질 수 있어, ‘충성’이 더 적절합니다.
  naturalness: 현대 표준어 합쇼체 요구에 맞추어 ‘하겠느냐’를 ‘하겠습니까’로 바꿔야 합니다. ‘내가 너를 어떻게 하겠습니까’는 원문의 탄식하며 숙고하는 수사적 물음을 자연스럽게 살립니다. ‘아침 구름’과 ‘일찍 사라지는 이슬’의 병렬도 자연스럽습니다.
  terminology: 에브라임, 유다는 통용 표기를 유지합니다. חֶסֶד는 본문에서 ‘충성’으로 번역하고, 각주에서 ‘언약적 사랑’ 및 ‘신실함’의 가능한 번역을 제시하여 의미 범위를 보존합니다.
