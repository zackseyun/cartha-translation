  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָ֤ה אֶֽעֱשֶׂה לְּ/ךָ֙ אֶפְרַ֔יִם מָ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יְהוּדָ֑ה וְ/חַסְדְּ/כֶם֙ כַּֽ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֥ים הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
  footnotes:
  - marker: a
    text: Or 'steadfast love' or 'faithfulness' for 'covenant loyalty.' The Hebrew חֶסֶד carries the sense of loyal love within a covenant relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희와 무엇을 하겠느냐, 에브라임아? 내가 너희와 무엇을 하겠느냐, 유다야? 너희의 사랑은 아침 구름 같고, 일찍 사라지는 이슬 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약적 사랑’, ‘신실함’으로 옮길 수 있습니다. 히브리어 חֶסֶד는 언약 관계 안에서의 충성스러운 사랑을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  english_pob_choice: What shall I do with you
  chosen_korean: 내가 너희와 무엇을 하겠느냐
  alternatives_korean:
  - 내가 너희에게 무엇을 하겠느냐
  - 내가 너희를 어떻게 하겠느냐
  lexicon: HALOT
  rationale: 수사적 탄식과 난처함이 담긴 관용구이므로, 자연스러운 현대 한국어로 옮기되 질문의 압박감을 유지했습니다.
- source_word: אֶפְרַיִם / יְהוּדָה
  english_pob_choice: Ephraim / Judah
  chosen_korean: 에브라임 / 유다
  alternatives_korean:
  - 에프라임 / 유다
  lexicon: 고유명사 표기 관행
  rationale: 본문이 직접 지칭하는 고유명사이므로 음역을 유지했고, 한국어 성서에서 널리 쓰이는 에브라임을 따랐습니다.
- source_word: חַסְדְּכֶם
  english_pob_choice: loyalty
  chosen_korean: 사랑
  alternatives_korean:
  - 인애
  - 언약적 충성
  - 신실함
  - 자애
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 뉘앙스를 한국어 한 단어로 완전히 고정하기 어려워, 본문의 문맥상 관계적이고 지속적인 태도를 드러내는 ‘사랑’을 택했습니다. 다만 ‘언약적 사랑’은 길어 이 구절의 리듬을 해치므로 본문은 간결하게 두었습니다.
- source_word: כַּעֲנַן בֹּקֶר / כַּטַּל מַשְׁכִּים הֹלֵךְ
  english_pob_choice: like a morning cloud, and like dew that goes away early
  chosen_korean: 아침 구름 같고, 일찍 사라지는 이슬 같습니다
  alternatives_korean:
  - 아침 구름 같고, 이른 아침에 사라지는 이슬 같습니다
  - 아침 안개 같고, 이내 사라지는 이슬 같습니다
  lexicon: HALOT
  rationale: ‘구름’과 ‘이슬’의 병렬 이미지를 살리면서, מַשְׁכִּים הֹלֵךְ의 빠른 소멸을 ‘일찍 사라지는’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: חֶסֶד의 번역 범위
  chosen_reading: 본문에서는 ‘사랑’으로 옮기되, 언약 관계의 충실함이라는 배경을 유지하는 것으로 이해합니다.
  alternative_readings:
  - 언약적 사랑
  - 신실함
  - 인애
  rationale: 호세아서의 문맥은 단순한 감정이 아니라 하나님과의 관계 안에서 지속되어야 할 태도를 전제합니다. 그러나 이 절에서는 그 의미를 지나치게 해설적으로 풀기보다, 짧은 비유와 대비되도록 간명하게 처리했습니다.
  doctrine_reference: 번역 철학 §3, §5
