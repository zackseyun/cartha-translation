source:
  edition: WLC
  text: גִּלְעָ֕ד קִרְיַ֖ת פֹּ֣עֲלֵי אָ֑וֶן עֲקֻבָּ֖ה מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/008.yaml
  text: Gilead is a city of evildoers[a], tracked with blood.
  footnotes:
  - marker: a
    text: Or 'stained with blood,' 'marked by blood,' or more literally 'tracked from blood.' The Hebrew expression is rare and difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗은 악을 행하는 자들의 성읍이며, 피에 얽혀 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 희귀하고 어려운 표현으로, ‘피로 더럽혀진’, ‘피로 표시된’, 또는 더 문자적으로 ‘피에서 추적된’ 정도로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  english_pob_choice: Gilead
  chosen_korean: 길르앗
  alternatives_korean:
  - 길리드
  lexicon: HALOT
  rationale: 고유 지명은 원문을 음역하는 것이 가장 적절하며, 한국어 성서 관용형에 맞춰 길르앗으로 옮겼습니다.
- source_word: קִרְיַת
  english_pob_choice: city of
  chosen_korean: 성읍
  alternatives_korean:
  - 도성
  - 도시
  lexicon: HALOT
  rationale: קִרְיַת은 앞의 지명과 결합해 ‘~의 성읍’이라는 소유 관계를 이루므로, 현대 문어에서 자연스러운 ‘성읍’이 적절합니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: evildoers
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 악인들
  - 죄악을 짓는 자들
  lexicon: HALOT
  rationale: פֹּעֲלֵי는 ‘행하는 자들’이고 אָוֶן은 여기서 도덕적 악/불의를 가리키므로, 원문 구조를 살려 ‘악을 행하는 자들’로 옮겼습니다.
- source_word: עֲקֻבָּה מִדָּם
  english_pob_choice: tracked with blood
  chosen_korean: 피에 얽혀 있습니다
  alternatives_korean:
  - 피로 더럽혀져 있습니다
  - 피로 뒤덮여 있습니다
  - 피로 찍혀 있습니다
  lexicon: HALOT
  rationale: 희귀하고 어려운 표현이므로, 영어 POB가 제시한 ‘tracked with blood’의 흔적/얽힘 이미지를 살려 직역과 의미를 함께 유지했습니다.
theological_decisions:
- issue: 희귀 표현 עֲקֻבָּה מִדָּם의 이미지 처리
  chosen_reading: 폭력과 유혈이 그 땅에 깊게 얽혀 있다는 뜻으로, ‘피에 얽혀 있습니다’로 다소 압축해 옮겼습니다.
  alternative_readings:
  - ‘피로 더럽혀져 있습니다’
  - ‘피의 흔적이 남아 있습니다’
  - ‘피로 찍혀 있습니다’
  rationale: 본문은 단순한 오염보다 폭력의 누적된 흔적을 강하게 시사하므로, 한국어에서도 그 불편한 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: Hosea 6:8의 예언적 심판 선언
- issue: ‘성읍’의 선택
  chosen_reading: קִרְיַת을 ‘성읍’으로 옮겨 단순한 지리 정보가 아니라 공동체 전체의 도덕적 상태를 드러내도록 했습니다.
  alternative_readings:
  - ‘도시’
  - ‘마을’
  rationale: 예언 문맥에서 지명은 지역 전체에 대한 평가를 담으므로, 보다 성경적이고 공동체적 뉘앙스가 있는 ‘성읍’이 적합합니다.
  doctrine_reference: 예언서의 집단적 책망과 심판
