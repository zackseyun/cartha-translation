source:
  edition: WLC
  text: בְּ/בֵית֙ יִשְׂרָאֵ֔ל רָאִ֖יתִי שעריריה שָׁ֚ם זְנ֣וּת לְ/אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
  footnotes:
  - marker: a
    text: Or 'an appalling thing.' The Hebrew term denotes something shocking or atrocious.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is prostitution in Ephraim' or 'there is whoredom of Ephraim.' The Hebrew phrase is compressed, and the relation marked by 'to/for Ephraim' can be expressed in several ways.
    reason: alternative_reading
  - marker: c
    text: Or 'Israel is defiled' or 'Israel has become unclean.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 집안에서 나는 한 끔찍한 일을 보았습니다[a]. 거기에는 에브라임의 음행이 있습니다[b]. 이스라엘은 더럽혀졌습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소름 끼치는 일’입니다. 히브리어는 충격적이거나 극악한 대상을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에브라임 안에 음행이 있습니다’ 또는 ‘에브라임에 음행이 있습니다’로 옮길 수 있습니다. 히브리어 구문은 압축되어 있어 에브라임과 음행의 관계를 여러 방식으로 풀 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘이스라엘은 부정하게 되었습니다’ 또는 ‘이스라엘은 스스로를 더럽혔습니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  english_pob_choice: In the house of Israel
  chosen_korean: 이스라엘 집안에서
  alternatives_korean:
  - 이스라엘의 집에서
  - 이스라엘 가문에서
  lexicon: HALOT
  rationale: בְּ + בֵית은 단순한 지리보다 공동체/가문 이미지를 살리는 표현이므로, ‘이스라엘 집안’으로 옮겨 covenant-family 뉘앙스를 보존했습니다.
- source_word: שעריריה
  english_pob_choice: a horrible thing
  chosen_korean: 한 끔찍한 일
  alternatives_korean:
  - 한 끔찍한 것
  - 한 아찔한 일
  - 한 가증한 일
  lexicon: HALOT
  rationale: 어근이 지시하는 충격성과 도덕적 혐오를 현대 한국어로 자연스럽게 살리기 위해 ‘끔찍한 일’을 택했습니다.
- source_word: זְנוּת
  english_pob_choice: prostitution
  chosen_korean: 음행
  alternatives_korean:
  - 매춘
  - 음란
  - 간음
  lexicon: HALOT
  rationale: 호세아의 핵심 비유인 언약 불성실을 드러내면서도, 한국어에서 지나치게 직설적이거나 협소한 ‘매춘’보다 예언서 문맥에 익숙한 ‘음행’이 더 균형적입니다.
- source_word: נִטְמָא
  english_pob_choice: has defiled itself
  chosen_korean: 스스로를 더럽혔습니다
  alternatives_korean:
  - 더럽혀졌습니다
  - 부정하게 되었습니다
  - 더럽혀졌습니다
  lexicon: HALOT
  rationale: 니팔의 결과 상태를 반영하면서도 문맥상 이스라엘의 책임 있는 오염을 드러내기 위해 재귀적 표현을 사용했습니다.
theological_decisions:
- issue: זְנוּת의 번역이 문자적 성적 죄와 비유적 언약 배신 사이의 긴장을 어떻게 보존할지
  chosen_reading: ‘음행’으로 번역해 호세아의 혼인-불성실 비유를 유지하면서, 문자적/비유적 의미를 둘 다 열어 두었습니다.
  alternative_readings:
  - 매춘
  - 음란
  - 간음
  rationale: 이 구절은 단순한 성윤리 진술이 아니라 이스라엘의 언약 배신을 고발하는 예언적 언어이므로, 지나치게 좁거나 현대적 진단어로 환원하지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: נִטְמָא를 단순 상태로 볼지, 책임 있는 자기 오염으로 볼지
  chosen_reading: ‘스스로를 더럽혔습니다’로 옮겨 이스라엘의 능동적 책임을 드러냈습니다.
  alternative_readings:
  - 더럽혀졌습니다
  - 부정하게 되었습니다
  rationale: 문맥상 오염은 외부에서 우연히 덮인 상태가 아니라 이스라엘의 행위와 불성실의 결과이므로, 수동적 진술보다 책임성을 포함한 표현이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
