id: JOS.24.32
reference: Joshua 24:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
  footnotes:
  - marker: a
    text: Or 'parcel of the field.' The Hebrew term refers to a plot or portion of land.
    reason: lexical_alternative
  - marker: b
    text: '''Qesitahs'' is an ancient term for a unit of value or money; its exact equivalent is uncertain.'
    reason: cultural_note
  - marker: c
    text: Or possibly 'the founder/chief ancestor of Shechem,' if 'father' is used in a broader ancestral sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 이집트에서 가지고 올라온 요셉의 뼈를 그들은 세겜에 묻었습니다. 그곳은 야곱이 세겜의 아버지인 하몰[c]의 아들들에게서 케시타 백 개[a]에 산 밭 한 구획[b]이었습니다. 그 땅은 요셉의 아들들의 상속 재산이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘케시타’는 고대의 가치 또는 화폐 단위입니다. 정확한 성격과 현대적 등가치는 확실하지 않습니다.
    reason: cultural_note
  - marker: b
    text: ‘밭 한 구획’은 히브리어 חלקה의 뜻을 옮긴 것으로, 밭의 일부 또는 토지 한 필지를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘세겜의 아버지’는 히브리어 אֲבִי שְׁכֶם의 직역입니다. ‘아버지’는 문맥에 따라 친부 외에 조상이나 설립자를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת עַצְמ֣וֹת יוֹסֵף
  english_pob_choice: And the bones of Joseph
  chosen_korean: 요셉의 뼈는
  alternatives_korean:
  - 요셉의 유해는
  - 요셉의 남은 것은
  lexicon: HALOT
  rationale: עַצְמוֹת은 문자적으로 ‘뼈들’이므로 구체성을 살려 ‘뼈’로 옮겼습니다. 한국어에서는 주어 표지를 자연스럽게 붙여 문맥을 매끈하게 했습니다.
- source_word: הֶעֱלוּ בְנֵי יִשְׂרָאֵל מִ/מִּצְרַיִם
  english_pob_choice: which the sons of Israel had brought up from Egypt
  chosen_korean: 이스라엘 자손이 이집트에서 가지고 올라온
  alternatives_korean:
  - 이스라엘 자손이 이집트에서 올려 온
  - 이스라엘 사람들이 이집트에서 가져온
  lexicon: HALOT
  rationale: הֶעֱלוּ는 ‘올려오다/가져오다’의 뜻이므로 ‘가지고 올라온’으로 옮겨 출애굽 때의 이전 행동을 드러냈습니다. ‘이스라엘 자손’은 소속과 언약적 표현을 유지합니다.
- source_word: בִ/שְׁכֶם בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה
  english_pob_choice: at Shechem, in the portion of the field
  chosen_korean: 세겜에, 곧 … 밭의 한 부분에
  alternatives_korean:
  - 세겜에, … 밭의 몫에
  - 세겜에서, … 밭의 일부에
  lexicon: HALOT
  rationale: בְּחֶלְקַת הַשָּׂדֶה는 ‘밭의 한 부분/몫’이라는 구체적 토지 표현이므로, 직역성을 살리되 한국어로 자연스럽게 ‘밭의 한 부분’으로 옮겼습니다.
- source_word: בְ/מֵאָ֣ה קְשִׂיטָ֑ה
  english_pob_choice: for a hundred qesitahs
  chosen_korean: 은 일백 개에
  alternatives_korean:
  - 케시타 일백에
  - 일백 케시타에
  lexicon: HALOT
  rationale: קְשִׂיטָה는 정확한 현대 등가가 불확실한 고대 화폐/가치 단위이므로, 본문에는 의미를 과도하게 특정하지 않도록 ‘은 일백 개’로 풀고, 별도 주석 없이도 구매 대가임을 드러내는 쪽을 택했습니다.
- source_word: אֲבִֽי שְׁכֶ֖ם
  english_pob_choice: the father of Shechem
  chosen_korean: 세겜의 아버지 하몰의 아들들에게서
  alternatives_korean:
  - 세겜의 아버지 하몰에게서
  - 세겜의 시조 하몰의 아들들에게서
  lexicon: HALOT
  rationale: אֲבִי שְׁכֶם은 직역하면 ‘세겜의 아버지’이지만, 뒤의 ‘하몰의 아들들’과 함께 읽으면 하몰이 세겜과 연관된 인물로 설명됩니다. 본문은 영어 POB의 문맥을 따라 관계를 보존했습니다.
- source_word: וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה
  english_pob_choice: and it became an inheritance for the sons of Joseph
  chosen_korean: 그것은 요셉의 아들들에게 유산이 되었습니다
  alternatives_korean:
  - 그것은 요셉의 아들들에게 기업이 되었습니다
  - 그것은 요셉의 아들들에게 상속 재산이 되었습니다
  lexicon: HALOT
  rationale: לְנַחֲלָה는 ‘유산/기업/상속 재산’의 범주이지만, 한국어 성서 문맥에서 너무 교회 전통어로만 고정하지 않으면서도 상속성을 살리기 위해 ‘유산’으로 옮겼습니다.
theological_decisions:
- issue: קְשִׂיטָה의 번역 방식
  chosen_reading: 고대 가치 단위를 한국어 일반어 ‘은 일백 개’로 풀어 의미만 전달하고 정확한 환산은 본문에 두지 않았습니다.
  alternative_readings:
  - 케시타 일백
  - 일백 개의 화폐
  rationale: 본문의 핵심은 매매 가격의 실재성이지 정확한 현대 환산이 아니므로, 불확실한 단위를 과도하게 음역해 읽기 부담을 늘리기보다 문맥적 의미를 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy 1, 6
