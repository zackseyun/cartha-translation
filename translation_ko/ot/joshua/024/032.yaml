- from: 그리고 이스라엘 자손이 이집트에서 가지고 올라온 요셉의 뼈는 세겜에, 곧 야곱이 세겜의 아버지 하몰의 아들들에게서 은 일백 개에 산 밭의 한 부분에 묻었습니다. 그것은 요셉의 아들들에게 유산이 되었습니다.[a][b][c]
  to: 이스라엘 자손이 이집트에서 가지고 올라온 요셉의 뼈를 그들은 세겜에 묻었습니다. 그곳은 야곱이 세겜의 아버지인 하몰[c]의 아들들에게서 케시타 백 개[a]에 산 밭 한 구획[b]이었습니다. 그 땅은 요셉의 아들들의 상속 재산이 되었습니다.
  rationale: 불확실한 고대 가치 단위에 ‘은’이라는 특정 물질을 덧붙인 오류를 제거하고, 원문의 어휘적 불확실성을 음역 및 주석으로 보존했습니다. 토지 표현과 마지막 지시어를 현대 한국어에 맞게 명료화했으며, 모든 주석 표지를 해당 어구에 직접 배치했습니다.
