id: JOS.24.14
reference: Joshua 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
  footnotes:
  - marker: a
    text: That is, beyond the Euphrates River.
    reason: cultural_note
  - marker: b
    text: Or 'with integrity and faithfulness'; the Hebrew terms convey wholeness, sincerity, truth, and reliability.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼를 두려워하고, 온전함과 진실함으로 그를 섬기며, 너희 조상들이 강 저편[a]과 이집트에서 섬기던 신들을 버리고, 야훼를 섬기십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧, 강은 유프라테스강을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환과 권면의 시작을 자연스럽게 여는 담화 표지로 ‘이제’가 가장 간결하고 현대적입니다.
- source_word: יְרָאוּ
  english_pob_choice: fear
  chosen_korean: 두려워하고
  alternatives_korean:
  - 경외하고
  - 두려워하며
  lexicon: HALOT
  rationale: 하나님에 대한 언약적 פחד를 완화하지 않기 위해 ‘두려워하다’를 살렸습니다. ‘경외하다’는 의미는 있지만 어조를 다소 누그러뜨립니다.
- source_word: בְּתָמִים וּבֶאֱמֶת
  english_pob_choice: with integrity and faithfulness
  chosen_korean: 온전함과 진실함으로
  alternatives_korean:
  - 완전함과 진실함으로
  - 온전함과 신실함으로
  - 성실함과 진실함으로
  lexicon: HALOT
  rationale: תמים과 אמת의 핵심인 ‘흠 없는 전체성/온전함’과 ‘진실·신뢰성’을 함께 살리기 위해 관용적이면서도 의미를 넓게 담는 표현을 택했습니다.
- source_word: וְהָסִירוּ אֶת אֱלֹהִים
  english_pob_choice: put away the gods
  chosen_korean: 신들을 버리고
  alternatives_korean:
  - 신들을 치우고
  - 신들을 제쳐 두고
  - 신들을 제거하고
  lexicon: HALOT
  rationale: 우상 포기의 결단을 드러내면서도 한국어에서 자연스럽고 분명한 ‘버리다’를 사용했습니다. ‘제거하다’는 대상에 대한 물리적 뉘앙스가 강합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 있는 언약명 יהוה를 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 익숙한 대체 호칭으로 희석하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘fear’의 강도 유지 여부
  chosen_reading: 두려워하다
  alternative_readings:
  - 경외하다
  - 경외심을 품다
  rationale: 이 권면은 단순한 존중이 아니라 언약적 충성과 순종을 동반하는 하나님 두려움을 요구하므로, 더 약한 정서어로 완화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
