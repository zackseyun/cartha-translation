base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
  footnotes:
  - marker: a
    text: Or 'they fought against you.' The Hebrew literally says 'they fought with you,' but the context shows hostile engagement.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 요단 건너편에 사는 아모리 사람의 땅으로 데려갔습니다. 그들이 너희와 싸웠으나 내가 그들을 너희 손에 넘겨주었고, 너희가 그들의 땅을 차지하였으며, 내가 그들을 너희 앞에서 멸망시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 אִתְּכֶם은 문자적으로 ‘너희와’이지만, 문맥상 ‘너희를 향해 싸웠다’는 적대적 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם אֶל אֶרֶץ הָאֱמֹרִי
  english_pob_choice: Then I brought you into the land of the Amorites
  chosen_korean: 내가 너희를 … 땅으로 데려갔습니다
  alternatives_korean:
  - 내가 너희를 … 땅으로 이끌었습니다
  - 내가 너희를 … 땅으로 들어가게 했습니다
  lexicon: HALOT
  rationale: בוא의 히필은 ‘데려가다/들여보내다’의 사역 의미이므로, 단순한 이동보다 인도하여 진입시키는 뜻을 살려 ‘데려갔습니다’로 옮겼습니다.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: who lived beyond the Jordan
  chosen_korean: 요단 건너편에 사는
  alternatives_korean:
  - 요단 건너편에 거주하는
  - 요단 강 건너편에 사는
  lexicon: HALOT
  rationale: 현재분사 יושב는 앞선 명사를 수식하는 설명이므로 ‘사는’으로 자연스럽게 처리하고, 공간 표현은 ‘요단 건너편’으로 보존했습니다.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  english_pob_choice: and they fought with you
  chosen_korean: 그들이 너희와 싸웠으나
  alternatives_korean:
  - 그들이 너희와 싸웠습니다
  - 그들이 너희를 향해 싸웠으나
  lexicon: HALOT
  rationale: אִתְּכֶם는 문자적으로 ‘너희와’이지만 문맥상 적대적 충돌을 뜻하므로, 본문의 관계를 드러내면서도 원문의 전치사를 과도하게 해설하지 않는 형태로 옮겼습니다.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  english_pob_choice: And I gave them into your hand
  chosen_korean: 내가 그들을 너희 손에 넘겨주었고
  alternatives_korean:
  - 내가 그들을 너희 손에 주었고
  - 내가 그들을 너희 권세에 넘겨주었고
  lexicon: HALOT
  rationale: נתן ביד의 관용구를 한국어에서도 ‘손에 넘겨주다’로 살려, 승리와 통제의 뜻을 직접적으로 전달했습니다.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  english_pob_choice: and I destroyed them from before you
  chosen_korean: 내가 그들을 너희 앞에서 멸망시켰습니다
  alternatives_korean:
  - 내가 그들을 너희 앞에서 멸했습니다
  - 내가 그들을 너희 앞에서 없애버렸습니다
  lexicon: HALOT
  rationale: שׁמד는 강한 파괴·멸절의 동사이므로 ‘멸망시키다’로 강도를 보존했고, מִפְּנֵיכֶם는 ‘너희 앞에서’로 직역해 제거의 결과를 분명히 했습니다.
theological_decisions:
- issue: 가나안 정복 언어의 강도 유지
  chosen_reading: ‘넘겨주었고… 차지하였으며… 멸망시켰습니다’처럼 전쟁·파괴의 강한 동사를 그대로 유지했습니다.
  alternative_readings:
  - ‘패배시켰고… 차지했으며… 제거했습니다’처럼 완화된 표현
  rationale: 본문은 야훼의 구체적 역사 행위를 회고하는 진술이므로, 본문이 가진 폭력성과 심판의 강도를 순화하지 않는 것이 원문의 의도에 더 충실합니다.
