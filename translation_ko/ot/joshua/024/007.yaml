source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
  footnotes:
  - marker: a
    text: 'Hebrew has singular pronouns here: ''upon him'' and ''covered him.'' The sense may be collective, referring to Egypt or the Egyptian force; many translations render ''them.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 야훼께 부르짖자, 그분은 너희와 이집트 사람들 사이에 어둠을 두셨고, 바다를 그 위에 임하게 하셔서 그것이 그를 덮었습니다. 너희 눈이 내가 이집트에서 행한 것을 보았고, 너희는 광야에서 여러 날을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 단수 대명사를 사용합니다(‘그 위에’, ‘그를 덮었습니다’). 문맥상 이집트 군대나 이집트 전체를 가리키는 집합적 단수일 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와/주 대체가 아니라 신명 자체를 살려 번역하는 POB 원칙에 따라, 한국어에서도 학술적 표기인 ‘야훼’를 사용합니다.
- source_word: מַאֲפֵל
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 짙은 어둠
  - 흑암
  - 그늘
  lexicon: HALOT
  rationale: 이 단어는 어둠 또는 짙은 어둠을 뜻하지만, 현대 한국어에서 가장 자연스럽고 과도하게 강도를 덧씌우지 않는 표현은 ‘어둠’입니다.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  english_pob_choice: between you and the Egyptians
  chosen_korean: 너희와 이집트 사람들 사이에
  alternatives_korean:
  - 너희와 이집트인들 사이에
  - 너희와 애굽 사람들 사이에
  lexicon: HALOT
  rationale: 직설적인 공간 관계를 살려 ‘사이에’로 옮겼고, POB의 현대적 지명 표기를 따라 ‘이집트 사람들’로 처리했습니다.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  english_pob_choice: your eyes saw
  chosen_korean: 너희 눈이 ... 보았고
  alternatives_korean:
  - 너희가 보았고
  - 너희 눈으로 보았고
  lexicon: HALOT
  rationale: 히브리어의 ‘너희 눈’이라는 강조적 표현을 살리되, 한국어에서는 주어-서술 구조로 자연스럽게 다듬었습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: many days
  chosen_korean: 여러 날
  alternatives_korean:
  - 많은 날
  - 오랜 날들
  - 오랫동안
  lexicon: HALOT
  rationale: 직역 가능한 ‘many days’를 유지하되, 현대 한국어에서 가장 자연스러운 관용으로 ‘여러 날’을 선택했습니다.
theological_decisions:
- issue: 히브리어 단수 대명사(עָלָיו, וַיְכַסֵּהוּ)의 처리
  chosen_reading: 본문 흐름상 ‘그를/그 위에’의 단수 지시를 유지했습니다.
  alternative_readings:
  - 그들을 / 그 위에
  - 이집트 사람들 위에 / 그것이 그들을 덮었습니다
  rationale: 원문은 단수 대명사를 사용하므로, 의미상 집합적 지시가 가능하더라도 이를 평탄화하지 않고 남겨 원문 추적성을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and preservation of source tension'
