- from: 그들이 야훼께 부르짖자, 그분은 너희와 이집트 사람들 사이에 어둠을 두셨고, 바다를 그 위에 임하게 하셔서 그것이 그를 덮었습니다. 너희 눈이 내가 이집트에서 행한 것을 보았고, 너희는 광야에서 여러 날을 지냈습니다.[a]
  to: 그들이 야훼께 부르짖었습니다. 그러자 그분은 너희와 이집트 사람들 사이에 어둠을 두시고, 바다를 그 위로 몰아오셔서 그를 덮으셨습니다.[a] 너희 눈은 내가 이집트에서 행한 일을 보았고, 너희는 광야에서 여러 날을 지냈습니다.
  rationale: 원문의 단수 접미사를 평탄화하지 않고 유지했습니다. 동시에 ‘바다를 그 위로 몰아오셔서’로 עָלָיו의 관계를 자연스럽게 표현하고, 모호한 지시어 ‘그것’을 제거했습니다. ‘너희 눈은’은 히브리어의 강조적 주어를 보존하는 범위 안에서 문장을 다듬은 것입니다.
