  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
  footnotes:
  - marker: a
    text: Or “under the terebinth.” The Hebrew term may refer to a terebinth rather than an oak.
    reason: lexical_alternative
  - marker: b
    text: Or “that was by the sanctuary of the LORD.” The Hebrew preposition can be understood more loosely in context.
    reason: alternative_reading
translation:
  language: ko
  text: 여호수아는 이 말씀들을 하나님의 율법책에 기록하고, 큰 돌 하나를 가져다가 그곳 곧 야훼의 성소에 있는 상수리나무 아래에 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “테레빈나무 아래에”. 히브리어는 여기서 테레빈나무를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “야훼의 성소 곁에 있는”. 히브리어 전치사는 문맥상 더 느슨하게 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: wrote
  chosen_korean: 기록하고
  alternatives_korean:
  - 기록하셨습니다
  - 썼습니다
  lexicon: HALOT
  rationale: כתב은 기본적으로 ‘쓰다’이지만, 여기서는 언약 문서를 책에 남기는 행위이므로 ‘기록하다’가 문맥을 가장 자연스럽게 살립니다.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  english_pob_choice: in the Book of the Law of God
  chosen_korean: 하나님의 율법책에
  alternatives_korean:
  - 하나님의 율법서에
  - 하나님의 율법의 책에
  lexicon: HALOT
  rationale: ספר는 ‘책’으로 옮기고, תורה는 이 언약 맥락에서 ‘율법’이 적절하므로 한국어 성경 문체에 맞게 ‘율법책’으로 압축해 옮겼습니다.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  english_pob_choice: he took a large stone
  chosen_korean: 큰 돌 하나를 가져다가
  alternatives_korean:
  - 큰 돌을 가져다가
  - 큰 돌 한 개를 가져다가
  lexicon: HALOT
  rationale: אבן גְּדוֹלָה는 물리적 크기를 가리키므로 ‘큰 돌’이 자연스럽고, 동작의 연속성을 살리기 위해 ‘가져다가’로 연결했습니다.
- source_word: וַיְקִימֶהָ
  english_pob_choice: set it up
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 세워 두었습니다
  - 세워 놓았습니다
  lexicon: HALOT
  rationale: קום의 사역형은 돌을 서 있게 하는 뜻이므로, 기념석을 세우는 장면을 간결하게 드러내는 ‘세웠습니다’가 적절합니다.
- source_word: תַּחַת הָאַלָּה
  english_pob_choice: under the oak
  chosen_korean: 상수리나무 아래에
  alternatives_korean:
  - 떡갈나무 아래에
  - 참나무 아래에
  lexicon: HALOT
  rationale: אַלָּה는 정확한 수종이 불확실하므로, POB의 ‘oak’ 취지를 따라 널리 이해되는 ‘상수리나무’로 옮기고 아래말 구조를 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 신명기 이름 יהוה를 직접 쓰므로, 본문에서는 대체 호칭이 아니라 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּמִקְדַּשׁ יְהוָה의 관계
  chosen_reading: 야훼의 성소에 있는
  alternative_readings:
  - 야훼의 성소 곁에 있는
  - 야훼의 성소 안에 있는
  rationale: ב는 기본적으로 ‘안에/에서’의 의미를 가지며, POB의 주해처럼 나무가 성소 공간에 속해 있음을 본문이 가장 직접적으로 말하므로 ‘에 있는’으로 옮겼습니다.
  doctrine_reference: source syntax and POB textual note
