id: JOS.24.10
reference: Joshua 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
  footnotes:
  - marker: a
    text: Or, more formally, 'and he surely blessed you.' The Hebrew uses an emphatic construction ('blessing he blessed').
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 발람의 말을 들으려 하지 않았고, 그는 참으로 너희를 축복하였습니다[a]. 나는 너희를 그의 손에서 건져 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘축복하다’라는 동사와 같은 어근의 부정사 절대형을 함께 써서, 그가 너희를 축복한 사실을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיתִי לִשְׁמֹעַ לְבִלְעָם
  english_pob_choice: I was not willing to listen to Balaam
  chosen_korean: 발람의 말을 듣고자 하지 않았고
  alternatives_korean:
  - 발람에게 귀를 기울이고자 하지 않았고
  - 발람의 말을 들으려 하지 않았고
  lexicon: HALOT
  rationale: אָבָה는 단순한 능력보다 의지·동의의 거절을 나타내므로, 한국어에서는 '듣고자 하지 않았다'로 의지의 부정을 살렸습니다. לשמע לְ-의 대상은 자연스럽게 '발람의 말'로 풀었습니다.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  english_pob_choice: he indeed blessed you
  chosen_korean: 그가 실제로 당신들을 축복하였으므로
  alternatives_korean:
  - 그가 참으로 당신들을 축복하였으므로
  - 그가 당신들을 분명히 축복하였으므로
  lexicon: HALOT
  rationale: 히브리어의 동사+부정사 절대형은 단순 반복보다 강한 강조를 나타내므로, '실제로/참으로'로 그 강조를 옮겼습니다. 본문 흐름상 발람의 의도와 달리 축복이 이루어졌다는 사실을 드러냅니다.
- source_word: וָאַצִּל אֶתְכֶם מִיָּדוֹ
  english_pob_choice: I delivered you from his hand
  chosen_korean: 그의 손에서 당신들을 건져냈습니다
  alternatives_korean:
  - 그의 손에서 당신들을 구해냈습니다
  - 그의 손에서 당신들을 구출했습니다
  lexicon: HALOT
  rationale: נצל은 '붙들린 상태에서 건져내다/구해내다'의 뉘앙스가 있어, 언약사적 맥락을 살리면서도 현대 한국어에서 자연스러운 '건져내다'를 선택했습니다. '그의 손'은 권세·지배의 관용구를 직역해 보존했습니다.
theological_decisions:
- issue: 하나님의 주권과 발람의 축복 주어 문제
  chosen_reading: 축복의 주어는 발람으로 두되, 그 축복이 하나님의 뜻에 의해 제압·전도되었음을 문맥으로 드러냈습니다.
  alternative_readings:
  - '''제가 당신들을 축복하였습니다''처럼 화자를 하나님으로 직접 돌리는 읽기'
  - 축복의 행위를 단순 과거 사실로만 처리하는 읽기
  rationale: 히브리어의 3인칭 남성 단수 동사는 발람을 가장 자연스러운 주어로 가리키며, 앞뒤 문맥은 하나님이 발람의 저주 의도를 무력화하셨음을 강조합니다. 따라서 원문의 문법을 유지하면서도 하나님의 주권이 약화되지 않도록 번역했습니다.
  doctrine_reference: 민수기 23–24장 / 수 24장의 구속사적 회고
