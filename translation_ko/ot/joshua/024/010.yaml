  source_fidelity: 히브리어의 אָבִיתִי는 의지·동의의 거절이므로 ‘들으려 하지 않았고’가 잘 반영합니다. וַיְבָרֶךְ בָּרוֹךְ의 주어도 문법상 발람으로 유지해야 합니다. 다만 초안의 ‘축복하였으므로’는 단순 접속인 וַ를 인과 관계로 바꾸어, 발람의 축복이 구출의 직접 원인인 것처럼 만들 수 있습니다.
  naturalness: ‘당신들’은 현대 한국어에서 다소 부자연스럽거나 대립적인 호칭으로 들릴 수 있습니다. 성경의 복수 청자를 가리키는 ‘너희’가 이 문맥에서 더 자연스럽습니다. ‘나는/너희’와 합쇼체 종결은 함께 사용할 수 있습니다.
