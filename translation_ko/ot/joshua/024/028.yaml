  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֤ח יְהוֹשֻׁ֨עַ֙ אֶת הָ/עָ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
  footnotes:
  - marker: a
    text: Or 'each one to his inheritance.' The Hebrew uses the masculine singular אִישׁ distributively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 백성을 보내어 각기 자기의 기업으로 가게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ는 여기서 분배적으로 쓰였으므로, 한국어로는 '각기' 또는 '각 사람'으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: sent ... away
  chosen_korean: 보내어 가게 하였습니다
  alternatives_korean:
  - 보냈습니다
  - 해산시켰습니다
  lexicon: HALOT
  rationale: 파생형 שׁלח의 여기서는 회중을 흩어 떠나게 하는 뜻이므로, 단순한 '보냈습니다'보다 '보내어 가게 하였습니다'가 해산의 의미를 더 분명하게 살립니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 문맥상 이스라엘 회중 전체를 가리키므로, 한국어에서는 집합적 의미를 자연스럽게 드러내는 '백성'이 적절합니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각기
  alternatives_korean:
  - 각 사람
  - 각자
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 분배적 용법을 한국어에서는 성별을 전면화하지 않는 '각기'로 옮겨, 분배 의미를 자연스럽게 전달합니다.
- source_word: לְנַחֲלָתוֹ
  english_pob_choice: to his inheritance
  chosen_korean: 자기의 기업으로
  alternatives_korean:
  - 자기의 상속으로
  - 자기에게 분배된 몫으로
  lexicon: HALOT
  rationale: נַחֲלָה는 여호수아서에서 언약적 땅 분배를 뜻하므로, 교회적 전통어이면서도 토지 유업의 의미를 보존하는 '기업'이 가장 적합합니다.
theological_decisions:
- issue: נַחֲלָה의 의미를 '기업'으로 옮길지 여부
  chosen_reading: '''기업''은 단순 재산이 아니라 야훼께서 분배하신 언약적 유업을 가리킵니다.'
  alternative_readings:
  - '''상속''으로 번역해 법적 유산을 강조함'
  - '''소유지''로 번역해 토지성을 강조함'
  rationale: 여호수아 24장의 맥락에서는 땅의 분배가 단순 소유 이전에 하나님의 약속 성취라는 신학적 무게를 가지므로, 한국어 성경에서 익숙한 '기업'이 원문의 언약적 함의를 가장 잘 보존합니다.
  doctrine_reference: 언약, 기업, 약속의 성취
