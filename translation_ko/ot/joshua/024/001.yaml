  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 וַיִּקְרָא לְ는 별도의 소집 행위이므로 ‘불러 모았으며’보다 ‘불렀습니다/소집했습니다’가 더 직접적입니다. וַיִּתְיַצְּבוּ는 ‘하나님 앞에 섰습니다’로 충분히 정확하며, ‘나아와’는 원문에 명시되지 않은 이동을 다소 보탭니다.
