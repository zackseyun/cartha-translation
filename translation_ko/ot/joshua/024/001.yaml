  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
  footnotes:
  - marker: a
    text: Or 'at Shechem'; the Hebrew form is directional, literally 'toward Shechem.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its leaders' for 'its heads.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'before God'; this may imply appearing at a sanctuary or covenantal sacred site.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 여호수아가 이스라엘의 모든 지파를 세겜으로 모으고, 이스라엘의 장로들과 그들의 우두머리들, 재판관들, 관리들을 불러 모았으며, 그들은 하나님 앞에 나아와 섰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세겜에서’. 히브리어 형태는 방향을 나타내어 문자적으로는 ‘세겜을 향하여’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 지도자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘하나님 앞에’라고 되어 있으며, 이는 성소나 언약적 예배 장소에서의 출현을 함축할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  english_pob_choice: gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 소집하고
  - 모아
  lexicon: HALOT
  rationale: 여기서는 사람들을 한 자리에 모으는 서술이므로 ‘모으고’가 자연스럽고, 군중을 공식적으로 부르는 뉘앙스도 유지합니다.
- source_word: שְׁכֶמָה
  english_pob_choice: to Shechem
  chosen_korean: 세겜으로
  alternatives_korean:
  - 세겜에서
  - 세겜을 향해
  lexicon: HALOT
  rationale: 히브리어 방향어미를 살려 이동의 방향을 나타내어 ‘세겜으로’로 옮겼습니다.
- source_word: רָאשָׁיו
  english_pob_choice: its heads
  chosen_korean: 그들의 우두머리들
  alternatives_korean:
  - 그들의 머리들
  - 그들의 지도자들
  lexicon: HALOT
  rationale: 직역하면 ‘그것의 머리들’이지만, 한국어에서는 집합적 지도층을 드러내는 ‘우두머리들’이 원문 이미지와 기능을 함께 살립니다.
- source_word: שֹׁטְרָיו
  english_pob_choice: its officers
  chosen_korean: 관리들
  alternatives_korean:
  - 장교들
  - 직원들
  lexicon: HALOT
  rationale: 문맥상 군사보다는 행정·조정 역할의 직분이므로 현대 한국어에서 가장 무난한 ‘관리들’을 택했습니다.
- source_word: וַיִּתְיַצְּבוּ לִפְנֵי הָאֱלֹהִים
  english_pob_choice: they presented themselves before God
  chosen_korean: 하나님 앞에 나아와 섰습니다
  alternatives_korean:
  - 하나님 앞에 섰습니다
  - 하나님 앞에 자신을 드러냈습니다
  lexicon: HALOT
  rationale: 히트파엘의 공식적 ‘나아와 서다/자신을 세우다’는 뜻을 살려, 예배적·법정적 장면을 함께 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: לִפְנֵי הָאֱלֹהִים의 장면성
  chosen_reading: ‘하나님 앞에’라고 직역해, 회중이 신적 임재 앞에서 공식적으로 선 장면을 본문에 유지했습니다.
  alternative_readings:
  - ‘성소에서’로 풀이하는 해석
  - ‘여호와 앞에’로 정리하는 해석
  rationale: 본문은 위치를 직접 말하지 않고 ‘하나님 앞’이라고만 하므로, 장소 추론을 본문에 넣지 않고 독자가 원문의 긴장을 보도록 유지했습니다.
  doctrine_reference: 'Translation philosophy §§1, 3, 5; Contested terms: יְהוָה YHWH → the LORD'
