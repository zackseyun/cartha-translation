  terminology: ‘세겜’, ‘이스라엘의 장로들’, ‘재판관들’, ‘관리들’, ‘하나님 앞에’는 적절합니다. רָאשָׁיו는 직역적 신체 은유를 한국어에 억지로 재현하기보다 ‘그 수령들’로 옮기고 ‘지도자들’을 각주 대안으로 유지하는 것이 자연스럽고 원문의 직분 구별도 보존합니다.
