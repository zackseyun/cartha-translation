    text: ‘여리고 사람들’은 또는 ‘여리고의 주인들’로도 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘여리고의 주인들/소유자들’을 뜻하며, 그 도시의 통치자들이나 유력자들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 민족 목록을 ‘여리고 사람들’과 함께 ‘싸웠다’의 병렬 주어로 옮겨 원문의 열거 구조를 보존했습니다. 이때 본문에서 논쟁적인 בַּעֲלֵי יְרִיחוֹ는 포괄적인 ‘여리고 사람들’로 두고, 통치자·유력자라는 어휘적 가능성은 각주에 남겼습니다. ‘하지만’은 원문과 동일한 명시적 접속사가 아니라 앞선 적대 행위와 하나님의 승리 부여를 한국어 문맥에서 자연스럽게 연결할 뿐이며, 의미를 변경하지 않습니다.
