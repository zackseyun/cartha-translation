base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
  footnotes:
  - marker: a
    text: Or 'the lords of Jericho.' The Hebrew expression literally means 'masters/owners of Jericho' and may refer to the city's rulers or leading men rather than all its inhabitants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여러분은 요단을 건너 여리고에 이르렀고, 여리고의 사람들[a]이 여러분과 싸웠습니다. 곧 아모리 사람들, 브리스 사람들, 가나안 사람들, 헷 사람들, 그르가스 사람들, 히위 사람들, 여부스 사람들입니다. 그리고 내가 그들을 여러분의 손에 넘겨주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여리고의 주인들’로도 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘여리고의 주인/소유자들’을 뜻하며, 도시의 통치자들 또는 유력자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  english_pob_choice: you crossed the Jordan
  chosen_korean: 요단을 건너
  alternatives_korean:
  - 요단 강을 건너
  - 요단을 지나
  lexicon: HALOT
  rationale: עבר의 핵심 이미지는 강을 건너는 이동이며, 현대 한국어에서는 간결한 ‘건너’가 자연스럽고 원문의 구체성을 유지합니다.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  english_pob_choice: came to Jericho
  chosen_korean: 여리고에 이르렀고
  alternatives_korean:
  - 여리고에 왔고
  - 여리고에 도착했고
  - 여리고로 들어갔고
  lexicon: HALOT
  rationale: אֶל과 결합한 בוא는 ‘도착하다/이르다’의 뉘앙스를 잘 나타내며, ‘들어갔다’보다 원문이 말하는 도착점 중심 의미를 보존합니다.
- source_word: בַּעֲלֵי יְרִיחוֹ
  english_pob_choice: the men of Jericho
  chosen_korean: 여리고의 사람들
  alternatives_korean:
  - 여리고의 남자들
  - 여리고의 주인들
  - 여리고의 지도자들
  lexicon: HALOT
  rationale: בעלי는 문자적으로 ‘주인들/소유자들’이지만, 문맥상 도시의 주민 집단을 가리키는 표현으로 읽는 것이 가장 무리 없으며, 성별을 과도하게 한정하지 않는 ‘사람들’이 본문 기능을 잘 드러냅니다.
- source_word: בְּיֶדְכֶם
  english_pob_choice: into your hand
  chosen_korean: 여러분의 손에 넘겨주었습니다
  alternatives_korean:
  - 여러분의 손에 주었습니다
  - 여러분의 손에 맡겼습니다
  - 여러분의 권세 아래 두었습니다
  lexicon: HALOT
  rationale: ‘손에’라는 성서적 관용을 유지하되, 한국어에서는 ‘넘겨주다’가 אויב을 통제권 아래 두는 의미를 더 분명하게 전달합니다.
theological_decisions:
- issue: 하나님의 직접 화행과 전쟁 승리의 귀속
  chosen_reading: ‘내가 그들을 여러분의 손에 넘겨주었습니다’로 번역해, 승리가 하나님의 직접 행위로 서술된 점을 분명히 했습니다.
  alternative_readings:
  - 그들을 여러분의 손에 허락하였습니다
  - 그들을 여러분이 이기게 하였습니다
  rationale: 원문은 단순 허용이 아니라 1인칭으로 전쟁 상대를 건네주는 주권적 행위를 말하므로, 그 긴장을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: divine sovereignty in conquest narrative
