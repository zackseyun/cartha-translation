    issue: 민족 목록을 ‘곧 …입니다’로 별도 문장 처리함
    rationale: 원문은 여리고의 사람들과 뒤따르는 민족들을 ‘싸웠다’의 적대 주어 목록으로 열거합니다. 현 문장은 뒤의 민족들이 여리고 사람들을 설명하는 동격이라는 인상을 강하게 주므로, 병렬 접속으로 고치는 것이 안전합니다.
  - severity: low
    issue: ‘그르가스’ 표기
    rationale: 의미 오류는 아니지만, 한국어 성서 용례에서는 ‘기르가스’가 더 일반적인 표기입니다.
  revised_text: 그때 여러분은 요단을 건너 여리고에 이르렀습니다. 여리고 사람들과 아모리 사람들, 브리스 사람들, 가나안 사람들, 헷 사람들, 기르가스 사람들, 히위 사람들, 여부스 사람들이 여러분과 싸웠지만, 내가 그들을 여러분의 손에 넘겨주었습니다.
  revised_footnotes:
