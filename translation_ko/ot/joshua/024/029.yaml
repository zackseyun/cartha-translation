  - 백십 년을 살고
  lexicon: HALOT
  rationale: 히브리어 나이 표현을 간결하고 문어적인 한국어로 옮겨, 서술의 종결 지점을 자연스럽게 표시했습니다.
theological_decisions:
- issue: עֶבֶד יְהוָה의 신분 표현
  chosen_reading: ‘야훼의 종’으로 유지하여, 여호수아의 죽음을 봉사 직함이 붙은 명예로운 서술로 읽게 했습니다.
  alternative_readings:
  - ‘야훼의 노예’로 더 강하게 옮김
  - 단순히 ‘야훼께 속한 사람’으로 완화
  rationale: 본문은 여호수아를 야훼께 충실히 봉사한 지도자로 요약하며, 여기서의 עֶבֶד는 억압적 예속보다 언약적 섬김을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — עֶבֶד/δοῦλος'
