  lexicon: HALOT
  rationale: 여기서는 bonded status보다 존귀한 봉사 직함의 성격이 강하므로, 한국어에서도 ‘종’을 유지해 원문의 평가적 뉘앙스를 살렸습니다.
- source_word: יְהוָה
