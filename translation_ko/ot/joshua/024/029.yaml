base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
  footnotes:
  - marker: a
    text: Or, 'after these events.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'servant of the LORD'; 'slave of the LORD' is possible lexically, but here the title emphasizes honored service rather than bonded status.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 있은 뒤에[a] 눈의 아들 여호수아, 곧 야훼의 종이[b] 백십 세에 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이 사건들 뒤에.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 종’; ‘야훼의 노예’로도 어휘상 번역할 수 있으나, 여기서는 예속 신분보다 존귀한 섬김의 직함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: And it happened after these things
