base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
  footnotes:
  - marker: a
    text: Or, 'after these events.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'servant of the LORD'; 'slave of the LORD' is possible lexically, but here the title emphasizes honored service rather than bonded status.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 있은 뒤에 눈의 아들 여호수아, 야훼의 종이 백십 세에 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이런 일들 뒤에.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי / אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: And it happened after these things
  chosen_korean: 이 일들이 있은 뒤에
  alternatives_korean:
  - 이런 일들이 있은 뒤에
  - 이 사건들 후에
  lexicon: HALOT
  rationale: 히브리어의 시간 전환 표현을 한국어 서술문으로 자연스럽게 옮기되, 원문의 사건 연쇄를 유지했습니다.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: Joshua son of Nun
  chosen_korean: 눈의 아들 여호수아
  alternatives_korean:
  - 여호수아, 눈의 아들
  - 눈의 아들, 여호수아
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 한국어 관용 순서로 옮겨 식별 정보를 분명하게 했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 종이
  - 야훼의 노예
  lexicon: HALOT
  rationale: 여기서는 bonded status보다 존귀한 봉사 직함의 성격이 강하므로, 한국어에서도 ‘종’을 유지해 원문의 평가적 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유 신명 표기를 그대로 반영해, 본문에서 인물의 신분을 규정하는 언약명의 직접성을 보존했습니다.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  english_pob_choice: being one hundred and ten years old
  chosen_korean: 백십 세에
  alternatives_korean:
  - 백십 살에
  - 백십 년을 살고
  lexicon: HALOT
  rationale: 히브리어 나이 표현을 간결하고 문어적인 한국어로 옮겨, 서술의 종결 지점을 자연스럽게 표시했습니다.
theological_decisions:
- issue: עֶבֶד יְהוָה의 신분 표현
  chosen_reading: ‘야훼의 종’으로 유지하여, 여호수아의 죽음을 봉사 직함이 붙은 명예로운 서술로 읽게 했습니다.
  alternative_readings:
  - ‘야훼의 노예’로 더 강하게 옮김
  - 단순히 ‘야훼께 속한 사람’으로 완화
  rationale: 본문은 여호수아를 야훼께 충실히 봉사한 지도자로 요약하며, 여기서의 עֶבֶד는 억압적 예속보다 언약적 섬김을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — עֶבֶד/δοῦλος'
