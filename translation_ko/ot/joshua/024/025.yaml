id: JOS.24.25
reference: Joshua 24:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he established for them a statute and a judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 여호수아가 백성과 언약을 맺고, 세겜에서 그들에게 율례와 법도를 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘언약을 자르다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 율례와 판결을 세웠다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺고
  alternatives_korean:
  - 언약을 끊고
  - 언약을 세우고
  lexicon: WLC/HALOT
  rationale: כרת ברית는 문자적으로는 ‘언약을 자르다’이지만, 한국어에서는 관용적으로 ‘언약을 맺다’가 가장 자연스럽고 의미를 정확히 전달합니다.
- source_word: לָעָם
  english_pob_choice: with the people
  chosen_korean: 백성과
  alternatives_korean:
  - 백성을 위해
  - 백성에게
  lexicon: WLC/HALOT
  rationale: 전치사 ל의 관계를 문맥상 언약 상대를 나타내는 방식으로 살려, ‘백성과’로 옮기는 것이 가장 분명합니다.
- source_word: חֹק וּמִשְׁפָּט
  english_pob_choice: a statute and an ordinance
  chosen_korean: 율례와 법도를
  alternatives_korean:
  - 규례와 판결을
  - 법령과 재판을
  lexicon: WLC/HALOT
  rationale: 두 법률 용어의 병렬을 살리되, 한국어 성경어휘에서 비교적 직접적인 대응을 택해 ‘율례와 법도’로 옮겼습니다. 여기서 מִשְׁפָּט은 추상적 ‘정의’보다 제정된 법적 규범의 뜻이 강합니다.
- source_word: בִּשְׁכֶם
  english_pob_choice: there in Shechem
  chosen_korean: 세겜에서
  alternatives_korean:
  - 그곳 세겜에서
  - 세겜 안에서
  lexicon: WLC/HALOT
  rationale: 지명은 표준 음역인 ‘세겜’을 따랐고, מקום 부사적 용법은 한국어에서 자연스러운 처소 조사 ‘-에서’로 충분히 나타납니다.
theological_decisions:
- issue: 언약 체결의 주체와 범위
  chosen_reading: 본문의 표면대로 여호수아가 백성과 언약을 맺은 것으로 옮기고, 더 विस्त한 신학적 설명은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 여호수아가 백성을 위해 언약을 갱신했다
  - 여호수아가 야훼의 언약을 재확인했다
  rationale: 히브리어 본문은 이 절에서 여호수아의 행위를 직접 진술할 뿐, 별도의 해설을 요구하지 않습니다. 따라서 본문이 말하는 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: 본문 표면 의미 보존
