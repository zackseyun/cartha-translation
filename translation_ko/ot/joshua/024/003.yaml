    rationale: 두 표지가 문장 끝에 함께 있어 각각 ‘강’과 ‘씨/후손’ 중 무엇을 설명하는지 즉시 분명하지 않습니다. 해당 어구 뒤에 배치하는 편이 적절합니다.
