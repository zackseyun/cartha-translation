    rationale: 원문의 사역형은 하나님이 아브라함을 이끄신 행위를 말합니다. ‘다니게 하다’도 가능한 범위이나, ‘인도하다’가 행위자와 사역적 의미를 더 충실히 드러냅니다.
  - severity: low
