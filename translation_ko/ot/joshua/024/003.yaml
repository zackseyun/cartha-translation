id: JOS.24.3
reference: Joshua 24:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
  footnotes:
  - marker: a
    text: '''The River'' likely refers to the Euphrates.'
    reason: cultural_note
  - marker: b
    text: Or 'his descendants'; Hebrew 'his seed/offspring' is a collective singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 나는 너희 조상 아브라함을 그 강[a] 저편에서 데려와, 그를 가나안 온 땅을 두루 인도하고, 그의 후손[b]을 많게 하여 그에게 이삭을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 강’은 이 문맥에서 유프라테스 강을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그의 자손들’; 히브리어 ‘씨/후손’은 집합적 단수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִיכֶם
  english_pob_choice: your father
  chosen_korean: 너희의 조상
  alternatives_korean:
  - 너희의 아버지
  - 너희의 선조
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희의 아버지’이지만, 아브라함이 청중의 직접적 부친이 아니라 언약적 조상을 가리키므로 한국어에서는 ‘조상’이 자연스럽고 오해를 줄입니다.
- source_word: מֵעֵבֶר הַנָּהָר
  english_pob_choice: from beyond the River
  chosen_korean: 강 저편에서
  alternatives_korean:
  - 강 건너편에서
  - 그 강 너머에서
  lexicon: HALOT
  rationale: 원문은 정관사 있는 ‘강’(the River)을 사용하므로 한국어도 특정 강을 암시하는 표현을 살리되, 본문에는 과도한 특정화 없이 ‘강 저편’으로 옮겼습니다.
- source_word: וָאוֹלֵךְ אֹתוֹ בְּכָל אֶרֶץ כְּנָעַן
  english_pob_choice: and I led him through all the land of Canaan
  chosen_korean: 가나안 온 땅을 두루 다니게 하고
  alternatives_korean:
  - 가나안 온 땅을 따라 이끌고
  - 가나안 온 땅을 두루 인도하고
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 살리면서, 이동의 결과가 드러나는 한국어로 ‘두루 다니게 하다’가 가장 자연스럽습니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 씨
  alternatives_korean:
  - 그의 자손
  - 그의 후손
  lexicon: HALOT
  rationale: כמו/seed의 집합적 단수 의미를 유지하기 위해 ‘씨’를 택했습니다. 이는 영어 POB가 ‘offspring’로 남긴 집합적 뉘앙스를 더 직접적으로 반영합니다.
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  english_pob_choice: and gave him Isaac
  chosen_korean: 이삭을 그에게 주었습니다
  alternatives_korean:
  - 그에게 이삭을 주었습니다
  - 이삭을 그에게 허락하였습니다
  lexicon: HALOT
  rationale: נתן + 간접목적어 + 직접목적어의 구조를 따라, 이삭이 아브라함에게 ‘주어진’ 선물이라는 의미를 보존했습니다.
theological_decisions:
- issue: ‘너희의 아버지’의 한국어 처리
  chosen_reading: ‘조상’으로 옮겨 언약적 호칭을 유지했습니다.
  alternative_readings:
  - ‘아버지’로 직역
  - ‘선조’로 일반화
  rationale: 이 구절은 혈연 의미보다 언약 공동체를 향한 조상 호칭이 핵심이므로, 한국어에서 자연스러운 ‘조상’이 본문의 수사적 효과를 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘강’의 특정성
  chosen_reading: 본문에는 ‘강 저편’만 두고, 특정 강명은 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘유프라테스 강 저편’으로 구체화
  - 주석 없이 ‘강’만 사용
  rationale: 히브리어는 고유명사보다 정관사 있는 보통명사 ‘강’을 사용하므로, 본문은 원문을 따르고 특정 식별은 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1
