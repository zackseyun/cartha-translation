revisions:
- from: 그러므로 내가 너희의 조상 아브라함을 강 저편에서 데려와 가나안 온 땅을 두루 다니게 하고 그의 씨를 번성하게 하였으며 이삭을 그에게 주었습니다.[a][b]
  to: 그때에 나는 너희 조상 아브라함을 그 강[a] 저편에서 데려와, 그를 가나안 온 땅을 두루 인도하고, 그의 후손[b]을 많게 하여 그에게 이삭을 주었습니다.
  rationale: 서술 접속을 인과 접속으로 오해하지 않도록 ‘그때에’로 고쳤습니다. 하나님의 인도하심을 나타내는 사역형을 ‘인도하고’로 옮겼고, 현대 한국어에서 오해 없이 집합적 의미를 전달하는 ‘후손’을 사용했습니다. 원문의 특정한 ‘강’은 본문에서 유지하고, 추정되는 지명은 각주에서만 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:08:14Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그러므로’는 히브리어 서술 접속 와우가 나타내는 순차적 전개를 인과관계로 바꾸므로 수정이 필요합니다. 또한 ‘다니게 하고’보다 ‘인도하고’가 הִפְעִיל(사역형)의 ‘이끌다’와 목적어 아브라함을 더 직접적으로 반영합니다. ‘후손’은 זַרְעוֹ의 집합적 단수 의미를 자연스러운 현대 한국어로 보존합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, ‘그 강’, ‘온 땅을 두루 인도하고’, ‘후손을 많게 하여’의 연결이 자연스럽습니다. 각주 표지를 해당 어구 바로 뒤에 배치하여 참조 대상도 분명히 했습니다.
  terminology: ‘너희 조상 아브라함’은 히브리어의 언약적 ‘너희의 아버지’ 관용을 한국어에서 자연스럽게 전달합니다. 본문에서는 원문의 정관사 표현을 따라 ‘그 강’으로 두고, 유프라테스라는 식별은 유보적 각주로 처리했습니다.
