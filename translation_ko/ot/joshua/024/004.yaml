source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
  footnotes:
  - marker: a
    text: Or 'Mount Seir' or 'the mountains of Seir.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and Jacob and his sons went down to Egypt.' The Hebrew conjunction is simply 'and'; the main text uses 'but' to make the contrast explicit in English.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 이삭에게 야곱과 에서를 주었으며, 에서에게는 세일 산지[a]를 주어 그것을 차지하게 하였습니다. 그러나[b] 야곱과 그의 아들들은 이집트로 내려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘세일 산’으로도 옮길 수 있으며, 문맥에 따라 ‘세일의 산들’을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 접속사는 단순히 ‘그리고’입니다. 한국어 본문은 대조를 분명히 하기 위해 ‘그러나’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן לְיִצְחָק
  english_pob_choice: I gave Isaac
  chosen_korean: 나는 이삭에게 주었으며
  alternatives_korean:
  - 나는 이삭에게 주었습니다
  - 나는 이삭에게 주었고
  lexicon: WLC נתן
  rationale: נתן의 기본 의미를 따라 ‘주다’로 옮기되, 반복되는 하나님의 행위를 자연스럽게 연결하기 위해 과거 서술형으로 처리했습니다.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  english_pob_choice: Jacob and Esau
  chosen_korean: 야곱과 에서를
  alternatives_korean:
  - 야곱과 에서를
  - 야곱과 에서를 주었습니다
  lexicon: 고유명사
  rationale: 두 이름은 한국어 성서 관용에 따라 음역했고, 목적격 표지는 한국어에서 자연스럽게 생략했습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: the hill country of Seir
  chosen_korean: 세일 산지
  alternatives_korean:
  - 세일 산
  - 세일의 산지
  - 세일 산악지대
  lexicon: HALOT
  rationale: 이 표현은 단일 산봉우리보다 에서에게 준 지리적 영역을 가리키므로, ‘산지’가 POB의 영어 해석을 가장 잘 반영합니다.
- source_word: לָרֶשֶׁת
  english_pob_choice: to possess
  chosen_korean: 차지하게 하였습니다
  alternatives_korean:
  - 소유하게 하였습니다
  - 차지하도록 하였습니다
  - 소유하도록 하였습니다
  lexicon: WLC ירש
  rationale: ירש은 단순한 소유보다 상속·점유를 포함하는 ‘차지하다/차지하게 하다’가 더 적절하여, 땅을 기업으로 받는 뉘앙스를 살렸습니다.
- source_word: וְיַעֲקֹב וּבָנָיו יָרְדוּ מִצְרָיִם
  english_pob_choice: but Jacob and his sons went down to Egypt
  chosen_korean: 그러나 야곱과 그의 아들들은 이집트로 내려갔습니다
  alternatives_korean:
  - 그리고 야곱과 그의 아들들은 이집트로 내려갔습니다
  - 야곱과 그의 아들들은 이집트로 내려갔습니다
  lexicon: WLC ירד
  rationale: 히브리어 접속사는 단순 ‘그리고’이지만, 문맥상 에서의 상속과 야곱 가족의 이집트 이주의 대조가 분명하므로 ‘그러나’로 옮겨 POB의 대조 표시를 반영했습니다.
theological_decisions:
- issue: ‘주다/차지하게 하다’로 표현된 하나님의 주권적 분배
  chosen_reading: 하나님이 족속과 땅을 분배하시는 주권적 행위를 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 역사 서술로만 읽기
  - 소유권 이전을 약화시켜 옮기기
  rationale: 본문은 족속의 배치와 땅의 분배를 하나님의 행위로 제시하므로, 이를 약화시키지 않고 직접적인 서술로 유지했습니다.
  doctrine_reference: 창세기 12–36장 문맥의 언약사 이해
