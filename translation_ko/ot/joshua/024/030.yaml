id: JOS.24.30
reference: Joshua 24:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
  footnotes:
  - marker: a
    text: Or 'in the border of his inheritance.' The Hebrew term can denote either a boundary or the territory enclosed by it; here it likely refers to the area of Joshua's allotted inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 그의 기업의 영역 안에[a], 곧 에브라임 산지에 있는 딤낫세라흐에 장사했습니다. 그곳은 가아스 산 북쪽에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 기업의 경계에.” 히브리어 용어는 경계선이나 그 경계로 둘러싸인 영토를 모두 가리킬 수 있으며, 여기서는 여호수아에게 분배된 기업의 영역을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: And they buried him
  chosen_korean: 그리고 그를 ... 장사했는데
  alternatives_korean:
  - 그리고 그를 묻었는데
  - 그리고 그를 장사했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol을 자연스럽게 이어 주고, אֹתוֹ의 3인칭 목적어를 분명히 반영했습니다. '장사하다'는 본문처럼 시신을 매장하는 문맥을 비교적 직접적으로 드러냅니다.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  english_pob_choice: within the territory of his inheritance
  chosen_korean: 그의 기업의 경계 안에
  alternatives_korean:
  - 그의 기업의 경계 안에서
  - 그의 기업의 지역 안에
  - 그의 기업 안에
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 선 경계뿐 아니라 그 경계로 둘러싸인 구역을 뜻할 수 있어, 영어 POB의 설명을 따라 '경계 안에'로 옮겼습니다. נַחֲלָה는 여호수아의 분배받은 땅이라는 의미를 살려 '기업'으로 번역했습니다.
- source_word: בְּתִמְנַת סֶרַח אֲשֶׁר בְּהַר אֶפְרָיִם
  english_pob_choice: at Timnath-serah, which is in the hill country of Ephraim
  chosen_korean: 에브라임 산지에 있는 딤낫세라흐에
  alternatives_korean:
  - 에브라임 산지의 딤낫세라흐에
  - 에브라임 산지 안에 있는 딤낫세라흐에
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, בְּהַר אֶפְרָיִם은 단일 산이 아니라 '산지'라는 지리적 의미가 분명하므로 그렇게 옮겼습니다.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  english_pob_choice: north of Mount Gaash
  chosen_korean: 가아스 산 북쪽입니다
  alternatives_korean:
  - 가아스 산의 북쪽입니다
  - 가아스 산 북편입니다
  lexicon: HALOT
  rationale: מִצְּפוֹן은 위치 관계를 나타내므로 '북쪽'으로 간결하게 옮겼고, לְהַר גָּעַשׁ은 지명으로서 '가아스 산'을 유지했습니다.
theological_decisions:
- issue: 장례 동사의 한국어 선택
  chosen_reading: '''장사하다''를 사용해 단순한 매장보다 장례적 매장 행위를 분명히 했습니다.'
  alternative_readings:
  - '''묻다''로 더 평이하게 옮기는 방식'
  rationale: 여호수아의 매장이라는 서술적, 역사적 문맥에서 장례 행위를 직접 드러내는 표현이 더 적절합니다.
  doctrine_reference: 본문의 역사서 서술과 매장 관행
- issue: בִּגְבוּל의 의미 범위
  chosen_reading: '''경계 안에''로 옮겨 경계선보다 그 안의 영토를 포괄하는 의미를 살렸습니다.'
  alternative_readings:
  - '''경계에'''
  - '''영토 안에'''
  rationale: 영어 POB의 주석처럼 이 단어는 단순 경계선이 아니라 분배된 기업의 영역을 가리킬 수 있어, 본문이 의도하는 토지 분배의 의미를 유지하는 것이 중요합니다.
  doctrine_reference: 기업/분배지 개념
