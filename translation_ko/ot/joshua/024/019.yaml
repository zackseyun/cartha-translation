base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''holy God,'' with plural morphology in the words for ''God'' and ''holy'' but singular sense: literally, ''Gods holy he.'' The singular pronoun shows the reference is to the one God of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'He will not bear/carry away your transgressions and your sins.' The Hebrew idiom is commonly used for forgiveness.
    reason: alternative_reading
translation:
  language: ko
  text: 여호수아가 백성에게 말했습니다. "여호와를 섬길 수 없습니다. 그분은 거룩하신 하나님이시며, 질투하시는 하나님이십니다. 그분은 여러분의 허물과 죄를 용서하지 않으실 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘거룩한 하나님’인데, ‘하나님’과 ‘거룩하다’에 복수 형태가 있으나 의미는 단수입니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구는 문자적으로는 ‘들어 옮기다’이지만, 여기서는 보통 ‘용서하다’의 뜻으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  english_pob_choice: are not able
  chosen_korean: 섬길 수 없습니다
  alternatives_korean:
  - 섬기지 못합니다
  - 섬길 능력이 없습니다
  lexicon: HALOT
  rationale: יכל의 핵심은 능력/가능성의 부재이므로, 자연스러운 한국어로도 단순 부정보다 ‘~할 수 없습니다’가 가장 직접적으로 대응합니다.
- source_word: לַעֲבֹד
  english_pob_choice: to serve
  chosen_korean: 섬길
  alternatives_korean:
  - 예배할
  - 봉사할
  lexicon: HALOT
  rationale: עבד는 단순 예배보다 더 넓은 언약적 ‘섬김’을 뜻하므로, 한국어도 ‘섬기다’로 옮겨 예배 행위로만 좁히지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 본문의 한국어 교회용례와 POB의 직역 취지를 함께 고려하면, 신명기·여호수아 문맥에서 통용되는 인명형 ‘여호와’가 가장 읽기 자연스럽습니다.
- source_word: פִשְׁעֲכֶם וּלְחַטֹּאותֵיכֶם
  english_pob_choice: your transgressions and your sins
  chosen_korean: 여러분의 허물과 죄
  alternatives_korean:
  - 여러분의 범죄와 죄
  - 여러분의 반역과 죄
  lexicon: HALOT
  rationale: פשע는 언약을 어기는 ‘허물/범죄’의 결을 가지며, חטאת는 일반적인 ‘죄’이므로, 짝을 살리면서도 현대 한국어에서 자연스러운 ‘허물과 죄’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים הוּא의 복수 형태와 단수 지시
  chosen_reading: ‘거룩하신 하나님이시며’로 단수 의미를 분명히 했습니다.
  alternative_readings:
  - 형태를 살려 ‘거룩한 신들’처럼 직역하는 방식
  - ‘거룩하신 분’으로 신명성 표현을 완화하는 방식
  rationale: 동사의 호응과 문맥상 이 표현은 이스라엘의 한 분 하나님을 가리키므로, 복수 형태는 문법적 특징으로 두되 한국어 본문은 단수 신앙고백으로 읽히게 해야 합니다.
  doctrine_reference: 단일신 신앙과 원문 문법의 긴장 보존
- issue: לֹא יִשָּׂא의 의미
  chosen_reading: ‘용서하지 않으실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘지지 않으실 것입니다’
  - ‘들어 옮기지 않으실 것입니다’
  rationale: ‘짐을 지다/들어 옮기다’의 관용이 배경에 있지만, 이 경고의 요지는 언약적 죄를 가볍게 넘어가며 용서하지 않으신다는 뜻이므로 한국어에서는 직접적으로 ‘용서하다’가 가장 명료합니다.
  doctrine_reference: 관용구의 신학적 의미를 드러내는 번역
