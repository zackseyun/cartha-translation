  source_fidelity: ‘그러므로’는 히브리어 접속사 וַ의 역사적 순접을 인과 관계로 바꾸므로 제거하는 것이 좋습니다. 또한 원문의 ‘홍해’는 추격의 종착/장면과 연결되므로, ‘홍해까지 왔습니다’보다 ‘홍해까지 뒤쫓았습니다’가 추격 동사의 의미를 더 직접적으로 보존합니다. 2인칭 복수의 언약사적 직접 호칭은 유지해야 합니다.
