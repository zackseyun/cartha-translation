id: JOS.24.6
reference: Joshua 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
  footnotes:
  - marker: a
    text: 'Or, more literally, ''the Sea of Reeds.'' Hebrew: yam suph.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 내가 너희 조상들을 이집트에서 이끌어 내었습니다. 너희는 바다에 이르렀고, 이집트 사람들은 병거와 기병을 거느리고 너희 조상들을 홍해[a]까지 뒤쫓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 더 직역하면, ‘갈대 바다’. 히브리어: 얌 수프.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹוצִיא
  english_pob_choice: Then I brought ... out
  chosen_korean: 내가 ... 이끌어 내었고
  alternatives_korean:
  - 내가 ... 데리고 나왔고
  - 내가 ... 끌어내었고
  lexicon: HALOT
  rationale: 히필형 יצא는 ‘밖으로 이끌어 내다/데리고 나오다’의 뜻이므로, 출애굽의 능동적 인도 행위를 살려 ‘이끌어 내다’로 옮겼습니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들
  alternatives_korean:
  - 너희 아버지들
  - 너희 선조들
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘너희 아버지들’이지만, 여기서는 집단적 조상 지칭이므로 한국어에서 자연스러운 ‘조상들’로 옮겼습니다. 남성형 표지를 가족-조상 표지로 유지했습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  - 이집트로부터
  lexicon: HALOT
  rationale: 지명은 현대 표기법에 따라 ‘이집트’를 사용했습니다. 본문에 이미 ‘이끌어 내다’가 있어 ‘밖으로’는 중복하지 않았습니다.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  english_pob_choice: and you came to the sea
  chosen_korean: 너희가 바다에 이르렀으며
  alternatives_korean:
  - 너희가 바다에 왔으며
  - 너희가 바다에 도달했으며
  lexicon: HALOT
  rationale: 2인칭 복수의 직접 주소를 살렸고, 이동의 종착을 나타내는 בוא는 한국어에서 ‘이르다’가 가장 자연스럽습니다.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם אַחֲרֵי
  english_pob_choice: and the Egyptians pursued
  chosen_korean: 이집트 사람들이 ... 뒤쫓아
  alternatives_korean:
  - 이집트가 ... 뒤쫓아
  - 이집트인들이 ... 추격하여
  lexicon: HALOT
  rationale: 동사의 복수 주어를 반영해 ‘이집트 사람들’로 옮겼습니다. אַחֲרֵי의 추적 의미는 한국어 동사 ‘뒤쫓다’에 통합했습니다.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  english_pob_choice: with chariots and horsemen
  chosen_korean: 병거와 기병을 거느리고
  alternatives_korean:
  - 병거와 기병과 함께
  - 병거와 말을 탄 병사들을 거느리고
  lexicon: HALOT
  rationale: 군사적 수단과 동원을 자연스럽게 드러내기 위해 수단 표현을 ‘거느리고’로 처리했습니다. רכב은 ‘병거’, פָּרָשִׁים은 ‘기병’이 가장 직접적입니다.
- source_word: יַם סוּף
  english_pob_choice: the Red Sea
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대 바다
  - 갈대의 바다
  lexicon: HALOT
  rationale: 본절은 전통적으로 알려진 구속사적 지명을 가리키므로, 본문은 한국어 성경에서 널리 인지되는 ‘홍해’를 유지했습니다.
theological_decisions:
- issue: 대상 세대에 대한 2인칭 직접 화법 유지
  chosen_reading: ‘너희가 바다에 이르렀으며’로 현재 청중을 조상 사건에 직접 참여시키는 화법을 유지했습니다.
  alternative_readings:
  - ‘그들이 바다에 이르렀으며’로 3인칭화
  - ‘너희 조상들이 바다에 이르렀으며’로 명시적 환원
  rationale: 여호수아의 설교는 현재의 이스라엘을 언약사 속 조상들과 동일시하므로, 2인칭을 유지해야 수사적 힘이 살아납니다.
  doctrine_reference: Translation philosophy §3, §4
- issue: יַם סוּף의 지명 처리
  chosen_reading: 본문에는 ‘홍해’를 두고, 별도 각주는 두지 않았습니다.
  alternative_readings:
  - ‘갈대 바다’
  - ‘갈대의 바다’
  rationale: 이 절에서 핵심은 지명 자체보다 출애굽 사건의 역사적 기억이므로, 한국어에서 인지도가 높은 전통 지명을 본문에 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
