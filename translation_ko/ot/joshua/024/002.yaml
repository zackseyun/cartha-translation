source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
  footnotes:
  - marker: a
    text: Or “across the River,” likely referring to the Euphrates.
    reason: cultural_note
  - marker: b
    text: Hebrew “your fathers”; that is, your forefathers or ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 온 백성에게 말했습니다. “이스라엘의 하나님이신 야훼께서 이렇게 말씀하십니다. ‘너희 조상들[a], 곧 아브라함의 아버지이며 나홀의 아버지인 데라는 옛적에 강 건너편[b]에 살았고, 다른 신들을 섬겼습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 아버지들’입니다. 여기서는 너희 선조들, 곧 조상들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강 건너편’은 문자적으로 ‘강 너머’ 또는 ‘강 저편’이며, 관례적으로 유프라테스강을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל כָּל הָעָם
  english_pob_choice: And Joshua said to all the people
  chosen_korean: 여호수아가 온 백성에게 말했습니다
  alternatives_korean:
  - 여호수아가 모든 백성에게 말했습니다
  - 여호수아가 온 회중에게 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol은 한국어에서 자연스러운 과거 서술로 옮기고, הָעָם은 이 자리에서 모인 공동체를 가리키므로 ‘온 백성’이 무난합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 사자문 공식은 한국어에서 ‘이렇게 말씀하십니다’가 가장 자연스럽고, 신명은 POB 기본 원칙에 따라 야훼로 옮겼습니다.
- source_word: בְּעֵבֶר הַנָּהָר
  english_pob_choice: beyond the River
  chosen_korean: 강 건너편
  alternatives_korean:
  - 강 너머
  - 강 저편
  lexicon: HALOT
  rationale: 히브리어 관용구의 지리적 방향성을 살리되, 한국어 본문에서는 자연스러운 관용 표현으로 옮겼습니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들
  alternatives_korean:
  - 너희 아버지들
  - 너희 선조들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형 ‘fathers’이지만, 한국어에서는 이 문맥의 세대적 의미를 드러내는 ‘조상들’이 오해를 줄입니다. 다만 의미를 약화시키지 않도록 복수성을 유지했습니다.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: and they served other gods
  chosen_korean: 그들이 다른 신들을 섬겼습니다
  alternatives_korean:
  - 그들이 다른 신들을 섬기고 있었습니다
  - 그들이 다른 신들을 예배했습니다
  lexicon: HALOT
  rationale: עבד는 신들과의 관계에서 ‘섬기다’가 가장 직접적이며, ‘예배하다’는 한국어 교회어의 해석을 덧붙일 수 있어 본문에 더 가까운 표현을 택했습니다.
theological_decisions:
- issue: אֱלֹהֵי יִשְׂרָאֵל의 한국어 처리
  chosen_reading: 이스라엘의 하나님
  alternative_readings:
  - 이스라엘의 신
  - 이스라엘의 하나님이신 야훼
  rationale: קונ스트럭트 구문은 언약적 식별을 나타내므로, 한국어에서도 관계를 분명히 하는 ‘이스라엘의 하나님’을 유지했습니다. 이어지는 고유명 야훼와 함께 읽히며 야훼의 정체성을 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: divine name and covenant identification'
