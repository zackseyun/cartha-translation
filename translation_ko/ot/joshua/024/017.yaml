  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of slaves, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
  footnotes:
  - marker: a
    text: Or 'from the house of slavery.' The Hebrew is literally 'from the house of slaves.'
    reason: lexical_alternative
  - marker: b
    text: Or 'these great wonders' or 'these great miracles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼 우리 하나님께서 우리와 우리 조상들을 이집트 땅, 곧 노예들의 집에서 올라오게 하신 분이시며, 우리 눈앞에서 이 큰 표징들을 행하셨고, 우리가 걸어온 모든 길에서 우리를 지켜 주셨으며, 우리가 지나간 모든 백성들 가운데서도 그러하신 분이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘노예들의 집’입니다. 문맥상 이집트의 강제 종속 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, אֱלֹהֵינוּ는 언약적 소유격인 우리 하나님으로 자연스럽게 살렸습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 노예들의 집
  alternatives_korean:
  - 노예 상태의 집
  - 노예의 집
  - 종들의 집
  lexicon: HALOT
  rationale: בֵּית עֲבָדִים의 구체적 사회 상태를 드러내기 위해 직역적이고도 자연스러운 노예들의 집을 택했습니다. 다만 한국어에서는 영어의 house of slaves를 그대로 옮긴 어색함을 피하기 위해 소유격적 표현으로 다듬었습니다.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  english_pob_choice: these great signs
  chosen_korean: 이 큰 표징들
  alternatives_korean:
  - 이 큰 이적들
  - 이 큰 기적들
  - 이 큰 징표들
  lexicon: HALOT
  rationale: אוֹת은 표징/징조의 의미를 기본으로 하므로, 한국어 교회어에서 흔한 이적보다 원문 의미를 더 직접적으로 반영하는 표징들을 사용했습니다.
- source_word: וַיִּשְׁמְרֵנוּ בְּכָל הַדֶּרֶךְ
  english_pob_choice: kept us in all the way in which we walked
  chosen_korean: 우리가 걸어온 모든 길에서 우리를 지켜 주셨으며
  alternatives_korean:
  - 우리가 걸어간 모든 길에서 우리를 지켜 주셨으며
  - 우리의 모든 길에서 우리를 보살피셨으며
  lexicon: HALOT
  rationale: שׁמר는 여기서 보호하며 지키는 뜻이므로 지켜 주셨으며로 옮겼고, בְּכָל הַדֶּרֶךְ는 여행의 전 과정을 나타내는 모든 길에서로 처리했습니다.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  english_pob_choice: among all the peoples through whose midst we passed
  chosen_korean: 우리가 지나간 모든 백성들 가운데서도
  alternatives_korean:
  - 우리가 지나간 모든 민족들 가운데서도
  - 우리가 그 가운데를 지나간 모든 백성들 사이에서도
  lexicon: HALOT
  rationale: עַמִּים은 민족/백성 모두 가능하지만, 문맥상 집단적 주민들을 가리키므로 백성들을 택했고, בְּקִרְבָּם의 가운데/한가운데 뉘앙스는 가운데서도로 자연스럽게 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 구절은 여호와 표기가 아닌 하나님의 언약 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 야훼를 유지했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: בֵּית עֲבָדִים의 사회적 강도
  chosen_reading: 노예들의 집
  alternative_readings:
  - 노예 상태의 집
  - 노예의 집
  - 종들의 집
  rationale: 출애굽을 회고하는 언약 고백에서 עֲבָדִים는 추상적 노예제가 아니라 실제로 구속된 신분을 드러내므로, 이를 약화하지 않는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1; bonded-status terminology policy
