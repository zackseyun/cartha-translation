  source_fidelity: 원문의 주어 야훼 우리 하나님과 세 관계절(이끌어 올리심, 큰 표징들을 행하심, 길과 여러 백성 가운데서 지키심)을 대체로 충실히 반영합니다. 그러나 끝의 ‘그러하신 분이기 때문입니다’는 앞의 ‘지켜 주셨으며’의 목적어를 생략한 채 원문에 없는 포괄적 서술을 덧붙여, 마지막 절의 ‘우리’를 지키셨다는 뜻이 흐려집니다.
  naturalness: ‘우리가 지나간 모든 백성들 가운데서도 그러하신 분’은 현대 표준 한국어에서 지시 대상이 불명확하고 부자연스럽습니다. ‘그 가운데에서도 우리를 지켜 주셨기’로 명시하면 원문의 통사와 뜻이 자연스럽게 살아납니다. ‘이끌어 올리신’은 출애굽 문맥의 עלה(올라오게 하다)를 더 직접적으로 드러냅니다.
