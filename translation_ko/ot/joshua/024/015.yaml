revisions:
- from: 그러나 만일 야훼를 섬기는 것이 여러분의 눈에 악하게 보인다면, 오늘 여러분을 위해 누구를 섬길지 선택하십시오. 곧, 강 건너편에서 여러분의 조상들이 섬기던 신들이든지, 여러분이 그 땅에 거주하는 아모리 사람들의 신들이든지 선택하십시오. 그러나 나와 내 집은 야훼를 섬기겠습니다.[a][b][c][d]
  to: 그러나 여러분이 보기에 야훼를 섬기는 것이 악하다면, 오늘 스스로 섬길 이를 택하십시오. 곧 강 건너편에서 여러분의 조상들이 섬기던 신들이든지, 여러분이 그 땅에 거주하는 아모리 사람들의 신들이든지 택하십시오. 그러나 나와 내 집은 야훼를 섬기겠습니다.[a][b][c][d]
  rationale: ‘스스로’를 사용하여 לָכֶם의 결단적 뉘앙스를 회복하고, ‘여러분이 보기에’로 히브리어 관용구의 평가 주체를 명확히 했습니다. 나머지 선택지, 반복되는 ‘섬기다’, 야훼의 이름, 그리고 화자의 결단 선언은 원문의 구조와 현대 합쇼체에 맞게 유지했습니다.
