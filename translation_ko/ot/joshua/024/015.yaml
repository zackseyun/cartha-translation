base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
  footnotes:
  - marker: a
    text: Or 'it seems wrong to you' or 'it is displeasing to you'; literally, 'it is evil in your eyes.'
    reason: lexical_alternative
  - marker: b
    text: '''The River'' refers to the Euphrates.'
    reason: cultural_note
  - marker: c
    text: 'Or ''your ancestors served''; Hebrew: ''your fathers served.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'my household.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분이 보기에 야훼를 섬기는 것이 악하다면, 오늘 스스로 섬길 이를 택하십시오. 곧 강 건너편에서 여러분의 조상들이 섬기던 신들이든지, 여러분이 그 땅에 거주하는 아모리 사람들의 신들이든지 택하십시오. 그러나 나와 내 집은 야훼를 섬기겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘여러분의 눈에 악하다’이며, ‘여러분이 보기에 옳지 않다’ 또는 ‘마음에 들지 않다’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강’은 유프라테스를 가리키는 지리적 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 ‘여러분의 아버지들’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내 집안’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע בְּעֵינֵיכֶם
  english_pob_choice: it is evil in your eyes
  chosen_korean: 여러분의 눈에 악하게 보인다면
  alternatives_korean:
  - 여러분의 눈에 나쁘다면
  - 여러분에게 옳지 않다면
  - 여러분의 눈에 불쾌하다면
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 이미지를 살리면서, 현대 한국어에서 자연스럽고도 도덕적 평가를 유지하는 표현으로 옮겼습니다.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  english_pob_choice: to serve / whom you will serve / we will serve
  chosen_korean: 섬기다 / 섬길지 / 섬기겠습니다
  alternatives_korean:
  - 섬기다 / 섬길지 / 섬길 것입니다
  - 예배하다 / 예배할지 / 예배하겠습니다
  lexicon: HALOT
  rationale: 문맥상 우상 혹은 야훼에 대한 언약적 충성을 가리키므로, 반복되는 동사를 모두 ‘섬기다’로 유지해 수사적 반복과 결단의 대비를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기는 ‘야훼’로 음역해 고유 이름을 보존했습니다. ‘주님’으로 대체하면 이름이 호칭으로 흡수됩니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 여러분의 조상들이
  alternatives_korean:
  - 여러분의 아버지들이
  - 여러분의 선조들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어에서는 혈통적 선대 전체를 가리키는 ‘조상들’이 자연스럽고 오해가 적습니다. 본문이 남성형을 유지하는 점은 footnote로 남겼습니다.
- source_word: בְּעֵבֶר הַנָּהָר
  english_pob_choice: beyond the River
  chosen_korean: 강 건너편에서
  alternatives_korean:
  - 강 너머에서
  - 강의 저편에서
  - 유프라테스 강 건너편에서
  lexicon: HALOT
  rationale: 지리적 관용구를 한국어로 자연스럽게 옮기되, 본문은 간결하게 하고 구체적 강명은 주석에서 보완하도록 했습니다.
- source_word: בְּאַרְצָם
  english_pob_choice: in whose land you are dwelling
  chosen_korean: 그 땅에 거주하는
  alternatives_korean:
  - 그 땅에 살고 있는
  - 그들의 땅에 사는
  - 그 땅에 머무는
  lexicon: HALOT
  rationale: 현재 거주 상태를 나타내는 표현으로 ‘거주하는’을 택해, 단순한 생활보다 정착성과 문맥의 무게를 살렸습니다.
theological_decisions:
- issue: וְאָנֹכִי וּבֵיתִי נַעֲבֹד אֶת יְהוָה의 집합적 결단
  chosen_reading: 나와 내 집은 야훼를 섬기겠습니다
  alternative_readings:
  - 나와 내 집은 야훼를 섬길 것입니다
  - 나와 내 집은 야훼를 섬기기로 하겠습니다
  rationale: 화자는 개인적 결단을 대표적으로 선언하지만, 장차 지속될 충성을 포함하므로 미래형보다 의지적 서약을 드러내는 ‘섬기겠습니다’가 한국어에서 가장 자연스럽습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
- issue: 끝부분의 대조 구조 유지
  chosen_reading: 그러나 … 선택하십시오 … 그러나 나와 내 집은
  alternative_readings:
  - 그리고 … 선택하십시오 … 그리고 나와 내 집은
  - 만일 … 선택하십시오 … 그리고 나와 내 집은
  rationale: 히브리어의 조건-대비-결단 구조를 보존해야 본문의 호소력이 유지되므로, 두 번의 ‘그러나’로 대조를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
