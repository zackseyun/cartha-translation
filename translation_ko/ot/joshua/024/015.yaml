  - severity: medium
    issue: ‘여러분의 눈에 악하게 보인다면’
    rationale: 히브리어 관용구는 청자들의 평가를 뜻합니다. ‘악하게 보이다’는 한국어에서 객관적으로 악한 모습이라는 의미로 기울 수 있으므로 ‘여러분이 보기에 … 악하다면’이 더 명료하고 충실합니다.
