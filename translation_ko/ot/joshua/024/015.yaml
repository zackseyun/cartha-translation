review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 반복되는 עבד를 ‘섬기다’로 일관되게 옮기고, יְהוָה를 ‘야훼’로 옮긴 점은 원문에 충실합니다. 다만 ‘여러분을 위해’는 לָכֶם의 재귀적·결단적 뉘앙스에 맞지 않아 ‘스스로’로 고쳐야 합니다. 또한 ‘악하게 보인다면’은 한국어에서 야훼를 섬기는 행위가 객관적으로 악해 보인다는 뜻으로 읽히기 쉬우므로, 평가 주체를 분명히 하는 표현이 더 정확합니다.
  naturalness: 초안은 대체로 합쇼체의 현대 표준 한국어이지만, ‘여러분을 위해 누구를 섬길지 선택하십시오’는 부자연스럽고 의미가 다소 어긋납니다. ‘오늘 스스로 섬길 이를 택하십시오’가 자연스럽습니다. 선택지 병렬도 ‘…이든지 …이든지’로 정리하면 원문의 수사 구조가 분명해집니다.
  terminology: ‘야훼’, ‘섬기다’, ‘아모리 사람들’, ‘조상들’은 적절합니다. ‘조상들’은 אֲבוֹתֵיכֶם의 포괄적 한국어 대응으로 가능하며, 문자적 ‘아버지들’은 주석으로 보완할 수 있습니다. ‘내 집’은 가구·식구를 포함할 수 있으므로 대안 주석을 유지하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘여러분을 위해’
