  to: 이스라엘은 여호수아가 살아 있는 동안과, 여호수아보다 더 오래 살았으며 야훼께서 이스라엘을 위해 행하신 모든 일[a]을 알았던 장로들이 살아 있는 동안 내내 야훼를 섬겼습니다.
  rationale: 원문의 병렬 시간 구문과 장로들을 수식하는 두 관계절을 현대 표준 한국어의 자연스러운 문장 구조로 재배열했습니다. 의미를 추가하거나 신학적으로 확대하지 않았으며, 어휘 대안 각주는 해당 명사구에 직접 연결했습니다.
