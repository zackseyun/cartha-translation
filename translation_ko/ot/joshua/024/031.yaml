id: JOS.24.31
reference: Joshua 24:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
  footnotes:
  - marker: a
    text: Or 'all the acts of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 여호수아가 살아 있는 동안과, 여호수아보다 더 오래 살았으며 야훼께서 이스라엘을 위해 행하신 모든 일[a]을 알았던 장로들이 살아 있는 동안 내내 야훼를 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 모든 행위’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד ... אֶת יְהוָה
  english_pob_choice: served Yahweh
  chosen_korean: 야훼를 섬겼습니다
  alternatives_korean:
  - 야훼를 예배했습니다
  - 야훼를 섬기고 예배했습니다
  lexicon: HALOT
  rationale: עבד는 여호와에 대한 언약적 섬김을 가리키며 예배보다 넓은 의미이므로, POB의 'served'에 맞춰 '섬기다'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 POB 원칙에 따라 인격적 고유명사로 드러나게 '야훼'로 일관되게 표기했습니다.
- source_word: כֹּל יְמֵי
  english_pob_choice: all the days of
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 평생 동안
  - 있는 내내
  lexicon: HALOT
  rationale: 히브리어의 시간 관용구를 자연스러운 현대 한국어로 살리되, 반복되는 기간의 전면성을 유지했습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 원로들
  - 늙은 사람들
  lexicon: HALOT
  rationale: 이스라엘 공동체 맥락에서 זקנים은 연령만이 아니라 공동체적 권위를 지닌 장로들을 가리키므로 '장로들'이 가장 적절합니다.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  english_pob_choice: outlived Joshua
  chosen_korean: 여호수아 뒤에 오래 살아남은
  alternatives_korean:
  - 여호수아보다 오래 산
  - 여호수아 이후로 오래 머문
  lexicon: HALOT
  rationale: 직역하면 '날들을 길게 하다'이지만 문맥상 여호수아보다 더 오래 생존한 뜻이므로, 한국어에서 그 함의를 분명하게 표현했습니다.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  english_pob_choice: all the work of Yahweh
  chosen_korean: 야훼의 모든 일
  alternatives_korean:
  - 야훼의 모든 행하심
  - 야훼의 모든 행적
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 '일/행위/행하신 일'의 폭이 있으므로, POB의 'work'를 과도하게 좁히지 않으면서 자연스러운 '일'로 옮겼습니다.
theological_decisions:
- issue: 야훼의 행위가 단순한 사건이 아니라 언약적 구원 행위라는 점
  chosen_reading: '''야훼께서 이스라엘을 위해 행하신 야훼의 모든 일''로 옮겨, ''for Israel''의 유익성을 살리고 신적 행위의 주체를 분명히 했습니다.'
  alternative_readings:
  - 이스라엘에게 하신 모든 일
  - 이스라엘을 향한 모든 일
  rationale: לְיִשְׂרָאֵל은 단순 대상이 아니라 이스라엘을 위한 유익의 방향을 나타내므로, '위해'를 써서 언약적 선의를 드러냈습니다.
  doctrine_reference: 문맥상 출애굽-정복의 구원사적 행위
