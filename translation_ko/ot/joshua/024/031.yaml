  source_fidelity: 원문의 시간 구문은 여호수아의 생애와 그 뒤까지 생존한 장로들의 생애를 병렬로 제시합니다. 또한 장로들은 야훼께서 이스라엘을 위해 행하신 모든 일을 안 사람들로 수식됩니다. 수정문은 이 관계를 분명히 보존합니다.
  naturalness: 초안의 ‘장로들로서 … 알고 있던 모든 날 동안’은 수식 범위가 불분명하고 현대 한국어로도 부자연스럽습니다. 장로들의 두 특성을 관계절로 정리하고 ‘살아 있는 동안 내내’로 시간 범위를 자연스럽게 표현했습니다.
  terminology: ‘야훼’, ‘섬겼습니다’, ‘장로들’은 각각 신명, עבד의 폭넓은 언약적 섬김, זקנים의 공동체적 의미를 적절히 반영합니다. ‘행하신 모든 일’은 מַעֲשֵׂה의 의미와 한국어 문맥에 잘 맞습니다.
  issues:
