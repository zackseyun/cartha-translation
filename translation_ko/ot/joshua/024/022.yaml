  source_fidelity: 개정이 필요합니다. בכם은 언약·법정 문맥에서 백성 자신의 선택이 자신들에게 불리한 증언이 됨을 나타내므로, ‘너희 자신에게 대하여’보다 ‘스스로에게 불리한’이 더 정확합니다. 또한 כִּי는 선택 행위의 내용을 잇는 기능이므로, 단순한 원인절 ‘이는 … 때문입니다’로 처리하기보다 그 선택 사실을 증언의 내용으로 명시하는 편이 충실합니다.
  naturalness: 초안의 ‘너희 자신에게 대하여 증인들입니다’와 ‘너희 자신을 위하여 택하여’는 현대 한국어에서 부자연스럽습니다. ‘스스로에게 불리한 증인입니다’ 및 ‘너희를 위하여’가 자연스럽고, 집단을 가리키는 ‘증인입니다’도 한국어에서는 충분히 자연스럽습니다.
  terminology: ‘야훼’와 ‘섬기다’는 원문의 신명과 עבד의 폭넓은 언약적 섬김을 적절히 보존합니다. 다만 ‘섬기기로 했기’는 원문의 부정사 목적/내용을 다소 자유롭게 풀므로 ‘섬기기로 한 사실’으로 연결하여 선택의 내용으로 처리했습니다.
