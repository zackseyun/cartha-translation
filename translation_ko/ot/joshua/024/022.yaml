  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
  footnotes:
  - marker: a
    text: Or, “You are witnesses to yourselves,” that is, your own words testify to your choice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 백성에게 말했습니다. 「너희는 너희 자신에게 대하여 증인들입니다. 이는 너희가 야훼를 너희 자신을 위하여 택하여 그분을 섬기기로 했기 때문입니다.」 그러자 그들이 말했습니다. 「우리는 증인들입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희는 너희 자신에게 증인들입니다”라는 뜻으로, 자기 자신에게 유리하기보다 자기 선택을 스스로 확증하는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים אַתֶּם בָּכֶם
  english_pob_choice: You are witnesses against yourselves
  chosen_korean: 너희는 너희 자신에게 대하여 증인들입니다
  alternatives_korean:
  - 너희는 너희 자신에게 증인들입니다
  - 너희는 너희 자신을 향한 증인들입니다
  lexicon: HALOT
  rationale: 법정·언약 문맥에서 בכם의 자기지시적 증언은 단순한 ‘자기들끼리’가 아니라 자기 자신을 향해 불리하게 작용하는 증언으로 읽히므로, ‘대하여’로 그 자책적 힘을 살렸습니다.
- source_word: בְּחַרְתֶּם לָכֶם
  english_pob_choice: you have chosen ... for yourselves
  chosen_korean: 너희가 ... 너희 자신을 위하여 택하여
  alternatives_korean:
  - 너희가 ... 너희를 위해 택하여
  - 너희가 ... 스스로 택하여
  lexicon: HALOT
  rationale: לכם은 선택의 수혜가 자기 자신에게 돌아오는 반사적 표현이므로, ‘너희 자신을 위하여’로 그 자기지향성을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 테트라그람마톤은 칭호가 아니라 신적 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לַעֲבֹד אוֹת֑וֹ
  english_pob_choice: to serve him
  chosen_korean: 그분을 섬기기로 했기 때문입니다
  alternatives_korean:
  - 그를 섬기기로 했기 때문입니다
  - 그분께 예배드리기로 했기 때문입니다
  lexicon: HALOT
  rationale: עבד는 여기서 언약적 충성을 포함한 섬김을 뜻하므로, 예배로 좁히지 않고 ‘섬기다’로 넓게 유지했습니다.
theological_decisions:
- issue: 여호수아의 경고가 갖는 자기증언/자기책임의 의미
  chosen_reading: ‘너희는 너희 자신에게 대하여 증인들입니다’로 번역해, 선택의 결과를 스스로 증언하게 되는 언약적 책임을 드러냈습니다.
  alternative_readings:
  - ‘너희는 너희 자신에게 증인들입니다’
  - ‘너희는 너희 자신을 향한 증인들입니다’
  rationale: 히브리어 표현은 단순한 정보 확인이 아니라 선택한 행위가 자기에게 불리한 증언이 된다는 법적·신학적 무게를 지니므로, 그 책임성을 약화시키지 않도록 했습니다.
  doctrine_reference: 언약 책임과 자기증언의 문맥(수 24장 전체)
