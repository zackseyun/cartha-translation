source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
  footnotes:
  - marker: a
    text: Or 'a witness for us' / 'to us'; the Hebrew preposition can be taken more neutrally, but in context the sense is that the stone stands as testimony against covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'has heard'—the stone is personified as a witness to the covenant words.
    reason: cultural_note
  - marker: c
    text: Or 'deal falsely with your God' or 'prove false to your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 모든 백성에게 말했습니다. 「보십시오, 이 돌이 우리에게 증언이 될 것입니다. 그것이 우리와 함께 야훼께서 하신 모든 말씀을 들었기 때문입니다. 또한 그것은 여러분에게도 증언이 될 것입니다. 여러분이 자기 하나님을 부인하지 않도록 하십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리에게’는 본문상 더 중립적으로도 읽을 수 있지만, 언약 위반에 대한 증언이라는 문맥에서는 ‘우리에게 대하여/우리에게 증언이 될’의 의미가 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 돌이 ‘들었다’는 표현은 원문의 의인화를 그대로 반영한 것입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘자기 하나님께 거짓되게 행하지 않도록 하십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게나
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 청중의 주의를 끄는 감탄사 기능을 살리면서도 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: הָאֶבֶן הַזֹּאת
  english_pob_choice: this stone
  chosen_korean: 이 돌
  alternatives_korean:
  - 이 바위
  - 이 돌멩이
  lexicon: HALOT
  rationale: אֶבֶן은 일반적으로 ‘돌’이 가장 정확하며, 언약 표지의 맥락에서도 과장 없이 맞습니다.
- source_word: תִּהְיֶה ... לְעֵדָה / וְהָיְתָה ... לְעֵדָה
  english_pob_choice: will be a witness
  chosen_korean: 증언이 될 것입니다
  alternatives_korean:
  - 증인이 될 것입니다
  - 증거가 될 것입니다
  lexicon: HALOT
  rationale: 법정적·언약적 ‘증언’의 성격을 살리되, 돌 자체의 의인화된 역할도 한국어로 자연스럽게 유지했습니다.
- source_word: שָׁמְעָה אֵת כָּל אִמְרֵי יְהוָה
  english_pob_choice: has heard all the words of Yahweh
  chosen_korean: 야훼께서 하신 모든 말씀을 들었기 때문입니다
  alternatives_korean:
  - 야훼의 모든 말씀을 들었기 때문입니다
  - 야훼께서 말씀하신 모든 것을 들었기 때문입니다
  lexicon: HALOT
  rationale: ‘들었다’는 의인화된 원문을 유지하고, אִמְרֵי를 ‘말씀’으로 옮겨 언약 선포의 내용을 분명히 했습니다.
- source_word: בֵּאלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 자기 하나님
  alternatives_korean:
  - 여러분의 하나님
  - 너희 하나님
  lexicon: HALOT
  rationale: 문맥상 경고의 대상이 되는 각 개인/공동체를 아우르면서도 한국어에서 가장 자연스럽게 ‘자기 하나님’을 배치했습니다.
theological_decisions:
- issue: 돌의 의인화(듣고 증언함)
  chosen_reading: 원문이 부여한 의인화 표현을 그대로 유지했습니다.
  alternative_readings:
  - 상징적 기념비로만 완화해서 옮기기
  rationale: 언약 갱신 장면의 증언 기능이 핵심이므로, 돌이 ‘들었다’고 하는 표현을 약화하면 본문의 경고성과 증거성이 줄어듭니다.
  doctrine_reference: '번역 원칙: 원문 우선, 의인화를 해설로 지워버리지 않음'
- issue: פֶּן תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם의 경고 뉘앙스
  chosen_reading: ‘여러분이 자기 하나님을 부인하지 않도록 하십시오’로 경고형 목적절을 살렸습니다.
  alternative_readings:
  - ‘자기 하나님께 거짓되지 않도록 하십시오’
  - ‘자기 하나님을 배반하지 않도록 하십시오’
  rationale: כחש의 범위를 넓게 두되, 여기서는 하나님에 대한 부인/불충의 경고가 가장 직접적으로 드러나므로 ‘부인하다’가 적절합니다.
  doctrine_reference: HALOT의 문맥상 의미와 POB의 경고적 해석
