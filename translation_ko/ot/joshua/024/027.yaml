  to: 여호수아가 모든 백성에게 말했습니다. 「보십시오, 이 돌이 우리에게 불리한 증인이 될 것입니다.[a] 이 돌이 야훼께서 우리와 말씀하신 모든 말씀을 들었기 때문입니다.[b] 여러분이 여러분의 하나님을 부인하지 않도록, 이 돌은 여러분에게도 불리한 증인이 될 것입니다.[c]」
  rationale: 돌의 법정적·언약적 역할을 ‘증인’으로 명료하게 옮기고, 두 차례의 ב 전치사가 문맥상 가질 수 있는 불리한 증언의 함의를 본문과 각주에 반영했습니다. 마지막 절은 원문의 경고 목적절을 유지하도록 재구성했으며, 야훼가 백성과 ‘말씀하셨다’는 상호적 표현을 자연스럽게 보존했습니다.
