  terminology: יְהוָה를 ‘야훼’로, עבד를 언약적 충성을 포괄하는 ‘섬기겠습니다’로 옮긴 것은 적절합니다. 다만 현 번역문 자체가 이미 ‘야훼’를 사용하므로, ‘대안으로 야훼’라고 하는 각주는 내용상 모순됩니다.
