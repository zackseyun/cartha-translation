translation:
  language: ko
  text: 그러나 백성이 여호수아에게 말했습니다. 「아닙니다. 오히려 우리는 야훼를 섬기겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 본문의 wayyiqtol אמר는 직설화법을 여는 기본 서술 동사이므로, 자연스러운 현대 한국어 서술로 ‘말했습니다’가 가장 무난합니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 회중
  lexicon: HALOT
  rationale: 여기서의 עם은 여호수아와 대화하는 언약 공동체를 가리키므로, 한국어에서는 집단성을 살린 ‘백성’이 적절합니다.
- source_word: לֹא כִּי
  english_pob_choice: No, but
  chosen_korean: 아닙니다. 오히려
  alternatives_korean:
  - 아니요. 그러나
  - 아니라
  lexicon: HALOT
  rationale: לֹא 뒤의 כִּי가 단순 설명이 아니라 앞선 도전을 반박하는 전환을 이루므로, ‘아닙니다. 오히려’로 역접과 교정의 힘을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명은 공용 교회어인 ‘주님’보다 원문을 직접 반영하는 ‘야훼’가 소스-직역적이며, 프로젝트 기본 용례와도 일치합니다.
- source_word: נַעֲבֹד
  english_pob_choice: we will serve
  chosen_korean: 섬기겠습니다
  alternatives_korean:
  - 봉사하겠습니다
  - 예배하겠습니다
  lexicon: HALOT
  rationale: עבד는 여기서 단순 노동이 아니라 언약적 충성과 섬김을 뜻하므로, 한국어에서도 두 뉘앙스를 함께 담는 ‘섬기겠습니다’가 적합합니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 언약 이름을 직접 사용하므로, 신학적 완곡어법보다 원문 고유명을 드러내는 번역이 더 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
