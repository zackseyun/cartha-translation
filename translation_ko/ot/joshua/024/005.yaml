revisions:
- from: 그때 내가 모세와 아론을 보내었고, 내가 مصر를 쳤으니 — 내가 그 가운데서 행한 그대로였습니다 — 그리고 그 뒤에 너희를 이끌어 내었습니다.[a][b]
  to: 그때 내가 모세와 아론을 보내고, 내가 그 가운데에서 행한 대로 이집트를 쳤습니다[a]. 그 뒤에 내가 너희를 이끌어 내었습니다.[b]
  rationale: 이집트 지명을 한글 표준 표기로 바로잡고, 원문의 비교/방식 절을 ‘내가 그 가운데에서 행한 대로’로 ‘이집트를 쳤습니다’에 직접 연결했습니다. 두 절의 사건 순서와 직접적인 2인칭 복수 ‘너희’를 보존했으며, 각주 표지는 각각 해당 어구에 배치했습니다.
