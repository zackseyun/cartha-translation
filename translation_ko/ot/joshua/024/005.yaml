id: JOS.24.5
reference: Joshua 24:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
  footnotes:
  - marker: a
    text: Or 'I plagued Egypt'; the Hebrew verb can mean 'struck' or 'afflicted,' here referring to the LORD's blows against Egypt.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to what I did in its midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 모세와 아론을 보내었고, 내가 مصر를 쳤으니 — 내가 그 가운데서 행한 그대로였습니다 — 그리고 그 뒤에 너희를 이끌어 내었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נגף는 ‘치다, 상하게 하다, 재앙을 내리다’의 뜻을 가질 수 있습니다. 여기서는 이집트에 내린 하나님의 타격을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 그 가운데서 행한 그대로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  english_pob_choice: I sent
  chosen_korean: 내가 보내었고
  alternatives_korean:
  - 내가 보냈고
  - 내가 파견했고
  lexicon: HALOT
  rationale: שׁלח의 기본 의미인 ‘보내다’를 따라, 하나님이 모세와 아론을 사역에 보내신 동작을 자연스러운 합쇼체로 옮겼습니다.
- source_word: וָאֶגֹּף
  english_pob_choice: I struck
  chosen_korean: 내가 쳤으니
  alternatives_korean:
  - 내가 치셨으니
  - 내가 내리쳤으니
  - 내가 재앙을 내렸으니
  lexicon: HALOT
  rationale: נגף는 ‘치다/쳐서 상하게 하다’의 직접성이 있어, 해석을 덧붙인 ‘재앙을 내리다’보다 간결한 ‘쳤으니’를 택했습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: in its midst
  chosen_korean: 그 가운데서
  alternatives_korean:
  - 그 한가운데서
  - 그 안에서
  - 그들 가운데서
  lexicon: HALOT
  rationale: 히브리어 단수 대명사 ‘its’는 이집트 전체를 집합적으로 가리키므로, 한국어에서는 자연스럽게 ‘그 가운데서’로 살렸습니다.
- source_word: הוֹצֵאתִי אֶתְכֶם
  english_pob_choice: I brought you out
  chosen_korean: 너희를 이끌어 내었습니다
  alternatives_korean:
  - 너희를 데리고 나왔습니다
  - 너희를 인도하여 내었습니다
  lexicon: HALOT
  rationale: 출애굽 맥락에서 יצא Hiphil은 단순한 ‘나오게 하다’보다 구출·인도 뉘앙스가 있어, ‘이끌어 내었습니다’로 번역했습니다.
theological_decisions:
- issue: 이집트에 대한 하나님의 행위 표현
  chosen_reading: ‘내가 مصر를 쳤으니’로 직설적으로 옮겨, 본문의 심판 행위를 완화하지 않았습니다.
  alternative_readings:
  - ‘내가 이집트를 괴롭혔으니’
  - ‘내가 이집트에 재앙을 내렸으니’
  rationale: 문맥상 출애굽의 재앙을 가리키지만, מקור의 동사 נגף가 가진 ‘치다/상하게 하다’의 직접성을 보존하는 것이 본문의 힘을 잘 드러냅니다.
  doctrine_reference: 출애굽기 12–14장의 심판과 구원의 서술 보존
- issue: 종결 절의 2인칭 복수
  chosen_reading: ‘너희를’로 그대로 유지해, 현재 청중과 출애굽 세대 사이의 언약적 연속성을 드러냈습니다.
  alternative_readings:
  - ‘너희 조상들을’
  - ‘그들을’
  rationale: 히브리어는 직접 ‘너희를’이라고 말하므로, 설명적 바꿔치기보다 본문의 수사적 긴장을 살리는 것이 적절합니다.
  doctrine_reference: 언약 공동체의 대표성
