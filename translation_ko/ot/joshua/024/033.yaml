base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: ko
  text: 아론의 아들 엘르아살이 죽었습니다. 그들은 그를 에브라임 산지에 있는, 그의 아들에게 주어진 기브앗-비느하스에 장사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘비느하스의 언덕’이라는 지명 요소를 포함하지만, 문맥과 POB 개정은 이를 ‘그의 아들에게 주어진’ 것으로 풀어 이해하게 합니다.
    reason: source_note
lexical_decisions:
- source_word: מֵת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 세상을 떠났습니다
  - 별세했습니다
  lexicon: מָוֶת / 죽다
  rationale: 서술형 역사 기록에 맞게 직접적이고 담백한 ‘죽었습니다’를 택해, 본문의 사실 진술을 과장 없이 옮겼습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: and they buried him
  chosen_korean: 그들은 그를 … 장사했습니다
  alternatives_korean:
  - 그들은 그를 … 묻었습니다
  - 그를 …에 매장했습니다
  lexicon: קָבַר / 장사하다
  rationale: 성경적 장례 동사를 살리되 현대 한국어에서도 자연스러운 ‘장사했습니다’로 옮겼습니다.
- source_word: בְּגִבְעַת פִּינְחָס בְּנוֹ
  english_pob_choice: at Gibeath-phinehas, his son’s hill country
  chosen_korean: 그의 아들에게 주어진 기브앗-비느하스
  alternatives_korean:
  - 그의 아들의 언덕인 기브앗-비느하스
  - 비느하스의 아들의 언덕 기브앗-비느하스
  lexicon: גִּבְעָה / 언덕, פִּינְחָס / 비느하스
  rationale: POB의 문맥상 해석인 ‘his son’s hill country’를 반영해, 지명 자체보다 그 지명의 소유·연관 관계를 드러내는 한국어로 풀었습니다.
- source_word: נִתַּן לוֹ
  english_pob_choice: which had been given to him
  chosen_korean: 주어진
  alternatives_korean:
  - 그에게 주어진
  - 그에게 허락된
  lexicon: נָתַן / 주다
  rationale: 수동 완료의 의미를 간결하게 살려, 출처 문맥이 요구하는 ‘이미 주어져 있던’ 상태를 나타냈습니다.
theological_decisions:
- issue: 기브앗-비느하스의 관계 표현
  chosen_reading: 지명 자체를 단순 음역하지 않고, ‘그의 아들에게 주어진’으로 관계를 풀어 써서 본문의 소유·상속 의미를 드러냈습니다.
  alternative_readings:
  - ‘그의 아들의 언덕’으로 직역
  - 지명만 음역하여 관계 설명을 생략
  rationale: 히브리어와 POB 개정이 함께 강조하는 핵심은 지명의 뜻보다 ‘아들에게 주어진 땅’이라는 상속적 의미이므로, 이를 한국어에서도 보존했습니다.
  doctrine_reference: 본문 문맥 보존과 역사 서술의 명료성
- issue: 장례 서술의 톤
  chosen_reading: ‘장사했습니다’로 번역해 성경적이면서도 현대적인 장례 서술을 유지했습니다.
  alternative_readings:
  - ‘묻었습니다’
  - ‘매장했습니다’
  rationale: 의례적·서사적 톤을 유지하면서도 구어적 과장이 없도록 균형을 맞췄습니다.
  doctrine_reference: 서술문체 일관성
