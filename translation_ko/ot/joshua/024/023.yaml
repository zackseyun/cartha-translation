translation:
  language: ko
  text: 그러므로 이제 너희 가운데 있는 이방 신들을 제거하고, 너희 마음을 야훼, 이스라엘의 하나님께로 향하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방 신들을 치워 버리십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너희 마음을 야훼께로 기울이십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그런즉 지금
  lexicon: HALOT
  rationale: 문맥상 여호수아의 즉각적인 권면을 이어 주는 접속과 시간 표지를 함께 살려, 단순한 ‘이제’보다 자연스럽고 힘 있는 ‘그러므로 이제’로 옮겼습니다.
- source_word: הָסִירוּ אֶת אֱלֹהֵי הַנֵּכָר
  english_pob_choice: remove the foreign gods
  chosen_korean: 이방 신들을 제거하고
  alternatives_korean:
  - 이방 신들을 버리고
  - 낯선 신들을 치워 내고
  - 외국 신들을 제거하고
  lexicon: HALOT
  rationale: הסירו는 물리적으로 ‘치우다’보다 결연한 배격을 뜻하므로, 현대 한국어에서 분명한 명령으로 들리는 ‘제거하다’를 택했습니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: that are among you
  chosen_korean: 너희 가운데 있는
  alternatives_korean:
  - 너희 중에 있는
  - 너희 안에 있는
  lexicon: HALOT
  rationale: ‘among you’의 공동체적 위치를 살려 ‘너희 가운데 있는’으로 옮기고, 내면을 뜻할 수 있는 오해는 피했습니다.
- source_word: וְהַטּוּ אֶת לְבַבְכֶם אֶל יְהוָה
  english_pob_choice: turn your heart to Yahweh
  chosen_korean: 너희 마음을 야훼…께로 향하게 하십시오
  alternatives_korean:
  - 너희 마음을 야훼께로 돌리십시오
  - 너희 마음을 야훼께로 기울이십시오
  lexicon: HALOT
  rationale: נטה의 비유적 방향 전환을 한국어의 ‘향하게 하다’로 자연스럽게 표현해, 마음의 충성을 한 방향으로 돌리는 뜻을 살렸습니다.
