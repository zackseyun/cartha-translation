  to: 이제 너희 가운데 있는 이방 신들을 제거하십시오.[a] 그리고 너희 마음을 이스라엘의 하나님이신 야훼께로 돌리십시오.[b]
  rationale: ‘이제’로 권면 도입부를 절제되게 옮기고, 원문의 병렬된 명령형을 한국어에서도 두 명령문으로 드러냈습니다. ‘돌리십시오’는 마음의 충성 및 지향을 야훼께로 전환하라는 원문의 비유를 보존합니다. 각 각주는 해당 어구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
