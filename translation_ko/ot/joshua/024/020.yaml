id: JOS.24.20
reference: Joshua 24:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
  footnotes:
  - marker: a
    text: Or 'and bring disaster on you.' The Hebrew verb can denote causing harm or calamity, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'destroy you' for 'consume you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 너희가 야훼를 버리고 이방 신들을 섬기면, 그가 돌이켜 너희에게 해를 끼치고 너희를 멸하실 것입니다. 이는 그가 이미 너희에게 선을 행하신 뒤입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해를 끼치고’는 여기서 мораль적 악이 아니라 재앙·해악을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸하실 것입니다’는 ‘너희를 완전히 없애실 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַֽעַזְבוּ
  english_pob_choice: you forsake
  chosen_korean: 너희가 … 버리고
  alternatives_korean:
  - 너희가 … 떠나고
  - 너희가 … 저버리고
  lexicon: HALOT
  rationale: 언약적 관계를 끊는 의미가 핵심이므로, 단순한 ‘떠나다’보다 관계적 배신을 드러내는 ‘버리다’가 더 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명을 보존하는 원칙에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי נֵכָר
  english_pob_choice: foreign gods
  chosen_korean: 이방 신들
  alternatives_korean:
  - 외국 신들
  - 낯선 신들
  lexicon: HALOT
  rationale: ישראל과 언약적으로 대조되는 ‘낯선/외국의’ 신들이라는 뜻을 현대 한국어에서 가장 자연스럽고 분명하게 드러내는 표현입니다.
- source_word: וְהֵרַע לָכֶם
  english_pob_choice: and do you harm
  chosen_korean: 너희에게 해를 끼치고
  alternatives_korean:
  - 너희에게 재앙을 내리고
  - 너희에게 악을 행하고
  lexicon: HALOT
  rationale: 히필형 רעה는 도덕적 ‘악’보다 ‘해를 끼치다/재앙을 가져오다’의 의미가 적절하므로, 문맥상 자연한 현대어로 옮겼습니다.
- source_word: וְכִלָּה אֶתְכֶם
  english_pob_choice: and consume you
  chosen_korean: 너희를 멸하실 것입니다
  alternatives_korean:
  - 너희를 소멸하실 것입니다
  - 너희를 다 없애실 것입니다
  lexicon: HALOT
  rationale: כלה는 심판적 파멸을 가리키므로, 한국어에서 강도를 유지하면서도 이해하기 쉬운 ‘멸하다’를 택했습니다.
theological_decisions:
- issue: 야훼의 심판 행위와 이전의 선행 사이의 긴장
  chosen_reading: 하나님이 먼저 선을 행하신 뒤에도 언약을 저버리면, 그분이 돌이켜 심판하실 수 있다는 경고로 보존했습니다.
  alternative_readings:
  - 심판을 단지 인간의 선택이 낳은 자연적 결과로만 약화하는 읽기
  - 하나님의 직접적 행위를 완화하는 읽기
  rationale: 히브리어 동사는 해악과 멸망의 주체를 야훼에게 직접 귀속시키므로, 그 긴장을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
