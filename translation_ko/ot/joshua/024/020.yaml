revisions:
- from: 만일 너희가 야훼를 버리고 이방 신들을 섬기면, 그가 돌이켜 너희에게 해를 끼치고 너희를 멸하실 것입니다. 이는 그가 이미 너희에게 선을 행하신 뒤입니다.[a][b]
  to: 만일 너희가 야훼를 버리고 이방 신들을 섬기면, 그분이 너희에게 선을 행하신 후에 돌이켜 너희에게 해를 입히시고[a] 너희를 멸하실 것입니다.[b]
