  source_fidelity: 원문은 야훼께서 ‘모든 민족’과 ‘그 땅에 사는 아모리 사람’을 이스라엘 앞에서 몰아내셨다고 서술합니다. 초안의 대시 뒤 절은 아모리 사람들이 ‘그러하였다’는 뜻으로 읽혀, 야훼가 두 목적어를 쫓아내셨다는 원문의 통사 관계를 보존하지 못합니다.
  naturalness: ‘야훼께서 모든 민족과 그 땅에 사는 아모리 사람들을 우리 앞에서 쫓아내셨습니다’는 현대 표준어 합쇼체로 자연스럽고, ‘우리 앞에서’라는 원문의 관용적 표현도 유지합니다.
  terminology: ‘야훼’, ‘아모리 사람들’, ‘섬기겠습니다’, ‘하나님’은 일관되고 적절합니다. עבד의 넓은 언약적 충성의 의미를 ‘섬기겠습니다’가 잘 보존합니다.
  issues:
