id: JOS.24.18
reference: Joshua 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
  footnotes:
  - marker: a
    text: Or 'and the Amorites who inhabited the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모든 민족과 그 땅에 사는 아모리 사람들을 우리 앞에서 쫓아내셨습니다. 우리도 야훼를 섬기겠습니다. 그분이 우리 하나님이시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  english_pob_choice: drove out
  chosen_korean: 쫓아내셨고
  alternatives_korean:
  - 몰아내셨고
  - 내쫓으셨고
  lexicon: HALOT
  rationale: גרש의 핵심은 밖으로 몰아내거나 쫓아내는 동작이므로, 자연스러운 현대 한국어로 ‘쫓아내셨고’가 원문의 힘을 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여기서는 여호와를 대체하지 않고 신명기적 고유명사를 그대로 옮기는 프로젝트 기본값에 따라 ‘야훼’를 사용합니다.
- source_word: כָּל הָעַמִּים
  english_pob_choice: all the peoples
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 민족들
  - 모든 사람들
  lexicon: HALOT
  rationale: עַמִּים은 단일 집단이 아니라 여러 민족 집단을 가리키므로 복수성을 살리되, 한국어에서는 ‘백성’이 가장 자연스럽게 집합적 의미를 전달합니다.
- source_word: וְאֶת הָאֱמֹרִי יֹשֵׁב הָאָרֶץ
  english_pob_choice: including the Amorites who lived in the land
  chosen_korean: 그 땅에 살던 아모리 사람들도
  alternatives_korean:
  - 그 땅에 거주하던 아모리 사람들도
  - 그 땅을 차지하고 살던 아모리 사람들도
  lexicon: HALOT
  rationale: 직역의 ‘그리고’를 그대로 두기보다 문맥상 앞의 ‘모든 백성’에 포함되는 예시를 드러내도록 ‘-들도’로 처리해, 영어 POB의 해석을 한국어에서 과도하게 장식하지 않으면서 반영했습니다.
- source_word: נַעֲבֹד
  english_pob_choice: will serve
  chosen_korean: 섬기겠습니다
  alternatives_korean:
  - 예배하겠습니다
  - 섬길 것입니다
  lexicon: HALOT
  rationale: עבד는 하나님께 대한 언약적 섬김과 경배를 함께 내포하므로, 한국어에서는 단순한 의식행위보다 넓은 충성을 담는 ‘섬기겠습니다’가 적절합니다.
theological_decisions:
- issue: 야훼를 섬기겠다는 언약적 응답의 어조
  chosen_reading: ‘섬기겠습니다’로 결단형을 살려, 백성의 공동 서약이라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘섬길 것입니다’로 미래 서술
  - ‘예배하겠습니다’로 좁게 번역
  rationale: 히브리어는 단순 예언보다 공동체의 결의와 헌신을 표현하므로, 결단의 뉘앙스를 살리는 것이 문맥상 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
