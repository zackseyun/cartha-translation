revisions:
- from: 야훼께서 우리 앞에서 모든 백성을 쫓아내셨고—그 땅에 살던 아모리 사람들도 그러하셨습니다. 우리도 야훼를 섬기겠습니다. 그분이 우리 하나님이시기 때문입니다.[a]
  to: 야훼께서 모든 민족과 그 땅에 사는 아모리 사람들을 우리 앞에서 쫓아내셨습니다. 우리도 야훼를 섬기겠습니다. 그분이 우리 하나님이시기 때문입니다.
  rationale: 대시와 ‘그러하셨습니다’를 제거하고, 야훼가 두 병렬 목적어를 쫓아내셨다는 히브리어의 문장 구조를 한국어 문장 하나로 명확히 옮겼습니다. 불필요해진 각주도 삭제했습니다.
