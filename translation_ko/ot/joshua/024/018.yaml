    rationale: 이 문장은 문법상 아모리 사람들이 앞 절과 같은 행동을 했다는 뜻으로 읽힐 수 있습니다. 히브리어에서는 야훼가 ‘모든 민족’과 ‘그 땅에 사는 아모리 사람’을 모두 쫓아내신 동사의 목적어입니다.
  - severity: low
    issue: 각주가 본문 끝에 놓여 대안이 가리키는 범위가 불분명합니다.
    rationale: 수정 본문은 원문의 병렬 목적어를 직접 반영하므로, 단순한 ‘살던/거주하던’ 어휘 대안 각주는 번역상 필요하지 않습니다.
