- from: 그러자 백성이 여호수아에게 말했습니다. 「우리는 야훼 우리 하나님을 섬기며, 그의 음성에 순종하겠습니다.」[a][b]
  to: 그러자 백성이 여호수아에게 말했습니다. “우리는 우리 하나님 야훼를 섬기고[a], 그의 말씀에 순종하겠습니다[b].”
  rationale: 수정은 원문의 등위 동사 구조를 한국어에서 분명히 하고, ‘우리 하나님 야훼’라는 자연스러운 어순을 채택하며, 각주 표지를 해당 어구에 연결합니다. ‘그의 말씀에 순종하다’는 히브리어 ‘그의 음성을 듣다’의 관용적 순종 의미를 현대 한국어로 자연스럽게 전달하고, 직역과 관용성은 각주에서 보존합니다.
