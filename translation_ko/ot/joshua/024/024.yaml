id: JOS.24.24
reference: Joshua 24:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
  footnotes:
  - marker: a
    text: Or 'We will worship the LORD our God.' The Hebrew verb can denote service rendered to God in a worshipful sense, but 'serve' better preserves the broader covenantal meaning here.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we will hear/listen to his voice,' an idiom meaning obedient response to what he says.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성이 여호수아에게 말했습니다. 「우리는 야훼 우리 하나님을 섬기며, 그의 음성에 순종하겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 야훼 우리 하나님께 예배하겠습니다.’ 히브리어 동사는 하나님께 드리는 섬김을 예배적 의미로도 가리킬 수 있지만, 여기서는 더 넓은 언약적 의미를 살리는 ‘섬기다’가 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 음성을 듣겠습니다’이며, 이는 곧 그의 말에 순종한다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말하였습니다
  lexicon: WLC
  rationale: דרך wayyiqtol로 직접화를 여는 평이한 서술이어서, 현대 합쇼체의 자연스러운 과거형인 ‘말했습니다’가 가장 적절합니다.
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 요수아
  - 예호수아
  lexicon: WLC
  rationale: 히브리어 인명은 한국어 성서 관용형인 ‘여호수아’로 옮기는 것이 가장 널리 인식됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 문자 그대로의 고유 이름을 살리기 위해 관행적 대체어 ‘주’ 대신 프로젝트 기본값인 ‘야훼’를 사용합니다.
- source_word: נַעֲבֹד
  english_pob_choice: we will serve
  chosen_korean: 섬기며
  alternatives_korean:
  - 예배하며
  - 봉사하며
  lexicon: HALOT
  rationale: עבד는 언약적 맥락에서 ‘섬기다’와 ‘예배하다’의 범위를 함께 가지므로, ‘섬기며’가 더 넓은 충성·예배의 의미를 보존합니다.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  english_pob_choice: we will obey his voice
  chosen_korean: 그의 음성에 순종하겠습니다
  alternatives_korean:
  - 그의 음성을 듣겠습니다
  - 그가 말씀하시는 것을 따르겠습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 음성을 듣다’이지만, 히브리 관용구상 실제 의미는 순종이므로 ‘음성에 순종하다’로 자연스럽게 옮깁니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약의 고유 이름을 직접 사용하므로, 이를 가리는 일반 명칭보다 고유명사 표기를 유지하는 것이 स्रोत의 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: עבד의 의미 범위
  chosen_reading: 섬기다
  alternative_readings:
  - 예배하다
  - 복종하다
  rationale: 이 구절은 단순한 예배 행위만이 아니라 언약적 충성과 순종을 함께 고백하므로, ‘섬기다’가 의미 범위를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
