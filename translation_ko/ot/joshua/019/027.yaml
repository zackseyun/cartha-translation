source:
  edition: WLC
  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
  footnotes:
  - marker: a
    text: Hebrew 'from the left'; in boundary descriptions this may denote the north side, depending on orientation.
    reason: cultural_note
translation:
  language: ko
  text: 그 경계는 해 뜨는 쪽으로 돌아 벧다곤에 이르렀고, 스불론과 입다엘 골짜기에 닿고, 북쪽으로 벧에멕과 느이엘에 이르렀습니다. 이어서 왼쪽으로 가불까지 뻗어 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘왼쪽으로’입니다. 경계 묘사에서는 방향 기준에 따라 북쪽을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  english_pob_choice: Then it turned
  chosen_korean: 그런 다음 … 돌아서
  alternatives_korean:
  - 그리고 … 돌아서
  - 그런 다음 … 돌아갔습니다
  lexicon: HALOT
  rationale: 경계 묘사에서 שׁוּב은 단순한 ‘돌아감’보다 방향 전환을 뜻하므로, 자연스러운 ‘돌아서’로 옮겼습니다.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  english_pob_choice: eastward, toward the sunrise
  chosen_korean: 해 뜨는 쪽으로
  alternatives_korean:
  - 동쪽으로
  - 해 뜨는 방향으로
  lexicon: HALOT
  rationale: 히브리어의 ‘해 뜨는 방향’이라는 관용을 살리되, 경계 문맥에 맞게 간결한 공간 방향 표현으로 처리했습니다.
- source_word: וּפָגַע
  english_pob_choice: reached to
  chosen_korean: 맞닿았으며
  alternatives_korean:
  - 이르렀으며
  - 경계가 닿았으며
  - 접했으며
  lexicon: HALOT
  rationale: 지리적 경계가 다른 지역과 접촉하는 뜻이므로, ‘맞닿다’가 문맥을 가장 정확하고 자연스럽게 드러냅니다.
- source_word: מִשְּׂמֹאל
  english_pob_choice: on the left
  chosen_korean: 왼쪽의
  alternatives_korean:
  - 왼편의
  - 북쪽의
  - 왼쪽에서
  lexicon: HALOT
  rationale: 본문의 직설적 표현인 ‘왼쪽’을 보존해, 지리적 함의를 곧바로 해석어로 바꾸지 않았습니다. 북쪽 함의는 본문 밖에서 추론되는 사항입니다.
theological_decisions:
- issue: 지명 보존과 경계 서술의 직역 정도
  chosen_reading: 고유지명은 음역을 유지하고, 경계 동사들은 ‘돌아서 / 이르렀고 / 맞닿았으며 / 나갔습니다’처럼 서술해 지형 경계를 선명하게 드러냈습니다.
  alternative_readings:
  - 지명을 뜻풀이해 ‘다곤의 집’ 등으로 번역
  - 더 유려한 일반 서술로 완화
  rationale: 이 절은 분배 경계의 법적·지리적 기록이므로, 의미를 풀어쓰지 않고 원문의 지시점을 따라가는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 성경의 지리·역사 서술은 의미 확장보다 원문 정보의 보존이 우선
