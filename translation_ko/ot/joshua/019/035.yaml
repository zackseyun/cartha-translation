lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  english_pob_choice: And the fortified cities
  chosen_korean: 그리고 견고한 성읍들은
  alternatives_korean:
  - 그리고 요새 도시들은
  - 그리고 성채 도시들은
  lexicon: HALOT
  rationale: מִבְצָר의 군사적 성격을 살리되, 현대 한국어에서 자연스럽고 성읍 목록에 어울리는 표현으로 '견고한 성읍들'을 택했습니다.
- source_word: הַ/צִּדִּים
  english_pob_choice: Ziddim
  chosen_korean: 지딤
  alternatives_korean:
  - 지딤들
  - 즈딤
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역했습니다. 영어 POB의 Ziddim에 대응하여 한국어 음역은 '지딤'이 가장 무리 없습니다.
- source_word: וְ/חַמַּת
  english_pob_choice: and Hammath
  chosen_korean: 함맛
  alternatives_korean:
  - 하맛
  - 함마트
  lexicon: HALOT
  rationale: 지명은 음역하되, 히브리어의 겹자음과 기존 영어 POB 표기를 반영해 '함맛'으로 옮겼습니다.
- source_word: וְ/כִנָּֽרֶת
  english_pob_choice: and Kinnereth
  chosen_korean: 그리고 긴네렛
  alternatives_korean:
  - 그리고 기네렛
  - 그리고 긴네레스
  lexicon: HALOT
  rationale: 관련 성경 용례와 현대 음역 감각을 고려해 '긴네렛'으로 옮겼습니다. 영어 POB의 Kinnereth와도 잘 대응합니다.
