id: JOS.19.33
reference: Joshua 19:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
  footnotes:
  - marker: a
    text: Or “from Elon-bezaanannim”; the Hebrew may be read either as a place name or as “the oak in/of Zaannannim.”
    reason: alternative_reading
  - marker: b
    text: Hebrew literally, “its outgoings were the Jordan,” an idiom for the border’s terminal points reaching the Jordan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 경계는 헤렙에서, 사아난님에 있는 상수리나무에서, 아다미-느게브와 야브느엘을 지나, 라굼에 이르렀고, 그 끝은 요르단이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이를 한 지명(엘론-브사아난님)으로 읽을 수도 있고, ‘사아난님에 있는 상수리나무’로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그 끝들이 요르단이었다’는 뜻으로, 경계의 종착점이 요르단에 이르렀다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  english_pob_choice: their border
  chosen_korean: 그들의 경계
  alternatives_korean:
  - 그들의 국경
  - 그들의 경계선
  lexicon: HALOT
  rationale: 지형 목록 문맥에서 גְבוּל은 영토의 경계선을 뜻하므로, 자연스럽고 직접적인 ‘경계’로 옮겼습니다.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  english_pob_choice: from the oak in Zaannannim
  chosen_korean: 사아난님에 있는 상수리나무에서
  alternatives_korean:
  - 사아난님의 상수리나무에서
  - 사아난님에 있는 떡갈나무에서
  - 에론-브사아난님에서
  lexicon: HALOT
  rationale: אֵלוֹן은 큰 나무를 가리킬 수 있어 기본적으로 ‘상수리나무’로 옮겼고, זַעֲנַנִּים은 장소명으로 보아 ‘~에 있는’ 구조를 유지했습니다.
- source_word: וַאֲדָמִי הַנֶּקֶב
  english_pob_choice: Adami-nekeb
  chosen_korean: 아다미-느게브
  alternatives_korean:
  - 아다미-네케브
  - 아다미, 그 협곡
  - 아다미-하느게브
  lexicon: HALOT
  rationale: 이 구는 경계 열거 속 고유 지명으로 읽는 것이 가장 자연스러워, 통용되는 음역을 따라 붙여 적었습니다.
- source_word: תֹצְאֹתָיו
  english_pob_choice: its end
  chosen_korean: 그 끝
  alternatives_korean:
  - 그 나가는 곳
  - 그 경계의 끝
  - 그 나감들
  lexicon: HALOT
  rationale: 직역하면 ‘나감들/나가는 곳’이지만, 경계 설명에서는 종착점을 뜻하므로 POB의 ‘its end’에 맞춰 ‘그 끝’으로 간명하게 옮겼습니다.
- source_word: הַיַּרְדֵּן
  english_pob_choice: the Jordan
  chosen_korean: 요르단
  alternatives_korean:
  - 요르단 강
  - 요단
  lexicon: HALOT
  rationale: 고유 지명으로서 표준 외래어 표기인 ‘요르단’을 사용했으며, 지형상 강이란 뜻은 문맥상 이미 분명합니다.
theological_decisions:
- issue: 지명과 경계 목록의 처리
  chosen_reading: 문맥을 서술형으로 유지하되, 각 지명은 가능한 한 음역하고 지형 요소만 최소한으로 풀어 적었습니다.
  alternative_readings:
  - 경계선의 기능을 강조해 더 해설적으로 풀어쓰기
  - 모든 지명을 한국식 통용명으로 치환하기
  rationale: 본문은 이스라엘 지파의 경계 묘사로서 지명들의 연쇄가 핵심이므로, 해설을 덧붙이기보다 원문의 지리적 정보 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 역사-지리적 서술을 보존하는 번역 원칙
