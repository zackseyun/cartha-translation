  terminology: ‘경계’, ‘상수리나무’, ‘요르단’은 적절합니다. 지명은 헬렙, 사아난님, 아다미-네겝, 얍느엘, 락굼으로 통일하는 것이 원문 음가와 한국어 성경 지명 관례에 더 부합합니다.
