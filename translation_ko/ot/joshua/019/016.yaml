  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֛את נַחֲלַ֥ת בְּנֵֽי זְבוּלֻ֖ן לְ/מִשְׁפְּחוֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
  footnotes:
  - marker: a
    text: Or "This is the inheritance of the sons of Zebulun." The Hebrew uses a demonstrative with a verbless clause, which can be rendered in English as either present or past in this summary formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 스불론 자손의 몫으로, 그들의 씨족에 따라 받은 유산입니다. 이 성읍들과 그들의 촌락들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 계사 없는 지시문이므로, ‘이것은/이것이’와 같은 현재형과 ‘이것은 …이었다’ 같은 과거형이 모두 가능한 요약 공식입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This was
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  lexicon: BDB
  rationale: 히브리어 지시대명사로 시작하는 서술문을 자연스러운 현대 한국어로 옮기되, 족보·분배 공식의 요약문이라는 점을 살려 간결한 지시형으로 처리했습니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 몫 / 유산
  alternatives_korean:
  - 기업
  - 상속받은 몫
  - 유업
  lexicon: BDB
  rationale: 토지 분배 맥락의 נַחֲלָה는 단순 소유보다 ‘받아 배분된 몫’의 의미가 강해, 본문에서는 ‘몫’으로, 문맥상 이어지는 성읍 목록을 받는 총괄 의미는 ‘유산’으로 표현했습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 종족별로
  lexicon: BDB
  rationale: מִשְׁפָּחָה는 지파 내부의 하위 분류를 가리키므로, 한국어에서는 제도적 뉘앙스가 살아 있는 ‘씨족’이 가장 적절합니다.
- source_word: הֶעָרִים הָאֵלֶּה
  english_pob_choice: these cities
  chosen_korean: 이 성읍들
  alternatives_korean:
  - 이 도시들
  - 이 마을들
  lexicon: BDB
  rationale: 여호수아의 지파 경계·분배 목록에서 עָרִים는 관습적으로 ‘성읍들’로 옮기는 것이 한국어 성경 어법과 지리적 규모를 가장 잘 반영합니다.
- source_word: וְחַצְרֵיהֶן
  english_pob_choice: and their villages
  chosen_korean: 그들의 촌락들
  alternatives_korean:
  - 그 주변 촌락들
  - 그들의 마을들
  lexicon: BDB
  rationale: חָצֵר은 성읍에 딸린 농촌 거점들을 가리키므로, 단순한 ‘마을’보다 관계성이 드러나는 ‘촌락들’이 문맥에 더 가깝습니다.
theological_decisions:
- issue: 지파 분배 공식의 서술 시제
  chosen_reading: 과거형 요약문으로 처리해 ‘받은 유산입니다’라고 옮겼습니다.
  alternative_readings:
  - ‘받은 유산입니다’ 대신 ‘받을 유산입니다’
  - ‘이것이 …입니다’처럼 현재형으로 직역
  rationale: 히브리어는 계사 없는 지시문이지만, 여호수아의 분배 기록 전체가 이미 완료된 분배를 회고하는 공식 문체이므로 한국어에서는 과거적 요약이 자연스럽습니다.
  doctrine_reference: 본문 서술 시제와 문학 장르의 반영
