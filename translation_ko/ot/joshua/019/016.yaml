    rationale: 히브리어는 시제를 명시하지 않는 요약 공식입니다. 또한 ‘이 성읍들과 그 촌락들’은 기업의 내용을 밝히는 동격적 보충이므로 ‘곧’으로 연결하는 것이 자연스럽습니다.
  - severity: low
