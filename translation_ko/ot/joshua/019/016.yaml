revisions:
- from: 이것은 스불론 자손의 몫으로, 그들의 씨족에 따라 받은 유산입니다. 이 성읍들과 그들의 촌락들입니다.[a]
  to: 이것은 스불론 자손의 씨족별 기업, 곧 이 성읍들과 그 촌락들입니다.[a]
  rationale: 단일한 히브리어 명사 נַחֲלָה를 ‘기업’으로 일관되게 옮기고, 씨족별 분배라는 수식 관계를 보존했습니다. ‘곧’을 사용하여 ‘이 성읍들과 그 촌락들’이 앞의 기업을 구체화한다는 원문의 동격적 요약 구조를 반영했습니다. 본문은 현재형 한국어 공식으로 자연스럽게 제시하되, 무동사문의 과거 번역 가능성은 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:06:56Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 요약 공식(‘이것은 스불론 자손의 씨족별 기업, 이 성읍들과 그 촌락들’)의 핵심 요소는 모두 반영되어 있습니다. 다만 초안은 ‘몫’과 ‘유산’을 병렬로 사용하여 단일어 נַחֲלָה를 불필요하게 이중 번역하고, ‘받은’으로 과거성을 본문에 확정한 뒤 문장을 중복된 서술로 나눕니다. 원문의 무동사문이 지닌 시제의 여지는 본문에서 보존하는 편이 낫습니다.
  naturalness: 초안의 ‘이것은 … 몫으로, … 유산입니다. 이 성읍들과 그들의 촌락들입니다’는 서술어가 중복되고 마지막 문장이 앞 문장의 보충 성분처럼 분리되어 자연스럽지 않습니다. ‘곧’을 사용하여 성읍들과 촌락들이 기업의 내용을 이룬다는 관계를 매끄럽게 드러낼 수 있습니다.
  terminology: 토지 분배 문맥의 נַחֲלָה에는 한국어 성경 문체와 법적·상속적 함의를 함께 지닌 ‘기업’이 적절합니다. מִשְׁפָּחוֹת은 ‘씨족별’, עָרִים는 ‘성읍들’, חַצְרֵיהֶן은 해당 성읍들에 딸린 ‘그 촌락들’로 옮기는 것이 적절합니다.
