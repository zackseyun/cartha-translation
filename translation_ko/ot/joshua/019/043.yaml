    reason: lexical_alternative
  - marker: b
    text: 팀나는 영어 POB의 Timnah에 대응하는 음역입니다. 영어 각주는 Timnathah 또는 Timnath로 더 형식적으로 옮길 수 있다고 밝혔습니다.
    reason: lexical_alternative
