  edition: WLC
  text: וַ/יְהִ֥י לָ/הֶ֖ם בְּ/נַֽחֲלָתָ֑/ם בְּאֵֽר שֶׁ֥בַע וְ/שֶׁ֖בַע וּ/מוֹלָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/002.yaml
  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Beer-sheba and Sheba.'' Some understand this as a single place name (''Beer-sheba'') with a textual or stylistic irregularity rather than two separate towns.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그들의 기업 안에는 브엘세바, 세바, 그리고 몰라다가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘브엘세바와 세바’로 읽히며, 어떤 이들은 이를 두 도시가 아니라 ‘브엘세바’ 하나의 지명으로 보는 본문상의 불규칙 또는 문체적 현상으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  english_pob_choice: And they had
  chosen_korean: 그리고 그들의 기업 안에는 …이 있었습니다
  alternatives_korean:
  - 그리고 그들에게 있었습니다
  - 그리고 그들의 몫이었습니다
  lexicon: HALOT
  rationale: 할당 목록의 관용구를 한국어에서는 소유·배정을 드러내는 자연스러운 서술로 옮겼습니다. '있었습니다'는 목록 문맥에서 배정된 토지를 간결하게 나타냅니다.
- source_word: בְּנַחֲלָתָם
  english_pob_choice: in their inheritance
  chosen_korean: 그들의 기업 안에
  alternatives_korean:
  - 그들의 기업 가운데
  - 그들의 할당된 기업 안에
  lexicon: HALOT
  rationale: נחלה는 상속된 몫, 곧 지파에게 배정된 토지를 뜻하므로, 본문 흐름을 살려 '기업'으로 옮기고 위치 개념은 '안에'로 반영했습니다.
- source_word: בְּאֵר שֶׁבַע
  english_pob_choice: Beer-sheba
  chosen_korean: 브엘세바
  alternatives_korean:
  - 브에르세바
  - 베르세바
  lexicon: 고유명사
  rationale: 지명은 현대 한국어 음역 관행에 따라 옮겼으며, 한국 성경 독자에게 널리 알려진 형태를 우선했습니다.
- source_word: וְשֶׁבַע
  english_pob_choice: Sheba
  chosen_korean: 세바
  alternatives_korean:
  - 그리고 세바
  - 스헤바
  lexicon: 고유명사
  rationale: 히브리어 본문은 브엘세바 뒤에 별도의 지명처럼 '세바'를 이어 붙이며, 영어 POB도 이를 별도 항목으로 처리합니다. 한국어에서도 목록 항목으로 간단히 음역했습니다.
- source_word: וּמוֹלָדָה
  english_pob_choice: and Moladah
  chosen_korean: 그리고 몰라다가
  alternatives_korean:
  - 몰라다가
  - 그리고 모라다
  lexicon: 고유명사
  rationale: 지명은 음역하되, 마지막 항목 앞의 접속을 살려 목록의 리듬을 유지했습니다.
theological_decisions:
- issue: 본문의 브엘세바/세바 연결이 하나의 지명인지 두 지명인지
  chosen_reading: 본문의 표면형을 따라 브엘세바, 세바를 별도 항목으로 유지했습니다.
  alternative_readings:
  - 브엘세바 하나만 가리키는 것으로 이해하여 '브엘세바'만 적는 해석
  - 브엘세바와 세바를 결합된 한 지명으로 보는 해석
  rationale: 영어 POB가 본문상의 어색함을 주석으로 남기듯, 한국어 본문도 원문 배열을 보존하고 독자가 후대 해석 가능성을 주석에서 확인하도록 하는 편이 원문 추적성에 유리합니다.
  doctrine_reference: 본문비평/지명 목록 해석
