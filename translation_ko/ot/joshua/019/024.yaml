  source_fidelity: ‘제비가 나왔다’는 핵심 동작과 다섯째라는 순서는 잘 반영되어 있습니다. 다만 לְמִשְׁפְּחֹתָם는 지파 안의 씨족·가문 단위를 가리키므로 ‘종족’은 민족/ethnicity의 뜻으로 읽힐 가능성이 있어 더 정확한 표현으로 고칠 필요가 있습니다.
  naturalness: ‘아셀의 자손 지파’는 수식 관계가 다소 불분명하고 현대 한국어에서 매끄럽지 않습니다. ‘아셀 자손의 지파’가 원문의 ‘아셀의 자손의 지파’를 자연스럽고 정확하게 드러냅니다.
