  lexicon: HALOT
  rationale: 제비뽑기 문맥에서 결과가 ‘나왔다’는 표현이 히브리어의 동작 이미지를 자연스럽게 살리며, ‘뽑혔다’보다 덜 해석적입니다.
- source_word: הַגּוֹרָל
  english_pob_choice: lot
  chosen_korean: 제비
  alternatives_korean:
  - 분깃
  - 할당
  lexicon: HALOT
  rationale: 여호수아의 분배 공식에서 גּוֹרָל은 제비 자체와 그 결과를 가리키므로, 한국어에서는 가장 직접적인 ‘제비’가 원문 감각을 잘 보존합니다.
- source_word: לְמַטֵּה בְנֵי אָשֵׁר
  english_pob_choice: for the tribe of the sons of Asher
  chosen_korean: 아셀의 자손 지파에게
  alternatives_korean:
  - 아셀의 아들들 지파에게
  - 아셀 지파에게
  lexicon: HALOT
  rationale: מַטֶּה를 문맥상 ‘지파’로 옮기고, בְנֵי אָשֵׁר의 족보적 표현은 한국어에서 자연스러운 ‘아셀의 자손’으로 처리했습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 지파 내부의 하위 단위인 clan을 가리키므로, 현대 한국어에서 오해가 적은 ‘종족’으로 옮겨 분배 단위를 드러냈습니다.
