id: JOS.19.50
reference: Joshua 19:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
  footnotes:
  - marker: a
    text: 'Or: ''He built the city and lived in it.'' The Hebrew verb can mean either ''built'' or, in context, ''rebuilt/restored.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 명령에 따라 그들은 그가 요청한 성읍, 곧 에브라임 산지의 딤낫세라를 그에게 주었습니다. 그가 그 성읍을 지어[a] 그곳에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 성읍을 다시 지어.” 히브리어 동사는 기본적으로 “짓다”를 뜻하지만, 이미 언급된 성읍이라는 문맥에서는 “다시 짓다”로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  english_pob_choice: At the command of Yahweh
  chosen_korean: 여호와의 명령에 따라
  alternatives_korean:
  - 여호와의 말씀대로
  - 여호와의 입에 따라
  - 여호와의 지시에 따라
  lexicon: HALOT
  rationale: 관용구 עַל־פִּי는 문자적으로는 ‘입에 따라’이지만, 문맥상 권위 있는 명령·지시를 뜻하므로 한국어에서는 자연스럽게 ‘명령에 따라’로 옮겼습니다.
- source_word: נָתְנוּ לוֹ
  english_pob_choice: they gave him
  chosen_korean: 그들은 … 그에게 주었습니다
  alternatives_korean:
  - 그들은 … 그에게 주었다
  - 그들은 … 그에게 허락했습니다
  - 그들은 … 그에게 건네주었습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미를 살려 단순하고 직접적인 ‘주었습니다’를 택했고, 간접목적어 ‘לוֹ’를 한국어 어순에 맞게 ‘그에게’로 처리했습니다.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  english_pob_choice: the city that he asked for
  chosen_korean: 그가 요청한 성읍
  alternatives_korean:
  - 그가 부탁한 성읍
  - 그가 구한 성읍
  - 그가 달라고 한 성읍
  lexicon: HALOT
  rationale: שׁאל은 כאן ‘요청하다/달라고 하다’의 뜻이므로, 공손하지만 과도하게 약화하지 않는 ‘요청한’이 적절합니다.
- source_word: תִּמְנַת סֶרַח
  english_pob_choice: Timnath-serah
  chosen_korean: 딤낫세라
  alternatives_korean:
  - 팀낫세라
  - 딤낫 세라
  lexicon: KO_BIBLE_NAMES
  rationale: 지명은 한국어 음역으로 처리했고, 본문 가독성을 위해 기존 성경식으로 널리 읽히는 형태를 택했습니다.
- source_word: בְּהַר אֶפְרָיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 산지
  - 에브라임의 산골짜기
  - 에브라임의 산악 지대
  lexicon: HALOT
  rationale: הַר는 이 문맥에서 단일 산보다 ‘산지/산악 지대’의 뜻이 자연스러우므로, ‘에브라임 산지’로 간결하게 옮겼습니다.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  english_pob_choice: He built the city
  chosen_korean: 그가 그 성읍을 건축하고
  alternatives_korean:
  - 그가 그 성읍을 세우고
  - 그가 그 성읍을 지어
  - 그가 그 성읍을 건설하고
  lexicon: HALOT
  rationale: בנה의 기본 의미인 ‘건축하다/짓다’를 보존했습니다. 주어진 성읍을 새로 손질했는지 여부를 본문이 단정하지 않으므로 ‘재건하다’는 덧붙이지 않았습니다.
- source_word: וַיֵּשֶׁב בָּהּ
  english_pob_choice: and lived in it
  chosen_korean: 거기에서 살았습니다
  alternatives_korean:
  - 거기에서 거주했습니다
  - 거기에서 머물렀습니다
  - 그 안에 살았습니다
  lexicon: HALOT
  rationale: ישׁב의 기본 의미를 현대 한국어로 자연스럽게 살리되, 성읍 내부라는 관계를 드러내기 위해 ‘거기에서’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절의 히브리어 본문은 여호와의 이름을 직접 쓰므로, 한국어 본문에서는 전통적 가독성을 고려해 ‘여호와’로 옮겼습니다. 다만 이는 번역 관행 선택이며, 원문상 고유명사를 지칭합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: ‘건축하다’ vs ‘재건하다’
  chosen_reading: 건축하고
  alternative_readings:
  - 재건하고
  - 다시 지어
  rationale: 히브리어 בנה는 이 절에서 단순히 ‘짓다/건축하다’로 말할 수 있으며, 본문 자체가 ‘재건’ 여부를 명시하지 않으므로 의미를 과잉 해석하지 않았습니다.
  doctrine_reference: Source-language lexical restraint
