id: JOS.19.17
reference: Joshua 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/יִ֨שָּׂשכָ֔ר יָצָ֖א הַ/גּוֹרָ֣ל הָֽ/רְבִיעִ֑י לִ/בְנֵ֥י יִשָּׂשכָ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
  footnotes:
  - marker: a
    text: Or 'for the people/descendants of Issachar.' The Hebrew reads 'for the sons of Issachar,' a standard tribal descent expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their families.'
    reason: lexical_alternative
translation:
  language: ko
  text: 잇사갈을 위하여 네 번째 제비가 나왔습니다. 잇사갈 자손의 가문별로입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  english_pob_choice: For Issachar
  chosen_korean: 잇사갈을 위하여
  alternatives_korean:
  - 잇사갈에게
  - 잇사갈을 위한
  lexicon: HALOT
  rationale: 지파에게 몫이 배정되는 분배 문맥이므로 ‘을 위하여’가 자연스럽고, 단순한 대상 표지보다 배당의 방향을 드러냅니다.
- source_word: יָצָא הַגּוֹרָל
  english_pob_choice: the fourth lot came out
  chosen_korean: 네 번째 제비가 나왔습니다
  alternatives_korean:
  - 네 번째 제비가 나왔습니다
  - 네 번째 몫이 나왔습니다
  - 네 번째로 뽑힌 제비가 나왔습니다
  lexicon: HALOT
  rationale: 제비뽑기 이미지를 살리기 위해 ‘제비가 나왔습니다’로 옮기되, 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: לִבְנֵי יִשָּׂשכָר
  english_pob_choice: for the sons of Issachar
  chosen_korean: 잇사갈 자손의
  alternatives_korean:
  - 잇사갈의 아들들의
  - 잇사갈 후손의
  lexicon: HALOT
  rationale: בני는 직역하면 ‘아들들’이지만, 지파 계보·분배 공식어로는 ‘자손’이 표준적이고 의미도 정확합니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 가문별로입니다
  alternatives_korean:
  - 씨족별로입니다
  - 가족별로입니다
  - 가문에 따라입니다
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 지파 내 하위 구분을 가리키므로, 현대 한국어에서 ‘가문’이 ‘family’보다 더 사회-족속적 구조를 잘 반영합니다.
theological_decisions:
- issue: 지파 분배 공식문의 문체
  chosen_reading: 서술문으로 평서하되, 제비뽑기 결과를 객관적으로 보고하는 문체를 유지했습니다.
  alternative_readings:
  - ‘…나왔습니다’보다 더 직설적인 ‘…가 나왔습니다’
  rationale: 본문은 신학적 해석보다 분배 결과의 공식 보고에 가깝기 때문에, 과장 없이 간명한 서술이 적합합니다.
  doctrine_reference: '본문 장르: 역사 서술/분배 기록'
