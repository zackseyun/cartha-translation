  source_fidelity: 히브리어의 배당 공식—잇사갈을 위한 넷째 제비와 잇사갈 자손의 씨족별 구분—는 초안에 대체로 반영되어 있습니다. 다만 마지막 구절은 원문의 배당 관계를 완결된 한국어 문장으로 명확히 표현할 필요가 있습니다.
