id: JOS.19.29
reference: Joshua 19:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
  footnotes:
  - marker: a
    text: Or 'westward'; the Hebrew literally says 'toward the sea,' a common geographic expression for the western direction.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the district/territory of Achzib.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 라마로 돌아서 견고한 성 두로까지 이르렀습니다. 또 그 경계는 호사로 돌아섰고, 그 끝 지점들은 악십 지방[b]에서 바다 쪽[a]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서쪽으로’. 히브리어는 문자적으로 ‘바다를 향해’라고 하며, 이는 서쪽 방향을 가리키는 흔한 지리 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악십의 구역/영토에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  english_pob_choice: Then the border turned
  chosen_korean: 경계가 …로 돌아섰다
  alternatives_korean:
  - 경계가 …로 돌았다
  - 경계가 …로 향했다
  lexicon: HALOT
  rationale: 경계선이 방향을 바꾸는 지리적 공식을 자연스럽게 살리면서, שוב의 반복적·도식적 용법을 한국어로 압축해 옮겼습니다.
- source_word: עִיר מִבְצַר צֹר
  english_pob_choice: the fortified city of Tyre
  chosen_korean: 견고한 성 צור
  alternatives_korean:
  - 요새화된 도시 צור
  - 방어가 튼튼한 도시 צור
  lexicon: HALOT
  rationale: עִיר מִבְצַר은 단순한 도시가 아니라 방어 시설을 갖춘 성격을 강조하므로, ‘견고한 성’으로 압축해 공고함을 드러냈습니다.
- source_word: ו/יהיו תֹצְאֹתָי/ו הַיָּמָּה
  english_pob_choice: its boundary points were at the sea
  chosen_korean: 그 경계의 끝은 바다에
  alternatives_korean:
  - 그 경계의 끝은 바다를 향해
  - 그 경계의 출구들은 바다에
  lexicon: HALOT
  rationale: תֹצְאֹתָיו는 경계의 말단·끝 지점을 뜻하므로 ‘경계의 끝’으로 옮겼고, הַיָּמָּה는 관용적으로 서쪽을 뜻할 수 있으나 본문의 구체적 이미지를 살려 ‘바다에’로 렌더링했습니다.
- source_word: מֵחֶבֶל אַכְזִיב
  english_pob_choice: from the region of Achzib
  chosen_korean: 악십 지방에서
  alternatives_korean:
  - 악십 지역에서
  - 악십 영토에서
  lexicon: HALOT
  rationale: חֶבֶל은 경계 문맥에서 측량된 구획·지방을 가리킬 수 있어, 행정적 뉘앙스를 과도하게 좁히지 않는 ‘지방’으로 처리했습니다.
theological_decisions:
- issue: 지명 음역과 익숙한 한국어 관용형 사이의 선택
  chosen_reading: 라마, 호사, 악십은 음역을 유지하고, צור는 본문 관용을 고려해 히브리어 표기 대신 지명 의미를 살린 ‘성’ 표현과 함께 병기하지 않았습니다.
  alternative_readings:
  - 통상적 교회식 지명 표기만 사용
  - 모든 지명을 현대 한국어 음역만으로 통일
  rationale: 이 절은 족장 서사적 명단이 아니라 경계 목록이므로, מקור 지명의 식별성과 경계 묘사를 우선해 과도한 관용화보다 원문 지리성을 유지하는 편이 더 적절합니다.
  doctrine_reference: 지리·역사 본문 번역 원칙
- issue: הַיָּמָּה의 방향성 해석
  chosen_reading: ‘바다에’로 옮겨 원문의 공간 이미지를 우선했고, 서쪽 방향이라는 해석은 각주로 처리했습니다.
  alternative_readings:
  - 서쪽으로
  - 바다를 향해
  rationale: 문맥상 방향값을 띨 수 있지만, 본문 자체는 ‘바다’라는 구체적 기준점을 사용하므로, 본문에는 이미지적 표현을 남기고 방향 해석은 주석에서 설명하는 것이 가장 투명합니다.
  doctrine_reference: 본문-주석 구분 원칙
