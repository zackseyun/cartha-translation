  terminology: ‘스불론’, ‘사릿’의 음역은 한국어 성경 전통과 조화롭고, ‘제비’, ‘씨족’, ‘기업’, ‘경계’는 원문의 행정·토지 분배 용어를 적절히 전달합니다. 각주도 본문의 어휘적 대안을 설명할 뿐 해석을 과도하게 덧붙이지 않습니다.
