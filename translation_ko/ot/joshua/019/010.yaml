  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
  footnotes:
  - marker: a
    text: Or 'was drawn' for 'came up'; the Hebrew literally says 'went up/came up' of the lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 세 번째 제비가 스불론 자손[a]에게 그들의 씨족대로 나왔고, 그들의 기업의 경계는 사릿까지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뽑혔습니다”로 옮길 수 있습니다. 히브리어는 제비가 ‘올라오다/나오다’라고 직역되는 표현을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל הַגּוֹרָל
  english_pob_choice: the third lot came up
  chosen_korean: “세 번째 제비가 … 나왔고”
  alternatives_korean:
  - 세 번째 제비가 뽑혔고
  - 세 번째 제비가 올라왔고
  lexicon: HALOT
  rationale: לעלות/עלה는 제비가 ‘올라오다/나오다’라는 이미지를 살리므로, 한국어에서는 자연스러운 “나왔고”로 옮겨 영어 POB의 ‘came up’과 같은 감각을 유지했습니다.
- source_word: לִבְנֵי זְבוּלֻן
  english_pob_choice: for the sons of Zebulun
  chosen_korean: “스불론 자손”
  alternatives_korean:
  - 스불론의 아들들
  - 스불론 사람들
  lexicon: HALOT
  rationale: 지파 분배 문맥의 관용 표현을 살리되, 한국어 성경에서 익숙한 지파 명칭 형식을 따라 “자손”으로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: “그들의 씨족대로”
  alternatives_korean:
  - 그들의 가문대로
  - 그들의 가족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 가족보다 지파 내부의 씨족 단위를 가리키므로, ‘clans’의 사회구조를 드러내는 “씨족”을 선택했습니다.
- source_word: גְּבוּל נַחֲלָתָם עַד שָׂרִיד
  english_pob_choice: the border of their inheritance was as far as Sarid
  chosen_korean: “그들의 기업의 경계는 사릿까지였습니다”
  alternatives_korean:
  - 그들의 기업의 경계는 사릿에 이르렀습니다
  - 그들의 소유 경계는 사릿까지였습니다
  lexicon: HALOT
  rationale: גְּבוּל은 지경/경계선의 뜻이므로 “경계”로, נַחֲלָה는 분배된 땅을 가리키므로 “기업”으로 옮겨 분배 문맥을 유지했습니다.
theological_decisions:
- issue: 제비뽑기 서술의 우연성 vs 하나님의 주권
  chosen_reading: 본문은 제비가 ‘나왔다’고 서술하여 사건의 표면상 절차를 기록하지만, 번역에서는 신학적 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님이 제비를 주관하셨다고 명시적으로 풀어씀
  - 운명적 표현으로 의역
  rationale: 히브리어 본문 자체의 서술을 보존하는 것이 우선이며, 주권 신학은 문맥 전체에서 읽히도록 두는 편이 source-direct합니다.
  doctrine_reference: 잠 16:33; 민 26–34의 땅 분배 문맥
