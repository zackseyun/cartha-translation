  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
  footnotes:
  - marker: a
    text: Hebrew 'and Judah at the Jordan toward the east.' The geography is difficult, since Naphtali did not directly border the tribal territory of Judah in the usual sense. Some understand the wording differently or suspect textual difficulty, but the Hebrew text is translated as it stands.
    reason: textual_variant
translation:
  language: ko
  text: 그 경계는 서쪽으로 아스놋-다볼로 돌아가고, 거기서부터 후곡으로 나아가며, 남쪽으로 스불론에 닿고, 서쪽으로 아셀에 닿으며, 요단 강과 해가 뜨는 동쪽의 유다에 이릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그리고 요단 강과 해가 뜨는 동쪽의 유다’라고 되어 있습니다. 지리적으로는 난점이 있는데, 납달리가 통상적 의미에서 유다 지파의 영토와 직접 맞닿지는 않습니다. 어떤 이들은 표현을 다르게 이해하거나 본문상의 어려움을 의심하지만, 여기서는 히브리어 본문을 있는 그대로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל יָמָּה
  english_pob_choice: Then the border turned westward
  chosen_korean: 그 경계는 서쪽으로 … 돌아가고
  alternatives_korean:
  - 그 경계는 서쪽으로 향하고
  - 그 경계는 서쪽으로 돌아서
  lexicon: HALOT
  rationale: 경계선 묘사에서 שׁוּב은 단순한 ‘되돌아감’보다 방향 전환을 뜻하므로, 자연스러운 한국어로 ‘돌아가고’라고 옮겼습니다.
- source_word: אַזְנוֹת תָּבוֹר
  english_pob_choice: Aznoth-tabor
  chosen_korean: 아스놋-다볼
  alternatives_korean:
  - 아즈놋-다볼
  - 아스놋 타볼
  lexicon: 고유명사 표기
  rationale: 지명은 음역하되 현대 외래어 표기 관행에 맞춰 연결부호를 사용했습니다.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  english_pob_choice: and from there it went out to Hukkok
  chosen_korean: 거기서부터 후곡으로 나아가며
  alternatives_korean:
  - 거기서부터 후곡으로 나가며
  - 거기서부터 후곡에 이르며
  lexicon: HALOT
  rationale: יצא는 경계선이 다음 지점으로 진행하는 공식을 이루므로 ‘나아가며’가 문맥상 가장 자연스럽고, 이어지는 연결을 살립니다.
- source_word: וּפָגַע בִּזְבֻלוּן מִנֶּגֶב וּבְאָשֵׁר פָּגַע מִיָּם
  english_pob_choice: and it reached Zebulun on the south, and it reached Asher on the west
  chosen_korean: 남쪽으로 스불론에 닿고, 서쪽으로 아셀에 닿으며
  alternatives_korean:
  - 스불론 남쪽에 닿고, 아셀 서쪽에 닿으며
  - 남쪽의 스불론에 접하고, 서쪽의 아셀에 접하며
  lexicon: HALOT
  rationale: פגע는 경계가 다른 영토와 맞닿는 뜻이므로 ‘닿고’로 옮겼고, מִנֶּגֶב/מִיָּם은 각각 남쪽·서쪽 방향을 분명히 드러냈습니다.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  english_pob_choice: and Judah at the Jordan toward the east, where the sun rises
  chosen_korean: 요단 강과 해가 뜨는 동쪽의 유다에 이릅니다
  alternatives_korean:
  - 요단 강과 해가 뜨는 동쪽의 유다에 닿습니다
  - 요단 강, 곧 해가 뜨는 동쪽의 유다에 이릅니다
  lexicon: HALOT
  rationale: 히브리어의 지리적으로 난해한 표현을 본문 그대로 보존했으며, ‘해가 뜨는 동쪽’은 מִזְרַח הַשָּׁמֶשׁ의 이미지를 살린 번역입니다.
theological_decisions:
- issue: 지리적으로 난해한 ‘유다’ 표기
  chosen_reading: 본문의 마소라 본문 표현을 본문에서 조정하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 지리적 난점을 해소하기 위해 ‘유다’ 대신 다른 지명으로 완화하는 해석
  - 본문을 매끄럽게 만들기 위한 추정적 수정
  rationale: 이 구절은 교리 문제가 아니라 본문 전승과 지리 난점의 문제이므로, 원문이 가진 긴장을 유지하는 편이 번역 원칙에 더 부합합니다.
  doctrine_reference: 번역 철학 §1, §3, §5
