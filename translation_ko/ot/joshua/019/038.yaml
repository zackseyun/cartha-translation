  text: וְ/יִרְאוֹן֙ וּ/מִגְדַּל אֵ֔ל חֳרֵ֥ם וּ/בֵית עֲנָ֖ת וּ/בֵ֣ית שָׁ֑מֶשׁ עָרִ֥ים תְּשַֽׁע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
  footnotes:
  - marker: a
    text: Migdal-el is a place name; literally, the components could mean 'tower of God/El.'
    reason: lexical_alternative
  - marker: b
    text: Beth-anath and Beth-shemesh are transliterated place names; literally, 'house of Anath' and 'house of the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이론, 믹달엘, 호렘, 벳아낫, 벳세메스가 있었습니다. 모두 열아홉 성읍이었고, 그들의 마을들이 딸려 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  english_pob_choice: and Yiron
  chosen_korean: 그리고 이론
  alternatives_korean:
  - 그리고 이론
  - 그리고 이리온
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 방침을 따랐고, 영어 POB의 Yiron에 맞춰 한국어에서는 ‘이론’으로 옮겼습니다.
- source_word: וּ/מִגְדַּל אֵל
  english_pob_choice: Migdal-el
  chosen_korean: 믹달엘
  alternatives_korean:
  - 믹달엘
  - 믹달-엘
  - 하나님의 망대
  lexicon: HALOT
  rationale: 지명으로 굳어진 복합어이므로 뜻풀이보다 음역을 유지했고, 내부 요소 ‘엘’을 살리되 한국어 표기상 붙여 썼습니다.
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍이었고
  alternatives_korean:
  - 도시였고
  - 읍이었고
  lexicon: HALOT
  rationale: 토지 분배 목록에서 עָרִים는 한국어 성경 관용에 맞는 ‘성읍’이 가장 자연스럽습니다.
- source_word: וְ/חַצְרֵי/הֶן
  english_pob_choice: with their villages
  chosen_korean: 그들의 마을들이 딸려 있었습니다
  alternatives_korean:
  - 그들의 마을들이 있었습니다
  - 그들의 촌락이 딸려 있었습니다
  lexicon: HALOT
  rationale: חַצְרֵי는 이 문맥에서 성읍에 속한 부속 거주지를 가리키므로, 영어 POB의 ‘villages’를 반영해 ‘마을들이 딸려 있었습니다’로 옮겼습니다.
