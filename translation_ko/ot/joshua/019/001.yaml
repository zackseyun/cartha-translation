  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
  footnotes:
  - marker: a
    text: Or 'The second lot fell to Simeon.' The Hebrew verb is literally 'came out,' used here for the result of casting lots.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Simeon'' and ''sons of Judah'' are Hebrew tribal designations; they refer to the descendants or members of those tribes.'
    reason: cultural_note
translation:
  language: ko
  text: 둘째 제비가 시므온에게, 곧 시므온 자손의 지파에게, 그들의 종족에 따라 나왔습니다[a]. 그들의 기업은 유다 자손의 기업 안에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “둘째 제비가 시므온에게 떨어졌습니다.” 히브리어 동사는 직역하면 “나왔다”이며, 여기서는 제비뽑기의 결과를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  english_pob_choice: The second lot came out
  chosen_korean: 둘째 제비가 … 돌아왔습니다
  alternatives_korean:
  - 둘째 제비가 나왔습니다
  - 둘째 제비가 떨어졌습니다
  lexicon: HALOT
  rationale: 제비뽑기 문맥에서 וַיֵּצֵא의 직역 이미지를 살리되, 한국어에서는 결과를 자연스럽게 드러내는 ‘돌아오다’를 사용해 ‘came out’의 투명성을 유지했습니다.
- source_word: לְשִׁמְעוֹן / לְמַטֵּה בְנֵי שִׁמְעוֹן
  english_pob_choice: for Simeon, for the tribe of the sons of Simeon
  chosen_korean: 시므온에게, 곧 시므온 자손의 지파에게
  alternatives_korean:
