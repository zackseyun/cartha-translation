reference: Joshua 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
  footnotes:
  - marker: a
    text: Or 'The second lot fell to Simeon.' The Hebrew verb is literally 'came out,' used here for the result of casting lots.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Simeon'' and ''sons of Judah'' are Hebrew tribal designations; they refer to the descendants or members of those tribes.'
    reason: cultural_note
translation:
  language: ko
  text: 둘째 제비가 시므온에게, 곧 시므온 자손의 지파에게, 그들의 종족대로 돌아왔습니다[a]. 그들의 기업은 유다 자손의 기업 안에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “돌아왔습니다”는 제비뽑기 결과를 가리키는 히브리어 동사 ‘came out’의 투명한 대응입니다. 전통적 번역의 “떨어졌습니다”보다 원문 이미지를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  english_pob_choice: The second lot came out
  chosen_korean: 둘째 제비가 … 돌아왔습니다
  alternatives_korean:
  - 둘째 제비가 나왔습니다
  - 둘째 제비가 떨어졌습니다
  lexicon: HALOT
  rationale: 제비뽑기 문맥에서 וַיֵּצֵא의 직역 이미지를 살리되, 한국어에서는 결과를 자연스럽게 드러내는 ‘돌아오다’를 사용해 ‘came out’의 투명성을 유지했습니다.
- source_word: לְשִׁמְעוֹן / לְמַטֵּה בְנֵי שִׁמְעוֹן
  english_pob_choice: for Simeon, for the tribe of the sons of Simeon
  chosen_korean: 시므온에게, 곧 시므온 자손의 지파에게
  alternatives_korean:
  - 시므온에게, 곧 시므온의 지파에게
  - 시므온에게, 곧 시므온 자손 지파에게
  lexicon: HALOT
  rationale: ל-의 수혜/배분 대상을 ‘-에게’로 풀고, מַטֶּה를 ‘지파’로 옮겨 분배 문맥을 분명히 했습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 현대의 ‘가족’보다 큰 족속 단위를 가리키므로, ‘종족’으로 옮겨 부족·씨족적 범위를 드러냈습니다.
- source_word: נַחֲלָתָם בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  english_pob_choice: their inheritance was within the inheritance of the sons of Judah
  chosen_korean: 그들의 기업은 유다 자손의 기업 안에 있었습니다
  alternatives_korean:
  - 그들의 기업은 유다 자손의 기업 가운데 있었습니다
  - 그들의 기업은 유다 자손의 땅 안에 있었습니다
  lexicon: HALOT
  rationale: נַחֲלָה를 일관되게 ‘기업’으로 옮겨 상속된 토지 분배의 의미와 언약적 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: ‘sons of Simeon / sons of Judah’의 부족 명칭 처리
  chosen_reading: 족보적 표현을 그대로 살려 ‘시므온 자손’, ‘유다 자손’으로 번역했습니다.
  alternative_readings:
  - 시므온 사람들
  - 유다 사람들
  rationale: 히브리어의 부족 명칭을 평준화하지 않고, 공동체의 혈연·언약적 정체성을 드러내는 표현을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 언약 공동체와 지파 정체성의 표지
