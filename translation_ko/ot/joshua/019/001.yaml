  - 시므온에게, 곧 시므온 자손 지파에게
  lexicon: HALOT
  rationale: ל-의 수혜/배분 대상을 ‘-에게’로 풀고, מַטֶּה를 ‘지파’로 옮겨 분배 문맥을 분명히 했습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 현대의 ‘가족’보다 큰 족속 단위를 가리키므로, ‘종족’으로 옮겨 부족·씨족적 범위를 드러냈습니다.
- source_word: נַחֲלָתָם בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  english_pob_choice: their inheritance was within the inheritance of the sons of Judah
  chosen_korean: 그들의 기업은 유다 자손의 기업 안에 있었습니다
  alternatives_korean:
  - 그들의 기업은 유다 자손의 기업 가운데 있었습니다
  - 그들의 기업은 유다 자손의 땅 안에 있었습니다
  lexicon: HALOT
  rationale: נַחֲלָה를 일관되게 ‘기업’으로 옮겨 상속된 토지 분배의 의미와 언약적 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: ‘sons of Simeon / sons of Judah’의 부족 명칭 처리
  chosen_reading: 족보적 표현을 그대로 살려 ‘시므온 자손’, ‘유다 자손’으로 번역했습니다.
  alternative_readings:
  - 시므온 사람들
  - 유다 사람들
  rationale: 히브리어의 부족 명칭을 평준화하지 않고, 공동체의 혈연·언약적 정체성을 드러내는 표현을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 언약 공동체와 지파 정체성의 표지
