lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... was
  chosen_korean: …이었습니다
  alternatives_korean:
  - …였습니다
  - …이었습니다, 그리고
  lexicon: HALOT
  rationale: 경계 목록을 소개하는 서술형 wayyiqtol을 한국어에서는 자연스럽게 과거 서술로 옮기되, 문맥상 이어지는 느낌을 살리기 위해 ‘이었습니다’를 선택했습니다.
- source_word: גְּבוּלָם
  english_pob_choice: their border
  chosen_korean: 그들의 경계
  alternatives_korean:
  - 그들의 경계선
  - 그들의 지경
  lexicon: HALOT
  rationale: 할당 지파의 경계선이라는 의미를 간결하게 드러내는 기본 대응어로 ‘경계’를 택했습니다.
- source_word: חֶלְקַת
  english_pob_choice: Helkath
  chosen_korean: 헬깟
  alternatives_korean:
  - 헬카트
  - 헬깟(Helkath)
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하되, 현행 한국어 표기에서 읽기 쉬운 형태로 옮겼습니다.
- source_word: וְאַכְשָׁף
  english_pob_choice: Akshaph
  chosen_korean: 악삽
  alternatives_korean:
  - 악사프
  - 아크삽
  lexicon: HALOT
  rationale: פּ/שׁ가 섞인 히브리어 지명을 한국어 음가에 맞게 옮겨, 전통 교회 표기보다 원음에 가까운 현대 음역을 택했습니다.
