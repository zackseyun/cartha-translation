    issue: ‘벳엔’ 음역
    rationale: בֶטֶן은 Beten이며, ‘벳엔’은 히브리어 지명의 모음·음절 구성을 충실히 반영하지 못합니다. 한국어 성서 표기 관례에 맞추어 ‘베덴’으로 고칩니다.
  - severity: low
    issue: ‘헬깟’ 표기
    rationale: חֶלְקַת의 한국어 성서식·관용 표기는 ‘헬갓’입니다. 동일 지명을 독자가 알아볼 수 있도록 이 표기를 사용합니다.
  - severity: low
    issue: 불필요하고 범위가 넓은 각주 표지
