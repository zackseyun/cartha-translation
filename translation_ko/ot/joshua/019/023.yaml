  rationale: 표준 인명 표기인 ‘잇사갈’을 적용했습니다. ‘씨족별로 받은 기업’으로 לְמִשְׁפְּחֹתָם과 토지 분배 문맥을 자연스럽게 반영하되, 성읍들과 촌락들이 기업을 풀어 설명하는 원문의 동격 관계를 보존했습니다. 원문에 명시되지 않은 ‘주변’과 중복된 ‘받은’을 제거했으며, 각주도 히브리어 무동사절과 한국어의 문맥적 표현을 정확히 설명하도록 수정했습니다.
