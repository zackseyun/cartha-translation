base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
  footnotes:
  - marker: a
    text: Or 'This is the inheritance ...' The Hebrew is a verbless clause; English may render it with either present or past tense in this summary formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 이사갈 자손의 지파가 받은 기업이니, 곧 그들의 씨족에 따라 받은 성읍들과 그 주변 촌락들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동사 없는 명사절이므로, 한국어에서는 ‘입니다/이니’처럼 현재형 또는 완료적 서술로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This was
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  - 이는
  lexicon: HALOT
  rationale: 히브리어는 서술동사 없는 명사절이지만, 한국어는 자연스러운 지시문으로 처리하는 것이 좋으므로 ‘이것은’으로 옮겼습니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 기업이니
  alternatives_korean:
  - 상속분입니다
  - 할당받은 땅입니다
  lexicon: HALOT
  rationale: 여호수아서의 지파 토지 분배 문맥에서 ‘기업’은 covenantal land allotment의 의미를 잘 보존합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 종족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 가족보다 지파 내부의 씨족 단위를 가리키므로, ‘씨족’이 가장 정확합니다.
- source_word: וְחַצְרֵיהֶן
  english_pob_choice: and their villages
  chosen_korean: 그 주변 촌락들
  alternatives_korean:
  - 그들의 마을들
  - 그들의 촌락들
  lexicon: HALOT
  rationale: חַצְרֵי는 성읍에 딸린 부속 거주지를 가리키므로, 단순한 ‘마을’보다 관계성을 드러내는 ‘주변 촌락들’이 적절합니다.
theological_decisions:
- issue: 이 절의 요약 공식을 한국어에서 시제 없이 처리할지 여부
  chosen_reading: 현재형 평서로 직역하지 않고, 문맥상 완료된 분배를 가리키는 서술로 처리했습니다.
  alternative_readings:
  - 이것이 이사갈 자손의 지파의 기업입니다
  - 이것은 이사갈 자손의 지파의 기업입니다
  rationale: 히브리어는 무동사 절이지만, 본문 전체의 분배 목록을 요약하는 종결 공식이므로 한국어에서는 완료된 결과를 자연스럽게 드러내는 표현이 더 적절합니다.
  doctrine_reference: 본문 해석상 시제보다 서술 기능이 핵심인 역사서 문체
