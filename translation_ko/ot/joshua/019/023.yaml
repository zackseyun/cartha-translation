  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
  footnotes:
  - marker: a
    text: Or 'This is the inheritance ...' The Hebrew is a verbless clause; English may render it with either present or past tense in this summary formula.
