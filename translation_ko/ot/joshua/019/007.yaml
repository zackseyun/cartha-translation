id: JOS.19.7
reference: Joshua 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֥יִן רִמּ֖וֹן וָ/עֶ֣תֶר וְ/עָשָׁ֑ן עָרִ֥ים אַרְבַּ֖ע וְ/חַצְרֵי/הֶֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
  footnotes:
  - marker: a
    text: 'Hebrew lists four place names: Ain, Rimmon, Ether, and Ashan. Some interpreters compare 1 Chronicles 4:32, where ''Ain, Rimmon'' may be understood together, affecting the count of the cities.'
    reason: cross_reference
translation:
  language: ko
  text: 아인과 림몬과 에델과 아산이니, 모두 네 성읍이며 그 주변 마을들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 아인, 림몬, 에델, 아산의 네 지명을 나열합니다. 다만 일부 해석은 1역대기 4:32를 참고하여 ‘아인, 림몬’을 한 묶음으로 보기도 하며, 그 경우 성읍 수를 다르게 계산할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  english_pob_choice: Ain
  chosen_korean: 아인
  alternatives_korean:
  - 아이눈
  - 샘
  lexicon: HALOT
  rationale: 지명으로 쓰였으므로 일반명사 뜻인 ‘샘’이 아니라 음역으로 옮겼습니다.
- source_word: רִמּוֹן
  english_pob_choice: Rimmon
  chosen_korean: 림몬
  alternatives_korean:
  - 르몬
  - 석류
  lexicon: HALOT
  rationale: 이곳도 지명으로 기능하므로 ‘석류’가 아니라 음역을 택했습니다.
- source_word: וָעֶתֶר
  english_pob_choice: Ether
  chosen_korean: 에델
  alternatives_korean:
  - 에터
  - 에테르
  lexicon: HALOT
  rationale: 지명 음역은 영어 POB의 표준형인 Ether를 따르되, 한국어 음역으로는 자연스러운 ‘에델’을 채택했습니다.
- source_word: עָרִים ... וְחַצְרֵיהֶן
  english_pob_choice: four cities, with their villages
  chosen_korean: 모두 네 성읍이며 그 주변 마을들
  alternatives_korean:
  - 모두 네 도시이며 그 마을들
  - 모두 네 성읍과 그 촌락들
  lexicon: HALOT
  rationale: ‘성읍’은 고대 이스라엘의 정착지 목록에서 ‘cities’보다 더 적절한 행정·지리적 뉘앙스를 전달하며, חַצְרֵיהֶן은 종속된 시골 거주지를 가리키므로 ‘주변 마을들’로 옮겼습니다.
theological_decisions:
- issue: 1열 4개 지명의 셈법과 병렬 구조
  chosen_reading: 본문의 네 성읍 목록을 그대로 살리고, 1역대 4:32와의 비교 가능성은 각주로만 남겼습니다.
  alternative_readings:
  - 아인과 림몬을 하나의 복합 지명처럼 묶어 세 성읍으로 처리
  - 본문 설명을 본문에 삽입해 شمار(숫자) 문제를 해소
  rationale: 히브리어 본문은 네 개의 지명을 병렬로 제시하고 있으므로, 본문 자체를 따라 번역하되 교차본문상의 해석 차이는 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 본문 비평 및 교차본문 처리 원칙
- issue: 성읍/마을의 행정적 관계
  chosen_reading: ‘그 주변 마을들’로 옮겨 मुख्य 도시와 부속 취락의 관계를 드러냈습니다.
  alternative_readings:
  - 그 촌락들
  - 그 정착지들
  rationale: חַצְרֵיהֶן은 단순한 지리적 부속지를 뜻하는 경우가 많아, 한국어로는 ‘주변 마을들’이 가장 자연스럽고 관계를 잘 보여줍니다.
  doctrine_reference: 지명·행정 용어 번역 원칙
