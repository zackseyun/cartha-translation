  source_fidelity: 수정 전 문안은 ‘그들의 씨족에 따라 받은 성읍들과 그 촌락들’이라고 하여 ‘받은’이 직접적으로 성읍들과 촌락들을 수식하게 합니다. 히브리어는 성읍들과 그 촌락들을 납달리 지파의 기업의 내용으로 제시하므로, ‘기업, 곧 …’으로 관계를 분명히 하는 편이 충실합니다. 또한 원문의 무시제 명사절은 한국어 현재형 요약문으로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘이니’와 ‘입니다’를 한 문장 안에 함께 쓰는 기존 종결은 현대 합쇼체에서 어색합니다. ‘…기업, 곧 …입니다’는 공식적이고 자연스러운 요약 문장입니다.
  terminology: ‘기업’, ‘지파’, ‘씨족’, ‘성읍’, ‘촌락’은 본문의 토지 분배 및 행정·혈연 단위를 적절히 반영합니다. ‘납달리 자손’은 בְּנֵי נַפְתָּלִי를 보존합니다.
