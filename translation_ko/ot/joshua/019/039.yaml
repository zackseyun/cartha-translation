source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
  footnotes:
  - marker: a
    text: Or 'This is the inheritance ...' The Hebrew demonstrative with nominal clause can be rendered in either present or past tense in English; the past fits the retrospective summary after the allotment list.
    reason: lexical_alternative
  - marker: b
    text: Lit. 'the sons of Naphtali.' This Hebrew tribal expression denotes the descendants/tribal members of Naphtali.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은[a] 납달리 자손[b] 지파가 씨족에 따라 받은 기업, 곧 성읍들과 그 촌락들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 명사절은 ‘이것은 …입니다’ 또는 문맥에 따라 ‘이것은 …이었습니다’로 옮길 수 있습니다. 여기서는 분배 목록을 마무리하는 요약 진술로 현재형을 사용했습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘납달리의 아들들’입니다. 이 표현은 납달리의 후손, 곧 납달리 지파의 구성원을 가리키는 지파 명칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת נַחֲלַת
  english_pob_choice: This was the inheritance
  chosen_korean: 이것은 … 기업이니
  alternatives_korean:
  - 이것은 … 상속받은 몫이니
  - 이것은 … 분배된 땅이니
  lexicon: HALOT
  rationale: 분배 목록을 마무리하는 요약 공식이므로, 현재형보다 문맥상 자연스러운 종결형으로 옮기되 ‘נַחֲלָה’의 언약적 토지 몫은 ‘기업’으로 살렸습니다.
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  english_pob_choice: the tribe of the sons of Naphtali
  chosen_korean: 납달리 자손 지파
  alternatives_korean:
  - 납달리의 자손들 지파
  - 납달리 사람들의 지파
  lexicon: HALOT
  rationale: ‘sons of Naphtali’의 혈연·지파 표현을 한국어 성경의 관용에 맞게 ‘자손 지파’로 옮겨, 문자성은 유지하면서도 어색한 직역을 피했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가문에 따라
  - 그들의 가족별로
  lexicon: HALOT
  rationale: 지파 분배 문맥의 מִשְׁפָּחָה는 일반적 ‘가족’보다 하위 단위인 ‘씨족’이 더 정확하며, 전치사 לְ는 분류 기준의 ‘-에 따라’로 자연스럽게 반영했습니다.
- source_word: הֶעָרִים וְחַצְרֵיהֶן
  english_pob_choice: the cities and their villages
  chosen_korean: 성읍들과 그 촌락들
  alternatives_korean:
  - 성읍들과 그 마을들
  - 도시들과 그 촌락들
  lexicon: HALOT
  rationale: עִיר는 수사적·역사적 문맥에서 보통 ‘성읍’이 적절하고, חָצֵר는 부속 거주지를 가리키므로 ‘촌락들’로 옮겨 도시 종속 정착지의 느낌을 살렸습니다.
theological_decisions:
- issue: 지파 목록의 종결 공식에서 시제와 문장 종결을 어떻게 처리할지
  chosen_reading: 한국어에서는 과거형 설명문이 아니라 현재 판독 가능한 요약 진술로 처리해, ‘이것은 … 기업이니’로 마무리했습니다.
  alternative_readings:
  - 이것은 … 기업이었습니다
  - 이것이 … 기업입니다
  rationale: 히브리어 명사절은 시제보다 진술의 성격이 중요하므로, 목록을 결론짓는 선언적 문체를 택해 원문의 요약 기능을 보존했습니다.
  doctrine_reference: 서술형 역사문 번역 원칙
