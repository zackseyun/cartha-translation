    rationale: לְמִשְׁפְּחֹתָם은 ‘기업’을 씨족별로 분배한 방식과 연결되며, 마지막 명사구는 그 기업의 성읍들과 촌락들을 밝힙니다. ‘기업, 곧’으로 이를 명확히 해야 합니다.
  - severity: low
    issue: 문장 종결의 문체 혼합
    rationale: ‘기업이니’ 뒤에 ‘입니다’를 잇는 방식은 현대 표준 합쇼체로 매끄럽지 않습니다.
  - severity: low
