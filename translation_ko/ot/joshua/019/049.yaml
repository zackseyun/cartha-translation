  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
  footnotes:
  - marker: a
    text: Or 'according to its borders.' The Hebrew can emphasize boundary lines as well as territorial divisions.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 땅을 그 경계에[a] 따라 기업으로 나누어 주는 일을 마쳤을 때, 이스라엘 자손[b]은 눈의 아들 여호수아에게 그들 가운데에 기업을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 경계에 따라’는 히브리어 גְּבוּלֹתֶיהָ가 경계선뿐 아니라 영토 구획을 가리킬 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어 직역형인 ‘이스라엘의 아들들’에 해당하며, 문맥상 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  english_pob_choice: When they finished apportioning
  chosen_korean: 그들이 땅을 그 경계들에 따라 나누어 기업으로 주는 일을 마치자
  alternatives_korean:
  - 그들이 땅을 나누어 기업으로 정하는 일을 마치자
  - 그들이 땅을 분배하여 기업으로 주는 일을 끝내자
  lexicon: HALOT
  rationale: 완료 동작과 분배·상속의 의미를 함께 살리기 위해 ‘마치자’와 ‘기업으로 주는 일’을 결합했습니다.
- source_word: לִגְבֻלֹתֶיהָ
  english_pob_choice: by its territories
  chosen_korean: 그 경계들에 따라
  alternatives_korean:
  - 그 지경들에 따라
  - 그 영역들에 따라
  - 그 경계에 따라
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 국경보다 경계선과 구획을 함께 가리킬 수 있어, 복수형의 뉘앙스를 살린 ‘경계들’이 가장 직접적입니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 한국어에서 자연스럽게 옮기면서도, 성경적 관용구로 널리 인식되는 표현을 선택했습니다.
- source_word: נַחֲלָה
  english_pob_choice: an inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속받을 몫
  - 유업
  - 소유
  lexicon: HALOT
  rationale: 문맥상 가나안 땅의 분배를 가리키는 언약적·법적 용어이므로, 한국어 성경 전통과 소스의 의미를 함께 반영하는 ‘기업’을 택했습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 한가운데서
  - 그들 사이에서
  lexicon: HALOT
  rationale: 여호수아의 기업이 이스라엘 공동체 안에서 주어졌음을 드러내는 가장 직접적인 현대 한국어 표현입니다.
theological_decisions:
- issue: 여호수아에게 주어진 몫의 성격
  chosen_reading: ‘기업’으로 옮겨 여호수아의 몫이 단순한 선물이 아니라 분배된 언약적 상속임을 드러냈습니다.
  alternative_readings:
  - ‘재산’으로 옮길 수 있습니다.
  - ‘소유’로 옮길 수 있습니다.
  rationale: 본문은 땅 분배 서술의 결말로서, 여호수아도 공동체 안에서 동일한 방식으로 몫을 받았다는 점을 강조합니다. ‘기업’이 그 신학적·법적 뉘앙스를 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 5
