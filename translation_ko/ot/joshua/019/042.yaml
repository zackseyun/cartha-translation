  source_fidelity: 히브리어는 세 지명을 접속사 וְ로 연결한 목록입니다. 초안의 ‘이드라’는 יִתְלָה의 음역으로는 가능하나, 한국어 성경 음역 관례와 히브리어의 무성 ת를 고려하면 ‘이들라’가 더 적절합니다. 또한 ‘샬라빈’은 שַׁעֲלַבִּין의 첫 모음군과 겹자음을 충분히 반영하지 못합니다.
