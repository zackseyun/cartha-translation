  to: 유다 자손[b]의 몫에서 시므온 자손의 기업이 나왔습니다[a]. 유다 자손의 몫이 그들에게 너무 컸기 때문입니다. 그래서 시므온 자손은 유다의 기업 안에서 자기들의 기업을 받았습니다[c].
  rationale: ‘너무 컸기’로 토지 몫의 크기를 자연스럽게 나타내고, 문장부호를 현대 표준어 문장 흐름에 맞게 바로잡았습니다. 또한 지파 명칭 관련 각주를 해당 명칭에 직접 연결했습니다. 그 밖에는 원문의 반복, 인과 관계, 그리고 시므온의 기업이 유다의 기업 내부에 있었다는 위치 관계를 유지했습니다.
