id: JOS.19.9
reference: Joshua 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
  footnotes:
  - marker: a
    text: Or 'from the territory of the sons of Judah.' The Hebrew חֶבֶל can denote a measured tract or region of land.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Judah' and 'the sons of Simeon,' a literal tribal designation that may also be rendered 'the tribe of Judah' and 'the tribe of Simeon.'
    reason: lexical_alternative
  - marker: c
    text: That is, Simeon's allotted land was located inside Judah's allotted territory.
    reason: cultural_note
translation:
  language: ko
  text: 유다 자손의 몫에서 시므온 자손의 기업이 나왔습니다[a]. 유다 자손의 몫이 그들에게 너무 많았기 때문입니다[b]; 그래서 시므온 자손은 유다의 기업 안에서 자기들의 기업을 받았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 자손의 지역에서’. 히브리어 חֶבֶל은 측량된 구획이나 토지 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘유다 자손’과 ‘시므온 자손’을 반복합니다. 필요하면 ‘유다 지파’와 ‘시므온 지파’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 시므온의 분배된 땅은 유다의 분배된 영토 안에 있었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  english_pob_choice: from the portion
  chosen_korean: 유다 자손의 몫에서
  alternatives_korean:
  - 유다 자손의 지역에서
  - 유다 자손의 땅에서
  - 유다 자손의 지경에서
  lexicon: HALOT
  rationale: חֶבֶל은 분배된 토지 구획을 가리킬 수 있으므로, 문맥에 맞게 ‘몫’으로 옮겨 기업 분배의 의미를 살렸습니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속받은 땅
  - 분배받은 몫
  - 유산
  lexicon: HALOT
  rationale: 여호수아의 지파 분배 문맥에서는 נַחֲלָה가 반복되는 토지 기업을 뜻하므로, 한국어 성경에서 자연스럽고 문맥에 맞는 ‘기업’을 택했습니다.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  english_pob_choice: the sons of Judah / the sons of Simeon
  chosen_korean: 유다 자손 / 시므온 자손
  alternatives_korean:
  - 유다의 지파 / 시므온의 지파
  - 유다 사람들 / 시므온 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역형인 ‘자손’을 유지해 지파 명칭의 투명성을 살렸습니다. POB의 문체와도 맞습니다.
- source_word: רַב מֵהֶם
  english_pob_choice: was too large for them
  chosen_korean: 그들에게 너무 많았기 때문입니다
  alternatives_korean:
  - 그들에게 너무 컸기 때문입니다
  - 그들이 감당하기에 너무 컸기 때문입니다
  - 그들이 필요로 하는 것보다 많았기 때문입니다
  lexicon: HALOT
  rationale: 비교 표현 רַב מִן의 의미를 자연스러운 현대어로 풀어, 유다에게 배정된 몫이 필요보다 컸다는 뜻을 살렸습니다.
- source_word: וַיִּנְחֲלוּ בְנֵי שִׁמְעוֹן בְּתוֹךְ נַחֲלָתָם
  english_pob_choice: so the sons of Simeon received their inheritance within Judah's inheritance
  chosen_korean: 그래서 시므온 자손은 유다의 기업 안에서 자기들의 기업을 받았습니다
  alternatives_korean:
  - 그래서 시므온 자손은 유다의 기업 가운데서 자기들의 기업을 받았습니다
  - 그래서 시므온 자손은 유다의 기업 한가운데서 자기들의 기업을 받았습니다
  lexicon: HALOT
  rationale: בְּתוֹךְ는 위치적 포함을 나타내므로 ‘안에서’로 옮겨, 시므온의 기업이 유다의 기업 내부에 놓였다는 점을 분명히 했습니다.
theological_decisions:
- issue: 지파 명칭을 ‘자손’으로 직역할지 ‘지파’로 풀어쓸지
  chosen_reading: 본문의 투명성을 위해 ‘유다 자손’, ‘시므온 자손’을 유지했습니다.
  alternative_readings:
  - 유다 지파, 시므온 지파
  - 유다 사람들, 시므온 사람들
  rationale: 본문은 혈연적·언약적 지파 구성을 직설적으로 말하므로, 해석을 덜어낸 직역형이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 출 1–2; 민 26; 수 13–19의 지파 분배 문맥
