base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
  footnotes:
  - marker: a
    text: Or 'This is the inheritance ...' The Hebrew demonstrative plus nominal clause can be rendered in the present more formally, but the past tense fits the narrative summary in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'their villages' for 'their settlements.' The Hebrew refers to dependent rural places associated with the listed cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 아셀 자손의 지파가 그들의 종족별로 받은 유산입니다—이 성읍들과 그 주변 정착지들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것은 … 유산입니다.’ 히브리어의 지시사와 명사구는 더 직접적으로 현재형으로 옮길 수도 있지만, 문맥상 요약 진술에는 과거/완료 의미가 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 마을들.’ 히브리어 חַצְרֵיהֶן은 성읍에 딸린 농촌 거주지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת / נַחֲלַת
  english_pob_choice: This was the inheritance
  chosen_korean: 이것은 … 받은 유산입니다
  alternatives_korean:
  - 이것은 … 받은 상속분입니다
  - 이것은 … 받은 몫입니다
  lexicon: HALOT
  rationale: 여기서는 지파에게 분배된 토지 몫을 가리키므로, covenantal 뉘앙스를 살리는 ‘유산’이 가장 자연스럽습니다. 한국어에서는 서술형으로 매끈하게 만들기 위해 ‘받은 유산입니다’로 옮겼습니다.
- source_word: מַטֵּה בְנֵי אָשֵׁר
  english_pob_choice: the tribe of the sons of Asher
  chosen_korean: 아셀 자손의 지파
  alternatives_korean:
  - 아셀의 아들들의 지파
  - 아셀 자손들인 지파
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 표현은 부족 정체성을 나타내는 공식어이므로, 한국어에서는 뜻을 유지하면서도 자연스러운 ‘아셀 자손의 지파’로 정리했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가문별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּחָה는 지파 내부의 씨족/종족 단위를 가리키므로, 교회적 용어의 ‘가문’보다 분배 구조를 드러내는 ‘종족별로’가 더 정확합니다.
- source_word: הֶעָרִים הָאֵלֶּה וְחַצְרֵיהֶן
  english_pob_choice: these cities and their settlements
  chosen_korean: 이 성읍들과 그 주변 정착지들
  alternatives_korean:
  - 이 성읍들과 그 마을들
  - 이 성읍들과 그 촌락들
  lexicon: HALOT
  rationale: עָרִים는 ‘성읍들’이 지리·역사적 문맥에 맞고, חַצְרֵיהֶן은 성읍에 딸린 외곽 거주지를 뜻하므로 단순한 ‘마을’보다 범위가 넓은 ‘주변 정착지들’이 원문의 관계를 더 잘 드러냅니다.
theological_decisions:
- issue: 지파 유산 공식문의 서술 시제
  chosen_reading: 현재형 ‘입니다’로 시작하되, 완료된 분배를 가리키는 의미는 ‘받은 유산’으로 표현했습니다.
  alternative_readings:
  - ‘이것은 … 유산이었습니다’
  - ‘이것이 … 유산입니다’
  rationale: 히브리어 지시문-명사구 공식은 문맥상 완료된 분배를 요약하는 진술이지만, 한국어에서는 현재형 서술이 문체상 더 자연스럽습니다. 동시에 ‘받은’으로 과거 완료성을 보완했습니다.
  doctrine_reference: 서술 시제의 문체적 조정
