  - severity: low
    issue: 각주 a의 대안이 본문과 사실상 동일함
    rationale: 본문이 이미 ‘이것은 … 유산입니다’이므로, 현재형이라는 대안 문구가 별도 각주로 기능하지 않습니다. 원문의 무동사 명사절과 문맥상 과거 번역 가능성을 설명하도록 고쳤습니다.
