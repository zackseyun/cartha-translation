  text: וְ/נָסַ֤ב אֹת/וֹ֙ הַ/גְּב֔וּל מִ/צְּפ֖וֹן חַנָּתֹ֑ן וְ/הָיוּ֙ תֹּֽצְאֹתָ֔י/ו גֵּ֖י יִפְתַּח אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
  footnotes:
  - marker: a
    text: Or 'north of Hannathon.' The Hebrew phrase may be understood either as positional ('on the north of') or more simply directional ('north of').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its goings out,' a boundary term meaning its extremities or end points.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 경계선은 그곳을 돌아 북쪽으로 하나돈에 이르렀고, 그 끝은 입닷엘 골짜기에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 위치를 가리켜 ‘하나돈의 북쪽에’로도, 방향을 가리켜 ‘하나돈 북쪽으로’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘그 출구들’은 경계의 끝지점이나 종착점을 뜻하는 경계 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  english_pob_choice: Then ... turned around
  chosen_korean: 돌아
  alternatives_korean:
  - 돌아서
  - 둘러
  - 우회하여
  lexicon: HALOT
  rationale: 경계선이 지형을 따라 방향을 바꾸는 뜻이므로, 자연스러운 한국어로 ‘돌아’라고 옮기되 순환적 이동의 의미를 보존했습니다.
- source_word: הַגְּבוּל
  english_pob_choice: the border
  chosen_korean: 경계선
  alternatives_korean:
  - 경계
  - 변경
  - 국경선
  lexicon: HALOT
  rationale: 지파 분배 지리문맥에서 גְּבוּל은 토지의 경계선을 가리키므로, 현대 한국어로는 ‘경계선’이 가장 분명합니다.
- source_word: מִצְּפוֹן חַנָּתֹן
  english_pob_choice: on the north of Hannathon
  chosen_korean: 북쪽으로 하나돈에
  alternatives_korean:
  - 하나돈의 북쪽으로
  - 하나돈 북쪽에
  - 하나돈 북쪽에서
  lexicon: HALOT
  rationale: מן+צפון은 경계 공식에서 위치 관계를 나타낼 수 있으므로, 단순 방향성보다 ‘북쪽으로’라는 진행 표현으로 처리해 경계선의 흐름을 살렸습니다.
- source_word: גֵּי יִפְתַּח אֵל
  english_pob_choice: the Valley of Iphtah-el
  chosen_korean: 입닷엘 골짜기
  alternatives_korean:
  - 입닷엘 계곡
  - 입닷엘의 골짜기
  - 입브닷엘 골짜기
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고 גֵּי는 이 문맥에서 고유지명 일부로 기능하므로 ‘골짜기’로 옮겼습니다.
theological_decisions:
- issue: 토지 경계 기술의 문체
  chosen_reading: 서술을 평이한 지리 묘사로 유지했습니다.
  alternative_readings:
  - 보다 고풍스러운 성경식 어법으로 조정
  - 경계의 종결을 강조하는 해석적 표현 사용
  rationale: 이 절은 신학적 해설보다 분배 경계의 진행을 기록하는 본문이므로, 원문의 지리적·기술적 성격을 드러내는 데 집중했습니다.
  doctrine_reference: 본문의 장르와 문맥(수 19장의 분배 경계 목록)
