  lexicon: HALOT
  rationale: 동쪽을 두 번 겹쳐 강조하는 표현을 둘 다 살리되, 현대 한국어에서 자연스러운 ‘해 뜨는 쪽’으로 옮겼습니다.
- source_word: כִּסְלֹת תָּבֹר
