base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
  footnotes:
  - marker: a
    text: Or 'eastward, toward the east'; literally, 'eastward, the rising of the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 사리드에서 동쪽으로, 해 뜨는 쪽으로 돌아서 길이 키슬롯-다볼의 경계에 이르고, 다브라스로 나가 야피아까지 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽으로, 동쪽을 향하여’; 문자적으로는 ‘동쪽으로, 해가 뜨는 쪽으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  english_pob_choice: Then it turned back
  chosen_korean: 돌아서
  alternatives_korean:
  - 되돌아
  - 돌아갔습니다
  lexicon: WLC/경계 서술용법
  rationale: 경계 설명에서 방향 전환을 나타내는 שוב를 자연스럽게 옮기되, 단순한 귀환보다 경로의 굴곡을 드러내는 표현을 택했습니다.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  english_pob_choice: eastward, toward the sunrise
  chosen_korean: 동쪽으로, 해 뜨는 쪽으로
  alternatives_korean:
