  - 더 서사적인 표현으로 완화한 번역
  rationale: 본문은 신학적 진술보다 경계 확정에 초점이 있으므로, 의미를 과장하지 않는 지리 서술 톤을 유지했습니다.
  doctrine_reference: 본문 장르 보존
