  - 키슬롯-타볼
  lexicon: 지명 음역
  rationale: 지명은 표준 음역으로 옮기고, 복합 지명임을 보여 주기 위해 하이픈을 유지했습니다.
- source_word: וְיָצָא ... וְעָלָה
  english_pob_choice: and went out ... and up to
  chosen_korean: 나가 ... 올라갔습니다
