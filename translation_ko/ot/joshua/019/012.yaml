  lexicon: HALOT
  rationale: 경계선이 특정 지점으로 ‘나가고’ 지형상 ‘올라가는’ 흐름을 한국어 동사로 간결하게 재현했습니다.
theological_decisions:
- issue: 지명과 경계 서술의 번역 톤
  chosen_reading: 서술체를 유지해 지리 경계 설명으로 읽히게 했습니다.
  alternative_readings:
