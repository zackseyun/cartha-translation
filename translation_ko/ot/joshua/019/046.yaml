  yaml_path: translation/ot/joshua/019/046.yaml
  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
  footnotes:
  - marker: a
    text: Hebrew may also be understood as the place-name 'Me-jarkon' rather than the transparent phrase 'the waters of Jarkon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with the border' or 'with the boundary' opposite Joppa.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야르콘의 물과 라콘, 그리고 요파 맞은편의 경계가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '메-야르콘'(Me-jarkon)이라는 지명으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''경계'' 대신 ''경계 지역'' 또는 ''변경''으로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  english_pob_choice: and the waters of Jarkon
  chosen_korean: 야르콘의 물
  alternatives_korean:
  - 야르콘의 물들
  - 야르콘 물
  - 메-야르콘
  lexicon: HALOT
  rationale: מֵי는 '물'의 연계형으로 읽는 것이 자연스러우므로, 이를 그대로 살려 '야르콘의 물'로 옮겼습니다. 영어 POB처럼 지명형 '메-야르콘'도 가능하지만, 히브리어의 투명한 표현을 우선 반영했습니다.
- source_word: וְהָרַקּוֹן
  english_pob_choice: and Rakkon
  chosen_korean: 라콘
  alternatives_korean:
  - 그리고 라콘
  - 라콘의 물
  lexicon: HALOT
  rationale: 고유 지명으로 보아 음역했습니다. 히브리어 정관사는 한국어에서 따로 옮기지 않는 것이 자연스럽습니다.
- source_word: עִם הַגְּבוּל
  english_pob_choice: with the territory
  chosen_korean: 경계가
  alternatives_korean:
  - 영역이
  - 변계가
  - 국경이
  lexicon: HALOT
  rationale: גְּבוּל은 여기서 단순한 선형 '경계'라기보다 접경 지대/경계 지역을 가리킬 수 있으나, 한국어에서는 문맥상 가장 직접적인 '경계'를 택해 영어 POB의 유연한 의미 범위를 보존했습니다.
- source_word: מוּל יָפוֹ
  english_pob_choice: opposite Joppa
  chosen_korean: 요파 맞은편
  alternatives_korean:
  - 요파 앞
  - 요파를 마주한
  - 요파 건너편
  lexicon: HALOT
  rationale: מוּל은 공간적 대응 관계를 나타내므로 '맞은편'이 가장 자연스럽습니다. '요파'는 성경 지명으로 널리 쓰이는 음역을 따랐습니다.
