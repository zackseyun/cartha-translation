translation:
  language: ko
  text: 그리고 라바스, 키시욘, 에베스입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 음가는 더 기계적으로는 ‘하라빗’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 지명은 ‘아베스’로 옮기는 번역도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַבִּית
  english_pob_choice: Rabbith
  chosen_korean: 라바스
  alternatives_korean:
  - 하라빗
  - 라빗
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역하는 것이 적절하며, 영어 POB의 Rabbith를 한국어 표기에 맞게 옮겼습니다. ראשית의 ה를 별도 요소로 살리지 않는 전통적 음역을 따랐습니다.
- source_word: קִשְׁיוֹן
  english_pob_choice: Kishion
  chosen_korean: 키시욘
  alternatives_korean:
  - 키션
  - 키시온
  lexicon: HALOT
  rationale: 고유 지명으로서 영어 POB의 Kishion에 맞춰 한국어 음역을 적용했습니다. 어미 -ion 계열의 표기를 -욘으로 옮겨 본문 흐름을 자연스럽게 했습니다.
- source_word: אָבֶץ
  english_pob_choice: Ebez
  chosen_korean: 에베스
  alternatives_korean:
  - 아베스
  lexicon: HALOT
  rationale: 고유 지명은 음역하며, 영어 POB의 Ebez를 한국어에서 가장 자연스러운 외래어식 표기로 옮겼습니다.
- source_word: וְ / וָ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - 또
  lexicon: BDB
  rationale: 히브리어 접속사 וְ와 형태 변이 וָ는 목록을 이어 주는 단순 접속이므로, 한국어에서는 반복되는 항목 연결을 드러내는 '그리고'로 옮겼습니다.
