lexical_decisions:
- source_word: אֲדָמָה
  english_pob_choice: Adamah
  chosen_korean: 아다마
  alternatives_korean:
  - 아드마
  lexicon: HALOT
  rationale: 문맥이 지명 목록이므로 보통명사 의미를 살리지 않고 음역으로 처리했습니다. 영어 POB의 Adamah를 그대로 반영하되 한국어 외래어 표기법에 맞춰 아다마로 옮겼습니다.
- source_word: הָרָמָה
  english_pob_choice: Ramah
  chosen_korean: 라마
  alternatives_korean:
  - 그 라마
  - 라마흐
  lexicon: HALOT
  rationale: 지명에서 정관사가 붙어 있어도 한국어 본문에서는 관사를 따로 옮기지 않고 통용되는 음역형으로 처리했습니다. 목록체의 자연스러움을 위해 ‘그 라마’는 피했습니다.
- source_word: חָצוֹר
  english_pob_choice: Hazor
  chosen_korean: 하솔
  alternatives_korean:
  - 하조르
  - 하초르
  lexicon: HALOT
  rationale: 성경 지명으로 널리 쓰이는 한국어 표기 ‘하솔’을 따랐습니다. 영어 POB의 Hazor와 동일 지시 대상을 유지하면서도 한국어 독자에게 익숙한 고유명 표기를 반영했습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 와
  alternatives_korean:
  - 그리고
  lexicon: BDB
  rationale: 히브리어 접속사는 열거형 지명 목록에서 단순 병렬을 이루므로, 한국어에서도 짧고 중립적인 연결어 ‘와’로 처리했습니다.
