  text: 하살수알과 발라와 에셈입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲצַר שׁוּעָל은 문자적으로 ‘여우의 정착지’ 또는 ‘여우의 마을’이라는 뜻의 합성 지명입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 영어 번역본은 ‘발라’를 ‘Baalah’로, ‘에셈’을 ‘Azem’으로 표기하기도 합니다. 이는 음역 차이나 관련 지명 형태와의 조화에서 나온 대안입니다.
    reason: alternative_reading
