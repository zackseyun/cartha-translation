  text: וְ/קַטָּ֤ת וְ/נַֽהֲלָל֙ וְ/שִׁמְר֔וֹן וְ/יִדְאֲלָ֖ה וּ/בֵ֣ית לָ֑חֶם עָרִ֥ים שְׁתֵּים עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
  footnotes:
  - marker: a
    text: Bethlehem is the place name here, not a translated phrase meaning 'house of bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 깟닷과 나할랄과 심론과 이드알라와 베들레헴, 곧 열두 성읍과 그 마을들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 베들레헴은 여기에서 ‘빵집/떡집’이라는 뜻풀이가 아니라 지명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  english_pob_choice: Kattath
  chosen_korean: 깟닷
  alternatives_korean:
  - 카타트
  - 깟탓
  lexicon: 고유명사
  rationale: 히브리어 지명은 음역하는 것이 원문 의미를 가장 잘 보존하므로, 영어 POB의 Kattath에 맞추되 한국어 표기 관행에 따라 깟닷으로 옮겼습니다.
- source_word: נַהֲלָל
  english_pob_choice: Nahalal
  chosen_korean: 나할랄
  alternatives_korean:
  - 나하랄
  - 나할할
  lexicon: 고유명사
  rationale: 정착지 목록의 고유 지명으로 보이므로 의미 번역이 아니라 음역을 택했고, 한국어에서는 나할랄이 가장 자연스럽습니다.
- source_word: בֵית לָחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴
  alternatives_korean:
  - 베들레힘
  - 떡집
  lexicon: 고유명사
  rationale: 영어 POB처럼 지명으로 처리해야 하므로 직역인 ‘떡집’은 피하고, 통용되는 한국어 음역 베들레헴을 사용했습니다.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה וְחַצְרֵיהֶן
  english_pob_choice: twelve cities with their villages
  chosen_korean: 열두 성읍과 그 마을들
  alternatives_korean:
  - 열두 도시와 그 촌락들
  - 열두 성읍과 그 울타리 밖 마을들
  lexicon: HALOT
  rationale: עָרִים는 성읍으로, חַצְרֵיהֶן은 목록 문맥상 딸린 마을들을 뜻하므로 ‘마을들’로 옮겨 행정·지리적 관계를 드러냈습니다.
