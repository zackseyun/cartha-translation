translation:
  language: ko
  text: '움마와 아벡과 르홉: 모두 스물두 성읍과 그에 딸린 마을들이었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에 딸린 마을들’은 히브리어 חַצְרֵיהֶן을 옮긴 것으로, 성읍에 속한 부속 농촌 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  english_pob_choice: Ummah
  chosen_korean: 우마
  alternatives_korean:
  - 움마
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역하는 것이 원칙이므로, 영어 POB의 Ummah에 맞춰 한국어로 우마를 채택했습니다.
- source_word: אֲפֵק
  english_pob_choice: Aphek
  chosen_korean: 아벡
  alternatives_korean:
  - 아펙
  lexicon: HALOT
  rationale: 히브리어 지명 אַפֵק의 통용 음역을 따랐습니다.
- source_word: רְחֹב
  english_pob_choice: Rehob
  chosen_korean: 르홉
  alternatives_korean:
  - 레홉
  - 르호브
  lexicon: HALOT
  rationale: 고유 지명으로서의 통상 음역을 반영하되, 영어 POB의 Rehob에 대응하도록 르홉을 택했습니다.
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍이
  alternatives_korean:
  - 도시가
  - 마을이
  lexicon: HALOT
  rationale: 열거된 정착지 총계를 요약하는 일반 명사로서, 여호수아 분배 목록의 문맥에 맞는 전통적이면서도 현대적인 한국어 표현을 사용했습니다.
- source_word: חַצְרֵיהֶן
  english_pob_choice: their villages
  chosen_korean: 그 마을들도
  alternatives_korean:
  - 그 촌락들도
  - 그 부속 정착지도
  lexicon: HALOT
  rationale: חָצֵר 계열은 본읍에 딸린 농촌 정착지를 가리킬 수 있으므로, ‘their villages’의 의미를 살려 ‘그 마을들’로 옮겼습니다.
