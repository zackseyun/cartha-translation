base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel''; many English versions simplify this to ''Israel'' or ''the Israelites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 제사장 엘르아살과 눈의 아들 여호수아와 이스라엘 자손 지파들의 족장들이 실로에서 야훼 앞, 회막 문에서 제비로 나누어 준 유산들입니다. 그렇게 그들은 땅 나누기를 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘 자손’이라고 합니다. 일부 영어 성경은 이를 간단히 ‘이스라엘’ 또는 ‘이스라엘 사람들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּחָלֹת
  english_pob_choice: the inheritances
  chosen_korean: 유산들
  alternatives_korean:
  - 기업들
  - 상속분들
  - 분배된 땅
  lexicon: HALOT
  rationale: נַחֲלָה는 단순한 ‘몫’보다 상속으로 받은 소유를 가리키므로, 문맥상 지파별로 받은 땅을 드러내는 ‘유산들’이 가장 자연스럽고 의미를 보존합니다.
- source_word: נִחֲלוּ
  english_pob_choice: apportioned by lot / assigned by lot
  chosen_korean: 제비로 나누어 준
  alternatives_korean:
  - 제비로 분배한
  - 제비로 할당한
  - 제비로 몫지은
  lexicon: HALOT
  rationale: 동사는 분배 행위를 나타내며, 앞의 ‘제비로’와 결합해 점유를 결정하는 절차를 드러내므로, 행정적이고도 본문적인 느낌을 살린 ‘제비로 나누어 준’이 적절합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼의 앞에서
  - 주 앞
  - 여호와 앞
  lexicon: HALOT
  rationale: 이 구절의 יהוה는 본문 원어를 따라 고유신명으로 드러내는 것이 중요하므로, POB 기준을 따라 ‘야훼’로 옮기고 관용적 공간 표현은 ‘앞’으로 간결하게 처리했습니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 문에서
  alternatives_korean:
  - 회막의 입구에서
  - 만남의 장막 문에서
  - 회막 어귀에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 이미 한국어 성경에서 널리 정착된 ‘회막’으로 옮기고, פֶּתַח은 ‘문/입구’의 뜻이므로 간결하게 ‘회막 문’으로 표현했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 친족 표현을 그대로 살리되 한국어 성경에서 익숙한 표준형을 유지하기 위해 ‘이스라엘 자손’을 선택했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 번역
  chosen_reading: 원문 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 언약적 현존을 가리키는 신명 사용이므로, 본 프로젝트의 기준에 따라 전통 교회 용어 대신 원어 기반 표기인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
