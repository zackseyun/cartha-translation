  to: 단 자손의 경계는 그들을 넘어 나아갔습니다.[a] 그래서 단 자손이 올라가 레셈[b]과 싸웠습니다. 그들은 그 성을 점령하고 칼날로 그 성을 쳐서 차지한 뒤, 그곳에 살았습니다. 그들은 레셈을 자기들의 조상 단의 이름을 따라 단이라 불렀습니다.
