reference: Joshua 19:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
  footnotes:
  - marker: a
    text: Or 'the border of the sons of Dan extended beyond them.' Some translations render the clause interpretively as 'the territory of the sons of Dan was too small for them,' drawing on the broader context, but the Hebrew wording is more literally spatial.
    reason: alternative_reading
  - marker: b
    text: Leshem is associated with Laish in Judges 18:7, 14, 27, 29.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 단 지파의 영토는 그들에게서 벗어나게 되었으므로, 단의 자손들이 올라가서 레셈과 싸워 그 성읍을 점령하고 칼날로 쳐서 차지한 뒤 거기에 살았습니다. 그들은 레셈의 이름을 자기들의 조상 단의 이름을 따라 단이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그들에게서” 또는 “그들로부터”에 가깝습니다. 문맥상 경계/영토가 바깥으로 뻗었다는 뜻으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 레셈은 사사기 18:7, 14, 27, 29의 라이스와 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  english_pob_choice: the territory of the sons of Dan went out beyond them
  chosen_korean: 단 지파의 영토는 그들에게서 벗어나게 되었으므로
  alternatives_korean:
  - 단 지파의 경계가 그들에게서 나가게 되었으므로
  - 단 지파의 영토가 그들보다 더 넓게 뻗어 나갔으므로
  lexicon: HALOT
  rationale: גְבוּל은 ‘경계’와 ‘영토’ 모두 가능하지만, allotment 문맥에서는 ‘영토’가 자연스럽고, מֵהֶם은 공간적으로 ‘그들에게서’로 살려 영어 POB의 외연적 의미를 반영했습니다.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  english_pob_choice: fought against Leshem
  chosen_korean: 레셈과 싸워
  alternatives_korean:
  - 레셈을 상대로 싸워
  - 레셈과 전쟁하여
  lexicon: HALOT
  rationale: עִם + 지명은 한국어에서 ‘~과 싸우다’가 가장 자연스럽고, 전투 행위를 분명하게 드러냅니다.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ ... וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב ... וַיִּרְשׁוּ אוֹתָהּ
  english_pob_choice: they captured it and struck it with the edge of the sword, and they took possession of it
  chosen_korean: 그 성읍을 점령하고 칼날로 쳐서 차지한 뒤
  alternatives_korean:
  - 그 성읍을 사로잡고 칼날로 쳐서 소유한 뒤
  - 그 성읍을 점령하고 칼끝으로 쳐서 차지한 뒤
  lexicon: HALOT
  rationale: לכד는 군사적 맥락에서 ‘점령하다’가 적절하고, לְפִי חֶרֶב은 직역적 이미지를 살리되 한국어로는 ‘칼날로’가 가장 읽기 자연스럽습니다. ירשׁ는 단순 소유보다 점유·차지의 결과가 강해 ‘차지하다’로 옮겼습니다.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן כְּשֵׁם דָּן אֲבִיהֶם
  english_pob_choice: they called Leshem Dan, after the name of Dan their father
  chosen_korean: 레셈의 이름을 자기들의 조상 단의 이름을 따라 단이라 불렀습니다
  alternatives_korean:
  - 레셈을 단이라 불렀습니다
  - 레셈의 이름을 단으로 바꾸었습니다
  lexicon: HALOT
  rationale: קרא לְ... is naming language, so ‘이름을 따라 …이라 불렀습니다’가 본문의 명명 행위를 가장 분명하게 전달합니다. אֲבִיהֶם은 혈연 조상을 가리키는 관용으로 여기서는 ‘조상’이 적절합니다.
theological_decisions:
- issue: 르셈/단 명명과 지파 정체성
  chosen_reading: 새로 점령한 성읍의 이름을 조상 단의 이름을 따라 ‘단’으로 바꾸었다는 서술을 그대로 살렸습니다.
  alternative_readings:
  - 단 지파가 그 성읍을 자기 이름으로 새로 불렀다
  - 단 지파가 그곳을 단이라 개칭했다
  rationale: 본문은 단 지파가 정복 이후 정착지의 이름을 재명명하여 족장-지파 정체성을 공고히 하는 장면이므로, 명명 행위를 약화하지 않고 드러내는 번역이 필요합니다.
  doctrine_reference: 이스라엘 지파의 기업과 이름 계승
