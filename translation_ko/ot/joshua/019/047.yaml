  source_fidelity: 첫 절의 난해한 מֵהֶם을 인과관계로 처리한 ‘벗어나게 되었으므로’는 본문에 없는 이유·결과 관계를 부가합니다. 또한 ‘그들에게서 벗어나다’는 경계/영토의 공간적 움직임을 한국어로 충분히 드러내지 못합니다. 이를 ‘그들을 넘어 나아갔습니다’로 고쳐 히브리어와 영어 POB가 보존한 공간적이고 난해한 표현을 유지했습니다. 나머지 정복, 칼로 침, 점유, 거주, 개명 순서는 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히면서도, 첫 절의 의도적으로 난해한 표현을 과도하게 해석하지 않습니다. 긴 문장을 나누어 사건의 연쇄도 분명히 했습니다.
  terminology: ‘단 자손’, ‘레셈’, ‘조상 단’, ‘단’은 본문의 지파·지명·조상 명명 관용을 적절히 반영합니다. ‘칼날로 그 성을 쳤습니다’는 לְפִי חֶרֶב의 관용을 비교적 직역적으로 보존합니다.
