id: JOS.19.8
reference: Joshua 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
  footnotes:
  - marker: a
    text: Or possibly, 'Baalath-beer, that is, Ramath-negeb,' taking the second name as an appositional identification of the first.
    reason: alternative_reading
translation:
  language: ko
  text: 또 이 성읍들 주위에 있는 모든 마을도, 바알랏-브엘, 곧 라맛-네겝까지였습니다. 이것이 시므온 자손의 지파가 그들의 가문별로 받은 기업입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알랏-브엘, 곧 라맛-네겝’으로 볼 수도 있습니다. 둘째 이름을 첫째 이름의 동격 식별로 읽는 해석입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  english_pob_choice: along with all the villages
  chosen_korean: 또 ... 모든 마을도
  alternatives_korean:
  - 그리고 ... 모든 촌락도
  - 또 ... 모든 정착지도
  lexicon: HALOT
  rationale: חֲצֵרִים은 이 분배 문맥에서 성읍 주변의 부속 거주지를 가리키므로, 자연스러운 현대어인 ‘마을’로 옮기되 연결어 ‘또’로 누적 의미를 살렸습니다.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  english_pob_choice: that were around these cities
  chosen_korean: 이 성읍들 주위에 있는
  alternatives_korean:
  - 이 성읍들 둘레에 있는
  - 이 성읍들 주변에 있는
  lexicon: HALOT
  rationale: 문맥상 마을들의 위치를 설명하는 관계절이므로, ‘주위에 있는’으로 간결하게 살려 지리적 범위를 분명히 했습니다.
- source_word: בַּעֲלַת בְּאֵר / רָאמַת נֶגֶב
  english_pob_choice: Baalath-beer, Ramath-negeb
  chosen_korean: 바알랏-브엘, 곧 라맛-네겝
  alternatives_korean:
  - 바알랏-브엘, 라맛-네겝
  - 바알랏-브엘, 즉 라맛-네겝
  lexicon: HALOT
  rationale: 두 지명은 음역을 유지하되, 영어 POB의 가능성 주석을 반영해 ‘곧’으로 동격 해석을 본문에 드러냈습니다.
- source_word: נַחֲלַת מַטֵּה בְנֵי שִׁמְעֹון לְמִשְׁפְּחֹתָם
  english_pob_choice: the inheritance of the tribe of the sons of Simeon according to their clans
  chosen_korean: 시므온 자손의 지파가 그들의 가문별로 받은 기업
  alternatives_korean:
  - 시므온 자손의 지파의 가문별 기업
  - 시므온 자손 지파의 각 가문에 따른 기업
  lexicon: HALOT
  rationale: נַחֲלָה는 여호수아의 분배 문맥에서 ‘기업’이 적절하고, לְמִשְׁפְּחֹתָם은 ‘가문별로’로 옮겨 지파 내부의 분배 단위를 살렸습니다.
theological_decisions:
- issue: 지명 ‘בַּעֲלַת בְּאֵר / רָאמַת נֶגֶב’의 관계
  chosen_reading: 본문에는 두 지명을 나란히 두되, ‘곧’으로 동격 가능성을 열어 둡니다.
  alternative_readings:
  - 두 개의 별도 지명으로 단순 병렬 처리
  - ‘바알랏-브엘, 라맛-네겝’으로 동격을 본문에서 명시하지 않음
  rationale: 영어 POB 주석이 두 번째 이름을 첫째 이름의 동격 식별로 읽을 가능성을 제시하므로, 본문에서 과도하게 확정하지 않으면서도 그 가능성을 드러내는 방식이 가장 투명합니다.
  doctrine_reference: 본문 비평/지명 동격 처리의 번역상 판단
