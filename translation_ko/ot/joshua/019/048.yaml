  - marker: a
    text: Or 'This is the inheritance ...' The Hebrew demonstrative formula can be rendered with either present or past tense in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'allotment' for 'inheritance'; the Hebrew term can emphasize either the assigned portion or its inherited character.
    reason: lexical_alternative
translation:
