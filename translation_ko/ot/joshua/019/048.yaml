  text: 이것은 단의 아들들의 지파가 그들의 종족별로 받은 유산입니다—이 성읍들과 그 마을들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''유산''은 여기서 단에게 배정된 토지 몫이라는 행정적 의미와 상속받은 몫이라는 의미를 함께 담습니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어 지시문은 영어처럼 현재형과 과거형 모두로 옮길 수 있어, 한국어도 문맥상 두 방식이 가능합니다.
    reason: lexical_alternative
