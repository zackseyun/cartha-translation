  naturalness: ‘벧르바옷과 사루헨입니다. 도시가 열셋이며’는 목록 문맥에서 문장 연결이 다소 어색합니다. ‘이 성읍들은 모두 열세 곳이며’가 현대 한국어의 분배 목록 문체에 더 자연스럽고 정확합니다.
