lexical_decisions:
- source_word: וְ/צִקְלַ֥ג
  english_pob_choice: and Ziklag
  chosen_korean: 그리고 지글락
  alternatives_korean:
  - 그리고 직락
  - 그리고 시글락
  lexicon: HALOT
  rationale: 고유 지명은 현대 한국어 음역으로 옮겼고, 본문 목록의 첫 항목이므로 연결어 「그리고」를 유지했습니다.
- source_word: בֵית הַמַּרְכָּב֖וֹת
  english_pob_choice: Beth-marcaboth
  chosen_korean: 베트-마르카봇
  alternatives_korean:
  - 베스-마르카봇
  - 수레들의 집
  lexicon: HALOT
  rationale: 영어 POB가 음역을 본문에 유지한 점을 따라 고유 지명으로 처리했습니다. 어원상 ‘수레/병거의 집’이라는 뜻은 주석에서만 드러내는 편이 지명성을 보존합니다.
- source_word: וַ/חֲצַ֥ר סוּסָֽה
  english_pob_choice: Hazar-susah
  chosen_korean: 하살-수사
  alternatives_korean:
