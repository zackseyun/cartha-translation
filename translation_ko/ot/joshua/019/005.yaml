  - 말들의 울타리
  - 말의 정착지
  lexicon: HALOT
  rationale: חצר는 정착지·울타리·마을을 가리킬 수 있지만, 목록 문맥에서는 지명 음역이 가장 자연스럽습니다. סוסָה의 ‘말’ 어근은 본문보다 주석으로 남기는 것이 좋습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - 과
  lexicon: HALOT
  rationale: 열거 구조를 자연스럽게 잇는 표준 연결어로 옮겼습니다.
