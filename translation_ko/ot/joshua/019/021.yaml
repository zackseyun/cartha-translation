id: JOS.19.21
reference: Joshua 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רֶ֧מֶת וְ/עֵין גַּנִּ֛ים וְ/עֵ֥ין חַדָּ֖ה וּ/בֵ֥ית פַּצֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/021.yaml
  text: Remeth[a], En-gannim, En-haddah, and Beth-pazzez.
  footnotes:
  - marker: a
    text: 'Hebrew place names: ''En-gannim'' likely means ''spring of gardens,'' ''En-haddah'' begins with ''spring,'' and ''Beth-pazzez'' begins with ''house of.'' The main text transliterates them because they function here as town names.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레멧[a], 엔-간님, 엔-하다, 베이트-파체스입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지명입니다. '엔-간님'은 대체로 '정원들의 샘,' '엔-하다'는 '샘'으로 시작하며, '베이트-파체스'는 '집'으로 시작하는 이름입니다. 본문에서는 도시명으로 기능하므로 음역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  english_pob_choice: Remeth
  chosen_korean: 레멧
  alternatives_korean:
  - 레메트
  - 레멧스
  lexicon: HALOT
  rationale: 고유 지명은 의미 번역보다 음역이 적절하므로 영어 POB의 표준 표기 Remeth를 따라 한국어로도 음역했습니다.
- source_word: עֵין גַּנִּים
  english_pob_choice: En-gannim
  chosen_korean: 엔-간님
  alternatives_korean:
  - 엔 간님
  - 샘-간님
  - 정원의 샘
  lexicon: HALOT
  rationale: 어근상 '샘'을 뜻하지만, 본문에서는 도시명으로 기능하므로 영어 POB처럼 음역을 유지했고, 한국어에서는 읽기 쉬운 하이픈 형태를 썼습니다.
- source_word: עֵין חַדָּה
  english_pob_choice: En-haddah
  chosen_korean: 엔-하다
  alternatives_korean:
  - 엔 하다
  - 샘-하다
  - 샤프한 샘
  lexicon: HALOT
  rationale: 이 또한 정착된 지명으로 쓰이므로 의미 풀이를 피하고 음역을 유지했습니다. '하다'의 정확한 어원 의미는 불확실하므로 번역화하지 않았습니다.
- source_word: בֵית פַּצֵּץ
  english_pob_choice: Beth-pazzez
  chosen_korean: 베이트-파체스
  alternatives_korean:
  - 베이트 파체스
  - 파체스의 집
  lexicon: HALOT
  rationale: בֵית는 지명에서 흔한 '집' 요소이지만, 여기서는 도시명으로 작동하므로 영어 POB와 같이 음역을 택했습니다.
theological_decisions:
- issue: 지명 목록의 처리 방식
  chosen_reading: 네 개의 도시명을 모두 음역해 지명 목록의 성격을 보존했습니다.
  alternative_readings:
  - '''정원의 샘, …''처럼 의미 번역하기'
  - '''집'' 요소만 한국어로 풀어 쓰기'
  rationale: 이 절은 경계 목록 안의 지명 나열이므로, 의미를 풀어 쓰면 본문이 지닌 행정적·지리적 기능이 약화됩니다.
  doctrine_reference: 성경 본문의 장르와 문맥을 우선하여 지명은 통상 음역한다는 번역 원칙
