base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/028.yaml
  text: Ebron[a], Rehob, Hammon, and Kanah, as far as Great Sidon.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Ebron''; some textual traditions and translations read ''Abdon.'''
    reason: textual_variant
translation:
  language: ko
  text: 에브론[a]과 레홉과 함몬과 가나, 큰 시돈까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에브론’은 히브리어 본문형을 따른 음역입니다. 일부 본문 전승과 번역은 ‘아브돈’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֶבְרֹן
  english_pob_choice: Ebron
  chosen_korean: 에브론
  alternatives_korean:
  - 아브돈
  lexicon: HALOT
  rationale: 히브리어 자음형을 따라 지명 고유명사로 음역했습니다. 일부 전승의 ‘아브돈’은 본문 변이 가능성을 반영하지만, 본문에는 에브론을 그대로 옮기는 것이 가장 적절합니다.
- source_word: וּרְחֹב
  english_pob_choice: Rehob
  chosen_korean: 레홉
  alternatives_korean:
  - 레호브
  lexicon: HALOT
  rationale: 지명 고유명사로 음역했고, 한국어 표기에서는 ‘레홉’이 간결하면서도 원형을 충분히 반영합니다.
- source_word: וְחַמּוֹן
  english_pob_choice: Hammon
  chosen_korean: 함몬
  alternatives_korean:
  - 하몬
  lexicon: HALOT
  rationale: 히브리어 철자와 발음을 고려해 지명으로 음역했습니다. 초성 h는 한국어 음역에서 흔히 탈락하거나 약화될 수 있으나, 본문 표준화 차원에서 ‘함몬’을 채택했습니다.
- source_word: וְקָנָה
  english_pob_choice: Kanah
  chosen_korean: 가나
  alternatives_korean:
  - 카나
  lexicon: HALOT
  rationale: 지명 음역으로 처리했으며, 한국어 성서 지명 관행에서 ק를 ‘가’로 옮기는 방식이 자연스럽습니다.
- source_word: עַד צִידוֹן רַבָּה
  english_pob_choice: as far as Great Sidon
  chosen_korean: 큰 시돈까지
  alternatives_korean:
  - 위대한 시돈까지
  - 대시돈까지
  lexicon: HALOT
  rationale: עַד는 경계의 종착점을 나타내므로 ‘까지’로 옮겼고, רַבָּה는 시돈을 수식하는 크기/중요성 표현으로 ‘큰’이 가장 직역에 가깝고 자연스럽습니다.
