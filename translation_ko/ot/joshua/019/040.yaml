  text: 단 자손 지파에게, 그들의 씨족에 따라, 일곱째 제비가 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  english_pob_choice: for the tribe of
  chosen_korean: 지파에게
  alternatives_korean:
  - 지파에
  - 지파를 위하여
  - 지파의
  lexicon: HALOT
  rationale: מַטֶּה는 이스라엘 지파 분배 문맥에서 ‘지파’로 옮기는 것이 자연스럽고, ל는 할당 대상을 표시하는 용법이므로 한국어에서는 목적격/수혜 표현인 ‘-에게’로 풀어 주었습니다.
- source_word: בְנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단의 자손들의
  alternatives_korean:
  - 단의 아들들의
  - 단 사람들의
  - 단 지파의
  lexicon: HALOT
  rationale: ‘sons of Dan’의 직역성을 살리되 한국어 문맥에서는 ‘자손들’이 족속·혈연 집단을 가장 자연스럽게 드러냅니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가문별로
  - 그들의 가족별로
  - 그들의 종족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 여기서 지파 내부의 하위 친족 단위를 가리키므로 ‘가족’보다 ‘종족’/‘종족별’이 본문 구조를 더 정확히 반영합니다.
- source_word: הַשְּׁבִיעִי
  english_pob_choice: the seventh
  chosen_korean: 일곱째
  alternatives_korean:
  - 제칠
  - 일곱 번째
  - 일곱째의
  lexicon: HALOT
  rationale: ‘lot’을 수식하는 서수이므로 한국어에서도 간결한 서수 표현 ‘일곱째’가 자연스럽습니다.
- source_word: הַגּוֹרָל
  english_pob_choice: the lot
  chosen_korean: 제비
  alternatives_korean:
  - 몫
  - 분깃
  - 운명
  lexicon: HALOT
  rationale: 문맥상 분배를 위한 추첨을 가리키므로 한국어 성경에서 널리 쓰이는 ‘제비’가 가장 직접적입니다.
