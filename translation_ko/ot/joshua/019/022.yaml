  naturalness: ‘성읍이 열여섯이었고 그 딸린 마을들도 있었습니다’는 설명적으로 풀어져 있으며 ‘들도’는 원문에 없는 첨가적 뉘앙스를 줄 수 있습니다. 목록 종결 형식에 맞춰 ‘성읍 열여섯과 그에 딸린 마을들이었습니다’라고 하면 현대 표준어 합쇼체로 더 간결하고 자연스럽습니다.
