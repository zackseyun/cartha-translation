  text: וּ/פָגַע֩ הַ/גְּב֨וּל בְּ/תָב֤וֹר ו/שחצומ/ה וּ/בֵ֣ית שֶׁ֔מֶשׁ וְ/הָי֛וּ תֹּצְא֥וֹת גְּבוּלָ֖/ם הַ/יַּרְדֵּ֑ן עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
  footnotes:
  - marker: a
    text: Or 'reached' or 'met'; the Hebrew verb can denote a boundary line coming into contact with a place.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the outgoings of their border were the Jordan,' a boundary formula referring to the border's endpoint or extent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 경계는 다볼과[a] 사하수마와 벧세메스에 닿았으며, 그들의 경계 끝은 요르단이었습니다[b]—성읍이 열여섯이었고 그 딸린 마을들도 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이르렀다’, ‘만났다’; 히브리어 동사는 경계선이 어떤 장소에 닿는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 경계의 나가는 곳은 요르단’이라는 뜻으로, 경계의 종점이나 범위를 가리키는 공식 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע
  english_pob_choice: touched
  chosen_korean: 닿았으며
  alternatives_korean:
  - 이르렀으며
  - 만났으며
  lexicon: HALOT
  rationale: 경계 묘사에서 פגע는 장소에 경계선이 맞닿거나 접하는 뜻이므로, ‘닿다’가 공간적 접촉을 자연스럽게 살립니다.
- source_word: בְּתָבוֹר / וְשַׁחֲצוּמָה / וּבֵית שֶׁמֶשׁ
  english_pob_choice: Tabor / Shahazumah / Beth-shemesh
  chosen_korean: 다볼 / 사하수마 / 벧세메스
  alternatives_korean:
  - 타보르 / 샤하수마 / 벧-세메쉬
  - 다볼 산 / 해의 집
  lexicon: HALOT
  rationale: 지명은 의미역으로 풀지 않고 음역하되, 한국어 성경 관용형인 벧세메스를 유지해 가독성과 표준성을 함께 살렸습니다.
- source_word: וְהָיוּ תֹּצְאֹת גְּבוּלָם הַיַּרְדֵּן
  english_pob_choice: and the end of their border was at the Jordan
  chosen_korean: 그들의 경계 끝은 요르단이었습니다
  alternatives_korean:
  - 그들의 경계의 나가는 곳은 요르단이었습니다
  - 그들의 경계의 끝은 요르단에 있었습니다
  lexicon: HALOT
  rationale: תֹּצְאוֹת은 경계 공식에서 ‘나가는 곳/끝’이지만, 문맥상 종착점이라는 기능이 분명하므로 현대 한국어로는 ‘경계 끝’이 가장 분명합니다.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה וְחַצְרֵיהֶן
  english_pob_choice: sixteen cities with their villages
  chosen_korean: 성읍이 열여섯이었고 그 딸린 마을들도 있었습니다
  alternatives_korean:
  - 성읍 열여섯과 그 마을들이 있었습니다
  - 성읍이 열여섯이었고 그 주변 촌락들도 있었습니다
  lexicon: HALOT
  rationale: חַצְרֵיהֶן은 단순한 마을보다 성읍에 딸린 부속 거주지를 가리키므로, ‘딸린 마을들’이 관계성을 가장 잘 드러냅니다.
theological_decisions:
- issue: 경계 공식의 종결 표현
  chosen_reading: ‘그들의 경계 끝은 요르단이었습니다’로 번역해 지리적 종착점을 분명히 했습니다.
  alternative_readings:
  - ‘그들의 경계의 나가는 곳은 요르단이었습니다’
  - ‘경계의 출구는 요르단이었습니다’
  rationale: 본문은 신학적 비유보다 분배 경계의 실제 종결을 말하므로, 독자가 지리적 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 수 19장 분배 경계 문맥
