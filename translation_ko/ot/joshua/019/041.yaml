language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֖י גְּב֣וּל נַחֲלָתָ֑/ם צָרְעָ֥ה וְ/אֶשְׁתָּא֖וֹל וְ/עִ֥יר שָֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
  footnotes:
  - marker: a
    text: Ir-shemesh means 'city of the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 기업의 경계는 소라, 에스다올, 그리고 해의 성읍인 이르세메시였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이르세메시’는 ‘해의 성읍’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... was
  chosen_korean: '...였습니다'
  alternatives_korean:
  - '...이었습니다'
  - '...되었는데'
  lexicon: HALOT
  rationale: 서술 연결을 살리되, 한국어에서는 자연스러운 과거 서술형으로 옮겼습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 변경
  lexicon: HALOT
  rationale: 기업지 분배 문맥에서 גְּבוּל은 단순한 ‘영토’보다 경계라는 뜻이 더 분명하여, 장소 목록을 이끄는 말로 ‘경계’를 택했습니다.
- source_word: נַחֲלָתָם
  english_pob_choice: their inheritance
  chosen_korean: 그들의 기업
  alternatives_korean:
  - 그들의 상속지
  - 그들의 분깃
  lexicon: HALOT
  rationale: 여기서는 지파에게 주어진 분배지를 가리키므로, 성경적 분깃 개념을 살리면서도 현대 한국어에서 자연스러운 ‘기업’으로 옮겼습니다.
- source_word: עִיר שָׁמֶשׁ
  english_pob_choice: Ir-shemesh
  chosen_korean: 이르세메시
  alternatives_korean:
  - 태양의 성읍
  - 해의 성읍
  lexicon: HALOT
  rationale: 본문은 지명으로 제시하므로 मुख्य 본문에서는 음역을 따르고, 뜻은 각주로 밝히는 편이 원문과 번역 원칙에 더 충실합니다.
theological_decisions:
- issue: 고유지명 ‘עִיר שָׁמֶשׁ’의 처리
  chosen_reading: 본문에는 지명 음역을 두고, 의미는 각주로 제시했습니다.
  alternative_readings:
  - 본문에서 ‘해의 성읍’으로 번역
  - 본문과 각주를 모두 생략하고 음역만 사용
  rationale: 열거된 지명 목록의 형식을 유지해야 하므로, 의미 번역은 본문을 흐리지 않는 각주가 가장 적절합니다.
  doctrine_reference: 지명 번역 원칙
