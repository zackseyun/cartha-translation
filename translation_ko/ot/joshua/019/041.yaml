  source_fidelity: 히브리어 본문은 단순히 세 지명(소라, 에스다올, 이르-세메스)을 병렬로 열거합니다. 초안의 ‘해의 성읍인’은 지명의 뜻을 본문에 동격으로 삽입하여 원문의 열거 형식을 바꾸므로 각주로만 처리하는 것이 적절합니다.
  naturalness: ‘그들의 기업의 경계는 …였습니다’는 여호수아의 기업 분배 문맥에 어울리는 자연스러운 현대 한국어 합쇼체입니다. 병렬 접속은 ‘와’로 처리하여 간결하게 했습니다.
  terminology: נַחֲלָתָם은 ‘그들의 기업’으로 유지했습니다. עִיר שָׁמֶשׁ은 지명이므로 본문에서는 ‘이르세메스’로 음역하고, ‘해의 성읍’이라는 뜻은 각주에 제시했습니다. ‘이르세메시’는 히브리어 שֶׁמֶשׁ(셰메시가 아니라 셰메스)에 맞지 않는 음역입니다.
  issues:
