lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  english_pob_choice: received their inheritance
  chosen_korean: 그들의 기업을 받았습니다
  alternatives_korean:
  - 기업을 차지했습니다
  - 기업을 상속받았습니다
  - 기업을 얻었습니다
  lexicon: HALOT
  rationale: נחל의 완료적 취지는 기업을 ‘받다’로 옮기는 것이 가장 자연스럽고, 여호수아서의 분배 맥락에서도 땅의 몫을 수동적으로 수령한 뜻을 잘 드러냅니다.
- source_word: בְנֵי יוֹסֵף
  english_pob_choice: the sons of Joseph
  chosen_korean: 요셉의 아들들인
  alternatives_korean:
  - 요셉의 자손인
  - 요셉의 자녀인
  lexicon: HALOT
  rationale: 족보·지파 문맥의 직설적 표현을 살려 ‘요셉의 아들들’로 옮겼고, 뒤의 열거를 자연스럽게 받도록 관계형으로 구성했습니다.
- source_word: מְנַשֶּׁה / אֶפְרָיִם
  english_pob_choice: Manasseh and Ephraim
  chosen_korean: 므낫세와 에브라임
  alternatives_korean:
  - 만세와 에브라임
  - 므낫세와 에브라임 지파
  lexicon: 표준 음역 관례
  rationale: 인명·지파명은 한국어 성경에서 널리 쓰이는 표준 음역을 따랐습니다.
