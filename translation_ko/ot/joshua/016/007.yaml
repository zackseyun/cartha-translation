id: JOS.16.7
reference: Joshua 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרַ֥ד מִ/יָּנ֖וֹחָ/ה עֲטָר֣וֹת וְ/נַעֲרָ֑תָ/ה וּ/פָגַע֙ בִּֽ/ירִיח֔וֹ וְ/יָצָ֖א הַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
  footnotes:
  - marker: a
    text: Hebrew Naarah; some relate this place name to Naarath in Joshua 16:7–8 traditions.
    reason: alternative_reading
  - marker: b
    text: Or 'reached Jericho' for 'touched Jericho'; the Hebrew verb can denote a boundary line meeting or touching a location.
    reason: lexical_alternative
  - marker: c
    text: Or 'went out to the Jordan'; the Hebrew idiom describes the boundary line's course or endpoint.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그것은 야노아에서 아다롯과 나아라[a]로 내려가고, 여리고에 닿아[b], 요단으로 나아갑니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 나아라라고 적고 있으며, 일부 전승은 여호수아 16:7–8의 다른 자료에서 나아랏과 연결합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘여리고에 닿다’. 히브리어 동사는 경계선이 어떤 지점에 맞닿거나 접하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘요단으로 나아가다’. 이 히브리어 관용구는 경계선의 종착점이나 진행 방향을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  english_pob_choice: Then it went down
  chosen_korean: 내려가고
  alternatives_korean:
  - 내려왔고
  - 내려갔습니다
  lexicon: HALOT
  rationale: 경계 설명에서 지형적 하강을 나타내므로, 자연스러운 현대 한국어로 ‘내려가고’라고 옮겨 연속 동작을 살렸습니다.
- source_word: מִיָּנוֹחָה
  english_pob_choice: from Janoah
  chosen_korean: 야노아에서
  alternatives_korean:
  - 야노아로부터
  - 야노아로
  lexicon: HALOT
  rationale: 지명은 음역하고 מִן의 기원을 한국어 조사 ‘에서’로 옮겼습니다.
- source_word: וְנַעֲרָתָה
  english_pob_choice: and Naarah
  chosen_korean: 나아라
  alternatives_korean:
  - 나아랏
  - 나아랏으로
  lexicon: HALOT
  rationale: 마소라 본문의 철자형을 따라 지명 ‘나아라’로 음역했고, 대조 전승 가능성은 각주로 남겼습니다.
- source_word: וּפָגַע בִּירִיחוֹ
  english_pob_choice: and touched Jericho
  chosen_korean: 여리고에 닿아
  alternatives_korean:
  - 여리고에 도달하여
  - 여리고를 스치고
  lexicon: HALOT
  rationale: פגע는 경계 문맥에서 ‘닿다/맞닿다’의 공간적 의미를 가지므로, ‘도달하다’보다 경계가 맞닿는 뉘앙스를 살린 ‘닿다’가 더 적절합니다.
- source_word: וְיָצָא הַיַּרְדֵּן
  english_pob_choice: and ended at the Jordan
  chosen_korean: 요단으로 나아갑니다
  alternatives_korean:
  - 요단에서 끝납니다
  - 요단에 이릅니다
  lexicon: HALOT
  rationale: boundary formula의 완료/종착을 한국어로 자연스럽게 풀어, ‘나아갑니다’로 경계선의 진행 방향과 종결 지점을 함께 표현했습니다.
theological_decisions:
- issue: 경계 설명의 서술 방식
  chosen_reading: 지명 열거를 부드러운 현재형 진행 서술로 옮겨, 고대 경계 목록의 연속성을 유지했습니다.
  alternative_readings:
  - 과거 서술로 통일
  - 명사구 나열로 압축
  rationale: 이 절은 내러티브보다 경계 기술에 가깝기 때문에, 한국어에서도 선형적인 이동 감각이 드러나도록 했습니다.
  doctrine_reference: 본문-장르 적합성
- issue: נַעֲרָה/נַעֲרָתָה 전승
  chosen_reading: 본문 철자형 ‘나아라’를 기본으로 두고, 다른 전승 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 나아랏 본문화
  - 주석 없이 통일
  rationale: 본문 형태를 우선하되, 관련 전승 차이를 숨기지 않기 위해 각주를 두었습니다.
  doctrine_reference: 본문비평 원칙
