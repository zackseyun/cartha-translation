id: JOS.16.1
reference: Joshua 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
  footnotes:
  - marker: a
    text: Or 'the lot fell for the sons of Joseph.' The Hebrew verb is literally 'came out,' but in allotment contexts English often uses 'fell.'
    reason: lexical_alternative
  - marker: b
    text: '''The waters of Jericho'' may refer specifically to Jericho''s spring or water source.'
    reason: cultural_note
translation:
  language: ko
  text: 요셉 자손을 위한 제비가 나왔습니다. 그 경계는 여리고 곁의 요단에서 동쪽으로 여리고의 물[a]까지 이르고, 광야를 지나 여리고에서 벧엘 산지로 올라갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여리고의 물’은 여리고의 샘이나 수원을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא / הַגּוֹרָל
  english_pob_choice: And the lot came out
  chosen_korean: 그 제비가 … 나왔습니다
  alternatives_korean:
  - 그 제비가 … 떨어졌습니다
  - 그 제비가 … 나갔습니다
  lexicon: HALOT
  rationale: 할라트식 분배 문맥에서 גורל을 ‘제비’로 옮기고, וַיֵּצֵא의 기본 의미인 ‘나오다’를 살려 결과를 직역에 가깝게 표현했습니다. ‘떨어졌다’는 관용적이지만 원문 동사를 덧씌우는 면이 있어 보조 선택으로만 둡니다.
- source_word: לִבְנֵי יוֹסֵף
  english_pob_choice: for the sons of Joseph
  chosen_korean: 요셉의 아들들
  alternatives_korean:
  - 요셉의 자손들
  - 요셉의 자녀들
  lexicon: HALOT
  rationale: 히브리어 בני의 친족표현을 살리되, 한국어에서는 복수 집합으로 자연스럽게 읽히는 ‘아들들’로 옮겼습니다.
- source_word: מִיַּרְדֵּן יְרִיחוֹ / לְמֵי יְרִיחוֹ
  english_pob_choice: from the Jordan at Jericho / to the waters of Jericho
  chosen_korean: 여리고 곁의 요단에서, 동쪽의 여리고 물들까지
  alternatives_korean:
  - 여리고의 요단에서, 여리고의 물들까지
  - 여리고 곁 요단에서, 여리고의 샘까지
  lexicon: HALOT
  rationale: 지리적 경계 설명을 따라 시작점과 도착점을 분명히 했습니다. לְמֵי יְרִיחוֹ의 ‘물들’은 여리고의 수원/샘을 가리킬 수 있지만, 원문 수준에서는 일반 명사인 ‘물들’이 가장 안전합니다.
- source_word: הַמִּדְבָּר עֹלֶה מִירִיחוֹ
  english_pob_choice: through the wilderness, going up from Jericho
  chosen_korean: 광야를 지나, 여리고에서 올라가
  alternatives_korean:
  - 광야를 거쳐, 여리고에서 올라가
  - 광야를 지나, 여리고에서 상승하여
  lexicon: HALOT
  rationale: מִדְבָּר은 ‘광야’로 옮겨 지형적 경로를 살렸고, עֹלֶה는 경계선이 지형을 따라 ‘올라간다’는 뜻을 자연스럽게 반영했습니다.
- source_word: בָּהָר בֵּית אֵל
  english_pob_choice: into the hill country of Bethel
  chosen_korean: 벧엘의 산지에 이릅니다
  alternatives_korean:
  - 벧엘의 산지로 올라갑니다
  - 벧엘 산지로 들어갑니다
  lexicon: HALOT
  rationale: הר는 단일 ‘산’보다 산지/고지대를 가리키므로 ‘산지’가 적절합니다. 종결부는 경계 설명의 흐름에 맞춰 현재형 서술로 정리했습니다.
