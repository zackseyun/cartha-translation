source:
  edition: WLC
  text: וְ/יָֽרַד יָ֜מָּ/ה אֶל גְּב֣וּל הַ/יַּפְלֵטִ֗י עַ֣ד גְּב֧וּל בֵּית חוֹרֹ֛ן תַּחְתּ֖וֹן וְ/עַד גָּ֑זֶר וְ/הָי֥וּ תצאת/ו יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
  footnotes:
  - marker: a
    text: Hebrew literally, 'its goings out were at the sea,' a boundary formula meaning its extremities or termination points reached the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 서쪽으로 내려가서 야플레트 사람들의 경계에 이르고, 아래 벧호론의 경계에 이르며, 또 게셀에 이르렀습니다. 그리고 그 끝은 바다에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것의 나가는 곳들은 바다에 있었다’이며, 경계의 끝점들이 바다에 이르렀다는 뜻의 경계 공식을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  english_pob_choice: Then it went down
  chosen_korean: 그리고 그것은 서쪽으로 내려가서
  alternatives_korean:
  - 그것은 내려갔습니다
  - 그것은 서쪽으로 내려갔습니다
  lexicon: HALOT
  rationale: 경계 설명의 지형적 이동을 살려 ‘내려가서’로 옮기고, 문맥상 흐름을 자연스럽게 하기 위해 앞의 접속을 ‘그리고’로 처리했습니다.
- source_word: יָמָּה
  english_pob_choice: westward
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 바다를 향하여
  - 서해 쪽으로
  lexicon: HALOT
  rationale: 히브리어의 방향형은 지리적 문맥에서 ‘서쪽으로’라는 뜻이므로, 한글 독자에게 가장 직접적이고 자연스럽게 전달했습니다.
- source_word: הַיַּפְלֵטִי
  english_pob_choice: the Japhletites
  chosen_korean: 야플레트 사람들의
  alternatives_korean:
  - 야플렛 사람들의
  - 야플레티 사람들의
  lexicon: HALOT
  rationale: 지명/집단명은 현대 음역 원칙에 따라 음역했고, 집단성은 ‘사람들의’로 드러냈습니다.
- source_word: תֹצְאֹתָיו
  english_pob_choice: and its goings out were
  chosen_korean: 그리고 그 끝은
  alternatives_korean:
  - 그리고 그 경계의 나가는 곳은
  - 그리고 그 출구들은
  lexicon: HALOT
  rationale: 경계 공식에서 תֹצְאֹת은 ‘나가는 곳’보다 경계의 종결점·말단을 가리키므로, 더 간결한 ‘끝’으로 옮겼습니다.
theological_decisions:
- issue: 경계 공식의 종결 표현
  chosen_reading: ‘그 끝은 바다에 있었습니다’로 마무리해 경계의 종착점을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그 경계의 끝은 바다에 있었습니다’
  - ‘그 종점은 바다였습니다’
  rationale: 히브리어의 지리적 경계 공식을 한국어에서 자연스럽게 유지하면서도, 마지막 도착점을 분명히 보여 주는 표현이 필요했습니다.
  doctrine_reference: 번역학적/문체적 결정
