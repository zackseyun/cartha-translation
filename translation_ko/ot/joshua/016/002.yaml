translation:
  language: ko
  text: 그러고 나서 그 경계는 벧엘에서 루스[a]로 나아가고, 아르기인들의 경계 곧 아다롯까지 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아르키인들”로 옮길 수 있습니다. 이는 הָאַרְכִּי의 다른 음역 전통을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: Then it went out
  chosen_korean: 나아가고
  alternatives_korean:
  - 나갔습니다
  - 이어졌습니다
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내는 용법이므로, 주어를 직접 보충하기보다 경계가 '나아가' 이어지는 흐름을 살렸습니다.
- source_word: מִבֵּית אֵל לוּזָה
