  rationale: 지명은 관용적 음역을 따르되, 출발점과 도착점을 한국어 어순으로 자연스럽게 정리했습니다.
- source_word: הָאַרְכִּי
  english_pob_choice: the Arkites
  chosen_korean: 아르기인들
