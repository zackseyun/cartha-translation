base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
  footnotes:
  - marker: a
    text: Or "the Archites," reflecting an alternate transliteration of the gentilic הָאַרְכִּי.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그 경계는 벧엘에서 루스로 나아갔으며, 아다롯에 있는 아르기 사람들[a]의 경계까지 이어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아르키 사람들”로 옮길 수 있습니다. 이는 הָאַרְכִּי의 다른 음역 전통을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: Then it went out
  chosen_korean: 나아가고
  alternatives_korean:
  - 나갔습니다
  - 이어졌습니다
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내는 용법이므로, 주어를 직접 보충하기보다 경계가 '나아가' 이어지는 흐름을 살렸습니다.
- source_word: מִבֵּית אֵל לוּזָה
  english_pob_choice: from Bethel to Luz
  chosen_korean: 벧엘에서 루스로
  alternatives_korean:
  - 벧엘에서 루스로
  - 벧엘에서 루스 쪽으로
  lexicon: HALOT
  rationale: 지명은 관용적 음역을 따르되, 출발점과 도착점을 한국어 어순으로 자연스럽게 정리했습니다.
- source_word: הָאַרְכִּי
  english_pob_choice: the Arkites
  chosen_korean: 아르기인들
  alternatives_korean:
  - 아르키인들
  - 아르기 사람들
  lexicon: HALOT
  rationale: 히브리어 gentilics를 한국어로 옮길 때 '-인들'을 써서 집단성을 드러냈고, 음역은 원어의 אַרְכִּי를 반영했습니다.
- source_word: עֲטָרוֹת
  english_pob_choice: Ataroth
  chosen_korean: 아다롯
  alternatives_korean:
  - 아타롯
  lexicon: HALOT
  rationale: 지명은 한국어 성경권에서 통용되는 음역에 맞추되, 원어 자음열을 과도하게 바꾸지 않았습니다.
