source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
  footnotes:
  - marker: a
    text: Literally, 'toward the sea,' a Hebrew idiom for 'westward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 경계는 서쪽으로[a] 나아가 북쪽의 미그므닷에 이르렀고, 경계는 동쪽으로 돌아 타아낫-실로에 이르렀으며, 그곳을 동쪽으로 지나 야노아에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 표현은 ‘바다 쪽으로’이지만, 관용적으로 ‘서쪽으로’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגְּבוּל
  english_pob_choice: the border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 경계 지역
  lexicon: HALOT
  rationale: 이 문맥의 גְּבוּל은 영토 자체보다 분배 경계를 가리키므로, 한국어에서는 자연스럽고 정확한 ‘경계’를 택했습니다.
- source_word: הַיָּמָּה
  english_pob_choice: westward
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 바다 쪽으로
  - 서편으로
  lexicon: HALOT
  rationale: 히브리어의 ‘바다 쪽’ 관용구는 여기서 곧 서쪽을 뜻하므로, 본문에는 의미를 바로 드러내는 ‘서쪽으로’를 두고, 직역 가능성은 각주 없이 보존했습니다.
- source_word: תַּאֲנַת שִׁלֹה
  english_pob_choice: Taanath-shiloh
  chosen_korean: 타아낫-실로
  alternatives_korean:
  - 타아낫 실로
  - 타아나트-실로
  lexicon: HALOT
  rationale: 지명은 음역이 필요하며, 합성 지명임을 보이기 위해 하이픈을 유지했습니다.
- source_word: וְעָבַר אוֹתוֹ
  english_pob_choice: passed it on the east
  chosen_korean: 그 동쪽의 …를 지나
  alternatives_korean:
  - 그것을 동쪽으로 지나
  - 그 동쪽을 지나
  lexicon: HALOT
  rationale: עבר은 경계 기술에서 ‘지나가다/통과하다’의 뜻이므로, 지명 뒤에 위치 관계를 붙여 ‘그 동쪽의 …를 지나’로 옮겨 경계선의 진행을 살렸습니다.
- source_word: יָנוֹחָה
  english_pob_choice: Janoah
  chosen_korean: 야노아
  alternatives_korean:
  - 야노하
  - 자노아
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 원칙에 따라 옮겼고, 통용되는 성서식 표기와의 연결을 해치지 않도록 간결하게 처리했습니다.
theological_decisions:
- issue: 경계 서술의 방향어 표현
  chosen_reading: 본문의 ‘서쪽/동쪽’ 방향을 한국어로 명시적으로 드러내어 지리적 진행을 바로 이해하도록 했습니다.
  alternative_readings:
  - ‘바다 쪽으로’처럼 히브리 관용구를 더 직역하는 방식
  - 방향어를 완만하게 풀어 쓰는 방식
  rationale: 여기서는 신학적 쟁점보다 지리적 경계 기술의 정확성이 핵심이므로, 관용구를 해석해 독자가 즉시 파악할 수 있게 하는 쪽이 원문의 의도를 더 잘 전달합니다.
  doctrine_reference: 본문은 제비뽑기 분배의 경계 설명이며, 방향어는 서술 정보로 기능합니다.
