translation:
  language: ko
  text: 에브라임 자손의 영토는 그들의 씨족별로 이러합니다. 그들의 유업의 동쪽 경계는 아다롯 앗달에서 윗 벧호론까지입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  english_pob_choice: the sons of Ephraim
  chosen_korean: 에브라임 자손
  alternatives_korean:
  - 에브라임의 아들들
  - 에브라임 사람들
  lexicon: HALOT
  rationale: 지파 경계 문맥이므로 히브리어의 친족·계보 표현을 살려 ‘자손’으로 옮겼습니다.
- source_word: גְּבוּל
  english_pob_choice: territory / border
  chosen_korean: 지역 / 경계
  alternatives_korean:
  - 지경
  - 변경
  lexicon: HALOT
  rationale: 첫 번째는 지파의 분배 범위를 가리키므로 ‘지역’이 자연스럽고, 두 번째는 경계선 자체를 가리키므로 ‘경계’가 맞습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: 히브리어 משפחה는 여기서 지파 내부의 하위 단위를 뜻하므로, 한국어에서는 가족보다 큰 단위를 드러내는 ‘종족’이 가장 무난합니다.
- source_word: עַטְרוֹת אַדָּר
  english_pob_choice: Ataroth-addar
  chosen_korean: 아타롯-앗달
  alternatives_korean:
  - 아타롯-아달
  - 아타롯 아달
  lexicon: HALOT
  rationale: 고유 지명은 음역했으며, 한국어 외래어 표기 관행을 따라 복합 지명을 하이픈으로 연결했습니다.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  english_pob_choice: Upper Beth-horon
  chosen_korean: 상벧호론
  alternatives_korean:
  - 위 벧호론
  - 윗벧호론
  lexicon: HALOT
  rationale: 상·하의 대조가 있는 지명이라 ‘상-’을 붙여 의미를 살렸고, 기존 성서 지명 표기 관행을 반영해 붙여 썼습니다.
