revisions:
- from: 그리고 에브라임 자손의 지역은 그들의 종족대로 이러합니다. 그들의 유업의 동쪽 경계는 아타롯-앗달이요, 상벧호론까지입니다.
  to: 에브라임 자손의 영토는 그들의 씨족별로 이러합니다. 그들의 유업의 동쪽 경계는 아다롯 앗달에서 윗 벧호론까지입니다.
  rationale: 첫 גְּבוּל은 지파의 영토 범위를 가리키므로 ‘영토’로, 둘째 גְּבוּל은 지명들로 이어지는 경계 기술이므로 ‘경계’로 옮겼습니다. לְמִשְׁפְּחֹתָם은 ‘씨족별로’로 자연스럽게 반영했으며, 지명과 ‘~까지’의 범위 관계를 한국어 문장 안에서 명확히 했습니다. 본문에 필요한 텍스트상 불확실성이나 번역 대안은 없어 각주를 두지 않았습니다.
  reviewer_model: gpt-5.6-terra
