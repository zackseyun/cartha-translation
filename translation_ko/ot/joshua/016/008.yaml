  source_fidelity: 원문은 다푸아에서 경계가 서쪽으로 가나의 나할까지 이어지고 그 종점들(집합적으로는 ‘끝’)이 바다에 이른다고 말합니다. 초안의 기본 의미는 대체로 맞지만, ‘에브라임 자손의 지파’는 한국어 구성 관계가 다소 불명확하며, 원문의 지파 명칭을 더 자연스럽게 결합할 필요가 있습니다. 또한 원문의 경계 기술에 맞게 ‘이어지며’와 ‘닿습니다’로 매끄럽게 표현할 수 있습니다.
  naturalness: ‘경계는 … 가고’보다 ‘경계는 … 이어지며’가 현대 한국어의 지경(地境) 서술에서 자연스럽습니다. ‘가족별로 받은 기업’도 가능하나 ‘그들의 가족에 따라 받은 기업’이 לְמִשְׁפְּחֹתָם의 분배 기준을 더 직접적으로 드러냅니다. 각 주석 표지는 해당 단어 또는 구에 붙여야 합니다.
