base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
  footnotes:
  - marker: a
    text: Or “to the sea,” with “westward” reflecting the common directional sense of the Hebrew in land-boundary descriptions.
    reason: lexical_alternative
  - marker: b
    text: “Brook” may also be rendered “wadi.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “sons of Ephraim,” a standard tribal designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 다푸아에서 경계는 서쪽으로[b] 가나 시내[a]까지 이어지며, 그 끝은 바다에 닿습니다. 이것이 에브라임 자손[c] 지파가 그들의 가족에 따라 받은 기업입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시내’(히브리어 나할)는 물이 흐르는 골짜기나 개울, 또는 계절에 따라 마르는 물길(와디)을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 방향 표현은 문자적으로 ‘바다 쪽으로’일 수 있으나, 토지 경계 문맥에서는 흔히 ‘서쪽으로’를 뜻합니다.
    reason: source_note
  - marker: c
    text: 히브리어는 문자적으로 ‘에브라임의 아들들’이며, 여기서는 에브라임 지파를 가리키는 표준 명칭입니다.
    reason: lexical_alternative
