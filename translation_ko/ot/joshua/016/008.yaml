source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
  footnotes:
  - marker: a
    text: Or “to the sea,” with “westward” reflecting the common directional sense of the Hebrew in land-boundary descriptions.
    reason: lexical_alternative
  - marker: b
    text: “Brook” may also be rendered “wadi.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “sons of Ephraim,” a standard tribal designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 다푸아에서 경계는 서쪽으로 가나 시내까지 가고, 그 끝은 바다에 이릅니다. 이것이 에브라임 자손의 지파가 그들의 가족별로 받은 기업입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가나 시내’는 히브리어 נַחַל קָנָה의 의미를 풀어 옮긴 것입니다. POB 영어의 ‘Brook’은 ‘wadi’의 가능성을 함께 인정합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 방향 표현 יָמָּה는 경계 문맥에서 흔히 ‘서쪽으로’를 뜻합니다.
    reason: source_note
  - marker: c
    text: ‘에브라임 자손’은 히브리어의 표준 지파 명칭인 ‘sons of Ephraim’을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  english_pob_choice: From Tappuah
  chosen_korean: 다푸아에서
  alternatives_korean:
  - 타푸아에서
  - 다푸아로부터
  lexicon: HALOT
  rationale: 지명은 현대 표기 관행에 따라 음역하고, 시작점을 나타내는 מִן의 뜻은 한국어 조사 ‘에서’로 자연스럽게 드러냈습니다.
- source_word: יֵלֵךְ הַגְּבוּל
  english_pob_choice: the border goes
  chosen_korean: 경계는 ... 가고
  alternatives_korean:
  - 경계가 ... 가며
  - 경계선은 ... 뻗고
  - 경계가 ... 달려
  lexicon: HALOT
  rationale: 경계가 이어지는 토지 경계 문맥의 관용을 살리되, 현대 한국어에서 과도하게 직역처럼 들리지 않도록 ‘가다’ 구문으로 옮겼습니다.
- source_word: יָמָּה
  english_pob_choice: westward
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 바다 쪽으로
  - 서편으로
  lexicon: HALOT
  rationale: 여기서는 지향점이 아니라 방위 의미가 우세하므로, ‘서쪽으로’가 원문의 방향성을 가장 분명하게 전달합니다.
- source_word: נַחַל קָנָה
  english_pob_choice: the Brook of Kanah
  chosen_korean: 가나 시내
  alternatives_korean:
  - 가나 개천
  - 가나 와디
  lexicon: HALOT
  rationale: נַחַל은 문맥상 물줄기/시내를 가리키며, 고유지명은 이해하기 쉬운 현대 한국어 표현인 ‘시내’로 처리했습니다.
- source_word: זֹאת נַחֲלַת
  english_pob_choice: This is the inheritance of
  chosen_korean: 이것이 ... 받은 기업입니다
  alternatives_korean:
  - 이것이 ...의 기업입니다
  - 이것은 ...의 기업입니다
  lexicon: HALOT
  rationale: 요약 진술의 ‘This is’는 한국어에서 현재형 단정으로 자연스럽게 옮기고, 할당받은 분배 의미를 ‘받은 기업’으로 살렸습니다.
- source_word: בְנֵי אֶפְרַיִם
  english_pob_choice: the sons of Ephraim
  chosen_korean: 에브라임 자손
  alternatives_korean:
  - 에브라임의 아들들
  - 에브라임 사람들
  lexicon: HALOT
  rationale: 직역된 남성 복수 표현을 유지하되 한국어 성경 관용에 맞게 ‘자손’으로 옮겨, 혈통적·지파적 의미를 함께 드러냈습니다.
theological_decisions:
