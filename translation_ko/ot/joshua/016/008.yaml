  - 그 종말은 바다였습니다
  rationale: 원문의 경계 종결을 지리적 사실 진술로 유지해야 하므로, 완료형보다 현재형 서술이 토지 분배 문맥에 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
