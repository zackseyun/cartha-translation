  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
  footnotes:
  - marker: a
    text: Or 'the cities separated for the sons of Ephraim.' The Hebrew participle emphasizes that these cities were distinguished from Manasseh's territory for Ephraim's use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에브라임 자손을 위해 따로 구별된 성읍들—곧 모두 그 성읍들과 그 마을들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브라임 자손을 위해 분리된 성읍들’. 히브리어 분사는 이 성읍들이 므낫세의 땅에서 에브라임의 사용을 위해 구별되었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּבְדָּלוֹת
  english_pob_choice: set apart
  chosen_korean: 따로 구별된
  alternatives_korean:
  - 분리된
  - 떼어 놓은
  - 따로 지정된
  lexicon: HALOT
  rationale: בדל의 핵심인 분리·구별을 살리면서, 분배된 땅 문맥에서는 행정적 의미도 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לִבְנֵי אֶפְרַיִם
  english_pob_choice: for the sons of Ephraim
  chosen_korean: 에브라임 자손을 위해
  alternatives_korean:
  - 에브라임의 아들들을 위해
  - 에브라임 사람들을 위해
  - 에브라임의 후손들을 위해
  lexicon: HALOT
  rationale: בני의 직역 구조를 유지하되, 한국어에서는 목적·수혜를 분명히 하는 조사구로 자연스럽게 풀었습니다.
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי מְנַשֶּׁה
  english_pob_choice: within the inheritance of the sons of Manasseh
  chosen_korean: 므낫세 자손의 기업 안에서
  alternatives_korean:
  - 므낫세 자손의 상속지 안에서
  - 므낫세 자손의 분깃 안에서
  - 므낫세 자손의 유산 한가운데서
  lexicon: HALOT
  rationale: נחלה는 여호수아의 지파 분배 문맥에서 ‘기업’이 가장 정확하게 언약적 토지 분깃을 드러내므로 이를 사용했습니다.
- source_word: כָּל הֶעָרִים וְחַצְרֵיהֶן
  english_pob_choice: all the cities and their villages
  chosen_korean: 곧 모두 그 성읍들과 그 마을들입니다
  alternatives_korean:
  - 곧 모든 성읍들과 그 마을들입니다
  - 곧 그 모든 성읍들과 그 마을들입니다
  - 곧 성읍들과 딸린 마을들 모두입니다
  lexicon: HALOT
  rationale: חצרים는 성읍에 딸린 마을·거주지를 뜻하는 경우가 많아, 문맥상 ‘마을들’로 옮기되 소유 대상을 분명히 했습니다.
theological_decisions:
- issue: ‘set apart’의 의미를 단순한 지리적 분리로만 볼지, 수혜 지파를 위한 지정으로 볼지
  chosen_reading: 에브라임 자손을 위해 따로 구별된 성읍들
  alternative_readings:
  - 에브라임 자손에게 따로 떼어 둔 성읍들
  - 에브라임 자손을 위해 지정된 성읍들
  rationale: 본문의 분사형은 단순 분리보다 ‘다른 지파의 기업 안에 있으나 에브라임에게 속하도록 구별됨’이라는 배분 의미를 담으므로, 그 긴장을 살려 번역했습니다.
  doctrine_reference: 여호수아의 기업 분배 본문에 나타나는 지파 간 경계와 하나님의 주권적 배분
