  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
  footnotes:
  - marker: a
    text: Or 'the cities separated for the sons of Ephraim.' The Hebrew participle emphasizes that these cities were distinguished from Manasseh's territory for Ephraim's use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므낫세 자손의 기업 안에 있는, 에브라임 자손을 위하여 따로 구별된 모든 성읍과 그 마을들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브라임 자손을 위하여 분리된 성읍들’. 히브리어 분사는 이 성읍들이 므낫세 자손의 기업 안에서 에브라임 자손을 위하여 구별되어 있음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
