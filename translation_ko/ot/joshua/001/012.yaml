  footnotes:
  - marker: a
    text: 히브리어 לֵאמֹר는 '말하며/라고'의 기능을 하는 발화 표지로, 다음 절에서 이어질 직접 화법을 예고합니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  english_pob_choice: and to the Reubenites
  chosen_korean: 르우벤 사람들
  alternatives_korean:
  - 르우벤 지파
  - 르우벤 자손들
  lexicon: HALOT
  rationale: 히브리어 단수 gentillic 형태가 집합적으로 쓰였으므로, 자연스럽고 집합성을 살리는 복수 표현으로 옮겼습니다.
- source_word: וְ/לַ/גָּדִי
  english_pob_choice: and to the Gadites
  chosen_korean: 갓 사람들
  alternatives_korean:
  - 갓 지파
  - 갓 자손들
  lexicon: HALOT
  rationale: 앞 항목과 같은 이유로, 집합적 gentillic을 현대 한국어에서 자연스럽게 전달하는 복수 표현을 택했습니다.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  english_pob_choice: and to the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반 지파
  - 므낫세 지파의 반
  lexicon: HALOT
  rationale: 직역적 구조를 유지하되, 한국어에서 굳어진 지파 명칭을 따라 '반 지파'로 간결하게 옮겼습니다.
- source_word: אָמַר ... לֵ/אמֹר
  english_pob_choice: said,
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하여
  lexicon: HALOT
  rationale: אָמַר의 기본 의미를 직접 살리면서도, 뒤의 לֵאמֹר가 다음 절의 직접 화법을 여는 표지이므로 한국어에서는 쉼표보다 자연스러운 서술로 처리했습니다.
theological_decisions:
- issue: 여호수아의 발화 도입 방식
  chosen_reading: 본문은 다음 절로 이어지는 발화 도입이므로, 한국어에서도 단순 서술형으로 처리해 직접 화법의 시작을 자연스럽게 예고했습니다.
  alternative_readings:
  - '''...말하며''로 옮겨 다음 절의 인용을 더 강하게 드러내는 방식'
  - '''...라고 말했습니다''로 더 명시적으로 처리하는 방식'
  rationale: לֵאמֹר는 본문에 실질적인 내용을 더하지 않고 발화를 여는 표지이므로, 과잉 번역보다 자연스러운 한국어 문장 흐름을 우선했습니다.
  doctrine_reference: 문맥 중심의 서술 전개
