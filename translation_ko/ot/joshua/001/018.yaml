id: JOS.1.18
reference: Joshua 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
  footnotes:
  - marker: a
    text: Literally, 'Every man who rebels against your mouth.' The Hebrew idiom 'your mouth' means your command or authoritative word.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 명령을 거역하고, 당신이 그에게 명령하는 모든 일에서 당신의 말을 듣지 않는 모든 사람은 죽임을 당할 것입니다[a]. 다만 강하고 담대하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신의 입을 거역하는 모든 사람”입니다. 여기서 “입”은 권위 있는 명령이나 말을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  english_pob_choice: Every man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 남자
  - 누구든지
  lexicon: HALOT
  rationale: 히브리어의 distributive masculine singular을 살리되, 한국어에서는 성별을 굳이 드러내지 않는 ‘모든 사람’이 문맥상 가장 자연스럽고, 일반적 범위를 잘 전달합니다.
- source_word: יַמְרֶה אֶת פִּיךָ
  english_pob_choice: rebels against your command
  chosen_korean: 당신의 명령에 거역하고
  alternatives_korean:
  - 당신의 입에 거역하고
  - 당신에게 반항하고
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 입’이지만 관용적으로 권위 있는 명령을 뜻하므로, 한국어에서는 그 의미를 드러내는 ‘명령에 거역하다’로 옮겼습니다.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  english_pob_choice: and does not listen to your words
  chosen_korean: 당신이 그에게 명령하는 모든 것을 듣지 않는
  alternatives_korean:
  - 당신의 말을 듣지 않는
  - 당신의 말씀을 듣지 않는
  lexicon: HALOT
  rationale: שמע는 단순 청취보다 순종적 경청을 뜻하므로, 앞의 ‘거역하다’와 중복을 피하면서도 순종 거부를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 죽임을 당할 것입니다
  alternatives_korean:
  - 사형에 처해질 것입니다
  - 죽게 될 것입니다
  lexicon: HALOT
  rationale: 법적·사법적 처벌로서의 사형을 뜻하므로, 단순한 자연사적 ‘죽다’보다 ‘죽임을 당하다’가 수동적 강제성을 더 잘 반영합니다.
- source_word: רַק חֲזַק וֶאֱמָץ
  english_pob_choice: Only be strong and courageous
  chosen_korean: 다만 강하고 담대하십시오
  alternatives_korean:
  - 오직 강하고 용감하십시오
  - 다만 강하고 굳세십시오
  lexicon: HALOT
  rationale: 여호수아의 반복적 권면을 현대 한국어에서 자연스럽고 힘 있게 전달하는 표준적 표현으로, ‘담대하다’가 용기의 결을 잘 살립니다.
theological_decisions:
- issue: 대상의 성별 표지 처리
  chosen_reading: 모든 사람
  alternative_readings:
  - 모든 남자
  - 누구든지
  rationale: 히브리어 איש의 남성형은 대표적 일반표현이지만, 한국어 수신자에게는 성별을 전면화하지 않는 것이 의미를 왜곡하지 않으면서도 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ‘입’의 관용적 의미 처리
  chosen_reading: 명령에 거역하고
  alternative_readings:
  - 입에 거역하고
  - 말에 거역하고
  rationale: ‘당신의 입’은 문자 그대로의 신체 부위가 아니라 권위 있는 명령을 가리키는 관용구이므로, 그 권위성을 유지하는 번역이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: HALOT idiom note
