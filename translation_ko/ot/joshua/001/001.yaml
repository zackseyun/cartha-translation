translation:
  language: ko
  text: 모세, 곧 야훼의 종이 죽은 뒤에, 야훼께서 눈의 아들 여호수아—모세의 시종—에게 말씀하시기를:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘모세의 시종’으로, ‘모세의 시종’·‘모세의 신하’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  english_pob_choice: Now after the death of
  chosen_korean: 죽은 뒤에
  alternatives_korean:
  - 모세가 죽은 후에
  - 모세의 죽음 뒤에
  lexicon: HALOT
  rationale: 서사 전환과 시간 순서를 자연스럽게 드러내면서도 원문의 간결한 시간표현을 살렸습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 섬김을 받는 사람
  lexicon: HALOT
  rationale: 모세에게 붙는 관용적·명예적 호칭이므로 bonded-status를 강조하는 ‘노예’보다 ‘종’이 원문의 직분적 뉘앙스를 더 정확히 전달합니다.
- source_word: מְשָׁרֵת מֹשֶׁה
  english_pob_choice: the attendant of Moses
  chosen_korean: 모세의 시종
  alternatives_korean:
  - 모세의 수행자
  - 모세의 종
  lexicon: HALOT
  rationale: מְשָׁרֵת은 ‘시중들다/봉사하다’의 능동 분사로, 예배 용어의 ‘사역자’보다 일반적 보좌·수행 의미가 살아 있는 ‘시종’이 가장 적절합니다.
- source_word: לֵאמֹר
  english_pob_choice: ':'
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 말하여
  - 이르시되
  lexicon: HALOT
  rationale: 히브리어의 인용 도입 표지를 한국어에서는 직접화법을 예고하는 ‘말씀하시기를’로 옮겨, 뒤따를 하나님의 말씀 구조를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 신적 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 언약의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 모세의 호칭 ‘עֶבֶד יְהוָה’의 뉘앙스
  chosen_reading: 야훼의 종
  alternative_readings:
  - 야훼의 노예
  rationale: 모세를 부르는 이 표현은 예속 상태보다 하나님께 속한 충실한 봉사자의 신분을 강조하는 표제이므로, 한국어에서도 ‘종’으로 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; context-sensitive renderings for bonded-status terms
