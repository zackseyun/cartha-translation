base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'Now after the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
  footnotes:
  - marker: a
    text: Hebrew 'Moses' attendant'; alternatively 'Moses' minister' or 'Moses' servant.'
