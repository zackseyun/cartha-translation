  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: ko
  text: 그때 여호수아가 백성의 관리들에게 이렇게 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: Then ... commanded
  chosen_korean: 그때 ... 명령하여
  alternatives_korean:
  - 그리고 ... 명령하여
  - 지시하여
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 ‘그때’로 살리고, 지시의 강도를 유지하기 위해 ‘명령하여’를 선택했습니다.
- source_word: שֹׁטְרֵי
  english_pob_choice: officers
  chosen_korean: 관리들
  alternatives_korean:
  - 관원들
  - 관리관들
  - 지도자들
  lexicon: HALOT
  rationale: שֹׁטֵר는 넓은 의미의 ‘지도자’보다 행정·감독 직무를 가진 공적 담당자를 가리키므로, 한국어로는 문맥상 자연하면서도 직무성을 살린 ‘관리들’이 적절합니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 백성
  - 민족
  - 사람들
  lexicon: HALOT
  rationale: 언약 공동체를 가리키는 일반적 집합명사이므로, ‘백성’이 가장 직접적이고 문맥에 맞습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르러
  - 말하여
  lexicon: HALOT
  rationale: 직접화법 도입 공식이므로, 한국어에서는 다음 절로 이어지는 발화 표지를 자연스럽게 드러내는 ‘말했습니다’로 옮겼습니다.
theological_decisions:
- issue: 지시 행위의 강도
  chosen_reading: 여호수아의 행위를 단순한 권고가 아니라 공적 명령으로 표현했습니다.
  alternative_readings:
  - 지시했다
  - 말했다
  rationale: 문맥의 서술 동사는 צווה로, 공동체 수행을 이끄는 권위 있는 명령을 나타내므로 약화하지 않았습니다.
  doctrine_reference: 서사 본문에서 지도자 권위와 순종의 관계를 그대로 반영
