id: JOS.1.4
reference: Joshua 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
  footnotes:
  - marker: a
    text: That is, the Mediterranean Sea.
    reason: cross_reference
  - marker: b
    text: Or 'toward the west'; literally, 'toward the going down of the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 광야와 이 레바논에서부터 큰 강, 곧 유프라테스 강까지, 모든 헷 사람의 땅과 해 지는 쪽[b]의 큰 바다[a]까지가 너희의 경계가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 지중해입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘서쪽의’; 문자적으로는 ‘해가 지는 쪽으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  english_pob_choice: From the wilderness
  chosen_korean: 광야에서부터
  alternatives_korean:
  - 광야로부터
  - 들판에서부터
  lexicon: HALOT
  rationale: 경계 범위를 말하는 문맥이므로 출발점을 나타내는 ‘-에서부터’를 살리고, בארץ/사막보다 성경적 지리어법에 맞는 ‘광야’를 택했습니다.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  english_pob_choice: and this Lebanon
  chosen_korean: 이 레바논
  alternatives_korean:
  - 레바논
  - 이 레바논 산지
  lexicon: HALOT
  rationale: 지시형용사 הַזֶּה를 반영해 ‘이’를 살렸고, 본문에 없는 ‘산지’는 덧붙이지 않았습니다.
- source_word: נְהַר פְּרָת
  english_pob_choice: the Euphrates River
  chosen_korean: 유프라테스 강
  alternatives_korean:
  - 유프라테스
  - 유프라테스 강줄기
  lexicon: HALOT
  rationale: 히브리어의 apposition을 자연스럽게 풀어 ‘강’을 붙여 지리 표지를 분명히 했습니다.
- source_word: כֹּל אֶרֶץ הַחִתִּים
  english_pob_choice: all the land of the Hittites
  chosen_korean: 모든 헷 사람의 땅
  alternatives_korean:
  - 헷 사람들의 온 땅
  - 모든 히타이트 땅
  lexicon: HALOT
  rationale: 엔에스티의 민족명칭을 한국어 성경의 통용형 ‘헷 사람’으로 옮기되, כֹּל의 포괄성을 ‘모든’으로 유지했습니다.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  english_pob_choice: toward the going down of the sun
  chosen_korean: 해지는 쪽
  alternatives_korean:
  - 해 지는 방향
  - 해가 지는 곳
  lexicon: HALOT
  rationale: 직역만 하면 다소 경직되므로, 히브리어 관용구가 가리키는 서쪽 방향을 한국어로 자연스럽게 드러내되 문자적 이미지는 보존했습니다.
theological_decisions:
- issue: 경계 선언의 명령/예언적 어조
  chosen_reading: 미래형 선언인 ‘너희의 경계가 될 것입니다’로 옮겨, 여호수아에게 주어지는 약속의 성격을 드러냈습니다.
  alternative_readings:
  - 너희의 경계가 됩니다
  - 너희의 경계가 되리라
  rationale: 히브리어 יִהְיֶה는 단순 미래/선언적 용법이므로, 현대 한국어에서는 약속의 확실성을 살린 정중한 미래형이 가장 적절합니다.
  doctrine_reference: 언약적 약속의 선언
- issue: ‘큰 바다’의 처리
  chosen_reading: 본문의 ‘큰 바다’를 본문에 유지해 원지시를 살리고, 식별은 본문 밖에서 처리하지 않았습니다.
  alternative_readings:
  - 지중해
  - 서쪽 큰 바다
  rationale: POB 영어본이 주석으로 지중해를 밝히지만, 히브리어 본문 자체는 ‘큰 바다’라고 말하므로 본문은 그대로 두는 것이 원문 충실합니다.
  doctrine_reference: 지리 식별의 본문-주석 구분
