  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
  footnotes:
  - marker: a
    text: Or “in three more days” / “after three days.” The Hebrew expression indicates a short remaining period before the crossing; “within three days” best captures the sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 진영 한가운데를 지나가며 백성에게 명령하여 이렇게 말하십시오. ‘여러분을 위하여 양식을 준비하십시오. 사흘 안에[a] 여러분은 이 요르단을 건너, 여러분의 하나님 야훼께서 여러분에게 차지하게 하려고 주시는 그 땅을 차지하려고 들어갈 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사흘 더 지나면’ 또는 ‘사흘 후에’. 히브리어 표현은 건너기 전까지 남아 있는 짧은 기간을 가리키며, 여기서는 ‘사흘 안에’가 그 뜻을 가장 잘 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  english_pob_choice: Go through the midst of the camp
  chosen_korean: 진영 한가운데를 지나가며
  alternatives_korean:
  - 진영을 지나가며
  - 진영 가운데를 지나가며
  - 진영 한복판을 지나가며
  lexicon: HALOT
  rationale: עִבְרוּ는 이동 명령이고 בְּקֶרֶב은 ‘가운데/한가운데’를 뜻하므로, 군영 내부를 실제로 가로지르는 그림을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: וְצַוּוּ אֶת הָעָם
  english_pob_choice: and command the people
  chosen_korean: 백성에게 명령하여
  alternatives_korean:
  - 백성에게 지시하여
  - 백성에게 명하여
  - 백성을 명령하여
  lexicon: HALOT
  rationale: צוה의 강한 명령 어감을 살리기 위해 ‘명령하다’를 택했습니다.
- source_word: הָכִינוּ לָכֶם צֵידָה
  english_pob_choice: Prepare provisions for yourselves
  chosen_korean: 먹을 것을 준비해 두십시오
  alternatives_korean:
  - 양식을 준비해 두십시오
  - 식량을 준비해 두십시오
  - 여행 식량을 준비해 두십시오
  lexicon: HALOT
  rationale: צֵידָה는 여행/행군을 위한 보급품을 가리키므로, 딱딱한 직역보다 문맥상 필요한 준비를 드러내면서도 과도하게 좁히지 않는 표현으로 옮겼습니다.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  english_pob_choice: because within three days
  chosen_korean: 사흘 안에
  alternatives_korean:
  - 사흘 뒤에
  - 사흘이 더 지나면
  - 사흘 후에
  lexicon: HALOT
  rationale: בְּעוֹד은 아직 남은 짧은 기간을 나타내므로, 영어 POB의 ‘within three days’에 맞게 임박성을 살려 ‘사흘 안에’로 번역했습니다.
- source_word: לָבוֹא לָרֶשֶׁת
  english_pob_choice: to go in to take possession of
  chosen_korean: 들어가서 차지하려고
  alternatives_korean:
  - 들어가서 소유하려고
  - 들어가서 점유하려고
  - 들어가서 차지하고
  lexicon: HALOT
  rationale: לָרֶשֶׁת는 단순 소유보다 정복/상속의 맥락이 있으므로, ‘차지하다’로 그 힘을 살렸습니다. 목적의 연쇄도 한국어 자연성에 맞게 풀었습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 주 당신들의 하나님
  alternatives_korean:
  - 야훼 당신들의 하나님
  - 여호와 당신들의 하나님
  - 주 너희 하나님
  lexicon: HALOT
  rationale: 본문의 YHWH는 기본적으로 POB 관례에 따라 ‘주’로 옮기되, 언약 호칭인 ‘당신들의 하나님’ 구조를 유지해 관계성을 드러냈습니다.
theological_decisions:
- issue: 요르단 강과 언약 땅을 향한 정복/차지 표현
  chosen_reading: ‘차지하려고 들어갈 것입니다’로 번역해 단순 이동이 아니라 약속된 땅을 실제로 점유하는 목적을 드러냈습니다.
  alternative_readings:
  - ‘소유하려고’
  - ‘점유하려고’
  - ‘차지하러’
  rationale: 히브리어 לָרֶשֶׁת은 약속 성취와 실제 점유를 함께 내포하므로, 약화된 ‘소유’보다 ‘차지하다’가 문맥의 결을 더 잘 드러냅니다.
  doctrine_reference: Joshua 1:11의 정복-기업 수여 문맥
- issue: 하나님 이름 YHWH의 한국어 처리
  chosen_reading: 본문에서는 POB 기본 관례에 따라 ‘주’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 구절의 영어 POB가 ‘the LORD’로 처리한 것을 따라, 한국어 본문도 예배 공동체의 가독성과 문맥 일관성을 고려해 ‘주’로 옮겼습니다.
  doctrine_reference: POB project default for יְהוָה / YHWH
