  to: 진영 한가운데를 지나가며 백성에게 명령하여 이렇게 말하십시오. ‘여러분을 위하여 양식을 준비하십시오. 사흘 안에[a] 여러분은 이 요르단을 건너, 여러분의 하나님 야훼께서 여러분에게 차지하게 하려고 주시는 그 땅을 차지하려고 들어갈 것입니다.’
  rationale: 야훼라는 신명을 영어 POB의 확정 선택에 맞추어 복원했습니다. צֵידָה는 ‘양식’으로 옮겨 행군을 위한 식량 준비의 뜻을 살렸습니다. 땅을 주시는 행위와 그 땅을 차지하게 되는 목적의 관계는 ‘차지하게 하려고 주시는’으로 보존했으며, 본문의 두 차례 ירשׁ는 모두 ‘차지하다’로 일관되게 반영했습니다. 시간 표현 각주는 해당 구절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:15Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령형 복수, 진영 내부를 통과하는 공간 표현, 사흘이라는 임박한 시간 표현, 요르단을 건너 땅에 들어가 차지하는 목적은 대체로 반영되었습니다. 그러나 יְהוָה를 ‘주’로 처리한 것은 제공된 영어 POB의 최종 선택 및 프로젝트의 ‘Yahweh’ 방침과 맞지 않습니다. 또한 ‘주어 소유하게 하시는’은 히브리어의 ‘여러분에게 주시는 땅을 그것을 차지하도록’이라는 구조를 부자연스럽게 처리합니다.
  naturalness: 합쇼체 명령과 인용 형식은 자연스럽습니다. 다만 ‘먹을 것’은 צֵידָה가 가리키는 여행·행군용 준비물의 뜻을 다소 약화하므로 ‘양식’이 더 적절합니다. ‘주 당신들의 하나님’도 현대 표준 한국어 성경 문체에서는 ‘여러분의 하나님 야훼’가 더 자연스럽습니다.
  terminology: YHWH는 영어 POB 감사 기록의 확정 선택인 ‘Yahweh’에 맞추어 ‘야훼’로 통일해야 합니다. ירשׁ의 점유·차지 의미는 ‘차지하다’로 유지하되, 마지막 ‘차지하게 하려고 주시는’은 히브리어의 목적 관계를 자연스럽게 보존합니다. 각주 표지는 시간 표현 바로 뒤에 두어야 합니다.
