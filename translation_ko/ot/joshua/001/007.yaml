  source_fidelity: 핵심 의미와 תַשְׂכִּיל의 ‘지혜롭게 행하다’라는 선택은 적절합니다. 그러나 현행 ‘내가 네게 명령한 모세 내 종’은 히브리어의 주어 관계를 뒤바꾸어, 명령한 이가 ‘내 종 모세’라는 뜻을 정확히 전달하지 못합니다. 또한 כְּכָל의 ‘~에 따라’의 뜻을 ‘율법대로’로 명시하는 편이 충실합니다.
  naturalness: 합쇼체 명령형을 일관되게 사용하고, ‘치우치지 말아야 하며’를 직접 명령인 ‘치우치지 마십시오’로 고쳐 현대 표준어의 문장 흐름과 원문의 병렬 명령을 살렸습니다.
  terminology: ‘내 종’, ‘율법’, ‘지켜 행하다’, ‘담대하다’는 이 문맥의 관습적이면서도 이해 가능한 용어입니다. ‘형통하다/성공하다’는 תַשְׂכִּיל의 가능한 결과적 뉘앙스로 각주에 보존합니다.
