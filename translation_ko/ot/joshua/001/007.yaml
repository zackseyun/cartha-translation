base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
  footnotes:
  - marker: a
    text: Or 'you may prosper' or 'you may have success' in all you do/go.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 강하고 매우 담대하십시오. 내 종 모세가 네게 명령한 모든 율법대로 지켜 행하도록 조심하십시오. 그것에서 오른쪽으로나 왼쪽으로나 치우치지 마십시오. 그리하면 네가 가는 모든 곳에서 지혜롭게 행할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형통할 것입니다’ 또는 ‘성공할 것입니다’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그저
  lexicon: HALOT
  rationale: 문맥상 앞선 전체 명령을 한마디로 압축해 강조하는 전환어이므로, 현대 한국어에서 가장 자연스럽게 제한·강조를 드러내는 ‘오직’을 선택했습니다.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  english_pob_choice: be strong and very courageous
  chosen_korean: 강하고 매우 담대하여
  alternatives_korean:
  - 강하고 매우 용감하여
  - 굳세고 크게 담대하여
  lexicon: HALOT
  rationale: חזק와 אמץ의 짝을 한국어에서 지나치게 문어적인 중복 없이 담아내기 위해 ‘강하고’와 ‘담대하여’를 배치했고, מְאֹד는 ‘매우’로 살렸습니다.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  english_pob_choice: being careful to do
  chosen_korean: 지켜 행하도록 조심하라
  alternatives_korean:
  - 지켜 행하게 하라
  - 지켜서 행하도록 하라
  lexicon: HALOT
  rationale: ‘지키다’로 보존·준수의 뜻을, ‘행하다’로 실제 실행의 뜻을 함께 살려서, 관찰과 실행이 결합된 히브리어 연쇄를 자연스럽게 옮겼습니다.
- source_word: הַתּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: HALOT
  rationale: 모세가 명령한 내용이므로 여기서는 토라의 언약적·규범적 의미가 분명해 ‘율법’이 가장 정확합니다.
theological_decisions:
- issue: תַּשְׂכִּיל의 의미를 지혜/성공 중 어디에 두는가
  chosen_reading: 지혜롭게 행할 것입니다
  alternative_readings:
  - 형통할 것입니다
  - 성공할 것입니다
  rationale: 히브리어의 핵심은 단순한 번영보다 ‘분별 있게, 지혜롭게 행함’에 있으므로 본문에는 지혜의 의미를 두고, 결과로서의 성공 가능성은 여지를 남겨 두었습니다.
  doctrine_reference: 과도한 번영 해석을 피하고 본문이 허용하는 의미 범위를 보존합니다.
