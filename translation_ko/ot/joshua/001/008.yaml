base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
  footnotes:
  - marker: a
    text: Or 'mutter it' or 'recite it under your breath'; the Hebrew verb can include quiet oral repetition as well as meditation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 율법책이 당신의 입에서 떠나지 않게 하십시오. 오히려 그것을 낮에도 밤에도 묵상하여, 그 안에 기록된 모든 것을 따라 지키고 행하도록 하십시오. 그러면 당신의 길이 형통하게 될 것이며, 또 지혜롭게 행하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중얼거리다’, ‘작게 소리 내어 되뇌다’라는 뜻일 수도 있습니다. 히브리어 동사는 조용한 구두 반복과 묵상을 함께 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָמוּשׁ
  english_pob_choice: shall not depart
  chosen_korean: 떠나지 않게 하십시오
  alternatives_korean:
  - 떠나지 않을 것입니다
  - 멀어지지 않게 하십시오
  lexicon: HALOT
  rationale: 입에서 ‘떠나지’ 않는다는 구체적 이미지를 살리되, 명령형 문맥에 맞게 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  english_pob_choice: this book of the law
  chosen_korean: 이 율법책
  alternatives_korean:
  - 이 법의 책
  - 이 토라 책
  lexicon: HALOT
  rationale: 토라는 이 문맥에서 언약적 규범 전체를 가리키므로, 한국어 독자에게 가장 분명한 ‘율법책’으로 옮겼습니다.
- source_word: וְהָגִיתָ בּוֹ יוֹמָם וָלַיְלָה
  english_pob_choice: you shall meditate on it day and night
  chosen_korean: 그것을 낮에도 밤에도 묵상하여
  alternatives_korean:
  - 그것을 밤낮으로 되뇌어
  - 그것을 주야로 읊조려
  lexicon: HALOT
  rationale: הגה의 묵상과 낮은 소리의 반복이라는 중첩된 뜻을 살리되, 본문 흐름상 가장 읽기 자연스러운 ‘묵상하다’를 기본으로 택했습니다.
- source_word: תַּשְׂכִּיל
  english_pob_choice: you will act wisely
  chosen_korean: 지혜롭게 행하게 될 것입니다
  alternatives_korean:
  - 신중하게 행하게 될 것입니다
  - 슬기롭게 처신하게 될 것입니다
  lexicon: HALOT
  rationale: כָּל הַכָּתוּב에 대한 순종의 결과로 나타나는 שכל의 의미를, 단순한 성공이 아니라 ‘지혜롭게 행함’으로 구분해서 살렸습니다.
theological_decisions:
- issue: 율법에 대한 한국어 용어 선택
  chosen_reading: 율법책
  alternative_readings:
  - 토라책
  - 법책
  rationale: 이 구절은 성경의 한 권이 아니라 여호와께서 주신 규범적 기록을 가리키므로, 한국 교회 독자에게도 기능이 분명한 ‘율법책’을 사용했습니다.
  doctrine_reference: Joshua 1:8 covenant obedience context
