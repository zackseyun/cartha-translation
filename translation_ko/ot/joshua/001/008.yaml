  to: 이 율법책이 당신의 입에서 떠나지 않게 하십시오. 그것을 밤낮으로 묵상하십시오[a]. 그 안에 기록된 모든 것을 따라 지켜 행하도록 하십시오. 그러면 당신이 가는 길을 형통하게 할 것이며, 지혜롭게 행하게 될 것입니다.
