  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
  footnotes:
  - marker: a
    text: Or 'you shall give this people the land as an inheritance.' The Hebrew verb is causative ('cause to inherit'), which may also be expressed more idiomatically in English as giving or apportioning an inheritance.
    reason: lexical_alternative
  - marker: b
    text: '''Their fathers'' refers to Israel''s forefathers, especially the patriarchs; alternatively, ''their ancestors.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 강하고 담대하십시오. 이는 당신이 이 백성이 내가 그들의 조상들에게[b] 주겠다고 맹세한 그 땅을 유산으로 차지하게 할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 תַּנְחִיל은 사역형으로, 직역하면 '상속받게 하다'입니다. 따라서 '주다'보다 '차지하게 하다'가 원문의 사역적 의미를 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: '''아버지들''은 이스라엘의 족장들을 가리키며, 문맥상 ''조상들''로 이해할 수도 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 힘을 내고 담대하십시오
  alternatives_korean:
  - 강해지고 용감해지십시오
  - 굳세고 담대하십시오
  lexicon: HALOT
  rationale: 두 명령형의 병렬을 자연스러운 현대 한국어로 살리되, 단순한 심리적 격려보다 사명 수행에 필요한 강인함과 담대함을 함께 드러내기 위해 '힘을 내고 담대하십시오'로 옮겼습니다.
- source_word: תַּנְחִיל
  english_pob_choice: you shall cause ... to inherit
  chosen_korean: 기업으로 받게 하실 것이기 때문입니다
  alternatives_korean:
  - 상속받게 하실 것이기 때문입니다
  - 기업으로 주실 것이기 때문입니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 보존하기 위해 '받게 하다'를 사용했고, '기업'은 약속된 땅을 유업으로 받는 성경적 개념을 유지합니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  lexicon: HALOT
  rationale: 히브리어의 문자적 'fathers'는 문맥상 족장들을 가리키지만, 한국어에서는 오해를 줄이기 위해 '조상들'로 옮기되, 남성 복수의 혈통적·언약적 지시를 해치지 않는 범위에서 자연스럽게 표현했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 그 지역
  lexicon: HALOT
  rationale: 여호수아 문맥의 약속된 땅을 가리키므로 '그 땅'을 유지하여 언약적 지시를 보존했습니다.
theological_decisions:
- issue: '''조상들''로 옮긴 족장 언급의 성별-정확성'
  chosen_reading: 족장들을 포함하는 언약적 조상 지시로 이해하되, 한국어에서는 자연성을 위해 '조상들'을 사용했습니다.
  alternative_readings:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  rationale: 히브리어는 문자적으로 '아버지들'이지만, 한국어에서 직역하면 관계가 부자간으로 오해될 수 있어 문맥상 족장들을 가리키는 언약적 의미를 유지하는 방향으로 조정했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
