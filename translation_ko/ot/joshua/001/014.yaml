  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓임
    rationale: ‘형제들’의 대표적 남성 친족어에 관한 주석과 ‘무장한 채’의 대안 해석 주석은 각각 해당 어구 바로 뒤에 표지해야 독자가 주석의 대상을 명확히 알 수 있습니다.
