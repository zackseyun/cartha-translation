revisions:
- from: 너희의 아내들과 너희의 어린 자식들과 너희의 가축은 모세가 너희에게 준 땅, 요단 저편에 머물러 있어야 합니다. 그러나 너희는 모든 용맹한 용사들과 함께, 너희 형제들 앞에서 무장한 채 건너가서 그들을 도와야 합니다.[a][b]
  to: 너희의 아내들과 어린 자녀들과 가축은 모세가 너희에게 준 요단 저편의 땅에 머물러 있어야 합니다. 그러나 너희 가운데 모든 용맹한 용사들은 무장한 채[b] 너희 형제들보다 앞서[a] 건너가 그들을 도와야 합니다.
  rationale: 동격 관계를 ‘너희 가운데 모든 용맹한 용사들’로 풀어, 가족을 남겨 두고 전투 가능한 자들이 앞서 건너간다는 원문의 구조를 보존했습니다. 관련 각주 표지를 해당 어구로 옮겼으며, 그 밖의 의미와 현대 합쇼체 문체는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:12Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 가족·가축이 요단 저편에 남고 전투 가능한 남성들이 앞서 건너 돕는 대조를 잘 전달합니다. 그러나 ‘모든 용맹한 용사들과 함께’는 히브리어의 ‘너희, 곧 모든 용맹한 용사들’이라는 동격적 범위를 동행 의미로 바꿀 수 있습니다. 또한 ‘앞에서’보다 ‘앞서’가 여기서 선행하여 나아간다는 뜻을 더 정확히 드러냅니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. 다만 ‘너희의’ 반복은 한국어에서 다소 무겁고, ‘어린 자녀들’이 ‘어린 자식들’보다 현대 표준어의 공적 성경 문체에 더 자연스럽습니다.
  terminology: ‘아내들’, ‘가축’, ‘무장한 채’, ‘형제들’, ‘용맹한 용사들’은 적절합니다. חֲמֻשִׁים의 불확실한 뉘앙스는 주석으로 보존하는 것이 타당합니다.
  issues:
  - severity: medium
    issue: ‘모든 용맹한 용사들과 함께’
