  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
  footnotes:
  - marker: a
    text: Or 'your fellow Israelites' for 'your brothers'; the Hebrew uses the masculine kinship term representatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'in battle array' or 'arrayed for war' for 'armed.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희의 아내들과 어린 자녀들과 가축은 모세가 너희에게 준 요단 저편의 땅에 머물러 있어야 합니다. 그러나 너희 가운데 모든 용맹한 용사들은 무장한 채[b] 너희 형제들보다 앞서[a] 건너가 그들을 도와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 친족어를 대표적으로 사용하여 ‘형제들’이라고 합니다. 여기서는 이스라엘 공동체의 구성원들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무장한 채’로 옮긴 히브리어 חֲמֻשִׁים은 문맥상 ‘전투 대형으로’ 또는 ‘전쟁 준비를 갖추고’라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְשֵׁיכֶם
  english_pob_choice: your wives
  chosen_korean: 너희의 아내들
  alternatives_korean:
  - 너희의 여자들
  lexicon: HALOT
  rationale: 가정/군사 문맥에서 남성 소유격 복수는 아내들을 가리키는 것이 자연스러우므로, 일반적 ‘여자들’보다 구체적인 ‘아내들’이 원문 의미를 더 정확히 드러냅니다.
- source_word: טַפְּכֶם
  english_pob_choice: your little ones
  chosen_korean: 너희의 어린 자식들
  alternatives_korean:
  - 너희의 자녀들
  - 너희의 부양가족
  lexicon: HALOT
  rationale: טַף는 어린아이들 또는 부양 대상을 가리키지만, 여기서는 가족 구성원 가운데 남겨지는 어린 자녀를 가리키는 맥락이 분명하므로 ‘어린 자식들’이 가장 직접적입니다.
- source_word: וּמִקְנֵיכֶם
  english_pob_choice: and your livestock
  chosen_korean: 너희의 가축
  alternatives_korean:
  - 너희의 소떼
  - 너희의 재산
  lexicon: HALOT
  rationale: מִקְנֶה는 집에서 기르는 가축 떼를 뜻하므로, 현대 한국어에서 가장 자연스럽고 구체적인 ‘가축’이 적절합니다.
- source_word: חֲמֻשִׁים
  english_pob_choice: armed
  chosen_korean: 무장한 채
  alternatives_korean:
  - 전투 대형으로
  - 전쟁 준비를 갖추고
  lexicon: HALOT
  rationale: 군사적 문맥에서 ‘무장하다’가 가장 분명한 현대적 대응입니다. POB의 ‘armed’도 기본 의미를 살리면서, 단순한 이동이 아니라 전투 준비 상태임을 드러냅니다.
theological_decisions:
- issue: 아ֲחֵיכֶם의 대표성 있는 남성형 친족 표현
  chosen_reading: 너희 형제들
  alternative_readings:
  - 너희 동족
  - 너희 이스라엘 형제들
  rationale: 히브리어는 남성 복수 친족어를 사용하지만, 여기서는 공동체 전체를 대표하는 표현입니다. 원문 형식을 유지하기 위해 본문은 ‘형제들’로 두고, 필요 시 주석에서 대표성을 설명할 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
