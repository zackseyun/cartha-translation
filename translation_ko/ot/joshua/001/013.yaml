  source_fidelity: וְנָתַן은 문법적으로 확정적 미래로도 해석될 수 있으나, 이 절에서 모세의 명령은 이미 요단 동쪽 땅을 받은 지파들에게 적용됩니다. 따라서 מֵנִיחַ의 현재적·진행적 진술과 함께, וְנָתַן은 기본적으로 완료된 수여인 ‘주셨습니다’로 옮기는 것이 본문과 문맥에 더 충실합니다. 현 초안의 미래형은 영어 POB 본문을 따르지만, 제공된 영어 각주 및 어휘 결정과도 서로 충돌합니다.
  naturalness: ‘모세, 곧 야훼의 종이’는 가능하지만 쉼표 삽입이 다소 부자연스럽습니다. ‘모세 곧 야훼의 종이’로 하면 현대 한국어 문장 흐름이 더 매끄럽습니다. 또한 인용문 안의 두 술어는 ‘안식을 주시고 … 주셨습니다’로 연결하는 편이 자연스럽고 원문의 접속을 잘 반영합니다.
  terminology: ‘야훼’, ‘하나님’, ‘종’, ‘안식’, ‘기억하십시오’는 모두 적절하며 합쇼체 격식에도 맞습니다. 하나님의 행위를 높이는 ‘주시고/주셨습니다’도 적합합니다.
