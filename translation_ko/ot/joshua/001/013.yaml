id: JOS.1.13
reference: Joshua 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
  footnotes:
  - marker: a
    text: Or 'will give you this land.' The Hebrew verb can be understood as an assured future; here it is rendered 'has given' because the eastern tribes had already received their inheritance.
    reason: alternative_reading
translation:
  language: ko
  text: “모세 곧 야훼의 종이 여러분에게 명령한 말씀을 기억하십시오. ‘야훼 여러분의 하나님이 여러분에게 안식을 주시고, 이 땅을 여러분에게 주셨습니다[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 땅을 여러분에게 주실 것입니다.” 히브리어 완료형은 확정된 미래를 나타낼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 생각해 내십시오
  lexicon: HALOT
  rationale: 여호수아의 직접적인 명령을 현대 합쇼체로 옮기되, 단순 회상보다 순종적 상기라는 힘을 살리기 위해 ‘기억하십시오’를 택했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 종인 사람
  - 야훼의 노예
  lexicon: HALOT
  rationale: 모세를 가리키는 영예칭이므로 ‘종’이 가장 자연스럽고, 본문이 강조하는 것은 신분적 노예 상태가 아니라 야훼께 속한 봉사입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 하나님의 이름을 대체어가 아닌 고유명으로 드러내기 위해 ‘야훼’를 유지했습니다.
- source_word: מֵנִיחַ
  english_pob_choice: is giving you rest
  chosen_korean: 여러분에게 안식을 주시며
  alternatives_korean:
  - 여러분을 쉬게 하시며
  - 여러분에게 쉼을 주시며
  lexicon: HALOT
  rationale: 히필 분사는 ‘쉬게 하다/안식을 주다’의 의미이므로, 현재 진행형의 약속적 진술을 살려 ‘안식을 주시며’로 옮겼습니다.
- source_word: וְנָתַן
  english_pob_choice: will give
  chosen_korean: 주실 것입니다
  alternatives_korean:
  - 주셨습니다
  - 주십니다
  lexicon: HALOT
  rationale: 문맥상 요단 동편 지파들에게 약속된 확정적 미래를 나타내므로, 영어 POB의 최종 채택과 같이 미래로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼의 지칭 방식
  chosen_reading: 하나님의 언약 이름을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 이 절은 신명기-여호수아의 언약적 맥락에서 하나님의 고유 이름을 직접 사용하는 것이 본문의 정체성과 힘을 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
- issue: וְנָתַן의 시간상
  chosen_reading: ‘이 땅을 여러분에게 주실 것입니다’로 미래형을 택했습니다.
  alternative_readings:
  - ‘이 땅을 여러분에게 주셨습니다’
  - ‘이 땅을 여러분에게 주십니다’
  rationale: 본문은 아직 완성되지 않은 약속의 확증을 말하며, 선포된 미래를 통해 하나님의 신실하심을 강조합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
