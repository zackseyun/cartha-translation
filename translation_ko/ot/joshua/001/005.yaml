id: JOS.1.5
reference: Joshua 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
  footnotes:
  - marker: a
    text: Or 'No one will be able to stand before you.' The Hebrew idiom can carry the sense of successful resistance.
    reason: lexical_alternative
  - marker: b
    text: '''No man'' uses a masculine singular Hebrew form with generic force, meaning no human opponent.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will not let go of you or forsake you.' The first verb suggests not dropping, relaxing, or failing to support.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신 앞에는 평생 아무도 맞서 서지 못할 것입니다[a]. 내가 모세와 함께 있었던 것같이 당신과도 함께 있을 것입니다. 나는 당신을 버리거나 떠나지 않을 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신 앞에 맞서 설 수 있는 사람은 아무도 없을 것입니다.’ 히브리어 관용구는 성공적으로 저항하는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아무도’는 히브리어 남성 단수형이지만, 여기서는 모든 인간 적대자를 가리키는 일반적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내가 당신을 놓아버리거나 떠나지 않을 것입니다.’ 첫 동사는 놓아버리다, 느슨하게 하다, 붙들어 주는 일을 멈추지 않다의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב ... לְפָנֶיךָ
  english_pob_choice: will stand before you
  chosen_korean: 당신 앞에는 ... 맞서 서지 못할 것입니다
  alternatives_korean:
  - 당신 앞에는 ... 서지 못할 것입니다
  - 당신 앞에 ... 대항하지 못할 것입니다
  - 당신 앞에 ... 버티지 못할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 יצב의 대적적 뉘앙스를 살리기 위해 단순히 ‘서다’가 아니라 ‘맞서 서다’로 옮겼습니다. לְפָנֶיךָ는 ‘당신 앞에’로 직역하되, 문맥상 ‘맞서’와 결합해 대항의 의미가 드러나게 했습니다.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  english_pob_choice: all the days of your life
  chosen_korean: 평생
  alternatives_korean:
  - 당신의 생애 동안
  - 삶의 모든 날 동안
  - 사는 동안 내내
  lexicon: HALOT
  rationale: 히브리어의 관용적 생애 전체를 뜻하는 표현을 한국어의 자연스러운 시간 표현인 ‘평생’으로 압축해 의미를 유지했습니다.
- source_word: אֶהְיֶה עִמָּךְ
  english_pob_choice: I will be with you
  chosen_korean: 당신과도 함께 있을 것입니다
  alternatives_korean:
  - 당신과 함께하겠습니다
  - 내가 당신과 함께 있을 것입니다
  - 당신과 함께하리라
  lexicon: HALOT
  rationale: 하나님의 임재 약속을 현대 한국어의 자연스러운 미래형으로 옮겼습니다. 모세와의 비교 구조를 살리기 위해 ‘모세와 함께 있었던 것같이’와 대응되도록 했습니다.
- source_word: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  english_pob_choice: I will not fail you or forsake you
  chosen_korean: 나는 당신을 버리거나 떠나지 않을 것입니다
  alternatives_korean:
  - 나는 당신을 놓아버리거나 떠나지 않을 것입니다
  - 나는 당신을 놓지 않거나 버리지 않을 것입니다
  - 나는 당신을 실패시키지 않고 버리지 않을 것입니다
  lexicon: HALOT
  rationale: אַרף의 ‘놓다/느슨하게 하다/버티지 못하게 하다’ 뉘앙스는 한국어 ‘버리다’만으로는 다 담기 어렵지만, 짝구조의 두 번째 동사 ‘떠나지’와 함께 하나님의 포기하지 않으심을 자연스럽게 전달할 수 있어 문맥상 가장 적절한 표현으로 정했습니다.
theological_decisions:
- issue: אִישׁ의 일반적 남성형을 어떻게 한국어에 반영할지
  chosen_reading: ‘아무도’로 풀지 않고, 주어를 생략한 상태에서 ‘아무도’의 의미가 드러나게 했습니다.
  alternative_readings:
  - 아무 사람도
  - 어떤 남자도
  - 어느 누구도
  rationale: 히브리어 אִישׁ은 문법상 남성 단수이지만 여기서는 인간 적대자를 가리키는 일반적 용법입니다. 한국어에서는 성별 오해를 줄이면서도 원문의 대표성은 유지하도록 ‘아무도’로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
- issue: ‘fail you’와 ‘forsake you’의 이중 부정 뉘앙스
  chosen_reading: ‘버리거나 떠나지 않을 것입니다’
  alternative_readings:
  - 놓지 않거나 버리지 않을 것입니다
  - 포기하지 않거나 떠나지 않을 것입니다
  - 당신을 실패시키지 않거나 버리지 않을 것입니다
  rationale: 두 동사는 서로 다른 결을 가지지만 함께 하나님의 신실한 동행을 포괄합니다. 한국어에서는 ‘버리다/떠나다’의 짝으로 포기와 이탈을 함께 드러내어, 언약적 확언의 강도를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1 and §5
