- from: 당신 앞에는 평생 아무도 맞서 서지 못할 것입니다[a]. 내가 모세와 함께 있었던 것같이 당신과도 함께 있을 것입니다. 나는 당신을 버리거나 떠나지 않을 것입니다[c][b].
  to: 당신 앞에는 평생 아무도[a][b] 맞서 서지 못할 것입니다. 내가 모세와 함께 있었던 것같이 당신과도 함께 있을 것입니다. 나는 당신을 놓아 버리지도, 버리지도 않을 것입니다[c].
  rationale: 원문의 이중 부정과 두 동사의 어휘적 차이를 보존하도록 마지막 문장을 고쳤습니다. 또한 각주 b를 ‘아무도’에, 각주 c를 해당 이중 동사구에 배치하여 앵커가 설명 대상과 일치하게 했고, 각주 c의 어휘 설명을 원문 동사의 방향에 맞게 바로잡았습니다.
