  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
  footnotes:
  - marker: a
    text: Or 'your fellow Israelites'; Hebrew 'your brothers,' a masculine plural term that here refers to the other tribes of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'to the east'; literally 'toward the sunrise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분에게 하신 것처럼 여러분의 형제들[a]에게도 안식을 주시고, 그들도 여러분의 하나님 야훼께서 그들에게 주고 계신 땅을 차지할 때까지입니다. 그 후 여러분은 여러분의 소유지로 돌아가서, 야훼의 종 모세가 여러분에게 요단강 건너편, 해 뜨는 쪽[b]에 준 그 땅을 차지하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 동족들’; 히브리어는 남성 복수 ‘형제들’이며, 여기서는 이스라엘의 다른 지파들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 단순히 ‘동쪽으로’; 문자적으로는 ‘해 뜨는 쪽을 향하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  english_pob_choice: gives ... rest
  chosen_korean: 안식을 주시고
  alternatives_korean:
  - 쉬게 하시고
  - 평안을 주시고
  lexicon: HALOT
  rationale: 히필형 נוח는 여기서 전쟁과 정복의 상황 속에서 ‘쉬게 하다/안식을 주다’의 뜻이므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘안식을 주시고’로 옮겼습니다.
- source_word: לַאֲחֵיכֶם
  english_pob_choice: your brothers
  chosen_korean: 여러분의 형제들에게
  alternatives_korean:
  - 여러분의 동족들에게
  - 여러분의 형제자매들에게
  lexicon: HALOT
  rationale: 히브리어 복수 남성형을 그대로 반영해 ‘형제들’로 옮겼고, 문맥상 이스라엘의 다른 지파들을 가리킨다는 점은 본문에서 과도하게 풀지 않았습니다.
- source_word: וִירִשְׁתֶּם / וְיָרְשׁוּ
  english_pob_choice: take possession of
  chosen_korean: 차지하다
  alternatives_korean:
  - 소유하다
  - 점유하다
  - 상속받다
  lexicon: HALOT
  rationale: 정복·배분 문맥의 ירש는 단순 소유보다 ‘차지하다’가 능동적 점유와 분배의 뉘앙스를 함께 살려 줍니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼를 섬기는 종
  lexicon: HALOT
  rationale: 모세의 공식적 호칭이므로 ‘종’이 적절하며, 본문이 노예 상태를 말하는 것은 아니어서 ‘노예’는 피했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 테트라그라마톤을 제목어 ‘주’로 바꾸지 않고 고유명사로 드러내어, 언약 이름이라는 स्रोत의 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 형제들로 번역되는 남성 복수 אֲחֵיכֶם
  chosen_reading: 여러분의 형제들에게
  alternative_readings:
  - 여러분의 동족들에게
  - 여러분의 형제자매들에게
  rationale: 히브리어의 성 구별을 평준화하지 않고 본문 형식을 유지했습니다. 문맥상 이스라엘 전체를 가리키는 기능은 독자가 자연스럽게 이해할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
