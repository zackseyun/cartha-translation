revisions:
- from: 야훼께서 여러분의 형제들에게도 여러분에게 주신 것처럼 안식을 주시고, 그들도 야훼 여러분의 하나님이 그들에게 주고 계신 땅을 차지할 때까지입니다. 그 후에는 여러분은 여러분의 소유의 땅으로 돌아가, 야훼의 종 모세가 여러분에게 요단 저편, 해 뜨는 쪽에 준 그 땅을 차지할 것입니다.[a][b]
  to: 야훼께서 여러분에게 하신 것처럼 여러분의 형제들[a]에게도 안식을 주시고, 그들도 여러분의 하나님 야훼께서 그들에게 주고 계신 땅을 차지할 때까지입니다. 그 후 여러분은 여러분의 소유지로 돌아가서, 야훼의 종 모세가 여러분에게 요단강 건너편, 해 뜨는 쪽[b]에 준 그 땅을 차지하십시오.
  rationale: 원문의 시간 한정(‘~할 때까지’), 안식의 비교(‘여러분에게 하신 것처럼’), 하나님의 동격 호칭, 땅을 차지하는 순서를 보존했습니다. 문체는 현대 한국어 합쇼체로 통일했고, 원문의 명령적 문맥에 맞춰 마지막 두 동사를 ‘돌아가서 … 차지하십시오’로 다듬었습니다. 지리 표현 ‘요단강 건너편’은 원문의 관점상 남는 모호성을 보존하고, ‘해 뜨는 쪽’과 관련 각주를 유지했습니다.
