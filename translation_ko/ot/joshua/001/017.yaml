id: JOS.1.17
reference: Joshua 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
  footnotes:
  - marker: a
    text: Or 'obeyed Moses ... we will obey you.' The Hebrew verb שׁמע can mean both 'listen' and 'obey' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 모든 일에서 모세에게 귀 기울였던 것처럼, 우리도 당신에게 귀 기울이겠습니다. 다만 야훼이신 당신의 하나님께서 모세와 함께 계셨던 것처럼 당신과 함께 계시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀 기울이겠습니다’는 히브리어 שׁמע를 기본적으로 살린 번역이며, 문맥상 ‘순종하겠습니다’라는 뜻도 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁמַעְנוּ / כֵּן נִשְׁמַע
  english_pob_choice: just as we listened ... so we will listen
  chosen_korean: 우리가 ... 들은 것처럼 ... 듣겠습니다
  alternatives_korean:
  - 우리가 ... 순종한 것처럼 ... 순종하겠습니다
  - 우리가 ... 귀 기울인 것처럼 ... 귀 기울이겠습니다
  lexicon: HALOT
  rationale: שמע는 문맥상 ‘듣다’와 ‘순종하다’의 뉘앙스를 함께 가질 수 있지만, 여기서는 모세와 여호수아를 평행시키는 응답 선언이므로 ‘듣겠습니다’로 옮겨 어근의 연결을 살리되 순종의 함의를 열어 두었습니다.
- source_word: אֶל מֹשֶׁה / אֵלֶיךָ
  english_pob_choice: to Moses / to you
  chosen_korean: 모세에게서 / 당신에게
  alternatives_korean:
  - 모세에게 / 당신에게
  - 모세를 향해 / 당신을 향해
  lexicon: HALOT
  rationale: 전치사 אֶל은 ‘~에게/를 향해’의 방향성을 가지며, 한국어에서는 ‘듣다’와 자연스럽게 결합하는 ‘-에게서’보다 문맥상 관계를 드러내는 ‘-에게’가 더 직접적입니다. 다만 ‘모세에게서’는 히브리어의 관계 방향을 조금 더 살리려는 선택입니다.
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  - 그러나
  lexicon: HALOT
  rationale: רַק은 앞선 맹세를 조건부로 제한하며 이어지는 소망 절을 이끕니다. 한국어에서는 ‘다만’이 이 제한성과 뒤따르는 청원을 자연스럽게 전달합니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 야훼, 당신의 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 공인 번역 전통의 대체어보다 신명기적 언약 이름을 직접 드러내기 위해 ‘야훼’를 사용했습니다. 2인칭 단수 소유는 합쇼체 본문에서 ‘당신의 하나님’으로 옮겼습니다.
- source_word: עִמָּךְ / עִם מֹשֶׁה
  english_pob_choice: be with you / was with Moses
  chosen_korean: 당신과 함께 계시기를 ... 모세와 함께 계셨던 것처럼
  alternatives_korean:
  - 당신과 함께 하시기를 ... 모세와 함께하셨던 것처럼
  - 당신 곁에 계시기를 ... 모세 곁에 계셨던 것처럼
  lexicon: HALOT
  rationale: עִם은 단순 동행보다 임재·동반의 의미가 강하므로 ‘함께 계시다’로 옮겼습니다. 하나님께 대한 공손한 표현은 ‘계시다’를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: ‘야훼’로 직접 표기하여 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’로 전통 표기
  - ‘주’로 대체 표기
  rationale: 본문은 יְהוָה를 직접 사용하므로, 일반 칭호로 치환하지 않고 고유명으로 드러내는 것이 원문 의미와 신학적 긴장을 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
