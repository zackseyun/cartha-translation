- from: 그들은 여호수아에게 대답하여 말했습니다. 「당신이 우리에게 명령한 것은 모두 우리가 행하겠습니다. 그리고 당신이 우리를 보내는 곳마다 우리는 가겠습니다.」[a]
  to: 그들은 여호수아에게 대답했습니다. 「당신께서 우리에게 명령하신 모든 것을 우리가 행하겠습니다. 또 당신께서 우리를 어디로 보내시든지, 우리는 가겠습니다。」[a]
  rationale: 직접화법을 현대 표준어 합쇼체의 공식적이고 존중하는 응답으로 다듬고, 목적지를 나타내는 히브리어 표현을 ‘어디로 보내시든지’로 자연스럽게 옮겼습니다. 영어 POB의 직역 대안을 보존하도록 각주를 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:13Z'
