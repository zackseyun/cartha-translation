reference: Joshua 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲנ֔וּ אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר כֹּ֤ל אֲשֶׁר צִוִּיתָ֨/נוּ֙ נַֽעֲשֶׂ֔ה וְ/אֶֽל כָּל אֲשֶׁ֥ר תִּשְׁלָחֵ֖/נוּ נֵלֵֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
  footnotes:
  - marker: a
    text: Or, more literally, 'and to every place that you send us, we will go.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 여호수아에게 대답하여 말했습니다. 「당신이 우리에게 명령한 것은 모두 우리가 행하겠습니다. 그리고 당신이 우리를 보내는 곳마다 우리는 가겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “당신이 우리를 보내는 곳마다”는 히브리어로는 더 직역하면 “당신이 우리를 보내는 모든 곳/어디에든”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת יְהוֹשֻׁעַ
  english_pob_choice: And they answered Joshua
  chosen_korean: 그들은 여호수아에게 대답하여 말했습니다
  alternatives_korean:
  - 그들은 여호수아에게 응답하여 말했습니다
  - 그들은 여호수아에게 대답했습니다
  lexicon: HALOT
  rationale: ענה의 서사적 응답 용법을 살려 ‘대답하여 말했습니다’로 옮기되, 한국어에서 목적어를 자연스럽게 드러내기 위해 ‘여호수아에게’를 사용했습니다.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  english_pob_choice: All that you have commanded us
  chosen_korean: 당신이 우리에게 명령한 것은 모두
  alternatives_korean:
  - 당신이 우리에게 명령하신 것은 모두
  - 당신이 우리에게 명령한 모든 것은
  lexicon: HALOT
  rationale: כֹּל אֲשֶׁר의 총괄성을 ‘…것은 모두’로 살리고, צוה는 권위를 드러내는 ‘명령하다’가 가장 직접적이어서 채택했습니다.
- source_word: נַעֲשֶׂה
  english_pob_choice: we will do
  chosen_korean: 우리가 행하겠습니다
  alternatives_korean:
  - 우리가 하겠습니다
  - 우리가 실행하겠습니다
  lexicon: HALOT
  rationale: עשה는 단순한 ‘하다’보다 다소 격식 있는 ‘행하다’로 옮기면 서원에 가까운 응답의 결연함이 잘 드러납니다.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ נֵלֵךְ
  english_pob_choice: and wherever you send us we will go
  chosen_korean: 그리고 당신이 우리를 보내는 곳마다 우리는 가겠습니다
  alternatives_korean:
  - 그리고 당신이 우리를 보내는 곳에는 어디든 우리는 가겠습니다
  - 그리고 당신이 우리를 보내시는 곳마다 우리는 가겠습니다
  lexicon: HALOT
  rationale: אל + כל אשר + שלח + הלך의 방향/장소적 뉘앙스를 한국어 ‘곳마다’로 자연스럽게 풀어, POB의 ‘wherever’를 반영했습니다.
theological_decisions:
- issue: 직접화법의 높임말 처리
  chosen_reading: 여호수아에게 말하는 서술문은 합쇼체로 유지하되, 인물들의 직접응답은 평서형 약속 표현으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 직접화법까지 모두 높임을 유지하는 방식
  - 구어체로 더 낮추는 방식
  rationale: 원문은 군중/지도자에게 하는 공식적 응답이므로 현대 표준어의 공손한 서술은 유지하되, 내용상 결의와 즉답성을 해치지 않도록 직접화법은 자연스러운 약속문으로 옮겼습니다.
  doctrine_reference: 서사 문체와 화행 보존
- issue: 여호수아 이름의 호칭
  chosen_reading: 역사서의 인물명은 확립된 한국어 성경형 ‘여호수아’를 사용했습니다.
  alternative_readings:
  - 예슈아
  - 호세아식 음역
  rationale: 독자 인지성과 교회 내 기존 용례를 고려한 확립형 고유명사 표기가 가장 적절합니다.
  doctrine_reference: 고유명사 표기 관행
