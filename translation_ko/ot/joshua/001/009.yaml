translation:
  language: ko
  text: 내가 너에게 명령하지 않았습니까? 강하고 담대하십시오. 두려워하지 말고 놀라지 마십시오. 네가 어디로 가든지 야훼[a], 네 하나님께서 너와 함께 계시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יהוה(YHWH). 전통적으로 ‘주님’으로 옮기기도 하지만, 여기서는 고유한 신적 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Have I not
  chosen_korean: 내가 너에게 명령하지 않았느냐?
  alternatives_korean:
