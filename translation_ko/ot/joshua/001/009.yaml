  rationale: 반문형으로서 이미 준 명령을 상기시키는 힘을 살리기 위해 한국어에서도 의문형을 유지했습니다.
- source_word: חֲזַק וֶאֱמָץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 강하고 담대하라
  alternatives_korean:
