    text: 히브리어 יְהוָה. 전통적으로는 ‘주님’으로 옮기지만, 여기서는 고유한 신적 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Have I not
  chosen_korean: 내가 너에게 명령하지 않았느냐?
  alternatives_korean:
