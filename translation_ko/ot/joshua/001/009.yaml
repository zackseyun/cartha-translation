  - 굳세고 담대하라
  lexicon: HALOT
  rationale: 두 명령의 관용적 결합을 자연스러운 합쇼체 명령으로 옮기되, 힘과 용기의 이중 의미를 유지했습니다.
- source_word: אַֽל תַּעֲרֹץ וְאַל תֵּחָת
  english_pob_choice: Do not be terrified, and do not be dismayed
  chosen_korean: 두려워하지 말며[a], 놀라지 말라
