  - 굳세고 담대하라
  lexicon: HALOT
  rationale: 두 명령의 관용적 결합을 자연스러운 합쇼체 명령으로 옮기되, 힘과 용기의 이중 의미를 유지했습니다.
- source_word: אַֽל תַּעֲרֹץ וְאַל תֵּחָת
  english_pob_choice: Do not be terrified, and do not be dismayed
  chosen_korean: 두려워하지 말며[a], 놀라지 말라
  alternatives_korean:
  - 겁내지 말며, 낙심하지 말라
  - 두려워하지 말며, 낙심하지 말라
  lexicon: HALOT
  rationale: עָרַץ의 강한 공포와 חתת의 주저앉음/움츠러듦을 함께 반영하면서, 한국어에서 평행 구조가 자연스럽도록 구분했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 네 하나님 야훼
  alternatives_korean:
  - 네 하나님 여호와
  - 너의 하나님 야훼
  lexicon: HALOT
  rationale: 독자적 고유명사인 야훼를 유지해 본문이 가진 신명 인용의 이름-호칭 구분을 드러냈습니다.
theological_decisions:
- issue: 야훼의 표기와 문장 내 호칭 순서
  chosen_reading: “네 하나님 야훼”로 옮겨, 고유명사와 관계 호칭을 함께 드러냈습니다.
  alternative_readings:
  - “야훼 네 하나님”
  - “여호와 네 하나님”
  rationale: 히브리어의 ‘YHWH + your God’ 결합을 보존하되, 한국어에서 가장 자연스러운 호칭 순서를 택했습니다. POB의 야훼 선택도 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
