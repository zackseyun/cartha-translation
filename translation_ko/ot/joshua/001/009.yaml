  - 너의 하나님 야훼
  lexicon: HALOT
  rationale: 독자적 고유명사인 야훼를 유지해 본문이 가진 신명 인용의 이름-호칭 구분을 드러냈습니다.
theological_decisions:
- issue: 야훼의 표기와 문장 내 호칭 순서
  chosen_reading: “네 하나님 야훼”로 옮겨, 고유명사와 관계 호칭을 함께 드러냈습니다.
  alternative_readings:
  - “야훼 네 하나님”
  - “여호와 네 하나님”
  rationale: 히브리어의 ‘YHWH + your God’ 결합을 보존하되, 한국어에서 가장 자연스러운 호칭 순서를 택했습니다. POB의 야훼 선택도 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
