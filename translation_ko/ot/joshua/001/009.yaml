  - 두려워하지 말며, 낙심하지 말라
  lexicon: HALOT
  rationale: עָרַץ의 강한 공포와 חתת의 주저앉음/움츠러듦을 함께 반영하면서, 한국어에서 평행 구조가 자연스럽도록 구분했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 네 하나님 야훼
  alternatives_korean:
