  to: 그들은 그 성을 점령하고 칼날로 쳐서 그 왕과 그 모든 성읍과 그 안에 있던 모든 사람을 죽였습니다. 그는 에글론에게 행한 것과 같이 살아남은 자를 하나도 남기지 않았습니다. 그는 그 성과 그 안에 있던 모든 사람을 진멸에 바쳤습니다[a].
