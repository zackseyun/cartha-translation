    rationale: 원문은 라기스를 떠나 에글론으로 나아간 행군을 말하며, 특정 장소를 통과했다는 뜻을 표현하지 않습니다.
  - severity: medium
    issue: ‘그곳과 싸웠습니다’는 עַל의 대적 방향성을 약화하고, 도시를 상호 전투 당사자처럼 표현합니다.
    rationale: 원문의 두 번째 עָלֶיהָ는 에글론 성을 향한 전투 행위를 나타내므로 ‘그 성을 향해 싸웠습니다’가 더 직접적입니다.
  revised_text: 그때 여호수아와 그와 함께한 온 이스라엘이 라기스에서 에글론으로 옮겨 가서, 그 성을 향해 진을 치고 그 성을 향해 싸웠습니다.
