  verdict: revise
  source_fidelity: ‘지나가서’는 라기스에서 에글론으로의 이동을 단순 통과처럼 들리게 할 수 있으므로, 출발지와 목적지 사이의 군사적 이동을 나타내는 ‘옮겨 가서’가 원문의 וַיַּעֲבֹר 및 방향형 어미를 더 충실히 반영합니다. 또한 두 번의 עָלֶיהָ는 모두 에글론 성을 향한 적대적 방향을 나타내므로 ‘그곳과 싸웠습니다’보다 ‘그 성을 향해 싸웠습니다’가 더 정확합니다.
  naturalness: ‘여호수아와 그와 함께한 온 이스라엘’과 ‘진을 치고’는 현대 표준어의 격식 있는 성경 문체에서 자연스럽습니다. ‘그 성을 향해’를 반복하여 선행 대상과 원문의 반복을 분명히 했습니다.
  terminology: 고유명사 ‘여호수아’, ‘이스라엘’, ‘라기스’, ‘에글론’은 통용 표기를 유지했습니다. 군사 맥락의 חנה는 ‘진을 치다’, לחם은 ‘싸우다’로 옮겼습니다.
  issues:
