  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: ko
  text: 그때 여호수아와 그와 함께한 온 이스라엘이 라기스에서 에글론으로 지나가서, 그곳을 향해 진을 치고 그곳과 싸웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed on
  chosen_korean: 지나가서
  alternatives_korean:
  - 계속 가서
  - 옮겨 가서
  - 통과하여
  lexicon: HALOT
  rationale: 전투 행군의 연속 동작을 자연스럽게 살리되, 특정 지형을 ‘건너다’로 오해시키지 않도록 ‘지나가서’로 옮겼습니다.
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: and all Israel
  chosen_korean: 그와 함께한 온 이스라엘
  alternatives_korean:
  - 온 이스라엘과 함께
  - 모든 이스라엘
  lexicon: HALOT
  rationale: 히브리어의 동반 구문을 한국어에서 더 자연스럽게 풀어, 여호수아를 중심으로 한 전군의 동행을 드러냈습니다.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  english_pob_choice: they camped against it
  chosen_korean: 그곳을 향해 진을 치고
  alternatives_korean:
  - 그곳을 향하여 진을 치고
  - 그곳에 맞서 진을 치고
  lexicon: HALOT
  rationale: ‘진을 치다’는 군사적 의미를 유지하면서, עַל의 적대적 방향성을 ‘향해’로 과도한 해석 없이 반영했습니다.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  english_pob_choice: fought against it
  chosen_korean: 그곳과 싸웠습니다
  alternatives_korean:
  - 그곳과 전쟁하였습니다
  - 그곳을 향해 싸웠습니다
  lexicon: HALOT
  rationale: 전투 행위를 분명히 하되 현대 한국어에서 자연스러운 ‘싸우다’로 옮겼고, 반복되는 עַל의 대적 의미는 문맥 전체로 충분히 드러납니다.
