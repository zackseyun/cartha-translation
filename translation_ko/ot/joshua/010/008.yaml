  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. "그들을 두려워하지 마십시오. 내가 그들을 당신의 손에 넘겨주었습니다. 그들 가운데 아무도 당신 앞에 서지 못할 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 가운데 한 남자가 당신 앞에 서지 못할 것입니다’입니다. 여기서는 전투 맥락상 ‘서다’가 ‘맞서 버티다/저항하다’의 뜻으로 쓰였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 원문이 여호와 대치어가 아닌 신명기적 고유명사 יְהוָה를 사용하므로, POB의 원칙에 따라 신적 호칭이 아닌 고유이름인 ‘야훼’로 옮겼습니다.
- source_word: אַל תִּירָא מֵהֶם
  english_pob_choice: Do not fear them
  chosen_korean: 그들을 두려워하지 마십시오
  alternatives_korean:
  - 그들을 두려워하지 마라
  - 그들 때문에 두려워하지 마십시오
  lexicon: HALOT
  rationale: אַל + ירא의 금지명령을 한국어의 자연스러운 합쇼체 금지 표현으로 풀었고, מֵהֶם의 대상 의미는 문맥상 ‘그들을’로 충분히 드러납니다.
- source_word: בְיָדְךָ נְתַתִּים
  english_pob_choice: I have given them into your hand
  chosen_korean: 내가 그들을 당신의 손에 넘겨주었습니다
  alternatives_korean:
  - 내가 그들을 당신의 손에 주었습니다
  - 내가 그들을 당신의 권세 아래 두었습니다
  lexicon: HALOT
  rationale: ‘손에 주다’의 히브리어 관용구를 직역하되, 한국어에서는 실제 의미가 분명하도록 ‘넘겨주다’로 옮겨 원문의 승리/인도 행위를 유지했습니다.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם בְּפָנֶיךָ
  english_pob_choice: Not a man among them will stand before you
  chosen_korean: 그들 가운데 아무도 당신 앞에 서지 못할 것입니다
  alternatives_korean:
  - 그들 가운데 한 사람도 당신 앞에 버티지 못할 것입니다
  - 그들 가운데 어떤 남자도 당신 앞에 서지 못할 것입니다
  lexicon: HALOT
  rationale: אִישׁ의 성별 뉘앙스는 전투 집단 맥락에서 남성 전사들을 가리키지만, 한국어에서는 관용적으로 ‘아무도’가 자연스럽고 본문의 뜻인 저항 불가를 잘 드러냅니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 칭호가 아니라 언약적 고유명사를 직접 사용하므로, POB 기준에 따라 ‘야훼’로 음역해 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
