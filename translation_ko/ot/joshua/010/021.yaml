source:
  edition: WLC
  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'No one uttered a word against any of the sons of Israel.' The Hebrew literally says, 'No one sharpened his tongue.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 백성이 평안히 여호수아가 있는 막게다의 진으로 돌아왔습니다. 아무도 이스라엘 자손을 대적하여 혀를 날카롭게 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아무도 이스라엘 자손을 대적하여 혀를 날카롭게 하지 않았다’입니다. 이는 아무도 이스라엘 자손을 대적하는 말을 하지 않았다는 뜻의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 돌아갔습니다
  lexicon: HALOT
  rationale: שׁוּב의 서술형 완료를 자연스럽게 살려, 전투 후 진으로 복귀한 동작을 간결하게 전달했습니다.
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 모든 군대
  lexicon: HALOT
  rationale: 히브리어의 עָם을 문자적으로 살려 ‘백성’으로 옮기되, 군사 문맥을 해치지 않도록 자연스럽게 처리했습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 무사히
  - 평화롭게
  lexicon: HALOT
  rationale: 여기서는 전쟁 중의 안전한 귀환을 뜻하므로, 한국어에서는 결과 상태를 드러내는 ‘평안히’가 가장 자연스럽습니다.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  english_pob_choice: No one sharpened his tongue
  chosen_korean: 자기 혀를 날카롭게 하지 않았습니다
  alternatives_korean:
  - 혀를 움직이지 않았습니다
  - 비난하지 않았습니다
  lexicon: HALOT
  rationale: POB의 보존된 직역적 이미지에 맞춰 ‘날카롭게 하다’를 유지해, 히브리어의 공격적 발언 이미지를 그대로 드러냈습니다.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל의 성별 표지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 본문의 남성 복수 표지를 지우지 않으면서도 한국어에서 익숙한 성경적 표현을 살려 ‘이스라엘 자손’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
