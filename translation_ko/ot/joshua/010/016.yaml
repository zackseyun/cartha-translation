lexical_decisions:
- source_word: וַיָּנֻסוּ
  english_pob_choice: fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나고
  - 피하여
  lexicon: HALOT
  rationale: נוּס의 핵심은 위협을 피해 급히 달아나는 것이므로, 서술 흐름에 자연스러운 ‘도망하여’로 옮겼습니다.
- source_word: הַמְּלָכִים הָאֵלֶּה
  english_pob_choice: these five kings
  chosen_korean: 이 다섯 왕
  alternatives_korean:
  - 그 다섯 왕
  - 다섯 왕들
  lexicon: HALOT
  rationale: 지시사 הָאֵלֶּה를 살려 ‘이’로 반영했고, 복수 수사는 한국어 자연성을 위해 앞에 배치했습니다.
- source_word: וַיֵּחָבְאוּ בַמְּעָרָה
  english_pob_choice: hid in the cave
  chosen_korean: 그 동굴에 숨었습니다
  alternatives_korean:
  - 동굴에 숨어 있었습니다
  - 그 cave 안에 숨었습니다
  lexicon: HALOT
  rationale: חבא의 재귀적 의미를 한국어 ‘숨다’로 충분히 살릴 수 있어, 과도한 설명 없이 자연스럽게 옮겼습니다.
- source_word: בְּמַקֵּדָה
  english_pob_choice: at Makkedah
  chosen_korean: 막게다의
  alternatives_korean:
  - 막게다에 있는
  - 막게다에서의
  lexicon: HALOT
  rationale: 지명 앞의 전치사 בְּ를 한국어 소유격/소속 감각의 ‘막게다의’로 처리하면 ‘그 동굴’과 결합해 위치를 매끄럽게 드러냅니다.
theological_decisions:
- issue: תחילת 절의 접속사 וַ의 담화 기능
  chosen_reading: ‘그러나’로 시작해 앞선 전투 장면에서 왕들의 도주로 장면이 전환됨을 드러냈습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 본문의 waw는 단순 나열보다 서사 전환 효과가 강하므로, 한국어에서도 역접/전환의 뉘앙스를 가진 ‘그러나’가 문맥을 더 잘 반영합니다.
  doctrine_reference: 서사 문맥의 담화 기능 반영
