  source_fidelity: וַיָּנֻסוּ와 וַיֵּחָבְאוּ는 각각 ‘도망하다’와 ‘숨다’로 적절히 옮겼고, ‘이 다섯 왕’도 지시사와 수량을 잘 반영합니다. 다만 בְּמַקֵּדָה는 막게다라는 장소 안/근처의 위치를 나타내므로, ‘막게다의 그 동굴’보다 ‘막게다에 있는 그 동굴’이 원문의 위치 관계를 더 분명히 나타냅니다. 절두 와우는 역접으로 단정하기보다 서사 전환으로 처리하는 것이 안전합니다.
  naturalness: ‘막게다에 있는 그 동굴’은 현대 표준 한국어에서 자연스럽고, ‘그 동굴’로 히브리어의 정관성을 유지합니다. ‘그런데’는 합쇼체 서술문에서 자연스러운 서사 전환 표현입니다.
  terminology: ‘왕’, ‘도망하여’, ‘동굴’, ‘막게다’는 모두 적절합니다. 지명 표기도 일관됩니다.
