  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: ko
  text: 그들은 그렇게 하여 그 동굴에서 이 다섯 왕, 곧 예루살렘 왕, 헤브론 왕, 야르뭇 왕, 라기스 왕, 에글론 왕을 그에게 데려왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  english_pob_choice: And they did so
  chosen_korean: 그들은 그렇게 하여
  alternatives_korean:
  - 그렇게 했습니다
  - 그들은 그대로 했습니다
  lexicon: HALOT
  rationale: 명령 이행을 나타내는 관용적 서술을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיֹּצִיאוּ
  english_pob_choice: brought out
  chosen_korean: 끌어냈습니다
  alternatives_korean:
  - 내어왔습니다
  - 밖으로 데려냈습니다
  lexicon: HALOT
  rationale: 동굴 안에서 왕들을 밖으로 나오게 하는 상황을 살려, 단순한 이동보다 ‘끌어내다’의 강한 뉘앙스를 반영했습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게로
  alternatives_korean:
  - 그에게
  - 그 앞에
  lexicon: HALOT
  rationale: 히브리어 전치사 אל의 기본값인 ‘~에게’에 맞추되, 행위의 도착 방향을 드러내기 위해 ‘~에게로’로 옮겼습니다.
- source_word: הַמְּלָכִים
  english_pob_choice: kings
  chosen_korean: 왕
  alternatives_korean:
  - 통치자
  - 임금
  lexicon: HALOT
  rationale: 본문이 지칭하는 통치자는 명백히 왕들이므로, 가장 직접적인 대응어인 ‘왕’을 유지했습니다.
