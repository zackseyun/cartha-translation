source:
  edition: WLC
  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'at sunset.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''where they had hidden there''; the wording explicitly includes ''there'' for emphasis.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 지는 때에 여호수아가 명령하였고, 그들은 그들을 나무에서 내려다가 그들이 거기 숨어 있던 굴에 던져 넣었으며, 그 굴의 입구 위에 큰 돌들을 놓았는데, 그것이 오늘까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 직역하면 ‘해가 들어가는 때에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘거기’(שָׁם)를 분명히 포함합니다.
    reason: source_note
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  english_pob_choice: at the time of the sun’s going down
  chosen_korean: 해가 지는 때에
  alternatives_korean:
  - 일몰에
  - 해가 저무는 때에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 합쇼체로 옮기되, 단순한 관용어보다 ‘해가 지는’ 이미지를 보존했습니다.
- source_word: צִוָּה יְהוֹשֻׁעַ
  english_pob_choice: Joshua commanded
  chosen_korean: 여호수아가 명령하였고
  alternatives_korean:
  - 여호수아가 명령했고
  - 여호수아가 명령하였으며
  lexicon: HALOT
  rationale: 동사 צוה의 직접적 의미를 살려 ‘명령하다’로 옮겼고, 뒤의 연속 동작과 맞도록 서술 연결형으로 처리했습니다.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  english_pob_choice: where they had hidden there
  chosen_korean: 그들이 거기 숨어 있던
  alternatives_korean:
  - 그들이 그곳에 숨어 있던
  - 그들이 거기 숨어 있었던
  lexicon: HALOT
  rationale: שָׁם의 ‘거기’라는 명시적 표지를 살리되, 한국어에서는 ‘숨어 있던’으로 자연스럽게 압축해 과도한 중복을 피했습니다.
- source_word: עַל פִּי הַמְּעָרָה
  english_pob_choice: over the mouth of the cave
  chosen_korean: 굴의 입구 위에
  alternatives_korean:
  - 굴의 입구에
  - 굴의 입구를 덮어
  lexicon: HALOT
  rationale: פִּי의 문자적 ‘입’ 비유를 한국어의 ‘입구’로 옮기고, 돌이 차단하는 기능은 ‘위에’로 반영했습니다.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: to this very day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 지금까지
  - 이날까지
  lexicon: HALOT
  rationale: 현재까지 지속되는 서술 관용구를 한국어의 자연스러운 역사 서술로 옮겼습니다.
