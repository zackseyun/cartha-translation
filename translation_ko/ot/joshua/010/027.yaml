  to: 해가 지는 때에[a] 여호수아가 명령하였고, 그들은 그들을 나무에서 내려, 그들이 거기에[b] 숨었던 굴에 던져 넣었습니다. 그리고 그 굴 입구 위에 큰 돌들을 놓았으며, 그 돌들은 바로 오늘까지 그곳에 있습니다.
