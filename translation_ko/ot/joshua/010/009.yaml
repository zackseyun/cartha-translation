id: JOS.10.9
reference: Joshua 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יְהוֹשֻׁ֖עַ פִּתְאֹ֑ם כָּל הַ/לַּ֕יְלָה עָלָ֖ה מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/009.yaml
  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
  footnotes:
  - marker: a
    text: Or 'came to them suddenly'; the Hebrew verb is literally 'came,' and the military context suggests a sudden approach upon the enemy.
    reason: lexical_alternative
  - marker: b
    text: Literally 'went up from Gilgal all night.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 길갈에서 온밤을 행진하여 갑자기 그들에게 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 갑자기 왔습니다’로 옮길 수 있습니다. 히브리어 동사는 문자적으로는 ‘오다’이며, 군사적 맥락이 상대편을 향한 급작스러운 접근을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘길갈에서 온밤을 올라갔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  english_pob_choice: came upon them
  chosen_korean: 그들에게 이르렀습니다
  alternatives_korean:
  - 그들에게 왔습니다
  - 그들 위에 닥쳤습니다
  - 그들에게 들이닥쳤습니다
  lexicon: HALOT
  rationale: בוא의 기본 의미는 ‘오다’이지만, 전투 서사에서 אֲלֵיהֶם과 함께 쓰여 상대편에게 갑작스럽게 접근하는 장면을 나타내므로, 한국어에서는 지나치게 해석적인 ‘들이닥쳤습니다’보다 중립적이면서도 긴박감을 살리는 ‘이르렀습니다’가 적절합니다.
- source_word: פִּתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 뜻밖에
  - 순식간에
  lexicon: HALOT
  rationale: פִּתְאֹם은 돌연성과 예기치 않음을 나타내므로, 현대 한국어에서 가장 직접적인 대응인 ‘갑자기’가 자연스럽습니다.
- source_word: כָּל הַלַּיְלָה
  english_pob_choice: all night
  chosen_korean: 온밤을
  alternatives_korean:
  - 밤새
  - 밤새도록
  lexicon: HALOT
  rationale: משך זמן을 나타내는 표현이므로, 본문의 장거리 야간 이동을 살리기 위해 ‘온밤을 행진하여’로 옮겨 밤 전체에 걸친 지속성을 분명히 했습니다.
- source_word: עָלָה מִן הַגִּלְגָּל
  english_pob_choice: having marched up from Gilgal
  chosen_korean: 길갈에서 온밤을 행진하여
  alternatives_korean:
  - 길갈에서 올라와
  - 길갈에서 올라가서
  lexicon: HALOT
  rationale: עלה는 문자적으로 ‘올라가다’이지만, 여기서는 전투 맥락의 이동을 가리키므로 ‘행진하다’로 풀어 군사적 이동의 뉘앙스를 드러냈습니다. ‘길갈에서’는 출발점을, ‘온밤을’은 밤새 지속된 이동을 함께 보여 줍니다.
theological_decisions:
- issue: 전투 서사에서 ‘came upon them’의 긴박한 공격성 표현
  chosen_reading: 직접적인 무력 행위를 추가하지 않고, 갑작스러운 접근과 도착을 한국어로 드러냈습니다.
  alternative_readings:
  - 그들에게 들이닥쳤습니다
  - 그들을 공격하러 왔습니다
  rationale: 본문은 실제 공격 동작을 명시하지 않고 갑작스러운 접근을 말하므로, 군사적 긴장감은 유지하되 행위 강도는 과장하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문-충실성 원칙
