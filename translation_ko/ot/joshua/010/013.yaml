id: JOS.10.13
reference: Joshua 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
  footnotes:
  - marker: a
    text: Or, 'until the nation avenged itself on its enemies.' The Hebrew idiom can carry the sense of vindication or vengeance.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the Book of Jashar''; possibly ''the Book of the Upright.'''
    reason: alternative_reading
  - marker: c
    text: Or, 'did not hurry to go down,' that is, to set.
    reason: lexical_alternative
  - marker: d
    text: Or, 'like a whole day' or 'nearly a whole day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 태양이 멈추었고 달도 멈추었습니다. 그 민족이 자기 원수들에게 보복할 때까지였습니다. 이것이 「야살의 책」에 기록되어 있지 않습니까? 태양이 하늘 한가운데에 멈추어 거의 온종일 지지 않았습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 민족이 자기 원수들에게 스스로 보복할 때까지’로도 옮길 수 있습니다. 히브리어 관용구는 변호/보복의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘야살의 책’ 또는 ‘정직한 이들의 책’.'
    reason: alternative_reading
  - marker: c
    text: 또는 ‘지려고 서두르지 않았다’는 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘온전한 하루처럼’, ‘거의 하루 동안’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  english_pob_choice: the sun stood still
  chosen_korean: 태양이 멈추었고
  alternatives_korean:
  - 태양이 서 있었고
  - 태양이 가만있었고
  lexicon: HALOT
  rationale: דמם은 ‘침묵하다/가만히 있다’의 뜻이 있으나, 천체 문맥에서는 운동의 정지를 나타내므로 ‘멈추다’가 가장 자연스럽고 사건의 초자연성을 살립니다.
- source_word: וְיָרֵחַ עָמָד
  english_pob_choice: and the moon stopped
  chosen_korean: 달도 멈추었습니다
  alternatives_korean:
  - 달도 멈추었습니다
  - 달도 서 있었습니다
  lexicon: HALOT
  rationale: עמד는 문자적으로 ‘서다’이지만, 달에 대해 쓰였을 때는 맥락상 정지를 뜻하므로 앞 구와 나란히 ‘멈추었습니다’로 옮겼습니다.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  english_pob_choice: until the nation took vengeance on its enemies
  chosen_korean: 그 민족이 자기 원수들에게 보복할 때까지였습니다
  alternatives_korean:
  - 그 민족이 자기 원수들에게 보복할 때까지였습니다
  - 그 민족이 자기 원수들에게 원수를 갚을 때까지였습니다
  lexicon: HALOT
  rationale: גוי는 여기서 이스라엘 공동체를 가리키므로 ‘민족’이 적절하고, יִקֹּם은 법정적/보복적 성격을 함께 가질 수 있어 ‘보복하다’로 옮겼습니다.
- source_word: סֵפֶר הַיָּשָׁר
  english_pob_choice: the Book of Jashar
  chosen_korean: 「야살의 책」
  alternatives_korean:
  - 「야살의 책」
  - 「정직한 이들의 책」
  lexicon: HALOT
  rationale: 고유한 문헌명으로 보이므로 형용사를 번역하지 않고 음역했습니다. POB의 각주처럼 ‘정직한 이들’로 풀 가능성은 있으나 제목 처리에 맞춰 보류했습니다.
- source_word: וַיַּעֲמֹד הַשֶּׁמֶשׁ בַּחֲצִי הַשָּׁמַיִם
  english_pob_choice: The sun stood still in the middle of the sky
  chosen_korean: 태양이 하늘 한가운데에 멈추어
  alternatives_korean:
  - 태양이 하늘 한가운데에 멈추어
  - 태양이 하늘의 한가운데에 서 있어
  lexicon: HALOT
  rationale: בַּחֲצִי הַשָּׁמַיִם은 ‘하늘 한가운데/한복판’의 공간 표현이므로 자연스러운 현대어로 옮겼습니다.
theological_decisions:
- issue: 천문 현상의 서술 방식
  chosen_reading: 본문의 진술을 그대로 살려 태양과 달이 멈춘 사건으로 번역했습니다.
  alternative_readings:
  - 사람의 관측상 그렇게 보였다고 완화하는 번역
  - 시적 인용으로만 처리하는 번역
  rationale: 히브리어 본문과 POB의 audit trail이 모두 초자연적 정지를 직접 진술하므로, 현대 과학적 조화로 약화하지 않았습니다.
  doctrine_reference: 원문 우선, 번역에서의 자연주의적 완화 회피
