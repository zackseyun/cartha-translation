source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
  footnotes:
  - marker: a
    text: Hebrew 'every man of Israel'; in this military context the phrase refers to the men assembled with the army.
    reason: lexical_alternative
  - marker: b
    text: Or 'the commanders of the warriors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이 왕들을 여호수아에게 끌어내자, 여호수아가 이스라엘의 모든 남자들[a]을 불러 자기와 함께 전쟁에 나갔던 전사들의 지휘관들[b]에게 말했습니다. “가까이 오십시오. 이 왕들의 목 위에 여러분의 발을 올려놓으십시오.” 그러자 그들이 가까이 와서 그 왕들의 목 위에 발을 올려놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 모든 남자’입니다. 여기서는 군사적 맥락에서 소집된 병사 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전쟁에 나간 사람들의 지휘관들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 온 이스라엘 사람
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 이스라엘의 모든 사람
  - 온 이스라엘
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 모든 남자’이지만, 이 절은 군사적 상황에서 전체 집단을 대표로 소집하는 표현이므로, 남성형과 집단성을 함께 살리면서도 현대 한국어로 자연스럽게 ‘온 이스라엘 사람’으로 옮겼습니다.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the commanders of the men of war
  chosen_korean: 전쟁 군대의 지휘관들
  alternatives_korean:
  - 전사들의 지휘관들
  - 전쟁하는 사람들의 지휘관들
  - 군사 지휘관들
  lexicon: HALOT
  rationale: קְצִינִים의 ‘지휘관들’과 אַנְשֵׁי הַמִּלְחָמָה의 군사적 결합을 반영하되, 현대 한국어에서 어색한 ‘전쟁의 사람들’류 표현은 피하고 군사적 성격이 분명한 ‘전쟁 군대’로 옮겼습니다.
- source_word: קִרְבוּ שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  english_pob_choice: Come near; put your feet on the necks of
  chosen_korean: 가까이 오십시오. 이 왕들의 목 위에 여러분의 발을 올려놓으십시오.
  alternatives_korean:
  - 다가오십시오. 이 왕들의 목 위에 여러분의 발을 두십시오.
  - 가까이 오십시오. 이 왕들의 목에 여러분의 발을 놓으십시오.
  lexicon: HALOT
  rationale: 두 개의 명령형을 그대로 살리면서, ‘발을 올려놓다’로 정복 행위의 물리성과 상징성을 약화하지 않았습니다. ‘목’은 Hebrew의 צַוְּארֵי에 대한 자연스러운 대응입니다.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  english_pob_choice: So they came near and put
  chosen_korean: 그들이 가까이 와서 그들의 목 위에 발을 올려놓았습니다.
  alternatives_korean:
  - 그들이 가까이 와서 발을 올려놓았습니다.
  - 그러자 그들이 가까이 와서 그 위에 발을 올려놓았습니다.
  lexicon: HALOT
  rationale: 이어지는 연속 동작을 한국어에서도 간결하게 재현했습니다. 반복되는 ‘목 위에’는 대상의 명확성을 위해 유지했습니다.
theological_decisions:
- issue: 군사적 지휘 대상의 호칭을 중립화할지 여부
  chosen_reading: 전쟁 군대의 지휘관들
  alternative_readings:
  - 군사 지휘관들
  - 지휘관들
  - 장수들
  rationale: 본문은 전투에 동행한 지휘관들을 특정하므로, 직책만 남긴 중립화보다 군사 맥락을 드러내는 표현이 독자 이해에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: 정복의 상징 행위를 완화할지 여부
  chosen_reading: 왕들의 목 위에 여러분의 발을 올려놓으십시오
  alternative_readings:
  - 왕들을 굴복시키십시오
  - 왕들을 밟으십시오
  rationale: 본문의 상징적 정복 행위를 완화하면 장면의 노골성과 권위 부여의 효과가 약해집니다. 따라서 원문의 구체적 이미지를 그대로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
