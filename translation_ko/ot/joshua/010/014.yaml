base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
  footnotes:
  - marker: a
    text: Or, “when the LORD heeded a man’s request.” The Hebrew reads literally, “to listen to the voice of a man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 한 사람의 목소리를 들으신[a] 그 날과 같은 날은 그 전에도 그 후에도 없었습니다. 야훼께서 이스라엘을 위하여 싸우셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람의 요청을 들어주신’입니다. 히브리어는 문자적으로 ‘한 사람의 목소리를 들으시다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  english_pob_choice: And there was no day like that
  chosen_korean: 그보다 앞선 날도, 그 뒤의 날도 없었습니다
  alternatives_korean:
  - 그날과 같은 날은 없었습니다
  - 그와 같은 날이 전에도 후에도 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 비교·부정 구조를 자연스러운 한국어로 옮기되, ‘전에도 후에도’의 대구를 살려 유일성을 분명히 했습니다.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  english_pob_choice: when Yahweh listened to the voice of a man
  chosen_korean: 야훼께서 한 사람의 목소리를 들으신
  alternatives_korean:
  - 야훼께서 한 사람의 요청을 들으신
  - 야훼께서 사람의 목소리에 귀를 기울이신
  lexicon: HALOT
  rationale: 직역의 핵심인 ‘한 사람의 목소리’와 ‘들으심’을 보존해, 인간의 간청에 응답하신 사건이라는 의미를 드러냈습니다.
- source_word: יְהוָה נִלְחָם לְיִשְׂרָאֵל
  english_pob_choice: for Yahweh fought for Israel
  chosen_korean: 야훼께서 이스라엘을 위해 싸우셨기 때문입니다
  alternatives_korean:
  - 야훼께서 이스라엘 편에서 싸우셨기 때문입니다
  - 야훼께서 이스라엘을 위하여 전쟁하셨기 때문입니다
  lexicon: HALOT
  rationale: נלחם은 전투적 개입을 뜻하므로 ‘싸우셨다’로 옮기고, לְיִשְׂרָאֵל은 ‘이스라엘을 위해’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 야훼께서 사람의 목소리를 들으셨다는 표현의 신학적 뉘앙스
  chosen_reading: 한 사람의 목소리를 들으신
  alternative_readings:
  - 한 사람의 요청을 들으신
  - 한 사람에게 응답하신
  rationale: 본문의 히브리어 관용구를 보존해, 하나님이 인간에게 종속되었다는 뉘앙스가 아니라 놀라운 응답 사건이라는 점을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
