translation:
  language: ko
  text: 그리하여 여호수아가 길갈에서 올라갔습니다. 그와 함께 있던 모든 전투원과 모든 용맹한 용사들이 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살려 지리적·서사적 방향을 직접 반영했습니다.
- source_word: מִן הַגִּלְגָּל
