  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
  footnotes:
  - marker: a
    text: Hebrew 'all the people of war'; rendered 'all the fighting men' to express the military sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the mighty men of valor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아와 그와 함께한 모든 전투원과 모든 용맹한 용사들이 길갈에서 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살려 지리적·서사적 방향을 직접 반영했습니다.
- source_word: מִן הַגִּלְגָּל
  english_pob_choice: from Gilgal
  chosen_korean: 길갈에서
  alternatives_korean:
  - 길갈로부터
  - 길갈에서부터
  lexicon: HALOT
  rationale: 지명은 음역하고, מן은 자연스러운 출발점 표현인 ‘-에서’로 옮겼습니다.
- source_word: כָל עַם הַמִּלְחָמָה
  english_pob_choice: all the fighting men
  chosen_korean: 모든 전투원
  alternatives_korean:
  - 모든 전사들
  - 모든 전쟁의 백성
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 군사적 집단이라는 의미를 분명히 드러내는 표현을 택했습니다.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  english_pob_choice: all the mighty men of valor
  chosen_korean: 모든 용맹한 용사들
  alternatives_korean:
  - 모든 힘센 용사들
  - 모든 용맹한 전사들
  - 모든 무용한 자들
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘용맹/능력 있는 전사들’을 살리되, 현대 한국어에서 자연스럽고 위계적인 전투자칭으로 옮겼습니다.
