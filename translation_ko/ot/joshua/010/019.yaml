id: JOS.10.19
reference: Joshua 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
  footnotes:
  - marker: a
    text: Or 'strike their rear' / 'attack their stragglers'; the Hebrew verb refers to hitting the tail end of a fleeing force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 멈추지 말고 적군의 뒤를 추격하여 그들의 후미를 치십시오. 그들이 자기들의 성읍들로 들어가지 못하게 하십시오. 야훼 여러분의 하나님께서 그들을 여러분의 손에 넘기셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: But as for you
  chosen_korean: 그러나 여러분은
  alternatives_korean:
  - 그리고 여러분은
  - 하지만 여러분은
  lexicon: HALOT
  rationale: 전환과 대조를 분명히 드러내기 위해 한국어에서는 문두 대조 접속사 ‘그러나’를 택했고, 독립 인칭대명사의 강조는 ‘여러분은’으로 살렸습니다.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  english_pob_choice: pursue your enemies
  chosen_korean: 적군의 뒤를 추격하여
  alternatives_korean:
  - 적들을 뒤쫓아
  - 원수들을 추격하여
  lexicon: HALOT
  rationale: 군사적 추격의 관용을 살려 ‘추격하다’를 사용했고, ‘뒤를’로 전치사 אחרי의 방향성을 반영했습니다.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  english_pob_choice: strike their rear guard
  chosen_korean: 그들의 후미를 치십시오
  alternatives_korean:
  - 그들의 뒤를 치십시오
  - 그들의 후미 경비대를 치십시오
  - 그들의 꼬리를 치십시오
  lexicon: HALOT
  rationale: זנב의 군사적 비유를 한국어로 자연스럽게 옮기되, ‘후미’로 뒤쪽 집단을 가리키는 이미지를 보존했습니다. 영어 POB의 주석이 허용하는 ‘rear/stragglers’의 폭을 한 문장 안에서 과도하게 해석하지 않도록 했습니다.
- source_word: כִּי נְתָנָם יְהוָה אֱלֹהֵיכֶם בְּיֶדְכֶם
  english_pob_choice: for Yahweh your God has given them into your hand
  chosen_korean: 야훼 여러분의 하나님께서 그들을 여러분의 손에 넘기셨기 때문입니다
  alternatives_korean:
  - 야훼 여러분의 하나님께서 그들을 여러분의 손에 주셨기 때문입니다
  - 야훼 여러분의 하나님께서 그들을 여러분의 권세에 넘기셨기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 결과성을 살려 ‘넘기셨다’를 택했고, בְּיֶדְכֶם의 관용구는 ‘여러분의 손에’로 직역하되 의미는 통치/지배의 수여로 읽히게 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아닌 언약 이름 יְהוָה를 직접 사용하므로, 표준 프로젝트 원칙에 따라 ‘야훼’로 옮겨 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
