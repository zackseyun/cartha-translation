base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
  footnotes:
  - marker: a
    text: Or 'crossed over from Libnah to Lachish.' The Hebrew verb can more literally mean 'passed over,' but here it refers to military movement from one city to another.
    reason: lexical_alternative
  - marker: b
    text: Or 'encamped against it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아와 그와 함께한 온 이스라엘은 립나에서 라기스로 나아가[a], 그 성에 맞서 진을 치고 그 성과 싸웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘립나에서 라기스로 건너갔습니다.’ 히브리어 동사는 더 문자적으로 ‘건너가다’ 또는 ‘지나가다’를 뜻할 수 있지만, 여기서는 한 도시에서 다른 도시로 이동하는 군사 행군을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed on
  chosen_korean: 지나가서
  alternatives_korean:
  - 건너가서
  - 지나쳐 가서
  - 이동해서
  lexicon: HALOT
  rationale: 이 동사는 단순 이동을 뜻할 수 있으므로, 전쟁 맥락에서 자연스럽고 과도한 해석이 없는 ‘지나가서’로 옮겼습니다.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  english_pob_choice: and all Israel with him
  chosen_korean: 그와 함께한 온 이스라엘
  alternatives_korean:
  - 그와 함께한 모든 이스라엘
  - 온 이스라엘이 그와 함께
  lexicon: HALOT
  rationale: 동행하는 집단 전체를 자연스럽게 드러내되, 군사적 동반 관계를 유지하도록 표현했습니다.
- source_word: וַיִּחַן עָלֶיהָ
  english_pob_choice: and camped against it
  chosen_korean: 그 성을 대적하여 진을 치고
  alternatives_korean:
  - 그 성에 맞서 진을 치고
  - 그 성 앞에 진을 치고
  lexicon: HALOT
  rationale: עַל이 포위·대치의 뉘앙스를 가지므로 단순한 위치 묘사보다 적대적 진영 배치를 드러내는 ‘대적하여 진을 치고’로 옮겼습니다.
- source_word: וַיִּלָּחֶם בָּהּ
  english_pob_choice: and fought against it
  chosen_korean: 그 성과 싸웠습니다
  alternatives_korean:
  - 그 성을 향해 싸웠습니다
  - 그 성과 전쟁을 벌였습니다
  lexicon: HALOT
  rationale: לחם의 기본 의미를 직역하되 한국어에서 자연스럽게 들리도록 ‘싸웠습니다’로 처리했습니다.
