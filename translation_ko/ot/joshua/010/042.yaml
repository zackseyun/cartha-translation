  source_fidelity: 히브리어는 여호수아가 ‘이 모든 왕들과 그들의 땅’을 לָכַד(사로잡다/점령하다)했으며, 그 일이 פַּעַם אֶחָת(한 차례, 한 번)에 이루어졌다고 요약합니다. ‘사로잡았습니다’와 ‘이스라엘을 위해 싸우셨기 때문입니다’는 각각 לָכַד와 נִלְחָם לְיִשְׂרָאֵל의 군사적·인과적 의미를 충실히 전달합니다. 다만 ‘한 번에’는 한국어에서 동시성을 다소 강하게 암시할 수 있어, 한 차례의 원정이라는 문맥을 보존하는 ‘한 차례에’가 더 안전합니다.
  naturalness: 합쇼체 문체와 문장 연결은 자연스럽습니다. ‘야훼, 이스라엘의 하나님께서’도 동격 표현으로 무리가 없습니다. ‘한 차례에’는 현대 공적 문체에서 자연스럽고, ‘한 번에’보다 원문의 시간적 표현을 과도하게 ‘동시에’로 좁히지 않습니다.
  terminology: ‘야훼’는 제시된 번역 방침에 따른 YHWH의 음역으로 적절합니다. ‘이스라엘의 하나님’, ‘사로잡았습니다’, ‘이스라엘을 위해 싸우셨기 때문입니다’도 신학적 또는 교단적 해석을 덧붙이지 않고 원문 의미를 보존합니다.
