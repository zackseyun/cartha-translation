base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
  footnotes:
  - marker: a
    text: Or 'in one campaign.' The Hebrew literally says 'at one time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 이 모든 왕들과 그들의 땅을 한 차례에[a] 사로잡았습니다. 이는 야훼, 이스라엘의 하나님께서 이스라엘을 위해 싸우셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 번의 전역에서’. 히브리어는 문자적으로 ‘한 번’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  english_pob_choice: captured
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 점령했습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 군사적 맥락에서 ‘captured’에 해당하는 핵심 동작을 살리되, 한국어에서 자연스럽고 공적 문체에 맞는 동사로 옮겼습니다.
- source_word: פַּעַם אֶחָת
  english_pob_choice: at one time
  chosen_korean: 한 번에
  alternatives_korean:
  - 한 번에
  - 한 차례에
  - 한 캠페인에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘한 번/한 차례’이지만, 문맥상 하나의 연속된 정복 행위를 가리키므로 ‘한 번에’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명은 대체 호칭이 아니라 음역어로 드러내는 것이 원문 감사에 더 충실하므로 ‘야훼’를 유지했습니다.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  english_pob_choice: fought for Israel
  chosen_korean: 이스라엘을 위해 싸우셨기 때문입니다
  alternatives_korean:
  - 이스라엘 편에서 싸우셨기 때문입니다
  - 이스라엘을 위하여 싸우셨기 때문입니다
  lexicon: HALOT
  rationale: לְ의 목적/이익 관계를 한국어 ‘~을 위해’로 자연스럽게 옮기되, 하나님의 행동 주체성을 분명히 살렸습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 사용하는 신명을 제목적 호칭으로 바꾸지 않고 고유명사로 보존하여, 언약적 이름이 가진 식별성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
