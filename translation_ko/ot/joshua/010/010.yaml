id: JOS.10.10
reference: Joshua 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
  footnotes:
  - marker: a
    text: Or 'routed them' / 'threw them into panic.' The Hebrew verb denotes causing confusion or panic in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘 앞에서 그들을 혼란에 빠뜨리시고, 기브온에서 큰 살육으로 그들을 치셨으며, 벧호론 오르막길을 따라 그들을 추격하여 아세가와 막게다에 이르기까지 그들을 치셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהֻמֵּם
  english_pob_choice: threw them into confusion
  chosen_korean: 혼란에 빠뜨리시고
  alternatives_korean:
  - 패주하게 하시고
  - 혼비백산하게 하시고
  - 공포에 몰아넣으시고
  lexicon: HALOT
  rationale: 전투 맥락의 המם은 단순 패배보다 전열 붕괴와 혼란을 뜻하므로, 원인적 뉘앙스를 살려 ‘혼란에 빠뜨리시고’로 옮겼습니다.
- source_word: מַכָּה גְדוֹלָה
  english_pob_choice: with a great slaughter
  chosen_korean: 큰 살육으로
  alternatives_korean:
  - 큰 타격으로
  - 큰 패배로
  - 큰 상처로
  lexicon: HALOT
  rationale: 전투 서술에서 מַכָּה는 단순한 ‘타격’보다 살상과 전멸의 결과를 가리킬 수 있어, 해석력을 유지하면서도 과장되지 않게 ‘큰 살육’으로 번역했습니다.
- source_word: וַיַּכֵּם
  english_pob_choice: struck them down
  chosen_korean: 그들을 치셨으며
  alternatives_korean:
  - 그들을 쓰러뜨리셨으며
  - 그들을 무찌르셨으며
  - 그들을 내려치셨으며
  lexicon: HALOT
  rationale: 히브리어 נכה는 문맥에 따라 ‘치다/쓰러뜨리다/죽이다’의 폭이 있어, 반복되는 동사를 자연스러운 서술로 유지하면서도 과도한 의역을 피해 ‘치셨으며’로 처리했습니다.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  english_pob_choice: by the way of the ascent of Beth-horon
  chosen_korean: 벧호론 오르막길을 따라
  alternatives_korean:
  - 벧호론의 오름길로
  - 벧호론 올라가는 길로
  - 벧호론 상승로를 따라
  lexicon: HALOT
  rationale: 지형 묘사를 보존하기 위해 ‘ascent’를 ‘오르막길’로 풀었고, ‘דרך’는 경로를 나타내므로 ‘따라’로 자연스럽게 연결했습니다.
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  english_pob_choice: as far as Azekah and Makkedah
  chosen_korean: 아세가와 막게다에 이르기까지
  alternatives_korean:
  - 아세가와 막게다까지
  - 아세가와 막게다에 이르러
  - 아세가에서 막게다까지
  lexicon: HALOT
  rationale: ‘עד’의 종결 범위를 한국어 서술에 맞게 ‘이르기까지’로 옮겨, 두 종착점을 모두 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사 יְהוָה를 한국어 표준 표기인 ‘야훼’로 옮겨, 호칭으로 환원하지 않고 언약 անուն 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
