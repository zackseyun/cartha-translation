source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
  footnotes:
  - marker: a
    text: Or 'all its men were mighty warriors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 크게 두려워했습니다. 기브온은 왕국의 성읍들 가운데 하나와 같은 큰 성읍이었고, 또 아이보다 더 컸으며, 그 성읍의 모든 남자는 용사들이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성읍의 모든 남자는 용맹한 전사들이었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  english_pob_choice: they feared greatly
  chosen_korean: 크게 두려워했습니다
  alternatives_korean:
  - 몹시 두려워했습니다
  - 심히 두려워했습니다
  lexicon: HALOT
  rationale: 동사 ירא의 기본 의미인 두려움과 부사의 강도를 자연스러운 현대 한국어로 살리면서, 서술의 긴박한 흐름을 유지했습니다.
- source_word: עִיר גְּדוֹלָה
  english_pob_choice: a great city
  chosen_korean: 큰 성읍
  alternatives_korean:
  - 큰 도시
  - 위대한 성읍
  lexicon: HALOT
  rationale: 여기서는 규모와 위상을 함께 아우르는 표현이므로, 문맥에 맞게 ‘성읍’을 택해 고대 도시-국가적 뉘앙스를 살렸습니다.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  english_pob_choice: like one of the royal cities
  chosen_korean: 왕의 성읍들 가운데 하나와 같은
  alternatives_korean:
  - 왕국의 성읍들 가운데 하나와 같은
  - 왕실 성읍들 가운데 하나와 같은
  lexicon: HALOT
  rationale: 직역하면 ‘왕국의 성읍들’이지만, 한국어에서는 ‘왕의 성읍들’이 비교 구문을 더 자연스럽게 전달합니다.
- source_word: וְכָל אֲנָשֶׁי/הָ גִּבֹּרִים
  english_pob_choice: and all its men were mighty
  chosen_korean: 그 성읍의 모든 사람은 용사들이었기 때문입니다
  alternatives_korean:
  - 그 성읍의 모든 남자는 용맹한 사람들이었기 때문입니다
  - 그 성읍의 모든 사람은 힘센 사람들이었기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 전투 가능한 남성 집단을 가리키지만 한국어 본문에서는 지나치게 성별을 좁히기보다, 각주로 의미를 보충해 ‘용사들’로 옮겨 군사적 함의를 드러냈습니다.
theological_decisions:
- issue: ‘ירא’의 정서 강도
  chosen_reading: 단순한 놀람이 아니라, 군사적 위협 앞에서의 실제 두려움으로 옮겼습니다.
  alternative_readings:
  - 무서워했습니다
  - 겁을 먹었습니다
  rationale: 여호수아 문맥에서 기브온의 위세를 보고 느낀 반응은 감정 묘사이면서 동시에 정치·군사적 판단이므로, 두려움의 실질을 살리는 번역이 적절합니다.
  doctrine_reference: 서사 문맥의 역사적-군사적 의미
- issue: ‘גִּבֹּרִים’의 성격
  chosen_reading: 본문은 단순한 신체적 강함보다 전투적 유능함을 암시합니다.
  alternative_readings:
  - 강한 사람들
  - 용맹한 전사들
  rationale: POB의 영어 주석처럼 ‘mighty’는 전쟁 수행 능력을 포함할 수 있으므로, 한국어에서는 본문에 ‘용사들’을 사용해 의미를 드러내고 별도 각주로 선택지를 남겼습니다.
  doctrine_reference: 본문의 서사적 군사 어휘
