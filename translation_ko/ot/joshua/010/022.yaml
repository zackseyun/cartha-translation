translation:
  language: ko
  text: 그러자 여호수아가 말했습니다. 「굴의 입구를 열고, 그 다섯 왕을 굴에서 내게로 데리고 나오십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר / Then ... said
  english_pob_choice: Then Joshua said
  chosen_korean: 그러자 여호수아가 말했습니다
  alternatives_korean:
  - 그리고 여호수아가 말했습니다
  - 그때 여호수아가 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 서술 흐름을 자연스럽게 이어 주는 종결 표현으로 ‘그러자’를 택해, 단순한 접속어보다 사건 진행의 순서를 드러냈습니다.
- source_word: פִּתְחוּ
  english_pob_choice: Open
  chosen_korean: 열고
  alternatives_korean:
  - 여십시오
  - 열어 주십시오
  lexicon: HALOT פתח
  rationale: 명령문을 한국어로 자연스럽게 옮기되, 이어지는 동작과 함께 ‘굴의 입구를 열고’라고 처리해 원문의 간결한 명령을 살렸습니다.
- source_word: פִּי הַמְּעָרָה
  english_pob_choice: the mouth of the cave
  chosen_korean: 굴의 입구
  alternatives_korean:
  - 굴의 입
  - 동굴의 입구
  lexicon: HALOT פי + מערה
  rationale: 히브리어의 직역 가능성은 유지하되, 한국어에서는 ‘입’보다 ‘입구’가 의미를 또렷하게 전달하므로 과도한 생소함 없이 원문 이미지를 반영했습니다.
- source_word: וְהוֹצִיאוּ ... אֵלַי
  english_pob_choice: bring ... out to me
  chosen_korean: 나에게서 굴 밖으로 끌어내십시오
  alternatives_korean:
  - 나에게로 끌어내십시오
  - 나 앞으로 끌어내십시오
  lexicon: HALOT יצא (Hiphil) + אלי
  rationale: 히브리어의 ‘밖으로 내보내다’와 ‘나에게로/나에게서’의 방향성을 살리기 위해 ‘끌어내십시오’를 택했고, ‘나에게서’로 화자의 기준점을 드러냈습니다.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  english_pob_choice: those five kings
  chosen_korean: 그 다섯 왕
  alternatives_korean:
  - 이 다섯 왕
  - 저 다섯 왕
  lexicon: HALOT מלך + demonstrative
  rationale: 이미 언급된 특정 인물들을 가리키는 지시어는 한국어 서술에서 ‘그’가 가장 자연스러워, 문맥상 특정성을 유지했습니다.
