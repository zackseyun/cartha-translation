- from: 그러자 여호수아가 말했습니다. 「굴의 입구를 열고, 그 다섯 왕을 나에게서 굴 밖으로 끌어내십시오.」
  to: 그러자 여호수아가 말했습니다. 「굴의 입구를 열고, 그 다섯 왕을 굴에서 내게로 데리고 나오십시오.」
  rationale: 아래 수정문은 אֵלַי의 방향을 ‘내게로’로 정확히 반영하고, וְהוֹצִיאוּ의 사역적 이동 의미를 ‘굴에서 … 데리고 나오십시오’로 자연스럽게 보존합니다. ‘그 다섯 왕’은 앞서 언급된 특정 왕들을 가리키는 הָאֵלֶּה에 적절하며, ‘굴의 입구’도 한국어 관용에 맞는 충실한 번역입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:01Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 동작과 대상은 대체로 충실하지만, אֵלַי는 여호수아를 향하는 방향인데 초안의 ‘나에게서’는 여호수아에게서 멀어지는 뜻이어서 원문과 반대입니다. 또한 ‘끌어내십시오’는 אפשר한 번역이나, 원문의 사역형 ‘데리고 나오다/내오다’보다 강제적으로 질질 끄는 뉘앙스를 더할 수 있습니다.
  naturalness: ‘그러자 여호수아가 말했습니다’와 ‘굴의 입구’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. 명령의 방향을 ‘내게로’로 바로잡고 ‘굴에서 내게로 데리고 나오십시오’로 옮기면 자연스럽고 명료합니다.
  terminology: ‘여호수아’, ‘왕’, ‘굴’은 통용되는 성경 용어이며 적절합니다. פִּי הַמְּעָרָה의 ‘입구’는 한국어에서 자연스러운 의미 번역입니다. 별도 각주는 필요하지 않습니다.
  issues:
  - severity: high
    issue: ‘나에게서’
    rationale: 히브리어 אֵלַי는 ‘나에게/내게로’를 뜻합니다. ‘나에게서’는 출발점 또는 이탈을 뜻하므로 방향을 반대로 바꿉니다.
  - severity: low
    issue: ‘끌어내십시오’의 추가 뉘앙스
    rationale: וְהוֹצִיאוּ는 ‘(밖으로) 데리고 나오게 하다/내오다’이며, 문맥상 강제성이 전혀 없다고 단정할 수는 없지만 ‘끌다’는 원문에 없는 물리적 견인의 뉘앙스를 명시합니다.
  revised_text: 그러자 여호수아가 말했습니다. 「굴의 입구를 열고, 그 다섯 왕을 굴에서 내게로 데리고 나오십시오.」
