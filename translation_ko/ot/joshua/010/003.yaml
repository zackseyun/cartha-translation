  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: ko
  text: 그래서 아도니-체덱 곧 예루살렘 왕이 헤브론 왕 호함에게, 야르뭇 왕 피람에게, 라기스 왕 야비아에게, 그리고 에글론 왕 드비르에게 사람을 보내어 말하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: So ... sent
  chosen_korean: 그래서 ... 사람을 보내어
  alternatives_korean:
  - 그리고 ... 보냈습니다
  - 그때 ... 보냈습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 전개를 한국어의 인과·연결 감각으로 살리되, 동사의 핵심 의미는 ‘보내다’로 직역성 있게 유지했습니다.
- source_word: אֲדֹנִי צֶדֶק
