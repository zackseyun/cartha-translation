  - 아도니-세덱
  lexicon: HALOT
  rationale: 고유명사이므로 음역하되, 합성 이름의 구조를 드러내기 위해 하이픈을 유지했습니다.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  english_pob_choice: king of Jerusalem
  chosen_korean: 예루살렘 왕
  alternatives_korean:
