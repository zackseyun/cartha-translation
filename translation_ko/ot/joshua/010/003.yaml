  lexicon: HALOT
  rationale: 히브리어 속격 구조를 한국어의 일반적인 관형 구조로 자연스럽게 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 이르며
  - 말하여
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 여는 기능을 살려, 한국어에서 자연스러운 보고 동사로 처리했습니다.
theological_decisions:
- issue: 본문이 인용을 시작하는 방식
  chosen_reading: 문장 끝을 ‘말하였습니다’로 마쳐 다음 절의 직접화법이 이어지도록 했습니다.
  alternative_readings:
