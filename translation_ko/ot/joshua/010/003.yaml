  lexicon: HALOT
  rationale: 히브리어 속격 구조를 한국어의 일반적인 관형 구조로 자연스럽게 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하였습니다
