    rationale: ‘아도니세덱, 비람, 드빌’은 널리 쓰이는 한국어 성경식 표기이며, 독자의 인명 식별과 일관성에 유익합니다.
  revised_text: 이에 예루살렘 왕 아도니세덱이 헤브론 왕 호함과 야르뭇 왕 비람과 라기스 왕 야비아와 에글론 왕 드빌에게 보내어 이르기를,
