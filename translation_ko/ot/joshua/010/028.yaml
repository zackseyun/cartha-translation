revisions:
- from: 여호수아가 그 날에 막게다를 점령하고 칼날로 그것을 쳤으며, 그 왕과 그 안의 모든 사람을 진멸하여 아무 생존자도 남기지 않았습니다. 또한 여호수아는 막게다 왕에게 여리고 왕에게 한 것과 똑같이 하였습니다.[a]
  to: 여호수아가 그날에 막게다를 점령하고 칼날로 그 성을 쳤으며, 그 왕과 그 안에 있는 모든 사람을 멸절하도록 바쳐[a] 아무 생존자도 남기지 않았습니다. 또 막게다 왕에게는 여리고 왕에게 한 것과 똑같이 하였습니다.
  rationale: 본문의 폭력적 역사 서술을 완화하거나 확대하지 않고, חרם의 특수한 ‘멸절을 위해 바침’의 의미를 본문과 가까운 각주로 보존했습니다. ‘그 성’과 ‘그날’은 각각 지시의 명료성과 현대 표기를 위한 최소한의 문체 수정입니다.
