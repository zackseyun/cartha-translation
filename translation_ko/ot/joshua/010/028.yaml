id: JOS.10.28
reference: Joshua 10:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
  footnotes:
  - marker: a
    text: Or 'utterly destroyed'; the Hebrew verb denotes devoting something to destruction under the ban.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 그날에 막게다를 점령하고 칼날로 그 성을 쳤으며, 그 왕과 그 안에 있는 모든 사람을 멸절하도록 바쳐[a] 아무 생존자도 남기지 않았습니다. 또 막게다 왕에게는 여리고 왕에게 한 것과 똑같이 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 어떤 대상을 멸절을 위해 바치거나 구별하는 것을 뜻합니다. ‘완전히 멸절하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 사로잡고
  - 붙잡고
  lexicon: HALOT
  rationale: 성읍을 군사적으로 ‘captured’한 의미를 한국어 현대어로 자연스럽게 옮기되, 전쟁 서술의 객관적 어조를 유지했습니다.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  english_pob_choice: struck it with the edge of the sword
  chosen_korean: 칼날로 그것을 쳤으며
  alternatives_korean:
  - 칼의 날로 그것을 쳤으며
  - 칼로 그것을 쳤으며
  lexicon: HALOT
  rationale: לְפִי חֶרֶב의 문자적 이미지를 살리기 위해 ‘칼날로’를 택해, 단순한 ‘칼로’보다 원문 감각을 더 직접적으로 드러냈습니다.
- source_word: הֶחֱרִם
  english_pob_choice: devoted to destruction
  chosen_korean: 진멸하여
  alternatives_korean:
  - 멸망시키며
  - 진멸하였으며
  lexicon: HALOT
  rationale: חרם의 언약적·심판적 무게를 살리기 위해 교회적 관용구인 ‘저주하다’류를 피하고, 원문의 전쟁 봉헌 파괴 의미를 담는 ‘진멸’로 옮겼습니다.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person in it
  chosen_korean: 그 안의 모든 사람
  alternatives_korean:
  - 그 안에 있던 모든 생명
  - 그 안의 모든 목숨
  lexicon: HALOT
  rationale: נפש를 여기서는 비물질적 ‘영혼’이 아니라 사람/생명 단위로 보아, 현대 독자가 바로 이해할 수 있는 ‘사람’으로 풀었습니다.
theological_decisions:
- issue: חרם의 전쟁 심판 성격
  chosen_reading: ‘진멸하여’로 옮겨, 단순한 전멸이 아니라 하나님께 구별된 심판 행위라는 뉘앙스를 보존했습니다.
  alternative_readings:
  - 완전히 멸망시켜
  - 없애 버려
  rationale: POB의 ‘devoted to destruction’이 지닌 성전적·심판적 함의를 한국어에서 약화하지 않기 위해, 전통적이지만 의미가 분명한 ‘진멸’을 채택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
