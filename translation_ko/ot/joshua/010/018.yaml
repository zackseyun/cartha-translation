id: JOS.10.18
reference: Joshua 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
  footnotes:
  - marker: a
    text: Or 'to the entrance of the cave.' Hebrew literally says 'to the mouth of the cave.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'to guard them,' with a plural object, likely referring to the kings shut inside the cave rather than to the cave itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여호수아가 말했습니다. 「큰 돌들을 그 굴의 입구로 굴려 놓고, 사람들을 그 위에 두어 지키게 하십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굴의 입구로’. 히브리어는 문자적으로 ‘굴의 입으로’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들을 지키게 하라’라고 하며, 복수 목적어는 굴 속에 갇힌 왕들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ
  english_pob_choice: And Joshua said
  chosen_korean: 그러자 여호수아가 말했습니다
  alternatives_korean:
  - 그리고 여호수아가 말했습니다
  - 여호수아가 말했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: וַיֹּאמֶר은 서사 진행을 여는 표지이므로 ‘그러자’로 자연스러운 흐름을 살렸고, 인명은 통용형 ‘여호수아’를 따랐습니다.
- source_word: גֹּלּוּ אֲבָנִים גְּדֹלוֹת
  english_pob_choice: Roll large stones
  chosen_korean: 큰 돌들을 ... 굴려 놓고
  alternatives_korean:
  - 큰 돌들을 굴리고
  - 큰 돌을 굴려
  lexicon: HALOT
  rationale: גֹּלּוּ는 돌을 굴리라는 복수 명령이므로 ‘굴려 놓고’로 행위와 완료된 배치를 함께 드러냈고, אֲבָנִים גְּדֹלוֹת은 자연스러운 현대 한국어로 ‘큰 돌들’로 옮겼습니다.
- source_word: אֶל פִּי הַמְּעָרָה
  english_pob_choice: to the mouth of the cave
  chosen_korean: 그 굴의 입구로
  alternatives_korean:
  - 굴의 입구로
  - 굴의 입에
  - 굴 입구에
  lexicon: HALOT
  rationale: פִּי는 직역하면 ‘입’이지만 한국어에서는 지형의 개구부를 ‘입구’로 옮겨 의미를 분명히 하면서도 원문의 이미지 손실을 최소화했습니다.
- source_word: וְהַפְקִידוּ עָלֶיהָ אֲנָשִׁים
  english_pob_choice: and appoint men over it
  chosen_korean: 사람들을 그 위에 두어
  alternatives_korean:
  - 사람들을 그 위에 세워
  - 남자들을 그 위에 두어
  - 경비병들을 배치하여
  lexicon: HALOT
  rationale: הפקידו는 단순 배치보다 ‘맡기다/배치하다’의 뜻이 있어 ‘두어’로 처리했고, אֲנָשִׁים는 ‘사람들’로 옮겨 성별을 과도하게 부각하지 않으면서도 기능을 문맥에 맡겼습니다.
- source_word: לְשָׁמְרָם
  english_pob_choice: to guard them
  chosen_korean: 지키게 하십시오
  alternatives_korean:
  - 그것을 지키게 하십시오
  - 그들을 지키게 하십시오
  - 감시하게 하십시오
  lexicon: HALOT
  rationale: 말미의 복수 목적어는 동굴 안에 갇힌 왕들을 가리키는 것으로 볼 수 있어, POB의 주석 취지를 살려 ‘지키게 하십시오’로 번역해 대상의 복수성을 과도하게 특정하지 않았습니다.
