  text: וַ/יֻּגַּ֖ד לִ/יהוֹשֻׁ֣עַ לֵ/אמֹ֑ר נִמְצְאוּ֙ חֲמֵ֣שֶׁת הַ/מְּלָכִ֔ים נֶחְבְּאִ֥ים בַּ/מְּעָרָ֖ה בְּ/מַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
  footnotes:
  - marker: a
    text: Or “were found, hiding in the cave at Makkedah.” The Hebrew participle can be rendered more verbally ('hiding') or as a state ('hidden').
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아에게 이렇게 보고되었습니다. 「다섯 왕이 막게다의 굴에 숨어 있는 채 발견되었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다섯 왕이 막게다의 굴에 숨은 채 발견되었습니다.” 히브리어 분사는 동작(‘숨어 있는’)이나 상태(‘숨은’)로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לִיהוֹשֻׁעַ
  english_pob_choice: it was reported to Joshua
  chosen_korean: 여호수아에게 보고되어
  alternatives_korean:
  - 여호수아에게 전하여져
  - 여호수아에게 말해져
  lexicon: HALOT
  rationale: 수동적 보고 동사를 자연스러운 한국어 수동 표현으로 옮기되, 행위 주체를 특정하지 않아 원문의 형태를 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 이르되
  - 말하여
  lexicon: HALOT
  rationale: 인용 도입 표지로 기능하므로, 현대 문어에서 자연스러운 연결 표현인 '말하기를'을 사용했습니다.
- source_word: נִמְצְאוּ חֲמֵשֶׁת הַמְּלָכִים
  english_pob_choice: The five kings have been found
  chosen_korean: 다섯 왕이 … 발견되었습니다
  alternatives_korean:
  - 다섯 왕이 … 찾아졌습니다
  - 다섯 왕이 … 발견되었다고 합니다
  lexicon: HALOT
  rationale: מצא의 수동 완료 의미를 한국어의 '발견되었습니다'로 옮겨, 이미 이루어진 발견이라는 결과 상태를 드러냈습니다.
- source_word: נֶחְבְּאִים
  english_pob_choice: hidden
  chosen_korean: 숨어 있는 채로
  alternatives_korean:
  - 숨은
  - 숨겨진
  lexicon: HALOT
  rationale: POB의 본문처럼 발견된 상태만이 아니라 '숨고 있는 상태'라는 뉘앙스를 살리기 위해 상태적 표현을 택했습니다.
- source_word: בַּמְּעָרָה בְּמַקֵּדָה
  english_pob_choice: in the cave at Makkedah
  chosen_korean: 므깃다의 굴에서
  alternatives_korean:
  - 므깃다의 동굴에서
  - 마케다의 굴에서
  lexicon: HALOT
  rationale: מְעָרָה는 문맥상 '굴/동굴'로 옮길 수 있으나, 본문상의 지명 קשר를 살려 '므깃다의 굴'로 간결하게 처리했습니다.
theological_decisions:
- issue: נֶחְבְּאִים의 상태/행위 뉘앙스
  chosen_reading: ‘숨어 있는 채로’라는 상태적 표현으로, 발견 당시 그들이 숨은 상태였음을 드러냈습니다.
  alternative_readings:
  - ‘숨겨진’처럼 완전히 수동적 상태로만 읽는 방식
  - ‘숨고 있는’처럼 진행성을 더 강하게 드러내는 방식
  rationale: 히브리어 분사 נֶחְבְּאִים는 결과 상태와 현재적 은닉 행위를 모두 시사할 수 있으므로, 둘 사이의 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: 없음
