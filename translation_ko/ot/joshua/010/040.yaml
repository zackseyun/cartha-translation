    text: ‘진멸에 바쳤습니다’는 히브리어 חרם의 사역형을 옮긴 말입니다. 이는 어떤 것을 돌이킬 수 없게 파멸에 내어 주는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘숨[breath] 쉬는 모든 것’입니다.
    reason: lexical_alternative
