  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''every soul who was in it,'' an idiom meaning every person in the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 라기스를 이스라엘의 손에 넘기셨고, 그가 둘째 날에 그 성읍을 함락하여 칼날로 쳐서 그 안에 있던 모든 사람[a]을 쳤습니다. 이는 그가 립나에 행한 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 안에 있던 모든 목숨’은 성읍 안에 있던 모든 사람을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
