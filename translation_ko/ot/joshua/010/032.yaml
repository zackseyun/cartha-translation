theological_decisions:
- issue: ‘그들이 … 행한 것’의 주어 처리
  chosen_reading: 최종 비교절의 주어를 ‘그들’로 처리했습니다.
  alternative_readings:
  - ‘그가 … 행한 것’으로 단수 유지
  - 수동형으로 바꾸어 주어를 생략
  rationale: 히브리어는 단수 동사지만, 문맥상 이스라엘 집단의 행동을 가리키므로 한국어에서는 자연스러운 복수 주어를 사용했습니다. 이는 원문의 대표성 있는 서술을 해치지 않으면서도 문맥 이해를 돕습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 살상 진술의 강도 보존
  chosen_reading: ‘모든 사람을 쳤습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘죽였습니다’
  rationale: 본문은 전멸에 가까운 전쟁 서술을 담고 있으므로, 의미를 완화하는 표현보다 원문의 강한 어조를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
