revisions:
- from: 야훼께서 이스라엘의 손에 라기스를 넘기셨고, 그들은 둘째 날에 그것을 함락시켰으며, 칼날로 그것을 치고 그 안에 있는 모든 사람을 쳤습니다. 그들이 라브나에 대해서 행한 것과 꼭 같았습니다.[a]
  to: 야훼께서 라기스를 이스라엘의 손에 넘기셨고, 그가 둘째 날에 그 성읍을 함락하여 칼날로 쳐서 그 안에 있던 모든 사람[a]을 쳤습니다. 이는 그가 립나에 행한 것과 같았습니다.
  rationale: 원문의 단수 동사를 한국어 ‘그가’로 유지하고, 지명을 ‘립나’로 정정했습니다. 성읍과 그 안의 사람들을 대상으로 하는 ‘칼날로 치다’라는 전쟁 관용구는 완화하거나 과도하게 해석하지 않고 자연스러운 한국어 문장 구조로 옮겼습니다. נֶפֶשׁ의 집합적 인간 지시를 설명하는 각주는 해당 어구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:38Z'
