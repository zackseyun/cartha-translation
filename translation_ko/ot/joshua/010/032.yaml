  source_fidelity: 히브리어는 야훼가 라기스를 이스라엘의 손에 넘기신 뒤, 단수 동사로 ‘그가’ 그 성읍을 함락하고 칼날로 치며 그 안의 모든 사람을 친 것으로 서술합니다. 초안의 복수 주어 ‘그들은/그들이’는 이 단수 서술을 바꾸므로 유지하기 어렵습니다. 또한 לִבְנָה는 통용 한국어 성경 지명 표기인 ‘립나’로 바로잡는 것이 적절합니다.
  naturalness: ‘칼날로 그것을 치고 그 안에 있는 모든 사람을 쳤습니다’는 목적어와 동사의 반복 때문에 한국어 문장으로 다소 부자연스럽습니다. 성읍을 ‘칼날로 쳐’ 그 안의 사람들에게까지 행위가 미쳤음을 드러내는 형태가 자연스럽고 원문의 군사 관용구도 보존합니다.
  terminology: ‘야훼’, ‘라기스’, ‘함락하다’, ‘이스라엘의 손에 넘기다’는 적절합니다. ‘립나’로 지명을 정정합니다. נֶפֶשׁ는 영혼이라는 현대적 의미가 아니라 사람을 가리키므로 ‘모든 사람’ 및 이에 대한 각주가 적절합니다.
