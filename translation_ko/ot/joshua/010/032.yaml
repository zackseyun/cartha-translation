base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''every soul who was in it,'' an idiom meaning every person in the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘의 손에 라기스를 넘기셨고, 그들은 둘째 날에 그것을 함락시켰으며, 칼날로 그것을 치고 그 안에 있는 모든 사람을 쳤습니다. 그들이 라브나에 대해서 행한 것과 꼭 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 안에 있는 모든 목숨’은 성읍 안의 모든 사람을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사/신명사 관례
  rationale: 본문의 언약적 신명사를 한국어 프로젝트 기본값대로 야훼로 옮겨, 원문 표지와 일관성을 유지했습니다.
- source_word: וַיִּתֵּן ... בְּיַד
  english_pob_choice: gave ... into the hand of
  chosen_korean: ~의 손에 넘기셨고
  alternatives_korean:
  - ~에게 넘기셨고
  - ~의 손에 주셨고
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 단순한 ‘주다’보다 지배권 이전의 뉘앙스를 드러내도록 했습니다.
- source_word: לָכִישׁ
  english_pob_choice: Lachish
  chosen_korean: 라기스
  alternatives_korean:
  - 라키스
  - 라기쉬
  lexicon: 현대 외래어 표기
  rationale: 지명은 한국어 성경·지리 표기에서 통용되는 라기스를 사용했습니다.
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 그것을 함락시켰으며
  alternatives_korean:
  - 그것을 점령했으며
  - 그것을 사로잡았으며
  lexicon: HALOT
  rationale: 도시 포위전 맥락에서 ‘captured’의 군사적 의미를 자연스럽게 살리면서도 성읍에 어울리는 표현으로 옮겼습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼로
  lexicon: HALOT
  rationale: ‘입(날) of the sword’의 관용을 한국어로 압축해, 본문의 격렬한 살상 이미지를 유지했습니다.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person who was in it
  chosen_korean: 그 안에 있는 모든 사람
  alternatives_korean:
  - 그 안에 있는 모든 목숨
  - 그 안에 있는 모든 영혼
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘영혼’으로 오해하지 않도록, POB의 취지에 따라 사람 전체를 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘그들이 … 행한 것’의 주어 처리
  chosen_reading: 최종 비교절의 주어를 ‘그들’로 처리했습니다.
  alternative_readings:
  - ‘그가 … 행한 것’으로 단수 유지
  - 수동형으로 바꾸어 주어를 생략
  rationale: 히브리어는 단수 동사지만, 문맥상 이스라엘 집단의 행동을 가리키므로 한국어에서는 자연스러운 복수 주어를 사용했습니다. 이는 원문의 대표성 있는 서술을 해치지 않으면서도 문맥 이해를 돕습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 살상 진술의 강도 보존
  chosen_reading: ‘모든 사람을 쳤습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘죽였습니다’
  rationale: 본문은 전멸에 가까운 전쟁 서술을 담고 있으므로, 의미를 완화하는 표현보다 원문의 강한 어조를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
