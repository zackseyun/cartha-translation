    issue: הֵם을 ‘그들 자신’으로 번역함
    rationale: 히브리어 הֵם은 여기서 강조적 재귀어가 아니라 열거된 왕들을 다시 받는 독립 대명사입니다. ‘그들과 그들의 모든 군대가’가 자연스럽고 의미를 정확히 전달합니다.
  - severity: medium
