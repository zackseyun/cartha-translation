base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
  footnotes:
  - marker: a
    text: Or 'they and all their armies.' The Hebrew literally says 'they and all their camps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아모리 사람의 다섯 왕 — 예루살렘 왕, 헤브론 왕, 야르못 왕, 라기스 왕, 에글론 왕 — 이 그들 자신과 그들의 모든 군대와 함께 모여 올라와 기브온을 대적하여 진을 치고, 그것과 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 자신과 그들의 모든 진영과 함께’입니다. 히브리어는 문자적으로 ‘그들 자신과 그들의 모든 진영’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  english_pob_choice: gathered together
  chosen_korean: 모여
  alternatives_korean:
  - 함께 모였습니다
  - 집결했습니다
  lexicon: HALOT
  rationale: 집합의 동작을 직접 살리되, 군사 문맥에서 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본 이미지인 ‘올라가다’를 유지하면서, 바로 뒤의 공격 행위를 위한 이동이라는 흐름도 드러내도록 했습니다.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  english_pob_choice: they and all their camps
  chosen_korean: 그들 자신과 그들의 모든 군대와 함께
  alternatives_korean:
  - 그들 자신과 그들의 모든 진영과 함께
  - 그들 자신과 그들의 모든 부대와 함께
  lexicon: HALOT
  rationale: מַחֲנֶה의 문자적 ‘진영/진’ 이미지는 보존 가능하지만, 이 문맥에서는 군사력 전체를 가리키는 표현이므로 한국어에서는 ‘군대’가 더 분명합니다. 영어 POB의 ‘armies’ 조정 이력도 참고했습니다.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  english_pob_choice: they encamped against Gibeon
  chosen_korean: 기브온을 대적하여 진을 치고
  alternatives_korean:
  - 기브온 맞은편에 진을 치고
  - 기브온에 진을 치고
  lexicon: HALOT
  rationale: עַל을 단순한 위치가 아니라 적대적 방향으로 읽어 ‘대적하여’로 옮겼고, 군사 관용구 ‘진을 치다’를 사용했습니다.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  english_pob_choice: fought against it
  chosen_korean: 그것과 싸웠습니다
  alternatives_korean:
  - 그것을 대적하여 싸웠습니다
  - 그곳과 싸웠습니다
  lexicon: HALOT
  rationale: 도시를 가리키는 여성형 대명사를 한국어에서는 자연스럽게 ‘그것’으로 처리해, 사투리나 인격화 없이 직접적인 전쟁 표현을 유지했습니다.
theological_decisions:
- issue: 군사 문맥에서 עַל의 방향성 해석
  chosen_reading: ‘기브온을 대적하여’로 옮겨, 단순한 위치 정보가 아니라 공격 의도를 분명히 했습니다.
  alternative_readings:
  - ‘기브온에’
  - ‘기브온 맞은편에’
  rationale: 직전과 직후의 전투 동사들이 이미 적대 행위를 규정하므로, 한국어에서도 전투 대상이라는 의미가 분명하게 드러나야 합니다.
  doctrine_reference: 본문 서술의 역사-서사적 의미 보존
