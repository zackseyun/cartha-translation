source:
  edition: WLC
  text: אָ֣ז עָלָ֗ה הֹרָם֙ מֶ֣לֶךְ גֶּ֔זֶר לַ/עְזֹ֖ר אֶת לָכִ֑ישׁ וַ/יַּכֵּ֤/הוּ יְהוֹשֻׁ֨עַ֙ וְ/אֶת עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
  footnotes:
  - marker: a
    text: Or 'no remnant.' The Hebrew שָׂרִיד can denote a survivor or one remaining.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 게셀 왕 호람이 라기스를 돕기 위해 올라갔습니다. 여호수아는 그와 그의 백성을 쳐서, 그에게 생존자가 하나도 남지 않게 했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남은 자.’ 히브리어 שָׂרִיד는 생존자 또는 남은 자를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후
  lexicon: HALOT
  rationale: 서사의 시간적 전환을 자연스럽게 살리면서, 현대 한국어에서 과도하게 구어적이지 않은 표현으로 옮겼습니다.
- source_word: עָלָה
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라왔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘올라가다’라는 기본 이미지를 유지하되, 전투 문맥에서도 무리 없이 읽히는 표준어로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him
  chosen_korean: 쳐서
  alternatives_korean:
  - 쳐부수어
  - 격파하여
  lexicon: HALOT
  rationale: נכה의 폭넓은 뜻인 ‘치다/치고 무찌르다’를 보존하면서, 뒤의 ‘남은 생존자가 없다’는 결과절과 함께 자연스럽게 이어지도록 했습니다.
- source_word: שָׂרִיד
  english_pob_choice: survivor
  chosen_korean: 생존자
  alternatives_korean:
  - 남은 자
  - 남은 사람
  - 잔존자
  lexicon: HALOT
  rationale: 문맥상 단수 집합적 의미를 가장 자연스럽게 전달하는 한국어로, ‘remnant’의 해석 가능성은 주석으로 보존했습니다.
theological_decisions:
- issue: 전투 서술에서의 결과 표현
  chosen_reading: ‘그에게 남은 생존자가 하나도 없게 했습니다’로 결과의 완결성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘남김이 없도록 했습니다’
  - ‘한 사람도 남기지 않았습니다’
  rationale: 히브리어 עַד בִּלְתִּי הִשְׁאִיר לוֹ의 결과·범위 감각을 살리되, 본문이 말하는 전멸적 패턴을 직접적으로 전달했습니다.
  doctrine_reference: 서술 본문 일반; 전쟁 기사에서의 완결적 심판 표현
- issue: 라기스의 도움 대상 표현
  chosen_reading: ‘라기스를 돕기 위해’로 옮겨, 영어 POB처럼 목적어를 직접 취했습니다.
  alternative_readings:
  - ‘라기스를 돕기 위하여’
  - ‘라기스를 구원하려고’
  rationale: 히브리어 לַעְזֹר אֶת לָכִישׁ의 단순한 ‘돕다’ 의미를 유지했고, 구원처럼 더 강한 신학적 의미는 본문이 요구하지 않습니다.
  doctrine_reference: 어휘 수준의 중립적 서술
