  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
  footnotes:
  - marker: a
    text: 'Hebrew: ''every soul who was in it,'' an idiom meaning every person in the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서도 그 성과 그 왕을 이스라엘의 손에 넘기셨습니다. 여호수아는 그 성과 그 안에 있던 모든 사람[a]을 칼날로 쳤습니다. 그 안에 살아남은 자를 하나도 남기지 않았고, 그 왕에게도 여리고 왕에게 행한 것과 같이 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 안에 있는 모든 네페쉬’입니다. 여기서 ‘네페쉬’는 도시 안의 모든 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC / project default
  rationale: 프로젝트 기본어를 따라 신명은 전통적 교회 표기보다 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  english_pob_choice: gave ... into the hand of Israel
  chosen_korean: 이스라엘의 손에 넘기셨습니다
  alternatives_korean:
  - 이스라엘의 손에 주셨습니다
  - 이스라엘에게 넘겨주셨습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용을 살리되, 한국어에서는 ‘넘기셨습니다’가 주권적 인도/인계를 가장 자연스럽게 드러냅니다.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person who was in it
  chosen_korean: 그 안에 있던 모든 사람
  alternatives_korean:
  - 그 안에 있던 모든 생명
  - 그 안에 있던 모든 영혼
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ는 형이상학적 ‘영혼’이 아니라 도시에 있던 사람들을 가리키므로, 오해를 피하려고 ‘모든 사람’으로 옮겼습니다.
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  english_pob_choice: He left no survivor in it
  chosen_korean: 그 안에 살아남은 자를 하나도 남기지 않았고
  alternatives_korean:
  - 그 안에 생존자를 남기지 않았고
  - 그 안에 남은 자가 없었고
  lexicon: HALOT
  rationale: שָׂרִיד의 핵심인 ‘생존자/남은 자’ 의미를 반영해, 단순한 전멸 서술로 축소하지 않고 ‘살아남은 자’를 선택했습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼끝으로
  - 칼의 날로
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심 이미지인 ‘칼의 입/가장자리’를 한국어에서 자연스럽고 간결하게 ‘칼날’로 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술의 강도와 완곡화
  chosen_reading: 본문의 급진적 전멸 진술을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 그들을 무찔렀습니다
  - 그들을 패배시켰습니다
  rationale: 원문은 단순한 군사적 승리보다 ‘모든 사람’과 ‘생존자 없음’을 분명히 말하므로, 그 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 원문 우선, 서술 강도 보존
