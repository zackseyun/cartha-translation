revisions:
- from: 야훼께서도 그것과 그 왕을 이스라엘의 손에 넘기셨습니다. 이스라엘이 그것을 칼날로 쳤고, 그 안에 있던 모든 사람을 죽였습니다. 그 안에 살아남은 자를 하나도 남기지 않았고, 그 왕에게도 여리고 왕에게 행한 것과 같이 행했습니다.[a]
  to: 야훼께서도 그 성과 그 왕을 이스라엘의 손에 넘기셨습니다. 여호수아는 그 성과 그 안에 있던 모든 사람[a]을 칼날로 쳤습니다. 그 안에 살아남은 자를 하나도 남기지 않았고, 그 왕에게도 여리고 왕에게 행한 것과 같이 행했습니다.
  rationale: 문맥상 단수 동사의 주어인 여호수아를 밝혀, 한국어에서 야훼가 직접 칼로 친 것으로 오독될 가능성을 막았습니다. ‘쳐서/쳤습니다’로 נכה의 기본 의미를 보존하고, 원문이 별도로 진술하는 ‘생존자 없음’을 그대로 유지했습니다. 각주는 נֶפֶשׁ의 용례를 정확하고 자연스럽게 설명하도록 고치고 해당 본문어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:08Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 사건 순서와 핵심 표현(야훼께서 넘기심, 칼날로 침, 성 안의 모든 사람, 생존자 없음, 여리고 왕에게 한 것과 같은 처분)은 대체로 충실합니다. 그러나 וַיַּכֶּהָ 및 뒤이은 동사의 단수 남성 주어는 문맥상 여호수아를 가리키는데, 초안의 ‘이스라엘이’는 원문의 문법적 주어를 집합 명사로 바꿉니다. 또한 ‘죽였습니다’는 칼로 친다는 동사를 한 단계 해석한 표현입니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 다만 직전 문장의 주어가 ‘야훼’이므로 다음 문장에서 원문의 ‘그가’를 그대로 옮기면 한국어에서는 야훼가 행동 주체인 듯 읽힐 수 있습니다. 문맥상 지시 대상인 ‘여호수아’를 밝혀 자연스럽고 명료하게 하는 것이 안전합니다.
  terminology: ‘야훼’, ‘이스라엘의 손에 넘기셨습니다’, ‘살아남은 자’는 적절합니다. לְפִי חֶרֶב의 이미지는 ‘칼날로’로 유지할 수 있습니다. 각주에서 נֶפֶשׁ를 ‘생명’이라고 직역하는 것은 한국어에서 다소 부정확하거나 모호하므로, 음역 또는 ‘사람/영혼’의 문자적 표현을 사용하고 본문 용례가 사람을 가리킨다고 설명하는 편이 낫습니다.
  issues:
