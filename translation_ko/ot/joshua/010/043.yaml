  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
  footnotes:
  - marker: a
    text: Or, more literally, 'to the camp, to Gilgal.' The Hebrew uses a directional ending on 'Gilgal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아와 그와 함께한 온 이스라엘은 길갈에 있는 진영으로 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘길갈’에 방향을 나타내는 어미가 붙어 있습니다. 좀 더 직역하면 ‘진영으로, 길갈로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 돌아갔습니다
  lexicon: HALOT
  rationale: 서술 진행형 완료 과거로, 전투·이동 문맥에서 자연스럽고 간결하게 ‘돌아왔습니다’가 가장 잘 맞습니다.
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: and all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 그리고 모든 이스라엘
  - 모든 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살려 공동체 전체를 가리키는 의미를 유지했습니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  lexicon: HALOT
  rationale: 군사적 문맥에서 ‘진영’이 원문의 군대 야영지를 자연스럽고 정확하게 전달합니다.
- source_word: הַגִּלְגָּלָה
  english_pob_choice: at Gilgal
  chosen_korean: 길갈에 있는
  alternatives_korean:
  - 길갈로
  - 길갈에
  lexicon: HALOT
  rationale: 지명 뒤의 방향 표지를 한국어에서 가장 매끈하게 풀어, ‘진영’의 소속/위치를 함께 드러냈습니다.
