base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
  footnotes:
  - marker: a
    text: 'Hebrew: ''every soul who was in it.'' Here ''soul'' means the persons in the city.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he utterly destroyed'; the Hebrew verb denotes devoting something to destruction under the ban.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그날 그 성읍을 점령하고 칼날로 쳤습니다[a]. 그는 그날 그 안에 있는 모든 사람을 진멸하였는데[b], 이는 그가 라기스에 행한 모든 것과 마찬가지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘칼의 입에(곧 칼날로).’'
    reason: source_note
  - marker: b
    text: 또는 ‘그가 파멸에 바쳤다’. 여기서 히브리어 동사는 헤렘 아래 두어 멸망시키는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  english_pob_choice: they captured it
  chosen_korean: 그 성읍을 점령하고
  alternatives_korean:
  - 그 성읍을 사로잡고
  - 그 성읍을 붙잡고
  lexicon: HALOT
  rationale: 전쟁 서술에서 לכד는 성읍을 군사적으로 ‘점령하다’는 뜻으로 자연스럽게 읽히므로, 현대 한국어에서도 그 전쟁적 함의를 살리는 표현을 택했습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: struck it with the edge of the sword
  chosen_korean: 칼날로 쳤습니다
  alternatives_korean:
  - 칼의 입으로 쳤습니다
  - 칼날을 대어 쳤습니다
  lexicon: HALOT
  rationale: ‘칼의 입/칼날’이라는 히브리어 이미지를 살리되, 한국어에서 낯선 직역은 피하고 의미가 분명한 ‘칼날로’로 옮겼습니다.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person who was in it
  chosen_korean: 그 안에 있는 모든 사람
  alternatives_korean:
  - 그 안에 있는 모든 목숨
  - 그 안에 있는 모든 영혼
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ은 형이상학적 ‘영혼’이 아니라 성읍 안의 사람들을 가리키므로, 한국어의 ‘사람’으로 옮겨 오해를 피했습니다.
- source_word: הֶחֱרִים
  english_pob_choice: he devoted to destruction
  chosen_korean: 진멸했습니다
  alternatives_korean:
  - 멸절했습니다
  - 바친 것처럼 멸했습니다
  - 완전히 멸했습니다
  lexicon: HALOT
  rationale: חרם의 제의적·전쟁적 의미를 담는 한국어 성경 용례를 고려해 ‘진멸하다’를 택했습니다. 너무 설명적인 표현보다 간결하게 원문의 강도를 살립니다.
theological_decisions:
- issue: 3인칭 단수 동사의 주어 처리
  chosen_reading: ‘그가… 행한’으로 옮겨, 히브리어의 단수 형태를 반영했습니다.
  alternative_readings:
  - ‘그들이… 행한’으로 옮김
  - 주어를 생략함
  rationale: 본문의 הֶחֱרִים와 עָשָׂה는 단수형이며, 이 본문에서는 여호수아 개인이 진멸 행위를 수행하는 것으로 읽히므로 한국어도 단수 지시를 유지했습니다.
  doctrine_reference: 문법-주어 일치 및 본문 주석 전통
- issue: ‘진멸’의 신학적 강도
  chosen_reading: ‘진멸하다’로 본문의 החרם 개념을 보존했습니다.
  alternative_readings:
  - ‘완전히 멸하다’
  - ‘저주 아래 두다’
  rationale: 이 단어는 단순한 파괴가 아니라 ‘바침/봉헌됨’과 결부된 전쟁-제의적 의미를 가지므로, 그 긴장을 약화시키지 않는 표준적인 한국어 대응을 유지했습니다.
  doctrine_reference: '번역 원칙: 원문 의미 보존'
