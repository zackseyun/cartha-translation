  edition: WLC
  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Do not relax your hand from your servants,'' an idiom meaning ''do not stop supporting us'' or ''do not abandon us.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 기브온 사람들이 길갈의 진영에 있는 여호수아에게 전갈을 보내어 이렇게 말했습니다. 「당신의 종들에게서 손을 거두지 마십시오.[a] 우리에게 속히 올라오셔서 우리를 구해 주시고 도와주십시오. 산지에 사는 아모리 족속의 모든 왕들이 우리를 치려고 모여들었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용구 ‘당신의 종들에게서 손을 거두지 마십시오’는 ‘도움을 중단하지 마십시오’ 또는 ‘우리를 버리지 마십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ / sent
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다’ 동사를 자연스러운 한국어 서술로 옮기되, 사건 진행을 분명히 하기 위해 ‘사람을 보내어’로 풀어 썼습니다.
- source_word: אַנְשֵׁי גִבְעוֹן / the men of Gibeon
  english_pob_choice: the men of Gibeon
  chosen_korean: 기브온 사람들
  alternatives_korean:
  - 기브온의 남자들
  - 기브온의 사람들
  lexicon: HALOT
  rationale: 직역의 남성 표지를 지나치게 강조하기보다, 문맥상 기브온의 대표자들을 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ / Do not relax your hand from your servants
  english_pob_choice: Do not relax your hand from your servants
  chosen_korean: 당신의 종들에게서 손을 거두지 마십시오
  alternatives_korean:
  - 당신의 종들에게서 손을 늦추지 마십시오
  - 당신의 종들을 버리지 마십시오
  lexicon: HALOT
  rationale: ‘손을 거두다’는 히브리어 관용구를 비교적 직접적으로 살리면서, 의미상 ‘도움을 중단하지 말라’는 뉘앙스를 드러냈습니다.
- source_word: עֲבָדֶיךָ / your servants
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 여기서는 정치적·격식적 자기호칭으로 쓰여 신분적 예속을 강조하지 않으므로, 본문 관용에 맞는 ‘종들’을 택했습니다.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה / Come up to us quickly
  english_pob_choice: Come up to us quickly
  chosen_korean: 우리에게 속히 올라오셔서
  alternatives_korean:
  - 빨리 우리에게 올라오십시오
  - 속히 우리에게 올라와 주십시오
  lexicon: HALOT
  rationale: 산지로 올라오는 지형적 방향을 살리기 위해 ‘올라오다’를 유지했고, 간청의 정중함은 -셔서로 표현했습니다.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ / save us and help us
  english_pob_choice: save us and help us
  chosen_korean: 우리를 구원하고 도우십시오
  alternatives_korean:
  - 우리를 건져 주시고 도우십시오
  - 우리를 구하시고 도우십시오
  lexicon: HALOT
  rationale: ‘구원하다’는 ישע의 핵심 의미를 살리고, עזר는 가장 직접적인 대응인 ‘돕다’로 옮겼습니다.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר / all the kings of the Amorites who live in the hill country
  english_pob_choice: all the kings of the Amorites who live in the hill country
  chosen_korean: 아모리 족속의 모든 왕들, 곧 산간지방에 사는 자들
  alternatives_korean:
  - 산지에 사는 아모리 족속의 모든 왕들
  - 산간지방에 거주하는 아모리 왕들
  lexicon: HALOT
  rationale: ‘산간지방’은 히브리어의 산지/고지대를 자연스럽게 풀어 준 것이며, 문장상 앞의 ‘왕들’을 뒤의 분사구가 수식함을 ‘곧’으로 드러냈습니다.
theological_decisions:
- issue: 간청 화법의 공손도
  chosen_reading: 기브온 대표들의 절박한 요청을 현대 한국어의 정중한 명령형으로 옮겼습니다.
  alternative_readings:
  - 더 직설적인 반말형 요청
  - 매우 옛스러운 기도체
  rationale: 본문은 여호수아에게 도움을 요청하는 긴박한 대화이므로, 합쇼체가 의미의 긴급성과 관계적 거리감을 함께 전달합니다.
  doctrine_reference: 문체/화행 일치
- issue: ‘종들’의 신분 뉘앙스
  chosen_reading: עֲבָדֶיךָ는 여기서 예속 신분 선언이라기보다 충성의 겸양 표현으로 처리했습니다.
  alternative_readings:
  - 노예들
  - 하인들
  rationale: 본문 맥락은 동맹 요청의 겸손한 자기호칭이므로, 본문의 정치·수사적 기능을 훼손하지 않는 번역이 필요합니다.
  doctrine_reference: 본문 맥락 해석
