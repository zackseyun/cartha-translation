revisions:
- from: 그리하여 기브온 사람들이 여호수아에게, 곧 길갈의 진영으로 사람을 보내어 말했습니다. 「당신의 종들에게서 손을 거두지 마십시오. 우리에게 속히 올라오셔서 우리를 구원하고 도우십시오. 아모리 족속의 모든 왕들, 곧 산간지방에 사는 자들이 우리를 향하여 모여들었습니다.」[a]
  to: 그리하여 기브온 사람들이 길갈의 진영에 있는 여호수아에게 전갈을 보내어 이렇게 말했습니다. 「당신의 종들에게서 손을 거두지 마십시오.[a] 우리에게 속히 올라오셔서 우리를 구해 주시고 도와주십시오. 산지에 사는 아모리 족속의 모든 왕들이 우리를 치려고 모여들었습니다.」
  rationale: Location and modifier attachment have been clarified to reflect the Hebrew syntax. ‘전갈을 보내어’ makes the Korean narrative idiomatic while retaining the source’s general sense of sending an appeal. The hostile force is rendered as having gathered ‘to attack us,’ which makes explicit the adversative force required by the immediate military context. The idiom and its explanatory note are retained, with the marker anchored to the expression explained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the urgent appeal, the ascent to the hill country, and the hostile gathering. However, ‘여호수아에게, 곧 길갈의 진영으로’ makes the second prepositional phrase sound appositional to Joshua rather than locating him at the camp. ‘아모리 족속의 모든 왕들, 곧 산간지방에 사는 자들’ likewise makes ‘those living in the hill country’ appear to rename the kings rather than modify them. The Hebrew leaves the object of ‘sent’ unstated; ‘전갈을 보내어’ supplies a natural Korean object without asserting an unexpressed number of envoys.
  naturalness: The revised wording uses clear modern formal-polite Korean. ‘길갈의 진영에 있는 여호수아’ naturally expresses the Hebrew’s recipient and location. ‘산지에 사는 아모리 족속의 모든 왕들’ correctly and smoothly attaches the participial qualifier to the kings. Moving the note marker directly after the idiom gives it an unambiguous anchor.
  terminology: ‘기브온,’ ‘여호수아,’ ‘길갈,’ ‘아모리 족속,’ and ‘종들’ are suitable conventional Korean biblical terms. ‘산지’ is a closer and more idiomatic equivalent for הָהָר than ‘산간지방.’ ‘구해 주시고 도와주십시오’ preserves the military-rescue sense of ישע while avoiding an unnecessarily narrowed doctrinal sense.
  issues:
  - severity: medium
    issue: The phrase ‘여호수아에게, 곧 길갈의 진영으로’ has an unclear syntactic relationship.
    rationale: The Hebrew means that the message was sent to Joshua at/to the camp at Gilgal. In Korean, ‘곧’ can make the camp sound like an apposition identifying Joshua.
  - severity: medium
    issue: ‘모든 왕들, 곧 산간지방에 사는 자들’ misattaches the hill-country descriptor.
    rationale: יֹשְׁבֵי הָהָר modifies ‘the kings of the Amorites’; it does not equate the kings with all inhabitants of the hill country.
  - severity: low
    issue: The footnote marker is placed at the end of the quotation rather than at the hand idiom it explains.
    rationale: The marker should immediately follow ‘손을 거두지 마십시오’ so that its lexical scope is clear.
  revised_text: 그리하여 기브온 사람들이 길갈의 진영에 있는 여호수아에게 전갈을 보내어 이렇게 말했습니다. 「당신의 종들에게서 손을 거두지 마십시오.[a] 우리에게 속히 올라오셔서 우리를 구해 주시고 도와주십시오. 산지에 사는 아모리 족속의 모든 왕들이 우리를 치려고 모여들었습니다.」
