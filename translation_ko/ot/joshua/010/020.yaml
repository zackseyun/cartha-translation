base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
  footnotes:
  - marker: a
    text: Hebrew literally, 'the survivors survived from them,' preserving a noun-verb repetition for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.' The main text preserves the Hebrew expression more closely.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아와 이스라엘 자손[a]이 그들을 매우 크게 쳐서 그들을 완전히 멸할 때까지 이르렀을 때, 그들 가운데 남은 자들이 남아[b] 요새 성읍들로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’을 ‘이스라엘 사람들’로 옮길 수도 있으나, 본문은 히브리어 표현을 더 직접적으로 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들 가운데 남은 자들이 남았다’는 명사와 동사의 반복을 사용해 강조합니다.
    reason: lexical_alternative
