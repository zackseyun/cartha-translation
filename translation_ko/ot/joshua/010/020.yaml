theological_decisions:
- issue: 살육(a) 표현의 강도
  chosen_reading: ‘매우 큰 살육’으로 직역성을 유지해 전쟁의 잔혹성과 본문의 평가를 약화시키지 않았습니다.
  alternative_readings:
  - 매우 큰 학살
  - 엄청난 살상
  - 매우 큰 패배
  rationale: 본문은 단순한 패배가 아니라 대규모 살육을 말하므로, 이를 완화하지 않는 것이 소스 충실성과 서술 효과에 맞습니다.
  doctrine_reference: 본문 맥락(가나안 정복 전쟁)의 서술적 의미
- issue: ‘살아남은 자들이 살아남아’ 반복
  chosen_reading: 히브리어의 중복 표현을 보존해, 소수 생존자가 간신히 빠져나간 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 남은 자들이 도망하여
  - 몇 사람이 살아서
  rationale: 원문은 단순 정보 전달보다 생존의 극적 강조를 담고 있으므로, 반복을 지워버리면 수사적 힘이 약해집니다.
  doctrine_reference: 원문 수사 보존 원칙
