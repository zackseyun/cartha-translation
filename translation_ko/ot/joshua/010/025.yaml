lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  english_pob_choice: And Joshua said to them
  chosen_korean: 여호수아가 그들에게 말했습니다
  alternatives_korean:
  - 그리고 여호수아가 그들에게 말했습니다
  - 여호수아가 그들에게 이르렀습니다
  lexicon: HALOT
  rationale: 연속 서술을 자연스럽게 살리되, 본문은 단순한 발화 동사이므로 현대 한국어에서 가장 직접적인 ‘말했습니다’를 택했습니다.
- source_word: אַל תִּירְאוּ וְאַל תֵּחָתּוּ
  english_pob_choice: Do not fear and do not be dismayed
  chosen_korean: 두려워하지 말고, 겁내지 마십시오
  alternatives_korean:
  - 무서워하지 말고, 낙심하지 마십시오
  - 두려워하지 말고, 당황하지 마십시오
  lexicon: HALOT
  rationale: 첫 동사는 פחד 계열의 일반적 금지를 자연스럽게 옮겨 ‘두려워하지 말고’로, 둘째 동사는 ‘깨지다/무너지다’의 뉘앙스를 살리면서 한국어에서 격려 문맥에 맞는 ‘겁내지 마십시오’로 옮겼습니다.
- source_word: חִזְקוּ וְאִמְצוּ
  english_pob_choice: Be strong and courageous
  chosen_korean: 강하고 담대하십시오
  alternatives_korean:
  - 강하고 용감하십시오
  - 강하고 굳세십시오
  lexicon: HALOT
  rationale: 여호수아에서 반복되는 결연한 격려 공식으로, ‘강하고 담대하다’가 두 요소를 모두 살리는 가장 관용적이면서도 직역에 가까운 표현입니다.
- source_word: כִּי כָכָה יַעֲשֶׂה יְהוָה
  english_pob_choice: for thus Yahweh will do
  chosen_korean: 왜냐하면 야훼께서 … 바로 그렇게 하실 것이기 때문입니다
  alternatives_korean:
  - 왜냐하면 야훼께서 … 그렇게 하실 것이기 때문입니다
  - 이는 야훼께서 … 이렇게 하실 것이기 때문입니다
  lexicon: HALOT
  rationale: ככה의 지시적 힘을 살려 ‘바로 그렇게’로 옮겼고, 원문의 미래적 약속을 분명히 하기 위해 ‘하실 것이기 때문입니다’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 규정에 따라 신명은 ‘야훼’로 옮겨, 본문이 언약 անուն을 직접 사용하고 있음을 드러냈습니다.
- source_word: אֹיְבֵיכֶם ... אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  english_pob_choice: to all your enemies against whom you are fighting
  chosen_korean: 여러분이 싸우고 있는 모든 적에게
  alternatives_korean:
  - 여러분이 싸우고 있는 모든 원수에게
  - 여러분이 싸우는 모든 적에게
  lexicon: HALOT
  rationale: ‘적/원수’ 중에서는 현대 한국어에서 중립적이면서도 본문의 대적 관계를 분명히 하는 ‘적’을 택했고, 전치사구는 자연스러운 한국어로 재구성했습니다.
