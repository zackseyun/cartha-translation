  language: ko
  text: 여호수아가 그들에게 말했습니다. “두려워하지 말고, 겁내지 마십시오. 강하고 담대하십시오. 왜냐하면 야훼께서 여러분이 싸우고 있는 모든 적에게 바로 그렇게 하실 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘두려워하지 말고 무너지지 마십시오.’
