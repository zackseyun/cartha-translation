lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  english_pob_choice: And Joshua said to them
  chosen_korean: 여호수아가 그들에게 말했습니다
  alternatives_korean:
  - 그리고 여호수아가 그들에게 말했습니다
