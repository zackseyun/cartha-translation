  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 앞에서 도망할 때, 그들이 벧호론 내리막에 있을 동안 야훼께서 하늘에서 큰 돌들을 그들 위에 던지시어, 그들은 죽었습니다. 이스라엘 자손이 칼로 죽인 사람들보다 우박 돌들로 죽은 사람이 더 많았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 자연스럽게는 ‘이스라엘 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 본문에 직접 나타난 여호와의 언약명을 한국어 표준 프로젝트 용례에 따라 야훼로 옮겼습니다.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  english_pob_choice: while they were on the descent of Beth-horon
  chosen_korean: 벧호론 내리막에 있을 동안
  alternatives_korean:
  - 벧호론의 비탈에서
  - 벧호론 내리막길에서
  lexicon: HALOT
  rationale: מוֹרַד는 단순한 위치보다 내려가는 경사/내리막을 가리키므로, 지형의 구체성을 살려 옮겼습니다.
- source_word: אֲבָנִים גְּדֹלֹות מִן הַשָּׁמַיִם
  english_pob_choice: large stones from heaven
  chosen_korean: 하늘에서 큰 돌들
  alternatives_korean:
  - 하늘로부터 큰 돌들
  - 하늘에서 큰 돌멩이들
  lexicon: HALOT
  rationale: 처음에는 일반적인 '돌들'로, 이어지는 '우박 돌들'과의 연결을 살리기 위해 직역에 가깝게 유지했습니다.
- source_word: בְּאַבְנֵי הַבָּרָד
  english_pob_choice: hailstones
  chosen_korean: 우박 돌들
  alternatives_korean:
  - 우박으로 떨어진 돌들
  - 우박
  lexicon: HALOT
  rationale: 앞의 '큰 돌들'이 곧 우박임을 드러내는 표현이므로, 한국어에서도 두 단계의 묘사를 모두 보존했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘인들
  lexicon: HALOT
  rationale: 히브리어의 친족/민족 표지를 유지하면서도 현대 한국어에서 자연스럽게 읽히는 전통적 민족칭을 사용했습니다.
theological_decisions:
- issue: 하늘에서 던져진 돌들의 정체를 어떻게 드러낼지
  chosen_reading: 본문의 첫 번째 묘사는 '큰 돌들', 뒤의 절은 그것이 '우박 돌들'임을 밝혀 두 단계를 모두 살렸습니다.
  alternative_readings:
  - 처음부터 '우박 돌들'로 통일하기
  - '''돌''만 남기고 우박 여부는 생략하기'
  rationale: 히브리어는 의도적으로 일반 명사에서 구체 명사로 나아가므로, 이를 평준화하지 않고 서술의 진행을 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: ‘이스라엘 앞에서’의 관계를 어떻게 처리할지
  chosen_reading: ‘이스라엘 앞에서 도망할 때’로 옮겨, מול/מִפְּנֵי의 대치·도피 상황을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 이스라엘 앞에서
  - 이스라엘의 면전에서
  rationale: 전투 서술에서 단순 위치보다 ‘적을 피해 달아남’의 상황성이 중요하므로, 한국어에서 오해가 적은 동사구로 풀었습니다.
  doctrine_reference: 서술 문맥 해석
