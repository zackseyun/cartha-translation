revisions:
- from: 이스라엘 앞에서 도망할 때, 그들이 벧호론 내리막에 있을 동안 야훼께서 하늘에서 큰 돌들을 그들 위에 던지시어, 그들은 죽었습니다. 이스라엘 자손이 칼로 죽인 사람들보다 우박 돌들로 죽은 사람이 더 많았습니다.[a]
  to: 이스라엘 앞에서 도망하던 그들이 벧호론의 내리막길을 내려가고 있을 때, 야훼께서 하늘에서 큰 돌들을 그들에게 아세가까지 던지셨고, 그들은 죽었습니다. 이스라엘 자손들이[a] 칼로 죽인 사람보다 우박에 맞아 죽은 사람이 더 많았습니다.
  rationale: 히브리어의 ‘큰 돌들’이라는 첫 묘사와 ‘우박’이라는 후속 식별을 유지하면서, 비자연적인 ‘우박 돌들’을 현대 한국어 관용 표현으로 고쳤습니다. 또한 벧호론의 내리막을 이동 경로로 자연스럽게 표현하고, 어휘 대안 각주를 ‘이스라엘 자손들’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:00Z'
