id: JOS.10.15
reference: Joshua 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב יְהוֹשֻׁ֨עַ֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
  footnotes:
  - marker: a
    text: A similar return-to-Gilgal statement appears in Joshua 10:43; some interpreters view this verse as anticipatory or textually displaced, but the Hebrew text here is translated as it stands.
    reason: textual_variant
translation:
  language: ko
  text: 그때 여호수아는 그와 함께한 온 이스라엘과 함께 길갈의 진영으로 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여호수아 10:43에도 비슷한 ‘길갈로 돌아감’ 진술이 나타납니다. 일부 해석자들은 이 구절을 예고문이나 본문 이동으로 보지만, 여기서는 히브리어 본문을 있는 그대로 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Then ... returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 돌아갔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 연속 서술을 살리면서, 이미 떠난 곳에서 다시 오게 되는 이동을 자연스럽게 표현했습니다.
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: and all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 모두
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살려 공동체 전체가 함께 움직였음을 간결하게 드러냈습니다.
- source_word: אֶל הַמַּחֲנֶה
  english_pob_choice: to the camp
  chosen_korean: 진영으로
  alternatives_korean:
  - 진영에
  - 야영지로
  lexicon: HALOT
  rationale: מַחֲנֶה는 군사적 야영·집결지를 뜻하므로, 문맥상 ‘진영’이 가장 적절합니다.
- source_word: הַגִּלְגָּלָה
  english_pob_choice: at Gilgal
  chosen_korean: 길갈의 진영
  alternatives_korean:
  - 길갈에 있는 진영
  - 길갈 진영
  lexicon: HALOT
  rationale: 지명 방향성은 한국어에서 ‘길갈의’로 풀어 주어, ‘진영’과의 결합을 자연스럽게 했습니다.
theological_decisions:
- issue: 본문의 반복 가능성과 장절 배치
  chosen_reading: 마소라 본문을 그대로 번역해, 10:43과의 유사성 문제를 본문에서 조정하지 않았습니다.
  alternative_readings:
  - 이 구절을 앞선 서술의 예고나 후대 이동 본문으로 정리하는 견해
  rationale: 본문의 전승된 형태를 우선 보존하는 것이 POB 원칙에 맞으며, 학술적 문제는 각주로만 최소한 반영하는 편이 적절합니다.
  doctrine_reference: 본문비평/문헌학적 처리 원칙
