  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'has made an alliance with.' The Hebrew verb can denote entering peaceful relations or treaty peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 올라와서 나를 도우십시오[a]. 그리고 우리가 기브온을 치게 하십시오[b]. 그것이 여호수아와 이스라엘 자손과 화친하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동맹을 맺었기’. 히브리어 동사는 평화 관계 또는 조약 관계에 들어감을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֽוּ אֵלַי
  english_pob_choice: Come up to me
  chosen_korean: 올라와서 나를 도우십시오
  alternatives_korean:
  - 저에게 올라오십시오
  - 나에게로 올라오십시오
  lexicon: HALOT
  rationale: 전투 상황에서의 ‘올라오다’라는 공간적 방향과 ‘나에게’라는 요청 대상을 함께 살리되, 한국어에서는 자연스럽게 이어지는 명령형으로 옮겼습니다.
- source_word: וְעִזְרֻנִי
  english_pob_choice: and help me
  chosen_korean: 나를 도우십시오
  alternatives_korean:
  - 나를 도와주십시오
  - 저를 도와주십시오
  lexicon: HALOT
  rationale: 직접적인 도움 요청을 현대적 공손체로 분명하게 옮겼습니다.
- source_word: וְנַכֶּה
  english_pob_choice: and let us strike
  chosen_korean: 그리고 우리가 ... 치게 하십시오
  alternatives_korean:
  - 그리고 우리가 공격하게 하십시오
  - 그리고 우리가 치겠습니다
  lexicon: HALOT
  rationale: 공동의 의지와 군사적 ‘치다’의 의미를 살리면서, 한국어에서는 ‘-게 하십시오’가 집단적 제안/촉구를 가장 자연스럽게 드러냅니다.
- source_word: הִשְׁלִימָה
  english_pob_choice: has made peace
  chosen_korean: 화친하였기
  alternatives_korean:
  - 평화를 맺었기
  - 동맹을 맺었기
  lexicon: HALOT
  rationale: שׁלם의 외교적 용법을 따라 ‘화친’으로 옮겨 평화 상태와 협정의 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 한국어 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 직역성을 유지하면서도 한국어 성서문체에서 자연스럽고, 본문의 역사적-언약적 집단을 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §4
