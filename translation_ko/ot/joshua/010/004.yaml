  rationale: 전투 상황에서의 ‘올라오다’라는 공간적 방향과 ‘나에게’라는 요청 대상을 함께 살리되, 한국어에서는 자연스럽게 이어지는 명령형으로 옮겼습니다.
- source_word: וְעִזְרֻנִי
  english_pob_choice: and help me
  chosen_korean: 나를 도우십시오
  alternatives_korean:
  - 나를 도와주십시오
  - 저를 도와주십시오
  lexicon: HALOT
  rationale: 직접적인 도움 요청을 현대적 공손체로 분명하게 옮겼습니다.
- source_word: וְנַכֶּה
  english_pob_choice: and let us strike
  chosen_korean: 그리고 우리가 ... 치게 하십시오
  alternatives_korean:
  - 그리고 우리가 공격하게 하십시오
  - 그리고 우리가 치겠습니다
  lexicon: HALOT
  rationale: 공동의 의지와 군사적 ‘치다’의 의미를 살리면서, 한국어에서는 ‘-게 하십시오’가 집단적 제안/촉구를 가장 자연스럽게 드러냅니다.
- source_word: הִשְׁלִימָה
  english_pob_choice: has made peace
  chosen_korean: 화친하였기
  alternatives_korean:
  - 평화를 맺었기
  - 동맹을 맺었기
  lexicon: HALOT
  rationale: שׁלם의 외교적 용법을 따라 ‘화친’으로 옮겨 평화 상태와 협정의 뉘앙스를 함께 보존했습니다.
theological_decisions:
