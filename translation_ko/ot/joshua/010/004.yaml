  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'has made an alliance with.' The Hebrew verb can denote entering peaceful relations or treaty peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 올라와 나를 도우십시오. 우리가 기브온을 칩시다. 기브온이 여호수아와 이스라엘 자손[a]과 화친하였기[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동맹을 맺었기’. 히브리어 동사는 평화 관계 또는 조약 관계에 들어감을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֽוּ אֵלַי
  english_pob_choice: Come up to me
  chosen_korean: 올라와서 나를 도우십시오
  alternatives_korean:
