revisions:
- from: 그때 여호수아가 야훼께 말했습니다. 야훼께서 이스라엘 자손 앞에 아모리 사람들을 넘겨주시던 날에, 그는 이스라엘이 보는 앞에서 말했습니다. 「해여, 기브온 위에서 멈추어라. 달아, 아얄론 골짜기에서 멈추어라.」[a][b][c]
  to: 그때, 야훼께서 아모리 사람들을 이스라엘 자손[a] 앞에 넘겨주신 날에 여호수아가 야훼께 아뢰었습니다. 그는 이스라엘이 보는 앞에서 말했습니다. 「해여, 기브온에서 멈추어라[b]. 달아, 아얄론 골짜기에서 멈추어라[c].」
  rationale: 시간 부사절을 여호수아의 발화 행위와 직접 결합하여 원문의 문장 구조를 회복했습니다. 기브온에 대한 전치사 표현은 상하 관계를 덧붙이지 않는 ‘기브온에서’로 조정했습니다. 또한 각주를 해당 표현에 직접 연결하고, 중복된 대안을 실제 어휘적 대안으로 고쳤습니다. 그 밖의 신명, 민족명, 지명 및 병렬 명령은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:03Z'
