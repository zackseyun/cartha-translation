  source_fidelity: 초안은 야훼께 말한 주체, 아모리 사람들을 이스라엘 자손 앞에 넘겨주신 때, 이스라엘이 보는 앞에서의 발언, 해와 달을 향한 병렬 명령을 대체로 충실히 옮겼습니다. 그러나 시간 부사절이 독립 문장 뒤에 놓여 원문의 결속 관계가 흐려지고, 기브온의 בְּ를 '위에서'로 한정하여 원문의 넓은 공간적 표현보다 구체화했습니다.
