  source_fidelity: 원문의 이동 동사 ‘돌아오다/돌아가다’, 동반 표현 ‘그와 함께한 온 이스라엘’, 목적지 드빌, 그리고 ‘그 성읍을 향해 싸우다’라는 전투 서술을 유지해야 합니다. 초안의 ‘데빌’은 통용되는 성경 지명 표기와 맞지 않습니다.
  naturalness: ‘그것과 싸웠습니다’는 한국어에서 성읍을 가리키는 표현으로 다소 부자연스럽고 지시 대상도 불명확합니다. ‘그 성읍과 싸웠습니다’가 자연스럽고 명료합니다. ‘돌아가서’는 연속된 서술에 자연스럽습니다.
  terminology: Debir는 표준 성경 지명 표기인 ‘드빌’로 써야 합니다. ‘여호수아’, ‘이스라엘’, ‘성읍’은 현대 한국어 성경 문체에서 적절합니다.
