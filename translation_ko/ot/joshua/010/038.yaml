base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
  footnotes:
  - marker: a
    text: Hebrew 'against her,' referring to the city Debir with a feminine grammatical form; English idiom uses 'it' for a city here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아와 그와 함께한 온 이스라엘이 데빌로 돌아와, 그것과 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 성읍을 여성형 대명사로 받지만, 한국어에서는 도시를 보통 중성적으로 처리합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 다시 갔습니다
  lexicon: HALOT
  rationale: בוש의 서사적 완료형은 이동 맥락에서 ‘돌아가다’의 뜻이므로, 현대 한국어에서 자연스럽고 간결한 ‘돌아와’로 옮겼습니다.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  english_pob_choice: and all Israel with him
  chosen_korean: 그와 함께한 온 이스라엘
  alternatives_korean:
  - 그와 함께한 모든 이스라엘
  - 그와 함께한 이스라엘 전체
  lexicon: HALOT
  rationale: 집합적 표현을 살리기 위해 ‘온 이스라엘’로 옮기고, עִמּוֹ의 동반 관계는 ‘그와 함께한’으로 분명히 했습니다.
- source_word: דְּבִרָה
  english_pob_choice: to Debir
  chosen_korean: 데빌로
  alternatives_korean:
  - 데비르로
  - 드비라로
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 관행에 따라 표기하되, 본문 흐름상 목적지를 나타내는 조사 ‘-로’를 사용했습니다.
- source_word: עָלֶיהָ
  english_pob_choice: against it
  chosen_korean: 그것과 싸웠습니다
  alternatives_korean:
  - 그것을 대적해 싸웠습니다
  - 그 성읍을 치고 싸웠습니다
  lexicon: HALOT
  rationale: 히브리어 여성형 대명사는 성읍을 가리키지만 한국어에서는 도시를 ‘그것’으로 받는 것이 자연스러워, ‘싸우다’의 전쟁 맥락을 유지하면서도 성별을 드러내지 않았습니다.
theological_decisions:
- issue: 전쟁 서술의 직접성
  chosen_reading: 완곡하게 바꾸지 않고 ‘싸웠습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 전쟁을 벌였습니다
  - 공격했습니다
  rationale: 본문은 여호수아의 군사 행동을 단순 서술하므로, 의미를 약화시키거나 해설을 덧붙이지 않고 서술 동사를 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 내러티브 충실성
