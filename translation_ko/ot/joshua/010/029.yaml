source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'fought with Libnah'; the idiom means fighting against the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아와 그와 함께 있던 온 이스라엘은 막게다에서 립나로 나아가 립나와 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘립나와 싸웠다’라고 합니다. 여기서 ‘~와 싸우다’는 그 대상을 적으로 삼아 싸우는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed on
  chosen_korean: 지나가서
  alternatives_korean:
  - 건너가서
  - 옮겨가서
  - 가서
  lexicon: HALOT
  rationale: 문맥상 한 성읍에서 다음 성읍으로 이동하는 흐름이므로, 단순한 이동을 자연스럽게 드러내는 ‘지나가서’가 가장 적절합니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께한
  alternatives_korean:
  - 그와 함께 있는
  - 그와 동행한
  lexicon: HALOT
  rationale: 히브리어의 동반 관계를 한국어 관용에 맞게 살리되, 여호수아를 중심으로 이스라엘이 함께 움직인다는 점을 분명히 했습니다.
- source_word: מִמַּקֵּדָה לִבְנָה
  english_pob_choice: from Makkedah to Libnah
  chosen_korean: 막게다에서 립나로
  alternatives_korean:
  - 막게다에서 립나까지
  - 막게다로부터 립나로
  lexicon: HALOT
  rationale: 출발점과 도착점을 나타내는 מן + ל 구조를 한국어의 ‘에서 …로’로 직역성 있게 옮겼습니다.
- source_word: וַיִּלָּחֶם עִם לִבְנָה
  english_pob_choice: fought against Libnah
  chosen_korean: 립나와 싸웠습니다
  alternatives_korean:
  - 립나를 치고 싸웠습니다
  - 립나를 대항하여 싸웠습니다
  lexicon: HALOT
  rationale: לחם עם의 관용적 적대 관계를 한국어에서는 ‘~와 싸우다’로 자연스럽게 표현할 수 있어, 군사적 대립을 그대로 드러냈습니다.
