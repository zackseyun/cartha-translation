  issues:
  - severity: low
    issue: ‘지나가서’의 이동 의미가 다소 모호함
    rationale: 한국어 ‘지나가다’는 특정 장소를 거쳐 통과한다는 뜻으로도 흔히 쓰입니다. 본문은 막게다를 떠나 립나로 이동해 전투한 흐름이므로 ‘나아가’가 더 명료합니다.
  - severity: low
    issue: ‘그와 함께한’의 수식이 다소 부자연스러움
    rationale: 사람 집단의 동반 상태는 ‘그와 함께 있던’ 또는 ‘그와 함께한’ 모두 가능하나, 전자가 이 문맥에서 더 자연스럽게 읽힙니다.
