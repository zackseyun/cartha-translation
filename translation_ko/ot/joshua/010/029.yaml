  source_fidelity: ‘지나가서’는 목적지인 립나에 이르는 이동을 ‘통과하다’로도 읽히게 할 수 있어, 한 성읍에서 다음 성읍으로 이동하는 히브리어 ויעבר의 문맥상 의미를 더 정확히 드러내는 표현으로 다듬는 것이 좋습니다. ‘립나와 싸웠습니다’는 לחם עם의 적대적 용법을 자연스럽게 반영합니다.
  naturalness: ‘그와 함께한 온 이스라엘’보다 ‘그와 함께 있던 온 이스라엘’이 현대 표준 한국어에서 더 자연스럽고, ‘막게다에서 립나로 나아가’가 군사 이동 서술에도 적절합니다.
