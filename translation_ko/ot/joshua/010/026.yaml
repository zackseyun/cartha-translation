  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
  footnotes:
  - marker: a
    text: Or 'hung them.' The Hebrew verb refers to suspending bodies on wood/tree; 'impaled them' is a possible but less certain rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후 여호수아는 그들을 쳐서 죽이고, 다섯 그루의 나무에 매달았습니다.[a] 그들은 저녁까지 그 나무들에 매달려 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 시신을 나무나 목재에 매다는 것을 가리킵니다. 여기서는 ‘매달다’가 가장 직접적인 번역이며, ‘꿰뚫어 세우다’로 옮길 가능성도 있으나 덜 확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  english_pob_choice: struck them down
  chosen_korean: 쳐서
  alternatives_korean:
  - 쳐서 쓰러뜨리고
  - 때려눕히고
  - 쳤고
  lexicon: HALOT
  rationale: נכה의 강한 타격을 살리되, 바로 뒤의 '죽이고'와 중복되지 않도록 한국어에서는 간결하게 '쳐서'로 옮겼습니다.
- source_word: וַיְמִיתֵם
  english_pob_choice: put them to death
  chosen_korean: 죽이고
  alternatives_korean:
  - 사형에 처하고
  - 목숨을 끊고
  - 죽였고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 보존하면서도, 처형 맥락에서는 '죽이고'가 가장 자연스럽고 직접적입니다.
- source_word: עַל חֲמִשָּׁה עֵצִים
  english_pob_choice: on five trees
  chosen_korean: 다섯 나무에
  alternatives_korean:
  - 다섯 그루 나무에
  - 다섯 나무 위에
  - 다섯 목재 기둥에
  lexicon: HALOT
  rationale: עֵץ의 기본 의미인 '나무/목재'를 따르며, 본문이 구체적 처형 도구를 더 특정하지 않으므로 '나무'를 유지했습니다.
- source_word: וַיִּהְיוּ תְּלוּיִם
  english_pob_choice: they remained hanging
  chosen_korean: 매달려 있었습니다
  alternatives_korean:
  - 매달려 있었습니다
  - 걸려 있었습니다
  - 계속 매달려 있었습니다
  lexicon: HALOT
  rationale: היה+분사형의 지속 상태를 한국어의 서술형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: עֵץ를 한국어에서 어떻게 보존할지
  chosen_reading: '''나무''로 직역에 가깝게 유지했습니다.'
  alternative_readings:
  - '''목재 기둥''으로 구체화'
  - '''형틀''로 의역'
  rationale: 본문은 처형 장치의 후대적 이미지를 요구하지 않으며, 원문이 말하는 '나무/목재'의 평이한 의미를 그대로 드러내는 편이 소스 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
