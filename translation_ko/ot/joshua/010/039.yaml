  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
  footnotes:
  - marker: a
    text: Or 'they utterly destroyed'; Hebrew 'they devoted to destruction,' using ḥerem language for something placed under total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것과 그 왕과 그 안에 있는 모든 성읍들을 점령하고, 칼날로 그들을 쳤으며, 그 안에 있는 모든 사람을 진멸하였습니다. 살아남은 자는 하나도 남기지 않았습니다. 그가 헤브론에 행한 것과 같이, 디브르와 그 왕에게도 그렇게 하였고, 또한 그가 립나와 그 왕에게 행한 것과 같이 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 완전히 멸하였습니다’; 히브리어는 ḥerem, 곧 전적으로 파멸에 바쳐진 대상을 가리키는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: they captured it
  chosen_korean: 그들은 그것을 점령하고
  alternatives_korean:
  - 그들은 그것을 포로로 잡고
  - 그들은 그것을 사로잡고
  lexicon: HALOT
  rationale: 전쟁 서술에서 לכד는 성읍을 군사적으로 점령하는 뜻이므로, 한국어에서는 ‘점령하다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: וְאֶת כָּל עָרֶיהָ
  english_pob_choice: all its towns
  chosen_korean: 그 안에 있는 모든 성읍들
  alternatives_korean:
  - 그 안의 모든 마을들
  - 그의 모든 성읍들
  lexicon: HALOT
  rationale: עיר는 여기서 도시/성읍의 행정적 거점을 가리키므로 ‘성읍들’이 원문에 가깝고, 주격 수식을 위해 ‘그 안에 있는’으로 풀었습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 입으로
  - 칼 끝으로
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 살리되 한국어에서 어색하지 않게, ‘칼의 입’보다 자연스러운 ‘칼날로’를 택했습니다.
- source_word: וַיַּחֲרִימוּ
  english_pob_choice: they devoted to destruction
  chosen_korean: 진멸하였습니다
  alternatives_korean:
  - 저주 아래 두었습니다
  - 완전히 멸하였습니다
  lexicon: HALOT
  rationale: חרם의 기술적 의미를 살리면서도 한국어 본문에서 과도한 설명을 피하려고, POB의 ‘devoted to destruction’에 대응하는 ‘진멸하다’를 사용했습니다.
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person who was in it
  chosen_korean: 그 안에 있는 모든 사람
  alternatives_korean:
  - 그 안에 있는 모든 혼
  - 그 안에 있는 모든 생명
  lexicon: HALOT
  rationale: נפש는 여기서 비물질적 ‘혼’이 아니라 거주민을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘사람’으로 옮겼습니다.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  english_pob_choice: he left no survivor
  chosen_korean: 살아남은 자는 하나도 남기지 않았습니다
  alternatives_korean:
  - 생존자를 하나도 남기지 않았습니다
  - 남은 자를 하나도 두지 않았습니다
  lexicon: HALOT
  rationale: שָׂרִיד는 ‘남은 자/생존자’이므로, 한국어에서는 자연스러운 결과 진술인 ‘살아남은 자는 하나도 남기지 않았다’로 표현했습니다.
theological_decisions:
- issue: ḥerem 전쟁 표현의 강도
  chosen_reading: 진멸하였습니다
  alternative_readings:
  - 완전히 멸하였습니다
  - 저주 아래 두었습니다
  rationale: 원문의 חרם은 단순 파괴가 아니라 여호와께 바쳐진 파멸의 처분을 뜻하므로, 의미를 약화하지 않는 선에서 ‘진멸’로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 문장의 주어 및 동사 수 일치
  chosen_reading: 복수 주어와 단수 결과 진술을 각각 유지함
  alternative_readings:
  - 모든 동사를 복수로 평준화함
  - 모든 동사를 단수로 평준화함
  rationale: 히브리어는 이 절에서 복수 동사와 단수 동사를 함께 사용하므로, 서술의 결을 유지하기 위해 한국어도 앞부분의 복수 행위와 뒤의 결과 진술을 구분했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
