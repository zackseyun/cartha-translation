id: JOS.7.19
reference: Joshua 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
  footnotes:
  - marker: a
    text: Or 'and give him thanks,' or in this context possibly 'make confession to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여호수아가 아간에게 말했습니다. “내 아들아, 부디 야훼, 이스라엘의 하나님께 영광을 돌리고 그분께 감사하십시오.[a] 부디 네가 한 일을 내게 말하십시오. 내게 숨기지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분께 찬양을 드리십시오’; 이 문맥에서는 ‘그분께 고백하십시오’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아이야
  - 내 자녀야
  lexicon: HALOT
  rationale: 친밀하면서도 권면하는 아버지 같은 호칭을 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: שִׂים נָא כָבוֹד
  english_pob_choice: please give glory
  chosen_korean: 이제 청하건대 … 영광을 돌리고
  alternatives_korean:
  - 청하건대 … 영광을 드리고
  - 부디 … 영광을 돌리고
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 표현인 '영광을 돌리다'로 옮기되, נָא의 간청 어감을 '청하건대'로 반영했습니다.
- source_word: וְ/תֶן ל֣/וֹ תוֹדָ֑ה
  english_pob_choice: and give him praise
  chosen_korean: 그분께 감사하십시오
  alternatives_korean:
  - 그분께 찬양하십시오
  - 그분께 감사를 드리십시오
  - 그분께 고백하십시오
  lexicon: HALOT
  rationale: תוֹדָה는 문맥상 감사/찬양/고백의 여지가 있으나, 본문 흐름이 죄를 인정하도록 이끄는 진술이어서 하나님께 드리는 응답으로서 '감사'를 택했습니다. 다만 한국어 본문에서는 자연스러운 공손체로 정리했습니다.
- source_word: וְ/הַגֶּד נָ֥א לִ/י
  english_pob_choice: Please tell me
  chosen_korean: 이제 네가 한 일을 내게 말하고
  alternatives_korean:
  - 부디 내게 말하고
  - 청하건대 내게 알리고
  lexicon: HALOT
  rationale: נגד의 명령형은 '말하다/알리다'로 충분하며, 바로 뒤의 내용이 무엇인지 밝히므로 목적절을 자연스럽게 풀어 옮겼습니다.
- source_word: אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי
  english_pob_choice: do not hide it from me
  chosen_korean: 내게서 숨기지 마라
  alternatives_korean:
  - 내게서 감추지 마라
  - 내 앞에서 숨기지 마라
  lexicon: HALOT
  rationale: כחד의 핵심 의미인 '숨기다/감추다'를 유지하면서, 한국어에서는 '내게서 숨기지 마라'가 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 학술적 전사인 '야훼'로 표기하여 원문 식별성을 유지했습니다.
  doctrine_reference: Project glossary default
