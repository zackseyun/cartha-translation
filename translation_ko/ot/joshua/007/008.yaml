id: JOS.7.8
reference: Joshua 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
  footnotes:
  - marker: a
    text: Or 'what shall I say?'
    reason: lexical_alternative
  - marker: b
    text: Literally 'has turned back/neck before its enemies,' a Hebrew idiom for retreating in defeat.
    reason: cultural_note
translation:
  language: ko
  text: “부디, 주님, 이스라엘이 원수들 앞에서 등을 돌린 후에[b] 제가 무엇을 말할 수 있겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제가 무엇을 말하겠습니까?’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘원수들 앞에서 등을 돌리다’는 전투에서 패주하거나 물러서다를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 청컨대
  - 제발
  - 간청하옵나이다
  lexicon: HALOT
  rationale: 상대에게 드리는 간청의 입자이므로, 현대 합쇼체에서 자연스럽고 공손한 ‘부디’로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT
  rationale: 하나님께 직접 드리는 호칭이므로, 한국어 성경에서 익숙한 경외적 호칭인 ‘주님’으로 옮겼습니다.
- source_word: מָה אֹמַר
  english_pob_choice: what can I say
  chosen_korean: 제가 무엇을 말하겠습니까
  alternatives_korean:
  - 제가 무엇이라 말하겠습니까
  - 무엇을 말해야 합니까
  - 무엇을 말할 수 있겠습니까
  lexicon: HALOT
  rationale: 직역의 ‘무엇을 말하리이까’보다, 절망적 탄원의 뉘앙스를 살린 현대 합쇼체 질문으로 옮겼습니다.
- source_word: הָפַךְ יִשְׂרָאֵל עֹרֶף
  english_pob_choice: has turned its back
  chosen_korean: 이스라엘이 자기의 원수들 앞에서 등을 돌렸는데
  alternatives_korean:
  - 이스라엘이 원수들 앞에서 등을 보였는데
  - 이스라엘이 원수들 앞에서 물러났는데
  lexicon: HALOT
  rationale: ‘등/목덜미를 돌리다’의 전쟁 관용구를 한국어의 자연한 표현인 ‘등을 돌리다’로 옮겨, 패주/후퇴의 의미를 분명히 했습니다.
- source_word: אֹיְבָיו
  english_pob_choice: its enemies
  chosen_korean: 원수들
  alternatives_korean:
  - 그의 원수들
  - 그들의 원수들
  lexicon: HALOT
  rationale: 이스라엘을 집합체로 보는 문맥에서 ‘자기의 원수들’ 또는 간결한 ‘원수들’이 자연스러워, 집합적 대상을 드러내는 쪽을 택했습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호칭의 문체
  chosen_reading: ‘주님’으로 번역하고 전체 문장을 합쇼체로 유지하되, 탄원 표지 ‘부디’를 앞에 두어 절박한 기도를 드러냈습니다.
  alternative_readings:
  - ‘주여’
  - ‘내 주님’
  - 더 고어적인 기도체
  rationale: 본문은 예배문이 아니라 전투 패배 뒤의 탄원입니다. 현대 독자가 즉시 이해할 수 있는 경외적 호칭과 문체가 원문의 절박함을 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: 직접 호칭은 존대, 문체는 현대 표준어 합쇼체 유지'
- issue: 전쟁 관용구 ‘turned back/neck before its enemies’
  chosen_reading: 직역된 신체어보다 ‘등을 돌렸다’로 관용구를 재현해 패배와 후퇴의 함의를 살렸습니다.
  alternative_readings:
  - ‘목덜미를 돌렸다’
  - ‘뒤를 보였다’
  - ‘물러났다’
  rationale: 히브리어 표현은 단순한 방향 전환이 아니라 전투에서의 패주를 뜻하는 관용구이므로, 의미 기능을 살리는 번역이 필요합니다.
  doctrine_reference: 본문 의미 보존과 관용구 처리 원칙
