id: JOS.7.17
reference: Joshua 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
  footnotes:
  - marker: a
    text: Or 'by the men.' The Hebrew likely means the Zerahite clan was brought forward individually, man by man.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 유다의 씨족을 앞으로 나오게 하였고, 세라 사람의 씨족이 뽑혔습니다. 그러자 그는 세라 사람의 씨족을 사람마다 앞으로 나오게 하였고, 잡디가 뽑혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 세라 사람의 씨족이 사람별로, 곧 한 사람씩 앞으로 나오게 되었음을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: he brought near
  chosen_korean: 앞으로 나오게 하였습니다
  alternatives_korean:
  - 가까이 나오게 하였습니다
  - 앞으로 불러냈습니다
  - 가까이 불러들였습니다
  lexicon: HALOT
  rationale: 선별 절차에서 집단을 앞으로 불러 세우는 뜻을 살리되, 한국어에서 자연스럽게 읽히는 행정적·서술적 표현으로 옮겼습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: clan
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 족속
  - 종족
  lexicon: HALOT
  rationale: 지파 아래의 친족 단위를 가리키므로 ‘씨족’이 ‘family’보다 구조를 더 분명히 드러냅니다.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  english_pob_choice: was taken
  chosen_korean: 뽑혔습니다
  alternatives_korean:
  - 잡혔습니다
  - 선택되었습니다
  - 붙들렸습니다
  lexicon: HALOT
  rationale: 여기서는 군사적 ‘포로로 잡힘’이 아니라 제비뽑기/선별 과정에서 특정 집단이 지목된 결과이므로, 결과적으로 ‘뽑히다’가 가장 오해가 적습니다.
- source_word: לַ/גְּבָרִים
  english_pob_choice: man by man
  chosen_korean: 사람마다
  alternatives_korean:
  - 남자마다
  - 한 사람씩
  - 사람 한 사람씩
  lexicon: HALOT
  rationale: 히브리어의 분배적 의미를 자연스러운 한국어로 옮기되, 개인 단위로 차례차례 불러 세우는 절차를 드러내기 위해 ‘사람마다’로 처리했습니다.
theological_decisions:
- issue: ‘was taken’의 절차적/신적 선별 의미
  chosen_reading: 본문의 ‘뽑혔습니다’는 단순한 우연이나 물리적 체포가 아니라, 하나님이 드러내시는 선별 절차의 결과로 읽히도록 했습니다.
  alternative_readings:
  - 잡혔습니다
  - 선택되었습니다
  rationale: 앞 문맥의 제비뽑기적 조사 과정과 어울리며, 독자가 사건을 우연이 아닌 판별·드러남의 과정으로 이해하게 합니다.
  doctrine_reference: 하나님의 주권적 인도와 드러내심
