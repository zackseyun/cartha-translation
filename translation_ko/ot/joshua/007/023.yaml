  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
  footnotes:
  - marker: a
    text: Or 'they poured them out before the LORD.' The Hebrew verb can literally mean 'pour out,' but here likely refers to laying out the recovered items in the LORD's presence.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel'; alternatively, 'Israelites.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'before Yahweh.' The divine name יְהוָה is rendered 'the LORD' in keeping with the project's standard practice.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 그 물건들을 천막 안에서 가져다가, 여호수아와 이스라엘 모든 자손에게로 가져왔으며, 그것들을 야훼 앞에 놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 야훼 앞에 쏟아 놓았습니다.’ 히브리어 동사 יצק은 문자적으로 ‘붓다/쏟다’라는 뜻도 있지만, 여기서는 물건을 꺼내어 야훼 앞에 진열하는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이스라엘의 아들들’입니다. 문맥상 ‘이스라엘 모든 자손’은 형식적인 집합 표현을 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 본문은 야훼의 이름 יְהוָה를 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקָּחוּם / מִתּוֹךְ הָאֹהֶל
  english_pob_choice: they took them from inside the tent
  chosen_korean: 그 물건들을 천막 안에서 가져다가
  alternatives_korean:
  - 천막 속에서 가져다가
  - 천막 안에서 꺼내어
  lexicon: HALOT
  rationale: לקח의 기본 의미는 여기서 ‘가져가다/가져오다’가 자연스럽고, מִתּוֹךְ는 단순히 ‘천막에서’보다 ‘천막 안에서’가 내부 출처를 더 분명히 드러냅니다.
- source_word: וַיְבִאוּם
  english_pob_choice: brought them
  chosen_korean: 가져왔으며
  alternatives_korean:
  - 데려왔으며
  - 운반해 왔으며
  lexicon: HALOT
  rationale: הביא는 문맥상 단순한 이동을 뜻하므로, 과도한 의례적 뉘앙스 없이 ‘가져오다’로 옮기는 것이 적절합니다.
- source_word: וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to all the sons of Israel
  chosen_korean: 이스라엘 모든 자손에게로
  alternatives_korean:
  - 이스라엘 모든 사람에게로
  - 이스라엘 백성에게로
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 형식적 표현을 살려 ‘이스라엘 모든 자손’으로 옮겼고, ‘에게로’는 반복된 אֶל의 방향성을 반영합니다.
- source_word: וַיַּצִּקֻם לִפְנֵי יְהוָה
  english_pob_choice: they laid them out before Yahweh
  chosen_korean: 그것들을 야훼 앞에 놓았습니다
  alternatives_korean:
  - 그것들을 야훼 앞에 펼쳐 놓았습니다
  - 그것들을 야훼 앞에 쏟아 놓았습니다
  lexicon: HALOT
  rationale: יצק은 문자적으로 ‘붓다’일 수 있지만, 여기서는 회수한 물건을 여호와의 임재 앞에 두는 장면이므로 ‘놓다’가 가장 자연스럽고 문맥에 충실합니다.
theological_decisions:
- issue: יהוה / YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 표준에 따라 제목어 ‘주’로 바꾸지 않고 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
