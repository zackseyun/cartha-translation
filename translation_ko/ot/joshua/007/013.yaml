  source_fidelity: 원문의 명령 구조와 חֵרֶם의 핵심 의미는 대체로 반영되었으나, ‘너희 가운데 이스라엘에’는 히브리어의 호격 ‘이스라엘’을 잘못 연결하여 한국어 문장과 원문의 خطاب 구조를 모두 훼손합니다. חֵרֶם은 단순히 ‘진멸할 것’이라기보다 진멸을 위해 바쳐진 대상으로 명시하는 편이 안전합니다.
  naturalness: 초안의 ‘너희 가운데 이스라엘에’는 비문입니다. 또한 직접 인용 안의 선언문을 합쇼체로 일관되게 처리하고, ‘그들에게 이렇게 말하십시오’로 인용 도입을 자연스럽게 정리할 필요가 있습니다.
  terminology: 야훼는 프로젝트 방침과 일치합니다. קָדַשׁ의 명령과 재귀 명령은 ‘성별하십시오/스스로를 성별하십시오’로 통일하여 어휘적 연관성과 의례적 준비의 뜻을 보존했습니다. חֵרֶם은 ‘진멸하도록 바쳐진 것’으로 옮기고 주석에서 불가역적 봉헌과 심판의 의미를 설명합니다.
