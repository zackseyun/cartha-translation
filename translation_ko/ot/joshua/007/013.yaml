source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
  footnotes:
  - marker: a
    text: Hebrew חֵרֶם (cherem), traditionally 'the ban' or 'the devoted thing'; the term denotes something placed under irrevocable dedication, here for destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나 백성을 성별하십시오. 그들에게 이렇게 말하십시오. ‘내일을 위해 스스로를 성별하십시오. 이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. 이스라엘아, 너희 가운데 진멸하도록 바쳐진 것이 있습니다[a]. 너희가 너희 가운데서 진멸하도록 바쳐진 것을 제거하기 전에는 너희 원수들 앞에 설 수 없습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵרֶם(헤렘)은 전통적으로 ‘진멸’ 또는 ‘바친 것’으로 옮깁니다. 이 말은 돌이킬 수 없이 바쳐져, 여기서는 진멸의 심판 아래 놓인 대상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  english_pob_choice: Get up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나
  - 일어나십시오
  lexicon: HALOT
  rationale: 즉각적인 행동을 촉구하는 명령으로 보고, 한국어에서는 자연스럽고 긴박한 첫 동사를 살려 ‘일어나서’로 옮겼습니다.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  english_pob_choice: consecrate / Consecrate yourselves
  chosen_korean: 거룩하게 하십시오 / 스스로를 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오 / 스스로 성별하십시오
  - 성화하십시오 / 스스로 성화하십시오
  lexicon: HALOT
  rationale: 같은 어근의 명령형과 재귀형을 한국어에서도 연결되게 살리기 위해 ‘거룩하게 하다’ 계열을 사용했습니다. ‘성별하다’도 가능하지만 현대 독자에게는 덜 자연스럽습니다.
- source_word: חֵרֶם
  english_pob_choice: something devoted to destruction / the thing devoted to destruction
  chosen_korean: 진멸할 것
  alternatives_korean:
  - 바쳐진 것
  - 진멸된 것
  - 저주받은 것
  lexicon: HALOT
  rationale: POB가 설명한 חרם의 핵심을 한국어로 드러내기 위해, 단순한 ‘바쳐진 것’보다 심판과 파괴의 함의를 살린 ‘진멸할 것’으로 옮겼습니다. 첫 등장과 재등장 모두 같은 실체를 가리키도록 일관되게 처리했습니다.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶי/ךָ
  english_pob_choice: You cannot stand before your enemies
  chosen_korean: 너희가 원수들 앞에 설 수 없습니다
  alternatives_korean:
  - 너희가 원수들 앞에 맞설 수 없습니다
  - 너희가 원수들 앞에 버틸 수 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 ‘서다’로 살려, 단순한 신체적 자세가 아니라 대적하여 견디지 못함을 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사인 여호와의 이름을 제목형 대체어로 숨기지 않고, 프로젝트 기본값대로 ‘야훼’로 옮겨 원문의 투명성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 백성 전체를 향한 2인칭 표현
  chosen_reading: 너희
  alternative_readings:
  - 당신들
  - 여러분
  rationale: 히브리어의 단수-복수 전환과 공동체적 호소를 한국어에서 자연스럽게 드러내기 위해 복수 2인칭 ‘너희’를 유지했습니다.
  doctrine_reference: 히브리어 본문의 공동체 خطاب 구조
