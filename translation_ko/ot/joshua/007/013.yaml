revisions:
- from: 일어나서 백성을 거룩하게 하십시오. 그리고 그들에게 말하십시오. ‘내일을 위해 스스로를 거룩하게 하십시오. 이는 야훼, 이스라엘의 하나님께서 이렇게 말씀하시기 때문입니다. 너희 가운데 이스라엘에 진멸할 것이 있습니다. 너희가 그 진멸할 것을 너희 가운데서 제거하기 전에는 너희가 원수들 앞에 설 수 없습니다.’[a]
  to: 일어나 백성을 성별하십시오. 그들에게 이렇게 말하십시오. ‘내일을 위해 스스로를 성별하십시오. 이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. 이스라엘아, 너희 가운데 진멸하도록 바쳐진 것이 있습니다[a]. 너희가 너희 가운데서 진멸하도록 바쳐진 것을 제거하기 전에는 너희 원수들 앞에 설 수 없습니다.’
  rationale: 호격 ‘이스라엘’을 ‘이스라엘아’로 바로잡아 원문의 직접 호소를 보존했습니다. חֵרֶם은 파괴만이 아니라 불가역적 봉헌을 뜻하므로 ‘진멸하도록 바쳐진 것’으로 번역하고, 첫 언급에 주석 표지를 붙였습니다. 성별 관련 두 명령은 동일한 한국어 어휘로 통일했으며, 전체를 현대 표준어 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:20Z'
