  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
  footnotes:
  - marker: a
    text: Or, more formally, 'have taken from the devoted things' or 'have taken from the ban.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have also deceived' / 'have also denied it.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'among their vessels/articles'; the phrase refers to hiding the items among their possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 죄를 지었습니다[a]. 그들은 내가 그들에게 명령한 내 언약도 어겼고, 또 멸망에 바쳐진 것 가운데서도 가져갔으며, 또 훔쳤고, 또 속였고[b], 또 자기들의 물건 사이에 그것을 두었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘멸망에 바쳐진 것 가운데서 가져갔다’ 또는 ‘금지된 것 가운데서 가져갔다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘속였다’ 외에 ‘부인했다’는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘자기들의 기구/그릇들’이지만, 여기서는 물건들 사이에 숨겨 두었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  english_pob_choice: has sinned
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 죄를 범했습니다
  - 죄를 지었습니다
  lexicon: HALOT
  rationale: 죄라는 결과를 분명히 드러내면서도, 본문의 직접적 비난을 약화하지 않는 가장 자연스러운 현대 한국어 표현입니다.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  english_pob_choice: have transgressed my covenant
  chosen_korean: 내 언약도 어겼고
  alternatives_korean:
  - 내 언약을 범했고
  - 내 언약을 깨뜨렸고
  lexicon: HALOT
  rationale: ‘어기다’는 규범·언약을 위반했다는 뜻을 직접 전달하며, ‘언약’의 계약적 무게를 유지합니다.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  english_pob_choice: have taken some of what was devoted to destruction
  chosen_korean: 멸망에 바쳐진 것 가운데서도 가져갔으며
  alternatives_korean:
  - 진멸에 바쳐진 것 가운데서도 가져갔으며
  - 금지된 것 가운데서도 가져갔으며
  lexicon: HALOT
  rationale: חֵרֶם의 의미를 살리기 위해 단순한 ‘금지된 것’보다 ‘멸망에 바쳐진 것’이 더 직접적이며, 문맥상 전리품이 아니라 바쳐진 대상임을 드러냅니다.
- source_word: כִּחֲשׁוּ
  english_pob_choice: have also deceived
  chosen_korean: 또 속였고
  alternatives_korean:
  - 또 거짓말했고
  - 또 부인했고
  - 또 속였고
  lexicon: HALOT
  rationale: 이 동사는 거짓·기만·부인의 뉘앙스를 모두 가질 수 있으므로, 본문이 고발하는 윤리적 성격을 포괄하는 ‘속이다’를 택했습니다.
- source_word: בִכְלֵיהֶם
  english_pob_choice: among their own belongings
  chosen_korean: 자기들의 물건 사이에
  alternatives_korean:
  - 자기들의 그릇들 사이에
  - 자기들의 소지품 사이에
  lexicon: HALOT
  rationale: כְּלִים은 넓게 물건·도구·그릇을 뜻하므로, 감추어 둔 장소의 의미를 자연스럽게 드러내는 ‘물건 사이에’가 적절합니다.
theological_decisions:
- issue: 집단적 책임을 이스라엘에 그대로 귀속하는가
  chosen_reading: 주어를 ‘이스라엘’로 유지하고 복수 동사 흐름도 그대로 살려, 개인화하지 않았습니다.
  alternative_readings:
  - 아간 개인의 죄로 좁혀 옮김
  rationale: 본문은 언약 공동체 전체를 죄의 주체로 말하므로, 개인적 설명으로 완화하면 본문의 언약적 긴장이 사라집니다.
  doctrine_reference: 언약 공동체의 연대 책임을 보존
