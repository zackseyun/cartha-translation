base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
  footnotes:
  - marker: a
    text: Or “thus and thus I did.” The Hebrew expression is an idiom introducing the details of what he had done.
    reason: lexical_alternative
translation:
  language: ko
  text: 아간이 여호수아에게 대답하여 말했습니다. 「참으로 제가 야훼, 이스라엘의 하나님께 죄를 지었습니다. 그리고 제가 이러이러한 일을 했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이렇게 또 저렇게 내가 했다”에 가깝지만, 히브리어 관용구로서 뒤이어 올 구체적 설명을 여는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן / וַיֹּאמַר
  english_pob_choice: answered / said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답하고 말했습니다
  lexicon: WLC narrative speech formula
  rationale: 히브리어의 대화 개시 공식인 ‘대답하다/말하다’를 자연스러운 한국어 대화문으로 옮기되, 응답 구조를 유지했습니다.
- source_word: אָמְנָה
  english_pob_choice: Truly
  chosen_korean: 참으로
  alternatives_korean:
  - 진실로
  - 정말
  lexicon: HALOT
  rationale: 회개와 고백의 서두에서 쓰인 강한 확인 표현을 현대적이면서도 단정한 ‘참으로’로 살렸습니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: against Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님께
  alternatives_korean:
  - 여호와, 이스라엘의 하나님께
  - 야훼이신 이스라엘의 하나님께
  lexicon: YHWH covenant name
  rationale: יהוה는 본문 원어 기준으로 ‘야훼’로 옮기고, חטא + ל의 관계를 한국어에서 자연스러운 ‘~께 죄를 지었습니다’로 풀었습니다.
- source_word: וְכָזֹאת וְכָזֹאת
  english_pob_choice: this is what I did
  chosen_korean: 이러이러한 일을 했습니다
  alternatives_korean:
  - 이런저런 일을 했습니다
  - 그렇게 이렇게 했습니다
  lexicon: HALOT idiom
  rationale: 직역의 어색함을 피하면서도, 뒤에 이어질 구체적 진술을 여는 관용구의 ‘막연히 상세를 예고하는’ 기능을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 언약명 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
- issue: 죄의 방향을 나타내는 ל의 처리
  chosen_reading: ~께 죄를 지었습니다
  alternative_readings:
  - ~에게 죄를 범했습니다
  - ~을/를 거슬러 죄를 지었습니다
  rationale: 히브리어 חטא와 결합한 ל는 피해·상대방 표지를 가지므로, 한국어에서는 고백의 뜻을 가장 분명하게 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 'WLC syntax: חטא + ל'
