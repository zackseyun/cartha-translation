source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
  footnotes:
  - marker: a
    text: Or 'brought Israel forward by its tribes.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the tribe of Judah was taken,' an idiom for being singled out or selected in the process.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 아침 일찍 일어나 이스라엘을 그 지파별로 가까이 나오게 했습니다. 그리고 유다 지파가 뽑혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 그 지파들에 따라 앞으로 나오게 했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘유다 지파가 잡혔다’이며, 여기서는 지목되거나 선택되었다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: HALOT
  rationale: שׁכם의 관용적 의미와 시간 표현을 함께 살려, 자연스러운 합쇼체로 간결하게 옮겼습니다.
- source_word: וַיַּקְרֵב אֶת יִשְׂרָאֵל
  english_pob_choice: brought Israel near
  chosen_korean: 이스라엘을 ... 가까이 나오게 했습니다
  alternatives_korean:
  - 이스라엘을 가까이 데려왔습니다
  - 이스라엘을 앞으로 불러냈습니다
  lexicon: HALOT
  rationale: קרב의 ‘가까이 데리다/가까이 나오게 하다’라는 절차적 의미를 살려, 단순한 ‘제시하다’보다 직접적인 표현을 택했습니다.
- source_word: לִשְׁבָטָיו
  english_pob_choice: by its tribes
  chosen_korean: 그 지파별로
  alternatives_korean:
  - 지파에 따라
  - 지파마다
  lexicon: HALOT
  rationale: ל + 복수 소유형의 분배적 의미를 한국어의 ‘-별로’로 자연스럽게 재현했습니다.
- source_word: וַיִּלָּכֵד שֵׁבֶט יְהוּדָה
  english_pob_choice: the tribe of Judah was taken
  chosen_korean: 유다 지파가 뽑혔습니다
  alternatives_korean:
  - 유다 지파가 잡혔습니다
  - 유다 지파가 선택되었습니다
  lexicon: HALOT
  rationale: לכד의 문자적 ‘붙잡히다’보다 이 문맥의 ‘지목되다/뽑히다’라는 결과를 드러내되, 해석을 과도하게 좁히지 않도록 ‘뽑혔습니다’를 택했습니다.
theological_decisions:
- issue: 유다 지파가 ‘뽑혔다’는 표현의 의미
  chosen_reading: 본문은 선택의 메커니즘을 설명하지 않고 결과만 말하므로, ‘뽑혔습니다’로 지파가 지목된 사실을 드러내되 방법은 열어 둡니다.
  alternative_readings:
  - 제비로 뽑혔습니다
  - 선택되었습니다
  - 지목되었습니다
  rationale: 문맥상 신적/제의적 판별 과정이 배경이지만, 이 절 자체는 그 수단을 명시하지 않으므로 본문의 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: original-language primacy; preserve tension rather than resolving implicit mechanism
