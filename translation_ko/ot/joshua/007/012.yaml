  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
  footnotes:
  - marker: a
    text: Hebrew חֵרֶם (cherem) refers to something devoted to God for destruction under a ban. Traditional English versions often render it 'accursed thing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손은 자기들의 원수들 앞에 설 수 없고, 자기들의 원수들 앞에서 등만 보이게 될 것입니다. 그들이 멸망에 바쳐진 것이 되었기 때문입니다. 여러분 가운데서 멸망에 바쳐진 것을 제거하지 않으면, 내가 다시는 여러분과 함께 있지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵרֶם은 하나님께 바쳐져 멸망 아래 놓인 것을 가리키며, 전통 영어역본은 흔히 ‘accursed thing’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 집합적·언약적 표현을 살리면서도 한국어에서 자연스러운 전통적 대응인 ‘이스라엘 자손’을 택했습니다.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  english_pob_choice: stand before their enemies
  chosen_korean: 원수들 앞에 설 수 없고
  alternatives_korean:
  - 원수들 앞에 맞설 수 없고
  - 원수들 앞에 일어설 수 없고
  lexicon: HALOT
  rationale: ‘서다’는 전투적 관용구인 ‘stand before’의 이미지를 보존하면서 한국어로도 자연스럽게 패배와 무력함을 드러냅니다.
- source_word: עֹרֶף יִפנוּ
  english_pob_choice: they turn their backs
  chosen_korean: 등만 보이게 될 것입니다
  alternatives_korean:
  - 등을 돌리게 될 것입니다
  - 뒤를 보이게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘목/등을 돌림’이라는 패퇴 이미지를 살리되, 현대 한국어에서 가장 자연스럽게 패배를 드러내는 표현으로 옮겼습니다.
- source_word: חֵרֶם
  english_pob_choice: devoted to destruction / the devoted thing
  chosen_korean: 멸망에 바쳐진 것
  alternatives_korean:
  - 진멸에 바쳐진 것
  - 저주받은 것
  - 바침된 것
  lexicon: HALOT
  rationale: POB의 ‘devoted to destruction’에 맞추어 חרם의 봉헌-진멸 의미를 함께 드러내는 표현을 택했습니다. ‘저주받은 것’은 전통적이지만 의미를 좁힐 수 있어 피했습니다.
- source_word: מִקִּרְבְּכֶם
  english_pob_choice: from your midst
  chosen_korean: 여러분 가운데서
  alternatives_korean:
  - 여러분의 한가운데서
  - 여러분의 가운데에서
  lexicon: HALOT
  rationale: 언약 공동체 내부에서 제거되어야 함을 자연스러운 현대 한국어로 전달하되, 공동체적 범위를 분명히 했습니다.
theological_decisions:
- issue: חֵרֶם의 이중 용법을 한국어에서 어떻게 일관되게 드러낼지
  chosen_reading: 앞절에서는 ‘멸망에 바쳐진 것이 되었기 때문입니다’, 뒤절에서는 ‘멸망에 바쳐진 것’을 제거하라고 번역해 어휘 연결을 유지했습니다.
  alternative_readings:
  - ‘진멸에 바쳐진 것’ / ‘저주받은 것’
  - ‘하나님께 바쳐진 것’
  rationale: 같은 어근이 상태와 구체적 대상 두 층위를 가리키므로, 한국어도 동일 어근군으로 연결하되 ‘저주’로 단순화하지 않아 본문의 언약적·심판적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #5 (consistency of key terms, or documented exception)'
