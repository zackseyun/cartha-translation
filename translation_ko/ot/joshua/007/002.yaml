source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
  footnotes:
  - marker: a
    text: Or 'which is beside Beth-aven'; the Hebrew literally says 'which is with Beth-aven,' using a preposition that can express geographical proximity.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 여리고에서 아이로 사람들을 보내며, 베델의 동쪽, 베트아웬 가까이에 있는 그곳을 정탐하라고 그들에게 말했습니다. 그래서 그 사람들이 올라가 아이를 정탐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘베트아웬과 함께/가까이에 있는’이라고 직역할 수 있는 전치를 사용합니다. 지리적 관계를 나타내는 용법이므로 ‘가까이에 있는’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내며
  alternatives_korean:
  - 보냈습니다
  - 파견하며
  lexicon: HALOT
  rationale: 서술 흐름의 wayyiqtol을 자연스러운 현대 한국어로 풀되, 단순 과거보다 뒤이어 오는 명령을 이끄는 연결성을 살리기 위해 ‘보내며’로 처리했습니다.
- source_word: מִירִיחוֹ
  english_pob_choice: from Jericho
  chosen_korean: 여리고에서
  alternatives_korean:
  - 여리고로부터
  - 여리고에서부터
  lexicon: HALOT
  rationale: 출발 지점을 분명히 드러내는 가장 자연스러운 지명 격조사로 옮겼습니다.
- source_word: הָעַי
  english_pob_choice: Ai
  chosen_korean: 아이
  alternatives_korean:
  - 아이 성
  - 아이
  lexicon: HALOT
  rationale: 고유지명은 관용적 음역 ‘아이’로 유지해 본문의 지명을 직접적으로 드러냈습니다.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  english_pob_choice: which is near Beth-aven
  chosen_korean: 베트아웬 가까이에 있는
  alternatives_korean:
  - 베트아웬 곁에 있는
  - 베트아웬과 함께 있는
  lexicon: HALOT
  rationale: עִם의 지리적 용법을 영어 POB의 ‘near’에 맞춰 근접성으로 옮겼습니다. 직역형 ‘함께 있는’은 한국어에서 어색하므로 지리 관계를 살렸습니다.
- source_word: מִקֶּדֶם לְבֵית אֵל
  english_pob_choice: east of Bethel
  chosen_korean: 베델의 동쪽
  alternatives_korean:
  - 베델 동쪽
  - 베델의 동편
  lexicon: HALOT
  rationale: 방향 표지를 자연스러운 한국어 관계구로 옮겨, 위치 설명의 기능을 분명히 했습니다.
- source_word: וְרַגְּלוּ אֶת הָאָרֶץ
  english_pob_choice: spy out the land
  chosen_korean: 정탐하라고
  alternatives_korean:
  - 정탐하라고 해서
  - 땅을 살피라고
  lexicon: HALOT
  rationale: רגל의 군사적 정탐 의미를 살려 ‘정탐하다’를 선택했고, 대상 ‘the land’는 문맥상 이미 지시되는 지역을 가리키므로 간결하게 처리했습니다.
- source_word: וַיְרַגְּלוּ
  english_pob_choice: spied out
  chosen_korean: 정탐했습니다
  alternatives_korean:
  - 살폈습니다
  - 정탐해 보았습니다
  lexicon: HALOT
  rationale: 명령의 어근과 같은 동사를 유지해 반복 효과를 보존하고, 군사적 정찰의 의미를 분명히 했습니다.
theological_decisions:
- issue: 지명 표기에서 ‘여호와/주’처럼 신학적으로 해석되는 요소가 없는 본문의 처리
  chosen_reading: 본문의 핵심은 군사 정탐 명령과 지리 정보이므로, 신학적 확장 없이 서술을 그대로 옮겼습니다.
  alternative_readings:
  - 의미를 풀어 ‘가서 정찰해 보십시오’처럼 완화하는 번역
  rationale: 원문이 요구하는 정보 전달을 우선하며, 해석적 추가를 최소화하는 것이 이 절의 문맥에 가장 충실합니다.
  doctrine_reference: 성경 본문의 서사적 사실성 및 최소해석 원칙
