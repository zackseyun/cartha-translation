  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: ko
  text: 그러자 백성 가운데서 약 삼천 명이 그리로 올라갔으나, 아이 사람들 앞에서 도망쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הָעָם
  english_pob_choice: from the people
  chosen_korean: 백성 가운데서
  alternatives_korean:
  - 백성에게서
  - 군대에서
  - 무리 가운데서
  lexicon: HALOT
  rationale: עם을 여기서는 이스라엘의 일부를 가리키는 집합명사로 보아, 군사적 의미를 과하게 넣지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: שָׁמָּה
  english_pob_choice: there
  chosen_korean: 그리로
  alternatives_korean:
  - 거기로
  - 거기
  - 그곳으로
  lexicon: HALOT
  rationale: 앞서 언급된 목적지를 향한 이동을 분명히 하면서도, 서술체에 맞게 간결하게 살렸습니다.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  english_pob_choice: about three thousand men
  chosen_korean: 약 삼천 명
  alternatives_korean:
  - 대략 삼천 명
  - 약 삼천 남자
  - 삼천 명가량
  lexicon: HALOT
  rationale: כִּ의 근사 의미를 ‘약’으로 살리고, אִישׁ는 수사 뒤의 사람 셈으로 보아 ‘명’으로 자연스럽게 옮겼습니다.
- source_word: אַנְשֵׁי הָעָי
  english_pob_choice: the men of Ai
  chosen_korean: 아이 사람들
  alternatives_korean:
  - 아이의 남자들
  - 아이의 사람들
  - 아이의 전사들
  lexicon: HALOT
  rationale: אֲנָשִׁים은 도시를 지키는 남성 집단을 가리키지만, 한국어에서는 고유지명 뒤에 ‘사람들’을 붙여도 군사적 대치 상황이 드러나므로, 과도하게 설명하지 않는 쪽을 택했습니다.
theological_decisions:
- issue: 전투 장면의 동사 표현
  chosen_reading: ‘올라갔으나’와 ‘도망쳤습니다’로 전투 서술을 유지하되, 본문이 말하는 패배와 공포를 직접 드러냈습니다.
  alternative_readings:
  - ‘진격했으나’
  - ‘나아갔으나’
  - ‘달아났습니다’
  rationale: 히브리어는 먼저 이동(עלה), سپس 도주(נס)를 대비시키므로, 한국어도 그 대비를 분명히 보여 주는 것이 본문 효과를 가장 잘 살립니다.
  doctrine_reference: 내러티브 본문 해석 원칙
