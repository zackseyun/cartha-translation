  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
  footnotes:
  - marker: a
    text: Or 'as far as the quarries' or 'as far as the broken places'; the Hebrew שברים may be understood as a place name (Shebarim) or as a descriptive term.
    reason: alternative_reading
translation:
  language: ko
  text: 아이 사람들 가운데서 약 서른여섯 명을 쳐 죽이고, 성문 앞에서부터 세바림까지 그들을 추격하여 내려가는 길에서 그들을 쳤습니다. 그러자 백성의 마음이 녹아 물처럼 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שברים은 지명 ‘세바림’으로 이해할 수도 있고, ‘채석장들’ 또는 ‘부서진 곳들’이라는 뜻의 서술적 표현으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ / וַיַּכּוּם
  english_pob_choice: struck down / struck them down
  chosen_korean: 쳐 죽이고 / 쳤습니다
  alternatives_korean:
  - 쳐서 쓰러뜨리고 / 쓰러뜨렸습니다
  - 죽이고 / 죽였습니다
  - 쳤습니다
  lexicon: HALOT
  rationale: נכה는 전투 문맥에서 단순한 '치다'보다 더 강한 타격을 뜻하므로, 앞부분은 결과를 드러내는 '쳐 죽이고'로, 뒤의 반복은 동일 어근을 살려 '쳤습니다'로 옮겼습니다.
- source_word: מֵהֶם
  english_pob_choice: from among them
  chosen_korean: 가운데서
  alternatives_korean:
  - 그들 중에서
  - 그 가운데서
  lexicon: HALOT
  rationale: 전치사 מן+대명사는 피해자가 공동체 내부에서 나온 뜻이므로, 한국어에서는 자연스럽고 분명한 '가운데서'로 표현했습니다.
- source_word: עַד הַשְּׁבָרִים
  english_pob_choice: as far as Shebarim
  chosen_korean: 세바림까지
  alternatives_korean:
  - 부서진 곳들까지
  - 채석장들까지
  lexicon: HALOT
  rationale: 이 표현은 지명일 수도, 서술적 지명일 수도 있어 본문에서는 음역한 '세바림'을 유지해 POB의 본문 선택을 따르고, 대안은 주석으로 남겼습니다.
- source_word: בַּמּוֹרָד
  english_pob_choice: on the descent
  chosen_korean: 내려가는 길에서
  alternatives_korean:
  - 내리막에서
  - 경사면에서
  - 내려가는 곳에서
  lexicon: HALOT
  rationale: מורד는 지형적으로 '내리막/내려가는 곳'을 가리키므로, 한국어에서는 과도하게 기술적이지 않으면서도 장면이 보이도록 '내려가는 길'로 옮겼습니다.
- source_word: וַיִּמַּס לְבַב הָעָם וַיְהִי לְמָיִם
  english_pob_choice: the heart of the people melted and became like water
  chosen_korean: 백성의 마음이 녹아 물처럼 되었습니다
  alternatives_korean:
  - 백성의 마음이 녹아 물이 되었습니다
  - 백성의 마음이 녹아내렸습니다
  - 백성의 용기가 꺾였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 시각적 이미지를 살리기 위해 직유를 유지했습니다. '물처럼 되었습니다'는 영어 POB의 'became like water'와 같은 비유를 한국어로 자연스럽게 반영합니다.
theological_decisions:
- issue: 전투 패배의 심리 묘사인 '마음이 녹아 물처럼 됨'의 처리
  chosen_reading: 감정이나 용기를 추상화해 풀기보다, 원문의 신체적·상징적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - '''용기가 꺾였습니다''처럼 의미만 풀기'
  - '''절망에 빠졌습니다''로 해석적 번역하기'
  rationale: 본문은 단순한 심리 진술이 아니라 공동체가 전투 패배 앞에서 무너지는 장면을 강한 은유로 보여 주므로, 이미지 자체를 보존하는 것이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: 성경의 서사적 은유 보존 원칙
- issue: 세바림의 지명 여부를 본문에서 단정하지 않음
  chosen_reading: 본문에서는 지명처럼 음역 처리하고, 주석에서 대안 독법을 제시합니다.
  alternative_readings:
  - 일반 명사로 풀어 '부서진 곳들'로 번역
  - '''채석장들''로 해석'
  rationale: 히브리어 שברים은 장소명과 서술어적 명사 둘 다 가능하므로, 본문에서 한쪽으로 단정하면 텍스트의 해석 긴장을 지워 버리게 됩니다.
  doctrine_reference: 본문 비평 및 해석 보존 원칙
