  source_fidelity: 첫 절의 주어와 מֵהֶם의 관계가 핵심적으로 잘못 표현되었습니다. ‘아이 사람들 가운데서’는 아이 사람들 중에서 희생자가 났다는 뜻이 되지만, 히브리어는 아이 사람들이 이스라엘 쪽 ‘그들 가운데서’ 약 서른여섯 명을 쳤다고 말합니다. 또한 נכה는 두 차례 모두 ‘치다/쓰러뜨리다’의 폭을 가지므로, 본문은 사망을 단정하는 ‘쳐 죽이다’보다 ‘쓰러뜨리다’가 안전합니다.
  naturalness: ‘아이 사람들이 그들 가운데서’라고 주어와 피해 집단을 분명히 하면 현대 한국어 문장이 자연스럽고 의미가 명확해집니다. ‘내리막에서’는 בַּמּוֹרָד의 지형적 의미를 간결하게 살립니다. 합쇼체 문체도 유지됩니다.
  terminology: ‘아이’, ‘세바림’, ‘백성의 마음이 녹아 물처럼 되었습니다’는 고유명사 및 원문의 은유를 적절히 보존합니다. 세바림의 지명/일반명사 가능성은 각주로 유지해야 합니다.
