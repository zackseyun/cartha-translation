revisions:
- from: 그리고 그 ‘חֵרֶם’에 붙들린 사람은 불에 타야 합니다[a]. 그와 그에게 속한 모든 것을 그렇게 해야 합니다. 이는 그가 야훼의 언약을 범하였고, 이스라엘 가운데서 부끄러운 일을 행하였기 때문입니다.
  to: 진멸에 바쳐진 것을 지닌 채 적발된 사람은[a] 그와 그에게 속한 모든 것과 함께 불에 태워져야 합니다. 이는 그가 야훼의 언약을 어겼고 이스라엘 안에서 수치스러운 일을 행하였기 때문입니다.
  rationale: 헤렘을 음역한 채 부자연스럽고 의미가 어긋난 결합을 피하고, 문맥과 원문의 연관 관계를 드러내도록 ‘진멸에 바쳐진 것을 지닌 채’로 옮겼습니다. 각주는 전통적 번역과 용어의 바쳐짐·금지·진멸의 의미를 보존합니다. 형벌의 범위와 인과절도 원문에 맞게 명료화했습니다.
