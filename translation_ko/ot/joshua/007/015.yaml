review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. בַּחֵרֶם은 그 사람이 ‘헤렘에 붙들린’다는 뜻이 아니라, 진멸에 바쳐진 것과 관련되어—문맥상 그것을 지닌 채—적발된 사람을 가리킵니다. 또한 형벌은 그 사람과 그에게 속한 모든 것에 불로 시행된다고 명시합니다.
  naturalness: 초안의 ‘그 חֵרֶם에 붙들린 사람’은 한국어로 부자연스럽고 의미 관계도 불명확합니다. ‘진멸에 바쳐진 것을 지닌 채 적발된 사람’ 및 ‘그와 그에게 속한 모든 것은 불에 태워져야 합니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: יַהְוֶה는 번역 방침에 따라 ‘야훼’로 유지합니다. חֵרֶם은 본문에서 ‘진멸에 바쳐진 것’으로 옮기고, 각주에서 전통적 표현과 바쳐짐/금지의 의미를 보완합니다. נְבָלָה는 단순한 수치나 당혹감보다 도덕적으로 규탄받을 행위를 뜻하므로 ‘수치스러운 일’이 더 적절합니다.
  issues:
  - severity: high
    issue: בַּחֵרֶם의 의미 관계가 잘못 번역됨
    rationale: ‘그 חֵרֶם에 붙들린’은 사람이 헤렘 자체에 붙잡힌다는 뜻이 됩니다. 히브리어는 헤렘과 관련되어 적발된 사람을 말하며, 이 문맥에서는 진멸에 바쳐진 물건을 취한 사실을 가리킵니다.
  - severity: medium
    issue: 불로 태우는 형벌의 대상이 불분명함
    rationale: ‘그와 그에게 속한 모든 것을 그렇게 해야 합니다’의 ‘그렇게’는 불에 태운다는 내용을 불명료하게 반복합니다. 원문은 그 사람과 그에게 속한 모든 것을 명시적으로 포함합니다.
  - severity: low
