  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the accursed thing'; Hebrew 'with the devoted thing' (ḥerem), referring to what was placed under the ban and devoted to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 ‘חֵרֶם’에 붙들린 사람은 불에 타야 합니다[a]. 그와 그에게 속한 모든 것을 그렇게 해야 합니다. 이는 그가 야훼의 언약을 범하였고, 이스라엘 가운데서 부끄러운 일을 행하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로는 ‘저주받은 것’. 히브리어 ‘חֵרֶם’은 금지 아래 놓여 하나님께 바쳐졌으며 진멸에 이른 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  english_pob_choice: the one who is taken
  chosen_korean: 붙들린 사람
  alternatives_korean:
  - 잡힌 사람
  - 포로가 된 사람
  - 적발된 사람
  lexicon: HALOT
  rationale: 심판 절차에서 특정 개인이 지목되어 ‘붙들린’ 상태가 되는 뜻을 살리되, 전투 포로처럼 들릴 수 있는 표현은 피했습니다.
- source_word: בַּחֵרֶם
  english_pob_choice: with the devoted thing
  chosen_korean: ‘חֵרֶם’
  alternatives_korean:
  - 저주받은 것
  - 저주 아래 있는 것
  - 바쳐진 것
  - 진멸에 바쳐진 것
  lexicon: HALOT
  rationale: 이 용어는 단순한 저주가 아니라 하나님께 금지·전속되어 진멸에 이른 대상을 가리키므로, 본문에서는 음역을 유지하고 각주로 의미를 설명하는 편이 원문 긴장을 가장 잘 보존합니다.
- source_word: נְבָלָה
  english_pob_choice: an outrageous thing
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 가증스러운 일
  - 악한 일
  - 무도한 일
  lexicon: HALOT
  rationale: 공동체 안에서의 도덕적·언약적 수치를 강조하는 표현으로 읽혀, 현대 한국어에서 자연스럽고 의미 범위가 넓은 ‘부끄러운 일’을 택했습니다.
theological_decisions:
- issue: חֵרֶם의 번역 처리
  chosen_reading: 본문에는 음역 ‘חֵרֶם’을 두고, 각주에서 ‘전통적으로는 저주받은 것; 바쳐져 진멸에 놓인 것’이라는 뜻을 밝힙니다.
  alternative_readings:
  - 본문에서 ‘저주받은 것’으로 번역
  - 본문에서 ‘진멸에 바쳐진 것’으로 번역
  - 본문에서 ‘금지된 것’으로 번역
  rationale: 이 구절은 ‘바쳐짐’과 ‘진멸’이 함께 걸린 언약 심판 맥락을 가지므로, 어느 한쪽으로 평평하게 만들기보다 원어의 긴장을 드러내는 편이 문맥상 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
