language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרֵ֥ב אֶת בֵּית֖/וֹ לַ/גְּבָרִ֑ים וַ/יִּלָּכֵ֗ד עָכָ֞ן בֶּן כַּרְמִ֧י בֶן זַבְדִּ֛י בֶּן זֶ֖רַח לְ/מַטֵּ֥ה יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
  footnotes:
  - marker: a
    text: Or 'by the men'; the Hebrew phrase is terse and may describe the household being brought forward in male subdivisions for the lot-taking process.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그가 그의 집안을 남자들마다 앞으로 나오게 하니[a], 유다 지파에 속한 곱디의 아들, 삽디의 아들, 세라의 아들 아간이 잡혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남자들에 따라’. 히브리어 표현이 매우 간결하여, 제비뽑기 절차를 위해 집안이 남성 단위로 불려 나갔음을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: Then he brought ... near
  chosen_korean: 앞으로 나오게 하니
  alternatives_korean:
  - 가까이 나오게 하니
  - 가져오게 하니
  - 불러 세우니
  lexicon: HALOT
  rationale: קרב의 사역형은 ‘가까이 데려오다/나오게 하다’의 뜻이므로, 절차적으로 사람을 앞으로 부르는 장면을 살려 자연스럽게 옮겼습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his household
  chosen_korean: 그의 집안
  alternatives_korean:
  - 그의 집
  - 그의 가족
  - 그의 가문
  lexicon: HALOT
  rationale: 여기서는 건물로서의 ‘집’이 아니라 조사 대상이 된 가족 단위를 가리키므로 ‘집안’이 가장 적절합니다.
- source_word: לַגְּבָרִים
  english_pob_choice: man by man
  chosen_korean: 남자들마다
  alternatives_korean:
  - 사람마다
  - 남자 한 사람씩
  - 남자들 따라
  lexicon: HALOT
  rationale: 히브리어의 간결한 표현이 집안 구성원을 남성 단위로 나누어 앞으로 세우는 절차를 가리킬 가능성을 반영해, 의미를 과하게 확장하지 않는 범위에서 ‘남자들마다’로 옮겼습니다.
- source_word: וַיִּלָּכֵד
  english_pob_choice: was taken
  chosen_korean: 잡혔습니다
  alternatives_korean:
  - 붙들렸습니다
  - 선택되었습니다
  - 취해졌습니다
  lexicon: HALOT
  rationale: 낙찰·선택의 결과로 드러나는 ‘잡히다/붙들리다’의 수동적 의미를 살리되, 한국어에서 어색하지 않게 옮겼습니다.
theological_decisions:
- issue: 가문 표기의 직역성과 절차적 맥락
  chosen_reading: ‘그의 집안’과 ‘남자들마다’로, 제비뽑기 조사 과정에서 집안이 남성 단위로 앞으로 불려 나오는 장면을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그의 가족을 사람마다’
  - ‘그의 집을 남자별로’
  rationale: 본문은 단순한 신원 소개가 아니라 범죄자를 드러내는 공적 조사 절차를 묘사하므로, 절차의 긴장감을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 맥락 보존
