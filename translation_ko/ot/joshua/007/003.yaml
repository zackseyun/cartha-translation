  text: וַ/יָּשֻׁ֣בוּ אֶל יְהוֹשֻׁ֗עַ וַ/יֹּאמְר֣וּ אֵלָי/ו֮ אַל יַ֣עַל כָּל הָ/עָם֒ כְּ/אַלְפַּ֣יִם אִ֗ישׁ א֚וֹ כִּ/שְׁלֹ֣שֶׁת אֲלָפִ֣ים אִ֔ישׁ יַעֲל֖וּ וְ/יַכּ֣וּ אֶת הָ/עָ֑י אַל תְּיַגַּע שָׁ֨מָּ/ה֙ אֶת כָּל הָ/עָ֔ם כִּ֥י מְעַ֖ט הֵֽמָּה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
  footnotes:
  - marker: a
    text: Hebrew 'the people' may refer specifically to the fighting force here; compare 'troops' or 'army' as a contextual rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not trouble all the people there.' The Hebrew verb can carry the sense of causing weariness or burden through unnecessary effort.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 여호수아에게 돌아와 말했습니다. “모든 백성이 올라가게 하지 마십시오. 약 이천 명 또는 약 삼천 명만 올라가 아이를 치게 하십시오. 그곳에서 모든 백성을 지치게 하지 마십시오[b]. 그들은 수가 적습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그곳에서 모든 백성을 괴롭게 하지 마십시오.’ 히브리어 동사는 수고와 피로를 초래하는 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: They returned
  chosen_korean: 그들은 돌아왔습니다
  alternatives_korean:
  - 그들은 돌아갔습니다
  - 그들은 다시 왔습니다
  lexicon: HALOT
  rationale: 이야기 진행의 단순 과거를 자연스럽게 옮기면서, 전투 정탐 후 여호수아에게 되돌아오는 동작을 분명히 살렸습니다.
- source_word: אַל יַעַל כָּל הָעָם
  english_pob_choice: Do not have all the people go up
  chosen_korean: 모든 백성이 올라가게 하지 마십시오
  alternatives_korean:
  - 모든 백성이 올라가지 않게 하십시오
  - 모든 군사가 올라가지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 금지형과 사역적 뉘앙스를 반영해, 직역보다도 한국어에서 자연스러운 사역 부정형으로 옮겼습니다. הָעָם은 기본값대로 ‘백성’으로 두었습니다.
- source_word: כְּאַלְפַּיִם אִישׁ / אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  english_pob_choice: about two thousand men / or about three thousand men
  chosen_korean: 약 이천 명 / 약 삼천 명
  alternatives_korean:
  - 약 이천 남자 / 약 삼천 남자
  - 대략 이천 명 / 대략 삼천 명
  lexicon: HALOT
  rationale: כ의 근사값을 ‘약’으로 자연스럽게 살렸고, 숫자 뒤의 אִישׁ은 한국어 관용에 맞게 ‘명’으로 처리했습니다.
- source_word: וְיַכּוּ אֶת הָעָי
  english_pob_choice: and strike Ai
  chosen_korean: 아이를 치게 하십시오
  alternatives_korean:
  - 아이를 치십시오
  - 아이를 공격하게 하십시오
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다’를 살려서, 전투 맥락의 공격 행위를 과도하게 해석하지 않았습니다. 도시명 ‘아이’는 목적어로 자연스럽게 처리했습니다.
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת כָּל הָעָם
  english_pob_choice: Do not wear out all the people there
  chosen_korean: 그곳에서 모든 백성을 지치게 하지 마십시오
  alternatives_korean:
  - 그곳에서 모든 백성을 괴롭게 하지 마십시오
  - 그곳에서 모든 백성을 수고롭게 하지 마십시오
  lexicon: HALOT
  rationale: Piel יגע의 ‘피곤하게 하다/지치게 하다’ 의미를 반영해, 군사 작전의 불필요한 수고를 한국어로 선명하게 전달했습니다. שָׁמָּה는 문맥상 ‘그곳에서’로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 직접화법 등록 수준
  chosen_reading: 보고형 서술과 인용문 안에서 여호수아에게 하는 실무적 권고이므로, 현대 표준어의 공손한 명령형(하십시오)으로 옮겼습니다.
  alternative_readings:
  - 반말체 권고형
  - 더 고어적인 하소서형
  rationale: 히브리어의 지휘·권고 문맥을 살리되, POB의 현대 합쇼체 원칙에 맞추기 위한 선택입니다.
  doctrine_reference: 번역 शैली/담화 등록
