  text: וַ/יָּקִ֨ימוּ עָלָ֜י/ו גַּל אֲבָנִ֣ים גָּד֗וֹל עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יָּ֥שָׁב יְהוָ֖ה מֵ/חֲר֣וֹן אַפּ֑/וֹ עַל כֵּ֠ן קָרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ עֵ֣מֶק עָכ֔וֹר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
  footnotes:
  - marker: a
    text: Achor sounds like the Hebrew word for 'trouble' or 'disturbance'; compare Joshua 7:25.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 위에 돌로 된 큰 무더기를 오늘날까지 쌓아 두었고[a], 야훼께서는 그분의 타오르는 분노에서 돌이키셨습니다. 그러므로 그 곳의 이름은 오늘날까지 아골 골짜기라고 불려 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아골’은 히브리어 ‘아코르’와 소리가 비슷하며, ‘환난’ 또는 ‘괴로움’의 뜻을 암시합니다. 여호수아 7:25를 보십시오.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  english_pob_choice: they raised over him a large heap of stones
  chosen_korean: 그들은 그 위에 돌로 된 큰 무더기를 쌓아 두었고
  alternatives_korean:
  - 그들은 그 위에 돌무더기 하나를 만들었고
  - 그들은 그 위에 큰 돌무더기를 세웠고
  lexicon: HALOT
  rationale: גַּל אֲבָנִים은 돌의 무더기이므로 ‘돌로 된 큰 무더기’로 옮기고, עָלָיו는 ‘그 위에’로 처리해 매장/기념적 적치의 이미지를 살렸습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 지금까지
  - 오늘까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 지속성을 자연스럽게 드러내기 위해 ‘오늘날까지’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사표기 יהוה를 제목어가 아닌 고유명사로 처리하는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: מֵחֲרוֹן אַפּוֹ
  english_pob_choice: from the burning of his anger
  chosen_korean: 그분의 타오르는 분노에서 돌이키셨습니다
  alternatives_korean:
  - 그분의 맹렬한 분노에서 돌아서셨습니다
  - 그분의 불붙는 진노에서 물러나셨습니다
  lexicon: HALOT
  rationale: חֲרוֹן אַף의 불타는 분노 이미지를 살리되, 한국어에서는 ‘분노에서 돌이키다’가 문맥상 가장 직접적으로 심판의 중단을 드러냅니다.
- source_word: עֵמֶק עָכוֹר
  english_pob_choice: the Valley of Achor
  chosen_korean: 아골 골짜기
  alternatives_korean:
  - 아코르 골짜기
  - 아골 협곡
  lexicon: HALOT
  rationale: 지명은 고유명사로 음역하되, 한국어 성경에서 널리 통용되는 ‘아골’을 채택했습니다.
- source_word: קָרָא שֵׁם
  english_pob_choice: the name of that place has been called
  chosen_korean: 그 곳의 이름은 오늘날까지 아골 골짜기라고 불려 왔습니다
  alternatives_korean:
  - 그 곳의 이름은 아골 골짜기라고 불립니다
  - 그 곳은 아골 골짜기라 불렸습니다
  lexicon: HALOT
  rationale: 이름 붙이기 공식의 완료-지속 뉘앙스를 살리기 위해 단순 현재보다 ‘불려 왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 신명사 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 고유 이름을 사용하므로, 호칭 대체 없이 이름 자체를 드러내는 것이 원문과 번역 원칙에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 하나님의 진노 표현
  chosen_reading: ‘그분의 타오르는 분노’로 직역해 심판의 정서적 긴장을 유지했습니다.
  alternative_readings:
  - 그분의 맹렬한 분노
  - 그분의 불타는 진노
  rationale: 본문의 의인적·은유적 표현을 약화하지 않고 유지하여, 진노의 중단이라는 서술을 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
