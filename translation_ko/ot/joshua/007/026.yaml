  terminology: ‘야훼’와 통용 지명 ‘아골 골짜기’는 유지할 수 있습니다. 각주는 아골과 עכר의 말놀이, 곧 ‘괴롭힘/재앙’이라는 뜻과의 음성적 연관을 정확히 밝혀야 합니다.
