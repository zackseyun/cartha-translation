source:
  edition: WLC
  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
  footnotes:
  - marker: a
    text: Or 'takes'; the Hebrew verb can mean 'captures' or 'seizes,' but here it refers to the tribe, clan, or household indicated by the LORD, likely through sacred lot.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'man by man,' specifying the final identification at the level of individual males within the household.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 너희는 지파별로 나아오십시오[a]. 야훼께서 택하시는 지파는 씨족별로 나아오고, 야훼께서 택하시는 씨족은 가문별로 나아오며[b], 야훼께서 택하시는 가문은 남자 한 사람씩 나아올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘선택된’; 히브리어 동사는 ‘붙잡다’ 또는 ‘사로잡다’라는 뜻도 있지만, 여기서는 야훼께서 지목하신 지파를 가리키며, 아마도 거룩한 제비뽑기를 통해 드러났을 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘남자 한 사람씩’입니다. 이는 가문 안에서 마지막으로 개별 남성 단위까지 식별하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם
  english_pob_choice: you shall come near
  chosen_korean: 나아오십시오
  alternatives_korean:
  - 다가오십시오
  - 출석하십시오
  - 자기들을 드러내십시오
  lexicon: HALOT
  rationale: קרב의 반복된 접근 동사를 한국어로 자연스럽게 살리면서, 선별 절차를 앞두고 공식적으로 앞으로 나오라는 뉘앙스를 유지했습니다.
- source_word: לְשִׁבְטֵיכֶם
  english_pob_choice: by your tribes
  chosen_korean: 지파별로
  alternatives_korean:
  - 너희 지파대로
  - 지파에 따라
  - 지파마다
  lexicon: HALOT
  rationale: 분배·단위 구분의 의미를 간결하게 살리기 위해 '별로'를 사용했습니다.
- source_word: לַמִּשְׁפָּחוֹת / לַבָּתִּים / לַגְּבָרִים
  english_pob_choice: by clans / by households / man by man
  chosen_korean: 씨족별로 / 가문별로 / 남자 한 사람씩
  alternatives_korean:
  - 씨족마다 / 집안별로 / 사람 한 사람씩
  - 가족별로 / 집별로 / 남자마다
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 아래의 친족 집단인 '씨족'이 가장 적절하고, בַּיִת은 물리적 집이 아니라 가계 단위이므로 '가문'으로 옮겼습니다. 마지막 단계의 גְּבָרִים은 영어 POB의 'man by man'을 따라 성별 표지를 보존해 '남자 한 사람씩'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문에 나타난 신성호칭을 일반 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 하나님의 이름을 '야훼'로 일관되게 표기했습니다.
theological_decisions:
- issue: 최종 식별을 '남자 한 사람씩'으로 유지할지 여부
  chosen_reading: 가문의 마지막 단계는 성인 남성 단위의 식별을 분명히 드러내는 '남자 한 사람씩'으로 번역했습니다.
  alternative_readings:
  - 사람 한 사람씩
  - 개인별로
  rationale: 히브리어 גְּבָרִים은 남성 복수형이며, 영어 POB도 'man by man'으로 성별을 명시합니다. 이 단계는 단순한 개인 일반이 아니라 가문 내의 남성 개체를 좁혀 가는 절차이므로, 성별 표지를 유지하는 편이 원문과 주석 의도에 더 충실합니다.
  doctrine_reference: 원문 어휘와 영어 POB 주석의 성별-축소 절차 보존
