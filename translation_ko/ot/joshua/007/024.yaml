id: JOS.7.24
reference: Joshua 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
  footnotes:
  - marker: a
    text: Hebrew 'tongue of gold,' that is, a tongue-shaped piece of gold; traditionally 'a wedge of gold.'
    reason: lexical_alternative
  - marker: b
    text: Achor sounds like the Hebrew word for 'trouble.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 여호수아가 세라의 아간과 은과 겉옷과 금덩이와 그의 아들들과 그의 딸들과 그의 소와 그의 나귀와 그의 양 떼와 그의 장막과 그에게 속한 모든 것을 취하였고 — 온 이스라엘도 그와 함께하였으며 — 그들을 아골 골짜기로 끌어올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘금의 혀’는 혀 모양의 금 조각을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 아골은 히브리어로 ‘고통’ 또는 ‘재앙’과 어감이 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: Then Joshua took
  chosen_korean: 취하였고
  alternatives_korean:
  - 데려갔고
  - 가졌고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘취하다/데려가다’의 서사 진행을 살리되, 강한 강탈 뉘앙스를 과도하게 넣지 않기 위해 ‘취하였고’를 택했습니다.
- source_word: לְשׁוֹן הַזָּהָב
  english_pob_choice: the bar of gold
  chosen_korean: 금덩이
  alternatives_korean:
  - 금 혓바닥
  - 금막대
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘금의 혀’이지만, 문맥상 혀 모양의 금 조각을 가리키므로 현대 한국어로는 자연스럽고 오해가 적은 ‘금덩이’가 적절합니다.
- source_word: בָּנָיו ... בְּנֹתָיו
  english_pob_choice: his sons, his daughters
  chosen_korean: 그의 아들들과 그의 딸들과
  alternatives_korean:
  - 그의 자녀들과
  - 그의 아들과 딸들
  lexicon: HALOT
  rationale: 히브리어가 아들과 딸을 각각 분명히 구별하므로, 이를 합쳐 ‘자녀들’로 뭉개지 않고 그대로 살렸습니다.
- source_word: עֵמֶק עָכוֹר
  english_pob_choice: the Valley of Achor
  chosen_korean: 아골 골짜기
  alternatives_korean:
  - 아코르 골짜기
  - 괴로움 골짜기
  lexicon: HALOT
  rationale: 고유 지명은 통용되는 한국어 음역인 ‘아골’로 옮기고, 지명 본래의 어감은 본문 주석으로 처리하는 것이 적절합니다.
theological_decisions:
- issue: 아간 가족의 포함이 의미하는 바
  chosen_reading: 본문의 목록형 진술을 그대로 따라 가족을 모두 나열하되, 그들의 책임 범위는 해석하지 않았습니다.
  alternative_readings:
  - 가족의 공모를 암시하는 문구를 덧붙임
  - 가족의 무죄를 해설로 분명히 함
  rationale: 이 절만으로는 가족의 가담 여부를 단정할 수 없으므로, 본문이 드러내는 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문이 명시하지 않은 도덕적/법적 결론을 확정하지 않음
