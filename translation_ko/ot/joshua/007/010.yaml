translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. “일어나십시오. 어찌하여 이렇게[a] 얼굴을 땅에 대고 엎드려 있습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘왜 이렇게’ 또는 ‘어찌하여 이런 상태로’라는 지시적 강조를 포함합니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘얼굴 위에’는 얼굴을 땅에 대고 엎드린 자세를 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 고유신명 יְהוָה를 신학적 전통어인 ‘주님’으로 대체하지 않고, 음역형 ‘야훼’로 옮겨 개인 이름의 성격을 드러냈습니다.
- source_word: קֻם
  english_pob_choice: Get up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나라
  - 어서 일어나십시오
  lexicon: HALOT
  rationale: 즉시 행동을 촉구하는 명령형으로서 자연스러운 현대 한국어 존대 명령을 택했습니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why are you falling on your face?
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 왜 이것이
  - 왜 그러고 있습니까
  lexicon: HALOT
  rationale: 히브리어의 강조 요소 זֶּה를 한국어에서 가장 자연스럽게 담는 방식으로, 본문의 책망 뉘앙스를 살리면서 군더더기 없이 연결했습니다.
- source_word: נֹפֵל עַל פָּנֶיךָ
  english_pob_choice: are falling on your face
  chosen_korean: 엎드려 얼굴을 땅에 대고 있습니까
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드려 있습니까
  - 엎드려 있습니까
  lexicon: HALOT
  rationale: ‘얼굴을 땅에 대다’는 히브리 관용구를 한국어에서 이해 가능한 자세 묘사로 풀어 prostration의 상태를 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼의 처리
  chosen_reading: 본문의 יְהוָה는 야훼로 번역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙에 따라 신적 고유명은 호칭으로 완화하지 않고, 본문이 직접 드러내는 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 직접화법의 존대
  chosen_reading: 야훼의 직접 말씀은 현대 합쇼체 명령문으로 옮겼습니다.
  alternative_readings:
  - 반말형 명령
  - 더 고전적인 성경체
  rationale: 서술문은 합쇼체를 유지하되, 하나님이 여호수아에게 하시는 직접 명령은 한국어에서 자연스럽고 공손한 존대 명령으로 처리했습니다.
  doctrine_reference: Korean style guide for direct divine speech
