id: JOS.7.9
reference: Joshua 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
  footnotes:
  - marker: a
    text: Or, 'for the sake of your great name.'
    reason: lexical_alternative
  - marker: b
    text: '''Cut off our name'' is a Hebrew idiom for wiping out a people''s continued existence and remembrance.'
    reason: cultural_note
translation:
  language: ko
  text: 가나안 사람들과 이 땅의 모든 주민이 듣고, 우리를 에워싸서 우리 이름을 땅에서 끊어 버릴 것입니다[b]. 그러면 주님께서는 주님의 큰 이름을 위해[a] 무엇을 하시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주님의 큰 이름을 위하여’.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 이름을 끊다’는 한 민족의 계속되는 존재와 기억을 없애 버린다는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  english_pob_choice: will hear
  chosen_korean: 듣고
  alternatives_korean:
  - 들을 것입니다
  - 듣게 될 것입니다
  lexicon: HALOT
  rationale: 미래적 결과를 나타내는 동사로서, 여기서는 장차 벌어질 상황을 간결하게 살려 ‘듣고’로 옮겼습니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanites
  chosen_korean: 가나안 사람들
  alternatives_korean:
  - 가나안 족속
  - 가나안인들
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 집합적으로 쓰인 민족명을 한국어에서도 복수 집합 표현으로 자연스럽게 반영했습니다.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: and all the inhabitants of the land
  chosen_korean: 이 땅의 모든 주민
  alternatives_korean:
  - 그 땅에 사는 모든 사람들
  - 땅의 모든 거주자들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주자들/주민’의 뜻이고, כאן의 הָאָרֶץ는 문맥상 보편적 ‘땅’보다 특정 지역을 가리키므로 ‘이 땅’으로 옮겼습니다.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ
  english_pob_choice: and cut off our name
  chosen_korean: 우리 이름을 땅에서 끊어 버릴 것입니다
  alternatives_korean:
  - 우리 이름을 지워 버릴 것입니다
  - 우리 명성을 없애 버릴 것입니다
  lexicon: HALOT
  rationale: ‘이름을 끊다’는 히브리어 관용구로 사람의 계속되는 존재와 기억을 없애는 뜻이므로, 관용적 의미를 살리되 ‘이름’을 유지했습니다.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  english_pob_choice: for your great name
  chosen_korean: 주님의 큰 이름을 위해
  alternatives_korean:
  - 주님의 큰 이름을 위하여
  - 주님의 크신 이름 때문에
  lexicon: HALOT
  rationale: ל는 여기서 목적/관련의 폭을 가지므로, 하나님의 공적 명예를 가리키는 표현을 자연스럽게 살려 ‘위해’로 옮겼습니다.
theological_decisions:
- issue: ‘주님의 큰 이름’의 의미
  chosen_reading: 열방 앞에서 드러나는 하나님의 공적 명예와 언약적 이름
  alternative_readings:
  - 단순히 하나님의 이름 자체에 대한 추상적 언급
  - 이스라엘의 처지와 무관한 개인적 호칭
  rationale: 문맥상 이스라엘의 멸망이 주변 민족에게 야훼의 명예 문제로 비칠 수 있다는 우려이므로, 이름의 공적·언약적 차원을 드러내되 과도한 설명은 본문에 넣지 않았습니다.
  doctrine_reference: 언약과 하나님의 명예(민족들 앞에서의 이름의 거룩함)
