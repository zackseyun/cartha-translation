  - severity: low
    issue: 각주 b의 분류 및 단정적 설명
    rationale: 마지막 여성 단수 접미사는 이문(textual variant)이 아니라 지시 대상의 문법적 해석 문제입니다. 겉옷을 가리키는 해석이 유력하되, 주석은 이를 ‘가장 가까운 앞의 여성형 명사’라고 과도하게 단정하지 않는 편이 좋습니다.
