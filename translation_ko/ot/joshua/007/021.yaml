  to: 나는 전리품 가운데서 시날에서 온 아름다운 겉옷 하나와 은 이백 세겔과 무게가 오십 세겔인 금 한 조각을 보았습니다. 나는 그것들을 탐내어 가져갔습니다. 보십시오, 그것들은 내 장막 안의 땅속에 숨겨져 있고, 은은 그 겉옷 아래에 있습니다.[a][b]
