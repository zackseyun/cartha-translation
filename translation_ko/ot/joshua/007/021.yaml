id: JOS.7.21
reference: Joshua 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
  footnotes:
  - marker: a
    text: Hebrew literally 'a tongue of gold'; the phrase likely refers to a tongue-shaped piece, rendered here as 'bar of gold.' Traditional English versions often have 'wedge of gold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one fine robe from Shinar.' The Hebrew term can refer to a splendid outer garment or mantle.
    reason: lexical_alternative
  - marker: c
    text: 'The final pronoun is feminine singular, likely referring to the cloak: ''the silver underneath it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그 탈취물 가운데서 시날의 아름다운 겉옷 하나와 은 이백 세겔과, 무게가 오십 세겔 되는 금 한 덩이를 보았습니다. 나는 그것들을 탐내어 가져왔습니다. 보십시오, 그것들은 내 장막 안 땅속에 숨겨져 있고, 은은 그것 아래에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''시날의 아름다운 겉옷''은 히브리어가 가리키는 값비싼 외투류를 반영한 표현입니다. 전통 번역의 ''외투/망토''와 비슷한 범주입니다.'
    reason: lexical_alternative
  - marker: b
    text: 마지막 여성 단수 대명사는 가장 가까운 앞의 여성형 명사인 '겉옷'을 가리키는 것으로 보는 해석을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בַשָּׁלָל
  english_pob_choice: among the spoil
  chosen_korean: 그 탈취물 가운데서
  alternatives_korean:
  - 그 전리품 가운데서
  - 탈취한 것들 가운데서
  lexicon: HALOT
  rationale: 전쟁 맥락의 שָׁלָל을 한국어로는 '탈취물'이 자연스럽고, ב의 처소성을 '가운데서'로 살렸습니다.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  english_pob_choice: one beautiful cloak from Shinar
  chosen_korean: 시날의 아름다운 겉옷 하나
  alternatives_korean:
  - 시날의 좋은 외투 하나
  - 시날의 고운 망토 하나
  lexicon: HALOT
  rationale: אַדֶּרֶת는 겉옷/망토류의 넓은 의미가 있어, 문맥상 품위 있는 외투를 뜻하는 '겉옷'으로 옮겼고, טוֹבָה는 단순한 '좋은'보다 미감이 드러나는 '아름다운'이 적절합니다.
- source_word: וּלְשׁוֹן זָהָב אֶחָד חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  english_pob_choice: one bar of gold weighing fifty shekels
  chosen_korean: 무게가 오십 세겔 되는 금 한 덩이
  alternatives_korean:
  - 오십 세겔 무게의 금 한 바
  - 금 한 조각, 무게가 오십 세겔 되는
  lexicon: HALOT
  rationale: לָשׁוֹן의 문자적 '혀' 이미지를 그대로 옮기기보다, 본문이 가리키는 금 조각/주괴의 실물을 한국어로 자연스럽게 드러내는 '금 한 덩이'를 택했습니다.
- source_word: וְהִנָּם טְמוּנִים בָּאָרֶץ בְּתוֹךְ הָאֳהֳלִי וְהַכֶּסֶף תַּחְתֶּיהָ
  english_pob_choice: and look, they are hidden in the ground inside my tent, with the silver underneath it
  chosen_korean: 보십시오, 그것들은 내 장막 안 땅속에 숨겨져 있고, 은은 그것 아래에 있습니다.
  alternatives_korean:
  - 보십시오, 그것들은 내 장막 안에 땅에 묻혀 있고, 은은 그것 아래 있습니다.
  - 보십시오, 그것들은 내 장막 속 땅에 숨겨져 있고, 은은 그것 밑에 있습니다.
  lexicon: HALOT
  rationale: הִנָּם의 주목 환기를 '보십시오'로 살리고, בָּאָרֶץ는 이 경우 '땅속에'로, 마지막 여성 단수 대명사는 가장 가까운 앞말인 겉옷을 가리키는 것으로 보아 '그것'으로 유지했습니다.
theological_decisions:
- issue: 아간의 고백에서 죄의 자기인식과 고발적 어조
  chosen_reading: '''탐내어 가져왔습니다''로 옮겨, 단순한 소유가 아니라 불법적 욕망과 취득이 함께 드러나게 했습니다.'
  alternative_readings:
  - '''원해서 가져왔습니다'''
  - '''원하여 취했습니다'''
  rationale: חמד은 단순한 원함보다 금지된 대상을 향한 탐욕의 뉘앙스가 강하므로, 본문의 도덕적 무게를 흐리지 않도록 '탐내다'를 유지했습니다.
  doctrine_reference: 십계명의 탐내지 말라(출 20:17; 신 5:21)와 연결되는 죄의 성격
- issue: 마지막 여성 단수 대명사의 지시 대상
  chosen_reading: '''그것''을 겉옷을 가리키는 것으로 이해해 ''은은 그것 아래에 있습니다''라고 옮겼습니다.'
  alternative_readings:
  - 대명사를 복수로 처리하여 '그것들 아래에'
  - '''은은 그 옆에 있습니다'''
  rationale: 영어 POB의 주석처럼 히브리어 여성 단수 대명사는 가장 가까운 여성형 명사인 겉옷을 가리키는 것이 자연스럽고, 따라서 은이 겉옷 아래에 놓였다는 장면이 분명해집니다.
  doctrine_reference: 본문의 문법적 지시 관계 보존
