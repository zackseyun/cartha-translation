  source_fidelity: 본문의 주요 동작과 관계는 대체로 충실합니다. 다만 מַלְאָכִים는 이 문맥에서 인간 파견자를 가리키므로 현대 표준어에서는 ‘전령들’이 ‘사자들’보다 더 분명하고 자연스럽습니다. טְמוּנָה의 선행사는 문법적으로 여성 단수이나, 앞 절의 물건을 가리키는 것으로 보이며 한국어 ‘그것’은 이 제한된 지시 관계를 무리 없이 보존합니다.
  naturalness: ‘보십시오’는 וְהִנֵּה의 발견·주목 표지를 합쇼체로 자연스럽게 재현합니다. ‘사자들’은 현대 한국어에서 다소 고풍스럽고 다른 의미로도 받아들여질 수 있어, 공적 서사 문체에서는 ‘전령들’이 더 자연스럽습니다.
  terminology: ‘전령들’은 천사라는 오해 없이 인간 messenger의 뜻을 전달합니다. ‘장막’, ‘은’, ‘숨겨져’, ‘그 아래’는 본문의 서사적·공간적 의미를 적절히 반영합니다.
