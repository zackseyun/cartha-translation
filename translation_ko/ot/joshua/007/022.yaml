  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
  footnotes:
  - marker: a
    text: Or 'and the silver was underneath it.' The Hebrew simply coordinates 'and the silver' with the preceding clause; English may express this either as an additional item in the scene or as a separate clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 전령들을 보내자 그들이 그 장막으로 달려갔습니다. 보십시오, 그것이 그의 장막 안에 숨겨져 있었고, 은은 그 아래에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은이 그 아래에 있었다.’ 히브리어는 ‘그리고 은’을 앞 절과 단순히 연결하므로, 이를 숨겨진 물건에 덧붙인 내용으로도 별도의 절로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사신들
  lexicon: HALOT
  rationale: 여기서는 여호수아가 보낸 인간 전달자들이므로 ‘사자들’이 문맥에 맞고, ‘천사’ 오해를 피하면서도 파견된 사람이라는 기능을 드러냅니다.
- source_word: וַיָּרֻצוּ
  english_pob_choice: they ran
  chosen_korean: 달려갔습니다
  alternatives_korean:
  - 뛰어갔습니다
  - 급히 갔습니다
  lexicon: HALOT
  rationale: רץ의 기본 동작성을 살려 실제로 달리는 움직임을 드러냈습니다. ‘급히 갔습니다’보다 장면의 긴박감이 더 직접적입니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 서사에서 발견을 알리는 감탄적 표지를 한국어 합쇼체로 옮겨, 문맥 전환과 놀라움을 자연스럽게 살렸습니다.
- source_word: תַּחְתֶּיהָ
  english_pob_choice: underneath it
  chosen_korean: 그 아래에
  alternatives_korean:
  - 그 밑에
  - 그 아래쪽에
  lexicon: HALOT
  rationale: 여성형 대명사 어미가 앞선 감춰진 물건을 가리키므로, 한국어에서는 자연스러운 위치 표현인 ‘그 아래에’로 처리했습니다.
theological_decisions:
- issue: ‘사자들’의 의미가 천사가 아니라 인간 파견자임을 어떻게 드러낼지
  chosen_reading: 문맥상 여호수아의 인간 전달자들이므로 ‘사자들’로 번역하되, 천사적 의미는 배제했습니다.
  alternative_readings:
  - 천사들
  - 전령들
  rationale: 본문은 전투 후 조사 장면으로, 여호수아가 사람을 보내는 맥락입니다. 한국어에서 ‘사자들’은 고어적이지만 문맥상 파견된 사람을 충분히 가리키며, 원문의 의미 범위를 해치지 않습니다.
  doctrine_reference: 서사 문맥 해석, מַלְאָךְ의 의미 범위
