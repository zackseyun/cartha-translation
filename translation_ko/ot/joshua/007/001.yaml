reference: Joshua 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the devoted things,' or more formally 'the ban.' The Hebrew חֵרֶם refers to persons or things set apart to God for destruction or removal from ordinary human use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이스라엘 자손이 바쳐진 것들[a]에 대해 신의를 저버렸습니다. 곧 갈미의 아들, 삽디의 아들, 세라의 아들인 유다 지파 아간이 바쳐진 것들 중에서 일부를 가져갔기 때문입니다. 그래서 야훼의 진노가 이스라엘 자손에게 타올랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바쳐진 것들’, 더 형식적으로는 ‘금지된 것/진멸령 아래 놓인 것’입니다. 히브리어 חֵרֶם은 하나님께 바쳐져 일반적 인간 사용에서 제거되거나 진멸에 넘겨진 사람이나 물건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ / מַעַל
  english_pob_choice: acted unfaithfully / unfaithfully
  chosen_korean: 신의를 저버렸습니다
  alternatives_korean:
  - 불성실하게 행동했습니다
  - 배신했습니다
  - 죄를 범했습니다
  lexicon: HALOT
  rationale: מעל의 언약적 뉘앙스를 살려 단순한 일반 죄가 아니라 신뢰를 깨뜨린 행위로 드러내기 위해 ‘신의를 저버리다’를 택했습니다.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  english_pob_choice: the things devoted to destruction
  chosen_korean: 바쳐진 것들
  alternatives_korean:
  - 멸절에 바쳐진 것들
  - 저주 아래 놓인 것들
  - 바쳐진 물건들
  lexicon: HALOT
  rationale: 한국어 본문은 간결하게 처리하되, 각주에서 חֵרֶם의 의미 범위를 설명하여 ‘바쳐진 것들’이 단순한 헌물보다 더 강한 전용/진멸의 의미를 지님을 보존했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: took some
  chosen_korean: 일부를 가져갔기 때문입니다
  alternatives_korean:
  - 가져갔기 때문입니다
  - 취했습니다
  - 취하여 갔기 때문입니다
  lexicon: HALOT
  rationale: מִן이 만드는 부분적 의미를 반영하여, 아간이 전체가 아니라 ‘일부’를 취했다는 점을 명시했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 하나님의 고유명 ‘야훼’를 사용하여 원문 고유성을 살렸습니다.
theological_decisions:
- issue: 집단 책임과 개인 책임의 긴장
  chosen_reading: ‘이스라엘 자손’이 주어로 남아 있으면서, 곧바로 아간의 구체적 행위를 병기해 공동체 전체의 책임과 한 개인의 범죄를 함께 드러냈습니다.
  alternative_readings:
  - ‘이스라엘이’로 단순화
  - 아간만을 주어로 삼아 공동체성을 약화
  rationale: 히브리어는 공동체적 언약 위반과 그에 따른 공동체적 결과를 함께 제시하므로, 이를 매끈하게 풀어 한쪽으로만 돌리지 않았습니다.
  doctrine_reference: 공동체적 언약 책임을 보존
