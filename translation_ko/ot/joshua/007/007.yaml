source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
  footnotes:
  - marker: a
    text: Hebrew 'Lord YHWH'; rendered 'Lord GOD' in English to reflect the divine name without the awkward repetition 'Lord LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 여호수아가 말했습니다. 「아, 주 야훼여,[a] 어찌하여 이 백성을 요단강을 건너게 하셨습니까? 우리를 아모리 사람들의 손에 넘겨 멸망시키시려는 것입니까? 우리가 요단강 건너편에 살기로 했더라면 좋았을 것을!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아도나이 야훼’입니다. ‘아도나이’는 ‘주’를, ‘야훼’는 하나님의 고유한 이름을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲהָהּ
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 아아
  - 오
  lexicon: HALOT
  rationale: 탄식과 곤혹을 나타내는 감탄사로, 짧고 급작스러운 느낌을 살려 '아'로 옮겼습니다.
- source_word: יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 문맥상 아도나이와 결합된 야훼 이름을 분명히 드러내기 위해 '주 야훼'로 옮겼습니다.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר אֶת הָעָם הַזֶּה אֶת הַיַּרְדֵּן
  english_pob_choice: have you brought this people across the Jordan at all
  chosen_korean: 이 백성을 요단을 건너게 하셔서
  alternatives_korean:
  - 이 백성을 요단강 건너편으로 데려가셔서
  - 이 백성을 요단을 건너가게 하셔서
  lexicon: HALOT
  rationale: 히필의 '건너게 하다'를 자연스럽게 살려, 요단을 통과시킨 행위를 그대로 표현했습니다.
- source_word: בְּיַד הָאֱמֹרִי
  english_pob_choice: into the hand of the Amorites
  chosen_korean: 아모리 사람의 손에 넘기시고
  alternatives_korean:
  - 아모리 사람들의 손에 넘기시고
  - 아모리의 손에 넘기시고
  lexicon: HALOT
  rationale: 히브리어 관용구를 보존하되, 한국어에서 의미가 분명하도록 '손에 넘기시고'로 옮겼습니다.
- source_word: הוֹאַלְנוּ
  english_pob_choice: we had been willing
  chosen_korean: 우리가 ... 살기를 원했더라면 좋았을 것을
  alternatives_korean:
  - 우리가 ... 살기를 기꺼이 했더라면
  - 우리가 ... 살기로 동의했더라면
  lexicon: HALOT
  rationale: 원문의 의지·동의 뉘앙스를 살리되, '원했더라면 좋았을 것을'로 후회의 가정을 현대 한국어에 자연스럽게 표현했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 공개 번역 원칙에 따라 여호와 대신 야훼를 사용해 원문 고유한 신명성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 문장 내부 직접화법의 탄식 어조
  chosen_reading: 아, 주 야훼여
  alternative_readings:
  - 오, 주 야훼여
  - 아아, 주 야훼여
  rationale: 여호수아의 탄식이므로 감탄사를 유지하되, 공식적 서술 속 직접화법에 맞는 절제된 어조로 처리했습니다.
  doctrine_reference: Korean style guideline — direct speech may shift register appropriately
