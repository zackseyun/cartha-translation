revisions:
- from: 여호수아가 말했습니다. 「아, 주 야훼여, 어찌하여 이 백성을 요단을 건너게 하셔서 우리를 아모리 사람의 손에 넘기시고, 우리를 멸망시키려 하십니까? 차라리 우리가 요단 건너편에 살기를 원했더라면 좋았을 것을!」[a]
  to: 여호수아가 말했습니다. 「아, 주 야훼여,[a] 어찌하여 이 백성을 요단강을 건너게 하셨습니까? 우리를 아모리 사람들의 손에 넘겨 멸망시키시려는 것입니까? 우리가 요단강 건너편에 살기로 했더라면 좋았을 것을!」
  rationale: 목적을 나타내는 히브리어 부정사 구문의 관계를 한국어 질문으로 분명히 했고, הוֹאַלְנוּ의 자발적 결단·동의의 뉘앙스를 ‘살기로 했더라면’에 반영했습니다. 신명 표기는 ‘야훼’를 유지하되, 각주를 한국어 독자에게 직접 유익한 설명으로 수정했습니다.
