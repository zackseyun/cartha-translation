  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
  footnotes:
  - marker: a
    text: Or 'before the ark of Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Throwing dust on the head was a customary sign of grief, humiliation, or mourning.
    reason: cultural_note
translation:
  language: ko
  text: 그때 여호수아는 자기 옷을 찢고, 얼굴을 땅에 대고 엎드려 야훼의 궤 앞에 저녁까지 누워 있었습니다. 그와 함께 이스라엘의 장로들도 그러했고, 그들은 자기 머리에 흙을 뿌렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 궤 앞에’는 ‘야훼의 궤 앞에서’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 머리에 흙을 뿌리는 것은 슬픔, 굴욕, 애도의 관습적 표시였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע / שִׂמְלֹתָיו
  english_pob_choice: tore his clothes
  chosen_korean: 자기 옷을 찢고
  alternatives_korean:
  - 옷을 찢고
  - 그의 옷을 찢고
  lexicon: HALOT
  rationale: אָרֵעַ의 애도 동작을 한국어에서 자연스럽고 구체적으로 드러내기 위해 ‘옷을 찢다’를 사용했습니다.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  english_pob_choice: fell facedown to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드러져
  - 땅에 엎드려
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘완전한 엎드림’ 자세를 살리면서도 현대 한국어로 자연스럽게 읽히도록 옮겼습니다.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  english_pob_choice: before the ark of Yahweh
  chosen_korean: 야훼의 궤 앞에
  alternatives_korean:
  - 야훼의 언약궤 앞에
  - 여호와의 궤 앞에
  lexicon: HALOT
  rationale: יהוה는 본문 그대로 고유명사 ‘야훼’로 옮기고, אֲרוֹן은 문맥상 언약궤를 가리키지만 본문 표지를 유지해 간결하게 ‘궤’로 렌더링했습니다.
- source_word: עַד הָעֶרֶב
  english_pob_choice: until evening
  chosen_korean: 저녁까지
  alternatives_korean:
  - 해질 때까지
  - 저녁 무렵까지
  lexicon: HALOT
  rationale: 시간 표현을 한국어 관용법에 맞게 간결하게 옮겼습니다.
- source_word: וַיַּעֲל֥וּ עָפָ֖ר עַל רֹאשָׁם
  english_pob_choice: they put dust on their heads
  chosen_korean: 자기 머리에 흙을 뿌렸습니다
  alternatives_korean:
  - 머리에 흙을 얹었습니다
  - 머리에 먼지를 뿌렸습니다
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 동사 ‘뿌리다’를 택해, 수치와 애도의 관습적 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명 사상을 흐리지 않기 위해 고유명사 표기 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
