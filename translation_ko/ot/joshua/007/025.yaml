source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
  footnotes:
  - marker: a
    text: Hebrew 'Why have you troubled us? The LORD will trouble you'—a wordplay on the same verb is preserved here with 'bring trouble.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from singular ('him') to plural ('them') after Achan is named, likely encompassing Achan together with others or with his household and possessions; the translation preserves this shift rather than smoothing it out.
    reason: alternative_reading
  - marker: c
    text: Two different Hebrew verbs for stoning are used in this verse; both refer to execution by stones and are rendered similarly in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 말했습니다. “당신이 우리를 왜 괴롭게 했습니까? 야훼께서 오늘 당신을 괴롭게 하실 것입니다.” 그러자 온 이스라엘이 그를 돌로 쳤고, 그들을 불로 태웠으며 돌들로 그들을 돌로 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 같은 동사 반복(‘괴롭게 하다’)을 살리기 위해 두 표현을 같은 어간으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 아간을 가리키는 단수에서 복수로 바뀌며, 아간과 함께 관련된 대상들까지 포함하는 것으로 읽힐 수 있습니다. 본문은 이 전이를 매끈하게 정리하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 이 절에는 서로 다른 두 동사(רגם, סקל)가 쓰여 있지만, 둘 다 돌로 치는 처형을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  english_pob_choice: troubled us / will trouble you
  chosen_korean: 우리를 괴롭게 했습니까 / 당신을 괴롭게 하실 것입니다
  alternatives_korean:
  - 우리를 혼란에 빠뜨렸습니까 / 당신을 혼란에 빠뜨리실 것입니다
  - 우리를 곤경에 빠뜨렸습니까 / 당신을 곤경에 빠뜨리실 것입니다
  lexicon: HALOT
  rationale: 히브리어 עכר의 핵심은 ‘괴롭게 하다, 혼란케 하다, trouble을 일으키다’이므로, 동사의 반복과 말장난을 살리기 위해 같은 한국어 어간 ‘괴롭-’으로 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה는 관용적 대치어가 아니라 신적 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיִּרְגְּמוּ / וַיִּסְקְלוּ
  english_pob_choice: stoned him with stones / stoned them with stones
  chosen_korean: 그를 돌로 쳤고 … 돌들로 그들을 돌로 쳤습니다
  alternatives_korean:
  - 그를 돌로 쳤고 … 돌로 그들을 쳤습니다
  - 그를 돌로 처형했고 … 돌로 그들을 처형했습니다
  lexicon: HALOT
  rationale: 두 동사 רגם, סקל은 모두 돌로 치는 처형을 뜻하지만 서로 다른 동사를 사용하므로, 한국어에서는 자연스러움을 유지하되 ‘돌들로’와 반복 구조로 원문의 중첩을 어느 정도 반영했습니다.
- source_word: כָל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 모두
  lexicon: HALOT
  rationale: 전체 공동체의 집행이라는 집합적 의미를 담기 위해 ‘온 이스라엘’을 택했습니다.
theological_decisions:
- issue: 단수에서 복수로 바뀌는 대명사
  chosen_reading: ‘그를’과 ‘그들을’을 함께 살려, 히브리어의 단수-복수 전이를 본문 그대로 유지했습니다.
  alternative_readings:
  - 전부 단수로 평준화하기
  - 전부 복수로 풀어 가족/재산까지 일괄 지시로 정리하기
  rationale: 본문은 Achan을 가리키는 단수에서 복수로 이동하므로, 이를 매끈하게 통일하면 본문의 긴장과 해석 여지를 지워버립니다. POB의 번역 방침에 따라 이 변이를 보존했습니다.
  doctrine_reference: 'Translation philosophy: theological tension should be preserved rather than resolved.'
