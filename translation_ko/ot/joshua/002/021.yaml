  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
  footnotes:
  - marker: a
    text: Or “the scarlet line.” The Hebrew expression can denote a cord, line, or rope used as a visible marker.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다. 「당신들의 말대로 그렇게 하겠습니다.」 그러고는 그들을 보내 주었고, 그들은 떠났습니다. 그리고 그녀는 창문에 진홍색 줄을 매었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문맥에 따라 끈, 줄, 밧줄을 가리킬 수 있습니다. 여기서는 표지로 매다는 물리적 선을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  english_pob_choice: According to your words
  chosen_korean: 당신들의 말대로
  alternatives_korean:
  - 당신들의 말에 따라
  - 당신들이 말한 대로
  lexicon: HALOT
  rationale: 복수형 ‘말들’과 2인칭 복수 접미사의 뜻을 살리면서, 라합이 정탐꾼들의 조건을 받아들이는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: כֵּן הוּא
  english_pob_choice: so be it
  chosen_korean: 그렇게 하겠습니다
  alternatives_korean:
  - 그리하겠습니다
  - 그렇게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 동의와 수락을 나타내는 관용구로서, 단순한 정보 진술보다 약속과 승인에 가까운 한국어로 옮겼습니다.
- source_word: תִּקְוַת הַשָּׁנִי
  english_pob_choice: the scarlet cord
  chosen_korean: 진홍색 줄
  alternatives_korean:
  - 진홍색 끈
  - 진홍색 노끈
  - 진홍색 실
  lexicon: HALOT
  rationale: 문맥상 표지로 매다는 구체적 물체를 가리키므로 ‘희망’이 아니라 물리적 도구로 이해해야 하며, 한국어에서는 ‘줄’이 가장 무난한 대응입니다.
- source_word: בַּחַלּוֹן
  english_pob_choice: in the window
  chosen_korean: 창문에
  alternatives_korean:
  - 창문 안에
  - 창문 속에
  lexicon: HALOT
  rationale: 위치 부사의 기능을 살려, 실제로 창문에 매단다는 행위를 한국어 관용에 맞게 표현했습니다.
