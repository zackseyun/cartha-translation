  source_fidelity: 원문은 여호수아가 싯딤에서 두 남자를 비밀리에 정탐꾼으로 보내고, 그 땅과 여리고를 보라고 지시한 뒤, 그들이 라합이라는 매춘부의 집에 이르러 այնտեղ 누웠다고 말합니다. 개정문은 이 순서와 '그 땅과 여리고'의 병렬을 보존하며, 숙박이나 성적 행위를 덧붙이지 않습니다.
