  lexicon: HALOT
  rationale: 지명은 음역하는 것이 원문 지시를 가장 잘 보존합니다.
- source_word: מְרַגְּלִים
  english_pob_choice: as spies
  chosen_korean: 정탐하게 하며
  alternatives_korean:
