  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
  footnotes:
  - marker: a
    text: Or “the land and Jericho.” The Hebrew can be read as naming both the land generally and Jericho specifically.
    reason: lexical_alternative
  - marker: b
    text: Or “the house of an innkeeper.” Some have argued this from context or later tradition, but the Hebrew word ordinarily means “prostitute.”
    reason: alternative_reading
  - marker: c
    text: Or “they lodged there.” The Hebrew literally says “they lay down there.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 눈의 아들 여호수아가 싯딤에서 두 사람을 몰래 보내어 정탐하게 하며 말했습니다. “가서 그 땅과 여리고를 살펴보십시오.” 그래서 그들은 가서 라합이라는 기생의 집에 들어가 거기서 누웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 땅, 곧 여리고를.” 히브리어는 일반적인 그 땅과 여리고를 함께 지칭하는 것으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “여관 주인의 집.” 일부는 문맥이나 후대 전통을 근거로 그렇게 보지만, 히브리어의 기본 뜻은 “기생”입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “그들은 거기서 묵했습니다.” 히브리어는 문자적으로 “거기서 누웠습니다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשִּׁטִּים
  english_pob_choice: from Shittim
  chosen_korean: 싯딤에서
  alternatives_korean:
