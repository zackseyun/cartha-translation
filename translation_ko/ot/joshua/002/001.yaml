  rationale: 원문의 문자적 동작을 살리되, 한국어에서는 성적 함의를 만들지 않는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: 라합의 직업 표기
  chosen_reading: 기생
  alternative_readings:
  - 여관 주인
  - 창기
  rationale: 원문의 זוֹנָה는 통상 ‘기생/창기’에 해당하며, 본문이 제시하는 사회적·도덕적 긴장을 흐리지 않도록 해석적 완곡어를 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: וַיִּשְׁכְּבוּ שָׁמָּה의 의미 범위
  chosen_reading: 거기서 누웠습니다
  alternative_readings:
  - 거기서 묵었습니다
  - 거기서 잠들었습니다
  rationale: 본문이 말하는 이상으로 숙박 사정을 구체화하지 않고, 성적 행위도 암시하지 않도록 문자적이면서도 절제된 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
