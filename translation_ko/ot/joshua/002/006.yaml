  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: ko
  text: 그러나 그녀는 그들을 지붕으로 올라가게 한 뒤, 지붕에 널어 둔 아마 줄기들 속에 그들을 숨겼습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “그녀를 위해 지붕에 널어 둔 아마 줄기들 속에”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הִ֖יא
  english_pob_choice: But she
  chosen_korean: 그러나 그녀는
  alternatives_korean:
  - 그녀는
  - 그리고 그녀는
  lexicon: וְ + הִיא
  rationale: 문맥상 라합의 행동을 앞선 전개와 대조해 이어 주므로 ‘그러나’로 처리했고, 주어는 자연스러운 현대 한국어로 ‘그녀는’이라 옮겼습니다.
- source_word: הֶעֱלָ֣תַ/ם הַ/גָּ֑גָ/ה
  english_pob_choice: had brought them up to the roof
  chosen_korean: 그들을 지붕으로 올라가게 한 뒤
  alternatives_korean:
  - 그들을 지붕으로 데리고 올라간 뒤
  - 그들을 지붕으로 올려 보낸 뒤
  lexicon: עלה Hiphil
  rationale: 히필의 사역적 의미를 살려 ‘올라가게 하다’로 옮겼고, 완료 서술의 선행 행위를 ‘-한 뒤’로 풀어 영어 POB의 과거완료 감각을 반영했습니다.
- source_word: וַֽ/תִּטְמְנֵ/ם֙
  english_pob_choice: and hidden them
  chosen_korean: 숨겼습니다
  alternatives_korean:
  - 감추었습니다
  - 은닉했습니다
  lexicon: טמן
  rationale: 동사의 핵심 의미를 직역하되 현대 문체에 자연스러운 ‘숨겼습니다’를 택했습니다.
- source_word: בְּ/פִשְׁתֵׁ֣י הָ/עֵ֔ץ הָ/עֲרֻכ֥וֹת
  english_pob_choice: among the stalks of flax laid out
  chosen_korean: 아마 줄기들 속에
  alternatives_korean:
  - 삼베 줄기들 속에
  - 아마 섬유들 사이에
  lexicon: פשתים / עץ
  rationale: 히브리어의 ‘아마(Flax)’와 ‘널어 놓은 줄기들’ 이미지를 살려, 한국어로는 의미가 분명한 ‘아마 줄기들’로 옮겼습니다.
- source_word: לָ֖/הּ
  english_pob_choice: for her
  chosen_korean: 그녀를 위해
  alternatives_korean:
  - 그녀에게
  - 그녀를 위해 마련된
  lexicon: ל + 그녀
  rationale: 영어 POB의 개정 포인트인 ‘for her’를 반영해, 널어 둔 아마가 라합의 소유·사용 범위에 있음을 드러내도록 ‘그녀를 위해’의 의미를 내포한 ‘지붕에 널어 둔’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 서술 순서와 완료감
  chosen_reading: 한국어에서는 원문의 사건 진행을 따라 ‘올라가게 한 뒤… 숨겼습니다’로 정리해, 라합의 기민한 행동이 선행·결과 관계로 분명히 드러나게 했습니다.
  alternative_readings:
  - 그녀는 그들을 지붕으로 올리고 아마 줄기들 속에 숨겼습니다.
  - 그녀는 그들을 지붕으로 데려가 숨겼습니다.
  rationale: 히브리어 연속 동사의 서술 흐름을 현대 한국어에서 무리 없이 재현하기 위한 선택입니다.
  doctrine_reference: 서술적 정확성
