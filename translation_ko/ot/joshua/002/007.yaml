language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
  footnotes:
  - marker: a
    text: Or 'to the crossing places'; that is, the shallow places of the Jordan where one could cross.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들은 요단 길을 따라, 곧 건널목들까지 그들을 뒤쫓았습니다. 그리고 추격자들이 그들을 뒤쫓아 나간 뒤에 성문을 닫았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건널목들’은 강을 건널 수 있는 얕은 지점, 곧 여울목을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  english_pob_choice: And the men
  chosen_korean: 그 사람들은
  alternatives_korean:
  - 그 남자들은
  - 그리고 그들은
  lexicon: HALOT
  rationale: 문맥상 여리고 왕의 추격자들을 가리키므로 특정 인물을 드러내되, 한국어에서는 앞선 문맥을 이어 받는 자연스러운 지시 표현을 택했습니다.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  english_pob_choice: pursued after them
  chosen_korean: 그들을 뒤쫓았습니다
  alternatives_korean:
  - 그들을 추격했습니다
  - 그 뒤를 쫓았습니다
  lexicon: HALOT
  rationale: רדף의 기본 뜻을 살려 ‘뒤쫓다’로 옮기고, 중복되는 전치사적 표현은 한국어에서 자연스럽게 한 번으로 통합했습니다.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  english_pob_choice: on the way to the Jordan
  chosen_korean: 요단 길을 따라
  alternatives_korean:
  - 요단으로 가는 길로
  - 요단 쪽 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 단순한 방향이 아니라 실제 이동 경로를 뜻하므로, ‘길을 따라’로 길의 진행성을 살렸습니다.
- source_word: עַל הַמַּעְבְּרוֹת
  english_pob_choice: as far as the fords
  chosen_korean: 건널목들까지
  alternatives_korean:
  - 나루터들까지
  - 여울목들까지
  lexicon: HALOT
  rationale: מַעְבְּרוֹת는 강을 건너는 장소를 가리키므로 ‘건널목들’로 옮겼고, 복수형을 살려 여러 건넘 지점을 가리키게 했습니다.
- source_word: סָגָרוּ אַחֲרֵי
  english_pob_choice: they shut the gate behind them
  chosen_korean: 성문을 닫았습니다
  alternatives_korean:
  - 뒤에서 성문을 닫았습니다
  - 성문을 그들 뒤로 닫았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘뒤에’라는 방향 표현은 한국어에서는 동작의 결과로 자연스럽게 드러나므로, 성문을 닫았다는 사실을 간결하게 표현했습니다.
theological_decisions:
- issue: 추격의 긴박함과 반복 표현의 보존
  chosen_reading: ‘뒤쫓았습니다’와 ‘추격자들이 그들을 뒤쫓아 나간 뒤에’를 함께 써서 반복되는 추격의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘쫓아갔습니다’로 더 평이하게 옮길 수 있음
  - 반복을 줄여 한 번만 언급할 수 있음
  rationale: 원문은 추격 동작을 반복해 사건의 급박함을 강조하므로, 한국어도 그 반복 효과를 남겨 두는 편이 본문 흐름을 더 잘 드러냅니다.
  doctrine_reference: 서사적 강조의 보존
- issue: ‘성문’의 구체성
  chosen_reading: 단순한 ‘문’이 아니라 ‘성문’을 사용했습니다.
  alternative_readings:
  - 문
  - 도성문
  rationale: 문맥상 도시의 방어 구조물인 שער를 가리키므로, 한국어에서도 성읍의 문이라는 점을 분명히 하는 것이 원문의 상황을 정확히 전달합니다.
  doctrine_reference: 문맥 기반 서술 정확성
