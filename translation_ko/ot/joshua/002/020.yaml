source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
  footnotes:
  - marker: a
    text: Or 'this business of ours' or 'this affair of ours.' The Hebrew word can refer broadly to a matter, affair, or spoken word; here it points to the spies' secret mission.
    reason: lexical_alternative
  - marker: b
    text: Or 'we will be innocent/guiltless from your oath.' The Hebrew idiom means they would no longer be bound by the oath if she disclosed their secret.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네가 우리의 이 일[a]을 알리면, 우리는 네가 우리에게 하게 한 그 맹세에 대하여 책임이 없을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 여기서 ‘말’보다 넓게 ‘일’, ‘사건’, ‘사정’을 가리킬 수 있으며, 문맥상 정탐꾼들의 비밀 임무를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네가 우리에게 하게 한 네 맹세로부터 우리는 깨끗할 것입니다’입니다. 여기서는 그 맹세에 따른 책임이나 의무에서 벗어난다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 조건문이 앞선 약속과 대비되는 예외를 도입하므로, 한국어에서는 ‘그러나 만일’이 문맥상 가장 자연스럽고 대비를 분명히 드러냅니다.
- source_word: תַּגִּידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה
  english_pob_choice: you tell this matter of ours
  chosen_korean: 우리 이 일
  alternatives_korean:
  - 우리의 이 일
  - 우리의 이 사정
  - 우리의 이 말
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 정탐 임무와 관련된 ‘일/사건’의 뜻이 강하므로, ‘우리 이 일’로 옮겨 비밀 임무의 성격을 살렸습니다.
- source_word: וְהָיִ֣ינוּ נְקִיִּ֔ם
  english_pob_choice: then we will be free
  chosen_korean: 우리는 … 벗어나게 될 것입니다
  alternatives_korean:
  - 우리는 …에서 깨끗하게 될 것입니다
  - 우리는 …에서 무죄가 될 것입니다
  - 우리는 …에서 자유로워질 것입니다
  lexicon: HALOT
  rationale: נָקִי의 관용구는 ‘무죄’만이 아니라 의무나 책임에서 벗어남을 뜻하므로, 맹세의 구속에서 풀린다는 의미를 한국어로 분명하게 드러냈습니다.
- source_word: מִשְּׁבֻעָתֵךְ
  english_pob_choice: from your oath
  chosen_korean: 너희의 맹세에서
  alternatives_korean:
  - 너의 맹세에서
  - 너희의 서원에서
  - 너희가 한 맹세에서
  lexicon: HALOT
  rationale: 전치사 מן은 분리·해제를 나타내므로 ‘에서’로 처리했고, 공동 수신자에 대한 복수 표지를 살리기 위해 ‘너희’로 옮겼습니다.
theological_decisions:
- issue: 맹세의 구속 해제 표현
  chosen_reading: ‘우리는 … 맹세에서 벗어나게 될 것입니다’로 번역해, 단순한 도덕적 ‘깨끗함’보다 언약적·법적 구속의 해제를 드러냈습니다.
  alternative_readings:
  - 우리는 너희의 맹세에 대해 무죄가 될 것입니다
  - 우리는 너희의 맹세에서 깨끗할 것입니다
  rationale: 히브리어 관용구가 맹세의 의무로부터의 해제를 뜻하므로, 독자가 서사적 긴장을 정확히 이해하도록 법적 구속 해제의 의미를 전면화했습니다.
  doctrine_reference: 서원/맹세의 책임과 해제에 대한 성경적 언어 사용
