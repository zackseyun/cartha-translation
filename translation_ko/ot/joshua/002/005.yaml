id: JOS.2.5
reference: Joshua 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
  footnotes:
  - marker: a
    text: Or 'when it was dark'; the Hebrew phrase marks the time of the gate's closing at the onset of darkness.
    reason: lexical_alternative
translation:
  language: ko
  text: 어두워질 무렵 성문을 닫으려 할 때에 저 사람들이 나갔습니다.[a] 나는 저 사람들이 어디로 갔는지 알지 못합니다. 그들을 급히 뒤쫓으십시오. 그들을 따라잡을 것이니 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 성문을 닫으려는 때가 어둠이 시작될 무렵이었음을 나타냅니다. 또는 “어두워졌을 때”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר בַּחֹשֶׁךְ
  english_pob_choice: And when the gate was about to be shut at dark
  chosen_korean: 성문이 어두워져 닫힐 즈음에
  alternatives_korean:
  - 어두워질 때 성문이 닫히려 할 즈음에
  - 해질 무렵 성문이 닫힐 때
  lexicon: HALOT
  rationale: 문맥상 ‘성문’은 도시 성문이며, לִסְגּוֹר은 임박한 닫힘을 나타내므로 ‘닫힐 즈음에’로 자연스럽게 살렸습니다.
- source_word: הָאֲנָשִׁים יָצָאוּ
  english_pob_choice: the men went out
  chosen_korean: 그 사람들이 나갔습니다
  alternatives_korean:
  - 그 남자들이 나갔습니다
  - 그 사람들이 떠났습니다
  lexicon: HALOT
  rationale: 야간에 성문이 닫히기 전 빠져나간 동작을 간단하고 직설적으로 옮기기 위해 ‘나갔습니다’를 택했습니다.
- source_word: אָנָה הָלְכוּ
  english_pob_choice: where the men went
  chosen_korean: 어디로 갔는지
  alternatives_korean:
  - 어디로 갔는지요
  - 어디로 갔는지 모르겠습니다
  lexicon: HALOT
  rationale: אָנה는 목적지 질문이므로 한국어에서는 ‘어디로’가 가장 직접적이며, 회화체 직접 진술로 바꾸지 않고 종속절로 유지했습니다.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  english_pob_choice: Pursue them quickly
  chosen_korean: 그들을 급히 뒤쫓으십시오
  alternatives_korean:
  - 그들을 빨리 추격하십시오
  - 그들을 서둘러 뒤쫓으십시오
  lexicon: HALOT
  rationale: רִדְפוּ는 명령형 ‘뒤쫓으십시오/추격하십시오’가 מתאים하며, מַהֵר은 ‘급히’로 압박감을 살렸습니다.
- source_word: כִּי תַשִּׂיגוּם
  english_pob_choice: for you will overtake them
  chosen_korean: 그들을 따라잡을 것입니다
  alternatives_korean:
  - 그들을 따라잡게 될 것입니다
  - 그들을 붙잡을 것입니다
  lexicon: HALOT
  rationale: נשׂג의 핵심은 ‘따라잡다/추월하다’이므로, 단순한 포획보다 이동 동작을 보존하는 ‘따라잡다’로 옮겼습니다.
theological_decisions:
- issue: 라합의 진술이 사실 여부를 숨기는 기만 발화인지
  chosen_reading: 본문은 그녀의 말 내용을 보고하며, 윤리적 평가는 내포하지 않고 서술만 유지했습니다.
  alternative_readings:
  - 라합이 실제로 몰랐다고 읽는 해석
  - 정당한 속임수로 도덕적 평가를 덧붙이는 해석
  rationale: 히브리어 문장은 서술형 직접화법일 뿐이므로, 본문이 명시하지 않는 도덕 판단을 한국어 본문에 주입하지 않았습니다.
  doctrine_reference: 서사 본문 해석의 절제
