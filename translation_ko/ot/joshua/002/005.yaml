revisions:
- from: 성문이 어두워져 닫힐 즈음에 그 사람들이 나갔습니다. 나는 그 사람들이 어디로 갔는지 알지 못합니다. 그들을 급히 뒤쫓으십시오. 그들을 따라잡을 것입니다.[a]
  to: 어두워질 무렵 성문을 닫으려 할 때에 저 사람들이 나갔습니다.[a] 나는 저 사람들이 어디로 갔는지 알지 못합니다. 그들을 급히 뒤쫓으십시오. 그들을 따라잡을 것이니 말입니다.
  rationale: The revision clarifies that darkness marks the time at which the city gate was about to be closed, rather than describing the gate as becoming dark. It also relocates the note marker to the expression it explains and renders the final כי explicitly as a reason for the command. No doctrinal or ethical interpretation has been added.
  reviewer_model: gpt-5.6-terra
