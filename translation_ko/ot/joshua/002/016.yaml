    reason: lexical_alternative
  revision_rationale: The revision removes an unintended causative nuance, joins the ‘until’ clause to the concealment command, improves the final idiom, and relocates each footnote marker to its relevant lexical expression. It retains the Hebrew’s regional ambiguity for ‘mountain/hill country’ and its non-specific encounter verb.
