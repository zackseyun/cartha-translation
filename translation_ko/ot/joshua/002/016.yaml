source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
  footnotes:
  - marker: a
    text: Or "to the mountain"; the Hebrew can refer either to a specific mountain or to the surrounding hill country.
    reason: lexical_alternative
  - marker: b
    text: Or "meet you" or "come upon you"; the verb can denote encountering someone, here with hostile intent because of the context of pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그들에게 말했습니다. “산지[a]로 가십시오. 추격자들이 여러분을 마주치지 않도록[b] 하십시오. 추격자들이 돌아올 때까지 거기에서 사흘 동안 몸을 숨기십시오. 그런 뒤에 가던 길을 계속 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산지’는 특정한 산 하나라기보다 산악 지대를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마주치다’로 옮긴 말은 ‘만나다’ 또는 ‘닥치다’로도 번역할 수 있으며, 여기서는 추격 상황상 적대적인 접촉을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  english_pob_choice: to the hill country
  chosen_korean: 산지로
  alternatives_korean:
  - 산으로
  - 산악 지대로
  - 언덕 지역으로
  lexicon: HALOT
  rationale: הַר의 지리적 범위가 특정 산 한 개가 아니라 산악 지대일 수 있으므로, ‘산지’가 문맥상 은신처로 향하는 지역적 의미를 가장 자연스럽게 살립니다.
- source_word: יִפְגְּעוּ בָכֶם
  english_pob_choice: encounter you
  chosen_korean: 여러분을 만나지 못하도록
  alternatives_korean:
  - 여러분을 만나지 않도록
  - 여러분에게 닿지 않도록
  - 여러분을 마주치지 않도록
  lexicon: HALOT
  rationale: פגע는 ‘만나다/마주치다/닥치다’의 범위를 가지며, 추격 상황에서는 적대적 접촉을 피하라는 경고이므로 ‘만나지 못하도록’이 의미를 잘 보존합니다.
- source_word: וְנַחְבֵּתֶם
  english_pob_choice: hide yourselves
  chosen_korean: 숨어 있으십시오
  alternatives_korean:
  - 몸을 숨기십시오
  - 자신을 숨기십시오
  - 숨으십시오
  lexicon: HALOT
  rationale: 재귀적 의미를 한국어에서 자연스럽게 살리기 위해 단순 명령형보다 지속 상태를 드러내는 ‘숨어 있으십시오’를 택했습니다.
- source_word: לְדַרְכְּכֶם
  english_pob_choice: go on your way
  chosen_korean: 여러분의 길로 가십시오
  alternatives_korean:
  - 가던 길로 가십시오
  - 길을 떠나십시오
  - 여러분의 길을 계속 가십시오
  lexicon: HALOT
  rationale: 직역에 가까운 ‘길로 가다’를 유지하되, 한국어에서 어색한 소유격 구조를 자연스럽게 정리해 마지막 지시의 흐름을 살렸습니다.
theological_decisions:
- issue: 여성 화자의 직접 발화체와 명령형의 높임말 처리
  chosen_reading: 라합의 발화는 서술은 합쇼체로 두고, 인용문 안의 지시는 공손한 명령형(가십시오/하십시오)으로 처리했습니다.
  alternative_readings:
  - 인용문 안에서도 평서형으로 낮추는 방식
  - 더 강한 명령조로 단정하는 방식
  rationale: 원문은 긴급한 지시이지만 한국어 출판문맥에서는 정중한 명령형이 정보와 긴박감을 함께 전달합니다.
  doctrine_reference: 문체/화행
