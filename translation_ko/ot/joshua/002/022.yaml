base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
  footnotes:
  - marker: a
    text: Or "to the mountain" or "into the hills." The Hebrew likely refers to the hill country west of Jericho rather than a single peak.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 가서 산지로 올라가서 추격자들이 돌아올 때까지 거기서 사흘 동안 머물렀습니다. 추격자들은 길 전체를 샅샅이 찾았지만 그들을 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단일한 산봉우리보다 여리고 서쪽의 산지 지대를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  english_pob_choice: they went and came
  chosen_korean: 가서 … 올라가서
  alternatives_korean:
  - 갔고 와서
  - 떠나서 도착하여
  lexicon: HALOT
  rationale: 히브리어 연속 서술을 자연스러운 한국어 동작 연쇄로 옮기되, 뒤의 지형 표현과 맞물리도록 ‘올라가다’를 살렸습니다.
- source_word: הָהָרָה
  english_pob_choice: to the hill country
  chosen_korean: 산지로
  alternatives_korean:
  - 산으로
  - 언덕들로
  lexicon: HALOT
  rationale: 문맥상 여리고 서쪽의 구릉 지대를 가리키므로 단일한 산봉우리보다 ‘산지’가 더 정확합니다.
- source_word: וַיֵּשְׁבוּ שָׁם שְׁלֹשֶׁת יָמִים
  english_pob_choice: stayed there three days
  chosen_korean: 거기서 사흘 동안 머물렀습니다
  alternatives_korean:
  - 거기서 사흘 동안 있었습니다
  - 거기서 사흘 동안 머물었습니다
  lexicon: HALOT
  rationale: ישב는 일시적 체류를 뜻하므로 ‘머물다’가 자연스럽고, ‘사흘’은 히브리어 수량 표현을 그대로 반영합니다.
- source_word: הָרֹדְפִים
  english_pob_choice: the pursuers
  chosen_korean: 추격자들
  alternatives_korean:
  - 추적자들
  - 쫓는 자들
  lexicon: HALOT
  rationale: רדף의 서술적 의미를 살려, 단순한 ‘찾는 사람들’보다 추격 상황이 분명한 ‘추격자들’로 옮겼습니다.
- source_word: בְּכָל הַדֶּרֶךְ
  english_pob_choice: all along the road
  chosen_korean: 길 전체를 샅샅이
  alternatives_korean:
  - 온 길을 따라
  - 길을 따라 모두
  lexicon: HALOT
  rationale: ‘길/도로’를 따라 전 구간을 수색한 뜻이므로, 반복적 탐색의 강도를 드러내는 ‘샅샅이’로 풀었습니다.
