  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
  footnotes:
  - marker: a
    text: Or “the terror of you has fallen upon us.”
    reason: lexical_alternative
  - marker: b
    text: Or “all the inhabitants of the land have lost heart because of you.” The Hebrew verb is literally “have melted.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 그 사람들에게 말했습니다. “저는 야훼께서 여러분에게 이 땅을 주셨고, 여러분에 대한 두려움[a]이 우리에게 엄습했으며, 이 땅의 모든 주민이 여러분 앞에서 녹아내렸다는 것[b]을 알고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분에 대한 공포’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘녹다’입니다. 문맥상 ‘기운을 잃다’ 또는 ‘마음이 꺾이다’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל הָאֲנָשִׁים
  english_pob_choice: And she said to the men
  chosen_korean: 그리고 그가 그 사람들에게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 그 사람들에게 말했습니다
  - 그리고 그가 남자들에게 말했습니다
  - 그가 그 사람들에게 이르러 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술의 연결(waw-consecutive)을 살려 ‘그리고’로 시작하고, immediate referent인 정탐꾼들을 ‘그 사람들’로 옮겼습니다. 라합이 여성임을 한국어 대명사로 굳이 드러내기보다 문맥상 자연스럽게 처리했습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 제가 아는 것은
  alternatives_korean:
  - 알고 있습니다
  - 제가 알고 있는 것은
  - 제가 압니다
  lexicon: HALOT
  rationale: ‘I know’의 현재적·확정적 인식을 한국어에서 내용절 도입형으로 풀어, 뒤따르는 세 진술 전체를 받도록 했습니다.
- source_word: נָתַן יְהוָה לָכֶם אֶת הָאָרֶץ
  english_pob_choice: Yahweh has given you the land
  chosen_korean: 야훼께서 여러분에게 이 땅을 주셨다는 것
  alternatives_korean:
  - 야훼께서 여러분에게 그 땅을 주셨다는 것
  - 야훼께서 여러분에게 이 땅을 주셨다는 사실
  - 주님께서 여러분에게 이 땅을 주셨다는 것
  lexicon: HALOT
  rationale: 완료 동사의 결과가 현재에 유효한 의미를 살려 ‘주셨다는 것’으로 옮겼고, 문맥상 약속의 땅을 가리키는 הָאָרֶץ는 ‘이 땅’으로 처리했습니다. יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵימַתְכֶם
  english_pob_choice: the fear of you
  chosen_korean: 여러분에 대한 두려움
  alternatives_korean:
  - 여러분의 두려움
  - 여러분을 향한 두려움
  - 여러분에 대한 공포
  lexicon: HALOT
  rationale: 소유격 직역보다 ‘~에 대한 두려움’이 한국어에서 더 자연스럽고, 두려움의 대상이 이스라엘임을 분명히 드러냅니다.
- source_word: נָמֹגוּ
  english_pob_choice: have melted away
  chosen_korean: 녹아내렸다는 것입니다
  alternatives_korean:
  - 녹았다는 것입니다
  - 기운이 꺾였다는 것입니다
  - 마음이 풀렸다는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘녹다/용해되다’를 살려 ‘녹아내리다’로 옮겼습니다. 이는 공포로 인한 소진과 무력화의 비유를 강하게 보존합니다.
- source_word: מִפְּנֵיכֶם
  english_pob_choice: before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분 앞에
  - 여러분의 앞에서
  - 여러분 때문에
  lexicon: HALOT
  rationale: ‘before you’의 공간적·존재론적 앞섬을 한국어의 관용 표현 ‘앞에서’로 옮겨, 단순한 인과로만 좁히지 않았습니다.
theological_decisions:
- issue: YHWH의 표기와 종교적 관용어의 선택
  chosen_reading: 야훼를 사용하고, 관용적 ‘주님’으로 바꾸지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 신명기적 서사 안에서 하나님의 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유명인 ‘야훼’를 유지했습니다. 이는 라합의 고백이 단순한 일반신 개념이 아니라 언약의 하나님에 대한 인식을 드러내기 때문입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
