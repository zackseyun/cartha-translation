id: JOS.2.12
reference: Joshua 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
  footnotes:
  - marker: a
    text: Or 'a true sign,' 'a sure sign,' or 'a reliable pledge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디, 제가 여러분에게 친절을 베푼 것처럼 여러분도 제 아버지의 집에 친절을 베풀고 제게 확실한 표징[a]을 주겠다고 야훼의 이름으로 맹세해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실한 표징’, ‘확실한 표징’, 혹은 ‘믿을 만한 증표’.
    reason: 히브리어 ‘오트 에메트’(אוֹת אֱמֶת)는 ‘진실한 표징’, ‘확실한 표징’, ‘믿을 만한 증표’ 등으로 옮길 수 있습니다.
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  lexicon: HALOT
  rationale: 담화 전환과 긴급한 요청을 자연스러운 현대 한국어로 살리기 위해 간결한 ‘이제’를 택했습니다.
- source_word: הִשָּׁבְעוּ נָא
  english_pob_choice: please swear
  chosen_korean: 부디 … 맹세하여 주십시오
  alternatives_korean:
  - 부디 … 맹세해 주십시오
  - 부디 … 맹세하십시오
  - 부디 … 서약해 주십시오
  lexicon: HALOT
  rationale: 명령형 복수와 נָא의 공손·간청의 뉘앙스를 합쇼체 요청문으로 옮기되, ‘맹세하다’가 서약의 의미를 가장 직접적으로 드러냅니다.
- source_word: חָסֶד
  english_pob_choice: kindness
  chosen_korean: 친절
  alternatives_korean:
  - 은혜
  - 인애
  - 신실한 사랑
  lexicon: HALOT
  rationale: 이 문맥은 언약적 용어의 신학적 중량이 있지만 상호 호혜적 요청으로 쓰였으므로, 과도하게 교회어화하지 않고 관계적 배려를 드러내는 ‘친절’로 번역했습니다.
- source_word: אוֹת אֱמֶת
  english_pob_choice: a sure sign
  chosen_korean: 확실한 표징
  alternatives_korean:
  - 진실한 표징
  - 믿을 만한 표징
  - 확실한 증표
  lexicon: HALOT
  rationale: אוֹת은 ‘표징/증표’가 가장 자연스럽고, אֱמֶת은 ‘진실/확실성’의 성격을 더하므로 ‘확실한 표징’이 의미를 압축해 전달합니다.
- source_word: בַּיהוָה
  english_pob_choice: by Yahweh
  chosen_korean: 야훼 이름으로
  alternatives_korean:
  - 야훼께
  - 야훼로 맹세하여
  - 야훼를 두고
  lexicon: HALOT
  rationale: אָנָה/שׁבע의 서약 공식에서 전치사 בְּ는 맹세의 근거·매개를 나타내므로, 한국어에서는 ‘이름으로’가 가장 자연스럽게 oath formula를 재현합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 히브리어 텍스트에 직접 나타난 여호와의 이름을 사용하므로, POB 기준에 따라 음역 ‘야훼’를 유지해 언약명 사용을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: חָסֶד의 뉘앙스
  chosen_reading: 친절
  alternative_readings:
  - 인애
  - 은혜
  - 언약적 사랑
  rationale: 라합의 요청은 상호 보호를 부탁하는 실무적 맥락이므로, 본문 자체의 직접적 의미를 해치지 않으면서도 신학어를 과잉 주입하지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Context-sensitive translation — חֶסֶד'
