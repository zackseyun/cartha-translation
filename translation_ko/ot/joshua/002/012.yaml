    rationale: ‘당신들에게’와 ‘내게/내 아버지’의 조합은 현대 합쇼체에서 다소 거칠고 불균질하게 들립니다. ‘여러분’과 ‘제게/제 아버지’가 공손한 직접 발화에 더 자연스럽습니다.
