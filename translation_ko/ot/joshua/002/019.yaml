  rationale: 수정문은 히브리어의 조건 선언, 집 안팎의 대조, 혈죄 책임의 병행 표현을 보존합니다. 불명확하거나 부자연스러운 대명사 연결을 정리하고, ‘손’ 관용구의 해악 의미를 과도한 해석 없이 자연스러운 한국어로 전달했습니다. 각주 표지도 각각의 해당 관용구 바로 뒤에 배치했습니다.
