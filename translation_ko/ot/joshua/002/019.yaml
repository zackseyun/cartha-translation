  source_fidelity: 원문의 조건적·법정적 선언과 두 병행 혈죄 관용구는 대체로 반영되어 있습니다. 그러나 ‘자기 머리 위에 그의 피’는 지시 관계가 혼재되어 어색하며, ‘손이 그에게 닿으면’은 해를 가하는 행위라는 관용적 뜻을 단순 접촉으로 약화시킬 수 있습니다. 또한 각주 표지가 해당 표현에 직접 붙어 있지 않습니다.
  naturalness: ‘집 안에 있는 당신과 함께 있는 모든 자’는 수식 관계가 부자연스럽습니다. ‘집 안에서 당신과 함께 있는 모든 사람’이 현대 표준어 합쇼체에서 명확하고 자연스럽습니다. 법적 책임 면제의 뜻은 ‘우리는 책임이 없을 것입니다’로 자연스럽게 표현할 수 있습니다.
  terminology: ‘피가 머리 위에 있다’는 혈죄·책임 관용구를 본문에서 유지하되, 한국어 문장 안에서는 ‘그의 피는 그의 머리 위에’로 지시어를 일관되게 해야 합니다. ‘손을 대는 일이 있으면’은 행위자를 특정하지 않으면서 원문의 해악 관용구를 자연스럽게 전달합니다.
