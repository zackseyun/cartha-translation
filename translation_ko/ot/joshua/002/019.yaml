source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: And it shall be that anyone who goes out from the doors of your house to the outside—his blood shall be on his own head[a], and we shall be innocent[b]. But everyone who is with you in the house—his blood shall be on our heads if a hand is laid on him.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'he will bear responsibility for his own death.' The Hebrew reads literally, 'his blood shall be on his head.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'if a hand is on him,' an idiom meaning that harm is done to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 될 것입니다. 곧 당신의 집 문 밖으로 나가는 자는 모두 자기 머리 위에 그의 피가 있을 것이며, 우리는 무죄합니다. 그러나 집 안에 있는 당신과 함께 있는 모든 자의 피는, 손이 그에게 닿으면 우리의 머리 위에 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 머리 위에 그의 피가 있다’는 히브리어의 직역적 관용구로, 여기서는 자기 죽음에 대한 책임을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손이 그에게 닿으면’은 문자적으로 ‘손이 그에게 있으면’이라는 히브리어 관용구로, 해를 입는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그리고 이렇게 될 것입니다
  alternatives_korean:
  - 그러면 그렇게 될 것입니다
  - 그리고 그것이 될 것입니다
  lexicon: WLC/HALOT
  rationale: 서약·조건문을 여는 공식적인 התחלת식을 한국어 합쇼체로 자연스럽게 살리되, 단순 미래가 아니라 선언적 조건 형식을 드러내기 위해 이렇게 옮겼습니다.
- source_word: מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  english_pob_choice: from the doors of your house to the outside
  chosen_korean: 당신의 집 문 밖으로
  alternatives_korean:
  - 당신 집 문의 바깥으로
  - 당신의 집 문에서 밖으로
  lexicon: WLC/HALOT
  rationale: ‘문들’과 ‘바깥’의 구체적 이미지를 보존하되, 한국어에서는 과도한 직역보다 ‘문 밖으로’가 자연스럽고 출입 경계를 분명히 드러냅니다.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  english_pob_choice: his blood shall be on his own head
  chosen_korean: 자기 머리 위에 그의 피가 있을 것이며
  alternatives_korean:
  - 그의 피는 자기 책임이 될 것이며
  - 그의 피가 자기 머리로 돌아갈 것이며
  lexicon: WLC/HALOT
  rationale: 히브리어의 혈죄 책임 관용구를 해석으로 풀어버리지 않고, ‘머리 위에 피가 있다’는 직설적 구조를 유지해 본문의 법정적 뉘앙스를 보존했습니다.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  english_pob_choice: and we shall be innocent
  chosen_korean: 우리는 무죄합니다
  alternatives_korean:
  - 우리는 죄가 없습니다
  - 우리는 책임이 없습니다
  lexicon: WLC/HALOT
  rationale: נְקִיִּם의 법적 무죄/무책임 의미를 한국어에서 분명하게 전달하는 표현으로 ‘무죄합니다’를 택했습니다.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  english_pob_choice: if a hand is laid on him
  chosen_korean: 손이 그에게 닿으면
  alternatives_korean:
  - 손이 그에게 놓이면
  - 누가 그에게 손을 대면
  lexicon: WLC/HALOT
  rationale: 히브리어의 관용구를 한국어에서 자연스럽게 옮기되, 행위 주체를 굳이 특정하지 않는 수동적·불특정 표현을 살렸습니다.
theological_decisions:
- issue: 혈죄 책임 관용구의 보존
  chosen_reading: ‘그의 피가 ... 있을 것이며’라는 관용구를 본문에 유지했습니다.
  alternative_readings:
  - 그가 자기 죽음의 책임을 져야 합니다
  - 그의 죽음에 대한 책임은 그에게 있습니다
  rationale: 이 구절은 교리 논쟁보다 언약적·법정적 선언의 어조가 중요하므로, 해석을 앞세우지 않고 원문의 책임 관용구를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 무죄 선언의 공적·법적 뉘앙스
  chosen_reading: ‘우리는 무죄합니다’로 공동체의 책임 면제를 분명히 했습니다.
  alternative_readings:
  - 우리는 책임이 없습니다
  - 우리는 깨끗합니다
  rationale: נְקִיִּם은 단순한 도덕적 ‘깨끗함’보다 사건 발생 시 책임 면제라는 법적 의미가 강하므로, 이를 한국어에서 명확히 드러냈습니다.
  doctrine_reference: Translation philosophy §6
