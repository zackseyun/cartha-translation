  source_fidelity: 원문의 비인칭 수동 보고(וַיֵּאָמַר), 여리고 왕에게 전달된 직접 발화, 주의 환기(הִנֵּה), 이스라엘 자손 중 복수의 사람들, 당일 밤의 도착, 그리고 땅을 조사하려는 목적을 반영했습니다. 다만 초안의 ‘여기로 와서 … 왔습니다’는 동일 동사의 중복으로 원문에 없는 어색한 반복을 만들며, ‘탐지하다’는 이 문맥의 사람·땅에 대한 정찰적 조사에는 현대 한국어에서 부자연스럽습니다.
  naturalness: ‘여리고 왕에게 말해졌습니다’보다 ‘여리고 왕에게 이런 말이 전해졌습니다’가 비인칭적 전달을 자연스럽게 표현합니다. ‘이스라엘 자손 몇 사람이’는 מִבְּנֵי יִשְׂרָאֵל의 일부를 이루는 복수 인물을 자연스러운 한국어로 나타냅니다. ‘살피러’는 중립적 조사 의미를 유지하면서 문맥에 적합합니다.
  terminology: ‘이스라엘 자손’과 ‘그 땅’은 유지했습니다. חָפַר의 문맥상 정찰·조사 의미는 본문에서 ‘살피러’로, 가능한 구체적 대안인 ‘정탐하러’는 각주로 제시했습니다. ‘보십시오’는 왕에게 전달된 보고 안의 주의 환기 표현으로 합쇼체에 맞습니다.
