source:
  edition: WLC
  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
  footnotes:
  - marker: a
    text: Or “to spy out the land.” The Hebrew verb can carry the sense of searching out or investigating, and in this context refers to reconnaissance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여리고 왕에게 말해졌습니다. 「보십시오, 이스라엘 자손 가운데서 온 사람들이 오늘 밤 여기로 와서 그 땅을 탐지하러 왔습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 땅을 정탐하러.” 히브리어 동사는 ‘탐색하다, 조사하다’의 뜻을 가질 수 있으며, 이 문맥에서는 정찰을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  english_pob_choice: And it was said
  chosen_korean: 그리고 … 말해졌습니다
  alternatives_korean:
  - 그리고 … 말했습니다
  - 그리고 … 전해졌습니다
  lexicon: HALOT
  rationale: 히브리어의 비인칭적 수동 서술을 살려 주체를 덧붙이지 않고, 한국어에서는 자연스럽게 ‘말해졌습니다’로 옮겼습니다.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  english_pob_choice: to the king of Jericho
  chosen_korean: 여리고 왕에게
  alternatives_korean:
  - 여리고의 왕에게
  - 여리고 왕에게 전해져
  lexicon: HALOT
  rationale: 지명+왕의 결합을 간결하게 유지해 정치적 칭호를 자연스럽게 드러냈습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 긴박한 주의 환기 기능을 살리되, 서술문 안에서 현대적이면서도 격식 있는 호소로 옮겼습니다.
- source_word: לַחְפֹּר
  english_pob_choice: to search out
  chosen_korean: 탐지하러
  alternatives_korean:
  - 정탐하러
  - 살피러
  - 수색하러
  lexicon: HALOT
  rationale: 문맥상 정찰·탐색의 뜻이므로, 본문에는 보다 중립적인 ‘탐지하다’를 써서 ‘spy out’보다 해석을 덜 앞세웠습니다.
theological_decisions:
- issue: 가나안 땅 정탐 표현의 해석 강도
  chosen_reading: 본문은 직접적으로 ‘탐지하러 왔다’고 옮기고, 탐지의 군사·정찰적 함의는 문맥이 드러내게 했습니다.
  alternative_readings:
  - 정탐하러 왔습니다
  - 염탐하러 왔습니다
  rationale: 히브리어 동사는 조사·탐색의 범위를 가지므로, 한국어 본문에서 군사적 뉘앙스를 과도하게 고정하지 않고 의미 범위를 보존했습니다.
  doctrine_reference: 본문 의미 보존과 문맥 기반 해석
