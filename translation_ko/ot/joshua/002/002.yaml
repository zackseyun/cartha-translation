  rationale: 비인칭적 보고 형식은 ‘이런 말이 전해졌습니다’로 자연스럽게 보존하고, 원문의 단일 도착 동사를 한 번만 번역했습니다. ‘살피러’는 조사·탐색이라는 어휘적 범위를 유지하며, 정찰이라는 문맥적 의미는 각주에서 대안으로 밝혔습니다. 각주 표지를 해당 동사에 붙여 참조 대상을 명확히 했습니다.
