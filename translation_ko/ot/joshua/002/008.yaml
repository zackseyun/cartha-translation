  text: Before they lay down[a], she went up to them on the roof.
  footnotes:
  - marker: a
    text: Or 'Before they went to sleep, she went up to them on the rooftop.' The Hebrew verb literally means 'lay down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아직 눕기 전에, 그녀가 그들에게 올라가서 지붕 위에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눕다’는 동작을 직역한 표현입니다. 문맥상 ‘잠들다’로 옮길 수도 있지만, 원문은 수면 자체보다 눕는 행위를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  english_pob_choice: Before
  chosen_korean: ~하기 전에
  alternatives_korean:
  - ~하기 앞서
  - ~하기도 전에
  lexicon: HALOT
  rationale: 시간 관계를 자연스럽게 드러내는 현대 한국어로 옮겼습니다. 문맥상 앞선 시점을 분명히 하되, 과도한 강조는 피했습니다.
- source_word: יִשְׁכָּבוּן
  english_pob_choice: they lay down
  chosen_korean: 그들이 아직 눕기 전에
  alternatives_korean:
  - 그들이 눕기 전에
  - 그들이 잠들기 전에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘눕다’의 동작을 말하므로, 영어 POB의 선택처럼 ‘잠들다’로 좁히지 않고 신체 동작을 살렸습니다.
- source_word: עָלְתָה ... עֲלֵיהֶם
  english_pob_choice: she went up to them
  chosen_korean: 그들에게 올라가서
  alternatives_korean:
  - 그들 쪽으로 올라가서
  - 그들에게로 올라가서
  lexicon: HALOT
  rationale: עלה의 상향 이동과 יעד를 함께 살리기 위해 ‘올라가서’로 옮겼습니다. 여기서는 ‘그들에게’가 목적지의 방향을 자연스럽게 나타냅니다.
- source_word: עַל הַגָּג
  english_pob_choice: on the roof
  chosen_korean: 지붕 위에
  alternatives_korean:
  - 옥상에
  - 지붕 위로
  lexicon: HALOT
  rationale: 고대 주택의 평지붕 맥락을 반영하되, 현대 한국어에서 가장 무리 없는 장소 표현으로 옮겼습니다.
