id: JOS.2.10
reference: Joshua 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
  footnotes:
  - marker: a
    text: Hebrew Yam Suph, traditionally 'Red Sea'; more literally, 'Sea of Reeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 야훼께서 여러분이 이집트에서 나올 때에 여러분 앞에서 홍해[a]의 물을 말리신 일과, 여러분이 요단 건너편에 있던 아모리 사람의 두 왕, 곧 시혼과 옥에게 한 일, 곧 그들을 진멸한 일을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야므 수프(Yam Suph)’는 전통적으로 ‘홍해’로 번역되며, 더 문자적으로는 ‘갈대 바다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / שָׁמַעְנוּ
  english_pob_choice: For we have heard
  chosen_korean: 이는 우리가 들었기 때문입니다
  alternatives_korean:
  - 우리는 들었습니다
  - 우리가 들었기 때문입니다
  lexicon: HALOT
  rationale: 인과를 여는 כִּי를 살리면서, 라합의 진술이 주변 문맥의 두려움 설명에 이어지는 논리임을 한국어로 자연스럽게 드러냅니다.
- source_word: הוֹבִישׁ יְהוָה אֶת מֵי יַם סוּף
  english_pob_choice: Yahweh dried up the water of the Red Sea
  chosen_korean: 야훼께서 … 홍해의 물을 말리셨고
  alternatives_korean:
  - 야훼께서 … 바다의 물을 마르게 하셨고
  - 야훼께서 … 갈대 바다의 물을 말리셨고
  lexicon: HALOT
  rationale: הוֹבִישׁ는 ‘말리다/마르게 하다’의 사역형으로 보고, POB의 ‘Red Sea’ 대응을 따라 ‘홍해’로 옮기되 원문 표지인 ים סוף의 해석 문제는 본문에서 과도하게 확장하지 않았습니다.
- source_word: מִפְּנֵיכֶם בְּצֵאתְכֶם מִמִּצְרַיִם
  english_pob_choice: before you when you came out of Egypt
  chosen_korean: 여러분이 이집트에서 나오실 때 여러분 앞에서
  alternatives_korean:
  - 여러분이 이집트에서 나올 때 여러분 앞에서
  - 여러분이 이집트에서 나와 나아갈 때 여러분 앞에서
  lexicon: HALOT
  rationale: ‘before you’는 위치 관계를 살려 ‘여러분 앞에서’로, בְּצֵאתְכֶם은 시간 부사절로 처리해 사건의 동시성을 자연스럽게 표현했습니다.
- source_word: הֶחֱרַמְתֶּם
  english_pob_choice: you devoted to destruction
  chosen_korean: 여러분이 그들을 멸하신 일
  alternatives_korean:
  - 여러분이 그들을 진멸하신 일
  - 여러분이 그들을 멸절시키신 일
  lexicon: HALOT
  rationale: חֵרֶם 계열의 전용 용법을 본문에서 과도하게 풀이하지 않되, POB의 ‘devoted to destruction’이 의도하는 강한 전멸 의미를 한국어 ‘멸하다’로 담았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 있는 신명기적 언약명 יְהוָה를 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 대체 칭호로 평준화하지 않았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: חרם(멸절/진멸) 언어의 처리
  chosen_reading: 멸하신 일
  alternative_readings:
  - 진멸하신 일
  - 멸절시키신 일
  - 멸망시키신 일
  rationale: 본문의 군사적·신학적 강도를 유지하면서도 한국어 문장 안에서 과도한 설명을 피했습니다. 다만 ‘멸하다’는 한국어에서 일반적 파괴보다 더 강한 전멸 뉘앙스를 가집니다.
  doctrine_reference: Translation philosophy §1, §5
