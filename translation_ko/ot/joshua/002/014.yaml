- from: 그 남자들이 그녀에게 말했습니다. “우리는 당신 대신 죽을 목숨입니다. 이 우리의 이 일을 당신이 말하지 않는다면 말입니다. 그리고 야훼께서 우리에게 이 땅을 주실 때, 우리는 당신에게 언약의 신실함과 진실로 대하겠습니다.”[a]
  to: 그 남자들이 그녀에게 말했습니다. “당신들이 우리의 이 일을 알리지 않는다면, 우리는 당신들을 대신하여 죽겠습니다. 야훼께서 우리에게 그 땅을 주실 때, 우리는 당신에게 친절과 신실함을 베풀겠습니다.”[a]
  rationale: 조건절을 앞에 배치하여 히브리어의 조건부 맹세를 한국어로 자연스럽게 재구성했습니다. ‘당신들이/당신들을’로 원문의 2인칭 복수형을 유지했으며, ‘우리는 당신들을 대신하여 죽겠습니다’로 대체적 죽음의 서약을 명료하게 표현했습니다. ‘그 땅’은 정관사 הָאָרֶץ를 반영합니다. חֶסֶד וֶאֱמֶת는 본문에서 과도하게 교리화하지 않은 ‘친절과 신실함’으로 옮기고, 전통적 대안과 관계적 함의를 각주로 처리했습니다.
