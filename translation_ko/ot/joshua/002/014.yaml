  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
  footnotes:
  - marker: a
    text: Or “we will deal with you in kindness and faithfulness.” The Hebrew pair חֶסֶד וֶאֱמֶת often expresses loyal, reliable covenantal commitment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자들이 그녀에게 말했습니다. “당신들이 우리의 이 일을 알리지 않는다면, 우리는 당신들을 대신하여 죽겠습니다. 야훼께서 우리에게 그 땅을 주실 때, 우리는 당신에게 친절과 신실함을 베풀겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 당신에게 인애와 진실을 베풀겠습니다.” 히브리어 쌍 חֶסֶד וֶאֱמֶת는 충실하고 신뢰할 만한 호의, 곧 관계에 대한 한결같은 헌신을 나타내는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 남자들
  alternatives_korean:
  - 그 사람들
  - 그 남자들, 곧 정탐꾼들
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘사람들/남자들’이라고만 말하므로, 본문에 없는 ‘정탐꾼들’을 본문 속으로 끌어들이지 않고 평이하게 옮겼습니다.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  english_pob_choice: Our lives for yours, even to death
  chosen_korean: 우리는 당신 대신 죽을 목숨입니다
  alternatives_korean:
  - 우리 목숨이 당신 목숨을 대신합니다
  - 우리는 당신을 대신하여 죽겠습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 ‘목숨/생명’의 뜻이고, תַּחַת는 ‘대신하여’의 교환·대체 뉘앙스를 가집니다. 한국어에서는 맹세의 강도를 살리면서도 자연스럽게 ‘당신 대신 죽을 목숨입니다’로 옮겼습니다.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  english_pob_choice: when Yahweh gives us the land
  chosen_korean: 야훼께서 우리에게 이 땅을 주실 때
  alternatives_korean:
  - 야훼께서 우리에게 그 땅을 주실 때
  - 야훼께서 우리에게 땅을 주실 때
  lexicon: HALOT
  rationale: בְּ + מקור형은 여기서 시간·상황을 나타내므로 ‘~할 때’로 옮겼습니다. מקור형의 주어-목적어 구조도 한국어 어순에 맞게 자연스럽게 재배열했습니다.
- source_word: חֶסֶד וֶאֱמֶת
  english_pob_choice: covenant faithfulness and truth
  chosen_korean: 언약의 신실함과 진실
  alternatives_korean:
  - 인애와 진실
  - 헤세드와 에메트
  - 언약적 신의와 진실
  lexicon: HALOT
  rationale: חֶסֶד와 אֱמֶת는 단순한 ‘친절’보다 언약적이고 관계적인 충실성을 가리키므로, 그 무게를 살려 ‘언약의 신실함과 진실’로 옮겼습니다. 두 명사를 분리해 대응시켜 본문의 쌍의 의미를 보존했습니다.
theological_decisions:
- issue: 야훼의 호칭 처리
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값에 따라 신명 tetragrammaton은 학술 음역인 ‘야훼’로 표기하여 언약 이름의 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חֶסֶד וֶאֱמֶת의 신학적 뉘앙스
  chosen_reading: ‘언약의 신실함과 진실’로 번역했습니다.
  alternative_readings:
  - 인애와 신실함
  - 자비와 진실
  rationale: 이 결합어는 단순한 호의가 아니라 언약에 근거한 충실한 행위를 뜻하므로, 관계적·언약적 함의를 한국어에 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
