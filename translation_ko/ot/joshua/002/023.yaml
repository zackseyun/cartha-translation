source:
  edition: WLC
  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
  footnotes:
  - marker: a
    text: Or, 'everything that befell them' or more literally, 'all the things that found them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두 사람은 돌아와서 산지에서 내려와 건너가, 눈의 아들 여호수아에게 이르렀습니다. 그리고 그들은 자기들에게 일어난 모든 일을 그에게 이야기했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들에게 닥친 모든 일'—히브리어는 문자적으로 '그들을 찾아온 모든 것들'에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: returned
  chosen_korean: 돌아와서
  alternatives_korean:
  - 되돌아와서
  - 다시 돌아와
  lexicon: HALOT
  rationale: שוב의 서술적 완료를 자연스러운 현대 한국어로 옮기되, 반복 동작의 순서를 살려 '돌아와서'로 처리했습니다.
- source_word: וַיֵּרְדוּ מֵהָהָר
  english_pob_choice: came down from the hill country
  chosen_korean: 산지에서 내려와
  alternatives_korean:
  - 산에서 내려와
  - 산악지대에서 내려와
  lexicon: HALOT
  rationale: הָהָר는 단일한 산보다 지형 전체를 가리킬 수 있으므로 '산지'가 문맥에 더 맞고, '내려와'가 동사의 방향성을 잘 살립니다.
- source_word: וַיַּעַבְרוּ
  english_pob_choice: crossed over
  chosen_korean: 건너가
  alternatives_korean:
  - 건너서
  - 건너가서
  lexicon: HALOT
  rationale: 히브리어의 간결한 עבר를 한국어에서도 짧고 직설적으로 살려, 실제 경로를 덧붙이지 않고 '건너가'로 옮겼습니다.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  english_pob_choice: everything that had happened to them
  chosen_korean: 자기들에게 일어난 모든 일
  alternatives_korean:
  - 자기들에게 닥친 모든 일
  - 자기들을 찾아온 모든 일
  lexicon: HALOT
  rationale: מְצֹאות אֹתָם의 문자적 뉘앙스는 '그들에게 닥친/일어난 모든 일'이므로, POB의 의미를 유지하면서도 한국어에서 자연스럽게 '일어난 모든 일'로 옮겼습니다.
theological_decisions:
- issue: 화자가 단순한 사건 보고를 어떻게 표현할지
  chosen_reading: '''그들은 ... 이야기했습니다''로 옮겨, 보고 행위의 평이한 서술을 유지했습니다.'
  alternative_readings:
  - '''보고했습니다'''
  - '''전했습니다'''
  rationale: 본문은 사건의 내용을 요약해 말할 뿐이므로, 지나치게 공식적인 '보고'보다 일상적이면서도 격식을 유지하는 '이야기했습니다'가 원문의 서술감을 잘 살립니다.
  doctrine_reference: n/a
