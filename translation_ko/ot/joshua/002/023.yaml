  to: 그 두 사람은 돌아와 산지에서 내려와 건너가서 눈의 아들 여호수아에게 이르렀습니다. 그들은 자신들에게 일어난 모든 일을 그에게 전했습니다.[a]
  rationale: 원문의 의미와 순서를 유지하면서, 보고 상황에 알맞은 현대 합쇼체 ‘전했습니다’로 다듬고 문장 연결을 자연스럽게 조정했습니다. 각주도 מְצֹאוֹת אֹתָם의 문자적 표현과 자연스러운 대안을 유지합니다.
