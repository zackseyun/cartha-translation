  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַחֲיִתֶ֞ם אֶת אָבִ֣/י וְ/אֶת אִמִּ֗/י וְ/אֶת אַחַ/י֙ וְ/אֶת אחות/י וְ/אֵ֖ת כָּל אֲשֶׁ֣ר לָ/הֶ֑ם וְ/הִצַּלְתֶּ֥ם אֶת נַפְשֹׁתֵ֖י/נוּ מִ/מָּֽוֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
  footnotes:
  - marker: a
    text: Or 'keep my father and my mother alive ... and rescue us from death.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'all who belong to them' likely refers to the rest of their household or dependents; some render it more broadly as 'all that they have.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제발 내 아버지와 어머니를, 내 형제들과 내 자매들을, 그리고 그들에게 속한 모든 사람을 살려 주시고[a], 우리의 생명을 죽음에서 건져 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 아버지와 어머니를 살려 두시고 … 우리를 죽음에서 구해 주십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  english_pob_choice: keep alive
  chosen_korean: 살려 주시고
  alternatives_korean:
  - 살게 하시고
  - 살려 두시고
  - 목숨을 보전해 주시고
  lexicon: HALOT
  rationale: 히필형의 원인적 의미를 살려 ‘살려 주시고’로 옮기면 간청의 뉘앙스와 생명 보존의 뜻을 자연스럽게 드러낼 수 있습니다.
- source_word: כָּל אֲשֶׁר לָהֶם
  english_pob_choice: all who belong to them
  chosen_korean: 그들에게 속한 모든 사람
  alternatives_korean:
  - 그들이 가진 모든 것
  - 그들에게 딸린 모든 사람
  - 그들이 소유한 모든 것
  lexicon: HALOT
  rationale: 문맥상 단순한 소유물보다 가족·가구 구성원을 포함한 ‘사람들’로 읽히는 점을 반영하여, POB의 해석을 따라 ‘그들에게 속한 모든 사람’으로 옮겼습니다.
- source_word: וְהִצַּלְתֶּם
  english_pob_choice: deliver
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구해 주십시오
  - 구원해 주십시오
  - 건져 내 주십시오
  lexicon: HALOT
  rationale: נצל의 ‘구해 내다/건져 내다’ 의미를 살리되, 한국어 청원문맥에서 너무 교리화되지 않도록 ‘건져 주십시오’로 옮겼습니다.
- source_word: נַפְשֹׁתֵינוּ
  english_pob_choice: our lives
  chosen_korean: 우리의 생명
  alternatives_korean:
  - 우리의 목숨
  - 우리의 혼
  - 우리 자신
  lexicon: HALOT
  rationale: 이 구절에서는 נפש가 비물질적 ‘혼’이 아니라 위협받는 생명 자체를 가리키므로, ‘우리의 생명’이 가장 정확합니다.
theological_decisions:
- issue: רחם/청원문에서의 직접 호소 어조
  chosen_reading: 문장 전체를 간청형으로 유지해 라합의 절박한 보호 요청을 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화
  - 간접화법으로 변환
  rationale: 히브리어 원문의 간청 구조를 보존해야 독자가 인물의 위기감과 요청의 강도를 직접 이해할 수 있습니다.
  doctrine_reference: 본문의 서사적-수사적 기능
