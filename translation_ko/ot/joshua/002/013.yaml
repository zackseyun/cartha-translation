- source_word: כָּל אֲשֶׁר לָהֶם
  english_pob_choice: all who belong to them
  chosen_korean: 그들에게 속한 모든 사람
  alternatives_korean:
  - 그들이 가진 모든 것
  - 그들에게 딸린 모든 사람
  - 그들이 소유한 모든 것
  lexicon: HALOT
  rationale: 문맥상 단순한 소유물보다 가족·가구 구성원을 포함한 ‘사람들’로 읽히는 점을 반영하여, POB의 해석을 따라 ‘그들에게 속한 모든 사람’으로 옮겼습니다.
- source_word: וְהִצַּלְתֶּם
  english_pob_choice: deliver
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구해 주십시오
  - 구원해 주십시오
  - 건져 내 주십시오
  lexicon: HALOT
  rationale: נצל의 ‘구해 내다/건져 내다’ 의미를 살리되, 한국어 청원문맥에서 너무 교리화되지 않도록 ‘건져 주십시오’로 옮겼습니다.
- source_word: נַפְשֹׁתֵינוּ
  english_pob_choice: our lives
  chosen_korean: 우리의 생명
  alternatives_korean:
  - 우리의 목숨
  - 우리의 혼
  - 우리 자신
  lexicon: HALOT
  rationale: 이 구절에서는 נפש가 비물질적 ‘혼’이 아니라 위협받는 생명 자체를 가리키므로, ‘우리의 생명’이 가장 정확합니다.
