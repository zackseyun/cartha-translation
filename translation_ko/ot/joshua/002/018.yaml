  english_pob_choice: you shall gather into your house
  chosen_korean: 네 집으로 모아 두십시오
  alternatives_korean:
  - 네 집에 모으십시오
  - 네 집 안으로 모아 두십시오
  lexicon: HALOT
  rationale: אָסַף의 ‘모으다/모집하다’와 הַבָּיְתָה의 집 방향성을 반영해, 대상들을 안전하게 한곳에 모아 두라는 뜻을 분명히 했습니다.
- source_word: כָּל בֵּית אָבִיךְ
  english_pob_choice: all your father's household
  chosen_korean: 네 아버지의 온 집안
  alternatives_korean:
