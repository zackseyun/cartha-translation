  lexicon: HALOT
  rationale: POB의 ‘scarlet cord’에 대응하되, תִּקְוָה/חוּט의 물리적 표지를 한국어로 자연스럽게 드러내기 위해 ‘줄’을 택했습니다.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  english_pob_choice: in the window through which you let us down
  chosen_korean: 네가 우리를 내리던 창문에
  alternatives_korean:
  - 네가 우리를 내려 보냈던 창문에
  - 네가 우리를 내렸던 창문에
  lexicon: HALOT
  rationale: הוֹרַדְתֵּנוּ의 사역적 ‘내리다/내려주다’ 의미를 살리면서, 관계절을 한국어로 압축해 읽기 쉽게 옮겼습니다.
