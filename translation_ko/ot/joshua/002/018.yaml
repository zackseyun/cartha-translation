  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
  footnotes:
  - marker: a
    text: Or, more literally, 'this line of scarlet thread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 우리가 그 땅에 들어갈 때, 이 주홍색 줄을 네가 우리를 내리던 창문에 매어 두고, 네 아버지와 네 어머니와 네 형제들과 네 아버지의 온 집안을 네 집으로 모아 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주홍색 줄’은 본문의 물리적 표지를 자연스럽게 옮긴 표현입니다. 히브리어는 문자적으로 ‘주홍 실의 줄/끈’에 가까울 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 문맥의 지시성을 살리면서도 현대 합쇼체에 자연스럽게 맞췄습니다.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  english_pob_choice: this scarlet cord
  chosen_korean: 이 주홍색 줄
  alternatives_korean:
  - 이 주홍색 끈
  - 이 주홍색 실줄
  lexicon: HALOT
  rationale: POB의 ‘scarlet cord’에 대응하되, תִּקְוָה/חוּט의 물리적 표지를 한국어로 자연스럽게 드러내기 위해 ‘줄’을 택했습니다.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  english_pob_choice: in the window through which you let us down
  chosen_korean: 네가 우리를 내리던 창문에
  alternatives_korean:
  - 네가 우리를 내려 보냈던 창문에
  - 네가 우리를 내렸던 창문에
  lexicon: HALOT
  rationale: הוֹרַדְתֵּנוּ의 사역적 ‘내리다/내려주다’ 의미를 살리면서, 관계절을 한국어로 압축해 읽기 쉽게 옮겼습니다.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  english_pob_choice: you shall gather into your house
  chosen_korean: 네 집으로 모아 두십시오
  alternatives_korean:
  - 네 집에 모으십시오
  - 네 집 안으로 모아 두십시오
  lexicon: HALOT
  rationale: אָסַף의 ‘모으다/모집하다’와 הַבָּיְתָה의 집 방향성을 반영해, 대상들을 안전하게 한곳에 모아 두라는 뜻을 분명히 했습니다.
- source_word: כָּל בֵּית אָבִיךְ
  english_pob_choice: all your father's household
  chosen_korean: 네 아버지의 온 집안
  alternatives_korean:
  - 네 아버지의 온 가문
  - 네 아버지의 모든 집안사람
  lexicon: HALOT
  rationale: 건물보다 가족 단위를 가리키는 표현이므로, ‘household’의 사회적 의미를 살려 ‘온 집안’으로 옮겼습니다.
