  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
  footnotes:
  - marker: a
    text: Or, more literally, 'this line of scarlet thread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 우리가 그 땅에 들어갈 때, 네가 우리를 내려 보냈던 창문에 이 주홍색 줄을 매십시오.[a] 그리고 네 아버지와 네 어머니와 네 형제들과 네 아버지의 온 집안을 네 집 안으로 모으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 문자적으로 옮기면 ‘이 주홍 실의 줄’ 또는 ‘이 주홍 실줄’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
