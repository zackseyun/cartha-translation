  edition: WLC
  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
  footnotes:
  - marker: a
    text: Or 'her house was on the city wall, and she lived on the wall.' The Hebrew describes her dwelling as situated in/within the wall structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그녀는 그들을 줄로 창문을 통해 내려보냈습니다[a]. 이는 그녀의 집이 성벽 구조 안에 있었고, 그녀가 성벽 안에 살고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 집은 성벽 위에 있었고, 그녀는 성벽 위에 살고 있었다.’ 히브리어는 그녀의 거처가 성벽 구조 안에 있거나 성벽 위에 있었음을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  english_pob_choice: Then she let them down
  chosen_korean: 그녀는 … 내려보냈습니다
  alternatives_korean:
  - 그녀는 … 내려주었습니다
  - 그녀는 … 내렸습니다
  lexicon: HALOT
  rationale: 히필형의 ‘내려가게 하다’라는 사역 의미를 살리되, 현대 한국어에서는 사람을 줄로 아래로 내릴 때 ‘내려보내다’가 자연스럽고 간결합니다.
- source_word: בַּחֶבֶל
  english_pob_choice: by a rope
  chosen_korean: 줄로
  alternatives_korean:
  - 밧줄로
  - 로프로
  lexicon: HALOT
  rationale: חֶבֶל은 문맥상 ‘줄/밧줄’이며, 도구를 나타내는 조사 ‘-로’로 내려보내는 수단을 자연스럽게 표현했습니다.
- source_word: בְּעַד הַחַלּוֹן
  english_pob_choice: through the window
  chosen_korean: 창문을 통해
  alternatives_korean:
  - 창문으로
  - 창문 사이로
  lexicon: HALOT
  rationale: בְּעַד의 핵심은 ‘가로질러, 통과하여’이므로 ‘창문을 통해’가 가장 सीधे한 대응입니다.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה וּבַחוֹמָה הִיא יוֹשָׁבֶת
  english_pob_choice: because her house was in the wall of the city, and she was living in the wall
  chosen_korean: 그녀의 집이 성벽 안에 있었고, 그녀가 성벽 안에 살고 있었기 때문입니다
  alternatives_korean:
  - 그녀의 집이 성벽 속에 있었고, 그녀가 성벽에 살고 있었기 때문입니다
  - 그녀의 집이 성벽에 있었고, 그녀가 성벽에서 살고 있었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 집이 성벽 구조 안/위에 위치함을 말하므로, 전통적으로 ‘성벽에 있었다’보다 구조적 의미가 드러나는 ‘성벽 안에 있었다’로 옮겼습니다.
