id: JOS.2.17
reference: Joshua 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלֶ֖י/הָ הָ/אֲנָשִׁ֑ים נְקִיִּ֣ם אֲנַ֔חְנוּ מִ/שְּׁבֻעָתֵ֥/ךְ הַ/זֶּ֖ה אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
  footnotes:
  - marker: a
    text: Or, 'We are innocent/clear of this oath of yours.' The Hebrew adjective can denote being free from liability or obligation in a legal or covenantal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들이 그녀에게 말했습니다. “당신이 우리에게 맹세하게 한 이 맹세에 대해서는 우리는 책임이 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָקִי는 법적·언약적 맥락에서 ‘책임이 없는, 구속에서 벗어난’이라는 뜻이 될 수 있습니다. 따라서 여기서는 도덕적 의미의 ‘무죄’보다 이 맹세에 따른 책임이나 의무에서 면제됨을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And the men said
  chosen_korean: 그 사람들이 말했습니다
  alternatives_korean:
  - 그리고 그 사람들이 말했습니다
  - 그 남자들이 말했습니다
  lexicon: HALOT
  rationale: 히브리어 이야기 진행형을 살리되, 한국어에서는 자연스러운 서술문으로 옮겼습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 그 사람들
  lexicon: HALOT
  rationale: 문맥상 정탐꾼들이지만 원문은 단순히 ‘사람들/남자들’이므로, 특정 직분을 과하게 주입하지 않고 자연스럽게 옮겼습니다.
- source_word: נְקִיִּם
  english_pob_choice: free
  chosen_korean: 자유롭게 될 것입니다
  alternatives_korean:
  - 책임이 없게 될 것입니다
  - 무죄할 것입니다
  - 벗어나게 될 것입니다
  lexicon: HALOT
  rationale: 맹세의 구속에서 벗어나 책임이 없게 된다는 법적·언약적 뉘앙스를 살리기 위해 ‘자유롭게 되다’를 택했습니다.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  english_pob_choice: from this oath of yours
  chosen_korean: 이 맹세로부터
  alternatives_korean:
  - 당신의 이 맹세로부터
  - 이 서약의 구속으로부터
  lexicon: HALOT
  rationale: 분리의 전치사 מִן을 살려 ‘-로부터’로 옮겼고, 2인칭 여성 단수 소유는 뒤의 절에서 이미 분명하므로 과도한 중복을 피했습니다.
- source_word: הִשְׁבַּעְתָּנוּ
  english_pob_choice: you made us swear
  chosen_korean: 우리에게 맹세하게 한
  alternatives_korean:
  - 우리를 맹세시키신
  - 우리가 맹세하도록 하신
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 반영해 ‘맹세하게 하다’로 옮겼습니다.
theological_decisions:
- issue: 맹세에서의 면책/해방 의미를 어떻게 표현할 것인가
  chosen_reading: ‘자유롭게 될 것입니다’로 옮겨, 단순한 도덕적 무죄가 아니라 맹세의 의무에서 풀려나는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘무죄할 것입니다’
  - ‘책임이 없을 것입니다’
  rationale: 원문의 נְקִיִּם은 법적·언약적 맥락에서 책임이나 의무로부터의 해방을 뜻하므로, 한국어에서도 그 기능적 의미를 분명히 해야 합니다.
  doctrine_reference: 언약적 맹세와 책임 면제의 법적 의미
- issue: 직접 화법의 대상 호칭을 어떻게 처리할 것인가
  chosen_reading: ‘그녀에게’와 ‘당신’의 조합을 유지해, 라합에게 직접 말하는 긴장을 살렸습니다.
  alternative_readings:
  - ‘그에게’
  - ‘너에게’
  rationale: 본문의 2인칭 여성 단수 어미를 보존하면서도, 현대 한국어에서 지나치게 거칠지 않은 공손한 직접 대화를 유지했습니다.
  doctrine_reference: 서술문 화법의 인칭·성 구분 보존
