id: JOS.2.11
reference: Joshua 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
  footnotes:
  - marker: a
    text: Or 'there was no longer courage in anyone.' The Hebrew says literally, 'no spirit remained in any man.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: cultural_note
translation:
  language: ko
  text: 우리가 그것을 들었을 때 우리의 마음이 녹아내렸고, 너희 때문인지라 사람마다 더는 기운이 남지 않았습니다. 이는 야훼 너희 하나님이 하늘 위의 하나님이시며 땅 아래의 하나님이시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어떤 사람 안에도 더 이상 영이 남지 않았다’고 합니다. 문맥상 ‘기운’ 또는 ‘용기’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘여호와’는 신성명 YHWH를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  english_pob_choice: When we heard it
  chosen_korean: 우리가 그것을 들었을 때
  alternatives_korean:
  - 그것을 들었을 때
  - 우리가 들었을 때
  lexicon: HALOT
  rationale: 서술의 시간적 진행을 살리면서도 앞선 소식을 자연스럽게 받기 위해 ‘그것을’로 보충했습니다.
- source_word: וַיִּמַּס לְבָבֵנוּ
  english_pob_choice: our hearts melted
  chosen_korean: 우리의 마음이 녹아내렸고
  alternatives_korean:
  - 우리의 마음이 녹았고
  - 우리 심장이 녹아내렸고
  lexicon: HALOT
  rationale: 히브리어의 관용적 이미지를 유지하되 현대 한국어에서 자연스럽게 느껴지도록 ‘마음이 녹아내리다’로 옮겼습니다.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  english_pob_choice: no spirit remained in any man
  chosen_korean: 사람마다 더는 기운이 남지 않았습니다
  alternatives_korean:
  - 아무에게도 더는 기운이 없었습니다
  - 사람마다 더는 용기가 남지 않았습니다
  lexicon: HALOT
  rationale: ר֫וּחַ는 여기서 영적 실체가 아니라 두려움 속의 기운/용기를 가리키므로, 문맥을 살려 ‘기운’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성명은 전통적 대체칭호가 아니라 고유명으로 처리하여, 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: בַּשָּׁמַיִם מִמַּעַל ... וְעַל הָאָרֶץ מִתָּחַת
  english_pob_choice: in the heavens above and on the earth below
  chosen_korean: 하늘 위의 하나님이시며 땅 아래의 하나님이시기 때문입니다
  alternatives_korean:
  - 하늘 위와 땅 아래에 계신 하나님이시기 때문입니다
  - 하늘 위와 땅 아래의 하나님이시기 때문입니다
  lexicon: HALOT
  rationale: 천상-지상 병렬을 한국어에서 자연스럽게 풀어, 하나님의 보편 통치를 나타내는 대구를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 고유명 יְהוָה를 직접 사용하므로, 대체 칭호보다 이름 자체를 드러내는 것이 소스-직결성이 높습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: 라합의 고백이 드러내는 하나님의 주권 범위
  chosen_reading: 하늘과 땅 전체를 포괄하는 보편 주권의 고백으로 옮겼습니다.
  alternative_readings:
  - 하늘과 땅에 계신 유일한 하나님이라는 고백
  - 하늘과 땅 위에 계신 참 하나님이라는 고백
  rationale: 히브리어는 배타성 표어를 덧붙이지 않고 천지 대구로 하나님의 सार्व सार्व? (omitted) सार्वഭൗमिक sovereignty?
  doctrine_reference: Translation philosophy §1 and §3
