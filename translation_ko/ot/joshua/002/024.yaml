  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: ko
  text: 그들이 여호수아에게 말했습니다. 「참으로 야훼께서 온 땅을 우리 손에 넘겨주셨고, 또한 그 땅의 모든 주민이 우리 앞에서 녹아내렸습니다.」
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 원문 신명칭을 직접 반영해야 하므로 학술적 음역인 야훼를 사용했습니다. POB 영어본의 LORD는 경어화된 일반 ‘주님’보다 원문 식별성이 높습니다.
- source_word: בְּיָדֵנוּ
  english_pob_choice: into our hands
  chosen_korean: 우리 손에
  alternatives_korean:
  - 우리의 손 안에
  - 우리에게
  lexicon: idiom
  rationale: 히브리어 관용구를 직역하되, 점유·지배의 의미가 드러나도록 ‘우리 손에’로 옮겼습니다.
- source_word: נָמֹגוּ
  english_pob_choice: have melted away
  chosen_korean: 녹아내렸습니다
  alternatives_korean:
  - 녹아버렸습니다
  - 무너졌습니다
  - 녹았습니다
  lexicon: N/A
  rationale: 이미지 중심 동사이므로 단순한 ‘두려워하다’보다 해체·소멸의 감각을 살리는 표현을 택했습니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the land
  chosen_korean: 그 땅의 모든 주민
  alternatives_korean:
  - 그 땅의 모든 거주자
  - 땅의 모든 사람들
  lexicon: N/A
  rationale: 원문의 전체성을 보존하면서 현대 한국어에서 자연스러운 ‘주민’으로 옮겼습니다.
theological_decisions:
- issue: 서술의 확정성
  chosen_reading: 「참으로」로 כִּי의 강조와 POB의 Surely를 살렸습니다.
  alternative_readings:
  - ‘분명히’
  - ‘정말로’
  rationale: 정탐꾼들의 결론적 확신을 드러내는 강조 부사를 넣어 문장의 판단성을 보존했습니다.
  doctrine_reference: 서술 강조의 번역
