- from: 그래서 여리고 왕이 라합에게 사람을 보내어 말했습니다. “네게 왔고 네 집에 들어간 그 사람들을 이끌어 내십시오. 그들이 온 것은 온 땅을 탐지하려는 것이기 때문입니다.”[a]
  to: 그래서 여리고 왕이 라합에게 이렇게 말했습니다. “당신에게 와서 당신의 집에 들어간 그 사람들을 내보내십시오. 그들이 그 땅 전체를 탐색하려고 왔기 때문입니다.”[a]
