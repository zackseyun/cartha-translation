    rationale: ‘탐지하다’는 보통 감지·검출의 뜻이 강합니다. 이곳은 땅을 조사·정찰하기 위한 행위이므로 ‘탐색하다’가 더 적절하며, ‘정탐하다’는 문맥적 대안으로 각주에 둘 수 있습니다.
