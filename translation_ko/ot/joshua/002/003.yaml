id: JOS.2.3
reference: Joshua 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
  footnotes:
  - marker: a
    text: Or “to spy out all the land.” The Hebrew verb can carry the sense of reconnaissance in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여리고 왕이 라합에게 이렇게 말했습니다. “당신에게 와서 당신의 집에 들어간 그 사람들을 내보내십시오. 그들이 그 땅 전체를 탐색하려고 왔기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅 전체를 정탐하려고.’ 히브리어 동사는 이 문맥에서 정찰을 위한 조사라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 파견하여
  lexicon: HALOT
  rationale: 히브리어 동사 שׁלח의 기본 의미를 자연스럽게 살려, 왕이 라합에게 메시지를 전달하도록 보낸 행위를 한국어로 유려하게 옮겼습니다.
- source_word: הוֹצִיאִי
  english_pob_choice: Bring out
  chosen_korean: 이끌어 내십시오
  alternatives_korean:
  - 데려내십시오
  - 끌어내십시오
  lexicon: HALOT
  rationale: 라합에게 향한 명령형의 힘을 살리면서, 사람들을 집 밖으로 내보내라는 뜻을 현대 한국어에서 가장 분명하게 전달했습니다.
- source_word: הַבָּאִים אֵלַיִךְ / אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  english_pob_choice: who came to you / who entered your house
  chosen_korean: 네게 왔고 네 집에 들어간
  alternatives_korean:
  - 네게 온
  - 네 집으로 들어온
  lexicon: HALOT
  rationale: 두 번 반복되는 בוא를 각각 ‘오다’와 ‘들어가다’로 구분해, 단순 방문이 아니라 라합의 집 안으로 실제 진입한 사실을 드러냈습니다.
- source_word: לַחְפֹּר
  english_pob_choice: to search out
  chosen_korean: 탐지하려는
  alternatives_korean:
  - 정탐하려는
  - 살피려는
  lexicon: HALOT
  rationale: POB의 ‘search out’에 맞추되, 군사적 정탐의 뉘앙스를 너무 좁히지 않도록 ‘탐지하다’로 옮겨 조사·정찰의 의미를 함께 담았습니다.
theological_decisions:
- issue: 라합에게 하는 왕의 명령문을 한국어에서 얼마나 직접적으로 살릴지
  chosen_reading: 직접 명령의 긴박함을 살려 ‘이끌어 내십시오’로 옮겼습니다.
  alternative_readings:
  - 좀 더 완곡한 ‘내보내십시오’
  - 더 거친 ‘끌어내십시오’
  rationale: 본문은 왕의 권위가 실린 즉각적인 요구이므로, 완곡하게 흐리지 않되 현대 합쇼체 안에서 명령의 압박감을 유지했습니다.
  doctrine_reference: 서사 본문의 권위적 발화는 문체로 재현하되, 의미를 약화시키지 않는 원칙
- issue: ‘all the land’의 범위
  chosen_reading: ‘온 땅’으로 옮겼습니다.
  alternative_readings:
  - ‘전 땅’
  - ‘온 지역’
  rationale: 가나안 정복 서사에서 הָאָרֶץ는 당대의 대상 지역을 가리키므로, 문맥상 ‘온 땅’이 가장 자연스럽고 POB의 범위를 보존합니다.
  doctrine_reference: 구약 서사에서 הָאָרֶץ의 문맥적 범위 유지
