  rationale: 문맥상 출애굽-언약의 고유한 하나님의 이름이므로, 제목어로 순화하지 않고 신명 자체를 보존하는 번역을 택했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה (YHWH) → Yahweh'
