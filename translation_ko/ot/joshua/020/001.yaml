  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
  footnotes:
  - marker: a
    text: Or “And the LORD spoke to Joshua, saying.” The Hebrew narrative form can be rendered either “and” or “then” in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 여호수아에게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안으로 “그때 야훼께서 여호수아에게 말씀하셨습니다”처럼 ‘그때’ 대신 ‘그리고’를 둘 수 있습니다. 히브리어 서술 접속형은 영어에서 ‘and’ 또는 ‘then’으로 모두 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: וַיְדַבֵּר는 서술 진행을 여는 동사로, 한국어에서는 자연스러운 성경 문체의 ‘말씀하셨습니다’가 ‘Then ... spoke’의 서사적 진전과 존대를 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 관용적 대체어가 아니라 고유명사로 드러나야 하므로, POB의 방침에 따라 ‘야훼’로 옮깁니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 을/를 향하여
  - 앞에
  lexicon: HALOT
  rationale: ‘야훼께서 여호수아에게 말씀하셨습니다’는 מתן/발화 대상 표시인 אֶל의 기본 의미를 한국어 조사로 자연스럽게 반영합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하며
  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 직접화법을 여는 형식 표지이므로, 한국어에서는 중복된 ‘말하며’보다 종결된 서술로 처리해도 소스의 기능을 보존합니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문맥상 출애굽-언약의 고유한 하나님의 이름이므로, 제목어로 순화하지 않고 신명 자체를 보존하는 번역을 택했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה (YHWH) → Yahweh'
