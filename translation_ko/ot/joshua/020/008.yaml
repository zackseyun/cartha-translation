base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
  footnotes:
  - marker: a
    text: Traditionally, 'Ramoth-gilead.' The Hebrew reads literally 'Ramoth in Gilead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요단 강 건너편, 여리고 동쪽에서 그들은 광야의 고원에 있는 베셀을 르우벤 지파에서, 길르앗에 있는 라못을[a] 갓 지파에서, 바산에 있는 골란을 므낫세 지파에서 지정하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘라못-길르앗’이라고 부릅니다. 히브리어는 문자적으로 ‘길르앗에 있는 라못’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן
  english_pob_choice: And beyond the Jordan
  chosen_korean: 요단 강 건너편
  alternatives_korean:
  - 요단 강 이편
  - 요단 강 건너
  lexicon: HALOT
  rationale: 지리적 기준점을 이스라엘 본토에서 본 방향으로 자연스럽게 옮기되, ‘beyond’의 상대적 공간 감각을 유지했습니다.
- source_word: נָתְנוּ
  english_pob_choice: they designated
  chosen_korean: 지정하였습니다
  alternatives_korean:
  - 정하였습니다
  - 세웠습니다
  - 주었습니다
  lexicon: HALOT
  rationale: 성소 기능을 가진 도피성 도시들을 공식적으로 배정하는 행정적 행위를 나타내므로, 단순한 ‘주다’보다 ‘지정하다’가 더 정확합니다.
- source_word: בַּמִּדְבָּר בַּמִּישֹׁר
  english_pob_choice: in the wilderness on the plateau
  chosen_korean: 광야 평원에 있는
  alternatives_korean:
  - 광야의 평지에 있는
  - 광야의 고원에 있는
  - 광야와 평원에 있는
  lexicon: HALOT
  rationale: 두 지형표현을 함께 살리되 한국어에서는 ‘광야’와 ‘평원’을 병렬적으로 묶는 편이 원문의 지리적 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: רָאמֹת בַּגִּלְעָד
  english_pob_choice: Ramoth in Gilead
  chosen_korean: 길르앗에 있는 라못
  alternatives_korean:
  - 길르앗의 라못
  - 라못-길르앗
  lexicon: HALOT
  rationale: 히브리어가 합성지명보다 ‘라못 + 길르앗의 위치’ 형식을 보이므로, 본문에서는 원형에 가깝게 옮기고 전통적 합성형은 각주로 처리했습니다.
- source_word: מִמַּטֵּה
  english_pob_choice: from the tribe of
  chosen_korean: 지파의
  alternatives_korean:
  - 지파에서
  - ~지파에서 나온
  - ~지파에 속한
  lexicon: HALOT
  rationale: 세 도시가 각각 특정 지파의 할당임을 간결하게 드러내기 위해 소속을 나타내는 관형 구문으로 옮겼습니다.
theological_decisions:
- issue: 도피성 목록의 행정적·성소적 성격
  chosen_reading: 이 구절은 도피성의 공식 배정을 설명하는 목록 문장으로, 서술을 평이하게 유지하되 ‘지정하였습니다’로 제도적 성격을 반영했습니다.
  alternative_readings:
  - ‘정하였습니다’로 더 단순하게 옮기는 방식
  - ‘세우셨습니다’처럼 건립 의미를 강하게 띠게 하는 방식
  rationale: 본문은 건축보다 기능 부여와 구획 설정에 초점이 있으므로, 행정적 지정이라는 의미를 보존하는 것이 더 적절합니다.
  doctrine_reference: 민 35장과 신 19장의 도피성 규례 배경
- issue: 지명 전통형과 원문형의 균형
  chosen_reading: ‘라못-길르앗’ 같은 전통형을 본문이 아니라 각주에 두고, 본문은 ‘길르앗에 있는 라못’으로 유지했습니다.
  alternative_readings:
  - 전통적 교회 용례인 ‘라못-길르앗’을 본문에 직접 쓰는 방식
  - ‘길르앗의 라못’으로 축약하는 방식
  rationale: 원문이 지역명+소속 관계를 드러내므로, 한국 교회 전통형을 무조건 따르기보다 원문 구조를 먼저 보존했습니다.
  doctrine_reference: 본문 구조 보존 원칙
