source:
  edition: WLC
  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
  footnotes:
  - marker: a
    text: Or 'his words' or 'his matter'; the Hebrew can refer either to the words he speaks or to the case he presents.
    reason: lexical_alternative
  - marker: b
    text: Or 'receive him into the city among them'; the Hebrew verb can mean 'gather,' 'bring in,' or 'receive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이 성읍들 가운데 하나로 도망하여 성문 어귀에 서서, 그 성읍의 장로들의 귀에 자기 사정을 말해야 합니다. 그러면 그들은 그를 성읍 안으로 자기들에게 데려다가 그에게 자리를 주고, 그는 그들과 함께 살 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 한 말’이나 ‘그가 말한 일’로도 옮길 수 있습니다. 히브리어는 그가 말하는 말이나 그가 제기하는 사정을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 성읍 안에서 자기들 가운데 받아들이고’로도 옮길 수 있습니다. 히브리어 동사는 ‘모으다’, ‘데려오다’, ‘받아들이다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  english_pob_choice: He shall flee
  chosen_korean: 도망하여
  alternatives_korean:
  - 피하여
  - 달아나서
  - 도망가서
  lexicon: HALOT
  rationale: 법률 절차의 미래·명령적 뉘앙스를 한국어에서도 간결하게 살리되, 문맥상 도피 행위를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: פֶּתַח שַׁעַר הָעִיר
  english_pob_choice: the entrance of the city gate
  chosen_korean: 성문 어귀
  alternatives_korean:
  - 성문 입구
  - 성문 앞
  - 성문 출입구
  lexicon: HALOT
  rationale: פֶּתַח과 שַׁעַר의 이중 이미지를 자연스러운 한국어 관용으로 압축해, 공적 심판 장소로서의 성문을 드러내는 ‘성문 어귀’를 택했습니다.
- source_word: אֶת דְּבָרָיו
  english_pob_choice: his case
  chosen_korean: 자기 사정
  alternatives_korean:
  - 자기 말
  - 자기 일
  - 자기 사건
  lexicon: HALOT
  rationale: 법정적 맥락에서 דָּבָר가 단순한 ‘말’보다 ‘사정/사건의 진술’을 가리킬 수 있으므로, ‘자기 사정’으로 옮겨 말하는 내용과 제기하는 사안을 함께 살렸습니다.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  english_pob_choice: Then they shall bring him into the city to themselves
  chosen_korean: 그들은 그를 성읍 안으로 자기들에게 데려다가
  alternatives_korean:
  - 그들은 그를 성읍으로 데려가서 자기들 가운데 두고
  - 그들은 그를 성읍 안으로 받아들여 자기들에게로
  lexicon: HALOT
  rationale: אָסַף의 ‘모으다/데려오다/받아들이다’와 אֲלֵיהֶם의 ‘그들에게로’를 함께 보존하기 위해, 공식적 수용의 뉘앙스를 가진 ‘데려다가’를 사용했습니다.
- source_word: וְנָתְנוּ ל֥וֹ מָק֖וֹם
  english_pob_choice: and they shall give him a place
  chosen_korean: 그에게 자리를 주고
  alternatives_korean:
  - 그에게 거처를 주고
  - 그에게 장소를 주고
  - 그에게 머물 곳을 주고
  lexicon: HALOT
  rationale: מָקוֹם의 기본 뜻을 넓게 살리면서도, 성읍 안에서의 실제 배정·보호를 자연스럽게 드러내는 한국어로 ‘자리를 주고’를 택했습니다.
