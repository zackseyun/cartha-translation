  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
  footnotes:
  - marker: a
    text: Hebrew 'Kiriath-arba, it is Hebron'—that is, Kiriath-arba is another name for Hebron.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 납달리 산지의 갈릴리에 있는 게데스와 에브라임 산지의 세겜과 유다 산지의 기럇아르바[a], 곧 헤브론을 구별하여 정해 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
