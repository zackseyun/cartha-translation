base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
  footnotes:
  - marker: a
    text: Hebrew 'Kiriath-arba, it is Hebron'—that is, Kiriath-arba is another name for Hebron.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 갈릴리의 게데스[a]와 에브라임의 산지의 세겜, 그리고 기럇아르바—곧 헤브론—을 유다의 산지에 구별해 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘기럇아르바, 곧 헤브론’으로, 기럇아르바가 헤브론의 다른 이름임을 밝힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  english_pob_choice: set apart
  chosen_korean: 구별해 두었습니다
  alternatives_korean:
  - 거룩하게 하였습니다
  - 성별하였습니다
  - 지정하였습니다
  lexicon: HALOT
  rationale: 이 동사는 이곳에서 예배적 ‘성화’보다 도피성으로 따로 정해 두는 공적·법적 행위를 가리키므로, ‘구별해 두다’가 원뜻을 가장 자연스럽게 살립니다.
- source_word: בַּגָּלִיל
  english_pob_choice: in Galilee
  chosen_korean: 갈릴리의
  alternatives_korean:
  - 갈릴리 지역의
  - 갈릴의
  lexicon: HALOT
  rationale: 지명은 현대 한국어에서 널리 쓰이는 표기를 따르되, 앞뒤 어순은 한국어 관형격으로 자연스럽게 맞추었습니다.
- source_word: בְּהַר נַפְתָּלִי / בְּהַר אֶפְרָיִם / בְּהַר יְהוּדָה
  english_pob_choice: in the hill country of Naphtali / Ephraim / Judah
  chosen_korean: 산지의
  alternatives_korean:
  - 산악지대의
  - 산들의
  - 산지
  lexicon: HALOT
  rationale: 여기서 הַר은 단일한 산봉우리보다 각 지파의 고지대·산악 지역을 뜻하므로, ‘산지’가 POB의 ‘hill country’를 가장 간결하고 정확하게 옮깁니다.
- source_word: קִרְיַת אַרְבַּע הִיא חֶבְרוֹן
  english_pob_choice: Kiriath-arba (that is, Hebron)
  chosen_korean: 기럇아르바—곧 헤브론—
  alternatives_korean:
  - 기럇아르바(즉 헤브론)
  - 기럇아르바, 곧 헤브론
  - 기럇아르바, 즉 헤브론
  lexicon: HALOT
  rationale: 히브리어의 설명적 동격을 살려 두 지명이 동일한 곳임을 분명히 하되, 한국어에서 자연스러운 삽입구로 처리했습니다.
theological_decisions:
- issue: קדשׁ의 의미가 이 구절에서 예전적 ‘거룩하게 함’인지 행정적 ‘지정’인지
  chosen_reading: 도피성으로 공적으로 따로 정해 두는 행위로 이해해 ‘구별해 두었습니다’로 옮겼습니다.
  alternative_readings:
  - 거룩하게 하였습니다
  - 성별하였습니다
  rationale: 문맥이 성전 제의가 아니라 도피성 지정이므로, 본문의 법적 기능을 흐리지 않도록 예전적 뉘앙스를 과도하게 부각하지 않았습니다.
  doctrine_reference: 도피성 규례의 행정적 지정(민 35, 수 20 문맥)
