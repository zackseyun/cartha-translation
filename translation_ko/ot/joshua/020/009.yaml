  to: 이것들은 이스라엘의 모든 자손[a]과 그들 가운데 거주하는 거류민[b]을 위한 지정된 성읍들이었습니다. 이는 누구든지 부지중에 사람을 죽인 자가 그리로 도망하여 회중[c] 앞에 설 때까지 피의 보복자의 손에 죽지 않도록 하기 위한 것이었습니다.
  rationale: 문법상 중복된 주어를 바로잡고, גֵּר와 בִּשְׁגָגָה의 법적·정주적 뉘앙스를 더 정확한 현대 표준어로 반영했습니다. 성읍들이 지정되었다는 첫 절의 표현과 ‘회중 앞에 설 때까지’라는 보호의 한계는 유지했습니다.
