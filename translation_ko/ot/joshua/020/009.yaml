  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'for all the Israelites.' The Hebrew reads 'for all the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' refers to a non-Israelite resident living among Israel under its communal order.'
    reason: cultural_note
  - marker: c
    text: Or 'assembly' for 'congregation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 이스라엘의 모든 자손과 그들 가운데 거주하는 나그네를 위한 지정된 성읍들이었습니다. 곧 누구든지 실수로 사람을 죽인 자가 거기로 도망하여, 회중 앞에 설 때까지 피의 보복자의 손에 죽지 않게 하려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’은 히브리어의 ‘이스라엘의 아들들’을 비교적 직역한 표현입니다. 더 자연스럽게는 ‘이스라엘 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 이스라엘 가운데 거주하는 비이스라엘인, 곧 공동체 안의 거류민을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘회중’은 여기서 공적 판단을 행하는 공동체적 모임을 가리킬 수 있습니다. ‘총회’ 또는 ‘공동체’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  english_pob_choice: the appointed cities
  chosen_korean: 지정된 성읍들
  alternatives_korean:
  - 임명된 성읍들
  - 정해진 성읍들
  - 피난 성읍들
  lexicon: HALOT
  rationale: מוּעָדָה는 ‘정해지다/지정되다’의 뜻을 가지므로, ‘지정된 성읍들’이 법적·기능적 성격을 가장 자연스럽게 살립니다. '피난'은 뒤 문맥에 있으므로 이 구절의 표현에는 덧붙이지 않았습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: for all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘 사람들 모두를 위한
  - 이스라엘의 모든 아들들
  - 모든 이스라엘 사람들을 위한
  lexicon: HALOT
  rationale: 직역상 ‘이스라엘의 아들들/자손’이므로, 남성 복수의 대표적 언약 표현을 살려 ‘자손’으로 옮겼습니다. 너무 평탄한 집합명사보다 원문 구조가 드러납니다.
- source_word: לַגֵּר הַגָּר בְּתוֹכָם
  english_pob_choice: for the sojourner residing among them
  chosen_korean: 그들 가운데 거주하는 나그네
  alternatives_korean:
  - 그들 가운데 사는 거류민
  - 그들 가운데 머무는 외국인
  - 그들 가운데 거주하는 소위 나그네
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 공동체 안에 법적으로 거주하는 비이스라엘인을 가리키므로, 교회적 관용어보다 법적 범주를 드러내는 ‘거주하는 나그네’가 적절합니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 실수로
  alternatives_korean:
  - 부지중에
  - 고의 없이
  - 우연히
  lexicon: HALOT
  rationale: 법률 문맥의 ‘의도 없음/과실적 우발’을 한국어로 가장 간결하게 드러내는 표현으로 ‘실수로’를 택했습니다. 다만 형벌 책임이 배제되는 뉘앙스는 뒤의 보호 규정으로 유지됩니다.
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 피의 보복자
  alternatives_korean:
  - 피를 갚는 자
  - 피의 원수 갚는 자
  - 피의 보복자
  lexicon: HALOT
  rationale: גֹּאֵל הַדָּם의 법적 역할은 혈연 복수자이므로, 전통적이지만 명확한 ‘피의 보복자’를 사용했습니다. ‘보복자’는 단순 감정적 복수보다 법적 책임의 뉘앙스를 보존합니다.
- source_word: לִפְנֵי הָעֵדָה
  english_pob_choice: before the congregation
  chosen_korean: 회중 앞에
  alternatives_korean:
  - 회중 앞에서
  - 공동체 앞에
  - 총회 앞에
  lexicon: HALOT
  rationale: עֵדָה는 여기서 재판적·공적 집단을 가리키므로, 기관화된 ‘회중’이 가장 자연스럽습니다. ‘앞에 서다’라는 판결 절차의 형식도 살렸습니다.
theological_decisions:
- issue: גֵּר의 지위와 번역
  chosen_reading: 그들 가운데 거주하는 나그네
  alternative_readings:
  - 거류민
  - 외국인 거주자
  - 나그네
  rationale: 이 구절은 이스라엘 공동체 밖의 사람도 살인 과실 사건에서 동일한 보호를 받는다는 점을 보여 줍니다. 그래서 단순한 여행자 뉘앙스보다 공동체 내부 거주와 법적 보호 범주가 드러나도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 성읍들의 기능을 ‘피난’으로 미리 풀어 쓰는지 여부
  chosen_reading: 지정된 성읍들
  alternative_readings:
  - 피난 성읍들
  - 피난처로 지정된 성읍들
  rationale: 문맥상 이 성읍들이 피난 기능을 하지만, 본문 첫 절구는 그 기능을 ‘지정됨’으로 진술합니다. 따라서 기능을 과도하게 앞당겨 해석하지 않고, 뒤의 목적절에서 피난 의미를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
