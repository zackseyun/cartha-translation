revisions:
- from: 이스라엘 자손에게 말하여, ‘너희를 위하여 도피성을 지정하라. 그것은 내가 너희에게 모세의 손을 통해 말한 것이다’ 하십시오.[a]
  to: 이스라엘 자손에게 말하여 이르십시오. “너희를 위하여, 내가 모세를 통하여[a] 너희에게 말한 도피성들을 정하여라.”
  rationale: 원문의 명령 구조를 ‘말하여 이르십시오’로 명확히 하고, ‘내가 모세를 통하여 너희에게 말한’이 ‘도피성들’을 수식하도록 복원했습니다. ‘모세를 통하여’는 히브리어 관용구의 의미를 자연스러운 한국어로 전달하며, 문자적 표현은 해당 위치의 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
