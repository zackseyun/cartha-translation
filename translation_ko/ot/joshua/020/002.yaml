base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning ''through Moses.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. “너희를 위하여, 내가 모세를 통하여[a] 너희에게 말한 도피성들을 정하여라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모세의 손으로’라고 하며, 관용적으로 ‘모세를 통하여’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 말하라
  lexicon: HALOT
  rationale: 직접 명령형을 살리되, 이어지는 인용문 도입과 자연스럽게 연결되도록 합쇼체의 연결형으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족적/언약적 표현을 보존하되, 한국어 성경에서 자연스럽게 읽히는 전통적 대응인 ‘자손’을 택했습니다.
- source_word: תְּנוּ לָכֶם
  english_pob_choice: Appoint for yourselves
  chosen_korean: 너희를 위하여 … 지정하라
  alternatives_korean:
  - 너희를 위하여 … 정하라
  - 너희를 위하여 … 세우라
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘주다’가 아니라 기능을 부여해 구별하는 행정적 의미이므로, ‘지정하다’로 옮겼습니다.
- source_word: עָרֵי הַמִּקְלָט
  english_pob_choice: the cities of refuge
  chosen_korean: 도피성
  alternatives_korean:
  - 피난 성읍들
  - 도피의 성읍들
  lexicon: HALOT
  rationale: 율법 용어로 굳어진 의미를 압축하면서도 ‘피난처’의 기능을 분명히 드러내는 대응어로 보았습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 영어 본문은 관용적 의미를 ‘through Moses’로 풀었지만, 히브리어의 ‘손을 통해’라는 매개 표현을 한국어 본문에 유지해 원문 감각을 살렸습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집단 지칭 방식
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 민족
  rationale: 남성 복수의 언약적 호칭을 중립화하지 않고, 원문 구조를 비교적 직접적으로 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: בְּיַד מֹשֶׁה의 매개성 표현
  chosen_reading: 모세의 손을 통해
  alternative_readings:
  - 모세를 통해
  - 모세의 손으로
  rationale: 명령의 출처가 하나님께 있고 모세는 매개자라는 점을 드러내기 위해, 직역적 관용을 본문에 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
