    issue: ‘들어갈 수 있습니다’는 וּבָא의 의미 범위 안에 있으나, ‘도시와 집’에 함께 연결될 때 다소 부자연스럽습니다.
    rationale: 귀환의 법적 허용을 유지하면서 ‘돌아갈 수 있습니다’로 옮기면 한국어 문장이 자연스럽고 목적지의 병렬도 보존됩니다.
