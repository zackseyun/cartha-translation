source:
  edition: WLC
  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
  footnotes:
  - marker: a
    text: Or 'assembly' for 'congregation.' The Hebrew refers to the gathered community acting in legal judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'the killer' or 'the slayer.' 'Manslayer' is used here to preserve the legal distinction from a convicted murderer in the city-of-refuge laws.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기의 도시에서 그가 판결을 받기 위해 회중 앞에 설 때까지, 그리고 그때 그 직무에 있는 대제사장이 죽을 때까지 그 성읍에 살아야 합니다. 그 후에 살인자는 돌아와 자기 도시와 자기 집, 곧 그가 거기서 도망쳐 나온 그 성읍으로 들어갈 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중’ 대신 ‘회의’로 옮길 수 있습니다. 히브리어는 법적 판결을 수행하는 모인 공동체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살인자’ 대신 ‘죽인 자’ 또는 ‘죽인 사람’으로 옮길 수 있습니다. 여기서는 도피성 규례의 법적 인물을 가리키기 위해 중립적 표현을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  english_pob_choice: he shall live
  chosen_korean: 살아야 합니다
  alternatives_korean:
  - 머물러야 합니다
  - 거주해야 합니다
  - 살아가야 합니다
  lexicon: HALOT
  rationale: 도피성에서의 계속 거주라는 법적 의무를 한국어로 자연스럽게 드러내면서, 단순한 정지보다 ‘삶의 지속’ 의미를 살렸습니다.
- source_word: לִפְנֵי הָעֵדָה
  english_pob_choice: before the congregation
  chosen_korean: 회중 앞에
  alternatives_korean:
  - 회중 앞에서
  - 회합 앞에
  - 공동체 앞에
  lexicon: HALOT
  rationale: הָעֵדָה는 재판을 수행하는 집합된 이스라엘 공동체를 가리키므로, 본문의 법정적 기능을 살려 ‘회중’으로 옮겼습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 판결을 받기 위해
  alternatives_korean:
  - 재판을 받기 위해
  - 심판을 받기 위해
  - 판정받기 위해
  lexicon: HALOT
  rationale: 이 구절의 משפט은 일반적 ‘정의’가 아니라 법적 심리·판정을 뜻하므로, 문맥에 맞게 판결의 절차를 분명히 했습니다.
- source_word: הָרֹצֵחַ
  english_pob_choice: the manslayer
  chosen_korean: 살인자
  alternatives_korean:
  - 사람을 죽인 자
  - 죽인 자
  - 살해자
  lexicon: HALOT
  rationale: 문맥상 도피성 규례의 법적 당사자를 가리키며, 한국어 법감각에서 중립적 표지를 유지하기 위해 ‘살인자’로 옮겼습니다. 이 절만으로는 유죄 확정의 뉘앙스를 과도하게 강하게 만들지 않도록 주의했습니다.
- source_word: עִירוֹ / בֵּיתוֹ
  english_pob_choice: his city and to his house
  chosen_korean: 자기 도시와 자기 집
  alternatives_korean:
  - 자기 성읍과 자기 집
  - 자기 성읍과 자기 가문
  - 자기 마을과 자기 집
  lexicon: HALOT
  rationale: 두 겹의 회복—공적 거처와 사적 생활권—을 그대로 살리기 위해 ‘도시’와 ‘집’을 병렬로 유지했습니다.
theological_decisions:
- issue: 고위 제사장의 죽음 이후 귀환의 법적 의미
  chosen_reading: ‘돌아와 … 들어갈 수 있습니다’로 옮겨, 허용된 귀환의 의미를 분명히 했습니다.
  alternative_readings:
  - 돌아와 … 들어가야 합니다
  - 돌아올 수 있습니다
  - 돌아가게 됩니다
  rationale: 본문은 단순 예측이 아니라 제한에서의 해제를 말하므로, 법적 허용을 나타내는 표현이 가장 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve legal force without 과장된 필연성'
