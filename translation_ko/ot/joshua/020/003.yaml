revisions:
- from: 살인자가 사람을 부지중에, 곧 알지 못하고 쳐 죽인 경우에, 그가 그리로 도피할 수 있도록 하며, 그 성읍들은 너희에게 피난처가 되어야 합니다. 이는 피 흘린 자의 보복자에게서 보호하기 위함입니다.[a][b]
  to: 사람을 부지중에, 알지 못하고 쳐 죽인 자[a]가 그리로 도피할 수 있게 하십시오. 그 성읍들은 너희에게 피의 보복자[b]를 피할 피난처가 될 것입니다.
  rationale: 비고의적 사망을 일으킨 사람이라는 법적 성격을 ‘살인자’ 대신 중립적인 서술로 나타냈습니다. גֹּאֵל הַדָּם의 관용적 법률 의미를 ‘피의 보복자’로 바로잡고, 원문의 목적절 및 피난처의 기능을 간결하게 재구성했습니다. 각주 표지도 해당 본문 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:03Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어의 רוֹצֵחַ는 뒤의 ‘부지중에, 알지 못하고’라는 한정 아래 있으므로 본문에서 ‘살인자’로 옮기면 고의적 살인의 뜻을 불필요하게 불러일으킵니다. 또한 גֹּאֵל הַדָּם은 ‘피 흘린 자의 보복자’가 아니라 ‘피의 보복자’(또는 ‘피를 갚는 자’)입니다. 원문의 목적 표현과 복수 주어(성읍들)도 자연스럽게 반영해야 합니다.
  naturalness: 초안의 ‘...경우에, 그가 ... 하도록 하며’는 문장 구조가 다소 부자연스럽고, 마지막의 ‘이는 ... 위함입니다’는 앞선 ‘피난처’의 기능을 중복하여 원문보다 설명적으로 만듭니다. 두 문장으로 간결하게 옮기는 편이 현대 표준어 합쇼체에 맞습니다.
  terminology: ‘피난처’는 מִקְלָט에 적절합니다. 비고의적 사망을 일으킨 사람은 ‘사람을 ... 쳐 죽인 자’로 옮기고, 제도적 용어인 גֹּאֵל הַדָּם은 ‘피의 보복자’로 유지하는 것이 정확합니다.
  issues:
  - severity: high
    issue: ‘살인자’가 비고의적 행위자에게 사용되었습니다.
    rationale: 한국어 ‘살인자’는 통상 고의적·범죄적 살인을 강하게 뜻합니다. 원문은 곧바로 비고의성과 무지를 명시하므로, 본문에서는 중립적인 ‘사람을 ... 쳐 죽인 자’가 더 충실합니다.
  - severity: high
    issue: ‘피 흘린 자의 보복자’는 גֹּאֵל הַדָּם의 관계를 잘못 나타냅니다.
    rationale: 이 표현은 피를 흘린 사람, 곧 가해자의 보복자처럼 읽힐 수 있습니다. 원문의 관용 법률 명칭은 죽음에 대한 보복을 수행하는 ‘피의 보복자’입니다.
  - severity: medium
    issue: 원문의 ‘피의 보복자로부터’가 ‘이는 ... 보호하기 위함입니다’로 풀어져 중복되었습니다.
    rationale: מִגֹּאֵל הַדָּם은 피난처의 상대·위협을 직접 나타냅니다. 이를 ‘피의 보복자를 피할’로 옮기면 뜻과 문장 구조가 모두 선명합니다.
  - severity: low
    issue: 각주 표지가 해당 어구에 인접하지 않습니다.
    rationale: 어휘 대안 각주는 ‘쳐 죽인 자’에, 문화 주석은 ‘피의 보복자’에 붙여 독자가 적용 대상을 즉시 알 수 있게 해야 합니다.
