  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
  footnotes:
  - marker: a
    text: Or 'killer' or 'slayer'; the Hebrew term is qualified here by 'unintentionally' and 'without knowledge,' so it does not mean a deliberate murderer in this verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the blood avenger'; the Hebrew phrase refers to the person responsible for avenging a death within Israel's kinship-based legal system.
    reason: cultural_note
translation:
  language: ko
  text: 살인자가 사람을 부지중에, 곧 알지 못하고 쳐 죽인 경우에, 그가 그리로 도피할 수 있도록 하며, 그 성읍들은 너희에게 피난처가 되어야 합니다. 이는 피 흘린 자의 보복자에게서 보호하기 위함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죽인 자', '살인자', '살해한 자'. 이 말은 이 절에서 '부지중에'와 '알지 못하고'로 제한되므로, 의도적인 살인자를 뜻하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '피의 보복자에게서'. 이 표현은 이스라엘의 친족 기반 법질서에서 죽음의 보복을 맡은 사람을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  english_pob_choice: may flee there
  chosen_korean: 그리로 도피할 수 있도록
  alternatives_korean:
  - 거기로 도망할 수 있도록
  - 그곳으로 피할 수 있도록
  lexicon: HALOT
  rationale: 도피소 문맥에서 לָנוּס와 방향 부사 שָׁמָּה를 자연스러운 목적 표현으로 옮겼습니다. '도피하다'는 법적 보호를 받기 위한 피신의 뉘앙스를 잘 살립니다.
- source_word: רוֹצֵחַ מַכֵּה נֶפֶשׁ
  english_pob_choice: manslayer who strikes down a person
  chosen_korean: 살인자가 사람을 부지중에, 곧 알지 못하고 쳐 죽인 경우
  alternatives_korean:
  - 사람을 죽인 자
  - 사람을 쳐 죽인 자
  lexicon: HALOT
  rationale: רוֹצֵחַ는 일반적 '살인자'보다 법적 구분을 드러내며, 뒤의 수식절이 그 행위가 고의가 아님을 제한하므로 한국어 본문에서 '부지중에, 곧 알지 못하고'를 함께 두어 오해를 막았습니다.
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  english_pob_choice: unintentionally, without knowledge
  chosen_korean: 부지중에, 곧 알지 못하고
  alternatives_korean:
  - 실수로, 알지 못하고
  - 우연히, 모르고
  lexicon: HALOT
  rationale: 두 표현은 단순한 사고가 아니라 의도와 지식의 부재를 함께 강조합니다. '부지중에'와 '알지 못하고'를 병렬로 두어 중복되는 법정 어감을 살렸습니다.
- source_word: מִקְלָט
  english_pob_choice: refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 피신처
  - 도피처
  lexicon: HALOT
  rationale: 도피성 제도에서 מִקְלָט의 기능을 가장 직접적으로 드러내는 표준적 표현으로 '피난처'를 택했습니다.
- source_word: מִגֹּאֵל הַדָּם
  english_pob_choice: from the avenger of blood
  chosen_korean: 피 흘린 자의 보복자에게서
  alternatives_korean:
  - 피의 보복자에게서
  - 피의 원수 갚는 자에게서
  lexicon: HALOT
  rationale: גֹּאֵל הַדָּם은 친족 법질서 안에서 살해를 갚는 역할을 가리키므로, POB의 직역 취지를 따라 '보복자'를 유지하되 한국어에서 '피 흘린 자'로 대상 관계를 드러냈습니다.
theological_decisions:
- issue: 이 구절의 רוֹצֵחַ를 어떻게 이해할지
  chosen_reading: 고의적 살인자가 아니라, 과실 치사에 해당하는 자를 가리키는 법적 용법으로 읽었습니다.
  alternative_readings:
  - 일반적인 '죽인 자'로 완화해 번역할 수 있습니다.
  - '''살인자''를 그대로 두면 고의성으로 오해될 수 있습니다.'
  rationale: 뒤따르는 '부지중에'와 '알지 못하고'가 행위의 비고의성을 분명히 하므로, 독자가 이 제도를 의도적 살인과 혼동하지 않도록 했습니다.
  doctrine_reference: 민수기 35장과 신명기 19장의 도피성 규례
