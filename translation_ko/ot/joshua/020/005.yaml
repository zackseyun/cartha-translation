source:
  edition: WLC
  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
  footnotes:
  - marker: a
    text: Literally, 'from yesterday and the day before,' a Hebrew idiom meaning 'previously' or 'formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 피의 보복자가 그를 뒤쫓으면, 그들은 그 사람을 죽인 자를 피의 보복자의 손에 넘겨주어서는 안 됩니다. 그가 고의 없이 자기 이웃 사람을 쳤고, 어제나 그저께부터[a] 그를 미워한 것이 아니기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어제와 그저께부터’입니다. 히브리 관용구로 ‘이전부터’ 또는 ‘예전부터’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 피의 보복자
  alternatives_korean:
  - 피의 원수 갚는 자
  - 피의 복수자
  - 피의 복수자
  lexicon: HALOT
  rationale: 도피성 문맥의 법적 용어로서, 혈연 책임을 지고 보복하는 자라는 기능을 드러내기 위해 직역에 가까운 표현을 택했습니다.
- source_word: יָסְגִּרוּ
  english_pob_choice: hand ... over
  chosen_korean: 넘겨주어서는 안 됩니다
  alternatives_korean:
  - 인도해서는 안 됩니다
  - 내주어서는 안 됩니다
  - 건네주어서는 안 됩니다
  lexicon: HALOT
  rationale: 상대의 권력 아래로 넘기는 법정적 뉘앙스를 살리기 위해 관용적이고 현대적인 ‘넘겨주다’를 사용했습니다.
- source_word: הָרֹצֵחַ
  english_pob_choice: the manslayer
  chosen_korean: 그 살인자
  alternatives_korean:
  - 그 사람을 죽인 자
  - 그 살해자
  - 그 살인한 자
  lexicon: HALOT
  rationale: 이 절에서는 도피성으로 피한 사람을 가리키지만 한국어 ‘살인자’가 문맥상 가장 직접적으로 그 법적 긴장을 전달합니다. 다만 ‘살인’이 곧바로 유죄 판정을 뜻하지 않도록 문장 전체에서 의도 없음과 비혐오를 함께 살렸습니다.
- source_word: בִּבְלִי דַעַת
  english_pob_choice: without intent
  chosen_korean: 의도 없이
  alternatives_korean:
  - 무지로
  - 알지 못한 채
  - 고의 없이
  lexicon: HALOT
  rationale: 법적 핵심은 단순한 지식 부족이 아니라 고의성의 부재이므로, 현대 한국어에서 자연스러운 ‘의도 없이’로 옮겼습니다.
theological_decisions:
- issue: 도피성 문맥에서 הָרֹצֵחַ의 한국어 법적 뉘앙스
  chosen_reading: ‘그 살인자’로 옮기되, 앞뒤 문맥에서 의도 없는 치명상을 설명하여 유죄 판단을 미루는 구조를 유지했습니다.
  alternative_readings:
  - 그 사람을 죽인 자
  - 그 살해자
  - 그 살인한 자
  rationale: 본문은 이 사람을 즉각적인 살인범으로 단정하지 않고, 의도 없음과 이전의 적의 없음으로 보호합니다. 한국어에서도 이 긴장을 약화시키지 않아야 합니다.
  doctrine_reference: Translation philosophy §1, §5
