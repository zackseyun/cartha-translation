  source_fidelity: ‘그 살인자’는 도피성 법규에서 아직 고의적 살인으로 확정되지 않은 הָרֹצֵחַ에 ‘살인자’라는 유죄·고의의 뉘앙스를 부여하므로 적절하지 않습니다. 또한 현 각주 표지는 ‘뒤쫓으면’에 붙어 있으나, 각주의 대상인 히브리 시간 관용구는 문장 끝의 ‘어제나 그저께부터’입니다. ‘고의 없이’와 ‘쳤고’는 בִּבְלִי דַעַת 및 הִכָּה의 법적·어휘적 의미를 잘 반영합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 법률적·서술적 문맥에 자연스럽습니다. ‘피의 보복자의 손에’는 대명사의 지시 대상을 분명히 하며, ‘그 사람을 죽인 자’는 한국어에서 다소 길지만 고의적 살인을 단정하지 않는 가장 안전하고 명료한 표현입니다.
