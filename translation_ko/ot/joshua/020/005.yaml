  to: 그리고 피의 보복자가 그를 뒤쫓으면, 그들은 그 사람을 죽인 자를 피의 보복자의 손에 넘겨주어서는 안 됩니다. 그가 고의 없이 자기 이웃 사람을 쳤고, 어제나 그저께부터[a] 그를 미워한 것이 아니기 때문입니다.
