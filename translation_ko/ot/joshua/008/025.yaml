  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
  footnotes:
  - marker: a
    text: 'Or ''all the people of Ai'' / ''all the inhabitants of Ai.'' Hebrew: ''all the men of Ai,'' an idiom that can refer corporately to the city''s population.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 쓰러진 자들은 남자부터 여자까지 모두 만 이천 명이었으니, 곧 아이의 모든 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아이의 모든 남자들’. 이 히브리어 표현은 도시의 전체 인구 또는 주민을 가리키는 집합적 관용으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַנֹּפְלִים
  english_pob_choice: all who fell
  chosen_korean: 쓰러진 사람은 모두
  alternatives_korean:
  - 모든 쓰러진 자는
  - 그날 죽은 사람은 모두
  lexicon: HALOT
  rationale: נפל의 분사형은 문자적으로는 ‘떨어진/쓰러진 자들’이지만, 전투 문맥에서는 패전하여 죽은 사람들을 가리키므로 ‘쓰러진 사람’으로 옮겨 원문 이미지를 유지했습니다.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  english_pob_choice: from man to woman
  chosen_korean: 남자에서 여자까지
  alternatives_korean:
  - 남자에서 여자에 이르기까지
  - 남성에서 여성까지
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 그대로 살려, 남녀를 포괄하는 총체성을 드러내는 방식으로 옮겼습니다.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  english_pob_choice: twelve thousand
  chosen_korean: 모두 만이천 명
  alternatives_korean:
  - 만이천 명
  - 열두 천 명
  lexicon: HALOT
  rationale: 한국어의 자연스러운 수량 표현은 ‘만이천 명’이며, 단위 ‘명’을 보태 인명 집계를 분명히 했습니다.
- source_word: כֹּל אַנְשֵׁי הָעָי
  english_pob_choice: all the men of Ai
  chosen_korean: 아이 사람들은 모두
  alternatives_korean:
  - 아이의 모든 남자들은
  - 아이 주민들은 모두
  lexicon: HALOT
  rationale: אַנְשֵׁי를 직역하면 ‘아이의 남자들’이지만, 앞의 ‘남자에서 여자까지’와 함께 쓰여 도시 전체 인구를 가리키는 관용으로 보이므로, 의미를 살려 ‘아이 사람들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 성별 표지와 도시 전체를 가리키는 관용을 어떻게 함께 살릴지
  chosen_reading: 본문에서는 ‘남자에서 여자까지’와 ‘아이 사람들’을 함께 두어, 성별 표지를 유지하면서도 총체적 학살 진술임을 드러냈습니다.
  alternative_readings:
  - 아이의 모든 남자들은
  - 아이 주민들은 모두
  rationale: 원문은 성별 범위를 표시한 뒤 도시 집단을 가리키는 표현을 덧붙이므로, 둘 중 하나로 평탄화하지 않고 둘 다 보존하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #4'
