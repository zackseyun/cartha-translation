id: JOS.8.31
reference: Joshua 8:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
  footnotes:
  - marker: a
    text: Or 'an altar of uncut stones.' The Hebrew says 'whole stones,' emphasizing that the stones were left intact and not worked with iron.
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼의 종으로서 이스라엘 자손에게 명령한 대로, 곧 모세의 율법책에 기록된 대로, 곧 온전한 돌로 쌓은 제단이었으니 그 위에는 철을 대지 않았습니다. 그들은 그 위에 번제물을 야훼께 올려 드리고 화목제를 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다듬지 않은 돌로 된 제단’. 히브리어는 돌이 손질되지 않고 그대로 남아 있음을 강조하는 ‘온전한 돌’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화평제’ 또는 ‘친교제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 종된 자
  lexicon: HALOT
  rationale: 모세의 정체성을 나타내는 관용적 호칭으로, 한국어에서는 ‘종’이 가장 자연스럽고 위계적 함의를 과도하게 강화하지 않습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족적·남성복수 표현을 살리면서도 한국어 성경에서 널리 통용되는 형식을 유지합니다.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  english_pob_choice: an altar of whole stones
  chosen_korean: 온전한 돌로 쌓은 제단
  alternatives_korean:
  - 다듬지 않은 돌로 쌓은 제단
  - 온전한 돌의 제단
  lexicon: HALOT
  rationale: שְׁלֵמוֹת의 핵심은 손대지 않은 ‘온전함/완전함’이므로, ‘온전한 돌’로 옮겨 돌이 가공되지 않았음을 드러냅니다.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  english_pob_choice: on which no iron tool had been wielded
  chosen_korean: 그 위에는 철을 대지 않았습니다
  alternatives_korean:
  - 그 위에는 철 연장을 대지 않았습니다
  - 그 위에는 철을 휘두르지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 석재를 가공하는 철의 사용 금지를 뜻하므로, 한국어에서는 자연스럽게 ‘철을 대다’로 압축하되 의미는 유지합니다.
- source_word: שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화제
  - 화평제
  lexicon: HALOT
  rationale: 제사 용어로서는 한국어 성경에서 정착한 ‘화목제’가 가장 정확하고, POB의 ‘peace offerings’가 지닌 제의적 의미를 잘 전달합니다.
theological_decisions:
- issue: 여호와 / 야훼의 신명 표기
  chosen_reading: 본문에서 יהוה를 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어에 따라 신명은 언약 이름으로서 ‘야훼’를 유지하여 원문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제의 용어 שְׁלָמִים의 번역
  chosen_reading: ‘화목제’로 옮겼습니다.
  alternative_readings:
  - 평화제
  - 화평제
  - 친교제
  rationale: ‘peace offerings’의 전통적 대응어이면서도 제의 체계를 한국어 독자에게 분명히 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
