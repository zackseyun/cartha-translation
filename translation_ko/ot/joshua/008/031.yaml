revisions:
- from: 모세가 야훼의 종으로서 이스라엘 자손에게 명령한 대로, 곧 모세의 율법책에 기록된 대로, 곧 온전한 돌로 쌓은 제단이었으니 그 위에는 철을 대지 않았습니다. 그들은 그 위에 번제물을 야훼께 올려 드리고 화목제를 드렸습니다.[a][b]
  to: 모세, 곧 야훼의 종이 이스라엘 자손에게 명령한 대로, 또 모세의 율법책에 기록된 대로, 온전한 돌[a]로 만든 제단, 곧 그 돌들 위에 철 연장을 대지 않은 제단이었습니다. 그들은 그 위에 야훼께 번제를 드리고 화목제[b]를 드렸습니다.
  rationale: 원문의 제단 수식 구문을 한국어 독립 절 안에서 자연스럽게 보존하되, ‘쌓은’이라는 추가적 건축 묘사는 제거했습니다. 철 사용 금지가 돌들에 관한 것임을 밝혔고, 각주 표지를 해당 어휘에 정확히 붙였습니다. 신명과 제의 용어의 기존 선택은 유지했습니다.
