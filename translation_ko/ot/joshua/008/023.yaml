lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: But
  chosen_korean: 그들은
  alternatives_korean:
  - 그리고
  - 그러나
  lexicon: HALOT
  rationale: 히브리어 접속사는 앞 문맥의 전개 속에서 새로운 사건을 이어 주므로, 한국어에서는 굳이 역접을 세우지 않고 자연스러운 서술로 옮겼습니다.
- source_word: מֶ֥לֶךְ הָ/עַ֖י
  english_pob_choice: the king of Ai
  chosen_korean: 아이의 왕
  alternatives_korean:
  - 아이 왕
  - 아이의 임금
  lexicon: HALOT
  rationale: 소유·관계 구조를 살려 ‘아이의 왕’으로 옮기고, 고유지명 Ai는 ‘아이’로 음역했습니다.
- source_word: תָּפְשׂוּ חָ֑י
  english_pob_choice: captured ... alive
  chosen_korean: 살아 있는 채로 사로잡아
  alternatives_korean:
  - 생포하여
  - 살아 있는 채 붙잡아
  lexicon: HALOT
  rationale: תפׂשׂ와 חָי의 결합은 ‘죽이지 않고 생포함’을 강조하므로, 군사 서술에 맞는 ‘사로잡아’와 상태를 드러내는 ‘살아 있는 채로’를 함께 살렸습니다.
- source_word: וַ/יַּקְרִ֥בוּ אֹת֖/וֹ אֶל יְהוֹשֻֽׁעַ
  english_pob_choice: brought him near to Joshua
  chosen_korean: 여호수아에게 데려왔습니다
  alternatives_korean:
  - 여호수아 앞으로 데려왔습니다
  - 여호수아에게 가까이 데려왔습니다
  lexicon: HALOT
  rationale: קרב의 ‘가까이 데려오다’는 방향성을 유지하되, 한국어에서는 목적지 표지 ‘-에게’를 써서 자연스럽게 옮겼습니다.
