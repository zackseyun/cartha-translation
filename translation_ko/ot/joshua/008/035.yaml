id: JOS.8.35
reference: Joshua 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
  footnotes:
  - marker: a
    text: Or 'There was nothing of all that Moses commanded that Joshua did not read.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' refers to a resident foreigner living among Israel.'
    reason: cultural_note
  - marker: c
    text: Or 'who was among them' or 'who lived among them.'
    reason: lexical_alternative
  - marker: d
    text: Or 'who walked among them'.
    reason: previous_rendering
  - marker: e
    text: Or 'There was not a word of all that Moses commanded that Joshua did not read'.
    reason: previous_rendering
translation:
  language: ko
  text: 모세가 명령한 모든 말씀 가운데 여호수아가 이스라엘의 온 회중과 여자들과 어린아이들과 그들 가운데 거주하는 나그네[a] 앞에서 읽지 않은 말씀은 하나도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 이스라엘 가운데 거주하는 외국인 주민을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  english_pob_choice: There was not a word ... that Joshua did not read
  chosen_korean: 모세가 명령한 것 가운데서 여호수아가 읽지 않은 말은 하나도 없었으며
  alternatives_korean:
  - 모세가 명령한 것 가운데서 여호수아가 빠뜨린 말은 하나도 없었으며
  - 모세가 명령한 것 가운데서 여호수아가 읽지 않은 것은 하나도 없었으며
  lexicon: HALOT
  rationale: 히브리어의 이중 부정 구조는 전체를 빠짐없이 읽었다는 강조를 드러내므로, 한국어에서는 자연스러운 부정 강조인 '하나도 없었으며'로 살렸습니다.
- source_word: דָבָר
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 것
  - 일
  lexicon: HALOT
  rationale: 여기서는 모세가 명령한 내용을 공적으로 낭독한 맥락이므로 '말'이 가장 자연스럽고, 추상적인 '것'보다 낭독 행위를 더 잘 드러냅니다.
- source_word: קָרָא
  english_pob_choice: read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 선포했습니다
  - 읽어 주었습니다
  lexicon: HALOT
  rationale: 공개적인 율법 낭독의 맥락에서 '읽었습니다'가 가장 직접적이며, '낭독했습니다'보다 문장이 덜 무겁습니다.
- source_word: קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 온 이스라엘의 회중
  alternatives_korean:
  - 온 이스라엘의 모임
  - 온 이스라엘의 총회
  - 온 이스라엘의 공동체
  lexicon: HALOT
  rationale: '''회중''은 모인 공동체라는 뜻을 살리면서도 교회 제도 용어로 기울지 않게 해 줍니다.'
- source_word: הַגֵּר הַהֹלֵךְ בְּקִרְבָּם
  english_pob_choice: the sojourner who walked among them
  chosen_korean: 그들 가운데서 함께 사는 나그네들
  alternatives_korean:
  - 그들 가운데서 다니는 나그네들
  - 그들 가운데 거주하는 나그네들
  - 그들 가운데서 거니는 나그네들
  lexicon: HALOT
  rationale: הֹלֵךְ의 직역인 '걷는'보다, 문맥상 거류하며 공동체 안에 속한 상태를 드러내는 표현이 한국어 독자에게 더 분명합니다.
theological_decisions:
- issue: 공적 낭독의 포괄성
  chosen_reading: 여자들과 어린아이들과 나그네들까지 함께 포함된 것으로 분명하게 옮겼습니다.
  alternative_readings:
  - '''온 이스라엘의 회중'' 안에 암묵적으로 포함시키는 번역'
  rationale: 본문은 회중 뒤에 별도로 이 집단들을 열거하므로, 주변화하지 않고 가시적으로 포함시키는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 본문의 사회적 포괄성에 대한 직역 원칙
- issue: '''나그네''의 공동체 내 지위'
  chosen_reading: '''그들 가운데서 함께 사는 나그네들''로 옮겨, 단순한 외부인이 아니라 공동체 안에서 함께 살아가는 존재임을 드러냈습니다.'
  alternative_readings:
  - '''그들 가운데 있는 나그네'''
  - '''그들 가운데 거주하는 나그네'''
  rationale: 히브리어 participle의 지속적 상태를 살리면서도, 독자가 공동체 안의 거류자라는 사회적 의미를 이해하도록 했습니다.
  doctrine_reference: 레위기/신명기의 גֵּר 용례에 대한 일관 번역
