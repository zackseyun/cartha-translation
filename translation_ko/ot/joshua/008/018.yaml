base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
  footnotes:
  - marker: a
    text: Or “spear.” The Hebrew כִּידוֹן refers to a weapon that may be rendered “javelin,” “spear,” or “lance” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 여호수아에게 말씀하셨습니다. “네 손에 있는 창을 아이를 향해 내미십시오. 내가 그것을 네 손에 넘겨주겠습니다.” 그래서 여호수아는 자기 손에 있던 창을 그 성을 향해 내밀었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּידוֹן은 문맥에 따라 ‘투창’, ‘창’, 또는 ‘랜스’로 옮길 수 있는 무기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB의 YHWH 고유명사 원칙을 따라 한국어 본문에서도 야훼를 사용해 언약적 신명성을 드러냈습니다.
- source_word: נְטֵה / וַיֵּט
  english_pob_choice: Stretch out / stretched out
  chosen_korean: 내밀어라 / 내밀었습니다
  alternatives_korean:
  - 펴라 / 폈습니다
  - 뻗어라 / 뻗었습니다
  - 들어 올려라 / 들어 올렸습니다
  lexicon: HALOT
  rationale: 무기를 ‘stretch out’하는 물리적 동작을 자연스럽게 살리면서도, 단순히 가리키는 뉘앙스로 좁히지 않기 위해 ‘내밀다’를 택했습니다.
- source_word: כִּידוֹן
  english_pob_choice: javelin
  chosen_korean: 창
  alternatives_korean:
  - 투창
  - 창끝
  - 창자루
  lexicon: HALOT
  rationale: כִּידוֹן은 문맥상 투척·돌격용 무기이지만 한국어에서는 ‘창’이 가장 무난하고 본문 흐름을 해치지 않아, 과도한 세부 구분은 각주 없이 본문을 간결하게 유지했습니다.
- source_word: אֶל הָעַי / אֶל הָעִיר
  english_pob_choice: toward Ai / toward the city
  chosen_korean: 아이를 향해 / 그 성을 향해
  alternatives_korean:
  - 아이에 대하여
  - 아이 쪽으로
  - 그 도시를 향해
  lexicon: HALOT
  rationale: אֶל의 방향성을 살려 ‘~을 향해’로 옮겼고, מקום명 ‘아이’와 일반명사 ‘성’을 구분한 히브리어의 변화를 한국어에서도 유지했습니다.
theological_decisions:
- issue: 야훼의 명령과 약속의 결합 구조
  chosen_reading: 명령문과 약속문을 분리해, 직접 명령 ‘내밀어라’와 확언 ‘내가 그것을 네 손에 넘겨주겠다’를 모두 살렸습니다.
  alternative_readings:
  - 두 구절을 하나의 부드러운 설명문으로 합치는 방식
  - 미래 시제로만 평탄화하는 방식
  rationale: 본문은 행동 명령과 신적 약속을 병치하므로, 둘을 구분해 번역해야 본문의 긴장과 서술 동력이 유지됩니다.
  doctrine_reference: Joshua 8:18 source syntax and discourse structure
