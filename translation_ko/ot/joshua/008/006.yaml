    rationale: 초안의 ‘너희는 그들 뒤에 나가서’는 ‘그들이 우리를 따라 나올 것’(וְיָצְאוּ אַחֲרֵינוּ)을 반대로 옮깁니다.
  - severity: high
    issue: ‘우리가 그들을 성에서 끌어낼 때까지’의 불완전한 반영
    rationale: 원문의 עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר는 이 전술의 목표를 나타내며, 초안에서는 문법적으로 불명확하고 행위자도 혼동됩니다.
  - severity: medium
    issue: 문장 종결 및 인용 구조 미비
    rationale: 초안은 미완결 형태로 끝나며 직접화법의 범위가 불명확합니다.
  revised_text: 그들이 우리를 따라 나와서, 우리가 그들을 성에서 끌어낼 때까지 올 것입니다. 이는 그들이 ‘그들이 처음 때처럼 우리 앞에서 도망한다’ 하고 말할 것이기 때문입니다. 우리는 그들 앞에서 도망할 것입니다.
  revised_footnotes:
