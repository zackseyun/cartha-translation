  source_fidelity: 초안은 주어와 행위자 관계를 뒤바꾸어 ‘그들이 우리를 따라 나올 것’이라는 뜻을 ‘너희가 그들 뒤에 나갈 것’으로 옮겼습니다. 또한 ‘우리가 그들을 성에서 끌어낼 때까지’라는 목적·시간 절이 충분히 반영되지 않았습니다. 개정문은 히브리어의 미래적 계획 발화, 추격, 성에서 떼어 냄, 그리고 양측의 ‘도망’ 병행을 보존합니다.
  naturalness: 개정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽게 읽히도록 문장을 정리하고, 인용문과 후속 행동을 명확히 구분합니다.
  terminology: הַתִּיקֵנוּ는 문맥상 전술적으로 적을 성에서 떼어 내는 뜻이므로 ‘성에서 끌어낼’로 옮겼습니다. נוּס의 반복은 ‘도망할’로 일관되게 처리했습니다. ‘처음 때’는 앞선 아이 전투를 가리키는 표현으로 주석에서만 보충했습니다.
  issues:
