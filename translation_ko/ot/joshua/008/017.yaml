id: JOS.8.17
reference: Joshua 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא נִשְׁאַ֣ר אִ֗ישׁ בָּ/עַי֙ וּ/בֵ֣ית אֵ֔ל אֲשֶׁ֥ר לֹֽא יָצְא֖וּ אַחֲרֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעַזְב֤וּ אֶת הָ/עִיר֙ פְּתוּחָ֔ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'they left the city unguarded.' The Hebrew reads literally 'the city open.'
    reason: lexical_alternative
  - marker: b
    text: '''Not a man'' renders Hebrew אִישׁ, a masculine singular form used here generically for any person remaining behind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아이와 벧엘에는 이스라엘 뒤를 따르러 나가지 않은 사람이 한 사람도 남아 있지 않았고, 그들은 성을 열어 둔 채 이스라엘을 뒤쫓았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹֽא נִשְׁאַ֣ר אִ֗ישׁ
  english_pob_choice: not a man was left
  chosen_korean: 사람이 한 사람도 남아 있지 않았고
  alternatives_korean:
  - 한 사람도 남지 않았고
  - 남아 있는 사람이 한 사람도 없었고
  lexicon: HALOT
  rationale: אִישׁ의 남성 단수형이지만 여기서는 남성 일반을 가리키는 관용적 표현이므로, 한국어에서는 자연스럽게 ‘사람’으로 풀되 ‘한 사람도’로 원문의 전면 부정을 살렸습니다.
- source_word: בָּעַי וּבֵית אֵל
  english_pob_choice: in Ai or Bethel
  chosen_korean: 아이와 벧엘에는
  alternatives_korean:
  - 아이 또는 벧엘에는
  - 아이와 벧엘 가운데에는
  lexicon: HALOT
  rationale: 부정문과 결합된 장소명 나열은 한국어에서 보통 ‘A와 B에는’로 옮기면 양쪽 모두를 포괄하는 뜻이 자연스럽게 전달됩니다.
- source_word: וַיַּעַזְב֤וּ אֶת הָעִיר֙ פְּתוּחָ֔ה
  english_pob_choice: they left the city open
  chosen_korean: 성을 열어 둔 채
  alternatives_korean:
  - 성을 열린 채
  - 성을 무방비로 두고
  lexicon: HALOT
  rationale: פְּתוּחָה의 직역인 ‘열린/열어 둔’ 이미지를 유지하면서, 한국어에서는 행동 방식 부사구로 처리해 전술적 취약성을 암시하되 과도하게 해석하지 않도록 했습니다.
- source_word: וַיִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל
  english_pob_choice: and pursued Israel
  chosen_korean: 이스라엘을 뒤쫓았습니다
  alternatives_korean:
  - 이스라엘을 추격했습니다
  - 이스라엘 뒤를 추격했습니다
  lexicon: HALOT
  rationale: רדף는 군사 서술에서 ‘뒤쫓다/추격하다’가 자연스럽고, 여기서는 이미 ‘뒤를 따르러’가 앞절에 있어 반복 어감을 피하면서도 추격의 긴박함을 살렸습니다.
theological_decisions:
- issue: פְּתוּחָה의 해석 범위
  chosen_reading: ‘성을 열어 둔 채’로 옮겨, 성이 방치되어 있었다는 전술적 의미를 암시하되 본문이 말하는 ‘열림’의 구체 이미지를 유지했습니다.
  alternative_readings:
  - ‘성을 무방비로 두고’
  - ‘성을 열어 놓고’
  rationale: 히브리어는 직접적으로 ‘무방비’라고 말하지 않고 ‘열림’ 이미지를 사용하므로, 해석을 과도하게 앞서지 않는 번역이 적절합니다.
  doctrine_reference: '본문 주해 원칙: 가능한 한 원문 이미지 보존'
