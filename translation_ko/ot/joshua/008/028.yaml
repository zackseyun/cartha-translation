  naturalness: 합쇼체 서술로서 ‘영구한 무더기 곧 황폐함으로 만들어 오늘날까지 이르게 하였습니다’는 결합과 종결이 어색합니다. 결과 상태가 현재까지 계속됨을 별도 절로 표현하면 자연스럽습니다.
  terminology: ‘아이’는 통용되는 지명 표기이며 적절합니다. עוֹלָם은 ‘영구적인’으로, שְׁמָמָה는 ‘황폐한 곳’으로 옮겨 장기적 황폐 상태를 자연스럽게 보존합니다. 각주에서 ‘영원한’이라는 가능한 대안을 유지합니다.
