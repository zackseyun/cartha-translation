- from: 여호수아가 아이를 불태우고, 그것을 영구한 무더기 곧 황폐함으로 만들어 오늘날까지 이르게 하였습니다.[a]
  to: 여호수아는 아이를 불태워 그곳을 영구적인 폐허 더미, 곧 황폐한 곳으로 만들었고, 그것은 오늘날까지 그대로 남아 있습니다.[a]
  rationale: 수정문은 ‘불태우다—폐허 더미와 황폐한 곳으로 만들다—서술자의 현재까지 남아 있다’라는 원문의 순서와 지속 의미를 보존합니다. ‘영구적인’은 עוֹלָם을 문맥상 과도하게 형이상학화하지 않으며, 각주가 ‘영원한’의 가능한 번역을 밝혀 의미 범위를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:57:46Z'
