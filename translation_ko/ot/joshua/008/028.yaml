id: JOS.8.28
reference: Joshua 8:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑י וַ/יְשִׂימֶ֤/הָ תֵּל עוֹלָם֙ שְׁמָמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
  footnotes:
  - marker: a
    text: Or 'an everlasting mound'; Hebrew עוֹלָם can denote a very long or indefinite duration, often rendered 'forever' or 'everlasting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 아이를 불태우고, 그것을 영구한 무더기 곧 황폐함으로 만들어 오늘날까지 이르게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 무더기’. 히브리어 עוֹלָם은 매우 오래 지속되거나 불특정하게 지속되는 기간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  english_pob_choice: burned
  chosen_korean: 불태우고
  alternatives_korean:
  - 태우고
  - 불로 태우고
  lexicon: HALOT
  rationale: שׂרף는 불로 태우는 행위를 직접 가리키므로, 서술의 동작성을 살린 ‘불태우고’가 가장 자연스럽습니다.
- source_word: הָעָי
  english_pob_choice: Ai
  chosen_korean: 아이
  alternatives_korean:
  - 아이 성
  - 아이
  lexicon: 고유명사 표기
  rationale: 지명은 음역하는 것이 원칙이며, 한국어 성경에서 널리 쓰이는 ‘아이’를 따랐습니다.
- source_word: תֵּל עוֹלָם
  english_pob_choice: a permanent mound
  chosen_korean: 영구한 무더기
  alternatives_korean:
  - 영원한 무더기
  - 오래가는 무더기
  - 영구한 폐허더미
  lexicon: HALOT
  rationale: תֵּל은 무너진 성읍의 언덕/더미를 가리키므로 ‘무더기’로 옮기고, עוֹלָם은 이 문맥의 지속성을 살려 ‘영구한’으로 표현했습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐함
  alternatives_korean:
  - 황무지
  - 폐허
  - 황폐
  lexicon: HALOT
  rationale: שְׁמָמָה는 파괴 뒤의 황폐 상태를 뜻하므로, 앞의 ‘무더기’에 덧붙는 서술어로 ‘황폐함’을 택했습니다.
theological_decisions:
- issue: עַד הַיּוֹם הַזֶּה의 서술 시점 보존
  chosen_reading: ‘오늘날까지’로 옮겨, 본문의 현재적 증언성을 유지했습니다.
  alternative_readings:
  - ‘지금까지’
  - ‘이 날까지’
  rationale: 이 관용구는 기록 시점에서 계속되는 상태를 표시하므로, 한국어 관용에 맞는 ‘오늘날까지’가 가장 정확합니다.
  doctrine_reference: 본문의 역사 서술 관용구
