  text: וַ/יִּפְנ֣וּ אַנְשֵׁי֩ הָ/עַ֨י אַחֲרֵי/הֶ֜ם וַ/יִּרְא֗וּ וְ/הִנֵּ֨ה עָלָ֜ה עֲשַׁ֤ן הָ/עִיר֙ הַ/שָּׁמַ֔יְמָ/ה וְ/לֹא הָיָ֨ה בָ/הֶ֥ם יָדַ֛יִם לָ/נ֖וּס הֵ֣נָּה וָ/הֵ֑נָּה וְ/הָ/עָם֙ הַ/נָּ֣ס הַ/מִּדְבָּ֔ר נֶהְפַּ֖ךְ אֶל הָ/רוֹדֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
  footnotes:
  - marker: a
    text: Or 'rose to heaven.' The Hebrew expression is literally 'heavenward/skyward.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''there was no hands in them,'' meaning they had no power or ability to escape.'
    reason: cultural_note
  - marker: c
    text: The Hebrew has singular 'the pursuer,' likely used collectively for the pursuing force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아이 사람들은 뒤를 돌아보며 보았습니다. 보니 성읍의 연기가 하늘로 올라가고 있었고, 이리로도 저리로도 도망할 힘이 그들에게 없었습니다. 그리고 광야로 도망하던 백성은 추격하는 자를 향해 되돌아섰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘하늘/하늘을 향해’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구 ‘그들 안에 손이 없다’는 여기서 도망할 힘이나 능력이 없다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 단수형 ‘그 추격자’를 사용하지만, 추격하는 무리를 집합적으로 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  english_pob_choice: turned ... and looked
  chosen_korean: 뒤를 돌아보며 보았습니다
  alternatives_korean:
  - 돌아서서 보았습니다
  - 뒤돌아보고 보았습니다
  lexicon: HALOT
  rationale: פנה와 ראה의 연속 동작을 한국어에서도 구별되게 살리기 위해 ‘뒤를 돌아보며’와 ‘보았습니다’를 나누어 옮겼습니다.
- source_word: עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  english_pob_choice: the smoke of the city was going up to the sky
  chosen_korean: 성읍의 연기가 하늘로 올라가고 있었고
  alternatives_korean:
  - 성읍의 연기가 하늘을 향해 올라가고 있었고
  - 성읍의 연기가 하늘로 치솟고 있었고
  lexicon: HALOT
  rationale: הַשָּׁמַיְמָה의 직역 성격을 유지하면서도 ‘하늘로’로 자연스럽게 옮겨, 문맥상 단순한 수직 상승을 분명히 했습니다.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם לָנוּס הֵנָּה וָהֵנָּה
  english_pob_choice: there was no power in them to flee this way or that way
  chosen_korean: 이리로도 저리로도 도망할 힘이 그들에게 없었습니다
  alternatives_korean:
  - 이쪽으로도 저쪽으로도 달아날 힘이 그들에게 없었습니다
  - 이리저리 도망할 힘이 그들에게 없었습니다
  lexicon: HALOT
  rationale: ‘손이 없다’는 히브리어 관용구를 기능적으로 풀어, 단순한 무력감이 아니라 도주할 능력이 전혀 없음을 현대 한국어로 분명히 드러냈습니다.
- source_word: הָעָם הַנָּס הַמִּדְבָּר נֶהְפַּךְ אֶל הָרֹדֵף
  english_pob_choice: the people who had fled to the wilderness turned back against the pursuer
  chosen_korean: 광야로 도망하던 백성은 추격하는 자를 향해 되돌아섰습니다
  alternatives_korean:
  - 광야로 도망한 백성은 추격자에게로 돌아섰습니다
  - 광야로 달아나던 백성은 추격하는 자에게 맞서 되돌아섰습니다
  lexicon: HALOT
  rationale: נֶהְפַּךְ의 방향 전환과 אֶל의 향함을 살리되, 전투 문맥에 맞게 ‘추격하는 자를 향해 되돌아섰습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 서술의 긴박한 시각적 강조
  chosen_reading: ‘보니… 하늘로 올라가고 있었고’로 현재 진행의 현장성을 살렸습니다.
  alternative_readings:
  - ‘올라갔습니다’로 단순 과거화
  - ‘하늘에 닿았습니다’로 의역
  rationale: 히브리어 진행상과 ‘וְהִנֵּה’의 돌발적 주목 효과를 약화시키지 않기 위해, 장면이 눈앞에서 펼쳐지는 느낌을 유지했습니다.
  doctrine_reference: 서술체의 시간·상(aspect) 보존 원칙
- issue: ‘יָדַיִם’ 관용구의 해석
  chosen_reading: ‘힘이 그들에게 없었습니다’로 관용적 무능을 옮겼습니다.
  alternative_readings:
  - ‘그들 안에 손이 없었습니다’로 직역
  - ‘도망할 수 없었습니다’로 완전한 평서
  rationale: 직역은 한국어에서 의미가 불분명하고, 완전한 평서는 원문의 비유성을 지우므로, 능력 상실의 뜻을 드러내는 중간 해석을 택했습니다.
  doctrine_reference: 히브리어 관용구의 기능적 번역 원칙
