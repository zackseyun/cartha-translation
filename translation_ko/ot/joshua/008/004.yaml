  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֨ו אֹתָ֜/ם לֵ/אמֹ֗ר רְ֠אוּ אַתֶּ֞ם אֹרְבִ֤ים לָ/עִיר֙ מֵ/אַחֲרֵ֣י הָ/עִ֔יר אַל תַּרְחִ֥יקוּ מִן הָ/עִ֖יר מְאֹ֑ד וִ/הְיִיתֶ֥ם כֻּלְּ/כֶ֖ם נְכֹנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/004.yaml
  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: ko
  text: 그가 그들에게 명령하여 말했습니다. 「보십시오, 여러분은 성읍 뒤편에서 그 성읍을 향해 매복하고 있어야 합니다. 성읍에서 너무 멀리 떨어지지 말고, 너희 모두 준비되어 있어야 합니다.」
  philosophy: formal
lexical_decisions:
- source_word: וַיְצַו אֹתָם
  english_pob_choice: And he commanded them
  chosen_korean: 그가 그들에게 명령하여 말했습니다
  alternatives_korean:
  - 그가 그들에게 명령했습니다
  - 그가 그들에게 지시했습니다
  lexicon: צוה
  rationale: 명령의 강도를 분명히 살리되, 합쇼체 서술에 맞게 자연스럽게 풀어 옮겼습니다.
- source_word: רְאוּ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐라
  - 자, 보십시오
  lexicon: ראה
  rationale: אנ간 직접적인 주의 환기를 살리면서도 현대 한국어의 공손한 문맥에 맞는 호소형으로 옮겼습니다.
- source_word: אֹרְבִים לָעִיר מֵאַחֲרֵי הָעִיר
  english_pob_choice: you are to lie in ambush against the city, behind the city
  chosen_korean: 성읍 뒤편에서 그 성읍을 향해 매복하고 있어야 합니다
  alternatives_korean:
  - 성읍 뒤에 매복해야 합니다
  - 성읍 뒤에서 그 성읍을 노리고 매복해야 합니다
  lexicon: אורב
  rationale: 매복의 위치와 표적 방향을 함께 드러내기 위해 ‘뒤편에서 … 향해’ 구조를 택했습니다.
- source_word: נְכֹנִים
  english_pob_choice: must be ready
  chosen_korean: 준비되어 있어야 합니다
  alternatives_korean:
  - 대기하고 있어야 합니다
  - 갖추고 있어야 합니다
  lexicon: כון
  rationale: 전투 대기 상태를 자연스럽게 전달하는 기본 의미를 살렸습니다.
theological_decisions:
- issue: 직접 명령문의 화법과 청중 지칭
  chosen_reading: 말씀은 군사 작전 지시로서 공손한 서술체를 유지하되, 인용문 안의 직접 호칭은 ‘여러분’과 ‘너희’로 나누어 원문의 대상을 분명히 했습니다.
  alternative_readings:
  - 인용문 전체를 일률적으로 ‘너희’로 처리
  - 전부 ‘여러분’으로 평준화
  rationale: 히브리어 원문은 집단을 향한 직접 명령을 담고 있어 대상의 긴박함을 살리되, 한국어에서는 문맥상 구어적 호소가 자연스럽습니다.
  doctrine_reference: 담화 화법과 청중 지시의 일관성
