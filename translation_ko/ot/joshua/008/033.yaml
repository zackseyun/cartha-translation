  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
  footnotes:
  - marker: a
    text: Or, 'the resident foreigner as well as the native-born.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'at the first'; the phrase may mean 'as the first act' or refer back to Moses' earlier command concerning the blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘과 그 장로들과 관리들과 재판관들이, 야훼의 언약궤를 메고 있는 레위 제사장들 맞은편, 곧 이쪽과 저쪽에 서 있었습니다. 그들은 모두 나그네나 본토인이나 같았으며, 절반은 그리심 산 앞에, 절반은 에발 산 앞에 있었습니다. 이것은 야훼의 종 모세가 처음에 이스라엘 백성을 축복하라고 명령한 그대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민과 본토인 모두’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘처음에’는 ‘첫 행위로’ 또는 모세의 이전 명령을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: And all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 온 회중
  lexicon: HALOT
  rationale: 국가적·언약적 공동체 전체를 가리키므로, 자연스럽고 응집력 있는 ‘온 이스라엘’이 원문의 총괄 의미를 잘 살립니다.
- source_word: וּזְקֵנָיו / וְשֹׁטְרִים / וְשֹׁפְטָיו
  english_pob_choice: with its elders, officers, and judges
  chosen_korean: 그 장로들과 관리들과 재판관들
  alternatives_korean:
  - 그 장로들과 관원들과 판관들
  - 장로들, 감독자들, 재판관들
  lexicon: HALOT
  rationale: זָקֵן은 ‘장로’, שֹׁטֵר는 행정·치안적 ‘관리’, שֹׁפֵט는 ‘재판관’이 적절하여, 한국어에서 역할 구분이 드러나도록 옮겼습니다.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: carrying the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤를 메고 있는
  alternatives_korean:
  - 야훼의 언약궤를 운반하는
  - 야훼의 언약궤를 지고 있는
  lexicon: HALOT
  rationale: נֹשֵׂא의 기본 이미지는 ‘들어 메고 나르다’이므로, 의례적 행위를 살리면서도 현대 한국어에서 자연스러운 ‘메고 있는’으로 옮겼습니다.
- source_word: כַּגֵּר כָּאֶזְרָח
  english_pob_choice: both the sojourner and the native-born alike
  chosen_korean: 나그네나 본토인이나 같았으며
  alternatives_korean:
  - 거류민이나 본토인이나 같았으며
  - 나그네와 본토인 모두
  lexicon: HALOT
  rationale: 두 범주가 동등하게 포함됨을 나타내기 위해 대구 구조를 유지했고, גֵּר는 언약 공동체 맥락에서 ‘나그네’가 가장 덜 해석적입니다.
- source_word: בָּרִאשֹׁנָה
  english_pob_choice: at the first
  chosen_korean: 처음에
  alternatives_korean:
  - 맨 먼저
  - 첫째로
  - 처음으로
  lexicon: HALOT
  rationale: 이 표현은 서술상 시점 표시로 읽히므로, 과도한 해석을 피하면서도 한국어로 가장 무난한 ‘처음에’로 처리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문의 고유한 언약 이름을 보존하기 위해, 본문과 축약된 관용 번역을 구별하지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: גֵּר와 אֶזְרָח의 포함성
  chosen_reading: 나그네나 본토인이나 같았으며
  alternative_readings:
  - 거류민이나 시민이나 같았으며
  - 거주 외국인이나 본토인이나 같았으며
  rationale: 절차적·언약적 참여가 출신에 따라 달라지지 않음을 드러내기 위해, 동등성의 중복 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
