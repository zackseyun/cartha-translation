source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'a repetition of the law of Moses' or 'a duplicate of the law of Moses.' The Hebrew term can denote a copy or repeated version.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그는 돌들 위에 모세의 율법의 사본[a]을 기록했습니다. 이는 모세가 이스라엘 자손 앞에서[b] 기록한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 율법을 되풀이한 것’, ‘모세의 율법의 복제본’. 히브리어 מִשְׁנֵה는 사본, 반복, 복제의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 자손의 면전에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  english_pob_choice: he wrote
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 썼습니다
  - 새겼습니다
  lexicon: HALOT
  rationale: 돌 위에 쓰는 행위를 한국어로는 단순한 ‘썼습니다’보다 문서적·공적 행위를 드러내는 ‘기록했습니다’가 더 자연스럽고, ‘새겼습니다’보다 원문 동사 כתב의 일반적 의미를 과도하게 좁히지 않습니다.
- source_word: עַל הָאֲבָנִים
  english_pob_choice: on the stones
  chosen_korean: 돌들 위에
  alternatives_korean:
  - 돌 위에
  - 그 돌들 위에
  lexicon: HALOT
  rationale: 히브리어의 복수 정관형을 살려 ‘돌들 위에’로 옮겨, 실제 기록 매체가 돌 여러 개였음을 드러냈습니다.
- source_word: מִשְׁנֵה
  english_pob_choice: a copy of the law of Moses
  chosen_korean: 복사본
  alternatives_korean:
  - 사본
  - 되풀이한 것
  - 복제본
  lexicon: HALOT
  rationale: מִשְׁנֵה가 ‘복사본/사본/복제본/반복된 것’의 범위를 가질 수 있으므로, 공적 문맥에서 가장 중립적인 ‘복사본’을 택해 원문의 애매성을 보존했습니다.
- source_word: תּוֹרַת מֹשֶׁה
  english_pob_choice: the law of Moses
  chosen_korean: 모세의 율법
  alternatives_korean:
  - 모세의 법
  - 모세의 가르침
  lexicon: HALOT
  rationale: תּוֹרָה는 문맥상 율법적 권위를 가리키므로 표준적인 ‘율법’을 사용했고, ‘가르침’은 의미를 지나치게 완화할 수 있습니다.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: before the sons of Israel
  chosen_korean: 이스라엘 자손 앞에서
  alternatives_korean:
  - 이스라엘 아들들 앞에서
  - 이스라엘 사람들 앞에서
  - 이스라엘 사람들 앞에
  lexicon: HALOT
  rationale: לִפְנֵי는 공간적 ‘앞에서’와 공개적 노출을 함께 담을 수 있으므로, 한국어에서는 자연스러운 ‘앞에서’로 옮기되 ‘이스라엘 자손’ 표현을 유지했습니다.
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה의 범위
  chosen_reading: ‘모세의 율법의 복사본’으로 옮겨, 그것이 율법 전체인지 특정 본문인지 단정하지 않았습니다.
  alternative_readings:
  - ‘모세의 율법을 되풀이한 것’
  - ‘모세의 율법의 복제본’
  rationale: 본문 자체가 기록된 내용의 정확한 범위를 설명하지 않으므로, 해석을 좁히지 않고 원문의 긴장을 그대로 유지했습니다.
  doctrine_reference: Preserve ambiguity rather than harmonize the extent of the text.
