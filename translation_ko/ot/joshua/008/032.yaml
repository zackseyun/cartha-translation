  terminology: תּוֹרַת מֹשֶׁה는 관용적이고 적절하게 ‘모세의 율법’으로 유지했습니다. מִשְׁנֵה는 ‘사본’으로 번역하되, ‘되풀이한 것’과 ‘복제본’의 가능성은 각주에서 보존했습니다. בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 자손’으로 유지했습니다.
