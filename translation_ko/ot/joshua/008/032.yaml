  source_fidelity: 주절의 기록자는 여호수아를 가리키고 관계절의 기록자는 모세를 가리킵니다. 초안의 ‘그가’는 바로 앞의 ‘그는’과 같은 인물로 읽힐 수 있어 관계절의 주체를 명시할 필요가 있습니다. 또한 מִשְׁנֵה는 ‘사본’으로 자연스럽게 옮길 수 있으며, ‘복사본’은 현대의 사진 복사물을 연상시킬 수 있습니다.
