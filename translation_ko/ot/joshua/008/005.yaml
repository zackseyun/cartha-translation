id: JOS.8.5
reference: Joshua 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
  footnotes:
  - marker: a
    text: Or 'will draw near the city.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'as at the first.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나와 나와 함께 있는 모든 사람은 성읍으로 가까이 나아갈 것입니다[a]. 그들이 우리를 향해 나오면, 전에 그랬던 것처럼[b] 우리는 그들 앞에서 도망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍에 가까이 갈 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘처음에 했던 것처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם אֲשֶׁר אִתִּי
  english_pob_choice: and all the people who are with me
  chosen_korean: 나와 함께 있는 모든 사람
  alternatives_korean:
  - 나와 함께한 모든 사람
  - 내게 딸린 모든 사람
  lexicon: HALOT
  rationale: הָעָם은 동행 집단 전체를 가리키므로 ‘사람’으로 풀고, יחס절 אֲשֶׁר אִתִּי는 자연스럽게 ‘나와 함께 있는’으로 옮겼습니다.
- source_word: נִקְרַב אֶל הָעִיר
  english_pob_choice: will approach the city
  chosen_korean: 성읍으로 가까이 나아갈 것입니다
  alternatives_korean:
  - 성읍에 가까이 갈 것입니다
  - 성읍을 향해 접근할 것입니다
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 가다/나아가다’를 살리면서, 현대 한국어에서 자연스러운 군사적 이동 표현으로 조정했습니다.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  english_pob_choice: they come out to meet us
  chosen_korean: 그들이 우리를 향해 나오면
  alternatives_korean:
  - 그들이 우리를 맞으러 나오면
  - 그들이 우리를 대항해 나오면
  lexicon: HALOT
  rationale: לקראתנו는 기본적으로 ‘마주하러/맞으러’의 뜻이지만, 여기서는 전술적 정황상 ‘향해 나오면’이 가장 중립적이고 원문의 움직임을 잘 드러냅니다.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  english_pob_choice: as before
  chosen_korean: 전에 그랬던 것처럼
  alternatives_korean:
  - 처음처럼
  - 이전에 그랬던 것처럼
  - 첫 번째 때처럼
  lexicon: HALOT
  rationale: 직역하면 ‘처음에/첫째로’에 가깝지만, 문맥상 이전 전투 때의 방식으로 되돌아간다는 뜻이므로 한국어에서는 ‘전에 그랬던 것처럼’이 가장 분명합니다.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  english_pob_choice: we will flee before them
  chosen_korean: 우리는 그들 앞에서 도망할 것입니다
  alternatives_korean:
  - 우리는 그들 앞에서 달아날 것입니다
  - 우리는 그들 앞에서 도망칠 것입니다
  lexicon: HALOT
  rationale: נוס의 강한 도주 의미를 살리기 위해 ‘도망하다’를 택했고, לִפְנֵיהֶם은 관용적으로 ‘그들 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 전술적 후퇴를 어떻게 표현할지
  chosen_reading: ‘도망할 것입니다’로 옮겨, 의도된 가장됨을 직접적이고 절제되게 드러냈습니다.
  alternative_readings:
  - ‘후퇴할 것입니다’
  - ‘물러날 것입니다’
  rationale: 히브리어 נוס는 단순 전술적 재배치보다 더 강한 도주 뉘앙스를 가지므로, 본문이 묘사하는 유인 전술의 가장된 도주를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 문맥상 전쟁 서술의 어휘 선택
