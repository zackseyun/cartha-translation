id: JOS.8.8
reference: Joshua 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
  footnotes:
  - marker: a
    text: Or, 'According to the command of the LORD, do so.' The Hebrew phrase is literally 'according to the word of the LORD you shall do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분이 그 성을 점령하면 그 성에 불을 지르십시오. 야훼의 말씀에 따라 행하십시오. 보십시오, 내가 여러분에게 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 명령대로 그렇게 하십시오.’ 히브리어 표현은 문자적으로 ‘야훼의 말씀에 따라 여러분은 행할 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  english_pob_choice: And when you have taken
  chosen_korean: 그리고 여러분이 그 성을 점령하면
  alternatives_korean:
  - 그리고 여러분이 그 성을 취하면
  - 그리고 여러분이 그 성을 사로잡으면
  lexicon: HALOT
  rationale: 시간적 선행 관계를 나타내는 절로 보고, 군사적 문맥에 맞게 ‘점령하다’로 자연스럽게 옮겼습니다.
- source_word: תַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  english_pob_choice: you shall set the city on fire
  chosen_korean: 그 성에 불을 지르십시오
  alternatives_korean:
  - 그 성을 불태우십시오
  - 그 성을 불로 태우십시오
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 한국어에서 가장 직접적이고 자연한 표현인 ‘불을 지르다’를 선택했습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: According to the word of Yahweh
  chosen_korean: 야훼의 말씀에 따라
  alternatives_korean:
  - 야훼의 명령대로
  - 야훼께서 말씀하신 대로
  lexicon: HALOT
  rationale: דבר의 기본 의미인 ‘말씀/말’과 POB의 ‘word of Yahweh’를 반영해 ‘말씀에 따라’로 옮겼습니다.
- source_word: צִוִּיתִי אֶתְכֶם
  english_pob_choice: I have commanded you
  chosen_korean: 내가 여러분에게 명령했습니다
  alternatives_korean:
  - 내가 여러분을 명령했습니다
  - 내가 여러분에게 지시했습니다
  lexicon: HALOT
  rationale: 완료형의 회고적 뉘앙스를 살리면서도, 한국어에서 명령 동사의 직접 대상을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 대체어가 아닌 신명기적 고유명 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 명령 진술의 화법
  chosen_reading: 직설적 명령문(하십시오체)
  alternative_readings:
  - 해야 합니다
  - 하시기 바랍니다
  rationale: 문맥상 여호수아에게 주어진 직접 명령이며, 한국어 합쇼체의 명령형이 원문의 지시성을 가장 잘 드러냅니다.
  doctrine_reference: Korean target style guide
