  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
  footnotes:
  - marker: a
    text: Or 'before the plain.' The Hebrew term can denote the Arabah region or, more generally, a desert plain/steppe.
    reason: lexical_alternative
translation:
  language: ko
  text: 아이 왕이 그것을 보자 그들이 서둘러 일찍 일어났고, 그 성의 사람들이 이스라엘을 맞서 싸우려고 나갔습니다. 그는 자기 모든 백성과 함께 미리 정해 둔 곳, 곧 아라바 앞에 있었으나, 그 성 뒤에 매복이 있는 줄은 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아라바는 사막 평원이나 계곡 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 일이 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 서사 전환 표지로서 단순 사건 시작을 알리며, 현대 한국어에서 자연스럽고 격식 있는 표현을 택했습니다.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  english_pob_choice: to meet Israel for battle
  chosen_korean: 이스라엘을 맞서 싸우려고
  alternatives_korean:
  - 이스라엘을 맞아 싸우려고
  - 이스라엘을 맞닥뜨리려고 전쟁하러
  lexicon: HALOT
  rationale: לִקְרַאת의 ‘맞서/마주하여’ 뉘앙스와 לַמִּלְחָמָה의 전투 목적을 함께 살려, 단순한 ‘만나다’보다 적대적 접촉을 분명히 했습니다.
- source_word: לַמּוֹעֵד לִפְנֵי הָעֲרָבָה
  english_pob_choice: at the appointed place before the Arabah
  chosen_korean: 미리 정해 둔 곳, 곧 아라바 앞에
  alternatives_korean:
  - 정해진 장소, 곧 아라바 앞에
  - 약속된 곳, 아라바 앞에
  lexicon: HALOT
  rationale: מוֹעֵד는 여기서 시간보다 ‘정해진 장소’로 읽는 것이 문맥에 더 맞아 보이며, לִפְנֵי הָעֲרָבָה는 지명/지형명 ‘아라바’를 살렸습니다.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  english_pob_choice: an ambush was against him behind the city
  chosen_korean: 그 성 뒤에 매복이 있는 줄은 알지 못했습니다
  alternatives_korean:
  - 그 성 뒤에 매복한 자들이 있는 줄은 알지 못했습니다
  - 그 성 뒤에 복병이 있는 줄은 알지 못했습니다
  lexicon: HALOT
  rationale: אֹרֵב의 상태를 ‘매복’으로 옮겨 전술적 상황을 드러냈고, 문장 구조상 ‘있는 줄은’이 자연스러운 한국어입니다.
theological_decisions:
- issue: 전투 상황의 서술 방식
  chosen_reading: 직설적 전투 표현을 유지하여 적대적 접촉과 기습의 긴장감을 분명히 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘마주하러 나갔습니다’로 약화
  - ‘전쟁하러’만 두어 לקראת의 방향성을 흐림
  rationale: 본문은 단순 이동이 아니라 매복에 맞서는 전투 서술이므로, 의미를 완화하지 않는 것이 서사 의도를 더 충실히 전달합니다.
  doctrine_reference: 본문 서술 충실성 원칙
- issue: מוֹעֵד의 공간적 의미
  chosen_reading: ‘미리 정해 둔 곳’으로 번역해 예정된 전투 지점을 강조했습니다.
  alternative_readings:
  - ‘정한 때’로 시간 의미를 취함
  - ‘약속된 장소’로 더 자유롭게 옮김
  rationale: 문맥상 곧 이어지는 지형 표지가 있어 시간보다 장소 의미가 더 강하며, 전투의 배치된 성격을 보여 줍니다.
  doctrine_reference: 문맥 우선 원칙
