  lexicon: HALOT
  rationale: כדבר은 '말씀대로/에 따른'의 순응을 나타내므로, 문장 전체를 매끄럽게 하기 위해 '말씀에 따른 것입니다'로 표현했습니다. יְהוָה는 본 프로젝트 기본 원칙에 따라 '야훼'로 옮겼습니다.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
