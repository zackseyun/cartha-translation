  text: 오직 그 성읍의 가축과 전리품만 이스라엘이 자기들의 것으로 삼았습니다. 야훼께서 여호수아에게 명하신 말씀대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전리품’은 전쟁에서 빼앗은 물품을 가리키는 말입니다.
