base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
  footnotes:
  - marker: a
    text: Hebrew 'about five thousand men'; the prefixed כ on 'five' likely indicates approximation rather than an exact total.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the sea of the city,' with 'sea' used idiomatically for 'west.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 약 오천 명을 데려다가 벧엘과 아이 사이, 그 성읍의 서쪽에 매복시켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘약 오천 명’으로, 수사 앞의 כ가 대략성을 나타내는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘성읍의 바다에서’이지만, יָם(‘바다’)은 여기서 관용적으로 ‘서쪽’을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  english_pob_choice: about five thousand men
  chosen_korean: 약 오천 명
  alternatives_korean:
  - 약 오천 명의 남자
  - 대략 오천 명
  lexicon: HALOT
  rationale: 접두 כ의 근사 의미를 살려 정확한 수를 단정하지 않고, אִישׁ은 한국어에서는 군사 문맥상 자연스럽게 인원 수로 처리했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: he took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데리고 갔습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 전쟁 서술에서 단순한 ‘취하다’보다 사람들을 ‘데려가다’가 자연스럽고, 원문의 행동성을 유지합니다.
- source_word: וַיָּשֶׂם אֹתָם אֹרֵב
  english_pob_choice: and set them in ambush
  chosen_korean: 매복시켰습니다
  alternatives_korean:
  - 매복하게 했습니다
  - 복병으로 두었습니다
  lexicon: HALOT
  rationale: אֹרֵב의 기능을 ‘매복’으로 옮기고, שׂים의 ‘두다/두게 하다’ 의미를 군사 맥락에 맞게 한 단어로 압축했습니다.
- source_word: מִיָּם לָעִיר
  english_pob_choice: west of the city
  chosen_korean: 성읍의 서쪽에
  alternatives_korean:
  - 성읍의 서쪽으로
  - 성읍의 서편에
  lexicon: HALOT
  rationale: יָם이 지리 용례에서 ‘서쪽’을 뜻하므로 방향을 분명히 드러냈습니다.
