id: JOS.8.9
reference: Joshua 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֣/ם יְהוֹשֻׁ֗עַ וַ/יֵּֽלְכוּ֙ אֶל הַ/מַּאְרָ֔ב וַ/יֵּשְׁב֗וּ בֵּ֧ין בֵּֽית אֵ֛ל וּ/בֵ֥ין הָ/עַ֖י מִ/יָּ֣ם לָ/עָ֑י וַ/יָּ֧לֶן יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
  footnotes:
  - marker: a
    text: Or 'the ambush site' / 'the place of ambush.' The Hebrew can refer either to the ambushing force or to its position; here the context favors the position they occupied.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여호수아가 그들을 보냈습니다. 그들은 매복 장소로 가서 벧엘과 아이 사이, 곧 아이의 서쪽에 머물렀습니다. 그리고 여호수아는 그날 밤 백성 가운데서 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매복 부대’ / ‘매복한 곳’입니다. 히브리어는 매복하는 사람들 자체를 가리키거나 그들이 자리 잡은 위치를 가리킬 수 있는데, 여기서는 문맥상 위치가 더 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  english_pob_choice: sent them
  chosen_korean: 그들을 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: HALOT
  rationale: שלח의 서사적 완료형은 여기서 단순히 사람들을 보내는 뜻이므로, 자연스럽고 직접적인 ‘보냈습니다’를 택했습니다.
- source_word: הַמַּאְרָב
  english_pob_choice: the ambush
  chosen_korean: 매복 장소
  alternatives_korean:
  - 매복
  - 매복한 곳
  - 복병 진지
  lexicon: HALOT
  rationale: 문맥상 사람 자체보다 그들이 자리 잡은 위치가 강조되므로, 영어 POB의 각주 취지를 반영해 ‘매복 장소’로 옮겼습니다.
- source_word: מִיָּם לָעָי
  english_pob_choice: west of Ai
  chosen_korean: 아이의 서쪽
  alternatives_korean:
  - 아이 서쪽
  - 아이의 서편
  - 아이의 서쪽편
  lexicon: HALOT
  rationale: 히브리어의 방향 표현은 한국어에서 자연스럽게 ‘서쪽’으로 풀어 주는 것이 적절하며, 지명 관계를 분명히 하기 위해 ‘아이의 서쪽’으로 번역했습니다.
- source_word: וַיָּלֶן
  english_pob_choice: spent the night
  chosen_korean: 그날 밤 ... 지냈습니다
  alternatives_korean:
  - 그날 밤 묵었습니다
  - 그날 밤 머물렀습니다
  lexicon: HALOT
  rationale: לון은 ‘밤을 지내다/묵다’의 뜻이지만, 뒤의 ‘백성 가운데서’와 함께 읽을 때 ‘지냈습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 일반 서사 접속사 וַ/וְ의 처리
  chosen_reading: 세 문장을 한국어의 ‘그래서/그리고’로 이어 사건의 단순한 전개를 살렸습니다.
  alternative_readings:
  - 하지만
  - 그러자
  rationale: 히브리어의 단순한 연속을 과도한 대비나 인과로 바꾸지 않기 위해 중립적 연결을 유지했습니다.
  doctrine_reference: 서사 본문의 담백한 연결을 보존하는 번역 원칙
