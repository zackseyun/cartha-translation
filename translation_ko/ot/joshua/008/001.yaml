  to: 그때 야훼께서 여호수아에게 말씀하셨습니다. “두려워하지 말고 낙담하지 마십시오. 모든 전투 병력[a]을 데리고 일어나 아이로 올라가십시오. 보십시오, 내가 아이 왕과 그의 백성과 그의 성읍과 그의 땅을 네 손에 넘겨주었습니다.”
