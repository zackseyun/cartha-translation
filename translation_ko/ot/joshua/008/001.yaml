  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
  footnotes:
  - marker: a
    text: Or “all the people of war” / “all the warriors.” The Hebrew expression literally reads “all the people of the war,” referring to the combat force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 여호수아에게 말씀하셨습니다. "두려워하지 말고, 낙심하지 마십시오. 전투에 나서는 모든 백성을 데리고 올라가 아이를 치십시오. 보십시오, 내가 아이 왕과 그의 백성과 그의 성읍과 그의 땅을 네 손에 넘겨주었습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 “전쟁의 모든 백성”이지만, 여기서는 전투 병력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / POB doctrinal name rendering
  rationale: 원문 고유명사인 YHWH를 제목어로 바꾸지 않고 하나님의 이름으로 드러내기 위해 야훼를 사용했습니다.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  english_pob_choice: Do not fear and do not be dismayed
  chosen_korean: 두려워하지 말고, 낙심하지 마십시오
  alternatives_korean:
  - 두려워하지 말고, 당황하지 마십시오
  - 두려워하지 말고, 겁내지 마십시오
  lexicon: HALOT
  rationale: תִּירָא는 두려움 금지, תֵּחָת는 겁먹음보다 더 강한 의기소침/낙심의 뉘앙스가 있어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: כָּל עַם הַמִּלְחָמָה
  english_pob_choice: all the fighting men
  chosen_korean: 전투에 나서는 모든 백성
  alternatives_korean:
  - 모든 전쟁 백성
  - 모든 전사들
  - 모든 군사들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁의 백성’이지만 문맥상 전투 병력을 가리키므로, 남성적 전투 집단의 뜻을 살리면서도 한국어로는 ‘전투에 나서는’으로 풀었습니다.
- source_word: נָתַתִּי בְיָדְךָ
  english_pob_choice: I have given into your hand
  chosen_korean: 네 손에 넘겨주었습니다
  alternatives_korean:
  - 네 손에 주었습니다
  - 네 손에 넘겼습니다
  - 네 손에 넘겨놓았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘지배/승리의 보장’ 의미를 살리기 위해 ‘네 손에’와 ‘넘겨주다’를 유지했습니다.
theological_decisions:
- issue: 야훼의 직접 화법에서 명령문 어조
  chosen_reading: 하나님이 여호수아에게 주시는 격려와 명령을 합쇼체로 옮기되, 직접 인용 안에서는 단호한 금지와 명령을 유지했습니다.
  alternative_readings:
  - 더 부드러운 권유체
  - 서술체로 완화
  rationale: 원문은 두려움 금지와 군사 행동 명령이 결합된 신적 지시이므로, 한국어에서도 권면보다 명령의 힘이 드러나야 합니다.
  doctrine_reference: POB translation philosophy — source-direct imperative force
