source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
  footnotes:
  - marker: a
    text: Or 'until they were consumed' / 'until they came to an end' for the phrase 'until they were finished off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 그들을 추격하던 광야의 들에서 아이 성의 모든 주민을 죽이는 일을 마쳤을 때, 그들이 모두 칼날에 쓰러져 멸절된 뒤에, 온 이스라엘이 아이 성으로 돌아와 그 성을 칼날로 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 완전히 끝날 때까지’ 또는 ‘그들이 다 없어질 때까지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלּוֹת ... לַהֲרֹג
  english_pob_choice: when Israel had finished killing
  chosen_korean: 죽이기를 마쳤을 때
  alternatives_korean:
  - 죽이는 일을 끝냈을 때
  - 살해하기를 끝냈을 때
  lexicon: HALOT
  rationale: 완료 동작을 드러내는 부정사구를 한국어의 ‘-기를 마치다’로 자연스럽게 옮기되, 전쟁 서술의 강도를 약화하지 않았습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판
  alternatives_korean:
  - 밭
  - 광야
  lexicon: HALOT
  rationale: bassādeh의 기본 의미는 ‘field’이지만, 여기서는 도시 바깥 전투 지형을 가리키므로 ‘들판’이 문맥상 가장 자연스럽습니다.
- source_word: יֹשְׁבֵי הָעַי
  english_pob_choice: the inhabitants of Ai
  chosen_korean: 아이의 모든 주민
  alternatives_korean:
  - 아이의 거주자들
  - 아이에 사는 사람들
  lexicon: HALOT
  rationale: 거주를 뜻하는 동사 어근의 명사적 용법을 ‘주민’으로 옮겨 도시 안의 사람들을 가리키는 집합적 의미를 살렸습니다.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  english_pob_choice: by/with the edge of the sword
  chosen_korean: 칼날에 / 칼날로
  alternatives_korean:
  - 칼에
  - 칼끝으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 ‘칼날’로 대응시켜, 단순히 ‘칼로’보다 더 직접적이고 관용적인 살상 이미지를 유지했습니다.
theological_decisions:
- issue: 전쟁·학살 서술을 완화할지 여부
  chosen_reading: ‘죽이기’, ‘칼날에 쓰러져’, ‘완전히 끝나고’처럼 본문이 가진 가혹한 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘무찌르다’나 ‘패배시키다’처럼 완화된 표현으로 바꾸는 것
  - 총체적 파괴의 강도를 약화하는 것
  rationale: 이 절은 군사적 살육을 직접적으로 서술하므로, 본문이 말하는 실제 강도를 희석하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '원문 우선 번역 원칙: 본문이 말하는 역사·서술의 강도를 축소하지 않음'
