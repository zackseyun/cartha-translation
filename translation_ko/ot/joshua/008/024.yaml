revisions:
- from: 이스라엘이 들판[a], 곧 그들이 그들을 추격하던 광야에서 아이의 모든 주민을 죽이기를 마쳤을 때, 그들 모두가 칼날에 쓰러져 완전히 끝나고 나서야, 온 이스라엘이 아이로 돌아와 그것을 칼날로 쳤습니다.
  to: 이스라엘이 그들을 추격하던 광야의 들에서 아이 성의 모든 주민을 죽이는 일을 마쳤을 때, 그들이 모두 칼날에 쓰러져 멸절된 뒤에, 온 이스라엘이 아이 성으로 돌아와 그 성을 칼날로 쳤습니다.[a]
  rationale: 추격의 주체와 대상을 명료하게 하고, 원문에 없는 ‘나서야’의 강조를 제거했습니다. תֻּמָּם의 완료·전멸 의미는 ‘멸절된’으로 보존하고 각주에서 가능한 직역적 대안을 제시했습니다. 마지막 목적어가 아이 성임을 ‘그 성’으로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:41Z'
review_pass:
  verdict: revise
  source_fidelity: ‘나서야’는 원문에 없는 배타적·강조적 시간 뉘앙스를 더하며, ‘그들이 그들을’은 선행사가 불명확합니다. 또한 마지막 여성 단수 목적어는 아이 성을 가리키므로 한국어에서는 이를 명시하는 편이 정확합니다. וַיְהִי의 서사적 도입은 한국어에서 별도 어구 없이 시간절과 후속 동작의 연결로 자연스럽게 구현할 수 있습니다.
  naturalness: 현 번역은 ‘들판, 곧 … 광야’와 ‘그들이 그들을’의 연결이 다소 부자연스럽고, ‘완전히 끝나고’는 사람들의 죽음을 가리키는 표현으로 어색합니다. ‘광야의 들’ 및 ‘멸절된 뒤에’로 다듬으면 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: ‘죽이다’, ‘칼날’, ‘주민’은 원문의 강도와 전쟁 문맥을 적절히 보존합니다. 지명 ‘아이’는 일반 명사와의 혼동을 피하고 원문의 도시 지시를 드러내기 위해 ‘아이 성’으로 표기합니다. תֻּמָּם은 ‘멸절되다’로 옮기되, 어근이 지닌 완료·종결의 의미를 각주로 보완합니다.
  issues:
  - severity: medium
    issue: ‘그들이 그들을 추격하던’의 대명사 선행사가 불분명합니다.
    rationale: 히브리어에서 추격의 주체는 이스라엘이고 대상은 아이 주민들입니다. 한국어에서는 ‘이스라엘이 그들을 추격하던’으로 밝혀야 오독을 막습니다.
  - severity: medium
    issue: ‘나서야’가 원문에 없는 배타적 강조를 첨가합니다.
    rationale: 원문은 살육의 완료 및 귀환의 순서를 나타내며, ‘~하고 나서야’가 흔히 수반하는 지연·비로소의 강조는 요구하지 않습니다.
  - severity: medium
    issue: 마지막 ‘그것’을 도시 지시가 분명하도록 고칠 필요가 있습니다.
    rationale: 히브리어 여성 단수 목적어는 아이, 곧 도시를 가리킵니다. ‘그 성’을 사용하면 한국어에서 지시 대상이 명확해집니다.
  - severity: low
    issue: 기존 각주 ‘또는 들판’은 본문 용어와 동일하여 대안 정보를 제공하지 못합니다.
