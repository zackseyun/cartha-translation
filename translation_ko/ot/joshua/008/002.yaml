  edition: WLC
  text: וְ/עָשִׂ֨יתָ לָ/עַ֜י וּ/לְ/מַלְכָּ֗/הּ כַּ/אֲשֶׁ֨ר עָשִׂ֤יתָ לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ רַק שְׁלָלָ֥/הּ וּ/בְהֶמְתָּ֖/הּ תָּבֹ֣זּוּ לָ/כֶ֑ם שִׂים לְ/ךָ֥ אֹרֵ֛ב לָ/עִ֖יר מֵ/אַחֲרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
  footnotes:
  - marker: a
    text: Or 'you shall plunder for yourselves.' The Hebrew form can be read as a straightforward future or as an authorized instruction; the main text uses 'may plunder' to reflect the contrast with Jericho, where plunder was forbidden.
    reason: lexical_alternative
  - marker: b
    text: Or 'set men in ambush behind the city.' The Hebrew singular participle can denote the ambush as a unit or the ambushing force collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아이와 그 왕에게는, 여리고와 그 왕에게 행한 것처럼 행하십시오[a]. 다만 그들의 전리품과 가축은 여러분이 스스로 노략질할 수 있습니다[b]. 성 뒤에 매복을 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 스스로 노략질할 것입니다.’ 히브리어 형태는 단순 미래로도, 권한이 부여된 지시로도 읽을 수 있습니다. 본문은 여리고에서 금지되었던 점과의 대비를 살려 ‘~할 수 있습니다’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘성 뒤에 매복한 사람들을 두십시오.’ 히브리어 단수 분사형은 매복 작전 전체나 매복하는 무리를 함께 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall do
  chosen_korean: 행하십시오
  alternatives_korean:
  - 해야 합니다
  - 행하셔야 합니다
  lexicon: HALOT
  rationale: 지시문맥의 2인칭 남성 단수 완료형을 한국어 명령으로 자연스럽게 옮기되, 합쇼체를 유지했습니다.
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 여리고에 대한 비교를 제한하는 예외 표지이므로, 흐름을 살리면서도 제약을 분명히 하는 ‘다만’이 적절합니다.
- source_word: שְׁלָלָהּ וּבְהֶמְתָּהּ תָּבֹזּוּ לָכֶם
  english_pob_choice: its spoil and its livestock you may plunder for yourselves
  chosen_korean: 그들의 전리품과 가축은 여러분이 스스로 노략질할 수 있습니다
  alternatives_korean:
  - 그들의 전리품과 가축은 여러분이 스스로 탈취할 수 있습니다
  - 그들의 전리품과 가축은 여러분이 스스로 약탈할 수 있습니다
  lexicon: HALOT
  rationale: 전리품과 가축의 예외적 허용을 분명히 하며, תָּבֹזּוּ의 전쟁 맥락을 살려 ‘노략질하다’로 옮겼습니다.
- source_word: שִׂים לְךָ אֹרֵב
  english_pob_choice: Set an ambush for yourself
  chosen_korean: 성 뒤에 매복을 두십시오
  alternatives_korean:
  - 성 뒤에 매복을 세우십시오
  - 성 뒤에 매복을 마련하십시오
  lexicon: HALOT
  rationale: אֹרֵב를 결과물인 ‘매복’으로 살리고, 위치 표지 ‘뒤에’를 자연스러운 군사 지시로 옮겼습니다.
theological_decisions:
- issue: 여리고와 대비되는 전리품 허용의 표현
  chosen_reading: 여리고와 달리 아이에서는 전리품과 가축을 취할 수 있다는 허용으로 읽었습니다.
  alternative_readings:
  - 단순 미래 서술로 읽는 방법
  - 명령 자체를 더 강하게 느끼는 방법
  rationale: 문맥상 여리고의 금지와 대비되는 예외 허용이 핵심이므로, POB의 해석을 따라 ‘~할 수 있습니다’로 허용을 드러냈습니다.
  doctrine_reference: 전쟁 서술 본문의 문맥적 대비 해석
- issue: 매복의 단수 표현
  chosen_reading: ‘매복’을 단수 명사로 두어 작전 전체를 가리키게 했습니다.
  alternative_readings:
  - ‘매복 부대’처럼 집합체로 읽는 방법
  - ‘매복한 사람들’로 구체화하는 방법
  rationale: 히브리어 분사형이 매복 행위/작전 전체를 가리킬 수 있으므로, 과도한 구체화 없이 중립적으로 유지했습니다.
  doctrine_reference: 서술 문맥의 집합 명사 이해
