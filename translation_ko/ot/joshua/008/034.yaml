id: JOS.8.34
reference: Joshua 8:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֗ן קָרָא֙ אֶת כָּל דִּבְרֵ֣י הַ/תּוֹרָ֔ה הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה כְּ/כָל הַ/כָּת֖וּב בְּ/סֵ֥פֶר הַ/תּוֹרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
  footnotes:
  - marker: a
    text: Or 'he proclaimed' or 'he read aloud'; the Hebrew verb can denote public reading or proclamation in context.
    reason: lexical_alternative
  - marker: b
    text: '''Law'' translates Hebrew torah, which can also mean ''instruction.'' Here the covenant-document context favors ''law.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그는 율법의 모든 말씀, 곧 복과 저주를 율법책에 기록된 모든 것에 따라 읽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 קָרָא는 문맥에 따라 공적으로 읽다, 낭독하다, 선포하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 히브리어 torah를 옮긴 것으로, 여기서는 ‘가르침’보다 언약 문서의 규범적 의미가 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  english_pob_choice: And afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그리고 나서
  - 그 뒤에
  lexicon: HALOT
  rationale: 이어서 일어난 순서를 자연스러운 현대 한국어로 살리되, 서술 흐름을 간결하게 유지했습니다.
- source_word: קָרָא
  english_pob_choice: he read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 선포했습니다
  lexicon: HALOT
  rationale: 문맥상 공동 앞에서 소리 내어 읽는 의미가 강하지만, 한국어 본문에서는 기본 의미인 ‘읽다’를 택하고 공개적 낭독의 뉘앙스는 주석 여지로 남겼습니다.
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  english_pob_choice: all the words of the law
  chosen_korean: 율법의 모든 말씀
  alternatives_korean:
  - 율법의 모든 말
  - 율법의 모든 내용
  lexicon: HALOT
  rationale: ‘말씀’은 dvarim의 구체적 발화를 살리면서도 한국어 성경 문체에 자연스럽고, ‘율법’은 이 언약 문맥에서 torah의 적합한 대응입니다.
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  english_pob_choice: the blessing and the curse
  chosen_korean: 복과 저주
  alternatives_korean:
  - 복과 저주의 선언
  - 축복과 저주
  lexicon: HALOT
  rationale: 단수형 표현을 한국어에서 자연스럽게 공동개념으로 처리했고, ‘복’은 ‘축복’보다 본문의 대구를 더 간결하게 반영합니다.
- source_word: כְּ/כָל הַ/כָּת֖וּב
  english_pob_choice: according to all that is written
  chosen_korean: 기록된 모든 것에 따라
  alternatives_korean:
  - 기록된 바 모든 대로
  - 기록된 모든 대로
  lexicon: HALOT
  rationale: ‘according to all that is written’의 순응 관계를 살리되, 한국어에서는 ‘기록된 모든 것에 따라’가 가장 자연스럽고 본문 의존성을 분명히 드러냅니다.
- source_word: בְּ/סֵ֥פֶר הַ/תּוֹרָֽה
  english_pob_choice: in the Book of the Law
  chosen_korean: 율법책에
  alternatives_korean:
  - 율법의 책에
  - 율법서에
  lexicon: HALOT
  rationale: סֵפֶר를 한국어의 관용적 ‘책’으로 옮겨 문서성을 유지했고, 여기서는 고유명처럼 보이는 ‘율법책’이 문맥상 가장 간결합니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 이 절에서는 ‘율법’으로 옮겼습니다.
  alternative_readings:
  - ‘가르침’
  - ‘교훈’
  rationale: 언약 체결과 저주/복의 선포가 함께 묶인 맥락이어서, 단순한 일반 가르침보다 규범적 언약 문서로서의 의미가 강합니다.
  doctrine_reference: 신명기 27–28장 언약 갱신 문맥
- issue: קָרָא의 공개 낭독 뉘앙스
  chosen_reading: 본문에는 ‘읽었습니다’로 두고, 공개 선포 가능성은 본문 밖에서 검토할 수 있게 했습니다.
  alternative_readings:
  - ‘낭독했습니다’
  - ‘선포했습니다’
  rationale: 히브리어 동사는 문맥상 공적 낭독까지 포함할 수 있지만, 본문 자체가 명시하는 핵심은 ‘율법의 모든 말씀’을 읽는 행위이므로 과잉 해석을 피했습니다.
  doctrine_reference: 본문 의미와 서사 문맥 우선 원칙
