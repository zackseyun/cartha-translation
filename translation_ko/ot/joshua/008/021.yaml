id: JOS.8.21
reference: Joshua 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
  footnotes:
  - marker: a
    text: Or 'the men in ambush had captured the city.' The Hebrew participle can be rendered more explicitly to identify the ambushing force.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아와 온 이스라엘이 매복한 군대가 그 성을 점령했고 성의 연기가 올라가는 것을 보자, 그들은 돌아서서 아이 사람들을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매복한 사람들이 그 성을 점령했다.’ 히브리어 분사는 매복 세력을 더 분명히 가리키도록 풀어 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ
  english_pob_choice: When Joshua and all Israel saw
  chosen_korean: 여호수아와 온 이스라엘이 ... 보자
  alternatives_korean:
  - 여호수아와 온 이스라엘이 ... 보았고
  - 여호수아와 온 이스라엘이 ... 보았습니다
  lexicon: HALOT
  rationale: 히브리어 서술 연쇄에서 첫 동사 ראוּ는 사건을 목격한 순간을 가리키므로, 한국어에서는 자연스러운 시간 전환을 살려 '-보자'로 옮겼습니다.
- source_word: הָֽ/אֹרֵב
  english_pob_choice: the ambush
  chosen_korean: 매복한 군대
  alternatives_korean:
  - 매복 부대
  - 매복자들
  - 매복군
  lexicon: HALOT
  rationale: 단순 장소가 아니라 실제로 성을 점령한 매복 세력을 가리키므로, 의미를 분명히 하면서도 전투 문맥을 유지하는 표현으로 옮겼습니다.
- source_word: לָכַ֤ד ... אֶת הָ/עִ֔יר
  english_pob_choice: had captured the city
  chosen_korean: 그 성을 점령했고
  alternatives_korean:
  - 그 성을 사로잡았고
  - 그 성을 함락했고
  - 그 성을 잡았고
  lexicon: HALOT
  rationale: לכד는 성읍 정복 문맥에서 '점령하다/함락하다'가 자연스럽습니다. 여기서는 이미 완료된 결과를 나타내므로 과거완료적 연결을 살렸습니다.
- source_word: עֲשַׁ֣ן הָ/עִ֑יר
  english_pob_choice: the smoke of the city had gone up
  chosen_korean: 성의 연기가 올라가는
  alternatives_korean:
  - 성의 연기가 올라간
  - 그 성의 연기가 치솟는
  - 성에서 연기가 올라오는
  lexicon: HALOT
  rationale: ‘연기가 올라가다’는 히브리어 관용을 살린 직역적 표현으로, 장면의 시각적 신호를 유지하면서 한국어 문장 안에 자연스럽게 넣었습니다.
- source_word: וַ/יָּשֻׁ֕בוּ
  english_pob_choice: they turned back
  chosen_korean: 그들은 돌아서서
  alternatives_korean:
  - 그들은 되돌아서
  - 그들은 돌아가
  - 그들은 몸을 돌려
  lexicon: HALOT
  rationale: 전투 재개를 위한 방향 전환을 나타내므로, 단순한 ‘돌아가다’보다 행동성을 살린 ‘돌아서서’가 더 정확합니다.
- source_word: וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי
  english_pob_choice: struck down the men of Ai
  chosen_korean: 아이 사람들을 쳤습니다
  alternatives_korean:
  - 아이의 남자들을 쳤습니다
  - 아이 사람들을 쳐 죽였습니다
  - 아이의 사람들을 공격했습니다
  lexicon: HALOT
  rationale: נכה는 전투 맥락에서 ‘치다/쳐서 쓰러뜨리다’의 강한 동사를 쓰며, 본문이 직접 말하는 수준을 넘기지 않도록 ‘쳤습니다’로 유지했습니다.
theological_decisions:
- issue: 전투 서술에서 주어와 행위의 순차성
  chosen_reading: ‘보자’로 옮겨, 목격과 즉각적인 역공의 연결을 분명히 했습니다.
  alternative_readings:
  - ‘보았고’로 단순 병렬 처리
  - ‘보고서’ 같은 완료 연결
  rationale: 본문은 매복군의 성공이 보이는 순간 이스라엘이 방향을 바꾸는 장면을 묘사하므로, 서술의 긴박함을 드러내는 시간 전환이 중요합니다.
  doctrine_reference: 본문의 역사 서술 및 내러티브 문법
- issue: ‘the ambush’의 정체
  chosen_reading: ‘매복한 군대’로 옮겨, 단순한 계략이 아니라 실제 행동 주체임을 드러냈습니다.
  alternative_readings:
  - ‘매복’
  - ‘매복자들’
  rationale: 히브리어 분사는 매복 상태의 집단을 가리키므로, 독자가 그들을 사건의 행위자로 이해하도록 명시하는 것이 본문에 부합합니다.
  doctrine_reference: 본문의 전쟁 서술 문맥
