revisions:
- from: 여호수아와 온 이스라엘이 매복한 군대가 그 성을 점령했고 성의 연기가 올라가는 것을 보자, 그들은 돌아서서 아이 사람들을 쳤습니다.[a]
  to: 여호수아와 온 이스라엘은 매복대[a]가 그 성을 점령하고 그 성의 연기가 올라간 것을 보고, 돌아서서 아이 사람들을 쳤습니다.
  rationale: 연기가 ‘올라가는’ 과정이 아니라 이미 올라간 것이 목격되었다는 원문의 서술 순서를 반영했습니다. 또한 매복 세력을 가리키는 분사를 본문에서는 자연스러운 ‘매복대’로 옮기고, 더 명시적인 대안을 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:22Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 사건 순서와 전투 문맥을 충실히 반영합니다. 다만 עָלָה(‘올라갔다/올라온 것이 보였다’)는 완료된 시각적 신호로 제시되므로, ‘올라가는 것을’보다 ‘올라간 것을’이 더 정확합니다.
  naturalness: 합쇼체와 문장 흐름은 대체로 자연스럽습니다. ‘…점을령했고 … 올라가는 것을 보자’는 상이 혼재되어 다소 어색하므로, 두 관찰 내용을 ‘…점령하고 …올라간 것을 보고’로 병렬화하면 자연스럽습니다.
  terminology: ‘매복대’는 הָאֹרֵב가 가리키는 매복 중인 집단을 간결하고 자연스럽게 나타냅니다. ‘아이 사람들’은 אַנְשֵׁי הָעָי의 ‘아이의 사람들/남자들’을 문맥상 과도하게 한정하지 않고 옮깁니다.
  issues:
  - severity: low
    issue: ‘성의 연기가 올라가는 것을’의 진행상
    rationale: 히브리어 עָלָה는 여기서 매복대의 성 점령과 함께 이미 관찰된 연기 신호를 서술합니다. 진행형보다 완료된 ‘올라간 것을’이 원문의 상과 사건 순서에 더 잘 맞습니다.
  - severity: low
    issue: 각주 표지의 위치와 대안의 대비
    rationale: 각주는 הָאֹרֵב의 집단적 행위자 의미에 붙이는 것이 명확합니다. 본문은 간결한 ‘매복대’로, 각주는 더 명시적인 ‘매복한 사람들이’로 제시할 수 있습니다.
  revised_text: 여호수아와 온 이스라엘은 매복대[a]가 그 성을 점령하고 그 성의 연기가 올라간 것을 보고, 돌아서서 아이 사람들을 쳤습니다.
