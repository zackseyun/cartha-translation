  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
  footnotes:
  - marker: a
    text: Or 'hung'; the Hebrew verb means 'to hang/suspend.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when the sun went down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아이 왕을 나무[a]에 매달아 저녁때까지 두었습니다. 해가 질 때 여호수아가 명령하니, 그들은 그의 시체를 나무에서 내려 성문 입구에 던지고, 그 위에 큰 돌무더기를 쌓았습니다. 그것은 오늘까지 남아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֵץ는 기본적으로 ‘나무’를 뜻하며, 이 문맥에서는 나무로 된 구조물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ
  english_pob_choice: And he hanged the king of Ai on a tree
  chosen_korean: 그들은 아이 왕을 나무에 달아
  alternatives_korean:
  - 그들은 아이 왕을 매달아
  - 그들은 아이 왕을 나무에 매달아
  lexicon: HALOT
  rationale: תָּלָה는 ‘매달다/달다’의 뜻이므로, 형벌의 결과를 자연스럽게 드러내는 ‘달아’로 옮겼습니다. English POB의 ‘hanged’에 해당하는 실행 의미를 살리되, 현대 한국어에서는 ‘달다’가 더 자연스럽습니다.
- source_word: עַד עֵת הָעָרֶב
  english_pob_choice: until evening
  chosen_korean: 저녁 때까지
  alternatives_korean:
  - 해질 때까지
  - 저녁까지
  lexicon: HALOT
  rationale: 히브리어의 시간 구성을 반영하면서도 문장을 과도하게 딱딱하게 만들지 않도록 ‘저녁 때까지’로 옮겼습니다.
- source_word: וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ
  english_pob_choice: at sunset
  chosen_korean: 해가 질 무렵에
  alternatives_korean:
  - 해질 때
  - 일몰에
  lexicon: HALOT
  rationale: 관용구가 해짐을 가리키므로, 현대 한국어에서 자연스럽고 정확한 ‘해가 질 무렵에’로 처리했습니다.
- source_word: נִבְלָת/וֹ
  english_pob_choice: his corpse
  chosen_korean: 그의 시체
  alternatives_korean:
  - 그의 주검
  - 그의 몸
  lexicon: HALOT
  rationale: נִבְלָה는 죽은 몸을 가리키므로, 영어 POB의 ‘corpse’에 맞춰 ‘시체’로 옮겨 대상의 노골성을 유지했습니다. ‘주검’도 가능하지만 본문 흐름에서는 ‘시체’가 더 직접적입니다.
- source_word: פֶּתַח שַׁעַר הָעִיר
  english_pob_choice: the entrance of the city gate
  chosen_korean: 성문 입구
  alternatives_korean:
  - 성문 앞
  - 도성문 입구
  lexicon: HALOT
  rationale: פֶּתַח은 ‘입구’, שַׁעַר은 ‘문/성문’이므로 둘을 합쳐 ‘성문 입구’로 옮겨 원문 구조를 살렸습니다.
- source_word: גַּל אֲבָנִים גָּדוֹל
  english_pob_choice: a large heap of stones
  chosen_korean: 큰 돌무더기
  alternatives_korean:
  - 큰 돌더미
  - 큰 돌무지
  lexicon: HALOT
  rationale: גַּל אֲבָנִים은 돌의 무더기/무지를 뜻하므로, 가장 자연스러운 현대 한국어인 ‘돌무더기’로 옮겼습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: that remains to this day
  chosen_korean: 그것이 오늘까지 있습니다
  alternatives_korean:
  - 오늘까지 남아 있습니다
  - 이 날까지 있습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 종결 공식을 현재 지속 의미가 드러나도록 옮겼습니다. English POB의 보충적 ‘remains’를 한국어에서는 동사구로 풀어 자연스럽게 반영했습니다.
theological_decisions:
- issue: 첫 절의 행위 주어가 명시되지 않음
  chosen_reading: 문맥상 여호수아가 명령을 내리기 전의 집행 주체를 ‘그들은’으로 옮겨, 뒤의 ‘여호수아가 명령하자’와 구분했습니다.
  alternative_readings:
  - ‘그가 아이 왕을 나무에 달아’로 여호수아를 암시하는 번역
  - 주어를 생략한 번역
  rationale: 히브리어는 첫 동사에 명시 주어가 없고, 다음 절에서 여호수아가 명시되므로, 한국어에서는 집행 주체를 문맥상 일반 복수로 두어 서술 흐름을 보존했습니다.
  doctrine_reference: 서사 문맥과 히브리어 생략 주어 처리
