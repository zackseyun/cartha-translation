  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
  footnotes:
  - marker: a
    text: 'Hebrew: ''between him and Ai.'' The singular pronoun likely refers to Joshua, though some understand the sense collectively as ''between them and Ai.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 함께한 모든 전투원은 올라가서 가까이 다가갔고, 그들은 성읍 맞은편에 이르러 아이 북쪽에 진을 쳤으며, 그와 아이 사이에는 골짜기가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그와 아이 사이에’라고 단수 대명사를 사용합니다. 지시 대상은 여호수아일 가능성이 크지만, 집합적으로 이해해 ‘그들과 아이 사이에’로 볼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  english_pob_choice: all the fighting people
  chosen_korean: 모든 전투원
  alternatives_korean:
  - 모든 전쟁하는 사람들
  - 모든 군사들
  - 모든 전투하는 백성
  lexicon: HALOT
  rationale: עָם의 집합적 성격을 살리면서도 הַמִּלְחָמָה의 전투 집단 의미를 자연스럽게 드러내기 위해 ‘전투원’으로 옮겼습니다.
- source_word: עָלוּ וַיִּגְּשׁוּ
  english_pob_choice: went up and approached
  chosen_korean: 올라가서 가까이 다가갔고
  alternatives_korean:
  - 올라가서 접근했고
  - 올라가서 다가갔고
  - 올라가서 나아갔고
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’와 נגשׁ의 ‘다가가다’라는 연속 동작을 유지하되, 한국어에서 자연스러운 연결형으로 표현했습니다.
- source_word: נֶגֶד הָעִיר
  english_pob_choice: came before the city
  chosen_korean: 성읍 맞은편에 이르러
  alternatives_korean:
  - 성읍 앞에 이르러
  - 성읍 정면에 이르러
  - 성읍 앞쪽에 이르러
  lexicon: HALOT
  rationale: נֶגֶד가 단순한 ‘앞’보다 ‘마주한 위치’를 뜻하므로, 성읍을 정면으로 마주한 위치를 드러내는 ‘맞은편’이 적절합니다.
- source_word: וַיַּחֲנוּ מִצְּפוֹן לָעַי
  english_pob_choice: they camped north of Ai
  chosen_korean: 아이 북쪽에 진을 쳤으며
  alternatives_korean:
  - 아이 북쪽에 진을 쳤고
  - 아이의 북쪽에 진을 쳤으며
  - 아이 북쪽에 야영했으며
  lexicon: HALOT
  rationale: חנה는 군사적 배치를 포함한 ‘진을 치다’가 문맥에 가장 잘 맞고, מִצְּפוֹן을 자연스럽게 ‘북쪽에’로 옮겼습니다.
- source_word: בֵּינוֹ וּבֵין הָעָי
  english_pob_choice: between him and Ai
  chosen_korean: 그와 아이 사이에는
  alternatives_korean:
  - 그와 아이 사이에
  - 그들 사이에는
  lexicon: HALOT
  rationale: 히브리어의 3인칭 단수 대명사 ‘그’는 본문의 어려운 읽기를 보존하며, 평행한 공간 관계를 한국어에서도 명확히 했습니다.
theological_decisions:
- issue: 히브리어 단수 대명사 בֵּינוֹ의 지시 대상
  chosen_reading: 본문의 난해한 단수형을 그대로 반영해 ‘그와 아이 사이에는’으로 옮겼습니다.
  alternative_readings:
  - ‘그들과 아이 사이에는’로 집합적으로 완화
  - ‘여호수아와 아이 사이에는’로 지시 대상 명시
  rationale: 문자본의 어려운 읽기를 평탄화하지 않고 남겨 두어, 본문이 가진 지시상의 긴장을 보존했습니다.
  doctrine_reference: 본문비평/문법적 난점 보존 원칙
