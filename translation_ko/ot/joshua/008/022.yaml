  text: וְ/אֵ֨לֶּה יָצְא֤וּ מִן הָ/עִיר֙ לִ/קְרָאתָ֔/ם וַ/יִּֽהְי֤וּ לְ/יִשְׂרָאֵל֙ בַּ/תָּ֔וֶךְ אֵ֥לֶּה מִ/זֶּ֖ה וְ/אֵ֣לֶּה מִ/זֶּ֑ה וַ/יַּכּ֣וּ אוֹתָ֔/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֥יד וּ/פָלִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
  footnotes:
  - marker: a
    text: 'Hebrew: ''these from this side and those from that side,'' an idiom indicating that Israel hemmed them in from both sides.'
    reason: lexical_alternative
  - marker: b
    text: Or, more idiomatically, 'until he left him no survivor or fugitive,' meaning that none were left alive or able to escape.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이들이 성읍에서 나와 그들을 맞서니[a], 그들은 이스라엘 군대 한가운데에 있게 되었고, 이스라엘 군대는 이쪽과 저쪽에 있었습니다[b]. 이스라엘 사람들이 그들을 쳐서 쓰러뜨려, 생존자나 도망친 자를 아무도 남기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 맞서니’는 문자적으로는 ‘그들을 만나러 나와’입니다. 이 문맥에서는 전투를 위해 맞서는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘이들은 이쪽에서, 이들은 저쪽에서’입니다. 이스라엘 군대가 양쪽에서 그들을 에워싼 배치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה / these
  english_pob_choice: And these
  chosen_korean: 그리고 이들이
  alternatives_korean:
  - 그리고 그들이
  - 이들이
  lexicon: HALOT
  rationale: 지시어의 대상이 앞서 언급된 매복부대임을 살리되, 한국어에서는 부자연스러운 직역을 피하고 문맥상 분명한 주어로 옮겼습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them
  chosen_korean: 그들을 맞이하니
  alternatives_korean:
  - 그들을 만나러
  - 그들과 맞닥뜨리니
  lexicon: HALOT
  rationale: 기본 의미는 '맞닥뜨리다/맞이하다'이지만, 전투 맥락의 적대성은 뒤의 포위·타격 진술이 분명히 드러내므로, 본문 흐름에 맞는 간결한 표현을 택했습니다.
- source_word: בַּתָּוֶךְ
  english_pob_choice: in the midst of
  chosen_korean: 이스라엘 가운데
  alternatives_korean:
  - 이스라엘 한가운데
  - 이스라엘 가운데서
  lexicon: HALOT
  rationale: 포위된 위치를 나타내는 '가운데'를 사용해 원문의 공간적 중심성을 유지했습니다.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  english_pob_choice: these on one side and those on the other
  chosen_korean: 이쪽과 저쪽에
  alternatives_korean:
  - 이편과 저편에
  - 이쪽은 이편에, 저쪽은 저편에
  lexicon: HALOT
  rationale: 양쪽에서 에워싸는 관용구이므로, 한국어에서도 두 방향의 압박이 드러나는 표현으로 옮겼습니다.
- source_word: שָׂרִיד וּפָלִיט
  english_pob_choice: a survivor or a fugitive
  chosen_korean: 남은 생존자나 도망자
  alternatives_korean:
  - 생존자나 도망자
  - 살아남은 자나 도망친 자
  lexicon: HALOT
  rationale: 두 단어를 분리해 남아 있는 자와 도망칠 수 있는 자를 모두 포괄하는 강한 전멸 표현을 살렸습니다.
theological_decisions:
- issue: 전멸 진술의 강도와 한국어 완화 여부
  chosen_reading: 남은 생존자나 도망자를 한 사람도 남기지 않았습니다.
  alternative_readings:
