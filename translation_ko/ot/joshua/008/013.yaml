id: JOS.8.13
reference: Joshua 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the sea of the city'; here 'sea' functions as a directional term meaning 'west.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with its rear guard west of the city.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 백성은 성읍 북쪽에 있는 온 진영을 배치하고, 그 진영의 뒤쪽[b]을 성읍 서쪽[a]에 두었으며, 여호수아는 그날 밤 골짜기 한가운데로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘바다’는 여기서 지리적 방향어로 쓰여 ‘서쪽’을 뜻합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 진영의 뒤쪽 경비대를’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  english_pob_choice: positioned
  chosen_korean: 배치하고
  alternatives_korean:
  - 두고
  - 세우고
  - 진을 치고
  lexicon: HALOT
  rationale: 전술적·의도적 배치를 나타내는 문맥이므로, 단순한 ‘두다’보다 ‘배치하다’가 원문의 뉘앙스를 더 잘 드러냅니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군대
  - 군사들
  lexicon: HALOT
  rationale: 히브리어는 전투 집단이지만 표현 자체는 ‘백성’이므로, 소스의 넓은 지칭을 유지했습니다.
- source_word: כָּל הַמַּחֲנֶה
  english_pob_choice: the whole camp
  chosen_korean: 온 진영
  alternatives_korean:
  - 전체 진영
  - 모든 진영
  - 온 군영
  lexicon: HALOT
  rationale: כָּל + מַחֲנֶה의 전체성을 자연스럽게 살리기 위해 ‘온 진영’을 택했습니다.
- source_word: מִיָּם לָעִיר
  english_pob_choice: west of the city
  chosen_korean: 성읍의 서쪽
  alternatives_korean:
  - 성읍의 바다 쪽
  - 성읍의 서편
  - 성읍의 서쪽 편
  lexicon: HALOT
  rationale: 여기서 יָם은 지리적 방향어로서 ‘서쪽’의 뜻이므로, 본문에서는 의미를 풀어 옮겼습니다.
theological_decisions:
- issue: 서술 동사와 군사적 배치의 뉘앙스
  chosen_reading: ‘배치하다’로 전술적 배열을 드러내되, 과도한 군사적 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘두다’로 더 직역하는 방식
  - ‘진을 치다’로 군사적 표현을 강화하는 방식
  rationale: 본문은 전투 준비의 공간 배치를 말하지만, 특정 전술 명칭까지는 말하지 않으므로 원문의 사실 진술 범위 안에서 표현했습니다.
  doctrine_reference: 본문 서술의 문맥 충실성
- issue: ‘그날 밤’과 ‘골짜기 한가운데’의 이동 표현
  chosen_reading: 이동을 나타내는 ‘들어갔습니다’와 ‘한가운데로’를 함께 사용해 공간 이동을 분명히 했습니다.
  alternative_readings:
  - ‘가운데에 있었습니다’로 정적인 의미로 읽는 방식
  - ‘골짜기 안으로’로 더 일반화하는 방식
  rationale: 히브리어는 حرکت을 포함하므로 정적 표현보다 이동성을 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 본문의 동사상 보존
