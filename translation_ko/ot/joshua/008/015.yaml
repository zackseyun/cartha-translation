source:
  edition: WLC
  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
  footnotes:
  - marker: a
    text: Or 'were beaten before them'; in context this likely describes a tactical feigned defeat to draw the men of Ai away from the city.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the road to the wilderness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여호수아와 온 이스라엘은 그들 앞에서 패한 듯이 물러나 광야의 길로 달아났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 앞에서 패배했다’. 문맥상 이는 아이 성의 사람들을 성 밖으로 끌어내기 위한 전술적 패배처럼 보일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야로 가는 길을 따라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  english_pob_choice: let themselves be beaten
  chosen_korean: 패한 듯이 물러나
  alternatives_korean:
  - 그들에게 맞아 넘어졌고
  - 그들 앞에서 패배했습니다
  - 진짜로 패했습니다
  lexicon: HALOT
  rationale: 전쟁 서술의 맥락상 단순 수동(‘패배했다’)보다, 기습 유인전을 드러내는 ‘패한 듯이’가 본문의 전략적 뉘앙스를 더 잘 살립니다.
- source_word: לִפְנֵי/הֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי + 접미사는 전형적으로 ‘~앞에서’로 옮기며, 전투 장면의 위치 관계를 자연스럽게 드러냅니다.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  english_pob_choice: by the way of the wilderness
  chosen_korean: 광야의 길로
  alternatives_korean:
  - 광야로 가는 길로
  - 광야 길을 따라
  - 광야로 가는 도로로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 ‘길/노정’이므로, 한국어에서는 목적지보다 경로를 드러내는 ‘광야의 길로’가 가장 간결하고 원문에 가깝습니다.
- source_word: וַיָּנֻסוּ
  english_pob_choice: fled
  chosen_korean: 달아났습니다
  alternatives_korean:
  - 도망쳤습니다
  - 도주했습니다
  - 달아나 버렸습니다
  lexicon: HALOT
  rationale: נוּס는 ‘도망가다/달아나다’의 기본 동사이므로, 서술을 과장하지 않는 자연스러운 현대어 ‘달아났습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 서술에서의 의도적 패배처럼 보이는 표현의 처리
  chosen_reading: ‘패한 듯이 물러나’로 번역해, 본문이 드러내는 전술적 후퇴의 긴장을 살렸습니다.
  alternative_readings:
  - 단순 과거형 ‘패배했습니다’
  - 설명적 번역 ‘패배를 가장했습니다’
  rationale: 히브리어 동사 하나만으로 전술의 전모를 모두 말하지 않으면서도, 문맥상 유인 기동이라는 의미가 읽히도록 절제해 옮기는 것이 본문 충실성에 더 부합합니다.
  doctrine_reference: 서술 문맥 충실성
