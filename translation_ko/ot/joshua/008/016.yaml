source:
  edition: WLC
  text: וַ/יִּזָּעֲק֗וּ כָּל הָ/עָם֙ אֲשֶׁ֣ר ב/עיר לִ/רְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַֽ/יִּרְדְּפוּ֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/יִּנָּתְק֖וּ מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
  footnotes:
  - marker: a
    text: Or 'cried out'; the Hebrew verb can denote shouting, but here likely carries the sense of being summoned or mobilized for pursuit.
    reason: lexical_alternative
  - marker: b
    text: Or 'were cut off from the city' or 'were detached from the city.' The Hebrew suggests being drawn out so as to be separated from the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 성 안에 있던 모든 백성이 그들을 추격하려고 불려 나왔고, 그들은 여호수아를 뒤쫓았으며 성에서 멀어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불려 나왔고’는 여기서 단순한 외침보다 추격을 위해 동원되었다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성에서 멀어졌습니다’는 원문의 분리·이탈 뉘앙스를 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  english_pob_choice: were called out
  chosen_korean: 불려 나왔고
  alternatives_korean:
  - 소리쳐 나왔고
  - 불려 모였고
  - 호소에 응해 나왔고
  lexicon: HALOT
  rationale: 이 동사는 단순한 외침보다 ‘불려 나와 동원됨’의 뉘앙스를 담을 수 있으므로, 추격을 위해 성 밖으로 소집된 상황을 살려 ‘불려 나왔고’로 옮겼습니다.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  english_pob_choice: all the people who were in the city
  chosen_korean: 성 안에 있던 모든 백성
  alternatives_korean:
  - 성 안의 모든 사람
  - 성 안에 있던 모든 주민
  - 성 안의 모든 백성
  lexicon: HALOT
  rationale: ‘עם’의 포괄적 의미를 따라 과도하게 남성화하지 않고, 문맥상 도시 내부의 집단을 자연스럽게 드러내는 ‘성 안에 있던 모든 백성’으로 처리했습니다.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  english_pob_choice: they pursued Joshua
  chosen_korean: 그들은 여호수아를 뒤쫓았으며
  alternatives_korean:
  - 그들은 여호수아를 추격하였으며
  - 그들은 여호수아를 쫓았으며
  lexicon: HALOT
  rationale: 반복되는 추격 동사를 한국어에서도 자연스럽게 살리되, 서사 흐름에 맞게 ‘뒤쫓다’로 옮겨 추격의 지속성을 보존했습니다.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  english_pob_choice: were drawn away from the city
  chosen_korean: 성에서 멀어졌습니다
  alternatives_korean:
  - 성에서 끌려 나왔습니다
  - 성에서 떼어졌습니다
  - 성에서 떨어져 나왔습니다
  lexicon: HALOT
  rationale: 이 동사는 ‘떨어져 분리되다’의 의미를 가지며, 문맥상 성의 방어선에서 유도되어 멀어지는 전술적 결과를 가리키므로 ‘성에서 멀어졌습니다’로 간결하게 옮겼습니다.
