reference: Joshua 8:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
  footnotes:
  - marker: a
    text: Or, 'utterly destroyed all the inhabitants of Ai'; Hebrew uses a verb associated with putting something under the ban, that is, devoting it to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 모든 아이 주민을 멸하기까지, 손에 쥔 창을 든 손을 거두지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이의 모든 주민을 완전히 멸하셨다’; 히브리어는 어떤 대상을 ‘멸망에 바치다’, 곧 진멸에 넘기다’는 뜻과 연결된 동사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הֵשִׁיב יָד֔וֹ
  english_pob_choice: did not draw back his hand
  chosen_korean: 손에 쥔 창을 든 손을 거두지 않았습니다
  alternatives_korean:
  - 손을 거두지 않았습니다
  - 손을 되돌리지 않았습니다
  - 손을 물리지 않았습니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘되돌리다/거두다’ 의미를 한국어 동작표현으로 살려, 전투 장면에서 자세를 유지한 뉘앙스를 자연스럽게 전달했습니다.
- source_word: בַּכִּידוֹן
  english_pob_choice: with the javelin
  chosen_korean: 창을 든
  alternatives_korean:
  - 재블린을 든
  - 창을 잡은
  - 투창을 든
  lexicon: HALOT
  rationale: כידון은 창류 무기를 가리키므로, 현대 한국어 성경 문체에서 자연스러운 ‘창’으로 옮기고, 수단을 드러내기 위해 ‘든’을 보탰습니다.
- source_word: הֶחֱרִים
  english_pob_choice: had devoted all the inhabitants of Ai to destruction
  chosen_korean: 멸하기까지
  alternatives_korean:
  - 진멸하기까지
  - 바친 것처럼 멸하기까지
  - 저주 아래 두기까지
  lexicon: HALOT
  rationale: חרם의 언약적·심판적 의미를 한국어 성경 용례에 맞는 ‘멸하다’로 옮기되, 본문이 말하는 완료 시점을 살려 ‘...하기까지’로 처리했습니다.
- source_word: כָּל יֹשְׁבֵי הָעָי
  english_pob_choice: all the inhabitants of Ai
  chosen_korean: 모든 아이 주민
  alternatives_korean:
  - 아이의 모든 주민
  - 아이에 사는 모든 사람
  - 아이에 거주하는 모든 사람
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주자/주민’이 자연스럽고, 지명 ‘Ai’는 한국어 음역 관습에 따라 ‘아이’로 옮겼습니다.
theological_decisions:
- issue: חרם(herem) 전쟁 표현의 한국어 처리
  chosen_reading: 멸하다
  alternative_readings:
  - 진멸하다
  - 저주 아래 두다
  - 바치다
  rationale: 본문의 법적·신학적 무게를 유지하면서도 현대 한국어 독자가 즉시 이해할 수 있는 표현으로 ‘멸하다’를 택했습니다. 주석 없이도 본문의 심판 행위를 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
