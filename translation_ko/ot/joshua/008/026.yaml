  source_fidelity: ‘손에 쥔 창을 든 손’은 히브리어의 관계절(‘창과 함께 뻗었던 그의 손’)을 중복되고 부자연스럽게 처리합니다. 또한 הֶחֱרִים의 기술적 의미는 단순 ‘멸하다’보다 ‘진멸하다’와 주석으로 더 충실하게 드러낼 수 있습니다.
  naturalness: ‘창을 들고 뻗었던 손을 거두지 않았습니다’는 전투 장면의 자세 지속을 자연스러운 현대 표준 한국어 합쇼체로 표현합니다. ‘아이의 모든 주민’은 ‘모든 아이 주민’보다 자연스럽습니다.
  terminology: ‘진멸하다’는 חרם의 전쟁·봉헌 관련 의미를 한국어 성경 문맥에서 간결하게 보존합니다. 지명 ‘아이’와 인명 ‘여호수아’는 적절합니다. ‘창’은 כידון의 정확한 세부 무기 종류가 불확실한 상황에서 안전한 번역입니다.
