base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
  footnotes:
  - marker: a
    text: Or 'when he stretched out his hand.' The Hebrew construction marks the moment of Joshua's signal and may be rendered with either temporal nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 매복한 자들은 자신들이 있던 자리에서 재빨리 일어나, 그가 손을 내밀자마자 달려가 성읍으로 들어가 그것을 점령하고, 서둘러 그 성읍에 불을 질렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 손을 내밀자마자’는 히브리어의 시간적 관계를 살린 번역입니다. 직역하면 ‘그가 손을 내밀 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוֹרֵב
  english_pob_choice: the ambush
  chosen_korean: 매복한 자들
  alternatives_korean:
  - 매복 부대
  - 매복한 무리
  - 매복군
  lexicon: HALOT
  rationale: 히브리어 הפעול/분사 표현은 추상적 행위가 아니라 매복 중인 집단을 가리키므로, 한국어에서는 사람을 드러내는 ‘매복한 자들’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  english_pob_choice: rose quickly from its place
  chosen_korean: 자기 자리에서 빨리 일어나
  alternatives_korean:
  - 제자리에서 급히 일어나
  - 자기 위치에서 서둘러 일어나
  - 그 자리를 박차고 일어나
  lexicon: HALOT
  rationale: 집단을 하나의 단위로 본 영어 번역의 뉘앙스를 살리되, 한국어에서는 ‘일어나’가 은밀히 숨어 있던 이들이 행동을 개시하는 장면을 가장 직접적으로 전달합니다.
- source_word: כִּנְטוֹת יָדוֹ
  english_pob_choice: as soon as he stretched out his hand
  chosen_korean: 그가 손을 내미는 즉시
  alternatives_korean:
  - 그가 손을 내밀 때
  - 그가 손을 뻗자마자
  - 그가 손을 내미는 순간
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구는 지연 없이 반응한 순간을 가리키므로, ‘즉시’가 신호와 행동의 즉각성을 잘 드러냅니다.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  english_pob_choice: set the city on fire
  chosen_korean: 그 성읍에 불을 질렀습니다
  alternatives_korean:
  - 성읍을 불태웠습니다
  - 성읍에 불을 놓았습니다
  - 그 성읍을 불로 태웠습니다
  lexicon: HALOT
  rationale: 원문의 사역형은 ‘불을 붙이다/지르다’의 적극적 행위를 가리키므로, 전투 서술에 자연스러운 한국어로 ‘불을 질렀습니다’가 적합합니다.
