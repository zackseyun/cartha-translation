translation:
  language: ko
  text: 그때 여호수아는 야훼[a], 이스라엘의 하나님을 위해 에발 산에 제단을 쌓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 יְהוָה(야훼)를 사용합니다. 이 번역은 프로젝트의 표준 원칙에 따라 신성명을 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그리하여
  lexicon: HALOT
  rationale: 서사 전개에서 앞선 사건 다음의 시간적 전환을 자연스럽게 보여 주며, 현대 한국어에서 합쇼체 문체와도 잘 어울립니다.
- source_word: יִבְנֶה
  english_pob_choice: built
  chosen_korean: 제단을 쌓았습니다
  alternatives_korean:
  - 제단을 지었습니다
  - 제단을 만들었습니다
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 단순 건축물이 아니라 제의용 제단이므로, 한국어 성서 문맥에서 자연스럽고 직접적인 ‘제단을 쌓다’가 가장 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼[a]를 위해
  alternatives_korean:
  - 야훼께
  - 야훼를 향하여
  lexicon: HALOT
  rationale: POB의 स्रोत 기준은 여호와가 아니라 야훼이며, ל의 헌정·귀속 의미를 한국어에서는 ‘-를 위해’로 옮기면 제단의 목적을 분명히 드러냅니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 분
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 직역보다도 원문의 속격 관계를 분명히 살리면서, 하나님이 이스라엘에 속한 분임을 공손하고 간결하게 전달합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼[a]
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 히브리어 본문에 직접 יְהוָה가 있으므로, POB의 원칙에 따라 표준 음역인 ‘야훼’를 유지하고 전통적 대체 표기 ‘여호와’는 쓰지 않습니다.
  doctrine_reference: 'POB terminology: יהוה / YHWH → 야훼'
