source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
  footnotes:
  - marker: a
    text: Or 'copy,' 'model,' or 'representation' of the altar of the LORD.' The Hebrew term refers to a form or pattern, indicating this altar was a replica serving as testimony rather than the authorized sacrificial altar itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 우리가 말했습니다. 「만일 그들이 우리에게나 앞으로 우리 세대에 ‘내일’이라고 말하면, 우리는 이렇게 말할 것입니다. ‘야훼의 제단의 모형을 보십시오. 우리 조상들이 만든 것으로서, 번제물을 위한 것도 아니고 제물을 위한 것도 아닙니다. 그것은 우리와 여러분 사이의 증거입니다.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: תַּבְנִית는 이 문맥에서 제단의 허가된 제사용 실물 제단이 아니라, 증거를 위한 형상·모형·복제품을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  english_pob_choice: So we said
  chosen_korean: 그래서 우리가 말했습니다
  alternatives_korean:
  - 그리고 우리가 말했습니다
  - 그러므로 우리가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행의 흐름과 원인-결과 뉘앙스를 자연스럽게 살리되, 문맥상 설명적 결론을 드러내는 표현으로 옮겼습니다.
- source_word: תַּבְנִית
  english_pob_choice: pattern
  chosen_korean: 모형
  alternatives_korean:
  - 형태
  - 복제품
  - 견본
  lexicon: HALOT
  rationale: 이 제단이 제사용 정규 제단이 아니라 증거용으로 세워진 대표적 형상임을 드러내기 위해, 단순한 '형태'보다 구체적인 '모형'을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 하나님의 고유명은 칭호가 아니라 음역형 '야훼'로 옮겼습니다.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  english_pob_choice: not for burnt offering and not for sacrifice
  chosen_korean: 번제물을 위한 것도 아니고 제물을 위한 것도 아닙니다
  alternatives_korean:
  - 번제물을 위한 것도 아니고 희생제물을 위한 것도 아닙니다
  - 번제물이나 제물을 위한 것도 아닙니다
  lexicon: HALOT
  rationale: 반복 부정 לֹא ... וְלֹא의 강조를 살리면서, עֹלָה는 '번제물', זֶבַח은 보다 넓은 '제물'로 옮겼습니다.
- source_word: כִּי עֵד הוּא
  english_pob_choice: but it is a witness
  chosen_korean: 그것은 우리와 여러분 사이의 증거입니다
  alternatives_korean:
  - 그것은 우리와 여러분 사이의 증인입니다
  - 그것은 우리와 여러분 사이의 증거가 됩니다
  lexicon: HALOT
  rationale: 여기서 כִּי는 앞의 부정과 대비되는 목적·설명 관계를 이루므로, 문맥에 맞게 '증거'로 기능을 풀어 옮겼습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문에 직접 나타나는 여호와 이름을 별도의 칭호로 대체하지 않고, 본 프로젝트 기준에 따라 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ביתר성/대상 지시를 위한 어조 in quoted speech
  chosen_reading: 내일 / 우리 세대
  alternative_readings:
  - 장차
  - 미래의 세대
  rationale: מָחָר는 문자적 '내일'보다 미래 지시 관용구로 쓰였으나, 한국어에서는 인용문 내부에서 그대로 두되 '우리 세대'와 함께 미래성을 드러내도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
