  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Hebrew is literally 'sons of Israel,' and that wording is preserved here for source transparency.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to go up against them for war,' a standard idiom for military action.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손이 이 소식을 듣자, 이스라엘 자손의 온 회중은 그들을 치러 올라가기 위해 실로에 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 자손’입니다. 한국어에서는 관용적으로 ‘이스라엘 사람들’도 가능하지만, 여기서는 원문 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 치러 올라가다’는 전쟁을 위해 적을 향해 진군한다는 뜻의 히브리어 군사 관용입니다.
    reason: cultural_note
