theological_decisions:
- issue: 군사 관용구의 보존
  chosen_reading: ‘전쟁을 하러 올라갔습니다’로 옮겨, העלה/עלה의 상향 이동 이미지와 युद्ध적 의도를 함께 드러냈습니다.
  alternative_readings:
