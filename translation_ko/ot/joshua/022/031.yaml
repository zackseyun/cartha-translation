source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
  footnotes:
  - marker: a
    text: Or “in our midst.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “you have not acted unfaithfully against the LORD with this unfaithfulness”; the wording refers to covenantal treachery or breach of faith.
    reason: lexical_alternative
  - marker: c
    text: “From the hand of the LORD” is a Hebrew idiom for being spared from the LORD’s power or judgment.
    reason: cultural_note
translation:
  language: ko
  text: 제사장 엘르아살의 아들 비느하스가 르우벤 자손과 갓 자손과 므낫세 자손에게 말했습니다. “오늘 우리는 야훼께서 우리 가운데 계신 줄 압니다.[a] 여러분이 이 배신으로 야훼께 신의를 저버리지 않았기 때문입니다.[b] 그러므로 여러분은 이스라엘 자손을 야훼의 손에서 건져 내셨습니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 가운데에.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “여러분이 이 배신으로 야훼께 배신을 행하지 않았습니다”라는 뜻입니다. 이 표현은 언약을 저버리는 배신 또는 신의의 파기를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: “야훼의 손에서”는 야훼의 능력이나 심판에서 건짐을 뜻하는 히브리 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  lexicon: HALOT
  rationale: 서사적 연결을 자연스럽게 살리면서도 직역투를 과도하게 드러내지 않도록 했습니다.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  english_pob_choice: Phinehas son of Eleazar the priest
  chosen_korean: 비느하스—엘르아살의 아들, 제사장—
  alternatives_korean:
  - 비느하스, 엘르아살의 아들 제사장
  - 제사장 엘르아살의 아들 비느하스
  lexicon: HALOT
  rationale: 히브리어의 인물 식별 구조를 유지하되, 한국어에서는 삽입 괄호형 대시로 읽기 쉽게 처리했습니다.
- source_word: בְּתוֹכֵנוּ
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
  - 우리 안에
  - 우리 중에
  lexicon: HALOT
  rationale: 하나님의 임재를 가리키는 관용적 표현으로서 공동체적 현존을 분명히 드러냅니다.
- source_word: מְעַלְתֶּם ... הַמַּעַל הַזֶּה
  english_pob_choice: you have not acted unfaithfully ... in this matter
  chosen_korean: 야훼께 불성실하게 행하지 않았기 때문입니다
  alternatives_korean:
  - 야훼께 이 불신실함으로 배신하지 않았기 때문입니다
  - 야훼께 이 일로 신의를 저버리지 않았기 때문입니다
  lexicon: HALOT
  rationale: מעל의 핵심을 언약적 불성실로 이해하여, 전통적 교회어휘의 ‘범죄/허물’보다 관계적 충실성의 파괴를 살렸습니다.
- source_word: מִיַּד יְהוָה
  english_pob_choice: from the hand of Yahweh
  chosen_korean: 야훼의 손에서
  alternatives_korean:
  - 야훼의 능력에서
  - 야훼의 심판에서
  lexicon: HALOT
  rationale: 히브리 관용구를 가능한 한 그대로 살려, 구출과 심판의 긴장을 독자가 본문에서 읽어내도록 했습니다.
theological_decisions:
- issue: 야훼의 임재 진술
  chosen_reading: “오늘 우리는 야훼께서 우리 가운데 계신 줄 압니다”
  alternative_readings:
  - “오늘 우리는 야훼께서 우리 중에 계신 줄 압니다”
  - “오늘 우리는 야훼께서 우리 안에 계신 줄 압니다”
  rationale: 본문은 언약적 임재의 확인을 말하므로, 공동체 안에 함께 계신다는 뜻을 한국어로 가장 직접적으로 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘야훼의 손’ 관용구
  chosen_reading: 문자적으로 유지
  alternative_readings:
  - 야훼의 능력에서
  - 야훼의 심판에서
  rationale: 이스라엘이 의심받던 불성실 때문에 하나님의 सक्रिय한 판단 아래 있었음을 암시하므로, 관용구를 풀어 쓰지 않고 본문 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
