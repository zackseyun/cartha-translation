- from: 그때 비느하스—엘르아살의 아들, 제사장—가 르우벤 자손과 갓 자손과 므낫세 자손에게 말했습니다. “오늘 우리는 야훼께서 우리 가운데 계신 줄 압니다. 여러분이 이 일로 야훼께 불성실하게 행하지 않았기 때문입니다. 그러므로 여러분은 이스라엘 자손을 야훼의 손에서 건져 내셨습니다.”[a][b][c]
  to: 제사장 엘르아살의 아들 비느하스가 르우벤 자손과 갓 자손과 므낫세 자손에게 말했습니다. “오늘 우리는 야훼께서 우리 가운데 계신 줄 압니다.[a] 여러분이 이 배신으로 야훼께 신의를 저버리지 않았기 때문입니다.[b] 그러므로 여러분은 이스라엘 자손을 야훼의 손에서 건져 내셨습니다.[c]”
  rationale: 수정은 원문의 מעלה 동족어 반복 및 ‘이’라는 지시성을 보존하고, 인물 소개를 자연스러운 표준 한국어로 다듬으며, 각주 표지를 해당 어구에 연결합니다. ‘야훼의 손’은 본문대로 유지하여 능력과 심판이라는 함의를 각주에서만 설명했습니다.
