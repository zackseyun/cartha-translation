  terminology: ‘야훼’, ‘회중’, ‘이스라엘의 하나님’, ‘제단’, ‘반역’은 적절합니다. מַעַל은 문맥상 언약적·제의적 불충성을 가리키므로 ‘배신’은 가능한 번역입니다. 다만 그 의미 범위를 독자가 알 수 있도록 각주를 유지합니다.
