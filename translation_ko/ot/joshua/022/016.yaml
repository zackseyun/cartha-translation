language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
  footnotes:
  - marker: a
    text: Or “treachery” or “unfaithfulness” for “breach of faith.” The Hebrew term denotes covenantal or cultic disloyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 『야훼의 온 회중이 이렇게 말합니다. “너희가 이스라엘의 하나님께 저지른 이 배신은 무엇입니까? 오늘 야훼를 따르는 데서 돌아서고, 너희 자신을 위하여 제단을 세워 오늘 야훼께 반역하려는 것입니까?”』[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘배신’은 여기의 히브리어 מַעַל이 지닌 언약적·제의적 불충실의 뉘앙스를 반영한 번역입니다. ‘불성실’ 또는 ‘배반’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 말합니다
  - 이렇게 말하였습니다
  lexicon: HALOT
  rationale: 예언/선포 공식의 현재형 효과를 살리면서, 한국어에서는 ‘이렇게 말합니다’가 가장 자연스럽습니다.
- source_word: כֹּל עֲדַת יְהוָה
  english_pob_choice: the whole congregation of Yahweh
  chosen_korean: 야훼의 온 회중
  alternatives_korean:
  - 야훼의 전체 회중
  - 야훼의 온 공동체
  lexicon: HALOT
  rationale: עֲדָה는 언약 공동체로 모인 집합체이므로 ‘회중’이 적절하며, ‘온’으로 전체성을 살렸습니다.
- source_word: מָה הַמַּעַל הַזֶּה
  english_pob_choice: What is this breach of faith
  chosen_korean: 이 배신이 무엇입니까
  alternatives_korean:
  - 이 신의 위반이 무엇입니까
  - 이 불충이 무엇입니까
  lexicon: HALOT
  rationale: מַעַל의 언약적·배신적 뉘앙스를 살리되, 한국어에서 자연스럽고 강한 고발 표현인 ‘배신’을 택했습니다.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  english_pob_choice: turning away today from following Yahweh
  chosen_korean: 오늘 야훼를 따르는 데서 돌아서려고
  alternatives_korean:
  - 오늘 야훼를 따르던 데서 돌아서려고
  - 오늘 야훼를 따르는 것을 그만두려고
  lexicon: HALOT
  rationale: אַחֲרֵי를 한국어의 ‘따르다’로 자연스럽게 옮겨 언약적 충성을 유지했고, 목적·결과를 나타내는 흐름을 살렸습니다.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  english_pob_choice: by building for yourselves an altar
  chosen_korean: 너희가 너희를 위해 제단을 세웠으니
  alternatives_korean:
  - 너희가 너희 자신을 위해 제단을 지었으니
  - 너희가 스스로를 위해 제단을 만들어
  lexicon: HALOT
  rationale: ‘building an altar’는 제단을 세우는 행위를 가리키므로 ‘제단을 세웠으니’가 한국어에서 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 언약명 יְהוָה를 제목이 아닌 이름으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: מַעַל의 윤리·언약적 강도
  chosen_reading: 배신
  alternative_readings:
  - 불성실
  - 배반
  rationale: 이 구절은 단순한 잘못이 아니라 언약적 충성의 파괴를 고발하므로, 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
