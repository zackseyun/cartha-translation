revisions:
- from: 『야훼의 온 회중이 이렇게 말합니다. “이스라엘의 하나님께 행한 이 배신이 무엇입니까? 오늘 야훼를 따르는 데서 돌아서려고, 곧 오늘 야훼를 거슬러 반역하려고 너희가 너희를 위해 제단을 세웠으니 말입니다.”』[a]
  to: 『야훼의 온 회중이 이렇게 말합니다. “너희가 이스라엘의 하나님께 저지른 이 배신은 무엇입니까? 오늘 야훼를 따르는 데서 돌아서고, 너희 자신을 위하여 제단을 세워 오늘 야훼께 반역하려는 것입니까?”』[a]
  rationale: 원문의 반복된 ‘오늘’과 야훼를 따르는 데서 돌아섬 및 야훼께 반역함의 고발을 보존했습니다. 제단을 세우는 행위가 그 고발과 연결되는 수단·상황임을 ‘제단을 세워’로 표현했으며, 한국어에서 부자연스러운 목적절 연쇄를 수사 의문문으로 다듬었습니다.
