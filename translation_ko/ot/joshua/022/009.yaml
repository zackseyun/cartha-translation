base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
  footnotes:
  - marker: a
    text: Or 'which they had taken possession of.' The Hebrew verb can emphasize either receiving/holding the land or taking possession of it.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 자손과 갓 자손과 므낫세 반 지파는 이스라엘 자손을 떠나 돌아갔습니다. 그들은 가나안 땅에 있는 실로에서 길르앗 땅, 곧 여호와의 명령에 따라 모세를 통하여 그들이 소유하게 된 땅으로 갔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 차지하여 소유한 땅’. 히브리어 동사는 그 땅을 소유로 받거나 차지하여 소유하게 된 의미를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  english_pob_choice: returned and departed
  chosen_korean: 돌아서 떠나갔습니다
  alternatives_korean:
  - 돌아가 떠났습니다
  - 되돌아갔습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 연속 동작을 살리되, 한국어에서는 중복을 피하기 위해 ‘돌아서 떠나가다’로 자연스럽게 옮겼습니다.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: the sons of Reuben and the sons of Gad and the half-tribe of Manasseh
  chosen_korean: 르우벤 자손과 갓 자손과 므낫세 반 지파
  alternatives_korean:
  - 르우벤 사람들과 갓 사람들과 므낫세 반 지파
  - 르우벤 지파와 갓 지파와 므낫세 반 지파
  lexicon: HALOT
  rationale: ‘자손’은 히브리어 구성에 가깝고, ‘반 지파’는 지파의 절반을 가리키는 관용 표현을 보존합니다.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손에게서
  alternatives_korean:
  - 이스라엘 사람들에게서
  - 이스라엘 자손으로부터
  lexicon: HALOT
  rationale: 분리를 나타내는 전치사를 한국어 조사 ‘-에게서’로 옮겨, 공동체에서 떠나는 방향성을 분명하게 했습니다.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  english_pob_choice: from Shiloh, which is in the land of Canaan
  chosen_korean: 가나안 땅에 있는 실로에서
  alternatives_korean:
  - 가나안 땅의 실로에서
  - 가나안 땅에 있는 실로로부터
  lexicon: HALOT
  rationale: 관계절을 한국어의 자연스러운 위치 표현으로 압축하되, 실로의 지리적 위치를 유지했습니다.
- source_word: אֶל אֶרֶץ הַגִּלְעָד אֶל אֶרֶץ אֲחֻזָּתָם
  english_pob_choice: to the land of Gilead, to the land of their possession
  chosen_korean: 길르앗 땅으로, 곧 자기들의 소유의 땅으로
  alternatives_korean:
  - 길르앗 땅으로, 곧 자기들의 소유지로
  - 길르앗 땅으로, 곧 그들의 소유 땅으로
  lexicon: HALOT
  rationale: ‘땅’의 반복을 살리면서도, 뒤의 동격을 ‘곧’으로 분명히 해 같은 목적지를 두 번 설명하는 구조를 반영했습니다.
- source_word: עַל פִּי יְהוָה בְּיַד מֹשֶׁה
  english_pob_choice: by the command of Yahweh through Moses
  chosen_korean: 여호와께서 모세의 손을 통해 명하신 대로
  alternatives_korean:
  - 여호와의 명령에 따라 모세를 통해
  - 여호와의 말씀대로 모세를 통해
  lexicon: HALOT; DOCTRINE.md Contested terms
  rationale: ‘모세의 손을 통해’는 매개된 명령을 살리는 관용구이므로, 한국어에서는 ‘모세의 손을 통해 명하신 대로’로 옮겨 원문의 중개 구조를 유지했습니다.
