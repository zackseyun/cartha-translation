revisions:
- from: 하지만 만일 여러분의 소유지가 부정하다면, 여호와의 소유 땅으로 건너가십시오. 그곳에는 여호와의 성막이 있으며, 우리 가운데서 소유를 얻으십시오. 다만 여호와께, 또 우리에게 반역하지 마십시오. 여러분을 위해 제단을 쌓아 여호와 우리 하나님의 제단 외에 다른 제단을 두지 마십시오.[a]
  to: 그러나 만일 여러분의 소유지가 부정하다면, 여호와의 성막이 있는 여호와의 소유 땅으로 건너가서 우리 가운데에 소유지를 얻으십시오. 다만 여러분을 위하여 여호와 우리 하나님의 제단 외에 제단을 쌓음으로써 여호와께도, 또 우리에게도 반역하지 마십시오.[a]
  rationale: The revision preserves the repeated Hebrew land-holding term with “소유지,” makes the tabernacle clause modify Yahweh’s possession-land directly, and restores the source syntax in which constructing an altar besides Yahweh’s altar is the way the addressed tribes would rebel against Yahweh and the other Israelites. It does not specify the nature of the land’s uncleanness or the precise scope of the altar prohibition beyond the wording of the verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense accurately, including the conditional statement about the land’s uncleanness, the invitation to cross over, the shared holding, and the warning against rebellion. However, the final clause recasts the Hebrew means/circumstance construction as a separate prohibition and adds “다른” (“another”), whereas the source directly warns against rebellion by building an altar besides Yahweh’s altar. Revising the syntax preserves the source’s linkage and wording more closely.
  naturalness: The Korean is generally clear and appropriately formal-polite. “우리 가운데서 소유를 얻으십시오” is intelligible but somewhat abstract; “우리 가운데에 소유지를 얻으십시오” is more natural in this land-tenure context and retains the repeated possession/holding terminology. “여호와의 성막이 있는” naturally conveys the location at which the tabernacle dwells.
  terminology: “부정하다,” “성막,” “반역하다,” and “여호와” are suitable established Korean biblical terminology. “소유지” appropriately renders אֲחֻזָּה in both occurrences and preserves the lexical parallel. The footnote correctly notes the possible inherited-holding nuance.
  issues:
  - severity: medium
    issue: The final sentence makes altar-building an independent prohibition rather than expressing it as the means by which rebellion would occur.
    rationale: 'בִּבְנֹתְכֶם introduces “by building,” dependent on the preceding prohibitions: “do not rebel ... by building ... an altar besides ...”. The revision retains this grammatical and rhetorical connection.'
  - severity: low
    issue: “다른 제단” is interpretively fuller than the Hebrew wording.
    rationale: The Hebrew says “an altar besides/apart from the altar of Yahweh our God.” “제단 외에 제단” retains that formulation without introducing an explicit adjective not present in the source.
  revised_text: 그러나 만일 여러분의 소유지가 부정하다면, 여호와의 성막이 있는 여호와의 소유 땅으로 건너가서 우리 가운데에 소유지를 얻으십시오. 다만 여러분을 위하여 여호와 우리 하나님의 제단 외에 제단을 쌓음으로써 여호와께도, 또 우리에게도 반역하지 마십시오.[a]
  revised_footnotes:
  - marker: a
    text: ‘소유지’는 히브리어 אֲחֻזָּה의 기본 의미를 따른 것입니다. 이 말은 상속받은 땅 또는 보유지의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the repeated Hebrew land-holding term with “소유지,” makes the tabernacle clause modify Yahweh’s possession-land directly, and restores the source syntax in which constructing an altar besides Yahweh’s altar is the way the addressed tribes would rebel against Yahweh and the other Israelites. It does not specify the nature of the land’s uncleanness or the precise scope of the altar prohibition beyond the wording of the verse.
