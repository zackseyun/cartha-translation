source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
  footnotes:
  - marker: a
    text: Or 'your inherited land' / 'the land of your inheritance.' The Hebrew term for 'possession' can denote a hereditary holding.
    reason: lexical_alternative
  - marker: b
    text: Or 'where the tabernacle of the LORD resides.' The Hebrew literally refers to the LORD’s tabernacle dwelling there.
    reason: lexical_alternative
  - marker: c
    text: Or 'and settle among us.' The Hebrew verb can carry the sense of obtaining a holding or settling in a place.
    reason: lexical_alternative
  - marker: d
    text: Or 'apart from' or 'in addition to' the altar of the LORD our God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 여러분의 소유지가 부정하다면, 여호와의 성막이 있는 여호와의 소유 땅으로 건너가서 우리 가운데에 소유지를 얻으십시오. 다만 여러분을 위하여 여호와 우리 하나님의 제단 외에 제단을 쌓음으로써 여호와께도, 또 우리에게도 반역하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소유지’는 히브리어 אֲחֻזָּה의 기본 의미를 따른 것입니다. 이 말은 상속받은 땅 또는 보유지의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְמֵאָה
  english_pob_choice: unclean
  chosen_korean: 부정하다
  alternatives_korean:
  - 더럽다
  - 불결하다
  - 정결하지 않다
  lexicon: HALOT
  rationale: 땅의 의식적 부정 상태를 가리키므로, 일상적 오염보다 예배적·제의적 뉘앙스를 살리는 ‘부정하다’가 적절합니다.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  english_pob_choice: the land of your possession
  chosen_korean: 여러분의 소유지
  alternatives_korean:
  - 여러분의 상속 땅
  - 여러분의 기업의 땅
  - 여러분의 소유의 땅
  lexicon: HALOT
  rationale: אֲחֻזָּה의 핵심은 ‘소유로 받은 땅/보유지’이므로, 한국어로는 간결하게 ‘소유지’로 옮겨 반복되는 대조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 이 구절의 영어 POB는 고유신명 대신 ‘Yahweh’를 사용하지만, 한국어 본문에서는 관용적 성경 문체를 고려해 ‘여호와’를 택했습니다. 본문 내 ‘여호와 우리 하나님’의 반복 대조도 유지됩니다.
- source_word: מִשְׁכַּן יְהוָה
  english_pob_choice: the LORD’s tabernacle
  chosen_korean: 여호와의 성막
  alternatives_korean:
  - 여호와의 장막
  - 여호와의 거처
  - 여호와의 성소
  lexicon: HALOT
  rationale: מִשְׁכָּן은 광야-언약궤 전승의 예배 장소를 가리키므로, 표준적인 대응인 ‘성막’이 가장 직접적입니다.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  english_pob_choice: take possession among us
  chosen_korean: 우리 가운데서 소유를 얻으십시오
  alternatives_korean:
  - 우리 가운데 거주하십시오
  - 우리 가운데서 자리 잡으십시오
  - 우리 가운데서 정착하십시오
  lexicon: HALOT
  rationale: 동사는 단순 거주보다 ‘소유/보유를 얻다’는 뉘앙스가 있어, 문맥상 ‘소유를 얻다’로 옮겨 앞의 ‘소유지’와 어휘 대응을 살렸습니다.
- source_word: וּבַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ
  english_pob_choice: Only do not rebel against Yahweh, or against us
  chosen_korean: 다만 여호와께, 또 우리에게 반역하지 마십시오
  alternatives_korean:
  - 오직 여호와를 거역하지 마십시오, 또 우리를 거역하지 마십시오
  - 여호와와 우리에게 반역하지 마십시오
  - 다만 여호와와 우리를 거역하지 마십시오
  lexicon: HALOT
  rationale: מָרַד는 단순 불복종보다 정치·언약적 ‘반역’이 강하므로 ‘반역하다’로 옮겼습니다. שני 객체를 병렬로 살려 여호와와 공동체 둘 다에 대한 언약 위반 경고를 분명히 했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문은 고유신명 יְהוָה를 한국어에서 관용적인 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 하나님의 소유 땅과 성막, 제단을 대조하는 언약 문맥이므로, 한국어 독자에게 즉시 인지되는 전통적 고유신명 표기를 유지했습니다. 본 작업은 출발어 대응의 정밀성보다 한국어 성경 가독성과 문맥 일관성을 우선했습니다.
  doctrine_reference: 성경 번역 관행과 수용성의 균형
- issue: ‘반역하다’의 강도
  chosen_reading: אַל תִּמְרֹדוּ를 ‘반역하지 마십시오’로 옮겨 단순한 의견 차이보다 언약적 배신의 강도를 드러냈습니다.
  alternative_readings:
  - 거역하지 마십시오
  - 배반하지 마십시오
  - 불순종하지 마십시오
  rationale: 문맥상 요단 동편 지파가 서편 지파와 제단 문제로 긴장하는 장면이어서, מָרַד의 정치·공동체적 함의를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 언약 충성의 언어 유지
