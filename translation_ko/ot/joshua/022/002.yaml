  source_fidelity: 원문은 여호수아가 그들에게, 모세 곧 야훼의 종이 명령한 모든 것을 지켰으며 자신이 명령한 모든 일에서 자신의 ‘음성’을 들었다고 말하는 내용입니다. 초안은 핵심 어휘와 포괄성, 야훼의 이름, ‘음성’ 비유를 대체로 충실히 반영합니다. 다만 두 번째 절의 ‘모든 일에 내 음성에’는 원문의 수식 관계를 한국어에서 부자연스럽게 만들므로 ‘모든 일에서’로 바로잡는 것이 필요합니다.
  naturalness: ‘내가 너희에게 명령한 모든 일에 내 음성에 귀를 기울였습니다’에는 조사 ‘에’가 연속되어 현대 표준어 문장으로 매끄럽지 않습니다. ‘내가 너희에게 명령한 모든 일에서 내 음성에 귀를 기울였습니다’가 자연스럽고 원문의 범위도 보존합니다. 각주도 같은 어순 문제를 고쳐야 합니다.
  terminology: ‘야훼’, ‘야훼의 종 모세’, ‘명령하다’, ‘지키다’는 문맥과 프로젝트 용어 정책에 적절합니다. שׁמע בְּקוֹל의 문자적 표현인 ‘내 음성에 귀를 기울이다’를 본문에 유지하고, 순종의 함의는 각주로 제시하는 방식이 적절합니다.
