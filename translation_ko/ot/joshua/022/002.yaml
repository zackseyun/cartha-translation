id: JOS.22.2
reference: Joshua 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
  footnotes:
  - marker: a
    text: Or 'and you obeyed my voice in everything that I commanded you.' The Hebrew idiom 'listen to my voice' often carries the sense of obedient response.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「너희는 야훼의 종 모세가 너희에게 명령한 모든 것을 지켰고, 내가 너희에게 명령한 모든 일에 내 음성에 귀를 기울였습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 음성에 모든 일에서 순종했습니다.’ 히브리어 관용구 ‘내 음성에 듣다’는 보통 순종의 응답을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  english_pob_choice: And he said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말하였습니다
  - 그가 그들에게 이르렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도, 원문의 단순한 발화 동사를 합쇼체로 옮겼습니다.
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה
  english_pob_choice: You have kept all that ... commanded you
  chosen_korean: 너희는 ... 명령한 모든 것을 지켰고
  alternatives_korean:
  - 너희는 ... 명령한 모든 것을 지켰으며
  - 너희는 ... 명령한 것을 다 지켰고
  lexicon: HALOT
  rationale: שׁמר의 언약적 ‘지키다’ 의미를 살려 ‘지켰고’로 옮겼으며, כָּל אֲשֶׁר의 포괄성을 ‘모든 것’으로 반영했습니다.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  english_pob_choice: Moses the servant of Yahweh
  chosen_korean: 야훼의 종 모세
  alternatives_korean:
  - 야훼의 종인 모세
  - 야훼를 섬기는 모세
  lexicon: HALOT
  rationale: עֶבֶד은 여기서 모세의 관용적 칭호이므로 ‘종’으로 옮겼고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 음역했습니다.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  english_pob_choice: and you have listened to my voice
  chosen_korean: 내 음성에 귀를 기울였습니다
  alternatives_korean:
  - 내 음성을 들었습니다
  - 내 음성에 순종했습니다
  lexicon: HALOT
  rationale: שׁמע בְּקוֹל은 단순 청취보다 응답하는 경청/복종의 관용구이므로, 문자성과 함의를 함께 살린 표현을 택했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유명사 יְהוָה를 직접 사용하므로, титул 대체어인 ‘주’ 대신 음역 ‘야훼’를 유지해 원문 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 모세에 대한 עֶבֶד의 처리
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 종이신
  rationale: 여기서는 신분적 노예성보다 야훼께 위임받은 종/봉사의 칭호가 전면에 있으므로, 문맥상 ‘종’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δοῦλος servant / slave (context-dependent); applied analogically to Hebrew עֶבֶד by context'
