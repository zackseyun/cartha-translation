  to: “능하신 분, 하나님, 야훼!”[a] “능하신 분, 하나님, 야훼!” 그분은 아시며, 이스라엘도 알게 될 것입니다. 만일 그것이 반역으로 말미암은 것이거나 야훼께 대한 불성실[b]로 말미암은 것이라면, 오늘 우리를 구원하지 마십시오.
