id: JOS.22.22
reference: Joshua 22:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
  footnotes:
  - marker: a
    text: 'Hebrew repeats the divine invocation twice: ''El, God, the LORD; El, God, the LORD,'' an emphatic oath-like appeal.'
    reason: cultural_note
  - marker: b
    text: Or 'if in trespass' / 'if in unfaithfulness' for 'in breach of faith.'
    reason: lexical_alternative
translation:
  language: ko
  text: “능하신 분, 하나님, 야훼!”[a] “능하신 분, 하나님, 야훼!” 그분은 아시며, 이스라엘도 알게 될 것입니다. 만일 그것이 반역으로 말미암은 것이거나 야훼께 대한 불성실[b]로 말미암은 것이라면, 오늘 우리를 구원하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘엘, 하나님, 야훼; 엘, 하나님, 야훼’라고 신적 호칭을 두 번 반복하여 엄숙하고 맹세적인 호소를 강조합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘배신’ 또는 ‘언약을 저버림’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  english_pob_choice: The Mighty One, God, Yahweh
  chosen_korean: 능하신 이, 하나님, 야훼
  alternatives_korean:
  - 전능하신 하나님, 야훼
  - 능하신 하나님, 야훼
  - 하나님들의 하나님, 야훼
  lexicon: HALOT
  rationale: אֵל의 압축된 힘을 살리기 위해 ‘능하신 이’로 옮기고, 뒤의 אֱלֹהִים은 고유한 호칭으로 ‘하나님’, יְהוָה는 원문 직접음역인 ‘야훼’로 유지했습니다.
- source_word: הוּא יֹדֵעַ
  english_pob_choice: He knows
  chosen_korean: 그분은 아시고
  alternatives_korean:
  - 그는 압니다
  - 그분이 아십니다
  - 그는 알고 계십니다
  lexicon: HALOT
  rationale: 하나님께 대한 공손한 서술로 ‘아시고’를 택해 현재적 지식을 자연스럽게 살렸습니다.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  english_pob_choice: and Israel itself will know
  chosen_korean: 이스라엘도 알 것입니다
  alternatives_korean:
  - 이스라엘도 알게 될 것입니다
  - 이스라엘 자신도 알 것입니다
  - 이스라엘이 알 것입니다
  lexicon: HALOT
  rationale: הוּא의 강조를 한국어에서는 ‘도’로 과도한 어색함 없이 반영하고, 미래형으로 결과를 드러냈습니다.
- source_word: וְאִם בְּמַעַל
  english_pob_choice: or if in unfaithfulness
  chosen_korean: 아니면 야훼께 대한 불성실
  alternatives_korean:
  - 아니면 야훼께 대한 배신
  - 아니면 야훼께 대한 신의 저버림
  - 아니면 야훼께 대한 불충실
  lexicon: HALOT
  rationale: מַעַל의 언약적 배반 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 직접적인 ‘불성실’로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼께 대한
  alternatives_korean:
  - 야훼를 향한
  - 야훼에게 대한
  - 야훼에 대한
  lexicon: HALOT
  rationale: 전치사의 대립적 의미를 한국어에서 관계표현으로 풀어, 반역/불성실의 대상이 야훼임을 분명히 했습니다.
- source_word: אַל תּוֹשִׁיעֵנוּ
  english_pob_choice: do not save us
  chosen_korean: 오늘 우리를 구원하지 마십시오
  alternatives_korean:
  - 오늘 우리를 구해 주지 마십시오
  - 오늘 우리를 살려 주지 마십시오
  - 이 날 우리를 구원하지 마십시오
  lexicon: HALOT
  rationale: 히필 ‘구원하다’의 직접성을 살리되, 한국어 기도체에 맞게 공손한 금지 요청으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 ‘야훼’를 유지해 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 반복된 신적 호칭의 수사적 효과
  chosen_reading: 두 번의 동일한 호칭을 그대로 반복해 엄숙한 확언·맹세적 호소를 보존
  alternative_readings:
  - 한 번만 묶어 번역
  - 더 자연스럽게 축약
  rationale: 히브리어의 반복은 우연한 중복이 아니라 강조 장치이므로, 한국어에서도 그대로 두어 긴장과 엄숙함을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense and theological tension'
