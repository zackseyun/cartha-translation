  - 사제
  lexicon: HALOT
  rationale: פִּינְחָס의 직분을 가리키는 표준 성경 용례에 따라 ‘제사장’으로 옮기되, 한국어에서 자연스럽고 직분 의미가 분명하도록 했습니다.
- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
