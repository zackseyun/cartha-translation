  source_fidelity: 첫머리의 ‘이러므로’는 히브리어 본문에 없으므로 삭제해야 합니다. 또한 ‘천부장’은 현대 한국어에서 군 계급 또는 천 명을 지휘하는 장교라는 뜻으로 굳어져 있어, אַלְפֵי가 가리키는 이스라엘의 사회·행정 단위를 지나치게 특정할 수 있습니다. ‘천부 단위의 우두머리들’로 옮기고 각주에서 문자적 의미와 가능한 단위적 이해를 밝혀 두는 것이 안전합니다. 마지막 관용구는 ‘좋게 여기다’로 자연스럽게 옮기되, 각주에서 직역적 표현을 제시합니다.
  naturalness: ‘그들의 눈에 좋게 보였습니다’도 이해 가능하지만 현대 표준 한국어에서는 ‘그들은 그것을 좋게 여겼습니다’가 더 자연스럽고, 본문의 승인·긍정적 평가의 뜻을 잘 전달합니다. ‘말한 그 말’은 부자연스러우므로 복수형 ‘말들을’로 다듬었습니다.
