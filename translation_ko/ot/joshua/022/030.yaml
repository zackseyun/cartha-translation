reference: Joshua 22:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the heads of the thousands of Israel'; this likely refers to clan or tribal subdivision leaders rather than a strict numerical unit.
    reason: lexical_alternative
  - marker: b
    text: Or, 'it pleased them' / 'it seemed good to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러므로 제사장 비느하스와 회중의 지도자들과 그와 함께 있던 이스라엘의 천부장들이 르우벤 자손과 갓 자손과 므낫세 자손이 말한 그 말을 들었고, 그것이 그들의 눈에 좋게 보였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 천 명들(천부 단위)’을 말합니다. 여기서는 엄격한 수적 단위보다 집단 책임자를 가리키는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그들이 기뻐했습니다’ / ‘그들에게 좋게 보였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  - 사제
  lexicon: HALOT
  rationale: פִּינְחָס의 직분을 가리키는 표준 성경 용례에 따라 ‘제사장’으로 옮기되, 한국어에서 자연스럽고 직분 의미가 분명하도록 했습니다.
- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
  - 회중의 우두머리들
  - 회중의 장들
  lexicon: HALOT
  rationale: עֵדָה를 ‘회중’으로 옮기고, נשיאים는 신분적·행정적 주도자를 가리키므로 ‘지도자들’이 가장 현대적이고 분명합니다.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  english_pob_choice: the heads of the thousands of Israel
  chosen_korean: 이스라엘의 천부장들
  alternatives_korean:
  - 이스라엘의 천 명들의 우두머리들
  - 이스라엘의 천부 단위의 우두머리들
  lexicon: HALOT
  rationale: אַלְפֵי를 직역하면 ‘천 명들’이지만, 문맥상 행정·군사적 하위 단위의 책임자를 뜻할 수 있어 한국어 관용 표현 ‘천부장들’이 의미를 더 자연스럽게 전달합니다.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  english_pob_choice: it was good in their eyes
  chosen_korean: 그것이 그들의 눈에 좋게 보였습니다
  alternatives_korean:
  - 그들이 좋게 여겼습니다
  - 그들에게 옳게 보였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 보존하여, 단순한 감정 반응보다 ‘판단상 좋게 보임’이라는 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘그들의 눈에 좋게 보였다’의 처리
  chosen_reading: 직역에 가까운 표현을 유지해, 판단과 승인이라는 의미를 동시에 드러냈습니다.
  alternative_readings:
  - 그들이 좋게 여겼습니다
  - 그들에게 맞는 말로 여겨졌습니다
  rationale: 이 구절은 단순한 호감이 아니라 말의 정당성에 대한 평가를 나타내므로, 본문의 관용성을 살리는 쪽이 더 투명합니다.
  doctrine_reference: 본문 의미 보존과 서술적 정확성
