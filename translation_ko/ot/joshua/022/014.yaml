source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
  footnotes:
  - marker: a
    text: Hebrew 'for the thousands of Israel'; here 'thousands' likely refers to clan divisions or larger family groupings within Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 지도자 열 명이 있었는데, 이스라엘의 모든 지파에서 각 조상 가문마다 한 명씩 뽑힌 지도자들이었습니다. 그들은 각각 이스라엘의 천 단위들[a] 가운데 자기 조상 가문의 우두머리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이스라엘의 천 단위들’. 여기서 ‘천 단위들’은 문자 그대로의 천 명이라기보다 이스라엘 안의 씨족 단위나 더 큰 가족 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  english_pob_choice: leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 지도자
  - 족장들
  - 통치자들
  lexicon: HALOT
  rationale: 이 문맥은 지파 대표로 선출된 공식 인물을 가리키므로, 현대 한국어에서 자연스럽고 위상을 살리는 ‘지도자’가 가장 적절합니다.
- source_word: לְבֵית אָב
  english_pob_choice: for each ancestral house
  chosen_korean: 한 가문마다
  alternatives_korean:
  - 아버지 집마다
  - 조상 가문마다
  - 가문마다
  lexicon: HALOT
  rationale: 베이트 아브는 혈연-행정 단위이므로 ‘가문’이 가장 간명하며, 반복 구조를 살리기 위해 ‘한 가문마다’로 옮겼습니다.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  english_pob_choice: from all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파에서
  alternatives_korean:
  - 이스라엘의 모든 지파를 위하여
  - 이스라엘의 모든 지파 가운데서
  lexicon: HALOT
  rationale: 대표 선출의 출처를 분명히 하기 위해 ‘~에서’로 옮겼고, 지파 단위를 그대로 유지했습니다.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  english_pob_choice: among the thousands of Israel
  chosen_korean: 이스라엘의 천인들 가운데서
  alternatives_korean:
  - 이스라엘의 천명들 가운데서
  - 이스라엘의 천대들 가운데서
  - 이스라엘의 천 단위들 가운데서
  lexicon: HALOT
  rationale: '''천인들''은 단순 수량이 아니라 부족 내 군사·행정 단위로 읽힐 수 있어, POB의 보수적 표기를 따라 문자성을 살리면서도 한국어로 이해 가능하게 했습니다.'
theological_decisions:
- issue: ‘천인들’의 사회-행정적 의미
  chosen_reading: 수사적 숫자보다 집단 단위(천인들)로 읽히는 표현을 본문에 유지했습니다.
  alternative_readings:
  - ‘천 개 집단’으로 풀어쓰는 해석
  - ‘부족 내 큰 집단’으로 의역하는 해석
  rationale: 히브리어 אַלְפֵי는 여기서 실제 숫자보다 집단 단위를 가리킬 수 있으므로, 의미를 희석하지 않기 위해 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: 본문 의미 보존과 역사-사회적 맥락 반영
