translation:
  language: ko
  text: 그와 함께 열 명의 지도자들, 곧 이스라엘의 모든 지파에서 한 가문마다 한 명의 지도자들이 있었으니, 그들 각각은 이스라엘의 천인들 가운데서 자기 조상 가문의 우두머리였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천인들’은 여기서 문자 그대로의 천 명보다 이스라엘 내부의 씨족·부대 단위를 가리킬 가능성이 큽니다.
    reason: source_note
