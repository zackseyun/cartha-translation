- from: 그와 함께 열 명의 지도자들, 곧 이스라엘의 모든 지파에서 한 가문마다 한 명의 지도자들이 있었으니, 그들 각각은 이스라엘의 천인들 가운데서 자기 조상 가문의 우두머리였습니다.[a]
  to: 그와 함께 지도자 열 명이 있었는데, 이스라엘의 모든 지파에서 각 조상 가문마다 한 명씩 뽑힌 지도자들이었습니다. 그들은 각각 이스라엘의 천 단위들[a] 가운데 자기 조상 가문의 우두머리였습니다.
  rationale: 문법적으로 충돌하는 분배 구문을 바로잡고, 원문의 대표성 및 가문 구조를 유지했습니다. 논쟁적인 אַלְפֵי의 의미는 한 해석으로 확정하지 않고, 본문에서는 ‘천 단위들’로 보존하며 각주에서 씨족·가족 집단일 가능성을 제시했습니다.
