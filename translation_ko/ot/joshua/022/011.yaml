  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
  footnotes:
  - marker: a
    text: Or “the Israelites heard, saying,” with לֵאמֹר taken more literally; the English main text smooths the Hebrew reporting formula.
    reason: lexical_alternative
  - marker: b
    text: Or “facing the land of Canaan” for “opposite the land of Canaan.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “the districts/regions of the Jordan”; the exact geographical nuance of the phrase is uncertain.
    reason: cultural_note
  - marker: d
    text: Or “on the side of the sons of Israel” / “across from the sons of Israel.” The final geographical phrase is difficult and may indicate either the side belonging to Israel west of the Jordan or a position opposite them.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손이 들었습니다. 곧, 「보십시오. 르우벤 자손과 갓 자손과 므낫세 반 지파가 가나안 땅 맞은편, 요단 지역, 이스라엘 자손 편에 제단을 쌓았습니다」라는 소식입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֵאמֹר을 더 직역하면 “이스라엘 자손이 들으며 말하기를”이 되지만, 한국어 본문은 보고 전달을 자연스럽게 풀었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘맞은편’은 히브리어 מוּל의 기본 공간 관계를 옮긴 것입니다.
    reason: source_note
  - marker: c
    text: ‘요단 지역’은 히브리어 גְּלִילוֹת הַיַּרְדֵּן의 지리적 뉘앙스를 일반적으로 옮긴 것입니다.
    reason: cultural_note
  - marker: d
    text: 마지막 구절은 ‘이스라엘 자손 쪽에’ 또는 ‘이스라엘 자손 맞은편에’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  english_pob_choice: And the sons of Israel heard it said
  chosen_korean: 이스라엘 자손이 들었습니다. 곧, …라는 소식입니다
  alternatives_korean:
  - 이스라엘 자손이 들었고, 말했습니다
  - 이스라엘 자손이 듣고 말했습니다
  lexicon: WLC
  rationale: לֵאמֹר을 단순한 ‘말하다’로 풀기보다, 보고를 들은 상황을 한국어로 자연스럽게 옮겨 ‘…라는 소식입니다’로 보고 전달 기능을 살렸습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: WLC
  rationale: 히브리어의 직역적 가족-민족 표현을 유지하되, 한국어에서 자연스러운 성서적 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: WLC
  rationale: 주의를 끄는 감탄사로서 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽고, 인용문 안의 경고성·주목성도 유지합니다.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  english_pob_choice: opposite the land of Canaan
  chosen_korean: 가나안 땅 맞은편
  alternatives_korean:
  - 가나안 땅을 마주한
  - 가나안 땅 앞쪽
  lexicon: HALOT
  rationale: מוּל의 공간적 ‘마주함/맞은편’을 한국어 관용에 맞게 ‘맞은편’으로 옮겨, 지리적 대칭 관계를 과도하게 해석하지 않도록 했습니다.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  english_pob_choice: the region of the Jordan
  chosen_korean: 요단 지역
  alternatives_korean:
  - 요단의 지대
  - 요단의 구역
  lexicon: HALOT
  rationale: גְּלִילוֹת는 정확한 지형어가 불확실하므로, POB의 ‘region’에 맞춰 보다 일반적인 ‘지역’으로 처리했습니다.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  english_pob_choice: on the side of the sons of Israel
  chosen_korean: 이스라엘 자손 편에
  alternatives_korean:
  - 이스라엘 자손 쪽에
  - 이스라엘 자손 편 맞은편에
  lexicon: HALOT
  rationale: עֵבֶר의 방향성은 문맥상 논란이 있으므로, 단정적 지명화 대신 관계를 드러내는 ‘편에’로 옮겨 공간적 모호성을 보존했습니다.
theological_decisions:
- issue: 이 절의 지리적 표현이 해석상 모호함
  chosen_reading: 본문의 모호성을 유지하여, 제단의 위치를 단정하지 않고 ‘가나안 땅 맞은편, 요단 지역, 이스라엘 자손 편에’로 옮겼습니다.
  alternative_readings:
  - 제단이 이스라엘 자손 쪽에 있었다는 뜻으로 좁혀 읽기
  - 요단 동편/서편을 특정해 해석하기
  rationale: 히브리어의 마지막 지리구가 애매하므로, 한국어도 과도한 해석을 피하고 독자가 본문 자체의 긴장을 그대로 보게 하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 본문비평/지리해석의 보존
- issue: 보고문과 직접 인용의 경계
  chosen_reading: ‘들었습니다. 곧, 「…」라는 소식입니다’로 처리해, 보고문과 인용문을 구분했습니다.
  alternative_readings:
  - ‘들어서 말했습니다’처럼 서술을 평탄화하기
  - 직접인용 없이 하나의 평서문으로 합치기
  rationale: לֵאמֹר의 보고 기능을 한국어에서도 드러내어, 사건 전달의 구조를 유지했습니다.
  doctrine_reference: 서사 구조 보존
