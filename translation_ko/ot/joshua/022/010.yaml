base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
  footnotes:
  - marker: a
    text: Or 'districts' or 'borders' of the Jordan.
    reason: lexical_alternative
  - marker: b
    text: Or 'a large altar to look at'—that is, an altar conspicuous in appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가나안 땅에 있는 요단강 지역[a]에 이르자, 르우벤 자손과 갓 자손과 므낫세 반 지파가 그곳 요단강가에 제단을 쌓았는데, 그것은 보기에 큰 제단이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גְּלִילוֹת는 ‘구역들’, ‘지방들’ 또는 ‘경계 지역들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לְמַרְאֶה는 직역하면 ‘보기에’이며, ‘눈에 띄는 외관을 한’ 또는 ‘외관상 두드러진’이라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
