  lexicon: HALOT
  rationale: 서술의 진행과 시간 관계를 한국어에서 자연스럽게 살리기 위해 ‘이르자’를 택했습니다.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: the sons of Reuben and the sons of Gad and the half-tribe of Manasseh
  chosen_korean: 르우벤 자손과 갓 자손과 므낫세 반 지파
  alternatives_korean:
  - 르우벤 사람들과 갓 사람들과 므낫세 반 지파
  - 르우벤 지파와 갓 지파와 므낫세 반 지파
  lexicon: HALOT
  rationale: 히브리어의 친족/지파 표현을 따라 ‘자손’과 ‘반 지파’를 유지해 원문 구조를 투명하게 드러냈습니다.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  english_pob_choice: an altar great in appearance
  chosen_korean: 보기에 매우 큰 제단
  alternatives_korean:
  - 보기에 큰 제단
  - 겉보기에는 큰 제단
