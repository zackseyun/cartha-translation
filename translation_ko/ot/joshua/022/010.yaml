  - 요단강 옆에
  - 요단강에
  lexicon: HALOT
  rationale: 지리적 근접을 나타내는 전치사를 한국어 관용에 맞게 ‘강가에’로 옮겨, 위치를 분명하고 자연스럽게 표현했습니다.
theological_decisions:
- issue: 이 제단의 성격에 대한 서술적 긴장 보존
  chosen_reading: 제단의 용도나 정당성은 여기서 판단하지 않고, 단지 ‘보기에 매우 큰 제단’으로 서술했습니다.
  alternative_readings:
  - 큰 제단을 세웠습니다
  - 눈에 띄는 제단을 세웠습니다
  rationale: 본문은 아직 동기나 신학적 평가를 말하지 않으므로, 크기와 외형에 대한 묘사만 살려 후속 내러티브의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
