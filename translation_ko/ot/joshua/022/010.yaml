  lexicon: HALOT
  rationale: לְמַרְאֶה의 핵심은 외형상 두드러짐이므로 ‘보기에’로 옮기고, גָּדוֹל은 문자 그대로 ‘큰’으로 살리되 문맥상 강조를 위해 ‘매우’를 더했습니다.
- source_word: עַל הַיַּרְדֵּן
  english_pob_choice: by the Jordan
  chosen_korean: 요단강가에
  alternatives_korean:
