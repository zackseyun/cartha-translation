base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
  footnotes:
  - marker: a
    text: Or 'districts' or 'borders' of the Jordan.
    reason: lexical_alternative
  - marker: b
    text: Or 'a large altar to look at'—that is, an altar conspicuous in appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가나안 땅에 있는 요단강 지역에 이르자, 르우벤 자손과 갓 자손과 므낫세 반 지파가 그곳 요단강가에 제단 하나를 쌓았는데, 그것은 보기에 매우 큰 제단이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גְּלִילוֹת는 ‘지역들’, ‘구역들’, ‘경계들’처럼 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לְמַרְאֶה는 ‘보기 좋게’, ‘겉으로 드러나게’, ‘눈에 띄게’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  english_pob_choice: region
  chosen_korean: 지역
  alternatives_korean:
  - 지방
  - 구역
  - 경계들
  lexicon: HALOT
  rationale: 지리적 범위를 가리키는 말로서 현대 한국어에서는 ‘지역’이 가장 자연스럽고, 영어 POB의 ‘region’과도 잘 대응합니다.
- source_word: וַיָּבֹאוּ אֶל
  english_pob_choice: When they came to
  chosen_korean: 그들이 …에 이르자
  alternatives_korean:
