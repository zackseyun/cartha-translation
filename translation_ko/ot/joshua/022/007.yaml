  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: Now to the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
  footnotes:
  - marker: a
    text: Hebrew 'with their brothers.' The term refers to their fellow Israelites in the other tribes.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 므낫세 반 지파에게는 모세가 바산에서 땅을 주었고, 그 다른 반에게는 여호수아가 그들의 형제들과 함께 요단 강 서쪽 건너편에 땅을 주었습니다. 그리고 여호수아가 그들을 그들의 장막으로 돌려보낼 때 그들에게 복을 빌어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 다른 지파들에 속한 같은 이스라엘 동족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: to the one half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파에게
  alternatives_korean:
  - 므낫세의 한 반 지파에게
  - 므낫세의 절반 지파에게
  lexicon: HALOT
  rationale: 히브리어는 므낫세 지파의 두 분할 가운데 한쪽을 가리키므로, 한국어에서는 자연스러운 관용 표현인 ‘반 지파’로 옮겼습니다.
- source_word: נָתַן מֹשֶׁה / נָתַן יְהוֹשֻׁעַ
  english_pob_choice: Moses had given / Joshua gave
  chosen_korean: 모세가 ... 주었고 / 여호수아가 ... 주었습니다
  alternatives_korean:
  - 모세가 ... 주고 / 여호수아가 ... 주었습니다
  - 모세가 ... 주었으며 / 여호수아가 ... 주었습니다
  lexicon: HALOT
  rationale: 서술의 시간 순서를 살리기 위해 모세의 행위는 앞선 완료로, 여호수아의 행위는 뒤이은 일반 과거로 번역했습니다.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  english_pob_choice: beyond the Jordan westward
  chosen_korean: 요단 강 서쪽 건너편
  alternatives_korean:
  - 요단 강 서쪽으로
  - 요단 강 건너 서쪽
  lexicon: HALOT
  rationale: 히브리어가 ‘요단 강 너머 서쪽’을 뜻하므로, 위치를 분명히 하면서도 한국어에서 자연스러운 ‘서쪽 건너편’으로 옮겼습니다.
- source_word: אֶל אָהֳלֵיהֶם
  english_pob_choice: to their tents
  chosen_korean: 그들의 장막으로
  alternatives_korean:
  - 그들의 집으로
  - 그들의 천막으로
  lexicon: HALOT
  rationale: 원문 이미지를 보존하기 위해 ‘장막’을 유지했습니다. 이는 단순한 주거지보다 광야/정착 초기를 연상시키는 구체적 표현입니다.
theological_decisions:
- issue: וַיְבָרֲכֵם의 번역
  chosen_reading: 그들에게 복을 빌어 주었습니다
  alternative_readings:
  - 그들을 축복했습니다
  - 그들에게 복을 주었습니다
  rationale: ברך를 단순한 종교용어로 완만하게 처리하기보다, 문맥상 파송 장면에서의 축복 행위를 드러내는 표현을 택했습니다.
  doctrine_reference: Narrative blessing in covenantal context
