  yaml_path: translation/ot/joshua/022/007.yaml
  text: Now to the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
  footnotes:
  - marker: a
    text: Hebrew 'with their brothers.' The term refers to their fellow Israelites in the other tribes.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세의 한 반 지파에게는 모세가 바산에서 땅을 주었고, 므낫세의 다른 반 지파에게는 여호수아가 그들의 형제들[a]과 함께 요단 강 건너 서쪽에 땅을 주었습니다. 또한 여호수아가 그들을 그들의 장막으로 보내고 그들에게 축복했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 다른 지파들에 속한 같은 이스라엘 동족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: to the one half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파에게
  alternatives_korean:
  - 므낫세의 한 반 지파에게
  - 므낫세의 절반 지파에게
  lexicon: HALOT
  rationale: 히브리어는 므낫세 지파의 두 분할 가운데 한쪽을 가리키므로, 한국어에서는 자연스러운 관용 표현인 ‘반 지파’로 옮겼습니다.
- source_word: נָתַן מֹשֶׁה / נָתַן יְהוֹשֻׁעַ
  english_pob_choice: Moses had given / Joshua gave
  chosen_korean: 모세가 ... 주었고 / 여호수아가 ... 주었습니다
  alternatives_korean:
  - 모세가 ... 주고 / 여호수아가 ... 주었습니다
  - 모세가 ... 주었으며 / 여호수아가 ... 주었습니다
  lexicon: HALOT
  rationale: 서술의 시간 순서를 살리기 위해 모세의 행위는 앞선 완료로, 여호수아의 행위는 뒤이은 일반 과거로 번역했습니다.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  english_pob_choice: beyond the Jordan westward
  chosen_korean: 요단 강 서쪽 건너편
  alternatives_korean:
