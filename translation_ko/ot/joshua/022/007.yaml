  naturalness: ‘그 다른 반’은 지시 대상이 다소 불분명하므로 ‘므낫세의 다른 반 지파’로 명시했습니다. ‘장막으로 돌려보낼 때’는 귀환의 의미를 다소 보태므로 원문의 파송 행위에 맞추어 ‘장막으로 보내고’로 다듬었습니다. ‘축복했습니다’는 ברך를 자연스럽고 직접적으로 옮긴 현대 한국어 합쇼체 표현입니다.
