  lexicon: HALOT
  rationale: 히브리어가 ‘요단 강 너머 서쪽’을 뜻하므로, 위치를 분명히 하면서도 한국어에서 자연스러운 ‘서쪽 건너편’으로 옮겼습니다.
- source_word: אֶל אָהֳלֵיהֶם
  english_pob_choice: to their tents
  chosen_korean: 그들의 장막으로
  alternatives_korean:
  - 그들의 집으로
  - 그들의 천막으로
  lexicon: HALOT
  rationale: 원문 이미지를 보존하기 위해 ‘장막’을 유지했습니다. 이는 단순한 주거지보다 광야/정착 초기를 연상시키는 구체적 표현입니다.
