source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/ם יְהוֹשֻׁ֑עַ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אָהֳלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
  footnotes:
  - marker: a
    text: Or 'their homes'—literally 'their tents.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 그들을 축복하고 떠나보냈습니다. 그들은 자기들의 장막으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막’은 문자적으로 ‘텐트’입니다. 영어 POB의 footnote처럼, 상황에 따라 ‘집들’의 뜻으로도 이해될 수 있으나 본문은 문자적 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  english_pob_choice: blessed them
  chosen_korean: 그들을 축복하고
  alternatives_korean:
  - 그들에게 복을 빌어 주고
  - 그들에게 축복을 베풀고
  lexicon: HALOT
  rationale: פּעל형 ברך의 축복 행위를 자연스러운 현대 한국어로 옮기되, 단순한 인사말보다 실제로 복을 빌고 선언하는 행위가 드러나도록 ‘축복하고’로 렌더링했습니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: sent them away
  chosen_korean: 떠나보냈습니다
  alternatives_korean:
  - 보내 주었습니다
  - 해산시켰습니다
  lexicon: HALOT
  rationale: 문맥상 출발을 허락하고 보내는 동작이므로, ‘sent them away’의 의미를 살리면서도 현대 서술문에 자연스러운 ‘떠나보냈습니다’를 선택했습니다.
- source_word: אָהֳלֵיהֶם
  english_pob_choice: their tents
  chosen_korean: 자기들의 장막으로
  alternatives_korean:
  - 자기들의 천막으로
  - 자기들의 집으로
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현이 ‘장막/텐트’이므로, 메타포적 ‘집’보다 구체적인 군사·유목 맥락을 보존하는 ‘장막’이 더 स्रोत-직접적입니다.
theological_decisions:
- issue: ‘축복’ 행위의 성격
  chosen_reading: 여호수아가 공동체 지도자로서 떠나는 사람들에게 실제로 복을 빌고 선언하는 행위로 읽었습니다.
  alternative_readings:
  - 단순한 작별 인사로 약화하여 읽기
  - 의례적 축복문으로만 한정하기
  rationale: 히브리어 동사 ברך는 כאן에서 실질적인 축복 행위를 가리키며, 이 장면의 공적·서사적 무게를 유지하는 번역이 필요합니다.
  doctrine_reference: 민수기 6장 축복 전통과 구약의 지도자 축복 관습
