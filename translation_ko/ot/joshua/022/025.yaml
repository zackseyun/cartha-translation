id: JOS.22.25
reference: Joshua 22:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
  footnotes:
  - marker: a
    text: Or 'You have no portion in the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 우리와 여러분, 곧 르우벤 자손과 갓 자손 사이에 요단을 경계로 정하셨습니다. 여러분은 야훼 안에서 몫이 없습니다. 그래서 여러분의 자손이 우리 자손이 야훼를 두려워하지 않게 할지도 모릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  english_pob_choice: has made a boundary
  chosen_korean: 경계로 두셨습니다
  alternatives_korean:
  - 경계로 삼으셨습니다
  - 경계로 정하셨습니다
  lexicon: HALOT
  rationale: גְבוּל은 단순한 지리적 ‘경계’를 뜻하며, נָתַן은 이 결합에서 ‘두다/정하다’의 의미로 자연스럽게 읽힙니다. ‘경계로 두셨습니다’가 원문의 분리 기능을 가장 직접적으로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문이 여호와를 뜻하는 고유한 언약 이름을 사용하므로, 관용적 칭호인 ‘주’로 바꾸지 않고 프로젝트 기본어인 ‘야훼’를 유지했습니다.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  english_pob_choice: sons of Reuben and sons of Gad
  chosen_korean: 르우벤 자손과 갓 자손
  alternatives_korean:
  - 르우벤의 아들들과 갓의 아들들
  - 르우벤 사람들과 갓 사람들
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of’는 지파 소속을 가리키는 공식적 표현이므로, 한국어에서도 성경적 관용을 유지하되 과도하게 설명적이지 않은 ‘자손’으로 옮겼습니다.
- source_word: חֵלֶק
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 부분
  - 몫이
  lexicon: HALOT
  rationale: חֵלֶק은 여기서 언약적 참여 몫을 가리키므로, 예전식 ‘분깃’보다 현대 한국어에서 직접적이고 이해하기 쉬운 ‘몫’을 택했습니다.
- source_word: לְבִלְתִּי יְרֹא
  english_pob_choice: to stop fearing
  chosen_korean: 두려워하는 것을 그치게 할지도 모릅니다
  alternatives_korean:
  - 야훼를 두려워하는 일을 멈추게 할지도 모릅니다
  - 야훼를 경외하는 것을 그만두게 할지도 모릅니다
  lexicon: HALOT
  rationale: לְבִלְתִּי + ירא는 ‘~하지 않도록/그치게 하다’의 결과를 나타내므로, 단순한 상태 묘사보다 유발 결과를 드러내는 동사구로 옮겼습니다.
theological_decisions:
- issue: יְרֹא אֶת יְהוָה의 감정/경외 뉘앙스
  chosen_reading: ‘야훼를 두려워하는 것’
  alternative_readings:
  - ‘야훼를 경외하는 것’
  - ‘야훼를 섬기는 것’
  rationale: ירא는 하나님 앞에서의 경외를 포함하지만, 본문은 자손들이 그 태도를 ‘그치게’ 할 위험을 말하므로, 의미를 약화하지 않는 직역형 ‘두려워하는 것’을 본문에 두었습니다.
  doctrine_reference: 경외와 두려움의 중첩을 보존하는 본문 의미 원칙
