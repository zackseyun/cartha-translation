  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'your fellow Israelites'; the Hebrew says 'your brothers,' a masculine plural kinship term that can refer broadly to members of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러 날 동안 오늘까지도 당신들은 당신들의 형제들을 저버리지 않았고, 야훼 당신들의 하나님의 명령의 책임을 지켜 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신들의 동료 이스라엘 사람들'. 히브리어는 남성 복수형 '형제들'을 사용하며, 이스라엘 공동체 구성원을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  english_pob_choice: have not forsaken
  chosen_korean: 저버리지 않았고
  alternatives_korean:
  - 버리지 않았고
  - 떠나지 않았고
  - 등한시하지 않았고
  lexicon: HALOT
  rationale: עזב는 단순한 물리적 '떠남'보다 관계적·언약적 '저버림'의 뉘앙스를 지닙니다. 문맥상 여호수아의 칭찬이므로 '저버리지 않았고'가 무게를 잘 살립니다.
- source_word: אֲחֵיכֶם
  english_pob_choice: your brothers
  chosen_korean: 당신들의 형제들
  alternatives_korean:
  - 당신들의 형제자매들
  - 당신들의 동족 이스라엘 사람들
  - 당신들의 친족들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형 '형제들'이며, 이스라엘 공동체 전체를 가리킬 수 있습니다. 본문은 성중립화하지 않고 원문의 형제 용법을 유지하되, 한국어에서는 자연스럽게 '당신들의 형제들'로 옮겼습니다.
- source_word: זֶה יָמִים רַבִּים / עַד הַיּוֹם הַזֶּה
  english_pob_choice: these many days / up to this day
  chosen_korean: 여러 날 동안 오늘까지도
  alternatives_korean:
  - 오랜 날 동안 오늘까지도
  - 이 여러 날 동안 오늘까지도
  - 오랫동안 오늘까지도
  lexicon: HALOT
  rationale: 두 시간 표현을 합쳐, 히브리어의 지속성과 현재까지 이어짐을 간결하게 드러냈습니다. '여러 날 동안 오늘까지도'는 원문의 관용과 현대 한국어의 가독성을 함께 살립니다.
- source_word: מִשְׁמֶרֶת מִצְוַת
  english_pob_choice: the charge of the commandment
  chosen_korean: 명령의 책임
  alternatives_korean:
  - 명령의 직무
  - 명령의 맡겨진 책임
  - 명령의 의무
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순한 의무보다 '맡겨져 지켜야 할 책임/직무'에 가깝습니다. 한국어에서는 '책임'이 그 보관·수행의 부담을 가장 자연스럽게 전달하므로, '명령의 책임'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와 이름 יְהוָה는 본문 차원의 고유명사로서 '야훼'를 사용합니다. 이는 호칭 대체가 아니라 신적 이름 자체를 보존하려는 번역 원칙에 따른 것입니다.
theological_decisions:
- issue: 이스라엘 공동체를 지칭하는 남성 복수 kinship term의 처리
  chosen_reading: 당신들의 형제들
  alternative_readings:
  - 당신들의 형제자매들
  - 당신들의 동족 이스라엘 사람들
  rationale: 원문은 남성 복수의 친족어를 사용하며, 공동체 전체를 가리킬 수 있습니다. 본문은 성중립적 확대보다 원문의 언약적·혈연적 호칭을 보존하는 쪽이 더 직접적이므로 '형제들'을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
