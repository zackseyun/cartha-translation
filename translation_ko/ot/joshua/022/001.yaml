  text: Then Joshua called the Reubenites, the Gadites, and the half-tribe of Manasseh,
translation:
  language: ko
  text: 그때 여호수아가 르우벤 사람들과 갓 사람들과 므낫세 반 지파를 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그러자
  lexicon: HALOT
  rationale: 서사 전개를 잇는 시간 부사로서 자연스러운 현대 한국어 표현인 ‘그때’를 택해 사건의 순서를 분명히 했습니다.
- source_word: יִקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: 여호수아가 이들을 자기 앞으로 부르는 단순한 행위를 나타내므로, 과도하게 공적·명령적 뉘앙스를 더하지 않는 ‘불렀습니다’가 적절합니다.
- source_word: לָרֽאוּבֵנִי
  english_pob_choice: the Reubenites
  chosen_korean: 르우벤 사람들
  alternatives_korean:
  - 르우벤 지파
  - 르우벤인들
  lexicon: HALOT
  rationale: 지파를 가리키는 집합적 민족형 형용사를 한국어로는 자연스럽게 ‘사람들’로 옮겨 집단 지칭을 살렸습니다.
- source_word: וְלַגָּדִי
  english_pob_choice: the Gadites
  chosen_korean: 갓 사람들
  alternatives_korean:
  - 갓 지파
  - 갓인들
  lexicon: HALOT
  rationale: 앞 구절과 동일하게 집합적 지파 명칭이므로, 병렬성을 유지하는 ‘갓 사람들’이 가장 자연스럽습니다.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  english_pob_choice: the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세 지파의 절반
  - 므낫세의 반 지파
  lexicon: HALOT
  rationale: מַטֶּה가 지파 단위를 가리키므로, 한국어에서는 관용적으로 통하는 ‘반 지파’로 옮겨 원문의 행정적·족속적 구분을 유지했습니다.
