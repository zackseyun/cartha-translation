review_pass:
  verdict: revise
  source_fidelity: 원문의 수사 의문은 ‘브올의 죄악이 우리에게 너무 작은 일인가’에 걸립니다. 뒤의 וַיְהִי הַנֶּגֶף는 과거의 재앙을 상기시키는 서술절로 옮기는 것이 안전합니다. 또한 מִמֶּנּוּ는 ‘그로 말미암아’(원인)보다 ‘그 죄악에서’(분리·정결의 대상)가 충실합니다.
  naturalness: ‘너무 적었습니까’는 추상명사 ‘죄악’과 결합할 때 다소 직역적입니다. ‘너무 작은 일입니까?’가 현대 표준어에서 수사적 질책의 뜻을 자연스럽게 드러냅니다. ‘회중에 전염병이 일어났습니다’도 자연스럽고 원문의 재앙 발생을 보존합니다.
  terminology: פְּעוֹר는 한국어 성경 표기에 맞춰 ‘브올’로, ‘Baal-peor’는 ‘바알브올’로 표기했습니다. עֵדָה는 ‘회중’, יהוה는 프로젝트 방침에 따라 ‘야훼’를 유지했습니다. עָוֹן의 의미 범위는 각주에서 ‘죄악/죄책/그 결과’로 보존했습니다.
  issues:
