revisions:
- from: Peor의 죄악이 우리에게는 너무 적었습니까[a], 그로 말미암아 우리가 오늘날까지도 스스로 정결하게 하지 못하였는데[b], 야훼의 회중 위에 전염병이 임하였습니까?
  to: 브올[b]의 죄악이 우리에게 너무 작은 일입니까[a]? 우리는 오늘날까지도 그 죄악에서 정결하게 되지 못하였고, 야훼의 회중에 전염병이 일어났습니다.
  rationale: 원문의 문법적 관계를 따라 정결의 대상을 ‘그 죄악에서’로 바로 잡고, 문두 수사 의문과 뒤따르는 과거 서술을 한국어에서 분명히 구분했습니다. 통용 한국어 성경 인명 표기와 각주 앵커 위치도 정리했습니다. ‘전염병’은 נֶגֶף의 문맥상 의미를 유지하며, 원문에 없는 대조 표현은 추가하지 않았습니다.
