    issue: ‘그로 말미암아’
    rationale: 히브리어 מִמֶּנּוּ는 여기서 정결해져야 할 대상으로부터의 분리를 나타냅니다. 원인 관계로 한정하는 ‘그로 말미암아’는 의미를 바꿉니다.
  - severity: medium
    issue: 마지막 절을 의문문으로 처리함
    rationale: 수사 의문 표지는 문두의 הַמְעַט에 있으며, ‘전염병이 있었다’는 절은 브올 사건의 결과를 상기시키는 서술로 처리하는 편이 히브리어 구문에 충실합니다.
  - severity: low
    issue: 이름의 한국어 표기 및 각주 위치
    rationale: 한국어 본문에서는 ‘Peor’보다 통용 표기 ‘브올’이 자연스럽습니다. ‘히브리어는 단순히 브올’이라는 각주는 해당 이름 바로 뒤에 붙이는 것이 앵커의 지시 대상이 명확합니다.
