source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
  footnotes:
  - marker: a
    text: Or 'Was the guilt of Peor too little for us?' The Hebrew עָוֹן can mean 'iniquity,' 'guilt,' or by extension the consequence of guilt.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Peor'; compare the fuller expression 'Baal-peor' in related passages.
    reason: cross_reference
translation:
  language: ko
  text: 브올[b]의 죄악이 우리에게 너무 작은 일입니까[a]? 우리는 오늘날까지도 그 죄악에서 정결하게 되지 못하였고, 야훼의 회중에 전염병이 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘브올의 죄책이 우리에게 너무 작은 일입니까?’ 히브리어 עָוֹן은 ‘죄악’, ‘죄책’, 나아가 그 결과를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘브올’이라고 되어 있습니다. 관련 본문에는 더 완전한 표현인 ‘바알브올’이 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  english_pob_choice: Was ... too little for us
  chosen_korean: 우리에게는 너무 적었습니까
  alternatives_korean:
  - 우리에게는 충분하지 않았습니까
  - 우리에게는 하찮았습니까
  lexicon: HALOT
  rationale: 수사 의문문의 압박감을 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘너무 적었습니까’로 옮겼습니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 죄책
  - 죄
  - 악행
  lexicon: HALOT
  rationale: 문맥상 Peor 사건의 도덕적·언약적 오염을 가리키므로, 단순한 ‘죄’보다 무게가 있는 ‘죄악’이 source의 중량감을 더 잘 살립니다.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  english_pob_choice: from which we have not cleansed ourselves
  chosen_korean: 그로 말미암아 우리가 … 스스로 정결하게 하지 못하였는데
  alternatives_korean:
  - 그것에서 우리가 정결해지지 못하였는데
  - 그것으로부터 우리가 자신을 깨끗하게 하지 못하였는데
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 뉘앙스를 살려 ‘스스로 정결하게 하지 못하였는데’로 옮겼습니다.
- source_word: בַּעֲדַת יְהוָה
  english_pob_choice: upon the congregation of Yahweh
  chosen_korean: 야훼의 회중 위에
  alternatives_korean:
  - 야훼의 회중에
  - 야훼의 공동체 위에
  lexicon: HALOT
  rationale: עֵדָה의 집합적 의미를 살려 ‘회중’으로 옮기고, 재앙이 ‘위에’ 임하는 형식을 따라 전염병이 공동체 위에 덮친다는 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 언약명칭인 YHWH를 직접 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 옮겨 언약 이름의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
