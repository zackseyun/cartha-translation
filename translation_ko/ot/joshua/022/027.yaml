base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: ko
  text: 아니라 우리와 너희 사이의 증표이며, 우리 뒤의 세대들과 너희 뒤의 세대들 사이의 증표로서, 우리가 그의 앞에서 여호와의 일을 우리의 번제와 제물과 화목제물로 섬기게 하려는 것입니다. 그러면 너희 자녀가 훗날 우리 자녀에게 ‘너희는 여호와와 관련된 몫이 없다’고 말하지 못할 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: עֵד
  english_pob_choice: it is a witness
  chosen_korean: 증표
  alternatives_korean:
  - 증인
  - 증거
  - 표징
  lexicon: עֵד
  rationale: 문맥상 사람 ‘증인’이 아니라 두 집단 사이의 관계를 보증하는 표지이므로, ‘증표’로 옮겨 증언-기능을 살리되 문장 자연성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: יהוה
  rationale: 이 절의 영어 POB가 LORD로 환원했지만, 한국어 본문에서는 기존 POB 관례에 따라 여호와를 사용해 고유신명 표지를 보존했습니다.
- source_word: עֲבֹדַת יְהוָה
  english_pob_choice: the service of the LORD
  chosen_korean: 여호와의 일
  alternatives_korean:
  - 여호와의 봉사
  - 여호와 섬김
  - 여호와께 드리는 예배
  lexicon: עבד
  rationale: 제사 행위(번제, 제물, 화목제물)와 함께 나오는 ‘섬김/봉사’의 의미를 살리되, 한국어에서 너무 교회적이거나 추상적인 ‘예배’보다 원문에 가까운 ‘일’로 옮겼습니다.
- source_word: חֵלֶק
  english_pob_choice: share
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 공유분
  - 참여
  lexicon: חלק
  rationale: ‘여호와 안에 몫이 없다’는 소유·분배의 부재를 나타내므로, 관용적으로 이해되기 쉬운 ‘몫’을 택했습니다.
theological_decisions:
- issue: יהוה를 한국어 본문에서 어떻게 표기할지
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 문맥은 제사와 언약적 소속을 분명히 드러내므로, 신명 고유표지로 읽히는 번역을 유지하는 편이 독자가 원문의 언약성을 즉시 이해하는 데 유리합니다.
  doctrine_reference: 언약 명칭의 일관성 및 고유신명 보존
