id: JOS.22.33
reference: Joshua 22:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'praised God.' The Hebrew verb is literally 'blessed.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'did not say to go up against them for war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 말이 이스라엘 자손들의 눈에 좋게 여겨졌고, 이스라엘 자손들은 하나님을 찬송하며, 그들에게 맞서 전쟁하러 올라가 그 땅을 멸하자고 말하지 않았습니다. 그 땅에는 르우벤 자손과 갓 자손이 거주하고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손들’은 히브리어의 직역입니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사 ‘복을 빌다/송축하다’는 여기서 하나님을 찬송한다는 뜻으로 이해할 수 있습니다.
    reason: theological_note
  - marker: c
    text: 직역하면 ‘그들에게 맞서 전쟁하러 올라가자고 말하지 않았다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  english_pob_choice: the matter was good in the eyes of
  chosen_korean: 그 말이 … 눈에 좋게 여겨졌고
  alternatives_korean:
  - 그 일이 … 보기에 좋았고
  - 그 말이 … 마음에 들었고
  lexicon: HALOT
  rationale: בְּעֵינֵי의 평가 관용구를 살리면서도 한국어로는 ‘좋게 여겨지다’가 가장 자연스럽고 원문의 판단 의미를 잘 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 유지하면서도 한국어에서 가장 익숙하고 직역에 가까운 표현으로 옮겼습니다.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  english_pob_choice: blessed God
  chosen_korean: 하나님을 찬송하며
  alternatives_korean:
  - 하나님을 복되게 하며
  - 하나님을 축복하며
  lexicon: HALOT
  rationale: 하나님이 목적어일 때 ברך는 ‘찬송하다/송축하다’의 의미가 자연스러워, 예배적 뉘앙스를 살리되 한국어에서 어색한 ‘하나님을 축복하다’는 피했습니다.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  english_pob_choice: going up against them in war
  chosen_korean: 그들에게 맞서 전쟁하러 올라가
  alternatives_korean:
  - 그들에게 맞서 싸우러 올라가
  - 전쟁으로 그들을 치러 올라가
  lexicon: HALOT
  rationale: עלה על의 군사적 관용구를 ‘올라가’로 살리고, לַצָּבָא의 전쟁 의미를 자연스럽게 연결했습니다.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  english_pob_choice: to destroy the land
  chosen_korean: 그 땅을 멸하자고
  alternatives_korean:
  - 그 땅을 파괴하자고
  - 그 땅을 없애자고
  lexicon: HALOT
  rationale: שׁחת는 단순한 훼손보다 더 강한 파멸·멸망의 뜻이 있어 ‘멸하다’가 가장 적절합니다.
- source_word: יֹשְׁבִים בָּהּ
  english_pob_choice: were living
  chosen_korean: 거주하고 있었습니다
  alternatives_korean:
  - 살고 있었습니다
  - 거하고 있었습니다
  lexicon: HALOT
  rationale: ישב의 지속적 거주 의미를 반영하면서도 현대 문어체에서 자연스러운 ‘거주하다’를 선택했습니다.
theological_decisions:
- issue: וַיְבָרֲכוּ אֱלֹהִים의 방향성
  chosen_reading: 이스라엘 자손들이 하나님을 찬송한 것으로 옮겼습니다.
  alternative_readings:
  - 하나님을 축복했다고 옮길 수 있음
  - 하나님께 복을 빌었다고 볼 수도 있음
  rationale: 히브리어 ברך가 하나님을 목적어로 둘 때는 인간이 하나님께 복을 ‘주는’ 뜻이 아니라 하나님을 찬양·송축하는 표현이므로, 예배적 의미를 오해 없이 드러내는 번역이 필요합니다.
  doctrine_reference: 시편 103:1, 욥기 1:21의 ברך 용례
- issue: 전쟁 의도 부정의 서술
  chosen_reading: ‘그들에게 맞서 전쟁하러 올라가’는 계획 자체를 말하지 않았다는 뜻으로 처리했습니다.
  alternative_readings:
  - 단순히 ‘공격하지 않았다’로 축약 가능
  - ‘전쟁을 말하지 않았다’로도 옮길 수 있음
  rationale: 본문은 행위 자체보다 의논/발의의 부정과 그 결과로서의 자제에 초점이 있어, 원문의 신중한 표현을 유지했습니다.
  doctrine_reference: 수 22장 전체의 화해와 오해 해소 맥락
