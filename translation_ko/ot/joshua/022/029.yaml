source:
  edition: WLC
  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
  footnotes:
  - marker: a
    text: Or 'turn back today from following the LORD.' The Hebrew idiom literally speaks of turning from after the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 야훼께 반역하고 오늘 야훼를 따르는 데서 돌아서서, 그의 장막 앞에 있는 우리 하나님 야훼의 제단 외에 번제나 소제나 희생 제사를 위한 제단을 세우는 일은 우리에게 결코 있을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼를 따르는 데서 돌아서서’는 직역하면 ‘야훼의 뒤에서 돌아서서’라는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  english_pob_choice: Far be it from us
  chosen_korean: 그것은 우리가 … 해서는 안 됩니다
  alternatives_korean:
  - 우리가 그렇게 해서는 결코 안 됩니다
  - 그런 일은 우리에게 있을 수 없습니다
  lexicon: HALOT
  rationale: 강한 거부와 혐오의 관용구를 한국어로 자연스럽게 옮기되, 단순한 가능성 부정보다 윤리적·언약적 금지를 드러냈습니다.
- source_word: לִמְרֹד בַּיהוָה
  english_pob_choice: that we should rebel against Yahweh
  chosen_korean: 야훼께 반역하고
  alternatives_korean:
  - 야훼를 거역하고
  - 야훼께 반기를 들고
  lexicon: HALOT
  rationale: מרד는 단순 불복종보다 언약 파기를 포함하는 반역의 뉘앙스가 강하므로 ‘반역하다’를 택했습니다.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  english_pob_choice: and turn away today from following Yahweh
  chosen_korean: 오늘 야훼를 따라가던 길을 떠나
  alternatives_korean:
  - 오늘 야훼 뒤에서 돌아서
  - 오늘 야훼를 따르던 데서 돌아서
  lexicon: HALOT
  rationale: ‘뒤에서 떠나다’라는 히브리어 관용을 직역하기보다, POB의 해석을 따라 관계적·언약적 의미가 분명한 ‘따라가던 길을 떠나’로 옮겼습니다.
- source_word: לִבְנוֹת מִזְבֵּחַ לְעֹלָה לְמִנְחָה וּלְזָבַח
  english_pob_choice: by building an altar for burnt offering, grain offering, or sacrifice
  chosen_korean: 번제와 소제와 희생제를 드리는 제단을 쌓는 일
  alternatives_korean:
  - 번제와 곡식 제물과 제사를 위한 제단을 세우는 일
  - 번제와 소제와 제사를 위해 제단을 만드는 일
  lexicon: HALOT
  rationale: 희생 유형을 한국어 성경에서 통용되는 제사 용어로 살리되, מִזְבֵּחַ의 기능을 ‘드리는 제단’으로 풀어 의미를 분명히 했습니다.
- source_word: מִלְּבַד מִזְבַּח יְהוָה אֱלֹהֵינוּ אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  english_pob_choice: besides the altar of Yahweh our God that is before his tabernacle
  chosen_korean: 우리 하나님 야훼의 제단 — 곧 그의 장막 앞에 있는 제단 — 외에
  alternatives_korean:
  - 우리 하나님 야훼의 제단, 그의 장막 앞에 있는 그 제단 말고
  - 우리 하나님 야훼의 제단 외에
  lexicon: HALOT
  rationale: ‘외에’로 배타성을 살리고, מִשְׁכָּן은 문맥상 ‘장막’으로 옮겨 성소 앞의 정당한 제단이라는 대비를 분명히 했습니다.
theological_decisions:
- issue: YHWH의 표기와 언약명 보존
  chosen_reading: 본문의 יְהוָה를 일관되게 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 원칙에 따라 신명(神名) 자체를 드러내어, 언약적 대조(야훼께 반역 / 야훼를 따름 / 야훼의 제단)를 한국어에서도 보이게 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 간접화법 속 강한 부정의 문체
  chosen_reading: ‘Far be it from us’의 거절을 합쇼체의 강한 금지로 옮겨, 서술 전체가 공동체의 결연한 부인을 드러내게 했습니다.
  alternative_readings:
  - ‘그럴 리가 없습니다’로 약화
  - 중립적 사실 서술
  rationale: 이 절은 단순 설명이 아니라 언약 위반 가능성을 부정하는 맹세적 진술이므로, 현대 한국어에서 자연스러운 경계 표현으로 그 힘을 유지했습니다.
  doctrine_reference: Joshua 22:29의 공동체적 신실성/배교 거부
