- from: 그것은 우리가 야훼께 반역하고 오늘 야훼를 따라가던 길을 떠나, 번제와 소제와 희생제를 드리는 제단을 쌓는 일이 되어서는 안 됩니다. 그것은 우리 하나님 야훼의 제단 — 곧 그의 장막 앞에 있는 제단 — 외에 다른 제단을 세우는 일이기 때문입니다.[a]
  to: 우리가 야훼께 반역하고 오늘 야훼를 따르는 데서 돌아서서, 그의 장막 앞에 있는 우리 하나님 야훼의 제단 외에 번제나 소제나 희생 제사를 위한 제단을 세우는 일은 우리에게 결코 있을 수 없습니다.[a]
  rationale: 강한 공동체적 배격을 ‘우리에게 결코 있을 수 없습니다’로 옮기고, 제단 건립이 반역과 야훼를 따름에서 돌아섬을 드러내는 방식이라는 원문의 연결을 한 문장 안에서 보존했습니다. ‘외에’가 정당한 제단과 별도의 제단을 세우는 것을 수식하도록 어순을 조정했으며, 각 제의 용어와 신명은 유지했습니다.
