  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
  footnotes:
  - marker: a
    text: Or, 'and reported the matter to them.' The Hebrew דָּבָר can mean 'word,' 'matter,' or 'report' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the sons of Israel'; that is, to the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘르아살의 아들 제사장 비느하스와 지도자들은 르우벤 자손과 갓 자손에게서, 길르앗 땅에서 가나안 땅으로, 이스라엘 자손에게 돌아와 그들에게 말을 전했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 문맥에 따라 ‘말’, ‘일’, ‘보고’가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  english_pob_choice: Phinehas son of Eleazar the priest
  chosen_korean: 엘르아살의 아들 제사장 비느하스
  alternatives_korean:
  - 제사장 엘르아살의 아들 비느하스
  - 엘르아살의 아들인 제사장 비느하스
  lexicon: WLC proper noun + apposition
  rationale: 히브리어의 친족관계와 직분 표지를 자연스럽게 살리기 위해 ‘엘르아살의 아들’과 ‘제사장’을 함께 유지했습니다.
- source_word: וְהַנְּשִׂיאִים
  english_pob_choice: and the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 우두머리들
  - 족장들
  - 지도자들과
  lexicon: HALOT
  rationale: נשיאים는 이 문맥에서 부족 대표들을 가리키므로, 현대 한국어에서 가장 분명한 ‘지도자들’로 옮겼습니다.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  english_pob_choice: from the sons of Reuben and from the sons of Gad
  chosen_korean: 르우벤 자손과 갓 자손에게서
  alternatives_korean:
  - 르우벤 사람들과 갓 사람들에게서
  - 르우벤의 자손들과 갓의 자손들에게서
  lexicon: HALOT
  rationale: ‘בני + 지명/인명’의 집단 지칭을 그대로 살리되, 한국어에서는 ‘자손’이 가장 직접적으로 대응합니다.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  english_pob_choice: and brought back word to them
  chosen_korean: 그들에게 말을 전했습니다
  alternatives_korean:
  - 그들에게 보고를 전했습니다
  - 그들에게 소식을 전했습니다
  - 그들에게 그 일을 전했습니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단일 ‘말’이 아니라 보고/전달된 메시지를 뜻하므로, 직역의 딱딱함을 피하면서도 전달 행위를 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 회귀 동사와 전달 동사의 이중 움직임
  chosen_reading: ‘돌아와’와 ‘말을 전했습니다’로 두 동작을 분리해 번역했습니다.
  alternative_readings:
  - ‘돌아와 그들에게 보고했습니다’
  - ‘되돌아가 그들에게 말씀했습니다’
  rationale: 히브리어는 שוב(돌아오다)와 דָּבָר(말/보고)를 함께 써서 실제 귀환과 공식 보고를 모두 보여 주므로, 둘을 분리해야 서술의 긴장이 보존됩니다.
  doctrine_reference: 본문 서술의 사실성과 절차성 보존
