id: JOS.22.18
reference: Joshua 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
  footnotes:
  - marker: a
    text: Or 'turn back today from following the LORD.' The Hebrew verb can mean 'turn back' or 'turn away'; in this context it carries the sense of turning away in disloyalty.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from after the LORD,' a Hebrew idiom meaning to stop following him.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew simply says 'he will be angry'; the implied subject is the LORD from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 너희가 야훼를 따라가는 데서 돌아서고, 또 오늘 야훼를 거슬러 반역한다면, 내일은 이스라엘 온 회중에게 진노하실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘뒤에서/따라서’라는 관용구는 여기서 야훼를 따르기를 그만두는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘반역한다’는 동사는 히브리어 동사의 강한 정치·언약적 배반 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단지 ‘진노한다’라고 말하지만, 문맥상 주어는 야훼입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֻׁבוּ מֵאַחֲרֵי יְהוָה
  english_pob_choice: are turning away today from following Yahweh
  chosen_korean: 오늘 너희가 야훼를 따라가는 데서 돌아서고
  alternatives_korean:
  - 오늘 너희가 야훼를 따르는 데서 돌아서고
  - 오늘 너희가 야훼를 따라가던 길에서 돌아서고
  lexicon: HALOT
  rationale: שוב과 ‘뒤를 따르다’는 관용구를 함께 살려, 단순한 방향 전환이 아니라 충성의 이탈이라는 뜻을 자연스럽게 옮겼습니다.
- source_word: תִּמְרְדוּ בַּיהוָה
  english_pob_choice: rebel today against Yahweh
  chosen_korean: 야훼를 거슬러 반역한다면
  alternatives_korean:
  - 야훼께 반역한다면
  - 야훼를 대적하여 반역한다면
  lexicon: HALOT
  rationale: מרד의 핵심인 ‘반역’은 유지하되, 한국어에서 더 자연스러운 대상을 드러내기 위해 ‘거슬러’를 덧붙였습니다.
- source_word: יִקְצֹף
  english_pob_choice: he will be angry
  chosen_korean: 진노하실 것입니다
  alternatives_korean:
  - 노하실 것입니다
  - 화를 내실 것입니다
  lexicon: HALOT
  rationale: 문맥상 야훼의 언약적 분노를 가리키므로, 일상적 ‘화’보다 더 강한 ‘진노’가 원문의 무게를 잘 반영합니다.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  english_pob_choice: the whole congregation of Israel
  chosen_korean: 이스라엘 온 회중
  alternatives_korean:
  - 이스라엘의 온 회중
  - 이스라엘의 모든 회중
  lexicon: HALOT
  rationale: עֲדָה의 집합적·언약 공동체적 의미를 살려 ‘회중’으로 옮기고, 전체성을 ‘온’으로 간결하게 표현했습니다.
theological_decisions:
- issue: יִקְצֹף의 주어가 생략됨
  chosen_reading: 주어는 문맥상 야훼로 이해하여 ‘진노하실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘그가 진노할 것입니다’처럼 대명사로 남김
  - ‘진노가 임할 것입니다’처럼 무주어로 처리
  rationale: 앞절의 야훼에 대한 이탈과 반역을 이어 받는 경고이므로, 암시된 주어를 드러내는 편이 문맥과 신학적 긴장을 가장 분명하게 전달합니다.
  doctrine_reference: 언약적 책임과 공동체적 연대
- issue: ‘야훼를 따라가는 데서 돌아서고’의 의미
  chosen_reading: 단순한 회전이 아니라 언약적 충성에서의 이탈로 이해했습니다.
  alternative_readings:
  - 물리적 방향 전환
  - 중립적인 ‘되돌아감’
  rationale: ‘뒤를 따르다’라는 히브리 관용구는 관계적 충성을 전제하므로, 본문이 경고하는 배교적 뉘앙스를 유지해야 합니다.
  doctrine_reference: 언약 충성 / 배교 경고
