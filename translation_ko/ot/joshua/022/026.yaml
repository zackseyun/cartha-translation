  text: וַ/נֹּ֕אמֶר נַעֲשֶׂה נָּ֣א לָ֔/נוּ לִ/בְנ֖וֹת אֶת הַ/מִּזְבֵּ֑חַ לֹ֥א לְ/עוֹלָ֖ה וְ/לֹ֥א לְ/זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
  footnotes:
  - marker: a
    text: Or, 'Then we said' or 'And we said.' The Hebrew conjunction can be rendered in several natural ways depending on how tightly the statement is linked to the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Let us make for ourselves, to build the altar'—an idiom meaning 'Let us build for ourselves the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 우리는 이렇게 말했습니다. ‘이제 우리를 위하여 제단을 세우자—번제용도 아니고 제사용도 아니고.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세우자’는 히브리어의 ‘만들자 … 짓자’라는 관용적 결합을 한국어에서 자연스럽게 풀어쓴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  english_pob_choice: So we said
  chosen_korean: 그래서 우리는 이렇게 말했습니다
  alternatives_korean:
  - 그리고 우리는 말했습니다
  - 그러자 우리는 말했습니다
  lexicon: WLC
  rationale: 와우-연결의 서술 전개를 자연스럽게 살리면서, 앞 문맥에 대한 응답·결론의 뉘앙스를 ‘그래서’로 반영했습니다.
- source_word: נַעֲשֶׂה ... לִבְנוֹת
  english_pob_choice: Let us now build
  chosen_korean: 이제 ... 세우자
  alternatives_korean:
  - 이제 ... 만들자
  - 우리 손으로 ... 짓자
  lexicon: WLC
  rationale: עשה와 ‘to build’의 관용적 결합을 한국어에서는 중복 없이 ‘세우다’로 옮기는 편이 자연스럽고, 제단이라는 대상에도 잘 맞습니다.
- source_word: לָנוּ
  english_pob_choice: for ourselves
  chosen_korean: 우리를 위하여
  alternatives_korean:
  - 우리 자신을 위해
  - 우리에게
  lexicon: WLC
  rationale: 수혜·귀속의 의미를 살리되, 한국어에서는 ‘우리를 위하여’가 본문 흐름을 가장 간결하게 드러냅니다.
- source_word: לֹא לְעוֹלָה וְלֹא לְזָבַח
  english_pob_choice: not for burnt offering and not for sacrifice
  chosen_korean: 번제용도 아니고 제사용도 아니고
  alternatives_korean:
  - 번제를 위한 것도 아니고 제물로 드릴 것도 아니고
  - 번제도 아니고 희생제사도 아니고
  lexicon: WLC
  rationale: עולה는 제사의 종류로서 ‘번제’가 표준적이며, זבח는 일반적 제사/희생을 가리키므로 ‘제사’로 옮겨 둘의 대비를 유지했습니다.
theological_decisions:
- issue: 제단의 용도 부정
  chosen_reading: 본문은 제단의 존재 자체를 부정하지 않고, 번제와 제사의 제의적 사용만 부정합니다.
  alternative_readings:
  - 제단 자체를 불법적 예배의 상징으로 넓게 이해하는 읽기
  - 분열적 제단으로 해석하는 전통적 해석
  rationale: 히브리어는 목적어가 아니라 용도 표지를 통해 두 가지 제의 행위를 명시적으로 배제하므로, 본문 수준에서는 기능 제한으로 번역하는 것이 가장 정확합니다.
  doctrine_reference: 문맥적 주해 원칙
