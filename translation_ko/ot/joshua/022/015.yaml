  source_fidelity: 히브리어는 그들이 르우벤 자손, 갓 자손, 그리고 므낫세 반 지파가 있는 길르앗 땅에 이르러 그들에게 말한 일을 서술합니다. 초안의 ‘그들과 말하며, 말했습니다’는 וַיְדַבְּרוּ אִתָּם לֵאמֹר의 직접화법 도입을 중복되고 부자연스럽게 처리합니다.
