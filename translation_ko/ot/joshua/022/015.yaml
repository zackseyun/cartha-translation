  - 도착했습니다
  lexicon: BDB
  rationale: 이동 동사의 결과를 자연스럽게 살리면서도, 다음 절의 대면 장면으로 이어지는 서술 흐름에 맞게 간결하게 처리했습니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
