  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
  footnotes:
  - marker: a
    text: Or "to the land of Gilead." The Hebrew preposition can be read directionally, but here it likely functions to locate where they came to the eastern tribes.
    reason: lexical_alternative
  - marker: b
    text: Or "they spoke to them."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 길르앗 땅에 있는 르우벤 자손과 갓 자손과 므낫세 반 지파에게 가서, 그들에게 이렇게 말했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들과 이야기했습니다.” 히브리어는 직역하면 “그들과 말하였다”이며, 이어지는 직접화법을 도입합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: they came
  chosen_korean: 이르러
  alternatives_korean:
