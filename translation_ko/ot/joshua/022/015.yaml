  rationale: ‘반 지파’는 히브리어의 관용적 지파 명칭을 가장 간명하게 옮기며, ‘므낫세 반 지파’라는 정착된 한국어 표현과도 잘 맞습니다.
- source_word: וַיְדַבְּרוּ אִתָּם
