  chosen_korean: 그들과 말하며
  alternatives_korean:
  - 그들에게 말하며
  - 그들과 이야기하며
  lexicon: BDB
  rationale: אִתָּם의 동반·대면 뉘앙스를 살려 ‘그들과’로 옮겼고, 다음 절로 이어지는 직접화법 도입을 자연스럽게 만들기 위해 ‘말하며’로 처리했습니다.
