source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
  footnotes:
  - marker: a
    text: Or 'the instruction' for 'the law' (Hebrew torah).
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 매우 조심하여 모세—야훼의 종—가 여러분에게 명령한 이 계명과 율법을 행하십시오. 곧 여러분의 하나님 야훼를 사랑하고, 그의 모든 길로 걸으며, 그의 계명들을 지키고, 그에게 매달리고, 온 마음과 온 영혼으로 그를 섬기는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’에 대해 ‘가르침’으로도 옮길 수 있습니다(히브리어 torah).
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק שִׁמְרוּ מְאֹד
  english_pob_choice: Only be very careful
  chosen_korean: 다만 매우 조심하여
  alternatives_korean:
  - 오직 매우 주의하여
  - 반드시 매우 조심해서
  lexicon: HALOT
  rationale: רַק의 제한·강조를 ‘다만’으로, שׁמר + מְאֹד의 관용적 경고를 ‘매우 조심하여’로 옮겨 원문의 긴박한 권고를 자연스럽게 살렸습니다.
- source_word: הַמִּצְוָה וְאֶת הַתּוֹרָה
  english_pob_choice: the commandment and the law
  chosen_korean: 이 계명과 율법
  alternatives_korean:
  - 이 명령과 가르침
  - 이 계명과 instruction
  lexicon: HALOT
  rationale: מִצְוָה는 단수성을 살려 ‘계명’으로, תּוֹרָה는 이 모세 언약 맥락에서 관용적·법적 의미를 살려 ‘율법’으로 번역했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 여호와의 종
  lexicon: HALOT
  rationale: 모세에 대한 존칭적 칭호로서 ‘종’이 가장 자연스럽고, 본문이 요구하는 인물 호칭의 무게를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명사 יְהוָה를 가리키므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  english_pob_choice: to walk in all his ways
  chosen_korean: 그의 모든 길로 걸으며
  alternatives_korean:
  - 그의 모든 길을 따라 살며
  - 그의 모든 길로 행하며
  lexicon: HALOT
  rationale: ‘걷다’라는 언약적 비유를 유지하면서 현대 한국어에서 자연스럽게 읽히도록 ‘그의 모든 길로 걸으며’로 옮겼습니다.
- source_word: וּלְדָבְקָה בּוֹ
  english_pob_choice: to cling to him
  chosen_korean: 그에게 매달리고
  alternatives_korean:
  - 그에게 붙들리고
  - 그에게 달라붙고
  lexicon: HALOT
  rationale: דבק의 강한 부착·결속 이미지를 살리기 위해, 관계의 긴밀함이 분명한 ‘매달리고’를 선택했습니다.
theological_decisions:
- issue: YHWH 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 번역본 전통적 대체칭호보다 원문 고유명사 자체를 드러내는 표기가 본문의 언약적 호칭을 더 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 언약적 윤리 비유의 보존
  chosen_reading: 그의 모든 길로 걸으며 / 그에게 매달리고 / 그를 섬기는 것입니다
  alternative_readings:
  - 그의 뜻을 따라 살며 / 그를 굳게 붙들고 / 그에게 예배하는 것입니다
  rationale: 히브리어의 연속적 부정사 구문이 요구하는 순종·의존·섬김의 흐름을 유지해, 해석을 지나치게 풀어내지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source-text plain sense; avoid paraphrase beyond what the source warrants'
