    rationale: בְּכָל־דְּרָכָיו의 ‘그의 모든 길로’는 히브리어의 관용적 윤리 비유입니다. 한국어에서는 ‘그의 모든 길을 따라 걸으며’가 의미를 보존하면서 자연스럽습니다.
