revisions:
- from: 다만 매우 조심하여 모세—야훼의 종—가 여러분에게 명령한 이 계명과 율법을 행하십시오. 곧 여러분의 하나님 야훼를 사랑하고, 그의 모든 길로 걸으며, 그의 계명들을 지키고, 그에게 매달리고, 온 마음과 온 영혼으로 그를 섬기는 것입니다.[a]
  to: 다만 야훼의 종 모세가 여러분에게 명령한 계명과 율법[a]을 행하는 일에 매우 주의하십시오. 곧 여러분의 하나님 야훼를 사랑하고, 그의 모든 길을 따라 걸으며, 그의 계명들을 지키고, 그에게 굳게 붙어, 온 마음과 온 영혼으로 그를 섬기십시오.
  rationale: 수정은 원문의 명령적 권면과 부정사 열거 구조를 한국어 합쇼체로 자연스럽게 재구성했습니다. ‘길을 따라 걷다’와 ‘그에게 굳게 붙다’는 각각 הלך와 דבק의 비유적 표현을 과도한 해석 없이 보존합니다. 율법의 어휘 대안 각주는 해당 낱말에 연결했습니다.
