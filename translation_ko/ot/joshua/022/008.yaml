  terminology: ‘청동’, ‘전리품’, ‘형제들’은 적절합니다. ‘천막’은 역사적 배경을 보존하는 자연스러운 현대어입니다. 기존 각주 a에는 한국어 문장 속에 부적절한 히브리어 ‘כאן’이 들어가 있으므로 삭제하거나 수정해야 하나, 본문 이해에 꼭 필요한 주석은 아닙니다.
