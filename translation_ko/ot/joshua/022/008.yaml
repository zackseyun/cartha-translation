id: JOS.22.8
reference: Joshua 22:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
  footnotes:
  - marker: a
    text: Or 'the spoil of your enemies.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' refers to their fellow Israelites in the other tribes.'
    reason: cultural_note
  - marker: c
    text: Or 'bronze' may be rendered 'copper.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “많은 재산과 아주 많은 가축과 은과 금과 청동과 철과 아주 많은 옷을 가지고 너희 천막으로 돌아가십시오. 너희 원수들의 전리품을 너희 형제들[b]과 나누십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘형제들’은 여기서 다른 지파에 속한 이스라엘 동족을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּנְכָסִים רַבִּים
  english_pob_choice: with great wealth
  chosen_korean: 큰 재물과
  alternatives_korean:
  - 많은 재산과
  - 풍성한 소유와
  lexicon: HALOT
  rationale: נְכָסִים는 단순한 현금이 아니라 재산·소유를 아우르므로, 앞의 목록과 구별되게 ‘큰 재물’로 넓게 옮겼습니다.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  english_pob_choice: Return to your tents
  chosen_korean: 너희 천막으로 돌아가십시오
  alternatives_korean:
  - 너희 장막으로 돌아가십시오
  - 너희 집으로 돌아가십시오
  lexicon: HALOT
  rationale: אָהֶל/אָהֳלֵי는 역사적 배경을 살리는 ‘천막’/‘장막’이 직역에 가깝고, ‘집’은 해석적이므로 피했습니다.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  english_pob_choice: with very much livestock
  chosen_korean: 매우 많은 가축과
  alternatives_korean:
  - 아주 많은 가축과
  - 풍부한 가축과
  lexicon: HALOT
  rationale: מִקְנֶה는 특정한 소만이 아니라 가축 전체를 가리키므로 ‘가축’으로 넓게 옮기고, מְאֹד의 강도를 ‘매우’로 반영했습니다.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  english_pob_choice: with bronze and iron
  chosen_korean: 청동과 철과
  alternatives_korean:
  - 구리와 철과
  - 놋과 철과
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 문맥상 금속 목록에서 ‘청동’이 자연스럽고, 한국 교회어의 전통적 ‘놋’보다 स्रोत의 물질성을 더 분명히 드러냅니다.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  english_pob_choice: and with very many garments
  chosen_korean: 매우 많은 옷을
  alternatives_korean:
  - 매우 많은 의복을
  - 아주 많은 겉옷을
  lexicon: HALOT
  rationale: שְׂלָמוֹת는 의복/겉옷 계열이지만, 현대 한국어에서는 포괄적인 ‘옷’이 가장 자연스럽고 목록의 마무리에도 잘 맞습니다.
- source_word: עִם אֲחֵי/כֶם
  english_pob_choice: with your brothers
  chosen_korean: 너희 형제들과
  alternatives_korean:
  - 너희 형제들과 자매들과
  - 너희 동족들과
  lexicon: HALOT
  rationale: 히브리어 복수 남성형 אָחִים를 그대로 살리되, 여기서는 이스라엘 동족을 가리키는 포괄적 친족 표현으로 ‘형제들’을 유지했습니다.
theological_decisions:
- issue: 이스라엘 지파 간의 ‘형제들’ 표현
  chosen_reading: ‘형제들’은 다른 지파의 동족 이스라엘을 가리키는 언약적 친족 표현으로 유지했습니다.
  alternative_readings:
  - ‘동족들’로 완화하기
  - ‘형제자매들’로 성중립화하기
  rationale: 히브리어 원문이 남성 복수 친족어를 사용하고 있으며, 본문은 지파 연대와 분배의 문맥을 강조하므로 현대적 완화보다 직접성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
