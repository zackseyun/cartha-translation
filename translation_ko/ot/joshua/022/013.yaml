translation:
  language: ko
  text: 그때 이스라엘 자손은 길르앗 땅에 있는 르우벤 자손과 갓 자손과 므낫세 반 지파에게 제사장 엘르아살의 아들 비느하스를 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로는 ‘이스라엘 사람들이 비느하스를 길르앗 땅에 있는 르우벤 사람들과 갓 사람들과 므낫세 반 지파에게 보냈다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
