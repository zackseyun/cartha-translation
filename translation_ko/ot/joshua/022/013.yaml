  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the Israelites sent Phinehas ... to the Reubenites, the Gadites, and the half-tribe of Manasseh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손이 르우벤 자손과 갓 자손과 므낫세 반 지파에게, 길르앗 땅으로 엘르아살의 아들 제사장 비느하스를 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로는 ‘이스라엘 사람들이 비느하스…를 르우벤 사람들, 갓 사람들, 그리고 므낫세 반 지파에게 보냈다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 사람 자손
  lexicon: HALOT
  rationale: 히브리어의 직역형인 ‘sons of Israel’을 한국어 성경 문체에 자연스럽게 옮기되, 혈연·언약 공동체를 가리키는 표현으로 유지했습니다.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  english_pob_choice: the sons of Reuben / the sons of Gad
  chosen_korean: 르우벤 자손 / 갓 자손
  alternatives_korean:
  - 르우벤 사람들 / 갓 사람들
  - 르우벤 족속 / 갓 족속
  lexicon: HALOT
  rationale: 영어 POB가 gentilic보다 원문 구조를 드러내는 ‘sons of’ 형식을 택했으므로, 한국어도 ‘자손’으로 대응해 원문 투명성을 살렸습니다.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  english_pob_choice: the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반 지파
  - 므낫세 반쪽 지파
  lexicon: HALOT
  rationale: ‘half-tribe’의 통상적 한국어 대응인 ‘반 지파’를 사용해 의미를 분명히 하고, ‘므낫세’의 소유격을 자연스럽게 결합했습니다.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  english_pob_choice: in the land of Gilead
  chosen_korean: 길르앗 땅으로
  alternatives_korean:
  - 길르앗 땅에
  - 길르앗 지역으로
  lexicon: HALOT
  rationale: 문맥상 파견의 목적지 방향을 나타내므로 ‘-으로’를 택했고, English POB의 ‘in the land of Gilead’가 가리키는 거주·관할 지역성을 한국어에서는 간결하게 살렸습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 그 제사장
  lexicon: HALOT
  rationale: כהן의 기본 의미를 표준 성경 용례에 따라 ‘제사장’으로 옮겼고, 문맥상 엘르아살의 직분 표지로 충분하므로 관형사형 반복은 피했습니다.
theological_decisions:
- issue: ‘엘르아살의 아들 제사장 비느하스’의 호칭 배열
  chosen_reading: 비느하스를 엘르아살의 아들로, 동시에 제사장으로 식별하는 원문 순서를 그대로 반영했습니다.
  alternative_readings:
  - 제사장 비느하스, 엘르아살의 아들
  - 엘르아살의 아들인 제사장 비느하스
  rationale: 히브리어는 인물명과 계보, 직분을 병렬로 제시하므로, 한국어에서도 그 식별 정보를 압축하지 않고 모두 드러내는 것이 원문 충실도에 유리합니다.
  doctrine_reference: 서술적 식별 정보 보존
- issue: ‘이스라엘 자손’의 집단 표현
  chosen_reading: 개인들의 단순 집합이 아니라 언약 백성의 공식 호칭으로 ‘이스라엘 자손’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘인들
  rationale: 이 표현은 역사 서술 속 공식 집단명으로 기능하므로, 익숙한 민족명보다 원문적·문서적 표지를 살리는 편이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 언약 공동체 표지
