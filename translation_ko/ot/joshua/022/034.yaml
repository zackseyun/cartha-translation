source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
  footnotes:
  - marker: a
    text: Or, more expansively, 'they called the altar “A Witness Between Us That the LORD Is God,”' taking the explanatory clause as part of the name rather than as the reason for it.
    reason: alternative_reading
translation:
  language: ko
  text: 르우벤 자손과 갓 자손이 그 제단을 「증거」라 불렀습니다. 그것은 야훼께서 하나님이심을 우리 사이에서 증언하는 증거이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 넓게는, ‘그들이 제단을 “야훼께서 하나님이심을 우리 사이에서 증언하는 증거”라고 불렀다’로 이해할 수 있습니다. 이 경우 뒤의 설명절을 이름의 일부로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름 지었습니다
  - 명명했습니다
  lexicon: HALOT
  rationale: קרא는 대상의 이름을 ‘부르다/이름하다’의 뜻으로 쓰므로, 서술문에서는 자연스러운 ‘불렀습니다’가 적절합니다.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  english_pob_choice: the sons of Reuben and the sons of Gad
  chosen_korean: 르우벤 자손과 갓 자손
  alternatives_korean:
  - 르우벤 사람들과 갓 사람들
  - 르우벤 지파와 갓 지파
  lexicon: HALOT
  rationale: 히브리어의 직설적인 족속 표지를 살리되, 한국어에서는 자연스럽게 ‘자손’으로 옮겨 혈연·계승 관계를 분명히 했습니다.
- source_word: לַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 그 제단
  alternatives_korean:
  - 제단을
  - 그 단을
  lexicon: HALOT
  rationale: 대상이 이름 붙여지는 객체이므로 목적격을 살려 ‘그 제단’으로 옮겼습니다.
- source_word: עֵד
  english_pob_choice: Witness
  chosen_korean: 「증거」
  alternatives_korean:
  - 「증인」
  - 「증언」
  lexicon: HALOT
  rationale: 이 명칭은 제단의 이름 기능을 가지면서 동시에 ‘증거/증언’의 뜻을 담으므로, 한국어에서는 명사형 ‘증거’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 고유한 언약명이라는 점을 보존했습니다.
theological_decisions:
- issue: 제단 이름을 단일 명칭으로 볼지, 설명절 전체를 이름으로 볼지
  chosen_reading: 본문은 제단의 명칭을 ‘증거’로 두고, 뒤의 절은 그 이름의 의미를 설명하는 문장으로 옮겼습니다.
  alternative_readings:
  - ‘우리 사이에 야훼께서 하나님이심을 증거하는 증거’라는 더 긴 이름으로 처리
  - ‘에드’처럼 전통적 고유명으로 처리
  rationale: 마소라 본문은 짧은 명칭과 설명절을 구분해 읽는 것이 가장 직접적이므로, 본문에는 과도한 확장을 넣지 않고 설명은 이유절로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
