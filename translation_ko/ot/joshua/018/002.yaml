  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads more literally 'among the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that had not divided their inheritance' or 'that had not yet received their inheritance by allotment.' The Hebrew verb can be rendered in different ways depending on whether the focus is on the tribes' participation in the division or on the inheritance not yet being assigned to them.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이스라엘 자손 가운데에는 아직 자기들의 기업을 분배받지 못한 일곱 지파가 남아 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기들의 기업을 아직 분배하지 않은’입니다. 히브리어 동사는 능동형이지만, 문맥에서는 이 일곱 지파에 기업이 아직 배정되지 않았다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
