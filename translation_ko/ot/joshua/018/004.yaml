review_pass:
  verdict: revise
  source_fidelity: The draft obscures several source relationships. לַשָּׁבֶט is distributive ('from/for each tribe'), not 'your tribes' collectively; אֹתָהּ refers to the land and should be represented as the object of recording; and לְפִי נַחֲלָתָם concerns the inheritance allotments/divisions rather than an instrumental 'with their inherited land.' The final clause should retain the plural representatives as its subject.
  naturalness: The draft is a run-on sentence with unclear coordination and an unnatural phrase, '그들의 상속지대로 기록하여.' A short sequence of formal-polite instructions is clearer and idiomatic.
  terminology: '''상속 분깃'' naturally conveys נחלה here as an inheritance allotment. ''사람'' preserves the explicitly male referent in context without using an unnecessarily marked or archaic expression.'
  issues:
  - severity: high
    issue: The phrase '그들의 상속지대로 기록하여' mistranslates and is ungrammatical in context.
    rationale: The Hebrew says to record/write the land according to their inheritance allotments; it does not say to record it 'as/with their inherited territory.'
  - severity: medium
    issue: The draft does not explicitly state that the land is what is to be recorded.
    rationale: The feminine object suffix on וְיִכְתְּבוּ אֹתָהּ refers to הארץ ('the land').
  - severity: medium
    issue: The distributive sense of 'three men per tribe' is not clearly conveyed.
    rationale: The singular 'tribe' is used distributively in this context, requiring 'each tribe' or an equivalent Korean expression.
  revised_text: 각 지파에서 세 사람씩 내놓으십시오. 내가 그들을 보내겠습니다. 그러면 그들은 일어나 그 땅을 두루 다니며 자기들의 상속 분깃에 따라 그 땅을 기록하고 내게로 올 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “각 지파마다 세 사람씩 임명하십시오.”
    reason: lexical_alternative
  - marker: b
    text: 곧 그 땅을 상속으로 받을 분깃들에 맞추어 기록하라는 뜻입니다.
    reason: cultural_note
  revision_rationale: The revision restores the distributive reference to each tribe, explicitly identifies the land as the object of recording, and renders the inheritance idiom as '상속 분깃에 따라.' It also uses modern formal-polite Korean and separates the instructions into clear clauses. Footnotes preserve the appointment alternative and explain the allotment-related sense without over-specifying the surveying procedure.
