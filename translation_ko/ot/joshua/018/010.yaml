base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of Israel.'' This expression refers corporately to the people of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 실로에서 야훼 앞에서 그들을 위해 제비를 뽑았고, 거기서 여호수아가 이스라엘 자손에게 그들의 분깃대로 그 땅을 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이스라엘의 아들들’. 이 표현은 이스라엘 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ / גּוֹרָל
  english_pob_choice: cast lots
  chosen_korean: 제비를 뽑았고
  alternatives_korean:
  - 제비를 던졌고
  - 제비를 걸었고
  lexicon: HALOT
  rationale: 제비뽑기 관용구를 자연스럽게 옮기되, 땅 분배의 절차적 의미가 드러나도록 ‘제비를 뽑다’를 택했습니다.
- source_word: בְּשִׁלֹה
  english_pob_choice: at Shiloh
  chosen_korean: 실로에서
  alternatives_korean:
  - 실로 안에서
  - 실로에
  lexicon: HALOT
  rationale: 지명 앞의 전치사는 한국어에서 장소 부사격 ‘-에서’가 가장 자연스럽습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에
  - 야훼 면전에서
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 하나님의 이름은 ‘야훼’로 옮기고, ‘앞에서’로 공개적·제의적 현장성을 살렸습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘sons of Israel’을 한국어 성경 관용에 맞는 ‘이스라엘 자손’으로 유지해 공동체 지칭을 보존했습니다.
- source_word: כְּמַחְלְקֹתָם
  english_pob_choice: according to their divisions
  chosen_korean: 그들의 분깃대로
  alternatives_korean:
  - 그들의 구분대로
  - 그들의 나뉜 몫에 따라
  - 그들의 분할에 따라
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘분할’보다 땅의 배분 몫을 가리키는 ‘분깃’이 더 정확해, 분배의 결과를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: YHWH의 표기와 제의적 장면의 전달
  chosen_reading: יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 표기하고, ‘야훼 앞에서’로 회막/성소 맥락의 공적 행위를 드러냈습니다.
  alternative_readings:
  - 주님 앞에서
  - 여호와 앞에서
  rationale: 본문은 제비뽑기라는 언약 공동체의 공적 분배 행위를 묘사하므로, 고유 신명과 현장성을 유지하는 것이 소스의 뜻을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
