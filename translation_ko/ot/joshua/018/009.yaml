review_pass:
  verdict: revise
  source_fidelity: 히브리어의 동작 순서와 핵심 요소는 대체로 반영되었으나, ‘그것을 일곱 몫으로 한 책에 기록하고’는 ‘한 책’을 일곱 몫으로 만들었다는 뜻으로도 읽힐 수 있습니다. לֶעָרִים와 לְשִׁבְעָה חֲלָקִים는 기록의 도시별·일곱 구획별 정리 방식을 분명히 드러내도록 옮기는 것이 좋습니다. 또한 אֶל־הַמַּחֲנֶה שִׁלֹה는 실로의 진영에 있는 여호수아에게 온 것으로 표현하는 편이 자연스럽습니다.
  naturalness: ‘성들’보다 현대 한국어 성경 문체에서는 ‘성읍들’ 또는 ‘성읍별로’가 더 자연스럽습니다. ‘실로의 진영에서 여호수아에게로 왔습니다’는 출발점처럼 들릴 수 있으므로 여호수아의 위치를 수식하도록 다듬었습니다.
  terminology: ‘여호수아’, ‘실로’, ‘진영’은 한국어 성경의 통용 표기를 유지했습니다. סֵפֶר는 현대적 제본책을 특정하지 않도록 본문에서는 ‘기록 문서’로, 주석에서 두루마리 가능성을 밝혔습니다.
