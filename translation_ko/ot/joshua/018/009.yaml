revisions:
- from: 그 사람들은 가서 땅을 두루 지나며, 성들에 따라 그것을 일곱 몫으로 한 책에 기록하고, 실로의 진영에서 여호수아에게로 왔습니다.[a][b]
  to: 그 사람들은 가서 땅을 두루 다니며, 그 땅을 성읍별로[a] 일곱 몫으로 나누어 기록 문서에[b] 기록하고, 실로의 진영에 있는 여호수아에게 왔습니다.
  rationale: 기록 대상인 땅이 성읍별로 일곱 몫으로 구분되었다는 원문의 관계를 한국어 문장 안에서 명료하게 했습니다. ‘기록 문서’는 סֵפֶר의 고대 문서성을 보존하면서도 특정한 현대식 책 형태를 강요하지 않습니다. 지명과 인명은 통용 한국어 성경 표기를 유지했습니다.
  reviewer_model: gpt-5.6-terra
