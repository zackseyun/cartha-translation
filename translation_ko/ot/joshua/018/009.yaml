id: JOS.18.9
reference: Joshua 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֤וּ הָֽ/אֲנָשִׁים֙ וַ/יַּעַבְר֣וּ בָ/אָ֔רֶץ וַ/יִּכְתְּב֧וּ/הָ לֶֽ/עָרִ֛ים לְ/שִׁבְעָ֥ה חֲלָקִ֖ים עַל סֵ֑פֶר וַ/יָּבֹ֧אוּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה שִׁלֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
  footnotes:
  - marker: a
    text: Or 'according to cities'; the phrase indicates that the land survey was organized city by city.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on a scroll/book' (עַל־סֵפֶר), that is, in a written document.
    reason: cultural_note
translation:
  language: ko
  text: 그 사람들은 가서 땅을 두루 지나며, 성들에 따라 그것을 일곱 몫으로 한 책에 기록하고, 실로의 진영에서 여호수아에게로 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성들에 따라’는 히브리어 לֶעָרִים의 구획 기준을 드러낸 표현으로, 문자적으로는 ‘도시별로/도시를 기준으로’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: ‘한 책’은 히브리어 סֵפֶר의 기록 문서/두루마리를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  english_pob_choice: the men went
  chosen_korean: 그 사람들은 가서
  alternatives_korean:
  - 그 남자들은 가서
  - 그 사람들은 갔습니다
  lexicon: HALOT
  rationale: 앞선 문맥의 대표자들을 가리키므로 ‘사람들’보다 ‘그 사람들’이 자연스럽고, 서사 진행은 ‘가서’로 연결해 히브리어 연속 동작을 살렸습니다.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  english_pob_choice: passed through the land
  chosen_korean: 땅을 두루 지나며
  alternatives_korean:
  - 땅을 지나며
  - 땅을 통과하며
  lexicon: HALOT
  rationale: 조사·측량의 맥락에서 단순 이동보다 ‘두루 지나며’가 범위를 훑는 뜻을 더 잘 드러냅니다.
- source_word: וַיִּכְתְּבוּהָ לֶעָרִים
  english_pob_choice: they wrote it down by cities
  chosen_korean: 성들에 따라 그것을 ... 기록하고
  alternatives_korean:
  - 성들별로 그것을 기록하고
  - 성들에 따라 그것을 적고
  lexicon: HALOT
  rationale: לֶעָרִים은 도시 단위의 정리 기준을 나타내므로 ‘성들에 따라’로 옮겨 도시별 구획을 반영했습니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in a book
  chosen_korean: 한 책에 기록하고
  alternatives_korean:
  - 책에 기록하고
  - 두루마리에 기록하고
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 기록 문서를 뜻하므로, 본문은 ‘책에’로 두되 고대 매체의 느낌은 주해에서 남길 수 있습니다.
theological_decisions:
- issue: 지명 표현의 현대화와 고유명사 처리
  chosen_reading: ‘실로’와 ‘여호수아’를 현대 한국어 성경 관용에 맞게 유지했습니다.
  alternative_readings:
  - 실로아
  - 호수아
  rationale: 고유명사는 널리 정착된 성경형을 따르는 것이 독자의 인지와 본문 추적에 가장 유리합니다.
  doctrine_reference: 성경 번역의 일관성과 본문 추적 가능성
