id: JOS.18.1
reference: Joshua 18:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or traditionally 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the land was conquered before them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘 자손[a]의 온 회중이 실로에 모여, 그곳에 회막을 세웠습니다. 땅은 그들 앞에 굴복해 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 직역하면 ‘이스라엘의 아들들’입니다. 전통적으로는 ‘이스라엘 자손’ 또는 ‘이스라엘 백성’으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅이 그들 앞에서 정복되었다.’
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the whole congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘의 온 회중
  - 이스라엘 자손의 전체 회중
  lexicon: HALOT
  rationale: עֲדָה의 집합적 의미를 살려 ‘회중’으로 옮기고, בְּנֵי יִשְׂרָאֵל은 영어 POB의 ‘sons of Israel’에 맞추어 ‘이스라엘 자손’으로 유지했습니다.
- source_word: וַיַּשְׁכִּינוּ שָׁם אֶת אֹהֶל מוֹעֵד
  english_pob_choice: set up the tent of meeting there
  chosen_korean: 그곳에 회막을 세웠고
  alternatives_korean:
  - 그곳에 회막을 설치했고
  - 그곳에 회막을 두었고
  - 그곳에 회막을 장막쳤고
  lexicon: HALOT
  rationale: שכן의 사역형은 ‘거하게 하다’의 문자성이 있으나, 목적어가 אֹהֶל מוֹעֵד일 때 한국어에서는 ‘회막을 세우다’가 가장 자연스럽고 본문 의도를 잘 드러냅니다.
- source_word: נִכְבְּשָׁה
  english_pob_choice: was subdued
  chosen_korean: 굴복해 있었습니다
  alternatives_korean:
  - 정복되어 있었습니다
  - 제압되어 있었습니다
  - 복속되어 있었습니다
  lexicon: HALOT
  rationale: 단순한 정복 완료보다 ‘굴복’이 пассив 상태와 지배 아래 놓인 뉘앙스를 잘 살리며, 영어 POB의 ‘was subdued’와도 맞습니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에
  alternatives_korean:
  - 그들 앞에서
  - 그들 면전에
  - 그들 앞에 놓여
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 풀지 않고, 자연스러운 한국어로 ‘그들 앞에’라고 옮겨 위치와 종속 상태를 함께 드러냈습니다.
theological_decisions:
- issue: 땅이 ‘정복되었다’는 표현의 강도
  chosen_reading: ‘굴복해 있었습니다’로 번역해 완전 정복을 단정하지 않았습니다.
  alternative_readings:
  - ‘정복되어 있었습니다’
  - ‘완전히 정복되었습니다’
  rationale: 히브리어 수동형은 땅이 이스라엘 아래 놓인 상태를 말하지만, 여호수아서 전체 서술은 아직 미정복 지역을 포함하므로 과도한 결론을 피하는 것이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘이스라엘 자손’의 남성형 집합 표현 유지
  chosen_reading: ‘이스라엘 자손의 온 회중’으로 남성형 집합 표현을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들의 온 회중’
  - ‘이스라엘 백성의 온 회중’
  rationale: 본문의 בְּנֵי יִשְׂרָאֵל은 문법적으로 남성 복수 집합 표현이므로, 의미를 일반화하기보다 원문 형식을 보존하는 쪽이 사본 가시성과 번역 투명성에 유리합니다.
  doctrine_reference: Translation philosophy §4
