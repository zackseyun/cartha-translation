source:
  edition: WLC
  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
  footnotes:
  - marker: a
    text: En-shemesh means 'Spring of the Sun,' but the place name is transliterated in the main text.
    reason: lexical_alternative
  - marker: b
    text: Geliloth may be understood lexically as 'circles' or 'districts,' but here it is treated as a place name.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Pass of Adummim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 북쪽으로 굽어 엔세메스[a]로 나아가고, 글릴롯[b]으로 뻗어 가는데, 그곳은 아둠밈의 오르막길[c] 맞은편에 있습니다. 그 경계는 르우벤의 아들 보한의 돌로 내려갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엔세메스’는 ‘태양의 샘’이라는 뜻이지만, 본문에서는 지명으로 음역합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘글릴롯’은 문자적으로 ‘원들’ 또는 ‘구역들’로 이해될 수 있지만, 여기서는 지명으로 봅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아둠밈의 고개’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר מִצָּפוֹן
  english_pob_choice: Then it curved northward
  chosen_korean: 그 경계는 북쪽으로 굽어 나가
  alternatives_korean:
  - 그리고 북쪽으로 뻗어
  - 그리고 북쪽에서 나와
  - 그 경계가 북쪽으로 돌아
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내는 동사 תאר와 방향 부사적 표현을 자연스러운 한국어 경계 서술인 ‘굽어 나가’로 옮겨, 원문의 지형적 흐름을 살렸습니다.
- source_word: עֵין שֶׁמֶשׁ
  english_pob_choice: En-shemesh
  chosen_korean: 엔세메스
  alternatives_korean:
  - 태양의 샘
  - 엔-세메스
  lexicon: HALOT
  rationale: 지명으로 기능하므로 번역하지 않고 음역했습니다. 영어 POB와 같이 본문에서는 음역을 유지하는 것이 적절합니다.
- source_word: גְּלִילוֹת
  english_pob_choice: Geliloth
  chosen_korean: 길룟
  alternatives_korean:
  - 겔릴롯
  - 원형들
  - 지구들
  lexicon: HALOT
  rationale: 문맥상 지명으로 다루어야 하므로 음역했습니다. 어휘적 의미인 ‘원들/구역들’은 여기서 본문 의미를 더 잘 드러내지 못합니다.
- source_word: מַעֲלֵה אֲדֻמִּים
  english_pob_choice: the Ascent of Adummim
  chosen_korean: 아둠밈의 오름
  alternatives_korean:
  - 아둠밈의 언덕길
  - 아둠밈의 고개
  - 아둠밈의 오르막
  lexicon: HALOT
  rationale: מַעֲלֵה는 지형적 ‘오름/고개’를 뜻하므로, 지명 요소는 살리되 한국어에서는 ‘오름’으로 그 지형성을 드러냈습니다.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  english_pob_choice: the stone of Bohan son of Reuben
  chosen_korean: 보한, 곧 르우벤의 아들의 돌
  alternatives_korean:
  - 보한의 돌, 르우벤의 아들
  - 르우벤의 아들 보한의 돌
  lexicon: HALOT
  rationale: 히브리어 소유격 연쇄를 본문 흐름에 맞게 ‘보한, 곧 르우벤의 아들의 돌’로 옮겨, 표지물의 명칭과 인물 식별을 함께 드러냈습니다.
theological_decisions:
- issue: 지명 음역과 의미역의 선택
  chosen_reading: 이 절은 경계 지형과 지명을 나열하는 본문이므로, 지명은 음역하고 지형 일반어만 한국어로 풀었습니다.
  alternative_readings:
  - 모든 지명을 뜻풀이로 번역하기
  - 본문 전체를 지명 음역만으로 처리하기
  rationale: 본문의 기능은 경계 묘사이며, 지명 뜻풀이를 본문에 넣으면 오히려 식별 가능성과 역사 지리적 정보를 흐릴 수 있습니다.
  doctrine_reference: 성경 지리 본문의 문학적-역사적 기능 보존
