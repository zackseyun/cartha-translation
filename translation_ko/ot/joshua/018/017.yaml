  naturalness: ‘그 경계는’과 ‘그다음’은 경계 서술의 주어와 순차성을 보완하지만, ‘보한, 곧 르우벤의 아들의 돌’은 현대 한국어로도 부자연스럽고 지시 대상이 불명확합니다. ‘북쪽으로 굽어’, ‘…으로 나아가고’, ‘…로 내려갑니다’는 간결하고 자연스러운 합쇼체 경계 묘사입니다.
