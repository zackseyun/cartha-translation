  source_fidelity: 현 초안은 כְּהֻנַּת יְהוָה를 ‘여호와의 제사장’으로 옮겨 ‘제사장’과 ‘제사 직분’을 혼동하며, עֶבֶד יְהוָה를 ‘모세가 여호와의 종으로’라고 처리하여 수식 관계를 바꾸었습니다. 또한 고유명사 두 개가 영어 표기로 남아 있습니다. 수정문은 히브리어의 집합적 단수 ‘그의 유산’을 문맥상 ‘그들의 유산’으로 옮기고 각주로 이를 밝혔습니다.
  naturalness: ‘요단강 건너편 동쪽’과 ‘야훼의 종 모세’는 현대 표준 한국어의 자연스러운 성서 문체입니다. 합쇼체에 맞추어 문장을 종결했습니다.
  terminology: יְהוָה는 감사 추적의 방침에 따라 ‘야훼’로, כְּהֻנָּה는 ‘제사 직분’으로, נַחֲלָה는 ‘유산’으로 옮겼습니다. 갓, 르우벤, 므낫세는 통용 한국어 성서 고유명사 표기입니다.
