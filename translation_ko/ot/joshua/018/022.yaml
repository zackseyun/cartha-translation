lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  english_pob_choice: Beth-arabah
  chosen_korean: 벧아라바
  alternatives_korean:
  - 벧 아라바
  - 아라바의 집
  lexicon: HALOT
  rationale: 지명 목록이므로 성분을 풀어 ‘아라바의 집’으로 옮기기보다, POB 영어처럼 고유지명으로 음역하는 것이 본문 형식에 맞습니다.
- source_word: צְמָרַיִם
  english_pob_choice: Zemaraim
  chosen_korean: 세마라임
  alternatives_korean:
  - 제마라임
  - 세마림
  lexicon: HALOT
  rationale: 듀얼/복수형처럼 보이는 히브리어 형태를 살려 지명으로 음역했습니다. 한국어에서는 ‘세마라임’이 가장 자연스럽게 대응됩니다.
- source_word: בֵית אֵל
  english_pob_choice: Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 벧-엘
  - 하나님의 집
  lexicon: HALOT
  rationale: 널리 통용되는 지명형을 따랐고, 구성 성분을 직역한 ‘하나님의 집’은 이 지명 목록의 용법을 약화시킵니다.
- source_word: וּ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 과
  - 와
  lexicon: HALOT
  rationale: 열거 구조를 한국어 자연문으로 옮기되, 지명들의 병렬 관계는 유지했습니다.
