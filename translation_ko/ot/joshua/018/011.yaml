source:
  edition: WLC
  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
  footnotes:
  - marker: a
    text: Or, 'the boundary of their allotment came out between the sons of Judah and the sons of Joseph.'
    reason: lexical_alternative
  - marker: b
    text: '''The sons of Joseph'' refers collectively to the tribes descended from Joseph, especially Ephraim and Manasseh.'
    reason: cultural_note
translation:
  language: ko
  text: 베냐민 자손 지파의 제비가 그들의 씨족별로 나왔으며, 그들이 제비로 받은 땅의 경계는 유다 자손과 요셉 자손 사이에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 제비의 경계’입니다. 히브리어 ‘경계’는 여기서 제비로 배정된 땅을 정하는 경계선을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל / גּוֹרָל
  english_pob_choice: the lot ... came up
  chosen_korean: 제비가 ... 올라왔고
  alternatives_korean:
  - 제비가 ... 뽑혔고
  - 제비가 ... 나왔고
  lexicon: HALOT
  rationale: 제비가 ‘올라왔다’는 구체적 이미지를 살리면서, 분배 과정에서 결과가 드러나는 흐름을 자연스럽게 옮겼습니다.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  english_pob_choice: the tribe of the sons of Benjamin
  chosen_korean: 베냐민 자손의 지파
  alternatives_korean:
  - 베냐민의 지파
  - 베냐민 사람들의 지파
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 유지하되, 한국어에서는 ‘베냐민 자손의 지파’가 가장 투명하고 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 종족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 지파 내부의 씨족 단위를 가리키므로, ‘씨족’이 구조를 가장 잘 반영합니다.
- source_word: גְּבוּל גּוֹרָלָם
  english_pob_choice: the territory of their lot
  chosen_korean: 그들의 제비의 경계
  alternatives_korean:
  - 그들의 제비의 땅
  - 그들의 제비의 경계선
  lexicon: HALOT
  rationale: גְּבוּל의 기본 의미인 ‘경계, 경계선’을 살려 문자적으로 옮겼습니다. 영어 POB의 ‘territory’는 허용된 해석적 확장이나, 본문 자체는 경계 표지를 말합니다.
- source_word: בֵּין בְּנֵי יְהוּדָה וּבֵין בְּנֵי יוֹסֵף
  english_pob_choice: between the sons of Judah and the sons of Joseph
  chosen_korean: 유다 자손과 요셉 자손 사이에서
  alternatives_korean:
  - 유다 자손과 요셉의 자손 사이에서
  - 유다 자손과 요셉 집안 사이에서
  lexicon: HALOT
  rationale: ‘사이에서’로 위치 관계를 분명히 하되, 히브리어의 대칭 구조를 그대로 유지했습니다.
theological_decisions:
- issue: גְּבוּל의 처리
  chosen_reading: ‘경계’로 옮겨, 분배된 땅의 둘레선/경계표시라는 직접 의미를 드러냈습니다.
  alternative_readings:
  - ‘땅’으로 의역
  - ‘영토’로 확대
  rationale: 이 절의 초점은 지파의 분배 경계가 어디로 정해졌는지에 있으므로, 경계라는 본래 의미를 우선해야 합니다. 영어 POB의 ‘territory’는 자연스러운 효과를 위한 메타노미였지만, 한국어 본문에서는 소스어의 긴장을 보존하는 편이 더 투명합니다.
  doctrine_reference: 본문의 지리적 분배 진술
