  source_fidelity: 히브리어의 제비 추첨(גּוֹרָל), 베냐민 지파와 씨족 단위의 분배, 그리고 유다와 요셉 자손 사이에 놓인 경계(גְּבוּל)를 충실히 반영합니다. 다만 ‘제비가 올라왔고’와 ‘그들의 제비의 경계’는 각각 히브리어 어순을 지나치게 직역하여 현대 표준 한국어에서는 부자연스럽습니다. ‘나왔으며’와 ‘그들이 제비로 받은 땅의 경계’는 제비와 경계라는 원문의 의미를 보존하면서도 자연스럽습니다.
