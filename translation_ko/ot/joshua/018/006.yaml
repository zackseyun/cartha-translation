  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: ko
  text: 그리고 너희는 그 땅을 일곱 몫으로 기록하여, 그것을 여기 내게 가져오십시오. 그러면 내가 여기에서, 우리 하나님 여호와 앞에서 너희를 위해 제비를 뽑겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분깃’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת הָאָרֶץ שִׁבְעָה חֲלָקִים
  english_pob_choice: write down the land in seven portions
  chosen_korean: 그 땅을 일곱 몫으로 기록하여
  alternatives_korean:
  - 그 땅을 일곱 부분으로 적어
  - 그 땅을 일곱 분깃으로 기록하여
  lexicon: 기록하다 / 몫
  rationale: 배분 목록을 작성하는 행위이므로 단순히 ‘적다’보다 행정적·문서적 뉘앙스가 있는 ‘기록하다’를 살렸고, חֲלָקִים은 분할된 몫이라는 뜻을 반영해 ‘몫’으로 옮겼습니다.
- source_word: וַהֲבֵאתֶם אֵלַי הֵנָּה
  english_pob_choice: bring it here to me
  chosen_korean: 그것을 여기 내게 가져오십시오
  alternatives_korean:
  - 그것을 이리 내게 가져오십시오
  - 그것을 내게 여기로 가져오십시오
  lexicon: 가져오다 / 여기
  rationale: 행동의 방향성과 발화점의 근접성을 자연스럽게 살려 ‘여기 내게’로 옮겼습니다.
- source_word: וְיָרִיתִי לָכֶם גוֹרָל
  english_pob_choice: I will cast the lot for you
  chosen_korean: 내가 여기에서 … 너희를 위해 제비를 뽑겠습니다
  alternatives_korean:
  - 내가 너희를 위해 여기서 제비를 뽑겠습니다
  - 내가 너희를 위해 제비를 던지겠습니다
  lexicon: גוֹרָל / 제비를 뽑다
  rationale: גוֹרָל은 분배를 결정하는 추첨을 가리키므로 한국어 관용구 ‘제비를 뽑다’를 사용했고, 단수형을 반영해 ‘제비’를 유지했습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  english_pob_choice: before the LORD our God
  chosen_korean: 우리 하나님 여호와 앞에서
  alternatives_korean:
  - 우리 하나님 야훼 앞에서
  - 우리 하나님 여호와 면전에서
  lexicon: יהוה / 여호와
  rationale: 이 본문에서는 영어 POB가 LORD를 유지하므로, 한국어 공동체에서 즉시 알아볼 수 있는 ‘여호와’를 사용하되 문맥상 ‘앞에서’로 공적·예배적 면전을 살렸습니다.
theological_decisions:
- issue: 제비뽑기의 신적 정당성
  chosen_reading: 제비뽑기를 여호와 앞에서 행하는 것으로 제시하여 분배가 인간 재량이 아니라 하나님 앞의 판정임을 드러냈습니다.
  alternative_readings:
  - 단순한 추첨 절차로만 읽기
  - 의례적 표현을 약화하기
  rationale: 원문의 לִפְנֵי יְהוָה는 장소 표시를 넘어 행위의 신적 공인을 뜻하므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 섭리와 분배의 주권
