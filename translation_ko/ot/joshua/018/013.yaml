id: JOS.18.13
reference: Joshua 18:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַר֩ מִ/שָּׁ֨ם הַ/גְּב֜וּל ל֗וּזָ/ה אֶל כֶּ֤תֶף ל֨וּזָ/ה֙ נֶ֔גְבָּ/ה הִ֖יא בֵּֽית אֵ֑ל וְ/יָרַ֤ד הַ/גְּבוּל֙ עַטְר֣וֹת אַדָּ֔ר עַל הָ/הָ֕ר אֲשֶׁ֛ר מִ/נֶּ֥גֶב לְ/בֵית חֹר֖וֹן תַּחְתּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
  footnotes:
  - marker: a
    text: Luz is identified here with Bethel.
    reason: cross_reference
  - marker: b
    text: Or 'to the shoulder of Luz on the south'; the Hebrew uses a body-part term for the side or slope of a hill.
    reason: lexical_alternative
  - marker: c
    text: Atroth-addar is also spelled 'Ataroth-addar' in some English traditions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 경계는 루스[a]로, 곧 루스의 남쪽 어깨[b]인 벧엘로 지나갔고, 경계는 아트롯-아다르[c]로 내려갔습니다. 그곳은 아래 벧호론의 남쪽에 있는 산입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 루스는 여기서 벧엘과 동일시됩니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 산의 옆면이나 경사면을 가리키는 신체 용어를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 아트롯-아다르는 영어 전통에서는 ‘아타롯-아다르’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר / הַגְּבוּל
  english_pob_choice: the border passed
  chosen_korean: 경계는 … 지나갔고
  alternatives_korean:
  - 경계선은 … 통과했고
  - 경계는 … 넘어갔고
  lexicon: HALOT
  rationale: 경계 묘사라는 장르를 살려 사람의 이동이 아니라 경계선의 진행을 자연스럽게 표현했습니다.
- source_word: לֻזָה / אֶל כֶּתֶף לֻזָה נֶגְבָּה
  english_pob_choice: to Luz / to the southern slope of Luz
  chosen_korean: 루스로, 곧 루스의 남쪽 어깨
  alternatives_korean:
  - 루스로, 곧 루스의 남쪽 경사면
  - 루스로, 곧 루스의 남쪽 비탈
  lexicon: HALOT
  rationale: כֶּתֶף은 문자적으로 ‘어깨’이지만 지형 문맥에서는 산비탈·측면을 가리키므로, 본문 의미를 살리면서도 주석 가능성을 남기기 위해 ‘남쪽 어깨’로 옮겼습니다.
- source_word: הִיא בֵּית אֵל
  english_pob_choice: that is, Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 곧 벧엘
  - 즉 벧엘
  lexicon: HALOT
  rationale: 루스와 벧엘의 동일시를 한국어 문장 안에서 과도하게 풀지 않고, ‘곧’의 의미를 앞뒤 병치로 충분히 드러냈습니다.
- source_word: עַטְרוֹת אַדָּר
  english_pob_choice: Atroth-addar
  chosen_korean: 아트롯-아다르
  alternatives_korean:
  - 아타롯-아다르
  - 아트로트-아다르
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관례에 따라 음역했고, 합성 지명임을 보여 주기 위해 하이픈을 유지했습니다.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  english_pob_choice: that is south of Lower Beth-horon
  chosen_korean: 아래 벧호론의 남쪽에 있는 산
  alternatives_korean:
  - 아래 벧호론 남쪽에 있는 산
  - 아래 벧호론의 남쪽 산
  lexicon: HALOT
  rationale: מִנֶּגֶב은 방향을 뜻하므로 ‘남쪽에 있는’으로 자연스럽게 풀었고, תַּחְתּוֹן은 통용 지명인 ‘아래 벧호론’으로 반영했습니다.
