base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
  footnotes:
  - marker: a
    text: Or 'shall stand at its border' / 'shall stand at their border'; the Hebrew verb literally means 'stand,' but here likely denotes remaining fixed in existing territorial boundaries.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅을 일곱 몫으로 나누십시오. 유다는 남쪽의 자기 경계에 그대로 있어야 하고[a], 요셉의 집은 북쪽의 그들의 경계에 그대로 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 경계에 서 있어야 하고’ / ‘그들의 경계에 서 있어야 합니다’. 히브리어 동사는 문자적으로 ‘서다’이지만, 여기서는 기존 영토 경계 안에 그대로 남아 있는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  english_pob_choice: And they shall divide it
  chosen_korean: 그 땅을 일곱 몫으로 나누십시오
  alternatives_korean:
  - 그것을 나누십시오
  - 그 땅을 분배하십시오
  lexicon: HALOT
  rationale: 지시대상은 약속의 땅이며, 히트파엘 חלק은 여기서 분할·할당의 의미이므로 자연스럽게 ‘나누다’로 옮겼습니다.
- source_word: לְשִׁבְעָה חֲלָקִים
  english_pob_choice: into seven portions
  chosen_korean: 일곱 몫으로
  alternatives_korean:
  - 일곱 부분으로
  - 일곱 구역으로
  lexicon: HALOT
  rationale: חֲלָקִים는 단순한 조각보다 분배된 몫·분깃의 뉘앙스가 있어 ‘몫’이 땅 분배 맥락을 잘 드러냅니다.
- source_word: יַעֲמֹד עַל גְּבוּל/וֹ
  english_pob_choice: shall remain at its border
  chosen_korean: 그 경계에 머물러 있고
  alternatives_korean:
  - 그 경계에 서 있고
  - 그 경계에 남아 있고
  lexicon: HALOT
  rationale: עָמַד의 문자적 의미는 ‘서다’이지만, 경계·영역 문맥에서는 현 위치를 유지한다는 뜻이므로 ‘머물다’가 가장 적절합니다.
- source_word: מִ/נֶּגֶב
  english_pob_choice: on the south
  chosen_korean: 남쪽에서
  alternatives_korean:
  - 남쪽에
  - 남쪽 편에서
  lexicon: HALOT
  rationale: 지리적 방향 표현으로, 앞뒤 평행구문(북쪽)과 맞추어 ‘남쪽에서’로 처리했습니다.
- source_word: בֵית יוֹסֵף
  english_pob_choice: the house of Joseph
  chosen_korean: 요셉의 집
  alternatives_korean:
  - 요셉 집안
  - 요셉 가문
  lexicon: HALOT
  rationale: בית יוסף는 요셉 지파들을 가리키는 관용구이므로, 직역하되 한국어로는 소속 집단을 드러내는 ‘요셉의 집’이 적절합니다.
