translation:
  language: ko
  text: 그리고 게바와 오브니와 그발 — 모두 열두 성읍과 그들의 촌락들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 케파르-암모니는 영어 전통 음역에 따라 Chephar-ammoni로도, 유사하게 표기될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  english_pob_choice: Chephar-ammoni
  chosen_korean: 케파르-암모니
  alternatives_korean:
  - 체파르-암모니
  - 케파르-하암모니
  - 암몬 사람의 마을
  lexicon: HALOT
  rationale: 고유 지명으로 보고 음역했습니다. 영어 POB의 표준 음역 선택을 따라 지명성을 유지하되, 의미역인 ‘암몬 사람의 마을’은 본문상 고정 지명으로 기능하므로 채택하지 않았습니다.
- source_word: הָעָפְנִי
  english_pob_choice: Ophni
  chosen_korean: 오브니
  alternatives_korean:
  - 오프니
  - 하오브니
  lexicon: HALOT
  rationale: 성읍 목록의 지명으로 보아 통용 음역을 따랐습니다. 관사 하-는 한국어 본문에서 따로 옮기지 않았습니다.
- source_word: גָבַע
  english_pob_choice: Geba
  chosen_korean: 게바
  alternatives_korean:
  - 가바
  - 게바아
  lexicon: HALOT
  rationale: 문맥상 ‘언덕’이 아니라 베냐민 지파 지역의 지명입니다. 한국어 성경에서 널리 알려진 음역 ‘게바’를 사용했습니다.
- source_word: עָרִים ... חַצְרֵיהֶן
  english_pob_choice: cities ... their villages
  chosen_korean: 성읍들 ... 그들의 촌락들
  alternatives_korean:
  - 도시들 ... 그들의 마을들
  - 성읍들 ... 그들의 마을들
  - 성읍들 ... 그들의 부속 촌락들
  lexicon: HALOT
  rationale: 분배 목록의 공식적 표현을 살리기 위해 ‘cities’를 ‘성읍들’로, 종속 거주지를 가리키는 ‘villages’를 ‘촌락들’로 옮겼습니다. ‘그들의’는 히브리어 접미대명사를 반영합니다.
theological_decisions:
- issue: 지명 목록의 문체
  chosen_reading: 서술을 덧붙이지 않고 단순한 열거형 문장으로 처리했습니다.
  alternative_readings:
  - ‘열두 성읍과 그 촌락’처럼 설명을 압축하는 방식
  - 문장부호를 약화한 평서형
  rationale: 이 절은 토지 분배 목록의 항목 나열이 핵심이므로, 원문의 정보량과 건조한 기록체를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문 장르 보존
