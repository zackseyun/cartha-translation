base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
  footnotes:
  - marker: a
    text: Hebrew 'tongue of the Salt Sea,' a geographic expression for a tongue-shaped bay or inlet.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Dead Sea'; the Hebrew text reads 'the Salt Sea.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 경계는 벧호글라의 북쪽 사면을 지나가다가, 소금 바다 북쪽의 혀[a], 곧 요단의 남쪽 끝에서 끝납니다. 이것이 남쪽 경계입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘혀’는 혀 모양으로 뻗은 만입 또는 돌출된 지형을 가리키는 표현입니다. ‘소금 바다’는 전통적으로 ‘사해’로 알려져 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  english_pob_choice: the border passed
  chosen_korean: 그 경계는 ... 지나 ... 나아가고
  alternatives_korean:
  - 그 경계는 ... 건너가고
  - 그 경계는 ... 통과하고
  lexicon: HALOT
  rationale: 경계선 진행을 나타내는 עָבַר의 지형적 용법을 살려, 한국어에서는 ‘지나’와 ‘나아가고’로 자연스럽게 옮겼습니다.
- source_word: כֶּתֶף
  english_pob_choice: shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 쪽
  - 비탈
  - 산기슭
  lexicon: HALOT
  rationale: 지형 비유의 구체성을 보존하기 위해 ‘어깨’를 유지했습니다.
- source_word: לְשׁוֹן
  english_pob_choice: tongue
  chosen_korean: 혀
  alternatives_korean:
  - 곶
  - 반도 모양의 물목
  - 돌출부
  lexicon: HALOT
  rationale: 히브리어의 직유적 지형 표현을 살리기 위해 문자적 이미지인 ‘혀’를 택했습니다.
- source_word: יָם הַמֶּלַח
  english_pob_choice: the Salt Sea
  chosen_korean: 소금 바다
  alternatives_korean:
  - 염해
  - 사해
  lexicon: HALOT
  rationale: 원문이 말하는 명칭을 직접 반영해 ‘소금 바다’로 옮겼고, 전통적 관용명인 ‘사해’는 쓰지 않았습니다.
theological_decisions:
- issue: 지명과 경계 공식의 직역성
  chosen_reading: 지형 묘사의 구체적 이미지를 유지하는 쪽으로, 관용적 성경용어보다 원문 이미지(어깨, 혀, 소금 바다)를 우선했습니다.
  alternative_readings:
  - 익숙한 지명 관용어로 완화하는 번역
  - 의미만 전달하는 비유적 평탄화
  rationale: 이 구절은 분배 경계의 기술문으로서 정확한 지리 이미지가 핵심이므로, 이미지 삭제보다 보존이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 성경 번역의 원문 충실성 및 지리-서술 문맥 보존
