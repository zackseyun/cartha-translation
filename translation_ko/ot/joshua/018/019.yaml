revisions:
- from: 그 경계는 베이트호글라의 북쪽 어깨를 지나 북쪽으로 나아가고, 그 경계의 끝은 소금 바다의 북쪽 혀, 곧 요단의 남쪽 끝에 이릅니다. 이것이 남쪽 경계입니다.[a]
  to: 그 경계는 벧호글라의 북쪽 사면을 지나가다가, 소금 바다 북쪽의 혀[a], 곧 요단의 남쪽 끝에서 끝납니다. 이것이 남쪽 경계입니다.
  rationale: 경계 기술문의 공간 관계를 명확히 하도록 문장을 재구성했습니다. כֶּתֶף는 한국어 지형 문맥에 자연스러운 ‘사면’으로, לְשׁוֹן은 원문의 이미지를 살린 ‘혀’로 옮기고 설명 주석을 달았습니다. 지명은 통용 표기인 ‘벧호글라’로 정리했으며, 원문의 ‘소금 바다’ 명칭은 유지했습니다.
