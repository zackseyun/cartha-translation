revisions:
- from: 그 사람들이 일어나서 갔습니다. 여호수아는 그 땅을 기록하러 가는 이들에게 명령하여 말했습니다. 「가서 그 땅을 두루 다니며 그것을 기록하고, 내게로 돌아오십시오. 그러면 내가 여기 실로에서 야훼 앞에서 여러분을 위해 제비를 뽑겠습니다.」[a]
  to: 그 사람들이 일어나서 갔습니다. 여호수아는 그 땅을 기록하러[a] 가는 이들에게 이렇게 명령했습니다. 「가서 그 땅을 두루 다니며 그것을 기록하고 내게로 돌아오십시오. 그러면 내가 여기, 실로에서 야훼 앞에 여러분을 위해 제비를 뽑겠습니다.」
  rationale: 의미를 바꾸지 않고 명령문의 도입을 현대 한국어답게 다듬었으며, 어휘 각주의 표지를 설명 대상인 ‘기록하러’로 옮겼습니다. 또한 ‘여기’와 ‘실로에서’를 구분하여 원문의 장소 표현을 더 명료하게 나타냈습니다.
