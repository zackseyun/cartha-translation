base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
  footnotes:
  - marker: a
    text: Or “record/describe the land”; the Hebrew is literally “write the land,” referring to making a written survey for allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들이 일어나서 갔습니다. 여호수아는 그 땅을 기록하러[a] 가는 이들에게 이렇게 명령했습니다. 「가서 그 땅을 두루 다니며 그것을 기록하고 내게로 돌아오십시오. 그러면 내가 여기, 실로에서 야훼 앞에 여러분을 위해 제비를 뽑겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “땅을 쓰다”입니다. 여기서는 분배를 위한 답사·기록을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  english_pob_choice: So the men arose and went
  chosen_korean: 그 사람들이 일어나서 갔습니다
  alternatives_korean:
  - 그 남자들이 일어나 갔습니다
  - 그들이 일어나 떠났습니다
  lexicon: HALOT
  rationale: 연속 서술 동사구로서 ‘일어나서 갔습니다’가 사건의 진행을 자연스럽게 살리며, הָאֲנָשִׁים는 특정한 남성 대표들을 가리키므로 ‘사람들’보다 ‘그 사람들’이 문맥상 무난합니다.
- source_word: וַיְצַו
  english_pob_choice: Joshua commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: צוה는 권위를 가진 명령을 뜻하므로, 여호수아의 지도적 위치와 뒤따르는 명령문을 반영해 ‘명령하여’로 옮겼습니다.
- source_word: לִכְתֹּב אֶת הָאָרֶץ / וְכִתְבוּ אוֹתָהּ
  english_pob_choice: to write down the land / write it down
  chosen_korean: 그 땅을 기록하러 / 그것을 기록하고
  alternatives_korean:
  - 그 땅을 적어 두러
  - 그 땅을 묘사하러 / 그것을 묘사하고
  - 그 땅을 문서로 남기러 / 그것을 문서로 남기고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘땅을 쓰다’이지만, 조사와 분배를 위한 서술 기록이라는 맥락이므로 ‘기록하다’가 가장 직접적입니다. ‘묘사하다’는 의미는 설명하지만 기록 행위의 문자적 핵심을 약화시킵니다.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  english_pob_choice: walk through the land
  chosen_korean: 그 땅을 두루 다니며
  alternatives_korean:
  - 그 땅을 돌아다니며
  - 그 땅을 두루 살피며
  lexicon: HALOT
  rationale: התהלך는 단순 이동보다 이곳저곳을 거니는 뜻이 있어, 측량·답사 맥락을 드러내는 ‘두루 다니며’가 가장 자연스럽습니다.
- source_word: גּוֹרָל
  english_pob_choice: lots
  chosen_korean: 제비
  alternatives_korean:
  - 제비뽑기
  - 몫
  - 운명
  lexicon: HALOT
  rationale: גורל은 분배를 위한 ‘제비’를 뜻하므로, 한국어 성경 문맥에서 익숙하면서도 의식적 행위를 살리는 ‘제비’를 선택했습니다.
theological_decisions:
- issue: 여호와(יְהוָה)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유신명은 번역어로 대체하지 않고 음역해, 언약 이름의 직접성을 보존했습니다. 이 절은 여호수아의 제비뽑기가 야훼 앞에서 이루어짐을 강조합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 제비뽑기의 예배적 장소성
  chosen_reading: 실로에서 야훼 앞에서
  alternative_readings:
  - 실로에서 주님 앞에서
  - 실로에서 하나님의 앞에서
  rationale: לִפְנֵי יְהוָה는 단순한 장소 표지가 아니라 하나님의 임재 앞에서의 공식적 행위를 뜻하므로, ‘야훼 앞에서’로 옮겨 제의적·언약적 뉘앙스를 유지했습니다.
  doctrine_reference: 성경 서사에서 ‘앞에서’(לִפְנֵי) 공식 행위의 임재 표지
