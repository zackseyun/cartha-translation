  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
  footnotes:
  - marker: a
    text: Or 'bounded it' / 'was its boundary.' The Hebrew verb indicates that the Jordan served as the territorial boundary.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Benjamin,' a tribal designation for Benjamin's descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요단강이 동쪽에서 그 경계가 되었습니다[a]. 이것이 사방의 경계에 따라, 그들의 씨족별로 나눈 베냐민 자손[b]의 유산입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것의 경계가 되었습니다’ / ‘그것을 경계 지었습니다.’ 히브리어 동사는 요단강이 영토의 경계로 기능했음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘베냐민의 아들들’이라고 하며, 베냐민의 후손을 가리키는 지파 명칭입니다.
    reason: lexical_alternative
