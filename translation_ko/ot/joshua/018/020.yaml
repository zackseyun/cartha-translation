  text: וְ/הַ/יַּרְדֵּ֥ן יִגְבֹּל אֹת֖/וֹ לִ/פְאַת קֵ֑דְמָ/ה זֹ֡את נַחֲלַת֩ בְּנֵ֨י בִנְיָמִ֧ן לִ/גְבֽוּלֹתֶ֛י/הָ סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
  footnotes:
  - marker: a
    text: Or 'bounded it' / 'was its boundary.' The Hebrew verb indicates that the Jordan served as the territorial boundary.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Benjamin,' a tribal designation for Benjamin's descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요단강이 동쪽 경계가 되었습니다[a]. 이것이 베냐민 자손의 유산이니, 그 사방의 경계대로, 그들의 씨족별입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것의 경계가 되었습니다’ / ‘그것을 경계 지었습니다.’ 히브리어 동사는 요단강이 영토 경계로 기능했음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘베냐민의 아들들’이라고 하며, 베냐민의 후손을 가리키는 지파 명칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  english_pob_choice: And the Jordan
  chosen_korean: 요단강
  alternatives_korean:
  - 요단
  - 요단강
  lexicon: 고유명사 표기
  rationale: 지명으로서 자연스러운 현대 한국어 표현을 택하되, 강임을 분명히 하기 위해 ‘강’을 덧붙였습니다.
- source_word: יִגְבֹּל אֹתוֹ
  english_pob_choice: formed its border
  chosen_korean: 경계가 되었습니다
  alternatives_korean:
  - 경계를 이루었습니다
  - 경계를 정했습니다
  - 그의 경계가 되었습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 위치가 아니라 영토의 경계 기능을 나타내므로, ‘되다’ 표현으로 경계 역할을 분명히 했습니다.
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민의 자손
  - 베냐민 사람들
  lexicon: HALOT
  rationale: 지파 명칭으로 굳어진 성경적 표현을 살리되, 한국어에서 자연스러운 종족/지파 표기를 사용했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별
  alternatives_korean:
  - 그들의 가문별
  - 그들의 가족별
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 가족보다 지파 내부의 씨족 단위를 가리키므로 ‘씨족’이 가장 근접합니다.
theological_decisions:
- issue: 지파 토지 분배의 법적·경계적 의미
  chosen_reading: ‘유산’과 ‘경계’ 표현을 유지해, 단순 거주지가 아니라 언약에 따른 배분된 몫임을 드러냈습니다.
  alternative_readings:
  - ‘소유’로 완화
  - ‘땅’으로만 단순화
  rationale: 여호수아의 분배 문맥에서는 נחלה가 계약적 상속 몫을 가리키므로, 역사적·신학적 의미를 살려야 합니다.
  doctrine_reference: 가나안 분배와 언약적 유업(수 18장)
