theological_decisions:
- issue: 지파 토지 분배의 법적·경계적 의미
  chosen_reading: ‘유산’과 ‘경계’ 표현을 유지해, 단순 거주지가 아니라 언약에 따른 배분된 몫임을 드러냈습니다.
  alternative_readings:
  - ‘소유’로 완화
  - ‘땅’으로만 단순화
  rationale: 여호수아의 분배 문맥에서는 נחלה가 계약적 상속 몫을 가리키므로, 역사적·신학적 의미를 살려야 합니다.
  doctrine_reference: 가나안 분배와 언약적 유업(수 18장)
