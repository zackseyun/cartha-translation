id: JOS.18.15
reference: Joshua 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'toward the sea'; in this geographic context it means 'westward.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the spring of the waters of Nephtoah'; some English translations simplify the Hebrew construction as 'the spring of Nephtoah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽 경계는 기럇여아림의 끝에서 시작하여, 경계는 서쪽으로 나아가 네프트아의 물 샘으로 나아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 의미는 ‘바다 쪽으로’이지만, 이 지리적 문맥에서는 ‘서쪽으로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네프트아의 물 샘’으로 옮길 수 있습니다. 일부 번역은 히브리어의 중첩 구조를 단순화해 ‘네프트아의 샘’으로 풀이합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  english_pob_choice: And the southern side
  chosen_korean: 남쪽 경계
  alternatives_korean:
  - 남쪽 면
  - 남쪽 변두리
  lexicon: HALOT
  rationale: פֵאָה는 ‘쪽/변/면’의 뜻이지만, 경계 절의 문맥에서는 자연스럽게 ‘경계’로 풀어 주는 것이 한국어 지리 서술에 가장 적절합니다.
- source_word: מִקְצֵה קִרְיַת יְעָרִים
  english_pob_choice: from the edge of Kiriath-jearim
  chosen_korean: 기럇여아림의 끝에서 시작하여
  alternatives_korean:
  - 기럇여아림의 가장자리에서
  - 기럇여아림의 경계에서
  lexicon: HALOT
  rationale: קצה는 ‘끝/가장자리’의 뜻이므로 ‘끝에서’로 옮겼고, 경계선의 진행을 드러내기 위해 ‘시작하여’를 보탰습니다.
- source_word: וְיָצָא הַגְּבוּל יָמָּה
  english_pob_choice: and the border went out westward
  chosen_korean: 경계는 서쪽으로 나아가
  alternatives_korean:
  - 경계는 서쪽으로 뻗어
  - 경계는 서쪽으로 나가
  lexicon: HALOT
  rationale: יָצָא는 경계 서술에서 선이 ‘뻗다/나아가다’는 뜻으로 기능하므로, 현대 문체에서 자연스럽고 명확한 ‘나아가’로 옮겼습니다.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  english_pob_choice: the spring of the waters of Nephtoah
  chosen_korean: 네프트아의 물 샘
  alternatives_korean:
  - 네프트아의 물의 샘
  - 네프트아의 샘
  lexicon: HALOT
  rationale: 히브리어의 중첩 소유 구조를 너무 딱딱하게 풀지 않으면서도 ‘מַעְיַן’과 ‘מֵי’를 함께 살리기 위해 ‘물 샘’으로 옮겼습니다.
