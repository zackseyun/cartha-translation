lexical_decisions:
- source_word: הָעַוִּים
  english_pob_choice: Avvim
  chosen_korean: 아빔
  alternatives_korean:
  - 아위임
  - 아빔 사람들
  lexicon: HALOT
  rationale: 성읍 목록의 지명으로 처리한 영어 POB의 판단을 따라 음역했습니다. 히브리어 형태는 민족명으로도 읽힐 수 있지만, 이 문맥에서는 다른 지명들과 함께 나열되는 토지 분배 목록이므로 도시 이름으로 이해하는 것이 자연스럽습니다.
- source_word: הַפָּרָה
  english_pob_choice: Parah
  chosen_korean: 바라
  alternatives_korean:
