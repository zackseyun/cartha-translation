  lexicon: HALOT
  rationale: 문맥상 벤야민 지파의 경계에 있는 지명으로 보고, 한국어 음역은 읽기 쉬운 표준 음가를 반영했습니다. 히브리어 관사 형태는 지명 표기에서 따로 살리지 않았습니다.
- source_word: עָפְרָה
  english_pob_choice: Ophrah
  chosen_korean: 오브라
  alternatives_korean:
  - 오프라
