  lexicon: HALOT
  rationale: 문맥상 벤야민 지파의 경계에 있는 지명으로 보고, 한국어 음역은 읽기 쉬운 표준 음가를 반영했습니다. 히브리어 관사 형태는 지명 표기에서 따로 살리지 않았습니다.
- source_word: עָפְרָה
  english_pob_choice: Ophrah
  chosen_korean: 오브라
  alternatives_korean:
  - 오프라
  - 아프라
  lexicon: HALOT
  rationale: 히브리어 지명 עָפְרָה의 통용 음역을 따르되, 한국어 표기는 발음과 가독성을 고려해 오브라로 옮겼습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - 과
  lexicon: 기본 접속사
  rationale: 히브리어의 반복 접속사는 한국어에서는 나열문으로 자연스럽게 연결하되, 마지막 항목 앞에는 ‘그리고’를 사용해 목록의 종결감을 살렸습니다.
