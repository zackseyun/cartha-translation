  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַ֛ר אֶל כֶּ֥תֶף מוּל הָֽ/עֲרָבָ֖ה צָפ֑וֹנָ/ה וְ/יָרַ֖ד הָ/עֲרָבָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
  footnotes:
  - marker: a
    text: Or 'the plain' for 'the Arabah'; the Hebrew term can function as a common topographical term as well as a regional name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'shoulder,' a topographical metaphor for a side, ridge, or slope.
    reason: cultural_note
translation:
  language: ko
  text: 그것은 아라바 맞은편의 어깨, 곧 북쪽으로 지나가며 아라바로 내려갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָבַר
  english_pob_choice: Then it passed on
  chosen_korean: 그것은 … 지나갑니다
  alternatives_korean:
  - 그것은 … 지나쳐 갑니다
  - 그리고 그것은 … 건너갑니다
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내므로, 단순한 ‘건너다’보다 다음 지점으로 이어지는 이동을 살리는 ‘지나가다’가 적절합니다.
- source_word: כֶּתֶף
  english_pob_choice: the shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 산허리
  - 능선
  - 비탈
  lexicon: HALOT
  rationale: 지형적 은유를 그대로 살려 ‘어깨’로 옮기면, 본문의 구체적 이미지와 POB의 선택을 함께 반영할 수 있습니다.
- source_word: מוּל הָעֲרָבָה צָפֹנָה
  english_pob_choice: opposite the Arabah on the north
  chosen_korean: 아라바 맞은편의 … 북쪽
  alternatives_korean:
  - 아라바 북쪽 맞은편의 …
  - 아라바의 북쪽 맞은편의 …
  lexicon: HALOT
  rationale: מוּל은 단순 방향이 아니라 마주보는 상대적 위치를 나타내므로 ‘맞은편’이 자연스럽고, צָפֹנָה는 동작이 아니라 위치를 보이게 ‘북쪽’으로 처리했습니다.
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 그 평지
  - 요단 계곡
  lexicon: HALOT
  rationale: 여기서는 지형 일반명사이면서 지역명으로도 쓰이므로, 고유 지명성을 보존하는 ‘아라바’를 유지했습니다.
