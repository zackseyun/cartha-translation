  footnotes:
  - marker: ㄱ
    text: 또는 ‘평지’. 히브리어 ‘아라바’는 지역명으로도, 일반적인 지형 명칭으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: ㄴ
    text: 히브리어로는 문자적으로 ‘어깨’이며, 지형의 옆면, 능선 또는 비탈을 비유적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  english_pob_choice: Then it passed on
  chosen_korean: 그것은 … 지나갑니다
  alternatives_korean:
  - 그것은 … 지나쳐 갑니다
  - 그리고 그것은 … 건너갑니다
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내므로, 단순한 ‘건너다’보다 다음 지점으로 이어지는 이동을 살리는 ‘지나가다’가 적절합니다.
- source_word: כֶּתֶף
  english_pob_choice: the shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 산허리
  - 능선
  - 비탈
  lexicon: HALOT
  rationale: 지형적 은유를 그대로 살려 ‘어깨’로 옮기면, 본문의 구체적 이미지와 POB의 선택을 함께 반영할 수 있습니다.
- source_word: מוּל הָעֲרָבָה צָפֹנָה
  english_pob_choice: opposite the Arabah on the north
  chosen_korean: 아라바 맞은편의 … 북쪽
  alternatives_korean:
  - 아라바 북쪽 맞은편의 …
  - 아라바의 북쪽 맞은편의 …
  lexicon: HALOT
  rationale: מוּל은 단순 방향이 아니라 마주보는 상대적 위치를 나타내므로 ‘맞은편’이 자연스럽고, צָפֹנָה는 동작이 아니라 위치를 보이게 ‘북쪽’으로 처리했습니다.
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 그 평지
  - 요단 계곡
  lexicon: HALOT
  rationale: 여기서는 지형 일반명사이면서 지역명으로도 쓰이므로, 고유 지명성을 보존하는 ‘아라바’를 유지했습니다.
