source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
  footnotes:
  - marker: a
    text: Hebrew 'the Valley of the son of Hinnom'; rendered 'Ben-hinnom' here as a place name.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the southern shoulder/side of the Jebusite'; 'the Jebusite city' makes explicit the likely reference to the Jebusite settlement, that is, Jerusalem, in this boundary description.
    reason: lexical_alternative
  - marker: c
    text: En-rogel is a place name; literally, 'spring of Rogel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 경계는 산의 끝, 곧 벤-힌놈 골짜기 앞에 있는 곳까지 내려갔습니다[a]. 그곳은 르바임 골짜기의 북쪽 끝에 있습니다. 그러고 나서 그것은 힌놈 골짜기를 따라 예부스 사람의 남쪽 비탈[b]로 내려갔고, 엔-로겔까지 내려갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘힌놈의 아들의 골짜기’라는 뜻입니다. 여기서는 지명으로 기능하므로 ‘벤-힌놈’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예부스 사람의 남쪽 어깨/쪽’. 문맥상 예루살렘의 예부스인 정착지를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 엔-로겔은 지명입니다. 문자적으로는 ‘로겔의 샘’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  english_pob_choice: Then the border went down
  chosen_korean: 경계는 … 내려갔습니다
  alternatives_korean:
  - 경계가 내려갔습니다
  - 경계선이 내려갔습니다
  lexicon: HALOT
  rationale: 경계 묘사에서 ירד의 지형적 의미를 살려 ‘내려가다’로 옮기고, גְּבוּל은 ‘경계’로 자연스럽게 표현했습니다.
- source_word: גֵּי בֶן־הִנֹּם
  english_pob_choice: the Valley of Ben-hinnom
  chosen_korean: 벤-힌놈 골짜기
  alternatives_korean:
  - 힌놈의 아들의 골짜기
  - 벤힌놈 골짜기
  lexicon: HALOT
  rationale: 지명으로 기능하므로 직역보다 음역을 따르되, 한국어에서 읽기 쉬운 하이픈 표기를 사용했습니다.
- source_word: כֶּתֶף הַיְבוּסִי נֶגְבָּה
  english_pob_choice: the southern slope of the Jebusite
  chosen_korean: 예부스 사람의 남쪽 비탈
  alternatives_korean:
  - 예부스 사람의 남쪽 어깨
  - 예부스 사람의 남쪽 기슭
  lexicon: HALOT
  rationale: כֶּתֶף은 문자적으로 ‘어깨’이지만 지형 문맥에서는 비탈/옆면이 자연스러우므로 ‘비탈’로 옮겼습니다. מקור에 없는 ‘성읍’은 넣지 않았습니다.
- source_word: עֵין רֹגֵל
  english_pob_choice: En-rogel
  chosen_korean: 엔-로겔
  alternatives_korean:
  - 로겔 샘
  - 엔로겔
  lexicon: HALOT
  rationale: 고유 지명으로서 음역을 유지했습니다. ‘샘’의 어원은 본문 주석이 아닌 본문 밖 정보이므로 본문에는 드러내지 않았습니다.
theological_decisions:
- issue: 지명과 경계 서술의 직역도
  chosen_reading: 본문의 지형·경계 묘사를 평이한 현대 한국어로 옮기되, 지명은 가능한 한 음역을 유지했습니다.
  alternative_readings:
  - 더 문어적인 경계선 기술
  - 지명을 뜻풀이로 바꾸는 방식
  rationale: 여호수아의 경계 목록은 역사·지리 정보가 핵심이므로, 의미를 풀어쓰기보다 원문이 보여 주는 지명 배열과 이동 방향을 보존하는 것이 우선입니다.
  doctrine_reference: 성경 본문의 역사적·지리적 구체성 보존
