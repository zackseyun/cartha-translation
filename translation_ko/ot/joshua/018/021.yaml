  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
  footnotes:
  - marker: a
    text: Or possibly 'Valley of Keziz,' if the name is understood as a descriptive place-name rather than transliterated as a proper noun.
