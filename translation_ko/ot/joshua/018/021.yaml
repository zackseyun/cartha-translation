source:
  edition: WLC
  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
  footnotes:
  - marker: a
    text: Or possibly 'Valley of Keziz,' if the name is understood as a descriptive place-name rather than transliterated as a proper noun.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 베냐민 자손의 지파에 속한 성읍들은, 그들의 종족대로 여리고와 벧호글라와 에메크게집이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 이 이름을 설명적 지명으로 이해하면 ‘게집의 골짜기’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  english_pob_choice: belonging to the tribe of the sons of Benjamin
  chosen_korean: 베냐민 자손의 지파에 속한
  alternatives_korean:
  - 베냐민 자손의 지파의
  - 베냐민 자손의 지파에 속한 성읍들은
  lexicon: HALOT
  rationale: לְ + מַטֶּה는 분배·소속의 의미를 가지므로, 단순 소유격보다 ‘~에 속한’이 분배 맥락을 더 분명히 드러냅니다.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 부족 내부의 하위 단위를 가리키므로, 현대 한국어에서는 ‘종족’보다 ‘종족/씨족’ 계열이 가장 가깝지만, 문맥상 행정적 분배의 기준을 살려 ‘그들의 종족대로’로 옮겼습니다.
- source_word: בֵית חָגְלָה
  english_pob_choice: Beth-hoglah
  chosen_korean: 벧호글라
  alternatives_korean:
  - 벧 호글라
  - 베트호글라
  lexicon: HALOT
  rationale: 지명은 음역을 따르며, בית- 복합지명의 관행을 반영해 한국어 성서 표기에서 익숙한 ‘벧-’을 사용했습니다.
- source_word: עֵמֶק קְצִיץ
  english_pob_choice: Emek-keziz
  chosen_korean: 에메크게집
  alternatives_korean:
  - 에메크-게집
  - 게집 골짜기
  lexicon: HALOT
  rationale: POB가 본문에서 지명으로 처리하므로, 뜻풀이(‘골짜기’)보다 고유명사 음역을 유지해 지명성을 보존했습니다.
