source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֧ם הַ/גְּב֛וּל לִ/פְאַ֥ת צָפ֖וֹנָ/ה מִן הַ/יַּרְדֵּ֑ן וְ/עָלָ֣ה הַ/גְּבוּל֩ אֶל כֶּ֨תֶף יְרִיח֜וֹ מִ/צָּפ֗וֹן וְ/עָלָ֤ה בָ/הָר֙ יָ֔מָּ/ה ו/היה תֹּֽצְאֹתָ֔י/ו מִדְבַּ֖רָ/ה בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
  footnotes:
  - marker: a
    text: Hebrew 'shoulder of Jericho,' a geographical expression meaning its side or slope.
    reason: lexical_alternative
  - marker: b
    text: Or 'its extremities' or 'its outgoings'; the Hebrew uses a plural topographical term for the border's endpoint(s).
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 북쪽 경계는 요단강에서 시작하였고, 경계는 여리고의 북쪽 어깨로 올라간 뒤, 서쪽으로 산지로 올라가며, 그 끝은 벧아웬 광야에 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘여리고의 어깨’는 그 지형의 옆면이나 비탈을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 경계의 종착을 가리키는 복수형 지형 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  english_pob_choice: on the north side
  chosen_korean: 북쪽
  alternatives_korean:
  - 북쪽 면
  - 북변
  lexicon: HALOT
  rationale: 경계 묘사에서 פאה는 ‘쪽/면’의 뜻이지만, 한국어에서는 ‘북쪽 경계’가 자연스럽고 의미를 충분히 살립니다.
- source_word: כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  english_pob_choice: the northern slope of Jericho
  chosen_korean: 여리고의 북쪽 어깨
  alternatives_korean:
  - 여리고의 북쪽 비탈
  - 여리고의 북쪽 비탈면
  lexicon: HALOT
  rationale: כֶּתֶף는 문자적으로 ‘어깨’이지만 지형 표현으로는 비탈/경사면을 가리킵니다. 다만 POB의 지형 은유를 살려 직역적 이미지인 ‘어깨’를 유지했습니다.
- source_word: בָהָר יָמָּה
  english_pob_choice: into the hill country westward
  chosen_korean: 서쪽으로 산지로
  alternatives_korean:
  - 서쪽으로 산간지대로
  - 서쪽 산지로
  lexicon: HALOT
  rationale: הָר은 여기서 단일 산보다 집합적 지형인 ‘산지’가 자연스럽고, יָמָּה는 방향 부사로 ‘서쪽으로’가 적절합니다.
- source_word: תֹּצְאֹתָיו
  english_pob_choice: its end
  chosen_korean: 그 끝
  alternatives_korean:
  - 그 경계의 끝
  - 그 외곽
  lexicon: HALOT
  rationale: 경계 공식에서 תוצאות은 종착점/끝을 뜻하므로, 한국어에서는 간결하게 ‘그 끝’으로 옮겼습니다.
- source_word: מִדְבַּר בֵּית אָוֶן
  english_pob_choice: the wilderness of Beth-aven
  chosen_korean: 벧아웬 광야
  alternatives_korean:
  - 벧아웬의 광야
  - 벧아웬 황야
  lexicon: HALOT
  rationale: 지명은 음역하고, מִדְבָּר는 본문 관례에 따라 ‘광야’로 번역했습니다.
