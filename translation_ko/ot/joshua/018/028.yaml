  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Jebusite, it is Jerusalem.'' The gentilic form ''Jebusite'' is used here as a place designation for Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: Some translations render 'Haeleph' as 'Eleph' and 'Gibeath' as 'Gibeah.'
    reason: alternative_reading
  - marker: c
    text: The Hebrew text reads 'Kiriath,' not 'Kiriath-jearim' in this verse.
    reason: textual_variant
translation:
  language: ko
  text: 셀라, 하엘렙[b], 여부스인(곧 예루살렘)[a], 기브앗[b], 기럇[c]—도시 열네 곳과 그 딸린 마을들입니다. 이것은 베냐민 자손이 그 씨족별로 받은 기업입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘여부스인, 그것은 예루살렘’입니다. 여기서 ‘여부스인’은 예루살렘을 가리키는 지명적 표지로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 ‘하엘렙’을 ‘엘렙’으로, ‘기브앗’을 ‘기브아’로 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 본문은 이 절에서 ‘기럇’만 읽으며, ‘기럇여아림’은 아닙니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/צֵלַע
  english_pob_choice: Zela
  chosen_korean: 셀라
  alternatives_korean:
  - 젤라
  - 제라
  lexicon: HALOT
  rationale: 고유 지명으로 보고 음역했습니다. 영어 POB의 Zela에 대응하되, 한국어에서는 ‘셀라’가 가장 자연스럽고 간결한 음역입니다.
- source_word: הָאֶלֶף
  english_pob_choice: Haeleph
  chosen_korean: 하엘렙
  alternatives_korean:
  - 엘렙
  - 하엘프
  lexicon: HALOT
  rationale: 정관사까지 포함된 지명형을 반영해 음역했습니다. 전통적 관용형보다 원문 형태를 드러내는 쪽을 택했습니다.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  english_pob_choice: the Jebusite (that is, Jerusalem)
  chosen_korean: 여부스 사람(곧 예루살렘)
  alternatives_korean:
  - 여부스 사람, 곧 예루살렘
  - 여부스(곧 예루살렘)
  lexicon: HALOT
  rationale: 히브리어의 ‘여부스 사람, 그것은 예루살렘이다’라는 설명적 동격을 살렸습니다. גֶּנ틸릭 형식을 지명 표지로 기능하는 용법까지 반영하기 위해 ‘여부스 사람’을 유지했습니다.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  english_pob_choice: fourteen cities
  chosen_korean: 도시 열네 곳
  alternatives_korean:
  - 열네 도시
  - 성읍 열네 곳
  lexicon: HALOT
  rationale: 수량 요약구로서의 기능을 살리되, 한국어에서는 ‘도시’보다 목록 요약에 자연스러운 ‘곳’을 붙여 읽히도록 했습니다.
- source_word: וְ/חַצְרֵי/הֶן
  english_pob_choice: with their villages
  chosen_korean: 그 마을들
  alternatives_korean:
  - 그 촌락들
  - 그 주변 마을들
  lexicon: HALOT
  rationale: 알롯 문맥의 חָצֵר를 독립 마을/부속 정착지로 이해하여 자연스럽게 옮겼습니다. 앞의 수량 요약과 결합될 때 한국어에서는 ‘마을들’이 가장 직관적입니다.
- source_word: לְ/מִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 종족별
  alternatives_korean:
  - 씨족별로
  - 가문별로
  lexicon: HALOT
  rationale: 베냐민 지파의 분배 단위를 가리키는 문맥이므로 ‘clans’를 ‘종족’으로 옮겨 혈연-지파 단위를 분명히 했습니다.
theological_decisions:
- issue: 지명 목록에서 ‘여부스 사람’과 ‘예루살렘’의 관계를 어떻게 드러낼지
  chosen_reading: ‘여부스 사람(곧 예루살렘)’으로 두어, 지명 목록 안에서 설명적 동격임을 분명히 했습니다.
  alternative_readings:
  - ‘여부스 사람, 곧 예루살렘’
  - ‘여부스(곧 예루살렘)’
  rationale: 원문은 단순 식별이 아니라 ‘이곳이 곧 예루살렘’이라는 해설을 포함합니다. 이를 약화하지 않기 위해 괄호로 보충 설명을 유지했습니다.
  doctrine_reference: 본문 관찰/지명 주해
