review_pass:
  verdict: revise
  source_fidelity: 히브리어의 지명 목록, ‘열네 성읍과 그 마을들’, 그리고 베냐민 자손의 씨족별 기업이라는 결구는 대체로 충실히 반영되었습니다. 다만 הַיְבוּסִי는 형식상 ‘여부스인’이지만 이 지명 목록에서는 예루살렘을 가리키는 지명적 용법이므로, ‘여부스 사람’보다 ‘여부스인’이 원문의 형태와 한국어의 관례를 더 정확히 반영합니다.
  naturalness: ‘여부스 사람’은 도시 목록 안에서 사람을 열거하는 듯하게 들립니다. ‘여부스인(곧 예루살렘)’은 원문의 형식을 보존하면서도 그 특수한 지명적 용법을 각주로 설명하기에 적절합니다. ‘종족별 유산’은 다소 행정적이고 ‘종족’은 tribe와 혼동될 수 있으므로, מִשְׁפָּחוֹת의 통상적 의미를 따라 ‘씨족별 기업’으로 다듬었습니다.
  terminology: נַחֲלָה는 여호수아의 토지 분배 문맥에서 ‘유산’보다 ‘기업’이 한국어 성경 용례 및 의미상 더 적절합니다. מִשְׁפָּחוֹת는 지파 내부 단위이므로 ‘씨족’이 ‘종족’보다 정확합니다. 기존 각주 표지는 내용이 가리키는 어휘에 직접 붙도록 바로잡았습니다.
