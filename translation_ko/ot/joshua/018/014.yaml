  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Judah,' a tribal designation meaning the people/descendants of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 경계는 서쪽 편을 향해 남쪽으로 돌아, 남쪽에 있는 벧호론을 마주하는 산에서 시작하여, 그 끝이 기럇바알, 곧 기럇여아림에 이르렀습니다. 그것은 유다의 자손의 성읍이었습니다. 이것이 서쪽 편이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다의 자손’은 남성만을 가리키는 말이 아니라 유다 지파 전체를 뜻하는 족속·공동체 명칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  english_pob_choice: Then the border extended
  chosen_korean: 경계는
  alternatives_korean:
  - 경계가 펼쳐졌습니다
  - 경계가 이어졌습니다
  - 경계선은
  lexicon: HALOT
  rationale: 경계의 진행을 자연스럽게 풀어 옮기되, 경계 묘사의 지리적 문맥을 살리기 위해 ‘경계’와 동작 서술을 유지했습니다.
- source_word: וְנָסַב לִפְאַת יָם נֶגְבָּה
  english_pob_choice: turned on the west side southward
  chosen_korean: 서쪽 편을 향해 남쪽으로 돌아
  alternatives_korean:
  - 서쪽 편으로 남쪽을 향해 돌아
  - 서쪽으로 돌아 남쪽으로
  - 서쪽 편을 따라 남쪽으로 돌아
  lexicon: HALOT
  rationale: לִפְאַת יָם은 서쪽 면을 뜻하는 경계 관용구이고, נֶגְבָּה는 남쪽 방향을 나타내므로 두 방향 정보를 모두 드러내는 표현을 택했습니다.
- source_word: אֲשֶׁר עַל פְּנֵי בֵית חֹרוֹן ... נֶגְבָּה
  english_pob_choice: that faces Beth-horon on the south
  chosen_korean: 남쪽에 있는 벧호론을 마주하는
  alternatives_korean:
  - 남쪽의 벧호론을 마주하는
  - 벧호론 남쪽을 마주하는
  - 남쪽에서 벧호론을 향하는
  lexicon: HALOT
  rationale: עַל פְּנֵי는 지리 묘사에서 ‘마주하는/앞에 있는’ 뜻이므로, 대상 지명과 남쪽 표지를 함께 살린 직역형을 택했습니다.
- source_word: וְהָיָה תֹצְאֹתָיו
  english_pob_choice: and its end was
  chosen_korean: 그 끝이
  alternatives_korean:
  - 그 종착점이
  - 그 나가는 곳이
  - 그 경계의 끝이
  lexicon: HALOT
  rationale: תֹצְאֹתָיו는 경계의 종착점을 가리키는 관용구이므로, 한국어에서는 문맥상 자연스러운 ‘끝’으로 옮겼습니다.
- source_word: קִרְיַת בַּעַל ... קִרְיַת יְעָרִים
  english_pob_choice: Kiriath-baal (that is, Kiriath-jearim)
  chosen_korean: 기럇바알, 곧 기럇여아림
  alternatives_korean:
  - 기럇바알, 즉 기럇여아림
  - 기럇바알(곧 기럇여아림)
  - 기랏바알, 곧 기랏여아림
  lexicon: HALOT
  rationale: 동일 지명의 이명 관계를 본문 안에서 분명히 하기 위해 ‘곧’을 사용했으며, 고유명사는 표기 관행에 따라 음역했습니다.
- source_word: עִיר בְּנֵי יְהוּדָה
  english_pob_choice: a city of the sons of Judah
  chosen_korean: 유다의 자손의 성읍이었습니다
  alternatives_korean:
  - 유다 자손의 성읍이었습니다
  - 유다 사람들의 성읍이었습니다
  - 유다 지파의 성읍이었습니다
  lexicon: HALOT
  rationale: בְּנֵי יְהוּדָה는 문자적으로 ‘유다의 자손’이지만, 여기서는 지파 소속을 가리키는 지리·행정 표현이므로 그 구조를 유지했습니다.
theological_decisions:
- issue: 본절의 지리 목록과 반복 종결구의 문체
  chosen_reading: 본문의 경계 서술을 사건 설명보다 측량·정의의 문체로 옮겨, 반복되는 방향어와 종결구를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 매끈한 서술형으로 압축
  - 경계의 세부를 일부 생략
  rationale: 이 절은 신학적 논증보다 지파 경계의 정확한 지정이 핵심이므로, 원문이 가진 반복성과 공간적 정밀성을 보존하는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 본문 장르 보존 및 지리 서술의 문맥 충실성
