  to: 그러고 나서 경계선은 벧호론 남쪽을 마주 보는 산에서부터 서쪽 편으로 남쪽을 향해 굽어 돌아갔으며, 그 끝은 유다의 자손[a]의 성읍인 기럇바알, 곧 기럇여아림에 이르렀습니다. 이것이 서쪽 편이었습니다.
