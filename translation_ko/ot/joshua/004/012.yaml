source:
  edition: WLC
  text: וַ֠/יַּעַבְרוּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֨י שֵׁ֤בֶט הַֽ/מְנַשֶּׁה֙ חֲמֻשִׁ֔ים לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
  footnotes:
  - marker: a
    text: Or 'the Reubenites, the Gadites, and the half-tribe of Manasseh.' The Hebrew more literally reads 'the sons of Reuben ... the sons of Gad ...'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' The Hebrew more literally reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: '''Armed'' renders a Hebrew term that can denote being equipped or arranged for battle; some have proposed a more literal sense such as ''arrayed in ranks.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤의 자손과 갓의 자손과 므낫세 반 지파는 모세가 그들에게 말한 그대로 이스라엘 자손 앞에서 무장한 채 건넜습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘르우벤의 자손 … 갓의 자손 …’이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 더 문자적으로 ‘이스라엘 자손’이라고 읽습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘무장한’은 히브리어가 전투를 위한 준비나 편제를 나타낼 수 있는 표현을 옮긴 것입니다. 더 문자적으로는 ‘전투 대형으로’도 가능하지만, 여기서는 문맥상 군사적 준비 상태가 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  english_pob_choice: the sons of Reuben / the sons of Gad
  chosen_korean: 르우벤의 자손 / 갓의 자손
  alternatives_korean:
  - 르우벤 사람들 / 갓 사람들
  - 르우벤 지파 사람들 / 갓 지파 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조인 ‘자손’을 살리되, 한국어에서 자연스럽게 읽히도록 소유격으로 옮겼습니다.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반 지파
  - 므낫세 지파의 절반
  lexicon: HALOT
  rationale: 지파 단위의 고정된 표현을 유지하면서도 한국어에서 가장 간결하고 관용적으로 읽히는 형태로 옮겼습니다.
- source_word: חֲמֻשִׁים
  english_pob_choice: armed
  chosen_korean: 무장한 채
  alternatives_korean:
  - 전투 대형으로
  - 전쟁을 위해 갖추고
  lexicon: HALOT
  rationale: 이 단어는 전투 준비 상태를 가리키며, 영어 POB가 ‘armed’로 처리한 군사적 상태를 한국어에서는 ‘무장한 채’로 자연스럽게 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘인들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 보존하면서도 한국어 성경 문체에서 익숙한 ‘이스라엘 자손’을 사용했습니다.
theological_decisions:
- issue: 모세의 선행 발언과의 일치 표현
  chosen_reading: ‘모세가 그들에게 말한 그대로’로 번역해 순종과 일치의 강조를 살렸습니다.
  alternative_readings:
  - 모세가 그들에게 일러준 대로
  - 모세가 그들에게 명한 대로
  rationale: דִּבֶּר אֲלֵיהֶם은 단순 발화보다 앞선 지시/언급을 포함할 수 있지만, 본문은 그 명령을 직접 추가하지 않고 ‘말한 그대로’로 충실히 반영하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 충실성(원문 의미의 보존)
