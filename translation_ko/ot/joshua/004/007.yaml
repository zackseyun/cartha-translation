  to: 그들에게 이렇게 말하십시오. “야훼의 언약궤 앞에서 요단의 물이 끊어졌습니다. 언약궤가 요단을 건널 때에 요단의 물이 끊어졌습니다.” 이 돌들은 이스라엘 자손에게[a] 영원한 기념물이 될 것입니다.
  rationale: 명령을 도입하는 문장을 현대 합쇼체에 맞게 다듬고, ‘건널 때’의 주어가 언약궤임을 명시했습니다. ‘이스라엘 자손’은 한국어 성경 문체에서 자연스러운 집단 호칭이며, 히브리어의 직역 형태는 각주로 보존했습니다. 물의 반복, 언약궤 앞에서 일어난 사건, 영속적인 기념이라는 원문의 구조와 의미는 유지했습니다.
