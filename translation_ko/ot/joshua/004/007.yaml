  naturalness: ‘그들에게 이렇게 말하십시오’와 ‘언약궤가 요단을 건널 때’가 현대 표준어 합쇼체에서 더 자연스럽고 분명합니다. ‘이스라엘의 아들들’은 직역으로는 가능하나 한국어 본문에서는 부자연스러우므로 관용적인 ‘이스라엘 자손’으로 옮기고 직역을 각주로 밝히는 것이 적절합니다.
  terminology: ‘야훼’, ‘언약궤’, ‘기념물’은 일관되고 적절합니다. לִבְנֵי יִשְׂרָאֵל의 남성 복수 형태는 본문에서 ‘이스라엘 자손’으로 자연스럽게 처리하되 각주에서 ‘이스라엘의 아들들’이라는 직역을 제시합니다.
