  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
  footnotes:
  - marker: a
    text: Or 'for the children of Israel' or 'for the Israelites.' The Hebrew reads 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들에게 말하여야 합니다. “야훼의 언약궤 앞에서 요단 물이 끊어졌습니다. 그것이 요단을 건널 때에 요단 물이 끊어졌습니다.” 그리고 이 돌들은 이스라엘의 아들들에게 영원히 기념물이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵי / מֵי
  english_pob_choice: the waters of
  chosen_korean: 물이
  alternatives_korean:
  - 요단의 물이
  - 요단 강물이
  lexicon: HALOT
  rationale: 히브리어의 복수형 관용을 한국어에서는 자연스럽게 단수로 풀어도 되므로, 반복되는 ‘요단 물’로 간결하게 살렸습니다.
- source_word: נִכְרְתּוּ
  english_pob_choice: were cut off
  chosen_korean: 끊어졌습니다
  alternatives_korean:
  - 잘려 나갔습니다
  - 멈추었습니다
  lexicon: HALOT
  rationale: 물길이 중단되었다는 뜻을 한국어 동사 ‘끊어지다’로 직접 옮겨, 반복되는 문장의 강한 단절감을 살렸습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 주님의 언약궤
  lexicon: HALOT
  rationale: 완전한 관용구이므로 한국어에서도 ‘언약궤’로 옮기되, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘의 아들들에게
  alternatives_korean:
  - 이스라엘 자손에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성을 반영하여 ‘아들들’로 옮겼고, 문맥상 수신 대상을 자연스럽게 드러내기 위해 여격으로 처리했습니다.
- source_word: לְזִכָּרוֹן
  english_pob_choice: a memorial
  chosen_korean: 기념물
  alternatives_korean:
  - 기억
  - 기념
  - 추모물
  lexicon: HALOT
  rationale: 돌의 기능이 단순한 ذهن적 ‘기억’이 아니라 세워진 표지이므로, 지속적 기념 기능을 드러내는 ‘기념물’이 가장 적절합니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 고유명을 제목어로 치환하지 않고 고유명 자체를 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 문장 종결의 예고/명령 뉘앙스
  chosen_reading: 그러면 그들에게 말하여야 합니다
  alternative_readings:
  - 그들에게 말해야 합니다
  - 그들에게 말할 것입니다
  rationale: 히브리어의 지시적 예고를 한국어 합쇼체로 자연스럽게 풀어, 후속 설명을 이끄는 명령적-예고적 톤을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
