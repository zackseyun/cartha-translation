source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אֲשֶׁר֩ יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ אֶת אֲבוֹתָ֣/ם לֵ/אמֹ֔ר מָ֖ה הָ/אֲבָנִ֥ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
  footnotes:
  - marker: a
    text: Or, more interpretively, “What do these stones mean?” The Hebrew reads more literally, “What are these stones?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your sons.” Here the expression likely refers to descendants or children generally.
    reason: lexical_alternative
  - marker: c
    text: Hebrew “tomorrow,” used idiomatically here for a future time or later generation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이스라엘 자손에게 말했습니다. “장차 너희 자손이 자신들의 아버지들에게 ‘이 돌들은 무엇입니까?’ 하고 물을 때,”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이 돌들은 무엇입니까?”입니다. 문맥상 그 의미를 묻는 말로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘너희 자손’은 문자적으로는 ‘너희 아들들’이지만, 여기서는 후대 세대를 가리키는 일반 표현으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘장차’는 히브리어 ‘내일’이 이 문맥에서 미래의 때를 가리키는 관용이라는 점을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 ... 말하여 이르되
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 뒤이은 직접 화법을 분명히 여는 한국어 관용으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적·언약적 표현을 투명하게 살리기 위해 ‘자손’을 택했습니다.
- source_word: בְּנֵיכֶם / אֶת אֲבוֹתָם
  english_pob_choice: your children ... their fathers
  chosen_korean: 너희 자손이 자기 아버지들에게
  alternatives_korean:
  - 너희 자녀가 그들의 아버지들에게
  - 너희 아들들이 그들의 아버지들에게
  lexicon: HALOT
  rationale: 문맥상 후대 세대가 이전 세대에게 묻는 장면을 살리되, משפחה(가족) 관계를 유지하기 위해 ‘자손’과 ‘자기 아버지들’을 사용했습니다.
- source_word: מָחָר
  english_pob_choice: in time to come
  chosen_korean: 장차
  alternatives_korean:
  - 내일
  - 훗날
  lexicon: HALOT
  rationale: 달력상의 ‘내일’이 아니라 후대의 미래를 가리키는 관용이므로 한국어에서도 시간적 미래를 나타내는 표현으로 옮겼습니다.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  english_pob_choice: What are these stones?
  chosen_korean: 이 돌들은 무엇입니까?
  alternatives_korean:
  - 이 돌들은 무슨 뜻입니까?
  - 이 돌들은 무엇을 의미합니까?
  lexicon: HALOT
  rationale: 히브리어의 직접적인 식별 질문을 본문에 보존하고, 해석적 확장은 주석 여지로 남겼습니다.
theological_decisions:
- issue: 기념 돌에 대한 질문의 성격
  chosen_reading: 본문은 표면적으로는 돌의 정체를 묻는 식별 질문으로 유지하고, 의미 해석은 문맥과 주석으로 드러나게 합니다.
  alternative_readings:
  - ‘이 돌들은 무슨 뜻입니까?’처럼 해석 질문으로 본문에 드러내기
  rationale: 히브리어와 기존 영어 POB가 모두 ‘What are these stones?’의 직역성을 우선하므로, 본문에서는 과도한 해석을 덧씌우지 않았습니다.
  doctrine_reference: source transparency / minimal interpretation
