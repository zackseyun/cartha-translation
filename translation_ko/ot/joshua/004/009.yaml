  to: 여호수아는 요단 가운데, 언약궤를 메고 있던 제사장들이 발을 딛고 서 있던 자리 아래에[a] 열두 돌을 세웠습니다. 그 돌들은 오늘까지 거기에 있습니다.
  rationale: 위치구를 ‘열두 돌을 세웠습니다’에 직접 연결하여 히브리어의 수식 관계를 명확히 했습니다. ‘발을 딛고 서 있던 자리’는 원문의 구체적인 위치 관계를 유지하면서 현대 표준 한국어로 자연스럽게 표현합니다. ‘오늘까지’와 현재형은 서술자 시점에서의 지속을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:18Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 원문의 단일 문장 구조에서 ‘열두 돌을 세운’ 위치를 수식하는 ‘아래에’를 독립 서술문(‘이는 … 아래였습니다’)으로 분리하면, 무엇이 그 아래에 있었는지가 문법적으로 불분명해집니다.
  naturalness: ‘이는 언약궤를 멘 제사장들의 발이 선 자리 아래였습니다’는 현대 한국어로 지시 대상과 문장 연결이 어색합니다. 위치구를 ‘세웠습니다’에 직접 연결하고, ‘발이 선 자리’는 자연스러운 표현인 ‘발을 딛고 서 있던 자리’로 다듬는 것이 좋습니다.
  terminology: ‘여호수아’, ‘요단’, ‘언약궤’, ‘제사장’, ‘열두 돌’은 적절합니다. נֹשְׂאֵי의 의미는 ‘언약궤를 메고 있던’으로 자연스럽게 보존할 수 있습니다.
  issues:
