id: JOS.4.9
reference: Joshua 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
  footnotes:
  - marker: a
    text: Or 'beneath the standing-place of the feet of the priests.' The Hebrew expression is very literal and refers to the spot where the priests stood while carrying the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 요단 가운데, 언약궤를 메고 있던 제사장들이 발을 딛고 서 있던 자리 아래에[a] 열두 돌을 세웠습니다. 그 돌들은 오늘까지 거기에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘언약궤를 멘 제사장들의 발이 선 자리 아래에’입니다. 이 표현은 제사장들이 언약궤를 메고 서 있던 지점을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: הֵקִים
  english_pob_choice: set up
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 들어 올렸습니다
  - 설치했습니다
  lexicon: HALOT
  rationale: 기념석을 세우는 문맥에서 הֵקִים의 결과 상태를 자연스럽게 살리면서도 과도하게 기계적이지 않게 옮겼습니다.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  english_pob_choice: in the midst of the Jordan
  chosen_korean: 요단 가운데에
  alternatives_korean:
  - 요단 한가운데에
  - 요단 속에
  lexicon: HALOT
  rationale: ‘가운데’가 히브리어의 공간적 중심성과 서술의 장중한 어조를 함께 살리므로 기본 표현으로 택했습니다.
- source_word: תַּחַת מַצַּב רַגְלֵי
  english_pob_choice: under the place where the feet ... stood
  chosen_korean: 발이 선 자리 아래였습니다
  alternatives_korean:
  - 발이 선 곳 아래였습니다
  - 발이 서 있던 자리 아래였습니다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘발이 선 자리’라는 위치 관계를 보존해, 언약궤를 멘 제사장들이 서 있던 정확한 지점을 드러냈습니다.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  english_pob_choice: and they are there to this day
  chosen_korean: 오늘까지 거기에 있습니다
  alternatives_korean:
  - 오늘날까지 거기에 있습니다
  - 지금까지 거기에 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 현재 지속 표현으로 옮겨, 서술자의 현재 시점에서 이어지는 기념 표지를 살렸습니다.
theological_decisions:
- issue: 요단 가운데 세운 열두 돌과 본문 주변의 다른 기념석 전승 사이의 긴장
  chosen_reading: 본문의 진술을 그대로 살려, 여호수아가 요단 가운데 열두 돌을 세웠다고 번역했습니다.
  alternative_readings:
  - 다른 장소에 옮겨 세운 돌을 요약적으로 이해하기
  - 조화시키기 위해 본문을 완화해 번역하기
  rationale: 히브리어 본문은 돌들이 ‘요단 가운데’ 세워졌다고 분명히 말하므로, 번역은 그 진술을 보존하고 조화 해석은 주석의 영역에 남겨 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עַד הַיּוֹם הַזֶּה의 시간 감각
  chosen_reading: 서술자의 현재를 기준으로 한 지속 상태로 번역했습니다.
  alternative_readings:
  - 오늘날까지라는 말의 역사적 지속만 강조하기
  - 과거형으로 단순화하기
  rationale: ‘오늘까지’는 본문의 기념적·증언적 성격을 살리며, 현재형 ‘있습니다’는 서술자의 시점을 자연스럽게 반영합니다.
  doctrine_reference: Translation philosophy §1, §6
