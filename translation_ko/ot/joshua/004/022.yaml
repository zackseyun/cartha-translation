source:
  edition: WLC
  text: וְ/הוֹדַעְתֶּ֖ם אֶת בְּנֵי/כֶ֣ם לֵ/אמֹ֑ר בַּ/יַּבָּשָׁה֙ עָבַ֣ר יִשְׂרָאֵ֔ל אֶת הַ/יַּרְדֵּ֖ן הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
  footnotes:
  - marker: a
    text: Or 'your sons,' if the phrase is taken more narrowly; the Hebrew can denote male children specifically or children more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 자녀들에게 알리십시오[a]. “이스라엘이 마른 땅으로 이 요단을 건넜다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아들들’로 더 좁게 옮길 수 있습니다. 히브리어는 남자 자녀를 가리킬 수도 있고 자녀 일반을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  english_pob_choice: then you shall let ... know
  chosen_korean: 알리십시오
  alternatives_korean:
  - 알게 하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: הוֹדַעְתֶּם은 ‘알게 하다, 알리다’의 사역형이므로, 현대 한국어에서는 자연스럽고 간결한 ‘알리십시오’가 causative 의미를 잘 살립니다.
- source_word: בְּנֵיכֶם
  english_pob_choice: your children
  chosen_korean: 자녀들에게
  alternatives_korean:
  - 아들들에게
  - 너희 아들들에게
  lexicon: HALOT
  rationale: בנים은 문맥에 따라 ‘아들들’일 수도 있지만, 여기서는 다음 세대 전체를 가리키는 기억 전승 명령이므로 ‘자녀들’이 더 넓고 적절합니다.
- source_word: בַּיַּבָּשָׁה
  english_pob_choice: on dry ground
  chosen_korean: 마른 땅으로
  alternatives_korean:
  - 마른 땅 위로
  - 마른 땅에서
  lexicon: HALOT
  rationale: 히브리어 표현은 물이 없는 상태의 마른 지면을 가리키며, 한국어에서는 이동의 결과를 드러내는 ‘마른 땅으로’가 ‘건너다’와 가장 자연스럽게 결합합니다.
- source_word: עָבַר אֶת הַיַּרְדֵּן
  english_pob_choice: crossed this Jordan
  chosen_korean: 이 요단을 건넜다
  alternatives_korean:
  - 이 요단을 건넜습니다
  - 이 요단을 지나갔다
  lexicon: HALOT
  rationale: עבר + 목적어는 ‘건너다’가 가장 직접적으로 대응하며, ‘이 요단’의 지시성도 그대로 살립니다.
theological_decisions:
- issue: 기억 전승의 수신자 범위
  chosen_reading: ‘자녀들’로 번역해 다음 세대 전체를 향한 언약 기억 전승의 기능을 드러냈습니다.
  alternative_readings:
  - ‘아들들’로 더 좁게 번역할 수 있음
  rationale: 히브리어 בנים은 남자 자녀를 뜻할 수 있지만, 본문은 출애굽/요단 도하 사건을 후대에 전하는 교육 명령이므로 문맥상 포괄적 번역이 더 적절합니다.
  doctrine_reference: 신명기적 언약 교육과 세대 간 기억 전승
