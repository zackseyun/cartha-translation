    text: 또는 ‘아들들’로 더 좁게 옮길 수 있습니다. 히브리어는 남자 자녀를 가리킬 수도 있고 자녀 일반을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 접속사는 한국어에서 별도 접속어 없이 자연스럽게 처리하여 과도한 추론을 피했습니다. ‘마른 땅을 밟고’로 בַּיַּבָּשָׁה가 가리키는 도하의 지면 상태를 살렸고, 직접 인용문을 합쇼체로 통일했습니다. 자녀/아들들의 어휘적 범위에 관한 각주는 유지했습니다.
