id: JOS.4.24
reference: Joshua 4:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
  footnotes:
  - marker: a
    text: Or 'all the peoples of the land,' if הָאָרֶץ is taken more locally rather than globally.
    reason: lexical_alternative
  - marker: b
    text: '''Fear'' here includes reverence and awe toward the LORD, not merely terror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 온 땅[a]의 모든 민족이 야훼의 손이 강하다는 것을 알도록 하고, 여러분이 여러분의 하나님 야훼를 평생 두려워하도록[b] 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 땅’은 여기서 전 세계가 아니라 이스라엘 땅처럼 더 지역적인 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워하다’는 단순히 공포를 느낀다는 뜻만이 아니라 야훼를 경외하고 그분 앞에서 외경을 품는다는 의미도 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן / כִּי
  english_pob_choice: so that ... may know ... and so that you may fear ...
  chosen_korean: 이는 ... 하시고, 또 ... 하시려는 것입니다
  alternatives_korean:
  - '...하기 위하여'
  - '...하도록'
  lexicon: HALOT
  rationale: 두 번의 목적절을 현대 한국어에서 가장 자연스럽게 드러내면서도, 단순 원인문처럼 흐르지 않게 목적의미를 유지합니다.
- source_word: כָּל עַמֵּי הָאָרֶץ
  english_pob_choice: all the peoples of the earth
  chosen_korean: 땅의 모든 백성
  alternatives_korean:
  - 땅의 모든 민족들
  - 땅의 모든 나라들
  lexicon: HALOT
  rationale: עַמֵּי는 ‘백성들/민족들’의 복수 개념이지만, 한국어에서는 공적·총칭적 의미를 살려 ‘땅의 모든 백성’으로 옮겼습니다.
- source_word: יַד יְהוָה ... חֲזָקָה
  english_pob_choice: the hand of Yahweh is strong
  chosen_korean: 야훼의 손이 강하다는 것
  alternatives_korean:
  - 야훼의 손이 강하다는 사실
  - 야훼의 능력이 강하다는 것
  lexicon: HALOT
  rationale: ‘손’을 능력으로 풀지 않고 손의 이미지를 유지해 히브리어 관용과 표상을 보존했습니다. יְהוָה는 본문 기준과 프로젝트 관례에 따라 ‘야훼’로 옮겼습니다.
- source_word: יְרָאתֶם
  english_pob_choice: you may fear
  chosen_korean: 두려워하게 하시려는 것입니다
  alternatives_korean:
  - 경외하게 하시려는 것입니다
  - 두려워하며 경외하게 하시려는 것입니다
  lexicon: HALOT
  rationale: 본문의 직접적인 ‘fear’를 유지하되, 한국어에서는 하나님의 언약적 두려움·경외를 모두 포괄할 수 있게 자연스럽게 표현했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 신명칭을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: יָרֵא의 의미 범위
  chosen_reading: 두려워하다
  alternative_readings:
  - 경외하다
  - 두려워하며 경외하다
  rationale: 히브리어 ירא는 경외를 포함할 수 있지만, 본문은 그 긴장을 완화하지 않고 하나님 앞의 거룩한 두려움을 그대로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
