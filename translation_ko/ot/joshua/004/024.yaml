revisions:
- from: 이는 땅의 모든 백성이 야훼의 손이 강하다는 것을 알게 하시고, 또 여러분이 야훼 여러분의 하나님을 모든 날 동안 두려워하게 하시려는 것입니다.[a][b]
  to: 이는 온 땅[a]의 모든 민족이 야훼의 손이 강하다는 것을 알도록 하고, 여러분이 여러분의 하나님 야훼를 평생 두려워하도록[b] 하기 위함입니다.
