  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
  footnotes:
  - marker: a
    text: Traditionally rendered “the Red Sea.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 당신들의 하나님이 요단의 물을 여러분 앞에서 여러분이 건널 때까지 마르게 하셨습니다. 이는 야훼 당신들의 하나님이 우리가 건널 때까지 우리 앞에서 마르게 하신 갈대 바다에 대해서도 하신 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 “홍해”로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 야훼 여러분의 하나님
  lexicon: WLC + POB doctrine on יְהוָה
  rationale: 여기서는 언약의 신적 이름 יְהוָה를 ‘야훼’로 살리고, 공동체를 향한 복수 소유격은 현대 한국어에서 자연스러운 ‘당신들의 하나님’으로 옮겼습니다.
- source_word: הוֹבִישׁ
  english_pob_choice: dried up
  chosen_korean: 마르게 하셨습니다
  alternatives_korean:
  - 말리셨습니다
  - 물이 없어지게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 ‘물길을 건조하게 하여 건널 수 있게 하다’는 뜻을 살리되, 한국어에서는 능동적 결과를 드러내는 ‘마르게 하셨습니다’가 가장 자연스럽습니다.
- source_word: מֵי הַיַּרְדֵּן
  english_pob_choice: the waters of the Jordan
  chosen_korean: 요단의 물
  alternatives_korean:
  - 요단강의 물
  - 요단의 물줄기
  lexicon: HALOT
  rationale: 히브리어의 소유·관형 구조를 간결하게 반영하면서, 성경 문맥에서 익숙한 지명 ‘요단’을 유지했습니다.
- source_word: יַם סוּף
  english_pob_choice: the Sea of Reeds
  chosen_korean: 갈대 바다
  alternatives_korean:
  - 홍해
  - 갈대 바다
  lexicon: HALOT
  rationale: 원어의 수프(סוּף)를 ‘갈대’로 옮겨 원문 우선 원칙을 따랐고, 전통적 ‘홍해’는 영어 주석의 각주 취지를 따라 본문에서는 쓰지 않았습니다.
theological_decisions:
- issue: 지명형 해양 표현 יַם סוּף의 번역
  chosen_reading: 갈대 바다
  alternative_readings:
  - 홍해
  - 붉은 바다
  rationale: 본문은 출애굽 사건을 가리키는 전승적 표현보다 히브리어 어휘 자체를 드러내는 쪽이 원문 가시성을 높이므로, 본문에는 ‘갈대 바다’를 두고 독자 안내를 위해 전통 번역은 배제했습니다.
  doctrine_reference: 원어 우선 번역 원칙
