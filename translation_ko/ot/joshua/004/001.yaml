source:
  edition: WLC
  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
  footnotes:
  - marker: a
    text: Or 'all the people'; Hebrew 'all the nation' uses a singular collective term for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 백성이 요단을 건너는 일을 마쳤을 때, 야훼께서 여호수아에게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 백성’은 히브리어의 ‘온 나라’에 해당하는 단수 집합명사로, 이스라엘 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 … 때
  alternatives_korean:
  - 그때
  - 일이 일어났습니다
  lexicon: HALOT
  rationale: 서사 전환을 알리는 wayyiqtol의 기능을 살려 한국어에서는 자연스러운 연결 표현으로 옮겼습니다.
- source_word: כַּאֲשֶׁר תַּמּוּ
  english_pob_choice: when ... had finished
  chosen_korean: …을 마쳤을 때
  alternatives_korean:
  - …를 다했을 때
  - …가 끝났을 때
  lexicon: HALOT
  rationale: 완료를 나타내는 동사 תמם의 의미를 반영해, 요단을 ‘건너는 일’을 마무리한 시점을 분명히 했습니다.
- source_word: כָל הַגּוֹי
  english_pob_choice: all the nation
  chosen_korean: 온 백성
  alternatives_korean:
  - 온 나라
  - 모든 민족
  lexicon: HALOT
  rationale: 히브리어의 단수 집합명사로서 이스라엘 공동체 전체를 가리키므로, 한국어에서는 자연스럽되 집합성을 유지하는 ‘온 백성’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기적 서사에서 여호와 대용어가 아니라 언약적 고유명사로 직접 제시되므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 YHWH를 직접 사용하므로, 고유명칭을 제목어로 바꾸지 않고 하나님의 언약적 이름을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
