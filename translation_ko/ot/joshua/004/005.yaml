  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel.'' This is the formal covenantal expression; many English versions simplify it to ''the Israelites'' or ''the people of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 그들에게 말했습니다. "여호와 너희 하나님의 궤 앞에, 요단 한가운데로 건너가서, 이스라엘 자손의 지파 수대로 각자 하나씩 돌을 어깨에 메십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 공식적 언약 표현입니다. 일부 번역은 이를 ‘이스라엘 사람들’로 단순화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Joshua said
  chosen_korean: 그때 여호수아가 말했습니다
  alternatives_korean:
  - 그리고 여호수아가 말했습니다
  - 여호수아가 말했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 자연스럽게 살리되, 한국어에서는 부자연스러운 직역 접속사 반복을 피하고 장면 전환을 드러냈습니다.
- source_word: עִבְרוּ לִפְנֵי
  english_pob_choice: Cross over before
  chosen_korean: 앞에 … 건너가서
  alternatives_korean:
  - 앞에서 건너가십시오
  - 앞으로 건너가십시오
  lexicon: HALOT
  rationale: לִפְנֵי는 궤의 ‘앞에’라는 위치를 가리키므로, 단순히 ‘앞에서’가 아니라 대상 앞을 지나가며 이동하는 명령으로 옮겼습니다.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the ark of Yahweh your God
  chosen_korean: 여호와 너희 하나님의 궤
  alternatives_korean:
  - 야훼 너희 하나님의 궤
  - 여호와 너희 하나님이신 궤
  lexicon: HALOT
  rationale: 지시적·관계적 구조를 살려 ‘너희 하나님의 궤’로 옮겼고, 본문 전통을 따르는 경우가 많은 ‘여호와’ 표기를 사용했습니다.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  english_pob_choice: into the middle of the Jordan
  chosen_korean: 요단 한가운데로
  alternatives_korean:
  - 요단 가운데로
  - 요단 속으로
  lexicon: HALOT
  rationale: תּוֹךְ의 핵심은 단순 진입이 아니라 ‘가운데/한복판’이므로, 강의 내부 중심을 분명히 하는 표현을 택했습니다.
- source_word: אִישׁ אֶבֶן אַחַת עַל שִׁכְמוֹ
  english_pob_choice: each man lift up one stone on his shoulder
  chosen_korean: 각자 하나씩 돌을 어깨에 메십시오
  alternatives_korean:
  - 각 사람마다 돌 하나를 어깨에 메십시오
  - 각 남자마다 돌 하나를 어깨에 메십시오
  lexicon: HALOT
  rationale: 분배적 의미를 자연스럽게 살리되 한국어 명령문으로 매끄럽게 만들었습니다. ‘메다’는 어깨에 얹어 운반하는 동작을 잘 드러냅니다.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  english_pob_choice: the tribes of the sons of Israel
  chosen_korean: 이스라엘 자손의 지파 수대로
  alternatives_korean:
  - 이스라엘의 열두 지파대로
  - 이스라엘 자손의 지파들대로
  lexicon: HALOT
  rationale: ‘sons of Israel’을 단순히 ‘이스라엘 사람들’로 평평하게 만들지 않고, 문맥상 지파 수와 연결되는 공식적 표현을 유지했습니다.
theological_decisions:
- issue: YHWH 표기와 한국어 전통 용례
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 원문은 여호와(YHWH)를 직접 사용하지만, 한국어 독자에게는 성경 전통에서 널리 알려진 표기가 이해를 돕습니다. 본 구절에서는 문맥의 언약명칭 기능을 해치지 않는 범위에서 전통 표기를 채택했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH
- issue: 명령문 높임말 처리
  chosen_reading: 여호수아가 그들에게 말했습니다 … 건너가서 … 메십시오
  alternative_readings:
  - 말했다 … 건너가라 … 메라
  rationale: 서사 본문은 합쇼체로 유지하되, 직접 명령은 본문이 요구하는 명령성을 살려 공손한 명령형으로 옮겼습니다.
  doctrine_reference: Korean target style — modern formal-polite
