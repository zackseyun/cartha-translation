  rationale: 본문의 신명기적 고유명사를 직역적 대체어가 아닌 음역으로 보존해, 언약 이름의 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: ירא의 정서 범위
  chosen_reading: 두려워했습니다
  alternative_readings:
  - 경외했습니다
  - 존중했습니다
  - 두려워하며 경외했습니다
  rationale: 본문이 모세와 여호수아에 대한 반응을 병렬로 말하므로, 의미를 약화시키는 ‘존중하다’보다 ‘두려워하다’를 택해 문학적·신학적 연속성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
