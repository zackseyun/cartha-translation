  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
  footnotes:
  - marker: a
    text: Or 'stood in awe of him' / 'revered him'; the Hebrew verb can denote fear, awe, or reverence depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 야훼께서는 온 이스라엘이 보기에 여호수아를 크게 하셨습니다. 그래서 그들은 모세가 살아 있는 동안 그를 두려워했던 것처럼 여호수아를 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워하다’는 문맥에 따라 ‘경외하다’ 또는 ‘경외심을 품다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날에
  - 그날에
  lexicon: HALOT
  rationale: 서사적 시간 표지를 자연스러운 현대 한국어로 옮기되, 특별한 예언체 뉘앙스를 덧입히지 않기 위해 간결하게 처리했습니다.
- source_word: גִּדַּל
  english_pob_choice: made ... great
  chosen_korean: 크게 하셨고
  alternatives_korean:
  - 크게 만드셨고
  - 높이셨고
  - 크게 되게 하셨고
  lexicon: HALOT
  rationale: 히필/피엘 계열의 원인적 의미를 살리면서, 여호수아의 지위가 공적으로 높아졌다는 뜻을 한국어에서 자연스럽게 표현했습니다.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  english_pob_choice: in the eyes of all Israel
  chosen_korean: 온 이스라엘의 눈앞에서
  alternatives_korean:
  - 온 이스라엘의 눈에
  - 온 이스라엘 앞에서
  - 온 이스라엘이 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, 공적 인지와 평가의 뉘앙스가 드러나도록 했습니다.
- source_word: וַיִּרְאוּ אֹתוֹ
  english_pob_choice: they feared him
  chosen_korean: 그도 두려워했습니다
  alternatives_korean:
  - 그를 두려워했습니다
  - 그에게 경외심을 가졌습니다
  - 그를 경외했습니다
  lexicon: HALOT
  rationale: ירא의 의미 범위를 따라 ‘두려워하다’를 기본으로 두되, 문맥상 단순 공포보다 경외가 포함될 수 있음을 유지했습니다.
- source_word: כַּאֲשֶׁר יָרְאוּ אֶת מֹשֶׁה
  english_pob_choice: just as they had feared Moses
  chosen_korean: 모세를 그의 생전에 두려워한 것처럼
  alternatives_korean:
  - 모세를 두려워한 것처럼
  - 모세를 그가 살아 있는 동안 두려워한 것처럼
  - 모세를 평생 두려워한 것처럼
  lexicon: HALOT
  rationale: 비교 구조를 살리면서, ‘모세’에 귀속되는 ‘그의 생전에’를 한국어에서 자연스럽게 풀어 주어 의미를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 고유명사를 직역적 대체어가 아닌 음역으로 보존해, 언약 이름의 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: ירא의 정서 범위
  chosen_reading: 두려워했습니다
  alternative_readings:
  - 경외했습니다
  - 존중했습니다
  - 두려워하며 경외했습니다
  rationale: 본문이 모세와 여호수아에 대한 반응을 병렬로 말하므로, 의미를 약화시키는 ‘존중하다’보다 ‘두려워하다’를 택해 문학적·신학적 연속성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
