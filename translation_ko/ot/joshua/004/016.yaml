id: JOS.4.16
reference: Joshua 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
  footnotes:
  - marker: a
    text: Or 'the ark of the witness.' The Hebrew reads 'testimony,' not the more familiar 'covenant' found in many other references to the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 증거궤를 멘 제사장들에게 명하여 요단에서 올라오게 하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증거의 궤’. 히브리어는 다른 많은 궤 관련 본문에서 흔한 ‘언약’이 아니라 ‘증거/증언’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  english_pob_choice: Command
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하십시오
  - 지시하십시오
  - 명하시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형의 직접성을 살리면서, 현대 합쇼체에서 자연스럽고 단호한 명령을 형성합니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들에게
  alternatives_korean:
  - 사제들에게
  - 제사들에게
  lexicon: HALOT
  rationale: כהנים의 표준 대응으로 ‘제사장’이 가장 직접적이며, 여기에 격조사를 붙여 명령의 대상임을 드러냅니다.
- source_word: אֲרוֹן הָעֵדוּת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 증거의 궤
  lexicon: HALOT
  rationale: POB의 ‘testimony’에 맞추어 전통적 ‘언약궤’로 평준화하지 않고, עֵדוּת의 직접 의미를 살린 간결한 합성어로 옮겼습니다.
- source_word: וְיַעֲלוּ מִן הַיַּרְדֵּן
  english_pob_choice: to come up from the Jordan
  chosen_korean: 요단에서 올라오게 하십시오
  alternatives_korean:
  - 요단에서 나오게 하십시오
  - 요단 강에서 올라오게 하십시오
  lexicon: HALOT
  rationale: עלה의 ‘올라오다’는 지형적·서술적 방향성을 보존하며, מן은 ‘에서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: אֲרוֹן הָעֵדוּת의 전통적 관용구와 מקור 텍스트의 구체성
  chosen_reading: ‘증거궤’로 옮겨 ‘testimony’의 직접성을 유지했습니다.
  alternative_readings:
  - ‘언약궤’로 익숙한 교회 용어를 따르는 읽기
  - ‘증언궤’로 더 직역하는 읽기
  rationale: 본문은 ‘언약’이 아니라 ‘증거/증언’을 사용하므로, 익숙한 전통어로 의미를 평준화하면 원문의 어휘 긴장이 사라집니다.
  doctrine_reference: 본문 어휘 보존 원칙
