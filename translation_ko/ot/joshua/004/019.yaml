  text: וְ/הָ/עָ֗ם עָלוּ֙ מִן הַ/יַּרְדֵּ֔ן בֶּ/עָשׂ֖וֹר לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַֽ/יַּחֲנוּ֙ בַּ/גִּלְגָּ֔ל בִּ/קְצֵ֖ה מִזְרַ֥ח יְרִיחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
  footnotes:
  - marker: a
    text: Or 'they went up from the Jordan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they camped at Gilgal, east of Jericho.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 요단에서 올라온 것은 첫째 달 열째 날이었고, 그들은 여리고의 동쪽 경계에 있는 길갈에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올라온 것은’은 ‘올라갔습니다/올라왔습니다’의 직역 가능성을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동쪽 경계에’는 ‘여리고의 동쪽에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/עָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 그 백성
  lexicon: WLC
  rationale: 집합명사로서의 ‘הָעָם’은 여기서 이스라엘 공동체를 가리키므로, 자연스러운 서술체인 ‘백성’이 적절합니다.
- source_word: עָלוּ מִן הַיַּרְדֵּן
  english_pob_choice: came up from the Jordan
  chosen_korean: 요단에서 올라온 것은
  alternatives_korean:
  - 요단에서 올라왔습니다
  - 요단에서 올라간 것은
  lexicon: HALOT
  rationale: עלה의 방향성을 살려 ‘올라오다’로 옮기되, 한국어에서는 장소·시점 보조절로 풀어 자연스럽게 읽히도록 했습니다.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: on the tenth day of the first month
  chosen_korean: 첫째 달 열째 날
  alternatives_korean:
  - 첫째 달의 열째 날
  - 첫째 달 열흘
  lexicon: HALOT
  rationale: 히브리어의 달력 날짜 표현을 한국어 관용에 맞게 간명하게 옮겼습니다.
- source_word: בַּגִּלְגָּל
  english_pob_choice: at Gilgal
  chosen_korean: 길갈에
  alternatives_korean:
  - 길갈에서
  - 길갈에 있는
  lexicon: HALOT
  rationale: 지명은 음역을 따르고, 진을 치는 동작과 가장 자연스럽게 결합하는 처소격을 사용했습니다.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  english_pob_choice: on the eastern border of Jericho
  chosen_korean: 여리고의 동쪽 경계에
  alternatives_korean:
  - 여리고의 동쪽 가장자리에
  - 여리고 동쪽 끝에
  lexicon: HALOT
  rationale: קצה는 단순한 ‘끝’보다 지리적 경계감을 주는 ‘경계’가 더 잘 맞고, מזרח יריחו는 ‘여리고의 동쪽’으로 관계를 분명히 했습니다.
