source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
  footnotes:
  - marker: a
    text: 'Hebrew: ''until all the matter was finished''; the phrase summarizes the completion of everything the LORD had commanded Joshua to say to the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 언약궤를 멘 제사장들은, 야훼께서 여호수아에게 백성에게 말하라고 명령하신 모든 일이 모세가 여호수아에게 명령한 모든 것에 따라 끝날 때까지, 요르단 한가운데 서 있었습니다[a]. 그리고 백성은 서둘러 건너갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 일이 끝날 때까지’입니다. 여기서 ‘모든 일’은 야훼께서 여호수아에게 백성에게 말하라고 명령하신 전체 내용을 가리키며, 이어지는 말은 그것이 모세가 여호수아에게 명령한 모든 것에 따른 것임을 덧붙입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  english_pob_choice: the priests carrying the ark
  chosen_korean: 언약궤를 멘 제사장들
  alternatives_korean:
  - 언약궤를 나르는 제사장들
  - 궤를 지고 있는 제사장들
  lexicon: HALOT
  rationale: נֹשְׂאֵי는 단순한 소유가 아니라 ‘메고/지고 가는’ 지속 행위를 가리키므로, 한국어에서는 ‘멘’이 가장 자연스럽고 원문 동작을 잘 드러냅니다.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  english_pob_choice: stood in the midst of the Jordan
  chosen_korean: 요르단 한가운데 서 있었는데
  alternatives_korean:
  - 요르단 가운데 서 있었는데
  - 요르단 한복판에 서 있었는데
  lexicon: HALOT
  rationale: בְּתוֹךְ는 단순한 ‘안에’보다 ‘한가운데/중간’의 중심성을 강하게 전하므로, 서술 톤을 살린 ‘한가운데’가 적절합니다.
- source_word: עַד תֹּם כָּל הַדָּבָר
  english_pob_choice: until everything was finished
  chosen_korean: 명령하신 모든 일이 끝날 때까지
  alternatives_korean:
  - 모든 일이 다 끝날 때까지
  - 모든 것이 끝날 때까지
  lexicon: HALOT
  rationale: הַדָּבָר는 여기서 단순 ‘말’보다 이미 주어진 지시와 그 수행 전체를 가리키므로, 문맥상 ‘모든 일’로 옮겨 의미를 분명히 했습니다.
- source_word: לְדַבֵּר אֶל הָעָם
  english_pob_choice: to speak to the people
  chosen_korean: 백성에게 말하라고
  alternatives_korean:
  - 백성에게 이야기하라고
  - 백성에게 전하라고
  lexicon: HALOT
  rationale: דבר אל은 직접 대상에게 말을 전하는 뜻이므로, 지시문의 형태를 살려 ‘말하라고’로 옮겼습니다.
- source_word: וַיְמַהֲרוּ ... וַיַּעֲבֹרוּ
  english_pob_choice: And the people hurried and crossed over
  chosen_korean: 그러자 백성은 서둘러 건너갔습니다
  alternatives_korean:
  - 그러자 백성은 급히 건넜습니다
  - 그러자 백성은 서둘러 강을 건넜습니다
  lexicon: HALOT
  rationale: וַיַּעֲבֹרוּ는 문맥상 강을 건너는 행위이므로, 한국어에서는 중복을 피하면서도 사건의 이동을 분명히 하는 ‘건너갔습니다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 POB 기준에 따라 ‘야훼’로 옮겨야 하며, 일반 호칭인 ‘주님’으로 완화하지 않습니다.
theological_decisions:
- issue: 여호수아에게 내린 명령을 백성에게 전달하는 구조
  chosen_reading: 야훼께서 여호수아에게 백성에게 말하라고 명령하신 모든 일이 끝날 때까지
  alternative_readings:
  - 야훼께서 여호수아에게 백성에게 말하라고 명령하신 모든 것이 끝날 때까지
  - 야훼께서 여호수아에게 백성에게 말하라고 명령하신 모든 말이 끝날 때까지
  rationale: 원문은 단순한 정보 전달이 아니라, 야훼의 명령이 여호수아를 거쳐 백성에게 전달되고 그 전체가 완료되는 서술 구조를 강조합니다.
  doctrine_reference: 본문 서사 구조와 명령-전달-순종의 순차성
- issue: 모세와 여호수아의 명령 연속성
  chosen_reading: 모세가 여호수아에게 명령한 모든 것대로였습니다.
  alternative_readings:
  - 모세가 여호수아에게 명령한 그대로였습니다.
  - 모세가 여호수아에게 명령한 대로였습니다.
  rationale: כְּכֹל אֲשֶׁר는 ‘모든 것대로/모든 대로’의 충실성을 강조하므로, 원문의 포괄성을 살려 서술했습니다.
  doctrine_reference: 언약적 순종과 이전 명령의 완전한 이행
