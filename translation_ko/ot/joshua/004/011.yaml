  rationale: 본문이 신명기적 전승의 언약명을 직접 사용하므로, 프로젝트 기준에 따라 고유한 신적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
