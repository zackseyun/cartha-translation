  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
  footnotes:
  - marker: a
    text: Or 'in the presence of the people.' The Hebrew phrase can denote either spatial position ('before/in front of') or presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 건너기를 마치자, 야훼의 궤와 제사장들이 백성 앞에서 건너갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성이 보는 앞에서’. 히브리어 구문은 공간적으로 ‘백성 앞에/앞에서’를 뜻할 수도 있고, 백성의 면전 또는 보는 앞에서라는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: “...하자”로 이어지는 시간 전환
  alternatives_korean:
  - 그리고 ~할 때
  - 그때 ~하자
  lexicon: WLC / HALOT
  rationale: 히브리어 서술 전환과 시간절을 한국어에서 자연스럽게 연결하기 위해 문두를 과도하게 직역하지 않고 사건의 진행을 드러냈습니다.
- source_word: תַּם כָּל הָעָם לַעֲבֹר
  english_pob_choice: all the people had finished crossing over
  chosen_korean: 온 백성이 건너기를 마치자
  alternatives_korean:
  - 온 백성이 건너기를 끝내자
  - 백성이 모두 건너기를 마치자
  lexicon: WLC / HALOT
  rationale: תַּם의 완료 의미를 ‘~하기를 마치다’로 옮겨, 요단강을 건넌 행위가 끝난 뒤 다음 사건이 이어진다는 순서를 살렸습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 여호와의 궤
  - 주님의 궤
  lexicon: WLC / project glossary
  rationale: 프로젝트 기본어에 따라 여호와가 아니라 ‘야훼’를 사용했고, אֲרוֹן은 예배용 ‘궤’로 옮겨 표준 성경 용례를 유지했습니다.
- source_word: וְהַכֹּהֲנִים לִפְנֵי הָעָם
  english_pob_choice: and the priests crossed over before the people
  chosen_korean: 제사장들이 백성 앞에서 건너갔습니다
  alternatives_korean:
  - 제사장들이 백성보다 앞서 건너갔습니다
  - 제사장들이 백성의 앞에 서서 건넜습니다
  lexicon: WLC / HALOT
  rationale: לִפְנֵי는 이 문맥에서 공간적으로 ‘앞에서/앞에’의 뜻이 자연스러워, POB의 주석 가능성을 유지하면서도 본문에는 가장 직접적인 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
