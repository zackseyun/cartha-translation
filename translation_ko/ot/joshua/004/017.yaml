source:
  edition: WLC
  text: וַ/יְצַ֣ו יְהוֹשֻׁ֔עַ אֶת הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר עֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: ko
  text: 그리하여 여호수아가 제사장들에게 말하며 「요단 강에서 올라오십시오」라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 명하였습니다
  lexicon: HALOT
  rationale: צוה의 권위 있는 명령을 살려 ‘명령했습니다’로 옮겼습니다. ‘지시했습니다’는 다소 약하고, ‘명하였습니다’는 문체상 더 딱딱합니다.
- source_word: אֶת הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들에게
  alternatives_korean:
  - 제사장들을
  lexicon: HALOT
  rationale: 대화 동사 ‘말하다’와 함께 자연스러운 여격 표현으로 처리해, 명령의 수신자를 한국어 문장 흐름에 맞게 드러냈습니다.
- source_word: עֲלוּ
  english_pob_choice: Come up
  chosen_korean: 올라오십시오
  alternatives_korean:
  - 올라오세요
  - 올라오너라
  lexicon: HALOT
  rationale: 직접 화법의 명령형을 현대 공손체로 옮겨, 제사장들에게 주는 명령의 어조를 살렸습니다.
- source_word: מִן הַיַּרְדֵּן
  english_pob_choice: out of the Jordan
  chosen_korean: 요단 강에서
  alternatives_korean:
  - 요단에서
  - 요단 강 밖으로
  lexicon: HALOT
  rationale: מן은 ‘~에서/로부터’의 이탈을 나타내므로, 한국어에서는 동사 ‘올라오다’와 결합해 ‘요단 강에서’가 가장 자연스럽습니다. ‘밖으로’는 의미는 분명하지만 문장이 다소 중복됩니다.
theological_decisions:
- issue: 명령 장면의 직접화법 공손체 수준
  chosen_reading: 예배적·공적 서술의 현대 합쇼체로, 직접 명령은 ‘올라오십시오’로 유지했습니다.
  alternative_readings:
  - 올라오라
  - 올라오세요
  rationale: 본문은 여호수아의 권위 있는 지시를 기록한 역사 서술이므로, 현대 문어체의 공손한 명령형이 원문의 힘을 잘 보존합니다.
  doctrine_reference: 서술체/화법 보존
