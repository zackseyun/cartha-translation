  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel.'' Many English versions simplify this to ''the Israelites.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'from the middle of the Jordan.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to the camp'; the Hebrew more specifically means 'to the lodging place' or overnight encampment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 여호수아가 명령한 대로 그렇게 했습니다. 그들은 야훼께서 여호수아에게 말씀하신 대로, 이스라엘 자손의 지파 수에 따라 요단 한가운데에서 열두 돌을 가져다가, 그것들을 함께 숙영지로 옮겨 그곳에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요단 한가운데’는 히브리어 מִתּוֹךְ הַיַּרְדֵּן의 공간적 의미를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘숙영지’는 히브리어 הַמָּלוֹן의 뉘앙스를 반영한 표현으로, 단순한 ‘진영’보다 하룻밤 묵는 장소를 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 가족적·혈통적 표현을 살려, 평이하지만 원문에 투명한 ‘이스라엘 자손’을 택했습니다.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  english_pob_choice: from the midst of the Jordan
  chosen_korean: 요단 한가운데에서
  alternatives_korean:
  - 요단 가운데에서
  - 요단 속에서
  lexicon: HALOT
  rationale: ‘한가운데’는 תּוֹךְ의 구체적 공간감을 자연스럽게 살리면서, 돌을 취한 위치가 강의 내부가 아니라 강바닥 쪽임을 과도하게 설명하지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 신명기 표기인 ‘야훼’를 사용해 언약 이름을 보존했습니다.
- source_word: הַמָּלוֹן
  english_pob_choice: the lodging place
  chosen_korean: 숙영지
  alternatives_korean:
  - 진영
  - 유숙할 곳
  lexicon: HALOT
  rationale: מָלוֹן은 단순한 ‘진’보다 하룻밤 묵는 장소의 뉘앙스가 있어, 군사적·여행적 문맥을 함께 담는 ‘숙영지’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명기 표기 יהוה를 사용하므로, POB의 용례에 따라 공교회식 ‘주’나 전통적 ‘여호와’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
