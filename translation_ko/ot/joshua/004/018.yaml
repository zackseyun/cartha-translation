source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
  footnotes:
  - marker: a
    text: 'Hebrew: ''as yesterday and the third day,'' an idiom meaning ''as before'' or ''as formerly.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'when the priests carrying the ark of the covenant of the LORD came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up onto the dry ground, that the waters of the Jordan returned to their place'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼의 언약궤를 메고 있던 제사장들이 요단 한가운데에서 올라와 그들의 발바닥이 마른 땅으로 올라와 닿자, 요단 물이 본래의 자리로 돌아가 전과 같이[a] 모든 둑 위로 흘러넘쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘어제와 그제’는 ‘전과 같이’, ‘예전처럼’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בעלות
  english_pob_choice: when ... came up
  chosen_korean: 올라오자
  alternatives_korean:
  - 올라왔을 때
  - 올라오면서
  lexicon: HALOT
  rationale: עלה의 부정사구가 사건의 시점을 여는 용법이므로, 한국어에서는 뒤따르는 주절과 자연스럽게 이어지는 '-자'로 처리했습니다.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: carrying the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤를 메고
  alternatives_korean:
  - 야훼의 언약궤를 들고
  - 야훼의 언약궤를 나르고
  lexicon: HALOT
  rationale: נשׂא의 분사로서 제사장들의 역할을 나타내므로 '메고'가 반복적·의례적 운반의 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 여호와 대체어가 아니라 신명기의 언약명 자체가 직접 사용되므로, 프로젝트 기본값에 따라 '야훼'를 유지했습니다.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים
  english_pob_choice: the soles of the priests’ feet were lifted up
  chosen_korean: 제사장들의 발바닥이 마른 땅에 닿았고
  alternatives_korean:
  - 제사장들의 발바닥이 떼어졌고
  - 제사장들의 발바닥이 들어 올려졌고
  lexicon: HALOT
  rationale: נתק는 단순한 '들림'보다 발이 강에서 분리되어 육지에 옮겨진 상태를 가리키므로, 한국어에서는 결과 상태를 분명히 하는 표현으로 옮겼습니다.
- source_word: אֶל הֶחָרָבָה
  english_pob_choice: onto the dry ground
  chosen_korean: 마른 땅에
  alternatives_korean:
  - 마른 땅 위로
  - 마른 땅으로
  lexicon: HALOT
  rationale: חרבה는 물과 대비되는 마른 지면을 뜻하므로, 짧고 직접적인 '마른 땅에'가 이동의 도착점을 가장 자연스럽게 나타냅니다.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  english_pob_choice: as before
  chosen_korean: 전과 같이
  alternatives_korean:
  - 예전처럼
  - 어제와 그제처럼
  lexicon: HALOT
  rationale: 히브리어 관용구가 '이전처럼/예전처럼'을 뜻하므로, 본문의 흐름을 해치지 않으면서도 관용의 의미를 살리는 '전과 같이'로 옮겼습니다.
- source_word: עַל כָּל גְּדוֹתָיו
  english_pob_choice: over all its banks
  chosen_korean: 모든 언덕[둑] 위로 흘러 넘쳤습니다
  alternatives_korean:
  - 모든 둑 위로 넘쳤습니다
  - 모든 강둑 위로 흘렀습니다
  lexicon: HALOT
  rationale: גדות는 강의 가장자리/둑을 가리키므로, 독자가 하천 지형을 이해하도록 '둑'을 기본으로 두고 '언덕'은 지면 독해를 돕는 보조 표기로 처리했습니다.
theological_decisions:
- issue: 하나님의 언약명 יְהוָה의 한국어 표기
