  rationale: 본문은 제목어 '주'가 아니라 이스라엘에게 드러난 언약명 자체를 사용하므로, 프로젝트 기준에 따라 '야훼'를 본문에 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
