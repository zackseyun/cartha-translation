lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스러운 합쇼체로 옮기면서, 하나님 말씀의 격에 맞게 일반적인 ‘말했습니다’보다 ‘말씀하셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 기존 영어 POB는 고유한 신명보다는 전통적 지칭을 따른 이름형을 사용하지 않으므로, 한국어 본문은 한국 교회권에서 즉시 식별되는 신명 표기로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - -께
  lexicon: HALOT
  rationale: 말의 수신자를 나타내는 직접 목적격 조사로 자연스럽게 처리했습니다.
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 여호슈아
  lexicon: HALOT
  rationale: 성서 인명으로 통용되는 표준 한국어 음역을 사용했습니다.
theological_decisions:
- issue: 여호와의 직접 발화 도입 방식
  chosen_reading: 서술문으로만 제시하고, 다음 절의 직접 화법을 예고하는 기능은 각주로 처리했습니다.
  alternative_readings:
  - 직접 인용 부호를 열어 다음 절까지 연결
  - ‘말하여 이르시되’와 같은 전통적 연결구 사용
  rationale: 히브리어 לֵאמֹר가 다음 절의 직접 인용을 여는 표지이므로, 본문은 간결하게 유지하되 독자가 구조를 오해하지 않도록 각주로 설명했습니다.
  doctrine_reference: 본문 구조와 화행 표지에 관한 주해 원칙
