  source_fidelity: 히브리어의 서술 순서와 핵심 요소를 충실히 반영합니다. 여호수아가 이전에 이스라엘 자손 가운데서 임명한 특정한 열두 사람을 불렀으며, 각 지파에서 한 사람씩이었다는 뜻이 모두 보존되었습니다. הֵכִין의 문맥상 ‘임명한’도 적절합니다.
  naturalness: ‘그리하여 여호수아가 … 열두 사람, 곧 지파마다 한 사람씩을 불렀습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다. ‘곧’은 열두 사람의 구성에 대한 동격적 설명을 매끄럽게 연결합니다.
  terminology: ‘여호수아’, ‘이스라엘 자손’, ‘지파’는 한국어 성경 문맥에서 안정적이고 적절한 용어입니다. אִישׁ를 ‘사람’으로 옮긴 것은 이 대표자 집단을 자연스럽게 가리키며, 원문의 분배 표현은 ‘지파마다 한 사람씩’으로 잘 살아 있습니다.
