id: JOS.4.4
reference: Joshua 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יְהוֹשֻׁ֗עַ אֶל שְׁנֵ֤ים הֶֽ/עָשָׂר֙ אִ֔ישׁ אֲשֶׁ֥ר הֵכִ֖ין מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל אִישׁ אֶחָ֥ד אִישׁ אֶחָ֖ד מִ/שָּֽׁבֶט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/004.yaml
  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
  footnotes:
  - marker: a
    text: Or, 'from the Israelites.' The Hebrew reads 'from the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'whom he had prepared' or 'whom he had designated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 여호수아가 이스라엘 자손 가운데서 그가 임명한 열두 사람, 곧 지파마다 한 사람씩을 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: קרא의 서술적 행동을 한국어의 자연스러운 서술인 ‘부르다’로 옮겼습니다. ‘소집하다’는 다소 공문체적이고 강한 느낌이 있어, 문맥의 단순한 호출보다 앞서는 뉘앙스를 피했습니다.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  english_pob_choice: the twelve men
  chosen_korean: 열두 사람
  alternatives_korean:
  - 열두 남자
  - 열두 명의 사람
  lexicon: HALOT
  rationale: 문맥상 특정 대표자 집단을 가리키므로 ‘열두 사람’으로 자연스럽게 옮겼습니다. ‘남자’는 성별을 불필요하게 전면화할 수 있어 피했습니다.
- source_word: אֲשֶׁר הֵכִין
  english_pob_choice: whom he had appointed
  chosen_korean: 그가 임명한
  alternatives_korean:
  - 그가 준비한
  - 그가 지정한
  lexicon: HALOT
  rationale: הכין은 ‘준비하다’ 외에 ‘임명하다/지정하다’의 의미로도 쓰이므로, 이 문맥의 대표자 선정을 반영해 ‘임명한’으로 번역했습니다. 이는 영어 POB의 ‘appointed’와도 맞습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘의 아들들 가운데서
  lexicon: HALOT
  rationale: ‘sons of Israel’의 집단 명칭을 한국어 성경 관용과 가독성을 함께 고려해 ‘이스라엘 자손’으로 유지했습니다. ‘사람들’로 풀면 원문의 혈통·언약적 표지를 약화시킬 수 있습니다.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  english_pob_choice: one man from each tribe
  chosen_korean: 지파마다 한 사람씩
  alternatives_korean:
  - 각 지파에서 한 사람씩
  - 한 지파당 한 사람씩
  lexicon: HALOT
  rationale: 히브리어의 반복적 분배 표현을 한국어의 자연스러운 분배 표현으로 옮겼습니다. ‘지파마다’는 대표성의 분배 구조를 간결하게 드러냅니다.
