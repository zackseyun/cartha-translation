revisions:
- from: 그러므로 이스라엘 자손이 사흘째 되는 날에 자기들의 성읍으로 길을 떠나 도착하였는데[a], 그 성읍들은 기브온과 브에라와 브에롯[b]과 기럇여아림이었습니다.
  to: 이스라엘 자손[a]은 길을 떠나 사흘째 되는 날 그들의 성읍들에 이르렀습니다. 그 성읍들은 기브온, 그비라[b], 브에롯, 기럇여아림이었습니다.
