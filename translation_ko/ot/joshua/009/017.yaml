    rationale: 각주는 두 번째 지명 כְּפִירָה를 설명하지만 초안에서는 세 번째 지명 ‘브에롯’ 뒤에 붙어 있습니다. 또한 각주 내용이 본문 표기의 오류를 설명하는 메타 주석이 되어 독자용 각주로 부적절합니다.
