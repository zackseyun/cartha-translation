base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Kephirah is traditionally rendered 'Chephirah' in some English versions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손이 사흘째 되는 날에 자기들의 성읍으로 길을 떠나 도착하였는데[a], 그 성읍들은 기브온과 브에라와 브에롯[b]과 기럇여아림이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘 자손”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문의 두 번째 지명은 כְּפִירָה(통상 ‘브에라’로 음역되지 않음)입니다. 본문 항목의 영어 주석은 이 지명에 대한 전통적/대안 표기를 가리킵니다.
    reason: textual_variant
