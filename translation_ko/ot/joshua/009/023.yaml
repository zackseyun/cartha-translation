  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you slaves, cutters of wood and drawers of water for the house of my God.
  footnotes:
  - marker: a
    text: Or, more formally, 'there shall never be cut off from you a slave'; the Hebrew expresses an ongoing condition that their people would continually supply this labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 너희는 저주를 받았습니다. 너희 가운데서 내 하나님의 집을 위하여 나무를 베고 물을 긷는 노예들이 끊이지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘너희 가운데서 노예가 끊어지지 않을 것이다’입니다. 히브리어는 그들 가운데서 이 노동을 맡을 사람들이 계속 나올 지속적인 상태를 나타냅니다.
    reason: lexical_alternative
