  lexicon: HALOT
  rationale: 두 분사구를 직역하되 현대 한국어에서 이해 가능한 동작 표현으로 옮겼습니다. ‘베는/긷는’은 반복적 노역의 이미지를 유지합니다.
- source_word: לְבֵית אֱלֹהָי
  english_pob_choice: for the house of my God
  chosen_korean: 내 하나님의 집을 섬기게 될 것입니다
