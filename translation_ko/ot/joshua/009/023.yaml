  - 내 하나님의 집을 위하여
  rationale: 히브리어 전치사 לְ는 단순 위치보다 목적과 귀속을 포함할 수 있으므로, 성소 봉사의 의미가 드러나도록 봉사 동사를 보충했습니다.
