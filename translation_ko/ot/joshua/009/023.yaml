  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you slaves, cutters of wood and drawers of water for the house of my God.
  footnotes:
  - marker: a
    text: Or, more formally, 'there shall never be cut off from you a slave'; the Hebrew expresses an ongoing condition that their people would continually supply this labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 너희는 저주를 받았으며, 너희 가운데서 종이 끊어지지 않을 것이니, 곧 나무를 베는 자들과 물을 긷는 자들로 내 하나님의 집을 섬기게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘너희에게서 종 하나가 끊어지지 않을 것이다’입니다. 히브리어는 그들이 계속해서 이 노동을 제공하게 될 지속 상태를 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  lexicon: HALOT
  rationale: 판결에서 그 결과로 넘어가는 담화 전환을 자연스러운 한국어로 살리기 위해 ‘그러므로 이제’를 택했습니다.
- source_word: אֲרוּרִים
  english_pob_choice: cursed
  chosen_korean: 저주를 받았으며
  alternatives_korean:
  - 저주받은
  - 저주 아래 있는
  lexicon: HALOT
  rationale: 형용사적 상태를 한국어에서 매끄럽게 드러내면서도 하나님의 판결로 인한 저주라는 강도를 유지했습니다.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  english_pob_choice: there shall never cease to be from among you slaves
  chosen_korean: 너희 가운데서 종이 끊어지지 않을 것이니
  alternatives_korean:
  - 너희 가운데서 종이 끊겨지지 않을 것이니
  - 너희 가운데서 종이 없어지지 않을 것이니
  - 너희 가운데서 노예가 끊어지지 않을 것이니
  lexicon: HALOT
  rationale: נִכְרַת의 ‘끊어지다/제거되다’라는 뜻을 살려 지속적 상태를 표현했습니다. POB의 영어 보류가 'slaves'였지만, 히브리어 עֶבֶד의 기본값은 프로젝트 용례에 따라 ‘종’으로 두고, 강제 노역의 종속성은 뒤의 노동 표현으로 보강했습니다.
- source_word: חֹטְבֵי עֵצִים וְשֹׁאֲבֵי מַיִם
  english_pob_choice: cutters of wood and drawers of water
  chosen_korean: 나무를 베는 자들과 물을 긷는 자들
  alternatives_korean:
  - 나무꾼들과 물 긷는 자들
  - 장작을 패는 자들과 물을 긷는 자들
  - 목재를 자르는 자들과 물을 나르는 자들
  lexicon: HALOT
  rationale: 두 분사구를 직역하되 현대 한국어에서 이해 가능한 동작 표현으로 옮겼습니다. ‘베는/긷는’은 반복적 노역의 이미지를 유지합니다.
- source_word: לְבֵית אֱלֹהָי
  english_pob_choice: for the house of my God
  chosen_korean: 내 하나님의 집을 섬기게 될 것입니다
  alternatives_korean:
  - 내 하나님의 집을 위해
  - 내 하나님의 집에서
  lexicon: HALOT
  rationale: לְבֵית는 단순 장소보다 ‘~을 위하여/~에 속하여’의 목적·귀속을 띠므로, 한국어에서는 봉사 대상이 드러나도록 ‘내 하나님의 집을 섬기게 될 것입니다’로 풀어 옮겼습니다.
theological_decisions:
- issue: עֶבֶד의 한국어 대응에서 ‘종’과 ‘노예’ 중 선택
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 하인
  rationale: 본문은 강제된 종속 상태를 말하지만, 한국어에서 가장 직접적이면서도 본문 전체의 저주 선언을 과도하게 현대화하지 않는 표준어로 ‘종’을 택했습니다. 뒤의 노동 역할이 억압적 성격을 충분히 드러냅니다.
  doctrine_reference: Contested terms table for δοῦλος by analogy of bonded-status rendering
- issue: לְבֵית אֱלֹהָי의 목적/귀속 뉘앙스
  chosen_reading: 내 하나님의 집을 섬기게 될 것입니다
