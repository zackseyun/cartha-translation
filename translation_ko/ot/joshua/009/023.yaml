  naturalness: ‘너희 가운데서 종이 끊어지지 않을 것이니’는 단수 집합명사와 뒤따르는 복수 노동자 표현의 연결이 한국어에서 다소 어색합니다. ‘…나무를 베고 물을 긷는 노예들이 끊이지 않을 것입니다’는 지속되는 집단적 상태를 자연스럽게 표현합니다. 합쇼체도 일관되게 유지했습니다.
