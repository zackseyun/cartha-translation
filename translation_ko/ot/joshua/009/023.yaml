  lexicon: HALOT
  rationale: לְבֵית는 단순 장소보다 ‘~을 위하여/~에 속하여’의 목적·귀속을 띠므로, 한국어에서는 봉사 대상이 드러나도록 ‘내 하나님의 집을 섬기게 될 것입니다’로 풀어 옮겼습니다.
theological_decisions:
