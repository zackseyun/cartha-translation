  chosen_reading: 종
  alternative_readings:
  - 노예
  - 하인
  rationale: 본문은 강제된 종속 상태를 말하지만, 한국어에서 가장 직접적이면서도 본문 전체의 저주 선언을 과도하게 현대화하지 않는 표준어로 ‘종’을 택했습니다. 뒤의 노동 역할이 억압적 성격을 충분히 드러냅니다.
  doctrine_reference: Contested terms table for δοῦλος by analogy of bonded-status rendering
- issue: לְבֵית אֱלֹהָי의 목적/귀속 뉘앙스
  chosen_reading: 내 하나님의 집을 섬기게 될 것입니다
