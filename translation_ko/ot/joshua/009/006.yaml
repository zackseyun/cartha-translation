id: JOS.9.6
reference: Joshua 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
  footnotes:
  - marker: a
    text: Or, “make a treaty with us.” The Hebrew idiom is literally “cut a covenant with us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 여호수아에게, 곧 길갈의 진영으로 가서 그와 이스라엘 사람들에게 말했습니다. 「우리는 먼 땅에서 왔습니다. 그러니 이제 우리와 언약을 맺어 주십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리와 조약을 맺어 주십시오.” 히브리어 관용구는 문자적으로는 “우리와 언약을 자르십시오”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  english_pob_choice: to Joshua at the camp at Gilgal
  chosen_korean: 여호수아에게, 곧 길갈의 진영으로
  alternatives_korean:
  - 여호수아에게 길갈의 진영으로
  - 여호수아에게, 길갈 진영으로
  lexicon: WLC; HALOT
  rationale: 반복되는 אֶל의 이동 방향을 살리면서, 한국어에서는 첫 목적어를 ‘여호수아에게’로 두고 뒤를 동격 설명처럼 풀어 자연스럽게 표현했습니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 진지
  - 캠프
  - 진영
  lexicon: HALOT
  rationale: 군사적·집단적 야영의 뉘앙스를 살리기 위해 ‘진영’을 택했습니다. 단순한 숙영지보다 본문 맥락에 더 가깝습니다.
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들에게
  alternatives_korean:
  - 이스라엘 남자들에게
  - 이스라엘 사람들에게
  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 표현을 한국어에서 성별이 드러나는 직역보다 자연스러운 집합 표현으로 옮겼습니다. 다만 본문이 여호수아와 함께 있는 이스라엘 대표들을 가리키는 흐름은 유지했습니다.
- source_word: כִּרְתוּ לָנוּ בְרִית
  english_pob_choice: make a covenant with us
  chosen_korean: 우리와 언약을 맺어 주십시오
  alternatives_korean:
  - 우리와 언약을 맺으십시오
  - 우리와 계약을 맺어 주십시오
  - 우리와 조약을 맺어 주십시오
  lexicon: HALOT
  rationale: בְרִית의 성서적 용어 일관성을 따라 ‘언약’을 유지했습니다. 동사 כרת의 관용적 의미는 한국어에서 자연스럽게 ‘맺다’로 처리했습니다.
theological_decisions:
- issue: כִּרְתוּ לָנוּ בְרִית의 법적·외교적 성격
  chosen_reading: 언약
  alternative_readings:
  - 조약
  - 계약
  rationale: 문맥상 외교적 합의이지만, 히브리어 본문은 성서의 표준 용어 בְרִית를 사용합니다. 따라서 의미의 핵심을 훼손하지 않도록 ‘언약’을 본문에 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
