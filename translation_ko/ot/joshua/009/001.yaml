id: JOS.9.1
reference: Joshua 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
  footnotes:
  - marker: a
    text: Hebrew literally, 'when all the kings ... heard.' The object is left unstated here and is supplied in English as 'of it' from the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan.' The Hebrew expression can be rendered either way depending on geographic perspective.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the Shephelah,' the western foothill region.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이스라엘 자손이 요단 건너편의 모든 왕들, 곧 산지와 저지대와 큰 바다의 온 해안, 레바논 맞은편에 있는 헷 사람, 아모리 사람, 가나안 사람, 브리스 사람, 히위 사람, 여부스 사람이 그 일을 듣고 나니[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘모든 왕들이 ... 들었다’는 식으로 시작하며, 목적어는 문맥에서 보충됩니다.
    reason: source_note
  - marker: b
    text: ‘요단 건너편’은 관점에 따라 ‘요단 저편’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘저지대’는 히브리어 שְׁפֵלָה의 지리적 명칭인 ‘쉐펠라’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 ... 나니
  alternatives_korean:
  - 그리고 ... 있었습니다
  - 그러자 ...
  lexicon: HALOT
  rationale: 서사 시작 공식으로서 새 단락을 여는 기능을 살리되, 한국어에서는 자연스러운 연결어와 결과적 종결로 옮겼습니다.
- source_word: כִשְׁמֹעַ
  english_pob_choice: when ... heard of it
  chosen_korean: 그 일을 듣고
  alternatives_korean:
  - 듣자
  - 그것을 듣고
  lexicon: HALOT
  rationale: 히브리어는 목적어가 생략되어 있으므로 문맥상 가리키는 사건을 한국어에서 보충하되, 과도한 해석은 피했습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: who were beyond the Jordan
  chosen_korean: 요단 건너편의
  alternatives_korean:
  - 요단 저편의
  - 요단을 건너편의
  lexicon: HALOT
  rationale: 지리 표현의 관점 차이를 유지하면서도 한국어에서 가장 익숙한 성경적 지리 표현으로 옮겼습니다.
- source_word: בָּהָר וּבַשְּׁפֵלָה וּבְכֹל חוֹף הַיָּם הַגָּדוֹל אֶל מוּל הַלְּבָנוֹן
  english_pob_choice: in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon
  chosen_korean: 산지와 저지대와 큰 바다의 온 해안, 레바논 맞은편에 있는
  alternatives_korean:
  - 산지와 평지와 큰 바다의 온 해변, 레바논을 마주한
  - 산간지방과 쉐펠라와 큰 바다의 모든 해안, 레바논 반대편에 있는
  lexicon: HALOT
  rationale: בָּהָר는 ‘산지’, שְׁפֵלָה는 본문과 지리 범주를 살린 ‘저지대’, חוֹף는 ‘해안’으로 옮기고, אֶל מוּל는 방향 관계를 드러내는 ‘맞은편에 있는’으로 처리했습니다.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  english_pob_choice: the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite
  chosen_korean: 헷 사람, 아모리 사람, 가나안 사람, 브리스 사람, 히위 사람, 여부스 사람
  alternatives_korean:
  - 헷 족속, 아모리 족속, 가나안 족속, 브리스 족속, 히위 족속, 여부스 족속
  - 헷 족속들, 아모리 족속들, 가나안 족속들, 브리스 족속들, 히위 족속들, 여부스 족속들
  lexicon: HALOT
  rationale: 히브리어의 정관사 붙은 단수 민족명들을 한국어에서는 집합적 표현인 ‘사람’으로 자연스럽게 옮겨, 나열의 리듬을 살렸습니다.
theological_decisions:
- issue: 지리 목록의 범위와 방향 표현
  chosen_reading: 본문의 열거를 역사·지리적 범주로 그대로 유지하고, 레바논과의 상대적 방향은 ‘맞은편에 있는’으로 옮겼습니다.
  alternative_readings:
  - ‘레바논을 향하여’
  - ‘레바논 앞쪽에 있는’
  rationale: 본문은 이스라엘 주변의 세력권을 넓게 열거하는 문맥이므로, 방향을 지나치게 단순화하지 않고 원문의 시각적 배치를 보존하는 것이 적절합니다.
  doctrine_reference: 지리적 서술의 직역성
- issue: 생략된 목적어 보충
  chosen_reading: ‘듣고’의 목적어는 문맥상 드러나는 사건으로 보충하여 ‘그 일을 듣고’로 옮겼습니다.
  alternative_readings:
  - ‘듣고’
  - ‘그것을 듣고’
  rationale: 히브리어의 목적어 생략을 한국어에서 그대로 두면 의미가 덜 분명해질 수 있으므로, 문맥이 허용하는 최소 보충을 했습니다.
  doctrine_reference: 문맥 보충의 정당성
