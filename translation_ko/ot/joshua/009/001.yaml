  source_fidelity: 초안은 주어가 아닌 ‘이스라엘 자손’을 삽입하여, 히브리어의 주어인 ‘모든 왕들’을 바꾸었습니다. 또한 민족명들은 왕들을 수식하거나 동격으로 열거되어야 하나, 초안에서는 지리 목록 뒤에 바로 이어져 문장 구조가 불분명합니다. 수정문은 히브리어의 시간절과 9:2로 이어지는 미완결 구문을 보존합니다. 목적어 ‘그 일’은 원문에서 생략되었으나 문맥상 최소한으로 보충한 것입니다.
