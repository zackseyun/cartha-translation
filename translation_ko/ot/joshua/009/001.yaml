  rationale: 원문에 없는 ‘이스라엘 자손’을 제거하고, 모든 왕들이 각 민족 집단에 속한다는 수식 관계를 명확히 했습니다. 히브리어 9:1은 9:2와 이어지는 시간절이므로, 한국어에서도 절 끝을 쉼표로 남겨 원문의 연결성과 미완결성을 보존했습니다. 지리적 상대 위치와 생략된 목적어에 관한 각주는 유지·정확화했습니다.
