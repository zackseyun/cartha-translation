  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
  footnotes:
  - marker: a
    text: Or, more formally, 'hewers of wood and drawers of water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 관리자들이 그들에게 말했습니다. "그들이 살아 있게 하십시오." 그래서 그들은 모든 회중을 위해 나무를 베는 사람들과 물을 긷는 사람들이 되었는데, 관리자들이 그들에게 말한 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘나무를 베는 자들과 물을 긷는 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  english_pob_choice: the leaders
  chosen_korean: 관리자들
  alternatives_korean:
  - 지도자들
  - 우두머리들
  - 방백들
  lexicon: HALOT
  rationale: 이 문맥의 נָשִׂיאִים은 기브온 사람들에게 판결을 내린 공동체의 공식 대표들을 가리키므로, 현대 한국어에서 기능이 분명한 ‘관리자들’로 옮겨 지위를 드러냈습니다.
- source_word: יִחְיוּ
  english_pob_choice: Let them live
  chosen_korean: 그들이 살아 있게 하십시오
  alternatives_korean:
  - 그들이 살게 하십시오
  - 그들을 살려 두십시오
  - 그들은 살아야 합니다
  lexicon: HALOT
  rationale: 직접 명령/허용의 뉘앙스를 살리기 위해 단순 서술이 아니라 명령형으로 옮겼고, 결과 상태보다 생존 허용의 결정을 강조했습니다.
- source_word: חֹטְבֵי עֵצִים
  english_pob_choice: woodcutters
  chosen_korean: 나무를 베는 사람들
  alternatives_korean:
  - 목재를 자르는 사람들
  - 장작 패는 사람들
  - 나무꾼들
  lexicon: HALOT
  rationale: 문자적으로는 ‘나무를 베는 사람들’이 가장 직접적이며, 현대 독자가 역할을 즉시 이해하도록 자연스럽게 풀어 옮겼습니다.
- source_word: שֹׁאֲבֵי מַיִם
  english_pob_choice: water-drawers
  chosen_korean: 물을 긷는 사람들
  alternatives_korean:
  - 물 긷는 자들
  - 물을 끌어오는 사람들
  - 물 운반자들
  lexicon: HALOT
  rationale: 동일한 병렬 구조를 유지하면서 מים을 실제로 ‘길어 올려 옮기는’ 일을 뜻하는 한국어 관용을 살렸습니다.
- source_word: לְכָל הָעֵדָה
  english_pob_choice: for all the congregation
  chosen_korean: 모든 회중을 위해
  alternatives_korean:
  - 모든 공동체를 위해
  - 온 회중을 위해
  - 온 모임을 위해
  lexicon: HALOT
  rationale: עֵדָה는 계약 공동체의 모임을 가리키므로, 평이하면서도 공동체성을 보존하는 ‘회중’을 택했습니다.
theological_decisions:
- issue: 직접 인용 내부의 명령문 어조
  chosen_reading: '"그들이 살아 있게 하십시오"로 옮겨, 관리들의 판결이 단순한 예언이 아니라 생명 보존을 허용하는 공식 명령임을 드러냈습니다.'
  alternative_readings:
  - '"그들이 살게 하십시오"'
  - '"그들은 살아야 합니다"'
  rationale: 히브리어 יִחְיוּ는 이 맥락에서 결정적 허용을 나타내므로, 합쇼체 명령문으로 재현해 판결의 공적 성격을 살렸습니다.
  doctrine_reference: 서사 문맥의 법적·공동체적 선언
