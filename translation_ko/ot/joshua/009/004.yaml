source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
  footnotes:
  - marker: a
    text: Or 'made provisions for themselves'; the Hebrew verb וַיִּצְטַיָּרוּ is difficult and has been understood in more than one way. The context of deceptive appearance supports 'disguised themselves' here.
    reason: alternative_reading
  - marker: b
    text: Or 'bound up' or 'tied up,' describing wineskins repaired by tying after they had split.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 속임수를 써서 가서 변장하고, 나귀에 실을 낡은 자루들과 낡고 갈라져 덧댄 포도주 가죽부대들을 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들을 위해 준비하였다’. 히브리어 동사 וַיִּצְטַיָּרוּ는 난해하여 여러 방식으로 이해되어 왔습니다. 앞뒤 문맥은 외형을 꾸며 속이는 의미를 강하게 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘묶인’ 또는 ‘동여맨’. 포도주 가죽부대가 갈라진 뒤 끈으로 묶어 수선된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  english_pob_choice: with cunning
  chosen_korean: 속임수로
  alternatives_korean:
