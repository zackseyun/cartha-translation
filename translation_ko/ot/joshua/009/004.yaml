id: JOS.9.4
reference: Joshua 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
  footnotes:
  - marker: a
    text: Or 'made provisions for themselves'; the Hebrew verb וַיִּצְטַיָּרוּ is difficult and has been understood in more than one way. The context of deceptive appearance supports 'disguised themselves' here.
    reason: alternative_reading
  - marker: b
    text: Or 'bound up' or 'tied up,' describing wineskins repaired by tying after they had split.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 속임수로 행동하고, 가서 변장하고, 자기들의 나귀를 위한 낡은 자루와 낡은 포도주 가죽부대들—찢어지고 덧댄 것들—을 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들을 위해 준비하였다’. 히브리어 동사 וַיִּצְטַיָּרוּ는 난해하여 여러 방식으로 이해되어 왔습니다. 그러나 앞뒤 문맥은 외형을 꾸며 속이는 의미를 강하게 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘묶인’, ‘동여맨’. 포도주 가죽부대가 갈라진 뒤 끈으로 수선된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  english_pob_choice: with cunning
  chosen_korean: 속임수로
  alternatives_korean:
  - 간교하게
  - 교묘하게
  lexicon: HALOT
  rationale: 문맥상 기브온 사람들의 의도적 기만을 드러내므로, 단순한 ‘지혜로’보다 속임수의 뉘앙스를 살린 표현이 적절합니다.
- source_word: וַיִּצְטַיָּרוּ
  english_pob_choice: disguised themselves
  chosen_korean: 변장하고
  alternatives_korean:
  - 자기들을 위한 준비를 하고
  - 사신인 체하고
  lexicon: HALOT
  rationale: 이 동사는 난해하지만 바로 뒤의 낡은 물품들과 함께 보면 외형을 꾸며 속이려는 행위로 읽는 것이 서술 흐름에 가장 잘 맞습니다.
- source_word: נֹאדוֹת יַיִן
  english_pob_choice: wineskins
  chosen_korean: 포도주 가죽부대들
  alternatives_korean:
  - 포도주 부대들
  - 포도주 주머니들
  lexicon: HALOT
  rationale: 히브리어는 포도주를 담는 가죽 용기를 가리키므로, 한국어에서도 재질을 드러내는 ‘가죽부대’가 구체성을 잘 보존합니다.
- source_word: מְבֻקָּעִים וּמְצֹרָרִים
  english_pob_choice: split open and patched
  chosen_korean: 찢어지고 덧댄 것들
  alternatives_korean:
  - 갈라지고 묶어 고친 것들
  - 터지고 꿰맨 것들
  lexicon: HALOT
  rationale: 두 분사는 손상과 수리 상태를 함께 보여 주므로, 단순히 ‘낡은’으로만 묶지 않고 물리적 상태를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 기만의 서술을 도덕화하지 않고 사건 묘사로 유지할지 여부
  chosen_reading: ‘속임수로’와 ‘변장하고’를 사용해 서술의 의도적 기만을 드러내되, 본문이 직접 평가를 덧붙이지는 않도록 유지했습니다.
  alternative_readings:
  - ‘지혜롭게’로 완화
  - ‘준비하고’로 중립화
  rationale: 이 절은 기브온 사람들의 사기성 행동을 서술하는 맥락이므로, 평가를 희석하지 않고 본문이 가진 긴장을 그대로 전달하는 것이 적절합니다.
  doctrine_reference: 서사 본문의 직접적 묘사 보존
