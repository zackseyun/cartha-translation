  to: 또 요단강 건너편에 있던 아모리 사람의 두 왕, 곧 헤스본 왕 시혼과 아스다롯에 있던 바산 왕 옥에게 하신 모든 일도[a][b]
  rationale: 원문이 앞 절에 문법적으로 이어지는 목적어구임을 보존하여, ‘말씀드렸습니다’라는 비원문적 서술어를 제거했습니다. ‘그들에게 하신 모든 일’의 의미 관계를 유지하고, 아스다롯의 위치 관계절을 옥에 직접 연결했습니다. 각주 표지는 각각 해당 표현 뒤에 배치했습니다.
