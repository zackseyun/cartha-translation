lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그리고 ... 하신 모든 일
  alternatives_korean:
  - 그리고 ... 한 모든 일
  - 그리고 ... 하신 모든 것
  lexicon: HALOT
  rationale: 히브리어는 앞 문맥의 주어를 이어받는 서술로, 한국어에서는 높임을 유지하며 ‘하신 모든 일’로 자연스럽게 옮기되 ‘all that’을 포괄적으로 살렸습니다.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  english_pob_choice: to the two kings of the Amorites
  chosen_korean: 아모리 사람의 두 왕에게
  alternatives_korean:
  - 아모리 족속의 두 왕에게
  - 아모리인의 두 왕에게
  lexicon: HALOT
  rationale: ‘아모리 사람’은 현대 한국어에서 민족·집단을 자연스럽게 드러내며, ‘two kings’의 복수를 그대로 반영합니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: who were beyond the Jordan
  chosen_korean: 요단강 건너편에 있는
  alternatives_korean:
  - 요단강 건너편의
  - 요단강 저편에 있는
  lexicon: HALOT
  rationale: ‘beyond/across the Jordan’의 지리적 관점을 살리면서도 한국어 독자에게 가장 분명한 표현으로 옮겼습니다.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  english_pob_choice: to Sihon king of Heshbon and to Og king of Bashan
  chosen_korean: 곧 헤스본의 왕 시혼과 바산의 왕 옥
  alternatives_korean:
  - 헤스본 왕 시혼과 바산 왕 옥
  - 헤스본의 왕 시혼과 바산의 왕 옥
  lexicon: HALOT
  rationale: 고유명사는 관용적 음역을 따르고, 왕호는 원문과 같이 병렬 구조를 유지했습니다.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  english_pob_choice: who was at Ashtaroth
  chosen_korean: 옥은 아스다롯에 있었습니다
  alternatives_korean:
  - 옥은 아스다롯에 있었습니다
  - 옥은 아스다롯에 있었습니다
  lexicon: HALOT
  rationale: 관계절은 옥의 거처/거점 위치를 밝히므로 ‘있었습니다’로 풀어 주었고, 지명은 표준 음역을 따랐습니다.
theological_decisions:
- issue: 문맥상 생략된 주어를 한국어에서 어떻게 드러낼지
  chosen_reading: 앞 문맥을 따라 하나님을 주어로 이해하되, 본절 자체에는 주어를 새로 삽입하지 않고 ‘하신’으로 처리했습니다.
  alternative_readings:
  - ‘여호수아가 한 모든 일’처럼 행위자를 명시하기
  - ‘주님께서 하신 모든 일’로 주어를 명시하기
  rationale: 히브리어 본문은 동사만 두고 앞 문맥의 주어를 이어받습니다. 한국어에서도 그 구조를 보존해 본절의 압축성을 지켰습니다.
  doctrine_reference: 문맥 계승 주어 보존 원칙
