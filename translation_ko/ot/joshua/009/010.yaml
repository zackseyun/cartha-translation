translation:
  language: ko
  text: 그리고 요단강 건너편에 있는 아모리 사람의 두 왕에게, 곧 헤스본의 왕 시혼과 바산의 왕 옥에게 — 옥은 아스다롯에 있었습니다 — 하신 모든 일을 말씀드렸습니다.[a][b]
