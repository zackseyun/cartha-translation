  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'did not attack them' or 'did not kill them.' The Hebrew verb can denote striking with lethal force depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the assembly murmured against the leaders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 자손은 그들을 치지 않았습니다. 회중의 지도자들이 이스라엘의 하나님 야훼로 그들에게 맹세했기 때문입니다. 그리고 온 회중이 지도자들을 향해 불평했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역입니다. 더 일반적으로는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문맥에 따라 ‘공격하다’ 또는 ‘죽이다’까지 뜻할 수 있습니다. 여기서는 폭력 행위를 하지 않았다는 점을 살려 ‘치다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘회중’은 이스라엘의 모인 공동체를 가리키며, 경우에 따라 ‘총회’ 또는 ‘모임’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리되 한국어에서도 자연스럽게 읽히는 표준적 성경 표현으로 옮겼습니다. 성별 중립화보다 원문 표지를 우선했습니다.
- source_word: הִכּוּם
  english_pob_choice: did not strike them
  chosen_korean: 그들을 치지 않았습니다
  alternatives_korean:
  - 그들을 공격하지 않았습니다
  - 그들을 죽이지 않았습니다
  - 그들을 치지 않았습니다
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/쳐서 해치다’를 따라, 결과를 ‘죽이다’로 과잉 특정하지 않고 군사적 폭력의 금지를 드러냈습니다.
- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
  - 회중의 우두머리들
  - 총회의 지도자들
  - 회중의 장들
  lexicon: HALOT
  rationale: נְשִׂיאִים은 권위를 지닌 지도층을 가리키므로 ‘지도자들’이 가장 مستقیم하며, עֵדָה는 이 문맥에서 공동체로 모인 이스라엘을 가리켜 ‘회중’이 적절합니다.
- source_word: וַיִּלֹּנוּ
  english_pob_choice: grumbled
  chosen_korean: 불평했습니다
  alternatives_korean:
  - 투덜거렸습니다
  - 원망했습니다
  - 불평했습니다
  lexicon: HALOT
  rationale: 공동체 전체가 지도자들을 향해 보인 불만을 한국어로 자연스럽게 전달하면서도, 원문의 집단적 항의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신명사 표기를 음역하여 언약 이름의 식별 가능성을 보존했습니다. 본문 내 ‘하나님’과 결합해도 신적 호칭의 중첩이 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל의 서술
  chosen_reading: 이스라엘의 하나님 야훼로 그들에게 맹세했기 때문입니다
  alternative_readings:
  - 이스라엘의 하나님 야훼의 이름으로 그들에게 맹세했기 때문입니다
  - 이스라엘의 하나님 야훼 안에서 그들에게 맹세했기 때문입니다
  rationale: 맹세의 도구를 나타내는 בְּ의 용법을 한국어 ‘~로’로 자연스럽게 옮겨, 맹세가 야훼를 근거로 이루어졌음을 분명히 했습니다.
  doctrine_reference: 'HALOT: שׁבע with preposition ב'
