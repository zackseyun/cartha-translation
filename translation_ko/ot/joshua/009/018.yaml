revisions:
- from: 그러나 이스라엘 자손은 그들을 치지 않았습니다. 회중의 지도자들이 이스라엘의 하나님 야훼로 그들에게 맹세했기 때문입니다. 그리고 온 회중이 지도자들을 향해 불평했습니다.[a][b][c]
  to: 그러나 이스라엘 자손[a]은 그들을 치지[b] 않았습니다. 회중의 지도자들이 야훼, 곧 이스라엘의 하나님을 두고 그들에게 맹세했기 때문입니다. 그러자 온 회중[c]이 지도자들에게 불평했습니다.
  rationale: 맹세의 근거를 나타내는 히브리어 בַּיהוָה를 한국어 관용에 맞게 ‘야훼, 곧 이스라엘의 하나님을 두고’로 고쳤습니다. 이는 야훼가 맹세의 대상·보증자라는 의미를 유지하면서도 원문의 동격 관계를 드러냅니다. 나머지 본문은 원문의 폭력 동사와 공동체의 불평이라는 의미를 보존하고, 각주 표지만 관련 어구에 맞추어 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:57:27Z'
