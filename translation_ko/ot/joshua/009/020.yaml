    rationale: וְהַחֲיֵה אֹתָם은 이 발화에서 이스라엘 지도자들이 취할 조치를 말하는 흐름이며, 앞의 נַעֲשֶׂה(‘우리가 하겠다’)와 함께 1인칭 복수의 결의로 옮겨야 합니다. 청자에게 요청하는 ‘-십시오’는 원문에 없는 화자-청자 관계를 도입합니다.
