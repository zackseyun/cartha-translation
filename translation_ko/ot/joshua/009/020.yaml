- from: 이것이 우리가 그들에게 할 일이니, 그들을 살려 두십시오. 그러면 우리가 그들에게 맹세한 그 맹세 때문에 진노가 우리 위에 임하지 않을 것입니다.[a][b]
  to: 우리가 그들에게 이렇게 하겠습니다. 그들을 살려 두겠습니다.[a] 그래야 우리가 그들에게 맹세한 맹세 때문에 우리에게 진노가 내리지 않을 것입니다.[b]
  rationale: 명령형을 1인칭 복수 결의형으로 고쳐 히브리어 발화의 화자와 문법적 흐름을 보존했습니다. 진노의 주체는 원문처럼 명시하지 않았고, 각주에서만 문맥적 가능성을 제한적으로 설명했습니다.
