id: JOS.9.20
reference: Joshua 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
  footnotes:
  - marker: a
    text: Or 'and keep them alive' or 'and spare them.'
    reason: lexical_alternative
  - marker: b
    text: '''Wrath'' is likely divine wrath in context, though the Hebrew text does not explicitly say ''the LORD''s wrath.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이것이 우리가 그들에게 할 일이니, 그들을 살려 두십시오. 그러면 우리가 그들에게 맹세한 그 맹세 때문에 진노가 우리 위에 임하지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살려 두십시오’는 히브리어의 사역형을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 진노의 대상을 직접 밝히지 않지만, 문맥상 언약 위반에 대한 신적 진노를 가리킬 가능성이 큽니다.
    reason: theological_note
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה
  english_pob_choice: This is what we will do
  chosen_korean: 이것이 우리가 할 일
  alternatives_korean:
  - 우리가 이렇게 하겠습니다
  - 이것이 우리가 하려는 것입니다
  lexicon: WLC + HALOT
  rationale: 지시어 זֹאת의 담화 기능을 살리면서, 조언/결의의 미래적 뉘앙스를 한국어 자연문으로 옮겼습니다.
- source_word: וְהַחֲיֵה אֹתָם
  english_pob_choice: let them live
  chosen_korean: 그들을 살려 두십시오
  alternatives_korean:
  - 그들을 살려 주십시오
  - 그들을 살게 하십시오
  lexicon: WLC + HALOT
  rationale: חיה의 사역형은 단순히 '살게 하다'보다 '살려 두다'가 보존·유예의 의미를 더 분명히 드러내므로 이를 택했습니다.
- source_word: קֶצֶף
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 격노
  lexicon: HALOT
  rationale: 문맥상 언약 위반과 연결된 강한 분을 가리키므로, 한국어에서 신적/심판적 뉘앙스가 잘 사는 '진노'를 사용했습니다.
- source_word: עַל הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  english_pob_choice: because of the oath that we swore to them
  chosen_korean: 우리가 그들에게 맹세한 그 맹세 때문에
  alternatives_korean:
  - 그들에게 한 맹세 때문에
  - 우리가 그들에게 서약한 그 서약 때문에
  lexicon: HALOT
  rationale: עַל은 원인/근거를 나타내므로 '때문에'로 옮기되, נִשְׁבַּעְנוּ의 맹세 행위를 분명히 보여 주기 위해 구조를 약간 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: קֶצֶף의 암시적 신적 대상
  chosen_reading: 본문에는 '여호와의'가 명시되지 않으므로, '진노'만 두고 신적 주체를 본문에 추가하지 않았습니다.
  alternative_readings:
  - '''여호와의 진노''로 명시'
  - '''하나님의 진노''로 명시'
  rationale: 히브리어 본문은 단지 קֶצֶף('진노')만 말하므로, 주어를 보충해 의미를 과도하게 좁히지 않고 POB의 절제된 처리에 맞췄습니다.
  doctrine_reference: 번역 철학의 원문 충실성 및 암시적 의미 보존
