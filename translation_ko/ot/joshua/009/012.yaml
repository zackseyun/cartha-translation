id: JOS.9.12
reference: Joshua 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
  footnotes:
  - marker: a
    text: Or 'has become moldy' or 'is spotted.' The Hebrew term refers to something marked with points or spots; in the context of old bread, the exact nuance may be crumbly, cracked, or mold-specked.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 우리 빵입니다. 우리가 여러분에게 가려고 길을 떠난 날, 각자의 집에서 이것을 양식으로 가져갈 때에는 따뜻했지만, 이제 보십시오, 말라서 부스러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곰팡이가 폈다’, ‘점무늬가 생겼다’로 옮길 수 있습니다. 히브리어는 점이나 반점이 찍힌 상태를 가리키며, 오래된 빵의 문맥에서는 부스러짐, 갈라짐, 또는 점무늬가 생긴 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  english_pob_choice: This bread of ours
  chosen_korean: 이 빵은
  alternatives_korean:
  - 우리의 빵은
  - 이 우리의 빵은
  lexicon: HALOT
  rationale: 지시어와 소유격의 결합을 한국어에서는 자연스럽게 주어 도치 없이 ‘이 빵은’으로 옮기되, 뒤의 ‘우리의 양식’으로 소유 관계를 분명히 했습니다.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  english_pob_choice: we took it as our provisions
  chosen_korean: 우리의 양식으로 가져갔을 때는
  alternatives_korean:
  - 여행 양식으로 챙겼을 때는
  - 여행할 양식으로 준비했을 때는
  lexicon: HALOT
  rationale: 히트파엘 동사는 단순 소유가 아니라 여행을 위해 식량을 마련한 뜻이므로, ‘양식으로 가져갔다’고 옮겨 준비 행위를 드러냈습니다.
- source_word: בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם
  english_pob_choice: on the day we set out to come to you
  chosen_korean: 여러분에게 오려고 길을 떠난 날
  alternatives_korean:
  - 여러분에게 가려고 떠난 날
  - 여러분에게 오기 위해 출발한 날
  lexicon: HALOT
  rationale: 화자 입장에서 목적지를 향한 이동은 ‘오다’가 자연스럽고, ‘길을 떠난 날’이 זמן 표현과 출발의 뉘앙스를 잘 살립니다.
- source_word: וְעַתָּה הִנֵּה
  english_pob_choice: but now, look
  chosen_korean: 이제 보십시오
  alternatives_korean:
  - 그리고 이제 보십시오
  - 이제, 보십시오
  lexicon: HALOT
  rationale: 대조와 주목 촉구를 합쇼체로 간결하게 살리기 위해 ‘이제 보십시오’로 옮겼습니다.
- source_word: יָבֵשׁ וְהָיָה נִקֻּדִים
  english_pob_choice: it is dry and has become moldy
  chosen_korean: 마르고 부스러졌습니다
  alternatives_korean:
  - 마르고 곰팡이가 폈습니다
  - 마르고 점점이 되었습니다
  lexicon: HALOT
  rationale: 마른 오래된 빵에 대한 문맥상 ‘נִקֻּדִים’의 정확한 색조는 ‘점무늬’보다 부스러짐에 더 가깝게 전달되므로, POB의 유보를 반영해 강한 ‘곰팡이’ 대신 상태 변화를 서술했습니다.
theological_decisions:
- issue: 문맥상 빵의 상태 묘사인 יָבֵשׁ וְהָיָה נִקֻּדִים의 번역
  chosen_reading: ‘마르고 부스러졌습니다’로 처리해, 명시되지 않은 부패 원인(곰팡이)을 단정하지 않았습니다.
  alternative_readings:
  - ‘마르고 곰팡이가 폈습니다’
  - ‘마르고 점점이 되었습니다’
  rationale: 히브리어는 ‘점, 반점, 점무늬’ 계열의 어감을 가지며, 문맥상 오래된 빵의 손상 상태를 보여 주지만 곰팡이를 확정하진 않습니다. 따라서 해석을 과도하게 좁히지 않는 방향을 택했습니다.
  doctrine_reference: 본문 의미 보존과 과도한 추정 방지
