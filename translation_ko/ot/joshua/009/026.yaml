base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 이같이 하여, 이스라엘 자손의 손에서 그들을 건져 내었으며, 이스라엘 자손은 그들을 죽이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 직역하면 ‘이스라엘의 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  english_pob_choice: So he did this for them
  chosen_korean: 그가 그들에게 그대로 행하였고
  alternatives_korean:
  - 그가 그들을 위해 이렇게 하였고
  - 그가 그들에게 이같이 하였고
  lexicon: HALOT
  rationale: עשה + כן의 관용을 한국어로 자연스럽게 살리기 위해 ‘그대로 행하다’를 택했고, 앞 문맥을 받는 지시성을 유지했습니다.
- source_word: וַיַּצֵּל
  english_pob_choice: he delivered
  chosen_korean: 그들을 구해 주었으며
  alternatives_korean:
  - 그들을 건져 주었으며
  - 그들을 구출하였으며
  lexicon: HALOT
  rationale: נצל의 핵심 의미인 구출·구제를 살리되, 합쇼체 서술 흐름에서 자연스러운 ‘구해 주다’를 사용했습니다.
- source_word: מִיַּד בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the hand of the sons of Israel
  chosen_korean: 이스라엘의 자손의 손에서
  alternatives_korean:
  - 이스라엘 자손의 손에서
  - 이스라엘 사람들의 손에서
  lexicon: HALOT
  rationale: ‘손에서’라는 구체적 지배·통제의 이미지를 유지했고, בְּנֵי יִשְׂרָאֵל은 원문 형식을 살려 ‘이스라엘의 자손’으로 옮겼습니다.
- source_word: וְלֹא הֲרָגוּם
  english_pob_choice: and they did not kill them
  chosen_korean: 그들은 그들을 죽이지 않았습니다
  alternatives_korean:
  - 그리고 그들은 그들을 죽이지 않았습니다
  - 그리하여 그들은 그들을 죽이지 않았습니다
  lexicon: HALOT
  rationale: הרג의 평이한 의미를 그대로 반영해 ‘죽이지 않았다’로 옮겼고, 히브리어의 단순한 병렬을 살렸습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집단 명칭 보존
  chosen_reading: ‘이스라엘의 자손’으로 직역해 남성 복수 표지를 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’로 일반화
  - ‘이스라엘 백성’으로 의역
  rationale: 원문은 분명히 ‘자손’이라는 남성 복수 표현을 쓰므로, 이를 평준화하지 않고 보존하는 편이 स्रोत의 형식을 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
