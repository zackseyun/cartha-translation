  verdict: revise
  source_fidelity: 히브리어의 세 절은 여호수아가 기브온 사람들에게 ‘이같이’ 행하고, 이스라엘 자손의 손에서 그들을 건져 내었으며, 이스라엘 자손이 그들을 죽이지 않았다는 순서를 나타냅니다. 수정문은 이 주어 관계와 ‘손에서’ 관용을 보존합니다.
  naturalness: 초안의 ‘이스라엘의 자손의 손에서’는 겹친 소유격 때문에 다소 부자연스럽고, ‘그들은 그들을’은 두 집단의 지시 대상이 불필요하게 모호합니다. ‘이스라엘 자손의 손에서’ 및 명사 주어의 반복이 현대 한국어 문체에서 더 명료하고 자연스럽습니다.
  terminology: בני ישראל은 원문의 표현을 따라 ‘이스라엘 자손’으로 유지했습니다. וַיַּעַשׂ לָהֶם כֵּן은 ‘그대로 행하다’보다 앞 문맥을 가리키는 ‘이같이 하다’가 적절합니다. נצל은 ‘건져 내다’로, הרג은 ‘죽이다’로 충실히 옮겼습니다.
  issues:
