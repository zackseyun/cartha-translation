  edition: WLC
  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
  footnotes:
  - marker: a
    text: Or 'moldy.' The Hebrew term translated 'crumbly' is rare and may denote bread that was dry and broken into pieces, though some understand it as 'moldy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 발에는 낡고 기운 샌들을 신고 있었고, 몸에는 해진 옷을 입고 있었으며, 그들이 지닌 양식의 빵은 모두 말라 부스러져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곰팡이 핀’. 여기서 ‘부스러져 있다’로 번역한 히브리어 낱말은 드물게 쓰이며, 마르고 조각조각 부서진 빵을 가리킬 수 있습니다. 그러나 일부는 이를 ‘곰팡이 핀’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְעָלוֹת
  english_pob_choice: sandals
  chosen_korean: 샌들
  alternatives_korean:
  - 신발
  - 샌달
  lexicon: HALOT
  rationale: 고대 근동의 발에 신는 신발을 구체적으로 가리키므로, 일반어 ‘신발’보다 ‘샌들’이 더 직접적입니다.
- source_word: בָּלוֹת
  english_pob_choice: worn-out
  chosen_korean: 헐고
  alternatives_korean:
  - 낡고
  - 헤지고
  lexicon: HALOT
  rationale: 오래 써서 닳아 해진 상태를 나타내므로, ‘헐고’가 문맥의 물리적 마모를 잘 드러냅니다.
- source_word: מְטֻלָּאוֹת
  english_pob_choice: patched
  chosen_korean: 기운
  alternatives_korean:
  - 덧댄
  - 수선한
  lexicon: HALOT
  rationale: ‘꿰매어 덧붙이다’의 의미를 살려 옷의 수선 흔적을 간결하게 표현했습니다.
- source_word: נִקֻּדִים
  english_pob_choice: crumbly
  chosen_korean: 부스러졌습니다
  alternatives_korean:
  - 곰팡이 핀
  - 가루처럼 부서진
  lexicon: HALOT
  rationale: 이 희귀어는 마른 뒤 조각나 부서진 빵의 상태를 가리킬 수 있으므로, POB의 ‘crumbly’를 따라 ‘부스러졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 빵의 상태를 ‘곰팡이’로 좁히지 않는 문제
  chosen_reading: 문맥상 양식이 말라 부스러진 상태를 본문 본의로 살렸습니다.
  alternative_readings:
  - 곰팡이 핀
  - 상해 버린
  rationale: 영어 POB도 ‘crumbly’를 본문값으로 두고 ‘moldy’는 각주로 열어 두므로, 본문은 상태를 직접적으로 나타내고 곰팡이 해석은 열어 두는 것이 소스에 충실합니다.
  doctrine_reference: source_text_priority
