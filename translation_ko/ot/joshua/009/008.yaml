source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
  footnotes:
  - marker: a
    text: Or, 'We are your slaves.' The Hebrew עֲבָדֶיךָ can denote either servants or slaves; here it is rendered 'servants' because the speakers are using deferential language in a diplomatic appeal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 여호수아에게 말했습니다. “우리는 당신의 종들입니다.”[a] 여호수아가 그들에게 말했습니다. “여러분은 누구이며, 어디에서 왔습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리는 당신의 노예들입니다.’ 히브리어 עֲבָדֶיךָ는 문맥에 따라 종 또는 노예를 뜻할 수 있습니다. 여기서는 외교적으로 복종을 표하는 말이므로 ‘종들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 히브리어 עֶבֶד는 문맥에 따라 종/노예를 아우르지만, 여기서는 기브온 사람들이 외교적으로 복종을 표하며 말하는 장면이므로 한국어에서는 자연스럽고 공손한 ‘종들’이 적절합니다. ‘노예들’은 법적 예속 상태를 강하게 띠어 문맥보다 더 강하게 들릴 수 있습니다.
- source_word: מִי אַתֶּם
  english_pob_choice: Who are you
  chosen_korean: 너희는 누구이며
  alternatives_korean:
  - 당신들은 누구이며
  - 누구입니까
  lexicon: HALOT
  rationale: 히브리어는 직설적인 정체 질문이므로 불필요한 명사를 보태지 않고 그대로 ‘너희는 누구’로 옮겼습니다. 여호수아가 상대에게 묻는 직접 화법이므로 합쇼체 문맥 안에서 반말형 질문을 유지했습니다.
- source_word: וּמֵאַיִן תָּבֹאוּ
  english_pob_choice: and where do you come from
  chosen_korean: 어디에서 왔느냐
  alternatives_korean:
  - 어디서 오느냐
  - 어디에서 오고 있느냐
  lexicon: HALOT
  rationale: מֵאַיִן은 출신·기원을 묻는 ‘어디에서’이고, 동사의 시제는 한국어에서 현재형 질문보다 도착 기원을 묻는 과거 지향 표현 ‘왔느냐’가 자연스럽습니다. 영어 POB의 ‘where do you come from’도 이 provenance 의미를 반영합니다.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  english_pob_choice: They said ... Then Joshua said
  chosen_korean: 그들이 말했습니다 ... 여호수아가 그들에게 말했습니다
  alternatives_korean:
  - 그들이 말했습니다 ... 그러자 여호수아가 말했습니다
  - 그들이 말했습니다 ... 그리고 여호수아가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형 내러티브는 현대 한국어에서 자연스러운 단순 과거 서술로 옮기되, 화자 전환은 ‘그러자/여호수아가’로 분명히 했습니다. ‘그들에게’는 אחר־אֵלֶם의 대상을 명시해 대화 흐름을 살렸습니다.
theological_decisions:
- issue: Joshua’s direct speech register toward the Gibeonites
  chosen_reading: 여호수아의 질문은 합쇼체 내 화법 안에서 ‘너희는 누구이며, 어디에서 왔느냐?’로 유지했습니다.
  alternative_readings:
  - 더 높인 ‘당신들은 누구이며, 어디에서 왔습니까?’
  - 완화한 중립체 질문
  rationale: 히브리어 원문은 상대를 정체성 측면에서 직접 추궁하는 짧은 질문이며, 한국어에서는 서술 문장은 합쇼체, 인용 내부 질문은 자연스러운 직접 화법으로 분리하는 것이 장면의 긴장감을 잘 살립니다.
  doctrine_reference: Narrative speech register
