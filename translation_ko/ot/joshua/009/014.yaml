  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
  footnotes:
  - marker: a
    text: Literally, 'the mouth of the LORD'; that is, his direction or decision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들이 그들의 양식을 조금 가져갔지만, 야훼의 뜻을 묻지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입’입니다. 곧 야훼의 지시나 결정, 응답을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: took
  chosen_korean: 가져갔지만
  alternatives_korean:
  - 가졌지만
  - 취했지만
  lexicon: HALOT
  rationale: לקח의 기본적인 ‘취하다/가져가다’ 뜻을 살려, 행동의 구체성을 유지하면서 자연스러운 서술로 옮겼습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 그 사람들은
  lexicon: HALOT
  rationale: 문맥상 특정 대표자들을 가리키지만 원문 자체는 단순히 ‘사람들/남자들’이므로, 지나치게 역할을 규정하지 않는 표현을 택했습니다.
- source_word: מִצֵּידָם
  english_pob_choice: some of their provisions
  chosen_korean: 그들의 양식을 조금
  alternatives_korean:
  - 그들의 양식 중 일부를
  - 그들의 비상식량을 조금
  lexicon: HALOT
  rationale: צֵיד는 여행용 양식·보급품을 뜻하므로, 부분격 מִן을 반영해 ‘조금’으로 일부 취득을 드러냈습니다.
- source_word: פִּי יְהוָה
  english_pob_choice: the counsel of Yahweh
  chosen_korean: 야훼의 뜻
  alternatives_korean:
  - 야훼의 말씀
  - 야훼의 지시
  - 야훼의 결정을
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 입’이지만, 여기서는 야훼의 판단·응답을 구하는 관용구이므로 한국어에서는 ‘뜻을 묻다’로 자연스럽게 옮겨 원문의 지침/판단 의미를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사를 보존하기 위해 전통적 대체어를 쓰지 않고 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: פִּי יְהוָה의 관용적 의미
  chosen_reading: 야훼의 뜻을 묻지 않았습니다
  alternative_readings:
  - 야훼의 말씀을 구하지 않았습니다
  - 야훼의 결정을 묻지 않았습니다
  - 야훼의 조언을 구하지 않았습니다
  rationale: ‘입’이라는 직역보다, 이 표현이 가리키는 계시적 판단을 구하지 않았다는 의미를 한국어 동사구로 드러내는 것이 문맥에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source-text sense over translation tradition'
