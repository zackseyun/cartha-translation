id: JOS.9.15
reference: Joshua 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
  footnotes:
  - marker: a
    text: 'Or ''made a covenant with them.'' Hebrew: ''cut a covenant.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'to preserve them alive' or 'to spare their lives.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the leaders of the assembly' or 'the chiefs of the community.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 여호수아는 그들과 화평을 맺고, 그들을 살려 두기 위해 그들과 언약을 맺었으며[a][b], 회중의 지도자들은 그들에게 맹세하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘언약을 자르다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 생명을 보존하려고’ 혹은 ‘그들의 목숨을 살려 주려고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘회중의 우두머리들’ 또는 ‘공동체의 지도자들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... שָׁלוֹם
  english_pob_choice: made peace
  chosen_korean: 화평을 맺고
  alternatives_korean:
  - 평화를 만들고
  - 평화 조약을 맺고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 감정적 평안이 아니라 적대 관계의 해소와 정치적 화해를 뜻하므로, 한국어에서는 자연스러운 ‘화평을 맺다’로 옮겼습니다.
- source_word: וַיִּכְרֹת ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺어
  alternatives_korean:
  - 언약을 체결하여
  - 언약을 끊어 맺어
  lexicon: HALOT
  rationale: כרת ברית의 ‘cut a covenant’ 이미지는 한국어 직역보다 ‘언약을 맺다’가 더 자연스럽고, 동시에 언약 행위의 공적 성격을 충분히 살립니다.
- source_word: לְחַיּוֹתָם
  english_pob_choice: to let them live
  chosen_korean: 그들을 살려 두었으며
  alternatives_korean:
  - 그들의 생명을 보존하려고
  - 그들이 살게 하려고
  lexicon: HALOT
  rationale: 목적 구문은 ‘살아 있게 두다’는 의미이므로, 한국어에서는 결과를 분명히 드러내는 ‘살려 두다’로 옮겼습니다.
- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
  - 공동체의 지도자들
  - 회중의 우두머리들
  lexicon: HALOT
  rationale: הָעֵדָה는 이스라엘의 모인 공동체를 가리키므로, 교회 제도 용어를 피하고 ‘회중’으로 옮겨 공적·집단적 의미를 보존했습니다.
theological_decisions:
- issue: 언약 표현의 직역성
  chosen_reading: ‘언약을 맺다’로 옮겨 언약 관계의 법적·신학적 무게를 유지했습니다.
  alternative_readings:
  - ‘계약을 맺다’
  - ‘협정을 맺다’
  rationale: 본문은 단순 합의가 아니라 야훼 앞에서의 언약 행위를 서술하므로, 현대적이면서도 성경적 용례를 유지하는 ‘언약’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: הָעֵדָה의 공동체성
  chosen_reading: ‘회중’으로 옮겨 이스라엘의 모인 공동체를 나타냈습니다.
  alternative_readings:
  - ‘교회’
  - ‘집회’
  rationale: 여기서는 후대 교회 제도보다 출애굽-정복 서사의 언약 공동체가 핵심이므로, 제도적 뉘앙스를 덜 주는 ‘회중’이 적절합니다.
  doctrine_reference: Translation philosophy §5
