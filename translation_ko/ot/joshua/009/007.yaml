translation:
  language: ko
  text: 그러나 이스라엘 사람들이 히위 사람에게 말했습니다. “혹시 당신이 우리 가운데 살고 있다면[b], 내가 어떻게 당신과 언약을 맺을 수 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 문자적으로 ‘내 가운데에’입니다. 그러나 문맥상 이스라엘 공동체를 대표하는 표현이므로 한국어에서는 ‘우리 가운데’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들이
  alternatives_korean:
  - 이스라엘의 한 사람
  - 이스라엘의 남자들
  lexicon: HALOT
  rationale: 히브리어의 단수형이 집합적 대표 발언으로 쓰인 점을 살려, 한국어에서는 자연스러운 복수 집합 표현으로 옮겼습니다.
- source_word: הַחִוִּי
  english_pob_choice: the Hivite
  chosen_korean: 히위 사람에게
  alternatives_korean:
  - 히위인에게
  - 히위족에게
  lexicon: HALOT
  rationale: 본문의 단수형을 따라 특정 개인을 지칭하는 듯한 형태를 유지하되, 한국어에서는 민족/집단 지시가 자연스럽게 드러나도록 ‘사람’으로 옮겼습니다.
- source_word: בְּקִרְבִּי
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
  - 내 가운데
  - 우리 안에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘내 가운데’이지만, 문맥상 이스라엘 공동체를 대표하는 발화이므로 집합적 의미를 드러내는 ‘우리 가운데’가 더 정확합니다.
- source_word: אכרות ... בְרִית
  english_pob_choice: make a covenant
  chosen_korean: 언약을 맺을
  alternatives_korean:
  - 언약을 자를
  - 언약을 세울
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역인 ‘언약을 자르다’는 한국어에서 다소 낯설어, POB의 선택을 따라 의미를 분명히 하는 ‘언약을 맺다’로 옮겼습니다.
theological_decisions:
- issue: 대표 화자와 집합적 주어의 처리
  chosen_reading: 이스라엘 전체를 대표하는 발화로 이해하여 첫 절은 집합적으로, 뒤의 1인칭은 수사적 대표 발화로 유지했습니다.
  alternative_readings:
  - ‘내 가운데에… 내가 어떻게…’처럼 전부 단수로 유지
  rationale: 히브리어의 단수/복수 혼용은 문법적 어색함이 아니라 대표 발화의 효과이므로, 한국어에서는 의미를 분명히 하되 원문의 긴장을 지나치게 평탄화하지 않았습니다.
  doctrine_reference: Translation philosophy §§3, 4, 6
