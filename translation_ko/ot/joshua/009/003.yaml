lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  english_pob_choice: But the inhabitants of
  chosen_korean: 그런데 기브온 주민들이
  alternatives_korean:
  - 그리고 기브온 주민들이
  - 기브온에 사는 사람들이
  lexicon: HALOT
  rationale: 문두의 וְ는 단순한 연결보다 앞 문맥의 여러 왕들의 반응과 대비되는 전환을 나타내므로, 한국어에서는 ‘그런데’로 살려 자연스러운 서술 흐름을 유지했습니다. יֹשְׁבֵי는 ‘주민들’이 직접적입니다.
- source_word: שָׁמְעוּ
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다만
  - 알게 되었습니다
  lexicon: HALOT
  rationale: שׁמע의 기본 의미인 ‘듣다’를 그대로 살려, 추정이나 해석을 덜어낸 직접적인 표현으로 옮겼습니다.
- source_word: עָשָׂה
  english_pob_choice: had done
  chosen_korean: 행한 일을
  alternatives_korean:
  - 한 일을
  - 처리한 일을
  lexicon: HALOT
  rationale: עָשָׂה는 여기서 여호수아의 이전 행동을 가리키므로, 한국어에서는 완료된 사건을 자연스럽게 나타내는 ‘행한 일’로 옮겼습니다.
- source_word: לִֽ/ירִיחוֹ וְ/לָ/עָי
  english_pob_choice: to Jericho and to Ai
  chosen_korean: 여리고와 아이에
  alternatives_korean:
  - 여리고와 아이에게
  - 여리고와 아이를 향해
  lexicon: HALOT
  rationale: ל은 כאן 행위의 대상/방향을 나타내므로, 한국어에서는 동사 ‘행하다’와 결합할 때 가장 자연스러운 목적격 성격의 ‘~에’로 처리했습니다. 두 지명은 익숙한 성경 지명을 따라 음역했습니다.
theological_decisions:
- issue: 문두 וְ의 의미를 단순 접속으로 볼지, 대비 전환으로 볼지
  chosen_reading: 대비를 드러내는 전환 표현 ‘그런데’로 옮겼습니다.
  alternative_readings:
