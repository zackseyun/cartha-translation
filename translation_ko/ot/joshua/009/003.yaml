  rationale: 전절의 왕들 연합 반응과 달리 기브온의 독자적 반응으로 이야기가 전환되므로, 서술상의 대비를 살리는 번역이 원문 흐름에 더 충실합니다.
  doctrine_reference: 서사 담화 흐름의 충실한 재현
