revisions:
- from: 그들은 여호수아에게 대답하며 말했습니다. 「당신의 종들에게 야훼 당신의 하나님께서 그의 종 모세에게 명령하신 것이 분명히 알려졌습니다. 곧 당신들에게 온 땅을 주시고, 당신들 앞에서 그 땅의 모든 주민을 멸하라는 것이었습니다. 그래서 우리는 당신들 때문에 우리 목숨을 위해 크게 두려워했고, 이렇게 하게 되었습니다」.[a]
  to: 그들은 여호수아에게 대답하여 말했습니다. “당신의 하나님 야훼께서 그의 종 모세에게, 당신들에게 온 땅을 주시고 당신들 앞에서 그 땅의 모든 주민을 멸하라고 명령하신 것이 당신의 종들에게 분명히 알려졌습니다[a]. 그러므로 우리는 당신들 때문에 목숨이 위태로워질까 매우 두려워하여 이 일을 하였습니다.”
  rationale: 히브리어의 강조된 수동 표현은 ‘분명히 알려졌습니다’로 유지했습니다. 생명에 대한 두려움은 한국어에서 자연스러우면서도 원문의 의미를 보존하도록 ‘목숨이 위태로워질까 매우 두려워하여’로 옮겼고, 마지막 동사는 원문의 능동형에 맞추어 ‘이 일을 하였습니다’로 바로잡았습니다. 각주 표지는 강조되는 ‘알려졌습니다’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:30Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 대체로 히브리어의 인과관계와 명령 내용, 그리고 강조를 잘 반영합니다. 그러나 לְנַפְשֹׁתֵינוּ를 ‘우리 목숨을 위해’로 옮긴 것은 한국어에서 부자연스럽고, ‘이렇게 하게 되었습니다’는 능동형 וַנַּעֲשֶׂה보다 불필요하게 비자발적 뉘앙스를 더합니다.
  naturalness: ‘야훼 당신의 하나님’은 한국어 소유·동격 구성이 다소 어색하므로 ‘당신의 하나님 야훼’가 자연스럽습니다. 또한 ‘대답하며 말했습니다’보다 ‘대답하여 말했습니다’가 서술문에서 더 매끄럽습니다.
  terminology: ‘여호수아’, ‘야훼’, ‘종’, ‘멸하다’는 문맥과 프로젝트 용례에 적절합니다. ‘당신들’은 히브리어 복수 2인칭을 보존합니다.
  issues:
