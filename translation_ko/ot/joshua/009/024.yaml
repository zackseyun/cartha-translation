  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
  footnotes:
  - marker: a
    text: Or, “it was surely told to your servants.” The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 여호수아에게 대답하며 말했습니다. 「당신의 종들에게 야훼 당신의 하나님께서 그의 종 모세에게 명령하신 것이 분명히 알려졌습니다. 곧 당신들에게 온 땅을 주시고, 당신들 앞에서 그 땅의 모든 주민을 멸하라는 것이었습니다. 그래서 우리는 당신들 때문에 우리 목숨을 위해 크게 두려워했고, 이렇게 하게 되었습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조를 위해 부정사 절대형과 완료형을 함께 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת יְהוֹשֻׁעַ וַיֹּאמְרוּ
  english_pob_choice: They answered Joshua and said
  chosen_korean: 그들은 여호수아에게 대답하며 말했습니다
  alternatives_korean:
  - 그들은 여호수아에게 답하며 말했습니다
  - 그들은 여호수아에게 응답하여 말했습니다
  lexicon: HALOT
  rationale: 대화 응답의 서두로서 ענה의 응답성을 살리되, 한국어에서는 ‘대답하며 말했습니다’가 가장 자연스럽고 서술 흐름도 부드럽습니다.
- source_word: הֻגֵּד הֻגַּד
  english_pob_choice: it was clearly told
  chosen_korean: 분명히 알려졌습니다
  alternatives_korean:
  - 확실히 알려졌습니다
  - 분명하게 전해졌습니다
  lexicon: HALOT
  rationale: 감정이 아닌 정보의 전달이 강조되며, 히브리어의 강조형 반복을 한국어의 ‘분명히’로 옮겨 중첩 강조를 살렸습니다.
- source_word: לַעֲבָדֶיךָ / עַבְדּוֹ
  english_pob_choice: to your servants / his servant
  chosen_korean: 당신의 종들 / 그의 종
  alternatives_korean:
  - 당신의 노예들 / 그의 노예
  - 당신의 하인들 / 그의 하인
  lexicon: HALOT
  rationale: 여기서는 외교적·공손한 자기지칭과 모세에 대한 경칭적 표현이므로, 본문이 요구하는 복종성은 유지하되 ‘종’이 가장 적절합니다.
- source_word: וּלְהַשְׁמִיד אֶת כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: and to destroy all the inhabitants of the land
  chosen_korean: 모든 주민을 멸하라는 것
  alternatives_korean:
  - 모든 주민을 멸망시키라는 것
  - 그 땅의 모든 주민을 파괴하라는 것
  lexicon: HALOT
  rationale: הִשְׁמִיד는 단순 소멸보다 강한 ‘멸하다/멸망시키다’의 뉘앙스가 있어, 심판적 제거의 강도를 살리면서도 한국어 성경체에 맞게 정리했습니다.
- source_word: לְנַפְשֹׁתֵינוּ
  english_pob_choice: for our lives
  chosen_korean: 우리 목숨을 위해
  alternatives_korean:
  - 우리 생명을 위해
  - 우리 목숨을 위하여
  lexicon: HALOT
  rationale: נפש는 여기서 영혼보다 생명 자체를 가리키므로, 구어적이면서도 직접적인 ‘목숨’을 택해 생존의 절박함을 드러냈습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
