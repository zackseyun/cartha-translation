  - severity: low
    issue: ‘야훼 당신의 하나님’
    rationale: 히브리어의 ‘야훼, 당신의 하나님’에 해당하지만, 표준 현대 한국어에서는 ‘당신의 하나님 야훼’가 더 자연스럽습니다.
