  - 주님
  rationale: 본문의 신명기적 언약명 יְהוָה를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 두려움의 강도 표현
