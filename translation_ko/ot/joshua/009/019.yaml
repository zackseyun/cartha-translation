  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
  footnotes:
  - marker: a
    text: Or “harm them” or “strike them”; literally “touch them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모든 지도자들이 온 회중에게 말했습니다. “우리는 이스라엘의 하나님이신 야훼를 두고 그들에게 맹세했으니, 이제 그들을 건드릴 수 없습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들에게 손대다”입니다. 이 문맥에서는 그들을 해치거나 공격하다라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 지도자
  - 우두머리
  - 귀인
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 공동체를 이끄는 대표자들이므로, 현대 한국어에서 가장 자연스럽고 의미가 분명한 ‘지도자들’로 옮겼습니다.
- source_word: הָעֵדָה
  english_pob_choice: the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 회중
  - 모인 무리
  - 공동체
  lexicon: HALOT
  rationale: עֵדָה는 모인 이스라엘 공동체를 가리키므로, 집합성을 살리면서도 문맥상 전체를 강조하는 ‘온 회중’으로 옮겼습니다.
- source_word: נִשְׁבַּעְנוּ לָהֶם בַּיהוָה
  english_pob_choice: We have sworn to them by Yahweh
  chosen_korean: 우리는 야훼, 이스라엘의 하나님으로 그들에게 맹세했으니
  alternatives_korean:
  - 우리는 야훼, 이스라엘의 하나님으로 그들에게 맹세했습니다
  - 우리는 야훼, 이스라엘의 하나님을 두고 그들에게 맹세했으니
  lexicon: HALOT
  rationale: שׁבע와 전치사 בּ는 맹세의 근거이자 대상이 되는 분을 나타내므로, 문맥을 살려 ‘야훼, 이스라엘의 하나님으로’라고 옮겼습니다. ‘맹세했으니’는 뒤의 결론과 연결되는 이유를 드러냅니다.
- source_word: לִנְגֹּעַ בָּהֶם
  english_pob_choice: touch them
  chosen_korean: 그들을 건드릴 수 없습니다
  alternatives_korean:
  - 그들을 손댈 수 없습니다
  - 그들에게 손을 댈 수 없습니다
  - 그들을 해칠 수 없습니다
  lexicon: HALOT
  rationale: נגע의 기본 의미는 ‘만지다/닿다’이지만, 여기서는 해를 가하는 관용적 표현으로 쓰였으므로 본문에는 ‘건드릴 수 없습니다’로 두어 문자성과 함의를 함께 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 야훼
  - 여호와
  - 주님
  rationale: 본문에 야훼의 언약적 이름이 직접 나오므로, 프로젝트 기준에 따라 ‘야훼’로 일관되게 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
