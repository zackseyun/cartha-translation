id: JOS.9.13
reference: Joshua 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
  footnotes:
  - marker: a
    text: Or 'have split open.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the great amount of the journey, very much,' meaning because the journey was extremely long.
    reason: lexical_alternative
  - marker: c
    text: Or 'because of the journey being very long'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 포도주 가죽 부대들[a]은, 우리가 그것들이 새것일 때 채웠던 것들인데—보십시오, 그것들이 터졌습니다[c][b]. 그리고 이 우리 옷과 우리 샌들은 길이 매우 길어서 닳아 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가죽 부대’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘길의 매우 큰 많음으로부터’로, 곧 여행이 매우 길었기 때문이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여정이 매우 길어서’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  english_pob_choice: wineskins
  chosen_korean: 포도주 가죽 부대들
  alternatives_korean:
  - 포도주 가죽부대들
  - 와인 부대들
  - 포도주 부대들
  lexicon: HALOT
  rationale: נֹאד은 액체를 담는 가죽 용기이므로, 한국어에서는 ‘가죽 부대’가 재료와 용도를 함께 드러냅니다. ‘포도주 가죽 부대들’은 본문의 실물을 구체적으로 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: וְהִנֵּה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 여기서는 주의를 끄는 담화 표지이므로, 대화체가 아닌 서술 속에서도 자연스러운 ‘보십시오’로 주목성을 살렸습니다.
- source_word: הִתְבַּקָּעוּ
  english_pob_choice: have burst
  chosen_korean: 터졌습니다
  alternatives_korean:
  - 갈라졌습니다
  - 찢어졌습니다
  - 터져 버렸습니다
  lexicon: HALOT
  rationale: 용기와 관련된 동사로서는 ‘터지다’가 가장 직접적이며, 포도주 가죽 부대가 갈라져 망가진 상태를 자연스럽게 전달합니다.
- source_word: שַׂלְמוֹתֵינוּ / נְעָלֵינוּ
  english_pob_choice: our garments / our sandals
  chosen_korean: 우리 옷 / 우리 샌들
  alternatives_korean:
  - 우리 의복 / 우리 신발
  - 우리 겉옷 / 우리 샌들
  lexicon: HALOT
  rationale: שַׂלְמוֹת은 넓게 옷을 가리키므로 ‘옷’으로 풀고, נְעָלִים은 고대 근동 맥락에 맞게 ‘샌들’로 옮겼습니다.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  english_pob_choice: from the journey being very long
  chosen_korean: 길이 매우 길어서
  alternatives_korean:
  - 여정이 매우 길어서
  - 길이 몹시 길어서
  - 여정이 지나치게 길어서
  lexicon: HALOT
  rationale: 히브리어는 길의 길고 큼이 마모의 원인임을 말하므로, 한국어에서는 결과절과 자연스럽게 이어지도록 ‘길이 매우 길어서’로 압축해 원인의 의미를 살렸습니다.
