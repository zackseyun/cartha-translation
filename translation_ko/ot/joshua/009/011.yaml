  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
  footnotes:
  - marker: a
    text: Or, more literally, 'cut a covenant with us.'
    reason: lexical_alternative
  - marker: b
    text: '''Your servants'' reflects deferential diplomatic language; the Hebrew term can also mean ''slaves'' in other contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 장로들과 우리 땅의 모든 주민이 우리에게 말했습니다. “여행을 위한 양식을 손에 들고 그들을 맞으러 가십시오. 그들에게 ‘우리는 여러분의 종입니다’[b]라고 말하십시오. 그리고 이제 우리와 언약을 맺으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리와 언약을 자르라’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종’은 여기서 외교적 겸양 표현입니다. 다른 문맥에서는 이 히브리어가 ‘노예’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  english_pob_choice: our elders
  chosen_korean: 우리 장로들
  alternatives_korean:
  - 우리 늙은이들
  - 우리의 노인들
  lexicon: HALOT
  rationale: 문맥상 단순한 연령이 아니라 공동체의 지도층을 가리키므로, 한국어에서도 사회적 역할을 드러내는 ‘장로들’이 적절합니다.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  english_pob_choice: the inhabitants of our land
  chosen_korean: 우리 땅의 모든 주민
  alternatives_korean:
  - 우리 땅에 사는 사람들
  - 우리 땅의 거주자들
  lexicon: HALOT
  rationale: ‘거주하다/살다’의 집합적 의미를 살리면서도 자연스러운 한국어로 옮기기 위해 ‘주민’으로 다듬었습니다.
- source_word: צֵידָה
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 여행 양식
  - 보급품
  lexicon: HALOT
  rationale: 여행 준비물이라는 점을 유지하면서도 한국어 성경 문맥에서 이해가 쉬운 기본 식량 의미를 살렸습니다.
- source_word: עַבְדֵיכֶם
  english_pob_choice: your servants
  chosen_korean: 당신들의 종입니다
  alternatives_korean:
  - 당신들의 하인입니다
  - 당신들의 노예입니다
  lexicon: HALOT
  rationale: 여기서는 외교적·예의적 자기비하 표현이므로 ‘종’이 가장 무난합니다. 다만 히브리어가 다른 문맥에서는 ‘노예’도 될 수 있다는 긴장은 유지했습니다.
- source_word: כִּרְתוּ לָנוּ בְרִית
  english_pob_choice: make a covenant with us
  chosen_korean: 우리와 언약을 맺으십시오
  alternatives_korean:
  - 우리와 계약을 맺으십시오
  - 우리와 조약을 맺으십시오
  - 우리와 언약을 세우십시오
  lexicon: HALOT
  rationale: 히브리어 관용구 כרת ברית를 성서적 핵심 용어인 ‘언약’으로 옮겨, 단순한 계약보다 신학적 무게를 보존했습니다.
theological_decisions:
- issue: עַבְדֵיכֶם의 신분 뉘앙스
  chosen_reading: 이 구절에서는 ‘종입니다’로 옮겨 겸손한 외교적 발화를 살렸습니다.
  alternative_readings:
  - 노예입니다
  - 하인입니다
  rationale: 본문 화자는 동맹 체결을 요청하는 상황에서 극도로 공손한 자기표현을 사용하므로, 본문의 담화 기능을 해치지 않는 범위에서 ‘종’이 가장 적절합니다.
  doctrine_reference: 서사적 담화와 사회적 호칭의 문맥 우선 원칙
