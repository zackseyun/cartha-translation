- from: 그러므로 우리 장로들과 우리 땅의 모든 주민이 우리에게 이렇게 말했습니다. “여행 길을 위해 양식을 손에 가지고, 그들을 맞으러 가서, ‘우리는 당신들의 종입니다’라고 말하고, 이제 우리와 언약을 맺으십시오.”[a][b]
  to: 우리 장로들과 우리 땅의 모든 주민이 우리에게 말했습니다. “여행을 위한 양식을 손에 들고 그들을 맞으러 가십시오. 그들에게 ‘우리는 여러분의 종입니다’[b]라고 말하십시오. 그리고 이제 우리와 언약을 맺으십시오.”[a]
  rationale: 원문에 없는 인과 접속어를 제거하고, 명령의 순서와 직접화법의 구조를 한국어 합쇼체로 명료하게 옮겼습니다. ‘언약’과 ‘종’은 유지하되, 두 어휘의 주석 표지를 각각의 대상 표현에 직접 연결했습니다.
