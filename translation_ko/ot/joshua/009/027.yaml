  to: 그날 여호수아는 그들을 회중과 야훼의 제단을 위하여 나무를 패는 자들과 물을 긷는 자들[a]로 삼았으며, 그들은 오늘에 이르기까지 야훼께서 택하실 곳에서 그 일을 하고 있습니다.
  rationale: ‘그들은 ... 그 일을 하고 있습니다’로 옮겨 ‘오늘에 이르기까지’가 나타내는 계속 상태를 자연스럽게 드러내되, 여호수아가 계속해서 사역을 시켰다는 의미는 피했습니다. 어휘 각주는 해당 표현에 직접 연결했고, ‘야훼께서 택하실 곳’은 본문과 영어 감사 기록의 신적 주어 및 미래 지향 표현을 유지했습니다.
