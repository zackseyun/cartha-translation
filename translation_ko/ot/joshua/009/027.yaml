id: JOS.9.27
reference: Joshua 9:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
  footnotes:
  - marker: a
    text: Or 'drawers of water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 여호수아는 그들을 회중과 야훼의 제단을 위하여 나무를 패는 자들과 물을 긷는 자들[a]로 삼았으며, 그들은 오늘에 이르기까지 야훼께서 택하실 곳에서 그 일을 하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물을 나르는 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם
  english_pob_choice: made them
  chosen_korean: 삼았으며
  alternatives_korean:
  - 만들었습니다
  - 지정했습니다
  - 임명했습니다
  lexicon: HALOT
  rationale: 문맥상 여호수아가 그들을 특정 노동 역할에 배정하는 뜻이므로, 한국어로는 ‘~로 삼다’가 간결하고 자연스럽게 처지의 변화를 나타냅니다.
- source_word: חֹטְבֵי עֵצִים
  english_pob_choice: woodcutters
  chosen_korean: 나무 패는 자
  alternatives_korean:
  - 나무꾼
  - 목재를 자르는 자
  - 나무 베는 사람
  lexicon: HALOT
  rationale: 히브리어 분사형은 목재를 자르는 노동자를 뜻하므로, 직역에 가까우면서도 현대 한국어로 이해되는 표현을 택했습니다.
- source_word: וְשֹׁאֲבֵי מַיִם
  english_pob_choice: water carriers
  chosen_korean: 물 긷는 자
  alternatives_korean:
  - 물을 나르는 자
  - 물 긷는 사람
  - 물 길어오는 자
  lexicon: HALOT
  rationale: 동사 שאב의 기본 뜻인 ‘길어 올리다’와 노동 역할을 살려, 전통적 표현이면서도 원뜻을 직접 드러내는 ‘물 긷는 자’를 사용했습니다.
- source_word: לָעֵדָה
  english_pob_choice: for the congregation
  chosen_korean: 회중을 위한
  alternatives_korean:
  - 공동체를 위한
  - 총회를 위한
  - 모임을 위한
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합된 언약 공동체를 가리키므로, 단순한 공동체보다 예배적·언약적 뉘앙스를 살리는 ‘회중’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 번역 대체어가 아니라 고유명으로 처리해야 하므로, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: ‘야훼의 제단’과 뒤이은 ‘야훼께서 택하실 곳’의 주어 관계
  chosen_reading: 뒤의 ‘택하실’은 여호수아가 아니라 야훼를 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 중립적인 ‘택할 곳’으로 처리
  - 주어를 명시하지 않고 문맥에 맡김
  rationale: 신명기적 표현에서는 성소의 선택이 늘 하나님 자신의 주권적 선택으로 제시되므로, 한국어도 그 신학적 초점을 보존했습니다.
  doctrine_reference: Deuteronomic sanctuary formula; divine election of the worship site
