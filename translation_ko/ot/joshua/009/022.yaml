  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
  footnotes:
  - marker: a
    text: Or “in our midst.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 그들을 불러다가 그들에게 말하며 이르기를, “너희가 어찌하여 우리에게 거짓말하여, ‘우리는 너희에게서 매우 멉니다’라고 하였느냐? 그런데 너희는 우리 가운데에 살고 있구나.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 가운데에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 불러다가
  alternatives_korean:
  - 불렀습니다
  - 불러왔습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 호출이 아니라 그들을 앞으로 불러 세워 말하는 장면이므로, 자연스러운 한국어로는 ‘불러다가’가 가장 가깝습니다.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  english_pob_choice: spoke to them, saying
  chosen_korean: 그들에게 말하며 이르기를
  alternatives_korean:
  - 그들에게 말하여 이르기를
  - 그들에게 말씀하여 이르기를
  lexicon: HALOT
  rationale: 히브리어의 전형적 발화 도입구를 한국어 서술 흐름에 맞게 옮기되, 지나친 경어화 없이 본문의 공식적 서술감을 살렸습니다.
- source_word: רִמִּיתֶם
  english_pob_choice: did you deceive
  chosen_korean: 거짓말하여
  alternatives_korean:
  - 속였느냐
  - 기만하였느냐
  - 속여서
  lexicon: HALOT
  rationale: 직설적 비난의 힘을 살리면서도 한국어에서 자연스러운 동사로 옮겼습니다. 여기서는 단순한 착오가 아니라 의도적 속임을 가리킵니다.
- source_word: רְחוֹקִים ... מְאֹד
  english_pob_choice: very far
  chosen_korean: 매우 멉니다
  alternatives_korean:
  - 아주 멉니다
  - 한참 멉니다
  - 멀리 있습니다
  lexicon: HALOT
  rationale: 거리의 강한 강조를 그대로 살리기 위해 ‘매우’로 옮겼습니다.
- source_word: בְּקִרְבֵּנוּ יֹשְׁבִים
  english_pob_choice: living among us
  chosen_korean: 우리 가운데에 살고 있구나
  alternatives_korean:
  - 우리 가운데 살고 있구나
  - 우리 한가운데에 거주하고 있구나
  - 우리 안에 살고 있구나
  lexicon: HALOT
  rationale: בְּקִרְבֵּנוּ는 관용적으로 ‘우리 가운데/한가운데’의 뜻이므로, POB의 의미를 따라 ‘우리 가운데에’로 옮겼습니다. יֹשְׁבִים은 정착 거주를 나타내므로 ‘살고 있구나’가 자연스럽습니다.
theological_decisions:
- issue: Joshua의 질책을 어디까지 드러낼 것인가
  chosen_reading: 본문이 말하는 핵심인 ‘거짓말과 거리 주장’에 초점을 맞추고, 언약 위반에 대한 해석은 본문 밖으로 두었습니다.
  alternative_readings:
  - 본문에 언약 배반의 의미를 덧붙여 번역하기
  - 도덕적 비난을 완화해 단순한 오해처럼 옮기기
  rationale: 이 절은 실제로 ‘우리가 매우 멀다’는 거짓 주장과 그 실재(우리 가운데 거주)를 대비시킬 뿐이므로, 번역은 그 긴장을 그대로 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: 본문이 말하지 않는 신학적 해석을 번역문에 앞당겨 넣지 않음'
