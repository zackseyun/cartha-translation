  alternative_readings:
  - ‘당신의 권세 아래 있습니다’
  - ‘당신이 마음대로 하실 수 있습니다’
  rationale: 본문은 단순한 예의가 아니라 실제적 복종과 생명 처분의 수용을 말하므로, 은유를 유지하면서도 항복의 무게를 살렸습니다.
  doctrine_reference: 서사 본문에서의 언약적 복종과 주권적 처분 인식
