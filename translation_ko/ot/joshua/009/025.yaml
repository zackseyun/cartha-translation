theological_decisions:
- issue: 기브온 사람들의 완전한 항복과 처분 인정
  chosen_reading: ‘당신의 손에 있습니다’로 번역하여, 그들이 여호수아의 처분권 아래 자신을 두는 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘당신의 권세 아래 있습니다’
  - ‘당신이 마음대로 하실 수 있습니다’
  rationale: 본문은 단순한 예의가 아니라 실제적 복종과 생명 처분의 수용을 말하므로, 은유를 유지하면서도 항복의 무게를 살렸습니다.
  doctrine_reference: 서사 본문에서의 언약적 복종과 주권적 처분 인식
