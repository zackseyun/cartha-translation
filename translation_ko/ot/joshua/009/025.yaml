revisions:
- from: 그리고 이제, 우리가 당신의 손에 있습니다. 당신의 눈에 좋고 옳은 대로 우리에게 행하십시오.[a]
  to: 이제 우리는 당신의 손에 있습니다. 당신이 보시기에 좋고 옳은 대로 우리를 대하십시오.[a]
  rationale: 문장 흐름을 현대 한국어 합쇼체에 맞게 다듬고, 히브리어의 ‘눈에’ 관용구를 자연스러운 한국어 평가 표현으로 옮겼습니다. ‘우리를 대하십시오’는 원문의 폭넓은 동사 עשה와 기브온 사람들이 자신들의 처분을 여호수아에게 맡기는 문맥을 보존합니다. 각주는 더 직역적인 표현을 제시하되 판단의 주체가 상대방임을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:35Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 현시 표현(הננו), ‘손에 있다’는 지배·처분의 은유, 그리고 ‘좋고 옳은 대로’라는 평가 기준은 대체로 반영되었습니다. 그러나 ‘당신의 눈에 좋고 옳은 대로 우리에게 행하십시오’는 한국어에서 어색하고, ‘행하다’의 목적어 관계도 불분명합니다. עשה לנו는 이 문맥에서 상대가 자신들을 어떻게 처분할지 맡기는 말이므로 ‘우리를 대하십시오’가 자연스럽고 충실합니다.
  naturalness: ‘그리고 이제’와 ‘우리가 … 있습니다’는 불필요하게 번역투입니다. ‘이제 우리는 … 있습니다’가 현대 한국어 합쇼체에서 더 자연스럽습니다. 또한 ‘당신의 눈에’는 한국어에서 평가의 관용 표현으로 다소 부자연스러워 ‘당신이 보시기에’로 옮기는 것이 적절합니다.
  terminology: ‘당신의 손에 있습니다’는 원문의 은유를 보존하므로 유지할 수 있습니다. טוב/ישר는 ‘좋고 옳은’으로, עשה לנו는 문맥상 ‘우리를 대하십시오’로 번역합니다. 본문에 신학적 해석을 추가하지 않았습니다.
