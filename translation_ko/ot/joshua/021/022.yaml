  footnotes:
  - marker: a
    text: ‘목초지’로 옮긴 히브리어 מִגְרָשׁ는 성읍에 딸린 열린 땅을 가리킵니다. ‘공용지’ 또는 ‘방목지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  english_pob_choice: Kibzaim
  chosen_korean: 기브사임
  alternatives_korean:
  - 기브자임
  - 키브자임
  lexicon: 지명 음역
  rationale: 고유 지명은 번역하지 않고 음역하는 것이 원문 정보 보존에 가장 적합합니다. 한국어 표기는 발음에 맞춰 ‘기브사임’으로 옮겼습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 공터
  - 그 공용지
  - 그 방목지
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍에 속한 열린 땅, 곧 방목 가능한 부속지를 가리키므로, 한국어로는 문맥상 자연하면서도 의미를 드러내는 ‘목초지’로 옮겼습니다. 소유격은 ‘그’로 처리했습니다.
- source_word: בֵּית חוֹרֹן
  english_pob_choice: Beth-horon
  chosen_korean: 벧호론
  alternatives_korean:
  - 벧 호론
  - 베트호론
  lexicon: 지명 관용 표기
  rationale: 이미 널리 쓰이는 성경 지명 표기를 따랐습니다. 합성어 느낌을 살리면서도 낯설지 않게 ‘벧호론’으로 적었습니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 성읍입니다
  alternatives_korean:
  - 네 도시입니다
  - 네 읍입니다
  lexicon: HALOT
  rationale: 목록을 마무리하는 수량 요약은 한국어에서 서술형으로 자연스럽게 처리하는 것이 좋으며, עָרִים는 여기서 행정적 거점의 뜻이 강하므로 ‘성읍’이 적절합니다.
theological_decisions:
- issue: 지명과 토지 배분의 표현 방식
  chosen_reading: ‘목초지’로 옮겨 성읍에 딸린 열린 토지를 분명히 드러냈습니다.
  alternative_readings:
  - ‘부속지’
  - ‘주변 땅’
  rationale: 본문은 레위 성읍 목록의 일부로서 단순한 주거지보다 성읍에 딸린 개방 지대를 지칭하므로, 한국어 독자가 기능을 바로 이해하도록 했습니다.
  doctrine_reference: 토지 분배 본문 해석
