revisions:
- from: 그리고 므라리의 자손 곧 남아 있는 레위 사람들의 가족들에게, 스불론 지파에서 요르브암과 그 목초지, 그리고 카드와 그 목초지를 주었습니다.[a]
  to: 그리고 남아 있는 레위 사람들인 므라리 자손의 가문들에게는 스불론 지파에서 욕느암과 그 주변 목초지, 그리고 카르타[a]와 그 주변 목초지를 주었습니다.
  rationale: 두 지명을 히브리어 원문에 맞게 바로잡고, 레위인의 하위 친족 단위인 מִשְׁפָּחוֹת를 ‘가문들’로 번역했습니다. 원문의 목록형 구문은 한국어 문장 성립을 위해 문맥상 수여 동사 ‘주었습니다’를 보충하되, 분배의 주체에 관한 추가 해석은 넣지 않았습니다. 각 성읍에 속한 מִגְרָשׁ의 공간적 의미를 ‘주변 목초지’로 반영했으며, 영어 표기 변이 각주는 해당 지명 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:06Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘요르브암’은 히브리어 יָקְנְעָם(Jokneam)에 대응하지 않는 지명이며, ‘카드’도 קַרְתָּה(Kartah)의 안전한 음역이 아닙니다. 또한 히브리어는 앞 절부터 이어지는 배정 목록으로서 명시 동사가 없으나, 한국어에서는 문맥상 보충된 수여 동사를 사용하여 자연스럽게 옮길 수 있습니다.
  naturalness: ‘므라리의 자손 곧 남아 있는 레위 사람들의 가족들에게’는 수식이 겹쳐 다소 무겁습니다. ‘남아 있는 레위 사람들인 므라리 자손의 가문들에게는’으로 정리하면 현대 한국어의 행정적 목록 문체를 유지하면서 관계가 분명해집니다. ‘그 목초지’는 각 성읍에 속한 토지를 가리키므로 ‘그 주변 목초지’가 더 자연스럽고 구체적입니다.
  terminology: מִשְׁפָּחוֹת는 이 문맥에서 레위인의 하위 집단이므로 ‘가문들’이 현대 한국어의 ‘가족들’보다 적절합니다. מִגְרָשׁ는 레위 성읍 주변의 목초지/공동 토지를 뜻하므로 ‘주변 목초지’로 옮겼습니다. יָקְנְעָם은 ‘욕느암’, קַרְתָּה는 ‘카르타’로 음역했습니다.
  issues:
  - severity: high
    issue: יָקְנְעָם의 지명이 ‘요르브암’으로 번역됨
    rationale: ‘요르브암’은 히브리어 철자와 음가에 대응하지 않으며, 본문의 지명 Jokneam을 다른 이름으로 바꾸어 원문 충실성을 훼손합니다.
  - severity: high
    issue: קַרְתָּה의 지명이 ‘카드’로 번역됨
    rationale: ‘카드’는 Kartah의 음역으로 뒷받침되지 않으며 지명 식별을 불가능하게 합니다.
  - severity: medium
    issue: מִשְׁפָּחוֹת를 ‘가족들’로 번역함
    rationale: 현대 한국어의 ‘가족’은 주로 핵가족을 연상시키므로, 부족 내부의 친족 집단을 가리키는 문맥에는 ‘가문들’이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: 각 성읍의 מִגְרָשׁ을 단순히 ‘그 목초지’로 표현함
    rationale: 성읍 주변에 딸린 토지라는 뜻을 드러내기 위해 ‘그 주변 목초지’로 명시하는 것이 적절합니다.
  revised_text: 그리고 남아 있는 레위 사람들인 므라리 자손의 가문들에게는 스불론 지파에서 욕느암과 그 주변 목초지, 그리고 카르타[a]와 그 주변 목초지를 주었습니다.
