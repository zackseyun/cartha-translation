  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
  footnotes:
  - marker: a
    text: Kartah is also spelled 'Kartha' in some English renderings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 남아 있는 레위 사람들인 므라리 자손의 가문들에게는 스불론 지파에서 욕느암과 그 주변 목초지, 그리고 카르타[a]와 그 주변 목초지를 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 카르타는 일부 영어 번역에서 ‘Kartha’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  english_pob_choice: And to the families of
  chosen_korean: 그리고 …의 가족들에게
  alternatives_korean:
  - 그리고 …의 종족들에게
  - 그리고 …의 지파들에게
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 여기서 레위 분파를 가리키므로, 현대 한국어에서는 자연스럽고 직역성을 살리는 ‘가족들’보다 ‘가족들에게’ 구조로 옮겨 할당 대상임을 분명히 했습니다.
- source_word: בְּנֵי מְרָרִי
  english_pob_choice: the sons of Merari
  chosen_korean: 므라리의 자손
  alternatives_korean:
  - 므라리의 아들들
  - 므라리의 후손들
  lexicon: HALOT
  rationale: 족보적 공식 표현이므로 ‘자손’이 가장 자연스럽고, POB의 ‘sons of’와도 대응됩니다.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  english_pob_choice: the remaining Levites
  chosen_korean: 남아 있는 레위 사람들
  alternatives_korean:
  - 남은 레위 사람들
  - 남아 있던 레위 사람들
  lexicon: HALOT
  rationale: הַנּוֹתָרִים는 앞선 분배 뒤에 ‘남은’ 집단을 뜻하므로, 현재 분사형의 ‘남아 있는’이 자연스럽고 의미를 분명히 합니다.
- source_word: מַטֵּה זְבוּלֻן
  english_pob_choice: from the tribe of Zebulun
  chosen_korean: 스불론 지파에서
  alternatives_korean:
  - 스불론 지파로부터
  - 스불론 지파 가운데서
  lexicon: HALOT
  rationale: מַטֶּה는 지파를 뜻하므로 ‘지파에서’로 옮겨 분배의 출처를 드러냈습니다.
- source_word: יָקְנְעָם
  english_pob_choice: Jokneam
  chosen_korean: 요르브암
  alternatives_korean:
  - 욕느암
  - 요크느암
  lexicon: HALOT
  rationale: 고유지명 יָקְנְעָם의 현대 음역으로 처리했습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 들판
  lexicon: HALOT
  rationale: Levitical city 목록의 מִגְרָשׁ는 성읍 주변의 목초지/빈터를 가리키므로, POB의 ‘pasturelands’를 따라 ‘목초지’로 옮겼습니다.
- source_word: קַרְתָּה
  english_pob_choice: Kartah
  chosen_korean: 카드
  alternatives_korean:
  - 카르타
  - 카르다
  lexicon: HALOT
  rationale: 지명 קַרְתָּה는 음역으로 처리했습니다. 영어 POB의 변이형 ‘Kartha’는 본문에 넣지 않고, 한국어 표기는 한 가지로 일관시켰습니다.
theological_decisions:
- issue: 레위 성읍 분배의 행정적 서술 톤
  chosen_reading: 서술형으로 ‘주었습니다’라고 옮겨, 단순한 지리 목록이 아니라 여호와의 분배 명령이 실행된 결과임을 드러냈습니다.
  alternative_readings:
  - ‘배당되었습니다’
  - ‘주어졌습니다’
  rationale: 히브리어 본문은 분배 목록의 한 항목을 기록하는 행정적 서술이므로, 한국어에서도 간결한 완료 서술이 적절합니다.
  doctrine_reference: 여호수아 21장의 레위 성읍 분배 문맥
