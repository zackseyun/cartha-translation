    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 초지
  alternatives_korean:
  - 그 목초지
  - 그 주변 목초지
  - 그 공지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 도시 주변의 목초지·공지를 가리키므로, 본문 문맥을 살리되 현대 한국어에서 자연스러운 ‘초지’로 옮겼습니다. 반복되는 3인칭 여성 접미사는 앞선 ‘엘테게/깁브돈’ 같은 성읍을 가리키는 것으로 이해해 ‘그’로 처리했습니다.
- source_word: מַטֵּה דָן
  english_pob_choice: the tribe of Dan
  chosen_korean: 단 지파
  alternatives_korean:
  - 단의 지파
  - 단의 지파 사람들
  lexicon: HALOT
  rationale: 지파 분배 문맥에서 מַטֶּה는 ‘지팡이’가 아니라 ‘지파’이므로, 한국어 관용에 맞춰 ‘단 지파’로 옮겼습니다.
- source_word: אֶלְתְּקֵא / גִּבְּתוֹן
  english_pob_choice: Eltekeh / Gibbethon
  chosen_korean: 엘테게 / 깁브돈
  alternatives_korean:
  - 엘테케 / 깁베돈
  - 엘테께 / 기브돈
  lexicon: proper noun transliteration
  rationale: 고유 지명은 현대 한국어 외래어 표기 관행에 따라 음역했습니다. 영어 POB의 표준화된 표기를 참고하되, 기존 한국어 성경에서 덜 고정된 형태는 과도하게 토착화하지 않았습니다.
