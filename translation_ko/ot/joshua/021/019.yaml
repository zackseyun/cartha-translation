  - 아론의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 직계 혈통 표현을 살리되, 한국어에서는 자연스럽게 소유격으로 옮겼습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
