  - 제사장들
  lexicon: HALOT
  rationale: 동격 설명을 분명히 하기 위해 '곧'을 넣었고, 전통적 교회 용례인 '제사장'을 유지했습니다.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  english_pob_choice: thirteen cities
  chosen_korean: 열세 성읍
  alternatives_korean:
  - 열세 도시
  - 열세 도시들
  lexicon: HALOT
  rationale: 여호수아의 분배 목록 문맥에서 '성읍'이 더 자연스럽고, 단수 명사로 총수를 요약하는 히브리어 표현을 반영했습니다.
- source_word: וּמִגְרְשֵׁיהֶן
  english_pob_choice: with their pasturelands
  chosen_korean: 그 목초지들도 그랬습니다
  alternatives_korean:
  - 그 목초지와 함께였습니다
  - 그 주변 목초지들도 있었습니다
  lexicon: HALOT
  rationale: מִגְרָשׁ을 기능적으로 '목초지'로 옮기되, 열거식 요약 문장의 비서술형 결말을 한국어에서 자연스러운 보충 서술로 처리했습니다.
theological_decisions:
- issue: 제사장 신분과 아론의 아들들의 관계를 어떻게 드러낼지
  chosen_reading: 아론의 아들들, 곧 제사장들로 옮겨 혈통과 직분의 동격을 함께 보이게 했습니다.
  alternative_readings:
  - 아론의 아들들인 제사장들
  - 아론의 아들들, 제사장들
  rationale: 본문은 아론의 아들들을 제사장으로 동격 규정하므로, 두 요소를 모두 보존하는 것이 본문의 의미를 가장 정확히 드러냅니다.
  doctrine_reference: 출 28–29; 민 3:10
- issue: 미그르셰헨의 공간 의미를 어떻게 처리할지
  chosen_reading: 문맥상 레위 성읍 목록의 부속 토지이므로 '목초지'로 옮겼습니다.
  alternative_readings:
  - 주변 땅
  - 부속지
  rationale: 영문 POB가 'pasturelands'를 택한 것은 이 용례의 기능적 의미를 반영한 것이며, 여호수아의 제사장 성읍 분배 맥락과도 맞습니다.
  doctrine_reference: 민 35:2-5; 수 21:12-19
