  yaml_path: translation/ot/joshua/021/019.yaml
  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
  footnotes:
  - marker: a
    text: Or 'and their pasturelands.' The Hebrew simply joins the phrase with 'and'; English may render the summary either as 'were thirteen cities with their pasturelands' or 'thirteen cities and their pasturelands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들, 곧 제사장들의 성읍은 모두 열세 곳이었으며, 각 성읍에는 목초지가 딸려 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열세 성읍과 그 목초지였습니다.” 히브리어는 접속사로 ‘그 목초지들’을 연결합니다. 이를 직역에 가깝게 옮길 수도 있고, 한국어에서는 성읍들에 딸린 목초지로 풀어 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אַהֲרֹן
  english_pob_choice: the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
