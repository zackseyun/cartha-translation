  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
  footnotes:
  - marker: a
    text: Or 'which are designated by name' or 'whose names are specified.' The Hebrew expression indicates that the cities are individually named in the following list.
    reason: lexical_alternative
translation:
  language: ko
  text: '유다 자손의 지파와 시므온 자손의 지파에서, 이름이 언급된 이 성읍들[a]을 주었습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이름으로 불린’ 또는 ‘이름이 명시된’으로 옮길 수 있습니다. 이 히브리어 표현은 이어지는 목록에서 각 성읍의 이름이 개별적으로 제시됨을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  english_pob_choice: they gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 할당했습니다
  - 내주었습니다
  lexicon: HALOT
  rationale: 이 문맥은 레위 성읍의 분배이므로 ‘주었습니다’가 가장 직접적이며, 분배·지정의 의미를 자연스럽게 담습니다.
- source_word: מִמַּטֵּה בְּנֵי יְהוּדָה / וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  english_pob_choice: from the tribe of the sons of Judah / from the tribe of the sons of Simeon
  chosen_korean: 유다 자손의 지파와 시므온 자손의 지파에서
  alternatives_korean:
  - 유다 지파와 시므온 지파에서
  - 유다의 자손 지파와 시므온의 자손 지파에서
  lexicon: HALOT
  rationale: ‘지파’와 ‘자손’의 병렬 구조를 살려 히브리어의 반복을 반영했습니다. ‘유다 지파’로만 줄이면 원문의 친족-지파 표현이 약해집니다.
- source_word: הֶעָרִים הָאֵלֶּה
  english_pob_choice: these cities
  chosen_korean: 이 도시들
  alternatives_korean:
  - 이 성읍들
  - 이 도시들
  lexicon: HALOT
  rationale: עָרִים는 보통 ‘성읍들’로도 옮길 수 있지만, 현대 한국어 가독성을 위해 ‘도시들’을 채택하되, 도시 목록이라는 점은 유지했습니다.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  english_pob_choice: which are called by name
  chosen_korean: 이름으로 불린 것입니다
  alternatives_korean:
  - 이름으로 불린 것입니다
  - 이름이 지정된 것입니다
  - 이름으로 불리는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 수동 표현을 살려, 뒤에 이어질 개별 목록이 이미 이름으로 제시됨을 자연스럽게 전달했습니다.
