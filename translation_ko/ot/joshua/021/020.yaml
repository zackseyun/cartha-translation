  - 고핫의 후손
  lexicon: HALOT
  rationale: 족보적 공식 표현이므로 한국어 성경에서 널리 쓰이는 ‘자손’으로 직역성을 유지했습니다.
- source_word: הַנּוֹתָרִים מִבְּנֵי קְהָת
  english_pob_choice: the Levites who remained from the sons of Kohath
  chosen_korean: 고핫 자손 중에 남은 레위인들
  alternatives_korean:
  - 고핫 자손 가운데 남아 있던 레위인들
  - 고핫 자손에서 남은 레위인들
  lexicon: HALOT
  rationale: 남은 자라는 분사 의미를 살리되, 한국어에서는 관계절보다 ‘중에 남은’이 더 분명하고 자연스럽습니다.
- source_word: עָרֵי גוֹרָלָם
  english_pob_choice: the cities of their lot
  chosen_korean: 그들의 제비의 성읍들
  alternatives_korean:
  - 그들에게 제비로 배정된 성읍들
  - 그들의 몫이 된 성읍들
  lexicon: HALOT
  rationale: גורל의 핵심인 ‘제비/배정’과 ‘성읍들’의 병치를 유지해, 단순 소유가 아니라 분배 결과임을 드러냈습니다.
- source_word: מִמַּטֵּה אֶפְרָיִם
  english_pob_choice: from the tribe of Ephraim
  chosen_korean: 에브라임 지파에서
  alternatives_korean:
  - 에브라임 지파로부터
  - 에브라임의 지파에서
  lexicon: HALOT
  rationale: מִן의 출처/부분 관계를 한국어 조사 ‘에서’로 간결하게 반영했습니다.
theological_decisions:
- issue: 제비뽑기 분배의 표현 방식
  chosen_reading: ‘그들의 제비의 성읍들’로 제비뽑기를 통해 성읍이 정해졌다는 결과를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘그들의 몫이 된 성읍들’
  - ‘제비로 배정된 성읍들’
  rationale: 본문의 גורל(제비/배정) 의미를 흐리지 않기 위해, 배정 결과와 분배 방식이 함께 보이도록 했습니다.
  doctrine_reference: 민수기 26–27장, 여호수아 21장 분배 맥락
