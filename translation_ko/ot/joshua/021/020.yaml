- from: 그리고 고핫 자손의 가족들에게는 — 곧 고핫 자손 중에 남은 레위인들에게는 — 그들의 제비의 성읍들이 에브라임 지파에서 나왔습니다.[a]
  to: 그리고 고핫 자손 가운데 남아 있던 레위 사람들의 가문들에게 제비로 배정된 성읍들은 에브라임 지파에서 나왔습니다.[a]
  rationale: 가문 단위의 분배라는 מִשְׁפְּחוֹת의 의미를 ‘가문들’로 반영하고, ‘고핫 자손 가운데 남아 있던 레위 사람들’이라는 수식 관계를 자연스러운 한국어 관계절로 정리했습니다. עָרֵי גוֹרָלָם은 본문에서 ‘제비로 배정된 성읍들’로 명료하게 옮기고, 직역적 구성은 각주에 보존했습니다.
