  - 가족들을 위해
  lexicon: HALOT
  rationale: 분배·배정 문맥이므로 단순한 소속보다 ‘~에게 배정된’ 뉘앙스를 살려 자연스러운 목적/귀속 표현으로 옮겼습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫 자손
  alternatives_korean:
