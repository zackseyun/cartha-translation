  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the cities allotted to them by lot were from the tribe of Ephraim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 고핫 자손의 가족들에게는 — 곧 고핫 자손 중에 남은 레위인들에게는 — 그들의 제비의 성읍들이 에브라임 지파에서 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명히, ‘그들에게 제비로 배정된 성읍들이 에브라임 지파에서 나왔습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  english_pob_choice: for the families of
  chosen_korean: 가족들에게는
  alternatives_korean:
