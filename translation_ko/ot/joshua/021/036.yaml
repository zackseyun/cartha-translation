id: JOS.21.36
reference: Joshua 21:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֖צֶר וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
  footnotes:
  - marker: a
    text: Jahaz is also spelled Jahzah or Jahazah in English translations.
    reason: lexical_alternative
  - marker: b
    text: Some Hebrew manuscripts and ancient witnesses omit Joshua 21:36–37; the cities listed here parallel 1 Chronicles 6:78–79.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 르우벤 지파에서는 베셀과 그 목초지, 야하스와 그 목초지를 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 히브리어 사본과 고대 증언은 여호수아 21:36–37을 생략하며, 여기의 성읍들은 역대상 6:78–79와 평행합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה רְאוּבֵן
  english_pob_choice: And from the tribe of Reuben
  chosen_korean: 르우벤 지파에서는
  alternatives_korean:
  - 르우벤의 지파에서는
  - 르우벤 지파로부터
  lexicon: 율법 분배 문맥의 מִן + מַטֶּה
  rationale: 분배 목록의 출처를 자연스럽게 드러내면서, ‘지파’의 소속 의미를 살렸습니다.
- source_word: בֶּצֶר
  english_pob_choice: Bezer
  chosen_korean: 베셀
  alternatives_korean:
  - 베체르
  - 벳세르
  lexicon: 고유지명 음역
  rationale: 현대 한국어 음역에 맞춰 장소명을 옮겼습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 바깥뜰
  lexicon: HALOT
  rationale: 레위 성읍 분배 문맥의 מִגְרָשׁ를 도시 주변의 목초지/공동 목초지로 이해하여, 직역보다 의미를 분명히 했습니다.
- source_word: יַהְצָה
  english_pob_choice: Jahaz
  chosen_korean: 야하스
  alternatives_korean:
  - 야핫
  - 야하자
  lexicon: 고유지명 음역
  rationale: 히브리어 지명 יַהְצָה의 한국어 음역을 따랐습니다.
theological_decisions:
- issue: 절의 반복 구조에서 각 성읍에 동일한 토지 분배가 적용되는지 여부
  chosen_reading: ‘베셀과 그 목초지, 야하스와 그 목초지’로 같은 분배 패턴을 그대로 드러냈습니다.
  alternative_readings:
  - 성읍 이름만 열거하고 목초지는 한 번만 묶어 제시
  - ‘각 성읍의 목초지’로 요약
  rationale: 히브리어는 각 지명 뒤에 같은 소유격 표현을 반복하므로, 반복을 유지해 분배의 균등성을 보존했습니다.
  doctrine_reference: 본문의 배분 질서와 레위 성읍 제도
- issue: WLC 본문의 일부 사본 결손 가능성
  chosen_reading: 본문은 마소라 본문을 따라 번역하되, 사본 차이는 본문 밖에서 처리합니다.
  alternative_readings:
  - 본문에 결손 가능성을 반영해 약화된 번역
  - 다른 전승을 본문에 섞어 반영
  rationale: 번역 본문은 주어진 히브리어 본문을 우선하고, 전승 차이는 주석/각주에서 다루는 것이 적절합니다.
  doctrine_reference: 본문비평과 정경 본문 사용 원칙
