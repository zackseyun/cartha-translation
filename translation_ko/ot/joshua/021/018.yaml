base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
  footnotes:
  - marker: a
    text: Or 'common land' / 'surrounding land' for 'pasturelands.' The Hebrew term denotes the open land belonging to a town.
    reason: lexical_alternative
translation:
  language: ko
  text: 아나돗과 그 목초지, 알몬과 그 목초지—네 성읍입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공동지’ / ‘주변 땅’으로도 옮길 수 있습니다. 이 히브리어는 성읍에 속한 열린 땅을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  english_pob_choice: Anathoth
  chosen_korean: 아나돗
  alternatives_korean:
  - 아나돗 성읍
  lexicon: 고유명사 표기
  rationale: 지명은 음역하는 것이 원문 지시를 가장 직접적으로 보존하므로 표준 외래어식 음역인 아나돗을 사용했습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 땅
  - 그 공터
  - 그 목장지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍에 딸린 열린 땅을 가리키며, 문맥상 방목지 의미가 살아 있으므로 ‘목초지’로 옮겼습니다. 각 성읍에 붙는 소유를 반영해 ‘그’로 처리했습니다.
- source_word: עַלְמוֹן
  english_pob_choice: Almon
  chosen_korean: 알몬
  alternatives_korean:
  - 알몬 성읍
  lexicon: 고유명사 표기
  rationale: 이 또한 지명이라 의미 번역보다 음역이 적절합니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 성읍
  alternatives_korean:
  - 네 도시
  - 네 읍
  lexicon: HALOT
  rationale: עָרִים은 경계·분배 목록에서 보통 성읍으로 옮기는 것이 자연스러우며, 숫자 표현도 한국어 순서에 맞게 ‘네 성읍’으로 처리했습니다.
