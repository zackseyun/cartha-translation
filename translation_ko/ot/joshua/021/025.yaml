    rationale: 이 목록에서 מִמַּחֲצִית מַטֵּה מְנַשֶּׁה는 레위인들에게 제공된 성읍의 출처, 곧 므낫세 반 지파로부터의 할당을 표시합니다. ‘므낫세 반 지파에서는’이 이를 정확히 드러냅니다.
  - severity: low
