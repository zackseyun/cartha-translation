  rationale: 출처를 나타내는 히브리어 전치사 מִן을 ‘므낫세 반 지파에서는’으로 바로잡았습니다. 목록식 문체와 두 성읍이라는 결론은 유지했으며, 본문에 없는 동사를 추가하지 않았습니다. 각주는 평행 본문 표기를 표준 한국어 책명으로 정정하고, 변이가 성읍 이름에 관한 것임을 유지했습니다.
