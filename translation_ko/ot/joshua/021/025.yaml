  text: 또 므낫세 반 지파에서는 타아낙과 그 목초지, 가드림몬과 그 목초지, 곧 두 성읍입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 일부 사본과 역대상 6:70의 평행 본문은 므낫세에게서 배정된 성읍들의 이름에서 차이를 보입니다.
