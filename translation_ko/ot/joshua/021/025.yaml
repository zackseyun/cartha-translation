  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
  footnotes:
  - marker: a
    text: Some Hebrew manuscripts and the parallel in 1 Chronicles 6:70 differ in the names of the towns assigned from Manasseh.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 므낫세 반 지파에게는 타아낙과 그 목초지, 가드림몬과 그 목초지 — 두 성읍입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 일부 사본과 1역대 6:70의 평행 본문은 므낫세에게 배정된 성읍 이름에서 차이를 보입니다.
    reason: textual_variant
lexical_decisions:
