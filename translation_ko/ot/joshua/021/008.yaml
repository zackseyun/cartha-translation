    rationale: 원문 לַלְוִיִּם은 ‘레위 사람들/레위인들’이지 ‘레위 자손’이 아닙니다. 후자는 레위의 후손이라는 별도의 표현처럼 들리며 수혜 집단의 통상 명칭을 흐립니다.
  - severity: medium
