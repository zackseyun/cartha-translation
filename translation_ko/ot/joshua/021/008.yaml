  - severity: medium
    issue: 문장 종결 ‘주었으니’
    rationale: 독립된 절의 번역으로는 이유·후속 내용을 기대하게 하는 연결 종결이며, 요구된 현대 합쇼체의 완결 문장으로 고치는 것이 적절합니다.
