  source_fidelity: 원문의 주어는 ‘이스라엘 자손’이고 수혜자는 ‘레위 사람들’입니다. 초안의 ‘레위 자손’은 레위 사람들로 고쳐야 합니다. מִגְרָשֵׁיהֶן은 성읍들에 딸린 목초지/주변 방목지이며, ‘그 주변 들’보다 ‘그 주변 목초지’가 더 정확합니다. בְּיַד מֹשֶׁה는 모세를 매개로 한 명령이라는 뜻이므로 ‘모세를 통하여’로 자연스럽게 옮겼습니다. בַּגּוֹרָל은 분배의 수단을 나타내므로 ‘제비를 뽑아’로 반영했습니다.
  naturalness: 초안은 문장 종결이 합쇼체의 완결형이 아닌 ‘주었으니’로 끝나며, ‘레위 자손’과 ‘주변 들’도 현대 표준어 성경 문맥에서는 부자연스럽거나 부정확합니다. 수정문은 현대적이면서도 격식 있는 합쇼체입니다.
  terminology: ‘여호와’는 제시된 한국어 전통의 신명 표기와 일관됩니다. ‘레위 사람들’, ‘성읍’, ‘목초지’, ‘제비를 뽑아’는 각각 לְוִיִּם, עָרִים, מִגְרָשִׁים, גּוֹרָל을 문맥상 충실하게 반영합니다.
  issues:
