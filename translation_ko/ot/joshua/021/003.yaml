id: JOS.21.3
reference: Joshua 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the command of the LORD.' Literally, 'according to the mouth of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: That is, the open land or pasture area belonging to the cities.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손은[a] 야훼의 명령에 따라[b] 자기들의 기업에서 레위인들에게 이 성읍들과 그 목초지를[c] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 문자적으로 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 입에 따라’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 미그라쉬는 성읍에 딸린 열린 땅, 곧 방목지나 공터를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역형을 살리되, 한국어에서는 자연스러운 성서적 집합 표현인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וַיִּתְּנוּ
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 줬습니다
  - 하사했습니다
  lexicon: HALOT
  rationale: 서술문에서 기본 의미인 ‘주다’를 자연스럽게 반영했고, 토지 분배 문맥에서도 무리 없는 표현입니다.
- source_word: אֶל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입에 따라
  lexicon: HALOT
  rationale: 관용구 ‘입에 따라’를 한국어로 그대로 옮기면 어색하므로, POB의 의미 결정을 따라 ‘명령에 따라’로 풀어 자연스러우면서도 권위를 보존했습니다.
- source_word: מִגְרְשֵׁיהֶן
  english_pob_choice: their pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 뜰
  - 그 들판
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍에 딸린 열린 땅/방목지를 가리키므로, 기능을 드러내는 ‘목초지’가 가장 분명합니다.
- source_word: הֶעָרִים הָאֵלֶּה
  english_pob_choice: these cities
  chosen_korean: 이 성읍들
  alternatives_korean:
  - 이 도시들
  - 이 마을들
  lexicon: HALOT
  rationale: 정착지 분배 문맥에서 עָרִים은 일반적으로 ‘성읍’이 적절하므로, 현대 한국어에서도 성경적 용례를 살린 ‘성읍’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나온 고유한 언약 이름을 보존하기 위해 제목어 ‘주’로 대체하지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לְוִיִּם의 대상 표기
  chosen_reading: 레위인들
  alternative_readings:
  - 레위 사람들
  - 레위 지파 사람들
  rationale: 본문은 제사 직분 집단을 가리키므로, 표준 성서 용례인 ‘레위인들’을 유지했습니다.
  doctrine_reference: DOCTRINE.md glossary — לְוִיִּם → Levites
