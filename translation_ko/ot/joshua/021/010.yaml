id: JOS.21.10
reference: Joshua 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
  footnotes:
  - marker: a
    text: Or 'from the clans of the Kohathites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 레위 자손 가운데 고핫 자손의 가문들[a]에 속한 아론의 아들들의 것이 되었습니다. 첫 번째 제비가 그들에게 돌아갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고핫 자손의 씨족들’.
    reason: ‘가문들’로 옮긴 히브리어 מִשְׁפָּחוֹת는 씨족이라는 더 넓은 친족 집단을 뜻할 수도 있습니다.
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: It was
  chosen_korean: 그것은 … 주어졌습니다
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리고 그것은 …이었습니다
  lexicon: WLC
  rationale: 문맥상 분깃 배정 진술을 이끄는 서술식 표현이므로, 한국어에서는 단순한 존재문보다 배정 결과를 드러내는 자연스러운 문장으로 옮겼습니다.
- source_word: לִבְנֵי אַהֲרֹן
  english_pob_choice: for the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자손들
  - 아론의 아들들을 위해
  lexicon: HALOT
  rationale: 히브리어의 계보적 표현을 살려 ‘아론의 아들들’로 옮기되, 할당 대상임은 문맥과 조사로 충분히 드러나게 했습니다.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  english_pob_choice: from the families of the Kohathites
  chosen_korean: 고핫 자손의 가문들 가운데서
  alternatives_korean:
  - 고핫 사람들의 가족들 가운데서
  - 고핫 사람들의 씨족들 가운데서
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 핵가족보다 넓은 친족 단위를 가리키므로 ‘가문들’로 옮겼고, הַקְּהָתִי의 종족적 표지를 ‘고핫 자손’으로 반영했습니다.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  english_pob_choice: because the first lot was for them
  chosen_korean: 그들에게 첫째 제비가 돌아왔기 때문입니다
  alternatives_korean:
  - 첫째 제비가 그들의 것이었기 때문입니다
  - 첫 제비가 그들에게 있었기 때문입니다
  lexicon: HALOT
  rationale: גוֹרָל은 분깃을 정하는 ‘제비’로 옮겼고, לָהֶם + היה의 소유/배정 뉘앙스를 한국어 관용에 맞게 ‘돌아오다’로 표현했습니다.
theological_decisions:
- issue: 레위 지파 분깃 배정의 표지 표현
  chosen_reading: 이 구절은 아론 자손이 고핫 계열 레위인 가운데서 먼저 제비를 받았다는 사실을 담담히 진술하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 행정 기록으로만 볼 수 있음
  - 제사장직 우선권을 암시하는 신학적 진술로 볼 수 있음
  rationale: 본문 자체는 분깃 배정의 순서를 기록하지만, 아론 계열이 레위 내부에서 특별히 지정되었음을 드러내므로 서술 이상의 함의를 지우지 않았습니다.
  doctrine_reference: 민수기 18장, 여호수아 21장
- issue: 문장 시작의 ‘그것은’
  chosen_reading: 히브리어 와우 연속형의 서술 도입을 살리되, 한국어에서는 문어체 자연성을 위해 의미가 드러나는 형태로 재구성했습니다.
  alternative_readings:
  - 직역형 ‘그리고 그것은’
  - 무표지형 ‘아론의 아들들에게…’
  rationale: 원문의 서사적 연결은 유지하되 한국어 어순상 매끄럽게 읽히도록 했습니다.
  doctrine_reference: 서사 히브리어 문체
