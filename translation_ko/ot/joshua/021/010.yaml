revisions:
- from: 그것은 아론의 아들들[a]에게, 곧 고핫 자손의 가문들 가운데서, 레위의 아들들 가운데서 주어졌습니다. 그들에게 첫째 제비가 돌아왔기 때문입니다.
  to: 그것은 레위 자손 가운데 고핫 자손의 가문들[a]에 속한 아론의 아들들의 것이 되었습니다. 첫 번째 제비가 그들에게 돌아갔기 때문입니다.
  rationale: 귀속을 나타내는 לְ과 הָיָה의 결합을 ‘…의 것이 되었습니다’로 옮겨 원문의 소유·배정 진술을 보존했습니다. 레위 자손–고핫 자손의 가문들–아론의 아들들이라는 계통 관계를 자연스러운 한국어 어순으로 드러냈으며, 제비의 순서는 ‘첫 번째 제비’로 명료하게 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:08Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 아론 자손이 고핫 계열 및 레위 계열에 속하며 첫 제비가 그들에게 돌아갔다는 핵심을 대체로 반영합니다. 그러나 문두의 ‘그것은 … 주어졌습니다’는 원문에 없는 수동적 ‘주어짐’을 도입하고, 지시 대상도 불분명합니다. 또한 ‘첫째 제비’보다 제비뽑기의 순서를 자연스럽게 나타내는 ‘첫 번째 제비’가 적절합니다.
  naturalness: ‘고핫 자손의 가문들 가운데서, 레위의 아들들 가운데서’의 연속된 ‘가운데서’는 한국어에서 계통 관계가 불명료하고 다소 부자연스럽습니다. ‘레위 자손 가운데 고핫 자손의 가문들에 속한’으로 계층 관계를 명료하게 할 수 있습니다.
  terminology: ‘아론의 아들들’, ‘레위 자손’, ‘고핫 자손’, ‘제비’는 계보와 제비뽑기라는 본문의 용례를 잘 살립니다. מִשְׁפָּחוֹת의 대안인 ‘씨족들’은 해당 표현에 각주로 연결해야 합니다.
