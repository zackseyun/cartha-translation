source:
  edition: WLC
  text: אֶת אַיָּלוֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/024.yaml
  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
  footnotes:
  - marker: a
    text: Or 'its common land' or 'its surrounding land'; the Hebrew term refers to the land belonging to a city, often used for grazing.
    reason: lexical_alternative
translation:
  language: ko
  text: 아얄론과 그 목초지, 가드림몬과 그 목초지, 모두 네 성읍입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 공지” 또는 “그 주변 땅”. 히브리어 מִגְרָשׁ는 성읍에 딸린 땅을 가리키며, 이 문맥에서는 흔히 방목지로 쓰이는 땅을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  english_pob_choice: Aijalon
  chosen_korean: 아얄론
  alternatives_korean:
  - 아이얄론
  - 아일론
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역해야 하며, 영어 POB의 Aijalon에 대응하는 현대 한국어 음역으로 아얄론이 자연스럽습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 공지들
  - 그 둘레 땅
  - 그 주변 땅
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍에 딸린 땅, 특히 방목에 쓰이는 땅을 가리키므로, 의미를 살려 ‘목초지들’로 옮겼습니다.
- source_word: גַּת רִמּוֹן
  english_pob_choice: Gath-rimmon
  chosen_korean: 가드-림몬
  alternatives_korean:
  - 가드 림몬
  - 갓-림몬
  lexicon: HALOT
  rationale: 합성 지명은 하나의 지명으로 드러나도록 하이픈을 유지해 음역했고, 한국어 표기에서는 가드-림몬이 가장 읽기 쉽습니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 성읍
  alternatives_korean:
  - 네 도시
  - 네 읍
  lexicon: HALOT
  rationale: 할당 목록의 행정적 맥락에서 עָרִים는 ‘성읍’이 표준적이며, 숫자 표현은 자연스러운 한국어 어순으로 정리했습니다.
theological_decisions:
- issue: 성읍-목초지 짝을 보존할지 여부
  chosen_reading: 각 성읍과 그에 딸린 목초지를 짝지어 반복한 뒤, 마지막에 전체 합계를 덧붙였습니다.
  alternative_readings:
  - 성읍 이름만 나열하기
  - 목초지를 하나로 묶어 설명적으로 풀기
  rationale: 히브리어는 각 성읍마다 מִגְרָשׁ를 붙여 목록 구조를 강조하므로, 그 반복과 총수 표지를 모두 보존하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 본문 구조 및 지리-행정적 서술
