    text: 또는 “그 공지” 또는 “그 주변 땅”. 히브리어 מִגְרָשׁ는 성읍에 딸린 땅을 가리키며, 이 문맥에서는 흔히 방목지로 쓰이는 땅을 뜻합니다.
