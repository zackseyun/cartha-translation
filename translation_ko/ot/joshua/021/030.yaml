id: JOS.21.30
reference: Joshua 21:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
  footnotes:
  - marker: a
    text: Or 'Misheal.' English transliterations of this place name vary.
    reason: lexical_alternative
  - marker: b
    text: '''Pasturelands'' refers to the open land belonging to the town, especially for grazing and related communal use.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아셀 지파에서는 미살과 그 목초지들, 아브돈과 그 목초지들을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미살’은 영어 전통 표기에서 ‘Misheal’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목초지들’은 마을에 딸린 개방지, 특히 방목과 공동 사용을 위한 땅을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  english_pob_choice: and from the tribe of
  chosen_korean: 그리고 … 지파에서는
  alternatives_korean:
  - 그리고 … 지파로부터
  - 그리고 … 지파 중에서
  lexicon: HALOT
  rationale: 문맥이 지파의 분배를 말하므로 מַטֶּה는 ‘막대기/지팡이’가 아니라 ‘지파’로 옮기는 것이 적절합니다. 한국어는 소속·분배 맥락을 자연스럽게 드러내기 위해 ‘에서’ 구문을 사용했습니다.
- source_word: מִשְׁאָל
  english_pob_choice: Mishal
  chosen_korean: 미살
  alternatives_korean:
  - 미샬
  - 미세알
  lexicon: HALOT
  rationale: 지명은 음역하되, 히브리어 자음열을 비교적 직접적으로 반영하는 ‘미살’을 택했습니다. 영어 전통형은 각주로 처리할 수 있으나 본문은 한국어 음역을 따릅니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 공동목초지들
  - 그 열린 땅
  lexicon: HALOT
  rationale: מִגְרָשׁ는 도시/촌락에 딸린 개방지로, 목축에 쓰이는 주변 땅을 가리키므로 ‘목초지들’이 문맥상 가장 자연스럽습니다. 복수형은 두 성읍 각각에 대응하는 반복 구조를 살렸습니다.
- source_word: עַבְדּוֹן
  english_pob_choice: Abdon
  chosen_korean: 아브돈
  alternatives_korean:
  - 압돈
  lexicon: HALOT
  rationale: 통용되는 한국어 음역 ‘아브돈’을 사용했습니다. 동일 본문 내 다른 지명들과의 표기 일관성도 유지됩니다.
