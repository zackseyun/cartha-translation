id: JOS.21.44
reference: Joshua 21:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
  footnotes:
  - marker: a
    text: Or 'No one could stand before them.' The Hebrew idiom 'stand before' means to withstand successfully.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into their hand,' a common idiom for giving someone over to another's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그들의 사방에서 그들에게 안식을 주셨습니다[a]. 이는 그분이 그들의 조상들에게 맹세하신 모든 것에 따른 것이었습니다. 그들 앞에 서서 맞설 수 있었던 자는 그들의 모든 원수 가운데서 한 사람도 없었습니다[b]. 야훼께서 그 모든 원수를 그들의 손에 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사방에서’. 히브리어 관용구는 주변의 위협이 완전히 제거된 상태를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 앞에 서지 못했다’입니다. 이 표현은 성공적으로 대항하거나 버티지 못했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  english_pob_choice: gave them rest
  chosen_korean: 안식을 주셨습니다
  alternatives_korean:
  - 쉬게 하셨습니다
  - 휴식을 주셨습니다
  lexicon: HALOT
  rationale: 전쟁과 정복의 문맥에서 נוח의 사역형은 단순한 휴식보다 ‘안식’을 주는 뜻이 더 정확합니다. ‘주셨습니다’는 하나님의 주도적 행위를 살립니다.
- source_word: מִסָּבִיב
  english_pob_choice: on every side
  chosen_korean: 그들의 사방에서
  alternatives_korean:
  - 사방에서
  - 둘레에서
  lexicon: HALOT
  rationale: 영어 POB의 ‘on every side’는 주변을 완전히 둘러싼 안전을 나타내므로, 한국어에서는 ‘사방에서’보다 문장 흐름이 자연스러운 ‘그들의 사방에서’로 옮겼습니다.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  english_pob_choice: Not one man stood before them
  chosen_korean: 그들 앞에 서서 맞설 수 있었던 자는 그들의 모든 원수 가운데서 한 사람도 없었습니다
  alternatives_korean:
  - 그들 앞에 선 자는 그들의 모든 원수 가운데서 한 사람도 없었습니다
  - 그들을 대적하여 설 수 있는 자는 한 사람도 없었습니다
  lexicon: HALOT
  rationale: ‘서다/앞에 서다’라는 히브리어 관용구를 살리되, 실제 의미인 ‘대항하여 버틸 수 있다’는 뜻을 한국어로 풀어 분명하게 했습니다. ‘한 사람도 없었습니다’는 אִישׁ의 단수성을 유지합니다.
- source_word: בְּיָדָם
  english_pob_choice: into their hand
  chosen_korean: 그들의 손에 넘기셨습니다
  alternatives_korean:
  - 그들의 손에 주셨습니다
  - 그들의 권세 아래 두셨습니다
  lexicon: HALOT
  rationale: ‘손에’라는 성경적 관용을 유지하면서, 현대 한국어에서 승리와 지배의 결과를 자연스럽게 드러내기 위해 ‘넘기셨습니다’를 택했습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 고유 신명인 ‘야훼’를 본문에 유지했습니다. 이는 칭호 ‘주’로 바꾸어 희석하지 않기 위한 선택입니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: 원수와 정복의 결과를 나타내는 관용구
  chosen_reading: 그들의 손에 넘기셨습니다
  alternative_readings:
  - 그들의 손에 주셨습니다
  - 그들에게 넘겨주셨습니다
  rationale: 히브리어 관용구는 단순한 전달이 아니라 전쟁에서의 패배와 종속을 뜻하므로, 결과적 지배를 드러내는 표현을 택했습니다.
  doctrine_reference: Hebrew idiom בְּיָדָם as dominion/victory
