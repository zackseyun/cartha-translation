lexical_decisions:
- source_word: יַתִּר
  english_pob_choice: Jattir
  chosen_korean: 야딧르
  alternatives_korean:
  - 얏딜
  - 야띠르
  lexicon: HALOT
  rationale: 고유 지명으로 번역하지 않고 음역했습니다. 영어 POB의 Jattir를 참고하되, 히브리어 자음과 현대 한국어 외래어 표기 관행을 반영해 표기했습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 공동지
  - 그 방목지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍 주변의 열린 땅, 곧 목축에 쓰이는 부지를 가리키므로 '목초지'가 문맥상 가장 분명합니다. 3인칭 여성 단수 접미사는 각 성읍을 받는 '그'로 옮겼습니다.
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - 와
  lexicon: HALOT
  rationale: 열거 구조를 자연스럽게 이어 주는 접속사로 처리했습니다. 목적격 표지는 한국어에서 직접 드러내지 않았습니다.
