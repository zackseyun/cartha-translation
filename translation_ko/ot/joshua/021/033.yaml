lexical_decisions:
- source_word: כָּל / All
  english_pob_choice: All
  chosen_korean: 모든
  alternatives_korean:
  - 전체의
  - 온
  lexicon: HALOT
  rationale: 총수를 묶어 말하는 수식어이므로, 자연스러운 한국어로 ‘모든’을 써서 전체 합계를 드러냈습니다.
- source_word: עָרֵי / cities
  english_pob_choice: cities
  chosen_korean: 성읍
  alternatives_korean:
  - 도시
  - 마을
  lexicon: HALOT
  rationale: 여호수아의 지파 분배 문맥에서는 단순 도시보다 땅 분배에 속한 거주지를 가리키는 ‘성읍’이 더 정확합니다.
- source_word: הַגֵּרְשֻׁנִּי / the Gershonites
  english_pob_choice: the Gershonites
  chosen_korean: 게르손 사람
  alternatives_korean:
  - 게르손 사람들
  - 게르손 지파
  lexicon: HALOT
  rationale: 히브리어 집합적 종족명을 한국어에서는 ‘사람’으로 옮겨 족속성을 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָם / by their families
  english_pob_choice: by their families
  chosen_korean: 가족별로
  alternatives_korean:
  - 가문별로
  - 그들의 가족에 따라
  lexicon: HALOT
  rationale: 분배의 분류 기준을 간명하게 보여 주는 표현으로 ‘가족별로’가 가장 자연스럽고 원문의 분배 구조를 유지합니다.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר / thirteen cities
  english_pob_choice: thirteen cities
  chosen_korean: 열세 성읍
  alternatives_korean:
  - 열세 도시
  - 열세 개의 성읍
  lexicon: HALOT
  rationale: 히브리어 수사 구조를 한국어 어순에 맞게 옮기되, 앞의 ‘성읍’과 용어를 일치시켰습니다.
- source_word: וּמִגְרְשֵׁיהֶן / with their pasturelands
  english_pob_choice: with their pasturelands
  chosen_korean: 그 성읍들의 목초지
  alternatives_korean:
  - 그 성읍들의 목초지들도
  - 그 목초지들과 함께
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍 주변의 खुल른 땅/목초지를 가리키므로, POB의 ‘pasturelands’에 맞춰 ‘목초지’로 옮겼습니다.
theological_decisions:
- issue: 분배 공식의 반복성과 의미
  chosen_reading: 본문은 레위인에게 할당된 총 성읍 수와 부속 목초지를 행정적으로 요약하는 공식 진술로 읽었습니다.
  alternative_readings:
