  rationale: 문맥상 신학적 강조보다 분배 완료의 공적 확인이 중심이므로, 한국어에서도 건조한 목록 문체를 유지했습니다.
  doctrine_reference: 민수기 35장, 여호수아 21장 레위 성읍 분배
