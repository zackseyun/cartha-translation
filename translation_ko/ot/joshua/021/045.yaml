revisions:
- from: 야훼께서 이스라엘 집에 말씀하신 좋은 말씀 가운데 한 말씀도 떨어지지 않았습니다[a]. 그 모든 것이 이루어졌습니다.
  to: 야훼께서 이스라엘의 집에 하신 모든 좋은 말씀 가운데 이루어지지 않은 것은 하나도 없었습니다[a]. 모두 이루어졌습니다.
  rationale: 'The revision renders the Hebrew idiom faithfully in natural modern formal-polite Korean: no part of Yahweh''s entire favorable word to the house of Israel went unfulfilled. It retains the source''s lexical emphasis on ''word/말씀,'' its totalizing contrast (''not one'' / ''all''), the divine name, and the corporate designation, while offering ''promise/약속'' only as an interpretive lexical alternative.'
  reviewer_model: gpt-5.6-terra
