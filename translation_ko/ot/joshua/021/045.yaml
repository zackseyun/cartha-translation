    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  english_pob_choice: Not one word failed
  chosen_korean: 한 말씀도 떨어지지 않았습니다
  alternatives_korean:
  - 한 말도 실패하지 않았습니다
  - 한 말씀이 헛되이 끝나지 않았습니다
  - 한 말씀도 빠지지 않았습니다
  lexicon: HALOT
  rationale: דָּבָר를 ‘말씀’으로 옮겨 앞뒤의 ‘말씀하신’과 어울리게 하고, נָפַל의 관용적 의미를 한국어의 ‘떨어지다’로 살려 실패/낙오의 의미를 자연스럽게 드러냈습니다.
- source_word: הַדָּבָר הַטּוֹב
  english_pob_choice: the good word
  chosen_korean: 좋은 말씀
  alternatives_korean:
  - 좋은 말
  - 좋은 약속
  - 좋은 말씀
  lexicon: HALOT
  rationale: 하나님이 하신 선한 선포의 전체를 가리키므로, 문자적 반복을 살리면서도 한국어에서 자연스러운 ‘좋은 말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명은 전통적 대체어가 아니라 학술적 음역인 ‘야훼’로 옮겨, 원문의 인격적 언약 이름을 보존했습니다.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  english_pob_choice: to the house of Israel
  chosen_korean: 이스라엘 집에
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘 백성에게
  - 이스라엘 집에게
  lexicon: HALOT
  rationale: ‘בית ישראל’의 언약적 집합 표현을 유지하기 위해 직역에 가까운 ‘이스라엘 집에’를 사용했습니다.
- source_word: בָּא
  english_pob_choice: came to pass
  chosen_korean: 이루어졌습니다
  alternatives_korean:
  - 일어났습니다
  - 왔습니다
  - 성취되었습니다
  lexicon: HALOT
  rationale: 마지막 총괄 진술은 단순한 도착이 아니라 성취를 뜻하므로, 현대 한국어에서 자연스럽고 의미를 분명히 하는 ‘이루어졌습니다’를 택했습니다.
theological_decisions:
- issue: דָּבָר의 번역에서 ‘약속’으로 풀지 여부
  chosen_reading: ‘말씀’으로 두어, 하나님이 말씀하신 것과 그 성취의 연결을 본문 안에서 드러냅니다.
  alternative_readings:
  - 약속
  - 선언
  rationale: 본문은 ‘말씀하신’과 ‘떨어지지 않았다’의 반복을 통해 하나님의 발화 자체가 실패하지 않았음을 강조하므로, 해석적 대체어인 ‘약속’보다 ‘말씀’이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: translation philosophy §1, §5
