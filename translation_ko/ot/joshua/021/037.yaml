  - severity: medium
    issue: 첫 번째 ‘부속 목초지’가 게데못보다 앞에 배치되었습니다.
    rationale: 원문은 ‘게데못과 그 목초지, 므바앗과 그 목초지’ 순서입니다. 각 소유 접미사는 바로 앞 도시를 가리키므로 이 순서를 보존해야 합니다.
