    rationale: ‘그데못’, ‘므바앗’이 한국어 성경 독자에게 더 익숙한 표기이며, 음역 지명으로서의 식별도 분명합니다.
  revised_text: 그데못과 그 목초지[a], 므바앗과 그 목초지, 모두 네 도시입니다.
