base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/037.yaml
  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
  footnotes:
  - marker: a
    text: Or 'common land' or 'surrounding pastureland' for the land attached to each city (Hebrew מִגְרָשׁ).
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 부속 목초지와 함께 게데못과 그 부속 목초지와 함께 메바앗, 네 도시를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִגְרָשׁ은 도시와 연결된 열린 주변 땅 또는 공용지, 곧 목초지로 쓰이는 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  english_pob_choice: Kedemoth
  chosen_korean: 게데못
  alternatives_korean:
  - 케데못
  lexicon: 고유명사 음역
  rationale: 지명은 번역하지 않고 음역하는 것이 원문을 가장 직접적으로 반영합니다. 영어 POB의 Kedemoth에 대응해 한국어에서는 통상적인 음역형인 게데못을 채택했습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 부속 목초지
  alternatives_korean:
  - 그 목초지
  - 그 주변 목초지
  - 그 공동지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 도시와 연결된 열린 주변 땅을 가리키므로, Levitical 도시 문맥에서 ‘부속 목초지’가 의미를 가장 분명하게 드러냅니다. ‘목초지’만 쓰면 연결성이 약해지고, ‘주변 땅’은 기능이 흐려집니다.
- source_word: מֵיפָעַת
  english_pob_choice: Mephaath
  chosen_korean: 메바앗
  alternatives_korean:
  - 메파앗
  lexicon: 고유명사 음역
  rationale: 고유 지명은 음역으로 처리합니다. 영어 POB의 Mephaath에 맞추되, 한국어 표기 관행에 따라 메바앗을 택했습니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 도시
  alternatives_korean:
  - 네 성읍
  - 네 마을
  lexicon: HALOT
  rationale: עָרִים은 분배 목록에서 표준적으로 ‘도시’로 옮길 수 있으며, 여기서는 최종 합계를 요약하는 표현이므로 ‘네 도시’가 가장 자연스럽습니다.
