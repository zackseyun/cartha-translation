id: JOS.21.35
reference: Joshua 21:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת דִּמְנָה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶֽת נַהֲלָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/035.yaml
  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
  footnotes:
  - marker: a
    text: Hebrew manuscripts and ancient versions differ on the inclusion and arrangement of some city names in this section; compare the parallel list in 1 Chronicles 6:62 [English 6:77].
    reason: textual_variant
  - marker: b
    text: Or 'common lands' for 'pasturelands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 디므나와 그 목초지, 나할랄과 그 목초지 — 네 성읍입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 사본들과 고대 역본들은 이 구절의 일부 성읍 이름의 포함과 배열에서 서로 다릅니다. 1역대기 6:62[영어 6:77]의 평행 목록을 비교해 보십시오.
    reason: textual_variant
  - marker: b
    text: ‘목초지’ 대신 ‘공동지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  english_pob_choice: Dimnah
  chosen_korean: 디므나
  alternatives_korean:
  - 드므나
  - 딤나
  lexicon: HALOT
  rationale: 고유 지명은 음역하며, 영어 POB의 Dimnah에 맞춰 한국어 외래어 표기법에 가깝게 옮겼습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 공동지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍에 딸린 열린 땅/방목지를 가리키므로, 문맥상 ‘목초지’가 자연스럽고 Levitical city 목록의 기능을 잘 드러냅니다. 3인칭 여성 단수 접미사는 각 성읍을 가리키는 말로 ‘그’로 처리했습니다.
- source_word: נַהֲלָל
  english_pob_choice: Nahalal
  chosen_korean: 나할랄
  alternatives_korean:
  - 나할알
  - 나홀랄
  lexicon: HALOT
  rationale: 고유 지명은 통용되는 음역을 따랐고, 영어 POB의 Nahalal과 대응되도록 ‘나할랄’로 옮겼습니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 성읍입니다
  alternatives_korean:
  - 네 도시입니다
  - 네 마을입니다
  lexicon: HALOT
  rationale: 열거를 마무리하는 요약 구문이므로, עָרִים은 이 분배 문맥에서 표준적으로 ‘성읍’으로 옮기고 수량을 자연스러운 한국어 어순으로 정리했습니다.
theological_decisions:
- issue: 목초지/공동지의 의미 범위
  chosen_reading: ‘목초지’로 번역해 성읍에 딸린 열린 땅이 실제로 방목과 부속 용도에 쓰이는 공간이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘공동지’
  - ‘주변 들판’
  rationale: 본문의 מִגְרָשׁ은 단순한 공유 토지가 아니라 성읍 주변의 부속지이므로, 영어 POB의 pasturelands를 따라 의미를 분명히 했습니다.
  doctrine_reference: 민수기 35장, 여호수아 21장의 레위 성읍 규정
