- from: 그리고 납달리 지파에서는, 갈릴리의 데베르 성읍[도피성]인 게데스와 그 목초지들, 하못돌과 그 목초지들, 그리고 가르단과 그 목초지들, 곧 성읍 셋이었습니다.[a][b]
  to: 또 납달리 지파에서는, 사람을 죽인 자를 위한 도피성인 갈릴리의 게데스와 그 목초지[a], 하못돌과 그 목초지[b], 가르단과 그 목초지를 받았으니, 성읍은 모두 셋입니다.
