reference: Joshua 21:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י אֶת עִ֣יר מִקְלַ֣ט הָֽ/רֹצֵ֗חַ אֶת קֶ֨דֶשׁ בַּ/גָּלִ֤יל וְ/אֶת מִגְרָשֶׁ֨/הָ֙ וְ/אֶת חַמֹּ֥ת דֹּאר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת קַרְתָּ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שָׁלֹֽשׁ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
  footnotes:
  - marker: a
    text: Or 'the city of refuge for the slayer.' The Hebrew term refers to one who has killed, especially in the legal context of asylum, not necessarily a premeditated murderer.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads Hammoth-dor; some traditions identify the place with Hammath.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 납달리 지파에서는, 갈릴리의 데베르 성읍[도피성]인 게데스와 그 목초지들, 하못돌과 그 목초지들, 그리고 가르단과 그 목초지들, 곧 성읍 셋이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘살인자’보다 넓은 법적 범위를 가리키는 말로, 특히 피신과 재판의 맥락에서 사람을 죽인 자를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 하못돌로 읽히며, 일부 전승은 이를 하맛과 연결합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  english_pob_choice: And from the tribe of Naphtali
  chosen_korean: 그리고 납달리 지파에서는
  alternatives_korean:
  - 그리고 납달리의 지파에서
  - 그리고 납달리 지파로부터
  lexicon: HALOT
  rationale: מַטֶּה는 지파 분배 문맥에서 ‘지파’로 옮기는 것이 자연스럽고, 서술 흐름에 맞게 ‘그리고 …에서는’으로 처리했습니다.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  english_pob_choice: the city of refuge for the manslayer
  chosen_korean: 도피성
  alternatives_korean:
  - 살인자의 도피성
  - 도피를 위한 성읍
  lexicon: HALOT
  rationale: POB의 법적 표현인 ‘city of refuge’를 한국어 성경 관용에 맞는 ‘도피성’으로 옮기되, ‘manslayer’의 법적 뉘앙스는 이어지는 괄호 설명으로 보완했습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 들판들
  - 그 방목지들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 도시 주변의 개방지, 특히 방목지 의미가 있어 반복 공식에 맞게 ‘목초지들’로 간결하게 옮겼습니다.
- source_word: חַמֹּת דֹּאר
  english_pob_choice: Hammoth-dor
  chosen_korean: 하못돌
  alternatives_korean:
  - 하못-돌
  - 하못 도르
  lexicon: HALOT
  rationale: 고유지명은 음역을 따르되, 히브리어 결합형을 반영해 하이픈 없는 연속 표기를 사용했습니다.
- source_word: קַרְתָּן
  english_pob_choice: Kartan
  chosen_korean: 가르단
  alternatives_korean:
  - 카르탄
  - 카르단
  lexicon: HALOT
  rationale: 현대 외래어 표기 관행에 따라 무성음/파열음 값을 반영해 음역했습니다.
theological_decisions:
- issue: 도피성 법어의 윤리적 부담
  chosen_reading: ‘manslayer’를 직접적으로 ‘살인자’로만 고정하지 않고, ‘도피성’으로 본문을 살리되 의미를 주석적 방식으로 보완했습니다.
  alternative_readings:
  - 살인자의 도피성
  - 살인자를 위한 도피성
  rationale: 본문의 법률 용어는 의도적으로 ‘도피’ 제도를 가리키므로, 한국어에서도 제도명인 ‘도피성’을 유지하는 것이 원문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 민수기 35장, 여호수아 20장 도피성 규례
