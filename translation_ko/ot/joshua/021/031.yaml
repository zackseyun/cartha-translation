  lexicon: HALOT
  rationale: 고유지명은 번역하지 않고 음역하는 것이 원문 지시를 가장 잘 보존하므로, 영어 POB의 Helkath에 맞춰 표기했습니다.
- source_word: מִגְרָשֶׁהָ
