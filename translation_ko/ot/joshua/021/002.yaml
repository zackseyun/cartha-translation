base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning ''through Moses.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'their open land' or 'their common land'; the Hebrew refers to the land around the cities used for grazing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가나안 땅 실로에서 그들에게 이렇게 말했습니다. “야훼께서 모세를 통하여[a] 우리에게 거주할 성읍들과 우리 가축을 위한 그 성읍들의 목초지를[b] 주라고 명령하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘모세의 손으로’이며, 관용적으로 ‘모세를 통하여’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 성읍들의 열린 땅’, ‘그 성읍들의 공용지’; 히브리어는 성읍 주변의 방목지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  english_pob_choice: they spoke to them
  chosen_korean: 그들이 ... 그들에게 말하여
  alternatives_korean:
  - 그들이 ... 그들에게 말하고
  - 그들이 ... 그들에게 말했습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 살려 ‘말하여’로 옮기고, אֲלֵיהֶם은 방향성을 드러내는 ‘그들에게’로 반영했습니다.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  english_pob_choice: at Shiloh in the land of Canaan
  chosen_korean: 가나안 땅의 실로에서
  alternatives_korean:
  - 실로에서, 가나안 땅에서
  - 가나안 땅 실로에서
  lexicon: HALOT
  rationale: 장소 표지는 한국어에서 자연스러운 관형 결합으로 정리하되, ‘땅’을 유지해 מקור의 지리적 범위를 보존했습니다.
- source_word: בְיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 살리되, 한국어에서 이해 가능한 도구·매개 표현으로 옮겨 ‘통해’의 매개성을 드러냈습니다.
- source_word: עָרִים לָשָׁבֶת
  english_pob_choice: cities to dwell in
  chosen_korean: 거주할 성읍들을
  alternatives_korean:
  - 살아갈 성읍들을
  - 거주할 도시들을
  lexicon: HALOT
  rationale: עָרִים은 행정·정착 문맥의 ‘성읍들’이 적절하고, לָשָׁבֶת은 목적을 나타내는 분사구로 ‘거주할’이 가장 직접적입니다.
- source_word: מִגְרְשֵׁיהֶן
  english_pob_choice: their pasturelands
  chosen_korean: 그들의 들판도
  alternatives_korean:
  - 그들의 목초지도
  - 그들의 빈 터도
  - 그들의 열린 땅도
  lexicon: HALOT
  rationale: 문맥상 성읍 주변의 방목지이지만, 한국어에서는 기능을 과도하게 좁히지 않으면서도 자연스러운 ‘들판’으로 처리했습니다.
- source_word: לִבְהֶמְתֵּנוּ
  english_pob_choice: for our livestock
  chosen_korean: 우리 가축을 위하여
  alternatives_korean:
  - 우리 가축을 위해
  - 우리의 가축을 위하여
  lexicon: HALOT
  rationale: בהמה의 집합적 의미를 ‘가축’으로 옮기고, 목적 표지는 격식 있는 ‘위하여’로 맞췄습니다.
