source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
  footnotes:
  - marker: a
    text: Or 'from the clans of the tribe of Issachar.' The Hebrew מִשְׁפָּחוֹת can denote extended family groups or clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그숀 자손들에게는 잇사갈 지파의 가족들과 아셀 지파와 납달리 지파와 바산에 있는 므낫세 반 지파에서, 제비 뽑아 열세 개의 성읍을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가족들’은 여기서 מִשְׁפָּחוֹת의 가능한 의미인 확대 가족 단위나 씨족을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  english_pob_choice: And to the sons of
  chosen_korean: 그리고 ... 자손들에게는
  alternatives_korean:
  - 그리고 ... 아들들에게
  - 그리고 ... 후손들에게
  lexicon: HALOT
  rationale: 할당 목록을 잇는 접속은 자연스럽게 살리되, בנים은 족보·지파 문맥에서 표준적으로 쓰이는 ‘자손들’로 옮겨 한국어에서 더 자연스럽고 오해가 적게 하였습니다.
- source_word: מִ/מִּשְׁפְּח֣וֹת
  english_pob_choice: from the families of
  chosen_korean: 가족들
  alternatives_korean:
  - 가문들
  - 씨족들
  lexicon: HALOT
  rationale: English POB의 ‘families’처럼 מִשְׁפָּחוֹת의 확대 가족 단위를 살리되, 한국어 성경 문맥에서 무리 없이 읽히는 ‘가족들’로 두었습니다.
- source_word: מַטֵּה
  english_pob_choice: tribe of
  chosen_korean: 지파
  alternatives_korean:
  - 지팡이
  - 막대
  lexicon: HALOT
  rationale: 분배와 경계 문맥에서 מַטֶּה는 분명히 ‘지파’이므로, 직역적 물건 뜻이 아니라 지파 단위를 반영했습니다.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  english_pob_choice: half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반 지파
  - 므낫세의 절반 지파
  lexicon: HALOT
  rationale: ‘half-tribe’는 여호수아의 분배 목록에서 고정된 역사적 용법이므로, ‘반 지파’로 간결하게 옮겼습니다.
- source_word: בַּ/גּוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비 뽑아
  alternatives_korean:
  - 제비로
  - 제비를 통해
  lexicon: HALOT
  rationale: 분배 방식이 단순히 결과가 아니라 행위를 가리키므로, 한국어에서는 과정이 드러나는 ‘제비 뽑아’가 가장 직접적입니다.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  english_pob_choice: thirteen cities
  chosen_korean: 열세 개의 성읍
  alternatives_korean:
  - 열세 성읍
  - 열세 개의 도시
  lexicon: HALOT
  rationale: עָרִים는 여기서 분배된 정착지를 가리키므로, 역사서 문맥에 맞는 ‘성읍’이 ‘도시’보다 더 정확합니다.
