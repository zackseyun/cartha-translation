    rationale: 도피 성읍은 사람을 죽인 자, 특히 고의성 여부가 아직 법적으로 판정되지 않은 사람과 관련됩니다. ‘사람을 죽인 자’가 원문의 범위를 더 안전하게 보존합니다.
