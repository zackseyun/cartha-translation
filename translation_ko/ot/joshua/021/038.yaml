id: JOS.21.38
reference: Joshua 21:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
  footnotes:
  - marker: a
    text: Or 'the killer' or 'the slayer.' In this legal context, 'manslayer' reflects the asylum setting of the city of refuge more precisely than 'murderer.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Ramoth-gilead.' The Hebrew can be represented either as 'Ramoth in Gilead' or as the conventional compound place name.
    reason: alternative_reading
  - marker: c
    text: '''Pasturelands'' refers to the land surrounding the city assigned for use with it.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 갓 지파에서는 길르앗의 라못[b], 곧 사람을 죽인 자를 위한 도피 성읍[a]과 그 목초지, 그리고 마하나임과 그 목초지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람을 죽인 자’는 이 법적 문맥에서 반드시 고의적 살인자만을 뜻하지 않으며, 도피 성읍의 보호를 구하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 지명은 ‘길르앗의 라못’으로도, 전통적인 합성 지명인 ‘라못-길르앗’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  english_pob_choice: And from the tribe of Gad
  chosen_korean: 그리고 갓 지파에서
  alternatives_korean:
  - 그리고 갓의 지파에서
  - 그리고 갓 지파로부터
  lexicon: WLC; HALOT
  rationale: מַטֶּה는 지파 분배 문맥에서 ‘지파’로 옮기는 것이 자연스럽고, 전치사도 한국어에서는 ‘~에서’로 간결하게 처리하는 것이 좋습니다.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  english_pob_choice: the city of refuge for the manslayer
  chosen_korean: 살인자의 피난 성읍
  alternatives_korean:
  - 피난 성읍
  - 도피 성읍
  - 살인한 자의 피난 성읍
  lexicon: HALOT
  rationale: מִקְלָט의 법적 기능을 ‘피난 성읍’으로 드러내고, הָרֹצֵחַ는 여기서 ‘살인자’보다 ‘살인한 자’에 가까운 여지가 있으나, 문맥상 법적 책임이 걸린 인물을 한국어로 간명하게 표시하기 위해 ‘살인자의’로 옮겼습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 방목지들
  - 그 공터들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍 둘레에 딸린 부속 토지로서, 이 문맥에서는 방목용 땅의 의미가 분명하므로 ‘목초지들’이 가장 직접적입니다.
- source_word: רָמֹת בַּגִּלְעָד / מַחֲנַיִם
  english_pob_choice: Ramoth in Gilead / Mahanaim
  chosen_korean: 길르앗의 라못 / 마하나임
  alternatives_korean:
  - 길르앗 라못 / 마하나임
  - 길르앗에 있는 라못 / 마하나임
  lexicon: HALOT
  rationale: 지명은 음역하되, בַּגִּלְעָד는 자연스러운 한국어 지리 관계를 살려 ‘길르앗의’로 옮겼습니다. 마하나임은 고유명사로 음역을 유지합니다.
theological_decisions:
- issue: 도피 성읍 법률 용어의 음성 유지
  chosen_reading: ‘피난 성읍’과 ‘살인자’를 함께 써서, 이곳이 단순한 일반 피난처가 아니라 법적 보호가 있는 지정 성읍임을 드러냈습니다.
  alternative_readings:
  - ‘도피 성읍’만 사용
  - ‘살인한 자의 성읍’으로 직역
  rationale: 이 절은 여호수아의 성읍 분배 목록이지만, 동시에 율법의 도피 성읍 제도를 전제합니다. 한국어에서 의미가 가장 분명한 조합을 택하되, 법적 뉘앙스를 약화시키지 않았습니다.
  doctrine_reference: 민수기 35장; 신명기 19장
- issue: 성읍의 부속 토지 표현
  chosen_reading: ‘목초지들’로 옮겨 성읍 주변의 배정된 토지를 보여 주었습니다.
  alternative_readings:
  - ‘주변 땅들’
  - ‘공동 목초지’
  rationale: מִגְרָשׁ은 단순한 여분 땅이 아니라 성읍에 딸린 사용 지정 토지이므로, POB의 영어 선택을 따라 기능을 드러내는 표현이 적절합니다.
  doctrine_reference: 레위기 25장; 민수기 35장
