id: JOS.21.43
reference: Joshua 21:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
  footnotes:
  - marker: a
    text: Or 'they possessed it'; the Hebrew verb can also carry the sense 'inherit' in covenantal contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘에게 그들의 조상들에게 주기로 맹세하신 모든 땅을 주셨습니다. 그들은 그 땅을 차지하고[a] 그곳에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 소유했습니다’로 옮길 수 있습니다. 히브리어 동사는 언약 문맥에서 ‘상속받다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC / 프로젝트 기본 용례
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’를 사용하여 원문 식별성을 보존했습니다.
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 내주셨습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미인 ‘주다’를 자연스러운 합쇼체로 옮겼습니다. 문맥상 단순한 부여를 드러내므로 ‘내주다’보다 ‘주다’가 더 직접적입니다.
- source_word: אֶת כָּל הָאָ֔רֶץ
  english_pob_choice: all the land
  chosen_korean: 그 모든 땅
  alternatives_korean:
  - 온 땅
  - 그 땅 전체
  lexicon: HALOT
  rationale: כָּל의 총체성을 살리면서도 약속된 언약의 땅이라는 문맥을 유지하기 위해 ‘그 모든 땅’으로 옮겼습니다.
- source_word: וַיִּרָשׁוּהָ
  english_pob_choice: they took possession of it
  chosen_korean: 그것을 차지하여
  alternatives_korean:
  - 그것을 소유하여
  - 그것을 상속받아
  lexicon: HALOT
  rationale: ירשׁ의 실제적 점유/소유 의미를 살려 ‘차지하다’로 옮겼습니다. ‘상속받다’는 언약적 함의는 있으나 여기서는 점유의 결과가 더 직접적입니다.
- source_word: וַיֵּשְׁבוּ בָהּ
  english_pob_choice: and lived in it
  chosen_korean: 그 안에 살았습니다
  alternatives_korean:
  - 그 안에 거주했습니다
  - 그곳에 정착했습니다
  lexicon: HALOT
  rationale: ישׁב의 기본 의미인 ‘거주하다/살다’를 자연스럽게 반영했습니다. 정착은 의미를 좁힐 수 있어 덜 직접적인 표현을 택했습니다.
theological_decisions:
- issue: ‘their fathers’의 번역과 약속 성취의 직설성
  chosen_reading: ‘그들의 조상들’로 직역에 가깝게 유지하고, 본문이 말하는 약속 성취를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 그들의 선조들
  - 그들의 조상들(의미를 약화하여 일반화)
  rationale: 히브리어는 분명히 ‘아버지들’(조상들)을 말합니다. 한국어에서 자연스러우면서도 본문의 족장 약속 구조를 흐리지 않도록 ‘조상들’을 사용했습니다.
  doctrine_reference: 언약 성취와 본문 직설성 유지
- issue: ‘all the land’의 범위
  chosen_reading: 본문의 ‘그 모든 땅’을 그대로 살려, 전체성의 강조를 약화하지 않았습니다.
  alternative_readings:
  - 그 땅의 상당 부분
  - 약속된 땅의 일부
  rationale: כָּל이 주는 총체적 진술을 보존해야 하므로, 다른 정경 본문과의 조화를 번역 단계에서 미리 조정하지 않았습니다.
  doctrine_reference: 본문 우선 원칙
