  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'family heads' / 'ancestral houses.' The Hebrew idiom refers to clan-based household groupings under paternal leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위 사람들의 조상들의 집안의 우두머리들이 제사장 엘르아살과 눈의 아들 여호수아와 이스라엘 자손의 지파들의 조상들의 집안의 우두머리들에게 나아왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  english_pob_choice: came near
  chosen_korean: 나아왔습니다
  alternatives_korean:
  - 다가왔습니다
  - 가까이 왔습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 이동보다 공식적·절차적 접근을 나타내므로, 문맥에 맞는 중립적이고 격식 있는 ‘나아왔습니다’가 적절합니다.
- source_word: רָאשֵׁי אֲבוֹת
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 조상들의 집안의 우두머리들
  alternatives_korean:
  - 아버지들의 집안의 우두머리들
  - 가문들의 우두머리들
  lexicon: HALOT
  rationale: 히브리어 관용구의 가부장적·씨족적 구조를 드러내기 위해 직역 성격을 살리되, 한국어에서 이해 가능한 ‘집안의 우두머리들’로 옮겼습니다.
- source_word: אֶלְעָזָר הַכֹּהֵן
  english_pob_choice: Eleazar the priest
  chosen_korean: 제사장 엘르아살
  alternatives_korean:
  - 엘르아살 제사장
  - 엘르아살 사제
  lexicon: HALOT
  rationale: כֹּהֵן은 성직 기능을 가진 ‘제사장’이 기본 대응어이며, 인명 앞 배치로 서술 흐름을 자연스럽게 했습니다.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: the heads of the fathers’ houses of the tribes of the sons of Israel
  chosen_korean: 이스라엘 자손의 지파들의 조상들의 집안의 우두머리들
  alternatives_korean:
  - 이스라엘 지파의 가문 우두머리들
  - 이스라엘 자손의 지파 우두머리들
  lexicon: HALOT
  rationale: ‘지파들’과 ‘조상들의 집안’의 중첩된 사회 구조를 최대한 보존하여, 원문의 집단·혈연 질서를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 남성 친족 용어를 일반화할지 여부
  chosen_reading: ‘조상들의 집안’과 ‘이스라엘 자손’의 구조를 유지했습니다.
  alternative_readings:
  - 가문들
  - 이스라엘 사람들
  rationale: 본문은 씨족·지파를 가리키는 남성 친족 표현을 사용하므로, 이를 평준화하기보다 원문 구조를 드러내는 번역이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: source transparency and gender-accurate rendering'
