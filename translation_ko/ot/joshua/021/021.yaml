id: JOS.21.21
reference: Joshua 21:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
  footnotes:
  - marker: a
    text: Or, more literally, 'the city of refuge for the killer.' The Hebrew legal term here refers to one who has caused a death and may flee for asylum pending judgment, not necessarily a convicted murderer.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Mount Ephraim'; that is, the hill country of Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 에브라임 산지에 있는 세겜과 그 주변 초지들, 곧 살인자의 도피성[a], 그리고 그 주변 초지들과 게셀을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘살인자/죽이는 자의 성읍’에 가깝습니다. 여기서의 법률 용어는 반드시 유죄 판결을 받은 살인범만이 아니라, 재판을 기다리며 도피할 수 있는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  english_pob_choice: They gave them
  chosen_korean: 그들은 … 주었습니다
  alternatives_korean:
  - 그들은 … 주었고
  - 그들은 … 주었습니다
  lexicon: HALOT
  rationale: 서술문 체계상 단순 과거 서술로 옮기되, 한국어에서는 자연스러운 주어-목적어 순서를 유지했습니다.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  english_pob_choice: the city of refuge for the manslayer
  chosen_korean: 살인자의 도피성
  alternatives_korean:
  - 도피하는 자의 성
  - 살인자의 피난성
  - 살인자의 도피처
  lexicon: HALOT
  rationale: מִקְלַט은 법적 보호를 위한 ‘도피성’으로, הרֹצֵחַ는 본문 맥락에서 ‘살인자/사람을 죽인 자’를 가리키므로 POB의 기술적 의미를 살려 옮겼습니다.
- source_word: בְּהַר אֶפְרָיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임 산지에 있는
  alternatives_korean:
  - 에브라임의 산지에 있는
  - 에브라임 산지의
  lexicon: HALOT
  rationale: הַר 에브라임은 단일 ‘산’보다 지명적 표현인 ‘산지’가 자연스러워, POB의 지리적 의미를 그대로 반영했습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 주변 초지들
  alternatives_korean:
  - 그 목초지들
  - 그 주변 들판
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍에 딸린 개활지·목초지를 가리키므로, 문맥에 맞게 ‘주변 초지들’로 옮겼습니다.
theological_decisions:
- issue: הרֹצֵחַ의 법적 의미
  chosen_reading: ‘살인자’로 옮기되, 도피성 문맥을 통해 처벌받은 murderer가 아니라 살해 사건의 가해자를 가리키는 법률 용어임을 유지했습니다.
  alternative_readings:
  - ‘사람을 죽인 자’
  - ‘살해한 자’
  - ‘살인한 자’
  rationale: 여호수아의 도피성 규정과 연결되는 기술어이므로, 한국어에서도 법적·신학적 긴장을 흐리지 않도록 ‘살인자’라는 직역적 표현을 사용했습니다.
  doctrine_reference: 민수기 35장, 신명기 19장 도피성 법
- issue: 성과 초지들의 배치
  chosen_reading: 세겜과 그 주변 초지들, 곧 살인자의 도피성, 그리고 그 주변 초지들과 게셀을 한 절 안에서 병렬로 제시했습니다.
  alternative_readings:
  - 세겜, 그 주변 초지들, 곧 살인자의 도피성, 그리고 게셀과 그 주변 초지들
  - 세겜과 그 주변 초지들, 곧 도피성, 그리고 게셀과 그 주변 초지들
  rationale: 히브리어의 병렬 열거를 한국어에서도 유지해 도시와 부속 초지, 그리고 도피성의 기능을 분명히 드러냈습니다.
  doctrine_reference: 본문의 토지 분배 및 도피성 제도
