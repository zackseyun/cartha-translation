  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הֶ֨/עָרִ֜ים לִ/בְנֵ֤י מְרָרִי֙ לְ/מִשְׁפְּחֹתָ֔/ם הַ/נּוֹתָרִ֖ים מִ/מִּשְׁפְּח֣וֹת הַ/לְוִיִּ֑ם וַ/יְהִי֙ גּוֹרָלָ֔/ם עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
  footnotes:
  - marker: a
    text: Or 'for the descendants of Merari' or 'for the Merarites.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest from the Levitical families.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 성읍은 그 가족별로, 레위 사람들의 가족들 가운데 남은 자들인 므라리의 자손에게 속한 것이었으며, 제비뽑기로 받은 성읍은 열두 성읍이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בני מְרָרִי는 문자적으로 ‘므라리의 아들들’이지만, 문맥상 ‘므라리의 자손’ 또는 ‘므라리 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘남은 자들’은 레위 사람들의 다른 가족들 가운데 아직 언급되지 않은 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  english_pob_choice: All the cities
  chosen_korean: 모든 성읍
  alternatives_korean:
  - 모든 도시
  - 모든 고을
  lexicon: HALOT
  rationale: עִיר는 여기서 분배 목록에 나오는 정착 단위를 가리키므로 ‘성읍’이 가장 근접하고, ‘모든’으로 כָּל의 총계를 살렸습니다.
- source_word: לִבְנֵי מְרָרִי
  english_pob_choice: for the sons of Merari
  chosen_korean: 므라리의 자손에게 속한
  alternatives_korean:
  - 므라리의 아들들에게 속한
  - 므라리의 후손에게 속한
  - 므라리 사람들에게 속한
  lexicon: HALOT
  rationale: 족보·분배 문맥에서 ‘sons of’는 문자적 형태를 살리되 자연스럽게 ‘자손’으로 옮기는 것이 가장 투명합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their families
  chosen_korean: 그 가족별로
  alternatives_korean:
  - 그들의 가족대로
  - 각 가족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה의 분배 기준을 드러내기 위해 ‘별로’를 사용해, 명단식 배분의 뉘앙스를 유지했습니다.
- source_word: וַיְהִי גּוֹרָלָם
  english_pob_choice: were ... by lot
  chosen_korean: 제비뽑기로 받은
  alternatives_korean:
  - 그들의 몫은 ...이었습니다
  - 제비로 정해진
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 제비가 되었다’이지만 한국어에서는 분배 결과를 나타내는 서술로 풀어야 하므로 ‘제비뽑기로 받은’으로 옮겼습니다.
theological_decisions:
- issue: 본절의 배분 표현과 소유 귀속의 뉘앙스
  chosen_reading: 레위 지파의 땅 분배가 인간의 임의가 아니라 야훼 앞에서 제비뽑기로 정해졌다는 점을 드러내도록 번역했습니다.
  alternative_readings:
  - 단순히 ‘받았다’고만 옮겨 제비뽑기 뉘앙스를 약화시키는 읽기
  - ‘운명’처럼 비인격적으로 바꾸는 읽기
  rationale: 히브리어 גּוֹרָל은 분배 절차를 가리키므로, 결과만이 아니라 결정 방식까지 살리는 것이 본문 의도에 부합합니다.
  doctrine_reference: 수 18–21의 기업 분배 맥락
