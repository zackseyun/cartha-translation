translation:
  language: ko
  text: 레위 사람들의 가족들 가운데 남아 있던[b] 므라리 자손[a]의 가족들이 제비뽑기로 받은 모든 성읍은 열두 성읍이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘므라리의 아들들’은 이 족보·분배 문맥에서 ‘므라리의 자손’ 또는 ‘므라리 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘남아 있던’은 레위 사람들의 가족들 가운데 앞서 분배를 받은 집단들 외에 남아 있던 므라리 자손의 가족들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  english_pob_choice: All the cities
  chosen_korean: 모든 성읍
  alternatives_korean:
