  rationale: מִגְרָשׁ은 성읍 주변의 공용·방목 공간을 가리키므로, 본문 맥락을 살려 ‘목초지들’로 옮겼습니다. 수식어 ‘그’는 도시를 가리키는 3인칭 소유를 반영합니다.
- source_word: גִּבְעוֹן / גֶּבַע
