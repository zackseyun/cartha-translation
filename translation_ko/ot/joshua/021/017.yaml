  - 그리고 … 가지에서
  lexicon: HALOT
  rationale: מַטֶּה는 지파 분배 문맥에서 ‘지파’로 이해하는 것이 적절하며, 앞의 연결사와 전치사는 한국어에서 자연스럽게 ‘그리고 …에서’로 옮겼습니다.
- source_word: בִנְיָמִן
