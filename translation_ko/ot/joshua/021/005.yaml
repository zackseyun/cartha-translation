base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
  footnotes:
  - marker: a
    text: Or 'the rest of the Kohathites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 남은 고핫 자손에게는—에브라임 지파의 씨족들, 단 지파, 그리고 므낫세 반 지파에서—제비로 열 개 성읍이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고핫 사람들의 남은 자’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  english_pob_choice: And for the remaining sons of Kohath
  chosen_korean: 남은 고핫 자손에게는
  alternatives_korean:
  - 고핫의 남은 자손에게는
  - 남아 있던 고핫 사람들에게는
  lexicon: HALOT
  rationale: 분배 문맥의 여격을 살려 ‘-에게는’으로 옮기고, 고핫은 고유명사로 음역했습니다.
- source_word: מִ/מִּשְׁפְּחֹת
  english_pob_choice: from the clans of
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 족속들
  lexicon: HALOT
  rationale: 지파 내부의 하위 단위를 가리키므로 일반적인 ‘가족’보다 ‘씨족들’이 문맥에 더 가깝습니다.
- source_word: מַטֵּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 막대기
  - 지파/지족
  lexicon: HALOT
  rationale: 문맥상 문자적 ‘막대기’가 아니라 이스라엘의 부족 단위를 뜻하므로 ‘지파’로 옮겼습니다.
- source_word: בַּ/גּוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비로
  alternatives_korean:
  - 제비뽑기로
  - 분배로
  lexicon: HALOT
  rationale: 배분의 수단을 나타내는 표준 표현으로 ‘제비로’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 분배 결과를 나타내는 생략된 서술어
  chosen_reading: 히브리어의 명사구형 진술을 한국어에서는 ‘있었습니다’로 풀어 자연스러운 결과 진술로 옮겼습니다.
  alternative_readings:
  - ‘열 개 성읍이 주어졌습니다’
  - ‘열 개 성읍을 받았습니다’
  rationale: 본문은 목록식 생략 구조이므로 과도하게 해석하지 않으면서도 한국어 문장으로 성립하도록 최소한의 서술어를 보충했습니다.
  doctrine_reference: 서술 구조의 보완 문제
