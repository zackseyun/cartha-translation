  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the children of Israel.' The Hebrew reads 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'open lands' or 'common lands' for the land surrounding the cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들의 모든 성읍은 이스라엘 자손의 소유 안에 있는 성읍들로서 모두 마흔여덟 성읍이었고, 그 목초지들도 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘 자손’. 히브리어는 ‘sons of Israel’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 이 성읍들 주변의 ‘개활지’ 또는 ‘공동 목초지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  english_pob_choice: All
  chosen_korean: 모든
  alternatives_korean:
  - 전체의
  - 온
  lexicon: HALOT
  rationale: 레위 성읍들의 총합을 간명하게 묶는 수량어이므로, 현대 한국어에서 자연스러운 ‘모든’이 적절합니다.
- source_word: עָרֵי הַ/לְוִיִּם
  english_pob_choice: the cities of the Levites
  chosen_korean: 레위 사람들의 성읍들
  alternatives_korean:
  - 레위 지파의 성읍들
  - 레위인들의 도시들
  lexicon: HALOT
  rationale: 직역 구조인 ‘레위 사람들의 성읍들’을 택해 소유격 관계를 드러냈습니다. ‘도시’보다 성읍이 구약 지명·분배 문맥에 더 맞습니다.
- source_word: בְּ/תוֹךְ אֲחֻזַּת
  english_pob_choice: within the possession
  chosen_korean: … 소유 안에 있는
  alternatives_korean:
  - … 기업 안에 있는
  - … 소유 가운데 있는
  lexicon: HALOT
  rationale: 아후자트는 땅의 ‘소유/보유지’ 의미가 핵심이므로, 문맥상 자연스럽고 직접적인 ‘소유 안에 있는’으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 관용적 민족 명칭을 보존하면서도 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וּ/מִגְרְשֵׁיהֶן
  english_pob_choice: with their pasturelands
  chosen_korean: 그 목초지들도
  alternatives_korean:
  - 그 주변 들판도
  - 그 공터들도
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍 둘레의 개활지·방목지를 가리키므로, 이 문맥에서는 ‘목초지’가 가장 구체적입니다.
theological_decisions:
- issue: 이스라엘 자손이라는 집합 명칭의 처리
  chosen_reading: 민족 공동체를 가리키는 남성 복수 관용구를 그대로 반영하여 ‘이스라엘 자손’으로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어 본문이 가진 형식을 약화시키지 않으면서도, 청중에게 익숙한 공동체 명칭을 보존하기 위한 선택입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
