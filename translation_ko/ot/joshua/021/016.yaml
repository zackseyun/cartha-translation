  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
  footnotes:
  - marker: a
    text: Or 'common lands' or 'surrounding lands' for the land belonging to each city.
    reason: lexical_alternative
translation:
  language: ko
  text: 아인과 그 목초지, 웃다와 그 목초지, 벧세메스와 그 목초지—이 두 지파에게서 나온 아홉 성읍입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַיִן
  english_pob_choice: Ain
  chosen_korean: 아인
  alternatives_korean:
  - 아얀
  - 아인(음역 유지)
  lexicon: HALOT
  rationale: 고유 지명은 뜻풀이보다 음역이 적절하며, 한국어에서는 ‘아인’이 자연스러운 표기입니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 땅
  - 그 공지
  - 그 방목지
  lexicon: HALOT
  rationale: 성읍에 딸린 바깥땅을 가리키므로, POB의 ‘pasturelands’에 맞춰 방목·목축의 용도를 드러내는 ‘목초지’로 옮겼습니다.
- source_word: יֻטָּה
  english_pob_choice: Juttah
  chosen_korean: 웃다
  alternatives_korean:
  - 유타
  - 주타
  lexicon: HALOT
  rationale: 표준 한국어 성경에서 통용되는 지명 음역을 따랐습니다.
- source_word: בֵּית שֶׁמֶשׁ
  english_pob_choice: Beth-shemesh
  chosen_korean: 벧세메스
  alternatives_korean:
  - 벧-세메스
  - 벧 쉐메쉬
  lexicon: HALOT
  rationale: 고유 지명은 관용적 음역을 유지하는 것이 본문 식별에 가장 분명합니다.
- source_word: עָרִים תֵּשַׁע
  english_pob_choice: nine cities
  chosen_korean: 아홉 성읍
  alternatives_korean:
  - 아홉 도시
  - 아홉 마을
  lexicon: HALOT
  rationale: 이 분배 문맥에서 ‘עָרִים’은 행정적 단위로서 ‘성읍’이 가장 적절합니다.
