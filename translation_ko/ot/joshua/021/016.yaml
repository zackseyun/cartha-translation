    rationale: ‘윳다’가 한국어 성경에서 널리 쓰이는 관용 표기이며, 히브리어의 첫 자음과 모음값에도 더 가깝습니다.
  - severity: low
    issue: 목초지 어휘 주석 앵커 누락
    rationale: מִגְרָשֶׁיהָ에는 ‘공동지’나 ‘주변의 땅’이라는 가능한 번역 범위가 있으므로, 영어 POB 감사 기록의 어휘 주석에 대응하는 앵커와 주석을 둡니다.
