  lexicon: HALOT
  rationale: לְ의 수여 대상을 살려 ‘…에게는’으로 옮기고, בנים은 문맥상 혈통/계승 집단을 가리키므로 한국어에서는 자연스럽게 ‘자손들’로 옮겼습니다.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  english_pob_choice: the city of refuge for the manslayer
  chosen_korean: 살인자의 피난 성읍
  alternatives_korean:
  - 살인자의 도피 성읍
  - 살인자를 위한 피난 성읍
  lexicon: HALOT
  rationale: 미그랄/미클랏의 법정 용례를 살려 ‘피난 성읍’으로 옮기고, רֹצֵחַ는 우발적 살인을 포함하는 법률 용어이지만 한국어에서는 그 긴장을 너무 풀지 않도록 ‘살인자’로 옮겼습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 목초지들
  - 그 공동지들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍에 딸린 열린 땅/목초지를 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘목초지들’로 간결하게 옮겼습니다.
- source_word: חֶבְרוֹן / לִבְנָה
  english_pob_choice: Hebron / Libnah
  chosen_korean: 헤브론 / 리브나
  alternatives_korean:
  - 헤브론 / 립나
  lexicon: 현대 외래어 표기
  rationale: 지명은 현대 한국어 외래어 표기에 따라 표기하되, 성서 지명으로 널리 통용되는 형태를 우선했습니다.
theological_decisions:
- issue: רֹצֵחַ의 법정 의미를 한국어로 어떻게 드러낼지
  chosen_reading: 본문에는 ‘살인자’를 두되, 우발적 살인까지 포괄하는 법률 용례라는 긴장은 각주로 설명하지 않았습니다.
  alternative_readings:
  - ‘살해한 자’
  - ‘사람을 죽인 자’
  rationale: 이 절은 도피 성읍 규정의 일부이므로 משפט적 용례를 유지하는 것이 중요합니다. 한국어에서 ‘살인자’가 너무 강하게 의도적 살인을 뜻할 수 있으나, 본문 전체의 법적 맥락이 그 의미를 보정합니다.
  doctrine_reference: 도피 성읍 규례(민 35장; 수 20장)
