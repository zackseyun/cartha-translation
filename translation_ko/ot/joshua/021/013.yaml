  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
  footnotes:
  - marker: a
    text: Or 'the city of refuge for the killer/slayer.' The Hebrew term here is the legal term for one who has caused a death and may flee to a refuge city; 'manslayer' best preserves that nuance without implying premeditated murder.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 아론의 자손들에게는 사람을 죽인 자를 위한 피난 성읍인 헤브론[가]과 그 목초지들, 그리고 리브나와 그 목초지들을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 또는 ‘사람을 죽인 자의 피난 성읍’. 여기서 ‘사람을 죽인 자’는 피난 성읍으로 피할 수 있는 법률적 용어로, 반드시 계획적 살인을 뜻하지는 않습니다.
    reason: 히브리어 רֹצֵחַ의 법률적 의미와 ‘살인자’가 현대 한국어에서 함축할 수 있는 고의성의 차이를 밝혀 줍니다.
lexical_decisions:
- source_word: וְלִבְנֵי
  english_pob_choice: And to the sons of
  chosen_korean: …의 자손들에게는
  alternatives_korean:
  - …의 아들들에게는
