  text: אֶת יַרְמוּת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת עֵ֥ין גַּנִּ֖ים וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
  footnotes:
  - marker: a
    text: En-gannim may also be spelled "Ain-gannim" in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 야르무트와 그 목초지, 그리고 엔간님과 그 목초지—네 성읍입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엔간님’은 영어 음역에서 ‘Ain-gannim’으로도 적을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  english_pob_choice: Jarmuth
  chosen_korean: 야르무트
  alternatives_korean:
  - 야르못
  - 자르무트
  lexicon: HALOT
  rationale: 고유 지명은 원문을 따르되 한국어 외래어 표기 원칙에 맞춰 음역했습니다.
- source_word: מִגְרָשֶׁהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 땅
  - 그 들판
  - 그 공터
  lexicon: HALOT
  rationale: 도시 주변의 개방된 목초·부속지라는 의미를 살려, 문맥에 자연스러운 ‘목초지’로 옮겼습니다.
- source_word: עֵין גַּנִּים
  english_pob_choice: En-gannim
  chosen_korean: 엔간님
  alternatives_korean:
  - 엔-간님
  - 아인간님
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역했습니다. 영어 주석의 ‘Ain-gannim’ 가능성은 한국어 본문보다 각주에서 처리하는 것이 적절합니다.
- source_word: עָרִים אַרְבַּע
  english_pob_choice: four cities
  chosen_korean: 네 성읍입니다
  alternatives_korean:
  - 네 도시입니다
  - 네 성읍이었습니다
  lexicon: HALOT
  rationale: 요약 결론 형식에 맞춰 수량과 항목을 간결하게 살렸고, עָרִים은 이 목록 문맥에서 ‘성읍’이 가장 자연스럽습니다.
theological_decisions:
- issue: 지명 목록의 종결 표현
  chosen_reading: ‘—네 성읍입니다’로 끝내어 본문의 목록 요약과 결론을 분명히 했습니다.
  alternative_readings:
  - ‘네 성읍이었습니다’
  - ‘모두 네 성읍입니다’
  rationale: 히브리어의 열거 뒤 결론적 수량 진술을 한국어로 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 본문의 서술적 목록 형식
