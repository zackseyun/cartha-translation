  source_fidelity: 핵심 분배 내용과 열세 성읍이라는 수량은 정확합니다. 다만 לְמִשְׁפְּחֹת는 현대 한국어에서 개인 단위로 들리는 ‘가족들’보다 혈연 집단을 나타내는 ‘여러 가문’ 또는 ‘종족’으로 옮기는 것이 문맥에 더 충실합니다. 또한 아론의 아들들이 레위인 가운데 속한다는 한정 관계를 더 자연스럽게 배열할 필요가 있습니다.
  naturalness: ‘고핫 자손의 가족들에게 나왔고’는 한국어에서 제비의 귀속 대상이 다소 어색하게 연결됩니다. ‘고핫 자손의 여러 가문을 위하여 제비가 나왔습니다’와 같이 서술하면 히브리어 관용구를 유지하면서도 자연스럽습니다. ‘성읍’은 이 문맥에서 적절합니다.
  terminology: ‘고핫 자손’, ‘제사장 아론의 아들들’, ‘레위 사람들’, ‘지파’, ‘제비’, ‘성읍’은 적절합니다. 원문의 מִשְׁפְּחֹת에는 ‘가족들’보다 ‘여러 가문’이 더 정확합니다. 주석은 영어 관용구를 설명하기보다 한국어 번역과 히브리어 표현의 관계를 설명해야 합니다.
