base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
  footnotes:
  - marker: a
    text: Or 'the lot fell for the families of the Kohathites.' The Hebrew idiom can be rendered either 'came out' or 'fell' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 고핫 자손의 여러 가문을 위하여 제비가 나왔습니다. 레위 사람들 가운데 제사장 아론의 아들들은 유다 지파와 시므온 지파와 베냐민 지파에서 제비로 열세 성읍을 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘제비가 나왔다’입니다. 문맥에 따라 ‘제비가 떨어졌다’ 또는 ‘제비가 뽑혔다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  english_pob_choice: the lot came out
  chosen_korean: 그 제비가 ... 나왔고
  alternatives_korean:
  - 그 제비가 떨어졌고
  - 제비가 뽑혔고
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 살리기 위해 ‘나왔고’를 택했고, ‘떨어졌고’도 가능하지만 본문 흐름에서는 ‘나오다’가 더 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  english_pob_choice: for the families of the Kohathites
  chosen_korean: 고핫 자손의 가족들에게
  alternatives_korean:
  - 고핫 자손의 가문들에게
  - 고핫 사람들의 가족들에게
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 혈연 집단을 가리키므로 ‘가족들’로 옮기되, 집단적 후손을 드러내기 위해 ‘고핫 자손’을 붙였습니다.
- source_word: מִן הַלוִיִּם
  english_pob_choice: from among the Levites
  chosen_korean: 레위인들 가운데서는
  alternatives_korean:
  - 레위인들 중에서
  - 레위인들로부터
  lexicon: HALOT
  rationale: 부분 집합을 나타내는 מן의 의미를 살려 ‘가운데서는’으로 풀어, 아론의 아들들이 레위인들 안에 속한 범주임을 분명히 했습니다.
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  english_pob_choice: from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin
  chosen_korean: 유다 지파, 시므온 지파, 베냐민 지파에서
  alternatives_korean:
  - 유다 지파와 시므온 지파와 베냐민 지파에서
  - 유다, 시므온, 베냐민 지파에서
  lexicon: HALOT
  rationale: מַטֶּה의 부족적 의미를 ‘지파’로 옮기고, 히브리어의 반복 구조는 한국어에서 과도하지 않게 정리했습니다.
- source_word: בַּגּוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비로
  alternatives_korean:
  - 제비를 통해
  - 제비뽑기로
  lexicon: HALOT
  rationale: 수단·방식을 나타내는 전치사의 값을 살려 ‘제비로’라고 간명하게 표현했습니다.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  english_pob_choice: thirteen cities
  chosen_korean: 열세 성읍
  alternatives_korean:
  - 열세 도시
  - 열세 고을
  lexicon: HALOT
  rationale: 정착지 분배 문맥에서 עָרִים은 ‘성읍’이 가장 안정적인 대응어이므로 이를 유지했습니다.
theological_decisions:
- issue: 제비가 ‘나왔다’는 표현의 신학적 함의
  chosen_reading: 분배의 결과가 우연이 아니라 하나님께서 정하신 몫으로 제시되므로, 본문 흐름을 따라 단순한 우연보다 섭리적 배정을 암시하는 표현을 유지했습니다.
  alternative_readings:
  - 제비가 떨어졌고
  - 제비가 뽑혔고
  rationale: 본문은 분깃 배정을 기록하는 역사 서술로, 결과의 확정성과 공적 분배를 강조합니다.
  doctrine_reference: Providence in allotment narratives
