id: JOS.21.27
reference: Joshua 21:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
  footnotes:
  - marker: a
    text: Hebrew Beeshterah; compare 1 Chronicles 6:71, which has Ashtaroth.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 게르손의 자손들—레위인들의 종족들 가운데서—곧 므낫세 반 지파에게는 길르앗의 골란, 곧 살인자의 도피성[도피 성읍]과 그 목초지, 그리고 그 목초지와 함께한 브에스테라, 두 성읍을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리 본문은 브에스테라로 읽으며, 1역대상 6:71은 아스다롯을 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  english_pob_choice: And to the sons of Gershon
  chosen_korean: 게르손의 자손들
  alternatives_korean:
  - 게르손의 아들들
  - 게르손 사람들
  lexicon: HALOT
  rationale: בני의 직역인 ‘아들들’도 가능하지만, 한국어에서는 족속·계보 문맥에서 ‘자손들’이 더 자연스럽고 남성 한정 느낌을 줄입니다.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  english_pob_choice: from the clans of the Levites
  chosen_korean: 레위인들의 종족들 가운데서
  alternatives_korean:
  - 레위인들의 가문들 가운데서
  - 레위인들의 족속들 가운데서
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 ‘가족’보다 부족 내 하위 집단을 가리키므로, 분배 문맥에서는 ‘종족들’이 의미를 잘 살립니다.
- source_word: עִיר מִקְלַט הָ/רֹצֵ֔חַ
  english_pob_choice: the city of refuge for the manslayer
  chosen_korean: 살인자의 도피성[도피 성읍]
  alternatives_korean:
  - 살인자를 위한 도피성
  - 도피 성읍인 살인자의 성읍
  lexicon: HALOT
  rationale: 도피성은 본문에 있는 법정·성소적 용어를 살리는 정착 표현입니다. 다만 הָרֹצֵחַ는 문맥상 고의적 살인만이 아니라 피살자와 관련된 법률 용례를 포함할 수 있어, 주석 없이 ‘살인자’로 두되 도피성이라는 법적 용어를 유지했습니다.
- source_word: בַּ/בָּשָׁן
  english_pob_choice: in Bashan
  chosen_korean: 길르앗의 골란
  alternatives_korean:
  - 바산의 골란
  - 길르앗 바산의 골란
  lexicon: HALOT
  rationale: 지명은 음역하되, 본문이 지명 목록 속에서 지리적 식별을 돕는 전통적 연관표현을 드러내도록 ‘길르앗의’를 덧붙일 수 있습니다. 다만 본문 핵심은 장소명 보존입니다.
- source_word: מִגְרָשֶׁ֔/הָ
  english_pob_choice: with its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 나지
  lexicon: HALOT
  rationale: מִגְרָשׁ는 레위 성읍 주변의 비경작지·방목지를 가리키므로, ‘목초지’가 가장 간결하고 기능적으로 대응합니다.
- source_word: בְּעֶשְׁתְּרָ֖ה
  english_pob_choice: Beeshterah
  chosen_korean: 브에스테라
  alternatives_korean:
  - 아스다롯
  - 베에스테라
  lexicon: HALOT
  rationale: 히브리 본문 표기는 Beeshterah이므로, 본문에는 이를 음역한 ‘브에스테라’를 두고, 평행본문의 Ashtaroth와의 대응 가능성은 각주로 처리하는 편이 원문 추적성이 높습니다.
theological_decisions:
- issue: 출애굽/율법 용어의 법정적 뉘앙스
  chosen_reading: ‘도피성’과 ‘살인자’의 조합을 유지해 레위기·여호수아의 법적 제도를 분명히 드러냅니다.
  alternative_readings:
  - ‘피신성’
  - ‘피살자 보호성’
  rationale: 본문은 단순한 피난처가 아니라 재판과 보호를 포함한 제도적 성읍을 말하므로, 관용적이지만 법적 의미를 보존하는 번역이 필요합니다.
  doctrine_reference: 민수기 35장; 여호수아 20장
- issue: 지명 평행본문 처리
  chosen_reading: 브에스테라를 본문에 두되, 1역대상 6:71의 아스다롯과의 평행을 각주로 남깁니다.
  alternative_readings:
  - 본문을 아스다롯으로 조정
  - 두 이름을 본문에 병기
  rationale: 마소라 본문을 따라가면서도 평행본문 차이를 숨기지 않는 것이 POB의 추적성 원칙에 맞습니다.
  doctrine_reference: 본문비평 주의 사항
