    rationale: 원문에서 ‘열 성읍과 그 목초지’ 전체는 남은 고핫 자손의 씨족들과 관련됩니다. 초안은 목초지만 ‘씨족을 위한 것’이라고 하여 성읍의 배정 관계가 문법적으로 불분명합니다.
