source:
  edition: WLC
  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
  footnotes:
  - marker: a
    text: Or 'ten cities.' The Hebrew wording is a summary formula concluding the list.
    reason: lexical_alternative
  - marker: b
    text: '''Pasturelands'' refers to the open land belonging to the cities, especially for grazing and related use.'
    reason: cultural_note
  - marker: c
    text: Or 'the Kohathites' for 'the sons of Kohath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 성읍은 열 개였습니다[a]. 또한 그 성읍들의 목초지[b]는 고핫의 남은 자손의 씨족[c]을 위한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열 성읍들’. 히브리어 표현은 앞의 성읍 목록을 마무리하는 요약 공식입니다.
    reason: alternative_reading
  - marker: b
    text: ‘목초지’는 성읍에 딸린 열린 땅, 특히 방목과 관련된 용도를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘고핫 사람들’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  english_pob_choice: All the cities were ten
  chosen_korean: 모든 성읍은 열 개였습니다
  alternatives_korean:
  - 열 성읍이었습니다
  - 성읍은 모두 열 개였습니다
  lexicon: HALOT
  rationale: 히브리어의 요약 공식적 결말을 살리기 위해 수량을 앞세운 자연스러운 한국어보다 ‘성읍은 열 개였습니다’처럼 총계를 선언하는 형식을 택했습니다.
- source_word: מִגְרְשֵׁיהֶן
  english_pob_choice: their pasturelands
  chosen_korean: 그 성읍들의 목초지
  alternatives_korean:
  - 그 성읍들의 들판
  - 그 성읍들의 주변 땅
  lexicon: HALOT
  rationale: 이 용어는 레위 성읍 목록에서 성읍에 딸린 열린 땅, 특히 방목용 공간을 가리키므로 ‘목초지’가 문맥상 가장 분명합니다.
- source_word: לְמִשְׁפְּחוֹת
  english_pob_choice: for the clans of
  chosen_korean: 씨족을 위한 것이었습니다
  alternatives_korean:
  - 가문들을 위한 것이었습니다
  - 족속들을 위한 것이었습니다
  lexicon: HALOT
  rationale: 히브리어 מִשְׁפָּחוֹת는 단순한 가족보다 부족 내부의 하위 집단이므로, 현대 한국어에서는 ‘씨족’이 가장 기능적으로 가깝습니다.
- source_word: בְּנֵי קְהָת הַנּוֹתָרִים
  english_pob_choice: the remaining sons of Kohath
  chosen_korean: 고핫의 남은 자손
  alternatives_korean:
  - 남은 고핫 사람들
  - 고핫 가문의 남은 자손
  lexicon: HALOT
  rationale: ‘sons of Kohath’의 계보적 표현을 유지하면서, 이미 앞서 배정받은 분파를 제외한 ‘남은’이라는 수식을 살렸습니다.
theological_decisions:
- issue: 레위 성읍 결산문의 요약 형식
  chosen_reading: 이 절은 개별 성읍 열 개와 그 목초지의 총합을 선언하는 결산문으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘열 성읍’이라는 목록 제목으로 읽는 해석
  - 성읍 수만 말하고 목초지는 부차적으로 보는 해석
  rationale: 히브리어 어순과 POB의 ‘the cities were ten’ 처리에 따라, 본문은 목록의 결론을 맺는 총괄 진술로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 해석/서사 구조
