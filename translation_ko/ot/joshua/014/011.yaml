id: JOS.14.11
reference: Joshua 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
  footnotes:
  - marker: a
    text: Or, more literally, 'for going out and coming in,' a Hebrew idiom for full vigor in action and leadership.
    reason: cultural_note
translation:
  language: ko
  text: 저는 오늘도 모세가 저를 보냈던 날과 같이 아직도 강합니다. 그때 제 힘이 그랬던 것처럼, 지금도 제 힘은 그러하며, 싸우고 나가고 들어오는 일에 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나가고 들어오는 일’은 히브리어 관용구로, 전반적인 활동력과 지도력을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי / הַיּוֹם
  english_pob_choice: I am still ... today
  chosen_korean: 저는 오늘도 아직도
  alternatives_korean:
  - 저는 여전히
  - 저는 지금도
  lexicon: HALOT
  rationale: עוֹדֶנִּי와 הַיּוֹם의 지속 상태를 자연스러운 현대 한국어로 살리되, 중복이 과하므로 ‘오늘도 아직도’보다 더 매끄러운 문장 구조로 정리했습니다.
- source_word: חָזָק
  english_pob_choice: strong
  chosen_korean: 강합니다
  alternatives_korean:
  - 튼튼합니다
  - 강건합니다
  lexicon: HALOT
  rationale: 문맥이 전투와 이동 능력에 관한 자기 진술이므로 물리적·실질적 힘을 나타내는 ‘강하다’가 가장 직접적입니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 싸우고
  alternatives_korean:
  - 전쟁을 위해
  - 전투를 위해
  lexicon: HALOT
  rationale: 명사구를 직역하면 한국어가 경직되므로, 뒤의 관용구와 함께 능력의 범위를 풀어 ‘싸우고’로 표현했습니다.
- source_word: וְלָצֵאת וְלָבוֹא
  english_pob_choice: for going out and coming in
  chosen_korean: 나가고 들어오는 일에
  alternatives_korean:
  - 나가고 들어오는 데
  - 출입하는 일에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 일상적 활동과 지도 능력 전체를 가리키는 표현으로 살리기 위해 ‘나가고 들어오는 일’로 옮겼습니다.
theological_decisions:
- issue: ‘going out and coming in’의 관용적 의미
  chosen_reading: 단순한 이동이 아니라 전반적인 활동력과 지도력의 표현으로 읽었습니다.
  alternative_readings:
  - 그냥 물리적 출입의 능력
  - 군사적 출정과 귀환만 가리키는 말
  rationale: 영어 POB 주석이 이 표현을 ‘full vigor in action and leadership’의 관용구로 설명하므로, 한국어 본문도 그 넓은 의미를 보존했습니다.
  doctrine_reference: 해당 없음
