revisions:
- from: 요셉의 아들들은 두 지파였으니 — 므낫세와 에브라임입니다. 그들은 땅에서 레위 사람들에게는 몫을 주지 않고, 다만 거주할 성읍들과 그들의 가축을 위한 목초지와 그들의 소유를 위한 것만 주었습니다.[a][b]
  to: 이는 요셉의 자손이 므낫세와 에브라임, 곧 두 지파였고, 그들이 땅에서 레위 사람들에게는 몫을 주지 않고 다만 거주할 성읍들과 그들의 가축과 소유를 위한 목초지만 주었기 때문입니다.[b]
  rationale: 문장의 설명적 연결과 합쇼체 서술을 정돈하고, ‘목초지’가 가축과 소유 모두를 위한 부속 토지라는 원문의 수식 관계를 명확히 했습니다. 불필요한 각주 a를 삭제하고, 문화적 배경을 설명하는 각주 b만 해당 어구에 유지했습니다.
  reviewer_model: gpt-5.6-terra
