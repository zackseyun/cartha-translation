  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
  footnotes:
  - marker: a
    text: Or 'because the descendants of Joseph were two tribes.'
    reason: lexical_alternative
  - marker: b
    text: '''Pasturelands'' refers to the open land around the Levite cities, used especially for grazing.'
    reason: cultural_note
  - marker: c
    text: Or 'possessions' for 'property.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉의 아들들은 두 지파였으니 — 므낫세와 에브라임입니다. 그들은 땅에서 레위 사람들에게는 몫을 주지 않고, 다만 거주할 성읍들과 그들의 가축을 위한 목초지와 그들의 소유를 위한 것만 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두 지파’는 요셉의 후손이 므낫세와 에브라임으로 나뉘어 지파 수를 이루는 뜻입니다.
    reason: cross_reference
  - marker: b
    text: ‘목초지’는 레위 성읍 주위의 열린 땅으로, 특히 방목에 사용되는 구역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יוֹסֵף
  english_pob_choice: the sons of Joseph
  chosen_korean: 요셉의 아들들
  alternatives_korean:
  - 요셉의 자손들
  - 요셉의 후손들
  lexicon: HALOT
  rationale: 문맥상 족속/지파를 가리키므로 직역적이면서도 자연한 ‘아들들’이 적절합니다.
- source_word: שְׁנֵי מַטּוֹת
  english_pob_choice: two tribes
  chosen_korean: 두 지파
  alternatives_korean:
  - 두 막대기
  - 두 부족
  lexicon: HALOT
  rationale: 여기서 מַטּוֹת는 문자적 ‘막대기’가 아니라 지파 구분을 뜻하므로 ‘지파’로 옮겼습니다.
- source_word: מִגְרְשֵׁיהֶם
  english_pob_choice: their pasturelands
  chosen_korean: 그들의 목초지
  alternatives_korean:
  - 그들의 들판
  - 그들의 공동지
  lexicon: HALOT
  rationale: 성읍 주변의 개방된 땅으로서 특히 방목에 쓰이는 뉘앙스를 한국어에서 가장 간명하게 드러냈습니다.
- source_word: וּלְקִנְיָנָם
  english_pob_choice: and for their possessions
  chosen_korean: 그들의 소유
  alternatives_korean:
  - 그들의 소유물
  - 그들의 재산
  lexicon: HALOT
  rationale: 최종 항목은 물건만이 아니라 소유 전체를 가리킬 수 있어, 과도하게 좁히지 않는 ‘소유’를 택했습니다.
theological_decisions:
- issue: 레위인에게 땅의 몫이 주어지지 않은 표현
  chosen_reading: 이스라엘 땅의 분배에서 레위인에게는 토지 상속 몫이 아니라 거주용 성읍과 부속지대만 주어진 것으로 옮겼습니다.
  alternative_readings:
  - 레위인들에게 몫을 주지 않았다
  - 레위인에게 땅을 주지 않았다
  rationale: 본문은 단순한 ‘무배분’이 아니라 토지 분배 구조 속에서 레위인의 예외적 몫을 말하므로, 성읍과 목초지를 함께 제시해 의미를 보존했습니다.
  doctrine_reference: 민수기 18:20-24; 여호수아 13:14
