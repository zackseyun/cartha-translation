  source_fidelity: 핵심 구조는 대체로 원문에 충실합니다. 다만 וּמִגְרְשֵׁיהֶם לְמִקְנֵיהֶם וּלְקִנְיָנָם은 ‘가축을 위한 목초지와 소유를 위한 것’이 아니라, 가축과 소유를 위한 성읍 부속 목초지(열린 땅)를 뜻합니다. 인과를 나타내는 כִּי도 한국어 본문에서 드러내는 편이 좋습니다.
  naturalness: 초안의 대시 뒤 ‘입니다’와 이어지는 과거 서술은 문체 연결이 매끄럽지 않습니다. 또한 ‘그들의 소유를 위한 것만’은 무엇을 가리키는지 불분명하고 한국어로도 부자연스럽습니다.
  terminology: ‘요셉의 자손’, ‘두 지파’, ‘므낫세’, ‘에브라임’, ‘레위 사람들’, ‘몫’, ‘성읍’, ‘목초지’는 현대 표준어 성경 문체에서 자연스럽고 원문의 지파·토지 분배 용어를 적절히 반영합니다. ‘소유’는 קִנְיָן의 넓은 뜻을 유지합니다.
