  source_fidelity: 히브리어의 수단 표현(‘제비로’), 야훼의 명령이 모세를 매개로 전달되었다는 뜻, 그리고 분배 대상인 아홉 지파와 반 지파를 충실히 반영했습니다. ‘한 반지파’는 원문의 단수형을 기계적으로 드러낸 표현으로 한국어에서는 부자연스럽고, 문맥상 통상적인 ‘반 지파’가 정확합니다.
  naturalness: ‘모세의 손을 통해’는 히브리어 관용구를 중첩하여 옮긴 표현이라 현대 표준 한국어로 다소 어색합니다. ‘모세를 통하여’가 매개·대리의 뜻을 자연스럽게 전달합니다. 또한 ‘…위한 것이었습니다’보다 문장 안에서 분배 대상 수식어를 연결하는 편이 명료합니다.
  terminology: ‘기업’은 이스라엘의 토지 분배 문맥에서 נַחֲלָה의 정착된 의미를 잘 전달하며 유지할 수 있습니다. יְהוָה는 프로젝트 방침과 원문에 따라 ‘야훼’로 유지합니다.
