  - 그들의 상속 몫
  lexicon: HALOT
  rationale: 토지 분배 문맥에서 נַחֲלָה는 단순 소유보다 약속된 분배 몫을 뜻하므로, 한국어 성경 전통과 소스 의미를 함께 살릴 수 있는 '기업'을 사용했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 직역에 가까운 관용구 '손'을 유지해 매개·중개라는 원뜻을 보존하고, 동시에 현대 한국어로 이해되도록 '통해'를 덧붙였습니다.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  english_pob_choice: for the nine tribes and the half-tribe
  chosen_korean: 아홉 지파와 한 반지파를 위한 것
  alternatives_korean:
  - 아홉 지파와 반 지파를 위한 것
  - 아홉 지파와 그 반 지파를 위한 것
  lexicon: HALOT
  rationale: 문맥상 분배 대상이므로 '을 위한'으로 자연스럽게 옮겼고, '한 반지파'는 히브리어의 수량 표현을 과도하게 해석하지 않으면서 반지파를 분명히 드러냅니다.
