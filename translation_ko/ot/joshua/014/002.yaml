translation:
  language: ko
  text: 그들의 기업은 제비로 정해졌습니다. 야훼께서 모세의 손을 통해 명하신 대로, 아홉 지파와 한 반지파를 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모세의 손으로'로도 옮길 수 있는데, 이는 중개나 대리 행위를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비로
  alternatives_korean:
  - 제비뽑기로
  - 제비로 나뉘어
  lexicon: HALOT
  rationale: 소스의 수단/방식을 자연스러운 현대 한국어로 옮기되, 분배 절차의 공적 성격을 살리기 위해 '제비로'를 택했습니다.
- source_word: נַחֲלָתָם
  english_pob_choice: their inheritance
  chosen_korean: 그들의 기업
  alternatives_korean:
