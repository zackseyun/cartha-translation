id: JOS.14.15
reference: Joshua 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֵׁ֨ם חֶבְר֤וֹן לְ/פָנִים֙ קִרְיַ֣ת אַרְבַּ֔ע הָ/אָדָ֧ם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: Now the former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
  footnotes:
  - marker: a
    text: Kiriath-arba likely means 'city of Arba.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the great man among the Anakim'; the Hebrew may denote Arba as the most prominent figure associated with the Anakim.
    reason: alternative_reading
  - marker: c
    text: Or 'the land was quiet from war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 전 이름은 기럇아르바[a]였습니다. 아르바는 아낙 사람들 가운데 가장 큰 사람이었습니다[b]. 그리고 그 땅은 전쟁에서 쉬었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기럇아르바’는 ‘아르바의 성읍’이라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아낙 사람들 가운데 그 큰 사람’으로도 옮길 수 있으며, 아르바를 아낙 사람들과 관련된 가장 두드러진 인물로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁם / לְפָנִים
  english_pob_choice: Now the former name
  chosen_korean: 그 전 이름은
  alternatives_korean:
  - 이전 이름은
  - 옛 이름은
  lexicon: HALOT
  rationale: לְפָנִים은 문맥상 ‘이전의, 전의’라는 뜻이므로, 문장 흐름을 살리면서도 간결하게 ‘그 전’으로 옮겼습니다.
- source_word: קִרְיַת אַרְבַּע
  english_pob_choice: Kiriath-arba
  chosen_korean: 기럇아르바
  alternatives_korean:
  - 기랏아르바
  - 기럇-아르바
  lexicon: HALOT
  rationale: 고유지명은 음역하되, 히브리어 합성 지명임을 반영해 붙여 썼습니다. 본문 주석으로 의미 가능성을 처리할 수 있습니다.
- source_word: הָאָדָם הַגָּדוֹל
  english_pob_choice: the greatest man
  chosen_korean: 가장 큰 사람이
  alternatives_korean:
  - 가장 위대한 사람이
  - 가장 두드러진 사람이
  lexicon: HALOT
  rationale: אָדָם은 여기서 특정 남성을 가리키므로 ‘사람’으로 옮겼고, הַגָּדוֹל은 서열적·규모적 우위가 함께 느껴지는 ‘가장 큰’으로 처리했습니다.
- source_word: בָּעֲנָקִים
  english_pob_choice: among the Anakim
  chosen_korean: 아낙 사람들 가운데
  alternatives_korean:
  - 아낙 자손들 가운데
  - 아낙 사람들 중
  lexicon: HALOT
  rationale: עֲנָקִים은 민족명으로, 한국어 독자가 곧바로 알아보도록 ‘아낙 사람들’로 옮겼습니다. ‘가운데’는 비교 대상 범위를 자연스럽게 드러냅니다.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  english_pob_choice: had rest from war
  chosen_korean: 전쟁에서 쉬었습니다
  alternatives_korean:
  - 전쟁이 그쳤습니다
  - 전쟁으로부터 평안했습니다
  lexicon: HALOT
  rationale: שָׁקַט의 ‘쉬다/고요하다’ 의미를 살리면서, युद्ध의 중단을 직접적으로 드러내기 위해 ‘전쟁에서 쉬었습니다’로 번역했습니다.
theological_decisions:
- issue: ‘하나님이 주신 땅’이라는 해석을 본문에 암시할지 여부
  chosen_reading: 본문의 사실 진술에 집중해, ‘그 땅은 전쟁에서 쉬었습니다’로 간결하게 옮겼습니다.
  alternative_readings:
  - 그 땅에 전쟁이 그쳤습니다
  - 그 땅이 전쟁으로부터 평안해졌습니다
  rationale: 히브리어는 여기서 신학적 해설보다 상태 변화의 서술을 말하므로, 원문의 절제된 표현을 유지했습니다.
  doctrine_reference: 서술문 맥락 보존
