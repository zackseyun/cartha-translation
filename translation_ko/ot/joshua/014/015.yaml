  source_fidelity: 히브리어는 ‘헤브론의 이전 이름’을 명시하며, 아르바를 아낙 사람들 가운데 탁월한 인물로 서술하고, 땅이 전쟁으로 말미암은 소요에서 평온해졌다고 말합니다. 초안의 ‘그 전 이름’은 헤브론을 명시하지 않아 지시 대상이 불분명하고, ‘가장 큰 사람’은 한국어에서 신체적 크기를 우선 연상시켜 הַגָּדוֹל의 문맥상 의미를 충분히 전달하지 못합니다. ‘전쟁에서 쉬었습니다’도 땅을 주어로 하는 한국어 표현으로는 부자연스럽습니다.
