  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
  footnotes:
  - marker: a
    text: Or 'and I brought him back word according to what was in my heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 종 모세가 나를 가데스 바네아에서 보내어 그 땅을 정탐하게 하였을 때, 저는 마흔 살이었습니다. 저는 제 마음에 있던 대로 그에게 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 마음속 생각대로 그에게 보고했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה
  english_pob_choice: forty years old
  chosen_korean: 마흔 살
  alternatives_korean:
  - 마흔 해였다
  - 마흔 살이었다
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 한국어의 자연스러운 나이 표현으로 옮겼습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 하인
  lexicon: HALOT
  rationale: 모세에게 붙는 경칭적 표현이므로 기본값인 ‘종’을 쓰되, 신명기적 언약 호칭을 살렸습니다.
- source_word: לְרַגֵּל
  english_pob_choice: to spy out
  chosen_korean: 정탐하게
  alternatives_korean:
  - 살펴보게
  - 탐지하게
  lexicon: HALOT
  rationale: 정찰·탐사보다 문맥상 더 정확한 ‘정탐’이 원문의 조사 목적을 잘 드러냅니다.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  english_pob_choice: I brought him back word
  chosen_korean: 그에게 보고를 올렸습니다
  alternatives_korean:
  - 그에게 말을 돌려주었습니다
  - 그에게 말을 전했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘말/소식’을 돌려주는 뜻이지만, 한국어에서는 ‘보고를 올리다’가 문맥상 가장 자연스럽고 의미를 보존합니다.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  english_pob_choice: according to my heart
  chosen_korean: 내 마음에 있는 그대로
  alternatives_korean:
  - 내 마음대로
  - 내 마음속 생각대로
  - 내 마음과 같이
  lexicon: HALOT
  rationale: ‘마음’의 내적 판단과 진술의 일치를 살리되, 한국어에서 오해될 수 있는 ‘마음대로’를 피했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신적 이름을 음역하여 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 모세의 역할 호칭
  chosen_reading: 야훼의 종 모세
  alternative_readings:
  - 야훼의 노예 모세
  - 야훼를 섬기는 모세
  rationale: 원문의 경칭적·언약적 호칭을 유지해야 하므로 ‘종’을 사용했습니다.
  doctrine_reference: 'POB glossary: עבד'
- issue: 보고 동사의 존대
  chosen_reading: 그에게 보고를 올렸습니다
  alternative_readings:
  - 그에게 보고했습니다
  - 그에게 전했습니다
  rationale: 본문의 화자가 모세를 상대로 자신을 서술하는 문맥이므로, 한국어에서는 격식 있는 ‘올리다’가 자연스럽지만 과도한 신학적 의미는 부여하지 않았습니다.
  doctrine_reference: Korean register policy
