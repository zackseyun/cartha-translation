  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''if not,'' used here as an emphatic oath formula, hence ''Surely.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and for your descendants.' The Hebrew reads 'your sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그날 이렇게 맹세했습니다. 「정녕 네 발이 밟은 그 땅은 너와 네 아들들에게 영원히 기업이 될 것이다. 이는 네가 야훼 나의 하나님을 온전히 따랐기 때문이다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘만일/만약 아니면’이 맹세문에서 강한 단언으로 쓰입니다. 여기서는 ‘정녕’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네 아들들’을 말합니다. 문맥상 후손을 가리킬 수 있으나, 여기서는 본문의 성별 표지를 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세했습니다
  alternatives_korean:
  - 맹세하셨습니다
  - 서약했습니다
  lexicon: HALOT
  rationale: 히브리어 שׁבע의 맹세 행위를 자연스러운 현대 한국어로 옮기되, 서술체의 엄숙함을 살리기 위해 ‘맹세했습니다’를 선택했습니다.
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 정녕
  alternatives_korean:
  - 참으로
  - 확실히
  lexicon: HALOT
  rationale: 맹세 공식에서의 강한 확언을 한국어 부사로 압축해, 조건문이 아니라 단언이라는 점을 살렸습니다.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  english_pob_choice: the land on which your foot has trodden
  chosen_korean: 네 발이 밟은 그 땅
  alternatives_korean:
  - 네 발이 밟고 지나간 그 땅
  - 네가 발을 디딘 그 땅
  lexicon: HALOT
  rationale: 발로 밟는 구체적 이미지를 유지하되 한국어에서 가장 자연스럽고 간결한 표현으로 옮겼습니다.
- source_word: וּלְבָנֶיךָ
  english_pob_choice: and for your sons
  chosen_korean: 너와 네 아들들에게
  alternatives_korean:
  - 너와 네 자손들에게
  - 너와 네 자녀들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 ‘sons’를 그대로 반영해, 성별을 중화하지 않고 가족-상속 문맥을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신적 고유명사를 관습적 대체어가 아니라 음역형 ‘야훼’로 옮겨, 소스의 직접성을 유지했습니다.
theological_decisions:
- issue: 맹세 공식 אִם לֹא의 강한 확언 처리
  chosen_reading: ‘정녕’으로 옮겨 조건문이 아니라 단언적 서약의 힘을 드러냈습니다.
  alternative_readings:
  - ‘만일 그렇지 않다면’
  - ‘참으로’
  rationale: 이 표현은 문자적 조건이 아니라 맹세 문맥의 관용구이므로, 한국어에서도 서약의 확정성을 드러내는 표현이 필요합니다.
  doctrine_reference: 문맥상 서약의 수사법 처리
- issue: יהוה의 번역
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 히브리어 본문의 신적 고유명을 보존하여, 칭호로 대체하지 않고 언약적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
