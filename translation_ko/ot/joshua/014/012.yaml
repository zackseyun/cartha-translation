revisions:
- from: 이제 이 산지를 제게 주십시오. 그날 야훼께서 말씀하신 그곳입니다. 당신도 그날에 거기에 아낙 사람들이 있고, 크고 견고한 성읍들이 있다는 것을 들으셨습니다. 야훼께서 나와 함께하시면, 저는 그들을 쫓아내겠습니다. 야훼께서 말씀하신 대로입니다.[a][b]
  to: 이제 그날 야훼께서 말씀하신 이 산지를 제게 주십시오.[a] 당신도 그날에 아낙 사람들이 그곳에 있고 크고 견고한 성읍들이 있다는 것을 들으셨습니다. 아마도 야훼께서 나와 함께 계실 것입니다.[b] 그러면 야훼께서 말씀하신 대로 제가 그들을 쫓아내겠습니다.
  rationale: 관계절을 ‘이 산지’에 직접 연결하여 히브리어 문장 구조를 회복했습니다. 또한 ‘아마도’를 복원하여 야훼의 임재에 관한 겸손한 기대와 원문의 긴장을 보존했습니다. 마지막 절은 ‘야훼께서 말씀하신 대로’가 쫓아냄의 결과를 수식하도록 배치했습니다.
