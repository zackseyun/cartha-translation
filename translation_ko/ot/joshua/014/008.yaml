  lexicon: 온전히 따르다
  rationale: אַחֲרֵי יהוה를 POB의 관용에 맞게 ‘온전히 따르다’로 살리고, יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
