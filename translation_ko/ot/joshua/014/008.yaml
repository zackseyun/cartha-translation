  chosen_korean: 백성의 마음을 녹게 했지만
  alternatives_korean:
  - 백성의 마음을 녹였습니다
  - 백성의 마음을 녹아내리게 했지만
  - 백성의 마음을 무너뜨렸지만
  lexicon: 마음을 녹다
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스러운 동사구로 옮겨, 두려움과 낙담의 효과를 유지했습니다.
- source_word: וְאָנֹכִי מִלֵּאתִי אַחֲרֵי יְהוָה אֱלֹהָי / while I wholly followed the LORD my God
  english_pob_choice: while I wholly followed the LORD my God
  chosen_korean: 나는 내 하나님 야훼를 온전히 따랐습니다
  alternatives_korean:
