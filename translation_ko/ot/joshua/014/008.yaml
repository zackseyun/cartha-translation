  - 나와 함께 올라갔던 사람들
  lexicon: 올라가다
  rationale: ‘올라가다’는 가나안 정탐의 이동을 지리적으로 자연스럽게 드러내며, 과거 완료 뉘앙스는 ‘-았던’으로 반영했습니다.
