  lexicon: 형제
  rationale: 히브리어 אַחַי는 혈연적 ‘형제들’이 기본값이므로, 문맥상 동행한 정탐꾼들을 가리키더라도 이를 그대로 살렸습니다.
- source_word: אֲשֶׁר עָלוּ עִמִּי / who went up with me
