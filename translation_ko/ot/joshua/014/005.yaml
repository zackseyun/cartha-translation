source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a standard corporate expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 모세에게 명령하신 그대로 이스라엘 자손은[a] 행했고, 그 땅을 나누었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’입니다. 히브리어는 ‘이스라엘의 아들들’이라고 되어 있으며, 이는 이스라엘 백성을 가리키는 표준적인 집합 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: Just as
  chosen_korean: …하신 대로
  alternatives_korean:
  - …한 것처럼
  - …하는 대로
  lexicon: HALOT
  rationale: 비교·대응 관계를 자연스럽게 살리면서도 결과 절을 매끄럽게 이어 주는 현대 한국어 표현입니다.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: Yahweh had commanded Moses
  chosen_korean: 여호와께서 모세에게 명령하신
  alternatives_korean:
  - 야훼께서 모세에게 명령하신
  - 주께서 모세에게 명령하신
  lexicon: HALOT
  rationale: 동사 צִוָּה는 단순한 ‘말하다’가 아니라 권위를 가진 명령을 뜻하므로 ‘명령하신’이 적절합니다. 본문은 יְהוָה를 한국어 교회 관용 대신 ‘여호와’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 집합 표현을 보존하되, 한국어에서 가장 자연스럽고 공인된 성경적 표현으로 옮겼습니다.
- source_word: וַיַּחְלְקוּ אֶת הָאָרֶץ
  english_pob_choice: they divided the land
  chosen_korean: 그 땅을 나누었습니다
  alternatives_korean:
  - 그 땅을 분배했습니다
  - 그 땅을 나누어 가졌습니다
  lexicon: HALOT
  rationale: וַיַּחְלְקוּ는 단순히 ‘분할하다’가 아니라 기업을 나누어 배분하는 문맥이므로, 본문의 간결함을 살리면서도 ‘나누었습니다’로 충분히 전달합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה를 하나님의 고유명으로 드러내기 위해 ‘여호와’를 채택했습니다. 본문은 직접 인용이 아니라 서술문이므로 별도의 주석 없이 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 남성 복수 집합 표현 보존
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 히브리어의 성별 표지를 지우지 않고 집합적 의미를 유지하기 위해 원문 구조를 살렸습니다. 문맥상 전체 공동체를 가리키므로 한국어에서도 집합명사로 자연스럽게 읽힙니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
