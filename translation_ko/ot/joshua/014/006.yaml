  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
  footnotes:
  - marker: a
    text: Or 'the matter' or 'the thing' that the LORD spoke to Moses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다 자손이 길갈에서 여호수아에게 나아왔습니다. 그나스 사람 여분네의 아들 갈렙이 여호수아에게 말했습니다. “당신은 야훼께서 하나님의 사람 모세에게 가데스바네아에서 나와 당신에 관하여 말씀하신 그 말씀[a]을 알고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일’ 또는 ‘그 사안’.
    reason: 히브리어 דָּבָר는 이 문맥에서 야훼의 발화를 가리켜 ‘말씀’으로 옮겼으나, ‘일/사안’의 의미도 가능합니다.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  english_pob_choice: came near
  chosen_korean: 나아왔고
  alternatives_korean:
  - 다가왔고
  - 가까이 왔고
  lexicon: HALOT
  rationale: נגשׁ의 핵심 의미인 ‘다가오다/가까이 오다’를 살리면서, 서술 흐름에 자연스러운 합쇼체 연결형으로 옮겼습니다.
- source_word: בְנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다 자손
  alternatives_korean:
  - 유다의 아들들
  - 유다 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하되 한국어 성경에서 익숙한 부족/계보 표현으로 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유 신명(יהוה)을 제목어로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’로 일관되게 옮겼습니다.
- source_word: הַדָּבָר אֲשֶׁר דִּבֶּר
  english_pob_choice: the word that Yahweh spoke
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 일
  - 그 일러주신 말씀
  lexicon: HALOT
  rationale: 여기서 דבר는 단순한 ‘사물/일’보다 야훼의 발화 자체를 가리키므로, ‘말씀’이 의미를 가장 정확히 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 야훼의 직접 발화를 전하는 문맥이므로, 신명 대체어가 아닌 고유명 자체를 드러내는 번역이 문맥상 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּנֵי יְהוּדָה의 성별-정확성
  chosen_reading: 유다 자손
  alternative_readings:
  - 유다 사람들
  - 유다의 남자들
  rationale: 히브리어는 부족 계보를 나타내는 남성 복수 표현이므로, 성중립화보다 족속 표지를 살리는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
