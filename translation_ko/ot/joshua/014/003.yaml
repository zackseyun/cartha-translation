id: JOS.14.3
reference: Joshua 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
  footnotes:
  - marker: a
    text: Or 'on the other side of the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 모세가 요단 건너편의 두 지파와 반 지파에게 기업을 주었으나, 레위인들에게는 그들 가운데 기업을 주지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단 저편’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 이 문맥에서 כִּי는 앞선 내용을 설명하는 접속사이므로, 자연스러운 현대 한국어 인과 표현으로 옮겼습니다.
- source_word: נָתַן
  english_pob_choice: had given / gave
  chosen_korean: 주었으나
  alternatives_korean:
  - 주셨으나
  - 주었지만
  lexicon: HALOT
  rationale: 이 절은 이미 이루어진 분배를 회상하는 흐름이어서 과거 시제로 처리했고, 뒤 절과의 대비를 살리기 위해 대조 연결을 택했습니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 기업을
  alternatives_korean:
  - 유업을
  - 상속 몫을
  lexicon: HALOT
  rationale: 토지 분배 맥락에서 נַחֲלָה는 단순한 재산보다 ‘기업’이 더 적절하며, 본문의 언약적·분배적 의미를 유지합니다.
- source_word: שְׁנֵי הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  english_pob_choice: the two tribes and the half-tribe
  chosen_korean: 두 지파와 반 지파
  alternatives_korean:
  - 두 지파와 그 절반 지파
  - 두 부족과 반 부족
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 ‘지파’의 의미이므로, 분배 단위로 통용되는 한국어 표현을 사용했습니다.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 건너편
  alternatives_korean:
  - 요단을 건너편
  - 요단 저쪽
  lexicon: HALOT
  rationale: 영어 POB의 공간적 관점을 따르되, 한국어에서 가장 자연스러운 지리 관용구로 옮겼습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 중에
  - 그들 안에서
  lexicon: HALOT
  rationale: 레위인이 다른 지파들 안에서 토지 기업을 받지 못했다는 뜻을 분명히 하면서, 공동체 내부의 부재를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 레위 지파의 ‘기업 없음’의 범위
  chosen_reading: 이 절은 레위인에게 다른 지파들과 같은 토지 기업이 주어지지 않았다는 뜻으로 이해했습니다.
  alternative_readings:
  - 레위인이 아무런 몫도 받지 못했다는 절대적 표현
  rationale: 여기서의 부정은 토지 분배의 부재를 가리키며, 레위의 특별한 몫에 대한 다른 본문들과 충돌하지 않도록 문맥 범위를 유지했습니다.
  doctrine_reference: 민수기 18:20; 신명기 10:9
