id: JOS.14.1
reference: Joshua 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: Now these are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Hebrew literally uses the familial expression 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'which Eleazar the priest, Joshua son of Nun, and the heads of the ancestral houses of the tribes gave them as an inheritance.' The Hebrew repeats the inheritance root in both clauses.
    reason: lexical_alternative
  - marker: c
    text: '''Fathers’ houses'' refers to ancestral family groupings within the tribes.'
    reason: cultural_note
translation:
  language: ko
  text: 이것들은 이스라엘 자손이 가나안 땅에서 받은 기업입니다. 제사장 엘르아살과 눈의 아들 여호수아와 이스라엘 자손의 지파들에 속한 조상 가문[1]의 우두머리들이 이 기업들을 이스라엘 자손에게 분배하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: ‘조상 가문’은 각 지파 안에 속한 친족·가계 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Now these are
  chosen_korean: 이것들은
  alternatives_korean:
  - 그리고 이것들은
  - 이제 이것들은
  lexicon: HALOT
  rationale: 새 단락을 여는 지시 표현이므로 자연스러운 현대 한국어로는 주제 제시형 ‘이것들은’이 가장 간결하며, 영어 POB의 담화 전환 효과를 무리 없이 반영합니다.
- source_word: נָחֲלוּ / נִחֲלוּ
  english_pob_choice: received / apportioned
  chosen_korean: 받은 / 분배하였습니다
  alternatives_korean:
  - 기업으로 받은 / 기업으로 나누어 주었습니다
  - 상속받은 / 할당하였습니다
  lexicon: HALOT
  rationale: 본문의 핵심 반복어는 ‘기업’ 개념입니다. 첫 절반은 이스라엘이 ‘받은’ 것으로, 둘째 절반은 지도자들이 실제로 ‘분배한’ 것으로 옮겨 행정적 분배의 의미를 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 혈연적·언약적 표현을 살리면서도 현대 한국어에서 가장 널리 읽히는 표준 성경 용례를 따랐습니다.
- source_word: אֶרֶץ כְּנָעַן
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안 지역
  - 가나안에
  lexicon: HALOT
  rationale: 히브리어가 ‘땅’을 명시하므로, 단순 지명이 아니라 기업의 대상이 되는 영토임을 드러내기 위해 ‘땅’을 유지했습니다.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  english_pob_choice: the heads of the fathers’ houses of the tribes
  chosen_korean: 지파들의 조상 가문의 우두머리들
  alternatives_korean:
  - 지파들의 아버지 집들의 우두머리들
  - 조상 집단의 우두머리들
  lexicon: HALOT
  rationale: ‘heads’는 ‘우두머리들’로, ‘fathers’ houses’는 직역에 가깝게 ‘조상 가문’으로 옮겨 히브리 사회 구조를 보존했습니다. ‘tribes’와의 관계도 한국어 어순에서 자연스럽게 드러나도록 했습니다.
theological_decisions:
- issue: 킨십 기반의 언약 공동체를 나타내는 בני ישראל와 אבות의 표현 유지
  chosen_reading: ‘이스라엘 자손’, ‘조상 가문’으로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들, 가문들
  - 이스라엘 공동체, 족장 집안들
  rationale: 본문은 단순한 민족명보다 혈연·언약·상속 구조를 함께 드러냅니다. 한국어에서 더 익숙한 중립 표현으로 완화하기보다, 원문의 공동체 구조가 보이도록 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
