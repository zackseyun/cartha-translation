revisions:
- from: 이것들은 가나안 땅에서 이스라엘 자손이 받은 기업입니다. 그 기업들을 제사장 엘르아살과 눈의 아들 여호수아, 그리고 이스라엘 자손의 지파들의 조상 가문의 우두머리들이 그들에게 분배하였습니다.
  to: 이것들은 이스라엘 자손이 가나안 땅에서 받은 기업입니다. 제사장 엘르아살과 눈의 아들 여호수아와 이스라엘 자손의 지파들에 속한 조상 가문[1]의 우두머리들이 이 기업들을 이스라엘 자손에게 분배하였습니다.
  rationale: 수정은 지파, 조상 가문, 그 우두머리들의 관계를 한국어에서 명료하게 하였고, 둘째 절의 목적어가 이스라엘 자손임을 밝혔습니다. ‘기업’과 ‘분배’로 נחל 어근이 두 절에서 나타내는 수령과 공식적 배분의 의미를 유지했습니다.
  reviewer_model: gpt-5.6-terra
