base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
  footnotes:
  - marker: a
    text: Or 'and the cave that belongs to the Sidonians,' if מְעָרָה is taken as a common noun rather than a place-name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Canaanite' and 'the Amorite' use singular ethnic forms with collective force; English renders them as collectives.
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽에서부터[a] 가나안 족속의 온 땅과 시돈 사람들의 땅에 속한 메아라, 그리고 아벡까지, 곧 아모리 족속의 경계까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시돈 사람들에게 속한 동굴’로도 옮길 수 있습니다. 히브리어 מְעָרָה를 보통명사로 볼 경우의 대안입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  english_pob_choice: from the south
  chosen_korean: 남쪽에서부터
  alternatives_korean:
  - 남쪽에서
  - 남쪽으로부터
  - 테만에서
  lexicon: HALOT
  rationale: 지형·영토 범위를 가리키는 용법이므로 고유명사 ‘테만’보다 방향어 ‘남쪽’이 원문 의도를 더 직접적으로 드러냅니다.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  english_pob_choice: all the land of the Canaanites
  chosen_korean: 가나안 족속의 온 땅
  alternatives_korean:
  - 가나안 족속의 모든 땅
  - 가나안의 온 땅
  - 가나안 사람들의 온 땅
  lexicon: HALOT
  rationale: 히브리어의 민족 집합 표현을 살려 ‘가나안 족속’으로 옮기고, ‘온 땅’으로 범위의 총체성을 반영했습니다.
- source_word: וּמְעָרָה
  english_pob_choice: and Mearah
  chosen_korean: 메아라
  alternatives_korean:
  - 동굴
  - 메아라
  lexicon: HALOT
  rationale: 이 구절은 지명으로 읽는 것이 문맥상 자연스러우므로, 보통명사 ‘동굴’보다 음역을 택했습니다.
- source_word: לַצִּידֹנִים
  english_pob_choice: that belongs to the Sidonians
  chosen_korean: 시돈 사람들의 땅에 속한
  alternatives_korean:
  - 시돈 사람들에게 속한
  - 시돈 사람들의
  - 시돈 사람들의 소유인
  lexicon: HALOT
  rationale: ל의 소속·귀속 의미를 살리면서 한국어에서 자연스러운 소유 표현으로 옮겼습니다.
- source_word: עַד אֲפֵקָה
  english_pob_choice: as far as Aphek
  chosen_korean: 아벡까지
  alternatives_korean:
  - 아벡으로
  - 아벡에 이르기까지
  lexicon: HALOT
  rationale: עַד의 경계 도달 의미를 간결하게 살려 영토 설명의 흐름을 유지했습니다.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  english_pob_choice: to the border of the Amorites
  chosen_korean: 곧 아모리 족속의 경계까지입니다
  alternatives_korean:
  - 아모리 족속의 경계까지
  - 아모리 사람들의 경계까지
  - 아모리 족속의 국경까지
  lexicon: HALOT
  rationale: גְּבוּל은 이 문맥에서 ‘경계’가 가장 자연스럽고, 종결 표지로 ‘입니다’를 붙여 현대 문장으로 정리했습니다.
theological_decisions:
- issue: 민족 집합 명사의 번역
  chosen_reading: ‘가나안 족속’, ‘시돈 사람들’, ‘아모리 족속’처럼 집합적 민족 표현으로 옮겼습니다.
  alternative_readings:
  - 단수형처럼 ‘가나안 사람’, ‘시돈 사람’, ‘아모리 사람’으로 단순화
  - 지명 중심으로 ‘가나안 땅’, ‘시돈 땅’으로 바꿈
  rationale: 원문은 민족 집합 표현과 영토 경계를 함께 제시하므로, 민족성과 영토성을 함께 드러내는 번역이 가장 충실합니다.
  doctrine_reference: 역사 서술의 지리·민족 표지 보존
- issue: 메아라의 처리
  chosen_reading: 지명으로 보고 ‘메아라’로 음역했습니다.
  alternative_readings:
  - ‘동굴’로 보아 일반명사화
  - 주석 없이 지명과 일반명사를 병기
  rationale: 영역 목록의 연속성과 영어 POB의 판단을 따라, 과도한 해석을 피하고 지명 가능성을 유지했습니다.
  doctrine_reference: 본문의 지리적 명시성 보존
