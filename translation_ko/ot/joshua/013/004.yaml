  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
  footnotes:
  - marker: a
    text: Or 'and the cave that belongs to the Sidonians,' if מְעָרָה is taken as a common noun rather than a place-name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Canaanite' and 'the Amorite' use singular ethnic forms with collective force; English renders them as collectives.
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽에서부터 가나안 족속의 온 땅과 시돈 사람들에게 속한 메아라[a], 아벡까지, 아모리 족속의 경계까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시돈 사람들에게 속한 동굴’로 옮길 수 있습니다. 히브리어 מְעָרָה를 보통명사로 볼 경우의 대안입니다.
    reason: lexical_alternative
