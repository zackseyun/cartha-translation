  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/גִּלְעָ֞ד וּ/גְב֧וּל הַ/גְּשׁוּרִ֣י וְ/הַ/מַּעֲכָתִ֗י וְ/כֹ֨ל הַ֥ר חֶרְמ֛וֹן וְ/כָל הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
  footnotes:
  - marker: a
    text: Or "border of the Geshurite and the Maacathite." The Hebrew word can denote a boundary line or the territory belonging to a people; here the broader territorial sense best fits the list.
    reason: lexical_alternative
  - marker: b
    text: Hebrew "all Mount Hermon"; this may refer to the entire Hermon massif or hill country, not only the summit.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 길르앗[a], 그리고 그술 사람과 마아가 사람의 영토, 그리고 헤르몬 온 산[b], 그리고 바산 온 땅은 살르가까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그술 사람과 마아가 사람의 경계’. 히브리어는 경계선 자체나 어떤 ժողովուրդ에 속한 영토를 뜻할 수 있으며, 여기서는 앞뒤 목록상 넓은 영토 의미가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘헤르몬 온 산’입니다. 이는 산꼭대기만이 아니라 헤르몬 산괴 전체나 산지 전체를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  english_pob_choice: Gilead
  chosen_korean: 길르앗
  alternatives_korean:
  - 길르앗 땅
  - 길르앗 지역
  lexicon: HALOT
  rationale: 고유한 지명은 표준 음역으로 옮기고, 문맥상 별도의 설명 없이 지역명을 그대로 유지했습니다.
- source_word: גְב֧וּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  english_pob_choice: territory of the Geshurite and the Maacathite
  chosen_korean: 그술 사람과 마아가 사람의 영토
  alternatives_korean:
  - 그술 사람과 마아가 사람의 경계
  - 그술 족속과 마아가 족속의 땅
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 경계선보다 소유·관할 지역을 가리키므로, POB의 ‘territory’를 따라 ‘영토’로 옮겼습니다.
- source_word: כֹל הַר חֶרְמוֹן
  english_pob_choice: all Mount Hermon
  chosen_korean: 헤르몬 온 산
  alternatives_korean:
  - 헤르몬의 온 산
  - 헤르몬의 산 전체
  lexicon: HALOT
  rationale: הַר는 문자적으로 ‘산’이지만 이 구절에서는 헤르몬 산맥/산지 전체를 가리킬 수 있으므로, ‘온 산’으로 전체 범위를 살렸습니다.
- source_word: עַד סַלְכָה
  english_pob_choice: as far as Salecah
  chosen_korean: 살르가까지
  alternatives_korean:
  - 살르가에 이르기까지
  - 살르가까지 이르러
  lexicon: HALOT
  rationale: עַד의 종착 범위를 한국어의 ‘-까지’로 자연스럽게 반영했고, 지명은 통용되는 음역에 맞춰 옮겼습니다.
