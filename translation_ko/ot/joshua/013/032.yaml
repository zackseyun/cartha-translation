source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁר נִחַ֥ל מֹשֶׁ֖ה בְּ/עַֽרְב֣וֹת מוֹאָ֑ב מֵ/עֵ֛בֶר לְ/יַרְדֵּ֥ן יְרִיח֖וֹ מִזְרָֽחָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
  footnotes:
  - marker: a
    text: Or 'These are what Moses gave as an inheritance' or 'These are what Moses assigned as an inheritance.' The Hebrew verb emphasizes distribution of land as inherited possession.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan.' The Hebrew expression 'beyond the Jordan' is a standard geographical formula whose exact English wording can vary with perspective.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 모세가 모압 평야에서, 요단 강 건너편 여리고 동쪽에서 기업으로 분배한 것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업으로 주신’이나 ‘기업으로 지정하신’. 히브리어 동사는 토지를 상속 재산으로 분배하는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단 강 저편’. 히브리어 표현은 관점에 따라 ‘요단 강 건너편’으로도 옮길 수 있는 표준 지리 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  english_pob_choice: These are what
  chosen_korean: 이것들은
  alternatives_korean:
  - 이것들은 곧
  - 이것들은 …한 것들입니다
  lexicon: HALOT
  rationale: 도입부의 지시문+관계절을 한국어에서는 자연스럽게 ‘이것들은’으로 묶어, 요약 선언의 기능을 살렸습니다.
- source_word: נִחַל
  english_pob_choice: apportioned as an inheritance
  chosen_korean: 기업으로 분배한
  alternatives_korean:
  - 기업으로 나누어 준
  - 기업으로 상속시킨
  - 기업으로 배분한
  lexicon: HALOT
  rationale: 히브리어 נחל의 토지-상속 분배 의미를 살리되, 현대 한국어에서 자연스러운 ‘기업으로 분배한’으로 옮겼습니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압 평야에서
  alternatives_korean:
  - 모압 광야 평원에서
  - 모압의 평지에서
  lexicon: HALOT
  rationale: עֲרָבוֹת는 지리적 ‘평야/평지’로 이해하는 것이 가장 무난하여 ‘모압 평야’로 간결하게 처리했습니다.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 강 건너편
  alternatives_korean:
  - 요단 강 저편
  - 요단을 건너 건너편
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어 관용에 맞게 ‘건너편’으로 옮겨, 위치 관계를 분명히 했습니다.
- source_word: מִזְרָחָה
  english_pob_choice: east of
  chosen_korean: 여리고 동쪽에서
  alternatives_korean:
  - 여리고의 동쪽에서
  - 여리고 동편에서
  lexicon: HALOT
  rationale: 방향 부사는 문맥상 여리고를 기준으로 한 위치 설명이므로 ‘여리고 동쪽에서’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: נִחַל의 법적-언약적 뉘앙스
  chosen_reading: 단순한 ‘주다’보다 ‘기업으로 분배하다’로 옮겨, 약속의 땅을 언약적 상속으로 받는 의미를 유지했습니다.
  alternative_readings:
  - 주셨습니다
  - 상속 재산으로 주셨습니다
  rationale: 여호수아 13장의 문맥은 토지 분배와 기업의 개념이 핵심이므로, 상속-분배의 성격을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 언약, 기업, 약속의 땅
- issue: 지리적 기준점 표현
  chosen_reading: ‘요단 강 건너편’으로 옮겨 관점의 여지를 남기되, ‘여리고 동쪽’으로 방향을 보완했습니다.
  alternative_readings:
  - 요단 강 저편
  - 요단 강 반대편
  rationale: 히브리어의 관용적 지리 표현은 관점이 문맥에 따라 달라질 수 있으므로, 본문이 제공하는 추가 표지(여리고 동쪽)를 함께 반영했습니다.
  doctrine_reference: 성경 지리, 본문 문맥
