theological_decisions:
- issue: נִחַל의 법적-언약적 뉘앙스
  chosen_reading: 단순한 ‘주다’보다 ‘기업으로 분배하다’로 옮겨, 약속의 땅을 언약적 상속으로 받는 의미를 유지했습니다.
  alternative_readings:
  - 주셨습니다
  - 상속 재산으로 주셨습니다
  rationale: 여호수아 13장의 문맥은 토지 분배와 기업의 개념이 핵심이므로, 상속-분배의 성격을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 언약, 기업, 약속의 땅
- issue: 지리적 기준점 표현
  chosen_reading: ‘요단 강 건너편’으로 옮겨 관점의 여지를 남기되, ‘여리고 동쪽’으로 방향을 보완했습니다.
  alternative_readings:
  - 요단 강 저편
  - 요단 강 반대편
  rationale: 히브리어의 관용적 지리 표현은 관점이 문맥에 따라 달라질 수 있으므로, 본문이 제공하는 추가 표지(여리고 동쪽)를 함께 반영했습니다.
  doctrine_reference: 성경 지리, 본문 문맥
