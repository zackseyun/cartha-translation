base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
  footnotes:
  - marker: a
    text: Or 'These are what Moses gave as an inheritance' or 'These are what Moses assigned as an inheritance.' The Hebrew verb emphasizes distribution of land as inherited possession.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan.' The Hebrew expression 'beyond the Jordan' is a standard geographical formula whose exact English wording can vary with perspective.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 모세가 여리고 동쪽, 요단강 건너편 모압 평야에서 기업으로 분배한[a] 것들입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업으로 주신’이나 ‘기업으로 지정하신’. 히브리어 동사는 토지를 상속 재산으로 분배하는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단강 저편’. 히브리어 표현은 관점에 따라 ‘요단강 건너편’으로도 옮길 수 있는 표준 지리 관용구입니다.
    reason: lexical_alternative
