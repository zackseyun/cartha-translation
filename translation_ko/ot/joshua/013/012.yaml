source:
  edition: WLC
  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
  footnotes:
  - marker: a
    text: Or 'the giants.' Hebrew 'the Rephaim,' likely the name of an ancient people group.
    reason: lexical_alternative
translation:
  language: ko
  text: 바산에 있던 옥의 온 왕국, 곧 아스다롯과 에드레이에서 다스리던 그 왕국은 르바임의 남은 자 가운데서 남겨진 것이었습니다. 모세가 그들을 쳐서 몰아냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거인들’. 히브리어 ‘르바임’은 아마도 고대 민족 집단의 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכ֥וּת
  english_pob_choice: all the kingdom
  chosen_korean: 온 왕국
  alternatives_korean:
  - 모든 왕국
  - 왕국 전체
  lexicon: HALOT
  rationale: 단수 명사 מַמְלָכוּת에 כָּל이 붙은 표현이라, 여러 왕국이 아니라 옥의 지배권 전체를 가리키는 뜻으로 ‘온 왕국’이 가장 자연스럽습니다.
- source_word: בַּ/בָּשָׁן
  english_pob_choice: in Bashan
  chosen_korean: 바산에
  alternatives_korean:
  - 바산 가운데
  - 바산 안에
  lexicon: HALOT
  rationale: 전치사 ב의 기본적인 장소 의미를 살려 지명 앞에 ‘-에’를 붙였습니다.
- source_word: הָרְפָאִים
  english_pob_choice: the Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 레파임
  lexicon: HALOT
  rationale: 해석어인 ‘거인들’ 대신 집단명으로 보존해, 본문이 지칭하는 고대 민족/집단의 이름을 그대로 드러냈습니다.
- source_word: וַ/יַּכֵּ֥/ם
  english_pob_choice: Moses struck them down
  chosen_korean: 모세가 그들을 쳐서
  alternatives_korean:
  - 모세가 그들을 무찔러
  - 모세가 그들을 쳐부수어
  lexicon: HALOT
  rationale: נכה의 군사적 강타/타격 의미를 살리되, 한국어에서 자연스러운 전쟁 서술로 ‘쳐서’라고 옮겼습니다.
- source_word: וַ/יֹּרִשֵֽׁ/ם
  english_pob_choice: and dispossessed them
  chosen_korean: 몰아냈습니다
  alternatives_korean:
  - 그들의 소유를 빼앗았습니다
  - 그들을 쫓아내어 차지했습니다
  lexicon: HALOT
  rationale: ירש의 핵심은 상대를 그 땅/소유에서 내쫓아 차지하는 것이므로, 점유 상실을 분명히 하는 ‘몰아냈습니다’가 가장 간결합니다.
theological_decisions:
- issue: ‘르바임’의 의미를 해석어로 풀지 여부
  chosen_reading: 고유 집단명 ‘르바임’을 유지합니다.
  alternative_readings:
  - ‘거인들’로 풀이합니다.
  - ‘레파임’으로 음역합니다.
  rationale: 본문은 민족/집단명으로 르바임을 제시하므로, 그 정체를 설명하는 해석을 본문에 흡수하지 않고 이름 자체를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
