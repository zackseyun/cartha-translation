  source_fidelity: 현 초안은 ‘아스다롯과 에드레이에서 다스리던’의 주어와 ‘르바임의 남은 자’의 지시 대상을 ‘옥’이 아닌 ‘왕국’으로 처리하여 히브리어의 인칭 지시를 바꿉니다. 또한 וַיֹּרִשֵׁם은 단순한 축출보다 점유를 빼앗는 뜻을 포함하므로 이를 반영했습니다.
  naturalness: 수정문은 한국어의 합쇼체 문장으로 자연스럽게 옥을 명시하고, 본문의 병렬적 서술을 유지합니다.
  terminology: 고유 집단명 ‘르바임’을 유지하고, ‘거인들’이라는 해석적 대안은 각주에만 둡니다. 지명은 아스다롯, 에드레이로 유지합니다.
