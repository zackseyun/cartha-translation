- from: 바산에 있던 옥의 온 왕국, 곧 아스다롯과 에드레이에서 다스리던 그 왕국은 르바임의 남은 자 가운데서 남겨진 것이었습니다. 모세가 그들을 쳐서 몰아냈습니다.[a]
  to: 바산에 있던 옥의 온 왕국, 곧 아스다롯과 에드레이에서 다스리던 옥의 왕국이었습니다. 옥은 르바임[a] 가운데 남아 있던 자였습니다. 모세는 그들을 쳐서 그들의 땅을 빼앗았습니다.
  rationale: 옥이 다스렸고 르바임 가운데 남아 있던 자였다는 히브리어의 인칭 지시를 복원했습니다. 마지막 동사는 정복 문맥에서의 ירשׁ 히필, 곧 점유를 빼앗는 의미를 드러내도록 옮겼습니다. 르바임은 본문에서 음역으로 보존하고 각주를 해당 단어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:04Z'
