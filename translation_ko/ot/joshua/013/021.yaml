  lexicon: HALOT
  rationale: 히브리어가 두 개의 서로 다른 직함을 쓰므로, 앞은 일반적인 ‘우두머리들’로, 뒤는 더 제도적인 ‘방백들’로 구별해 본문의 차이를 드러냈습니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
