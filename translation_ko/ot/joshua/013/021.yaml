base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
  footnotes:
  - marker: a
    text: Or 'the cities of the plain' or 'the towns of the tableland.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'struck'; in this military context, 'struck down' means defeated decisively.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew uses two different rank terms: ''chiefs of Midian'' (נְשִׂיאֵי) and ''princes of Sihon'' (נְסִיכֵי).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 평야의 성읍들, 곧 헤스본에서 통치하던 아모리 족속의 왕 시혼의 온 나라와, 모세가 쳐서 쓰러뜨린 그와 미디안의 우두머리들 — 에위, 레겜, 수르, 후르, 레바, 곧 시혼의 방백들 — 이 그 땅에 살았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평야’는 여기서 히브리어 מִישׁוֹר의 지형적 의미를 옮긴 것으로, ‘평원’이나 ‘고원 평지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נכה는 이 군사 문맥에서 단순히 ‘치다’가 아니라 ‘쳐서 결정적으로 패배시키다/쓰러뜨리다’의 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘미디안의 우두머리들’(נְשִׂיאֵי)과 ‘시혼의 방백들’(נְסִיכֵי)로 서로 다른 직함을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  english_pob_choice: the cities of the plateau
  chosen_korean: 평야의 성읍들
  alternatives_korean:
  - 평원의 성읍들
  - 고원 평지의 성읍들
  - 평탄지의 성읍들
  lexicon: HALOT
  rationale: מִישׁוֹר는 지형적으로 평탄한 들판/평야를 가리키므로, 한국어로는 읽기 자연스러운 ‘평야’가 가장 직접적입니다.
- source_word: הִכָּה מֹשֶׁה אֹתוֹ
  english_pob_choice: whom Moses struck down—him
  chosen_korean: 모세가 쳐서 쓰러뜨린 그
  alternatives_korean:
  - 모세가 쳐서 무찌른 그
  - 모세가 쳐서 이긴 그
  - 모세가 쳐서 죽인 그
  lexicon: HALOT
  rationale: 전쟁 문맥의 נכה는 단순한 ‘치다’보다 결정적 패배를 뜻하므로, ‘쳐서 쓰러뜨리다’로 번역해 강한 군사적 의미를 살렸습니다.
- source_word: נְשִׂיאֵי מִדְיָן / נְסִיכֵי סִיחוֹן
  english_pob_choice: the chiefs of Midian ... the princes of Sihon
  chosen_korean: 미디안의 우두머리들 … 시혼의 방백들
  alternatives_korean:
  - 미디안의 지도자들 … 시혼의 방백들
  - 미디안의 족장들 … 시혼의 왕자들
  - 미디안의 귀족들 … 시혼의 방백들
  lexicon: HALOT
  rationale: 히브리어가 두 개의 서로 다른 직함을 쓰므로, 앞은 일반적인 ‘우두머리들’로, 뒤는 더 제도적인 ‘방백들’로 구별해 본문의 차이를 드러냈습니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: who lived in the land
  chosen_korean: 그 땅에 살았습니다
  alternatives_korean:
  - 그 땅에 거주했습니다
  - 그 땅에 머물렀습니다
  - 그 땅에 살고 있었습니다
  lexicon: HALOT
  rationale: 분사형의 지속적 거주 의미를 자연스러운 현대 한국어로 풀어 ‘살다’로 옮겼습니다.
