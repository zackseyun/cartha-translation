base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
  footnotes:
  - marker: a
    text: Or 'the cities of the plain' or 'the towns of the tableland.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'struck'; in this military context, 'struck down' means defeated decisively.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew uses two different rank terms: ''chiefs of Midian'' (נְשִׂיאֵי) and ''princes of Sihon'' (נְסִיכֵי).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 고원 지대[a]의 모든 성읍과, 헤스본에서 다스리던 아모리 사람들의 왕 시혼의 온 나라, 곧 모세가 그와 미디안의 우두머리들—에위, 레겜, 수르, 후르, 레바—을 쳐서 무찌른[b] 나라였습니다. 이들은 그 땅에 거주하던 시혼의 방백들이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고원 지대’는 히브리어 מִישׁוֹר의 지형적 의미를 옮긴 것으로, ‘평원’ 또는 ‘평탄한 고원 지대’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נכה는 이 군사 문맥에서 단순히 ‘치다’가 아니라 ‘쳐서 결정적으로 패배시키다’ 또는 ‘무찌르다’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘미디안의 우두머리들’(נְשִׂיאֵי)과 ‘시혼의 방백들’(נְסִיכֵי)로 서로 다른 직함을 사용합니다. 다섯 이름은 미디안의 우두머리들이며, 동시에 시혼의 방백들로 설명됩니다.
    reason: lexical_alternative
