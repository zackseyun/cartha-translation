  source_fidelity: 히브리어의 요약 공식, ‘갓의 자손’, 종족별 분배, 그리고 성읍과 그에 딸린 촌락이라는 구성은 대체로 반영되어 있습니다. 다만 초안의 ‘갓의 자손들의 그들의’은 소유·지시 표현이 중복되어 문법적으로 부자연스럽고, חַצְרֵיהֶם의 성읍 연관성을 더 분명히 할 수 있습니다.
