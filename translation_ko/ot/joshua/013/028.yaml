translation:
  language: ko
  text: 이것은 갓 자손이 그들의 종족에 따라 받은 기업, 곧 성읍들과 그에 딸린 마을들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것은 갓 자손이 그들의 종족에 따라 받은 기업, 곧 성읍들과 그에 딸린 마을들이었습니다.” 히브리어의 이 요약 공식은 한국어에서 현재 또는 과거의 서술로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This was
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  lexicon: HALOT
  rationale: 앞 문맥의 분배를 가리키는 여성 단수 지시어로, 한국어에서는 자연스러운 요약문 형태의 ‘이것은’이 적절합니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속
  - 분깃
  - 유산
  lexicon: HALOT
  rationale: 여기서는 토지 분배 문맥의 ‘받은 몫/유산된 소유’를 가리키므로, 한국어 성경 어휘로는 ‘기업’이 가장 स्रोत에 가깝고 문맥상 적절합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족에 따른
  alternatives_korean:
  - 그들의 가족에 따른
  - 그들의 씨족에 따른
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 지파 안의 하위 혈연 단위를 가리키므로 ‘종족’이 ‘가족’보다 더 넓은 집단성을 잘 드러냅니다.
- source_word: וְחַצְרֵיהֶם
  english_pob_choice: and their villages
  chosen_korean: 그 마을들
  alternatives_korean:
  - 그 촌락들
  - 그 정착지들
  - 그 뜰들
  lexicon: HALOT
  rationale: חָצֵר는 성읍에 속한 주변 거주지를 뜻하는 경우가 많아, 한국어에서는 의미를 분명히 하는 ‘마을들’이 가장 자연스럽습니다.
theological_decisions:
- issue: 문장 종결의 시제와 요약 공식
  chosen_reading: 현재형 대신 요약 진술로서 ‘입니다’형을 사용했습니다.
  alternative_readings:
  - ‘이것은 …이었습니다’로 과거형을 사용
  - ‘이것이 …입니다’로 직역
  rationale: 히브리어 요약 공식 זֹאת …는 영어처럼 과거/현재 둘 다 가능하지만, 한국어에서는 본문의 분배를 마감하는 선언문으로서 현재형 서술이 더 자연스럽고 단정적입니다.
  doctrine_reference: 문맥적 서술 방식
