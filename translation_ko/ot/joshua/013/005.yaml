translation:
  language: ko
  text: 그리고 기브 사람들의 땅과 레바논 온 땅, 해 뜨는 쪽, 곧 바알갓에서 헤르몬 산 아래에 있는 곳에서부터 하맛으로 들어가는 곳까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하맛으로 들어가는 곳까지’. 히브리어는 고정 지명이라기보다 경계 설명으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 영토
  - 땅의 지역
  lexicon: HALOT
  rationale: 지리적 경계 문맥이므로 한국어에서는 자연스럽고 포괄적인 ‘땅’이 가장 직접적입니다.
- source_word: הַגִּבְלִי
  english_pob_choice: the Gebalites
  chosen_korean: 기브 사람들
  alternatives_korean:
