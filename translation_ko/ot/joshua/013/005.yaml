  - 기블 사람들
  lexicon: HALOT
  rationale: 지명 Gebal에 속한 주민을 가리키는 민족명으로, 한국어에서는 지명-민족 관계가 드러나도록 ‘기브 사람들’로 옮겼습니다.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  english_pob_choice: toward the sunrise
  chosen_korean: 해 뜨는 쪽
  alternatives_korean:
  - 동쪽으로
  - 해 뜨는 편
  lexicon: HALOT
  rationale: 직역적이면서도 경계 묘사로 자연스러운 한국어 표현을 택해, 방향성의 비유적 뉘앙스를 살렸습니다.
- source_word: עַד לְבוֹא חֲמָת
  english_pob_choice: to Lebo-hamath
  chosen_korean: 하맛으로 들어가는 곳까지
  alternatives_korean:
  - 르보-하맛까지
  - 하맛의 입구까지
  lexicon: HALOT
  rationale: 히브리어가 지명형으로도, ‘하맛의 입구’라는 서술구로도 읽힐 수 있으므로 본문은 서술적 경계 표현을 택해 의미를 드러냈습니다.
theological_decisions:
- issue: 경계표현의 번역 방식
  chosen_reading: 서술적 지명보다 경계 설명을 우선해 읽을 수 있는 부분은 한국어 본문에서 의미를 분명히 했습니다.
  alternative_readings:
  - 지명형을 그대로 음역해 ‘르보-하맛’으로 둘 수 있음
  rationale: 이 구절은 정복 경계의 목록이므로 독자가 실제 경계선을 이해하도록 하는 것이 본문 기능을 더 잘 보존합니다.
  doctrine_reference: Joshua 13의 분배/경계 문맥
