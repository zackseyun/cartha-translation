  source_fidelity: 개정이 필요합니다. הַגִּבְלִי는 그발(Gebal)에 관련된 주민을 뜻하므로 ‘기브 사람들’은 지명 음역이 부정확합니다. 또한 עַד לְבוֹא חֲמָת는 본문에서 지명형 ‘르보하맛’으로 두고, 서술적 해석은 각주로 보존하는 편이 원문의 지명성 및 영어 POB 본문 선택을 충실히 반영합니다.
  naturalness: ‘해 뜨는 쪽의 온 레바논’과 ‘헤르몬 산 아래 바알갓에서부터’는 경계 목록 문맥에서 자연스럽고 현대 표준어 문장으로 읽힙니다. 원문의 명사구 나열과 문장 종결을 보존했습니다.
  terminology: ‘그발 사람들’은 Gebal과의 연관을 분명히 하며, ‘르보하맛’은 논쟁 가능한 경계 지명을 본문에서 보존합니다. ‘하맛으로 들어가는 곳’은 대안 독법으로 각주에 제시합니다.
