  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
  footnotes:
  - marker: a
    text: Or, 'as far as the entrance to Hamath.' The Hebrew can be read as a descriptive boundary expression rather than a fixed place-name.
