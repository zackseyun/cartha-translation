id: JOS.13.31
reference: Joshua 13:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
  footnotes:
  - marker: a
    text: Or 'the royal cities of Og in Bashan.' The Hebrew literally reads 'the cities of the kingdom of Og in Bashan.'
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Machir'' may denote Machir''s descendants more broadly, but the translation keeps the Hebrew familial wording.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길르앗의 절반과 아스다롯과 에드레이는 바산에서 옥의 왕국의 성읍들이며, 므낫세의 아들 마길의 아들들에게 — 마길의 아들들 가운데 절반에게 — 그들의 종족대로 속하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옥의 왕국의 성읍들’은 히브리어의 직역입니다. POB가 반영한 바와 같이, 이는 관용적으로 ‘옥의 바산 왕국의 왕실 성읍들’로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마길의 아들들’은 혈연적 표현을 그대로 유지한 번역입니다. 문맥상 마길의 후손 전체를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  english_pob_choice: and half of Gilead
  chosen_korean: 길르앗의 절반
  alternatives_korean:
  - 그리고 길르앗 절반
  - 그리고 길르앗의 반
  lexicon: HALOT
  rationale: 할당 목록의 일부로서 ‘half of’는 자연스럽게 ‘-의 절반’으로 옮기는 것이 가장 직접적입니다.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  english_pob_choice: the cities of the kingdom of Og in Bashan
  chosen_korean: 바산에서 옥의 왕국의 성읍들
  alternatives_korean:
  - 바산에 있는 옥의 왕국의 성읍들
  - 바산의 옥 왕국에 속한 성읍들
  lexicon: HALOT
  rationale: 히브리어의 연결 구조를 따라 ‘옥의 왕국의 성읍들’로 옮겨, POB 각주가 지적한 ‘왕실 성읍들’이라는 해석을 본문에 미리 넣지 않았습니다.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  english_pob_choice: belonged to the sons of Machir son of Manasseh
  chosen_korean: 므낫세의 아들 마길의 아들들에게
  alternatives_korean:
  - 므낫세의 아들 마길의 자손들에게
  - 므낫세의 아들 마길의 후손들에게
  lexicon: HALOT
  rationale: POB가 보존한 ‘sons of’의 친족 표현을 따라 ‘아들들’로 유지해, 혈연적 문구를 일반화하지 않았습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가문대로
  - 그들의 씨족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 분배 문맥에서 혈연 단위를 가리키므로, 현대 한국어에서는 ‘종족’보다 행정적·족보적 의미가 분명한 ‘가문’도 가능하지만, 본절의 분배 단위를 살리기 위해 ‘종족’으로 옮겼습니다.
theological_decisions:
- issue: 할당/소유를 나타내는 ל의 처리
  chosen_reading: 본문의 무동사 할당문을 ‘속하였습니다’로 옮겨, 단순 위치 진술이 아니라 분배된 소유권/배정의 의미를 드러냈습니다.
  alternative_readings:
  - 있었습니다
  - 주어졌습니다
  rationale: 이 절은 정복지 목록이 아니라 지파 분배의 귀속을 말하므로, 한국어에서도 귀속 의미가 드러나야 합니다.
  doctrine_reference: 토지 분배 본문 해석(여호수아 13장 문맥)
