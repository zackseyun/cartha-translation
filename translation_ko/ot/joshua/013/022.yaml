  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
  footnotes:
  - marker: a
    text: Or 'along with their slain.' The Hebrew phrase at the end is somewhat unusual; it indicates that Balaam was killed in connection with the others slain by Israel.
