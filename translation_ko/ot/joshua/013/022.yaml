translation:
  language: ko
  text: 그 예언자 발람, 곧 브올의 아들 발람을 이스라엘 자손이 칼로 죽였으며, 그들의 죽은 자들 가운데 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 끝구는 다소 특이하여, 발람이 이스라엘이 죽인 다른 사람들과의 관련 속에서 죽었다는 뜻을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: And
  chosen_korean: 그 예언자 발람, 곧
  alternatives_korean:
  - 그리고
  - 또
  lexicon: HALOT
  rationale: 문맥상 추가 항목을 잇는 וְ의 연결을 살리되, 문장 첫머리의 단순한 접속만으로는 הַקּוֹסֵם의 수식을 충분히 드러내기 어려워 한국어에서는 앞부분을 자연스럽게 묶어 주었습니다.
