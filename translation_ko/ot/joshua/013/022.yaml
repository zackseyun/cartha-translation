  - 복술가
  - 점치는 자
  lexicon: HALOT
  rationale: קֹסֵם은 점술 행위를 가리키며 부정적 의미가 있지만, 한국어에서 직역어를 쓰면 낯설고 문맥의 인물 식별성이 약해질 수 있어, 본문이 부여하는 직업적 표지를 간명하게 옮겼습니다.
- source_word: בֶּן בְּע֖וֹר
