  lexicon: HALOT
  rationale: 히브리어 친족 구조를 자연스럽게 살리면서 고유명사 음역은 한국어 성서 관용에 맞춰 브올로 옮겼습니다.
- source_word: הָרְגוּ
  english_pob_choice: killed
  chosen_korean: 죽였으며
  alternatives_korean:
  - 살해했으며
  - 죽였고
  - 쳐 죽였으며
  lexicon: HALOT
  rationale: 히브리어의 단순한 살해 의미를 현대 한국어의 평이한 서술로 옮겼습니다.
- source_word: בַ/חֶרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 검으로
  - 칼에 의해
  lexicon: HALOT
  rationale: 히브리어 도구격 בְּ는 한국어 조사 '-로'로 자연스럽게 대응되며, 전투 문맥에서 '칼'이 가장 직관적입니다.
- source_word: אֶל חַלְלֵי/הֶם
  english_pob_choice: among their slain
  chosen_korean: 그들의 죽은 자들 가운데 있었습니다
  alternatives_korean:
  - 그들의 전사자들 가운데 있었습니다
  - 그들의 죽은 자들과 함께 있었습니다
  - 그들의 시체들 가운데 있었습니다
  lexicon: HALOT
  rationale: 문말의 불분명한 관용구는 단순히 '함께'로 평탄화하기보다, 이 본문이 말하는 연결성과 위치 관계를 드러내는 쪽으로 옮겼습니다.
theological_decisions:
- issue: הַקּוֹסֵם의 한국어 처리
  chosen_reading: 발람을 '예언자'라고만 부르지 않고, 본문이 그를 점술적 인물로 규정하는 점을 살리되 한국어 문장에서는 인물 식별을 우선해 자연스럽게 배치했습니다.
  alternative_readings:
  - 그 점쟁이 발람
  - 점술가 발람
  - 예언자 발람
  rationale: 이 절은 발람의 정체를 부정적으로 규정하는 서술이 핵심이므로, 지나치게 중립적이거나 전적으로 현대적 직함으로만 번역해 평가적 뉘앙스를 약화시키지 않도록 했습니다.
  doctrine_reference: 민수기 22–24장 전체의 발람 서술
