source:
  edition: WLC
  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
  footnotes:
  - marker: a
    text: Or 'along with their slain.' The Hebrew phrase at the end is somewhat unusual; it indicates that Balaam was killed in connection with the others slain by Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이스라엘 자손은 점술가 브올의 아들 발람을 그들이 죽인 자들 가운데서 칼로 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문말 표현은 다소 특이합니다. ‘그들이 죽인 자들 가운데서’로 옮겼으며, ‘그들이 죽인 자들과 함께’로도 이해할 수 있습니다. 발람이 이스라엘이 죽인 다른 이들과 관련하여 죽임을 당했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: And
  chosen_korean: 그 예언자 발람, 곧
  alternatives_korean:
  - 그리고
  - 또
  lexicon: HALOT
  rationale: 문맥상 추가 항목을 잇는 וְ의 연결을 살리되, 문장 첫머리의 단순한 접속만으로는 הַקּוֹסֵם의 수식을 충분히 드러내기 어려워 한국어에서는 앞부분을 자연스럽게 묶어 주었습니다.
- source_word: הַ/קּוֹסֵם
  english_pob_choice: the diviner
  chosen_korean: 예언자
  alternatives_korean:
  - 점쟁이
  - 복술가
  - 점치는 자
  lexicon: HALOT
  rationale: קֹסֵם은 점술 행위를 가리키며 부정적 의미가 있지만, 한국어에서 직역어를 쓰면 낯설고 문맥의 인물 식별성이 약해질 수 있어, 본문이 부여하는 직업적 표지를 간명하게 옮겼습니다.
- source_word: בֶּן בְּע֖וֹר
  english_pob_choice: son of Beor
  chosen_korean: 브올의 아들 발람
  alternatives_korean:
  - 브올의 아들
  - 베오르의 아들 발람
  lexicon: HALOT
  rationale: 히브리어 친족 구조를 자연스럽게 살리면서 고유명사 음역은 한국어 성서 관용에 맞춰 브올로 옮겼습니다.
- source_word: הָרְגוּ
  english_pob_choice: killed
  chosen_korean: 죽였으며
  alternatives_korean:
  - 살해했으며
  - 죽였고
  - 쳐 죽였으며
  lexicon: HALOT
  rationale: 히브리어의 단순한 살해 의미를 현대 한국어의 평이한 서술로 옮겼습니다.
- source_word: בַ/חֶרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 검으로
  - 칼에 의해
  lexicon: HALOT
  rationale: 히브리어 도구격 בְּ는 한국어 조사 '-로'로 자연스럽게 대응되며, 전투 문맥에서 '칼'이 가장 직관적입니다.
- source_word: אֶל חַלְלֵי/הֶם
  english_pob_choice: among their slain
  chosen_korean: 그들의 죽은 자들 가운데 있었습니다
  alternatives_korean:
  - 그들의 전사자들 가운데 있었습니다
  - 그들의 죽은 자들과 함께 있었습니다
  - 그들의 시체들 가운데 있었습니다
  lexicon: HALOT
  rationale: 문말의 불분명한 관용구는 단순히 '함께'로 평탄화하기보다, 이 본문이 말하는 연결성과 위치 관계를 드러내는 쪽으로 옮겼습니다.
theological_decisions:
- issue: הַקּוֹסֵם의 한국어 처리
  chosen_reading: 발람을 '예언자'라고만 부르지 않고, 본문이 그를 점술적 인물로 규정하는 점을 살리되 한국어 문장에서는 인물 식별을 우선해 자연스럽게 배치했습니다.
  alternative_readings:
  - 그 점쟁이 발람
  - 점술가 발람
  - 예언자 발람
  rationale: 이 절은 발람의 정체를 부정적으로 규정하는 서술이 핵심이므로, 지나치게 중립적이거나 전적으로 현대적 직함으로만 번역해 평가적 뉘앙스를 약화시키지 않도록 했습니다.
  doctrine_reference: 민수기 22–24장 전체의 발람 서술
