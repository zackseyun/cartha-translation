  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
  footnotes:
  - marker: a
    text: Or “which faces Rabbah.” The Hebrew idiom literally says “which is before Rabbah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 영토는 야셀과 길르앗의 모든 성읍들과 암몬 족속의 땅의 절반이었으며, 아로엘 곧 라바 맞은편에 있는 곳까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “라바를 마주한 곳”입니다. 히브리어 관용구는 문자적으로는 “라바 앞에 있는”이라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  english_pob_choice: And their territory was
  chosen_korean: 그들의 영토는
  alternatives_korean:
  - 그들의 경계는
  - 그들의 경계선은
  lexicon: HALOT
  rationale: 문맥상 지파 분배의 범위를 말하므로 ‘경계’보다 결과적으로 차지한 지역을 드러내는 ‘영토’가 자연스럽고, 영어 POB의 의미도 잘 반영합니다.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  english_pob_choice: and all the cities of Gilead
  chosen_korean: 길르앗의 모든 성읍들
  alternatives_korean:
  - 길르앗의 모든 도시들
  - 길르앗의 모든 고을들
  lexicon: HALOT
  rationale: עָרִים는 지리 목록에서 통상 ‘성읍들’로 옮기는 것이 가장 안정적이며, 형식적인 열거체도 유지합니다.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  english_pob_choice: and half the land of the Ammonites
  chosen_korean: 암몬 족속의 땅의 절반
  alternatives_korean:
  - 암몬 사람들의 땅의 절반
  - 암몬 족속의 나라의 절반
  lexicon: HALOT
  rationale: בְּנֵי עַמּוֹן은 지리적·민족적 관용구이므로 ‘암몬 족속’이 가장 자연스럽고, אֶרֶץ는 이 문맥에서 ‘땅’으로 옮기는 것이 적절합니다.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  english_pob_choice: which is opposite Rabbah
  chosen_korean: 라바 맞은편에 있는 곳
  alternatives_korean:
  - 라바를 마주한 곳
  - 라바 앞에 있는 곳
  lexicon: HALOT
  rationale: עַל פְּנֵי의 공간 관계를 ‘맞은편’으로 풀어, 영어 POB가 지적한 ‘opposite’의 의미를 한국어에서 자연스럽게 드러냅니다.
theological_decisions:
- issue: 지명 열거의 문체와 ‘territory’의 처리
  chosen_reading: 지파 분배의 경계 설명을 현대 한국어의 행정·지리 어법에 맞추되, 본문의 열거성과 객관성을 유지했습니다.
  alternative_readings:
  - 직역 위주의 ‘경계선은’
  - 보다 완화된 ‘땅은’
  rationale: 이 절은 신학적 해설보다 분배 경계의 목록이 중심이므로, 의미를 과장하지 않으면서도 읽기 쉬운 ‘영토’/‘성읍들’ 구성을 택했습니다.
  doctrine_reference: 수 13장의 기업 분배 문맥
