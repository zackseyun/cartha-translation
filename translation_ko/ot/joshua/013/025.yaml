  to: 그들의 영토는 야셀과 길르앗의 모든 성읍들과 암몬 사람들의 땅 절반, 곧 랍바 맞은편에 있는 아로엘까지였습니다.[a]
  rationale: 통용 한국어 지명 표기인 ‘랍바’를 적용하고, 히브리어 관계절 אֲשֶׁר עַל־פְּנֵי רַבָּה가 아로엘을 수식한다는 구조를 한국어에서 직접 드러냈습니다. ‘암몬 사람들’은 בְּנֵי עַמּוֹן의 민족 지칭을 보존하면서 현대적인 문체를 유지합니다. 각주도 본문의 수식 관계와 대안적 공간 표현을 정확히 반영하도록 조정했습니다.
