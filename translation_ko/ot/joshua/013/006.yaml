id: JOS.13.6
reference: Joshua 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
  footnotes:
  - marker: a
    text: Misrephoth-maim is a place name; the name may mean something like 'burnings of water,' but its exact sense is uncertain.
    reason: cultural_note
  - marker: b
    text: Or 'I will dispossess them before the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'allot it' reflects the idiom of assigning land, often by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 레바논에서 미스르보트-마임까지 이르는 모든 산지 주민과 모든 시돈 사람들을 내가 이스라엘 자손 앞에서 그들을 쫓아낼 것입니다. 다만 내가 당신에게 명령한 대로 그 땅을 이스라엘에게 기업으로 배분하십시오[a][c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미스르보트-마임은 지명입니다. 이름은 대략 ‘물의 불타는 곳’이라는 뜻일 수 있지만, 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이스라엘 자손 앞에서 그들을 몰아내겠습니다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘배분하십시오’는 땅을 배정하는 관용적 표현이며, 흔히 제비를 뽑아 분배하는 것과 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי הָהָר
  english_pob_choice: the inhabitants of the hill country
  chosen_korean: 산지 주민
  alternatives_korean:
  - 산지에 사는 사람들
  - 산지의 거주자들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주하는 사람들/주민들’의 뜻이고, הָהָר는 지리적 문맥에서 ‘산지’가 자연스럽습니다.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  english_pob_choice: from Lebanon to Misrephoth-maim
  chosen_korean: 레바논에서 미스르보트-마임까지
  alternatives_korean:
  - 레바논에서 미스르보트-마임에 이르기까지
  lexicon: HALOT
  rationale: 레바논과 미스르보트-마임은 본문 문맥상 지명으로 보이므로, 의미를 추정해 풀기보다 음역을 유지하는 편이 원문에 가깝습니다.
- source_word: כָּל צִידֹנִים
  english_pob_choice: all the Sidonians
  chosen_korean: 모든 시돈 사람들
  alternatives_korean:
  - 모든 시돈인들
  - 모든 시돈 주민들
  lexicon: HALOT
  rationale: צִידֹנִים은 시돈 출신/소속 집단을 가리키는 집합명사로, 한국어에서는 ‘시돈 사람들’이 가장 자연스럽습니다.
- source_word: אָנֹכִי אוֹרִישֵׁם מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: I myself will drive them out before the sons of Israel
  chosen_korean: 내가 이스라엘 자손 앞에서 쫓아낼 것입니다
  alternatives_korean:
  - 내가 이스라엘 자손 앞에서 몰아낼 것입니다
  - 내가 이스라엘 자손 앞에서 그들을 내쫓을 것입니다
  lexicon: HALOT
  rationale: אָנֹכִי의 강조는 앞의 ‘내가’로 살리고, אוֹרִישֵׁם은 여기서 거주자를 토지에서 몰아내는 뜻이므로 ‘쫓아내다’가 문맥상 분명합니다. ‘이스라엘 자손’은 원문의 호칭을 그대로 살렸습니다.
- source_word: רַק הַפִּלֶהָ לְיִשְׂרָאֵל בְּנַחֲלָה
  english_pob_choice: Only allot it to Israel as an inheritance
  chosen_korean: 다만 그것을 이스라엘에게 기업으로 나누어 주십시오
  alternatives_korean:
  - 다만 그것을 이스라엘에게 상속 재산으로 나누어 주십시오
  - 오직 그것을 이스라엘에게 유산으로 나누어 주십시오
  lexicon: HALOT
  rationale: הַפִּלֶהָ는 ‘떨어뜨리다’의 관용적 용법으로 분깃을 제비처럼 ‘나누어 주다/배분하다’는 뜻이므로, 여기서는 분배 행위를 드러내는 표현이 적절합니다. נַחֲלָה는 언약적 토지 분배의 ‘기업’으로 옮겼습니다.
theological_decisions:
- issue: 지명과 의미 추정의 처리
  chosen_reading: 미스르보트-마임을 지명으로 음역하고, 본문에는 뜻풀이를 넣지 않았습니다.
  alternative_readings:
  - ‘물의 불타는 곳’처럼 의미 번역하기
  - 주석에서만 의미 가능성을 언급하기
  rationale: 영문 POB도 이를 지명으로 처리하며 뜻은 불확정으로만 주석합니다. 본문에서는 추정적 의미를 넣지 않아야 지리적 식별성과 본문 안정성을 유지할 수 있습니다.
  doctrine_reference: POB translation philosophy / source-note practice
- issue: ‘이스라엘 자손’의 유지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문은 בְּנֵי יִשְׂרָאֵל의 직설적 친족-언약 표현을 사용하므로, 이를 순화하지 않고 유지하는 것이 출처 충실성에 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
