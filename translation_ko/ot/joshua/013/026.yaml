source:
  edition: WLC
  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
  footnotes:
  - marker: a
    text: Or 'to the border toward Debir.' The Hebrew construction can be rendered more literally with directional force, but 'the border of Debir' is smoother in English and fits the territorial-list context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 헤스본에서 라맛 미스베와 베토님까지, 그리고 마하나임에서 데비르 경계까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 방향성을 띠어 ‘데비르 쪽 경계로’처럼 옮길 수도 있지만, 이 절의 지리 목록에서는 ‘데비르 경계’가 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  english_pob_choice: and from Heshbon
  chosen_korean: 그리고 헤스본에서
  alternatives_korean:
  - 헤스본에서
  lexicon: HALOT
  rationale: 접속사 וּ와 전치사 מִן의 결합을 한국어의 자연스러운 연결인 ‘그리고 …에서’로 옮겼고, מקום 이름 חֶשְׁבּוֹן은 헤스본으로 음역했습니다.
- source_word: רָמַת הַמִּצְפֶּה
  english_pob_choice: Ramath-mizpeh
  chosen_korean: 라맛 미스베
  alternatives_korean:
  - 라맛-미스베
  - 미스베의 높은 곳
  lexicon: HALOT
  rationale: 지명으로 기능하므로 구성요소를 풀기보다 음역을 유지했습니다. 히브리어 어근상의 ‘높은 곳/망대’ 의미는 주석 없이 본문에서 과도하게 풀지 않았습니다.
- source_word: וּ/בְטֹנִים
  english_pob_choice: and Betonim
  chosen_korean: 그리고 베토님
  alternatives_korean:
  - 베토님
  lexicon: HALOT
  rationale: 고유 지명으로서 표준 음역을 유지했습니다.
- source_word: גְּב֥וּל לִדְבִֽר
  english_pob_choice: the border of Debir
  chosen_korean: 데비르 경계
  alternatives_korean:
  - 데비르의 경계
  - 데비르 경계선
  lexicon: HALOT
  rationale: 영어 POB의 ‘border of Debir’에 맞추되, 한국어에서는 소유격보다 명사 결합이 간결하고 자연스러워 ‘데비르 경계’로 옮겼습니다.
