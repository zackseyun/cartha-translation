  source_fidelity: 핵심 지명·영역·수량은 대체로 충실합니다. 다만 원문의 병렬 열거에서 ‘바산 전체’와 ‘바산 왕 오그의 온 왕국’을 연결하는 방식이 필요하며, ‘곧’으로 처리하면 두 항목을 해설적 동격으로 지나치게 묶을 수 있습니다. ‘육십 성읍’은 야일의 촌락들을 가리키는 수량 설명으로 자연스럽게 유지할 수 있습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬을 수 있습니다. ‘바산의 왕 오그’보다 ‘바산 왕 오그’가 성경 지리·왕명 문맥에서 간결하고 자연스럽습니다. 또한 ‘촌락들—육십 개 성읍’보다 ‘촌락, 곧 육십 성읍’이 한국어 문장 구조상 명확합니다.
  terminology: ‘영토’, ‘바산’, ‘마하나임’, ‘오그’, ‘야일’, ‘성읍’은 적절합니다. 하봇-야일이라는 전통 음역은 본문 대신 각주 대안으로 보존할 수 있습니다. 각주 a는 하봇-야일 대안이므로 ‘야일의 모든 촌락’에, 각주 b는 문두의 이전 번역 대안이므로 ‘마하나임에서부터 바산 전체’라는 구절에 연결해야 합니다.
