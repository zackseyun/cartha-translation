  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
  footnotes:
  - marker: a
    text: Or “Havvoth-jair,” a traditional transliteration of the Hebrew name for these settlements.
    reason: lexical_alternative
  - marker: b
    text: Or 'from Mahanaim, all Bashan'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 영토는 마하나임에서 시작하여 바산 전체, 곧 바산의 왕 오그의 온 왕국과 바산에 있는 야일의 모든 촌락들—육십 개 성읍이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하봇-야일”. 이 본문에 전통적으로 붙는 히브리어 지명 음역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “마하나임에서, 바산 전체”.
    reason: previous_rendering
lexical_decisions:
- source_word: גְבוּלָם
  english_pob_choice: their territory
  chosen_korean: 그들의 영토
  alternatives_korean:
  - 그들의 경계
  - 그들의 경계선
  lexicon: HALOT
  rationale: 문맥이 영토의 경계선보다 분배된 땅 전체를 가리키므로, 한국어도 ‘영토’로 옮겨 의미를 분명히 했습니다.
- source_word: מִמַּחֲנַיִם
  english_pob_choice: from Mahanaim
  chosen_korean: 마하나임에서 시작하여
  alternatives_korean:
  - 마하나임에서
  - 마하나임으로부터
  lexicon: HALOT
  rationale: מִן은 경계의 시작점을 나타내므로, 한국어에서 흐름을 자연스럽게 드러내기 위해 ‘시작하여’를 보탰습니다.
- source_word: חַוֺּת יָאִיר
  english_pob_choice: the villages of Jair
  chosen_korean: 야일의 모든 촌락들
  alternatives_korean:
  - 야일의 촌락들
  - 하봇-야일
  lexicon: HALOT
  rationale: 이 표현은 지명화된 고유명으로도 남길 수 있지만, 본문 자체는 바산에 있는 야일의 거주지들을 가리키므로 의미를 우선해 ‘촌락들’로 옮겼습니다.
- source_word: שִׁשִּׁים עִיר
  english_pob_choice: sixty cities
  chosen_korean: 육십 개 성읍
  alternatives_korean:
  - 육십 개 도시
  - 육십 성읍
  lexicon: HALOT
  rationale: עִיר는 성읍/도시를 뜻하나, 한국어 성경 문맥에서는 ‘성읍’이 더 자연스럽고 목록체의 지역 단위를 잘 살립니다.
theological_decisions:
- issue: 여기서 גְבוּל의 의미를 경계선이 아니라 분배된 소유지로 옮길지 여부
  chosen_reading: ‘경계’보다 ‘영토’로 옮겨, 이 구절이 이스라엘 지파의 분배된 땅을 말한다는 점을 분명히 했습니다.
  alternative_readings:
  - 그들의 경계는 마하나임에서부터였습니다
  - 그들의 경계선은 마하나임에서부터였습니다
  rationale: 이 문맥은 측량선 자체보다 상속받은 지역 전체를 열거하는 기능이 강하므로, 독자가 본문의 지리·분배 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 땅 분배 본문 해석
- issue: וְכָל חַוֹּת יָאִיר를 고유 지명으로 음역할지, 의미상 일반명사로 풀지 여부
  chosen_reading: 고유명사적 전통 표기인 ‘하봇-야일’을 본문이 아니라 각주에서만 열어 두고, 본문에는 ‘야일의 모든 촌락들’로 적었습니다.
  alternative_readings:
  - 하봇-야일
  - 야일의 거처들
  rationale: 히브리어 표현의 기본 의미는 ‘야일과 관련된 거주지들’이므로, 본문 가독성은 의미 번역이 더 높고 전통 음역은 대안으로 보존하는 것이 적절합니다.
  doctrine_reference: 지명 번역과 전통 음역의 균형
