base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Now Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
  footnotes:
  - marker: a
    text: Or 'to inherit it.' The Hebrew verb can carry the sense of taking possession of land as an inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 늙어서 나이가 많아졌습니다. 야훼께서 그에게 말씀하셨습니다. “당신은 늙어서 나이가 많아졌고, 땅이 매우 많이 남아 있습니다. 그것을 차지해야 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상속받다’. 히브리어 동사는 땅을 유업으로 받아 차지하는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן / בָּא בַּיָּמִים
  english_pob_choice: was old / advanced in years
  chosen_korean: 늙어서 나이가 많아졌습니다
  alternatives_korean:
  - 늙었습니다
  - 나이가 많이 들었습니다
  - 늙어서 연세가 많아졌습니다
  lexicon: HALOT
  rationale: 히브리어의 나이 듦을 나타내는 중복 표현을 자연스러운 현대 한국어로 살리되, 두 요소(늙음과 연세가 많음)를 함께 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 언약의 고유명사이므로 관용적 대체어가 아니라 하나님의 이름을 음역한 ‘야훼’를 유지했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 그 나라
  - 토지
  lexicon: HALOT
  rationale: 여호수아서의 언약적 지리 개념을 한국어에서 가장 직접적으로 드러내는 기본어는 ‘땅’이며, 문맥상 특정 토지를 가리키므로 자연스럽게 옮겼습니다.
- source_word: לְרִשְׁתָּהּ
  english_pob_choice: to be possessed
  chosen_korean: 차지해야 합니다
  alternatives_korean:
  - 소유해야 합니다
  - 차지할 것입니다
  - 상속받아야 합니다
  lexicon: HALOT
  rationale: 히브리어 ירשׁ는 이 문맥에서 약속의 땅을 실제로 점유해 차지하는 의미가 핵심이므로, 한국어에서는 ‘차지하다’로 동적이면서도 본문 의미를 직접 드러냈습니다.
theological_decisions:
- issue: 여호와 신명(יהוה)의 한국어 처리
  chosen_reading: 본문과 직접 대응하는 고유명사로 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신명기적 언약 맥락에서 하나님의 이름을 직접 사용하므로, 제목형 대체어보다 고유명사 표기가 본문의 인격성과 언약성을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
