  naturalness: 열거에서 ‘시브마와,’의 쉼표는 한국어 문장부호상 불필요하므로 제거하는 것이 자연스럽습니다. 종결 표현 ‘입니다’는 본문 목록을 독립적으로 제시하는 합쇼체 형식에 무리가 없습니다.
  terminology: 지명 음역은 일관됩니다. 영어 POB 감사 기록에 있는 צֶרֶת הַשַּׁחַר의 의미상 분석 가능성은 본문 음역을 바꾸지 않고 각주로 보존하는 것이 적절합니다.
