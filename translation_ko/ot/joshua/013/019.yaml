translation:
  language: ko
  text: 또한 기럇아임과 시브마와, 골짜기의 산에 있는 체렛-샤할입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיָתַיִם
  english_pob_choice: Kiriathaim
  chosen_korean: 기럇아임
  alternatives_korean:
  - 기랴다임
  - 기럇하임
  lexicon: HALOT
  rationale: 고유 지명으로 보아 음역하는 것이 타당하며, 히브리어 어형을 비교적 직접적으로 옮겨 기럇아임으로 적었습니다.
- source_word: וְשִׂבְמָה
  english_pob_choice: Sibmah
  chosen_korean: 시브마
  alternatives_korean:
  - 십마
  - 시브마흐
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하는 것이 원문 의도에 맞으며, 영어 POB의 Sibmah에 대응해 표준적인 한국어 음역으로 옮겼습니다.
- source_word: צֶרֶת הַשַּׁחַר
  english_pob_choice: Zereth-shahar
  chosen_korean: 체렛-샤할
  alternatives_korean:
  - 세렛-샤할
  - 새벽의 체렛
  lexicon: HALOT
  rationale: 문맥상 목록 속 지명으로 기능하므로 의미 번역보다 결합 지명으로 음역하는 편이 원문에 가깝습니다.
- source_word: בְּהַר הָעֵמֶק
  english_pob_choice: on the hill of the valley
  chosen_korean: 골짜기의 산에 있는
  alternatives_korean:
  - 골짜기 산에 있는
  - 골짜기에 있는 산에
  lexicon: HALOT
  rationale: ב의 위치적 의미를 살려 ‘~에 있는’으로 처리하고, הַר를 자연스러운 현대 한국어로 ‘산’으로 옮겨 지형 설명을 유지했습니다.
