  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
  footnotes:
  - marker: a
    text: Or 'portion' for 'inheritance' in both occurrences of the Hebrew נַחֲלָה.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 레위 지파에게는 모세가 유산을 주지 않았습니다. 야훼[a], 이스라엘의 하나님이 그들의 유산이십니다. 이는 그분이 그들에게 말씀하신 그대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몫’. 여기서와 앞의 두 번에 나오는 히브리어 נַחֲלָה의 대안 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  english_pob_choice: But to the tribe of Levi
  chosen_korean: 그러나 레위 지파에게는
  alternatives_korean:
  - 그리고 레위 지파에게는
  - 레위 지파에는
  lexicon: HALOT
  rationale: 앞선 지파 분배와의 대비를 살리기 위해 ‘그러나’를 두었고, שֵׁבֶט הַלֵּוִי는 개인 레위인이 아니라 지파 단위를 가리키므로 ‘레위 지파’로 옮겼습니다.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  english_pob_choice: Moses gave no inheritance
  chosen_korean: 모세가 유산을 주지 않았습니다
  alternatives_korean:
  - 모세가 상속분을 주지 않았습니다
  - 모세가 몫을 주지 않았습니다
  lexicon: HALOT
  rationale: נַחֲלָה는 여호수아 문맥에서 토지 분배의 ‘유산/기업’을 뜻하므로, 본문의 언약적 뉘앙스를 살려 ‘유산’으로 번역했습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 야훼, 이스라엘 하나님
  lexicon: HALOT
  rationale: יהוה는 공용 번역 관습의 대체표현보다 신명 표기를 살려 ‘야훼’로 옮겼고, אֱלֹהֵי יִשְׂרָאֵל은 자연스러운 현대 한국어로 ‘이스라엘의 하나님’이라 했습니다.
- source_word: הוּא נַחֲלָתָם
  english_pob_choice: is their inheritance
  chosen_korean: 그들의 유산이십니다
  alternatives_korean:
  - 그들의 몫이십니다
  - 그들의 기업이십니다
  lexicon: HALOT
  rationale: 주어-서술 구조를 한국어에서 자연스럽게 살리면서, 앞의 נַחֲלָה와 같은 어휘를 유지해 반복 효과를 보존했습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  english_pob_choice: just as he spoke to them
  chosen_korean: 이는 그분이 그들에게 말씀하신 그대로입니다
  alternatives_korean:
  - 그분이 그들에게 말씀하신 대로입니다
  - 그분이 그들에게 말씀하신 바와 같습니다
  lexicon: HALOT
  rationale: דבר는 단순히 ‘말하다’의 뜻이므로, 약속으로 확대하지 않고 ‘말씀하신 그대로’로 번역해 진술의 충실성을 유지했습니다.
theological_decisions:
- issue: 야훼의 언약적 자기계시와 레위의 유산 언어
  chosen_reading: ‘야훼… 그들의 유산이십니다’로 유지해, 하나님 자신이 레위의 몫이라는 본문의 신학적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘야훼… 그들의 몫이십니다’
  - ‘야훼… 그들의 기업이십니다’
  rationale: 본문은 레위가 땅의 분배를 받지 않았다는 사실을 넘어, 야훼 자신이 그들의 유산이라고 선언합니다. 이를 완화하지 않고 유지하는 것이 문맥과 신학을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #5'
