  naturalness: 초안의 ‘야훼, 이스라엘의 하나님께 드리는 불로 드리는 제물들’은 조사와 ‘드리는’의 반복 때문에 부자연스럽습니다. 또한 ‘그가 그에게 말씀하신 대로입니다’는 지시 대상이 불분명하고 서술 시제가 문맥상 어색합니다.
