base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
  footnotes:
  - marker: a
    text: Or, more formally, 'the offerings made by fire to the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Some understand this in light of nearby passages as 'the LORD, the God of Israel, is his inheritance.'
    reason: alternative_reading
translation:
  language: ko
  text: 다만 레위 지파에게는 그가 기업을 주지 않았습니다. 야훼 곧 이스라엘 하나님의 화제물들이 그의 기업이었습니다[a]. 그분이 그에게 말씀하신 대로였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 풀어 옮기면 ‘야훼께 불로 드리는 제물들’.
    reason: lexical_alternative
  - marker: b
    text: 어떤 해석은 인접 본문을 따라 ‘야훼, 이스라엘의 하나님이 그의 기업이시다’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 앞절의 지파별 분배에서 레위 지파를 예외로 제시하는 제한을 한국어로 간결하게 살리기 위해 ‘다만’을 택했습니다.
- source_word: לְשֵׁבֶט הַלֵּוִי
  english_pob_choice: to the tribe of Levi
  chosen_korean: 레위 지파에게
  alternatives_korean:
  - 레위의 지파에게
  - 레위 족속에게
  lexicon: HALOT
  rationale: ‘지파’라는 분배 문맥을 유지하면서, 한국어에서는 ‘-에게’로 수혜 대상을 자연스럽게 드러냈습니다.
- source_word: אִשֵּׁי יְהוָה
  english_pob_choice: the offerings by fire to Yahweh
  chosen_korean: 야훼께 드리는 불로 드리는 제물들
  alternatives_korean:
  - 야훼께 드리는 화제물들
  - 야훼의 불제물들
  lexicon: HALOT
  rationale: אִשֵּׁי의 문자적 의미인 ‘불로 드리는 제물’은 살리되, 한국어에서는 제물의 제의적 성격이 드러나도록 풀어 옮겼습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 기업
  alternatives_korean:
  - 그의 상속
  - 그의 분깃
  lexicon: HALOT
  rationale: 가나안 분배 문맥에서 ‘기업’이 토지 몫을 가장 정확하게 반영하며, POB의 ‘inheritance’도 이에 대응합니다.
theological_decisions:
- issue: 레위의 기업이 무엇인가
  chosen_reading: 이 절의 직접 구문에 따라 레위의 기업은 야훼께 드리는 제물들로 표현했습니다.
  alternative_readings:
  - 야훼 자신이 그의 기업이다
  - 제물들은 곧 야훼를 가리키는 완곡 표현이다
  rationale: 본문은 가까운 구문에서 먼저 제의적 몫을 말하고 있으므로, 주변 본문과 조화시키기보다 현재 절의 문장을 우선 반영했습니다.
  doctrine_reference: 문맥 우선 원칙을 유지하고, 인접 본문의 다른 진술과의 긴장을 보존합니다.
