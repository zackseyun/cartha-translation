  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
  footnotes:
  - marker: a
    text: Or 'that are in the plain' or 'that are in the tableland.' The Hebrew term refers to the level upland region of the Transjordan.
    reason: lexical_alternative
translation:
  language: ko
  text: 헤스본과 그 성읍들—들판에 있는 모든 성읍들, 곧 디본, 바못바알, 벳바알므온입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평야에 있는’, ‘고원 지대에 있는’입니다. 히브리어 용어는 요르단 동편의 평평한 고지대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  english_pob_choice: Heshbon
  chosen_korean: 헤스본
  alternatives_korean:
  - 헤슈본
  - 헤시본
  lexicon: 표준 외래어 표기 관행
  rationale: 고유 지명은 통용되는 음역으로 옮기되, 한국어 성경 독자가 바로 알아볼 수 있는 형태를 선택했습니다.
- source_word: וְכָל עָרֶיהָ
  english_pob_choice: and all its cities
  chosen_korean: 그 성읍들
  alternatives_korean:
  - 그 도시들
  - 그의 성읍들
  lexicon: HALOT
  rationale: 히브리어 여성 단수 접미사는 히스본을 가리키지만, 한국어에서는 도시를 가리키는 소유 대명사보다 자연스러운 집합 표현이 적절합니다.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  english_pob_choice: that are on the plateau
  chosen_korean: 들판에 있는
  alternatives_korean:
  - 평야에 있는
  - 고원 지대에 있는
  lexicon: HALOT
  rationale: מִישׁוֹר는 이 요르단 동편 지리 문맥에서 평평한 고지대/고원 지대를 가리키므로, 한국어 본문에서는 간결하게 지형 관계를 드러냈습니다.
- source_word: דִּיבוֹן
  english_pob_choice: Dibon
  chosen_korean: 디본
  alternatives_korean:
  - 디본
  lexicon: 표준 외래어 표기 관행
  rationale: 지명 음역을 유지했습니다.
- source_word: וּבָמוֹת בַּעַל
  english_pob_choice: Bamoth-baal
  chosen_korean: 바못바알
  alternatives_korean:
  - 바못-바알
  - 바알의 산당
  lexicon: HALOT
  rationale: 이 표현은 일반 명사가 아니라 하나의 지명으로 읽어야 하므로, 지명성을 살리기 위해 붙여 적었습니다.
- source_word: וּבֵית בַּעַל מְעוֹן
  english_pob_choice: and Beth-baal-meon
  chosen_korean: 벳바알므온
  alternatives_korean:
  - 벳-바알-므온
  - 벳바알-므온
  lexicon: HALOT
  rationale: 복합 지명으로 보아 음역을 유지하고, 한국어에서는 붙여 써서 하나의 지명임을 분명히 했습니다.
theological_decisions:
- issue: 지형어 מִישֹׁר의 번역 범위
  chosen_reading: 본문의 의도는 일반적 ‘평야’보다 요르단 동편의 평평한 고지대를 가리키는 지리적 설명으로 보았습니다.
  alternative_readings:
  - 평야
  - 고원
  rationale: 영어 POB가 'plateau'를 택한 이유를 따라, 독자가 해당 지역 지형을 오해하지 않도록 했습니다.
  doctrine_reference: 지리·역사적 맥락 보존
