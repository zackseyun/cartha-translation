  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
  footnotes:
  - marker: a
    text: Or 'bank of the Arnon Wadi.' The Hebrew נַחַל can refer to a streambed, wadi, or valley ravine.
    reason: lexical_alternative
  - marker: b
    text: Or 'plateau' or 'plain' for 'tableland.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 경계는 아로엘에서 시작했으니[a], 곧 아르논 골짜기의 가장자리와 골짜기 가운데 있는 성읍, 그리고 메드바까지의 온 평지였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아르논 와디의 둑'이라는 뜻일 수 있습니다. 히브리어 נַחַל은 개울바닥, 와디, 골짜기 협곡을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '고원'이나 '평야'로 옮길 수 있습니다.
    reason: lexical_alternative
