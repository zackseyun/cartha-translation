base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
  footnotes:
  - marker: a
    text: Or 'bank of the Arnon Wadi.' The Hebrew נַחַל can refer to a streambed, wadi, or valley ravine.
    reason: lexical_alternative
  - marker: b
    text: Or 'plateau' or 'plain' for 'tableland.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 경계는 아르논 골짜기 가장자리에 있는 아로엘에서부터, 그 골짜기 가운데 있는 성읍과 메드바에 이르는 온 고원 지대였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아르논 와디의 둑’. 히브리어 נַחַל은 개울바닥, 와디, 또는 골짜기 협곡을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘평야’.
    reason: lexical_alternative
