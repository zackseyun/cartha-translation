revisions:
- from: 그들의 경계는 아로엘에서 시작했으니[a], 곧 아르논 골짜기의 가장자리와 골짜기 가운데 있는 성읍, 그리고 메드바까지의 온 평지였습니다[b].
  to: 그들의 경계는 아르논 골짜기 가장자리에 있는 아로엘에서부터, 그 골짜기 가운데 있는 성읍과 메드바에 이르는 온 고원 지대였습니다[a][b].
  rationale: 아로엘을 수식하는 ‘아르논 골짜기 가장자리에 있는’을 명시하여 원문의 관계절 구조를 보존했습니다. ‘그 골짜기 가운데 있는 성읍’은 별도의 경계 요소로 유지했습니다. מִישׁוֹר는 초안의 ‘평지’ 대신 해당 지역의 높고 평탄한 지형을 반영하는 ‘고원 지대’로 수정했습니다. 각주 앵커와 내용도 각각 ‘골짜기’와 ‘고원 지대’의 어휘적 대안에 맞추었습니다.
