  source_fidelity: 수정이 필요합니다. 초안은 ‘아로엘이 아르논 골짜기 가장자리에 있다’는 관계절을 독립적으로 명시하지 않아, ‘가장자리’와 ‘골짜기 가운데 있는 성읍’이 병렬 지명처럼 읽힐 수 있습니다. 또한 מִישׁוֹר는 이 문맥에서 단순한 ‘평지’보다 요단 동쪽의 높고 평탄한 지형을 가리키므로 ‘고원 지대’가 더 적절합니다.
