  terminology: ‘경계’, ‘아로엘’, ‘아르논’, ‘메드바’는 적절합니다. נַחַל은 본문에서 ‘골짜기’로, מִישׁוֹר는 ‘고원 지대’로 옮기는 것이 지형적 의미에 더 충실합니다. 각주 a는 본문의 ‘아르논 골짜기’에 붙도록 바로잡고, 각주 b는 ‘고원 지대’의 어휘 대안을 명확히 합니다.
