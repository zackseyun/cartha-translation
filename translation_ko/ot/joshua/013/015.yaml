reference: Joshua 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לְ/מַטֵּ֥ה בְנֵֽי רְאוּבֵ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/015.yaml
  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
  footnotes:
  - marker: a
    text: Or 'the Reubenites.' The Hebrew reads literally 'the sons of Reuben.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 르우벤 자손의 지파에게 그들의 씨족대로 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: And ... gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 그리고 주었습니다
  - 건네주었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 נתן의 기본 의미인 ‘주다’를 간명하게 반영합니다.
- source_word: לְמַטֵּה
  english_pob_choice: to the tribe of
  chosen_korean: 르우벤 자손의 지파에게
  alternatives_korean:
  - 르우벤 지파에게
  - 르우벤의 지파에게
  lexicon: HALOT
  rationale: 문맥상 분배 대상은 ‘지파’이며, ל의 수혜·방향성을 한국어 조사 ‘에게’로 자연스럽게 옮겼습니다.
- source_word: בְנֵי רְאוּבֵן
  english_pob_choice: the sons of Reuben
  chosen_korean: 르우벤 자손
  alternatives_korean:
  - 르우벤의 아들들
  - 르우벤 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘sons of Reuben’을 살리되, 한국어에서는 관용적이고 자연한 부족 집단 표현인 ‘자손’이 더 적절합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족대로
  alternatives_korean:
  - 그들의 가문대로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 지파 내부의 씨족 단위를 가리키므로, ‘씨족’이 분배 질서를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 분배 공식의 행정적·언약적 톤
  chosen_reading: 직역을 과도하게 풀지 않고, 분배 행위 자체를 담담히 진술했습니다.
  alternative_readings:
  - '''모세가 르우벤 자손의 지파에게 몫을 나누어 주었습니다'''
  - '''모세가 르우벤 자손 지파에 분깃을 주었습니다'''
  rationale: 히브리어 원문은 단순한 서술문으로, 여기서 신학적 해석을 덧붙이기보다 전승된 분배 공식을 보존하는 것이 적합합니다.
  doctrine_reference: 가나안 분배 본문(수 13장)
