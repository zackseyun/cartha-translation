translation:
  language: ko
  text: 모세는 므낫세 반 지파에게 주었습니다. 그리고 그것은 므낫세 자손의 반 지파의 각 씨족에 속했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “므낫세의 자손”이라고 되어 있으며, 지파 후손을 가리키는 친족 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주셨습니다
  - 할당하였습니다
  - 내주었습니다
  lexicon: HALOT
  rationale: 분배·할당 문맥에서도 נתן의 기본 의미는 ‘주다’이므로, 문맥을 살리되 과도하게 행정용어화하지 않도록 ‘주었습니다’로 옮겼습니다.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  english_pob_choice: to the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파에게
  alternatives_korean:
  - 므낫세의 반 지파에게
  - 므낫세 반 지파에
  - 므낫세의 절반 지파에게
  lexicon: HALOT
  rationale: חֲצִי שֵׁבֶט는 ‘반 지파’라는 행정적·분배적 표현이 자연스럽고, 인명은 현대 한국어 성경 관행에 따라 ‘므낫세’로 옮겼습니다.
- source_word: וַיְהִי
  english_pob_choice: it was for
  chosen_korean: 그것은 …에 속했습니다
  alternatives_korean:
  - 그것은 …였습니다
  - 그것은 …에게 있었습니다
  - 그것은 …로 되었습니다
  lexicon: HALOT
  rationale: 이 절의 וַיְהִי는 단순 존재보다 분배 결과를 나타내므로, 소유·귀속 관계를 드러내는 ‘속했습니다’가 가장 직접적입니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 각 씨족에
  alternatives_korean:
  - 그들의 씨족에 따라
  - 그들의 종족별로
  - 각 가족에
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 지파 내부의 하위 단위로서 ‘씨족’이 적절하며, ל의 분배적 기능은 ‘각’으로 간결하게 반영했습니다.
theological_decisions:
