  alternative_readings:
  - ‘주셨습니다’처럼 더 경건한 어조
  - ‘할당하였습니다’처럼 행정적 어조
  rationale: 본문은 제사적 선언이 아니라 토지 분배 기록이므로, 과도한 신앙어보다 מקור의 행정·서술적 기능을 유지하는 것이 적절합니다.
