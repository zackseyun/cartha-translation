  - 경계선
  - 국경
  lexicon: HALOT
  rationale: 지리적 구획을 나타내는 본문의 뜻을 살리면서, 한국어로는 ‘경계’가 가장 자연스럽고 넓은 땅의 한계를 함께 담아냅니다.
