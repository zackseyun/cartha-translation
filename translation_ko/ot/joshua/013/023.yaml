  verdict: revise
  source_fidelity: 첫 절의 ‘요르단강과 그 경계’는 히브리어 הַיַּרְדֵּן וּגְבוּל의 압축된 경계 공식과 영어 감사 번역의 모호성을 보존합니다. 다만 후반부는 לְמִשְׁפְּחֹתָם הֶעָרִים וְחַצְרֵיהֶן를 ‘종족별로 받은 기업, 곧 성읍들과 그에 딸린 마을들’로 옮겨야, 기업의 구성 항목과 종족별 배분이라는 관계가 정확히 드러납니다.
  naturalness: 초안의 ‘그들의 종족별로 한 것이며’는 무엇을 ‘한 것’인지 불명확하고 한국어 문장으로도 부자연스럽습니다. ‘종족별로 받은 기업, 곧 …’이 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다.
  terminology: ‘르우벤 자손’, ‘요르단강’, ‘경계’, ‘기업’, ‘성읍’, ‘마을’은 모두 적절합니다. חַצְרֵיהֶן의 종속·부속 관계를 ‘그에 딸린 마을들’로 드러내면 의미가 더 분명합니다. 본문의 압축 표현에 대한 대안 해석은 각주로 유지합니다.
