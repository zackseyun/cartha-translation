  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
  footnotes:
  - marker: a
    text: Or 'the Jordan as a border.' The Hebrew phrase 'the Jordan and border' is compact and may be understood as identifying the Jordan as the boundary line.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 자손의 경계는 요르단강과 그 경계였습니다. 이것이 르우벤 자손이 종족별로 받은 기업, 곧 성읍들과 그에 딸린 마을들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요르단강이 경계였다.” 히브리어의 “요르단과 경계”라는 압축된 표현은 요르단강 자체가 경계선이었다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
