source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: ko
  text: 미츠라임 앞의 시홀에서부터 에그론 경계 북쪽까지—그것은 가나안 땅으로 여겨집니다—블레셋의 다섯 통치자들, 곧 가사 사람, 아스돗 사람, 아스글론 사람, 가드 사람, 에그론 사람과 아윔입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 시홀은 히브리어 지명을 음역한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: מִן הַשִּׁיחוֹר ... וְעַד גְּב֤וּל עֶקְרוֹן צָפֹנָה
  english_pob_choice: from the Shihor ... as far as the border of Ekron to the north
  chosen_korean: 미츠라임 앞의 시홀에서부터 에그론 경계 북쪽까지
  alternatives_korean:
  - 이집트 동쪽의 시홀에서부터 에그론 경계 북쪽까지
  - 시홀에서 이집트 앞쪽으로부터 에그론의 북쪽 경계까지
  lexicon: שִׁיחוֹר / גְּבוּל
  rationale: 시홀은 음역을 유지하고, 영어 POB의 ‘east of Egypt’에 대응하는 지리 관계를 ‘미츠라임 앞의’로 풀어 원문의 위치 설명을 반영했습니다. גְּבוּל은 ‘경계’로 옮겨 지경 설정을 분명히 했습니다.
- source_word: תֵּחָשֵׁב
  english_pob_choice: it is counted as
  chosen_korean: 그것은 가나안 땅으로 여겨집니다
  alternatives_korean:
  - 그것은 가나안으로 계산됩니다
  - 그것은 가나안으로 간주됩니다
  lexicon: חשב
  rationale: 원문의 수동적 평가/분류 의미를 살리되, 한국어에서는 자연스럽게 ‘여겨집니다’로 처리해 지역 분류의 의미를 분명히 했습니다.
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the five rulers of the Philistines
  chosen_korean: 블레셋의 다섯 통치자들
  alternatives_korean:
  - 블레셋의 다섯 방백들
  - 블레셋의 다섯 영주들
  lexicon: סַרְנִים
  rationale: סַרְנִים의 통치자 성격을 드러내되, POB의 직역적 명칭을 따라 과도한 전통 용어화(방백/영주)를 피했습니다.
- source_word: הַגַּזָּתִי ... הָעַוִּים
  english_pob_choice: the Gazite ... and the Avvim
  chosen_korean: 가사 사람, 아스돗 사람, 아스글론 사람, 가드 사람, 에그론 사람과 아윔
  alternatives_korean:
  - 가자 사람, 아스돗 사람, 아스글론 사람, 가드 사람, 에그론 사람과 아윔
  - 가사 사람들, 아스돗 사람들, 아스글론 사람들, 가드 사람들, 에그론 사람들 그리고 아윔
  lexicon: 지명 형용사 / עַוִּים
  rationale: 각 집단은 영어 POB처럼 주민형으로 처리했고, 아윔은 고유 집단명으로 음역을 유지했습니다.
theological_decisions:
- issue: 해당 절의 경계 서술이 약속의 땅/가나안 귀속을 어떻게 표현할지
  chosen_reading: ‘그것은 가나안 땅으로 여겨집니다’라고 옮겨, 지리적 목록이 단순한 행정 경계가 아니라 가나안 영토 분류에 포함된다는 점을 드러냈습니다.
  alternative_readings:
  - ‘그것은 가나안으로 계산됩니다’
  - ‘그것은 가나안 땅으로 간주됩니다’
  rationale: 원문의 תֵּחָשֵׁב는 단순 위치 정보가 아니라 포함 범주를 말하므로, 독자가 약속의 경계 설정을 놓치지 않도록 분류 의미를 분명히 했습니다.
  doctrine_reference: 여호수아의 땅 분배와 가나안 경계 설정
- issue: ‘east of Egypt’의 지리 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘미츠라임 앞의’로 번역해, 영어 POB가 채택한 지리적 관계를 보존하면서도 원문처럼 서술적·관계적 표현을 유지했습니다.
  alternative_readings:
  - ‘이집트 동쪽의’
  - ‘이집트 앞쪽의’
  rationale: 원문의 관계어는 단순 방위만이 아니라 이집트를 기준으로 한 위치 서술이므로, 직역보다 설명적이지만 과도하지 않은 표현을 택했습니다.
  doctrine_reference: 지리 서술의 문맥적 정확성
