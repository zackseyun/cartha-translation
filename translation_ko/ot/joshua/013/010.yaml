source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
  footnotes:
  - marker: a
    text: 'Or “the Ammonites.” Hebrew: “the sons of Ammon.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 헤스본에서 다스리던 아모리 사람들의 왕 시혼의 모든 성읍, 암몬 자손의 경계까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’. 히브리어는 ‘암몬 자손’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  english_pob_choice: and all
  chosen_korean: 그리고 … 모든
  alternatives_korean:
  - 그리고 모든
  - 또 모든
  lexicon: HALOT
  rationale: וְ의 연결성과 כֹל의 포괄성을 함께 살리기 위해 문두를 ‘그리고’로 잇고 ‘모든’으로 전체 범위를 나타냈습니다.
- source_word: עָרֵי
  english_pob_choice: the cities of
  chosen_korean: 성읍
  alternatives_korean:
  - 도시들
  - 읍들
  lexicon: HALOT
  rationale: 지명 목록의 문맥에서 עָרֵי는 단수 집합적 표현으로 자연스럽게 ‘성읍’으로 옮기는 것이 간결하고 한국어 성경 문체에도 맞습니다.
- source_word: מֶלֶךְ הָאֱמֹרִי
  english_pob_choice: king of the Amorites
  chosen_korean: 아모리 사람의
  alternatives_korean:
  - 아모리 족속의
  - 아모리인의
  lexicon: HALOT
  rationale: 히브리어의 왕호를 한국어에서는 소유격 구조로 풀어 ‘아모리 사람의’라고 하여, ‘왕’은 앞의 시혼에 이미 연결된 것으로 자연스럽게 읽히게 했습니다.
- source_word: אֲשֶׁר מָלַךְ
  english_pob_choice: who reigned
  chosen_korean: 그가 … 통치하던
  alternatives_korean:
  - 그가 … 다스리던
  - 그가 … 다스렸던
  lexicon: HALOT
  rationale: מָלַךְ의 왕으로서의 통치 행위를 살리되 현대 한국어에서 덜 경직되게 ‘통치하다’로 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 직역의 ‘sons’ 구조를 보존하면서도 한국어에서는 관용적으로 이해되는 ‘암몬 자손’을 사용해 혈연적 종족 표지를 유지했습니다.
theological_decisions:
- issue: 경계 진술의 마무리 형식
  chosen_reading: 문장을 서술형으로 마치지 않고 지도/분배 목록에 어울리는 종결감 있게 옮겼습니다.
  alternative_readings:
  - 평서형으로 ‘…까지입니다’
  - 중립적 열거형으로 ‘…까지’
  rationale: 본문이 영토 경계를 열거하는 문맥이므로, 독자가 경계 설명의 종결을 분명히 느끼도록 하면서도 과도한 해석은 피했습니다.
  doctrine_reference: 문맥상 지리·역사 서술
