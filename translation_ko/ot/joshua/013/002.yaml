source:
  edition: WLC
  text: זֹ֥את הָ/אָ֖רֶץ הַ/נִּשְׁאָ֑רֶת כָּל גְּלִיל֥וֹת הַ/פְּלִשְׁתִּ֖ים וְ/כָל הַ/גְּשׁוּרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
  footnotes:
  - marker: a
    text: Or 'regions' for 'districts' (Hebrew גְּלִילוֹת). The term refers to territorial areas associated with the Philistines.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Geshurite' is a collective gentilic; 'the Geshurites' brings out the collective sense in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 남아 있는 땅입니다. 곧 블레셋 사람들의 모든 지역과 모든 그술 사람들입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지역들’. 히브리어 גְּלִילוֹת은 영토적 구획을 가리키며, 여기서는 블레셋 사람들과 관련된 지역들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그술 사람’은 집합적 민족명으로 쓰였으므로, 복수형으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  english_pob_choice: This is the land that remains
  chosen_korean: 이것이 남아 있는 땅입니다
  alternatives_korean:
  - 이것은 남아 있는 땅입니다
  - 이 땅이 남아 있습니다
  lexicon: HALOT
  rationale: 지시어 זֹאת의 presentative 힘을 살리면서, הַנִּשְׁאָרֶת를 자연스러운 현재분사형으로 옮겨 아직 정복되지 않은 땅이라는 뜻을 유지했습니다.
- source_word: כָּל גְּלִילוֹת הַפְּלִשְׁתִּים
  english_pob_choice: all the districts of the Philistines
  chosen_korean: 블레셋 사람들의 모든 지역
  alternatives_korean:
  - 블레셋 사람들의 모든 구역
  - 블레셋 사람들의 모든 지방
  lexicon: HALOT
  rationale: גְּלִילוֹת은 지리적·행정적 영역을 가리키므로 ‘지역’이 가장 무난하며, האנגלית POB의 ‘districts’를 반영하되 한국어에서 과도하게 행정문서처럼 들리지 않게 했습니다.
- source_word: הַפְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 블레셋
  lexicon: HALOT
  rationale: 원문이 민족 집단을 가리키므로 ‘사람들’로 풀어 집단성과 소유격 관계를 분명히 했습니다.
- source_word: הַגְּשׁוּרִי
  english_pob_choice: the Geshurites
  chosen_korean: 그술 사람들
  alternatives_korean:
  - 그술인들
  - 그술 사람
  - 그술
  lexicon: HALOT
  rationale: 형태는 단수형처럼 보여도 집합적 민족명으로 기능하므로, 영어 POB의 복수 처리와 같은 방향으로 ‘사람들’로 옮겼습니다.
theological_decisions:
- issue: 열거 구조의 미완결성
  chosen_reading: 끝부분의 대시를 살려 문장이 목록 열거로 열려 있음을 유지했습니다.
  alternative_readings:
  - 마침표로 끝맺기
  - 완전한 문장으로 정리하기
  rationale: 히브리어와 영어 POB 모두 목록이 이어질 수 있는 여운을 남기므로, 한국어도 종결을 강하게 닫지 않고 원문의 열거 감각을 보존했습니다.
  doctrine_reference: 본문 형식 보존 원칙
