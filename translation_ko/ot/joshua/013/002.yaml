base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
  footnotes:
  - marker: a
    text: Or 'regions' for 'districts' (Hebrew גְּלִילוֹת). The term refers to territorial areas associated with the Philistines.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Geshurite' is a collective gentilic; 'the Geshurites' brings out the collective sense in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 남아 있는 땅은 이러합니다. 블레셋 사람들의 모든 지역[a]과 그술 사람들의 모든 지역[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구역들’. 히브리어 גְּלִילוֹת은 영토적 구획을 가리키며, 여기서는 블레셋 사람들과 관련된 지역들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그술 사람’은 집합적 민족명으로 쓰였습니다. 본문은 남아 있는 땅을 열거하므로, 한국어에서는 병렬적으로 함축된 ‘지역’을 보충하여 옮겼습니다.
    reason: lexical_alternative
