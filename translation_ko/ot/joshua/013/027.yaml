id: JOS.13.27
reference: Joshua 13:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
  footnotes:
  - marker: a
    text: Or 'as far as the edge/extremity of the Sea of Kinnereth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 골짜기에는 벧하람과 벧니므라와 숙곳과 사본, 곧 헤스본 왕 시혼 왕국의 남은 영토가 있었으며, 그 경계는 요단이었습니다. 이 영토는 요단 동쪽 긴네렛 바다의 끝[a]까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘긴네렛 바다의 가장자리까지’.
    reason: קְצֵה는 ‘끝’ 외에 ‘가장자리, 극점’을 뜻할 수 있습니다. 원문이 어느 특정 방향의 끝인지를 명시하지 않으므로, 본문에서는 ‘끝’으로 옮기고 대안을 각주로 제시합니다.
lexical_decisions:
- source_word: וּבָעֵמֶק
  english_pob_choice: and in the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 평지
  lexicon: HALOT
  rationale: עֵמֶק은 지형적으로 낮은 지역을 가리키므로, 문맥상 ‘골짜기’가 가장 자연스럽고 원뜻을 잘 살립니다.
- source_word: בֵּית הָרָם / בֵית נִמְרָה / סֻכּוֹת / צָפוֹן
  english_pob_choice: Beth-haram / Beth-nimrah / Succoth / Zaphon
  chosen_korean: 벧하람, 벧니므라, 숙곳, 사본
  alternatives_korean:
  - 벧 하람, 벧 니므라, 수곳, 제폰
  lexicon: HALOT
  rationale: 지명들이므로 번역하지 않고 음역했습니다. ‘צָפוֹן’은 방향어 ‘북’이 아니라 목록 안의 지명으로 보아 사본으로 옮겼습니다.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  english_pob_choice: the rest of the kingdom of Sihon king of Heshbon
  chosen_korean: 헤스본 왕 시혼의 왕국의 남은 영토
  alternatives_korean:
  - 헤스본 왕 시혼의 나머지 왕국
  - 헤스본 왕 시혼의 남은 통치 영역
  lexicon: HALOT
  rationale: יֶתֶר는 ‘남은 것/나머지’이고, 여기서는 시혼의 영역 설명이므로 ‘왕국의 남은 영토’가 가장 분명합니다.
- source_word: הַיַּרְדֵּן וּגְבֻל
  english_pob_choice: with the Jordan as its border
  chosen_korean: 요단이 그 경계였고
  alternatives_korean:
  - 요단이 그 경계였습니다
  - 요단을 경계로 하여
  lexicon: HALOT
  rationale: 압축된 히브리어를 한국어로 풀어, 요단이 경계라는 기능을 직접 드러냈습니다.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  english_pob_choice: as far as the lower end of the Sea of Kinnereth
  chosen_korean: 긴네렛 바다의 남쪽 끝까지
  alternatives_korean:
  - 긴네렛 바다의 끝까지
  - 긴네렛 바다의 아래쪽 끝까지
  lexicon: HALOT
  rationale: קְצֵה는 ‘끝’이지만, 경계 서술에서는 지리적 방향성을 살린 ‘남쪽 끝’이 더 자연스럽습니다. ‘Sea of Kinnereth’는 ‘긴네렛 바다’로 보존했습니다.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  english_pob_choice: beyond the Jordan eastward
  chosen_korean: 요단 동쪽으로
  alternatives_korean:
  - 요단을 건너 동쪽으로
  - 요단 저편 동쪽으로
  lexicon: HALOT
  rationale: 정치·지리적 관용구를 현대 한국어에서 가장 간결하고 분명하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 지명 목록과 경계 진술의 문체
  chosen_reading: 서술문을 유지하되, 히브리어의 압축된 경계표현은 한국어에서 필요한 만큼만 풀어 옮겼습니다.
  alternative_readings:
  - 지명들을 더 직역하여 나열하는 방식
  - 경계 서술을 더 설명적으로 확장하는 방식
  rationale: 이 구절은 신학적 해설보다 지리적 경계의 열거가 핵심이므로, 원문의 정보 구조를 보존하면서도 한국어 독자가 이해할 수 있게 최소한으로만 명시화했습니다.
  doctrine_reference: 성경 본문의 지리·역사 서술은 원문 정보의 보존이 우선입니다.
