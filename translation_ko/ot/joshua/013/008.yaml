  source_fidelity: 히브리어의 집합적 지파 명칭, 토지 상속(נחלה), 요단강 동쪽의 위치, 그리고 ‘야훼의 종 모세’라는 칭호를 대체로 충실히 반영했습니다. 다만 ‘르우벤 사람들/갓 사람들’은 지파를 가리키는 본문 문맥에서는 ‘르우벤 자손/갓 자손’보다 덜 정확하고, 지리 주석의 표지가 해당 어구에 붙어 있지 않습니다.
  naturalness: 합쇼체는 일관됩니다. ‘자기들의’보다 ‘그들의’가 서술문에서 더 자연스럽고, ‘르우벤 자손과 갓 자손도’가 성경의 지파 문맥을 현대 표준어로 더 분명하게 전달합니다. 반복되는 모세 언급은 원문의 반복을 보존하되 문장을 약간 다듬을 수 있습니다.
  terminology: ‘기업’은 נחלה의 토지 상속·분깃 의미를 적절히 보존하며, ‘야훼의 종 모세’와 ‘야훼’도 제시된 표기 원칙에 부합합니다. ‘사람들’은 개인들의 일반 집단으로 들릴 수 있으므로 지파적 표현으로 고치는 것이 좋습니다.
