  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''beyond the Jordan eastward,'' that is, on the east side of the Jordan.'
    reason: cultural_note
translation:
  language: ko
  text: 그와 함께 르우벤 사람들과 갓 사람들은 자기들의 기업을 받았습니다. 그 기업은 모세가 그들에게 요단 강 건너편, 동쪽에 준 것이며, 야훼의 종 모세가 그들에게 준 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “요단 강 건너편, 동쪽에”는 히브리어로는 곧 요단 강의 동쪽 편을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: עִמּוֹ
  english_pob_choice: With him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 더불어
  - 그와 함께하여
  lexicon: HALOT
  rationale: 대명사 수식어의 자연스러운 한국어 순서를 따르되, 앞문맥의 인물을 가리키는 관계를 분명히 유지했습니다.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  english_pob_choice: the Reubenites and the Gadites
  chosen_korean: 르우벤 사람들과 갓 사람들
  alternatives_korean:
  - 르우벤 족속과 갓 족속
  - 르우벤 지파와 갓 지파
  lexicon: HALOT
  rationale: 히브리어 단수 민족형이 집합적으로 쓰인 것으로 보아, 한국어에서는 족속/사람들로 자연스럽게 집합 의미를 살렸습니다.
- source_word: לָקְחוּ נַחֲלָתָם
  english_pob_choice: received their inheritance
  chosen_korean: 자기들의 기업을 받았습니다
  alternatives_korean:
  - 자기들의 상속을 받았습니다
  - 자기들의 분깃을 받았습니다
  lexicon: HALOT
  rationale: נחלה의 언약적 토지 분배 의미를 살리기 위해 '기업'을 택했고, 문맥상 '받다'가 한국어에서 가장 자연스럽습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  english_pob_choice: beyond the Jordan eastward
  chosen_korean: 요단 강 건너편, 동쪽에
  alternatives_korean:
  - 요단 강 건너 동쪽에
  - 요단 강 저편 동쪽에
  lexicon: HALOT
  rationale: 직역의 방향성을 유지하면서도 한국어 독자에게 지리적 위치가 즉시 전달되도록 병렬 구조로 옮겼습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종 모세
  alternatives_korean:
  - 야훼의 종인 모세
  - 야훼를 섬기는 모세
  lexicon: HALOT
  rationale: 화자/서술자의 존칭을 유지하면서도 'עֶבֶד'의 기본 의미를 '종'으로 보존했습니다. 예배 용어화된 '종인'보다 본문의 칭호성을 더 직접적으로 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 본문은 여호수아기와 사무엘기 등에서 공통적으로 쓰는 표준 음역 원칙에 따라 신명기적 고유명사를 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 모세의 칭호
  chosen_reading: 야훼의 종 모세
  alternative_readings:
  - 야훼의 종인 모세
  - 여호와의 종 모세
  rationale: 본문의 신명기적 언약 이름을 보존하면서, עֶבֶד יְהוָה를 일반적 종속 관계가 아닌 야훼께 속한 사역자의 칭호로 읽었습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 기업(נחלה)의 의미
  chosen_reading: 자기들의 기업
  alternative_readings:
  - 자기들의 유산
  - 자기들의 분깃
  rationale: 이 절은 토지 분배 맥락이므로 '기업'이 언약-땅 상속의 의미를 가장 정확하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Covenant land inheritance'
