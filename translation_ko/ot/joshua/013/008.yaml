revisions:
- from: 그와 함께 르우벤 사람들과 갓 사람들은 자기들의 기업을 받았습니다. 그 기업은 모세가 그들에게 요단 강 건너편, 동쪽에 준 것이며, 야훼의 종 모세가 그들에게 준 그대로였습니다.[a]
  to: 그와 함께 르우벤 자손과 갓 자손도 그들의 기업을 받았습니다. 이 기업은 모세가 요단강 건너편 동쪽에서[a] 그들에게 준 것이며, 야훼의 종 모세가 그들에게 준 그대로였습니다.
  rationale: 지리 각주를 해당 어구에 직접 연결하고, 지파를 가리키는 집합 명칭을 ‘자손’으로 바로잡았습니다. 또한 불필요한 재귀 소유 표현을 완화했습니다. 모세의 수여를 다시 확인하는 원문의 반복과 비교 표현은 유지했습니다.
