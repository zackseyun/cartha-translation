  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
  footnotes:
  - marker: a
    text: Or 'to the children/descendants of Gad.' The Hebrew literally says 'sons of Gad,' a standard tribal-genealogical expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 갓 지파, 곧 갓 자손에게 그들의 씨족대로 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 할당했습니다
  - 배정했습니다
  lexicon: HALOT
  rationale: 분배·분할 맥락에서 נתן의 기본 의미를 자연스럽게 살리되, 현대 한국어에서 문맥상 가장 무리 없는 서술형으로 옮겼습니다.
- source_word: לְמַטֵּה גָד
  english_pob_choice: to the tribe of Gad
  chosen_korean: 갓 지파에게
  alternatives_korean:
  - 갓 지파에
  - 갓 지파를 위하여
  - 갓의 지파에게
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 문자적 '막대기'가 아니라 지파를 뜻하므로, 관용적으로 '지파'로 번역했습니다.
- source_word: לִבְנֵי גָד
  english_pob_choice: to the sons of Gad
  chosen_korean: 갓의 자손들에게
  alternatives_korean:
  - 갓의 아들들에게
  - 갓의 자녀들에게
  - 갓의 후손들에게
  lexicon: HALOT
  rationale: 히브리어의 'sons of'를 문자적으로 보존하되, 족보·지파 공식에서의 집단적 의미를 살려 '자손들'로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가문대로
  - 그들의 씨족대로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 분배 문맥에서 씨족/종족 단위를 가리키므로, 한국어 성경 문체에서 이해되는 '종족'으로 대응했습니다.
