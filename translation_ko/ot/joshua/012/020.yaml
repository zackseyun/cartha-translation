translation:
  language: ko
  text: 시므론-메론[a]의 왕 한 명, 악삽의 왕 한 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 보통 ‘시므론-메론’이라는 합성 지명으로 이해됩니다. 그러나 ‘시므론’과 ‘메론’이라는 별개의 지명으로 볼 수도 있습니다. 합성 지명으로 보는 해석은 이 절이 왕을 두 명으로 집계하는 구조에 잘 맞습니다.
    reason: alternative_reading
