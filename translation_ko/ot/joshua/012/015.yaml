  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֶ֤לֶךְ לִבְנָה֙ אֶחָ֔ד מֶ֥לֶךְ עֲדֻלָּ֖ם אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/015.yaml
  text: the king of Libnah[a], one; the king of Adullam, one.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically in English: ''the king of Libnah, one; the king of Adullam, one king.'' The Hebrew simply repeats ''one'' as a tally formula.'
    reason: lexical_alternative
translation:
  language: ko
  text: 드높이 세우는 성의 왕은 하나요, 아둘람의 왕도 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 항목마다 단순히 ‘하나’를 반복하는 집계 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: the king of
  chosen_korean: 왕은
  alternatives_korean:
  - 왕
  - 그 왕
  lexicon: HALOT
  rationale: 열거문에서 각 도시국가의 통치자를 가리키므로 ‘왕’으로 옮기되, 한국어 문장 흐름에 맞게 서술형으로 처리했습니다.
- source_word: לִבְנָה
  english_pob_choice: Libnah
  chosen_korean: 드높이 세우는 성
  alternatives_korean:
  - 립나
  - 리브나
  lexicon: HALOT
  rationale: 본문의 도시명은 음역보다 의미역이 가능한 경우를 택해 한국어 독자가 지명인지 즉시 파악하도록 했습니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 하나요
  alternatives_korean:
  - 하나입니다
  - 한 사람입니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 집계 형식을 살리기 위해 ‘하나’를 유지하고, 병렬 목록의 리듬에 맞게 연결했습니다.
- source_word: עֲדֻלָּם
  english_pob_choice: Adullam
  chosen_korean: 아둘람
  alternatives_korean:
  - 아둘람
  lexicon: HALOT
  rationale: 고유명사는 통용 음역을 따랐습니다.
theological_decisions:
- issue: 도시명 לִבְנָה의 처리
  chosen_reading: 지명 자체의 음역보다 의미를 반영해 ‘드높이 세우는 성’으로 옮겼습니다.
  alternative_readings:
  - 립나
  - 리브나
  rationale: 이 구절은 정복 목록의 항목이지만, 해당 지명의 어원적 의미를 한국어로 드러내는 편이 원문의 압축성과 대조적으로 독자 이해에 도움이 된다고 보았습니다.
  doctrine_reference: 지명 번역 원칙
- issue: ‘one’의 반복
  chosen_reading: 각 항목 뒤의 ‘하나’를 그대로 반복해 집계 공식의 건조함을 유지했습니다.
  alternative_readings:
  - 한 왕입니다
  - 각각 하나입니다
  rationale: 히브리어는 단순 집계구를 반복하므로 해설을 덧붙이지 않고 숫자 반복을 보존했습니다.
  doctrine_reference: 서술 형식 보존
