- source_word: מֶלֶךְ תִּרְצָה
  english_pob_choice: the king of Tirzah
  chosen_korean: 드르사 왕
  alternatives_korean:
  - 디르사 왕
  - 티르사 왕
  lexicon: HALOT
  rationale: 지명 תִּרְצָה는 현대 표기법상 ‘드르사’로 옮길 수 있으며, 목록형 문맥에서는 소유격보다 ‘왕’ 뒤에 지명을 붙이는 한국어가 자연스럽습니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 하나
  alternatives_korean:
  - 한 명
  - 한
  lexicon: HALOT
  rationale: 앞선 항목의 수를 가리키는 단순 기수이므로, 영어 POB의 간결한 목록체에 맞춰 ‘하나’로 옮겼습니다.
- source_word: כָּל מְלָכִים
  english_pob_choice: all the kings
  chosen_korean: 모든 왕은
  alternatives_korean:
  - 왕들은 모두
  - 전체 왕 수는
  lexicon: HALOT
  rationale: כָּל은 앞선 정복 목록 전체를 요약하는 표지이므로 ‘모든’으로, 수량 결론을 분명히 하도록 주어적 종결을 취했습니다.
- source_word: שְׁלֹשִׁים וְאֶחָד
  english_pob_choice: thirty-one
  chosen_korean: 서른한 명
  alternatives_korean:
  - 31명
  - 서른하나
  lexicon: HALOT
  rationale: 히브리어 합성 수사를 한국어 자연문장에 맞게 ‘서른한 명’으로 풀어, 총계가 사람 수임을 드러냈습니다.
