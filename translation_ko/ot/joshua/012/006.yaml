id: JOS.12.6
reference: Joshua 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 종 모세와 이스라엘 자손이 그들을 쳐서 무찔렀고, 야훼의 종 모세가 그것을 르우벤 지파와 갓 지파와 므낫세 반 지파에게 기업으로 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד יְהוָה
  english_pob_choice: servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 종된 자
  lexicon: HALOT
  rationale: 모세에게 붙은 호칭은 신분을 드러내는 ‘종’이 가장 자연스럽고, 본문의 공적·존칭적 용법을 살려야 하므로 ‘노예’는 피했습니다.
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 집합표현을 직역하면 ‘이스라엘 자손’이며, 본문의 형태를 살리면서 한국어에서도 자연스럽습니다.
- source_word: הִכּוּם
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳐서 무찔렀고
  alternatives_korean:
  - 그들을 쳤고
  - 그들을 패배시켰고
  lexicon: HALOT
  rationale: 군사적 정황에서 ‘치다’의 구체성을 유지하면서 결과를 드러내기 위해 ‘쳐서 무찔렀다’를 택했습니다.
- source_word: וַיִּתְּנָהּ … יְרֻשָּׁה
  english_pob_choice: gave it as an inheritance
  chosen_korean: 그것을 … 기업으로 주었습니다
  alternatives_korean:
  - 그것을 … 유산으로 주었습니다
  - 그것을 … 상속 재산으로 주었습니다
  lexicon: HALOT
  rationale: יְרֻשָּׁה는 언약적 토지 분배 맥락에서 ‘기업’이 가장 정확하고, 한국어 성경 전통의 용례도 살릴 수 있습니다.
- source_word: לָרוּאֻבֵנִי / לַגָּדִי / לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  english_pob_choice: to the Reubenites, the Gadites, and the half-tribe of Manasseh
  chosen_korean: 르우벤 사람들에게, 갓 사람들에게, 그리고 므낫세 반 지파에게
  alternatives_korean:
  - 르우벤 지파에게, 갓 지파에게, 그리고 므낫세 반 지파에게
  - 르우벤 족속에게, 갓 족속에게, 그리고 므낫세 반 지파에게
  lexicon: HALOT
  rationale: 지파 집단을 가리키는 지파명 형용사를 한국어로는 통상적인 민족·집단 표현인 ‘사람들’로 옮겨, 지파별 분배 대상임을 분명히 했습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה 처리
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문이 신적 호칭이 아닌 고유명사 יְהוָה를 직접 쓰므로, POB 기준에 따라 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
