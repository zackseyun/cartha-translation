id: JOS.12.3
reference: Joshua 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
  footnotes:
  - marker: a
    text: Or 'the plain' for 'the Arabah'; here it likely refers to the specific Jordan rift region rather than a generic plain.
    reason: lexical_alternative
  - marker: b
    text: '''The Sea of the Arabah, the Salt Sea'' refers to what is later commonly called the Dead Sea.'
    reason: cultural_note
translation:
  language: ko
  text: 아라바는 동쪽으로 긴네렛 바다까지, 또 벧여시못 길을 따라 동쪽으로 아라바 바다, 곧 소금 바다까지, 그리고 남쪽으로는 피스가의 산비탈 아래까지입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 평야
  - 요단 계곡
  lexicon: HALOT
  rationale: 경계 설명의 고유 지리명으로 보아 일반명사화하지 않고 음역을 유지하는 것이 원문과 POB의 처리에 가장 가깝습니다.
- source_word: יָם כִּנְרוֹת
  english_pob_choice: the Sea of Kinnereth
  chosen_korean: 긴네렛 바다
  alternatives_korean:
  - 긴네렛 호수
  - 게네사렛 바다
  lexicon: HALOT
  rationale: 히브리어 지명을 보존하되 한국어에서는 자연스럽게 ‘바다’를 붙여 경계 목록의 형식을 살렸습니다.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  english_pob_choice: the Sea of the Arabah, the Salt Sea
  chosen_korean: 아라바 바다, 곧 소금 바다
  alternatives_korean:
  - 아라바 바다, 즉 소금 바다
  - 아라바 바다, 곧 사해
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 살리기 위해 두 명칭을 병기했고, 원문에 없는 ‘사해’는 해석적 현대화를 피했습니다.
- source_word: דֶּרֶךְ
  english_pob_choice: by way of
  chosen_korean: 길을 따라
  alternatives_korean:
  - 을 경유하여
  - 방향으로
  lexicon: HALOT
  rationale: 지형 경계의 이동 경로를 한국어로 간결하게 드러내면서 과도한 의역을 피했습니다.
- source_word: בֵּית הַיְשִׁמֹת
  english_pob_choice: Beth-jeshimoth
  chosen_korean: 베스여시못
  alternatives_korean:
  - 벧여시못
  - 벳여시못
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 원칙에 따라 음역했고, 통용 교회식 표기 대신 일관된 음가를 우선했습니다.
- source_word: וּמִתֵּימָן
  english_pob_choice: and southward
  chosen_korean: 남쪽으로는
  alternatives_korean:
  - 남쪽으로
  - 그리고 남쪽에는
  lexicon: HALOT
  rationale: 경계의 방향 표지로서 부사적 의미를 자연스럽게 나타냈습니다.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  english_pob_choice: below the slopes of Pisgah
  chosen_korean: 피스가의 산비탈 아래
  alternatives_korean:
  - 피스가의 비탈 아래
  - 피스가의 경사 아래
  lexicon: HALOT
  rationale: ‘אַשְׁדּוֹת’의 지형적 의미를 한국어의 ‘산비탈’로 풀어 주되, 원문의 아래쪽 위치 관계를 유지했습니다.
