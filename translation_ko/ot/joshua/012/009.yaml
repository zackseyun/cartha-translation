translation:
  language: ko
  text: 여리고의 왕 하나, 벧엘 곁에 있는 아이의 왕 하나입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 열거 형식의 정복 왕 목록이므로 한국어에서는 자연스럽게 ‘왕’으로 옮기고, 문맥상 반복되는 관사를 별도로 드러내지 않았습니다.
- source_word: יְרִיחוֹ
  english_pob_choice: Jericho
  chosen_korean: 여리고
  alternatives_korean:
  - 예리코
  lexicon: HALOT
  rationale: 성경에서 널리 굳어진 한국어 음역을 따랐습니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 하나요 / 하나입니다
  alternatives_korean:
  - 한 사람
  - 한 명입니다
  - 한 왕입니다
  lexicon: HALOT
  rationale: 이 절의 반복되는 집계 공식에서 אֶחָד은 수량 표지로 기능하므로, 한국어도 간결하게 ‘하나요’로 시작해 마지막에 ‘하나입니다’로 마무리했습니다.
- source_word: הָעַי
  english_pob_choice: Ai
  chosen_korean: 아이
  alternatives_korean:
  - 아이 성
  lexicon: HALOT
  rationale: 지명 고유형을 음역으로 유지했습니다. 전통적 ‘아이 성’은 본문에 없는 보충어가 되므로 본문에는 넣지 않았습니다.
- source_word: מִצַּד
  english_pob_choice: beside
  chosen_korean: 곁에 있는
  alternatives_korean:
  - 옆에 있는
  - 바로 옆에 있는
  - 곁의
  lexicon: HALOT
  rationale: 단순한 근접·위치 관계를 나타내므로, 한국어에서는 위치를 설명하는 ‘곁에 있는’으로 자연스럽게 표현했습니다.
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 베델
  lexicon: HALOT
  rationale: 성경에서 통용되는 한국어 표기를 따랐습니다.
theological_decisions:
- issue: 정복 왕 명단의 축약된 계수식 표현
  chosen_reading: 원문의 짧은 목록 구조를 살려 ‘왕은 하나요 … 은 하나입니다’처럼 간결한 계수식으로 옮겼습니다.
  alternative_readings:
  - ‘여리고 왕이 하나입니다. 아이 왕이, 벧엘 곁에 있는, 하나입니다.’
  - ‘여리고 왕 한 명, 벧엘 곁에 있는 아이 왕 한 명.’
  rationale: 히브리어는 연속된 명사구와 결론적 ‘אֶחָד’으로 수를 셉니다. 한국어도 설명을 덧붙이기보다 목록체의 압축성을 유지하는 편이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 본문의 역사 서술/계수 표현 보존
