  language: ko
  text: 아벡 왕은 한 명, 사론 왕은 한 명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶ֤לֶךְ
  english_pob_choice: the king of
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 정복 목록의 간결한 열거 구조를 살리기 위해 기본적으로 ‘왕’으로 옮겼습니다. 영어 POB처럼 관사성은 한국어에서 따로 드러내지 않았습니다.
- source_word: אֲפֵק֙
  english_pob_choice: Aphek
  chosen_korean: 아벡
  alternatives_korean:
  - 아벡
  - 아벡 성읍
  lexicon: 고유명사 표기 관행
  rationale: 지명 고유명사는 음역이 적절하므로 한국어 표기 관행에 따라 ‘아벡’으로 옮겼습니다.
- source_word: אֶחָ֔ד
  english_pob_choice: one
  chosen_korean: 하나
  alternatives_korean:
  - 한 사람
  - 한 명
  lexicon: HALOT
  rationale: 각 항목의 수를 짧게 셈하는 표현이므로 ‘하나’로 간결하게 살렸습니다.
- source_word: לַ/שָּׁר֖וֹן
  english_pob_choice: Sharon
  chosen_korean: 사론
  alternatives_korean:
  - 사론
  - 사론 땅
  lexicon: HALOT
  rationale: 지명으로서의 사론을 그대로 음역하되, 영어 POB가 취한 것처럼 추가 해설은 넣지 않아 목록의 압축성을 유지했습니다.
