source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
  footnotes:
  - marker: a
    text: Or 'and the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that goes up to Seir.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 요르단 강 서쪽[a]에서 여호수아와 이스라엘 자손이 쳐부순 그 땅의 왕들입니다. 곧 바알갓에서 레바논 골짜기까지, 그리고 세일 쪽으로 올라가는 할락 산[b]에 이르기까지입니다. 여호수아는 그것을 이스라엘의 지파들에게 그들의 분할에 따라 기업으로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요르단 강 건너편 서쪽’입니다. 히브리어는 ‘이스라엘 자손’을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘세일로 올라가는’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה מַלְכֵי הָאָרֶץ
  english_pob_choice: And these are the kings of the land
  chosen_korean: 이들은 그 땅의 왕들입니다
  alternatives_korean:
  - 이들은 땅의 왕들입니다
  - 그리고 이들은 그 땅의 왕들입니다
  lexicon: HALOT
  rationale: 목록 도입 공식은 한국어에서 자연스럽게 ‘이들은’으로 시작해도 본문의 지시 기능이 유지되며, ‘그 땅’은 정관적 범위를 살립니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐부순
  alternatives_korean:
  - 쳐서 죽인
  - 쳐서 무찌른
  - 쳐부수신
  lexicon: HALOT
  rationale: 정복 문맥의 נכה는 단순한 타격보다 전투적 격파를 가리키므로, 현대어에서 힘을 살리는 ‘쳐부순’이 적절합니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  english_pob_choice: beyond the Jordan westward
  chosen_korean: 요르단 강 서쪽
  alternatives_korean:
  - 요르단 강 너머 서쪽
  - 요르단 강 서편
  lexicon: HALOT
  rationale: 지리 방향을 한국어에서 가장 자연스럽게 전달하는 표현으로 정리하되, 본문의 서쪽 방향성을 분명히 유지했습니다.
- source_word: מִבַּעַל גָּד ... וְעַד הָהָר הֶחָלָק הָעֹלֶה שֵׂעִירָה
  english_pob_choice: from Baal-gad ... as far as Mount Halak, which rises toward Seir
  chosen_korean: 바알갓에서 레바논 골짜기까지, 그리고 세일 쪽으로 올라가는 할락 산까지
  alternatives_korean:
  - 바알갓에서 레바논 골짜기까지, 그리고 세일로 올라가는 할락 산까지
  - 바알갓에서 레바논 골짜기에서부터 세일로 올라가는 할락 산까지
  lexicon: HALOT
  rationale: 지명은 음역을 따르고, ‘올라가는’으로 הָעֹלֶה의 지형적 진행을 살렸습니다. ‘쪽으로’는 방향성을 유지하면서 단정적 목적지를 과하게 못 박지 않습니다.
- source_word: וַיִּתְּנֶהּ ... לְשִׁבְטֵי יִשְׂרָאֵל יְרֻשָּׁה כְּמַחְלְקֹתָם
  english_pob_choice: Joshua gave it to the tribes of Israel as an inheritance according to their divisions
  chosen_korean: 여호수아는 그것을 이스라엘의 지파들에게 그들의 분할에 따라 기업으로 주었습니다
  alternatives_korean:
  - 여호수아는 그것을 이스라엘의 지파들에게 그들의 구분에 따라 기업으로 주었습니다
  - 여호수아는 그것을 이스라엘의 지파들에게 그들의 몫에 따라 기업으로 주었습니다
  lexicon: HALOT
  rationale: ‘기업’은 שָׁל/יְרֻשָּׁה의 언약적 분배 의미를 살리며, ‘분할’은 כְּמַחְלְקֹתָם의 분배 단위를 비교적 직역적으로 반영합니다.
