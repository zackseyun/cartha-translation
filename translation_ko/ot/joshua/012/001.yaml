id: JOS.12.1
reference: Joshua 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: Now these are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
  footnotes:
  - marker: a
    text: Or 'the Israelites'; Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'toward the rising of the sun,' that is, eastward.
    reason: lexical_alternative
  - marker: c
    text: '''Wadi'' refers to a streambed or torrent valley; some translations render ''brook'' or ''valley of the Arnon.'''
    reason: cultural_note
  - marker: d
    text: Or 'the plain'; 'Arabah' is a specific geographic term for the rift valley region.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 이스라엘 자손이 쳐서 정복하고 그들의 땅을 차지한 땅의 왕들입니다. 요단 저편[a], 해 뜨는 쪽 곧 아르논 골짜기에서부터 헤르몬 산까지[b][c]와 온 아라바[d] 동쪽입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’; 히브리어는 ‘이스라엘의 자손들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘해의 떠오름을 향하여’, 곧 동쪽을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아르논 골짜기’는 히브리어 נחל의 지리적 용례를 풀어 옮긴 것입니다.
    reason: source_note
  - marker: d
    text: ‘아라바’는 특정한 지리 용어로, 요단 열곡 지대를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 직역 투명성을 살리되 한국어에서 자연스럽고 성경적 관용도 있는 표현으로 옮겼습니다.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  english_pob_choice: whose land they took possession of
  chosen_korean: 그들의 땅을 차지한
  alternatives_korean:
  - 그들의 땅을 점유한
  - 그들의 땅을 소유한
  lexicon: HALOT
  rationale: ירשׁ의 정복 문맥상 ‘소유하다’보다 ‘차지하다’가 땅을 빼앗아 점유했다는 힘을 더 잘 드러냅니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 저편
  alternatives_korean:
  - 요단 강 건너편
  - 요단을 건너
  lexicon: HALOT
  rationale: 지리적 기준점이 되는 관용적 표현을 살리면서도, 뒤따르는 ‘동쪽’이 의미를 분명히 합니다.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  english_pob_choice: toward the sunrise
  chosen_korean: 해 뜨는 쪽
  alternatives_korean:
  - 해 뜨는 곳을 향해
  - 동쪽
  lexicon: HALOT
  rationale: ‘태양이 뜨는 방향’이라는 이미지와 동쪽의 방향성을 함께 살리기 위해 직설적으로 옮겼습니다.
- source_word: מִנַּחַל אַרְנוֹן
  english_pob_choice: from the Wadi Arnon
  chosen_korean: 아르논 골짜기에서부터
  alternatives_korean:
  - 아르논 와디에서부터
  - 아르논 시내에서부터
  lexicon: HALOT
  rationale: נחל의 지리적 용례를 한국어 독자에게 이해되게 하면서도, 본문의 지명 범위를 해치지 않도록 ‘골짜기’로 옮겼습니다.
- source_word: וְכָל הָעֲרָבָה
  english_pob_choice: and all the Arabah
  chosen_korean: 온 아라바
  alternatives_korean:
  - 온 평야
  - 온 아라바 지역
  lexicon: HALOT
  rationale: 아라바는 특정 지명성이 강하므로 일반 명사화하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 정복 서술의 강도
  chosen_reading: ‘쳐서 정복하고’로 옮겨 전쟁적 행위와 점유의 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘무찔러’
  - ‘패배시켜’
  rationale: 히브리어 הִכּוּ와 וַיִּרְשׁוּ의 결합은 단순 승리보다 실제 정복과 점유를 함께 말하므로, 둘 다 보존하는 표현이 가장 소스 충실적입니다.
  doctrine_reference: 서사-역사 본문은 사건의 힘을 약화하지 않고 전달해야 한다는 원칙
- issue: 지리 명칭의 음역과 번역
  chosen_reading: ‘아라바’와 ‘헤르몬’ 같은 고유 지명은 음역을 유지하고, ‘아르논 골짜기’처럼 설명적 요소를 최소한으로만 보탰습니다.
  alternative_readings:
  - ‘평야’
  - ‘강골짜기’
  rationale: 본문은 영토 경계를 나열하는 문맥이므로, 지명성을 지워 버리는 일반명사화보다 원문 지리 감각을 유지하는 쪽이 적합합니다.
  doctrine_reference: 성경 지명의 역사·지리적 구체성을 보존하는 번역 원칙
