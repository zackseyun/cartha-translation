  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
  footnotes:
  - marker: a
    text: Or 'the giants.' The Hebrew Rephaim can refer to an ancient people remembered as unusually great in stature.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 르바임[a]의 남은 자 가운데 한 사람으로서 아스다롯과 에드레이에 살던 바산 왕 옥의 영토입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거인들’로 옮길 수 있습니다. 히브리어 르바임은 고대에 큰 체구로 기억된 민족을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  english_pob_choice: and the territory of
  chosen_korean: 그리고 …의 영토
  alternatives_korean:
  - 그리고 …의 경계
  - 그리고 …의 지역
  lexicon: HALOT
  rationale: גְּבוּל은 경계선뿐 아니라 어떤 통치 아래의 ‘영역/영토’도 가리킬 수 있으므로, 정복 목록의 문맥에서는 ‘영토’가 가장 자연스럽습니다. 앞의 ו는 목록 연결을 살려 ‘그리고’로 옮겼습니다.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  english_pob_choice: king of Bashan
  chosen_korean: 바산의 왕
  alternatives_korean:
  - 바산 왕
  - 바산의 통치자
  lexicon: HALOT
  rationale: 왕권과 지배 영역을 나타내는 정상적인 소유 구조이므로 한국어도 자연스러운 속격 표현으로 옮겼습니다. 고유명사 바산은 음역을 유지했습니다.
- source_word: הָ/רְפָאִ֑ים
  english_pob_choice: the Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 르바임 족속
  lexicon: HALOT
  rationale: 본문은 민족명/지명적 표지인 רְפָאִים을 그대로 유지하는 것이 가장 직접적이므로 음역했습니다. 본문에는 해석을 덧씌우지 않고, ‘거인들’은 주석적 대안으로만 남기는 편이 source-direct합니다.
- source_word: הַ/יּוֹשֵׁ֥ב
  english_pob_choice: who lived
  chosen_korean: 살던
  alternatives_korean:
  - 거주하던
  - 살고 있던
  - 거하던
  lexicon: HALOT
  rationale: ישב의 분사형은 ‘거주하다/살다’의 의미가 기본이므로, 현대 한국어에서는 간결한 ‘살던’이 자연스럽습니다. 분사적 배경 설명을 살려 뒤의 장소들과 연결했습니다.
theological_decisions:
- issue: הָ/רְפָאִים의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘르바임’으로 유지하고, ‘거인들’ 해석은 본문 밖 주석으로 다루는 방식을 택했습니다.
  alternative_readings:
  - 본문에 ‘거인들’로 의역
  - ‘르바임 족속’으로 풀어 설명
  rationale: 본문 자체는 이 집단의 의미를 설명하지 않고 이름을 제시하므로, 번역문에서 곧장 해석어를 넣으면 문맥의 역사적 지시를 약화시킬 수 있습니다. 독자가 전승적 연상을 이해할 수 있도록 주석 가능성은 열어 두되, 본문은 명칭을 보존했습니다.
  doctrine_reference: 본문 해석의 절제와 고유명사 보존 원칙
