source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Ammon'; that is, the Ammonites.
    reason: lexical_alternative
  - marker: b
    text: Hebrew נחל can denote a valley, wadi, or streambed; here it refers to the Arnon and Jabbok as territorial boundaries.
    reason: cultural_note
translation:
  language: ko
  text: 시혼은 헤스본에 살던 아모리 사람들의 왕으로서, 아르논 골짜기 가에 있는 아로엘에서부터 그 골짜기 한가운데와 길르앗의 절반을 지나 암몬 자손의 경계인[a] 얍복 골짜기까지 다스렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘암몬 자손’은 암몬 사람들을 가리키는 족속명 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נחל은 문맥에 따라 골짜기, 와디, 하천 바닥을 가리킬 수 있으며, 여기서는 아르논과 얍복의 경계 지형을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  english_pob_choice: who lived
  chosen_korean: 살던
  alternatives_korean:
  - 거주하던
  - 살고 있던
  - 거하던
  lexicon: HALOT
  rationale: 거주의 지속 상태를 자연스럽게 살리면서도, 현대 한국어에서 가장 읽기 쉬운 현재/과거 관용형으로 옮겼습니다.
- source_word: מֹשֵׁל
  english_pob_choice: ruling
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 군림했습니다
  - 지배했습니다
  lexicon: HALOT
  rationale: 지리적 경계 안에서의 정치적 통치를 가리키므로, 문맥상 중립적이고 명시적인 ‘다스리다’를 선택했습니다.
- source_word: שְׂפַת נַחַל אַרְנוֹן / וְתוֹךְ הַנַּחַל / וְעַד יַבֹּק הַנַּחַל
  english_pob_choice: the bank of the Arnon Valley / from the middle of the valley / as far as the Jabbok Valley
  chosen_korean: 아르논 골짜기 가에 있는 / 골짜기 한가운데와 / 얍복 골짜기에 이르기까지
  alternatives_korean:
  - 아르논 와디의 가장자리
  - 아르논 골짜기의 가장자리
  - 골짜기 안쪽
  - 얍복 와디까지
  lexicon: HALOT
  rationale: נחל을 여기서는 하천 자체보다 경계 지형인 ‘골짜기/와디’로 이해한 POB의 판단을 따랐고, שׂפת는 ‘가에 있는’으로, וְתוֹךְ는 ‘한가운데’로, עַד는 ‘이르기까지’로 자연스럽게 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  - 암몬의 아들들
  lexicon: HALOT
  rationale: 히브리어의 족속 표기를 보존하되, 한국어 성경에서 익숙하면서도 직역성을 유지하는 ‘자손’을 사용했습니다.
