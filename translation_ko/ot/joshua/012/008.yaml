  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בָֽ/עֲרָבָה֙ וּ/בָ֣/אֲשֵׁד֔וֹת וּ/בַ/מִּדְבָּ֖ר וּ/בַ/נֶּ֑גֶב הַֽ/חִתִּי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
  footnotes:
  - marker: a
    text: Or “in the Shephelah,” the name of the western lowland/foothill region.
    reason: lexical_alternative
  - marker: b
    text: “Arabah” is a regional name for the rift valley/desert plain; alternatively, “the desert plain.”
    reason: lexical_alternative
  - marker: c
    text: Or “in the south country”; Hebrew Negev can denote both the southern region and ‘south.’
    reason: lexical_alternative
translation:
  language: ko
  text: 산지와 저지대와 아라바와 비탈과 광야와 네겝, 곧 헷 사람들과 아모리 사람들과 가나안 사람들과 브리스 사람들과 히위 사람들과 여부스 사람들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּהָר
  english_pob_choice: in the hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산악 지대
  - 언덕 지역
  lexicon: HALOT
  rationale: 지형 목록의 첫 항목으로서 단일한 ‘산’보다 지역 범위를 가리키는 ‘산지’가 원문 기능을 더 잘 살립니다.
- source_word: וּבַשְּׁפֵלָה
  english_pob_choice: and in the lowland
  chosen_korean: 저지대
  alternatives_korean:
  - 쉬펠라
  - 구릉 저지대
  lexicon: HALOT
  rationale: 지명 음역인 쉬펠라도 가능하지만, 본문 흐름상 일반 독자에게 더 투명한 ‘저지대’가 적절합니다.
- source_word: וּבָעֲרָבָה
  english_pob_choice: and in the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 요단 계곡
  - 사막 평원
  lexicon: HALOT
  rationale: 고유한 지리명으로 쓰였으므로 음역을 유지해 지역명 성격을 보존했습니다.
- source_word: וּבָאֲשֵׁדוֹת
  english_pob_choice: and on the slopes
  chosen_korean: 비탈
  alternatives_korean:
  - 사면
  - 경사면
  lexicon: HALOT
  rationale: 원문의 ‘경사면/사면’ 뜻을 자연스러운 한국어 한 단어로 압축해 지형 열거의 리듬을 살렸습니다.
- source_word: וּבַנֶּגֶב
  english_pob_choice: and in the Negev
  chosen_korean: 네겝
  alternatives_korean:
  - 남방
  - 남쪽 땅
  lexicon: HALOT
  rationale: 문맥상 남쪽 지역명으로 기능하므로 음역을 유지했습니다.
- source_word: הַחִתִּי / הָאֱמֹרִי / וְהַכְּנַעֲנִי / הַפְּרִזִּי / הַחִוִּי / וְהַיְבוּסִי
  english_pob_choice: the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites, and the Jebusites
  chosen_korean: 헷 사람들, 아모리 사람들, 가나안 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  alternatives_korean:
  - 헷 족속들, 아모리 족속들, 가나안 족속들, 브리스 족속들, 히위 족속들, 여부스 족속들
  lexicon: HALOT
  rationale: 열거된 민족명은 집합적 의미의 복수형으로 옮기되, 한국어 성경에서 널리 통용되는 ‘사람들’ 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 지형 목록과 민족 목록의 쉼표 연결 방식
  chosen_reading: 지형은 ‘와’로 병렬하고, 민족 목록도 원문의 연쇄 구조를 그대로 반영했습니다.
  alternative_readings:
  - 문장부호를 더 강하게 나누어 두 단락처럼 보이게 처리
  rationale: 원문은 정복된 지역과 그곳의 민족들을 한 줄로 열거하는 요약문이므로, 연결 구조를 유지해 정보의 압축감을 살렸습니다.
  doctrine_reference: 본문 구조 보존
