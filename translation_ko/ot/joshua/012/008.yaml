  naturalness: ‘산지와 저지대와 아라바와 비탈과 광야와 네겝’이라는 지형 열거는 자연스럽습니다. 지형 목록 뒤에 쉼표와 ‘곧’을 두어 이어지는 민족 목록이 그 지역들에 관련된 민족들의 열거임을 자연스럽게 드러내는 편이 좋습니다.
