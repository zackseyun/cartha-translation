  text: 또 헤르몬 산과 살르가와 바산 전체를 그술 사람과 마아가 사람의 경계까지 다스리고 있었으며, 길르앗 절반을 헤스본 왕 시혼의 경계까지 다스리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤르몬 산과 살르가와 바산 전체를 그술 사람과 마아가 사람의 경계까지 다스렸으며, 길르앗 절반을 헤스본 왕 시혼의 경계까지 다스렸습니다.’ 히브리어는 분사형을 써서 앞 절의 설명을 이어 갑니다.
    reason: alternative_reading
lexical_decisions:
