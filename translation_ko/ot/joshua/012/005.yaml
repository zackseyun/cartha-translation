theological_decisions:
- issue: 분사 וּמֹשֵׁל의 시제/상
  chosen_reading: 독립된 새 사건이 아니라 앞 절의 통치 설명을 이어 가는 지속적 묘사로 보되, 한국어에서는 매끄럽게 과거 서술로 정리했습니다.
  alternative_readings:
  - ‘다스리고 있었습니다’처럼 진행을 더 드러내는 번역
  - ‘다스리는 자’처럼 명사화하는 번역
  rationale: 영문 POB의 주석처럼 분사 구문은 이전 절의 설명을 계속합니다. 한국어는 문맥상 과거 역사 서술이므로 지나친 진행형보다 자연스러운 서술형이 적절합니다.
  doctrine_reference: 서사 문맥의 연속성과 히브리어 분사 구문의 지속상
