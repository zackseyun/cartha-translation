  source_fidelity: 분사 וּמֹשֵׁל이 앞 절에서 계속되는 오그의 통치 영역을 설명한다는 점은 초안과 주석이 파악합니다. 그러나 본문의 ‘헤스본 왕 시혼의 경계에 이르는 곳을’은 원문의 명사구 나열을 부자연스럽게 재구성하며, ‘곳’은 원문에 없는 요소입니다. 두 경계 표현이 각각 바산 전체와 길르앗 절반의 범위를 한정하도록 드러내는 편이 충실합니다.
