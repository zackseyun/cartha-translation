    rationale: ‘돌의 왕은 돌의 나팔트 지역에 있는 왕, 하나요’는 한 왕을 중복해 서술하며, ‘하나요’도 이 문맥에 맞지 않습니다. 원문의 간결한 계수 목록은 ‘나밧돌에 있는 돌의 왕 하나’로 옮길 수 있습니다.
