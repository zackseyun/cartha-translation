  - 나팔트-돌에 있는
  lexicon: HALOT
  rationale: נָפַת를 단순 설명어로 풀기보다 지명 결합 표현으로 보고, 본문의 지리적 소속을 살리면서도 뜻을 드러내기 위해 ‘지역’으로 옮겼습니다.
- source_word: גּוֹיִם
  english_pob_choice: Goiim
  chosen_korean: 이방 사람들의
  alternatives_korean:
  - 고임의
  - 민족들의
  - 고이임
  lexicon: HALOT
  rationale: 본문이 ‘왕의 이름+지명’처럼 보이지만, 이 항목은 지명인지 일반 명사인지 애매하므로 핵심 의미를 살려 ‘이방 사람들의’로 옮기는 한편, 주석 없이도 읽히게 했습니다.
theological_decisions:
- issue: 지명으로 볼지 일반 명사로 볼지의 애매성
  chosen_reading: 본문은 정복당한 왕 목록의 간결한 기록으로 보고, ‘고이임’은 본문 뜻을 해치지 않는 범위에서 지리적·집합적 표시로 처리했습니다.
  alternative_readings:
  - ‘기갈의 민족들의 왕’
  - ‘기갈의 고이임 왕’
  rationale: 히브리어 גּוֹיִם는 보통 ‘민족들/이방들’이지만, 열거 문맥에서는 지명으로도 이해될 수 있어 본문 과잉해석을 피했습니다.
  doctrine_reference: 본문 해석 원칙
