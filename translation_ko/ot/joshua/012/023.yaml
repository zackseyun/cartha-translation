  text: מֶ֥לֶךְ דּ֛וֹר לְ/נָפַ֥ת דּ֖וֹר אֶחָ֑ד מֶֽלֶךְ גּוֹיִ֥ם לְ/גִלְגָּ֖ל אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/023.yaml
  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
  footnotes:
  - marker: a
    text: Or 'the king of the nations in Gilgal, one.' The Hebrew גּוֹיִם usually means 'nations' or 'peoples,' but here it may function as a place-name or territorial label.
    reason: alternative_reading
  - marker: b
    text: The phrase rendered 'in the heights of Dor' may also be understood more generally as 'in the district/region of Dor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 돌의 왕은 돌의 나팔트 지역에 있는 왕, 하나요. 기갈의 이방 사람들의 왕, 하나입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָפַת-דּוֹר는 ‘돌의 높은 지대’ 또는 ‘돌의 지역’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גּוֹיִם는 보통 ‘민족들’이지만, 여기서는 지명이나 영토 명칭일 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: the king of
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 열거식 정복 목록에서 각 항목의 통치자를 간명하게 가리키므로, 한국어에서는 관사를 두지 않고 ‘왕’으로 자연스럽게 처리했습니다.
- source_word: דּוֹר
  english_pob_choice: Dor
  chosen_korean: 돌
  alternatives_korean:
  - 도르
  - Dor
  lexicon: HALOT
  rationale: 지명은 한국어 성경 관행에 따라 음역하되, 통용 가능한 외래어 표기보다는 히브리어 지명에 맞춰 ‘돌’로 옮겼습니다.
- source_word: לְנָפַת
  english_pob_choice: in Naphath-dor
  chosen_korean: 돌의 나팔트 지역에 있는
  alternatives_korean:
  - 돌의 높은 지역에 있는
  - 돌의 구역에 있는
  - 나팔트-돌에 있는
  lexicon: HALOT
  rationale: נָפַת를 단순 설명어로 풀기보다 지명 결합 표현으로 보고, 본문의 지리적 소속을 살리면서도 뜻을 드러내기 위해 ‘지역’으로 옮겼습니다.
- source_word: גּוֹיִם
  english_pob_choice: Goiim
  chosen_korean: 이방 사람들의
  alternatives_korean:
  - 고임의
  - 민족들의
  - 고이임
  lexicon: HALOT
  rationale: 본문이 ‘왕의 이름+지명’처럼 보이지만, 이 항목은 지명인지 일반 명사인지 애매하므로 핵심 의미를 살려 ‘이방 사람들의’로 옮기는 한편, 주석 없이도 읽히게 했습니다.
theological_decisions:
- issue: 지명으로 볼지 일반 명사로 볼지의 애매성
  chosen_reading: 본문은 정복당한 왕 목록의 간결한 기록으로 보고, ‘고이임’은 본문 뜻을 해치지 않는 범위에서 지리적·집합적 표시로 처리했습니다.
  alternative_readings:
  - ‘기갈의 민족들의 왕’
  - ‘기갈의 고이임 왕’
  rationale: 히브리어 גּוֹיִם는 보통 ‘민족들/이방들’이지만, 열거 문맥에서는 지명으로도 이해될 수 있어 본문 과잉해석을 피했습니다.
  doctrine_reference: 본문 해석 원칙
