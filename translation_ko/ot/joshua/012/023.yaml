  source_fidelity: 현 번역은 גּוֹיִם의 지명/영토 명칭 가능성을 본문에서 ‘이방 사람들’로 단정하고, גִּלְגָּל을 ‘기갈’로 표기하여 원문 및 영어 감사 기록의 지명 처리와 맞지 않습니다. 또한 ‘돌의 왕은 돌의 나팔트 지역에 있는 왕’은 원문의 열거 구조와 통치 관계를 부정확하고 어색하게 만듭니다.
  naturalness: ‘…왕, 하나요’는 현대 한국어 합쇼체의 열거 문장으로 자연스럽지 않습니다. 각 항목을 ‘… 왕 하나’로 병렬하고 마지막에 ‘입니다’를 두면 간결한 목록 문체와 합쇼체를 함께 살릴 수 있습니다.
  terminology: דּוֹר는 ‘돌’, גִּלְגָּל은 통용 표기인 ‘길갈’로 옮깁니다. נָפַת דּוֹר는 지명 결합으로 보아 ‘나밧돌’로 음역하며, גּוֹיִם은 지명 또는 영토 명칭일 수 있는 모호성을 보존하기 위해 ‘고임’으로 음역합니다. ‘이방 사람들’은 본문에서 선택하지 않습니다.
