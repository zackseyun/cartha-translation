translation:
  language: ko
  text: 타아낙 왕은 하나요, 므깃도 왕은 하나입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 각 항목 뒤에 ‘하나’를 반복하는 수량 집계 형식을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: the king of
