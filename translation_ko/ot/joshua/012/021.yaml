  - 그 왕
  lexicon: HALOT
  rationale: 열거형 목록에서 각 도시국가의 통치자를 가리키는 구성어이므로, 한국어에서는 자연스럽게 주격 표지를 붙여 ‘왕은’으로 옮겼습니다.
