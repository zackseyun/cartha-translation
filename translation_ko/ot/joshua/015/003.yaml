  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
  footnotes:
  - marker: a
    text: Akrabbim likely means 'scorpions'; the Hebrew name is transliterated because it functions here as a place name.
    reason: lexical_alternative
  - marker: b
    text: Or 'toward Karkaa'; the place name's English spelling is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 그 경계는 남쪽으로 아크라빔의 오르막길[a]로 나아가서, 신을 지나고, 남쪽에서 올라와 가데스-바네아에 이르며, 헤스론을 지나고, 아다르로 올라가서, 카르카를 향해 돌았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아크라빔은 문자적으로는 ‘전갈들’이라는 뜻이지만, 여기서는 지명으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 카르카로 ‘돌다’는 뜻을 담고 있어, 영어 POB처럼 ‘toward Karka’로도, ‘카르카를 향해’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲלֵה עַקְרַבִּים
  english_pob_choice: to the ascent of Akrabbim
  chosen_korean: 아크라빔의 오르막길
  alternatives_korean:
  - 아크라빔의 비탈
  - 아크라빔의 고갯길
  lexicon: HALOT
  rationale: מַעֲלֵה는 지형을 가리키는 ‘오르막/고개’의 뜻이므로, 경계 문맥에 맞게 ‘오르막길’로 옮기고 고유명은 음역했습니다.
- source_word: צִנָה
  english_pob_choice: to Zin
  chosen_korean: 신
  alternatives_korean:
  - 진
  - 신 광야
  lexicon: HALOT
  rationale: 지명으로 처리해 음역하되, 경계 진행을 나타내는 앞뒤 동사들 때문에 별도의 방향어를 덧붙이지 않았습니다.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  english_pob_choice: went up from the south to Kadesh-barnea
  chosen_korean: 남쪽에서 올라와 가데스-바네아에 이르며
  alternatives_korean:
  - 가데스-바네아 남쪽에서 올라가며
  - 남쪽에서 가데스-바네아로 올라가며
  lexicon: HALOT
  rationale: מִנֶּגֶב은 단순한 위치가 아니라 ‘남쪽에서/남쪽 편에서’의 이동 출발점을 나타내므로, ‘남쪽에서 올라와’로 살려 경계 이동의 방향을 분명히 했습니다.
- source_word: וְנָסַב הַקַּרְקָעָה
  english_pob_choice: and turned toward Karka
  chosen_korean: 카르카를 향해 돌았습니다
  alternatives_korean:
  - 카르카로 돌아섰습니다
  - 카르카 쪽으로 굽어졌습니다
  lexicon: HALOT
  rationale: נסב은 경계선이 방향을 틀어 굽는다는 뜻이므로, 자연스러운 한국어로 ‘돌았습니다’라고 옮기되 목적지 확정은 피하고 ‘향해’로 완화했습니다.
- source_word: אַדָּרָה
  english_pob_choice: Addar
  chosen_korean: 아다르
  alternatives_korean:
  - 아다라
  - 아달
  lexicon: HALOT
  rationale: 고유 지명은 현대 외래어 표기 관행에 따라 음역했습니다.
