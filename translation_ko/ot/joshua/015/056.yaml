lexical_decisions:
- source_word: יִזְרְעֶאל
  english_pob_choice: Jezreel
  chosen_korean: 이즈르엘
  alternatives_korean:
  - 예스르엘
  - 이즈르에엘
  lexicon: HALOT
  rationale: 지명 고유명사는 음역하되, 영어 POB의 표준형 Jezreel을 한국어 표기에 맞게 옮겼습니다.
- source_word: יָקְדְעָם
  english_pob_choice: Jokdeam
  chosen_korean: 욕드에암
  alternatives_korean:
  - 족데암
  - 요크데암
  lexicon: HALOT
  rationale: 고유 지명으로서 의미 번역보다 음역이 적절하며, 영어 POB의 표준형을 한국어 음운에 가깝게 반영했습니다.
- source_word: זָנוֹחַ
  english_pob_choice: Zanoah
  chosen_korean: 자노아
  alternatives_korean:
  - 자노흐
  - 사노아
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따르는 것이 자연스러우므로, 영어 POB의 기존 표기를 한국어로 옮겼습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - 그리고 또한
  lexicon: BDB
  rationale: 세 도시 이름을 잇는 단순 열거이므로, 한국어에서는 접속사로 자연스럽게 나열했습니다.
theological_decisions:
- issue: 지명 목록의 형식과 의미 보존
  chosen_reading: 이 절은 유다 기업 안의 도시명들을 단순 열거하는 목록으로 보아, 설명을 덧붙이지 않고 간결하게 옮겼습니다.
  alternative_readings:
  - 도시 목록임을 본문에 풀어 설명한다
  - 지명들의 지리적 의미를 의역한다
  rationale: 히브리어 본문 자체가 단순한 명사열이므로, 의미를 과장하거나 해설을 삽입하지 않는 것이 원문에 더 가깝습니다.
  doctrine_reference: 본문 비신학적 지명 열거
- issue: 첫 항목의 접속 표현
  chosen_reading: 첫 지명 앞에 한국어 연결어 '그리고'를 두어 목록의 시작을 자연스럽게 표시했습니다.
  alternative_readings:
  - 첫 항목 앞 접속어를 생략한다
  - 쉼표만으로 나열한다
  rationale: 히브리어 וְ가 반복되는 목록 구조를 한국어 목록 문장으로 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 문장 구조 재현
