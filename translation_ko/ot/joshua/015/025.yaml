source:
  edition: WLC
  text: וְ/חָצ֤וֹר חֲדַתָּה֙ וּ/קְרִיּ֔וֹת חֶצְר֖וֹן הִ֥יא חָצֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
  footnotes:
  - marker: a
    text: Or possibly, 'Hazor, Hadattah, and Kerioth-hezron; that is, Hazor,' if חֲדַתָּה is taken as a separate town name rather than part of the compound 'Hazor-hadattah.'
    reason: alternative_reading
  - marker: b
    text: '''Kerioth'' may also be understood as a place name spelled ''Kirioth'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하초르-하다타와, 그리고 기리욧-헤스론(곧 하초르)입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하초르, 하다타, 그리고 기리욧-헤스론, 곧 하초르'로 읽을 수 있습니다. חֲדַתָּה를 '하초르-하다타'의 일부가 아니라 별도의 성읍 이름으로 보는 해석입니다.
    reason: alternative_reading
  - marker: b
    text: '''기리욧''은 영어 표기상 ''Kerioth''뿐 아니라 ''Kirioth''로도 옮길 수 있는 지명입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצ֤וֹר חֲדַתָּה֙
  english_pob_choice: and Hazor-hadattah
  chosen_korean: 하초르-하다타
  alternatives_korean:
  - 새 하초르
  - 하다타 하초르
  - 하초르 하다타
  lexicon: HALOT
  rationale: 연속된 지명 결합으로 보고, 영어 POB의 판단을 따라 설명적 번역보다 음역을 택했습니다. 히브리어의 '새로운' 뉘앙스는 주석으로 남기고 본문에서는 고유지명 형태를 살렸습니다.
- source_word: וּ/קְרִיּוֹת
  english_pob_choice: and Kerioth
  chosen_korean: 기리욧
  alternatives_korean:
  - 케리욧
  - 기리옷
  - 성읍들
  lexicon: HALOT
  rationale: 문맥상 일반명사 '성읍들'이 아니라 지명으로 이해하는 것이 자연스러우므로 고유지명 음역을 사용했습니다. 영어 POB의 'Kerioth/Kirioth'와 대응되도록 한국어 음역은 통용 가능한 표기를 택했습니다.
- source_word: חֶצְרוֹן
  english_pob_choice: -hezron
  chosen_korean: 헤스론
  alternatives_korean:
  - 헤즈론
  - 헤츠론
  lexicon: HALOT
  rationale: 앞선 지명과 하이픈으로 결합된 복합 지명으로 처리했습니다. 한국어에서는 복합 고유명사 표기를 유지하되, 뒤 요소도 음역해 연결성을 드러냈습니다.
- source_word: הִיא חָצוֹר
  english_pob_choice: that is, Hazor
  chosen_korean: (곧 하초르)
  alternatives_korean:
  - (즉 하초르)
  - (그것은 하초르입니다)
  lexicon: HALOT
  rationale: hē'의 설명적 동격을 한국어의 '곧'으로 간결하게 옮겼습니다. 직역형 '그것은'보다 지명 식별 기능이 더 분명하게 드러납니다.
theological_decisions:
- issue: 지명 열거의 동격 관계
  chosen_reading: 본문은 두 지명 항목을 나열한 뒤 마지막에 '곧 하초르'라는 동격 설명을 덧붙인 것으로 이해했습니다.
  alternative_readings:
  - '''하초르-하다타''를 하나의 복합지명으로 읽는 해석'
  - '''하초르, 하다타, 기리욧-헤스론''으로 분리하는 해석'
  rationale: 마소라 악센트와 영어 POB의 주석을 함께 고려하면, 본문에는 복합지명 가능성과 분리 읽기 가능성이 모두 남아 있습니다. 본문은 주된 독해를 따르되, 대안 독해는 주석으로 보존했습니다.
  doctrine_reference: 본문비평/지명 해석
