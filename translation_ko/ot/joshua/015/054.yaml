  lexicon: HALOT
  rationale: 부속된 작은 거주지를 가리키는 말로서, 문맥상 ‘부락들’이 성읍과 구별되는 하위 거주지를 자연스럽게 나타냅니다.
theological_decisions:
- issue: 토지 분배 목록의 지명 배열과 동일시 설명
  chosen_reading: 지명을 그대로 보존하면서 ‘곧 헤브론’으로 설명을 붙여, 본문이 전하려는 역사적 식별을 드러냈습니다.
  alternative_readings:
  - 기럇-아르바, 즉 헤브론
  - 기럇-아르바, 곧바로 헤브론
  rationale: 본문은 단순한 나열이 아니라 옛 이름과 현재 이름의 동일시를 포함하므로, 설명적 동격을 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 성경 본문의 역사적·지리적 진술을 보존하는 번역 원칙
