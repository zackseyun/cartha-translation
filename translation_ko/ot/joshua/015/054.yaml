  text: וְ/חֻמְטָ֗ה וְ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן וְ/צִיעֹ֑ר עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
  footnotes:
  - marker: a
    text: Hebrew 'Kiriath-arba, it is Hebron' identifies the older name Kiriath-arba with Hebron.
    reason: cross_reference
  - marker: b
    text: Or 'their villages.' The Hebrew term can refer to smaller dependent settlements associated with the listed cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 훔다, 기럇-아르바[a], 곧 헤브론, 그리고 시올입니다. 이들은 그에 딸린 촌락들[b]과 함께 아홉 성읍입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘기럇-아르바, 곧 헤브론’이라고 하여 기럇-아르바를 헤브론과 동일한 곳으로 식별합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘마을들’. 히브리어는 주요 성읍들에 딸린 작은 거주지를 가리킬 수 있습니다.
    reason: lexical_alternative
