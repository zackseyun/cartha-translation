source:
  edition: WLC
  text: וְ/חֻמְטָ֗ה וְ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן וְ/צִיעֹ֑ר עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
  footnotes:
  - marker: a
    text: Hebrew 'Kiriath-arba, it is Hebron' identifies the older name Kiriath-arba with Hebron.
    reason: cross_reference
  - marker: b
    text: Or 'their villages.' The Hebrew term can refer to smaller dependent settlements associated with the listed cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 홈다와 기럇-아르바(곧 헤브론)와 지오르입니다. 모두 아홉 성읍과 그 부락들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘기럇-아르바, 곧 헤브론’이라는 식별을 통해 옛 이름과 새 이름을 연결합니다.
    reason: cross_reference
  - marker: b
    text: ‘부락들’은 본문의 חַצְרֵיהֶן이 가리키는 주요 성읍에 딸린 작은 거주지를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  english_pob_choice: Humtah
  chosen_korean: 홈다
  alternatives_korean:
  - 훔다
  - 흄타
  lexicon: HALOT
  rationale: 고유 지명을 음역하되, 한국어 표기는 현대 외래어 표기 감각에 맞춰 간결하게 옮겼습니다.
- source_word: קִרְיַת אַרְבַּע
  english_pob_choice: Kiriath-arba
  chosen_korean: 기럇-아르바
  alternatives_korean:
  - 기랏-아르바
  - 기럇 아르바
  - 아르바의 성읍
  lexicon: HALOT
  rationale: 본문의 확정된 지명으로 기능하므로 직역보다 음역을 택했고, 하이픈은 합성 지명임을 드러냅니다.
- source_word: הִיא חֶבְרֹון
  english_pob_choice: that is, Hebron
  chosen_korean: 곧 헤브론
  alternatives_korean:
  - 즉 헤브론
  - 곧바로 헤브론
  lexicon: HALOT
  rationale: 히브리어의 동일시 용법을 현대 한국어의 설명적 동격 표현인 ‘곧’으로 살려, 기럇-아르바와 헤브론의 동일성을 분명히 했습니다.
- source_word: חַצְרֵיהֶן
  english_pob_choice: their settlements
  chosen_korean: 그 부락들
  alternatives_korean:
  - 그 촌락들
  - 그 정착지들
  - 그 마을들
  lexicon: HALOT
  rationale: 부속된 작은 거주지를 가리키는 말로서, 문맥상 ‘부락들’이 성읍과 구별되는 하위 거주지를 자연스럽게 나타냅니다.
theological_decisions:
- issue: 토지 분배 목록의 지명 배열과 동일시 설명
  chosen_reading: 지명을 그대로 보존하면서 ‘곧 헤브론’으로 설명을 붙여, 본문이 전하려는 역사적 식별을 드러냈습니다.
  alternative_readings:
  - 기럇-아르바, 즉 헤브론
  - 기럇-아르바, 곧바로 헤브론
  rationale: 본문은 단순한 나열이 아니라 옛 이름과 현재 이름의 동일시를 포함하므로, 설명적 동격을 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 성경 본문의 역사적·지리적 진술을 보존하는 번역 원칙
