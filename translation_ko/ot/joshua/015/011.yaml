source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
  footnotes:
  - marker: a
    text: Or "the northern side of Ekron"; the Hebrew combines "shoulder of Ekron" with a northward directional form.
    reason: lexical_alternative
  - marker: b
    text: Or "turned toward Shikkeron"; the verb describes the border line changing direction.
    reason: lexical_alternative
  - marker: c
    text: Hebrew "the outgoings of the border were seaward / at the sea"; this likely indicates the border terminated at the Mediterranean on the west.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 에그론의 어깨 북쪽으로 나아가고, 그 경계는 시그론 쪽으로 굽어 돌아 바알라 산을 지나 야브느엘로 나아갔으며, 경계의 끝은 바다에 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘에그론의 어깨’와 북쪽 방향을 결합해, 에그론의 북쪽 면/쪽을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 경계선이 방향을 바꾸는 것을 뜻하므로, ‘굽어 돌아’ 또는 ‘돌아갔다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서는 경계의 종점이 서쪽 바다, 곧 지중해에 이르렀다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַגְּבוּל
  english_pob_choice: Then the border went out
  chosen_korean: 그 경계는 … 나아가고
  alternatives_korean:
  - 그 경계가 나가고
  - 경계가 이어지고
  lexicon: HALOT
  rationale: 경계선이 다음 지점으로 진행하는 도식적 표현이므로, 한국어에서는 ‘나아가다’가 자연스럽고 지형 설명의 연속성을 살립니다.
- source_word: כֶּתֶף עֶקְרוֹן צָפוֹנָה
  english_pob_choice: the shoulder of Ekron northward
  chosen_korean: 에그론의 어깨 북쪽으로
  alternatives_korean:
  - 에그론의 북쪽 어깨로
  - 에그론의 북쪽 면으로
  lexicon: HALOT
  rationale: כֶּתֶף의 ‘어깨’ 이미지를 살리되, 방향 부사는 뒤에 붙여 경계가 에그론의 북쪽 어깨 쪽에 닿는다는 뜻을 드러냈습니다.
- source_word: תָּאַר
  english_pob_choice: bent toward
  chosen_korean: 쪽으로 굽어 돌아
  alternatives_korean:
  - 쪽으로 돌아
  - 쪽으로 향해
  lexicon: HALOT
  rationale: 지경선이 방향을 바꾸는 동작을 나타내므로, ‘굽어 돌아’가 지형적 전환을 가장 잘 드러냅니다.
- source_word: הַר הַבַּעֲלָה
  english_pob_choice: Mount Baalah
  chosen_korean: 바알라 산
  alternatives_korean:
  - 바알라의 산
  - 바알라 언덕
  lexicon: HALOT
  rationale: הַר는 지명 구성에서 ‘산’으로 옮기는 것이 자연스럽고, 고유명은 음역을 유지했습니다.
- source_word: תֹּצְאוֹת הַגְּבוּל יָמָּה
  english_pob_choice: the ends of the border were at the sea
  chosen_korean: 경계의 끝은 바다에 이르렀습니다
  alternatives_korean:
  - 경계의 끝은 바닷가였습니다
  - 경계의 종점은 바다였습니다
  lexicon: HALOT
  rationale: תֹּצְאוֹת는 경계의 종착점을 뜻하므로 ‘끝’으로 옮겼고, יָמָּה는 여기서 서쪽의 종결점을 가리키는 바다로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 지명형 경계 서술의 반복 구조
  chosen_reading: 반복되는 ‘그 경계는’ 구조를 유지해 경계선이 진행하는 원문의 도식을 보존했습니다.
  alternative_readings:
  - 한 번만 주어를 밝히고 뒤는 생략하는 방식
  - 더 서술적으로 한 문장으로 합치는 방식
  rationale: 이 절은 설명보다 지리적 경로의 순서를 보여 주는 본문이므로, 반복을 줄이기보다 원문의 리듬과 추적 가능성을 살리는 것이 더 충실합니다.
  doctrine_reference: 본문-의미 우선 원칙
- issue: ‘바다’의 방향 의미
  chosen_reading: ‘바다에 이르렀습니다’로 번역해 서쪽 경계의 종결점을 드러냈습니다.
  alternative_readings:
  - ‘서쪽으로 끝났습니다’
  - ‘바다 쪽으로 향했습니다’
  rationale: 히브리어 יָמָּה는 방향 부사로도 읽히지만, 문맥상 경계의 종점이 지중해에 닿는다는 뜻이 분명하므로 종착 의미를 우선했습니다.
  doctrine_reference: 지리 서술 문맥
