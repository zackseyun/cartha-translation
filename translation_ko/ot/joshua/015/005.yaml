  text: וּ/גְב֥וּל קֵ֨דְמָ/ה֙ יָ֣ם הַ/מֶּ֔לַח עַד קְצֵ֖ה הַ/יַּרְדֵּ֑ן וּ/גְב֞וּל לִ/פְאַ֤ת צָפ֨וֹנָ/ה֙ מִ/לְּשׁ֣וֹן הַ/יָּ֔ם מִ/קְצֵ֖ה הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: ko
  text: 동쪽 경계는 염해로서 요단의 입구까지였습니다. 북쪽 경계는 바다 혀에서 시작하여 요단의 입구까지였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘소금 바다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혀’는 바다의 돌출부를 가리키는 지형 표현입니다.
    reason: cultural_note
  - marker: c
    text: POB는 이 지점을 ‘끝’이 아니라 ‘입구(mouth)’로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: הַמֶּלַח / Salt Sea
  english_pob_choice: Salt Sea
  chosen_korean: 염해
  alternatives_korean:
  - 소금 바다
  - 염한 바다
  lexicon: 염해
  rationale: 고유한 지명인 ‘Salt Sea’를 한국어 성경어법에 맞게 짧고 직접적으로 옮겼으며, 문자적 의미도 유지합니다.
- source_word: קְצֵה הַיַּרְדֵּן / mouth of the Jordan
  english_pob_choice: mouth of the Jordan
  chosen_korean: 요단의 입구
  alternatives_korean:
  - 요단의 끝
  - 요단의 어귀
  lexicon: 입구
  rationale: POB가 본문에서 ‘end’ 대신 ‘mouth’를 채택한 지리적 판단을 반영하여, 강의 하구/시작점이라는 공간적 의미를 한국어 ‘입구’로 살렸습니다.
- source_word: מִלְּשׁוֹן הַיָּם / from the tongue of the sea
  english_pob_choice: from the tongue of the sea
  chosen_korean: 바다 혀에서 시작하여
  alternatives_korean:
  - 바다의 혀에서
  - 바다 혀로부터
  lexicon: 혀
  rationale: ‘tongue of the sea’는 지형을 가리키는 관용적 표현이므로, 직역하되 한국어에서 자연스럽게 읽히도록 ‘시작하여’를 보충해 경계의 출발점을 드러냈습니다.
theological_decisions:
- issue: 경계 묘사의 지리적 용어를 직역할지, 관용적으로 풀어쓸지
  chosen_reading: 지리적 지명과 경계 표현을 가능한 한 원문에 가깝게 유지하되, 한국어 문장성은 확보했습니다.
  alternative_readings:
  - 경계를 완전히 현대 지리 용어로 풀어쓰기
  - 전통적 교회 번역식으로 단순화하기
  rationale: 이 절은 신학적 해석보다 토지 경계의 기술이 핵심이므로, 독자가 원문의 공간 관계를 그대로 추적할 수 있도록 직역 성향을 유지하는 것이 적절합니다.
  doctrine_reference: 수 15:5의 지리·경계 서술
- issue: ‘mouth of the Jordan’의 해석
  chosen_reading: ‘요단의 입구’로 옮겨, 강의 하구/경계점이라는 공간적 의미를 반영했습니다.
  alternative_readings:
  - ‘요단의 끝’
  - ‘요단강 하구’
  rationale: 영어 POB가 ‘end’에서 ‘mouth’로 정정한 점을 반영하여, 본문이 단순 종점이 아니라 강의 입구/하구를 가리킨다는 점을 살렸습니다.
  doctrine_reference: 본문 지리 표지에 대한 번역 결정
