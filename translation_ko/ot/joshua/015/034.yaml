    text: 답부아는 지명이며, 해당 히브리어 낱말은 “사과” 또는 과일나무를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 에남은 지명이며, 히브리어 형태에는 정관사가 붙어 있어 문자적으로는 “그 샘들”에 가까운 뉘앙스를 띱니다.
    reason: lexical_alternative
