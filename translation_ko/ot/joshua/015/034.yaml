  text: וְ/זָנ֨וֹחַ֙ וְ/עֵ֣ין גַּנִּ֔ים תַּפּ֖וּחַ וְ/הָ/עֵינָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/034.yaml
  text: Zanoah[a], En-gannim, Tappuah[c][b], and Enam.
  footnotes:
  - marker: a
    text: En-gannim likely means “spring of gardens.”
    reason: lexical_alternative
  - marker: b
    text: Tappuah is a place name; the underlying Hebrew word can also denote “apple” or a fruit tree.
    reason: lexical_alternative
  - marker: c
    text: Enam is a place name; the Hebrew form includes the article, yielding something like “the springs.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사노아와 엔간님, 다부아와 에남입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엔간님은 문자적으로는 “정원의 샘”이라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 다부아는 지명이며, 히브리어 어근은 “사과” 또는 과일나무를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 에남은 지명이며, 히브리어 형태에는 정관사가 붙어 있어 문자적으로는 “그 샘들”에 가까운 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
