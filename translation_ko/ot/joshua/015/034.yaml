  - 지노아
  lexicon: HALOT
  rationale: 본문의 지명은 고유명사이므로 음역하되, 한국어 성경에서 흔히 쓰는 표기를 고려해 사노아로 옮겼습니다.
- source_word: עֵין גַּנִּים
