source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
  footnotes:
  - marker: a
    text: That is, the city of Kiriath-sepher/Debir mentioned in the previous verse.
    reason: cross_reference
  - marker: b
    text: Or possibly 'kinsman of Caleb,' since 'brother' can sometimes be used more broadly for a close relative; the plain sense is 'brother.'
    reason: lexical_alternative
translation:
  language: ko
  text: 옷니엘은 갈렙의 형제, 그나스의 아들로서 그 성을 함락시켰고, 갈렙은 자기 딸 악사를 그의 아내로 그에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞 절에 언급된 기럇세벨/드빌 성입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 그 성을 함락시켰고
  alternatives_korean:
  - 그것을 포획했고
  - 그것을 점령했고
  - 그 성을 사로잡았고
  lexicon: HALOT
  rationale: לכד의 군사적 의미를 살려 ‘함락시키다’로 옮기되, 앞 절의 성을 가리키는 대상을 한국어에서 자연스럽게 보완했습니다.
- source_word: אֲחִי כָלֵב
  english_pob_choice: Caleb’s brother
  chosen_korean: 갈렙의 형제
  alternatives_korean:
  - 갈렙의 형
  - 갈렙의 동족
  - 갈렙의 친족
  lexicon: HALOT
  rationale: אָח의 기본값인 ‘형제’를 유지해 본문이 주는 직계보다 넓은 친족 가능성을 과도하게 좁히지 않되, 본문상 평이한 의미를 살렸습니다.
- source_word: וַיִּתֶּן לוֹ אֶת עַכְסָה בִתּוֹ לְאִשָּׁה
  english_pob_choice: and he gave him his daughter Achsah as a wife
  chosen_korean: 갈렙은 자기 딸 악사를 그의 아내로 그에게 주었습니다
  alternatives_korean:
  - 갈렙은 자기 딸 악사를 아내로 그에게 주었습니다
  - 갈렙은 자기 딸 악사를 그에게 시집보냈습니다
  lexicon: HALOT
  rationale: לְאִשָּׁה의 관용적 의미를 살려 결혼 결부를 분명히 하되, 한국어에서는 ‘아내로 주다’가 가장 직접적으로 원문 구조를 반영합니다.
theological_decisions:
- issue: ‘형제’의 친족 범위
  chosen_reading: 본문은 ‘갈렙의 형제’로 옮기되, 더 넓은 친족 가능성은 주석이 아닌 본문 외 해설로 남깁니다.
  alternative_readings:
  - 갈렙의 친족
  - 갈렙의 동족
  rationale: 영문 POB가 ‘plain sense is brother’라고 두었으므로, 본문에서는 약화하지 않고 직역적 기본값을 유지했습니다.
  doctrine_reference: 본문-역사 해석 원칙
