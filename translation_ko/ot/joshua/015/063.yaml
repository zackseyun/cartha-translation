id: JOS.15.63
reference: Joshua 15:63
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the Jebusite has lived [with/among] the sons of Judah.' The singular ethnic term is collective in sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유다 자손은 예루살렘 주민인 여부스 사람들을 쫓아내지 못했습니다. 그래서 여부스 사람들은 오늘날까지 예루살렘에서 유다 자손과 함께 살아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘여부스 사람이 유다 자손과 함께 살아왔다’입니다. ‘여부스 사람’은 형태상 단수이지만 집합적으로 여부스 사람들 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי / הַיְבוּסִי
  english_pob_choice: the Jebusites
  chosen_korean: 여부스 사람들
  alternatives_korean:
  - 여부스 사람
  - 여부스 족속
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수형이지만 집합적 민족명으로 쓰이므로, 한국어에서는 자연스럽게 복수 집합을 뜻하는 「여부스 사람들」로 옮겼습니다.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민인
  alternatives_korean:
  - 예루살렘에 사는
  - 예루살렘 거주자인
  lexicon: HALOT
  rationale: 분사구가 여부스 사람들을 수식하며 그 정체를 밝히므로, 한국어에서는 앞 명사를 꾸미는 관형절로 처리해 의미 관계를 분명히 했습니다.
- source_word: לֹא יוכלו
  english_pob_choice: could not
  chosen_korean: 쫓아내지 못했습니다
  alternatives_korean:
  - 몰아내지 못했습니다
  - 제거하지 못했습니다
  lexicon: HALOT
  rationale: 본문의 분명한 실패 의미를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘쫓아내다’이며, 여기서의 부정 가능성은 과거 서술로 옮겼습니다.
- source_word: לְהוֹרִישָׁם
  english_pob_choice: dispossess
  chosen_korean: 쫓아내다
  alternatives_korean:
  - 몰아내다
  - 그 땅에서 쫓아내다
  lexicon: HALOT
  rationale: 정복 문맥에서의 ירשׁ 히필은 단순 퇴거보다 ‘상속/점유를 잃게 하다’의 뜻이 있지만, 한국어 독자에게는 결과를 직접 드러내는 ‘쫓아내다’가 가장 자연스럽습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이날까지
  - 지금까지
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간표현을 현대 한국어의 평이한 지속 표현으로 옮겼습니다.
theological_decisions:
- issue: 집합적 민족명과 단수형 표지의 처리
  chosen_reading: 여부스 사람들
  alternative_readings:
  - 여부스 사람
  - 여부스 족속
  rationale: 히브리어 단수형을 그대로 살리면 한국어에서 어색하고 오해를 부를 수 있어, 본문의 집합적 의미를 우선해 복수 집합 명사로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 마지막 절의 지속 상태 표현
  chosen_reading: 여부스 사람들은 오늘까지 예루살렘에서 유다 자손과 함께 살았습니다
  alternative_readings:
  - 여부스 사람들은 오늘까지 유다 자손 가운데 살았습니다
  - 여부스 사람들은 오늘까지 유다 자손 곁에 살았습니다
  rationale: 히브리어의 ‘살았다’는 과거사이면서도 ‘오늘까지’와 결합해 현재까지 이어지는 상태를 나타내므로, 한국어에서는 현재까지의 지속을 분명히 하는 완료형을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
