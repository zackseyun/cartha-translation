  source_fidelity: 전반적으로 히브리어 본문에 충실합니다. 집합적 민족명인 הַיְבוּסִי를 ‘여부스 사람들’로, ‘예루살렘 주민’을 그 동격 수식어로 옮긴 것은 적절합니다. לְהוֹרִישָׁם의 정복 문맥상 의미도 ‘쫓아내지 못했습니다’로 자연스럽게 전달됩니다. 다만 עַד הַיּוֹם הַזֶּה는 번역자의 ‘오늘’이 아니라 본문 서술 시점까지의 지속을 뜻하므로 ‘오늘까지’보다 ‘오늘날까지’가 더 정확하고 관례적입니다.
  naturalness: 합쇼체 문장과 어순은 자연스럽습니다. 그러나 ‘오늘까지 … 살았습니다’는 과거에 끝난 거주로도 읽힐 수 있어, 현재까지 계속되는 상태를 나타내는 ‘오늘날까지 … 함께 살아왔습니다’가 더 명확하고 자연스럽습니다.
  terminology: ‘유다 자손’, ‘여부스 사람들’, ‘예루살렘’은 일관되고 적절합니다. 각주도 히브리어 단수형이 집합적 민족명을 가리킨다는 점뿐 아니라, 마지막 절의 단수형 동사와 ‘유다 자손과 함께’라는 해석을 간결하게 밝혀야 본문의 특이한 표현을 충분히 반영합니다.
  issues:
