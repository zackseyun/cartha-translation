  lexicon: 지명 음역
  rationale: 고유지명 목록의 세 번째 지명도 뜻풀이 없이 음역해야 하므로, 히브리어 자음 배열을 따라 한국어 음운에 맞게 옮겼습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: —과/와… 목록 연결
  alternatives_korean:
