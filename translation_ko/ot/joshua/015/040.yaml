  text: Kabbon[a], Lahmas[c][b], and Kithlish.
  footnotes:
  - marker: a
    text: Or 'Cabbon.' Older English transliterations sometimes use C where modern transliteration prefers K.
    reason: lexical_alternative
  - marker: b
    text: Or 'Lachmas.' The alternative spelling attempts to represent the Hebrew letter ח more explicitly.
    reason: lexical_alternative
  - marker: c
    text: Or 'Chithlish' or 'Cithlish.' These are alternative transliterations of the Hebrew place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 갑본과 라흐마스와 기슬리시입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지명은 현대 음역 관행에 따라 K로 시작해 옮길 수 있습니다(English POB의 Cabbon 대안과 같은 취지).
    reason: lexical_alternative
  - marker: b
    text: ‘라흐마스’는 히브리어 ח의 거친 자음을 더 드러내려는 대안 표기입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기슬리시’는 Chithlish/Cithlish 같은 옛 표기와 달리 현대식 K 음역을 따른 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַבּוֹן
  english_pob_choice: Kabbon
  chosen_korean: 갑본
  alternatives_korean:
  - 카본
  - 캅본
  lexicon: 지명 음역
  rationale: 히브리어 כ의 /k/ 값을 살려 K 계열 음역을 따르되, 한국어 표기는 자음군을 자연스럽게 풀어 읽을 수 있게 했습니다.
- source_word: לַחְמָס
