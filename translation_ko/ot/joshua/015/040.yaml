  text: 갑본과 라흐마스와 기틀리시입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַבּוֹן
  english_pob_choice: Kabbon
  chosen_korean: 갑본
  alternatives_korean:
  - 카본
  - 캅본
  lexicon: 지명 음역
  rationale: 히브리어 כ의 /k/ 값을 살려 K 계열 음역을 따르되, 한국어 표기는 자음군을 자연스럽게 풀어 읽을 수 있게 했습니다.
- source_word: לַחְמָס
  english_pob_choice: Lahmas
  chosen_korean: 라흐마스
  alternatives_korean:
  - 라크마스
  - 라하마스
  lexicon: 지명 음역
  rationale: English POB가 ח를 Lach-로 풀지 않고 Lah-로 옮긴 점을 반영하면서, 한국어에서는 ח의 거친 자음을 '흐'로 표시했습니다.
- source_word: כִתְלִישׁ
  english_pob_choice: Kithlish
  chosen_korean: 기슬리시
  alternatives_korean:
  - 키틀리시
  - 키슬리시
  lexicon: 지명 음역
  rationale: 고유지명 목록의 세 번째 지명도 뜻풀이 없이 음역해야 하므로, 히브리어 자음 배열을 따라 한국어 음운에 맞게 옮겼습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: —과/와… 목록 연결
  alternatives_korean:
  - 그리고
  - 및
  lexicon: 접속사
  rationale: 히브리어의 단순 병렬 나열을 한국어에서도 자연스럽게 보이도록 마지막 항목 앞의 접속으로 처리했습니다.
