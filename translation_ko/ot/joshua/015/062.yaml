  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
  footnotes:
  - marker: a
    text: Or 'their villages' for 'their settlements.' The Hebrew term can denote smaller dependent places associated with the listed cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 니브산과 소금 성읍과 엔게디입니다. 여섯 성읍과 그에 딸린 정착지들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정착지들’은 본문의 히브리어가 가리킬 수 있는 부속 거주지에 대한 넓은 번역입니다. ‘마을들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  english_pob_choice: Nibshan
  chosen_korean: 니브산
  alternatives_korean:
  - 하니브산
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 가장 직접적이므로, 영어 POB의 Nibshan에 맞춰 표준적인 한국어 음역으로 옮겼습니다.
- source_word: עִיר הַמֶּלַח
  english_pob_choice: the City of Salt
  chosen_korean: 소금 성읍
  alternatives_korean:
  - 소금의 성읍
  - 소금 도시
  lexicon: HALOT
  rationale: 히브리어의 ‘도시/성읍 + 소금’이라는 투명한 지명 의미를 살리되, 한국어에서는 자연스럽게 ‘소금 성읍’으로 압축해 옮겼습니다.
- source_word: עֵין גֶּדִי
  english_pob_choice: En-gedi
  chosen_korean: 엔게디
  alternatives_korean:
  - 엔-게디
  - 샘 염소
  lexicon: HALOT
  rationale: 이미 정착된 지명은 관용적 음역을 따르는 것이 적절하므로, 한국어 성경에서 널리 쓰이는 형태에 가깝게 옮겼습니다.
- source_word: חַצְרֵיהֶן
  english_pob_choice: their settlements
  chosen_korean: 그에 딸린 정착지들
  alternatives_korean:
  - 그 마을들
  - 그 속한 촌락들
  - 그들의 거처들
  lexicon: HALOT
  rationale: 이 말은 주된 성읍에 딸린 부속 거주지를 가리킬 수 있으므로, 영어 POB의 ‘settlements’를 따라 ‘정착지들’로 넓게 옮겨 과도한 특정화를 피했습니다.
