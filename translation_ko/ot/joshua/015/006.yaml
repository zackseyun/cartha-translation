base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
  footnotes:
  - marker: a
    text: Or 'Bohan’s stone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 베이트호글라까지 올라가고, 베이트아라바 북쪽을 지나며, 그 경계는 르우벤의 아들 보한의 돌까지 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보한의 돌’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה / הַגְּבוּל
  english_pob_choice: the border went up
  chosen_korean: 그 경계는 … 올라갔습니다
  alternatives_korean:
  - 그 경계는 … 올라갔습니다
  - 경계선이 … 올라갔습니다
  lexicon: WLC; HALOT
  rationale: 경계 묘사에서 עלה는 지형의 상승과 경로 진행을 함께 나타내므로, 한국어에서도 ‘올라가다’로 살리되 문장 흐름을 자연스럽게 했습니다.
- source_word: בֵּית חָגְלָה
  english_pob_choice: Beth-hoglah
  chosen_korean: 베이트호글라
  alternatives_korean:
  - 벳호글라
  - 베스호글라
  lexicon: 고유명사 음역
  rationale: 장소명은 의미역보다 음역이 적절하므로, 현대 외래어 표기감에 맞게 분절하여 옮겼습니다.
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  english_pob_choice: passed north of Beth-arabah
  chosen_korean: 베이트아라바 북쪽을 지나며
  alternatives_korean:
  - 베이트아라바 북쪽을 지나며
  - 베이트아라바의 북편을 지나
  lexicon: HALOT
  rationale: מן + צפון은 경계 문맥에서 ‘~의 북쪽/북편’의 위치를 가리키므로, 직역보다 한국어 관용에 맞게 ‘북쪽을 지나며’로 처리했습니다.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  english_pob_choice: the stone of Bohan son of Reuben
  chosen_korean: 르우벤의 아들 보한의 돌
  alternatives_korean:
  - 르우벤의 아들 보한의 돌
  - 보한의 돌, 르우벤의 아들
  lexicon: HALOT
  rationale: 히브리어의 소유-연결 구조를 따라 ‘…의 돌’로 유지했고, בן רְאוּבֵן은 POB의 ‘son of Reuben’을 반영해 족보적 식별을 분명히 했습니다.
