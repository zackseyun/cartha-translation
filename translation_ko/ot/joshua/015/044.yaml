  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/קְעִילָ֥ה וְ/אַכְזִ֖יב וּ/מָֽרֵאשָׁ֑ה עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
  footnotes:
  - marker: a
    text: Or 'their settlements.' The Hebrew term can refer to dependent rural places associated with a city.
    reason: lexical_alternative
translation:
  language: ko
  text: 게일라와 아그십과 마레사니 — 아홉 성읍과 그 주변 마을입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְעִילָה
  english_pob_choice: Keilah
  chosen_korean: 게일라
  alternatives_korean:
  - 기일라
  - 케일라
  lexicon: 고유명사 표기
  rationale: 지명은 음역하는 것이 원문 대상을 그대로 드러내며, 영어 POB의 Keilah에 대응해 한국어에서는 표준 외래어 표기 관행에 따라 게일라로 옮겼습니다.
- source_word: אַכְזִיב
  english_pob_choice: Achzib
  chosen_korean: 아그십
  alternatives_korean:
  - 악십
  - 아크십
  lexicon: 고유명사 표기
  rationale: 히브리어 지명 어형을 음역해 보존하되, 한국어 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: מָרֵאשָׁה
  english_pob_choice: Mareshah
  chosen_korean: 마레사
  alternatives_korean:
  - 마레샤
  - 마레사흐
  lexicon: 고유명사 표기
  rationale: 고유 지명은 뜻풀이보다 음역이 적절하므로, 영어 POB의 Mareshah에 맞춰 한국어 음역으로 처리했습니다.
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍
  alternatives_korean:
  - 도시
  - 읍
  lexicon: HALOT
  rationale: 여호수아의 분배 목록에서 עָרִים는 단순한 현대적 '도시'보다 성읍이 더 자연스럽고, 목록의 행정적·정착지적 의미를 잘 살립니다.
- source_word: חַצְרֵיהֶן
  english_pob_choice: their villages
  chosen_korean: 그 주변 마을
  alternatives_korean:
  - 그 마을들
  - 그 종속 마을들
  lexicon: HALOT
  rationale: 이 표현은 성읍에 딸린 의존적 촌락들을 가리키므로, 한국어에서는 관용적이면서도 관계를 드러내는 '주변 마을'로 옮겼습니다.
