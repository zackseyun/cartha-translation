    issue: 지명 표기가 통용 성서 표기와 다릅니다.
    rationale: קְעִילָה와 אַכְזִיב은 한국어 성서 전통에서 각각 ‘그일라’, ‘악십’으로 정착되어 있습니다. ‘게일라’, ‘아그십’은 독자가 다른 지명으로 오인할 수 있습니다.
  - severity: medium
    issue: ‘그 주변 마을’이 חַצְרֵיהֶן의 소속 관계를 충분히 나타내지 못합니다.
    rationale: 이 말은 단지 성읍 가까이에 있는 마을보다 각 성읍에 딸린 농촌 정착지들을 뜻할 수 있으므로 ‘그 딸린 마을들’이 더 정확합니다.
  - severity: low
    issue: 마레사 뒤의 ‘-니’는 현대 합쇼체 문체에 맞지 않습니다.
    rationale: 목록에서는 쉼표와 대시가 현대적이고 자연스러우며 원문의 병렬도 유지합니다.
  revised_text: 그일라와 악십과 마레사 — 아홉 성읍과 그 딸린 마을들[a]입니다.
