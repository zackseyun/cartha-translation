translation:
  language: ko
  text: 산지에 있는 샤미르, 야띠르, 그리고 소고입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 산지에’에 가깝지만, 여기서는 계속되는 도시 목록의 일부입니다.
    reason: source_note
  - marker: b
    text: Jattir는 ‘Yattir’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: Socoh는 ‘Sokoh’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/הָר
  english_pob_choice: In the hill country
  chosen_korean: 산지에 있는
  alternatives_korean:
  - 그리고 산지에 있는
  - 산지의
  - 산지에서
  lexicon: HALOT
  rationale: 전치사와 명사의 결합은 직역하면 ‘그리고 산지에’에 가깝지만, 도시 목록의 서두에서는 한국어에서 자연스러운 목록 도입으로 정리해도 본뜻이 유지됩니다.
