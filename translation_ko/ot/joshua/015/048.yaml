  rationale: 이 절은 이전 지명 목록을 이어 가는 표제적 구문이므로, 영어 POB의 판단처럼 한국어에서도 매끄러운 목록 제시가 우선입니다.
  doctrine_reference: 본문 구조/담화 기능
