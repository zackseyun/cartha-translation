  lexicon: 고유명사 음역
  rationale: יו/י 계열의 지명은 ‘Jattir’의 영어형보다 히브리어 음가에 더 가까운 ‘야띠르’가 적절하므로, 가능 음역 중 이를 택했습니다.
- source_word: וְ/שׂוֹכֹה
  english_pob_choice: Socoh
  chosen_korean: 소고
  alternatives_korean:
  - 소코
  - 소코흐
  lexicon: 고유명사 음역
  rationale: 이 지명은 한국어 성서 지리에서 통용되는 ‘소고’를 사용해 식별성을 확보하되, 히브리어 어형의 끝자음을 과도하게 드러내지 않았습니다.
theological_decisions:
