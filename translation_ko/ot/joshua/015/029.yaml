  text: 바알라[a]와 이임[b]과 에셈[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바알라’는 일부 영어 성경의 ‘Balah’와 달리 마소라 본문의 형태를 더 직접 반영한 음역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘이임’은 ‘무너진 곳들’이라는 어휘 뜻과 관련될 수 있으나, 이곳에서는 지명으로 처리했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘에셈’은 히브리어 עָצֶם의 지명 표기를 따른 것이며, 영어 성경 전통에서는 ‘Azem’으로도 표기합니다.
    reason: lexical_alternative
