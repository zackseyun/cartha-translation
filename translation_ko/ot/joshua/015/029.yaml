id: JOS.15.29
reference: Joshua 15:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּעֲלָ֥ה וְ/עִיִּ֖ים וָ/עָֽצֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/029.yaml
  text: Baalah[a], Iyyim[c][b], and Ezem.
  footnotes:
  - marker: a
    text: Some English versions read 'Balah' here, likely influenced by parallel town lists; the Masoretic Text reads Baalah.
    reason: alternative_reading
  - marker: b
    text: The name Iyyim may be related to the Hebrew word for 'ruins' or 'heaps,' but in this context it is treated as a place name and transliterated.
    reason: lexical_alternative
  - marker: c
    text: Some English versions spell this name 'Azem'; 'Ezem' more directly reflects the Hebrew vocalization in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 바알라와 이임들과 에셈입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바알라’는 일부 영어 성경의 ‘Balah’와 달리 마소라 본문의 형태를 더 직접 반영한 음역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘이임’은 ‘무너진 곳들’이라는 어휘 뜻이 있지만, 이곳에서는 지명으로 처리했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘에셈’은 영어 전통의 ‘Azem’보다 히브리어 모음형을 더 직접 반영한 표기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  english_pob_choice: Baalah
  chosen_korean: 바알라
  alternatives_korean:
  - 발라
  - 바알라
  lexicon: HALOT
  rationale: 고유 지명으로 보아 음역하는 것이 적절하며, 영어 POB의 Baalah를 따라 히브리어 자음·모음 형태를 비교적 직접적으로 반영했습니다.
- source_word: עִיִּים
  english_pob_choice: Iyyim
  chosen_korean: 이임들
  alternatives_korean:
  - 이임
  - 이이임
  - 무너진 곳들
  lexicon: HALOT
  rationale: 문맥상 성읍 목록의 지명으로 처리해야 하므로 뜻풀이(‘무너진 곳들’)보다 음역을 택했고, 복수형 느낌을 살려 ‘-들’을 붙였습니다.
- source_word: עָצֶם
  english_pob_choice: Ezem
  chosen_korean: 에셈
  alternatives_korean:
  - 아젬
  - 에젬
  lexicon: HALOT
  rationale: 고유 지명으로 음역했으며, 영어 POB의 Ezem처럼 히브리어 발음을 보다 직접적으로 반영하는 표기를 선택했습니다.
- source_word: וְ/וָ
  english_pob_choice: and
  chosen_korean: 와
  alternatives_korean:
  - 그리고
  lexicon: 문맥상 접속사
  rationale: 열거 목록이므로 한국어 자연스러운 연결형 ‘와’를 사용했습니다.
theological_decisions:
- issue: 이 절의 지명 나열을 번역할지 음역할지
  chosen_reading: 세 성읍 이름을 뜻풀이하지 않고 음역으로 유지했습니다.
  alternative_readings:
  - ‘무너진 곳들’처럼 어휘 의미를 반영하는 번역
  - 전통적 한국 교회식 표기 중심 번역
  rationale: 본문은 성읍 목록의 지명을 제시하므로, 의미역보다 지명 보존이 저자의 의도를 더 정확히 전달합니다.
  doctrine_reference: 지명 보존과 본문 의미의 직접 전달
