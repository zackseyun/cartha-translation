id: JOS.15.12
reference: Joshua 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
  footnotes:
  - marker: a
    text: Hebrew 'the sea, the Great Sea'; that is, the Mediterranean Sea, marking Judah's western side.
    reason: cultural_note
  - marker: b
    text: Or 'according to their families.' The Hebrew term refers to clan groupings within the tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 서쪽 경계는 큰 바다와 그 해안선입니다[a]. 이것이 유다 자손의 씨족에 따른 사방의 경계입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘바다, 서쪽의 큰 바다’라고 합니다. 이는 유다의 서쪽 경계를 이루는 지중해를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들의 가족에 따라’. 여기서 히브리어는 지파 안의 씨족 단위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם הַיָּמָּה הַגָּדוֹל
  english_pob_choice: And the western border was the Great Sea as a border
  chosen_korean: 서쪽 경계는 큰 바다 곧 경계였습니다
  alternatives_korean:
  - 서쪽 변두리는 큰 바다였습니다
  - 서쪽 경계는 대(大) 바다였습니다
  lexicon: HALOT
  rationale: יָם/הַיָּמָּה는 경계 문맥에서 ‘바다 쪽’, 곧 서쪽을 뜻하므로 ‘서쪽 경계’로 풀고, הַגָּדוֹל은 고유한 지리명칭 ‘큰 바다’로 옮겼습니다. 뒤의 גְּבוּל은 영어 POB처럼 동격적 의미를 살려 ‘곧 경계’로 처리했습니다.
- source_word: בְּנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다 자손
  alternatives_korean:
  - 유다의 사람들
  - 유다의 후손들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 그대로 살려 ‘유다 자손’으로 옮겼습니다. 이것은 부족 전체를 가리키는 집합 표현이므로, 의미는 포괄하면서도 원문의 형식을 보존합니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방에
  alternatives_korean:
  - 둘레로
  - 주위에
  lexicon: HALOT
  rationale: סָבִיב은 경계가 둘러싸는 모습을 나타내므로, 현대 한국어에서 자연스러운 ‘사방에’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 지파별 씨족을 따라
  alternatives_korean:
  - 그들의 가문별로
  - 그들의 종족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 분배 문맥에서 부족 내부의 씨족 단위를 가리키므로, ‘씨족’으로 옮기고 분배 기준을 드러내기 위해 ‘지파별 …을 따라’를 보탰습니다.
theological_decisions:
- issue: 지리 경계 서술의 압축된 히브리어 문장 구조
  chosen_reading: ‘큰 바다 곧 경계’로 동격을 살려, 바다가 단순한 배경이 아니라 경계 자체로 기능함을 드러냈습니다.
  alternative_readings:
  - ‘큰 바다가 경계였습니다’
  - ‘큰 바다가 경계 역할을 했습니다’
  rationale: 본문은 짧은 명사구를 이어 경계의 성격을 강조하므로, 서술을 과도하게 풀지 않고 경계-동격을 유지하는 편이 원문의 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
