  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַ֣ר עַצְמ֗וֹנָ/ה וְ/יָצָא֙ נַ֣חַל מִצְרַ֔יִם ו/היה תֹּצְא֥וֹת הַ/גְּב֖וּל יָ֑מָּ/ה זֶה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל נֶֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
  footnotes:
  - marker: a
    text: Or “the Wadi of Egypt.” Hebrew naḥal often refers to a seasonal watercourse or wadi; “River of Egypt” is another traditional rendering, but it may suggest the Nile too strongly in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 아츠몬을 지나 가나안 해변의 시내로 나아가고, 경계의 끝은 바다에 이릅니다. 이것이 너희의 남쪽 경계가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “애굽의 와디”입니다. 히브리어 naḥal은 흔히 계절성 물길이나 와디를 가리키며, “애굽강”으로 옮기면 이 문맥에서 나일강으로 오해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עַצְמֹונָה
  english_pob_choice: Then it passed on to Azmon
  chosen_korean: 아츠몬을 지나
  alternatives_korean:
  - 아츠몬으로 지나
  - 아츠몬을 통과하여
  lexicon: HALOT
  rationale: 경계 기술에서 עבר는 실제 이동보다 경계선의 진행을 뜻하므로, 자연스럽게 ‘지나’로 옮겼습니다.
- source_word: נַחַל מִצְרַיִם
  english_pob_choice: the Brook of Egypt
  chosen_korean: 가나안 해변의 시내
  alternatives_korean:
  - 애굽의 시내
  - 애굽의 와디
  - 애굽의 시내(와디)
  lexicon: HALOT
  rationale: נחל은 큰 강보다 시내·와디를 가리키는 경우가 많아, 지리적으로 ‘시내’로 살리되 ‘애굽의’보다 경계 문맥상 널리 알려진 ‘가나안 해변의 시내’를 택했습니다.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  english_pob_choice: and the boundary ended at the sea
  chosen_korean: 경계의 끝은 바다에 이릅니다
  alternatives_korean:
  - 경계의 끝은 바다 쪽입니다
  - 경계의 끝은 서쪽 바다에 이릅니다
  lexicon: HALOT
  rationale: תֹּצְאוֹת הַגְּבוּל은 경계의 끝점/종착을 뜻하므로, 현대 한국어에서 이해하기 쉬운 ‘끝은 …에 이릅니다’로 옮겼습니다.
- source_word: גְּבוּל נֶגֶב
  english_pob_choice: your southern boundary
  chosen_korean: 너희의 남쪽 경계
  alternatives_korean:
  - 너희의 남방 경계
  - 너희의 네게브 경계
  lexicon: HALOT
  rationale: 여기서 נֶגֶב은 지역명보다 방향 ‘남쪽’을 가리키므로, 의미를 분명히 드러냈습니다.
