id: JOS.15.7
reference: Joshua 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
  footnotes:
  - marker: a
    text: Or 'to Gilgal' instead of 'toward Gilgal'; the Hebrew can denote either orientation toward the site or movement to it within the boundary description.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' refers to a seasonal streambed or ravine; Hebrew נחל often denotes such a watercourse in this kind of topographical description.'
    reason: cultural_note
  - marker: c
    text: Or 'its extremities were at En-rogel'; the Hebrew literally uses a plural form ('its goings out' / 'its outgoings') for the border's termination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 아خور 골짜기에서 데비라까지 올라가서 북쪽으로 돌이켜 길갈을 향하는데, 그곳은 아두밈의 비탈 맞은편이고, 그 비탈은 골짜기 남쪽에 있습니다. 그리고 그 경계는 엔세메스의 물로 지나가며, 그 끝은 엔로겔에 이릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 위치를 ‘길갈로’도, ‘길갈을 향하여’도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 נַחַל은 계절성 물길이나 골짜기를 가리키는 지형 용어입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘그 끝들’이라는 복수형으로 경계의 종결 지점을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  english_pob_choice: the border went up
  chosen_korean: 그 경계는 … 올라가서
  alternatives_korean:
  - 그 경계는 … 올라갔습니다
  - 그 경계선은 … 올라가서
  lexicon: HALOT
  rationale: 경계선의 진행을 묘사하는 עלה는 지형적 상승과 선의 진행을 함께 담으므로, 자연스러운 합쇼체로 ‘올라가서’가 가장 직접적입니다.
- source_word: וְצָפוֹנָה פֹּנֶה אֶל הַגִּלְגָּל
  english_pob_choice: and turned northward toward Gilgal
  chosen_korean: 북쪽으로 돌이켜 길갈을 향하는데
  alternatives_korean:
  - 북쪽으로 향하여 길갈 쪽으로 가는데
  - 북쪽으로 돌며 길갈을 향하는데
  lexicon: HALOT
  rationale: פּנה는 방향 전환을 뜻하므로 ‘돌이켜’가 경계선의 꺾임을 살리며, אֶל은 도착보다 지향을 나타내는 경우가 있어 ‘향하는데’로 옮겼습니다.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  english_pob_choice: which is opposite the Ascent of Adummim
  chosen_korean: 그곳은 아두밈의 비탈 맞은편이고
  alternatives_korean:
  - 그곳은 아두밈의 비탈 건너편이고
  - 그곳은 아두밈의 오르막 맞은편이고
  lexicon: HALOT
  rationale: נֹכַח는 ‘맞은편/대면한’의 뜻이므로 ‘맞은편’이 적절하고, מַעֲלֵה는 지형적 ‘비탈/오르막’이어서 지명 요소를 보존하면서도 한국어로 이해되게 했습니다.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  english_pob_choice: which is south of the wadi
  chosen_korean: 그 비탈은 골짜기 남쪽에 있습니다
  alternatives_korean:
  - 그것은 와디 남쪽에 있습니다
  - 그 비탈은 하천 남쪽에 있습니다
  lexicon: HALOT
  rationale: נַחַל은 문맥상 계절성 물길/골짜기이므로, 독자가 지형을 바로 이해하도록 본문에서는 ‘골짜기’로 옮기되, 와디라는 지리 용어는 주석성 선택으로 처리했습니다.
- source_word: וְעָבַר הַגְּבוּל אֶל מֵי עֵין שֶׁמֶשׁ
  english_pob_choice: Then the border passed on to the waters of En-shemesh
  chosen_korean: 그리고 그 경계는 엔세메스의 물로 지나가며
  alternatives_korean:
  - 그리고 그 경계는 엔세메스의 물로 계속 가며
  - 그런 다음 경계는 엔세메스의 물에 이르며
  lexicon: HALOT
  rationale: עבר는 경계 기술에서 다음 지점으로 ‘지나가다/계속 가다’의 의미가 있어 ‘지나가며’가 선의 진행을 자연스럽게 살립니다.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  english_pob_choice: and its end was at En-rogel
  chosen_korean: 그 끝은 엔로겔에 이릅니다
  alternatives_korean:
  - 그 출구는 엔로겔에 이릅니다
  - 그 끝자락은 엔로겔에 이릅니다
  lexicon: HALOT
  rationale: תֹצְאוֹתָיו의 복수형은 경계의 종결 지점들을 가리킬 수 있지만, 한국어로는 조사 문맥상 ‘그 끝’이 가장 자연스럽고 의미를 크게 훼손하지 않습니다.
theological_decisions:
- issue: 지명과 지형 용어의 현대 한국어화 수준
  chosen_reading: 고유 지명은 음역을 유지하되, נַחַל은 독자가 경계 설명을 이해하도록 ‘골짜기’로 풀어 옮겼습니다.
  alternative_readings:
  - ‘와디’로 음차적 주석을 본문에 반영하는 방식
  - ‘하천’으로 더 일반화하는 방식
  rationale: 이 절은 법정·경계 서술이므로 지형 개념이 즉시 파악되어야 합니다. 다만 본문에서는 과도한 외래 지리 용어보다 한국어 독해 가능성을 우선했습니다.
  doctrine_reference: 성경 지리 서술의 명료성
- issue: 경계 묘사의 동사 연쇄
  chosen_reading: ‘올라가서… 돌이켜… 지나가며… 이릅니다’로 선형적 진행을 살렸습니다.
  alternative_readings:
  - 모두 과거형으로 통일하는 방식
  - ‘올라가며… 돌아… 지나가고… 끝났습니다’로 서술하는 방식
  rationale: 히브리어 경계문은 하나의 선이 지형을 따라 움직이는 시각적 묘사이므로, 한국어에서도 연속 동작을 살려 읽는 이가 경로를 따라가게 하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 본문 수사와 지리적 서술의 재현
