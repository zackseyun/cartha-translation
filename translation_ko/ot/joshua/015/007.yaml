    rationale: ‘아خور’, ‘데비라’, ‘아두밈’은 각각 아골, 드빌(히브리어 방향 접미사는 지명 일부가 아님), 아둠밈으로 정리하는 것이 적절합니다.
  - severity: medium
    issue: נחל을 ‘골짜기’로 번역했습니다.
    rationale: נחל은 이 지형 문맥에서 물길·개울·와디를 가리킵니다. ‘시내’가 본문의 지리적 의미를 더 잘 보존하며, 계절성 물길이라는 설명은 주석으로 보완할 수 있습니다.
