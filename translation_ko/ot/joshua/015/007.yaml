revisions:
- from: 그 경계는 아خور 골짜기에서 데비라까지 올라가서 북쪽으로 돌이켜 길갈을 향하는데, 그곳은 아두밈의 비탈 맞은편이고, 그 비탈은 골짜기 남쪽에 있습니다. 그리고 그 경계는 엔세메스의 물로 지나가며, 그 끝은 엔로겔에 이릅니다.[a][b][c]
  to: 그 경계는 아골 골짜기에서 드빌로 올라가, 북쪽으로 돌아 길갈을 향했습니다.[a] 길갈은 시내[b] 남쪽에 있는 아둠밈 비탈 맞은편에 있습니다. 그 경계는 엔세메스의 물에 이르렀고, 그 끝은 엔로겔에 있었습니다.[c]
  rationale: 원문의 경계 추적 순서와 관계절의 수식 범위를 보존하면서, 통용되는 한국어 지명 표기와 현대적인 합쇼체 과거 서술을 적용했습니다. נחל의 물길 의미를 본문과 주석에서 모두 보존했고, 각주 표지를 해당 표현에 배치했습니다.
