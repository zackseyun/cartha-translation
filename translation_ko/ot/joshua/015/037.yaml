lexical_decisions:
- source_word: צְנָן
  english_pob_choice: Zenan
  chosen_korean: 스난
  alternatives_korean:
  - 제난
  - 젠난
  lexicon: HALOT
  rationale: 지명으로서 음역하는 것이 원문과 POB의 처리를 가장 잘 반영하며, 한국어 표기는 표준 외래어 표기 관행에 따라 ‘스난’으로 옮겼습니다.
