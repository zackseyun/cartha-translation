translation:
  language: ko
  text: 그리고 마아랏, 벧아노트, 엘드곤이 있는데 — 모두 여섯 성읍과 그 촌락들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַצְרֵי는 여기서 성읍에 딸린 시골 거주지나 부속 정착지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  english_pob_choice: and Maarath
  chosen_korean: 마아랏
  alternatives_korean:
  - 마아라트
  - 마아랏
  lexicon: HALOT
  rationale: 고유 지명으로 보아 음역했으며, 한국어에서는 자연스러운 표기인 마아랏을 택했습니다.
- source_word: וּ/בֵית עֲנוֹת
  english_pob_choice: and Beth-anoth
  chosen_korean: 벧아노트
  alternatives_korean:
  - 벧아놋
  - 벧아노트
  - 벧 아노트
  lexicon: HALOT
  rationale: בֵית이 결합된 지명으로서 ‘~의 집’으로 풀지 않고 고유 지명으로 음역했습니다.
- source_word: וְ/אֶלְתְּקֹן
  english_pob_choice: and Eltekon
  chosen_korean: 엘드곤
  alternatives_korean:
  - 엘테콘
  - 엘드곤
  lexicon: HALOT
  rationale: 고유 지명 음역이며, 한국어 음운에 맞는 자연스러운 표기인 엘드곤을 사용했습니다.
- source_word: וְ/חַצְרֵי/הֶן
  english_pob_choice: with their villages
  chosen_korean: 그 촌락들
  alternatives_korean:
  - 그 마을들
  - 그 촌락들
  - 그 정착지들
  lexicon: HALOT
  rationale: חַצְרֵי는 이 분배 목록에서 부속 시골 거주지를 가리키므로, 현대 한국어에서 뜻이 분명한 ‘촌락들’로 옮겼습니다.
theological_decisions:
- issue: 지명 목록의 서술 방식
  chosen_reading: 히브리어의 열거 구조를 따라 장소명과 총수, 그리고 부속 정착지를 간결하게 제시했습니다.
  alternative_readings:
  - 문맥을 풀어 ‘~의 마을들’처럼 설명적으로 번역하는 방식
  rationale: 이 구절은 역사·지리 목록이므로 의미를 보태기보다 원문의 목록성과 행정적 뉘앙스를 보존하는 것이 적절합니다.
  doctrine_reference: 성경 지리/역사 서술의 문맥 보존
