theological_decisions:
- issue: 도시 동격 표기(‘that is, Debir’)의 처리
  chosen_reading: ‘기럇산나 — 곧 데빗입니다’로 두 지명을 동일시하는 설명 구조를 살렸습니다.
  alternative_readings:
  - ‘기럇산나, 즉 데빗’
  - ‘기럇산나(데빗)’
  rationale: 히브리어의 הִיא는 단순한 서술이 아니라 두 지명을 동일시하는 표지이므로, 한국어에서도 동격 관계가 분명히 드러나도록 옮겼습니다.
