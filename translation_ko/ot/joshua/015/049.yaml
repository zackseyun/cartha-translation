translation:
  language: ko
  text: 그리고 단나와, 기럇산나 — 곧 데빗입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דַנָּה
  english_pob_choice: Dannah
  chosen_korean: 단나
  alternatives_korean:
  - 다나
  - 단나 성읍
  lexicon: HALOT
  rationale: 고유 지명은 음역으로 옮기되, 한국어 표기에서는 받침과 모음 조합이 자연스러운 ‘단나’를 택했습니다.
- source_word: וְ/קִרְיַת סַנָּה
  english_pob_choice: Kiriath-sannah
  chosen_korean: 기럇산나
  alternatives_korean:
  - 기랏산나
  - 기럇 사나
  - 산나 성읍
  lexicon: HALOT
  rationale: קִרְיַת은 지명 요소로서 전통적 음역형 ‘기럇’을 유지하고, 뒤의 סַנָּה도 음역하여 합성 지명성을 살렸습니다.
- source_word: הִיא
  english_pob_choice: that is
  chosen_korean: 곧
  alternatives_korean:
  - 즉
  - 그것은
  lexicon: HALOT
  rationale: 동격 설명을 한국어에서 자연스럽게 표시하는 표지로 ‘곧’을 사용했습니다.
- source_word: דְבִר
  english_pob_choice: Debir
  chosen_korean: 데빗
  alternatives_korean:
  - 드비르
  - 데비르
  lexicon: HALOT
  rationale: 지명 דְבִר은 한국어 성경에서 익숙한 형태를 우선해 ‘데빗’으로 음역했습니다.
theological_decisions:
- issue: 도시 동격 표기(‘that is, Debir’)의 처리
  chosen_reading: ‘기럇산나 — 곧 데빗입니다’로 두 지명을 동일시하는 설명 구조를 살렸습니다.
  alternative_readings:
  - ‘기럇산나, 즉 데빗’
  - ‘기럇산나(데빗)’
  rationale: 히브리어의 הִיא는 단순한 서술이 아니라 두 지명을 동일시하는 표지이므로, 한국어에서도 동격 관계가 분명히 드러나도록 옮겼습니다.
  doctrine_reference: 지명 동일시의 문법적·주해적 기능
