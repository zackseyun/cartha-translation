  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
  footnotes:
  - marker: a
    text: Hebrew 'sea-ward,' a standard idiom for 'westward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 경계는 바알라에서 서쪽으로[a] 돌아 세일 산으로 이어지고, 여아림 산, 곧 게살론의 북쪽 비탈을 지나 벧세메스로 내려가 팀나를 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다 쪽으로’이지만, 이 지역 문맥에서는 관용적으로 ‘서쪽으로’를 뜻합니다.
    reason: lexical_alternative
