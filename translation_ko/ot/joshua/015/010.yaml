translation:
  language: ko
  text: 그러고 나서 경계는 바알라에서 서쪽으로 돌이켜 세일 산으로 가고, 기럇여아림의 북쪽 비탈 — 곧 그곳은 게살론입니다 — 로 지나가며, 벧세메스로 내려갔다가 팀나로 지나갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다 쪽으로’이지만, 이 지역 문맥에서는 관용적으로 ‘서쪽으로’를 뜻합니다.
    reason: lexical_alternative
