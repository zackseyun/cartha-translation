id: JOS.15.19
reference: Joshua 15:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר תְּנָ/ה לִּ֣/י בְרָכָ֗ה כִּ֣י אֶ֤רֶץ הַ/נֶּ֨גֶב֙ נְתַתָּ֔/נִי וְ/נָתַתָּ֥ה לִ֖/י גֻּלֹּ֣ת מָ֑יִם וַ/יִּתֶּן לָ֗/הּ אֵ֚ת גֻּלֹּ֣ת עִלִּיּ֔וֹת וְ/אֵ֖ת גֻּלֹּ֥ת תַּחְתִּיּֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
  footnotes:
  - marker: a
    text: Or 'a gift.' The Hebrew says 'a blessing,' using covenantal language for a beneficial grant.
    reason: lexical_alternative
  - marker: b
    text: '''Negev'' can also mean ''southland'' or ''southern region.'''
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may denote springs, pools, or basins of water; 'springs' best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다[a]. “제게 축복을 주십시오. 당신이 네겝의 땅[c][b]을 제게 주셨으니, 물 샘들도 제게 주십시오.” 그래서 그가 그녀에게 윗샘들과 아랫샘들을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘선물’로 옮길 수 있습니다. 히브리어는 ‘축복’이라는 말을 쓰지만, 여기서는 유익한 분배를 뜻하는 언약적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네겝’은 ‘남쪽 지역’ 또는 ‘남방’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 정확히 샘, 샘터, 못의 범주를 둘 수 있으나, 여기서는 문맥상 물 공급원을 가리키는 ‘샘’이 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  english_pob_choice: a blessing
  chosen_korean: 축복
  alternatives_korean:
  - 선물
  - 은혜로운 선물
  lexicon: HALOT
  rationale: 히브리어의 기본 의미인 ‘축복’을 살리되, 여기서는 실제로 유익한 분배를 요청하는 맥락이므로 한국어에서도 종교적 어감과 요청의 성격을 함께 유지하는 ‘축복’이 가장 투명합니다.
- source_word: אֶרֶץ הַנֶּגֶב
  english_pob_choice: the land of the Negev
  chosen_korean: 네겝의 땅
  alternatives_korean:
  - 남쪽 땅
  - 남방 지역의 땅
  lexicon: HALOT
  rationale: 지리 지칭으로 쓰인 נֶגֶב을 고유 지명에 가까운 ‘네겝’으로 옮기고, ‘땅’은 아예 생략하지 않고 살려 원문의 ארץ를 반영했습니다.
- source_word: גֻּלֹּת מָיִם
  english_pob_choice: springs of water
  chosen_korean: 물 샘들
  alternatives_korean:
  - 샘물들
  - 물의 샘들
  - 우물들
  lexicon: HALOT
  rationale: 어근의 정확한 형태는 논의가 있으나 문맥상 물 공급원이라는 점이 핵심이므로, POB의 ‘springs’에 맞춰 한국어에서는 자연스럽게 읽히는 ‘물 샘들’로 옮겼습니다.
- source_word: גֻּלֹּת עִלִּיּוֹת / גֻּלֹּת תַּחְתִּיּוֹת
  english_pob_choice: the upper springs / the lower springs
  chosen_korean: 윗샘들 / 아랫샘들
  alternatives_korean:
  - 위쪽 샘들 / 아래쪽 샘들
  - 상류 샘들 / 하류 샘들
  lexicon: HALOT
  rationale: 상하 대조를 분명히 드러내는 표현으로 ‘윗- / 아랫-’을 택해, 위치 대비와 반복 구조를 한국어에서도 유지했습니다.
theological_decisions:
- issue: 여러 청원형 표현의 공손도
  chosen_reading: 직접 청원은 합쇼체로, 인용문 안에서도 공손한 요청으로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 비문학적인 명령형 느낌으로 처리
  rationale: 본문은 딸이 아버지에게 유익한 분배와 물을 요청하는 장면이므로, 원문의 공손한 청원 뉘앙스를 현대 한국어의 정중한 요청형으로 살리는 것이 적절합니다.
  doctrine_reference: 문맥적 화행 보존
- issue: ‘축복’의 의미 범위
  chosen_reading: ‘축복’을 유지해 언약적·호의적 분배 요청이라는 히브리어 표현을 드러냈습니다.
  alternative_readings:
  - 선물
  - 혜택
  rationale: 히브리어 בְרָכָה는 단순 물건이 아니라 호의적 승인과 유익한 증여를 함께 함축하므로, 지나치게 일반화하지 않고 원어의 표현을 살렸습니다.
  doctrine_reference: 언약 언어의 보존
