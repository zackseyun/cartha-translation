  terminology: ‘축복’과 ‘네겝의 땅’은 원문의 표현과 지리적 지칭을 잘 보존합니다. גֻּלֹּת는 ‘샘들’로 번역하되, 각주에서 ‘샘·못·저수지’ 등의 가능성을 열어 두는 것이 적절합니다. 기존 각주의 ‘범주를 둘 수 있으나’는 비문에 가까우며 의미도 불분명합니다.
