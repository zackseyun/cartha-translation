  source_fidelity: 히브리어 본문의 청원 구조와 ‘축복’, 네겝의 땅, 물의 굴롯, 위·아래 굴롯의 대조는 대체로 충실히 반영했습니다. 다만 גֻּלֹּת의 정확한 뜻이 논쟁적인데, 본문의 ‘샘’은 가능하나 확정적으로 들릴 수 있으므로 각주에서 그 불확실성을 더 정확하고 자연스럽게 밝혀야 합니다.
