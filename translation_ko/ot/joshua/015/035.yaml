lexical_decisions:
- source_word: יַרְמוּת
  english_pob_choice: Jarmuth
  chosen_korean: 여르못
  alternatives_korean:
  - 야르못
  - 자르못
  lexicon: HALOT
  rationale: 사람이나 지명으로서의 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Jarmuth에 대응하되, 한국어 음운에 맞춰 여르못으로 옮겼습니다.
- source_word: וַעֲדֻלָּם
  english_pob_choice: Adullam
  chosen_korean: 아둘람
  alternatives_korean:
  - 아둘렘
  lexicon: HALOT
  rationale: 연결사와 함께 나온 지명이라 목록형으로 자연스럽게 이어 쓰고, 통용되는 지명 음역인 아둘람을 채택했습니다.
- source_word: שׂוֹכֹה
  english_pob_choice: Socoh
  chosen_korean: 소고
  alternatives_korean:
  - 소코
  - 소코흐
  lexicon: HALOT
  rationale: 히브리어 지명 שׂוֹכֹה는 영어 전통 표기가 여러 갈래이므로, 한국어에서는 짧고 표준적인 음역인 소고를 택했습니다.
- source_word: וַעֲזֵקָה
  english_pob_choice: and Azekah
  chosen_korean: 아세가
  alternatives_korean:
  - 아제가
  - 아지카
  lexicon: HALOT
  rationale: 마지막 항목의 접속 의미는 한국어 목록의 쉼표로 자연스럽게 처리하고, 지명은 통용 음역인 아세가로 옮겼습니다.
