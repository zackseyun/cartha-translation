source:
  edition: WLC
  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
  footnotes:
  - marker: a
    text: Or 'their villages.' The Hebrew term refers to dependent settlements associated with the named cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 기럇바알, 곧 기럇여아림과 라바, 두 성읍과 그에 딸린 정착지[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַצְרֵיהֶן은 이 성읍들에 딸린 주변 거주지들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  english_pob_choice: Kiriath-baal
  chosen_korean: 기럇바알
  alternatives_korean:
  - 기럇 바알
  - 바알의 성
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 원칙이므로, 원문의 지명성을 살려 ‘기럇바알’로 옮겼습니다.
- source_word: הִיא
  english_pob_choice: that is
  chosen_korean: 곧
  alternatives_korean:
  - 즉
  - 이는
  lexicon: HALOT
  rationale: 히브리어 הִיא의 설명적·동격적 기능을 한국어에서 자연스럽게 드러내는 연결어로 ‘곧’을 선택했습니다.
- source_word: עָרִים שְׁתַּיִם
  english_pob_choice: two cities
  chosen_korean: 두 성읍
  alternatives_korean:
  - 두 도시
  - 두 고을
  lexicon: HALOT
  rationale: 성읍은 히브리어 עָרִים이 성읍 목록에서 갖는 전통적 지리·행정적 뉘앙스를 비교적 정확하게 반영합니다.
- source_word: חַצְרֵיהֶן
  english_pob_choice: their settlements
  chosen_korean: 그에 딸린 정착지
  alternatives_korean:
  - 그 마을들
  - 그 부속 마을들
  lexicon: HALOT
  rationale: חָצֵר 계열은 본읍에 종속된 주변 거주지를 가리킬 수 있으므로, ‘정착지’에 ‘딸린’을 더해 종속 관계를 분명히 했습니다.
theological_decisions:
- issue: 지명 열거의 종결 방식
  chosen_reading: 문장 끝을 단순한 목록이 아니라 ‘두 성읍입니다’로 마무리해, 본문이 최종적으로 이 지역을 두 성읍과 그 부속 정착지로 요약함을 드러냈습니다.
  alternative_readings:
  - 두 성읍과 그 마을들입니다
  - 두 성읍과 그 촌락들입니다
  rationale: 이 절은 분배 목록의 요약문이므로, 단순 직역보다 독자가 본문의 행정적 요지를 이해하도록 정리하는 것이 적절합니다.
  doctrine_reference: 본문의 지리·역사적 진술
