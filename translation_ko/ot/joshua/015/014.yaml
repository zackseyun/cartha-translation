  source_fidelity: 원문의 וַיֹּרֶשׁ는 사람들을 목적어로 하여 ‘몰아냈습니다’로 적절히 옮겼고, ‘거기서’도 מִשָּׁם을 충실히 반영합니다. 그러나 원문의 마지막 ‘아낙에게서 난 자들’은 앞의 세 인물에 대한 동격·계보 규정인데, 초안은 이를 별도 문장(‘그들은 …’)으로 바꾸어 원문의 한 문장 구조와 동격 관계를 약화합니다.
