id: JOS.15.14
reference: Joshua 15:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤רֶשׁ מִ/שָּׁם֙ כָּלֵ֔ב אֶת שְׁלוֹשָׁ֖ה בְּנֵ֣י הָ/עֲנָ֑ק אֶת שֵׁשַׁ֤י וְ/אֶת אֲחִימַן֙ וְ/אֶת תַּלְמַ֔י יְלִידֵ֖י הָ/עֲנָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
  footnotes:
  - marker: a
    text: Or 'dispossessed from there the three sons of Anak.' The Hebrew verb can emphasize taking possession by driving prior occupants out.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Anak' ... 'those born of Anak.' The verse uses two related genealogical expressions for the same group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갈렙이 거기서 아낙의 세 아들 곧 세새와 아히만과 달매를 몰아냈습니다. 그들은 아낙의 자손이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 아낙의 세 아들을 그들의 소유에서 몰아냈습니다’. 히브리어 동사는 기존 점유자를 내쫓아 소유를 차지하게 하는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아낙의 아들들’과 ‘아낙에게서 태어난 자들’이라는 서로 관련된 계보 표현을 같은 집단에 대해 함께 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  english_pob_choice: drove out
  chosen_korean: 몰아냈습니다
  alternatives_korean:
  - 쫓아냈습니다
  - 내쫓았습니다
  - 몰아냈습니다
  lexicon: HALOT
  rationale: ירשׁ의 사역적 서술은 단순 이동이 아니라 기존 점유자를 물러나게 하는 뜻이므로, 현대 한국어에서 군더더기 없이 그 힘을 살리는 ‘몰아냈습니다’가 적절합니다.
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 거기서
  lexicon: HALOT
  rationale: 지시적 부사구를 자연스러운 서술문으로 옮기되, 원문의 장소 대비를 유지하기 위해 ‘거기서’로 간결하게 렌더링했습니다.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק / יְלִידֵי הָעֲנָק
  english_pob_choice: the three sons of Anak / the children of Anak
  chosen_korean: 아낙의 세 아들 / 아낙의 자손
  alternatives_korean:
  - 아낙의 세 아들 / 아낙에게서 난 자들
  - 아낙의 세 아들 / 아낙의 후손
  lexicon: HALOT
  rationale: 첫 구는 히브리어의 직설적 친족 표현을 살려 ‘아낙의 세 아들’로 두고, 뒤의 יְלִידֵי는 ‘태어난 이들’의 계보적 의미를 살려 ‘자손’으로 옮겨 같은 집단을 한 번 더 규정했습니다.
- source_word: שֵׁשַׁי / אֲחִימַן / תַּלְמַי
  english_pob_choice: Sheshai / Ahiman / Talmai
  chosen_korean: 세새 / 아히만 / 달매
  alternatives_korean:
  - 세새 / 아히만 / 달매
  lexicon: SBL transliteration + established Korean biblical forms
  rationale: 고유명사는 한국어 성경에서 통용되는 음역을 따랐습니다.
theological_decisions:
- issue: ‘sons of Anak’와 ‘children of Anak’의 이중 표현 처리
  chosen_reading: 두 표현을 병렬적으로 살려 계보 표지의 반복과 강조를 드러냈습니다.
  alternative_readings:
  - 둘 중 하나만 번역해 단순화
  - 두 구를 모두 ‘아낙의 후손’으로 통일
  rationale: 원문은 동일 집단을 서로 다른 계보 표현으로 다시 지시하므로, 이를 평준화하면 문장의 강조와 서술 리듬이 약해집니다.
  doctrine_reference: 본문 문맥의 계보/정복 서술 보존
