  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
  footnotes:
  - marker: a
    text: Or "their villages." The Hebrew term refers to smaller dependent settlements associated with the named cities.
    reason: lexical_alternative
translation:
  language: ko
  text: '하크아인, 기브아, 팀나: 이들은 열 도시이며, 그들의 딸린 정착지들도 있었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 마을들.” 히브리어 용어는 이 이름난 도시들과 연결된 더 작은 종속 정착지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
