base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
  footnotes:
  - marker: a
    text: Hebrew 'their villages' can also be rendered 'their settlements' or 'their hamlets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레바옷과 실힘과 아인과 림몬입니다. 이 성읍들은 그 마을들[a]과 함께 모두 스물아홉 곳입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַצְרֵיהֶן은 '그들의 마을들'로 옮겼으며, '그들의 정착지들' 또는 '그들의 촌락들'로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  english_pob_choice: and Lebaoth
  chosen_korean: 레바옷과
  alternatives_korean:
  - 레바옷
  - 레바오트와
  lexicon: HALOT
  rationale: 지명으로 보아 음역을 따랐고, 목록 구조를 살리기 위해 앞의 접속 의미를 한국어 조사 '과'로 반영했습니다.
- source_word: וְשִׁלְחִים
  english_pob_choice: Shilhim
  chosen_korean: 실힘과
  alternatives_korean:
  - 실힘
  - 실핌과
  lexicon: HALOT
  rationale: 고유 지명은 관용 번역보다 음역이 적절하여, 한글 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  english_pob_choice: twenty-nine cities in all
  chosen_korean: 모두 합하여 스물아홉 성읍이며
  alternatives_korean:
  - 모두 스물아홉 성읍이며
  - 합계 스물아홉 성읍이며
  lexicon: HALOT
  rationale: כָּל은 전체 합계를 나타내므로 '모두 합하여'로 자연스럽게 풀었고, עָרִים은 지명 목록의 총괄 표현으로 '성읍'이 적절합니다.
- source_word: וְחַצְרֵיהֶן
  english_pob_choice: with their villages
  chosen_korean: 그 주변의 마을들까지
  alternatives_korean:
  - 그 마을들과 함께
  - 그 부속 마을들까지
  lexicon: HALOT
  rationale: חַצְרֵיהֶן은 단순한 독립 마을보다 본성읍에 딸린 정착지들을 가리킬 수 있어, '마을들'에 포함 관계를 드러내는 표현을 더했습니다.
