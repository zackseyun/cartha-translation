  lexicon: HALOT
  rationale: כָּל은 전체 합계를 나타내므로 '모두 합하여'로 자연스럽게 풀었고, עָרִים은 지명 목록의 총괄 표현으로 '성읍'이 적절합니다.
- source_word: וְחַצְרֵיהֶן
  english_pob_choice: with their villages
  chosen_korean: 그 주변의 마을들까지
  alternatives_korean:
  - 그 마을들과 함께
  - 그 부속 마을들까지
  lexicon: HALOT
  rationale: חַצְרֵיהֶן은 단순한 독립 마을보다 본성읍에 딸린 정착지들을 가리킬 수 있어, '마을들'에 포함 관계를 드러내는 표현을 더했습니다.
