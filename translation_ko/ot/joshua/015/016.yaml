language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
  footnotes:
  - marker: a
    text: Or “the one who strikes Kiriath-sepher and captures it.”
    reason: lexical_alternative
translation:
  language: ko
  text: 갈렙이 말했습니다. "누구든지 기럇세벨을 쳐서 그것을 점령하는 사람에게는 내가 내 딸 악사를 아내로 주겠습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "기럇세벨을 쳐서 그것을 점령하는 사람".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 히브리어 wayyiqtol의 단순한 다음 동작을 과장 없이 옮겼습니다.
- source_word: אֲשֶׁר יַכֶּה ... וּלְכָדָהּ
  english_pob_choice: Whoever strikes ... and captures it
  chosen_korean: 누구든지 ... 쳐서 그것을 점령하는 사람
  alternatives_korean:
  - '...를 치고 빼앗는 사람'
  - '...를 쳐서 사로잡는 사람'
  lexicon: HALOT
  rationale: אֲשֶׁר의 개방형 조건을 '누구든지'로, יַכֶּה/לכד의 군사적 행동을 '치다/점령하다'로 살려 원문의 도전적 선언을 보존했습니다.
- source_word: קִרְיַת סֵפֶר
  english_pob_choice: Kiriath-sepher
  chosen_korean: 기럇세벨
  alternatives_korean:
  - 기럇세페르
  - 기럇-세벨
  lexicon: 고유명사 관행
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 음역을 따랐습니다.
- source_word: בִתִּי לְאִשָּׁה
  english_pob_choice: my daughter as a wife
  chosen_korean: 내 딸 악사를 아내로
  alternatives_korean:
  - 내 딸 악사를 아내로 주겠습니다
  - 내 딸 악사를 아내로 삼게 하겠습니다
  lexicon: HALOT
  rationale: בִתִּי와 לְאִשָּׁה의 직설적 약속을 유지하되, 한국어에서 자연스러운 혼인 제의 표현으로 다듬었습니다.
theological_decisions:
- issue: 아버지가 승자에게 딸을 아내로 주겠다고 약속하는 서술의 윤리적 낯설음
  chosen_reading: 서술 자체를 완화하지 않고, 고대 이스라엘의 전쟁 서사 안에서 갈렙의 공개적 보상 약속으로 그대로 옮겼습니다.
  alternative_readings:
  - 현대 감수성에 맞게 완곡하게 풀어 쓰기
  - 혼인 약속의 성격을 약화해 일반적 보상으로 번역하기
  rationale: 원문이 실제로 말하는 것은 혼인 제안이며, 이를 희석하면 서사의 의미와 긴장이 사라집니다.
  doctrine_reference: 성경 본문의 역사서 서술 원문 보존 원칙
