id: JOS.15.9
reference: Joshua 15:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
  footnotes:
  - marker: a
    text: Or 'the border was marked out' / 'the border turned.' The Hebrew verb in this boundary context can denote tracing or changing direction of the border line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 산 꼭대기에서 네프트아 물의 샘으로 굽어 가서 에브론 산의 성읍들로 이어졌습니다. 이어서 그 경계는 바알라로 굽어 갔습니다. 그곳은 곧 기럇여아림입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתָאַר / וְתָאַר
  english_pob_choice: curved
  chosen_korean: 굽어 내려가다 / 굽다
  alternatives_korean:
  - 돌다
  - 휘어지다
  - 둘러가다
  lexicon: HALOT
  rationale: 경계선이 지형에 따라 방향을 바꾸는 뜻을 살려, 단순한 이동보다 선이 ‘굽는’ 이미지를 한국어로 자연스럽게 살렸습니다.
- source_word: הַגְּבוּל
  english_pob_choice: the border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 변경
  - 국경
  lexicon: HALOT
  rationale: 분배 지경을 말하는 문맥이므로 ‘경계’가 가장 무난하고, 지리적 한계를 정확히 드러냅니다.
- source_word: מֵרֹאשׁ הָהָר
  english_pob_choice: from the top of the mountain
  chosen_korean: 산 꼭대기에서
  alternatives_korean:
  - 산 정상에서
  - 산의 머리에서
  lexicon: HALOT
  rationale: רֹאשׁ의 지형적 의미를 살리되, ‘산 꼭대기’가 현대 한국어에서 가장 자연스럽습니다.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  english_pob_choice: the spring of the waters of Nephtoah
  chosen_korean: 네프트아의 물 샘
  alternatives_korean:
  - 네프트아 물의 샘
  - 네프트아의 샘물
  - 네프트아의 물이 솟는 샘
  lexicon: HALOT
  rationale: 히브리어 소유격 연쇄를 과도하게 풀지 않고, 샘과 물의 관계를 유지하면서도 한국어 어순을 간결하게 정리했습니다.
- source_word: עָרֵי הַר עֶפְרוֹן
  english_pob_choice: the cities of Mount Ephron
  chosen_korean: 에브론 산의 성읍들
  alternatives_korean:
  - 에브론 산의 도시들
  - 에브론 산지의 성읍들
  lexicon: HALOT
  rationale: עָרֵי를 ‘성읍들’로 옮기고, הַר עֶפְרוֹן은 POB의 직역 경향을 따라 ‘에브론 산’으로 유지했습니다.
- source_word: בַּעֲלָה הִיא קִרְיַת יְעָרִים
  english_pob_choice: Baalah (that is, Kiriath-jearim)
  chosen_korean: 바알라로 … 그것이 곧 기럇여아림입니다
  alternatives_korean:
  - 바알라입니다. 곧 기럇여아림입니다
  - 바알라, 즉 기럇여아림입니다
  lexicon: HALOT
  rationale: 본절의 동일시 구조를 한국어의 ‘곧’으로 분명하게 표시해 바알라와 기럇여아림이 같은 장소임을 드러냈습니다.
theological_decisions:
- issue: 지명 동일시의 표현
  chosen_reading: 바알라로 굽었는데, 그것이 곧 기럇여아림입니다
  alternative_readings:
  - 바알라, 즉 기럇여아림입니다
  - 바알라(곧 기럇여아림)입니다
  rationale: 본문은 단순한 별칭이 아니라 지명 동일시를 설명하므로, 본문 흐름 속에서 ‘곧’으로 명시해 독자가 두 지명이 같은 곳임을 이해하도록 했습니다.
  doctrine_reference: 지리·본문 해석상의 명시적 동일시
