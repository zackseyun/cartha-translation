revisions:
- from: 그 경계는 산 꼭대기에서 네프트아의 물 샘으로 굽어 내려가고, 에브론 산의 성읍들로 나갔습니다. 그러고 나서 그 경계는 바알라로 굽었는데, 그것이 곧 기럇여아림입니다.
  to: 그 경계는 산 꼭대기에서 네프트아 물의 샘으로 굽어 가서 에브론 산의 성읍들로 이어졌습니다. 이어서 그 경계는 바알라로 굽어 갔습니다. 그곳은 곧 기럇여아림입니다.
