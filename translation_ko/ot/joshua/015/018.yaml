source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ שָׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
  footnotes:
  - marker: a
    text: Or “she persuaded him” or, more negatively, “she incited him.”
    reason: lexical_alternative
  - marker: b
    text: Or “she dismounted from the donkey”; the Hebrew verb may suggest a sudden descent.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew idiom is literally “What is with you?” meaning “What do you want?” or “What troubles you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 왔을 때, 그녀는 그가 그녀의 아버지에게 밭을 청하도록 재촉했습니다[a]. 그러자 그녀는 나귀에서 내려왔고[b], 갈렙이 그녀에게 말했습니다. “무엇을 원하십니까?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀가 그를 설득했다” 또는, 더 부정적으로는 “그녀가 그를 부추겼다”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나귀에서 내려왔다”; 히브리어 동사는 갑작스러운 하강을 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구는 문자적으로 “너에게 무엇이냐?”이며, 문맥상 “무엇을 원하느냐?” 또는 “무슨 일이냐?”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּסִיתֵהוּ
  english_pob_choice: she urged him
  chosen_korean: 그녀는 그를 재촉하여
  alternatives_korean:
  - 그녀는 그를 설득하여
  - 그녀는 그를 부추겨
  - 그녀는 그를 권하여
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘설득’보다 적극적으로 요청을 밀어붙이는 뉘앙스를 가질 수 있어, 문맥에 맞게 ‘재촉하여’로 옮겼습니다.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  english_pob_choice: to ask her father for a field
  chosen_korean: 자기 아버지에게 밭을 달라고 하게 했습니다
  alternatives_korean:
  - 자기 아버지에게 밭을 요청하게 했습니다
  - 자기 아버지에게 밭을 구하게 했습니다
  - 자기 아버지에게 밭을 청하게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘묻다/요청하다’와 목적어 ‘밭’을 자연스러운 한국어 요청 표현으로 풀어, 청유적이고 구체적인 의미를 살렸습니다.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  english_pob_choice: she got down from the donkey
  chosen_korean: 그녀는 나귀에서 내려왔고
  alternatives_korean:
  - 그녀는 나귀에서 내려졌고
  - 그녀는 나귀에서 급히 내렸고
  - 그녀는 나귀에서 떨어졌고
  lexicon: HALOT
  rationale: צנח는 급격한 하강의 뉘앙스를 둘 수 있지만, 서술 맥락상 ‘내려왔고’가 가장 자연스럽고 과장을 피합니다.
- source_word: מַה לָּךְ
  english_pob_choice: What do you want?
  chosen_korean: 무엇을 원하오?
  alternatives_korean:
  - 무슨 일이오?
  - 무엇이오?
  - 무엇을 바라오?
  lexicon: HALOT
  rationale: 관용구적으로 상대의 의도나 요구를 묻는 말이므로 ‘무엇을 원하오?’가 현대적이면서도 대화의 직접성을 유지합니다.
theological_decisions:
- issue: 갈렙의 말투의 문체 수준
  chosen_reading: “무엇을 원하오?”로 옮겨, 질문의 직접성과 약간의 격식을 함께 유지했습니다.
  alternative_readings:
  - “무엇을 원하십니까?”
  - “무슨 일이 있소?”
  - “무엇을 바라오?”
  rationale: 히브리어 질문은 친근하고 직설적인 짧은 관용구이므로, 지나치게 공손하거나 설명적인 한국어보다 간결한 구어체가 문맥을 더 잘 드러냅니다.
  doctrine_reference: 서사문 대화체의 등록(register) 재현
