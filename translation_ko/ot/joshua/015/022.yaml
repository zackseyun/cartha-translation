translation:
  language: ko
  text: 기나와 디모나와 아다다입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִינָה
  english_pob_choice: Kinah
  chosen_korean: 기나
  alternatives_korean:
  - 킨나
  - 킨하
  - 기낳
  lexicon: HALOT
  rationale: 고유 지명으로서 음역하는 것이 적절하며, 영어 POB의 Kinah를 따라 ק를 ㄱ으로 옮겨 ‘기나’로 표기했습니다.
- source_word: דִּימוֹנָה
  english_pob_choice: Dimonah
  chosen_korean: 디모나
  alternatives_korean:
  - 디모낳
  - 디모나흐
  - 딤오나
  lexicon: HALOT
  rationale: 지명 음역을 유지하되, 영어 POB의 -ah 처리 대신 한국어에서는 자연스러운 외래어 표기형 ‘디모나’로 옮겼습니다.
- source_word: עַדְעָדָה
  english_pob_choice: Adadah
  chosen_korean: 아다다
  alternatives_korean:
  - 아다다흐
  - 아드아다
  - 아다다
  lexicon: HALOT
  rationale: 반복 자음 구조를 살리기 위해 지명 음역을 유지했고, 한국어 표기에서는 끝 -ah를 따로 드러내지 않고 ‘아다다’로 자연스럽게 옮겼습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 와
  alternatives_korean:
  - 그리고
  - 및
  lexicon: HALOT
  rationale: 히브리어 접속사 וְ가 단순 목록을 잇는 기능이므로, 한국어에서도 고유명사 나열을 자연스럽게 연결하는 ‘와’를 사용했습니다.
