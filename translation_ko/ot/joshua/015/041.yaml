  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/גְדֵר֕וֹת בֵּית דָּג֥וֹן וְ/נַעֲמָ֖ה וּ/מַקֵּדָ֑ה עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
  footnotes:
  - marker: a
    text: Beth-dagon is literally 'house of Dagon,' but here it functions as a place name and is therefore transliterated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 게데롯, 베트다곤, 나아마, 므깃다곱니다. 성읍이 열여섯이며 그들의 촌락이 딸려 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 베트다곤은 문자적으로는 ‘다곤의 집’이지만, 여기서는 지명으로 기능하므로 음역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  english_pob_choice: and Gederoth
  chosen_korean: 그리고 게데롯
  alternatives_korean:
  - 그리고 게데롯
  - 그리고 게데로트
  lexicon: HALOT
  rationale: 지명으로 기능하는 고유명사이므로 음역을 따랐습니다. 영어 POB의 Gederoth에 맞춰 한국어에서는 ‘게데롯’으로 옮겨 음가와 지명성을 살렸습니다.
- source_word: בֵּית דָּג֥וֹן
  english_pob_choice: Beth-dagon
  chosen_korean: 베트다곤
  alternatives_korean:
  - 벧다곤
  - 벳다곤
  - ‘다곤의 집’
  lexicon: HALOT
  rationale: 직역하면 ‘다곤의 집’이지만 여기서는 지명으로 기능하므로 음역했습니다. 한국어에서는 복합 지명임을 살리되 자연스러운 표기를 위해 하이픈 없이 연결했습니다.
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍이
  alternatives_korean:
  - 도시가
  - 읍이
  lexicon: HALOT
  rationale: 분배 목록의 행정·지리적 맥락에서 עָרִים은 단순한 ‘도시’보다 ‘성읍’이 더 정확하고 성경적 용례에도 잘 맞습니다.
- source_word: וְ/חַצְרֵי/הֶן
  english_pob_choice: with their villages
  chosen_korean: 그들의 촌락이 딸려 있습니다
  alternatives_korean:
  - 그들의 마을이 딸려 있습니다
  - 그들의 촌락들과 함께입니다
  - 그들의 부속 마을이 있습니다
  lexicon: HALOT
  rationale: חָצֵר의 분배문맥상 의미는 본읍에 속한 부속 취락입니다. ‘촌락’은 영어 POB의 ‘villages’를 반영하면서도, 단순한 현대 행정단위보다 소속 관계를 더 잘 드러냅니다.
