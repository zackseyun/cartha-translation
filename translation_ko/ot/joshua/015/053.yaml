  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/ינים וּ/בֵית תַּפּ֖וּחַ וַ/אֲפֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/053.yaml
  text: and Janim[a], and Beth-tappuah, and Aphekah[c][b];
  footnotes:
  - marker: a
    text: 'Janim: alternatively spelled ''Janim'' in some English traditions.'
    reason: lexical_alternative
  - marker: b
    text: 'Beth-tappuah: alternatively ''Beth Tappuah'' or ''Beth-tappuach.'''
    reason: lexical_alternative
  - marker: c
    text: 'Aphekah: alternatively ''Aphakah''; some English versions shorten the name to ''Aphek.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야님, 그리고 벧다부아, 그리고 아벡하입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야님’은 영어 전통에 따라 Janim으로도 적습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벧다부아’는 Beth-tappuah의 음역입니다. 다른 표기로는 ‘벧 탑푸아’, ‘벧다푸아’가 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아벡하’는 Aphekah의 음역입니다. 일부 번역은 이를 ‘아벡’으로 줄여 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ינים
  english_pob_choice: and Janim
  chosen_korean: 그리고 야님
  alternatives_korean:
  - 그리고 자님
  - 그리고 야님
  lexicon: HALOT
  rationale: 고유 지명 ינים은 의미 번역이 아니라 음역이 적절하며, 영어 POB의 Janim을 반영해 한국어에서도 야님으로 옮겼습니다.
- source_word: וּ/בֵית תַּפּוּחַ
  english_pob_choice: and Beth-tappuah
  chosen_korean: 그리고 벧다부아
  alternatives_korean:
  - 그리고 벧 탑푸아
  - 그리고 벧다푸아
  lexicon: HALOT
  rationale: בֵית은 지명 복합형에서 ‘집’으로 풀기보다 관용적 접두 지명 ‘벧-’으로 옮기는 것이 자연스럽고, תַּפּוּחַ도 음역해 벧다부아로 처리했습니다.
- source_word: וַ/אֲפֵקָה
  english_pob_choice: and Aphekah
  chosen_korean: 그리고 아벡하
  alternatives_korean:
  - 그리고 아페카
  - 그리고 아벡
  lexicon: HALOT
  rationale: אֲפֵקָה는 별개의 지명으로 보존해야 하므로 음역했고, 영어 POB의 Aphekah를 따라 끝의 -ה를 살려 아벡하로 옮겼습니다.
