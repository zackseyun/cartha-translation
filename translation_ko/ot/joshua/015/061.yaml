  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
  footnotes:
  - marker: a
    text: Or 'in the desert.' Hebrew מִדְבָּר can denote sparsely inhabited wilderness or desert terrain depending on context.
    reason: lexical_alternative
  - marker: b
    text: Beth-arabah is a place name; literally, 'house of the Arabah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 광야에 있는 베이트아라바[a], 미딘, 그리고 세가가입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야에서’. 히브리어 מִדְבָּר는 문맥에 따라 사람이 드문 황야나 사막 지형을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  english_pob_choice: In the wilderness
  chosen_korean: 광야에 있는
  alternatives_korean:
  - 광야에
  - 사막에 있는
  lexicon: HALOT
  rationale: 지리적 위치를 나타내는 전치사구로 이해해, 문맥에 맞는 표준 번역인 ‘광야’를 택했습니다. ‘사막’은 너무 건조한 지형에 치우치고, ‘광야에 있는’은 뒤따르는 지명들을 수식하는 관계를 자연스럽게 드러냅니다.
- source_word: בֵּית הָעֲרָבָה
  english_pob_choice: Beth-arabah
  chosen_korean: 베이트아라바
  alternatives_korean:
  - 벧아라바
  - 베스아라바
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 적절하므로, 히브리어 구조를 반영해 ‘Beth-arabah’에 해당하는 음역형을 사용했습니다. ‘집’으로 풀어 번역하면 지명 표지가 약해집니다.
- source_word: מִדִּין
  english_pob_choice: Middin
  chosen_korean: 미딘
  alternatives_korean:
  - 미딘느
  - 미딘
  lexicon: HALOT
  rationale: 고유 지명은 표준적으로 음역했습니다.
- source_word: וּסְכָכָה
  english_pob_choice: and Secacah
  chosen_korean: 그리고 세가가
  alternatives_korean:
  - 그리고 세가카
  - 그리고 세카가
  lexicon: HALOT
  rationale: 히브리어 자음 구조를 살려 고유 지명으로 음역했고, 접속사 וּ는 자연스러운 한국어 연결어 ‘그리고’로 옮겼습니다.
