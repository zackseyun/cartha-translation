  text: וַ/יַּ֣עַל מִ/שָּׁ֔ם אֶל יֹשְׁבֵ֖י דְּבִ֑ר וְ/שֵׁם דְּבִ֥ר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
  footnotes:
  - marker: a
    text: Kiriath-sepher may mean 'City of the Book' or 'City of Writing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그는 드빌의 주민들에게 올라갔습니다. (드빌의 옛 이름은 기럇세페르였습니다.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기럇세페르는 ‘책의 성읍’ 또는 ‘기록의 성읍’으로 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: he went up against
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라갔습니다 — ...를 향해
  - 진격했습니다
  - 올라가서 맞섰습니다
  lexicon: HALOT
  rationale: עלה의 기본 이미지는 ‘올라가다’이므로 그 지형적 움직임을 살리되, 여기서는 전투 맥락을 과도하게 해석하지 않고 문맥상 긴장을 담아 ‘올라갔습니다’로 옮겼습니다.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  english_pob_choice: against the inhabitants of Debir
  chosen_korean: 드빌의 주민들에게
  alternatives_korean:
  - 드빌의 거주자들에게
  - 드빌에 사는 사람들에게
  - 드빌 주민들을 향해
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주하는 사람들/주민들’이므로 이를 자연스럽게 ‘주민들’로 옮겼고, 전쟁적 맥락은 동사의 선택으로 충분히 드러난다고 보았습니다.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  english_pob_choice: Formerly the name of Debir was
  chosen_korean: 드빌의 옛 이름은
  alternatives_korean:
  - 이전에는 드빌의 이름이
  - 드빌의 예전 이름은
  - 드빌의 이름은 전에는
  lexicon: HALOT
  rationale: לְפָנִים은 시간적 의미의 ‘옛/전의’를 뜻하므로, 한국어 관용에 맞게 ‘옛 이름은’으로 간결하게 처리했습니다.
- source_word: קִרְיַת סֵפֶר
  english_pob_choice: Kiriath-sepher
  chosen_korean: 기럇세페르
  alternatives_korean:
  - 기랏세페르
  - 기럇-세페르
  - 책의 성읍
  lexicon: HALOT
  rationale: 지명은 음역을 유지하는 것이 원문 구조에 가장 충실하므로 본문에서는 기럇세페르로 두고, 어원 가능성은 각주에서 처리했습니다.
theological_decisions:
- issue: 지명 기럇세페르의 의미를 본문에 직접 반영할지 여부
  chosen_reading: 본문은 음역을 유지하고, 의미 가능성은 각주로 제한했습니다.
  alternative_readings:
  - 책의 성읍
  - 기록의 성읍
  rationale: 원문은 역사적 지명을 제시하고 있으므로 본문에서 해석을 확정하기보다, 독자가 어원적 가능성을 확인할 수 있도록 각주에 남기는 편이 소스에 더 충실합니다.
  doctrine_reference: 지명/어원 처리 원칙
