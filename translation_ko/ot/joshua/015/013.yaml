id: JOS.15.13
reference: Joshua 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
  footnotes:
  - marker: a
    text: Or 'according to the word of the LORD.' The Hebrew idiom is literally 'according to the mouth of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Father of Anak'' may also mean ''ancestor'' or ''founder'' of Anak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여호수아에게, 야훼의 명령대로, 여호수아에게서 유다 자손들 가운데에서 갈렙에게 몫을 주었습니다. 기럇아르바 — 아낙의 아버지 아르바의 성읍입니다 — 곧 헤브론입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘야훼의 입에 따라’입니다. 문맥상 ‘명령대로’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아낙의 아버지’는 아르바를 가리킬 수도 있고, ‘조상/창시자’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  english_pob_choice: And to Caleb son of Jephunneh
  chosen_korean: 그리고 여호수아에게, ... 갈렙에게
  alternatives_korean:
  - 그리고 갈렙에게
  - 갈렙에게
  lexicon: HALOT
  rationale: 히브리어의 전치사 연결과 문맥상 수혜 대상을 살리되, 한국어에서는 자연스럽게 여격을 드러내어 문장 흐름을 유지했습니다.
- source_word: בְּ/ת֣וֹךְ בְּנֵי יְהוּדָה
  english_pob_choice: among the sons of Judah
  chosen_korean: 유다 자손들 가운데에서
  alternatives_korean:
  - 유다의 아들들 가운데에서
  - 유다 백성들 가운데에서
  lexicon: HALOT
  rationale: 직역의 투명성을 유지하면서도 현대 한국어에서 자연스러운 집합 표현으로 옮겼습니다.
- source_word: אֶל פִּי יְהוָה
  english_pob_choice: according to the command of Yahweh
  chosen_korean: 야훼의 명령대로
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입에 따라
  lexicon: HALOT
  rationale: 관용구 אֶל־פִּי의 의미를 문맥에 맞게 풀어, 땅 분배의 행정적·명령적 뉘앙스를 살렸습니다.
- source_word: אֲבִי הָ/עֲנָק
  english_pob_choice: (Arba was the father of Anak)
  chosen_korean: 아낙의 아버지 아르바의 성읍입니다
  alternatives_korean:
  - 아낙의 아버지인 아르바의 성읍입니다
  - 아낙의 조상 아르바의 성읍입니다
  lexicon: HALOT
  rationale: POB의 수정처럼 ‘아낙의 아버지’는 아르바를 수식하므로, 괄호 구조를 한국어 본문에 맞게 반영했습니다. אָב의 기본 대응은 ‘아버지’로 두되, 주석 없이도 문맥상 인물-성읍 관계가 드러나게 했습니다.
- source_word: הִ֥יא חֶבְרֽוֹן
  english_pob_choice: that is, Hebron
  chosen_korean: 곧 헤브론입니다
  alternatives_korean:
  - 즉 헤브론입니다
  - 헤브론입니다
  lexicon: HALOT
  rationale: 동일시를 나타내는 שִׁיה/הִיא 구문을 현대 한국어의 판별 연결어 ‘곧’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 주어가 생략된 'he gave'의 처리
  chosen_reading: 문맥상 주체를 단정하지 않고, 여호수아와 야훼의 명령을 함께 보이도록 수동적 어순에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘여호수아가 갈렙에게 주었습니다’로 주체를 명시
  - ‘야훼께서 주셨습니다’로 신적 주체를 명시
  rationale: 히브리어는 이 절에서 주어를 명시하지 않으므로, 번역에서 해석을 과도하게 확정하지 않았습니다. 이어지는 ‘야훼의 명령대로 여호수아에게’가 누구의 명령 체계 안에서 이루어진 분배인지 드러내므로, 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 야훼의 고유명 처리
  chosen_reading: 신명기적 전통을 따라 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’로 옮김
  - ‘주님’으로 대체
  rationale: 프로젝트 기본 원칙에 따라 하나님의 이름을 호칭으로 대체하지 않고 직접 표기해, 본문의 고유한 언약적 이름을 드러냈습니다.
  doctrine_reference: Tetragrammaton rendered as Yahweh in POB policy.
