revisions:
- from: 그리고 여호수아에게, 야훼의 명령대로, 여호수아에게서 유다 자손들 가운데에서 갈렙에게 몫을 주었습니다. 기럇아르바 — 아낙의 아버지 아르바의 성읍입니다 — 곧 헤브론입니다.[a][b]
  to: 여분네의 아들 갈렙에게는 유다 자손 가운데에서, 야훼께서 여호수아에게 명하신 대로[a], 몫으로 기럇아르바(아르바는 아낙의 아버지였습니다)[b], 곧 헤브론을 주었습니다.
  rationale: 갈렙의 계보와 유다 지파 내의 분배를 복원하고, 야훼의 명령이 여호수아에게 주어진 것이라는 통사 관계를 바로잡았습니다. ‘주었습니다’의 주어는 한국어에서 생략하여 히브리어의 미표시 주어를 그대로 보존했습니다. 아르바에 대한 설명은 괄호 안의 완전한 절로 처리하여 그가 기럇아르바가 아니라 아낙과 관련된 인물임을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:06:56Z'
