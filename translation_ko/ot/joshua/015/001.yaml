  terminology: מַטֶּה는 ‘지파’, מִשְׁפָּחָה는 지파 내 집단을 나타내는 ‘씨족’, גּוֹרָל은 ‘제비’로 유지했습니다. תֵימָן은 본문에서 ‘남쪽’으로 번역하되, 지명 ‘데만’ 가능성은 각주에 유보했습니다.
