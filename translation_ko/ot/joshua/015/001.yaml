  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
  footnotes:
  - marker: a
    text: Or 'And it was the lot for the tribe of the sons of Judah, according to their clans, to the border of Edom...'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Judah'; this refers to the tribal descendants of Judah.
    reason: cultural_note
  - marker: c
    text: Or 'at the southernmost end.' The Hebrew may also be understood more literally as 'from the extremity of Teman/south.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다 자손[b] 지파가 그들의 씨족에 따라 제비[a]로 받은 땅은 에돔의 경계 쪽, 곧 신 광야의 남쪽 끝까지였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 자손 지파의 제비는 …까지였습니다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘유다 자손’은 유다 지파의 후손들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘남쪽의 가장 끝까지’로 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘데만의 끝에서’ 또는 ‘남쪽의 끝에서’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  english_pob_choice: And the lot ... was
  chosen_korean: 제비 ...는
  alternatives_korean:
  - 그 제비는
  - 그리고 제비는
  lexicon: HALOT
  rationale: גורל을 구체적인 분배 수단인 ‘제비’로 살리고, וַיְהִי는 한국어에서 자연스러운 서술 시작으로 처리했습니다.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  english_pob_choice: for the tribe of the sons of Judah
  chosen_korean: 유다 자손의 지파에 대한
  alternatives_korean:
  - 유다 지파를 위한
  - 유다의 자손 지파에 대한
  lexicon: HALOT
  rationale: ‘지파’와 ‘유다 자손’의 관계를 직역에 가깝게 유지해, tribal-census 문맥의 표현을 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 가문대로
  alternatives_korean:
  - 그들의 종족대로
  - 그들의 가족들대로
  lexicon: HALOT
  rationale: 미슈파호트는 이 문맥에서 단순한 핵가족보다 지파 내부 분절을 가리키므로 ‘가문’이 가장 무난합니다.
- source_word: נֶגְבָּה / מִקְצֵה תֵימָן
  english_pob_choice: southward ... at the farthest south
  chosen_korean: 남쪽, 곧 남쪽의 맨 끝까지
  alternatives_korean:
  - 남쪽, 곧 남쪽의 끝까지
  - 남방으로, 곧 남방의 최남단까지
  lexicon: HALOT
  rationale: 두 표현이 남쪽 경계를 중첩해서 강조하므로, 한국어에서도 방향어를 반복해 경계의 극한성을 보존했습니다.
