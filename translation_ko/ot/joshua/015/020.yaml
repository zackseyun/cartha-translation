translation:
  language: ko
  text: 이것은 유다 자손의 지파가 그들의 종족별로 받은 기업입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This was
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  lexicon: HALOT
  rationale: 문맥상 앞서 설명한 분배 지대를 가리키는 요약문이므로 지시어는 자연스러운 현대 한국어로 옮기되, 시제를 과도하게 해석하지 않기 위해 과거형보다 지시문 형식을 살렸습니다.
- source_word: נַחֲלַת
  english_pob_choice: the inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속받은 소유
  - 상속 유산
  lexicon: HALOT
  rationale: 지파의 토지 분배 문맥에서 נַחֲלָה는 단순한 재산보다 언약적 분배지를 가리키므로, 한국어 성서어법에서 널리 쓰이는 '기업'을 택했습니다.
- source_word: מַטֵּה
  english_pob_choice: the tribe
  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 막대기
  lexicon: HALOT
  rationale: 여기서 מַטֶּה는 문자적인 '막대기'가 아니라 이스라엘의 집단 단위를 뜻하므로 '지파'가 가장 직접적입니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 안의 하위 혈연 단위를 가리키므로, 한국어에서는 '가족'보다 더 작은 집단성을 드러내는 '종족'을 선택해 분배 기준을 살렸습니다.
