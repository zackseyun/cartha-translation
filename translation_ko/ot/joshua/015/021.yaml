id: JOS.15.21
reference: Joshua 15:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ הֶ/עָרִ֗ים מִ/קְצֵה֙ לְ/מַטֵּ֣ה בְנֵֽי יְהוּדָ֔ה אֶל גְּב֥וּל אֱד֖וֹם בַּ/נֶּ֑גְבָּ/ה קַבְצְאֵ֥ל וְ/עֵ֖דֶר וְ/יָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
  footnotes:
  - marker: a
    text: Or 'from the end of the tribe of the sons of Judah'; the Hebrew expression refers to the extremity or outer edge of Judah's territory.
    reason: lexical_alternative
  - marker: b
    text: '''Negev'' can also be rendered ''south'' or ''southern region.'' Here it likely refers to the specific southern district of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: '유다 자손의 지파의 가장자리에 있는 성읍들—곧 에돔의 경계 쪽, 네겝에 있는 성읍들은 이러합니다: 갑세엘, 에델, 야굴입니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 유다의 영토 끝부분이나 바깥 경계를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네겝’은 ‘남쪽’ 또는 ‘남부 지역’으로도 옮길 수 있습니다. 여기서는 유다의 남쪽 특정 지대를 가리키는 지명으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  english_pob_choice: And the cities ... were
  chosen_korean: 성읍들은 이러합니다
  alternatives_korean:
  - 성읍들은 다음과 같습니다
  - 성읍들은 있었습니다
  lexicon: HALOT
  rationale: 열거문 서두에서 וַיִּהְיוּ는 단순 존재 진술보다 목록 소개의 기능이 강하므로, 한국어에서는 자연스럽게 목록을 여는 표현으로 옮겼습니다.
- source_word: מִקְצֵה
  english_pob_choice: at the extremity
  chosen_korean: 가장자리에 있는
  alternatives_korean:
  - 끝에 있는
  - 극단에 있는
  - 외곽에 있는
  lexicon: HALOT
  rationale: 지리적 경계의 ‘가장자리/외곽’라는 뜻을 살려, 문자적이면서도 현대 한국어에서 읽히는 표현을 택했습니다.
- source_word: בְנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다 자손의 지파
  alternatives_korean:
  - 유다 자손의
  - 유다 지파의 자손
  lexicon: HALOT
  rationale: 직역된 ‘유다 자손’을 유지하되, מַטֶּה(지파)와 결합된 전체 구문이 한국어에서 자연스럽도록 ‘지파’를 함께 드러냈습니다.
- source_word: אֶל גְּבוּל אֱדוֹם בַּנֶּגְבָּה
  english_pob_choice: toward the border of Edom in the Negev
  chosen_korean: 에돔의 경계 쪽, 네겝에 있는
  alternatives_korean:
  - 에돔의 경계에 이르는 네겝의
  - 에돔 경계의 남쪽 지역인
  lexicon: HALOT
  rationale: אֶל은 단정적 ‘~에’보다 방향성 있는 ‘~쪽’이 더 잘 맞고, בַּנֶּגְבָּה는 여기서 특정 지명·지역명인 네겝으로 보아 보존했습니다.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  english_pob_choice: Kabzeel, Eder, and Jagur
  chosen_korean: 갑세엘, 에델, 야굴
  alternatives_korean:
  - 갑스엘, 에데르, 야구르
  lexicon: HALOT
  rationale: 지명은 한국어 성경에서 통용되는 음역을 우선하되, 특별히 확정되지 않은 형태는 현대 표기감각에 맞는 음역으로 처리했습니다.
