    rationale: 원문은 산이 힌놈 골짜기 서쪽에 위치함을 말합니다. ‘앞쪽’만으로는 그 관계와 서쪽 방향을 표현하지 못하고, ‘서쪽으로 올라갔습니다’는 경계의 이동 방향처럼 읽힐 수 있습니다.
