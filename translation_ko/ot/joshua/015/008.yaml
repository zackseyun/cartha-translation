  source_fidelity: 초안은 경계가 올라가는 흐름과 서쪽이라는 방향을 대체로 반영합니다. 그러나 כֶּתֶף הַיְבוּסִי를 ‘여부스 사람의 어깨 곁’으로 옮긴 것은 지형 명사를 부자연스럽게 만들며, הִיא יְרוּשָׁלָ͏ִם의 장소 식별을 ‘예루살렘인 여부스 사람’으로 처리하여 여부스 사람을 예루살렘 출신의 사람처럼 오해하게 합니다. 또한 둘째 구절에서 ‘힌놈의 골짜기 앞쪽’은 עַל־פְּנֵי의 위치 관계 및 יָמָּה(서쪽)를 충분히 반영하지 못합니다.
  naturalness: ‘예루살렘인 여부스 사람의 어깨 곁 남쪽’은 현대 표준 한국어의 지명·지형 서술로 자연스럽지 않고 의미 관계가 불명확합니다. ‘남쪽에 있는 여부스 사람의 비탈, 곧 예루살렘’ 및 ‘힌놈 골짜기 서쪽에 있는 산꼭대기’로 하면 명료하고 자연스럽습니다.
  terminology: 고유 지명은 ‘힌놈’, ‘예루살렘’, ‘르바임’을 유지했습니다. כֶּתֶף는 본문의 지형적 뜻에 따라 ‘비탈’로 번역하고, 문자적 ‘어깨’ 및 ‘바다를 향하여’는 각주에서 밝혔습니다. ‘여부스 사람’은 본문에 보존하되, 예루살렘과의 설명적 동일시는 ‘곧 예루살렘’으로 명시했습니다.
