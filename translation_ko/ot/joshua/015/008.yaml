id: JOS.15.8
reference: Joshua 15:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
  footnotes:
  - marker: a
    text: Hebrew 'the shoulder of the Jebusite'; here 'slope' renders the topographical sense of 'shoulder.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it is Jerusalem.' The Hebrew explicitly identifies 'the Jebusite' with Jerusalem.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'toward the sea,' a standard idiom for 'west.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 경계는 힌놈의 골짜기를 따라 올라가 예루살렘인 여부스 사람의 어깨 곁 남쪽에 이르렀고[a][b], 또 경계는 힌놈의 골짜기 앞쪽에 있는 산의 꼭대기, 곧 르바임 골짜기 북쪽 끝에 있는 곳까지 서쪽으로 올라갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘여부스 사람의 어깨’라고 되어 있지만, 여기서는 지형상의 ‘비탈/산자락’의 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그것은 예루살렘이다’라는 식의 설명적 동격으로, 여부스 지역이 예루살렘임을 밝혀 줍니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘바다를 향하여’이지만, 히브리어 지리 관용구에서는 ‘서쪽’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  english_pob_choice: Then the border went up
  chosen_korean: 그리하여 경계는 ... 올라가
  alternatives_korean:
  - 그리고 경계는 ... 올라갔습니다
  - 그런 다음 경계가 ... 올라갔습니다
  lexicon: WLC/통상 지형 서술
  rationale: 경계선 이동을 나타내는 연속적 서술이므로 ‘그리하여’와 ‘올라가’로 자연스럽게 옮기되, 경계의 진행 방향을 살렸습니다.
- source_word: כֶּתֶף הַיְבוּסִי
  english_pob_choice: the slope of the Jebusite
  chosen_korean: 여부스 사람의 어깨 곁
  alternatives_korean:
  - 여부스 사람의 비탈
  - 여부스 사람의 산자락
  lexicon: HALOT
  rationale: 직역은 ‘어깨’이지만 지형 용법상 비탈/산자락의 뜻이므로, POB의 주석 취지를 살려 ‘어깨 곁’으로 처리해 원문 이미지와 지형감을 함께 보존했습니다.
- source_word: הִיא יְרוּשָׁלִָם
  english_pob_choice: that is, Jerusalem
  chosen_korean: 예루살렘인
  alternatives_korean:
  - 곧 예루살렘인
  - 즉 예루살렘인
  lexicon: HALOT
  rationale: 히브리어의 설명적 동격을 한국어 속격·동격 표현으로 압축해, 인물/장소 식별 기능을 드러내되 의미상 단절이 없도록 했습니다.
- source_word: יָמָּה
  english_pob_choice: west
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 바다 쪽으로
  - 서편으로
  lexicon: HALOT
  rationale: 히브리어 관용구상 ‘바다 쪽’이 ‘서쪽’을 뜻하지만, 현대 한국어 지형 서술에서는 ‘서쪽으로’가 가장 분명합니다.
