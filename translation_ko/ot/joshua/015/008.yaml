    rationale: כֶּתֶף는 이 문맥에서 지형의 옆면·비탈을 가리킵니다. ‘어깨 곁’은 지형적 의미를 전달하지 못하며, 각주의 ‘비탈/산자락’과도 일치하지 않습니다.
