  lexicon: HALOT
  rationale: 지명 고유명사는 번역하지 않고 음역하며, 영어 POB의 Libnah에 맞춰 한국어에서는 표준적인 음역 ‘리브나’를 채택했습니다.
- source_word: וָ/עֶתֶר
  english_pob_choice: and Ether
  chosen_korean: 에델
  alternatives_korean:
  - 에터
  lexicon: HALOT
  rationale: 접속사 ו는 앞 항과 같은 목록 구조를 유지해 쉼표로 처리하고, עתר는 지명으로 보아 한국어 음역 ‘에델’을 사용했습니다.
- source_word: וְ/עָשָׁן
  english_pob_choice: and Ashan
  chosen_korean: 아산
  alternatives_korean:
  - 재
  - 연기
  lexicon: HALOT
  rationale: 이 단어는 일반명사로는 ‘연기’의 뜻이 있으나 여기서는 분명한 지명이라 음역 ‘아산’을 택해야 하며, 영어 POB의 주석 취지도 반영했습니다.
