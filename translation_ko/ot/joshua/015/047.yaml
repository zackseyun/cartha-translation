base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
  footnotes:
  - marker: a
    text: Hebrew 'daughters' is an idiom for dependent or satellite towns belonging to a larger city.
    reason: lexical_alternative
  - marker: b
    text: Or 'Wadi of Egypt.' The Hebrew נחל can denote a seasonal watercourse or wadi.
    reason: lexical_alternative
  - marker: c
    text: That is, the Mediterranean Sea.
    reason: cross_reference
translation:
  language: ko
  text: 아스돗과 그 딸린 성읍들과 촌락들[a], 가자와 그 딸린 성읍들과 촌락들, 이집트 시내[b]까지, 또 큰 바다[c]와 그 해안까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘딸들’은 큰 성읍에 딸린 종속 정착지를 가리키는 관용법입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트 와디’. 히브리어 나할(נחל)은 계절하천이나 와디를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉 지중해입니다.
    reason: cross_reference
