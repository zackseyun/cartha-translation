- source_word: הַיָּם
  english_pob_choice: the Great Sea
  chosen_korean: 큰 바다
  alternatives_korean:
  - 지중해
  - 바다
  - 큰 바다 곧 지중해
  lexicon: HALOT
  rationale: 히브리어의 관용적 경계 표현을 따라 직역성 있는 ‘큰 바다’를 쓰고, 의미상 대상은 지중해임을 본문 밖 주석 없이도 충분히 전달되게 했습니다.
