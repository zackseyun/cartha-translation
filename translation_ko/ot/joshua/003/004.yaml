source:
  edition: WLC
  text: אַ֣ךְ רָח֣וֹק יִהְיֶ֗ה בֵּֽינֵי/כֶם֙ ו/בינ/ו כְּ/אַלְפַּ֥יִם אַמָּ֖ה בַּ/מִּדָּ֑ה אַֽל תִּקְרְב֣וּ אֵלָ֗י/ו לְמַ֤עַן אֲשֶׁר תֵּֽדְעוּ֙ אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ כִּ֣י לֹ֧א עֲבַרְתֶּ֛ם בַּ/דֶּ֖רֶךְ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
  footnotes:
  - marker: a
    text: Literally, 'from yesterday and the day before yesterday,' an idiom meaning 'previously' or 'before now.'
    reason: lexical_alternative
  - marker: b
    text: A cubit was a standard ancient unit of length, roughly the length of a forearm.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 너희와 그 사이에는, 곧 측량하기로 약 이천 규빗 되는 거리가 있어야 합니다. 그것에 가까이 가지 마십시오. 그러면 여러분은 가야 할 길을 알게 될 것입니다. 이는 여러분이 이전에는 이 길을 지나본 적이 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘어제와 그제’에 해당하는 관용구로, ‘이전에는’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘규빗’은 고대의 표준 길이 단위로, 대략 팔길이 정도입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 그런데
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 앞 문맥을 제한하면서도 자연스러운 반전으로 이어 주는 접속사이므로, 단순한 대조보다 ‘그런데’가 문맥 기능을 잘 드러냅니다.
- source_word: בֵּינֵיכֶם וּבֵינוֹ
  english_pob_choice: between you and it
  chosen_korean: 너희와 그 사이에는
  alternatives_korean:
  - 너희와 그것 사이에는
  - 너희와 그 사이에
  lexicon: HALOT
  rationale: 문맥상 대상은 언약궤이므로 ‘그’로 가리키되, 거리 관계를 한국어 어순에 맞게 자연스럽게 배치했습니다.
- source_word: כְּאַלְפַּיִם אַמָּה
  english_pob_choice: about two thousand cubits
  chosen_korean: 약 이천 규빗
  alternatives_korean:
  - 대략 이천 규빗
  - 약 삼천 피트
  lexicon: HALOT
  rationale: 원문의 고대 단위를 본문에 유지해 출처 세계의 특수성을 살렸고, כְּ의 근사값은 ‘약’으로 옮겼습니다.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  english_pob_choice: the way by which you shall go
  chosen_korean: 가야 할 길
  alternatives_korean:
  - 가야 하는 길
  - 가게 될 길
  lexicon: HALOT
  rationale: 히브리어의 지시적·실천적 의미를 살리면서도 한국어에서 가장 간결하고 자연스럽게 안내의 뜻을 전달합니다.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  english_pob_choice: before
  chosen_korean: 이전에는
  alternatives_korean:
  - 어제와 그제부터
  - 전에
  lexicon: HALOT
  rationale: 직역형 관용구를 본문에 넣기보다, 본문의 의미인 ‘이전에/아직 겪어 보지 않음’을 현대 한국어로 간명하게 살렸습니다.
theological_decisions:
- issue: 가까이 하지 말라는 명령의 대상 지시
  chosen_reading: ‘그것’은 언약궤를 가리키는 중성적 지시로 처리했습니다.
  alternative_readings:
  - ‘그’를 그대로 두는 방식
  - ‘그분’을 암시하는 식의 인격화
  rationale: 히브리어는 문법적으로 남성형 대명사를 쓰지만, 한국어에서는 사물 참조가 자연스럽고 문맥의 초점도 궤와의 거리 유지에 있습니다.
  doctrine_reference: 문맥 우선의 지시어 처리
