revisions:
- from: 그런데 너희와 그 사이에는, 곧 측량하기로 약 이천 규빗 되는 거리가 있어야 합니다. 그것에 가까이 가지 마십시오. 그러면 여러분은 가야 할 길을 알게 될 것입니다. 이는 여러분이 이전에는 이 길을 지나본 적이 없기 때문입니다.[a][b]
  to: 그러나 여러분과 언약궤 사이에는 측량하여 약 이천 규빗[b]의 거리가 있어야 합니다. 여러분이 가야 할 길을 알 수 있도록 언약궤에 가까이 가지 마십시오. 이는 여러분이 이전에는[a] 이 길을 지나간 적이 없기 때문입니다.
  rationale: 각주 표지를 각각 ‘이전에는’과 ‘규빗’에 붙여 참조 관계를 바로잡았습니다. ‘측량하여 약 이천 규빗의 거리’로 원문의 거리 규정(בַּמִּדָּה)을 자연스럽게 반영했고, 목적 표현을 ‘알 수 있도록’으로 조정했습니다. 문맥상 선행하는 언약궤를 명시하여 한국어 지시어의 어색함과 모호함을 줄였습니다.
