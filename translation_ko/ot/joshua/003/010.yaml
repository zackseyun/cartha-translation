base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
  footnotes:
  - marker: a
    text: Or “he will surely dispossess.” The Hebrew verb emphasizes certain removal from the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 말했습니다. 「이로써 너희는 살아 계신 하나님께서 너희 가운데 계시고, 또 가나안 사람들, 헷 사람들, 히위 사람들, 브리스 사람들, 기르가스 사람들, 아모리 사람들, 여부스 사람들을 너희 앞에서 반드시 쫓아내실[a] 것을 알게 될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘쫓아내다’를 뜻하는 동사를 반복하여, 확실한 축출을 강조합니다. 또는 ‘반드시 축출하실’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  english_pob_choice: By this
  chosen_korean: 이로써
  alternatives_korean:
  - 이것으로
  - 이 일로써
  lexicon: HALOT
  rationale: 표지/근거를 가리키는 용법을 자연스럽게 살리면서, 문맥상 표적을 통해 알게 된다는 뜻을 간결하게 담았습니다.
- source_word: אֵל חַי
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 생존하시는 하나님
  - 살아 있는 하나님
  lexicon: HALOT
  rationale: ‘living’의 존재적 생동성을 한국어 성경 문체에 맞게 옮겼습니다. ‘살아 계신’은 단순 상태가 아니라 하나님이 참으로 살아 역사하신다는 함의를 잘 드러냅니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: among you
  chosen_korean: 너희 가운데
  alternatives_korean:
  - 너희 한복판에
  - 너희 안에
  lexicon: HALOT
  rationale: 개인 내면이 아니라 공동체 한가운데 계신다는 공간적 의미를 살리기 위해 ‘너희 가운데’로 옮겼습니다.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  english_pob_choice: he will surely drive out
  chosen_korean: 반드시 쫓아내실
  alternatives_korean:
  - 반드시 몰아내실
  - 확실히 내쫓으실
  lexicon: HALOT
  rationale: 강조형 표현(부정확화가 아닌 확정성)을 자연스럽게 살리되, 땅에서의 축출이라는 문맥을 분명히 하기 위해 ‘쫓아내실’로 옮겼습니다.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  english_pob_choice: the Canaanites ... the Jebusites
  chosen_korean: 가나안 사람들, 헷 사람들, 히위 사람들, 브리스 사람들, 기르가스 사람들, 아모리 사람들, 여부스 사람들
  alternatives_korean:
  - 가나안 족속들, 헷 족속들, 히위 족속들, 브리스 족속들, 기르가스 족속들, 아모리 족속들, 여부스 족속들
  lexicon: HALOT
  rationale: 히브리어의 민족명 목록을 현대 한국어에서 자연스럽게 읽히는 복수형으로 옮겼습니다. ‘족속’보다 ‘사람들’이 명단의 병렬성과 구체성을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 아론/교회 전통의 간접화 없이 신적 현존을 어떻게 표현할지
  chosen_reading: ‘살아 계신 하나님이 너희 가운데 계시며’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘살아 계신 하나님이 너희와 함께 계시며’
  - ‘살아 계신 하나님이 너희 안에 계시며’
  rationale: 본문의 핵심은 하나님이 공동체 한가운데 실제로 현존하신다는 선언이므로, 관계적 동행이나 내적 거주로 좁히지 않고 공간적 현존을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; avoid softening the source''s spatial claim'
- issue: וְהוֹרֵשׁ יוֹרִישׁ의 강한 축출 의미
  chosen_reading: ‘반드시 쫓아내실’로 강한 제거의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘반드시 차지하게 하실’
  - ‘반드시 몰아내실’
  rationale: 문맥은 약속의 땅에서의 निर्ण정적 축출을 말하므로, 단순한 ‘차지하다’보다 원문의 강한 배제 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: never paraphrase beyond what the source text warrants; preserve lexical tension'
