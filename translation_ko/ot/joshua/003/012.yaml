  - 지금
  lexicon: HALOT
  rationale: 담화 전환을 자연스럽게 표시하는 현대 한국어 표현으로, 명령의 연속성을 살리면서도 문장 흐름을 매끄럽게 합니다.
- source_word: קְחוּ לָכֶם
  english_pob_choice: take for yourselves
