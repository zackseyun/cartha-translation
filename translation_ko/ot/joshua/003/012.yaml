  - 열두 명
  lexicon: HALOT
  rationale: 본문은 각 지파를 대표할 사람들을 가리키므로, 성별을 과도하게 강조하는 ‘남자’보다 대표성을 살린 ‘사람’이 한국어에서 더 자연스럽습니다.
