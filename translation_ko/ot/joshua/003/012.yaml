    text: 히브리어는 ‘한 사람, 한 사람, 지파를 위하여’라는 분배적 표현으로, 각 지파에서 대표자 한 명씩을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
