  english_pob_choice: one man from each tribe
  chosen_korean: 각 지파마다 한 사람씩입니다
  alternatives_korean:
  - 각 지파에서 한 사람씩입니다
  - 지파마다 한 사람씩입니다
  - 한 사람, 한 사람씩
  lexicon: HALOT
  rationale: 반복 구조가 나타내는 분배적 의미를 한국어 관용으로 풀어, ‘각 지파마다 한 사람씩’으로 대표자 1명씩의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 지파 대표 선발의 분배적 반복 표현
  chosen_reading: ‘각 지파마다 한 사람씩’으로 분배적 의미를 명시했습니다.
  alternative_readings:
  - 직역하여 ‘한 사람, 한 사람, 지파를 위하여’
  - ‘지파마다 한 사람’
  rationale: 히브리어의 반복은 수사적 강조와 분배를 동시에 담지만, 한국어에서는 의미가 즉시 전달되도록 분배성을 드러내는 편이 본문 기능을 더 잘 보존합니다.
  doctrine_reference: 서술적/해석학적 선택
