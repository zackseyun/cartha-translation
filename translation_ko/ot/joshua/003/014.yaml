translation:
  language: ko
  text: 그리고 백성이 자기 장막에서 나와 요단을 건너려고 출발할 때, 언약궤를 메고 가는 제사장들이 백성보다 앞에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성보다 앞서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그때
  - 이 일이 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 전개 기능을 한국어에서 과도하게 문어적으로 굳히지 않고, 다음 사건으로 자연스럽게 이어 주는 접속사로 처리했습니다.
- source_word: בִּנְסֹעַ הָעָם מֵאָהֳלֵיהֶם
  english_pob_choice: when the people set out from their tents
  chosen_korean: 백성이 자기 장막에서 나와 … 출발할 때
  alternatives_korean:
  - 백성이 자기 장막에서 떠날 때
  - 백성이 자기 천막에서 길을 나설 때
  lexicon: HALOT
  rationale: נסע의 ‘출발하다/떠나다’ 의미와 אהל의 ‘장막’ 이미지를 살려, 현대 한국어에서 자연스러운 동작 표현으로 옮겼습니다.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  english_pob_choice: to cross the Jordan
  chosen_korean: 요단을 건너려고
  alternatives_korean:
  - 요단을 건너기 위해
  - 요단강을 건너려고
  lexicon: HALOT
  rationale: עבר의 목적 용법을 살려 목적형으로 처리했고, 성경적 지명 관용을 따라 ‘요단’을 기본형으로 두었습니다.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן הַבְּרִית
  english_pob_choice: and the priests carrying the ark of the covenant
  chosen_korean: 언약궤를 메고 가는 제사장들
  alternatives_korean:
  - 언약궤를 나르는 제사장들
  - 언약궤를 들고 가는 제사장들
  lexicon: HALOT
  rationale: נושא의 문맥상 ‘메다/메고 가다’가 궤를 운반하는 제사장 행위를 가장 구체적으로 드러내며, ‘언약궤’는 cultic 용례를 보존합니다.
- source_word: לִפְנֵי הָעָם
  english_pob_choice: before the people
  chosen_korean: 백성보다 앞에 있었습니다
  alternatives_korean:
  - 백성 앞에 있었습니다
  - 백성보다 앞섰습니다
  lexicon: HALOT
  rationale: לפני의 공간적 위치를 한국어에서 가장 자연스럽게 드러내기 위해 ‘~보다 앞에’로 옮겨, 단순한 방향이 아니라 선두 위치를 분명히 했습니다.
theological_decisions:
- issue: 언약궤의 표기
  chosen_reading: ‘언약궤’로 유지했습니다.
  alternative_readings:
  - ‘법궤’
  - ‘계약궤’
  rationale: 본문의 ברית는 이스라엘의 신학적 언약을 가리키므로, 관용적이면서도 소스 의미를 보존하는 ‘언약궤’가 가장 적절합니다.
  doctrine_reference: 출 25:10-22; 민 10:33-36
