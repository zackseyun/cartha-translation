revisions:
- from: 그리고 백성이 자기 장막에서 나와 요단을 건너려고 출발할 때, 언약궤를 메고 가는 제사장들이 백성보다 앞에 있었습니다.[a]
  to: 백성이 요단을 건너기 위해 자기들의 장막을 떠날 때, 언약궤를 멘 제사장들이 백성 앞에 있었습니다.[a]
  rationale: The revision preserves the Hebrew temporal construction and the deliberately continuing narrative syntax, while correcting the plural reference to the people's tents and removing Korean redundancy. It retains established biblical terminology and a formal-polite narrative register.
  reviewer_model: gpt-5.6-terra
