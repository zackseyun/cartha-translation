base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
  footnotes:
  - marker: a
    text: 'Or ''all the Israelites.'' Hebrew: ''all the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 아침 일찍 일어났습니다. 그와 모든 이스라엘 자손은 싯딤을 떠나 요단에 이르러, 건너기 전에 그곳에서 밤을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 이스라엘 사람들’. 히브리어는 ‘모든 이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어나다
  alternatives_korean:
  - 일찍 일어나다
  - 이른 아침에 일어나다
  lexicon: HALOT
  rationale: 히필 방식의 ‘일찍 일어나다’라는 시간 강조를 자연스러운 현대 한국어로 살렸습니다.
- source_word: מֵהַשִּׁטִּים
  english_pob_choice: from Shittim
  chosen_korean: 싯딤에서
  alternatives_korean:
  - 아카시아 골짜기에서
  lexicon: HALOT
  rationale: 지명은 뜻풀이보다 음역이 본문 흐름과 고유명사성을 더 잘 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족/민족 표현을 드러내면서도 한국어에서 가장 익숙한 성경적 표현을 선택했습니다.
- source_word: טֶרֶם יַעֲבֹרוּ
  english_pob_choice: before they crossed over
  chosen_korean: 건너기 전에
  alternatives_korean:
  - 건너기 직전에
  - 건너기 전에야
  lexicon: HALOT
  rationale: ‘טרם’의 선행 시점을 간결하게 살리되, 요단을 건너는 문맥상 ‘건너다’의 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 이스라엘 집합명사의 한국어 처리
  chosen_reading: ‘이스라엘 자손’으로 옮겨 남성 복수의 원문 형식을 보존했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성’
  rationale: 여기서는 교리 쟁점이 아니라 원문 노출성이 핵심이므로, 보다 중립적인 집합명사보다 히브리어 형식을 더 직접적으로 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
