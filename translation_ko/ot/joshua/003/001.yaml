revisions:
- from: 여호수아가 아침 일찍 일어나자, 그와 온 이스라엘 자손이 싯딤에서 떠나 요단에 이르러, 건너기 전에 거기서 밤을 지냈습니다.[a]
  to: 여호수아는 아침 일찍 일어났습니다. 그와 모든 이스라엘 자손은 싯딤을 떠나 요단에 이르러, 건너기 전에 그곳에서 밤을 지냈습니다.[a]
  rationale: 원문의 독립된 첫 동사절과 뒤따르는 집단의 이동을 분명히 하고, כָּל־בְּנֵי יִשְׂרָאֵל의 ‘모든’ 및 친족 표현을 본문과 각주에 일관되게 반영했습니다. ‘건너기 전에’는 טֶרֶם יַעֲבֹרוּ의 시간 관계를 자연스럽게 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:11Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 사건 순서와 핵심 어휘는 대체로 충실합니다. 다만 ‘여호수아가 … 일어나자’는 원문의 독립된 서술을 종속절로 만들고, ‘온 이스라엘 자손’은 כָּל־בְּנֵי יִשְׂרָאֵל에 대한 현대 한국어로 다소 부자연스럽습니다.
  naturalness: ‘모든 이스라엘 자손’이 표준적이고 자연스럽습니다. 여호수아의 기상과 백성의 이동을 두 문장으로 분명히 구분하면 한국어 합쇼체 서술도 더 매끄러워집니다.
  terminology: ‘여호수아’, ‘싯딤’, ‘요단’, ‘이스라엘 자손’은 적절합니다. 각주 대안에는 원문의 ‘모든’이 반영되어야 하며, 히브리어 인용 설명도 ‘모든 이스라엘의 아들들’로 완전하게 제시하는 편이 정확합니다.
  issues:
  - severity: low
    issue: ‘온 이스라엘 자손’의 표현
    rationale: ‘온 이스라엘 자손’보다 ‘모든 이스라엘 자손’이 כָּל־בְּנֵי יִשְׂרָאֵל을 더 직접적으로 반영하고 현대 표준 한국어에서도 자연스럽습니다.
  - severity: low
    issue: 각주가 ‘모든’과 원문의 전체 구성을 빠뜨림
