reference: Joshua 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
  footnotes:
  - marker: a
    text: Or 'in the Jordan.' The Hebrew can be rendered more literally this way, but 'into the Jordan' better reflects the directional sense with 'is crossing' in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 온 땅의 주의 언약궤가 여러분보다 앞서 요단강으로[a] 들어가고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요단강 안에서 지나가고 있습니다”로 옮길 수 있습니다. 히브리어 전치사는 문자적으로 ‘안에서’를 뜻할 수 있지만, 이 문맥에서는 강으로 들어가는 진행을 나타내는 번역도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서, 현대 한국어의 공손한 직접 호소인 '보십시오'가 합쇼체 문맥에서 자연스럽고 즉각적인 주의를 전달합니다.
- source_word: אֲרוֹן הַבְּרִית
  english_pob_choice: the ark of the covenant
  chosen_korean: 언약궤
  alternatives_korean:
  - 언약의 궤
  - 계약궤
  lexicon: HALOT
  rationale: 성경 한국어에서 널리 인식되는 결합어이며, 히브리어의 관용적 소유 관계를 간결하게 반영합니다.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  english_pob_choice: the Lord of all the earth
  chosen_korean: 온 땅의 주
  alternatives_korean:
  - 온 세상의 주인
  - 땅의 주
  lexicon: HALOT
  rationale: 지배권을 나타내는 칭호로서 '주'가 가장 직접적이며, '온 땅'은 כָּל הָאָרֶץ의 보편적 통치를 자연스럽게 살립니다.
- source_word: לִפְנֵיכֶם
  english_pob_choice: ahead of you
  chosen_korean: 여러분보다 앞서
  alternatives_korean:
  - 여러분 앞에
  - 여러분보다 앞에서
  lexicon: HALOT
  rationale: 행진의 선두에 서서 움직인다는 방향성을 분명히 드러내며, 현대 한국어에서 가장 자연스럽습니다.
- source_word: בַּיַּרְדֵּן
  english_pob_choice: into the Jordan
  chosen_korean: 요단강으로 들어가고 있습니다
  alternatives_korean:
  - 요단강 안으로
  - 요단강 가운데로
  lexicon: HALOT
  rationale: POB의 방향성 해석을 따라, 단순한 정적 위치보다 진입 동작을 살려 '으로 들어가고 있습니다'로 옮겼습니다.
theological_decisions:
- issue: 온 땅의 주라는 칭호의 신학적 뉘앙스
  chosen_reading: 야훼의 보편적 주권을 나타내는 칭호로 이해하고 '온 땅의 주'로 옮겼습니다.
  alternative_readings:
  - 온 땅의 주인
  - 온 땅의 통치자
  rationale: 이 표현은 단순한 소유가 아니라 온 세상에 대한 주권을 강조하므로, 예배적·서사적 무게를 유지하는 '주'가 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: titles are translated, not paraphrased; sovereignty titles should preserve biblical register.'
