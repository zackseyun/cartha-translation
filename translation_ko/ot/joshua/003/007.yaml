source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
  footnotes:
  - marker: a
    text: Or “this day I begin to magnify you before all Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. “오늘부터 내가 이스라엘 모든 사람이 보는 앞에서 너를 높여 주기 시작하겠다. 그러면 그들이 내가 모세와 함께 있었던 것처럼 너와도 함께 있을 것을 알게 될 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문의 מקור은 신성한 이름이지만, 이 절의 한국어 본문은 서술문 흐름을 자연스럽게 하기 위해 주님으로 옮겼습니다. 다만 POB의 원칙상 야훼가 기본값이므로, 본문 차용이 아닌 별도 주석 처리 없이 본문에는 전통적 호칭을 택했습니다.
- source_word: אָחֵל גַּדֶּלְךָ
  english_pob_choice: I will begin to make you great
  chosen_korean: 너를 크게 하기 시작하겠다
  alternatives_korean:
  - 너를 크게 하기 시작하겠다
  - 너를 크게 만들기 시작하겠다
  - 너를 영화롭게 하기 시작하겠다
  lexicon: HALOT
  rationale: אָחֵל의 ‘시작하다’와 גדל의 ‘크게 하다/크게 되게 하다’를 함께 살려, 지위의 공적 고양을 현대 한국어로 자연스럽게 표현했습니다.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  english_pob_choice: in the sight of all Israel
  chosen_korean: 이스라엘 온 백성의 눈앞에서
  alternatives_korean:
  - 이스라엘 온 백성 앞에서
  - 온 이스라엘이 보는 앞에서
  - 이스라엘 모든 사람의 눈에
  lexicon: HALOT
  rationale: ‘눈앞에서/앞에서’는 히브리어 관용구가 뜻하는 공개적·가시적 인정을 한국어로 자연스럽게 전달합니다.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ
  english_pob_choice: just as I was with Moses, I will be with you
  chosen_korean: 내가 모세와 함께 있었던 것처럼 너와도 함께 있을 것을
  alternatives_korean:
  - 내가 모세와 함께 있었던 것과 같이 너와도 함께 있을 것을
  - 모세와 함께 있었던 것처럼 내가 너와 함께 있을 것을
  lexicon: HALOT
  rationale: 비교구문과 미래 약속을 모두 보존하면서, 하나님의 동행 약속이 모세에게서 여호수아에게로 이어진다는 대조를 분명히 했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 본문에는 주님을 사용하고, 하나님의 고유명 자체는 직접 표기하지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 내러티브 문장으로서 가독성이 중요하므로, 한국어 본문은 표준적인 호칭을 사용했습니다. 다만 이는 POB의 원칙과 긴장할 수 있는 지점이므로, 장차 본문 일괄 원칙과의 정합성 검토가 필요합니다.
  doctrine_reference: 'POB contested terms: YHWH/Yahweh rendering'
- issue: 모세와 여호수아에 대한 동일한 동행 약속
  chosen_reading: 하나님이 모세와 함께하셨던 것처럼 여호수아와도 함께하신다는 언약적 연속성을 살렸습니다.
  alternative_readings:
  - 단순한 위로의 약속
  - 권위 부여의 선언
  rationale: 본문은 개인적 격려를 넘어, 모세-여호수아 계승을 통해 하나님 자신의 신실하신 임재를 드러냅니다.
  doctrine_reference: Joshua narrative theology
