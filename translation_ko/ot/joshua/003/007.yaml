  to: 야훼께서 여호수아에게 말씀하셨습니다. “오늘부터 내가 이스라엘 모든 사람이 보는 앞에서 너를 높여 주기 시작하겠다. 그러면 그들이 내가 모세와 함께 있었던 것처럼 너와도 함께 있을 것을 알게 될 것이다.”
