    issue: The Tetragrammaton יְהוָה is translated as ‘주님.’
    rationale: The original explicitly uses the divine name, and the stated POB policy renders it ‘Yahweh’/‘야훼,’ not a substituted title. The draft’s own rationale acknowledges this conflict.
  - severity: low
    issue: ‘너를 크게 하기 시작하겠다’ is overly literal in Korean.
    rationale: While it reflects the Hebrew components, ‘너를 높여 주기 시작하겠다’ more idiomatically conveys public elevation or vindication before Israel without adding meaning.
