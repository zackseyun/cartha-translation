translation:
  language: ko
  text: 여호수아가 이스라엘 자손[a]에게 말했습니다. “이리로 오셔서 여러분의 하나님 야훼의 말씀을 들으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 요수아
  lexicon: 표준 음역
  rationale: 고유명사는 한국어 성경에서 확립된 음역을 따르는 것이 가장 자연스럽고 식별성이 높습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리기 위해 ‘sons’를 ‘아들들’로 옮기고, 영어 POB의 성별-정확성 선택도 반영했습니다.
- source_word: גֹּשׁוּ הֵנָּה
  english_pob_choice: Come here
  chosen_korean: 이리로 오십시오
  alternatives_korean:
  - 가까이 오십시오
  - 이쪽으로 오십시오
  lexicon: HALOT
  rationale: 복수 명령형의 초대/호출을 한국어에서 가장 자연스럽게 나타내며, ‘here’의 방향성을 ‘이리로’로 분명히 했습니다.
- source_word: וְשִׁמְע֕וּ
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 주십시오
  - 귀를 기울이십시오
  lexicon: HALOT
  rationale: 단순 청취가 아니라 권위 있는 말씀에 대한 순종적 청취를 포함하므로 명령형 ‘들으십시오’가 적절합니다.
- source_word: יְהוָ֥ה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 여러분의 야훼 하나님
  - 여러분의 주 하나님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 여호와/주로 대체하지 않고 신명기적인 고유명사 ‘야훼’를 유지했습니다. 한국어에서는 소유격 ‘여러분의’가 자연스러워 ‘your God’의 관계를 분명히 했습니다.
theological_decisions:
- issue: 이스라엘의 아들들(בְּנֵי יִשְׂרָאֵל)의 성별-정확성
  chosen_reading: ‘이스라엘의 아들들’로 직역하여 히브리어의 남성 복수 표현을 보존했습니다.
  alternative_readings:
  - 이스라엘 자손
  - 이스라엘 사람들
  rationale: 본문의 집합 명칭을 중성화하지 않고 원문의 형태를 드러내는 것이 문맥과 번역 원칙에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: 하나님의 이름 יְהוָה
  chosen_reading: ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 언약 이름을 직접 사용하므로, 제목으로 환원하지 않고 고유 이름을 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
