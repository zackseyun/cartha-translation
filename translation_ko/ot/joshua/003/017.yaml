  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
  footnotes:
  - marker: a
    text: Or 'the ark of the LORD's covenant.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'stood firmly'; the adverb emphasizes that the priests remained fixed in place in the riverbed.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the people'; Hebrew 'the whole nation' uses a singular collective term for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들은 야훼의 언약궤를 메고 요단 한가운데의 마른 땅에 굳게 서 있었고, 온 이스라엘은 마른 땅으로 건너가다가 그 온 민족이 요단을 건너기를 마칠 때까지 계속 건너고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 언약궤’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘굳게 서 있었다’라는 뜻으로, 제사장들이 강바닥에 고정된 듯 움직이지 않았음을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘온 백성’; 히브리어 ‘온 민족’은 이스라엘을 가리키는 단수 집합 명사입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  english_pob_choice: the priests carrying
  chosen_korean: 제사장들은 야훼의 언약궤를 메고
  alternatives_korean:
  - 제사장들은 야훼의 언약궤를 들고
  - 언약궤를 운반하는 제사장들은
  lexicon: HALOT
  rationale: נֹשְׂאֵי는 제사장들의 지속적 역할을 나타내므로, 한국어에서는 ‘메고’로 자연스럽게 옮겨 궤를 어깨에 지고 이동하는 동작을 살렸습니다.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약궤
  - 야훼 언약의 궤
  lexicon: HALOT
  rationale: 히브리어 소유격 연쇄를 한국어에서는 ‘야훼의 언약궤’로 간명하게 재현했습니다. POB의 ‘Yahweh’ 선택을 따라 하나님의 고유명을 살렸습니다.
- source_word: הָכֵן
  english_pob_choice: firmly
  chosen_korean: 굳게
  alternatives_korean:
  - 단단히
  - 확고하게
  - 서 있었습니다
  lexicon: HALOT
  rationale: 부사 הָכֵן은 ‘준비된’이 아니라 흔들리지 않는 상태를 가리키므로, 제사장들이 물살 속에서 움직이지 않았다는 점을 드러내는 ‘굳게’가 적절합니다.
- source_word: בֶּחָרָבָה / עֹבְרִים בֶּחָרָבָה
  english_pob_choice: on dry ground
  chosen_korean: 마른 땅에
  alternatives_korean:
  - 마른 땅으로
  - 건조한 땅에
  lexicon: HALOT
  rationale: 두 번 반복되는 בֶּחָרָבָה를 일관되게 ‘마른 땅’으로 옮겨, 기적적으로 드러난 건조한 지면이라는 장면을 유지했습니다.
- source_word: כָּל הַגּוֹי
  english_pob_choice: the whole nation
  chosen_korean: 온 민족
  alternatives_korean:
  - 온 백성
  - 온 나라
  - 모든 민족
  lexicon: HALOT
  rationale: גּוֹי는 여기서 이스라엘 전체를 가리키는 집합 명사이므로, POB의 관찰을 반영해 ‘온 민족’으로 옮겨 집합성을 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약궤의 소유격으로 하나님의 고유명 יְהוָה를 직접 사용하므로, POB의 원칙에 따라 제목적 대체어 ‘주’가 아니라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
