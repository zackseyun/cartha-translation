id: JOS.3.13
reference: Joshua 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
  footnotes:
  - marker: a
    text: Or, 'the ark of the Lord of all the earth.' The Hebrew can be read with 'Lord of all the earth' closely linked to 'ark,' though the main text takes it as an appositional title for the LORD.
    reason: alternative_reading
  - marker: b
    text: Or, 'the waters coming down from upstream.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 땅의 주님이신 야훼의 언약궤를 메는 제사장들의 발바닥이 요단 강물에 닿아 머무르게 되면, 요단의 물, 곧 위에서 내려오는 물은 끊어져 한 무더기로 서게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅의 주님의 언약궤’. 히브리어는 ‘온 땅의 주님’을 ‘언약궤’와 밀접하게 연결하여 읽을 수도 있으나, 본문은 이를 야훼의 호칭으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘상류에서 내려오는 물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  english_pob_choice: And when ... come to rest
  chosen_korean: 그리고 ... 잠겨 쉬게 되면
  alternatives_korean:
  - 그리고 ... 쉬게 되면
  - 그리고 ... 멈추면
  lexicon: HALOT
  rationale: כְּנוֹחַ의 시간적 의미를 살려 ‘...하게 되면’으로 옮기고, נוח의 구체성을 유지하기 위해 ‘쉬다/잠겨 쉬다’ 계열 표현을 썼습니다.
- source_word: כַּפּוֹת רַגְלֵי
  english_pob_choice: the soles of the feet
  chosen_korean: 발바닥
  alternatives_korean:
  - 발바닥들
  - 발의 밑바닥
  lexicon: HALOT
  rationale: כַּף רֶגֶל의 관용적 의미를 한국어의 자연스러운 해부학 표현인 ‘발바닥’으로 옮겨 구체성을 살렸습니다.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן יְהוָה אֲדוֹן כָּל הָאָרֶץ
  english_pob_choice: the priests carrying the ark of Yahweh, the Lord of all the earth
  chosen_korean: 야훼의 언약궤를 멘 제사장들
  alternatives_korean:
  - 야훼의 언약궤를 메고 있는 제사장들
  - 야훼의 언약궤를 메는 제사장들
  lexicon: HALOT
  rationale: נשא의 현재분사적 의미를 한국어 관용으로 ‘멘’으로 옮겼고, 문맥상 ‘야훼의 언약궤’가 자연스럽습니다. ‘온 땅의 주님’은 이 절에서 야훼의 호칭이므로 본문에서는 결합하여 읽히도록 처리했습니다.
- source_word: בְּמֵי הַיַּרְדֵּן / מֵי הַיַּרְדֵּן
  english_pob_choice: in the waters of the Jordan ... will be cut off in the Jordan
  chosen_korean: 요단 물에 ... 요단 물은 그곳에서 끊어지고
  alternatives_korean:
  - 요단 강물에 ... 요단의 물은 끊어지고
  - 요단 물속에서 ... 요단 물이 끊어지고
  lexicon: HALOT
  rationale: 반복된 ‘요단’과 ‘물’을 살리되 한국어에서 어색한 중복은 피하도록 첫 번째는 위치, 두 번째는 결과를 중심으로 나누어 옮겼습니다.
- source_word: יִכָּרֵתוּן
  english_pob_choice: will be cut off
  chosen_korean: 끊어지고
  alternatives_korean:
  - 잘려 나가고
  - 차단되고
  lexicon: HALOT
  rationale: כרת의 수동적·단절적 이미지를 한국어의 ‘끊어지다’로 옮겨, 흐름이 중단되는 기적적 뉘앙스를 살렸습니다.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  english_pob_choice: and they will stand in one heap
  chosen_korean: 물은 한 덩어리로 서게 될 것입니다
  alternatives_korean:
  - 물은 한 더미로 서게 될 것입니다
  - 물은 하나의 무더기로 서게 될 것입니다
  lexicon: HALOT
  rationale: נֵד는 물이 쌓여 이루는 덩어리·더미를 가리키므로, 한국어에서는 자연스럽고 이미지가 살아 있는 ‘한 덩어리’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 고유한 언약 이름을 보존하기 위해 전통적 대체어 ‘주님’ 대신 음역 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘야훼, 온 땅의 주님’의 결합 방식
  chosen_reading: 야훼의 언약궤를 멘 제사장들
  alternative_readings:
  - 야훼의 언약궤, 온 땅의 주님을 멘 제사장들
  - 온 땅의 주님의 언약궤를 멘 제사장들
  rationale: 히브리어는 ‘야훼’와 ‘온 땅의 주님’이 서로를 풀어주는 호칭 결합으로 읽힐 수 있지만, 한국어 본문에서는 과도한 중복을 피하고 동일한 하나님 지칭을 자연스럽게 드러내도록 정리했습니다.
  doctrine_reference: 'POB translation principle: preserve appositional divine titles without obscuring the source relationship'
