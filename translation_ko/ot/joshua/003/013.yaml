revisions:
- from: 그리고 제사장들—곧 야훼의 언약궤를 멘 제사장들의 발바닥이 요단 물에 잠겨 쉬게 되면, 위에서 흘러내리는 요단 물은 그곳에서 끊어지고, 물은 한 덩어리로 서게 될 것입니다.[a][b]
  to: 그리고 온 땅의 주님이신 야훼의 언약궤를 메는 제사장들의 발바닥이 요단 강물에 닿아 머무르게 되면, 요단의 물, 곧 위에서 내려오는 물은 끊어져 한 무더기로 서게 될 것입니다.[a][b]
  rationale: 원문의 야훼 및 ‘온 땅의 주님’ 호칭을 본문에 모두 반영했습니다. ‘잠겨’가 더하는 의미를 제거하고, 요단의 물이 위쪽/상류에서 흘러내리다가 끊어져 한 무더기로 서는 구조를 한국어에서 명확하게 재구성했습니다. 각주는 실제 대안 독법과 어휘 대안을 각각 제시하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:15Z'
review_pass:
  verdict: revise
  source_fidelity: 현 본문은 אֲדוֹן כָּל־הָאָרֶץ(‘온 땅의 주님’)를 본문에서 누락시키고 각주에만 남겨 원문의 신적 호칭을 충분히 반영하지 못합니다. 또한 ‘잠겨 쉬게’는 원문의 ‘물 안에서 발바닥이 머무르다’보다 ‘완전히 잠기다’라는 뜻을 더합니다. 수정문은 두 호칭을 본문에 유지하고, 물의 차단과 한 무더기로 서는 이미지를 보존합니다.
  naturalness: ‘발바닥이 요단 강물에 닿아 머무르게 되면’은 현대 표준 한국어에서 자연스럽고, 발 전체가 잠긴다는 불필요한 함의를 피합니다. ‘요단의 물, 곧 위에서 내려오는 물’은 원문의 반복과 관계를 무리 없이 드러냅니다.
  terminology: יהוה는 지침에 따라 ‘야훼’로 유지했습니다. אֲדוֹן כָּל־הָאָרֶץ는 ‘온 땅의 주님이신’으로 본문에 반영했습니다. אֲרוֹן은 문맥상 통용되는 ‘언약궤’로, נֵד אֶחָד는 물이 쌓이는 형상을 살린 ‘한 무더기’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘온 땅의 주님’ 호칭이 본문에서 빠져 있습니다.
    rationale: 히브리어의 יְהוָה אֲדוֹן כָּל־הָאָרֶץ는 야훼와 ‘온 땅의 주님’이라는 호칭을 모두 포함합니다. 가능한 다른 결합 방식은 각주로 제시할 수 있으나, 주 호칭 자체를 본문에서 생략해서는 안 됩니다.
  - severity: medium
    issue: ‘잠겨 쉬게 되면’이 ‘잠기다’의 추가 의미를 도입합니다.
    rationale: כְּנוֹחַ는 발바닥이 물에 이르러 머무르거나 닿아 멈추는 상황을 말합니다. 완전히 물에 잠긴다는 뜻은 본문이 요구하지 않습니다.
  - severity: medium
    issue: 각주 b가 본문 표현을 그대로 반복하여 대안 기능을 하지 못합니다.
    rationale: ‘위에서 내려오는 물’의 문맥상 어휘 대안은 ‘상류에서 내려오는 물’입니다.
