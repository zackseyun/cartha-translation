  text: 사흘이 끝날 무렵에 관리들이 진영 가운데를 지나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ...
  chosen_korean: 사흘이 끝날 무렵에
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 서술 전환 기능을 한국어의 자연스러운 시간 부사구로 풀어, 고어체 없이 사건의 이어짐을 보여 줍니다.
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  english_pob_choice: at the end of three days
  chosen_korean: 사흘이 끝날 무렵에
  alternatives_korean:
  - 사흘 끝에
  - 사흘 뒤에
  lexicon: HALOT
  rationale: ‘끝에’보다 ‘끝날 무렵에’가 시간 경계의 의미를 살리면서도 현대 한국어에서 더 자연스럽습니다.
- source_word: הַשֹּׁטְרִים
  english_pob_choice: the officers
  chosen_korean: 관리들이
  alternatives_korean:
  - 관리관들이
  - 장관들이
  - 경리들이
  lexicon: HALOT
  rationale: 진영 안에서 명령을 전달·집행하는 공적 담당자라는 기능을 살려, 전통교회식 용어보다 중립적인 ‘관리들’로 옮겼습니다.
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  english_pob_choice: through the midst of the camp
  chosen_korean: 진영 가운데를
  alternatives_korean:
  - 진영 한가운데를
  - 진영 가운데로
  - 진영 속을
  lexicon: HALOT
  rationale: ‘가운데’의 공간 이미지를 유지하면서 이동 동사와 자연스럽게 결합하도록 목적격 구성을 택했습니다.
theological_decisions:
- issue: 진영(מחנה) 표현의 범위
  chosen_reading: 이스라엘의 공동체 진영을 뜻하는 군사·공동체적 배경을 드러내는 ‘진영’으로 번역했습니다.
  alternative_readings:
  - 캠프
  - 부대
  rationale: 본문은 광야의 이스라엘 진영을 가리키므로, 성경 문맥에서 널리 쓰이면서도 현대 한국어에서 이해되는 ‘진영’이 가장 정확합니다.
  doctrine_reference: 문맥-역사 배경
