revisions:
- from: 그리고 당신은 언약궤를 멘 제사장들에게 명령하여 말해야 합니다. ‘여러분이 요단 물가 끝에 이르거든, 요단 가운데에 서 있어야 합니다.’[a]
  to: 그리고 당신은 언약궤를 메는 제사장들에게 이렇게 명령하십시오. ‘여러분이 요단강 물가에[a] 이르면, 요단강 안에 서십시오.’
  rationale: 명시된 접속사와 수신자 강조를 유지하면서, 명령을 도입하는 표현과 인용문의 직접 명령형을 현대 합쇼체에 맞게 다듬었습니다. ‘요단강 안에’로 번역하여 원문의 위치 전치사를 보존하고, ‘가운데’라는 해석적 공간 특정은 피했습니다. 각주는 עַד קְצֵה의 ‘끝/가장자리’에 관한 대안을 해당 어구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:18Z'
