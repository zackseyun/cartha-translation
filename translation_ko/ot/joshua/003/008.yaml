  terminology: ‘언약궤’와 ‘제사장’은 적절합니다. ‘언약궤를 메는’은 운반 중인 제사장을 자연스럽게 나타냅니다. ‘요단강 안에’는 전치사 ב의 위치 의미를 과장 없이 보존합니다.
