  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
  footnotes:
  - marker: a
    text: Or “to the brink of the waters of the Jordan.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 언약궤를 멘 제사장들에게 명령하여 말해야 합니다. ‘여러분이 요단 물가 끝에 이르거든, 요단 가운데에 서 있어야 합니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요단 물가의 끝까지.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And you
  chosen_korean: 그리고 당신은
  alternatives_korean:
  - 그리고 너는
  - 또 당신은
  lexicon: HALOT
  rationale: 문맥상 여호수아에게 직접 이어지는 명령이므로 연결사와 대명사의 강조를 살려 옮겼습니다.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  english_pob_choice: who carry the ark of the covenant
  chosen_korean: 언약궤를 멘
  alternatives_korean:
  - 언약궤를 메고 있는
  - 언약궤를 나르는
  lexicon: HALOT
  rationale: ‘멘’은 제사장들이 궤를 어깨에 메고 가는 장면에 자연스럽고, 단순한 운반보다 더 구체적인 짐-지님을 드러냅니다.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  english_pob_choice: to the edge of the waters of the Jordan
  chosen_korean: 요단 물가 끝에
  alternatives_korean:
  - 요단 물의 가장자리까지
  - 요단 물가의 끝까지
  lexicon: HALOT
  rationale: 히브리어의 ‘물의 끝/가장자리’라는 이미지를 한국어 자연 표현인 ‘물가 끝’으로 압축해, POB 각주가 지적한 대안 의미도 함께 포괄합니다.
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  english_pob_choice: you shall stand in the Jordan
  chosen_korean: 요단 가운데에 서 있어야 합니다
  alternatives_korean:
  - 요단 안에 서야 합니다
  - 요단에 서 있어야 합니다
  lexicon: HALOT
  rationale: 전치사 ב를 단순한 ‘안’보다 더 구체적인 위치로 풀어, 물가를 넘어 실제로 강 속에 서는 명령의 강도를 살렸습니다.
theological_decisions:
- issue: 제사장들의 위치를 ‘요단 가운데’로 풀어 쓸지, 단순히 ‘요단 안에’로 둘지
  chosen_reading: ‘요단 가운데에 서 있어야 합니다’
  alternative_readings:
  - ‘요단 안에 서야 합니다’
  - ‘요단에 서 있어야 합니다’
  rationale: 문맥상 제사장들은 물가에 다가간 뒤 강 한가운데에 발을 디디는 행동을 요구받으므로, 공간적 긴장을 더 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 서술적/지리적 뉘앙스; 교리 쟁점 없음
