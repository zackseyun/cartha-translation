id: JOS.3.15
reference: Joshua 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
  footnotes:
  - marker: a
    text: Or 'at the edge of the water.' The Hebrew expression is literally 'in the edge/end of the water,' indicating the priests' feet entered the water at its margin.
    reason: lexical_alternative
  - marker: b
    text: That is, the Jordan was at flood stage during harvest season.
    reason: cultural_note
translation:
  language: ko
  text: 언약궤를 멘 이들이 요단에 이르렀고, 언약궤를 멘 제사장들의 발이 물 가장자리에[a] 잠겼을 때—요단은 추수하는 모든 날 동안 모든 강둑 위로 넘쳐흘렀습니다[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘물의 끝/가장자리 안에서’에 가깝습니다. 여기서는 제사장들의 발이 물의 경계에 실제로 들어갔다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 추수철에는 요단강이 범람할 정도로 불어 있었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשְׂאֵי הָאָרוֹן
  english_pob_choice: those carrying the ark
  chosen_korean: 언약궤를 멘 이들
  alternatives_korean:
  - 언약궤를 든 이들
  - 언약궤를 메고 가는 사람들
  lexicon: HALOT
  rationale: 히브리어 분사는 실제로 궤를 운반하는 사람들을 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘멘 이들’로 옮겼습니다.
- source_word: נִטְבְּלוּ
  english_pob_choice: were dipped
  chosen_korean: 잠기자
  alternatives_korean:
  - 담기자
  - 적셔지자
  - 물에 잠기자
  lexicon: HALOT
  rationale: 발이 물 가장자리에 들어간 상태를 나타내므로, 단순한 접촉보다 ‘잠기자’가 더 정확하고, 과도한 ‘완전히 잠기다’도 피할 수 있습니다.
- source_word: בִּקְצֵה הַמָּיִם
  english_pob_choice: in the edge of the water
  chosen_korean: 물 가에
  alternatives_korean:
  - 물의 가장자리에
  - 물 끝에
  lexicon: HALOT
  rationale: 직역의 ‘물의 끝/가장자리’ 의미를 살리되 한국어에서는 ‘물 가’가 가장 자연스럽고, 발이 물의 경계에 들어갔다는 뉘앙스를 전달합니다.
- source_word: מָלֵא עַל כָּל גְּדוֹתָיו
  english_pob_choice: was full over all its banks
  chosen_korean: 모든 언덕까지 가득 차 있었습니다
  alternatives_korean:
  - 모든 둑을 넘쳐 있었습니다
  - 모든 강둑에 가득했습니다
  lexicon: HALOT
  rationale: 문맥상 홍수기 범람을 가리키므로 ‘가득 차 있었습니다’로 살렸습니다. 다만 본문의 ‘גדות’는 강둑/언덕이 아니라 강의 둑을 뜻하므로, 한국어 본문은 ‘둑’ 계열 표현이 더 정확합니다.
theological_decisions:
- issue: 추수기 요단강의 상태를 어떻게 전달할지
  chosen_reading: ‘추수 내내 … 가득 차 있었습니다’로 옮겨, 본문의 배경 설명이 단순 정보가 아니라 하나님의 기적적 인도와 맞물린 홍수기의 긴박함을 드러내게 했습니다.
  alternative_readings:
  - ‘추수철 동안 범람해 있었습니다’
  - ‘추수 시기 내내 넘쳐 있었습니다’
  rationale: 히브리어의 시간 표현과 범람 이미지는 이후 기적의 대비를 형성하므로, 이를 약화시키지 않고 자연스럽게 드러내는 것이 중요합니다.
  doctrine_reference: 수 3:15 문맥의 구속사적 배경
- issue: 절의 구조와 삽입 설명의 처리
  chosen_reading: 괄호 대신 대시로 삽입 설명을 표기해, 본문의 서술 흐름을 유지하면서도 요단강의 범람 상태가 부연 설명임을 분명히 했습니다.
  alternative_readings:
  - 괄호로 처리
  - 본문 속에 직설적으로 통합
  rationale: 원문의 중간 삽입은 서술을 잠시 멈추는 기능이 있으므로, 한국어에서도 그 문장적 기능을 보존하는 것이 좋습니다.
  doctrine_reference: 문장 구조 보존 원칙
