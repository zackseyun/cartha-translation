  revision_rationale: 명령 동사와 그 수신자 ‘백성’을 복원하고, POB의 신명 표기 원칙에 따라 ‘야훼’를 사용했습니다. 또한 한국어의 자연스러운 합쇼체를 유지하면서 레위인 제사장이라는 구문 및 관련 각주의 범위를 명확히 했습니다.
