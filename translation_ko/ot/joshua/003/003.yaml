revisions:
- from: 그리고 사람들이 말하기를, 「여호와 너희 하나님의 언약궤와 그 궤를 메고 있는 레위 사람 제사장들을 보거든, 너희는 너희 자리에서 떠나 그 뒤를 따라가십시오」라고 하였습니다.[a]
  to: 그들이 백성에게 명령했습니다. “너희 하나님 야훼의 언약궤와 그것을 메고 가는 레위인 제사장들[a]을 보거든, 너희가 있는 곳을 떠나 그 뒤를 따라가십시오.”
  rationale: 명령 동사와 그 수신자 ‘백성’을 복원하고, POB의 신명 표기 원칙에 따라 ‘야훼’를 사용했습니다. 또한 한국어의 자연스러운 합쇼체를 유지하면서 레위인 제사장이라는 구문 및 관련 각주의 범위를 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:13Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘사람들이 말하기를’은 וַיְצַוּוּ(‘그들이 백성에게 명령하였다’)의 권위 있는 명령 행위와 직접 목적어 הָעָם(‘백성’)을 충분히 옮기지 못합니다. 또한 신명 표기는 POB의 원어 우선 방침 및 영어 감사 기록의 ‘Yahweh’와 일치하도록 ‘야훼’로 통일하는 것이 적절합니다. 나머지 이동과 추종의 명령은 원문의 시간·공간 관계를 대체로 잘 반영합니다.
  naturalness: ‘백성에게 명령했습니다’와 ‘너희가 있는 곳을 떠나’는 현대 표준어 합쇼체에서 자연스럽고 명료합니다. ‘레위인 제사장들’은 ‘레위 사람 제사장들’보다 자연스러우면서도 제사장들이 레위인임을 나타냅니다.
  terminology: ‘언약궤’는 적절합니다. יהוה는 ‘야훼’로, הַכֹּהֲנִים הַלְוִיִּם는 ‘레위인 제사장들’로 옮기고, 원문의 대안적 동격 구조는 각주로 보존합니다.
  issues:
  - severity: high
    issue: ‘사람들이 말하기를 … 하였습니다’가 ‘그들이 백성에게 명령하였다’를 약화하고 ‘백성에게’를 누락합니다.
    rationale: וַיְצַוּוּ אֶת־הָעָם은 발화 일반이 아니라 백성을 향한 명령입니다. 번역은 명령의 화행과 수신자를 명시해야 합니다.
  - severity: medium
    issue: 본문의 ‘여호와’가 POB 원어명 표기 결정인 ‘Yahweh’와 불일치합니다.
    rationale: 제공된 영어 POB 감사 기록과 신명 번역 방침은 יהוה를 ‘Yahweh’로 옮깁니다. 한국어 본문도 음역 ‘야훼’로 일관되게 반영하는 것이 안전합니다.
  - severity: low
    issue: 각주 표지가 절 끝에 있어 대안이 가리키는 ‘레위인 제사장들’ 구절에 직접 연결되지 않습니다.
    rationale: 영어 감사 기록의 각주는 הַכֹּהֲנִים הַלְוִיִּם의 대안적 구문을 위한 것입니다. 해당 명사구 바로 뒤에 표지를 두어 범위를 분명히 해야 합니다.
  revised_text: 그들이 백성에게 명령했습니다. “너희 하나님 야훼의 언약궤와 그것을 메고 가는 레위인 제사장들[a]을 보거든, 너희가 있는 곳을 떠나 그 뒤를 따라가십시오.”
