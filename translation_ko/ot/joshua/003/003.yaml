id: JOS.3.3
reference: Joshua 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
  footnotes:
  - marker: a
    text: Or “the priests, the Levites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 백성에게 명령했습니다. “너희 하나님 야훼의 언약궤와 그것을 메고 가는 레위인 제사장들[a]을 보거든, 너희가 있는 곳을 떠나 그 뒤를 따라가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장들, 곧 레위 사람들.”
    reason: 히브리어 הַכֹּהֲנִים הַלְוִיִּם는 ‘레위인 제사장들’로 자연스럽게 옮길 수 있으나, ‘제사장들, 곧 레위 사람들’이라는 동격적 표현도 가능합니다.
lexical_decisions:
- source_word: וַיְצַוּוּ
  english_pob_choice: they commanded
  chosen_korean: 사람들이 말하기를 … 하였습니다
  alternatives_korean:
  - 그들이 명령하였습니다
  - 그들이 지시하였습니다
  lexicon: HALOT
  rationale: 원문은 권위 있는 지시를 나타내지만, 한국어에서는 뒤따르는 직접화법을 자연스럽게 이끄는 서술로 풀어도 의미가 보존됩니다. 다만 ‘명령하다’의 강한 직접성은 본절 전체의 기능상 유지했습니다.
- source_word: אֲרוֹן בְּרִית
  english_pob_choice: the ark of the covenant
  chosen_korean: 언약궤
  alternatives_korean:
  - 언약의 궤
  - 언약 상자
  lexicon: HALOT
  rationale: 성소 문맥의 고정 표현으로서 ‘언약궤’가 가장 간결하고 정확합니다. POB의 ‘ark of the covenant’에 해당하는 표준 대응을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 한국어 성서 독자에게는 본문 맥락에서 하나님의 언약명으로 ‘여호와’가 가장 널리 인지됩니다. 이 절은 한국어 판본의 가독성을 우선해 통용형을 따랐습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the Levitical priests
  chosen_korean: 레위 사람 제사장들
  alternatives_korean:
  - 레위인 제사장들
  - 레위계 제사장들
  - 제사장들, 곧 레위 사람들
  lexicon: HALOT
  rationale: 히브리어는 제사장들이 레위 지파에 속함을 나타내는 수식 구조입니다. ‘레위 사람 제사장들’은 두 집단이 아니라 레위 계열의 제사장을 가리키는 점을 비교적 직설적으로 살립니다.
- source_word: נֹשְׂאִים אֹתוֹ
  english_pob_choice: carrying it
  chosen_korean: 그 궤를 메고 있는
  alternatives_korean:
  - 그것을 지고 있는
  - 그것을 운반하는
  lexicon: HALOT
  rationale: 성소 기구를 사람의 어깨에 메어 옮기는 장면이므로 ‘메다’가 가장 자연스럽고 구체적입니다. ‘carry’의 동작성을 유지하면서 예배 문맥을 반영했습니다.
- source_word: תִּסְעוּ ... וַהֲלַכְתֶּם אַחֲרָיו
  english_pob_choice: you shall set out ... and go after it
  chosen_korean: 너희는 너희 자리에서 떠나 그 뒤를 따라가십시오
  alternatives_korean:
  - 출발하십시오
  - 나서십시오
  lexicon: HALOT
  rationale: תִּסְעוּ는 단순한 이동이 아니라 지금 있던 자리에서 떠나는 출발을 뜻하므로 ‘너희 자리에서 떠나’로 풀었습니다. אַחֲרָיו는 단순 추상적 ‘따르다’보다 방향성을 살린 ‘그 뒤를 따라가십시오’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 기록은 한국어 성서 독자에게 익숙한 언약명 표기를 우선해 읽기 흐름을 보존합니다. 본 절에서는 번역 전통과 공공 가독성이 우선되는 본문으로 판단했습니다.
  doctrine_reference: 'POB Korean draft policy: established Korean biblical forms for widely recognized divine names'
- issue: הַכֹּהֲנִים הַלְוִיִּם의 구조
  chosen_reading: 레위 사람 제사장들
  alternative_readings:
  - 레위인 제사장들
  - 제사장들, 곧 레위 사람들
  rationale: 원문은 제사장직과 레위 소속을 함께 말하므로, 한국어에서도 제사장과 레위의 관계가 흐려지지 않도록 직설적인 합성 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
