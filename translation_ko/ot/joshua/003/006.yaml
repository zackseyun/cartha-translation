id: JOS.3.6
reference: Joshua 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: ko
  text: 그때 여호수아가 제사장들에게 말했습니다. “언약궤를 메고 백성보다 앞서 건너가십시오.” 그래서 그들은 언약궤를 메고 백성보다 앞서 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר / said
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: WLC narrative waw-consecutive; POB audit trail
  rationale: 서술 진행을 자연스럽게 드러내면서도 사건의 선후관계를 유지하기 위해 ‘그때’로 옮겼습니다.
- source_word: הַכֹּהֲנִים / the priests
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: 이스라엘의 제의적 직분을 가리키므로 한국어 성경에서 일반적으로 쓰이는 ‘제사장들’이 원뜻을 가장 정확하게 전달합니다.
- source_word: שְׂאוּ / Take up
  english_pob_choice: Take up
  chosen_korean: 메고
  alternatives_korean:
  - 들고
  - 옮기고
  lexicon: HALOT
  rationale: 언약궤를 어깨에 메어 운반하는 구체적 장면을 살리기 위해 ‘메고’를 선택했습니다. ‘들고’는 동작은 맞지만 운반의 무게감이 약합니다.
- source_word: אֲרוֹן הַבְּרִית / the ark of the covenant
  english_pob_choice: the ark of the covenant
  chosen_korean: 언약궤
  alternatives_korean:
  - 언약의 궤
  - 언약궤
  lexicon: HALOT
  rationale: 히브리어의 관용적 결합어를 한국어 성경 관용과 맞는 한 단어로 옮기되, ‘궤’의 성격이 분명히 드러나도록 ‘언약궤’를 사용했습니다.
- source_word: וְעִבְרוּ / cross over
  english_pob_choice: cross over
  chosen_korean: 건너가십시오
  alternatives_korean:
  - 건너십시오
  - 건너가라
  lexicon: HALOT
  rationale: 요단 강을 건너는 맥락에서 단순한 이동보다 물리적 횡단을 드러내는 ‘건너가십시오’가 더 정확합니다.
- source_word: לִפְנֵי הָעָם / before the people
  english_pob_choice: before the people
  chosen_korean: 백성 앞에서
  alternatives_korean:
  - 백성 앞에
  - 백성 앞쪽에서
  lexicon: HALOT
  rationale: ‘לִפְנֵי’의 위치 관계를 자연스러운 한국어 어순으로 옮겼습니다.
theological_decisions:
- issue: 제사장들의 순종과 궤의 선행 배치
  chosen_reading: 언약궤를 메고 백성 앞에서 건너가십시오 ... 그들이 언약궤를 메고 백성 앞에 섰습니다
  alternative_readings:
  - 언약궤를 들고
  - 백성보다 앞서
  rationale: 본문은 단순 이동이 아니라 언약궤가 백성보다 앞서 가는 제의적·서사적 질서를 강조하므로, 그 구조를 그대로 살렸습니다.
  doctrine_reference: 민 10:33-36; 수 3:3-4
- issue: 말씀체의 높임과 직설명령
  chosen_reading: 제사장들에게 ... 건너가십시오
  alternative_readings:
  - 건너가세요
  - 건너가라
  rationale: 직접 인용 속 여호수아의 명령은 현대 한국어에서 공손한 명령형이 자연스럽고, 본문의 권위 있는 지시를 잘 드러냅니다.
  doctrine_reference: 서술체-직접화법 register handling
