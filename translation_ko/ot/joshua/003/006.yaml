  terminology: ‘여호수아’, ‘제사장들’, ‘언약궤’는 한국어 성경의 일반적 용례와 히브리어 본문에 잘 부합합니다. נשא는 여기서 궤를 들어 운반하는 뜻이므로 ‘메고’는 문맥상 가능한 번역입니다.
