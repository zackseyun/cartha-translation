id: JOS.5.3
reference: Joshua 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעַשׂ ל֥/וֹ יְהוֹשֻׁ֖עַ חַֽרְב֣וֹת צֻרִ֑ים וַ/יָּ֨מָל֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גִּבְעַ֖ת הָ/עֲרָלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
  footnotes:
  - marker: a
    text: Or “flint swords/blades”; the Hebrew word for the implement often means “sword,” but here refers to cutting tools used for circumcision.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “sons of Israel”; many translations render this “Israelites.”
    reason: lexical_alternative
  - marker: c
    text: Or transliterated “Gibeath-haaraloth.” The Hebrew means “Hill of the Foreskins.”
    reason: alternative_reading
translation:
  language: ko
  text: 여호수아는 자신을 위해 부싯돌 칼들을 만들어 이스라엘 자손에게 할례를 행하고 기브앗하아랄롯에서 그렇게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부싯돌 칼날들”입니다. 히브리어 낱말은 흔히 “칼”을 뜻하지만, 여기서는 할례에 쓰는 절단 도구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “이스라엘 자손”이라고 되어 있습니다. 많은 번역은 이를 “이스라엘 사람들”로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 음역하여 “기브앗-하아랄롯”입니다. 히브리어 이름의 뜻은 “포피의 언덕”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  english_pob_choice: made for himself
  chosen_korean: 자신을 위해 만들고
  alternatives_korean:
  - 그를 위해 만들고
  - 스스로 만들고
  lexicon: HALOT
  rationale: עשה는 여기서 단순히 ‘만들다’의 뜻이고, לוֹ는 여호수아 자신의 준비를 가리키므로 한국어에서는 자연스럽게 ‘자신을 위해’로 옮겼습니다.
- source_word: חַרְבוֹת צֻרִים
  english_pob_choice: flint knives
  chosen_korean: 부싯돌 칼들
  alternatives_korean:
  - 부싯돌 칼
  - 부싯돌 날들
  - 돌칼들
  lexicon: HALOT
  rationale: 직역상 ‘칼들’이지만, 할례 도구라는 기능이 분명하므로 POB의 기능적 선택을 따라 ‘부싯돌 칼들’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 형식을 보존하되 한국어에서 가장 자연스럽고 널리 이해되는 집합 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  english_pob_choice: at Gibeath-haaraloth
  chosen_korean: 길갈에서
  alternatives_korean:
  - 기브앗-하아랄롯에서
  - 포피의 언덕에서
  lexicon: HALOT
  rationale: 소스 본문은 지명 설명형이지만, POB 영어본의 최신 수정은 지명을 음역형으로 보존합니다. 한국어에서는 이미 익숙한 해당 장소명인 ‘길갈’로 옮겨 본문의 위치 지시를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 지명 Gibeath-haaraloth의 처리
  chosen_reading: 본문에는 기능적 위치 표지로 ‘길갈에서’를 두고, 원어 지명 설명은 본문 밖에서 주석으로 다루지 않았습니다.
  alternative_readings:
  - 기브앗-하아랄롯에서
  - 포피의 언덕에서
  rationale: 히브리어는 ‘할례피부의 언덕/포피의 언덕’이라는 뜻을 내포하지만, 이 절의 내러티브 기능은 그 장소에서 할례가 시행되었다는 사실에 있으므로 한국어 본문은 독자에게 익숙한 지명으로 처리하는 편이 더 직접적입니다.
  doctrine_reference: 본문 해석과 지명 전달 방식에 관한 번역상의 판단
- issue: 할례 행위의 서술 방식
  chosen_reading: ‘그 할례를 행했습니다’로 옮겨, 행위의 목적성과 실제 시행을 분명히 했습니다.
  alternative_readings:
  - ‘할례를 베풀었습니다’
  - ‘할례했습니다’
  rationale: 히브리어 וַיָּמָל은 단순 과거의 ‘할례하다’이므로, 한국어에서도 의례적 완곡어보다 직접적 서술이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 율법적 표지와 언약 순종에 관한 서술
