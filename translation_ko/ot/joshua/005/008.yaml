  source_fidelity: 히브리어의 시간 절, 공동체 전체의 할례 완료, 진영 안에서의 체류, 그리고 חיה의 회복 의미를 대체로 충실히 반영합니다. 다만 ‘할례를 받기를 다 마쳤을 때’는 한국어에서 부자연스럽고, ‘각기 자기 자리’는 원문이 명시하지 않은 개별적 분배의 뉘앙스를 더합니다.
