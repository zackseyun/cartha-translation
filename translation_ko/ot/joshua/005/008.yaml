id: JOS.5.8
reference: Joshua 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֛י כַּ/אֲשֶׁר תַּ֥מּוּ כָל הַ/גּ֖וֹי לְ/הִמּ֑וֹל וַ/יֵּשְׁב֥וּ תַחְתָּ֛/ם בַּֽ/מַּחֲנֶ֖ה עַ֥ד חֲיוֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
  footnotes:
  - marker: a
    text: Or 'until they were healed' or 'until they revived.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 백성이 할례 받는 일을 모두 마쳤을 때, 그들은 회복될 때까지 진영에서 제자리에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘치유될 때까지’, ‘기력을 회복할 때까지’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: 그리고 … 때
  alternatives_korean:
  - 그리고 … 했을 때
  - 그때 … 때
  lexicon: HALOT
  rationale: 히브리어 서사 공식은 시간적 전환을 여는 표현이므로, 한국어에서는 ‘그리고 … 때’로 자연스럽게 연결하되 사건 순서를 유지했습니다.
- source_word: תַּמּוּ
  english_pob_choice: had finished
  chosen_korean: 다 마쳤을 때
  alternatives_korean:
  - 끝났을 때
  - 마쳤을 때
  lexicon: HALOT
  rationale: 동작의 완료를 분명히 드러내기 위해 ‘다 마쳤을 때’로 옮겼습니다.
- source_word: לְהִמּוֹל
  english_pob_choice: being circumcised
  chosen_korean: 할례를 받기를
  alternatives_korean:
  - 할례를 받는 것
  - 할례를 받도록
  lexicon: HALOT
  rationale: נִפְעַל형의 수동·피동적 의미를 살려, 결과절처럼 자연스러운 ‘할례를 받기를’로 표현했습니다.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  english_pob_choice: they remained in their places
  chosen_korean: 그들은 … 각기 자기 자리에 머물렀습니다
  alternatives_korean:
  - 그들은 그 자리에 있었습니다
  - 그들은 제자리에서 머물렀습니다
  lexicon: HALOT
  rationale: 관용적으로 ‘떠나지 않고 그 자리에 머물다’는 뜻이므로, 공간적 ‘아래에’라는 직역을 피하고 문맥에 맞는 한국어 표현으로 옮겼습니다.
- source_word: עַד חֲיוֹתָם
  english_pob_choice: until they recovered
  chosen_korean: 회복할 때까지
  alternatives_korean:
  - 낫기까지
  - 살아나기까지
  - 원기를 되찾을 때까지
  lexicon: HALOT
  rationale: 여기서는 할례 후 회복을 가리키므로, ‘회복하다’가 가장 간결하면서도 원문의 의미 폭을 적절히 담습니다.
theological_decisions:
- issue: 이스라엘 공동체를 가리키는 גּוֹי의 집합성
  chosen_reading: ‘온 백성’으로 옮겨 이스라엘 공동체 전체가 한 몸처럼 할례를 마쳤다는 집합성을 드러냈습니다.
  alternative_readings:
  - ‘온 민족’
  - ‘온 나라’
  rationale: 문맥상 특정 민족 집단인 이스라엘을 가리키므로, 현대 한국어에서 자연스럽고 집합성을 살리는 ‘백성’을 선택했습니다.
  doctrine_reference: 언약 공동체의 집합적 순종
- issue: 할례 직후의 상태를 단순 상처 치유보다 포괄적으로 표현
  chosen_reading: ‘회복할 때까지’로 번역해 신체적 치유뿐 아니라 기력 회복까지 포함하는 원문의 폭을 보존했습니다.
  alternative_readings:
  - ‘낫기까지’
  - ‘치유될 때까지’
  rationale: 히브리어 חיה는 여기서 단순한 상처 치료만이 아니라 생기/기력의 회복도 함축할 수 있으므로, 과도하게 좁히지 않았습니다.
  doctrine_reference: 본문의 어휘 범위 보존
