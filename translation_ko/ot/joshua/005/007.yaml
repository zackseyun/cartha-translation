source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
  footnotes:
  - marker: a
    text: Or 'instead of them'; the Hebrew phrase indicates that these sons took the place of the previous generation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 대신 세워진 그들의 아들들[a]에게 여호수아가 할례를 행했습니다. 그들이 할례를 받지 않았기 때문입니다. 이는 길에서 그들에게 할례를 행하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 대신’입니다. 히브리어 표현은 이 아들들이 이전 세대를 대신하게 되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  english_pob_choice: their sons
  chosen_korean: 그들의 아들들
  alternatives_korean:
  - 그들의 자녀들
  - 그들의 아들
  lexicon: HALOT
  rationale: 할례 문맥에서 בָּנִים은 남자 자녀를 가리키므로, 보다 넓은 ‘자녀들’보다 ‘아들들’이 정확합니다.
- source_word: הֵקִים תַּחְתָּם
  english_pob_choice: had raised up ... in their place
  chosen_korean: 그들의 자리에 세워 두고
  alternatives_korean:
  - 그들 대신 세워 두고
  - 그들 대신 일으켜 세우고
  lexicon: HALOT
  rationale: תַּחַת의 대체·대신 의미를 살리면서, 한국어에서 자연스러운 ‘그들의 자리에’로 후속 세대의 승계를 드러냈습니다.
- source_word: מָל יְהוֹשֻׁעַ
  english_pob_choice: Joshua circumcised
  chosen_korean: 여호수아는 ... 할례를 행했습니다
  alternatives_korean:
  - 여호수아는 ... 할례했습니다
  - 여호수아는 ... 포피를 베었습니다
  lexicon: HALOT
  rationale: מול의 통상적 의미를 따라 문맥상 가장 명료한 ‘할례를 행했습니다’를 택했습니다.
- source_word: עֲרֵלִים
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않았기 때문에
  alternatives_korean:
  - 무할례였기 때문에
  - 포피가 벗겨지지 않았기 때문에
  lexicon: HALOT
  rationale: 문맥의 관용적 의미를 살려 ‘할례받지 않았다’로 옮기면 covenantal 상태를 자연스럽고 직접적으로 표현할 수 있습니다.
- source_word: בַּדָּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길에서
  alternatives_korean:
  - 여정 중에
  - 가는 길에
  lexicon: HALOT
  rationale: 광야 이동의 맥락을 반영하면서도 현대 한국어에서 간결하고 자연스럽게 읽히는 표현입니다.
theological_decisions:
- issue: ‘할례받지 않음’의 언약적 의미
  chosen_reading: 문자적 육체 상태를 가리키는 ‘할례받지 않았기 때문에’로 유지합니다.
  alternative_readings:
  - 영적 무할례로 확장하여 표현하는 것
  - 완곡하게 ‘정결하지 않았기 때문에’로 바꾸는 것
  rationale: 이 절은 상징적 해석보다 실제 할례 행위를 설명하는 서술이므로, 언약 표지로서의 신체적 상태를 직접 드러내는 번역이 원문에 더 충실합니다.
  doctrine_reference: 창세기 17장 언약 표지, 여호수아 5장 문맥
