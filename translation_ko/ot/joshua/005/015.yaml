id: JOS.5.15
reference: Joshua 5:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
  footnotes:
  - marker: a
    text: Or “the army of the LORD” or “the host of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew singular: “your sandal ... your foot.” Compare the more familiar plural wording in Exodus 3:5.'
    reason: cross_reference
translation:
  language: ko
  text: 그러자 야훼 군대의 사령관[a]이 여호수아에게 말했습니다. 「당신의 발에서 신[b]을 벗으십시오. 당신이 서 있는 곳은 거룩하기 때문입니다.」 여호수아는 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 군대 사령관’ 또는 ‘야훼의 군대 지휘관’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘신’과 ‘발’이 모두 단수형입니다. 더 익숙한 출애굽기 3:5의 복수형 표현과 비교하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר צְבָא יְהוָה
  english_pob_choice: the commander of Yahweh’s army
  chosen_korean: 야훼의 군대 장관
  alternatives_korean:
  - 야훼의 군대 사령관
  - 야훼의 군대 대장
  - 야훼의 군대 지휘관
  lexicon: HALOT
  rationale: צָבָא의 군사적 의미를 살려 ‘군대’로 옮기고, שַׂר는 현대 한국어에서 위계와 지휘를 드러내는 ‘장관’으로 옮겨 원문의 직책성을 분명히 했습니다.
- source_word: שַׁל
  english_pob_choice: Take ... off
  chosen_korean: 벗어라
  alternatives_korean:
  - 빼라
  - 치워라
  - 제거해라
  lexicon: HALOT
  rationale: 신발을 신체에서 분리하는 명령으로서 현대 한국어에서 가장 자연스럽고 직접적인 동사입니다.
- source_word: נַעַלְךָ
  english_pob_choice: your sandal
  chosen_korean: 네 신
  alternatives_korean:
  - 네 샌들
  - 네 신발
  - 네 신발 한 짝
  lexicon: HALOT
  rationale: 히브리어 단수형을 살리면서도 고대 발화의 간결함을 유지하기 위해 ‘신’으로 옮겼습니다. ‘샌들’은 설명적이지만 한국어 본문에서는 다소 현대적입니다.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  english_pob_choice: the place where you are standing
  chosen_korean: 네가 서 있는 곳
  alternatives_korean:
  - 네가 서 있는 그곳
  - 네가 발 딛고 선 곳
  - 네가 그 위에 서 있는 곳
  lexicon: HALOT
  rationale: ‘place where you are standing’의 의미를 자연스럽게 전달하되, 본문에 없는 지시어를 과도하게 보태지 않도록 간결하게 옮겼습니다.
- source_word: קֹדֶשׁ הוּא
  english_pob_choice: is holy
  chosen_korean: 거룩하기 때문이다
  alternatives_korean:
  - 거룩한 곳이기 때문이다
  - 성스러운 곳이기 때문이다
  - 거룩하다
  lexicon: HALOT
  rationale: 원문의 서술문을 한국어 종속절로 풀어 명령의 이유를 분명히 드러냈습니다. ‘거룩하다’는 용어를 유지해 קֹדֶשׁ의 종교적 강도를 보존했습니다.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  english_pob_choice: And Joshua did so
  chosen_korean: 여호수아는 그대로 행했습니다
  alternatives_korean:
  - 여호수아가 그렇게 했습니다
  - 여호수아가 그대로 따랐습니다
  - 여호수아가 그렇게 하였습니다
  lexicon: HALOT
  rationale: 순종의 응답을 서술하는 관용구를 현대 한국어로 자연스럽게 옮겼습니다. ‘그대로’는 명령과 실행의 일치를 강조합니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 고유한 신적 이름을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: POB의 원칙에 따라 신적 칭호로 대체하지 않고, 텍스트가 가진 하나님의 이름을 보존했습니다.
  doctrine_reference: Tetragrammaton transliteration policy
- issue: 해당 존재의 정체를 특정할 것인가
  chosen_reading: ‘야훼의 군대 장관’이라고 기술적으로만 옮기고, 천사/신현/그리스도 현현으로는 규정하지 않았습니다.
  alternative_readings:
  - 천사장
  - 야훼의 현현
  - 선재하신 메시아의 나타남
  rationale: 본문 자체는 직함만 제시하므로, 해석 전통이 갈리는 부분을 번역에서 확정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
