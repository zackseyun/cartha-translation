  source_fidelity: 원문의 직함(שַׂר צְבָא יְהוָה), 단수형 ‘신/발’, 거룩한 장소라는 이유, 그리고 여호수아의 이행을 보존해야 합니다. 초안의 ‘군대 장관’은 현대 한국어에서 군(軍)의 장관 또는 행정직을 연상시켜 군사 지휘관이라는 שַׂר의 의미를 정확히 전달하지 못합니다.
  naturalness: ‘야훼 군대의 사령관’이 현대 표준어에서 자연스럽고 직책의 지휘 의미를 분명히 합니다. 합쇼체에 맞추어 직접 명령도 ‘벗으십시오’로 고쳤습니다. ‘그대로 행했습니다’보다 ‘그렇게 했습니다’가 현대 한국어의 서술로 더 자연스럽습니다.
