- from: 그러자 야훼의 군대 장관이 여호수아에게 말했습니다. 「네 발에서 네 신을 벗어라. 네가 서 있는 곳은 거룩하기 때문이다.」 여호수아는 그대로 행했습니다.[a][b]
  to: 그러자 야훼 군대의 사령관[a]이 여호수아에게 말했습니다. 「당신의 발에서 신[b]을 벗으십시오. 당신이 서 있는 곳은 거룩하기 때문입니다.」 여호수아는 그렇게 했습니다.
  rationale: 군사 지휘관을 뜻하는 שַׂר를 ‘사령관’으로 바로잡고, 합쇼체의 직접 화법으로 통일했습니다. 원문의 단수형은 한국어 본문 ‘신’ 및 각주에서 보존했으며, 본문이 밝히지 않는 화자의 정체는 해석적으로 보태지 않았습니다.
