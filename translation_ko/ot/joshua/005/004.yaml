revisions:
- from: 여호수아가 할례를 행한 이유는 이렇습니다. 곧 이집트에서 나온 모든 백성, 곧 남자들, 곧 모든 전쟁에 나가는 남자들은 광야에서, 이집트에서 나온 길에서 죽었습니다.[a][b]
  to: 여호수아가 그들에게 할례를 행한 까닭은 이러합니다[a]. 이집트에서 나온 모든 백성 가운데 남자들, 곧 모든 전쟁에 나가는 사람들은[b] 이집트에서 나온 뒤 광야를 지나가는 길에 죽었습니다.
  rationale: 문맥상 보충되는 할례 대상은 ‘그들에게’로 명시하되, 원문의 설명 도입 기능을 ‘까닭은 이러합니다’로 자연스럽게 살렸습니다. 남성과 전쟁 수행자라는 두 한정을 ‘모든 백성 가운데 남자들, 곧 …’으로 연결하여 범위를 분명히 했습니다. 마지막 여정 표현은 출애굽 뒤 광야에서 진행된 길이라는 원문의 시간·장소 요소를 모두 보존하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:52:20Z'
