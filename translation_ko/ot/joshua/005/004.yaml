id: JOS.5.4
reference: Joshua 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁר מָ֣ל יְהוֹשֻׁ֑עַ כָּל הָ/עָ֣ם הַ/יֹּצֵא֩ מִ/מִּצְרַ֨יִם הַ/זְּכָרִ֜ים כֹּ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה מֵ֤תוּ בַ/מִּדְבָּר֙ בַּ/דֶּ֔רֶךְ בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
  footnotes:
  - marker: a
    text: 'Or, more formally, ''And this is the matter that Joshua circumcised: all the people...'' The Hebrew expression is idiomatic and introduces the explanation for Joshua''s action.'
    reason: lexical_alternative
  - marker: b
    text: '''Men of war'' may also be rendered ''fighting men'' or ''warriors.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 그들에게 할례를 행한 까닭은 이러합니다[a]. 이집트에서 나온 모든 백성 가운데 남자들, 곧 모든 전쟁에 나가는 사람들은[b] 이집트에서 나온 뒤 광야를 지나가는 길에 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘이것이 여호수아가 할례를 행한 일이다’라고 할 수 있습니다. 여기서는 그 행위의 이유나 사정을 설명하는 관용적 도입구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 전사들’, ‘모든 전투원들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  english_pob_choice: And this is the reason
  chosen_korean: 이렇습니다
  alternatives_korean:
  - 이것이 그 일입니다
  - 이것이 그 이유입니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 앞선 행위의 설명을 여는 기능이므로, 한국어에서는 자연스럽게 원인·이유를 밝혀 주는 문맥으로 옮겼습니다.
- source_word: אֲשֶׁר מָל יְהוֹשֻׁעַ
  english_pob_choice: why Joshua circumcised them
  chosen_korean: 여호수아가 할례를 행한
  alternatives_korean:
  - 여호수아가 할례를 베푼
  - 여호수아가 그들을 할례한
  lexicon: HALOT
  rationale: ‘할례를 행하다’는 한국어 성경 문맥에서 가장 직접적이고 오해가 적은 표현이며, 본문의 설명적 기능을 그대로 살립니다.
- source_word: הַזְּכָרִים כֹּל אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the males, all the men of war
  chosen_korean: 곧 남자들, 곧 모든 전쟁에 나가는 남자들
  alternatives_korean:
  - 곧 수컷들, 곧 모든 전사들
  - 곧 남성들, 곧 모든 전투원들
  lexicon: HALOT
  rationale: ‘הַזְּכָרִים’는 성별 표지를 분명히 하므로 ‘남자들’로 옮기고, ‘אַנְשֵׁי הַמִּלְחָמָה’는 군사적 정체성을 살리되 현대 독자가 이해할 수 있게 ‘전쟁에 나가는 남자들’로 풀었습니다.
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  english_pob_choice: in the wilderness on the way
  chosen_korean: 광야에서, 이집트에서 나온 길에서
  alternatives_korean:
  - 광야에서, 도중에
  - 광야에서, 가는 길에서
  lexicon: HALOT
  rationale: ‘광야’는 표준 성경어를 유지하고, ‘בַּדֶּרֶךְ’는 단순한 장소보다 여정의 경로를 뜻하므로 ‘이집트에서 나온 길’로 옮겨 원문의 이동 감각을 살렸습니다.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  english_pob_choice: after they came out of Egypt
  chosen_korean: 이집트에서 나온
  alternatives_korean:
  - 이집트에서 나온 뒤
  - 이집트에서 나올 때
  lexicon: HALOT
  rationale: 시간 부사절의 관계를 살리면서도 문장을 과도하게 늘리지 않기 위해 앞의 ‘길’에 수식으로 붙였습니다.
theological_decisions:
- issue: ‘men of war’의 군사적 정체성 표현
  chosen_reading: 전쟁에 나가는 남자들
  alternative_readings:
  - 전사들
  - 군사들
  rationale: 본문은 단순한 연령·성별 구분이 아니라 출애굽 당시의 전투 가능한 세대를 가리키므로, 군사적 성격을 분명히 하되 현대어로 과장하지 않게 처리했습니다.
  doctrine_reference: 본문-문맥 중심의 서술적 번역
- issue: ‘wilderness on the way’의 중첩된 장소·여정 표현
  chosen_reading: 광야에서, 이집트에서 나온 길에서
  alternative_readings:
  - 광야에서 길에서
  - 광야에서 도중에
  rationale: 광야와 길의 병렬은 단순 중복이 아니라 심판 아래 진행된 출애굽 여정을 강조하므로, 두 요소를 모두 드러내는 쪽을 택했습니다.
  doctrine_reference: 출애굽/광야 세대의 역사 서술
