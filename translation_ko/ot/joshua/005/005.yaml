  text: 이는 애굽에서 나온 모든 백성은 할례를 받았지만, 애굽에서 나온 뒤 광야를 가는 길에 태어난 모든 백성은 할례를 받지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘애굽에서 나올 때 광야에서 길을 가는 동안 태어난 모든 백성은 할례를 받지 않았습니다.’
    reason: lexical_alternative
