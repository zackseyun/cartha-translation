  rationale: 문맥상 여호수아 5장의 서술 기능을 보존해야 하므로, 신학적 의미를 과도하게 확장하거나 약화하지 않고 사실 진술로 옮겼습니다.
  doctrine_reference: 언약 표지로서의 할례(창 17장, 수 5장 문맥)
