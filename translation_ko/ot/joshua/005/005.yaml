  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
  footnotes:
  - marker: a
    text: Or, more formally, 'all the people born in the wilderness along the way as they came out from Egypt had not been circumcised.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 출애굽하여 나온 모든 백성은 할례를 받았기 때문이지만, 광야에서 길을 따라 애굽에서 나올 때 태어난 모든 백성은 할례를 받지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘애굽에서 나오던 길에 광야에서 태어난 모든 백성은 할례를 받지 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문이지만
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞선 진술(5:4)에 대한 설명을 자연스럽게 잇되, 뒤의 대조를 함께 살리기 위해 ‘이는 … 때문이지만’으로 옮겼습니다.
- source_word: מֻלִים הָיוּ
  english_pob_choice: had been circumcised
  chosen_korean: 할례를 받았
  alternatives_korean:
  - 할례를 받았었습니다
  - 할례를 받은 상태였습니다
  lexicon: HALOT
  rationale: 이미 완료된 상태를 나타내므로 단순 과거보다 완료된 상태를 드러내는 표현이 적절합니다.
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  english_pob_choice: in the wilderness on the way
  chosen_korean: 광야에서 길을 따라
  alternatives_korean:
  - 광야에서 여행하는 동안
  - 광야에서 가는 길에
  lexicon: HALOT
  rationale: 광야와 길이라는 두 지시를 모두 살리되, 한국어로는 ‘길을 따라’가 가장 자연스럽게 이동 경로를 나타냅니다.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  english_pob_choice: as they came out from Egypt
  chosen_korean: 애굽에서 나올 때
  alternatives_korean:
  - 애굽에서 나온 때에
  - 애굽에서 나오는 동안
  lexicon: HALOT
  rationale: 동시적·과정적 시점을 간결하게 표현하면서, 출애굽 사건의 맥락을 유지했습니다.
theological_decisions:
- issue: 할례 명령의 상태 서술을 어떻게 유지할지
  chosen_reading: 본문은 명령이나 평가가 아니라, 출애굽 세대와 광야 출생 세대의 할례 유무라는 역사적 상태를 서술합니다.
  alternative_readings:
  - 언약 표지의 준수 여부를 강조하는 해석
  - 단순한 의례 누락으로 약화하는 해석
  rationale: 문맥상 여호수아 5장의 서술 기능을 보존해야 하므로, 신학적 의미를 과도하게 확장하거나 약화하지 않고 사실 진술로 옮겼습니다.
  doctrine_reference: 언약 표지로서의 할례(창 17장, 수 5장 문맥)
