base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
  footnotes:
  - marker: a
    text: Or, 'all the kings of the Canaanites who were on the coast'; 'by the sea' refers to the coastal region.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts and ancient versions read 'until they had crossed over' instead of 'until we had crossed over.'
    reason: textual_variant
  - marker: c
    text: Hebrew 'there was no longer spirit in them,' an idiom for lost courage or resolve.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요단강 건너편 서쪽에 있던 모든 아모리 사람의 왕들과 바닷가에 있던[a] 모든 가나안 사람의 왕들이, 야훼께서 이스라엘 자손 앞에서 우리가 건너기까지[b] 요단강 물을 말리셨다는 말을 듣자, 그들의 마음이 녹았고 이스라엘 자손 때문에 그들에게는 더 이상 기운이 없었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바닷가에 있던’은 해안 지역에 있던이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본과 고대 역본은 ‘우리가 건너기까지’ 대신 ‘그들이 건너기까지’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어를 직역하면 ‘그들 안에 더 이상 영이 없었다’입니다. 이는 용기나 기력을 잃었음을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
