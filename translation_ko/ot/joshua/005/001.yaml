revisions:
- from: 그리고 그 땅의 모든 아모리 사람의 왕들—곧 요단 저쪽 서쪽에 있는 왕들과 바닷가에 있는 모든 가나안 사람의 왕들이—야훼께서 이스라엘 자손 앞에서 요단의 물을 마르게 하셔서 우리가 건너올 때까지 하신 일을 듣고, 그들의 마음이 녹아 버렸으며, 이스라엘 자손 때문에 더 이상 그들 속에 영이 없었습니다.[a][b][c]
  to: 그때 요단강 건너편 서쪽에 있던 모든 아모리 사람의 왕들과 바닷가에 있던[a] 모든 가나안 사람의 왕들이, 야훼께서 이스라엘 자손 앞에서 우리가 건너기까지[b] 요단강 물을 말리셨다는 말을 듣자, 그들의 마음이 녹았고 이스라엘 자손 때문에 그들에게는 더 이상 기운이 없었습니다.[c]
  rationale: 원문에 없는 첨가를 제거하고, 요단강 물을 말리신 행위와 ‘우리가 건너기까지’의 시간 한정을 자연스러운 한국어 어순으로 복원했습니다. 마소라 본문의 1인칭 복수 독법을 본문에 보존했으며, 대안 독법은 해당 구절에 각주로 제시했습니다. רוּחַ는 이 문맥의 관용적 의미에 따라 ‘기운’으로 옮기고 직역적 표현은 각주에서 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:22Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그 땅의’는 원문에 없으므로 삭제해야 하며, ‘마르게 하셔서 우리가 건너올 때까지 하신 일’은 히브리어의 종속 관계를 불분명하게 만듭니다. 원문은 야훼께서 이스라엘 자손이 건널 때까지 요단강 물을 말리셨다는 사실을 왕들이 들은 것으로 표현합니다. עַד עברנו의 마소라 본문상 1인칭 복수는 본문에 유지하고, 3인칭 복수 이문은 각주로 처리합니다.
  naturalness: ‘그들의 마음이 녹아 버렸으며’는 이해 가능하나 ‘버리다’는 원문에 없는 완료·소진의 뉘앙스를 더합니다. 또한 ‘그들 속에 영이 없었습니다’는 현대 한국어에서 부자연스럽고 신학적 ‘영’으로 오해될 수 있습니다. 이 문맥의 רוּחַ는 용기·기력의 상실을 뜻하므로 ‘더 이상 기운이 없었습니다’가 자연스럽고 의미상 정확합니다. 각주에서 히브리어 관용 표현과 직역을 보존합니다.
  terminology: 야훼 및 이스라엘 자손은 유지합니다. ‘요단’은 한국어 성서 지명 관행에 맞춰 ‘요단강’으로 명시했습니다. ‘바닷가’는 해안 지역이라는 뜻을 유지하되 해당 위치에 각주를 답니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘그 땅의’가 추가됨
    rationale: כָּל מַלְכֵי הָאֱמֹרִי는 ‘모든 아모리 사람의 왕들’이며 ‘그 땅의’에 해당하는 말이 없습니다.
  - severity: high
    issue: ‘마르게 하셔서 우리가 건너올 때까지 하신 일’의 구문이 원문의 수식 관계를 흐림
    rationale: ‘우리가 건너기까지’는 요단 물을 말린 기간을 한정합니다. ‘하신 일’로 명사화하면 무엇을 언제까지 하셨는지가 어색하고 불명확해집니다.
  - severity: medium
    issue: רוּחַ를 ‘영’으로 본문에 옮긴 표현이 문맥상 부자연스럽고 오해 소지가 있음
    rationale: 여기서 רוּחַ는 공포로 인한 기력·용기의 상실을 뜻하는 관용적 용법입니다. 한국어 본문에서는 ‘기운’이 자연스럽고, 직역적 이미지 및 관용 의미는 각주에 보존하는 편이 적절합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있음
    rationale: 각주 a는 ‘바닷가’, b는 ‘우리가 건너기까지’, c는 ‘기운이 없었습니다’에 각각 붙여야 참조 대상이 분명합니다.
