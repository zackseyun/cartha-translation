base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
  footnotes:
  - marker: a
    text: Or, 'all the kings of the Canaanites who were on the coast'; 'by the sea' refers to the coastal region.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts and ancient versions read 'until they had crossed over' instead of 'until we had crossed over.'
    reason: textual_variant
  - marker: c
    text: Hebrew 'there was no longer spirit in them,' an idiom for lost courage or resolve.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅의 모든 아모리 사람의 왕들—곧 요단 저쪽 서쪽에 있는 왕들과 바닷가에 있는 모든 가나안 사람의 왕들이—야훼께서 이스라엘 자손 앞에서 요단의 물을 마르게 하셔서 우리가 건너올 때까지 하신 일을 듣고, 그들의 마음이 녹아 버렸으며, 이스라엘 자손 때문에 더 이상 그들 속에 영이 없었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바닷가에 있는’은 ‘해안 지역에 있는’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본과 옛 역본은 ‘우리가 건넜을 때까지’ 대신 ‘그들이 건넜을 때까지’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어는 직역하면 ‘그들 속에 더 이상 영이 없었다’는 뜻으로, 용기와 결의의 상실을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 있었습니다
  - 그때
  lexicon: HALOT
  rationale: 새 장면을 여는 서술 표지로서의 기능을 살려 자연스럽게 연결하되, 과도한 관용구는 피했습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  english_pob_choice: beyond the Jordan to the west
  chosen_korean: 요단 저쪽 서쪽에 있는
  alternatives_korean:
  - 요단 건너편 서쪽의
  - 요단강 건너 서쪽의
  lexicon: HALOT
  rationale: 지리적 관계를 한국어 독자가 바로 이해하도록 풀어 쓰되, ‘저쪽/서쪽’의 방향 감각을 유지했습니다.
- source_word: עַל הַיָּם
  english_pob_choice: by the sea
  chosen_korean: 바닷가에 있는
  alternatives_korean:
  - 바다에 있는
  - 해안에 있는
  lexicon: HALOT
  rationale: 해안 지역을 가리키는 표현으로 이해하여 직역보다 지리적 의미가 드러나게 옮겼습니다.
- source_word: הוֹבִישׁ יְהוָה
  english_pob_choice: Yahweh had dried up
  chosen_korean: 야훼께서 ... 마르게 하셔서
  alternatives_korean:
  - 야훼께서 ... 말리셔서
  - 야훼께서 ... 마르게 하셨고
  lexicon: HALOT
  rationale: 하iphil의 사역적 의미를 살려 ‘마르게 하시다’로 옮겼고, 전후 서술 흐름에 맞게 연결했습니다.
- source_word: וַיִּמַּס לְבָבָם
  english_pob_choice: their heart melted
  chosen_korean: 그들의 마음이 녹아 버렸으며
  alternatives_korean:
  - 그들의 마음이 녹았으며
  - 그들의 심장이 녹아 버렸으며
  lexicon: HALOT
  rationale: 히브리어의 은유를 한국어에서 자연스럽게 풀어 ‘마음이 녹다’로 옮기되, 두려움과 무력감의 강도를 살렸습니다.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  english_pob_choice: there was no longer spirit in them
  chosen_korean: 더 이상 그들 속에 영이 없었습니다
  alternatives_korean:
  - 더 이상 그들 속에 기개가 없었습니다
  - 더 이상 그들 속에 용기가 없었습니다
  lexicon: HALOT
  rationale: רוּחַ의 기본 이미지를 보존하기 위해 ‘영’을 택했고, 문맥상 용기/기개의 상실을 담고자 했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손들
  lexicon: HALOT
  rationale: 관용적인 성서 표현을 유지하면서도 현대 한국어에서 자연스럽고 널리 이해되는 형태로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 있는 신명사고유명사를 번역어 제목으로 대체하지 않고 음역하여, 출애굽-언약 전승의 고유한 신적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: רוּחַ의 의미
  chosen_reading: 영
  alternative_readings:
  - 용기
  - 기개
  rationale: 문맥상 두려움과 의기소침을 뜻하지만, ‘영’이 히브리어의 이미지와 폭을 가장 직접적으로 보존하므로 본문은 이를 택하고, 의미는 문맥이 드러내게 했습니다.
  doctrine_reference: HALOT lexical range for רוּחַ
