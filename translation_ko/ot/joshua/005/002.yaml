id: JOS.5.2
reference: Joshua 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
  footnotes:
  - marker: a
    text: Or “knives of flint.” The Hebrew expression refers to cutting implements made from flint, used here for circumcision.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the sons of Israel”; many translations render this more generally as “the Israelites.”
    reason: lexical_alternative
  - marker: c
    text: “A second time” refers to carrying out circumcision again for Israel as a people, not necessarily circumcising the same individuals twice.
    reason: cultural_note
translation:
  language: ko
  text: 그때에 야훼께서 여호수아에게 말씀하셨습니다. 「너 자신을 위해 부싯돌 칼들을 만들어라. 그리고 이스라엘 자손에게 다시 할례를 행하여라. 두 번째로 말이다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 부싯돌 칼들은 직역하면 ‘부싯돌로 된 칼들’이며, 할례에 쓰이는 절단 도구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘다시’와 ‘두 번째로’는 이스라엘 공동체에 할례를 재시행한다는 뜻이지, 같은 사람들에게 물리적으로 두 번 할례하라는 뜻은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그때
  lexicon: HALOT
  rationale: 내러티브를 여는 표준적인 시간 표현으로, 현대 한국어에서 자연스럽고 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, POB 기본 원칙에 따라 대체 칭호가 아닌 음역형인 야훼를 사용했습니다.
- source_word: חַרְבוֹת צֻרִים
  english_pob_choice: flint knives
  chosen_korean: 부싯돌 칼들
  alternatives_korean:
  - 부싯돌 칼
  - 부싯돌 도구
  lexicon: HALOT
  rationale: צֻרִים은 재질이 부싯돌임을 밝히고, חַרְבוֹת는 여기서 절단 도구를 가리키므로 할례 문맥에 맞게 '칼들'로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 유지하되, 한국어에서 문맥상 자연스럽고 관용적인 집합 표현으로 전달했습니다.
theological_decisions:
- issue: 여호수아에게 주시는 명령문의 격식과 직접 인용의 어조
  chosen_reading: 본문은 서술지문은 합쇼체로 유지하고, 직접 명령은 명령형으로 간결하게 옮겼습니다.
  alternative_readings:
  - 더 공손한 청유형
  - 완곡한 설명문
  rationale: 야훼의 직접 명령이라는 긴장을 살리기 위해, 한국어에서 명령의 직접성을 약화시키지 않는 형태를 택했습니다.
  doctrine_reference: 'Translation philosophy: source-direct, tension-preserving rendering'
