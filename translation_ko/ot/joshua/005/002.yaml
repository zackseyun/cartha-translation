  to: 그때에 야훼께서 여호수아에게 말씀하셨습니다. 「너를 위하여 부싯돌 칼들[a]을 만들어라. 그리고 이스라엘 자손[b]들에게 다시, 두 번째로[c] 할례를 행하여라.」
