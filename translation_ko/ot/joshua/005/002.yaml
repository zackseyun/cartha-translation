  source_fidelity: 히브리어의 시간 표현, 신명 야훼, 부싯돌 절단 도구, 이스라엘 자손, 그리고 반복을 나타내는 וְשׁוּב 및 שֵׁנִית는 모두 번역에 반영되어 있습니다. 다만 לְךָ를 ‘너 자신을 위해’로 옮기면 한국어에서 자기 이익을 위한 행동이라는 불필요한 뉘앙스가 생깁니다. 또한 ‘두 번째로 말이다’는 원문의 부가적 강조를 살리려 한 것이나 현대 한국어 성경 문체로는 지나치게 구어적이고 분절적입니다.
  naturalness: ‘부싯돌 칼들’과 ‘이스라엘 자손’은 문맥상 자연스럽습니다. 직접 명령문에는 ‘만들어라/행하여라’를 유지하여 야훼의 직접 명령을 보존할 수 있습니다. ‘다시, 두 번째로’는 원문의 중첩된 반복 표지를 보존하면서도 기존의 ‘두 번째로 말이다’보다 자연스럽습니다.
  terminology: ‘야훼’, ‘여호수아’, ‘할례’, ‘이스라엘 자손’은 일관되고 적절합니다. חַרְבוֹת צֻרִים의 복수와 절단 도구의 의미를 ‘부싯돌 칼들’로 유지합니다. 각주 b는 히브리어 표현이 문자적으로 ‘이스라엘의 아들들’임과 할례 문맥에서 남성 구성원을 가리킨다는 점을 밝혀야 영어 POB의 근거를 충분히 반영합니다.
