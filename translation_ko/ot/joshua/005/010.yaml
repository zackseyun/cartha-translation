base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 길갈에 진을 치고, 그 달 십사일 저녁에 여리고 평원에서 유월절을 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역성은 유지하되, 한국어에서는 ‘자손’이 혈연적·집합적 표현을 자연스럽게 살리면서도 남성 복수의 형식을 무리 없이 반영합니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 주둔하고
  - 캠프를 치고
  lexicon: HALOT
  rationale: 전투/광야 맥락에서 חנה는 ‘진을 치다’가 가장 정확하고 관용적입니다.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  english_pob_choice: they kept the Passover
  chosen_korean: 유월절을 지켰습니다
  alternatives_korean:
  - 유월절을 행했습니다
  - 유월절을 지켰습니다
  lexicon: HALOT
  rationale: עשה + פסח는 절기 준수의 관용구이므로, 한국어 성경어법에 맞으면서도 ‘행하다’보다 의미가 분명한 ‘지키다’를 선택했습니다.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  english_pob_choice: on the plains of Jericho
  chosen_korean: 여리고 평원
  alternatives_korean:
  - 여리고의 들판
  - 여리고의 평야
  lexicon: HALOT
  rationale: עַרְבוֹת은 지형상 ‘평원/들’의 의미를 가지며, ‘여리고 평원’이 간결하면서도 지역성을 잘 드러냅니다.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל의 성별-정확성 보존
  chosen_reading: ‘이스라엘 자손’으로 옮겨 히브리어의 직접적 가족관계 표현을 살렸습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 도그마 쟁점은 아니지만, 원문이 가진 남성 복수의 형식과 혈연적 표현을 흐리지 않기 위해 좀 더 직역적인 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
