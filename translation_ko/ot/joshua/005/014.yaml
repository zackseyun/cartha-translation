source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
  footnotes:
  - marker: a
    text: Or “Neither; I have now come as the commander of the LORD’s host.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered “worshiped”; here it is translated “bowed down” to preserve the act without resolving the figure’s identity from this verse alone.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다[a]. “아닙니다. 나는 이제 야훼의 군대 사령관으로 왔습니다.” 그러자 여호수아가 얼굴을 땅에 대고 엎드려 절하고[b], 그에게 말했습니다. “내 주께서는 이 종에게 무엇을 말씀하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아니요, 나는 이제 야훼의 군대 사령관으로 왔습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 “경배했다”로도 옮길 수 있지만, 여기서는 이 절만으로 그 존재의 정체를 단정하지 않기 위해 “절하고”로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כִּי
  english_pob_choice: No; rather
  chosen_korean: 아니라
  alternatives_korean:
  - 아닙니다, 오히려
  - 아니요, 차라리
  lexicon: HALOT
  rationale: 부정에 이어지는 교정·대조를 간결하게 살려, 단순 부정보다 '아니라'가 문맥상 더 자연스럽고 원문 힘을 잘 전달합니다.
- source_word: שַׂר צְבָא יְהוָה
  english_pob_choice: the commander of the army of Yahweh
  chosen_korean: 야훼의 군대 사령관
  alternatives_korean:
  - 야훼의 군대 장관
  - 야훼의 군대 대장
  lexicon: HALOT
  rationale: 군사적 호칭을 현대 한국어로 분명하게 옮기되, '사령관'으로 지위와 기능을 자연스럽게 드러냈습니다.
- source_word: פָּנָיו אַרְצָה
  english_pob_choice: fell with his face to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅으로 향해 엎드려
  - 얼굴이 땅에 닿도록 엎드려
  lexicon: HALOT
  rationale: 얼굴을 땅으로 향한 완전한 엎드림이라는 جسم적 동작을 자연스러운 한국어로 살렸습니다.
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: bowed down
  chosen_korean: 절하며
  alternatives_korean:
  - 엎드려 경배하며
  - 굽혀 절하며
  lexicon: HALOT
  rationale: 본문의 행위를 명시하되, 이 동작이 곧바로 신학적으로 '경배'인지 단정하지 않도록 '절하며'로 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 나의 주인
  - 주님
  lexicon: HALOT
  rationale: 직접 호칭의 존대와 소유격을 함께 살리면서, 본문이 아직 이 존재를 '주님'으로 동일시하지 않도록 했습니다.
theological_decisions:
- issue: 여호수아의 행위를 '경배'로 단정할지 여부
  chosen_reading: 본문에서는 '엎드려 절하며'로 두어 행위는 드러내되 경배 여부는 확정하지 않았습니다.
  alternative_readings:
  - '''경배하며''로 옮김'
  - '''몸을 굽혀 절하며''로 옮김'
  rationale: 히브리어 동사는 경배적 뉘앙스도 가질 수 있지만, 이 절만으로 그 신학적 성격을 확정할 필요는 없습니다. POB의 보존 원칙에 따라 해석을 열어 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
