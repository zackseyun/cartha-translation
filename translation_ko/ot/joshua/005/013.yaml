source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
  footnotes:
  - marker: a
    text: Or, 'in Jericho' or 'near Jericho.' The Hebrew preposition can be understood more broadly than a precise point inside the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 여리고 곁에[a] 있을 때에 이런 일이 있었습니다. 그가 눈을 들어 바라보니, 한 사람이 그 앞에 서 있었는데, 손에 칼을 뽑아 들고 있었습니다. 여호수아가 그에게 나아가 말했습니다. “당신은 우리 편입니까, 아니면 우리 적들의 편입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 ‘여리고에’, ‘여리고 안에’, 또는 ‘여리고 근처에’처럼 넓게 이해될 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי / בִּהְיוֹת
  english_pob_choice: And it happened, when ... was
  chosen_korean: 그 일은 이렇게 되었습니다. ... 있을 때에
  alternatives_korean:
  - 그렇게 되었습니다. ... 있을 때에
  - '...할 때에'
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol과 시간 부사구를 함께 살려 새 장면의 도입과 시간 배경을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בִּירִיחוֹ
  english_pob_choice: by Jericho
  chosen_korean: 여리고 곁에
  alternatives_korean:
  - 여리고에
  - 여리고 안에
  - 여리고 근처에
  lexicon: HALOT
  rationale: ב의 넓은 위치 용법을 반영해 너무 단정적인 ‘안에’보다 문맥에 맞는 ‘곁에’로 옮겼습니다.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה
  english_pob_choice: he lifted up his eyes and looked, and behold
  chosen_korean: 눈을 들어 보니 보십시오
  alternatives_korean:
  - 눈을 들어 바라보니
  - 눈을 들어 보니, 그리고 보니
  lexicon: HALOT
  rationale: 관용구 ‘눈을 들어’와 주의를 끄는 감탄사 ‘보십시오’로 장면의 생생함을 살렸습니다.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  english_pob_choice: with his sword drawn in his hand
  chosen_korean: 그의 손에는 칼이 뽑혀 있었습니다
  alternatives_korean:
  - 그의 손에는 칼이 빼어져 있었습니다
  - 손에 칼을 뽑아 들고 있었습니다
  lexicon: HALOT
  rationale: שׁלופה를 ‘뽑혀 있다’로 자연스럽게 옮겨 위협적인 자세를 분명히 했습니다.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  english_pob_choice: Are you for us, or for our enemies?
  chosen_korean: 당신은 우리 편입니까, 아니면 우리 적들의 편입니까?
  alternatives_korean:
  - 당신은 우리를 위한 사람입니까, 아니면 우리 원수들을 위한 사람입니까?
  - 당신은 우리 편이십니까, 아니면 우리 적편입니까?
  lexicon: HALOT
  rationale: ל + 인칭대명사의 편가름/충성 의미를 살려 ‘~편’으로 옮기고, צָרִים는 현대 독자가 즉시 이해할 수 있도록 ‘적들’로 처리했습니다.
theological_decisions:
- issue: 정체가 밝혀지지 않은 ‘한 사람’의 신원
  chosen_reading: 본문이 말하는 그대로 ‘한 사람’으로 두고 천사, 야훼의 사자, 신현/그리스도현의 해석을 본문 안에서 확정하지 않았습니다.
  alternative_readings:
  - 천사
  - 야훼의 사자
  - 신현적 또는 그리스도현적 현현
  rationale: 이 절 자체는 인물을 단지 ‘한 사람’으로 소개하므로, 후문맥의 해석 가능성을 본문 번역이 미리 결정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
