  edition: WLC
  text: וַ/יֹּ֨אכְל֜וּ מֵ/עֲב֥וּר הָ/אָ֛רֶץ מִ/מָּֽחֳרַ֥ת הַ/פֶּ֖סַח מַצּ֣וֹת וְ/קָל֑וּי בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
  footnotes:
  - marker: a
    text: Or 'from the old produce of the land.' The Hebrew term can denote the land's produce or yield; some understand the context to imply stored produce from the previous harvest.
    reason: lexical_alternative
  - marker: b
    text: Or 'parched grain.' The Hebrew refers to grain prepared by roasting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 유월절 다음 날에 그 땅의 소산을 먹었습니다. 곧 무교병과 볶은 곡식이었습니다. 바로 이 날에 그리했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 땅의 옛 소산'. 히브리어는 땅의 산물 또는 수확물을 뜻할 수 있으며, 어떤 해석은 이전 수확분의 저장 식량을 가리킨다고 봅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '볶은 곡물'. 히브리어는 볶아 익힌 곡물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  english_pob_choice: And they ate
  chosen_korean: 그들은 ... 먹었습니다
  alternatives_korean:
  - 그리고 그들은 먹었습니다
  - 그들은 그리고 먹었습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 연결을 자연스러운 한국어 서술로 옮기되, 사건의 진행을 분명히 하기 위해 평서형 과거를 사용했습니다.
- source_word: מֵעֲבוּר הָאָרֶץ
  english_pob_choice: from the produce of the land
  chosen_korean: 그 땅의 소산
  alternatives_korean:
  - 그 땅의 산물
  - 그 땅의 수확물
  - 그 땅의 옛 소산
  lexicon: HALOT
  rationale: עֲבוּר는 땅이 내는 산물/소산을 가리키므로, 문맥상 자연스럽고 원문에 가까운 '소산'을 택했습니다. '옛'은 본문에 직접 없으므로 넣지 않았습니다.
- source_word: מִמָּחֳרַת הַפֶּסַח
  english_pob_choice: on the day after the Passover
  chosen_korean: 유월절 다음 날에
  alternatives_korean:
  - 유월절 다음 날
  - 유월절 다음 날에
  lexicon: HALOT
  rationale: מָחֳרַת의 시간 부사적 용법을 한국어의 '다음 날에'로 옮겨 자연스럽게 처리했습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교빵
  lexicon: HALOT
  rationale: 유월절 문맥의 전문 용어를 살려 '무교병'으로 옮겼습니다. 교회적 전통어이지만 본문 맥락에 정확합니다.
- source_word: וְקָלוּי
  english_pob_choice: and roasted grain
  chosen_korean: 볶은 곡식
  alternatives_korean:
  - 볶은 보리
  - 볶은 곡물
  - 볶은 곡식
  lexicon: HALOT
  rationale: קָלוּי는 볶거나 그슬린 곡물을 뜻하므로, 현대 한국어에서 뜻이 분명한 '볶은 곡식'을 택했습니다.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: on this very day
  chosen_korean: 바로 이 날에
  alternatives_korean:
  - 이 바로 그 날에
  - 이날 바로
  - 그날 바로
  lexicon: HALOT
  rationale: 강조 표현을 살리면서도 한국어 어순에 맞게 압축했습니다. '바로'가 원문의 정밀성과 즉시성을 드러냅니다.
theological_decisions:
- issue: 유월절과 가나안 땅 소산의 동시성 강조
  chosen_reading: 본문의 마지막 강조구를 '바로 이 날에'로 옮겨, 이 사건이 정해진 시점에 정확히 일어났음을 드러냈습니다.
  alternative_readings:
  - '''그날에''로 평이하게 옮기는 방식'
  - '''그 바로 그 날에''로 더 강하게 강조하는 방식'
  rationale: 히브리어의 בְּעֶצֶם הַיּוֹם הַזֶּה는 단순한 날짜 정보가 아니라 사건의 엄정한 시점을 강조하므로, 한국어에서도 그 긴장감을 유지하는 것이 적절합니다.
  doctrine_reference: 출애굽기-여호수아의 언약 성취와 절기 순서
