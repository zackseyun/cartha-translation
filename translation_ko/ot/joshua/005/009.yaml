reference: Joshua 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
  footnotes:
  - marker: a
    text: Or 'the disgrace of Egypt' or 'Egypt's reproach.' The phrase may refer to the shame of Israel's past in Egypt, reproach from Egypt, or covenant disgrace now removed.
    reason: lexical_alternative
  - marker: b
    text: '''Gilgal'' sounds like the Hebrew verb for ''roll away,'' creating a wordplay with ''Today I have rolled away.'''
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. “오늘 내가 이집트의 수치를 너희에게서 굴려 버렸습니다.” 그러므로 그곳의 이름을 오늘까지 길갈이라 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길갈’은 히브리어 동사 ‘굴리다/굴려 버리다’와 음이 겹쳐, “오늘 내가 굴려 버렸습니다”와 말장난을 이룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본어휘
  rationale: POB의 기본 원칙에 따라 신명은 학술적 음역인 ‘야훼’로 옮겨, 본문의 고유한 신명 표지를 유지했습니다.
- source_word: גַּלּוֹתִי
  english_pob_choice: I have rolled away
  chosen_korean: 굴려 버렸습니다
  alternatives_korean:
  - 없애 버렸습니다
  - 치워 버렸습니다
  lexicon: HALOT
  rationale: גלל의 ‘굴리다/굴려 옮기다’라는 동사를 살려 길갈과의 말장난을 한국어에서도 최대한 드러냈습니다.
- source_word: חֶרְפַּת מִצְרַיִם
  english_pob_choice: the reproach of Egypt
  chosen_korean: 이집트의 수치
  alternatives_korean:
  - 이집트의 치욕
  - 이집트의 모욕
  lexicon: HALOT
  rationale: חֶרְפָּה의 핵심 의미인 수치·치욕·모욕 가운데, 본문이 지닌 사회적/언약적 수치를 자연스럽게 드러내는 ‘수치’를 택했습니다.
- source_word: מֵעֲלֵיכֶם
  english_pob_choice: from upon you
  chosen_korean: 너희에게서
  alternatives_korean:
  - 너희 위에서
  - 너희 위로부터
  lexicon: HALOT
  rationale: 직역의 ‘위에서’는 한국어에서 다소 무거워질 수 있어, 제거되는 대상의 출발점을 살리면서도 자연스러운 ‘너희에게서’를 사용했습니다.
theological_decisions:
- issue: ‘이집트의 수치’의 범위
  chosen_reading: 본문이 명시하지 않는 구체적 설명은 넣지 않고, 넓은 표현 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘의 이집트 노예 상태의 수치
  - 이집트가 이스라엘에게 던진 조롱
  - 언약 정체성과 관련된 할례 부재의 수치
  rationale: 히브리어 표현 자체가 무엇을 가리키는지 단정하지 않으므로, 주해적 가능성을 하나로 고정하지 않고 본문의 해석 여지를 보존했습니다.
  doctrine_reference: 해석적 긴장 보존
