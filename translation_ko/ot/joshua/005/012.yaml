  edition: WLC
  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
  footnotes:
  - marker: a
    text: Or 'from the old produce of the land.' The Hebrew term may refer more specifically to stored produce from the previous year's crop.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Israel'' is the more literal rendering of the Hebrew; many English versions have ''people of Israel'' or ''Israelites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그 땅의 산물을 먹은 다음 날에 만나가 그쳤습니다. 더 이상 이스라엘 자손에게 만나는 없었고, 그해에 그들은 가나안 땅의 소산을 먹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘그 땅의 산물’로 읽을 수도 있고, 이전 해의 저장 곡식으로 더 구체화할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 더 직역적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  english_pob_choice: ceased
  chosen_korean: 그쳤습니다
  alternatives_korean:
  - 멈췄습니다
  - 끝났습니다
  lexicon: HALOT
  rationale: 여기서는 안식일 준수가 아니라 공급의 종료를 뜻하므로, 자연스러운 서술로 ‘그쳤습니다’를 택해 중단의 의미를 살렸습니다.
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 다음 날에
  alternatives_korean:
  - 그 다음 날에
  - 이튿날에
  lexicon: HALOT
  rationale: 직전의 식사 다음에 이어지는 시간 순서를 간결하게 보여 주는 현대적 표현으로 옮겼습니다.
- source_word: מֵעֲבוּר הָאָרֶץ
  english_pob_choice: from the produce of the land
  chosen_korean: 그 땅의 산물
  alternatives_korean:
  - 그 땅의 소산
  - 그 땅의 곡식
  lexicon: HALOT
  rationale: עֲבוּר는 토지의 산출물을 가리키므로, 본문 흐름에 맞는 넓은 의미의 ‘산물’을 사용했습니다. ‘old produce’ 뉘앙스는 여기서 본문 자체가 요구하지 않으므로 본문에는 넣지 않았습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 투명하게 반영하되, 한국어 성서 용례상 이해가 쉬운 ‘이스라엘 자손’을 유지했습니다.
- source_word: מִתְּבוּאַת אֶרֶץ כְּנַעַן
  english_pob_choice: from the yield of the land of Canaan
  chosen_korean: 가나안 땅의 소산
  alternatives_korean:
  - 가나안 땅의 수확
  - 가나안 땅의 열매
  lexicon: HALOT
  rationale: תְּבוּאָה는 수확물/소산을 뜻하므로, 앞의 ‘산물’과 어감을 달리하면서도 농경적 의미를 살리는 ‘소산’을 택했습니다.
theological_decisions:
- issue: 만나의 종료 시점과 언약적 전환
  chosen_reading: 만나는 그들이 그 땅의 산물을 먹은 다음 날에 그쳤다고 서술해, 광야 공급에서 약속의 땅의 산출로 전환되는 역사적 전환을 드러냈습니다.
  alternative_readings:
  - 단순한 식량 공급의 중단으로만 읽는 해석
  - 절기나 기적의 종료로 확대하는 해석
  rationale: 본문은 원인과 시점을 구체적으로 제시하므로, 신학적 확대보다 서술이 지닌 전환의 의미를 그대로 살리는 것이 타당합니다.
  doctrine_reference: 출애굽-가나안 정착의 서사적 전환
