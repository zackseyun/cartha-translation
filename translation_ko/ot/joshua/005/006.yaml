source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to give to us''; some ancient versions and translations read ''to give to them.'''
    reason: textual_variant
translation:
  language: ko
  text: 이는 이스라엘 자손이 광야에서 사십 년 동안 걸었기 때문입니다[a]. 곧 전쟁에 나갈 만한 남자들로서 이집트에서 나온 그 모든 나라가 끝날 때까지였습니다. 이는 그들이 야훼의 말씀을 듣지 않았기 때문입니다. 야훼께서는 그들에게, 야훼께서 그들의 조상들에게 우리에게 주려고 맹세하신 땅을 그들이 보지 못하게 하시겠다고 맹세하셨습니다. 그 땅은 젖과 꿀이 흐르는 땅입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리에게 주려고’로 되어 있습니다. 일부 고대 역본과 번역본은 ‘그들에게 주려고’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 친족·집단 표현을 표준적인 성경 한국어인 ‘이스라엘 자손’으로 옮겨, 혈통적·언약적 집단성을 함께 보존했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 성경적 지리·신학 용어로는 ‘광야’가 가장 정확하며, 단순한 자연지형보다 출애굽-시험-인도하심의 배경을 드러냅니다.
- source_word: הָלְכוּ ... אַרְבָּעִים שָׁנָה
  english_pob_choice: had walked ... forty years
  chosen_korean: 사십 년 동안 걸었습니다
  alternatives_korean:
  - 사십 년 동안 다녔습니다
  - 사십 년 동안 여행했습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘걷다/다니다’이므로, 장기간의 광야 여정을 드러내는 ‘걸었습니다’를 유지했습니다.
- source_word: בְּקוֹל יְהוָה
  english_pob_choice: the voice of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 음성
  - 야훼의 목소리
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘야훼의 음성’이지만, 한국어에서 ‘말씀을 듣다’가 명령-순종의 관용구를 자연스럽게 드러내므로 그 의미를 살렸습니다.
- source_word: לָנוּ
  english_pob_choice: to us
  chosen_korean: 우리에게
  alternatives_korean:
  - 그들에게
  - 당신들에게
  lexicon: HALOT
  rationale: 본문의 1인칭 복수 독법을 그대로 살려 ‘우리에게’로 옮겼고, 이는 원문이 보존하는 화자 동일시를 반영합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 언약명 יהוה를 한국어 본문에서도 가리고 일반 칭호로 바꾸지 않기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘듣지 않았다’의 의미
  chosen_reading: 야훼의 말씀을 듣지 않았습니다
  alternative_readings:
  - 야훼께 순종하지 않았습니다
  - 야훼의 음성을 듣지 않았습니다
  rationale: 히브리어 관용구는 청각 행위와 순종 불이행을 함께 뜻하므로, 직역적 표현을 유지해 의미층위를 지우지 않았습니다.
  doctrine_reference: 히브리어 관용구 בְּקוֹל + שמע의 순종적 의미
