  source_fidelity: 본문의 ‘쫓아내셨습니다’와 ‘크고 강한 민족들’은 וַיּוֹרֶשׁ 및 גּוֹיִם גְּדֹלִים וַעֲצוּמִים을 충실히 옮깁니다. 다만 b 각주는 히브리어의 직역이라고 하면서 이미 해석을 더한 ‘맞서’를 포함하고 있어 바로잡아야 합니다. 전면에 나온 וְאַתֶּם의 화제 전환·강조는 ‘여러분의 경우에는’으로 반영했습니다.
  naturalness: ‘여러분에 관해서는’은 현대 한국어에서 다소 번역투이므로 ‘여러분의 경우에는’이 더 자연스럽습니다. ‘맞서 설 수 있었던 사람은 한 사람도 없었습니다’는 전쟁 문맥의 עמד לפני 관용적 의미를 자연스럽게 드러냅니다.
  terminology: ‘야훼’, ‘민족들’, ‘오늘까지’는 프로젝트의 명칭 정책 및 본문 문맥에 적절합니다. a 각주의 ‘몰수하여 차지하게 하셨습니다’는 한국어 어법상 부자연스럽고, 몰수라는 법률적 의미를 불필요하게 부가하므로 ‘그들을 쫓아내어 이스라엘이 차지하게 하셨습니다’로 고칩니다.
