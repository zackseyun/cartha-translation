id: JOS.23.9
reference: Joshua 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
  footnotes:
  - marker: a
    text: Or 'has dispossessed' or 'has driven away.' The Hebrew verb can emphasize removing peoples from the land so that Israel may possess it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'not a man has stood before you,' an idiom meaning that no one has been able to withstand you.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 여러분 앞에서 크고 강한 민족들을 쫓아내셨습니다[a]. 여러분의 경우에는, 오늘까지 여러분 앞에 맞서 설 수 있었던 사람은 한 사람도 없었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내쫓으셨습니다’, ‘그들을 쫓아내어 이스라엘이 차지하게 하셨습니다’라고 할 수 있습니다. 히브리어 동사는 백성을 그 땅에서 제거하여 이스라엘이 차지하게 하는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 직역은 ‘여러분 앞에 선 사람이 한 사람도 없었습니다’입니다. 이는 아무도 여러분에게 대항하여 버티지 못했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  english_pob_choice: has driven out
  chosen_korean: 쫓아내셨습니다
  alternatives_korean:
  - 몰아내셨습니다
  - 내쫓으셨습니다
  - 추방하셨습니다
  lexicon: HALOT
  rationale: 정복 문맥의 הִפְעִיל ירשׁ는 기존 거주자를 밀어내어 차지하게 하는 의미이므로, 현대 한국어에서 자연스럽고 힘이 살아 있는 ‘쫓아내셨습니다’로 옮겼습니다.
- source_word: מִפְּנֵיכֶם
  english_pob_choice: from before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분의 앞에서
  - 여러분 앞에서부터
  - 여러분의 면전에서
  lexicon: HALOT
  rationale: ‘from before you’의 전방/면전 idiom을 살리되 한국어로는 ‘여러분 앞에서’가 가장 자연스럽고 직관적입니다.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  english_pob_choice: great and mighty nations
  chosen_korean: 크고 강한 민족들
  alternatives_korean:
  - 크고 힘센 민족들
  - 위대하고 강대한 민족들
  - 크고 막강한 민족들
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 ‘민족들’이 적절하고, גָּדוֹל/עָצוּם의 조합은 규모와 힘을 함께 가리키므로 ‘크고 강한’이 과장 없이 의미를 전달합니다.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  english_pob_choice: not a man has stood before you
  chosen_korean: 여러분 앞에 맞서 선 사람이 하나도 없었습니다
  alternatives_korean:
  - 여러분 앞에 선 사람이 하나도 없었습니다
  - 여러분을 견딘 사람이 하나도 없었습니다
  - 여러분을 대적해 선 사람이 하나도 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 문자상 표현은 ‘한 사람이 서지 않았다’이지만, 전투 관용구로는 ‘맞서 서다/견디다’의 뜻이므로 한국어에는 결과 의미를 드러내는 표현을 택했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  - 오늘날까지
  lexicon: HALOT
  rationale: 서술 현재까지의 지속을 나타내는 관용구로, 한국어 성경 문체에서 자연스러운 ‘오늘까지’가 적합합니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יַהְוֶה를 ‘야훼’로 음역하여 고유명사를 보존했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문은 여호와 대체어가 아니라 신적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘서다’ 관용구의 해석
  chosen_reading: ‘앞에 맞서 선 사람’은 단순 위치가 아니라 대항·저항의 불가능함을 뜻하는 관용구로 처리했습니다.
  alternative_readings:
  - 직역하여 ‘여러분 앞에 선 사람’
  - ‘여러분을 당해낸 사람’
  - ‘여러분을 견딘 사람’
  rationale: 히브리어 עמד לפני는 전투 문맥에서 ‘대항하여 버티다/견디다’의 뜻이므로, 독자가 승리의 완전성을 이해하도록 관용적 의미를 본문에 반영했습니다.
  doctrine_reference: HALOT idiom note on עמד לפני
