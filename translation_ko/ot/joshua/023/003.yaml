  source_fidelity: 야훼와 ‘여러분의 하나님’은 정확히 옮겼고, ‘싸우신 분’도 정관사 분사의 강조를 잘 반영합니다. 그러나 מִפְּנֵיכֶם는 직역하면 ‘여러분 앞에서부터/여러분 앞에서’이며, 이 문맥에서는 민족들이 이스라엘 앞에서 물러나거나 제거되는 의미를 띱니다. 현행 각주는 이를 ‘여러분의 면전에서 제거되다’라고 하여 제거의 출발점과 의미가 부정확합니다.
  naturalness: ‘여러분 앞에서 이 모든 민족에게 하신 일도 다’는 수식 관계가 다소 불분명하고 ‘도’는 원문에 없는 대조·첨가의 뉘앙스를 더합니다. ‘이 모든 민족에게 여러분 앞에서 행하신 모든 일’로 정리하면 현대 표준 한국어로 자연스럽고 원문의 범위도 분명해집니다.
  terminology: ‘야훼’, ‘하나님’, ‘여러분을 위해’는 일관되고 적절합니다. ‘하신 일’보다 ‘행하신 모든 일’이 עָשָׂה와 כָּל אֲשֶׁר의 포괄성을 더 명료하게 드러냅니다.
