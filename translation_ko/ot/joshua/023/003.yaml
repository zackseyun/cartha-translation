  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
  footnotes:
  - marker: a
    text: Hebrew 'from before you,' an idiom for the nations being driven out from Israel's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분은 야훼 여러분의 하나님께서 이 모든 민족에게 여러분 앞에서 행하신 모든 일을 보았습니다.[a] 야훼 여러분의 하나님께서 바로 여러분을 위해 싸우신 분이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘여러분 앞에서부터’입니다. 이 문맥에서는 이 민족들이 이스라엘 앞에서 물러나거나 제거된 것을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
