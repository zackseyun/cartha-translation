  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
  footnotes:
  - marker: a
    text: Hebrew 'from before you,' an idiom for the nations being driven out from Israel's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분은 야훼 여러분의 하나님께서 여러분 앞에서 이 모든 민족에게 하신 일도 다 보았습니다. 이는 야훼 여러분의 하나님이 여러분을 위해 싸우신 분이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘여러분 앞에서’는 관용적으로 ‘여러분의 면전에서 제거되다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: And you yourselves
  chosen_korean: 그리고 여러분은
  alternatives_korean:
  - 그리고 여러분 자신은
  - 또 여러분은
  lexicon: HALOT
  rationale: 독립 대명사의 강조는 한국어에서 주어를 분명히 드러내는 방식으로 충분히 살릴 수 있어, 문맥 연속성을 유지하는 ‘그리고’와 함께 ‘여러분은’을 택했습니다.
- source_word: רְאִיתֶם
  english_pob_choice: have seen
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보셨습니다
  - 보아 왔습니다
  lexicon: HALOT
  rationale: 과거의 경험이 현재의 증언 근거가 되는 뉘앙스를 한국어의 완료형으로 자연스럽게 나타냈습니다.
- source_word: מִפְּנֵיכֶם
  english_pob_choice: before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분 앞에서부터
  - 여러분 면전에서
  lexicon: HALOT
  rationale: 직역인 ‘여러분 앞에서부터’도 가능하지만, 추방/몰아냄의 문맥을 한국어에서 자연스럽게 드러내는 표현으로 ‘여러분 앞에서’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사 יְהוָה는 호칭 대체 없이 ‘야훼’로 옮겼습니다.
- source_word: הַנִּלְחָם
  english_pob_choice: is the one who has fought
  chosen_korean: 싸우신 분이시기 때문입니다
  alternatives_korean:
  - 싸우시는 분이시기 때문입니다
  - 싸워 주신 분이시기 때문입니다
  lexicon: HALOT
  rationale: 분사적 강조를 한국어에서는 ‘분’ 구문으로 살리고, 과거의 구원 행위를 반영해 완료 성격의 ‘싸우신’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 언약적 고유명사를 직접 사용하므로, 제목형 호칭으로 바꾸지 않고 ‘야훼’로 보존했습니다.
