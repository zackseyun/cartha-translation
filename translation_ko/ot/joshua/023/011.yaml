source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: So be very careful for your own selves to love Yahweh your God[a].
  footnotes:
  - marker: a
    text: Or 'for yourselves,' 'for your lives,' or more traditionally 'for your souls.' The Hebrew noun can refer to the self, life, or soul depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 매우 조심하여, 너희 자신의 존재를 위해 야훼 너희 하나님을 사랑해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 자신을 위해’, ‘너희 생명을 위해’, 더 전통적으로는 ‘너희 영혼을 위해’로도 옮길 수 있습니다. 히브리어 명사 נֶפֶשׁ는 문맥에 따라 자기 자신, 생명, 영혼을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  english_pob_choice: be careful
  chosen_korean: 매우 조심하여
  alternatives_korean:
  - 스스로를 지키며
  - 주의하며
  - 삼가며
  lexicon: HALOT
  rationale: 반사적 뉘앙스가 있는 שׁמר의 명령형을 현대 한국어의 자연스러운 권면인 ‘조심하다’로 옮기되, מְאֹד의 강세를 함께 살렸습니다.
- source_word: מְאֹד
  english_pob_choice: very
  chosen_korean: 매우
  alternatives_korean:
  - 크게
  - 몹시
  lexicon: HALOT
  rationale: 명령을 강하게 강조하는 부사이므로 ‘매우’가 가장 सीधे하고 현대적인 대응입니다.
- source_word: לְנַפְשֹׁתֵיכֶם
  english_pob_choice: for your own selves
  chosen_korean: 너희 자신의 존재를 위해
  alternatives_korean:
  - 너희 자신을 위해
  - 너희 목숨을 위해
  - 너희 영혼을 위해
  lexicon: HALOT
  rationale: נֶפֶשׁ가 여기서는 ‘영혼’보다 자기를 가리키는 전체적 존재/자기 자신을 뜻하므로, 한국어에서도 ‘존재’로 풀어 반사적 의미를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이름-대체가 아니라 신적 고유명사를 보존하는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם의 인류학적 함의
  chosen_reading: ‘너희 자신의 존재’로 옮겨, 영혼/육체의 분리를 암시하지 않도록 했습니다.
  alternative_readings:
  - 너희 영혼을 위해
  - 너희 생명을 위해
  - 너희 자신을 위해
  rationale: 문맥상 이 구문은 여호와께 대한 사랑에 충실하도록 스스로를 경계하라는 의미이지, 특정한 영혼론을 가르치려는 표현이 아닙니다. 따라서 독자가 과도한 신학적 전제를 읽어 넣지 않도록 절제해 번역했습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 말하는 만큼만 신학적으로 읽기
