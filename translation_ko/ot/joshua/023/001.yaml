revisions:
- from: 이 일이 오래 지난 뒤, 야훼께서 그들 주위의 모든 원수에게서 이스라엘에게 안식을 주신 후에, 여호수아는 나이가 많아져서 연로해졌습니다.[a][b]
  to: 야훼께서 이스라엘이 사방의 모든 원수에게서 안식을 누리게 하신 뒤 오랜 세월이 지났을 때[a], 여호수아는 늙어 나이가 많았습니다.[b]
  rationale: 개정문은 ‘야훼께서 안식을 주신 후 오랜 시간이 지남’이라는 이중 시간 관계를 자연스러운 한국어 어순으로 보존했습니다. ‘이스라엘이 … 안식을 누리게 하신’은 히브리어 사역형 הֵנִיחַ와 ‘원수들에게서’라는 구문을 분명히 드러냅니다. 마지막 절은 ‘늙었고 나이가 많았다’라는 두 히브리어 표현을 한국어에서 불필요한 동어반복이나 진행 의미 없이 반영했습니다.
  reviewer_model: gpt-5.6-terra
