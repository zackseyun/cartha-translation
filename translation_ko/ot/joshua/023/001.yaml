base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
  footnotes:
  - marker: a
    text: Or 'after a long time.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''advanced in years'' literally, ''come into days.'''
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이스라엘이 사방의 모든 원수에게서 안식을 누리게 하신 뒤 오랜 세월이 지났을 때[a], 여호수아는 늙어 나이가 많았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오랜 시간이 지난 뒤’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘날들 속으로 들어왔다’는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 이 일이 오래 지난 뒤
  alternatives_korean:
  - 그리고 이런 일이 있었습니다
  - 오래 후에 이런 일이 있었습니다
  lexicon: WLC; discourse function
  rationale: 새 사건을 여는 서술 표지로 이해하여, 한국어에서도 자연스럽게 장면 전환을 보여 주면서 원문의 시간 표지를 살렸습니다.
- source_word: מִיָּמִים רַבִּים
  english_pob_choice: after many days
  chosen_korean: 오래 지난 뒤
  alternatives_korean:
  - 많은 날 후에
  - 오랜 시간이 지난 뒤
  lexicon: HALOT
  rationale: ‘많은 날들로부터’라는 관용을 현대 한국어로 자연화하되, 상당한 시간 경과라는 핵심을 유지했습니다.
- source_word: הֵנִיחַ יְהוָה לְיִשְׂרָאֵל
  english_pob_choice: Yahweh had given Israel rest
  chosen_korean: 야훼께서 … 이스라엘에게 안식을 주신
  alternatives_korean:
  - 야훼께서 … 이스라엘을 쉬게 하신
  - 야훼께서 … 이스라엘에게 평안을 주신
  lexicon: HALOT; doctrine of divine name
  rationale: הֵנִיחַ는 전쟁의 압박에서의 ‘안식/쉼’을 뜻하므로 ‘안식을 주신’이 가장 직접적입니다. יְהוָה는 프로젝트 원칙에 따라 야훼로 옮겼습니다.
- source_word: בָּא בַּיָּמִים
  english_pob_choice: advanced in years
  chosen_korean: 나이가 많아져서 연로해졌습니다
  alternatives_korean:
  - 연로해졌습니다
  - 나이가 들어 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘날들 속으로 들어오다’를 한국어의 자연스러운 노화 표현으로 옮기되, 단순한 ‘늙었다’보다 완곡하고 서술적인 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 처리할 것인가
  chosen_reading: 본문에 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 신명기적/역사서 문맥에서 언약 이름 יְהוָה를 직접 사용하므로, 대체 칭호보다 고유명을 드러내는 번역이 स्रोत의 의미를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
