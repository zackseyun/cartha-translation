  verdict: revise
  source_fidelity: 수정이 필요합니다. וִידַעְתֶּם은 이 문맥에서 청자들이 이미 경험으로 알고 있는 사실을 확인하는 표현이므로 ‘알게 될 것입니다’라는 미래형보다 ‘알고 있습니다’가 원문에 더 충실합니다. 또한 עֲלֵיכֶם은 ‘여러분에게’도 가능하지만 여기서는 하나님께서 그들을 위하여/그들에 관하여 하신 말씀이라는 뜻을 보존하도록 ‘여러분에 관하여’로 옮겼습니다. נפל의 반복 이미지는 ‘떨어지지 않았다’로 유지했습니다.
  naturalness: ‘온 땅의 길’은 한국어에서 관용적으로 잘 이해되지 않으며, 각주가 문장 끝에 달려 있어 설명 대상이 불분명합니다. ‘모든 사람이 가는 길’로 자연스럽게 옮기고 해당 표현 바로 뒤에 각주를 배치했습니다. ‘그것들은’ 대신 선행사인 ‘말씀들’을 밝혀 문맥을 매끄럽게 했습니다.
  terminology: 야훼, 하나님, 말씀, 마음, 영혼은 적절합니다. 다만 ‘한마디’는 일상 구어적 뉘앙스가 있어 하나님이 말씀하신 ‘דבר’의 반복에는 ‘한 말씀’이 더 격식 있고 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘알게 될 것입니다’가 원문의 완료형이 문맥상 나타내는 현재의 확신을 미래의 인식으로 바꿉니다.
    rationale: 여호수아는 이스라엘이 이미 온 마음과 영혼으로 알고 있는 하나님의 신실성을 증언합니다.
