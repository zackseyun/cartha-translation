  rationale: 원문의 시간적·수사적 확언을 보존하도록 미래형을 현재의 인식으로 바로잡고, 죽음 관용구를 자연스러운 한국어로 옮겼습니다. 반복되는 נפל의 비유는 ‘떨어지지 않았다’로 보존했으며, 각주 앵커를 설명 대상 바로 뒤로 옮겼습니다.
