id: JOS.23.14
reference: Joshua 23:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
  footnotes:
  - marker: a
    text: Or, 'not one thing has failed' / 'not one promise has failed.' The Hebrew says literally, 'not one word has fallen.'
    reason: lexical_alternative
  - marker: b
    text: '''The way of all the earth'' is a Hebrew idiom for the common destiny of all people, especially death.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 오늘 저는 온 땅의 길로 갑니다. 그리고 여러분은 온 마음과 온 영혼으로 알게 될 것입니다. 야훼 여러분의 하나님께서 여러분에게 말씀하신 모든 좋은 말씀 가운데서 한마디도 떨어지지 않았다는 것을 말입니다. 그것들은 모두 여러분에게 이르렀고, 그중 한마디도 떨어지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 땅의 길’은 모든 사람이 공유하는 죽음의 운명을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 문장 첫머리의 주의 환기 표현을 현대 한국어에서 자연스럽고 격식을 유지하는 감탄적 호출로 옮겼습니다.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  english_pob_choice: the way of all the earth
  chosen_korean: 온 땅의 길
  alternatives_korean:
  - 세상의 모든 사람의 길
  - 온 세상의 길
  lexicon: HALOT
  rationale: 죽음을 가리키는 히브리 관용구의 비유성을 살리되, 한국어에서도 이해 가능한 직역형 표현을 유지했습니다.
- source_word: דָּבָר
  english_pob_choice: word
  chosen_korean: 한마디
  alternatives_korean:
  - 말
  - 일
  - 것
  lexicon: HALOT
  rationale: 이 절의 반복된 נפל 관용구와 ‘말씀하신’ 동사와의 연계를 살리기 위해, 추상적인 ‘것’보다 발화 단위를 드러내는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘온 마음과 온 영혼으로 알게 될 것입니다’의 확정성
  chosen_reading: 미래형으로 옮겨, 여호수아의 임종 직전 증언이 공동체의 경험적 확인으로 굳어질 것을 나타냈습니다.
  alternative_readings:
  - ‘알고 있습니다’처럼 현재 인식으로 옮김
  - ‘분명히 알 것입니다’로 더 강하게 강조
  rationale: 히브리어 וִידַעְתֶּם은 형식상 완료이지만 문맥상 공동체가 이미 경험으로 확인하게 될 사실을 가리키므로, 자연스러운 확정 미래로 표현했습니다.
  doctrine_reference: 문맥-시제 판단
- issue: ‘한마디도 떨어지지 않았다’의 반복 유지
  chosen_reading: 첫 번째와 마지막의 ‘떨어지지 않았습니다’를 그대로 살려, 하나님의 말씀의 불이행이 전혀 없음을 강조했습니다.
  alternative_readings:
  - ‘하나도 실패하지 않았습니다’
  - ‘아무것도 빗나가지 않았습니다’
  rationale: 히브리어의 נפל 반복은 단순한 성취 이상으로 ‘떨어짐/실패 없음’의 이미지 자체를 강조하므로, 이를 평준화하지 않고 반복으로 보존했습니다.
  doctrine_reference: 성경 본문 수사 유지
