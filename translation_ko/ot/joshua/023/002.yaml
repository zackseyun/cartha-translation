  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
  footnotes:
  - marker: a
    text: Or 'called' or 'summoned.' The Hebrew verb means to call or summon, here with the sense of calling the leaders together.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its heads,' that is, its leading men or chiefs.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: ''I have come into days,'' meaning ''I have advanced in years.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 이스라엘의 모든 사람을—그 장로들, 우두머리들, 재판관들, 그리고 관리들을—불러다가 그들에게 말했습니다. "나는 이제 늙었고, 나이가 많아졌습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘부르다’ 또는 ‘소집하다’의 뜻도 가집니다. 여기서는 지도자들을 불러 모으는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 머리들’은 곧 우두머리들 또는 지도자들을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구 ‘날들 가운데 들어오다’는 곧 ‘나이가 많아지다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 불러다가
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: לְ가 붙은 קרא는 단순히 부르는 것보다 사람들을 자기 앞으로 불러 모으는 뜻이므로, 자연스럽게 '불러다가'로 옮겼습니다.
- source_word: לְכָל יִשְׂרָאֵל
  english_pob_choice: for all Israel
  chosen_korean: 이스라엘의 모든 사람을
  alternatives_korean:
  - 온 이스라엘을
  - 이스라엘 전체를
  lexicon: HALOT
  rationale: 히브리어는 대표자들을 부르면서도 집합명사로 '온 이스라엘'을 말하므로, 한국어에서는 대표성 없이도 자연스럽게 읽히는 '이스라엘의 모든 사람'으로 옮겼습니다.
- source_word: לִזְקֵנָיו וּלְרָאשָׁיו וּלְשֹׁפְטָיו וּלְשֹׁטְרָיו
  english_pob_choice: its elders, its heads, its judges, and its officers
  chosen_korean: 그 장로들, 우두머리들, 재판관들, 그리고 관리들
  alternatives_korean:
  - 그 장로들, 지도자들, 재판관들, 그리고 관원들
  - 그 장로들, 족장들, 재판관들, 그리고 서기관들
  lexicon: HALOT
  rationale: 네 직분의 구분을 살리되, 'heads'는 문맥상 '우두머리들'로 풀어 대표성 있는 통치층을 드러냈고, 'officers'는 행정 관리의 뜻으로 '관리들'이 가장 자연스럽습니다.
- source_word: בָּאתִי בַּיָּמִים
  english_pob_choice: I have advanced in years
  chosen_korean: 나이가 많아졌습니다
  alternatives_korean:
  - 연세가 많아졌습니다
  - 세월이 많이 흘렀습니다
  lexicon: HALOT
  rationale: '''הבאתי בימים''의 관용구는 노년이 되었음을 뜻하므로, 직역보다 현대 한국어에서 자연스럽고 간명한 ''나이가 많아졌습니다''로 옮겼습니다.'
theological_decisions:
- issue: '''all Israel''과 뒤따르는 직분 목록의 관계'
  chosen_reading: '''이스라엘의 모든 사람을''으로 두되, 뒤의 네 직분은 그 가운데 대표 지도자들을 가리키는 설명으로 유지했습니다.'
  alternative_readings:
  - '''이스라엘의 지도자들을''로만 축약하기'
  - 직분 목록을 하나의 총칭으로 합치기
  rationale: 히브리어는 '온 이스라엘'을 먼저 말하고 이어서 장로·우두머리·재판관·관리들을 나열하므로, 집합적 표현과 대표자 목록을 함께 보존하는 것이 원문 구조를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
