translation:
  language: ko
  text: 그러나 여러분은 오늘까지 해 온 것처럼 여러분의 하나님 야훼께 굳게 붙어 있어야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘붙어 있다’, ‘굳게 매달리다’를 뜻하며, 여기서는 하나님께 대한 지속적이고 충성스러운 결속을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 다만
  - 하지만
  lexicon: HALOT
  rationale: 앞선 경고와 대조되는 강한 전환이므로, 조건문처럼 보이지 않게 한국어의 자연스러운 역접 ‘그러나’로 옮겼습니다.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 여러분의 하나님께
  alternatives_korean:
  - 주님 여러분의 하나님께
  - 여호와 여러분의 하나님께
  - 하나님께
  lexicon: HALOT
  rationale: בְּ + דבק의 결합은 ‘~에/에게 매달리다’의 대상 표지를 요구하므로 조사 ‘께’를 사용했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: תִּדְבָּקוּ
  english_pob_choice: you shall cling
  chosen_korean: 매달려야 합니다
  alternatives_korean:
  - 꼭 붙들어야 합니다
  - 붙어 있어야 합니다
  - 굳게 따라야 합니다
  lexicon: HALOT
  rationale: דבק는 언약적 밀착과 충성을 나타내므로 단순한 ‘붙들다’보다 관계적 밀착을 드러내는 ‘매달리다’를 택했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지 해 온 것처럼
  alternatives_korean:
  - 오늘까지
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 이 표현은 현재 시점까지 지속된 상태를 가리키므로, 단순 시간부사보다 ‘해 온 것처럼’으로 문맥상의 지속성과 비교를 살렸습니다.
theological_decisions:
