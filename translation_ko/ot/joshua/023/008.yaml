  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
  footnotes:
  - marker: a
    text: Hebrew 'hold fast to' or 'cling to'; the verb expresses close, covenantal attachment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 야훼 여러분의 하나님께 매달려야 합니다[a]. 여러분이 오늘까지 해 온 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 דבק는 ‘꽉 붙들다’보다 더 강하게, 언약적 관계 안에서 ‘매달리다, 밀착하다’는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 다만
  - 하지만
  lexicon: HALOT
  rationale: 앞선 경고와 대조되는 강한 전환이므로, 조건문처럼 보이지 않게 한국어의 자연스러운 역접 ‘그러나’로 옮겼습니다.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 여러분의 하나님께
  alternatives_korean:
  - 주님 여러분의 하나님께
  - 여호와 여러분의 하나님께
  - 하나님께
  lexicon: HALOT
  rationale: בְּ + דבק의 결합은 ‘~에/에게 매달리다’의 대상 표지를 요구하므로 조사 ‘께’를 사용했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: תִּדְבָּקוּ
  english_pob_choice: you shall cling
  chosen_korean: 매달려야 합니다
  alternatives_korean:
  - 꼭 붙들어야 합니다
  - 붙어 있어야 합니다
  - 굳게 따라야 합니다
  lexicon: HALOT
  rationale: דבק는 언약적 밀착과 충성을 나타내므로 단순한 ‘붙들다’보다 관계적 밀착을 드러내는 ‘매달리다’를 택했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지 해 온 것처럼
  alternatives_korean:
  - 오늘까지
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 이 표현은 현재 시점까지 지속된 상태를 가리키므로, 단순 시간부사보다 ‘해 온 것처럼’으로 문맥상의 지속성과 비교를 살렸습니다.
theological_decisions:
- issue: 야훼 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 칭호로 대체하지 않고 본 프로젝트 기준의 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
