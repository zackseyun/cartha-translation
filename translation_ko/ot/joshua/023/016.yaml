    rationale: 히브리어는 ‘여러분의 하나님 야훼의 언약’이라고만 하며 ‘맺은’이라는 동사를 명시하지 않습니다. 각주도 본문의 어휘 범위를 넘지 않도록 수정하는 것이 안전합니다.
