id: JOS.23.16
reference: Joshua 23:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
  footnotes:
  - marker: a
    text: Or 'when you transgress the covenant of the LORD your God.' The Hebrew opening may be read temporally ('when') or conditionally ('if').
    reason: alternative_reading
  - marker: b
    text: Hebrew 'from off the good land,' an expression emphasizing removal from the land the LORD gave them.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일[a] 여러분이 여러분의 하나님 야훼께서 여러분에게 명령하신 언약을 어기고, 가서 다른 신들을 섬기며 그들에게 엎드려 절하면, 야훼의 진노가 여러분에게 불붙을 것이며, 여러분은 야훼께서 여러분에게 주신 좋은 땅에서[b] 속히 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 여러분의 하나님 야훼의 언약을 어길 때’. 히브리어 시작 표현은 시간적 의미(‘~할 때’)로도 조건적 의미(‘만일’)로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘좋은 땅 위로부터’라는 표현으로, 야훼께서 주신 땅에서 제거됨을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  english_pob_choice: If you transgress
  chosen_korean: 만일 여러분이 ... 언약을 어기고
  alternatives_korean:
  - 여러분이 ... 언약을 범하고
  - 여러분이 ... 언약을 넘어가고
  lexicon: HALOT
  rationale: ב + עבר는 여기서 언약을 ‘어기다/위반하다’는 관용적 의미로 읽히므로, 조건적 경고를 살리면서도 직역적 ‘넘어가다’를 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 제목이 아니라 고유명으로 드러나므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַעֲבַדְתֶּם / וְהִשְׁתַּחֲוִיתֶם
  english_pob_choice: go and serve ... and bow down to them
  chosen_korean: 가서 다른 신들을 섬기며 그들에게 엎드려 절하면
  alternatives_korean:
  - 가서 다른 신들을 섬기며 그들에게 경배하면
  - 가서 다른 신들을 예배하며 그들에게 절하면
  lexicon: HALOT
  rationale: עבד는 ‘섬기다’, השתחוה는 물리적 ‘엎드려 절하다’가 핵심이므로 두 동작을 구분해 옮겼습니다.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  english_pob_choice: then the anger of Yahweh will burn against you
  chosen_korean: 야훼의 분노가 여러분을 향해 타오를 것이며
  alternatives_korean:
  - 야훼의 진노가 여러분에게 불붙을 것이며
  - 야훼께서 여러분에게 크게 분노하실 것이며
  lexicon: HALOT
  rationale: חרה אף의 불붙는 분노 이미지를 살리기 위해 ‘분노가 ... 타오르다’로 옮겨, 단순한 감정 표명으로 약화시키지 않았습니다.
- source_word: מֵעַל הָאָרֶץ הַטּוֹבָה
  english_pob_choice: from the good land
  chosen_korean: 좋은 땅에서
  alternatives_korean:
  - 그 좋은 땅에서
  - 그 복된 땅에서
  lexicon: HALOT
  rationale: מעל의 ‘~로부터/~에서 떨어져 나감’은 한국어 본문에서 간결하게 ‘~에서’로 처리하되, 출애굽-약속의 땅 맥락인 ‘좋은 땅’을 유지했습니다.
theological_decisions:
- issue: 조건문으로 읽을지 시기로 읽을지
  chosen_reading: ‘만일’로 시작하는 조건적 경고로 번역했습니다.
  alternative_readings:
  - ‘여러분이 ... 어길 때’라는 시간적 해석
  - 직설적 미래 경고로만 처리
  rationale: 히브리어 פתיחה는 조건·시기 모두 가능하지만, 문맥상 여호수아의 경고이므로 책임을 전제하는 조건문이 가장 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source sense over tradition, optimal equivalence'
