id: JOS.23.12
reference: Joshua 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
  footnotes:
  - marker: a
    text: Or 'hold fast to' for 'cling to.'
    reason: lexical_alternative
  - marker: b
    text: Or 'go among them' / 'have dealings with them' for 'associate with them.' The Hebrew idiom is broader than physical movement alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희가 정말로 돌이켜 이 남은 민족들 곧 너희와 함께 남아 있는 이 민족에 매달리고, 그들과 혼인하고, 그들 안으로 들어가고, 그들도 너희 안으로 들어가면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘매달리고’는 여기서 ‘붙들고’와 같은 뜻으로, 히브리어 דבק의 강한 부착을 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 안으로 들어가고’는 히브리어 관용구를 직역해, 단순한 이동보다 그들과의 결합·편입을 드러낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 그러나 … 정말로
  alternatives_korean:
  - 만일 …
  - 참으로 … 만일
  lexicon: HALOT
  rationale: 앞 절의 경고를 잇는 조건문이므로 역접을 띤 조건 연결을 살려 ‘그러나’와 ‘정말로’로 긴장감을 보존했습니다.
- source_word: שׁוֹב תָּשׁוּבוּ
  english_pob_choice: you indeed turn back
  chosen_korean: 돌이켜
  alternatives_korean:
  - 되돌아가
  - 다시 돌아서
  lexicon: HALOT
  rationale: 분사적 강조를 현대 한국어의 자연스러운 강조로 옮기되, 언약적 배반의 뉘앙스를 살리기 위해 단순 ‘돌아가다’보다 ‘돌이키다’를 택했습니다.
- source_word: וּדְבַקְתֶּם
  english_pob_choice: cling to
  chosen_korean: 매달리고
  alternatives_korean:
  - 붙들고
  - 굳게 매달리고
  lexicon: HALOT
  rationale: דבק의 강한 밀착 의미를 살리기 위해 관계적·언약적 결속을 드러내는 ‘매달리다’를 선택했습니다.
- source_word: וּבָאתֶם בָּהֶם
  english_pob_choice: and associate with them
  chosen_korean: 그들 안으로 들어가고
  alternatives_korean:
  - 그들과 어울리고
  - 그들 가운데 들어가고
  lexicon: HALOT
  rationale: POB의 최신 주석처럼 이 히브리 관용구를 단순한 이동이 아니라 그들과의 결합·편입으로 이해해, 성적 암시로 좁히지 않으면서도 사회적-언약적 통합의 폭을 살렸습니다.
theological_decisions:
- issue: '''남은 민족들''의 해석'
  chosen_reading: 중립적 잔여 표현으로 처리
  alternative_readings:
  - 신학적 '남은 자' 뉘앙스 부여
  - 단순히 '남은 것'으로 약화
  rationale: 여기서는 구속사적 '남은 자' 개념을 읽어들이기보다, 실제로 이스라엘 곁에 남아 있는 민족들을 가리키는 중립적 표현으로 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: וּבָאתֶם בָּהֶם의 번역 범위
  chosen_reading: 그들 안으로 들어가고
  alternative_readings:
  - 그들과 어울리고
  - 그들 가운데서 지내고
  rationale: 이 표현을 성적 완곡어법으로 축소하지 않고, 이미 언급된 혼인과 결합된 더 넓은 공동체적·언약적 편입으로 읽는 것이 문맥에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
