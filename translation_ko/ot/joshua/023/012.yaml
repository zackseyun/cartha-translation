revisions:
- from: 그러나 너희가 정말로 돌이켜 이 남은 민족들 곧 너희와 함께 남아 있는 이 민족에 매달리고, 그들과 혼인하고, 그들 안으로 들어가고, 그들도 너희 안으로 들어가면,[a][b]
  to: 그러나 만일 너희가 참으로 돌아서서 이 남은 민족들, 곧 너희와 함께 남아 있는 이 민족들에게 붙고[a], 그들과 혼인하며 그들과 어울리고, 그들도 너희와 어울리면,[b]
  rationale: Plural agreement has been corrected. The conditional connective and emphatic turning away are retained in modern formal Korean. The final reciprocal idiom is rendered as mutual association, consistent with its broader contextual sense and without imposing a sexual-only reading. Footnote anchors are placed directly after the expressions they explain.
