  source_fidelity: 동사 יִרְדָּף는 ‘추격하다/뒤쫓다’이며, 초안의 ‘쫓아내다’는 추격의 결과인 축출을 덧붙여 의미를 바꿉니다. 또한 마지막 כַּאֲשֶׁר דִּבֶּר לָכֶם은 야훼께서 싸우시는 사실을 ‘너희에게 말씀하신 그대로’라고 수식합니다.
  naturalness: ‘너희 가운데 한 사람이 천 명을 추격할 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 인과와 비교 관계를 한 문장 안에서 연결하여 원문의 구문 관계를 분명히 했습니다.
  terminology: יְהוָה는 프로젝트 방침에 맞춰 ‘야훼’로 유지했습니다. אִישׁ אֶחָד은 대표적 단수 표현으로서 ‘한 사람’으로 자연스럽게 옮겼으며, 원문의 남성형이 문맥상 특정 남성 개인을 대조적으로 지칭한다고 볼 근거는 충분하지 않습니다.
  issues:
