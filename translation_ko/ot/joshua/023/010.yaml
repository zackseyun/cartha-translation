id: JOS.23.10
reference: Joshua 23:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
  footnotes:
  - marker: a
    text: Or 'will pursue a thousand.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD'; the divine name is YHWH.
    reason: lexical_alternative
  - marker: c
    text: Or 'just as he promised you'; Hebrew more literally, 'just as he spoke to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 한 사람이 천 명을 쫓아낼 것입니다. 이는 야훼 너희 하나님이 너희를 위해 싸우시는 분이시기 때문입니다[a][b], 그분이 너희에게 말씀하신 그대로입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천 명을 쫓아낼 것입니다’는 ‘천 명을 추격할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼’(YHWH)를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분이 너희에게 약속하신 그대로입니다’; 히브리어는 더 문자적으로 ‘그분이 너희에게 말씀하신 그대로입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  english_pob_choice: One man
  chosen_korean: 너희 가운데 한 사람
  alternatives_korean:
  - 한 사람
  - 한 남자
  lexicon: HALOT
  rationale: 히브리어 단수 남성 표현의 대표성을 살리되, 한국어에서는 자연스럽고 현대적인 문맥을 위해 ‘너희 가운데 한 사람’으로 옮겼습니다.
- source_word: יִרְדָּף
  english_pob_choice: will chase
  chosen_korean: 쫓아낼 것입니다
  alternatives_korean:
  - 뒤쫓을 것입니다
  - 추격할 것입니다
  lexicon: HALOT
  rationale: 군사적 맥락에서 רדף의 적극적 추격 의미를 살리면서도 한국어에서 승리의 결과를 분명하게 드러내기 위해 ‘쫓아낼 것입니다’를 선택했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 여호와 너희 하나님
  - 야훼 하나님
  lexicon: HALOT
  rationale: 본문의 신명기적 언약 이름을 ‘야훼’로 일관되게 옮기고, 소유격은 ‘너희 하나님’으로 자연스럽게 처리했습니다.
- source_word: הַנִּלְחָם לָכֶם
  english_pob_choice: who fights for you
  chosen_korean: 너희를 위해 싸우시는 분이시기 때문입니다
  alternatives_korean:
  - 너희를 위해 싸우시는 분이기 때문입니다
  - 너희 편에서 싸우시는 분이시기 때문입니다
  lexicon: HALOT
  rationale: 분사구가 나타내는 지속적·특징적 행위를 살려 ‘싸우시는 분’으로 옮기고, לָכֶם의 관계를 ‘너희를 위해’로 분명히 했습니다.
- source_word: דִּבֶּר לָכֶם
  english_pob_choice: he spoke to you
  chosen_korean: 그분이 너희에게 말씀하신 그대로입니다
  alternatives_korean:
  - 그분이 너희에게 말씀하신 대로입니다
  - 그분이 너희에게 말씀하신 그대로입니다
  lexicon: HALOT
  rationale: 직역하면 ‘말씀하신’이지만, 문맥상 약속의 이행을 암시하므로 ‘그대로’로 마무리해 비교의 완결성을 살렸습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 언약 이름을 титул로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 대표적 남성 단수 표현의 처리
  chosen_reading: 너희 가운데 한 사람
  alternative_readings:
  - 한 사람
  - 한 남자
  rationale: 히브리어의 문법적 남성 단수와 대표성을 유지하되, 한국어에서는 성별 과잉지정을 피하지 않으면서도 자연스러운 집합적 의미를 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
