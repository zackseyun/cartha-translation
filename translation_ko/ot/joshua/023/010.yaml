  rationale: 원문의 핵심 군사 동사를 ‘추격하다’로 바로잡고, ‘야훼께서 너희를 위해 싸우신다’는 사실과 ‘너희에게 말씀하신 그대로’라는 비교절을 올바르게 연결했습니다. 하나님의 이름 및 대표적 단수 표현은 유지했습니다.
