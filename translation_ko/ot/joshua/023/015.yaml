  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
  footnotes:
  - marker: a
    text: Or 'every evil thing' or 'all the disaster.' Hebrew 'every bad word/matter,' paralleling 'every good word' earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 될 것입니다. 곧, 여호와 আপনার 하나님이 여러분에게 말씀하신 모든 좋은 말씀이 여러분 위에 임한 것처럼, 여호와께서도 여러분에게 모든 나쁜 말씀을 여러분 위에 가져오실 것입니다. 그분이 여러분을 이 좋은 땅에서, 곧 여호와 여러분의 하나님이 여러분에게 주신 이 땅에서 멸망시킬 때까지 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘모든 나쁜 말/사건’입니다. 앞절의 ‘모든 좋은 말씀’과 대구를 이루므로, 본문에서는 ‘나쁜 말씀’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall happen
  chosen_korean: 그리고 이렇게 될 것입니다
  alternatives_korean:
  - 그리고 그것은 일어날 것입니다
  - 그리고 이렇게 되리라
  lexicon: HALOT
  rationale: 서술적 미래를 자연스러운 합쇼체로 옮기되, 예언적 선언의 긴장을 유지했습니다.
- source_word: כָּל הַדָּבָר הַטּוֹב / כָּל הַדָּבָר הָרָע
  english_pob_choice: every good word / every evil word
  chosen_korean: 모든 좋은 말씀 / 모든 나쁜 말씀
  alternatives_korean:
  - 모든 좋은 말 / 모든 악한 말
  - 모든 선한 말씀 / 모든 재앙의 말씀
  lexicon: HALOT
  rationale: 히브리어의 דָּבָר를 ‘말씀’으로 살려 앞뒤의 평행을 보존하되, 하나님이 말씀하신 내용이라는 문맥을 반영했습니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: upon you
  chosen_korean: 여러분 위에
  alternatives_korean:
  - 여러분에게
  - 여러분 위로
  lexicon: HALOT
  rationale: ‘위에’로 עַל의 반복과 압박감을 살렸고, 한국어에서는 ‘임하다/가져오다’와 자연스럽게 결합됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: DOCTRINE.md contested terms
  rationale: 이 프로젝트의 기본 용례를 따라 본문에서는 ‘여호와’를 사용했습니다. 다만 이는 기존 POB 본문 관행을 따르는 표기 선택입니다.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  english_pob_choice: until he has destroyed you
  chosen_korean: 여러분을 멸망시킬 때까지
  alternatives_korean:
  - 여러분을 파멸시킬 때까지
  - 여러분을 멸절시킬 때까지
  lexicon: HALOT
  rationale: 동사의 완료 지향성을 한국어 시간 절로 자연스럽게 옮겼고, 심판의 종결점을 분명하게 했습니다.
- source_word: מֵעַל הָאֲדָמָה
  english_pob_choice: from off this good land
  chosen_korean: 이 좋은 땅에서
  alternatives_korean:
  - 이 좋은 땅 위에서부터
  - 이 좋은 땅에서부터
  lexicon: HALOT
  rationale: ‘from off’의 공간적 이미지는 한국어에서 중복을 피하고 문맥상 자연스러운 출발점 표현으로 처리했습니다.
theological_decisions:
- issue: ראע/רָע을 하나님의 행위에 대해 어떻게 옮길 것인가
  chosen_reading: ‘나쁜 말씀’으로 옮겨, 도덕적 악을 하나님께 돌리는 표현을 피하면서도 좋은/나쁜의 대구를 유지했습니다.
  alternative_readings:
  - ‘악한 말씀’
  - ‘재앙’
  rationale: 문맥은 언약적 심판의 결과를 말하므로, 하나님의 행위를 ‘악’으로 오해시키지 않으면서 גם מקור متن의 대칭을 살리는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it beyond the text'
