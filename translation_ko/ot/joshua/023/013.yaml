  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
  footnotes:
  - marker: a
    text: Or 'a scourge in your sides.' The Hebrew term rendered 'a whip' is difficult and may denote a scourging instrument or painful affliction.
    reason: lexical_alternative
  - marker: b
    text: Or 'will no longer continue to drive out'.
    reason: previous_rendering
translation:
  language: ko
  text: 반드시 분명히 알아두십시오. 야훼 당신들의 하나님께서 이 민족들을 더 이상 당신들 앞에서 몰아내지 않으실 것이며[a], 그들은 당신들에게 덫과 올무, 옆구리의 채찍과 눈의 가시가 되어[b], 마침내 야훼 당신들의 하나님께서 당신들에게 주신 이 좋은 땅에서 당신들이 멸망할 때까지 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 이상 계속하여 몰아내지 않으실 것이다’. 히브리어의 לֹא יוֹסִיף는 계속되던 행위의 중단을 나타냅니다.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘옆구리의 매질’. שֹׁטֵט는 뜻이 어려워, 고통을 주는 도구나 지속적 고통을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  english_pob_choice: know for certain
  chosen_korean: 반드시 분명히 알아두십시오
  alternatives_korean:
  - 분명히 아십시오
  - 꼭 알아두십시오
  lexicon: HALOT
  rationale: ידע의 강조형은 단순 인지가 아니라 강한 확증을 요구하므로, 한국어에서는 명령형의 강한 확실성으로 옮겼습니다.
- source_word: לֹא יוֹסִיף
  english_pob_choice: will no longer drive out
  chosen_korean: 더 이상 … 몰아내지 않으실 것이며
  alternatives_korean:
  - 더 이상 … 몰아내지 않으시며
  - 다시는 … 몰아내지 않으실 것이며
  lexicon: HALOT
  rationale: יוֹסִיף + 부정은 계속적 행위의 중단을 뜻하므로, ‘더 이상’으로 반복 중단의 뉘앙스를 살렸습니다.
- source_word: לְהוֹרִישׁ אֶת הַגּוֹיִם ... מִלִּפְנֵיכֶם
  english_pob_choice: to drive out these nations from before you
  chosen_korean: 이 민족들을 … 당신들 앞에서 몰아내다
  alternatives_korean:
  - 이 민족들을 … 당신들 앞에서 쫓아내다
  - 이 민족들을 … 당신들 앞에서 내쫓다
  lexicon: HALOT
  rationale: 정복 문맥의 ירש Hiphil은 단순 추방보다 ‘몰아내다’가 더 자연스럽고, ‘앞에서’는 전면적 대치의 공간 이미지를 보존합니다.
- source_word: לְפַח וּלְמוֹקֵשׁ
  english_pob_choice: a trap and a snare
  chosen_korean: 덫과 올무
  alternatives_korean:
  - 함정과 덫
  - 덫과 함정
  lexicon: HALOT
  rationale: 두 명사가 병렬로 쓰여 구별되므로, 한국어에서도 흔히 구별되는 두 낱말로 대응시켜 반복 효과를 살렸습니다.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  english_pob_choice: a whip on your sides
  chosen_korean: 옆구리의 채찍
  alternatives_korean:
  - 옆구리의 매질
  - 옆구리의 회초리
  lexicon: HALOT
  rationale: שֹׁטֵט의 뜻이 어려워 POB의 해석적 선택을 따르되, 한국어에서는 물체/고통의 은유를 유지하는 ‘채찍’으로 옮겼습니다.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  english_pob_choice: thorns in your eyes
  chosen_korean: 눈의 가시
  alternatives_korean:
  - 눈에 찌르는 가시
  - 눈의 가시덤불
  lexicon: HALOT
  rationale: צְנִנִים은 지속적 자극과 고통을 나타내므로, 관용적으로도 이해되는 ‘눈의 가시’로 압축하되 병렬성을 유지했습니다.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  english_pob_choice: from off this good land
  chosen_korean: 이 좋은 땅에서
  alternatives_korean:
  - 이 좋은 땅 위에서
  - 이 좋은 땅에서부터
  lexicon: HALOT
  rationale: אֲדָמָה는 여기서 하나님이 주신 언약의 땅을 가리키므로 한국어에서는 자연스럽게 ‘이 좋은 땅’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: יהוה를 야훼로 음역하여 번역문에 직접 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 언약 이름을 직접 사용하므로, 제목적 대체어보다 고유명을 보존하는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 경고문의 성격
  chosen_reading: 야훼의 진전된 정복 행위가 멈추고, 그 결과 민족들이 이스라엘의 지속적 해악과 최종 멸망의 원인이 된다는 언약적 경고로 옮겼습니다.
  alternative_readings:
  - 단순한 군사 예고
  - 도덕 훈계
  rationale: 히브리어 문장은 하나님의 행위 중단과 땅 상실을 연결하므로, 이를 완화하지 않고 경고의 인과를 그대로 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
