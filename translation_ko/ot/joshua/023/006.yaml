id: JOS.23.6
reference: Joshua 23:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
  footnotes:
  - marker: a
    text: Or 'the Book of the Instruction of Moses'; Hebrew torah can mean 'instruction' as well as 'law,' though here it refers specifically to the Mosaic legal corpus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 매우 힘써 지키고 행하여 모세의 율법 책에 기록된 모든 것을 떠나지 말고, 오른쪽으로도 왼쪽으로도 치우치지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 교훈 책’. 히브리어 torah는 ‘율법’뿐 아니라 ‘교훈’도 뜻하지만, 여기서는 모세의 법규 집합을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  english_pob_choice: be very strong
  chosen_korean: 매우 힘써
  alternatives_korean:
  - 매우 강하게
  - 매우 굳세게
  - 아주 강하게
  lexicon: HALOT
  rationale: חזק의 권면적·강화적 힘을 한국어 명령형 맥락에서 자연스럽게 살리기 위해 ‘힘써’로 옮기고, מְאֹד는 ‘매우’로 강도를 분명히 했습니다.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  english_pob_choice: to keep and to do
  chosen_korean: 지키고 행하여
  alternatives_korean:
  - 지키고 실천하여
  - 지키고 실행하여
  - 지키고 따르며
  lexicon: HALOT
  rationale: 율법 준수의 관용적 결합을 살리되, 현대 한국어에서 ‘행하다’가 다소 딱딱하므로 ‘행하여’를 써서 순종의 실천성을 유지했습니다.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  english_pob_choice: the Book of the Law of Moses
  chosen_korean: 모세의 율법 책
  alternatives_korean:
  - 모세의 율법서
  - 모세의 율법 두루마리
  - 모세의 율법의 책
  lexicon: HALOT
  rationale: תּוֹרָה를 이 문맥의 언약적 법규 묶음으로 보고 ‘율법’으로 옮겼고, סֵפֶר는 한국어에서 가장 자연스러운 ‘책’으로 처리했습니다.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  english_pob_choice: so as not to turn from it to the right or to the left
  chosen_korean: 떠나지 말고, 오른쪽으로도 왼쪽으로도 치우치지
  alternatives_korean:
  - 벗어나지 말고, 오른쪽이나 왼쪽으로 치우치지
  - 그것에서 벗어나지 말고, 우로나 좌로나 치우치지
  - 떠나지 말고, 좌우로 치우치지
  lexicon: HALOT
  rationale: סוּר는 단순한 ‘전환’보다 ‘벗어남/떠남’의 의미가 강해 ‘떠나지’로 옮겼고, 관용구 ‘오른쪽/왼쪽으로 치우치다’로 방향 이탈의 이미지를 보존했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역
  chosen_reading: ‘율법’으로 번역해 모세에게 주어진 규범적 법규 체계를 가리키게 했습니다.
  alternative_readings:
  - ‘교훈’으로 번역
  - ‘가르침’으로 번역
  rationale: 이 구절은 모세의 책에 기록된 규범적 준수를 말하므로, 넓은 의미의 ‘instruction’보다 문맥상 ‘율법’이 더 정확합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; documented semantic range of תּוֹרָה in covenantal/legal contexts'
