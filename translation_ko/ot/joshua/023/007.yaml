id: JOS.23.7
reference: Joshua 23:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
  footnotes:
  - marker: a
    text: Or 'invoke the name of their gods.' The Hebrew verb can mean 'mention' or, in context, 'invoke.'
    reason: lexical_alternative
  - marker: b
    text: Or 'swear by them.' The Hebrew verb is causative, literally 'make swear,' which may include causing others to take an oath by those gods.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 남아 있는 민족들, 곧 여러분과 함께 있는 이들 가운데로 들어가지 않도록 하십시오. 그들의 신들의 이름을 언급하지도[a] 말고, 그 신들을 두고 누구에게도 맹세하게 하지도[b] 말며, 그들을 섬기지도 말고 그들에게 절하지도 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들의 이름을 부르다.’ 히브리어 동사는 ‘언급하다’ 또는 이 문맥에서는 ‘부르다, 호소하다’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 신들을 두고 맹세하지도 말며.’ 히브리어 동사는 사역형으로, 문자적으로는 ‘[누구를] 맹세하게 하다’입니다. 목적어는 원문에 나타나지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא
  english_pob_choice: so that you do not come among
  chosen_korean: 들어가지 못하게 하십시오
  alternatives_korean:
  - 들어오지 못하게 하십시오
  - 그들 가운데로 가지 못하게 하십시오
  - 그들 가운데로 들어가지 않게 하십시오
  lexicon: HALOT
  rationale: לְבִלְתִּי + 부정 부정사구는 목적/방지의 뜻이므로 자연스러운 금지 표현으로 옮겼습니다. בוא는 단순 이동보다 ‘들어가다’가 맞지만, 한국어에서는 다음 구절의 ‘가운데’와 함께 ‘들어가지 못하게’가 가장 분명합니다.
- source_word: בַּגּוֹיִם הָאֵלֶּה הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  english_pob_choice: these nations, these that remain with you
  chosen_korean: 이 남은 민족들 곧 여러분과 함께 있는 이들
  alternatives_korean:
  - 이 민족들 가운데 남아 있는 이들
  - 여러분과 함께 남아 있는 이 민족들
  - 이 남은 나라들
  lexicon: HALOT
  rationale: גוים는 이 문맥에서 이스라엘 곁에 남아 있는 이방 민족들을 가리키므로 ‘민족들’이 적절합니다. ‘여러분과 함께 있는’은 אִתְּכֶם을 그대로 살려 공존 상태를 드러냅니다.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  english_pob_choice: do not mention the name of their gods
  chosen_korean: 그들의 신들의 이름을 언급하지도 말고
  alternatives_korean:
  - 그들의 신들의 이름을 부르지도 말고
  - 그들의 신들의 이름을 기억하게 하지도 말고
  - 그들의 신들의 이름을 언급하거나 불러내지도 말고
  lexicon: HALOT
  rationale: הזכיר는 이 문맥에서 ‘언급하다’가 가장 직접적입니다. POB의 해석처럼 ‘invoke’ 가능성도 있으나, 뒤의 맹세 동사가 이어지므로 한국어 본문은 덜 해석적인 ‘언급하다’를 택했습니다.
- source_word: וְלֹא תַשְׁבִּיעוּ
  english_pob_choice: or make anyone swear by them
  chosen_korean: 그들로 하여금 맹세하게 하지도 말며
  alternatives_korean:
  - 그들로 맹세하지도 말며
  - 그들을 두고 맹세하게 하지도 말며
  - 그들 앞에서 맹세하게 하지도 말며
  lexicon: HALOT
  rationale: שׁבע의 히필은 사역형이므로 단순히 ‘맹세하다’보다 ‘맹세하게 하다’가 원문에 가깝습니다. 주어가 생략된 한국어에서는 행위의 대상이 드러나도록 간결하게 풀었습니다.
- source_word: וְלֹא תַעַבְדוּם / וְלֹא תִשְׁתַּחֲו֖וּ לָהֶם
  english_pob_choice: or serve them or bow down to them
  chosen_korean: 그들을 섬기지도 말고, 그들에게 절하지도 마십시오
  alternatives_korean:
  - 그들을 섬기지도 말고, 그들에게 엎드려 절하지도 마십시오
  - 그들을 예배하지도 말고, 그들에게 절하지도 마십시오
  - 그들을 섬기지도 말고, 그들 앞에 몸을 굽히지도 마십시오
  lexicon: HALOT
  rationale: עבד는 일반적 ‘섬기다’가 적절하고, שחה는 물리적 자세를 가리키므로 ‘절하다’로 구별했습니다. ‘예배하다’는 의미를 넓혀 두 동사의 차이를 흐릴 수 있어 피했습니다.
theological_decisions:
- issue: 이방 신 숭배 금지의 동작을 어떻게 구분할 것인가
  chosen_reading: ‘언급하다—맹세하게 하다—섬기다—절하다’의 네 동사를 각각 살려 번역했습니다.
  alternative_readings:
  - ‘예배하다’로 묶어 일반화하기
  - ‘부르다/맹세하다/예배하다’처럼 한국 교회식 용어로 정리하기
  rationale: 히브리어는 우상숭배에 대한 구체적 행위를 연속적으로 나열합니다. 이를 일반적인 ‘예배’로 압축하면 원문의 강한 실천적 금지와 단계적 표현이 약해집니다.
  doctrine_reference: 번역 원칙 1, 3, 5
