  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
  footnotes:
  - marker: a
    text: 'Hebrew: ''toward the going down of the sun,'' that is, toward the west.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 내가 요단에서부터, 내가 끊어 버린 모든 민족과 함께, 이 남아 있는 민족들을 너희 지파들의 기업으로 너희에게 나누어 주었습니다. 큰 바다와 해가 지는 쪽까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구인 ‘해가 지는 쪽’은 곧 서쪽을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 복수 명령으로 주의를 환기하는 표현이므로, 현대 합쇼체에서 직접적이면서도 공적인 어조의 ‘보십시오’가 가장 잘 맞습니다.
- source_word: הִפַּ֨לְתִּי
  english_pob_choice: I have allotted
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
  - 할당해 주었습니다
  - 분배해 주었습니다
  - 기업으로 정해 주었습니다
  lexicon: HALOT
  rationale: 문맥상 땅을 제비뽑기 식으로 배정한 뜻이므로, 한국어에서는 ‘나누어 주었습니다’가 분배·배당의 의미를 자연스럽게 살립니다.
- source_word: הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה
  english_pob_choice: these nations that remain
  chosen_korean: 이 남아 있는 민족들
  alternatives_korean:
  - 이 남은 민족들
  - 이 남아 있는 나라들
  - 이 남은 나라들
  lexicon: HALOT
  rationale: ‘민족들’은 가나안의 여러 집단을 가리키는 용법을 살리며, ‘남아 있는’은 분사적 지속 상태를 반영합니다.
- source_word: בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם
  english_pob_choice: as an inheritance for your tribes
  chosen_korean: 너희 지파들의 기업으로
  alternatives_korean:
  - 너희 지파들의 상속 몫으로
  - 너희 지파들의 유산으로
  - 너희 지파들에게 기업으로
  lexicon: HALOT
  rationale: ‘נחלה’의 언약-토지 용례를 따라 교회적 ‘유산’보다 성경적 용어인 ‘기업’이 더 직접적입니다.
- source_word: מִן הַ/יַּרְדֵּ֗ן ... וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ
  english_pob_choice: from the Jordan ... to the Great Sea toward the going down of the sun
  chosen_korean: 요단에서부터 ... 큰 바다와 해가 지는 쪽까지
  alternatives_korean:
  - 요단에서부터 ... 큰 바다와 해 지는 곳까지
  - 요단에서부터 ... 큰 바다와 서쪽 끝까지
  lexicon: HALOT
  rationale: 지형 경계를 표시하는 말이므로 출발점과 종착점을 드러내되, ‘해가 지는 쪽’으로 히브리어 관용구의 방향성을 보존했습니다.
theological_decisions:
- issue: קביעת גבולות הארץ를 어떻게 표현할지
  chosen_reading: 이 구절은 약속된 땅의 분배와 경계 설정을 선언하는 말씀으로 보고, ‘기업’과 ‘나누어 주었습니다’로 언약적 분배 의미를 살렸습니다.
  alternative_readings:
  - 단순한 영토 행정 묘사로 완화하는 번역
  - ‘정복했다’ 중심의 군사적 번역
  rationale: 히브리어는 토지 분배와 경계 지정의 언약적 의미를 함께 지니므로, 행정적 중립화보다 본문의 신학적 무게를 드러내는 쪽이 적절합니다.
  doctrine_reference: 언약과 기업 신학; 여호수아의 땅 분배 주제
