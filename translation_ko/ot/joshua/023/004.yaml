  text: 보십시오. 내가 이 남아 있는 민족들을 너희 지파들에게 기업으로, 요단에서부터 내가 끊어 낸 모든 민족과 해가 지는 쪽의 큰 바다까지 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
