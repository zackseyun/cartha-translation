source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
  footnotes:
  - marker: a
    text: Or 'and you will inherit their land.' The Hebrew verb can mean 'inherit' or 'take possession of'; here the latter was chosen to fit the conquest context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'just as the LORD your God spoke to you'; the sense includes promise, but the main text keeps the more literal 'spoke.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 너희 하나님께서 친히 그들을 너희 앞에서 몰아내시고 그들의 소유를 너희 앞에서 빼앗으실 것이니, 너희는 그들의 땅을 차지할 것입니다.[a] 야훼 너희 하나님께서 너희에게 말씀하신 것과 같습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ירש는 여기서 ‘상속하다’로도 옮길 수 있으나, 이 문맥에서는 ‘차지하다’ 또는 ‘점유하다’의 뜻이 더 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼 너희 하나님께서 너희에게 말씀하신 것’입니다. 문맥상 약속의 뜻이 포함되지만, 본문은 더 직접적인 ‘말씀하다’를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה אֱלֹהֵיכֶם
  english_pob_choice: And Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 야훼, 너희 하나님
  - 여호와 너희 하나님
  lexicon: HALOT
  rationale: אָנֹכִי/יְהוָה의 언약명을 프로젝트 기본값대로 야훼로 옮기고, אֱלֹהֵיכֶם은 단수 관계를 살려 ‘너희 하나님’으로 자연스럽게 렌더링했습니다.
- source_word: הוּא
  english_pob_choice: he himself
  chosen_korean: 친히
  alternatives_korean:
  - 그가
  - 그 자신이
  lexicon: HALOT
  rationale: 독립 대명사의 강조를 한국어 부사 ‘친히’로 압축해, 하나님이 직접 행동하신다는 점을 드러냈습니다.
- source_word: יֶהְדֳּפֵם / וְהוֹרִישׁ אֹתָם
  english_pob_choice: will drive them out ... and dispossess them
  chosen_korean: 그들을 너희 앞에서 쫓아내시고, 그들을 너희 앞에서 내쫓으실 것이며
  alternatives_korean:
  - 그들을 너희 앞에서 몰아내시고, 그들을 너희 앞에서 빼앗으실 것이며
  - 그들을 너희 앞에서 쳐내시고, 그들의 소유를 빼앗으실 것이며
  lexicon: HALOT
  rationale: 두 동사의 반복과 차이를 살리기 위해 첫째는 물리적 축출, 둘째는 소유 상실의 뉘앙스를 가진 ‘내쫓다’로 옮겨, POB의 구분을 한국어에서 유지했습니다.
- source_word: וִירִשְׁתֶּם אֶת אַרְצָם
  english_pob_choice: and you will take possession of their land
  chosen_korean: 너희는 그들의 땅을 차지할 것입니다
  alternatives_korean:
  - 너희는 그들의 땅을 소유하게 될 것입니다
  - 너희는 그들의 땅을 상속받을 것입니다
  lexicon: HALOT
  rationale: ירש의 문맥상 ‘inherit’보다 실제 점유·획득을 드러내는 ‘차지하다’가 정복 문맥을 더 잘 반영합니다.
- source_word: כַּאֲשֶׁר דִּבֶּר
  english_pob_choice: just as Yahweh your God spoke to you
  chosen_korean: 야훼 너희 하나님께서 너희에게 말씀하신 것과 같습니다
  alternatives_korean:
  - 야훼 너희 하나님께서 너희에게 말씀하신 그대로입니다
  - 야훼 너희 하나님께서 너희에게 약속하신 것과 같습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미 ‘말씀하다/말하다’를 유지하면서, 약속의 함의는 문맥에서 드러나도록 두어 본문 어휘를 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: 야훼의 직접적 행위와 이스라엘의 소유 획득을 구분하는 번역
  chosen_reading: 하나님은 친히 축출하시는 주체이고, 이스라엘은 그 결과로 땅을 차지합니다.
  alternative_readings:
  - 두 절을 모두 ‘쫓아내다’로 평행시킴
  - ‘상속하다’로 번역해 보다 전통적인 언약 언어를 사용함
  rationale: 히브리어의 두 번째 ירש 계열 동사는 첫 번째 축출 동사와 기능이 다르므로, 번역에서도 주체-결과 관계와 토지 점유의 법적 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §5: consistency of key terms, or documented exception'
