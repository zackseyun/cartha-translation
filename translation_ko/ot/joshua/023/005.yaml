  source_fidelity: 개정이 필요합니다. 초안의 ‘쫓아내시고/내쫓으실 것이며’는 יֶהְדֳּפֵם(몰아내다)과 וְהוֹרִישׁ אֹתָם(그들의 소유를 빼앗아 내쫓다, 곧 박탈하다)의 의미상 구별을 충분히 드러내지 못합니다. ‘그들의 소유를 빼앗으시고’로 두 번째 동사의 토지 점유 박탈의 뉘앙스를 보존했습니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 다만 동일한 ‘쫓아내다’ 계열의 연속 사용은 한국어에서 불필요하게 중복되고 원문의 동사 대비도 흐립니다. 접속을 ‘것이니’로 정리하여 뒤의 결과절과 자연스럽게 연결했습니다.
  terminology: ‘야훼’, ‘너희 하나님’, ‘친히’, ‘차지하다’, ‘말씀하신 것과 같습니다’는 적절합니다. ‘야훼’ 표기는 프로젝트의 신명 방침과 일치합니다. ירש의 두 용례는 ‘소유를 빼앗다’와 ‘땅을 차지하다’로 구별했습니다.
