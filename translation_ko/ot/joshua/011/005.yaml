base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
  footnotes:
  - marker: a
    text: Or 'assembled by agreement' or 'met together'; the Hebrew verb suggests a coordinated gathering, not merely a chance meeting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 왕들이 약속하여 함께 모였고, 와서 메롬 물가에 함께 진을 치고 이스라엘과 싸우려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘합의하여 모였다’, ‘함께 모였다’. 히브리어 동사는 단순한 만남보다 사전 합의된 집결을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  english_pob_choice: met by agreement
  chosen_korean: 약속하여 함께 모였고
  alternatives_korean:
  - 서로 합의하여 모였고
  - 합의하여 모였고
  - 함께 모였고
  lexicon: HALOT
  rationale: 니팔형 יעד는 단순한 우연한 만남이 아니라 사전에 정해진 협의·합의를 동반한 집결을 뜻하므로, 한국어로는 ‘약속하여 함께 모였고’라고 옮겨 연합의 성격을 드러냈습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: encamped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 치고
  - 야영하고
  - 진을 쳤고
  lexicon: HALOT
  rationale: 군사적 문맥의 חנה는 단순한 숙박보다 진영을 세우는 뜻이 강하므로, 전투 대비를 살리는 ‘진을 치고’를 선택했습니다.
- source_word: אֶל מֵי מֵרוֹם
  english_pob_choice: at the waters of Merom
  chosen_korean: 메롬 물가에
  alternatives_korean:
  - 메롬의 물가에
  - 메롬 물 곁에
  - 메롬 물가로
  lexicon: HALOT
  rationale: 히브리어의 ‘물들’ 표현을 살리면서, 군대가 진을 친 장소를 자연스럽게 보여 주기 위해 ‘메롬 물가에’로 옮겼습니다.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  english_pob_choice: to fight against Israel
  chosen_korean: 이스라엘과 싸우려 했습니다
  alternatives_korean:
  - 이스라엘과 싸우기 위해
  - 이스라엘을 치러
  - 이스라엘과 전쟁하려고
  lexicon: HALOT
  rationale: לחם עם의 적대적 의미를 한국어에서 가장 직접적으로 전달하기 위해 ‘이스라엘과 싸우다’를 사용했고, 문맥상 목적을 나타내기 위해 ‘-려 했습니다’로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 연합의 성격을 어떻게 드러낼지
  chosen_reading: 왕들이 단순히 우연히 만난 것이 아니라, 사전 합의 아래 연합하여 움직였다는 점을 드러냈습니다.
  alternative_readings:
  - 그냥 함께 모였다고만 옮길 수 있습니다.
  - ‘회의했다’처럼 중립적으로 처리할 수도 있습니다.
  rationale: 본문은 전투 동맹의 형성을 강조하므로, 우연한 집합처럼 완화하지 않고 조직된 연합의 뉘앙스를 보존했습니다.
  doctrine_reference: '본문 주해 원칙: 서술의 역사적·문맥적 강세 보존'
