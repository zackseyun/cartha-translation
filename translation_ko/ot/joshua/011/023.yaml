source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
  footnotes:
  - marker: a
    text: Or 'the whole land.' The phrase summarizes Joshua's conquest of the land under discussion.
    reason: lexical_alternative
  - marker: b
    text: Or 'was quiet from war.' The Hebrew expression denotes rest or tranquility after conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 야훼께서 모세에게 말씀하신 모든 것대로 그 땅 전체를[a] 차지하였습니다. 여호수아는 그것을 이스라엘에게 그들의 지파별 구분에 따라 기업으로 주었습니다. 그리고 그 땅은 전쟁에서 벗어나 평온하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅’. 이 표현은 논의 중인 땅 전체를 요약하여 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전쟁으로부터 조용하였다’. 히브리어 표현은 전쟁 후의 쉼이나 평온을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 점령하였고
  alternatives_korean:
  - 취하였고
  - 가졌고
  - 차지하였고
  lexicon: HALOT
  rationale: 문맥상 단순 ‘가지다’보다 군사적 성취를 드러내는 ‘점령하다’가 מתאים하지만, 본문이 요약 진술이므로 과도한 해설은 피했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the land
  chosen_korean: 그 땅 전체
  alternatives_korean:
  - 온 땅
  - 그 모든 땅
  - 온전히 그 땅
  lexicon: HALOT
  rationale: 이 구는 논의 중인 약속의 땅 전체를 가리키므로, 영어 POB의 범위를 따라 ‘그 땅 전체’로 옮겼습니다.
- source_word: לְנַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 기업으로
  alternatives_korean:
  - 상속으로
  - 상속 재산으로
  - 유업으로
  lexicon: HALOT
  rationale: נחלה는 언약적 토지 분배의 ‘기업’ 의미가 강하므로, 한국어 성경에서 익숙하면서도 신학적 함의를 살릴 수 있는 ‘기업으로’를 택했습니다.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  english_pob_choice: according to their divisions by their tribes
  chosen_korean: 그들의 지파별 분배에 따라
  alternatives_korean:
  - 그들의 분할에 따라 각 지파별로
  - 지파들에 따라 나눈 대로
  - 그 지파들의 구분대로
  lexicon: HALOT
  rationale: ‘분배/분할’과 ‘지파’의 관계를 자연스럽게 살리기 위해, 두 표현을 합쳐 ‘지파별 분배’로 압축했습니다.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  english_pob_choice: had rest from war
  chosen_korean: 전쟁에서 평안하였습니다
  alternatives_korean:
  - 전쟁에서 쉬었습니다
  - 전쟁으로부터 잠잠하였습니다
  - 전쟁이 그쳤습니다
  lexicon: HALOT
  rationale: שקט는 단순한 정지보다 평온과 안식을 함께 포함하므로, 전쟁의 중단과 상태적 평온을 함께 드러내는 ‘평안하다’를 사용했습니다.
theological_decisions:
- issue: ‘all the land’의 범위와 정복 서술의 긴장
  chosen_reading: 본문의 요약적 정복 진술을 그대로 살려 ‘그 땅 전체’로 옮기되, 다른 본문들과의 긴장은 해소하지 않았습니다.
  alternative_readings:
  - 완전한 즉각 점유를 암시하는 절대적 서술
  - 과장된 승전 요약으로만 처리
  rationale: 히브리어는 서술적 요약을 제시하므로, 번역이 조화론을 미리 결론짓지 않도록 했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
