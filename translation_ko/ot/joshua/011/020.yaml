  edition: WLC
  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'to strengthen their hearts.' Here the sense is that the LORD made them resolute in opposition, that is, hardened them.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'devote them to destruction,' a technical term for placing something under the ban for judgment; alternatively, 'utterly destroy them' or 'put them under the ban.'
    reason: lexical_alternative
  - marker: c
    text: Or 'so that they would have no mercy' or 'so that there would be no supplication for them.' The Hebrew phrase is compact and may refer to the absence of any plea or grant of mercy.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 마음을 굳게 하셔서 이스라엘을 맞아 싸우게 하신 것은 야훼에게서 비롯된 일이었습니다[a]. 이는 그들을 진멸하시고[b], 그들을 위한 간청이 없게 하시며[c], 야훼께서 모세에게 명령하신 대로 그들을 멸하시기 위함이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 마음을 강하게 하셔서.’ 여기서는 그들이 이스라엘을 적대하여 맞서도록 굳세게, 곧 완고하게 하셨다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘진멸에 바치다’ 또는 ‘진멸의 대상으로 삼다’라는 기술적 표현을 사용합니다. ‘전멸시키다’ 또는 ‘진멸하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들에게 자비가 없게 하시며’ 또는 ‘그들을 위한 자비의 간청이 없게 하시며.’ 히브리어 표현은 압축되어 있어, 간청의 부재와 자비의 부재 중 어느 쪽을 강조하는지 단정하기 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼께로부터 온 것이었습니다
  alternatives_korean:
  - 주께로부터 온 것이었습니다
  - 야훼로부터였습니다
  lexicon: HALOT
  rationale: 출처·기원을 나타내는 표현으로 처리하되, 본 프로젝트의 YHWH 기본값인 ‘야훼’를 유지했습니다. 한국어에서는 ‘~께로부터 온 것’이 원인/기원을 자연스럽게 드러냅니다.
- source_word: לְחַזֵּק אֶת לִבָּם
  english_pob_choice: to harden their hearts
  chosen_korean: 그들의 마음을 강하게 하여
  alternatives_korean:
  - 그들의 마음을 완악하게 하여
  - 그들의 마음을 굳게 하여
  lexicon: HALOT
  rationale: חזק의 기본 의미는 ‘강하게 하다’이므로 직역 축을 살렸습니다. 다만 문맥상 완고함의 결과가 따라오므로 각주로 ‘harden/strengthen’의 긴장을 드러냈습니다.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  english_pob_choice: to meet Israel in battle
  chosen_korean: 이스라엘과 맞서 싸우게 하신 것인데
  alternatives_korean:
  - 이스라엘을 전투에서 맞닥뜨리게 하신 것인데
  - 이스라엘을 맞아 전쟁하게 하신 것인데
  lexicon: HALOT
  rationale: לִקְרַאת는 단순 조우가 아니라 적대적 맞섬을 뜻하므로 ‘맞서 싸우다’로 옮겼습니다. 한국어 어순상 목적절의 흐름도 자연스럽게 유지됩니다.
- source_word: לְמַעַן הַחֲרִימָם / לְמַעַן הַשְׁמִידָם
  english_pob_choice: so that he might devote them to destruction / but so that he might destroy them
  chosen_korean: 그들을 진멸하시고
  alternatives_korean:
  - 그들을 멸망시키시고
  - 그들을 전멸시키시고
  lexicon: HALOT
  rationale: חרם의 기술적 의미를 살리기 위해 ‘진멸’로 옮겼습니다. 뒤이어 나오는 ‘멸하시려는’과 함께, 헌납-심판의 중첩된 강도를 한국어로 드러냅니다.
theological_decisions:
- issue: 하나님이 마음을 강하게 하시는 주도성
  chosen_reading: ‘야훼께로부터 온 것이었습니다… 그들의 마음을 강하게 하여’로, 하나님의 직접적 주도성을 약화하지 않았습니다.
  alternative_readings:
  - 야훼께서 허용하셔서 그들이 완고해졌습니다
  - 그들의 선택을 야훼께서 그냥 두셨습니다
  rationale: 히브리어는 완고함의 결과를 야훼께 직접 돌립니다. 본문이 가진 긴장(하나님의 주권과 인간의 적대)을 완화하지 않고 그대로 두는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
