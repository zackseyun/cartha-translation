base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
  footnotes:
  - marker: a
    text: Or 'tomorrow about this time.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'I am giving all of them before Israel as slain men,' that is, delivering them for Israel to strike down.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. “그들을 두려워하지 마십시오. 내일 이맘때[a] 내가 그들 모두를 이스라엘 앞에 죽임당한 자들로 넘겨주고 있다[b]. 그들의 말들의 힘줄을 끊고 그들의 병거들을 불에 태우십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내일 이 시간쯤’입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘내가 그들 모두를 이스라엘 앞에 죽임당한 자들로 주고 있다’는 식으로, 이스라엘이 그들을 쳐부수게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 주어가 여호와 신명문맥의 고유 이름이므로 프로젝트 기본값인 ‘야훼’를 따랐습니다.
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 마라
  lexicon: HALOT
  rationale: 금지형의 직접 명령을 현대 표준어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מָחָר כָּעֵת הַזֹּאת
  english_pob_choice: tomorrow at this time
  chosen_korean: 내일 이맘때
  alternatives_korean:
  - 내일 이 시간에
  - 내일쯤 같은 때
  lexicon: HALOT
  rationale: 시간 관용구를 한국어의 자연스러운 동시성 표현으로 간결하게 살렸습니다.
- source_word: חֲלָלִים
  english_pob_choice: slain men
  chosen_korean: 죽임당한 자들
  alternatives_korean:
  - 죽임을 당한 사람들
  - 쓰러진 자들
  lexicon: HALOT
  rationale: 전투 맥락의 ‘죽임당한 자들’을 살리되, 성별을 불필요하게 고정하지 않는 한국어 표현을 택했습니다.
theological_decisions:
- issue: 여호수아에게 주시는 신적 약속의 어조
  chosen_reading: 직접 화법 안에서 ‘두려워하지 마십시오’로 공적 명령의 긴장을 유지했습니다.
  alternative_readings:
  - 두려워 말라
  - 두려워하지 마라
  rationale: 본문은 전쟁 직전의 신적 격려이므로, 구어체보다 공적이고 엄중한 합쇼체가 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: Source-text pragmatics; divine speech register
- issue: ‘이스라엘 앞에’의 공간적 표현
  chosen_reading: ‘이스라엘 앞에’로 유지했습니다.
  alternative_readings:
  - 이스라엘에게
  - 이스라엘 손에
  rationale: 히브리어 לִפְנֵי의 공간적·법정적 이미지를 약화시키지 않고, 항복/패배의 상태를 그대로 드러냅니다.
  doctrine_reference: HALOT on לִפְנֵי + context
