  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
  footnotes:
  - marker: a
    text: Or 'that stood on their tells'—that is, on settlement mounds formed by successive layers of habitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘은 언덕[a] 위에 세워진 어떤 성읍도 불태우지 않았습니다. 하솔만은 예외로, 여호수아가 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘텔 위에’. 여기서 ‘언덕’은 여러 시대의 정착과 건축이 겹쳐 형성된 높아진 성읍 터를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
