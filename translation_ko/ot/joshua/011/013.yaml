    issue: תֵּל을 ‘기초’로 번역함
    rationale: תֵּל은 건물의 기초가 아니라, 반복된 정착으로 형성된 높아진 성읍 언덕 또는 고고학적 텔을 가리킵니다. ‘기초 위에 서 있는’은 원문의 지형적 의미를 바꾸며 한국어에서도 성읍과 결합할 때 부자연스럽습니다.
