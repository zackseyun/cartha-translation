    rationale: 초안도 핵심 뜻을 보존하지만, ‘하솔만은 따로’는 유일한 예외의 표지로 다소 약하고, 이어지는 ‘그것’의 지시가 불필요합니다. 하솔만이 예외이고 여호수아가 이를 불태웠음을 직접 연결하면 히브리어의 강조 구조가 더 선명해집니다.
