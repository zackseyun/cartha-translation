  lexicon: HALOT
  rationale: 부정문과 결합된 분배적 의미를 한국어에서는 직접 목적어로 간결하게 옮기는 편이 가장 자연스럽습니다.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  english_pob_choice: that stood on their mounds
  chosen_korean: 기초 위에 서 있는
  alternatives_korean:
  - 언덕 위에 서 있는
  - 퇴적 언덕 위에 서 있는
  - 옛 터 위에 서 있는
  lexicon: HALOT
  rationale: 히브리어의 정착 지형 이미지를 살리되, 한국어 독자에게 낯선 ‘tells’ 설명어 대신 본문 흐름상 이해되는 ‘기초 위에 서 있는’으로 옮겼습니다.
- source_word: לְבַדָּהּ
  english_pob_choice: alone
  chosen_korean: 따로
  alternatives_korean:
  - 홀로
  - 혼자서
  - 오직
  lexicon: HALOT
  rationale: 하솔이 유일한 예외임을 강조하면서도, 한국어에서는 ‘하솔만은 따로’가 가장 자연스럽고 과도한 의인화를 피합니다.
theological_decisions:
- issue: 도시 파괴 예외의 강조
  chosen_reading: 하솔만 유일한 예외로 남기고 나머지 성읍들은 불태우지 않았다는 역사 서술로 읽었습니다.
  alternative_readings:
  - 정복 전쟁의 무차별적 파괴로 읽는 방식
  - 하솔의 파괴를 단순한 군사 기록보다 상징적으로 확대하는 방식
  rationale: 본문은 예외를 명시하는 역사적 진술이며, 원문이 허용하는 범위를 넘는 상징화는 피했습니다.
  doctrine_reference: 성경 역사서의 서술 장르와 문맥 우선 원칙
