revisions:
- from: 그러나 이스라엘은 기초 위에 서 있는 모든 성읍을 불사르지 않았습니다. 오직 하솔만은 따로 불사랐습니다. 여호수아가 그것을 불살랐습니다.[a]
  to: 그러나 이스라엘은 언덕[a] 위에 세워진 어떤 성읍도 불태우지 않았습니다. 하솔만은 예외로, 여호수아가 불태웠습니다.
  rationale: 원문의 תֵּל을 ‘언덕’으로 번역하여 성읍이 세워진 정착 지형이라는 의미를 보존하고, 전문 고고학 용어 ‘텔’은 대안 번역과 설명으로 각주 처리했습니다. 부정문 ‘어떤 성읍도 불태우지 않았습니다’는 ‘모든 성읍’을 수식하는 원문의 분배적 부정을 자연스럽게 반영합니다. 하솔의 유일한 예외와 여호수아의 행위를 직접 연결하여 원문의 대조와 강조를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:55:30Z'
