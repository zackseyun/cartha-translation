base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
  footnotes:
  - marker: a
    text: Or 'that stood on their tells'—that is, on settlement mounds formed by successive layers of habitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘은 기초 위에 서 있는 모든 성읍을 불사르지 않았습니다. 오직 하솔만은 따로 불사랐습니다. 여호수아가 그것을 불살랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기초’는 본문이 가리키는 정착지의 높아진 터를 풀어 옮긴 것입니다. 영어 POB의 ‘mounds’와 유사하게, 고고학적 ‘tell(텔)’의 개념을 직역하기보다 독자가 이해하기 쉬운 표현을 택했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 하지만
  lexicon: HALOT
  rationale: 서술 전환의 반대·대조를 자연스러운 현대 한국어로 살리되, 앞선 전개와의 예외를 분명히 나타내기 위해 ‘그러나’를 택했습니다.
- source_word: כָּל הֶעָרִים
  english_pob_choice: any of the cities
  chosen_korean: 모든 성읍을
  alternatives_korean:
  - 모든 도시를
  - 그 모든 성읍을
  lexicon: HALOT
  rationale: 부정문과 결합된 분배적 의미를 한국어에서는 직접 목적어로 간결하게 옮기는 편이 가장 자연스럽습니다.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  english_pob_choice: that stood on their mounds
  chosen_korean: 기초 위에 서 있는
  alternatives_korean:
  - 언덕 위에 서 있는
  - 퇴적 언덕 위에 서 있는
  - 옛 터 위에 서 있는
  lexicon: HALOT
  rationale: 히브리어의 정착 지형 이미지를 살리되, 한국어 독자에게 낯선 ‘tells’ 설명어 대신 본문 흐름상 이해되는 ‘기초 위에 서 있는’으로 옮겼습니다.
- source_word: לְבַדָּהּ
  english_pob_choice: alone
  chosen_korean: 따로
  alternatives_korean:
  - 홀로
  - 혼자서
  - 오직
  lexicon: HALOT
  rationale: 하솔이 유일한 예외임을 강조하면서도, 한국어에서는 ‘하솔만은 따로’가 가장 자연스럽고 과도한 의인화를 피합니다.
theological_decisions:
- issue: 도시 파괴 예외의 강조
  chosen_reading: 하솔만 유일한 예외로 남기고 나머지 성읍들은 불태우지 않았다는 역사 서술로 읽었습니다.
  alternative_readings:
  - 정복 전쟁의 무차별적 파괴로 읽는 방식
  - 하솔의 파괴를 단순한 군사 기록보다 상징적으로 확대하는 방식
  rationale: 본문은 예외를 명시하는 역사적 진술이며, 원문이 허용하는 범위를 넘는 상징화는 피했습니다.
  doctrine_reference: 성경 역사서의 서술 장르와 문맥 우선 원칙
