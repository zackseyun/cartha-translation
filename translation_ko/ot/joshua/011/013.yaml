  - 하지만
  lexicon: HALOT
  rationale: 서술 전환의 반대·대조를 자연스러운 현대 한국어로 살리되, 앞선 전개와의 예외를 분명히 나타내기 위해 ‘그러나’를 택했습니다.
- source_word: כָּל הֶעָרִים
  english_pob_choice: any of the cities
  chosen_korean: 모든 성읍을
