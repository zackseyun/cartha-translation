  source_fidelity: ‘기초’는 히브리어 תֵּל(정착이 거듭되며 형성된 성읍 언덕, tell)의 지형적 의미를 벗어나므로 수정이 필요합니다. 또한 하솔이 유일한 예외이며 여호수아가 그것을 불태웠다는 절의 구조를 한 문장 안에서 분명히 드러내는 편이 원문에 더 충실합니다.
  naturalness: ‘언덕 위에 세워진 성읍들’은 현대 표준 한국어로 자연스럽고, 각 성읍이 정착 언덕 위에 놓여 있다는 의미를 무리 없이 전달합니다. ‘하솔만은 예외로, 여호수아가 불태웠습니다’는 반복을 줄이면서도 주체와 예외를 명료하게 합니다.
  terminology: ‘성읍’, ‘이스라엘’, ‘하솔’, ‘여호수아’는 본문 장르와 한국어 성경 관례에 적절합니다. 지형어는 본문에서 ‘언덕’으로 옮기고, 정착층으로 이루어진 언덕이라는 전문적 의미는 각주에서 밝혀야 합니다.
  issues:
