  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
  footnotes:
  - marker: a
    text: Or 'the smooth mountain.' The Hebrew can be understood descriptively, but here it likely functions as the place name 'Mount Halak.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the plain of Lebanon.' The Hebrew term can denote a broad valley or plain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하할라크 산에서부터—그 산은 세일을 향해 올라가며—레바논 골짜기 안, 헤르몬 산 아래에 있는 바알갓까지 이르렀습니다. 그리고 그들의 모든 왕을 사로잡아 쳐서 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매끈한 산’입니다. 히브리어는 묘사적 의미로도 읽을 수 있지만, 여기서는 지명인 ‘하할라크 산’으로 이해하는 것이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘레바논 평야 안’입니다. 히브리어는 넓은 골짜기나 평야를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הָהָר הֶחָלָק
  english_pob_choice: from Mount Halak
  chosen_korean: 하할라크 산에서부터
  alternatives_korean:
  - 매끈한 산에서부터
  - 할라크 산에서부터
  lexicon: HALOT
  rationale: 문맥상 지명으로 읽는 것이 자연스러워 영어 POB의 선택을 따라 음역했고, 의미역으로 풀어 쓴 대안도 가능하지만 경계 서술의 지명성에 덜 적합합니다.
- source_word: הָעֹלֶה שֵׂעִיר
  english_pob_choice: which rises toward Seir
  chosen_korean: 세일을 향해 올라가며
  alternatives_korean:
  - 세일 쪽으로 치솟는
  - 세일로 올라가는
  lexicon: HALOT
  rationale: עלה의 지형적 ‘올라감’을 살리되 한국어에서는 ‘향해 올라가며’가 경계 설명으로 가장 자연스럽습니다.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  english_pob_choice: in the Valley of Lebanon
  chosen_korean: 레바논 골짜기 안
  alternatives_korean:
  - 레바논 평원에
  - 레바논 계곡에
  lexicon: HALOT
  rationale: בִּקְעָה는 넓은 골짜기/평야를 가리킬 수 있어, 문맥상 ‘골짜기’가 무난하면서도 지형 감각을 유지합니다.
- source_word: וַיַּכֵּם וַיְמִיתֵם
  english_pob_choice: And he captured all their kings and struck them down and put them to death
  chosen_korean: 사로잡아 쳐서 죽였습니다
  alternatives_korean:
  - 사로잡아 쳐죽였습니다
  - 사로잡아 쳐서 목숨을 끊었습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동작을 한국어에서도 유지하되, ‘쳐서 죽였습니다’로 첫 타격과 최종 살해를 모두 드러내어 영어 POB의 구분을 반영했습니다.
theological_decisions:
- issue: 정복 서술의 폭력성 표현
  chosen_reading: ‘쳐서 죽였습니다’로 완화하지 않고 전투 결과의 직접성을 보존했습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘패배시켰습니다’
  rationale: 본문은 단순한 승리 선언이 아니라 포로화와 살해를 함께 말하므로, 현대적 완곡어보다 원문의 강도를 유지하는 것이 해석상 더 충실합니다.
  doctrine_reference: 서사 본문의 사실 진술을 보존하는 번역 원칙
