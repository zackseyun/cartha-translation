  source_fidelity: 원문의 기본 의미는 충실히 반영합니다. עִקֵּר는 말의 힘줄을 끊어 전투력을 무력화하는 행위로 정확히 옮겼고, שָׂרַף בָּאֵשׁ의 명시적 수단도 ‘불로 태웠습니다’에 보존되었습니다. 다만 ‘자기에게’는 문법적으로 가능하지만 이 문맥에서는 지시 대상이 여호수아임을 명확히 하는 ‘그에게’가 더 적절합니다.
  naturalness: ‘그들에게 행했습니다’는 현대 한국어에서 다소 어색하고, 뒤 문장을 별도로 시작하면 히브리어의 한 문장 안의 설명 관계가 약해집니다. ‘말씀하신 대로 행하여’로 연결하면 자연스럽고, 뒤따르는 두 행위가 그 말씀을 실행한 내용임이 분명해집니다.
  terminology: ‘야훼’는 제시된 번역 방침에 맞으며, ‘전차’, ‘힘줄을 끊고’, ‘불로 태웠습니다’도 적절합니다. 각주 대안의 ‘불구로 만들고’는 현대 한국어에서 포괄적이고 낙인적 뉘앙스가 있어, 의미 범위는 유지하되 더 중립적인 ‘절게 하고’로 고치는 것이 좋습니다.
