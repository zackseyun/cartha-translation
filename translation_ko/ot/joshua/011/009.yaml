    issue: 각주의 ‘불구로 만들고’ 표현
    rationale: 히브리어의 행위 결과를 지나치게 넓고 현대적으로 부적절한 표현으로 나타낼 수 있습니다. ‘절게 하고’는 대안적 의미를 자연스럽게 전달하며, 본문의 구체성은 각주 설명에서 유지할 수 있습니다.
