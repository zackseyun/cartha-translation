lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  english_pob_choice: did to them
  chosen_korean: 그들에게 행했습니다
  alternatives_korean:
  - 그들에게 했습니다
  - 그들과 관련하여 행했습니다
  lexicon: HALOT
  rationale: עשה + ל는 단순한 '하다'보다 대상에게 행한 조치를 가리키므로, 군사적 맥락에 맞게 '행했습니다'로 옮겼습니다.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  english_pob_choice: just as ... had told him
  chosen_korean: 야훼께서 자기에게 말씀하신 그대로
  alternatives_korean:
  - 야훼께서 자기에게 말씀하신 대로
  - 야훼께서 자기에게 말씀하신 것처럼
  lexicon: HALOT
  rationale: 비교의 힘을 살리면서도 이전에 주어진 신적 지시의 준수를 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: עִקֵּר
  english_pob_choice: hamstrung
  chosen_korean: 말의 힘줄을 끊고
  alternatives_korean:
  - 말을 불구로 만들고
  - 말의 다리를 절단하고
  lexicon: HALOT
  rationale: 히브리어는 가축의 힘줄을 끊어 무력화하는 구체적 행위를 가리키므로, 의미를 분명히 드러내는 표현을 택했습니다.
- source_word: שָׂרַף בָּאֵשׁ
  english_pob_choice: burned ... with fire
  chosen_korean: 불로 태웠습니다
  alternatives_korean:
  - 불에 태웠습니다
  - 불에 사르셨습니다
  lexicon: HALOT
  rationale: '''with fire''의 수단성을 한국어에서 자연스럽게 살리면서, 단순히 ''태웠다''로 약화되지 않도록 했습니다.'
