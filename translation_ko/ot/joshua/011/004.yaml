    reason: lexical_alternative
  - marker: b
    text: Literally 'a great people'; the phrase refers to a very large multitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 그들의 모든 진영이 함께 나왔습니다.[a] 그들은 바닷가의 모래처럼 수없이 많은 큰 무리였고,[b] 말과 병거도 매우 많았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַחֲנֵיהֶם은 문자적으로는 ‘그들의 진영들’이지만, 문맥상 군사 집단이나 그들의 편제를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘큰 백성’이라고 합니다. 뒤의 모래 비유는 그 수가 매우 많음을 설명합니다.
    reason: lexical_alternative
