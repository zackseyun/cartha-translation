source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
  footnotes:
  - marker: a
    text: Or 'their armies'; Hebrew 'their camps' can refer to military encampments and, by extension, the forces assembled in them.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a great people'; the phrase refers to a very large multitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들의 모든 진영과 함께 나왔습니다. 곧 큰 백성, 바닷가의 모래처럼 셀 수 없이 많았으며, 말과 병거도 매우 많았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַחֲנֵיהֶם은 문자적으로는 ‘그들의 진영들’이지만, 문맥상 군사 집단이나 그들의 편제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘큰 백성’이지만, 뒤의 모래 비유가 그 수적 많음을 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  english_pob_choice: They came out
  chosen_korean: 나왔습니다
  alternatives_korean:
  - 나갔습니다
  - 출정했습니다
  lexicon: HALOT
  rationale: 출발과 이동을 뜻하는 기본 동사를 자연스러운 서술체로 옮겼으며, 군사적 뉘앙스를 과도하게 덧붙이지 않았습니다.
- source_word: מַחֲנֵיהֶם
  english_pob_choice: their camps
  chosen_korean: 그들의 모든 진영
  alternatives_korean:
  - 그들의 모든 군대
  - 그들의 모든 진지
  lexicon: HALOT
  rationale: מַחֲנֶה의 기본 이미지인 ‘진영’을 살리되, 여기서는 모여 있는 군사 집단을 가리키므로 문맥상 ‘모든’으로 전체성을 분명히 했습니다.
- source_word: עַם רָב + כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  english_pob_choice: a great people, as numerous as the sand that is on the seashore
  chosen_korean: 큰 백성, 바닷가의 모래처럼 셀 수 없이 많았으며
  alternatives_korean:
  - 큰 백성, 바닷가의 모래처럼 매우 많았으며
  - 큰 무리, 바닷가의 모래처럼 셀 수 없이 많았으며
  lexicon: HALOT
  rationale: עַם רָב의 집합 명사를 ‘큰 백성’으로 살리고, לָרֹב가 강조하는 수적 과잉은 한국어 관용에 맞게 ‘셀 수 없이 많다’로 옮겼습니다.
- source_word: סוּס וָרֶכֶב רַב מְאֹד
  english_pob_choice: with very many horses and chariots
  chosen_korean: 말과 병거도 매우 많았습니다
  alternatives_korean:
  - 말과 병거가 매우 많았습니다
  - 말과 전차도 매우 많았습니다
  lexicon: HALOT
  rationale: סוּס은 군사용 집합명사로서 ‘말’이 자연스럽고, רֶכֶב은 여기서 전차보다 성경적 군사 장비를 가리키는 ‘병거’가 더 직접적입니다.
theological_decisions:
- issue: 전쟁 서술의 수량 과장 표현
  chosen_reading: 히브리어의 과장법을 그대로 살려 적의 규모와 군사력의 압도감을 드러냈습니다.
  alternative_readings:
  - 수적으로 많다는 뜻만 완화해서 표현
  - 비유적 이미지를 줄이고 정보 전달 위주로 처리
  rationale: 본문은 모래 비유와 ‘매우 많다’를 통해 실제 숫자보다 압도적 규모를 강조하므로, 이를 약화하지 않고 전달하는 것이 서술 의도에 맞습니다.
  doctrine_reference: 본문 문맥 및 히브리어 수사법
