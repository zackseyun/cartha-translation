revisions:
- from: 여호수아는 이 왕들의 모든 성읍과 그 모든 왕들을 사로잡아 칼날로 쳐 죽이고, 그들을 진멸하였으니, 이는 모세, 곧 야훼의 종이 명한 바와 같았습니다.[a]
  to: 여호수아는 이 왕들의 모든 성읍을 점령하고 그들의 모든 왕을 사로잡아, 칼날로 그들을 쳐 죽였으며 그들을 진멸했습니다. 이는 야훼의 종 모세가 명령한 대로였습니다.[a]
  rationale: 수정문은 성읍의 점령과 왕들의 사로잡음을 한국어에서 자연스럽게 구분하면서도, 원문의 포괄적 목적어 구조를 보존합니다. ‘칼날로’는 לְפִי חֶרֶב의 구체적 이미지를 유지하고, ‘진멸했습니다’는 חרם의 압축된 기술어적 성격을 보존합니다. 마지막 문장은 모세의 선행 명령에 따른 행위라는 원문의 관계를 명료하게 옮겼습니다. 각주는 חרם을 ‘저주’로 한정하지 않고 바침과 돌이킬 수 없는 멸절이라는 기술적 의미를 설명하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
