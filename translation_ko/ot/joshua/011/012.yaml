id: JOS.11.12
reference: Joshua 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
  footnotes:
  - marker: a
    text: Or, 'he utterly destroyed them'; the Hebrew uses the technical verb for placing people or things under the ban, that is, devoting them irrevocably to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 이 왕들의 모든 성읍과 그 모든 왕들을 사로잡아 칼날로 쳐 죽이고, 그들을 진멸하였으니, 이는 모세, 곧 야훼의 종이 명한 바와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들을 완전히 멸하셨다’; 히브리어는 사람이나 사물을 저주 아래 두어 돌이킬 수 없이 멸하는 기술적 동사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  english_pob_choice: the cities of these kings
  chosen_korean: 이 왕들의 모든 성읍
  alternatives_korean:
  - 이 왕들의 성읍들
  - 이 왕들의 도시들
  lexicon: HALOT
  rationale: 히브리어는 ‘이 왕들에 속한 성읍들’이라는 소유·관계 구조이므로, 이를 자연스럽게 드러내는 ‘이 왕들의 모든 성읍’이 적절합니다.
- source_word: לָכַד
  english_pob_choice: captured
  chosen_korean: 사로잡아
  alternatives_korean:
  - 점령하여
  - 붙잡아
  lexicon: HALOT
  rationale: 전투 맥락에서 העיר를 취하는 행위는 단순한 ‘취하다’보다 ‘사로잡다’가 결과를 더 분명히 보여 줍니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로 쳐 죽이고
  alternatives_korean:
  - 칼날로
  - 칼로
  lexicon: HALOT
  rationale: 관용구의 직역을 그대로 유지하기보다, 영어 POB가 살린 ‘sword’의 치명적 폭력을 한국어로 자연스럽게 드러내는 표현을 택했습니다.
- source_word: הֶחֱרִים
  english_pob_choice: He devoted them to destruction
  chosen_korean: 진멸하였으니
  alternatives_korean:
  - 온전히 멸하였으니
  - 멸망에 넘기셨으니
  lexicon: HALOT
  rationale: 히브리어 חֵרֶם의 기술적 용법을 반영하면서도, 한국어 독자가 그 종교적·법적 강도를 즉시 이해할 수 있는 ‘진멸하다’를 사용했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 섬김자
  - 야훼의 종
  lexicon: HALOT
  rationale: 여기서는 모세의 공적 호칭이므로 ‘종’이 가장 적합하며, 영어 POB의 야훼 표기를 따라 고유명칭을 유지했습니다.
theological_decisions:
- issue: חרם(진멸) 언어의 번역
  chosen_reading: 진멸하였으니
  alternative_readings:
  - 완전히 멸하였으니
  - 저주 아래 두었으니
  rationale: 본문은 단순한 전쟁 승리가 아니라, 하나님께 바쳐 완전 제거하는 חרם의 의미를 담고 있으므로 그 신학적 무게를 보존해야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5; contested terms principle
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יְהוָה가 직접 나오므로, POB 원칙에 따라 신적 고유명칭을 ‘야훼’로 옮겨 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
