base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the people.' Hebrew 'every man' uses אָדָם here for the human population in contrast with the livestock.
    reason: lexical_alternative
  - marker: c
    text: Literally 'with the mouth of the sword,' a Hebrew idiom meaning 'with the edge of the sword.'
    reason: lexical_alternative
  - marker: d
    text: Or 'they left no one breathing' / 'they left alive nothing that breathed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 이 성읍들[a]의 모든 전리품과 가축을 노략질하여 자기 것으로 삼았습니다. 그러나 그들은 모든 사람[c]을 칼날[b]로 쳐서 그들을 멸하기까지 하였으며, 숨 쉬는 것은 하나도 남기지 않았습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 지시 표현은 앞서 언급된 성읍들을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘칼의 입으로’입니다. 이는 ‘칼날로’라는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 사람’은 가축과 대비되는 인간 주민 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: ‘숨 쉬는 것은 하나도 남기지 않았다’는 살아남은 자가 없었다는 뜻의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  english_pob_choice: spoil
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 노략물
  lexicon: HALOT
  rationale: 전쟁에서 빼앗은 재물을 가리키므로, 현대 한국어에서 자연스럽고 군사적 맥락을 잘 드러내는 ‘전리품’을 택했습니다.
- source_word: הֶעָרִים הָאֵלֶּה
  english_pob_choice: these cities
  chosen_korean: 이 성읍들
  alternatives_korean:
  - 이 도시들
  - 저 성읍들
  lexicon: HALOT
  rationale: 바로 앞 문맥의 성읍들을 가리키는 지시어이므로 ‘이’가 적절하고, 히브리어 עיר의 성격을 살려 ‘성읍들’로 옮겼습니다.
- source_word: בָּזְזוּ לָהֶם
  english_pob_choice: plundered for themselves
  chosen_korean: 자신들을 위해 노략질하였습니다
  alternatives_korean:
  - 자기들을 위하여 노획하였습니다
  - 자기 몫으로 빼앗았습니다
  lexicon: HALOT
  rationale: 동사 자체의 약탈 행위와 लाभ/귀속의 의미를 함께 살리기 위해 ‘자신들을 위해’와 ‘노략질하였습니다’를 결합했습니다.
- source_word: כָּל הָאָדָם
  english_pob_choice: all the people
  chosen_korean: 사람은 모두
  alternatives_korean:
  - 모든 사람을
  - 백성 모두를
  lexicon: HALOT
  rationale: 가축과 대비되는 인간 집단을 가리키므로 ‘사람’으로 옮기되, כָּל의 총괄성을 살려 ‘모두’를 붙였습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 입으로
  - 칼끝으로
  lexicon: HALOT
  rationale: 직역의 낯선 ‘칼의 입’ 대신 관용구의 뜻을 드러내는 동시에 이미지도 유지하는 ‘칼날로’를 선택했습니다.
- source_word: עַד הִשְׁמִדָם אֹתָם
  english_pob_choice: until they had destroyed them
  chosen_korean: 그들을 멸하기까지 하였고
  alternatives_korean:
  - 그들을 멸절하기까지 하였고
  - 그들을 완전히 멸하기까지 하였고
  lexicon: HALOT
  rationale: שׁמד의 핵심 의미인 파괴/멸망을 간결하게 반영했습니다. ‘멸하다’는 과도한 해설 없이 결과를 직접 드러냅니다.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  english_pob_choice: They left no breathing thing
  chosen_korean: 숨 쉬는 것은 하나도 남기지 않았습니다
  alternatives_korean:
  - 숨 쉬는 생물은 하나도 남기지 않았습니다
  - 호흡하는 것은 아무것도 남기지 않았습니다
  lexicon: HALOT
  rationale: ‘נְשָׁמָה’의 문자적 ‘숨/호흡’ 이미지를 살리면서 한국어로 자연스럽게 읽히도록 했습니다.
