revisions:
- from: 이 성읍들의 모든 전리품과 가축은 이스라엘 자손이 자신들을 위해 노략질하였습니다. 다만 사람은 모두 칼날로 쳐서 그들을 멸하기까지 하였고, 숨 쉬는 것은 하나도 남기지 않았습니다.[a][b][c][d]
  to: 이스라엘 자손은 이 성읍들[a]의 모든 전리품과 가축을 노략질하여 자기 것으로 삼았습니다. 그러나 그들은 모든 사람[c]을 칼날[b]로 쳐서 그들을 멸하기까지 하였으며, 숨 쉬는 것은 하나도 남기지 않았습니다.[d]
  rationale: 문장의 능동 주어와 목적어를 분명히 하여 한국어 문법과 흐름을 바로잡고, לָהֶם의 ‘자기들을 위하여/자기 몫으로’라는 뉘앙스를 ‘자기 것으로 삼았습니다’로 자연스럽게 반영했습니다. 인간 주민 전체를 칼날로 쳐 멸할 때까지 했다는 원문의 반복적·철저한 진술과, 숨 쉬는 존재를 남기지 않았다는 결말도 유지했습니다. 각주 d의 혼입된 비한국어 표현을 제거하고 표지를 해당 어구에 배치했습니다.
