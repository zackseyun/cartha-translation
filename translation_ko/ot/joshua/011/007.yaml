base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
  footnotes:
  - marker: a
    text: Or 'the people of war,' traditionally 'the men of war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아와 그와 함께한 모든 전투원은 메롬 물가에서 그들에게 갑자기 들이닥쳐 그들을 덮쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 진군하여 왔습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 잇되, 단순 이동보다 적대적 접근의 긴장을 유지하기 위해 ‘와서’로 처리했습니다.
- source_word: עַם הַמִּלְחָמָה
  english_pob_choice: the people of war
  chosen_korean: 모든 전투 사람들
  alternatives_korean:
  - 모든 전쟁의 백성
  - 모든 전투의 백성
  - 모든 군사들
  lexicon: HALOT
  rationale: 히브리어의 집합명사 עַם을 살리면서도 남성명사로만 좁히지 않기 위해 ‘전투 사람들’로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들을 치러
  alternatives_korean:
  - 그들을 향해
  - 그들 위에
  - 그들에게 대항하여
  lexicon: HALOT
  rationale: 전쟁 맥락의 על는 단순한 방향보다 ‘대항하여/치러’의 공격성을 띠므로, 한국어 동사구로 그 의미를 분명히 했습니다.
- source_word: וַיִּפְּלוּ בָּהֶם
  english_pob_choice: fell upon them
  chosen_korean: 그들에게 달려들었습니다
  alternatives_korean:
  - 그들 위에 엎드렸습니다
  - 그들을 덮쳤습니다
  - 그들에게 달려들었습니다
  lexicon: HALOT
  rationale: נפל + ב의 관용적 전투 용법을 한국어에서 가장 생생하게 살리기 위해 ‘달려들었습니다’를 택했습니다.
theological_decisions:
- issue: 전투 서술의 직설성 유지
  chosen_reading: 본문의 급습과 돌격 이미지를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘공격했습니다’로 정리하는 번역
  - 전투 이미지를 약화한 ‘맞섰습니다’로 번역
  rationale: 히브리어 원문은 매복이나 기습의 급박함을 강조하므로, 한국어에서도 그 긴박한 군사적 움직임을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 맥락 보존 원칙
- issue: עַם הַמִּלְחָמָה의 집합적 표현 처리
  chosen_reading: ‘전투 사람들’로 옮겨 집합성과 비특정 성별을 함께 살렸습니다.
  alternative_readings:
  - 관용적이지만 남성 한정으로 읽히기 쉬운 ‘군사들’
  - 전통적이지만 직역성이 낮은 ‘전쟁의 사람들’
  rationale: 원문은 개인 남성 집단이 아니라 전투 집단을 가리키므로, 한국어에서도 집합적 의미를 유지하는 표현이 필요합니다.
  doctrine_reference: 번역의 명시성 원칙
