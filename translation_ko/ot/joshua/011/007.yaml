- from: 여호수아와 그와 함께한 모든 전투 사람들이 갑자기 메롬 물가에서 그들을 치러 와서 그들에게 달려들었습니다.
  to: 여호수아와 그와 함께한 모든 전투원은 메롬 물가에서 그들에게 갑자기 들이닥쳐 그들을 덮쳤습니다.
  rationale: The revision preserves the source’s collective fighting group, sudden arrival at the waters of Merom, and subsequent assault. It replaces unnatural and repetitive Korean with idiomatic modern formal-polite wording, without adding interpretive details or doctrinal framing.
