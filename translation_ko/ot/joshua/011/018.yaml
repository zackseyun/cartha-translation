base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/018.yaml
  text: Joshua made war against all these kings for many days[a].
  footnotes:
  - marker: a
    text: Or 'Joshua waged war against all these kings for a long time.' The Hebrew literally says 'many days' and uses the idiom 'made war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 이 모든 왕들과 오랫동안 전쟁을 치렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호수아가 오랫동안 이 모든 왕들과 전쟁을 벌였다.’ 히브리어는 문자적으로 ‘많은 날들’을 뜻하며, ‘전쟁을 하다/치르다’라는 관용구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 오랫동안
  alternatives_korean:
  - 여러 날 동안
  - 많은 날 동안
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘many days’보다 한국어에서는 기간의 장기성을 자연스럽게 드러내는 ‘오랫동안’이 더 읽기 쉽고, 문맥의 의미도 잘 보존합니다.
- source_word: עָשָׂה ... מִלְחָמָה
  english_pob_choice: made war
  chosen_korean: 전쟁을 치렀습니다
  alternatives_korean:
  - 전쟁을 했습니다
  - 전쟁을 벌였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘전쟁을 하다/치르다’의 의미를 살리되, 현대 한국어에서 자연스럽고 공적인 문체로 맞추기 위해 ‘전쟁을 치렀습니다’를 선택했습니다.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  english_pob_choice: against all these kings
  chosen_korean: 이 모든 왕들과
  alternatives_korean:
  - 이 모든 왕들에 대해
  - 이 모든 왕들을 상대로
  lexicon: HALOT
  rationale: 동사 ‘전쟁을 치르다’와 결합할 때 한국어는 목적어에 직접 대응시키는 방식이 자연스러워, 적대 관계를 ‘-와’로 표현했습니다.
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 호세아
  lexicon: 표준 성서 고유명사
  rationale: 한국어 성서에서 널리 정착된 고유명사 형태를 따랐습니다.
theological_decisions:
- issue: 전쟁 서술의 동사 선택
  chosen_reading: ‘전쟁을 치렀습니다’로, 단순한 싸움보다 장기간의 군사 행동을 드러내었습니다.
  alternative_readings:
  - 전쟁을 했습니다
  - 전쟁을 벌였습니다
  rationale: 본문의 ‘many days’와 결합된 군사적 지속성을 살리기 위해, 결과보다 과정을 강조하는 표현을 택했습니다.
  doctrine_reference: 본문의 서술적 역사 진술
- issue: 야훼 표기 여부
  chosen_reading: 이 절에는 יהוה가 직접 나타나지 않으므로 표기하지 않았습니다.
  alternative_readings:
  - 본문에 ‘야훼’를 삽입하는 방식
  rationale: 원문에 없는 신명칭을 추가하지 않고, 히브리어 본문의 표면형을 그대로 반영했습니다.
  doctrine_reference: 본문 충실성 원칙
