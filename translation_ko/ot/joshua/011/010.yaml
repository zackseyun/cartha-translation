base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
  footnotes:
  - marker: a
    text: Or 'returned.' The Hebrew verb can be rendered either way; 'turned back' was chosen to preserve the directional nuance of the campaign movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'was chief over all these kingdoms.' The Hebrew literally says 'was the head of all these kingdoms,' using a metaphor for primacy.
    reason: lexical_alternative
  - marker: c
    text: '''Struck ... with the sword'' is a restrained rendering of the Hebrew. In context the phrase likely implies killing, but the verb itself is literally ''struck.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아는 되돌아가[a] 하솔을 점령하고, 그 왕을 칼로 쳤습니다.[c] 하솔은 옛날에 이 모든 왕국의 우두머리였기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아왔습니다’. 히브리어 동사는 ‘되돌아가다’ 또는 ‘돌아오다’로 옮길 수 있습니다. 여기서는 전투 중 이전 방향으로 되돌아가는 움직임을 나타내기 위해 ‘되돌아가’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 모든 왕국의 머리였습니다’. 히브리어는 문자적으로 ‘이 모든 왕국의 머리’라고 말하며, 우위 또는 중심적 지위를 가리키는 은유입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘칼로 쳤습니다’는 히브리어의 절제된 표현을 따른 번역입니다. 문맥에서는 죽임을 뜻하는 것으로 보이지만, 동사 자체는 문자적으로 ‘치다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: turned back
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아갔습니다
  - 되돌아갔습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 귀환보다 전투 진행 중 방향을 돌려 다시 향하는 움직임을 살려야 하므로, '돌아서서'가 영어 POB의 'turned back'을 가장 자연스럽게 반영합니다.
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 사로잡고
  - 빼앗고
  lexicon: HALOT
  rationale: 성읍을 군사적으로 '붙들어 차지하다'는 뜻이므로, 현대 한국어에서 전투 맥락에 자연스러운 '점령하다'를 선택했습니다.
- source_word: הִכָּה בֶחָרֶב
  english_pob_choice: struck its king with the sword
  chosen_korean: 그 왕을 칼로 쳤습니다
  alternatives_korean:
  - 그 왕을 칼로 쳐 죽였습니다
  - 그 왕을 칼에 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '치다'이며, 영어 POB처럼 직접적 살해어를 과도하게 보태지 않고 절제된 표현을 유지했습니다.
- source_word: רֹאשׁ כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  english_pob_choice: the head of all these kingdoms
  chosen_korean: 이 모든 왕국의 머리
  alternatives_korean:
  - 이 모든 왕국의 우두머리
  - 이 모든 왕국의 지도자
  lexicon: HALOT
  rationale: '''ראשׁ''의 비유를 살려 ''머리''로 옮겼습니다. ''우두머리''나 ''지도자''는 의미를 풀어 쓰지만, 원문 은유를 덜 직접적으로 보존합니다.'
theological_decisions:
- issue: 하솔의 지위 설명을 은유적으로 유지할지 여부
  chosen_reading: '''머리''를 직역해 하솔의 우위와 중심성을 은유로 남겼습니다.'
  alternative_readings:
  - '''우두머리''로 의역하여 의미를 풀어 쓰기'
  - '''수장''으로 바꾸어 위계를 명시하기'
  rationale: 본문은 하솔의 정치·군사적 우월성을 '머리'라는 은유로 말하므로, 그 이미지를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 원문 은유 보존 원칙
