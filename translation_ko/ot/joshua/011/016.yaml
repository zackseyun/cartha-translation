reference: Joshua 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
  footnotes:
  - marker: a
    text: Or 'the Shephelah' for 'the lowland' (also later in the verse). The Hebrew term refers to the low hill region between the central highlands and the coastal plain.
    reason: lexical_alternative
  - marker: b
    text: '''The Arabah'' is a regional geographic term; some render it more interpretively as ''the Jordan Valley'' or ''the desert plain.'''
    reason: lexical_alternative
  - marker: c
    text: '''The land of Goshen'' here refers to a region in Canaan, not necessarily the Goshen in Egypt.'
    reason: cultural_note
translation:
  language: ko
  text: 그래서 여호수아는 이 온 땅을 차지했습니다. 곧 산지[a], 온 네겝, 고센 온 땅, 저지대, 아라바, 이스라엘의 산지[c][b], 그리고 그 저지대입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스펠라’. 여기서는 히브리어 שְׁפֵלָה의 지형적 의미를 한국어로 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아라바’는 지역 지명입니다. 문맥에 따라 ‘요단 계곡’ 또는 ‘사막 평원’으로 더 설명적으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고센의 땅’은 여기서 가나안 내의 한 지역을 가리키며, 반드시 이집트의 고센과 동일시되지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 차지했습니다
  alternatives_korean:
  - 가졌습니다
  - 취했습니다
  - 점령했습니다
  lexicon: HALOT
  rationale: 전투적 정복 문맥에서 단순한 ‘가졌다’보다 소유·장악의 결과를 분명히 드러내면서도, 과도하게 군사화된 ‘점령했습니다’보다 원문 동사를 무리 없이 옮깁니다.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  english_pob_choice: all this land
  chosen_korean: 이 온 땅
  alternatives_korean:
  - 이 모든 땅
  - 이 모든 지역
  lexicon: HALOT
  rationale: 지시대명사 ‘이’와 총괄성 ‘온’을 함께 살려 원문의 범위를 자연스럽게 전달합니다.
- source_word: הָהָר
  english_pob_choice: the hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산악 지대
  - 산지 지역
  - 산
  lexicon: HALOT
  rationale: 여호수아서에서 지역명으로 쓰인 הָהָר의 지리적 의미를 살려, 한국어 성경에서도 익숙한 지역 용어인 ‘산지’를 택했습니다.
- source_word: הַשְּׁפֵלָה / וּשְׁפֵלָתוֹ
  english_pob_choice: the lowland / and its lowland
  chosen_korean: 저지대 / 그 저지대
  alternatives_korean:
  - 스펠라
  - 그 평지
  - 그 낮은 땅
  lexicon: HALOT
  rationale: שְׁפֵלָה는 문자적으로 낮은 지역을 가리키므로, 독자가 곧바로 뜻을 알 수 있는 ‘저지대’를 사용했고, 뒤의 소유 대명사는 ‘그’로 받아 앞의 ‘이스라엘의 산지’와 짝을 이루게 했습니다.
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 요단 계곡
  - 사막 평원
  lexicon: HALOT
  rationale: 여기서는 해석어보다 고유 지리명으로 기능하므로, 원지명 음역 ‘아라바’를 유지했습니다.
theological_decisions:
- issue: 지리 목록의 번역에서 지역명과 일반 지형어의 구분
  chosen_reading: 고유 지역명은 음역이나 관용 지명으로, 일반 지형은 한국어 지리어로 구분해 옮겼습니다.
  alternative_readings:
  - 모든 항목을 음역으로 통일하는 방식
  - 모든 항목을 설명적으로 풀어 쓰는 방식
  rationale: 본문은 정복 범위를 지역 목록으로 제시하므로, 독자가 지역명과 지형의 대비를 구별할 수 있어야 합니다. 따라서 ‘네겝/아라바’는 고유 지명성을 살리고, ‘산지/저지대’는 뜻이 바로 드러나는 한국어를 사용했습니다.
  doctrine_reference: 성경 지리·서술의 명료성
- issue: 이스라엘의 산지 뒤의 ‘그 저지대’
  chosen_reading: 후행 대명사 ‘그’를 유지해 앞의 ‘이스라엘의 산지’와 연결했습니다.
  alternative_readings:
  - ‘이스라엘의 산지와 그 주변 저지대’로 풀어 쓰는 방식
  - 단순히 ‘저지대’로 반복 없이 번역하는 방식
  rationale: 원문은 소유 대명사로 대응을 만들며, 산지와 저지대의 대조를 강조합니다. 이를 보존하면 여호수아가 차지한 영역의 입체성이 더 분명해집니다.
  doctrine_reference: 본문의 수사 구조 보존
