  rationale: 여호수아서에서 지역명으로 쓰인 הָהָר의 지리적 의미를 살려, 한국어 성경에서도 익숙한 지역 용어인 ‘산지’를 택했습니다.
- source_word: הַשְּׁפֵלָה / וּשְׁפֵלָתוֹ
  english_pob_choice: the lowland / and its lowland
  chosen_korean: 저지대 / 그 저지대
  alternatives_korean:
