id: JOS.11.2
reference: Joshua 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
  footnotes:
  - marker: a
    text: Or 'in the districts of Dor,' 'in the region of Dor,' or 'on the slopes of Dor.' The Hebrew term is uncommon and its precise topographical sense is debated.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the sea'; in Hebrew geographic usage this commonly means 'on the west.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 북쪽에 있는 왕들, 곧 산지와 아라바, 곧 기네롯 남쪽, 저지대, 그리고 도르의 높은 지역이 서쪽에 있는 왕들에게도 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도르의 높은 지역’은 히브리어 נָפוֹת의 정확한 지형 의미가 분명하지 않아, ‘도르의 지역들’, ‘도르의 경사지’, ‘도르의 구역들’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 ‘바다’는 지리적 용법으로 ‘서쪽’을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  english_pob_choice: and to
  chosen_korean: 그리고 …에게도
  alternatives_korean:
  - 그리고 …에게
  - 또 …에게
  lexicon: HALOT
  rationale: 이전 절의 명령 대상을 이어 주는 접속과 전치를 한국어 자연문으로 살리기 위해 ‘그리고 …에게도’로 옮겼습니다.
- source_word: הַמְּלָכִים
  english_pob_choice: the kings
  chosen_korean: 왕들
  alternatives_korean:
  - 통치자들
  - 군주들
  lexicon: HALOT
  rationale: מֶלֶךְ의 기본 의미를 가장 직접적으로 반영하는 표준어는 ‘왕들’입니다.
- source_word: בָּהָר
  english_pob_choice: in the hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산악 지대
  - 언덕 지역
  lexicon: HALOT
  rationale: 여호수아의 지리 문맥에서 הַר는 단일 산이 아니라 지역 범주의 산지/구릉 지대를 가리키므로 ‘산지’가 적절합니다.
- source_word: וּבָעֲרָבָה
  english_pob_choice: in the Arabah
  chosen_korean: 아라바
  alternatives_korean:
  - 평야
  - 열곡
  lexicon: HALOT
  rationale: עֲרָבָה는 고유 지리명으로 굳어진 용례이므로 일반어로 풀지 않고 ‘아라바’로 유지했습니다.
- source_word: נֶגֶב כִּנֲרוֹת
  english_pob_choice: south of Kinneroth
  chosen_korean: 기네롯 남쪽
  alternatives_korean:
  - 기네롯의 남쪽
  - 기네롯 남부
  lexicon: HALOT
  rationale: נֶגֶב이 כאן에서는 기술 지역명 ‘네게브’가 아니라 방향 부사적 의미이므로 ‘남쪽’으로 풀어 Kinneroth와의 관계를 분명히 했습니다.
- source_word: וּבְנָפוֹת דּוֹר
  english_pob_choice: in the heights of Dor
  chosen_korean: 도르의 높은 지역
  alternatives_korean:
  - 도르의 고지대
  - 도르의 지역들
  lexicon: HALOT
  rationale: נָפוֹת는 지형적으로 논란이 있는 표현이라, POB의 ‘heights of Dor’ 취지를 살리되 한국어에서는 ‘높은 지역’으로 비교적 중립적으로 옮겼습니다.
- source_word: מִיָּם
  english_pob_choice: toward the west
  chosen_korean: 서쪽에 있는
  alternatives_korean:
  - 바다 쪽의
  - 서쪽을 향한
  lexicon: HALOT
  rationale: 히브리어에서 ‘바다’는 지리적 방향으로 서쪽을 가리키는 경우가 많으므로, 목록의 공간 배치를 살려 ‘서쪽에 있는’으로 번역했습니다.
theological_decisions:
- issue: 지리 목록의 반복 구조와 방향 표현
  chosen_reading: 히브리어의 연속된 전치사구를 한국어에서도 쉼표로 나열해, 지역 범주들의 집합을 읽는 독자가 즉시 파악하도록 했습니다.
  alternative_readings:
  - 문장형으로 풀어 설명하는 방식
  - 각 지명을 독립 절처럼 분리하는 방식
  rationale: 본문은 서술보다 열거가 핵심이므로, 간결한 목록 구조를 유지하는 것이 원문의 힘과 리듬을 더 잘 전달합니다.
  doctrine_reference: '해석 원칙: 본문 장르 존중 및 지리 정보의 투명한 재현'
