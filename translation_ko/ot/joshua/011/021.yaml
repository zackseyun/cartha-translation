  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
  footnotes:
  - marker: a
    text: Or, more formally, 'put them under the ban.' The Hebrew verb carries the sense of devoting persons or things to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 와서 헤브론과 데빌과 아납과 유다의 온 산지와 이스라엘의 온 산지에서 아낙 사람들을 끊어 버렸습니다. 여호수아가 그들과 그들의 도시들을 함께 진멸하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, '그들을 진멸의 금령 아래 두었다.' 히브리어 동사는 사람이나 물건을 멸망에 바치는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 오셨습니다
  - 들어왔습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 잇는 동사로, 여호수아의 이동을 과장하지 않으면서 사건 전개를 유지합니다.
- source_word: וַיַּכְרֵת אֶת הָעֲנָקִים
  english_pob_choice: cut off the Anakim
  chosen_korean: 아낙 사람들을 끊어 버렸습니다
  alternatives_korean:
  - 아낙 사람들을 잘라 버렸습니다
  - 아낙 사람들을 멸절시켰습니다
  lexicon: HALOT
  rationale: כרת의 핵심 이미지인 '끊다/잘라 내다'를 살리되, 한국어에서는 대상 집단의 제거를 뜻하는 관용으로 풀었습니다.
- source_word: מִן הָהָר ... וּמִכֹּל הַר יְהוּדָה וּמִכֹּל הַר יִשְׂרָאֵל
  english_pob_choice: from the hill country ... from all the hill country of Judah and from all the hill country of Israel
  chosen_korean: 헤브론과 데빌과 아납과 유다의 온 산지와 이스라엘의 온 산지에서
  alternatives_korean:
  - 산지에서
  - 산지 전체에서
  lexicon: HALOT
  rationale: הָהָר와 연속된 산지 표현을 한국어 성경 관용의 '산지'로 옮기되, 반복된 מן을 목록형으로 자연스럽게 정리했습니다.
- source_word: הֶחֱרִימָם
  english_pob_choice: devoted them to destruction
  chosen_korean: 진멸하였습니다
  alternatives_korean:
  - 멸하였습니다
  - 저주 아래 두었습니다
  lexicon: HALOT
  rationale: חרם의 전쟁-언약적 용례를 한국어에서 가장 직접적으로 드러내는 표준 성경어가 '진멸하다'이므로 이를 채택했습니다.
theological_decisions:
- issue: כרת와 חרם의 구분
  chosen_reading: 첫 절반은 '끊어 버렸습니다'로 כרת의 '잘라 내다/제거하다'를, 후반은 '진멸하였습니다'로 חרם의 의례적·전쟁적 소멸을 구분했습니다.
  alternative_readings:
  - 아낙 사람들을 멸하셨습니다
  - 아낙 사람들을 저주 아래 두셨습니다
  rationale: 원문은 두 동사를 연속 사용하여 제거 행위와 진멸 행위를 구별합니다. 한국어도 같은 구분을 남기는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
