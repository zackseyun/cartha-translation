- from: 그때 여호수아가 와서 헤브론과 데빌과 아납과 유다의 온 산지와 이스라엘의 온 산지에서 아낙 사람들을 끊어 버렸습니다. 여호수아가 그들과 그들의 도시들을 함께 진멸하였습니다.[a]
  to: 그때 여호수아가 와서 산지에서, 곧 헤브론에서, 드빌에서, 아납에서, 유다의 모든 산지에서, 그리고 이스라엘의 모든 산지에서 아낙 족속을 끊어 버렸습니다. 여호수아가 그들을 그들의 성읍들과 함께 진멸하였습니다.[a]
  rationale: 드빌의 오표기를 바로잡고, 원문의 반복된 전치사구가 나타내는 장소 열거를 보존했습니다. כרת는 '끊어 버렸습니다', החרים은 '진멸하였습니다'로 옮겨 두 동사의 의미상 구별을 유지했습니다. 각주는 불명확한 '금령' 표현 대신 חרם의 핵심 의미인 '진멸에 바치다'를 제시했습니다.
