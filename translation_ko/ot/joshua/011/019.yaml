  source_fidelity: 첫 절의 ‘이스라엘 자손과 화친한 성읍은 하나도 없었습니다’와 예외절은 히브리어의 부정+예외 구조와 הִשְׁלִימָה의 외교적 의미를 충실히 반영합니다. 그러나 ‘그 모든 것을 빼앗았습니다’는 הַכֹּל의 문맥상 대상(앞서 언급된 성읍들)을 한국어에서 부자연스럽게 사물화하며, לָקַח의 비교적 넓은 의미보다 강한 ‘빼앗다’를 택했습니다. ‘모두 차지했습니다’가 군사 문맥과 원문의 절제된 어휘를 더 잘 보존합니다.
