  terminology: ‘이스라엘 자손’, ‘성읍’, ‘히위 사람들’, ‘기브온’은 적절합니다. ‘화친’은 항복이라는 과도한 해석을 피합니다. לָקַח에는 ‘빼앗다’보다 ‘차지하다’가 적절하며, ‘전쟁으로’는 בַּמִּלְחָמָה의 수단·상황을 자연스럽게 나타냅니다.
