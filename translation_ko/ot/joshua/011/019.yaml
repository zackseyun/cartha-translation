  edition: WLC
  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
  footnotes:
  - marker: a
    text: Or 'made peace with the Israelites.' The Hebrew more literally says 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'captured all in war.' The Hebrew says literally, 'they took all in battle/war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손과 화친한 성읍은 하나도 없었습니다. 다만 기브온에 사는 히위 사람들만 예외였습니다. 그들은 전쟁에서 그 모든 것을 빼앗았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현을 따른 것입니다. 한국어로는 ‘이스라엘 사람들’이라고도 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빼앗았습니다’는 군사적 맥락을 분명히 드러낸 표현입니다. 히브리어는 문자적으로 ‘그들은 모두를 취했습니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל
  english_pob_choice: There was not a city that made peace with the sons of Israel
  chosen_korean: 이스라엘 자손과 화친한 성읍은 하나도 없었습니다
  alternatives_korean:
  - 이스라엘 자손과 화평을 맺은 성읍은 하나도 없었습니다
  - 이스라엘 자손에게 항복한 성읍은 하나도 없었습니다
  lexicon: HALOT
  rationale: הִשְׁלִים의 외교적 의미를 살려 ‘화친하다’로 옮겼고, 부정문 구조는 한국어에서 자연스러운 ‘하나도 없었습니다’로 처리했습니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֔ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어 성경에서 자연스러운 관용인 ‘이스라엘 자손’을 사용했습니다.
- source_word: הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן
  english_pob_choice: the Hivites living in Gibeon
  chosen_korean: 기브온에 사는 히위 사람들
  alternatives_korean:
  - 기브온에 거주하는 히위 사람들
  - 기브온에 살던 히위 사람들
  lexicon: HALOT
  rationale: יֹשְׁבֵי의 현재적 주거 의미를 살려 ‘사는’으로 옮겼고, 민족명은 한국어 관용에 맞게 ‘히위 사람들’로 처리했습니다.
- source_word: אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה
  english_pob_choice: they took all of them in battle
  chosen_korean: 그들은 전쟁에서 그 모든 것을 빼앗았습니다
  alternatives_korean:
  - 그들은 전투에서 그들을 모두 빼앗았습니다
  - 그들은 싸움에서 그 모든 것을 취했습니다
  lexicon: HALOT
  rationale: לָקַח은 기본적으로 ‘취하다/가져가다’이지만 군사 맥락에서는 한국어로 ‘빼앗다’가 결과를 가장 분명히 드러냅니다. ‘전쟁에서’는 בַמִּלְחָמָה의 상황을 자연스럽게 반영합니다.
theological_decisions:
- issue: 예외 구문의 처리
  chosen_reading: ‘다만 …만 예외였습니다’로 옮겨, 부정 전체에 대한 단 하나의 예외라는 구조를 분명히 했습니다.
  alternative_readings:
  - ‘…를 제외하고는’
  - ‘…만이 그랬습니다’
  rationale: 본문의 בִּלְתִּי는 앞선 부정에 대한 예외를 표시하므로, 한국어에서 의미가 흐려지지 않도록 명시적으로 드러냈습니다.
  doctrine_reference: source syntax / discourse structure
