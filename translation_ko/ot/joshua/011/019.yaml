base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
  footnotes:
  - marker: a
    text: Or 'made peace with the Israelites.' The Hebrew more literally says 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'captured all in war.' The Hebrew says literally, 'they took all in battle/war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기브온에 사는 히위 사람들 외에는 이스라엘 자손과 화친한 성읍이 하나도 없었습니다. 이스라엘 자손은 전쟁으로 모두 차지했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현을 따른 것입니다. 한국어로는 ‘이스라엘 사람들’이라고도 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모두 차지했습니다’는 히브리어를 비교적 직역한 표현입니다. 히브리어는 문자적으로 ‘그들은 전쟁에서/전쟁으로 모두를 취했습니다’라고 말합니다.
    reason: lexical_alternative
