id: JOS.11.11
reference: Joshua 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
  footnotes:
  - marker: a
    text: Or 'putting them under the ban.' The Hebrew uses חרם language, denoting devotion to destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'not any breath remained,' an idiom meaning that no survivor was left.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts from plural ('they struck down') to singular ('he burned'), likely referring specifically to Joshua in the final clause.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그 안에 있는 모든 사람을 칼날로 쳐서 멸망에 바쳤고[a], 호흡하는 것이 하나도 남지 않았습니다[b]. 그리고 그는 하솔을 불로 태웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망 아래 두고’. 히브리어는 חֶרֶם(헤렘) 언어를 사용하여 멸망에 바치는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘숨 하나 남지 않았다’입니다. 이는 생존자가 전혀 남지 않았다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 앞부분의 복수형에서 마지막 절에서 단수형으로 바뀝니다. 이는 특히 여호수아를 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: They struck down
  chosen_korean: 그들은 … 쳐서
  alternatives_korean:
  - 그들은 … 쳐죽였고
  - 그들은 … 쳤고
  lexicon: HALOT
  rationale: 전투 서술의 ‘치는’ 의미를 살리되, 결과를 분명히 드러내는 ‘쳐서’로 옮겨 군사적 폭력을 자연스럽게 표현했습니다.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  english_pob_choice: every person who was in it
  chosen_korean: 그 안에 있는 모든 사람
  alternatives_korean:
  - 그 안에 있는 모든 영혼
  - 그 안에 있는 모든 자
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ은 추상적 ‘영혼’이 아니라 성읍 안의 사람들을 가리키므로, 현대 한국어에서는 ‘사람’이 가장 분명합니다.
- source_word: הַחֲרֵם
  english_pob_choice: devoting them to destruction
  chosen_korean: 멸망에 바쳤고
  alternatives_korean:
  - 진멸했고
  - 금령 아래 두었고
  lexicon: HALOT
  rationale: ḥerem의 언약적·제의적 색채를 유지하면서도, 한국어에서 너무 기술적인 ‘금령 아래’보다 의미가 드러나는 표현을 택했습니다.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  english_pob_choice: not a single breathing thing was left
  chosen_korean: 호흡하는 것이 하나도 남지 않았습니다
  alternatives_korean:
  - 숨 쉬는 것이 하나도 남지 않았습니다
  - 살아 숨 쉬는 것이 하나도 남지 않았습니다
  lexicon: HALOT
  rationale: ‘숨/호흡’의 직역성을 살리면서, 생존자 부재라는 관용적 의미를 현대 한국어로 자연스럽게 전달했습니다.
- source_word: שָׂרַף בָּאֵשׁ
  english_pob_choice: he burned Hazor with fire
  chosen_korean: 하솔을 불로 태웠습니다
  alternatives_korean:
  - 하솔을 불에 태웠습니다
  - 하솔에 불을 질렀습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘불로 태우다’라는 결합을 자연스럽게 옮기되, ‘불에 태우다’보다 간결한 ‘불로 태우다’를 택했습니다.
theological_decisions:
- issue: חרם(멸망에 바침)의 보존
  chosen_reading: 멸망에 바쳤고
  alternative_readings:
  - 진멸했고
  - 금령 아래 두었고
  rationale: 이 표현은 단순한 전쟁 행위보다 하나님의 심판 아래 둔다는 언약적 무게를 함께 지니므로, 그 긴장을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 히브리어의 복수→단수 주어 전환
  chosen_reading: 그들은 … 바쳤고 … 그는 하솔을 불로 태웠습니다
  alternative_readings:
  - 그들은 … 바쳤고 … 그들은 하솔을 불로 태웠습니다
  rationale: 본문의 복수 동사에서 단수 동사로의 전환을 평평하게 만들지 않고 그대로 살려, 마지막 절의 단수 주어가 보존되도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
