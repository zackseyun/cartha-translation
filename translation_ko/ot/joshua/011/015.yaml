  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or, 'He omitted nothing from all that the LORD had commanded Moses.' The Hebrew idiom is literally, 'he did not remove a thing from all that the LORD had commanded Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자기 종 모세에게 명령하신 대로, 모세도 여호수아에게 명령하였고, 여호수아도 그대로 행하였습니다. 여호수아는 야훼께서 모세에게 명령하신 모든 것 가운데서 한 가지도 빼놓지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그는 야훼께서 모세에게 명령하신 모든 것 가운데서 한 가지도 제거하지 않았다.’ 히브리어의 ‘제거하다’는 여기서 명령된 어떤 것도 제외하거나 생략하지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 원문 고유명사를 보존하기 위해 야훼를 사용했습니다. '주님'은 호칭으로 바뀌어 이름성이 약해집니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 섬기는 자
  lexicon: HALOT
  rationale: 모세를 위한 언약적·존칭적 용법이므로 '종'이 가장 자연스럽고, '노예'는 이 문맥의 위계를 과도하게 부각합니다.
- source_word: כַּאֲשֶׁר צִוָּה ... כֵּן צִוָּה ... וְכֵן עָשָׂה
  english_pob_choice: Just as ... so ... and so ...
  chosen_korean: …것처럼 …하였고, …도 그대로 행하였습니다
  alternatives_korean:
  - …한 대로 …하였고, …도 그렇게 하였습니다
  - …처럼 …명령하였고, …도 그렇게 하였습니다
  lexicon: HALOT
  rationale: 전반의 대응 구조를 한국어에서 자연스럽게 살리기 위해 반복적 평행을 유지했습니다.
- source_word: לֹא הֵסִיר דָּבָר מִכֹּל
  english_pob_choice: He left nothing undone
  chosen_korean: 아무것도 빼지 않았습니다
  alternatives_korean:
  - 아무것도 생략하지 않았습니다
  - 한 가지도 빼놓지 않았습니다
  - 아무것도 제거하지 않았습니다
  lexicon: HALOT
  rationale: 직역보다 관용의 뜻인 '완전한 준행'을 드러내는 한국어 표현으로 옮겼습니다. '빼지 않다'가 원문의 부정 관용구를 가장 간결하게 담습니다.
theological_decisions:
- issue: 여호수아의 순종을 나타내는 완전성 표현
  chosen_reading: ‘아무것도 빼지 않았습니다’로 번역해 명령의 전면적 이행을 드러냈습니다.
  alternative_readings:
  - ‘한 가지도 빼놓지 않았습니다’
  - ‘완전히 지켰습니다’
  rationale: 본문은 단순한 행동이 아니라 야훼의 명령을 한 치도 줄이지 않고 그대로 전달·이행한 순종을 강조합니다. 그래서 결과 중심의 일반적 표현보다 부정 관용구의 강도를 살렸습니다.
  doctrine_reference: 본문 주해상 완전 순종의 강조
