  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
  footnotes:
  - marker: a
    text: Misrephoth-maim is a place name; the Hebrew may mean 'burnings of waters.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until they had left them no survivor'; the Hebrew verb is singular, but the sense may be collective.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이스라엘의 손에 그들을 넘겨주셨고, 그들이 그들을 쳐서 무너뜨리며 큰 시돈과 미스르포트마임과 미스베의 골짜기, 곧 동쪽까지 추격하였으며, 그들을 쳐서 남은 생존자가 하나도 없게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미스르포트마임은 지명으로 보며, 히브리어는 ‘물의 불태움들/불붙는 곳’쯤의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그들을 남김없이 남겨두지 않을 때까지’로도 옮길 수 있습니다. 히브리어 동사는 단수형이지만, 뜻은 집단적으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/Hebrew proper name tradition
  rationale: 본문의 신명기적 언약 이름을 그대로 살리기 위해 관용적 대체어가 아니라 음역형 '야훼'를 사용했습니다.
- source_word: וַיִּתְּנֵם
  english_pob_choice: gave them
  chosen_korean: 그들을 넘겨주셨고
  alternatives_korean:
  - 그들을 주셨고
  - 그들을 내주셨고
  - 그들을 넘기셨고
  lexicon: HALOT
  rationale: 전쟁 문맥의 נתן은 단순한 ‘주다’보다 적에게 넘겨주는 의미가 분명하므로, 한국어에서는 ‘넘겨주다’가 가장 자연스럽고 의미도 분명합니다.
- source_word: בְּיַד יִשְׂרָאֵל
  english_pob_choice: into the hand of Israel
  chosen_korean: 이스라엘의 손에
  alternatives_korean:
  - 이스라엘의 권세에
  - 이스라엘의 힘에
  - 이스라엘의 손 안에
  lexicon: HALOT
  rationale: 히브리어 관용구의 손 이미지를 살리면서도 한국어로는 ‘손에’가 가장 직접적이고 성경적 문체를 유지합니다.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  english_pob_choice: they struck them down
  chosen_korean: 그들이 그들을 쳐서 무너뜨리며
  alternatives_korean:
  - 그들이 그들을 쳐서 쓰러뜨리며
  - 그들이 그들을 공격하며
  - 그들이 그들을 무찔러
  lexicon: HALOT
  rationale: נכה는 단순 타격이 아니라 전투에서의 제압을 뜻하므로, ‘쳐서 무너뜨리다’로 물리적·군사적 강도를 함께 살렸습니다.
- source_word: וַיִּרְדְּפוּם
  english_pob_choice: pursued them
  chosen_korean: 추격하였으며
  alternatives_korean:
  - 뒤쫓았으며
  - 쫓아갔으며
  - 추적하였으며
  lexicon: HALOT
  rationale: רדף의 전형적 전쟁 용례를 반영해 ‘추격하다’로 옮겨, 단순한 पीछा보다 군사적 긴박함을 살렸습니다.
- source_word: מִשְׂרְפֹת מַיִם
  english_pob_choice: Misrephoth-maim
  chosen_korean: 미스르포트마임
  alternatives_korean:
  - 물의 불태움
  - 뜨거운 샘
  lexicon: HALOT
  rationale: 지명으로 보는 것이 우선이므로 음역을 유지했고, 의미 가능성은 본문 밖 해설로 남기는 편이 적절합니다.
theological_decisions:
- issue: 동사 시제와 집단 주어의 지칭
  chosen_reading: 문맥상 이스라엘 집단을 주어로 삼아 ‘그들이 ... 추격하였으며’로 옮겼습니다.
  alternative_readings:
  - ‘그가 ... 추격하였으며’로 단수화
  - 주어를 생략한 수동형 표현
  rationale: 히브리어 동사들이 연속된 복수형으로 이어지므로, 한국어에서도 집단 주어를 유지해 본문의 전투 서술 흐름을 보존했습니다.
  doctrine_reference: 문법-문맥 일치 원칙
