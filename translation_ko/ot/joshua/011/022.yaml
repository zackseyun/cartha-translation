  rationale: 지명은 한국어 성경에서 널리 쓰이는 음역을 따랐고, 반복되는 전치사는 목록 전체에 한 번만 반영했습니다.
theological_decisions:
- issue: 남아 있음의 범위가 본문상 제한된 예외인지 여부
  chosen_reading: ‘다만 …에는 남아 있었습니다’로 예외를 분명히 했습니다.
  alternative_readings:
  - ‘그곳들에도 남지 않았습니다’
  - ‘그곳들에만 남아 있었습니다’
  rationale: 히브리어 רַק(‘오직, 다만’)이 예외를 표시하므로, 본문의 긴장—이스라엘 땅에서는 소멸했지만 블레셋 도시들에는 잔존했다는 점—을 그대로 드러냈습니다.
  doctrine_reference: 본문 주해상 예외 표지 רַק의 기능
