lexical_decisions:
- source_word: לֹא נוֹתַר / נִשְׁאָרוּ
  english_pob_choice: were left / did some remain
  chosen_korean: 하나도 남지 않았습니다 / 남아 있었습니다
  alternatives_korean:
  - 남지 않았습니다 / 남았습니다
  - 남은 자가 없었습니다 / 일부는 남아 있었습니다
  lexicon: HALOT
  rationale: 첫 절의 부정 결과를 자연스럽게 옮기기 위해 ‘하나도 남지 않았습니다’를, 뒤 절의 예외적 잔존을 위해 ‘남아 있었습니다’를 사용했습니다.
- source_word: עֲנָקִים
  english_pob_choice: Anakim
  chosen_korean: 아낙 사람들
