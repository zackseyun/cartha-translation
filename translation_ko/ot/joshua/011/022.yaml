  lexicon: HALOT
  rationale: 고유한 민족명은 음역을 유지하되, 한국어에서 통용되는 설명적 표현인 ‘사람들’을 붙여 의미를 분명하게 했습니다.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
