  text: 이스라엘 자손의 땅에는 아낙 사람들이 하나도 남지 않았습니다[a]. 다만 가사와 가드[b], 아스돗에는 남아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
