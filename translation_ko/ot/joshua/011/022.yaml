  - 이스라엘 사람들의 땅에는
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되, 합쇼체 한국어에서 자연스럽게 읽히도록 어순을 조정했습니다.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
