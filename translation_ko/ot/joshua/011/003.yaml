  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and from the sea'; here 'the sea' likely functions as a geographic term for the west.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 동쪽과 서쪽[a]에 있는 가나안 사람들과 산지에 있는 아모리 사람들, 헷 사람들, 브리스 사람들, 여부스 사람들, 그리고 헤르몬 아래, 미스바 땅에 있는 히위 사람들에게도 사람을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다로부터’입니다. 여기서 ‘바다’는 지리적으로 서쪽을 가리키는 말로 쓰인 것으로 보입니다.
    reason: lexical_alternative
