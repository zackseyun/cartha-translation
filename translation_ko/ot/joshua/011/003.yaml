theological_decisions:
- issue: 민족/지명 목록의 집합적 표현 유지
  chosen_reading: 각 민족명을 집합적 단수의 뜻으로 읽되 한국어에서는 자연스럽게 복수 집합으로 표현했습니다.
  alternative_readings:
  - 각 항목을 전부 단수형으로 직역하는 방식
  - 민족 이름들을 모두 고유명사처럼 처리하는 방식
  rationale: 이 절은 점령 대상의 범위를 열거하는 지리·민족 목록이므로, 문법적 단수보다 집합적 의미가 중요합니다. 한국어에서는 이를 복수 집합으로 자연스럽게 드러내는 것이 원문의 효과를 잘 보존합니다.
  doctrine_reference: 본문의 역사 서술적 맥락
