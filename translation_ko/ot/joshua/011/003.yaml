  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and from the sea'; here 'the sea' likely functions as a geographic term for the west.
    reason: lexical_alternative
translation:
  language: ko
  text: 가나안 사람들은 동쪽과 서쪽[a]에 있었고, 아모리 사람과 헷 사람과 브리스 사람과 여부스 사람은 산지에 있었으며, 히위 사람은 헤르몬 아래 미스바 땅에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다로부터’입니다. 여기서는 ‘바다’가 지리적으로 ‘서쪽’을 가리키는 말로 쓰인 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
