id: JOS.17.16
reference: Joshua 17:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the mountain/hill country is not found for us'; the sense in context is that the hill country is insufficient for the Joseph tribes.
    reason: lexical_alternative
  - marker: b
    text: Or 'chariots of iron.'
    reason: lexical_alternative
  - marker: c
    text: '''Daughter towns'' refers to smaller dependent settlements belonging to a larger city.'
    reason: cultural_note
translation:
  language: ko
  text: 요셉의 자손들이 말했습니다. 「산지는 우리에게 충분하지 않습니다. 그리고 골짜기 땅에 사는 모든 가나안 사람들—곧 벧스안과 그 딸 성읍들에 있는 자들과 이스르엘 골짜기에 있는 자들—은 철 병거를 가지고 있습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산지’는 문자적으로는 ‘산/산악 지대’이지만, 문맥상 요셉 지파에게 할당된 고지대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘철로 된 병거들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘딸 성읍들’은 큰 성읍에 딸린 종속 정착지를 뜻하는 히브리 관용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָהָר
  english_pob_choice: the hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산
  - 언덕 지대
  - 산악 지대
  lexicon: HALOT
  rationale: 영어 POB가 지리적 용례를 따라 ‘hill country’로 풀었으므로, 한국어도 문자적 ‘산’보다 영역성을 드러내는 ‘산지’가 더 정확합니다.
- source_word: לֹא יִמָּצֵא לָנוּ
  english_pob_choice: is not enough for us
  chosen_korean: 우리에게 충분하지 않습니다
  alternatives_korean:
  - 우리에게 발견되지 않습니다
  - 우리에게 있지 않습니다
  - 우리에게 부족합니다
  lexicon: HALOT
  rationale: מצא의 관용적 용법을 서투르게 직역하기보다, 문맥상 ‘충분하지 않다/부족하다’는 의미를 현대 한국어로 자연스럽게 전달했습니다.
- source_word: רֶכֶב בַּרְזֶל
  english_pob_choice: iron chariots
  chosen_korean: 철 병거
  alternatives_korean:
  - 철제 병거
  - 쇠 병거
  - 철로 된 병거
  lexicon: HALOT
  rationale: 히브리어의 전투용 수레 표현을 한국어 성경에서 널리 통용되는 ‘병거’로 살리되, חומר적 성격은 ‘철’로 직접 반영했습니다.
- source_word: בְּנוֹתֶיהָ
  english_pob_choice: daughter towns
  chosen_korean: 딸 성읍들
  alternatives_korean:
  - 부속 성읍들
  - 산하 성읍들
  - 속한 마을들
  lexicon: HALOT
  rationale: ‘딸들’은 모도시의 종속 정착지를 가리키는 히브리 관용어이므로, 메타포를 보존하는 ‘딸 성읍들’이 가장 직접적입니다.
theological_decisions:
- issue: 가나안 사람들의 철 병거 언급이 전달하는 서사적 긴장
  chosen_reading: 조셉 지파의 주저함과 현실적 두려움을 그대로 드러내는 서술로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘무기가 강하다’로 풀어 약화시키는 읽기
  - 해설적으로 ‘정복이 어렵다’고 앞당겨 해석하는 읽기
  rationale: 본문은 실제 군사적 열세를 이유로 한 경계심을 보여 주므로, 이를 약화하지 않고 ‘철 병거’를 그대로 남겨 긴장을 보존했습니다.
  doctrine_reference: 본문 내 서사적 의미 보존
- issue: 직접 인용부의 말투
  chosen_reading: 인용문 안에서는 일반 서술체를 유지하고, 하나님께 드리는 기도문이 아니므로 존대 명령형으로 옮기지 않았습니다.
  alternative_readings:
  - 인용문 전체를 높임말로 바꾸는 읽기
  - 대화체를 과도하게 구어화하는 읽기
  rationale: 여기는 인간 화자의 진술이므로 합쇼체 서술이 적절하며, 원문의 담화 기능을 유지합니다.
  doctrine_reference: 담화-화자 구분
