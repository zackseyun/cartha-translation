source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
  footnotes:
  - marker: a
    text: Or “go up into the forest and clear it for yourselves there.” The Hebrew verb refers to clearing wooded land.
    reason: lexical_alternative
  - marker: b
    text: “Hill country of Ephraim” may also be rendered “Mount Ephraim,” referring to the upland region allotted to Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 그들에게 말했습니다. “너희가 수가 많은 백성이라면, 숲으로 올라가서 브리스 사람들과 르바임의 땅인 그곳을 너희 몫으로 개간하십시오.[a] 에브라임 산지[b]가 너희에게 너무 비좁기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 나무가 우거진 땅을 베어 내어 경작할 수 있게 만드는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에브라임 산지’는 ‘에브라임 산악지대’로도 옮길 수 있으며, 여기서는 에브라임에 할당된 구릉 지역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  english_pob_choice: a numerous people
  chosen_korean: 수가 많은 백성
  alternatives_korean:
  - 많은 백성
  - 큰 백성
  lexicon: HALOT
  rationale: 단순한 ‘크다’보다 인원수의 많음을 드러내는 표현이어서, 수량적 의미를 자연스럽게 살렸습니다.
- source_word: הַיַּעְרָה
  english_pob_choice: the forest
  chosen_korean: 숲으로
  alternatives_korean:
  - 산림으로
  - 숲속으로
  lexicon: HALOT
  rationale: 방향성을 살려 ‘~으로’로 옮겼고, 현대 한국어에서 가장 자연스러운 산림 지칭어인 ‘숲’을 택했습니다.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  english_pob_choice: clear land for yourselves there
  chosen_korean: 거기에서 너희를 위해 땅을 개간하십시오
  alternatives_korean:
  - 거기에서 너희를 위해 그것을 베어내십시오
  - 거기에서 너희를 위해 땅을 정리하십시오
  lexicon: HALOT
  rationale: 브라르의 경작지/개간 의미를 살려 ‘개간하다’로 옮기고, לְךָ의 이익-대상 뉘앙스를 ‘너희를 위해’로 반영했습니다.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  english_pob_choice: in the land of the Perizzites and the Rephaim
  chosen_korean: 브리스 사람들과 르바임의 땅
  alternatives_korean:
  - 브리스 사람들과 르바임 사람들의 땅
  - 브리스 사람들과 르파임의 땅
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지했고, 전승된 한국어 성경에서 널리 알려진 ‘브리스 사람들’을 따라 읽되, 르바임은 원어 음가에 가까운 형태로 표기했습니다.
- source_word: הַר אֶפְרָיִם
  english_pob_choice: the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 산지
  - 에브라임 산악지대
  lexicon: HALOT
  rationale: 지리적 문맥에서 단일 산봉우리보다 산지/구릉지를 뜻하므로, 관용적으로도 이해되는 ‘산지’로 옮겼습니다.
theological_decisions:
- issue: 명령문과 완곡한 권고의 톤
  chosen_reading: 여호수아의 말은 정식 명령이라기보다 부족한 땅을 보완하라는 현실적 지시로 전달했습니다.
  alternative_readings:
  - 직설적인 명령으로 ‘가서 개간하라’
  - 권고체로 ‘가서 개간해 보라’
  rationale: 문맥상 분배된 지파의 형편을 조정하는 발화이므로, 히브리어의 명령형을 살리되 한국어에서는 너무 강압적으로 들리지 않게 표준적 지시문체를 사용했습니다.
  doctrine_reference: 문맥-화행 균형
