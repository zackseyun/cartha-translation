id: JOS.17.9
reference: Joshua 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
  footnotes:
  - marker: a
    text: Or 'Wadi Kanah.' The Hebrew נחל can refer to a seasonal streambed or ravine as well as a brook.
    reason: lexical_alternative
  - marker: b
    text: That is, Ephraim had cities situated within the territory assigned to Manasseh.
    reason: cultural_note
  - marker: c
    text: '''The sea'' here refers to the Mediterranean Sea.'
    reason: cultural_note
translation:
  language: ko
  text: 그런데 경계선은 가나의 시내까지 내려가 시내의 남쪽에 이르렀습니다. 이 성읍들은 에브라임의 것이었는데, 므낫세의 성읍들 한가운데에 있었고, 므낫세의 경계는 시내의 북쪽에 있었으며, 그 경계의 끝은 바다에 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 계절 하천의 물길이나 협곡을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 에브라임은 므낫세에 할당된 영토 안에 자리한 성읍들을 가지고 있었다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘바다’는 지중해를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  english_pob_choice: Then the border went down
  chosen_korean: 경계선은 … 내려가
  alternatives_korean:
  - 그 경계는 … 내려갔습니다
  - 경계는 … 하강했습니다
  lexicon: HALOT
  rationale: 경계선이 지형을 따라 내려가는 묘사를 한국어로 자연스럽게 살리되, 법적 경계의 의미가 유지되도록 했습니다.
- source_word: נַחַל קָנָה
  english_pob_choice: the Brook of Kanah
  chosen_korean: 가나의 시내
  alternatives_korean:
  - 가나 시내
  - 가나의 와디
  lexicon: HALOT
  rationale: נחל은 한국어 성경 문맥에서 시내로 옮기되, 고유명사는 가나로 음역해 지명성을 살렸습니다.
- source_word: נֶגְבָּה לַנַּחַל
  english_pob_choice: south of the brook
  chosen_korean: 시내의 남쪽에
  alternatives_korean:
  - 시내 남쪽에
  - 시내를 향해 남쪽으로
  lexicon: HALOT
  rationale: 본문은 방향 이동이 아니라 시내를 기준으로 한 위치를 말하므로 ‘남쪽에’가 가장 정확합니다.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  english_pob_choice: among the cities of Manasseh
  chosen_korean: 므낫세의 성읍들 한가운데에
  alternatives_korean:
  - 므낫세의 성읍들 가운데에
  - 므낫세의 성읍들 안에
  lexicon: HALOT
  rationale: 에브라임의 성읍들이 므낫세 지파 영역 안에 끼어 있었음을 분명히 드러내기 위해 ‘한가운데에’로 옮겼습니다.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  english_pob_choice: and its end was at the sea
  chosen_korean: 그 경계의 끝은 바다에 이르렀습니다
  alternatives_korean:
  - 그 끝은 바다였습니다
  - 그 경계는 바다에 닿았습니다
  lexicon: HALOT
  rationale: 경계 공식의 תוצאות는 종착점/끝을 뜻하므로, 한국어에서는 ‘이르렀습니다’로 종결 지점을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지파 경계와 포함 관계의 표현
  chosen_reading: 에브라임의 성읍들이 므낫세의 성읍들 한가운데에 있었다는 포함 관계를 본문대로 분명히 드러냈습니다.
  alternative_readings:
  - 에브라임의 성읍들이 므낫세의 성읍들 가운데 있었다
  - 에브라임의 성읍들이 므낫세 땅 안에 있었다
  rationale: 본문은 단순한 인접이 아니라 에브라임 성읍들이 므낫세 영역 안에 배치되었음을 말하므로, 그 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: 수 17:9의 지파 분배/경계 서술
