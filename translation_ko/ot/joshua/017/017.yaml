  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
  footnotes:
  - marker: a
    text: Or “a great people.” The Hebrew phrase can denote either numerical size or greatness; here the land-allotment context favors “numerous people.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “lot.” In Joshua this often refers to an inheritance portion assigned by lot; hence “allotment.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 요셉의 집안, 곧 에브라임과 므낫세에게 말했습니다. “너희는 수가 많은 백성[a]이고 큰 힘도 있으니, 너희에게 한 몫만 주어지지는 않을 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 백성.” 히브리어 표현은 수적 규모나 위대함 둘 다를 뜻할 수 있지만, 여기서는 땅 분배 문맥이므로 “수가 많은”이 더 적합합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘몫’. 여호수아서는 흔히 제비로 배당된 기업 몫을 가리키므로, “몫”으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  english_pob_choice: the house of Joseph
  chosen_korean: 요셉의 집
  alternatives_korean:
  - 요셉의 집안
  - 요셉의 자손
  lexicon: HALOT
  rationale: 족속-지파를 가리키는 관용구를 살리기 위해 직역형을 택했습니다. 바로 뒤의 에브라임과 므낫세가 그 범위를 구체화하므로, 한국어도 ‘집’으로 두는 편이 원문 구조를 더 잘 반영합니다.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  english_pob_choice: to Ephraim and Manasseh
  chosen_korean: 에브라임과 므낫세에게
  alternatives_korean:
  - 곧 에브라임과 므낫세에게
  - 에브라임과 므낫세에게, 곧
  lexicon: HALOT
  rationale: 문법상 목적어가 아니라 대상 표시이므로 ‘에게’로 처리했습니다. 본문은 ‘요셉의 집’을 곧바로 두 지파로 풀어 설명하므로, 쉼표로 병렬 apposition을 드러냈습니다.
- source_word: עַם רַב
  english_pob_choice: a numerous people
  chosen_korean: 수가 많은 백성이며
  alternatives_korean:
  - 많은 백성이며
  - 큰 백성이며
  lexicon: HALOT
  rationale: English POB가 숫자적 규모를 우선한 점을 따라 ‘수가 많은’으로 옮겼습니다. ‘큰 백성’은 위상이나 중요성을 암시할 수 있어 문맥상 덜 정확합니다.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  english_pob_choice: and you have great strength
  chosen_korean: 힘도 크니
  alternatives_korean:
  - 큰 힘도 있으니
  - 큰 능력도 있으니
  lexicon: HALOT
  rationale: ‘כֹחַ’의 기본적 의미를 자연스러운 한국어 ‘힘’으로 옮기고, 병렬적 강조를 ‘도’로 살렸습니다. 문맥상 땅 분배의 근거가 되는 역량을 말하므로 ‘능력’보다 ‘힘’이 직접적입니다.
- source_word: גּוֹרָל
  english_pob_choice: allotment
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 할당 몫
  lexicon: HALOT
  rationale: 여호수아서에서 ‘goral’은 제비뽑기로 배분된 기업 몫을 가리키므로, 한국어에서는 간결하게 ‘몫’으로 처리했습니다. ‘할당 몫’은 설명적이지만 문장을 지나치게 무겁게 만듭니다.
theological_decisions:
- issue: 지파-기업 분배의 뉘앙스
  chosen_reading: ‘한 몫만 있을 수 없습니다’로 번역해, 단순한 양적 부족이 아니라 두 지파의 분깃 분배가 확대되어야 한다는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘한 분깃만 가질 수 없습니다’
  - ‘한 몫밖에 없을 수 없습니다’
  rationale: 본문은 전쟁력이나 인구가 아니라 토지 분배를 말하므로, 한국어도 분배·기업의 의미를 분명히 해야 합니다.
  doctrine_reference: Joshua 17:14-18; land allotment theology
