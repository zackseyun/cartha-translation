    text: 또는 ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가나안 사람들에게 부역을 시켰다’ 또는 ‘가나안 사람들에게 조공을 바치게 했다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 부정문에서 동사를 반복하여 ‘완전히’ 또는 ‘철저히 쫓아내지 않았다’는 뜻을 강조합니다.
    reason: lexical_alternative
