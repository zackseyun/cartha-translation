source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'subjected the Canaanites to corvée labor' or 'put the Canaanites under tribute.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew intensifies the verb: ''they did not completely / utterly drive them out.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 강해졌을 때, 그들은 가나안 사람들을 강제 노역에 두었지만, 그들을 완전히 쫓아내지는 못했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부역에 두었거나’, ‘조공 아래 두었거나’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 동사의 강조를 통해 ‘완전히/철저히 쫓아내다’의 뜻을 강화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 살리되, 한국어에서는 자연스럽고 성경적 관용이 널리 알려진 ‘이스라엘 자손’을 사용했습니다.
- source_word: לָמַס
  english_pob_choice: to forced labor
  chosen_korean: 강제 노역에 두었지만
  alternatives_korean:
  - 부역에 두었지만
  - 강제 노역을 시켰지만
  - 조공 아래 두었지만
  lexicon: HALOT
  rationale: 문맥상 단순한 세금이 아니라 강제 동원된 노역을 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘강제 노역’으로 옮겼습니다.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  english_pob_choice: they did not completely drive them out
  chosen_korean: 그들을 완전히 쫓아내지는 못했습니다
  alternatives_korean:
  - 그들을 완전히 몰아내지는 못했습니다
  - 그들을 쫓아내지 못했습니다
  - 그들을 완전히 축출하지는 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 강조 구조를 반영해 ‘완전히’로 강도를 살렸고, 정착·정복 문맥에 어울리는 자연스러운 한국어로 ‘쫓아내다’를 택했습니다.
- source_word: חָזְקוּ
  english_pob_choice: became strong
  chosen_korean: 강해졌을 때
  alternatives_korean:
  - 강해졌을 때
  - 세력을 얻었을 때
  - 힘을 얻게 되었을 때
  lexicon: HALOT
  rationale: 상태의 증가를 나타내는 동사로 보아, 결과 상태를 드러내는 ‘강해졌을 때’로 옮겼습니다.
theological_decisions:
- issue: 가나안 사람들에 대한 정복 표현
  chosen_reading: ‘강제 노역’과 ‘완전히 쫓아내지 못했습니다’로 함께 살려, 부분적 정복과 미완의 추방을 드러냈습니다.
  alternative_readings:
  - ‘조공을 바쳤다’로 완화하는 읽기
  - ‘그들을 축출하지 못했다’로만 평탄화하는 읽기
  rationale: 본문은 단순한 종속이나 세금이 아니라 남아 있는 가나안 주민의 강제 동원을 말하며, 동시에 완전한 추방 실패를 강조합니다. 두 요소를 함께 드러내는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 정복 서술의 본문 의미 보존
