  naturalness: 현행 ‘강제 노역에 두었지만’은 한국어 결합이 다소 부자연스럽습니다. 문장을 나누고 ‘그러나’를 사용하면 현대 표준어 합쇼체로 명료하게 읽힙니다.
  terminology: ‘이스라엘 자손’, ‘가나안 사람들’, ‘강제 노역’, ‘완전히 쫓아내다’는 적절합니다. 각주 b의 ‘부역에 두었거나’와 ‘조공 아래 두었거나’는 한국어로 어색하므로 각각 행위를 나타내는 표현으로 고칩니다.
