  text: 이스라엘 자손이 강해졌을 때[a], 그들은 가나안 사람들에게 강제 노역을 시켰습니다[b]. 그러나 그들을 완전히 쫓아내지는 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
