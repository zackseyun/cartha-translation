  - 에브라임에 남쪽으로 속하고
  lexicon: HALOT
  rationale: 방향 부사구와 배정 의미를 함께 살려, 지파 몫의 경계 설명이라는 문맥을 자연스럽게 드러냈습니다.
- source_word: וְצָפֹונָה לִמְנַשֶּׁה
  english_pob_choice: and northward to Manasseh
  chosen_korean: 북쪽으로는 므낫세에 속했으며
  alternatives_korean:
  - 그리고 북쪽은 므낫세에 속하고
  - 북쪽으로는 므낫세의 것이며
  lexicon: HALOT
  rationale: 앞절과 평행을 이루도록 같은 배정 의미를 유지하면서 한국어 문장 흐름을 매끄럽게 했습니다.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  english_pob_choice: and the sea was its border
  chosen_korean: 바다가 그 경계였습니다
  alternatives_korean:
  - 바다가 그 경계가 되었습니다
  - 바다가 그 경계였습니다
  lexicon: HALOT
  rationale: גְּבוּל을 ‘경계’로 옮겨 토지 분배 본문의 지리적 표지를 분명히 했습니다.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן ... וּבְיִשָּׂשכָר
  english_pob_choice: on the north they reached Asher, and on the east Issachar
  chosen_korean: 북쪽에서는 아셀에, 동쪽에서는 잇사갈에 닿았습니다.
  alternatives_korean:
  - 북쪽에서는 아셀과 접했고, 동쪽에서는 잇사갈과 접했습니다.
  - 북쪽에서는 아셀을 만나고, 동쪽에서는 잇사갈을 만났습니다.
  lexicon: HALOT
  rationale: פגע는 경계 문맥에서 ‘닿다/접하다’의 뜻이 적절하므로, POB의 ‘reached’보다 한국어에 더 자연스러운 ‘닿았습니다’를 택했습니다.
