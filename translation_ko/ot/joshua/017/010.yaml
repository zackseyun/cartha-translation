base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
  footnotes:
  - marker: a
    text: Or 'they bordered on Asher on the north and on Issachar on the east.' The Hebrew verb can be rendered 'met,' 'touched,' or 'bordered on' in territorial descriptions.
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽으로는 에브라임에 속하고, 북쪽으로는 므낫세에 속했으며, 바다가 그 경계였습니다. 북쪽에서는 아셀에, 동쪽에서는 잇사갈에 닿았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽에서 아셀과, 동쪽에서 잇사갈과 경계를 이루었습니다.’ 히브리어 동사는 경계 표지 문맥에서 ‘만나다’, ‘닿다’, ‘경계를 이루다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  english_pob_choice: Southward it belonged to Ephraim
  chosen_korean: 남쪽으로는 에브라임에 속하고
  alternatives_korean:
