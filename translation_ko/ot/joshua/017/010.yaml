  to: 남쪽은 에브라임의 것이고, 북쪽은 므낫세의 것이었으며, 바다가 므낫세의 경계였습니다. 그 경계는 북쪽에서 아셀에, 동쪽에서 잇사갈에 닿았습니다.[a]
