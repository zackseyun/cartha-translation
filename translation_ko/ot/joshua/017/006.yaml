source:
  edition: WLC
  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
  footnotes:
  - marker: a
    text: Or 'because the daughters of Manasseh inherited an inheritance among his sons.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among his sons'; the text explicitly contrasts daughters and sons in the inheritance arrangement.
    reason: cultural_note
  - marker: c
    text: Or 'the land of Gilead was for the remaining sons of Manasseh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 므낫세의 딸들이 그의 아들들 가운데서도 한 몫의 기업을 받았고, 길르앗 땅은 므낫세의 남은 아들들에게 속하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘므낫세의 딸들이 그의 아들들 가운데서 기업을 상속하였기 때문에’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그의 아들들 가운데서’라고 분명히 말하여, 딸들과 아들들의 구분을 상속 문맥 속에 유지합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘길르앗 땅은 므낫세의 남은 아들들을 위한 것이었다’.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …입니다
  - 그 까닭은 …이기 때문입니다
  lexicon: HALOT
  rationale: 앞절의 분배 상황을 설명하는 연결이므로, 문맥상 자연스러운 설명형인 ‘이는 … 때문입니다’로 처리하되 인과적 의미를 유지했습니다.
- source_word: בְּנוֹת מְנַשֶּׁה
  english_pob_choice: the daughters of Manasseh
  chosen_korean: 므낫세의 딸들
  alternatives_korean:
  - 므낫세의 여자 자손들
  - 므낫세의 딸들
  lexicon: HALOT
  rationale: 아들들과의 대조가 핵심이므로 ‘딸들’을 직접 살렸습니다. 관형 관계는 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: נָחֲלוּ נַחֲלָה
  english_pob_choice: received an inheritance
  chosen_korean: 한 몫의 기업을 받았고
  alternatives_korean:
  - 기업을 받았고
  - 기업을 상속받았고
  lexicon: HALOT
  rationale: 반복 구조를 한국어에서 매끄럽게 풀어 ‘받다’로 옮기되, 법적 분배의 느낌을 살리기 위해 ‘한 몫의 기업’으로 구체화했습니다.
- source_word: בְּתוֹךְ בָּנָיו
  english_pob_choice: among his sons
  chosen_korean: 그의 아들들 가운데서도
  alternatives_korean:
  - 그의 아들들 가운데
  - 그의 아들들 사이에서
  lexicon: HALOT
  rationale: ‘among’의 포함적 의미를 살려 ‘가운데서도’로 옮겨, 딸들이 아들들 가운데서 기업을 받은 예외적 상황을 드러냈습니다.
- source_word: הַנּוֹתָרִים
  english_pob_choice: the rest
  chosen_korean: 남은
  alternatives_korean:
  - 나머지
  - 남아 있는
  lexicon: HALOT
  rationale: 나머지 집단을 가리키는 간결한 표현으로 ‘남은’을 택해, 분배가 이미 일부에게 돌아간 뒤의 잔여 몫이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 딸들의 기업 상속이 남자 자손과 병렬로 언급되는 점
  chosen_reading: 본문의 법적 배분 질서를 그대로 살려, 딸들도 ‘기업’을 실제로 받았다고 번역했습니다.
  alternative_readings:
  - 딸들도 몫을 받았다
  - 딸들이 유산을 얻었다
  rationale: 히브리어는 단순한 호의가 아니라 정당한 상속/분배를 말하므로, 성별 대비를 약화시키지 않고 법적 사실을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 27장 상속 규정; 여호수아 17장 분배 문맥
