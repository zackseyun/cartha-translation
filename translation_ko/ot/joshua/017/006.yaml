  - 므낫세의 딸들
  lexicon: HALOT
  rationale: 아들들과의 대조가 핵심이므로 ‘딸들’을 직접 살렸습니다. 관형 관계는 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: נָחֲלוּ נַחֲלָה
  english_pob_choice: received an inheritance
  chosen_korean: 한 몫의 기업을 받았고
  alternatives_korean:
  - 기업을 받았고
  - 기업을 상속받았고
  lexicon: HALOT
  rationale: 반복 구조를 한국어에서 매끄럽게 풀어 ‘받다’로 옮기되, 법적 분배의 느낌을 살리기 위해 ‘한 몫의 기업’으로 구체화했습니다.
- source_word: בְּתוֹךְ בָּנָיו
  english_pob_choice: among his sons
  chosen_korean: 그의 아들들 가운데서도
  alternatives_korean:
  - 그의 아들들 가운데
  - 그의 아들들 사이에서
  lexicon: HALOT
  rationale: ‘among’의 포함적 의미를 살려 ‘가운데서도’로 옮겨, 딸들이 아들들 가운데서 기업을 받은 예외적 상황을 드러냈습니다.
- source_word: הַנּוֹתָרִים
  english_pob_choice: the rest
  chosen_korean: 남은
  alternatives_korean:
  - 나머지
  - 남아 있는
  lexicon: HALOT
  rationale: 나머지 집단을 가리키는 간결한 표현으로 ‘남은’을 택해, 분배가 이미 일부에게 돌아간 뒤의 잔여 몫이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 딸들의 기업 상속이 남자 자손과 병렬로 언급되는 점
  chosen_reading: 본문의 법적 배분 질서를 그대로 살려, 딸들도 ‘기업’을 실제로 받았다고 번역했습니다.
  alternative_readings:
  - 딸들도 몫을 받았다
  - 딸들이 유산을 얻었다
  rationale: 히브리어는 단순한 호의가 아니라 정당한 상속/분배를 말하므로, 성별 대비를 약화시키지 않고 법적 사실을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 27장 상속 규정; 여호수아 17장 분배 문맥
