id: JOS.17.7
reference: Joshua 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
  footnotes:
  - marker: a
    text: Or 'which is before Shechem' or 'which faces Shechem.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the right'; in boundary descriptions this may refer to a southward direction.
    reason: lexical_alternative
  - marker: c
    text: En-tappuah means 'spring of Tappuah.'
    reason: cultural_note
translation:
  language: ko
  text: 므낫세의 경계는 아셀에서 미그므다스에 이르렀는데, 그곳은 세겜 맞은편에 있으며, 그 경계는 오른쪽으로 돌아 엔-답부아 주민들에게 이릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세겜 맞은편’은 문자적으로는 ‘세겜 앞/마주한 곳’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오른쪽으로’는 경계 설명에서 방향을 가리키는 관용적 표현으로, 지리적 맥락에 따라 남쪽을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 엔-답부아는 문자적으로 ‘답부아의 샘’이라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 영토
  lexicon: HALOT
  rationale: 지파 분배의 문맥에서는 땅의 전체 영역보다 경계선의 진행이 강조되므로 ‘경계’가 가장 자연스럽고 정확합니다.
- source_word: מֵאָשֵׁר
  english_pob_choice: from Asher
  chosen_korean: 아셀에서
  alternatives_korean:
  - 아셀로부터
  - 아셀 지경에서
  lexicon: HALOT
  rationale: 경계의 출발점을 나타내는 מן을 살려 ‘아셀에서’로 옮겼습니다.
- source_word: הַיָּמִין
  english_pob_choice: to the right
  chosen_korean: 오른쪽으로 돌아
  alternatives_korean:
  - 남쪽으로
  - 오른쪽으로
  lexicon: HALOT
  rationale: 본문의 문자적 표현은 ‘오른쪽’이며, 지리적 추정을 본문에 넣기보다 POB의 개정 유지 취지를 따라 그대로 살렸습니다.
- source_word: עֵין תַּפּוּחַ
  english_pob_choice: En-tappuah
  chosen_korean: 엔-답부아
  alternatives_korean:
  - 답부아 샘
  - 엔-탑부아
  lexicon: HALOT
  rationale: 고유지명은 음역을 유지하되, 한국어 표기 관례에 맞춰 하이픈을 사용했습니다.
