revisions:
- from: 므낫세의 경계는 아셀에서 미그므다스에 이르렀는데, 그곳은 세겜 맞은편에 있으며, 그 경계는 오른쪽으로 돌아 엔-답부아 주민들에게 이릅니다.[a][b][c]
  to: 므낫세의 경계는 아셀에서 시작하여 세겜 맞은편에 있는 믹므닷까지 이르렀습니다.[a] 그 경계는 오른쪽으로[b] 나아가 엔-답부아 주민들에게 이르렀습니다.[c]
  rationale: 원문의 경계 진행 동사와 과거 서술을 보존하도록 ‘오른쪽으로 돌아’를 ‘오른쪽으로 나아가’로 수정하고, 문장을 과거형으로 통일했습니다. 방향 표현은 논쟁 가능한 지리적 해석을 본문에 넣지 않고 문자적으로 유지했습니다. 각주 표지는 해당 어구에 직접 붙였으며, 믹므닷은 통용 한국어 성경 지명 표기로 정리했습니다.
