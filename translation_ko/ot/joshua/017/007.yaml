base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
  footnotes:
  - marker: a
    text: Or 'which is before Shechem' or 'which faces Shechem.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the right'; in boundary descriptions this may refer to a southward direction.
    reason: lexical_alternative
  - marker: c
    text: En-tappuah means 'spring of Tappuah.'
    reason: cultural_note
translation:
  language: ko
  text: 므낫세의 경계는 아셀에서 시작하여 세겜 맞은편에 있는 믹므닷까지 이르렀습니다.[a] 그 경계는 오른쪽으로[b] 나아가 엔-답부아 주민들에게 이르렀습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세겜 맞은편’은 문자적으로 ‘세겜 앞’ 또는 ‘세겜을 마주한 곳’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘오른쪽으로’입니다. 경계 설명의 지리적 맥락에서는 남쪽을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 엔-답부아는 문자적으로 ‘답부아의 샘’이라는 뜻입니다.
    reason: cultural_note
