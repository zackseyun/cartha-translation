base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
  footnotes:
  - marker: a
    text: Or 'Ten allotments fell to Manasseh' or 'Ten shares came to Manasseh by lot.' The Hebrew uses the idiom 'fell' in a land-allotment context.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세에게는 열 몫이 떨어졌습니다[a]. 그 밖에 길르앗과 바산의 땅은 요단 강 건너편에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “므낫세에게 열 몫이 분배되었습니다”, “므낫세에게 열 분깃이 제비로 주어졌습니다”로 옮길 수 있습니다. 히브리어는 분깃 분배 문맥에서 ‘떨어지다’라는 관용을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  english_pob_choice: fell
  chosen_korean: 떨어졌습니다
  alternatives_korean:
  - 분배되었습니다
  - 제비로 주어졌습니다
  lexicon: HALOT
  rationale: 분배·제비의 결과를 뜻하는 관용적 용법을 살리면서도, 한국어에서는 ‘떨어지다’가 가장 직접적으로 그 이미지를 전달합니다.
- source_word: חַבְלֵי
  english_pob_choice: portions
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 구역
  - 배당분
  lexicon: HALOT
  rationale: 이 문맥의 חבל은 지파에게 주어진 할당 몫을 가리키므로, 짧고 자연한 ‘몫’이 적합합니다.
- source_word: לְבַד מֵאֶרֶץ הַגִּלְעָד וְהַבָּשָׁן
  english_pob_choice: besides the land of Gilead and Bashan
  chosen_korean: 그 밖에 길르앗과 바산의 땅은
  alternatives_korean:
  - 길르앗과 바산의 땅 외에
  - 길르앗과 바산의 땅을 제외하고
  lexicon: HALOT
  rationale: לבד는 이미 언급된 분깃과 별도로 더 있음을 나타내므로, 한국어에서는 ‘그 밖에’가 가장 자연스럽습니다.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: which is beyond the Jordan
  chosen_korean: 요단 강 건너편에 있었습니다
  alternatives_korean:
  - 요단 강 저편에 있었습니다
  - 요단을 건너 너머에 있었습니다
  lexicon: HALOT
  rationale: 지리적 위치를 설명하는 관계절이므로, 한국어의 관용 표현인 ‘요단 강 건너편’으로 옮겼습니다.
theological_decisions:
- issue: “떨어졌습니다”가 분배의 우연성만을 뜻하는지 여부
  chosen_reading: 제비를 통한 분배라는 고대 지파 분깃 관용을 살리되, 한국어에서는 결과 중심으로 옮겼습니다.
  alternative_readings:
  - 제비로 주어졌습니다
  - 배당되었습니다
  rationale: 히브리어 נפל은 분깃 문맥에서 관용적으로 사용되며, 본절은 행위 주체보다 분깃의 배정 결과를 강조합니다.
  doctrine_reference: Joshua 17:5 land allotment context
