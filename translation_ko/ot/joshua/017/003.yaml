base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Now Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'And/Now to Zelophehad,' an idiomatic introduction of Zelophehad's case.
    reason: lexical_alternative
  - marker: b
    text: Noah here is Zelophehad's daughter, not the male figure from Genesis.
    reason: cultural_note
translation:
  language: ko
  text: 헤벨의 아들, 길르앗의 아들, 마길의 아들, 므낫세의 아들인 슬로브핫에게는[a] 아들이 없고 딸들만 있었습니다. 그의 딸들의 이름은 말라, 노아[b], 호글라, 밀가, 디르사입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 접두사 וְלִ은 여기에서 슬로브핫의 사안을 새로 도입하는 관용적 표현으로 이해할 수 있습니다.
    reason: source_note
  - marker: b
    text: 여기서 노아는 슬로브핫의 딸이며, 창세기에 나오는 남성 인물 노아가 아닙니다.
    reason: cultural_note
