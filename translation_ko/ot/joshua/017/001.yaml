reference: Joshua 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'Now the lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
  footnotes:
  - marker: a
    text: Or 'the ancestor/founder of Gilead.' The Hebrew 'father of' can denote a progenitor or founder, not only an immediate biological father.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제비뽑기가 므낫세 지파에게 떨어졌습니다. 그가 요셉의 맏아들이었기 때문입니다. 므낫세의 맏아들로서 길르앗의 아버지인 마길에게는, 그가 전사였으므로 길르앗과 바산이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지’는 여기서 직계 부친만이 아니라 조상이나 창시자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  english_pob_choice: the lot fell
  chosen_korean: 제비뽑기가 … 떨어졌습니다
  alternatives_korean:
  - 제비가 … 되었습니다
  - 제비뽑기 결과가 … 나왔습니다
  lexicon: HALOT
  rationale: 제비뽑기라는 절차의 결과를 자연스럽게 옮기면서, 단순한 존재진술이 아니라 배분 결과가 정해졌다는 뉘앙스를 살렸습니다.
- source_word: לְמַטֵּה מְנַשֶּׁה
  english_pob_choice: to the tribe of Manasseh
  chosen_korean: 므낫세 지파에게
  alternatives_korean:
  - 므낫세의 지파에
  - 므낫세 지파를 향하여
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 지파를 뜻하므로 ‘지파’로 옮겼고, 배분 대상임을 드러내기 위해 여격으로 처리했습니다.
- source_word: אֲבִי הַגִּלְעָד
  english_pob_choice: the father of Gilead
  chosen_korean: 길르앗의 아버지인
  alternatives_korean:
  - 길르앗의 아버지
  - 길르앗의 조상인
  lexicon: HALOT
  rationale: 히브리어의 ‘아버지’는 직계 부친뿐 아니라 시조·창시자를 가리킬 수 있으므로, 본문에는 직역을 유지하되 설명적 관계절로 자연스럽게 처리했습니다.
- source_word: אִישׁ מִלְחָמָה
  english_pob_choice: a man of war
  chosen_korean: 전사
  alternatives_korean:
  - 전쟁하는 사람
  - 전투에 능한 사람
  lexicon: HALOT
  rationale: 관용구의 의미를 한국어에서 가장 응축적으로 전달하면서도, 단순한 성격묘사보다 군사적 역량을 분명히 드러내는 표현을 택했습니다.
- source_word: וַיְהִי לוֹ
  english_pob_choice: there belonged
  chosen_korean: …이 있었습니다
  alternatives_korean:
  - …이 그에게 속했습니다
  - …이 그의 몫이었습니다
  lexicon: HALOT
  rationale: 상속·분배 문맥에서 소유보다는 배정된 몫의 의미가 핵심이므로, 한국어에서는 소유사실을 부드럽게 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘요셉의 맏아들’의 설명 기능
  chosen_reading: 므낫세가 요셉의 맏아들이라는 설명을 제비뽑기 배분의 근거로 그대로 제시했습니다.
  alternative_readings:
  - ‘요셉의 첫째 아들’
  - 설명 없이 단순히 이름만 제시
  rationale: 본문은 지파 배분의 근거를 혈통상의 우선권으로 설명하므로, 이 논리를 약화시키지 않도록 ‘맏아들’로 분명히 드러냈습니다.
  doctrine_reference: 창세기 48장 요셉의 두 아들 축복 서사와 지파 상속 구조
- issue: ‘길르앗과 바산이 있었습니다’의 소유 뉘앙스
  chosen_reading: 마길에게 주어진 몫이 영토 분배로 이해되도록 번역했습니다.
  alternative_readings:
  - ‘길르앗과 바산은 그의 것이었습니다’
  - ‘길르앗과 바산이 그에게 속했습니다’
  rationale: 문맥상 단순 소유가 아니라 약속의 땅 분배를 말하므로, 한국어에서도 분배된 몫이라는 신학적·서사적 의미가 유지되도록 했습니다.
  doctrine_reference: 가나안 땅 분배와 언약 성취
