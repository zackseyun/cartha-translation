source:
  edition: WLC
  text: וַֽ/יְדַבְּרוּ֙ בְּנֵ֣י יוֹסֵ֔ף אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר מַדּוּעַ֩ נָתַ֨תָּה לִּ֜/י נַחֲלָ֗ה גּוֹרָ֤ל אֶחָד֙ וְ/חֶ֣בֶל אֶחָ֔ד וַֽ/אֲנִ֣י עַם רָ֔ב עַ֥ד אֲשֶׁר עַד כֹּ֖ה בֵּֽרְכַ֥/נִי יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
  footnotes:
  - marker: a
    text: Or 'and one tract/territory.' The Hebrew word can denote a measured portion of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉의 자손들이 여호수아에게 말했습니다. 「어찌하여 당신은 내가 상속받을 몫으로 한 제비와 한 몫만 주셨습니까? 나는 큰 백성인데, 야훼께서 지금까지 나를 복 주셨습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 몫’은 히브리어 חֶבֶל이 가리킬 수 있는 측량된 토지 구획의 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  english_pob_choice: the sons of Joseph
  chosen_korean: 요셉의 자손들
  alternatives_korean:
  - 요셉의 아들들
  - 요셉의 후손들
  lexicon: HALOT
  rationale: 족속 전체를 가리키는 집합적 표현으로 자연스러운 표준어를 택하되, 직역성을 유지하기 위해 ‘자손들’로 옮겼습니다.
- source_word: נַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 상속받을 몫
  alternatives_korean:
  - 기업으로
  - 유산으로
  - 상속분으로
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘소유’가 아니라 분배된 땅의 몫을 뜻하므로, 현대 한국어에서 의미가 살아나는 ‘상속받을 몫’으로 옮겼습니다.
- source_word: גּוֹרָל אֶחָד וְחֶבֶל אֶחָד
  english_pob_choice: one lot and one portion
  chosen_korean: 한 제비와 한 몫
  alternatives_korean:
  - 한 제비와 한 구획
  - 한 몫과 한 구역
  - 한 제비와 한 지역
  lexicon: HALOT
  rationale: גּוֹרָל은 분배를 위한 ‘제비’, חֶבֶל은 측량된 ‘몫/구획’의 뜻이 있어, 두 어휘의 차이를 살리면서도 문장 흐름이 자연스럽도록 ‘한 제비와 한 몫’으로 처리했습니다.
- source_word: וַאֲנִי עַם רָב
  english_pob_choice: though I am a numerous people
  chosen_korean: 나는 큰 백성인데
  alternatives_korean:
  - 나는 수가 많은 백성인데
  - 나는 많은 백성인데
  - 나는 큰 민족인데
  lexicon: HALOT
  rationale: 직역하면 ‘수효가 많은 백성’이지만, 여기서는 불만 섞인 대조를 드러내는 표현이므로 한국어에서 자연스럽고 간결한 ‘큰 백성인데’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 여호와가 아니라 고유명사 표기인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호수아에게 직접 말하는 요셉 자손의 집합적 1인칭 사용
  chosen_reading: 집단 전체가 하나의 인격처럼 말하는 히브리어 관용을 살려, 1인칭 단수 ‘내가/나를’를 그대로 유지했습니다.
  alternative_readings:
  - ‘우리가/우리를’로 풀어 집단성을 드러내는 번역
  - ‘우리에게’로 바꾸어 현대 한국어에 맞추는 번역
  rationale: 히브리어 원문은 집단을 단수로 의인화해 말하고 있으므로, 그 긴장을 지우지 않기 위해 단수 화자를 유지했습니다.
  doctrine_reference: 히브리어 집합적 단수 관용
