- from: 그때 요셉의 자손들이 여호수아에게 말했습니다. 「어찌하여 당신은 내가 상속받을 몫으로 한 제비와 한 몫만 주셨습니까? 나는 큰 백성인데, 야훼께서 지금까지 나를 복 주셨습니다」[a]
  to: 그때 요셉의 자손들이 여호수아에게 이렇게 말했습니다. “어찌하여 내게 상속 재산으로 제비 하나와 구획 하나[a]만 주셨습니까? 나는 수가 많은 백성인데, 야훼께서 지금까지 나에게 복을 주셨기 때문입니다.”
  rationale: 원문의 토지 분배 어휘를 구별하고, ‘많은 백성’이 수효를 뜻한다는 점을 반영했습니다. 집단이 단수 1인칭으로 말하는 원문의 표현은 ‘내게/나는/나에게’로 유지했습니다. עַד אֲשֶׁר עַד כֹּה는 영어 감사본의 ‘until now’와 원문의 시간적 표현을 따라 ‘지금까지’로 옮겼습니다.
