revisions:
- from: 그들이 제사장 엘르아살과 눈의 아들 여호수아와 지도자들 앞에 나아와 말하되, “야훼께서 모세에게 명령하여 우리에게 우리 형제들 가운데서 상속 재산을 주라고 하셨습니다.” 그래서 그는 야훼의 명령에 따라 그들에게 그들의 아버지 형제들 가운데서 상속 재산을 주었습니다.[a][b]
  to: 그들이 제사장 엘르아살과 눈의 아들 여호수아와 지도자들 앞에 나아와 말하되, “야훼께서 우리 형제들 가운데에서 우리에게 상속 몫을 주라고 모세에게 명령하셨습니다.” 이에 그는 야훼의 명령에 따라[a] 그들에게 그들의 아버지의 형제들 가운데에서 상속 몫을 주었습니다.[b]
  rationale: 번역의 기본 충실성은 유지하면서, 상속 몫이 형제들과 부계 씨족의 분배 범위 안에서 주어진다는 뜻을 현대 한국어로 더 명확하고 자연스럽게 조정했습니다. 히브리어의 친족 관계와 단수 동사에 따른 ‘그는’의 지시 대상은 불필요하게 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
