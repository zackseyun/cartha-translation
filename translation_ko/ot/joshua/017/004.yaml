  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
  footnotes:
  - marker: a
    text: Or, more literally, 'according to the mouth of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among our brothers'; the daughters are asking for a share within the inheritance allotted to their male clan members.
    reason: cultural_note
  - marker: c
    text: Hebrew 'among their father's brothers,' that is, within their paternal clan.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 제사장 엘르아살과 눈의 아들 여호수아와 지도자들 앞에 나아와 말하되, “야훼께서 우리 형제들 가운데에서 우리에게 상속 몫을 주라고 모세에게 명령하셨습니다.” 이에 그는 야훼의 명령에 따라[a] 그들에게 그들의 아버지의 형제들 가운데에서 상속 몫을 주었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역으로는 ‘야훼의 입에 따라’이며, 야훼의 명령 또는 말씀에 따라라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 아버지의 형제들 가운데에서’는 그들의 부계 씨족 안에서를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה / לִפְנֵי
  english_pob_choice: they came near / before
  chosen_korean: “나아와 … 앞에”
  alternatives_korean:
  - “다가와 … 앞에”
  - “나와 … 앞에”
  lexicon: HALOT
  rationale: 문맥상 공적인 청원 장면이므로 ‘나아와’가 단순 이동보다 공식적 출두의 뉘앙스를 잘 살립니다.
- source_word: הַכֹּהֵן / הַנְּשִׂיאִים
  english_pob_choice: the priest / the leaders
  chosen_korean: “제사장 / 지도자들”
  alternatives_korean:
  - “사제 / 우두머리들”
  - “제사장 / 수장들”
  lexicon: HALOT
  rationale: כהן은 제사장으로, נשיאים은 부족·공동체의 대표자들이므로 현대 한국어에서 가장 자연스럽고 기능이 드러나는 ‘지도자들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: “야훼”
  alternatives_korean:
  - “여호와”
  - “주님”
  lexicon: HALOT
  rationale: 본문의 신명은 서술어가 아닌 고유명으로 처리해야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: לָתֶת לָנוּ נַחֲלָה
  english_pob_choice: to give us an inheritance
  chosen_korean: “우리에게 … 상속 재산을 주라고”
  alternatives_korean:
  - “우리에게 … 기업을 주라고”
  - “우리에게 … 유산을 주라고”
  lexicon: HALOT
  rationale: נַחֲלָה는 여호수아서에서 분배된 토지 몫을 가리키므로, 법적·재산적 성격을 살려 ‘상속 재산’으로 옮겼습니다.
- source_word: בְּתוֹךְ אַחֵינוּ / אֲחֵי אֲבִיהֶן
  english_pob_choice: among our brothers / among their father's brothers
  chosen_korean: “우리 형제들 가운데서 / 그들의 아버지 형제들 가운데서”
  alternatives_korean:
  - “우리 형제들 가운데 / 그들의 아버지의 형제들 가운데”
  - “우리 동생들과 형제들 가운데 / 아버지 쪽 친족들 가운데”
  lexicon: HALOT
  rationale: 히브리어의 친족 구조를 흐리지 않기 위해 성별·가계의 구분을 유지한 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 야훼의 명칭 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 이 절은 직접 발화와 서술 모두에서 언약의 이름을 사용하므로, 대체 호칭보다 고유 신명 표기가 원문 의도를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 친족어의 성별·족속 정보 보존
  chosen_reading: ‘우리 형제들’, ‘그들의 아버지 형제들’로 유지했습니다.
  alternative_readings:
  - ‘우리 친족들’
  - ‘그들의 친족들’
  rationale: 본문은 상속권이 남성 친족 몫 안에서 분배된다는 법적 맥락을 지니므로, 중성화보다 원문의 사회적 구분을 보존하는 것이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
