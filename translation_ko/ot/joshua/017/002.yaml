language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
  footnotes:
  - marker: a
    text: Or 'the rest of the descendants of Manasseh.' The Hebrew literally says 'the remaining sons of Manasseh.'
    reason: lexical_alternative
  - marker: b
    text: '''Clans'' renders Hebrew mishpechot, a kinship subdivision within a tribe; ''families'' is a possible alternative.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'the male sons' emphasizes that these are the male lines of Manasseh, in contrast to the daughters of Zelophehad mentioned in the surrounding passage.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그것은 므낫세의 남은 자손들에게, 그들의 종족대로 해당되었습니다. 곧 아비에셀 자손과 헬렉 자손과 아스리엘 자손과 세겜 자손과 헤벨 자손과 스미다 자손에게 해당되었습니다. 이들은 요셉의 아들 므낫세의 남자 자손들이며, 그들의 종족대로였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘므낫세의 남은 자손들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종족’은 히브리어 mishpechot이 가리키는 지파 내부의 친족 하위 단위를 옮긴 것입니다.
    reason: cultural_note
  - marker: c
    text: ‘남자 자손들’은 바로 앞의 슬로브핫 딸들과 대비되는 남계 계열을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it was
  chosen_korean: 그리고 그것은 ... 해당되었습니다
  alternatives_korean:
  - 그리고 이는 ... 있었습니다
  - 그리고 ...에 속하였습니다
  lexicon: HALOT
  rationale: 할당문 맥락에서 וַיְהִי를 단순한 존재 동사로 옮기기보다, 분배·귀속을 드러내는 표현으로 처리하여 문맥 기능을 살렸습니다.
- source_word: הַנּוֹתָרִים
  english_pob_choice: the remaining
  chosen_korean: 남은
  alternatives_korean:
  - 남아 있는
  - 나머지
  lexicon: HALOT
  rationale: 지파 안의 예외적 남은 계열들을 가리키므로, 간결하면서도 잔여성을 분명히 하는 ‘남은’이 가장 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가문대로
  - 그들의 가족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 내부의 친족 하위 단위를 가리키므로, 현대 한국어에서는 교회적 ‘가족’보다 ‘종족’이 더 근접한 제도적·혈연적 뉘앙스를 보존합니다.
- source_word: לִבְנֵי / בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 후손
  lexicon: HALOT
  rationale: 반복되는 계보 공식은 한국어에서 ‘자손’으로 옮겨 이름들을 군집 단위로 자연스럽게 연결하되, 직역성이 필요한 경우는 그대로 살렸습니다.
- source_word: הַזְּכָרִים
  english_pob_choice: the male sons
  chosen_korean: 남자 자손들
  alternatives_korean:
  - 남성들
  - 남자들
  lexicon: HALOT
  rationale: 직전 문맥의 슬로브핫 딸들과 대비되는 남계 계보를 표시하므로, ‘남자 자손들’로 성별과 혈통 기능을 함께 드러냈습니다.
theological_decisions:
- issue: 계보 목록의 문체와 의미 보존
  chosen_reading: 명단형 분배 문맥을 따라 설명을 덧붙이지 않고, 귀속과 계보를 드러내는 간결한 서술로 옮겼습니다.
  alternative_readings:
  - ‘몫이 있었다’처럼 더 풀어 쓰는 번역
  - ‘가문들’로 일반화하는 번역
  rationale: 이 절은 신학적 진술보다 토지 분배의 법정·행정적 기록에 가깝기 때문에, 목록의 형식성과 혈통 구분을 유지하는 것이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 민수기 26장과 여호수아의 지파 분배 맥락
