  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: ko
  text: 산지[a]는 너희의 것이 될 것입니다. 그곳은 숲이니, 너희는 그것을 개간하십시오. 그 가장자리[b]까지 너희의 것이 될 것입니다. 가나안 사람들[c]이 철 병거를 갖추고 있고 강하지만, 너희는 그들을 쫓아낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산’. 히브리어 하르(הַר)는 ‘산’을 뜻할 수도 있고, 이 문맥처럼 영토로 언급될 때에는 ‘산지’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그것의 끝들/바깥 경계들’을 뜻합니다. 숲이 있는 산지의 가장 먼 범위나 경계를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수형 ‘가나안 사람’을 집합적으로 사용합니다.
    reason: lexical_alternative
