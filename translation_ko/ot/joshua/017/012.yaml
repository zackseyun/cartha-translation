  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
  footnotes:
  - marker: a
    text: Or 'the Canaanite was determined to dwell in this land.' The Hebrew uses a singular collective noun and a verb that can denote willingness or resolve.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 므낫세의 아들들은 이 도시들을 쫓아내지 못했고, 가나안 사람들은 이 땅에 머물기로 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람은 이 땅에 살기로 결심했습니다.’ 히브리어는 단수 집합명사와 의지·결심을 나타낼 수 있는 동사를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵ֣י מְנַשֶּׁ֔ה
  english_pob_choice: the sons of Manasseh
  chosen_korean: 므낫세의 아들들
  alternatives_korean:
  - 므낫세 자손
  - 므낫세 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘아들들’을 살리되, 한국어에서는 부족 집단을 자연스럽게 나타내는 소유격 표현으로 옮겼습니다.
- source_word: לְהוֹרִ֖ישׁ
  english_pob_choice: to dispossess
  chosen_korean: 쫓아내지 못했고
  alternatives_korean:
  - 몰아내지 못했고
  - 내쫓지 못했고
  lexicon: HALOT
  rationale: 정복·추방 맥락에서 ‘dispossess’는 단순 이동보다 점유 상실을 포함하지만, 한국어에서는 문맥상 가장 자연스러운 결과 중심 표현으로 ‘쫓아내다’를 택했습니다.
- source_word: וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת
  english_pob_choice: the Canaanites persisted in dwelling
  chosen_korean: 가나안 사람들은 이 땅에 머물기로 했습니다
  alternatives_korean:
  - 가나안 사람들은 이 땅에 거하기를 원했습니다
  - 가나안 사람들은 이 땅에 계속 살기로 했습니다
  lexicon: HALOT
  rationale: וַיּוֹאֶל은 ‘기꺼이/결심하다’의 뉘앙스를 담으므로, 단순한 반복 동작보다 의지의 결단을 드러내는 ‘머물기로 했습니다’로 옮겼습니다.
- source_word: בָּ/אָ֥רֶץ הַ/זֹּֽאת
  english_pob_choice: in this land
  chosen_korean: 이 땅에
  alternatives_korean:
  - 이 지역에
  - 이 나라에
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 약속/정복의 지리적 영역을 가리키므로, 한국어의 표준적인 토지·영토 표현인 ‘이 땅’이 가장 적절합니다.
theological_decisions:
- issue: וַיּוֹאֶל의 의미를 행동의 반복이 아니라 의지의 결단으로 어떻게 반영할지
  chosen_reading: ‘머물기로 했습니다’로 옮겨 가나안 사람들의 의도적 잔류를 드러냈습니다.
  alternative_readings:
  - ‘계속 살았습니다’
  - ‘살기로 동의했습니다’
  rationale: 본문은 이스라엘의 실패와 더불어 가나안 사람들의 결심을 보여 주므로, 반복적 지속보다 의지적 잔류가 더 정확합니다.
  doctrine_reference: 본문 주해/서사 뉘앙스
