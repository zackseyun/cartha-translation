translation:
  language: ko
  text: 그러나 므낫세 자손은 이 도시들을 쫓아내지 못했고, 가나안 사람들은 이 땅에 머물기로 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람은 이 땅에 살기로 결심했습니다.’ 히브리어는 단수 집합명사와 의지나 결심을 나타낼 수 있는 동사를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵ֣י מְנַשֶּׁ֔ה
  english_pob_choice: the sons of Manasseh
  chosen_korean: 므낫세의 아들들
  alternatives_korean:
