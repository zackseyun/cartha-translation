reference: Joshua 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
  footnotes:
  - marker: a
    text: Or 'the three regions' or 'the three districts.' The Hebrew phrase is difficult and may refer to a geographical or administrative grouping.
    reason: lexical_alternative
  - marker: b
    text: Literally 'its daughters,' a Hebrew idiom for a town's dependent villages or settlements.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 므낫세에게는 잇사갈과 아셀 안에 벧스안과 그 딸린 마을들[a], 이블르암과 그 딸린 마을들, 도르의 주민들과 그 딸린 마을들, 엔돌의 주민들과 그 딸린 마을들, 다아낙의 주민들과 그 딸린 마을들[b], 그리고 므깃도의 주민들과 그 딸린 마을들이 있었는데, 이 셋은 높지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 지역’ 혹은 ‘세 구역’입니다. 히브리어 구절은 어렵고, 지리적 또는 행정적 묶음을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 딸들’로, 본읍에 딸린 종속 마을들을 가리키는 히브리어 관용입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  english_pob_choice: And Manasseh had
  chosen_korean: 그리고 므낫세에게는 ... 있었습니다
  alternatives_korean:
  - 그리고 므낫세에게 속하였습니다
  - 그리고 므낫세에게 있었습니다
  lexicon: HALOT
  rationale: וַיְהִי לְ는 지파의 몫/소유를 소개하는 관용으로 보아, 한국어에서는 자연스럽게 ‘있었습니다’로 옮기되 지파에게 할당된 토지라는 의미를 살렸습니다.
- source_word: בְּנוֹתֶי/הָ
  english_pob_choice: its daughter villages
  chosen_korean: 그 딸린 마을들
  alternatives_korean:
  - 그 딸들
  - 그 부속 마을들
  - 그 주변 마을들
  lexicon: HALOT
  rationale: 직역하면 ‘그의 딸들’이지만, 히브리어 관용으로 본읍에 딸린 종속 정착지를 뜻하므로 의미를 분명히 하면서도 관계를 살린 ‘딸린 마을들’을 택했습니다.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  english_pob_choice: the three regions
  chosen_korean: 이 셋은 높지였습니다
  alternatives_korean:
  - 이 셋은 지역이었습니다
  - 이 셋은 구역이었습니다
  - 이 셋은 높은 곳이었습니다
  lexicon: HALOT
  rationale: נָפֶת은 문맥상 지리적/행정적 단위를 가리키며, 영어 POB도 의미의 난점을 드러냅니다. 한국어로는 ‘높지’라는 지리적 뉘앙스를 최대한 보존하되, 본문의 목록을 가리키는 종결 진술로 처리했습니다.
