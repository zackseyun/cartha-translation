base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
  footnotes:
  - marker: a
    text: Or 'they circled the city once.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Thus they did six days,' meaning this pattern was repeated for six days.
    reason: lexical_alternative
translation:
  language: ko
  text: 이튿날에도 그들은 성을 한 번 돌고 진으로 돌아왔습니다. 이렇게 그들은 엿새 동안 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성을 한 번 돌고’는 히브리어 פַּעַם אַחַת의 직접적 반영입니다.
    reason: source_note
  - marker: b
    text: ‘진’은 히브리어 הַמַּחֲנֶה의 군사적 맥락을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּסֹבּוּ / went around
  english_pob_choice: they went around
  chosen_korean: 성을 한 번 돌고
  alternatives_korean:
  - 성을 둘러가고
  - 성을 돌고
  lexicon: HALOT
  rationale: סבב는 ‘돌다, 둘러가다’의 뜻이므로, 서사 흐름을 살리면서도 자연스러운 현대 한국어로 ‘한 번 돌고’라고 옮겼습니다.
- source_word: פַּעַם אַחַת / once
  english_pob_choice: once
  chosen_korean: 한 번
  alternatives_korean:
  - 한 차례
  - 한 번씩
  lexicon: HALOT
  rationale: 히브리어의 ‘한 번’이라는 수량 표현을 직접 살려, 반복 동작의 1회성을 분명히 했습니다.
- source_word: הַמַּחֲנֶה / the camp
  english_pob_choice: to the camp
  chosen_korean: 진으로
  alternatives_korean:
  - 캠프로
  - 진영으로
  lexicon: HALOT
  rationale: מַחֲנֶה는 군사적 ‘진, 진영’을 뜻하므로, 여리고 포위 맥락에 맞게 ‘진’으로 옮겼습니다.
- source_word: כֹּה עָשׂוּ שֵׁשֶׁת יָמִים / Thus they did for six days
  english_pob_choice: Thus they did for six days
  chosen_korean: 이렇게 그들은 엿새 동안 했습니다
  alternatives_korean:
  - 이와 같이 그들은 엿새 동안 했습니다
  - 이렇게 그들은 엿새 동안 그렇게 했습니다
  lexicon: HALOT
  rationale: כֹּה + עָשׂוּ는 앞의 행위를 요약하는 관용적 마무리이므로, ‘이렇게’와 ‘했습니다’로 간결하게 대응했습니다.
theological_decisions:
- issue: 회중이 여리고를 도는 행위의 묘사에 설교적 의미를 덧붙일지 여부
  chosen_reading: 본문의 반복된 행위를 담담하게 서술하고, 상징적 의미는 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - 순종의 상징
  - 인내의 영적 훈련
  rationale: 이 절 자체는 결과보다 행위의 반복을 기록하는 서술문이므로, 본문이 말하는 범위를 넘는 해석을 본문 번역에 주입하지 않았습니다.
  doctrine_reference: 본문 중심 번역 원칙
