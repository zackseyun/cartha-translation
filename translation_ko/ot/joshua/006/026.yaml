  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
  footnotes:
  - marker: a
    text: 'Or ''adjured them'' / ''put them under oath.'' The Hebrew verb is causative: Joshua caused the people to swear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Cursed before the LORD is anyone who rises up and rebuilds this city.' Hebrew 'the man' is grammatically masculine singular and functions generically here.
    reason: lexical_alternative
  - marker: c
    text: Literally 'with/in his firstborn ... and with/in his youngest.' The expression likely means 'at the cost of' them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아는 백성에게 맹세시키며 이렇게 말했습니다. 「야훼 앞에서 저주받을 자는 누구든 이 성, 곧 여리고를 일으켜 다시 세우는 사람입니다. 그는 맏아들을 대가로 그 성의 기초를 놓고, 막내를 대가로 그 성문을 세울 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 사역형은 여호수아가 직접 맹세한 것이 아니라 백성에게 맹세하게 한 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그 사람”이며, 여기서는 이 일을 하는 누구에게나 적용되는 일반적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “그의 맏아들로/그의 막내로”입니다. 문맥상 자녀를 치르는 대가를 가리키지만, 상실의 정확한 방식은 본문이 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  english_pob_choice: made them swear
  chosen_korean: 맹세하게 하여
  alternatives_korean:
  - 맹세시켜
  - 맹세하도록 하여
  - 맹세시켰습니다
  lexicon: HALOT
  rationale: 히필형은 여호수아가 단순히 스스로 맹세한 것이 아니라 다른 이들에게 맹세를 하게 한 뜻이므로, 한국어에서는 원인·사역을 살린 표현을 택했습니다.
- source_word: אָרוּר הָאִישׁ
  english_pob_choice: Cursed ... is the man
  chosen_korean: 저주를 받을 사람은 누구든
  alternatives_korean:
  - 저주받을 사람은
  - 저주받은 그 사람은
  - 저주를 받는 자는
  lexicon: HALOT
  rationale: 히브리어의 남성 단수형이 여기서는 포괄적으로 기능하므로, 자연스러운 현대 한국어에서 성별을 과도하게 드러내지 않으면서도 경고문 형식을 살렸습니다.
- source_word: בִּבְכֹרֹו / וּבִצְעִירֹו
  english_pob_choice: At the cost of his firstborn ... and at the cost of his youngest
  chosen_korean: 맏아들 때문에 ... 막내 때문에
  alternatives_korean:
  - 맏아들을 대가로 ... 막내를 대가로
  - 맏아들로 ... 막내로
  - 첫째 아들 때문에 ... 막내 아들 때문에
  lexicon: HALOT
  rationale: 전치사 בְּ의 관용적 희생·대가 의미를 한국어의 '때문에'로 완화하지 않고, 문맥상 감당해야 할 손실을 드러내는 방향으로 옮겼습니다. '맏아들/막내'는 가족 내 서열을 분명히 하면서도 원문의 압축성을 유지합니다.
- source_word: יְיַסְּדֶנָּה / יַצִּיב דְּלָתֶיהָ
  english_pob_choice: he will lay its foundation / he will set up its gates
  chosen_korean: 그 성의 기초를 놓고 ... 그 성문을 세울 것입니다
  alternatives_korean:
  - 그 성의 기초를 놓고 ... 그 성문을 세울 것입니다
  - 그 성의 기초를 놓고 ... 문들을 세울 것입니다
  - 그 성의 터를 닦고 ... 문을 세울 것입니다
  lexicon: HALOT
  rationale: יסד와 דלתים의 건축·성곽 문맥을 따라, 추상화하지 않고 도시 재건의 실제 행위를 한국어로 대응시켰습니다. '성문'은 성곽 구조를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 맹세의 신학적 무게
  chosen_reading: 야훼 앞에서 선포된 공적 저주로 번역해, 단순한 개인적 선언이 아니라 언약적·종교적 경고임을 드러냈습니다.
  alternative_readings:
  - 주 앞에서
  - 주님 앞에서
  - 여호와 앞에서
  rationale: 본문의 לִפְנֵי יְהוָה는 하나님의 임재 앞에서의 엄숙한 선포를 뜻하므로, 프로젝트 규정에 따라 '야훼'를 유지하고 공적 저주의 성격을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH is rendered as 야훼 in the main text; preserve theological force of curse language without domestication.'
- issue: 아들들의 '대가'가 무엇을 뜻하는지
  chosen_reading: 본문이 명시하지 않는 자녀 희생의 방식은 단정하지 않고, 재건에 따르는 치명적 상실로 남겨 두었습니다.
  alternative_readings:
  - 자녀 희생 제사
  - 건축 중의 우연한 불행
  - 단순한 경제적 손실
  rationale: 히브리어는 재건의 각 단계와 연결된 극심한 상실을 말할 뿐, 정확한 방식까지 설명하지 않으므로 '때문에'로 번역해 의미를 과장하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Do not resolve textual ambiguity beyond what the source states; preserve tension where the source is non-specific.'
