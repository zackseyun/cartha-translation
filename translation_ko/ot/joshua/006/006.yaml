  naturalness: 합쇼체의 직접 명령으로 ‘메십시오’와 ‘메고 가십시오’를 사용하면 자연스럽고, 제사장들의 행렬 및 운반이라는 맥락도 분명합니다. ‘메고 가게 하십시오’는 한국어에서 다소 우회적이므로 직접 지시로 고쳤습니다.
