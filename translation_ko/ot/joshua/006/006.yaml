  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
  footnotes:
  - marker: a
    text: Or “seven trumpets of rams’ horns.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the ark of Yahweh.” Main text follows the project’s default rendering of the divine name as “the LORD.”'
    reason: alternative_reading
translation:
  language: ko
  text: 눈의 아들 여호수아가 제사장들을 불러 그들에게 말했습니다. “언약궤를 메십시오. 일곱 제사장은 야훼의 궤 앞에서 일곱 숫양뿔 나팔을 메고 가십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 부르셨습니다
  lexicon: HALOT
  rationale: 여호수아가 제사장들을 직접 호명해 지시하는 맥락이므로, 한국어에서는 자연스럽고 바로 이해되는 ‘불러’가 가장 적절합니다.
- source_word: שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִית
  english_pob_choice: Carry the ark of the covenant
  chosen_korean: 언약궤를 메십시오
  alternatives_korean:
  - 언약궤를 들고 가십시오
  - 언약궤를 운반하십시오
  lexicon: HALOT
  rationale: אָרוֹן은 단순히 ‘들다’보다 이동을 위해 몸에 지고 가는 뜻이 강해, 한국어 성경 문맥에 맞는 ‘메다’를 택했습니다.
- source_word: שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים
  english_pob_choice: seven ram’s-horn trumpets
  chosen_korean: 일곱 나팔
  alternatives_korean:
  - 일곱 숫양뿔 나팔
  - 일곱 양각나팔
  lexicon: HALOT
  rationale: שׁוֹפָר의 기본 의미는 ‘나팔/뿔나팔’이지만, 한국어에서 본문이 요구하는 기능적 의미를 간결하게 드러내기 위해 ‘나팔’로 옮기고, ‘יוֹבְלִים’의 구체적 뿔 재질은 직역 과잉을 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 용례에 따라 신명은 한국어 본문에서도 ‘야훼’로 옮겨, 본문의 고유 신명 표지를 보존했습니다.
theological_decisions:
- issue: 언약궤와 야훼의 궤의 병기
  chosen_reading: 본문의 첫 명령은 ‘언약궤’로, 마지막 구는 ‘야훼의 궤’로 옮겨 같은 대상을 지칭하는 연결을 드러냈습니다.
  alternative_readings:
  - 두 곳 모두 ‘언약궤’로 통일
  - 두 곳 모두 ‘야훼의 궤’로 통일
  rationale: 히브리어 본문은 같은 궤를 서술적으로 두 번 부르며, 후반부는 신명 표지를 분명히 합니다. 한국어에서도 반복을 유지해 명령과 위치 설명의 대비를 살렸습니다.
  doctrine_reference: YHWH divine name rendering / source-level referential consistency
