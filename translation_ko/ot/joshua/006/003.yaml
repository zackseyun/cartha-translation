source:
  edition: WLC
  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
  footnotes:
  - marker: a
    text: Or 'all the fighting men' or 'all the warriors.' The Hebrew is literally 'all the men of war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전쟁에 나가는 모든 남자들은 성읍 주위를 돌고, 성읍을 한 번 두르십시오. 당신은 이렇게 엿새 동안 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסַבֹּתֶם
  english_pob_choice: you shall march around
  chosen_korean: 너희는 성읍을 돌되
  alternatives_korean:
  - 너희는 성읍 주위를 돌되
  - 너희는 성읍을 행군하며 돌되
  lexicon: HALOT
  rationale: 둘째 인칭 복수의 명령·지시 흐름을 살리면서, 군사적 맥락을 반영해 너무 중립적인 ‘돌다’만으로 끝내지 않고 문맥상 자연스럽게 옮겼습니다.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: all the men of war
  chosen_korean: 전투에 나선 모든 사람
  alternatives_korean:
  - 모든 전쟁의 사람들
  - 모든 전투원
  lexicon: HALOT
  rationale: 히브리어의 남성형 표현을 그대로 풀면 ‘전쟁/전투의 사람들’이지만, 한국어에서는 어색함을 줄이면서도 군사 집단을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: פַּעַם אֶחָת
  english_pob_choice: once
  chosen_korean: 한 번씩
  alternatives_korean:
  - 한 차례
  - 한 번
  lexicon: HALOT
  rationale: 각 날마다 성읍을 한 바퀴씩 도는 반복·단회 행동을 자연스럽게 드러내는 한국어 표현입니다.
- source_word: תַעֲשֶׂה שֵׁשֶׁת יָמִים
  english_pob_choice: Thus you shall do for six days
  chosen_korean: 이렇게 엿새 동안 해야 합니다
  alternatives_korean:
  - 이처럼 엿새 동안 하십시오
  - 그렇게 여섯 날 동안 해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 지시적 부사 כֹּה와 기간 표현을 살려, 행동 방식과 기간을 함께 명확히 전달했습니다.
theological_decisions:
- issue: 2인칭 복수와 단수의 전환
  chosen_reading: 앞부분은 ‘너희는’으로 복수를 살리고, 마지막은 명령형 전체를 현대 한국어의 지시문으로 정리했습니다.
  alternative_readings:
  - 전체를 복수로 평탄화
  - 전체를 단수로 평탄화
  rationale: 히브리어는 복수 지시 뒤에 단수형으로 전환되는데, 한국어에서는 이 구분을 과도하게 강조하면 문장이 부자연스러워져서, 흐름을 해치지 않는 범위에서 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 5
