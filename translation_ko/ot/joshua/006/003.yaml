revisions:
- from: 너희는 성읍을 돌되, 전투에 나선 모든 사람은 성읍을 한 번씩 돌십시오. 이렇게 엿새 동안 해야 합니다.[a]
  to: 전쟁에 나가는 모든 남자들은 성읍 주위를 돌고, 성읍을 한 번 두르십시오. 당신은 이렇게 엿새 동안 하십시오.
  rationale: 원문의 반복적 표현(성읍을 돌다/성읍을 두르다)을 한국어에서도 유지하되, 초안의 어색한 주어 전환을 바로잡았습니다. ‘모든 남자들’로 군사 집단의 남성 지시를 보존했고, 마지막 지시에는 ‘당신은’을 사용하여 히브리어의 복수에서 단수로의 전환을 드러냈습니다.
  reviewer_model: gpt-5.6-terra
