source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
  footnotes:
  - marker: a
    text: Or 'seven jubilee trumpets' or 'seven rams’ horns.' The Hebrew expression refers to shofars made from or associated with rams’ horns.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 제사장은 야훼의 궤 앞에서 일곱 숫양 뿔 나팔[a]을 들고 계속 걸어가면서 나팔을 불었습니다. 무장한 자들은 그들 앞서 가고 있었고, 후위대는 야훼의 궤 뒤를 따라가면서 계속 나팔을 불었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 희년 나팔’ 또는 ‘일곱 숫양 뿔’로 옮길 수 있습니다. 히브리어 표현은 숫양 뿔로 만들었거나 숫양 뿔과 관련된 쇼파르를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה הַכֹּהֲנִים
  english_pob_choice: the seven priests
  chosen_korean: 일곱 제사장
  alternatives_korean:
  - 일곱 사제
  - 일곱 성직자
  lexicon: HALOT
  rationale: כֹּהֵן은 제의적 직분을 가리키므로 한국어 성경의 기본 용례인 ‘제사장’이 가장 직접적입니다.
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  english_pob_choice: ram’s-horn trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 숫양 뿔 나팔
  - 희년 나팔
  - 쇼파르
  lexicon: HALOT
  rationale: 여기서는 שׁוֹפָר의 기능이 ‘불어 부는 나팔’로 드러나므로, 본문 흐름을 살려 ‘나팔’로 옮기되 주석으로 희년/숫양 뿔의 뉘앙스를 보완할 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 통상적 대체어가 아니라 고유명사이므로, 본 지침에 따라 ‘야훼’로 음역했습니다.
- source_word: הַחָלוּץ
  english_pob_choice: the armed men
  chosen_korean: 무장한 자들
  alternatives_korean:
  - 선두 부대
  - 전위대
  - 무장 병사들
  lexicon: HALOT
  rationale: 군사적으로 앞장서는 집단을 가리키지만, 특정 병종을 과도하게 한정하지 않도록 ‘무장한 자들’로 처리했습니다.
- source_word: הַמְאַסֵּף
  english_pob_choice: the rear guard
  chosen_korean: 후위대
  alternatives_korean:
  - 뒤를 맡은 자들
  - 후미 경계대
  lexicon: HALOT
  rationale: 행렬의 뒤를 맡는 군사적 집단이라는 점을 반영하여, 관용적이면서도 기능이 분명한 ‘후위대’를 선택했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 언약 이름 יְהוָה를 반복하므로, 호칭으로 바꾸지 않고 고유 이름을 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 반복 동작의 서술
  chosen_reading: ‘계속 나팔을 불고 있었습니다’
  alternative_readings:
  - 나팔을 계속 불었습니다
  - 나팔을 불며 계속 갔습니다
  rationale: 히브리어의 진행·지속 뉘앙스(הלך + תקע)를 한국어 진행형으로 살려, 행렬의 지속성을 드러냈습니다.
  doctrine_reference: POB style guide — durative/action sequence rendering
