  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה כֹהֲנִ֡ים יִשְׂאוּ֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י הָ/אָר֔וֹן וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י תָּסֹ֥בּוּ אֶת הָ/עִ֖יר שֶׁ֣בַע פְּעָמִ֑ים וְ/הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּ/שּׁוֹפָרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
  footnotes:
  - marker: a
    text: Or “seven rams’ horns” or “seven shofars of ram’s horn.” The Hebrew phrase refers to horn instruments, likely made from ram’s horns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱 제사장은 언약궤 앞에서 숫양 뿔 나팔 일곱 개를[a] 들어야 합니다. 일곱째 날에는 너희가 성읍을 일곱 번 돌아야 하며, 제사장들은 나팔을 불어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “숫양의 뿔 일곱 개” 또는 “숫양 뿔 쇼파르 일곱 개”입니다. 히브리어 표현은 뿔로 만든 악기를 가리키며, 아마도 숫양의 뿔로 만든 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה כֹהֲנִים
  english_pob_choice: seven priests
  chosen_korean: 제사장 일곱
  alternatives_korean:
  - 일곱 제사장
  - 제사장 일곱 명
  lexicon: WLC
  rationale: 히브리어는 수사+명사 구조이므로 한국어에서도 자연스럽게 수사 뒤에 명사를 두어 간결하게 옮겼습니다.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  english_pob_choice: ram’s-horn trumpets
  chosen_korean: 양의 뿔 나팔
  alternatives_korean:
  - 숫양의 뿔 나팔
  - 숫양 뿔 나팔
  - 쇼파르
  lexicon: HALOT
  rationale: שׁוֹפָר의 기본 의미는 뿔 나팔이며, יּוֹבְלִים은 그 재료를 가리키는 관형 표현으로 보아 ‘양의 뿔 나팔’이 기능과 재료를 함께 살립니다.
- source_word: לִפְנֵי הָאָרוֹן
  english_pob_choice: before the ark
  chosen_korean: 언약궤 앞에서
  alternatives_korean:
  - 궤 앞에서
  - 언약궤 앞에
  lexicon: HALOT
  rationale: הָאָרוֹן은 여기서 문맥상 언약궤이므로 한국어 성경에서 널리 쓰이는 ‘언약궤’로 옮기되, לִפְנֵי의 위치 관계는 ‘앞에서’로 자연스럽게 표현했습니다.
- source_word: תָּסֹבּוּ
  english_pob_choice: you shall march around
  chosen_korean: 너희가 성읍을 일곱 번 둘러야 하고
  alternatives_korean:
  - 너희가 성읍을 일곱 번 돌아야 하고
  - 너희가 성읍을 일곱 번 에워싸야 하고
  lexicon: HALOT
  rationale: סבב는 ‘돌다/둘러서 가다’의 뜻이며, 이 행진 명령의 맥락에서는 ‘둘러야 하다’가 가장 자연스럽고 과도한 해석을 덜어 줍니다.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  english_pob_choice: shall blow the trumpets
  chosen_korean: 나팔을 불어야 합니다
  alternatives_korean:
  - 나팔을 불 것입니다
  - 뿔 나팔을 불어야 합니다
  lexicon: HALOT
  rationale: תקע + בְּ + שׁוֹפָר의 관용구를 한국어의 ‘나팔을 불다’로 자연스럽게 옮겼습니다. 앞부분에서 이미 악기를 밝힌 만큼 여기서는 반복을 줄였습니다.
theological_decisions:
- issue: 제사장들이 들고 가는 כלי(기구)의 명칭을 한국어 전통어와 직접어 중 어떻게 처리할지
  chosen_reading: ‘언약궤’와 ‘양의 뿔 나팔’로 직접적이고 구체적으로 옮겼습니다.
  alternative_readings:
  - ‘법궤’
  - ‘쇼파르’
  - ‘양각 나팔’
  rationale: 본문의 장면은 출애굽기-여호수아 전승의 실제 행진 명령이므로, 전통 교회어보다 원문이 드러내는 구체성을 우선했습니다.
  doctrine_reference: 성경 번역의 원문 충실성 및 역사서 서술의 구체성
