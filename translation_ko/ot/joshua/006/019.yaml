  - 주
  rationale: 원문이 יהוה를 직접 사용하므로, 본 시안은 프로젝트 기본값에 따라 언약적 고유이름을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
