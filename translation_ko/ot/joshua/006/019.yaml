source:
  edition: WLC
  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the LORD's treasury'; Hebrew 'treasury of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew has singular 'is holy' and 'shall come/go,' treating the listed metals and objects as a collective whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모든 은과 금과 청동과 철로 된 그릇은 야훼께 거룩한 것입니다. 그것들은 야훼의 보물 창고[a]로 들어갈 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 곳간’. 히브리어는 ‘야훼의 보물 창고’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 앞에 열거된 것들을 하나의 집합으로 보아 ‘거룩한 것이다’와 ‘들어갈 것이다’를 단수로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל כֶּ֣סֶף וְ/זָהָ֗ב
  english_pob_choice: But all the silver and gold
  chosen_korean: 그러나 은과 금
  alternatives_korean:
  - 그리고 은과 금
  - 또 은과 금
  lexicon: HALOT
  rationale: 문맥상 앞선 금지와 대비를 이루는 뉘앙스가 있어 ‘그러나’로 자연스럽게 살리고, כֶּסֶף/זָהָב는 여기서 금속명칭이므로 ‘은과 금’으로 직역에 가깝게 옮겼습니다.
- source_word: וּ/כְלֵ֤י נְחֹשֶׁת֙ וּ/בַרְזֶ֔ל
  english_pob_choice: and the vessels of bronze and iron
  chosen_korean: 놋과 철 그릇
  alternatives_korean:
  - 놋과 철의 그릇
  - 청동과 철 그릇
  lexicon: HALOT
  rationale: כְּלִי는 물건/기물의 넓은 말이지만 성소 재정 맥락에서 ‘그릇’이 가장 자연스럽고, נְחֹשֶׁת은 한국어 성경 관용에 맞는 ‘놋’으로, בַרְזֶל은 ‘철’로 옮겼습니다.
- source_word: קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה
  english_pob_choice: are holy to Yahweh
  chosen_korean: 모두 야훼께 거룩합니다
  alternatives_korean:
  - 야훼께 거룩합니다
  - 야훼를 위해 거룩합니다
  - 야훼께 바쳐진 거룩한 것입니다
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 앞의 목록 전체를 집합적으로 가리키므로 한국어에서는 ‘모두’로 그 집합성을 드러냈고, קֹדֶשׁ은 단순한 소유보다 구별·봉헌의 상태를 나타내므로 ‘거룩합니다’가 가장 직접적입니다.
- source_word: אוֹצַ֥ר יְהוָ֖ה
  english_pob_choice: the treasury of Yahweh
  chosen_korean: 야훼의 곳간
  alternatives_korean:
  - 야훼의 창고
  - 야훼의 보물창고
  - 야훼의 금고
  lexicon: HALOT
  rationale: אוֹצָר는 재물 보관소/창고를 뜻하므로 ‘곳간’이 문맥상 가장 자연스럽고, 전리품이 성소 용도로 보관될 장소라는 점을 살렸습니다.
- source_word: יָבֽוֹא
  english_pob_choice: they shall go into
  chosen_korean: 들어갈 것입니다
  alternatives_korean:
  - 들어갑니다
  - 들어가게 될 것입니다
  - 들어오게 될 것입니다
  lexicon: HALOT
  rationale: 동사는 단수형이지만 앞의 집합적 대상에 맞춰 한국어에서는 복수 호응의 미래로 풀었고, ‘들어갈 것입니다’가 문맥의 지시적 미래를 가장 자연스럽게 반영합니다.
theological_decisions:
