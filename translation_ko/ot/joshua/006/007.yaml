  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
  footnotes:
  - marker: a
    text: Or “the vanguard,” that is, the armed men going ahead of the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 백성에게 말했습니다. “앞으로 나아가 성을 돌아라. 그리고 무장한 자들이 야훼의 언약궤 앞에서 지나가게 하라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무장한 자들’은 전투 대형의 선두, 곧 ‘전위대’라는 뜻으로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־הָעָם
  english_pob_choice: And they said to the people
  chosen_korean: 그들은 백성에게 말했습니다
  alternatives_korean:
  - 그들은 사람들에게 말했습니다
  - 그들은 군중에게 말했습니다
  lexicon: HALOT
  rationale: אֶל־הָעָם은 직역하면 ‘백성에게’이며, 군사적 상황이지만 ‘백성’이 원문의 일반적 의미를 가장 직접적으로 살립니다.
- source_word: עִבְרוּ
  english_pob_choice: Pass on
  chosen_korean: 앞으로 나아가
  alternatives_korean:
  - 지나가십시오
  - 전진하십시오
  lexicon: HALOT
  rationale: עבר의 명령형은 여기서 경계를 넘는 ‘건너라’가 아니라 행진 순서상 앞으로 움직이라는 뜻이므로, 자연스럽고 문맥에 맞는 ‘앞으로 나아가’로 옮겼습니다.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  english_pob_choice: and go around the city
  chosen_korean: 성을 돌아라
  alternatives_korean:
  - 성을 빙 돌아라
  - 성을 에워싸라
  lexicon: HALOT
  rationale: סבב는 ‘돌다/둘러가다’의 의미이므로, 행진 동작을 간결하게 살린 ‘성을 돌아라’가 적절합니다.
- source_word: וְהֶחָלוּץ
  english_pob_choice: the armed men
  chosen_korean: 무장한 자들
  alternatives_korean:
  - 선두대
  - 전위대
  - 무장병들
  lexicon: HALOT
  rationale: חָלוּץ는 전위 개념을 내포하지만, 영어 POB가 본문에서는 ‘the armed men’로 두고 주석에서 ‘vanguard’ 가능성을 제시하므로 본문은 무장 상태를 드러내는 ‘무장한 자들’로 두고, 전위 의미는 각주로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 여호와 같은 전통적 대체 호칭 대신, 본문에 드러난 신명사 יהוה를 반영해 학술 표기인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 언약궤와 하나님의 이름의 병치
  chosen_reading: 야훼의 언약궤
  alternative_readings:
  - 여호와의 궤
  - 주님의 궤
  rationale: 본문은 단순히 ‘궤’가 아니라 하나님의 언약적 임재를 지닌 궤를 가리키며, יְהוָה를 ‘야훼’로 옮겨 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
