id: JOS.6.16
reference: Joshua 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
  footnotes:
  - marker: a
    text: Hebrew shofarot, traditionally 'ram's horns'; here rendered 'trumpets' for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 번에 제사장들이 나팔[a]을 불었을 때, 여호수아가 백성에게 말했습니다. “외치십시오. 야훼께서 여러분에게 그 성을 주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָרוֹת는 문자적으로는 ‘뿔나팔들’에 가깝지만, 여기서는 자연스러운 한국어를 위해 ‘나팔’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그리고 있었던 일은
  lexicon: HALOT
  rationale: 서사 전개를 여는 wayyiqtol의 기능을 살리면서, 한국어에서는 자연스러운 연결어인 ‘그리고’로 이어 사건의 진행을 표현했습니다.
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  english_pob_choice: at the seventh time
  chosen_korean: 일곱째 번에
  alternatives_korean:
  - 일곱 번째 때에
  - 일곱째 차례에
  lexicon: HALOT
  rationale: 반복된 행위의 일곱 번째 ‘회차/차례’를 가리키므로, 한국어에서는 간결하고 자연스러운 ‘일곱째 번에’로 옮겼습니다.
- source_word: תָּקְעוּ הַכֹּהֲנִים בַּשּׁוֹפָרוֹת
  english_pob_choice: the priests blew the trumpets
  chosen_korean: 제사장들이 나팔을 불었을 때
  alternatives_korean:
  - 제사장들이 쇼파르를 불었을 때
  - 제사장들이 양각나팔을 불었을 때
  lexicon: HALOT
  rationale: שׁוֹפָר은 문자적으로는 뿔나팔이지만, 본절의 행위 묘사에서는 ‘나팔’이 가장 자연스럽습니다. 다만 POB의 ‘trumpets’ 선택을 따라 과도한 세부화는 피했습니다.
- source_word: הָרִיעוּ
  english_pob_choice: Shout
  chosen_korean: 외치십시오
  alternatives_korean:
  - 함성을 지르십시오
  - 전쟁 함성을 올리십시오
  lexicon: HALOT
  rationale: 명령형으로 주어진 הָרִיעוּ는 단순한 소리 내기가 아니라 집단적 외침을 요구하므로, 직접적이고 공손한 명령형 ‘외치십시오’가 적절합니다.
- source_word: נָתַן יְהוָה לָכֶם אֶת הָעִיר
  english_pob_choice: Yahweh has given you the city
  chosen_korean: 야훼께서 여러분에게 그 성을 주셨습니다
  alternatives_korean:
  - 야훼께서 여러분에게 그 도시를 주셨습니다
  - 여호와께서 여러분에게 그 성읍을 주셨습니다
  lexicon: HALOT
  rationale: פָּשׁוּט하게 ‘주셨습니다’로 완료된 선물을 나타내고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘성’은 문맥상 여리고를 가리키는 성읍을 자연스럽게 반영합니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 tetragrammaton יְהוָה가 직접 나오므로, 대체 칭호보다 신명 자체를 드러내는 ‘야훼’를 유지했습니다. 이는 본문이 전달하는 언약적·개인적 호칭을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
