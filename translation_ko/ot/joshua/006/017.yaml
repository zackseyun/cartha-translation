  to: 그 성읍과 그 안에 있는 모든 것은 야훼께 바쳐져 멸절될 것입니다[a]. 다만 매춘부 라합과 그녀와 함께 그 집 안에 있는 모든 사람은[b] 살아남을 것입니다. 이는 그녀가 우리가 보낸 전령들을 숨겼기 때문입니다.
