reference: Joshua 6:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
  footnotes:
  - marker: a
    text: Or 'under the ban.' The Hebrew term refers to something devoted irrevocably to the LORD, here through destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the messengers'; contextually, these are the men Joshua had sent to spy out the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍과 그 안에 있는 모든 것은 야훼께 바쳐 멸절될 것입니다[a]. 다만 기생 라합과 그녀와 함께 집 안에 있는 모든 사람은 살아남을 것입니다[b]. 이는 그녀가 우리가 보낸 사자들을 숨겼기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진멸에 바쳐질 것입니다.’ 히브리어 חֵרֶם은 어떤 것을 되돌릴 수 없게 야훼께 바친다는 뜻으로, 여기서는 멸절을 통해 그렇게 됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사자들’이지만, 문맥상 여호수아가 보낸 정탐꾼들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  english_pob_choice: devoted to destruction
  chosen_korean: 바쳐 멸절될 것입니다
  alternatives_korean:
  - 멸망에 바쳐질 것입니다
  - 진멸될 것입니다
  - 바쳐진 것입니다
  lexicon: HALOT
  rationale: חֵרֶם은 단순한 저주가 아니라 야훼께 온전히 넘겨져 멸망에 이르는 전쟁 용어이므로, 헌납성과 파괴성을 함께 드러내는 표현을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 위하여
  - 주께
  lexicon: HALOT
  rationale: 문맥상 성읍이 야훼께 전적으로 귀속되는 뜻이므로, POB의 야훼를 그대로 살려 수혜 대상을 분명히 했습니다.
- source_word: הַזּוֹנָה
  english_pob_choice: the prostitute
  chosen_korean: 기생
  alternatives_korean:
  - 창녀
  - 음녀
  lexicon: HALOT
  rationale: 라합의 직업적 표지를 드러내되, 한국어 성경 전통에서 널리 알려진 인명 수식어를 반영해 문맥상 가장 식별력 있는 표현을 선택했습니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 보낸 자들
  - 정탐꾼들
  lexicon: HALOT
  rationale: 히브리어 מַלְאָךְ의 기본값인 '보낸 자/사자'를 살려 어휘적으로 직접 옮겼고, 이 본문에서는 정탐꾼들이라는 해석을 본문에 과도하게 주입하지 않았습니다.
theological_decisions:
- issue: חֵרֶם의 심판 강도와 헌납성 유지
  chosen_reading: 성읍 전체가 야훼께 속하여 멸절되는 심판으로 표현했습니다.
  alternative_readings:
  - 단순히 멸망한다는 완화된 표현
  - '''저주 아래 있다''는 추상적 표현'
  rationale: 본문은 전쟁 심판과 야훼께 대한 전적 귀속을 함께 말하므로, 그 긴장을 약화하지 않는 방향으로 번역했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve lexical/theological tension.'
