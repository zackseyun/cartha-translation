  source_fidelity: 히브리어는 ‘야훼의 궤’를 문법적 주어로 하여 성읍을 한 차례 두르게 하고, 이어 그들이 진영에 와서 그곳에서 밤을 지냈다고 서술합니다. 초안의 ‘언약궤’는 문맥상 통용되는 명칭이지만, 이 절의 אֲרוֹן에는 ‘언약’이 명시되어 있지 않아 더 중립적인 ‘궤’가 원문에 가깝습니다. 또한 ‘한 바퀴 둘러 한 번 돌았습니다’는 같은 동작과 횟수를 중복해 한국어로 부자연스럽습니다.
  naturalness: ‘성읍을 한 바퀴 돌았습니다’는 원문의 순환 동작과 ‘한 번’을 자연스럽게 함께 표현합니다. ‘진영으로 들어가 진영에서 밤을 지냈습니다’는 두 번의 ‘진영’을 보존하면서도 현대 표준 한국어 합쇼체로 매끄럽습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. אֲרוֹן은 본절에서 첨가 없이 ‘궤’로 옮깁니다. 주어가 궤인 히브리어의 서술 방식은 유지하고, 각주에서 운반 주체와 문법적 주어의 차이를 설명합니다.
