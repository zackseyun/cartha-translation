translation:
  language: ko
  text: 그러자 야훼의 궤가 성읍을 한 바퀴 돌았습니다[a]. 그들이 진영으로 들어가 진영에서 밤을 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 궤가 성읍을 한 바퀴 돌았다’고 말합니다. 실제로는 제사장들이 궤를 운반했지만, 문법적으로는 궤를 주어로 삼습니다.
    reason: source_note
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 궤
  - 야훼의 법궤
  lexicon: HALOT
  rationale: 아론(궤) 자체를 가리키되, 한국어에서는 문맥상 기능과 성격을 드러내는 ‘언약궤’가 가장 자연스럽고, POB의 야훼 표기를 반영했습니다.
- source_word: וַיַּסֵּב ... הַקֵּף
  english_pob_choice: went around ... circling it
  chosen_korean: 성읍을 한 바퀴 둘러 ... 돌았습니다
  alternatives_korean:
  - 성읍을 돌았습니다
  - 성읍 주위를 돌며 둘러갔습니다
  lexicon: HALOT
  rationale: 동사와 강조적 부정사구가 함께 만드는 ‘둘러 돌다/한 바퀴 돌다’의 중첩 의미를 살려, 과도하게 직역하지 않으면서도 반복·강조를 반영했습니다.
- source_word: פַּעַם אֶחָת
  english_pob_choice: once
  chosen_korean: 한 번
  alternatives_korean:
  - 한 차례
  - 한 번씩
  lexicon: HALOT
  rationale: 히브리어의 수량 표현을 현대 한국어의 가장 자연스러운 시간·횟수 표현으로 옮겼습니다.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  english_pob_choice: spent the night in the camp
  chosen_korean: 진영에서 밤을 지냈습니다
  alternatives_korean:
  - 진영에 머물렀습니다
  - 진영에서 묵었습니다
  lexicon: HALOT
  rationale: לון의 숙박 의미를 살리면서, 같은 명사를 반복하는 히브리어 구조를 한국어에서는 ‘진영에서’로 정리해 자연스러운 흐름을 만들었습니다.
theological_decisions:
- issue: 야훼의 고유명 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 언약궤를 주어로 삼아 야훼의 임재를 강조하므로, 본 프로젝트의 기준에 따라 하나님의 고유명사를 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 궤의 의인화
  chosen_reading: ‘야훼의 언약궤가 ... 돌았습니다’로 옮겨, 히브리어의 문법적 주어를 보존했습니다.
  alternative_readings:
  - ‘제사장들이 궤를 메고 돌았습니다’
  - ‘궤가 운반되어 갔습니다’
  rationale: 본문은 궤를 행동 주체로 말하는 서술 방식 자체를 사용하므로, 그 표현을 완화하지 않고 유지했습니다.
  doctrine_reference: POB narrative style — source-close personification
