source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְשֹׁ֣ךְ בְּ/קֶ֣רֶן הַ/יּוֹבֵ֗ל ב/שמע/כם אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר יָרִ֥יעוּ כָל הָ/עָ֖ם תְּרוּעָ֣ה גְדוֹלָ֑ה וְ/נָ֨פְלָ֜ה חוֹמַ֤ת הָ/עִיר֙ תַּחְתֶּ֔י/הָ וְ/עָל֥וּ הָ/עָ֖ם אִ֥ישׁ נֶגְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
  footnotes:
  - marker: a
    text: Or 'when the ram's horn sounds long' or 'when the blast on the ram's horn is prolonged.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the wall of the city will fall beneath itself,' likely meaning it will collapse straight down.
    reason: lexical_alternative
  - marker: c
    text: Or 'each one straight ahead' or 'each man directly before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 뿔나팔 소리가 길게 울릴 때[a], 너희가 나팔 소리를 들으면, 모든 백성은 크게 외칠 것이며, 그러면 성벽이 그 밑으로 무너질 것이고, 백성은 각자 곧바로 앞으로 올라갈 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뿔나팔이 길게 울릴 때’, ‘뿔나팔 소리가 길게 이어질 때’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그 밑으로’입니다. 문맥상 성벽이 아래로 주저앉는 붕괴를 가리킬 가능성이 큽니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘각자 곧바로 앞쪽으로’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  english_pob_choice: is drawn out
  chosen_korean: 길게 울릴 때
  alternatives_korean:
  - 길게 불릴 때
  - 늘여 불릴 때
  - 긴 소리로 울릴 때
  lexicon: HALOT
  rationale: 이 관용구는 나팔을 ‘길게 내는’ 동작을 가리키므로, 한국어에서는 ‘길게 울리다’로 옮겨 원문의 동작성과 자연스러움을 함께 살렸습니다.
- source_word: קֶרֶן הַיּוֹבֵל
  english_pob_choice: the ram's horn
  chosen_korean: 뿔나팔
  alternatives_korean:
  - 숫양뿔
  - 숫양의 뿔나팔
  - 양의 뿔
  lexicon: HALOT
  rationale: 문맥상 희년 제도 용어가 아니라 전쟁/의식용 뿔나팔이므로, 독자에게 자연스러운 표준어 표현인 ‘뿔나팔’로 번역했습니다.
- source_word: תְּרוּעָה גְדוֹלָה
  english_pob_choice: a great shout
  chosen_korean: 크게 외칠 것
  alternatives_korean:
  - 큰 함성을 지를 것
  - 큰 외침을 올릴 것
  - 우렁차게 외칠 것
  lexicon: HALOT
  rationale: 명사구를 한국어 동사구로 풀어, 백성의 집단적 외침이라는 의미를 자연스럽게 드러냈습니다.
- source_word: תַּחְתֶּיהָ
  english_pob_choice: beneath itself
  chosen_korean: 그 밑으로
  alternatives_korean:
  - 자기 아래로
  - 밑으로
  - 그 아래로
  lexicon: HALOT
  rationale: POB의 수정본은 ‘beneath itself’의 반사적 뉘앙스를 보존하려고 했으므로, 단순한 ‘무너질 것입니다’보다 ‘그 밑으로 무너질 것입니다’로 내려앉는 이미지를 살렸습니다.
- source_word: אִישׁ נֶגְדּוֹ
  english_pob_choice: each man straight before him
  chosen_korean: 각자 곧바로 앞으로
  alternatives_korean:
  - 각 사람은 곧장 앞으로
  - 각자 정면으로
  - 각 사람은 바로 앞을 향해
  lexicon: HALOT
  rationale: 분배적 ‘각 사람’의 의미와 ‘곧바로 앞으로’라는 직진 이미지를 살려, 군사적 전진의 흐름이 드러나게 했습니다.
theological_decisions:
- issue: 벽의 붕괴를 나타내는 반사적 표현
  chosen_reading: “성벽이 그 밑으로 무너질 것입니다”로 옮겨, 단순히 ‘무너진다’보다 아래로 주저앉는 이미지를 보존했습니다.
  alternative_readings:
  - 성벽이 무너질 것입니다
  - 성벽이 아래로 무너질 것입니다
  rationale: 히브리어 תַּחְתֶּיהָ의 ‘그 아래/그 밑에’라는 힘을 유지해야 본문의 극적 붕괴 장면이 약화되지 않습니다.
  doctrine_reference: 본문의 서사적·표현적 강세 보존
