  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: YHWH
  rationale: 공동체 기본값에 따라 여호와 대신 학술적 전사인 야훼를 사용하여 신명 표기를 일관되게 유지했습니다.
