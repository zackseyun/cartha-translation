translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. "보십시오, 내가 여리고와 그 왕, 그리고 그 안에 있는 용맹한 전사들을 네 손에 넘겨주었습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘용맹한 전사들’은 히브리어 표현이 ‘힘센/용사’와 ‘전투적 용맹’을 함께 담는다는 점을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
