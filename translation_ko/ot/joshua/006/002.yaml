base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
  footnotes:
  - marker: a
    text: Or, 'the mighty warriors' or 'the valiant warriors.' The Hebrew phrase combines ideas of strength and martial valor.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여호수아에게 말씀하셨습니다. “보십시오, 내가 여리고와 그 왕과 용맹한 전사들을[a] 네 손에 넘겨주었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘용맹한 전사들’로 옮긴 히브리어 표현은 힘과 군사적 용맹의 뜻을 함께 담고 있습니다. ‘힘센 전사들’ 또는 ‘용사들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: YHWH
  rationale: 공동체 기본값에 따라 여호와 대신 학술적 전사인 야훼를 사용하여 신명 표기를 일관되게 유지했습니다.
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 청자에게 주의를 환기하는 명령형을 현대 공손체로 자연스럽게 옮겼습니다.
- source_word: נָתַתִּי
  english_pob_choice: I have given
  chosen_korean: 넘겨주었습니다
  alternatives_korean:
  - 주었습니다
  - 이미 주었습니다
  lexicon: HALOT
  rationale: 완료형이 하나님의 확정된 선언을 나타내므로, 문맥상 ‘넘겨주다’로 전투적 소유 이전의 의미를 살렸습니다.
- source_word: גִּבּוֹרֵי הֶחָיִל
  english_pob_choice: the mighty men of valor
  chosen_korean: 용맹한 전사들
  alternatives_korean:
  - 용사들
  - 힘센 전사들
  - 무력한 전사들
  lexicon: HALOT
  rationale: ‘מִיּוֹרֵי/גִּבּוֹרֵי’의 강함과 ‘חָיִל’의 군사적 용맹을 함께 담기 위해 직역적이면서도 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: נָתַתִּי의 완료형이 전투 이전에 갖는 신학적 뉘앙스
  chosen_reading: 하나님이 이미 주신 것으로 선언하시는 확정적 승리의 말씀으로 옮겼습니다.
  alternative_readings:
  - 현재형적 약속(‘주고 있다’)
  - 미래형적 약속(‘주겠다’)
  rationale: 히브리어 완료형의 확정성과 신적 주권을 보존하면서, 본문이 말하는 승리의 보장을 과도하게 설명하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
