base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
  footnotes:
  - marker: a
    text: Or, more specifically in context, 'Do not raise a war cry' / 'Give no battle shout.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and no word shall go out from your mouth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 백성에게 명령하며 말했습니다. “외치지 말고, 너희 목소리가 들리게 하지도 말며, 내가 너희에게 ‘외쳐라!’ 하고 말하는 날까지 너희 입에서 아무 말도 나오지 않게 하십시오. 그때에 너희는 외칠 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 구체적으로는 ‘전투 함성’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘너희 입에서 아무 말도 나오지 않게 하라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하며
  alternatives_korean:
  - 명하여
  - 지시하며
  lexicon: HALOT
  rationale: 단순한 안내보다 권위 있는 명령의 힘이 있으므로 ‘명령하다’가 가장 가깝습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군대
  lexicon: HALOT
  rationale: 전투 상황이지만 히브리어는 일반적인 ‘백성’이므로, 군사적 의미를 과도하게 좁히지 않기 위해 ‘백성’으로 옮겼습니다.
- source_word: לֹא תָרִיעוּ / הָרִיעוּ
  english_pob_choice: Do not shout / Shout!
  chosen_korean: 외치지 말고 / 외쳐라!
  alternatives_korean:
  - 함성을 지르지 말고 / 함성을 지르라!
  - 전투 함성을 지르지 말고 / 전투 함성을 지르라!
  lexicon: HALOT
  rationale: 반복되는 어근 רוע의 대조를 살리되, 한국어에서 자연스럽고 포괄적인 ‘외치다’로 대응했습니다.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  english_pob_choice: do not let your voice be heard
  chosen_korean: 너희 목소리가 들리게 하지도 말며
  alternatives_korean:
  - 너희 목소리를 들리게 하지도 말며
  - 목소리를 내지도 말며
  lexicon: HALOT
  rationale: 직역보다 자연스러운 한국어로, 수동적 구문인 ‘들리게 하다’로 소리의 발생을 금지하는 뉘앙스를 살렸습니다.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  english_pob_choice: do not let a word go out from your mouth
  chosen_korean: 너희 입에서 아무 말도 나오지 않게 하십시오
  alternatives_korean:
  - 너희 입에서 말 한마디도 나오지 않게 하십시오
  - 너희 입에서 어떤 말도 나오지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘입에서 나가다’ 이미지를 유지하면서도 한국어 문장으로 매끄럽게 옮겼습니다.
theological_decisions:
- issue: 군사적 함성 금지와 명령의 반복 구조
  chosen_reading: ‘외치지 말고… 내가 너희에게 ‘외쳐라!’ 하고 말하는 날까지’라는 대조를 그대로 살려, 침묵과 발화를 하나님의 지시에 종속된 순종 행위로 드러냈습니다.
  alternative_readings:
  - ‘소리치지 말라’로 단순 경고처럼 옮김
  - ‘전투 함성’을 본문에 넣어 군사적 의미를 고정함
  rationale: 본문은 같은 어근을 반복해 금지와 허락의 대비를 강조하므로, 그 구조를 한국어에서도 분명히 보이게 하는 것이 중요합니다.
  doctrine_reference: 본문 주해 수준의 순종-명령 구조
