reference: Joshua 6:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
  footnotes:
  - marker: a
    text: Or 'utterly destroyed' or 'put under the ban.' The Hebrew verb refers to devoting something irrevocably to destruction under the ban (ḥerem).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 성읍 안에 있는 모든 것을, 곧 남자부터 여자까지, 젊은이부터 노인까지, 또 소와 양과 나귀까지 칼날로 진멸하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히 멸망시켰다’ 또는 ‘진멸에 바쳤다’. 히브리어 동사는 사람이나 사물을 되돌릴 수 없도록 진멸의 대상으로 바치는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  english_pob_choice: they devoted to destruction
  chosen_korean: 진멸하였습니다
  alternatives_korean:
  - 전멸시켰습니다
  - 멸하였습니다
  - 저주 아래 두었습니다
  lexicon: HALOT
  rationale: ḥerem의 기술적 의미를 살리기 위해 단순한 ‘죽이다’보다, irrevocable destruction의 함의를 가진 ‘진멸하다’를 택했습니다.
- source_word: כָּל אֲשֶׁר בָּעִיר
  english_pob_choice: everything that was in the city
  chosen_korean: 성읍 안에 있는 모든 것을
  alternatives_korean:
  - 성읍에 있는 모든 것
  - 그 성읍 안의 모든 것
  lexicon: HALOT
  rationale: 사람과 동물이 뒤이어 열거되므로 포괄성을 살려 ‘모든 것을’으로 옮겼습니다.
- source_word: מֵאִישׁ וְעַד אִשָּׁה / מִנַּעַר וְעַד זָקֵן
  english_pob_choice: from man to woman, from young to old
  chosen_korean: 남자에서 여자까지, 어린아이에서 노인까지
  alternatives_korean:
  - 남자부터 여자까지, 젊은이부터 늙은이까지
  - 남자와 여자 모두, 어린이와 노인 모두
  lexicon: HALOT
  rationale: 히브리어의 범위 표현과 총체성을 자연스러운 현대 한국어로 옮기되, 성별과 연령의 양극단을 모두 포함하는 뉘앙스를 유지했습니다.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  english_pob_choice: and even ox and sheep and donkey
  chosen_korean: 또 소와 양과 나귀까지
  alternatives_korean:
  - 그리고 소와 양과 나귀까지
  - 심지어 소와 양과 나귀까지
  lexicon: HALOT
  rationale: 최종 동물 목록까지 포함되는 확대를 드러내기 위해 ‘까지’를 사용했고, 문맥상 ‘심지어’보다 담담한 서술이 적절해 선택하지 않았습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: by the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼에
  - 칼로
  - 칼끝으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 살해 도구 표현으로 옮기면서, 전투적 이미지가 살아 있도록 ‘칼날로’를 택했습니다.
theological_decisions:
- issue: ḥerem(진멸) 용어의 강도
  chosen_reading: ‘진멸하다’로 본문에 보존하여, 단순한 전투 승리가 아니라 하나님의 심판 아래 맡겨진 전면적 파괴라는 의미를 드러냈습니다.
  alternative_readings:
  - ‘전멸하다’
  - ‘저주 아래 두다’
  rationale: 본문의 חרם은 일반적 파괴가 아니라 언약적·신학적 성격을 지닌 전용 개념이므로, 그 긴장을 약화하지 않는 한국어를 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
