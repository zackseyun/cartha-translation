revisions:
- from: 그리고 그들은 성읍 안에 있는 모든 것을, 곧 남자에서 여자까지, 어린아이에서 노인까지, 또 소와 양과 나귀까지, 칼날로 진멸하였습니다.[a]
  to: 그리고 그들은 성읍 안에 있는 모든 것을, 곧 남자부터 여자까지, 젊은이부터 노인까지, 또 소와 양과 나귀까지 칼날로 진멸하였습니다.[a]
  rationale: 본문의 ḥerem 용어인 ‘진멸하다’와 칼의 관용구는 유지했습니다. 연령 범위를 원문의 포괄성에 맞게 조정하고, 범위 표현을 현대 표준어에 맞게 다듬었습니다. 또한 חרם을 단순한 저주로 설명하는 부정확한 각주 대안을, 원문의 바침과 철회 불가능성을 반영하는 표현으로 바로잡았습니다.
