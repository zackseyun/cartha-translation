base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the seven shofars of the yobel''; this likely means ram''s-horn trumpets, though ''jubilee trumpets'' is a possible but less likely rendering in this context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 백성에게 말하자, 앞에서 나아가며 나팔을 부는 일곱 제사장—곧 여호와 앞에서 일곱 희년 나팔을 든 제사장들—이 지나가고, 여호와의 언약궤가 그들 뒤를 따랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘희년의 나팔들’은 이 문맥에서 숫양뿔 나팔을 가리키는 것으로 보이며, ‘희년 나팔’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여호와 앞에서’입니다. 행진의 방향과 예배적 배치를 함께 보여 줍니다.
    reason: lexical_alternative
