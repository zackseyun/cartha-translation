    issue: ‘일곱 희년 나팔’이 본문에 사용됨
    rationale: 이 문맥의 שׁוֹפְרוֹת הַיּוֹבְלִים는 일반적으로 숫양뿔 나팔을 가리킵니다. ‘희년’은 가능한 어원적·전통적 대안일 수 있으나, 현대 독자에게 시간 제도인 희년을 먼저 연상시켜 악기 지시를 흐리므로 각주로 처리하는 것이 안전합니다.
  - severity: medium
    issue: 제사장들의 동작과 ‘여호와 앞에서’의 연결이 불명확함
    rationale: ‘앞에서 나아가며 나팔을 부는’은 동작을 하나의 동시적 수식으로 묶고 ‘여호와 앞에서’도 삽입 동격구 안에 넣습니다. 원문의 위치 관계와 ‘나아가고, 나팔을 불었다’라는 진행을 직접적인 주절로 옮기는 편이 충실합니다.
