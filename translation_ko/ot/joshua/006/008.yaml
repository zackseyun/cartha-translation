  to: 여호수아가 백성에게 말하였을 때, 여호와 앞에서[b] 일곱 개의 숫양뿔 나팔을 든[a] 일곱 제사장들이 앞으로 나아가 나팔을 불었고, 여호와의 언약궤는 그들 뒤를 따라갔습니다.
  rationale: 문맥상 악기를 가리키는 ‘숫양뿔 나팔’을 본문에 회복하고, ‘여호와 앞에서’와 제사장들의 행진·나팔 소리를 원문의 순서와 관계에 맞게 명료하게 재구성했습니다. 신명, 언약궤 용어, 그리고 본문의 서사적 과거는 유지했습니다.
