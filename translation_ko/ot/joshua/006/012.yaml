  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the ark of Yahweh.'' The main text follows the project’s default rendering of the divine name יְהוָה as ''the LORD.'''
