translation:
  language: ko
  text: 여호수아는 아침 일찍 일어났으며, 제사장들은 야훼의 궤를 메었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어났고
  alternatives_korean:
  - 일찍 일어났고
  - 새벽에 일어났고
  lexicon: HALOT
  rationale: 히필 שׁכם의 핵심은 ‘이른 시각에 일어나다’이므로, 현대 한국어에서 자연스러운 ‘아침 일찍 일어났고’로 시간 강조를 살렸습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침
  alternatives_korean:
  - 그 아침
  - 아침 시간에
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 앞절의 ‘아침 일찍’과 함께 이른 아침의 시간대를 분명히 드러내기 위해 ‘아침’으로 옮겼습니다.
- source_word: וַיִּשְׂאוּ
  english_pob_choice: carried
  chosen_korean: 메었습니다
  alternatives_korean:
  - 들었습니다
  - 나르었습니다
  lexicon: HALOT
  rationale: 언약궤를 운반하는 문맥에서는 단순한 ‘들다’보다, 제의적 운반을 드러내는 ‘메다’가 한국어로 가장 자연스럽습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 궤
  - 여호와의 언약궤
  lexicon: HALOT
  rationale: אֲרוֹן은 단순히 ‘궤’가 아니라 언약과 결부된 성소 기구이므로 ‘언약궤’로 구체화했습니다. יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 제의적 운반 표현
  chosen_reading: 하나님의 고유명을 제목처럼 돌려 말하지 않고 ‘야훼’로 직접 표기하고, 제사장들의 행위를 ‘메다’로 번역했습니다.
  alternative_readings:
  - 여호와의 언약궤
  - 주님의 궤를 들었습니다
  rationale: 히브리어 본문은 יְהוָה를 직접 사용하며, 언약궤의 운반은 단순 물체 이동이 아니라 성소 봉사의 행위입니다. 따라서 고유명과 제의적 동작의 성격을 함께 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
