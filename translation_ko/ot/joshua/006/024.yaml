base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the vessels of bronze and iron.' The Hebrew term can refer broadly to implements, utensils, or articles.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍과 그 안에 있는 모든 것을 불태웠습니다. 다만 은과 금, 그리고 청동과 철로 된 물건들은 야훼의 집 곳간에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּלִים은 넓게는 ‘그릇들’보다 더 일반적으로 ‘기구들, 물건들, 용기들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר שָׂרְפוּ בָאֵשׁ
  english_pob_choice: And they burned the city with fire
  chosen_korean: 그 성읍과 그 안에 있는 모든 것을 불태웠습니다
  alternatives_korean:
  - 그 성읍을 불로 태웠습니다
  - 그 성읍에 불을 질렀습니다
  lexicon: HALOT
  rationale: שָׂרַף는 단순히 ‘태우다/불태우다’의 직접적 의미를 가지므로 이를 자연스러운 한국어 동사로 옮겼습니다. ‘불로’는 히브리어 בָּאֵשׁ의 수단 표현을 살리되 과도하게 직역하지 않도록 했습니다.
- source_word: וְכָל אֲשֶׁר בָּהּ
  english_pob_choice: and everything that was in it
  chosen_korean: 그 안에 있는 모든 것
  alternatives_korean:
  - 그 안에 있던 모든 것
  - 그 안의 모든 것
  lexicon: HALOT
  rationale: 성읍 내부의 총체성을 나타내는 표현이므로, 내용을 축약하지 않고 현대 한국어에서 자연스러운 ‘그 안에 있는 모든 것’으로 옮겼습니다.
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 앞선 파괴 진술에 대한 예외를 표시하는 רַק의 기능을 살려, 문맥상 대비를 분명히 하는 ‘다만’을 선택했습니다.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  english_pob_choice: the articles of bronze and iron
  chosen_korean: 청동과 철로 된 물건들
  alternatives_korean:
  - 청동과 철의 기구들
  - 청동과 철의 기물들
  - 청동과 철로 된 그릇들
  lexicon: HALOT
  rationale: כְּלִים은 그릇에만 한정되지 않는 넓은 ‘물건/기구/도구’의 의미가 있어, 영어 POB의 ‘articles’에 맞춰 범위를 넓게 잡았습니다. נְחֹשֶׁת은 이 문맥에서 ‘청동’이 가장 자연스럽습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: בֵּית יְהוָה는 문자적으로 ‘야훼의 집’이므로, 후대적인 ‘성전’보다 원문 표지를 살린 표현을 택했습니다. POB의 고유명사 원칙에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 전리품의 처분을 ‘헌납된 보관’으로 유지할지 여부
  chosen_reading: 물건들을 야훼의 집 곳간에 두었습니다
  alternative_readings:
  - 물건들을 야훼의 집 보물창고에 넣었습니다
  - 물건들을 야훼의 집의 보관소에 두었습니다
  rationale: נָתְנוּ אוֹצַר는 단순 보관이 아니라 성소 용도의 귀속을 뜻하므로, 문맥상 ‘곳간에 두다’로 옮겨 헌납된 귀속성을 유지했습니다.
  doctrine_reference: Joshua 6:24의 전리품은 야훼께 돌려지는 성소 재산이라는 문맥을 반영합니다.
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יְהוָה가 직접 나오므로, 본 프로젝트의 기본 원칙에 따라 신명 표기를 ‘야훼’로 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
