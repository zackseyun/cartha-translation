source:
  edition: WLC
  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
  footnotes:
  - marker: a
    text: Or 'the harlot.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the messengers'; that is, the men Joshua sent to spy out Jericho.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아는 창녀 라합과[a] 그녀의 아버지 집안과 그녀에게 속한 모든 것을 살려 두었습니다. 라합은 오늘날까지 이스라엘 가운데[b] 살고 있는데, 그것은 여호수아가 여리고를 정탐하라고 보낸 전령들을 숨겼기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '창기'
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '이스라엘의 가운데'; 곧 이스라엘 사람들 가운데에 있다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזּוֹנָה
  english_pob_choice: the prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 기녀
  lexicon: HALOT
  rationale: זוֹנָה의 직접적 의미를 드러내면서도, 현대 한국어에서 문맥을 분명하게 전달하는 표현을 택했습니다. '창녀'는 다소 강하지만 원문의 사회적 낙인을 숨기지 않습니다.
- source_word: בֵּית אָבִיהָ
  english_pob_choice: her father’s household
  chosen_korean: 그녀의 아버지 집안
  alternatives_korean:
  - 그녀의 아버지의 집
  - 아버지의 가족
  lexicon: HALOT
  rationale: 문자적으로는 '아버지의 집'이지만, 문맥상 건물보다 가족/가문 단위를 가리키므로 '집안'이 가장 자연스럽고 원문에 가깝습니다.
- source_word: הֶחֱיָה
  english_pob_choice: kept ... alive
  chosen_korean: 살려 두었습니다
  alternatives_korean:
  - 살려 주었습니다
  - 보존하였습니다
  lexicon: HALOT
  rationale: 히필의 인과적 뉘앙스를 살리면서도 한국어로 자연스럽게 처리했습니다. 단순한 '살았다'가 아니라 살게 하였다는 의미가 드러납니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 전령들
  alternatives_korean:
  - 사자들
  - 정탐꾼들
  lexicon: HALOT
  rationale: כּ/מלאכים의 기본값은 '전령/사자'이므로, 여기서는 '전령들'로 옮겨 원문 어휘를 보존했습니다. 뒤의 '정탐하라고 보낸'이 그들의 임무를 설명합니다.
- source_word: לְרַגֵּל
  english_pob_choice: to spy out
  chosen_korean: 정탐하라고
  alternatives_korean:
  - 살피라고
  - 탐지하라고
  lexicon: HALOT
  rationale: 정탐의 목적을 분명히 드러내는 관용적 표현입니다. 현대 독자에게도 기능이 즉시 이해됩니다.
theological_decisions:
- issue: 라합의 이스라엘 내부 거주 표현
  chosen_reading: 이스라엘 가운데 살고 있는데
  alternative_readings:
  - 이스라엘 가운데서 살았는데
  - 이스라엘 가운데 거주하는데
  rationale: 원문의 '오늘날까지'가 만드는 지속성을 보존해, 라합이 이스라엘 공동체 안에 편입되어 있음을 서술적으로만 제시했습니다. 후대의 신학적 결론을 덧붙이지 않았습니다.
  doctrine_reference: 서술의 지속성과 공동체 편입을 본문 수준에서만 유지
