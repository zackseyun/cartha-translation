  source_fidelity: 핵심 번역은 히브리어 본문을 대체로 충실히 반영합니다. הֶחֱיָה의 사역적 의미를 '살려 두었습니다'로, בֵּית אָבִיהָ를 '아버지 집안'으로, הַמַּלְאָכִים과 לְרַגֵּל을 '전령들' 및 '정탐하도록'으로 옮긴 것은 적절합니다. 다만 현행 b 각주는 본문 앵커 위치와 맞지 않고, 원문의 '전령들'에 관한 설명을 '이스라엘 가운데'에 연결하므로 바로잡아야 합니다.
  naturalness: '''그녀의''의 반복은 한국어 서술에서 다소 부자연스럽고 지시 대상도 잠시 불필요하게 멀어질 수 있으므로 ''라합의''로 명시하는 편이 낫습니다. 인과절도 ''그것은 ... 때문입니다''보다 ''이는 ... 때문입니다''가 앞 문장 전체를 자연스럽게 받습니다.'
  terminology: '''창녀''는 זוֹנָה의 직접적인 현대어 대응으로 가능하나, 각주의 대안은 고어적인 ''창기''보다 현대어 ''매춘부''가 더 유익합니다. ''전령들''은 מַלְאָכִים의 일반적 의미를 보존하며, 뒤의 정탐 목적어가 역할을 충분히 밝혀 줍니다.'
