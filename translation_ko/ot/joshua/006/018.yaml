revisions:
- from: 그러나 여러분은 그 헌물에서 스스로를 지키십시오. 그렇지 않으면 여러분도 헌물로 바쳐져 멸망하게 되고, 그 헌물 가운데서 조금이라도 가져가서 이스라엘 진영을 헌물로 바치게 되어 그것에 재앙을 가져오게 됩니다.[a][b][c]
  to: 그러나 여러분은 진멸하도록 바쳐진 것에 손대지 않도록 스스로 조심하십시오.[a] 그렇지 않으면 여러분 자신도 진멸하도록 바쳐진 것이 되고,[b] 그 가운데서 일부를 가져가 이스라엘 진영을 진멸하도록 바쳐진 것으로 만들며 그 진영에 재앙을 가져오게 됩니다.[c]
  rationale: 핵심 용어 חֵרֶם의 의미를 일반적인 ‘헌물’에서 ‘진멸하도록 바쳐진 것’으로 바로잡아, 원문과 영어 POB의 ‘devoted to destruction’이 보존하는 봉헌·심판의 의미를 함께 드러냈습니다. 문장을 현대적인 합쇼체로 다듬고, 각주 앵커를 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:51:37Z'
review_pass:
  verdict: revise
  source_fidelity: ‘헌물’은 일반적인 예물·봉헌물로 이해되기 쉬워, 이 문맥의 חֵרֶם, 곧 하나님께 irrevocably 바쳐져 진멸의 대상이 된다는 뜻을 충분히 전달하지 못합니다. 또한 ‘그 헌물에서 스스로를 지키십시오’는 한국어에서 부자연스럽습니다. ‘진멸하도록 바쳐진 것’은 반복되지만 원문의 핵심 용어와 그 결과적 의미를 일관되게 보존합니다.
  naturalness: ‘~에 손대지 않도록 스스로 조심하십시오’는 שׁמר מן의 경계·자기보호의 의미를 현대 표준 한국어 합쇼체로 자연스럽게 옮깁니다. 조건절 안의 동사를 병렬하여, 취함의 결과가 이스라엘 진영 전체에 미친다는 원문의 흐름을 분명히 했습니다.
  terminology: חֵרֶם은 ‘진멸하도록 바쳐진 것’으로 통일했습니다. 이는 단순한 ‘헌물’이나 가치 판단이 앞선 ‘저주받은 것’보다 본문 문맥의 봉헌과 파괴의 결합을 더 정확히 나타냅니다. עכר는 ‘재앙을 가져오다’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: חֵרֶם을 ‘헌물’로 번역함
    rationale: ‘헌물’은 통상 하나님께 드리는 일반 예물이라는 긍정적·의례적 의미가 강하며, 여리고 문맥에서 대상이 진멸에 넘겨졌다는 핵심 의미를 누락시킵니다.
  - severity: medium
    issue: ‘그 헌물에서 스스로를 지키십시오’의 비자연스러운 결합
    rationale: 한국어에서는 특정 물건 ‘에서 자신을 지키다’가 자연스럽지 않습니다. 원문의 경고는 그 대상에 관여하거나 취하지 말라는 뜻이므로 ‘손대지 않도록 스스로 조심하십시오’가 적절합니다.
  - severity: medium
    issue: 각주 b가 번역 대안이나 본문 이해에 실질적인 정보를 제공하지 않음
    rationale: 현 각주는 단지 번역 방식을 반복합니다. תַּחֲרִימוּ의 해석상 가능한 능동적 뉘앙스를 간결히 밝혀 원문의 논쟁 가능성을 보존하는 대안 각주로 바꾸는 편이 낫습니다.
