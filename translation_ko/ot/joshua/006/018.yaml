id: JOS.6.18
reference: Joshua 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
  footnotes:
  - marker: a
    text: Hebrew חֵרֶם (cherem), traditionally 'the ban' or 'the accursed thing'; here it refers to persons or things irrevocably devoted to God for destruction.
    reason: lexical_alternative
  - marker: b
    text: Or 'lest you put yourselves under the ban.'
    reason: alternative_reading
  - marker: c
    text: '''Bring trouble on it'' echoes the theme later seen in Achan''s sin and its consequences for Israel (Josh 7:1, 25).'
    reason: cross_reference
translation:
  language: ko
  text: 그러나 여러분은 진멸하도록 바쳐진 것에 손대지 않도록 스스로 조심하십시오.[a] 그렇지 않으면 여러분 자신도 진멸하도록 바쳐진 것이 되고,[b] 그 가운데서 일부를 가져가 이스라엘 진영을 진멸하도록 바쳐진 것으로 만들며 그 진영에 재앙을 가져오게 됩니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵרֶם(헤렘). 전통적으로 ‘진멸’ 또는 ‘저주받은 것’으로 옮겼습니다. 여기서는 하나님께 돌이킬 수 없게 바쳐져 진멸의 대상이 된 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 자신을 진멸의 대상으로 만들고.’ 히브리어 동사는 능동형이지만, 여기서는 금지된 것을 취한 결과 자신들이 동일한 진멸의 상태에 놓임을 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘재앙을 가져오다’는 히브리어 עכר의 의미를 반영합니다. 이 표현은 뒤이어 나오는 아간의 죄와 이스라엘이 겪는 결과를 예고합니다(수 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק / אַתֶּם
  english_pob_choice: But as for you
  chosen_korean: 그러나 여러분은
  alternatives_korean:
  - 오직 여러분은
  - 그런데 여러분은
  lexicon: HALOT
  rationale: וְרַק은 앞말과의 강한 대비와 제한을 함께 담으므로, 합쇼체 한국어에서는 ‘그러나’로 대비를 살리고 주어를 전면에 놓아 경고의 직접성을 유지했습니다.
- source_word: שִׁמְרוּ מִן הַחֵרֶם
  english_pob_choice: keep yourselves from what is devoted to destruction
  chosen_korean: 그 헌물에서 스스로를 지키십시오
  alternatives_korean:
  - 그 헌물에서 자신을 지키십시오
  - 그 헌물에 손대지 마십시오
  lexicon: HALOT
  rationale: שׁמר + מן은 ‘~에서 스스로를 지키다/피하다’의 의미이므로, 단순 금지보다 반사적 경계를 살리는 표현을 택했습니다. חֵרֶם은 본문상 ‘헌물’이면서 동시에 멸망에 바쳐진 대상이므로, 한국어 본문에서는 그 긴장을 유지했습니다.
- source_word: תַּחֲרִימוּ
  english_pob_choice: you yourselves become devoted to destruction
  chosen_korean: 여러분도 헌물로 바쳐져 멸망하게 되고
  alternatives_korean:
  - 여러분도 멸망에 바쳐지고
  - 여러분도 저주 아래 놓이게 되고
  lexicon: HALOT
  rationale: 히필 חרם은 여기서 단순 행위보다 그 결과로 동일한 വിധ/상태에 들어감을 경고하므로, ‘헌물로 바쳐져 멸망하게’로 인과적 결과를 드러냈습니다.
- source_word: וּלְקַחְתֶּם מִן הַחֵרֶם
  english_pob_choice: and take some of what is devoted to destruction
  chosen_korean: 그 헌물 가운데서 조금이라도 가져가서
  alternatives_korean:
  - 그 헌물에서 일부를 가져가서
  - 그 멸망에 바쳐진 것에서 조금이라도 취해서
  lexicon: HALOT
  rationale: 히브리어 집합명사 חֵרֶם을 영어 POB의 조정처럼 ‘그 헌물’로 유지하되, ‘조금이라도’로 לקחת מן의 부분 취득을 자연스럽게 살렸습니다.
- source_word: וְשַׂמְתֶּם אֶת מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם וַעֲכַרְתֶּם אֹתוֹ
  english_pob_choice: and make the camp of Israel devoted to destruction, and bring trouble on it
  chosen_korean: 이스라엘 진영을 헌물로 바치게 되어 그것에 재앙을 가져오게 됩니다
  alternatives_korean:
  - 이스라엘 진영을 멸망에 바치게 되어 그것을 괴롭히게 됩니다
  - 이스라엘 진영을 헌물로 만들고 그것에 혼란을 가져오게 됩니다
  lexicon: HALOT
  rationale: שׂים לְחֵרֶם의 결과를 ‘헌물로 바치다’로 재현하고, עכר는 언약적 재앙의 뉘앙스를 살려 ‘재앙을 가져오다’로 옮겼습니다. 최종 대명사 ‘그것’은 이스라엘 진영을 가리킵니다.
theological_decisions:
- issue: חֵרֶם의 한국어 처리와 ‘헌물’/‘멸망’의 긴장
  chosen_reading: ‘헌물’로 옮기되 본문 안에서 ‘멸망하게’와 결합해, 하나님께 온전히 바쳐져 파괴에 이르는 의미를 드러냈습니다.
  alternative_readings:
  - ‘저주받은 것’
  - ‘진멸 제물’
  - ‘봉헌된 것’
  rationale: 이 단어는 단순한 금기물이 아니라 하나님께 돌려져 멸망에 이르는 대상을 가리키므로, 교회 전통어를 무조건 따르기보다 본문 의미를 드러내는 방향을 택했습니다. 다만 ‘헌물’만으로는 소멸의 의미가 약해질 수 있어 후속 절과 연결되도록 보완했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
