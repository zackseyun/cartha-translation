base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
  footnotes:
  - marker: a
    text: Hebrew shofarot, specifically horns, often rendered 'ram's horns.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무장한 이들은 나팔들[a]을 부는 제사장들 앞에서 가고 있었고, 후위대는 언약궤 뒤를 따라가고 있었으며, 제사장들은 계속 나팔을 불고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 쇼파로트는 뿔나팔을 가리키며, 흔히 ‘숫양 뿔 나팔’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  english_pob_choice: the armed men
  chosen_korean: 무장한 사람들
  alternatives_korean:
  - 무장한 군사들
  - 선두 부대
  - 전열의 군사들
  lexicon: HALOT
  rationale: 행진 순서에서 앞장선 전투 인원을 가리키므로, 현대 한국어에서는 기능을 드러내는 ‘무장한 사람들’이 자연스럽고 과도하게 군사 용어를 좁히지 않습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: 출애굽기·여호수아의 제의적 문맥에서는 한국어 성서에서 널리 통용되는 ‘제사장들’이 가장 직접적으로 대응합니다.
- source_word: תקעו / הַשּׁוֹפָרוֹת
  english_pob_choice: were blowing the trumpets
  chosen_korean: 나팔들[a]을 불고 있었고
  alternatives_korean:
  - 나팔을 불고 있었고
  - 양각나팔을 불고 있었고
  - 숫양 뿔 나팔을 불고 있었고
  lexicon: HALOT
  rationale: שׁוֹפָר는 일반 ‘나팔’보다 구체적으로 뿔나팔을 가리킬 수 있지만, 본문 흐름에서는 ‘나팔’이 읽기 쉽고, 구체성은 각주로 보완하는 것이 적절합니다.
- source_word: הַמְאַסֵּף
  english_pob_choice: the rear guard
  chosen_korean: 후위대
  alternatives_korean:
  - 후방 부대
  - 뒤를 지키는 무리
  - 후미 경계대
  lexicon: HALOT
  rationale: 행진 대형의 뒤를 맡는 군사적 역할을 분명히 드러내므로 ‘후위대’가 가장 간결하고 기능적으로 정확합니다.
- source_word: הָאָרוֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 법궤
  - 언약의 궤
  lexicon: HALOT
  rationale: 여호수아서의 הָאָרוֹן은 이 맥락에서 언약궤를 가리키므로, 단순한 ‘궤’보다 식별성이 높은 ‘언약궤’를 택했습니다.
- source_word: הָלוֹךְ וְתָק֥וֹעַ
  english_pob_choice: while they kept blowing
  chosen_korean: 계속 나팔을 불고 있었습니다
  alternatives_korean:
  - 계속 불면서 가고 있었습니다
  - 나팔을 계속 불었습니다
  - 가면서 계속 나팔을 불고 있었습니다
  lexicon: HALOT
  rationale: הלך + תקוע의 반복·지속을 한국어 진행상으로 살려, 행진과 동시적 지속 동작을 자연스럽게 표현했습니다.
