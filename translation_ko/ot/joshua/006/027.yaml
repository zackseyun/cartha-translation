  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
  footnotes:
  - marker: a
    text: Or 'his report' or 'the news about him.' The Hebrew can denote report, news, or reputation; here it likely refers to Joshua's growing renown.
