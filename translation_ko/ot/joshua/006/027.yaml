base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
  footnotes:
  - marker: a
    text: Or 'his report' or 'the news about him.' The Hebrew can denote report, news, or reputation; here it likely refers to Joshua's growing renown.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여호수아와 함께하셨고, 그의 소문은 온 땅에 퍼졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 보고’ 혹은 ‘그에 대한 소식’입니다. 히브리어는 보고, 소식, 평판을 뜻할 수 있으며, 여기서는 특히 널리 알려진 명성을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms / Tetragrammaton
  rationale: 본문의 고유한 하나님의 이름을 일반 호칭으로 바꾸지 않고, 프로젝트 기본값대로 음역해 보존했습니다.
- source_word: וַיְהִי
  english_pob_choice: was
  chosen_korean: -셨고
  alternatives_korean:
  - 계셨고
  - 있으셨고
  lexicon: HALOT
  rationale: 서술적 과거에서 ‘함께 있다’의 상태를 자연스럽게 살리면서도, 야훼의 임재를 드러내는 한국어로 옮겼습니다.
- source_word: שָׁמְעוֹ
  english_pob_choice: his fame
  chosen_korean: 그의 소문
  alternatives_korean:
  - 그의 명성
  - 그에 대한 소식
  - 그의 명예
  lexicon: HALOT
  rationale: 이 어근은 ‘보고/소문/평판’ 범위를 가지므로, 과도하게 미화된 ‘명성’보다 넓은 의미를 담는 ‘소문’이 원문에 더 가깝습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 그 땅 전체에
  - 그 땅 곳곳에
  lexicon: HALOT
  rationale: 여기서 הארץ는 문맥상 전 세계가 아니라 정복 서사의 범위인 ‘땅’을 가리키므로, 간결하게 ‘온 땅에’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 임재 표현
  chosen_reading: ‘야훼께서 여호수아와 함께하셨고’로 옮겨, 단순한 동행이 아니라 하나님의 적극적 지지와 임재를 드러냈습니다.
  alternative_readings:
  - 야훼가 여호수아와 함께 있었다
  - 야훼께서 여호수아 편에 계셨고
  rationale: 히브리어의 ‘עם’ 구문은 성경 서사에서 보호와 성공을 수반하는 임재를 뜻하므로, 한국어에서도 그 신학적 함의를 보존하는 쪽이 적절합니다.
  doctrine_reference: 서사적 임재 신학 / 하나님의 함께하심
