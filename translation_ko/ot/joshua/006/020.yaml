  to: 백성이 함성을 지르고 나팔들을 불었습니다. 백성이 나팔 소리를 듣자 크게 외쳤고, 성벽은 제자리에서 무너져 내렸습니다[a]. 그러자 백성은 각 사람이 자기 앞을 향해 곧장 성으로 올라가 그 성을 점령했습니다.
