review_pass:
  verdict: revise
  source_fidelity: 히브리어는 여리고를 정탐했던 두 사람에게 한 여인을 집에서 데리고 나오도록 명하며, 그 여인을 הָאִשָּׁה הַזּוֹנָה(‘그 여자, 그 매춘부’)로 지칭한 뒤 목적어에서 다시 ‘그 여자’를 반복합니다. 초안의 ‘그 여인의 집, 곧 그 창녀의 집’은 동격을 두 개의 별도 소유 표현처럼 풀어 다소 과도하며, ‘그에게 속한’은 한국어에서 지시 대상이 불명확합니다. 이를 바로잡았습니다.
  naturalness: ‘그 여자, 곧 그 매춘부의 집’은 원문의 동격을 보존하면서도 소유 표현의 불필요한 반복을 피합니다. ‘그 여자와 그 여자가 가진 모든 것을 거기서 데리고 나오십시오’는 사람과 그에게 속한 전부를 함께 데리고 나오라는 명령을 자연스럽고 명확하게 전달합니다.
  terminology: זוֹנָה는 현대 표준어의 중립적이고 직접적인 표현인 ‘매춘부’로 옮겼습니다. ‘맹세한 대로’는 נִשְׁבַּעְתֶּם의 서약 의미를 보존합니다.
  issues:
