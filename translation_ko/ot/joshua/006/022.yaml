  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
  footnotes:
  - marker: a
    text: Or “the prostitute”; Hebrew repeats “the woman, the prostitute.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅을 정탐했던 두 사람에게 여호수아가 말했습니다. 「그 여자, 곧 그 매춘부의 집에 들어가서, 그 여자와 그 여자가 가진 모든 것을 거기서 데리고 나오십시오. 너희가 그 여자에게 맹세한 대로 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그 여자, 그 매춘부”이며, 뒤에서 다시 “그 여자”라고 합니다.
    reason: source_form_and_repetition
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  english_pob_choice: And to the two men
  chosen_korean: 그 땅을 정탐했던 두 사람에게
  alternatives_korean:
  - 그리고 그 두 사람에게
  - 그 땅을 살펴보았던 두 사람에게
  lexicon: HALOT
  rationale: 접속사와 여격 관계를 자연스러운 한국어로 옮기되, 바로 앞선 정탐 임무를 반영해 대상을 분명히 했습니다.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  english_pob_choice: who had spied out the land
  chosen_korean: 정탐했던
  alternatives_korean:
  - 살펴보았던
  - 탐지했던
  lexicon: HALOT
  rationale: רגל의 문맥상 의미는 정탐이므로, 군사적·서사적 뉘앙스를 살린 표준 번역을 택했습니다.
- source_word: בֵּית הָאִשָּׁה הַזּוֹנָה
  english_pob_choice: the house of the prostitute / the prostitute woman
  chosen_korean: 그 여인의 집, 곧 그 창녀의 집
  alternatives_korean:
  - 그 창녀의 집
  - 그 매춘부의 집
  lexicon: HALOT
  rationale: 히브리어의 동격 표현(‘그 여인, 그 창녀’)을 한국어에서도 드러내기 위해 한 번 더 풀어 주되, 의미를 완화하지 않고 직설적으로 옮겼습니다.
- source_word: וְהוֹצִיאוּ מִשָּׁם אֶת הָאִשָּׁה וְאֶת כָּל אֲשֶׁר לָהּ
  english_pob_choice: and bring out from there the woman and all that belongs to her
  chosen_korean: 그 여자와 그에게 속한 모든 것을 거기에서 데리고 나오십시오
  alternatives_korean:
  - 그 여인과 그에게 속한 모든 것을 거기에서 끌어내십시오
  - 그 여자와 그녀의 모든 것을 거기에서 데리고 나오십시오
  lexicon: HALOT
  rationale: ‘데리고 나오다’는 사람과 물건을 함께 포함하는 출애굽/탈출 맥락의 ‘bring out’을 자연스럽게 살리며, 반복된 ‘그 여자’를 ‘그 여자’로 옮겨 원문의 강조를 유지했습니다.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  english_pob_choice: just as you swore to her
  chosen_korean: 너희가 그 여자에게 맹세한 대로
  alternatives_korean:
  - 너희가 그 여자에게 약속한 대로
  - 너희가 그녀에게 맹세한 것처럼
  lexicon: HALOT
  rationale: נשבע는 단순 약속보다 ‘맹세하다’가 더 직접적이며, 조건절을 한국어 관용 표현 ‘-한 대로’로 자연스럽게 옮겼습니다.
theological_decisions:
