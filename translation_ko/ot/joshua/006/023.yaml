id: JOS.6.23
reference: Joshua 6:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
  footnotes:
  - marker: a
    text: Or 'all that belonged to her.' The Hebrew expression may be broader than persons alone, though in context it likely refers chiefly to members of her household.
    reason: lexical_alternative
  - marker: b
    text: Or 'all her clans' or 'all her relatives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 남자들, 곧 정탐꾼들이 들어가서 라합과 그녀의 아버지와 어머니와 형제들과 그녀에게 속한 모든 사람을[a] 데리고 나왔습니다. 또 그들은 그녀의 모든 친족들을[b] 데리고 나와 이스라엘 진영 밖에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀에게 속한 모든 것’. 히브리어 표현은 사람들보다 더 넓은 범위를 가리킬 수 있지만, 문맥상 주로 그 집안 사람들을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 모든 씨족들’ 또는 ‘그녀와 관련된 모든 가족들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים הַמְרַגְּלִים
  english_pob_choice: the young men, the spies
  chosen_korean: 그 젊은 남자들, 곧 정탐꾼들
  alternatives_korean:
  - 그 젊은이들, 곧 정탐꾼들
  - 정탐하던 젊은 남자들
  lexicon: HALOT
  rationale: נַעַר는 여기서 나이 어린 남자를 가리키는 말로 보는 것이 자연스럽고, 병렬된 ‘정탐꾼들’은 같은 무리를 풀어 설명하는 호격적 동격으로 처리하는 편이 원문 구조를 잘 드러냅니다.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  english_pob_choice: brought out
  chosen_korean: 데리고 나왔습니다
  alternatives_korean:
  - 끌어냈습니다
  - 이끌어냈습니다
  lexicon: HALOT
  rationale: יצא의 히필은 ‘밖으로 나오게 하다’라는 뜻이므로, 사람들을 안전하게 이동시킨 장면에는 ‘데리고 나오다’가 가장 자연스럽습니다.
- source_word: כָּל אֲשֶׁר לָהּ
  english_pob_choice: all who belonged to her
  chosen_korean: 그녀에게 속한 모든 사람
  alternatives_korean:
  - 그녀의 모든 소유
  - 그녀에게 딸린 모든 것
  lexicon: HALOT
  rationale: 이 표현은 단순한 소유물보다 라합의 보호 아래 있던 사람들을 가리키는 문맥이 강하므로, 사람 중심의 의미를 살려 옮겼습니다.
- source_word: מִשְׁפְּחוֹתֶיהָ
  english_pob_choice: all her families
  chosen_korean: 그녀의 모든 가족
  alternatives_korean:
  - 그녀의 모든 친족
  - 그녀의 모든 씨족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 친족 집단까지 포함할 수 있지만, 한국어에서는 ‘가족’이 문맥상 가장 읽기 쉽고 과도하게 기술적이지 않습니다.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  english_pob_choice: outside the camp of Israel
  chosen_korean: 이스라엘 진영 밖
  alternatives_korean:
  - 이스라엘의 진영 밖
  - 이스라엘 진 밖
  lexicon: HALOT
  rationale: ‘진영’은 מַחֲנֶה의 군사적·공동체적 공간 감각을 살리며, ‘밖’으로 간결하게 처리해 서술의 흐름을 유지합니다.
theological_decisions:
- issue: 라합과 그녀의 가족을 진영 밖에 둔 이유
  chosen_reading: 원문이 밝히는 공간적 진술만 살리고, 이유는 덧붙이지 않았습니다.
  alternative_readings:
  - 정결 규정에 따른 일시적 격리
  - 보호를 위한 임시 수용
  - 이스라엘 편입 전 대기
  rationale: 히브리어 본문은 그들을 진영 밖에 두었다고만 말할 뿐 이유를 설명하지 않으므로, 해석을 본문에 선반영하지 않고 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 신학적 해설을 본문에 삽입하지 않음'
