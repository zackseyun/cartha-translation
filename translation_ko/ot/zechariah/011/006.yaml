  source_fidelity: ‘짓밟다’는 주로 발로 밟는 행위를 뜻하므로, 여기서 땅을 파괴한다는 וְכִתְּתוּ(‘짓부수다/부수다’)의 의미를 충분히 옮기지 못합니다. 또한 각주 표지는 해당 본문 요소 가까이에 두는 편이 원문의 모호성과 어휘 설명을 정확히 연결합니다.
  naturalness: ‘저마다 자기 이웃의 손과 자기 왕의 손에’는 원문의 반복되는 ‘손’ 이미지와 분배적 표현을 보존하면서, ‘그의 이웃의 손과 그의 왕의 손’보다 현대 표준 한국어에서 더 자연스럽습니다. ‘야훼의 말씀입니다’는 נְאֻם יְהוָה에 상응하는 격식 있는 예언자적 공식입니다.
  terminology: ‘야훼’, ‘긍휼을 베풀다’, ‘손에 넘겨주다’, ‘그 땅’은 적절합니다. 마지막 목적어는 히브리어에 명시되지 않으므로 본문에서 ‘그것’을 보충하되, 각주에서 ‘그들’과 ‘그 땅’의 가능성을 밝혀야 합니다.
