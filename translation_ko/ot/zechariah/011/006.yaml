id: ZEC.11.6
reference: Zechariah 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
  footnotes:
  - marker: a
    text: Or 'the inhabitants of the earth' if הָאָרֶץ is taken universally rather than locally.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'each man into the hand of his neighbor and into the hand of his king'; the wording depicts each person being given over to another's power.
    reason: lexical_alternative
  - marker: c
    text: Or 'I will not rescue [them/the land] from their hand.' The Hebrew object is not explicit in the final clause and is supplied in English from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 다시는 그 땅의 주민들에게[a] 긍휼을 베풀지 않겠다. 야훼의 말씀입니다. 보십시오, 내가 각 사람을 저마다 자기 이웃의 손과 자기 왕의 손에 넘겨주겠고[b], 그들이 그 땅을 짓부술 것이며, 나는 그들의 손에서 그것을 건져내지 않겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 הָאָרֶץ를 보편적으로 이해하면 ‘온 땅’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘각 사람을 그의 이웃의 손과 그의 왕의 손에’라고 되어 있어, 각 사람이 다른 이들의 권세 아래 넘겨지는 모습을 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절의 목적어는 히브리어에서 명시되지 않습니다. 문맥에 따라 ‘그들’ 또는 ‘그 땅’을 보충해 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֶחְמֹל
  english_pob_choice: will no longer have compassion
  chosen_korean: 다시는 … 긍휼을 베풀지 않겠습니다
  alternatives_korean:
  - 다시는 … 불쌍히 여기지 않겠습니다
  - 다시는 … 용서하지 않겠습니다
  lexicon: HALOT
  rationale: חמל은 불쌍히 여기다/긍휼을 베풀다의 뜻이므로, 심판 맥락을 살리면서도 단순한 감정보다 자비의 철회를 드러내는 표현을 택했습니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 그 땅의 주민들
  alternatives_korean:
  - 그 땅에 사는 사람들
  - 그 땅의 거주자들
  - 땅의 주민들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주하는 자들’의 분사적 명사구이므로, 문맥상 특정 지역을 가리키는 ‘그 땅의 주민들’로 옮겼습니다.
- source_word: מַמְצִיא
  english_pob_choice: am handing over
  chosen_korean: 넘겨주겠고
  alternatives_korean:
  - 건네주겠고
  - 내어주겠고
  - 맡기겠고
  lexicon: HALOT
  rationale: 히필 מצא의 관용적 의미인 ‘남의 손에 들어가게 하다/넘겨주다’를 살려, 심판의 사법적·폭력적 뉘앙스를 자연스럽게 반영했습니다.
- source_word: אִישׁ בְּיַד רֵעֵהוּ וּבְיַד מַלְכּוֹ
  english_pob_choice: each into the hand of his neighbor and into the hand of his king
  chosen_korean: 각 사람을 그의 이웃의 손과 그의 왕의 손에
  alternatives_korean:
  - 각 사람을 그의 이웃과 그의 왕의 권세에
  - 각 사람을 그의 이웃과 그의 왕의 손에
  lexicon: HALOT
  rationale: ‘손’은 권세/지배의 히브리 관용을 보존하는 핵심 이미지이므로 유지했고, הָאָדָם אִישׁ의 분배적 구조는 ‘각 사람’으로 풀어 자연스럽게 했습니다.
- source_word: וְכִתְּתוּ אֶת הָאָרֶץ
  english_pob_choice: they will crush the land
  chosen_korean: 그들이 그 땅을 짓밟을 것이며
  alternatives_korean:
  - 그들이 그 땅을 부술 것이며
  - 그들이 그 땅을 산산조각 낼 것이며
  - 그들이 그 땅을 짓이길 것이며
  lexicon: HALOT
  rationale: כתת은 깨뜨리다/짓부수다/짓밟다의 폭력적 이미지를 가지므로, 대상이 ‘땅’일 때 한국어로는 ‘짓밟다’가 가장 직관적으로 그 파괴성을 드러냅니다.
- source_word: לֹא אַצִּיל מִיָּדָם
  english_pob_choice: I will not deliver it from their hand
  chosen_korean: 나는 그들의 손에서 그것을 건져내지 않겠습니다
  alternatives_korean:
  - 나는 그들의 손에서 그것을 구원하지 않겠습니다
  - 나는 그들의 손에서 그것을 구해내지 않겠습니다
  lexicon: HALOT
  rationale: נצל의 기본 의미를 살리되, 앞뒤의 ‘손’ 관용을 유지하면서 한국어로는 ‘건져내다’가 가장 자연스럽고 생생한 대응입니다.
theological_decisions:
- issue: 야훼(יְהוָה) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약명인 יְהוָה를 직접 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 하나님 자신이 선포하시는 심판의 권위를 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: הָאָרֶץ의 범위
  chosen_reading: 그 땅
  alternative_readings:
  - 그 나라
  - 세상
  rationale: 스가랴 11장의 문맥은 특정 공동체와 지역에 대한 심판이므로, 이를 ‘세상’으로 보편화하지 않고 ‘그 땅’으로 제한해 원문이 허용하는 범위를 지켰습니다.
  doctrine_reference: Translation philosophy §1, §5
