  to: 내가 다시는 그 땅의 주민들에게[a] 긍휼을 베풀지 않겠다. 야훼의 말씀입니다. 보십시오, 내가 각 사람을 저마다 자기 이웃의 손과 자기 왕의 손에 넘겨주겠고[b], 그들이 그 땅을 짓부술 것이며, 나는 그들의 손에서 그것을 건져내지 않겠습니다.[c]
  rationale: ‘짓밟을 것이다’를 כתת의 핵심 의미인 ‘짓부술 것이다’로 바로잡았습니다. 예언자적 선언 공식을 자연스러운 합쇼체로 다듬고, 분배적 표현과 ‘손’의 권세 이미지를 유지했습니다. 세 각주를 각각 설명하는 본문 요소에 붙여 각주 연결도 명확하게 했습니다.
