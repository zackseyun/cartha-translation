base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
  footnotes:
  - marker: a
    text: Or 'the idol shepherd.' The Hebrew term can mean 'worthless' or 'idol-like/empty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 양 떼를 버리는 무가치한 목자에게 화가 있습니다! 칼이 그의 팔과 오른쪽 눈을 향합니다. 그의 팔은 완전히 마를 것이며, 그의 오른쪽 눈은 심히 흐려질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상 목자’. 히브리어는 ‘무가치한’, ‘우상 같은’, 또는 ‘헛된’이라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프다
  - 아아
  - 불행하여라
  lexicon: HALOT
  rationale: 예언적 책망과 심판 선언의 감탄사로서, 한국어에서는 ‘화 있을진저’가 가장 자연스럽고 경고적 어조를 잘 살립니다.
- source_word: רֹעִי הָאֱלִיל
  english_pob_choice: the worthless shepherd
  chosen_korean: 무가치한 목자
  alternatives_korean:
  - 우상 목자
  - 헛된 목자
  - 어리석은 목자
  lexicon: HALOT
  rationale: אֱלִיל의 ‘헛됨/무가치함’에 초점을 두어, 본문의 책망 대상인 실패한 지도자를 직접적으로 드러내는 표현을 택했습니다.
- source_word: עֹזְבִי הַצֹּאן
  english_pob_choice: who abandons the flock
  chosen_korean: 양 떼를 버리는 자
  alternatives_korean:
  - 양 떼를 떠나는 자
  - 양 떼를 저버리는 자
  lexicon: HALOT
  rationale: 분사형이 목자의 지속적 특징을 나타내므로, ‘버리는 자’로 옮겨 지속적·규정적 의미를 살렸습니다.
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  english_pob_choice: A sword is against his arm and against his right eye
  chosen_korean: 칼이 그의 팔과 그의 오른쪽 눈을 칩니다
  alternatives_korean:
  - 칼이 그의 팔과 그의 오른쪽 눈에 있습니다
  - 칼이 그의 팔과 그의 오른쪽 눈 위에 있습니다
  lexicon: HALOT
  rationale: 히브리어의 서술적 심판 선언을 한국어에서 자연스럽게 재현하되, ‘~을 칩니다’로 칼의 공격적·심판적 작용을 드러냈습니다.
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  english_pob_choice: His arm will completely wither
  chosen_korean: 그의 팔은 반드시 마르고
  alternatives_korean:
  - 그의 팔은 완전히 마를 것입니다
  - 그의 팔은 철저히 마를 것입니다
  lexicon: HALOT
  rationale: 강조형 반복을 ‘반드시’로 옮겨 확실성과 심판의 단호함을 살렸고, ‘마르고’로 어근의 건조·쇠퇴 이미지를 유지했습니다.
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  english_pob_choice: and his right eye will be utterly dimmed
  chosen_korean: 그의 오른쪽 눈은 반드시 흐려질 것입니다
  alternatives_korean:
  - 그의 오른쪽 눈은 완전히 어두워질 것입니다
  - 그의 오른쪽 눈은 반드시 희미해질 것입니다
  lexicon: HALOT
  rationale: כָּהֹה / תִכְהֶה의 ‘희미해짐, 흐려짐’을 과도하게 해석하지 않기 위해 ‘흐려지다’를 택했습니다.
theological_decisions:
- issue: 무가치한 목자라는 조롱적 표현의 강도
  chosen_reading: ‘무가치한 목자’로 옮겨 지도자 비판의 도덕적·기능적 무익함을 드러냈습니다.
  alternative_readings:
  - 우상 같은 목자
  - 헛된 목자
  rationale: 본문의 핵심은 양 떼를 버린 목자의 실패와 그에 대한 심판이므로, ‘무가치한’이 가장 직접적으로 책망의 뉘앙스를 전달합니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 강조형 동사의 반복 처리
  chosen_reading: ‘반드시’로 반복 강조를 살려 확실한 심판 선언으로 읽히게 했습니다.
  alternative_readings:
  - 완전히
  - 철저히
  - 꼭
  rationale: 히브리어의 부정확한 정도를 완화하지 않고, 동일한 심판 확정을 한국어의 자연스러운 강조로 대응시켰습니다.
  doctrine_reference: Hebrew intensive construction (infinitive absolute + finite verb)
