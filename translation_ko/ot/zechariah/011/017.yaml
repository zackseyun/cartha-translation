  source_fidelity: 첫 심판 선언은 동사가 없는 ‘칼이 그의 팔과 오른쪽 눈을 향함/대적함’이라는 표현입니다. 초안의 ‘칩니다’는 공격이 실제로 가해지는 방식까지 명시하여 원문의 의도적 비동사적·선언적 표현보다 한 단계 해석을 더합니다. ‘향합니다’로 고쳐 이 모호성과 심판의 위협을 보존했습니다. 두 강조형은 각각 ‘완전히’와 ‘심히’로 반영했으며, 눈의 상태를 완전한 실명으로 과장하지 않았습니다.
