id: ZEC.11.3
reference: Zechariah 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
  footnotes:
  - marker: a
    text: Or 'their splendor.' The Hebrew term can refer to magnificence and may allude concretely to what adorned them.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pride of the Jordan'; the phrase may refer specifically to the luxuriant thickets along the Jordan’s banks.
    reason: lexical_alternative
translation:
  language: ko
  text: 목자들의 통곡 소리가 들립니다[a]. 그들의 화려함이 무너졌기 때문입니다. 젊은 사자들의 포효 소리가 들립니다[b]. 요단의 위엄이 무너졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 위엄’. 히브리어 낱말은 위엄을 뜻할 수도 있고, 구체적으로는 화려한 옷이나 장식을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단의 자랑’. 이 표현은 요단 강변의 무성한 수풀을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  english_pob_choice: The sound of
  chosen_korean: …소리가 들립니다
  alternatives_korean:
  - …의 소리가 들립니다
  - …의 목소리가 들립니다
  lexicon: HALOT
  rationale: קוֹל은 ‘소리/음성/울부짖음’의 폭이 있으나, 여기서는 평행하는 두 감각적 장면을 살려 ‘소리’로 옮기는 것이 자연스럽습니다.
- source_word: יִלְלַת הָרֹעִים
  english_pob_choice: the shepherds’ wailing
  chosen_korean: 목자들의 통곡
  alternatives_korean:
  - 목자들의 울부짖음
  - 목자들의 애곡
  lexicon: HALOT
  rationale: יִלְלָה는 슬픔의 외침을 가리키므로, 인간 주어인 ‘목자들’과 맞물려 ‘통곡’이 가장 적절합니다.
- source_word: אַדַּרְתָּם
  english_pob_choice: their splendor
  chosen_korean: 그들의 화려함
  alternatives_korean:
  - 그들의 영광
  - 그들의 위엄
  - 그들의 장엄함
  lexicon: HALOT
  rationale: אַדֶּרֶת/אַדָּרָה는 겉으로 드러나는 장식적 화려함이나 탁월함을 가리킬 수 있어, 본문에서는 외형적 풍성함을 살린 ‘화려함’이 적합합니다.
- source_word: שַׁאֲגַת כְּפִירִים
  english_pob_choice: the young lions’ roaring
  chosen_korean: 젊은 사자들의 포효
  alternatives_korean:
  - 어린 사자들의 포효
  - 젊은 사자들의 울부짖음
  lexicon: HALOT
  rationale: כְּפִירִים은 힘 있는 ‘젊은 사자들’이며, שַׁאֲגָה는 사자의 울부짖음이므로 ‘포효’가 의미와 음성적 강도를 잘 전달합니다.
- source_word: גְּאוֹן הַיַּרְדֵּן
  english_pob_choice: the majesty of the Jordan
  chosen_korean: 요단의 위엄
  alternatives_korean:
  - 요단의 자랑
  - 요단의 장엄함
  - 요단의 자랑거리
  lexicon: HALOT
  rationale: גְּאוֹן은 ‘자랑/위엄/장엄함’의 범위를 가지지만, 여기서는 요단 강가의 풍성하고 위풍당당한 모습까지 포괄할 수 있는 ‘위엄’이 가장 무난합니다.
theological_decisions:
- issue: 이 시적 병행구를 목자와 사자를 상징 해석으로 풀어쓸지 여부
  chosen_reading: 본문의 이미지를 그대로 유지해 번역했습니다.
  alternative_readings:
  - 목자들을 지도자들로 풀어쓰기
  - 젊은 사자들을 압제자나 통치자로 풀어쓰기
  rationale: 본문 자체는 상징 해석을 명시하지 않으므로, 독자가 예언적 이미지의 긴장을 그대로 느끼도록 직역에 가까운 표현을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: גְּאוֹן הַיַּרְדֵּן의 의미 범위
  chosen_reading: ‘요단의 위엄’으로 두고, 구체적 지형 이미지는 본문 밖에서 열어두었습니다.
  alternative_readings:
  - 요단의 자랑
  - 요단 강가의 덤불
  - 요단의 장엄한 갈대숲
  rationale: 히브리어는 직접적으로 ‘덤불’을 말하지 않으므로, 원어의 추상 명사를 살리면서도 문맥상 풍성한 강변의 쇠락을 암시하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
