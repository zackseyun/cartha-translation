base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
  footnotes:
  - marker: a
    text: Or 'the implements/gear of a foolish shepherd.' The Hebrew term is broad and refers to the articles or equipment associated with a shepherd.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 제게 말씀하셨습니다. “다시 한 번 너를 위해 어리석은 목자의 도구를 가져라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּלִי는 넓은 말로, 목자와 관련된 물품·도구·장비를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 형태인 야훼를 사용해 신명기적 이름의 직접성을 살렸습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 제게
  alternatives_korean:
  - 내게
  - 나에게
  lexicon: HALOT
  rationale: 1인칭 목적격을 자연스러운 현대 한국어로 옮기되, 예언서 내 화자-수신 관계를 살려 제게를 선택했습니다.
- source_word: עוֹד קַח לְךָ
  english_pob_choice: Take again for yourself
  chosen_korean: 다시 한 번 너를 위해 가져라
  alternatives_korean:
  - 다시 가져라
  - 너를 위해 가져라
  - 다시 한 번 가져라
  lexicon: HALOT
  rationale: עוֹד의 반복/추가 의미를 '다시 한 번'으로, לְךָ의 자기 지향 뉘앙스를 '너를 위해'로 반영했습니다.
- source_word: כְּלִי
  english_pob_choice: equipment
  chosen_korean: 도구
  alternatives_korean:
  - 장비
  - 기구
  - 도구들
  lexicon: HALOT
  rationale: 이 어근은 폭넓게 '그릇/도구/장비'를 가리키므로, 목자 문맥에서 집합적이고 현대적인 '도구'가 가장 무난합니다.
- source_word: רֹעֶה אֱוִלִי
  english_pob_choice: a foolish shepherd
  chosen_korean: 어리석은 목자
  alternatives_korean:
  - 우둔한 목자
  - 어리석은 목자
  lexicon: HALOT
  rationale: 형용사 אֱוִלִי의 기본 의미인 어리석음을 직접 살리되, 본문의 상징적 평가를 과도하게 해석하지 않도록 유지했습니다.
theological_decisions:
- issue: 상징적 목자 인물의 해석 범위
  chosen_reading: 본문의 표지를 따라 '어리석은 목자'로만 옮기고, 특정 역사 인물이나 종말론적 존재로 특정하지 않았습니다.
  alternative_readings:
  - 특정한 역사적 통치자
  - 이스라엘의 부패한 지도자들 일반
  - 종말론적 반(反)목자
  rationale: 히브리어 본문 자체가 이 절에서 인물을 더 좁혀 말하지 않으므로, 해석 논쟁을 번역문에 선반영하지 않고 긴장을 보존했습니다.
  doctrine_reference: 해석 쟁점을 확정하지 않고 본문의 상징성을 보존합니다.
