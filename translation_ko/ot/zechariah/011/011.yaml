  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the poor of the flock' or 'the humble of the flock.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it was annulled' or 'it was revoked,' highlighting the covenantal force of the image.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 그날에 부서졌고, 그리하여 나를 지키고 있던 양 떼의 가난한 자들이 그것이 야훼의 말씀인 줄 알았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양 떼의 가난한 자들’, ‘양 떼의 겸손한 자들’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무효가 되었다’, ‘폐기되었다’라고도 옮길 수 있으며, 언약적 효력을 상실한 이미지를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  english_pob_choice: it was broken
  chosen_korean: 부서졌고
  alternatives_korean:
  - 무효가 되었고
  - 폐기되었고
  - 깨졌고
  lexicon: HALOT
  rationale: 직접적인 ‘깨짐’의 이미지를 살리면서, 문맥상 막대/언약 표지가 무력화된 뜻도 함께 드러내기 위해 ‘부서졌고’로 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때
  lexicon: HALOT
  rationale: 예언서의 관용적인 시간 표지를 현대 한국어로 자연스럽게 유지했습니다.
- source_word: עֲנִיֵּי הַצֹּאן
  english_pob_choice: the afflicted of the flock
  chosen_korean: 양 떼의 가난한 자들
  alternatives_korean:
  - 양 떼의 억눌린 자들
  - 양 떼의 가난하고 불쌍한 자들
  - 양 떼의 겸손한 자들
  lexicon: HALOT
  rationale: עֲנִיִּים의 의미 범위(가난한/고난받는/겸손한)를 고려하되, 예언적 문맥에서 억눌리고 비천한 অবস্থ을 가장 직접적으로 드러내는 ‘가난한 자들’을 택했습니다.
- source_word: הַשֹּׁמְרִים אֹתִי
  english_pob_choice: who were watching me
  chosen_korean: 나를 지키고 있던
  alternatives_korean:
  - 나를 지켜보던
  - 나를 감시하던
  - 나를 살피던
  lexicon: HALOT
  rationale: שׁמר의 기본 뜻을 따라 ‘지키다’로 옮기되, 진행형 분사 감각을 위해 ‘있던’을 덧붙여 자연스럽게 만들었습니다.
- source_word: כִּי דְבַר יְהוָה הוּא
  english_pob_choice: that it was the word of Yahweh
  chosen_korean: 그것이 야훼의 말씀인 줄
  alternatives_korean:
  - 그것이 야훼의 말씀임을
  - 그것이 야훼의 말씀이라는 것을
  - 그것이 야훼의 말씀이었음을
  lexicon: HALOT
  rationale: 직접 인식 내용이므로 ‘인 줄’로 풀어, 사건이 야훼의 말씀임을 알아차렸다는 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, 본문 인식 가능성과 원전의 언약 이름을 살리기 위해 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
