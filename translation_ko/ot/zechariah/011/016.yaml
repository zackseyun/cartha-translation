theological_decisions:
- issue: 목자 인물의 성격 규정
  chosen_reading: 본문이 제시하는 대로 특정 신원 규정 없이, 포악한 목자로만 번역했습니다.
  alternative_readings:
  - 악한 목자
  - 쓸모없는 목자
  - 특정한 종말론적 대적
