id: ZEC.11.16
reference: Zechariah 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
  footnotes:
  - marker: a
    text: Or 'the young'; Hebrew הַנַּעַר can denote a young one/youth, though in this shepherding context many understand it as a straying or vulnerable member of the flock.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lost' / 'those being destroyed' for 'the perishing.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the healthy one' for 'the standing.' The Hebrew is literally 'the one standing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 이 땅에 한 목자를 세울 것이니, 그는 사라져 가는 자들을 돌보지 않고, 흩어진 자들을 찾지 않으며, 부러진 것을 고치지 않고, 서 있는 자들을 붙들어 주지 않을 것입니다. 그는 살진 자들의 살을 먹고 그들의 발굽을 찢어 버릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흩어진 자들’로 옮긴 히브리어 הַנַּעַר는 문맥상 잃어버린 양 또는 취약한 어린 양으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사라져 가는 자들’의 히브리어는 ‘잃은 자들’ 또는 ‘멸망해 가는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘서 있는 자들’은 문자적으로는 ‘서 있는 것/자’이며, 문맥상 ‘건강한 것/자’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / behold
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의 환기 표현을 현대 합쇼체로 자연스럽게 옮기되, 문장 시작의 강한 경고성을 유지했습니다.
- source_word: רֹעֶה
  english_pob_choice: a shepherd
  chosen_korean: 한 목자
  alternatives_korean:
  - 목자
  - 양치는 사람
  lexicon: HALOT
  rationale: 직역을 유지하면서도 예언서의 상징적 지도자 이미지를 살리기 위해 '목자'를 택했습니다.
- source_word: הַנִּכְחָדוֹת / הַנַּעַר / הַנִּשְׁבֶּרֶת / הַנִּצָּבָה
  english_pob_choice: the perishing / the straying / the broken / the standing
  chosen_korean: 사라져 가는 자들 / 흩어진 자들 / 부러진 것 / 서 있는 자들
  alternatives_korean:
  - 소멸하는 자들 / 길 잃은 자들 / 상한 것 / 건강한 자들
  - 망하는 자들 / 떠도는 자들 / 상처 입은 것 / 버티는 자들
  lexicon: HALOT
  rationale: 포본의 어휘 선택처럼 각각의 히브리어 분사적 표현을 병렬 구조로 살려, 돌봄의 부재를 구체적으로 드러냈습니다. '흩어진 자들'은 대상의 상태를, '서 있는 자들'은 문자적 투명성을 유지합니다.
- source_word: יֹאכַל / יְפָרֵק
  english_pob_choice: will eat ... and tear off
  chosen_korean: 살을 먹고 ... 발굽을 찢어 버릴 것입니다
  alternatives_korean:
  - 살을 먹고 ... 발굽을 뜯어낼 것입니다
  - 살을 먹고 ... 발굽을 끊어 버릴 것입니다
  lexicon: HALOT
  rationale: 폭력적 포식 이미지를 약화하지 않도록 '찢어 버릴 것입니다'를 선택해 동물적 잔혹성을 분명하게 보였습니다.
theological_decisions:
- issue: 목자 인물의 성격 규정
  chosen_reading: 본문이 제시하는 대로 특정 신원 규정 없이, 포악한 목자로만 번역했습니다.
  alternative_readings:
  - 악한 목자
  - 쓸모없는 목자
  - 특정한 종말론적 대적
  rationale: 본문 자체는 판단의 기능을 보여 주지만 인물을 여기서 명시적으로 규정하지 않으므로, 번역은 예언적 형상을 보존하고 신학적 결론은 열어 두었습니다.
  doctrine_reference: 해석의 긴장을 보존하고 본문이 말하는 범위를 넘지 않음
