  source_fidelity: 수정이 필요합니다. הַנַּעַר를 ‘흩어진 자들’로 번역한 것은 히브리어 어근과 맞지 않습니다. 이 단어의 기본 의미는 ‘어린 것/젊은 것’이며, 목자 비유의 문맥에서 ‘길 잃은 것’으로 이해하는 해석 가능성은 각주로 남길 수 있습니다. 또한 הַנִּשְׁבֶּרֶת에 대해 ‘고치다’보다 생명체의 상함에 자연스러운 ‘치료하다’가 רפא에 더 알맞습니다.
  naturalness: 합쇼체는 전반적으로 적절합니다. 다만 양 떼를 가리키는 연속된 명사형을 ‘것’으로 통일하면 ‘부러진 것’과 ‘서 있는 자들’의 혼용보다 자연스럽고, 원문의 성·수의 병렬도 비교적 잘 드러납니다. ‘발굽을 뜯어 낼 것입니다’는 יְפָרֵק의 파괴적 이미지를 자연스럽게 전달합니다.
  terminology: ‘목자’는 רֹעֶה의 문자적·비유적 공명을 보존합니다. ‘사라져 가는 것들’은 הַנִּכְחָדוֹת의 소멸·멸망의 폭을 유지하며, ‘서 있는 것’은 הַנִּצָּבָה의 문자적 의미를 보존합니다. 해당 표현들의 대안적 이해는 각주에서 제시합니다.
