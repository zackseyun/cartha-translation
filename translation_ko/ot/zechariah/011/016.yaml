  to: 보십시오, 내가 이 땅에 한 목자를 일으킬 것이니, 그는 사라져 가는 것들[b]을 돌보지 않고, 어린 것[a]을 찾지 않으며, 부러진 것을 치료하지 않고, 서 있는 것[c]을 보살피지 않을 것입니다. 그는 살진 것들의 살을 먹고 그들의 발굽을 뜯어 낼 것입니다.
