  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
  footnotes:
  - marker: a
    text: Or 'the young'; Hebrew הַנַּעַר can denote a young one/youth, though in this shepherding context many understand it as a straying or vulnerable member of the flock.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lost' / 'those being destroyed' for 'the perishing.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the healthy one' for 'the standing.' The Hebrew is literally 'the one standing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 이 땅에 한 목자를 일으킬 것이니, 그는 사라져 가는 것들[b]을 돌보지 않고, 어린 것[a]을 찾지 않으며, 부러진 것을 치료하지 않고, 서 있는 것[c]을 보살피지 않을 것입니다. 그는 살진 것들의 살을 먹고 그들의 발굽을 뜯어 낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린 것’으로 옮긴 히브리어 הַנַּעַר는 ‘젊은 것’을 뜻합니다. 목자 비유의 문맥에서는 ‘길 잃은 것’ 또는 취약한 어린 양으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사라져 가는 것들’은 ‘잃은 것들’ 또는 ‘멸망해 가는 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘서 있는 것’은 문자적으로 ‘서 있는 것’이며, 문맥상 ‘건강한 것’ 또는 ‘제대로 서 있는 것’으로 이해되기도 합니다.
    reason: lexical_alternative
