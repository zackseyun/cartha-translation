reference: Zechariah 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
  footnotes:
  - marker: a
    text: Or 'I destroyed' or 'I cut off' the three shepherds; the Hebrew verb can denote causing them to disappear or be eliminated.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'my soul grew impatient' renders a Hebrew idiom expressing deep impatience or revulsion.
    reason: lexical_alternative
  - marker: c
    text: The 'three shepherds' are not identified in the text; proposed interpretations vary.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 나는 한 달 안에 그 세 목자를 제거하였고[a], 내 영은 그들 때문에 지쳤으며[b], 그들의 영도 나를 싫어하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 그 세 목자를 멸하였다’ 또는 ‘나는 그 세 목자를 끊어 버렸다’는 뜻일 수 있습니다. 히브리어 동사는 그들을 사라지게 하거나 제거하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 영은 지쳤으며’는 깊은 답답함이나 혐오를 나타내는 히브리어 관용구를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 세 목자’가 누구인지는 본문에서 밝히지 않으며, 여러 해석이 제시됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַכְחִד
  english_pob_choice: I removed
  chosen_korean: 제거하였고
  alternatives_korean:
  - 없애버렸고
  - 끊어버렸고
  - 죽였고
  lexicon: HALOT
  rationale: כחד의 사역형은 없애거나 사라지게 하거나 제거하는 뜻을 가질 수 있으므로, ‘제거하다’가 결과를 분명히 하면서도 구체적 방식은 과도하게 단정하지 않습니다.
- source_word: שְׁלֹשֶׁת הָרֹעִים
  english_pob_choice: the three shepherds
  chosen_korean: 그 세 목자
  alternatives_korean:
  - 그 세 목양자
  - 세 지도자
  lexicon: HALOT
  rationale: 본문의 비유적 표현을 살려 ‘목자’를 유지했으며, 해석을 본문에 미리 주입하는 ‘지도자’는 피했습니다.
- source_word: בְּיֶרַח אֶחָד
  english_pob_choice: in one month
  chosen_korean: 한 달 안에
  alternatives_korean:
  - 한 달에
  - 한 달 동안에
  lexicon: HALOT
  rationale: 히브리어의 짧은 시간 압축을 한국어로 자연스럽게 전달하는 표현으로, 사건의 급박함을 잘 살립니다.
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם / נַפְשָׁם בָּחֲלָה בִי
  english_pob_choice: my soul grew impatient with them / their soul also loathed me
  chosen_korean: 내 영은 그들 때문에 지쳤으며 / 그들의 영도 나를 싫어하였습니다
  alternatives_korean:
  - 내 영은 그들을 참지 못하였으며 / 그들의 영도 나를 혐오하였습니다
  - 내 마음은 그들 때문에 좁아졌으며 / 그들의 마음도 나를 싫어하였습니다
  lexicon: HALOT
  rationale: ‘짧아지다’라는 관용구를 자연스러운 한국어로 풀되, 히브리어의 내적 반응을 살리기 위해 단순한 ‘나’보다 ‘영’을 유지했습니다. 두 번째 절의 ‘בחל’은 강한 혐오의 의미이지만, 문맥상 자연스러운 정도로 ‘싫어하다’를 택했습니다.
theological_decisions:
- issue: ‘my soul’ / ‘their soul’의 인류학적 표현을 어떻게 옮길지
  chosen_reading: 둘 다 ‘영’으로 옮겨, 히브리어의 평행 구조를 보존했습니다.
  alternative_readings:
  - ‘마음’으로 옮김
  - 단순히 ‘내가 / 그들이’로 의역
  rationale: 본문은 내면의 정서와 태도를 영혼/영의 표현으로 병렬시킵니다. 한국어에서 ‘영’은 다소 직역적이지만, 원문의 대칭성과 표현 강도를 살리기 위해 유지했습니다.
  doctrine_reference: 히브리어 인류학의 평행법을 보존하여 본문이 가진 감정적 긴장을 유지합니다.
