source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י הַשְׁלִיכֵ֨/הוּ֙ אֶל הַ/יּוֹצֵ֔ר אֶ֣דֶר הַ/יְקָ֔ר אֲשֶׁ֥ר יָקַ֖רְתִּי מֵֽ/עֲלֵי/הֶ֑ם וָֽ/אֶקְחָ/ה֙ שְׁלֹשִׁ֣ים הַ/כֶּ֔סֶף וָ/אַשְׁלִ֥יךְ אֹת֛/וֹ בֵּ֥ית יְהוָ֖ה אֶל הַ/יּוֹצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
  footnotes:
  - marker: a
    text: Hebrew 'the potter.' Some interpreters propose 'the treasury' here because of the difficult context and the New Testament's use of this passage, but the Masoretic Text reads 'potter' in both places.
    reason: alternative_reading
  - marker: b
    text: 'Or ''the magnificent price,'' likely ironic: the phrase mocks the insultingly low valuation of thirty pieces of silver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 제게 말씀하셨습니다. “그것을 옹기장이[a]에게 던지십시오. 그들이 나를 평가한 그 훌륭한 값[b]이로구나.” 그래서 저는 은 서른 개를 가져다가 야훼의 집에 던졌습니다. 곧 옹기장이에게 던진 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기와 절 끝의 두 곳 모두 ‘옹기장이’를 읽습니다. 문맥의 난해함과 신약에서 이 구절을 사용하는 방식 때문에 일부 해석자는 ‘보물고’ 또는 ‘금고’를 제안하지만, 마소라 본문은 두 곳 모두 ‘옹기장이’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘그 훌륭한 값’은 반어적 표현일 가능성이 큽니다. 서른 은전이라는 모욕적으로 낮은 평가를 겉으로는 훌륭한 값이라고 비꼬아 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 고유한 신명 표기를 따라 원문 신명을 직접 드러내되, 한국어 본문에서는 표준적인 학술 음역인 ‘야훼’를 사용했습니다.
- source_word: הַשְׁלִיכֵהוּ
  english_pob_choice: Throw it
  chosen_korean: 그것을 … 던져라
  alternatives_korean:
  - 그것을 … 버려라
  - 그것을 … 던지십시오
  lexicon: HALOT
  rationale: 명령형 שלך의 직접적 의미를 살려 ‘던져라’로 옮겼고, 목적어 대명사도 앞선 ‘은 서른 개’와 연결되도록 ‘그것’을 유지했습니다.
- source_word: הַיּוֹצֵר
  english_pob_choice: the potter
  chosen_korean: 옹기장이
  alternatives_korean:
  - 도공
  - 그릇 만드는 사람
  - 재무관
  lexicon: HALOT
  rationale: 본문의 마소라 본문이 두 곳 모두 ‘옹기장이’를 읽으므로, 본문 증거를 따라 직역적으로 유지했습니다.
- source_word: אֶדֶר הַיְקָר
  english_pob_choice: the lordly price
  chosen_korean: 그 당당한 값
  alternatives_korean:
  - 그 영화로운 값
  - 그 값진 값
  - 그 빛나는 값
  lexicon: HALOT
  rationale: ‘당당한’은 אֶדֶר의 위엄/장엄함을, ‘값’은 הַיְקָר의 가치/귀함을 살리면서도, 실제로는 모욕적으로 낮은 평가라는 아이러니를 한국어에서 드러내기 위해 택했습니다.
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  english_pob_choice: I was valued by them
  chosen_korean: 내가 그들에게서 값지게 여겨진
  alternatives_korean:
  - 그들이 나를 값매긴
  - 그들이 나를 값지게 여긴
  - 그들에 의해 평가된
  lexicon: HALOT
  rationale: 수동/피동적 뉘앙스를 살려 ‘값지게 여겨진’으로 옮기되, 평가 주체를 ‘그들에게서’로 밝혀 원문의 아이러니를 유지했습니다.
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  english_pob_choice: the thirty pieces of silver
  chosen_korean: 은 서른 개
  alternatives_korean:
  - 은 서른 조각
  - 은 서른 닢
  - 은 서른 세겔
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘그 은의 서른’이므로, 통용되는 관용구를 유지하되 ‘세겔’처럼 본문에 없는 단위를 덧붙이지 않았습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: ‘집’이라는 히브리어 표현을 살려, 제도적 해석인 ‘성전’보다 원문에 더 가까운 ‘야훼의 집’으로 옮겼습니다.
theological_decisions:
- issue: ‘옹기장이’의 반복을 본문대로 유지할지, 문맥상 추정되는 대체어로 바꿀지
  chosen_reading: 마소라 본문이 두 차례 모두 ‘옹기장이’를 읽으므로, 난해함을 이유로 ‘창고/재무관’ 등으로 바꾸지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘창고’로 이해
  - ‘재무관’으로 이해
  - 본문을 보정해 다른 의미로 처리
  rationale: 본문 난해성은 주석으로 처리하되, 원문 증거를 본문에서 훼손하지 않는 것이 POB의 원칙에 맞습니다.
  doctrine_reference: 원문 우선 원칙과 본문 비평 보수성
