id: ZEC.11.7
reference: Zechariah 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶרְעֶה֙ אֶת צֹ֣אן הַֽ/הֲרֵגָ֔ה לָ/כֵ֖ן עֲנִיֵּ֣י הַ/צֹּ֑אן וָ/אֶקַּֽח לִ֞/י שְׁנֵ֣י מַקְל֗וֹת לְ/אַחַ֞ד קָרָ֤אתִי נֹ֨עַם֙ וּ/לְ/אַחַד֙ קָרָ֣אתִי חֹֽבְלִ֔ים וָ/אֶרְעֶ֖ה אֶת הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: ko
  text: 그래서 저는 죽임을 당할 양 떼[a], 곧 양 떼 중 고난받는 자들을 목자로 돌보았습니다. 저는 나를 위해 막대기 두 개[c]를 가져다가, 하나는 ‘호의’라 부르고 다른 하나는 ‘연합’이라 불렀습니다[b]. 그리고 저는 그 양 떼를 목자로 돌보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘죽임의 양 떼’입니다. 문맥상 죽임을 당하도록 정해진 양 떼라는 뜻으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 חֹבְלִים의 정확한 의미는 논의가 있습니다. ‘결속’ 또는 ‘묶음’ 계열의 뜻으로 이해되기도 하며, 여기서는 POB의 번역을 따라 ‘연합’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘막대기들’이라는 복수형입니다. 한국어에서는 수량을 밝혀 ‘막대기 두 개’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  english_pob_choice: the flock doomed to slaughter
  chosen_korean: 죽임을 당할 양 떼
  alternatives_korean:
  - 도살될 양 떼
  - 학살될 양 떼
  lexicon: צֹאן = 양 떼; הַהֲרֵגָה = 살해/죽임의 상태
  rationale: POB의 doomed to slaughter를 직접 반영하되, 양 떼에 대한 수동적 운명을 자연스러운 한국어로 옮겨 '죽임을 당할'로 처리했습니다.
- source_word: עֲנִיֵּי הַצֹּאן
  english_pob_choice: the afflicted of the flock
  chosen_korean: 양 떼 가운데 고난받는 자들
  alternatives_korean:
  - 양 떼의 가난한 자들
  - 양 떼의 가련한 자들
  lexicon: עֲנִיִּים = 고난받는/비천한 자들, 문맥상 flock 내부의 남은 자들
  rationale: 영어의 afflicted는 단순한 감정 상태보다 억눌림과 환난을 포함하므로, 문맥을 살려 '고난받는 자들'로 옮겼습니다.
- source_word: שְׁנֵי מַקְלוֹת ... נֹעַם ... חֹבְלִים
  english_pob_choice: two staffs; one I named Favor, and the other I named Union
  chosen_korean: 막대기 두 개 ... 하나는 ‘은혜’, 다른 하나는 ‘연합’
  alternatives_korean:
  - 지팡이 두 개 ... 하나는 ‘호의’, 다른 하나는 ‘결속’
  - 막대기 두 개 ... 하나는 ‘은총’, 다른 하나는 ‘연맹’
  lexicon: מַקֵּל = 막대기/지팡이; נֹעַם = 은혜, 호의, 기쁨; חֹבְלִים = 묶음/연합
  rationale: POB의 Favor와 Union을 본문 의미에 맞춰 각각 '은혜'와 '연합'으로 옮겨, 상징 이름의 기능을 한국어 독자가 바로 이해하게 했습니다.
theological_decisions:
- issue: ‘양 떼’와 ‘고난받는 자들’의 동격 관계
  chosen_reading: ‘죽임을 당할 양 떼, 곧 양 떼 가운데 고난받는 자들’로 동격을 드러냈습니다.
  alternative_readings:
  - ‘죽임을 당할 양 떼, 따라서 양 떼 가운데 고난받는 자들’
  - ‘죽임을 당할 양 떼, 즉 가련한 양 떼’
  rationale: English POB revised from 'therefore' to 'namely'를 반영해 인과가 아니라 설명적 동격임을 보존했습니다.
  doctrine_reference: 본문 구조(동격/설명)는 해석을 좌우하므로 문법-의미 관계를 보존하는 번역 원칙에 따릅니다.
