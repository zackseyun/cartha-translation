  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
  footnotes:
  - marker: a
    text: Or "Bands" or "Binders" for the name of the second staff; the Hebrew term evokes things bound together.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 유다와 이스라엘 사이의 형제 관계를 깨뜨리기 위해 「연합」이라는 내 두 번째 지팡이를 잘랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 문자적으로 ‘묶는 것들’ 또는 ‘묶는 자들’을 떠올리게 합니다. ‘연합’은 그 기능적 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶגְדַּע
  english_pob_choice: Then I cut in pieces
  chosen_korean: 잘라서
  alternatives_korean:
  - 끊어서
  - 부러뜨려서
  lexicon: HALOT
  rationale: 막대기를 상징적으로 파괴하는 동작으로서, 한국어에서는 과도하게 장면을 늘리지 않으면서도 절단의 물리적 이미지를 살리기 위해 「잘라서」를 택했습니다.
- source_word: מַקְלִי הַשֵּׁנִי
  english_pob_choice: my second staff
  chosen_korean: 두 번째 지팡이인
  alternatives_korean:
  - 다른 지팡이인
  - 둘째 지팡이인
  lexicon: HALOT
  rationale: 직역 가능한 순서표지로서 「두 번째」가 가장 자연스럽고, 소유격 「내」를 유지해 상징 행위의 주체성과 소유를 드러냈습니다.
- source_word: הַחֹבְלִים
  english_pob_choice: Union
  chosen_korean: 「연합」
  alternatives_korean:
  - 「밴드」
  - 「묶음」
  - 「결속」
  lexicon: HALOT
  rationale: 본문이 이 지팡이를 상징적 이름으로 제시하므로, 기능적 의미를 살린 「연합」을 본문에 두고, 가능한 문자적 대안들은 주석으로 남겨 어휘적 긴장을 보존했습니다.
- source_word: הָאַחֲוָה
  english_pob_choice: the brotherhood
  chosen_korean: 형제애
  alternatives_korean:
  - 형제 관계
  - 형제적 연합
  - 우애
  lexicon: HALOT
  rationale: אַחֲוָה는 형제 사이의 결속을 뜻하므로, 사회적 결속보다 혈연적·형제적 뉘앙스를 살리는 「형제애」로 옮겼습니다.
theological_decisions:
- issue: 유다와 이스라엘 사이의 관계 파괴를 어떻게 표현할지
  chosen_reading: 「형제애를 깨뜨렸습니다」
  alternative_readings:
  - 「형제 관계를 끊었습니다」
  - 「연합을 무너뜨렸습니다」
  rationale: 예언적 상징행위의 목적이 단순한 정치적 분열이 아니라 형제적 결속의 파괴임을 드러내기 위해, 원문의 관계적 언어를 직접 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 4, 5
