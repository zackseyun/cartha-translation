theological_decisions:
- issue: 나무 이미지의 은유를 본문에서 어떻게 처리할지
  chosen_reading: 나무와 숲의 이미지를 그대로 유지해, 직접적으로 통치자나 권력자로 풀어쓰지 않았습니다.
  alternative_readings:
  - 통치자들 또는 지도자들로 해석해 번역하기
  rationale: 본문은 창조물의 애가 형식을 직접 제시하므로, 은유의 긴장을 해소하지 않고 그대로 보존하는 편이 원문과 POB의 최적 대응에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
