  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
  footnotes:
  - marker: a
    text: Or 'fir' for 'cypress.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the mighty ones have been devastated.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression may also mean 'the inaccessible forest' or 'the fortified forest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 슬피 외치십시오, 잣나무여. 백향목이 쓰러졌기 때문입니다. 그 위엄 있는 것들이 무너졌기 때문입니다. 슬피 외치십시오, 바산의 상수리나무들아. 울창한 숲이 내려앉았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '전나무'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 위력 있는 것들이 무너졌기 때문입니다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '울타리친 숲' 또는 '성벽 같은 숲'의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 슬피 외치십시오
  alternatives_korean:
  - 울부짖으십시오
  - 곡하십시오
  lexicon: HALOT
  rationale: 예언적 애곡과 경보의 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 공개 낭독에 적합한 표현으로 옮겼습니다.
- source_word: בְּרוֹשׁ
  english_pob_choice: cypress
  chosen_korean: 잣나무
  alternatives_korean:
  - 사이프러스나무
  - 전나무
  lexicon: HALOT
  rationale: 영어 POB의 'cypress'를 직접 음역하기보다, 한국어에서 비교적 자연스럽고 침엽수 계열의 이미지에 맞는 '잣나무'를 택해 시적 평행을 살렸습니다.
- source_word: אַדִּרִים
  english_pob_choice: the majestic ones
  chosen_korean: 그 위엄 있는 것들
  alternatives_korean:
  - 그 장엄한 것들
  - 그 ძლ한 것들
  lexicon: HALOT
  rationale: 문맥상 사람보다 나무를 가리키는 시적 의인화/은유를 유지하면서, 위엄·장엄의 의미를 드러내는 중립적 표현으로 옮겼습니다.
- source_word: הֵילִילוּ אַלּוֹנֵי בָשָׁן
  english_pob_choice: Wail, oaks of Bashan
  chosen_korean: 슬피 외치십시오, 바산의 상수리나무들아
  alternatives_korean:
  - 슬피 외치십시오, 바산의 떡갈나무들아
  - 슬피 외치십시오, 바산의 참나무들아
  lexicon: HALOT
  rationale: 바산의 유명한 나무들을 가리키는 표현을 살려, 한국어에서 가장 익숙한 '상수리나무'로 옮겼습니다.
- source_word: יַעַר הַ/בצור
  english_pob_choice: the thick forest
  chosen_korean: 울창한 숲
  alternatives_korean:
  - 빽빽한 숲
  - 견고한 숲
  lexicon: HALOT
  rationale: 난해한 어구의 핵심 의미인 '빽빽함/울창함'을 자연스러운 한국어로 풀어, POB의 해석 여지를 유지했습니다.
theological_decisions:
- issue: 나무 이미지의 은유를 본문에서 어떻게 처리할지
  chosen_reading: 나무와 숲의 이미지를 그대로 유지해, 직접적으로 통치자나 권력자로 풀어쓰지 않았습니다.
  alternative_readings:
  - 통치자들 또는 지도자들로 해석해 번역하기
  rationale: 본문은 창조물의 애가 형식을 직접 제시하므로, 은유의 긴장을 해소하지 않고 그대로 보존하는 편이 원문과 POB의 최적 대응에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
