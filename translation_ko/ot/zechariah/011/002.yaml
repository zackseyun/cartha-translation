  source_fidelity: 수정이 필요합니다. שֻׁדָּדוּ는 단순히 ‘무너지다’보다 폭력적인 황폐·파괴의 수동적 결과를 나타내므로 ‘황폐해졌습니다’가 더 가깝습니다. יָרַד는 숲의 붕괴/쓰러짐 이미지로 자연스럽게 옮길 수 있으나, ‘내려앉았습니다’는 이 문맥에서 다소 부자연스럽습니다. בְּרוֹשׁ의 종 식별은 불확실하지만, 영어 POB의 선택과 현대 식물 명칭에 맞추어 ‘사이프러스나무’를 사용하고 대안을 각주로 보존하는 것이 안전합니다.
  naturalness: 합쇼체의 호격과 명령형은 유지하되, ‘슬피 부르짖으십시오’가 예언적 애가의 강도와 한국어 운율을 더 잘 살립니다. ‘빽빽한 숲이 쓰러졌습니다’는 ‘울창한 숲이 내려앉았습니다’보다 현대 한국어에서 자연스럽습니다.
