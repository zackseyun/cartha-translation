  source_fidelity: ‘깨뜨리려 했습니다’는 히브리어 목적 부정사 לְהָפֵיר를 실제로 언약을 무효화하려 했다는 목적이 아니라 ‘시도했다’는 뜻으로 바꾸므로 수정이 필요합니다. ‘깨뜨리기 위해’는 목적과 상징 행위를 충실히 보존합니다. 나머지 핵심 어휘와 ‘모든 민족’의 넓은 범위는 원문에 부합합니다.
