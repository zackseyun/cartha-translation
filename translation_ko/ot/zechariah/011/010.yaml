base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
  footnotes:
  - marker: a
    text: Or 'all the nations.' The Hebrew word can denote peoples or nations; the plural is retained here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 내 지팡이 ‘호의’를 집어 그것을 둘로 잘라, 내가 모든 민족과 맺었던 내 언약을 깨뜨리기 위해 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 나라들’. 히브리어는 ‘민족들/나라들’을 모두 가리킬 수 있으며, 여기서는 복수성을 살려 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  english_pob_choice: my staff
  chosen_korean: 내 지팡이
  alternatives_korean:
  - 내 막대기
  - 내 목자 지팡이
  lexicon: HALOT
  rationale: מַקֵּל은 문맥상 목자가 쥐는 지팡이/막대기를 뜻하므로, 자연스러운 표준어인 ‘지팡이’로 옮겼습니다.
- source_word: נֹעַם
  english_pob_choice: Favor
  chosen_korean: ‘호의’
  alternatives_korean:
  - ‘은총’
  - ‘즐거움’
  - ‘아름다움’
  lexicon: HALOT
  rationale: 여기서는 지팡이의 이름을 음역하기보다 상징적 의미를 살려 옮겨야 하므로, POB의 해석을 따라 ‘호의’로 처리했습니다.
- source_word: וָאֶגְדַּע אֹתוֹ
  english_pob_choice: cut it in two
  chosen_korean: 그것을 둘로 잘라
  alternatives_korean:
  - 그것을 잘라 부러뜨려
  - 그것을 끊어
  lexicon: HALOT
  rationale: גדע는 단순히 ‘끊다’보다 잘라서 분리하는 물리적 동작이 분명하므로, 행위를 직접 드러내는 ‘둘로 잘라’가 적절합니다.
- source_word: כָּל הָעַמִּים
  english_pob_choice: all the peoples
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 백성
  - 모든 나라들
  lexicon: HALOT
  rationale: 히브리어 복수형 עַמִּים의 폭을 살리되, 현대 한국어에서 가장 자연스럽게 집단성을 드러내는 표현으로 ‘민족’을 선택했습니다.
theological_decisions:
- issue: 언약을 ‘깨뜨리려 했습니다’의 처리
  chosen_reading: 문맥상 상징 행위의 목적을 드러내는 종결로 ‘깨뜨리려 했습니다’라고 옮겼습니다.
  alternative_readings:
  - 깨뜨리기 위해
  - 깨뜨리려고
  rationale: 히브리어 לְהָפֵיר는 ‘무효화하다/깨뜨리다’의 목적을 나타내며, 한국어에서는 자연스러운 결과 서술로 풀어야 의미가 분명해집니다.
  doctrine_reference: 언약 파기의 상징적 행위를 유지하되 해석을 과도하게 확정하지 않습니다.
