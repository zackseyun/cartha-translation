revisions:
- from: 그래서 제가 말했습니다. "나는 너희를 더 이상 돌보지 않겠습니다. 죽어 가는 자는 죽게 하십시오. 멸망해 가는 자는 멸망하게 하십시오. 그리고 남아 있는 자들은 각자 자기 동무의 살을 먹게 하십시오."[a][b]
  to: 그래서 제가 말했습니다[a]. “나는 너희를 목양하지 않겠습니다. 죽어 가는 자는 죽게 내버려 두고, 멸망하는 자는 멸망하게 내버려 두겠습니다[b]. 남아 있는 자들은 저마다 서로의 살을 먹게 될 것입니다.”
  rationale: 원문에 없는 ‘더 이상’을 제거하고, 목자 비유를 ‘목양하다’로 명시했습니다. 제3자 허용의 히브리어 표현은 청자 불명의 명령형 대신 화자의 방임적 선언으로 옮겼습니다. 마지막의 충격적인 육체적 상호 파괴 이미지는 완화하지 않았으며, 한국어에서 자연스러운 분배적 상호성으로 표현했습니다. 각주는 원문 및 영어 POB 감사기록의 기능에 맞게 전면 교정하고 본문 앵커를 해당 위치로 옮겼습니다.
