review_pass:
  verdict: revise
  source_fidelity: 현 번역은 רעה의 목자 비유를 ‘돌보다’로 다소 일반화하고, 원문에 없는 ‘더 이상’을 더했습니다. 또한 두 반복 명령은 의미상 대체로 맞지만, ‘-게 하십시오’는 인용문 안에서 청자가 불분명한 명령으로 들립니다. 마지막 구절의 분배적 상호 파괴 이미지는 보존되어 있습니다.
  naturalness: ‘각자 자기 동무의 살’은 현대 표준어에서 다소 어색하고 ‘동무’는 이 문맥에서 시대적·사회적 연상이 강합니다. ‘서로의 살’이 분배적 관용구의 상호성을 자연스럽게 전달합니다. ‘죽게 내버려 두겠습니다’와 병렬 구조는 현대 합쇼체의 예언적 선언으로 자연스럽습니다.
  terminology: ‘목양하다’는 רעה 및 이 장의 목자/양 떼 비유를 명시적으로 보존합니다. כחד는 ‘멸망하다’로 옮길 수 있습니다. 기존 각주 a는 원어 동사를 ‘치다’라고 잘못 설명하며, b는 절의 마지막 표현 대신 앞선 ‘멸망해 가는 자’를 설명하므로 앵커와 내용이 모두 부정확합니다.
