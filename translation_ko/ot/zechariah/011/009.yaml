source:
  edition: WLC
  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
  footnotes:
  - marker: a
    text: Or “the survivors”; Hebrew “the remaining ones.”
    reason: lexical_alternative
  - marker: b
    text: Literally “woman the flesh of her companion,” a distributive idiom here meaning “each one ... another,” with feminine grammar matching the flock imagery.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 제가 말했습니다[a]. “나는 너희를 목양하지 않겠습니다. 죽어 가는 자는 죽게 내버려 두고, 멸망하는 자는 멸망하게 내버려 두겠습니다[b]. 남아 있는 자들은 저마다 서로의 살을 먹게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 목자가 양 떼를 치고 돌보는 일을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “여자가 자기 동무의 살을”입니다. 여기서 여성형은 양 떼의 비유적 문법에 맞춘 것이며, ‘저마다 서로의’라는 뜻의 분배적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  english_pob_choice: I will not shepherd
  chosen_korean: 나는 너희를 더 이상 돌보지 않겠습니다
  alternatives_korean:
  - 나는 너희를 더 이상 목양하지 않겠습니다
  - 나는 너희를 더 이상 치지 않겠습니다
  lexicon: HALOT
  rationale: 동사 רעה의 목자 이미지를 살리되, 한국어에서는 ‘돌보다’가 군림하는 목자적 돌봄의 거절을 자연스럽게 전하며 문맥의 심판 선언과도 잘 맞습니다.
- source_word: הַמֵּתָה תָמוּת
  english_pob_choice: Let the dying die
  chosen_korean: 죽어 가는 자는 죽게 하십시오
  alternatives_korean:
  - 죽어 가는 것은 죽게 하십시오
  - 죽는 자는 죽게 하십시오
  lexicon: HALOT
  rationale: 분사+동사의 강조를 한국어에서도 ‘죽어 가는 자’와 ‘죽게 하십시오’로 살려, 임박한 죽음과 방임적 선언의 뉘앙스를 유지했습니다.
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  english_pob_choice: let the perishing perish
  chosen_korean: 멸망해 가는 자는 멸망하게 하십시오
  alternatives_korean:
  - 끊어져 가는 자는 끊어지게 하십시오
  - 사라져 가는 자는 사라지게 하십시오
  lexicon: HALOT
  rationale: כחד의 소멸·도말 의미를 한국어에서 ‘멸망하다’로 옮겨, 이미 파멸로 치닫는 대상을 반복형으로 강조하는 원문의 수사를 반영했습니다.
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  english_pob_choice: each devour the flesh of the other
  chosen_korean: 각자 자기 동무의 살을 먹게 하십시오
  alternatives_korean:
  - 각자 서로의 살을 먹게 하십시오
  - 각자 자기 동무의 살을 삼키게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 분배적 관용구를 한국어에서도 ‘각자’로 풀고, רֵעַ 계열의 ‘동무’를 택해 상호 파괴의 관계를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 식인 이미지를 얼마나 직설적으로 보존할지
  chosen_reading: 각자 자기 동무의 살을 먹게 하십시오
  alternative_readings:
  - 각자 서로의 살을 먹게 하십시오
  - 각자 자기 동무의 살을 삼키게 하십시오
  rationale: 예언적 심판의 충격을 약화하지 않기 위해 육체적 폭력을 완곡하게 돌리지 않고, 원문의 잔혹한 상호 파괴 이미지를 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 시적/예언적 명령문의 공손한 한국어 등록
  chosen_reading: -게 하십시오
  alternative_readings:
  - -게 하소서
  - -게 합니다
  rationale: 직접 인용 안의 선언적 명령을 현대 합쇼체로 옮기되, 하나님/예언자 화자의 권위를 해치지 않는 명령형 종결을 사용했습니다.
  doctrine_reference: Korean style guide
