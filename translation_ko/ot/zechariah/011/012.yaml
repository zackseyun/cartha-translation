translation:
  language: ko
  text: 그러자 내가 그들에게 말했습니다. 「만일 여러분 보기에 좋다면, 내 삯을 주십시오. 그러나 그렇지 않다면 그만두십시오.」 그들이 내 삯으로 은 서른 개를 달아 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘서른 은’이며, 더 구체적으로는 ‘은 서른 세겔’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  english_pob_choice: If it is good in your eyes
  chosen_korean: 만일 그것이 여러분 눈에 좋다면
  alternatives_korean:
  - 만일 여러분 보기에 좋다면
  - 만일 여러분이 좋게 여기신다면
  lexicon: HALOT
  rationale: 히브리어 관용구인 '눈에 좋다'를 살리면서도 한국어에서 자연스럽게 읽히도록 옮겼습니다. '여러분'은 복수 청자를 분명히 합니다.
- source_word: שְׂכָרִי
  english_pob_choice: my wages
  chosen_korean: 내 삯
  alternatives_korean:
  - 내 임금
  - 내 품삯
  lexicon: HALOT
  rationale: 보상으로서의 대가를 뜻하는 어감을 살려 '삯'을 택했습니다. 예언자적 문맥에서 고용 노동의 뉘앙스를 지나치게 현대화하지 않으면서도 자연스럽습니다.
- source_word: וַיִּשְׁקְלוּ אֶת שְׂכָרִי שְׁלֹשִׁים כָּסֶף
  english_pob_choice: 'they weighed out my wages: thirty pieces of silver'
  chosen_korean: 그들이 내 삯으로 은 서른 개를 달아 주었습니다
  alternatives_korean:
  - 그들이 내 삯으로 은 서른 조각을 달아 주었습니다
  - 그들이 내 삯을 은 서른 개로 달았습니다
  lexicon: HALOT
  rationale: 동사 '달다/달아 주다'는 כסף를 실제로 저울에 달아 지급하는 장면을 보존합니다. 히브리어의 단순한 '은 서른'을 본문에서는 그대로 반영하고, 더 구체적인 단위 해석은 본문 밖으로 미뤘습니다.
theological_decisions:
- issue: 은의 수량 표현과 단위의 명시성
  chosen_reading: 본문에는 '은 서른 개'로 두고, '세겔'은 본문에 넣지 않았습니다.
  alternative_readings:
  - 은 서른 세겔
  - 은 서른 조각
  rationale: 히브리어는 단위를 명시하지 않고 '은 서른'이라고만 말합니다. 따라서 본문은 POB의 절제된 읽기를 따라 더 구체적인 화폐 단위를 단정하지 않습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
