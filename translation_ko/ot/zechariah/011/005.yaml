  - 죽이고
  lexicon: HALOT
  rationale: 양 떼의 비유 속 잔혹성을 반영하되, 한국어에서 자연스럽고 과도하게 해석을 넓히지 않는 표현을 택했습니다.
- source_word: וְלֹא יֶאְשָׁמוּ
  english_pob_choice: and are not held guilty
  chosen_korean: 죄를 지었다고 여기지 않으며
  alternatives_korean:
  - 책임을 지지 않으며
  - 유죄 판결을 받지 않으며
  lexicon: HALOT
  rationale: אשם의 핵심은 '죄책/책임이 귀속되지 않음'이므로, 실제로는 아무런 책임을 묻지 않는다는 의미를 드러내면서도 법적·도덕적 무책임을 함께 살렸습니다.
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼는 찬송받으셔야 합니다
  alternatives_korean:
  - 야훼를 찬송합니다
  - 야훼께 복이 있기를
  lexicon: HALOT
  rationale: יַהְוֶה의 고유한 이름은 프로젝트 기본값에 따라 '야훼'로 옮기고, 축복/송영 공식은 한국어의 자연스러운 경어형으로 표현했습니다.
- source_word: וְרֹעֵיהֶם
  english_pob_choice: their shepherds
  chosen_korean: 그들의 목자들
  alternatives_korean:
  - 그들의 양치기들
  - 그들의 인도자들
  lexicon: HALOT
  rationale: 목자 이미지를 보존하여 예언서의 상징적 지도자 비판을 유지했습니다.
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  english_pob_choice: have no compassion on them
  chosen_korean: 그들을 불쌍히 여기지 않습니다
  alternatives_korean:
  - 그들을 아끼지 않습니다
  - 그들을 긍휼히 여기지 않습니다
  lexicon: HALOT
  rationale: חמל의 정서적·관계적 의미를 살리기 위해 '불쌍히 여기다'를 택했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 고유한 언약 이름을 '야훼'로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 문맥은 하나님의 이름을 직접 인용하는 서술이므로, 통상적 칭호보다 고유명 보존이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: 목자(רֹעִים) 이미지 보존
  chosen_reading: '''목자들''을 유지해 지도자 비판의 비유를 그대로 살렸습니다.'
  alternative_readings:
  - 지도자들
  - 목회자들
  rationale: 예언적 상징을 행정적·교회적 용어로 바꾸면 본문의 공격성을 약화시키므로, 비유를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
