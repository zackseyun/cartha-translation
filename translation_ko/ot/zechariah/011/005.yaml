translation:
  language: ko
  text: 그들의 구매자들은 그들을 도살하고도[a] 죄책을 지지 않으며, 그들의 판매자들은 “야훼를 찬송합니다. 내가 부자가 되었기 때문입니다”라고 말하고, 그들의 목자들은 그들을 불쌍히 여기지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유죄로 간주되지 않으며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 아끼지 않습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֵיהֶן
  english_pob_choice: buyers
  chosen_korean: 구매자들
  alternatives_korean:
  - 사는 사람들
  - 매입자들
  lexicon: HALOT
  rationale: 매매의 폭력성을 드러내는 상업적 문맥을 살려 '구매자들'로 옮겼습니다.
- source_word: יַהֲרְגֻן
