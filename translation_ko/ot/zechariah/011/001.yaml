  chosen_korean: 레바논
  alternatives_korean:
  - 레바논아
  - 레바논
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 호격 표지를 드러내기 위해 본문에서 직접 호명되는 형태로 옮겼습니다.
- source_word: דְּלָתֶיךָ
  english_pob_choice: your doors
  chosen_korean: 네 문들
  alternatives_korean:
  - 네 대문들
  - 네 성문들
  lexicon: HALOT
  rationale: דלת는 기본적으로 ‘문’이므로, 영어 POB의 ‘doors’를 따라 가장 직접적인 표현인 ‘문들’을 택했습니다. ‘성문들’은 의미를 좁히는 해석이어서 피했습니다.
- source_word: אֵשׁ ... אֲרָזֶיךָ
  english_pob_choice: fire ... your cedars
  chosen_korean: 불이 네 백향목들을 사를 것이다
  alternatives_korean:
  - 불이 네 백향목들을 삼킬 것이다
  - 불이 네 백향목들을 태울 것이다
  lexicon: HALOT
  rationale: אכל의 파괴적 용법을 ‘사르다’로 옮겨 불이 삼키는 심판의 이미지를 살렸습니다. ‘백향목들’은 אָרֶז의 표준적 성경 번역입니다.
theological_decisions:
- issue: 레바논의 인격화된 심판 이미지
  chosen_reading: 레바논을 실제 인물처럼 직접 부르는 예언적 인격화로 유지했습니다.
  alternative_readings:
  - 레바논의 산길이나 숲의 출입구를 가리키는 문자적 표현
  - 레바논과 관련된 정치 권력을 상징하는 표현
  rationale: 본문은 시적·예언적 언어로 레바논을 직접 호명하며 파괴적 심판을 그립니다. 번역에서 그 상징 범위를 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 예언 시의 인격화와 상징성을 해소하지 않고 보존합니다.
