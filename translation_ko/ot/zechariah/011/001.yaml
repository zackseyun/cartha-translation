lexical_decisions:
- source_word: פְּתַח
  english_pob_choice: Open
  chosen_korean: 열라
  alternatives_korean:
  - 여십시오
  - 활짝 열라
  lexicon: HALOT
  rationale: 문을 향한 직접 명령형을 살리기 위해 간결한 명령형 ‘열라’를 택했습니다. 예언적 시의 어조를 유지하면서도 과도하게 풀지 않았습니다.
- source_word: לְבָנוֹן
