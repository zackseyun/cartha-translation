translation:
  language: ko
  text: 「야훼 나의 하나님께서 이렇게 말씀하십니다. 도살될 양 떼를 치십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도살될 양 떼’로, 곧 도살될 운명에 놓인 양 떼라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하신다
  - 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 공적 선포문형을 한국어 합쇼체로 자연스럽게 옮기되, 선언적·공식적 뉘앙스를 유지하기 위해 ‘이렇게 말씀하십니다’를 선택했습니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼 나의 하나님
  alternatives_korean:
  - 야훼 내 하나님
  - 야훼 나의 하나님께서
  lexicon: HALOT
  rationale: 여호와 대신 신명기적 고유명인 ‘야훼’를 유지하고, 1인칭 소유격 ‘나의’도 그대로 살려 화자의 관계성을 보존했습니다.
- source_word: רְעֵה
  english_pob_choice: Shepherd
  chosen_korean: 치십시오
  alternatives_korean:
  - 목양하십시오
  - 목자처럼 돌보십시오
  - 기르십시오
  lexicon: HALOT
  rationale: 동사 רעה는 본문에서 목양 행위이지만, 뒤이어 ‘양 떼’를 직접 목적어로 취하는 명령이므로 한국어에서는 가장 직접적인 동사인 ‘치다’가 본문의 명령성을 자연스럽게 드러냅니다.
- source_word: צֹאן הַהֲרֵגָה
  english_pob_choice: the flock for slaughter
  chosen_korean: 도살될 양 떼
  alternatives_korean:
  - 도살용 양 떼
  - 도살당할 양 떼
  - 학살될 양 떼
  lexicon: HALOT
  rationale: 직역적인 ‘도살’ 의미를 유지하면서, 단순한 소유격 구문보다 미래적·운명적 의미가 분명하도록 수동·미래성 있는 ‘도살될’로 옮겼습니다.
theological_decisions:
- issue: 예언 명령의 수신자와 화자 표지
  chosen_reading: 문장부호로 하나님의 직접 화법을 표시하고, 화자를 ‘야훼 나의 하나님’으로 보존했습니다.
  alternative_readings:
  - ‘주님’으로 일반화
  - 간접화법으로 완화
  rationale: 본문은 예언적 직접 인용으로 시작하므로, 화자와 발화 권위를 흐리지 않도록 직접 화법을 유지하는 것이 본문의 힘을 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §5
