source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵ֖לֶּה שְׁנֵ֣י בְנֵֽי הַ/יִּצְהָ֑ר הָ/עֹמְדִ֖ים עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
  footnotes:
  - marker: a
    text: Or “the two anointed ones.” Literally, “the two sons of fresh oil.”
    reason: lexical_alternative
  - marker: b
    text: Or “who stand before the Lord of all the earth.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다[a], “이들은 기름의 두 아들입니다[b], 온 땅의 주님의 곁에 서 있는 이들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 말했다”
    reason: alternative_reading
  - marker: b
    text: 또는 “기름부음 받은 두 이들”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 이르렀습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 이어 주는 단순한 서술형으로 옮겼습니다.
- source_word: בְּנֵי הַיִּצְהָר
  english_pob_choice: sons of oil / sons of fresh oil
  chosen_korean: 기름의 두 아들
  alternatives_korean:
  - 기름의 아들 둘
  - 기름의 두 자녀
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘기름의’라는 비유를 살리고, 수사는 한국어에서 가장 자연스러운 ‘두 아들’로 옮겼습니다.
- source_word: הָעֹמְדִים עַל
  english_pob_choice: who stand by / who stand before
  chosen_korean: 곁에 서 있는
  alternatives_korean:
  - 앞에 서 있는
  - 서 있는
  lexicon: HALOT
  rationale: עַל과 ‘서다’의 결합이 여기서는 존귀한 분 앞에서의 대기/시종 관계를 나타내므로, 현대 한국어에서는 ‘곁에 서 있는’이 가장 자연스럽게 그 관계를 드러냅니다.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  english_pob_choice: the Lord of all the earth
  chosen_korean: 온 땅의 주님
  alternatives_korean:
  - 온 땅의 주
  - 온 땅의 주인
  lexicon: HALOT
  rationale: 주권적 칭호를 살리되, 한국어 문맥에서 ‘주님’이 가장 자연스러운 호칭입니다.
theological_decisions:
- issue: בְּנֵי הַיִּצְהָר의 은유를 해석적으로 풀어 쓸지 여부
  chosen_reading: 주석 없이 본문에서는 은유를 유지해 ‘기름의 두 아들’로 옮겼습니다.
  alternative_readings:
  - 두 기름부음 받은 이들
  - 두 기름부음 받은 자
  rationale: 본문이 직접 쓰는 이미지를 보존해, 해석을 본문 속에 미리 확정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: עַל with הָעֹמְדִים의 관계를 어떻게 표현할지
  chosen_reading: ‘곁에 서 있는’으로 옮겨, 왕 앞에서의 시종/대기 관계를 드러냈습니다.
  alternative_readings:
  - 앞에서 서 있는
  - 주 앞에 서 있는
  rationale: 문맥상 단순한 위치보다 출석과 대기의 뉘앙스가 중요하므로, 한국어에서는 관계를 자연스럽게 전달하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§3, 6
