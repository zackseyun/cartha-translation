  - severity: low
    issue: ‘주님’보다 ‘주’가 원문의 칭호를 더 직접적으로 반영합니다.
    rationale: אֲדוֹן은 ‘주/주인’이라는 주권적 칭호입니다. ‘온 땅의 주’는 불필요한 호칭적 뉘앙스를 더하지 않고도 존엄한 의미를 유지합니다.
