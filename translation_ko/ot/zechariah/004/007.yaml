  text: מִֽי אַתָּ֧ה הַֽר הַ/גָּד֛וֹל לִ/פְנֵ֥י זְרֻבָּבֶ֖ל לְ/מִישֹׁ֑ר וְ/הוֹצִיא֙ אֶת הָ/אֶ֣בֶן הָ/רֹאשָׁ֔ה תְּשֻׁא֕וֹת חֵ֥ן חֵ֖ן לָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
  footnotes:
  - marker: a
    text: Or 'the capstone'; literally 'the head stone.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Favor, favor to it!' The Hebrew חֵן can mean 'grace,' 'favor,' or 'charm/beauty' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 산아, 네가 무엇입니까? 스룹바벨 앞에서 평지가 될 것입니다. 그가 환호 가운데 머릿돌을 내놓을 것이며, 사람들이 “은혜, 은혜가 그 돌에 있기를!” 하고 외칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꼭대기 돌’ 또는 ‘맨 위 돌’입니다. 문자적으로는 ‘머리 돌’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘호의, 호의가 그 돌에 있기를!’입니다. 히브리어 חֵן은 문맥에 따라 ‘은혜’, ‘호의’, ‘아름다움/매력’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר הַגָּדוֹל
  english_pob_choice: O great mountain
  chosen_korean: 큰 산아
  alternatives_korean:
  - 큰 산
  - 오, 큰 산아
  lexicon: HALOT
  rationale: 원문의 수사적 직접 호칭을 살리기 위해 호격을 사용했고, 히브리어의 단순 명명보다 대립 구조를 드러내는 표현으로 옮겼습니다.
- source_word: לְמִישֹׁר
  english_pob_choice: you will become a plain
  chosen_korean: 평지가 될 것이다
  alternatives_korean:
  - 평원이 될 것이다
  - 고른 땅이 될 것이다
  lexicon: HALOT
  rationale: מִישׁוֹר의 핵심 의미인 ‘평평한 땅/평지’를 자연스러운 현대 한국어로 옮겨, 장애물이 사라지는 변화를 분명히 했습니다.
- source_word: הָאֶבֶן הָרֹאשָׁה
  english_pob_choice: the top stone
  chosen_korean: 머릿돌
  alternatives_korean:
  - 맨 위 돌
  - 꼭대기 돌
  - 꼭돌
  lexicon: HALOT
  rationale: 직역 가능한 ‘머리 돌/머릿돌’은 건축 이미지와 상징성을 함께 보존하며, 한국어 성경 문맥에서도 이해 가능한 표현입니다.
- source_word: חֵן חֵן לָהּ
  english_pob_choice: ‘Grace, grace to it!’
  chosen_korean: 「은혜, 은혜가 그에게 있기를!」
  alternatives_korean:
  - 「호의, 호의가 그에게 있기를!」
  - 「은총, 은총이 그에게 있기를!」
  lexicon: HALOT
  rationale: חֵן의 기본 의미 범위 가운데 이 문맥에서 가장 신학적 울림이 큰 ‘은혜’를 택했고, 반복 구조와 대상 지시를 살렸습니다.
theological_decisions:
- issue: עֲלֵיהּ/לָהּ의 지시 대상과 한국어 대명사 처리
  chosen_reading: ‘그에게’로 옮겨 머릿돌을 가리키는 지시를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘그것에게’
  - ‘그 위에’
  rationale: 원문의 여성형 대명사는 문맥상 돌/기념비를 가리키므로, 한국어에서는 부자연스러운 성/물격 대비를 피하고 지시 대상을 우선해 번역했습니다.
  doctrine_reference: Translation philosophy §3, §6
