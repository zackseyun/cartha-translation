  source_fidelity: 핵심 구조는 대체로 반영했지만, 원문의 וְהוֹצִיא와 תְּשֻׁאוֹת의 결합은 ‘끌어내며 … 외침이 있을 것이다’보다 스룹바벨이 환호 가운데 머릿돌을 내놓는다는 방식으로 옮기는 편이 정확합니다. לָהּ은 여성형인 돌을 가리키므로 ‘그에게’는 한국어에서 사람을 가리키는 것으로 오해될 수 있습니다.
  naturalness: 초안의 ‘너’, ‘네가’, ‘될 것이다’는 요청된 현대 합쇼체와 맞지 않습니다. 또한 ‘그 머릿돌을 끌어내며’는 건축의 마지막 돌을 제시하는 장면에 다소 부자연스럽습니다.
  terminology: ‘스룹바벨’, ‘머릿돌’, ‘은혜’는 유지할 수 있습니다. 다만 ‘머릿돌’은 선택된 본문 용어이므로 각주에서는 실제 대안인 ‘꼭대기 돌/맨 위 돌’ 및 문자적 표현을 제시해야 합니다.
