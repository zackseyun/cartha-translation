revisions:
- from: 너 큰 산아, 네가 누구냐? 스룹바벨 앞에서 네가 평지가 될 것이다. 그리고 그는 그 머릿돌을 끌어내며 「은혜, 은혜가 그에게 있기를!」 하는 외침이 있을 것이다.[a][b]
  to: 큰 산아, 네가 무엇입니까? 스룹바벨 앞에서 평지가 될 것입니다. 그가 환호 가운데 머릿돌을 내놓을 것이며, 사람들이 “은혜, 은혜가 그 돌에 있기를!” 하고 외칠 것입니다.[a][b]
  rationale: 현대 합쇼체로 통일하고, 큰 산에 대한 수사적 호칭과 평지가 되는 변화를 유지했습니다. 스룹바벨이 환호 가운데 머릿돌을 내놓는 원문의 구문을 자연스럽게 반영했으며, לָהּ의 대상이 돌임을 명시하여 사람 지시의 오해를 피했습니다. חֵן의 의미 범위는 본문에서 ‘은혜’로 유지하고 각주에 대안을 보존했습니다.
