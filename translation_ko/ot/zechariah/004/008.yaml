lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 있었습니다
  - 그리고 ... 일어났습니다
  - 그때 ... 이르렀습니다
  lexicon: WLC; HALOT
  rationale: 예언 서두의 전개 표지로서 וַיְהִי의 서사적 전환을 자연스러운 현대 한국어로 살리되, ‘말씀이 … 임하다’라는 예언 공식도 유지했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: WLC; HALOT
  rationale: דְבַר יְהוָה는 특정한 신적 계시를 가리키는 예언 공식이므로 ‘말씀’이 가장 직접적이며, POB의 YHWH=Yahweh 원칙을 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 쪽으로
  lexicon: WLC; HALOT
  rationale: 1인칭 여격을 현대 한국어의 자연스러운 문어체 ‘내게’로 옮겨, 문장 흐름을 간결하게 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: WLC; HALOT
  rationale: 직접 인용을 여는 표지이므로 한국어에서는 반복을 피하면서 동사 종결로 자연스럽게 연결했습니다. 본문에는 쉼표로 뒤따르는 발화가 이어짐을 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: וַיְהִי דְבַר יְהוָה → ‘야훼의 말씀’
  alternative_readings:
  - ‘주님의 말씀’
  - ‘여호와의 말씀’
  rationale: POB의 원칙대로 사전적 대체어를 쓰지 않고 신적 고유명사를 직접 드러내어, 본문이 말하는 계시의 주체를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
