  text: וַ֠/יַּעַן הַ/מַּלְאָ֞ךְ הַ/דֹּבֵ֥ר בִּ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י הֲ/ל֥וֹא יָדַ֖עְתָּ מָה הֵ֣מָּה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
  footnotes:
  - marker: a
    text: Or “who talked with me.” The Hebrew idiom describes the angel engaged in ongoing conversation with Zechariah.
    reason: lexical_alternative
  - marker: b
    text: Or “sir.” Hebrew “my lord,” a respectful form of address to the angel, not a reference to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 말하던 천사가 대답하여 그에게 말했습니다. “이것들이 무엇인지 네가 알지 못하느냐?” 내가 대답했습니다. “아닙니다, 내 주여.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사구는 제와 지속적으로 대화하던 천사를 가리키는 관용 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘내 주’는 여기서 천사에게 드리는 존칭이며, 야훼를 가리키지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하고
  lexicon: HALOT
  rationale: 대화 장면에서 וַיַּעַן의 표준적 의미는 ‘대답하다/응답하다’이므로, 한국어에서는 동작의 흐름을 자연스럽게 잇는 ‘대답하여’를 선택했습니다.
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 그와 말하던 천사
  alternatives_korean:
  - 나와 말하던 천사
  - 내게 말하던 천사
  lexicon: HALOT
  rationale: 히브리어 분사는 진행 중인 대화를 나타내므로 ‘말하던’으로 옮겨, 해석 천사가 제와 계속 대화하는 장면의 지속성을 살렸습니다.
- source_word: הֲלוֹא יָדַעְתָּ מָה הֵמָּה אֵלֶּה
  english_pob_choice: Do you not know what these are?
  chosen_korean: 이것들이 무엇인지 네가 알지 못하느냐?
  alternatives_korean:
  - 이것들이 무엇인지 네가 모르느냐?
  - 이것들이 무엇인지 너는 알지 못하느냐?
  lexicon: HALOT
  rationale: 반문 형식의 הֲלוֹא와 יָדַעְתָּ를 그대로 살려, 내용의 식별 여부를 묻는 질문으로 직역에 가깝게 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주여
  alternatives_korean:
  - 주여
  - 내 주님
  lexicon: HALOT
  rationale: 여기서 אֲדֹנִי는 야훼 칭호가 아니라 천사에게 드리는 존칭이므로, 공경의 뉘앙스를 살리되 대상의 신성을 암시하지 않는 ‘내 주여’를 택했습니다.
theological_decisions:
- issue: 천사에 대한 존칭 אֲדֹנִי의 처리
  chosen_reading: 천사에게 드리는 공손한 호칭으로서 ‘내 주여’
  alternative_readings:
  - ‘주님’
  - ‘선생님/님’
  rationale: 본문은 예언자와 해석하는 천사 사이의 대화이며, אֲדֹנִי는 신적 호칭이 아니라 예우적 호칭입니다. 한국어에서는 고어적 과장 없이 존칭을 유지하면서도 하나님 칭호와 혼동되지 않도록 ‘내 주여’로 처리했습니다.
  doctrine_reference: original-language primacy; titles should preserve referent without importing deity
