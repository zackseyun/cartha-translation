revisions:
- from: 그와 말하던 천사가 대답하여 그에게 말했습니다. “이것들이 무엇인지 네가 알지 못하느냐?” 내가 대답했습니다. “아닙니다, 내 주여.”[a][b]
  to: 나와 말하던[a] 천사가 대답하여 내게 말했습니다. “이것들이 무엇인지 알지 못합니까?” 그러자 제가 대답했습니다. “아닙니다, 나리.”[b]
  rationale: 대화 상대와 발화 수신자를 각각 ‘나와’와 ‘내게’로 바로잡아 원문의 인칭 관계를 회복했습니다. 반문형 질문과 간결한 부정 응답은 보존했습니다. 천사에게 드리는 אֲדֹנִי는 신성을 뜻하지 않는 존칭이므로, 현대 한국어에서 불필요한 신적 연상을 줄이는 ‘나리’로 옮기고 각주로 원어의 ‘내 주’ 및 대상을 밝혔습니다.
