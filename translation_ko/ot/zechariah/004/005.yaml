  source_fidelity: 수정이 필요합니다. 히브리어 בִּי는 문맥상 스가랴와 대화하던 천사를 뜻하므로 ‘그와’가 아니라 ‘나와’로 옮겨야 합니다. 또한 וַיֹּאמֶר אֵלַי의 ‘내게’가 초안에서 ‘그에게’로 잘못 처리되었습니다. 짧은 부정 응답은 유지하되, אֲדֹנִי의 천사 대상 존칭은 현대 한국어에서 신적 칭호로 혼동될 수 있는 ‘내 주여’보다 ‘나리’로 옮기고 주석으로 의미를 밝혔습니다.
  naturalness: ‘나와 말하던 천사’, ‘내게 말했습니다’, ‘알지 못합니까?’는 표준어 현대 합쇼체로 자연스럽습니다. ‘나리’는 직접 호칭으로 다소 문어적이지만, 고대의 공손한 존칭을 간결하게 재현하며 ‘주님’보다 적절합니다.
  terminology: מַלְאָךְ는 환상 속 해석 천사라는 문맥에 따라 ‘천사’로 유지했습니다. אֲדֹנִי는 야훼의 이름이나 신적 칭호가 아니라 천사에게 하는 공손한 호칭이므로 ‘나리’로 번역하고 이를 각주에서 명확히 했습니다.
