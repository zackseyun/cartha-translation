  - 받침 그릇
  lexicon: HALOT
  rationale: 환상 속 기구의 형태를 한국어로 직관적으로 드러내면서도, 단순한 장식물이 아닌 용기라는 점을 살리기 위해 ‘대야’로 옮겼습니다.
