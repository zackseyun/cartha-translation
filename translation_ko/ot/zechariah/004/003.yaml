source:
  edition: WLC
  text: וּ/שְׁנַ֥יִם זֵיתִ֖ים עָלֶ֑י/הָ אֶחָד֙ מִ/ימִ֣ין הַ/גֻּלָּ֔ה וְ/אֶחָ֖ד עַל שְׂמֹאלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/003.yaml
  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
  footnotes:
  - marker: a
    text: Or 'upon it' / 'over it'; the Hebrew preposition can be broader than strict adjacency, but the following right/left descriptions favor the sense 'beside it.'
    reason: lexical_alternative
  - marker: b
    text: That is, the bowl-like oil container in the lampstand vision.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 옆에 두 감람나무가 있었는데, 하나는 대야의 오른쪽에, 다른 하나는 그 왼쪽에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 על은 여기서 엄밀히 ‘위에’만 뜻하지 않을 수 있으나, 바로 뒤의 오른쪽/왼쪽 배치가 인접한 위치를 더 잘 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘대야’는 등잔 환상 안에 있는 기름을 담는 그릇을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם
  english_pob_choice: And two
  chosen_korean: 그리고 … 두
  alternatives_korean:
  - 또 두
  - 그리하여 두
  lexicon: HALOT
  rationale: 계속되는 환상 묘사의 흐름을 살려 합쇼체 서술로 자연스럽게 연결했습니다.
- source_word: זֵיתִים
  english_pob_choice: olive trees
  chosen_korean: 감람나무
  alternatives_korean:
