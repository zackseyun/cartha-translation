  text: וּ/שְׁנַ֥יִם זֵיתִ֖ים עָלֶ֑י/הָ אֶחָד֙ מִ/ימִ֣ין הַ/גֻּלָּ֔ה וְ/אֶחָ֖ד עַל שְׂמֹאלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/003.yaml
  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
  footnotes:
  - marker: a
    text: Or 'upon it' / 'over it'; the Hebrew preposition can be broader than strict adjacency, but the following right/left descriptions favor the sense 'beside it.'
    reason: lexical_alternative
  - marker: b
    text: That is, the bowl-like oil container in the lampstand vision.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 곁에[a] 두 감람나무가 있었는데, 하나는 그 그릇[b]의 오른쪽에, 다른 하나는 그 왼쪽에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 על은 여기서 엄밀히 ‘위에’만 뜻하지 않을 수 있습니다. 그러나 바로 뒤의 오른쪽과 왼쪽이라는 배치 표현은 인접한 위치라는 뜻을 더 잘 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그릇’은 등잔대 환상 안에 있는 기름을 담는 그릇을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם
  english_pob_choice: And two
  chosen_korean: 그리고 … 두
  alternatives_korean:
  - 또 두
  - 그리하여 두
  lexicon: HALOT
  rationale: 계속되는 환상 묘사의 흐름을 살려 합쇼체 서술로 자연스럽게 연결했습니다.
- source_word: זֵיתִים
  english_pob_choice: olive trees
  chosen_korean: 감람나무
  alternatives_korean:
  - 올리브나무
  - 올리브나무들
  lexicon: HALOT
  rationale: 문맥상 열매가 아니라 나무 자체를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘감람나무’가 가장 직접적입니다.
- source_word: עָלֶיהָ
  english_pob_choice: beside it
  chosen_korean: 그 옆에
  alternatives_korean:
  - 그 위에
  - 그 곁에
  - 그 위쪽에
  lexicon: HALOT
  rationale: 히브리어 על의 공간 범위가 넓지만, 이어지는 오른쪽/왼쪽 배치가 인접성을 분명히 하므로 ‘옆에’가 가장 적절합니다.
- source_word: הַגֻּלָּה
  english_pob_choice: the bowl
  chosen_korean: 대야
  alternatives_korean:
  - 그릇
  - 바구니
  - 받침 그릇
  lexicon: HALOT
  rationale: 환상 속 기구의 형태를 한국어로 직관적으로 드러내면서도, 단순한 장식물이 아닌 용기라는 점을 살리기 위해 ‘대야’로 옮겼습니다.
