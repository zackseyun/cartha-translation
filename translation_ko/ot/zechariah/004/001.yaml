base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/001.yaml
  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
  footnotes:
  - marker: a
    text: Or, 'who wakes from his sleep.' The Hebrew verb can be understood in a passive/reflexive sense ('is awakened') or expressed more intransitively in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나와 말하던 천사가 돌아와서 나를 깨웠습니다[a]. 마치 사람이 잠에서 깨어나는 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마치 사람이 잠에서 깨어나듯이’로 옮길 수 있습니다. 히브리어 동사는 ‘잠에서 깨어나다’라는 자동사적 뜻으로도, ‘잠에서 깨우침을 받다’라는 수동적·반사적 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב הַמַּלְאָךְ
  english_pob_choice: Then the angel ... returned
  chosen_korean: 그때 나와 말하던 천사가 돌아와서
  alternatives_korean:
  - 그때 천사가 되돌아와
  - 그때 그 천사가 다시 와서
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다/되돌아오다’를 자연스럽게 살리되, 비전 장면의 흐름을 따라 ‘돌아와서’로 옮겼습니다.
- source_word: הַדֹּבֵר בִּי
  english_pob_choice: who was speaking with me
  chosen_korean: 나와 말하던
  alternatives_korean:
  - 나와 말하고 있던
  - 나에게 말하던
  lexicon: HALOT
  rationale: 분사구조와 전치사 בְּ의 관계를 살려, 지속적으로 ‘말하고 있던’ 상태를 나타내는 한국어로 옮겼습니다.
- source_word: וַיְעִירֵנִי
  english_pob_choice: woke me
  chosen_korean: 나를 깨웠습니다
  alternatives_korean:
  - 나를 깨워 주었습니다
  - 나를 일깨웠습니다
  lexicon: HALOT
  rationale: עור의 사역형을 간단하고 자연스러운 현대 한국어로 옮겼으며, 이어지는 비유가 그 행위의 성격을 충분히 드러냅니다.
- source_word: כְּאִישׁ אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  english_pob_choice: like a man who is awakened from his sleep
  chosen_korean: 마치 잠에서 깨어나는 사람 같았습니다
  alternatives_korean:
  - 마치 잠에서 깨어난 사람 같았습니다
  - 마치 잠에서 깨어나는 남자 같았습니다
  lexicon: HALOT
  rationale: Niphal형의 수동/반사적 뉘앙스를 한국어 현재분사형으로 자연스럽게 살렸고, 비유의 일반성을 위해 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: 수동/반사적 뉘앙스의 처리
  chosen_reading: ‘잠에서 깨어나는 사람’으로 옮겨, 원문의 ‘is awakened’와 ‘wakes’ 가능한 양가성을 모두 과도하게 특정하지 않았습니다.
  alternative_readings:
  - ‘잠에서 깨어난 사람’
  - ‘잠에서 깨어나는 사람’
  rationale: 히브리어 יֵעוֹר는 수동적·반사적으로도 읽힐 수 있으므로, 한국어에서도 해석을 과도하게 고정하지 않는 표현을 택했습니다.
  doctrine_reference: 히브리어 동사상(voice/aspect) 보존 원칙
- issue: 직접 인용 어조
  chosen_reading: 내러티브 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 보다 구어적인 서술
  - 전통적 문어체
  rationale: 본문이 비전 서사의 서술문이므로 현대 표준어 합쇼체로 일관성을 유지했습니다.
  doctrine_reference: POB 한국어 शैली 지침
