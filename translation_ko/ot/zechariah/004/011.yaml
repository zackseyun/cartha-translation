base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/011.yaml
  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
  footnotes:
  - marker: a
    text: Hebrew literally, 'What [are] these two olive trees upon the right of the lampstand and upon its left?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 대답하여 그에게 말했습니다. 「이 두 올리브나무는 무엇입니까? 등잔대 오른쪽과 그 왼쪽에 있는 이 두 나무는 말입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘등잔대의 오른쪽 위에 있고 그 왼쪽 위에 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אַעַן וָ/אֹמַר
  english_pob_choice: Then I answered and said
  chosen_korean: 대답하여 그에게 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 대답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘대답하여 말하다’를 자연스러운 한국어로 옮기되, 질문에 대한 응답이라는 흐름을 분명히 살렸습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그분에게
  - 그에게 말씀드렸습니다
  lexicon: HALOT
  rationale: 대상은 문맥상 천사이지만 이 절 자체는 대명사만 제시하므로, 본문에는 지시만 유지하고 명시적 호칭은 넣지 않았습니다.
- source_word: שְּׁנֵי הַזֵּיתִים הָאֵלֶה
  english_pob_choice: these two olive trees
  chosen_korean: 이 두 올리브나무
  alternatives_korean:
  - 이 두 감람나무
  - 이 두 올리브나무들
  lexicon: HALOT
  rationale: זֵיתִים를 ‘올리브나무’로 옮겨 식물 자체를 가리키게 했고, 현대 한국어에서 의미가 분명한 ‘올리브나무’를 채택했습니다.
- source_word: עַל יְמִין הַמְּנוֹרָה
  english_pob_choice: on the right of the lampstand
  chosen_korean: 등잔대 오른쪽
  alternatives_korean:
  - 등잔대의 오른쪽
  - 등잔대 우편
  lexicon: HALOT
  rationale: עַל + יְמִין의 위치 관계를 한국어의 평이한 공간 표현으로 처리해, 접촉을 뜻하는 ‘위에’가 아니라 방향을 뜻하는 ‘오른쪽’으로 살렸습니다.
- source_word: וְעַל שְׂמֹאולָהּ
  english_pob_choice: and on its left
  chosen_korean: 그 왼쪽
  alternatives_korean:
  - 등잔대의 왼쪽
  - 왼편
  lexicon: HALOT
  rationale: 여성형 대명사 접미사가 ‘등잔대’를 가리키므로, 반복을 줄이면서도 지시 관계가 살아나도록 ‘그 왼쪽’으로 옮겼습니다.
theological_decisions:
- issue: 장면의 질문 형식 유지
  chosen_reading: 직역에 가까운 질문문으로 유지하여, 예언자가 보고 듣는 환상의 미지성을 드러냈습니다.
  alternative_readings:
  - 의미를 풀어 ‘이 두 나무가 무엇을 상징합니까?’로 의역
  - ‘무슨 뜻입니까’처럼 해석어를 삽입
  rationale: 본문은 상징 해석보다 먼저 대상 식별을 묻고 있으므로, 해석을 미리 확정하지 않고 질문 자체를 보존하는 편이 소스에 충실합니다.
  doctrine_reference: 해석은 다음 절들에서 전개되는 문맥에 맡기는 것이 자연스럽습니다.
