source:
  edition: WLC
  text: וָ/אַ֣עַן שֵׁנִ֔ית וָ/אֹמַ֖ר אֵלָ֑י/ו מַה שְׁתֵּ֞י שִׁבֲּלֵ֣י הַ/זֵּיתִ֗ים אֲשֶׁר֙ בְּ/יַ֗ד שְׁנֵי֙ צַנְתְּר֣וֹת הַ/זָּהָ֔ב הַֽ/מְרִיקִ֥ים מֵ/עֲלֵי/הֶ֖ם הַ/זָּהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
  footnotes:
  - marker: a
    text: Or 'these two clusters/sprays of the olive trees'; the Hebrew term is unusual here and may refer to fruit-bearing olive shoots rather than larger branches.
    reason: lexical_alternative
  - marker: b
    text: Or 'the two pipes of gold' or 'the two golden tubes.'
    reason: lexical_alternative
  - marker: c
    text: Likely referring to 'golden oil'; Hebrew literally says 'the gold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 두 번째로 대답하여 그에게 말했습니다. 「이 두 올리브 가지가, 곧 두 금관 앞에 있는 그것들이, 스스로 그 금을 부어내는 것은 무엇입니까?」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올리브나무의 두 송이/무리/새순’일 수 있습니다. 히브리어 표현이 이례적이어서, 큰 가지보다 열매 맺는 올리브의 새순을 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘두 금관’이나 ‘두 황금 관’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 아마도 ‘황금 기름’을 가리키는 말입니다. 히브리어는 문자적으로 ‘그 금’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אַ֣עַן שֵׁנִ֔ית
  english_pob_choice: Then I answered a second time
  chosen_korean: 그러자 내가 두 번째로 대답하여
  alternatives_korean:
  - 그리고 내가 다시 대답하여
  - 내가 또 대답하여
  lexicon: HALOT
  rationale: שֵׁנִית는 단순한 반복보다 ‘두 번째로’가 더 분명하며, wayyiqtol의 연속 서술은 ‘그러자’로 자연스럽게 살렸습니다.
- source_word: וָ/אֹמַ֖ר אֵלָ֑י/ו
  english_pob_choice: and said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 물었습니다
  - 그에게 말하여
  lexicon: HALOT
  rationale: 히브리어는 ‘말하다’이므로 질문의 성격을 반영하더라도 ‘물었습니다’로 바꾸지 않고, 합쇼체 서술에 맞게 정리했습니다.
- source_word: שְׁתֵּ֞י שִׁבֲּלֵ֣י הַ/זֵּיתִ֗ים
  english_pob_choice: these two olive branches
  chosen_korean: 이 두 올리브 가지
  alternatives_korean:
  - 이 두 올리브 새순
  - 이 두 올리브 이삭 같은 것
  lexicon: HALOT
  rationale: שִׁבֲּלֵי는 문자적으로는 ‘이삭/줄기’ 계열이지만, 환상 문맥에서 올리브의 가지처럼 보이는 형상을 가리키므로 한국어에서는 가장 자연스러운 ‘올리브 가지’로 옮겼습니다.
- source_word: שְׁנֵי֙ צַנְתְּר֣וֹת הַ/זָּהָ֔ב
  english_pob_choice: the two golden pipes
  chosen_korean: 두 금관
  alternatives_korean:
  - 두 금빛 관
  - 두 황금 관
  lexicon: HALOT
  rationale: צַנְתְּרוֹת는 희귀어라 직역하면 기구의 형태가 불분명하지만, POB의 흐름-통로 이미지와 맞추어 한국어에서는 문맥상 가장 읽히는 ‘관’으로 옮겼습니다. ‘금관’은 재질을 살리면서도 비유적 환상 장치로 자연스럽습니다.
- source_word: הַֽ/מְרִיקִ֥ים
  english_pob_choice: which pour out
  chosen_korean: 스스로 그 금을 부어내는
  alternatives_korean:
  - 그 금을 흘려보내는
  - 그 금을 쏟아내는
  lexicon: HALOT
  rationale: המריק은 ‘비우다/따라내다/부어내다’의 흐름을 가지므로, 환상 속 공급 기능을 살려 ‘부어내는’으로 옮겼습니다.
- source_word: מֵ/עֲלֵי/הֶ֖ם הַ/זָּהָֽב
  english_pob_choice: pour out the gold from themselves
  chosen_korean: 스스로 그 금을 부어내는
  alternatives_korean:
  - 그들로부터 그 금을 부어내는
  - 그것들로부터 그 금을 쏟아내는
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘그들 위에서/그들로부터’라는 어려운 표현이어서, POB처럼 출처 성격을 살리되 한국어에서는 ‘스스로’로 압축해 공급의 자발적 원천성을 드러냈습니다.
theological_decisions:
- issue: הַזָּהָב의 지시 대상
  chosen_reading: 본문의 ‘그 금’을 그대로 살리고, 해석을 본문 밖으로 미루었습니다.
  alternative_readings:
  - ‘황금 기름’으로 풀어 옮기기
  - 설명적 번역으로 ‘기름’이라고 밝히기
  rationale: 환상 장면에서는 본문이 실제로 ‘금’을 말하므로, 해석을 앞당겨 ‘기름’으로 바꾸면 이미지의 긴장을 약화시킬 수 있습니다. POB의 문맥 판단은 주석에서 보완하는 편이 더 투명합니다.
  doctrine_reference: Translation philosophy §3, §5
