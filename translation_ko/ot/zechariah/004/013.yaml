    text: 또는 “선생님.” 히브리어 אֲדֹנִי는 존중을 나타내는 호칭으로, 여기서는 하나님의 이름이 아니라 환상 속에서 말을 건네는 이를 가리킵니다.
    reason: lexical_alternative
