language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר הֲ/ל֥וֹא יָדַ֖עְתָּ מָה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/013.yaml
  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
  footnotes:
  - marker: a
    text: Or “sir.” The Hebrew אֲדֹנִי is a respectful form of address meaning “my lord” and here refers to the speaker addressed in the vision, not to the divine name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말했습니다[a]. 「이것들이 무엇인지 알지 못하느냐?」 그러자 제가 대답했습니다. 「아닙니다, 내 주님。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 히브리어 אֲדֹנִי는 존중을 나타내는 말로, 여기서는 하나님의 이름이 아니라 환상 속 대화 상대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 제게 말했습니다
  alternatives_korean:
  - 그가 제게 말하였습니다
  - 그리고 그가 제게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 진행형 서술을 자연스러운 현대 한국어 서술로 옮기되, 대화 상대가 ‘me’라는 점을 분명히 드러냈습니다.
- source_word: הֲלוֹא יָדַעְתָּ מָה אֵלֶּה
  english_pob_choice: Do you not know what these are?
  chosen_korean: 「이것들이 무엇인지 알지 못하느냐?」
  alternatives_korean:
  - 「이것들이 무엇인지 모르느냐?」
  - 「이것들이 무엇인지 알고 있지 않느냐?」
  lexicon: HALOT
  rationale: הֲלוֹא의 반문적 압력을 살리면서, 문맥상 ‘이것들’의 정체를 묻는 직접 질문으로 자연스럽게 표현했습니다.
- source_word: לֹא אֲדֹנִי
  english_pob_choice: No, my lord.
  chosen_korean: 「아닙니다, 내 주님。」
  alternatives_korean:
  - 「아닙니다, 나의 주인님。」
  - 「아닙니다, 주님。」
  lexicon: HALOT
  rationale: אֲדֹנִי는 여기서 신적 이름이 아니라 예언 환상 속 인물에게 하는 존칭이므로, 한국어에서도 공손한 인간 მიმართ칭인 ‘내 주님’으로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנִי를 하나님/야훼 호칭으로 오해하지 않도록 하는 처리
  chosen_reading: ‘내 주님’은 환상 속 대화 상대에게 드리는 존칭입니다.
  alternative_readings:
  - ‘주님’
  - ‘주인님’
  rationale: 본문은 해석하는 존재에게 말하는 장면이므로, 신적 호칭으로 읽히지 않게 하면서도 존중의 뉘앙스를 유지하는 번역이 필요합니다.
  doctrine_reference: 원문 맥락 우선; 호칭과 고유명 구분
