  lexicon: HALOT
  rationale: אֲדֹנִי는 여기서 신적 이름이 아니라 예언 환상 속 인물에게 하는 존칭이므로, 한국어에서도 공손한 인간 მიმართ칭인 ‘내 주님’으로 옮겼습니다.
