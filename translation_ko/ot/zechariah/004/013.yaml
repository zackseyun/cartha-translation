translation:
  language: ko
  text: '그가 제게 말했습니다: 「이것들이 무엇인지 알지 못합니까?」 그러자 제가 말했습니다: 「아닙니다, 주인님[a].」'
  philosophy: optimal-equivalence
  footnotes:
