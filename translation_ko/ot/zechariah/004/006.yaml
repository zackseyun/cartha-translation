source:
  edition: WLC
  text: וַ/יַּ֜עַן וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר זֶ֚ה דְּבַר יְהוָ֔ה אֶל זְרֻבָּבֶ֖ל לֵ/אמֹ֑ר לֹ֤א בְ/חַ֨יִל֙ וְ/לֹ֣א בְ/כֹ֔חַ כִּ֣י אִם בְּ/רוּחִ֔/י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
  footnotes:
  - marker: a
    text: Or “Not by army and not by power,” since the Hebrew word for “might” can also refer to military force.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: “the LORD of hosts.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그가 내게 대답하여 이렇게 말했습니다. 「이것은 야훼께서 스룹바벨에게 하신 말씀입니다. ‘힘[a]으로도, 능력으로도 되는 것이 아니라 오직 나의 영으로 된다’고 만군의 야훼께서 말씀하십니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “군대로도”로 옮길 수 있습니다. 히브리어 ‘힘’에 해당하는 말은 군대 또는 군사력을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he answered and said to me
  chosen_korean: 그때 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 대답하고 말했습니다
  - 그가 내게 말했습니다
  lexicon: WLC/HALOT
  rationale: 히브리어 서술 연쇄를 자연스러운 한국어 서사로 옮기되, 응답과 발화의 이중 동작을 유지했습니다.
- source_word: זֶה דְּבַר יְהוָה
  english_pob_choice: This is the word of Yahweh
  chosen_korean: 이것은 야훼께서 하신 말씀입니다
  alternatives_korean:
  - 이것은 야훼의 말씀입니다
  - 이것은 야훼의 메시지입니다
  lexicon: WLC/HALOT
  rationale: דָּבָר의 예언 공식성을 살리기 위해 ‘말씀’으로 두었고, 소유격보다 발화 행위가 드러나는 표현을 택했습니다.
- source_word: לֹא בְחַיִל וְלֹא בְכֹחַ
  english_pob_choice: Not by might, nor by power
  chosen_korean: 힘으로도 되지 않고, 능력으로도 되지 않지만
  alternatives_korean:
  - 군사력으로도 되지 않고, 힘으로도 되지 않지만
  - 권세로도 되지 않고, 능력으로도 되지 않지만
  lexicon: HALOT
  rationale: חַיִל과 כֹחַ의 의미 범위를 한국어의 ‘힘’과 ‘능력’으로 옮겨 폭넓은 대비를 유지했습니다. 무력성만으로 좁히지 않았습니다.
- source_word: בְּרוּחִי
  english_pob_choice: by my Spirit
  chosen_korean: 내 영으로 된다
  alternatives_korean:
  - 내 영으로
  - 내 성령으로 된다
  lexicon: WLC/HALOT
  rationale: רוּחַ는 문맥상 하나님의 ‘영’이지만, 본문 자체의 용어를 따라 ‘영’을 사용했습니다. 명시적 삼위일체 용례가 아니므로 ‘성령’으로 단정하지 않았습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: WLC/HALOT
  rationale: צְבָאוֹת의 전통적 의미를 보존하되, POB의 직역 의도를 따라 ‘만군의’로 옮기고 신명은 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명을 고유명으로 드러내어, 전통적 대체어보다 원문 식별성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: רוּחַ의 한국어 처리
  chosen_reading: 영
  alternative_readings:
  - 성령
  rationale: 구약 예언 문맥에서 원문은 일반명사 רוּחַ를 사용하므로, 본문 수준에서는 ‘영’이 더 직접적입니다. 문맥상 하나님의 영임은 유지했습니다.
  doctrine_reference: 'POB glossary: πνεῦμα (divine) / רוּחַ'
