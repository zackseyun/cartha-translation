  rationale: ‘물었습니다’를 ‘말했습니다’로 바꾸어 וָאַעַן וָאֹמַר의 ‘대답하여 말하다’를 보존했습니다. 인용문 자체가 질문이므로 질문의 의미도 손실되지 않습니다. 각주는 반복되는 표현이라는 정보를 유지하면서 ‘나와 말하던’이라는 자연스러운 대안을 밝혔습니다.
