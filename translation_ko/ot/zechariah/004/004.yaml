base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
  footnotes:
  - marker: a
    text: Or 'who talked with me.' The Hebrew expression is a recurring formula in Zechariah for the interpreting angel accompanying the prophet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 내게 말하던 천사에게 대답하여 말했습니다. “이것들은 무엇입니까, 내 주여?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 말하던 천사’. 히브리어는 스가랴서에서 반복되는, 예언자와 함께하며 그에게 뜻을 알려 주는 천사를 가리키는 공식 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  english_pob_choice: Then I answered and said
  chosen_korean: 그러자 내가 대답하여, ... 물었습니다
  alternatives_korean:
  - 내가 대답하고 말했습니다
  - 그러자 내가 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동사 관용구를 한국어에서 자연스럽게 풀어, 응답의 전개를 살리면서도 ‘대답하여’와 뒤이은 발화를 함께 드러냈습니다.
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 내게 말하고 있던 천사
  alternatives_korean:
  - 나와 말하고 있던 천사
  - 나에게 말하던 천사
  lexicon: HALOT
  rationale: בִּי는 이 문맥에서 ‘내 안에’가 아니라 대화 상대를 나타내는 ‘나와/내게’의 뜻이므로, POB의 ‘with me’ 해석을 따라 자연스러운 현재진행형으로 옮겼습니다.
- source_word: מָה אֵלֶּה
  english_pob_choice: What are these
  chosen_korean: 이것들이 무엇입니까
  alternatives_korean:
  - 이것들은 무엇입니까
  - 이것들이 무엇인가요
  lexicon: HALOT
  rationale: 복수 지시대명사와 의문문을 직역에 가깝게 살리되, 한국어 문장 흐름에 맞게 질문 형식으로 정리했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주여
  alternatives_korean:
  - 나의 주인이여
  - 주여
  lexicon: HALOT
  rationale: 여기서는 천사에게 대한 존칭이므로 신적 호칭으로 올리지 않고, 한국어의 공손한 호격을 써서 상대에 대한 존대를 보존했습니다.
theological_decisions:
- issue: أדני(אֲדֹנִי)의 호칭을 하나님께 드리는 호칭으로 오해하지 않도록 할지 여부
  chosen_reading: 천사에게 드리는 공손한 호칭으로 읽고 ‘내 주여’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 옮겨 신적 호칭처럼 보이게 할 수 있습니다
  - ‘선생님’처럼 완화할 수 있습니다
  rationale: 문맥의 직접 수신자는 ‘내게 말하고 있던 천사’이므로, 신적 칭호를 덧씌우지 않고 존칭만 유지하는 것이 본문의 화자 관계를 정확히 반영합니다.
  doctrine_reference: '문맥 우선 원칙: 직접 수신자 식별에 따라 호칭의 신적/비신적 용법을 구분함'
