id: ZEC.4.10
reference: Zechariah 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מִ֣י בַז֮ לְ/י֣וֹם קְטַנּוֹת֒ וְ/שָׂמְח֗וּ וְ/רָא֞וּ אֶת הָ/אֶ֧בֶן הַ/בְּדִ֛יל בְּ/יַ֥ד זְרֻבָּבֶ֖ל שִׁבְעָה אֵ֑לֶּה עֵינֵ֣י יְהוָ֔ה הֵ֥מָּה מְשׁוֹטְטִ֖ים בְּ/כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
  footnotes:
  - marker: a
    text: Or 'the tin stone,' traditionally 'the plummet.' The Hebrew term can denote tin, but in this building context it likely refers to a plumb weight or measuring stone.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 작은 일의 날을 멸시하였습니까? 이 일곱은 기뻐하고 스룹바벨의 손에 있는 수직추[a]를 보게 될 것입니다. 이 일곱은 온 땅을 두루 다니는 야훼의 눈입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주석 돌’, 전통적으로는 ‘다림추’. 히브리어는 ‘주석’을 뜻할 수 있지만, 건축 문맥에서는 다림추나 측량용 돌을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז / has despised
  english_pob_choice: has despised
  chosen_korean: 멸시하였습니까
  alternatives_korean:
  - 업신여겼습니까
  - 경멸하였습니까
  - 가볍게 여겼습니까
  lexicon: HALOT
  rationale: 질문형 수사 구조의 날카로운 어조를 살리기 위해 ‘멸시하다’를 택했습니다. ‘가볍게 여기다’보다 원문의 폄하 뉘앙스가 더 분명합니다.
- source_word: לְיוֹם קְטַנּוֹת / the day of small things
  english_pob_choice: the day of small things
  chosen_korean: 작은 일들의 날
  alternatives_korean:
  - 작은 것들의 날
  - 작은 시작들의 날
  - 미미한 날
  lexicon: HALOT
  rationale: POB의 ‘small things’를 따라 ‘작은 일들’로 옮겨, ‘작은 시작’으로 미리 해석을 고정하지 않았습니다. 복수형의 압축된 표현을 한국어에서도 살렸습니다.
- source_word: הָאֶבֶן הַבְּדִיל / the plumb stone
  english_pob_choice: the plumb stone
  chosen_korean: 수직추
  alternatives_korean:
  - 줄추
  - 플럼브추
  - 측량돌
  lexicon: HALOT
  rationale: 건축 맥락에서 ‘plumb weight/plummet’의 기능을 가장 분명히 드러내는 현대 한국어로 ‘수직추’를 사용했습니다. POB의 주해상 ‘tin stone’ 가능성은 본문이 아니라 각주로 처리했습니다.
- source_word: בְּיַד זְרֻבָּבֶל / in the hand of Zerubbabel
  english_pob_choice: in the hand of Zerubbabel
  chosen_korean: 스룹바벨의 손에 있는
  alternatives_korean:
  - 스룹바벨의 손 안에 있는
  - 스룹바벨 손에 있는
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 스룹바벨이 직접 그 표지를 쥐고 있는 장면성을 유지했습니다.
- source_word: שִׁבְעָה אֵלֶּה / these seven
  english_pob_choice: these seven
  chosen_korean: 이 일곱
  alternatives_korean:
  - 저 일곱
  - 그 일곱
  lexicon: HALOT
  rationale: 지시어의 근접성을 살려 ‘이 일곱’으로 옮겼습니다. 앞서 보인 환상 요소와의 연결을 자연스럽게 유지합니다.
- source_word: עֵינֵי יְהוָה / the eyes of Yahweh
  english_pob_choice: the eyes of Yahweh
  chosen_korean: 야훼의 눈
  alternatives_korean:
  - 야훼의 눈들
  - 여호와의 눈
  - 주님의 눈
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 יהוה를 ‘야훼’로 옮겼고, 신적 감시/돌봄의 상징을 직역적으로 살려 ‘눈’으로 유지했습니다.
theological_decisions:
- issue: ‘이 일곱’과 ‘야훼의 눈’의 관계
  chosen_reading: ‘이 일곱’은 바로 뒤의 ‘야훼의 눈’에 대한 동격적 설명으로 읽었습니다.
  alternative_readings:
  - ‘이 일곱’은 먼저 보인 일곱 등불/보이는 표상들을 가리키고, 이어서 그것들이 야훼의 눈으로 설명된다
  - ‘이 일곱’은 별도의 인물/천사적 존재를 가리킨다
  rationale: 히브리어 어순이 ‘이 일곱’을 곧바로 ‘야훼의 눈’에 붙여 설명하는 구조이므로, 과도한 구체화를 피하고 상징적 동격을 보존했습니다.
  doctrine_reference: 본문의 상징 해석은 4:10의 문맥과 히브리어 구문에 따른 것입니다.
