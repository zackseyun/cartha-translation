  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: '''This house'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 스룹바벨의 손이 이 집[b]의 기초를 놓았고, 그의 손이 이 집을 완성할 것입니다. 그러면 당신은 만군의 야훼[a]께서 나를 여러분에게 보내셨다는 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה를 POB 원칙에 따라 ‘야훼’로 옮겼습니다. 전통적 번역은 ‘주님’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 집’은 문맥상 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי
  english_pob_choice: the hands of
  chosen_korean: ~의 손
  alternatives_korean:
  - ~의 손들
  - 손이
  lexicon: HALOT
  rationale: 히브리어의 복수/쌍수적 표현을 살리되 한국어에서는 자연스러운 단수형으로 문장을 구성하되, 반복되는 ‘손’ 이미지는 유지했습니다.
- source_word: יִסְּדוּ הַבַּיִת הַזֶּה
  english_pob_choice: laid the foundation of this house
  chosen_korean: 이 집의 기초를 놓았고
  alternatives_korean:
