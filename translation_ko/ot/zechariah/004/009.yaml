  naturalness: ‘당신들에게’는 현대 표준 한국어 성경 문체에서 부자연스럽고, 앞의 단수 ‘당신은’과 결합될 때 특히 어색합니다. 복수 수신자는 ‘여러분에게’로 옮기는 것이 합쇼체에 더 자연스럽습니다. ‘그것을’은 가리키는 대상이 바로 앞의 ‘이 집’이므로 ‘이 집을’로 반복하는 편이 명료합니다.
  terminology: ‘만군의 야훼’, ‘기초를 놓다’, ‘완성하다’는 원문의 어휘와 POB의 야훼 표기를 적절히 반영합니다. ‘이 집’은 본문에 유지하고 성전이라는 문맥 정보는 각주로 제시하는 방식이 적절합니다.
