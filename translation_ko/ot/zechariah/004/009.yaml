  - 이 집의 기초를 닦았고
  lexicon: HALOT
  rationale: יסד는 건축 문맥에서 ‘기초를 놓다’가 가장 직접적이며, בַּיִת는 문자적으로 ‘집’이지만 문맥상 성전을 가리키므로 본문에는 ‘집’을 유지했습니다.
- source_word: תְּבַצַּעְנָה
  english_pob_choice: will complete it
  chosen_korean: 완성할 것입니다
  alternatives_korean:
  - 마칠 것입니다
  - 끝낼 것입니다
  lexicon: HALOT
  rationale: 건축 작업을 끝까지 이뤄 내는 뜻을 자연스럽게 전달하되, 단순 종료보다 성취의 완료감을 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 POB 원칙에 따라 ‘야훼’로 옮기고, צְבָאוֹת는 전통적 ‘만군’이 전달하는 군대/군세의 의미를 살렸습니다.
theological_decisions:
- issue: 신적 파견 진술의 번역
  chosen_reading: ‘야훼께서 나를 당신들에게 보내셨다’
  alternative_readings:
  - ‘야훼께서 나를 너희에게 보내셨다’
  - ‘야훼께서 나를 당신들에게 보내셨다’
  rationale: 예언자적 발화의 1인칭 파송 선언을 직접적으로 살렸고, 2인칭 복수는 한국어에서는 공손한 ‘당신들’보다 중립적 복수 지시를 우선해 ‘당신들에게’로 처리했습니다.
  doctrine_reference: 예언자적 파송 공식과 2인칭 복수 표지
