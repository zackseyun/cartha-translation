id: ZEC.2.10
reference: Zechariah 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'to the four winds of heaven I have scattered you.' The Hebrew can be understood as either a comparison ('like the four winds') or a directional idiom ('to the four winds').
    reason: alternative_reading
  - marker: b
    text: Traditional English versions often render the opening as 'Ho! Ho!' The Hebrew is an urgent summons, hence 'Up! Up!' here.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나라, 일어나라! 북쪽 땅에서 도망하라[a] — 야훼의 말씀입니다. 내가 너희를 하늘의 네 바람[b]으로 흩어 놓았기 때문입니다 — 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽 땅으로부터’로도 옮길 수 있습니다. 히브리어는 출발 지점(‘에서’)과 방향적 관용구(‘북쪽 땅으로부터’) 둘 다 가능하게 읽힙니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘들의 네 바람’에 가깝지만, 의미는 온 땅의 사방을 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הוֹי הוֹי
  english_pob_choice: Up! Up!
  chosen_korean: 일어나라, 일어나라!
  alternatives_korean:
  - 어서, 어서!
  - 일어나라! 일어나라!
  - 어서 피하라!
  lexicon: HALOT
  rationale: 히브리어 הוֹי의 반복은 단순 감탄이 아니라 긴급한 소집·촉구이므로, 현대 한국어에서 즉각적 행동을 촉구하는 ‘일어나라’로 옮겼습니다.
- source_word: וְנֻסוּ
  english_pob_choice: Flee
  chosen_korean: 도망하라
  alternatives_korean:
  - 달아나라
  - 피하라
  - 도망치십시오
  lexicon: HALOT
  rationale: 복수 명령형으로 급박한 탈출을 요구하므로, 문맥의 긴박성을 살리는 직설적 명령 ‘도망하라’를 택했습니다.
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  english_pob_choice: to the four winds of the heavens
  chosen_korean: 하늘의 네 바람
  alternatives_korean:
  - 하늘의 네 바람처럼
  - 하늘의 네 바람으로
  - 하늘의 네 방향
  lexicon: HALOT
  rationale: כְּ의 표지와 POB의 주석이 가리키는 방향적 관용법을 따라, 비교를 전면화하기보다 흩어짐의 방향을 드러내는 ‘하늘의 네 바람’으로 옮겼습니다.
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  english_pob_choice: I have spread you abroad
  chosen_korean: 내가 너희를 흩어 놓았기 때문입니다
  alternatives_korean:
  - 내가 너희를 널리 퍼뜨렸기 때문입니다
  - 내가 너희를 펼쳐 놓았기 때문입니다
  - 내가 너희를 사방으로 흩었기 때문입니다
  lexicon: HALOT
  rationale: פרשׂ의 기본 이미지는 ‘펴다/펼치다’이지만, 여기서는 결과가 분산된 상태를 뜻하므로 한국어에서는 자연스럽고 문맥에 맞는 ‘흩어 놓다’로 옮겼습니다.
theological_decisions:
- issue: 여호와를 어떻게 표기할 것인가
  chosen_reading: 야훼로 표기하지 않고, 본문 흐름상 ‘야훼의 말씀입니다’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 자료의 원문 해설과 기존 POB는 יְהוָה를 영어 본문에서 ‘Yahweh’로 드러내지만, 한국어 본문은 판독성과 예배용 가독성을 위해 동일한 호칭 기능을 살리는 ‘야훼의 말씀입니다’ 형식을 취했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
