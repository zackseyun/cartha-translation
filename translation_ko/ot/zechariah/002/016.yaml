revisions:
- from: 야훼께서 유다를 자신의 몫으로 유업으로 삼으시고, 거룩한 땅에서 다시 예루살렘을 택하실 것입니다.[a][b]
  to: 야훼께서 거룩한 땅에서[a] 유다를 자신의 몫, 곧 유업으로[b] 받으시고, 다시 예루살렘을 택하실 것입니다.
  rationale: The revision relocates the holy-land phrase so that it modifies Yahweh's receiving Judah as inheritance, as in the Hebrew. It also replaces the redundant and less precise “몫으로 유업으로 삼으시고” with an appositional rendering that preserves both Judah as Yahweh's portion and the verb's inheritance imagery. Footnote anchors are placed directly after the expressions they explain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains Yahweh, Judah, the inheritance/portion imagery, the holy land, and Yahweh's renewed choice of Jerusalem. However, placing “거룩한 땅에서” immediately before “다시 예루살렘을 택하실 것입니다” makes it naturally modify the choosing of Jerusalem, whereas the Hebrew attaches the phrase to Yahweh's inheriting Judah. The wording “자신의 몫으로 유업으로” is also syntactically awkward and redundantly stacks two near-synonyms.
  naturalness: The revised ordering makes the scope of “거룩한 땅에서” clear in natural modern formal Korean. “자신의 몫, 곧 유업으로” presents חלקו and נחל as related but distinct inheritance/allotment language without an unnatural double object construction.
  terminology: “야훼,” “유다,” “거룩한 땅,” “유업,” and “예루살렘” are appropriate. “유업으로 받으시고” preserves the marked inheritance language better than the draft's more interpretive “유업으로 삼으시고.”
  issues:
  - severity: medium
    issue: The phrase “거룩한 땅에서” is scoped ambiguously and most readily modifies the following choice of Jerusalem.
    rationale: In the Hebrew, עַל אַדְמַת הַקֹּדֶשׁ belongs with Yahweh's inheriting Judah, not with his choosing Jerusalem. Moving it to the front of that clause preserves the source syntax and sense.
  - severity: medium
    issue: “자신의 몫으로 유업으로 삼으시고” is awkward and conflates the verb's inheritance sense with the noun “his portion.”
    rationale: נחל supplies the inheriting/receiving-as-inheritance action, while חלקו identifies Judah as Yahweh's portion. The revision distinguishes these while retaining their close relationship.
  revised_text: 야훼께서 거룩한 땅에서[a] 유다를 자신의 몫, 곧 유업으로[b] 받으시고, 다시 예루살렘을 택하실 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 “거룩함의 토양 위에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 야훼께서 유다를 유업으로 받으신다는 상속 언어를 사용하며, 유다는 그분의 “몫”으로도 묘사됩니다.
    reason: lexical_alternative
