  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
  footnotes:
  - marker: a
    text: Or, “will take possession of Judah as his inheritance.” The Hebrew keeps inheritance language rather than using a more general verb for possession.
    reason: lexical_alternative
  - marker: b
    text: Literally, “upon the soil of holiness.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 거룩한 땅에서[a] 유다를 자신의 몫, 곧 유업으로[b] 받으시고, 다시 예루살렘을 택하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “거룩함의 토양 위에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 야훼께서 유다를 유업으로 받으신다는 상속 언어를 사용하며, 유다는 그분의 “몫”으로도 묘사됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל / וְנָחַל יְהוָה
  english_pob_choice: will inherit
  chosen_korean: 유업으로 삼으시고
  alternatives_korean:
  - 유다를 상속받으시고
  - 유다를 차지하시고
  - 유다를 자신의 몫으로 삼으시고
  lexicon: HALOT
  rationale: נחל의 유업/상속 어휘를 살리면서도, 한국어에서는 하나님이 유다를 '유업으로 받다'라고 하면 어색하므로 '유업으로 삼으시고'로 covenantal inheritance 이미지를 자연스럽게 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 프로젝트 기본값에 따라 고유명으로 음역한 '야훼'를 사용해, титул인 '주'로 바꾸지 않았습니다.
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  english_pob_choice: in the holy land
  chosen_korean: 거룩한 땅에서
  alternatives_korean:
  - 거룩한 땅 안에서
  - 거룩한 토지에서
  - 성스러운 땅에서
  lexicon: HALOT
  rationale: אַדְמָה는 토양/땅의 감각을 지니므로, '거룩한 땅에서'로 지리적·언약적 성격을 살렸습니다.
- source_word: וּבָחַר עוֹד בִּירוּשָׁלִָם
  english_pob_choice: and he will again choose Jerusalem
  chosen_korean: 다시 예루살렘을 택하실 것입니다
  alternatives_korean:
  - 예루살렘을 다시 선택하실 것입니다
  - 예루살렘을 또다시 택하실 것입니다
  lexicon: HALOT
  rationale: בחר는 '택하다/선택하다'가 자연스러우며, עוֹד는 회복 맥락에서 '다시'로 옮겨 야훼의 재선택을 분명히 했습니다.
theological_decisions:
- issue: 하나님이 유다를 '유업으로' 삼으시는 역전된 상속 언어
  chosen_reading: '''유다를 자신의 몫으로 유업으로 삼으시고''라고 옮겨, 하나님이 유산을 받는 주체처럼 묘사되는 역설을 유지했습니다.'
  alternative_readings:
  - '''유다를 자신의 소유로 취하시고'''
  - '''유다를 자기 몫으로 가지시고'''
  rationale: 히브리어는 이스라엘이 땅을 기업으로 받는 익숙한 방향을 뒤집어 야훼-유다-땅 사이의 상호 소유/소속 관계를 드러냅니다. 이를 일반적 소유 표현으로 완화하지 않았습니다.
  doctrine_reference: 번역 철학 §3, §5
