source:
  edition: WLC
  text: וְ/הִנֵּ֗ה הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י יֹצֵ֑א וּ/מַלְאָ֣ךְ אַחֵ֔ר יֹצֵ֖א לִ/קְרָאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
  footnotes:
  - marker: a
    text: Or 'the angel who talked with me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 내게 말하던 그 천사가 나가고 있었고, 또 다른 천사가 그를 맞으러 나가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 말하던 천사’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 예언·환상 문맥의 주의 환기 표현으로, 영어 POB의 ‘And behold’가 지닌 장면 전환의 힘을 한국어로 간결하게 살렸습니다.
- source_word: הַדֹּבֵר בִּי
  english_pob_choice: who was speaking with me
  chosen_korean: 내게 말하던
  alternatives_korean:
  - 나와 말하던
  - 나와 이야기하던
  lexicon: HALOT
  rationale: 히브리어 분사구문을 관계절처럼 풀어, 계속 진행 중인 ‘말하던’의 서술 기능을 살렸고 בִּי의 관계성을 한국어 자연어에 맞게 ‘내게’로 옮겼습니다.
- source_word: יֹצֵא
  english_pob_choice: went out
  chosen_korean: 나가고 있었고
  alternatives_korean:
  - 나갔고
  - 나가고 있었는데
  lexicon: HALOT
  rationale: 이 절의 연속된 장면 진행을 드러내기 위해 단순 과거보다 진행·전개감을 주는 형태를 택했습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: to meet him
  chosen_korean: 그를 맞으러
  alternatives_korean:
  - 그를 만나러
  - 그와 마주치러
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 한국어의 ‘-러’ 구문으로 자연스럽게 살렸고, 장면상 적극적인 마주 감각을 드러내기 위해 ‘맞으러’를 선택했습니다.
theological_decisions:
- issue: 두 천사의 구별을 어떻게 제시할지
  chosen_reading: 두 존재를 모두 단순히 ‘천사’로 옮기고, 본문이 제공하는 역할 차이만 드러냈습니다.
  alternative_readings:
  - 첫 천사를 ‘해석하는 천사’로 특정하기
  - 둘째 천사를 별도의 기능적 존재로 상세화하기
  rationale: 본문 자체는 두 천사의 정체를 더 설명하지 않으므로, 번역문에서 신학적 식별을 덧붙이지 않고 서술적 구별만 유지했습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서만 식별을 제시하고 추론은 보류합니다.
