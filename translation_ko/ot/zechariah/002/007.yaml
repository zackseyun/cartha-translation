  to: 보라, 나와 말하던[a] 그 천사가 나갔고, 다른 천사가 그를 만나러 나갔습니다.
  rationale: 진행형을 단순 과거 서술로 바꾸어 원문의 환상 장면 전개와 영어 POB의 번역 결정을 따랐습니다. ‘나와 말하던’으로 대화 관계를 보존하고, ‘다른 천사’와 대명사 ‘그’를 통해 두 천사의 구별과 둘째 천사가 첫째 천사를 만나러 간다는 관계를 유지했습니다. 각주도 해당 관계절에 직접 연결했습니다.
