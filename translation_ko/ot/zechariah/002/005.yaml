id: ZEC.2.5
reference: Zechariah 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא וְ/הִנֵּה אִ֑ישׁ וּ/בְ/יָד֖/וֹ חֶ֥בֶל מִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/005.yaml
  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
  footnotes:
  - marker: a
    text: Or, 'a measuring cord.' The Hebrew term can refer more concretely to a cord or rope used for measuring.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 눈을 들어 보니 보았습니다. 보라, 한 사람이 있는데, 그의 손에는 측량줄이 들려 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측량끈’입니다. 히브리어는 더 구체적으로 측량에 쓰는 끈이나 밧줄을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  english_pob_choice: I lifted up my eyes
  chosen_korean: 내가 눈을 들어
  alternatives_korean:
  - 내가 눈을 올려
  - 내 눈을 들어
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리면서도 ‘눈을 들어’라는 시각적·비전적 표현을 유지했습니다.
- source_word: וָאֵרֶא
  english_pob_choice: and saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았고
  - 그리고 보았습니다
  lexicon: HALOT
  rationale: 환시 보고의 서술 흐름을 매끄럽게 살리되, 앞의 ‘눈을 들어’와 중복되는 1인칭 주어는 한국어에서 생략했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보라
  - 그런데
  lexicon: HALOT
  rationale: 갑작스럽게 나타나는 환시의 장면 전환을 드러내는 감탄적 표지로, 한국어 성경체에서 대응되는 ‘보라’를 택했습니다.
- source_word: חֶבֶל מִדָּה
  english_pob_choice: a measuring line
  chosen_korean: 측량줄
  alternatives_korean:
  - 측량끈
  - 측량선
  lexicon: HALOT
  rationale: 측량에 쓰는 줄/끈이라는 구체성을 살리기 위해 ‘줄’을 택했고, 영어 주석의 ‘cord/rope’ 가능성도 반영할 수 있는 표현입니다.
theological_decisions:
- issue: 환시 서술의 직역성과 장면 전환 표지
  chosen_reading: ‘보라’와 ‘한 사람’의 구조를 유지해 예언적 환시의 갑작스러운 현현을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그리고 어떤 사람이 있었는데’처럼 완화하는 번역
  - ‘한 남자’ 대신 ‘사람’으로 일반화하는 번역
  rationale: 본문은 단순 정보 전달이 아니라 환시 속 등장 장면을 강조하므로, 장면 전환의 긴장과 시각성을 약화시키지 않는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 예언서 환시 서술의 문학적 기능
