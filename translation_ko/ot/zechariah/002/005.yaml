- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보라
  - 그런데
  lexicon: HALOT
  rationale: 갑작스럽게 나타나는 환시의 장면 전환을 드러내는 감탄적 표지로, 한국어 성경체에서 대응되는 ‘보라’를 택했습니다.
- source_word: חֶבֶל מִדָּה
  english_pob_choice: a measuring line
  chosen_korean: 측량줄
