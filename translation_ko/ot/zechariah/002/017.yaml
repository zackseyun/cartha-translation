  text: 모든 육체여, 야훼 앞에서 잠잠하십시오[a]. 야훼께서 자신의 거룩한 처소에서 일어나셨기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 인류.' 히브리어는 문자적으로 '모든 육체'라고 되어 있으며, 야훼 앞에서의 인간의 피조성을 강조하는 예언적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '야훼께서 일어나셨다' / '야훼께서 깨어나셨다.' 이 히브리어 동사는 야훼께서 쉼에서 깨어 행동하시는 모습을 그립니다.
    reason: lexical_alternative
