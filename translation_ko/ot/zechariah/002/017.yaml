  text: הַ֥ס כָּל בָּשָׂ֖ר מִ/פְּנֵ֣י יְהוָ֑ה כִּ֥י נֵע֖וֹר מִ/מְּע֥וֹן קָדְשֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/017.yaml
  text: Be silent[a], all flesh, before Yahweh[b], for he has roused himself from his holy dwelling.
  footnotes:
  - marker: a
    text: Or 'all humanity.' The Hebrew reads 'all flesh,' a prophetic expression emphasizing human creatureliness before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has arisen' / 'he has awakened.' The Hebrew verb pictures the LORD stirring from repose to act.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 육체여, 야훼 앞에서 잠잠하십시오. 그분이 그의 거룩한 처소에서 일어나셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 인류.' 히브리어는 문자적으로 '모든 육체'라고 되어 있으며, 하나님 앞에서의 인간의 피조성을 강조하는 예언적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그가 일어나셨다' / '그가 깨어나셨다.' 이 히브리어 동사는 야훼께서 안식에서 일어나 행동하시는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  english_pob_choice: Be silent
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 침묵하십시오
  - 고요하십시오
  - 조용히 하십시오
  lexicon: HALOT
  rationale: 감탄사적 명령으로서의 강한 침묵 요구를 현대 한국어의 공손한 명령형으로 옮겼습니다. '고요하십시오'보다 직접적이고, '조용히 하십시오'보다 예언적 선언의 긴박함을 더 잘 살립니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 인류
  - 모든 인간
  lexicon: HALOT
  rationale: 직역에 가까운 '육체'를 유지해 피조물로서의 인간성과 하나님 앞의 미약함을 드러냈습니다. 이는 영어 POB의 'all flesh'를 살린 선택과도 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신명은 '야훼'로 옮겼습니다. 이는 호칭 대체어인 '주님'보다 원문 고유명을 더 투명하게 반영합니다.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  english_pob_choice: from his holy dwelling
  chosen_korean: 그의 거룩한 처소에서
  alternatives_korean:
  - 그의 거룩한 거처에서
  - 그의 거룩한 주거에서
  - 그의 거룩한 거주지에서
  lexicon: HALOT
  rationale: מָעוֹן은 거주처·거처를 뜻하므로 자연스러운 예배 언어인 '처소'를 택했습니다. '거룩한'은 원문의 קדשׁוֹ가 만드는 공간적-성결적 긴장을 유지합니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: '''야훼''를 본문에 직접 표기합니다.'
  alternative_readings:
  - '''주님''으로 대체'
  - '''여호와'' 표기'
  rationale: 이 번역 프로젝트의 기본 원칙에 따라 텍스트의 고유한 신적 이름을 보존했습니다. 이는 예언자의 호소가 단순한 칭호가 아니라 언약의 이름을 향하고 있음을 드러냅니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
