  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
  footnotes:
  - marker: a
    text: Or 'the powers' or 'the kingdoms'; the Hebrew says 'horns,' a common prophetic image for strength or ruling power.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 나와 말하던 천사에게 말했습니다. “이것들은 무엇입니까?” 그가 내게 말했습니다. “이것들은 유다와 이스라엘과 예루살렘을 흩어 놓은 뿔들입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘권세들’ 또는 ‘왕국들’; 히브리어 원문은 ‘뿔들’이라고 합니다. 뿔은 예언 문맥에서 흔히 힘이나 통치 권력을 나타내는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 전령
  lexicon: HALOT
  rationale: 환상 장면에서 זכריה의 해석자 역할을 하는 존재이므로, 문자적 의미보다 자연스러운 문맥상 ‘천사’가 적절합니다.
- source_word: הַדֹּבֵר בִּי
  english_pob_choice: who was speaking with me
  chosen_korean: 나와 말하는
  alternatives_korean:
  - 나에게 말하는
  - 내 안에서 말하는
  lexicon: HALOT
  rationale: 문맥상 대화 중인 해석 천사를 가리키므로 ‘나와 말하는’이 가장 자연스럽고, ‘내 안에서’는 문맥이 뒷받침하지 않습니다.
- source_word: הַקְּרָנוֹת
  english_pob_choice: the horns
  chosen_korean: 뿔들
  alternatives_korean:
  - 권세들
  - 왕국들
  lexicon: HALOT
  rationale: 예언적 상징을 해석어로 바꾸지 않고 본문의 이미지인 ‘뿔’ 자체를 보존했습니다.
- source_word: זֵרוּ
  english_pob_choice: scattered
  chosen_korean: 흩어 버린
  alternatives_korean:
  - 분산시킨
  - 키질한
  lexicon: HALOT
  rationale: זרה는 여기서 유다·이스라엘·예루살렘을 사방으로 흩어 놓은 행위를 가리키므로, 한국어로는 결과를 분명히 하는 ‘흩어 버린’이 적절합니다.
theological_decisions:
- issue: ‘뿔들’의 상징성을 본문에서 풀어쓸지 여부
  chosen_reading: 본문에는 상징 해석어를 덧붙이지 않고 ‘뿔들’을 그대로 유지했습니다.
  alternative_readings:
  - 권세들
  - 왕국들
  rationale: 원문은 대상 자체를 ‘뿔들’이라 부르며, 그 상징적 의미를 본문이 아니라 독자가 보게 합니다. 번역이 해석을 앞서면 원문의 긴장이 약해집니다.
  doctrine_reference: original-language primacy; source-directed prophetic imagery
