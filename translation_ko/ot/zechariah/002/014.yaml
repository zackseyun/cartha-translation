  - marker: b
    text: Hebrew 'daughter Zion,' a poetic personification of Zion/Jerusalem.
    reason: cultural_note
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 딸 시온아, 기뻐하며 즐거워하여라. 보라, 내가 오고 있으며, 내가 너의 가운데에 거하겠다. 야훼의 말씀이니라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하여라’와 ‘즐거워하여라’는 히브리어 여성 단수 명령형 두 개를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘딸 시온’은 시온/예루살렘을 의인화한 시적 호칭입니다.
    reason: cultural_note
  - marker: c
    text: 본문의 יְהוָה는 고유 신명사로, 관용적 번역인 ‘주님’ 대신 ‘야훼’로 옮겼습니다.
    reason: ot_citation
