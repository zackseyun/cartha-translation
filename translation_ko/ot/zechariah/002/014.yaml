  text: 딸 시온아,[b] 환호하고 기뻐하십시오.[a] 보십시오, 내가 오고 있으며 네 가운데에 거하겠습니다. 야훼의 말씀입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
