    text: ‘환호하고 기뻐하십시오’는 히브리어 여성 단수 명령형 두 개를 옮긴 것입니다. 첫 동사는 ‘환호하다’ 또는 ‘기쁨으로 노래하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘딸 시온’은 시온, 곧 예루살렘을 여성으로 의인화하여 부르는 시적 호칭입니다.
    reason: cultural_note
  - marker: c
    text: 본문의 יְהוָה는 고유 신명사이며, 여기서는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
