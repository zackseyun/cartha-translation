theological_decisions:
- issue: 신명사 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 직접적으로 יְהוָה를 사용하므로, 프로젝트 기본 방침에 따라 고유 신명사를 '야훼'로 드러내어 언약적 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘내가 너의 가운데에 거하겠다’의 임재 언어
  chosen_reading: 거하겠다
  alternative_readings:
  - 살겠다
  - 함께 있겠다
  rationale: פְּרוֹפֶּטִיק한 미래 약속으로서 하나님의 임재를 말하므로, 단순한 동거보다 ‘거하다’가 성소적·언약적 임재의 울림을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
