  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
  footnotes:
  - marker: a
    text: Or “Jerusalem will dwell like unwalled villages.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “man,” used here collectively for the human population; alternatively, “people” or “humankind.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게[a] 말했습니다. “달려가서 그 젊은이에게[b] 말하십시오. ‘예루살렘은 자기 안에 사람과 가축이 많아 성벽 없는 마을들처럼 살게 될 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘은 성벽 없는 마을들처럼 살게 될 것입니다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어 “사람”은 여기서 사람 전체를 가리키는 집합적 표현입니다. 또는 “백성”, “인류”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻץ
