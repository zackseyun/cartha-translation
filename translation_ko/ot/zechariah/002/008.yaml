  rationale: נַעַר는 문맥상 어린아이보다 젊은 남성을 가리키므로, 예언 장면에 자연스러운 ‘젊은이’로 옮겼습니다.
- source_word: פְּרָזוֹת
  english_pob_choice: open country
  chosen_korean: 성벽 없는 마을들처럼
  alternatives_korean:
