translation:
  language: ko
  text: 그가 그에게 말했습니다. “달려가서 그 젊은이에게 말하십시오. ‘예루살렘에는 사람[b]과 가축이 매우 많아 성벽 없는 마을들처럼[a] 사람이 거주하게 될 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “트인 땅처럼.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “사람”은 여기서 사람 전체를 가리키는 집합적 표현입니다. 또는 “사람들”, “인류”로 옮길 수 있습니다.
    reason: lexical_alternative
