  rationale: 단순히 전달하는 것보다 직접 발화하라는 명령을 드러내는 ‘말하십시오’가 원문의 동작을 잘 반영합니다.
- source_word: הַנַּעַר הַלָּז
  english_pob_choice: that young man
  chosen_korean: 그 젊은이
