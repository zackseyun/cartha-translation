  rationale: פְּרָזוֹת의 핵심은 ‘성벽이 없는 개방성’이므로, 도시 확장과 밀집을 함께 드러내는 비교형으로 풀어 옮겼습니다.
theological_decisions:
- issue: 예루살렘의 상태를 어떻게 비교적으로 옮길지
  chosen_reading: ‘성벽 없는 마을들처럼’은 도시가 더 이상 성곽으로 한정되지 않을 만큼 팽창한 상태를 드러냅니다.
  alternative_readings:
  - ‘열린 땅’
  - ‘무성벽 마을들’
  rationale: 원문은 예루살렘의 인구 증가로 인한 공간적 팽창을 말하므로, 단순한 지리 묘사보다 ‘성벽 없음’의 이미지가 예언의 힘을 더 분명히 전달합니다.
  doctrine_reference: Zechariah 2:8 context; POB revision notes on פְּרָזוֹת
