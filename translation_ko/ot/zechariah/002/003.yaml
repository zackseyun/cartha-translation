translation:
  language: ko
  text: 그때 야훼께서 내게 네 명의 장인을 보여주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “대장장이들”로 옮길 수 있습니다. 히브리어 용어는 더 구체적으로 금속을 다루는 기술자를 가리킬 수 있지만, 더 넓게는 장인이나 기술자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יַּרְאֵ/נִי
  english_pob_choice: Then ... showed me
  chosen_korean: 그때 … 보여주셨습니다
  alternatives_korean:
  - 그리고 … 보여주셨습니다
  - 내게 … 보게 하셨습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행과 ‘he showed me’의 관용적 의미를 살려, 예언 환상 서술에 자연스러운 ‘그때’와 ‘보여주셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms — יְהוָה YHWH
  rationale: 본문의 신명사 표기를 제목어 ‘주님’으로 바꾸지 않고, POB의 기준에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: אַרְבָּעָה
  english_pob_choice: four
  chosen_korean: 네 명의
  alternatives_korean:
  - 네
  - 네 사람의
  lexicon: HALOT
  rationale: 수사가 남성 복수 명사를 수식하므로, 한국어에서는 사람을 가리키는 자연스러운 표현으로 ‘네 명의’가 적절합니다.
- source_word: חָרָשִׁים
  english_pob_choice: craftsmen
  chosen_korean: 장인
  alternatives_korean:
  - 기술자
  - 공예가
  - 대장장이
  lexicon: HALOT
  rationale: 히브리어 חָרָשִׁים는 특정 업종에 한정되지 않고 숙련된 기술자를 넓게 가리키므로, 과도하게 금속세공으로 좁히지 않는 ‘장인’이 가장 무난합니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 언약적 고유명칭을 직접 사용하므로, 이를 대체 칭호로 바꾸지 않고 음역형 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
