id: ZEC.2.15
reference: Zechariah 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: The speaker says, 'the LORD of Armies has sent me to you.' The text does not explicitly identify the 'me'; the ambiguity should be preserved.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 많은 나라들이 야훼께 연합하여 내 백성이 될 것입니다. 내가 네 가운데에[b] 거하겠고, 너는 만군의 야훼[a]께서 나를[c] 네게 보내셨다는 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 전통적으로 ‘만군의 주’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 가운데’의 ‘네’는 히브리어 여성 단수입니다. 문맥상 시온/예루살렘을 가리킵니다.
    reason: source_note
  - marker: c
    text: ‘나’를 가리키는 화자가 누구인지는 본문에서 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִלְווּ גוֹיִם רַבִּים אֶל יְהוָה
  english_pob_choice: will join themselves to Yahweh / many nations
  chosen_korean: 많은 나라가 야훼께 합류하여
  alternatives_korean:
  - 많은 민족이 야훼께 붙어
  - 많은 나라들이 야훼께 자신을 붙이며
  lexicon: HALOT
  rationale: נלוה의 자발적 결합 의미를 살려 단순한 ‘오다’보다 관계적·언약적 결속을 드러내는 ‘합류하다’를 택했습니다. גוֹיִם은 여기서 ‘민족들/나라들’의 국제적 범위를 가리키므로 ‘나라’가 자연스럽습니다.
- source_word: וְהָיוּ לִי לְעָם
  english_pob_choice: they will be my people
  chosen_korean: 그들의 백성이 될 것입니다
  alternatives_korean:
  - 내 백성이 될 것입니다
  - 내게 한 백성이 될 것입니다
  lexicon: HALOT
  rationale: 복수 주어 뒤의 단수 עָם은 언약적 집합체를 뜻하므로, 한국어에서는 ‘그들의 백성’으로 옮겨 다수의 나라들이 하나의 공동체가 됨을 드러냈습니다.
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  english_pob_choice: I will dwell in your midst
  chosen_korean: 내가 너의 가운데에 거하겠고
  alternatives_korean:
  - 내가 너희 가운데에 거하겠고
  - 내가 네 한가운데에 거하겠고
  lexicon: HALOT
  rationale: 2인칭 여성 단수 어미를 반영해 ‘너의’로 옮겼고, שׁכן의 거주 의미는 ‘거하다’가 가장 직접적입니다. ‘가운데에’는 도시/시온 가운데 임재를 자연스럽게 살립니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 군대들의 야훼
  - 만군의 주
  lexicon: HALOT
  rationale: 예언서의 관용적 신칭은 한국어 성경에서 널리 쓰이는 ‘만군의 야훼’가 가장 투명하면서도 원문의 군사적 이미지를 충분히 보존합니다.
theological_decisions:
- issue: 말하는 이의 정체를 확정하지 않는 문제
  chosen_reading: ‘야훼께서 나를 너에게 보내셨다’라는 1인칭을 그대로 유지했습니다.
  alternative_readings:
  - ‘야훼께서 그를 너에게 보내셨다’로 해석하여 화자를 명시
  - 화자를 천사/선지자로 단정
  rationale: 본문은 누가 ‘나’인지를 명시하지 않으므로, 그 모호성을 그대로 두어 독자가 본문 자체의 긴장을 느끼도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 언약 공식의 집합적 단수 표현
  chosen_reading: 복수의 나라들을 ‘그들의 백성’이라는 하나의 언약 공동체로 옮겼습니다.
  alternative_readings:
  - ‘내 백성들’
  - ‘여러 민족의 백성’
  rationale: 히브리어의 복수 주어와 단수 ‘백성’의 결합은 분열이 아니라 언약적 통합을 뜻하므로, 한국어에서도 그 통합성을 유지했습니다.
  doctrine_reference: 언약 백성의 통일성
