base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
  footnotes:
  - marker: a
    text: Or, more formally, “To where are you going?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “to see how much its width and how much its length,” an idiom meaning “to see how wide it is and how long it is.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말했습니다. 「어디로 가십니까?」[a] 그가 제게 말했습니다. 「예루살렘을 측량하여 그 너비와 길이가 얼마나 되는지 보려고 갑니다.」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 좀 더 형식적으로, “어디를 향해 가십니까?”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “그 너비가 얼마나 되는지와 그 길이가 얼마나 되는지”로, 도시의 치수를 묻는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֖נָה אַתָּ֣ה הֹלֵ֑ךְ
  english_pob_choice: Where are you going
  chosen_korean: 「당신은 어디로 가십니까?」
  alternatives_korean:
  - 「어디로 가고 계십니까?」
  - 「어디로 가십니까?」
  lexicon: HALOT
  rationale: אָנה는 목적지를 묻는 의문부사이므로 ‘어디로’가 자연스럽고, הֹלֵךְ은 현재 진행/상태를 살려 공손한 현재형으로 옮겼습니다.
- source_word: לָ/מֹד אֶת יְרוּשָׁלִַם
  english_pob_choice: To measure Jerusalem
  chosen_korean: 예루살렘을 측량하러
  alternatives_korean:
  - 예루살렘을 재러
  - 예루살렘을 재기 위해
  lexicon: HALOT
  rationale: למד/מדד 계열의 구체적 행위를 살려 ‘측량하다’로 옮겼고, 목적을 나타내는 부정사 용법은 ‘-하러’로 자연스럽게 표현했습니다.
- source_word: לִ/רְא֥וֹת כַּ/מָּֽה רָחְבָּ֖/הּ וְ/כַ/מָּ֥ה אָרְכָּֽ/הּ
  english_pob_choice: to see how wide it is and how long it is
  chosen_korean: 예루살렘의 너비와 길이가 얼마나 되는지
  alternatives_korean:
  - 그 넓이와 길이가 얼마나 되는지
  - 얼마나 넓고 얼마나 긴지
  lexicon: HALOT
  rationale: 히브리어의 ‘얼마나’ + 명사구 반복을 한국어에서는 자연스러운 설명형으로 풀되, 도시의 두 차원을 나타내는 어휘를 유지했습니다.
theological_decisions:
- issue: 말하는 화자의 직접 인용과 공손도
  chosen_reading: 인물 대화는 한국어 합쇼체로 유지하고, 예언서 본문의 서술체와 맞게 직접화법을 분명히 했습니다.
  alternative_readings:
  - 더 평이한 반말체 대화
  - 전통적 성경체인 하옵나이다체
  rationale: 본문은 질문-응답의 장면이므로 현대 독자가 즉시 파악할 수 있게 공손한 대화체를 유지하되, 고어체로 의미를 흐리지 않도록 했습니다.
  doctrine_reference: 번역 शैली 결정
- issue: ‘측량하다’의 구체성
  chosen_reading: 도시의 규모를 재는 물리적 행위를 분명히 드러내기 위해 ‘측량하다’를 채택했습니다.
  alternative_readings:
  - ‘살펴보다’
  - ‘조사하다’
  rationale: 문맥상 단순 관찰이 아니라 실제 치수를 재는 행동이므로, 본문의 의미 강도를 보존하는 표현이 필요합니다.
  doctrine_reference: 본문 문맥
