  naturalness: ‘당신은 어디로 가십니까?’도 문법적으로 가능하지만, 한국어 대화에서는 주어를 생략한 ‘어디로 가십니까?’가 더 자연스럽습니다. ‘측량하여 … 보려고 갑니다’는 목적 관계를 자연스럽고 명료하게 드러냅니다.
  terminology: ‘예루살렘’과 ‘측량하다’는 적절합니다. ‘너비와 길이’도 원문의 두 치수 표현을 정확히 보존합니다.
