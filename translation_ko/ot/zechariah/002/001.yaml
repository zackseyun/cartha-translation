translation:
  language: ko
  text: 내가 눈을 들어 보았더니, 보십시오, 네 개의 뿔이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 권세’. 히브리어는 문자적으로 ‘뿔’이라고 하며, 뿔은 흔히 힘이나 지배 권세를 나타내는 상징입니다. 본문은 그 이미지를 그대로 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת עֵינַי
  english_pob_choice: I lifted up my eyes
  chosen_korean: 내가 눈을 들어 바라보니
  alternatives_korean:
  - 내가 내 눈을 들어 보니
  - 내가 눈을 올려 보니
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 자연스러운 ‘눈을 들어 보다’로 옮겨, 시선 전환의 동작을 살리면서도 직역의 어색함을 줄였습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보니
  - 보라
  lexicon: HALOT
  rationale: 환시 장면의 돌출성과 청중 지시성을 살리기 위해, 현대 합쇼체에서 자연스러운 주의 환기 표현으로 처리했습니다.
- source_word: אַרְבַּע קְרָנוֹת
  english_pob_choice: four horns
  chosen_korean: 네 개의 뿔
  alternatives_korean:
  - 네 뿔
  - 네 개의 권세
  lexicon: HALOT
  rationale: 본문의 상징 이미지는 해석으로 풀지 않고 ‘뿔’을 그대로 유지했습니다. POB가 주석에서 제시한 ‘powers’는 본문이 아니라 풀이이므로 본문에는 넣지 않았습니다.
theological_decisions:
- issue: 상징 이미지의 번역 방식
  chosen_reading: ‘네 개의 뿔’을 문자적 이미지로 유지했습니다.
  alternative_readings:
  - ‘네 권세’처럼 의미를 해석해 옮김
  rationale: 이 환상은 뒤 문맥에서 뜻이 설명되므로, 여기서 상징을 미리 해설하면 본문의 긴장을 해소해 버립니다. 원문이 제시하는 예언적 이미지를 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; original-language primacy'
