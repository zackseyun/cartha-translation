  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י הִנְ/נִ֨י מֵנִ֤יף אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/הָי֥וּ שָׁלָ֖ל לְ/עַבְדֵי/הֶ֑ם וִֽ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחָֽ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own slaves[c][b]. Then you will know that Yahweh of Armies has sent me.
  footnotes:
  - marker: a
    text: Or 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will become plunder for their servants.' The Hebrew עבד can mean 'servant' or 'slave'; 'slaves' is chosen here to preserve the force of the reversal.
    reason: lexical_alternative
  - marker: c
    text: The speaker says, 'the LORD of Armies has sent me,' without explicitly identifying himself; the text leaves that identity open in context.
    reason: alternative_reading
translation:
  language: ko
  text: 보라, 내가 그들 위로 내 손을 흔들려 하니, 그들이 자기 종들에게 노획물이 될 것입니다. 그러면 너희는 야훼가 나를 보내셨음을 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보라’는 히브리어 הִנְנִי의 주의 환기와 임박성까지 함께 반영합니다.
    reason: source_note
  - marker: b
    text: ‘노획물’은 전쟁에서 얻는 전리품을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘종들’은 히브리어 עבד의 기본 의미를 따라, 본문의 신분 역전을 드러내기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold / I am about to
  chosen_korean: 보라, 내가 … 하려 하니
  alternatives_korean:
  - 보라, 내가 … 하겠습니다
  - 보십시오, 내가 … 하려 합니다
  lexicon: HALOT
  rationale: 예언적 주의를 끄는 감탄과 임박한 행동의 뉘앙스를 함께 살리기 위해 ‘보라’와 ‘하려 하니’를 결합했습니다.
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  english_pob_choice: wave my hand over them
  chosen_korean: 내 손을 흔들려 하니
  alternatives_korean:
  - 내 손을 그들 위로 들려 하니
  - 내 손을 그들 위에 휘두르려 하니
  lexicon: HALOT
  rationale: מניף의 구체적 동작 이미지를 살리되, 한국어에서 자연스러운 심판 행위의 예고로 들리도록 ‘손을 흔들다’로 옮겼습니다.
- source_word: שָׁלָל לְעַבְדֵיהֶם
  english_pob_choice: plunder for their own slaves
  chosen_korean: 자기 종들에게 노획물이 될 것입니다
  alternatives_korean:
  - 자기 종들에게 전리품이 될 것입니다
  - 자기 종들이 노략물을 얻게 될 것입니다
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁의 전리품/노획물을 뜻하므로 ‘노획물’로 옮겼고, עבד는 본문의 역전 구조를 훼손하지 않도록 ‘종들’로 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of Armies
  chosen_korean: 야훼
  alternatives_korean:
  - 만군의 야훼
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 본 기록의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮기되, צבאות는 여기서 직역해 별도 호칭을 덧붙이지 않았습니다.
theological_decisions:
- issue: ‘그들 위로 내 손을 흔들다’의 심판적 뉘앙스
  chosen_reading: 직역 이미지와 심판 의도를 함께 살려, 단순한 제스처가 아니라 억압자들에 대한 적극적 심판 행위로 읽히게 했습니다.
  alternative_readings:
  - ‘그들 위에 내 손을 들어’처럼 보다 완곡하게 옮기는 방식
  - ‘그들을 향해 내 손을 휘두르려 하니’처럼 공격성을 더 노골화하는 방식
  rationale: 히브리어는 구체적 동작을 통해 심판의 선언을 전달하므로, 의미를 약화시키지 않으면서도 한국어로 이해 가능한 강도를 유지했습니다.
  doctrine_reference: 'translation philosophy: preserve source force without domestication'
- issue: ‘자기 종들’의 신분 역전
  chosen_reading: עבד의 범위를 ‘종’으로 유지해, 본문이 말하는 사회적·권력적 역전은 살리되 ‘노예’로 과도하게 좁히지 않았습니다.
  alternative_readings:
  - ‘노예들’로 번역하여 더 강한 억압 구조를 드러내는 방식
  - ‘하인들’로 옮겨 완화하는 방식
  rationale: 문맥상 전리품의 소유 관계가 핵심이므로, 전통적 교회어보다 더 중립적인 ‘종’을 택해 역전의 충격을 보존했습니다.
  doctrine_reference: 'translation philosophy: maintain lexical tension'
