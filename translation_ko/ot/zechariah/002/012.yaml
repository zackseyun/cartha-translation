id: ZEC.2.12
reference: Zechariah 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
  footnotes:
  - marker: a
    text: Or 'For glory he has sent me to the nations that plunder you.' The Hebrew phrase 'After glory' is difficult and may express purpose, sequence, or relation to honor/glory.
    reason: alternative_reading
  - marker: b
    text: Or 'the apple of his eye.' The Hebrew idiom denotes the most sensitive and carefully protected part of the eye.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 만군의 주께서 이렇게 말씀하십니다. "영광 뒤에 그가 나를 너희를 약탈하는 나라들에게 보내셨습니다. 누구든지 너희를 건드리는 자는 그의 눈동자를 건드리는 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '영광을 위해 그가 나를 너희를 약탈하는 나라들에게 보냈습니다.' 히브리어 구문 '영광 뒤에'는 어렵고, 목적·순서·영광과의 관계를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그의 눈의 한가운데.' 이 관용구는 눈의 가장 민감하고 보호되는 부분을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼 만군의 주
  alternatives_korean:
  - 야훼 만군의 하나님
  - 주 야훼 만군
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת은 군대/하늘 군세를 포괄하는 관용적 칭호로서 만군의 주를 택했습니다.
- source_word: אַחַר כָּבוֹד
  english_pob_choice: After glory
  chosen_korean: 영광 뒤에
  alternatives_korean:
  - 영광을 위해
  - 영광 후에
  - 영광을 따라
  lexicon: HALOT
  rationale: 구문이 난해하므로 영어 POB처럼 관계를 단정하지 않고, 뒤에라는 직역적 형태로 모호성을 보존했습니다.
- source_word: שְׁלָחַנִי
  english_pob_choice: he has sent me
  chosen_korean: 그가 나를 보내셨습니다
  alternatives_korean:
  - 그가 나를 보냈습니다
  - 그가 나를 파견하셨습니다
  lexicon: HALOT
  rationale: 히브리어 완료형을 자연스러운 현재 관련 과거로 옮기되, 파견하셨습니다보다 보내셨습니다가 보다 직접적입니다.
- source_word: אֶל הַגּוֹיִם הַשֹּׁלְלִים אֶתְכֶם
  english_pob_choice: against the nations that plunder you
  chosen_korean: 너희를 약탈하는 나라들에게
  alternatives_korean:
  - 너희를 노략질하는 민족들에게
  - 너희를 노략하는 이방 민족들에게
  - 너희를 치는 나라들에게
  lexicon: HALOT
  rationale: אֶל은 문자적으로는 에게/로이지만, 약탈하는 나라들과의 적대 문맥에서 목적지보다 대항 방향이 분명하여 한국어에서는 '...에게/로'보다 동작 대상을 드러내는 표지를 자연스럽게 살렸습니다.
- source_word: בְּבָבַת עֵינָיו
  english_pob_choice: the pupil of his eye
  chosen_korean: 그의 눈동자
  alternatives_korean:
  - 그의 눈알
  - 그의 눈의 동자
  - 그의 눈의 한가운데
  lexicon: HALOT
  rationale: 영어 POB의 'pupil'은 전통적 관용구 'apple of his eye' 대신 더 투명한 표현을 택한 것이므로, 한국어도 의미상 핵심인 가장 민감하고 보호되는 부위를 담는 눈동자로 옮겼습니다.
theological_decisions:
- issue: '''그가 나를''과 ''그의 눈''의 지시 대상이 문맥상 분명히 해소되지 않는 문제'
  chosen_reading: 문장을 매끈하게 해석하지 않고, 주체와 소유격의 긴장을 그대로 두었습니다.
  alternative_readings:
  - 예언자가 야훼를 대신해 말하는 것으로 볼 수 있음
  - 천상 사자가 말하는 것으로 볼 수 있음
  - 야훼가 보낸 신적 인물을 가리킬 수 있음
  rationale: 히브리어가 보이는 1인칭 파견 언어와 3인칭 소유격의 긴장을 본문대로 남겨 두어, 본문이 허용하는 범위를 넘는 조화를 피했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
