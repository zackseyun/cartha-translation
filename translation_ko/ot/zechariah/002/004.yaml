  edition: WLC
  text: וָ/אֹמַ֕ר מָ֛ה אֵ֥לֶּה בָאִ֖ים לַֽ/עֲשׂ֑וֹת וַ/יֹּ֣אמֶר לֵ/אמֹ֗ר אֵ֣לֶּה הַ/קְּרָנ֞וֹת אֲשֶׁר זֵ֣רוּ אֶת יְהוּדָ֗ה כְּ/פִי אִישׁ֙ לֹא נָשָׂ֣א רֹאשׁ֔/וֹ וַ/יָּבֹ֤אוּ אֵ֨לֶּה֙ לְ/הַחֲרִ֣יד אֹתָ֔/ם לְ/יַדּ֞וֹת אֶת קַרְנ֣וֹת הַ/גּוֹיִ֗ם הַ/נֹּשְׂאִ֥ים קֶ֛רֶן אֶל אֶ֥רֶץ יְהוּדָ֖ה לְ/זָרוֹתָֽ/הּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
  footnotes:
  - marker: a
    text: Or, 'so that no one lifted up his head.' The Hebrew reads literally, 'according to the mouth of a man, he did not lift up his head,' an idiom expressing humiliation or helplessness.
    reason: lexical_alternative
  - marker: b
    text: '''Horns'' symbolize power or aggressive strength; the image is kept rather than interpreted in the main text.'
    reason: cultural_note
  - marker: c
    text: Or, 'to throw down' the horns of the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 말했습니다. 「이것들은 와서 무엇을 하려는 것입니까?」 그가 말했습니다. 「이것들은 유다를 흩어 아무도 머리를 들지 못하게 한 뿔들입니다.[a][b] 이것들은 그 뿔들을 두렵게 하고, 유다 땅을 향해 뿔을 들고 그 땅을 흩으려 한 나라들의 뿔들을 꺾으려고 왔습니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘사람의 입에 따라, 그가 자기 머리를 들지 않았다’입니다. 이는 굴욕이나 무력함을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 권력이나 공격적인 힘을 상징합니다. 본문에서는 이 이미지를 해석하지 않고 그대로 보존했습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나라들의 뿔들을 내던지려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַקְּרָנוֹת
  english_pob_choice: These are the horns
  chosen_korean: 이것들은 뿔들입니다
  alternatives_korean:
  - 이것들은 권세들입니다
  - 이것들은 힘입니다
  lexicon: HALOT
  rationale: 환상 이미지인 ‘뿔’을 그대로 살려 예언적 상징을 보존했습니다. ‘권세’나 ‘힘’은 뜻은 드러내지만 본문의 상징성을 약화시킵니다.
- source_word: זֵרוּ ... לְזָרוֹתָהּ
  english_pob_choice: scattered ... to scatter her
  chosen_korean: 흩어 놓아서 ... 그것을 흩으려
  alternatives_korean:
  - 분산시켜 ... 분산시키려
  - 흩어 버려서 ... 흩어 버리려
  lexicon: HALOT
  rationale: 흩는 심판과 유배의 이미지를 자연스러운 한국어로 옮겼습니다. ‘흩어 놓다’는 결과 상태를, ‘흩으려’는 목적을 드러냅니다.
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  english_pob_choice: so that no man lifted up his head
  chosen_korean: 아무도 머리를 들지 못하게
  alternatives_korean:
  - 어떤 남자도 머리를 들지 못하게
  - 사람 하나도 머리를 들지 못하게
  lexicon: HALOT
  rationale: 직역의 ‘머리를 들다’라는 관용구를 유지하면서, 한국어에서는 자연스러운 결과절로 풀었습니다. POB의 본문 의미를 따라 ‘수치와 무력함’을 나타냅니다.
- source_word: לְהַחֲרִיד
  english_pob_choice: to terrify
  chosen_korean: 두렵게 하고
  alternatives_korean:
  - 무섭게 하고
  - 떨게 하고
  lexicon: HALOT
  rationale: 심판 문맥의 강도를 살리면서도 현대 한국어에서 과도하게 거칠지 않은 표현을 선택했습니다.
- source_word: לְיַדּוֹת
  english_pob_choice: to cast down
  chosen_korean: 꺾으려고
  alternatives_korean:
  - 무너뜨리려고
  - 내리치려고
  - 떨어뜨리려고
  lexicon: HALOT
  rationale: 희귀 동사의 의미를 문맥상 ‘내려뜨려 굴복시키다’는 방향으로 풀었습니다. 한국어에서는 대상의 ‘뿔’을 꺾는 표현이 이미지와 기능을 함께 전합니다.
theological_decisions:
- issue: ‘horns’ 이미지의 보존
  chosen_reading: 상징을 해석어로 바꾸지 않고 ‘뿔들’로 유지했습니다.
  alternative_readings:
  - 권세들
  - 강한 세력들
  rationale: 이 환상은 뒤이어 ‘뿔을 든 나라들’과 맞물려 상징적으로 작동하므로, 본문이 주는 시각적·신학적 힘을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: אִישׁ의 성별 표지
  chosen_reading: ‘no man’의 성별 표지를 한국어에서 직접 재현하지 않고, 문맥상 포괄적 무력 상태로 옮겼습니다.
  alternative_readings:
  - 아무도
  - 사람 하나도
  rationale: 한국어의 ‘아무도’는 남성 한정으로 들리지 않으면서도 본문의 관용적 의미를 자연스럽게 전달합니다. 다만 여기서는 수치와 굴복의 상태가 핵심이므로 과도한 성별 표지는 피했습니다.
  doctrine_reference: Translation philosophy §4
