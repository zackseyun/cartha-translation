id: ZEC.2.9
reference: Zechariah 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י אֶֽהְיֶה לָּ/הּ֙ נְאֻם יְהוָ֔ה ח֥וֹמַת אֵ֖שׁ סָבִ֑יב וּ/לְ/כָב֖וֹד אֶֽהְיֶ֥ה בְ/תוֹכָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
  footnotes:
  - marker: a
    text: Or, 'and I will be a glory in her midst.' The Hebrew can be understood either with an anarthrous predicate ('glory') or as an indefinite predicate ('a glory').
    reason: lexical_alternative
translation:
  language: ko
  text: “그리고 나 자신이 그 성읍의 사방을 두른 불의 성벽이 될 것입니다. 야훼의 말씀입니다. 또 내가 그 한가운데에서 영광이 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I myself
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 그리고 내가
  - 나 자신이
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살리되 한국어에서는 ‘내가’에 앞서 문맥상 주목을 이끄는 감탄적 도입 ‘보라’를 두어 예언 선언의 힘을 자연스럽게 전달했습니다.
- source_word: חוֹמַת אֵשׁ סָבִיב
  english_pob_choice: a wall of fire all around
  chosen_korean: 사방으로 … 불의 성벽
  alternatives_korean:
  - 불의 성벽으로 둘러싸인
  - 사방의 불벽
  lexicon: HALOT
  rationale: ‘wall of fire’의 비유를 그대로 살리고, סָבִיב은 ‘사방으로’로 옮겨 포위·보호의 이미지를 분명히 했습니다.
- source_word: וּלְכָבוֹד
  english_pob_choice: and I will be glory
  chosen_korean: 영광이 되리라
  alternatives_korean:
  - 한 영광이 되리라
  - 영광으로 되리라
  - 영광이 되겠습니다
  lexicon: HALOT
  rationale: 히브리어의 무관사 서술어를 살려 하나님 자신이 도성의 ‘영광’이 되신다는 강한 진술을 유지했습니다. 한국어에서는 관사 구분이 없어 ‘영광이 되리라’가 가장 직접적입니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 선언하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식인 נְאֻם을 단순 ‘말하다’보다 격조 있는 ‘선언하다’로 옮겨 예언적 종결감을 보존했고, Tetragrammaton은 본 항목의 원칙에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 예루살렘(도시)의 여성 단수 지시와 한국어 대명사 처리
  chosen_reading: ‘그에게’로 바꾸지 않고 3인칭 지시를 유지하되, 문맥의 도성 인격화를 과도하게 풀어쓰지 않았습니다.
  alternative_readings:
  - 그녀에게
  - 그 도성에게
  - 예루살렘에게
  rationale: 히브리어의 여성 단수 접미사가 도성을 인격화하지만, 한국어 본문에서는 주어를 새로 덧붙이기보다 문맥상 암시를 유지하는 편이 원문 밀착도가 높습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; do not paraphrase beyond the source text'
- issue: ‘그 가운데에 영광’의 무관사 서술어 해석
  chosen_reading: 본문은 ‘그 가운데에 영광이 되리라’로 옮기고, 대안 가능성은 각주로 처리하지 않았습니다.
  alternative_readings:
  - 그 가운데에 한 영광이 되리라
  - 그 가운데에 영광이 되겠습니다
  rationale: 히브리어는 무관사 서술어로 읽을 수 있어 ‘영광’ 자체로 번역하는 것이 원문 긴장을 가장 잘 보존합니다. 한국어에서는 관사 대비가 없어 별도 각주 없이도 의미가 전달됩니다.
  doctrine_reference: 'DOCTRINE.md: maintain lexical/theological tension where documented'
