  - 사는 자들아
  - 거하는 자들아
  lexicon: HALOT
  rationale: 여성 단수 분사는 호격적으로 사용되어 대상을 규정하므로, ‘함께 사는 자들아’로 옮겨 바벨과의 결속 상태를 드러냈습니다.
- source_word: בַּת בָּבֶל
  english_pob_choice: Daughter Babylon
  chosen_korean: 바벨의 딸
  alternatives_korean:
