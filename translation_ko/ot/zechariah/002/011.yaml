  rationale: 지명 고유명사이므로 통용되는 성경적 음역인 ‘시온’을 사용했습니다.
- source_word: הִמָּלְטִ֑י
  english_pob_choice: Escape
  chosen_korean: 피하십시오
  alternatives_korean:
