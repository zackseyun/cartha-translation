  lexicon: HALOT
  rationale: 예언서의 의인화 표현을 살리기 위해 ‘딸 바벨’처럼 풀지 않고, 원문의 속격 구조를 드러내는 ‘바벨의 딸’을 유지했습니다.
theological_decisions:
- issue: 시온과 바벨의 딸의 관계를 어떻게 드러낼 것인가
  chosen_reading: 이 절은 시온을 향한 긴급한 호출이며, 바벨의 딸과 함께 거주하는 자들에게 즉시 이탈하라고 부르는 것으로 이해했습니다.
  alternative_readings:
  - 시온 자체가 바벨 안에 있다고 볼 수 있음
  - 개별 여성 거주자를 직접 지칭한다고 볼 수 있음
  rationale: 히브리어의 여성형 호격과 분사구문은 예언적 시온-바벨 대조를 형성하므로, 그 상징적 인격화를 보존하되 의미를 과도하게 해석하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; translate what the Hebrew plainly says.'
