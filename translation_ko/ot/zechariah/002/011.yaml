  lexicon: HALOT
  rationale: 니팔 명령형의 핵심은 위험에서 벗어나 구출되는 것이므로, 무리한 직역보다 안전하게 빠져나가라는 촉구를 담은 ‘피하십시오’가 가장 균형적입니다.
- source_word: יוֹשֶׁ֖בֶת
  english_pob_choice: you who dwell
  chosen_korean: 함께 사는 자들아
  alternatives_korean:
  - 거주하는 자들아
  - 사는 자들아
  - 거하는 자들아
  lexicon: HALOT
  rationale: 여성 단수 분사는 호격적으로 사용되어 대상을 규정하므로, ‘함께 사는 자들아’로 옮겨 바벨과의 결속 상태를 드러냈습니다.
- source_word: בַּת בָּבֶל
