  lexicon: HALOT
  rationale: 감탄사 הוֹי는 단순한 탄식이 아니라 급박한 촉구로 쓰였으므로, 현대 한국어에서는 자연스럽고 절박한 호출인 ‘일어나십시오’로 옮겼습니다.
