  to: 포로 공동체에 속한 헬대와 도비야와 여다야에게서 가져오십시오. 그리고 그날에 당신이 직접 가서 스바냐의 아들 요시야의 집에 가십시오. 그들은 바벨론에서 왔습니다.[a][b][c][d]
