id: ZEC.6.1
reference: Zechariah 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָשֻׁ֗ב וָ/אֶשָּׂ֤א עֵינַ/י֙ וָֽ/אֶרְאֶ֔ה וְ/הִנֵּ֨ה אַרְבַּ֤ע מַרְכָּבוֹת֙ יֹֽצְא֔וֹת מִ/בֵּ֖ין שְׁנֵ֣י הֶֽ/הָרִ֑ים וְ/הֶ/הָרִ֖ים הָרֵ֥י נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
  footnotes:
  - marker: a
    text: 'Or ''from between the two mountains.'' The Hebrew has the definite article: ''the two mountains.'''
    reason: lexical_alternative
  - marker: b
    text: '''Bronze'' may also be rendered ''copper.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 다시 돌아서서 눈을 들어 보니, 보라, 네 대의 전차가 두 산 사이에서 나오고 있었으며, 그 산들은 놋산들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 산 사이에서’. 히브리어는 정관사를 사용해 ‘그 두 산’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘놋’은 문맥에 따라 ‘청동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  english_pob_choice: Then I turned
  chosen_korean: 내가 다시 돌아서서
  alternatives_korean:
  - 내가 돌이켜서
  - 내가 다시 돌아왔고
  lexicon: HALOT
  rationale: 시야를 바꾸어 환상을 다시 본다는 문맥이므로 단순한 이동보다 ‘돌아서서’가 자연스럽고, שוב의 반복·전환 뉘앙스를 반영합니다.
- source_word: וָאֶשָּׂא עֵינַי / וָאֶרְאֶה
  english_pob_choice: lifted up my eyes and saw
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
  - 눈을 들어서 보았습니다
  - 올려다보니
  lexicon: HALOT
  rationale: ‘눈을 들다’는 히브리어 관용구를 한국어로도 살리되, 예언적 환시 서술에 맞게 간결하게 연결했습니다.
- source_word: אַרְבַּע מַרְכָּבוֹת
  english_pob_choice: four chariots
  chosen_korean: 네 대의 전차
  alternatives_korean:
  - 네 수레
  - 네 전차
  lexicon: HALOT
  rationale: מַרְכָּבוֹת은 전쟁/환시 문맥의 전차가 가장 적절하므로 ‘전차’로 옮겼습니다. 한국어에서는 계수사와 함께 ‘네 대의’가 자연스럽습니다.
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  english_pob_choice: from between two mountains
  chosen_korean: 두 산 사이에서
  alternatives_korean:
  - 그 두 산 사이에서
  - 두 산들 사이에서
  lexicon: HALOT
  rationale: 히브리어의 ‘둘 사이’ 이미지를 직역하되, 한국어에서는 ‘사이에서’가 가장 자연스럽고 장면의 이동을 분명히 합니다.
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  english_pob_choice: the mountains were mountains of bronze
  chosen_korean: 그 산들은 놋산들이었습니다
  alternatives_korean:
  - 그 산들은 청동산들이었습니다
  - 그 산들은 놋으로 된 산들이었습니다
  lexicon: HALOT
  rationale: 원문의 반복(‘산들은 산들이었다’)을 살리면서도 한국어에서는 어색함을 줄이기 위해 ‘놋산들’로 압축했습니다. נְחֹשֶׁת는 본문 맥락에서 전통적이면서도 원문과 맞닿는 ‘놋’으로 옮겼습니다.
theological_decisions:
- issue: נְחֹשֶׁת의 재질어 선택
  chosen_reading: 놋
  alternative_readings:
  - 청동
  - 구리
  rationale: 이 구절은 교리적 쟁점보다 어휘 선택의 문제이며, 예언 환시의 금속 상징을 한국어 성경 전통과 원문의 폭을 함께 반영할 수 있는 ‘놋’이 가장 안정적입니다.
  doctrine_reference: None
