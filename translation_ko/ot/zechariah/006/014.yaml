revisions:
- from: 그 관들은 헬렘과 도비야와 여다야와 스바냐의 아들 헨을 위한 것이며, 야훼의 성전 안에서 기념물이 될 것입니다.[a]
  to: 그 관들은 헬렘과 도비야와 여다야와 스바냐의 아들 헨을 위한 기념으로 야훼의 성전에 남을 것입니다.[a]
  rationale: 수정문은 히브리어 복수 ‘관들’과 본문의 인명 형태를 유지하면서, לְזִכָּרוֹן을 ‘기념으로’로 옮겨 불필요한 물질적 특정화를 피했습니다. 또한 성전에서 보존되는 미래적 결과를 ‘성전에 남을 것입니다’로 자연스럽게 표현했습니다. 헬렘/헬다이의 본문상 이름 차이는 기존 각주로 보존했습니다.
