source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
  footnotes:
  - marker: a
    text: Or, more literally, “from beneath him he will sprout.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 이렇게 말하십시오[a]. “만군의 야훼께서 이렇게 말씀하십니다. ‘보십시오, 한 사람이 있습니다—그의 이름은 가지입니다. 그가 자기 자리에서 돋아나 야훼의 성전을 지을 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문을 더 직역하면 “그 아래에서 그가 돋아날 것입니다”라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 하늘 군대의 야훼
  lexicon: HALOT
  rationale: יְהוָה는 POB의 원칙에 따라 하나님의 고유명사인 ‘야훼’로, צְבָאוֹת는 군사적·우주적 위용을 살려 관용적으로 ‘만군’으로 옮겼습니다.
- source_word: צֶמַח
  english_pob_choice: Branch
  chosen_korean: 가지
  alternatives_korean:
  - 싹
  - 순
  - 가지(메시아적 칭호를 드러내는 ‘Branch’ 음역형)
  lexicon: HALOT
  rationale: 문맥상 인물의 이름/호칭으로 기능하므로 ‘가지’로 옮겨 식물 이미지와 이름의 기능을 함께 살렸습니다. 한국어에서 ‘Branch’를 직접 음역하기보다 의미를 드러내는 쪽이 자연스럽습니다.
- source_word: שְׁמוֹ
  english_pob_choice: is his name
  chosen_korean: 그 이름은 …입니다
  alternatives_korean:
  - 이름은 …입니다
  - 그의 이름은 …입니다
  lexicon: HALOT
  rationale: 히브리어의 명명 공식과 호응 구조를 살려, ‘그 이름은 가지입니다’로 인물의 호칭을 분명히 했습니다.
- source_word: וּמִתַּחְתָּיו יִצְמָח
  english_pob_choice: he will branch out from his place
  chosen_korean: 그가 자기 자리에서 돋아나서
  alternatives_korean:
  - 그가 자기 자리에서 자라서
  - 그가 그 아래에서 솟아나서
  lexicon: HALOT
  rationale: 영문 POB처럼 직역의 어색함을 피하되, 히브리어의 ‘돋아남/자라남’ 이미지와 ‘자기 자리’의 공간감을 유지했습니다.
- source_word: הֵיכַל
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 궁전
  - 성소
  lexicon: HALOT
  rationale: 여호와의 הֵיכַל은 이 문맥에서 예배 공간인 ‘성전’이 가장 직접적이고 표준적인 대응어입니다.
theological_decisions:
- issue: צֶמַח의 메시아적 함의
  chosen_reading: 본문의 이름-호칭 기능을 살려 ‘가지’로 번역하되, 번역문 자체에서 ‘메시아’ 같은 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 메시아로 명시
  - 일반 명사인 ‘싹/순’으로만 처리
  rationale: 본문은 인물을 ‘한 사람’이라 부르고 동시에 ‘가지’라는 이름을 부여합니다. 이 예언적 상징은 보존하되, 본문이 말하지 않는 식별을 번역이 앞서 하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
