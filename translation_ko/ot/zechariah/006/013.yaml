- from: 그가 야훼의 성전을 건축할 것이며, 위엄을 지니고, 자기 왕좌에 앉아 다스릴 것입니다. 그가 자기 왕좌에서 제사장이 될 것이며, 평화의 조언은 그 둘 사이에 있을 것입니다.[a][b][c]
  to: 참으로 그가 야훼의 성전을 건축할 것이며, 위엄을 지닐 것이고[c], 자기 왕좌에 앉아 다스릴 것입니다. 그가 자기 왕좌에서 제사장이 될 것이며[a], 평화의 의논이 그 둘 사이에 있을 것입니다.[b]
