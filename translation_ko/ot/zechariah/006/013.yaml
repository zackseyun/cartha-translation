id: ZEC.6.13
reference: Zechariah 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
  footnotes:
  - marker: a
    text: Or 'and there will be a priest on his throne'; the Hebrew allows some to distinguish the priest from the enthroned ruler.
    reason: alternative_reading
  - marker: b
    text: '''Between the two of them'' may refer to the kingly and priestly roles, or to two distinct figures such as ruler and priest.'
    reason: alternative_reading
  - marker: c
    text: Or 'will bear honor' or 'will bear splendor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그가 야훼의 성전을 건축할 것이며, 위엄을 지닐 것이고[c], 자기 왕좌에 앉아 다스릴 것입니다. 그가 자기 왕좌에서 제사장이 될 것이며[a], 평화의 의논이 그 둘 사이에 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 왕좌에 제사장이 있을 것이다’; 히브리어는 제사장을 왕좌에 앉은 통치자와 구분하여 읽을 여지를 줍니다.
    reason: alternative_reading
  - marker: b
    text: ‘그 둘 사이에’는 왕적 역할과 제사장적 역할을 가리킬 수도 있고, 통치자와 제사장이라는 두 별개의 인물을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘존귀를 지닐 것이다’ 혹은 ‘영광을 지닐 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 궁전
  - 야훼의 성소
  lexicon: HALOT
  rationale: הֵיכַל은 문맥상 성전을 가리키는 것이 가장 자연스럽고, יְהוָה는 본 프로젝트 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: יִשָּׂא הוֹד
  english_pob_choice: will bear majesty
  chosen_korean: 위엄을 지니고
  alternatives_korean:
  - 영광을 지니고
  - 존귀를 지니고
  lexicon: HALOT
  rationale: נשא + הוד는 ‘짐/지님’의 이미지와 왕적 위엄을 함께 담으므로, 동작성을 살리면서도 한국어로 자연스러운 ‘위엄을 지니고’로 옮겼습니다.
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  english_pob_choice: and he will sit and rule on his throne
  chosen_korean: 자기 왕좌에 앉아 다스릴 것입니다
  alternatives_korean:
  - 자기 왕좌에 앉아 통치할 것입니다
  - 왕좌에 앉아 다스리며
  lexicon: HALOT
  rationale: ‘앉다’와 ‘다스리다’의 병렬을 유지하되, 현대 한국어에서 자연스럽게 읽히도록 정리했습니다.
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  english_pob_choice: and he will be a priest on his throne
  chosen_korean: 그가 자기 왕좌에서 제사장이 될 것이며
  alternatives_korean:
  - 그는 자기 왕좌에서 제사장이 될 것이며
  - 자기 왕좌 위의 제사장이 될 것이며
  lexicon: HALOT
  rationale: 주어를 계속 동일 인물로 유지하는 기본 문법을 따르면서, ‘제사장이 될 것’의 직접성을 살렸습니다.
- source_word: וַעֲצַת שָׁלוֹם
  english_pob_choice: the counsel of peace
  chosen_korean: 평화의 조언
  alternatives_korean:
  - 평화의 계획
  - 평화의 의논
  lexicon: HALOT
  rationale: עצה는 ‘조언/계획/결의’의 폭이 있으나, 한국어에서는 ‘조언’이 평화를 매개하는 합의적 뉘앙스를 비교적 직접적으로 드러냅니다.
theological_decisions:
- issue: ‘그 둘 사이에’의 referent ambiguity
  chosen_reading: 마지막 표현은 ‘그 둘’의 지시 대상을 특정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 왕과 제사장의 두 직분 사이로 이해할 수 있음
  - 두 인물—통치자와 제사장—사이로 이해할 수 있음
  rationale: 히브리어는 마지막에 의도적으로 압축적이고 모호하므로, 의미를 조기 해소하지 않고 긴장을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
