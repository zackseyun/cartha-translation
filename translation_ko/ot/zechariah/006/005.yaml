id: ZEC.6.5
reference: Zechariah 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַן הַ/מַּלְאָ֖ךְ וַ/יֹּ֣אמֶר אֵלָ֑/י אֵ֗לֶּה אַרְבַּע֙ רֻח֣וֹת הַ/שָּׁמַ֔יִם יוֹצְא֕וֹת מֵֽ/הִתְיַצֵּ֖ב עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
  footnotes:
  - marker: a
    text: Or “the four spirits of heaven.” The Hebrew word can mean either “winds” or “spirits.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 천사가 내게 대답하며 말했습니다. "이것들은 하늘의 네 바람인데, 온 땅의 주 앞에 서 있다가 나아갑니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘의 네 영들.” 히브리어는 “바람”과 “영” 둘 다를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן הַמַּלְאָךְ
  english_pob_choice: Then the angel answered
  chosen_korean: 그때 천사가 대답하며
  alternatives_korean:
  - 그때 천사가 응답하며
  - 그때 그 천사가 말하며
  lexicon: HALOT
  rationale: ענה의 서술 관용구를 살려 ‘대답하며’로 옮기고, מלאך는 이 환상 문맥에서 ‘천사’가 가장 자연스럽습니다.
- source_word: אֵלֶּה אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  english_pob_choice: These are the four winds of heaven
  chosen_korean: 이것들은 하늘의 네 바람인데
  alternatives_korean:
  - 이것들은 하늘의 네 영인데
  - 이것들은 하늘의 네 숨결인데
  lexicon: HALOT
  rationale: רֻחוֹת는 ‘바람/영’의 중의성이 있으나, 여기서는 환상 이미지의 직접성에 따라 ‘바람’을 본문으로 두고 중의성은 풋노트로 보존했습니다.
- source_word: יוֹצְאוֹת
  english_pob_choice: going out
  chosen_korean: 나아갑니다
  alternatives_korean:
  - 나갑니다
  - 떠나갑니다
  lexicon: HALOT
  rationale: 진행성을 가진 분사를 한국어에서 자연스럽게 풀어 ‘나아갑니다’로 옮겨, 단순 이동보다 파송·전진의 흐름을 살렸습니다.
- source_word: מֵהִתְיַצֵּב עַל
  english_pob_choice: from standing before
  chosen_korean: 앞에 서 있다가
  alternatives_korean:
  - 서서
  - 대기하다가
  lexicon: HALOT
  rationale: התיצב + עַל의 관용은 상전/우위자 앞에 ‘서 있는’ 대기 상태를 가리키므로, ‘앞에 서 있다가’로 자연스럽고 직접적으로 반영했습니다.
theological_decisions:
- issue: רֻחוֹת의 의미 범위
  chosen_reading: 본문은 ‘바람’으로 두되, 주석으로 ‘영’ 가능성을 보존합니다.
  alternative_readings:
  - 네 영
  - 네 기운
  rationale: 환상 속 보편적·우주적 운동을 드러내는 즉각적 의미는 ‘바람’이지만, 히브리어의 다의성을 지워서는 안 되므로 대체 अर्थ를 각주로 유지합니다.
  doctrine_reference: 번역 철학 §3 (신학적 긴장 보존)
- issue: ‘온 땅의 주’의 호칭 처리
  chosen_reading: אַדוֹן כָּל הָאָרֶץ를 ‘온 땅의 주’로 옮겨 하나님의 सार्व권을 분명히 합니다.
  alternative_readings:
  - 온 땅의 주님
  - 전 땅의 주
  rationale: 본문의 칭호는 단순한 소유가 아니라 세계적 주권을 강조하므로, 현대 한국어에서 자연스럽고도 신학적으로 선명한 ‘온 땅의 주’를 택했습니다.
  doctrine_reference: 야훼의 सार्व권에 대한 예언서 문맥
