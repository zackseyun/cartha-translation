id: ZEC.6.7
reference: Zechariah 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
  footnotes:
  - marker: a
    text: Or “the dappled ones” (traditionally, a color designation for the horses/teams); the Hebrew as pointed in the Masoretic Text more naturally reads “the strong ones.”
    reason: alternative_reading
  - marker: b
    text: Or “throughout the land”; Hebrew אֶרֶץ can mean either “earth” or “land,” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 강한 자들이 나와서 온 땅을 두루 다니러 가고자 하였습니다[a]. 그가 말씀하셨습니다. “가서 온 땅을 두루 다니십시오[b].” 그러자 그들이 온 땅을 두루 다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “얼룩무늬 것들.” 전통적으로 말들 또는 마차 팀의 색을 가리키는 표현으로 이해됩니다. 그러나 마소라 본문의 모음 표기는 더 자연스럽게 “강한 자들”로 읽힙니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그 땅 전체.” 히브리어 אֶרֶץ는 문맥에 따라 “땅” 또는 “온 세상”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  english_pob_choice: the strong ones
  chosen_korean: 강한 자들
  alternatives_korean:
  - 힘센 자들
  - 얼룩무늬 말들
  lexicon: HALOT
  rationale: MT의 모음은 אמץ 계열의 ‘강함’ 의미를 가리키므로 한국어도 성질을 직접 드러내는 ‘강한 자들’로 옮겼습니다. 색채 표현은 문맥상 가능성이 있으나 본문은 주석으로만 보존하는 편이 소스에 더 충실합니다.
- source_word: לָלֶכֶת
  english_pob_choice: to go
  chosen_korean: 다니려고
  alternatives_korean:
  - 가려고
  - 떠나려고
  lexicon: HALOT
  rationale: 단순한 이동 동사 הלך의 목적을 한국어에서 자연스럽게 풀어 ‘-려고’로 살렸습니다.
- source_word: לְהִתְהַלֵּךְ / וַתִּתְהַלַּכְנָה
  english_pob_choice: to walk throughout / they walked throughout
  chosen_korean: 두루 다니다
  alternatives_korean:
  - 두루 걷다
  - 이리저리 다니다
  - 순찰하다
  lexicon: HALOT
  rationale: hitpael의 반복·순행적 뉘앙스를 ‘두루 다니다’로 간결하게 살렸고, 같은 어근의 반복을 본문 전체에서 일관되게 유지했습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: throughout the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 그 땅
  lexicon: HALOT
  rationale: אֶרֶץ의 범위가 이 환상 문맥에서는 전 지구적 의미를 띠므로 ‘온 땅’으로 옮겼습니다. ‘땅’은 지리적·우주적 중립성을 유지하면서도 한국어에서 자연스럽습니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: 온 땅
  alternative_readings:
  - 그 땅
  - 땅
  rationale: 이 장면은 온 세상을 둘러보는 환상적 파견 장면이므로 범위를 축소하지 않고 ‘온 땅’으로 유지했습니다.
  doctrine_reference: Zechariah vision context; translation philosophy §1, §3
- issue: ‘강한 자들’의 정체성
  chosen_reading: strength-based rendering
  alternative_readings:
  - 색채 기반 말들
  rationale: 본문의 모음표기는 강함 의미를 지지하므로 본문은 그 읽기를 따르고, 색채 관련 독법은 본문이 아닌 주석으로 남겼습니다.
  doctrine_reference: MT vocalization; translation philosophy §5
