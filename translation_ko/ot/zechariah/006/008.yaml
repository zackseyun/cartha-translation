  source_fidelity: 히브리어의 ‘큰 소리로 부르다’(וַיַּזְעֵק), 발화 도입, 북쪽 땅의 반복, 그리고 רוּחִי의 해석상 여지는 대체로 반영되었습니다. 다만 ‘불러서’는 זעק의 큰 소리로 외쳐 부르는 뉘앙스를 약화하며, 각주는 본문과 동일한 표현을 단순 반복하여 실제 대안 번역을 제시하지 못합니다.
