  yaml_path: translation/ot/zechariah/006/008.yaml
  text: Then he called out to me and spoke to me[a], saying, “See, those going out to the land of the north have set my Spirit at rest in the land of the north.”
  footnotes:
  - marker: a
    text: Or “have given rest to my spirit”; the phrase may also carry the sense that God's anger or judicial displeasure has been quieted in the north.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 불러서 내게 말씀하셨습니다. 「보아라, 북쪽 땅으로 나아가는 자들이 북쪽 땅에서 내 영을 쉬게 하였다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 영을 쉬게 하였다”로도 옮길 수 있습니다. 이 표현은 하나님의 진노나 재판상의 불쾌가 북쪽에서 가라앉았다는 뜻을 띨 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּזְעֵק
  english_pob_choice: called out
  chosen_korean: 불러서
  alternatives_korean:
  - 외쳐서
  - 불러
  lexicon: HALOT
  rationale: זעק의 큰 소리로 부르거나 외치는 뜻을 살리되, 한국어에서 지나치게 감정적이지 않고 문맥에 자연스러운 표현으로 옮겼습니다.
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  english_pob_choice: spoke to me, saying
  chosen_korean: 내게 말씀하셨습니다
  alternatives_korean:
  - 내게 말하셨습니다
  - 내게 말씀하시며
  lexicon: HALOT
  rationale: 예언 장면의 공식적인 발화 구조를 한국어에서 간결하게 살리기 위해 표준적인 말씀 화법을 사용했습니다.
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 영(靈)
  - 내 숨
  lexicon: HALOT
  rationale: רוח은 여기서 하나님의 인격적 ‘영’으로도, 진정된 내적 분노/기운으로도 읽힐 수 있어, 본문의 해석 긴장을 유지하는 쪽으로 ‘영’을 택했습니다. ‘성령’은 본문의 문맥상 과도한 특정화가 될 수 있습니다.
theological_decisions:
- issue: ‘my Spirit’의 의미를 본문에서 어떻게 유지할지
  chosen_reading: 하나님의 ‘영’이 북쪽 땅에서 쉬게 되었다는 표현을 그대로 살려, 심판의 진정 또는 진노의 가라앉음 가능성을 주석적 여지로 남깁니다.
  alternative_readings:
  - 내 영을 쉬게 하였다를 곧바로 내 진노가 가라앉았다는 뜻으로 풀이함
  - 내 영을 성령으로 특정함
  rationale: 히브리어 רוּחַ는 의미 범위가 넓으므로, 본문이 허용하는 표현을 보존하고 해석은 각주 수준에 맡기는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: Interpretive tension should be preserved rather than resolved in the main text.
