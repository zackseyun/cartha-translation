- from: 그가 나를 불러서 내게 말씀하셨습니다. 「보아라, 북쪽 땅으로 나아가는 자들이 북쪽 땅에서 내 영을 쉬게 하였다」[a]
  to: 그가 큰 소리로 나를 부르시고 내게 말씀하셨습니다. “보십시오. 북쪽 땅으로 나아가는 이들이 북쪽 땅에서 내 영을 쉬게 하였습니다.”[a]
  rationale: 큰 소리로 부르는 זעק의 어감을 보완하고, 본문의 모든 서술과 명령형을 현대 합쇼체로 통일했습니다. רוּחַ는 ‘영’으로 유지하여 해석상 긴장을 보존했으며, 각주는 실제 번역 대안과 가능한 심판·진노의 함의를 제공하도록 고쳤습니다.
