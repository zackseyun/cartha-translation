  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַ֨עַן֙ וָֽ/אֹמַ֔ר אֶל הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י מָה אֵ֖לֶּה אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
  footnotes:
  - marker: a
    text: Or 'who talked with me.' The Hebrew participle can describe the angel as the one speaking with the prophet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 그 뜻을 묻는 천사에게 대답하며 말했습니다. 「이것들이 무엇입니까, 제 주인이시여?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 말하던’. 히브리어 분사는 천사를 예언자와 계속 말하는 존재로 묘사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אַ֨עַן֙ וָֽ/אֹמַ֔ר
  english_pob_choice: Then I answered and said
  chosen_korean: 그러자 내가 대답하며 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그러자 내가 대답하고 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 서술을 자연스러운 한국어로 옮기되, 질문에 앞선 응답이라는 흐름을 살리기 위해 ‘그러자’와 ‘대답하며 말했습니다’를 사용했습니다.
- source_word: הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 그 뜻을 묻는 천사에게
  alternatives_korean:
  - 나와 말하고 있던 천사에게
  - 나와 대화하던 천사에게
  lexicon: HALOT
  rationale: participial ‘speaking with me’의 지속성을 살리면서 한국어에서는 현재분사형보다 관계절보다 간결한 ‘그 뜻을 묻는 천사’로 자연스럽게 풀었습니다. 다만 원문의 ‘나와 말하는 천사’라는 관계를 유지하도록 주어를 천사로 분명히 남겼습니다.
- source_word: מָה אֵ֖לֶּה
  english_pob_choice: What are these
  chosen_korean: 이것들이 무엇입니까
  alternatives_korean:
  - 이것들은 무엇입니까
  - 이것이 무엇입니까
  lexicon: HALOT
  rationale: 복수 지시어 אֵלֶּה를 반영해 ‘이것들이’로 옮겼고, 현대 한국어 질문형에 맞게 ‘무엇입니까’를 사용했습니다.
- source_word: אֲדֹנִֽ/י
  english_pob_choice: my lord
  chosen_korean: 제 주인이시여
  alternatives_korean:
  - 제 주님
  - 제 주인이시여요
  - 제님
  lexicon: HALOT
  rationale: 이 구절에서는 신적 호칭이 아니라 환상 속 천사에게 대한 존칭으로 읽히므로, 관계와 존대가 함께 드러나는 ‘제 주인이시여’를 택했습니다. ‘주님’은 하나님/메시아 호칭으로 오해될 소지가 있어 피했습니다.
theological_decisions:
- issue: אֲדֹנִי를 하나님 호칭으로 볼지, 천사에 대한 존칭으로 볼지
  chosen_reading: 천사에게 드리는 존칭으로 보고 ‘제 주인이시여’라고 옮겼습니다.
  alternative_readings:
  - 제 주님
  - 주님
  rationale: 문맥상 즉시 앞에 나온 대상이 ‘나와 말하던 천사’이므로, כאן의 אֲדֹנִי를 하나님의 이름적 호칭으로 바꾸지 않고 존칭으로 유지하는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 호칭 구분 유지
