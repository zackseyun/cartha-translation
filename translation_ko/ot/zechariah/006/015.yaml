  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
  footnotes:
  - marker: a
    text: Or, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: '''Those who are far off'' may refer to people geographically distant, such as exiles, and may also carry a broader sense without specifying the group.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 멀리 있는 사람들이 와서 야훼의 성전을 세울 것입니다. 그러면 야훼 만군의 하나님께서 나를 여러분에게 보내셨다는 것을 여러분이 알게 될 것입니다. 그리고 여러분이 야훼 여러분의 하나님의 음성을 반드시 순종하면, 이 일이 이루어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 지리적으로 먼 사람들, 곧 포로와 같은 집단을 가리킬 수 있으며, 더 넓은 의미도 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּרְחוֹקִים
  english_pob_choice: those who are far off
  chosen_korean: 멀리 있는 사람들
  alternatives_korean:
  - 먼 데 있는 사람들
  - 멀리 떨어진 이들
  lexicon: HALOT
  rationale: 사람을 가리키는 명사적 용법을 살리면서, 지리적·상징적 거리를 모두 열어 두는 표현으로 옮겼습니다.
- source_word: וּבָנוּ בְּהֵיכַל יְהוָה
  english_pob_choice: and build in the temple of Yahweh
  chosen_korean: 야훼의 성전을 세울 것입니다
  alternatives_korean:
  - 야훼의 성전 안에서 지을 것입니다
  - 야훼의 성전을 건축할 것입니다
  lexicon: HALOT
  rationale: הֵיכָל은 이 문맥에서 성전/성소를 가리키므로 '성전'이 자연스럽고, '세우다'는 건축 행위를 현대 한국어로 간결하게 드러냅니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주님
  - 야훼 군대의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 군사적·우주적 위엄을 '만군'으로 살리되, 한국어 독자가 이해하기 쉬운 예배적 호칭인 '하나님'을 붙여 직역성과 가독성을 함께 확보했습니다.
- source_word: שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן
  english_pob_choice: if you diligently obey
  chosen_korean: 여러분이 ... 반드시 순종하면
  alternatives_korean:
  - 여러분이 ... 분명히 들으면
  - 여러분이 ... 철저히 들으면
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형 + 동사)을 단순 청취가 아니라 언약적 응답인 '순종'으로 옮기고, '반드시'로 강조를 반영했습니다.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the voice of Yahweh your God
  chosen_korean: 야훼 여러분의 하나님의 음성
  alternatives_korean:
  - 야훼 여러분의 하나님의 소리
  - 야훼, 여러분의 하나님의 목소리
  lexicon: HALOT
  rationale: '''음성''은 단순한 소리보다 권위 있는 말씀과 명령의 뉘앙스를 살려 주므로, 언약적 청종의 문맥에 맞습니다.'
theological_decisions:
- issue: ‘멀리 있는 사람들’의 범위
  chosen_reading: 지리적으로 먼 이들일 수 있고, 포로 귀환자나 더 넓은 범주를 포함할 가능성도 열어 두는 일반적 표현으로 유지했습니다.
  alternative_readings:
  - 이방인들
  - 바벨론 포로들
  rationale: 히브리어 자체가 대상을 특정하지 않으므로, 본문이 허용하는 범위보다 좁게 규정하지 않고 예언적 여지를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 마지막 조건절의 관계
  chosen_reading: 앞선 약속의 성취가 야훼의 음성에 대한 순종과 연결된 실제 조건으로 옮겼습니다.
  alternative_readings:
  - 단순한 권면적 삽입
  - 인지의 조건만을 가리키는 표현
  rationale: 문장 구조상 조건절은 약속 전체와 연결되므로, 이를 분명히 드러내되 그 정확한 신학적 범위는 본문이 말하는 만큼만 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
