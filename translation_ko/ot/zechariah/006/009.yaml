translation:
  language: ko
  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: יְהוָה; 전통적으로는 ‘the LORD’로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 예언 공식에서 ‘말씀이 ... 임하다’는 표현은 מקור의 사건 전개와 주어 전이를 자연스럽게 살리며, 영어 POB의 ‘came’에 해당하는 도착·도래의 의미를 한국어로 압축해 줍니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언자적 관용구 ‘야훼의 말씀’은 한국어 성경에서도 가장 직접적으로 대응되는 ‘말씀’이 적절하며, 단순한 정보 전달보다 권위 있는 선포를 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 표기는 전통적 대치어가 아니라 고유명사로 옮겨야 하므로, POB의 원칙대로 ‘야훼’를 사용했습니다.
- source_word: אֵלַי לֵאמֹר
  english_pob_choice: to me, saying
  chosen_korean: 내게 임하여 말씀하셨습니다
  alternatives_korean:
  - 내게 이르시며
  - 내게 말씀하여 이르시기를
  lexicon: HALOT
  rationale: ‘내게’와 ‘말씀하셨습니다’로 화자-수신자 관계를 분명히 하되, 다음 절에 이어질 인용 도입을 현대 한국어에 자연스럽게 맞췄습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 말씀의 인격적 주도성
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 말씀이 단순한 정보가 아니라 선지자에게 찾아와 발화하는 주체로 드러나게 했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말했습니다’
  - ‘야훼의 말씀이 내게 임했습니다’
  rationale: 히브리어의 예언 수식구는 하나님의 말씀 자체가 선지자에게 도래하여 발화하는 구조를 보이므로, 단순 보고문보다 인격적·계시적 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: 예언적 계시와 하나님의 말씀의 주도성
