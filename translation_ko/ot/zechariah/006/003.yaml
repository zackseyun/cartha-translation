base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
  footnotes:
  - marker: a
    text: Or, possibly, 'dappled horses—and strong ones,' taking 'strong' as a separate group rather than as a second description of the fourth chariot's horses.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 세 번째 병거에는 흰 말들이 있고, 네 번째 병거에는 얼룩지고 강한 말들이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얼룩진 말들—강한 말들’로 볼 수도 있습니다. 이 경우 ‘강한 말들’은 네 번째 병거에 속한 별도의 말 무리를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  english_pob_choice: and in the ... chariot
  chosen_korean: … 병거에는
  alternatives_korean:
  - … 병거 위에는
  - … 병거 안에는
  lexicon: HALOT
  rationale: 병거에 속한 말들의 조합을 한국어에서 자연스럽게 드러내기 위해 ‘… 병거에는’으로 옮겼습니다.
- source_word: לְבָנִים
  english_pob_choice: white
  chosen_korean: 흰
  alternatives_korean:
  - 희끗한
  - 백색의
  lexicon: HALOT
  rationale: 말의 색을 가리키는 평이하고 직접적인 표현으로 ‘흰’이 가장 자연스럽습니다.
- source_word: בְּרֻדִּים
  english_pob_choice: dappled
  chosen_korean: 얼룩진
  alternatives_korean:
  - 점박이의
  - 얼룩얼룩한
  lexicon: HALOT
  rationale: 말의 얼룩무늬를 가리키는 시각적 묘사를 현대 한국어로 무리 없이 전달하는 표현입니다.
- source_word: אֲמֻצִּים
  english_pob_choice: strong
  chosen_korean: 강한
  alternatives_korean:
  - 힘센
  - 튼튼한
  lexicon: HALOT
  rationale: 마지막 형용사는 별도의 말 무리를 가리키기보다 네 번째 병거의 말들을 추가로 수식하는 표현으로 읽혀, 간결하게 ‘강한’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 형용사 אֲמֻצִּים의 연결 방식
  chosen_reading: ‘얼룩진 말들, 강한 말들’로 두 수식을 분리해, 네 번째 병거의 말들을 연속적으로 묘사하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘얼룩진, 강한 말들’
  - ‘얼룩진 말들—강한 것들’
  rationale: 히브리어는 ‘말들’ 뒤에 두 형용사가 연속으로 붙어 있어, 한 묶음의 묘사로 읽는 것이 자연스럽습니다. 다만 마지막 항목을 별도 무리로 읽는 가능성도 배제하지 않기 위해 한국어에서는 분리된 수식으로 드러냈습니다.
  doctrine_reference: '번역 원칙 §3: 본문이 허용하는 긴장을 해소하지 말고 보존할 것'
