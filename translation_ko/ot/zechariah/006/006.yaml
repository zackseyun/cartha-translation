source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
  footnotes:
  - marker: a
    text: Or "to the land of Teman," taking תֵּימָן as the place-name Teman rather than the directional term "south."
    reason: alternative_reading
translation:
  language: ko
  text: 그 안에 있는 검은 말들은 북쪽 땅으로 나가고 있으며, 흰 말들은 그들을 따라 나갔고, 얼룩무늬 말들은 남쪽 땅으로 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “데만 땅으로.” תֵּימָן을 방향을 가리키는 “남쪽”이 아니라 지명 데만으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  english_pob_choice: in it
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그 안에 있는
  - 그 안의
  lexicon: HALOT
  rationale: 앞절의 병거를 가리키는 안의 장소 표현이므로, 관계절을 과도하게 풀지 않고 자연스러운 위치 표현으로 옮겼습니다.
- source_word: הַסּוּסִים
  english_pob_choice: horses
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 군마들
  lexicon: HALOT
  rationale: 이 환상 문맥에서 말들은 병거와 함께 이미 정해진 존재들이므로 복수형으로 자연스럽게 옮겼습니다.
- source_word: יֹצְאִים / יָצְאוּ
  english_pob_choice: are going out / have gone out
  chosen_korean: 나가고 있고 / 나갔으며
  alternatives_korean:
  - 나가고 있으며 / 나갔고
  - 나갑니다 / 나갔습니다
  lexicon: HALOT
  rationale: 진행형 분사와 완료형 동사를 구분해 환상 속 움직임의 연속성과 완료감을 함께 살렸습니다.
- source_word: אֶל אֶרֶץ צָפוֹן / אֶל אֶרֶץ הַתֵּימָן
  english_pob_choice: to the land of the north / to the land of the south
  chosen_korean: 북쪽 땅 / 남쪽 땅
  alternatives_korean:
  - 북방 땅 / 남방 땅
  - 북쪽 나라 / 남쪽 나라
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 따라 지리 방향을 직접 드러내는 표현으로 옮겼습니다. "땅"은 הארץ의 대응을 유지합니다.
- source_word: הַבְּרֻדִּים
  english_pob_choice: the dappled ones
  chosen_korean: 점박이 말들
  alternatives_korean:
  - 얼룩말들
  - 얼룩무늬 말들
  lexicon: HALOT
  rationale: 특정한 말의 털빛을 가리키므로, 한국어에서 자연스럽고 시각적인 "점박이"를 택했습니다.
theological_decisions:
- issue: תֵּימָן의 방향어/고유명사 가능성
  chosen_reading: 본문에는 남쪽 땅으로 옮기되, 고유명사 Teman의 가능성은 각주로 남깁니다.
  alternative_readings:
  - 데만
  - 테만
  rationale: 이 절은 "북쪽 땅"과 평행을 이루므로 방향어로 읽는 것이 문맥상 가장 자연스럽습니다. 다만 히브리어 תֵּימָן이 지명 Teman으로도 읽힐 수 있어 번역문에 각주로 보존했습니다.
  doctrine_reference: '번역 원칙: 문맥상 주된 의미를 따르되, 실제로 남는 모호성은 주석으로 보존합니다.'
