  source_fidelity: 아ֲשֶׁר בָּהּ는 앞절의 병거를 가리키며, 검은 말들을 한정하는 관계절입니다. 초안의 ‘그 안에서’도 출발 장소를 나타내지만, ‘그 안에 있는’이 이 수식 관계를 더 충실히 드러냅니다. 동사의 분사(검은 말)와 완료형(흰 말, 얼룩무늬 말)의 구별 및 북쪽/남쪽 땅의 병렬은 유지되어야 합니다.
  naturalness: ‘그 안에 있는 검은 말들은 … 나가고 있습니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 환상 서술의 진행성을 살립니다. ‘점박이 말들’도 자연스러우나, 원어의 얼룩지거나 반점 있는 털빛이라는 넓은 뜻을 위해 ‘얼룩무늬 말들’이 조금 더 중립적입니다.
  terminology: ‘북쪽 땅’과 ‘남쪽 땅’은 원문의 병렬과 אֶרֶץ의 의미를 적절히 반영합니다. תֵּימָן의 지명 독법은 ‘데만’으로 각주에 보존할 수 있습니다. 초안 각주의 히브리어 단어 ‘כלומר’는 한국어 문장에 부적절하게 삽입되어 있으므로 삭제해야 합니다.
