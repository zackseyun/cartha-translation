base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
  footnotes:
  - marker: a
    text: Hebrew 'crowns' (plural). Some understand this as a single composite crown and so render 'crown.'
    reason: alternative_reading
translation:
  language: ko
  text: 은과 금[a]을 가져다가 관들을 만들고, 그것들을 여호사닥의 아들 여호수아, 곧 대제사장의 머리에 씌우십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘관들’의 복수형입니다. 일부는 하나의 복합 관으로 이해하여 단수 ‘관’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: Take
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져오십시오
  - 취하십시오
  lexicon: HALOT
  rationale: 예언적 지시에서 2인칭 남성 단수 명령형처럼 기능하므로, 현대 한국어에서는 자연스러운 명령 흐름을 살려 ‘가져다가’로 옮겼습니다.
- source_word: כֶסֶף וְזָהָב
  english_pob_choice: silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은과 황금
  - 은과 금속
  lexicon: HALOT
  rationale: 원문이 특정 금속을 그대로 병렬로 제시하므로, 포괄화하지 않고 재질 자체를 직접 옮겼습니다.
- source_word: עֲטָרוֹת
  english_pob_choice: crowns
  chosen_korean: 관들
  alternatives_korean:
  - 관
  - 왕관들
  lexicon: HALOT
  rationale: 히브리어 복수형을 본문에서 살려 ‘관들’로 옮겼으며, 왕권보다 의식적 표지를 가리키는 어감에 맞춰 ‘왕관’보다 ‘관’을 택했습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: HALOT
  rationale: 이 직함은 한국어 성경에서 널리 통용되는 관용 표현이 ‘대제사장’이므로, 직분을 분명하게 전달하는 형태로 옮겼습니다.
theological_decisions:
- issue: 복수 ‘관들’과 단수적 착용 장면의 긴장
  chosen_reading: 본문에는 복수형 ‘관들’을 유지하고, 착용 행위는 그 복수 대상을 여호수아의 머리에 씌우는 것으로 그대로 반영했습니다.
  alternative_readings:
  - 해석을 따라 단수 ‘관’으로 조정하기
  - 복수성을 약화시켜 하나의 복합 관으로 이해하기
  rationale: 히브리어 형태가 복수이므로 이를 지우지 않는 것이 원문 충실성에 더 부합합니다. 해석상 단수로 볼 여지도 있지만, 본문 차원의 표지는 복수형 자체에 있습니다.
  doctrine_reference: translation philosophy §§1, 3, 5
