base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
  footnotes:
  - marker: a
    text: Or 'My cities will again spread out because of good things' or 'will again abound with good things.'
    reason: lexical_alternative
translation:
  language: ko
  text: “다시 외쳐서 말하라. 만군의 야훼께서 이렇게 말씀하십니다. ‘내 성읍들은 다시 복으로 넘칠 것이며, 야훼께서 다시 시온을 위로하시고 다시 예루살렘을 택하실 것이다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복으로 넘칠’은 ‘좋은 것들로 넘칠’ 또는 ‘풍성해질’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא לֵאמֹר
  english_pob_choice: Call out again, saying
  chosen_korean: “다시 외쳐서 말하라”
  alternatives_korean:
  - 다시 선포하라
  - 다시 외쳐 말하라
  lexicon: HALOT
  rationale: 예언적 전달 명령의 공개적·청각적 성격을 살리면서, 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 신명기적 관용구를 따르되, 본 프로젝트 기본값에 따라 신명은 ‘야훼’로, צְבָאוֹת는 ‘만군의’로 옮겼습니다.
- source_word: תְּפוּצֶינָה עָרַי מִטּוֹב
  english_pob_choice: My cities will again overflow with prosperity
  chosen_korean: ‘내 성읍들은 다시 복으로 넘칠 것이며’
  alternatives_korean:
  - 내 성읍들은 다시 좋은 것들로 풍성할 것이며
  - 내 성읍들은 다시 번영으로 가득할 것이다
  lexicon: HALOT
  rationale: תְּפוּצֶינָה는 단순한 흩어짐이 아니라 회복된 풍요의 확산을 가리키므로, ‘넘칠’로 번영의 가득 참을 자연스럽게 드러냈습니다. מִטּוֹב는 문맥상 도덕적 선이 아니라 복/번영의 뜻이어서 ‘복’으로 옮겼습니다.
- source_word: וְנִחַם ... וּבָחַר
  english_pob_choice: will again comfort Zion and again choose Jerusalem
  chosen_korean: 야훼께서 다시 시온을 위로하시고 다시 예루살렘을 택하실 것이다
  alternatives_korean:
  - 야훼께서 다시 시온을 긍휼히 여기시고 다시 예루살렘을 선택하실 것이다
  - 야훼께서 다시 시온을 위로해 주시고 다시 예루살렘을 선택하실 것이다
  lexicon: HALOT
  rationale: נחם은 회복 문맥에서 ‘위로하다/위로하시다’가 가장 직접적이며, בחר는 언약적 ‘선택’의 뉘앙스를 유지하되 한국어에서는 ‘택하다’가 짧고 분명합니다.
theological_decisions:
- issue: יהוה의 번역과 예언 공식의 어조
  chosen_reading: ‘만군의 야훼’와 직접 인용부호를 유지해, 예언자적 신탁 형식을 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - ‘주 만군의 하나님’
  - 서술형으로 풀어쓴 표현
  rationale: 본문은 야훼의 직접 발화 형식이므로, 신명과 예언 공식을 그대로 살리는 편이 본문의 권위와 호흡을 보존합니다.
  doctrine_reference: DOCTRINE.md Contested terms — יהוה/YHWH → Yahweh
