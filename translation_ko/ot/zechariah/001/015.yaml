  source_fidelity: 원문의 현재적 선언(‘나는 크게 분노하고 있다’), 안일하게 안전을 누리는 열방, 하나님의 제한된 분노와 열방이 재앙을 증폭시킨 행위의 대조를 더 직접적으로 반영해야 합니다. 초안의 ‘잠시’는 מְעָט의 가능한 기간 해석이지만, 본문에서는 정도의 제한을 우선 나타내는 ‘조금’이 더 안전합니다.
  naturalness: ‘내가 크게 분노하는 것은 … 대한 것입니다’는 현대 한국어에서 부자연스럽고 강조점도 흐려집니다. ‘나는 … 나라들에게 크게 분노하고 있습니다’가 합쇼체의 자연스러운 선언문입니다. ‘평온한 나라들’은 단순히 평화로운 상태를 뜻할 수 있어 자기만족적 안전함의 뉘앙스가 약합니다.
  terminology: הַגּוֹיִם은 문맥상 ‘나라들’로 유지할 수 있습니다. הַשַּׁאֲנַנִּים은 ‘안일하게 지내는’으로 옮겨 안전하다고 여기며 느긋한 상태를 드러냈습니다. עָזְרוּ לְרָעָה는 재앙을 증폭시킨 뜻으로 ‘재앙을 더욱 키웠습니다’로 번역하되, 직역적 표현은 각주에 남깁니다.
