reference: Zechariah 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קֶ֤צֶף גָּדוֹל֙ אֲנִ֣י קֹצֵ֔ף עַל הַ/גּוֹיִ֖ם הַ/שַּֽׁאֲנַנִּ֑ים אֲשֶׁ֤ר אֲנִי֙ קָצַ֣פְתִּי מְּעָ֔ט וְ/הֵ֖מָּה עָזְר֥וּ לְ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
  footnotes:
  - marker: a
    text: Or 'with great wrath' for 'exceedingly angry.'
    reason: lexical_alternative
  - marker: b
    text: Or 'complacent' for 'at ease.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I was angry for a little while'; the Hebrew may be understood as limited duration, though 'only a little angry' better fits the contrast here.
    reason: alternative_reading
  - marker: d
    text: Literally 'they helped toward evil,' that is, they intensified the calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 크게 분노하는 것은 평온한 나라들에 대한 것입니다. 내가 잠시 분노하였을 뿐인데, 그들은 오히려 재앙을 더하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘매우/크게 분노하다’의 강도를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평온한’은 ‘안일하고 안전하다고 여기는’ 뉘앙스를 비교적 직접적으로 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘잠시’는 분노의 짧은 기간과 제한된 정도를 함께 암시합니다.
    reason: alternative_reading
  - marker: d
    text: 직역하면 ‘악을 향해 도왔다’는 뜻으로, 재앙을 더 크게 만든다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל / קֹצֵף
  english_pob_choice: exceedingly angry / am ... angry
  chosen_korean: 크게 분노하는 것
  alternatives_korean:
  - 몹시 분노하는 것
  - 크게 노하는 것
  - 격렬하게 분노하는 것
  lexicon: HALOT
  rationale: קֶצֶף גָּדוֹל의 강한 분노를 한국어에서 자연스럽게 살리기 위해 형용사적 표현보다 동사구를 써서 강도를 전달했습니다.
- source_word: הַגּוֹיִם הַשַּׁאֲנַנִּים
  english_pob_choice: the nations that are at ease
  chosen_korean: 평온한 나라들
  alternatives_korean:
  - 안일한 나라들
  - 평안한 나라들
  - 스스로 편안히 지내는 나라들
  lexicon: HALOT
  rationale: שַּׁאֲנַנִּים은 단순한 심리 상태보다 안전하다고 느끼며 안주하는 뉘앙스를 가지므로, 과도하게 해석하지 않으면서도 문맥상 ‘at ease’의 감각을 살렸습니다.
- source_word: קָצַפְתִּי מְּעָט
  english_pob_choice: I was only a little angry
  chosen_korean: 내가 잠시 분노하였을 뿐인데
  alternatives_korean:
  - 내가 조금만 분노하였을 뿐인데
  - 내가 잠깐 분노하였을 뿐인데
  - 내가 겨우 분노하였을 뿐인데
  lexicon: HALOT
  rationale: מְּעָט은 여기서 분노의 정도와 기간이 겹치지만, 한국어에서는 ‘잠시’가 제한된 분노의 성격을 가장 자연스럽게 드러냅니다.
- source_word: עָזְרוּ לְרָעָה
  english_pob_choice: helped forward the disaster
  chosen_korean: 재앙을 더하였습니다
  alternatives_korean:
  - 재앙을 부추겼습니다
  - 재난을 더했습니다
  - 악을 돕는 데 가담하였습니다
  lexicon: HALOT
  rationale: 직역하면 ‘악을 향해 도왔다’이지만, 문맥상 하나님의 제한된 징계를 넘어 재난을 증폭시킨 뜻이므로 한국어에서는 결과를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 분노와 열방의 과도한 개입
  chosen_reading: 하나님의 분노는 ‘잠시’로 제한되었으나, 열방은 그 경계를 넘어서 재앙을 더한 것으로 옮겼습니다.
  alternative_readings:
  - 열방이 단지 하나님의 심판을 집행한 것으로 읽는 해석
  - ‘잠시’보다 ‘조금’이라는 정도의 제한만 강조하는 해석
  rationale: 대조 구조가 하나님의 제한된 분노와 열방의 과잉 행위를 대비하므로, 번역도 그 긴장을 그대로 유지해야 합니다.
  doctrine_reference: Translation philosophy §3
