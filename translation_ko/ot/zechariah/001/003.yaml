id: ZEC.1.3
reference: Zechariah 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
  footnotes:
  - marker: a
    text: Or 'Turn to me ... and I will turn to you.' The Hebrew uses the same verb in both clauses, emphasizing reciprocal restoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 말하십시오. “만군의 야훼께서 이렇게 말씀하십니다. ‘내게로 돌아오너라.’ 만군의 야훼의 말씀입니다. ‘그러면 내가 너희에게 돌아가겠습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게로 돌이키라 … 내가 너희에게로 돌이키겠다.’ 히브리어는 두 절에서 같은 동사를 사용하여 서로 대응하는 회복을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: Therefore say
  chosen_korean: 그러므로 말하십시오
  alternatives_korean:
  - 그리고 말하십시오
  - 그러니 말하십시오
  lexicon: HALOT
  rationale: 앞절의 심판 선언과 연결되는 접속을 한국어에서 자연스럽게 드러내기 위해 ‘그러므로’를 택했고, 직설적 예언 명령으로서의 명령형은 공손한 합쇼체 ‘말하십시오’로 옮겼습니다.
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 군대의 야훼
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת는 통상 ‘만군’으로 옮기는 것이 가장 널리 이해되며, POB의 ‘Yahweh’를 그대로 반영해 개인명과 호칭을 분리하지 않고 ‘만군의 야훼’로 유지했습니다.
- source_word: שׁוּבוּ אֵלַי
  english_pob_choice: Return to me
  chosen_korean: 내게로 돌아오너라
  alternatives_korean:
  - 내게로 돌이키너라
  - 내게로 돌아오라
  lexicon: HALOT
  rationale: שׁוּב의 반복을 살리면서도 회개 촉구의 관계적 뉘앙스를 유지하기 위해 ‘돌아오다’를 기본으로 했고, 직접 화자의 부름이므로 인용문 안에서는 반말 명령형이 가장 자연스럽습니다.
- source_word: וְאָשׁוּב אֲלֵיכֶם
  english_pob_choice: and I will return to you
  chosen_korean: 그러면 내가 너희에게 돌아가겠습니다
  alternatives_korean:
  - 그러면 내가 너희에게로 돌아오겠습니다
  - 그러면 내가 너희에게 돌이키겠습니다
  lexicon: HALOT
  rationale: 히브리어의 동일 어근 반복을 한국어에서도 살리기 위해 ‘돌아가겠습니다’를 선택했으며, 하나님께 대한 직접 화법 안에서는 존대 표현으로 옮겨 예언 인용의 문체를 보존했습니다.
theological_decisions:
- issue: 반복 동사 שׁוּב의 신학적 대칭성
  chosen_reading: ‘돌아오다 / 돌아가겠습니다’로 같은 어근의 상호성을 드러냈습니다.
  alternative_readings:
  - ‘돌이키다 / 돌이키겠습니다’로 통일
  - ‘돌아오다 / 돌아오겠습니다’로 통일
  rationale: 본문은 인간의 회심과 하나님의 응답을 같은 동사로 묶어 언약적 회복의 대칭을 형성하므로, 한국어에서도 동일한 방향성 어휘를 유지해 그 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5 (consistency of key terms)'
