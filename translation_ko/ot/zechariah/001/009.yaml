source:
  edition: WLC
  text: וָ/אֹמַ֖ר מָה אֵ֣לֶּה אֲדֹנִ֑/י וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י אֲנִ֥י אַרְאֶ֖/ךָּ מָה הֵ֥מָּה אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
  footnotes:
  - marker: a
    text: Or 'sir' for 'my lord'; the Hebrew אֲדֹנִי is a respectful form of address here, not the divine name.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the angel who was speaking in me'; the Hebrew expression is idiomatic for speaking with or to the prophet in this vision context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 말했습니다. “이것들이 무엇입니까, 내 주인님?” 그때 내게 말하던 천사가 내게 말했습니다. “내가 네게 이것들이 무엇인지 보여 주겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 주인님’은 여기서 하나님의 이름이 아니라, 상대에 대한 존칭적 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내게 말하던’은 히브리어의 직역적 ‘내 안에서’보다, 환상 속에서 예언자와 대화하는 뜻을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그러자 내가 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그때 내가 말했습니다
  lexicon: WLC/이야기 진행
  rationale: 웨이욜 계열의 서술 진행을 자연스러운 한국어 순서 전환으로 옮기되, 단순 병렬 ‘그리고’보다 다음 장면으로 넘어감을 분명히 했습니다.
- source_word: מָה אֵלֶּה
  english_pob_choice: What are these
  chosen_korean: 이것들이 무엇입니까
  alternatives_korean:
  - 이것들은 무엇입니까
  - 이것들은 무엇들입니까
  lexicon: WLC
  rationale: 히브리어의 식별 질문을 한국어 어순에 맞게 옮겼고, ‘이것들’로 지시 대상을 유지했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인님
  alternatives_korean:
  - 나의 주님
  - 선생님
  - 나으신 주인님
  lexicon: HALOT
  rationale: 이 표현은 하나님의 이름이 아니라 존칭적 호칭이므로, 예배적 ‘주님’보다 인물에게 하는 공손한 호칭을 택했습니다. ‘내 주인님’은 관계의 존대와 원문의 호칭성을 함께 살립니다.
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 내게 말하던 천사가
  alternatives_korean:
  - 나와 말하던 천사가
  - 내 안에서 말하던 천사가
  lexicon: HALOT
  rationale: ‘בִּי’를 직역한 ‘내 안에서’는 문맥상 부자연스럽고 내적 영감처럼 오해될 수 있어, 예언자와 대화하는 뜻을 살려 ‘내게 말하던’으로 옮겼습니다.
- source_word: אֲנִי אַרְאֶךָּ
  english_pob_choice: I will show you
  chosen_korean: 내가 네게 … 보여 주겠습니다
  alternatives_korean:
  - 내가 너에게 … 보이겠습니다
  - 내가 네게 … 보여 줄 것입니다
  lexicon: HALOT
  rationale: 히필 אַרְאֶךָּ의 ‘보이게 하다/보여 주다’의 뜻을 살려 자연스러운 공손한 미래형으로 옮겼습니다. 주어 ‘내가’는 원문의 강조를 반영합니다.
theological_decisions:
- issue: אֲדֹנִי의 신적 호칭 여부
  chosen_reading: 이 호칭은 천사에게 드리는 공손한 인사로 보고 ‘내 주인님’으로 번역했습니다.
  alternative_readings:
  - 나의 주님
  - 주여
  rationale: 문맥상 이는 여호와께 드리는 고백이 아니라 해석 천사와의 대화입니다. 따라서 신적 칭호로 오해되지 않도록 인물 존칭을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 번역 철학 §1, §3
