  lexicon: HALOT
  rationale: 이 표현은 하나님의 이름이 아니라 존칭적 호칭이므로, 예배적 ‘주님’보다 인물에게 하는 공손한 호칭을 택했습니다. ‘내 주인님’은 관계의 존대와 원문의 호칭성을 함께 살립니다.
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 내게 말하던 천사가
  alternatives_korean:
