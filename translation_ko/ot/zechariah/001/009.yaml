  - 내 안에서 말하던 천사가
  lexicon: HALOT
  rationale: ‘בִּי’를 직역한 ‘내 안에서’는 문맥상 부자연스럽고 내적 영감처럼 오해될 수 있어, 예언자와 대화하는 뜻을 살려 ‘내게 말하던’으로 옮겼습니다.
- source_word: אֲנִי אַרְאֶךָּ
