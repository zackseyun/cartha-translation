    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들은
  alternatives_korean:
  - 너희 아버지들은
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘너희 아버지들’이지만, 이 문맥에서는 세대를 가리키는 집단명으로 쓰이므로 한국어에서는 자연스럽고 오해가 적은 ‘조상들’로 옮겼습니다. 영어 POB의 각주가 허용하는 대안 의미를 반영한 선택입니다.
- source_word: אַיֵּה הֵם
  english_pob_choice: where are they?
  chosen_korean: 어디에 있느냐?
  alternatives_korean:
  - 그들이 어디 있느냐?
  - 어디에 있습니까?
  lexicon: HALOT
  rationale: 히브리어의 물음은 위치를 묻는 간명한 수사 의문이므로, 한국어에서도 동사를 보충해 자연스럽게 ‘어디에 있느냐?’로 표현했습니다. 원문의 날카로운 대조를 살리기 위해 존댓말을 높이지 않고 인용문 안에서는 중립적 어조를 유지했습니다.
- source_word: וְהַנְּבִאִים
  english_pob_choice: And the prophets
  chosen_korean: 그리고 예언자들은
  alternatives_korean:
  - 그리고 선지자들은
  lexicon: HALOT
  rationale: 히브리어의 일반 명사 ‘예언자들’을 그대로 살렸습니다. 전통 교회어인 ‘선지자들’도 가능하지만, 본문이 말하는 직업/역할 명칭을 더 직접적으로 드러내는 ‘예언자들’이 원문에 가깝습니다.
- source_word: הַלְעוֹלָם יִחְיוּ
  english_pob_choice: do they live forever?
  chosen_korean: 영원히 사느냐?
  alternatives_korean:
  - 영원히 살 수 있느냐?
  - 영원히 살겠느냐?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문은 ‘그들이 영원히 사느냐?’라는 현재적 일반 진술에 가깝습니다. 한국어에서는 간결하게 ‘영원히 사느냐?’로 옮겨, 죽지 않는 존재가 아님을 묻는 본문의 힘을 보존했습니다.
theological_decisions:
- issue: 예언자들의 역할과 죽음의 대비
  chosen_reading: 이 절은 조상들과 예언자들 모두가 죽는 존재임을 묻는 수사 의문으로, 예언자의 말씀이 실패했거나 끝났다는 뜻은 아닙니다.
  alternative_readings:
  - 예언자들을 단지 과거에 살았던 인물로만 언급하는 중립적 비교로 읽을 수 있습니다.
  rationale: 히브리어 질문은 ‘영원히 사느냐?’로 끝나므로 초점은 인간의 유한성에 있습니다. 다음 절이 하나님의 말씀이 지속됨을 드러내지만, 이 절 자체에 그 결론을 미리 넣지 않는 편이 원문 긴장을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 수사 의문은 문맥의 다음 절로 이어지는 대비를 예비함.
