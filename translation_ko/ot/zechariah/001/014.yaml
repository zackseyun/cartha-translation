  source_fidelity: 히브리어의 화자 전환, 천사의 선포 명령, ‘만군의 야훼’라는 신탁 공식, 그리고 קנא/קנאה의 동족어 반복에 따른 강한 강조를 전반적으로 잘 반영했습니다. 다만 각주가 현재 ‘내게 말했습니다’에 붙어 있으면서 내용은 ‘질투’ 표현의 대안을 설명하므로, 해당 어휘에 앵커를 옮겨야 합니다.
  naturalness: ‘선포하여 말하라’는 명령문 자체는 이해되지만, 요청된 현대 합쇼체에 맞추어 ‘선포하여 말하십시오’가 더 일관되고 자연스럽습니다. ‘크게 질투합니다’는 한국어에서도 가능한 표현이며, 본문의 의도적인 긴장을 보존합니다.
  terminology: ‘야훼’와 ‘만군의’는 제시된 프로젝트 방침 및 원문의 호칭을 충실히 따릅니다. ‘질투’는 하나님의 언약적 열심을 완화하지 않는 적절한 선택입니다. 각주는 ‘열심’ 대안을 보존하되, 원문의 반복 강조를 더 정확히 밝혀야 합니다.
