  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
  footnotes:
  - marker: a
    text: Or, “I am zealous for Jerusalem and for Zion with great zeal.” The Hebrew uses the same root twice for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나와 말하던 천사가 내게 말했습니다. “선포하여 말하십시오. ‘만군의 야훼께서 이렇게 말씀하십니다. 나는 예루살렘과 시온을 위하여 크게 질투합니다[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 예루살렘과 시온을 위하여 큰 열심으로 열심을 냅니다.” 히브리어는 같은 어근을 두 번 사용하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 나와 말하던 천사
  alternatives_korean:
  - 내 안에서 말하던 천사
  - 내게 말하던 천사
  lexicon: HALOT
  rationale: בִּי는 문맥상 내면에서가 아니라 ‘나와/내게’ 대화하는 뜻이므로, ‘말하던 천사’로 자연스럽게 살리되 관계를 분명히 했습니다.
- source_word: קְרָא לֵאמֹר
  english_pob_choice: Proclaim, saying
  chosen_korean: 선포하여 말하라
  alternatives_korean:
  - 외쳐 말하라
  - 소리쳐 말하라
  lexicon: HALOT
  rationale: 예언자적 전달 명령의 공적·선포적 힘을 살리기 위해 ‘선포하다’를 택했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 기본 원칙에 따라 יְהוָה는 ‘야훼’로 옮기고, צְבָאוֹת는 군사적·우주적 이미지를 보존하는 ‘만군의’로 옮겼습니다.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  english_pob_choice: I am exceedingly jealous ... with great jealousy
  chosen_korean: 크게 질투합니다
  alternatives_korean:
  - 크게 열심을 냅니다
  - 큰 질투로 질투합니다
  lexicon: HALOT
  rationale: 하나님의 언약적 열심을 완화하지 않기 위해 ‘질투’의 직접성을 유지했고, 중복 어근의 강조는 부사 ‘크게’로 간결하게 반영했습니다.
theological_decisions:
- issue: 하나님의 קנא/קנאה를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘크게 질투합니다’로 직역성을 유지해 언약적 질투의 긴장을 보존했습니다.
  alternative_readings:
  - ‘크게 열심을 내십니다’
  - ‘큰 열정으로 돌보십니다’
  rationale: 본문은 단순한 열정이 아니라 예루살렘과 시온을 향한 언약적 배타성과 보호의 감정을 드러내므로, 완화된 표현보다 ‘질투’가 स्रोत의 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
