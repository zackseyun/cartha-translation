  - 여러분의 선조들
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘여러분의 아버지들’이지만, 예언서 문맥에서 후대 조상 전체를 가리키므로 한국어에서는 의미를 분명히 하는 ‘조상들’을 택했습니다.
