  lexicon: HALOT
  rationale: 동사와 동족 명사가 겹쳐 쓰인 강조 구조를 한국어에서는 ‘크게 진노하셨습니다’로 자연스럽게 살려, 단순한 감정보다 강한 분노의 중첩을 반영했습니다.
