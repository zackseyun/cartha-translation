  rationale: 분노의 대상 표지로 쓰인 전치사는 한국어에서 ‘~에게’가 가장 자연스럽고, 관계를 덜 해치면서도 방향성을 드러냅니다.
- source_word: אֲבֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 여러분의 조상들
