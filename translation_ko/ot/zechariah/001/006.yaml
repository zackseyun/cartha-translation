  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
  footnotes:
  - marker: a
    text: Or 'Then they repented and said.' The Hebrew verb can mean 'turned back/returned' or, in context, 'repented.'
    reason: alternative_reading
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'which I commanded through my servants the prophets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 말과 내 규례들—내가 내 종인 예언자들에게 명령한 것들이—너희 조상들을 따라잡지 않았습니까? 그러자 그들은 돌아서서 말했습니다. “만군의 야훼께서 우리에게 하려고 계획하신 대로, 우리의 길과 우리의 행위에 따라 우리에게 행하셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 회개하고 말했습니다.’ 히브리어 동사는 ‘돌아가다/되돌아가다’ 또는 문맥상 ‘회개하다’를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 원문은 ‘야훼 만군’을 뜻합니다. 전통 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞선 문맥과의 대조를 자연스럽게 살리면서도, 예언자적 질책의 전환을 분명하게 드러내는 표준적인 역접 표현입니다.
- source_word: דְּבָרַי וְחֻקַּי
  english_pob_choice: my words and my statutes
  chosen_korean: 내 말과 내 규례들
  alternatives_korean:
  - 내 말씀과 내 법도들
  - 내 말과 내 법규들
  lexicon: HALOT
  rationale: דְּבָרַי의 직접적 발화성을 ‘말’로, חֻקַּי의 제정된 규범성을 ‘규례들’로 나누어 두 용어의 차이를 살렸습니다.
- source_word: עֲבָדַי הַנְּבִיאִים
  english_pob_choice: my servants the prophets
  chosen_korean: 내 종인 예언자들
  alternatives_korean:
  - 내 종들인 예언자들
  - 내 종 예언자들
  lexicon: HALOT
  rationale: עֲבָדַי는 예언자들의 소속과 부름을 드러내는 표현이므로 ‘종’으로 옮기되, 한국어에서 가장 자연스러운 수식을 위해 ‘인’을 넣었습니다.
- source_word: הִשִּׂיגוּ
  english_pob_choice: overtake
  chosen_korean: 따라잡지 않았습니까
  alternatives_korean:
  - 붙잡지 않았습니까
  - 미치지 않았습니까
  lexicon: HALOT
  rationale: 심판이 조상들을 추격해 이르는 이미지를 현대 한국어에서 가장 분명하게 전달하는 동사로 선택했습니다.
- source_word: וַיָּשׁוּבוּ
  english_pob_choice: Then they turned back
  chosen_korean: 그러자 그들은 돌아서서
  alternatives_korean:
  - 그러자 그들은 돌아와서
  - 그러자 그들은 회개하고
  lexicon: HALOT
  rationale: 이 동사는 ‘돌아오다/되돌아가다’와 ‘회개하다’ 모두 가능하지만, 본문이 직접 말하는 최소 의미를 유지하기 위해 ‘돌아서다’로 두었습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  lexicon: HALOT
  rationale: 정본 원문에 따라 신명은 ‘야훼’로, צְבָאוֹת은 군사적/우주적 위엄을 살려 ‘만군’으로 옮겼습니다.
- source_word: כִּדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  english_pob_choice: according to our ways and according to our deeds
  chosen_korean: 우리의 길과 우리의 행위에 따라
  alternatives_korean:
  - 우리의 방식과 우리의 행실에 따라
  - 우리의 행로와 우리의 행동에 따라
  lexicon: HALOT
  rationale: ‘길’과 ‘행위’는 히브리어의 도덕적 삶의 전면을 한국어 성경문체로 간결하게 전달합니다.
theological_decisions:
- issue: וַיָּשׁוּבוּ의 의미를 ‘회개’로 명시할지 여부
  chosen_reading: ‘돌아서서’로 유지하여 귀납적으로만 열어 둠
  alternative_readings:
  - 회개하고
  - 돌아왔습니다
  rationale: 문맥상 반응은 분명하지만, 본문 자체는 내적 회심을 명시하지 않으므로 회개의 신학을 과잉 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
