revisions:
- from: 그러나 내 말과 내 규례들—내가 내 종인 예언자들에게 명령한 것들이—너희 조상들을 따라잡지 않았습니까? 그러자 그들은 돌아서서 말했습니다. “만군의 야훼께서 우리에게 하려고 계획하신 대로, 우리의 길과 우리의 행위에 따라 우리에게 행하셨습니다.”[a][b]
  to: 그러나 내가 내 종들인 예언자들에게 명령한 내 말과 내 규례들이 너희 조상들을 따라잡지 않았습니까?[c] 그러자 그들은 돌이켜[a] 말했습니다. “만군의 야훼[b]께서 우리에게 행하시기로 계획하신 대로, 우리의 길과 우리의 행위에 따라, 그렇게 우리에게 행하셨습니다.”
  rationale: 명령을 받은 예언자들의 복수형을 반영하고, ‘돌이켜’의 의미상 열림을 유지했습니다. 각주를 해당 본문 요소에 직접 연결했으며, 영어 POB 감사 기록에 있는 ‘예언자들을 통하여’라는 해석적 대안을 보존했습니다. 인용문의 동사 표현은 원문의 ‘우리에게 행하시기로 계획하신’과 그 결과 ‘우리에게 행하셨습니다’를 자연스러운 합쇼체로 재구성했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:44Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים는 하나님이 예언자들에게 명령하셨다는 구문이므로, ‘내 종인 예언자들에게 명령한 것들’보다 복수의 예언자와 명령의 수여 대상을 더 분명히 드러내는 표현이 적절합니다. 또한 וַיָּשׁוּבוּ는 ‘돌이켜’로 옮겨 회개/귀환 어느 쪽도 확정하지 않았습니다.
  naturalness: ‘돌아서서’는 물리적으로 몸을 돌리는 뜻이 강하여 이 문맥에서는 다소 부자연스럽습니다. ‘돌이켜 말했습니다’가 현대 한국어의 격식 있는 성경 문체에서 자연스럽고, 원문의 의미 범위도 잘 보존합니다. 인용문의 ‘우리에게 하려고 계획하신’도 ‘우리에게 행하시기로 계획하신’으로 다듬는 편이 자연스럽고 원문의 לַעֲשׂוֹת לָנוּ를 더 정확히 반영합니다.
  terminology: ‘만군의 야훼’는 יְהוָה צְבָאוֹת의 명칭을 일관되게 옮긴 표현으로 적절합니다. ‘말’과 ‘규례들’도 두 히브리어 명사를 구별합니다. ‘내 종들인 예언자들’로 복수형을 반영했습니다.
  issues:
  - severity: medium
    issue: ‘내 종인 예언자들에게’가 복수 예언자들을 단수 ‘종’으로 수식합니다.
    rationale: עֲבָדַי הַנְּבִיאִים는 ‘나의 종들인 예언자들’로, 양쪽 모두 복수입니다.
  - severity: medium
    issue: 와야슈부(וַיָּשׁוּבוּ) 대안 각주가 본문의 해당 동사에 붙어 있지 않습니다.
    rationale: 각주 a는 ‘돌이켜’의 대안 의미를 설명하므로 그 단어 바로 뒤에 배치해야 합니다.
  - severity: medium
    issue: 영어 POB 감사 기록의 ‘예언자들을 통하여’라는 대안 독법 각주가 한국어 초안에는 빠져 있습니다.
    rationale: 주절은 직접 목적어 구문을 보존하되, ‘통하여’라는 해석적 대안을 해당 구문에 각주로 보존하는 것이 감사 기록 및 번역 원칙에 부합합니다.
  - severity: low
    issue: ‘돌아서서’와 ‘우리에게 하려고 계획하신’은 이 문맥에서 다소 구어적이거나 물리적 의미가 두드러집니다.
    rationale: ‘돌이켜’와 ‘우리에게 행하시기로 계획하신’이 격식 있는 현대 한국어이면서 원문의 문맥을 더 정확히 전달합니다.
