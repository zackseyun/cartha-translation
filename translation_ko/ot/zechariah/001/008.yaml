  source_fidelity: 현 초안은 בַּמְּצֻלָה(낮고 깊은 곳, 골짜기/움푹한 곳)를 ‘곧바로’로 옮겨 핵심 공간 정보를 누락·변질했습니다. 또한 הֲדַסִּים는 도금향나무가 아니라 도금양나무(머틀)이며, אִישׁ의 남성 지시도 ‘한 남자’로 보존하는 편이 적절합니다. 수정문은 원문의 환시 도입, 붉은 말을 탄 남자, 도금양나무들 사이의 위치, 그리고 뒤따르는 세 색의 말들을 보존합니다.
  naturalness: ‘내가 밤에 보았는데, 보라’는 환시 장면의 전환을 자연스럽게 살리며, ‘골짜기에 있는 도금양나무들 사이’와 ‘그의 뒤에는 … 있었습니다’는 현대 한국어 합쇼체 문장으로 무리 없이 읽힙니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
