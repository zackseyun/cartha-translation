source:
  edition: WLC
  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
  footnotes:
  - marker: a
    text: Or 'in the depths' or 'in the hollow'; the Hebrew likely refers to a low-lying place or depression.
    reason: lexical_alternative
  - marker: b
    text: Or 'dappled,' 'speckled,' or possibly another reddish-brown horse color.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 밤에 보았는데, 보라, 붉은 말을 탄 한 남자가 있었습니다. 그는 골짜기[a]에 있는 도금양나무들 사이에 서 있었고, 그의 뒤에는 붉은 말들과 적갈색[b] 말들과 흰 말들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊은 곳에’ 또는 ‘움푹한 곳에’로 옮길 수 있습니다. 히브리어는 낮고 깊게 패인 곳을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘얼룩진’, ‘점박이’, 혹은 다른 붉은 갈색 계열의 말색으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  english_pob_choice: I saw in the night
  chosen_korean: 내가 밤에 보니
  alternatives_korean:
  - 내가 밤중에 보니
  - 내가 밤에 보았습니다
  lexicon: HALOT
  rationale: ראה의 단순한 ‘보다’와 야간 장면을 함께 살리되, 한국어에서는 ‘보니’가 환시 도입의 생생함을 자연스럽게 전달합니다.
- source_word: אִישׁ רֹכֵב עַל סוּס אָדֹם
  english_pob_choice: a man riding on a red horse
  chosen_korean: 붉은 말 하나를 탄 한 사람이
  alternatives_korean:
  - 붉은 말을 타고 있는 한 사람
  - 붉은 말을 탄 남자
  lexicon: HALOT
  rationale: אישׁ을 성별이 드러나는 ‘한 사람’으로 옮기고, רֹכֵב עַל을 자연스럽게 ‘~을 탄’으로 처리해 장면성을 유지했습니다.
- source_word: בֵּין הַהֲדַסִּים
  english_pob_choice: among the myrtle trees
  chosen_korean: 도금향나무들 사이
  alternatives_korean:
  - 몰약나무들 사이
  - 머틀나무들 사이
  lexicon: HALOT
  rationale: הֲדַסִּים는 한국어 성경에서 통용되는 식물명보다 현대 독자가 이해하기 쉬운 식물명을 택하되, 원문의 ‘사이’라는 공간 관계를 보존했습니다.
- source_word: בַּמְּצֻלָה
  english_pob_choice: in the ravine
  chosen_korean: 곧바로
  alternatives_korean:
  - 골짜기에
  - 깊은 곳에
  - 협곡에
  lexicon: HALOT
  rationale: 본문의 초점이 지형의 정밀한 지명보다 ‘myrtle trees’가 있는 낮은 장소를 가리키는 데 있다고 보고, POB의 주해를 반영해 장면 안에서의 위치를 간결하게 옮겼습니다.
- source_word: וְאַחֲרָי/ו סוּסִים אֲדֻמִּים שְׂרֻקִּים וּלְבָנִים
  english_pob_choice: and behind him were red, sorrel, and white horses
  chosen_korean: 그 뒤에는 붉은 말들과 얼룩말들, 그리고 흰 말들이 있었습니다
  alternatives_korean:
  - 그 뒤에는 붉은 말들과 사철말들과 흰 말들이 있었습니다
  - 그 뒤에는 붉은 말들과 점박이 말들과 흰 말들이 있었습니다
  lexicon: HALOT
  rationale: שְׂרֻקִּים는 색조가 불확실해 POB처럼 해석 여지를 남겨야 하므로, 본문 흐름에 맞는 ‘얼룩말들’을 택하되 다른 가능한 색채 해석을 유지합니다.
theological_decisions:
- issue: 밤의 환시 도입과 이어지는 ‘보라’의 기능
  chosen_reading: ‘내가 밤에 보니, 보라’로 옮겨 환시 서술의 급작스러운 전환을 살렸습니다.
  alternative_readings:
  - ‘밤에 나는 보았습니다’
  - ‘그 밤에 내가 보니’
  rationale: 히브리어의 서술적 전환어 וְהִנֵּה를 평면적으로 만들지 않고, 시각적·서사적 긴박감을 드러내는 표현을 유지하는 것이 본문의 의도에 가깝습니다.
  doctrine_reference: 서사 구조 보존
- issue: 말 탄 ‘한 사람’의 정체를 특정하지 않음
  chosen_reading: 본문이 말하는 그대로 ‘한 사람’으로 두고, 천사나 메시아적 존재로 단정하지 않았습니다.
  alternative_readings:
  - 여호와의 천사
  - 상징적 기수
  - 그리스도의 현현
  rationale: 본문 자체는 그 인물을 단순히 אִישׁ으로 소개하므로, 후속 문맥이 주는 가능성은 남기되 번역이 신학적 동일시를 앞서가면 안 됩니다.
  doctrine_reference: 본문의 긴장 보존
