  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 제목이 아니라 고유명으로 드러내기 위해 프로젝트 기본값대로 '야훼'를 사용했습니다.
- source_word: בֶּן בֶּרֶכְיָ֔ה בֶּן עִדּ֥וֹ
  english_pob_choice: son of Berechiah, son of Iddo
  chosen_korean: 베레갸의 아들, 잇도의 아들
  alternatives_korean:
  - 베레기야의 아들, 잇도의 아들
  - 베레갸의 아들, 잇도의 손자
  lexicon: HALOT
  rationale: 히브리어 족보식을 그대로 반영해 '아들'을 반복했으며, 고유명은 한국어 음역 관례에 맞춰 옮겼습니다.
- source_word: הַ/נָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 선지자
  alternatives_korean:
