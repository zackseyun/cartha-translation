  lexicon: HALOT
  rationale: 이 문맥에서는 직함이므로 자연스러운 한국어 성경 문체를 따르되, 이후 문맥과 맞는 직능 표지를 유지했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 본문에서 '야훼'로 직접 표기합니다.
  alternative_readings:
