  - 다리오 왕의 이년째에
  lexicon: HALOT
  rationale: 왕의 즉위 연대를 나타내는 관용적 표현이므로 한국어에서도 '제2년'으로 자연스럽게 옮겼습니다.
- source_word: הָיָ֣ה דְבַר יְהוָ֗ה
  english_pob_choice: the word of Yahweh came
  chosen_korean: 야훼의 말씀이
