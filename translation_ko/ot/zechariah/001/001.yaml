  rationale: 문맥상 예언 개시의 주체가 언약의 고유명으로 드러나므로, 대체 칭호인 '주'보다 신명사의 직접 표기가 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
