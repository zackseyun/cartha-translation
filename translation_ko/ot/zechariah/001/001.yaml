  terminology: ‘야훼’는 원문의 신명사 יהוה를 직접 옮긴 것으로 적절합니다. ‘선지자’ 대신 현대적이고 중립적인 ‘예언자’를 사용했습니다. 베레갸, 잇도, 스가랴의 표기는 한국어 성경의 널리 쓰이는 이름 형태로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘다리오 왕’의 ‘왕’이 원문에 없습니다.
    rationale: 원문은 단지 ‘다리오의 제이 년’이라는 재위 연도 표기입니다. 다리오가 왕이라는 역사적 사실을 본문에 보충하지 않고 원문의 표현을 유지하는 것이 좋습니다.
  - severity: medium
    issue: 문장 끝의 ‘임하여 말씀하셨습니다’가 계시 공식과 발화 도입을 불명확하게 만듭니다.
    rationale: הָיָה דְבַר־יהוה ... לֵאמֹר는 ‘야훼의 말씀이 ...에게 임했다, 이르시되/말씀하시기를’이라는 예언서 공식입니다. 한국어에서는 ‘말씀이 ... 임했습니다. 말씀은 이러했습니다:’처럼 분리하면 주체와 다음 절로 이어지는 인용 도입이 분명합니다.
