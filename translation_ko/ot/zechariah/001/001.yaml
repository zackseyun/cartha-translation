  rationale: 예언 서두의 공식 표현을 살리기 위해 '말씀이 … 임하여' 구조를 사용했고, 이어지는 동사를 통해 선지자에게 임한 계시의 개시를 드러냈습니다.
- source_word: יְהוָה
