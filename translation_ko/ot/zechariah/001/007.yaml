base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the month Shebat''; alternatively transliterated ''Shevat.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Yahweh' for 'the LORD' (Hebrew יְהוָה).
    reason: alternative_reading
translation:
  language: ko
  text: 다리오 제2년 열한째 달, 곧 스밧월[a] 이십사일에 야훼[b]의 말씀이 베레갸의 아들이며 예언자 잇도의 손자인 스가랴에게 임했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스밧’은 히브리어 שְׁבָט의 음역입니다. ‘셰밧’ 또는 ‘셰바트’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 히브리어 יְהוָה를 음역한 표기입니다.
    reason: theological_note
lexical_decisions:
