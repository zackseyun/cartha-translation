  - 열한 달
  lexicon: HALOT
  rationale: 수사적 월 표시는 한국어에서도 서수 표현인 '열한째'가 가장 분명하며, 달력 문맥을 그대로 살립니다.
- source_word: הוּא חֹדֶשׁ שְׁבָט
  english_pob_choice: (that is, the month Shebat)
  chosen_korean: 곧 셰밧월
  alternatives_korean:
