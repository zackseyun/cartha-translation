base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the month Shebat''; alternatively transliterated ''Shevat.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Yahweh' for 'the LORD' (Hebrew יְהוָה).
    reason: alternative_reading
translation:
  language: ko
  text: 다리오의 제이년, 곧 열한째 달인 셰밧월 이십사일에 야훼의 말씀이 베레갸의 아들, 잇도의 손자이며 예언자인 스가랴에게 임하여 말씀하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 셰밧월은 히브리어 חודש שְׁבָט의 음역이며, 다른 표기로는 ‘쉐바트’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 히브리어 יְהוָה(여호와)의 본문 고유명 표기입니다.
    reason: theological_note
lexical_decisions:
- source_word: בְּ/יוֹם עֶשְׂרִים וְאַרְבָּעָה
  english_pob_choice: On the twenty-fourth day
  chosen_korean: 이십사일에
  alternatives_korean:
  - 스물넷째 날에
  - 이십사번째 날에
  lexicon: HALOT
  rationale: 히브리어 날짜 공식은 한국어에서도 관용적으로 날짜 숫자만 두고 조사를 붙여 자연스럽게 옮기는 것이 가장 정확합니다.
- source_word: לְ/עַשְׁתֵּי עָשָׂר חֹדֶשׁ
  english_pob_choice: of the eleventh month
  chosen_korean: 열한째 달
  alternatives_korean:
  - 열한 번째 달
  - 열한 달
  lexicon: HALOT
  rationale: 수사적 월 표시는 한국어에서도 서수 표현인 '열한째'가 가장 분명하며, 달력 문맥을 그대로 살립니다.
- source_word: הוּא חֹדֶשׁ שְׁבָט
  english_pob_choice: (that is, the month Shebat)
  chosen_korean: 곧 셰밧월
  alternatives_korean:
  - 즉 셰밧월
  - 곧 시바트월
  lexicon: HALOT
  rationale: הוּא의 풀이 기능을 '곧'으로 옮겨 앞의 번호 달과 동격임을 드러냈고, חודש 명칭은 음역하여 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 여호와 대체를 따르지 않고, 본 프로젝트 기본값에 따라 신명은 '야훼'로 옮겨 고유명을 보존했습니다.
- source_word: הָיָה דְבַר יְהוָה
  english_pob_choice: the word of Yahweh came
  chosen_korean: 야훼의 말씀이 … 임하여
  alternatives_korean:
  - 야훼의 말씀이 … 왔습니다
  - 야훼의 말씀이 … 있었습니다
  lexicon: HALOT
  rationale: 예언 서문의 관용구는 단순한 존재가 아니라 계시의 도래를 뜻하므로, '임하다'로 옮겨 원문의 사건성을 살렸습니다.
- source_word: הַ/נָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자인
  alternatives_korean:
  - 그 예언자인
  - 선지자인
  lexicon: HALOT
  rationale: 정관사 있는 אַת/הנביא의 지시성을 살리되, 한국어에서는 수식형 '예언자인'이 계보식 표기를 자연스럽게 연결합니다.
theological_decisions:
- issue: 다윗 왕조 연대식과 예언 공식의 문체
  chosen_reading: 역사적 시점 표시는 간결한 연대 문장으로, 계시 공식은 '임하여 말씀하셨습니다'로 옮겼습니다.
  alternative_readings:
  - 더 직역하여 '있었습니다'로 처리
  - '''말씀이 왔습니다''로 평이하게 처리'
  rationale: 본문은 단순 연대기와 계시 서문의 결합이므로, 한국어에서도 두 기능을 분명히 구분해 예언 사건의 엄중함을 살렸습니다.
  doctrine_reference: Prophetic formulae in Hebrew narrative
