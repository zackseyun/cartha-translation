source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה שַׁ֤בְתִּי לִ/ירוּשָׁלִַ֨ם֙ בְּֽ/רַחֲמִ֔ים בֵּיתִ/י֙ יִבָּ֣נֶה בָּ֔/הּ נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת ו/קוה יִנָּטֶ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “내가 긍휼을 품고 예루살렘으로 돌아왔으니, 내 집이 그 가운데에 세워질 것이며 — 만군의 야훼의 말씀입니다 — 예루살렘 위에 측량줄이 펼쳐질 것입니다.”
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה / יְהוָה צְבָאוֹת
  english_pob_choice: the LORD / the LORD of hosts
  chosen_korean: 야훼 / 만군의 야훼
  alternatives_korean:
  - 여호와 / 만군의 여호와
  - 주 / 만군의 주
  lexicon: YHWH
  rationale: 본문의 신명은 학술 음역인 ‘야훼’로 일관했고, צְבָאוֹת은 군사적·우주적 위엄을 살려 ‘만군의 야훼’로 옮겼습니다.
- source_word: בְּרַחֲמִים
  english_pob_choice: with compassion
  chosen_korean: 긍휼을 품고
  alternatives_korean:
  - 자비로
  - 연민으로
  lexicon: רַחֲמִים
  rationale: 단순한 감정보다 회복을 향한 자비로운 긍휼의 태도를 드러내기 위해 동사적 표현으로 자연화했습니다.
- source_word: בֵּיתִי יִבָּנֶה בָּהּ
  english_pob_choice: my house will be built in her
  chosen_korean: 내 집이 그 가운데에 세워질 것이며
  alternatives_korean:
  - 내 집이 그 안에 지어질 것이며
  - 내 집이 그 안에서 건축될 것이며
  lexicon: בַּיִת
  rationale: ‘세워질’은 성전의 건립을 현대 한국어로 자연스럽게 드러내면서도, 본문의 수동형 의미를 유지합니다.
- source_word: וְקָו יִנָּטֶה עַל יְרוּשָׁלִָם
  english_pob_choice: a measuring line will be stretched out over Jerusalem
  chosen_korean: 예루살렘 위에 측량줄이 펼쳐질 것입니다
  alternatives_korean:
  - 예루살렘 위로 측량줄이 드리워질 것입니다
  - 예루살렘 위에 측량선이 놓일 것입니다
  lexicon: קָו
  rationale: ‘측량줄’은 건축·재건 맥락을 살리는 표준적 표현이며, ‘펼쳐지다’는 히브리어 수동형의 이미지를 자연스럽게 전달합니다.
theological_decisions:
- issue: 하나님의 귀환과 성전 재건의 선언을 미래 완결형으로 어떻게 표현할지
  chosen_reading: ‘내가 … 돌아왔으니 … 세워질 것입니다’로 옮겨, 이미 시작된 긍휼의 귀환과 앞으로의 성전 재건을 함께 드러냈습니다.
  alternative_readings:
  - ‘돌아오겠습니다’로 미래화
  - ‘돌아와 있습니다’로 현재화
  rationale: 히브리어 완료형은 단순 과거가 아니라 언약적 확정성을 띠므로, 한국어에서도 확정된 선언으로 읽히게 했습니다.
  doctrine_reference: 언약적 확정성 / 예언적 완료
