translation:
  language: ko
  text: 야훼께서 나와 말하던 천사에게 좋은 말씀과 위로의 말씀으로 응답하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘좋은 말씀’과 ‘위로의 말씀’을 병렬로 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나와 말하던 천사’는 스가랴의 환상에서 그에게 말하는 천사를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 본문이 여호와 대신 표제어가 아닌 고유한 신명 יהוה를 직접 사용하므로, POB 원칙에 따라 한국어도 ‘야훼’로 옮겨 신적 이름을 보존했습니다.
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 응답하셨습니다
  alternatives_korean:
  - 대답하셨습니다
  - 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술문 속 동사 ענה는 대화적 응답을 뜻하므로 ‘응답하다’가 가장 자연스럽고, 야훼와 천사 사이의 대화 구조도 살려 줍니다.
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  english_pob_choice: the angel who was speaking with me
  chosen_korean: 나와 말하던 천사
  alternatives_korean:
  - 나와 대화하던 천사
  - 나에게 말하던 천사
  lexicon: HALOT
  rationale: 환상 문맥의 מלאך는 ‘천사’가 적절하고, בִּי는 예언자와의 지속적 대화를 나타내므로 ‘나와 말하던’으로 그 관계성과 진행성을 살렸습니다.
- source_word: דְּבָרִים טוֹבִים / דְּבָרִים נִחֻמִים
  english_pob_choice: good words, comforting words
  chosen_korean: 좋은 말씀, 곧 위로의 말씀
  alternatives_korean:
  - 좋은 말씀, 위로의 말씀
  - 좋은 말, 위로의 말
  lexicon: HALOT
  rationale: 히브리어의 ‘말씀들’ 반복을 유지하기 위해 ‘말씀’을 쓰고, 좋은/위로라는 병렬을 한국어에서 자연스럽게 풀어 ‘곧’으로 두 표현의 동격성을 드러냈습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 천사 매개 관계
  chosen_reading: 야훼께서 천사에게 응답하셨다는 직접 화법을 유지하되, 천사가 예언자와 ‘말하던’ 존재라는 설명은 본문 표현 안에서만 드러내고 별도 해설은 붙이지 않았습니다.
  alternative_readings:
  - 야훼께서 그 천사에게 말씀하셨습니다
  - 야훼께서 그 천사에게 대답하셨습니다
  rationale: 본절은 신적 응답과 환상 속 중개자 사이의 관계를 제시하지만, 해석을 과도하게 확장하기보다 본문이 말하는 대화 구조만 충실히 반영하는 것이 적절합니다.
  doctrine_reference: Zechariah vision context; POB source-first rendering principle
