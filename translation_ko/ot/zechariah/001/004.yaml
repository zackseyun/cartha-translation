base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
  footnotes:
  - marker: a
    text: Or 'your ancestors.' Hebrew literally 'your fathers,' referring to earlier generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 조상들처럼 되지 마십시오. 이전 예언자들이 그들에게 이렇게 선포했습니다. “만군의 야훼께서 이렇게 말씀하셨습니다. 부디 너희의 악한 길들과 너희의 악한 행위들에서 돌이키십시오.” 그러나 그들은 듣지 않았고 내게 귀를 기울이지 않았습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들’은 히브리어의 문자적 표현인 ‘너희 아버지들’을 옮긴 것이며, 여기서는 이전 세대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיוּ
  english_pob_choice: Do not be
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 하지 마십시오
  - 되지 마십시오
  lexicon: WLC/HALOT
  rationale: אַל + היה의 금지 용법을 한국어의 존재·상태 금지로 자연스럽게 옮겼습니다. 문맥상 앞 세대와 같은 모습이 되지 말라는 경고이므로 '되다'를 살렸습니다.
- source_word: כַאֲבֹתֵיכֶם
  english_pob_choice: like your fathers
  chosen_korean: 너희 조상들처럼
  alternatives_korean:
  - 너희 아버지들처럼
  - 너희 선조들처럼
  lexicon: WLC/HALOT
  rationale: 히브리어는 문자적으로 '너희 아버지들'이지만, 문맥상 이전 세대를 가리킵니다. 한국어에서는 혈연적 남성 표현보다 의미가 분명한 '조상들'이 본문 기능을 더 잘 드러냅니다.
- source_word: שׁוּבוּ נָא
  english_pob_choice: Turn back, please
  chosen_korean: 이제 돌이키십시오
  alternatives_korean:
  - 돌아오십시오, 부디
  - 돌이키십시오, 부디
  lexicon: WLC/HALOT
  rationale: שוב은 회개를 촉구하는 '돌이키다'가 적절합니다. נָא의 청유·간청 뉘앙스는 한국어의 '부디'보다 예언자적 호소를 살리는 명령형으로 처리하되, '이제'를 넣어 즉각성을 드러냈습니다.
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  english_pob_choice: and your evil deeds
  chosen_korean: 너희 악한 행위들
  alternatives_korean:
  - 너희 악한 행동들
  - 너희 악한 소행들
  lexicon: WLC/HALOT
  rationale: מַעֲלִילִים는 단순 행위보다 도덕적 평가가 붙은 '행위/소행'에 가깝습니다. 앞의 '길들'과 병렬을 이루도록 '행위들'로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יהוה를 직접 사용하므로, POB 원칙에 따라 고유명으로서 '야훼'를 유지했습니다. 이는 뒤의 '만군의'와 결합된 예언자적 신탁의 어조도 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 예언자적 인용과 화자 전환
  chosen_reading: 이전 예언자들의 직접 선포—인용문—야훼의 선언으로 구분
  alternative_readings:
  - 전체를 간접화해 한 문장으로 통합
  - 인용부호 없이 서술
  rationale: 본문은 먼저 예언자들의 선포를 소개하고, 그 안에서 신탁 인용이 이어진 뒤, 마지막에 다시 선언 공식으로 닫힙니다. 한국어에서도 이 화자 전환을 구분해 원문의 수사 구조를 유지했습니다.
  doctrine_reference: 예언서 화법 및 인용 구조
