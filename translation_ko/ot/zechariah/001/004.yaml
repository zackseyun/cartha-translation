  to: 너희 조상들처럼 되지 마십시오. 이전 예언자들이 그들에게 이렇게 선포했습니다. “만군의 야훼께서 이렇게 말씀하셨습니다. 부디 너희의 악한 길들과 너희의 악한 행위들에서 돌이키십시오.” 그러나 그들은 듣지 않았고 내게 귀를 기울이지 않았습니다. 야훼의 말씀입니다.[a]
