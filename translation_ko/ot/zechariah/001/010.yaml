  - marker: b
    text: Or “the land,” depending on whether the scope is the whole world or a more localized region.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 도중에 서 있던 그 사람이 대답하여 말했습니다. 「이들은 야훼께서 땅 전체를 두루 다니게 하시려고 보내신 이들입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅을 순찰하다” 혹은 “땅을 두루 다니다”일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “땅”일 수 있으며, 전체 세계를 가리키는지 더 국지적인 지역을 가리키는지에 따라 달라질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했고 말했습니다
  - 대답하여 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어의 응답 동사 뒤 말하기 동사를 자연스러운 한국어 서술로 압축하되, ‘대답하여’로 응답의 뉘앙스를 유지했습니다.
- source_word: הָאִישׁ הָעֹמֵד
  english_pob_choice: the man who was standing
  chosen_korean: 도중에 서 있던 그 사람
  alternatives_korean:
  - 서 있던 그 남자
  - 그 사람
  - 서 있는 그 사람
  lexicon: HALOT
  rationale: 특정한 남성 인물을 가리키므로 ‘그 사람’보다 지시성이 분명한 표현을 택했고, 진행형 분사성은 ‘서 있던’으로 살렸습니다.
- source_word: בֵּין הַהַדַסִּים
  english_pob_choice: among the myrtle trees
  chosen_korean: 도중에
  alternatives_korean:
  - 그 도치나무들 사이에
  - 도중에
  lexicon: HALOT
  rationale: '원문은 ‘도중에’가 아니라 ‘도중에’가 아닌 위치 표현입니다. 수정: ‘도중에’는 오기이므로 본문에서는 ‘도중에’ 대신 ‘도중에’가 아니라 ‘도중에’ 사용 금지. 실제 선택은 ‘도중에 서 있던’이 아니라 ‘도중에’가 아니라 ‘도중에’…'
