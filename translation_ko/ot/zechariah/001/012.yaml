base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “will you not show mercy on Jerusalem and the cities of Judah?”
    reason: lexical_alternative
  - marker: c
    text: Or “with which you have been indignant these seventy years.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 응답하여 말했습니다. “만군의 야훼여, 예루살렘과 유다의 성읍들을 향하여 당신이 언제까지 자비를 베풀지 않으시겠습니까? 당신이 이 칠십 년 동안 노여워하신 그 성읍들을 향하여 말입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 메신저.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “예루살렘과 유다의 성읍들을 향하여 당신이 자비를 베풀지 않으시겠습니까?”
    reason: alternative_reading
  - marker: c
    text: 또는 “이 칠십 년 동안 그 성읍들을 향하여 당신이 노여워하신.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 ‘천사’가 자연스럽고, יְהוָה는 본문 원어의 언약명에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 응답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 대화의 반응을 여는 서술어로서 ‘응답하여’가 מתאים하며, 이어지는 발화를 자연스럽게 이끕니다.
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: O Yahweh of hosts
  chosen_korean: 만군의 야훼여
  alternatives_korean:
  - 군대의 야훼여
  - 야훼 만군의 주여
  lexicon: HALOT
  rationale: צְבָאוֹת은 직역하면 ‘군대들/만군’이므로, 호격의 힘을 살려 ‘만군의 야훼여’로 옮겼습니다.
- source_word: לֹא תְרַחֵם
  english_pob_choice: will you have no compassion
  chosen_korean: 자비를 베풀지 않으시겠습니까
  alternatives_korean:
  - 긍휼을 보이지 않으시겠습니까
  - 불쌍히 여기지 않으시겠습니까
  lexicon: HALOT
  rationale: רחם의 핵심은 긍휼/자비입니다. 한국어에서는 ‘자비를 베풀다’가 가장 자연스럽고, 부정 의문형으로 원문의 탄원을 살렸습니다.
- source_word: זָעַמְתָּה
  english_pob_choice: with which you have been angry
  chosen_korean: 노여워하신
  alternatives_korean:
  - 진노하신
  - 분노하신
  lexicon: HALOT
  rationale: זעם은 강한 분노/격노를 가리키며, 한국어에서는 하나님께 대한 경어를 유지하면서도 본문의 긴장을 살리는 ‘노여워하다’가 적절합니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 언약명을 가리는 대신 원어의 고유성을 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: POB naming convention for YHWH
- issue: ‘자비를 베풀다’의 문체
  chosen_reading: 직접적인 탄원형 호칭과 함께 ‘자비를 베풀지 않으시겠습니까’로 옮김
  alternative_readings:
  - ‘불쌍히 여기지 않으시겠습니까’로 더 직역
  - ‘긍휼히 여기지 않으시겠습니까’로 교회어 유지
  rationale: 예언적 중보의 간절함을 현대 한국어로 분명하게 전달하면서, 전통 교회어로 의미를 약화시키지 않도록 했습니다.
  doctrine_reference: POB translation philosophy — source-direct, non-domesticating
