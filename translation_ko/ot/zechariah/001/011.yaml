  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
  footnotes:
  - marker: a
    text: Or “We have gone about the earth” or “We have walked to and fro in the earth.”
    reason: lexical_alternative
  - marker: b
    text: Or “all the earth is at rest and quiet.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 도금양나무들 사이에 서 있는 야훼의 천사에게 대답하여 말했습니다. “우리는 땅을 두루 다녀왔습니다[a]. 보십시오, 온 땅이 평온히 머물러 있고[b] 조용합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 땅을 이곳저곳 다녀보았습니다” 또는 “우리는 땅을 오가며 다녔습니다.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “온 땅이 앉아 있고 조용합니다.” 여기서 ‘앉아 있다’는 안정되어 머물러 있는 상태를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  english_pob_choice: answered
  chosen_korean: 대답했는데
  alternatives_korean:
  - 응답했는데
  - 말했는데
  lexicon: HALOT
  rationale: 대화 장면의 응답을 자연스럽게 살리면서, 뒤이은 직접 화법을 이끄는 연결도 유지합니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 주님의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 환상 문맥에서 '천사'가 가장 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: הִתְהַלַּכְנוּ
  english_pob_choice: We have gone throughout the earth
  chosen_korean: 우리는 땅을 이곳저곳 다녀보았습니다
  alternatives_korean:
  - 우리는 온 땅을 두루 다녀보았습니다
  - 우리는 땅을 오가며 다녔습니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 반복·순회 의미를 살려 단순한 '갔다'보다 조사·순찰의 뉘앙스가 드러나게 했습니다.
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  english_pob_choice: is at rest and quiet
  chosen_korean: 가만히 앉아 있고 조용합니다
  alternatives_korean:
  - 평온하고 조용합니다
  - 한가하고 조용합니다
  lexicon: HALOT
  rationale: יֹשֶׁבֶת의 구체적 이미지와 שֹׁקָטֶת의 정적 상태를 구분해, 평안한 정황을 너무 추상화하지 않도록 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 본문의 신명은 프로젝트 기본값과 원어 추적성을 따라 '야훼'로 옮겼습니다.
  doctrine_reference: POB terminology default for יהוה / YHWH
- issue: 직접 화법의 묘사 수준
  chosen_reading: “우리는 땅을 이곳저곳 다녀보았습니다. 보십시오, 온 땅이 가만히 앉아 있고 조용합니다.”
  alternative_readings:
  - “우리는 땅을 두루 다녀보았습니다. 보십시오, 온 땅이 평안하고 조용합니다.”
  rationale: 히브리어의 보고문과 관찰문 구조를 유지하되, 두 동사 יֹשֶׁבֶת / שֹׁקָטֶת의 병렬을 한국어에서도 구분해 드러냈습니다.
  doctrine_reference: Preserve lexical tension rather than collapsing parallel verbs
