id: ZEC.14.19
reference: Zechariah 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
  footnotes:
  - marker: a
    text: Or 'penalty'; the Hebrew word can also mean 'sin' in other contexts, but here it refers to the judgment incurred by refusing to go up for the feast.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'the Feast of Tabernacles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 이집트가 받을 형벌[a]이며, 올라가서 초막절[b]을 지키지 않는 모든 민족이 받을 형벌입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌’입니다. 히브리어 이 단어는 다른 문맥에서는 ‘죄’를 뜻하기도 하지만, 여기서는 절기에 올라가기를 거부한 데서 오는 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘장막절’이라고도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  english_pob_choice: punishment
  chosen_korean: 죄
  alternatives_korean:
  - 형벌
  - 벌
  - 죄책
  lexicon: HALOT
  rationale: 이 구절에서는 불순종에 대한 심판의 결과를 가리키지만, 한국어에서는 본문의 반복과 병행을 살리면서도 결과를 드러내는 ‘죄’가 가장 직접적입니다. 다만 후속 맥락상 징벌의 의미가 있으므로 주석으로 영어 POB의 해설을 반영했습니다.
- source_word: מִצְרָיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 현대 표준어와 외래어 표기법에 따라 고유명사를 ‘이집트’로 옮겼습니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족
  lexicon: HALOT
  rationale: 예언 문맥의 보편적 대상이라는 점을 살리되, ‘이방’보다 중립적인 ‘민족’이 자연스럽습니다.
- source_word: חַג הַסֻּכּוֹת
  english_pob_choice: Festival of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 천막절
  - 초막들의 절기
  lexicon: HALOT
  rationale: 영어 POB가 전통 용어를 풀어 쓴 것과 달리, 한국어에서는 절기명으로 널리 알려진 ‘초막절’을 쓰는 것이 가장 읽기 쉽고 본문 흐름에도 맞습니다.
theological_decisions:
- issue: חטאת의 의미를 한국어에서 어떻게 재현할지
  chosen_reading: ‘죄’로 옮기되, 주석으로 심판의 결과라는 해설을 덧붙입니다.
  alternative_readings:
  - 형벌
  - 벌
  - 죄책
  rationale: 히브리어 חטאת는 문맥상 죄 자체라기보다 불순종에 대한 심판의 결과를 가리키지만, 한국어 본문에서는 반복 구조를 가장 잘 살리는 직역형 ‘죄’가 본문성을 유지합니다. 대신 각주에서 POB의 해설을 반영해 오독을 막습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: 초막절 명칭의 처리
  chosen_reading: ‘초막절’
  alternative_readings:
  - ‘장막절’
  - ‘Festival of Booths’의 음역
  rationale: 본절은 절기명을 가리키며, 한국어 교회 독자에게 가장 즉각적으로 인지되는 명칭을 쓰는 것이 전달성에 유리합니다. ‘초막절’은 본문 이미지(booths)와 전통적 사용을 함께 보존합니다.
  doctrine_reference: 번역 원칙 §6
