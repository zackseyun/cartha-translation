revisions:
- from: 이것이 이집트의 죄[b][a]이며, 올라가서 초막절을 지키지 않는 모든 민족의 죄입니다.
  to: 이것이 이집트가 받을 형벌[a]이며, 올라가서 초막절[b]을 지키지 않는 모든 민족이 받을 형벌입니다.
  rationale: 문맥과 직전 절의 재앙 언급에 따라 חַטַּאת를 ‘형벌’로 수정했습니다. 원문의 두 번 반복되는 명사를 한국어에서도 ‘받을 형벌’로 반복하여 이집트와 모든 민족에 대한 병렬을 보존했습니다. 또한 절기명 관련 각주를 ‘초막절’에 연결하고, 형벌의 어휘 대안과 어휘 범위 설명을 본문 선택에 맞게 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:51:00Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 חַטַּאת는 이 문맥에서 이집트와 절기를 지키러 올라가지 않는 민족들이 받게 될 심판·형벌을 뜻합니다. 본문의 ‘죄’는 이 의미를 ‘그들의 죄’로 바꾸어, 심판의 결과를 가리키는 원문과 직전 문맥(14:18)의 의미를 충분히 반영하지 못합니다.
  naturalness: ‘이집트가 받을 형벌’과 ‘모든 민족이 받을 형벌’의 병렬은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 반복도 명료하게 드러냅니다. ‘올라가서 초막절을 지키지 않는’은 순례의 ‘올라가다’와 절기 준수의 뜻을 자연스럽게 보존합니다.
  terminology: ‘이집트’, ‘모든 민족’, ‘초막절’은 적절합니다. חַטַּאת는 문맥상 ‘형벌’로 옮기는 것이 안전합니다. ‘초막절’의 전통 명칭인 ‘장막절’은 해당 절기명에 각주로 연결해야 합니다.
  issues:
  - severity: high
    issue: חַטַּאת를 본문에서 ‘죄’로 번역함
    rationale: 이 절은 이집트와 불순종하는 민족의 죄를 명명하는 것이 아니라, 그들이 받을 재앙적 심판/형벌을 요약합니다. ‘죄’는 행위 또는 죄책으로 이해되기 쉬워 문맥상 의미를 흐립니다.
  - severity: medium
    issue: 각주 표지 b가 ‘이집트’에 붙어 있음
    rationale: b 각주는 ‘장막절’이라는 절기 명칭의 대안이므로 ‘초막절’에 붙어야 합니다. 현 위치는 각주의 지시 대상을 잘못 연결합니다.
  - severity: low
    issue: 각주 a의 대안어가 본문 선택과 불일치함
    rationale: 본문을 ‘형벌’로 고치면 각주는 ‘벌’을 대안으로 제시하고, 해당 히브리어가 다른 문맥에서 ‘죄’를 뜻할 수 있음을 설명하는 방식이 일관됩니다.
  revised_text: 이것이 이집트가 받을 형벌[a]이며, 올라가서 초막절[b]을 지키지 않는 모든 민족이 받을 형벌입니다.
