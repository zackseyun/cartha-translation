id: ZEC.14.8
reference: Zechariah 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֤וּ מַֽיִם חַיִּים֙ מִ/יר֣וּשָׁלִַ֔ם חֶצְיָ֗/ם אֶל הַ/יָּם֙ הַ/קַּדְמוֹנִ֔י וְ/חֶצְיָ֖/ם אֶל הַ/יָּ֣ם הָ/אַחֲר֑וֹן בַּ/קַּ֥יִץ וּ/בָ/חֹ֖רֶף יִֽהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
  footnotes:
  - marker: a
    text: Or 'fresh/flowing water'; Hebrew 'living waters,' a common expression for running or life-giving water.
    reason: lexical_alternative
  - marker: b
    text: That is, the sea to the east of Jerusalem, traditionally identified as the Dead Sea.
    reason: cultural_note
  - marker: c
    text: That is, the sea to the west of Jerusalem, traditionally identified as the Mediterranean Sea.
    reason: cultural_note
translation:
  language: ko
  text: 그날에 예루살렘에서 생수가 흘러나올 것입니다[a]. 그 절반은 동쪽 바다로, 그 절반은 서쪽 바다로 갈 것이며[b][c], 여름에도 겨울에도 그렇게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흐르는/샘솟는 물’. 히브리어 ‘생수’는 흔히 흐르는 물이나 생명을 주는 물을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 예루살렘 동쪽에 있는 바다로, 전통적으로 사해로 알려져 있습니다.
    reason: cultural_note
  - marker: c
    text: 즉 예루살렘 서쪽에 있는 바다로, 전통적으로 지중해로 알려져 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will be
  chosen_korean: 흘러나올 것입니다 / 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 일어날 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 살리되, 앞절의 동작은 동사구로, 끝부분의 지속성은 ‘될 것입니다’로 매끈하게 옮겼습니다.
- source_word: מַיִם חַיִּים
  english_pob_choice: living waters
  chosen_korean: 생수
  alternatives_korean:
  - 살아 있는 물
  - 흐르는 물
  - 생수들
  lexicon: HALOT
  rationale: 직역하면 ‘살아 있는 물들’이지만, 한국어에서 예언적·관용적 뉘앙스를 유지하면서도 자연스러운 표현은 ‘생수’입니다. 다만 본문의 생동감과 생명 부여의 긴장은 유지했습니다.
- source_word: הַיָּם הַקַּדְמוֹנִי / הַיָּם הָאַחֲרוֹן
  english_pob_choice: the eastern sea / the western sea
  chosen_korean: 동쪽 바다 / 서쪽 바다
  alternatives_korean:
  - 동편 바다 / 서편 바다
  - 동쪽의 바다 / 서쪽의 바다
  lexicon: HALOT
  rationale: 지시 방향을 분명하게 드러내면서도, 본문이 본문 밖의 지리적 해석을 본문 안에 과도하게 끌어들이지 않도록 ‘동쪽/서쪽 바다’로 옮겼습니다.
- source_word: בַּקַּיִץ וּבָחֹרֶף יִהְיֶה
  english_pob_choice: it will be so in summer as well as in winter
  chosen_korean: 여름에도 겨울에도 그렇게 될 것입니다
  alternatives_korean:
  - 여름과 겨울에 그렇게 될 것입니다
  - 여름에도 겨울에도 있을 것입니다
  lexicon: HALOT
  rationale: 계절 대조가 강조하는 ‘연중 지속성’을 한국어에서 자연스럽게 드러내기 위해 ‘여름에도 겨울에도’로 처리했습니다.
theological_decisions:
- issue: מַיִם חַיִּים의 해석 긴장
  chosen_reading: ‘생수’로 옮기되, 단순한 물리적 물이거나 완전히 상징화된 이미지로만 고정하지 않았습니다.
  alternative_readings:
  - 자연수/흐르는 물로만 이해
  - 영적 생명수로만 이해
  rationale: 히브리어 관용구의 물리적 의미와 예언적 상징 가능성을 함께 열어 두는 것이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
