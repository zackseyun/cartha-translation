revisions:
- from: 그리고 만일 이집트의 가족이 올라오지 않고 오지 않으면, 그들에게는 그 재앙이 내리지 않을 것입니다. 곧 야훼께서 초막절을 지키러 올라오지 않는 민족들에게 치시는 그 재앙입니다.[a][b][c]
  to: 그리고 만일 이집트의 가문이 올라가지도 않고 오지도 않는다면,[a] 그들에게는 그 재앙이 없을 것입니다.[b] 곧 야훼께서 초막절을 지키기 위해 올라오지 않는 민족들을 치시는 그 재앙입니다.[c]
  rationale: 본문의 난해한 부정과 ‘재앙’을 보존하되, ‘내리다’가 덧붙일 수 있는 강우 연상을 피했습니다. 집합 명사와 각주의 한국어를 자연스럽게 다듬었고, 각주 c의 구조·의미 오류를 바로잡았습니다. 각주 표지도 각각 해당 어구 뒤로 옮겼습니다.
