id: ZEC.14.18
reference: Zechariah 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
  footnotes:
  - marker: a
    text: Or, more literally, 'and does not come.' The Hebrew uses both 'go up' and 'come,' likely reinforcing the idea of pilgrimage to Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text reads 'the plague will not be upon them—the plague with which the LORD strikes the nations.' This is difficult in context because the previous verse speaks of no rain; many understand Egypt to receive a plague instead, since it does not depend on rainfall in the same way.
    reason: alternative_reading
  - marker: c
    text: Traditionally, 'the Feast of Tabernacles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 이집트의 가문이 올라가지도 않고 오지도 않는다면,[a] 그들에게는 그 재앙이 없을 것입니다.[b] 곧 야훼께서 초막절을 지키기 위해 올라오지 않는 민족들을 치시는 그 재앙입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘올라가다’와 ‘오다’를 함께 사용하여 예루살렘으로의 순례와 도착을 함께 나타냅니다.
    reason: source_note
  - marker: b
    text: 앞 절은 비가 내리지 않는 벌을 언급하지만, 이 절의 히브리어 본문은 ‘그 재앙이 그들에게 없을 것이다’라고 읽어 문맥상 난점이 있습니다. 많은 이들은 비에 덜 의존하는 이집트에는 재앙이 대신 임한다는 뜻으로 이해하지만, 본문은 이 긴장을 그대로 둡니다.
    reason: alternative_reading
  - marker: c
    text: 전통적으로 ‘장막절’이라고도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  english_pob_choice: the family of Egypt
  chosen_korean: 이집트의 가족
  alternatives_korean:
  - 이집트의 가문
  - 이집트의 씨족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 민족명보다 가족/씨족의 집단성을 드러내므로, POB의 'family of Egypt'를 따라 집단 명사를 살렸습니다.
- source_word: תַעֲלֶה
  english_pob_choice: go up
  chosen_korean: 올라오지
  alternatives_korean:
  - 상경하지
  - 올라가지
  lexicon: HALOT
  rationale: עלה의 예루살렘 순례 관용을 살리기 위해 단순한 이동보다 '올라오다'를 사용했습니다.
- source_word: וְלֹא בָאָה
  english_pob_choice: and does not come
  chosen_korean: 오지 않으면
  alternatives_korean:
  - 들어오지 않으면
  - 도착하지 않으면
  lexicon: HALOT
  rationale: בוא는 '오다/들어오다'의 기본 뜻이지만, 앞의 '올라오다'와 병렬된 두 동작을 자연스럽게 드러내기 위해 '오다'로 옮겼습니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 전염병
  - 그 치명적 타격
  lexicon: HALOT
  rationale: מַגֵּפָה는 전염병보다 더 넓게 '치는 재앙/재난'의 뜻을 가지므로, 본문 연결과 어울리는 '재앙'을 택했습니다.
- source_word: לָחֹג אֶת חַג הַסֻּכּוֹת
  english_pob_choice: to celebrate the Feast of Booths
  chosen_korean: 초막절을 지키러
  alternatives_korean:
  - 초막절을 기념하러
  - 초막절을 축하하러
  lexicon: HALOT
  rationale: חַג הַסֻּכּוֹת는 전통적 '초막절'을 쓰되, לָחֹג의 축제 준수 의미를 한국어 관용에 맞게 '지키러'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 언약명 YHWH를 직접 드러내기 위해 '야훼'를 사용해, 일반적인 '주'로 완화하지 않았습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 이집트에 대한 벌의 성격
  chosen_reading: '''재앙''을 본문에 유지하고 평행 구절의 비를 본문에 끌어오지 않음'
  alternative_readings:
  - 비가 내리지 않을 것이라고 조정함
  - 본문을 매끈하게 조화시킴
  rationale: 마소라 본문은 '재앙'을 분명히 말하므로, 앞 절의 '비'를 끌어와 문장을 정리하지 않고 원문의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
