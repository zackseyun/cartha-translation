    text: 또는 ‘유다도 예루살렘을 대적하여 싸울 것입니다.’ 히브리어 전치사 ב는 보통 ‘~에서/안에서’를 뜻하지만, 일부는 주변 문맥에 비추어 대적의 뜻으로 이해합니다.
    reason: alternative_reading
