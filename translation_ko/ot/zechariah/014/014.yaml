id: ZEC.14.14
reference: Zechariah 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
  footnotes:
  - marker: a
    text: Or 'Judah also will fight against Jerusalem.' The Hebrew preposition normally means 'in/at,' but some take the phrase in light of the surrounding context as indicating opposition.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 유다도[a] 예루살렘에서 싸울 것이며, 주변의 모든 나라들의 재물—금과 은과 의복—이 매우 많은 양으로 모일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다가 예루살렘을 대적하여 싸울 것입니다.’ 히브리어 전치사는 보통 ‘~안에서/~에서’를 뜻하지만, 일부는 문맥상 대적의 의미로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And ... also
  chosen_korean: 그리고 ...도
  alternatives_korean:
  - 그리고 또한
  - 심지어
  lexicon: HALOT
  rationale: 첨가와 강조를 함께 나타내므로, 앞 문맥을 잇는 ‘그리고’에 첨가 조사 ‘도’를 붙여 자연스럽게 옮겼습니다.
- source_word: תִּלָּחֵם
  english_pob_choice: will fight
  chosen_korean: 싸울 것입니다
  alternatives_korean:
  - 전쟁할 것입니다
  - 전투할 것입니다
  lexicon: HALOT
  rationale: 니팔형의 전투 참여를 가장 직접적으로 나타내는 한국어로 옮겼습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: at Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘을 향해
  lexicon: HALOT
  rationale: 전치사 ב의 기본적인 장소 용법을 따라 ‘에서’로 옮겼고, 공격 대상 여부는 본문 각주로 남겼습니다.
- source_word: חֵיל
  english_pob_choice: the wealth
  chosen_korean: 재물
  alternatives_korean:
  - 전리품
  - 부
  lexicon: HALOT
  rationale: 뒤따르는 금, 은, 의복의 목록이 전리된 물품을 가리키므로, 포괄적으로 ‘재물’로 처리했습니다.
theological_decisions:
- issue: 유다가 예루살렘에서 싸우는지, 예루살렘을 향해 싸우는지의 해석 보존
  chosen_reading: 본문은 ‘예루살렘에서’로 옮기고, 대안 해석은 각주로 보존했습니다.
  alternative_readings:
  - 유다가 예루살렘을 대적하여 싸운다
  rationale: 히브리어 전치사 ב는 가장 자연스럽게 장소를 뜻하지만, 문맥상 반대 방향으로 읽는 견해도 있어 본문에서 단정하지 않고 여지를 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
