id: ZEC.14.17
reference: Zechariah 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
  footnotes:
  - marker: a
    text: Or 'to bow down.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 여러 가문 가운데 어느 가문이 예루살렘으로 올라가 왕, 곧 만군의 야훼를 예배하지 않으면, 그들 위에는 비가 내리지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엎드려 절하다’.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘만군의 여호와’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  english_pob_choice: And if any
  chosen_korean: 땅의 여러 가문 가운데 어느 가문이
  alternatives_korean:
  - 그리고 누구든지
  - 그리고 그것은 …일 것입니다
  lexicon: HALOT
  rationale: 조건문 도입부를 한국어에서 자연스럽게 풀어, 원문의 조건적 의미를 살리면서도 예언문체의 흐름을 유지했습니다.
- source_word: מִשְׁפְּחוֹת הָאָרֶץ
  english_pob_choice: of the families of the earth
  chosen_korean: 땅의 여러 가문
  alternatives_korean:
  - 땅의 가족들
  - 땅의 족속들
  - 세상의 여러 가문
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת은 여기서 공동체 단위를 가리키므로 ‘가문’이 가장 무난하며, הָאָרֶץ는 전 지구적 범위를 살려 ‘땅’으로 옮겼습니다.
- source_word: לְהִשְׁתַּחֲוֺת
  english_pob_choice: to worship
  chosen_korean: 예배하지 않으면
  alternatives_korean:
  - 절하지 않으면
  - 엎드려 경배하지 않으면
  lexicon: HALOT
  rationale: 문맥상 단순한 몸짓보다 신적 왕께 드리는 예배 행위가 핵심이므로, POB의 ‘worship’을 한국어로 자연스럽게 ‘예배하다’로 옮겼습니다.
- source_word: לְמֶלֶךְ יְהוָה צְבָא֑וֹת
  english_pob_choice: the King, Yahweh of Armies
  chosen_korean: 왕, 곧 만군의 야훼
  alternatives_korean:
  - 왕, 곧 만군의 여호와
  - 왕이신 만군의 야훼
  - 만군의 야훼이신 왕
  lexicon: HALOT
  rationale: ‘왕’과 그 뒤의 신적 호칭이 같은 분을 가리키는 점을 ‘곧’으로 분명히 했고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’, צְבָאוֹת은 직역해 ‘만군의’로 옮겼습니다.
- source_word: הַגָּשֶׁם
  english_pob_choice: rain
  chosen_korean: 비
  alternatives_korean:
  - 비가
  - 강우
  lexicon: HALOT
  rationale: 징계의 내용이 일상어로 직접 드러나도록 ‘비’로 옮겼고, 한국어 자연성을 위해 서술문 전체를 매끈하게 조정했습니다.
theological_decisions:
- issue: 야훼의 직역과 전통 교회어의 선택
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 제목적 결합을 ‘만군의 야훼’로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님 만군의 하나님
  rationale: POB의 원칙에 따라 신적 이름 יְהוָה를 전통적 대체어가 아니라 학술적 음역 ‘야훼’로 드러내어, 본문의 언약적 호칭을 가립니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לְהִשְׁתַּחֲוֹת의 예배/엎드림 긴장
  chosen_reading: ‘예배하다’를 본문에 두고, 물리적 굴복의 뉘앙스는 한국어 동사 자체의 종교적 용법으로 감당했습니다.
  alternative_readings:
  - 엎드려 경배하다
  - 절하다
  rationale: 히브리어 동사는 실제로는 엎드려 절하는 행위를 포함하지만, 여기서는 왕이신 야훼께 대한 공적 예배가 강조되므로 의미 중심 번역이 더 적절합니다.
  doctrine_reference: HALOT lexical sense; POB worship rendering
