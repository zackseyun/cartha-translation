id: ZEC.14.13
reference: Zechariah 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
  footnotes:
  - marker: a
    text: Or 'confusion' or 'tumult from the LORD.' The Hebrew term can denote a divinely sent state of chaotic terror.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his hand will rise against the hand of his neighbor,' a vivid expression for turning violently against one another.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 야훼로부터 오는 큰 공포가 그들 가운데 있을 것이며, 각 사람은 자기 이웃의 손을 붙잡을 것이나, 그의 손이 이웃의 손을 거슬러 올라갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘혼란’이나 ‘소동’으로도 옮길 수 있으며, 야훼께서 일으키시는 혼란 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손이 이웃의 손을 거슬러 올라갈 것입니다’로, 서로를 향한 폭력의 생생한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  english_pob_choice: panic
  chosen_korean: 공포
  alternatives_korean:
  - 혼란
  - 소동
  - 패닉
  lexicon: HALOT
  rationale: 전쟁적 문맥에서 야훼가 일으키는 혼란과 두려움을 함께 담아야 하므로, 현대 한국어에서 자연스러우면서도 강한 반응을 드러내는 ‘공포’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학문적 음역인 ‘야훼’로 옮겨 원문 표지를 유지했습니다.
- source_word: בָּהֶם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 안에
  - 그들 사이에
  lexicon: HALOT
  rationale: 공포가 집단 내부에서 발생해 서로에게 폭력으로 번지는 흐름을 살리기 위해 ‘그들 가운데’로 옮겼습니다.
- source_word: וְהֶחֱזִיקוּ
  english_pob_choice: will seize
  chosen_korean: 붙잡을 것이며
  alternatives_korean:
  - 붙들 것입니다
  - 움켜잡을 것입니다
  lexicon: HALOT
  rationale: 직역적인 ‘붙잡다’가 원문의 강한 행위를 유지하면서도 한국어 문맥에서 자연스럽습니다.
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  english_pob_choice: his hand will rise against the hand of his neighbor
  chosen_korean: 그의 손이 이웃의 손을 거슬러 올라갈 것입니다
  alternatives_korean:
  - 그의 손이 이웃의 손을 거슬러 일어날 것입니다
  - 그의 손이 이웃의 손을 향해 일어날 것입니다
  lexicon: HALOT
  rationale: 손을 반복한 히브리어의 생생한 이미지를 보존하면서, 상호 폭력을 드러내는 방향성은 ‘거슬러 올라갈’로 표현했습니다.
theological_decisions:
- issue: 야훼께서 주시는 혼란의 성격
  chosen_reading: 이 문장은 야훼께서 내리시는 공포가 적대 집단 내부의 상호 폭력으로 이어지는 심판을 말합니다.
  alternative_readings:
  - 더 일반적으로 단순한 혼란이나 소동으로 볼 수 있습니다.
  rationale: ‘야훼의 공포’라는 구성과 뒤따르는 상호 공격 묘사가 함께 작동하므로, 심판으로서의 신적 개입을 분명히 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: אִישׁ의 분배적 용법
  chosen_reading: ‘각 사람’ 대신 ‘각 사람’과 같은 분배적 표현을 유지하되, 원문의 대표성을 해치지 않는 범위에서 현대 한국어로 자연화했습니다.
  alternative_readings:
  - 각자
  - 모든 사람
  rationale: 히브리어의 분배적 단수 용법을 반영해야 하므로, 공동체 전체에 적용되는 대표적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §4
