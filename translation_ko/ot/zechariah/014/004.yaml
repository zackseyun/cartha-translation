base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
  footnotes:
  - marker: a
    text: Or 'which is opposite Jerusalem to the east.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'will be split' or 'will be cleft'; the Hebrew describes the mountain dividing so that its halves move apart.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 그의 발이 예루살렘 앞 동쪽에 있는 감람산 위에 서실 것이며, 감람산은 동쪽에서 서쪽으로 갈라져 매우 큰 골짜기가 될 것입니다. 산의 절반은 북쪽으로, 그 절반은 남쪽으로 옮겨질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 동쪽 맞은편에 있는’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘갈라질 것이다’ 또는 ‘쪼개질 것이다’이며, 히브리어는 산이 둘로 갈라져 그 절반들이 서로 벌어지는 모습을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  english_pob_choice: his feet will stand
  chosen_korean: 그의 발이 … 서실 것이며
  alternatives_korean:
  - 그의 발이 … 설 것이며
  - 그가 … 서실 것이며
  lexicon: HALOT
  rationale: 히브리어의 구체적인 신체적 표현을 살려 ‘발’과 ‘서실’로 옮기되, 주어의 존칭을 반영해 문체를 유지했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그날에
  - 그 때에
  lexicon: HALOT
  rationale: 예언문에서의 상투적 시간 표현을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: הַר הַזֵּתִים
  english_pob_choice: the Mount of Olives
  chosen_korean: 감람산
  alternatives_korean:
  - 올리브산
  - 올리브 나무 산
  lexicon: HALOT
  rationale: 지명으로 굳어진 한국어 성서 표현을 쓰되, 원문의 지리적 대상을 분명히 했습니다.
- source_word: וְנִבְקַע … מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  english_pob_choice: will be split in two from east to west
  chosen_korean: 동쪽에서 서쪽으로 갈라져
  alternatives_korean:
  - 가운데에서 동쪽과 서쪽으로 갈라져
  - 동서로 반으로 갈라져
  lexicon: HALOT
  rationale: ‘갈라지다’로 분열 이미지를 직접 살리고, 방향 관계를 간결하게 전달했습니다.
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  english_pob_choice: into a very great valley
  chosen_korean: 매우 큰 골짜기가 될 것입니다
  alternatives_korean:
  - 매우 큰 골짜기로
  - 엄청나게 큰 골짜기가 될 것입니다
  lexicon: HALOT
  rationale: גיא를 한국어의 기본어인 ‘골짜기’로 옮겨 의미를 분명히 했고, מאד의 강도를 ‘매우 큰’으로 반영했습니다.
theological_decisions:
- issue: YHWH가 감람산 위에 ‘발’로 선다는 신체적 표현
  chosen_reading: ‘그의 발이 … 서실’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘그의 임재가 … 나타나실’
  - ‘그가 … 임하실’
  rationale: 본문의 구체적 신체 언어를 완화하지 않고 보존해, 독자가 텍스트가 의도한 강한 현현 이미지를 그대로 읽도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
