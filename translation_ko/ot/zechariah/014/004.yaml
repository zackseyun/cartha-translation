theological_decisions:
- issue: YHWH가 감람산 위에 ‘발’로 선다는 신체적 표현
  chosen_reading: ‘그의 발이 … 서실’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘그의 임재가 … 나타나실’
  - ‘그가 … 임하실’
  rationale: 본문의 구체적 신체 언어를 완화하지 않고 보존해, 독자가 텍스트가 의도한 강한 현현 이미지를 그대로 읽도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
