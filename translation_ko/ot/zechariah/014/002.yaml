id: ZEC.14.2
reference: Zechariah 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָסַפְתִּ֨י אֶת כָּל הַ/גּוֹיִ֥ם אֶֽל יְרוּשָׁלִַם֮ לַ/מִּלְחָמָה֒ וְ/נִלְכְּדָ֣ה הָ/עִ֗יר וְ/נָשַׁ֨סּוּ֙ הַ/בָּ֣תִּ֔ים וְ/הַ/נָּשִׁ֖ים תשגלנה וְ/יָצָ֞א חֲצִ֤י הָ/עִיר֙ בַּ/גּוֹלָ֔ה וְ/יֶ֣תֶר הָ/עָ֔ם לֹ֥א יִכָּרֵ֖ת מִן הָ/עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
  footnotes:
  - marker: a
    text: Or, more euphemistically in some translation traditions, 'the women violated' or 'the women ravished.' The Hebrew term is blunt and refers to sexual assault.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the people will not be exterminated,' if 'cut off' is taken in the stronger sense of destruction rather than removal.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 모든 나라를 예루살렘을 치는 전쟁을 위해 모을 것이며, 성읍은 함락될 것이고, 집들은 약탈당할 것이며, 여자들은 성폭행당할 것이며, 성읍의 절반은 포로로 끌려갈 것이지만, 남은 백성은 성읍에서 끊어지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 노골적인 성적 폭력을 가리키며, 완곡하게는 ‘여자들이 유린당할 것입니다’ 또는 ‘강간당할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어지지 않다’는 여기서 ‘완전히 제거되지 않다’는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי אֶת כָּל הַגּוֹיִם
  english_pob_choice: And I will gather all the nations
  chosen_korean: 내가 모든 나라를 모을 것이며
  alternatives_korean:
  - 내가 모든 민족을 모을 것이며
  - 내가 모든 나라들을 소집할 것이며
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 전쟁 문맥의 국제적 집단을 가리키므로 ‘민족’보다 ‘나라’가 더 자연스럽고, 하나님의 주도적 행위를 살려 ‘모으다’로 옮겼습니다.
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  english_pob_choice: against Jerusalem for battle
  chosen_korean: 예루살렘을 치는 전쟁을 위해
  alternatives_korean:
  - 예루살렘을 향한 전쟁을 위해
  - 예루살렘을 치기 위해
  lexicon: HALOT
  rationale: 직역하면 ‘예루살렘으로’이지만, 적대적 군사 문맥에서는 한국어가 요구하는 방향성을 반영해 ‘예루살렘을 치는’으로 옮겼고, לַמִּלְחָמָה는 현대적으로 ‘전쟁’을 유지했습니다.
- source_word: וְנִלְכְּדָה הָעִיר
  english_pob_choice: and the city will be captured
  chosen_korean: 성읍은 함락될 것이고
  alternatives_korean:
  - 성읍은 점령될 것이고
  - 성읍은 사로잡힐 것이고
  lexicon: HALOT
  rationale: נלכד의 전쟁적 수동 의미를 살리면서, 성읍에 대한 공격 결과를 가장 분명히 드러내는 한국어로 ‘함락되다’를 선택했습니다.
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  english_pob_choice: and the houses plundered
  chosen_korean: 집들은 약탈당할 것이며
  alternatives_korean:
  - 집들은 노략질당할 것이며
  - 집들은 빼앗길 것이며
  lexicon: HALOT
  rationale: הבתים에 대한 전시 약탈의 뜻이므로 ‘약탈당하다’가 가장 직접적이며, 전쟁의 폭력을 완화하지 않습니다.
- source_word: וְהַנָּשִׁים תשגלנה
  english_pob_choice: and the women raped
  chosen_korean: 여자들은 성폭행당할 것이며
  alternatives_korean:
  - 여자들은 강간당할 것이며
  - 여자들은 유린당할 것이며
  lexicon: HALOT
  rationale: 히브리어의 노골적 성폭력 표현을 한국어에서도 명시적으로 드러내기 위해 ‘성폭행당하다’를 택했습니다. 전통적 완곡 표현은 원문의 잔혹성을 약화시킬 수 있습니다.
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  english_pob_choice: and half of the city will go out into exile
  chosen_korean: 성읍의 절반은 포로로 끌려갈 것이지만
  alternatives_korean:
  - 성읍의 절반은 포로로 나갈 것이지만
  - 성읍의 절반은 포로 생활로 들어갈 것이지만
  - 성읍의 절반은 유배될 것이지만
  lexicon: HALOT
  rationale: בַּגּוֹלָה는 포로 상태의 추방을 가리키므로 ‘포로로 끌려가다’가 가장 구체적이며, 한국어에서도 이동과 강제성을 함께 전달합니다.
- source_word: וְיֶתֶר הָעָם
  english_pob_choice: but the rest of the people
  chosen_korean: 남은 백성은
  alternatives_korean:
  - 나머지 백성은
  - 남은 사람들은
  lexicon: HALOT
  rationale: יֶתֶר는 ‘남은/나머지’의 뜻이므로, 예언 문맥에서 집단의 잔존을 드러내는 ‘남은 백성’으로 간결하게 옮겼습니다.
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  english_pob_choice: will not be cut off from the city
  chosen_korean: 성읍에서 끊어지지 않을 것입니다
  alternatives_korean:
  - 성읍에서 제거되지 않을 것입니다
  - 성읍에서 완전히 끊기지 않을 것입니다
  lexicon: HALOT
  rationale: כרת의 기본 이미지를 유지하되, מִן הָעִיר에 따라 ‘성읍에서’와 결합해 ‘끊어지지 않다’로 옮겼습니다. 이는 본문이 완전한 제거와 분리를 모두 암시할 수 있음을 남깁니다.
theological_decisions:
- issue: 전쟁 속 성폭력의 노골적 표현
  chosen_reading: תשגלנה를 완곡하게 돌리지 않고 ‘성폭행당할 것입니다’로 직접 옮겼습니다.
  alternative_readings:
  - 여자들은 유린당할 것입니다
  - 여자들은 강간당할 것입니다
  rationale: 원문의 잔혹성을 희석하지 않는 것이 본문이 의도한 충격을 보존하는 데 필요하며, 독자가 현실의 폭력을 오해 없이 보게 합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: לֹא יִכָּרֵת מִן הָעִיר의 의미
  chosen_reading: 주본문은 ‘성읍에서 끊어지지 않을 것입니다’로 두어 제거와 멸절의 가능성을 모두 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 성읍에서 완전히 제거되지 않을 것입니다
  - 성읍에서 멸망하지 않을 것입니다
  rationale: 히브리어의 컷오프 이미지는 제거와 파괴 사이에서 약간의 여지를 남기므로, 본문은 이미지를 보존하고 해석의 폭은 각주 없이도 열어 둡니다.
  doctrine_reference: Translation philosophy §3
