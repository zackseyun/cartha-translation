language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
  footnotes:
  - marker: a
    text: Or 'like the Arabah.' The Hebrew may compare the land to the Arabah valley/steppe rather than simply stating 'into a plain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅이 게바에서 예루살렘 남쪽의 림몬까지 평지가 되고[a], 예루살렘은 높이 들리고 제자리에 그대로 있을 것입니다. 그 범위는 베냐민 문에서 첫째 문의 자리까지, 또 모퉁이 문까지이며, 하나넬 망대에서 왕의 포도주 짜는 틀들까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아라바처럼’. 히브리어는 단순히 ‘평지’가 된다고 말하기보다, 그 땅을 아라바 계곡 또는 사막지대에 비교하는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the land
  chosen_korean: 온 땅
  alternatives_korean:
  - 그 땅 전체
  - 온 지역
  - 온 세상
  lexicon: HALOT
  rationale: 지명 경계가 붙어 있어 전 세계가 아니라 예루살렘 주변의 지역적 땅을 가리키므로, 한국어로도 범위를 과장하지 않는 ‘온 땅’이 가장 자연스럽습니다.
- source_word: כָּעֲרָבָה
  english_pob_choice: into a plain
  chosen_korean: 평지처럼 바뀌고
  alternatives_korean:
  - 아라바처럼
  - 평야처럼
  - 광야처럼
  lexicon: HALOT
  rationale: 핵심은 지형이 평탄해지는 결과이므로 의미를 직접 드러내는 ‘평지처럼’이 적절합니다. ‘아라바’의 비교 뉘앙스는 본문 본역에 과도하게 남기지 않고, 필요하면 각주로 설명할 수 있습니다.
- source_word: וְרָאֲמָה
  english_pob_choice: will be raised up
  chosen_korean: 높이 들려
  alternatives_korean:
  - 높아지고
  - 들려 올라가고
  - 높게 될
  lexicon: HALOT
  rationale: 주변 땅이 낮아지는 것과 대조되는 예루살렘의 고양을 살리기 위해, 결과 상태를 담는 ‘높이 들려’로 옮겼습니다.
- source_word: תַחְתֶּיהָ
  english_pob_choice: will remain in its place
  chosen_korean: 제자리에 머물 것입니다
  alternatives_korean:
  - 그 자리에 있을 것입니다
  - 원래 자리에서 머물 것입니다
  - 그 위치에 머물 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그 아래/제 아래에’라는 관용적 표현이지만, 문맥상 ‘자기 자리에서 안정적으로 머묾’을 뜻하므로 한국어 관용으로 풀었습니다.
- source_word: יִקְבֵי הַמֶּלֶךְ
  english_pob_choice: the king’s winepresses
  chosen_korean: 왕의 포도즙 짜는 틀
  alternatives_korean:
  - 왕의 포도주 틀
  - 왕의 포도즙 틀
  - 왕의 포도압착기
  lexicon: HALOT
  rationale: יֶקֶב은 단순한 저장 통보다 포도를 짜는 설비를 가리키므로, 현대 독자가 이해하기 쉬운 ‘포도즙 짜는 틀’로 옮겼습니다.
theological_decisions:
- issue: 지리적 범위의 해석
  chosen_reading: 예루살렘 주변의 특정 지역이 평탄해지고 예루살렘은 높여지는 상향 대조로 읽었습니다.
  alternative_readings:
  - 온 세상이 아라바처럼 변한다는 보편적 우주 변형
  - 상징적 언어로만 이해하는 해석
  rationale: 게바, 림몬, 베냐민 문, 첫째 문, 모퉁이 문 같은 구체적 경계와 표지가 이어지므로, 본문은 전 지구가 아니라 예루살렘을 중심으로 한 지역적 지형 변화를 말합니다.
  doctrine_reference: Translation philosophy §1, §3
