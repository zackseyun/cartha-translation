translation:
  language: ko
  text: 그때에 야훼께서 그 민족들에 맞서 나가 싸우실 것입니다, 전쟁의 날에 싸우실 때와 같이[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘전쟁의 날에 싸우셨던 것처럼.’ 히브리어 비교 표현에는 ‘날’이 두 번 나오며, 이 구절은 더 직역적으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: Then ... will go out
  chosen_korean: 그러면 ... 나가
  alternatives_korean:
  - 그리고 ... 나가
  - 그때 ... 나가
  lexicon: HALOT
  rationale: 예언 문맥의 연속 동작을 한국어에서 자연스럽게 이어 주기 위해 ‘그러면’으로 처리했고, ‘나가’로 동작 방향을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 신명은 프로젝트 기본어인 ‘야훼’로 옮겨, 신적 고유명을 제목어로 대체하지 않았습니다.
- source_word: בַּגּוֹיִם הָהֵם
  english_pob_choice: against those nations
  chosen_korean: 그 민족들에 맞서
  alternatives_korean:
  - 그 나라들에 대하여
  - 그 민족들을 향하여
  lexicon: HALOT
  rationale: 전쟁 동사와 결합한 ב는 대항 대상을 나타내므로 ‘맞서’가 가장 자연스럽고, גוים은 예언서 문맥에서 ‘민족들’로 옮겼습니다.
- source_word: כְּיוֹם ... בְּיוֹם קְרָב
  english_pob_choice: as when he fights in a day of battle
  chosen_korean: 마치 전쟁의 날에 싸우시던 것처럼
  alternatives_korean:
  - 전쟁의 날에 싸우실 때와 같이
  - 전투의 날에 싸우시던 것처럼
  lexicon: HALOT
  rationale: 히브리어의 비교구문은 직역보다 ‘~처럼’이 한국어에서 의미를 더 분명히 전달하며, 반복된 ‘날’의 뉘앙스는 ‘전쟁의 날’로 압축해 살렸습니다.
theological_decisions:
- issue: 야훼의 직접적 전쟁 개입을 어떻게 한국어로 드러낼지
  chosen_reading: ‘야훼께서 ... 나가 싸우실 것입니다’로, 단순한 관찰이 아니라 주체적 개입을 드러냈습니다.
  alternative_readings:
  - ‘야훼가 ... 나가서 싸울 것입니다’
  - ‘야훼께서 ... 전쟁하실 것입니다’
  rationale: 본문은 야훼가 열방을 상대로 친히 전쟁에 임하시는 장면이므로, ‘나가’와 ‘싸우실 것입니다’를 함께 써서 행위의 적극성을 보존했습니다.
  doctrine_reference: Zech 14:3; divine warrior motif
