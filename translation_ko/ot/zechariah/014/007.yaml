  source_fidelity: ‘하나의 특별한 날’은 יוֹם אֶחָד의 ‘특별함’을 본문에 명시적으로 더합니다. 문맥상 비범한 날일 수 있으나, 본문은 문자적으로 ‘한 날’이라고 하므로 이를 본문에서 유지하는 편이 안전합니다. ‘야훼께서 아시는’은 יִוָּדַע לַיהוָה를 자연스러운 현대 한국어로 충실히 옮깁니다.
