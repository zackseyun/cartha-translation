  to: 야훼께서 아시는 한 날[a][c]이 있을 것입니다. 그날은 낮도 아니고 밤도 아닐 것이나[b], 저녁 때에는 빛이 있을 것입니다.
  rationale: 본문은 יוֹם אֶחָד을 ‘한 날’로 옮겨 원문의 어휘적 여지를 보존했습니다. ‘야훼께서 아시는’은 수동형을 한국어에서 자연스럽게 표현하면서도 그 날이 야훼와 특별한 관계에 있음을 유지합니다. 낮과 밤의 역설 및 저녁의 빛은 해석적으로 해소하지 않았습니다. 각주 표지는 각각의 해당 어구 뒤로 옮겼습니다.
