  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה יוֹם אֶחָ֗ד ה֛וּא יִוָּדַ֥ע לַֽ/יהוָ֖ה לֹא י֣וֹם וְ/לֹא לָ֑יְלָה וְ/הָיָ֥ה לְ/עֵֽת עֶ֖רֶב יִֽהְיֶה אֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
  footnotes:
  - marker: a
    text: 'Or: ''one day.'' The Hebrew literally reads ''one day,'' which may emphasize either singularity or uniqueness in context.'
    reason: lexical_alternative
  - marker: b
    text: 'Or: ''neither day nor night.'''
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''known to the LORD.'''
    reason: cultural_note
translation:
  language: ko
  text: 그날은 야훼께 알려진 하나의 특별한 날이 될 것이며, 낮도 아니고 밤도 아닐 것입니다. 그러나 저녁 때가 되면 빛이 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나의 날’. 히브리어는 문자적으로 ‘하나의 날’이라고 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낮도 아니고 밤도 아니다’.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘야훼께 알려진’.'
    reason: source_note
lexical_decisions:
- source_word: יוֹם אֶחָד
  english_pob_choice: one day
  chosen_korean: 하나의 특별한 날
  alternatives_korean:
  - 하나의 날
  - 한 날
  - 하루
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘하나의 날’이지만, 문맥상 단순한 날짜보다 유일하고 두드러진 날이라는 점이 중요하므로 ‘특별한’으로 그 뉘앙스를 살렸습니다.
- source_word: יִוָּדַע לַיהוָה
  english_pob_choice: known to Yahweh
  chosen_korean: 야훼께 알려진
  alternatives_korean:
  - 야훼께 알려진 것으로
  - 야훼께 알려져 있는
  lexicon: HALOT
  rationale: 니팔형의 ‘알려지다’와 ל의 관계를 자연스러운 한국어로 옮기되, 주어가 그날임을 분명히 유지했습니다.
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  english_pob_choice: neither day nor night
  chosen_korean: 낮도 아니고 밤도 아닐 것입니다
  alternatives_korean:
  - 낮도 밤도 아닐 것입니다
  - 낮도 아니며 밤도 아닐 것입니다
  lexicon: HALOT
  rationale: 히브리어의 이중 부정을 한국어에서 대구적으로 살려, 정상적인 낮/밤 범주가 무너지는 역설을 분명하게 드러냈습니다.
- source_word: לְעֵת עֶרֶב יִהְיֶה אוֹר
  english_pob_choice: at evening time there will be light
  chosen_korean: 저녁 때가 되면 빛이 있을 것입니다
  alternatives_korean:
  - 저녁 무렵에는 빛이 있을 것입니다
  - 저녁 시간에 빛이 있을 것입니다
  lexicon: HALOT
  rationale: ‘오르’는 단순한 비유보다 실제적인 ‘빛’이므로 그대로 옮기고, 시간 표현은 한국어에서 자연스러운 조건절로 처리했습니다.
theological_decisions:
- issue: ‘그날’의 성격과 종말론적 범주
  chosen_reading: 본문이 말하는 것은 야훼께 알려진 유일하고 비정상적인 날이며, 구체적 시점이나 천문학적 메커니즘은 확정하지 않았습니다.
  alternative_readings:
  - 정확한 천문 현상으로만 이해
  - 상징적 구원 시제로만 이해
  - 특정 교단식 종말 연표로 이해
  rationale: 히브리어는 역설적 빛의 이미지를 제시하지만 그 의미를 체계적으로 해명하지 않으므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 예언 본문의 긴장 보존
