    rationale: יוֹם אֶחָד은 문자적으로 ‘한 날’입니다. 그 날의 비범함은 이어지는 서술에서 드러나므로, ‘특별한’은 각주에서 가능한 문맥적 설명으로만 다루는 것이 적절합니다.
  - severity: low
