revisions:
- from: 예루살렘과 유다에 있는 모든 솥은 만군의 야훼께 거룩하게 될 것이며, 제사하는 모든 이들이 와서 그것들 가운데서 가져다가 그것들에 삶을 것입니다. 그리고 그 날에는 만군의 야훼의 집에 더 이상 가나안 사람이 없을 것입니다.[a]
  to: 예루살렘과 유다에 있는 모든 솥은 만군의 야훼께 거룩한 것이 될 것이며, 제사를 드리는 모든 이가 와서 그 솥들 가운데서 가져다가 그 안에서 삶을 것입니다. 그날에는 만군의 야훼의 집에 더 이상 가나안 사람이 없을 것입니다.[a]
  rationale: 원문의 솥들에 대한 두 대명사(‘그것들 중에서’, ‘그것들 안에서’)의 관계를 한국어에서 분명히 하고, 조리 행위의 자연스러운 표현을 사용했습니다. כְנַעֲנִי는 본문에서 ‘가나안 사람’으로 보존하고 가능한 상업적 의미는 각주로 처리했습니다. 의미나 신학적 긴장은 변경하지 않았습니다.
