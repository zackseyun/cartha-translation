source:
  edition: WLC
  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
  footnotes:
  - marker: a
    text: Or 'merchant' or 'trader'; the Hebrew word can carry that sense in some contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘과 유다에 있는 모든 솥은 만군의 야훼께 거룩한 것이 될 것이며, 제사를 드리는 모든 이가 와서 그 솥들 가운데서 가져다가 그 안에서 삶을 것입니다. 그날에는 만군의 야훼의 집에 더 이상 가나안 사람이 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상인’, ‘장사꾼’으로 옮길 수 있습니다. 히브리어 단어는 일부 문맥에서 이러한 뜻을 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר
  english_pob_choice: pot
  chosen_korean: 솥
  alternatives_korean:
  - 냄비
  - 가마
  lexicon: HALOT
  rationale: 제사와 끓이는 용도를 고려하면 단순한 조리기구보다 더 큰 솥이 자연스럽고, 뒤의 ‘삶을 것입니다’와도 잘 맞습니다.
- source_word: קֹדֶשׁ
  english_pob_choice: holy
  chosen_korean: 거룩하게 될
  alternatives_korean:
  - 성결하게 될
  - 성스러워질
  lexicon: HALOT
  rationale: 여기서는 상태를 나타내는 형용사적 용법이므로, 물건이 야훼께 속하도록 구별된다는 의미를 살려 ‘거룩하게 될’로 옮겼습니다.
- source_word: כְנַעֲנִי
  english_pob_choice: Canaanite
  chosen_korean: 가나안 사람
  alternatives_korean:
  - 상인
  - 장사꾼
  lexicon: HALOT
  rationale: 본문은 기본적으로 민족명 형태를 유지하되, 상업적 의미 가능성은 영어 주석과 맞추어 본문 밖에서 검토할 수 있게 했습니다.
- source_word: בְּבֵית יְהוָה צְבָא֖וֹת
  english_pob_choice: in the house of Yahweh of hosts
  chosen_korean: 만군의 야훼의 집
  alternatives_korean:
  - 만군의 야훼 성전
  - 만군의 야훼 집
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘집’을 살리면서, 예배 처소를 가리키는 문맥을 한국어로 자연스럽게 드러냈습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그 날에는
  alternatives_korean:
  - 그 날에
  - 그 날
  lexicon: HALOT
  rationale: 예언서의 정형적 시간표현을 한국어 관용에 맞게 살렸고, 문장 흐름상 부사어 자리에 두었습니다.
theological_decisions:
- issue: 마지막 절의 כְנַעֲנִי 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 ‘가나안 사람’을 유지합니다.
  alternative_readings:
  - 상인
  - 장사꾼
  rationale: 예루살렘과 유다의 거룩함이 절정에 이르는 종말론적 이미지에서, 상업적 의미로 미리 풀어버리기보다 민족명 형태를 보존하는 편이 본문의 날카로움을 유지합니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해소하지 말고 보존하기
- issue: יהוה צְבָאוֹת의 호칭 처리
  chosen_reading: ‘만군의 야훼’로 옮겼습니다.
  alternative_readings:
  - 만군의 주님
  - 만군의 여호와
  rationale: 프로젝트 기본어인 ‘야훼’를 따르되, צְבָאוֹת의 관용적 예언자 호칭을 보존하여 본문의 공적·전쟁적 울림을 유지합니다.
  doctrine_reference: 프로젝트 용어집 기본값
