    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 온 땅의 왕이 되실 것입니다[a]. 그날에 야훼께서는 하나이실 것이며, 그의 이름도 하나일 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅’은 문맥에 따라 ‘땅’ 또는 ‘나라’를 뜻할 수 있습니다. 여기서는 문맥상 ‘온 땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 이름도 홀로일 것입니다’ 또는 ‘그의 이름도 유일할 것입니다’. 히브리어 ‘하나’는 유일성, 배타성, 단일성을 아울러 표현할 수 있습니다.
    reason: lexical_alternative
