  rationale: 본문의 압축된 표현을 확장하지 않고 ‘하나’로 옮겨, 단일성·유일성·배타성을 둘 다 열어 둔 채 원문의 긴장을 보존했습니다.
theological_decisions:
- issue: ‘야훼께서 … 하나’의 신학적 긴장 보존
  chosen_reading: ‘하나이실 것이며, 그의 이름도 하나일 것입니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘야훼께서 홀로 계실 것입니다’
  - ‘야훼께서 유일하실 것입니다’
  rationale: 원문은 하나님의 유일성과 통일성을 함축하지만, 본문 자체는 그 의미를 한쪽으로만 고정하지 않습니다. 따라서 해석을 과도하게 좁히지 않고 독자가 문맥 속에서 신학적 함의를 듣도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
