source:
  edition: WLC
  text: וְ/הָיָ֧ה יְהוָ֛ה לְ/מֶ֖לֶךְ עַל כָּל הָ/אָ֑רֶץ בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֧ה יְהוָ֛ה אֶחָ֖ד וּ/שְׁמ֥/וֹ אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
  footnotes:
  - marker: a
    text: Or 'the LORD will be alone'; the Hebrew says 'one,' which can express exclusivity or uniqueness as well as oneness.
    reason: lexical_alternative
  - marker: b
    text: Or 'and his name alone' or 'and his name unique.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 온 땅의 왕이 되실 것입니다[a]. 그 날에 야훼께서는 하나이실 것이며, 그의 이름도 하나일 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 홀로 왕이 되실 것입니다’. 히브리어의 ‘왕이 되다’는 왕권의 확립을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 이름만 홀로’ 또는 ‘그의 이름이 유일할 것입니다’. 히브리어의 ‘하나’는 유일성, 배타성, 단일성을 아울러 표현할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / POB deity-name convention
  rationale: 원문의 여호와 이름을 제목어로 치환하지 않고 고유명사로 드러내기 위해 POB 기본값인 ‘야훼’를 사용했습니다.
- source_word: לְמֶלֶךְ עַל כָּל הָאָרֶץ
  english_pob_choice: will be king over all the earth
  chosen_korean: 온 땅의 왕이 되실 것입니다
  alternatives_korean:
  - 온 땅 위에 왕이 되실 것입니다
  - 온 땅을 다스리는 왕이 되실 것입니다
  lexicon: HALOT
  rationale: 왕권의 상태를 나타내는 לְמֶלֶךְ는 한국어에서 ‘왕이 되다’가 자연스럽고, עַל כָּל הָאָרֶץ는 ‘온 땅’으로 넓은 지배 범위를 살렸습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날에는
  - 그 날
  lexicon: HALOT
  rationale: 예언서의 전형적 시간 표지로서 간결하게 ‘그 날에’로 옮겨 미래적·종말론적 맥락을 유지했습니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 하나이실 것이며
  alternatives_korean:
  - 홀로이실 것이며
  - 유일하실 것이며
  lexicon: HALOT
  rationale: 본문의 압축된 표현을 확장하지 않고 ‘하나’로 옮겨, 단일성·유일성·배타성을 둘 다 열어 둔 채 원문의 긴장을 보존했습니다.
theological_decisions:
- issue: ‘야훼께서 … 하나’의 신학적 긴장 보존
  chosen_reading: ‘하나이실 것이며, 그의 이름도 하나일 것입니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘야훼께서 홀로 계실 것입니다’
  - ‘야훼께서 유일하실 것입니다’
  rationale: 원문은 하나님의 유일성과 통일성을 함축하지만, 본문 자체는 그 의미를 한쪽으로만 고정하지 않습니다. 따라서 해석을 과도하게 좁히지 않고 독자가 문맥 속에서 신학적 함의를 듣도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
