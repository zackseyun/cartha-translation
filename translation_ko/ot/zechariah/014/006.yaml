base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
  footnotes:
  - marker: a
    text: 'Or, following another traditional construal: “there will be no light, cold, or frost.” The Hebrew of the final clause is difficult and has been understood in several ways.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 날에 이럴 것입니다. 빛이 없을 것이며, 영광스러운 것들이 얼어붙을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 전통적 이해를 따르면, “빛이 없고 냉기나 서리가 있을 것이다”라고도 옮길 수 있습니다. 히브리어 마지막 절은 어렵고 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה / בַּיּוֹם הַהוּא
  english_pob_choice: And it will happen on that day
  chosen_korean: 그리고 그 날에 이럴 것입니다
  alternatives_korean:
  - 그 날에 이렇게 될 것입니다
  - 그 날에 일어날 일은 이렇습니다
  lexicon: HALOT
  rationale: 예언적 시간 표지를 자연스러운 현대 한국어로 옮기되, 미래 사건의 도입이라는 기능을 유지했습니다.
- source_word: לֹא יִהְיֶה אוֹר
  english_pob_choice: there will be no light
  chosen_korean: 빛이 없을 것이며
  alternatives_korean:
  - 어둠이 있을 것이며
  - 빛이 없겠습니다
  lexicon: HALOT
  rationale: 부정 존재문을 직역에 가깝게 옮겨, 원문의 단순한 진술과 선명한 대비를 보존했습니다.
- source_word: יְקָרוֹת
  english_pob_choice: the glorious ones
  chosen_korean: 영광스러운 것들
  alternatives_korean:
  - 빛나는 것들
  - splendid한 것들
  - 귀한 것들
  lexicon: HALOT
  rationale: 문맥상 해석이 어려운 명사화된 형용사로 보이므로, POB의 ‘glorious ones’를 따라 과도한 해석 없이 형용사적 명사구로 옮겼습니다.
- source_word: יקפאון
  english_pob_choice: will congeal
  chosen_korean: 얼어붙을 것입니다
  alternatives_korean:
  - 응고될 것입니다
  - 얼 것입니다
  - 굳어질 것입니다
  lexicon: HALOT
  rationale: 어근의 물리적 응고/동결 이미지를 한국어에서 가장 자연스럽고 구체적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 표현 יְקָרוֹת יקפאון의 처리
  chosen_reading: 본문의 마소라 본문을 따라 ‘영광스러운 것들’이 ‘얼어붙는다’는 직역에 가까운 표현을 유지했습니다.
  alternative_readings:
  - ‘냉기나 서리가 없을 것이다’라는 고전 번역 전통
  - ‘빛이 줄어들 것이다’ 같은 해석적 완화
  rationale: 히브리어가 매우 난해하므로 해석을 미리 정리하기보다, 원문이 주는 낯선 이미지와 긴장을 그대로 전달하는 쪽이 POB 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
