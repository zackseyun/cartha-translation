id: ZEC.14.11
reference: Zechariah 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָ֣שְׁבוּ בָ֔/הּ וְ/חֵ֖רֶם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/יָשְׁבָ֥ה יְרוּשָׁלִַ֖ם לָ/בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
  footnotes:
  - marker: a
    text: Or 'there will no longer be a curse'; Hebrew חֵרֶם can also refer to something placed under a ban or devoted to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그 안에 거주할 것이며, 다시는 전적으로 멸절에 바쳐진 것이 없을 것이며, 예루살렘은 안전하게 거주할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 이상 저주가 없을 것이다’. 히브리어 חֵרֶם은 금지되거나 멸절에 바쳐진 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  english_pob_choice: they will dwell in it
  chosen_korean: 그들이 그 안에 거주할 것이며
  alternatives_korean:
  - 그들이 그 안에 살 것이며
  - 그들이 그 안에 거주합니다
  lexicon: HALOT
  rationale: ישׁב의 기본 의미인 ‘거주하다’를 살려 정착·상주 뉘앙스를 보존했습니다. 주어를 영어처럼 임의로 ‘사람들’로 풀지 않고, 히브리어의 생략된 3인칭 복수 주어를 그대로 반영했습니다.
- source_word: חֵרֶם
  english_pob_choice: anything devoted to destruction
  chosen_korean: 전적으로 멸절에 바쳐진 것
  alternatives_korean:
  - 저주
  - 진멸에 바쳐진 것
  - 금지된 것
  lexicon: HALOT
  rationale: חֵרֶם의 핵심은 단순한 ‘저주’보다 하나님의 심판 아래 ‘멸절에 바쳐진 상태’입니다. 한국어에서는 그 신학적 무게를 살리면서도 오해를 줄이기 위해 ‘전적으로 멸절에 바쳐진 것’으로 옮겼습니다.
- source_word: לָבֶטַח
  english_pob_choice: securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 확실히
  - 안심하고
  lexicon: HALOT
  rationale: בטח 계열의 뜻은 안전·확신의 상태이므로, 문맥상 도시의 거주 상태를 자연스럽게 나타내는 ‘안전하게’를 선택했습니다. ‘평안히’보다 물리적 안전의 뉘앙스가 더 분명합니다.
theological_decisions:
- issue: חֵרֶם의 종말론적 의미
  chosen_reading: 도시 안에서 더 이상 ‘멸절에 바쳐진 것’이 존재하지 않는다는 선언으로 번역했습니다.
  alternative_readings:
  - 저주가 더 이상 없다
  - 멸절/진멸이 없다
  rationale: 예언 문맥은 예루살렘의 완전한 회복과 보호를 말하지만, חֵרֶם 자체를 추상적 ‘저주’로 넓히면 본문이 말하는 심판-전용의 뉘앙스가 약해집니다. 따라서 번역은 심판의 구체성을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
