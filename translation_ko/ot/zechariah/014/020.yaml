source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
  footnotes:
  - marker: a
    text: Or, “Holiness to the LORD.” The Hebrew phrase echoes the inscription on the high priest’s gold plate in Exodus 28:36.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may refer to small jingling metal pieces on horse gear; 'bells' is the most likely sense.
    reason: cultural_note
  - marker: c
    text: Or, “basins” for “bowls.” These were sacred vessels used in temple ritual.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 말들의 방울에 “야훼께 거룩함”이 있을 것이며, 야훼의 집에 있는 솥들은 제단 앞의 대접들과 같을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼께 거룩함’은 “여호와께 성결”로도 옮길 수 있는 관용적 제의 문구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘방울’은 말 장비에 달린 작은 금속성 울림 장치를 가리킬 가능성이 가장 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘대접들’은 제의 때 피나 제물을 담는 성전용 그릇을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그날에
  - 그 날에는
  lexicon: HALOT
  rationale: 예언 문맥의 정형화된 시점 표현을 현대 한국어로 자연스럽게 살리면서, 종말론적 지시성을 유지했습니다.
- source_word: מְצִלּוֹת הַסּוּס
  english_pob_choice: the bells of the horses
  chosen_korean: 말들의 방울
  alternatives_korean:
  - 말의 방울
  - 말 장식의 방울
  - 말의 달랑거리는 장식
  lexicon: HALOT
  rationale: מְצִלּוֹת는 작은 금속성 방울류를 가리키므로 ‘방울’이 가장 직접적입니다. הַסּוּס를 복수적으로 옮겨 한국어에서 자연스럽게 일반적 의미를 드러냈습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: Holy to Yahweh
  chosen_korean: 야훼께 거룩함
  alternatives_korean:
  - 야훼께 거룩함을
  - 야훼께 거룩합니다
  - 야훼께 속한 거룩함
  lexicon: HALOT
  rationale: 출애굽기 28:36의 제사장 패 문구를 반영하는 짧은 표어형 표현으로, 단순한 상태 진술보다 헌납/전속의 뉘앙스를 더 잘 드러냅니다.
- source_word: הַסִּירוֹת
  english_pob_choice: the pots
  chosen_korean: 솥들
  alternatives_korean:
  - 냄비들
  - 가마솥들
  - 솥
  lexicon: HALOT
  rationale: 성전 관련 조리·끓이기 용기를 가리키므로 일상어 ‘솥’이 가장 무난하며, 복수형을 살려 대비 구조를 유지했습니다.
- source_word: כַּמִּזְרָקִים
  english_pob_choice: like the bowls
  chosen_korean: 대접들과 같을 것입니다
  alternatives_korean:
  - 그릇들과 같을 것입니다
  - 바알들과 같을 것입니다
  - 주발들과 같을 것입니다
  lexicon: HALOT
  rationale: מִזְרָקִים는 제의용 혈기/제물용 대접을 가리키므로, 성전 제의성을 유지하는 ‘대접’이 ‘그릇’보다 정확합니다.
theological_decisions:
- issue: 일상 기물과 성전 기물의 구분 약화
  chosen_reading: 말의 방울과 성전의 솥이 모두 ‘야훼께 거룩함’의 질서 안에 놓이는 미래상을 그대로 드러냈습니다.
  alternative_readings:
  - 일반적인 번영의 은유로 완화하는 읽기
  - 상징적 정결만을 말하는 읽기
  rationale: 본문은 거룩한 것과 일반적인 것의 경계가 재구성되는 모습을 직접적으로 말하므로, 이를 약화하지 않고 보존하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: Zech 14:20; Exod 28:36
