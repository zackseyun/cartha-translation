revisions:
- from: 그때 살아남은 모든 이들, 곧 예루살렘을 치러 왔던 모든 민족 가운데서 남은 자들은 해마다 올라와 만군의 야훼, 곧 왕께 경배하고 초막절을 지켜야 합니다.[a][b]
  to: 그때 예루살렘을 치러 왔던 모든 민족 가운데서 살아남은 사람들은 해마다 올라가 왕이신 만군의 야훼께 경배하고 초막절을 지킬 것입니다.
  rationale: 미래적 예언 서술을 ‘지킬 것입니다’로 보존하고, 중복된 ‘남음/생존’ 표현을 하나로 정리했습니다. ‘왕’과 ‘만군의 야훼’의 동격 관계는 ‘왕이신 만군의 야훼’로 자연스럽게 반영했습니다. 의미 있는 본문 대안을 제공하지 못하는 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:53Z'
