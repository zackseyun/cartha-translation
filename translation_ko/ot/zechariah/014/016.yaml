  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
  footnotes:
  - marker: a
    text: Or traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or traditionally, 'the Feast of Tabernacles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 살아남은 모든 이들, 곧 예루살렘을 치러 왔던 모든 민족 가운데서 남은 자들은 해마다 올라와 만군의 야훼, 곧 왕께 경배하고 초막절을 지켜야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로, ‘초막절’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 히브리어 본문의 ‘만군의 야훼’를 직역해 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל הַנּוֹתָר מִכָּל הַגּוֹיִם
  english_pob_choice: all who remain from all the nations
  chosen_korean: 모든 이들, 곧 ... 남은 자들
  alternatives_korean:
  - 모든 생존자들
  - 남은 모든 사람들
  lexicon: HALOT
  rationale: הַנּוֹתָר는 단순한 추상명사보다 ‘남아 있는 자들/남은 자들’의 뜻이 분명하므로, 문맥상 생존·잔존의 의미를 살려 옮겼습니다.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  english_pob_choice: that came against Jerusalem
  chosen_korean: 예루살렘을 치러 왔던
  alternatives_korean:
  - 예루살렘을 대적하러 왔던
  - 예루살렘에 맞서 온
  lexicon: HALOT
  rationale: עַל + ‘오다’는 군사적 적대 행위를 가리키는 관용이므로, ‘치러 오다’로 옮겨 공격성을 분명히 했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 군대의 야훼
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 그대로 ‘야훼’로 두고, צְבָאוֹת는 POB의 ‘of Armies’ 취지를 따라 ‘만군’으로 옮겨 전쟁적·천상적 군대의 뜻을 살렸습니다.
- source_word: חַג הַסֻּכּוֹת
  english_pob_choice: the Feast of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 초막의 절기
  lexicon: HALOT
  rationale: 축제 명칭은 한국 교계에 널리 알려진 ‘초막절’을 기본으로 하되, 히브리어 סֻכּוֹת의 임시 거처 이미지를 보존합니다.
theological_decisions:
- issue: 왕칭호와 하나님의 이름의 병렬 구조
  chosen_reading: ‘만군의 야훼, 곧 왕’으로 두 호칭을 함께 살렸습니다.
  alternative_readings:
  - ‘왕이신 만군의 야훼’
  - ‘만군의 야훼 왕’
  rationale: 히브리어는 ‘왕’과 ‘야훼 צְבָאוֹת’를 나란히 두어 예배의 대상이 누구인지 강조하므로, 한국어에서도 동격 관계를 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source emphasis and tension'
- issue: 예언문의 미래적 명령형 뉘앙스
  chosen_reading: ‘해야 합니다’로 종말적 예언의 규범성을 살렸습니다.
  alternative_readings:
  - ‘할 것입니다’
  - ‘하게 될 것입니다’
  rationale: 히브리어의 목적·의무 뉘앙스를 단순 미래보다 규범적으로 전달하는 것이 본문의 예언적 강도를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve prophetic force without over-resolving eschatology'
