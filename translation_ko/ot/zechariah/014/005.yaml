id: ZEC.14.5
reference: Zechariah 14:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
  footnotes:
  - marker: a
    text: Or, following another reading, 'with you.'
    reason: textual_variant
  - marker: b
    text: '''Holy ones'' may refer to heavenly attendants; some understand it as ''saints'' or ''angels.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 내 산들의 골짜기로 도망할 것입니다[a]. 골짜기가 하아살에 이를 것이기 때문입니다. 너희는 유다 왕 웃시야의 날에 지진에서 도망한 것처럼 도망할 것입니다. 그러면 야훼 나의 하나님께서 오시고[b], 모든 거룩한 이들이 그와 함께할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 읽기에 따르면 ‘너희와 함께’라는 뜻으로도 볼 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘거룩한 이들’은 하늘의 수행원, 성도, 또는 천사들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַסְתֶּם
  english_pob_choice: you will flee
  chosen_korean: 도망할 것입니다
  alternatives_korean:
  - 피할 것입니다
  - 달아날 것입니다
  lexicon: HALOT
  rationale: 반복되는 동사 נוּס의 기본 의미를 살려, 문맥상 실제 ‘도망함’을 분명히 드러내는 표현을 택했습니다.
- source_word: גֵּיא הָרַי
  english_pob_choice: the valley of my mountains
  chosen_korean: 내 산들의 골짜기
  alternatives_korean:
  - 내 산의 골짜기
  - 산들의 골짜기
  lexicon: HALOT
  rationale: 1인칭 소유격 ‘내’를 보존하고, 복수형 ‘산들’도 그대로 반영해 지형적 이미지를 유지했습니다.
- source_word: יְהוָה אֱלֹהַי
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼 나의 하나님
  alternatives_korean:
  - 여호와 나의 하나님
  - 주 나의 하나님
  lexicon: HALOT
  rationale: 여호와 대체어 대신 하나님의 고유명인 야훼를 유지하고, 1인칭 소유격 ‘나의 하나님’도 그대로 살렸습니다.
- source_word: כָּל קְדֹשִׁים
  english_pob_choice: all the holy ones
  chosen_korean: 모든 거룩한 이들
  alternatives_korean:
  - 모든 성도들
  - 모든 거룩한 자들
  - 모든 천사들
  lexicon: HALOT
  rationale: קדושים의 의미를 천사나 성도로 미리 한정하지 않고, 본문의 열린 범위를 살리는 중립적 표현을 택했습니다.
theological_decisions:
- issue: וְ/נַסְתֶּם의 문맥상 의미
  chosen_reading: ‘도망할 것입니다’로 번역해, 산의 골짜기로 실제로 피신하는 장면을 살렸습니다.
  alternative_readings:
  - ‘막힐 것입니다’
  - ‘빠져나갈 것입니다’
  rationale: 바로 뒤의 비교절 ‘지진에서 도망한 것처럼’이 반복되므로, 본문이 말하는 긴급한 피난의 의미를 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3 Preserve source-level tension and imagery
