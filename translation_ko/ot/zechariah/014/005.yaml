review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 지명 אָצַל은 ‘아살’로 음역해야 하며, WLC 본문의 마지막 עִמָּךְ는 ‘당신과 함께’입니다. 초안의 ‘하아살’과 ‘그와 함께’는 각각 지명 및 인칭 접미사를 충실히 반영하지 못합니다.
  naturalness: ‘내 산들의 골짜기’, ‘도망할 것입니다’, ‘모든 거룩한 이들’은 현대 표준 한국어 합쇼체에서 자연스럽고 본문의 열린 의미를 유지합니다. 다만 ‘야훼 나의 하나님’은 호격성 삽입을 쉼표로 표시하면 더 자연스럽습니다.
  terminology: ‘야훼’, ‘나의 하나님’, ‘거룩한 이들’은 각각 신명, 1인칭 소유 접미사, קדשים의 미확정 지시 범위를 적절히 보존합니다. ‘거룩한 이들’을 성도나 천사로 한정하지 않습니다.
  issues:
  - severity: high
    issue: אָצַל의 지명이 ‘하아살’로 번역되었습니다.
    rationale: 히브리어 אָצַל은 고유지명 Azal이며, 한국어 음역은 ‘아살’이 적절합니다. ‘하아살’은 원문이나 통상 음역에 근거하지 않습니다.
  - severity: high
    issue: 마지막 עִמָּךְ가 ‘그와 함께’로 바뀌었습니다.
    rationale: 제시된 WLC 본문은 2인칭 접미사를 사용하므로 ‘당신과 함께’로 옮겨야 합니다. ‘그와 함께’는 영어 감사 문구의 다른 읽기를 본문으로 채택한 것이며 WLC와 맞지 않습니다.
  - severity: medium
    issue: 본문의 이문 각주가 첫 문장에 잘못 연결되어 있습니다.
    rationale: ‘너희와 함께/그와 함께’의 이문은 마지막 עִמָּךְ 구절과 관련되므로, 각주 표지는 마지막 ‘당신과 함께’에 붙여야 합니다. WLC 본문을 따르는 본문에는 ‘당신과 함께’를 두고, 다른 읽기 ‘그와 함께’를 각주에 제시하는 것이 적절합니다.
  revised_text: 너희는 내 산들의 골짜기로 도망할 것입니다. 산들의 골짜기가 아살에 이를 것이기 때문입니다. 너희는 유다 왕 웃시야 시대에 지진을 피해 도망한 것처럼 도망할 것입니다. 그러면 야훼, 나의 하나님께서 오실 것이며, 모든 거룩한 이들이 당신과 함께할 것입니다[a].
  revised_footnotes:
  - marker: a
    text: 다른 읽기에는 ‘그와 함께’라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘거룩한 이들’은 하늘의 수행원, 성도, 또는 천사들을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: WLC의 אָצַל과 עִמָּךְ를 각각 ‘아살’과 ‘당신과 함께’로 반영했습니다. 관련 이문 각주를 마지막 구절로 옮겼습니다. ‘거룩한 이들’의 지시 대상은 본문에서 특정하지 않고, 설명 각주로만 가능한 범위를 제시했습니다.
