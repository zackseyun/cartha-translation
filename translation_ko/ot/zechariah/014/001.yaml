  source_fidelity: 히브리어의 לַיהוָה는 전통적인 ‘야훼의 날’과 관련된 표현이지만, 단순한 소유격으로만 평탄화하지 않는 것이 좋습니다. 다만 ‘야훼를 위한 날’은 한국어에서 야훼의 유익을 위한 날이라는 뜻으로 쉽게 읽혀 관계의 의미를 좁힐 수 있습니다. ‘야훼께 속한 날’은 원문의 귀속·관계 범위를 더 자연스럽게 보존합니다. וְחֻלַּק의 수동 의미와 בְּקִרְבֵּךְ의 장소 의미는 ‘나누어질 것입니다’와 ‘네 가운데에서’로 충실히 드러납니다.
