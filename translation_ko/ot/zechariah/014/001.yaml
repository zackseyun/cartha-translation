  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה יֽוֹם בָּ֖א לַֽ/יהוָ֑ה וְ/חֻלַּ֥ק שְׁלָלֵ֖/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'a day of the LORD is coming.' The Hebrew reads literally 'a day is coming for the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 야훼를 위한 날이 옵니다. 그때에 당신의 노략물이 당신의 한가운데에서 나뉘어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 전통적으로는 ‘주의 날이 옵니다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘야훼를 위한 날이 옵니다’라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 예언적 발표를 여는 주의 환기 표현으로, 현대 한국어에서 격식 있고 직접적인 ‘보십시오’가 ‘Behold’의 경고·선포 기능을 잘 살립니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼의
  - 야훼에게 속한
  lexicon: HALOT
  rationale: 히브리어 ל는 소유격 ‘-의’보다 관계·귀속의 폭이 넓으므로, 본문 직역성을 살리면서도 POB의 source-direct 방향에 맞게 ‘야훼를 위한’으로 옮겼습니다.
- source_word: וְחֻלַּק
  english_pob_choice: will be divided
  chosen_korean: 나뉘어질 것입니다
  alternatives_korean:
  - 분배될 것입니다
  - 나누어질 것입니다
  lexicon: HALOT
  rationale: 수동 분사/피엘 수동형의 미래적 용법을 자연스러운 합쇼체로 옮기되, 전리품이 강제로 분할되는 뉘앙스를 ‘나뉘어질’로 유지했습니다.
- source_word: בְּקִרְבֵּךְ
  english_pob_choice: in your midst
  chosen_korean: 당신의 한가운데에서
  alternatives_korean:
  - 당신 가운데에서
  - 당신 안에서
  lexicon: HALOT
  rationale: 도시를 향한 2인칭 여성 단수의 공간적 표현을 살리기 위해, 공동체 내부를 가리키는 관용을 한국어로 가장 자연스럽게 드러내는 ‘한가운데에서’를 택했습니다.
theological_decisions:
- issue: לַיהוָה의 문법적 관계를 어떻게 살릴 것인가
  chosen_reading: 본문은 전통적 관용구 ‘주의 날’로 평탄화하지 않고, 야훼와 직접 관련된 날이라는 문법적 긴장을 드러내는 ‘야훼를 위한 날’로 유지했습니다.
  alternative_readings:
  - 야훼의 날
  - 주님의 날
  rationale: 히브리어는 ‘야훼의 날’에 해당하는 단순 소유 구문이 아니라 ל 전치사 구문이므로, 원문이 주는 비평적 긴장을 보존하는 것이 중요합니다. 다만 예언 전통의 연관성은 본문 자체로 충분히 암시됩니다.
  doctrine_reference: 'Translation philosophy §1, §3; Contested terms: יְהוָה → 야훼'
