  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
  footnotes:
  - marker: a
    text: Or 'all the nations.' The Hebrew עַמִּים can denote peoples or nations depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 야훼께서 예루살렘을 상대로 전쟁을 벌인 모든 민족을 치실 재앙입니다. 그들이 아직 제 발로 서 있는 동안 그들의 살이 썩어 버릴 것이고, 그들의 눈이 눈구멍 안에서 썩어 버릴 것이며, 그들의 혀가 입 안에서 썩어 버릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַמִּים는 문맥에 따라 ‘민족들’ 또는 ‘백성들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 대체어가 아닌 신명기적 고유명 יְהוָה를 직접 쓰므로, POB 방침에 따라 한국어도 신적 칭호가 아닌 고유명인 야훼로 옮겼습니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 역병
  - 그 타격
  - 그 질병
  lexicon: HALOT
  rationale: 이 단어는 질병만이 아니라 하나님이 내리시는 치명적 심판 전체를 가리킬 수 있으므로, 문맥을 좁히지 않는 ‘재앙’으로 옮겼습니다.
- source_word: יִגֹּף
  english_pob_choice: will strike
  chosen_korean: 치실
  alternatives_korean:
  - 때리실
  - 내리실
  - 치실 것입니다
  lexicon: HALOT
  rationale: 동사 נגף의 핵심은 ‘치다/치명적으로 ضرب하다’이므로, 심판의 능동성을 살리는 ‘치다’ 계열 표현을 택했습니다.
- source_word: כָּל־הָעַמִּים
  english_pob_choice: all the peoples
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 백성들
  - 모든 사람들
  - 모든 민족들
  lexicon: HALOT
  rationale: עַמִּים는 문맥상 ‘백성/민족들’을 모두 포함할 수 있지만, 전쟁을 벌인 집단들을 가리키는 이 절에서는 한국어에서 가장 자연스럽고 집합성을 살리는 ‘민족’이 적절합니다.
- source_word: הָמֵק ... וְעֵינָיו ... וּלְשׁוֹנוֹ
  english_pob_choice: will rot away ... will rot away ... will rot away
  chosen_korean: 썩어 버릴 것이고 ... 썩어 버릴 것이며 ... 썩어 버릴 것입니다
  alternatives_korean:
  - 무너져 내릴
  - 문드러질
  - 녹아 버릴
  lexicon: HALOT
  rationale: 세 번 반복되는 מקק 계열 표현의 충격을 유지하기 위해, 완곡화하지 않고 동일하게 ‘썩어 버리다’로 맞추었습니다.
theological_decisions:
- issue: 여호와 신명사와 심판 묘사의 직설성
  chosen_reading: 고유명 야훼를 그대로 드러내고, 신체 부패의 장면도 비유로 약화하지 않았습니다.
  alternative_readings:
  - 주님으로 대체하기
  - 상징적 패배로 완화하기
  - 질병 중심으로 특정하기
  rationale: 본문은 야훼의 직접적 심판과 몸의 붕괴를 함께 제시하므로, 고유명과 강한 이미지 둘 다 유지하는 것이 원문의 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
