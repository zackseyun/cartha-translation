  source_fidelity: 초안은 야훼의 직접적인 심판과 신체가 썩는 반복 묘사를 대체로 충실히 보존합니다. 그러나 צָבְאוּ עַל의 군사적 의미가 ‘예루살렘을 치려고 나아간’에서는 다소 약하고 목적 이동처럼 들립니다. 또한 복수 집단을 받은 뒤의 단수 대명사 연쇄는 히브리어의 분배적 단수를 기계적으로 따른 것으로, 한국어에서는 불자연스럽고 지시 대상이 흔들립니다.
  naturalness: ‘그는 아직 자기 발로 서 있는 동안에 그의 살’은 앞선 ‘모든 민족’과 수가 맞지 않아 현대 표준 한국어에서 어색합니다. 복수형 ‘그들이/그들의’를 사용하고, 눈의 위치는 ‘제자리’보다 ‘눈구멍 안’으로 구체화하는 편이 원문의 חֹרֵיהֶן에 더 가깝습니다.
