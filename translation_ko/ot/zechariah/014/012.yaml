revisions:
- from: 그리고 이것이 그 재앙이 될 것입니다. 곧 예루살렘을 치려고 나아간 모든 민족을 야훼께서 치실 것인데, 그는 아직 자기 발로 서 있는 동안에 그의 살이 썩어 버릴 것이고, 그의 눈이 제자리에서 썩어 버릴 것이며, 그의 혀도 그의 입에서 썩어 버릴 것입니다.[a]
  to: 이것은 야훼께서 예루살렘을 상대로 전쟁을 벌인 모든 민족을 치실 재앙입니다. 그들이 아직 제 발로 서 있는 동안 그들의 살이 썩어 버릴 것이고, 그들의 눈이 눈구멍 안에서 썩어 버릴 것이며, 그들의 혀가 입 안에서 썩어 버릴 것입니다.[a]
  rationale: 군사 동사의 의미를 ‘전쟁을 벌인’으로 명시하고, 히브리어의 분배적 단수는 한국어의 자연스러운 복수 표현으로 옮겼습니다. 세 차례 반복되는 부패 동사와 심판의 직접성은 유지했으며, 재앙의 구체적 기제를 질병으로 한정하지 않았습니다.
