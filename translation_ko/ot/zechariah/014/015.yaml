id: ZEC.14.15
reference: Zechariah 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
  footnotes:
  - marker: a
    text: Or 'like this plague.' The Hebrew compares the animals' judgment to the plague just described.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이와 같이 말입니다. 말과 노새와 낙타와 나귀와, 그 진영들에 있는 모든 짐승에게 그 재앙이 임할 것입니다. 곧 이 재앙과 같은 재앙입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 재앙과 같이.” 히브리어는 동물들에게 내릴 심판이 바로 앞에서 말한 재앙과 대응함을 비교합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고 이와 같이
  alternatives_korean:
  - 그리고 그러므로
  - 그리하여
  lexicon: HALOT
  rationale: 앞 절의 심판과의 대응을 자연스럽게 잇되, 단순한 인과보다 대응·연속의 뉘앙스를 살렸습니다.
- source_word: מַגֵּפַת
  english_pob_choice: the plague
  chosen_korean: 재앙
  alternatives_korean:
  - 역병
  - 염병
  - 타격
  lexicon: HALOT
  rationale: 문맥상 야훼의 징벌을 가리키므로 한국어로는 ‘재앙’이 가장 넓고 직접적입니다. 동물에게까지 미치는 심판의 성격을 유지합니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: every animal
  chosen_korean: 모든 짐승
  alternatives_korean:
  - 모든 가축
  - 모든 동물
  lexicon: HALOT
  rationale: 문맥상 진영 안에 있는 가축성 동물을 포함한 포괄적 표현이므로, ‘짐승’이 본문의 범위를 넓게 살리면서도 자연스럽습니다.
- source_word: בַּמַּחֲנוֹת הָהֵמָּה
  english_pob_choice: those camps
  chosen_korean: 그 진영들에 있는
  alternatives_korean:
  - 그 진영들 안에 있는
  - 그 군대들에 있는
  lexicon: HALOT
  rationale: מַחֲנוֹת는 군사적 ‘진영’이 기본 뜻이므로, ‘군대’보다 장소적 의미를 살리는 ‘진영’이 더 직접적입니다.
theological_decisions:
- issue: 동물에게까지 미치는 동일한 심판의 범위
  chosen_reading: 사람들에게 내린 재앙과 동일한 재앙이 진영 안의 동물들에게도 미친다는 직선적 표현을 유지했습니다.
  alternative_readings:
  - 동물들에게도 막연한 피해가 간다고 완화하여 표현
  - ‘재앙’ 대신 ‘환난’처럼 일반화
  rationale: 히브리어의 반복된 מַגֵּפָה는 구체적이고 강한 징벌을 가리키므로, 이를 완화하지 않고 그대로 드러내는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 야훼의 심판은 인간뿐 아니라 피조 세계의 영역까지 미칠 수 있음
