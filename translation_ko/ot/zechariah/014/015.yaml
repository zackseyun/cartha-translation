  source_fidelity: 히브리어는 앞 절에서 언급된 재앙과 같은 재앙이 말, 노새, 낙타, 나귀 및 그 진영들에 있는 모든 짐승에게도 임할 것을 말합니다. 개정문은 וְכֵן의 첨가·대응 기능, מַגֵּפָה의 반복, כַּ의 비교를 모두 보존합니다.
  naturalness: 초안의 “그리고 이와 같이 말입니다”는 현대 표준 한국어 문장으로 부자연스럽고, 뒤 문장과의 통사적 연결도 매끄럽지 않습니다. “또한 …에게도 … 임할 것입니다”로 고치면 합쇼체의 자연스러운 성경 문체가 됩니다.
