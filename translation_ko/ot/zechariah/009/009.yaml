revisions:
- from: 딸 시온아, 크게 기뻐하십시오[a]! 딸 예루살렘아, 외치십시오! 보십시오, 네 왕이 네게 오십니다—의로우시며 구원을 받으신 분[b]이시며, 겸손하시고 나귀를, 곧 암나귀 새끼인 어린 나귀[c]를 타고 오십니다.
  to: 딸 시온아, 크게 기뻐하십시오! 딸 예루살렘아, 환호하십시오! 보십시오, 네 왕이 네게 오십니다—그분은 의로우시고 구원받으셨으며[b], 겸손하시고[c] 나귀, 곧 암나귀의 새끼인 어린 나귀를 타고 오십니다[d].
  rationale: The revision removes a non-material grammatical note, makes the royal description idiomatic in modern 합쇼체, and adds a necessary note for עָנִי. It preserves the passive ambiguity of וְנוֹשָׁע in the main text and footnote, avoids imposing a doctrinal interpretation, and retains the one-animal reading as a documented poetic possibility rather than an unquestioned factual claim.
