    reason: alternative_reading
  - marker: c
    text: 또는 ‘낮은 처지에 계시고,’ ‘가난하시고,’ 또는 ‘고난받으시고.’ 히브리어 낱말은 겸손한 태도뿐 아니라 낮은 신분이나 처지를 가리킬 수도 있습니다.
