id: ZEC.9.9
reference: Zechariah 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
  footnotes:
  - marker: a
    text: Or 'righteous and saved is he,' or 'righteous and having salvation.' The Hebrew term can describe one who has been delivered by God and therefore comes in victory.
    reason: alternative_reading
  - marker: b
    text: Or 'lowly,' 'poor,' or 'afflicted.' The Hebrew word can denote humble status or condition as well as demeanor.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'on a donkey, on a colt, the foal of a she-donkey' is likely poetic parallelism describing one animal from two angles.
    reason: cultural_note
translation:
  language: ko
  text: 딸 시온아, 크게 기뻐하십시오[a]! 딸 예루살렘아, 외치십시오! 보십시오, 네 왕이 네게 오십니다—의로우시며 구원을 받으신 분[b]이시며, 겸손하시고 나귀를, 곧 암나귀 새끼인 어린 나귀[c]를 타고 오십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘크게 기뻐하여라.’ 히브리어는 딸 시온에게 주어지는 여성 단수 명령형입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘의로우시며 승리하신 분’ 혹은 ‘의로우시며 구원을 지니신 분.’ 히브리어는 하나님께 구원받아 승리하는 왕을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘나귀를, 곧 암나귀 새끼인 어린 나귀’를 두 마리로 보기보다, 한 동물을 시적으로 두 각도에서 묘사한 평행법으로 보는 것이 자연스럽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גִּילִ֨י מְאֹ֜ד
  english_pob_choice: Rejoice greatly
  chosen_korean: 크게 기뻐하십시오
  alternatives_korean:
  - 크게 즐거워하십시오
  - 몹시 기뻐하십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형에 해당하는 환호를 현대 한국어 명령문으로 옮겼습니다. '기뻐하십시오'가 예언적 기쁨의 촉구를 자연스럽게 드러냅니다.
- source_word: הָרִיעִי
  english_pob_choice: Shout in triumph
  chosen_korean: 외치십시오
  alternatives_korean:
  - 환호하십시오
  - 승리의 함성을 지르십시오
  lexicon: HALOT
  rationale: 어근은 큰 소리의 외침을 가리키므로, 과도하게 해석하지 않도록 기본적으로 '외치십시오'로 옮겼습니다. 전투적/환호적 뉘앙스는 문맥이 보완합니다.
- source_word: צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא
  english_pob_choice: righteous and victorious is he
  chosen_korean: 의로우시며 구원을 받으신 분이시며
  alternatives_korean:
  - 의로우시며 승리하신 분이시며
  - 의로우시며 구원받아 오신 분이시며
  lexicon: HALOT
  rationale: וְנוֹשָׁע는 피동형으로 '구원받다/구출되다'의 의미가 있으므로, 원형의 긴장을 살려 '구원을 받으신'으로 옮겼습니다. POB의 'victorious'를 그대로 따르기보다 히브리어 자체를 더 직접적으로 반영했습니다.
- source_word: עָנִי
  english_pob_choice: humble
  chosen_korean: 겸손하시고
  alternatives_korean:
  - 낮아지시고
  - 가난하시고
  - 비천하시고
  lexicon: HALOT
  rationale: 왕의 행차 방식과 연결될 때 이 형용사는 태도와 위상을 함께 시사하므로, 현대 한국어에서 가장 자연스럽고 오해를 줄이는 '겸손하시고'를 선택했습니다.
- source_word: וְרֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת
  english_pob_choice: riding on a donkey, on a colt, the foal of a she-donkey
  chosen_korean: 나귀를, 곧 암나귀 새끼인 어린 나귀를 타고
  alternatives_korean:
  - 나귀 위에, 어린 나귀 위에
  - 나귀와 어린 나귀를 타고
  lexicon: HALOT
  rationale: 히브리어의 병렬은 두 마리 동물보다 시적 평행법으로 보는 해석이 자연스러워, 한 동물을 두 방식으로 묘사하는 흐름을 드러냈습니다. '암나귀'로 אֲתֹנוֹת의 성별 정보를 살렸습니다.
theological_decisions:
- issue: וְנוֹשָׁע의 의미를 한국어로 어떻게 보존할지
  chosen_reading: 구원을 받으신 분
  alternative_readings:
  - 의롭고 승리하신 분
  - 구원받아 오시는 분
  - 구원을 지니신 분
  rationale: 이 동사는 문맥상 하나님의 구원을 받은 왕을 가리킬 수 있으므로, 승리로만 평면화하지 않고 '구원을 받으신'으로 번역해 구원-승리의 긴장을 보존했습니다.
  doctrine_reference: 메시아 왕의 구원과 승리의 이중 의미를 보존
