  text: וַ/תִּ֥בֶן צֹ֛ר מָצ֖וֹר לָ֑/הּ וַ/תִּצְבָּר כֶּ֨סֶף֙ כֶּֽ/עָפָ֔ר וְ/חָר֖וּץ כְּ/טִ֥יט חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
  footnotes:
  - marker: a
    text: Or 'stronghold' for 'fortress.' The Hebrew מָצוֹר can denote a fortified place or defensive works.
    reason: lexical_alternative
  - marker: b
    text: Or 'fine gold' for 'gold.' The Hebrew חָרוּץ can refer specifically to refined gold in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로는 자신을 위해 성채를 쌓고, 은을 티끌처럼, 금을 거리의 진흙처럼 쌓아 올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מָצוֹר는 ‘성채’뿐 아니라 ‘요새’, ‘포위 시설’ 같은 방어 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חָרוּץ는 문맥에 따라 ‘정금’ 또는 ‘순금’처럼 정련된 금을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  english_pob_choice: Tyre
  chosen_korean: 두로
  alternatives_korean:
  - 티레
  lexicon: 표준 외래어 표기 관행
  rationale: 페니키아의 도시 두로를 가리키는 고유명사이므로 한국어 성서 문맥에서 널리 쓰이는 ‘두로’를 택했습니다.
- source_word: מָצוֹר
  english_pob_choice: fortress
  chosen_korean: 성채
  alternatives_korean:
  - 요새
  - 성루
  - 방어 시설
  lexicon: HALOT
  rationale: 군사적 방어를 가리키는 이미지이므로 ‘성채’로 옮겨 본문이 말하는 자구적 방어의 뉘앙스를 살렸습니다.
- source_word: וַתִּצְבָּר כֶּסֶף כֶּעָפָר
  english_pob_choice: piled up silver like dust
  chosen_korean: 은을 티끌처럼 쌓아 올렸습니다
  alternatives_korean:
  - 은을 먼지처럼 쌓아 올렸습니다
  - 은을 티끌같이 쌓았습니다
  lexicon: HALOT
  rationale: ‘쌓다/쌓아 올리다’는 축적의 동작을 살리고, ‘티끌’은 ‘dust’의 시각적 과장을 자연스럽게 전달합니다.
- source_word: חָרוּץ כְּטִיט חוּצוֹת
  english_pob_choice: gold like the mud of the streets
  chosen_korean: 금을 거리의 진흙처럼
  alternatives_korean:
  - 금을 길거리의 흙탕물처럼
  - 금을 거리의 진흙탕처럼
  lexicon: HALOT
  rationale: ‘거리의 진흙’은 하찮고 흔한 것에 금을 비유하는 히브리어 이미지를 직역에 가깝게 보존합니다.
theological_decisions:
- issue: 두로의 의인화와 소유 대명사 처리
  chosen_reading: ‘자신을 위해’로 옮겨 도시 두로가 여성형 인칭을 띠는 의인화를 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘그녀를 위해’
  - ‘스스로를 위해’
  rationale: 히브리어 לָהּ의 여성 단수 소유를 한국어에서 과도하게 어색하지 않게 반영하기 위해 재귀적 표현을 택했습니다.
  doctrine_reference: 문맥적 의인화 처리 원칙
- issue: 금의 의미를 일반적 금속으로 유지
  chosen_reading: חָרוּץ를 여기서는 단순히 ‘금’으로 번역했습니다.
  alternative_readings:
  - ‘정금’
  - ‘순금’
  - ‘세공한 금’
  rationale: 영어 POB도 이 구절에서는 기본적으로 gold로 두었고, 본문 병행 구조상 은/금의 축적 이미지를 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선 번역 원칙
