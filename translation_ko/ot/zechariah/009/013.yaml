  verdict: revise
  source_fidelity: 초안의 ‘유다를 내 활로 당겼고’는 유다가 활이라는 비유를 충분히 드러내지 못하고, ‘내 활을 사용하여 유다를 당겼다’는 뜻으로 읽힐 수 있습니다. 또한 두 번째 ‘네 아들들’은 히브리어에서 야완(그리스)에 붙는 2인칭 여성 단수 소유접미사를 반영하므로, 한국어에서는 ‘그리스의 아들들’로 명시하는 편이 정확합니다. 에브라임과 관련된 ‘채우다’의 군사 비유는 원문 자체에 생략된 목적어가 있어, ‘그 활’을 보충하되 비유적 표현임을 유지했습니다.
  naturalness: 수정문은 활-에브라임-칼의 연속 비유를 더 자연스럽고 분명하게 전달합니다. ‘시온아’라는 호격과 ‘-습니다’ 종결을 유지하여 현대 표준어 합쇼체에 맞췄습니다.
  terminology: 유다, 에브라임, 시온, 그리스, 용사는 통용되는 성서적·역사적 명칭입니다. יָוָן은 본문에서 ‘그리스’로 옮기고, 각주에서 ‘야완(Javan)’을 제시했습니다. ‘아들들’은 양쪽 병렬 표현과 전투 맥락의 성별화된 표현을 보존합니다.
  issues:
