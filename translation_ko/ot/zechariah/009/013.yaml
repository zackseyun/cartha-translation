source:
  edition: WLC
  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
  footnotes:
  - marker: a
    text: Hebrew 'Javan,' a traditional name for the Greek peoples/world.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 내가 유다를 내 활로 당겼고, 에브라임으로 그것을 채웠기 때문입니다. 시온아, 내가 네 아들들을 일으켜 네 아들들, 그리스에 맞서게 하고, 너를 용사의 칼과 같이 만들겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야완(Javan)’은 전통적으로 그리스 민족/세계 전체를 가리키는 이름입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  english_pob_choice: I have bent Judah as my bow
  chosen_korean: 내가 유다를 내 활로 당겼고
  alternatives_korean:
  - 내가 유다를 나를 위해 활로 당겼고
  - 내가 유다를 내 활로 굽혔고
  lexicon: HALOT
  rationale: דָרַכְתִּי는 활을 ‘당기다/메우다’는 전투용 준비를 가리키므로, 한국어도 ‘당겼다’로 옮겨 활의 기능을 살렸습니다. לִי는 소유·귀속 관계를 반영해 ‘내 활’로 자연스럽게 표현했습니다.
- source_word: מִלֵּאתִי אֶפְרַיִם
  english_pob_choice: I have filled it with Ephraim
  chosen_korean: 에브라임으로 그것을 채웠고
  alternatives_korean:
  - 에브라임으로 그것을 가득 채웠고
  - 에브라임을 그 안에 채웠고
  lexicon: HALOT
  rationale: 원문의 목적어는 활 이미지의 일부로 암시되므로, 이를 ‘그것’으로 보충해 문맥을 분명하게 했습니다. ‘에브라임으로’는 수단/재료적 채움의 이미지를 최대한 유지합니다.
- source_word: וְעוֹרַרְתִּי בָנַיִךְ... עַל בָּנַיִךְ יָוָן
  english_pob_choice: I will stir up your sons, Zion, against your sons, Greece
  chosen_korean: 시온아, 내가 네 아들들을 일으켜 네 아들들, 그리스에 맞서게 하고
  alternatives_korean:
  - 시온아, 내가 네 아들들을 일으켜 그리스의 아들들에 맞서게 하고
  - 시온아, 내가 네 자손들을 일으켜 그리스에 맞서게 하고
  lexicon: HALOT
  rationale: עוֹרַרְתִּי는 단순 감정 자극이 아니라 전투 행동으로 ‘일으키다/분발시키다’의 뜻이므로, ‘일으켜 … 맞서게 하다’로 옮겼습니다. יָוָן은 문맥상 그리스 민족/세계이므로 ‘그리스’로 번역하되, 병렬 구조를 위해 ‘네 아들들’ 반복을 살렸습니다.
- source_word: וְשַׂמְתִּיךְ כְּחֶרֶב גִּבּוֹר
  english_pob_choice: and make you like a warrior’s sword
  chosen_korean: 너를 용사의 칼과 같이 만들겠습니다
  alternatives_korean:
  - 너를 용사의 칼처럼 만들겠습니다
  - 너를 용맹한 자의 칼처럼 만들겠습니다
  lexicon: HALOT
  rationale: שַׂמְתִּיךְ는 직역하면 ‘두다/놓다’이지만 비교문맥에서는 결과적 변화의 의미가 분명하므로 ‘만들다’가 가장 자연스럽습니다. גִּבּוֹר는 단순 ‘강한 자’보다 전투 맥락의 ‘용사’가 더 정확합니다.
theological_decisions:
- issue: יָוָן의 역사적 지시 대상
  chosen_reading: ‘그리스’로 번역해 현대 독자가 즉시 역사적·민족적 대상을 이해하도록 했습니다.
  alternative_readings:
  - ‘야완’으로 음역
  - ‘이오니아’로 제한
  rationale: 본문의 대립 구도는 유다/에브라임과 그리스 세계의 충돌을 가리키므로, 한국어 본문에서는 의미 전달이 분명한 ‘그리스’를 채택했습니다. 히브리어 고유명사는 필요 시 주석으로 보완할 수 있습니다.
  doctrine_reference: Source transparency and historical referent clarity
- issue: 예언적 완료/미래 시제의 혼합
  chosen_reading: 앞의 준비 행위는 완료형 뉘앙스의 ‘당겼고/채웠고’로, 뒤의 동원과 변형은 미래형 ‘일으켜 … 만들겠습니다’로 옮겼습니다.
  alternative_readings:
  - 모두 미래로 번역
  - 모두 과거형으로 번역
  rationale: 히브리어의 연속된 동사들이 예언적 수사로서 이미 준비된 일과 앞으로 일어날 일을 함께 보여 주므로, 한국어도 그 긴장을 유지하는 것이 본문 효과를 가장 잘 살립니다.
  doctrine_reference: Optimal-equivalence rendering of prophetic discourse
