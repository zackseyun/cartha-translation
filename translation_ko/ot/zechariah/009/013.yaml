    issue: ‘유다를 내 활로 당겼고’의 비유 관계가 불명확합니다.
    rationale: 히브리어는 유다를 활에 비기는 표현입니다. 초안은 한국어에서 ‘내 활로 유다를 당기다’로 해석될 수 있으므로, 유다를 활로 삼는 관계를 명시해야 합니다.
