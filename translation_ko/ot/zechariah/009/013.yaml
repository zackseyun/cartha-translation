    rationale: 두 번째 בָנַיִךְ는 야완/그리스를 여성으로 의인화하여 부르는 표현입니다. 한국어의 ‘네’는 시온을 가리키는 것으로 읽히므로 ‘그리스의 아들들’로 풀어야 의미가 보존됩니다.
