  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
  footnotes:
  - marker: a
    text: Or 'her strength,' 'her army,' or 'her power'; the Hebrew term can denote wealth, resources, or military might. Here 'wealth' fits the immediate context of Tyre's riches in the preceding verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 주님께서 그 성을 빼앗으시고 바다에서 그 재물을 치실 것이며, 그 성은 불에 삼켜질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 바로 앞절에 나오는 두로의 금과 은 문맥에 따른 번역입니다. 히브리어 חַיִל은 재물 외에도 힘, 군대, 능력을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언 선포의 주목을 끄는 감탄사로서, 현대 한국어에서 격식을 유지하면서도 직접적인 호소력을 살리는 표현입니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: HALOT
  rationale: 아도나이는 하나님의 호칭이므로, 한국어에서는 교회적이면서도 본문에 자연스러운 ‘주님’이 적절합니다.
- source_word: חֵילָהּ
  english_pob_choice: her wealth
  chosen_korean: 그 재물
  alternatives_korean:
  - 그 힘
  - 그 군대
  - 그 부
  lexicon: HALOT
  rationale: 앞절의 두로의 금은과 은의 문맥을 따라, חַיִל의 의미 범위 중 여기서는 ‘재물/부’가 가장 직접적입니다.
- source_word: בַּיָּם
  english_pob_choice: into the sea
  chosen_korean: 바다로
  alternatives_korean:
  - 바다 안으로
  - 바다에
  lexicon: HALOT
  rationale: ‘치다’와 결합할 때 한국어에서는 종착점을 드러내는 ‘-로’가 가장 자연스럽고, 파괴적 투하의 뉘앙스를 살립니다.
- source_word: תֵּאָכֵל
  english_pob_choice: will be consumed
  chosen_korean: 불에 삼켜질 것입니다
  alternatives_korean:
  - 불에 소멸될 것입니다
  - 불에 타 없어질 것입니다
  lexicon: HALOT
  rationale: אָכַל의 수동형을 ‘삼켜지다’로 옮기면, 불이 대상을 집어삼키는 생생한 심판 이미지를 보존할 수 있습니다.
theological_decisions:
- issue: 여성 단수 지시 대명사의 처리
  chosen_reading: 히브리어의 여성형은 문맥상 두로 성을 가리키므로, 인격화된 ‘그 성’으로 옮겼습니다.
  alternative_readings:
  - 무생물적으로 ‘그것’으로 번역
  rationale: 도시를 여성으로 의인화하는 예언 문체를 살리면서도, 한국어에서 문맥적 지시가 분명하도록 했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
