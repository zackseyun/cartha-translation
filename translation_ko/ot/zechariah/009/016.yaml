id: ZEC.9.16
reference: Zechariah 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הוֹשִׁיעָ֞/ם יְהוָ֧ה אֱלֹהֵי/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/צֹ֣אן עַמּ֑/וֹ כִּ֚י אַבְנֵי נֵ֔זֶר מִֽתְנוֹסְס֖וֹת עַל אַדְמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
  footnotes:
  - marker: a
    text: Or, 'for they will be raised aloft like the stones of a crown over his land.' The Hebrew verb can suggest being lifted up or displayed prominently, not only shining.
    reason: lexical_alternative
  - marker: b
    text: '''Stones of a crown'' may also be rendered ''crown jewels'' or, less likely, ''consecrated stones,'' since the Hebrew term for ''crown'' can carry associations of consecration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 야훼 그들의 하나님이 자기 백성의 양 떼 같이 그들을 구원하시리니, 그들은 그의 땅 위의 왕관의 돌들처럼 빛날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛날 것입니다’는 이 동사가 ‘높이 들어 올려지다’ 또는 ‘드러나게 세워지다’는 뜻도 가질 수 있음을 반영한 대안입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕관의 돌들’은 ‘왕관의 보석들’ 또는 덜 가능하지만 ‘성별된 돌들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  english_pob_choice: will save them
  chosen_korean: 구원하시리니
  alternatives_korean:
  - 구원하실 것입니다
  - 건져 주시리니
  - 구출하시리니
  lexicon: HALOT
  rationale: ישׁע의 핵심 뜻을 살려 ‘구원하다’로 옮겼고, 예언문맥의 미래 서술에 맞게 종결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 규범에 따라 신명은 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: כְּצֹאן עַמּוֹ
  english_pob_choice: as the flock of his people
  chosen_korean: 자기 백성의 양 떼 같이
  alternatives_korean:
  - 그의 백성의 양 떼 같이
  - 그의 백성의 무리 같이
  - 자기 백성의 양 같이
  lexicon: HALOT
  rationale: 비유의 집합성을 살리기 위해 ‘양 떼’로 옮겼고, 소유 관계는 ‘자기 백성’으로 반영했습니다.
- source_word: אַבְנֵי נֵזֶר
  english_pob_choice: the stones of a crown
  chosen_korean: 왕관의 돌들
  alternatives_korean:
  - 왕관의 보석들
  - 면류관의 돌들
  - 헌납된 돌들
  lexicon: HALOT
  rationale: ‘נֵזֶר’의 왕관/면류관 이미지를 유지하면서 돌의 다발성을 드러내기 위해 ‘왕관의 돌들’로 직역에 가깝게 옮겼습니다.
- source_word: מִתְנוֹסְסוֹת
  english_pob_choice: will sparkle
  chosen_korean: 빛날 것입니다
  alternatives_korean:
  - 반짝일 것입니다
  - 드러나 높이 올려질 것입니다
  - 번뜩일 것입니다
  lexicon: HALOT
  rationale: 동사의 빛남과 드러남의 뉘앙스를 함께 담기 위해 자연스러운 포괄 표현인 ‘빛나다’를 선택했습니다.
- source_word: עַל אַדְמָתֽוֹ
  english_pob_choice: over his land
  chosen_korean: 그의 땅 위의
  alternatives_korean:
  - 그의 땅 위에
  - 그 땅 위에
  - 그의 토지 위의
  lexicon: HALOT
  rationale: ‘אַדְמָה’의 땅/영토 의미를 살려 ‘땅’으로 옮겼고, 위치 관계는 원문의 전치사구를 유지해 ‘위의’로 반영했습니다.
theological_decisions:
- issue: ‘구원하다’와 ‘양 떼’ 이미지의 결합
  chosen_reading: 이 구절은 야훼께서 자기 백성을 실제로 구원하시며, 동시에 그들을 돌보시는 목자의 백성으로 묘사합니다.
  alternative_readings:
  - 단순한 보호나 승리의 의미로만 읽을 수 있습니다.
  - ‘양 떼 같이’가 구원의 방식이 아니라 구원받는 대상의 정체성을 나타내는 비유로 읽힐 수 있습니다.
  rationale: 히브리어 문맥은 군사적 승리보다도 언약적 구원과 목자적 돌봄을 함께 드러내므로, 두 이미지를 모두 살렸습니다.
  doctrine_reference: 언약적 구원과 목자-백성의 비유
