  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
  footnotes:
  - marker: a
    text: Or 'captives of hope.' The Hebrew expression is metaphorical and may suggest those bound yet sustained by hope.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will restore a double portion to you' or 'I will repay you double.'
    reason: lexical_alternative
translation:
  language: ko
  text: Stronghold로 돌아오십시오[a], 희망의 포로들[b]아. 오늘도 내가 너에게 말합니다. 내가 네게 두 배를 회복해 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘희망의 포로들’입니다. 히브리어 표현은 은유적이며, 묶여 있으면서도 소망으로 지탱되는 자들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두 몫을 회복해 주겠습니다’ 혹은 ‘두 배로 갚아 주겠습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ לְבִצָּרוֹן
  english_pob_choice: Return to the stronghold
  chosen_korean: Stronghold로 돌아오십시오
  alternatives_korean:
  - 요새로 돌아오십시오
  - 피난처로 돌아오십시오
  lexicon: HALOT
  rationale: לְבִצָּרוֹן은 성곽/요새의 이미지를 지닌 구체적 표현이므로, 지명을 풀어버리기보다 ‘Stronghold’를 음역형으로 살려 은유적 긴장과 장소성을 함께 보존했습니다.
- source_word: אֲסִירֵי הַתִּקְוָה
  english_pob_choice: prisoners of hope
  chosen_korean: 희망의 포로들
  alternatives_korean:
  - 희망의 죄수들
  - 희망에 묶인 포로들
  lexicon: HALOT
  rationale: 직역상 ‘희망의 포로들’이 가장 가깝고, 한국어에서는 ‘희망의 포로들’보다 ‘희망의 포로들아’가 호명 구조를 자연스럽게 드러냅니다. 여기서 ‘포로’는 단순한 심리 상태보다 얽매임의 은유를 유지합니다.
- source_word: מִשְׁנֶה
  english_pob_choice: double
  chosen_korean: 두 배
  alternatives_korean:
  - 배로
  - 두 몫
  lexicon: HALOT
  rationale: מִשְׁנֶה는 ‘두 배/배수’의 의미가 핵심이므로, 한국어에서는 간결한 ‘두 배’로 옮겨 원문의 응보적·회복적 약속을 유지했습니다.
- source_word: אָשִׁיב לָךְ
  english_pob_choice: I will restore double to you
  chosen_korean: 내가 네게 두 배를 회복해 주겠습니다
  alternatives_korean:
  - 내가 네게 두 배를 돌려주겠습니다
  - 내가 네게 두 배를 갚아 주겠습니다
  lexicon: HALOT
  rationale: הֵשִׁיב의 회복/되돌림 의미를 살려 ‘회복해 주겠습니다’로 옮겼습니다. ‘갚다’는 상거래적 뉘앙스가 강해 예언의 회복 약속을 약화시킬 수 있습니다.
theological_decisions:
- issue: ‘희망의 포로들’의 은유적 상태와 실제 구금 상태
  chosen_reading: 직접 호칭을 유지하되, 은유적 구속과 소망의 지속을 함께 읽을 수 있도록 그대로 옮겼습니다.
  alternative_readings:
  - 희망에 사로잡힌 자들
  - 희망의 포로가 된 자들
  rationale: 히브리어는 ‘희망’이 그들을 규정하는 소유격 구조로 되어 있어, 이를 심리화하거나 단순한 수식어로 바꾸지 않고 긴장을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: Preserve metaphor without resolving tension.
