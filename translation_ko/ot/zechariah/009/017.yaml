  rationale: 앞절과의 평행을 유지하기 위해 형용사적 풀어쓰기보다 명사구를 살려 ‘아름다움’으로 옮겼습니다.
- source_word: בַּחוּרִים
  english_pob_choice: the young men
  chosen_korean: 청년들을
  alternatives_korean:
  - 젊은 남자들을
