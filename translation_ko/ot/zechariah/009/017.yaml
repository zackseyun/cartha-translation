  edition: WLC
  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
  footnotes:
  - marker: a
    text: 'Or, ''how good he is, and how beautiful he is.'' The Hebrew uses abstract nouns: ''his goodness'' and ''his beauty.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'virgins' for 'young women.' The Hebrew בְּתֻלוֹת can more specifically denote unmarried virgins, though here it likely functions as the female counterpart to 'young men.'
    reason: lexical_alternative
  - marker: c
    text: The 'his' in 'his goodness' and 'his beauty' most likely refers to the LORD in context, though some understand it to refer to Israel's restored condition or to the king.
    reason: alternative_reading
translation:
  language: ko
  text: 그의[c] 선하심이 얼마나 크며, 그의 아름다움이 얼마나 큽니까![a] 곡식은 청년들을 번성하게 하고, 새 포도주는 젊은 여성들을 번성하게 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 얼마나 선하시며 얼마나 아름다우신가!” 원문은 ‘그의 선하심’과 ‘그의 아름다움’이라는 추상명사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은 여성들’은 원문의 בְּתוּלוֹת을 옮긴 것입니다. 이 말은 더 구체적으로 ‘처녀들’ 또는 ‘미혼 여성들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의’는 문맥상 야훼를 가리키는 것으로 가장 흔히 이해됩니다. 그러나 회복된 이스라엘 또는 시온의 상태, 혹은 앞서 언급된 왕을 가리킨다고 보는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מַה טּוּבוֹ
  english_pob_choice: For how great is his goodness
  chosen_korean: 이는 얼마나 그의 선하심이며
