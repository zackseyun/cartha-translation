id: ZEC.9.17
reference: Zechariah 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
  footnotes:
  - marker: a
    text: 'Or, ''how good he is, and how beautiful he is.'' The Hebrew uses abstract nouns: ''his goodness'' and ''his beauty.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'virgins' for 'young women.' The Hebrew בְּתֻלוֹת can more specifically denote unmarried virgins, though here it likely functions as the female counterpart to 'young men.'
    reason: lexical_alternative
  - marker: c
    text: The 'his' in 'his goodness' and 'his beauty' most likely refers to the LORD in context, though some understand it to refer to Israel's restored condition or to the king.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 얼마나 그의 선하심이며, 얼마나 그의 아름다움입니까! 곡식은 청년들을 번성하게 하고, 새 포도주는 처녀들을 그러하게 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 추상명사 ‘그의 선하심’과 ‘그의 아름다움’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: בְּתֻלוֹת은 더 구체적으로 ‘처녀들’ 또는 ‘미혼 여성들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의’는 문맥상 야훼를 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: theological_note
lexical_decisions:
- source_word: כִּי מַה טּוּבוֹ
  english_pob_choice: For how great is his goodness
  chosen_korean: 이는 얼마나 그의 선하심이며
  alternatives_korean:
  - 이는 그가 얼마나 선하신지이며
  - 정말 그의 선함이 얼마나 큰지
  lexicon: HALOT
  rationale: 히브리어의 감탄문 구조를 살려 ‘얼마나…’로 옮기고, 명사 טוּב의 추상적 의미를 ‘선하심’으로 보존했습니다.
- source_word: וּמַה יָפְיוֹ
  english_pob_choice: and how great his beauty
  chosen_korean: 얼마나 그의 아름다움입니까!
  alternatives_korean:
  - 얼마나 그가 아름다우십니까!
  - 그리고 그의 아름다움이 얼마나 큰지
  lexicon: HALOT
  rationale: 앞절과의 평행을 유지하기 위해 형용사적 풀어쓰기보다 명사구를 살려 ‘아름다움’으로 옮겼습니다.
- source_word: בַּחוּרִים
  english_pob_choice: the young men
  chosen_korean: 청년들을
  alternatives_korean:
  - 젊은 남자들을
  - 젊은이들을
  lexicon: HALOT
  rationale: 시적 대구에서 연령·성별이 드러나는 사회적 집단을 자연스럽게 반영하기 위해 ‘청년들’로 옮겼습니다.
- source_word: בְּתֻלוֹת
  english_pob_choice: the young women
  chosen_korean: 처녀들을
  alternatives_korean:
  - 젊은 여성들을
  - 미혼 여성들을
  lexicon: HALOT
  rationale: 영어 POB가 주석에서 지적하듯 기본 어휘는 ‘virgins’일 수 있으나, 여기서는 בַּחוּרִים과의 짝을 살려 시적 대응을 드러내는 ‘처녀들’이 원문 긴장을 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 3인칭 남성 단수 접미사의 지시 대상
  chosen_reading: ‘그의’는 문맥상 야훼를 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 회복된 시온/이스라엘의 상태를 가리킨다고 볼 수 있습니다.
  - 앞선 장의 왕을 가리킨다고 볼 수 있습니다.
  rationale: 직전 문맥이 야훼의 구원 행위를 찬양하므로, 본문은 그의 선하심과 아름다움으로 읽는 것이 가장 자연스럽습니다. 다만 접미사 자체가 지시 대상을 명시하지 않으므로, 해석의 여지를 지우지 않고 ‘그의’로 유지했습니다.
  doctrine_reference: 문맥 우선 해석과 번역상의 모호성 보존
- issue: ‘יְנוֹבֵב’의 동사상
  chosen_reading: ‘번성하게 하고’로 옮겨 풍요와 생장 이미지를 살렸습니다.
  alternative_readings:
  - ‘싹트게 하고’
  - ‘무성하게 하고’
  - ‘기운 나게 하고’
  rationale: 희귀 동사이지만 곡식과 새 포도주의 병행 문맥에서 생장·풍요를 일으키는 의미가 가장 적절하므로, 농경적 은유를 살리는 방향을 택했습니다.
  doctrine_reference: 시적 평행법과 농경 축복 이미지
