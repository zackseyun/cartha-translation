  text: וְ/חָנִ֨יתִי לְ/בֵיתִ֤/י מִצָּבָה֙ מֵ/עֹבֵ֣ר וּ/מִ/שָּׁ֔ב וְ/לֹֽא יַעֲבֹ֧ר עֲלֵי/הֶ֛ם ע֖וֹד נֹגֵ֑שׂ כִּ֥י עַתָּ֖ה רָאִ֥יתִי בְ/עֵינָֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
  footnotes:
  - marker: a
    text: Or 'as a garrison.' The Hebrew term refers to a stationed guard-post or military defense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the one passing through and from the one returning,' likely meaning from hostile movement in either direction.
    reason: lexical_alternative
  - marker: c
    text: Or 'exactor' or 'taskmaster' for 'oppressor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 집에 진을 쳐서 지킬 것이니, 아무도 이리저리 왕래하지 못하게 하고, 학대하는 자도 다시는 그들 위로 지나가지 못할 것입니다. 이는 이제 내가 내 눈으로 보았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진을 치다’는 주둔한 수비대나 군사적 경계선의 의미를 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘지나가는 자와 돌아오는 자로부터’로, 양방향의 적대적 왕래를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘학대하는 자’는 ‘압제자’ 또는 ‘징수하는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִ֨יתִי
  english_pob_choice: And I will encamp
  chosen_korean: 내가 … 진을 쳐서 지킬 것이니
  alternatives_korean:
  - 내가 … 진을 칠 것이니
  - 내가 … 진을 치고 있을 것이니
  lexicon: HALOT
  rationale: חנה는 군사적 배치의 뉘앙스를 가진 ‘진을 치다’로 옮기는 것이 자연스럽고, 뒤의 보호 기능을 살리기 위해 ‘지키다’를 덧붙였습니다.
- source_word: לְבֵיתִי
  english_pob_choice: at my house
  chosen_korean: 내 집에
  alternatives_korean:
  - 내 집에 대하여
  - 내 집을 위하여
  lexicon: HALOT
  rationale: 직역상 ‘내 집에/내 집을 위하여’가 가능하지만, 보호를 위해 진을 친 장소를 자연스럽게 드러내는 ‘내 집에’가 본문 의미를 가장 직접적으로 전달합니다.
- source_word: מִצָּבָה
  english_pob_choice: as a guard
  chosen_korean: 진을 쳐서 지킬 것이니
  alternatives_korean:
  - 보초처럼
  - 주둔 부대처럼
  lexicon: HALOT
  rationale: 이 명사는 주둔한 경계·수비의 의미를 가지므로, 한국어에서는 ‘진을 쳐서 지키다’가 군사적 방어 이미지를 가장 잘 살립니다.
- source_word: מֵעֹבֵר וּמִשָּׁב
  english_pob_choice: so that none may pass to and fro
  chosen_korean: 아무도 이리저리 왕래하지 못하게 하고
  alternatives_korean:
  - 지나가는 자와 돌아오는 자가 없게 하고
  - 지나가고 돌아오는 자가 없게 하고
  lexicon: HALOT
  rationale: 히브리어의 분사는 ‘지나가다/돌아오다’의 양방향 왕래를 가리키므로, 이를 한국어의 관용적 표현인 ‘이리저리 왕래하다’로 풀어 주었습니다.
- source_word: נֹגֵשׂ
  english_pob_choice: oppressor
  chosen_korean: 학대하는 자
  alternatives_korean:
  - 압제하는 자
  - 징수하는 자
  lexicon: HALOT
  rationale: 문맥상 단순한 징수자보다 외세의 지배와 억압을 가리키는 폭넓은 표현이 필요해 ‘학대하는 자’로 옮겼습니다.
- source_word: רָאִיתִי בְעֵינָי
  english_pob_choice: I have seen with my own eyes
  chosen_korean: 내 눈으로 보았기 때문입니다
  alternatives_korean:
  - 내가 직접 보았기 때문입니다
  - 내 눈으로 친히 보았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 강조는 직접 목격을 뜻하므로, 한국어에서는 자연스럽고도 강조가 살아 있는 ‘내 눈으로 보았다’로 반영했습니다.
theological_decisions:
- issue: 보호의 범위가 ‘내 집’인지 ‘백성’까지 포함하는지
  chosen_reading: 본문은 ‘내 집’에 대한 야훼의 수비 선언을 문자적으로 유지하되, 뒤의 복수 대명사 ‘그들’을 살려 그 집과 관련된 공동체가 보호 대상임을 암시하도록 두었습니다.
  alternative_readings:
  - 성전만 가리킨다고 좁혀 번역
  - 하나님의 백성 전체를 본문에 명시
  rationale: 문맥상 성전 이미지를 떠올리게 하지만, 본문 자체는 범위를 넓혀 열어 두므로 과도한 특정화를 피하는 것이 source-direct합니다.
