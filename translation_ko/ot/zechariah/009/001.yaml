  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
  footnotes:
  - marker: a
    text: Or 'concerning the land of Hadrach.' The Hebrew preposition is literally 'in,' but in prophetic headings it can function idiomatically for the target of an oracle.
    reason: alternative_reading
  - marker: b
    text: Or 'Damascus is his resting place.' The Hebrew suffix in 'its/his resting place' is ambiguous.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the eye of humankind, and of all the tribes of Israel, is toward the LORD.' Hebrew 'man' here likely has a generic sense.
    reason: lexical_alternative
  - marker: d
    text: Some understand the clause as 'for the LORD has an eye on man and on all the tribes of Israel,' but the Hebrew wording is compressed and allows more than one construal.
    reason: alternative_reading
translation:
  language: ko
  text: 「예언의 말씀」— 야훼의 말씀이 하드락의 땅을 향하고, 다마스쿠스는 그것의 안식처입니다. 이는 사람의 눈과 이스라엘의 모든 지파의 눈이 야훼를 향하고 있기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하드락의 땅’은 예언 표제에서 대상 지시를 나타낼 수 있어, 문자적 ‘안에’보다 ‘~을 향하여/대하여’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그것의 안식처’의 대명사는 문법적으로 모호하여, ‘그의 안식처’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘사람’은 여기서 일반적인 인간을 가리키는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 일부는 이 절을 ‘야훼께서 사람과 이스라엘의 모든 지파를 주목하신다’는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 예언의 말씀
  alternatives_korean:
  - 신탁
  - 예언
  lexicon: HALOT
  rationale: 표제어로서의 מַשָּׂא는 예언 선포의 도입부이므로, 현대 한국어에서 문어체로 자연스러운 ‘예언의 말씀’으로 옮겨 원문의 장르 표지를 살렸습니다.
- source_word: בְּאֶרֶץ חַדְרָךְ
  english_pob_choice: against the land of Hadrach
  chosen_korean: 하드락의 땅을 향하고
  alternatives_korean:
  - 하드락의 땅에 대해
  - 하드락 땅에
  lexicon: HALOT
  rationale: 전치사 בְּ의 문자적 ‘안에’보다 예언 표제에서 대상 지시 기능이 더 강하므로, 한국어에서는 ‘향하고’로 처리해 심판적/대상 지시 뉘앙스를 반영했습니다.
- source_word: מְנֻחָתוֹ
  english_pob_choice: is its resting place
  chosen_korean: 그것의 안식처입니다
  alternatives_korean:
  - 그의 안식처입니다
  - 쉼의 자리입니다
  lexicon: HALOT
  rationale: 어미 대명사가 문법적으로 모호하므로, 원문의 모호성을 보존하기 위해 중립적인 ‘그것의’로 옮겼고, ‘안식처’는 resting place의 공간적 의미를 자연스럽게 전달합니다.
- source_word: עֵין אָדָם
  english_pob_choice: the eye of man
  chosen_korean: 사람의 눈
  alternatives_korean:
  - 인간의 눈
  - 사람의 시선
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 직역하되, 한국어에서는 ‘눈’이 단순 시각 기관을 넘어 관심과 향함의 뜻을 담을 수 있어 본문 의미를 살리기에 적절합니다.
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: and of all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파의 눈
  alternatives_korean:
  - 이스라엘의 모든 지파들
  - 이스라엘의 모든 지파의 시선
  lexicon: HALOT
  rationale: 앞의 ‘사람의 눈’과 병렬을 이루므로, 뒤에도 ‘눈’을 반복해 히브리어의 대구와 연결 구조를 한국어에서 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 Tetragrammaton을 쓰므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לַיהוָה עֵין אָדָם의 문장 구조
  chosen_reading: 사람의 눈과 이스라엘의 모든 지파의 눈이 야훼를 향하고 있습니다
  alternative_readings:
  - 야훼께서 사람과 이스라엘의 모든 지파를 주목하고 계십니다
  - 사람과 이스라엘의 모든 지파의 눈이 야훼께 향해 있습니다
  rationale: 히브리어는 압축되어 있어 ‘야훼가 사람을 살피신다’와 ‘사람의 눈이 야훼를 향한다’ 두 방향으로 읽힐 수 있으나, 본문 어순을 따라 인간의 응시/향함을 본문 의미의 중심으로 두었습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם'
