  - severity: medium
    issue: Footnote markers are not anchored at their relevant expressions
    rationale: All four markers occur at the end, although notes a–c concern earlier, distinct expressions. Moving each marker beside its referent makes the alternatives auditable and prevents ambiguity about what each note qualifies.
