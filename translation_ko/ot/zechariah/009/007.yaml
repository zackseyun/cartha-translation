id: ZEC.9.7
reference: Zechariah 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲסִרֹתִ֨י דָמָ֜י/ו מִ/פִּ֗י/ו וְ/שִׁקֻּצָי/ו֙ מִ/בֵּ֣ין שִׁנָּ֔י/ו וְ/נִשְׁאַ֥ר גַּם ה֖וּא לֵֽ/אלֹהֵ֑י/נוּ וְ/הָיָה֙ כְּ/אַלֻּ֣ף בִּֽ/יהוּדָ֔ה וְ/עֶקְר֖וֹן כִּ/יבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
  footnotes:
  - marker: a
    text: Or 'he too will remain for our God' or 'he too will be left for our God.' The Hebrew verb can be rendered more generally as 'remain,' though 'be a remnant' preserves the prophetic nuance.
    reason: lexical_alternative
  - marker: b
    text: '''Detestable things'' likely refers to idolatrous or ritually unclean things, possibly food associated with pagan worship.'
    reason: cultural_note
  - marker: c
    text: '''Like the Jebusite'' likely suggests incorporation into Judah, as the Jebusites were absorbed into Jerusalem rather than remaining a separate hostile power.'
    reason: cross_reference
translation:
  language: ko
  text: 내가 그의 피를 그의 입에서, 그의 가증한 것들을 그의 이빨 사이에서 제거하겠습니다. 그도 우리 하나님께 속하여 남은 자가 될 것이며, 유다의 씨족 우두머리[a]처럼 될 것이고, 에그론은 여부스 사람[b]처럼 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘씨족 우두머리’는 히브리어 אַלּוּף의 지도자·족장이라는 지위 개념을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여부스 사람’은 예루살렘의 여부스 주민과 관련된 명칭입니다. 이 비교는 에그론의 유다 내 편입이나 종속을 암시할 가능성이 있으나, 그 의미를 본문이 명시하지는 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  english_pob_choice: I will remove
  chosen_korean: 제거하겠습니다
  alternatives_korean:
  - 없애겠습니다
  - 치워버리겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 단순한 이동보다 원치 않는 것을 치우는 ‘제거하다’로 옮겼습니다.
- source_word: דָמָיו
  english_pob_choice: his blood
  chosen_korean: 그의 피
  alternatives_korean:
  - 그의 유혈
  - 피 흘림
  lexicon: HALOT
  rationale: 히브리어의 직설적 이미지를 살려 ‘피’로 옮기고, 주석 없이 본문에서 과도하게 해석하지 않았습니다.
- source_word: שִׁקֻּצָיו
  english_pob_choice: his detestable things
  chosen_korean: 그의 가증한 것들
  alternatives_korean:
  - 그의 우상적 더러운 것들
  - 그의 혐오스러운 것들
  lexicon: HALOT
  rationale: 이 단어가 우상숭배적이거나 의례적으로 가증한 대상을 가리킬 수 있으므로, 강한 부정성을 유지하면서도 한국어 성경체에 맞는 ‘가증한 것들’을 택했습니다.
- source_word: וְנִשְׁאַר גַּם הוּא
  english_pob_choice: Then he too will be a remnant
  chosen_korean: 그러고 나서 그도 우리 하나님께 남은 자가 될 것이며
  alternatives_korean:
  - 그러고 나서 그도 남아 있을 것이며
  - 그러고 나서 그도 우리 하나님께 남겨질 것이며
  lexicon: HALOT
  rationale: 문맥상 선지서적 ‘남은 자’ 뉘앙스를 살리되, 동사의 기본 의미인 ‘남다/남겨지다’도 함께 드러내는 표현으로 옮겼습니다.
- source_word: וְהָיָה כְּאַלֻּף בִּיהוּדָה
  english_pob_choice: he will be like a clan leader in Judah
  chosen_korean: 유다의 한 족장처럼 될 것이고
  alternatives_korean:
  - 유다의 지도자처럼 될 것이고
  - 유다의 천인대장처럼 될 것이고
  lexicon: HALOT
  rationale: אַלּוּף는 지파/씨족 단위의 우두머리 의미가 가능하므로, 현대 한국어로 자연스러우면서도 지위의 높이를 드러내는 ‘족장’을 택했습니다.
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  english_pob_choice: and Ekron will be like the Jebusite
  chosen_korean: 에그론은 여부스 사람처럼 될 것입니다
  alternatives_korean:
  - 에그론은 여부스 사람과 같을 것입니다
  - 에그론은 여부스 족속처럼 될 것입니다
  lexicon: HALOT
  rationale: 비교 대상인 민족명을 한국어 성경의 익숙한 형태인 ‘여부스 사람’으로 옮겨, 흡수·편입의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ‘남은 자’ 표현의 보존
  chosen_reading: ‘남은 자가 될 것’으로 번역해 예언서의 종말론적·언약적 울림을 살렸습니다.
  alternative_readings:
  - ‘남아 있을 것’
  - ‘남겨질 것’
  rationale: 동사는 일반적으로 ‘남다’로도 옮길 수 있지만, 스가랴의 문맥에서는 단순 잔존보다 하나님의 백성 안으로의 포함을 암시하는 ‘남은 자’가 더 충실합니다.
  doctrine_reference: '예언서 번역 원칙: 어휘 의미와 문맥적 신학성을 함께 보존'
- issue: 에그론과 여부스 사람의 관계
  chosen_reading: 에그론을 정복만이 아니라 편입과 변화의 대상으로 읽을 수 있도록 ‘~처럼 될 것입니다’로 유지했습니다.
  alternative_readings:
  - 단순한 정치적 굴복
  - 민족적 동일화
  rationale: 본문은 피와 가증한 것을 제거한 뒤 ‘우리 하나님께’ 속한 존재가 된다고 말하므로, 단순한 군사적 패배보다 정결과 편입의 의미를 함께 전하는 것이 적절합니다.
  doctrine_reference: '번역 철학 §3: 본문이 허용하는 신학적 긴장을 해소하지 않고 보존'
