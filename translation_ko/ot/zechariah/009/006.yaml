base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
  footnotes:
  - marker: a
    text: Or 'an illegitimate person will dwell in Ashdod.' The Hebrew מַמְזֵר is difficult and may denote a person of mixed or excluded status; here it is rendered collectively in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 혼합된 사람들이[a] 아스돗에 거주하게 될 것이며, 내가 블레셋 사람들의 교만을 끊어 버리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사생아 한 사람이’. 히브리어 מַמְזֵר는 뜻이 난해하며, 여기서는 혼합되었거나 사회적으로 배제된 신분의 사람 또는 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  english_pob_choice: will dwell
  chosen_korean: 거주하게 될 것입니다
  alternatives_korean:
  - 살게 될 것입니다
  - 머물게 될 것입니다
  - 정착하게 될 것입니다
  lexicon: HALOT
  rationale: 도시 안에 살게 된다는 뜻을 자연스러운 현대 한국어로 옮기되, 예언적 거주의 의미를 유지하기 위해 ‘거주하다’를 선택했습니다.
- source_word: מַמְזֵר
  english_pob_choice: a mixed people
  chosen_korean: 다른 민족
  alternatives_korean:
  - 사생아 한 사람
  - 혼합된 사람들
  - 섞인 백성
  lexicon: HALOT
  rationale: 영어 POB의 집단적 이해를 따라, 아스돗의 정체성 변화와 외래적/혼합적 구성을 드러내는 표현으로 옮겼습니다. ‘사생아’는 한국어에서 지나치게 협소하고 도덕적 비난이 강해 문맥을 오해시킬 수 있습니다.
- source_word: גְּאוֹן
  english_pob_choice: the pride
  chosen_korean: 교만
  alternatives_korean:
  - 자랑
  - 오만
  - 위세
  lexicon: HALOT
  rationale: 심판 문맥에서 ‘자랑’보다 도덕적·예언적 뉘앙스가 분명한 ‘교만’이 מתאים합니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋
  - 블레셋 족속
  lexicon: HALOT
  rationale: 히브리어는 사람 집단을 가리키므로, 지명보다 민족 집단을 드러내는 ‘블레셋 사람들’이 정확합니다.
theological_decisions:
- issue: מַמְזֵר의 집단적 의미와 심판 오라클의 효과
  chosen_reading: 아스돗에 거주하게 될 주체를 ‘다른 민족’으로 옮겨, 블레셋의 고유성과 자만이 꺾이는 심판을 드러냈습니다.
  alternative_readings:
  - 사생아 한 사람이 거주하게 될 것이다
  - 외국인이 거주하게 될 것이다
  rationale: 이 단어는 사전적으로 난해하지만, 본문 전체는 개인의 신분 판정이 아니라 도시와 민족의 정체성 변화에 초점을 둡니다. 따라서 집단적·사회적 함의를 살리는 번역이 독자에게 더 정확한 이해를 줍니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
