  to: 내가 에브라임에서 전차를, 예루살렘에서 말을 끊고, 전쟁의 활도 끊을 것입니다. 그는 민족들에게 평화를 선포할 것이며, 그의 통치는 바다에서 바다까지, 그 강[a]에서 땅끝까지 이를 것입니다.
