id: ZEC.9.10
reference: Zechariah 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכְרַתִּי רֶ֣כֶב מֵ/אֶפְרַ֗יִם וְ/סוּס֙ מִ/יר֣וּשָׁלִַ֔ם וְ/נִכְרְתָה֙ קֶ֣שֶׁת מִלְחָמָ֔ה וְ/דִבֶּ֥ר שָׁל֖וֹם לַ/גּוֹיִ֑ם וּ/מָשְׁל/וֹ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/נָּהָ֖ר עַד אַפְסֵי אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
  footnotes:
  - marker: a
    text: Or 'his dominion will be from sea to sea.'
    reason: lexical_alternative
  - marker: b
    text: '''The River'' likely refers to the Euphrates.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 에브라임에서 전차를, 예루살렘에서 말을 끊고, 전쟁의 활도 끊을 것입니다. 그는 민족들에게 평화를 선포할 것이며, 그의 통치는 바다에서 바다까지, 그 강[a]에서 땅끝까지 이를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 강’은 일반적으로 유프라테스강을 가리키는 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: And I will cut off
  chosen_korean: 내가 ... 끊을 것이며
  alternatives_korean:
  - 내가 ... 제거할 것이며
  - 내가 ... 끊어 버릴 것이며
  lexicon: HALOT
  rationale: 예언적 단절의 강한 동사를 살리되, 한국어에서 자연스럽고 시각적인 ‘끊다’로 옮겨 원문의 단호함을 유지했습니다.
- source_word: רֶכֶב ... וְסוּס
  english_pob_choice: the chariot ... the horse
  chosen_korean: 전차 ... 말
  alternatives_korean:
  - 병거 ... 말
  - 전차대 ... 말들
  lexicon: HALOT
  rationale: רֶכֶב은 전쟁 장비로서의 전차를 가리키므로 ‘전차’로, 단수형의 집합적 용법은 한국어에서도 그대로 살렸습니다.
- source_word: וְדִבֶּר שָׁלוֹם
  english_pob_choice: and he will speak peace
  chosen_korean: 평화를 말할 것입니다
  alternatives_korean:
  - 평화를 선포할 것입니다
  - 평강을 말할 것입니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 따라 ‘말하다’로 두되, 내용어 שָׁלוֹם은 ‘평화’로 옮겨 메시아적 통치의 성격을 분명히 했습니다.
- source_word: לַגּוֹיִם
  english_pob_choice: to the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들에게
  - 이방인들에게
  lexicon: HALOT
  rationale: 여기서는 비유대인이라는 기술적 대비보다 보편적 대상이 핵심이므로 ‘민족들’이 자연스럽고 문맥에 맞습니다.
- source_word: וּמָשְׁלוֹ
  english_pob_choice: and his dominion will be
  chosen_korean: 그의 다스림은
  alternatives_korean:
  - 그의 통치는
  - 그의 지배는
  lexicon: HALOT
  rationale: 접미사가 붙은 명사형을 살려 ‘다스림’으로 옮겼고, 왕권의 범위를 한국어에서 가장 무리 없이 드러냈습니다.
- source_word: מִיָּם עַד יָם ... מִנָּהָר עַד אַפְסֵי אָרֶץ
  english_pob_choice: from sea to sea ... from the River to the ends of the earth
  chosen_korean: 바다에서 바다까지, 그리고 강에서 땅끝까지
  alternatives_korean:
  - 바다에서 바다까지, 그리고 그 강에서 땅끝까지
  - 바다에서 바다까지, 그리고 유프라테스강에서 땅끝까지
  lexicon: HALOT
  rationale: 관용구의 광대한 범위를 그대로 살리되, ‘강’은 본문이 지시하는 유프라테스의 관용적 호칭을 지나치게 풀지 않고 유지했습니다.
theological_decisions:
- issue: 1인칭 하나님의 선언과 3인칭 왕의 통치가 이어지는 구조
  chosen_reading: 첫 절반은 하나님이 말씀하시는 1인칭으로, 뒤는 앞 문맥의 왕을 가리키는 3인칭으로 유지했습니다.
  alternative_readings:
  - 모두 비인칭으로 바꾸어 '평화가 선포될 것입니다'처럼 처리
  rationale: 원문의 화자 전환과 왕적-메시아적 묘사를 보존해야 하므로, 주어를 비인칭화하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존
