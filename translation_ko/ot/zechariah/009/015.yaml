id: ZEC.9.15
reference: Zechariah 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: ko
  text: 만군의 야훼께서[a] 그들을 보호하실 것이며, 그들은 삼킬 것이며 물매 돌들을 짓밟을 것입니다. 그들은 마시고 포도주에 취한 듯 함성을 지르며, 대접[b]처럼, 제단의 모퉁이들[c]처럼 가득 찰 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼’는 히브리어 하나님의 이름 יהוה를 옮긴 것입니다. ‘만군’은 צְבָאוֹת, 곧 군대들을 뜻합니다.
    reason: divine_name
  - marker: b
    text: ‘대접’은 히브리어 מִזְרָק으로, 성전 제의에서 쓰인 그릇을 가리킵니다.
    reason: source_note
  - marker: c
    text: 히브리어는 ‘모퉁이들’이라는 복수형을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָ֣ה צְבָאוֹת
  english_pob_choice: The LORD of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: YHWH
  rationale: POB의 영어가 ‘LORD of Armies’로 야훼를 가리키는 호칭이므로, 본문 관행에 따라 ‘야훼’를 유지하고 צְבָאוֹת은 ‘만군’으로 옮겼습니다.
- source_word: יָגֵן
  english_pob_choice: will shield
  chosen_korean: 보호하시면
  alternatives_korean:
  - 방패가 되시면
  - 지키시면
  lexicon: גן/הגן
  rationale: 단순한 방어보다 보호·호위의 뉘앙스를 살려 문맥상 결과를 자연스럽게 드러냈습니다.
- source_word: כְּמוֹ יָיִן
  english_pob_choice: as if with wine
  chosen_korean: 포도주처럼
  alternatives_korean:
  - 술처럼
  - 포도주를 마신 듯
  lexicon: כמו + יין
  rationale: 직역하되 한국어 관용에 맞게 비교구문으로 처리하여, 흥분과 충만의 비유를 유지했습니다.
- source_word: וּמָלְאוּ כַּמִּזְרָק כְּזָוִיּוֹת מִזְבֵּחַ
  english_pob_choice: filled like a bowl, like the corners of the altar
  chosen_korean: 대접 같고 제단의 모퉁이들 같게 가득 찰 것입니다
  alternatives_korean:
  - 그릇 같고 제단의 모퉁이들 같게 채워질 것입니다
  - 대접처럼, 제단의 모퉁이들처럼 가득할 것입니다
  lexicon: מִזְרָק / זָוִיּוֹת
  rationale: מִזְרָק을 ‘대접’으로 옮겨 제의적 그릇 이미지를 살리고, כְּזָוִיּוֹת는 복수성을 반영해 ‘모퉁이들’로 처리했습니다.
theological_decisions:
- issue: 전쟁 승리와 제의적 충만의 병치
  chosen_reading: ‘삼킬 것’과 ‘대접 같고 제단의 모퉁이들 같게 가득 찰 것’이라는 병치를 그대로 살려, 승리의 폭력성과 제의적 풍성함이 함께 드러나게 했습니다.
  alternative_readings:
  - 승리 은유로 완화하여 옮김
  - 제의 이미지를 설명적으로 풀어씀
  rationale: 히브리어 시구는 정복 이미지와 제단 이미지의 충격적 대비를 유지하므로, 이를 순화하지 않고 병치 구조를 보존했습니다.
  doctrine_reference: 문자적-시적 병행 보존
