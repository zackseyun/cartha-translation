translation:
  language: ko
  text: 또 하맛[a]도 그곳에 접해 있고, 두로와 시돈은 매우 지혜롭기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하맛도 그곳에 접해 있고, 두로와 시돈은 매우 지혜롭습니다.’ 히브리어는 ‘지혜롭다’에 해당하는 말이 여성 단수 형태인데, 병렬된 도시 이름들과 연결되어 문법 관계가 다소 어색합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  english_pob_choice: and also
  chosen_korean: 그리고 또
  alternatives_korean:
  - 또
  - 심지어
  lexicon: HALOT
  rationale: 앞절의 심판 열거에 이어지는 누적·첨가의 힘을 살리면서, 현대 한국어에서 자연스럽게 두 요소를 함께 잇는 표현입니다.
- source_word: תִּגְבָּל בָּהּ
  english_pob_choice: which borders on it
  chosen_korean: 그 경계에 있으며
  alternatives_korean:
  - 그것에 접하고 있으며
  - 그 위에 경계를 이루며
  lexicon: HALOT
  rationale: גבל의 ‘경계를 이루다, 접하다’라는 뜻을 살려 하맛이 어떤 대상과 맞닿아 있음을 간결하게 옮겼습니다. 한국어에서는 관계절보다 서술형이 더 자연스럽습니다.
- source_word: צֹר וְצִידוֹן
  english_pob_choice: Tyre and Sidon
  chosen_korean: 두로와 시돈
  alternatives_korean:
  - 티레와 시돈
  - 두로와 시돈
  lexicon: HALOT
  rationale: 두로는 한국 교회에서 널리 쓰이는 고유명사형을 따랐고, 시돈과 병렬 구조를 유지했습니다.
- source_word: חָכְמָה מְאֹד
  english_pob_choice: they are very wise
  chosen_korean: 매우 지혜롭기 때문입니다
  alternatives_korean:
  - 아주 지혜롭기 때문입니다
  - 지혜가 매우 크기 때문입니다
  lexicon: HALOT
  rationale: חכמה의 형용사적 용법을 한국어에서는 ‘지혜롭다’로 자연스럽게 풀어, 도시들의 두드러진 지혜를 현재적 성질로 전달했습니다.
theological_decisions:
- issue: 하맛의 관계절과 두로·시돈의 지혜를 어떻게 묶을 것인가
  chosen_reading: 하맛은 경계에 있고, 두로와 시돈은 매우 지혜롭다는 진술을 이유절로 연결했습니다.
  alternative_readings:
  - 하맛도 그 경계에 있으며, 두로와 시돈은 매우 지혜롭습니다
  - 하맛은 경계에 있고, 두로와 시돈은 매우 지혜롭습니다 — 왜냐하면…
  rationale: 히브리어의 압축된 병렬을 해치지 않으면서 כִּי의 설명·이유 기능을 살려, 도시들을 소개하는 문맥으로 자연스럽게 연결했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: חָכְמָה의 단수형을 한국어에서 어떻게 처리할 것인가
  chosen_reading: 두 도시를 함께 가리키는 복수적 의미로 옮겼습니다.
  alternative_readings:
  - 시돈은 매우 지혜롭습니다
  - 그는 매우 지혜롭습니다
  rationale: 히브리어는 형태상 여성 단수이지만, 문맥상 두로와 시돈이 함께 보이므로 한국어에서는 복수로 옮겨 인칭·수의 불일치를 드러내지 않게 했습니다.
  doctrine_reference: Translation philosophy §6
