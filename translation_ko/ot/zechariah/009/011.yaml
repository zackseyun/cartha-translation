base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
  footnotes:
  - marker: a
    text: Or 'by the blood of your covenant.' The Hebrew preposition can be understood instrumentally as well as causally.
    reason: lexical_alternative
  - marker: b
    text: '''Pit'' may also be rendered ''cistern'' or ''dungeon,'' a waterless holding place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신도, 당신의 언약의 피 때문에[a], 내가 당신의 갇힌 이들을 물 없는 구덩이[b]에서 내보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때문에’는 본문의 히브리어 전치사 ב를 원인적으로 이해한 번역입니다. ‘당신의 언약의 피로’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘구덩이’는 히브리어 בור의 넓은 의미를 따른 번역이며, ‘저수조’ 또는 ‘감옥’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  english_pob_choice: As for you also
  chosen_korean: 당신에게도
  alternatives_korean:
  - 당신도
  - 또한 당신도
  lexicon: HALOT
  rationale: 가님/אַתְּ의 연결·강조를 한국어 부사격 표현으로 간결하게 살려, 앞 문맥과 이어지는 추가적 호소를 자연스럽게 나타냈습니다.
- source_word: בְּדַם בְּרִיתֵךְ
  english_pob_choice: because of the blood of your covenant
  chosen_korean: 당신의 언약의 피 때문에
  alternatives_korean:
  - 당신의 언약의 피로
  - 당신의 언약의 피를 따라
  lexicon: HALOT
  rationale: ב의 원인/수단 가능성을 한국어에서는 '때문에'로 포괄해, 언약 피가 석방의 근거라는 점을 분명히 하면서도 본문의 해석 여지를 남겼습니다.
- source_word: מִבּוֹר אֵין מַיִם בּוֹ
  english_pob_choice: from the pit in which there is no water
  chosen_korean: 물 없는 구덩이에서
  alternatives_korean:
  - 물이 없는 웅덩이에서
  - 물이 없는 함정에서
  - 물 없는 감옥에서
  lexicon: HALOT
  rationale: בּוֹר의 넓은 의미를 '구덩이'로 살리되, 뒤의 무수(水無) 설명을 자연스럽게 압축해 물 없는 갇힘의 이미지를 유지했습니다.
- source_word: שִׁלַּחְתִּי אֲסִירַיִךְ
  english_pob_choice: I have sent out your prisoners
  chosen_korean: 내가 당신의 포로들을 내보냈습니다
  alternatives_korean:
  - 내가 당신의 감옥에 갇힌 자들을 풀어주었습니다
  - 내가 당신의 포로들을 놓아주었습니다
  lexicon: HALOT
  rationale: שׁלח의 '보내다/내보내다'를 유지하면서, אֲסִירִים의 억류 상태를 '포로들'로 옮겨 해방의 동작을 분명히 했습니다.
theological_decisions:
- issue: ‘언약의 피’의 범위와 구체화
  chosen_reading: 본문은 특정 언약 사건을 본문 안에서 한정하지 않고 '언약의 피'라는 언약 체결 언어를 그대로 살렸습니다.
  alternative_readings:
  - 시내 언약의 피를 가리킨다는 해석
  - 새 언약을 예표한다는 해석
  rationale: 예언문 자체는 어떤 언약인지를 명시하지 않으므로, 번역은 신학적 무게를 보존하되 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 본문의 해석적 긴장을 유지한다.
