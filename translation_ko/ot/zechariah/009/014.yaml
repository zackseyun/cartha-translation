id: ZEC.9.14
reference: Zechariah 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
  footnotes:
  - marker: a
    text: Hebrew shofar, a ram's horn used as a battle signal or ceremonial trumpet.
    reason: cultural_note
  - marker: b
    text: Or 'in the whirlwinds of Teman.' 'Teman' can be understood as a place-name or as 'the south.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 그들 위에 나타나실 것이며, 그의 화살은 번개처럼 나아갈 것입니다. 주 야훼께서 나팔을 부시고[a] 남쪽의 회오리바람 가운데서 행진하실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘쇼파르’는 전쟁 신호나 의식용으로 쓰인 숫양의 뿔입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘데만의 회오리바람 가운데서’. ‘데만’은 지명으로도, ‘남쪽’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה를 직함으로 바꾸지 않고 고유명사로 드러내기 위해 '야훼'를 사용했습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들에게
  - 그들 위에서
  lexicon: HALOT
  rationale: 시각적·공간적 이미지를 살리면서도 공격 대상을 단정하지 않기 위해 '그들 위에'로 옮겼습니다.
- source_word: בַּשּׁוֹפָר
  english_pob_choice: the trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 쇼파르
  - 뿔나팔
  lexicon: HALOT
  rationale: 기능상 경보·전쟁 신호를 나타내는 כלי이므로 본문에는 자연스러운 '나팔'을 두고, 문화적 특수성은 필요 시 주석으로 다루는 편이 적절합니다.
- source_word: תֵּימָן
  english_pob_choice: of the south
  chosen_korean: 남쪽
  alternatives_korean:
  - 데만
  - 남방
  lexicon: HALOT
  rationale: 시적 병행과 폭풍 이미지 속에서 지리명보다 방위어가 더 직접적으로 의미를 전달하므로 '남쪽'으로 번역했습니다.
theological_decisions:
- issue: 하나님의 이름과 칭호를 함께 어떻게 보일지
  chosen_reading: '''야훼''와 ''주 하나님''을 함께 유지하여 고유한 이름과 주권적 칭호를 모두 드러냈습니다.'
  alternative_readings:
  - '''주님''으로 통일'
  - '''야훼 하나님''으로 직역'
  rationale: 본문은 יְהוָה와 אֲדֹנָי יְהוִה를 연속해 사용하므로, 이름과 칭호의 구별을 지우지 않으면서도 한국어로 자연스럽게 읽히도록 구분해 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מ발화의 전투-신현적 이미지
  chosen_reading: '''번개처럼''과 ''회오리바람 가운데서 행하십니다''로 신현적 전쟁 이미지를 보존했습니다.'
  alternative_readings:
  - '''번개같이'''
  - '''남쪽의 폭풍 가운데서'''
  rationale: 본절은 단순한 이동이 아니라 야훼의 현현과 군사적 행진을 결합하므로, 이미지의 강도를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: Zechariah 9의 여호와 전사 이미지
