  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תֵּרֶ֨א אַשְׁקְל֜וֹן וְ/תִירָ֗א וְ/עַזָּה֙ וְ/תָחִ֣יל מְאֹ֔ד וְ/עֶקְר֖וֹן כִּֽי הֹבִ֣ישׁ מֶבָּטָ֑/הּ וְ/אָ֤בַד מֶ֨לֶךְ֙ מֵֽ/עַזָּ֔ה וְ/אַשְׁקְל֖וֹן לֹ֥א תֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
  footnotes:
  - marker: a
    text: Or 'because her expectation has been disappointed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Gaza will writhe greatly'; the Hebrew sequence may be read with Gaza as the subject of 'will writhe greatly.'
    reason: alternative_reading
translation:
  language: ko
  text: 아스글론은 그것을 보고 두려워할 것이며[a], 가사도 크게 몸부림칠 것이고, 에그론은 그 희망이 수치를 당했기 때문입니다. 가사에서 왕이 사라질 것이며[b], 아스글론은 더 이상 사람이 살지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 희망이 수치를 당했기 때문에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가사는 크게 몸부림칠 것이며’로 읽을 수 있습니다. 히브리어 연속은 ‘가사’를 ‘크게 몸부림칠’의 주어로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּרֶא ... וְתִירָא
  english_pob_choice: Ashkelon will see and fear
  chosen_korean: 아스글론은 그것을 보고 두려워할 것이며
  alternatives_korean:
  - 아스글론은 보고 두려워할 것이며
  - 아스글론은 그것을 보고 두려워하게 될 것이며
  lexicon: HALOT
  rationale: ראה와 ירא의 연속 동작을 한국어에서 자연스럽게 살리기 위해 ‘보고 두려워할 것이다’로 옮겼고, 영어 POB의 생략된 목적어를 반영해 ‘그것’을 보충했습니다.
- source_word: וְתָחִיל מְאֹד
  english_pob_choice: Gaza also will writhe greatly
  chosen_korean: 가사도 크게 몸부림칠 것이고
  alternatives_korean:
  - 가사도 크게 떨릴 것이고
  - 가사도 크게 고통스러워할 것이고
  lexicon: HALOT
  rationale: חיל의 신체적·산고적 떨림을 ‘몸부림치다’로 살려, 단순한 ‘떨다’보다 예언적 충격을 더 강하게 표현했습니다.
- source_word: הֹבִישׁ מֶבָּטָהּ
  english_pob_choice: her hope has been put to shame
  chosen_korean: 그 희망이 수치를 당했기 때문입니다
  alternatives_korean:
  - 그 소망이 수치를 당했기 때문입니다
  - 그 기대가 부끄러움을 당했기 때문입니다
  lexicon: HALOT
  rationale: מבט는 기대/바람의 대상이 될 수 있으므로, 문맥상 에그론의 기대가 무너진 뜻을 살려 ‘희망’으로 옮겼고, הוביש의 인과를 수동형으로 반영했습니다.
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  english_pob_choice: A king will perish from Gaza
  chosen_korean: 가사에서 왕이 사라질 것이며
  alternatives_korean:
  - 가사에서 왕이 망할 것이며
  - 가사로부터 왕이 멸망할 것이며
  lexicon: HALOT
  rationale: אָבד는 ‘멸망하다/사라지다/잃다’의 폭이 있어, 도시가 왕을 잃는 결과를 자연스럽게 드러내는 ‘사라지다’를 택했습니다.
- source_word: לֹא תֵשֵׁב
  english_pob_choice: Ashkelon will not be inhabited
  chosen_korean: 아스글론은 더 이상 사람이 살지 않을 것입니다
  alternatives_korean:
  - 아스글론은 거주되지 않을 것입니다
  - 아스글론은 다시는 정착되지 않을 것입니다
  lexicon: HALOT
  rationale: ישב의 도시 용례를 현대 한국어로 자연스럽게 풀어 ‘사람이 살다’로 옮겼습니다.
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  english_pob_choice: Ashkelon / Gaza / Ekron
  chosen_korean: 아스글론 / 가사 / 에그론
  alternatives_korean:
  - 아스켈론 / 가자 / 에그론
  lexicon: 현대 외래어 표기법 + 성서 관용형
  rationale: 지명은 현대 외래어 표기 관행을 따르되, 이미 성서 한국어에서 널리 쓰이는 관용형과의 균형을 고려해 표기했습니다.
theological_decisions:
- issue: 예언적 심판의 정서 강도
  chosen_reading: ‘몸부림칠 것이고’, ‘수치를 당했기 때문입니다’, ‘더 이상 사람이 살지 않을 것입니다’로 심판의 충격과 도시의 황폐를 직접적으로 드러냈습니다.
  alternative_readings:
  - 더 부드러운 ‘떨릴 것이고’
  - ‘부끄러움을 당했기 때문입니다’
  - ‘거주되지 않을 것입니다’
  rationale: 본문은 블레셋 성읍들에 임하는 실질적 붕괴를 묘사하므로, 의미를 약화시키지 않는 범위에서 강한 동사를 유지했습니다.
  doctrine_reference: 예언서의 심판 언어는 역사적·신학적 경고의 실재를 전달해야 합니다.
