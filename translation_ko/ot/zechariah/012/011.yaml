id: ZEC.12.11
reference: Zechariah 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
  footnotes:
  - marker: a
    text: Hadad-rimmon may refer to a place near Megiddo, possibly associated with the mourning for Josiah (cf. 2 Chr 35:22–25), or to another well-known lament tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에는 예루살렘의 슬픔이 하닷림몬이 므깃도 평야에서 있었던 슬픔처럼 크게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '하닷림몬은 므깃도 근처의 장소를 가리킬 수 있으며, 요시야를 애도한 사건과 관련되었을 가능성도 있고(참조: 2대하 35:22–25), 다른 잘 알려진 애곡 전통을 가리킬 수도 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그날에
  - 그때에는
  lexicon: HALOT
  rationale: 예언서의 관용적 시간표현을 현대 표준어로 자연스럽게 옮기되, 종말론적 지시성을 유지했습니다.
- source_word: הַמִּסְפֵּד
  english_pob_choice: the mourning
  chosen_korean: 슬픔
  alternatives_korean:
  - 애도
  - 애통
  lexicon: HALOT
  rationale: 공적 애곡의 뉘앙스를 살릴 수 있는 한국어로 옮겼습니다. '슬픔'은 결과 상태를, 문맥상 이어지는 비교구는 그 애통의 강도를 나타냅니다.
- source_word: הֲדַד רִמּוֹן
  english_pob_choice: Hadad-rimmon
  chosen_korean: 하닷림몬
  alternatives_korean:
  - 하닷-림몬
  - 하닷림몬
  lexicon: HALOT
  rationale: 고유명사를 음역하되, 한국어 성경 독자에게 익숙하게 붙여 쓰는 형태를 택했습니다.
- source_word: בְּבִקְעַת מְגִדּוֹן
  english_pob_choice: in the plain of Megiddo
  chosen_korean: 므깃도 평야에서
  alternatives_korean:
  - 므깃도 골짜기에서
  - 메깃도 평야에서
  lexicon: HALOT
  rationale: בִּקְעָה의 지형적 의미는 넓은 평야/골짜기이므로, POB의 'plain'을 따라 '평야'로 옮겼습니다.
theological_decisions:
- issue: 하닷림몬의 역사적 지시 대상
  chosen_reading: 본문의 비교 표현을 유지하고, 구체적 사건 해석은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 요시야의 죽음을 애도한 사건으로 특정
  - 하닷림몬과 관련된 다른 애곡 전통으로 이해
  rationale: 히브리어 본문은 하닷림몬을 언급하지만 설명하지 않으므로, 해석 논쟁을 본문 안에 끌어들이지 않고 비교 대상의 불확실성을 보존했습니다.
  doctrine_reference: 의도적 해석 보류와 본문 긴장 보존
