  source_fidelity: 수정이 필요합니다. 초안의 ‘하닷림몬이 므깃도 평야에서 있었던 슬픔’은 하닷림몬을 사건의 주체처럼 만들고 ‘있었던’ 사건을 보충하여, 히브리어의 간결한 비교구와 고유명사의 불확실성을 흐립니다. 히브리어는 예루살렘의 애곡이 ‘므깃도 평야에서의 하닷림몬 애곡’과 같아질 것이라고 비교합니다.
  naturalness: ‘슬픔’은 개인적 감정 상태로 들리기 쉬워 공적·의례적 죽음 애곡을 뜻하는 מִסְפֵּד에 충분하지 않습니다. ‘애곡’은 문맥과 현대 문어체에 자연스럽고 정확합니다. 수정문은 합쇼체의 미래 표현을 유지합니다.
  terminology: 예루살렘, 하닷림몬, 므깃도는 음역을 유지했습니다. ‘애곡’은 מִסְפֵּד의 공적 애도·곡의 의미를 보존합니다. 하닷림몬의 지시 대상은 본문에서 특정하지 않고, 각주는 지명 및 애곡 전통이라는 가능성을 조건적으로 제시합니다.
