source:
  edition: WLC
  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
  footnotes:
  - marker: a
    text: Or 'the dwellings of Judah.' The Hebrew literally says 'the tents of Judah,' likely contrasting Judah's outlying settlements with Jerusalem and the Davidic house.
    reason: lexical_alternative
  - marker: b
    text: Or 'may not be exalted above Judah.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 유다의 장막들[a]을 먼저 구원하실 것입니다. 이는 다윗의 집의 영광과 예루살렘 주민들의 영광이 유다보다 더 높아지지 않게 하시려는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막들’은 문자적 표현이며, 유다의 거처들이나 외곽의 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다 위에 높아지지’입니다. 여기서는 유다에 대한 우월함 또는 더 높은 지위를 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명인 יהוה를 제목이 아닌 이름으로 드러내기 위해, POB의 영어 선택과 맞추어 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: אָהֳלֵי יְהוּדָה
  english_pob_choice: the tents of Judah
  chosen_korean: 유다의 장막들
  alternatives_korean:
  - 유다의 거처들
  - 유다의 주거들
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘장막들’을 살려, 유다의 변두리 거주지/백성이라는 대비를 유지했습니다.
- source_word: תִּפְאֶרֶת
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 자랑
  lexicon: HALOT
  rationale: 문맥상 다윗의 집과 예루살렘 주민의 ‘영광’이 유다 위에 높아지는 대비이므로, ‘영광’이 가장 자연스럽고 의미 범위를 온전히 보존합니다.
- source_word: עַל יְהוּדָה
  english_pob_choice: over Judah
  chosen_korean: 유다보다 더 커지지
  alternatives_korean:
  - 유다 위에
  - 유다보다 높아지지
  lexicon: HALOT
  rationale: ‘עַל’의 우월/상승 의미를 한국어에서 자연스럽게 풀어, 단순한 위치가 아니라 우위가 형성되지 않음을 드러냈습니다.
theological_decisions:
- issue: 유다의 장막들 vs. 왕가·예루살렘의 대비
  chosen_reading: 문장은 야훼께서 왕적 중심지보다 먼저 유다의 주변/보통 백성을 구하시어, 특정 중심의 영광이 유다 전체 위에 군림하지 않게 하신다는 사회적·신학적 긴장을 유지합니다.
  alternative_readings:
  - 단순한 시간적 순서만 말하는 것으로 읽을 수 있음
  rationale: ‘먼저’와 ‘~보다 더 커지지 않게’라는 목적절이 결합되어 있어, 단순 순서 이상으로 중심부의 과도한 우월화를 제어하는 의미를 반영해야 합니다.
  doctrine_reference: 구원 우선순위와 공동체 내부의 겸손/형평성
