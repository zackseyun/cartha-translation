- from: 야훼께서 유다의 장막들을 먼저 구하실 것이니, 이는 다윗의 집과 예루살렘 주민의 영광이 유다보다 더 커지지 않게 하려 하심입니다.[a][b]
  to: 야훼께서 유다의 장막들[a]을 먼저 구원하실 것입니다. 이는 다윗의 집의 영광과 예루살렘 주민들의 영광이 유다보다 더 높아지지 않게 하시려는 것입니다.[b]
  rationale: 구원 동사의 의미를 분명히 하고, 현대 합쇼체에 맞게 문장을 재구성했습니다. 반복되는 ‘영광’을 명시하여 히브리어의 병렬을 보존했으며, ‘유다보다 더 높아지지’와 각주를 통해 עַל의 우월·상승 의미를 유지했습니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
