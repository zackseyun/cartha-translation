  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּוֹם הַ֠/הוּא אָשִׂ֨ים אֶת יְרוּשָׁלִַ֜ם אֶ֤בֶן מַֽעֲמָסָה֙ לְ/כָל הָ֣/עַמִּ֔ים כָּל עֹמְסֶ֖י/הָ שָׂר֣וֹט יִשָּׂרֵ֑טוּ וְ/נֶאֶסְפ֣וּ עָלֶ֔י/הָ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
  footnotes:
  - marker: a
    text: Or 'a burdensome stone for all the peoples.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'will surely be cut/gashed,' an intensified Hebrew expression for severe self-injury.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the nations of the land,' if 'land' is taken in a more local sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 나는 예루살렘을 모든 민족에게 무거운 돌로 삼겠습니다[a]. 그것을 들어 올리는 자는 모두 반드시 크게 다칠 것이며[b], 세상의 모든 민족이 예루살렘을 치러 모여들 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 민족에게 짐이 되는 돌'.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '반드시 심하게 베일 것입니다'라는 뜻의 강조된 히브리어 표현으로, 심한 상해를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그 땅의 모든 민족'. 여기서 '땅'은 더 지역적인 범위를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  english_pob_choice: And on that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그리고 그 날에
  - 그 날이 되면
  lexicon: HALOT
  rationale: 예언 담화의 시간 표지로서 자연스러운 현대 한국어를 택하되, 사건 전환의 기능은 유지했습니다.
- source_word: אֶבֶן מַעֲמָסָה
  english_pob_choice: a heavy stone
  chosen_korean: 무거운 돌
  alternatives_korean:
  - 짐이 되는 돌
  - 부담스러운 돌
  - 무거운 짐돌
  lexicon: HALOT
  rationale: 직역적 표현인 '짐이 되는 돌'의 의미를 살리면서도 한국어로는 '무거운 돌'이 가장 직접적으로 위험성과 압박감을 전달합니다.
- source_word: לְכָל הָעַמִּים
  english_pob_choice: for all the peoples
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 모든 민족에게
  - 모든 사람들에게
  lexicon: HALOT
  rationale: עַמִּים의 기본값은 '민족들'이지만, 한국어에서는 외세 집단을 가리키는 문맥상 '백성'이 보다 자연스럽고 포괄적입니다.
- source_word: כָּל עֹמְסֶיהָ
  english_pob_choice: All who lift it
  chosen_korean: 그것을 들어 올리는 자는 모두
  alternatives_korean:
  - 그것을 짊어지는 자는 모두
  - 그것을 옮기려는 자는 모두
  lexicon: HALOT
  rationale: 무거운 돌을 움직이려 드는 구체적 행위를 살리기 위해 '들어 올리다'를 택했습니다.
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  english_pob_choice: will surely injure themselves
  chosen_korean: 반드시 크게 다칠
  alternatives_korean:
  - 반드시 상처 입을
  - 반드시 베이게 될
  - 반드시 깊이 긁힐
  lexicon: HALOT
  rationale: 히브리어의 강한 강조(부정격/강조형 반복)를 한국어의 '반드시'로 반영했고, 신체 훼손의 결과를 '크게 다칠'로 자연스럽게 옮겼습니다.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  english_pob_choice: all the nations of the earth
  chosen_korean: 땅의 모든 민족
  alternatives_korean:
  - 땅의 모든 나라
  - 온 땅의 모든 민족
  - 세상의 모든 민족
  lexicon: HALOT
  rationale: POB의 지시처럼 כאן은 보편적 범위를 살리되, 한국어에서는 '땅의'가 '지상/세계'의 폭을 유지하면서도 문맥에 맞습니다.
theological_decisions:
- issue: 민족들이 예루살렘을 향해 모여드는 적대적 결집의 방향
  chosen_reading: 그것을 치러 모여들 것입니다
  alternative_readings:
  - 그것을 대적하여 모여들 것입니다
  - 그것을 향해 모일 것입니다
  rationale: וְנֶאֶסְפוּ עָלֶיהָ의 עַל는 단순한 집합보다 적대적 대항의 뉘앙스가 강하므로, '치러'로 전쟁적 긴장을 드러냈습니다.
  doctrine_reference: 예언서 문맥의 적대적 집결 표현
