  revised_text: 그날에 야훼께서 예루살렘 주민들을 보호하실 것입니다. 그날에 그들 가운데서 넘어지는 자는 다윗 같고, 다윗의 집은 하나님 같고[a] 그들 앞에 계시는 야훼의 천사 같을 것입니다.
