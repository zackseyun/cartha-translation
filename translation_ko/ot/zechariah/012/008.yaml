  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
  footnotes:
  - marker: a
    text: Or 'like divine beings' or 'like gods' for 'like God.' The Hebrew אֱלֹהִים can bear these senses in some contexts, though here the singular comparison is likely.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 야훼께서 예루살렘 주민을 보호하실 것입니다[a]. 그날에 그들 가운데서 넘어지는 자는 다윗 같고, 다윗의 집은 하나님 같으며, 야훼의 천사와 같아서 그들 앞에 설 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님 같은’에 대해 ‘신들 같은’ 혹은 ‘신적 존재들 같은’으로도 옮길 수 있습니다. 히브리어 אֱלֹהִים은 문맥에 따라 이런 뜻을 가질 수 있으나, 여기서는 단수 비교가 더 가능성이 높습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָגֵן
  english_pob_choice: will shield
  chosen_korean: 보호하실 것입니다
  alternatives_korean:
  - 지켜 주실 것입니다
  - 방패가 되어 주실 것입니다
  lexicon: HALOT
  rationale: 문맥상 보호와 방어의 이미지를 살리되, 한국어에서는 ‘방패로 덮다’보다 자연스러운 동사구로 옮겼습니다.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민
  alternatives_korean:
  - 예루살렘에 사는 자들
  - 예루살렘 거주민
  lexicon: HALOT
  rationale: 분사구가 집합적으로 쓰였으므로 단수 직역보다 공동체 전체를 가리키는 표현이 더 정확합니다.
- source_word: הַנִּכְשָׁל
  english_pob_choice: the one who stumbles
  chosen_korean: 넘어지는 자
  alternatives_korean:
  - 비틀거리는 자
  - 실족하는 자
  lexicon: HALOT
  rationale: כשל의 구체적 이미지인 ‘넘어짐’을 살리면서도, 내적 약함의 뉘앙스를 과장하지 않도록 했습니다.
- source_word: כֵּאלֹהִים
  english_pob_choice: like God
  chosen_korean: 하나님 같으며
  alternatives_korean:
  - 신들 같으며
  - 신적 존재들 같으며
  lexicon: HALOT
  rationale: 영어 POB의 단수 읽기를 따라 강한 비교를 살렸고, 한국어에서는 관용적으로 ‘하나님 같으며’로 옮기되 다의성은 각주로 보존했습니다.
theological_decisions:
- issue: כֵּאלֹהִים의 의미 범위
  chosen_reading: ‘하나님 같은’ 단수 비교
  alternative_readings:
  - ‘신들 같은’
  - ‘신적 존재들 같은’
  rationale: 바로 뒤의 ‘야훼의 천사와 같아서’와 병행되므로, 다윗의 집을 과장된 단수 비교로 높이는 수사가 더 자연스럽습니다. 다만 히브리어 אֱלֹהִים의 폭을 지우지 않기 위해 각주에 대안을 남깁니다.
  doctrine_reference: 본문의 수사적 긴장을 보존하고, 해석을 단정하지 않음.
