  to: 그날에 나는 예루살렘을 치러 오는 모든 민족을 멸하려고 할 것입니다.[a]
  rationale: ‘그날’을 현대 표준 표기로 바로잡고, ‘나서다’가 보탤 수 있는 행동 개시의 함의를 피했습니다. ‘멸하려고 할 것입니다’는 멸망을 목적으로 삼는 원문의 의미를 보존하며, 각주는 단호한 결의라는 가능한 어휘적 뉘앙스를 명시합니다.
