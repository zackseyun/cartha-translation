  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲבַקֵּ֗שׁ לְ/הַשְׁמִיד֙ אֶת כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
  footnotes:
  - marker: a
    text: Or 'I will set myself to destroy.' The Hebrew verb can emphasize determined intent, not merely searching.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 나는 예루살렘을 치러 오는 모든 민족을 멸하려고 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “멸하기로 작정할 것입니다.” 히브리어 동사는 단순히 찾는다는 뜻보다 단호한 의도와 결심을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그날에
  - 그 날에
  lexicon: HALOT
  rationale: 예언서의 정형적 시간 표현을 현대 한국어로 자연스럽게 살리되, 종말론적 지시를 과도하게 풀어 쓰지 않았습니다.
- source_word: אֲבַקֵּשׁ
  english_pob_choice: I will seek
  chosen_korean: 멸하려고 나설 것입니다
  alternatives_korean:
  - 멸하려고 할 것입니다
  - 멸하기를 찾을 것입니다
  - 멸하려고 애쓸 것입니다
  lexicon: HALOT
  rationale: בקש의 단순한 '찾다'보다 여기서는 결단된 의도와 착수를 드러내므로, POB의 주석이 말하는 ‘determined intent’를 한국어로 자연스럽게 표현했습니다.
- source_word: לְהַשְׁמִיד
  english_pob_choice: to destroy
  chosen_korean: 멸하다
  alternatives_korean:
  - 파멸시키다
  - 없애다
  - 멸절시키다
  lexicon: HALOT
  rationale: שמד의 강한 파괴 의미를 살리면서도 한국어 예언문맥에서 과도하게 기술적인 어휘보다 ‘멸하다’가 가장 직접적입니다.
- source_word: הַגּוֹיִם הַבָּאִים עַל יְרוּשָׁלִָם
  english_pob_choice: the nations that come against Jerusalem
  chosen_korean: 예루살렘을 치러 오는 모든 민족들
  alternatives_korean:
  - 예루살렘을 향해 오는 모든 나라들
  - 예루살렘에 맞서 오는 모든 민족들
  - 예루살렘을 공격하러 오는 모든 민족들
  lexicon: HALOT
  rationale: עַל이 적대적 방향성을 띠므로 ‘치러 오는’으로 전쟁적 대립을 드러냈고, גוים는 문맥상 ‘민족들’로 옮겨 이방 열강의 집합적 의미를 살렸습니다.
theological_decisions:
- issue: 하나님의 1인칭 심판 선언
  chosen_reading: ‘나는 … 멸하려고 나설 것입니다’로 직접적인 1인칭 신적 발화를 유지했습니다.
  alternative_readings:
  - 그들을 멸하실 것입니다
  - 멸망이 임할 것입니다
  rationale: 히브리어 동사의 1인칭 단수는 하나님 자신이 주체로 행동하시는 것을 분명히 하므로, 이를 비인칭화하거나 수동화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 정형적 종말/예언 시간표현
  chosen_reading: ‘그 날에’로 옮기고 그 이상은 덧붙이지 않았습니다.
  alternative_readings:
  - 그날에는 마지막 때에
  - 그 심판의 날에
  rationale: 본문은 시점 표지 이상을 설명하지 않으므로, 특정 종말 체계나 해석을 주입하지 않고 예언적 형식을 보존했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3
