id: ZEC.12.10
reference: Zechariah 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
  footnotes:
  - marker: a
    text: Or 'they will look on me.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from 'me' to 'him' in this clause; the translation preserves that tension rather than smoothing it out.
    reason: alternative_reading
  - marker: c
    text: Or 'a spirit of grace and supplication.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 다윗의 집과 예루살렘의 주민들에게 은혜와 간구의 영을 부어 줄 것이며, 그들은 자기들이 찌른 나를 바라볼 것입니다. 그들은 외아들을 위해 애곡하듯 그를 두고 슬퍼하며, 맏아들을 두고 쓰라리게 통곡할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나를 바라볼 것이다’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 이 절에서 1인칭 ‘나’와 3인칭 ‘그’를 오가므로, 번역에서 그 긴장을 평탄화하지 않았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁפַכְתִּי
  english_pob_choice: I will pour out
  chosen_korean: 부어 줄 것입니다
  alternatives_korean:
  - 쏟아부을 것입니다
  - 부을 것입니다
  lexicon: HALOT
  rationale: רוּחַ와 함께 쓰인 שָׁפַךְ의 비유를 살리면서, 현대 한국어에서 자연스럽고 은혜의 풍성한 베풂을 잘 드러내는 표현으로 옮겼습니다.
- source_word: ר֤וּחַ חֵן֙ וְתַחֲנוּנִים
  english_pob_choice: a spirit of grace and supplication / pleas for mercy
  chosen_korean: 은혜와 간구의 영
  alternatives_korean:
  - 은혜와 자비를 비는 영
  - 은혜와 간청의 영
  - 은혜와 구원의 영
  lexicon: HALOT
  rationale: תַחֲנוּנִים는 단순한 ‘기도’보다 절실한 간구를 가리키므로 ‘간구’로 옮겼고, 영어 POB의 어휘 결정을 반영해 너무 해석을 덧붙이지 않으면서도 자연스럽게 표현했습니다.
- source_word: וְהִבִּיטוּ אֵלַי
  english_pob_choice: they will look to me
  chosen_korean: 그들은 자기들이 찌른 나를 바라볼 것입니다
  alternatives_korean:
  - 그들은 나를 바라볼 것입니다
  - 그들은 나에게 시선을 둘 것입니다
  - 그들은 나를 우러러볼 것입니다
  lexicon: HALOT
  rationale: אֶל + נבט의 방향성을 단순한 관찰보다 인격적 응시로 살리되, 뒤의 상대절과 연결하여 대상이 누구인지 분명하게 드러냈습니다.
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  english_pob_choice: the one whom they pierced
  chosen_korean: 자기들이 찌른 나
  alternatives_korean:
  - 그들이 찌른 이
  - 찌른 그분
  - 그들이 창으로 찔러 죽인 이
  lexicon: HALOT
  rationale: 히브리어의 1인칭 ‘나’와 상대절의 객관적 지시를 함께 살려, 본문이 가진 긴장감을 유지했습니다.
- source_word: וְסָפְדוּ עָלָיו
  english_pob_choice: they will mourn for him
  chosen_korean: 그를 두고 슬퍼하며
  alternatives_korean:
  - 그를 위해 애도하며
  - 그를 위해 곡하며
  - 그를 두고 애곡하며
  lexicon: HALOT
  rationale: 상례적 애곡의 뜻을 담되 현대 한국어에서 자연스러운 슬픔의 표현으로 옮겼습니다.
- source_word: הַיָּחִיד
  english_pob_choice: an only son
  chosen_korean: 외아들을 위해
  alternatives_korean:
  - 외아들처럼
  - 외동아들을 위해
  - 독자를 두고
  lexicon: HALOT
  rationale: 비유의 핵심은 상실의 절대성을 강조하는 것이므로, 한국어에서도 가장 직접적으로 전달되는 ‘외아들’을 선택했습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: a firstborn
  chosen_korean: 맏아들을 두고
  alternatives_korean:
  - 첫아들을 두고
  - 장자를 두고
  - 첫째 아들을 두고
  lexicon: HALOT
  rationale: 첫 출생자의 상실이 주는 충격을 한국어의 상례 어휘와 맞물리게 하기 위해 ‘맏아들’로 옮겼습니다.
theological_decisions:
- issue: רוּחַ의 성령 여부
  chosen_reading: ‘영’으로 두어, 본문 자체가 요구하지 않는 명시적 성령 동일시를 피했습니다.
  alternative_readings:
  - ‘성령’으로 번역하기
  - 대문자화하여 신적 영으로 특정하기
  rationale: 히브리어 표현은 은혜와 간구의 성격을 지닌 영/태도를 가리킬 수 있으므로, 해석을 앞질러 특정하지 않고 원문의 개방성을 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘나’와 ‘그’를 오가는 대명사 긴장
  chosen_reading: ‘자기들이 찌른 나를 … 그를 두고’로, MT의 시점을 평탄화하지 않았습니다.
  alternative_readings:
  - 전부 1인칭으로 맞추기
  - 전부 3인칭으로 맞추기
  rationale: 히브리어가 보여 주는 긴장 자체가 본문 의미의 일부이므로, 이를 한국어에서도 드러내어 독자가 본문의 난점을 보게 했습니다.
  doctrine_reference: Translation philosophy §3
