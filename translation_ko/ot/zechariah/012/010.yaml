    rationale: 영어 감사 기록의 각주 a는 וְהִבִּיטוּ אֵלַי에 한정한 ‘look to/on me’의 어휘 대안입니다. 한국어 각주도 해당 동사구에 한정됨을 밝혀야 관계절이 삭제된 다른 본문 독법으로 오해되지 않습니다.
