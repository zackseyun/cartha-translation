base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/013.yaml
  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
  footnotes:
  - marker: a
    text: Or 'the family of Shimei.' The Hebrew likely refers to the Shimeite clan.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 집안은 따로, 그들의 아내들도 따로이며, 시므이 사람들의 집안도 따로, 그들의 아내들도 따로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시므이의 집안’입니다. 히브리어는 시므이와 관련된 씨족을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּ֤חַת
  english_pob_choice: the family of
  chosen_korean: 집안은
  alternatives_korean:
  - 가문은
  - 가족은
  - 씨족은
  lexicon: HALOT
  rationale: 문맥상 확장된 친족 집단을 가리키므로, 한국어에서는 ‘집안’이 자연스럽고 지나치게 현대 가족 단위로 좁히지 않습니다.
- source_word: בֵּית לֵוִי
  english_pob_choice: the house of Levi
  chosen_korean: 레위의 집안
  alternatives_korean:
  - 레위의 가문
  - 레위 집안
  - 레위의 집
  lexicon: HALOT
  rationale: ‘집’의 계보적 의미를 살리되 한국어에서는 ‘레위의 집안’이 가장 읽기 자연스럽고 혈통/가문 의미도 보존합니다.
- source_word: לְבָד
  english_pob_choice: by itself / by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 따로따로
  - 홀로
  - 별도로
  lexicon: HALOT
  rationale: 반복되는 분리의 강조를 한국어의 간결한 ‘따로’로 옮기면, 히브리어의 후렴 같은 구조를 무리 없이 재현할 수 있습니다.
- source_word: הַשִּׁמְעִי
  english_pob_choice: the Shimeites
  chosen_korean: 시므이 사람들의
  alternatives_korean:
  - 시므이의
  - 시므이 사람들의 가문
  - 시므이트의
  lexicon: HALOT
  rationale: 이 형태는 시므이와 관련된 집단명으로 보이므로, 영어 POB의 주석 가능성을 반영해 ‘시므이 사람들’로 풀어 군집적 의미를 드러냈습니다.
theological_decisions:
- issue: 남편과 아내의 분리된 애도 표현
  chosen_reading: ‘그들의 아내들도 따로’라는 구분을 그대로 유지했습니다.
  alternative_readings:
  - 남녀가 각각 따로
  - 각 집안이 따로
  rationale: 히브리어는 가족 집단과 그 아내들을 분리해 말하므로, 성별 구분을 희석하지 않고 본문이 주는 애도 방식의 분리를 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
