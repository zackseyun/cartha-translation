id: ZEC.12.12
reference: Zechariah 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
  footnotes:
  - marker: a
    text: Or 'family by family'; the Hebrew repeats 'families, families' to express a distributive sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the earth' for 'the land.'
    reason: alternative_reading
translation:
  language: ko
  text: 땅이 가족마다 따로 애도할 것입니다. 다윗 집안의 가족은 따로, 그들의 아내들도 따로, 나단 집안의 가족은 따로, 그들의 아내들도 따로 애도할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָפְדָה
  english_pob_choice: And ... will mourn
  chosen_korean: 애도할 것입니다
  alternatives_korean:
  - 슬퍼할 것입니다
  - 곡할 것입니다
  - 통곡할 것입니다
  lexicon: HALOT
  rationale: ספד는 장례적·공동체적 애도의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 과도하게 특정 방식으로 좁히지 않는 ‘애도하다’가 적합합니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 땅 전체
  - 나라
  lexicon: HALOT
  rationale: 문맥상 유다와 예루살렘의 가족 단위 애도를 말하므로, 우주적 ‘땅’보다 공동체가 사는 지역/토지로 읽히는 ‘땅’이 적절합니다.
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת לְבָד
  english_pob_choice: each family ... by itself
  chosen_korean: 가족마다 따로
  alternatives_korean:
  - 가족마다 홀로
  - 가문마다 따로
  - 가족, 가족마다
  lexicon: HALOT
  rationale: 반복 구조는 분배적 의미를 나타내므로, 한국어에서는 ‘가족마다’로 분배성을 살리고 ‘따로’로 분리된 애도를 표현했습니다.
- source_word: בֵּית דָּוִיד / בֵּית נָתָן
  english_pob_choice: the house of David / the house of Nathan
  chosen_korean: 다윗 집안 / 나단 집안
  alternatives_korean:
  - 다윗의 집 / 나단의 집
  - 다윗 가문 / 나단 가문
  - 다윗의 집안 / 나단의 집안
  lexicon: HALOT
  rationale: 히브리어의 집-계보 표현을 한국어에서 가장 자연스럽게 옮기면서도 혈통적·가문적 의미를 보존하는 ‘집안’을 사용했습니다.
- source_word: וּנְשֵׁיהֶם
  english_pob_choice: and their wives
  chosen_korean: 그들의 아내들도
  alternatives_korean:
  - 그들의 여자들도
  - 그들의 아내들 또한
  - 그 아내들도
  lexicon: HALOT
  rationale: 소유 대명사와 가족 문맥상 אִשָּׁה는 ‘아내’가 가장 분명하며, 남성 계열과 여성 계열이 각각 따로 애도한다는 대비를 살리기 위해 ‘들도’를 붙였습니다.
theological_decisions:
- issue: ‘땅’의 범위
  chosen_reading: 지역적·공동체적 의미의 ‘땅’
  alternative_readings:
  - 온 세상으로서의 ‘땅’
  - ‘나라’로의 의역
  rationale: 문맥은 특정 خاندان/가족들을 열거하는 유다적·언약적 범위이므로, 창조 세계 전체보다 그 땅의 공동체를 가리키는 읽음이 더 직접적입니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
