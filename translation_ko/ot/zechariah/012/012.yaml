  to: 땅은 가족마다 따로 애도할 것입니다. 다윗 집안의 가족은 따로 애도하고, 그들의 아내들도 따로 애도하며, 나단 집안의 가족은 따로 애도하고, 그들의 아내들도 따로 애도할 것입니다.
