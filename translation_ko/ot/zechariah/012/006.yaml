base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the leaders of Judah' or 'the chiefs of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'under herself,' an idiom meaning 'in her own place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 유다의 종족들을 나무 가운데 있는 불그릇처럼, 곡식단 가운데 있는 불붙은 횃불처럼 두리니, 그들이 오른쪽과 왼쪽의 모든 주변 민족들을 삼킬 것입니다. 예루살렘은 다시 자기 자리에, 곧 예루살렘 안에 거할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불그릇’은 본문의 ‘불이 든 그릇’ 이미지를 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘자기 아래’이지만, ‘자기 자리’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣לֻּפֵי יְהוּדָ֜ה
  english_pob_choice: the clans of Judah
  chosen_korean: 유다의 종족들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 우두머리들
  lexicon: HALOT
  rationale: 알루프의 의미를 이 문맥에서 개인 지도자보다 집단적 단위로 읽은 POB의 판단을 따라, 군사적·공동체적 주체감을 살리는 ‘종족들’로 옮겼습니다.
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  english_pob_choice: like a firepot among wood
  chosen_korean: 나무 가운데 있는 불그릇처럼
  alternatives_korean:
  - 나무 가운데 있는 화로처럼
  - 나무 가운데 있는 불항아리처럼
  lexicon: HALOT
  rationale: כִּיּוֹר의 그릇 이미지를 살리면서, 불이 담긴 용기라는 점을 자연스럽게 드러내는 ‘불그릇’을 택했습니다.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  english_pob_choice: and like a flaming torch among sheaves
  chosen_korean: 곡식단 가운데 있는 불붙은 횃불처럼
  alternatives_korean:
  - 곡식단 가운데 있는 불타는 횃불처럼
  - 짚단 가운데 있는 불붙은 횃불처럼
  lexicon: HALOT
  rationale: לַפִּיד אֵשׁ의 횃불 이미지를 직역에 가깝게 살리고, עָמִיר를 수확물 묶음의 뜻으로 보아 ‘곡식단’으로 옮겼습니다.
- source_word: וְאָכְלוּ
  english_pob_choice: they will consume
  chosen_korean: 삼킬 것입니다
  alternatives_korean:
  - 먹어 치울 것입니다
  - 집어삼킬 것입니다
  lexicon: HALOT
  rationale: 불이 사방을 태워 멸하는 비유를 살리기 위해, 파괴적 섭취의 은유를 드러내는 ‘삼키다’를 사용했습니다.
- source_word: עַל יָמִ֧ין וְעַל שְׂמֹ֛אול
  english_pob_choice: on the right and on the left
  chosen_korean: 오른쪽과 왼쪽의
  alternatives_korean:
  - 오른쪽과 왼쪽에 있는
  - 좌우의
  lexicon: HALOT
  rationale: 방향 대비를 유지해 포위된 적들을 모두 치는 의미를 분명히 하도록, 문맥상 자연스러운 ‘오른쪽과 왼쪽의’로 처리했습니다.
- source_word: וְיָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּירוּשָׁלִָֽם
  english_pob_choice: And Jerusalem will again dwell in her own place, in Jerusalem.
  chosen_korean: 예루살렘은 다시 자기 자리에, 곧 예루살렘 안에 거할 것입니다.
  alternatives_korean:
  - 예루살렘은 다시 자기 자리에서 거할 것입니다
  - 예루살렘은 다시 본래의 자리에서 거할 것입니다
  lexicon: HALOT
  rationale: ‘자기 아래/자기 자리’의 관용구를 한국어에서 자연스러운 ‘자기 자리’로 옮기되, 뒤의 ‘예루살렘 안에’ 반복을 살려 히브리어의 수사적 강조를 보존했습니다.
theological_decisions:
- issue: יְהוּדָה의 집단적 주체성
  chosen_reading: 유다의 개인 지도자들이 아니라 유다 공동체 전체의 전투적 주체로 읽었습니다.
  alternative_readings:
  - 유다의 지도자들
  - 유다의 우두머리들
  rationale: 문맥이 예루살렘과 유다의 집단적 승리를 그리므로, 약속의 주체를 엘리트 몇 명으로 좁히지 않고 공동체 전체로 이해하는 것이 더 적절합니다.
  doctrine_reference: 문맥적·서사적 해석
- issue: 도시의 의인화
  chosen_reading: 예루살렘이 ‘거할 것입니다’라는 표현으로 도시를 인격적으로 묘사했습니다.
  alternative_readings:
  - 예루살렘은 다시 거주될 것입니다
  - 예루살렘은 다시 사람이 살 것입니다
  rationale: 히브리어의 העיר-가 주어가 되는 예언체 표현을 살려, 수동화보다 능동적 의인화를 유지했습니다.
  doctrine_reference: 예언 문체
