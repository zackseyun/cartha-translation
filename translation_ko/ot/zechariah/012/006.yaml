  english_pob_choice: like a firepot among wood
  chosen_korean: 나무 가운데 있는 불그릇처럼
  alternatives_korean:
  - 나무 가운데 있는 화로처럼
  - 나무 가운데 있는 불항아리처럼
  lexicon: HALOT
  rationale: כִּיּוֹר의 그릇 이미지를 살리면서, 불이 담긴 용기라는 점을 자연스럽게 드러내는 ‘불그릇’을 택했습니다.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  english_pob_choice: and like a flaming torch among sheaves
  chosen_korean: 곡식단 가운데 있는 불붙은 횃불처럼
  alternatives_korean:
  - 곡식단 가운데 있는 불타는 횃불처럼
  - 짚단 가운데 있는 불붙은 횃불처럼
  lexicon: HALOT
  rationale: לַפִּיד אֵשׁ의 횃불 이미지를 직역에 가깝게 살리고, עָמִיר를 수확물 묶음의 뜻으로 보아 ‘곡식단’으로 옮겼습니다.
- source_word: וְאָכְלוּ
  english_pob_choice: they will consume
  chosen_korean: 삼킬 것입니다
  alternatives_korean:
  - 먹어 치울 것입니다
  - 집어삼킬 것입니다
  lexicon: HALOT
  rationale: 불이 사방을 태워 멸하는 비유를 살리기 위해, 파괴적 섭취의 은유를 드러내는 ‘삼키다’를 사용했습니다.
- source_word: עַל יָמִ֧ין וְעַל שְׂמֹ֛אול
  english_pob_choice: on the right and on the left
  chosen_korean: 오른쪽과 왼쪽의
  alternatives_korean:
  - 오른쪽과 왼쪽에 있는
  - 좌우의
  lexicon: HALOT
  rationale: 방향 대비를 유지해 포위된 적들을 모두 치는 의미를 분명히 하도록, 문맥상 자연스러운 ‘오른쪽과 왼쪽의’로 처리했습니다.
- source_word: וְיָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּירוּשָׁלִָֽם
  english_pob_choice: And Jerusalem will again dwell in her own place, in Jerusalem.
  chosen_korean: 예루살렘은 다시 자기 자리에, 곧 예루살렘 안에 거할 것입니다.
  alternatives_korean:
  - 예루살렘은 다시 자기 자리에서 거할 것입니다
