  text: בַּ/יּ֣וֹם הַ/ה֡וּא אָשִׂים֩ אֶת אַלֻּפֵ֨י יְהוּדָ֜ה כְּֽ/כִיּ֧וֹר אֵ֣שׁ בְּ/עֵצִ֗ים וּ/כְ/לַפִּ֥יד אֵשׁ֙ בְּ/עָמִ֔יר וְ/אָ֨כְל֜וּ עַל יָמִ֧ין וְ/עַל שְׂמֹ֛אול אֶת כָּל הָ/עַמִּ֖ים סָבִ֑יב וְ/יָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּ/ירוּשָׁלִָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the leaders of Judah' or 'the chiefs of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'under herself,' an idiom meaning 'in her own place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 유다의 씨족들[a]을 나무더미 가운데 있는 불화로처럼, 곡식단 가운데 있는 불붙은 횃불처럼 만들 것이니, 그들이 오른쪽과 왼쪽에서 자기들을 둘러싼 모든 민족을 삼킬 것입니다. 예루살렘은 다시 자기 자리[b], 곧 예루살렘에서 거할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 씨족장들’ 또는 ‘유다의 지도자들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘자기 아래’이며, ‘자기 자리에서’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣לֻּפֵי יְהוּדָ֜ה
  english_pob_choice: the clans of Judah
  chosen_korean: 유다의 종족들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 우두머리들
  lexicon: HALOT
  rationale: 알루프의 의미를 이 문맥에서 개인 지도자보다 집단적 단위로 읽은 POB의 판단을 따라, 군사적·공동체적 주체감을 살리는 ‘종족들’로 옮겼습니다.
