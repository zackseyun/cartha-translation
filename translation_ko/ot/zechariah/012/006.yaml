revisions:
- from: 그날에 내가 유다의 종족들을 나무 가운데 있는 불그릇처럼, 곡식단 가운데 있는 불붙은 횃불처럼 두리니, 그들이 오른쪽과 왼쪽의 모든 주변 민족들을 삼킬 것입니다. 예루살렘은 다시 자기 자리에, 곧 예루살렘 안에 거할 것입니다.[a][b]
  to: 그날에 내가 유다의 씨족들[a]을 나무더미 가운데 있는 불화로처럼, 곡식단 가운데 있는 불붙은 횃불처럼 만들 것이니, 그들이 오른쪽과 왼쪽에서 자기들을 둘러싼 모든 민족을 삼킬 것입니다. 예루살렘은 다시 자기 자리[b], 곧 예루살렘에서 거할 것입니다.
  rationale: 영어 POB의 집단적 선택을 따라 אַלֻּפֵי를 ‘유다의 씨족들’로 유지하면서, 가능한 지도자 의미를 각주에 보존했습니다. 불을 담은 용기의 비유는 자연스러운 한국어인 ‘불화로’로 명료화했고, 좌우 표현은 히브리어의 방향적 기능을 살렸습니다. 마지막의 ‘예루살렘’ 반복과 ‘자기 아래’ 관용구의 뜻은 모두 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:01Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 두 비유와 예루살렘의 의인화를 잘 보존합니다. 그러나 אַלֻּפֵי는 ‘씨족’과 ‘씨족장/지도자’ 사이에 어휘적 여지가 있으므로, 본문의 집단적 번역을 유지하더라도 대안을 각주로 밝혀야 합니다. 또한 עַל יָמִין וְעַל שְׂמֹאול은 ‘오른쪽과 왼쪽의 민족들’보다 그 방향들에서 둘러싼 민족들을 멸한다는 부사적 표현으로 옮기는 편이 가깝습니다.
  naturalness: ‘불그릇’은 현대 한국어에서 다소 불분명하므로 ‘불화로’가 불을 담은 그릇이 나무에 불을 붙이는 비유를 더 자연스럽고 선명하게 전달합니다. ‘예루살렘 안에 거하다’는 도시를 주어로 한 문장에서는 다소 어색하므로, 반복을 보존하는 ‘예루살렘에서 거할 것입니다’가 자연스럽습니다.
  terminology: ‘유다의 씨족들’은 영어 POB의 corporate reading을 따르되, ‘종족들’보다 고대 이스라엘의 친족·사회 단위를 더 정확히 나타냅니다. ‘불화로’, ‘곡식단’, ‘횃불’, ‘거하다’는 예언 문체와 현대 합쇼체에 적절합니다.
  issues:
  - severity: medium
    issue: אַלֻּפֵי의 대안 의미를 밝히는 각주가 없습니다.
    rationale: 이 말은 문맥상 ‘씨족들’로도, ‘씨족장들/지도자들’로도 이해될 수 있습니다. 집단적 번역을 본문에 채택하더라도 해석상의 여지를 각주로 보존해야 합니다.
  - severity: low
    issue: ‘불그릇’의 의미가 불명확합니다.
    rationale: 히브리어 כִּיּוֹר는 그릇·대야 계열의 말이지만, 여기서는 불을 담아 나무를 태우는 용기라는 비유입니다. ‘불화로’가 한국어에서 더 분명합니다.
  - severity: low
    issue: ‘오른쪽과 왼쪽의 모든 주변 민족들’은 방향구의 기능을 다소 부자연스럽게 처리합니다.
    rationale: עַל יָמִין וְעַל שְׂמֹאול은 소유·수식 관계보다 ‘오른쪽과 왼쪽에서’라는 방향적 범위를 나타냅니다.
  - severity: low
