source:
  edition: WLC
  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
  footnotes:
  - marker: a
    text: Or 'a cup of reeling.' The Hebrew expression may also be understood more literally as 'a basin/threshold of reeling,' but the sense of a vessel causing intoxicated staggering best fits the context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the second clause is difficult. It may also mean 'Judah also will be besieged along with Jerusalem' or 'this will also come upon Judah in the siege against Jerusalem.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 내가 예루살렘을 사방의 모든 백성에게 비틀거리는 잔이 되게 하려는 때가 옵니다[a]. 유다도 예루살렘에 대한 포위전 중에 함께 얽히게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘비틀거림의 대야/턱’처럼도 이해될 수 있으나, 문맥상 취하는 사람을 비틀거리게 하는 잔으로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 둘째 절은 난해하여, ‘유다도 예루살렘과 함께 포위된다’ 또는 ‘예루살렘이 포위될 때 유다에도 이 일이 닥친다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄을 현대 합쇼체 경고문으로 옮기되, 과도하게 고어적인 ‘보라’보다 직접적이고 자연스럽게 처리했습니다.
- source_word: סַף רַעַל
  english_pob_choice: a cup of staggering
  chosen_korean: 비틀거리는 잔
  alternatives_korean:
  - 비틀거림의 잔
  - 비틀거리는 술잔
  - 흔들리는 잔
  lexicon: HALOT
  rationale: 원문은 재앙을 일으키는 잔의 비유로 이해되므로, ‘잔’을 살리면서 결과 상태인 비틀거림을 드러내는 표현을 택했습니다.
- source_word: לְכָל הָעַמִּים סָבִיב
  english_pob_choice: to all the surrounding peoples
  chosen_korean: 사방의 모든 백성에게
  alternatives_korean:
  - 둘레의 모든 민족에게
  - 주변의 모든 민족들에게
  - 사방에 있는 모든 민족에게
  lexicon: HALOT
  rationale: עַמִּים의 집합적 의미를 ‘백성’으로 살리되, 둘레를 둘러싼 열방의 범위를 ‘사방의’로 자연스럽게 옮겼습니다.
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  english_pob_choice: in the siege against Jerusalem
  chosen_korean: 예루살렘에 대한 포위전
  alternatives_korean:
  - 예루살렘을 포위하는 전투
  - 예루살렘을 둘러싼 포위 상태
  - 예루살렘을 향한 포위 공격
  lexicon: HALOT
  rationale: מָצוֹר의 군사적 의미를 ‘포위전’으로 살려 사건의 성격을 드러냈고, עַל의 대상을 ‘예루살렘에 대한’으로 옮겨 적대적 방향성을 유지했습니다.
theological_decisions:
- issue: 둘째 절의 난해한 문장 구조(유다가 어떻게 ‘포위전’과 관련되는가)
  chosen_reading: 유다도 예루살렘에 대한 포위전 중에 함께 얽히게 될 것입니다.
  alternative_readings:
  - 유다도 예루살렘과 함께 포위될 것입니다.
  - 유다에도 예루살렘을 포위하는 일의 영향이 미칠 것입니다.
  - 유다도 예루살렘 포위 때 그 일에 휘말릴 것입니다.
  rationale: 히브리어의 압축된 구문이 주는 긴장을 풀어 버리지 않고, 유다가 예루살렘 포위와 부정적으로 연루된다는 점만 분명히 하면서 정확한 관계는 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
