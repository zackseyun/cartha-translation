  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄을 현대 합쇼체 경고문으로 옮기되, 과도하게 고어적인 ‘보라’보다 직접적이고 자연스럽게 처리했습니다.
- source_word: סַף רַעַל
  english_pob_choice: a cup of staggering
  chosen_korean: 비틀거리는 잔
  alternatives_korean:
