- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  english_pob_choice: in the siege against Jerusalem
  chosen_korean: 예루살렘에 대한 포위전
  alternatives_korean:
  - 예루살렘을 포위하는 전투
  - 예루살렘을 둘러싼 포위 상태
