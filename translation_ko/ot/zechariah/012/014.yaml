translation:
  language: ko
  text: 남아 있는 모든 가문이 가문마다 따로 애곡하고, 그들의 아내들도 따로 애곡할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남아 있는 모든 가문이 가문마다 따로 애곡하고, 그들의 여자들도 따로 애곡할 것입니다.’ 히브리어는 분배를 나타내기 위해 ‘가문들, 가문들’을 반복하고, ‘따로’라는 표현도 되풀이하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
