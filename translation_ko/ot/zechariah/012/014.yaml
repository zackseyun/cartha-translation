  rationale: מִשְׁפָּחָה는 여기서 개별 가정이 아니라 혈연·집단 단위를 가리키므로, 한국어에서는 '가문'이 분배적 반복과도 잘 맞습니다.
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  english_pob_choice: family by family
  chosen_korean: 가문마다 따로
  alternatives_korean:
  - 가문마다
  - 가문에서 가문으로
  lexicon: HALOT
  rationale: 히브리어의 반복은 분배적 강조이므로, '마다'와 '따로'를 함께 써서 각각 분리되어 있음을 살렸습니다.
- source_word: לְבָד
  english_pob_choice: by itself
  chosen_korean: 따로
  alternatives_korean:
  - 홀로
  - 각각
  lexicon: HALOT
  rationale: 반복되는 분리 표현을 한국어에서 과도하게 딱딱하지 않게 옮기면서도, 분리·독립의 강조를 유지합니다.
- source_word: וּנְשֵׁי/הֶם
  english_pob_choice: their wives
  chosen_korean: 그들의 아내들도
  alternatives_korean:
  - 그들의 여자들도
  - 그들의 부인들도
  lexicon: HALOT
  rationale: 문맥상 '아내들'이 가장 자연스럽고, 남성 집단과 여성 집단의 구분을 본문이 명시하므로 이를 보존했습니다.
theological_decisions:
- issue: 분배적 반복과 성별 구분을 어떻게 드러낼지
  chosen_reading: '''가문마다 따로, 그들의 아내들도 따로''로 두 번의 분리 표현과 성별 구분을 모두 유지했습니다.'
  alternative_readings:
  - '''각 가문이 따로, 여성들도 따로''로 일반화하기'
  - '''가문별로, 아내들도 별도로''로 완화하기'
  rationale: 본문은 반복을 통해 각 단위의 개별성을 강조하며, 여성 집단을 따로 언급합니다. 이를 평준화하면 히브리어의 강조와 구분이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
