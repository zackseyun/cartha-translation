  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 화자 표지를 한국어 합쇼체로 옮기되, 직접 인용 안의 신적 발화를 분명히 하도록 ‘말씀이십니다’를 사용했습니다.
- source_word: אַכֶּה
