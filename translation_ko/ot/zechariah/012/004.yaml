  lexicon: HALOT
  rationale: עַמִּים의 복수 집합을 ‘민족들’로 옮겨, 이스라엘 바깥의 여러 민족을 가리키는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 야훼를 어떻게 표기할 것인가
  chosen_reading: 예언서의 신명은 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 판본의 기본 원칙에 따라 신명은 학술적 표기인 ‘야훼’를 사용해 본문과 주석에서 일관되게 처리했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: ‘내 눈을 뜨고 있을’의 의미 범위
  chosen_reading: 단순한 시각 행위가 아니라 유다를 향한 주의 깊은 관심과 호의를 드러내는 관용구로 보았습니다.
  alternative_readings:
  - 직역적으로 ‘내 눈을 유다의 집 위에 열 것이며’
  - 해석적으로 ‘유다의 집을 지켜볼 것이며’
  rationale: 문맥상 심판 대상인 말들과 대조되어, 유다에 대한 보호적/호의적 주목을 뜻하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
