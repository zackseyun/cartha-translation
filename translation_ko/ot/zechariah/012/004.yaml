base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
  footnotes:
  - marker: a
    text: Or 'I will open my eyes upon the house of Judah'; the Hebrew idiom conveys attentive regard, likely with protective favor in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'every horse of the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에—야훼의 말씀이십니다—내가 모든 말을 공포로 치고, 그 위에 탄 자를 광기로 칠 것입니다. 그러나 유다의 집 위에는 내 눈을 뜨고 있을 것이며[a], 내가 모든 민족의 말을 눈멀게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다의 집 위에 내 눈을 열겠다’입니다. 이 히브리어 관용구는 여기서 주의 깊은 관심, 아마도 보호적 호의를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
