  alternatives_korean:
  - 때릴 것입니다
  - 내리칠 것입니다
  lexicon: HALOT
  rationale: נכה의 기본 의미를 살리면서 한국어에서 자연스러운 심판 행위 표현으로 옮겼습니다.
- source_word: בַּתִּמָּהוֹן
  english_pob_choice: with panic
  chosen_korean: 공포로
  alternatives_korean:
  - 당황으로
  - 혼란으로
  lexicon: HALOT
  rationale: 전장 문맥에서 말에게 임하는 두려움과 동요를 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: בַּשִּׁגָּעוֹן
  english_pob_choice: with madness
  chosen_korean: 광기로
  alternatives_korean:
  - 미친 상태로
  - 정신착란으로
  lexicon: HALOT
  rationale: אָ狂/광기의 강한 뜻을 유지하되 현대 한국어에서 직설적이고 자연스럽게 들리도록 했습니다.
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  english_pob_choice: But over the house of Judah I will keep my eyes open
  chosen_korean: 그러나 유다의 집 위에는 내 눈을 뜨고 있을 것이며
  alternatives_korean:
  - 그러나 유다의 집 위에는 눈을 열고 있을 것이며
  - 그러나 유다의 집을 지켜볼 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈을 뜨다/열다’를 유지해 주의 깊은 관심과 호의를 함께 보존했습니다. ‘그러나’는 앞 절의 심판과 대비되는 의미를 드러냅니다.
- source_word: כֹל סוּס הָעַמִּים
  english_pob_choice: every horse of the peoples
  chosen_korean: 모든 민족의 말
  alternatives_korean:
  - 모든 백성들의 말
  - 모든 나라들의 말
  lexicon: HALOT
  rationale: עַמִּים의 복수 집합을 ‘민족들’로 옮겨, 이스라엘 바깥의 여러 민족을 가리키는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 야훼를 어떻게 표기할 것인가
  chosen_reading: 예언서의 신명은 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 판본의 기본 원칙에 따라 신명은 학술적 표기인 ‘야훼’를 사용해 본문과 주석에서 일관되게 처리했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: ‘내 눈을 뜨고 있을’의 의미 범위
  chosen_reading: 단순한 시각 행위가 아니라 유다를 향한 주의 깊은 관심과 호의를 드러내는 관용구로 보았습니다.
  alternative_readings:
  - 직역적으로 ‘내 눈을 유다의 집 위에 열 것이며’
  - 해석적으로 ‘유다의 집을 지켜볼 것이며’
  rationale: 문맥상 심판 대상인 말들과 대조되어, 유다에 대한 보호적/호의적 주목을 뜻하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
