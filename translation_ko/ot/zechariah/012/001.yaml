  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
  footnotes:
  - marker: a
    text: 'Or ''An oracle: the word of the LORD against Israel.'' The preposition can mean ''concerning'' or, in some contexts, ''against.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the spirit of man'; or 'the human spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀에 대한 예언입니다[a]. 야훼의 선언입니다. 그분은 하늘을 펴시고, 땅의 기초를 놓으시며[b], 사람의 영을 그 속에 지으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 말씀, 이스라엘에 관한 예언입니다.’ 전치사 עַל은 ‘관하여’ 또는 문맥에 따라 ‘대하여/against’를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘땅을 기초 짓는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 예언
  alternatives_korean:
  - 신탁
  - 오라클
  lexicon: HALOT
  rationale: 예언문 서두의 중량감 있는 표제를 한국어에서 자연스럽게 살리되, 현대 독자가 오해할 수 있는 ‘짐’의 뜻은 피했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 지시된 예언 공식은 ‘말씀’으로 보존하는 것이 원문과 가장 가깝고, POB의 야훼 표기를 따라 신적 고유명을 살렸습니다.
- source_word: נֹטֶה שָׁמַיִם / וְיֹסֵד אָרֶץ
  english_pob_choice: who stretches out the heavens, lays the foundation of the earth
  chosen_korean: 하늘을 펴시고, 땅의 기초를 놓으시며
  alternatives_korean:
  - 하늘을 펼치시고, 땅을 세우시며
  - 하늘을 늘이시고, 땅을 세우시며
  lexicon: HALOT
  rationale: 창조 행위의 병렬을 한국어 동사 어간으로 간결하게 살렸고, ‘기초를 놓다’는 יסד의 건축적 비유를 보존합니다.
- source_word: וְיֹצֵר רוּחַ אָדָם בְּקִרְבּוֹ
  english_pob_choice: and forms the spirit of man within him
  chosen_korean: 사람의 영을 그 속에 지으십니다
  alternatives_korean:
  - 사람의 영을 그 안에서 지으십니다
  - 인간의 영을 그 속에 만드십니다
  lexicon: HALOT
  rationale: רוּחַ는 여기서 인간 내면의 영을 가리키므로 ‘영’으로 두었고, בְּקִרְבּוֹ는 자연스럽고 품위 있게 ‘그 속에’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 신적 창조자 정체성
  chosen_reading: 예언의 선언은 야훼를 하늘과 땅의 창조주일 뿐 아니라 사람의 영을 빚으시는 분으로 제시합니다.
  alternative_readings:
  - 단순한 서문으로 읽기
  - 창조 묘사를 시적 수사로만 약화하기
  rationale: 본문의 세 동사 연쇄는 예언의 권위를 창조주 야훼의 주권에 직접 연결하므로, 이를 약화하지 않고 직역에 가깝게 살려야 합니다.
  doctrine_reference: Zech 12:1 creation formula; POB theological note on preserving divine agency
