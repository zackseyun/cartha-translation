id: ZEC.12.5
reference: Zechariah 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמְר֛וּ אַלֻּפֵ֥י יְהוּדָ֖ה בְּ/לִבָּ֑/ם אַמְצָ֥ה לִ/י֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם בַּ/יהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
  footnotes:
  - marker: a
    text: Or, “the leaders of Judah” or “the chiefs of Judah.” The Hebrew אַלֻּפֵי can refer either to clan units or to their chiefs.
    reason: lexical_alternative
  - marker: b
    text: Or, “The inhabitants of Jerusalem are strength for me in the LORD of Armies, their God.” The preposition can be understood as expressing sphere (“in”) or means/ground (“through”).
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 유다의 가문들은 마음속으로 이렇게 말할 것입니다. ‘예루살렘 주민들이 그들의 하나님이신 만군의 야훼 안에서 내게 힘이 된다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “유다의 가문들”은 ‘유다의 지도자들’ 또는 ‘유다의 우두머리들’로도 옮길 수 있습니다. 히브리어 אַלֻּפֵי는 가문 단위와 그 우두머리 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “예루살렘 주민들이 그들의 하나님이신 만군의 야훼 안에서 내게 힘이 된다”는 ‘…을 통해 내게 힘이 된다’ 또는 ‘…을 근거로 내게 힘이 된다’로도 이해할 수 있습니다. 전치사는 영역, 근거, 또는 수단의 의미를 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: Then ... will say
  chosen_korean: 그러면 ... 말할 것입니다
  alternatives_korean:
  - 그리고 ... 말할 것입니다
  - 그때 ... 말할 것입니다
  lexicon: HALOT
  rationale: 예언 문맥의 순서를 드러내되, 한국어에서는 ‘그러면’이 자연스럽게 다음 진술을 이끌어 줍니다.
- source_word: אַלֻּפֵי יְהוּדָה
  english_pob_choice: the clans of Judah
  chosen_korean: 유다의 가문들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 우두머리들
  lexicon: HALOT
  rationale: 알루페이는 문맥상 개인 지도자보다 집단 단위를 가리킬 수 있으므로, 예루살렘과 대비되는 유다의 대표 집단을 살려 ‘가문들’로 옮겼습니다.
- source_word: בְּלִבָּם
  english_pob_choice: in their hearts
  chosen_korean: 자기 마음속으로
  alternatives_korean:
  - 마음속으로
  - 그들 마음에
  lexicon: HALOT
  rationale: 히브리어의 내적 발화를 한국어 관용에 맞게 살리면서, 복수 주어의 집단적 내면 독백을 자연스럽게 표현했습니다.
- source_word: אַמְצָה לִי
  english_pob_choice: my strength
  chosen_korean: 나의 힘이 되어 주는
  alternatives_korean:
  - 나의 힘인
  - 나를 위한 힘인
  lexicon: HALOT
  rationale: אָמְצָה는 압축적으로 ‘힘/강함’을 뜻하므로, 명사적 직역보다 관계를 풀어 한국어에서 의미가 분명하게 들리도록 했습니다.
- source_word: בַּיהוָה צְבָאוֹת
  english_pob_choice: in Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님께 있다
  alternatives_korean:
  - 야훼 만군의 하나님 안에 있다
  - 야훼 군대들의 하나님께 있다
  lexicon: HALOT
  rationale: 베트의 의미를 단순한 위치보다 근거·귀속의 뉘앙스로 살리되, 전승적 호칭 ‘만군의 하나님’을 유지하여 מקור의 신명 칭호를 드러냈습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their God
  chosen_korean: 그들의 하나님
  alternatives_korean:
  - 그들의 신
  - 그분들의 하나님
  lexicon: HALOT
  rationale: 소유격 구문을 직역해 예루살렘 주민들에게 속한 하나님이라는 관계를 분명히 했습니다.
theological_decisions:
- issue: יהוה(야훼)와 צְבָאוֹת(만군) 호칭 처리
  chosen_reading: 본문의 신명은 ‘야훼’로, צְבָאוֹת은 한국어 전승어인 ‘만군’으로 옮겼습니다.
  alternative_readings:
  - 여호와 만군의 하나님
  - 야훼 군대들의 하나님
  rationale: POB의 원칙대로 신명은 가려지지 않게 드러내고, צְבָאוֹת은 현대 한국어에서 의미가 통하는 전승 표현을 살리되 ‘hosts’류의 비투명성을 피했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH / Translation philosophy §6'
