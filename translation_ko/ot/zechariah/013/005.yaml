  source_fidelity: 마지막 절의 히브리어 הִקְנַנִי는 목적어 접미사 ‘나를’를 포함하므로, ‘땅이 ... 나의 소유가 되어 왔다’라는 영어 POB 본문이나 초안의 지속상 ‘저를 소유해 왔기’는 원문과 맞지 않습니다. אָדָם은 이 문장에서 주어이므로 ‘한 사람’으로 옮기는 것이 안전합니다. קנה의 획득·매입·소유 관련 의미의 폭은 각주로 보존해야 합니다.
  naturalness: ‘사람 하나’는 이 문맥에서 다소 구어적이고 부자연스럽습니다. ‘한 사람이’가 현대 표준어의 격식 있는 성경 문체에 적합합니다. ‘이는 … 때문입니다’는 인용문 안에서 설명 관계를 자연스럽게 연결합니다.
