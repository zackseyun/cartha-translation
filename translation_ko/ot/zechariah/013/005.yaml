  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
  footnotes:
  - marker: a
    text: Or 'bought me from my youth' or 'has had me since my youth.' The Hebrew verb can denote acquiring, buying, or possessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이렇게 말할 것입니다. “저는 예언자가 아닙니다. 저는 땅을 일하는 사람입니다. 이는 한 사람이 제가 어릴 때부터 저를 소유했습니다[a]라는 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘나를 획득하였다’, ‘나를 샀다’, 또는 ‘어릴 때부터 나를 자기 것으로 삼았다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  english_pob_choice: And he will say
  chosen_korean: 그가 말할 것입니다
  alternatives_korean:
  - 그가 말합니다
  - 그리고 그가 말할 것입니다
  lexicon: HALOT
  rationale: 예언적 문맥의 wə-qatal을 미래로 옮기면서도, 한국어에서는 “그리고”를 반복하지 않고 자연스러운 서술 흐름을 살렸습니다.
- source_word: נָבִיא
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언가
  lexicon: HALOT
  rationale: 본문은 스스로의 예언자 정체성을 부인하는 말이므로, 현대 한국어에서 직접적이고 중립적인 “예언자”가 적절합니다.
- source_word: אִישׁ עֹבֵד אֲדָמָה
  english_pob_choice: a man who works the ground
  chosen_korean: 땅을 일하는 사람
  alternatives_korean:
  - 땅을 경작하는 사람
  - 땅을 가는 사람
  - 농사짓는 사람
  lexicon: HALOT
  rationale: אִישׁ의 “사람/남자”와 עֹבֵד אֲדָמָה의 노동적 의미를 함께 살리면서, 현대 한국어에서 자연스럽고 농업적 뉘앙스를 유지했습니다.
- source_word: הִקְנַנִי
  english_pob_choice: acquired me
  chosen_korean: 저를 소유해 왔기 때문입니다
  alternatives_korean:
  - 저를 사 왔기 때문입니다
  - 저를 얻었기 때문입니다
  - 저를 취득해 왔기 때문입니다
  lexicon: HALOT
  rationale: 동사 קנה의 ‘획득/구입/소유’ 범위를 넓게 보되, 영어 POB의 해석처럼 현재까지의 지속 상태를 드러내기 위해 “소유해 왔습니다”로 옮겼습니다.
- source_word: מִנְּעוּרָי
  english_pob_choice: from my youth
  chosen_korean: 어려서부터
  alternatives_korean:
  - 젊었을 때부터
  - 소년기부터
  - 어릴 때부터
  lexicon: HALOT
  rationale: 시간 출발점을 간결하게 드러내는 표준 한국어 표현으로, 히브리어의 초기 시점 강조를 보존합니다.
theological_decisions:
- issue: 문장의 화자 자처와 הִקְנַנִי의 정확한 사회적 관계
  chosen_reading: ‘소유해 왔기 때문입니다’라고 넓게 옮겨, 고용·소유·매입의 세부 관계를 특정하지 않았습니다.
  alternative_readings:
  - ‘사 왔기 때문입니다’로 더 구체화
  - ‘저를 길러 왔기 때문입니다’로 완화
  - ‘저를 노예로 삼아 왔기 때문입니다’로 구체화
  rationale: 본문은 예언자 부정과 출신/소속의 설명을 제공할 뿐, 관계의 정확한 법적 성격을 확정하지 않습니다. 그래서 어휘적 긴장을 보존하는 방향이 가장 소스 충실적입니다.
  doctrine_reference: 원문 의미의 긴장 보존; 불확정성을 과잉 해석하지 않음
