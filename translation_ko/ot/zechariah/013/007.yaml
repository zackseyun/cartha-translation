  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
  footnotes:
  - marker: a
    text: Or 'against the man who is my associate,' or possibly 'against the man who is my equal.' The Hebrew term denotes one closely associated with another.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will turn my hand upon/toward the little ones.' The idiom may imply action against them, or more generally renewed dealing with them.
    reason: alternative_reading
translation:
  language: ko
  text: 칼아, 내 목자에게, 내 동료인 사람에게 맞서 일어나십시오 — 만군의 야훼의 말씀입니다. 목자를 치면 양들이 흩어질 것이며, 나는 작은 이들^c^에게 내 손을 돌리겠습니다.^b^[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘만군의 주님’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 내 손을 작은 이들에게 돌리겠습니다.’ 이 관용구는 그들에게 불리한 행동을 뜻할 수도 있고, 더 일반적으로는 다시 그들을 다루시는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  english_pob_choice: Awake, O sword
  chosen_korean: 칼아, … 일어나십시오
  alternatives_korean:
  - 칼이여, 깨어나십시오
  - 칼아, 깨어 일어나십시오
  lexicon: HALOT
  rationale: 히브리어의 칼에 대한 직접 호명과 명령을 살리되, 현대 한국어에서는 ‘일어나십시오’가 공격 개시의 명령으로 자연스럽고 합쇼체에 맞습니다.
- source_word: רֹעִי
  english_pob_choice: my shepherd
  chosen_korean: 내 목자
  alternatives_korean:
  - 나의 목자
  - 내 양치기
  lexicon: HALOT
  rationale: 목자의 이미지를 직역에 가깝게 유지하여 본문의 상징과 소유 관계를 분명히 드러냅니다.
- source_word: גֶּבֶר עֲמִיתִי
  english_pob_choice: the man who is my companion
  chosen_korean: 내 동료인 사람
  alternatives_korean:
  - 나의 동료인 사람
  - 내 가까운 사람
  - 내 동무인 사람
  lexicon: HALOT
  rationale: עֲמִיתִי의 관계적 의미를 ‘동료’로 살리고, גֶּבֶר는 단순히 ‘사람’으로 옮겨 과도한 해석인 ‘강한 사람/용사’를 피했습니다.
- source_word: צְבָאוֹת
  english_pob_choice: of Armies
  chosen_korean: 만군의
  alternatives_korean:
  - 군대들의
  - 만상의
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이면서도 원문의 군대/군세 이미지를 반영하는 표현으로 보존했습니다.
- source_word: הַךְ אֶת הָרֹעֶה
  english_pob_choice: Strike the shepherd
  chosen_korean: 목자를 치면
  alternatives_korean:
  - 목자를 치십시오
  - 목자를 치소서
  lexicon: HALOT
  rationale: 예언적 진술 안에서 명령형을 한국어 조건·결과 구조로 자연스럽게 풀어, 뒤따르는 산개 결과와의 인과를 분명히 했습니다.
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  english_pob_choice: and the sheep will be scattered
  chosen_korean: 양들이 흩어질 것이며
  alternatives_korean:
  - 양 떼가 흩어질 것이며
  - 양들이 흩어집니다
  lexicon: HALOT
  rationale: 집합명사적 의미를 담되 현대 한국어에서는 ‘양들이’가 더 직접적이고 자연스럽습니다.
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  english_pob_choice: I will turn my hand against
  chosen_korean: 나는 … 내 손을 돌리겠습니다
  alternatives_korean:
  - 나는 … 내 손을 그들에게 돌리겠습니다
  - 나는 … 내 손을 치켜들겠습니다
  lexicon: HALOT
  rationale: ידי를 ‘손’으로 옮기고, 관용구의 방향성을 살리면서도 본문의 모호성을 훼손하지 않도록 ‘돌리겠습니다’로 처리했습니다.
theological_decisions:
- issue: יְהוָה צְבָאוֹת의 한국어 표기
  chosen_reading: ‘만군의 야훼’로 옮겨, 고유신명과 칭호를 함께 드러냈습니다.
  alternative_readings:
  - ‘만군의 주님’
  - ‘여호와 만군의 하나님’
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 ‘야훼’로, צְבָאוֹת는 ‘만군의’로 직역해 원문 결합을 투명하게 보존합니다.
  doctrine_reference: YHWH transliteration policy
- issue: וַהֲשִׁבֹתִי יָדִי עַל הַצֹּעֲרִים의 방향성
  chosen_reading: 본문 흐름상 심판적 의미를 우선해 ‘내 손을 돌리겠습니다’로 두되, 한국어 본문에서는 단정적 ‘against’를 삽입하지 않았습니다.
  alternative_readings:
  - ‘내 손을 그 작은 이들에게 돌리겠습니다’
  - ‘내 손을 작은 이들 위에 돌리겠습니다’
  rationale: 히브리어 관용구는 문맥상 불리한 조치를 시사하지만, 정확히 어느 정도의 직접성을 갖는지는 남겨 두는 것이 원문과 POB 주석 전통에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
