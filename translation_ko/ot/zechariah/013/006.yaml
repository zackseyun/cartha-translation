source:
  edition: WLC
  text: וְ/אָמַ֣ר אֵלָ֔י/ו מָ֧ה הַ/מַּכּ֛וֹת הָ/אֵ֖לֶּה בֵּ֣ין יָדֶ֑י/ךָ וְ/אָמַ֕ר אֲשֶׁ֥ר הֻכֵּ֖יתִי בֵּ֥ית מְאַהֲבָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''between your hands,'' likely referring idiomatically to the chest or torso area (''between your arms'').'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the house of my lovers'; the Hebrew may refer to close companions, loved ones, or intimate associates.
    reason: lexical_alternative
  - marker: c
    text: Some Christian interpreters understand these wounds messianically, in connection with the suffering of the Messiah; the verse itself does not state this explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 그에게 “네 두 손 사이에 있는 이 상처들은 무엇입니까?” 하고 묻는다면, 그는 “이것들은 내가 나를 사랑하는 이들의 집에서 맞아 입은 상처들입니다” 하고 말할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘네 손 사이에’입니다. 이 표현은 관용적으로 가슴이나 몸통 부위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘나를 사랑하는 이들’ 또는 ‘나의 연인들’로 옮길 수 있으며, 친밀한 동료나 가까운 이들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 기독교 해석은 이 상처들을 메시아의 고난과 연결해 읽지만, 본문은 이를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו מָה הַמַּכּוֹת הָאֵלֶּה
  english_pob_choice: And if one says to him, “What are these wounds?”
  chosen_korean: 누가 그에게 묻기를 “어찌하여 네 손들 사이에 이런 상처들이 있느냐?”
  alternatives_korean:
  - 그리고 그에게 말하기를 “이것들은 무슨 상처들이냐?”
  - 누가 그에게 말하기를 “네 손 사이의 이 상처들은 무엇이냐?”
  lexicon: HALOT
  rationale: 질문 대목은 예언적 대화의 조건절로 자연스럽게 풀어야 하며, מָה를 단순한 정보 질문이 아니라 상처의 원인을 묻는 말투로 옮기면 한국어에서 더 자연스럽습니다. הַמַּכּוֹת는 결과로 드러난 ‘상처들’로 옮겼습니다.
- source_word: בֵּין יָדֶיךָ
  english_pob_choice: between your hands
  chosen_korean: 네 손들 사이에
  alternatives_korean:
  - 네 손 사이에
  - 네 팔 사이에
  - 네 가슴에
  lexicon: HALOT
  rationale: 히브리어 표현을 가능한 한 직접 살려 ‘네 손들 사이에’로 옮겨 원문의 모호성과 직역성을 유지했습니다. 신체 부위를 해석적으로 좁히는 대신, 본문이 지닌 표현상의 긴장을 보존합니다.
- source_word: הֻכֵּיתִי
  english_pob_choice: I was wounded
  chosen_korean: 내가 맞은 것들입니다
  alternatives_korean:
  - 내가 상처 입은 것들입니다
  - 내가 맞아서 생긴 것들입니다
  - 내가 맞았습니다
  lexicon: HALOT
  rationale: הֻכֵּיתִי의 수동적 의미를 살리되, 앞의 ‘상처들’과 호응하도록 결과 상태를 드러내는 표현으로 옮겼습니다. ‘맞다’는 폭행/타격의 원인과 상처의 결과를 함께 담습니다.
- source_word: בֵּית מְאַהֲבָי
  english_pob_choice: in the house of those who love me
  chosen_korean: 내가 사랑하는 이들의 집에서
  alternatives_korean:
  - 나를 사랑하는 이들의 집에서
  - 내 연인들의 집에서
  - 내 친구들의 집에서
  lexicon: HALOT
  rationale: מְאַהֲבָי의 관계적 의미를 살리면서 현대 한국어에서 ‘내 연인들’이 지나치게 성적 뉘앙스를 띨 수 있어 피했습니다. ‘내가 사랑하는 이들’은 원문의 친밀한 관계성을 비교적 중립적으로 보존합니다.
theological_decisions:
- issue: 이 구절을 메시아의 상처로 직접 규정할지 여부
  chosen_reading: 본문은 메시아적 해석을 본문 안에서 명시하지 않으므로, 한국어 본문도 그 모호성을 그대로 둡니다.
  alternative_readings:
  - 수난받는 메시아에 대한 그리스도론적 읽기
  - 의식적이거나 징계적인 상처를 설명하는 비메시아적 읽기
  rationale: 영어 POB의 감사 흔적처럼, 본문 자체는 상처의 정체를 설명하는 대화만 제시하며 메시아나 십자가를 직접 말하지 않습니다. 따라서 번역문에서 신학적 결론을 앞서 제시하지 않고, 독자가 본문과 정경적 연결을 별도로 검토하도록 남겨 둡니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
