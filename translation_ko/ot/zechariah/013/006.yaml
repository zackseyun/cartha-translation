revisions:
- from: 누가 그에게 묻기를 “어찌하여 네 손들 사이에 이런 상처들이 있느냐?” 하면, 그는 “내가 사랑하는 이들의 집에서 내가 맞은 것들입니다” 하고 말할 것입니다.[a][b][c]
  to: 누가 그에게 “네 두 손 사이에 있는 이 상처들은 무엇입니까?” 하고 묻는다면, 그는 “이것들은 내가 나를 사랑하는 이들의 집에서 맞아 입은 상처들입니다” 하고 말할 것입니다.[a][b][c]
  rationale: 질문의 의문사(מָה)를 ‘무엇’으로 바로잡고, מְאַהֲבָי의 관계 방향을 ‘나를 사랑하는 이들’로 수정했습니다. 또한 수동 동사 הֻכֵּיתִי와 앞선 ‘상처들’의 관계를 자연스러운 한국어로 명확히 했습니다. 본문은 메시아적 동일시를 추가하지 않으며, 논쟁 가능한 신체 부위 관용과 해석 전통은 각주에 남겼습니다.
