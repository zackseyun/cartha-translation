source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
  footnotes:
  - marker: a
    text: Or 'a mantle of hair'—a rough garment associated with prophetic appearance.
    reason: lexical_alternative
  - marker: b
    text: Or 'in order to lie.' The Hebrew verb can denote falsehood or deception; here it refers to adopting prophetic dress to mislead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 예언자들은 예언할 때에 각자 자기의 환상 때문에 부끄러워할 것이며, 사람을 속이기 위해 털옷[a]을 입지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘털로 된 망토’입니다. 거친 털옷은 예언자적 외형과 연관된 옷차림을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거짓을 말하기 위해’입니다. 히브리어 동사는 거짓말이나 기만을 뜻할 수 있으며, 여기서는 예언자 복장을 취해 사람을 속이는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: will ... be ashamed
  chosen_korean: 부끄러워할 것입니다
  alternatives_korean:
  - 수치를 당할 것입니다
  - 창피를 당할 것입니다
  lexicon: HALOT
  rationale: 예언자들이 자신들의 환상 때문에 드러나는 수치를 표현하므로, 내면적 감정과 외적 망신을 모두 포괄할 수 있는 ‘부끄러워하다’가 자연스럽습니다.
- source_word: מֵחֶזְיֹנוֹ
  english_pob_choice: of his vision
  chosen_korean: 자기의 환상 때문에
  alternatives_korean:
  - 자기의 환상으로 인해
  - 자기의 이상 때문에
  lexicon: HALOT
  rationale: 문맥상 예언자가 주장했던 계시 내용이 수치의 원인이므로, 한국어에서는 원인/대상 관계를 분명히 하는 ‘~때문에’가 가장 분명합니다.
- source_word: אַדֶּרֶת שֵׂעָר
  english_pob_choice: a hairy cloak
  chosen_korean: 털옷
  alternatives_korean:
  - 털 망토
  - 털로 된 외투
  - 거친 털옷
  lexicon: HALOT
  rationale: 직역하면 ‘털옷’이 본문의 구체적 이미지를 간명하게 살리며, 예언자적 외형을 가장 직접적으로 전달합니다.
- source_word: לְמַעַן כַּחֵשׁ
  english_pob_choice: in order to deceive
  chosen_korean: 속이기 위해
  alternatives_korean:
  - 거짓말하기 위해
  - 기만하기 위해
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘거짓말’보다, 예언자 복장을 의도적으로 취해 남을 현혹하는 뜻이므로 ‘속이다’가 문맥에 더 맞습니다.
theological_decisions:
- issue: 이 절의 예언자들을 한국어 본문에서 ‘거짓 예언자들’로 명시할지 여부
  chosen_reading: 본문에는 ‘예언자들’만 두고, 문맥이 드러내는 수치를 그대로 살렸습니다.
  alternative_readings:
  - 거짓 예언자들
  - 가짜 예언자들
  rationale: 히브리어 본문 자체는 단지 ‘예언자들’이라고 말하므로, 문맥상 거짓 예언이 드러나는 상황이라도 본문에 없는 평가를 덧붙이지 않았습니다.
  doctrine_reference: 본문이 허용하는 의미를 넘어서지 않으며, 문맥은 독자가 판단하도록 남겨 둡니다.
