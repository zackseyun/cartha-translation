source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
  footnotes:
  - marker: a
    text: Or 'spring' or 'source' for 'fountain.'
    reason: lexical_alternative
  - marker: b
    text: '''Sin'' may also be understood by some as ''sin-offering,'' though the context of cleansing favors ''sin'' here.'
    reason: lexical_alternative
  - marker: c
    text: Or 'uncleanness'; the Hebrew term can refer specifically to menstrual impurity or more broadly to ritual impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 다윗의 집과 예루살렘 주민을 위해 죄와 부정함을 씻어 내는 샘이 열릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘샘’은 히브리어 מָקוֹר의 의미를 살린 번역이며, ‘샘물’이나 ‘근원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죄’는 여기서 ‘속죄제’로 이해하는 견해도 있으나, 정결의 문맥은 ‘죄’라는 뜻을 더 잘 뒷받침합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘부정함’은 히브리어 נִדָּה가 가리킬 수 있는 의례적 부정의 넓은 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그 날
  lexicon: HALOT
  rationale: 예언적 시점을 가리키는 관용구로, 현대 한국어에서 자연스럽고 간결하게 전해 줍니다.
- source_word: מָקוֹר נִפְתָּח
  english_pob_choice: a fountain will be opened
  chosen_korean: 샘이 열릴 것입니다
  alternatives_korean:
  - 우물이 열릴 것입니다
  - 근원이 열릴 것입니다
  lexicon: HALOT
  rationale: מָקוֹר는 물의 샘/근원/샘물의 이미지가 있으며, 문맥상 정결을 위한 물의 근원이라는 뜻이 살아나는 ‘샘’이 가장 적절합니다. נִפְתָּח의 수동 의미는 ‘열리다’로 자연스럽게 반영했습니다.
- source_word: לְבֵית דָּוִיד וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  english_pob_choice: for the house of David and for the inhabitants of Jerusalem
  chosen_korean: 다윗의 집과 예루살렘 주민을 위해
  alternatives_korean:
  - 다윗의 집과 예루살렘에 사는 사람들을 위해
  - 다윗의 집과 예루살렘 거민들을 위해
  lexicon: HALOT
  rationale: לְ는 수혜/대상 표시이므로 ‘~을/를 위해’로 옮겼습니다. יֹשְׁבֵי는 단순한 거주자 집합을 가리켜 ‘주민’이 자연스럽습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for sin
  chosen_korean: 죄와
  alternatives_korean:
  - 죄를 위한
  - 속죄제를 위한
  lexicon: HALOT
  rationale: חַטָּאת는 ‘죄’와 ‘속죄제’가 가능하지만, 본문은 정결의 샘이라는 이미지와 함께 죄의 제거를 말하므로 본문에는 ‘죄’로 두고 제의적 해석은 열어 두었습니다.
- source_word: וּלְנִדָּה
  english_pob_choice: for impurity
  chosen_korean: 부정함을 위한
  alternatives_korean:
  - 부정을 위한
  - 정결하지 못함을 위한
  - 불결함을 위한
  lexicon: HALOT
  rationale: נִדָּה는 월경 부정, 더 넓게는 의례적 부정을 가리킬 수 있어, 본문에서 과도하게 좁히지 않는 ‘부정함’이 적절합니다.
theological_decisions:
- issue: לְחַטָּאת의 의미 범위
  chosen_reading: 본문에는 ‘죄’로 번역하되, 속죄제라는 제의적 의미를 본문에 확정적으로 넣지 않았습니다.
  alternative_readings:
  - 속죄제를 위한
  - 죄를 씻는
  rationale: 샘과 정결의 병치는 죄 제거를 강하게 시사하지만, 히브리어 단어 자체가 제물 의미도 가지므로 해석을 한쪽으로 과도하게 좁히지 않았습니다.
  doctrine_reference: 본문의 정결 이미지와 어휘의 다의성을 함께 보존
