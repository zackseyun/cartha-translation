revisions:
- from: 내가 그 셋째를 불 가운데로 데리고 들어가겠습니다[a]. 내가 은을 제련하듯 그들을 제련하고, 금을 시험하듯 그들을 시험하겠습니다. 그는 내 이름을 부를 것이고, 나는 그에게 응답할 것입니다. 내가 말하기를 “그는 내 백성이다” 하겠고, 그는 말하기를 “야훼는 나의 하나님이십니다” 하겠습니다.
  to: 내가 그 셋째 몫을 불을 지나가게 하겠습니다. 내가 은을 제련하듯이 그들을 제련하고, 금을 시험하듯이 그들을 시험하겠습니다. 그는 내 이름을 부를 것이고, 나는 그에게 응답할 것입니다. 내가 말하겠습니다. “그는 내 백성입니다[a].” 그리고 그는 말할 것입니다. “야훼는 나의 하나님이십니다.”
  rationale: ‘셋째 몫’으로 앞 절과의 부분적 연결을 분명히 하고, 불의 은유를 ‘불을 지나가게 하겠습니다’로 옮겨 연단의 통과 의미를 살렸습니다. 또한 현대 합쇼체에 맞게 인용 구조를 정리했습니다. 마지막 두 절의 단수형은 원문의 집합적 대표성을 보존하여 유지했으며, 관련 각주도 해당 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
