base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
  footnotes:
  - marker: a
    text: Or, more smoothly in English, 'They are my people,' since the singular pronouns here represent the remnant collectively.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그 셋째를 불 가운데로 데리고 들어가겠습니다[a]. 내가 은을 제련하듯 그들을 제련하고, 금을 시험하듯 그들을 시험하겠습니다. 그는 내 이름을 부를 것이고, 나는 그에게 응답할 것입니다. 내가 말하기를 “그는 내 백성이다” 하겠고, 그는 말하기를 “야훼는 나의 하나님이십니다” 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘셋째 몫을 불 가운데로’라고 옮길 수 있으나, 여기서는 원문의 부분적·대표적 의미를 살리기 위해 직역에 가깝게 두었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶת הַשְּׁלִשִׁית
  english_pob_choice: I will bring the third part
  chosen_korean: 내가 그 셋째를 불 가운데로 데리고 들어가겠습니다
  alternatives_korean:
  - 내가 그 셋째 부분을 불 가운데로 데리고 들어가겠습니다
  - 내가 그 셋째를 불 가운데로 이끌겠습니다
  lexicon: HALOT
  rationale: הַשְּׁלִשִׁית는 앞문맥의 살아남은 ‘셋째 몫’을 가리키므로 ‘셋째’로 간결하게 살리고, 동사 הֵבֵאתִי의 이동·통과 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: בָּאֵשׁ
  english_pob_choice: through the fire
  chosen_korean: 불 가운데로
  alternatives_korean:
  - 불 속으로
  - 불을 지나
  lexicon: HALOT
  rationale: 정화의 시험을 가리키는 은유이므로 단순한 위치보다 심판과 연단의 장면을 드러내는 ‘불 가운데로’가 적절합니다.
- source_word: וּצְרַפְתִּים כִּצְרֹף אֶת הַכֶּסֶף
  english_pob_choice: I will refine them as silver is refined
  chosen_korean: 은을 제련하듯 그들을 제련하고
  alternatives_korean:
  - 은이 제련되듯 그들을 정련하고
  - 은을 불로 정제하듯 그들을 정제하고
  lexicon: HALOT
  rationale: צָרַף는 금속을 제련·정련하는 뜻이므로 ‘제련하다’를 택해 은의 비유를 직접 살렸습니다.
- source_word: וּבְחַנְתִּי/ם כִּבְחֹן אֶת הַזָּהָב
  english_pob_choice: and test them as gold is tested
  chosen_korean: 금을 시험하듯 그들을 시험하겠습니다
  alternatives_korean:
  - 금을 검증하듯 그들을 검증하겠습니다
  - 금을 가늠하듯 그들을 가늠하겠습니다
  lexicon: HALOT
  rationale: בָּחַן은 진짜 여부를 가리는 시험/검증의 뜻이므로 ‘시험하다’가 가장 مستقیم하고 금의 정련 비유와 평행을 이룹니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 원문 고유명사 יְהוָה를 가리키므로 표준 학술 음역인 ‘야훼’를 유지해 이름의 성격을 보존했습니다.
theological_decisions:
- issue: 셋째를 가리키는 단수 대명사와 집합적 백성의 긴장
  chosen_reading: ‘그는 내 백성이다’라는 단수형을 유지했습니다.
  alternative_readings:
  - ‘그들은 내 백성이다’로 풀어 쓰기
  - ‘이들은 내 백성이다’로 집합화하기
  rationale: 히브리어는 남은 자 전체를 대표하는 단수 표현을 유지하므로, 이를 평탄화하지 않고 원문의 대표성 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3; §4
