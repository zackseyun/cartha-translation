id: ZEC.13.2
reference: Zechariah 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
  footnotes:
  - marker: a
    text: Or 'the spirit of uncleanness.'
    reason: lexical_alternative
  - marker: b
    text: '''The prophets'' here refers contextually to illegitimate prophets associated with idolatry and uncleanness.'
    reason: cultural_note
translation:
  language: ko
  text: 그 날에 이런 일이 있을 것입니다. 만군의 야훼의 말씀입니다. 내가 그 땅에서 우상들의 이름을 끊어 버리겠고, 그것들은 다시는 기억되지 않을 것입니다. 또한 내가 그 땅에서 예언자들[b]과 부정한 영[a]을 제거하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정의 영’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예언자들’은 문맥상 우상숭배와 부정에 연루된 불법적 예언자들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼의 말씀입니다
  alternatives_korean:
  - 만군의 여호와의 말씀입니다
  - 만군의 주님의 말씀입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언문에서 공식적인 선언문구이므로 ‘말씀입니다’로 옮기고, יְהוָה צְבָאוֹת은 프로젝트 기본값에 따라 ‘야훼’와 ‘만군의’로 처리했습니다.
- source_word: שְׁמוֹת הָעֲצַבִּים
  english_pob_choice: the names of the idols
  chosen_korean: 우상의 이름들
  alternatives_korean:
  - 우상들의 이름들
  - 우상들의 명칭
  lexicon: HALOT
  rationale: 히브리어는 단순히 우상 자체가 아니라 ‘이름들’을 말하므로, 기억과 존재의 흔적까지 지워지는 뜻을 살려 ‘우상의 이름들’로 옮겼습니다.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  english_pob_choice: and they shall be remembered no more
  chosen_korean: 다시는 기억되지 않을 것입니다
  alternatives_korean:
  - 더 이상 기억되지 않을 것입니다
  - 기억되지는 않을 것입니다
  lexicon: HALOT
  rationale: 수동적·비인칭적 뉘앙스를 살리되 현대 한국어로 자연스럽게 표현하기 위해 ‘기억되지 않을 것입니다’로 옮겼습니다.
- source_word: הַנְּבִיאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 거짓 예언자들
  lexicon: HALOT
  rationale: 히브리어에는 ‘거짓’이 없으므로 본문대로 ‘예언자들’로 두되, 문맥상 불법적 예언자라는 의미는 독자가 읽도록 남겨 두었습니다.
- source_word: רוּחַ הַטֻּמְאָה
  english_pob_choice: the unclean spirit
  chosen_korean: 부정한 영
  alternatives_korean:
  - 부정의 영
  - 더러운 영
  - 부정한 영기
  lexicon: HALOT
  rationale: 직역에 가까운 ‘부정한 영’이 히브리어의 부정/불결 개념과 영적 실재를 함께 살리며, 지나치게 설명적인 ‘부정의 영’보다 간결합니다.
theological_decisions:
- issue: ‘the prophets’를 본문 밖에서 ‘거짓 예언자들’로 명시할지 여부
  chosen_reading: 본문의 표현을 따라 ‘예언자들’로 두고, 문맥이 그들을 부정한 예언 행위와 연결합니다.
  alternative_readings:
  - 거짓 예언자들
  rationale: 히브리어 본문에 없는 형용사를 덧붙이지 않으면서도, 우상숭배와 부정의 문맥이 그 정체를 드러내도록 했습니다.
  doctrine_reference: '원문 우선 원칙: 본문이 말하는 만큼만 말하고, 해석은 문맥이 담당하게 합니다.'
- issue: ‘רוּחַ הַטֻּמְאָה’를 인격적 영으로 볼지 비인격적 부정성으로 볼지
  chosen_reading: ‘부정한 영’으로 옮겨 영적 실재의 가능성을 열어 두었습니다.
  alternative_readings:
  - 부정의 영
  - 더러운 영
  rationale: 히브리어는 ‘불결/부정’의 성격을 지닌 영을 가리킬 수 있으며, 예언문 맥락에서 영적 차원을 과도하게 축소하지 않도록 했습니다.
  doctrine_reference: 'optimal-equivalence: 본문이 허용하는 신학적 긴장을 보존합니다.'
