  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: ko
  text: 온 땅에 이런 일이 있을 것입니다 — 야훼의 말씀입니다 — 그곳에서 두 부분은 끊어져 죽고, 한 부분은 그곳에 남게 될 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: בְ/כָל הָ/אָ֨רֶץ
  english_pob_choice: in all the land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 그 모든 땅에
  - 온 הארץ에
  lexicon: אָרֶץ
  rationale: 문맥상 심판이 미치는 범위를 자연스럽게 드러내는 표준어 표현으로 옮겼습니다.
- source_word: נְאֻם יְהוָ֔ה
  english_pob_choice: declares the LORD
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주님의 말씀입니다
  lexicon: נְאֻם + יהוה
  rationale: 예언문 공식어를 직접적으로 살려, 발화 주체가 야훼임을 분명히 드러냈습니다.
- source_word: פִּֽי שְׁנַ֣יִם
  english_pob_choice: two-thirds
  chosen_korean: 두 부분은
  alternatives_korean:
  - 두 몫은
  - 삼분의 이는
  lexicon: שְׁנַיִם / 분수 표현
  rationale: 히브리어의 분수적 관용을 한국어에서 자연스럽게 풀어, 전체 중 대다수의 심판이라는 뜻을 유지했습니다.
- source_word: יִכָּרְת֖וּ יִגְוָ֑עוּ
  english_pob_choice: will be cut off and die
  chosen_korean: 끊어져 죽고
  alternatives_korean:
  - 끊어져 사라지고
  - 끊어져 멸망하고
  lexicon: כרת + גוע
  rationale: 두 동사를 병렬로 살리되, 첫 동사의 제거/절단 이미지를 유지하고 둘째 동사는 실제 죽음을 분명히 했습니다.
theological_decisions:
- issue: 야훼 이름 표기와 예언 공식어
  chosen_reading: 본문의 יְהוָה는 '야훼'로 옮기고, 뒤의 נְאֻם은 예언적 선언 공식으로 처리했습니다.
  alternative_readings:
  - 주님으로 완화
  - 말씀하신다로 단순화
  rationale: 본문의 직접적 신명 표기를 가리고 일반 호칭으로 바꾸면 מקור의 예언적 긴장과 출처가 약해지므로, 프로젝트 기본값을 따랐습니다.
  doctrine_reference: 출 3:15; 사 1:2와 같은 예언서 공식어
