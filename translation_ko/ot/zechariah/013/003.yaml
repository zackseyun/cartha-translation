source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
  footnotes:
  - marker: a
    text: Or 'when a man again prophesies.' The Hebrew עוֹד can indicate continued or renewed action.
    reason: lexical_alternative
  - marker: b
    text: Or 'will stab him' or 'will thrust him through.' The Hebrew verb denotes piercing with a weapon.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 다시 예언하면, 그의 아버지와 어머니 곧 그를 낳은 그의 부모가 그에게 말하기를 “네가 살아 있을 수 없다. 네가 야훼의 이름으로 거짓을 말하였기 때문이다”라고 할 것이며, 그의 아버지와 어머니 곧 그를 낳은 그의 부모가 그가 예언할 때 그를 찌를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 다시 예언할 때’. 히브리어 עוֹד는 계속 또는 재개를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 찌를 것입니다’ 혹은 ‘그를 꿰뚫을 것입니다’. 히브리어 동사는 무기로 찌르는 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And it will happen that if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 그 일이 일어날 것입니다
  - 그때 만일
  lexicon: WLC + POB audit trail
  rationale: 예언적 문맥의 미래 상황을 한국어 조건문으로 자연스럽게 옮기되, 원문의 사건 전개 감각은 문장 전체에 유지했습니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 다시
  alternatives_korean:
  - 여전히
  - 계속
  lexicon: WLC + POB audit trail
  rationale: 여기서는 단순 지속보다 ‘재차/다시’의 뉘앙스가 더 강하므로, 반복적 예언 행위를 드러내는 한국어로 옮겼습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 여호와의 이름으로
  - 주님의 이름으로
  lexicon: POB terminology
  rationale: 본 프로젝트 기본값에 따라 יְהוָה를 야훼로 옮기고, 예언자적 발화가 하나님의 대표권을 침해한 죄목임을 그대로 살렸습니다.
- source_word: וּדְקָרֻהוּ
  english_pob_choice: will pierce him through
  chosen_korean: 찌를 것입니다
  alternatives_korean:
  - 꿰뚫을 것입니다
  - 창으로 찔러 죽일 것입니다
  lexicon: WLC + POB audit trail
  rationale: דקר의 폭력적 동작은 보존하되, 한국어에서 더 자연스러운 직접행동 표현으로 처리했습니다. 죽임의 결과는 앞의 ‘네가 살아 있을 수 없다’가 이미 분명히 합니다.
- source_word: יֹלְדָיו
  english_pob_choice: who bore him
  chosen_korean: 그를 낳은 그의 부모
  alternatives_korean:
  - 그를 낳은 자들
  - 그를 낳은 아버지와 어머니
  lexicon: WLC + POB audit trail
  rationale: 직역적 관계를 살리면서도 한국어에서 어색하지 않도록 ‘그를 낳은’으로 풀어, 친부모임을 분명히 했습니다.
theological_decisions:
- issue: 야훼의 이름을 거짓으로 말한 자에 대한 가정 내부의 심판 표현
  chosen_reading: 본문의 강한 진술을 유지하여, 예언이 계속될 경우 부모가 그를 죽음에 이르게 할 정도로 단호히 대응하는 장면으로 옮겼습니다.
  alternative_readings:
  - 가족의 단절이나 추방으로 완화
  - 비유적 비난으로 약화
  rationale: 히브리어는 죽음 선고와 찌름의 행위를 모두 명시하므로, 이를 완화하면 본문의 예언적 긴장과 정화의 강도가 훼손됩니다.
  doctrine_reference: Translation philosophy §1, §3
