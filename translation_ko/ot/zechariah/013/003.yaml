  lexicon: WLC + POB audit trail
  rationale: 예언적 문맥의 미래 상황을 한국어 조건문으로 자연스럽게 옮기되, 원문의 사건 전개 감각은 문장 전체에 유지했습니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 다시
  alternatives_korean:
