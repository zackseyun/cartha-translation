  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
  footnotes:
  - marker: a
    text: Or 'when a man again prophesies.' The Hebrew עוֹד can indicate continued or renewed action.
    reason: lexical_alternative
  - marker: b
    text: Or 'will stab him' or 'will thrust him through.' The Hebrew verb denotes piercing with a weapon.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이런 일이 있을 것입니다. 어떤 사람이 더 예언하면[a], 그를 낳은 그의 아버지와 어머니가 그에게 ‘너는 살아서는 안 된다. 네가 야훼의 이름으로 거짓을 말했기 때문이다’라고 말할 것입니다. 그를 낳은 그의 아버지와 어머니가 그가 예언할 때 그를 꿰뚫을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 사람이 다시 예언하면’. 히브리어 עוֹד는 계속되는 행위 또는 재개된 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 찌를 것입니다’ 또는 ‘그를 꿰뚫어 찌를 것입니다’. 히브리어 동사는 무기로 찌르거나 관통시키는 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
