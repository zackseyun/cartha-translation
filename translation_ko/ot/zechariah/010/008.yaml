id: ZEC.10.8
reference: Zechariah 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶשְׁרְקָ֥ה לָ/הֶ֛ם וַ/אֲקַבְּצֵ֖/ם כִּ֣י פְדִיתִ֑י/ם וְ/רָב֖וּ כְּמ֥וֹ רָבֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
  footnotes:
  - marker: a
    text: Or 'I will signal for them'; the Hebrew verb can denote whistling or hissing as a summons.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will multiply as they multiplied before.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 향해 휘파람을 불어 불러 모으겠습니다[a]. 내가 그들을 속량하였기[b] 때문이며, 그들은 예전처럼 많아질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신호를 보내’로도 옮길 수 있습니다. 히브리어 동사는 휘파람이나 부름의 신호를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 예전처럼 번성할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה
  english_pob_choice: I will whistle
  chosen_korean: 휘파람을 불어
  alternatives_korean:
  - 신호를 보내
  - 휘파람을 불러
  - 호각을 불어
  lexicon: HALOT
  rationale: שׁרק는 부름의 신호로 ‘휘파람을 불다/불어 부르다’ 또는 ‘신호하다’의 뜻을 가지므로, 현대 한국어에서 가장 자연스러우면서도 원문의 생생한 소집 이미지를 살리는 표현을 택했습니다.
- source_word: וַאֲקַבְּצֵם
  english_pob_choice: and gather them
  chosen_korean: 불러 모으겠습니다
  alternatives_korean:
  - 모으겠습니다
  - 집합시키겠습니다
  - 모아들이겠습니다
  lexicon: HALOT
  rationale: קבץ는 단순한 수집보다 흩어진 백성을 다시 모으는 뉘앙스가 강하므로, ‘불러 모으다’로 번역해 소집과 회복의 뜻을 함께 드러냈습니다.
- source_word: פְדִיתִים
  english_pob_choice: I have redeemed them
  chosen_korean: 속량하였기
  alternatives_korean:
  - 구속하였기
  - 구원하였기
  - 되찾아 주었기
  lexicon: HALOT
  rationale: פדה는 대가를 치르고 되사다/속량하다의 의미가 있으므로, 구속사적·언약적 색채를 살리는 ‘속량하다’를 택했습니다.
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  english_pob_choice: and they will be as many as they were before
  chosen_korean: 그들은 예전처럼 많아질 것입니다
  alternatives_korean:
  - 그들은 전에 그랬던 것처럼 많아질 것입니다
  - 그들은 이전처럼 번성할 것입니다
  - 그들은 예전처럼 불어날 것입니다
  lexicon: HALOT
  rationale: 마지막 절은 단순한 수적 증가보다 회복된 이전의 번성 상태를 가리키므로, 한국어로는 ‘예전처럼 많아지다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 회복과 속량의 인과관계
  chosen_reading: ‘내가 그들을 속량하였기 때문’이라는 인과를 앞세워, 회복이 야훼의 선행적 구속 행위에 근거함을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘내가 그들을 구원했기 때문’으로 일반화하는 읽기
  - 회복의 정치적·민족적 측면만 강조하는 읽기
  rationale: 본문은 불러 모음과 수적 회복을 인간의 조건이 아니라 하나님의 이미 이루어진 속량 행위에 연결합니다. 이 신학적 긴장을 그대로 보존하는 것이 합당합니다.
  doctrine_reference: 언약적 속량과 회복의 연결을 본문 수준에서 유지
