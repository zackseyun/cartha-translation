  source_fidelity: 반복된 מִמֶּנּוּ는 단수형을 따라 ‘그에게서’로 유지한 점과, פִּנָּה·יָתֵד·קֶשֶׁת מִלְחָמָה의 구체적 이미지를 옮긴 점은 대체로 충실합니다. 그러나 כָּל נֹגֵשׂ를 본문에서 ‘모든 강요하는 자’로 확정하면, 회복과 지도력의 이미지가 이어지는 문맥 및 영어 POB의 중립적 선택인 ‘every ruler’에서 벗어나며, 부정적 의미는 각주로 보존하는 편이 적절합니다.
  naturalness: ‘천막 말뚝’과 ‘모퉁잇돌’은 자연스럽습니다. ‘전쟁 활’은 현대 한국어에서 다소 압축되고 어색하므로 ‘전쟁의 활’이 더 자연스럽습니다. ‘모든 통치자가 함께 나올 것입니다’는 히브리어의 집합 부사 יַחְדָּו를 자연스럽게 반영합니다.
  terminology: ‘모퉁잇돌’, ‘천막 말뚝’, ‘전쟁의 활’은 원문의 비유 이미지를 보존합니다. נֹגֵשׂ는 ‘통치자’를 본문으로 삼되 ‘압제자’와 ‘부역 감독자’의 가능한 뜻을 각주에서 밝혀, 어휘적 긴장을 삭제하지 않습니다.
