id: ZEC.10.4
reference: Zechariah 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִמֶּ֤/נּוּ פִנָּה֙ מִמֶּ֣/נּוּ יָתֵ֔ד מִמֶּ֖/נּוּ קֶ֣שֶׁת מִלְחָמָ֑ה מִמֶּ֛/נּוּ יֵצֵ֥א כָל נוֹגֵ֖שׂ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
  footnotes:
  - marker: a
    text: Or 'every oppressor' or 'every taskmaster.' The Hebrew term can denote one who drives or exacts labor/tribute, but here it may refer more broadly to a ruler emerging from Judah.
    reason: alternative_reading
  - marker: b
    text: '''Cornerstone,'' ''tent peg,'' and ''battle bow'' are metaphorical images of stability, support, and military strength arising from Judah.'
    reason: cultural_note
translation:
  language: ko
  text: 그에게서 모퉁잇돌이 나오고, 그에게서 천막 말뚝이 나오며, 그에게서 전쟁의 활이 나올 것입니다. 그에게서 모든 통치자가 함께 나올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 압제자’ 또는 ‘모든 부역 감독자’. 히브리어 낱말은 사람을 몰아붙이거나 노동·공물을 강제로 요구하는 이를 가리킬 수 있으나, 여기서는 더 넓게 유다에게서 나오는 통치자를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  english_pob_choice: from him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그로부터
  - 그에게서부터
  lexicon: HALOT
  rationale: 반복되는 전치사+대명사 접미사는 단수형이므로, 영어 POB의 'from him'을 따라 한국어도 단수 인칭을 유지했습니다. 문맥상 집단적/대표적 의미가 가능하지만, 본문 이미지의 출처를 분명히 하는 표현으로 '그에게서'가 가장 자연스럽습니다.
- source_word: פִנָּה
  english_pob_choice: cornerstone
  chosen_korean: 모퉁잇돌
  alternatives_korean:
  - 기초돌
  - 모서리돌
  - 주춧돌
  lexicon: HALOT
  rationale: 이 어휘는 모퉁이/모퉁잇돌을 뜻할 수 있으며, 여기서는 안정과 기초를 나타내는 비유적 이미지이므로 전통적으로도 널리 통용되는 '모퉁잇돌'을 택했습니다.
- source_word: יָתֵד
  english_pob_choice: tent peg
  chosen_korean: 천막 말뚝
  alternatives_korean:
  - 말뚝
  - 장막 말뚝
  - 못
  lexicon: HALOT
  rationale: 문자적으로는 말뚝이지만, 영어 POB의 'tent peg'처럼 구체적이고 본래의 장막 이미지를 살리기 위해 '천막 말뚝'으로 옮겼습니다.
- source_word: קֶשֶׁת מִלְחָמָה
  english_pob_choice: the battle bow
  chosen_korean: 전쟁 활
  alternatives_korean:
  - 전투 활
  - 전쟁의 활
  - 싸움 활
  lexicon: HALOT
  rationale: 전쟁에 쓰는 활이라는 합성 의미를 간결하게 살리기 위해 '전쟁 활'로 옮겼습니다. '전투 활'도 가능하지만, מקור의 군사적 비유를 직접적으로 드러내는 표현이 더 적절합니다.
- source_word: כָל נוֹגֵשׂ
  english_pob_choice: every ruler
  chosen_korean: 모든 강요하는 자
  alternatives_korean:
  - 모든 압제자
  - 모든 감독자
  - 모든 통치자
  lexicon: HALOT
  rationale: נוֹגֵשׂ는 원래 몰아붙이거나 강제로 부과하는 자를 가리킬 수 있어, 본문 주석에 제시된 번역 가능성을 보존하려고 '강요하는 자'로 직역에 가깝게 옮겼습니다. 이렇게 하면 긍정적 통치자 해석도 가능하지만, 부정적 압박의 뉘앙스도 지워지지 않습니다.
theological_decisions:
- issue: כָל נוֹגֵשׂ의 의미를 긍정적 통치자 이미지로 평탄화할지 여부
  chosen_reading: '''모든 강요하는 자''를 유지하여 어휘의 긴장과 다의성을 보존했습니다.'
  alternative_readings:
  - 모든 통치자
  - 모든 압제자
  - 모든 감독자
  rationale: 문맥이 축복과 회복의 이미지들을 잇고 있지만, נוֹגֵשׂ 자체는 본래 강제·압박의 의미를 지닐 수 있습니다. 이를 '통치자'로 확정하면 해석을 지나치게 정리하게 되므로, 본문이 허용하는 긴장을 남겨 두었습니다.
  doctrine_reference: 해석적 긴장을 보존하고, 주석적 가능성을 본문 밖으로 밀어내지 않음.
