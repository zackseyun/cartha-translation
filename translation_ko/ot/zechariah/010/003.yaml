source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
  footnotes:
  - marker: a
    text: Or 'the leaders'; the Hebrew 'male goats' can be used metaphorically for prominent rulers or leading men.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 분노가 목자들에게 타오르고, 나는 수염소들[a]을 벌하겠습니다. 만군의 야훼[b]께서 자신의 양 떼, 곧 유다의 집을 돌아보시고, 그들을 전장에서 위엄 있는 말처럼 삼으실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수염소들’은 문맥상 지도층을 가리키는 은유로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  english_pob_choice: the shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 지도자들
  - 목회자들
  lexicon: HALOT
  rationale: 히브리어의 기본 은유를 그대로 살려, 지도자를 목자로 부르는 예언적 비난을 유지했습니다.
- source_word: חָרָה אַפִּי
  english_pob_choice: My anger burns
  chosen_korean: 내 분노가 타오르고
  alternatives_korean:
  - 내 분노가 불타오르고
  - 내 노가 타오르고
  lexicon: HALOT
  rationale: 관용구의 강한 감정적 열기를 자연스러운 현대 한국어로 살리되, 직역투를 피했습니다.
- source_word: הָעַתּוּדִים
  english_pob_choice: the male goats
  chosen_korean: 수염소들
  alternatives_korean:
  - 염소 수컷들
  - 숫염소들
  lexicon: HALOT
  rationale: 동물 이미지를 본문에 보존해 목자-양의 비유적 질감을 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 도큐멘트 기본값에 따라 신명은 야훼로 옮기고, צבאות는 군사적 함의를 드러내는 만군으로 옮겼습니다.
- source_word: וְשָׂם אוֹתָם כְּסוּס הוֹדוֹ
  english_pob_choice: and will make them like his majestic horse
  chosen_korean: 그들을 전장에서 위엄 있는 말처럼 삼으실 것이기 때문입니다
  alternatives_korean:
  - 그들을 그의 위엄 있는 말처럼 만드실 것이기 때문입니다
  - 그들을 전쟁의 위엄 있는 말처럼 삼으실 것이기 때문입니다
  lexicon: HALOT
  rationale: הוֹד의 ‘위엄/장엄’과 전투 문맥을 함께 살리기 위해 ‘전장에서 위엄 있는 말처럼’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문의 יְהוָה를 보존하는 소스 직접 번역 원칙을 따랐고, 한국 교회 전통어보다 학술적 전사값을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חָרָה אַפִּי의 정서 강도
  chosen_reading: ‘내 분노가 타오르고’로 분노의 급격한 분출을 유지했습니다.
  alternative_readings:
  - 내가 몹시 화가 났습니다
  - 내 분노가 일어났습니다
  rationale: 예언자적 고발의 강도를 약화하지 않도록 불의 이미지와 심판의 긴박함을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
