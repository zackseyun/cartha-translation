source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
  footnotes:
  - marker: a
    text: Or 'I will bring them back.' The Hebrew verb can carry the sense of returning or restoring.
    reason: lexical_alternative
  - marker: b
    text: '''The house of Joseph'' refers corporately to Joseph''s descendants, often especially the northern tribes.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 유다의 집을 강하게 하고 요셉의 집을 구원하겠습니다.[a] 내가 그들을 회복시키겠습니다. 내가 그들을 긍휼히 여겼으므로, 그들은 내가 그들을 거절하지 않았던 것처럼 될 것입니다. 나는 그들의 하나님 야훼이며, 그들에게 응답하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다의 집’과 ‘요셉의 집’은 각각 유다와 요셉의 후손을 집합적으로 가리키는 표현입니다. ‘요셉의 집’은 흔히 특히 북쪽 지파들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  english_pob_choice: I will strengthen
  chosen_korean: 강하게 하며
  alternatives_korean:
  - 강하게 하겠습니다
  - 힘 있게 하겠습니다
  - 강화하겠습니다
  lexicon: HALOT
  rationale: גבר의 Piel은 ‘강하게 하다/힘 있게 하다’의 사역적 의미이므로, 자연스러운 현대 한국어로 ‘강하게 하며’로 옮겨 그 힘을 더하는 뉘앙스를 살렸습니다.
- source_word: בֵּית יְהוּדָה / בֵּית יוֹסֵף
  english_pob_choice: the house of Judah / the house of Joseph
  chosen_korean: 유다의 집 / 요셉의 집
  alternatives_korean:
  - 유다 / 요셉
  - 유다 집 / 요셉 집
  lexicon: HALOT
  rationale: ‘집’(house)을 유지해 유다와 요셉의 가문·공동체적 표현을 보존했고, ‘유다 / 요셉’으로 단순화하지 않았습니다.
- source_word: אוֹשִׁיעַ
  english_pob_choice: I will save
  chosen_korean: 구원하겠습니다
  alternatives_korean:
  - 구해내겠습니다
  - 구출하겠습니다
  lexicon: HALOT
  rationale: ישׁע의 기본 의미를 따라 ‘구원하다’로 옮기되, 예언서 문맥의 구속적·언약적 함의를 살렸습니다.
- source_word: וְהוֹשְׁבוֹתִים
  english_pob_choice: I will restore them
  chosen_korean: 회복시키겠습니다
  alternatives_korean:
  - 다시 돌아오게 하겠습니다
  - 돌아오게 하겠습니다
  - 회복하겠습니다
  lexicon: HALOT
  rationale: שוב의 Hiphil은 ‘돌아오게 하다/회복하다’의 범위를 가지므로, 본문의 구원-회복 맥락을 포괄하는 ‘회복시키다’를 주 번역으로 택했습니다.
- source_word: כִּי רִחַמְתִּים
  english_pob_choice: because I have had compassion on them
  chosen_korean: 그들을 불쌍히 여겼기 때문입니다
  alternatives_korean:
  - 그들에게 긍휼을 베풀었기 때문입니다
  - 그들에게 자비를 베풀었기 때문입니다
  lexicon: HALOT
  rationale: רחם은 ‘불쌍히 여기다/긍휼히 여기다’에 가깝기 때문에, 현대 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다.
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  english_pob_choice: they will be as though I had not rejected them
  chosen_korean: 내가 그들을 거절하지 않았던 것처럼 될 것입니다
  alternatives_korean:
  - 내가 그들을 버리지 않았던 것처럼 될 것입니다
  - 내가 그들을 내치지 않았던 것처럼 될 것입니다
  lexicon: HALOT
  rationale: זנח은 ‘버리다’보다 ‘거절하다/내치다’의 뜻을 가질 수 있어, POB의 ‘rejected’에 맞추어 관계적 거절의 의미를 살렸습니다.
- source_word: וְאֶעֱנֵם
  english_pob_choice: and I will answer them
  chosen_korean: 그들에게 응답하겠습니다
  alternatives_korean:
  - 그들에게 대답하겠습니다
  - 그들에게 응답할 것입니다
  lexicon: HALOT
  rationale: ענה는 ‘대답하다/응답하다’이므로, 하나님이 백성의 부르짖음에 호응하시는 뉘앙스를 살려 ‘응답하다’를 택했습니다.
theological_decisions:
