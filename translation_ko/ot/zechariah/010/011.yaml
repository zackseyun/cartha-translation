source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
  footnotes:
  - marker: a
    text: Or 'through a sea of distress' or 'through the troubled sea.' The Hebrew phrase is compact and may evoke exodus imagery rather than identify a literal body of water only.
    reason: lexical_alternative
  - marker: b
    text: Hebrew יְאֹר can mean 'river,' but in an Egyptian setting it commonly refers to the Nile.
    reason: lexical_alternative
  - marker: c
    text: Or 'the rod of Egypt.' 'Scepter' brings out the likely sense of ruling power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 환난의 바다를 지나며 바다의 파도들을 치실 것이며, 나일의 모든 깊은 곳이 말라 버릴 것입니다. 앗시리아의 교만은 낮아질 것이며, 이집트의 홀은 물러날 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환난의 바다’는 히브리어의 압축된 표현을 살린 것으로, 문자적으로는 ‘환난의 바다’ 또는 ‘고난의 바다’로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 예언문맥의 יְאֹר는 일반적으로 ‘강’보다 이집트의 나일을 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: c
    text: שֵׁבֶט는 ‘홀’ 외에 ‘막대기’ 또는 ‘통치권’도 뜻할 수 있으나, 여기서는 통치의 상징을 드러내는 표현이 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר בַּיָּם צָרָה
  english_pob_choice: He will pass through the sea of distress
  chosen_korean: 그가 환난의 바다를 지나며
  alternatives_korean:
  - 그가 고통의 바다를 지나며
  - 그가 환난의 바다를 건너며
  - 그가 환난의 바다를 통과하며
  lexicon: HALOT
  rationale: בַּיָּם צָרָה를 단순한 지리적 바다가 아니라 ‘환난/고난의 바다’라는 압축된 표현으로 살려, POB의 출애굽적 이미지를 유지했습니다.
- source_word: וְהִכָּה בַיָּם גַּלִּים
  english_pob_choice: and strike the waves of the sea
  chosen_korean: 바다의 파도들을 치실 것이며
  alternatives_korean:
  - 바다의 물결들을 치실 것이며
  - 바다의 파도들을 내리치실 것이며
  - 바다의 물결을 치실 것이며
  lexicon: HALOT
  rationale: נכה의 기본 동사값인 ‘치다’로 대응해 강한 심판 행위를 드러냈고, ‘파도들’로 복수감을 보존했습니다.
- source_word: כֹּל מְצוּלוֹת יְאֹר
  english_pob_choice: all the depths of the Nile will dry up
  chosen_korean: 나일의 모든 깊은 곳이 말라 버릴 것입니다
  alternatives_korean:
  - 나일의 모든 깊은 곳이 마를 것입니다
  - 나일의 모든 깊은 심연이 말라 버릴 것입니다
  - 강의 모든 깊은 곳이 말라 버릴 것입니다
  lexicon: HALOT
  rationale: 예언적 이집트 맥락에서 יְאֹר는 ‘나일’로 구체화하는 것이 자연스럽고, מְצוּלוֹת는 ‘깊은 곳’으로 옮겨 물길의 깊이를 살렸습니다.
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  english_pob_choice: The pride of Assyria will be brought down
  chosen_korean: 앗시리아의 교만은 낮아질 것이며
  alternatives_korean:
  - 앗시리아의 자만은 낮아질 것이며
  - 앗시리아의 위세는 낮아질 것이며
  - 앗시리아의 교만은 끌어내려질 것이며
  lexicon: HALOT
  rationale: גְּאוֹן은 여기서 부정적 뉘앙스가 강해 ‘교만’이 적절하며, 수동적 하강 이미지를 ‘낮아질 것’으로 간결하게 살렸습니다.
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  english_pob_choice: and the scepter of Egypt will depart
  chosen_korean: 이집트의 홀은 물러날 것입니다
  alternatives_korean:
  - 이집트의 홀은 떠날 것입니다
  - 이집트의 지팡이는 물러날 것입니다
  - 이집트의 통치권은 사라질 것입니다
  lexicon: HALOT
  rationale: שֵׁבֶט는 정치적 지배 표지를 가리킬 수 있으므로 ‘홀’로 옮겨 통치의 상징을 살렸고, יָסוּר는 ‘물러날’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 주체의 연속성과 신적 행위
  chosen_reading: 문맥상 이 연속된 동사들은 야훼의 구원과 심판 행위를 계속 묘사합니다.
  alternative_readings:
  - 회복된 백성이 주어가 되어 일부 행위를 수행한다는 읽기
  rationale: 히브리어의 연속된 행위 서술과 앞뒤 문맥의 구원 약속을 따라, 바다를 제압하고 제국의 교만을 낮추는 주체를 하나님으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: exodus imagery; divine sovereignty
