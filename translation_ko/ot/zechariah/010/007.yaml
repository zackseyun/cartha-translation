  rationale: 본문이 직접 יהוה를 사용하므로, 프로젝트 기본값에 따라 언약적 고유명을 ‘야훼’로 옮겨 원문 표지를 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
