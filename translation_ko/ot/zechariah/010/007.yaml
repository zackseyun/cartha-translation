  - marker: b
    text: Hebrew 'their heart,' with a singular noun used collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 용사처럼 될 것이며, 그들의 마음은 포도주로 기뻐하듯 기뻐할 것입니다. 그들의 자녀[a]는 보고 기뻐할 것이며, 그들의 마음은 야훼 안에서 크게 기뻐할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 아들들’이라고 되어 있으나, 문맥상 자녀나 후손을 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְגִבּוֹר
  english_pob_choice: like a mighty warrior
  chosen_korean: 용사 같을
  alternatives_korean:
  - 용맹한 사람 같을
  - 강한 전사 같을
  lexicon: HALOT
  rationale: גִּבּוֹר의 전투적·영웅적 힘을 살리되, 한국어에서는 ‘용사’가 가장 자연스럽게 강한 전사의 이미지를 전달합니다.
- source_word: וְשָׂמַח לִבָּם כְּמוֹ יָיִן
  english_pob_choice: their heart will rejoice as with wine
  chosen_korean: 그들의 마음은 포도주처럼 기뻐할 것입니다
  alternatives_korean:
  - 그들의 마음은 포도주로 인해 기뻐할 것입니다
  - 그들의 마음은 술처럼 기뻐할 것입니다
  lexicon: HALOT
  rationale: 비교 대상은 포도주 자체가 아니라 포도주가 불러오는 기쁨이므로, ‘포도주처럼’으로 비유를 그대로 살렸습니다.
- source_word: וּבְנֵיהֶם יִרְאוּ וְשָׂמֵחוּ
  english_pob_choice: their children will see and rejoice
  chosen_korean: 그들의 자녀는 보고 기뻐할 것이며
  alternatives_korean:
  - 그들의 아들들은 보고 기뻐할 것이며
  - 그들의 자손은 보고 기뻐할 것이며
  lexicon: HALOT
  rationale: בָּנִים의 남성형이지만 문맥상 후손/자녀를 가리키는 집합적 용법이므로, 성별을 제한하지 않는 ‘자녀’가 가장 적절합니다.
- source_word: יָגֵל לִבָּם בַּיהוָה
  english_pob_choice: their heart will exult in Yahweh
  chosen_korean: 그들의 마음은 야훼 안에서 기뻐 뛰놀 것입니다
  alternatives_korean:
  - 그들의 마음은 야훼 안에서 크게 기뻐할 것입니다
  - 그들의 마음은 야훼로 말미암아 기뻐할 것입니다
  lexicon: HALOT
  rationale: גיל은 단순한 기쁨보다 더 들뜬 환희를 나타내므로, ‘기뻐 뛰놀다’로 강도를 살렸습니다. בַּיהוָה는 기쁨의 영역과 근거를 나타내므로 ‘안에서’로 옮겼습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
