language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
  footnotes:
  - marker: a
    text: Or more literally, 'and no place will be found for them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 이집트 땅에서 다시 데려오고, 앗수르에서 모으며, 그들을 길르앗 땅과 레바논으로 데려가겠으며, 그들을 위한 자리가 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그들을 위한 자리가 발견되지 않을 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  english_pob_choice: I will bring them back
  chosen_korean: 내가 그들을 다시 데려오고
  alternatives_korean:
  - 내가 그들을 되돌리고
  - 내가 그들을 회복시키고
  lexicon: HALOT
  rationale: Hiphil 형태의 שוב는 ‘돌아오게 하다’는 causative 의미이므로, 현대 한국어에서는 유배 귀환의 동작을 자연스럽게 드러내는 ‘다시 데려오다’가 가장 직접적입니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅으로부터
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’이 분명하므로 이를 살렸고, 출애굽을 연상시키는 지리적 출발점을 유지했습니다.
- source_word: אֲקַבְּצֵם
  english_pob_choice: gather them
  chosen_korean: 모으며
  alternatives_korean:
  - 모아 들이며
  - 집합시키며
  lexicon: HALOT
  rationale: קבץ는 흩어진 백성을 모으는 뜻이 강하므로, 심판·회복 맥락에 맞는 ‘모으다’를 택했습니다.
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן
  english_pob_choice: into the land of Gilead and Lebanon
  chosen_korean: 길르앗 땅과 레바논으로
  alternatives_korean:
  - 길르앗과 레바논으로
  - 길르앗 땅과 레바논 땅으로
  lexicon: HALOT
  rationale: אֶל과 אֶרֶץ의 결합을 따라 이동 방향과 ‘땅’의 뉘앙스를 유지했습니다. 두 지역을 하나의 대상 범위로 묶는 구조를 살리기 위해 ‘~으로’로 옮겼습니다.
- source_word: וְלֹא יִמָּצֵא לָהֶם
  english_pob_choice: and no room will be found for them
  chosen_korean: 그들을 위한 자리가 더는 없게 될 것입니다
  alternatives_korean:
  - 그들을 위한 자리가 발견되지 않을 것입니다
  - 그들을 위한 공간이 더는 생기지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그들을 위해/그들에게서 발견되지 않다’이지만, 문맥상 인구가 너무 많아 수용할 공간이 없다는 뜻이므로 한국어에서는 ‘자리가 더는 없게 되다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 유배 귀환과 공간 부족의 이미지
  chosen_reading: 본절은 포로 귀환의 회복을 말하면서, 귀환한 백성이 많아져 수용할 자리가 모자라게 되는 과장된 번성의 이미지를 전달합니다.
  alternative_readings:
  - 단순히 지리적 이동만을 말하는 것으로 읽을 수도 있습니다.
  - ‘자리가 없다’는 표현을 완곡하게 약화시킬 수도 있습니다.
  rationale: 앞뒤의 지명 열거(이집트, 앗수르, 길르앗, 레바논)와 ‘더는 없게 될 것입니다’는 결말은 단순 이동보다 회복과 번성의 결과를 함께 드러냅니다. 이를 약화시키면 본문의 예언적 힘이 줄어듭니다.
  doctrine_reference: Zechariah 10:10의 귀환-회복 모티프
