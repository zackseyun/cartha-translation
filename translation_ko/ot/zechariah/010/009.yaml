  - severity: low
    issue: ‘먼 곳들에서’와 ‘백성들 가운데에’는 다소 직역투입니다.
    rationale: ‘먼 곳에서’와 ‘민족들 가운데에’가 표준 한국어에서 더 자연스럽고, 원문의 복수 및 집단 의미를 충분히 전달합니다.
