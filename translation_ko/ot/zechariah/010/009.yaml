id: ZEC.10.9
reference: Zechariah 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶזְרָעֵ/ם֙ בָּֽ/עַמִּ֔ים וּ/בַ/מֶּרְחַקִּ֖ים יִזְכְּר֑וּ/נִי וְ/חָי֥וּ אֶת בְּנֵי/הֶ֖ם וָ/שָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
  footnotes:
  - marker: a
    text: Or 'scatter them among the nations.' The Hebrew verb literally means 'sow,' which can imply both dispersal and purposeful planting for future increase.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and they will live with their children,' or 'they and their children will live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 백성들 가운데에 뿌리고, 먼 곳들에서 그들이 나를 기억할 것입니다[a][b]. 그들과 그들의 자녀가 살 것이며, 그들은 돌아올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 민족들 가운데에 흩으시다.’ 히브리어 동사는 문자적으로는 ‘뿌리다’를 뜻하며, 분산과 장차의 증가를 위한 의도적 심기를 모두 함축할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그들과 그들의 자녀가 살 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  english_pob_choice: I will sow them
  chosen_korean: 내가 그들을 뿌리고
  alternatives_korean:
  - 내가 그들을 흩고
  - 내가 그들을 심고
  lexicon: HALOT
  rationale: זרע의 농경적 ‘뿌리다’ 이미지를 살려, 단순한 분산보다 목적성과 미래적 결실의 가능성을 함께 보이게 했습니다.
- source_word: בָּעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데에
  alternatives_korean:
  - 민족들 가운데에
  - 나라들 가운데에
  lexicon: HALOT
  rationale: עַמִּים의 복수성을 살리되 현대 한국어에서 자연스럽고 민족/집단적 뉘앙스를 담는 표현으로 옮겼습니다.
- source_word: וּבַמֶּרְחַקִּים
  english_pob_choice: in distant places
  chosen_korean: 먼 곳들에서
  alternatives_korean:
  - 먼 곳에서
  - 먼 지역들에서
  - 먼 나라들에서
  lexicon: HALOT
  rationale: מֶרְחָק의 거리 개념을 살리면서 장소 부사구로 자연스럽게 표현했습니다.
- source_word: אֶת־בְּנֵיהֶם
  english_pob_choice: they and their children
  chosen_korean: 그들과 그들의 자녀
  alternatives_korean:
  - 그들이 자녀와 함께
  - 그들의 자녀와 함께
  lexicon: HALOT
  rationale: 여기서 אֶת를 단순 목적격 표지로 처리하지 않고, 동반/공동 주어로 이해한 POB의 주석을 따라 ‘그들과 그들의 자녀’로 분명하게 옮겼습니다.
theological_decisions:
- issue: ‘뿌리다’ 비유의 의미 범위
  chosen_reading: 심판적 흩으심과 미래적 번성 가능성을 함께 남기는 표현으로 처리했습니다.
  alternative_readings:
  - 주로 심판으로 흩으신다는 의미로만 좁히는 읽기
  - 오직 번성을 위한 심기만 강조하는 읽기
  rationale: 문맥상 회복의 약속이지만, 히브리어 은유는 분산과 목적성을 동시에 담습니다. 그래서 ‘뿌리다’를 유지해 이 긴장을 해소하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
