revisions:
- from: 내가 그들을 백성들 가운데에 뿌리고, 먼 곳들에서 그들이 나를 기억할 것입니다[a][b]. 그들과 그들의 자녀가 살 것이며, 그들은 돌아올 것입니다.
  to: 내가 그들을 민족들 가운데에 뿌릴 것이며[a], 먼 곳에서 그들은 나를 기억할 것입니다. 그들과 그들의 자녀는 살 것이며[b], 그들은 돌아올 것입니다.
  rationale: 문장 전체를 합쇼체의 자연스러운 미래 진술로 정비하고, 히브리어의 화자(‘내가’)와 후속 주어(‘그들’)를 명확히 했습니다. ‘뿌리다’와 공동 참여로 이해 가능한 אֶת의 의미는 유지했습니다. 각주 b는 설명 대상인 ‘살 것이며’ 절에 붙이고, 본문의 공동 주어 번역과 구별되는 동반 표현을 대안으로 제시했습니다.
