  source_fidelity: 히브리어의 화자 전환과 동사 흐름을 더 분명히 해야 합니다. וְאֶזְרָעֵם은 1인칭 단수 ‘내가 그들을 뿌릴 것이다’이고, 이어지는 동사들은 그들에 대한 미래 진술입니다. 또한 אֶת־בְּנֵיהֶם은 동반/공동 참여의 의미를 보존하여 ‘그들과 그들의 자녀’로 옮길 수 있습니다.
  naturalness: 초안의 ‘내가 그들을 … 뿌리고, … 그들이 … 기억할 것입니다’는 연결 어미와 합쇼체 미래 종결이 부자연스럽게 결합되어 있습니다. ‘뿌릴 것이며’로 고치고, 복수형 ‘먼 곳들’은 현대 한국어에서 더 자연스러운 ‘먼 곳’으로 다듬는 것이 좋습니다.
  terminology: ‘뿌리다’는 זרע의 농경 은유와 목적 있는 분산의 긴장을 보존합니다. עַמִּים에는 ‘민족들’이 현대 한국어에서 더 자연스럽고 집단들의 복수 의미를 잘 나타냅니다. ‘기억하다’, ‘살다’, ‘돌아오다’도 원문의 의미 범위에 충실합니다.
  issues:
