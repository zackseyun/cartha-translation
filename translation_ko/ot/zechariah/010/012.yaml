translation:
  language: ko
  text: 내가 그들을 야훼 안에서 강하게 하며, 그의 이름으로 걸어가게 하겠습니다.” 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''그의 이름으로''는 ''그의 권위로'' 또는 ''그가 드러내신 성품 아래서''라는 뜻을 포함할 수도 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  english_pob_choice: I will strengthen them
  chosen_korean: 내가 그들을 강하게 하며
  alternatives_korean:
  - 내가 그들을 강건하게 하며
  - 내가 그들을 힘 있게 하며
  - 내가 그들을 강하게 만들며
  lexicon: HALOT
  rationale: גבר의 사역적 의미를 살려 주어가 직접 그들을 강하게 하시는 뜻을 자연스러운 한국어로 옮겼습니다. '강하게 하다'가 과도한 해설 없이 능력 부여의 강도를 잘 드러냅니다.
- source_word: בַּֽ/יהוָ֔ה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 야훼 가운데
  - 야훼로 말미암아
  - 야훼께로 말미암아
  lexicon: HALOT
  rationale: ב의 영역/기반 의미를 살려 '안에서'로 옮겨, 그들의 강함이 야훼 안에 근거한다는 관계를 보존했습니다.
- source_word: וּ/בִ/שְׁמ֖/וֹ
  english_pob_choice: and in his name
  chosen_korean: 그의 이름으로
  alternatives_korean:
  - 그의 이름 안에서
  - 그의 이름 아래
  - 그의 이름에 의해
  lexicon: HALOT
  rationale: שֵׁם의 이름-권위-계시된 성품의 층위를 살리되, 한국어에서는 '이름으로'가 가장 자연스럽게 그 권위/대표성의 함의를 유지합니다.
- source_word: יִתְהַלָּכ֑וּ
  english_pob_choice: they will walk
  chosen_korean: 걸어가게 하겠습니다
  alternatives_korean:
  - 걸어가게 할 것입니다
  - 행하며 살게 하겠습니다
  - 걸어 다니게 하겠습니다
  lexicon: HALOT
  rationale: 히트파엘 הלך의 관용적 'walk'를 그대로 살려, 단순한 윤리적 추상화보다 언약적 삶의 지속성을 드러내도록 했습니다.
- source_word: נְאֻ֖ם יְהוָֽה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה를 현대 한국어의 정중한 종결로 옮기되, 직접 화자의 권위를 살려 '말씀이십니다'로 처리했습니다.
theological_decisions:
- issue: יהוה의 표기와 종결 공식의 주체 표현
  chosen_reading: 본문에서는 '야훼'를 사용하고, 예언 공식은 '야훼의 말씀이십니다'로 마무리했습니다.
  alternative_readings:
  - 여호와
  - 주님의 말씀입니다
  - 야훼께서 말씀하십니다
  rationale: 프로젝트 기본값에 따라 신명성은 '야훼'로 드러내되, 예언 구문의 엄중함과 직접성을 합쇼체로 보존했습니다.
  doctrine_reference: 'POB glossary: YHWH → 야훼'
