- from: 이는 집안 우상들이 악을 말하고, 점쟁이들은 거짓을 보며, 거짓 꿈을 말하고 헛된 위로를 베풀기 때문입니다. 그러므로 그들은 양처럼 떠돌며, 목자가 없으므로 고난을 당합니다.[a][b]
  to: 이는 집안 우상들이 사악한 말을 하고[a], 점쟁이들은 거짓을 보며, 헛된 꿈을 말하고 헛된 위로를 베풀기 때문입니다. 그러므로 그들은 양처럼 떠돌며, 목자가 없으므로 고난을 당합니다.[b]
  rationale: 원문의 שָׁוְא를 일관되게 ‘헛된’으로 옮겨 ‘헛된 꿈’과 ‘헛된 위로’의 병렬을 살렸습니다. ‘사악한 말을 하고’는 אָוֶן의 악한 발화라는 뜻을 자연스러운 현대 한국어로 나타냅니다. 각주 내용은 유지하되 표지를 해당 단어와 구절에 배치했습니다.
