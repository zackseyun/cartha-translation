id: ZEC.10.2
reference: Zechariah 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
  footnotes:
  - marker: a
    text: Or “the teraphim,” a Hebrew term for household cult objects or idols.
    reason: lexical_alternative
  - marker: b
    text: Or “they are oppressed” for “they are afflicted.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 집안 우상들이 악을 말하고, 점쟁이들은 거짓을 보며, 거짓 꿈을 말하고 헛된 위로를 베풀기 때문입니다. 그러므로 그들은 양처럼 떠돌며, 목자가 없으므로 고난을 당합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테라핌’은 가정용 제의 물건이나 우상을 가리키는 히브리어 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘억눌립니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  english_pob_choice: the household idols
  chosen_korean: 집안 우상들
  alternatives_korean:
  - 테라핌
  - 가정용 우상들
  lexicon: HALOT
  rationale: תְּרָפִים은 가정에서 섬기던 우상/신상이라는 구체적 대상을 가리키므로, ‘집안 우상들’이 본문 뜻을 가장 분명하게 전달합니다.
- source_word: דִּבְּרוּ אָוֶן
  english_pob_choice: speak wickedness
  chosen_korean: 악을 말하고
  alternatives_korean:
  - 불의를 말하고
  - 헛됨을 말하고
  - 악한 말을 하고
  lexicon: HALOT
  rationale: אָוֶן은 악함·허무함·해악을 아우르지만, 여기서는 거짓 점술과 병렬을 이루는 도덕적 왜곡을 나타내므로 ‘악을 말하고’가 간결하고 자연스럽습니다.
- source_word: הֶבֶל יְנַחֵמוּן
  english_pob_choice: give vain comfort
  chosen_korean: 헛된 위로를 베풀고
  alternatives_korean:
  - 헛된 위안을 주고
  - 헛되이 위로하고
  - 공허한 위로를 하고
  lexicon: HALOT
  rationale: הֶבֶל은 허무함·헛됨을 뜻하므로, ‘헛된 위로’가 본문의 위로가 실질이 없고 무가치하다는 뜻을 잘 살립니다.
- source_word: נָסְעוּ כְמוֹ צֹאן
  english_pob_choice: they wander like sheep
  chosen_korean: 양처럼 떠돌며
  alternatives_korean:
  - 양처럼 방황하며
  - 양처럼 길을 떠나며
  - 양 떼처럼 흩어지며
  lexicon: HALOT
  rationale: 문맥상 목자 없는 양의 무질서한 이동을 가리키므로, ‘떠돌며’가 자연스럽고 이미지도 보존합니다.
- source_word: אֵין רֹעֶה
  english_pob_choice: there is no shepherd
  chosen_korean: 목자가 없으므로
  alternatives_korean:
  - 목자가 없기 때문에
  - 그들을 돌볼 목자가 없으므로
  lexicon: HALOT
  rationale: 직역 구조를 유지하면서도 한국어 문장 흐름을 자연스럽게 만들기 위해 ‘목자가 없으므로’로 옮겼습니다.
theological_decisions:
- issue: ‘고난을 당합니다’의 선택
  chosen_reading: יַעֲנוּ를 단순히 상태 서술로 옮기지 않고, ‘고난을 당합니다’로 번역했습니다.
  alternative_readings:
  - 압제를 당합니다
  - 괴로움을 겪습니다
  - 억눌립니다
  rationale: 어근 ענה는 ‘괴롭힘/억압을 받다’의 의미를 담을 수 있으며, 목자 없는 양의 처지를 사회적·목회적 고통으로 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
