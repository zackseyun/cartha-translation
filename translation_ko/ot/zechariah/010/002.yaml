  naturalness: 합쇼체의 문장 흐름은 대체로 자연스럽습니다. 다만 ‘악을 말하고’는 현대 한국어에서 다소 추상적이므로 ‘사악한 말을 하고’가 자연스럽고 원문의 발화 행위를 더 분명히 합니다.
  terminology: ‘집안 우상들’, ‘점쟁이들’, ‘목자’는 적절합니다. 테라핌 각주의 ‘가정용 제의 물건’은 ‘가정의 제의용 물건’으로 다듬으면 더 자연스럽습니다.
