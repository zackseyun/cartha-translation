  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
  footnotes:
  - marker: a
    text: Or 'like warriors.' The Hebrew literally uses a masculine term, 'mighty men,' for valiant fighters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 전사들처럼 되어 거리의 진흙을 전쟁터에서 밟아 뭉갤 것이며, 싸울 것입니다. 이는 야훼께서 그들과 함께 계시기 때문입니다. 또 그들은 말탄 자들을 부끄럽게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '용사들처럼'. 히브리어는 남성형 용맹한 전투원을 가리키는 말을 문자적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְגִבֹּרִים
  english_pob_choice: like mighty men
  chosen_korean: 전사들처럼
  alternatives_korean:
  - 용사들처럼
  - 용맹한 사람들처럼
  lexicon: HALOT
  rationale: 문맥이 군사적 승리를 말하므로, 남성 복수의 כוח/용맹을 가진 전투 이미지를 자연스러운 현대어로 옮겼습니다. '전사들'은 원문의 강한 전투성은 유지하되 과도하게 고어적이지 않습니다.
- source_word: בּוֹסִים בְּטִיט חוּצוֹת
  english_pob_choice: trampling the mire of the streets
  chosen_korean: 거리의 진흙을 … 밟아 뭉갤 것이며
  alternatives_korean:
  - 거리의 진흙을 밟을 것이며
  - 길거리의 진흙을 짓밟을 것이며
  lexicon: HALOT
  rationale: בוס는 단순한 '밟다'보다 강한 '짓밟다/뭉개다'의 동작을 담으므로, 전쟁터에서 적을 진흙처럼 짓밟는 이미지를 살려 '밟아 뭉갤'로 옮겼습니다. '거리의 진흙'은 חוּצוֹת의 구체적 거리 이미지를 유지합니다.
- source_word: בַּמִּלְחָמָה
  english_pob_choice: in battle
  chosen_korean: 전쟁터에서
  alternatives_korean:
  - 전투에서
  - 전쟁 중에
  lexicon: HALOT
  rationale: 직전의 진흙을 밟는 장면이 싸움의 현장 안에서 벌어지는 것으로 읽히므로, 한국어에서는 공간적 현장감을 주는 '전쟁터에서'가 가장 자연스럽습니다.
- source_word: וְהֹבִישׁוּ רֹכְבֵי סוּסִים
  english_pob_choice: they will put horsemen to shame
  chosen_korean: 말탄 자들을 부끄럽게 할 것입니다
  alternatives_korean:
  - 기마병을 부끄럽게 할 것입니다
  - 말 위에 탄 자들을 수치스럽게 할 것입니다
  lexicon: HALOT
  rationale: הוביש는 수치를 주어 굴복시키는 의미이므로, 결과를 직역하기보다 한국어의 관용적 표현인 '부끄럽게 하다'로 옮겼습니다. '말탄 자들'은 רֹכְבֵי סוּסִים의 군사적 대상을 지나치게 해석하지 않으면서도 뜻을 분명히 합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신명기적 언약 სახელ인 יהוה를 직접 사용하므로, 본역은 관례적 대치어인 '주님'보다 고유명사 '야훼'를 택해 원문 식별성을 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
