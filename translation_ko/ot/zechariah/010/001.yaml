id: ZEC.10.1
reference: Zechariah 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
  footnotes:
  - marker: a
    text: Or 'in the season of the latter rain' or 'late rain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'makes lightning flashes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께 비를 구하십시오. 늦은 비의 때에 여호와께서는 구름을 만드시고, 그들에게 소낙비를 주시며, 들의 각 사람에게서는 풀을 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘늦은 비의 때에’ 또는 ‘늦은 비의 시기에’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘번개 섬광을 만드시고’.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ / מֵיְהוָה
  english_pob_choice: Ask Yahweh for rain
  chosen_korean: 여호와께 비를 구하십시오
  alternatives_korean:
  - 여호와에게 비를 요청하십시오
  - 여호와께 비를 구하세요
  lexicon: WLC + POB audit trail
  rationale: 히브리어 명령형 שַׁאֲלוּ는 ‘구하다/청하다’의 직접적 요청이며, מִן+יהוה는 구문의 대상이 아니라 근원/상대입니다. 한국어에서는 ‘비를 구하다’가 가장 자연스럽고 원문 관계를 보존합니다.
- source_word: בְּעֵת מַלְקוֹשׁ
  english_pob_choice: in the time of the latter rain
  chosen_korean: 늦은 비의 때
  alternatives_korean:
  - 이른 봄비의 때
  - 가을비의 때
  - 늦은 비의 시기
  lexicon: HALOT
  rationale: מַלְקוֹשׁ는 농경 주기의 늦은 계절비를 가리키므로, 본문 의미를 직접 살려 ‘늦은 비’로 옮겼습니다. 영어 주해의 ‘latter rain’과도 대응됩니다.
- source_word: עֹשֶׂה חֲזִיזִים
  english_pob_choice: makes storm clouds
  chosen_korean: 구름을 만드시고
  alternatives_korean:
  - 폭풍구름을 만드시고
  - 번개를 만드시고
  - 먹구름을 만드시고
  lexicon: HALOT
  rationale: חֲזִיזִים은 번개 섬광 또는 폭풍 현상을 가리킬 수 있으나, 이어지는 비의 선물을 고려하면 한국어에서는 ‘구름을 만드시고’가 과도한 특정화를 피하면서 문맥상 자연스럽습니다.
- source_word: וּמְטַר גֶּשֶׁם
  english_pob_choice: showers of rain
  chosen_korean: 소낙비를 주시며
  alternatives_korean:
  - 비 소낙비를 주시며
  - 많은 비를 주시며
  - 소나기를 주시며
  lexicon: HALOT
  rationale: מְטַר גֶּשֶׁם은 비를 강조하는 중복 표현이어서, 한국어에서는 압축적으로 ‘소낙비’로 옮겨 강한 강수 이미지를 살렸습니다.
- source_word: לְאִישׁ עֵשֶׂב בַּשָּׂדֶה
  english_pob_choice: to each man vegetation in the field
  chosen_korean: 들의 각 사람에게서는 풀을 주십니다
  alternatives_korean:
  - 각 사람에게 들의 풀을 주십니다
  - 각 사람에게 밭의 식물을 주십니다
  - 각 사람에게 들의 초목을 주십니다
  lexicon: HALOT
  rationale: לְאִישׁ는 분배적 단수로 ‘각 사람’이 적절하며, עֵשֶׂב은 ‘초목/풀/식물’ 범위에서 한국어 일반 독자에게 가장 직관적인 ‘풀’로 옮겼습니다. בַּשָּׂדֶה는 농경 배경의 ‘들’로 처리했습니다.
theological_decisions:
- issue: 여호와(יהוה) 표기
  chosen_reading: 원문 신명 표기를 따라 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 WLC의 יְהוָה를 직접 사용하므로, POB의 본문 원칙에 따라 고유 신명 표기를 보존하는 방식으로 처리했습니다. 한국어 성경 관행과의 긴장보다 원문 식별성을 우선했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: ‘구름을 만드시고’의 자연현상 표현
  chosen_reading: 후행하는 비의 약속과 맞물리도록 ‘구름을 만드시고’로 옮겼습니다.
  alternative_readings:
  - 번개를 만드시고
  - 폭풍구름을 만드시고
  rationale: חֲזִיזִים의 어휘 범위는 넓지만, 여기서는 비를 주시는 문맥이 핵심이므로 특정 현상으로 과도하게 고정하지 않고 비를 예비하는 자연현상으로 읽히는 표현을 택했습니다.
  doctrine_reference: 문맥 우선 원칙
