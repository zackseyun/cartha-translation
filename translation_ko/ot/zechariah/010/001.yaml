  to: 늦은 비가 내릴 때에 여호와께 비를 구하십시오.[a] 여호와께서는 폭풍 구름을 만드시고[b], 그들에게 비를 내려 주시며, 각 사람에게는 들의 풀을 주십니다.
  rationale: 시간구를 명령문 앞에 두어 원문의 수식 관계를 분명히 했습니다. חֲזִיזִים은 비의 문맥에 맞는 ‘폭풍 구름’으로 옮기되 번개 섬광이라는 유력한 어휘 대안을 각주로 보존했습니다. 비의 강도를 불필요하게 한정한 ‘소낙비’를 피하고, 마지막 분배구는 자연스러운 한국어 어순으로 바로잡았습니다.
