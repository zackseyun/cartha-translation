id: ZEC.7.7
reference: Zechariah 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
  footnotes:
  - marker: a
    text: Or 'through the former prophets.' The Hebrew idiom is literally 'by the hand of the former prophets.'
    reason: lexical_alternative
  - marker: b
    text: Or 'secure' for 'at ease.' The Hebrew term can include the sense of quiet security or undisturbed prosperity.
    reason: lexical_alternative
  - marker: c
    text: '''The Shephelah'' refers to the western lowland/foothill region of Judah.'
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘과 그 주변 성읍들에 사람이 살고 평안하였으며, 네겝과 스펠라에도 사람이 살던 때에 야훼께서 이전 예언자들을 통하여 선포하신 말씀들이 아닙니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전 예언자들을 통하여’. 히브리어 관용구는 문자적으로 ‘예언자들의 손으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안전하고’. 여기의 히브리어는 조용한 평안뿐 아니라 방해받지 않는 안전을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘스펠라’는 유다 서쪽의 저지대와 구릉 지대를 가리키는 지역명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Are ... not
  chosen_korean: 아닌가
  alternatives_korean:
  - 그렇지 않은가
  - '...가 아니냐'
  lexicon: HALOT
  rationale: 수사적 질문으로서 이미 정해진 답을 기대하므로, 현대 한국어에서는 ‘아닌가’가 가장 자연스럽게 반문과 확신의 뉘앙스를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  english_pob_choice: by the former prophets
  chosen_korean: 이전 예언자들을 통해
  alternatives_korean:
  - 이전 예언자들의 손으로
  - 옛 예언자들을 통해
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손으로/by the hand of’는 매개·도구성을 뜻하므로, 한국어에서는 의미를 분명히 하는 ‘~을 통해’로 옮겼습니다.
- source_word: הַשְּׁפֵלָה
  english_pob_choice: the Shephelah
  chosen_korean: 스펠라
  alternatives_korean:
  - 셰펠라
  - 저지대
  lexicon: HALOT
  rationale: 유다의 서쪽 저지대 지명을 고유 지역명으로 보존하기 위해 음역을 택했습니다. 한국어 표기는 외래어 표기 관행에 맞춰 조정했습니다.
theological_decisions:
- issue: 지명과 일반지형어 사이의 구분
  chosen_reading: 네겝과 스펠라를 고유한 지역명으로 남겼습니다.
  alternative_readings:
  - 남쪽과 저지대
  - 남방과 낮은 지역
  rationale: 본문은 단순한 방향 표지가 아니라 유다의 역사적 지리권을 가리키므로, 지역명으로 처리하는 것이 독자가 원문 배경을 더 정확히 이해하게 합니다.
  doctrine_reference: 지리·역사 배경 보존 원칙
