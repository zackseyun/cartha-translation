revisions:
- from: 그리고 다리오 왕의 제사년, 곧 아홉째 달 초나흗날에 야훼의 말씀이 스가랴에게 임했습니다. 그때는 기슬르월이었습니다.[a]
  to: 다리오 왕 통치 제사년 아홉째 달, 곧 기슬르월 넷째 날에 야훼의 말씀이 스가랴에게 임했습니다.[a]
  rationale: 본문의 날짜를 원문과 같이 하나의 연호·월·일 공식으로 유지했습니다. ‘넷째 날’을 명시하여 전통 날짜말의 오해 가능성을 없앴고, ‘통치 제사년’으로 왕의 재위 연호라는 뜻을 분명히 했습니다. 야훼의 신명 표기와 예언 공식의 ‘말씀’은 유지했습니다.
  reviewer_model: gpt-5.6-terra
