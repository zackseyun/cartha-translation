translation:
  language: ko
  text: 다리오 왕 통치 제사년 아홉째 달, 곧 기슬르월 넷째 날에 야훼의 말씀이 스가랴에게 임했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기슬르월’은 히브리력 아홉째 달의 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ...
  chosen_korean: 그리고
  alternatives_korean:
  - 그때
  - 이리하여
  lexicon: HALOT
  rationale: 서사 전환을 알리는 접속사로 기능하므로, 현대 한국어에서는 자연스러운 연결어인 ‘그리고’로 시작해 구어적이거나 고어적인 과거 관용을 피했습니다.
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  english_pob_choice: in the fourth year of King Darius
  chosen_korean: 다리오 왕의 제사년
  alternatives_korean:
  - 다리오 왕의 네 번째 해
  - 다리오 왕 제사년에
  lexicon: HALOT
  rationale: 히브리어 왕 연호 관용구를 한국어 성서체에 맞게 간결하게 옮기되, ‘제사년’으로 연호의 정형성을 살렸습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀이
  lexicon: HALOT
  rationale: 예언 수여 공식에서 דָּבָר는 단순한 ‘말’보다 하나님의 계시적 ‘말씀’이 더 정확하므로, POB의 신명 표기 ‘야훼’를 유지했습니다.
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  english_pob_choice: on the fourth day of the ninth month
  chosen_korean: 아홉째 달 초나흗날
  alternatives_korean:
  - 아홉째 달의 넷째 날
  - 아홉째 달의 초사흗날
  lexicon: HALOT
  rationale: 달력식 표현은 한국어에서 ‘초나흗날’로 자연스럽고 정확하게 전달할 수 있어, 영어 보충어 ‘day’를 기계적으로 반복하지 않았습니다.
- source_word: בְּכִסְלֵו
  english_pob_choice: in Kislev
  chosen_korean: 기슬르월
  alternatives_korean:
  - 기슬레브
  - 키슬레우
  lexicon: HALOT
  rationale: 히브리 달 이름은 음역하되 한국어 성서 맥락에서 달 이름임을 분명히 하기 위해 ‘월’을 덧붙였습니다.
theological_decisions:
- issue: 야훼라는 신명 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: POB의 공인 원칙에 따라 신명은 대체 칭호 ‘주’가 아니라 고유명 ‘야훼’로 드러내어, 본문이 가진 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
