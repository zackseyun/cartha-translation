  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in Kislev,'' the name of the ninth month in the Hebrew calendar.'
