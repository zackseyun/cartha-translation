language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר מִשְׁפַּ֤ט אֱמֶת֙ שְׁפֹ֔טוּ וְ/חֶ֣סֶד וְ/רַֽחֲמִ֔ים עֲשׂ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
  footnotes:
  - marker: a
    text: Or 'Judge a true judgment.' The Hebrew phrase combines 'judgment/justice' with 'truth' to call for judgments marked by truthfulness and integrity.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man to his brother,' a masculine representative expression for mutual covenantal treatment within the community.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하셨습니다. 「진실한 재판을 행하고, 한 사람씩 자기 형제에게 인애와 긍휼을 베푸십시오」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 משפט אֱמֶת은 문자적으로 ‘진실한 재판/판단’이며, 여기서는 재판의 정직성과 공정성을 함께 요구합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘한 사람씩 자기 형제에게’는 공동체 안의 상호 관계를 가리키는 남성 대표 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: 여호와 대신 야훼를 쓰는 프로젝트 기본값을 따르되, צְבָאוֹת은 군대보다 성경적 관용이 자연스러운 ‘만군의’로 옮겼습니다.
- source_word: מִשְׁפַּט אֱמֶת
  english_pob_choice: true judgments
  chosen_korean: 진실한 재판
  alternatives_korean:
  - 진리의 재판
  - 참된 공의
  lexicon: HALOT
  rationale: 복수형 משפט은 단일한 ‘정의’보다 구체적 행위로서의 ‘재판’이 더 잘 드러나며, אמת는 ‘진실한’으로 결을 살렸습니다.
- source_word: שְׁפֹטוּ
  english_pob_choice: Render
  chosen_korean: 행하고
  alternatives_korean:
  - 판단하십시오
  - 재판하십시오
  lexicon: HALOT
  rationale: 명령형은 공동체가 실제로 재판을 수행하라는 뜻이므로, 한국어에서는 법정적 행위를 포괄하는 ‘행하다’가 가장 자연스럽습니다.
- source_word: חֶסֶד וְרַחֲמִים
  english_pob_choice: steadfast love and compassion
  chosen_korean: 인애와 긍휼
  alternatives_korean:
  - 변함없는 사랑과 자비
  - 언약적 사랑과 자비
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 충실함을 담는 ‘인애’가 더 적합하고, רַחֲמִים는 감정적 연민을 살리는 전통적 성경어 ‘긍휼’이 대응됩니다.
- source_word: אִישׁ אֶת אָחִיו
  english_pob_choice: each man to his brother
  chosen_korean: 한 사람씩 자기 형제에게
  alternatives_korean:
  - 각 사람 자기 이웃에게
  - 서로
  lexicon: HALOT
  rationale: 히브리어의 남성 대표적 표현을 유지하면서도, 현대 한국어에서 과도한 남성 중심 어감을 줄이기 위해 ‘한 사람씩’으로 분배적 의미를 살렸습니다.
theological_decisions:
- issue: 공동체 윤리 명령의 강도
  chosen_reading: 제의적·윤리적 경건이 아니라 실제 법정과 공동체 관계에서 공정과 자비를 요구하는 직접 명령으로 옮겼습니다.
  alternative_readings:
  - ‘정의를 행하라’로 더 일반화
  - ‘바르게 판단하라’로 축소
  rationale: 문맥은 형식적 종교 행위보다 공동체 안의 실제 재판과 관계 윤리를 요구하므로, משפט과 חֶסֶד/רחמים의 병렬을 구체적으로 드러내는 것이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: Zechariah 7:9 문맥상 사회윤리 명령
- issue: 남성 대표 표현 처리
  chosen_reading: ‘한 사람씩 자기 형제에게’로 옮겨, 원문의 대표적 남성 표현을 유지하되 한국어 독자의 이해를 돕도록 완화했습니다.
  alternative_readings:
  - ‘각자 서로에게’
  - ‘각 사람 자기 이웃에게’
  rationale: 원문은 남성형 단수로 집단 전체를 대표하므로, 완전 중립화보다 원문 형식을 보존하는 번역이 더 소스-정합적입니다.
  doctrine_reference: 번역 철학 §4 성별-정확성 원칙
