  source_fidelity: 히브리어의 반복된 וְכִי를 시간적 ‘…할 때’로 옮긴 것은 문맥과 부합하며, הֲלוֹא의 수사 의문과 독립 대명사의 강조도 보존하려는 방향이 적절합니다. 다만 현 문장의 ‘먹는 자가 바로 너희가 아니며’는 부정 연결로 읽혀, 원문의 긍정적 병렬 진술(‘너희가 먹는 자들이며, 너희가 마시는 자들’)을 흐립니다.
  naturalness: ‘먹는 자가 바로 너희가 아니며 마시는 자가 바로 너희가 아닙니까?’는 한국어에서 첫 절이 ‘너희가 아니다’라는 뜻으로 처리되어 뒤의 반문과도 어색하게 연결됩니다. 병렬되는 두 명사절을 ‘…이며 …가 아닙니까?’로 구성하는 편이 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘너희’는 본문의 2인칭 복수에 맞고, ‘먹는 자/마시는 자’는 정관사+분사의 실체적 용법과 병렬을 무리 없이 반영합니다. ‘바로’는 강조를 적절히 살립니다.
  issues:
