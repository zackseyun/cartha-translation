  text: וְ/כִ֥י תֹאכְל֖וּ וְ/כִ֣י תִשְׁתּ֑וּ הֲ/ל֤וֹא אַתֶּם֙ הָ/אֹ֣כְלִ֔ים וְ/אַתֶּ֖ם הַ/שֹּׁתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
  footnotes:
  - marker: a
    text: Or, 'And if you eat and if you drink.' The Hebrew conjunction can be rendered temporally ('when') or conditionally ('if'); here 'when' best fits the flow of the argument.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희가 먹고 마실 때에도, 먹는 자가 바로 너희이며 마시는 자가 바로 너희가 아닙니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘또 너희가 먹고 마실 때에도’는 히브리어 접속사를 시간적으로 이해한 번역입니다. 이 접속사는 조건적으로 이해하여 ‘또 너희가 먹고 마시면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And when
  chosen_korean: 그리고 … 할 때에도
  alternatives_korean:
  - 그리고 … 하면
  - 또 … 할 때에
  lexicon: HALOT
  rationale: 문맥상 금식(직전 문맥)과 나란히 이어지는 시간적 상황을 나타내므로, 조건문보다 ‘할 때’ 구조가 자연스럽고 흐름을 잘 살립니다.
- source_word: הֲלוֹא
  english_pob_choice: is it not
  chosen_korean: … 아닙니까?
  alternatives_korean:
  - … 아니겠습니까?
  - … 그렇지 않습니까?
  lexicon: HALOT
  rationale: 기대하는 답을 전제하는 수사 의문문이므로, 한국어에서는 정중한 반문형으로 옮겨 힘을 살렸습니다.
- source_word: הָאֹכְלִים / הַשֹּׁתִים
  english_pob_choice: who are eating / who are drinking
  chosen_korean: 먹는 자 / 마시는 자
  alternatives_korean:
  - 먹고 있는 사람 / 마시고 있는 사람
  - 먹는 사람 / 마시는 사람
  lexicon: HALOT
  rationale: 정관사+분사 구조의 실체화된 표현을 그대로 드러내기 위해 ‘자’를 사용해, 단순한 행위 묘사보다 대조와 강조가 살아나도록 했습니다.
- source_word: אַתֶּם
  english_pob_choice: you
  chosen_korean: 너희가 바로
  alternatives_korean:
  - 너희가
  - 너희 자신이
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서 반복어순(‘바로 너희가’)으로 살려, 먹고 마시는 주체를 강하게 지시합니다.
theological_decisions:
- issue: 수사적 강조의 보존
  chosen_reading: 이 절은 단순히 ‘먹고 마신다’는 중립적 진술이 아니라, 그 행위의 중심이 바로 그들에게 있음을 드러내는 수사적 반문으로 옮겼습니다.
  alternative_readings:
  - 일반적인 생활 진술로 완화하는 번역
  rationale: 히브리어의 독립 대명사와 분사 반복이 강조를 이루므로, 한국어도 같은 강조를 유지해야 직전 절의 금식 비판과 평행이 분명해집니다.
  doctrine_reference: Translation philosophy §1, §3
