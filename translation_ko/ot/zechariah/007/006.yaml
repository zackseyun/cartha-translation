  to: 또 너희가 먹고 마실 때에도, 먹는 자가 바로 너희이며 마시는 자가 바로 너희가 아닙니까?[a]
  rationale: 시간적 해석과 수사적 강조는 유지하되, 원문의 ‘너희 … 너희’ 병렬을 한국어의 긍정적 연결 구조로 바로잡았습니다. ‘또 너희가’는 두 동사의 주어를 명시하면서 반복된 접속사의 연결 기능을 자연스럽게 드러냅니다.
