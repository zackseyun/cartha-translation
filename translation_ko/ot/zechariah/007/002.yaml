  text: Now Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
  footnotes:
  - marker: a
    text: Or 'to seek the favor of the LORD.' The Hebrew idiom literally involves 'softening/entreating the face' of the LORD.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Bethel.' Some understand this as 'the house of God,' but here it is most likely the place name.
    reason: alternative_reading
translation:
  language: ko
  text: 벧엘은 사레셀과 레겜멜렉과 그의 수행원들을 보내어 야훼께 은혜를 간구하도록 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘야훼의 얼굴을 간청하다’라는 뜻이며, 야훼의 호의나 은혜를 간구한다는 관용적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘벧엘’입니다. 여기서는 ‘하나님의 집’이라는 일반명사보다 지명으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
