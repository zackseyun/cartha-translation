    rationale: וַיִּשְׁלַח은 단순 과거 서사 동사이며, ‘이제’에 해당하는 명시적 시간·담화 표지가 없습니다.
  - severity: medium
    issue: ‘야훼의 얼굴에 은혜를 구하다’의 부자연스러운 격 표지
    rationale: 한국어에서는 사람의 ‘얼굴에’ 은혜를 구한다고 하지 않습니다. 히브리어 관용구의 뜻을 살려 ‘야훼께 은혜를 간구하다’로 번역하는 것이 적절합니다.
  - severity: medium
    issue: 각주의 문자적 설명이 부정확함
    rationale: 본문 관용구를 문자적으로 ‘얼굴을 부드럽게 하다/달래다’라고 제시하는 것은 히브리어 표현 자체의 직역으로 적절하지 않습니다. ‘얼굴을 간청하다’라는 표현이 호의를 간청한다는 관용적 뜻임을 밝혀야 합니다.
