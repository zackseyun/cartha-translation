  text: וַ/יִּשְׁלַח֙ בֵּֽית אֵ֔ל שַׂר אֶ֕צֶר וְ/רֶ֥גֶם מֶ֖לֶךְ וַֽ/אֲנָשָׁ֑י/ו לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Now Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
  footnotes:
  - marker: a
    text: Or 'to seek the favor of the LORD.' The Hebrew idiom literally involves 'softening/entreating the face' of the LORD.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Bethel.' Some understand this as 'the house of God,' but here it is most likely the place name.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 벧엘이 사레셀과 레겜-멜렉과 그의 사람들을 보내어 야훼의 얼굴에 은혜를 구하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘얼굴을 부드럽게 하다/달래다’를 뜻하므로, 여기서는 ‘은혜를 구하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘벧엘’입니다. 여기서는 ‘하나님의 집’이라는 일반명사보다 지명으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 하나님의 집
  lexicon: HALOT
  rationale: 여기서는 일반명사보다 지명으로 쓰인 것으로 보는 영어 POB의 판단을 따라, 표준 지명 표기인 벧엘로 옮겼습니다.
- source_word: שַׂר אֶצֶר
  english_pob_choice: Sharezer
  chosen_korean: 사레셀
  alternatives_korean:
  - 샤레셀
  - 사르에셀
  lexicon: HALOT
  rationale: 인명은 번역하지 않고 음역해야 하므로, 현대 외래어 표기 원칙에 맞는 음역으로 처리했습니다.
- source_word: וְרֶגֶם מֶלֶךְ
  english_pob_choice: Regem-melech
  chosen_korean: 레겜-멜렉
  alternatives_korean:
  - 레겜-므렉
  - 레겜-메렉
  lexicon: HALOT
  rationale: 복합 인명은 하이픈을 유지해 구성 요소를 드러내는 것이 좋으므로, 영어 POB의 복합형을 반영해 음역했습니다.
- source_word: לְחַלּוֹת אֶת פְּנֵי
  english_pob_choice: to entreat the favor of
  chosen_korean: 은혜를 구하게 하였습니다
  alternatives_korean:
  - 호의를 간청하게 하였습니다
  - 얼굴을 부드럽게 하게 하였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 직역하면 어색하므로, ‘얼굴을 부드럽게 하다’의 관용적 의미인 간청·청원 행위를 한국어로 자연스럽게 풀되, 본문의 청유적 뉘앙스를 살려 ‘은혜를 구하다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명 Tetragrammaton을 직역하지 않고 대치어로 흐리지 않기 위해, 프로젝트 기본값에 따라 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
