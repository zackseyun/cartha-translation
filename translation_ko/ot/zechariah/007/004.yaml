lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때에 ... 임하여
  alternatives_korean:
  - 그리고 ... 왔습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 예언 서문의 순차적 도입을 한국어에서 자연스럽게 드러내면서도, 단순한 사건 서술보다 ‘말씀이 임하다’는 예언 공식의 뉘앙스를 살렸습니다.
- source_word: דְּבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 공식에서 하나님의 발화를 가리키는 정형 표현이므로 ‘말씀’을 택해 원문의 공식성을 보존했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: 고유명 יְהוָה는 프로젝트 기본값대로 ‘야훼’로, צְבָאוֹת는 하늘과 땅의 군대를 포괄하는 칭호로서 관용적으로 ‘만군의’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 나에게
  alternatives_korean:
  - 내게
  - 내게로
  lexicon: HALOT
  rationale: 예언자에게 전달된 말씀의 수신자를 분명하고 현대적인 한국어로 나타내기 위해 ‘나에게’를 사용했습니다.
theological_decisions:
- issue: 예언적 전달 공식의 표현
  chosen_reading: ‘말씀이 ... 임하여 말씀하셨습니다’로 두 번의 동사를 살려, 하나님의 말씀이 도래하는 사건성과 그 말씀의 직접성을 함께 드러냈습니다.
  alternative_readings:
  - ‘말씀이 나에게 와서 이르렀습니다’
  - ‘말씀이 나에게 임하셨습니다’
  rationale: 히브리어 וַיְהִי ... דְּבַר־יְהוָה ... אֵלַי לֵאמֹר의 공식은 단순 정보 전달이 아니라 예언적 계시의 도래를 강조하므로, 한국어에서도 그 긴장을 유지하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 예언서 서문 공식 및 계시 전달의 직접성
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 신명기적 대체 표기가 아닌 Tetragrammaton을 직접 사용하므로, 프로젝트 표준에 따라 고유명으로 음역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
