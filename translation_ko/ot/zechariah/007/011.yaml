  lexicon: HALOT
  rationale: מאן은 단순한 미수용이 아니라 의지적 거부를 뜻하므로, 문맥상 대상이 되는 ‘듣기’를 함께 드러내어 자연스럽게 옮겼습니다.
- source_word: לְהַקְשִׁיב
  english_pob_choice: to pay attention
  chosen_korean: 듣기를
  alternatives_korean:
  - 주의를 기울이기를
  - 귀를 기울이기를
  - 주의 깊게 듣기를
  lexicon: HALOT
  rationale: קשב의 핵심은 단순 청취가 아니라 주의를 기울이는 행위이므로, 예언적 권면을 거절하는 문맥에 맞게 ‘듣기’로 풀었습니다.
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  english_pob_choice: turned a stubborn shoulder
  chosen_korean: 완고한 어깨를 돌렸으며
  alternatives_korean:
  - 반항하는 어깨를 내밀었으며
  - 완고한 어깨를 내어주었으며
  - 거역하는 어깨를 돌렸으며
  lexicon: HALOT
  rationale: 직역의 ‘어깨를 주다’는 한국어에서 어색하므로, 몸짓 이미지를 살리면서도 반항의 관용적 의미가 드러나도록 ‘어깨를 돌리다’로 옮겼습니다.
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ מִשְּׁמוֹעַ
  english_pob_choice: made their ears heavy so as not to hear
  chosen_korean: 듣지 않으려고 자기들의 귀를 무겁게 했습니다
  alternatives_korean:
  - 듣지 않으려고 귀를 둔하게 했습니다
  - 듣지 않으려고 귀를 막아 버렸습니다
  - 듣지 않으려고 귀를 무겁게 만들었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘귀를 무겁게 하다’라는 비유를 보존하되, 목적절을 자연스럽게 풀어 ‘듣지 않으려고’로 연결했습니다.
theological_decisions:
- issue: 반항과 무감각의 신체적 비유 보존
  chosen_reading: 추상적 ‘불순종’으로 평면화하지 않고, 어깨와 귀의 신체적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 그들은 완강히 듣지 않았습니다
  - 그들은 고집스럽게 거부했습니다
  rationale: 본문은 언약적 거역을 몸의 이미지로 강하게 표현하므로, 그 수사적 힘을 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 수사적 긴장 보존'
