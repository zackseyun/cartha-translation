base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
  footnotes:
  - marker: a
    text: Hebrew literally, 'gave a stubborn/rebellious shoulder,' an idiom for obstinate resistance.
    reason: lexical_alternative
  - marker: b
    text: Or 'made their ears dull' / 'stopped up their ears.' The Hebrew literally says 'made their ears heavy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 귀 기울이기를 거부하고, 완강히 어깨를 돌렸으며[a], 듣지 않으려고 귀를 무겁게 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘반역하는 어깨를 내주었다’고 말합니다. 이는 완강한 저항을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘귀를 둔하게 했다’ 또는 ‘귀를 막아 버렸다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘귀를 무겁게 했다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  english_pob_choice: they refused
  chosen_korean: 듣기를 거부하고
  alternatives_korean:
  - 거부하고
