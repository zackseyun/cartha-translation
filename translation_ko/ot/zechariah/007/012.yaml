id: ZEC.7.12
reference: Zechariah 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִבָּ֞/ם שָׂ֣מוּ שָׁמִ֗יר מִ֠/שְּׁמוֹעַ אֶת הַ/תּוֹרָ֤ה וְ/אֶת הַ/דְּבָרִים֙ אֲשֶׁ֨ר שָׁלַ֜ח יְהוָ֤ה צְבָאוֹת֙ בְּ/רוּח֔/וֹ בְּ/יַ֖ד הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֑ים וַֽ/יְהִי֙ קֶ֣צֶף גָּד֔וֹל מֵ/אֵ֖ת יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
  footnotes:
  - marker: a
    text: Hebrew שָׁמִיר denotes an extremely hard substance; traditionally 'adamant,' possibly 'flint.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the instruction' for 'the law.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 만군의 야훼께서[c] 그의 영으로 이전의 예언자들을 통하여 보내신 율법[b]과 말씀을 듣지 않으려고, 자기들의 마음을 아주 단단한 돌처럼 굳게 하였습니다.[a] 그러자 큰 진노가 만군의 야훼께로부터 임하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁמִיר는 매우 단단한 물질을 가리킵니다. 전통적으로 ‘아다만트’로 옮기며, ‘부싯돌’일 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 ‘교훈’ 또는 ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '전통 번역: ‘만군의 여호와’.'
    reason: previous_rendering
lexical_decisions:
- source_word: וְלִבָּם / שָׂמוּ שָׁמִיר
  english_pob_choice: They made their hearts like diamond-hard stone
  chosen_korean: 자기 마음을 다이아몬드처럼 단단한 돌로 만들어 버려
  alternatives_korean:
  - 자기 마음을 아주 단단한 돌처럼 만들어
  - 자기 마음을 부싯돌처럼 만들어 버려
  lexicon: HALOT
  rationale: לֵב/לֵבָב은 한국어에서 자연스럽게 ‘마음’으로 옮기고, שָׁמִיר의 극단적 경도는 현대적 표현인 ‘다이아몬드처럼 단단한 돌’로 살리되 완전한 광물 동일시는 피했습니다.
- source_word: מִשְּׁמוֹעַ אֶת הַתּוֹרָה וְאֶת הַדְּבָרִים
  english_pob_choice: so as not to hear the law and the words
  chosen_korean: 율법과 ... 말씀을 듣지 않게 하였습니다
  alternatives_korean:
  - 율법과 ... 말씀을 듣지 않으려고 했습니다
  - 율법과 ... 말씀을 들으려 하지 않게 하였습니다
  lexicon: HALOT
  rationale: מִן + 부정사 구조는 ‘듣지 않게/듣지 않으려고’의 목적·차단 의미이므로, 한국어에서는 결과를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로, צְבָאוֹת는 전통어 ‘만군’으로 옮겨 군사적·우주적 위엄을 함께 살렸습니다.
- source_word: בְּרוּחוֹ
  english_pob_choice: by his Spirit
  chosen_korean: 그의 영으로
  alternatives_korean:
  - 그의 성령으로
  - 그의 רוח으로
  lexicon: HALOT
  rationale: 문맥상 예언자들을 통해 말씀을 보내는 하나님의 내적 매개를 가리키므로 ‘영’이 가장 직접적입니다. 본절은 ‘성령’으로 단정하기보다 문맥에 맞는 중립적 표기를 택했습니다.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  english_pob_choice: through the former prophets
  chosen_korean: 그 이전 선지자들을 통해
  alternatives_korean:
  - 초기의 선지자들을 통해
  - 옛 선지자들을 통해
  lexicon: HALOT
  rationale: בְּיַד는 매개·수단을 뜻하므로 ‘통해’로 자연스럽게 옮겼고, הָרִאשֹׁנִים은 기술적 정경 용어보다 시간적 선후를 드러내는 ‘그 이전’으로 처리했습니다.
- source_word: וַיְהִי קֶצֶף גָּדוֹל מֵאֵת יְהוָה צְבָאוֹת
  english_pob_choice: So great wrath came from Yahweh of Armies
  chosen_korean: 그래서 큰 진노가 만군의 야훼께로부터 임하였습니다
  alternatives_korean:
  - 그러므로 큰 진노가 ... 임하였습니다
  - 큰 진노가 ... 오게 되었습니다
  lexicon: HALOT
  rationale: קֶצֶף는 단순한 분노보다 하나님의 심판적 ‘진노’가 적절하고, וַיְהִי의 사건성을 살려 ‘임하였습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 구절은 명시적으로 יהוה를 사용하므로, 프로젝트 기본값에 따라 언약적 신명을 ‘야훼’로 반영했습니다. 이는 전통적 대체어보다 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: רוּחֹו의 의미 범위
  chosen_reading: 그의 영
  alternative_readings:
  - 그의 성령
  - 그의 바람
  rationale: 예언자들을 통해 말씀을 보내는 매개로서 하나님의 영적 주체성이 보이지만, 본문 자체가 삼위일체 교리 용어를 명시하지는 않으므로 ‘영’으로 번역해 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
