revisions:
- from: 그들은 자기 마음을 다이아몬드처럼 단단한 돌로 만들어 버려, 율법과 만군의 야훼께서 그 이전 선지자들을 통해 그의 영으로 보내신 말씀을 듣지 않게 하였습니다. 그래서 큰 진노가 만군의 야훼께로부터 임하였습니다.[a][b][c]
  to: 그들은 만군의 야훼께서[c] 그의 영으로 이전의 예언자들을 통하여 보내신 율법[b]과 말씀을 듣지 않으려고, 자기들의 마음을 아주 단단한 돌처럼 굳게 하였습니다.[a] 그러자 큰 진노가 만군의 야훼께로부터 임하였습니다.
  rationale: 수정문은 마음을 굳게 한 목적이 율법과 예언자들을 통하여 전해진 말씀을 듣지 않으려는 데 있음을 분명히 하였습니다. ‘아주 단단한 돌’은 שָׁמִיר의 불확실한 광물 식별을 본문에서 단정하지 않으면서 비유의 강도를 유지합니다. 신명, 영, 진노 및 예언자라는 핵심 용어는 초안의 원문 충실한 선택을 유지했고, 각주 표지와 전통 번역 주석을 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:27Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기 마음을 … 만들어 버려, … 듣지 않게 하였습니다’는 원문의 목적 관계를 다소 불분명하게 만들며, ‘그 이전 선지자들’도 자연스럽지 않습니다. 또한 관계절이 ‘말씀’에만 걸리는 듯한 배열보다, 야훼께서 보내신 ‘율법과 말씀’ 모두를 명확히 수식하도록 하는 편이 원문에 더 충실합니다.
  naturalness: ‘마음을 아주 단단한 돌처럼 굳게 하였습니다’와 ‘이전의 예언자들을 통하여’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다. 각주 표지도 해당 어휘 바로 뒤에 배치하는 것이 독해와 주석 연결에 적절합니다.
  terminology: ‘만군의 야훼’, ‘율법’, ‘그의 영’, ‘진노’는 원문 및 프로젝트의 선택을 무리 없이 반영합니다. שָׁמִיר의 광물 식별이 불확실하므로 본문에서는 일반적인 ‘아주 단단한 돌’을 사용하고 각주에 대안을 보존합니다. 전통 번역 각주는 한국어 성서 관용에 맞추어 ‘만군의 여호와’로 바로잡습니다.
  issues:
  - severity: medium
    issue: 목적 관계와 행위 주체가 불명확함
    rationale: ‘마음을 … 만들어 버려, … 듣지 않게 하였습니다’는 누가 듣지 않게 했는지와 ‘듣지 않음’이 마음을 굳게 한 목적이라는 관계를 흐릴 수 있습니다. מִשְּׁמֹעַ의 회피 목적을 ‘듣지 않으려고’로 명시하는 것이 안전합니다.
  - severity: medium
