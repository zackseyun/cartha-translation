reference: Zechariah 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣סָעֲרֵ֗/ם עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/הָ/אָ֨רֶץ֙ נָשַׁ֣מָּה אַֽחֲרֵי/הֶ֔ם מֵֽ/עֹבֵ֖ר וּ/מִ/שָּׁ֑ב וַ/יָּשִׂ֥ימוּ אֶֽרֶץ חֶמְדָּ֖ה לְ/שַׁמָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
  footnotes:
  - marker: a
    text: Or 'I whirled them away among all the nations.' The Hebrew verb carries storm imagery, not merely ordinary scattering.
    reason: lexical_alternative
  - marker: b
    text: Or 'the desirable land' or 'the delightful land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 그들이 알지 못하던 모든 민족들 가운데에 회오리바람처럼 흩어 버렸고, 그 땅은 그들 뒤에 황폐하게 남아, 지나가는 자도 돌아오는 자도 없게 되었습니다[b]. 그래서 그들은 아름다운 땅을 황폐하게 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘아름다운 땅’이나 ‘즐거운 땅’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  english_pob_choice: I scattered them with a storm wind
  chosen_korean: 회오리바람처럼 흩어 버렸고
  alternatives_korean:
  - 흩어 버렸고
  - 폭풍처럼 몰아 흩어 버렸고
  - 회오리바람으로 휩쓸어 버렸고
  lexicon: HALOT
  rationale: סער의 폭풍 이미지를 살리기 위해 단순한 ‘흩다’보다 바람의 격렬함을 드러내는 표현을 택했습니다.
- source_word: עַל כָּל הַגּוֹיִם
  english_pob_choice: among all the nations
  chosen_korean: 모든 민족들 가운데에
  alternatives_korean:
  - 모든 나라들 가운데에
  - 모든 민족들 사이로
  - 모든 나라들 사이로
  lexicon: HALOT
  rationale: 분산의 결과를 자연스럽게 드러내기 위해 ‘가운데에’를 썼고, כאן의 הַגּוֹיִם은 문맥상 이방 민족들을 가리킵니다.
- source_word: מֵעֹבֵר וּמִשָּׁב
  english_pob_choice: with no one passing through or returning
  chosen_korean: 지나가는 자도 돌아오는 자도 없게
  alternatives_korean:
  - 지나가는 자도 돌아오는 자도 없게
  - 오가는 사람이 없게
  - 지나가는 이도 되돌아오는 이도 없게
  lexicon: HALOT
  rationale: 병렬 분사구의 부정을 한국어에서는 ‘~자도 ~자도 없게’로 옮겨, 왕래가 완전히 끊긴 상태를 분명히 했습니다.
- source_word: אֶרֶץ חֶמְדָּה
  english_pob_choice: the pleasant land
  chosen_korean: 아름다운 땅
  alternatives_korean:
  - 기쁨의 땅
  - 즐거운 땅
  - 아름답고 소중한 땅
  lexicon: HALOT
  rationale: חמדה의 긍정적 가치 판단을 살리면서도 한국어에서 가장 자연스럽게 읽히는 형용 표현을 선택했습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무지로
  - 폐허가 되게
  - 참담하게
  lexicon: HALOT
  rationale: 명사적 결과를 한국어 서술로 풀어, 앞의 ‘아름다운 땅’과 대비되는 ‘황폐’ 상태를 직접 드러냈습니다.
theological_decisions:
- issue: 하나님의 심판 주체성
  chosen_reading: 첫 절의 1인칭 동사는 하나님이 직접 그들을 흩으신 주체임을 그대로 드러내어 번역했습니다.
  alternative_readings:
  - ‘그들은 흩어졌다’와 같이 행위 주체를 약화하는 번역
  - 수동적으로만 처리하는 번역
  rationale: 히브리어의 1인칭 동사는 심판의 주체를 분명히 하므로, 이를 완화하지 않고 한국어에서도 직접 주어를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 땅을 황폐하게 만든 책임
  chosen_reading: 마지막 절의 복수 동사는 백성이 땅을 황폐하게 만든 결과를 강조하는 것으로 살렸습니다.
  alternative_readings:
  - ‘땅이 황폐되었다’로만 옮겨 행위 책임을 흐리는 번역
  rationale: 본문은 하나님의 심판과 백성의 행위 결과를 함께 말하므로, 최종 동사에서 인간 책임의 차원을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
