revisions:
- from: 내가 그들을 그들이 알지 못하던 모든 민족들 가운데에 회오리바람처럼 흩어 버렸고, 그 땅은 그들 뒤에 황폐하게 남아, 지나가는 자도 돌아오는 자도 없게 되었습니다[b]. 그래서 그들은 아름다운 땅을 황폐하게 만들었습니다.
  to: 내가 폭풍으로 그들을 그들이 알지 못하던 모든 민족들 가운데로 몰아 흩었습니다[a]. 그들이 떠난 뒤에는 그 땅이 황폐해졌으며, 지나가는 이도 돌아오는 이도 없었습니다. 그리하여 그들은 아름다운 땅[b]을 황폐한 땅으로 만들었습니다.
  rationale: 폭풍으로 몰아 흩으셨다는 동사의 생생한 이미지를 보존하고, 황폐의 시간적 결과와 왕래 단절을 자연스러운 합쇼체 서술로 정리했습니다. 마지막 구절은 땅의 긍정적 가치와 그 결과인 황폐를 대비시키되, 백성에게 귀속된 행위 책임을 유지했습니다. 각주 b의 중복을 제거하고, 폭풍 동사의 어휘적 대안을 위한 a 각주를 보완했습니다.
  reviewer_model: gpt-5.6-terra
