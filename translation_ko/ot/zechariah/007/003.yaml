revisions:
- from: 말하기를, 곧 만군의 야훼의 집에 있는 제사장들과 예언자들에게 말하기를, 「내가 다섯째 달에 울어야 합니까? 내가 여러 해 동안 해 온 것처럼 자제해야 합니까?」[a][b]
  to: 만군의 야훼[a]의 집에 속한 제사장들과 예언자들에게 이렇게 말하였습니다. “내가 여러 해 동안 해 온 것처럼, 다섯째 달에 울며 몸을 삼가야[b] 합니까?”
  rationale: 도입부를 현대 한국어 문장으로 정리하고, 애도와 의례적 삼감의 행위를 하나의 질문 안에 보존했습니다. ‘몸을 삼가며’는 금식으로 의미를 한정하지 않으면서도 한국어에서 이해 가능한 표현입니다. 주석 표지를 해당 어휘에 직접 연결하고 주석의 순서를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:06Z'
