  source_fidelity: 원문의 두 לֵאמֹר는 앞 절의 파견 행위에 이어지는 발화 도입이므로, 한국어에서는 ‘이렇게 말하였습니다’로 자연스럽게 연결할 수 있습니다. הִנָּזֵר는 금식으로 한정하지 않고 의례적으로 자신을 삼가거나 구별하는 행위를 가리키므로 ‘몸을 삼가며’로 옮겼습니다. 두 동사는 하나의 질문 안에서 함께 수식되므로 두 개의 독립 질문으로 나누지 않았습니다.
  naturalness: 초안의 ‘말하기를, 곧 … 말하기를’은 현대 한국어에서 중복되고 비문에 가깝습니다. 또한 ‘자제해야 합니까?’는 목적어 없이 다소 추상적입니다. 수정문은 표준어 합쇼체를 유지하면서 원문의 종속 관계와 질문의 흐름을 자연스럽게 나타냅니다.
  terminology: ‘제사장들’, ‘예언자들’, ‘만군의 야훼’는 적절합니다. ‘야훼’에는 전통적 표기에 관한 주석을, ‘몸을 삼가며’에는 הִנָּזֵר의 의미 범위에 관한 주석을 각각 직접 붙여 주석 표지와 내용을 일치시켰습니다.
