id: ZEC.7.3
reference: Zechariah 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ/אמֹ֗ר אֶל הַ/כֹּֽהֲנִים֙ אֲשֶׁר֙ לְ/בֵית יְהוָ֣ה צְבָא֔וֹת וְ/אֶל הַ/נְּבִיאִ֖ים לֵ/אמֹ֑ר הַֽ/אֶבְכֶּה֙ בַּ/חֹ֣דֶשׁ הַ/חֲמִשִׁ֔י הִנָּזֵ֕ר כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי זֶ֖ה כַּ/מֶּ֥ה שָׁנִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
  footnotes:
  - marker: a
    text: Or “separating myself”; the Hebrew term can denote ritual abstinence more broadly than fasting alone.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: “the LORD of Hosts.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 말하기를, 곧 만군의 야훼의 집에 있는 제사장들과 예언자들에게 말하기를, 「내가 다섯째 달에 울어야 합니까? 내가 여러 해 동안 해 온 것처럼 자제해야 합니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순한 금식보다 더 넓은 ‘몸을 삼가고 절제하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역은 “만군의 주” 또는 “만군의 여호와”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר / לֵאמֹר
  english_pob_choice: to say / saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 말하여
  - 이르기를
  lexicon: HALOT
  rationale: 본문의 두 번 반복되는 לֵאמֹר는 전달 내용을 여는 표지이므로, 한국어에서도 서술을 직접 이어 주는 관용적 표현으로 처리했습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 성직자들
  - 사제들
  lexicon: HALOT
  rationale: 성전 맥락의 공식 직분을 가리키므로 표준적인 ‘제사장들’이 가장 정확합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies / the LORD of Hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 본문의 신명 יהוה는 POB 기본 원칙에 따라 ‘야훼’로 옮기고, צְבָאוֹת는 전통적 ‘만군’으로 옮겨 군사적·우주적 권위를 함께 살렸습니다.
- source_word: הִנָּזֵר
  english_pob_choice: abstaining
  chosen_korean: 자제해야 합니까
  alternatives_korean:
  - 금식해야 합니까
  - 스스로 구별해야 합니까
  lexicon: HALOT
  rationale: 히필/니팔 계열의 이 동사는 단순 금식보다 더 넓게 ‘몸을 삼가다, 절제하다’는 뜻을 지닐 수 있어, 본문의 문의를 넓은 금욕 의미를 살려 번역했습니다.
theological_decisions:
- issue: 하나님 이름의 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: POB의 표준 원칙에 따라 여호와 대신 고유 신명인 ‘야훼’를 사용해 히브리어 원문의 직접성을 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: ‘울어야 합니까?’와 ‘자제해야 합니까?’의 병렬
  chosen_reading: 금식만으로 좁히지 않고, 울음과 절제의 병렬 질문으로 살렸습니다.
  alternative_readings:
  - 금식해야 합니까?
  - 슬퍼해야 합니까?
  rationale: 본문은 ‘다섯째 달’의 관행을 묻는 질문 속에서 애도와 절제의 행위를 함께 제기하므로, 한쪽을 단정적으로 좁히면 문맥의 긴장을 약화시킬 수 있습니다.
  doctrine_reference: Source-text semantic range of הִנָּזֵר and the lament/fasting context
