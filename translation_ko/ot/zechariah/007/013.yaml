  verdict: revise
  source_fidelity: 현 초안의 첫 절 ‘그들이 부르셨을 때’는 히브리어 קָרָא의 주어(단수, 야훼)를 복수 ‘그들’로 잘못 옮겼고, 높임 선어말어미도 복수 주어와 문법적으로 맞지 않습니다. 본문은 야훼께서 부르셨으나 그들이 듣지 않은 과거와, 그들이 부를 때 야훼께서 듣지 않으실 미래의 상응을 말합니다.
  naturalness: ‘내가 불러도 그들이 듣지 않았던 것처럼, 그들이 불러도 내가 듣지 않겠습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 반복과 대칭을 명료하게 드러냅니다.
  terminology: ‘만군의 야훼’는 יְהוָה צְבָאוֹת에 대한 프로젝트의 명명 원칙 및 영어 POB의 ‘Yahweh of Armies’와 부합합니다. ‘듣다’는 כאן의 שׁמע의 응답적 청종이라는 문맥적 의미를 과도하게 해석하지 않고 유지합니다.
  issues:
  - severity: high
    issue: 첫 절의 주어가 ‘그들이’로 되어 있습니다.
