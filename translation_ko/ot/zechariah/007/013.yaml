  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 불러도 그들이 듣지 않았던 것처럼, 그들이 불러도 내가 듣지 않겠습니다. 만군의 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘만군의 여호와’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָא / יִקְרְאוּ
  english_pob_choice: called / will call
  chosen_korean: 부르셨을 때 / 부를 것이나
  alternatives_korean:
  - 외쳤을 때 / 외칠 것이나
  - 호소하셨을 때 / 호소할 것이나
  lexicon: HALOT
  rationale: 영어 POB의 call 반복을 살려, 앞뒤의 대응 관계가 드러나도록 한국어도 같은 어근인 ‘부르다’를 반복했습니다.
- source_word: שָׁמֵעוּ / אֶשְׁמָע
  english_pob_choice: would not listen / will not listen
  chosen_korean: 듣지 않았던 / 듣지 않겠습니다
  alternatives_korean:
  - 귀 기울이지 않았던 / 귀 기울이지 않겠습니다
  - 들으려 하지 않았던 / 들으려 하지 않겠습니다
  lexicon: HALOT
  rationale: 여기서는 단순 청취가 아니라 응답적 청종의 거절이므로 ‘듣다’로 옮기되, 거절의 태도를 분명히 하기 위해 부정형을 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 고유명 יְהוָה는 프로젝트 기본어인 ‘야훼’로 옮기고, צְבָאוֹת은 전통적 ‘만군’이 한국어에서 이미 관용적으로 기능하므로 이를 결합했습니다.
theological_decisions:
- issue: 이사야적/예언적 보응 구조의 대칭성
  chosen_reading: 사람들이 듣지 않았던 것에 대한 대응으로, 하나님도 그들의 부르짖음에 응답하지 않으신다는 대칭을 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘응답하지 않겠습니다’로 완화하는 읽기
  - ‘외면하겠습니다’로 더 해석적으로 옮기는 읽기
  rationale: 본문은 단순 무반응이 아니라 언약적·심판적 보응을 말하므로, ‘듣지 않겠습니다’로 직역성을 유지해 경고의 무게를 보존했습니다.
  doctrine_reference: 예언서의 보응 원리와 심판 선언의 대칭 구조
- issue: בְּרֻבִּי/관용적 예언 종결 공식
  chosen_reading: ‘만군의 야훼께서 말씀하십니다’로 예언자적 선언 공식을 현대 합쇼체로 처리했습니다.
  alternative_readings:
  - ‘말씀하시나이다’ 같은 고어체
  - ‘말합니다’의 평서체
  rationale: 본문의 권위 있는 종결 공식을 유지하되, 한국어 लक्ष्य शैली에 맞는 현대적 합쇼체를 사용해 예언 발화의 엄중함을 살렸습니다.
  doctrine_reference: 예언문 종결 공식의 문체 재현
