  - severity: medium
    issue: ‘그들이 부르셨을 때’의 높임 표현이 문법적으로 부적절합니다.
    rationale: ‘부르셨다’의 높임은 야훼를 가리킬 수 있으나, 표면 주어 ‘그들이’와 충돌합니다. ‘내가 불러도’로 바꾸면 화자가 야훼임이 종결 선언을 통해 자연스럽게 드러납니다.
  revised_text: 내가 불러도 그들이 듣지 않았던 것처럼, 그들이 불러도 내가 듣지 않겠습니다. 만군의 야훼께서 말씀하십니다.[a]
