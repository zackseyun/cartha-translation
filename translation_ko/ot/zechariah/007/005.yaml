  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
  footnotes:
  - marker: a
    text: Or, 'was it for me—really for me—that you fasted?' The Hebrew uses an emphatic construction and ends with an independent 'I/me' for added stress.
    reason: lexical_alternative
translation:
  language: ko
  text: “그 땅의 모든 백성과 제사장들에게 말하여 이르십시오. 너희가 다섯째 달과 일곱째 달에, 이 칠십 년 동안 금식하고 애통했을 때, 그것이 정말 나를 위한 것이었느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정말 나를 위한 것이었느냐—정말 나를 위한 것이었느냐?”로도 옮길 수 있습니다. 히브리어는 강조형 구조를 사용하며, 끝에 독립된 ‘나/내가’를 두어 힘을 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 땅의 백성
  - 그 땅의 모든 사람들
  lexicon: HALOT
  rationale: 이 표현은 여기서 특정 계층명보다 땅의 주민 전체를 가리키므로, ‘백성’으로 옮기되 ‘모든’을 덧붙여 범위를 분명히 했습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제관들
  lexicon: HALOT
  rationale: כֹּהֵן의 표준 대응으로, 문맥상 별도의 변형 없이 ‘제사장들’이 가장 자연스럽습니다.
- source_word: וְסָפוֹד
  english_pob_choice: and mourned
  chosen_korean: 애통했을 때
  alternatives_korean:
  - 슬퍼했을 때
  - 애도했을 때
  - 통곡했을 때
  lexicon: HALOT
  rationale: ספד는 단순한 슬픔보다 장례적·의례적 애통을 포함하므로, 금식과 짝을 이루는 문맥에서 ‘애통하다’가 가장 적절합니다.
- source_word: הֲצוֹם צַמְתֻּנִי אָֽנִי
  english_pob_choice: was it really for me that you fasted
  chosen_korean: 그것이 정말 나를 위한 것이었느냐
  alternatives_korean:
  - 정말 나를 위해 금식한 것이었느냐
  - 나를 위한 금식이었느냐
  - 정말 나를 위한 금식이었느냐
  lexicon: HALOT
  rationale: 히브리어의 강조형 구조와 끝의 독립 인칭대명사 אָנִי의 압박을 살리기 위해, 단순 서술보다 ‘정말’과 ‘나를 위한’으로 강한 수사적 질문을 반영했습니다.
theological_decisions:
- issue: 금식의 평가 방식
  chosen_reading: 이 절은 금식 자체를 무효라고 선언하기보다, 그 금식이 वास्तवമായി 하나님을 향한 것이었는지를 따져 묻습니다.
  alternative_readings:
  - 금식 관습 전체를 거부하는 선언으로 읽을 수 있습니다.
  rationale: 질문형 강조를 그대로 살려, 본문이 드러내는 동기와 방향성의 문제를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 말고 보존한다.'
