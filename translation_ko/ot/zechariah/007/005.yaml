revisions:
- from: “그 땅의 모든 백성과 제사장들에게 말하여 이르십시오. 너희가 다섯째 달과 일곱째 달에, 이 칠십 년 동안 금식하고 애통했을 때, 그것이 정말 나를 위한 것이었느냐?”[a]
  to: “그 땅의 모든 백성과 제사장들에게 말하여 이르십시오. 너희가 다섯째 달과 일곱째 달에 이 칠십 년 동안 금식하고 애통하였을 때, 정녕 너희가 나를 위하여 금식한 것이냐, 바로 나를 위하여?”[a]
  rationale: 수사 질문 안에 ‘금식한 것’을 명시하고, ‘정녕’으로 금식 동사의 강조를, ‘바로 나를 위하여’로 문미 독립대명사의 강조를 반영했습니다. ‘이 칠십 년 동안’은 וְזֶה의 지시성을 유지하며, 본문은 금식의 동기를 묻는 질문으로만 옮겨 더 넓은 신학적 결론을 덧붙이지 않았습니다.
