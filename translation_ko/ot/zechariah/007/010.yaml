  source_fidelity: 본문의 취약 계층 목록과 두 금지 명령은 대체로 충실합니다. 그러나 תַחְשְׁבוּ는 단순히 악을 마음에 품는 것보다 악을 의도적으로 꾀하거나 도모하는 뜻이며, אִישׁ אָחִיו의 대상을 한국어에서 더 분명히 드러내는 편이 좋습니다.
  naturalness: 현재 문장은 ‘학대하지 말며’와 ‘말아야 합니다’를 한 문장에 결합하여 합쇼체 문체가 다소 불균형합니다. 두 명령을 ‘-하지 마십시오’로 맞추면 더 자연스럽고 현대적인 정중 문체가 됩니다.
  terminology: ‘과부’, ‘고아’, ‘나그네’, ‘가난한 이’는 문맥상 적절합니다. 다만 ‘나그네’가 일시적 여행자로 오해되지 않도록 주석에서 거주 외국인이라는 사회적 의미를 밝혀야 합니다. 현 주석 a에는 문맥과 무관한 히브리어 표기와 영어 번역어가 섞여 있어 수정이 필요합니다.
