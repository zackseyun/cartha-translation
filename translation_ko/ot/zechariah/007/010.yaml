revisions:
- from: 과부와 고아와 나그네와 가난한 이를 학대하지 말며, 서로에게 악을 마음에 품지 말아야 합니다.[a][b][c]
  to: 과부와 고아와 나그네와 가난한 이를 억누르지 마십시오.[c] 서로 해칠 악을 마음속으로 꾀하지도 마십시오.[a][b]
  rationale: 원문의 두 병렬 금지 명령을 정중한 합쇼체로 일관되게 옮겼습니다. תַעֲשֹׁקוּ에는 ‘억누르다’를 사용하여 부당한 압박·착취의 넓은 뜻을 살렸고, רָעַת ... תַּחְשְׁבוּ 및 אִישׁ אָחִיו는 ‘서로 해칠 악을 마음속으로 꾀하다’로 옮겨 계획성과 상호성을 보존했습니다. 모든 주석은 한국어 독자가 독립적으로 이해할 수 있도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:53Z'
