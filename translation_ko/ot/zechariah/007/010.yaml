id: ZEC.7.10
reference: Zechariah 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַלְמָנָ֧ה וְ/יָת֛וֹם גֵּ֥ר וְ/עָנִ֖י אַֽל תַּעֲשֹׁ֑קוּ וְ/רָעַת֙ אִ֣ישׁ אָחִ֔י/ו אַֽל תַּחְשְׁב֖וּ בִּ/לְבַבְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
  footnotes:
  - marker: a
    text: Literally, "each man the evil of his brother" or "a man against his brother."
    reason: lexical_alternative
  - marker: b
    text: '"Fatherless" may also be rendered "orphan."'
    reason: lexical_alternative
  - marker: c
    text: '"Sojourner" refers to a resident foreigner living among Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 과부와 고아와 나그네와 가난한 이를 억누르지 마십시오.[c] 서로 해칠 악을 마음속으로 꾀하지도 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고아’는 원문의 ‘아버지 없는 자’를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 이스라엘 가운데 거주하는 외국인, 곧 거주 외국인을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘억누르다’는 부당하게 압박하거나 착취하는 일을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  english_pob_choice: widow
  chosen_korean: 과부
  alternatives_korean:
  - 미망인
  lexicon: HALOT
  rationale: 여기서는 사회적 약자 목록의 첫 항목으로서 표준적이고 직접적인 대응이 적절합니다.
- source_word: יָתוֹם
  english_pob_choice: fatherless
  chosen_korean: 고아
  alternatives_korean:
  - 부친 없는 자
  lexicon: HALOT
  rationale: POB의 ‘fatherless’는 문자적으로는 ‘아버지가 없는 자’이지만, 한국어에서는 공동체적 보호가 필요한 취약 계층을 자연스럽게 드러내는 ‘고아’가 가장 읽기 쉽습니다.
- source_word: גֵּר
  english_pob_choice: sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 거주 외국인
  lexicon: HALOT
  rationale: 정착해 사는 이방인이라는 보호받아야 할 신분을 한국어 성서어휘로 가장 잘 드러내는 표현이 ‘나그네’입니다.
- source_word: עָנִי
  english_pob_choice: poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 사람
  - 궁핍한 사람
  lexicon: HALOT
  rationale: 경제적 취약성을 뜻하는 목록이므로, 형용사적 ‘가난한 이’가 문맥상 가장 자연스럽고 포괄적입니다.
- source_word: תַּעֲשֹׁקוּ
  english_pob_choice: oppress
  chosen_korean: 학대하지 말며
  alternatives_korean:
  - 억압하지 말며
  - 착취하지 말며
  lexicon: HALOT
  rationale: 이 동사는 약자를 부당하게 누르고 해치는 행위를 가리키므로, 경제적·법적 착취를 포함하는 넓은 의미의 ‘학대하다’가 적절합니다.
- source_word: רָעַת ... תַּחְשְׁבוּ
  english_pob_choice: devise evil
  chosen_korean: 악을 마음에 품지 말아야 합니다
  alternatives_korean:
  - 악을 꾀하지 말아야 합니다
  - 악을 계획하지 말아야 합니다
  lexicon: HALOT
  rationale: ‘생각하다’보다 의도적으로 도모한다는 뉘앙스를 살리되, 한국어에서는 ‘마음에 품다’가 내적 의도와 지속성을 함께 드러냅니다.
theological_decisions:
- issue: אִישׁ אָחִיו의 상호적 공동체 표현
  chosen_reading: 서로에게
  alternative_readings:
  - 형제에게
  - 각 사람이 자기 형제에게
  rationale: 히브리어는 남성 단수형이지만 실제 뜻은 공동체 안에서 서로를 향한 상호적 관계를 가리키므로, 한국어에서는 중립적인 ‘서로에게’가 의미를 가장 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
