source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
  footnotes:
  - marker: a
    text: Or, 'The fourth fast, the fifth fast, the seventh fast, and the tenth fast.' The Hebrew names the fasts by ordinal number, likely referring to months.
    reason: lexical_alternative
  - marker: b
    text: Or, 'shall be for the house of Judah.' The Hebrew verb is simply 'shall be'; 'shall become' brings out the contextual sense of transformation from fasting to celebration.
    reason: lexical_alternative
  - marker: c
    text: '''Appointed feasts'' translates a term often used for set times or festivals, especially sacred observances.'
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “넷째 달의 금식[a]과 다섯째 달의 금식과 일곱째 달의 금식과 열째 달의 금식은 유다 집에 기쁨과 즐거움과 좋은 절기들이 될 것입니다[b][c]. 진리와 평화를 사랑하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 금식을 서수로만 부르며, 아마도 달을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘될 것입니다’는 단순한 ‘있을 것입니다’보다 금식에서 기쁨으로 바뀌는 변화를 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘절기들’은 정해진 때나 축제, 특히 종교적 절기를 가리킬 수 있는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 POB 기준에 따라 고유명 야훼로 옮기고, צְבָאוֹת는 ‘만군의’로 받아 전통적 관용과 원문 호칭을 함께 살렸습니다.
- source_word: צ֣וֹם הָרְבִיעִי ... הָעֲשִׂירִי
  english_pob_choice: The fast of the fourth month ... the fast of the tenth
  chosen_korean: 넷째 달의 금식과 다섯째 달의 금식과 일곱째 달의 금식과 열째 달의 금식
  alternatives_korean:
  - 넷째 금식과 다섯째 금식과 일곱째 금식과 열째 금식
  lexicon: HALOT
  rationale: 히브리어는 각 항목마다 ‘금식’과 서수 표현을 반복하므로, 한국어도 달을 밝혀 반복 구조와 기념 금식의 관용을 분명하게 드러냈습니다.
- source_word: יִהְיֶה לְבֵית יְהוּדָה
  english_pob_choice: shall become for the house of Judah
  chosen_korean: 유다 집에 ... 될 것입니다
  alternatives_korean:
  - 유다 집을 위해 ... 될 것입니다
  - 유다 집에 ... 있게 될 것입니다
  lexicon: HALOT
  rationale: ‘집 of Judah’의 집합적·언약적 의미를 살려 ‘유다 집’으로 옮겼고, 동사는 POB의 변환 뉘앙스를 따라 ‘될 것입니다’로 풀었습니다.
- source_word: וּלְמֹעֲדִים טוֹבִים
  english_pob_choice: and good appointed feasts
  chosen_korean: 좋은 정한 절기
  alternatives_korean:
  - 좋은 지정된 절기
  - 좋은 명절
  lexicon: HALOT
  rationale: מוֹעֲדִים은 단순한 휴일보다 ‘정한 때/절기’의 뜻이 강하므로 ‘정한 절기’로 옮겨 예배적·달력적 의미를 살렸습니다.
theological_decisions:
- issue: 금식이 절기로 ‘변한다’는 표현의 강도
  chosen_reading: 금식이 유다 집에 기쁨과 즐거움과 좋은 정한 절기가 되는 변화로 옮겼습니다.
  alternative_readings:
  - 금식이 유다 집에 기쁨과 즐거움과 좋은 정한 절기일 것입니다
  - 금식이 폐지되고 절기로 대체됩니다
  rationale: 히브리어는 단순 서술형이지만 문맥상 기능의 변화를 말하므로, 너무 약한 ‘이다’도, 너무 강한 ‘폐지/대체’도 피하고 변환의 의미를 살렸습니다.
  doctrine_reference: 번역 원칙 1, 3, 6
- issue: 마지막 명령문의 담화 연결
  chosen_reading: ‘그러므로’로 앞선 약속과 뒤따르는 윤리적 요청의 연결을 드러냈습니다.
  alternative_readings:
  - 그리고 진리와 평화를 사랑하십시오
  - 그러나 진리와 평화를 사랑하십시오
  rationale: 히브리어는 접속사가 약하지만, 한국어에서는 약속에 대한 응답이라는 문맥적 흐름을 분명히 하는 것이 자연스러워 ‘그러므로’를 택했습니다.
  doctrine_reference: 번역 원칙 5, 6
