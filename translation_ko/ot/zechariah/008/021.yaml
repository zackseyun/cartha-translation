  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: ko
  text: 한 성읍의 주민들이 다른 성읍으로 가면서 서로 말할 것입니다. “어서 가서 야훼의 은혜를 구하고 만군의 야훼를 찾자.” “나도 함께 가겠습니다.”
  philosophy: formal
lexical_decisions:
- source_word: לֵאמֹר / saying
  english_pob_choice: saying
  chosen_korean: 서로 말할 것입니다
  alternatives_korean:
  - 말하며
  - 이르며
  lexicon: אמר
  rationale: 문장 안의 인용 도입을 자연스럽게 풀어 현대 한국어 문장 흐름으로 옮겼습니다.
- source_word: נֵלְכָה הָלוֹךְ
  english_pob_choice: Let us surely go
  chosen_korean: 어서 가서
  alternatives_korean:
  - 반드시 가자
  - 꼭 가자
  lexicon: הלך
  rationale: 반복형이 주는 강한 결심과 촉구를 과장 없이 살리기 위해, 즉시성을 강조하는 표현으로 옮겼습니다.
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  english_pob_choice: to entreat the favor of the LORD
  chosen_korean: 야훼의 은혜를 구하고
  alternatives_korean:
  - 야훼의 얼굴을 간구하고
  - 야훼의 은혜를 빌고
  lexicon: חלה + פנים
  rationale: 직역의 ‘얼굴’ 표현은 한국어에서 의미가 불투명하므로, 문맥상 청원·호의를 구하는 뜻을 드러내는 ‘은혜를 구하다’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: יהוה צבאות
  rationale: 본문의 호칭을 표준 프로젝트 용례에 따라 ‘야훼’로, צבאות는 군대의 총칭을 살린 ‘만군’으로 옮겼습니다.
theological_decisions:
- issue: YHWH 호칭 표기
  chosen_reading: 본문의 두 차례 YHWH는 모두 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙이 יהוה를 학술 전사인 ‘야훼’로 옮기도록 하며, 본문이 제의적 청원 맥락이라도 호칭 대체보다 원문 식별성을 우선했습니다.
  doctrine_reference: POB glossary / YHWH default
