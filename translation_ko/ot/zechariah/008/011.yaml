  - severity: low
    issue: נְאֻם의 선언 공식
    rationale: ‘말씀하십니다’도 가능하지만, נְאֻם은 일반 발화보다 엄숙한 신적 선언을 나타내므로 ‘선언하십니다’가 더 직접적입니다.
