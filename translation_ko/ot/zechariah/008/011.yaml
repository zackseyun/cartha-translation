source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, 'I will not deal with the remnant of this people as in the former days.' The Hebrew is elliptical, leaving the exact nuance implied by the context.
    reason: alternative_reading
  - marker: b
    text: 'Traditional rendering: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 나는 이 백성의 남은 자에게 이전 날들과 같이 하지 않겠습니다. 만군의 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서술어를 생략하여, 문맥에 따라 ‘대하다’, ‘행하다’, ‘되다’ 등으로 풀 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 앞절과의 대조를 분명히 드러내는 역접을 살리면서, 시점 전환도 함께 표현했습니다.
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  english_pob_choice: to the remnant of this people
  chosen_korean: 이 백성의 남은 자에게
  alternatives_korean:
  - 이 백성의 남은 자를 향해
  - 이 백성의 남은 자에게로
  lexicon: HALOT
  rationale: ל + היה의 관계를 한국어에서 자연스러운 여격으로 옮기되, 예언서의 핵심 용어인 ‘남은 자’를 유지했습니다.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  english_pob_choice: as in the former days
  chosen_korean: 이전 날들과 같이
  alternatives_korean:
  - 옛날들과 같이
  - 예전 날들과 같이
  lexicon: HALOT
  rationale: 비교 표지 כ의 의미를 살려 ‘-와 같이’로 옮기고, 의미는 ‘이전 날들’로 구체화했습니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 만군의 야훼께서 말씀하십니다
  alternatives_korean:
  - 만군의 야훼께서 선언하십니다
  - 야훼 만군의 하나님께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선언 공식을 현대 공용어체로 살리되, 표준 번역 관행 대신 본 프로젝트의 YHWH 대응어 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: לֹא כַיָּמִים הָרִאשֹׁנִים אֲנִי לִשְׁאֵרִית...의 생략된 서술어
  chosen_reading: ‘…같이 하지 않겠습니다’로 옮겨, 하나님이 어떻게 ‘되지 않을’ 것인지를 본문이 암시하는 범위 안에서만 풀었습니다.
  alternative_readings:
  - ‘…같지 않겠습니다’
  - ‘…대하지 않겠습니다’
  rationale: 히브리어는 명시적 서술을 생략하고 있어, 의미를 너무 좁히지 않으면서도 문맥상 바뀐 하나님의 처분을 드러내야 합니다. 과도한 해설을 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 본문의 함축을 유지하고 해소하지 않음
- issue: יהוה צְבָאוֹת의 호칭
  chosen_reading: ‘만군의 야훼’로 옮겨, 전통적 ‘만군의 주’ 대신 본문이 가진 신명 호칭과 군사적 위상을 드러냈습니다.
  alternative_readings:
  - ‘만군의 주’
  - ‘만군의 여호와’
  rationale: 프로젝트 기본어에 따라 YHWH를 ‘야훼’로 일관되게 옮기고, צְבָאוֹת는 ‘만군’으로 한국어 성경에서 익숙한 전승 의미를 살렸습니다.
  doctrine_reference: YHWH 표기 원칙
