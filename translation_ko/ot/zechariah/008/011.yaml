  source_fidelity: 히브리어는 ‘나는 이 백성의 남은 자에게 이전 날들과 같지 않을 것이다’라는 비교 구문에서 서술 내용을 의도적으로 생략합니다. 초안의 ‘같이 하지 않겠습니다’는 ‘행하다’라는 동작을 보충하여 생략의 범위를 다소 좁힙니다.
  naturalness: ‘이전 날들과 같이 하지 않겠습니다’는 한국어로 이해되지만 무엇을 ‘하지’ 않는지 목적어가 없어 다소 부자연스럽습니다. ‘이전 날들과 같지 않을 것입니다’는 현대 표준어 합쇼체로 자연스러우면서 원문의 압축성을 유지합니다.
  terminology: ‘이 백성의 남은 자’, ‘만군의 야훼’는 원문의 집합명사와 신명 및 צבאות의 의미를 적절히 반영합니다. נְאֻם의 예언자적 선언 공식은 ‘선언하십니다’로 옮기는 편이 ‘말씀하십니다’보다 가깝습니다.
