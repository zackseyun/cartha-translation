  source_fidelity: 마지막 절의 וַאֲשַׁלַּח ... אִישׁ בְּרֵעֵהוּ는 하나님이 각 사람을 그의 이웃에게 맞서도록 내보내신/맞서게 하신다는 뜻입니다. 초안의 ‘이웃을 치게 했습니다’는 원문에 없는 물리적 폭력의 뜻을 더하므로 수정이 필요합니다. 또한 ‘그때’보다 ‘그 날들 이전’이 לִפְנֵי הַיָּמִים הָהֵם를 더 충실히 반영합니다.
  naturalness: ‘품삯’은 노동의 보수를 가리키는 현대 한국어로 자연스럽고, ‘각기 자기 이웃에게 맞서게 하였습니다’는 문어적 합쇼체에서 명료합니다. שָׁלוֹם은 이 문맥에서 ‘평안’으로 옮기고 각주로 안전·안녕의 폭을 보완할 수 있습니다.
  terminology: אָדָם/בְּהֵמָה의 대조는 ‘사람’과 ‘짐승’으로 유지했습니다. צָר는 인격적 적대자를 가리킬 수 있으므로 ‘대적’으로 유지했습니다. ‘평안’은 특정 교파적 용례가 강한 ‘평강’보다 현대 공용 한국어에서 더 자연스럽습니다.
