source:
  edition: WLC
  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
  footnotes:
  - marker: a
    text: Or 'there was no safety/well-being'; Hebrew shalom can include peace, safety, and welfare.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of the enemy' or 'from the foe'; the Hebrew term can denote an adversary in a hostile sense.
    reason: lexical_alternative
  - marker: c
    text: Literally 'I sent every man, each against his neighbor'; the sense is that God gave them over to mutual hostility.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이전에는 사람의 삯도 없고 짐승의 삯도 없었으며, 나가는 자와 들어오는 자에게는 대적 때문에 평강이 없었고, 내가 모든 사람을 각기 그의 이웃을 치게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안전/안녕이 없었다’라는 뜻일 수 있습니다. 히브리어 שָׁלוֹם은 평강, 안전, 복리를 함께 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘원수 때문에’, ‘적에게서’로도 옮길 수 있습니다. 히브리어는 적대적 의미의 대적을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘내가 모든 사람을, 각기 그의 이웃을 향하게 보냈다’는 뜻입니다. 곧 하나님이 그들을 서로 적대하게 두셨다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂכַר הָאָדָם / שְׂכַר הַבְּהֵמָה
  english_pob_choice: wage for man / no wage for beast
  chosen_korean: 사람의 삯 / 짐승의 삯
  alternatives_korean:
  - 사람의 품삯 / 짐승의 품삯
  - 인간의 삯 / 가축의 삯
  lexicon: HALOT
  rationale: שׂכר는 ‘삯, 품삯, 임금’의 뜻이므로, 현대 한국어에서는 ‘삯’이 가장 간결하고 원문의 경제적 뉘앙스를 잘 살립니다. 사람과 짐승의 병렬도 그대로 유지했습니다.
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  english_pob_choice: before those days
  chosen_korean: 그때 이전에는
  alternatives_korean:
  - 그 날들 이전에는
  - 그런 날들 이전에는
  lexicon: HALOT
  rationale: 직역형 ‘그 날들 이전에는’도 가능하지만, 한국어 문맥에서는 ‘그때 이전에는’이 더 자연스럽고, 앞뒤 대비를 분명하게 드러냅니다.
- source_word: אֵין שָׁלוֹם
  english_pob_choice: there was no peace
  chosen_korean: 평강이 없었고
  alternatives_korean:
  - 평화가 없었고
  - 안전이 없었고
  - 복리가 없었고
  lexicon: HALOT
  rationale: שָׁלוֹם은 평화, 안전, 안녕을 포괄하지만, 본문에서는 불안정과 위협의 부재를 함께 드러내므로 기본 번역은 ‘평강’으로 두고, 그 넓은 의미는 각주로 보완했습니다.
- source_word: מִן הַצָּר
  english_pob_choice: because of the adversary
  chosen_korean: 대적 때문에
  alternatives_korean:
  - 원수 때문에
  - 적 때문에
  - 원수로 말미암아
  lexicon: HALOT
  rationale: צָר는 ‘대적, 원수, 적대자’의 의미를 가질 수 있어, POB의 해석을 따라 개인적 적대의 뉘앙스를 살린 ‘대적’으로 옮겼습니다.
- source_word: וַאֲשַׁלַּח אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  english_pob_choice: and I set every man against his neighbor
  chosen_korean: 내가 모든 사람을 각기 그의 이웃을 치게 했습니다
  alternatives_korean:
  - 내가 모든 사람을 각기 그의 이웃과 대립하게 했습니다
  - 내가 모든 사람을 서로의 이웃을 치게 했습니다
  lexicon: HALOT
  rationale: אֲשַׁלַּח은 문자적으로 ‘보내다’이지만, כאן에서는 상호 적대의 상태를 야기하는 사역적 의미이므로 ‘치게 했습니다’로 옮겨 하나님이 분열을 일으키신다는 문법적·신학적 긴장을 유지했습니다.
theological_decisions:
- issue: 하나님의 직접적 원인 제시와 인간 상호 적대의 긴장
  chosen_reading: 내가 모든 사람을 각기 그의 이웃을 치게 했습니다
  alternative_readings:
  - 내가 모든 사람을 각기 그의 이웃과 다투게 했습니다
  - 내가 모든 사람을 서로 적대하게 했습니다
  rationale: 히브리어는 사회적 혼란의 결과를 하나님 자신의 행위로 돌립니다. 번역에서 이를 완화하지 않고 그대로 드러내어, 본문이 가진 심판적·주권적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
