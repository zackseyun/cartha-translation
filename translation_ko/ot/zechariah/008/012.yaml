  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי זֶ֣רַע הַ/שָּׁל֗וֹם הַ/גֶּ֜פֶן תִּתֵּ֤ן פִּרְיָ/הּ֙ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן אֶת יְבוּלָ֔/הּ וְ/הַ/שָּׁמַ֖יִם יִתְּנ֣וּ טַלָּ֑/ם וְ/הִנְחַלְתִּ֗י אֶת שְׁאֵרִ֛ית הָ/עָ֥ם הַ/זֶּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
  footnotes:
  - marker: a
    text: Or 'there will be prosperous seed,' 'the sowing will be peaceful,' or 'the seed of well-being.' The Hebrew phrase is compact and may summarize the whole scene of restored agricultural blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 평화의 씨앗이 될 것입니다. 포도나무는 열매를 맺을 것이며, 땅은 소출을 내고, 하늘들은 이슬을 내릴 것이며, 나는 이 백성의 남은 자가 이 모든 것을 상속받게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평화의 씨앗’은 히브리어의 압축된 표현을 살린 번역입니다. 문맥상 ‘번영의 씨앗’, ‘평안한 파종’처럼 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי זֶרַע הַשָּׁלוֹם
  english_pob_choice: the seed of peace
  chosen_korean: 평화의 씨앗
  alternatives_korean:
  - 평화의 씨
  - 평화의 소출
  - 평온의 씨앗
  lexicon: HALOT
  rationale: זֶרַע는 문자적으로 ‘씨/씨앗’이지만, 문맥상 농경적 번영을 가리키는 압축 표현이므로 ‘씨앗’으로 살리되, שָׁלוֹם의 의미를 ‘평화’로 옮겨 본문의 결속을 유지했습니다.
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  english_pob_choice: the vine will give its fruit
  chosen_korean: 포도나무는 열매를 맺을 것이며
  alternatives_korean:
  - 포도나무는 열매를 낼 것이며
  - 포도나무는 그 열매를 줄 것이며
  lexicon: HALOT
  rationale: נתן의 반복을 자연스러운 한국어로 옮기기 위해 직역적 ‘줄 것이다’보다 ‘열매를 맺다’를 택했지만, 농업적 풍요의 약속이라는 핵심은 보존했습니다.
- source_word: יְבוּל
  english_pob_choice: produce
  chosen_korean: 소출
  alternatives_korean:
  - 산출
  - 수확
  - 생산물
  lexicon: HALOT
  rationale: יְבוּל은 땅이 산출하는 농업적 결과를 가리키므로, 현대어로도 농경적 뉘앙스가 살아 있는 ‘소출’이 적절합니다.
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  english_pob_choice: the heavens will give their dew
  chosen_korean: 하늘들은 이슬을 내릴 것이며
  alternatives_korean:
  - 하늘들은 그 이슬을 줄 것이며
  - 하늘은 이슬을 내릴 것이며
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘하늘들’을 살리면서, 반복되는 נתן을 한국어에서 자연스럽게 표현하기 위해 ‘이슬을 내리다’로 옮겼습니다.
- source_word: וְהִנְחַלְתִּי אֶת שְׁאֵרִית הָעָם הַזֶּה אֶת כָּל אֵלֶּה
  english_pob_choice: and I will cause the remnant of this people to inherit all these things
  chosen_korean: 나는 이 백성의 남은 자가 이 모든 것을 상속받게 하겠습니다
  alternatives_korean:
  - 나는 이 백성의 남은 자에게 이 모든 것을 주겠습니다
  - 나는 이 백성의 남은 자가 이 모든 것을 차지하게 하겠습니다
  lexicon: HALOT
  rationale: הִנְחִיל의 사역적 ‘상속하게 하다’라는 의미를 살려, 언약적 선물과 소유의 뉘앙스를 담는 ‘상속받게 하다’를 선택했습니다.
theological_decisions:
- issue: שָׁלוֹם의 의미를 ‘평화’로 유지할지, ‘번영/평안’으로 풀지 여부
  chosen_reading: 본문은 ‘평화의 씨앗’으로 유지해 평화와 번영, 온전함의 폭넓은 의미를 함께 열어 둡니다.
  alternative_readings:
  - 번영의 씨앗
  - 평안의 씨앗
  - 평화로운 파종
  rationale: 문맥은 농경적 복을 말하지만, שָׁלוֹם은 단순 경제 번영으로 환원되지 않습니다. ‘평화’로 유지하면 본문의 신학적 깊이를 덜어내지 않고 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: הִנְחַלְתִּי의 상속 언어를 단순 수여로 완화할지 여부
  chosen_reading: ‘상속받게 하겠습니다’로 옮겨 언약적 유업 언어를 유지했습니다.
  alternative_readings:
  - 주겠습니다
  - 소유하게 하겠습니다
  rationale: 이 동사는 단순 지급보다 상속과 유업의 뉘앙스를 담으므로, 남은 자에게 주어지는 하나님의 언약적 선물을 드러내기 위해 상속 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
