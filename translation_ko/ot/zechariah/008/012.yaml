  source_fidelity: 본문은 농경적 복을 열거하고, 마지막에 하나님께서 이 백성의 남은 자에게 그 모든 복을 유업으로 얻게 하신다는 뜻을 충실히 전달합니다. 다만 הַשָּׁמַיִם의 히브리어 복수형을 한국어에서 기계적으로 ‘하늘들’로 옮기면 자연스럽지 않으므로 관용적인 단수 ‘하늘’이 적절합니다. 또한 ‘평화의 씨앗이 될 것입니다’보다 존재를 나타내는 표현이 압축된 히브리어 구문 및 영어 감사본의 ‘there will be’에 더 잘 맞습니다.
  naturalness: ‘하늘들은’은 현대 표준 한국어 성경 문체에서 부자연스럽습니다. ‘하늘은 이슬을 내릴 것이며’가 자연스럽고 의미 손실도 없습니다. 각주 표지는 설명 대상인 ‘평화의 씨앗’ 바로 뒤에 두는 것이 표지의 범위를 분명히 합니다.
  terminology: ‘소출’, ‘남은 자’, ‘상속받게 하겠습니다’는 문맥과 합쇼체에 적절합니다. ‘평화의 씨앗’은 שָׁלוֹם의 평화·평안·번영의 폭넓은 뜻을 본문에서 보존하며, 농경적 관용 표현일 수 있다는 점은 각주로 보완합니다.
