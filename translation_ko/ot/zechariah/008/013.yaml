revisions:
- from: 그리고 그것은 이렇게 될 것입니다. 너희가 열방 가운데서 저주가 되었던 것처럼 — 유다 집과 이스라엘 집아, — 내가 너희를 구원할 것이며, 너희는 복이 될 것입니다. 두려워하지 마십시오. 너희 손을 강하게 하십시오.[a][b][c]
  to: 그때에는 너희가 민족들 가운데서 저주가 되었던 것처럼[a], 유다 집과 이스라엘 집아, 내가 너희를 구원할 것이며[b], 너희는 복이 될 것입니다. 두려워하지 마십시오. 너희 손을 굳세게 하십시오.[c]
  rationale: 문장의 예언적 도입과 호격을 현대 표준 한국어 합쇼체에 맞게 다듬고, 마지막 명령문은 원문의 ‘손’ 심상을 보존하도록 수정했습니다. 또한 모든 각주 표지를 해당 어휘 바로 뒤에 배치하고, 저주 관련 각주의 의미를 원문의 저주 공식 용법에 맞게 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:55Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וְהָיָה의 예언적 결과 도입은 ‘그리고 그것은 이렇게 될 것입니다’보다 ‘그때에는 … 될 것입니다’로 자연스럽게 옮기는 편이 낫습니다. תֶּחֱזַקְנָה יְדֵיכֶם은 손의 강함이라는 관용적 심상을 유지하되 한국어 명령문으로 다듬을 필요가 있습니다.
  naturalness: 초안의 ‘유다 집과 이스라엘 집아’ 앞뒤 대시는 현대 한국어 문장부호 관행상 부자연스럽고, ‘그리고 그것은 이렇게 될 것입니다’의 지시어도 불필요하게 모호합니다. ‘손을 굳세게 하십시오’는 합쇼체를 유지하면서도 원문의 심상을 비교적 자연스럽게 전달합니다.
  terminology: ‘유다 집과 이스라엘 집’, ‘구원’, ‘복’은 원문의 공동체적 표현과 신학적으로 넓은 의미를 적절히 보존합니다. גּוֹיִם은 현대 표준어에 맞춰 ‘민족들’로 옮겼습니다. 각주 a는 ‘저주받는 대상’보다 원문의 용법에 가까운 ‘저주의 대상’으로 바로잡았습니다.
  issues:
  - severity: medium
    issue: 각주 표지가 해당 본문의 어휘에 연결되어 있지 않습니다.
    rationale: a는 ‘저주’, b는 ‘구원할’, c는 ‘손을 굳세게’에 각각 붙어야 합니다. 초안은 세 표지를 문장 끝에 함께 배치하여 영어 감사 기록의 주석 범위와 원문의 어휘 대응을 흐립니다.
  - severity: medium
    issue: ‘그리고 그것은 이렇게 될 것입니다’와 대시로 둘러싼 호격 표현이 어색합니다.
    rationale: 예언적 도입부의 의미는 유지되지만 ‘그때에는’이 한국어에서 더 자연스럽고, 호격은 쉼표로 문장 안에 매끄럽게 처리할 수 있습니다.
  - severity: low
    issue: 각주 a의 ‘저주받는 대상’은 ‘object of cursing’보다 의미가 좁고 수동적입니다.
    rationale: 문맥은 민족들이 저주 공식에서 그 이름을 사용하는 상태를 가리키므로 ‘저주의 대상’ 및 이름이 저주문에 쓰인다는 설명이 더 정확합니다.
