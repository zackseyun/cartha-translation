id: ZEC.8.13
reference: Zechariah 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
  footnotes:
  - marker: a
    text: Or 'an object of cursing'—that is, a people whose name was used in curse formulas among the nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will deliver you.' The Hebrew verb can denote rescue or salvation in a broad sense.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'let your hands be strong,' a Hebrew idiom for courage and resolute action.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그것은 이렇게 될 것입니다. 너희가 열방 가운데서 저주가 되었던 것처럼 — 유다 집과 이스라엘 집아, — 내가 너희를 구원할 것이며, 너희는 복이 될 것입니다. 두려워하지 마십시오. 너희 손을 강하게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주받는 대상’입니다. 곧 열방 가운데서 저주 공식에 사용되던 사람들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 너희를 구출할 것이다’입니다. 히브리어 동사는 넓게는 구출과 구원을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘너희 손이 강해지게 하라’는 뜻으로, 용기와 단호한 행동을 가리키는 히브리 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall happen
  chosen_korean: 그리고 그것은 이렇게 될 것입니다
  alternatives_korean:
  - 그리고 그렇게 될 것입니다
  - 그리고 이루어질 것입니다
  - 그리고 그것은 일어날 것입니다
  lexicon: HALOT
  rationale: 미래의 결과 전환을 살리되, 현대 한국어에서 자연스럽고 예언체의 느낌을 유지하도록 옮겼습니다.
- source_word: קְלָלָה
  english_pob_choice: a curse
  chosen_korean: 저주
  alternatives_korean:
  - 저주의 대상
  - 저주받는 존재
  - 저주가 되는 존재
  lexicon: HALOT
  rationale: 열방 가운데서 ‘저주’로 불리는 상태를 직접적으로 반영하되, 과도한 풀어쓰기는 피했습니다.
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  english_pob_choice: O house of Judah and house of Israel
  chosen_korean: 유다 집과 이스라엘 집
  alternatives_korean:
  - 유다와 이스라엘
  - 유다 가문과 이스라엘 가문
  lexicon: HALOT
  rationale: ‘집’의 공동체적·언약적 표현을 살려 ‘집’으로 옮겼고, 원문의 병렬 구조도 유지했습니다.
- source_word: אוֹשִׁיעַ
  english_pob_choice: I will save you
  chosen_korean: 내가 너희를 구원할 것이며
  alternatives_korean:
  - 내가 너희를 구할 것이며
  - 내가 너희를 살릴 것이며
  - 내가 너희를 구출할 것이며
  lexicon: HALOT
  rationale: 히필 ישׁע의 넓은 뜻을 반영해 단순한 구조적 구출보다 구원으로 옮겼습니다.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  english_pob_choice: let your hands be strong
  chosen_korean: 너희 손을 강하게 하십시오
  alternatives_korean:
  - 너희 손이 강해지게 하십시오
  - 힘을 내십시오
  - 담대하십시오
  lexicon: HALOT
  rationale: 관용구의 문자적 이미지를 가능한 한 살리되, 한국어에서는 행동의 결단과 용기를 요구하는 표현으로 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘복이 될 것입니다’의 공동체적 정체성
  chosen_reading: 너희는 복이 될 것입니다
  alternative_readings:
  - 너희가 복을 받게 될 것입니다
  - 너희는 복의 통로가 될 것입니다
  rationale: 원문은 공동체가 ‘복’ 자체가 되는 역전을 말하므로, 단순한 복 수혜보다 정체성 전환을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 명령문의 어조
  chosen_reading: 두려워하지 마십시오. 너희 손을 강하게 하십시오.
  alternative_readings:
  - 두려워하지 말라. 너희 손을 강하게 하라
  - 두려워하지 마십시오. 담대하십시오
  rationale: 예언적 권면의 직접성을 유지하면서 현대 표준어 합쇼체로 통일했습니다. 후반부는 히브리 관용구를 따라 직역형으로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
