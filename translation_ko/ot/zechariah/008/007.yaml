  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י מוֹשִׁ֛יעַ אֶת עַמִּ֖/י מֵ/אֶ֣רֶץ מִזְרָ֑ח וּ/מֵ/אֶ֖רֶץ מְב֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
  footnotes:
  - marker: a
    text: Or 'I will save my people.' The Hebrew participle can express imminent or certain future action in prophetic speech.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the land of the east and from the land of the setting of the sun,' a merism for places far east and far west.
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 「보라, 나는 내 백성을 동방 땅과 해지는 땅에서 구원하겠습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘동쪽 땅과 해지는 땅’입니다. 동서의 전범위를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  english_pob_choice: Thus says Yahweh of hosts
  chosen_korean: 만군의 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼 만군의 하나님께서 이렇게 말씀하십니다
  - 만군의 여호와께서 이렇게 말씀하십니다
  lexicon: WLC; project glossary
  rationale: 예언자적 선포 공식이므로 ‘이렇게 말씀하십니다’로 자연스럽게 옮기고, יְהוָה צְבָאוֹת은 프로젝트 기본값에 따라 ‘만군의 야훼’로 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 여기 내가
  lexicon: HALOT
  rationale: 하나님의 임박하고 단호한 자기선언을 드러내는 감탄사로 ‘보라’가 가장 직접적입니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: I will save
  chosen_korean: 구원하겠습니다
  alternatives_korean:
  - 구원할 것입니다
  - 구해내겠습니다
  lexicon: HALOT
  rationale: 히브리어 분사는 예언적 문맥에서 확정적 미래를 나타낼 수 있으므로, 완결된 미래형으로 하나님의 선언을 분명히 살렸습니다.
- source_word: מֵאֶרֶץ מִזְרָח וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  english_pob_choice: from the land of the east and from the land of the setting of the sun
  chosen_korean: 동방 땅과 해지는 땅에서
  alternatives_korean:
  - 동쪽 땅과 서쪽 땅에서
  - 해 뜨는 땅과 해지는 땅에서
  lexicon: HALOT
  rationale: 동서 전체를 가리키는 мерism을 살리되, 한국어에서 예언적·시적 어감을 유지하는 ‘동방 땅 / 해지는 땅’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 분사 מוֹשִׁיעַ의 시제/양상
  chosen_reading: ‘구원하겠습니다’로 미래 선언을 분명히 표현했습니다.
  alternative_readings:
  - ‘구원하고 있습니다’
  - ‘구원할 참입니다’
  rationale: 하나님의 확정된 약속이라는 문맥이므로 현재진행형보다 한국어 미래형이 본문의 기능을 더 분명히 전달합니다.
  doctrine_reference: 예언적 선언의 확정성; 히브리어 분사의 미래적 용법
