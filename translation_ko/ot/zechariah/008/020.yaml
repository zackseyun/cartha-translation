  naturalness: A complete formal-polite Korean sentence is needed. '앞으로도 ... 올 것입니다' naturally conveys עוֹד with the future sense of יָבֹאוּ and avoids the dangling comma before a closed quotation mark.
  terminology: '''만군의 야훼'' appropriately follows the project rendering of יהוה and is established Korean biblical terminology for the title. ''여러 민족'' preserves the sense of peoples without unnecessarily imposing modern statehood; ''성읍'' is natural in a biblical register for cities.'
