  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת עֹ֚ד אֲשֶׁ֣ר יָבֹ֣אוּ עַמִּ֔ים וְ/יֹשְׁבֵ֖י עָרִ֥ים רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/020.yaml
  text: 'Thus says Yahweh of hosts: Yet peoples shall come[a], and the inhabitants of many cities,'
  footnotes:
  - marker: a
    text: Or 'nations' for 'peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “앞으로도 여러 민족[a]과 많은 성읍의 주민들이 올 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 나라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 인명성 있는 신명 יְהוָה 는 프로젝트 기준에 따라 ‘야훼’로 옮기고, צְבָאוֹת 는 관용적인 ‘만군의’로 처리해 예언 선포문의 제목을 자연스럽게 살렸습니다.
- source_word: עֹד
  english_pob_choice: Yet
  chosen_korean: 아직도
  alternatives_korean:
  - 여전히
  - 그리고도
  lexicon: HALOT
  rationale: 문맥상 이전 약속의 연속성과 아직 더 일어날 일을 나타내므로, 단순 접속보다 ‘아직도’가 미래 지향성을 분명히 드러냅니다.
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 여러 민족
  alternatives_korean:
  - 민족들
  - 백성들
  lexicon: HALOT
  rationale: 복수형 עַמִּים 는 단일한 정치 단위보다 다양한 민족 집단을 가리키므로, 영어 POB의 ‘peoples’에 맞춰 ‘여러 민족’으로 옮겼습니다.
- source_word: וְיֹשְׁבֵי עָרִים רַבּוֹת
  english_pob_choice: and the inhabitants of many cities
  chosen_korean: 많은 도시의 주민들
  alternatives_korean:
  - 많은 성읍의 거주자들
  - 수많은 도시들의 주민들
  lexicon: HALOT
  rationale: וְיֹשְׁבֵי 는 ‘~의 주민들/거주자들’이라는 소유구를 이루며, רַבּוֹת 는 ‘위대한’보다 수량의 ‘많은’이 자연스럽기 때문에 ‘많은 도시의 주민들’로 옮겼습니다.
theological_decisions:
- issue: 신명 יְהוָה 의 한국어 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 대체 호칭보다 음역 표기를 유지해 언약적 인칭성과 본문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
