  lexicon: זָמַם
  rationale: 단순한 생각이 아니라 의도적 결심을 나타내므로 ‘뜻하다’가 가장 압축적이고 문맥에 맞습니다.
- source_word: לְהֵיטִיב
  english_pob_choice: to do good
  chosen_korean: 선을 베풀기로
