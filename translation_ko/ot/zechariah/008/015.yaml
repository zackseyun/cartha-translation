  source_fidelity: ‘이 여러 날에’는 히브리어 בַּיָּמִים הָאֵלֶּה(‘이 날들에/이 시기에’)를 여러 날이라는 기간의 뜻으로 바꾸므로 수정이 필요합니다. ‘돌아와 … 뜻하였으니’는 שַׁבְתִּי זָמַמְתִּי의 완료된 전환과 결의를 대체로 보존합니다.
  naturalness: ‘이 여러 날에’는 현대 한국어에서 부자연스럽고 원문의 지시적 시간 표현에도 맞지 않습니다. ‘이 날들에’는 직역적이지만 예언서 문맥에서 자연스럽고 정확합니다.
  terminology: ‘예루살렘’, ‘유다의 집’, ‘선을 베풀다’, ‘두려워하지 마십시오’는 공적 합쇼체와 성서 문맥에 적절합니다. 신명이나 교리적 해석을 덧붙이지 않았습니다.
