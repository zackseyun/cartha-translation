  - 무서워하지 마십시오
  lexicon: ירא
  rationale: 예언적 위로/명령의 종결을 공적 문체로 살리기 위해 합쇼체 부정 명령을 사용했습니다.
theological_decisions:
- issue: 하나님의 자기 선언과 회복 약속의 어조
  chosen_reading: ‘내가 돌아와 … 선을 베풀기로 뜻하였으니’로, 하나님의 능동적 회복 의지를 분명히 드러냈습니다.
  alternative_readings:
  - ‘내가 돌아왔고 … 하려 한다’
  - ‘내가 다시 돌아와 … 좋게 하겠다’
  rationale: 본문은 단순한 과거 회상이 아니라, 예루살렘과 유다를 향한 하나님의 현재적 결의와 회복 선언입니다.
  doctrine_reference: 언약 신실성과 회복 약속(스가랴 8장 문맥)
