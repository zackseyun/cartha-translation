  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: ko
  text: 이제 내가 돌아와 이 여러 날에 예루살렘과 유다의 집에 선을 베풀기로 뜻하였으니, 두려워하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְתִּי
  english_pob_choice: I have returned
  chosen_korean: 내가 돌아와
  alternatives_korean:
  - 내가 돌아왔습니다
  - 내가 다시 돌아왔습니다
  lexicon: שׁוּב
  rationale: 완료된 돌아옴을 자연스럽게 살리되, 하나님의 화자라는 점을 드러내기 위해 ‘내가’를 두었습니다.
- source_word: זָמַמְתִּי
  english_pob_choice: purposed
  chosen_korean: 뜻하였으니
  alternatives_korean:
  - 계획하였으니
  - 마음먹었으니
  lexicon: זָמַם
  rationale: 단순한 생각이 아니라 의도적 결심을 나타내므로 ‘뜻하다’가 가장 압축적이고 문맥에 맞습니다.
- source_word: לְהֵיטִיב
  english_pob_choice: to do good
  chosen_korean: 선을 베풀기로
  alternatives_korean:
  - 좋게 하기로
  - 복되게 하기로
  lexicon: ייטב
  rationale: 히브리어의 ‘유익하게 하다/선하게 하다’를 한국어에서 가장 직접적으로 옮긴 표현입니다.
- source_word: אַל תִּירָאוּ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 마라
  - 무서워하지 마십시오
  lexicon: ירא
  rationale: 예언적 위로/명령의 종결을 공적 문체로 살리기 위해 합쇼체 부정 명령을 사용했습니다.
theological_decisions:
- issue: 하나님의 자기 선언과 회복 약속의 어조
  chosen_reading: ‘내가 돌아와 … 선을 베풀기로 뜻하였으니’로, 하나님의 능동적 회복 의지를 분명히 드러냈습니다.
  alternative_readings:
  - ‘내가 돌아왔고 … 하려 한다’
  - ‘내가 다시 돌아와 … 좋게 하겠다’
  rationale: 본문은 단순한 과거 회상이 아니라, 예루살렘과 유다를 향한 하나님의 현재적 결의와 회복 선언입니다.
  doctrine_reference: 언약 신실성과 회복 약속(스가랴 8장 문맥)
