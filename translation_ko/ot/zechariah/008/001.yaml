  text: 만군의 야훼의 말씀이 임했습니다. 야훼께서 말씀하시기를,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 이르러
  - 오셔서
  - 있었습니다
  lexicon: HALOT
  rationale: 예언 서문의 관용구로서 ‘말씀이 임하다’가 히브리어의 도래·발화 개시를 자연스럽게 옮기며, 단순한 발생 서술보다 계시의 도착성을 드러냅니다.
- source_word: דְּבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 선포
  lexicon: HALOT
  rationale: 예언 공식에서 하나님의 דְּבַר는 단순한 ‘말’보다 계시적·권위적 발화인 ‘말씀’이 한국어 성경 문맥을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문헌적·학술적 표기 원칙에 따라 신명사 יס를 ‘야훼’로 옮겨, 전통적 치환어가 아니라 고유한 신적 이름을 드러냅니다.
- source_word: צְבָאוֹת
  english_pob_choice: of hosts
  chosen_korean: 만군의
  alternatives_korean:
  - 군대의
  - 천상의 군대의
  - 만상의
  lexicon: HALOT
  rationale: ‘만군의’는 יְהוָה צְבָאוֹת의 관용적 한국어 대응으로, 하늘과 땅의 군세 위에 대한 통치라는 함의를 간결하게 보존합니다.
theological_decisions:
- issue: 히브리어 예언 공식의 문체 재현
  chosen_reading: ‘말씀이 임하여 말씀하셨습니다’로 예언적 발화의 도래와 발화를 함께 드러냈습니다.
  alternative_readings:
  - ‘말씀이 이르러’
  - ‘말씀이 와서’
  - ‘말씀이 임했습니다’
  rationale: 히브리어 הנוסח의 공식성을 살리되 한국어에서 어색한 직역을 피하기 위해, 도착(임함)과 발화(말씀하셨습니다)를 분리해 자연스럽게 재현했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
