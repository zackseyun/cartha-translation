source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֹתָ֔/ם וְ/שָׁכְנ֖וּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָיוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים בֶּ/אֱמֶ֖ת וּ/בִ/צְדָקָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
  footnotes:
  - marker: a
    text: Or 'within Jerusalem.' The Hebrew more literally says 'in the midst of Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: '''In truth'' may also be understood as ''faithfully'' or ''truly.'''
    reason: lexical_alternative
  - marker: c
    text: '''Righteousness'' may also be rendered ''justice'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 데려올 것이며, 그들은 예루살렘 한가운데에 살 것입니다.[a] 그들은 진실과 의 안에서 내 백성이 되고, 나는 그들의 하나님이 될 것입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예루살렘 한가운데’는 히브리어 표현을 가깝게 옮긴 것입니다. ‘예루살렘 안에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진실’은 ‘신실하게’ 또는 ‘참되게’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘의’는 이 문맥에서 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  english_pob_choice: I will bring
  chosen_korean: 내가 그들을 데려오고
  alternatives_korean:
  - 내가 그들을 데리고 오고
  - 내가 그들을 이끌어 오고
  - 내가 그들을 다시 데려오고
  lexicon: HALOT
  rationale: 히필 בוא의 ‘데려오다/가져오다’ 뜻을 살리되, 귀환 맥락을 과도하게 덧붙이지 않으면서 자연스러운 한국어 동사로 옮겼습니다.
- source_word: וְשָׁכְנוּ בְּתוֹךְ יְרוּשָׁלִָם
  english_pob_choice: they will dwell in the midst of Jerusalem
  chosen_korean: 예루살렘 한가운데에 살 것입니다
  alternatives_korean:
  - 예루살렘 가운데에 거할 것입니다
  - 예루살렘 안에 살 것입니다
  - 예루살렘 한가운데에서 살 것입니다
  lexicon: HALOT
  rationale: בְּתוֹךְ의 공간적 구체성을 살려 ‘한가운데’로 옮겼고, ‘거하다’보다 현대 독자에게 자연스러운 ‘살다’를 택했습니다.
- source_word: וְהָיוּ לִי לְעָם / וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  english_pob_choice: they will be my people, and I will be their God
  chosen_korean: 그들은 내 백성이 되고, 나는 그들의 하나님이 될 것입니다
  alternatives_korean:
  - 그들은 내 백성이 될 것이고, 나는 그들의 하나님이 될 것입니다
  - 그들은 내 백성이 되며, 나는 그들의 하나님이 되겠습니다
  lexicon: HALOT
  rationale: 표준적인 언약 공식 표현을 그대로 살려, 관계의 약속과 상호 귀속을 축약 없이 드러냈습니다.
- source_word: בֶּאֱמֶת וּבִצְדָקָה
  english_pob_choice: in truth and in righteousness
  chosen_korean: 진실과 의로 말입니다
  alternatives_korean:
  - 진리와 의로 말입니다
  - 진실함과 의로 말입니다
  - 참됨과 의로 말입니다
  lexicon: HALOT
  rationale: אֱמֶת은 ‘진실/참됨/성실’의 폭이 있지만, 문맥상 언약의 신실함을 포함하는 ‘진실’이 가장 무리 없고, צְדָקָה는 POB의 기본값에 따라 ‘의’로 옮겼습니다.
theological_decisions:
- issue: 언약 공식의 보존
  chosen_reading: ‘그들은 내 백성이 되고, 나는 그들의 하나님이 될 것입니다’라는 언약 공식을 유지했습니다.
  alternative_readings:
  - ‘그들은 나에게 속한 백성이 될 것입니다’처럼 관계 중심으로 풀어쓰기
  - ‘내가 그들의 하나님으로서 돌보겠습니다’처럼 설명적으로 번역
  rationale: 원문은 이스라엘 회복 약속에서 반복되는 정형화된 언약 문구이므로, 해설적으로 풀기보다 상호 언약 관계를 그대로 보존하는 편이 स्रोत의 연결성을 살립니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; covenant formula usage across the OT'
- issue: בֶּאֱמֶת וּבִצְדָקָה의 범위
  chosen_reading: 마지막 구를 하나님이 그들의 하나님이 되시는 방식에 붙이되, 한국어에서는 ‘진실과 의로 말입니다’라고 여운을 남겼습니다.
  alternative_readings:
  - ‘그들은 진실과 의 가운데 살 것입니다’로 공동체의 삶에만 연결
  - ‘나는 진실과 의로 그들의 하나님이 될 것입니다’로 하나님 쪽에만 연결
  rationale: 히브리어는 적용 범위를 완전히 닫지 않으므로, 한국어도 해석을 지나치게 단정하지 않고 관계 전체에 걸친 특성을 남겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
