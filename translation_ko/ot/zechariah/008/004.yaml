- from: 만군의 여호와께서 이렇게 말씀하십니다. 예루살렘의 거리들[a]에 다시 노인과 노파가 앉게 될 것이며, 각 사람은 자기 손에 지팡이를 쥐고 있을 것입니다. 이는 나이가 많아졌기 때문입니다.
  to: 만군의 야훼께서 이렇게 말씀하십니다. 예루살렘의 거리마다 다시 연로한 남자들과 연로한 여자들이 앉게 될 것이며, 각 사람은 나이가 매우 많아 자기 손에 지팡이를 들고 있을 것입니다.[a]
  rationale: 수정문은 원문의 예언 선포와 회복의 미래상을 보존하면서, 고령의 남녀를 현대적으로 중립적인 표현으로 옮겼습니다. 또한 고령 때문에 지팡이를 손에 든다는 인과 관계를 문장 안에서 명확히 했고, ‘야훼’로 신명을 영어 POB의 명시적 고유명 사용과 맞추었습니다. 각주 표지는 본문상 ‘거리마다’ 뒤에 유지하여 어휘 대안의 위치를 분명히 했습니다.
