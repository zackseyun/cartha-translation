language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
  footnotes:
  - marker: a
    text: Or "in the squares".
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 여호와께서 이렇게 말씀하십니다. 예루살렘의 거리들[a]에 다시 노인과 노파가 앉게 될 것이며, 각 사람은 자기 손에 지팡이를 쥐고 있을 것입니다. 이는 나이가 많아졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “광장들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식으로서의 엄숙함을 살리되, 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 여호와
  alternatives_korean:
  - 만군의 야훼
  - 여호와 만군의 주
  lexicon: HALOT
  rationale: צבאות는 관용적으로 '만군'으로 옮기고, 본문 전통에 따라 כינוי를 갖는 하나님의 호칭 전체를 하나의 고정 표현으로 처리했습니다.
- source_word: זְקֵנִים וּזְקֵנוֹת
  english_pob_choice: Old men and old women
  chosen_korean: 노인과 노파
  alternatives_korean:
  - 늙은 남자들과 늙은 여자들
  - 연로한 남자들과 연로한 여자들
  lexicon: HALOT
  rationale: 성별이 분명한 연령층 표현이므로 직역적으로 '노인과 노파'로 옮겨, 직분적 '장로들'로 오해되지 않게 했습니다.
- source_word: בִּרְחֹבוֹת
  english_pob_choice: in the streets
  chosen_korean: 거리들
  alternatives_korean:
  - 광장들
  - 넓은 공터들
  lexicon: HALOT
  rationale: רחובות은 도심의 열린 공적 공간을 가리킬 수 있으므로, 본문 흐름에 따라 '거리들'로 두고 영어 주석의 대안 의미는 각주로 보존했습니다.
- source_word: מִשְׁעַנְתּוֹ / בְּיָדוֹ
  english_pob_choice: his staff in his hand
  chosen_korean: 자기 손에 지팡이를 쥐고
  alternatives_korean:
  - 손에 지팡이를 쥐고
  - 그의 지팡이를 그의 손에 쥐고
  lexicon: HALOT
  rationale: 히브리어는 남성 3인칭 소유 접미사를 유지하므로 지팡이와 손의 소유 관계를 살리되, 한국어에서는 '자기 손에'로 자연스럽게 표현했습니다.
- source_word: מֵרֹב יָמִים
  english_pob_choice: because of great age
  chosen_korean: 나이가 많아졌기 때문입니다
  alternatives_korean:
  - 큰 연륜 때문입니다
  - 오랜 세월로 말미암기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 '날들의 많음'이지만, 관용적 의미는 고령이므로 현대 한국어에서 가장 분명한 '나이가 많아졌기 때문'으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 주어진 POB 영어 본문이 'Yahweh'를 사용하지 않지만, 한국어 본문에서는 프로젝트 기본값을 따라 여호와로 옮겨 신적 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
