  to: 각 사람은 자기 이웃에게 악을 마음속으로 꾀하지 말고, 거짓 맹세를 사랑하지 마십시오. 이는 내가 이 모든 것을 미워하기 때문입니다. 야훼의 말씀입니다.[a]
