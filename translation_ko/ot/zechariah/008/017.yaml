id: ZEC.8.17
reference: Zechariah 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'And each man, do not plot the evil of his neighbor in your hearts.' The Hebrew addresses the community in the plural while speaking distributively of each individual.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람마다 자기 이웃의 악을 마음속에서 도모하지 말고, 거짓 맹세를 사랑하지 마십시오. 이 모든 것은 내가 미워하는 것들입니다. 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람은 자기들의 마음에서 이웃의 악을 도모하지 말라.’ 히브리어는 복수로 공동체를 직접 부르면서도 각 개인을 분배적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: let no man
  chosen_korean: 사람마다
  alternatives_korean:
  - 각 사람은
  - 아무도
  lexicon: HALOT
  rationale: 히브리어 단수 אישׁ이 분배적으로 공동체 각 개인을 가리키므로, 한국어에서는 성별을 지나치게 드러내지 않으면서도 개인별 금지를 살리는 ‘사람마다’로 옮겼습니다.
- source_word: אֶת רָעַת רֵעֵהוּ
  english_pob_choice: evil ... against his neighbor
  chosen_korean: 자기 이웃의 악
  alternatives_korean:
  - 이웃에게 하는 악
  - 이웃을 향한 악
  lexicon: HALOT
  rationale: רָעָה는 단순한 나쁜 생각이 아니라 이웃에게 해가 되는 악을 뜻하므로, 문맥에 맞게 ‘자기 이웃의 악’으로 간결하게 살렸습니다.
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  english_pob_choice: devise ... in his heart
  chosen_korean: 마음속에서 도모하지 말고
  alternatives_korean:
  - 마음속에서 생각하지 말고
  - 마음속으로 꾀하지 말고
  lexicon: HALOT
  rationale: חשב는 여기서 단순한 ‘생각’보다 의도적 계획을 가리키므로, 악을 마음에 품고 꾸미는 뉘앙스를 살려 ‘도모하다’로 옮겼습니다.
- source_word: שְׁבֻעַת שֶׁקֶר
  english_pob_choice: a false oath
  chosen_korean: 거짓 맹세
  alternatives_korean:
  - 거짓된 맹세
  - 거짓 서약
  lexicon: HALOT
  rationale: 직역상 ‘거짓의 맹세’이지만, 한국어에서는 법적·윤리적 금지 항목으로 자연스러운 ‘거짓 맹세’가 원문의 뜻을 잘 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언문 종결 공식 נְאֻם은 단순 서술보다 권위 있는 선포를 나타내므로, 본문 어조를 살려 ‘야훼의 말씀입니다’로 번역했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 야훼를 사용하므로, 프로젝트 기본 원칙에 따라 전통적 대체어 대신 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
