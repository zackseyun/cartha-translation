id: ZEC.8.3
reference: Zechariah 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁ֚בְתִּי אֶל צִיּ֔וֹן וְ/שָׁכַנְתִּ֖י בְּ/ת֣וֹךְ יְרֽוּשָׁלִָ֑ם וְ/נִקְרְאָ֤ה יְרוּשָׁלִַ֨ם֙ עִ֣יר הָֽ/אֱמֶ֔ת וְ/הַר יְהוָ֥ה צְבָא֖וֹת הַ֥ר הַ/קֹּֽדֶשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
  footnotes:
  - marker: a
    text: Or 'the mountain of the LORD of Hosts.' The Hebrew title צְבָאוֹת is traditionally rendered 'Hosts'; 'Armies' makes the meaning more transparent in modern English.
    reason: lexical_alternative
  - marker: b
    text: '''City of Truth'' may also be understood as ''city of faithfulness,'' since the Hebrew אֱמֶת can denote truth, reliability, or faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「야훼께서 이렇게 말씀하십니다. 나는 시온으로 돌아왔고 예루살렘 한가운데에 거하겠습니다[a]. 예루살렘은 진리의 성읍이라 불리고, 야훼 만군의 산은 거룩한 산이라 불릴 것입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거하겠습니다’는 פעל이 아니라 예언적 약속의 미래 뉘앙스를 반영합니다.
    reason: theological_note
  - marker: b
    text: ‘만군’은 צְבָאוֹת의 전통적 대응이지만, 본문은 야훼의 권능과 군대적 지배를 함께 암시합니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 공식문을 현대 한국어에서 자연스럽고 엄정하게 옮기되, 신명은 프로젝트 기본값에 따라 야훼로 보존했습니다.
- source_word: שַׁבְתִּי ... וְשָׁכַנְתִּי
  english_pob_choice: I have returned ... and will dwell
  chosen_korean: 나는 시온으로 돌아왔고 ... 거하겠습니다
  alternatives_korean:
  - 나는 시온으로 돌아왔으며 ... 거하겠습니다
  - 나는 시온으로 돌아와 ... 거합니다
  lexicon: HALOT
  rationale: 완료형의 ‘돌아왔고’와 미래적 약속의 ‘거하겠습니다’를 구분해, 회복의 도래와 지속적 임재를 함께 살렸습니다.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  english_pob_choice: in the midst of Jerusalem
  chosen_korean: 예루살렘 한가운데에
  alternatives_korean:
  - 예루살렘 가운데에
  - 예루살렘 안에
  lexicon: HALOT
  rationale: בְּתוֹךְ의 중심적·임재적 뉘앙스를 단순한 ‘안에’보다 선명하게 드러내기 위해 ‘한가운데에’로 옮겼습니다.
- source_word: עִיר הָאֱמֶת
  english_pob_choice: the City of Truth
  chosen_korean: 진리의 성읍
  alternatives_korean:
  - 진실의 성읍
  - 신실함의 성읍
  - 참된 성읍
  lexicon: HALOT
  rationale: אֱמֶת의 핵심 의미를 가장 직접적으로 반영하는 ‘진리’를 택했으며, ‘성읍’은 예언 문맥의 도시 표상을 살리기 위한 번역입니다.
- source_word: הַר יְהוָה צְבָא֖וֹת
  english_pob_choice: the mountain of Yahweh of Armies
  chosen_korean: 야훼 만군의 산
  alternatives_korean:
  - 야훼 군대들의 산
  - 야훼 군대의 산
  - 야훼 만군의 산
  lexicon: HALOT
  rationale: צְבָאוֹת는 전통 교회어 ‘만군’이 본문의 군사적 다수성을 과도하게 완곡하지 않으면서도 한국어에서 익숙한 신명칭으로 기능하므로 이를 유지했습니다.
theological_decisions:
- issue: 야훼의 임재 표현과 장차의 약속의 긴장
  chosen_reading: ‘돌아왔고’와 ‘거하겠습니다’로 구분해, 회복의 시작과 지속적 임재의 약속을 함께 드러냈습니다.
  alternative_readings:
  - 모두 현재형으로 평평하게 처리
  - 모두 완료형으로 처리
  rationale: 본문은 귀환의 완료성과 거주의 भविष्य적 약속을 함께 지니므로, 두 시제를 구분해야 예언적 긴장이 보존됩니다.
  doctrine_reference: Translation philosophy §3
