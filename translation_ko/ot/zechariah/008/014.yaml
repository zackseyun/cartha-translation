review_pass:
  verdict: revise
  source_fidelity: 현 초안은 심판을 뜻하셨고 뜻을 돌이키지 않으셨다는 핵심 의미를 대체로 보존합니다. 그러나 אֲבֹתֵיכֶם의 본문상 표현을 ‘조상들’로 바꾸어 놓고 이를 각주에서 대안처럼 제시한 점은 원문 우선 원칙에 맞지 않습니다. 또한 첫 문장의 과거형 ‘말씀하셨기 때문입니다’는 두 번 나오는 אָמַר의 현재적 예언자 전달 공식과 맞지 않고, ‘이는’의 선행 내용 없는 연결도 한국어 문맥상 부자연스럽습니다.
  naturalness: 합쇼체의 예언자 전달 공식은 ‘만군의 야훼께서 이렇게 말씀하십니다’가 자연스럽습니다. ‘격분시켰을 때’도 가능하나, 하나님을 목적어로 하는 성서 한국어 문맥에서는 ‘진노하게 하였을 때’가 더 자연스럽고 원문의 사역적 의미를 충분히 전달합니다.
  terminology: ‘만군의 야훼’는 יְהוָה צְבָאוֹת에 적절합니다. אֲבֹתֵיכֶם은 본문에서 ‘너희 아버지들’로 유지하고, 포괄적 문맥 대안인 ‘조상들’은 각주로 처리해야 합니다. נִחָמְתִּי는 이 문맥에서 심판 결정을 거두지 않았다는 뜻이므로 ‘뜻을 돌이키지 않았습니다’가 적절합니다.
  issues:
  - severity: medium
    issue: 아버지들을 ‘조상들’로 본문에서 번역함
    rationale: 히브리어 אֲבֹתֵיכֶם은 문자적으로 ‘너희 아버지들’입니다. ‘조상들’은 가능한 문맥적 대안이지만 본문 표현이 아니라 각주에 두는 편이 원문 충실성과 제공된 영어 감사 기록에 부합합니다.
  - severity: medium
    issue: 예언자 전달 공식의 시제 및 문장 연결이 부정확함
    rationale: אָמַר가 절 안에서 두 차례 반복되는데, 초안은 첫째를 ‘말씀하셨기 때문입니다’로 과거화하고 둘째만 현재로 옮겼습니다. 또한 독립된 ‘이는’은 이 절 단독 표기에서 부자연스럽습니다.
  revised_text: 만군의 야훼께서 이렇게 말씀하십니다. 너희 아버지들이 나를 진노하게 하였을 때, 내가 너희에게 해를 끼치기로 뜻하였고 뜻을 돌이키지 않았던 것처럼, 만군의 야훼께서 말씀하십니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘너희 조상들’. 히브리어는 문자적으로 ‘너희 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 재앙을 내리기로 뜻하였고’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 마음을 바꾸지 않았습니다’ / ‘나는 후회하지 않았습니다’.
    reason: lexical_alternative
  revision_rationale: 본문의 ‘아버지들’을 복원하고, 두 예언자 전달 공식을 모두 현재형 ‘말씀하십니다’로 일관되게 옮겼습니다. 원문의 비교 구조와 다음 절로 이어지는 미완결 문장 성격을 보존하기 위해 끝을 쉼표로 두었습니다. 심판의 רַע는 도덕적 악이 아니라 해악·재난의 뜻이므로 ‘해를 끼치기로’를 유지했습니다. 각주 표지는 본문에 [a][b][c] 순서로 각각 ‘아버지들’, ‘해를 끼치기로 뜻하였고’, ‘뜻을 돌이키지 않았던’ 뒤에 배치하면 됩니다.
