  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
  footnotes:
  - marker: a
    text: Or 'your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I planned to bring disaster on you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I did not change my mind' / 'I did not repent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 만군의 야훼께서 말씀하셨기 때문입니다. 내가 너희의 조상들이 나를 격분시켰을 때 너희에게 해를 끼치기로 뜻한 것같이, 만군의 야훼께서 말씀하십니다. 그리고 나는 뜻을 돌이키지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들’도 가능합니다. 히브리어는 문자적으로 ‘너희의 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 재앙을 내리기로’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 마음을 바꾸지 않았다’ / ‘나는 후회하지 않았다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주님
  lexicon: HALOT
  rationale: 이 절의 신명 호칭은 직접적인 고유명사 야훼를 보존하고, צְבָאוֹת은 군사적 다수성을 살려 관용적으로 ‘만군’으로 옮겼습니다.
- source_word: כַּאֲשֶׁר זָמַמְתִּי
  english_pob_choice: Just as I purposed
  chosen_korean: 뜻한 것같이
  alternatives_korean:
  - 계획한 것같이
  - 작정한 것같이
  - 해치기로 마음먹은 것같이
  lexicon: HALOT
  rationale: זָמַמְתִּי는 단순한 생각이 아니라 의도적으로 정한 뜻을 가리키므로, 문맥의 대응 관계를 살리면서도 자연스러운 한국어인 ‘뜻한’으로 옮겼습니다.
- source_word: לְהָרַע לָכֶם
  english_pob_choice: to do harm to you
  chosen_korean: 너희에게 해를 끼치기로
  alternatives_korean:
  - 너희에게 재앙을 내리기로
  - 너희에게 악을 행하기로
  - 너희에게 해를 주기로
  lexicon: HALOT
  rationale: 여기서 רַע는 도덕적 악이 아니라 징계적 재난/해악의 의미이므로, 하나님을 향한 부적절한 오해를 피하면서도 본문의 강도를 살리는 ‘해를 끼치다’를 택했습니다.
- source_word: בְּהַקְצִיף אֲבֹתֵיכֶם אֹתִי
  english_pob_choice: when your fathers provoked me to wrath
  chosen_korean: 너희의 조상들이 나를 격분시켰을 때
  alternatives_korean:
  - 너희의 조상들이 나를 진노하게 했을 때
  - 너희의 조상들이 나를 노하게 했을 때
  - 너희의 조상들이 나를 화나게 했을 때
  lexicon: HALOT
  rationale: הקציף의 사역적 의미는 단순한 ‘노하게 하다’보다 더 강한 격분을 나타내므로, 예언 문맥의 긴장을 드러내는 ‘격분시켰다’가 적절합니다.
- source_word: וְלֹא נִחָמְתִּי
  english_pob_choice: and I did not relent
  chosen_korean: 그리고 나는 뜻을 돌이키지 않았습니다
  alternatives_korean:
  - 그리고 나는 철회하지 않았습니다
  - 그리고 나는 후회하지 않았습니다
  - 그리고 나는 마음을 바꾸지 않았습니다
  lexicon: HALOT
  rationale: נחם은 여기서 하나님이 선고한 심판을 거두지 않으셨다는 뜻이므로, ‘후회’보다 ‘뜻을 돌이키지 않았다’가 문맥과 신학적 함의를 더 정확히 전합니다.
theological_decisions:
- issue: 하나님이 ‘해를 끼치기로 뜻하셨다’는 표현의 신학적 긴장
  chosen_reading: 징계적 재난/해악을 뜻하신 것으로 이해하되, 본문 표현은 약화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘재앙을 내리기로’처럼 완곡하게 조정
  - ‘악을 행하기로’의 직역
  rationale: 히브리어의 רַע는 여기서 도덕적 악이 아니라 언약적 심판의 해악을 가리키므로, 하나님에 대한 오해를 피하면서도 본문의 कठ한 심판 언어를 보존해야 합니다.
  doctrine_reference: 하나님의 거룩한 심판과 언약적 징계에 대한 성경적 표현의 보존
- issue: וְלֹא נִחָמְתִּי의 인격적 언어
  chosen_reading: ‘뜻을 돌이키지 않았습니다’로 번역해 인간적 표현을 유지하되, 하나님의 변덕으로 읽히지 않게 했습니다.
  alternative_readings:
  - ‘후회하지 않았습니다’
  - ‘마음을 바꾸지 않았습니다’
  rationale: 이 표현은 하나님께 도덕적 후회를 돌리는 것이 아니라, 선언된 심판을 거두지 않는 확고한 결의를 말합니다. 한국어에서는 ‘뜻을 돌이키다’가 그 의미를 가장 안전하게 전달합니다.
  doctrine_reference: 신적 인격화/의인화 언어의 적절한 번역
