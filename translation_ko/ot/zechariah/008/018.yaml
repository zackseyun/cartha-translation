lexical_decisions:
- source_word: דְּבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식인 דְּבַר יְהוָה는 단순한 ‘말’보다 하나님의 권위 있는 선포를 가리키므로, 한국어에서는 ‘말씀’이 소스의 기능을 가장 자연스럽게 보존합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주
  lexicon: HALOT
  rationale: POB의 ‘Yahweh of hosts’를 따라 고유명사 ‘야훼’를 유지하고, צְבָאוֹת는 전통적 교회어인 ‘만군의’로 옮겨 신적 칭호의 군사적 이미지를 살렸습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 저에게
  lexicon: HALOT
  rationale: 예언자 수신자를 나타내는 단순한 여격이므로, 문어체 합쇼체에서 자연스럽고 압축적인 ‘내게’가 적절합니다.
- source_word: לֵאמֹר
  english_pob_choice: 'saying:'
  chosen_korean: '이르셨습니다:'
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하시며
  lexicon: HALOT
  rationale: 직접 인용을 여는 표지로서, 한국어에서는 뒤따르는 발화를 예고하는 동사구가 필요하므로 ‘이르셨습니다’가 원문의 서술 기능을 충실히 반영합니다.
theological_decisions:
- issue: 여호와 대체 여부
  chosen_reading: 이 구절의 יְהוָה는 ‘야훼’로 음역하여 하나님의 고유명을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB 기준에 따라 Tetragrammaton을 титуляр title로 바꾸지 않고, 본문이 드러내는 언약적 고유명을 유지하는 것이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 간접화법의 높임말 처리
  chosen_reading: 예언적 발화 공식을 현대 합쇼체로 옮기되, 하나님을 향한 존칭을 유지했습니다.
  alternative_readings:
  - 이르며
  - 말씀하여
  rationale: 본문은 내러티브 틀 속의 하나님의 말씀 전달식이므로, 한국어 문체는 합쇼체를 유지하되 직접 화용 기능을 흐리지 않도록 했습니다.
  doctrine_reference: Korean target style — modern formal-polite
