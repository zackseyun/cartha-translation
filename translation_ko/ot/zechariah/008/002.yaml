  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת קִנֵּ֥אתִי לְ/צִיּ֖וֹן קִנְאָ֣ה גְדוֹלָ֑ה וְ/חֵמָ֥ה גְדוֹלָ֖ה קִנֵּ֥אתִי לָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
  footnotes:
  - marker: a
    text: Or 'I am zealous for Zion with great zeal.' The Hebrew uses the same root for both 'am jealous' and 'jealousy,' emphasizing intense covenantal passion.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “나는 시온을 크게 질투하였고[a], 큰 분노로 그녀를 질투하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 시온을 크게 열심히 하였고’로 옮길 수 있습니다. 히브리어는 ‘질투하다’와 ‘질투/열심’에 같은 어근을 사용해 강한 언약적 열정을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  lexicon: WLC; HALOT
  rationale: יהוה는 본문 원어를 따라 야훼로 옮기고, צְבָאוֹת는 한국어에서 정착된 관용 표현인 만군을 사용해 신적 칭호의 장엄함과 의미 범위를 살렸습니다.
- source_word: קִנֵּאתִי
  english_pob_choice: I am jealous
  chosen_korean: 질투하였고
  alternatives_korean:
  - 질투합니다
  - 열심을 품었습니다
  lexicon: HALOT
  rationale: 동사 קנא의 강한 언약적 질투/열심을 살리기 위해 ‘질투하다’ 계열을 택했고, 현재형 선언보다 예언적 과거형이 한국어에서 자연스럽게 선언의 힘을 전달합니다.
- source_word: קִנְאָה גְדוֹלָה
  english_pob_choice: with great jealousy
  chosen_korean: 크게 질투하였고
  alternatives_korean:
  - 큰 질투로
  - 큰 열심으로
  lexicon: HALOT
  rationale: 같은 어근의 명사를 별도로 풀어 ‘크게 질투하다’로 처리해 원문의 반복과 강조를 한국어에서도 드러냈습니다.
- source_word: לָהּ
  english_pob_choice: for her
  chosen_korean: 그녀를
  alternatives_korean:
  - 그녀에게
  - 그것을
  lexicon: HALOT
  rationale: 지시대상은 성별이 여성형인 시온이므로, 단순한 사물화보다 인격적·도시적 의인화를 살리는 ‘그녀’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼의 질투 표현 유지
  chosen_reading: ‘질투’ 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 열심
  - 깊은 관심
  rationale: 원어 קנא는 언약적 배타성과 강한 소속권을 드러내므로, 이를 순화하면 본문의 신학적 긴장이 약해집니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
