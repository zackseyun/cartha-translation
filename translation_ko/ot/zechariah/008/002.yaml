  source_fidelity: ‘질투하였고’라는 과거형은 히브리어 완료형을 기계적으로 반영하지만, 이 예언적 선언에서 강조되는 야훼의 현재적이고 지속적인 언약적 열정을 한국어로 충분히 전달하지 못합니다. 또한 לְצִיּוֹן과 לָהּ는 각각 시온을 향한/위한 방향성을 나타내므로 ‘시온을’과 ‘그녀를’만으로는 ‘시온 자체를 질투한다’는 뜻으로 오해될 여지가 있습니다.
  naturalness: ‘시온을 크게 질투하였고’ 및 특히 각주의 ‘크게 열심히 하였고’는 현대 표준 한국어에서 부자연스럽습니다. ‘시온을 위하여 큰 질투를 품고 있으며’는 언약적 질투의 대상과 방향을 자연스럽고 분명하게 드러냅니다.
  terminology: ‘만군의 야훼’는 יהוה צבאות을 충실히 옮깁니다. ‘질투’는 קנא 어근의 긴장과 반복을 보존하며, ‘그녀’는 여성형으로 의인화된 시온을 적절히 반영합니다. חֵמָה גְדוֹלָה는 ‘큰 분노’로 유지합니다.
