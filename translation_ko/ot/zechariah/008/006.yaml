  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
  footnotes:
  - marker: a
    text: Or 'too difficult' or 'impossible.' The Hebrew verb can describe something extraordinary or beyond human ability.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 주 야훼께서 이렇게 말씀하십니다. 「이 날들에 이 백성의 남은 자의 눈에 그것이 놀랍게 여겨진다면, 내 눈에도 또한 놀랍겠느냐?」 만군의 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너무 어려운’ 혹은 ‘불가능한’. 히브리어 동사는 비범하거나 인간의 능력을 넘어서는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 주 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주님
  - 만군의 하나님
  lexicon: HALOT
  rationale: 하나님의 이름은 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת는 군대보다 넓은 뜻을 살려 만군으로 옮겼습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이렇게 말합니다
  - 주께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 엄숙함을 살리면서도 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: יִפָּלֵא
  english_pob_choice: is marvelous
  chosen_korean: 놀랍게 여겨진다면
  alternatives_korean:
  - 너무 놀라운 일이라면
  - 불가능하게 여겨진다면
  - 너무 어려운 일이라면
  lexicon: HALOT
  rationale: פלא의 의미 범위가 '놀랍다/비범하다/불가능하다'를 모두 가질 수 있어, 본문이 말하는 인간의 관점에서의 경이로움과 불가해함을 함께 살렸습니다.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  english_pob_choice: the remnant of this people
  chosen_korean: 이 백성의 남은 자
  alternatives_korean:
  - 이 백성의 남은 무리
  - 이 백성의 남은 사람들
  lexicon: HALOT
  rationale: שְׁאֵרִית는 선지서에서 신학적으로 중요한 '남은 자'이므로, 단순한 잔여가 아니라 보존된 공동체를 드러내는 표현을 택했습니다.
- source_word: בְּעֵינֵי / בְּעֵינַי
  english_pob_choice: in the eyes of / in my eyes
  chosen_korean: 눈에 / 내 눈에도
  alternatives_korean:
  - 보기에 / 나에게도
  - 판단에는 / 내 판단에도
  lexicon: HALOT
  rationale: 히브리어 관용구의 대구를 그대로 살려, 사람들의 판단과 하나님의 판단 사이의 대조를 선명하게 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 힘
  chosen_reading: 질문형을 유지해, 인간에게는 놀랍거나 불가능해 보이는 일이 하나님께도 그런 한계가 있느냐는 반문으로 읽히게 했습니다.
  alternative_readings:
  - 평서형으로 풀어 '내 눈에도 놀랍다'로 옮기는 방식
  rationale: 본문은 하나님의 능력에 제한을 두려는 진술이 아니라, 남은 자에게 어려워 보이는 회복이 하나님께는 제한되지 않음을 드러냅니다. 질문형이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: 본문의 수사적 긴장을 보존하고, 본문 밖의 교리적 완결을 덧붙이지 않습니다.
