  source_fidelity: 히브리어의 조건절, ‘이 백성의 남은 자’, ‘그 날들’, 두 ‘눈에’ 표현의 대구, 그리고 하나님의 능력을 전제하는 수사 의문문을 대체로 충실히 반영했습니다. 다만 יְהוָה צְבָאוֹת는 ‘만군의 주 야훼’보다 ‘만군의 야훼’가 원문의 신명과 칭호 관계를 더 정확히 드러냅니다. 각주 표지는 ‘그 날들’에 붙여 해당 어휘의 의미 범위와 직접 연결하는 것이 적절합니다.
  naturalness: ‘만군의 주 야훼’는 현대 표준 한국어에서 다소 겹치고 부자연스럽습니다. 또한 ‘이 날들에’는 직역투이므로 ‘그 날들에’가 자연스럽습니다. ‘내 눈에도 또한’은 보조사 ‘도’와 ‘또한’이 중복되므로 ‘내 눈에도’로 다듬었습니다.
  terminology: 프로젝트의 신명 표기 원칙에 따라 ‘야훼’를 유지하고, צְבָאוֹת는 전통적이며 널리 이해되는 ‘만군’으로 옮겼습니다. שְׁאֵרִית는 예언서의 용어성을 보존하여 ‘남은 자’로 유지했습니다.
