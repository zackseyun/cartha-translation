translation:
  language: ko
  text: 그 성읍의 거리들은 소년들과 소녀들로 가득 차서, 그 거리들에서 놀고 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רְחֹבוֹת는 도시의 넓은 거리나 공공 광장을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְחֹבוֹת
  english_pob_choice: And the streets
  chosen_korean: 그 성읍의 거리들은
  alternatives_korean:
  - 그 성읍의 열린 광장들은
  - 그 성읍의 공공 광장들은
  lexicon: HALOT
  rationale: רְחֹבוֹת는 도시 안의 넓은 공적 공간을 가리킬 수 있으므로 ‘거리들’로 옮기되, 문맥상 도시 내부의 공적 공간이라는 점을 살렸습니다.
- source_word: יִמָּלְאוּ
  english_pob_choice: will be filled
  chosen_korean: 가득 차서
  alternatives_korean:
  - 채워질 것입니다
  - 가득할 것입니다
  lexicon: HALOT
  rationale: 니팔 미완료형의 미래적·수동적 뜻을 한국어에서 자연스럽게 나타내기 위해 ‘가득 차서’로 옮겼습니다.
- source_word: יְלָדִים וִֽ/ילָדוֹת
  english_pob_choice: boys and girls
  chosen_korean: 소년들과 소녀들
  alternatives_korean:
  - 아이들과 소녀들
  - 어린 소년들과 어린 소녀들
  lexicon: HALOT
  rationale: 히브리어의 남성·여성 복수 대구를 살리기 위해 일반적 ‘아이들’보다 성별 대구가 드러나는 ‘소년들과 소녀들’을 택했습니다.
- source_word: מְשַׂחֲקִים
  english_pob_choice: playing
  chosen_korean: 놀고 있을
  alternatives_korean:
  - 놀고 있는
  - 놀이하는
  lexicon: HALOT
  rationale: 아이들의 생기 있는 동작을 한국어 동사 ‘놀다’로 자연스럽게 표현하되, 진행성을 반영해 ‘놀고 있을’로 옮겼습니다.
- source_word: בִּ/רְחֹבֹתֶי/הָ
  english_pob_choice: in its streets
  chosen_korean: 그 거리들에서
  alternatives_korean:
  - 그 광장들에서
  - 그 거리들 안에서
  lexicon: HALOT
  rationale: 같은 어근 רְחֹבוֹת의 반복을 살리면서도 한국어에서는 중복을 줄이기 위해 전치사구를 자연스럽게 ‘그 거리들에서’로 처리했습니다.
theological_decisions:
- issue: 도시의 회복이 아이들의 놀이로 묘사되는 표현
  chosen_reading: 장차 회복될 예루살렘의 평화와 생동감을 어린이들의 공적 놀이로 구체화해 옮겼습니다.
  alternative_readings:
  - 단순히 안전한 도시의 정적 이미지로 옮길 수 있음
  - ‘장터/광장’의 공공성만 강조할 수 있음
  rationale: 이 구절은 단순한 번영이 아니라 공동체가 안전하고 생기 있게 회복된 상태를 보여 주므로, 아이들이 거리에서 노는 장면을 그대로 살렸습니다.
  doctrine_reference: 회복과 샬롬의 표상
