source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
  footnotes:
  - marker: a
    text: Or “the LORD of Hosts.”
    reason: lexical_alternative
  - marker: b
    text: Literally “the edge/corner” (Hebrew כָּנָף) of a garment.
    reason: lexical_alternative
  - marker: c
    text: Or “a Judean man.”
    reason: alternative_reading
translation:
  language: ko
  text: 만군[a]의 야훼께서 이렇게 말씀하십니다. 그때에 모든 민족의 언어에서 온 열 사람이 붙들 것입니다. 곧 그들은 한 유다 사람의 옷자락[b]을 붙들고, ‘우리가 당신들과 함께 갑시다. 하나님께서 당신들과 함께 계신다는 말을 들었기 때문입니다’라고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군’은 히브리어 צְבָאוֹת의 전통적 번역입니다. ‘군대들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘옷의 가장자리’ 또는 ‘옷의 끝’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 군대들의 야훼
  lexicon: HALOT
  rationale: יעְהוָה는 프로젝트 기본값대로 야훼로 옮기고, צְבָאוֹת는 전통적 ‘만군’이 본래의 군사적 복수를 자연스럽게 드러내므로 합쳐서 번역했습니다.
- source_word: בַּיָּמִים הָהֵמָּה
  english_pob_choice: In those days
  chosen_korean: 그날들에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간표현을 유지하되, 예언 문맥에 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  english_pob_choice: from every language of the nations
  chosen_korean: 민족들의 모든 언어에서
  alternatives_korean:
  - 열방의 모든 언어에서
  - 민족마다의 언어에서
  lexicon: HALOT
  rationale: לְשֹׁנוֹת의 복수성을 살려 ‘언어들’의 뉘앙스를 유지하고, הַגּוֹיִם은 ‘민족들’로 옮겨 현대 독자가 이해하기 쉽게 했습니다.
- source_word: בִּכְנַף
  english_pob_choice: the garment edge
  chosen_korean: 옷자락
  alternatives_korean:
  - 겉옷의 가장자리
  - 옷의 모퉁이
  lexicon: HALOT
  rationale: כָּנָף의 ‘끝/자락’ 이미지를 한국어 관용 표현인 ‘옷자락’으로 옮기되, 특정 의복 종류를 과도하게 규정하지 않았습니다.
- source_word: אִישׁ יְהוּדִי
  english_pob_choice: a Jewish man
  chosen_korean: 한 유다 사람
  alternatives_korean:
  - 유대인 한 사람
  - 유대 사람 한 사람
  - 유대인 남자
  lexicon: HALOT
  rationale: 여기서는 단순한 종교표지보다 유다와 연결된 민족적·언약적 지시가 중요하므로, 역사적 배경을 보존하는 ‘유다 사람’이 가장 적절합니다.
theological_decisions:
- issue: 민족들의 열 사람이 유다 사람의 옷자락을 붙드는 종말론적 장면
  chosen_reading: 열방이 유다를 통해 하나님의 임재를 찾는 모습으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 보다 완화하여 상징적 존중으로 표현할 수 있음
  - ‘붙들다’를 ‘따르다’로 의역할 수 있음
  rationale: 본문의 동사는 반복적이고 신체적인 ‘붙들다’이며, 이는 단순한 추종보다 강한 의존과 인정의 이미지를 드러냅니다. 이 긴장과 힘을 약화하지 않도록 유지했습니다.
  doctrine_reference: Zech 8:23 문맥의 열방-시온/유다 관계
