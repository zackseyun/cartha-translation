revisions:
- from: 만군의 야훼께서 이렇게 말씀하십니다. 그날들에 민족들의 모든 언어에서 나온 열 사람이 한 유다 사람의 옷자락을 붙들고, 「당신들과 함께 가겠습니다. 하나님께서 당신들과 함께하신다는 것을 우리가 들었습니다」라고 말할 것입니다.[a][b]
  to: 만군[a]의 야훼께서 이렇게 말씀하십니다. 그때에 모든 민족의 언어에서 온 열 사람이 붙들 것입니다. 곧 그들은 한 유다 사람의 옷자락[b]을 붙들고, ‘우리가 당신들과 함께 갑시다. 하나님께서 당신들과 함께 계신다는 말을 들었기 때문입니다’라고 말할 것입니다.
  rationale: 원문의 반복 동사를 두 절로 보존하고, 코호르타티브의 청유성을 반영했습니다. ‘그때에’와 ‘모든 민족의 언어에서 온’으로 현대적인 문장을 만들되, 언어별·민족별 범위와 ‘유다 사람’이라는 원문의 표현은 유지했습니다. 각주 표지도 해당 어휘에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:56Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 어휘는 대체로 충실합니다. 그러나 חזק의 반복(‘붙들 것이다 … 붙들고’)이 초안에서는 한 번만 표현되었고, 이에 따라 강조가 약화되었습니다. 또한 인용문의 נֵלְכָה는 청유·의지의 뉘앙스를 지녀 ‘가겠습니다’보다 ‘갑시다’가 더 직접적입니다.
  naturalness: ‘그날들에’는 히브리어 어순을 따른 표현이지만 현대 표준 한국어에서는 ‘그때에’가 더 자연스럽습니다. ‘민족들의 모든 언어에서 나온’도 ‘모든 민족의 언어에서 온’으로 다듬으면 자연스럽고 원문의 범위를 유지합니다. 각주 표지는 해당 단어 바로 뒤에 두는 것이 독해와 앵커 대응에 적절합니다.
  terminology: ‘만군의 야훼’, ‘유다 사람’, ‘옷자락’은 각각 יְהוָה צְבָאוֹת, אִישׁ יְהוּדִי, כָּנָף을 무리 없이 반영합니다. ‘유다 사람’은 가능한 역사적·민족적 의미를 보존하므로 유지할 수 있습니다. 하나님 임재의 표현은 복수 청자에 맞추어 ‘당신들과 함께 계신다’로 옮깁니다.
  issues:
  - severity: medium
    issue: 반복된 동사 יַחֲזִיקוּ … וְהֶחֱזִיקוּ가 한 번만 번역되었습니다.
    rationale: 원문은 ‘붙들 것이다, 곧 … 붙들고’라고 같은 동사를 반복하여 행위를 강조합니다. 한국어에서도 반복을 살리는 것이 최적 등가 원칙에 더 부합합니다.
  - severity: low
    issue: 인용문의 נֵלְכָה가 단순 미래·의지 표현인 ‘가겠습니다’로 옮겨졌습니다.
    rationale: 코호르타티브는 ‘함께 갑시다’처럼 함께하려는 청유·결의의 뉘앙스로 표현하는 편이 더 가깝습니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치되어 해당 어휘와의 연결이 불분명합니다.
    rationale: ‘만군’과 ‘옷자락’ 직후에 각각 표지를 두면 각주의 대상이 분명해집니다.
