source:
  edition: WLC
  text: וּ/בָ֨אוּ עַמִּ֤ים רַבִּים֙ וְ/גוֹיִ֣ם עֲצוּמִ֔ים לְ/בַקֵּ֛שׁ אֶת יְהוָ֥ה צְבָא֖וֹת בִּ/ירוּשָׁלִָ֑ם וּ/לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'and to seek the favor of the LORD.' The Hebrew idiom literally involves 'the face of the LORD' and means to entreat his favor or presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 백성과 강한 나라들이 예루살렘으로 와서 만군의 야훼를 찾고, 야훼의 은혜를 간구할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘야훼의 얼굴’을 뜻하지만, 여기서는 그분의 호의나 임재를 간구한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성들
  alternatives_korean:
  - 많은 민족들
  - 많은 사람들
  lexicon: HALOT
  rationale: עַמִּים는 여기서 서로 구별되는 집단들을 가리키므로, 단수적 집합어인 ‘백성들’이 ‘nations’와 구별되는 뉘앙스를 비교적 자연스럽게 살립니다.
- source_word: וְגוֹיִם עֲצוּמִים
  english_pob_choice: mighty nations
  chosen_korean: 강한 나라들
  alternatives_korean:
  - 강대한 나라들
  - 힘센 이방 민족들
  lexicon: HALOT
  rationale: גוֹיִם은 문맥상 정치적 공동체인 ‘나라들’로 옮기는 것이 자연스럽고, עֲצוּמִים는 힘의 강함을 나타내므로 ‘강한’이 간결하면서도 원뜻을 보존합니다.
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  english_pob_choice: to seek Yahweh of hosts
  chosen_korean: 만군의 야훼를 찾고
  alternatives_korean:
  - 만군의 야훼를 구하고
  - 만군의 야훼를 찾으러
  lexicon: HALOT
  rationale: בקש는 단순한 탐색이 아니라 대상에게로 나아가 찾는 뜻이므로 ‘찾고’가 자연스럽고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  english_pob_choice: to entreat the favor of Yahweh
  chosen_korean: 야훼의 은혜를 간구할 것입니다
  alternatives_korean:
  - 야훼의 얼굴을 간청할 것입니다
  - 야훼의 호의를 빌 것입니다
  lexicon: HALOT
  rationale: ‘얼굴’을 직역하면 한국어에서 뜻이 불투명해질 수 있어, 관용구의 의미인 간구/호의 청을 살려 ‘은혜를 간구하다’로 옮겼습니다. POB가 주석에서 밝힌 ‘favor/presence’의 뜻 가운데 문맥상 ‘favor’가 핵심입니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: YHWH는 본문과 POB 기준에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로 고유 신명 표기를 유지하는 것이 स्रोत-직결적이며, 이 절은 칭호보다 언약 이름의 공적 인식을 강조합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: פְּנֵי יְהוָה의 관용 의미
  chosen_reading: ‘야훼의 은혜를 간구하다’로 번역해 얼굴/임재 관용구를 한국어 의미역으로 살렸습니다.
  alternative_readings:
  - 야훼의 얼굴을 간청하다
  - 야훼의 임재를 구하다
  rationale: 히브리어 ‘얼굴’은 문자적 신체 부위가 아니라 호의, 접근, 임재를 가리키는 관용 표현이므로, 한국어 독자가 즉시 이해할 수 있는 ‘은혜를 간구하다’가 가장 적절합니다.
  doctrine_reference: Zechariah 8:22 lexical idiom note
