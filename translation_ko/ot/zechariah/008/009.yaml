source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ תֶּחֱזַ֣קְנָה יְדֵי/כֶ֔ם הַ/שֹּֽׁמְעִים֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה אֵ֖ת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה מִ/פִּי֙ הַ/נְּבִיאִ֔ים אֲ֠שֶׁר בְּ/י֞וֹם יֻסַּ֨ד בֵּית יְהוָ֧ה צְבָא֛וֹת הַ/הֵיכָ֖ל לְ/הִבָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the mouth of the prophets,' an idiom for receiving their spoken message.
    reason: lexical_alternative
  - marker: c
    text: Or 'who spoke on the day the house of the LORD of Armies was founded, the temple to be built.' The Hebrew relative clause is compact and may be construed slightly differently in English.
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “이 날들에 이 말씀들을 예언자들의 입에서 듣는 너희는 손을 굳세게 하십시오. 그 예언자들은 만군의 야훼의 집이 기초를 놓아졌던 날, 곧 성전이 건축되기 위해서 있었습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의’는 히브리어 צְבָאוֹת의 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예언자들의 입에서’는 받은 말씀이 구두로 선포된 뜻을 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절의 히브리어는 간결하여, ‘성전이 건축되기 위해서’처럼 목적 관계를 자연스럽게 풀어 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 만군의 주
  lexicon: HALOT
  rationale: צְבָאוֹת는 ‘만군’으로 옮겨 군사적·천상적 위엄을 살리고, יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  english_pob_choice: Let your hands be strong
  chosen_korean: 손을 굳세게 하십시오
  alternatives_korean:
  - 손을 강하게 하십시오
  - 힘을 내십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 힘과 결의를 북돋우는 권면으로 들리도록 옮겼습니다.
- source_word: הַשֹּׁמְעִים
  english_pob_choice: you who ... are hearing
  chosen_korean: 듣는 너희
  alternatives_korean:
  - 듣고 있는 너희
  - 듣는 자들
  lexicon: HALOT
  rationale: 현재형 분사를 반영해 단순한 과거적 수식이 아니라 지금 듣고 있는 대상임을 드러냈습니다.
- source_word: מִפִּי הַנְּבִיאִים
  english_pob_choice: from the mouth of the prophets
  chosen_korean: 예언자들의 입에서
  alternatives_korean:
  - 예언자들에게서
  - 예언자들의 말에서
  lexicon: HALOT
  rationale: ‘입에서’라는 표현을 살려 구두 선포의 생생함과 신탁적 어조를 유지했습니다.
- source_word: יֻסַּד ... לְהִבָּנוֹת
  english_pob_choice: was founded ... for the temple to be built
  chosen_korean: 기초를 놓아졌던 날, 곧 성전이 건축되기 위해서
  alternatives_korean:
  - 세워졌던 날, 곧 성전이 지어지기 위해
  - 기초를 놓았던 날, 성전이 건축되도록
  lexicon: HALOT
  rationale: יסד의 ‘기초를 놓다/세우다’와 뒤따르는 목적 부정사를 함께 반영해, 집의 창건과 성전 건축 목적을 연결했습니다.
theological_decisions:
- issue: 예언적 사자문 formula와 직접 인용의 권면 어조
  chosen_reading: “이 날들에 ... 손을 굳세게 하십시오”로 옮겨, 예언자적 선언 뒤에 이어지는 공동체 권면을 합쇼체로 유지했습니다.
  alternative_readings:
  - “굳세게 하라”로 더 직설적으로 번역
  - 서술형으로 완화
  rationale: 본문은 하나님의 직접 발화와 청중에게 주어지는 격려를 함께 담으므로, 예언 인용부 안에서는 공적 권면의 공손한 명령형이 적절합니다.
  doctrine_reference: 선지자적 권면의 문체 보존
- issue: ‘만군의 야훼의 집’과 ‘성전’의 병치
  chosen_reading: ‘집’과 ‘성전’을 함께 두어 히브리어의 병치와 의미 보강을 그대로 살렸습니다.
  alternative_readings:
  - 둘 중 하나만 택해 단순화
  - 둘 다 ‘성전’으로 통일
  rationale: בית와 הֵיכָל의 구분이 본문 의미에 기여하므로, 한국어에서도 창건된 ‘집’과 건축될 ‘성전’을 구분해 보이게 했습니다.
  doctrine_reference: 본문의 병렬 구조 보존
