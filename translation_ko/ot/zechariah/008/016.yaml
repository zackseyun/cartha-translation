source:
  edition: WLC
  text: אֵ֥לֶּה הַ/דְּבָרִ֖ים אֲשֶׁ֣ר תַּֽעֲשׂ֑וּ דַּבְּר֤וּ אֱמֶת֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ אֱמֶת֙ וּ/מִשְׁפַּ֣ט שָׁל֔וֹם שִׁפְט֖וּ בְּ/שַׁעֲרֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
  footnotes:
  - marker: a
    text: Or 'speak the truth, each one to his neighbor.' The Hebrew has 'each man,' using a representative singular.
    reason: lexical_alternative
  - marker: b
    text: '''In your gates'' refers to the city gates, the customary place where legal cases were heard and judgments were rendered.'
    reason: cultural_note
  - marker: c
    text: Or 'judge true and peaceable judgment in your gates.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것들이 여러분이 행해야 할 일입니다. 서로에게 진실을 말하고, 진실과 평화의 판결로 너희 성문에서 판결하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 고대 이스라엘 도시에서 공적 재판과 판결이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  english_pob_choice: These are the things
  chosen_korean: 이것들이
  alternatives_korean:
  - 이것들은
  - 이것들이 곧
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말씀들’보다 여기서는 실천해야 할 ‘일들/사항들’의 뜻이 자연스러워, 지시대명사로 압축해 시작했습니다.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  english_pob_choice: that you must do
  chosen_korean: 여러분이 행해야 할
  alternatives_korean:
  - 여러분이 해야 할
  - 여러분이 행할
  lexicon: HALOT
  rationale: 본문의 지시적·명령적 뉘앙스를 살려 의무성을 드러내되, 과도하게 강한 법률체보다 자연스러운 합쇼체로 옮겼습니다.
- source_word: דַּבְּרוּ אֱמֶת אִישׁ אֶת רֵעֵהוּ
  english_pob_choice: speak truth to one another
  chosen_korean: 서로에게 진실을 말하고
  alternatives_korean:
  - 각 사람은 이웃에게 진실을 말하고
  - 서로 진리를 말하고
  lexicon: HALOT
  rationale: אֱמֶת을 ‘진리’보다 일상적·윤리적 요구가 드러나는 ‘진실’로 옮겼고, 대표 단수 אִישׁ은 한국어에서 자연스러운 상호성을 살려 ‘서로’로 표현했습니다.
- source_word: שִׁפְטוּ בְּשַׁעֲרֵיכֶם
  english_pob_choice: judge ... in your gates
  chosen_korean: 너희 성문에서 판결하십시오
  alternatives_korean:
  - 너희 성문에서 판단하십시오
  - 너희 성문 안에서 재판하십시오
  lexicon: HALOT
  rationale: שָׁעַר의 문화적 배경인 성문 재판 관습을 살리면서, משפט/שפט의 법정적 의미를 한국어 ‘판결하다’로 간결하게 드러냈습니다.
theological_decisions:
- issue: 대표 단수 אִישׁ의 한국어 처리
  chosen_reading: ‘서로에게’로 옮겨 공동체 상호성으로 드러내고, 대표 단수의 의미는 문맥 속에서 보존했습니다.
  alternative_readings:
  - ‘각 사람은 이웃에게’
  - ‘한 사람은 그의 이웃에게’
  rationale: 히브리어는 남성 단수 대표형을 쓰지만, 이 구절의 윤리적 요청은 공동체 전체의 상호적 실천을 지향하므로 한국어에서는 자연스러운 상호표현이 가장 오해가 적습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: מִשְׁפַּט שָׁלוֹם의 의미
  chosen_reading: ‘진실과 평화의 판결’
  alternative_readings:
  - ‘진실과 평화로운 판결’
  - ‘평화를 이루는 판결’
  rationale: מִשְׁפַּט은 단순한 의견이 아니라 법정적 판결이며, שָׁלוֹם은 분쟁을 해소해 공동체의 평화를 세우는 결과를 가리키므로 두 요소를 함께 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
