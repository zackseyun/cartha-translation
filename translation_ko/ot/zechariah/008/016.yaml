revisions:
- from: 이것들이 여러분이 행해야 할 일입니다. 서로에게 진실을 말하고, 진실과 평화의 판결로 너희 성문에서 판결하십시오.[a]
  to: 다음은 여러분이 해야 할 일들입니다. 서로에게 진실을 말하십시오. 여러분의 성문에서 진실하고 평화를 이루는 판결을 내리십시오.[a]
  rationale: 지시적 도입부의 복수성(‘일들’)을 보존하고, 두 명령을 한국어의 자연스러운 합쇼체 문장으로 분리했습니다. 대표 단수 ‘각 사람이 자기 이웃에게’는 한국어에서 상호적 윤리 명령을 자연스럽게 나타내는 ‘서로에게’로 유지했습니다. משפט שלום의 정확한 통사 관계는 압축적이므로, ‘진실하고 평화를 이루는 판결’로 그 윤리적·사법적 병렬성을 살렸습니다. 성문의 역사적 법정 기능은 본문 대신 주석에서 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:53Z'
