id: ZEC.3.1
reference: Zechariah 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
  footnotes:
  - marker: a
    text: Or, “Satan … to oppose him.” The Hebrew has “the satan,” which can function as a title meaning “the accuser” or “the adversary.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 내게 대제사장 여호수아가 야훼의 천사 앞에 서 있고, 고발자[a]가 그를 고발하려고 여호수아의 오른편에 서 있는 것을 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사탄 … 그를 대적하려고.” 히브리어에는 “하사탄”(직역하면 “그 고발자” 또는 “그 대적자”)이라고 되어 있어, 직함으로 기능할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  english_pob_choice: Then he showed me
  chosen_korean: 그가 내게 … 보여 주었습니다
  alternatives_korean:
  - 그가 내게 … 보게 하셨습니다
  - 그가 내게 … 나타내셨습니다
  lexicon: HALOT
  rationale: 1인칭 수동적 체험을 한국어에서는 자연스럽게 ‘보여 주다’로 옮기면 원문의 인과적 의미와 서술 흐름을 잘 살릴 수 있습니다.
- source_word: יְהוֹשֻׁעַ הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: Joshua the high priest
  chosen_korean: 여호수아 대제사장
  alternatives_korean:
  - 예수아 대제사장
  - 여호수아 그 대제사장
  lexicon: HALOT
  rationale: 히브리어 인명 יְהוֹשֻׁעַ는 ‘여호수아’로 옮기는 것이 원형에 더 직접적이며, הַכֹּהֵן הַגָּדוֹל은 관용적으로 ‘대제사장’이 가장 정확합니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 문맥에서 ‘천사’가 자연스럽고, יְהוָה는 본문 원어의 신명 표기를 보존하여 ‘야훼’로 옮겼습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 고소하는 자
  - 사탄
  - 대적자
  lexicon: HALOT
  rationale: 정관사 있는 הַשָּׂטָן은 이 장면에서 고유명사보다 직무/역할을 가리키므로, 법정적 뉘앙스를 살려 ‘고발자’로 옮겼습니다.
- source_word: לְשִׂטְנֹו
  english_pob_choice: to accuse him
  chosen_korean: 그를 고발하려고
  alternatives_korean:
  - 그를 대적하려고
  - 그를 비난하려고
  lexicon: HALOT
  rationale: שורש שׂטן의 동사적 용법은 이 재판 장면에서 ‘고발하다/대적하다’의 뜻을 띠므로, 문맥상 가장 분명한 ‘고발하다’를 택했습니다.
- source_word: עַל יְמִינֹו
  english_pob_choice: at his right hand
  chosen_korean: 그의 오른편에
  alternatives_korean:
  - 그의 오른손에
  - 그의 오른쪽에
  lexicon: HALOT
  rationale: 히브리 관용구를 한국어에서는 ‘오른편에’로 자연스럽게 옮기되, 위치 관계를 유지했습니다.
theological_decisions:
- issue: הַשָּׂטָן을 고유명사 ‘사탄’으로 볼지, 직함적 표현으로 볼지
  chosen_reading: 고발자
  alternative_readings:
  - 사탄
  - 대적자
  rationale: 정관사가 있는 형태와 법정적 맥락을 함께 고려하면, 이 본문에서는 인격적 고유명사보다 기능적 호칭이 더 직접적입니다. 따라서 본문에는 역할 의미를 드러내고, 전통적 독법은 각주에 남겼습니다.
  doctrine_reference: 원문 우선 원칙; 본문 내 의미 기능 보존
