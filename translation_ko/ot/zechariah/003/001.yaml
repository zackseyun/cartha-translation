  source_fidelity: 본문은 와이야르에니를 ‘보여 주었습니다’로, יְהוֹשֻׁעַ와 הַכֹּהֵן הַגָּדוֹל을 ‘여호수아 대제사장’으로, לְשִׂטְנוֹ를 ‘고발하려고’로 옮겨 원문의 의미를 대체로 충실히 반영합니다. 다만 ‘그의 오른편’의 소유자가 여호수아임을 한국어에서 분명히 하는 것이 좋습니다.
  naturalness: 합쇼체 서술은 적절합니다. 다만 각주 표지가 ‘야훼의 천사’ 뒤에 놓여 있으나 각주의 내용은 הַשָּׂטָן 및 לְשִׂטְנוֹ에 관한 것이므로, 독자가 각주의 적용 대상을 오해하지 않도록 ‘고발자’에 붙여야 합니다.
  terminology: ‘야훼’, ‘여호수아’, ‘대제사장’, ‘고발자’는 일관되고 현대 표준어에 맞습니다. 각주 안의 영어 표현 “the satan”은 한국어 각주에 맞게 히브리어 음역 및 직역으로 바꾸는 것이 바람직합니다.
