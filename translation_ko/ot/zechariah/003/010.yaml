source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תִּקְרְא֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ אֶל תַּ֥חַת גֶּ֖פֶן וְ/אֶל תַּ֥חַת תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
  footnotes:
  - marker: a
    text: Or, 'will call, each man to his neighbor.' The Hebrew verb can be rendered more literally as 'call,' but here likely carries the sense of invitation.
    reason: lexical_alternative
  - marker: b
    text: Many English versions read 'the LORD of Hosts.' The Hebrew title צְבָאוֹת refers to armies or hosts.
    reason: lexical_alternative
  - marker: c
    text: Compare 1 Kings 4:25 and Micah 4:4, where sitting under the vine and fig tree symbolizes peace, security, and prosperity.
    reason: cross_reference
  - marker: d
    text: Some translations supply 'his' before 'vine' and 'fig tree' from similar biblical idiom, but the possessive is not explicit in the Hebrew here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 야훼 만군의 하나님께서 선언하십니다. 너희는 각자 이웃을 포도나무 아래와 무화과나무 아래로 초대할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르다’보다 문맥상 초대의 뜻이 강하므로 ‘초대하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צְבָאוֹת은 문자적으로 ‘군대들/군대의’라는 뜻으로, 전통적 ‘만군’은 이를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 포도나무와 무화과나무 아래에 앉는 이미지는 평안, 안전, 번영을 상징합니다.
    reason: cross_reference
  - marker: d
    text: 히브리어에는 ‘그의’가 명시되지 않지만, 비슷한 성구의 관용구를 따라 일부 번역본이 소유격을 보충합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 날에 그때
  lexicon: HALOT
  rationale: 예언적 미래 시점을 여는 관용 표현이므로, 현대 한국어에서 자연스러운 시간 부사구로 옮겼습니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님께서 선언하십니다
  alternatives_korean:
  - 야훼 만군의 주께서 말씀하십니다
  - 야훼 만군의 하나님께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식을 드러내므로 ‘선언하십니다’로 옮겼고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로, צְבָאוֹת은 ‘만군’으로 살렸습니다.
- source_word: תִּקְרְאוּ אִישׁ לְרֵעֵהוּ
  english_pob_choice: each of you will invite his neighbor
  chosen_korean: 너희는 각자 이웃을 초대할 것입니다
  alternatives_korean:
  - 너희는 각자 이웃을 부를 것입니다
  - 각 사람이 자기 이웃을 초대할 것입니다
  lexicon: HALOT
  rationale: קרא는 단순히 ‘부르다’보다 여기서는 평화의 식탁으로 초대하는 뉘앙스가 강하므로 ‘초대하다’로 옮겼습니다. 2인칭 복수와 분배적 איש을 한국어에서 ‘너희는 각자’로 자연스럽게 반영했습니다.
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  english_pob_choice: under the vine and under the fig tree
  chosen_korean: 포도나무 아래와 무화과나무 아래
  alternatives_korean:
  - 포도나무 밑과 무화과나무 밑
  - 포도나무 아래서와 무화과나무 아래서
  lexicon: HALOT
  rationale: ‘아래’는 안식·평안의 상징적 장소감을 보존하며, 본문에 없는 소유격 ‘그의’는 덧붙이지 않았습니다.
theological_decisions:
- issue: 예언적 평화의 관용구를 어떻게 살릴 것인가
  chosen_reading: 포도나무 아래와 무화과나무 아래
  alternative_readings:
  - 그의 포도나무 아래와 그의 무화과나무 아래
  - 포도나무와 무화과나무 그늘 아래
  rationale: 이 표현은 열왕기상 4:25, 미가 4:4와 연결되는 평화·안전·풍요의 상징이므로, 해설적 확대 없이 본문의 상징성을 유지했습니다.
  doctrine_reference: 'OT intertext: 1 Kings 4:25; Micah 4:4'
- issue: 야훼 칭호의 표기
  chosen_reading: 야훼 만군의 하나님
  alternative_readings:
  - 야훼 만군
  - 야훼 만군의 주
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 두고, צְבָאוֹת은 ‘만군’으로 번역해 전통적 ‘Hosts’보다 직접적인 의미를 드러냈습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
