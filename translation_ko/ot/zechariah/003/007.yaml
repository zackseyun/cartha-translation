source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
  footnotes:
  - marker: a
    text: Or 'free movement among these who are standing here'; the Hebrew may also be understood as 'those who walk among these standing here' or 'places to walk among these standing here.'
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. "네가 내 길들을 따라 걷고 내 맡김을 지키면, 너도 내 집을 다스리고 내 뜰들을 지키게 될 것이다. 또 내가 이 서 있는 이들 가운데에서 네게 자유로운 출입을 주겠다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 서 있는 이들 가운데에서 자유롭게 다닐 수 있음’; 히브리어는 ‘이 서 있는 이들 가운데에서 다니는 이들’ 또는 ‘이 서 있는 이들 가운데에서 다닐 장소들’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  lexicon: WLC/HALOT
  rationale: יהוה는 고유명사로 야훼를 쓰고, צְבָאוֹת은 신적 칭호로서 관용적인 ‘만군의’가 한국어에서 가장 자연스럽고 소스의 범위를 좁히지 않습니다.
- source_word: מִשְׁמַרְתִּי
  english_pob_choice: my charge
  chosen_korean: 내 맡김
  alternatives_korean:
  - 내 책임
  - 내 직무
  - 내 명령
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순한 명령보다 맡겨진 책임·의무의 뉘앙스가 강하므로, 제의적 문맥을 살려 ‘맡김’으로 옮겼습니다.
- source_word: תָּדִין אֶת בֵּיתִי
  english_pob_choice: you shall govern my house
  chosen_korean: 내 집을 다스리고
  alternatives_korean:
  - 내 집을 다스리며
  - 내 집을 심판하고
  - 내 집을 통치하고
  lexicon: HALOT
  rationale: דִּין은 여기서 판결만이 아니라 관리·통치의 뜻을 포함하므로, 성전/제의 문맥에 맞게 ‘다스리다’로 옮겼습니다.
- source_word: מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  english_pob_choice: free access among these who are standing here
  chosen_korean: 이 서 있는 이들 가운데에서 네게 자유로운 출입을 주겠다
  alternatives_korean:
  - 이 서 있는 이들 가운데에서 네게 자유로운 움직임을 주겠다
  - 이 서 있는 이들 가운데에서 네가 다닐 곳을 주겠다
  - 이 서 있는 이들 사이에서 네게 출입할 권리를 주겠다
  lexicon: HALOT
  rationale: 마חל킴은 난해한 표현이지만 문맥상 허락된 이동/출입의 특권을 뜻하므로, POB의 ‘free access’를 따라 한국어에서도 자연스러운 ‘자유로운 출입’으로 풀었습니다.
- source_word: בֵּין הָעֹמְדִים הָאֵלֶּה
  english_pob_choice: among these who are standing here
  chosen_korean: 이 서 있는 이들 가운데에서
  alternatives_korean:
  - 여기에 서 있는 이들 가운데에서
  - 이 서 있는 자들 사이에서
  lexicon: HALOT
  rationale: ‘standing here’는 환상 속에서 야훼 앞에 서 있는 존재들을 가리키므로, 중립적으로 ‘이 서 있는 이들’로 옮겼습니다.
theological_decisions:
- issue: 마חל킴(מַהְלְכִים)의 의미
  chosen_reading: 환상 속에서 하나님의 임재 앞에 있는 존재들 가운데로 허락된 자유로운 출입/접근을 약속하는 말로 읽었습니다.
  alternative_readings:
  - 천상 수행원들 가운데서 함께 다니는 자들을 주겠다는 뜻
  - 그들 사이를 다닐 수 있는 장소를 주겠다는 뜻
  rationale: 표현이 실제로 모호하므로, 문맥이 요구하는 권한 부여의 의미를 살리되 구체적 기계적 이미지는 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: source tension을 해소하지 않고 보존합니다.'
