  to: 만군의 야훼께서 이렇게 말씀하십니다. “당신이 내 길을 따라 걷고 내가 맡긴 직무를 지키면, 당신도 내 집을 다스리고 내 뜰들을 지키게 될 것입니다. 또 내가 여기 서 있는 이들 가운데를 자유롭게 드나들게 하겠습니다[a].”
  rationale: ‘내 맡김’을 ‘내가 맡긴 직무’로 고쳐 מִשְׁמַרְתִּי의 맡겨진 의무라는 의미를 명확히 했습니다. 난해한 מַהְלְכִים은 본문에서 허락된 이동·접근의 의미로 자연스럽게 옮기되, 경쟁하는 해석은 각주에 남겼습니다. 각주 표지는 논쟁적인 구절 바로 뒤에 배치했으며, 전체 문체는 현대 정중한 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:51Z'
