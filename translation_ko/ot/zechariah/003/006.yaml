  text: וַ/יָּ֨עַד֙ מַלְאַ֣ךְ יְהוָ֔ה בִּ/יהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/006.yaml
  text: Then the angel of Yahweh solemnly charged Joshua[a], saying,
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'angel' or 'messenger,' though 'angel' best fits this visionary context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 여호수아에게 엄숙히 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’로도 옮길 수 있습니다. 히브리어 מַלְאַךְ는 ‘천사’와 ‘사자/메신저’ 둘 다 뜻할 수 있지만, 이 환상 문맥에서는 ‘천사’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  english_pob_choice: solemnly charged
  chosen_korean: 엄숙히 말했습니다
  alternatives_korean:
  - 엄숙히 경고했습니다
  - 엄숙히 권고했습니다
  - 엄숙히 훈계했습니다
  - 엄숙히 명령했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘말하다’보다 공식적이고 무게 있는 말하기를 가리키므로, POB의 ‘solemnly charged’를 살려 ‘엄숙히’로 강도를 보존했습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  - 야훼의 천사로서의 사자
  lexicon: HALOT
  rationale: 환상 문맥에서 מַלְאַךְ는 ‘천사’가 자연스럽고, POB가 유지한 신명 ‘Yahweh’를 한국어 관행에 맞게 ‘야훼’로 옮겼습니다.
- source_word: בִּיהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아에게
  alternatives_korean:
  - 여호수아를 향해
  - 여호수아에 대하여
  - 여호수아에게 대고
  lexicon: HALOT
  rationale: 전치사 ב는 여기서 대상자 표시로 기능하므로, 한국어에서는 조사 ‘-에게’가 가장 자연스럽게 그 관계를 드러냅니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르기를
  - 말하며
  - 이렇게 말하며
  lexicon: HALOT
  rationale: 다음 절의 직접 화법을 여는 표준적 연결 표현이므로, 한국어에서는 ‘말했습니다’로 부드럽게 이어 주었습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 신명은 ‘야훼’로 일관해 번역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, POB의 기준에 따라 언약적 고유명 ‘야훼’를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
