translation:
  language: ko
  text: 여호수아는 몹시 더러운 옷을 입은 채 천사 앞에 서 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문두의 접속사 와우는 ‘그리고’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘몹시 더러운’으로 옮긴 말은 심하게 불결하고 오염된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘천사’는 ‘사자’ 또는 ‘메신저’로도 옮길 수 있습니다. 그러나 이 환상 문맥에서는 ‘천사’가 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  english_pob_choice: Now Joshua
  chosen_korean: 그때 여호수아는
  alternatives_korean:
  - 그리고 여호수아는
  - 이제 여호수아는
  lexicon: HALOT
  rationale: 접속사 waw는 장면 전환을 이어 주므로, 서술 흐름에 자연스러운 ‘그때’로 옮기고 이름은 표준 음역인 ‘여호수아’를 유지했습니다.
- source_word: לָבֻשׁ בְּגָדִים צוֹאִים
  english_pob_choice: was clothed with filthy garments
  chosen_korean: 더러운 옷을 입은 채로
  alternatives_korean:
  - 더러운 옷을 입고
  - 더럽혀진 옷을 입은 채로
  - 지저분한 옷을 입은 채로
  lexicon: HALOT
  rationale: ‘was clothed’의 상태 묘사를 한국어의 ‘입은 채로’로 살리고, צוֹאִים의 강한 오염감을 ‘더러운’으로 직접 반영했습니다. ‘더럽혀진’은 해석이 더 강해지고, ‘지저분한’은 약합니다.
- source_word: וְ/עֹמֵד לִ/פְנֵי
  english_pob_choice: and was standing before
  chosen_korean: 천사 앞에 서 있었습니다
  alternatives_korean:
  - 천사 앞에 서 있었고
  - 천사 앞에 서 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 자세를 한국어 진행형으로 풀어, 장면의 정적 긴장을 자연스럽게 드러냈습니다. ‘before’는 위치상 ‘앞에’가 가장 간결합니다.
- source_word: הַ/מַּלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: HALOT
  rationale: 환상 장면에서 מלאך는 ‘천사’가 가장 자연스럽고, 본문 자체는 더 강한 신학적 동일시를 명시하지 않으므로 이를 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 본문의 천사 정체를 얼마나 구체화할지
  chosen_reading: 주어진 본문 수준에서는 단순히 ‘천사’로 두었습니다.
  alternative_readings:
  - ‘여호와의 천사’로 해석할 수 있음
  - 더 일반적으로 ‘사자/메신저’로 옮길 수 있음
  rationale: 히브리어 본문은 관사 있는 הַמַּלְאָךְ만 제시하며, 이 절 자체는 더 강한 신현(神顯) 해석을 요구하지 않습니다. 따라서 본문 번역은 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: 신학적 동일시를 본문 밖에서 성급히 단정하지 않음
