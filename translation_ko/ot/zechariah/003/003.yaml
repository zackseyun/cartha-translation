  source_fidelity: ‘그때’는 히브리어 וְ가 지닌 접속·담화 진행 기능을 시간 부사로 구체화하여, 원문에 없는 시간적 의미를 더합니다. 또한 ‘더러운 옷’은 צוֹאִים이 나타내는 매우 심한 불결함을 다소 약하게 전달합니다. ‘여호수아는 몹시 더러운 옷을 입은 채 천사 앞에 서 있었습니다’는 원문의 상태와 계속되는 자세를 충실히 보존합니다.
