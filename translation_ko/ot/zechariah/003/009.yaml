    issue: כִּי הִנֵּה의 도입 요소가 번역에서 누락됨
    rationale: 문두의 כִּי는 설명·강조의 연결을, הִנֵּה는 주의 환기를 나타냅니다. 한국어에서는 ‘참으로, 보십시오’로 무리 없이 반영할 수 있습니다.
  - severity: high
    issue: מְפַתֵּחַ פִּתֻּחָהּ의 목적어와 동족어 반복이 불명확함
    rationale: ‘그 위에 새길 것을 새기겠습니다’는 히브리어의 ‘그것의 새김을 새기다’라는 지시 관계를 ‘새길 것’이라는 미래 대상화로 바꿉니다. ‘그 돌에 새김을 새기겠습니다’는 새김/새기다의 반복과 돌을 가리키는 접미사의 의미를 더 충실히 보존합니다.
