  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'I will engrave its inscription.' The Hebrew uses a cognate expression, literally 'engrave its engraving.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 여호수아 앞에 둔 돌이 있습니다. 한 돌 위에 일곱 눈이 있습니다. 보십시오, 내가 그 위에 새길 것을 새기겠습니다. 만군의 야훼의 말씀이니, 내가 하루 만에 그 땅의 죄악을 제거하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 매끄럽게는 “그의 새김을 새기겠습니다” 또는 “그 위에 새긴 글을 새기겠습니다”로 옮길 수 있습니다. 히브리어는 동족어 반복 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 한국 교회 표현으로는 “만군의 여호와”가 흔하지만, 본 기록은 신명칭을 “야훼”로 옮깁니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה / הִנְנִי
  english_pob_choice: behold / Behold, I myself
  chosen_korean: 보십시오 / 보십시오, 내가
  alternatives_korean:
  - 보라 / 보라, 내가
  - 보아라 / 보아라, 내가
  lexicon: HALOT
  rationale: 예언문맥의 주의 환기 표지로서 두 번의 호응을 살리되, 현대 합쇼체에서는 “보십시오”가 가장 자연스럽고 공손한 촉구입니다.
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  english_pob_choice: will engrave its engraving
  chosen_korean: 그 위에 새길 것을 새기겠습니다
  alternatives_korean:
  - 그 새김을 새기겠습니다
  - 그의 각인을 각인하겠습니다
  - 그 위에 조각하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 동족어 반복을 한국어에서 그대로 “새길 것을 새기다”로 살려, 본문의 의도적 중첩과 형식적 긴장을 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 여호와
  - 만군의 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본문의 신명칭을 한국어 표준어로 직접 옮기고, צְבָאוֹת은 전통적 “만군”을 사용해 호칭의 장중함을 보존했습니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 불법
  - 죄책
  - 죄
  lexicon: HALOT
  rationale: עוֹן은 단순한 죄보다 더 무거운 도덕적 왜곡과 책임을 포함하므로, 본문 맥락에서는 “죄악”이 가장 적절합니다.
theological_decisions:
- issue: 돌과 일곱 눈의 상징성
  chosen_reading: 본문의 상징 이미지를 해석하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 메시아적 돌로 본문 안에서 풀어 쓰는 해석
  - 일곱 눈을 하나님의 전지로 본문에서 설명하는 해석
  rationale: 히브리어 본문은 이미지를 제시할 뿐 본문 안에서 해석하지 않으므로, 번역문도 상징을 열어 둔 채 유지하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: הִנְנִי의 화자 자기강조
  chosen_reading: “보십시오, 내가”로 자기지시적 강조를 살렸습니다.
  alternative_readings:
  - “보라, 내가”
  - “내가 이제”
  rationale: 예언적 선언의 돌출성과 화자의 직접적 개입을 드러내기 위해, 단순 미래형보다 자기강조를 앞세운 표현을 택했습니다.
  doctrine_reference: Prophetic speech register and emphasis
