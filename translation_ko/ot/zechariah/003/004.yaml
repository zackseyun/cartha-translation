base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
  footnotes:
  - marker: a
    text: Or “festal robes” / “fine garments.” The Hebrew term denotes rich or stately clothing.
    reason: lexical_alternative
  - marker: b
    text: “Those standing before him” likely refers to heavenly attendants, but the Hebrew is left descriptive.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 대답하여 자기 앞에 서 있는 이들에게 말했습니다. 「그 더러운 옷을 그에게서 벗기십시오.」 그리고 그가 그에게 말했습니다. 「보십시오, 내가 당신의 죄악을 당신에게서 옮겨 버렸습니다. 이제 내가 당신에게 화려한 옷을 입히겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 앞에 서 있는 이들’은 천상의 시종들을 가리킬 가능성이 크지만, 히브리어는 묘사적으로만 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술문에서 대답 동사와 발화 동사의 결합을 자연스럽게 옮기되, 중복을 줄여 현대 한국어 문장으로 읽히게 했습니다.
- source_word: הָעֹמְדִים לְפָנָיו
  english_pob_choice: those standing before him
  chosen_korean: 자기 앞에 서 있는 이들
  alternatives_korean:
  - 그 앞에 서 있는 이들
  - 그 앞에 서 있는 사람들
  lexicon: HALOT
  rationale: 영문 POB처럼 설명적인 표현을 유지하여, 본문이 암시하는 하늘의 시종들을 해석으로 좁히지 않고 그대로 드러냈습니다.
- source_word: הַבְּגָדִים הַצֹּאִים
  english_pob_choice: the filthy garments
  chosen_korean: 그 더러운 옷
  alternatives_korean:
  - 그 더러운 의복
  - 그 오염된 옷
  lexicon: HALOT
  rationale: צואִים의 강한 부정적 뉘앙스를 ‘더러운’으로 살리되, 한국어에서는 자연스러운 ‘옷’으로 옮겨 의례적·도덕적 부정함을 함께 보이게 했습니다.
- source_word: עֲוֺנֶךָ
  english_pob_choice: your iniquity
  chosen_korean: 당신의 죄악
  alternatives_korean:
  - 당신의 불의
  - 당신의 죄
  - 당신의 죄책
  lexicon: HALOT
  rationale: עון의 윤리적 무게를 살리기 위해 단순한 ‘죄’보다 더 강한 ‘죄악’을 택했습니다. 문맥상 정결의 상징과 연결되는 도덕적 더러움이 분명합니다.
- source_word: וְהַלְבֵּשׁ אֹתְךָ מַחֲלָצוֹת
  english_pob_choice: and I will clothe you with fine garments
  chosen_korean: 이제 내가 당신에게 화려한 옷을 입히겠습니다
  alternatives_korean:
  - 내가 당신에게 고운 옷을 입히겠습니다
  - 내가 당신에게 정장 같은 옷을 입히겠습니다
  - 내가 당신에게 귀한 옷을 입히겠습니다
  lexicon: HALOT
  rationale: מַחֲלָצוֹת는 단순히 깨끗한 옷이 아니라 위엄 있고 값진 옷차림을 가리키므로, ‘화려한 옷’으로 번역해 외형의 영예와 회복을 드러냈습니다.
theological_decisions:
- issue: 더러운 옷의 제거와 죄악의 제거 사이의 상징 관계
  chosen_reading: 상징을 유지한 채, 옷의 교체와 죄악의 제거를 함께 드러내되 이를 교리적 설명으로 확장하지 않았습니다.
  alternative_readings:
  - 칭의로 명시하기
  - 제사장직 회복으로 명시하기
  rationale: 본문은 분명 상징적 연관을 제시하지만, 그 자체로 후대 교리 용어를 명시하지는 않습니다. 번역은 본문의 상징을 보존하면서도 해석을 과도하게 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 「자기 앞에 서 있는 이들」의 정체
  chosen_reading: 천상 존재로 좁히지 않고 서술적 표현을 유지했습니다.
  alternative_readings:
  - 그의 시종들
  - 천사들
  rationale: 맥락상 천상 시종들일 가능성은 크지만, 히브리어 표현 자체는 직함이 아니라 묘사입니다. 본문이 말하는 수준을 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1
