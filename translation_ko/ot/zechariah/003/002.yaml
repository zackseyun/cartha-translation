revisions:
- from: 야훼께서 사탄에게 말씀하셨습니다. 「야훼께서 너를 꾸짖으시기를 바라노라, 사탄아! 야훼, 곧 예루살렘을 택하신 분께서 너를 꾸짖으시기를 바라노라! 이것이 불에서 건져 낸 그슬린 나뭇조각이 아니냐?」[a][b]
  to: 야훼께서 그 고발자[a]에게 말씀하셨습니다. “고발자야, 야훼께서 너를 꾸짖으시기를 바랍니다! 예루살렘을 택하신 야훼께서 너를 꾸짖으시기를 바랍니다! 이 사람이 불에서 건져 낸 장작[b]이 아니냐?”
  rationale: 원문의 정관사 있는 직함, 반복된 꾸짖음의 형식, 예루살렘을 택하신 분이라는 수식, 그리고 불에서 구출된 장작의 비유를 보존했습니다. 한편 현대 합쇼체에 맞지 않는 표현과 원문에 명시되지 않은 ‘그슬린’이라는 추가 의미를 제거했습니다.
