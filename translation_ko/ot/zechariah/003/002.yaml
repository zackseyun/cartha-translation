id: ZEC.3.2
reference: Zechariah 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
  footnotes:
  - marker: a
    text: Or, traditionally, “Satan.” The Hebrew has the title “the accuser.”
    reason: alternative_reading
  - marker: b
    text: Or “a firebrand rescued from the fire.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그 고발자[a]에게 말씀하셨습니다. “고발자야, 야훼께서 너를 꾸짖으시기를 바랍니다! 예루살렘을 택하신 야훼께서 너를 꾸짖으시기를 바랍니다! 이 사람이 불에서 건져 낸 장작[b]이 아니냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘사탄’. 히브리어는 ‘그 고발자’라는 직함을 사용합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘불에서 구해 낸 불쏘시개’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 언약적 고유명인 יהוה를 제목어로 돌리지 않고 음역하여 보존했습니다. POB의 ‘Yahweh’와 대응되도록 한국어 본문에서도 ‘야훼’를 사용했습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser / O Accuser
  chosen_korean: 사탄
  alternatives_korean:
  - 고발자
  - 대적
  lexicon: WLC
  rationale: 원문은 관사가 붙은 직함적 용법이지만, 한국어에서 법정적 호칭인 ‘사탄’이 이 인물을 가장 널리 식별하게 하므로 본문은 이를 따르고, 직함 뉘앙스는 직설적 대면 형식으로 살렸습니다.
- source_word: יִגְעַר
  english_pob_choice: rebuke
  chosen_korean: 꾸짖으시기를 바라노라
  alternatives_korean:
  - 책망하시기를 바라노라
  - 꾸짖으소서
  lexicon: WLC
  rationale: גער의 강한 권위적 질책을 한국어에서 가장 자연스럽게 드러내는 말로 ‘꾸짖다’를 택했습니다. 히브리어 직설 재현을 위해 축원형처럼 들리는 ‘바라노라’를 붙여 반복된 저주/명령의 압박을 유지했습니다.
- source_word: הַבֹּחֵר בִּירוּשָׁלָם
  english_pob_choice: who has chosen Jerusalem
  chosen_korean: 예루살렘을 택하신 분
  alternatives_korean:
  - 예루살렘을 선택하신 분
  - 예루살렘을 택하시는 분
  lexicon: WLC
  rationale: 분사구는 야훼의 특징적 행위를 가리키므로, 완료적·신적 신분을 드러내는 ‘택하신 분’으로 옮겼습니다. ‘선택하신’보다 ‘택하신’이 언약적 어감을 더 잘 살립니다.
theological_decisions:
- issue: 반복되는 ‘야훼께서 너를 꾸짖으시기를’의 처리
  chosen_reading: 두 번의 반복을 그대로 살려, 말의 압박과 법정적 선언성을 유지했습니다.
  alternative_readings:
  - 한 번으로 줄여 자연스럽게 다듬기
  - 한 문장으로 합쳐 반복을 완화하기
  rationale: 히브리어 원문은 반복을 통해 선언의 강도를 높입니다. 이를 줄이면 본문이 지닌 재판적 공격성을 약화시키므로 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘사탄’의 번역 처리
  chosen_reading: 본문에는 ‘사탄’을 사용하고, 관사 있는 직함이라는 점은 주석 없이 본문 구조로만 드러냈습니다.
  alternative_readings:
  - ‘고발자’로 본문 번역
  - ‘대적’으로 본문 번역
  rationale: 한국어 독자에게 이 장면의 인물 식별을 해치지 않으면서도, 본문의 법정적 맥락은 반복된 꾸짖음과 직접 호칭으로 충분히 드러납니다.
  doctrine_reference: Translation philosophy §3
