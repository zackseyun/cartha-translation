base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
  footnotes:
  - marker: a
    text: Or, 'men who are a sign' or 'men of portent.'
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 들으십시오, 대제사장 여호수아여, 당신과 당신 앞에 앉아 있는 당신의 동료들이여. 당신들은 표징이 되는 사람들입니다[a]. 보십시오, 내가 내 종, 곧 순을 데려오고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “표징의 사람들” 또는 “징조의 사람들”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע נָא
  english_pob_choice: Hear now
  chosen_korean: 이제 들으십시오
  alternatives_korean:
  - 이제 들으라
  - 지금 들으십시오
  lexicon: HALOT
  rationale: שׁמע의 긴급한 호소를 살리되, נָא의 공손함을 현대 한국어의 합쇼체 명령으로 자연스럽게 반영했습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  lexicon: HALOT
  rationale: 히브리어 관직명은 한국어 성경에서 통용되는 ‘대제사장’이 가장 직접적이고 오해가 적습니다.
- source_word: אַנְשֵׁי מוֹפֵת
  english_pob_choice: men of sign
  chosen_korean: 표징의 사람들
  alternatives_korean:
  - 징조의 사람들
  - 표적의 사람들
  - 표징인 사람들
  lexicon: HALOT
  rationale: מוֹפֵת는 단순한 ‘기적’보다 하나님이 보여 주시는 표징·징조의 성격이 강하므로, 문맥의 상징성을 살려 ‘표징의 사람들’로 옮겼습니다.
- source_word: צֶמַח
  english_pob_choice: the Branch
  chosen_korean: 순
  alternatives_korean:
  - 가지
  - 싹
  - 브랜치
  lexicon: HALOT
  rationale: 예언서 내에서 צמח는 메시아적 칭호로 굳어진 용법이 있지만, 본문 자체의 식물 이미지도 남아 있어 한국어로는 ‘순’이 가장 절제되면서도 원문에 가까운 표현입니다.
theological_decisions:
- issue: צֶמַח를 제목적 칭호로 얼마나 드러낼지
  chosen_reading: 본문에는 ‘순’으로 두어 이미지의 개방성을 유지하고, 메시아적 함의는 본문 전체와 상호본문성에서 읽히도록 했습니다.
  alternative_readings:
  - 메시아적 칭호인 ‘순’
  - ‘가지’로 더 직역
  rationale: 이 절의 즉각적 초점은 야훼의 장차 오실 종을 소개하는 선언이므로, 해석을 과도하게 고정하기보다 원문이 허용하는 예언적 긴장감을 보존하는 편이 적절합니다.
  doctrine_reference: 예언/메시아 해석 원칙
