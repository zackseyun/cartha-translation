id: ZEC.3.5
reference: Zechariah 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֕ר יָשִׂ֛ימוּ צָנִ֥יף טָה֖וֹר עַל רֹאשׁ֑/וֹ וַ/יָּשִׂימוּ֩ הַ/צָּנִ֨יף הַ/טָּה֜וֹר עַל רֹאשׁ֗/וֹ וַ/יַּלְבִּשֻׁ֨/הוּ֙ בְּגָדִ֔ים וּ/מַלְאַ֥ךְ יְהוָ֖ה עֹמֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
  footnotes:
  - marker: a
    text: Or 'And I said.' The Hebrew conjunction can be rendered simply 'and'; 'then' reflects the narrative flow.
    reason: lexical_alternative
  - marker: b
    text: '''Clean'' may also be rendered ''pure,'' highlighting ritual purity.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'the angel of the LORD' is left untranslated beyond its plain sense; interpreters differ on whether it refers to a created angelic messenger or a manifestation of the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 말하였습니다[a], “정결한 관을 그의 머리에 씌우십시오.” 그래서 그들은 정결한 관을 그의 머리에 씌우고 그에게 옷을 입혔습니다[b][c]. 그때 야훼의 천사가 곁에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 내가 말하였습니다.’ 히브리어 접속사는 단순히 ‘그리고’로도 옮길 수 있으며, 여기서는 서술의 흐름을 살려 ‘그때’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정결한’은 의례적 순결을, ‘깨끗한’은 보다 일상적인 상태를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼의 천사’는 직역이며, 이 인물이 피조된 천사인지 야훼의 현현인지는 본문이 결정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 내가 말하였습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그때 내가 말하였습니다
  lexicon: WLC context; English POB audit trail
  rationale: 과거 서술의 진행을 자연스럽게 살리면서도 히브리어 1인칭 발화를 직접 반영하기 위해 평서형 과거를 택했습니다.
- source_word: צָנִיף טָהוֹר
  english_pob_choice: clean turban
  chosen_korean: 정결한 관
  alternatives_korean:
  - 깨끗한 터번
  - 순결한 관
  lexicon: HALOT; English POB audit trail
  rationale: צָנִיף은 머리에 두르는 제의적 머리쓰개이므로 ‘관’으로 옮기되, טָהוֹר는 의식적 정결을 드러내는 ‘정결한’으로 번역했습니다.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  english_pob_choice: clothed him with garments
  chosen_korean: 그에게 옷을 입혔습니다
  alternatives_korean:
  - 그를 옷으로 입혔습니다
  - 그에게 의복을 입혔습니다
  lexicon: HALOT
  rationale: 동사 הלביש의 기본 의미를 자연스러운 한국어로 살려 ‘옷을 입히다’로 옮겼고, בְּגָדִים는 문맥상 일반적인 ‘옷’으로 충분합니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: 예배적·신학적 전통어보다 본문이 가진 직접성을 살려 하나님의 이름은 프로젝트 기본값인 ‘야훼’로, מַלְאַךְ는 ‘천사’로 옮겼습니다.
theological_decisions:
- issue: מַלְאַךְ יְהוָה의 정체를 단정하지 않는 번역
  chosen_reading: ‘야훼의 천사’로 직역하여, 피조된 천사인지 야훼의 현현인지 본문이 열어 둔 긴장을 유지했습니다.
  alternative_readings:
  - ‘야훼의 사자’로 완화하기
  - ‘여호와의 천사’로 전통어를 따르기
  rationale: 이 구절 자체는 정체를 해명하지 않으므로, 번역에서 신학적 결론을 앞서 내리지 않고 원문의 모호성을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
