  naturalness: 초안의 문장 분리는 한국어로 가능하지만, ‘그때’가 본문에는 없고 각주에서만 번역어로 언급되어 불일치합니다. 또한 천사 관련 각주는 ‘옷’ 뒤보다 ‘야훼의 천사’에 직접 붙이는 것이 독자에게 자연스럽고 명확합니다. ‘의복을 입혔으며’는 현대의 격식 있는 성경 문체에 잘 맞습니다.
