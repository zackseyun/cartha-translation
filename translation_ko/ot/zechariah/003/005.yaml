  - 그때 내가 말하였습니다
  lexicon: WLC context; English POB audit trail
  rationale: 과거 서술의 진행을 자연스럽게 살리면서도 히브리어 1인칭 발화를 직접 반영하기 위해 평서형 과거를 택했습니다.
- source_word: צָנִיף טָהוֹר
  english_pob_choice: clean turban
  chosen_korean: 정결한 관
  alternatives_korean:
  - 깨끗한 터번
  - 순결한 관
  lexicon: HALOT; English POB audit trail
  rationale: צָנִיף은 머리에 두르는 제의적 머리쓰개이므로 ‘관’으로 옮기되, טָהוֹר는 의식적 정결을 드러내는 ‘정결한’으로 번역했습니다.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  english_pob_choice: clothed him with garments
  chosen_korean: 그에게 옷을 입혔습니다
  alternatives_korean:
  - 그를 옷으로 입혔습니다
  - 그에게 의복을 입혔습니다
  lexicon: HALOT
  rationale: 동사 הלביש의 기본 의미를 자연스러운 한국어로 살려 ‘옷을 입히다’로 옮겼고, בְּגָדִים는 문맥상 일반적인 ‘옷’으로 충분합니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: 예배적·신학적 전통어보다 본문이 가진 직접성을 살려 하나님의 이름은 프로젝트 기본값인 ‘야훼’로, מַלְאַךְ는 ‘천사’로 옮겼습니다.
theological_decisions:
- issue: מַלְאַךְ יְהוָה의 정체를 단정하지 않는 번역
  chosen_reading: ‘야훼의 천사’로 직역하여, 피조된 천사인지 야훼의 현현인지 본문이 열어 둔 긴장을 유지했습니다.
  alternative_readings:
  - ‘야훼의 사자’로 완화하기
  - ‘여호와의 천사’로 전통어를 따르기
  rationale: 이 구절 자체는 정체를 해명하지 않으므로, 번역에서 신학적 결론을 앞서 내리지 않고 원문의 모호성을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
