  naturalness: ‘그녀는 거기 제 자리에’보다 ‘그 여자는 거기 자기 받침대 위에’가 현대 표준어에서 더 자연스럽고 원문의 시각적 이미지를 보존합니다. ‘그 여자’를 반복하여 불필요하게 문어적인 ‘그녀’를 피했습니다.
