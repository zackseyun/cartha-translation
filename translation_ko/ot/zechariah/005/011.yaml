source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י לִ/בְנֽוֹת לָ֥/הֿ בַ֖יִת בְּ/אֶ֣רֶץ שִׁנְעָ֑ר וְ/הוּכַ֛ן וְ/הֻנִּ֥יחָה שָּׁ֖ם עַל מְכֻנָתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
  footnotes:
  - marker: a
    text: Or 'it will be set there on its base/pedestal.' The Hebrew feminine forms may be understood with reference to the woman called Wickedness, or more abstractly to the ephah/its contents.
    reason: alternative_reading
  - marker: b
    text: Shinar is the ancient name associated with Babylonia in the Old Testament.
    reason: cross_reference
translation:
  language: ko
  text: 그가 내게 말했습니다. 「그 여자[a]를 위하여 시날 땅[b]에 집을 지으려는 것입니다. 그것이 준비되면, 그 여자는 거기 자기 받침대 위에 놓일 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 여성형 표현은 앞서 보인 ‘그 여자’, 곧 의인화된 ‘악’을 가리킬 수도 있고, 더 추상적으로 에바나 그 안의 것을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 시날은 구약에서 바빌로니아와 연관되는 고대 지명입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그가 내게 말했습니다
  alternatives_korean:
  - 그리고 그가 내게 말했습니다
  - 그가 내게 이르렀습니다
  lexicon: WLC context; POB audit trail
  rationale: 대화 전환을 자연스럽게 드러내되, 히브리어 서술 흐름을 과도하게 풀지 않기 위해 간결한 서술로 옮겼습니다.
- source_word: לִבְנוֹת לָהּ בַּיִת
  english_pob_choice: To build a house for her
  chosen_korean: 그 여자를 위해 시날 땅에 집을 지으려는 것입니다
  alternatives_korean:
  - 그 여자에게 집을 지으려는 것입니다
  - 그 여자를 위한 집을 지으려는 것입니다
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 한국어 의도 표현으로 풀었고, 대상의 여성성을 유지하기 위해 ‘그 여자’를 살렸습니다.
- source_word: בְּאֶרֶץ שִׁנְעָר
  english_pob_choice: in the land of Shinar
  chosen_korean: 시날 땅에
  alternatives_korean:
  - 시날 땅에서
  - 바빌로니아 땅에
  lexicon: HALOT
  rationale: שִׁנְעָר는 지명으로서 음역을 유지하는 것이 맞아 ‘시날’로 옮겼고, 관용적인 ‘땅’을 붙여 히브리어 표현을 보존했습니다.
- source_word: וְהוּכַן
  english_pob_choice: when it is prepared
  chosen_korean: 그것이 준비되면
  alternatives_korean:
  - 준비되면
  - 그것이 갖추어지면
  lexicon: HALOT
  rationale: 문맥상 ‘집’이 준비되는 시점을 나타내므로 조건/시점 표현으로 자연스럽게 옮겼습니다.
- source_word: וְהֻנִּיחָה שָּׁם עַל מְכֻנָתָהּ
  english_pob_choice: she will be set there on her base
  chosen_korean: 그녀는 거기 제 자리에 놓일 것입니다
  alternatives_korean:
  - 그녀는 거기 그녀의 받침대 위에 놓일 것입니다
  - 그녀는 거기 제 받침 위에 놓일 것입니다
  lexicon: HALOT
  rationale: 여성형 어미를 유지해 인격화된 ‘그 여자/그녀’라는 이미지를 살렸고, מְכֻנָה는 본문이 허용하는 범위에서 ‘제 자리’로 옮겨 고정된 놓임의 의미를 담았습니다.
theological_decisions:
- issue: 최종 절의 여성형 지시 대상
  chosen_reading: 여성형 어미와 대명사는 앞서 본 환상 속 ‘그 여자’, 곧 의인화된 악의 인물을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 무생물적인 ‘그것’으로 보아 집이나 에바를 가리킨다고 읽을 수 있습니다.
  rationale: 직전 문맥이 ‘악인성/악’으로 불린 여인을 제시하므로, 여성 인칭을 살려 환상적 인격화를 보존하는 것이 본문 흐름에 가장 가깝습니다.
  doctrine_reference: 해석의 긴장을 평탄화하지 않고, 문맥상 우선되는 인칭성을 유지합니다.
