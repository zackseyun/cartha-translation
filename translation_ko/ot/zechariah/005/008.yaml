id: ZEC.5.8
reference: Zechariah 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ זֹ֣את הָ/רִשְׁעָ֔ה וַ/יַּשְׁלֵ֥ךְ אֹתָ֖/הּ אֶל תּ֣וֹךְ הָֽ/אֵיפָ֑ה וַ/יַּשְׁלֵ֛ךְ אֶת אֶ֥בֶן הָ/עֹפֶ֖רֶת אֶל פִּֽי/הָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
  footnotes:
  - marker: a
    text: Hebrew 'ephah,' a standard dry-measure container; here it refers to the basket-like vessel seen in the vision.
    reason: cultural_note
  - marker: b
    text: Or 'the lead weight' / 'the stone of lead.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to its mouth'; that is, to the opening of the ephah basket.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a], “이것은 악입니다.” 그리고 그가 그것을 에바 광주리 한가운데로 던졌으며[c][b], 납 덩이를 그 입구 위에 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 사본의 ‘이 에바’ 환상 문맥을 따라, 여기서는 단순한 말이 아니라 이상 중의 선언으로 읽힙니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘납의 돌’입니다. 문맥상 광주리를 덮는 무거운 납 물체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그 입에/입으로’입니다. 즉 광주리의 개구부를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  english_pob_choice: Wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악한 것
  - 악의 세력
  - 악함
  lexicon: HALOT
  rationale: 히브리어는 정관사 붙은 추상명사이지만, 비전 안에서 인격화된 대상을 가리킵니다. 한국어에서는 인격화 표시를 과도하게 풀지 않고, 간결한 ‘악’으로 옮겨 원문의 식별을 살렸습니다.
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  english_pob_choice: he threw her
  chosen_korean: 그가 그것을 …로 던졌으며
  alternatives_korean:
  - 그가 그녀를 던졌으며
  - 그가 그것을 내던졌으며
  - 그가 그것을 던졌으며
  lexicon: HALOT
  rationale: 여성형 목적어는 비전 속 인격화된 ‘악’을 가리키므로, 한국어에서는 자연스러운 지시대명사 ‘그것’을 써서 대상의 성별을 불필요하게 드러내지 않았습니다.
- source_word: הָאֵיפָה
  english_pob_choice: the ephah basket
  chosen_korean: 에바 광주리
  alternatives_korean:
  - 에바
  - 에바 바구니
  - 에바 그릇
  lexicon: HALOT
  rationale: 에바는 원래 부피 단위이지만 이 본문에서는 환상 속 용기입니다. POB의 ‘ephah basket’을 따라 단위를 살리되, 용기임을 분명히 하는 ‘광주리’를 붙였습니다.
- source_word: אֶבֶן הָעֹפֶרֶת
  english_pob_choice: the lead weight
  chosen_korean: 납 덩이
  alternatives_korean:
  - 납 무게추
  - 납 돌
  - 납석
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘납의 돌’이지만, 문맥상 광주리를 덮는 무거운 물체입니다. 한국어에서는 기능과 재질이 함께 드러나는 ‘납 덩이’가 가장 자연스럽습니다.
- source_word: אֶל־פִּיהָ
  english_pob_choice: onto its opening
  chosen_korean: 그 입구 위에
  alternatives_korean:
  - 그 입구에
  - 그 입구로
  - 그 입구 위로
  lexicon: HALOT
  rationale: ‘입’은 용기의 ‘입구’로 옮기는 것이 자연스럽고, 동작의 위치성을 살리기 위해 ‘위에’를 사용했습니다.
theological_decisions:
- issue: 비전 속 악의 인격화
  chosen_reading: ‘악’을 비전 속 인격화된 대상으로 보되, 추가 설명 없이 그 자체를 직접 진술하게 했습니다.
  alternative_readings:
  - ‘악한 여자’로 풀어 설명하기
  - ‘그 악함’처럼 더 추상적으로 번역하기
  rationale: 히브리어는 추상명사를 사용하지만, 문맥상 여인이 그 추상명사와 동일시됩니다. 한국어에서 성별·윤리적 해설을 덧붙이면 원문의 긴장과 상징성이 약해지므로, 원문의 식별을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
