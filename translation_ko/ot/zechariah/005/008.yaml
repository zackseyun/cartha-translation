  to: 그가 말했습니다. “이것은 악입니다.” 그가 그 여인을 에바 광주리 한가운데로 내던지고[a], 납 덩이를 그 입구 위에 내던졌습니다.[b][c]
  rationale: 여성형 목적어를 ‘그 여인’으로 회복하여 인격화된 악이라는 환상 장면을 보존했습니다. 문장을 현대적 합쇼체로 다듬고, 에바 문화 주석을 올바른 본문어에 연결했습니다. ‘납 덩이’는 문맥상 자연스러운 표현으로 유지하되, 각주에서 ‘납의 돌’이라는 히브리어의 구체적 표현을 밝혔습니다.
