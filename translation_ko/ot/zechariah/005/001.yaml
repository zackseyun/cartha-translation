  source_fidelity: ‘또’는 וָאָשׁוּב의 가능한 ‘다시’ 뉘앙스를 본문에 확정적으로 넣습니다. 원문의 기본 뜻과 영어 POB의 선택은 ‘돌아서서’이므로, ‘다시’ 가능성은 각주에만 남기는 것이 적절합니다. 그 밖에 ‘눈을 들어 보니’와 ‘보라’는 환상 서술의 연쇄와 현시 표지를 충실히 반영합니다.
  naturalness: ‘날아다니는’은 반복적으로 이리저리 나는 뉘앙스를 낼 수 있으므로, 단순히 공중을 나는 두루마리를 가리키는 분사 עָפָה에는 ‘날아가는’이 더 절제되고 자연스럽습니다. ‘보라’는 현대 일상문에서는 문어적이지만 예언서 환상 장면의 격식 있는 제시 표지로 적절합니다.
  terminology: מְגִלָּה는 ‘두루마리’가 정확합니다. ‘눈을 들다’는 נשׂא עֵינַי의 관용적 이미지를 잘 보존합니다.
