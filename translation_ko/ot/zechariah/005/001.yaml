base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/001.yaml
  text: Then I turned and lifted my eyes and saw[a], and behold[b], a flying scroll.
  footnotes:
  - marker: a
    text: Or 'a scroll that was flying.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'I turned' may also be understood as 'I turned again,' introducing the next vision scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 돌아서서 눈을 들어 보니, 보라, 날아가는 두루마리가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날고 있는 두루마리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘돌아서다’는 ‘다시 돌아서다’로 이해될 수도 있으며, 다음 환상 장면으로의 전환을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשׁוּב
  english_pob_choice: Then I turned
  chosen_korean: 내가 또 돌아서서
  alternatives_korean:
  - 내가 돌이켜
  - 내가 돌아서고
  lexicon: HALOT
  rationale: שוב은 이 환상 보고 문맥에서 물리적으로 ‘돌아서다’의 의미가 자연스럽고, POB가 허용한 ‘I turned again’의 중복 뉘앙스는 한국어 ‘또’로 간결하게 반영했습니다.
- source_word: וָאֶשָּׂא עֵינַי
  english_pob_choice: lifted my eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 높이 들어
  - 올려다보니
  lexicon: HALOT
  rationale: ‘눈을 들다’는 히브리어 관용구 נשׂא עינים을 표준적으로 살리는 표현으로, 원문의 이미지와 현대 한국어의 자연스러움을 함께 유지합니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보니
  - 그런데
  lexicon: HALOT
  rationale: הִנֵּה의 시각적·극적 제시 기능을 살리기 위해 ‘보라’를 사용했습니다. 문어적이지만 예언 환상 서술의 긴박함을 잘 전달합니다.
- source_word: מְגִלָּה עָפָה
  english_pob_choice: a flying scroll
  chosen_korean: 날아다니는 두루마리
  alternatives_korean:
  - 나는 두루마리
  - 날고 있는 두루마리
  lexicon: HALOT
  rationale: מְגִלָּה는 ‘두루마리’가 가장 자연스럽고, עָפָה는 현재 진행적 속성을 살려 ‘날아다니는’으로 옮겼습니다. POB의 ‘flying scroll’처럼 속성적 결합을 유지했습니다.
theological_decisions:
- issue: 환상 서술에서의 시간·전환 표지
  chosen_reading: ‘또 돌아서서’와 ‘보라’로 다음 환상의 장면 전환과 현시의 긴박함을 드러냈습니다.
  alternative_readings:
  - ‘그때 내가 돌아서서’
  - ‘내가 다시 돌아서서’
  rationale: 이 절은 설명보다 장면 전환이 핵심이므로, 서술의 흐름과 시각적 충격을 동시에 살리는 쪽을 택했습니다.
  doctrine_reference: 예언서 환상 서술의 문학적 형식
