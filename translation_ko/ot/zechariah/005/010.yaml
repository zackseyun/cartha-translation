id: ZEC.5.10
reference: Zechariah 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֕ר אֶל הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י אָ֛נָה הֵ֥מָּה מֽוֹלִכ֖וֹת אֶת הָ/אֵיפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/010.yaml
  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
  footnotes:
  - marker: a
    text: Or “the basket” or “the measuring basket.” The Hebrew says “the ephah,” a standard dry measure, here referring to the container seen in the vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 내게 말하고 있던 천사에게 물었습니다. 「그들이 에바를 어디로 가져갑니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에바’는 여기서 표준 건량 단위 자체보다, 앞서 보인 환상 속 그릇을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 내가 … 물었습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그래서 내가 말했습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행을 한국어의 자연스러운 과거 서술로 옮기되, 대화 도입이므로 ‘말했습니다’보다 질문 동사로 바로 이어 주는 것이 문맥에 맞습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 메신저
  - 사자
  lexicon: HALOT
  rationale: 스가랴의 환상 장면에서 이 인물은 초자연적 해석자이므로 ‘천사’가 가장 분명한 대응어입니다.
- source_word: הַדֹּבֵר בִּי
  english_pob_choice: who was speaking with me
  chosen_korean: 내게 말하고 있던
  alternatives_korean:
  - 나와 말하고 있던
  - 나에게 말하던
  lexicon: HALOT
  rationale: בִּי를 직역해 ‘안에서’로 옮기기보다, POB의 영어 처리처럼 반복 공식의 관용적 뜻인 ‘with me’ 관계를 살려 ‘내게 말하고 있던’으로 옮겼습니다.
- source_word: אֶת הָאֵיפָה
  english_pob_choice: the ephah
  chosen_korean: 에바
  alternatives_korean:
  - 되
  - 측량 바구니
  lexicon: HALOT
  rationale: אֵיפָה는 원래 건조량 단위이지만 여기서는 환상 속 용기를 가리키므로, 본문과의 연속성을 위해 음역 ‘에바’를 유지했습니다.
theological_decisions:
- issue: 말하는 주체와 시점의 자연스러운 한국어 표현
  chosen_reading: 직접화법 도입을 ‘그때’와 과거형으로 자연화하되, 환상 대화의 즉시성을 유지했습니다.
  alternative_readings:
  - ‘그리고 내가 말했습니다’
  - ‘그래서 내가 말했습니다’
  rationale: 본문은 서술 진행과 질문이 연속되는 환상 장면이므로, 과도하게 문어적으로 만들지 않고 읽기 쉬운 합쇼체로 유지하는 것이 본문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 서사 문맥 보존
