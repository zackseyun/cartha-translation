base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
  footnotes:
  - marker: a
    text: A cubit was a standard ancient unit of length, roughly the distance from the elbow to the fingertips.
    reason: cultural_note
translation:
  language: ko
  text: 그가 제게 말했습니다. “무엇을 보십니까?” 제가 말했습니다. “저는 날아가는 두루마리를 봅니다. 그 길이는 이십 규빗[a]이고, 너비는 십 규빗입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 규빗은 고대에 쓰이던 표준 길이 단위로, 대략 팔꿈치에서 손끝까지의 거리였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְגִלָּה
  english_pob_choice: scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 두루마리책
  - 책
  lexicon: HALOT
  rationale: מְגִלָּה는 말려 있는 기록 문서를 가리키므로, 한국어에서는 문맥상 가장 자연스럽고 직역에 가까운 ‘두루마리’가 적합합니다.
- source_word: עָפָה
  english_pob_choice: flying
  chosen_korean: 날아가는
  alternatives_korean:
  - 나는
  - 공중을 나는
  lexicon: HALOT
  rationale: 분사형 동사가 두루마리를 수식하며 움직이는 모습을 나타내므로, ‘날아가는’이 간결하면서도 시각적 이미지를 살립니다.
- source_word: עֶשְׂרִים בָּאַמָּה / עֶשֶׂר בָּאַמָּה
  english_pob_choice: twenty cubits / ten cubits
  chosen_korean: 이십 규빗 / 십 규빗
  alternatives_korean:
  - 스무 규빗 / 열 규빗
  - 20큐빗 / 10큐빗
  lexicon: HALOT
  rationale: אַמָּה는 성서적 길이 단위이므로 환산하지 않고 ‘규빗’을 유지해 원문의 문화적·정확한 감각을 보존했습니다.
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그가 제게 말했습니다
  alternatives_korean:
  - 그리고 그가 제게 말했습니다
  - 그가 내게 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리면서도 현대 한국어의 자연스러운 대화체로 옮기기 위해 ‘제게 말했습니다’를 택했습니다.
