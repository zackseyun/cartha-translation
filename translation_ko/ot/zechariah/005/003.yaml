source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
  footnotes:
  - marker: a
    text: Or “over the face of the whole earth.” Hebrew אֶרֶץ can mean either “land” or “earth.”
    reason: alternative_reading
  - marker: b
    text: Literally, “from this according to it … from that according to it,” likely referring to what is written on each side of the flying scroll.
    reason: lexical_alternative
  - marker: c
    text: Or “will be cleared away” / “will be cut off.” The Hebrew verb carries judicial force here in the context of the curse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 제게 말씀하셨습니다. “이것은 온 땅 위로 나가는 저주입니다. 도둑질하는 사람은 이 편에 있는 것에 따라, 거짓 맹세하는 사람은 저편에 있는 것에 따라 깨끗이 제거될 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 여기서 ‘땅’이나 ‘세상’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘이것으로부터 … 저것으로부터’라는 평행 표현으로, 두루마리의 양면을 가리키는 말로 보입니다.
    reason: source_note
  - marker: c
    text: נִקָּה는 여기서 ‘깨끗하게 되다’보다 ‘심판 아래서 제거되다’에 가깝습니다.
    reason: theological_note
lexical_decisions:
- source_word: הָאָלָה
  english_pob_choice: the curse
  chosen_korean: 저주
  alternatives_korean:
  - 맹세의 저주
  - 저주 선고
  lexicon: HALOT
  rationale: 문맥상 날아가는 두루마리가 언약적 심판을 선포하므로, אָלָה는 단순한 ‘맹세’보다 ‘저주’가 더 직접적입니다.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: over the face of the whole land
  chosen_korean: 온 땅 위로
  alternatives_korean:
  - 온 땅의 표면 위로
  - 온 세상 위로
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 공동체적·지역적 범위의 ‘땅’이 자연스럽고, 문맥의 심판 대상도 그 범위에 맞습니다.
- source_word: מִזֶּה ... כָּמוֹהָ
  english_pob_choice: according to what is on this side of it / on that side of it
  chosen_korean: 이 편에 있는 것에 따라 / 저편에 있는 것에 따라
  alternatives_korean:
  - 이쪽의 그것에 따라 / 반대쪽의 그것에 따라
  - 이 면에 적힌 것에 따라 / 저 면에 적힌 것에 따라
  lexicon: HALOT
  rationale: 히브리어는 두루마리의 양면을 가리키는 대구적 표현으로 보이므로, 설명을 과도하게 덧붙이지 않으면서 양면 대비를 살렸습니다.
- source_word: נִקָּה
  english_pob_choice: will be cleared away
  chosen_korean: 깨끗이 제거될 것입니다
  alternatives_korean:
  - 제거될 것입니다
  - 깨끗하게 될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 무죄 선언이 아니라 저주 아래서의 제거를 뜻하므로, ‘제거’로 심판성을 살리되 ‘깨끗이’로 נקה의 어감을 반영했습니다.
theological_decisions:
- issue: 심판 맥락에서 נִקָּה의 의미
  chosen_reading: 죄인이 심판 아래서 제거되는 뜻으로 이해했습니다.
  alternative_readings:
  - 무죄로 석방된다
  - 단순히 씻겨 깨끗해진다
  rationale: 본문은 저주가 나가는 장면이므로, 긍정적 면죄나 일반적 정결보다 언약적 심판의 제거 의미가 우선합니다.
  doctrine_reference: 예언서의 언약적 심판과 정결의 긴장
- issue: ‘온 땅’의 범위
  chosen_reading: 포로 귀환 공동체를 향한 지역적·언약적 범위로 옮겼습니다.
  alternative_readings:
  - 온 세상
  - 온 지면
  rationale: 아모스적 보편성보다 스가랴의 회복 공동체 문맥이 더 직접적이어서 ‘땅’으로 두었습니다.
  doctrine_reference: 포로 귀환 이후의 언약 공동체 심판
