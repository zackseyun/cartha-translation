language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
  footnotes:
  - marker: a
    text: Or, 'the measuring basket.' An ephah was a standard dry measure and here refers to the container seen in the vision.
    reason: lexical_alternative
  - marker: b
    text: Or, 'between the earth and heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 눈을 들어 보니, 보라, 두 여자가 나오고 있었습니다. 바람이 그들의 날개에 있었고, 그들에게는 학의 날개와 같은 날개가 있었습니다. 그들은 땅과 하늘 사이에서 에바를 들어 올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '측량 바구니'. 에바는 표준 마른 곡식의 부피 단위이며, 여기서는 환상 속에 보인 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '땅과 하늘 사이에서'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  english_pob_choice: Then I lifted up my eyes
  chosen_korean: 내가 눈을 들어 보니
  alternatives_korean:
  - 내가 눈을 올려 보니
  - 내가 눈을 들어 올리니
  lexicon: HALOT
  rationale: 히브리어의 예언적 시각 보고 관용구를 자연스러운 한국어로 살리되, 환상 서술의 전개를 보여 주는 '보니'를 써서 시각적 발견감을 유지했습니다.
- source_word: וָאֵרֶא וְהִנֵּה
  english_pob_choice: and saw, and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 원문의 הִנֵּה가 주는 돌발적 주의 환기를 한국어의 감탄적 도입어 '보라'로 압축해 환상 장면의 생동감을 살렸습니다.
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  english_pob_choice: and the wind was in their wings
  chosen_korean: 바람이 그들의 날개에 있었고
  alternatives_korean:
  - 그들의 날개에 바람이 있었고
  - 영이 그들의 날개에 있었고
  lexicon: HALOT
  rationale: 환상 속 비행 이미지와 이어지는 문맥상 רוּחַ는 '바람'이 가장 직접적이므로, 신학적 의미의 '영'은 배제하고 물리적 운동성을 드러냈습니다.
- source_word: כְּכַנְפֵי הַחֲסִידָה
  english_pob_choice: like the wings of a stork
  chosen_korean: 학의 날개와 같은 날개
  alternatives_korean:
  - 황새의 날개와 같은 날개
  - 학처럼 생긴 날개
  lexicon: HALOT
  rationale: חֲסִידָה는 한국어에서 일반적으로 '황새'지만, 본문이 새의 외형을 비유적으로 말하므로 비교 구조를 분명히 하기 위해 '같은 날개'로 옮겼습니다.
- source_word: אֵיפָה
  english_pob_choice: the ephah
  chosen_korean: 에바
  alternatives_korean:
  - 에바 단위
  - 측량 바구니
  lexicon: HALOT
  rationale: 앞선 절들과의 어휘 연속성을 위해 표준 측량 단위명 '에바'를 유지하고, 장면 속 사물을 과도하게 풀이하지 않았습니다.
theological_decisions:
- issue: רוּחַ의 의미
  chosen_reading: 바람
  alternative_readings:
  - 영
  - 성령
  rationale: 날개, 황새 비유, 공중 이동의 맥락이 물리적 추진력을 가리키므로, 독자가 영적 인격체를 연상하지 않도록 '바람'으로 일관되게 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 지리적 대조 표현
  chosen_reading: 땅과 하늘 사이
  alternative_readings:
  - 땅과 하늘 사이에서
  - 땅과 하늘 사이로
  rationale: 원문의 공간 대비를 그대로 살리되 한국어 문장으로는 목적지보다는 위치 관계를 강조하는 표현이 자연스러워, 시각적 장면을 유지하는 방향으로 처리했습니다.
  doctrine_reference: Translation philosophy §1
