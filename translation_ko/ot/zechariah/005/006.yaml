source:
  edition: WLC
  text: וָ/אֹמַ֖ר מַה הִ֑יא וַ/יֹּ֗אמֶר זֹ֤את הָֽ/אֵיפָה֙ הַ/יּוֹצֵ֔את וַ/יֹּ֕אמֶר זֹ֥את עֵינָ֖/ם בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
  footnotes:
  - marker: a
    text: Or 'This is the ephah that is going out.' The Hebrew term refers to an ephah-measure and, by extension, the measuring container itself.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'This is their eye in all the land.' Many understand the sense as 'their appearance' or 'what is seen of them'; others, following an alternative reading or interpretation, render 'their iniquity in all the land.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 말했습니다. “그것이 무엇입니까?” 그가 말했습니다. “이것은 나가는 바구니[a]입니다.” 그가 말했습니다. “이것은 온 땅에서의 그들의 모습입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나가는 에바’. 히브리어 אֵיפָה는 문자적으로 에바라는 곡물 측량 단위를 가리키며, 여기서는 그 측량 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이것은 온 땅에서 그들의 눈이다’입니다. 문맥상 ‘그들의 모습’ 또는 ‘그들에게 보이는 것’으로 이해하기도 합니다. 다른 독법이나 해석을 따르면 ‘그들의 죄악’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה הִיא
  english_pob_choice: What is it?
  chosen_korean: 그것이 무엇입니까?
  alternatives_korean:
  - 이것이 무엇입니까?
  - 무엇입니까?
  lexicon: HALOT
  rationale: 여성형 지시대명사에 맞춰 ‘그것’보다 ‘이것’도 가능하지만, 한국어에서는 사물 자체를 묻는 중립적 표현인 ‘그것이 무엇입니까?’가 가장 자연스럽습니다.
- source_word: אֵיפָה
  english_pob_choice: basket
  chosen_korean: 바구니
  alternatives_korean:
  - 에바
  - 측량 바구니
  - 용기
  lexicon: HALOT
  rationale: 본문의 אֵיפָה는 문자적으로는 에바 단위이지만, 환상 속에서는 실제로 보이는 측량 용기를 가리키므로 ‘바구니’로 풀어 옮겨 가시적인 물체를 살렸습니다.
- source_word: הַיּוֹצֵאת
  english_pob_choice: that is going out
  chosen_korean: 나가는
  alternatives_korean:
  - 나아가는
  - 밖으로 나가는
  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 분사이므로 ‘나가는’이 가장 간결하고 자연스럽습니다.
- source_word: עֵינָם
  english_pob_choice: their appearance
  chosen_korean: 그들의 모습
  alternatives_korean:
  - 그들의 눈
  - 그들의 ظاهر
  - 그들의 나타남
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그들의 눈’이지만, 문맥상 보이는 형상이나 외관을 뜻하는 것으로 이해되는 점을 살려 ‘모습’으로 번역했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 עֵינָם 처리
  chosen_reading: 주 본문은 ‘그들의 모습’으로 두고, ‘그들의 눈’이나 ‘그들의 죄악’은 본문 밖 해석으로 남깁니다.
  alternative_readings:
  - 그들의 눈
  - 그들의 죄악
  rationale: MT의 표면형을 훼손하지 않으면서도, 문맥상 자연스러운 의미를 전달해야 하므로 본문에는 ‘모습’을 두고, 해석적으로 확장되는 독법은 본문 밖으로 제한합니다.
  doctrine_reference: 원문 우선 원칙을 유지하고, 해석상 긴장을 본문 안에서 성급히 해소하지 않습니다.
