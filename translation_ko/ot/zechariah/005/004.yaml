  text: הוֹצֵאתִ֗י/הָ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/בָ֨אָה֙ אֶל בֵּ֣ית הַ/גַּנָּ֔ב וְ/אֶל בֵּ֛ית הַ/נִּשְׁבָּ֥ע בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/לָ֨נֶה֙ בְּ/ת֣וֹךְ בֵּית֔/וֹ וְ/כִלַּ֖תּ/וּ וְ/אֶת עֵצָ֥י/ו וְ/אֶת אֲבָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
  footnotes:
  - marker: a
    text: Or 'I have brought it forth.' The Hebrew verb can be rendered more literally this way, but here it carries the sense of sending the curse out to do its work.
    reason: lexical_alternative
  - marker: b
    text: Or 'and it will lodge' or 'spend the night.' The Hebrew verb suggests remaining in the house rather than merely entering it.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 내보냈습니다[a] — 만군의 야훼의 말씀입니다 — 그것이 도둑의 집과 내 이름으로 거짓 맹세하는 자의 집에 들어가서, 그의 집 안에 머물며 그것을 삼키고[b], 그 나무와 돌까지도 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그것을 꺼내었습니다.’ 히브리어 동사는 더 문자적으로 이렇게도 옮길 수 있으나, 여기서는 저주를 밖으로 보내 그 일을 하게 한다는 뜻을 가집니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘머물러’ 혹은 ‘밤을 지내며.’ 히브리어 동사는 단지 들어가는 것이 아니라 집 안에 남아 있는 지속성을 시사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  english_pob_choice: I have sent it out
  chosen_korean: 내가 그것을 내보냈습니다
  alternatives_korean:
  - 내가 그것을 꺼내었습니다
  - 내가 그것을 가져냈습니다
  lexicon: HALOT
  rationale: 히필 완료형 1인칭 단수는 하나님의 능동적 조치를 나타내므로, 판단의 실체를 밖으로 보내어 작동하게 한다는 뜻을 살려 ‘내보냈습니다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼의 말씀입니다
  alternatives_korean:
  - 만군의 야훼께서 말씀하십니다
  - 만군의 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식 נאם은 현대 한국어에서 ‘말씀입니다’가 자연스럽고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בֵּית הַגַּנָּב ... הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  english_pob_choice: the house of the thief ... the one who swears falsely by my name
  chosen_korean: 도둑의 집 ... 내 이름으로 거짓 맹세하는 자
  alternatives_korean:
  - 도둑의 집 ... 내 이름으로 거짓되이 맹세하는 자
  - 도둑의 집 ... 내 이름을 걸고 거짓말하는 자
  lexicon: HALOT
  rationale: גנב은 ‘도둑’이 가장 직접적이며, ‘거짓 맹세’는 하나님의 이름을 이용한 언약적 위반을 분명하게 드러냅니다.
- source_word: וְלָנֶה בְּתוֹךְ בֵּיתוֹ
  english_pob_choice: and it will remain within his house
  chosen_korean: 그의 집 안에 머물며
  alternatives_korean:
  - 그의 집 안에 머무르며
  - 그의 집 안에 머물러
  lexicon: HALOT
  rationale: לון은 단순 진입이 아니라 ‘머묾/숙박’의 지속성을 가지므로, 저주가 집 안에 계속 남아 있다는 의미를 살렸습니다.
- source_word: וְכִלַּתּוּ וְאֶת עֵצָיו וְאֶת אֲבָנָיו
  english_pob_choice: and consume it, both its timber and its stones
  chosen_korean: 그것을 삼키고, 그 나무와 돌까지도 삼킬 것입니다
  alternatives_korean:
  - 그것을 멸하고, 그 나무와 돌까지도 멸할 것입니다
  - 그것을 먹어 치우고, 그 나무와 돌까지도 먹어 치울 것입니다
  lexicon: HALOT
  rationale: כלה의 강한 소진·파괴 이미지를 살리기 위해 ‘삼키다’를 택했으며, 뒤의 목재와 돌은 건물 전체의 철저한 붕괴를 구체화합니다.
