  lexicon: HALOT
  rationale: 관용구 ‘눈을 들다’를 유지하면서 נָא의 간청/정중 어감을 ‘부디’로 살렸고, 뒤의 명령형은 직접 인용 안에서 자연스럽게 반말형으로 처리했습니다.
- source_word: הַיּוֹצֵאת הַזֹּאת
  english_pob_choice: what this is that is coming out
  chosen_korean: 이것, 곧 나오는 것이 무엇인지
  alternatives_korean:
  - 이것, 곧 나가고 있는 것이 무엇인지
  - 무엇이 나오는 것인지
  lexicon: HALOT
  rationale: 여성형 분사 הַיּוֹצֵאת의 진행성을 ‘나오는’으로 살리고, 지시대명사 הַזֹּאת를 ‘이것’으로 앞에 두어 보이는 대상을 분명히 했습니다.
theological_decisions:
- issue: 환상 대화 속 직접 화법의 높임말 수준
  chosen_reading: 천사의 말은 예언적/환상적 직접 인용으로, 한국어에서는 명령형 반말을 사용하되 전체 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접 인용 전체를 합쇼체로 유지
  - 명령형을 더 공손한 ‘보십시오’로 변경
  rationale: 히브리어 원문은 간청형 명령을 그대로 전달하므로, 인물 간 대화의 긴장을 보존하는 쪽이 본문 효과를 더 잘 드러냅니다.
  doctrine_reference: Narrative speech register; direct discourse conventions
