language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֕א הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י וַ/יֹּ֣אמֶר אֵלַ֔/י שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מָ֖ה הַ/יּוֹצֵ֥את הַ/זֹּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
  footnotes:
  - marker: a
    text: Or “went out” / “came out”; the Hebrew verb is the common motion verb יָצָא.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “the angel who was speaking in me,” an idiom here meaning “with me.”
    reason: lexical_alternative
  - marker: c
    text: Or “what is this that is going out?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나와 말하던 천사가 나가서 나에게 말했습니다. “부디 눈을 들어 보아라. 이것, 곧 나오는 것이 무엇인지 보아라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나갔다” / “나와 있었다”; 히브리어 동사 יָצָא는 흔한 이동 동사입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “내 안에서 말하던 천사”이지만, 여기서는 “나와”라는 관용적 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “이것, 곧 나가고 있는 것이 무엇인지”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 나와서
  - 나갔고
  lexicon: HALOT
  rationale: יצא의 기본 의미인 ‘나가다/나오다’를 살리되, 여기서는 천사가 시야를 바꾸며 앞으로 나서는 흐름이 자연스럽게 드러나도록 ‘나가서’로 옮겼습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: HALOT
  rationale: 이 환상 문맥에서 해석 역할을 하는 존재이므로 ‘사자’보다 ‘천사’가 의미를 분명히 전달합니다.
- source_word: הַדֹּבֵר בִּי
  english_pob_choice: who was speaking with me
  chosen_korean: 나와 말하던
  alternatives_korean:
  - 나에게 말하던
  - 내 안에서 말하던
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘내 안에서’는 한국어에서 오해를 부를 수 있어, 환상 대화의 관용적 의미를 살린 ‘나와 말하던’으로 옮겼습니다.
- source_word: שָׂא נָא עֵינֶיךָ
  english_pob_choice: Please lift up your eyes
  chosen_korean: 부디 눈을 들어 보아라
  alternatives_korean:
  - 제발 눈을 들어 보아라
  - 눈을 들어 보십시오
  lexicon: HALOT
  rationale: 관용구 ‘눈을 들다’를 유지하면서 נָא의 간청/정중 어감을 ‘부디’로 살렸고, 뒤의 명령형은 직접 인용 안에서 자연스럽게 반말형으로 처리했습니다.
- source_word: הַיּוֹצֵאת הַזֹּאת
  english_pob_choice: what this is that is coming out
  chosen_korean: 이것, 곧 나오는 것이 무엇인지
  alternatives_korean:
  - 이것, 곧 나가고 있는 것이 무엇인지
  - 무엇이 나오는 것인지
  lexicon: HALOT
  rationale: 여성형 분사 הַיּוֹצֵאת의 진행성을 ‘나오는’으로 살리고, 지시대명사 הַזֹּאת를 ‘이것’으로 앞에 두어 보이는 대상을 분명히 했습니다.
theological_decisions:
- issue: 환상 대화 속 직접 화법의 높임말 수준
  chosen_reading: 천사의 말은 예언적/환상적 직접 인용으로, 한국어에서는 명령형 반말을 사용하되 전체 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접 인용 전체를 합쇼체로 유지
  - 명령형을 더 공손한 ‘보십시오’로 변경
  rationale: 히브리어 원문은 간청형 명령을 그대로 전달하므로, 인물 간 대화의 긴장을 보존하는 쪽이 본문 효과를 더 잘 드러냅니다.
  doctrine_reference: Narrative speech register; direct discourse conventions
