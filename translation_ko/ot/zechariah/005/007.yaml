  terminology: ‘에바’는 문화·계량 용어로 유지하고 주석에서 용기 용법을 설명했습니다. כִּכַּר עֹפֶרֶת는 ‘납 원반’으로 옮겼으며, ‘덮개’라는 문맥상 기능과 ‘달란트’라는 직역 가능성은 주석에 남겼습니다.
