  source_fidelity: 원문의 וְהִנֵּה는 환상 속 장면을 새롭게 가리키는 표현이므로 ‘그런데 보니’의 역접적 뉘앙스는 근거가 약합니다. כִּכַּר עֹפֶרֶת는 문맥상 에바를 덮고 있던 납 물체이지만, 어휘 자체는 ‘덮개’보다 둥근 납 덩어리/원반을 더 직접적으로 가리킵니다. ‘납 원반’과 주석은 이 기능과 어휘적 여지를 함께 보존합니다. ‘에바 안에 앉아 있는 한 여자’는 אִשָּׁה אַחַת יוֹשֶׁבֶת בְּתוֹךְ הָאֵיפָה를 자연스럽고 충실하게 옮깁니다.
