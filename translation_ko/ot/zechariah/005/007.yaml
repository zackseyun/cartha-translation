  text: וְ/הִנֵּ֛ה כִּכַּ֥ר עֹפֶ֖רֶת נִשֵּׂ֑את וְ/זֹאת֙ אִשָּׁ֣ה אַחַ֔ת יוֹשֶׁ֖בֶת בְּ/ת֥וֹךְ הָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/007.yaml
  text: And behold[a], a lead disk was lifted up[b], and this was one woman sitting inside the ephah.
  footnotes:
  - marker: a
    text: Or 'a round lead weight,' 'a disk of lead,' or more literally 'a talent of lead.' The Hebrew expression can denote a heavy round mass of lead; here it appears to function as the ephah's cover.
    reason: lexical_alternative
  - marker: b
    text: An ephah was a dry measure and, by extension, the container used for it; hence some render 'basket.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 납 원반[a]이 들어 올려졌고, 에바[b] 안에는 한 여자가 앉아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘납 원반’으로 옮긴 히브리어 표현은 납으로 된 둥근 덩어리나 원반을 가리킬 수 있으며, 더 문자적으로는 ‘납 한 달란트’로 이해될 수도 있습니다. 여기서는 에바를 덮고 있던 물체로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에바’는 건조 부피를 재는 단위이며, 여기서는 그 단위를 담는 용기를 가리킵니다. 따라서 어떤 번역은 ‘바구니’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그런데 보니
  alternatives_korean:
  - 보라
  - 보니
  lexicon: HALOT
  rationale: 예언 환상의 갑작스러운 전환과 시각적 발견을 한국어로 자연스럽게 살리면서도, 단순 설명보다 ‘보니’의 즉각성을 유지했습니다.
- source_word: כִּכַּר עֹפֶרֶת
  english_pob_choice: a lead cover
  chosen_korean: 납 덮개
  alternatives_korean:
  - 납 원반
  - 납 추
  - 납 덩어리
  lexicon: HALOT
  rationale: 문맥에서 이것은 에바를 덮는 역할을 하므로 기능을 드러내는 ‘덮개’를 택했습니다. ‘납’으로 재질을 반영하고, 원형·무게의 뉘앙스는 주석으로 보존할 수 있습니다.
- source_word: אֵיפָה
  english_pob_choice: the ephah
  chosen_korean: 에바
  alternatives_korean:
  - 에바 그릇
  - 바구니
  lexicon: HALOT
  rationale: 히브리어 문화 항목을 그대로 살려 환상의 구체성을 유지했습니다. 독자 이해를 위해 본문에서는 음역을 유지하고, 필요 시 주석에서 계량 단위이자 용기라는 점을 설명할 수 있습니다.
