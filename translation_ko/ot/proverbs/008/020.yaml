  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אֹֽרַח צְדָקָ֥ה אֲהַלֵּ֑ך בְּ֝/ת֗וֹךְ נְתִיב֥וֹת מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/020.yaml
  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
  footnotes:
  - marker: a
    text: Or 'in the way of justice ... among the paths of judgment.' The Hebrew terms צְדָקָה and מִשְׁפָּט overlap semantically, but the main text preserves their poetic distinction as 'righteousness' and 'justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 의의 길로 걷고, 정의의 길들 한가운데에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의의 길에서 … 정의의 길들 가운데서’. 히브리어 צְדָקָה와 מִשְׁפָּט는 의미가 겹치지만, 본문은 시적 구별을 살려 ‘의’와 ‘정의’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹרַח
  english_pob_choice: in the way of
  chosen_korean: 의 길로
  alternatives_korean:
  - 의 길에서
  - 의 길 안에서
  lexicon: HALOT
  rationale: אֹרַח은 비유적으로 ‘길/삶의 방식’을 뜻하므로 ‘의 길’로 옮겨 지혜문학의 도덕적 행로 이미지를 살렸습니다. 조사 ב는 이동의 방향성을 살려 ‘-로’로 처리했습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 올바름
  lexicon: HALOT
  rationale: 이 구절에서는 מִשְׁפָּט와의 병렬 속에서 개인적·도덕적 올바름을 나타내므로 ‘의’가 가장 직접적입니다. 영어 POB가 ‘righteousness’를 택한 구분도 반영했습니다.
- source_word: בְּ/תוֹךְ נְתִיבוֹת
  english_pob_choice: in the midst of the paths of
  chosen_korean: … 한가운데에
  alternatives_korean:
  - … 가운데에
  - … 속에
  lexicon: HALOT
  rationale: תּוֹךְ의 ‘한가운데’라는 공간적 이미지를 살려 병렬 구조를 유지했습니다. נְתִיבוֹת는 앞의 אֹרַח과 같은 의미권의 복수형이므로 뒤 문장에서는 중복을 피하면서도 공간감만 드러내도록 했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 심판
  lexicon: HALOT
  rationale: 여기서는 משפט의 사법적·사회적 공정성을 강조하는 의미가 مناسب하여 ‘정의’로 옮겼습니다. POB가 ‘justice’를 유지해 צְדָקָה와의 구별을 보존한 점을 따랐습니다.
theological_decisions:
- issue: צְדָקָה와 מִשְׁפָּט의 병렬을 어떻게 구분할지
  chosen_reading: ‘의’와 ‘정의’로 구분하여, 지혜가 단지 올바른 원칙이 아니라 도덕적 올바름과 공정한 판단의 영역 모두 안에서 걸음을 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 둘 다 ‘공의’로 통일
  - 둘 다 ‘의와 정의’의 관용구로 처리
  rationale: 히브리어는 두 용어가 의미적으로 겹치지만 시적 병렬을 통해 구별도 유지합니다. 본문이 그 차이를 드러내도록 번역하는 편이 지혜시의 수사와 더 잘 맞습니다.
  doctrine_reference: 잠언의 지혜시적 평행법과 משפט/צדקה의 의미 영역
