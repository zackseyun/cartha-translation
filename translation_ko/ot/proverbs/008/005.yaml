base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
  footnotes:
  - marker: a
    text: 'Hebrew: ''heart.'' Here ''heart'' refers to the inner faculty of understanding and judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 이들아, 분별을 배우십시오. 그리고 미련한 이들아, 이해를 배우십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 '마음'입니다. 여기서 '마음'은 이해와 판단의 내적 기능을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  english_pob_choice: Learn
  chosen_korean: 배우십시오
  alternatives_korean:
  - 이해하십시오
  - 분별하십시오
  - 깨닫으십시오
  lexicon: HALOT
  rationale: בין의 명령형은 '이해하다/분별하다'를 뜻하지만, 지혜문학의 권면 문맥에서는 반복되는 명령을 자연스러운 한국어 권유형으로 옮기는 것이 적절하므로 '배우십시오'를 택했습니다.
- source_word: פְתָאיִם
  english_pob_choice: simple ones
  chosen_korean: 어리석은 이들
  alternatives_korean:
  - 단순한 이들
  - 미숙한 이들
  - 순진한 이들
  lexicon: HALOT
  rationale: פתי는 지적 결핍보다 미숙함·순진함·경솔함의 범주를 가리키므로, 한국어에서는 독자를 직접 부르는 복수 호격으로 '어리석은 이들'이 문맥상 가장 자연스럽습니다.
- source_word: עָרְמָה
  english_pob_choice: prudence
  chosen_korean: 분별
  alternatives_korean:
  - 신중함
  - 지혜로운 분별
  - 슬기
  lexicon: HALOT
  rationale: 지혜문학에서 עָרְמָה는 부정적 '교활함'이 아니라 사려 깊은 판단을 뜻하므로, 그 기능적 의미를 살려 '분별'로 옮겼습니다.
- source_word: לֵב
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 마음
  - 마음의 이해
  - 중심
  lexicon: HALOT
  rationale: לֵב은 문자적으로 '마음'이지만 여기서는 판단과 이해의 내적 기능을 가리키므로, 본문 의미를 드러내는 '이해'를 본문에 두고 문자적 의미는 주해 여지로 남깁니다.
theological_decisions:
- issue: 지혜의 권면에서의 어조
  chosen_reading: 두 절구의 명령형을 한국어 존댓말 명령형으로 유지해, 화자가 지혜로서 청중에게 직접 권면하는 긴박함을 살렸습니다.
  alternative_readings:
  - 평서형으로 완화
  - 중립적 서술형으로 전환
  rationale: 잠언 8장의 수사학은 단순 정보 전달이 아니라 직접적 권면이므로, 합쇼체 명령형이 원문의 호소력을 가장 잘 전달합니다.
  doctrine_reference: 지혜문학의 권면 형식
