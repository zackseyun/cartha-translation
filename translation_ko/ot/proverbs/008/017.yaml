  text: I love those who love me[a], and those who seek me diligently find me.
  footnotes:
  - marker: a
    text: Or 'those who seek me early find me.' The Hebrew verb can denote seeking early, and by extension seeking earnestly or diligently.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 나를 사랑하는 이들을 사랑하고, 나를 부지런히 찾는 이들은 나를 발견합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 일찍 찾는 이들은 나를 발견합니다.’ 히브리어 동사는 ‘일찍 찾다’를 뜻할 수 있으며, 나아가 ‘열심히’ 또는 ‘간절히 찾다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
