  text: I love those who love me[a], and those who seek me diligently find me.
  footnotes:
  - marker: a
    text: Or 'those who seek me early find me.' The Hebrew verb can denote seeking early, and by extension seeking earnestly or diligently.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 나를 사랑하는 이들을 사랑하며, 나를 부지런히 찾는 이들은 나를 찾아냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부지런히’는 히브리어 동사가 가질 수 있는 ‘일찍’의 뜻을, 이 문맥에서의 ‘간절히/열심히 찾다’라는 확장 의미로 옮긴 것입니다.
    reason: lexical_alternative
