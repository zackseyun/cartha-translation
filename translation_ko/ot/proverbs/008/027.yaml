  - severity: low
    issue: 각주의 ‘원호를 그으다’ 표현
    rationale: ‘원호’는 ‘원(circle)’보다 좁은 뜻이며 ‘그으다’는 표준 활용이 아닙니다. 원문이 암시할 수 있는 수평선 또는 원형 경계는 각주에서 가능성으로만 제시하는 것이 좋습니다.
