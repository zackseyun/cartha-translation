    rationale: 히브리어는 첫 시간절 뒤에 ‘거기에 내가 [있었다]’라고 말하고 이어 두 번째 시간절을 붙입니다. 초안의 반복은 의미를 크게 바꾸지는 않지만 불필요한 명시화이며 문장 구조를 어색하게 합니다.
