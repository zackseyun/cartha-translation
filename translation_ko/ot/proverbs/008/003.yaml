id: PRO.8.3
reference: Proverbs 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/יַד שְׁעָרִ֥ים לְ/פִי קָ֑רֶת מְב֖וֹא פְתָחִ֣ים תָּרֹֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
  footnotes:
  - marker: a
    text: Or 'at the opening of the city.' The Hebrew literally reads 'at the mouth of the city.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she calls aloud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성문 곁에서, 성읍의 어귀[a]에서, 여러 출입문의 입구에서 그녀가 외칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍의 입구에서’. 히브리어는 문자적으로 ‘성읍의 입에서’라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘외쳐 부릅니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: לְיַד
  english_pob_choice: Beside
  chosen_korean: 곁
  alternatives_korean:
  - 옆에
  - 가까이에
  lexicon: HALOT
  rationale: 장소 전치사 לְיַד의 관용적 의미를 자연스러운 현대 한국어로 옮기되, 공공장소의 근접성을 살려 ‘곁’으로 렌더링했습니다.
- source_word: שְׁעָרִים
  english_pob_choice: the gates
  chosen_korean: 성문
  alternatives_korean:
  - 문들
  - 성문들
  lexicon: HALOT
  rationale: 도시 문맥의 שְׁעָרִים은 단순한 문보다 성의 출입문을 가리키므로, 공적 집결 장소라는 뉘앙스를 살려 ‘성문’으로 옮겼습니다.
- source_word: לְפִי קָרֶת
  english_pob_choice: at the mouth of the city
  chosen_korean: 성읍의 입구
  alternatives_korean:
  - 도시의 입구
  - 성읍의 어귀
  lexicon: HALOT
  rationale: 히브리어의 ‘입’ 이미지를 한국어에서 그대로 살리면 부자연스러워질 수 있어, 의미를 보존하면서도 자연스러운 ‘성읍의 입구’로 옮겼습니다.
- source_word: פְתָחִים
  english_pob_choice: the doorways
  chosen_korean: 문들의 어귀
  alternatives_korean:
  - 문들
  - 출입구들
  lexicon: HALOT
  rationale: 복수형 개방/출입 지점을 가리키므로, 앞의 ‘입구’와 중복을 피하면서도 공간적 이미지를 살리는 ‘문들의 어귀’로 옮겼습니다.
- source_word: תָּרֹנָּה
  english_pob_choice: she cries out
  chosen_korean: 외칩니다
  alternatives_korean:
  - 큰소리로 부릅니다
  - 외쳐 부릅니다
  lexicon: HALOT
  rationale: 공적 선포의 강한 음성 행위를 나타내므로, 감정 과잉 없이도 넓은 공간에서 울려 퍼지는 발화를 담는 ‘외칩니다’가 적절합니다.
theological_decisions:
- issue: 지혜의 의인화된 화자 표현
  chosen_reading: ‘그녀’는 지혜가 공적으로 부르는 의인화 표현으로 유지했습니다.
  alternative_readings:
  - ‘지혜가’로 풀어 쓰기
  - 무인칭으로 바꾸기
  rationale: 문맥상 지혜가 거리에서 외치는 의인화가 핵심이므로, 본문의 수사적 힘을 보존하기 위해 대명사 표현을 유지했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 지혜는 인격화된 화자로 제시됩니다.
