id: PRO.8.36
reference: Proverbs 8:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
  footnotes:
  - marker: a
    text: Or, more literally, 'sins against me.' The Hebrew verb can carry the sense 'miss' or 'sin.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'does violence to his soul/life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나를 죄짓는 사람은 자기 영혼을 해칩니다[b][a]; 나를 미워하는 모든 사람은 죽음을 사랑합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 생명/영혼에 폭력을 행사한다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나에게 죄를 짓는 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  english_pob_choice: the one who sins against me
  chosen_korean: 나를 죄짓는 사람
  alternatives_korean:
  - 나에게 죄를 짓는 사람
  - 나를 거스르는 사람
  - 나를 놓치는 사람
  lexicon: HALOT
  rationale: חטא는 기본적으로 ‘빗나가다/죄짓다’의 뜻을 가지므로, POB의 최종 선택인 ‘sins against me’에 맞춰 ‘나를 죄짓는 사람’으로 옮겼습니다. 지혜의 화자에게 향한 반역을 분명히 하면서도 현대 한국어에서 자연스럽습니다.
- source_word: חֹמֵס נַפְשׁוֹ
  english_pob_choice: wrongs his own soul
  chosen_korean: 자기 영혼을 해칩니다
  alternatives_korean:
  - 자기 생명을 해칩니다
  - 자기 자신을 해칩니다
  - 자기 영혼에 폭력을 행사합니다
  lexicon: HALOT
  rationale: חמס는 ‘해치다/폭력을 행사하다/부당하게 다루다’의 폭을 가지며, נֶפֶשׁ는 이 관용구에서 ‘생명/영혼/자기’ 모두 가능한데, POB의 ‘wrongs his own soul’이 드러내는 자기파괴성을 살려 ‘자기 영혼을 해칩니다’로 옮겼습니다.
- source_word: מְשַׂנְאַי
  english_pob_choice: all who hate me
  chosen_korean: 나를 미워하는 모든 사람
  alternatives_korean:
  - 나의 원수인 모든 사람
  - 나를 증오하는 모든 사람
  lexicon: HALOT
  rationale: 분사형과 1인칭 접미사의 지속적 성격을 한국어 관계절로 자연스럽게 풀었습니다. ‘미워하는’은 원문의 지속적 태도를 유지하면서 과도한 감정 강화를 피합니다.
- source_word: אָהֲבוּ מָוֶת
  english_pob_choice: love death
  chosen_korean: 죽음을 사랑합니다
  alternatives_korean:
  - 죽음을 좋아합니다
  - 죽음을 사랑하고 있습니다
  - 죽음을 택합니다
  lexicon: HALOT
  rationale: אָהֲבוּ는 잠언의 격언적 현재 진술로 이해되어 현재형으로 옮겼습니다. מָוֶת은 직접적으로 ‘죽음’으로 번역해 지혜문학의 생명/죽음 대비를 보존했습니다.
theological_decisions:
- issue: נפש를 ‘영혼’으로 옮길지 ‘자기/생명’으로 완화할지
  chosen_reading: ‘자기 영혼’으로 옮겨 문맥의 자기파괴성과 인간 내면의 차원을 함께 드러냈습니다.
  alternative_readings:
  - 자기 자신
  - 자기 생명
  - 그의 영혼
  rationale: 히브리어 관용구는 단순한 신체적 손상보다 더 넓은 자기훼손을 뜻합니다. 한국어에서 ‘영혼’은 전통적으로 익숙하지만, 본문이 요구하는 자기파괴의 강도를 유지하기 위해 ‘자기 영혼’을 선택했습니다.
  doctrine_reference: 번역 철학 §6; 본문이 허용하는 긴장을 해소하지 않고 보존
