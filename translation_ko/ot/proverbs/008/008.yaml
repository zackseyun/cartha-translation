id: PRO.8.8
reference: Proverbs 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/צֶ֥דֶק כָּל אִמְרֵי פִ֑/י אֵ֥ין בָּ֝/הֶ֗ם נִפְתָּ֥ל וְ/עִקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
  footnotes:
  - marker: a
    text: Or 'there is nothing perverse or devious in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 입의 모든 말은 의롭습니다. 그 안에는 뒤틀리거나 굽은 것이 없습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 안에는 비뚤어진 것이나 왜곡된 것이 없습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  english_pob_choice: are in righteousness
  chosen_korean: 의롭습니다
  alternatives_korean:
  - 의 안에 있습니다
  - 의 가운데 있습니다
  - 정직합니다
  lexicon: HALOT
  rationale: 히브리어의 ב + צֶדֶק 구조는 문자적으로는 '의 안에서'이지만, 한국어에서는 '의롭습니다'가 자연스럽게 그 상태를 담아 주며 지혜문학의 도덕적 진술로도 잘 들립니다.
- source_word: כָּל אִמְרֵי פִי
  english_pob_choice: All the words of my mouth
  chosen_korean: 내 입의 모든 말
  alternatives_korean:
  - 내 입의 모든 말씀
  - 내가 입으로 하는 모든 말
  lexicon: HALOT
  rationale: אִמְרֵי פִי의 이미지를 살리면서도 한국어에서는 '내 입의 모든 말'이 가장 직접적이고 간결하게 원문의 병렬을 전달합니다.
- source_word: נִפְתָּל
  english_pob_choice: twisted
  chosen_korean: 비뚤어짐
  alternatives_korean:
  - 뒤틀림
  - 꼬인 것
  - 비틀어진 것
  lexicon: HALOT
  rationale: נִפְתָּל은 도덕적으로 비틀린 상태를 가리키므로, 명사형 '비뚤어짐'이 뒤의 '굽은 것'과 함께 원문의 형용사적 병렬을 한국어로 자연스럽게 살립니다.
- source_word: וְעִקֵּשׁ
  english_pob_choice: crooked
  chosen_korean: 굽은 것
  alternatives_korean:
  - 삐뚤어진 것
  - 비뚤어진 것
  - 왜곡된 것
  lexicon: HALOT
  rationale: עִקֵּשׁ은 물리적으로도 도덕적으로도 '굽은' 상태를 뜻하므로, 앞의 '비뚤어짐'과 짝을 이루는 '굽은 것'이 가장 직관적입니다.
theological_decisions:
- issue: 지혜의 말에 대한 절대적 도덕 무흠함 표현
  chosen_reading: '''그 안에는 비뚤어짐도 굽은 것도 없습니다''로, 원문의 이중 부정을 살려 완전한 정직성을 강조했습니다.'
  alternative_readings:
  - '''그 안에는 왜곡도 사악함도 없습니다'''
  - '''그 안에는 그릇됨이 전혀 없습니다'''
  rationale: 본문은 지혜의 말이 단지 대체로 좋은 정도가 아니라 전적으로 왜곡되지 않았음을 말하므로, 이중의 부정을 유지해 강도를 약화시키지 않았습니다.
  doctrine_reference: 잠언 8장의 지혜 화자는 신뢰할 수 있는 하나님의 지혜를 대표하며, 그 발언의 도덕적 무흠함을 강조합니다.
