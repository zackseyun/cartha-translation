base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
  footnotes:
  - marker: a
    text: Or 'I was set up'; the Hebrew verb is debated and has also been understood as 'I was installed' or, less likely here, 'I was anointed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 영원부터 나는 세워졌고[a], 처음부터, 땅이 있기 전부터였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נִסַּכְתִּי는 ‘세워졌다’ 외에 ‘설치되었다’, 덜 가능하지만 ‘기름부음받았다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֹולָם
  english_pob_choice: From everlasting
  chosen_korean: 영원부터
  alternatives_korean:
  - 영원에서부터
  - 영세부터
  - 태초부터
  lexicon: HALOT
  rationale: עוֹלָם의 초월적·원시적 시간을 한국어로 간결하게 살리되, 문맥상 피조 세계 이전의 영속성을 분명히 드러내기 위해 ‘영원부터’로 옮겼습니다.
- source_word: נִסַּכְתִּי
  english_pob_choice: I was established
  chosen_korean: 세워졌고
  alternatives_korean:
  - 설립되었고
  - 세워졌습니다
  - 설정되었고
  lexicon: HALOT
  rationale: 이 동사는 본문에서 ‘설치되다/세워지다/임명되다’의 뜻이 논의되므로, 현대 한국어에서 자연스럽고 공적인 어감의 ‘세워졌고’로 옮겨 ‘정해져 자리 잡은’ 의미를 살렸습니다.
- source_word: מֵרֹאשׁ
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 시작부터
  - 맨 처음부터
  - 태초부터
  lexicon: HALOT
  rationale: 시간 부사구로서의 רֹאשׁ을 한국어 관용에 맞게 간결하게 표현하면서, 앞의 ‘영원부터’와 평행을 이루도록 ‘처음부터’로 번역했습니다.
- source_word: מִקַּדְמֵי אָרֶץ
  english_pob_choice: from before the earth
  chosen_korean: 땅이 있기 전부터
  alternatives_korean:
  - 땅보다 앞서
  - 땅이 생기기 전부터
  - 세상이 있기 전부터
  lexicon: HALOT
  rationale: 창조 이전의 우선성을 분명히 하기 위해 직역적인 ‘땅이 있기 전부터’를 택했고, 여기서 ‘땅’은 우주적·창조론적 문맥에 맞는 표현입니다.
theological_decisions:
- issue: 잠언 8장의 의인화된 지혜를 그리스도론적으로 과잉 해석할 위험
  chosen_reading: 본문의 직접적 문학적 의미를 따라, 창조 이전에 세워진 지혜의 발언으로 번역하고 메시아적·삼위일체적 용어를 본문에 투입하지 않았습니다.
  alternative_readings:
  - ‘기름부음을 받았다’로 옮겨 메시아적 연상을 강화하는 해석
  - 신학적 해석을 본문 번역 속에 직접 반영하는 처리
  rationale: 히브리어 본문은 우선 지혜의 선재성과 임명을 말하므로, 번역은 그 의미를 보존해야 합니다. 기독교적 정합성은 주석에서 다룰 수 있지만, 본문 자체는 문학적 맥락을 우선해야 합니다.
  doctrine_reference: 번역 철학 §§1, 3
