  lexicon: HALOT
  rationale: 창조 이전의 우선성을 분명히 하기 위해 직역적인 ‘땅이 있기 전부터’를 택했고, 여기서 ‘땅’은 우주적·창조론적 문맥에 맞는 표현입니다.
theological_decisions:
- issue: 잠언 8장의 의인화된 지혜를 그리스도론적으로 과잉 해석할 위험
  chosen_reading: 본문의 직접적 문학적 의미를 따라, 창조 이전에 세워진 지혜의 발언으로 번역하고 메시아적·삼위일체적 용어를 본문에 투입하지 않았습니다.
  alternative_readings:
  - ‘기름부음을 받았다’로 옮겨 메시아적 연상을 강화하는 해석
  - 신학적 해석을 본문 번역 속에 직접 반영하는 처리
  rationale: 히브리어 본문은 우선 지혜의 선재성과 임명을 말하므로, 번역은 그 의미를 보존해야 합니다. 기독교적 정합성은 주석에서 다룰 수 있지만, 본문 자체는 문학적 맥락을 우선해야 합니다.
  doctrine_reference: 번역 철학 §§1, 3
