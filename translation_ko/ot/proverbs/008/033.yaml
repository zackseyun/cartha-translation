id: PRO.8.33
reference: Proverbs 8:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
  footnotes:
  - marker: a
    text: Or 'do not cast it off' or 'do not let it go.' The Hebrew verb can carry the sense of rejecting or neglecting instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈계를 들으십시오. 지혜롭게 되십시오. 그것을 저버리지 마십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 버리지 마십시오”, “그것을 놓아버리지 마십시오”. 히브리어 동사는 훈계를 거절하거나 소홀히 하는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보십시오
  - 귀를 기울이십시오
  - 순종하십시오
  lexicon: HALOT
  rationale: שׁמע의 핵심은 주의 깊게 듣는 것이며, 문맥상 곧바로 순종을 함의할 수 있으나 여기서는 과도하게 좁히지 않고 정중한 명령형으로 옮겼습니다.
- source_word: מוּסָר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교정
  - 징계
  lexicon: HALOT
  rationale: 지혜문학에서 מוּסָר는 단순한 정보 전달보다 삶을 바로잡는 훈련과 가르침을 가리키므로, 한국어에서는 문맥상 가장 자연스러운 '훈계'를 택했습니다.
- source_word: וַחֲכָמוּ
  english_pob_choice: and become wise
  chosen_korean: 그러면 지혜롭게 될 것입니다
  alternatives_korean:
  - 그리고 지혜로워지십시오
  - 지혜롭게 되십시오
  - 지혜를 얻으십시오
  lexicon: HALOT
  rationale: חכם의 동사적 힘을 살려 결과적/귀결적 의미를 드러냈습니다. 앞 명령을 들으면 지혜롭게 되는 흐름을 자연스럽게 표현했습니다.
- source_word: תִּפְרָעוּ
  english_pob_choice: do not neglect it
  chosen_korean: 그것을 저버리지 마십시오
  alternatives_korean:
  - 그것을 소홀히 여기지 마십시오
  - 그것을 놓아버리지 마십시오
  - 그것을 버리지 마십시오
  lexicon: HALOT
  rationale: פרע는 '내버려 두다, 놓아버리다, 거절하다'의 뉘앙스를 가질 수 있어, 지혜와 훈계를 붙들지 않고 거부하는 뜻을 포괄하는 '저버리다'로 옮겼습니다.
theological_decisions:
- issue: 두 번째 동사의 의미를 결과 명령으로 옮길지 여부
  chosen_reading: '''그러면 지혜롭게 될 것입니다''로 옮겨, ''듣기''와 ''지혜롭게 됨''의 인과 관계를 분명히 했습니다.'
  alternative_readings:
  - '''지혜롭게 되십시오'''
  - '''지혜를 얻으십시오'''
  rationale: 히브리어는 명령형 두 개를 병렬로 놓지만, 한국어에서는 단순 병렬보다 앞의 청종이 뒤의 지혜로 이어지는 흐름을 드러내는 것이 문맥상 더 정확하고 자연스럽습니다.
  doctrine_reference: 지혜문학의 교훈적 인과 구조
- issue: 마지막 부정 명령의 강도
  chosen_reading: '''저버리지 마십시오''로 옮겨, 단순한 잊음보다 의도적 거절/방치를 함께 담았습니다.'
  alternative_readings:
  - '''소홀히 여기지 마십시오'''
  - '''버리지 마십시오'''
  rationale: 본문의 프라어르(פרע)는 훈계를 붙들지 않는 태도를 포함할 수 있으므로, 한국어에서 단순 관리 소홀보다 관계적·의지적 거절을 아우르는 표현이 적절합니다.
  doctrine_reference: 지혜에 대한 인간의 책임 있는 응답
