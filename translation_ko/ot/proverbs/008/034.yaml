id: PRO.8.34
reference: Proverbs 8:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
  footnotes:
  - marker: a
    text: Hebrew 'the man' uses a singular masculine form with generic force, referring to any person who listens to Wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 귀 기울이며 날마다 내 문 곁에서 깨어 있고 내 출입구의 문설주 곁을 지키는 사람은 복됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되다
  alternatives_korean:
  - 복이 있습니다
  - 행복합니다
  lexicon: HALOT
  rationale: 지혜 문맥의 축복 선언을 살리기 위해 '복되다'를 택했고, 단순한 감정 상태인 '행복하다'보다 강한 선언적 어조를 유지했습니다.
- source_word: אָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 그 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 단수형의 보편적 지시를 한국어에서 자연스럽게 살리기 위해 성별에 고정되지 않는 '사람'을 사용했습니다.
- source_word: שֹׁמֵעַ לִי
  english_pob_choice: who listens to me
  chosen_korean: 내 말에 귀를 기울이는
  alternatives_korean:
  - 나를 듣는
  - 나에게 순종하는
  lexicon: HALOT
  rationale: 지혜의 인격화된 화자를 향한 지속적 청취를 나타내므로, 직역의 어색함을 피하면서도 '듣다'의 은유를 살리는 표현을 택했습니다.
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי יֹום יֹום
  english_pob_choice: watching at my doors day by day
  chosen_korean: 날마다 내 문 곁에서 지켜 서 있으며
  alternatives_korean:
  - 날마다 내 문에서 깨어 지키며
  - 날마다 내 문 앞에서 살피며
  lexicon: HALOT
  rationale: '''지켜 서 있다''는 문 앞에서의 지속적 대기와 경계성을 함께 전달하며, 반복구 ''יום יום''은 ''날마다''로 옮겨 지속성을 분명히 했습니다.'
- source_word: לִשְׁמֹר מְזוּזֹת פְּתָחָי
  english_pob_choice: keeping watch at the doorposts of my entrances
  chosen_korean: 내 출입문의 문설주를 지키는
  alternatives_korean:
  - 내 문설주를 지키는
  - 내 문지방을 지키는
  lexicon: HALOT
  rationale: '''מְזוּזוֹת''은 문설주를 가리키므로 이를 살렸고, ''פְּתָחַי''는 단순한 문보다 ''출입문''이 ''열림/출입구''의 중복을 덜어 히브리어 평행을 더 잘 드러냅니다.'
theological_decisions:
- issue: 지혜의 의인화된 목소리를 한국어에서 어떻게 살릴지
  chosen_reading: 본문은 지혜가 직접 말하는 1인칭 화법으로 옮기고, 청자에게는 직설적 초청의 어조를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 표현
  - 지혜를 비인격적 '지혜 원리'로 바꾸어 표현
  rationale: 원문의 수사적 힘은 인격화된 지혜가 문 앞에서 기다리는 장면에 있으므로, 이를 추상화하거나 설명적으로 바꾸면 본문의 초대와 긴장이 약해집니다.
  doctrine_reference: 잠언 8장의 의인화된 지혜 화법
