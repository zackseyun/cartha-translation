revisions:
- from: 복되다, 지혜의 말에 귀를 기울이는 사람은 — 날마다 내 문 곁에서 지켜 서 있으며, 내 출입문의 문설주를 지키는 사람은.[a]
  to: 내게 귀 기울이며 날마다 내 문 곁에서 깨어 있고 내 출입구의 문설주 곁을 지키는 사람은 복됩니다.
  rationale: 직접화법의 ‘내게’를 보존하고, שָׁקַד의 부지런히 지켜 보는 뉘앙스는 ‘깨어 있고’로, שָׁמַר의 주시/파수 이미지는 ‘지키는’으로 옮겼습니다. 원문의 병행 구조와 문-문설주 이미지를 유지하면서 현대 표준 한국어 합쇼체 문장으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:37:46Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 직접화법 1인칭 목적어(‘내게’)와 두 개의 병행되는 문 앞 대기/주시 동작을 유지하도록 고쳤습니다. 초안의 ‘지혜의 말’은 문맥상 가능한 해석이지만 원문의 ‘나를/내게’보다 한 단계 해석을 더한 표현이었습니다.
  naturalness: 초안은 ‘복되다, … 사람은’이라는 문장 구조가 현대 한국어 문장으로 자연스럽지 않고, ‘사람은’이 병행구 안에서 중복됩니다. 서술어를 문장 끝에 두고 병행 동사를 연결하여 합쇼체 문장으로 정리했습니다.
  terminology: ‘복됩니다’는 אַשְׁרֵי의 축복 선언을 자연스럽게 살립니다. ‘문설주’는 מְזוּזוֹת에 적절하며, ‘출입구’는 פְּתָחַי의 공간적 이미지를 보존합니다.
  issues:
  - severity: medium
    issue: ‘복되다, … 사람은’의 문장 구조와 ‘사람은’의 중복
    rationale: 한국어에서 축복 선언의 주어와 서술어 연결이 성립하지 않으며, 뒤의 병행구에 같은 주어가 불필요하게 반복됩니다.
  - severity: medium
    issue: ‘지혜의 말에 귀를 기울이는’
    rationale: 히브리어는 지혜가 직접 말하는 ‘내게 귀 기울이는’(שֹׁמֵעַ לִי)입니다. ‘지혜의 말’은 문맥적 해석을 덧붙이므로 직접화법을 유지하는 편이 더 충실합니다.
  - severity: low
    issue: 각주 a의 필요성 및 본문과의 연결
    rationale: 한국어 ‘사람’은 단수 남성형을 표지하지 않으므로 히브리어 남성 단수의 포괄성을 설명하는 각주는 번역상 필요한 정보를 제공하지 않습니다. 또한 개정 본문에는 해당 표지가 없습니다.
  revised_text: 내게 귀 기울이며 날마다 내 문 곁에서 깨어 있고 내 출입구의 문설주 곁을 지키는 사람은 복됩니다.
