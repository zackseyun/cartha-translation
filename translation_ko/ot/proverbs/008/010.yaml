  source_fidelity: 히브리어는 지혜가 말하는 복수 명령으로, ‘나의 훈계(מוּסָרִי)를 은보다, 지식(דַּעַת)을 선택된/고른 금(חָרוּץ נִבְחָר)보다 택하라’는 두 대조를 이룹니다. 초안은 전체 의미를 잘 전달하지만, 명령의 선택·선호 의미를 더 직접적으로 드러내고 각주 표지를 해당 표현에 맞게 바로잡는 것이 좋습니다.
  naturalness: ‘은보다 …, 선택된 금보다 … 택하십시오’는 간결한 대구를 유지하며 현대 표준 한국어의 합쇼체에 자연스럽습니다. ‘선택된 금’은 다소 직역적이지만 시적 문맥에서 이해 가능하고, 원문의 ‘선별된/고른’ 뉘앙스를 보존합니다.
  terminology: מוּסָר은 지혜문학에서 교훈·훈계·훈육을 포괄합니다. 본문에서는 ‘훈계’가 교정적 뉘앙스와 교육적 의미를 함께 적절히 반영합니다. דַּעַת은 ‘지식’으로, חָרוּץ נִבְחָר은 ‘선택된 금’으로 옮기는 것이 원문의 수식 관계를 보존합니다.
