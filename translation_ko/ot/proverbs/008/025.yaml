  text: Before the mountains were settled[a], before the hills, I was brought forth.
  footnotes:
  - marker: a
    text: Or 'I was born' or 'I was begotten.' The Hebrew uses birth/origin imagery for personified Wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 산들이 아직 세워지기 전, 언덕들이 있기 전에 나는 태어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 태어났다’ 혹은 ‘나는 낳아졌다.’ 히브리어는 의인화된 지혜의 기원/탄생 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם / לִפְנֵי
  english_pob_choice: Before / before
  chosen_korean: ~하기 전, ~기 전에
  alternatives_korean:
  - 전에
  - ~하기 이전에
  lexicon: HALOT
  rationale: 두 시간 표지를 모두 한국어의 반복 구조로 살려, 창조 이전을 가리키는 시적 병렬을 자연스럽게 보존했습니다.
- source_word: הָרִים / גְבָעוֹת
