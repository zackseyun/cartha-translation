translation:
  language: ko
  text: 제게는 조언과 건전한 지혜가 있고, 저는 분별력이며, 제게는 힘이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제게는 조언과 효과적인 지혜가 있고, 저는 통찰이며, 제게는 능력이 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵצָה
  english_pob_choice: counsel
  chosen_korean: 조언
  alternatives_korean:
  - 모의
  - 의논
  - 권고
  lexicon: HALOT
  rationale: 지혜문학의 문맥에서 עֵצָה는 단순한 ‘조언’보다 지혜로운 판단과 지도라는 뜻을 띠므로, 인격화된 지혜의 말투를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: תוּשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: 건전한 지혜
  alternatives_korean:
  - 효과적인 지혜
  - 실용적 지혜
  - 지혜의 실효성
  lexicon: HALOT
  rationale: תוּשִׁיָּה는 견고함·실효성·바른 판단을 함께 담을 수 있으므로, ‘건전한 지혜’가 그 안정성과 실제적 유익을 가장 무리 없이 드러냅니다.
- source_word: אֲנִי בִינָה
  english_pob_choice: I am understanding
  chosen_korean: 저는 분별입니다
  alternatives_korean:
  - 저는 이해입니다
  - 저는 통찰입니다
  - 저는 분별력입니다
  lexicon: HALOT
  rationale: 문법적으로는 ‘나는 분별/통찰 그 자체입니다’라는 동일시 문장입니다. 한국어에서는 ‘이해’보다 인격화된 지혜의 성격을 더 잘 드러내는 ‘분별’이 적절합니다.
- source_word: גְבוּרָה
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 권능
  - 강함
  lexicon: HALOT
  rationale: 여기서는 무장적 ‘용맹’보다 넓은 의미의 능력과 역량을 가리키므로, 시적 병렬을 살리는 간결한 ‘힘’이 자연스럽습니다.
- source_word: לִי ... לִי
  english_pob_choice: are mine ... is mine
  chosen_korean: 저에게 있으며 ... 저에게 있습니다
  alternatives_korean:
  - 제 것입니다 ... 제 것입니다
  - 제가 지니고 있습니다
  - 제게 속해 있습니다
  lexicon: HALOT
  rationale: 반복되는 לִי의 소유 강조를 한국어에서 직접적인 소유 표현보다 ‘저에게 있다’로 살려, 시적 병렬과 강조를 유지했습니다.
theological_decisions:
- issue: 지혜의 인격화 유지
  chosen_reading: 지혜의 첫인칭 자기진술을 그대로 살리고, 본문 안에 그리스도론적 동일시를 끼워 넣지 않았습니다.
  alternative_readings:
  - 메시아적/그리스도론적 표현으로 번역함
  - 지혜를 추상명사로만 평탄화함
  rationale: 잠언 8장은 지혜를 인격화하여 말하게 하므로, 번역은 이 문학적-신학적 형식을 보존해야 합니다. 해석 논쟁은 번역이 아니라 주석에서 다루는 것이 적절합니다.
  doctrine_reference: 본문의 문학적 인격화와 해석적 유보를 보존
