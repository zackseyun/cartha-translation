  naturalness: 초안의 ‘내 입술의 열림은 곧은 것들입니다’는 한국어로 부자연스럽고, ‘곧은 것들’은 이 문맥에서 의미가 불명확합니다. 수정문은 현대 표준어 합쇼체에서 자연스러우면서도 원문의 시적 병행을 유지합니다.
