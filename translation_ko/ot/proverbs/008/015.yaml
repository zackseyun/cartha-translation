base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
  footnotes:
  - marker: a
    text: Or 'through me kings reign.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and nobles/princes decree justice.'
