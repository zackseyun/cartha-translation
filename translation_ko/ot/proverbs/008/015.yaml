translation:
  language: ko
  text: 나를 통해[a] 왕들이 통치하고, 통치자들이[b] 정의로운 법을 제정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나로 말미암아’.
