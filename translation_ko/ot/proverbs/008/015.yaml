lexical_decisions:
- source_word: בִּי
  english_pob_choice: By me
  chosen_korean: 나를 통해
  alternatives_korean:
  - 내로 말미암아
  - 나로 인해
  lexicon: HALOT
  rationale: 전치사 בְּ + 1인칭 단수 접미사는 여기서 수단·매개를 나타내므로, 왕권의 행사가 지혜를 매개로 이뤄진다는 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: מְלָכִים יִמְלֹכוּ
  english_pob_choice: kings reign
  chosen_korean: 왕들이 통치하고
  alternatives_korean:
  - 왕들이 다스리고
  - 왕들이 왕 노릇하고
  lexicon: HALOT
  rationale: מָלַךְ 계열은 왕으로서 권위를 행사한다는 뜻이므로, 현대 한국어에서는 '통치하다'가 'reign'의 왕권적 뉘앙스를 가장 분명하게 살립니다.
- source_word: וְרֹזְנִים
  english_pob_choice: rulers
  chosen_korean: 통치자들이
  alternatives_korean:
  - 귀족들이
  - 고관들이
  lexicon: HALOT
  rationale: רֹזְנִים은 왕보다 아래의 고위 통치자·유력자를 가리키므로, 계층감을 지나치게 좁히지 않는 '통치자들'이 적절합니다.
- source_word: יְחֹקְקוּ צֶדֶק
  english_pob_choice: decree justice
  chosen_korean: 정의를 공포합니다
  alternatives_korean:
  - 정의를 선포합니다
  - 공정한 법령을 제정합니다
  lexicon: HALOT
  rationale: חקק은 여기서 법적·공적 결정을 반포하거나 제정하는 뜻이므로, '공포하다'가 권위 있는 선언 행위를 잘 나타내며 צֶדֶק은 그 내용인 '정의'로 옮겼습니다.
theological_decisions:
- issue: 지혜가 정치 권위를 어떻게 매개하는지
  chosen_reading: 이 절은 왕과 통치자의 권위 행사가 지혜를 통해 이뤄진다고 말하지만, 모든 실제 통치가 항상 의롭다고 단정하지는 않습니다.
  alternative_readings:
  - 하나님이 모든 정치 권력을 직접 정당화하신다는 강한 섭리적 독해
  - 언급된 모든 통치자가 실제로 항상 정의롭게 행동한다는 도덕화된 독해
  rationale: 문맥상 의인화된 지혜가 바른 통치에 필수적임을 말하므로, 그 긍정적 이상은 살리되 본문이 넘어서지 않는 일반화를 피했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
