    rationale: 히브리어는 앞선 ‘다스리다’에 의존하는 병렬/생략 구문입니다. ‘판결을 내리다’로 바꾸면 원문의 통치 의미를 재판 행위로 좁히고 구조를 변경합니다.
  - severity: medium
    issue: ‘모든’(כָּל)의 누락
    rationale: כָּל은 뒤따르는 ‘공의의 재판관들’을 수식하므로 번역에 반영해야 합니다.
  - severity: low
    issue: 각주의 대안이 수량 표현을 반영하지 않음
    rationale: 본문의 ‘모든’을 보존한 대안 표현으로 정리하는 편이 본문과 각주의 대응을 분명히 합니다.
