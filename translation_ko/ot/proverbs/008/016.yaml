  source_fidelity: 수정이 필요합니다. 초안은 נְדִיבִים을 ‘고귀한 자들’로 옮길 수 있으나, 이들을 ‘공의의 재판관들’과 연결한 뒤 별도로 ‘판결을 내립니다’라는 동사를 보충하여, 원문의 통치 행위와 병렬 구조를 ‘재판 행위’로 바꾸었습니다. 또한 כָּל(‘모든’)이 번역문에서 누락되었습니다.
  naturalness: ‘고관들, 곧 공의의 모든 재판관들이 다스립니다’는 잠언의 간결한 병렬을 살리면서 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다.
  terminology: ‘통치자들’과 ‘고관들’은 각각 שָׂרִים과 נְדִיבִים의 정치·사회적 위상을 무리 없이 구별합니다. צֶדֶק은 본문에서 ‘공의’로 두고, 사법적 의미인 ‘정의’를 각주로 보존합니다.
  issues:
