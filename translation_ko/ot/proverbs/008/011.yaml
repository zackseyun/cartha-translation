base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
  footnotes:
  - marker: a
    text: Or 'pearls' or 'rubies' for 'jewels'; the Hebrew term refers generally to precious gems.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 지혜가 보석[a]보다 낫고, 사람이 바라는 모든 것은 그녀에 견줄 수 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְּנִינִים은 귀한 보석류를 가리킵니다. ‘진주’ 또는 ‘루비’로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה מִפְּנִינִים
  english_pob_choice: is better than jewels
  chosen_korean: 보석보다 낫고
  alternatives_korean:
  - 진주보다 낫고
  - 루비보다 낫고
  - 귀한 보석보다 낫고
  lexicon: HALOT
  rationale: פְּנִינִים은 구체적 보석명을 단정하기보다 귀한 보석류를 가리키므로, POB의 'jewels'에 맞춰 포괄적인 '보석'으로 옮겼습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지성
  - 슬기
  lexicon: HALOT
  rationale: 잠언 문맥에서 חָכְמָה의 표준 대응어는 '지혜'이며, 8장의 의인화된 지혜 주제를 그대로 살립니다.
- source_word: חֲפָצִים
  english_pob_choice: desirable things
  chosen_korean: 모든 바라는 것들
  alternatives_korean:
  - 모든 소망하는 것들
  - 모든 귀한 것들
  - 모든 즐거운 것들
  lexicon: HALOT
  rationale: חפצים는 단순한 '기쁨'보다 넓게 '원하는/바라는 대상'을 가리키므로, 의미를 좁히지 않도록 '바라는 것들'로 옮겼습니다.
- source_word: לֹא יִשְׁווּ בָהּ
  english_pob_choice: cannot compare with her
  chosen_korean: 그녀와는 비교할 수 없습니다
  alternatives_korean:
  - 그녀와 같을 수 없습니다
  - 그녀에 견줄 수 없습니다
  - 그녀와는 견줄 수 없습니다
  lexicon: HALOT
  rationale: שׁוה + ב의 비교 불가 의미를 자연스러운 현대 한국어로 살리되, חכְמה의 여성 인칭을 유지했습니다.
theological_decisions:
- issue: 잠언 8장의 지혜 의인화
  chosen_reading: 지혜를 여성 인칭 '그녀'로 유지합니다.
  alternative_readings:
  - 무인칭 '그것'으로 처리
  - 명사만 반복해 인칭을 회피
  rationale: 히브리어의 여성 단수 접미사 בָהּ와 장 전체의 의인화 구조를 보존해야 문학적 형식과 신학적 긴장을 함께 살릴 수 있습니다.
  doctrine_reference: Translation philosophy §3, §6
