source:
  edition: WLC
  text: ט֣וֹב פִּ֭רְיִ/י מֵ/חָר֣וּץ וּ/מִ/פָּ֑ז וּ֝/תְבוּאָתִ֗/י מִ/כֶּ֥סֶף נִבְחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
  footnotes:
  - marker: a
    text: Or 'and my produce than pure gold.' The Hebrew terms for precious metals distinguish gold generally (חָרוּץ) from especially fine gold (פָּז).
    reason: lexical_alternative
translation:
  language: ko
  text: 내 열매는 금보다 낫고 — 곧 순금보다 낫고 — 내 소출은 선택한 은보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 금을 두 층위로 구별합니다. 첫째는 일반적인 금(חָרוּץ), 둘째는 더 정제되거나 순수한 금(פָּז)입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: better than
  chosen_korean: ~보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 유익합니다
  lexicon: HALOT
  rationale: 비교 구문에서 지혜의 열매가 뒤따르는 값비싼 금속들보다 우월하다는 뜻이므로, 단순한 ‘좋다’보다 비교를 드러내는 ‘~보다 낫습니다’가 원문의 기능을 잘 살립니다.
- source_word: פִּרְיִי
  english_pob_choice: my fruit
  chosen_korean: 내 열매
  alternatives_korean:
  - 내 소출
  - 내 생산물
  lexicon: HALOT
  rationale: פְּרִי는 문자적으로 ‘열매/산물’을 뜻하며, 지혜가 맺는 결과의 은유를 자연스럽게 유지하기 위해 ‘열매’로 옮겼습니다.
- source_word: מֵחָרוּץ וּמִפָּז
  english_pob_choice: than gold, even fine gold
  chosen_korean: 금보다 — 곧 순금보다
  alternatives_korean:
  - 금보다, 곧 좋은 금보다
  - 금보다, 심지어 순금보다
  lexicon: HALOT
  rationale: 두 금속 용어는 일반적인 금과 더 정교한 금을 구별하므로, 첫째는 ‘금’, 둘째는 더 강한 강조를 가진 ‘순금’으로 옮겨 단계적 대비를 살렸습니다.
- source_word: וּתְבוּאָתִי מִכֶּסֶף נִבְחָר
  english_pob_choice: and my yield than choice silver
  chosen_korean: 내 소출은 선택한 은보다
  alternatives_korean:
  - 내 생산물은 좋은 은보다
  - 내 수확은 택한 은보다
  lexicon: HALOT
  rationale: תְבוּאָה는 수확물, 소출, 산물을 가리키며 여기서는 은에 대한 평행구로 쓰이므로 ‘소출’이 농경적 은유를 유지하면서도 문맥에 잘 맞습니다. נִבְחָר은 ‘선택된/선별된’이라는 뜻을 살려 ‘선택한’으로 옮겼습니다.
theological_decisions:
- issue: 지혜의 산출물이 재물보다 우월하다는 비교의 강도
  chosen_reading: 지혜가 낳는 결과가 가장 귀한 금속보다도 더 가치 있다는 단정적 비교로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 가치 비교로 약화하여 표현하기
  - ‘유익하다’ 중심으로 윤리적 효용만 강조하기
  rationale: 히브리어의 비교적 평가는 단순한 실용성보다 가치를 직접 대조하므로, 원문의 수사적 힘을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 잠언의 지혜 문학은 지혜의 우월성을 물질적 부와 직접 대조하여 가르칩니다.
