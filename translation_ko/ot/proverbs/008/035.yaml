  rationale: 인과 접속사 כִּי를 ‘…때문입니다’로 명시하여 앞 절과의 논리적 연결을 보존했습니다. ‘생명’과 ‘야훼’는 유지하고, רָצוֹן은 문맥상 직접적인 ‘호의’로 조정했습니다. 불필요한 설명 각주와 그 앵커는 제거했습니다.
