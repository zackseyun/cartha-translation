source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: ko
  text: 그렇습니다. 나를 찾는 이는 생명을 얻고 야훼께로부터 은총을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מֹצְאִי는 문자적으로는 ‘나를 찾는 자’에 가깝지만, 한국어에서는 남성 한정처럼 들리지 않도록 포괄적 표현을 사용했습니다.
    reason: korean_style_note
  - marker: b
    text: רָצוֹן은 문맥상 하나님이 베푸시는 우호적 호의, 곧 ‘은총’의 의미로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹצְאִי
  english_pob_choice: whoever finds me
  chosen_korean: 나를 찾는 이는
  alternatives_korean:
  - 나를 찾는 사람은
  - 나를 발견하는 이는
  lexicon: HALOT
  rationale: 히브리어 분사는 ‘나를 찾는 자/사람’이라는 일반적 의미이므로, 한국어에서는 남성 제한 없이 포괄하는 ‘이는’으로 자연스럽게 옮겼습니다.
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 חַיִּים은 단순한 생존보다 더 넓은 ‘생명’을 가리키므로, 형식적·신학적 무게를 살린 ‘생명’이 적절합니다.
- source_word: וַיָּפֶק
  english_pob_choice: obtains
  chosen_korean: 얻고
  alternatives_korean:
  - 받고
  - 가져오고
  - 획득하고
  lexicon: HALOT
  rationale: 이 동사는 여기서 ‘얻다/획득하다’의 결과 의미가 자연스럽고, 한국어에서는 병렬 동사로 ‘생명을 얻고’가 가장 간결하게 대응합니다.
- source_word: רָצוֹן מֵיְהוָה
  english_pob_choice: favor from Yahweh
  chosen_korean: 야훼께로부터 은총을
  alternatives_korean:
  - 야훼께로부터 호의를
  - 야훼께로부터 은혜를
  lexicon: HALOT
  rationale: רָצוֹן은 단순한 호감보다 하나님이 베푸시는 우호적 호의/은총을 가리키므로, 문맥상 ‘은총’이 가장 적합합니다. स्रोत-본문의 מֵ는 출처를 나타내어 ‘께로부터’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 원문의 출처 관계는 앞의 조사구 ‘께로부터’로 표현했습니다.
theological_decisions:
- issue: 지혜의 인격화된 화자와 보편적 초청의 표현
  chosen_reading: ‘나를 찾는 이는’로 옮겨 지혜를 찾는 모든 사람에게 열려 있는 일반적 약속을 드러냈습니다.
  alternative_readings:
  - ‘나를 찾는 자는’
  - ‘나를 찾는 사람은’
  rationale: 히브리어 분사는 특정 성별보다 범주 전체를 가리키므로, 보편적 초청의 성격을 살리되 한국어에서 어색하지 않게 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
