base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
  footnotes:
  - marker: a
    text: Or 'to cause those who love me to inherit substance'; Hebrew יֵשׁ can also be rendered 'substance' or 'possessions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 나를 사랑하는 이들에게 재물을 물려주며 그들의 곳간을 채웁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 사랑하는 이들에게 소유물(재산)을 물려주며’로 옮길 수 있습니다. 히브리어 יֵשׁ는 ‘소유물’ 또는 ‘재산’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַנְחִיל
  english_pob_choice: to endow
  chosen_korean: 상속하게 하고
  alternatives_korean:
  - 재산을 주고
  - 유산을 물려주고
  - 물려받게 하고
  lexicon: HALOT
  rationale: 히필형 נחל은 ‘상속하게 하다, 물려주게 하다’의 사역 의미이므로, 한국어에서는 ‘상속하게 하고’가 원뜻을 가장 직접적으로 살리면서도 문맥의 목적 구조를 자연스럽게 드러냅니다.
- source_word: אֹהֲבַי
  english_pob_choice: those who love me
  chosen_korean: 나를 사랑하는 이들에게
  alternatives_korean:
  - 나를 사랑하는 자들에게
  - 내 사랑하는 이들에게
  - 나를 사랑하는 사람들에게
  lexicon: HALOT
  rationale: 1인칭 목적어를 가진 분사구는 ‘나를 사랑하는 이들’이 가장 자연스럽고, 지혜가 말하는 화자 중심의 관계성을 잘 보존합니다.
- source_word: יֵשׁ
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부유함
  - 소유물
  - 실체
  lexicon: HALOT
  rationale: 문맥상 ‘곳간’과 병렬을 이루는 구체적 소유/재산의 이미지가 강하므로, 현대 한국어에서는 ‘재물’이 ‘wealth’의 직관적이고 과도하게 신학화되지 않은 대응입니다.
- source_word: וְאֹצְרֹתֵיהֶם
  english_pob_choice: their treasuries
  chosen_korean: 그들의 곳간을
  alternatives_korean:
  - 그들의 창고를
  - 그들의 보물 창고를
  - 그들의 금고를
  lexicon: HALOT
  rationale: אוצר는 물건을 저장하는 장소를 가리키므로, ‘곳간’이 구체적이고 시적이며, 앞의 ‘재물’과의 평행을 가장 잘 살립니다.
theological_decisions:
- issue: 지혜가 약속하는 복의 성격
  chosen_reading: 본문의 물질적·실질적 풍요 이미지를 그대로 살리되, 이를 번영신학적 보편 약속으로 확장하지는 않았습니다.
  alternative_readings:
  - ‘참된 부요’처럼 추상화하여 번역하기
  - 영적 축복으로만 해석하기
  rationale: 히브리어 יֵשׁ와 ‘곳간’의 결합은 구체적 소유의 이미지를 지지하므로, 본문의 비유적 지혜 문맥을 유지하면서도 교리적 과장을 피하는 것이 타당합니다.
  doctrine_reference: 잠언의 지혜 시학과 번역의 최적 대응 원칙
