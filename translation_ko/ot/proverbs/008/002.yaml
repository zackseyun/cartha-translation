id: PRO.8.2
reference: Proverbs 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֹאשׁ מְרוֹמִ֥ים עֲלֵי דָ֑רֶךְ בֵּ֖ית נְתִיב֣וֹת נִצָּֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/002.yaml
  text: On the heights beside the road[a], at the crossroads she takes her stand.
  footnotes:
  - marker: a
    text: Literally, 'at the house of paths'—that is, where paths meet.
    reason: lexical_alternative
translation:
  language: ko
  text: 높은 곳, 길가 곁, 길들이 만나는 곳에서 그녀는 자리를 지킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘길들의 집’이며, 길들이 만나는 곳이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ מְרוֹמִים
  english_pob_choice: On the heights
  chosen_korean: 높은 곳
  alternatives_korean:
  - 높은 지대에서
  - 산꼭대기에서
  - 높은 곳에
  lexicon: HALOT
  rationale: רֹאשׁ과 מְרוֹמִים이 이루는 위치 표현을 한국어의 자연스러운 지형 표현인 ‘높은 곳’으로 옮겨, 지혜가 눈에 띄는 드높은 장소에 선다는 의미를 살렸습니다.
- source_word: עֲלֵי דָרֶךְ
  english_pob_choice: beside the road
  chosen_korean: 길가 곁
  alternatives_korean:
  - 길옆
  - 도로 옆
  - 길을 따라
  lexicon: HALOT
  rationale: 단순한 ‘길’ 위가 아니라 길가에 붙어 있는 공개적·접근 가능한 위치를 나타내므로, 현대 한국어에서 자연스러운 ‘길가 곁’이 적절합니다.
- source_word: בֵּית נְתִיבוֹת
  english_pob_choice: at the crossroads
  chosen_korean: 길들이 만나는 곳
  alternatives_korean:
  - 갈림길에서
  - 길들의 교차점에서
  - 사거리에서
  lexicon: HALOT
  rationale: 직역하면 ‘길들의 집’이지만, 관용적으로 길이 모이는 지점을 뜻하므로, 원뜻을 드러내는 ‘길들이 만나는 곳’으로 옮겼습니다.
- source_word: נִצָּבָה
  english_pob_choice: she takes her stand
  chosen_korean: 자리를 지킵니다
  alternatives_korean:
  - 서 있습니다
  - 자리를 잡습니다
  - 굳게 섭니다
  lexicon: HALOT
  rationale: 의도적으로 서서 자신을 드러내는 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘자리를 지킵니다’를 선택했습니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지
  chosen_reading: 히브리어 여성 단수형에 맞춰 ‘그녀는’으로 유지했습니다.
  alternative_readings:
  - 지혜는 자리를 지킵니다
  - 그는 자리를 지킵니다
  - 중성적으로 표현
  rationale: 본문의 의인화된 지혜는 여성형 동사와 맞물리므로, 문학적 형식을 보존하는 것이 원문 수용 효과를 가장 잘 전달합니다.
  doctrine_reference: 번역 철학 §4 (문학적 성별 표지 보존)
