  text: To you[a], O men, I call, and my voice is to the sons of mankind.
  footnotes:
  - marker: a
    text: Or 'the children of humanity' / 'human beings.' The Hebrew says 'the sons of man,' a common expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들아, 내가 너희에게 부릅니다. 내 목소리는 사람들에게[a] 향합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류에게’. 히브리어를 직역하면 ‘사람의 아들들’이며, 인간 일반을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלֵיכֶם
  english_pob_choice: To you
  chosen_korean: 너희에게
  alternatives_korean:
