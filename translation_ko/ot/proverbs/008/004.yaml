id: PRO.8.4
reference: Proverbs 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
  footnotes:
  - marker: a
    text: Or 'the children of humanity' / 'human beings.' The Hebrew says 'the sons of man,' a common expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희에게, 오 사람들아, 내가 부르며, 내 목소리는 사람의 아들들에게로 향합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간들에게’, ‘인류에게’. 히브리어는 ‘사람의 아들들’이라는 관용적 표현으로 인간 일반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלֵיכֶם
  english_pob_choice: To you
  chosen_korean: 너희에게
  alternatives_korean:
  - 당신들에게
  - 여러분에게
  lexicon: HALOT
  rationale: 2인칭 복수 여격을 자연스러운 현대 한국어로 옮기되, 잠언의 직접 호소를 살리기 위해 평서체보다 직접적인 ‘너희에게’를 택했습니다.
- source_word: אִישִׁים
  english_pob_choice: O men
  chosen_korean: 오 사람들아
  alternatives_korean:
  - 오 남자들아
  - 오 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성형 vocative를 살리면서도 한국어에서 성별만을 과도하게 전면화하지 않도록 ‘사람들아’로 옮기고, 감탄적 호격은 ‘오’로 보완했습니다.
- source_word: וְקוֹלִי
  english_pob_choice: and my voice
  chosen_korean: 내 목소리는
  alternatives_korean:
  - 그리고 내 소리는
  - 또 내 음성은
  lexicon: HALOT
  rationale: קוֹל의 기본 의미인 ‘목소리’를 보존해 병행구조를 살렸습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of mankind
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인간의 아들들
  - 인류의 자녀들
  - 사람들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘사람의 아들들’로 히브리어 관용구의 남성적·계보적 표현을 보존했습니다. POB의 독해상 이 표현은 일반 인간을 가리키므로, 본문은 유지하되 한국어 독자에게는 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 히브리어의 남성형 병렬 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에서는 ‘오 사람들아’와 ‘사람의 아들들’을 유지해 남성형 병렬의 수사적 대비를 살렸습니다.
  alternative_readings:
  - 오 사람들 ... 인류에게
  - 오 남자들 ... 사람들
  rationale: 원문은 אִישִׁים과 בְּנֵי אָדָם을 병렬로 두어 지혜의 부름을 보편적 인간에게 확장합니다. 한국어에서는 성별 고정성을 과도하게 강화하지 않으면서도 원문의 직접 호소를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; contested terms guidance for anthropos-language'
