  source_fidelity: 히브리어는 지혜가 ‘너희, 사람들(אִישִׁים)’에게 부르며 그 목소리가 ‘사람의 아들들(בְּנֵי אָדָם)’, 곧 인간 일반에게 향한다고 말합니다. ‘사람의 아들들’은 한국어에서 부자연스럽고 특정한 혈연 집단처럼 들리므로, 본문에서는 관용적 의미를 ‘사람들에게’로 옮기고 직역은 각주로 보존하는 편이 충실합니다.
  naturalness: 초안의 ‘내가 부르며’는 독립된 선언인 אֶקְרָא를 종속적으로 처리하여 어색합니다. 또한 ‘오 사람들아’보다 문어적 호격 ‘사람들아’가 현대 한국어 성서 문체에 자연스럽습니다. ‘내 목소리는 사람의 아들들에게로 향합니다’도 직역투이므로 ‘사람들에게 향합니다’가 적절합니다.
  terminology: ‘목소리’는 קוֹל을 정확히 옮깁니다. אִישִׁים은 이 문맥에서 청중을 가리키며 한국어 ‘사람들아’로 자연스럽게 표현할 수 있습니다. בְּנֵי אָדָם의 인간 일반이라는 관용적 뜻은 ‘사람들에게’와 각주의 직역 설명으로 함께 보존합니다.
