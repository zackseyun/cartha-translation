id: PRO.8.1
reference: Proverbs 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
  footnotes:
  - marker: a
    text: Or 'cry out' for 'call.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'give her voice'; the Hebrew idiom means 'raise her voice' or 'speak out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜가 부르지 않습니까? 명철이 소리를 높이지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 목소리를 주다’이지만, 히브리어 관용구로서 ‘소리를 높이다’ 또는 ‘크게 말하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르다’는 여기서 단순한 호출보다 공개적으로 외치는 행위를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Does not
  chosen_korean: …하지 않습니까?
  alternatives_korean:
  - …아닙니까?
  - 분명 …합니다
  lexicon: HALOT
  rationale: 수사 의문문으로서 대답을 기대하는 힘을 살리기 위해, 단정적 서술보다 ‘…하지 않습니까?’를 택했습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜로운 분
  - 지혜[의 인격화]
  lexicon: HALOT
  rationale: 히브리어의 추상명사를 그대로 살려 ‘지혜’로 옮기되, 절 자체의 인격화는 문맥이 드러내도록 두었습니다.
- source_word: תִּתֵּן קוֹלָהּ
  english_pob_choice: raise her voice
  chosen_korean: 소리를 높이다
  alternatives_korean:
  - 목소리를 내다
  - 외치다
  - 그 목소리를 주다
  lexicon: HALOT
  rationale: 직역인 ‘목소리를 주다’는 한국어에서 부자연스러우므로, 관용적이면서도 히브리어 관용구의 의미를 보존하는 ‘소리를 높이다’로 옮겼습니다.
theological_decisions:
- issue: 지혜와 명철의 인격화
  chosen_reading: ‘지혜’와 ‘명철’을 추상명사로 유지하되, 여성 대명사나 대문자화로 신학적 동일시를 강화하지 않았습니다.
  alternative_readings:
  - ‘지혜’ 대신 ‘지혜님’처럼 인격화하기
  - ‘Wisdom’처럼 고유명사화하기
  - 중성화하여 ‘그것’으로 번역하기
  rationale: 본문은 여성형 문법과 시적 인격화를 사용하지만, 이 절 자체는 지혜의 정체를 더 규정하지 않으므로 과도한 신학적 확대를 피하는 것이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 본문이 말하는 만큼만 말하고, 본문이 침묵하는 부분은 해석으로 채우지 않습니다.
