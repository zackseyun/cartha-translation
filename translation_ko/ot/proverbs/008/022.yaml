  text: יְֽהוָ֗ה קָ֭נָ/נִי רֵאשִׁ֣ית דַּרְכּ֑/וֹ קֶ֖דֶם מִפְעָלָ֣י/ו מֵ/אָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
  footnotes:
  - marker: a
    text: Or, 'The LORD created me' or 'The LORD acquired me.' The Hebrew verb can carry more than one sense, and this verse has been central in historical debates about personified Wisdom and its relation to the Son.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 자신의 길의 시작에, 곧 오래전 자신의 일들보다 먼저 나를 소유하셨습니다<a>.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 나를 창조하셨습니다’ 혹은 ‘주께서 나를 획득하셨습니다.’ 히브리어 동사에는 여러 의미가 있을 수 있으며, 이 절은 지혜의 의인화와 그리스도와의 관계에 관한 역사적 논쟁의 중심이 되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 히브리어 고유명사 יְהוָה는 한국어에서 전통적 대체어보다 음역인 ‘야훼’로 옮겨 POB의 원칙을 따랐습니다.
- source_word: קָנָנִי
  english_pob_choice: possessed me
  chosen_korean: 소유하셨습니다
  alternatives_korean:
  - 창조하셨습니다
  - 획득하셨습니다
  - 가지셨습니다
  lexicon: HALOT
  rationale: קנה는 ‘획득하다/소유하다’의 뜻을 기본으로 하므로, ‘소유하셨습니다’가 본문의 어휘 범위를 살리면서도 ‘창조’로 성급히 고정하지 않습니다.
- source_word: רֵאשִׁית דַּרְכּוֹ
  english_pob_choice: the beginning of his way
  chosen_korean: 자신의 길의 시작
  alternatives_korean:
  - 그의 길의 시작
  - 자신의 পথ의 처음
  lexicon: HALOT
  rationale: רֵאשִׁית와 דַּרְכּוֹ를 시간적 표현으로 읽어 ‘자신의 길의 시작’으로 옮기면, 하나님의 활동의 시작이라는 의미를 자연스럽게 드러낼 수 있습니다.
- source_word: מִפְעָלָיו מֵאָז
  english_pob_choice: his works of old
  chosen_korean: 오래전 자신의 일들보다 먼저
  alternatives_korean:
  - 옛적 자신의 일들보다 먼저
  - 옛날 자신의 행위들보다 먼저
  lexicon: HALOT
  rationale: מִפְעָלָיו와 מֵאָז의 핵심은 ‘오래전’의 시간적 선행이므로, 한국어에서는 ‘보다 먼저’ 구문으로 앞선 존재를 분명히 했습니다.
theological_decisions:
- issue: קָנָנִי의 번역이 지혜의 인격화와 그리스도론 논쟁에 미치는 영향
  chosen_reading: 본문은 ‘소유하셨습니다’로 두고, ‘창조하셨습니다’는 주석에 보존합니다.
  alternative_readings:
  - 창조하셨습니다
  - 획득하셨습니다
  - 낳으셨습니다
  rationale: 잠언 8장은 지혜의 의인화 문맥이므로, 본문에서 곧바로 ‘창조’로 확정해 후대 교리 논쟁을 대신 결론내리지 않도록 했습니다. 동시에 어휘상의 가능한 의미는 각주로 보존해 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3; 니케아 신경(381)
