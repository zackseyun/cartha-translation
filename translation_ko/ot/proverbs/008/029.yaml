  source_fidelity: 첫 절의 ‘바다를 위해 그 경계를’는 히브리어의 ‘바다에/바다를 위하여 경계를’라는 관계를 한국어에서 다소 부자연스럽게 드러냅니다. 또한 פִּיו(직역 ‘그의 입’)는 여기서 명령의 환유이므로 ‘명령을 넘다’보다 ‘명령을 어기다’가 한국어 관용과 본문의 뜻을 더 정확히 전달합니다. בְּחוּקוֹ의 ‘정하다’는 가능한 번역이지만, ‘정해 놓다’가 기초를 정하거나 획정하는 창조 행위를 좀 더 분명히 합니다.
  naturalness: ‘그가 바다를 위해 그 경계를 정하실 때’와 ‘그의 명령을 넘지 못하게’는 현대 표준어에서 어색합니다. 또한 각주 표지는 해당 낱말 바로 뒤에 놓는 편이 독자의 이해와 각주 연결에 적절합니다.
  terminology: ‘경계’는 חֻקּוֹ의 문맥상 의미를 잘 살립니다. ‘그의 명령’은 פִּיו의 환유를 자연스럽게 번역한 것으로 유지할 수 있습니다. 하나님의 행위에는 합쇼체 높임말 ‘정하시고/하시며/정해 놓으실’이 적절합니다.
