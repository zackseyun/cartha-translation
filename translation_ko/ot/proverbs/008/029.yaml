translation:
  language: ko
  text: 그가 바다에 경계를 정하시고[a], 물이 그의 명령[b]을 어기지 않게 하시며, 땅의 기초를 정해 놓으실 때에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경계’는 חֻקּוֹ의 가능한 뜻 중 하나이며, 이 문맥에서는 바다에 대하여 정해진 한계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 명령’은 문자적으로는 ‘그의 입’입니다. 히브리어의 환유를 한국어에서 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  english_pob_choice: when he set
  chosen_korean: 그가 … 정하실 때
  alternatives_korean:
  - 그가 … 두실 때
  - 그가 … 놓으실 때
  lexicon: HALOT
  rationale: בְ + 부정사구는 문맥상 시간 부사절로 읽히므로 ‘…할 때’로 옮겼고, 창조 행위의 엄숙함을 살려 ‘정하실’이 자연스럽습니다.
- source_word: חֻקּוֹ
  english_pob_choice: a boundary
  chosen_korean: 그 경계
  alternatives_korean:
  - 그 한계
  - 그 정해진 सीमा
  lexicon: HALOT
  rationale: 이 어형은 규례/명령뿐 아니라 ‘정해진 경계’도 뜻하므로, 바다에 대한 구체적 제한이라는 문맥을 따라 ‘경계’로 옮겼습니다.
- source_word: פִּיו
  english_pob_choice: his command
  chosen_korean: 그의 명령
  alternatives_korean:
  - 그의 입
  - 그의 말씀
  lexicon: HALOT
  rationale: 직역하면 ‘그의 입’이지만, 히브리어의 환유를 살려 ‘입에서 나오는 것’인 명령을 분명하게 드러내는 한국어로 옮겼습니다.
- source_word: בְּחוּקוֹ
  english_pob_choice: when he marked out
  chosen_korean: 정하실 때
  alternatives_korean:
  - 새기실 때
  - 그어 놓으실 때
  - 표시하실 때
  lexicon: HALOT
  rationale: 같은 시간 부사절 구조로 읽히며, ‘땅의 기초’를 대상으로 한 창조적 설정이라는 점에서 ‘정하다’가 가장 균형 잡힙니다.
theological_decisions:
- issue: 지혜의 시에서의 창조 묘사 유지
  chosen_reading: 하나님이 바다의 경계와 땅의 기초를 정하신 실제적 창조 질서를 묘사하는 시적 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 질서 은유로만 약화하기
  - 후대의 그리스도론으로 본문을 본문 자체보다 앞서 해석하기
  rationale: 본문은 지혜가 창조를 회고하는 시적 진술이므로, 히브리어가 제시하는 구체적 창조 이미지를 살리되 그 이상으로 해석을 밀어붙이지 않았습니다.
  doctrine_reference: 문맥 존중과 신학적 긴장 보존
