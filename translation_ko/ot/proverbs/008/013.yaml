id: PRO.8.13
reference: Proverbs 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
  footnotes:
  - marker: a
    text: Or 'a perverse mouth' or 'a mouth of crookedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하는 것은 악을 미워하는 것입니다. 교만과 거만, 악한 길과 뒤틀린 말을 하는 입[a]을 내가 미워합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뒤틀린 말을 하는 입’은 ‘비뚤어진 입’ 또는 ‘뒤틀림의 입’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 여호와를 경외하는 것
  alternatives_korean:
  - 야훼를 경외하는 것
  - 여호와에 대한 두려움
  lexicon: HALOT
  rationale: יִרְאַת는 단순한 공포가 아니라 경외의 태도를 가리키므로 ‘경외하는 것’으로 옮겼고, 본문 전통에 따라 יהוה는 한국어 성경 관용을 따라 ‘여호와’로 처리했습니다.
- source_word: שְׂנֹאת רָע
  english_pob_choice: to hate evil
  chosen_korean: 악을 미워하는 것입니다
  alternatives_korean:
  - 악을 증오하는 것입니다
  - 악을 싫어하는 것입니다
  lexicon: HALOT
  rationale: షנאת는 지혜문학에서 규범적·도덕적 혐오를 나타내므로 ‘미워하다’가 적절하며, nominal/infinitive 구성을 한국어 자연문장으로 풀어 ‘~하는 것입니다’로 옮겼습니다.
- source_word: גֵּאָה וְ/גָא֨וֹן
  english_pob_choice: pride and arrogance
  chosen_korean: 교만과 거만
  alternatives_korean:
  - 교만과 오만
  - 자만과 거만
  lexicon: HALOT
  rationale: 두 명사가 서로 겹치지만 어감이 약간 다르므로, 첫째는 일반적 악덕인 ‘교만’, 둘째는 높아진 태도를 드러내는 ‘거만’으로 구분해 반복의 강조를 살렸습니다.
- source_word: וְ/דֶ֣רֶךְ רָ֭ע
  english_pob_choice: the way of evil
  chosen_korean: 악한 길
  alternatives_korean:
  - 악의 길
  - 악행의 길
  lexicon: HALOT
  rationale: ‘길’은 삶의 방식이라는 비유를 담고 있어 유지하되, 한국어에서는 관형어 구성인 ‘악한 길’이 가장 자연스럽고 직설적입니다.
- source_word: וּ/פִ֨י תַהְפֻּכ֬וֹת
  english_pob_choice: a mouth of perversions
  chosen_korean: 뒤틀린 말의 입
  alternatives_korean:
  - 뒤틀림의 입
  - 비뚤어진 말의 입
  - 왜곡된 입
  lexicon: HALOT
  rationale: פִי는 소유격이 없는 ‘입’이고, תַהְפֻּכוֹת는 왜곡·전도·뒤틀림의 복수 추상명사이므로, 직역 구조를 살리면서 한국어로는 ‘뒤틀린 말의 입’이 가장 읽기 쉽습니다.
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_korean: 내가 미워합니다
  alternatives_korean:
  - 나는 미워합니다
  - 내가 싫어합니다
  lexicon: HALOT
  rationale: 화자 1인칭 현재적 진술을 살려 ‘내가’로 주어를 분명히 했고, 지혜담화의 선언성을 유지하기 위해 평서형 종결 ‘미워합니다’를 사용했습니다.
theological_decisions:
- issue: 화자 정체를 본문 안에서 명시할지 여부
  chosen_reading: 본문에는 화자를 따로 밝히지 않고, 1인칭 발화를 그대로 유지했습니다.
  alternative_readings:
  - '지혜가 말합니다: ...'
  - '하나님이 말씀하십니다: ...'
  rationale: 히브리어 본문은 지혜의 담화 흐름 안에서 갑자기 1인칭으로 전환하므로, 이를 설명문으로 풀어버리면 본문이 가진 문학적·신학적 긴장을 약화시킵니다.
  doctrine_reference: personified Wisdom discourse
