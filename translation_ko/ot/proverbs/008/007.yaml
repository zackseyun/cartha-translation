id: PRO.8.7
reference: Proverbs 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אֱ֭מֶת יֶהְגֶּ֣ה חִכִּ֑/י וְ/תוֹעֲבַ֖ת שְׂפָתַ֣/י רֶֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
  footnotes:
  - marker: a
    text: Literally, 'my palate will utter truth.' Here 'palate' functions as a figure for the organ of speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 입이 진실을 말하고, 악은 내 입술에 가증한 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 입천장’입니다. 여기서는 발화 기관을 가리키는 비유로 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 내 입은 진리를 말하고
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 절의 시작 כִּי는 앞말에 대한 설명을 이끄는 접속으로, 한국어에서는 자연스러운 직역보다 문맥상 연결을 살려 다음 진술로 바로 이어지게 했습니다.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참된 것
  lexicon: HALOT
  rationale: 지혜의 발화 내용으로서 אֱמֶת는 단순 사실성보다 सत्य/진실한 내용 전체를 가리키므로, 간결하면서도 무게가 있는 ‘진리’로 옮겼습니다.
- source_word: חִכִּי
  english_pob_choice: my mouth
  chosen_korean: 내 입
  alternatives_korean:
  - 내 입천장
  - 내 입술
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘내 입천장/입천장 부위’이지만, 영어 POB처럼 발화 기관의 환유로 이해되는 표현이므로 한국어에서는 의미를 분명히 하는 ‘내 입’으로 옮겼습니다.
- source_word: תוֹעֲבַת שְׂפָתַי
  english_pob_choice: is an abomination to my lips
  chosen_korean: 내 입술에는 악이 가증합니다
  alternatives_korean:
  - 내 입술이 악을 혐오합니다
  - 악은 내 입술에 가증합니다
  lexicon: HALOT
  rationale: תוֹעֵבָה는 단순한 ‘싫음’보다 도덕적 혐오를 나타내므로 ‘가증합니다’를 살렸고, שְׂפָתַי는 관계를 자연스럽게 드러내는 조사 ‘에는’으로 처리했습니다.
- source_word: רֶשַׁע
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 불의
  - 사악함
  lexicon: HALOT
  rationale: 여기서는 지혜의 입술이 배척하는 도덕적 반대 항목을 압축적으로 가리키므로, 너무 설명적인 ‘악행’보다 대조가 분명한 ‘악’을 선택했습니다.
theological_decisions:
- issue: 지혜의 자기발화가 단순 정보 전달이 아니라 도덕적 분별을 드러냄
  chosen_reading: 지혜가 자신의 말과 입술을 통해 진리와 악의 배제를 대조적으로 선언합니다.
  alternative_readings:
  - 단순히 화법의 수사로만 읽기
  - 도덕적 단언을 약화해 중립적으로 번역하기
  rationale: 문맥상 지혜는 말의 내용뿐 아니라 말하는 존재의 성격을 드러내므로, ‘진리’와 ‘가증함’의 윤리적 대비를 유지해야 합니다.
  doctrine_reference: 잠언의 지혜 문학에서 의인화된 지혜의 도덕적 발화
- issue: 원문의 입천장 이미지와 한국어 가독성의 균형
  chosen_reading: 이미지는 유지하지 않고 의미를 우선해 ‘입’으로 옮겼습니다.
  alternative_readings:
  - ‘입천장’으로 직역하기
  - 각주 없이 이미지 제거하기
  rationale: 히브리어의 신체 비유는 발화 기관의 환유이므로, 한국어 본문에서는 이해를 돕되 원문의 뜻을 훼손하지 않는 범위에서 자연화했습니다.
  doctrine_reference: 시적 환유의 의미 보존 원칙
