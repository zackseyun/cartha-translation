id: PRO.8.30
reference: Proverbs 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
  footnotes:
  - marker: a
    text: Or 'like a little child' (or 'as a faithful one'); the Hebrew word translated 'master workman' is difficult and may carry a different nuance.
    reason: alternative_reading
  - marker: b
    text: Or 'playing before him at all times.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 그 곁에 있어 장인처럼 일했고[a], 날마다 그의 기쁨이었으며, 언제나 그의 앞에서 즐거워하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린아이처럼’(또는 ‘충실한 자처럼’)일 수 있습니다. 여기서 ‘장인처럼 일하는 자’로 옮긴 히브리어는 해석이 어렵고, 다른 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언제나 그의 앞에서 놀며.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  english_pob_choice: I was
  chosen_korean: 나는 ... 있었습니다 / 있어
  alternatives_korean:
  - 나는 ... 되었습니다
  - 나는 ... 있었습니다
  lexicon: WLC; HALOT
  rationale: 상태 지속을 나타내는 היה의 서술적 용법을 한국어에서 자연스럽게 살려 ‘있어/있었습니다’로 옮겼습니다.
- source_word: אֶצְלוֹ
  english_pob_choice: beside him
  chosen_korean: 그 곁에
  alternatives_korean:
  - 그와 함께
  - 그 옆에
  lexicon: HALOT
  rationale: אצל의 근접·동반 의미를 살리되, 한국어에서 가장 자연스러운 공간적 표현으로 ‘그 곁에’를 선택했습니다.
- source_word: אָמֹון
  english_pob_choice: like a master workman
  chosen_korean: 장인처럼 일했고
  alternatives_korean:
  - 숙련된 일꾼처럼
  - 마스터 워크맨처럼
  - 어린아이처럼
  lexicon: HALOT
  rationale: 해석이 어려운 אָמֹון은 창조 문맥에 가장 잘 맞는 ‘숙련된 제작자/장인’ 쪽 의미를 본문에 반영하고, 다른 가능성은 각주로 보존했습니다.
- source_word: מְשַׂחֶקֶת
  english_pob_choice: rejoicing
  chosen_korean: 즐거워하였습니다
  alternatives_korean:
  - 뛰놀았습니다
  - 노닐었습니다
  - 기뻐하며 놀았습니다
  lexicon: HALOT
  rationale: שׂחק의 ‘놂/희롱/기쁨’ 범위를 그대로 ‘놀다’로만 고정하면 오해가 생길 수 있어, 시적 문맥에 맞는 ‘즐거워하다’로 옮겼습니다.
theological_decisions:
- issue: אָמֹון의 난해성과 창조 지혜의 역할
  chosen_reading: 본문에는 ‘장인처럼’이라는 주해적 선택을 반영하되, אָמֹון의 대안적 의미 가능성은 각주로 남겨 독단적으로 확정하지 않았습니다.
  alternative_readings:
  - 어린아이처럼
  - 충실한 자처럼
  rationale: 지혜의 창조 참여를 말하는 맥락은 분명하지만, 단어 자체는 모호하므로 본문과 주석에서 긴장을 보존하는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
