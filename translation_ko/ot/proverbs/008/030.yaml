  source_fidelity: 본문의 ‘그 곁에 있어 장인처럼 일했고’는 אָמוֹן을 ‘장인처럼 일하다’라는 동작으로 풀어, 원문의 명사적·역할적 표현보다 해석을 한 단계 더 보탭니다. 또한 각주는 본문에 없는 ‘장인처럼 일하는 자’라는 표현을 가리킵니다. ‘장인처럼 그 곁에 있었고’로 고치면 영어 POB의 ‘beside him, like a master workman’과 히브리어의 어순·의미를 더 직접적으로 반영하면서 난해한 어휘의 여지도 보존합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘날마다’와 ‘언제나’는 각각 יוֹם יוֹם과 בְּכָל עֵת의 반복적·포괄적 지속을 구별하여 나타냅니다.
