lexical_decisions:
- source_word: עֹשֶׁר
  english_pob_choice: riches
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  lexicon: HALOT
  rationale: 물질적 풍요를 가리키는 말로, 앞뒤의 ‘명예’와 평행을 이루는 문맥에서 자연스럽고 중립적인 표현입니다.
- source_word: כָבוֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 영광
  - 존귀
  lexicon: HALOT
  rationale: 지혜문학 문맥에서는 하나님의 영광보다 사회적 인정과 품위를 뜻하는 경우가 많아 ‘명예’가 가장 직접적입니다.
- source_word: הוֹן עָתֵק
  english_pob_choice: enduring wealth
  chosen_korean: 지속하는 부
  alternatives_korean:
  - 영속하는 재물
  - 오래 가는 부
  lexicon: HALOT
  rationale: ‘הוֹן’의 부유함을 살리되, ‘עָתֵק’의 지속성·견고함을 현대 한국어로 간결하게 드러내는 표현입니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: 지혜가 주는 선물이라는 넓은 도덕적 맥락에서, 문맥상 ‘의’가 ‘의로움/정의’보다 더 압축적이고 성경적 어감을 유지합니다.
theological_decisions:
- issue: צְדָקָה의 번역 범위 보존
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 이 절은 법정적 판결이나 사회정의 담론이 아니라 지혜의 풍성한 열매를 말하므로, 의미 범위를 과도하게 좁히지 않는 ‘의’를 본문에 두었습니다.
  doctrine_reference: Translation philosophy §3; contested-term handling
