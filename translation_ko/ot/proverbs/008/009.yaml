  source_fidelity: 히브리어의 병행 구조와 핵심 어휘는 대체로 반영되었으나, לְמֹצְאֵי는 단순히 지식을 ‘찾는’ 사람보다 지식을 ‘발견한/얻은’ 사람을 가리킵니다. 또한 각 절의 복수 형용사는 앞 문맥의 지혜의 말들을 수식하므로 ‘그 모든 말은’으로 밝혀 주는 것이 자연스럽습니다.
