base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/009.yaml
  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
  footnotes:
  - marker: a
    text: Or 'plain' or 'right' for 'straightforward.' The Hebrew emphasizes that wisdom's words are direct and not crooked to the discerning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 모든 말은 분별하는 이에게는 바르고,[a] 지식을 얻은 이들에게는 곧습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바르고’로 번역한 히브리어는 문맥에 따라 ‘분명하고’, ‘곧고’, 또는 ‘옳다’는 뜻을 나타낼 수 있습니다. 여기서는 지혜의 말이 분별하는 사람에게 굽거나 속이지 않는 말임을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  english_pob_choice: All of them
  chosen_korean: 그것들은 모두
  alternatives_korean:
  - 모두
  - 그것들 모두
  lexicon: HALOT
  rationale: 앞문맥의 지혜의 말들을 가리키는 복수 지시를 한국어에서 자연스럽게 드러내되, 포괄성을 보존했습니다.
- source_word: נְכֹחִים
  english_pob_choice: straightforward
  chosen_korean: 바른
  alternatives_korean:
  - 곧은
  - 분명한
  - 직선적인
  lexicon: HALOT
  rationale: 직설적이고 굽지 않은 말이라는 뜻을 살리면서, 한국어에서 지혜문학의 문맥에 자연스럽고 문체상 과도하게 평면적이지 않은 표현을 택했습니다.
- source_word: לַמֵּבִין
  english_pob_choice: to the one who understands
  chosen_korean: 이해하는 이에게는
  alternatives_korean:
  - 분별하는 이에게는
  - 깨닫는 이에게는
  lexicon: HALOT
  rationale: בין 계열의 참여형을 ‘이해하는 이’로 옮겨, 지각과 분별이 있는 사람을 가리키는 관계를 살렸습니다.
- source_word: וִישָׁרִים
  english_pob_choice: and upright
  chosen_korean: 곧습니다
  alternatives_korean:
  - 바릅니다
  - 정직합니다
  lexicon: HALOT
  rationale: 첫 절의 ‘바른’과 평행을 이루면서도, יָשָׁר의 ‘곧고 바름’이라는 감각을 한국어에서 중복 없이 담기 위해 ‘곧습니다’를 택했습니다.
