id: PRO.13.17
reference: Proverbs 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַלְאָ֣ךְ רָ֭שָׁע יִפֹּ֣ל בְּ/רָ֑ע וְ/צִ֖יר אֱמוּנִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/017.yaml
  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
  footnotes:
  - marker: a
    text: Or 'A wicked messenger falls into evil/harm.' The Hebrew phrase may be rendered more literally, but here likely refers to the harmful trouble that befalls him.
    reason: lexical_alternative
  - marker: b
    text: Or 'messenger' or 'ambassador' for 'envoy.' The Hebrew uses two different words for messenger in this proverb.
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사자는 해를 당하고, 신실한 사절은 치유를 가져옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרָע는 여기서 도덕적 ‘악’이라기보다 그에게 닥치는 해로운 결과, 곧 ‘해/재앙’의 의미로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어는 두 서로 다른 말을 사용합니다: מַלְאָךְ(전달자)와 צִיר(공식 사절/전령).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 전령
  - 사절
  lexicon: HALOT
  rationale: 지혜문맥에서 אדם에게 보내진 전달자를 가리키므로, 문어체이면서도 인간 전달자를 자연스럽게 드러내는 ‘사자’를 택했습니다. ‘천사’는 오해를 낳을 수 있어 배제했습니다.
- source_word: רָשָׁע
  english_pob_choice: wicked
  chosen_korean: 악한
  alternatives_korean:
  - 악독한
  - 불의한
  - 사악한
  lexicon: HALOT
  rationale: 사자를 수식하는 도덕적 성격을 그대로 살리기 위해 ‘악한’으로 옮겼습니다.
- source_word: בְּרָע
  english_pob_choice: into trouble
  chosen_korean: 해를 당하고
  alternatives_korean:
  - 재앙에 빠지고
  - 환난에 빠지고
  - 악에 빠지고
  lexicon: HALOT
  rationale: 히브리어는 ‘악/해/재앙’ 계열의 관용적 표현으로, 여기서는 앞절의 ‘악한 사자’와 대비되는 해로운 결과를 뜻하므로 ‘해를 당하다’로 자연스럽게 풀었습니다.
- source_word: צִיר אֱמוּנִים
  english_pob_choice: faithful envoy
  chosen_korean: 신실한 사절
  alternatives_korean:
  - 충실한 전령
  - 믿을 만한 사자
  - 충직한 사절
  lexicon: HALOT
  rationale: צִיר는 임무를 띤 공식 전달자를 가리키므로, 첫 반의 ‘사자’와 구별되게 ‘사절’로 옮기고 אֱמוּנִים의 신실함은 ‘신실한’으로 살렸습니다.
- source_word: מַרְפֵּא
  english_pob_choice: healing
  chosen_korean: 치유를 가져옵니다
  alternatives_korean:
  - 치유입니다
  - 회복을 가져옵니다
  - 낫게 합니다
  lexicon: HALOT
  rationale: 명사 자체는 ‘치유/회복’이지만, 문장 안에서 결과를 나타내는 한국어로는 ‘치유를 가져오다’가 가장 자연스럽고 대조도 분명합니다.
theological_decisions:
- issue: אָ֫w/רָע의 의미를 도덕적 악으로만 둘지, 해/재앙의 결과로 볼지
  chosen_reading: 이 구절에서는 רע를 도덕적 ‘악’보다 그에게 닥치는 해로운 결과로 이해해 ‘해를 당하다’로 옮겼습니다.
  alternative_readings:
  - 악에 빠집니다
  - 재앙에 빠집니다
  - 악을 만납니다
  rationale: 같은 어근이지만 평행법상 뒤의 ‘치유’와 짝을 이루는 것은 행위의 악보다 피해/재난의 결과이므로, 본문의 대비를 살리는 번역이 필요합니다.
  doctrine_reference: 잠언의 지혜 격언 표현과 히브리어 관용법
- issue: 두 종류의 전달자 용어를 한국어에서 어떻게 구별할지
  chosen_reading: מַלְאָךְ는 ‘사자’, צִיר는 ‘사절’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 사자
  - 둘 다 전령
  - 둘 다 메신저
  rationale: 히브리어가 서로 다른 두 용어를 의도적으로 병렬하므로, 한국어에서도 동일어 반복보다 직무 뉘앙스 차이를 드러내는 것이 본문의 대비를 더 잘 보존합니다.
  doctrine_reference: 문학적 평행법 보존
