  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
  footnotes:
  - marker: a
    text: Literally, 'children's children.'
    reason: lexical_alternative
  - marker: b
    text: Or 'is hidden away' / 'is reserved for the righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 선한 사람은 손주들[a]에게 유산을 남기지만, 죄인의 재물은 의인을 위하여 보관되어 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자녀들의 자녀들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보관되어 있습니다’는 ‘숨겨져 있습니다’ 또는 ‘의인을 위하여 예비되어 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: a good man
  chosen_korean: 좋은 사람은
  alternatives_korean:
  - 좋은 남자는
  - 선한 사람은
  lexicon: HALOT
  rationale: 히브리어 형용사가 명사처럼 쓰여 잠언적으로 한 사람을 가리키므로, 성별을 과도하게 일반화하지 않으면서도 자연스러운 한국어로 옮겨 ‘좋은 사람’으로 처리했습니다.
- source_word: יַנְחִיל
  english_pob_choice: leaves an inheritance
  chosen_korean: 유산을 남기지만
  alternatives_korean:
  - 유산을 물려주지만
  - 상속하게 하지만
  lexicon: HALOT
  rationale: הִפְעִיל형의 ‘상속하게 하다/물려주다’라는 causative 의미를 한국어 잠언 문맥에 맞게 압축해 ‘유산을 남기다’로 표현했습니다.
- source_word: בְּנֵי בָנִים
  english_pob_choice: his grandchildren
  chosen_korean: 그의 손주들에게
  alternatives_korean:
  - 그의 자손의 자손에게
  - 그의 손자들에게
  lexicon: HALOT
  rationale: 직역하면 ‘아들들의 아들들’이지만, 세대 계승을 가장 분명하게 드러내는 현대 한국어 대응어로 ‘손주들’이 적절합니다.
- source_word: וְצָפוּן לַצַּדִּיק
  english_pob_choice: but ... is stored up / is hidden away / is reserved for the righteous
  chosen_korean: 의인을 위해 저장되어 있습니다
  alternatives_korean:
  - 의인을 위해 숨겨져 있습니다
  - 의인에게 예비되어 있습니다
  lexicon: HALOT
  rationale: צפן의 ‘숨겨 두다/저장해 두다/예비하다’ 의미를 살리되, 대구법에서 소유의 전환을 분명히 하기 위해 ‘의인을 위해 저장되어 있습니다’로 옮겼습니다.
- source_word: חֵיל חוֹטֵא
  english_pob_choice: the wealth of a sinner
  chosen_korean: 죄인의 재물
  alternatives_korean:
  - 죄인의 부
  - 죄인의 재산
  lexicon: HALOT
  rationale: חֵיל은 문맥상 재물·부·소유를 뜻하므로, 잠언의 간결한 표현으로 ‘재물’이 가장 자연스럽습니다.
theological_decisions:
- issue: 잠언의 일반 진술을 규범적 약속으로 과도하게 읽지 않기
  chosen_reading: 두 절의 대조를 유지하는 지혜 격언으로 번역했습니다.
  alternative_readings:
  - 절대적 보장으로 들리게 하는 번역
  - 도덕적 교훈만 강조하는 번역
  rationale: 본문은 의인과 죄인의 재물/유산을 대조하는 지혜 문장으로, 통상적 원리를 말합니다. 따라서 한국어에서도 격언적 성격을 보존해 과잉 신학화를 피했습니다.
  doctrine_reference: 잠언 문학의 장르 이해
