id: PRO.13.1
reference: Proverbs 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
  footnotes:
  - marker: a
    text: Or 'A wise son hears a father's discipline'; the Hebrew verb 'hear' can carry the sense of listening with acceptance or obedience, and the first clause likely implies that sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'mocker' for 'scoffer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 아들은 아버지의 훈계를 받아들입니다. 그러나 조롱하는 자는 꾸짖음을 듣지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 아들은 아버지의 훈계를 듣습니다.’ 히브리어 동사 ‘듣다’는 수용하여 귀 기울인다는 뜻을 포함할 수 있으며, 첫 절은 아마 그 의미를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비웃는 자’가 ‘조롱하는 자’의 다른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 아이
  lexicon: HALOT
  rationale: 지혜문학의 대조 구조에서 남성 단수의 대표적 사례를 유지하는 것이 자연스럽고, 성중립화보다 원문의 표상을 살리는 것이 더 적절합니다.
- source_word: מוּסַר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교훈
  - 교정
  lexicon: HALOT
  rationale: 여기서는 단순 정보 전달이 아니라 아버지의 교정적 가르침과 훈육을 가리키므로, 현대 한국어에서 가장 자연스럽게 그 긴장을 살리는 ‘훈계’로 옮겼습니다.
- source_word: שָׁמַע
  english_pob_choice: accepts / does not listen to
  chosen_korean: 받아들입니다 / 듣지 않습니다
  alternatives_korean:
  - 귀를 기울입니다 / 귀를 닫습니다
  - 순종합니다 / 순종하지 않습니다
  lexicon: HALOT
  rationale: 첫 절의 שָׁמַע는 ‘듣다’보다 ‘받아들이다’가 의미상 더 정확하게 헤아림과 수용을 드러내며, 둘째 절은 ‘듣지 않습니다’가 반대 대구를 자연스럽게 살립니다.
- source_word: לֵץ
  english_pob_choice: scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조소하는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: לֵץ는 잠언에서 교정을 멸시하며 조롱하는 태도를 가리키므로, 한국어에서 그 성격을 분명히 드러내는 표현을 택했습니다.
- source_word: גְּעָרָה
  english_pob_choice: rebuke
  chosen_korean: 꾸짖음
  alternatives_korean:
  - 책망
  - 질책
  - 타이름
  lexicon: HALOT
  rationale: גְּעָרָה는 공개적이고 분명한 책망을 뜻하므로, 현대어로는 ‘꾸짖음’이 대구와 어조를 가장 자연스럽게 맞춥니다.
theological_decisions:
- issue: 잠언의 대조법에서 ‘듣다’의 의미 범위
  chosen_reading: 첫 절은 단순 청취가 아니라 받아들임과 수용의 의미를 포함하는 것으로 옮겼습니다.
  alternative_readings:
  - ‘듣습니다’로 직역
  - ‘순종합니다’로 강화
  rationale: 히브리어 שָׁמַע는 문맥상 ‘듣고 받아들이다/heed’의 뜻을 띠므로, 지나치게 약한 직역이나 지나치게 강한 순종어휘 둘 다 피하고 의미를 균형 있게 살렸습니다.
  doctrine_reference: 잠언의 지혜 교육과 경청의 윤리
- issue: ‘조롱하는 자’의 윤리적 성격
  chosen_reading: 단순한 유머나 가벼운 비웃음이 아니라, 훈계를 거부하는 완고한 태도로 이해했습니다.
  alternative_readings:
  - ‘농담하는 자’
  - ‘비웃는 사람’
  rationale: לֵץ는 지혜문학에서 단순한 말재주가 아니라 교정에 대한 완고한 경멸을 가리키므로, 그 도덕적 무게를 약화시키지 않도록 했습니다.
  doctrine_reference: 잠언의 의인-악인 대조
