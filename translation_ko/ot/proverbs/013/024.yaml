  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
  footnotes:
  - marker: a
    text: Or 'spares his rod.' The Hebrew verb can mean 'withholds' or 'spares,' but 'withholds' better reflects the sense in contemporary English.
    reason: lexical_alternative
  - marker: b
    text: Literally 'seeks him early discipline'; the expression means to seek discipline for him earnestly or diligently.
    reason: lexical_alternative
translation:
  language: ko
  text: 채찍을 아끼는 사람은 자기 아들을 미워합니다. 그러나 그를 사랑하는 사람은 징계를 부지런히 구합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חוֹשֵׂךְ는 ‘아끼다/거두다/덜어두다’의 뜻을 가지며, 여기서는 ‘아끼는’이 현대 한국어에서 가장 자연스럽게 동작의 중단을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: מוּסָר는 단순한 훈계보다 교정과 훈육을 포함하는 말이며, 여기서는 ‘징계’가 그 넓은 뜻을 가장 잘 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  english_pob_choice: withholds
  chosen_korean: 아끼는
  alternatives_korean:
  - 거두어들이는
  - 붙들어두는
  - 주지 않는
  lexicon: HALOT
  rationale: חוֹשֵׂךְ는 ‘거두다/아끼다/덜어내다’의 의미를 가지며, 속담의 압박감을 살리기 위해 ‘채찍을 아끼는’으로 자연스럽게 옮겼습니다. 영어 POB의 withholds처럼 단순한 ‘사랑스러움’이 아니라 사용을 멈추는 동작을 드러냅니다.
- source_word: שִׁבְטוֹ
  english_pob_choice: his rod
  chosen_korean: 채찍
  alternatives_korean:
  - 막대기
  - 지팡이
  - 회초리
  lexicon: HALOT
  rationale: 지혜문학의 훈육 문맥에서 concrete한 도구 이미지를 유지하되, 현대 한국어에서 즉시 이해되는 ‘채찍’을 택했습니다. 전통적 교회어인 ‘막대’보다 훈육의 물리적 상징이 분명합니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈계
  - 교정
  - 훈련
  lexicon: HALOT
  rationale: מוּסָר는 단순한 말로 하는 가르침보다 교정적 훈육까지 포함하므로 ‘징계’가 가장 넓고도 강한 대응입니다. 영어 POB가 ‘discipline’으로 좁히지 않고 보전한 범위를 한국어에서도 유지합니다.
theological_decisions:
- issue: 체벌 이미지를 완화할지 여부
  chosen_reading: 본문의 구체적 훈육 이미지를 유지하고, ‘징계’를 통해 물리적 행위만으로 축소되지 않게 했습니다.
  alternative_readings:
  - ‘교정’을 사용해 일반적 지도 의미로 완화
  - ‘지침’을 사용해 비물리적 훈육으로 순화
  rationale: 히브리어는 실제 ‘채찍/막대’ 이미지를 사용하므로, 이를 추상화하면 잠언의 강한 대조가 약해집니다. 동시에 מוּסָר를 ‘징계’로 옮겨 단순 폭력으로 오독되지 않도록 균형을 잡았습니다.
  doctrine_reference: 원어 우선 번역 원칙; 본문의 수사적 긴장 보존; 현대 윤리 논쟁을 번역 단계에서 선결하지 않음
