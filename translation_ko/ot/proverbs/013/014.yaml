- from: 지혜로운 자의 교훈은 생명의 근원[a][b]이시니, 이는 사망의 올무에서 돌이키게 하심이라.
  to: 지혜로운 자의 교훈은 생명의 샘이며, 죽음의 올무들에서 벗어나게 합니다.[a][b]
  rationale: 부적절한 높임 표현을 제거하고 현대 합쇼체로 고쳤습니다. ‘생명의 샘’은 מְקוֹר חַיִּים의 생명 주는 물의 비유를 자연스럽게 보존하며, ‘벗어나게 합니다’는 לָסוּר의 목적/결과 용법을 과도하게 특정하지 않고 전달합니다. 각주 표지는 본문 끝에 함께 배치하여 해당 절 전체의 어휘 대안과 문법 주석에 명확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
