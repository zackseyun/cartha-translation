  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
  footnotes:
  - marker: a
    text: Or 'Only through insolence comes contention, but wisdom is with the well-advised.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 오만함으로 말미암아 다툼이 생기지만, 지혜는 권면을 받는 자들과 함께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오직 불손함으로 다툼이 생기지만, 지혜는 잘 권면받는 자들과 함께 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 단지
  - 다만
  - 오로지
  lexicon: HALOT
  rationale: רַק의 제한적·배타적 힘을 한국어에서 가장 자연스럽게 살리기 위해 ‘오직’을 택했습니다.
- source_word: בְּזָדוֹן
  english_pob_choice: by arrogance
  chosen_korean: 오만함으로 말미암아
  alternatives_korean:
  - 거만함으로
  - 불손함으로
  - 교만으로
  lexicon: HALOT
  rationale: זָדוֹן은 presumptuous pride, arrogance, insolence의 뉘앙스를 가지므로, 현대 한국어에서 그 태도를 넓게 담는 ‘오만함’이 적절합니다.
- source_word: יִתֵּן
  english_pob_choice: comes
  chosen_korean: 생기지만
  alternatives_korean:
  - 옵니다
  - 나옵니다
  - 생겨납니다
  lexicon: HALOT
  rationale: 직역하면 ‘준다’이지만 잠언의 격언적 문맥에서는 다툼이 오만함에서 비롯되어 발생한다는 뜻이므로, 자연스럽게 ‘생기다’로 옮겼습니다.
- source_word: נֹועָצִים
  english_pob_choice: those who take counsel
  chosen_korean: 권면을 받는 자들
  alternatives_korean:
  - 조언을 받는 사람들
  - 권고를 듣는 자들
  - 함께 의논하는 자들
  lexicon: HALOT
  rationale: נֹועָצִים은 조언을 받거나 받아들이는 사람들을 가리키므로, ‘권면을 받는 자들’이 수동적 뉘앙스와 지혜문맥을 함께 살립니다.
theological_decisions:
- issue: 지혜의 동반자 표지
  chosen_reading: 지혜는 단순한 정보가 아니라 권면을 받아들이는 태도와 함께 있다고 표현했습니다.
  alternative_readings:
  - 지혜는 신중한 사람들과 함께 있습니다
  - 지혜는 상담하는 자들과 함께 있습니다
  rationale: 히브리어 문맥상 지혜는 독립된 기술보다 조언을 수용하는 겸손과 연결되므로, 그 신학적 대비를 보존했습니다.
  doctrine_reference: 잠언의 지혜/교만 대조
- issue: 문장 종결의 인격화 정도
  chosen_reading: ‘다툼이 생기지만’으로 격언의 인과를 한국어에서 간명하게 표현했습니다.
  alternative_readings:
  - 다툼을 낳지만
  - 다툼을 가져오지만
  rationale: יִתֵּן의 직역보다 결과 발생을 드러내는 표현이 잠언의 잠언체 구조를 더 충실히 전달합니다.
  doctrine_reference: 잠언의 격언적 인과 표현
