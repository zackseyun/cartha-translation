  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
  footnotes:
  - marker: a
    text: Literally, 'will be made fat,' a Hebrew image for abundance and full satisfaction.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 갈망해도 그 욕구는 채워지지 않습니다. 그러나 부지런한 사람의 욕구는 풍족하게 채워집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기름지게 될 것이다’이며, 풍요와 넉넉한 만족을 나타내는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
