  chosen_korean: 풍성하게 채워집니다
  alternatives_korean:
  - 기름지게 됩니다
  - 부요하게 됩니다
  - 넉넉히 만족합니다
  lexicon: HALOT
  rationale: 직역하면 ‘기름지게 됨’이지만, 잠언의 은유적 풍요·만족의 뜻을 현대적이면서도 과장되지 않게 전달하기 위해 ‘풍성하게 채워집니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 נֶפֶשׁ의 번역 범위
  chosen_reading: 이 구절에서는 ‘영혼’이 아니라 인간의 갈망/식욕을 가리키는 말로 이해해 ‘식욕’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 생명
  - 욕구
  rationale: 지혜문학의 병행 구조상 שני occurrences of נֶפֶשׁ은 만족과 결핍을 묘사하는 실제적 욕구를 가리키며, 이를 ‘식욕’으로 풀어야 대조가 분명해집니다.
  doctrine_reference: 잠언의 지혜 시어는 인간 내면을 심리·윤리적으로 묘사하며, 여기서 נֶפֶשׁ은 존재론적 영혼 교리가 아니라 욕망의 자리입니다.
