base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
  footnotes:
  - marker: a
    text: Literally, 'will be made fat,' a Hebrew image for abundance and full satisfaction.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 갈망하지만 아무것도 얻지 못합니다. 그러나 부지런한 사람의 식욕은 풍성하게 채워집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기름지게 될 것이다’라는 뜻으로, 히브리어에서 풍요와 충분한 만족을 가리키는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  english_pob_choice: craves
  chosen_korean: 갈망하지만
  alternatives_korean:
  - 원하지만
  - 간절히 바라지만
  lexicon: HALOT
  rationale: 히트파엘 분사로 지속적이고 강한 욕구를 나타내므로, 단순한 ‘원하다’보다 ‘갈망하다’가 반복적·강한 뉘앙스를 더 잘 살립니다.
- source_word: עָצֵל
  english_pob_choice: the sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 나태한 사람
  lexicon: HALOT
  rationale: 잠언의 전형적 인물 유형을 가리키는 말이므로, 현대 한국어에서 자연스럽고 읽기 쉬운 ‘게으른 사람’으로 옮겼습니다.
- source_word: נַפְשׁוֹ / וְנֶפֶשׁ
  english_pob_choice: his appetite / the appetite
  chosen_korean: 식욕
  alternatives_korean:
  - 목숨
  - 영혼
  - 욕구
  lexicon: HALOT
  rationale: 이 문맥의 נֶפֶשׁ은 형이상학적 ‘영혼’이 아니라 갈망과 만족의 내적 욕구를 가리키므로, 앞뒤 병행을 살리는 구체적 표현인 ‘식욕’을 선택했습니다.
- source_word: תְּדֻשָּׁן
  english_pob_choice: will be richly satisfied
  chosen_korean: 풍성하게 채워집니다
  alternatives_korean:
  - 기름지게 됩니다
  - 부요하게 됩니다
  - 넉넉히 만족합니다
  lexicon: HALOT
  rationale: 직역하면 ‘기름지게 됨’이지만, 잠언의 은유적 풍요·만족의 뜻을 현대적이면서도 과장되지 않게 전달하기 위해 ‘풍성하게 채워집니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 נֶפֶשׁ의 번역 범위
  chosen_reading: 이 구절에서는 ‘영혼’이 아니라 인간의 갈망/식욕을 가리키는 말로 이해해 ‘식욕’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 생명
  - 욕구
  rationale: 지혜문학의 병행 구조상 שני occurrences of נֶפֶשׁ은 만족과 결핍을 묘사하는 실제적 욕구를 가리키며, 이를 ‘식욕’으로 풀어야 대조가 분명해집니다.
  doctrine_reference: 잠언의 지혜 시어는 인간 내면을 심리·윤리적으로 묘사하며, 여기서 נֶפֶשׁ은 존재론적 영혼 교리가 아니라 욕망의 자리입니다.
