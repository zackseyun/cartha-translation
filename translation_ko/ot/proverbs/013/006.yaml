source:
  edition: WLC
  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
  footnotes:
  - marker: a
    text: Or, 'wickedness overthrows the sinner.' The Hebrew חַטָּאת can be understood here as referring to a sinful person rather than sin in the abstract.
    reason: alternative_reading
translation:
  language: ko
  text: 의로움은 길이 온전한 사람을 지키지만, 악은 죄를 뒤엎습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악은 죄인을 무너뜨립니다.’ 히브리어 חַטָּאת은 여기서 추상적인 ‘죄’가 아니라 죄인을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  english_pob_choice: Righteousness
  chosen_korean: 의로움
  alternatives_korean:
  - 의
  - 정의
  lexicon: HALOT
  rationale: 지혜문학의 개인 윤리 맥락에서 보호하는 성격의 צְדָקָה를 한국어로는 ‘의로움’이 가장 자연스럽게 드러냅니다.
- source_word: תִּצֹּר
  english_pob_choice: guards
  chosen_korean: 지킵니다
  alternatives_korean:
  - 보호합니다
  - 간직합니다
  - 지켜 줍니다
  lexicon: HALOT
  rationale: נצר의 기본 뜻인 ‘지키다/보호하다’를 살리면서도 한국어에서 간결하고 구어적이지 않은 동사로 옮겼습니다.
- source_word: תָּם דָּרֶךְ
  english_pob_choice: the blameless in the way
  chosen_korean: 길에서 흠없음
  alternatives_korean:
  - 길에서 온전함
  - 길에서 완전한 사람
  - 자기 길에서 흠없는 사람
  lexicon: HALOT
  rationale: תָּם과 דָּרֶךְ의 압축된 표현을 한국어로는 ‘길에서 흠없음’으로 살려, 행위의 길/삶의 경로라는 은유를 유지했습니다.
- source_word: חַטָּאת
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄인
  - 죄악
  lexicon: HALOT
  rationale: 마지막 명사는 본문이 허용하는 대로 추상명사 ‘죄’로 두어, POB가 보존하려는 해석적 긴장을 한국어에서도 유지했습니다.
theological_decisions:
- issue: חַטָּאת의 의미를 ‘죄인’으로 풀지 여부
  chosen_reading: 본문에는 ‘죄’를 유지하고, 사람을 직접 지칭하지 않습니다.
  alternative_readings:
  - ‘죄인’을 뜻하는 것으로 이해할 수 있습니다
  - ‘죄를 짓는 사람’으로 의역할 수 있습니다
  rationale: 히브리어는 간결하고 애매하므로, 해석을 완결하지 않고 본문 차원의 긴장을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
