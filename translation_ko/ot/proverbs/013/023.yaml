base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
  footnotes:
  - marker: a
    text: Or 'There is that which is swept away without justice.' The Hebrew second colon is compact and can be rendered more impersonally.
    reason: alternative_reading
  - marker: b
    text: '''Fallow ground'' may also be rendered ''tilled field'' or ''freshly plowed land.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이들의 갈아 일군 밭[b]에서는 먹을 것이 풍성히 나지만, 공의가 없어 망하는 이도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공의 없이 없어지는 것이 있습니다.’ 히브리어 둘째 행은 주어를 명시하지 않아 비인칭적으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘갈아 일군 밭’은 ‘묵은 밭’, ‘휴경지’, 또는 ‘새로 갈아엎은 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אֹכֶל
  english_pob_choice: abundant food
  chosen_korean: 풍성한 먹을거리
