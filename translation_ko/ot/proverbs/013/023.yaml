  lexicon: HALOT
  rationale: כֹּל/אֹכֶל 계열은 단순한 ‘음식’보다 농경 문맥에서 수확물까지 포괄하므로, ‘풍성한 먹을거리’로 자연스럽게 풀어 원문의 풍요성을 살렸습니다.
