  source_fidelity: 첫째 행의 נִיר는 ‘밭고랑’이 아니라 갈아엎거나 경작한 땅을 뜻하므로, ‘밭고랑’은 지시 대상이 너무 좁아 수정이 필요합니다. 둘째 행은 공의의 부재 때문에 누군가가 ‘쓸려 없어짐/망함’을 말하며, ‘떠밀려 가다’는 한국어에서 강제 이주 등의 뜻으로 치우쳐 원문의 파멸 의미를 충분히 전달하지 못합니다.
  naturalness: ‘가난한 이들의 갈아 일군 밭에서는 먹을 것이 풍성히 납니다’는 현대 표준 한국어에서 자연스럽고 농경 비유를 분명히 드러냅니다. ‘공의가 없어 망하는 이’는 합쇼체 문맥에 맞으며 간결합니다.
  terminology: מִשְׁפָּט는 이 문맥에서 ‘공의’로 옮길 수 있습니다. רָאשִׁים는 ‘가난한 이들’로 자연스럽게 처리했습니다. נִיר의 어휘적 폭은 각주에서 ‘묵은 밭/새로 갈아엎은 땅’의 가능성으로 보완합니다.
