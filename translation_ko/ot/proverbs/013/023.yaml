  lexicon: HALOT
  rationale: 이 형용사형 명사는 여기서 가난한 사람들을 가리키는 전통적 이해를 따르며, 한국어에서는 복수성을 드러내는 ‘가난한 자들’이 간결합니다.
- source_word: בְּלֹא מִשְׁפָּט
  english_pob_choice: for lack of justice
  chosen_korean: 공의 없이
  alternatives_korean:
  - 정의 없이
  - 공의가 없어
  - 재판 없이
  lexicon: HALOT
  rationale: מִשְׁפָּט는 단순한 법절차보다 공의/정의의 부재를 가리킬 수 있으므로, 사회윤리적 뉘앙스를 살려 ‘공의 없이’로 옮겼습니다.
theological_decisions:
- issue: 둘째 행의 מִשְׁפָּט 의미
  chosen_reading: 이 구절은 단순한 관리 실패보다, 공의가 결여된 상태에서 사람이 밀려나는 현실을 말합니다.
  alternative_readings:
  - 비효율이나 부주의로 인한 손실을 말한다.
  - 법정 절차의 부재만을 뜻한다.
  rationale: 지혜문학에서 מִשְׁפָּט는 자주 공의·정의의 질서를 뜻하므로, 본문이 지적하는 사회적·윤리적 긴장을 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 지혜문학의 משפט 용례; 번역 원칙 §1, §3
