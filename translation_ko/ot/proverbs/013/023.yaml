  rationale: ‘밭고랑’을 נִיר의 의미 범위에 맞는 ‘갈아 일군 밭’으로 고치고, 파멸을 뜻하는 נִסְפֶּה를 자연스러운 한국어인 ‘망하는’으로 옮겼습니다. 둘째 행의 주어가 문법적으로 명시되지 않는 점은 본문에서 ‘이’로 무리 없이 표현하되, 비인칭적 대안을 각주에 보존했습니다. 공의/정의에 관한 해석적 확장은 피했습니다.
