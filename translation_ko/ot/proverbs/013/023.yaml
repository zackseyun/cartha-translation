  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
  footnotes:
  - marker: a
    text: Or 'There is that which is swept away without justice.' The Hebrew second colon is compact and can be rendered more impersonally.
    reason: alternative_reading
  - marker: b
    text: '''Fallow ground'' may also be rendered ''tilled field'' or ''freshly plowed land.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 자들의 밭고랑에는 풍성한 먹을거리가 있으나, 공의 없이 떠밀려 가는 이도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밭고랑’은 여기서 경작 가능한 땅, 곧 휴경지나 새로 갈아엎은 땅의 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘풍성한 먹을거리’는 원문의 ‘많은/풍성한 음식’을 자연스러운 한국어로 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אֹכֶל
  english_pob_choice: abundant food
  chosen_korean: 풍성한 먹을거리
  alternatives_korean:
  - 많은 음식
  - 넉넉한 먹을 것
  lexicon: HALOT
  rationale: כֹּל/אֹכֶל 계열은 단순한 ‘음식’보다 농경 문맥에서 수확물까지 포괄하므로, ‘풍성한 먹을거리’로 자연스럽게 풀어 원문의 풍요성을 살렸습니다.
- source_word: נִיר
  english_pob_choice: fallow ground
  chosen_korean: 밭고랑
  alternatives_korean:
  - 묵은 밭
  - 갈아엎은 땅
  - 휴경지
  lexicon: HALOT
  rationale: 문맥상 경작 가능한 땅의 생산성을 가리키므로, 한국어에서 농경 이미지를 살리면서도 문장 흐름이 자연스러운 ‘밭고랑’을 택했습니다.
- source_word: רָאשִׁים
  english_pob_choice: the poor
  chosen_korean: 가난한 자들
  alternatives_korean:
  - 가난한 사람들
  - 빈곤한 이들
  - 가난한 자
  lexicon: HALOT
  rationale: 이 형용사형 명사는 여기서 가난한 사람들을 가리키는 전통적 이해를 따르며, 한국어에서는 복수성을 드러내는 ‘가난한 자들’이 간결합니다.
- source_word: בְּלֹא מִשְׁפָּט
  english_pob_choice: for lack of justice
  chosen_korean: 공의 없이
  alternatives_korean:
  - 정의 없이
  - 공의가 없어
  - 재판 없이
  lexicon: HALOT
  rationale: מִשְׁפָּט는 단순한 법절차보다 공의/정의의 부재를 가리킬 수 있으므로, 사회윤리적 뉘앙스를 살려 ‘공의 없이’로 옮겼습니다.
theological_decisions:
- issue: 둘째 행의 מִשְׁפָּט 의미
  chosen_reading: 이 구절은 단순한 관리 실패보다, 공의가 결여된 상태에서 사람이 밀려나는 현실을 말합니다.
  alternative_readings:
  - 비효율이나 부주의로 인한 손실을 말한다.
  - 법정 절차의 부재만을 뜻한다.
  rationale: 지혜문학에서 מִשְׁפָּט는 자주 공의·정의의 질서를 뜻하므로, 본문이 지적하는 사회적·윤리적 긴장을 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 지혜문학의 משפט 용례; 번역 원칙 §1, §3
