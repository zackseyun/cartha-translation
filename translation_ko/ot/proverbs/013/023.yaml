  - 휴경지
  lexicon: HALOT
  rationale: 문맥상 경작 가능한 땅의 생산성을 가리키므로, 한국어에서 농경 이미지를 살리면서도 문장 흐름이 자연스러운 ‘밭고랑’을 택했습니다.
- source_word: רָאשִׁים
  english_pob_choice: the poor
  chosen_korean: 가난한 자들
  alternatives_korean:
