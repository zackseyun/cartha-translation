id: PRO.13.7
reference: Proverbs 13:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
  footnotes:
  - marker: a
    text: Or 'There is one who makes himself rich, yet has nothing; another makes himself poor, yet has great wealth.' The Hebrew reflexive verbs can describe either self-presentation or actual self-enrichment/self-impoverishment; the main text favors the appearance sense because of the proverb's sharp irony.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자가 된 체하는 사람이 있으나 아무것도 없고, 가난한 체하는 사람이 있으나 큰 재물이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘부자인 체하다/가난한 체하다’의 표면적 의미와 ‘스스로 부유하게 만들다/가난하게 만들다’의 실제 변화 의미를 모두 가질 수 있습니다. 본문은 속담의 반어를 살려 겉모습의 뜻을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: …하는 사람이 있으나
  alternatives_korean:
  - …하는 자가 있으나
  - …하는 이가 있으나
  lexicon: BHS/WLC; POB audit trail
  rationale: 히브리어 존재 표현을 한국어에서는 속담형 서술로 자연스럽게 풀어, 일반적 관찰의 문장감을 살렸습니다.
- source_word: מִתְעַשֵּׁר
  english_pob_choice: pretends to be rich
  chosen_korean: 부자가 된 체하는
  alternatives_korean:
  - 부자인 체하는
  - 스스로 부자가 되게 하는
  lexicon: HALOT; POB audit trail
  rationale: 반복된 상반 구조와 ‘아무것도 없고’의 대비를 살리기 위해, 실제 소유보다 겉모습/자기표현의 뉘앙스를 드러내는 ‘-된 체하다’를 택했습니다.
- source_word: וְאֵין כֹּל
  english_pob_choice: yet has nothing
  chosen_korean: 아무것도 없고
  alternatives_korean:
  - 전혀 아무것도 없고
  - 아무것도 없는 반면
  lexicon: HALOT; POB audit trail
  rationale: כֹּל이 수반하는 전면적 결핍을 간결하게 반영해, 빈곤의 절대성을 자연스러운 현대 한국어로 표현했습니다.
- source_word: מִתְרוֹשֵׁשׁ
  english_pob_choice: pretends to be poor
  chosen_korean: 가난한 체하는
  alternatives_korean:
  - 가난한 척하는
  - 스스로 가난하게 만드는
  lexicon: HALOT; POB audit trail
  rationale: 앞 구와 대구를 이루는 반사적/표면적 의미를 살려, 두 번째 분절도 동일한 ‘체하다’ 표현으로 맞췄습니다.
- source_word: וְהוֹן רָב
  english_pob_choice: yet has great wealth
  chosen_korean: 큰 재물이 있습니다
  alternatives_korean:
  - 많은 재물이 있습니다
  - 풍성한 재산이 있습니다
  lexicon: HALOT; POB audit trail
  rationale: הוֹן을 물질적 부를 가리키는 ‘재물’로 옮기고, רָב의 ‘많음’을 ‘큰’으로 간결하게 처리해 대구의 균형을 유지했습니다.
theological_decisions:
- issue: 속담의 반어적 긴장과 실제 상태/겉모습의 병치
  chosen_reading: 겉으로 부자·가난한 체하는 모습과 실제 상태의 역전을 그대로 드러냈습니다.
  alternative_readings:
  - 실제로 부자가 되거나 가난해지는 의미로 완화하는 번역
  - 도덕적 교훈을 덧붙여 해설하는 번역
  rationale: 히브리어 히트파엘 동사의 양가성(자기표현 vs. 실제 변화)을 지우지 않고, 문맥의 날카로운 역설을 보존하기 위해서입니다.
  doctrine_reference: 잠언의 지혜문학적 통찰; 표면과 실재의 대비
