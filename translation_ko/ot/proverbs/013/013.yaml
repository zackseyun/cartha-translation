id: PRO.13.13
reference: Proverbs 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
  footnotes:
  - marker: a
    text: Or 'a matter.' Hebrew דָבָר can mean 'word,' 'matter,' or 'thing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will suffer for it' or 'brings ruin on himself.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will be rewarded.' The Hebrew more literally means 'will be repaid/recompensed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 한 말을 업신여기면 그것 때문에 망하고, 명령을 경외하는 사람은 보상받습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּז לְדָבָר
  english_pob_choice: despises a word
  chosen_korean: 한 말을 업신여기면
  alternatives_korean:
  - 말을 멸시하면
  - 한 말을 경멸하면
  - 말씀을 업신여기면
  lexicon: HALOT
  rationale: דָבָר는 ‘말/일/것’의 범위를 가지지만, 여기서는 교훈적 발화를 가리키는 뜻이 자연스러워 ‘한 말’로 옮겼습니다. בָּז의 경시·모욕 뉘앙스는 현대 한국어의 ‘업신여기다’가 잘 살립니다.
- source_word: יֵחָבֶל לוֹ
  english_pob_choice: will be ruined by it
  chosen_korean: 그것 때문에 망하고
  alternatives_korean:
  - 그것으로 인해 손해를 보고
  - 그것 때문에 파멸하고
  - 그 일로 인해 망하게 되고
  lexicon: HALOT
  rationale: נִפעל형 חבל은 ‘상함/파손됨/파멸함’의 결과를 나타내므로, 결과를 분명히 드러내는 ‘망하고’로 옮겼습니다. האנ화된 ‘it’는 한국어에서 원인 구문으로 풀어 ‘그것 때문에’로 반영했습니다.
- source_word: מִצְוָה
  english_pob_choice: the commandment
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 명령을
  - 법도
  lexicon: HALOT
  rationale: מִצְוָה는 보통 ‘계명’이지만, 지혜문맥에서는 특정 율법 조항보다 권위 있는 지시 자체를 가리킬 수 있어 문맥에 따라 ‘명령’이 자연스럽습니다. POB의 ‘the commandment’가 주는 단수적·권위적 대비를 살렸습니다.
- source_word: יְשֻׁלָּם
  english_pob_choice: will be rewarded / will be repaid
  chosen_korean: 보상받습니다
  alternatives_korean:
  - 갚음받습니다
  - 보답받습니다
  - 되갚음을 받습니다
  lexicon: HALOT
  rationale: שלם의 Pual은 ‘되갚음/보상/상응하는 대가를 받음’을 뜻하므로, 여기서는 긍정적 결과를 포함하는 넓은 표현인 ‘보상받습니다’를 택했습니다. 이는 문맥상 자연스러우면서도 ‘rewarded’와 ‘repaid’ 사이의 긴장을 유지합니다.
theological_decisions:
- issue: 지혜 격언의 일반화된 남성형 표현
  chosen_reading: 첫 절은 ‘누구든지’로 일반화하고, 둘째 절은 행위 주체를 ‘사람은’으로 풀어 대표적 남성형을 과도하게 드러내지 않았습니다.
  alternative_readings:
  - ‘그는’으로 직역해 남성형을 유지
  - 전 구절을 ‘누구든지... 누구든지...’로 평행화
  rationale: 히브리어는 일반적 남성 단수형을 사용하지만 한국어에서는 의미를 살리면서도 성별 표지를 불필요하게 강조하지 않는 것이 자연스럽습니다. 다만 원문의 일반화된 규범성은 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
