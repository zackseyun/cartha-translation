  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
  footnotes:
  - marker: a
    text: Or 'A desire that comes to pass is pleasant to the soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 충족된 욕망은 혼에게 달콤하지만, 악에서 떠나는 것은 어리석은 자들에게는 가증한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘충족된 욕망은 혼에게 기쁩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוָה נִהְיָה
  english_pob_choice: A desire fulfilled
  chosen_korean: 충족된 욕망
  alternatives_korean:
  - 이루어진 욕망
  - 성취된 소원
  - 채워진 바람
  lexicon: HALOT
  rationale: תַּאֲוָה와 נִהְיָה의 결합은 ‘이루어지다/충족되다’의 상태를 나타내므로, 간결하게 ‘충족된 욕망’으로 옮겨 결과 상태를 살렸습니다.
- source_word: לְנָפֶשׁ
  english_pob_choice: to the soul
  chosen_korean: 혼에게
  alternatives_korean:
  - 영혼에
  - 마음에
  - 사람에게
  lexicon: HALOT
  rationale: נפש은 육체적 생명보다 내면의 인격 전체를 가리키므로, 시편·지혜문맥에서 자연스러운 ‘혼’으로 옮겨 원문의 내적 감각을 보존했습니다.
- source_word: תֶּעֱרַב
  english_pob_choice: is sweet
  chosen_korean: 달콤하지만
  alternatives_korean:
  - 달콤합니다
  - 기분 좋지만
  - 즐겁지만
  lexicon: HALOT
  rationale: ערב의 감각적 비유를 살려 ‘달콤하다’로 옮겼고, 앞절과의 대조를 살리기 위해 연결형으로 처리했습니다.
- source_word: סוּר מֵרָע
  english_pob_choice: to turn away from evil
  chosen_korean: 악에서 떠나는 것
  alternatives_korean:
  - 악에서 돌아서는 것
  - 악을 피하는 것
  - 악에서 물러나는 것
  lexicon: HALOT
  rationale: סור는 단순한 이동이 아니라 악을 등지는 행위를 뜻하므로, 지혜문학의 도덕적 대조를 드러내는 ‘악에서 떠나는 것’으로 옮겼습니다.
theological_decisions:
- issue: וְתוֹעֲבַת כְּסִילִים의 강한 평가어
  chosen_reading: ‘가증한 것입니다’로 옮겨, 어리석은 자들이 악에서 떠나는 행위를 혐오하는 강도를 그대로 살렸습니다.
  alternative_readings:
  - ‘몹시 싫어하는 것입니다’
  - ‘역겨운 것입니다’
  rationale: תוֹעֵבָה는 단순한 호오가 아니라 강한 혐오·가증함을 뜻하므로, 도덕적 반감을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 도덕적 분별과 악에 대한 반응
- issue: כְּסִילִים의 인물 유형
  chosen_reading: ‘어리석은 자들’로 옮겨, 단순한 지적 부족이 아니라 도덕적으로 완고한 유형을 드러냈습니다.
  alternative_readings:
  - ‘우매한 자들’
  - ‘미련한 자들’
  rationale: 잠언의 כסיל은 지적 능력보다 하나님 앞에서의 완고함을 강조하므로, 현대 한국어에서 그 성격을 비교적 직접적으로 드러내는 ‘어리석은 자들’을 사용했습니다.
  doctrine_reference: 잠언의 지혜/어리석음 대비
