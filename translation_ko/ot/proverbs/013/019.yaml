translation:
  language: ko
  text: 이루어진 소원은 마음에 달콤합니다[a]. 그러나 악에서 떠나는 것은 어리석은 자들에게 가증합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이루어진 소원은 마음에 즐겁습니다.’
