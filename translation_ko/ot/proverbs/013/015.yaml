    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배신을 일삼는 자들의 길은 거칠다.’ 마지막 히브리어 단어는 문맥상 ‘험한, 거친’으로 이해될 수 있으나, ‘견고한’ 또는 ‘지속적인’이라는 뜻으로 이해될 가능성도 있습니다.
