source:
  edition: WLC
  text: צַדִּ֗יק אֹ֭כֵל לְ/שֹׂ֣בַע נַפְשׁ֑/וֹ וּ/בֶ֖טֶן רְשָׁעִ֣ים תֶּחְסָֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
  footnotes:
  - marker: a
    text: Or 'to satisfy his appetite.' The Hebrew word נֶפֶשׁ (nephesh) can mean 'soul,' 'life,' 'self,' or 'appetite' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인은 자기 영혼을 만족하게 먹습니다. 그러나 악인의 배는 부족합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 식욕을 만족하게’. 히브리어 נֶפֶשׁ(nephesh)는 문맥에 따라 ‘영혼’, ‘생명’, ‘자기’, ‘식욕’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 히브리어 단수 형용사가 명사처럼 쓰인 일반 진술이므로, 한국어에서는 성별을 드러내지 않는 표준 지혜문학 표현인 ‘의인’이 가장 간결하고 자연스럽습니다.
- source_word: לְשֹׂבַע
  english_pob_choice: to the satisfaction of
  chosen_korean: 만족하게
  alternatives_korean:
  - 충만하게
  - 배부르게
  - 충분히
  lexicon: HALOT
  rationale: ‘충분함/만족함’의 의미를 살리되 과잉의 뉘앙스를 피하려면, ‘만족하게’가 가장 idiomatic합니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 자기 영혼
  alternatives_korean:
  - 자기 목숨
  - 자기 자신
  - 자기 식욕
  lexicon: HALOT
  rationale: 먹는 맥락에서는 ‘식욕’도 가능하지만, 본문이 נֶפֶשׁ의 넓은 인간학적 의미를 유지하므로 ‘영혼’으로 옮기고 소유 대명사는 한국어 자연성을 위해 ‘자기’로 풀었습니다.
- source_word: בֶטֶן
  english_pob_choice: the belly
  chosen_korean: 배
  alternatives_korean:
  - 복부
  - 배속
  - 위
  lexicon: HALOT
  rationale: 의인/악인의 대비에서 גוף-욕구를 가리키는 비유로, 한국어에서는 직역의 어색함보다 관용적인 ‘배’가 본문의 대조를 잘 드러냅니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: ‘영혼’으로 옮기되, 먹는 맥락에서 문자적 신체 기관으로 축소하지 않습니다.
  alternative_readings:
  - ‘식욕’으로 한정
  - ‘자기 자신’으로 일반화
  rationale: 문맥상 만족의 대상이 육체적 허기만은 아니며, 히브리어 נֶפֶשׁ의 넓은 의미를 보존하는 것이 잠언의 인간 이해를 더 잘 반영합니다.
  doctrine_reference: 히브리어 נֶפֶשׁ의 다의성 보존
- issue: 의인/악인의 지혜문학적 일반화
  chosen_reading: 특정 개인이 아니라 의인과 악인의 전형적 상태를 말하는 잠언으로 읽습니다.
  alternative_readings:
  - 개별 사례 진술
  - 윤리적 권고문
  rationale: 동사의 현재형적 격언 용법이 보편적 진술을 형성하므로, 한국어도 단정적 잠언형 문장으로 유지해야 합니다.
  doctrine_reference: 지혜문학의 격언적 일반진술
