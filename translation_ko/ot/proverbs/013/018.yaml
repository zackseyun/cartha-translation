id: PRO.13.18
reference: Proverbs 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
  footnotes:
  - marker: a
    text: Or 'Poverty and shame are for one who neglects discipline.' The Hebrew participle can be rendered more formally as 'neglects' or 'casts off.'
    reason: lexical_alternative
  - marker: b
    text: '''Heeds'' is literally ''keeps'' or ''guards,'' meaning to pay careful attention to correction and retain it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난과 수치가 훈계를 버리는 사람에게 닥치지만, 책망을 지키는 사람은 존귀를 얻습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  english_pob_choice: Poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  lexicon: HALOT
  rationale: פּר/רֵישׁ는 결핍 상태를 가리키므로, 현대 한국어에서 자연스럽고 잠언의 결과 진술에 잘 맞는 ‘가난’을 선택했습니다.
- source_word: קָלוֹן
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 불명예
  - 모욕
  lexicon: HALOT
  rationale: 공적 수치와 불명예를 함께 담는 표현으로 ‘수치’가 잠언의 도덕적·사회적 뉘앙스를 간결하게 살립니다.
- source_word: פּוֹרֵעַ מוּסָר
  english_pob_choice: one who ignores discipline
  chosen_korean: 훈계를 버리는 사람
  alternatives_korean:
  - 훈계를 무시하는 사람
  - 훈련을 저버리는 사람
  - 교훈을 떠나는 사람
  lexicon: HALOT
  rationale: פּוֹרֵעַ는 단순한 무지보다 ‘제어를 풀어버리다/저버리다’에 가깝기 때문에, POB의 해석을 따라 ‘버리는’으로 옮겨 거부와 이탈의 뉘앙스를 살렸습니다.
- source_word: תּוֹכַחַת
  english_pob_choice: reproof
  chosen_korean: 책망
  alternatives_korean:
  - 훈계
  - 교정
  - 경고
  lexicon: HALOT
  rationale: מוּסָר와 구별되는 말로서 직접적인 꾸짖음·교정을 가리키므로, ‘책망’이 문체와 의미를 가장 잘 유지합니다.
- source_word: יְכֻבָּד
  english_pob_choice: will be honored
  chosen_korean: 존귀를 얻습니다
  alternatives_korean:
  - 존중을 받습니다
  - 영광을 얻습니다
  - 존경을 받습니다
  lexicon: HALOT
  rationale: 수동형의 결과를 자연스럽게 드러내면서도, 잠언답게 사회적 평가의 상승을 담기 위해 ‘존귀를 얻습니다’로 옮겼습니다.
