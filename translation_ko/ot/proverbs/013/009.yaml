  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
  footnotes:
  - marker: a
    text: Or 'is glad.' The Hebrew verb normally means 'rejoices' or 'is glad'; some understand it here in a contextual sense like 'shines brightly' because the subject is 'light.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 빛은 기뻐하며, 악인의 등불은 꺼집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하며’는 히브리어 동사의 기본 뜻을 따른 것입니다. 일부 해석은 여기서 ‘환하게 빛나다’라는 문맥적 의미로 이해하기도 하지만, 동사 자체의 기본 뜻은 ‘기뻐하다, 즐거워하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 조명
  lexicon: HALOT
  rationale: אוֹר의 가장 자연스러운 현대 한국어 대응은 ‘빛’이며, 의인과 악인의 대비를 간결하게 살립니다.
- source_word: יִשְׂמָח
  english_pob_choice: rejoices
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 기뻐합니다
  - 즐거워하며
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘기뻐하다’를 살리되, 의인화된 ‘빛’에 어울리도록 현재형 서술로 옮겼습니다.
- source_word: נֵר
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 램프
  - 등
  lexicon: HALOT
  rationale: נֵר는 기름등을 가리키는 경우가 많아 ‘등불’이 시적 대비와 의미를 함께 살리는 한국어 표현입니다.
- source_word: יִדְעָךְ
  english_pob_choice: goes out
  chosen_korean: 꺼집니다
  alternatives_korean:
  - 꺼져 버립니다
  - 소멸합니다
  lexicon: HALOT
  rationale: 등불에 대한 동사로는 ‘꺼지다’가 가장 자연스럽고, 전멸보다 이미지에 충실합니다.
theological_decisions:
- issue: 지혜문학의 대조 구조를 어떻게 한국어에서 살릴 것인가
  chosen_reading: 첫 번째 행은 의인의 긍정적 ‘빛’, 두 번째 행은 악인의 ‘등불’이 꺼지는 대비로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의인의 삶은 밝아지고 악인의 등불은 꺼집니다
  - 의인은 빛나고 악인은 꺼집니다
  rationale: 본문은 인과설명보다 시적 대비가 핵심이므로, 행간의 평행성과 이미지 차이를 보존하는 쪽이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 잠언의 도덕적 대조와 지혜시의 평행법
- issue: יִשְׂמָח의 의인화 여부
  chosen_reading: ‘빛은 기뻐하며’로 의인화를 유지했습니다.
  alternative_readings:
  - ‘빛은 밝게 비치며’로 의미를 풀어 옮김
  - ‘빛은 환하게 빛나며’로 의역
  rationale: 영어 POB도 ‘rejoices’로 동사의 기본 의미를 유지하므로, 원문의 수사적 의인화를 보존하는 것이 더 소스-직접적입니다.
  doctrine_reference: 히브리 시가의 수사적 의인화
