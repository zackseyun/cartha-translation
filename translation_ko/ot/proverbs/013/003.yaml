  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
  footnotes:
  - marker: a
    text: Or 'brings destruction on himself' / 'is ruin to him.' The Hebrew phrase is compact and allows several close English renderings.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his life' (nephesh); elsewhere the term can also mean 'soul' or 'self,' but here it most naturally refers to one's life.
    reason: lexical_alternative
