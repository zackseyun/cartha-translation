    text: 히브리어 '자기 생명'(네페시); 다른 곳에서는 '영혼' 또는 '자신'을 뜻할 수도 있으나, 여기서는 가장 자연스럽게 '자기 생명'을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '자신에게 파멸을 가져옵니다' 또는 '그에게 파멸이 됩니다'. 히브리어 구는 간결하여 여러 가까운 한국어 번역이 가능합니다.
    reason: lexical_alternative
