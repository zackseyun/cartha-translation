lexical_decisions:
- source_word: תּוֹחֶלֶת
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  - 기대
  lexicon: HALOT
  rationale: 지혜문맥에서 תּוֹחֶלֶת은 단순한 기대보다 바라는 바를 향한 소망에 가깝습니다. '소망'은 현대 한국어에서 자연스럽고, 뒤의 '이루어진 소원'과도 균형을 이룹니다.
- source_word: מְ֭מֻשָּׁכָה
