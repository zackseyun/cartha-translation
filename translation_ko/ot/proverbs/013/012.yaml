  - 길게 끌어진
  lexicon: HALOT
  rationale: שורש משך의 '끌어지다/길어지다'는 뜻을 살리되, 한국어에서는 '미뤄진'이 소망의 성취가 늦어졌다는 경험적 의미를 가장 자연스럽게 전달합니다.
- source_word: מַחֲלָה לֵב
  english_pob_choice: makes the heart sick
  chosen_korean: 마음을 병들게 하지만
  alternatives_korean:
  - 마음의 병입니다
  - 마음의 병이 되지만
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '마음의 병'이라는 명사구이지만, 한국어에서는 동사화해 '병들게 하다'로 옮겨 비유의 힘을 살렸습니다.
- source_word: תַּאֲוָה בָאָה
  english_pob_choice: a desire fulfilled
  chosen_korean: 이루어진 소원
  alternatives_korean:
  - 온 소망
  - 들어온 소원
  lexicon: HALOT
  rationale: בָאָה의 '왔다/이르렀다'는 의미를 한국어의 '이루어지다'로 풀어, 바라는 것이 실제로 성취되었다는 뜻을 분명하게 했습니다.
- source_word: עֵץ חַיִּים
  english_pob_choice: tree of life
  chosen_korean: 생명나무
  alternatives_korean:
  - 생명의 나무
  - 생명수 나무
  lexicon: HALOT
  rationale: 성경적 고정 표현이므로 '생명나무'로 유지했습니다. 한국어 독자가 창세기와 지혜문학의 상징성을 바로 인식할 수 있습니다.
theological_decisions:
- issue: 첫 절반과 둘째 절반의 대조 관계
  chosen_reading: '''하지만''으로 대조를 드러내어, 미뤄진 소망의 해로움과 이루어진 소원의 생명성을 선명하게 대비시켰습니다.'
  alternative_readings:
  - '''그리고''로 단순 연결'
  - 쉼표만으로 병렬 처리
  rationale: 히브리어의 ו는 형식상 '그리고'이지만, 잠언의 평행법에서는 실제 의미가 대조이므로 한국어에서 '하지만'이 본문의 지혜적 대비를 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; Hebrew wisdom parallelism'
