source:
  edition: WLC
  text: ה֭וֹן מֵ/הֶ֣בֶל יִמְעָ֑ט וְ/קֹבֵ֖ץ עַל יָ֣ד יַרְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
  footnotes:
  - marker: a
    text: Or 'Wealth from vanity dwindles'; Hebrew 'from vapor/emptiness,' suggesting gain that is fleeting, insubstantial, or ill-founded.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by hand'; the idiom likely means gathering gradually or in small amounts.
    reason: lexical_alternative
translation:
  language: ko
  text: 헛된 데서 얻은 재산은 줄어들고, 조금씩 모으는 사람은 그것을 늘립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손으로’입니다. 이 관용은 보통 ‘조금씩, 작은 단위로’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֶבֶל은 문자적으로 ‘숨결, 증기’이며, 여기서는 덧없고 실속 없는 재물의 출처를 가리키는 것으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재산
  alternatives_korean:
  - 부
  - 재물
  - 자산
  lexicon: HALOT
  rationale: הוֹן은 물질적 소유와 재화를 가리키므로, 현대 한국어에서는 문맥상 자연스럽고 포괄적인 ‘재산’이 적절합니다.
- source_word: מֵהֶבֶל
  english_pob_choice: from vanity
  chosen_korean: 헛된 데서
  alternatives_korean:
  - 허무에서
  - 헛됨에서
  - 덧없음에서
  lexicon: HALOT
  rationale: הֶבֶל의 핵심 이미지는 ‘숨결/증기’에서 온 ‘덧없음, 헛됨’이므로, 경제적 문맥에서 출처와 성격이 불분명하고 실속 없는 획득을 드러내는 ‘헛된 데서’로 옮겼습니다.
- source_word: עַל יָד
  english_pob_choice: little by little
  chosen_korean: 조금씩
  alternatives_korean:
  - 손으로
  - 손에서 손으로
  - 차츰차츰
  lexicon: HALOT
  rationale: 직역하면 ‘손으로/by hand’이지만, 잠언의 대조 구조상 점진적 축적을 뜻하는 관용으로 이해되므로 ‘조금씩’이 가장 자연스럽습니다.
