base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
  footnotes:
  - marker: a
    text: Or 'A righteous man hates falsehood.' The Hebrew is literally 'a word of falsehood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'becomes odious and is put to shame.' The final two verbs may be understood as describing the wicked man as shameful or as coming to shame.
    reason: lexical_alternative
translation:
  language: ko
  text: 의로운 사람은 거짓된 말[a]을 미워하지만, 악한 사람은 악취를 풍기며 수치를 당합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓’입니다. 히브리어는 문자적으로 ‘거짓의 말’입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 두 동사는 악한 사람이 ‘혐오스럽게 되고 수치를 당한다’는 뜻으로도, ‘혐오를 일으키고 수치를 초래한다’는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  english_pob_choice: a lying word
  chosen_korean: 거짓된 말
  alternatives_korean:
  - 거짓말
  - 거짓의 말
  - 거짓된 한 마디
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘거짓의 말/말씀’에 가까우므로, 한국어에서는 구체성을 살리면서도 자연스러운 ‘거짓된 말’로 옮겼습니다.
- source_word: יִשְׂנָא
  english_pob_choice: hates
  chosen_korean: 미워합니다
  alternatives_korean:
  - 싫어합니다
  - 증오합니다
  lexicon: HALOT
  rationale: 지혜문학에서의 도덕적 혐오를 직접적으로 드러내는 평이한 동사로, 과도하게 강하거나 낯선 표현보다 적절합니다.
- source_word: יַּבְאִישׁ
  english_pob_choice: and brings shame
  chosen_korean: 악취를 풍기며
  alternatives_korean:
  - 악취를 내며
  - 썩은 냄새를 풍기며
  - 역겨움을 자아내며
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘악취가 나다/나게 하다’이므로, 비유적 도덕적 혐오를 살려 ‘악취를 풍기며’로 옮겼습니다.
- source_word: וְיַחְפִּיר
  english_pob_choice: and brings shame
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 부끄러움을 당합니다
  - 망신을 당합니다
  - 수치를 끼칩니다
  lexicon: HALOT
  rationale: 어근은 ‘부끄러워하다’와 ‘수치를 입히다’ 둘 다 가능하므로, 병렬의 종결부에서는 수동적 결과를 드러내는 ‘수치를 당합니다’가 가장 무난합니다.
theological_decisions:
- issue: 악인 절의 두 동사 처리
  chosen_reading: 두 동사를 악인의 도덕적 상태와 그 결과로 읽어, ‘악취를 풍기며 수치를 당합니다’로 표현했습니다.
  alternative_readings:
  - ‘악한 사람은 악취를 풍기고 수치를 끼칩니다’처럼 능동 원인으로 읽을 수 있음
  - ‘악한 사람은 역겨워지고 수치를 당합니다’처럼 상태 변화로 읽을 수 있음
  rationale: 히브리어는 악인의 인물상과 그가 맞이하는 수치를 함께 암시할 수 있으므로, 의미의 긴장을 지우지 않으면서도 한국어 문장으로는 자연스럽게 병치했습니다.
  doctrine_reference: 잠언의 지혜적 병행법과 اخلاق적 묘사
