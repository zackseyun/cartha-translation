id: PRO.2.22
reference: Proverbs 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
  footnotes:
  - marker: a
    text: Or 'from the earth.' The Hebrew אֶרֶץ can mean 'land' or 'earth'; here 'land' fits the contrast with the upright remaining in it in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be uprooted from it.' The Hebrew verb conveys forcible removal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악한 자들은 땅에서[a] 끊어지고, 배신하는 자들은 그 땅에서 뽑혀 나갈 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지구에서’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘지구’를 뜻할 수 있습니다. 여기서는 앞절에서 의로운 이들이 그곳에 머무는 것과 대조되므로 ‘땅’이 더 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘끌려 나갈 것입니다’. 히브리어 동사는 강제로 떼어 내거나 뽑아 내는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악인들
  - 사악한 자들
  lexicon: WLC
  rationale: 복수 서술명사로서의 집단을 자연스러운 현대 한국어로 옮기기 위해 ‘악한 자들’을 택했습니다. ‘악인들’도 가능하지만, 본문 대조를 살리면서 덜 경직된 표현입니다.
- source_word: מֵאֶרֶץ
  english_pob_choice: from the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 세상에서
  - 땅에서부터
  lexicon: HALOT
  rationale: 문맥상 의인의 ‘남아 있음’과 대조되는 거주지/터전의 의미가 두드러지므로 ‘땅’이 가장 적절합니다. 한국어에서는 관계사격 조사와 함께 ‘땅에서’가 가장 자연스럽습니다.
- source_word: יִכָּרֵתוּ
  english_pob_choice: will be cut off
  chosen_korean: 끊어지고
  alternatives_korean:
  - 끊어질 것입니다
  - 잘려 나갈 것입니다
  - 제거될 것입니다
  lexicon: HALOT
  rationale: ‘끊어지다’는 히브리어의 제거·절단 이미지를 살리면서 심판적 단절의 뜻을 간결하게 전달합니다. 문장 흐름상 뒤의 병렬 동사와 맞추어 연결형으로 처리했습니다.
- source_word: בוֹגְדִים
  english_pob_choice: the treacherous
  chosen_korean: 배신하는 자들
  alternatives_korean:
  - 간사한 자들
  - 배반자들
  - 속이는 자들
  lexicon: HALOT
  rationale: בגד는 언약적/관계적 배신의 뉘앙스를 지니므로 단순한 ‘속임’보다 ‘배신’이 더 정확합니다. ‘배신하는 자들’은 분사적 성격과 지속적 습성을 잘 드러냅니다.
- source_word: יִסְּחוּ
  english_pob_choice: will be torn away
  chosen_korean: 뿌리째 뽑힐 것입니다
  alternatives_korean:
  - 끌려가 버릴 것입니다
  - 뽑혀 나갈 것입니다
  - 떼어 내실 것입니다
  lexicon: HALOT
  rationale: 원어는 강제로 떼어 내거나 뽑아 내는 동작을 가리키며, 앞의 ‘땅’ 이미지와 함께 강한 축출을 표현합니다. POB의 심판적 강도를 살리되 한국어 성경문체에 맞게 ‘뿌리째 뽑히다’로 옮겼습니다.
- source_word: מִמֶּנָּה
  english_pob_choice: from it
  chosen_korean: 그곳에서
  alternatives_korean:
  - 그 땅에서
  - 그것에서
  - 거기서
  lexicon: HALOT
  rationale: 여성 단수 대명사는 앞의 ‘땅’을 가리키며, 한국어에서는 인칭 대명사보다 장소 부사 ‘그곳에서’가 더 자연스럽습니다. 반복을 피하면서 지시 대상도 분명히 합니다.
theological_decisions:
- issue: ‘땅’(אֶרֶץ)의 범위
  chosen_reading: 이 절은 보편적 ‘지구’보다 언약적·지혜문학적 ‘땅/터전’의 의미를 우선해 읽습니다.
  alternative_readings:
  - 세상
  - 땅(및 확장적으로 지구)
  rationale: 앞선 절과 이어지는 대조가 의인은 그 땅에 머물고 악인은 거기서 제거된다는 구조이므로, 문맥상 ‘땅’이 가장 충실합니다. 보편화된 종말론적 확장은 본문이 직접 요구하지 않습니다.
  doctrine_reference: Translation philosophy §1, §3
