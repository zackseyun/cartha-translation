lexical_decisions:
- source_word: עִקְּשִׁים
  english_pob_choice: crooked
  chosen_korean: 비뚤어져 있고
  alternatives_korean:
  - 굽어 있고
  - 구부러져 있고
  - 삐뚤어져 있고
  lexicon: HALOT
  rationale: 길의 형상을 살리면서도 도덕적 일그러짐을 함께 드러내는 표현으로, 영어 POB의 ‘crooked’와 같은 비유적 의미를 자연스럽게 옮겼습니다.
- source_word: וּנְלוֹזִים
  english_pob_choice: devious
  chosen_korean: 간교합니다
  alternatives_korean:
  - 치우쳐 있습니다
  - 빗나가 있습니다
  - 궤변적입니다
  lexicon: HALOT
  rationale: 단순한 방향 이탈보다 의도적인 왜곡과 불의한 꾀를 띤 뉘앙스를 반영하기 위해 ‘간교합니다’를 선택했습니다.
- source_word: אָרְחֹתֵיהֶם / בְּמַעְגְּלוֹתָם
  english_pob_choice: paths / in their ways
  chosen_korean: 길 / 자기들의 길
  alternatives_korean:
  - 길 / 그들의 길
  - 행로 / 자기들의 행로
  - 발자취 / 자기들의 발자취
  lexicon: HALOT
  rationale: 둘 다 삶의 행로를 가리키는 비유이므로 ‘길’을 일관되게 쓰되, 두 번째 절은 소유 대명사를 살려 앞 절과 병렬을 유지했습니다.
theological_decisions:
- issue: 시편·잠언의 지혜문학적 도덕 평가 어휘
  chosen_reading: 형상어를 유지하되, 단순한 물리적 굽음이 아니라 삶의 도덕적 왜곡을 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - 중립적인 ‘우회합니다’ 식의 표현
  - 완곡한 ‘치우쳐 있습니다’
  rationale: 문맥은 행동의 방향성만이 아니라 인격과 삶의 성향에 대한 평가를 포함하므로, 영어 POB의 도덕적 강도를 약화하지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 잠언 2:15의 지혜-어리석음 대비
