review_pass:
  verdict: revise
  source_fidelity: 히브리어는 앞 절의 복수 인물을 받는 관계절로서, ‘그들의 길이 비뚤어져 있으며 그들이 자기 행로에서 벗어나 있는’ 모습을 말합니다. 초안의 ‘간교합니다’는 도덕적 부정성을 전달하지만 נְלוֹזִים의 기본 이미지인 ‘옆으로 벗어남/굽음’과 בְּמַעְגְּלוֹתָם의 행로 비유를 충분히 반영하지 못합니다.
  naturalness: ‘자기들의 길에서 간교합니다’는 현대 한국어에서 다소 부자연스럽고, ‘길에서’가 ‘간교하다’를 수식하는 관계도 불명확합니다. ‘그 행로에서 빗나가 있습니다’는 합쇼체를 유지하면서 원문의 비유와 통사 관계를 자연스럽게 드러냅니다.
  terminology: אָ רְחֹתֵיהֶם은 ‘길’, מַעְגְּלוֹתָם은 반복을 줄이면서도 시적 병행을 살리는 ‘행로’로 옮겼습니다. עִקְּשִׁים은 ‘비뚤어져’, נְלוֹזִים은 방향·도덕 양면의 일탈을 보존하는 ‘빗나가 있습니다’로 번역했습니다.
  issues:
  - severity: medium
    issue: ‘간교합니다’가 נְלוֹזִים의 핵심 비유를 약화합니다.
    rationale: 이 어휘는 간계 자체보다 ‘비껴 감, 굽어짐, 일탈’의 뜻을 중심으로 하며, 뒤따르는 ‘그들의 행로에서’와 함께 길의 비유를 구성합니다.
  - severity: medium
    issue: ‘자기들의 길에서 간교합니다’의 결합이 부자연스럽습니다.
    rationale: 한국어에서 ‘간교하다’는 ‘길에서’와 자연스럽게 연결되지 않으며, 원문의 행로 이미지도 흐려집니다.
  revised_text: 그들의 길은 비뚤어져 있고, 그들은 그 행로에서 빗나가 있습니다.[a]
