  source_fidelity: 히브리어는 앞절에서 말한 부류를 가리키는 분사로, ‘바름/정직함의 길들’을 떠나 ‘어둠의 길들 안에서’ 걷는다는 대조를 이룹니다. 초안은 이 기본 의미와 비유를 대체로 보존했으나, ‘곧은 길의 길들’은 אָרְחוֹת יֹשֶׁר를 중복적으로 처리하여 원문의 자연스러운 명사구를 흐립니다.
  naturalness: ‘곧은 길의 길들’은 현대 표준 한국어에서 부자연스럽고 의미상 중복됩니다. ‘바른 길들을 버리고 어둠의 길을 걷는’이 자연스러우면서도 지혜문학의 길 비유와 대조를 유지합니다. 한국어에서는 일반적·비유적 경로를 단수 ‘길’로 표현하는 것이 자연스럽습니다.
  terminology: יֹשֶׁר는 여기서 도덕적 바름을 가리키므로 ‘바른’이 자연스럽고 충실합니다. חֹשֶׁךְ는 해설적으로 ‘악’으로 바꾸지 않고 ‘어둠’으로 유지해야 합니다. ‘걷는’은 הלך의 행위·삶의 방식 비유를 적절히 보존합니다.
