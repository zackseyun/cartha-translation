lexical_decisions:
- source_word: הָעֹזְבִים
  english_pob_choice: who abandon
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 버려 두고
  lexicon: HALOT
  rationale: 분사형이 앞선 문맥에서 규정하는 사람들을 가리키므로, 현대 한국어에서는 서술적으로 ‘버리고’로 옮겨 의도적인 포기감을 살렸습니다.
- source_word: אָרְחוֹת יֹשֶׁר
  english_pob_choice: the paths of uprightness
  chosen_korean: 곧은 길의 길들
  alternatives_korean:
  - 의로운 길들
  - 올바름의 길들
  lexicon: HALOT
  rationale: 지혜문학의 길 비유를 유지하면서 יֹשֶׁר의 직선성·도덕적 바름을 함께 살리기 위해 ‘곧은 길’로 옮겼습니다.
- source_word: לָלֶכֶת
  english_pob_choice: to walk
  chosen_korean: 걸어가는
  alternatives_korean:
  - 가는
  - 행하는
  lexicon: HALOT
  rationale: הלך의 삶의 방식 비유를 한국어에서도 자연스럽게 드러내기 위해 ‘걸어가는’으로 처리했습니다.
- source_word: בְּדַרְכֵי חֹשֶׁךְ
  english_pob_choice: in the ways of darkness
  chosen_korean: 어둠의 길들로
  alternatives_korean:
  - 어둠의 방식으로
  - 어둠의 길로
  lexicon: HALOT
  rationale: ‘길’의 평행을 살리되, 어둠을 단순한 상태가 아니라 삶의 방향성으로 읽히게 하기 위해 ‘어둠의 길들’로 옮겼습니다.
theological_decisions:
- issue: 어둠의 도덕적 함의
  chosen_reading: 본문에는 ‘어둠’을 그대로 두고, ‘악/악행’으로 풀지 않았습니다.
  alternative_readings:
  - 악의 길
  - 악한 길
  rationale: 히브리어의 이미지가 가진 도덕적 함의를 설명으로 풀어버리기보다, 독자가 대비 구조를 직접 읽게 하는 것이 본문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, 의미를 과잉 해석하지 않고 비유적 긴장을 보존함.
