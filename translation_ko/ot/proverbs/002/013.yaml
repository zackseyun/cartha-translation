  - 악한 길
  rationale: 히브리어의 이미지가 가진 도덕적 함의를 설명으로 풀어버리기보다, 독자가 대비 구조를 직접 읽게 하는 것이 본문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, 의미를 과잉 해석하지 않고 비유적 긴장을 보존함.
