  - marker: b
    text: Or 'whose words are flattering.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the forbidden woman, from the foreign woman'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 당신을 음녀에게서, 말이 매끄러운 외국 여자에게서 구해 내기 위함입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음녀’는 잠언에서 흔히 언약적·혼인적 경계를 벗어난 여인을 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘매끄러운’은 ‘아첨하는’의 직역적 대안입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘외국 여자’는 ‘외인/외부자’의 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  english_pob_choice: to rescue you
  chosen_korean: 구해 내기 위함입니다
  alternatives_korean:
  - 구원하기 위함입니다
  - 건져 내기 위함입니다
  lexicon: HALOT
  rationale: 히필 부정사구는 목적을 나타내므로 결과 중심의 동사구로 옮겼습니다. ‘구해 내다’는 현대 한국어에서 자연스럽고, 위험에서 건져 내는 뜻을 잘 살립니다.
- source_word: אִשָּׁה זָרָה
  english_pob_choice: the strange woman / the forbidden woman
  chosen_korean: 음녀
  alternatives_korean:
  - 낯선 여자
  - 금지된 여자
  - 외인 여성
  lexicon: HALOT
  rationale: 잠언에서 이 표현은 단순한 인종적 외국인이 아니라 언약적·도덕적 경계 밖의 여인을 가리키는 관용적 표현이므로, 그 문맥적 힘을 보존하는 한국어 관용어 ‘음녀’를 채택했습니다.
- source_word: מִנָּכְרִיָּה
  english_pob_choice: from the foreign woman
  chosen_korean: 외국 여자에게서
  alternatives_korean:
  - 외인에게서
  - 낯선 여자에게서
  - 이방 여자에게서
  lexicon: HALOT
  rationale: נכריה는 외부자/외국인이라는 의미를 가지며 앞의 זרה와 평행을 이룹니다. 한국어에서는 ‘외국 여자’가 어휘적 외부성도 살리고 자연스럽습니다.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  english_pob_choice: whose words are smooth
  chosen_korean: 말이 매끄러운
  alternatives_korean:
  - 말이 아첨하는
  - 말이 달콤한
  - 말이 부드러운
  lexicon: HALOT
  rationale: 히필 동사는 ‘매끈하게 만들다’에서 확장된 ‘매끄러운/미끈한 말’의 비유를 나타냅니다. ‘매끄러운’은 비유를 유지하면서도 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 잠언의 ‘음녀/외국 여자’ 표현의 범위
  chosen_reading: 문자적 외국성보다 언약적·도덕적 경계 밖에 있는 유혹의 인물을 가리키는 경고로 읽었습니다.
  alternative_readings:
  - 단순히 민족적으로 외국인인 여자
  - 특정한 성적 부도덕만 가리키는 여자
  rationale: 본문의 병렬 표현(‘음녀’, ‘외국 여자’)은 단순한 국적 표지가 아니라 지혜 문학 특유의 도덕적 위험을 강조합니다. 한국어 ‘음녀’는 그 긴장을 비교적 정확히 전달합니다.
  doctrine_reference: 잠언의 지혜 문학적 경고와 언약적 충성의 주제
