source:
  edition: WLC
  text: לְ֭/הַצִּ֣ילְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/016.yaml
  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
  footnotes:
  - marker: a
    text: Or 'strange woman'; in Proverbs this expression often refers to a woman outside proper covenantal or marital bounds, not merely someone ethnically foreign.
