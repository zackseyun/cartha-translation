lexical_decisions:
- source_word: מְזִמָּה
  english_pob_choice: Discretion
  chosen_korean: 신중함
  alternatives_korean:
  - 분별
  - 지혜로운 판단
  - 사려
  lexicon: HALOT
  rationale: 잠언 문맥에서 긍정적 의미의 신중한 계획과 분별을 가리키므로, ‘신중함’이 POB의 ‘Discretion’을 자연스럽게 살리면서도 문자적 대조를 유지합니다.
- source_word: תִּשְׁמֹר עָלֶיךָ
  english_pob_choice: will watch over you
  chosen_korean: 당신을 지키고
  alternatives_korean:
  - 당신을 지켜보고
  - 당신 위에 머물며 지키고
  - 당신을 보호하고
  lexicon: HALOT
  rationale: שׁמר와 עַל의 보호적 뜻을 살려 ‘지키다’로 옮기되, 한국어에서는 ‘당신을 지키고’가 가장 간결하고 자연스럽습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 통찰
  - 깨달음
  lexicon: HALOT
  rationale: 지혜문학에서 תְּבוּנָה는 단순한 이해보다 옳고 그름을 가려내는 능력을 강조하므로, ‘분별력’이 POB의 의미를 더 정확히 드러냅니다.
- source_word: תִנְצְרֶךָּ
  english_pob_choice: will guard you
  chosen_korean: 당신을 보호합니다
  alternatives_korean:
  - 당신을 지킵니다
  - 당신을 간수합니다
  - 당신을 보전합니다
  lexicon: HALOT
  rationale: נצר는 지키고 보전하는 보호의 뜻이 있으므로, 앞 절의 ‘지키고’와 구별되면서도 반복되는 보호 이미지를 살린 ‘보호합니다’를 택했습니다.
theological_decisions:
- issue: 지혜 문맥에서 두 명사의 기능적 대응
  chosen_reading: ‘신중함’과 ‘분별력’이 인격처럼 수신자를 보호하는 지혜의 능력으로 제시된 것으로 읽었습니다.
  alternative_readings:
  - 두 단어를 단순한 추상 명사로만 읽는 해석
  - ‘계획’과 ‘통찰’로 덜 인격화하는 해석
  rationale: 히브리어 평행법은 두 지혜 개념이 실제 보호 행위자로 묘사됨을 보이므로, 한국어도 그 보호적 능동성을 살려야 합니다.
  doctrine_reference: 잠언의 지혜 인격화와 교육적 수사
