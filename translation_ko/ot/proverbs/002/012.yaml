lexical_decisions:
- source_word: לְהַצִּילְךָ
  english_pob_choice: to deliver you
  chosen_korean: 당신을 건져 내기 위함입니다
  alternatives_korean:
  - 당신을 구해 내기 위함입니다
  - 당신을 구원하기 위함입니다
  lexicon: HALOT
  rationale: 히필 부정사구가 목적을 나타내므로 ‘건져 내다’로 옮겨 보호·구출의 뜻을 살렸습니다. ‘구원하다’는 구속론적 의미를 너무 쉽게 불러올 수 있어 피했습니다.
- source_word: מִדֶּרֶךְ רָע
  english_pob_choice: from the evil way
  chosen_korean: 악한 길에서
  alternatives_korean:
  - 악의 길에서
  - 악한 도에서
  lexicon: HALOT
  rationale: דֶּרֶךְ는 잠언에서 윤리적 삶의 ‘길/행로’를 가리키므로 ‘길’로 유지했습니다. רָע는 여기서 도덕적 성격을 수식하므로 ‘악한’이 자연스럽습니다.
- source_word: מֵאִישׁ
  english_pob_choice: from the man
  chosen_korean: 사람에게서
  alternatives_korean:
  - 남자에게서
  - 그 사람에게서
  lexicon: HALOT
  rationale: 히브리어 אִישׁ은 문법적으로 남성형이지만, 잠언의 경고 대상은 대표적 유형의 인물입니다. 한국어에서는 반복된 ‘사람’이 가장 자연스럽고, 바로 뒤의 설명절과도 잘 연결됩니다.
- source_word: תַּהְפֻּכֽוֹת
  english_pob_choice: perverse things
  chosen_korean: 비뚤어진 말을
  alternatives_korean:
  - 뒤틀린 말을
  - 사악한 말을
  - 왜곡된 말을
  lexicon: HALOT
  rationale: תַּהְפֻּכוֹת은 ‘뒤집힘, 왜곡, 비뚤어짐’의 의미를 가지며 말의 성격을 가리킵니다. 한국어에서는 ‘비뚤어진 말’이 도덕적·수사적 뉘앙스를 함께 전달합니다.
theological_decisions:
- issue: 문장 구조의 목적성 보존
  chosen_reading: ‘건져 내기 위함입니다’로 목적 절을 분명히 했습니다.
  alternative_readings:
  - ‘건져 냅니다’
  - ‘건져 주십니다’
  rationale: 히브리어 부정사구는 2:11–12 전체의 보존 목적을 나타내므로, 결과보다 목적을 드러내는 표현이 본문 구조에 더 충실합니다.
  doctrine_reference: 잠언 2:11–12 문맥의 지혜 보호 기능
