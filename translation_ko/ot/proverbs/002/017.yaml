translation:
  language: ko
  text: 그 여자는 젊은 날의 동반자[a]를 버리고 자기 하나님의 언약[b]을 잊어버립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동반자’는 ‘젊은 날의 남편’으로도 옮길 수 있습니다. 이 히브리어 단어는 친밀한 동반자를 뜻하며, 여기서는 결혼 상대를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 하나님의 언약’은 하나님의 권위나 증인 아래 맺은 결혼 언약을 가리킬 가능성이 크지만, 하나님께 대한 더 넓은 언약적 의무를 암시할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת / הַעֹזֵבֶת
  english_pob_choice: who abandons
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 저버리고
  lexicon: HALOT
  rationale: 분사형이 앞절의 여인을 규정하는 지속적 성격을 나타내므로, 현대 한국어에서는 서술형 연결인 ‘버리고’가 자연스럽고 ‘forsake’의 관계 단절 뉘앙스를 잘 살립니다.
- source_word: אַלּוּף
  english_pob_choice: companion
  chosen_korean: 동반자
  alternatives_korean:
  - 친구
  - 짝
  - 남편
  lexicon: HALOT
  rationale: 문맥상 ‘그의 젊은 날의’와 평행하는 결합 관계를 가리키지만, 본문 자체는 반드시 ‘남편’이라고 명시하지 않으므로, 관계의 친밀성과 결속을 살리는 ‘동반자’가 가장 절제된 번역입니다.
- source_word: נְעוּרֶיהָ
  english_pob_choice: of her youth
  chosen_korean: 젊은 날의
  alternatives_korean:
  - 청년 시절의
  - 어릴 적의
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로는 ‘젊은 날의’로 옮기면, 초기 생애에 맺어진 관계라는 시간적 의미를 간결하게 보존할 수 있습니다.
- source_word: בְּרִית אֱלֹהֶיהָ
  english_pob_choice: the covenant of her God
  chosen_korean: 자기 하나님과의 언약
  alternatives_korean:
  - 그녀의 하나님과 맺은 언약
  - 하나님의 언약
  lexicon: HALOT
  rationale: ‘her God’의 인칭 소유를 분명히 드러내고, בְּרִית의 언약적 무게를 살리기 위해 ‘자기 하나님과의 언약’으로 옮겼습니다. 본문이 단순한 종교 의무보다 하나님 앞의 관계적·법적 책임을 함께 시사합니다.
- source_word: שָׁכֵחָה
  english_pob_choice: forgets
  chosen_korean: 잊어버리는
  alternatives_korean:
  - 잊는
  - 잊어버리고
  lexicon: HALOT
  rationale: 잠언의 일반 진술에 맞게 현재적 성격을 살리되, 단순 기억 상실이 아니라 의도적 외면에 가까운 뉘앙스를 갖는 ‘잊어버리는’을 택했습니다.
theological_decisions:
- issue: ‘the covenant of her God’의 범위
  chosen_reading: 자기 하나님과의 언약으로 옮기되, 그 언약은 문맥상 결혼 언약을 포함하거나 그 위에 놓인 하나님 앞의 언약 책임을 가리킬 수 있습니다.
  alternative_readings:
  - 그녀의 결혼 언약
  - 하나님의 언약
  rationale: 앞구의 ‘젊은 날의 동반자’와 강하게 평행하므로 결혼 관계를 가리킬 가능성이 크지만, 히브리어는 그보다 넓게 ‘그녀의 하나님과의 언약’이라고 말합니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 해석을 단정하지 않고 본문의 이중 가능성을 보존합니다.
