    text: 히브리어 אָרֶץ는 ‘땅’ 또는 ‘세상/온 땅’을 뜻할 수 있습니다. 여기서는 거주하고 남아 있는 장소라는 문맥에 따라 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
