  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
  footnotes:
  - marker: a
    text: Or 'the earth.' Hebrew אָרֶץ can denote either 'land' or 'earth'; here 'the land' was chosen because the context emphasizes remaining in or being removed from a place of habitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 정직한 이들은 땅에 거주하고, 흠없는 이들은 그 안에 머물기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’으로 옮긴 히브리어 אָרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅/세상(earth)’을 뜻할 수 있습니다. 여기서는 거주와 남음의 대비가 분명하므로 ‘땅’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 곧 …
  - 그러므로 …
  lexicon: HALOT
  rationale: 문맥상 앞선 경고의 근거를 제시하는 접속이므로, 원인·이유를 드러내는 ‘이는 … 때문입니다’가 자연스러운 합쇼체로 대응합니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 이들
  alternatives_korean:
  - 올곧은 이들
  - 의로운 이들
  - 바른 이들
  lexicon: HALOT
  rationale: 기본 의미는 도덕적으로 곧고 바른 사람들을 가리키므로, 한국어에서는 ‘정직한 이들’이 가장 자연스럽게 윤리적 직선성을 살립니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 땅덩이
  - 세상
  lexicon: HALOT
  rationale: 지혜문맥의 거주·남음 대조를 살리기 위해 ‘땅’으로 옮겼습니다. 여기서는 일반적 ‘지면/거주지’의 뉘앙스를 유지하는 것이 본문에 맞습니다.
- source_word: תְמִימִים
  english_pob_choice: the blameless
  chosen_korean: 흠없는 이들
  alternatives_korean:
  - 온전한 이들
  - 결함 없는 이들
  - 순전한 이들
  lexicon: HALOT
  rationale: תמימים는 무결점이라기보다 도덕적·인격적 온전함을 뜻하므로, 관용적이면서도 윤리적 함의를 지키는 ‘흠없는 이들’이 적절합니다.
- source_word: יִוָּתְרוּ
  english_pob_choice: will remain
  chosen_korean: 머물기 때문입니다
  alternatives_korean:
  - 남아 있기 때문입니다
  - 남겨지기 때문입니다
  - 계속 있기 때문입니다
  lexicon: HALOT
  rationale: 니팔형의 ‘남다/남겨지다’ 의미를 한국어에서 결과 상태로 풀어 ‘머물다’로 자연스럽게 옮겼습니다. 앞의 ‘거주하다’와 평행을 이루어 중복 없이 지속성을 드러냅니다.
theological_decisions:
- issue: אָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 세상
  - 지구
  rationale: 여기서는 추상적 ‘세상’보다 거주 가능한 장소로서의 ‘땅’이 다음 절의 제거/남음 대조와 더 잘 맞습니다. 토지-거주 문맥을 유지하면서 과도한 우주론적 확장을 피합니다.
  doctrine_reference: 지혜문학의 보응 구조와 거주 지속성
- issue: 평행 구조 보존
  chosen_reading: 정직한 이들 / 흠없는 이들
  alternative_readings:
  - 의인 / 온전한 자
  - 올곧은 자 / 순전한 자
  rationale: 히브리어는 두 형용사를 병렬로 사용해 같은 부류를 강화하므로, 한국어도 두 표현을 나란히 두어 평행과 강조를 보존했습니다.
  doctrine_reference: 히브리어 시적 평행법
