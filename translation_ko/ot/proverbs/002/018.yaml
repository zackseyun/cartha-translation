source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה אֶל מָ֣וֶת בֵּיתָ֑/הּ וְ/אֶל רְ֝פָאִ֗ים מַעְגְּלֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
  footnotes:
  - marker: a
    text: Or 'the shades,' a poetic term for the departed dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그녀의 집이 죽음을 향해 내려앉고, 그녀의 길이 죽은 자들에게로 향하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그림자들’. 죽은 자들을 가리키는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그녀의 집은 죽음으로 기울어지고
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 문맥상 앞절의 경고를 뒷받침하는 이유를 제시하므로, 한국어에서도 원인·설명 기능을 자연스럽게 살리되 문장 흐름을 유지했습니다.
- source_word: שָׁחָה
  english_pob_choice: sinks down
  chosen_korean: 기울어지고
  alternatives_korean:
  - 가라앉고
  - 내려앉고
  - 숙이고
  lexicon: HALOT
  rationale: 이 동사는 아래로 기울거나 내려앉는 움직임을 나타내므로, 죽음을 향한 하강 이미지를 살리는 ‘기울어지고’를 택했습니다.
- source_word: רְפָאִים
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 그림자들
  - 망자들
  - 레파임
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 이 표현은 스올의 죽은 자들을 가리키므로, 본문에서는 이해하기 쉬운 ‘죽은 자들’로 옮기고 더 시적인 대안은 각주로 남길 수 있습니다.
- source_word: מַעְגְּלֹתֶיהָ
  english_pob_choice: her paths
  chosen_korean: 그녀의 길들
  alternatives_korean:
  - 그녀의 행로들
  - 그녀의 보행 흔적들
  - 그녀의 길
  lexicon: HALOT
  rationale: 복수형과 소유격을 살리기 위해 ‘길들’로 옮겼고, 반복적이고 습관적인 삶의 궤적이라는 의미를 반영했습니다.
theological_decisions:
- issue: רְפָאִים의 한국어 처리
  chosen_reading: ‘죽은 자들’로 본문에 두고, ‘그림자들’ 같은 더 시적인 표현은 주석적 대안으로만 남깁니다.
  alternative_readings:
  - 그림자들
  - 망자들
  - 레파임
  rationale: 이 표현을 종족명으로 오해하지 않게 하면서도, 지혜시적 경고의 종말론적 무게를 약화시키지 않기 위한 선택입니다.
  doctrine_reference: Translation philosophy §3, §6
