  terminology: ‘야훼’, ‘지혜’, ‘지식’, ‘이해’는 원문의 신명과 지혜문학의 핵심 어휘를 적절히 반영합니다. תְבוּנָה의 대안인 ‘분별’은 해당 어휘에 연결된 주석으로 제시합니다.
