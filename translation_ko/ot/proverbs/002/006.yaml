id: PRO.2.6
reference: Proverbs 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
  footnotes:
  - marker: a
    text: Or 'Because the LORD gives wisdom.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from his mouth'; the image is that knowledge and understanding proceed from the LORD's speech.
    reason: lexical_alternative
  - marker: c
    text: Or 'discernment' for 'understanding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 지혜를 주십니다[a][b][c]; 그의 입에서 지식과 이해가 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와께서 지혜를 주십니다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 입에서’입니다. 지식과 이해가 야훼의 말씀에서 나온다는 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘분별’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 직접 나타난 신명사טר그라마톤을 한국어에서도 인명화된 고유명사로 살려, POB의 원칙대로 ‘야훼’로 옮겼습니다.
- source_word: יִתֵּן
  english_pob_choice: gives
  chosen_korean: 주십니다
  alternatives_korean:
  - 줍니다
  - 주시겠습니다
  lexicon: HALOT
  rationale: 잠언의 격언적 현재를 한국어에서도 현재형으로 살리되, 하나님의 행위를 공손한 서술로 표현했습니다.
- source_word: מִפִּיו
  english_pob_choice: from his mouth come
  chosen_korean: 그의 입에서 ... 나옵니다
  alternatives_korean:
  - 그의 입에서 나옵니다
  - 그의 입으로부터 나옵니다
  lexicon: HALOT
  rationale: ‘입에서’라는 문자적 이미지를 유지하면서, 뒤의 명사들에 자연스럽게 이어지도록 ‘나옵니다’를 보완했습니다.
- source_word: תְבוּנָה
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 분별
  - 깨달음
  lexicon: HALOT
  rationale: ‘지식’과 짝을 이루는 지혜문학적 병렬을 유지하면서도, 문맥상 추상적 통찰을 드러내기 위해 ‘이해’를 택했습니다.
theological_decisions:
- issue: 야훼의 말씀이 지식과 이해의 근원이라는 이미지
  chosen_reading: 지식과 이해가 하나님의 말씀에서 비롯된다는 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 지식과 이해를 단순히 하나님이 주시는 선물로만 일반화하는 읽기
  - 문자적 이미지인 ‘입’을 약화시켜 풀어 쓰는 읽기
  rationale: 히브리어의 ‘그의 입에서’는 단순한 출처 진술을 넘어, 하나님의 말씀 행위가 지혜의 근원임을 드러냅니다. 이를 약화하지 않도록 직역적 이미지를 유지했습니다.
  doctrine_reference: 지혜문학의 계시-언어 이해
- issue: 합쇼체 서술과 하나님의 직접 행위
  chosen_reading: 하나님을 향한 서술은 ‘주십니다’로 공손하게 처리했습니다.
  alternative_readings:
  - 무표지 현재형 ‘줍니다’
  - 전통적 종결 ‘주신다’
  rationale: 표준어 현대 문체를 유지하면서도, 신적 주어에 대한 한국어 화용을 고려해 합쇼체를 선택했습니다.
  doctrine_reference: 한국어 번역 शैली 가이드
