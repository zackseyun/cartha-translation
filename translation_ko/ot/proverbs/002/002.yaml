lexical_decisions:
- source_word: לְהַקְשִׁיב
  english_pob_choice: making your ear attentive
  chosen_korean: 당신의 귀를 기울이고
  alternatives_korean:
  - 당신의 귀를 주의 깊게 하여
  - 당신의 귀를 듣도록 하여
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려, 단순히 ‘듣다’보다 ‘귀를 기울이다’로 옮겨 주의의 방향성을 드러냈습니다.
- source_word: לַחָכְמָה
  english_pob_choice: to wisdom
  chosen_korean: 지혜에
  alternatives_korean:
  - 지혜를 향하여
  - 지혜를
  lexicon: HALOT
  rationale: 전치사 ל가 여기서는 주의의 대상/방향을 나타내므로, 한국어에서도 ‘-에’로 대상성을 자연스럽게 살렸습니다.
- source_word: תַּטֶּה
  english_pob_choice: inclining
  chosen_korean: …마음을 향하게 하십시오
  alternatives_korean:
  - …마음을 기울이십시오
  - …마음을 돌리십시오
  lexicon: HALOT
  rationale: נטה의 ‘기울이다/향하게 하다’는 의미를 따라, 평행구조 속에서 의도적 태도 전환을 분명히 했습니다.
- source_word: לַתְּבוּנָה
  english_pob_choice: to understanding
  chosen_korean: 분별에
  alternatives_korean:
  - 이해에
  - 깨달음에
  lexicon: HALOT
  rationale: 영문 주석이 제시한 ‘discernment’ 가능성을 반영해, 잠언 문맥에서 더 결이 분명한 ‘분별’도 함께 남겨 두었습니다.
theological_decisions:
- issue: 지혜/분별의 평행어 처리
  chosen_reading: ‘지혜’와 ‘분별’의 평행을 유지해, 잠언의 교육적·훈련적 호소로 읽히게 했습니다.
  alternative_readings:
  - ‘지혜’와 ‘이해’로 더 일반화하는 읽기
  - 두 항을 모두 ‘이해’로 평탄화하는 읽기
  rationale: 히브리어 시구의 병행성을 보존해야 하므로, 두 번째 항을 너무 넓거나 중립적인 말로 희석하지 않았습니다.
  doctrine_reference: 잠언 2장의 지혜문학적 권면 구조
- issue: 명령형 높임말
  chosen_reading: 지혜를 향해 자신의 감각과 내면을 의도적으로 돌리라는 권면을 현대 공손체 명령으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화하는 읽기
  - 전통적인 하옵나이다체
  rationale: 청자에게 직접 주어지는 권면의 힘을 살리되, 현대 표준어 합쇼체에 맞추어 과도한 고어화를 피했습니다.
  doctrine_reference: 문학 장르와 독자 수용성
