  source_fidelity: 히브리어는 앞 절에 이어지는 히필 부정사(‘귀를 주의 깊게 기울이는 것’)와 칼 미완료형(문맥상 권면으로 ‘마음을 기울이십시오’)으로, 지혜와 תבונה를 향한 의도적 주의를 병행하여 표현합니다. ‘귀를 기울이고 … 마음을 기울이십시오’는 이 병행과 방향을 충실히 보존합니다.
  naturalness: 초안의 ‘당신의’는 한국어 권면 문체에서 불필요하게 반복되어 다소 부자연스럽고, ‘마음을 향하게 하십시오’는 원문의 직접적인 ‘마음을 기울이다’보다 우회적이며 사역적으로 들립니다. 소유 표현을 생략하고 두 행을 같은 동사로 병행하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: חָכְמָה는 ‘지혜’로, תְּבוּנָה는 잠언의 지혜 어휘에 맞게 ‘명철’로 옮겼습니다. 이는 단순한 정보 이해보다 통찰과 분별을 포함하는 뜻을 잘 드러냅니다. 대안 ‘분별’은 주석에서 제시할 수 있습니다.
  issues:
