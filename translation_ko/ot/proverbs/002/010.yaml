base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
  footnotes:
  - marker: a
    text: Or 'when wisdom enters your heart.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'soul'; also 'self' or 'life' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜가 당신의 마음에 들어가면, 지식은 당신의 영혼에 달콤할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜가 당신의 마음에 들어갈 때’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘영혼’; 문맥에 따라 ‘자아’ 또는 ‘생명’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 슬기
  lexicon: HALOT
  rationale: 잠언에서 חָכְמָה의 핵심 의미를 가장 직접적으로 살리는 표준 번역으로, 문맥상 인격화된 도덕적·실천적 지혜를 전달합니다.
- source_word: בְלִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 심장
  - 당신의 속마음
  - 당신의 마음속
  lexicon: HALOT
  rationale: 히브리어 לֵב의 ‘내면/사유/의지’를 한국어에서 자연스럽게 살리기 위해 ‘마음’을 택했습니다. ‘마음속’은 다소 중복적이어서 본문에서는 간결하게 처리했습니다.
- source_word: וְדַעַת
  english_pob_choice: and knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 분별
  lexicon: HALOT
  rationale: 지혜 문맥에서 דַּעַת은 단순 정보보다 축적된 앎을 가리키므로 ‘지식’이 가장 안정적입니다.
- source_word: לְנַפְשְׁךָ
  english_pob_choice: to your soul
  chosen_korean: 당신의 영혼
  alternatives_korean:
  - 당신의 생명
  - 당신의 자아
  - 당신의 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ의 넓은 의미를 고려할 때 ‘영혼’이 가장 자연스럽게 본문의 내면적 깊이를 살리며, ‘마음’과의 대응도 유지합니다.
- source_word: יִנְעָם
  english_pob_choice: will be pleasant
  chosen_korean: 달콤할 것입니다
  alternatives_korean:
  - 기쁠 것입니다
  - 즐거울 것입니다
  - 유쾌할 것입니다
  lexicon: HALOT
  rationale: 나아ם의 핵심은 ‘pleasant/sweet’이므로 감각적 이미지를 살린 ‘달콤할 것입니다’로 옮겨 본문의 시적 울림을 유지했습니다.
theological_decisions:
- issue: לֵב / נֶפֶשׁ의 인간 이해
  chosen_reading: ‘마음’과 ‘영혼’을 유지해 히브리적 내면 인간학을 살렸습니다.
  alternative_readings:
  - ‘마음’과 ‘생명’
  - ‘지성’과 ‘자아’
  rationale: 본문은 인간 내면을 분절된 심리학 용어로 설명하기보다, 지혜와 지식이 사람 전체의 내면과 삶에 스며드는 모습을 말합니다. 그래서 축소적 표현보다 원문의 인류학적 폭을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
