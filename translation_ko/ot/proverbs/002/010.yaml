revisions:
- from: 지혜가 당신의 마음에 들어가면, 지식은 당신의 영혼에 달콤할 것입니다.[a][b]
  to: 이는 지혜가 당신의 마음에 들어오며, 지식이 당신의 영혼에 즐거움이 될 것이기 때문입니다.[a][b]
  rationale: כִּי의 설명적 용법을 ‘이는 … 때문입니다’로 반영하되, 시간적 해석은 각주에 보존했습니다. יִנְעָם은 ‘즐거움이 되다’로 옮겨 원문의 긍정적 평가와 한국어의 자연스러운 표현을 함께 살렸습니다. 지혜·지식·마음·영혼의 핵심 용어와 네페쉬의 어휘적 폭은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:37:06Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 כִּי를 시간절 ‘-면’으로 확정하여, 앞 구절을 설명하는 접속사일 수 있는 원문의 기능을 충분히 보존하지 못합니다. 또한 יִנְעָם의 ‘즐거움/기쁨이 되다’라는 관계를 ‘달콤하다’로 옮긴 것은 한국어에서 다소 감각적으로 좁아집니다. 개정문은 ‘이는’으로 설명적 연결을 반영하고, 각 동사의 미래적 뉘앙스를 유지합니다.
  naturalness: ‘당신의 마음에 들어오며’와 ‘당신의 영혼에 즐거움이 될 것입니다’는 현대 표준 한국어의 격식 있는 성서 문체로 자연스럽습니다. ‘영혼에 달콤하다’보다 ‘영혼에 즐거움이 되다’가 한국어 결합과 문맥에 더 잘 맞습니다.
  terminology: חָכְמָה는 ‘지혜’, דַּעַת는 ‘지식’, לֵב는 ‘마음’, נֶפֶשׁ는 ‘영혼’으로 유지합니다. ‘영혼’의 어휘 범위는 각주로 보완하여 특정 교리적 인간론을 강제하지 않습니다.
  issues:
  - severity: medium
    issue: כִּי의 기능이 ‘-면’으로 단정되어 있습니다.
    rationale: 이 접속사는 문맥상 시간적 ‘-할 때’로도 이해될 수 있지만, 선행 권면의 근거·설명을 나타내는 ‘이는/왜냐하면’으로 읽는 것이 가능하며 영어 POB의 주 선택도 ‘For’입니다. 본문은 설명적 기능을 반영하고 시간적 해석은 각주로 남기는 것이 안전합니다.
  - severity: medium
    issue: יִנְעָם을 ‘달콤할 것입니다’로 번역했습니다.
    rationale: 히브리어는 지식이 네페쉬에 ‘기분 좋고 즐거운 것’이 된다는 뜻입니다. 한국어 ‘영혼에 달콤하다’는 어색하고 의미를 감각적 단맛으로 좁힐 수 있으므로 ‘즐거움이 될 것입니다’가 더 자연스럽고 충실합니다.
  - severity: low
