  text: כָּל בָּ֭אֶי/הָ לֹ֣א יְשׁוּב֑וּ/ן וְ/לֹֽא יַ֝שִּׂ֗יגוּ אָרְח֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: ko
  text: 그에게 들어가는 자마다 돌아오지 못하며, 생명의 길을 다시 얻지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ‘돌아오다’는 단순한 이동이 아니라 회복 불가능한 귀환 불능을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל בָּאֶיהָ
  english_pob_choice: All who go in to her
  chosen_korean: 그에게 들어가는 자마다
  alternatives_korean:
  - 그녀에게 들어가는 모든 사람은
  - 그에게 들어가는 자마다
  lexicon: בוא
  rationale: 히브리어는 ‘들어가다’의 동작을 쓰며, 문맥상 유혹의 대상에게 성적으로/관계적으로 들어가는 행위를 직접적으로 가리키므로 ‘들어가는 자마다’로 옮겼습니다. '그녀'보다 중성적 지시인 '그'가 원문의 대상화된 표현을 더 정확히 반영합니다.
- source_word: לֹא יְשׁוּבוּן
  english_pob_choice: do not return
  chosen_korean: 돌아오지 못하며
  alternatives_korean:
  - 돌아오지 않으며
  - 다시 돌아오지 못하며
  lexicon: שוב
  rationale: 단순한 비귀환이 아니라 회복 불가능성을 드러내는 문맥이므로, 가능성 차단을 담는 ‘돌아오지 못하며’로 자연스럽게 옮겼습니다.
- source_word: וְלֹא יַשִּׂיגוּ
  english_pob_choice: nor do they regain
  chosen_korean: 다시 얻지 못합니다
  alternatives_korean:
  - 회복하지 못합니다
  - 되찾지 못합니다
  - 다시 얻지 못합니다
  lexicon: נשׂג
  rationale: 영어 POB의 ‘regain’을 따라, 잃어버린 것을 다시 획득하지 못한다는 뜻을 살려 ‘다시 얻지 못합니다’로 옮겼습니다.
- source_word: אָרְחוֹת חַיִּים
  english_pob_choice: the paths of life
  chosen_korean: 생명의 길
  alternatives_korean:
  - 생명으로 가는 길
  - 생명의 길
  lexicon: אֹרַח / חַיִּים
  rationale: 복수형 ‘paths’를 한국어에서는 자연스럽게 집합적 단수 ‘길’로 다듬되, 생명에 이르는 삶의 길이라는 뜻은 보존했습니다.
theological_decisions:
- issue: 지혜의 훈계 문맥에서 ‘그’의 지시 대상 유지
  chosen_reading: 대상은 문맥상 음행/유혹의 인격화된 ‘여인’이므로, 현대 한국어에서도 인칭을 완곡하게 바꾸지 않고 ‘그’로 유지했습니다.
  alternative_readings:
  - 그녀에게
  - 음녀에게
  rationale: 원문은 직접적 도덕 경고를 위해 인격화된 여성형 지시를 사용하므로, 도덕적 압력을 약화시키는 완곡어법은 피했습니다.
  doctrine_reference: 잠언 2장의 지혜-어리석음 대비 및 성적 유혹에 대한 경계
