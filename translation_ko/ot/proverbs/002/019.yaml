review_pass:
  verdict: revise
  source_fidelity: 히브리어 כָּל־בָּאֶיהָ는 문맥의 여성 단수 선행사를 받아 ‘그녀에게 들어가는 모든 자’를 뜻합니다. לֹא יְשׁוּבוּן은 ‘돌아오지 않다’이고, לֹא יַשִּׂיגוּ אָרְחוֹת חַיִּים은 ‘생명의 길들에 이르지/도달하지 못하다’입니다. ‘다시 얻다’는 원문 동사 נשׂג의 기본 의미인 ‘도달하다, 이르다’를 지나치게 회복·재획득으로 한정합니다.
  naturalness: ‘그에게’는 현대 한국어에서 남성 또는 성별 불특정 대상을 가리키므로 여성형 선행사를 받는 이 문맥에 부자연스럽습니다. ‘그녀에게 들어가는 모든 자는 … 생명의 길들에 이르지 못합니다’가 현대 표준어 합쇼체로 자연스럽고 병렬도 분명합니다.
  terminology: אָרְחוֹת חַיִּים의 복수 ‘길들’을 보존했습니다. 문맥상 여성으로 인격화된 유혹의 대상을 ‘그녀’로 번역하되, 본 절만으로 ‘음녀’ 같은 해석적 명칭을 삽입하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘그에게’의 성별 지시가 원문의 여성 단수 접미사와 문맥에 맞지 않습니다.
    rationale: בָּאֶיהָ의 접미사 הָ는 여성 단수입니다. 앞 문맥의 ‘낯선 여자/타국 여자’를 받으므로 ‘그녀에게’가 정확합니다.
  - severity: medium
    issue: ‘생명의 길을 다시 얻지 못합니다’는 יַשִּׂיגוּ를 재획득으로 과도하게 해석합니다.
    rationale: נשׂג는 여기서 길에 ‘이르다, 도달하다’라는 의미입니다. ‘다시’ 및 ‘얻다’는 본문에 없는 상실 후 회복의 의미를 더합니다.
  - severity: low
    issue: 현 각주는 ‘돌아오다’가 회복 불가능성을 강조한다고 단정합니다.
    rationale: 부정된 ‘돌아오다’는 엄중한 결과를 말하지만, 동사 자체가 ‘회복 불가능’을 어휘적으로 명시하는 것은 아닙니다. 불필요하고 과도한 각주는 삭제하는 편이 안전합니다.
  revised_text: 그녀에게 들어가는 모든 자는 돌아오지 않으며, 생명의 길들에 이르지 못합니다.
