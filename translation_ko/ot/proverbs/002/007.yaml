id: PRO.2.7
reference: Proverbs 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
  footnotes:
  - marker: a
    text: Or 'lays up sound judgment' or 'stores up success/resourcefulness'; the Hebrew term can include the idea of effective wisdom that leads to well-being.
    reason: lexical_alternative
  - marker: b
    text: Or 'blamelessness' or 'wholeness' for 'integrity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 올곧은 이들을 위해 sound wisdom을 쌓아 두시며[a], 온전히 행하는 이들의 방패이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘건전한 판단’이나 ‘성공/자원성’을 뜻할 수 있습니다. 히브리어는 삶의 유익으로 이어지는 효력 있는 지혜를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  english_pob_choice: stores up
  chosen_korean: 쌓아 두시며
  alternatives_korean:
  - 간직하시며
  - 저장해 두시며
  - 비축하시며
  lexicon: HALOT
  rationale: צפן의 ‘간직하다/저장하다’ 의미를 살려, 미래의 유익을 위해 보관해 두는 이미지를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: לַיְשָׁרִים
  english_pob_choice: for the upright
  chosen_korean: 올곧은 이들을 위해
  alternatives_korean:
  - 의로운 이들을 위해
  - 정직한 이들을 위해
  - 바른 이들을 위해
  lexicon: HALOT
  rationale: יְשָׁרִים의 도덕적 ‘곧음’이라는 뜻을 살려, 관용적이면서도 직설적인 ‘올곧은 이들’로 옮겼습니다.
- source_word: תּוּשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: sound wisdom
  alternatives_korean:
  - 건전한 지혜
  - 지혜로운 분별
  - 유효한 지혜
  lexicon: HALOT
  rationale: 이 단어는 잠언에서 ‘유효한 지혜/분별/성공’을 포함할 수 있어 한국어 단일어로 좁히기보다, 본문 음가를 보존하기 위해 영어 POB의 용례를 그대로 유지하고 각주로 의미 범위를 설명했습니다.
- source_word: תֹם
  english_pob_choice: integrity
  chosen_korean: 온전히 행하는
  alternatives_korean:
  - 온전함으로 행하는
  - 흠 없이 행하는
  - 성실하게 행하는
  lexicon: HALOT
  rationale: תֹם의 ‘완전함/온전함/흠없음’ 의미를 단순 명사 ‘정직’보다 행위의 지속적 태도로 드러내기 위해 ‘온전히 행하는’으로 옮겼습니다.
theological_decisions:
- issue: 문장 주어의 연속성
  chosen_reading: 첫 절과 둘째 절 모두 하나님께서 하시는 일로 읽어, 지혜를 쌓아 두시고 동시에 방패가 되시는 분으로 표현했습니다.
  alternative_readings:
  - 둘째 절을 ‘방패가 [쌓여] 있다’는 식의 생략 구조로 읽을 수 있습니다.
  rationale: 히브리어 병렬과 잠언의 주제적 문맥상, 두 절을 모두 야훼의 보호적 행위로 이해하는 것이 가장 자연스럽고, 영어 POB의 해석도 이를 따릅니다.
  doctrine_reference: 잠언의 신적 주어 병렬 해석
