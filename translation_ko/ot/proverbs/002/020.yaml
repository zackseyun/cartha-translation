id: PRO.2.20
reference: Proverbs 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
  footnotes:
  - marker: a
    text: Or 'good men.' The Hebrew adjective is masculine plural used substantivally for a class of people.
    reason: lexical_alternative
  - marker: b
    text: Or 'guard the paths of the righteous.' The Hebrew verb can mean 'keep,' 'guard,' or 'observe'; here it likely means to stay to or preserve one's course on those paths.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 선한 이들의 길로 걸으며 의인들의 길을 지키게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선한 이들’은 히브리어의 남성 복수 형용사가 명사처럼 쓰인 표현을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지키게 하려는’은 ‘지키다/보호하다/따르다’의 의미 범위를 살려, 그 길에 머무르며 그 길을 유지한다는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 하려는 것입니다
  alternatives_korean:
  - 그리하여
  - ~하기 위함입니다
  lexicon: HALOT
  rationale: 앞절의 목적을 나타내는 לְמַעַן의 기능을 한국어에서 자연스럽게 드러내며, 단순 미래보다 의도/목적의 뉘앙스를 살립니다.
- source_word: תֵּלֵךְ בְּדֶרֶךְ
  english_pob_choice: you may walk in the way
  chosen_korean: 길로 걸으며
  alternatives_korean:
  - 길을 따라가며
  - 길 안에서 걸으며
  lexicon: HALOT
  rationale: הלך의 비유적 ‘걷다’와 דרך의 ‘길’ 이미지를 살리되, 현대 한국어에서 자연스러운 관용으로 옮겼습니다.
- source_word: טוֹבִים
  english_pob_choice: the good
  chosen_korean: 선한 이들
  alternatives_korean:
  - 좋은 사람들
  - 선한 사람들
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 반영해 특정한 도덕적 부류를 가리키는 표현으로 옮겼고, 남성 복수의 집합적 의미를 살렸습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 이들
  - 의로운 사람들
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 표준적인 ‘의인’ 표현을 사용해 צַדִּיקִים의 도덕적·언약적 의미를 보존했습니다.
theological_decisions:
- issue: 두 개의 평행 구조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘선한 이들의 길’과 ‘의인들의 길’의 병렬을 유지했습니다.
  alternative_readings:
  - ‘선한 사람들의 길’과 ‘의로운 사람들의 길’
  - 두 절을 하나의 반복으로 묶어 자연화하는 방식
  rationale: 히브리어의 평행법을 그대로 드러내어, 지혜로운 삶의 길과 의인의 길이 서로 겹치면서도 구별되는 시적 긴장을 유지합니다.
  doctrine_reference: 지혜문학의 평행법과 도덕적 형상화
