translation:
  language: ko
  text: 악을 행하기를 기뻐하고[a], 악한 뒤틀린 일들을 즐거워하는 자들입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 행하기를 즐거워하고’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악의 패역들을 두고 기뻐하는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  english_pob_choice: who rejoice
  chosen_korean: 좋아하는 자들
  alternatives_korean:
  - 기뻐하는 자들
  - 즐거워하는 자들
  lexicon: HALOT
  rationale: 첫 분사로 사람의 성향을 규정하므로 ‘자들’로 풀고, שמח의 정서적 뉘앙스를 ‘좋아하는’으로 자연스럽게 옮겨 반복되는 동사의 흐름을 살렸습니다.
- source_word: לַעֲשׂוֹת רָע
  english_pob_choice: to do evil
  chosen_korean: 악을 행하기를
  alternatives_korean:
  - 악을 하기를
  - 악을 저지르기를
  - 악을 실천하기를
  lexicon: HALOT
  rationale: עשה의 기본 의미를 따라 ‘행하다’를 택해 과도한 범죄 뉘앙스를 피했고, 목적을 나타내는 부정사 구문을 한국어에 맞게 ‘-하기를’로 처리했습니다.
- source_word: יָגִילוּ
  english_pob_choice: exult
  chosen_korean: 즐거워하는
  alternatives_korean:
  - 환호하는
  - 기뻐하는
  lexicon: HALOT
  rationale: 앞의 שמח와 구별되는 더 강한 기쁨을 반영하려고 ‘즐거워하다’를 택했으며, 시적 평행을 살리기 위해 현재형 분사처럼 매끈하게 연결했습니다.
- source_word: בְּתַהְפֻּכ֥וֹת רָע
  english_pob_choice: in the perversities of evil
  chosen_korean: 악의 뒤틀린 일들에서
  alternatives_korean:
  - 악의 패역들에서
  - 악의 뒤틀린 행위들에서
  - 악의 전도된 것들에서
  lexicon: HALOT
  rationale: תהפוכות의 ‘뒤틀림/전도됨’과 רָע의 도덕적 악성을 함께 살리기 위해 직역보다 의미가 드러나는 ‘뒤틀린 일들’로 옮겼습니다.
