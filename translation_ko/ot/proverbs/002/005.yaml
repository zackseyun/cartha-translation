    issue: ‘주’가 יְהוָה의 신명을 일반 칭호로 대체합니다.
    rationale: 제공된 신명 결정은 YHWH를 ‘Yahweh’로 표기하도록 명시합니다. 한국어 본문도 이를 ‘야훼’로 반영해야 합니다.
  - severity: high
    issue: ‘하나님을 아는 지혜’가 ‘하나님에 대한 지식’을 ‘지혜’로 변경합니다.
    rationale: 원문의 דַּעַת는 ‘지식’이며 חָכְמָה(지혜)가 아닙니다. 따라서 핵심 어휘와 병행을 보존해야 합니다.
  - severity: medium
    issue: ‘얻게 되리니’가 תִּמְצָא의 ‘찾다’라는 탐구·발견의 동작을 약화합니다.
    rationale: 앞 절들의 찾음의 비유와 연결되는 동사이므로 ‘찾게 될 것입니다’가 더 충실합니다.
  - severity: medium
    issue: 각주가 본문의 대안 독법을 정확히 제시하지 않으며, 수정 본문에는 필요한 대안이 없습니다.
    rationale: ‘또는 주님을 경외하는 것’은 원문의 다른 독법이나 의미 있는 번역 대안이 아니고, 야훼라는 신명 표기와도 맞지 않습니다.
