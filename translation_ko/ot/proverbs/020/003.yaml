  naturalness: ‘명예는 사람이 … 데에 있고’는 이해되지만 다소 번역투입니다. ‘…하는 것은 사람에게 명예입니다’가 현대 표준어 합쇼체의 격언 문체로 더 자연스럽습니다. ‘다툼에 뛰어듭니다’는 대조와 행동의 돌발성을 자연스럽게 살립니다.
  terminology: ‘명예’, ‘사람’, ‘다툼’, ‘어리석은 자’는 각각 כָּבוֹד, אִישׁ, רִיב, אֱוִיל의 지혜문학적 의미와 격식 있는 한국어 문체에 적절합니다. 희귀 동사 יִתְגַּלָּע의 불확실성은 각주에서 보존해야 합니다.
