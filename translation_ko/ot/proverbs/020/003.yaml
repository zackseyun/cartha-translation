base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/003.yaml
  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
  footnotes:
  - marker: a
    text: The Hebrew verb rendered 'bursts out in quarrel' is rare and uncertain; it may also mean 'gets involved in quarrel' or, more literally, something like 'shows himself' aggressively.
    reason: lexical_alternative
translation:
  language: ko
  text: 다툼을 멀리하는 것은 사람에게 명예이지만, 모든 어리석은 자는 다툼에 뛰어듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다툼에 뛰어듭니다’로 옮긴 히브리어 동사는 희귀하여 뜻이 분명하지 않습니다. ‘다툼에 휘말리다’ 또는 ‘다툼에 끼어들다’로도 이해될 수 있으며, 더 문자적으로는 공격적으로 자신을 드러낸다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 영광
  - 존귀
  lexicon: HALOT
  rationale: 지혜문맥에서 사회적 존중과 바람직한 지위를 가리키므로, ‘영광’보다 ‘명예’가 속담의 윤리적 초점을 더 분명히 드러냅니다.
- source_word: שֶׁבֶת מֵ/רִיב
  english_pob_choice: to keep away from strife
  chosen_korean: 다툼에서 물러나는 데에
  alternatives_korean:
  - 다툼을 피하는 데에
  - 다툼에서 떠나는 데에
  - 다툼을 멀리하는 데에
  lexicon: HALOT
  rationale: 구문상 ‘머무르다/앉다’ 계열이지만 כאן은 ‘~에서 떠나 머무르다’의 관용적 의미로 보이며, 한국어로는 ‘물러나다’가 자연스럽고 원문의 회피·거리두기 뉘앙스를 살립니다.
- source_word: יִתְגַּלָּע
  english_pob_choice: bursts out in quarrel
  chosen_korean: 다툼으로 뛰쳐나옵니다
  alternatives_korean:
  - 다툼에 휘말립니다
  - 다툼에 끼어듭니다
  - 다툼에 불쑥 달려듭니다
  lexicon: HALOT
  rationale: 희귀한 히트팔 형태로 의미가 불확실하므로, POB의 ‘bursts out in quarrel’을 따라 격한 돌출 행동을 한국어로 옮겼습니다. ‘뛰쳐나오다’는 갑작스러운 분출성을 살리면서도 주해상 불확실성을 과도하게 확정하지 않습니다.
theological_decisions:
- issue: 잠언의 일반적 진술을 규범적 격언으로 유지할지 여부
  chosen_reading: 이 절은 특정 사례가 아니라 지혜문학의 일반 원리를 말하므로, 단정적인 도덕 격언 문체로 옮겼습니다.
  alternative_readings:
  - 개별 상황에 한정된 조언으로 완화하는 번역
  - 서술성을 높여 설명적으로 옮기는 번역
  rationale: 히브리어 잠언의 평행법은 보편적 성격의 지혜를 전달하므로, 한국어에서도 압축된 격언성을 유지하는 편이 원문 효과에 충실합니다.
  doctrine_reference: 지혜문학의 격언적 일반화
