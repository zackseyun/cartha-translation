  source_fidelity: 첫 절의 עָרַב은 그 사람이 ‘담보가 된’ 것이 아니라 타인의 채무나 의무에 대해 보증을 선 것을 뜻합니다. 둘째 절의 חַבְלֵהוּ는 그 사람 자체를 담보물로 잡으라는 뜻으로 단정하기보다, 그에게서 담보를 취하라는 법률·상업적 관용 표현으로 옮기는 것이 적절합니다. זָר(단수)와 נָכְרִים(복수)의 구별도 ‘낯선 사람’과 ‘이방인들’로 반영했습니다.
  naturalness: ‘그가 이방인을 위해 담보가 되었기 때문이며’는 한국어로도 어색하고 의미가 바뀝니다. 두 명령문을 분명히 나누고, ‘보증을 섰다’와 ‘그에게서 담보를 잡다’라는 현대 한국어 법률·상업 어휘를 사용하면 자연스럽습니다.
  terminology: ‘보증을 서다’는 עָרַב의 핵심 의미를 정확히 전달합니다. ‘담보를 잡다’는 חבל의 담보 취득 의미를 보존하면서도 인신 구금으로 오해될 수 있는 ‘그를 담보로 잡으라’를 피합니다. ‘이방인’은 본문의 사회적 외부성을 유지하되, 해설에서 민족적·신학적 의미를 과도하게 부여하지 않습니다.
