  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
  footnotes:
  - marker: a
    text: Or, 'Take a pledge from him for foreigners.' The Hebrew of the final clause is terse and may focus either on the garment as collateral or on taking security from the man himself.
    reason: alternative_reading
  - marker: b
    text: '''Has put up security'' refers to guaranteeing another person''s debt or obligation.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 옷을 가져가라. 그가 낯선 사람을 위하여 보증을 섰기 때문이다[b]. 이방인들을 위하여 그에게서 담보를 잡아라[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인들을 위하여 그의 옷을 담보로 잡아라.’ 히브리어의 마지막 절은 간결하여, 옷을 담보로 삼는 데 초점을 두는지 그에게서 담보를 취하는 데 초점을 두는지 분명하지 않을 수 있다.
    reason: alternative_reading
  - marker: b
    text: ‘보증을 섰다’는 말은 다른 사람의 빚이나 의무를 보증하는 것을 뜻한다.
    reason: cultural_note
