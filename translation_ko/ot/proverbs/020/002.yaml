  source_fidelity: 본문은 왕이 불러일으키는 두려움을 어린 사자의 위협적인 소리에 견주며, 왕을 분노하게 하는 자가 자기 네페쉬에 대해 죄를 범한다는 경고를 담고 있습니다. ‘어린 사자’, ‘으르렁거림’, 그리고 왕을 분노하게 한다는 해석은 원문 및 영어 POB의 의미를 적절히 반영합니다.
  naturalness: 초안의 ‘왕의 두려움’은 왕이 느끼는 두려움으로도 읽힐 수 있으므로 ‘왕이 주는 두려움’이 더 분명합니다. 또한 ‘자신의 생명을 범죄합니다’는 현대 한국어에서 목적어 결합이 부자연스럽고 의미가 불명확합니다.
  terminology: ‘으르렁거림’은 נַהַם의 위협적 사자 소리에 적절하며, ‘어린 사자’도 כְּפִיר의 구체성을 보존합니다. חוֹטֵא의 도덕적 어조와 נַפְשׁוֹ의 생명 의미를 함께 살리기 위해 ‘자기 생명을 해치는 죄를 범합니다’로 옮깁니다. 이는 단순히 죽는다는 결과로 축소하지 않으면서 자연스러운 한국어가 됩니다.
