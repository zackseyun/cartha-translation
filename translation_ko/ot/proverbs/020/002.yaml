  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַ֣הַם כַּ֭/כְּפִיר אֵ֣ימַת מֶ֑לֶךְ מִ֝תְעַבְּר֗/וֹ חוֹטֵ֥א נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
  footnotes:
  - marker: a
    text: Or 'The terror of a king is like the roaring of a young lion.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the one provoking him'; the sense is provoking the king to anger.
    reason: lexical_alternative
  - marker: c
    text: Or 'sins against himself' or 'his own soul'; Hebrew nephesh can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 두려움은 어린 사자의 으르렁거림과 같습니다[a]; 그를 분노하게 하는 사람은 자신의 생명을 범죄합니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘으르렁거림’은 ‘포효’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그를 분노하게 하는 자’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘생명’은 히브리어 nephesh의 문맥상 의미이며, ‘자기 자신’이나 ‘영혼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  english_pob_choice: growling
  chosen_korean: 으르렁거림
  alternatives_korean:
  - 포효
  - 울부짖음
  lexicon: HALOT
  rationale: 사자의 위협적인 소리를 한국어로 자연스럽게 살리면서도, 어린 사자와의 비교에 어울리는 낮고 지속적인 경고감을 전달합니다.
- source_word: כְּפִיר
  english_pob_choice: young lion
  chosen_korean: 어린 사자
  alternatives_korean:
  - 사자
  - 사나운 사자
  lexicon: HALOT
  rationale: כְּפִיר는 단순한 사자보다 ‘어린 사자’를 가리키므로, 위협성과 생동감을 함께 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: מִתְעַבְּרֹו
  english_pob_choice: whoever provokes him to anger
  chosen_korean: 그를 분노하게 하는 사람
  alternatives_korean:
  - 그의 분노를 일으키는 사람
  - 그를 화나게 하는 사람
  - 그와 맞서는 사람
  lexicon: HALOT
  rationale: 히트파엘 동사의 의미를 ‘분노를 일으키다’로 풀어 왕을 향한 도발의 결과를 분명히 했습니다.
- source_word: חוֹטֵא נַפְשׁוֹ
  english_pob_choice: sins against his own life
  chosen_korean: 자신의 생명을 범죄합니다
  alternatives_korean:
  - 자신의 생명을 잃습니다
  - 자기 자신에게 죄를 짓습니다
  - 자기 목숨을 해칩니다
  lexicon: HALOT
  rationale: חטא의 도덕적 어조를 살리면서, נפש의 문맥상 의미를 ‘생명’으로 옮겨 실제적 위험과 죄책을 함께 드러냈습니다.
theological_decisions:
- issue: נפש의 의미 범위
  chosen_reading: ‘생명’으로 번역해 자기 파멸의 실제적 위험을 드러내되, ‘범죄합니다’로 도덕적 책임도 보존했습니다.
  alternative_readings:
  - ‘자기 자신’
  - ‘영혼’
  rationale: 지혜문학 문맥에서 נפש는 흔히 생명 또는 자기를 뜻하므로, 여기서는 왕의 분노를 불러오는 행위가 곧 자기 생명을 해치는 결과임을 분명히 하는 쪽이 본문의 긴장을 잘 살립니다.
  doctrine_reference: 잠언의 지혜적 경고와 נפש의 문맥적 의미
