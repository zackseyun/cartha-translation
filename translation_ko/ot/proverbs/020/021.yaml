base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
  footnotes:
  - marker: a
    text: Or 'An inheritance obtained quickly at the beginning.' The Hebrew term may emphasize speed, premature acquisition, or greedy haste.
    reason: lexical_alternative
translation:
  language: ko
  text: 처음에 서둘러 얻은 유산은 끝에는 복을 받지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처음에 빨리 얻은 유산’으로 옮길 수 있습니다. 히브리어 표현은 빠른 취득, 성급한 취득, 또는 탐욕스럽게 서두르는 취득을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 기업
  - 상속
  lexicon: HALOT
  rationale: 문맥상 물려받은 재산이나 소유를 가리키므로 ‘유산’이 자연스럽고, 잠언의 경구체에도 잘 맞습니다.
- source_word: מבחלת
  english_pob_choice: gained hastily
  chosen_korean: 서둘러 얻은
  alternatives_korean:
  - 재빨리 얻은
  - 성급하게 얻은
  - 급히 얻은
  lexicon: HALOT
  rationale: 이 형태는 획득의 속도와 성급함을 함께 드러내므로, ‘서둘러’가 속도와 무리한 취득의 뉘앙스를 함께 살립니다.
- source_word: בָּרִאשֹׁנָה
  english_pob_choice: at first
  chosen_korean: 처음에는
  alternatives_korean:
  - 처음에
  - 맨 처음에는
  - 초기에
  lexicon: HALOT
  rationale: 초기의 상태를 가리키며 뒤의 ‘끝에는’과 대조를 이루므로, ‘처음에는’이 간결하게 구조를 보존합니다.
- source_word: וְאַחֲרִיתָהּ
  english_pob_choice: in the end
  chosen_korean: 끝에는
  alternatives_korean:
  - 마침내
  - 나중에는
  - 결국에는
  lexicon: HALOT
  rationale: 직역하면 ‘그것의 끝’이지만, 잠언의 대조 구조에서는 결과 국면을 나타내는 ‘끝에는’이 가장 자연스럽습니다.
- source_word: לֹא תְבֹרָךְ
  english_pob_choice: will not be blessed
  chosen_korean: 복을 받지 못합니다
  alternatives_korean:
  - 복을 받지 않습니다
  - 복되게 되지 않습니다
  - 복받지 못합니다
  lexicon: HALOT
  rationale: פעל/니פעל 계열의 수동적 의미를 살려, 단순한 성공 부재보다 하나님의 복의 결여를 분명히 드러냅니다.
theological_decisions:
- issue: ‘복’의 범위와 심판의 정도
  chosen_reading: 이 절은 성급한 취득의 결과가 최종적으로 복을 잃는다는 점을 말하며, 그 방식이 직접적 징계인지 또는 일반적 지혜의 질서인지는 열어 둡니다.
  alternative_readings:
  - 구체적인 하나님의 징벌을 암시한다
  - 단순한 현실적 실패만 말한다
  rationale: 지혜문학의 경고를 도덕 질서와 결과의 차원에서 유지해야 하므로, 의미를 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
