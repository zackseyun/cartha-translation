id: PRO.20.24
reference: Proverbs 20:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
  footnotes:
  - marker: a
    text: Or 'A person's steps are from the LORD; how then can a person understand his way?' The Hebrew uses masculine singular terms generically.
    reason: lexical_alternative
  - marker: b
    text: '''From the LORD'' indicates source: a person''s course is ordered or determined by the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 걸음은 야훼로부터 나옵니다. 그렇다면 사람이 자기의 길을 어떻게 이해하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수 표현을 사용하지만, 문맥상 일반 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘~로부터’는 걸음의 출처나 기원이 야훼께 있음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼로부터
  alternatives_korean:
  - 주로부터
  - 여호와로부터
  lexicon: HALOT
  rationale: 전치사 מִן은 출처와 기원을 나타내므로 ‘~로부터’로 옮기고, 본문에 직접 나타난 신명은 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
- source_word: מִצְעֲדֵי
  english_pob_choice: steps
  chosen_korean: 걸음
  alternatives_korean:
  - 발걸음
  - 발자취
  lexicon: HALOT
  rationale: 인생의 진행과 움직임을 가리키는 비유를 한국어에서 자연스럽게 살리면서도, 실제 보폭보다 삶의 행로라는 뜻을 유지하는 말로 ‘걸음’을 택했습니다.
- source_word: וְאָדָם
  english_pob_choice: then can a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 사람이 어떻게
  lexicon: HALOT
  rationale: 두 번째 절의 אָדָם은 일반 인간을 가리키는 대표적 용례이므로, 한국어에서는 성별 표지를 과도하게 드러내지 않는 ‘사람’으로 옮겨 의미를 분명히 했습니다.
- source_word: מַה יָּבִין
  english_pob_choice: how then can a man understand
  chosen_korean: 어떻게 이해하겠습니까
  alternatives_korean:
  - 어찌 알겠습니까
  - 어떻게 분별하겠습니까
  lexicon: HALOT
  rationale: 수사적 질문의 불가능성을 한국어로 가장 자연스럽게 드러내기 위해 ‘어떻게’와 가능성의 반문형을 결합했고, יָבִין은 이 문맥에서 ‘이해하다’가 가장 직접적입니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명은 음역을 유지하여 출처와 인격적 명칭을 분명히 드러내는 것이 원문의 직접성에 가장 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
