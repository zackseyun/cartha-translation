  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְזָרֶ֣ה רְ֭שָׁעִים מֶ֣לֶךְ חָכָ֑ם וַ/יָּ֖שֶׁב עֲלֵי/הֶ֣ם אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: ko
  text: 지혜로운 왕은 악인들을 까부르고, 그들 위에 수레바퀴를 굴립니다.
  philosophy: formal
lexical_decisions:
- source_word: מְזָרֶה
  english_pob_choice: winnows
  chosen_korean: 까부르고
  alternatives_korean:
  - 키질하고
  - 흩어버리고
  lexicon: מָזָר / זרה
  rationale: 타작 뒤 곡식의 껍질을 날려 보내는 동작을 한국어로 자연스럽게 살리되, 악인을 정밀하게 ‘가려내고 흩는’ 이미지가 드러나도록 했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들을
  alternatives_korean:
  - 악한 사람들을
  - 불의한 자들을
  lexicon: רָשָׁע
  rationale: 지혜로운 왕의 판단 대상이 되는 집단을 직접적으로 드러내는 표준적인 번역으로 잡았습니다.
- source_word: יָּשֶׁב עֲלֵי/הֶם
  english_pob_choice: drives ... over them
  chosen_korean: 그들 위에 수레바퀴를 굴립니다
  alternatives_korean:
  - 그들 위로 바퀴를 돌립니다
  - 그들 위에 바퀴를 얹습니다
  lexicon: ישב / אוֹפָן
  rationale: 동사의 물리적 압박감을 살리기 위해 ‘굴립니다’를 택했고, 대상 위에 가해지는 파괴적 힘을 ‘수레바퀴’로 풀어냈습니다.
- source_word: אוֹפָן
  english_pob_choice: the wheel
  chosen_korean: 수레바퀴
  alternatives_korean:
  - 바퀴
  - 바퀴살
  lexicon: אוֹפָן
  rationale: 문맥상 단순한 원형 물체가 아니라 압박과 짓밟음을 동반하는 바퀴이므로, 한국어에서는 ‘수레바퀴’가 가장 분명합니다.
theological_decisions:
- issue: 지혜로운 왕의 행위가 단순한 행정이 아니라 악을 제거하고 징계하는 왕권의 공의로 제시됨
  chosen_reading: ‘까부르고… 수레바퀴를 굴립니다’로 강한 심판 이미지를 유지했습니다.
  alternative_readings:
  - 부드럽게 다스립니다
  - 정리합니다
  rationale: 히브리어 두 동사는 악인을 분리하고 그 위에 압박을 가하는 강한 비유이므로, 의미를 누그러뜨리지 않았습니다.
  doctrine_reference: 잠언의 왕권 신학; 공의로운 통치와 심판의 이미지
