  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
  footnotes:
  - marker: a
    text: Hebrew literally, 'stone and stone, ephah and ephah'—that is, differing weights and differing measures used dishonestly in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 저울추와 저울추, 되와 되—이 둘은 모두 야훼께서 미워하시는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘돌과 돌, 에이파와 에이파’로서, 저울추와 되를 속여 쓰는 불공정한 거래를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  english_pob_choice: A differing weight
  chosen_korean: 저울추와 저울추
  alternatives_korean:
  - 다른 저울추와 다른 저울추
  - 무게추와 무게추
  - 돌과 돌
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘돌과 돌’이지만, 상거래 맥락에서는 저울에 쓰는 추를 뜻하므로 한국어로는 실제 의미를 드러내는 ‘저울추’가 가장 자연스럽습니다.
- source_word: אֵיפָה וְאֵיפָה
  english_pob_choice: a differing measure
  chosen_korean: 되와 되
  alternatives_korean:
  - 다른 되와 다른 되
  - 한 되와 또 한 되
  - 서로 다른 곡식되
  lexicon: HALOT
  rationale: 에이파는 건량 측정 단위이므로 한국어의 대표적 계량 표현인 ‘되’를 써서 상거래의 불공정한 이중 기준을 드러냈습니다.
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 미워하시는 것입니다
  alternatives_korean:
  - 가증한 것입니다
  - 혐오하시는 것입니다
  - 역겨워하시는 것입니다
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 이 단어는 하나님 앞에서 강한 도덕적 혐오를 뜻하므로, 현대 한국어로는 ‘미워하시는’이 지나친 교회식 완곡어를 피하면서도 강도를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 여호와 대체어가 아니라 고유한 신명 표기 자체를 살리기 위해 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘가증함/혐오’의 강도
  chosen_reading: ‘미워하시는 것입니다’로 옮겨, 거래에서의 속임수가 단순한 실수가 아니라 야훼 앞에서 도덕적으로 심각한 악이라는 점을 보존했습니다.
  alternative_readings:
  - 가증한 것입니다
  - 혐오하시는 것입니다
  rationale: 히브리어 תּוֹעֵבָה의 강한 평가를 약화하지 않되, 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 윤리적 평가와 하나님의 도덕적 성품에 대한 일반 원리
