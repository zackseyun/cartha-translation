translation:
  language: ko
  text: 서로 다른 저울추와 서로 다른 되—이 둘은 모두 야훼께 가증한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘돌과 돌, 에바와 에바’입니다. ‘돌’은 저울추를, ‘에바’는 곡식의 부피 단위를 가리키며, 여기서는 거래에서 서로 다른 기준의 저울추와 되를 사용하는 일을 뜻합니다.
    reason: lexical_alternative
