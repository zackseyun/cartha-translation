id: PRO.20.8
reference: Proverbs 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֶ֗לֶךְ יוֹשֵׁ֥ב עַל כִּסֵּא דִ֑ין מְזָרֶ֖ה בְ/עֵינָ֣י/ו כָּל רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/008.yaml
  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
  footnotes:
  - marker: a
    text: Or 'scatters' or 'sifts away'; the Hebrew verb evokes the image of winnowing, separating what is worthless from what is good.
    reason: lexical_alternative
  - marker: b
    text: Or 'every evil person.' The Hebrew can refer broadly to evil or, by implication, to evildoers brought under judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 심판의 보좌에 앉아 그 눈으로 모든 악을 키질하듯 가려 냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흩어 버립니다’ 또는 ‘키질합니다’. 히브리어 동사는 곡식을 키질하여 쭉정이와 알곡을 분리하는 이미지를 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 악한 사람을’. 히브리어는 악 자체를 넓게 가리키거나, 문맥상 심판 아래 놓인 악인들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: A king
  chosen_korean: 왕이
  alternatives_korean:
  - 한 왕이
  - 그 왕이
  lexicon: HALOT
  rationale: 속담형 일반 진술이므로 특정 왕이 아니라 일반적인 왕을 가리키는 표현으로 옮겼습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: sitting
  chosen_korean: 앉아
  alternatives_korean:
  - 좌정하여
  - 앉아 있으면서
  lexicon: HALOT
  rationale: 지속적인 자세를 나타내는 분사이므로, 한국어에서는 자연스러운 현재적 동작으로 옮겼습니다.
- source_word: עַל כִּסֵּא דִין
  english_pob_choice: on a throne of judgment
  chosen_korean: 심판의 보좌에
  alternatives_korean:
  - 판결의 보좌에
  - 재판석에
  lexicon: HALOT
  rationale: כִּסֵּא의 왕좌 이미지를 살리기 위해 '보좌'를 택했고, דִין은 법정적 판단의 의미를 살려 '심판'으로 옮겼습니다.
- source_word: מְזָרֶה
  english_pob_choice: winnows
  chosen_korean: 까부릅니다
  alternatives_korean:
  - 키질합니다
  - 흩어버립니다
  - 거릅니다
  lexicon: HALOT
  rationale: זרה의 농경적 이미지인 타작 후 곡식과 쭉정이를 가르는 동작을 한국어의 '까부르다'로 살려, 단순한 '흩다'보다 선별의 뉘앙스를 보존했습니다.
- source_word: בְעֵינָיו
  english_pob_choice: with his eyes
  chosen_korean: 자기 눈으로
  alternatives_korean:
  - 그의 눈으로
  - 눈길로
  lexicon: HALOT
  rationale: 원문의 도구적/수단적 표현을 그대로 반영해, 왕의 분별하는 시선이 악을 가려낸다는 이미지를 살렸습니다.
- source_word: כָּל רָע
  english_pob_choice: all evil
  chosen_korean: 모든 악
  alternatives_korean:
  - 모든 악한 사람을
  - 온갖 악
  lexicon: HALOT
  rationale: 문맥상 악 자체와 악인에 대한 함의를 모두 열어 두기 위해, 영어 POB의 폭을 따라 '모든 악'으로 넓게 옮겼습니다.
theological_decisions:
- issue: 왕의 시선이 악을 분별하고 제거하는 능동적 심판을 어떻게 드러낼지
  chosen_reading: 왕의 눈은 단순 관찰이 아니라 악을 가려내고 분리하는 심판의 수단으로 표현했습니다.
  alternative_readings:
  - 왕이 보좌에 앉아 모든 악을 지켜봅니다.
  - 왕이 모든 악을 살핍니다.
  rationale: 히브리어 동사 זרה의 추상화된 의미를 약화하지 않기 위해, 심판적 분별과 제거의 이미지를 보존했습니다.
  doctrine_reference: 잠언의 통치와 의로운 심판에 대한 지혜 문학적 표현
