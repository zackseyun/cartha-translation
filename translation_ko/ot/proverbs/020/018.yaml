lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  english_pob_choice: Plans
  chosen_korean: 계획
  alternatives_korean:
  - 생각
  - 목적
  - 책략
  lexicon: HALOT
  rationale: 이 문맥에서는 내적 ‘생각’보다 의도된 실행 방안이므로 ‘계획’이 가장 자연스럽고, 잠언의 실용적 어조도 잘 살립니다.
- source_word: בְּעֵצָה
  english_pob_choice: by counsel
  chosen_korean: 조언으로
  alternatives_korean:
  - 권고로
  - 상담으로
  - 지혜로운 조언으로
  lexicon: HALOT
  rationale: בְּ는 수단을 나타내므로 ‘~으로’가 적절하며, ‘조언’은 잠언 문맥의 지혜 전통을 한국어로 간명하게 전달합니다.
- source_word: תִכּוֹן
  english_pob_choice: are established
  chosen_korean: 굳어지고
  alternatives_korean:
  - 확립되고
  - 견고해지고
  - 세워지고
  lexicon: HALOT
  rationale: ‘כון’의 ‘견고해지다/확립되다’ 의미를 살리되, 현대 한국어에서는 관용적으로 ‘굳어지다’가 문맥상 안정성과 확정을 잘 드러냅니다.
- source_word: וּבְתַחְבֻּלֹות
  english_pob_choice: with strategy
  chosen_korean: 전략으로
  alternatives_korean:
  - 전술로
  - 지략으로
  - 지혜로운 방향으로
  lexicon: HALOT
  rationale: תַחְבֻּלוֹת는 원래 조종·조타의 이미지에서 나온 ‘전략/전술’이므로 군사적 뉘앙스를 살려 ‘전략’으로 옮겼습니다.
theological_decisions:
- issue: 잠언의 평행법에서 두 번째 절의 군사 비유를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘전쟁은 전략으로 치러야 합니다’로 옮겨, 히브리어의 명령형 어조와 군사적 대비를 직접 살렸습니다.
  alternative_readings:
  - 전쟁은 지혜로운 방향으로 해야 합니다
  - 전쟁은 조심스럽게 해야 합니다
  rationale: 본문은 단순한 일반론보다 전쟁 수행의 방식에 관한 직설적 지혜를 제시하므로, 비유를 약화시키지 않는 번역이 적절합니다.
  doctrine_reference: 잠언의 지혜 교훈과 수단-목적의 적합성
