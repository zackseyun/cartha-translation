revisions:
- from: 비록 젊은이도 자기 행위로 드러납니다[a] — 그의 일[은] 깨끗하고 올바른지에 따라서입니다.
  to: 젊은이라도 자기 행실로 자신을 드러내며, 그가 하는 일이 깨끗하고 올바른지를 알 수 있습니다[a].
  rationale: 강조사 גַּם을 ‘젊은이라도’로 자연스럽게 옮기고, יִתְנַכֶּר의 재귀적 뉘앙스는 본문에서 ‘자신을 드러내다’로 보존했습니다. 후반절의 אִם…וְאִם은 행실의 도덕적 성격을 판별하는 내용으로 유지하되, 한국어에서 필요한 최소한의 연결만 보충하여 ‘…지를 알 수 있습니다’로 표현했습니다. 초안의 대괄호와 원문에 없는 ‘따라서’ 관계는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:44:23Z'
