    text: Or, 'Even a youth is recognized by his deeds, whether what he does is pure and upright.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 젊은이도 자기 행위로 드러납니다[a] — 그의 일[은] 깨끗하고 올바른지에 따라서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '젊은이도 자기 행위로 알아볼 수 있습니다. 곧 그가 하는 일이 깨끗하고 올바른지로 알 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 비록 …도
  alternatives_korean:
  - 또한
  - 심지어
  lexicon: HALOT
  rationale: אַם/גַּם의 강조·양보 뉘앙스를 한국어의 양보 구조로 살려, 젊은이까지도 예외가 아님을 자연스럽게 드러냅니다.
- source_word: בְּמַעֲלָלָיו
  english_pob_choice: by his deeds
  chosen_korean: 자기 행위로
  alternatives_korean:
  - 자기 행실로
  - 자기 행위들로
  lexicon: HALOT
  rationale: מַעֲלָל은 단순 행동보다 도덕적 색채가 있는 행위이므로 '행위'로 옮기고, ב를 수단/매개로 이해해 '로'를 붙였습니다.
- source_word: יִתְנַכֶּר
  english_pob_choice: makes himself known
  chosen_korean: 드러납니다
  alternatives_korean:
  - 자기를 알립니다
  - 알려집니다
  - 알 수 있습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 살리되 한국어에서 어색한 직역을 피하기 위해, 행위가 사람을 '드러내는' 결과를 간결하게 표현했습니다.
- source_word: אִם זַךְ וְאִם יָשָׁר פָּעֳלוֹ
  english_pob_choice: whether his work is pure and upright
  chosen_korean: 그의 일[은] 깨끗하고 올바른지에 따라서
  alternatives_korean:
  - 그가 하는 일이 깨끗하고 올바른지
  - 그의 행위가 순결하고 바른지
  lexicon: HALOT
  rationale: זַךְ과 יָשָׁר의 윤리적 평가를 각각 '깨끗하고 올바른'으로 옮겨 지혜문학의 도덕 판단을 보존했고, פָּעֹל을 '일'로 받아 문장 구조를 분명히 했습니다.
theological_decisions:
- issue: 젊은이의 행위가 인격을 보여 준다는 잠언의 일반 진술
  chosen_reading: 이 절을 보편적 지혜 진술로 읽고, '드러납니다'를 사용해 행위가 사람의 내면과 성격을 প্রকাশ한다는 점을 살렸습니다.
  alternative_readings:
  - 단순히 사회적 평판이 알려진다는 뜻으로 좁게 읽기
  - 도덕적 평가 없이 외적 인상만 말한다고 읽기
  rationale: 잠언의 평행 구조는 관찰적 지혜를 제시하므로, 행위가 사람을 식별하게 한다는 의미를 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 잠언 문학의 관찰적 지혜와 도덕적 형성
- issue: 두 번째 절반의 생략된 관계를 한국어로 보충하는 방식
  chosen_reading: 원문의 병렬을 따라 '그의 일[은] …인지'라는 설명적 구조를 쓰되, 과도한 해석은 피했습니다.
  alternative_readings:
  - '''그의 일이 순수하고 올바르기 때문입니다''로 인과화하기'
  - '''그의 일이 순수하고 올바르면''로 조건화하기'
  rationale: 히브리어의 병렬적 판단문을 한국어에서 가장 자연스럽게 재현하면서, 조건/원인 중 어느 하나로 과도하게 단정하지 않기 위해서입니다.
  doctrine_reference: 히브리어 잠언의 평행법과 서술문 해석
