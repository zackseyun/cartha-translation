id: PRO.20.27
reference: Proverbs 20:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
  footnotes:
  - marker: a
    text: Or 'The breath of man is the lamp of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the chambers of the belly,' an idiom for a person's deepest inner parts or inner being.
    reason: cultural_note
translation:
  language: ko
  text: 야훼의 등불은 사람의 영입니다. 그것이 배 속의 모든 가장 깊은 곳을 살핍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘배의 방들’은 사람의 가장 깊은 내면을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘사람의 숨은 야훼의 등불’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 램프
  - 불
  - 등
  lexicon: HALOT
  rationale: נֵר는 추상적 ‘빛’보다 구체적 불빛 도구를 가리키므로, 한국어에서는 자연스럽고 성경적인 ‘등불’이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사역 기준에 따라 신명은 대체 칭호가 아니라 고유명사로 옮겨야 하므로, 야훼를 사용했습니다.
- source_word: נִשְׁמַת אָדָם
  english_pob_choice: spirit of man
  chosen_korean: 사람의 영
  alternatives_korean:
  - 사람의 숨
  - 인간의 생기
  - 사람의 혼
  lexicon: HALOT
  rationale: נשמה는 ‘숨’과 ‘영/생기’의 범위를 가지지만, 이 잠언에서는 사람의 내면을 비추고 살피는 영적-인간학적 의미가 두드러지므로 ‘영’이 가장 균형 잡힌 대응입니다.
- source_word: חַדְרֵי בָטֶן
  english_pob_choice: the innermost chambers of the belly
  chosen_korean: 배 속의 모든 가장 깊은 곳
  alternatives_korean:
  - 배 속의 은밀한 방들
  - 내장의 깊은 곳
  - 배 속의 깊은 방들
  lexicon: HALOT
  rationale: 직역하면 ‘배의 방들’이지만, 히브리어 관용구가 사람의 가장 깊은 내면을 뜻하므로 한국어에서는 이미지와 의미를 함께 살린 표현으로 옮겼습니다.
theological_decisions:
- issue: נִשְׁמַת אָדָם의 의미 범위
  chosen_reading: 이 구절은 사람의 ‘영’이 야훼의 등불이 되어 사람의 가장 깊은 내면을 살핀다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 사람의 숨이 야훼의 등불이다라는 보다 생물학적 읽기
  - ‘양심’으로 구체화하는 해석
  rationale: 본문은 ‘양심’이라고 직접 말하지 않으므로 그 개념을 본문에 삽입하지 않았고, 동시에 단순한 호흡만으로 축소하지도 않기 위해 ‘영’을 선택했습니다.
  doctrine_reference: 원문 우선, 신학적 긴장은 본문이 허용하는 범위 안에서 유지
