    rationale: 앞 절이 계사문이므로 ‘그것’이 등불인지 영인지 독자가 잠시 해석해야 합니다. ‘야훼의 등불인 사람의 영은’으로 주어를 분명히 하면 원문의 비유 관계와 참여사의 수식도 자연스럽게 드러납니다.
