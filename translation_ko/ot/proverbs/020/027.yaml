    rationale: חַדְרֵי는 ‘방들, 은밀한 곳들’을 뜻하며, בָטֶן은 문자적으로 배이면서 관용적으로 가장 깊은 내면을 가리킵니다. ‘배 속의 모든 은밀한 곳’은 이미지를 보존하면서 자연스럽습니다.
