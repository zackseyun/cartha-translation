- source_word: וּכְלִי יְקָר
  english_pob_choice: a precious vessel
  chosen_korean: 귀한 그릇
  alternatives_korean:
  - 귀한 용기
  - 귀한 물건
  - 값진 그릇
  lexicon: HALOT
  rationale: כְלִי의 구체적 이미지와 비유성을 살리되, 한국어에서 자연스럽고 문맥에 맞는 ‘그릇’으로 옮겼습니다.
- source_word: שִׂפְתֵי דָעַת
  english_pob_choice: lips of knowledge
  chosen_korean: 지식의 입술
  alternatives_korean:
  - 지식을 지닌 입술
  - 지혜로운 입술
  - 알고 말하는 입술
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 보존해 시적 압축과 대구를 살렸습니다.
theological_decisions:
- issue: 잠언의 최종 대조점이 물질적 가치와 지식이 담긴 말 사이의 대비라는 점
  chosen_reading: ‘귀한 그릇’으로 물질적 보석보다 더 가치 있는 것으로 지식의 입술을 대비시켰습니다.
  alternative_readings:
  - ‘귀한 물건’으로 더 일반화하기
  - ‘값진 보석’으로 구체화하기
  rationale: 본문은 단순히 귀한 물건을 말하는 것이 아니라, 지식으로 말하는 입술이 그보다 더 소중한 가치임을 시적으로 드러냅니다. ‘그릇’은 형상적 대비를 유지합니다.
  doctrine_reference: 잠언 문학의 지혜/가치 대비
