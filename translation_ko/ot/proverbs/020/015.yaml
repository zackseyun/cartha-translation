base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
  footnotes:
  - marker: a
    text: Or 'rubies,' 'corals,' or more generally 'precious gems' for פְּנִינִים; the exact referent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 금도 있고, 진주도 풍부하며, 지식의 입술은 귀한 그릇입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פְּנִינִים은 ‘진주’로 옮길 수 있지만, ‘루비’, ‘산호’, 또는 더 일반적으로 ‘보석류’일 가능성도 있어 정확한 대상은 확정되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
