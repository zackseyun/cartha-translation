  - severity: medium
    issue: 각주 표지의 위치
    rationale: 각주는 פְּנִינִים의 어휘적 불확실성에 관한 것이므로, 문장 끝이 아니라 번역어 ‘진주’에 직접 붙여야 합니다.
  - severity: low
    issue: ‘지식의 입술’의 현대 한국어 어색함
    rationale: 직역적 소유격은 시적이지만 현대 한국어에서는 다소 부자연스럽습니다. ‘지식 있는 입술’은 지식으로 특징지어진 입술이라는 히브리어 구성의 뜻을 보존합니다.
  revised_text: 금도 있고 진주[a]도 많이 있지만, 지식 있는 입술은 귀한 그릇입니다.
