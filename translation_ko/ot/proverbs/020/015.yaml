theological_decisions:
- issue: 잠언의 최종 대조점이 물질적 가치와 지식이 담긴 말 사이의 대비라는 점
  chosen_reading: ‘귀한 그릇’으로 물질적 보석보다 더 가치 있는 것으로 지식의 입술을 대비시켰습니다.
  alternative_readings:
  - ‘귀한 물건’으로 더 일반화하기
  - ‘값진 보석’으로 구체화하기
  rationale: 본문은 단순히 귀한 물건을 말하는 것이 아니라, 지식으로 말하는 입술이 그보다 더 소중한 가치임을 시적으로 드러냅니다. ‘그릇’은 형상적 대비를 유지합니다.
  doctrine_reference: 잠언 문학의 지혜/가치 대비
