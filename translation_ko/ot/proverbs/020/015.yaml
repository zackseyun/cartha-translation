base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
  footnotes:
  - marker: a
    text: Or 'rubies,' 'corals,' or more generally 'precious gems' for פְּנִינִים; the exact referent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 금도 있고 진주[a]도 많이 있지만, 지식 있는 입술은 귀한 그릇입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פְּנִינִים은 ‘진주’로 옮길 수 있지만, ‘루비’, ‘산호’, 또는 더 일반적으로 ‘보석류’를 가리킬 가능성도 있어 정확한 대상은 확정되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: ~이/가 있습니다
  alternatives_korean:
  - ~이/가 있습니다
  - ~이/가 있습니다
  lexicon: HALOT
  rationale: 존재를 나타내는 서술을 한국어의 자연스러운 평서형으로 옮겼습니다.
- source_word: וְרָב פְּנִינִים
  english_pob_choice: and an abundance of pearls
  chosen_korean: 진주도 풍부하며
