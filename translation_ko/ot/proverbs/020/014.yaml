id: PRO.20.14
reference: Proverbs 20:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַ֣ע רַ֭ע יֹאמַ֣ר הַ/קּוֹנֶ֑ה וְ/אֹזֵ֥ל ל֝֗/וֹ אָ֣ז יִתְהַלָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
  footnotes:
  - marker: a
    text: Or “No good, no good,” or “Worthless, worthless.” The Hebrew repeats “bad” for emphasis, reflecting the buyer’s attempt to talk down the value of the item.
    reason: lexical_alternative
translation:
  language: ko
  text: “못하다, 못하다”라고 사는 이는 말합니다. 그러나 그가 떠나면, 그때는 자랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나쁘다, 나쁘다”, “쓸모없다, 쓸모없다”, “좋지 않다, 좋지 않다”. 히브리어는 강조를 위해 ‘나쁘다’를 반복하여, 사려는 사람이 물건의 가치를 낮추려는 태도를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  english_pob_choice: “Bad, bad”
  chosen_korean: “못하다, 못하다”
  alternatives_korean:
  - “나쁘다, 나쁘다”
  - “좋지 않다, 좋지 않다”
  - “쓸모없다, 쓸모없다”
  lexicon: HALOT
  rationale: 반복은 물건 값을 깎으려는 과장된 비하를 나타내므로, 일상적이고 짧은 비평어인 “못하다”가 상거래 맥락의 투박한 어조를 비교적 잘 살립니다.
- source_word: יֹאמַר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하십니다
  - 말합니다(격언적 현재)
  - 말하곤 합니다
  lexicon: HALOT
  rationale: 속담형 현재로 쓰인 동사를 한국어 격언체의 현재형으로 옮겨, 반복적 일반 진술의 성격을 유지했습니다.
- source_word: הַקּוֹנֶה
  english_pob_choice: the buyer
  chosen_korean: 사는 이는
  alternatives_korean:
  - 구매자는
  - 사는 사람은
  - 구입하는 이는
  lexicon: HALOT
  rationale: קנה의 기본 의미를 살리되, 거래 현장에서 말을 흥정하는 인물을 자연스럽게 드러내기 위해 ‘사는 이’를 택했습니다.
- source_word: וְאֹזֵל לוֹ
  english_pob_choice: but when he goes away
  chosen_korean: 그러나 그가 떠나면
  alternatives_korean:
  - 그리고 그가 가면
  - 그리고는 그가 떠나서
  - 하지만 그가 떠난 뒤에
  lexicon: HALOT
  rationale: ‘떠나면’은 어간의 진행과 시간 전환을 간결하게 담고, 앞선 헐뜯는 말과 뒤의 자기찬양 사이의 대비를 한국어 접속사 ‘그러나’로 분명히 했습니다.
- source_word: יִתְהַלָּל
  english_pob_choice: he boasts
  chosen_korean: 자랑합니다
  alternatives_korean:
  - 뽐냅니다
  - 스스로 자랑합니다
  - 자기 자랑을 합니다
  lexicon: HALOT
  rationale: 히트파엘형의 자기찬양, 자기과시를 자연스럽고 간명하게 옮기기 위해 ‘자랑합니다’를 사용했습니다.
theological_decisions:
- issue: 잠언의 풍자적 상업 언어를 어떻게 유지할 것인가
  chosen_reading: 직설적이고 짧은 비하 표현과 대비 구조를 그대로 살려, 속담의 교훈성과 아이러니를 유지했습니다.
  alternative_readings:
  - 더 완곡하게 풀어 쓴 도덕적 의역
  - 흥정 상황을 상세히 설명하는 설명적 번역
  rationale: 이 절은 도덕적 판단보다 거래 현장의 위선과 과장을 풍자하는 압축된 문장입니다. 지나친 설명은 잠언의 날카로운 관찰을 약화시킬 수 있습니다.
  doctrine_reference: 잠언의 지혜문학적 풍자와 인생 관찰
- issue: ‘רַע’의 의미를 ‘나쁨’보다 ‘못함’으로 옮긴 선택
  chosen_reading: 값을 깎는 맥락을 고려해 ‘못하다’로 옮겼습니다.
  alternative_readings:
  - 나쁘다
  - 무가치하다
  - 좋지 않다
  rationale: 히브리어 ‘רע’는 일반적 악/나쁨을 뜻하지만, 여기서는 물건의 가치를 낮추는 상업적 화법이 핵심이므로 한국어에서는 평가절하의 뉘앙스가 더 직접적인 표현이 필요합니다.
  doctrine_reference: 문맥 우선의 어휘 선택
