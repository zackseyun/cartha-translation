revisions:
- from: “못하다, 못하다”라고 사는 이는 말합니다. 그러나 그가 떠나면, 그때는 자랑합니다.[a]
  to: “나쁘다, 나쁘다”라고 구매자는 말합니다. 그러나 그가 떠난 뒤에는 자랑합니다.[a]
  rationale: 본문의 짧고 반복적인 흥정 발화를 유지하면서, 한국어에서 자연스럽게 이해되는 평가 표현과 구매자라는 역할 명사를 사용했습니다. ‘그러나’와 ‘떠난 뒤에는’은 구매자가 앞에서는 물건을 헐뜯고 뒤에서는 자기 거래를 자랑하는 대비와 순서를 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:16Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 רַע רַע의 반복, 구매자, 떠난 뒤의 시간적 전환, 그리고 히트파엘 동사의 자기과시를 대체로 반영했습니다. 다만 본문의 ‘못하다, 못하다’는 한국어 직접 발화로는 부자연스럽고, ‘사는 이는’도 구매자를 가리키는 명사구로 다소 어색합니다.
  naturalness: ‘나쁘다, 나쁘다’라고 사는 이는 말합니다’보다 ‘나쁘다, 나쁘다’라고 구매자는 말합니다’가 현대 표준 한국어의 격언체와 상거래 장면에서 더 자연스럽습니다. ‘떠난 뒤에는’은 אָז가 표시하는 순차적 전환을 매끄럽게 드러냅니다.
  terminology: הַקּוֹנֶה는 ‘구매자’로 명확히 옮겼습니다. רַע는 문맥상 물건을 헐뜯는 평가이므로 ‘나쁘다’를 본문에 두고, ‘좋지 않다’와 ‘쓸모없다’ 등의 가능한 표현은 각주에 보존했습니다.
