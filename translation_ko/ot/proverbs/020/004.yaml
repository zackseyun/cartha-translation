  text: מֵ֭/חֹרֶף עָצֵ֣ל לֹא יַחֲרֹ֑שׁ ישאל בַּ/קָּצִ֣יר וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
  footnotes:
  - marker: a
    text: Or 'In winter the lazy man does not plow.' The Hebrew preposition may be taken temporally ('in winter') or causally ('because of winter').
    reason: lexical_alternative
  - marker: b
    text: Or 'he asks at harvest.' The Hebrew verb can mean 'ask' or, by implication here, 'seek/request' produce when harvest comes.
    reason: lexical_alternative
translation:
  language: ko
  text: 겨울 때문에 게으른 사람은 밭갈이를 하지 않습니다. 수확 때가 되면 그는 찾지만, 아무것도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵחֹרֶף
  english_pob_choice: Because of winter
  chosen_korean: 겨울 때문에
  alternatives_korean:
  - 겨울에
  - 겨울로 인해
  - 추위 때문에
  lexicon: HALOT
  rationale: 전치사 מִן의 원인을 나타내는 용법을 살려, 단순한 시점 표시보다 ‘겨울이 핑계/원인’이라는 뉘앙스를 반영했습니다.
- source_word: עָצֵל
  english_pob_choice: the lazy man
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 게으른 사람
  - 나태한 사람
  lexicon: HALOT
  rationale: 지혜 문학의 유형적 표현을 자연스러운 현대 한국어로 옮기되, 특정 개인보다 대표적 인물을 가리키는 뜻을 유지했습니다.
- source_word: לֹא יַחֲרֹשׁ
  english_pob_choice: does not plow
  chosen_korean: 밭갈이를 하지 않습니다
  alternatives_korean:
  - 갈지 않습니다
  - 쟁기질하지 않습니다
  - 경작하지 않습니다
  lexicon: HALOT
  rationale: חרשׁ의 구체적 농경 의미를 살려 ‘밭갈이’를 택했고, 잠언의 격언적 현재성을 위해 현재형을 썼습니다.
- source_word: ישאל
  english_pob_choice: he seeks
  chosen_korean: 그는 찾지만
  alternatives_korean:
  - 그는 묻지만
  - 그는 구하지만
  - 그는 찾습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘묻다’이지만 여기서는 수확 때 필요한 것을 얻으려는 뜻이므로, 결과를 찾는 동작을 드러내는 ‘찾다’로 옮겼습니다.
