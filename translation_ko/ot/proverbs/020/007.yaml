revisions:
- from: 의로운 사람은 자기의 성실함 가운데서 걸어갑니다. 그의 자녀들은 그 뒤를 따르며 복됩니다.[a][b]
  to: 의로운 사람은 자신의 온전함 가운데서 살아갑니다. 그의 뒤를 이을 자녀들에게 복이 있습니다.[a]
  rationale: 삶의 방식이라는 מִתְהַלֵּךְ의 비유적 의미는 ‘살아갑니다’로 자연스럽게 옮기고, תֻמּוֹ는 ‘온전함’으로 바로잡았습니다. 후반부는 자녀들이 그 의로운 사람을 모방한다는 뜻을 더하지 않도록 ‘그의 뒤를 이을’로 옮겼으며, אַשְׁרֵי의 선언적 복됨은 ‘복이 있습니다’로 표현했습니다. 기존 [a]는 번역 선택의 설명일 뿐 독자에게 필요한 본문 각주가 아니므로 제거하고, בָנָיו의 어휘 범위를 설명하는 각주 하나만 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:18Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그 뒤를 따르며’는 אַחֲרָיו를 그 의로운 사람의 행실을 본받는다는 뜻으로 구체화하여, 시간적·계보적 의미인 ‘그의 뒤에/그 뒤를 이을’을 벗어납니다. 또한 תֻמּוֹ는 여기서 윤리적 온전함·흠 없음에 가까우므로 ‘성실함’보다 ‘온전함’이 더 정확합니다.
  naturalness: ‘자신의 온전함 가운데서 살아갑니다’는 현대 한국어의 합쇼체로 자연스럽고, ‘그의 뒤를 이을 자녀들에게 복이 있습니다’는 히브리어의 축복 선언을 미래적 수동 표현인 ‘복됩니다’보다 자연스럽게 전달합니다.
  terminology: ‘의로운 사람’은 대표적 단수 צַדִּיק을 적절히 옮깁니다. ‘자녀들’은 בָנָיו의 일반적 후손 의미를 자연스럽게 반영하되, 문자적으로 ‘아들들’일 가능성은 각주로 밝혀 둡니다.
  issues:
