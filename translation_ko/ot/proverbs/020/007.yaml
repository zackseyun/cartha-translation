id: PRO.20.7
reference: Proverbs 20:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִתְהַלֵּ֣ךְ בְּ/תֻמּ֣/וֹ צַדִּ֑יק אַשְׁרֵ֖י בָנָ֣י/ו אַחֲרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
  footnotes:
  - marker: a
    text: Or 'happy are his children after him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons' can function generically for offspring; here rendered 'children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의로운 사람은 자신의 온전함 가운데서 살아갑니다. 그의 뒤를 이을 자녀들에게 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָנָיו는 문자적으로 ‘그의 아들들’이지만, 문맥에 따라 자녀 또는 후손 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  english_pob_choice: walks
  chosen_korean: 걸어갑니다
  alternatives_korean:
  - 삽니다
  - 행합니다
  - 행실을 합니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 반복·지속적 삶의 방식을 한국어에서도 ‘걸어가다’로 살려, 지혜문학의 비유를 유지했습니다.
- source_word: בְּתֻמּוֹ
  english_pob_choice: in his integrity
  chosen_korean: 자기의 성실함 가운데서
  alternatives_korean:
  - 자기의 온전함 가운데서
  - 자기의 무흠함 가운데서
  - 자기의 성실함으로
  lexicon: HALOT
  rationale: תֹּם/תֻּם의 핵심을 ‘성실함’으로 옮기되, 전치사 בְּ의 장소·영역 감각을 살려 ‘가운데서’로 표현했습니다.
- source_word: בָנָיו
  english_pob_choice: his children
  chosen_korean: 그의 자녀들
  alternatives_korean:
  - 그의 아들들
  - 그의 자손들
  lexicon: HALOT
  rationale: 히브리어 복수형이 일반적으로 후손을 가리킬 수 있으므로, 남성만이 아니라 자녀 전체를 자연스럽게 드러내는 ‘자녀들’로 옮겼습니다.
- source_word: אַחֲרָיו
  english_pob_choice: after him
  chosen_korean: 그 뒤를 따르며
  alternatives_korean:
  - 그 뒤에
  - 그를 따라
  lexicon: HALOT
  rationale: 직역의 ‘뒤에’보다 문맥상 후손이 그 사람의 삶을 잇는 뜻을 더 분명히 드러내는 표현으로 다듬었습니다.
theological_decisions:
- issue: 잠언의 축복 진술을 한국어에서 어떻게 살릴지
  chosen_reading: ‘복됩니다’로 마무리하여 אַשְׁרֵי의 복된 상태를 선언적으로 표현했습니다.
  alternative_readings:
  - ‘복되다’
  - ‘행복합니다’
  - ‘복이 있습니다’
  rationale: אַשְׁרֵי는 단순 감정보다 부러움을 동반한 복된 상태를 말하므로, ‘복됩니다’가 지혜문학의 선언적 톤을 가장 잘 살립니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 의로운 사람의 대표적 남성형을 한국어에서 어떻게 처리할지
  chosen_reading: ‘의로운 사람’으로 유지하되 후반부는 성중립적 가족어 ‘자녀들’을 사용했습니다.
  alternative_readings:
  - 의로운 자
  - 의로운 사람
  - 의로운 이
  rationale: 히브리어는 남성 단수형을 쓰지만 잠언의 대표적 일반 진술이므로, 본문 첫머리의 인물 표지는 자연스러운 ‘사람’으로 옮기고 의미 확장을 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
