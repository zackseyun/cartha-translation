  - severity: low
    issue: ‘자기의 성실함 가운데서’
    rationale: תֻמּוֹ의 중심 의미는 성품의 온전함, 완전성, 흠 없음입니다. ‘성실함’은 가능한 관련 의미이나 한국어에서는 근면함이나 충실성으로 더 좁게 들릴 수 있습니다.
  - severity: medium
    issue: ‘복됩니다’
    rationale: אַשְׁרֵי는 축복받은 상태를 선언하는 표현이며, ‘복됩니다’는 미래에 복을 받게 된다는 변화·수동의 뉘앙스를 낼 수 있습니다.
