  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
  footnotes:
  - marker: a
    text: Literally, 'in the pupil of darkness,' a Hebrew idiom for the deepest or blackest darkness.
    reason: cultural_note
  - marker: b
    text: Or 'his lamp will go out in utter darkness.' The image of the lamp likely symbolizes a person's life, well-being, or future.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지와 어머니를 저주하는 사람의 등불은 가장 깊은 어둠 속에서 꺼집니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 '어둠의 눈동자'입니다. 이는 가장 깊고 칠흑 같은 어둠을 뜻하는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 '그의 등불은 칠흑 같은 어둠 속에서 꺼집니다'로 옮길 수 있습니다. 등불의 이미지는 아마도 그 사람의 생명, 안녕, 또는 미래를 가리킵니다.
    reason: lexical_alternative
