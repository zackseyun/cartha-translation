  text: 아버지나 어머니를 저주하는 자의 등불은 깊은 어둠 속[a][b]에 꺼지리라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자 그대로 '어둠의 동공'이라는 뜻으로, 히브리어 관용구로서 가장 깊고 검은 어둠을 의미합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그의 등불이 완전히 어둠 속에 꺼지리라'는 뜻입니다. 등불의 이미지는 아마도 사람의 생명, 안녕, 또는 미래를 상징하는 것 같습니다.
