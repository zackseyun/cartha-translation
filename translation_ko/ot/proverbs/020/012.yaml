lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  english_pob_choice: the hearing ear
  chosen_korean: 듣는 귀
  alternatives_korean:
  - 듣는 귀 하나
  - 들을 수 있는 귀
  - 경청하는 귀
  lexicon: HALOT
  rationale: 히브리어 분사 שֹׁמַעַת의 관형적 기능을 살려 ‘듣는’으로 옮기고, 속담의 평행성을 위해 단수 명사 ‘귀’를 유지했습니다.
- source_word: עַיִן רֹאָה
  english_pob_choice: the seeing eye
  chosen_korean: 보는 눈
  alternatives_korean:
  - 보는 눈 하나
  - 볼 수 있는 눈
  - 살피는 눈
  lexicon: HALOT
  rationale: רֹאָה도 관형적 분사이므로 ‘보는’으로 옮겨 ‘듣는 귀’와 대구를 이루게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자적으로 신명기적 고유명사를 드러내기 위해 전통적 대체어 대신 ‘야훼’를 사용했습니다.
- source_word: גַם שְׁנֵיהֶם
  english_pob_choice: both of them
  chosen_korean: 둘 다
  alternatives_korean:
  - 두 사람 모두
  - 그 둘 모두
  - 둘 모두
  lexicon: HALOT
  rationale: גַם과 שְׁנֵיהֶם의 포괄적 강조를 한국어에서는 자연스럽게 ‘둘 다’로 압축해 살렸습니다.
theological_decisions:
- issue: 야훼의 보편적 창조 행위 진술
  chosen_reading: 야훼께서 듣는 능력과 보는 능력의 출처이시며, 그 둘을 모두 만드셨다고 분명히 말합니다.
  alternative_readings:
  - 야훼께서 문자적 신체기관인 귀와 눈을 만드셨다고만 읽는 것
  - 도덕적 통찰이나 영적 식견으로만 비유적으로 좁히는 것
  rationale: 지혜문학의 일반 진술로서, 본문은 감각기관 자체와 그 기능 모두를 야훼의 창조 행위로 돌립니다. 한국어도 그 직접성을 유지했습니다.
  doctrine_reference: 창조론 / 하나님의 주권
