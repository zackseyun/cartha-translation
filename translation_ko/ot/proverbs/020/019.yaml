source:
  edition: WLC
  text: גּֽוֹלֶה סּ֭וֹד הוֹלֵ֣ךְ רָכִ֑יל וּ/לְ/פֹתֶ֥ה שְׂ֝פָתָ֗י/ו לֹ֣א תִתְעָרָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
  footnotes:
  - marker: a
    text: Or, 'goes about gossiping.' The Hebrew רָכִיל can refer to one who spreads damaging reports or gossip.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'with one who opens his lips.' The expression refers to a person who talks too freely or too much.
    reason: lexical_alternative
translation:
  language: ko
  text: 비밀을 드러내는 자는 험담을 퍼뜨리며 돌아다닙니다[a]. 입을 함부로 여는 자와는 어울리지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָכִיל은 해로운 소문이나 험담을 퍼뜨리는 사람, 또는 남을 헐뜯는 말을 전하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 입술을 여는 자’입니다. 여기서는 말을 너무 쉽게 하거나 지나치게 많이 하는 사람을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  english_pob_choice: One who reveals secrets
  chosen_korean: 비밀을 드러내는 자
  alternatives_korean:
  - 비밀을 밝히는 자
  - 속사정을 누설하는 자
  lexicon: HALOT
  rationale: גלה + סוד는 감추어진 일을 밖으로 드러내는 뜻이므로, 한국어에서는 자연스럽고 경구적인 ‘비밀을 드러내는 자’로 옮겼습니다.
- source_word: הוֹלֵךְ רָכִיל
  english_pob_choice: goes about as a gossip
  chosen_korean: 수군거리는 자처럼 다닙니다
  alternatives_korean:
  - 헐뜯는 자처럼 다닙니다
  - 떠벌이는 자처럼 다닙니다
  lexicon: HALOT
  rationale: רָכִיל은 단순한 잡담보다 해로운 소문을 퍼뜨리는 사람을 가리키므로, 현대 한국어에서 그 뉘앙스를 살릴 수 있는 ‘수군거리는 자’로 표현했습니다.
- source_word: וּלְפֹתֶה שְׂפָתָיו
  english_pob_choice: one who opens his lips wide
  chosen_korean: 입을 함부로 여는 자
  alternatives_korean:
  - 입을 너무 쉽게 여는 자
  - 입이 가벼운 자
  lexicon: HALOT
  rationale: 직역하면 ‘그의 입술을 여는 자’이지만, 문맥상 말이 너무 쉽게 새어 나오는 사람을 가리키므로 한국어 관용에 맞게 ‘입을 함부로 여는 자’로 풀었습니다.
- source_word: לֹא תִתְעָרָב
  english_pob_choice: do not associate
  chosen_korean: 어울리지 마십시오
  alternatives_korean:
  - 섞이지 마십시오
  - 교제하지 마십시오
  lexicon: HALOT
  rationale: התערב는 ‘섞이다/관여하다/어울리다’의 뜻으로 쓰이므로, 잠언의 권면 톤에 맞는 간결한 금지형 ‘어울리지 마십시오’를 택했습니다.
