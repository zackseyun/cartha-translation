  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상처를 내는 매질은 악을 정화한다.’ 히브리어 동사는 닦아 내거나 씻어 내어 정결하게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로 ‘배의 방들.’ 이는 사람의 가장 깊은 내면을 가리키는 히브리어 표현입니다.
    reason: cultural_note
