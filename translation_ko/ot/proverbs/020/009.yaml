  text: מִֽי יֹ֭אמַר זִכִּ֣יתִי לִבִּ֑/י טָ֝הַ֗רְתִּי מֵ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/009.yaml
  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
  footnotes:
  - marker: a
    text: Or, 'Who says, “I have cleansed my heart; I have purified myself from my sin”?' The Hebrew verbs can be rendered more formally to emphasize self-cleansing language.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 말할 수 있겠습니까? "내 마음을 깨끗하게 하였습니다. 내가 내 죄에서 깨끗합니다"라고.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 "누가 말하겠습니까?"이며, 수사적 반문입니다.
    reason: source_note
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who can
  chosen_korean: 누가 말할 수 있겠습니까?
  alternatives_korean:
  - 누가
  - 누가 감히 말할 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어 의문대명사 מִי의 수사적 힘을 살려, 단순한 정보 질문이 아니라 실제로는 대답을 기대하는 반문으로 옮겼습니다. 영어 POB의 'Who can'에 맞춰 한국어에서도 가능성의 뉘앙스를 보완했습니다.
- source_word: זִכִּיתִי
  english_pob_choice: I have made ... pure
  chosen_korean: 내 마음을 깨끗하게 하였습니다
  alternatives_korean:
  - 내 마음을 정결하게 하였습니다
  - 내 마음을 깨끗하게 했습니다
  lexicon: HALOT
  rationale: פּיעל형 זכה의 사역적 뉘앙스—'깨끗하게 하다/정결하게 하다'—를 반영했습니다. '마음'을 대상으로 삼는 구조를 유지하고, 너무 심리화하지 않도록 직역적이되 자연스럽게 다듬었습니다.
- source_word: טָהַרְתִּי
  english_pob_choice: I am clean
  chosen_korean: 내가 내 죄에서 깨끗합니다
  alternatives_korean:
  - 내가 깨끗합니다
  - 내가 정결합니다
  lexicon: HALOT
  rationale: טהר의 결과 상태를 살려 '깨끗합니다'로 옮겼습니다. 병렬 구조상 첫 절의 행위 진술과 대응하는 상태 진술이므로, 문어체 한국어에서 자연스러운 종결로 처리했습니다.
- source_word: מֵחַטָּאתִי
  english_pob_choice: from my sin
  chosen_korean: 내 죄에서
  alternatives_korean:
  - 내 죄로부터
  - 내 허물에서
  lexicon: HALOT
  rationale: מִן의 분리 의미를 한국어 조사 '에서'로 전달했습니다. חטאת를 '죄'로 옮겨, 지혜문학이 말하는 도덕적 오염의 범주를 보존했습니다.
theological_decisions:
- issue: 반문이 전제하는 인간의 도덕적 무죄 주장
  chosen_reading: 이 절은 누구도 참으로 자기 마음의 순결과 죄로부터의 깨끗함을 주장할 수 없다는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 드문 도덕적 무결성을 묻는 일반적 질문
  - 단순한 자기성찰의 질문
  rationale: 두 병행구('내 마음을 깨끗하게 하였습니다' / '내가 ... 깨끗합니다')가 절대적 순결 주장을 이뤄, 반문은 사실상 '아무도 없다'를 기대합니다. 번역은 그 긴장을 풀지 않고 그대로 유지합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
