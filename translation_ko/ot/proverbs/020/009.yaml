  naturalness: 현 번역의 “내가 내 죄에서 깨끗합니다”는 주어와 소유어의 반복 때문에 다소 부자연스럽고, 인용문 뒤의 마침표 및 “라고”의 결합도 표준 문장부호상 매끄럽지 않습니다. “내 죄에서 정결합니다”로 간결하게 처리하면 현대 표준어의 격식 있는 문체에 더 잘 맞습니다.
