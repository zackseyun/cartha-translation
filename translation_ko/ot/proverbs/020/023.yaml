base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
  footnotes:
  - marker: a
    text: Literally, 'a stone and a stone,' an idiom for differing weights used dishonestly in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 서로 다른 저울추[a]는 야훼께 가증한 것이며, 속임수 저울은 좋지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘돌과 돌’이며, 상거래에서 서로 다른 저울추를 사용하여 속이는 일을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 역겨운 것
  lexicon: HALOT
  rationale: וה/תוֹעֵבָה는 도덕적·언약적 맥락에서 강한 혐오를 나타내므로, 한국어에서도 완곡하게 누그러뜨리지 않고 '가증한 것'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
