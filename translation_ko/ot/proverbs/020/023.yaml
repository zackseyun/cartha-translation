  text: תּוֹעֲבַ֣ת יְ֭הוָה אֶ֣בֶן וָ/אָ֑בֶן וּ/מֹאזְנֵ֖י מִרְמָ֣ה לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
  footnotes:
  - marker: a
    text: Literally, 'a stone and a stone,' an idiom for differing weights used dishonestly in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 불공정한 저울추는 야훼께 가증한 것이며, 속이는 저울은 좋지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '돌과 돌'이며, 상거래에서 서로 다른 추를 써 속이는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 역겨운 것
  lexicon: HALOT
  rationale: וה/תוֹעֵבָה는 도덕적·언약적 맥락에서 강한 혐오를 나타내므로, 한국어에서도 완곡하게 누그러뜨리지 않고 '가증한 것'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기는 전통적 대체어보다 고유명사 음역인 '야훼'를 사용하여 POB의 원문 지향을 따랐습니다.
- source_word: אֶבֶן וָאָבֶן
  english_pob_choice: unequal weights
  chosen_korean: 불공정한 저울추
  alternatives_korean:
  - 저울추와 저울추
  - 서로 다른 저울추
  - 이중 저울추
  lexicon: HALOT
  rationale: 직역하면 '돌과 돌'이지만, 상거래에서 서로 다른 추를 쓰는 관용구이므로 의미를 풀어 자연스럽게 '불공정한 저울추'로 옮겼습니다.
- source_word: וּמֹאזְנֵי מִרְמָה
  english_pob_choice: and deceitful scales
  chosen_korean: 속이는 저울
  alternatives_korean:
  - 속임수의 저울
  - 사기 저울
  - 기만의 저울
  lexicon: HALOT
  rationale: מֹאזְנֵי는 저울/천칭이며 מִרְמָה는 속임수이므로, 관형적 관계를 살려 한국어 자연성도 있는 '속이는 저울'로 번역했습니다.
