  - 잠자기
  lexicon: HALOT
  rationale: 명사적 이미지가 자연스럽게 들리도록 현대 한국어의 간결한 표현인 '잠'을 택했습니다.
- source_word: תִּוָּרֵשׁ
  english_pob_choice: you become poor
  chosen_korean: 가난해질까 합니다
  alternatives_korean:
  - 가난하게 될까 합니다
  - 빈곤해질까 합니다
  - 재산을 잃게 될까 합니다
  lexicon: HALOT
  rationale: 동사의 결과를 한국어의 자연스러운 경고 표현으로 옮겼고, 잠에 대한 사랑이 궁극적으로 가난으로 이어진다는 의미를 살렸습니다.
- source_word: פְּקַח עֵינֶיךָ
  english_pob_choice: open your eyes
  chosen_korean: 눈을 뜨십시오
