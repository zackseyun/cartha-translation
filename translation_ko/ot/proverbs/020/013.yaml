  lexicon: HALOT
  rationale: 직역의 '여십시오'도 가능하지만, 지혜문학의 실천적 촉구를 살리는 관용적 표현으로 '눈을 뜨십시오'를 택했습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 빵/떡
  - 음식
  - 양식
  lexicon: HALOT
  rationale: 히브리어의 기본 이미지는 '빵'이며, 한국어에서도 일상적이고 구체적인 생계의 상징으로 자연스럽습니다.
theological_decisions:
- issue: 속담의 결과 진술을 한국어에서 어떻게 처리할지
  chosen_reading: '''눈을 뜨십시오. 그러면 빵으로 배부르게 될 것입니다''로 결과를 분명히 제시했습니다.'
  alternative_readings:
  - '''눈을 뜨십시오. 빵으로 배부르실 것입니다'''
  - '''눈을 뜨십시오. 빵을 충분히 먹게 될 것입니다'''
  rationale: 히브리어의 병렬적인 명령형 구조를 한국어에서 인과 관계가 드러나도록 옮겨, 지혜문학의 경고와 약속을 분명하게 전달했습니다.
  doctrine_reference: 잠언의 지혜 교훈과 행위-결과의 윤리적 연관성
