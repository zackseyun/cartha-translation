source:
  edition: WLC
  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
  footnotes:
  - marker: a
    text: Or 'you come to poverty' / 'you be impoverished.' The Hebrew verb can carry the sense of becoming dispossessed or poor; here it refers to falling into poverty through laziness.
    reason: lexical_alternative
  - marker: b
    text: Literally 'open your eyes; be satisfied with bread.' The final clause is rendered as a result in English to make the proverb's sense clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 잠을 사랑하지 마십시오[a]. 그렇지 않으면 가난해질 것입니다. 눈을 뜨십시오[b]. 그러면 빵으로 배부르게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘잠을 사랑하지 말라’입니다. 여기서 ‘잠을 사랑하다’는 잠에 지나치게 빠지는 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘눈을 뜨라; 빵으로 배부르라’입니다. 마지막 절은 히브리어에서 명령형이며, 한국어에서는 앞선 명령의 결과를 분명히 하기 위해 결과문으로 옮겼습니다.
    reason: lexical_alternative
