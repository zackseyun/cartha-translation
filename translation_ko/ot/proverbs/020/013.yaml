  naturalness: ‘그러다 가난해질까 합니다’는 이 문맥에서 자연스러운 합쇼체 문장이 아닙니다. ‘그렇지 않으면 가난해질 것입니다’가 현대 표준어로 자연스럽고 경고 관계도 명확히 드러냅니다. ‘빵으로 배부르게 될 것입니다’는 이해 가능하므로 유지할 수 있습니다.
  terminology: ‘잠을 사랑하다’, ‘눈을 뜨다’, ‘빵’은 원문의 구체적 표현을 잘 보존합니다. 각주 a의 현행 설명은 ‘잠’에 붙은 표지와 맞지 않으며, 히브리어 동사의 의미도 부정확하게 설명하므로 수정이 필요합니다.
