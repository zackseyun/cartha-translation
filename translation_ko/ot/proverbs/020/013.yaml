language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
  footnotes:
  - marker: a
    text: Or 'you come to poverty' / 'you be impoverished.' The Hebrew verb can carry the sense of becoming dispossessed or poor; here it refers to falling into poverty through laziness.
    reason: lexical_alternative
  - marker: b
    text: Literally 'open your eyes; be satisfied with bread.' The final clause is rendered as a result in English to make the proverb's sense clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 잠을 사랑하지 마십시오[a]. 그러다 가난해질까 합니다. 눈을 뜨십시오[b]. 그러면 빵으로 배부르게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 '잠을 좋아하다'를 넘어, 게으름으로 인한 빈곤으로 이어지는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '눈을 뜨라; 빵으로 배부르게 되리라'입니다. 한국어에서는 결과를 분명히 드러내기 위해 후반 절을 결과문으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֶּאֱהַב
  english_pob_choice: Do not love
  chosen_korean: 사랑하지 마십시오
  alternatives_korean:
