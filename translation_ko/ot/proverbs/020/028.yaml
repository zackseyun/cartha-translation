base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/028.yaml
  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
  footnotes:
  - marker: a
    text: Or 'truth' for אֱמֶת; in this context the word likely emphasizes reliability or faithfulness alongside steadfast love.
    reason: lexical_alternative
  - marker: b
    text: Or 'guard' or 'keep' for 'preserve.'
    reason: lexical_alternative
  - marker: c
    text: The repeated 'steadfast love' translates חֶסֶד in both clauses, preserving the Hebrew repetition.
    reason: lexical_alternative
translation:
  language: ko
  text: 인애와 진실은 왕을 지키며, 인애로 그의 보좌가 굳게 섭니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진실’은 여기서 추상적 진리라기보다 인애와 짝을 이루는 신실성·신뢰성을 가리키는 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지키며’는 ‘보호하다/간수하다’의 의미를 함께 담아, חֶסֶד과 אֱמֶת이 왕을 안전하게 보존하는 기능을 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인애’를 앞·뒤 절에 반복해 히브리어의 반복을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 친절보다 언약적 충성과 호의가 함께 있는 말이어서, 지혜문맥에서는 관계적 신실함을 담는 ‘인애’가 가장 간결하게 대응합니다.
- source_word: אֱמֶת
  english_pob_choice: faithfulness
  chosen_korean: 진실
  alternatives_korean:
  - 신실함
  - 참됨
  - 성실
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘진리’보다 인애와 짝을 이루는 신뢰성·일관성을 가리키므로, 한국어에서는 문맥상 ‘진실’이 그 품질을 무리 없이 살립니다.
- source_word: יִצְּרוּ
  english_pob_choice: preserve
  chosen_korean: 지키며
  alternatives_korean:
  - 보존하며
  - 보호하며
  - 간직하며
  lexicon: HALOT
  rationale: נצר는 지키다/보호하다의 뜻이 핵심이므로, 왕을 안정적으로 보호하는 기능을 드러내는 ‘지키며’로 옮겼습니다.
- source_word: סָעַד בַּחֶסֶד
  english_pob_choice: is upheld by steadfast love
  chosen_korean: 인애로 … 굳게 섭니다
  alternatives_korean:
  - 인애로 … 받쳐집니다
  - 인애로 … 유지됩니다
  - 인애로 … 지탱됩니다
  lexicon: HALOT
  rationale: סעד는 ‘받치다, 지탱하다’의 그림을 갖기 때문에 수동적인 ‘굳게 섭니다’로 풀어, 보좌가 인애에 의해 안정적으로 떠받쳐지는 이미지를 살렸습니다.
- source_word: כִּסְאוֹ
  english_pob_choice: his throne
  chosen_korean: 그의 보좌
  alternatives_korean:
  - 그의 왕좌
  - 그의 왕위
  - 그의 옥좌
  lexicon: HALOT
  rationale: 직역하면 ‘왕좌’이지만, 한국어 성경에서 권위를 가진 왕권의 상징으로는 ‘보좌’가 자연스럽고 문맥의 위엄도 유지합니다.
