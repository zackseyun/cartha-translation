language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
  footnotes:
  - marker: a
    text: Or 'I will pay back evil' or 'I will repay wrong.'
    reason: lexical_alternative
  - marker: b
    text: '''Wait for'' also carries the sense of hoping expectantly in the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he will deliver you' or 'he will vindicate you.'
    reason: lexical_alternative
translation:
  language: ko
  text: “악을 갚겠다고 말하지 마십시오.” 야훼를 기다리십시오. 그분이 당신을 구하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악을 갚겠다’는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기다리십시오’에는 기대와 신뢰를 품고 기다린다는 뜻이 함께 담길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘구하십니다’는 여기서 ‘건지십니다’ 또는 ‘구원하십니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: “악을 갚겠다고 말하지 마십시오.”
  alternatives_korean:
  - “악을 갚겠다고 하지 마십시오.”
  - “악을 되갚겠다고 말하지 마십시오.”
  lexicon: HALOT
  rationale: אַל + תֹּאמַר는 금지 표현으로, 직접 인용문 형태를 살려 ‘말하지 마십시오’로 옮겼습니다. ‘갚다’는 뒤의 אֲשַׁלְּמָה와 연결해 보복의 발화를 자연스럽게 드러냅니다.
- source_word: אֲשַׁלְּמָה רָע
  english_pob_choice: I will repay evil
  chosen_korean: “악을 갚겠다”
  alternatives_korean:
  - “악을 되갚겠다”
  - “악을 보복하겠다”
  lexicon: HALOT
  rationale: שׁלם의 사역형은 여기서 ‘되갚다/보복하다’의 뜻이므로, 문자적 균형을 살리면서도 한국어에서 자연스러운 ‘악을 갚겠다’로 옮겼습니다. ‘악’은 단순한 피해보다 도덕적 악을 유지합니다.
- source_word: קַוֵּה לַיהוָה
  english_pob_choice: wait for Yahweh
  chosen_korean: 야훼를 기다리십시오
  alternatives_korean:
  - 야훼를 바라보십시오
  - 야훼께 희망을 두십시오
  lexicon: HALOT
  rationale: קוה는 단순 대기가 아니라 기대를 동반한 기다림이므로 기본 본문은 ‘기다리십시오’로 두되, 시적·지혜문학적 어감을 살렸습니다. יְהוָה는 본문 차원의 고유명으로 ‘야훼’로 옮겼습니다.
- source_word: וְיֹשַׁע לָךְ
  english_pob_choice: and he will save you
  chosen_korean: 그분이 당신을 구하십니다
  alternatives_korean:
  - 그분이 당신을 구원하십니다
  - 그분이 당신을 건지십니다
  lexicon: HALOT
  rationale: ישע의 핵심은 구출/구원/건짐이므로, 여기서는 결과를 좁히지 않는 ‘구하십니다’를 선택했습니다. 현재형 직설로 된 히브리어 예언적 확실성을 한국어에서도 단정적으로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 고유한 언약 이름을 드러내는 ‘야훼’를 본문에 사용했습니다. 시적 지혜문맥에서 호칭의 신학적 긴장을 유지하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: קוה의 의미 범위
  chosen_reading: 기다리십시오
  alternative_readings:
  - 희망을 두십시오
  - 기대하며 기다리십시오
  rationale: 이 동사는 단순 시간 지연이 아니라 신뢰를 동반한 기대를 포함할 수 있습니다. 본문에는 기본 의미를 두고, 그 내포는 문맥이 자연히 드러내도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
