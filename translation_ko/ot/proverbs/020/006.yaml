  naturalness: ‘자기 충성’은 현대 표준 한국어에서 어색하게 명사화된 표현입니다. ‘자기의 충성심’으로 하면 소유 관계와 덕목의 뜻이 분명해집니다. ‘찾아낼 수 있겠습니까?’도 가능하지만, 원문의 단순한 ‘찾다’에는 ‘찾을 수 있겠습니까?’가 더 직접적입니다.
