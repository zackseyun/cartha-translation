translation:
  language: ko
  text: 속임수로 얻은 빵은 사람에게 달콤하지만, 그 뒤에는 그의 입이 자갈로 가득 찹니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거짓의 빵’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 입은 자갈로 가득 차게 될 것입니다’.
    reason: lexical_alternative
