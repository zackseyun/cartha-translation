  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
  footnotes:
  - marker: a
    text: Literally, 'bread of falsehood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his mouth will be filled with gravel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 속임수로 얻은 빵[a]은 사람에게 달콤하지만, 그 뒤에는 그의 입이 자갈로 가득 찹니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거짓의 빵’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 입은 자갈로 가득 차게 될 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  english_pob_choice: is sweet
  chosen_korean: 달콤하지만
  alternatives_korean:
  - 맛있지만
  - 즐겁지만
  - 기분 좋지만
  lexicon: HALOT
  rationale: 음식 비유의 반어적 대비를 살리기 위해 감각적으로 자연스러운 ‘달콤하다’를 선택했습니다.
- source_word: לָאִישׁ
  english_pob_choice: to a man
  chosen_korean: 사람에게
  alternatives_korean:
  - 한 남자에게
  - 한 사람에게
  lexicon: HALOT
  rationale: 히브리어의 대표 단수 남성형을 한국어에서는 성별을 과도하게 부각하지 않는 일반화 표현으로 옮겼습니다.
- source_word: לֶחֶם שָׁקֶר
  english_pob_choice: bread of deceit
  chosen_korean: 속임수로 얻은 빵
  alternatives_korean:
  - 거짓의 빵
  - 속임수의 빵
  - 거짓으로 얻은 빵
  lexicon: HALOT
  rationale: 직역형 ‘거짓의 빵’보다 한국어에서 의미가 더 분명하도록, 빵이 속임수와 결부된 결과임을 드러냈습니다.
- source_word: חָצָץ
  english_pob_choice: gravel
  chosen_korean: 자갈
  alternatives_korean:
  - 조약돌
  - 모래자갈
  - 자잘한 돌
  lexicon: HALOT
  rationale: 입 안에 들어오는 불쾌하고 거친 감각을 가장 직접적으로 전달하는 기본어로 ‘자갈’을 택했습니다.
