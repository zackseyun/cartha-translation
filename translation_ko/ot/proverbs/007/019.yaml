  naturalness: ‘그 남자가 자기 집에 없고, 멀리 여행을 떠났기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 앞 절의 인용문 안에서 이유를 제시하는 말로도 매끄럽습니다. ‘자기 집’은 בְּבֵיתוֹ의 소유 관계를 자연스럽게 드러냅니다.
