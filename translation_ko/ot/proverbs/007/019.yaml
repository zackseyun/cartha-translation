  text: 그 남자가 자기 집에 없고[a], 멀리 여행을 떠났기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 남자가 그의 집에 없다’입니다. 여기의 ‘그 남자’는 문맥상 남편을 가리키는 간접 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …이기 때문입니다
  - 그 이유는 …
  lexicon: HALOT
  rationale: 앞뒤 문맥에서 유혹하는 여인의 확신을 뒷받침하는 이유를 제시하므로, 한국어에서는 자연스러운 인과 표현인 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: אֵין הָאִישׁ בְּבֵיתוֹ
  english_pob_choice: the man is not at his house
  chosen_korean: 그 남자가 집에 없고
  alternatives_korean:
  - 그 남자가 자기 집에 없고
  - 그 남자가 집에 있지 않고
  lexicon: HALOT
  rationale: 히브리어는 ‘그 남자’와 ‘그의 집’을 직접적으로 말하면서 부재를 표현하므로, 본문을 따라 ‘집에 없고’로 옮기되 possessive 뉘앙스를 과도하게 풀지 않았습니다.
- source_word: הָלַךְ בְּדֶרֶךְ מֵרָחוֹק
  english_pob_choice: he has gone on a journey far away
  chosen_korean: 멀리 여행을 떠났기
  alternatives_korean:
  - 먼 길을 떠났기
  - 멀리 떠나 있었기
  lexicon: HALOT
  rationale: ‘길/דרך’는 여기서 이동 경로가 아니라 여행의 관용적 표현이므로 ‘여행을 떠나다’로 자연스럽게 풀고, ‘from afar’의 거리감을 ‘멀리’로 반영했습니다.
theological_decisions:
- issue: 잠언 7:19의 화자 말투와 연결 방식
  chosen_reading: 직접 인용 형식으로 번역하지 않고, 문맥상 이유를 설명하는 서술문으로 처리했습니다.
  alternative_readings:
  - “그 남자가 집에 없습니다…” 식의 직접 화법
  - “그의 집에 없습니다…” 식의 더 구어적인 표현
  rationale: 이 절은 유혹의 말 가운데 상대를 안심시키는 근거를 제시하는 구절이므로, 한국어에서는 문맥 연결이 드러나도록 서술형으로 옮기는 것이 원문 효과를 더 잘 살립니다.
  doctrine_reference: 문학적 장르와 담화 기능에 따른 번역 선택
