id: PRO.7.14
reference: Proverbs 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings.' The Hebrew refers to peace/well-being offerings, from which meat could be eaten after the sacrifice.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 화목제물을 드려야 할 의무가 있었는데, 오늘 내가 내 서원을 이행했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화제물’. 히브리어는 화목과 안녕을 위한 제사 제물을 가리키며, 제사 뒤 그 고기를 먹을 수 있었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 화목제(희생)
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의적 맥락에서 평안/화목을 위한 희생제를 가리키므로, 한국어로도 그 성격을 살린 ‘화목제물’이 가장 직접적입니다.
- source_word: עָלַי
  english_pob_choice: were due from me
  chosen_korean: 내게 있었습니다
  alternatives_korean:
  - 내게 있었습니다
  - 내 위에 있었습니다
  - 내게서 나와야 했습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 위에’이지만, 여기서는 제물이 자신에게 딸린 상태/가용성을 나타내므로 자연스러운 한국어로 ‘내게 있었습니다’가 문맥을 가장 잘 전달합니다.
- source_word: שִׁלַּמְתִּי נְדָרַי
  english_pob_choice: I have paid my vows
  chosen_korean: 내 서원을 갚았습니다
  alternatives_korean:
  - 내 서원을 이행했습니다
  - 내 서원들을 갚았습니다
  lexicon: HALOT
  rationale: שׁלם의 피엘은 서원과 관련해 ‘갚다, 이행하다’의 뜻이므로, 완료된 이행을 분명히 드러내는 ‘갚았습니다’가 적절합니다.
theological_decisions:
- issue: 여인이 사용하는 제의적 언어의 긴장 보존
  chosen_reading: 외식적으로 경건한 분위기를 띠는 제의 언어를 그대로 살려, 유혹 장면의 의도적 위장성을 약화시키지 않았습니다.
  alternative_readings:
  - 단순히 ‘먹을 것이 있습니다’처럼 일반화함
  - 종교적 배경을 생략함
  rationale: 본문은 합법적인 제사와 서원 이행의 언어를 악용하는 장면이므로, 그 종교적 외피를 유지해야 독자가 본문의 긴장을 이해할 수 있습니다.
  doctrine_reference: Translation philosophy §3, §6
