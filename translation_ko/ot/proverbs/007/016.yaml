  text: I have spread my couch with coverings[a], with colored linens of Egypt.
  footnotes:
  - marker: a
    text: Or 'with carved work, with linen from Egypt.' The Hebrew terms for the patterned coverings and the Egyptian material are rare and may refer more specifically to decorated or embroidered textiles.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이부자리를 덮개들로, 이집트의 무늬 있는 리넨으로 깔아 두었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새긴 무늬의 천으로, 이집트산 리넨으로’. 히브리어의 직물 표현은 희귀하여, 장식된 천이나 수놓은 직물을 가리킬 수 있습니다.
    reason: lexical_alternative
