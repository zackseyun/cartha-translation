  source_fidelity: ‘이제야’는 ‘바로 지금에야/겨우 이제’라는 제한·지연의 뉘앙스를 더하므로, 단순한 전환 표현인 וְעַתָּה에 맞지 않습니다. ‘이제’가 원문의 시간적·담화적 전환을 충실히 옮깁니다. בָנִים의 남성 복수 호칭은 ‘아들들아’로 보존할 수 있으며, 두 명령과 ‘내 입의 말’이라는 표현도 유지됩니다.
  naturalness: ‘내 입의 말들’은 한국어에서 부자연스럽습니다. 복수형을 기계적으로 드러내기보다 ‘내 입의 말’로 옮기는 것이 자연스럽고, 원문의 집합적 복수 표현과 시적 어조를 충분히 반영합니다. 두 번째 절은 ‘또’로 연결하여 וְ의 연속을 자연스럽게 드러냈습니다.
  terminology: ‘아들들아’는 지혜 문헌의 교육적 호칭으로 적절하며, ‘말씀’처럼 불필요하게 종교적 존칭을 덧붙이지 않은 점도 적절합니다. 각주에서는 영어 ‘sons’ 대신 한국어 본문어와 히브리어의 남성 복수형을 직접 설명해야 합니다.
