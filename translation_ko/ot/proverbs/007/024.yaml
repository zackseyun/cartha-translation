base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
  footnotes:
  - marker: a
    text: Or 'children.' The Hebrew has 'sons,' a masculine plural form used in wisdom instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제야, 아들들아, 내 말을 들으십시오. 그리고 내 입의 말들에 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형인 “sons”를 사용합니다. 지혜 훈계에서 대표적 청중을 부르는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제야
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 전환을 표시하는 접속사와 시간 부사를 함께 살려, 경고의 흐름을 이어 가는 화용적 느낌을 간결하게 전했습니다.
- source_word: בָנִים
  english_pob_choice: sons
  chosen_korean: 아들들아
  alternatives_korean:
  - 자녀들아
  - 얘들아
  lexicon: HALOT
  rationale: 히브리어 남성 복수 호격을 그대로 살려 지혜 교육의 대표적 남성 표지를 유지했습니다. 한국어에서는 호격형으로 자연스럽게 옮겼습니다.
- source_word: שִׁמְעוּ לִי
  english_pob_choice: listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내게 귀를 기울이십시오
  - 나를 들으십시오
  lexicon: HALOT
  rationale: לִי가 단순한 청취가 아니라 화자에게 향한 주의를 요구하므로, 자연스러운 합쇼체 명령으로 옮겼습니다.
- source_word: וְהַקְשִׁיבוּ
  english_pob_choice: pay attention
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 주의하십시오
  - 집중하십시오
  lexicon: HALOT
  rationale: קשׁב의 강조된 주의 촉구를 한국어 관용구로 살려, 첫 명령과 중복되더라도 강조를 유지했습니다.
- source_word: לְאִמְרֵי פִי
  english_pob_choice: the words of my mouth
  chosen_korean: 내 입의 말들
  alternatives_korean:
  - 내 입의 말씀
  - 내가 하는 말들
  lexicon: HALOT
  rationale: 직역적 이미지인 '입의 말들'을 유지해 시적 평행을 살렸습니다. '말씀'은 너무 격조 높은 종교어로 들릴 수 있어 피했습니다.
theological_decisions:
- issue: 지혜 훈계에서의 남성 복수 호칭 유지
  chosen_reading: 아들들아
  alternative_readings:
  - 자녀들아
  rationale: 본문의 남성 복수형을 중화하지 않고 보존해, 지혜 교훈의 수신자 지시를 소스에 가깝게 드러냈습니다. 대표적 호칭으로 읽을 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
