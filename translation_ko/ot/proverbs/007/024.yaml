    text: Or 'children.' The Hebrew has 'sons,' a masculine plural form used in wisdom instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 아들들아, 내 말을 들으십시오. 또 내 입의 말에 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형 ‘아들들’을 사용합니다. 지혜 훈계에서 대표적인 청중을 부르는 표현입니다.
    reason: lexical_alternative
