  alternative_readings:
  - 지혜를 단순 개념으로 완화하는 번역
  - 명철을 단순히 ‘이해’로 평면화하는 번역
  rationale: 본문은 추상적 덕목을 인격적으로 부르도록 권하며, 그 수사적 효과가 잠언 7장의 경고 구조와 연결되므로 은유를 약화하지 않는 것이 중요합니다.
  doctrine_reference: 잠언의 지혜 문학에서의 의인화와 관계적 충고
