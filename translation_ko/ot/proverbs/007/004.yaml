translation:
  language: ko
  text: 지혜에게 말하십시오. “당신은 내 누이입니다.” 그리고 명철을 당신의 가까운 벗이라고 부르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מוֹדָע는 ‘가까운 벗’ 외에도 ‘친척’, ‘아는 사람’ 등으로도 옮길 수 있습니다. 문맥에 따라 가까운 관계를 가리키는 폭넓은 친족/친밀 관계어입니다.
    reason: lexical_alternative
