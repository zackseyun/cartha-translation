id: PRO.7.26
reference: Proverbs 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי רַבִּ֣ים חֲלָלִ֣ים הִפִּ֑ילָה וַ֝/עֲצֻמִ֗ים כָּל הֲרֻגֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
  footnotes:
  - marker: a
    text: Or 'many are the slain she has brought down'; the first noun may also be rendered 'slain' rather than 'wounded,' but 'wounded' is retained in the main text to preserve the intensification with the next line, 'all her slain are mighty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그 여인이 많은 이들을[a] 쓰러뜨렸고, 그 여인에게 죽임당한 자들은 모두 강한 자들이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲלָלִים은 ‘죽임당한 자들’, ‘쓰러진 자들’ 또는 문맥에 따라 ‘상처 입은 자들’로도 옮길 수 있습니다. 여기서는 뒤 행의 ‘그 여인에게 죽임당한 자들’과의 시적 병행을 살리면서도 그 의미 범위를 단정하지 않기 위해 ‘많은 이들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -습니다 / 서술 연결 없이 바로 전개
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 여기서는 앞 구절의 경고를 뒷받침하는 설명을 이어 주는 문맥이지만, 한국어에서는 원인 접속사를 억지로 붙이기보다 앞뒤 절을 자연스럽게 병렬해도 설명 관계가 유지됩니다.
- source_word: חֲלָלִים
  english_pob_choice: wounded
  chosen_korean: 상처 입은 자
  alternatives_korean:
  - 죽임당한 자
  - 살해된 자
  lexicon: HALOT
  rationale: 영어 본문이 첫 항의 강도를 살리기 위해 'wounded'를 택한 점을 따라, 한국어도 '죽임당한 자'보다 덜 완전히 종결된 이미지를 주는 '상처 입은 자'로 옮겨 뒤의 '그녀의 죽임당한 자들'과 대구를 살렸습니다.
- source_word: הִפִּילָה
  english_pob_choice: has cast down
  chosen_korean: 쓰러뜨렸고
  alternatives_korean:
  - 넘어뜨렸고
  - 끌어내렸고
  lexicon: HALOT
  rationale: הִפִיל의 사역적 의미인 '넘어뜨리다/쓰러뜨리다'를 살리되, 시적 문맥에서 가장 자연스럽고 힘 있는 표현으로 '쓰러뜨렸고'를 택했습니다.
- source_word: וַעֲצֻמִים
  english_pob_choice: mighty
  chosen_korean: 강한 자들
  alternatives_korean:
  - 용사들
  - 유력한 자들
  lexicon: HALOT
  rationale: '''강한 자들''은 כוח의 상태를 직접 드러내며, 다음 절의 심판적 반전을 강조하는 잠언체 표현에 잘 맞습니다.'
- source_word: הֲרֻגֶיהָ
  english_pob_choice: her slain
  chosen_korean: 그녀의 죽임당한 자들
  alternatives_korean:
  - 그녀의 살해된 자들
  - 그녀가 죽인 자들
  lexicon: HALOT
  rationale: 소유격 3인칭 여성 단수의 관계를 분명히 하면서, 수동 분사형의 결과 상태를 한국어로 가장 직접적으로 보여 주는 표현을 선택했습니다.
theological_decisions:
- issue: 이 구절의 시적 평행을 한국어에서 어떻게 보존할지
  chosen_reading: '''상처 입은 자''와 ''죽임당한 자들''을 구분해 번역하여 첫 행의 점층성과 둘째 행의 결정적 종결을 함께 드러냈습니다.'
  alternative_readings:
  - 두 절 모두 '죽임당한 자들'로 통일한다
  - 두 절 모두 '상처 입은 자들'로 통일한다
  rationale: 원문과 영어 POB가 모두 같은 단어를 단순 반복하지 않고 시적 긴장을 유지하므로, 한국어도 의미 차이를 두어 병렬의 효과를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 평행법과 수사적 점층의 보존
