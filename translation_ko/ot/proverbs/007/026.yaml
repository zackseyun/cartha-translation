  naturalness: 초안의 ‘많은 상처 입은 자를’은 수 일치와 문체 면에서 다소 부자연스럽고, ‘그녀의 죽임당한 자들’도 한국어에서는 소유 관계가 다소 경직되게 들립니다. ‘그 여인에게 죽임당한 자들’이 수동 관계를 분명하고 자연스럽게 나타냅니다.
