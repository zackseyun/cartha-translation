  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
  footnotes:
  - marker: a
    text: Or 'the apple of your eye.' The Hebrew idiom refers to the pupil, expressing something to be guarded with utmost care.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 명령들을 지키고 살아라[a], 내 가르침을 네 눈동자처럼 지켜라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 눈의 눈동자처럼’. 이 히브리어 관용구는 동공을 가리키며, 가장 소중히 보호해야 할 대상을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  english_pob_choice: Keep
  chosen_korean: 지키라
  alternatives_korean:
  - 간직하라
  - 보존하라
  - 지켜라
  lexicon: HALOT
  rationale: מִצְוֺתַי와 함께 쓰인 명령형 שׁמר는 단순한 보유가 아니라 주의 깊게 지키는 뜻을 담으므로, 현대 한국어에서는 ‘지키라’가 가장 자연스럽고 직접적입니다.
- source_word: מִצְוֺתַי
  english_pob_choice: my commandments
  chosen_korean: 내 명령들
  alternatives_korean:
  - 내 계명들
  - 내 명령
  lexicon: HALOT
  rationale: 지혜 문맥에서 מִצְוָה는 언약적 율례보다 넓게 ‘명령’의 뜻을 가지므로, 전통적 교회어 ‘계명’보다 직설적인 ‘명령들’이 원문 긴장을 잘 살립니다.
- source_word: וְתוֹרָתִי
  english_pob_choice: and my instruction
  chosen_korean: 내 가르침
  alternatives_korean:
  - 내 율법
  - 내 교훈
  lexicon: HALOT
  rationale: 잠언에서 תּוֹרָה는 모세오경의 율법이라기보다 지혜 교사의 교육적 가르침이므로, ‘가르침’이 POB의 ‘instruction’을 가장 자연스럽게 옮깁니다.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  english_pob_choice: as the pupil of your eye
  chosen_korean: 네 눈동자처럼
  alternatives_korean:
  - 네 눈의 동공처럼
  - 네 눈의 눈동자처럼
  lexicon: HALOT
  rationale: אִישׁוֹן은 문자적으로 눈의 작은 중심, 곧 동공/눈동자를 가리키며 매우 귀하게 지켜야 할 대상을 뜻하는 관용구이므로, 현대 한국어의 익숙한 표현인 ‘눈동자처럼’으로 옮겼습니다.
theological_decisions:
- issue: 잠언의 תּוֹרָה를 어떻게 이해할 것인지
  chosen_reading: ‘내 가르침’으로 번역해 지혜 교사의 훈계로 읽히게 했습니다.
  alternative_readings:
  - ‘내 율법’으로 번역하는 해석
  - ‘내 교훈’으로 번역하는 해석
  rationale: 이 절의 화자는 지혜 문맥에서 보호해야 할 삶의 지침을 말하므로, 좁은 의미의 율법보다 교육적·권면적 성격이 드러나는 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms, or documented exception.'
