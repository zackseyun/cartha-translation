  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
  footnotes:
  - marker: a
    text: Or 'Her house is the ways of Sheol'; the Hebrew uses a plural form ('ways/paths'), which may be understood collectively in English as 'the way.'
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집은 스올로 가는 길이며, 죽음의 방들로 내려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 히브리어 복수형 ‘ways/paths’를 집합적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스올’은 죽은 자의 영역을 가리키며, 달리 ‘무덤’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  english_pob_choice: the way
  chosen_korean: 길
  alternatives_korean:
  - 길들
  - 길들(복수)
  - 방향
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘ways/paths’의 집합적 의미를 한국어에서는 자연스러운 단수 ‘길’로 옮겨, 목적지로 이어지는 경로라는 비유를 살렸습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자의 세계
  lexicon: HALOT
  rationale: ‘무덤’으로 완화하지 않고 음역 ‘스올’을 유지해, 히브리어가 가리키는 죽은 자의 영역이라는 개념을 보존했습니다.
- source_word: בֵּיתָהּ
  english_pob_choice: Her house
  chosen_korean: 그 집
  alternatives_korean:
  - 그녀의 집
  - 그 가정
  lexicon: HALOT
  rationale: 문맥상 음녀의 집을 가리키므로 직역적이면서도 한국어에서 자연스러운 ‘그 집’으로 처리했습니다.
- source_word: חַדְרֵי
  english_pob_choice: the chambers
  chosen_korean: 방들
  alternatives_korean:
  - 방들
  - 안방들
  - 내실들
  lexicon: HALOT
  rationale: ‘chambers’의 내부 공간 이미지를 살리되, 시적이지만 과도하게 고풍스러운 표현을 피하기 위해 ‘방들’로 옮겼습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 유지
  chosen_reading: ‘스올’로 음역하여 죽은 자의 영역을 가리키는 히브리어 개념을 유지했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자의 세계
  rationale: 이 구절은 단순한 매장지를 말하기보다 죽음의 영역으로 내려감을 경고하므로, 후대의 지옥 개념이나 단순한 ‘무덤’으로 축소하지 않는 편이 소스에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
