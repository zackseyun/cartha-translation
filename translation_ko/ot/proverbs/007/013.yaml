  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶחֱזִ֣יקָה בּ֭/וֹ וְ/נָ֣שְׁקָה לּ֑/וֹ הֵעֵ֥זָה פָ֝נֶ֗י/הָ וַ/תֹּ֣אמַר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/013.yaml
  text: 'She seized him and kissed him[a]; with a bold face she said to him:'
  footnotes:
  - marker: a
    text: Or 'with a brazen face' or 'with shameless boldness.' The Hebrew idiom conveys audacious, unembarrassed forwardness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 그를 붙들고 입을 맞추었으며, 뻔뻔한 얼굴로 그에게 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘뻔뻔한 얼굴로’, ‘대담한 얼굴로’, 또는 ‘수치심 없는 대담함으로’라는 뜻을 내포합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  english_pob_choice: She seized him
  chosen_korean: 그를 붙들고
  alternatives_korean:
  - 그를 움켜쥐고
  - 그를 붙잡고
  - 그를 붙들어
  lexicon: HALOT
  rationale: החזיק עם בְּ는 사람을 ‘붙들다/잡다’는 뜻이므로, 갑작스럽고 주도적인 동작을 살리되 한국어로는 가장 자연스러운 ‘붙들고’로 옮겼습니다.
- source_word: וְנָשְׁקָה לּוֹ
  english_pob_choice: and kissed him
  chosen_korean: 입을 맞추었으며
  alternatives_korean:
  - 그에게 입을 맞추었으며
  - 그에게 키스했으며
  lexicon: HALOT
  rationale: נשק의 기본 의미를 직접 반영하되, 문어적이면서도 과도하게 현대 구어화되지 않도록 ‘입을 맞추다’를 택했습니다.
- source_word: הֵעֵזָה פָנֶיהָ
  english_pob_choice: with a bold face
  chosen_korean: 뻔뻔한 얼굴로
  alternatives_korean:
  - 대담한 얼굴로
  - 뻔뻔스러운 얼굴로
  - 수치심 없는 태도로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴’을 유지하기보다, 한국어에서 같은 평가적 뉘앙스를 가장 자연스럽게 전달하는 표현이 ‘뻔뻔한 얼굴로’입니다.
- source_word: וַתֹּאמַר לוֹ
  english_pob_choice: she said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였습니다
  - 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어의 직접목적어/간접목적어 관계를 그대로 살려 ‘그에게’와 서술 동사 ‘말했습니다’를 유지했습니다.
theological_decisions:
- issue: 이 절의 서술 태도와 인물 묘사
  chosen_reading: 여인의 행동을 도덕적 평가를 덧붙이지 않고, 본문이 드러내는 대담하고 노골적인 접근으로 옮겼습니다.
  alternative_readings:
  - 해석을 덧붙여 더 강하게 비난하는 표현
  - 완곡하게 순화하는 표현
  rationale: 지혜문학의 경고 장면으로서 본문의 긴장과 노골성을 유지하는 것이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 잠언의 경고적 지혜 전통
