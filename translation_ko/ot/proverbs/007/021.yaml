lexical_decisions:
- source_word: הִטַּתּוּ
  english_pob_choice: she persuades him
  chosen_korean: 그를 꾀하고
  alternatives_korean:
  - 그를 돌려세우고
  - 그를 유혹하고
  - 그를 기울게 하고
  lexicon: HALOT
  rationale: הטה의 사역형은 ‘돌리다/기울이다’의 뜻이지만, 이 문맥에서는 거짓된 권유로 그를 끌어당기는 효과가 핵심이어서 ‘꾀하다’가 가장 자연스럽고 의미를 잘 살립니다.
- source_word: בְּרֹב לִקְחָהּ
  english_pob_choice: with her abundant persuasion
  chosen_korean: 자기의 풍성한 권유로
  alternatives_korean:
  - 자기의 많은 말로
  - 자기의 넘치는 가르침으로
  - 자기의 풍부한 설득으로
  lexicon: HALOT
  rationale: רֹב은 ‘많음/풍성함’을, לִקְחָהּ는 이 맥락에서 설득성 있는 말이나 권유를 가리키므로, 두 요소를 함께 살려 ‘풍성한 권유’로 옮겼습니다.
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  english_pob_choice: with the smoothness of her lips
  chosen_korean: 자기 입술의 매끄러움으로
  alternatives_korean:
  - 자기 입술의 부드러움으로
  - 자기 아첨하는 말로
  - 자기 말의 매끄러움으로
  lexicon: HALOT
  rationale: חלק은 ‘매끄러움/미끄러움’의 이미지이며, ‘입술’은 원문 그대로 유지해 몸의 이미지를 보존했습니다. ‘아첨’은 의미를 풀어 쓰는 해석이어서 본문 이미지를 우선해 배제했습니다.
- source_word: תַּדִּיחֶנּוּ
  english_pob_choice: she compels him
  chosen_korean: 그를 몰아갑니다
  alternatives_korean:
  - 그를 강제로 이끕니다
  - 그를 떠밀어 갑니다
  - 그를 내몰아 갑니다
  lexicon: HALOT
  rationale: נדח의 사역형은 ‘몰다/떠밀다/몰아가다’의 힘 있는 동작을 나타내므로, 설득 뒤에 이어지는 압박감을 살려 ‘몰아갑니다’로 옮겼습니다.
