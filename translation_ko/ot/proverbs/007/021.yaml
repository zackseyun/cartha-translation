  text: 그 여인은 많은 권유로 그를 꾀고, 매끄러운 입술로 그를 몰아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여인은 많은 권유로 그를 돌리고, 매끄러운 입술로 그를 몰아갑니다.’
