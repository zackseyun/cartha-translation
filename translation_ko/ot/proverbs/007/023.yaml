    issue: ‘그의 간을 꿰뚫는 화살이 있을 때까지’가 동사 יְפַלַּח의 유한 동작을 ‘화살이 있다’는 표현으로 바꾸고, ‘화살이 그의 간을 꿰뚫는다’는 핵심 이미지를 문법적으로 흐렸습니다.
    rationale: 원문은 화살의 존재가 아니라 화살이 간을 관통하는 치명적 순간을 말합니다.
