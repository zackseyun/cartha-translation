  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֤ד יְפַלַּ֪ח חֵ֡ץ כְּֽבֵד֗/וֹ כְּ/מַהֵ֣ר צִפּ֣וֹר אֶל פָּ֑ח וְ/לֹֽא יָ֝דַ֗ע כִּֽי בְ/נַפְשׁ֥/וֹ הֽוּא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/023.yaml
  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
  footnotes:
  - marker: a
    text: Literally, 'that it is for his life' or 'forfeits his life'; the Hebrew is elliptical and means that the course he is taking leads to his death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 간을 꿰뚫는 화살이 있을 때까지, 새가 덫으로 급히 들어가듯이, 그는 그것이 자기 생명을 잃게 한다는 것을 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “그의 생명을 위하여/그의 생명에 대하여”라는 뜻으로, 문맥상 생명을 잃는 결과를 가리키는 생략적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלַּח / חֵץ
  english_pob_choice: pierces his liver / arrow
  chosen_korean: “그의 간을 꿰뚫는 화살”
  alternatives_korean:
  - “그의 간을 찌르는 화살”
  - “그의 간을 관통하는 화살”
  lexicon: HALOT
  rationale: פלח의 강한 관통 이미지를 살리면서, חֵץ를 자연스럽게 “화살”로 옮겼습니다. כָּבֵד는 관용적 의미인 “간”을 유지해 육체적·시각적 긴박함을 보존했습니다.
- source_word: כְמַהֵר צִפּוֹר אֶל פָּח
  english_pob_choice: like a bird rushing into a snare
  chosen_korean: “새가 덫으로 급히 들어가듯이”
  alternatives_korean:
  - “새가 덫 안으로 급히 날아들듯이”
  - “새가 올무로 달려들듯이”
  lexicon: HALOT
  rationale: כְמַהֵר의 재빠르고 무모한 움직임을 “급히”로, צִפּוֹר과 פָּח는 과도한 해설 없이 “새”와 “덫”으로 옮겨 비유의 단순성을 살렸습니다.
- source_word: וְלֹא יָדַע
  english_pob_choice: and he does not know
  chosen_korean: “그는 … 알지 못합니다”
  alternatives_korean:
  - “그는 … 모릅니다”
  - “그는 … 깨닫지 못합니다”
  lexicon: HALOT
  rationale: 잠언체의 경고를 현대 문어로 자연스럽게 전달하기 위해 직설적으로 “알지 못합니다”로 옮겼습니다.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  english_pob_choice: that it will cost him his life
  chosen_korean: “그것이 자기 생명을 잃게 한다는 것을”
  alternatives_korean:
  - “그것이 자기 목숨에 이른다는 것을”
  - “그것이 자기 생명을 위한 것임을”
  lexicon: HALOT
  rationale: 히브리어의 생략된 표현을 POB의 해석에 따라, 단순한 “자기 생명”이 아니라 실제로 생명을 잃는 결과를 드러내도록 옮겼습니다.
theological_decisions:
- issue: 비유의 종결을 직접적 생명 상실로 풀어 쓸지 여부
  chosen_reading: “그것이 자기 생명을 잃게 한다”로 풀어, 문맥이 가리키는 치명적 결말을 명시했습니다.
  alternative_readings:
  - “그것이 자기 생명을 위한 것이다”
  - “그것이 그의 생명과 관련된다”
  rationale: 히브리어는 문자적으로는 생략적이지만, 본문 전체의 경고는 길이 죽음에 이르는 파멸을 가리킵니다. POB의 주해 방향을 따라 그 함의를 분명히 드러냈습니다.
  doctrine_reference: 잠언의 지혜-경고 본문 해석
- issue: 직접 화법이 아닌 잠언적 진술의 문체
  chosen_reading: 합쇼체로 일관해 경고의 공적·교훈적 톤을 유지했습니다.
  alternative_readings:
  - 더 구어적인 현재형
  - 설교체의 높임말
  rationale: 본문은 지혜문학의 일반 진술이므로, 과도한 구어화나 고어화를 피하고 표준 현대 문어의 경고문체를 택했습니다.
  doctrine_reference: 문체 및 장르 적합성
