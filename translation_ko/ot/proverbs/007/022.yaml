id: PRO.7.22
reference: Proverbs 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
  footnotes:
  - marker: a
    text: Hebrew 'and like a fetter to the discipline of a fool.' The line is difficult. Some understand the word rendered 'fetter' differently and translate the clause along the lines of 'like a deer stepping into a snare' or 'like shackles for the correction of a fool.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 즉시 그녀를 따라가며, 도살장으로 가는 소처럼, 그리고 어리석은 자의 징벌에 묶이는 족쇄처럼 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 행은 어렵습니다. 어떤 사람들은 '족쇄'로 번역된 단어를 다르게 이해하여 '사슴이 덫에 들어가는 것처럼' 또는 '어리석은 자를 교정하는 족쇄처럼'의 뜻으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ פִּתְאֹם
  english_pob_choice: He goes after her at once
  chosen_korean: 즉시 그녀를 따라가며
  alternatives_korean:
  - 그는 곧바로 그녀를 뒤따르며
  - 그는 갑자기 그녀를 따라가며
  lexicon: HALOT
  rationale: פתחאום의 급작성과 자발성을 살려 '즉시'로 옮기고, 뒤따름의 방향은 '그녀를 따라가며'로 자연스럽게 표현했습니다.
- source_word: כְּשׁוֹר אֶל טָבַח יָבוֹא
  english_pob_choice: like an ox going to the slaughter
  chosen_korean: 도살장으로 가는 소처럼
  alternatives_korean:
  - 도살로 가는 소처럼
  - 도살당하러 가는 소처럼
  lexicon: HALOT
  rationale: שור의 비유를 '소'로 유지하고, 도착지/운명성을 함께 담는 '도살장으로 가는'을 사용해 원문의 충격적 이미지와 방향성을 살렸습니다.
- source_word: וּכְעֶכֶס
  english_pob_choice: and like a fetter
  chosen_korean: 그리고 … 족쇄처럼 됩니다
  alternatives_korean:
  - 그리고 … 발목쇠처럼 됩니다
  - 그리고 … 쇠사슬처럼 됩니다
  lexicon: HALOT
  rationale: עֶכֶס는 뜻이 불확실하므로 POB의 'fetter'를 따라 구속 도구를 가리키는 '족쇄'로 옮겨, 본문의 억압적 비유를 지나치게 특정화하지 않았습니다.
- source_word: אֶל מוּסַר אֱוִיל
  english_pob_choice: to the discipline of a fool
  chosen_korean: 어리석은 자의 징벌에 묶이는
  alternatives_korean:
  - 어리석은 자의 훈계에 이르는
  - 어리석은 자의 교정에 이르는
  lexicon: HALOT
  rationale: מוּסָר은 지혜문맥의 '훈련'보다 여기서는 징계/교정의 뜻이 강하므로 '징벌'로 옮겼고, אֱוִיל은 관용적인 '어리석은 자'로 처리했습니다.
theological_decisions:
- issue: 비유의 결말에 대한 난해한 히브리어 표현 처리
  chosen_reading: '''족쇄처럼 됩니다''로 본문 비유를 유지하면서, 어휘의 불확실성은 드러내지 않고 흐름을 살렸습니다.'
  alternative_readings:
  - '''사슴이 덫에 들어가는 것처럼'''
  - '''어리석은 자를 교정하는 족쇄처럼'''
  rationale: 본문의 마지막 행은 원문 자체가 난해하므로, POB의 보수적 선택을 따라 명백한 구속/파멸의 이미지를 유지하는 쪽이 청중 이해에 가장 충실합니다.
  doctrine_reference: 잠언의 지혜-어리석음 대조와 징계 개념
