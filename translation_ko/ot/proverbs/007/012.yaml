  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: Now in the street[a], now in the squares[b], and beside every corner she lies in wait.
  footnotes:
  - marker: a
    text: Or 'Sometimes outside, sometimes in the plazas.' The Hebrew repeats 'פַּעַם' for alternating movement from place to place.
    reason: lexical_alternative
  - marker: b
    text: Or 'she lurks' or 'she waits in ambush.' The verb suggests stealthy, predatory waiting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 이제 길거리에서, 이제 광장에서, 또 모든 모퉁이 곁에 숨어 기다립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 פַּעַם 반복은 ‘가끔’보다 장소를 옮겨 다니는 번갈음과 리듬을 드러냅니다.
    reason: source_note
  - marker: b
    text: אָרַב은 단순히 ‘기다리다’보다 ‘매복하다/숨다’의 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  english_pob_choice: Now ... now
  chosen_korean: 이제 ... 이제
  alternatives_korean:
  - 때로는 ... 때로는
  - 이곳저곳으로 ...
  lexicon: HALOT
  rationale: 반복되는 פַּעַם은 장소를 옮겨 다니는 번갈음과 변화를 나타내므로, 한국어에서도 짧게 반복되는 표현으로 동선을 살렸습니다.
- source_word: בַּחוּץ
  english_pob_choice: in the street
  chosen_korean: 길거리에서
  alternatives_korean:
  - 밖에서
  - 거리에서
  lexicon: HALOT
  rationale: חוץ는 단순한 ‘밖’보다 공적 공간의 거리 쪽 뉘앙스가 강하므로, 도시적 장면이 드러나는 ‘길거리에서’로 옮겼습니다.
- source_word: בָּרְחֹבוֹת
  english_pob_choice: in the squares
  chosen_korean: 광장에서
  alternatives_korean:
  - 마당에서
  - 넓은 거리에서
  lexicon: HALOT
  rationale: רְחֹבוֹת은 공개된 넓은 공적 장소를 가리키므로, 한국어에서는 자연스럽고 대조가 분명한 ‘광장’이 적절합니다.
- source_word: תֶאֱרֹב
  english_pob_choice: she lies in wait
  chosen_korean: 숨어 기다립니다
  alternatives_korean:
  - 매복합니다
  - 잠복합니다
  - 숨어 매복합니다
  lexicon: HALOT
  rationale: אָרַב의 핵심은 은밀하게 노리며 기다리는 태도이므로, 직설적이면서도 현대 한국어에서 자연스러운 ‘숨어 기다립니다’로 옮겼습니다.
theological_decisions:
- issue: 여성 화자의 사냥/매복 이미지 유지
  chosen_reading: 문장 전체를 부드럽게 완화하지 않고, 도시 곳곳에서 표적을 노리는 위협적 이미지를 유지했습니다.
  alternative_readings:
  - 그녀는 여기저기 돌아다닙니다
  - 그녀는 사람들 사이를 배회합니다
  rationale: 본문은 단순한 이동이 아니라 포식적 감시와 매복을 강조하므로, 그 긴장감을 살려 경고의 기능을 보존했습니다.
  doctrine_reference: 잠언의 지혜-경고 문맥
