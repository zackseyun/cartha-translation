base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: Now in the street[a], now in the squares[b], and beside every corner she lies in wait.
  footnotes:
  - marker: a
    text: Or 'Sometimes outside, sometimes in the plazas.' The Hebrew repeats 'פַּעַם' for alternating movement from place to place.
    reason: lexical_alternative
  - marker: b
    text: Or 'she lurks' or 'she waits in ambush.' The verb suggests stealthy, predatory waiting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 때로는 거리에서, 때로는 광장에서[a], 또 모든 모퉁이 곁에서 숨어 기다립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 פַּעַם ... פַּעַם의 반복은 장소를 옮겨 다니는 번갈음과 리듬을 드러냅니다. 또는 ‘한때는 ... 한때는’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: אָרַב은 은밀히 숨어 상대를 노리며 기다리는 것을 뜻합니다. 또는 ‘매복합니다’로 옮길 수 있습니다.
    reason: lexical_alternative
