  text: בְּ/נֶֽשֶׁף בְּ/עֶ֥רֶב י֑וֹם בְּ/אִישׁ֥וֹן לַ֝֗יְלָה וַ/אֲפֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/009.yaml
  text: at twilight[a], in the evening of the day, in the black of night and darkness.
  footnotes:
  - marker: a
    text: Or 'in deep night'; literally, 'in the pupil of night,' a Hebrew idiom for the darkest part of the night.
    reason: lexical_alternative
translation:
  language: ko
  text: 해 질 무렵, 하루의 저녁에, 밤의 한복판과 어둠 속에서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밤의 동공에’라는 직역도 가능하지만, 히브리어 관용구의 뜻은 ‘깊은 밤’, 곧 가장 어두운 때를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֶשֶׁף
  english_pob_choice: twilight
  chosen_korean: 해 질 무렵
  alternatives_korean:
  - 황혼에
  - 어스름에
  lexicon: HALOT
  rationale: נֶשֶׁף는 낮과 밤의 경계가 흐려지는 때를 가리키므로, 한국어에서는 자연스럽고 시간적 전환이 드러나는 ‘해 질 무렵’이 가장 잘 맞습니다.
- source_word: בְּעֶרֶב י֑וֹם
  english_pob_choice: the evening of the day
  chosen_korean: 하루의 저녁에
  alternatives_korean:
  - 저녁에
  - 그날 저녁에
  lexicon: HALOT
  rationale: ‘저녁’만으로는 מספיק하지 않은 이중 표현을 살려, 날 전체의 끝자락이라는 점이 드러나도록 ‘하루의 저녁에’로 옮겼습니다.
- source_word: בְּאִישׁוֹן לַיְלָה
  english_pob_choice: the black of night
  chosen_korean: 밤의 한복판
  alternatives_korean:
  - 밤의 동공에
  - 깊은 밤에
  - 한밤중에
  lexicon: HALOT
  rationale: אִישׁוֹן의 직역인 ‘동공’은 한국어에서 비유가 너무 낯설 수 있어, 가장 어두운 밤의 중심을 뜻하는 ‘밤의 한복판’으로 의미를 살렸습니다.
- source_word: וַאֲפֵלָה
  english_pob_choice: and darkness
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 그리고 어둠에
  - 그리고 캄캄함에
  lexicon: HALOT
  rationale: ‘어둠’은 앞의 ‘밤의 한복판’과 중복되지만, 히브리어의 누적적 종결을 살리기 위해 보다 자연스러운 결말 표현으로 유지했습니다.
