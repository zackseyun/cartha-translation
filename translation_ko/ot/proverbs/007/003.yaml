lexical_decisions:
- source_word: קָשְׁרֵם
  english_pob_choice: Tie them
  chosen_korean: 매어 두고
  alternatives_korean:
  - 묶어 두고
  - 매십시오
  - 묶으십시오
  lexicon: HALOT
  rationale: קשר의 구체적 동작을 살리되, 현대 한국어에서 자연스럽고 지속적 보유의 뉘앙스를 주는 ‘매어 두고’를 택했습니다. 단순한 ‘기억하다’로 풀지 않아 손가락에 붙들어 두는 비유를 보존합니다.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  english_pob_choice: on your fingers
  chosen_korean: 네 손가락에
  alternatives_korean:
  - 네 손가락 위에
  - 네 손가락들에
  lexicon: HALOT
  rationale: עַל의 위치적 용법을 한국어 조사 ‘-에’로 자연스럽게 옮겼습니다. 복수형 ‘손가락’은 히브리어의 복수 이미지를 그대로 반영합니다.
- source_word: כָּתְבֵם
  english_pob_choice: write them
  chosen_korean: 그것들을 기록하십시오
  alternatives_korean:
  - 그것들을 쓰십시오
  - 그것들을 적으십시오
  lexicon: HALOT
  rationale: כתב은 단순히 ‘쓰다’보다 문어적이고 지속적인 새김의 느낌을 주는 ‘기록하다’가 문맥에 더 잘 맞습니다. 앞절과의 병행을 유지하면서도 내면화된 가르침의 이미지를 살립니다.
- source_word: לִבֶּךָ
  english_pob_choice: of your heart
  chosen_korean: 네 마음의
  alternatives_korean:
  - 네 হৃদ의
  - 네 속사람의
  lexicon: HALOT
  rationale: לֵב은 감정만이 아니라 생각과 의지까지 포괄하는데, 한국어 ‘마음’이 그 범위를 가장 자연스럽게 담습니다. ‘마음의 판’은 ‘heart’의 비유를 직역하지 않으면서도 성경적 상징을 보존합니다.
theological_decisions:
- issue: 지혜 훈계의 물질적·내면적 비유 보존
  chosen_reading: ‘손가락에 매어 두고’와 ‘마음의 판에 기록하다’라는 구체적 비유를 그대로 살렸습니다.
  alternative_readings:
  - 그것들을 늘 기억하십시오
  - 그것들을 깊이 마음에 새기십시오
  rationale: 본문은 단순한 암기 권고가 아니라, 훈계를 몸과 내면에 동시에 고정하는 지혜 문학의 강한 이미지를 사용합니다. 비유를 완화하지 않고 유지해야 본문의 수사와 신학적 무게가 살아납니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
