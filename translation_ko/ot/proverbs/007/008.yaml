  - severity: medium
    issue: ‘길거리로 지나가며, … 근처를 거쳐’
    rationale: 원문의 ‘거리에서/거리로 그녀의 모퉁이 곁을 지나’라는 관계를 한국어에서 더 자연스럽고 직접적으로 표현할 필요가 있습니다.
