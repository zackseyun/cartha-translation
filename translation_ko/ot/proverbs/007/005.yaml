  naturalness: 현행 문장은 ‘너를 지켜서 … 벗어나게 하려는 것입니다’가 보호와 탈출의 목적을 중복하여 다소 무겁게 만듭니다. ‘…에게서 너를 지켜 주려는 것입니다’가 현대 표준 한국어의 합쇼체로 자연스럽고 문장 구조도 분명합니다.
