  source_fidelity: 초안은 צְרוֹר הַכֶּסֶף를 ‘돈을 든 주머니’로 대체로 옮겼지만, לָקַח בְיָדוֹ(‘손에 ... 들고/가지고 갔다’)의 완료 동작이 ‘가지고’로 약화되었고, 귀가 시점을 ‘그가 집으로 올 때 보름달이 될 것입니다’라고 하여 원문의 ‘보름에 그가 집에 올 것이다’를 조건절처럼 바꾸었습니다.
