  terminology: ‘돈주머니’는 הַכֶּסֶף의 화폐적 용법과 צְרוֹר의 의미를 잘 전달합니다. 논쟁적인 הַכֵּסֶא는 본문에서 ‘보름날’로 옮기되, ‘정해진 날’ 및 ‘초하루’라는 대안은 각주에 보존해야 합니다.
