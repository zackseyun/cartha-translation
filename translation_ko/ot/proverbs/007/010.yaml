id: PRO.7.10
reference: Proverbs 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֭שָּׁה לִ/קְרָאת֑/וֹ שִׁ֥ית ז֝וֹנָ֗ה וּ/נְצֻ֥רַת לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
  footnotes:
  - marker: a
    text: Or 'wily of heart,' 'secretive,' or 'cunning of heart.' The Hebrew literally says 'guarded of heart,' suggesting concealed intentions.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 한 여자가 그를 맞으러 왔는데, 창녀처럼 차려입고 마음이 감추어진 자였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 지켜진’, ‘속셈이 숨겨진’, ‘간교한 마음’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘지켜진/보호된 마음’을 뜻하며, 숨겨진 의도를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 장면 전환의 즉시성과 주의를 환기하는 감탄을 한국어에서 자연스럽게 살렸습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 한 여자
  alternatives_korean:
  - 한 여인
  - 한 여성
  lexicon: HALOT
  rationale: 정체가 특정되지 않은 인물임을 그대로 유지하면서 현대 한국어로 가장 자연스럽게 옮겼습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: came to meet him
  chosen_korean: 그를 맞으러 왔는데
  alternatives_korean:
  - 그를 만나러 왔는데
  - 그에게 다가왔는데
  lexicon: HALOT
  rationale: 단순한 ‘향함’이 아니라 실제로 맞이하러 오는 움직임을 드러내는 표현으로 옮겼습니다.
- source_word: שִׁית זוֹנָה
  english_pob_choice: dressed like a prostitute
  chosen_korean: 창녀처럼 차려입고
  alternatives_korean:
  - 창녀의 옷차림을 하고
  - 매춘부처럼 차려입고
  lexicon: HALOT
  rationale: 외양을 가리키는 표현이므로 ‘차려입고’로 처리했고, מקור의 노골성을 약화하지 않도록 ‘창녀’로 옮겼습니다.
- source_word: וּנְצֻרַת לֵב
  english_pob_choice: cunning of heart
  chosen_korean: 마음이 감추어진 자였습니다
  alternatives_korean:
  - 마음이 지켜진 자였습니다
  - 마음이 숨겨진 사람이었습니다
  - 마음이 간교한 자였습니다
  lexicon: HALOT
  rationale: ‘guarded of heart’의 문자적 이미지를 살리되, 문맥상 내면의 숨김과 기만성을 암시하도록 자연스럽게 표현했습니다.
theological_decisions:
- issue: וּנְצֻרַת לֵב의 의미 범위
  chosen_reading: 직역 이미지인 ‘마음이 감추어진’을 택해, 내면이 공개되지 않은 상태와 문맥상 그로부터 드러나는 위험성을 함께 남겼습니다.
  alternative_readings:
  - 간교한 마음
  - 속셈을 숨긴 마음
  - 마음이 지켜진
  rationale: 히브리어는 문자적으로 ‘지켜진/보호된 마음’이지만, 문맥에서는 은밀한 의도와 경계해야 할 성격을 암시합니다. 단정적 판단어로 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 외양과 내면의 불일치를 드러내는 경계의 표현
