base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
  footnotes:
  - marker: a
    text: Or 'wily of heart,' 'secretive,' or 'cunning of heart.' The Hebrew literally says 'guarded of heart,' suggesting concealed intentions.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 한 여자가 그를 만나러 왔습니다. 그는 창녀의 옷차림을 하고 속마음을 감춘 여자였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 지켜진 여자’, ‘간교한 마음을 지닌 여자’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘마음이 지켜진’이라는 뜻이며, 감추어진 의도나 경계하는 태도를 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
