  source_fidelity: 핵심 의미는 대체로 충실합니다. לִקְרָאתוֹ는 ‘그를 만나러’로, שִׁית זוֹנָה는 외양을 가리키는 ‘창녀의 옷차림을 하고’로 옮기는 편이 더 직접적입니다. נְצֻרַת לֵב의 ‘지켜진/감추어진 마음’이라는 비유와 문맥상 숨긴 속셈의 함의는 본문과 각주에서 함께 보존할 수 있습니다.
  naturalness: ‘마음이 감추어진 자였습니다’는 한국어에서 사람을 수식하는 방식이 다소 부자연스럽고, 앞의 ‘한 여자’와도 어색하게 호응합니다. ‘속마음을 감춘 여자였습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘창녀’는 원문의 직설적인 사회적 표지를 현대 한국어로 무리 없이 전달합니다. 다만 ‘창녀처럼 차려입고’보다 ‘창녀의 옷차림을 하고’가 שִׁית의 명사구를 더 가깝게 반영합니다. נְצֻרַת לֵב은 한 가지 심리적 판단으로 단정하지 않고 각주에서 대안을 제시합니다.
