  lexicon: HALOT
  rationale: ‘guarded of heart’의 문자적 이미지를 살리되, 문맥상 내면의 숨김과 기만성을 암시하도록 자연스럽게 표현했습니다.
theological_decisions:
- issue: וּנְצֻרַת לֵב의 의미 범위
  chosen_reading: 직역 이미지인 ‘마음이 감추어진’을 택해, 내면이 공개되지 않은 상태와 문맥상 그로부터 드러나는 위험성을 함께 남겼습니다.
  alternative_readings:
  - 간교한 마음
  - 속셈을 숨긴 마음
  - 마음이 지켜진
  rationale: 히브리어는 문자적으로 ‘지켜진/보호된 마음’이지만, 문맥에서는 은밀한 의도와 경계해야 할 성격을 암시합니다. 단정적 판단어로 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 외양과 내면의 불일치를 드러내는 경계의 표현
