  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֭י בְּ/חַלּ֣וֹן בֵּיתִ֑/י בְּעַ֖ד אֶשְׁנַבִּ֣/י נִשְׁקָֽפְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
  footnotes:
  - marker: a
    text: Or 'through my casement.' The Hebrew term refers to a latticed opening or window screen.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 내 집의 창문에서 내 격자창을 통해 밖을 내다보았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘격자창’은 히브리어 אֶשְׁנָב를 옮긴 말입니다. 이 말은 격자 모양의 창 또는 창문 개구부를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -에서
  alternatives_korean:
  - 그리고
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 설명을 여는 접속의 기능을 하므로 한국어에서는 별도 접속사보다 장소구를 자연스럽게 이어 주는 방식이 원문의 흐름을 가장 덜 왜곡합니다.
- source_word: בְּחַלּוֹן
  english_pob_choice: at the window
  chosen_korean: 내 집의 창문에서
  alternatives_korean:
  - 창문에서
  - 창가에서
  - 내 집의 창가에서
  lexicon: HALOT
  rationale: חַלּוֹן은 ‘창문’이므로 기본 이미지를 살리고, בְּ와 소유구를 함께 반영해 관찰의 위치를 분명히 했습니다.
- source_word: בְּעַד אֶשְׁנַבִּי
  english_pob_choice: through my lattice
  chosen_korean: 내 격자창 너머로
  alternatives_korean:
  - 내 격자창을 통해
  - 내 살창 너머로
  - 내 격자살창 너머로
  lexicon: HALOT
  rationale: אֶשְׁנָב는 격자나 살이 있는 개구부를 가리키므로, ‘너머로’로 시선이 그 사이를 통과해 밖을 향하는 감각을 살렸습니다.
- source_word: נִשְׁקָפְתִּי
  english_pob_choice: I looked out
  chosen_korean: 내다보았습니다
  alternatives_korean:
  - 쳐다보았습니다
  - 바라보았습니다
  - 밖을 내다보았습니다
  lexicon: HALOT
  rationale: 동사는 높은 곳이나 틈에서 밖을 내려다보는 시선을 나타내므로, 단순한 ‘보다’보다 ‘내다보다’가 관찰의 방향성을 더 정확히 드러냅니다.
