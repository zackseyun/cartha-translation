  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
  footnotes:
  - marker: a
    text: Or 'aloewood'; the Hebrew term refers to a fragrant wood used in perfumes, not the modern aloe plant in the usual sense.
