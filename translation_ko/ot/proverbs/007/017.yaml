translation:
  language: ko
  text: 내 침상에 몰약과 알로에나무와 계피 향을 발랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘알로에나무’는 현대의 알로에 식물이 아니라, 향료로 쓰인 향기로운 목재를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  english_pob_choice: I have perfumed
  chosen_korean: 향을 발랐습니다
  alternatives_korean:
  - 향을 뿌렸습니다
  - 향을 입혔습니다
  lexicon: HALOT
  rationale: 침상에 향기로운 물질을 더해 향내를 입히는 뜻을 자연스러운 현대 한국어로 옮겼습니다. '발랐습니다'는 결과적·의도적 준비를 드러내며, 단순히 흩뿌리는 느낌보다 문맥에 맞습니다.
