    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사랑으로 기쁨을 누립시다’. 히브리어 אֳהָבִים은 일반적인 사랑을 뜻할 수도 있으나, 이 문맥에서는 성적인 사랑과 그 즐거움을 가리킵니다.
    reason: lexical_alternative
