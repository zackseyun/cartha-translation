id: PRO.7.18
reference: Proverbs 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכָ֤/ה נִרְוֶ֣ה דֹ֭דִים עַד הַ/בֹּ֑קֶר נִ֝תְעַלְּסָ֗ה בָּ/אֳהָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/018.yaml
  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
  footnotes:
  - marker: a
    text: Or 'let us have our fill of caresses until morning.' The Hebrew uses sensual terms that can be rendered more concretely as physical love-expressions.
    reason: lexical_alternative
  - marker: b
    text: Or 'let us revel in love.' The final phrase may be rendered more generally, but here it refers to erotic enjoyment in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 오세요[a], 아침까지 사랑을 흠뻑 마시고 사랑을 나누며 즐깁시다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오십시오’. 히브리어 לְכָה는 직접적인 초대 또는 유혹의 명령형입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사랑으로 기쁨을 누립시다’. 히브리어 אֳהָבִים은 일반적인 사랑을 뜻할 수도 있으나, 이 문맥에서는 성적인 사랑과 그 즐거움을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오너라
  - 오세요
  lexicon: HALOT
  rationale: 유혹적 초대의 명령형을 표준어 합쇼체로 자연스럽게 옮기기 위해 ‘오십시오’를 택했습니다. 단순한 이동 명령보다 이 문맥의 유혹적 호소를 잘 드러냅니다.
- source_word: נִרְוֶה דֹדִים
  english_pob_choice: let us drink our fill of love
  chosen_korean: 우리가 ... 사랑을 마음껏 마시고
  alternatives_korean:
  - 우리가 사랑을 흠뻑 마시고
  - 우리가 사랑으로 배불리 마시고
  lexicon: HALOT
  rationale: ‘마시다’의 음주 은유를 살려 נִרְוֶה의 ‘마음껏/흠뻑’의 포만 이미지를 보존했습니다. דֹדִים은 이 맥락에서 성적 애무를 포함한 사랑의 표현이므로 ‘사랑’을 유지하되 과도한 의역은 피했습니다.
- source_word: עַד הַבֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 새벽까지
  - 아침이 올 때까지
  lexicon: HALOT
  rationale: 직접적인 시간 부사구로, 현대 한국어에서 가장 자연스러운 ‘아침까지’를 사용했습니다.
- source_word: נִתְעַלְּסָה בָּאֳהָבִים
  english_pob_choice: let us delight ourselves with love
  chosen_korean: 사랑에 잠기며 즐깁시다
  alternatives_korean:
  - 사랑으로 즐깁시다
  - 사랑을 누리며 즐깁시다
  lexicon: HALOT
  rationale: Hitpael의 자기 몰입·탐닉 뉘앙스를 살리기 위해 ‘즐기다’에 ‘사랑에 잠기다’를 보태었습니다. בָּאֳהָבִים의 복수형은 단순한 일반적 사랑보다 맥락상 성적 사랑의 향유를 가리키므로 이를 암시하도록 옮겼습니다.
theological_decisions:
- issue: 잠언 7:18의 에로틱한 초대 표현의 직설성
  chosen_reading: 본문의 은유를 완화하지 않고, 문맥이 요구하는 성적 유혹의 강도를 보존했습니다.
  alternative_readings:
  - ‘사랑을 나누자’처럼 순화된 표현
  - 일반적 우정/애정으로 중화하는 번역
  rationale: 지혜문학의 경고 장면에서 유혹의 구체성이 핵심이므로, 독자가 위험성을 오해하지 않도록 원문의 감각적 언어를 유지했습니다.
  doctrine_reference: 지혜문학의 문맥적·윤리적 경고
- issue: 합쇼체와 1인칭 권유형의 조합
  chosen_reading: 직접 화자의 유혹적 권유를 살리기 위해 권유형 ‘-시다’와 존대 초청 ‘오십시오’를 함께 사용했습니다.
  alternative_readings:
  - 전면 서술체로 완화
  - 비격식체로 통일
  rationale: 한국어 본문 가독성을 유지하면서도, 인물 간 대화의 긴장과 유혹의 직접성을 전달하기 위한 선택입니다.
  doctrine_reference: 담화-화행 보존
