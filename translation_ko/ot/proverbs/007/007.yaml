source:
  edition: WLC
  text: וָ/אֵ֤רֶא בַ/פְּתָאיִ֗ם אָ֘בִ֤ינָה בַ/בָּנִ֗ים נַ֣עַר חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/007.yaml
  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
  footnotes:
  - marker: a
    text: Literally, 'lacking heart,' an idiom for lacking judgment or understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 순진한 자들 가운데서 보았습니다. 젊은이들 가운데서 분별력 없는 한 청년을 알아보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '마음이 없는'입니다. 히브리어 지혜문학에서 '마음'은 판단력과 이해력을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: and I saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다—그리고 알아보았습니다
  - 내가 보았습니다
  lexicon: HALOT
  rationale: 히브리어 완료 서술의 순차적 관찰을 자연스럽게 살려, 단순한 시각 행위로서의 '보았습니다'를 택했습니다.
- source_word: בַּפְּתָאיִם
  english_pob_choice: among the simple
  chosen_korean: 순진한 자들 가운데서
  alternatives_korean:
  - 단순한 자들 가운데서
  - 미련한 자들 가운데서
  lexicon: HALOT
  rationale: 지혜문학에서 פְּתָאיִם은 쉽게 속는 부류를 가리키므로, 한국어에서 자연스럽고 문맥상 가까운 '순진한 자들'로 옮겼습니다.
- source_word: אָבִינָה
  english_pob_choice: I discerned
  chosen_korean: 분별력 없는 한 청년을 알아보았습니다
  alternatives_korean:
  - 분별하여 보았습니다
  - 알아보았습니다
  lexicon: HALOT
  rationale: ‘분별하다/헤아리다’의 평가적 뉘앙스를 살리되, 반복을 피하면서 앞의 '보았습니다'와 구별되도록 '알아보았습니다'를 사용했습니다.
- source_word: חֲסַר לֵב
  english_pob_choice: lacking sense
  chosen_korean: 분별력 없는
  alternatives_korean:
  - 마음이 없는
  - 지혜가 없는
  - 생각이 없는
  lexicon: HALOT
  rationale: 직역하면 '마음이 없는'이지만, 히브리어에서 לֵב이 판단과 이해를 뜻하므로 현대 한국어의 뜻 전달을 위해 '분별력 없는'으로 옮겼습니다.
