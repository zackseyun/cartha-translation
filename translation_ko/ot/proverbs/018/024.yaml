id: PRO.18.24
reference: Proverbs 18:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
  footnotes:
  - marker: a
    text: Or, 'A man of many companions must show himself friendly'; the Hebrew verb לְהִתְרֹעֵעַ is difficult and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 사귐이 많은 사람은 무너질 수 있지만, 형제보다 더 가까이 붙어 있는 친구가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “사귐이 많은 사람은 친하게 행동해야 한다”; 히브리어 동사 לְהִתְרֹעֵעַ는 뜻이 어려워 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: A man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 אישׁ은 여기서 대표적 단수 인물을 가리키므로 한국어에서는 자연스러운 일반 명사 ‘사람’으로 옮겼습니다. 남성 대표성을 과도하게 드러내지 않으면서도 잠언의 일반성을 살립니다.
- source_word: רֵעִים
  english_pob_choice: companions
  chosen_korean: 사귐이 많은 사람
  alternatives_korean:
  - 동무가 많은 사람
  - 친구가 많은 사람
  - 교제하는 사람이 많은 사람
  lexicon: HALOT
  rationale: רֵעִים은 단순한 ‘친구들’보다 폭넓게 동반자·교제 상대를 가리킬 수 있어, 첫 절의 긍정적 친밀함을 미리 확정하지 않는 방향으로 ‘사귐’의 뉘앙스를 살렸습니다.
- source_word: לְהִתְרֹעֵעַ
  english_pob_choice: may come to ruin
  chosen_korean: 무너질 수 있다
  alternatives_korean:
  - 파멸할 수 있다
  - 망할 수 있다
  - 친해져야 한다
  lexicon: HALOT
  rationale: 이 동사는 해석이 어려워 ‘친하게 행동하다’와 ‘무너지다/파괴되다’ 두 계열로 이해될 수 있습니다. 본문 대비상 많은 사귐이 결국 무너짐으로 이어질 수 있다는 의미를 살려, 단정적이지 않게 ‘무너질 수 있다’로 옮겼습니다.
- source_word: דָּבֵק
  english_pob_choice: sticks closer
  chosen_korean: 더 가까이 붙어 있는
  alternatives_korean:
  - 더 굳게 붙어 있는
  - 더 밀착하여 있는
  - 더 충실히 달라붙는
  lexicon: HALOT
  rationale: דָּבֵק은 ‘붙다, 달라붙다, 밀착하다’의 강한 접착 이미지를 가지므로, 한국어에서 관계의 밀착성을 자연스럽게 드러내는 ‘더 가까이 붙어 있는’으로 옮겼습니다.
