base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
  footnotes:
  - marker: a
    text: Or 'like dainty bits'; the rare Hebrew term may also be understood as 'like wounds' or 'like things greedily swallowed.'
    reason: lexical_alternative
  - marker: b
    text: '''The inner chambers of the belly'' is a Hebrew idiom for a person''s inmost being.'
    reason: cultural_note
translation:
  language: ko
  text: 험담하는 자의 말은 맛있는 음식 조각[a]과 같아서 사람의 배 속 깊은 곳[b]으로 내려갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희귀한 표현은 ‘맛있는 한입거리’로도, ‘상처들’ 또는 ‘탐욕스럽게 삼킨 것들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배 속 깊은 곳’은 사람의 가장 깊은 속을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말은
  alternatives_korean:
  - 말씀은
  - 말들이
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘말들/말씀들’에 해당하지만, 잠언의 일반적 문맥에서 한국어는 단수 주어처럼 묶어 ‘말은’으로 자연스럽게 옮기는 편이 수월합니다.
- source_word: נִרְגָּן
  english_pob_choice: a whisperer
  chosen_korean: 중상하는 자
  alternatives_korean:
  - 수군거리는 자
  - 험담하는 자
  - 불평하는 자
  lexicon: HALOT
  rationale: 이 단어는 은밀하게 남을 깎아내리거나 분열을 일으키는 말을 하는 사람을 가리키므로, 단순한 ‘수군거림’보다 해악을 드러내는 ‘중상하는 자’가 문맥상 더 적절합니다.
- source_word: כְּמִתְלַהֲמִים
  english_pob_choice: like delicious morsels
  chosen_korean: 달콤한 음식 같은 것이라
  alternatives_korean:
  - 맛있는 한입거리 같은 것이라
  - 다진 음식 조각 같은 것이라
  - 상처 같은 것이라
  lexicon: HALOT
  rationale: 어려운 표현이라 해석이 갈리지만, POB의 선택처럼 ‘달콤한 음식/한입거리’의 이미지를 살려 잠언의 비유성을 유지했습니다.
- source_word: חַדְרֵי בָטֶן
  english_pob_choice: the inner chambers of the belly
  chosen_korean: 배 깊은 곳
  alternatives_korean:
  - 내면 깊은 곳
  - 속 깊은 방들
  - 배의 골방들
  lexicon: HALOT
  rationale: 직역하면 ‘배의 방들’이지만, 한국어에서는 관용적 의미인 사람의 가장 깊은 속을 드러내기 위해 ‘배 깊은 곳’으로 옮겼습니다.
theological_decisions:
- issue: ‘배 깊은 곳’의 관용구 처리
  chosen_reading: 본문의 신체 은유를 유지하되, 한국어에서는 사람의 내면 깊숙한 곳을 가리키는 관용으로 읽히게 했습니다.
  alternative_readings:
  - ‘배의 골방들’처럼 더 직역하는 방식
  - ‘마음속 깊은 곳’처럼 완전히 추상화하는 방식
  rationale: 히브리어 관용구는 신체적 이미지와 내면적 의미를 함께 지니므로, 둘 중 하나만 택해 희석하지 않도록 중간 정도의 직역-의역 균형을 잡았습니다.
  doctrine_reference: 잠언의 지혜 문학에서 비유와 관용구를 보존하는 번역 원칙
