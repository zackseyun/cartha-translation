lexical_decisions:
- source_word: מִדְיָנִים
  english_pob_choice: disputes
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 논쟁
  - 시비
  lexicon: HALOT
  rationale: 복수 명사는 갈등이나 시비를 가리키므로, 현대 한국어에서 자연스러운 '다툼'으로 옮겨 분쟁의 성격을 살렸습니다.
- source_word: יַשְׁבִּית
  english_pob_choice: puts an end to
  chosen_korean: 그치게 하고
  alternatives_korean:
  - 끝나게 하고
  - 중단시키고
  - 잠재우고
  lexicon: HALOT
  rationale: 사역형의 '그치게 하다'가 원문의 '멈추게 함'을 비교적 직접적으로 살리면서도 한국어 문장에 자연스럽습니다.
- source_word: הַגּוֹרָל
  english_pob_choice: the lot
  chosen_korean: 제비
  alternatives_korean:
  - 제비뽑기
  - 운명
  - 추첨
  lexicon: HALOT
  rationale: גורל은 판정에 쓰는 제비를 가리키므로, 성경 문맥에서 익숙하면서도 간결한 '제비'를 택했습니다.
- source_word: עֲצוּמִים
  english_pob_choice: the mighty
  chosen_korean: 강한 자들
  alternatives_korean:
  - 힘센 자들
  - 유력한 자들
  - 권세 있는 자들
  lexicon: HALOT
  rationale: 형용사 자체가 강함과 힘을 뜻하므로, 개체를 덧붙이지 않으면서도 한국어에서 널리 이해되는 '강한 자들'로 옮겼습니다.
- source_word: יַפְרִיד
  english_pob_choice: separates between
  chosen_korean: 사이를 갈라놓습니다
  alternatives_korean:
  - 사이를 가릅니다
  - 서로를 구분합니다
  - 결정합니다
  lexicon: HALOT
  rationale: פרד의 기본 의미인 '나누다/갈라놓다'를 살려, 판정의 결과를 암시하되 직접적·구체적인 이미지를 유지했습니다.
theological_decisions:
- issue: 제비의 기능을 '판결'로 풀지, 원문 이미지인 '갈라놓음'으로 둘지
  chosen_reading: 원문 이미지에 따라 제비가 다툼을 그치게 하고 강한 자들 사이를 갈라놓는다고 표현했습니다.
  alternative_readings:
  - 제비는 다툼을 해결하고, 강한 자들 사이를 판정합니다.
  - 제비는 다툼을 끝내고, 강한 자들 사이를 결정합니다.
  rationale: 히브리어는 제비 자체의 분쟁 종결 기능과 당사자 사이의 분리를 병렬로 제시하므로, 해석을 앞세운 '판정하다/결정하다'보다 '갈라놓다'를 유지하는 편이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 잠 16:33과 함께 제비를 통한 하나님의 주권적 판정이라는 문맥
