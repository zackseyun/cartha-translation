translation:
  language: ko
  text: 제비는 다툼을 그치게 하고, 강한 자들 사이를 갈라놓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '제비는 다툼을 해결하고 강한 자들 사이를 결정합니다.'
