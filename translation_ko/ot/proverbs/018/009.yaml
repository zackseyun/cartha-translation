  text: Even one who is slack in his work is brother to a master of destruction[a].
  footnotes:
  - marker: a
    text: Or, 'is brother to a destroyer.' The Hebrew phrase may point either to a person characterized by destruction or more concretely to one who destroys.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 자는 자기 일에 있어서 파괴하는 자의 형제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '파괴하는 자의 형제입니다.' 히브리어 구문은 파괴라는 성격을 지닌 사람을 가리키거나, 더 구체적으로 실제로 파괴하는 사람을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 게으른 자는 …입니다
  alternatives_korean:
  - 심지어 …입니다
