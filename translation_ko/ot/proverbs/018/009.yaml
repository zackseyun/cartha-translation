  lexicon: HALOT
  rationale: 본문의 גַּם은 여기서 놀라운 대조를 강조하므로, 한국어에서는 전면 배치와 문장 구조로 그 강조를 살렸습니다.
- source_word: מִתְרַפֶּה
  english_pob_choice: one who is slack
  chosen_korean: 게으른 자
