  - 멸망을 일으키는 자
  lexicon: HALOT
  rationale: 문구는 파괴를 특징으로 하는 사람을 가리키거나 실제로 파괴하는 자를 뜻할 수 있으므로, 한국어에서는 형용사적 서술을 통해 두 가능성을 모두 담았습니다.
