  rationale: 히트파엘 분사는 태만하게 자신을 풀어 놓는 성격을 나타내므로, 현대 한국어에서 자연스럽고 인물 성격을 드러내는 '게으른 자'로 옮겼습니다.
- source_word: בִמְלַאכְתּוֹ
  english_pob_choice: in his work
  chosen_korean: 자기 일에 있어서
