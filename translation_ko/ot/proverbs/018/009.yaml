  lexicon: HALOT
  rationale: מְלָאכָה는 특정 직업만이 아니라 맡은 일 전반을 가리킬 수 있어, 현대어에서 넓은 의미를 유지하는 표현을 택했습니다.
- source_word: לְבַעַל מַשְׁחִית
