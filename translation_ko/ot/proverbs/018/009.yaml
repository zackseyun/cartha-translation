  text: Even one who is slack in his work is brother to a master of destruction[a].
  footnotes:
  - marker: a
    text: Or, 'is brother to a destroyer.' The Hebrew phrase may point either to a person characterized by destruction or more concretely to one who destroys.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 일에 게으른 사람도 파괴를 일삼는 자의 형제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 '파괴의 주인'입니다. 이는 파괴를 특징으로 하는 사람을 가리킬 수도 있고, 실제로 파괴하는 사람을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 게으른 자는 …입니다
  alternatives_korean:
