id: PRO.18.10
reference: Proverbs 18:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
  footnotes:
  - marker: a
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Or 'the righteous,' with representative force; Hebrew singular masculine.
    reason: lexical_alternative
  - marker: c
    text: Or 'is safe' / 'is protected'; the Hebrew verb suggests being set in a high, inaccessible place.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 이름은 견고한 망대입니다[a]. 의인은[b] 그 안으로 달려가 높은 곳에 안전히 세워집니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주’로 옮기기도 하지만, 여기서는 신적 고유 이름을 따라 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 단수 남성형이며, 대표성을 띤 ‘의인’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘안전하다’ 또는 ‘보호받다’로 옮길 수 있습니다. 히브리어 동사는 높고 접근하기 어려운 곳에 놓이는 이미지를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  english_pob_choice: strong tower
  chosen_korean: 견고한 망대
  alternatives_korean:
  - 강한 탑
  - 강한 망루
  - 튼튼한 망대
  lexicon: HALOT
  rationale: מִגְדַּל은 방어적 높이 구조물인 ‘망대’로, עֹז는 그 성격을 강화하므로 한국어에서는 ‘견고한 망대’가 가장 직접적이고 자연스럽습니다.
- source_word: שֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 야훼의 이름
  alternatives_korean:
  - 여호와의 이름
  - 주님의 이름
  lexicon: HALOT
  rationale: 본문은 신적 호칭이 아니라 고유한 언약 이름 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 그 이름 자체의 신학적 밀도를 보존했습니다.
- source_word: בּוֹ יָרוּץ
  english_pob_choice: runs into it
  chosen_korean: 그리로 달려가
  alternatives_korean:
  - 그 안으로 달려가
  - 거기로 달려들어
  - 그것 안으로 달려가
  lexicon: HALOT
  rationale: 전치사+접미사는 앞선 비유적 대상(망대/이름)을 가리키므로, 한국어에서는 ‘그리로’로 자연스럽게 연결해 피난의 급박함을 살렸습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 의인(그 사람)
  lexicon: HALOT
  rationale: 히브리어 단수 남성 형용사의 명사적 용법을 한국어 성서문체에 맞게 간결하게 ‘의인’으로 옮겼습니다.
- source_word: נִשְׂגָּב
  english_pob_choice: is set securely on high
  chosen_korean: 안전하게 높임을 받습니다
  alternatives_korean:
  - 높은 곳에 안전히 세워집니다
  - 안전하게 높아집니다
  - 높은 곳에 올려집니다
  lexicon: HALOT
  rationale: נִשְׂגָּב은 ‘높아져 접근 불가능한 상태’라는 뜻을 담으므로, 단순한 ‘안전함’보다 ‘높임을 받다’로 위쪽 이미지와 보호 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 쓰므로, 대체 칭호인 ‘주’보다 고유 이름을 드러내는 ‘야훼’가 원문과 POB 주해 방향에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 의인의 수사적 성격
  chosen_reading: 의인
  alternative_readings:
  - 의로운 사람
  - 의로운 자
  - 의인들
  rationale: 히브리어 단수는 속담적 대표성을 가지므로, 한국어에서는 남성성 과잉을 피하면서도 일반적 대표 인물을 가리키는 ‘의인’으로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
