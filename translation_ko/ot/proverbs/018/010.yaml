    issue: ‘안전하게 높임을 받습니다’는 נִשְׂגָּב을 존귀하게 승격되는 뜻으로 오해하게 할 수 있습니다.
    rationale: 이 문맥의 니팔형은 피난처의 비유 안에서 높은, 접근하기 어려운 곳에 놓여 안전해지는 의미입니다. ‘높은 곳에 안전히 세워집니다’가 공간적·보호적 이미지를 더 충실히 보존합니다.
  - severity: low
    issue: ‘그리로’는 בּוֹ의 ‘그 안으로’라는 피난처 방향성을 다소 약화합니다.
    rationale: 선행하는 ‘망대’를 직접 이어 주는 ‘그 안으로’가 비유의 공간적 일관성을 높입니다.
