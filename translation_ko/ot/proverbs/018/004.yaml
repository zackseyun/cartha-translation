id: PRO.18.4
reference: Proverbs 18:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַ֣יִם עֲ֭מֻקִּים דִּבְרֵ֣י פִי אִ֑ישׁ נַ֥חַל נֹ֝בֵ֗עַ מְק֣וֹר חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
  footnotes:
  - marker: a
    text: Or 'The words of a man's mouth are deep waters, a flowing brook, a fountain of wisdom.' The Hebrew can be read so that both water images describe the words themselves rather than making the second line a separate statement about wisdom.
    reason: alternative_reading
  - marker: b
    text: '''Man'' renders Hebrew אִישׁ, a masculine singular term used here in proverbial style for an individual speaker.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 입에서 나오는 말은 깊은 물들과 같고, 지혜의 샘은 흐르는 시내입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 행의 ‘깊은 물들’과 둘째 행의 물 이미지를 함께 읽을 수 있어, ‘지혜의 샘’이 별도 진술이 아니라 사람의 말에 대한 추가 비유로 이해될 여지도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אִישׁ은 여기서 특정한 남자라기보다 잠언식 일반 표현으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  english_pob_choice: deep waters
  chosen_korean: 깊은 물들
  alternatives_korean:
  - 깊은 물
  - 깊은 물줄기
  lexicon: HALOT
  rationale: 복수형 מים의 물 이미지를 살리되, 한국어에서는 ‘물들’보다 ‘깊은 물들’이 시적 병렬에 자연스럽습니다.
- source_word: דִּבְרֵי פִי אִישׁ
  english_pob_choice: The words of a man's mouth
  chosen_korean: 사람의 입에서 나오는 말은
  alternatives_korean:
  - 한 사람의 입의 말은
  - 남자의 입에서 나오는 말은
  lexicon: HALOT
  rationale: 히브리어 이시(אִישׁ)는 잠언식 일반화를 띤 개인을 가리키므로, 현대 한국어에서는 성별 표지보다 보편적 독자를 고려한 ‘사람’이 문맥을 더 자연스럽게 전달합니다.
- source_word: נַחַל נֹבֵעַ
  english_pob_choice: a flowing brook
  chosen_korean: 흐르는 시내
  alternatives_korean:
  - 흐르는 개울
  - 솟아나는 시내
  - 흐르는 물줄기
  lexicon: HALOT
  rationale: נַחַל은 시내/개울의 물 이미지를 살릴 수 있고, נֹבֵעַ는 흘러나옴을 나타내므로 ‘흐르는 시내’가 샘의 이미지와 가장 매끄럽게 대응합니다.
- source_word: מְקוֹר חָכְמָה
  english_pob_choice: the fountain of wisdom
  chosen_korean: 지혜의 샘
  alternatives_korean:
  - 지혜의 원천
  - 지혜의 샘물
  lexicon: HALOT
  rationale: מְקוֹר는 샘/원천의 뜻이므로, 잠언의 물 비유를 유지하면서 한국어에서 자연스러운 ‘지혜의 샘’으로 옮겼습니다.
theological_decisions:
- issue: '문장의 관계성: 두 개의 수면 이미지가 한 진술인지, 두 번째 행이 지혜에 대한 별도 진술인지'
  chosen_reading: 표면 번역은 현재 본문처럼 첫 행의 비유와 둘째 행의 독립 진술을 살리되, 둘 다 물의 이미지를 유지합니다.
  alternative_readings:
  - ‘사람의 입에서 나오는 말은 깊은 물들, 흐르는 시내, 지혜의 샘이다’로 한 덩어리로 읽는 방식
  rationale: 히브리어는 양쪽으로 읽힐 여지가 있으나, 한국어 본문은 문장 호흡을 분리해 POB의 기본 해석을 따르면서도 원문의 긴장과 이미지 중첩을 보존합니다.
  doctrine_reference: 잠언의 시적 병렬과 다의적 수사
