  source_fidelity: 첫째 절의 ‘멸망 전에’와 ‘사람의 마음은 교만해지고’는 히브리어의 시간적 관계와 ‘마음이 높아지다’라는 관용을 대체로 충실히 반영합니다. 그러나 כָבוֹד는 이 문맥에서 사회적 존귀·명예를 뜻하므로, ‘영광’보다 ‘존귀’가 더 정확합니다. 또한 둘째 절은 동사가 없는 명사절이므로 ‘겸손이 옵니다’보다 ‘겸손이 있습니다’가 원문의 간결한 병행을 더 잘 보존합니다.
