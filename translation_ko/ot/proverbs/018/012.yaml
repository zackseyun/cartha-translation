theological_decisions:
- issue: 대구법에서의 인과적·시간적 대비
  chosen_reading: 멸망과 영광이라는 두 결과 앞에 각각 교만과 겸손이 선행한다는 교훈적 대조로 읽었습니다.
  alternative_readings:
  - 단순한 시간 순서만을 말하는 격언
  - ‘멸망’과 ‘영광’의 인격화된 운명 표현
  rationale: 히브리어 평행구조가 도덕적 원인과 결과를 암시하므로, 한국어에서도 ‘~ 전에’ 반복을 유지해 교훈성을 드러냈습니다.
  doctrine_reference: 잠언의 지혜 문학적 평행법
