source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
  footnotes:
  - marker: a
    text: Or 'a person's heart.' The Hebrew has 'a man's heart,' using a masculine singular form in a generic proverbial sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 멸망 전에 사람의 마음은 교만해지고, 영광 전에 겸손이 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘남자’의 단수형을 사용하지만, 잠언의 일반적 격언에서 사람 전체를 가리키는 관용으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  english_pob_choice: Before
  chosen_korean: ~ 전에
  alternatives_korean:
  - ~ 앞에
  - ~의 앞에서
  lexicon: HALOT
  rationale: 시간적 선행 관계를 나타내는 전치사로, 두 절에 같은 표현을 써 평행 구조를 분명하게 살렸습니다.
- source_word: שֶׁבֶר
  english_pob_choice: destruction
  chosen_korean: 멸망
  alternatives_korean:
  - 파괴
  - 붕괴
  - 파멸
  lexicon: HALOT
  rationale: 잠언의 경고적 문맥에서 단순한 물리적 ‘깨짐’보다 도덕적·실존적 붕괴를 드러내는 말이 적절하여 ‘멸망’으로 옮겼습니다.
- source_word: יִגְבַּהּ לֵב אִישׁ
  english_pob_choice: a man's heart is haughty
  chosen_korean: 사람의 마음은 교만해지고
  alternatives_korean:
  - 한 남자의 마음은 높아지고
  - 사람의 마음은 높아집니다
  - 사람의 마음은 거만해집니다
  lexicon: HALOT
  rationale: ‘마음이 높다’는 히브리어 관용을 한국어에서 자연스러운 도덕 평가로 풀어 ‘교만해지다’로 옮겼습니다. 일반적 격언 문맥이므로 성별 표지는 본문 의미를 해치지 않는 범위에서 ‘사람’으로 반영했습니다.
- source_word: עֲנָוָה
  english_pob_choice: humility
  chosen_korean: 겸손
  alternatives_korean:
  - 온유
  - 낮아짐
  - 비천함
  lexicon: HALOT
  rationale: 행위의 태도와 성품을 가리키는 일반적 덕목으로서 현대 한국어에서 가장 분명한 대응어는 ‘겸손’입니다.
theological_decisions:
- issue: 대구법에서의 인과적·시간적 대비
  chosen_reading: 멸망과 영광이라는 두 결과 앞에 각각 교만과 겸손이 선행한다는 교훈적 대조로 읽었습니다.
  alternative_readings:
  - 단순한 시간 순서만을 말하는 격언
  - ‘멸망’과 ‘영광’의 인격화된 운명 표현
  rationale: 히브리어 평행구조가 도덕적 원인과 결과를 암시하므로, 한국어에서도 ‘~ 전에’ 반복을 유지해 교훈성을 드러냈습니다.
  doctrine_reference: 잠언의 지혜 문학적 평행법
