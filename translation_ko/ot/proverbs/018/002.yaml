id: PRO.18.2
reference: Proverbs 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יַחְפֹּ֣ץ כְּ֭סִיל בִּ/תְבוּנָ֑ה כִּ֝֗י אִֽם בְּ/הִתְגַּלּ֥וֹת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
  footnotes:
  - marker: a
    text: Or 'but rather in exposing what is in his heart.' Here 'heart' refers to the inner thoughts and inclinations, not merely emotions.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람은 분별을 즐기지 않으며, 오직 자기 마음을 드러내는 것에서만 즐거움을 얻습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 마음속에 있는 것을 드러내는 것.” 원문의 ‘마음’은 단순한 감정만이 아니라 생각과 성향을 포함한 내면을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  english_pob_choice: does not delight in
  chosen_korean: 즐기지 않고
  alternatives_korean:
  - 좋아하지 않고
  - 기뻐하지 않고
  - 원하지 않고
  lexicon: HALOT
  rationale: חפץ는 단순한 의욕보다 ‘기뻐하다/즐기다’의 뉘앙스가 강하므로, 지혜문학의 태도적 의미를 살려 자연스럽게 옮겼습니다.
- source_word: כְּסִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우둔한 사람
  - 미련한 사람
  - 어리석은 자
  lexicon: HALOT
  rationale: כְּסִיל은 지적 능력만이 아니라 도덕적·지혜적 완고함을 가리키므로, 현대 한국어에서 낙인감은 줄이되 의미는 유지하는 표현을 택했습니다.
- source_word: תְבוּנָה
  english_pob_choice: understanding
  chosen_korean: 이해하기
  alternatives_korean:
  - 분별
  - 통찰
  - 깨달음
  lexicon: HALOT
  rationale: 지혜문맥의 תבונה를 추상명사 ‘이해’보다 행위 중심의 ‘이해하기’로 옮겨, 앞의 ‘즐기지 않다’와 자연스럽게 대응시켰습니다.
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 자기 마음
  alternatives_korean:
  - 그의 마음
  - 속마음
  - 내면
  lexicon: HALOT
  rationale: לֵב는 단순 감정보다 생각과 의지까지 포함하는 내면을 뜻하므로, 한국어에서 그 범위를 비교적 넓게 담는 ‘마음’을 사용했습니다.
theological_decisions:
- issue: ‘마음’의 의미 범위
  chosen_reading: ‘자기 마음을 드러내는 것’은 감정 표출만이 아니라 내면의 생각과 성향을 밖으로 드러내는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 속마음을 말한다
  - 감정만 노출한다
  rationale: 히브리어 לֵב는 사고·의지·성향을 포함하는 내면을 가리키므로, 본문은 감정 배출보다 내면의 자기현시를 말하는 것으로 보아야 합니다.
  doctrine_reference: 성서적 인간 이해
