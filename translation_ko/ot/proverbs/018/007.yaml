  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
  footnotes:
  - marker: a
    text: Or 'A fool’s mouth is destruction to him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his soul'; here likely meaning 'his life' or 'himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자의 입은 자기의 멸망이 되고, 그의 입술은 그의 생명의 덫이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 מְחִתָּה는 ‘멸망’ 또는 ‘파괴’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 영혼’은 여기서 ‘그의 생명’ 또는 ‘그 자신’을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  english_pob_choice: mouth
  chosen_korean: 입
  alternatives_korean:
  - 입술
  - 말
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지와 잠언의 간결한 표현을 살리면서, 한국어에서는 ‘입’이 발화의 근원을 자연스럽게 드러냅니다.
- source_word: כְסִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 바보
  - 우매한 사람
  lexicon: HALOT
  rationale: 잠언의 지혜문맥에서 단순 지능이 아니라 도덕적·영적 어리석음을 가리키므로, 비격식적인 ‘바보’보다 ‘어리석은 자’가 더 정확합니다.
- source_word: מְחִתָּה
  english_pob_choice: ruin
  chosen_korean: 멸망
  alternatives_korean:
  - 파멸
  - 파괴
  - 파국
  lexicon: HALOT
  rationale: ‘ruin/destruction’ 계열의 의미를 담되, 앞절의 이미지와 평행을 이루는 결과로서 한국어 성경 문맥에 자연스럽고 강한 ‘멸망’을 택했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 생명
  alternatives_korean:
  - 혼
  - 목숨
  - 자기
  lexicon: HALOT
  rationale: 문맥상 ‘soul’의 형이상학적 의미보다 사람의 생명/목숨을 가리키므로, 한국어에서는 오해를 줄이는 ‘생명’이 가장 적절합니다.
theological_decisions:
- issue: נֶפֶשׁ(נַפְשׁוֹ)의 번역 범위
  chosen_reading: ‘그의 생명’으로 번역해, 영혼의 추상적 개념보다 생명 자체가 덫에 걸린다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘그의 혼’
  - ‘그 자신’
  rationale: 잠언의 지혜 격언에서는 נֶפֶשׁ이 흔히 사람의 생명/자기 자신을 뜻하므로, 본문이 경고하는 실제적 파괴를 분명히 하는 쪽이 원문에 충실합니다.
  doctrine_reference: 지혜문학의 인체적·실존적 נֶפֶשׁ 용법
