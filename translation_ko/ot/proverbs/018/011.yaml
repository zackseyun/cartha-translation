  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
  footnotes:
  - marker: a
    text: Or 'in his mind,' 'in his perception,' or 'in his conceit.' The Hebrew term refers to a mental image or way of seeing.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자의 재물은 그의 견고한 성읍이며, 그가 생각하기에는[a] 높은 성벽과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음속에서는’, ‘그의 인식에서는’, ‘그의 자만심 속에서는’. 히브리어는 정신적 형상, 마음속의 표상, 또는 보는 방식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 재산
  - 부유함
  lexicon: HALOT
  rationale: 물질적 소유와 자산을 가리키는 일반적 의미를 살려, 현대 한국어에서 자연스러운 ‘재물’로 옮겼습니다.
- source_word: עָשִׁיר
  english_pob_choice: rich man’s
  chosen_korean: 부자의
  alternatives_korean:
  - 부유한 사람의
  - 부유자의
  - 부자의 것
  lexicon: HALOT
  rationale: 형용사가 실질적으로 명사처럼 쓰인 점을 반영해, 일반 원리를 나타내는 단수 남성형을 자연스럽게 ‘부자’로 옮겼습니다.
- source_word: קִרְיַת עֻזּוֹ
  english_pob_choice: his strong city
  chosen_korean: 견고한 성읍
  alternatives_korean:
  - 그의 힘의 성읍
  - 그의 요새 도시
  - 그의 견고한 성읍
  lexicon: HALOT
  rationale: ‘성읍’은 도시-요새 이미지를 유지하며, ‘עֹז’의 강함을 ‘견고한’으로 풀어 방어적 은유를 살렸습니다.
- source_word: בְּמַשְׂכִּיתוֹ
  english_pob_choice: in his imagination
  chosen_korean: 그의 상상 속에서는
  alternatives_korean:
  - 그의 생각에는
  - 그의 마음속에는
  - 그의 인식 속에서는
  lexicon: HALOT
  rationale: 이 단어가 मानसिक 이미지나 인식 방식을 가리킬 수 있으므로, 단순한 ‘생각’보다 주관적이고 때로는 허상일 수 있는 뉘앙스를 담는 ‘상상 속’으로 옮겼습니다.
theological_decisions:
- issue: 문장 끝의 비교절을 어떻게 처리할지
  chosen_reading: ‘… 그의 상상 속에서는 높은 성벽과 같습니다’로, 실제 방어력의 진술이 아니라 주관적 인식을 드러내는 비교로 유지했습니다.
  alternative_readings:
  - ‘… 그의 마음에는 높은 성벽입니다’
  - ‘… 그의 생각에는 높은 성벽과 같습니다’
  rationale: 히브리어가 부자의 재물을 실제 안전이 아니라 그가 그렇게 여긴다는 인식을 드러내므로, 비교적 해석을 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학은 현실의 진실과 인간 인식을 대비시켜 교훈을 줍니다.
