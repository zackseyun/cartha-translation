  to: 부자의 재물은 그의 견고한 성읍이며, 그가 생각하기에는[a] 높은 성벽과 같습니다.
  rationale: 원문의 두 은유를 유지하되, 마지막 전치사구를 ‘그가 생각하기에는’으로 옮겨 재물이 높은 성벽과 같다고 여겨지는 주체가 부자임을 분명히 했습니다. 이는 본문의 주관적 인식이라는 의미를 보존하며, ‘상상’으로 한정하지 않는 원어의 의미 범위는 각주에 남겼습니다.
