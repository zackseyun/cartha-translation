id: PRO.18.14
reference: Proverbs 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
  footnotes:
  - marker: a
    text: Or 'A person's spirit can sustain him in illness.' The Hebrew uses singular masculine 'man' in a representative proverbial sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'a broken spirit' instead of 'a crushed spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 영은 병든 몸을 견디게 하지만, 꺾인 영은 누가 감당할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘병든 몸’은 원문의 ‘그의 병’(מַחֲלֵהוּ)을 자연스럽게 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘꺾인’은 ‘부서진/짓눌린/상한’ 등으로도 옮길 수 있는 נְכֵאָה의 번역 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 기운
  - 정신
  lexicon: HALOT
  rationale: 지혜문학의 대조 구조에서 육체적 병과 대비되는 내적 생명력·인격의 중심을 가리키므로, 일반적 심리어보다 성경적 뉘앙스를 살리는 ‘영’이 적절합니다.
- source_word: אִישׁ
  english_pob_choice: a man's
  chosen_korean: 사람의
  alternatives_korean:
  - 한 남자의
  - 인간의
  lexicon: HALOT
  rationale: 히브리어 단수 남성형이지만 잠언의 대표적 속담 용법이므로, 한국어에서는 성별을 과도하게 부각하지 않는 ‘사람의’로 자연스럽게 옮겼습니다.
- source_word: יְכַלְכֵּל
  english_pob_choice: can sustain
  chosen_korean: 견디게 하지만
  alternatives_korean:
  - 붙들어 줍니다
  - 지탱할 수 있습니다
  - 버티게 합니다
  lexicon: HALOT
  rationale: 이 동사는 ‘부양하다/지탱하다/유지하다’의 뜻이 있어, 병중에 사람을 버티게 하는 기능을 살려 ‘견디게 하다’로 표현했습니다.
- source_word: נְכֵאָה
  english_pob_choice: crushed
  chosen_korean: 꺾인
  alternatives_korean:
  - 부서진
  - 상한
  - 짓눌린
  lexicon: HALOT
  rationale: ‘짓눌린/상한’의 폭넓은 의미를 가지며, 내적 기세가 꺾인 상태를 압축적으로 드러내는 한국어로 ‘꺾인’이 적합합니다.
theological_decisions:
- issue: 속담의 대표성 있는 남성 단수 표현 처리
  chosen_reading: ‘사람의’로 번역해 대표적 속담 일반성을 살리되, 원문의 단수 남성형이 지닌 형식은 과도하게 성별화하지 않았습니다.
  alternative_readings:
  - ‘한 남자의’로 옮겨 형식을 더 가깝게 유지하는 방법
  - ‘한 사람의’로 더 중립화하는 방법
  rationale: 잠언의 일반 진술은 특정 성별보다 보편적 교훈을 의도하므로, 본문 기능을 우선하면서도 원문의 대표성은 유지하는 쪽이 적절합니다.
  doctrine_reference: 잠언의 일반적 지혜 진술과 대표적 인칭 용법
- issue: 후반부 수사 의문문의 압박감 전달
  chosen_reading: ‘누가 감당할 수 있겠습니까?’로 옮겨 단순한 가능성 질문이 아니라 견딜 수 없음의 수사적 강도를 살렸습니다.
  alternative_readings:
  - ‘누가 견딜 수 있습니까?’
  - ‘누가 이것을 맡을 수 있겠습니까?’
  rationale: 원문의 ‘누가…할 수 있느냐’는 불가능성을 강조하는 수사적 질문이므로, 한국어에서도 감당 불가의 뉘앙스를 분명히 해야 합니다.
  doctrine_reference: 지혜문학의 수사적 질문과 대구법
