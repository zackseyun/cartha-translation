id: PRO.18.19
reference: Proverbs 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
  footnotes:
  - marker: a
    text: Or 'A brother wronged is harder to win than a fortified city.' The Hebrew participle can emphasize one who has been wronged/offended, leading to either 'offended' or 'wronged' in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'and disputes are like the bar of a citadel/palace.' The final noun can denote either a fortified residence ('citadel') or 'palace,' but the defensive context favors 'citadel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 배신당한 형제는 견고한 성보다 접근하기 어렵고, 다툼은 요새의 빗장과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘배신당한’은 히브리어 분사의 관계적 파열 뉘앙스를 살린 해석적 번역입니다. 직역하면 ‘잘못을 당한’ 또는 ‘모욕당한’이 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요새’는 히브리어 אַרְמוֹן의 문맥상 방어적 의미를 살린 번역입니다. 문자적으로는 ‘성채’나 ‘궁전’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  english_pob_choice: brother
  chosen_korean: 형제
  alternatives_korean:
  - 형님
  - 동족
  - 친족
  lexicon: HALOT
  rationale: 히브리어 אָח의 기본 뜻을 따라 관계적 근접성을 살리되, 잠언의 격언체에 자연스러운 ‘형제’로 옮겼습니다.
- source_word: נִפְשָׁע
  english_pob_choice: offended
  chosen_korean: 배신당한
  alternatives_korean:
  - 모욕을 받은
  - 원한을 품은
  - 잘못을 당한
  lexicon: HALOT
  rationale: 이 분사는 관계가 깨진 상태를 가리킬 수 있으므로, 단순 감정상 상처보다 더 강한 관계적 파열을 드러내는 표현을 택했습니다. 영어 POB의 ‘offended/wronged’ 긴장을 한국어에서 보존하기 위한 선택입니다.
- source_word: מִקִּרְיַת עֹז
  english_pob_choice: than a fortified city
  chosen_korean: 견고한 성보다 접근하기 어렵고
  alternatives_korean:
  - 요새화된 성보다
  - 견고한 성보다
  - 튼튼한 성보다
  lexicon: HALOT
  rationale: ‘성읍의 견고함’보다 ‘접근하기 어려움’이라는 비교의 핵심을 살려, 잠언적 의미를 더 직접적으로 전달했습니다.
- source_word: וּמְדֹנִים
  english_pob_choice: and quarrels
  chosen_korean: 다툼은
  alternatives_korean:
  - 분쟁은
  - 논쟁은
  - 다투는 일은
  lexicon: HALOT
  rationale: 복수 명사로서의 스트라이프/분쟁을, 한국어 잠언체에서 가장 자연스러운 ‘다툼’으로 옮겼습니다.
- source_word: כִּבְרִיחַ אַרְמֹן
  english_pob_choice: are like the bars of a citadel
  chosen_korean: 요새의 빗장과 같습니다
  alternatives_korean:
  - 성채의 빗장과 같습니다
  - 궁전의 빗장과 같습니다
  - 성의 빗장과 같습니다
  lexicon: HALOT
  rationale: בְּרִיחַ는 문을 잠그는 빗장/쇠막대이고, אַרְמוֹן은 문맥상 방어적 강건함을 강조하므로 ‘요새’로 풀어 방어 이미지와 한국어 자연성을 함께 살렸습니다.
theological_decisions:
- issue: 관계 파열의 강도 표현
  chosen_reading: ‘배신당한 형제’로 번역해 단순한 감정적 서운함이 아니라 관계가 실제로 깨진 상태를 드러냈습니다.
  alternative_readings:
  - ‘모욕당한 형제’
  - ‘잘못을 당한 형제’
  rationale: פּשע 계열 분사는 여기서 법정적 피해보다 관계적 적대/결별의 뉘앙스를 띨 수 있어, 잠언의 경고성을 약화하지 않는 방향으로 옮겼습니다.
  doctrine_reference: 잠언의 지혜 문학 문맥상 인간 관계의 파괴력이 강조됨
