  verdict: revise
  source_fidelity: ‘배신당한’은 נִפְשָׁע(פּשע 계열)가 여기서 나타내는 ‘잘못을 당한/해를 입은/마음이 상한’ 관계적 피해보다 강한 특정 행위인 배신을 도입합니다. 또한 ‘접근하기 어렵고’는 히브리어의 비교 이미지, 곧 그 사람의 마음을 다시 얻거나 설득하기가 어렵다는 뜻을 충분히 전달하지 못합니다.
  naturalness: ‘잘못을 당한 형제는 견고한 성보다 마음을 얻기가 어렵습니다’는 한국어에서 자연스럽고, 생략된 술어를 과도하게 확정하지 않으면서 잠언의 비유를 분명히 합니다. ‘다툼’은 집합적으로 사용할 수 있어 복수 명사의 뜻을 자연스럽게 반영합니다.
  terminology: אָח는 ‘형제’가 적절합니다. נִפְשָׁע는 ‘잘못을 당한’으로 옮기고 대안 의미를 주석에 남기는 것이 안전합니다. אַרְמוֹן은 ‘궁전’과 ‘성채/요새’ 모두 가능한 어휘이므로, 본문에서 ‘궁전’을 사용하되 방어적 문맥에 따른 대안을 주석으로 보존합니다. בְּרִיחַ의 단수는 ‘빗장’으로 반영했습니다.
