translation:
  language: ko
  text: 악인이 오면 멸시도 오고, 수치와 함께 모욕도 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인이 오면 경멸도 오고, 수치와 함께 치욕도 옵니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא / בָּא
  english_pob_choice: When ... comes / comes
  chosen_korean: 올 때에 / 옵니다
  alternatives_korean:
  - 들어올 때에 / 들어옵니다
  - 이르게 될 때에 / 이릅니다
  lexicon: HALOT
  rationale: 전치사 ב가 붙은 부정사구와 동사 בוא의 반복을 한국어의 시간 부사절과 본동사 반복으로 자연스럽게 살렸습니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 사악한 사람
  - 악한 사람
  lexicon: HALOT
  rationale: 히브리어 단수 형용사/명사형을 대표적 인물로 읽어 ‘악인’으로 옮겼고, 속담 문맥상 집합적 의미도 유지했습니다.
- source_word: בּוּז
  english_pob_choice: contempt
  chosen_korean: 멸시
  alternatives_korean:
  - 경멸
  - 조롱
  lexicon: HALOT
  rationale: abstract 명사로서의 ‘부즈’의 의미를 살리면서, 다음 행의 명사들과 균형을 이루는 한국어 명사 ‘멸시’를 택했습니다.
- source_word: קָלוֹן / חֶרְפָּה
  english_pob_choice: dishonor ... reproach
  chosen_korean: 수치 ... 모욕
  alternatives_korean:
  - 불명예 ... 꾸지람
  - 치욕 ... 수치
  lexicon: HALOT
  rationale: 두 명사는 모두 사회적 수치와 공개적 망신의 뉘앙스를 가지므로, 중복을 피하면서도 병렬성을 살린 ‘수치’와 ‘모욕’으로 구분했습니다.
theological_decisions:
- issue: 악인/악함의 표현 방식
  chosen_reading: 행위 자체인 ‘악인’보다는 악을 특징으로 하는 사람을 가리키는 대표적 인물로 처리했습니다.
  alternative_readings:
  - 악함이 올 때에
  - 악한 사람이 올 때에
  rationale: 문맥상 추상명사보다 인물 표지가 더 자연스럽고, 속담의 일반화를 유지합니다. 영어 POB의 일시적 ‘wickedness’ 표기는 후속 수정으로 회수되었으므로 히브리어 원문에 맞춰 인물형을 반영했습니다.
  doctrine_reference: 잠언의 일반적 지혜 진술
- issue: 마지막 절의 ‘with’ 관계
  chosen_reading: ‘수치와 함께는’으로 보조적 동반 관계를 드러냈습니다.
  alternative_readings:
  - 수치가 오고
  - 수치와 더불어
  rationale: וְעִם의 동반 관계를 살리되 한국어 어순을 자연스럽게 하기 위해 ‘함께’를 넣었습니다. 과도한 의역 없이 병렬 구조를 유지합니다.
  doctrine_reference: 히브리어 병렬법
