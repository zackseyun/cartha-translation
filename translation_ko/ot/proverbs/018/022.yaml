base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'Whoever finds a wife finds good and obtains favor from the LORD.' The Hebrew uses a masculine singular form in a proverbial, representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 아내를 얻는 사람은 좋은 것을 얻고 야훼께로부터 은혜를 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 잠언적 대표를 위한 남성 단수형을 사용하므로, ‘누구든지 아내를 얻는 이는’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָא אִשָּׁה
  english_pob_choice: finds a wife
  chosen_korean: 아내를 얻는 사람은
  alternatives_korean:
  - 아내를 찾는 사람은
  - 여자를 얻는 사람은
  lexicon: HALOT
  rationale: אִשָּׁה는 이 잠언의 결합어법에서 일반적 ‘여자’보다 혼인 관계의 ‘아내’가 문맥상 분명하며, ‘얻는’은 한국어에서 배우자를 맞이해 갖게 되는 의미를 자연스럽게 담습니다.
- source_word: מָצָא טוֹב
  english_pob_choice: finds a good thing
  chosen_korean: 좋은 것을 얻고
  alternatives_korean:
  - 좋은 것을 찾고
  - 좋음을 얻고
  lexicon: HALOT
  rationale: טוֹב가 형용사적으로 실질화되어 ‘좋은 것’의 뜻을 이루므로, 한국어에서도 명사화해 ‘좋은 것’으로 옮기되 잠언적 평행을 살려 ‘얻고’로 연결했습니다.
- source_word: וַיָּפֶק רָצוֹן
  english_pob_choice: obtains favor
  chosen_korean: 야훼께로부터 은혜를 받습니다
  alternatives_korean:
  - 야훼께로부터 호의를 얻습니다
  - 야훼께로부터 은총을 얻습니다
  lexicon: HALOT
  rationale: רָצוֹן은 하나님께 관련될 때 ‘호의/은혜’의 뜻이 가능하지만, 한국어 성경에서 ‘은혜’가 더 자연스럽고 긍정적인 응답을 드러냅니다. ‘받습니다’는 וַיָּפֶק의 획득 의미를 살리되 문장을 부드럽게 합니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼께로부터
  alternatives_korean:
  - 야훼로부터
  - 주님께로부터
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기며, 전치사 מִן은 결과의 근원을 나타내는 ‘-께로부터’가 가장 자연스럽습니다.
theological_decisions:
- issue: יַהְוֶה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와 이름표를 직접 사용하므로, 프로젝트 기본값과 source-direct 원칙에 따라 ‘야훼’로 유지했습니다. 이는 본문의 언약적 신명성을 가립니다.
  doctrine_reference: 'DOCTRINE.md § Contested terms: יְהוָה YHWH'
- issue: 잠언의 대표적 남성 단수 주어
  chosen_reading: 아내를 얻는 사람은
  alternative_readings:
  - 아내를 얻는 이는
  - 누구든지 아내를 얻는 사람은
  rationale: 히브리어는 남성 단수형을 대표적 잠언 표현으로 사용합니다. 이를 중성화하지 않고 ‘사람은’으로 옮겨 보편적 격언성을 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
