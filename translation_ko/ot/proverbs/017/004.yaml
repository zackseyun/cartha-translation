id: PRO.17.4
reference: Proverbs 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ֭רַע מַקְשִׁ֣יב עַל שְׂפַת אָ֑וֶן שֶׁ֥קֶר מֵ֝זִין עַל לְשׁ֥וֹן הַוֺּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/004.yaml
  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
  footnotes:
  - marker: a
    text: Or 'An evildoer listens to lips of iniquity; falsehood gives ear to a tongue of ruin.' The Hebrew allows a more literal rendering in which 'falsehood' is taken abstractly rather than as 'a liar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 행하는 자는 악한 입술에 귀를 기울이고, 거짓말하는 자는 파멸을 가져오는 혀에 귀를 기울입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 행하는 자는 악의 입술에 귀를 기울이고, 거짓이 파멸을 가져오는 혀에 귀를 기울입니다.’ 히브리어의 ‘거짓’은 ‘거짓말하는 자’가 아니라 추상명사로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  english_pob_choice: an evildoer
  chosen_korean: 악을 행하는 자
  alternatives_korean:
  - 악인
  - 악한 사람
  - 불의를 행하는 자
  lexicon: HALOT
  rationale: 형용사적/명사적 용법으로 사람을 가리키므로, 현대 한국어에서 자연스럽고 도덕적 책임을 분명히 드러내는 표현을 택했습니다.
- source_word: מַקְשִׁיב עַל
  english_pob_choice: listens to
  chosen_korean: 귀를 기울입니다
  alternatives_korean:
  - 듣습니다
  - 주의를 기울입니다
  - 귀담아듣습니다
  lexicon: HALOT
  rationale: קשׁב의 ‘주의 깊게 듣다’라는 의미를 살리면서, 시적 평행법에 맞게 간결하게 옮겼습니다.
- source_word: שְׂפַת אָוֶן
  english_pob_choice: wicked lips
  chosen_korean: 악한 입술
  alternatives_korean:
  - 악의 입술
  - 불의한 입술
  - 재앙의 입술
  lexicon: HALOT
  rationale: ‘입술’이 발화를 가리키는 메토님이라는 점을 살려, אָוֶן의 도덕적 악성을 직접적으로 드러냈습니다.
- source_word: שֶׁקֶר מֵזִין
  english_pob_choice: a liar gives ear to
  chosen_korean: 거짓말하는 자는 … 귀를 기울입니다
  alternatives_korean:
  - 거짓은 … 귀를 기울입니다
  - 거짓된 자는 … 귀를 기울입니다
  - 거짓을 말하는 자는 … 귀를 기울입니다
  lexicon: HALOT
  rationale: שֶׁקֶר를 인격화된 ‘거짓말하는 자’로 읽는 해석을 반영했습니다. 이는 본문의 평행 구조(악을 행하는 자 / 거짓말하는 자)에 가장 잘 맞습니다.
- source_word: לְשׁוֹן הַוּוֹת
  english_pob_choice: a destructive tongue
  chosen_korean: 파멸의 혀
  alternatives_korean:
  - 파괴하는 혀
  - 재앙의 혀
  - 멸망의 혀
  lexicon: HALOT
  rationale: לשׁון은 ‘혀’이지만 실제로는 발화를 가리키며, הַוּוֹת의 파괴성은 ‘파멸’로 압축해 전달했습니다.
theological_decisions:
- issue: 속담의 평행 구조에서 추상명사와 인격화 표현 중 어떤 읽기를 본문에 반영할지
  chosen_reading: 표준 본문에는 인격화된 두 행위자(악을 행하는 자, 거짓말하는 자)를 두어 자연스러운 의미를 전달했습니다.
  alternative_readings:
  - ‘거짓’이 귀를 기울입니다처럼 추상명사를 살린 번역
  - ‘거짓됨’이 귀를 기울입니다 같은 보다 직역적인 표현
  rationale: 히브리어는 שֶׁקֶר를 추상적으로도 읽을 수 있지만, 병렬 구조상 전반부와 대칭되는 인격화가 문맥상 더 강합니다. 다만 이 가능성은 본문 주해를 흐리지 않도록 각주로 남겼습니다.
  doctrine_reference: 잠언의 시적 병렬법과 히브리어 명사의 인격화 용법
