  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: ko
  text: 곰을 새끼 잃은 상태로 만나는 것이 어리석은 자가 자기 어리석음 속에 있는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘새끼를 빼앗긴 곰’입니다.
