  source_fidelity: 히브리어는 ‘새끼를 잃은(상실한) 곰을 만나는 것’과 ‘자기 어리석음 가운데 있는 어리석은 자’를 대조합니다. 초안은 후반을 ‘어리석은 자가 ... 있는 것’으로 옮겨, 만남의 대상인 ‘어리석은 자’가 비교되는 구조를 충분히 드러내지 못합니다.
  naturalness: ‘곰을 새끼 잃은 상태로 만나는 것’은 현대 한국어에서 수식 관계가 부자연스럽습니다. ‘새끼를 잃은 곰을 만나는 것’이 명확하고 자연스럽습니다.
  terminology: כְּסִיל은 ‘어리석은 자’, אִוֶּלֶת은 ‘어리석음’으로 일관되게 옮길 수 있습니다. שַׁכּוּל은 상실/사별 상태를 뜻하므로, 원인까지 특정하는 ‘빼앗긴’보다 ‘새끼를 잃은’이 원문의 범위를 보존합니다.
