  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: ko
  text: 새끼를 잃은 곰을 만나는 것이 자기 어리석음에 빠진 어리석은 자를 만나는 것보다 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּג֬וֹשׁ
  english_pob_choice: to meet
  chosen_korean: 만나는 것이
  alternatives_korean:
  - 대면하는 것이
  - 마주치는 것이
  lexicon: פגש
  rationale: 히브리어 동사 פגש는 단순한 우연한 마주침보다 실제로 ‘맞닥뜨리다/만나다’의 감각을 가지므로, POB의 ‘to meet’를 자연스러운 합쇼체로 옮겼습니다.
- source_word: דֹּב שַׁכּוּל
  english_pob_choice: a bear robbed of her cubs
  chosen_korean: 곰을 새끼 잃은 상태로
  alternatives_korean:
  - 새끼를 빼앗긴 곰을
  - 새끼 잃은 곰을
  lexicon: דב / שכול
  rationale: שַׁכּוּל은 ‘새끼를 잃은/빼앗긴’ 상태를 뜻하므로, 성별을 드러내는 영어식 her를 한국어에서는 불필요하게 확장하지 않고 상태 중심으로 옮겼습니다.
- source_word: כְּסִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우둔한 자
  - 미련한 자
  lexicon: כסיל
  rationale: כְּסִיל은 단순 지능 부족이 아니라 도덕적·실천적 어리석음을 가리키므로, 본문 대조를 살려 ‘어리석은 자’로 번역했습니다.
- source_word: בְּאִוַּלְתּוֹ
  english_pob_choice: in his folly
  chosen_korean: 자기 어리석음 속에 있는 것보다
  alternatives_korean:
  - 자기 어리석음 가운데 있는 것보다
  - 어리석음에 빠져 있는 것보다
  lexicon: אִוֶּלֶת
  rationale: ‘in his folly’를 단순히 상태 묘사로 풀어, 어리석음이 일시적 실수가 아니라 그 사람을 지배하는 영역임을 드러냈습니다.
theological_decisions:
- issue: 잠언의 비교문 형식
  chosen_reading: ‘더 낫습니다’로 시작하는 지혜문학의 비교 판단을 유지했습니다.
  alternative_readings:
  - 명령형으로 바꾸는 해석
  - 일반 진술로 완화하는 해석
  rationale: 본문은 교훈적 명령이 아니라 강한 가치 판단을 제시하는 비교 잠언이므로, POB의 ‘Better to… than…’ 구조를 그대로 살렸습니다.
  doctrine_reference: 잠언 17:12의 지혜문학 장르 이해
