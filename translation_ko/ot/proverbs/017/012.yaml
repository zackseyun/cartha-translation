  to: 새끼를 잃은 곰을 만나는 것이 자기 어리석음에 빠진 어리석은 자를 만나는 것보다 낫습니다.
  rationale: 비교 양쪽에 ‘만나는 것’을 명시하여 히브리어의 생략된 동사와 영어 POB의 비교 구조를 한국어에서 자연스럽게 재현했습니다. ‘새끼를 잃은’은 상실을 나타내되 그 원인을 과도하게 특정하지 않습니다. ‘어리석음에 빠진’은 בְּאִוַּלְתּוֹ의 상태적 의미를 자연스럽게 표현합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:07Z'
