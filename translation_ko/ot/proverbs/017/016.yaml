base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
  footnotes:
  - marker: a
    text: Literally, 'and there is no heart.' In Hebrew, 'heart' can refer to the inner faculty of understanding, judgment, or will.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 어리석은 자의 손에 지혜를 살 돈이 있겠습니까? 그에게는 분별력이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음이 없습니다’입니다. 히브리어의 ‘마음’(לֵב)은 감정뿐 아니라 이해, 판단, 의지의 내적 기능을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  english_pob_choice: Why is there
  chosen_korean: 왜 ... 있겠습니까?
  alternatives_korean:
  - 어찌하여 ... 있겠습니까?
  - 왜 이런 ... 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사 의문을 한국어의 자연스러운 반문으로 옮기되, 직역형보다 문장 흐름이 매끄럽게 들리도록 했습니다.
- source_word: מְחִיר
  english_pob_choice: a price
  chosen_korean: 값
  alternatives_korean:
  - 대가
  - 구매가
  - 값어치
  lexicon: HALOT
  rationale: 지혜를 ‘사다’는 상업적 비유를 살리기 위해 간결한 ‘값’을 택했습니다.
- source_word: בְּיַד כְּסִיל
  english_pob_choice: in the hand of a fool
  chosen_korean: 어리석은 자의 손에는
  alternatives_korean:
  - 어리석은 자의 손에
  - 어리석은 자에게는
  - 어리석은 자의 소유에는
  lexicon: HALOT
  rationale: ‘손’의 소유·통제 이미지를 살리면서도 한국어 어순에 맞게 자연스럽게 배치했습니다.
- source_word: וְלֶב אָיִן
  english_pob_choice: when he has no heart for it
  chosen_korean: 그에게는 분별이 없습니다
  alternatives_korean:
  - 그에게는 마음이 없습니다
  - 그에게는 이해력이 없습니다
  - 그는 분별이 없습니다
  lexicon: HALOT
  rationale: 히브리어 ‘마음/heart’가 이해·판단·의지의 내적 기능을 가리키므로, 본문의 의미를 드러내는 ‘분별’로 옮겼습니다. 문맥상 목적어를 덧붙이지 않고도 의미가 통하도록 했습니다.
theological_decisions:
- issue: 잠언의 ‘heart’(לֵב) 의미 범위
  chosen_reading: ‘마음’의 문자적 반복보다, 어리석은 자가 지혜를 얻는 데 필요한 내적 판단력의 결여를 드러내는 ‘분별이 없습니다’로 처리했습니다.
  alternative_readings:
  - 그에게는 마음이 없습니다
  - 그에게는 이해가 없습니다
  rationale: 잠언 문맥에서 לֵב는 감정만이 아니라 사고·판단·의지의 중심을 포함하므로, 한국어 독자가 오해 없이 이해하도록 기능적으로 옮겼습니다.
  doctrine_reference: 잠언의 지혜 문학에서 לֵב의 인지적 기능에 대한 일반적 해석
