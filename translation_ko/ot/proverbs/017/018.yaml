id: PRO.17.18
reference: Proverbs 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
  footnotes:
  - marker: a
    text: Hebrew literally, 'A man lacking heart strikes the hand, becoming surety before his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: The expression 'shakes hands' refers to a customary gesture of entering a financial pledge or guarantee.
    reason: cultural_note
  - marker: c
    text: Or 'becoming surety' / 'putting up security.'
    reason: alternative_reading
translation:
  language: ko
  text: 분별이 없는 사람은 손을 맞잡고, 이웃 앞에서 보증을 섭니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘마음이 없는 사람은 손바닥을 치고, 이웃 앞에서 보증인이 된다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손을 맞잡다’는 고대 근동에서 금전적 보증이나 보장을 약정할 때 쓰인 관용적 몸짓을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘보증인이 되며’ / ‘보증을 서며’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: A man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 지혜문맥의 단수 일반명사로서 대표적 개인을 가리키므로, 성별을 과도하게 부각하지 않는 표준적 ‘사람’으로 옮겼습니다.
- source_word: חֲסַר לֵב
  english_pob_choice: lacking sense
  chosen_korean: 분별이 없는
  alternatives_korean:
  - 마음이 없는
  - 지각이 없는
  - 어리석은
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 없는’이지만, 히브리어 지혜문학에서 ‘마음’은 분별과 판단을 가리키므로 그 뜻을 자연스러운 현대 한국어로 풀었습니다.
- source_word: תּוֹקֵעַ כָּף
  english_pob_choice: shakes hands
  chosen_korean: 손을 맞잡고
  alternatives_korean:
  - 손을 치고
  - 손을 내밀어
  - 악수하며
  lexicon: HALOT
  rationale: 손바닥을 치거나 맞잡는 관용구를 한국어에서 가장 자연스럽게 드러내는 표현으로, 거래·보증의 제스처라는 문화적 함의를 살렸습니다.
- source_word: עֹרֵב עֲרֻבָּה
  english_pob_choice: pledging security
  chosen_korean: 보증을 섭니다
  alternatives_korean:
  - 보증인이 됩니다
  - 담보를 서약합니다
  - 연대 보증을 섭니다
  lexicon: HALOT
  rationale: 보증 책임을 지는 법적 의미를 분명히 하되, 현대 독자가 바로 이해할 수 있도록 ‘보증을 섭니다’로 옮겼습니다.
- source_word: לִפְנֵי רֵעֵהוּ
  english_pob_choice: before his neighbor
  chosen_korean: 이웃 앞에서
  alternatives_korean:
  - 이웃 앞에
  - 이웃의 앞에서
  - 이웃에게
  lexicon: HALOT
  rationale: לִפְנֵי의 ‘앞에/앞에서’라는 전면적·공개적 뉘앙스를 살리면서, 보증 행위가 공개적으로 이루어짐을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지혜 격언의 도덕적 경고를 과도하게 완화하지 않는 문제
  chosen_reading: ‘분별이 없는 사람’과 ‘보증을 섭니다’로, 어리석은 금융·법적 위험을 직접적으로 경고하는 구조를 유지했습니다.
  alternative_readings:
  - ‘어리석은 사람’으로 순화
  - ‘손을 잡아 약속합니다’로 완화
  rationale: 본문은 단순한 인사 제스처가 아니라 무분별한 보증 행위를 비판하므로, 문화적 설명을 붙이되 경고의 날카로움을 유지해야 합니다.
  doctrine_reference: 지혜문학의 실천적 교훈, 책임 윤리
