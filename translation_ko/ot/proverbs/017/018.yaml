    rationale: 원문은 문자적으로 ‘손바닥을 치다’이며, 보증을 약정하는 관용 행위를 나타냅니다. 한국어 본문에서는 ‘손바닥을 치며’가 원문의 표현과 법적 관용의 배경을 더 충실히 보존합니다.
