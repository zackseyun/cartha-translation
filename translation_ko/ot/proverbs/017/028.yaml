id: PRO.17.28
reference: Proverbs 17:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֤ם אֱוִ֣יל מַ֭חֲרִישׁ חָכָ֣ם יֵחָשֵׁ֑ב אֹטֵ֖ם שְׂפָתָ֣י/ו נָבֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
  footnotes:
  - marker: a
    text: Or 'is thought wise ... prudent.' The Hebrew emphasizes how silence can make even a fool appear wise and discerning.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람이라도 잠잠하면 지혜로운 사람으로 여겨집니다. 입술을 닫는 사람은 분별 있는 사람으로 여겨집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜롭다고 여겨집니다 … 분별 있다고 여겨집니다.’ 히브리어는 침묵이 어리석은 사람조차 지혜롭고 분별 있어 보이게 할 수 있음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 이라도
  alternatives_korean:
  - 또한
  - 심지어
  lexicon: HALOT
  rationale: ‘Even’의 놀라움과 역전 효과를 한국어에서는 조건적 양보를 담는 ‘-이라도’로 살려, 어리석은 사람도 침묵하면 그렇게 보일 수 있다는 수사적 힘을 유지했습니다.
- source_word: אֱוִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 바보
  - 우매한 사람
  lexicon: HALOT
  rationale: 잠언의 지혜 문맥에서 조롱조의 ‘바보’보다 도덕적·지적 결핍을 나타내는 ‘어리석은 사람’이 현대 표준어로 더 안정적입니다.
- source_word: חָכָם יֵחָשֵׁב
  english_pob_choice: is considered wise
  chosen_korean: 지혜로운 사람으로 여겨집니다
  alternatives_korean:
  - 지혜롭다고 여겨집니다
  - 지혜로운 것으로 셈해집니다
  lexicon: HALOT
  rationale: חשׁב의 평가적 수동 의미를 살려 ‘여겨집니다’로 옮겼고, 형용사 ‘지혜로운’은 잠언의 대조 구조를 자연스럽게 드러냅니다.
- source_word: אֹטֵם שְׂפָתָיו
  english_pob_choice: one who closes his lips
  chosen_korean: 입술을 닫는 사람
  alternatives_korean:
  - 입술을 막는 사람
  - 말을 삼가는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘입술을 닫는’이지만, 한국어에서는 행위 주체를 풀어 쓴 ‘입술을 닫는 사람’이 시적 이미지와 이해도를 함께 지킵니다.
- source_word: נָבוֹן
  english_pob_choice: discerning
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 분별력 있는 사람
  - 깨달은 사람
  lexicon: HALOT
  rationale: נבון은 단순 지성보다 판단력과 분별을 가리키므로, ‘분별 있는’이 잠언적 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 지혜/어리석음의 역설을 어떻게 보존할지
  chosen_reading: 침묵 그 자체가 어리석은 사람조차 지혜롭고 분별 있어 보이게 만든다는 역설을 그대로 드러냈습니다.
  alternative_readings:
  - ‘말을 아끼는 사람은 지혜롭다’로 일반화하는 읽기
  - ‘침묵하면 지혜롭게 보인다’로만 완화하는 읽기
  rationale: 이 절은 침묵의 덕목 일반을 말하기보다, 어리석은 사람조차 침묵으로 그렇게 ‘여겨질 수 있음’을 강조합니다. 이를 약화시키지 않도록 평가 동사를 유지했습니다.
  doctrine_reference: 잠언 17:28의 수사적 역설
- issue: 서술의 주어를 어떻게 처리할지
  chosen_reading: 두 번째 행도 첫 행과 평행하게 주어를 보충해 ‘입술을 닫는 사람은 … 여겨집니다’로 자연스럽게 정리했습니다.
  alternative_readings:
  - ‘입술을 닫는, 분별 있는 사람’처럼 압축하는 읽기
  - 쉼표로만 연결하여 미완성 구조를 남기는 읽기
  rationale: 히브리어 시구의 축약을 한국어로도 이해 가능하게 드러내되, 원문의 병렬성과 평가 구조는 보존했습니다.
  doctrine_reference: 히브리 시가의 평행법
