base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
  footnotes:
  - marker: a
    text: Or, 'Wisdom is in the presence of one who understands.' The Hebrew opening may also be taken less literally, with 'face' expressing presence rather than physical face.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a discerning man.' The masculine singular functions proverbially for a representative person.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land' instead of 'the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분별 있는 사람[a][b] 앞에는 지혜가 있고, 어리석은 자의 눈은 땅[c] 끝에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞에는’은 문자적으로 ‘얼굴 앞에’라는 히브리어 표현을 옮긴 것으로, 여기서는 ‘곁에, 가까이’라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수 분사로, 속담에서 대표적인 인물을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세상’. 히브리어 ‘땅’은 여기서 매우 먼 곳을 가리키는 과장된 표현입니다.
    reason: lexical_alternative
