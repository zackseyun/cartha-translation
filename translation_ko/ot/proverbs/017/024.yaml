reference: Proverbs 17:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
  footnotes:
  - marker: a
    text: Or, 'Wisdom is in the presence of one who understands.' The Hebrew opening may also be taken less literally, with 'face' expressing presence rather than physical face.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a discerning man.' The masculine singular functions proverbially for a representative person.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land' instead of 'the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분별 있는 사람의 앞에는 지혜가 있지만, 어리석은 자의 눈은 땅 끝을 향합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞에는’은 히브리어의 ‘얼굴/앞’ 이미지를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘분별 있는 사람’은 남성 단수 분사를 대표적 인물을 가리키는 속담 표현으로 옮긴 것입니다.
    reason: source_note
  - marker: c
    text: ‘땅’은 여기서 넓은 의미의 ‘땅/세상’으로, 매우 먼 곳을 가리키는 과장법입니다.
    reason: source_note
lexical_decisions:
- source_word: אֶת פְּנֵי
  english_pob_choice: before the face of / in the presence of
  chosen_korean: ~의 앞에는
  alternatives_korean:
  - ~의 얼굴 앞에
  - ~의 presence 안에
  - ~의 앞에
  lexicon: HALOT
  rationale: אֶת פְּנֵי는 문자적으로는 ‘얼굴/얼굴 앞’이지만, 속담 문맥에서는 ‘곁에, 앞에, 가까이 있다’는 존재감의 이미지를 살리는 것이 자연스럽습니다.
- source_word: מֵבִין
  english_pob_choice: a discerning man
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 이해하는 사람
  - 깨닫는 사람
  - 분별 있는 남자
  lexicon: HALOT
  rationale: 분사형 ‘이해하는/분별하는 자’의 성격을 살리되, 한국어 속담으로는 ‘분별 있는 사람’이 가장 자연스럽고 대표적 인물을 뜻하는 뉘앙스를 잘 전달합니다.
- source_word: כְסִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 자
  - 바보
  - 어리석은 사람
  lexicon: HALOT
  rationale: 잠언의 כְסִיל은 단순히 지능이 낮다는 뜻보다 도덕적·지적 어리석음을 함께 가리키므로, 속담체에서 ‘어리석은 자’가 적절합니다.
- source_word: בִּקְצֵה אָרֶץ
  english_pob_choice: at the ends of the earth
  chosen_korean: 땅 끝을 향합니다
  alternatives_korean:
  - 땅 끝에 있습니다
  - 세상 끝에 있습니다
  - 땅의 끝들에 있습니다
  lexicon: HALOT
  rationale: 직역형 ‘땅 끝’의 원문 이미지를 유지하되, ‘눈이 …을 향한다’로 한국어의 자연스러운 방향성을 더해 분산된 시선을 표현했습니다.
theological_decisions:
- issue: 속담의 대조 구조
  chosen_reading: 분별 있는 사람에게는 지혜가 가까이 있지만, 어리석은 자의 시선은 멀리 흩어집니다.
  alternative_readings:
  - 지혜는 분별 있는 사람의 앞에 있고, 어리석은 자의 눈은 땅 끝에 있습니다.
  rationale: 히브리어는 앞의 근접성과 뒤의 원거리성을 대비시키는 지혜문학의 표현이므로, 한국어에서도 단순 정보 전달보다 시선의 대비가 드러나도록 했습니다.
  doctrine_reference: 잠언의 지혜-어리석음 대비 구조
