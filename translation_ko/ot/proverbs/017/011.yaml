id: PRO.17.11
reference: Proverbs 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
  footnotes:
  - marker: a
    text: Or 'a cruel angel will be sent against him.' The Hebrew word can mean either 'messenger' or 'angel.'
    reason: alternative_reading
translation:
  language: ko
  text: 반역하는 사람은 오직 악만 찾고, 잔혹한 사자가 그에게 보내집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잔혹한 천사가 그에게 보내집니다.’ 히브리어 מַלְאָךְ는 ‘사자’와 ‘천사’ 둘 다 될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그저
  - 오로지
  lexicon: HALOT
  rationale: 제한적·집중적 용법을 살려 반역자의 추구가 ‘악’에만 한정됨을 분명히 드러냅니다.
- source_word: מְרִי
  english_pob_choice: a rebellious man
  chosen_korean: 반역하는 사람
  alternatives_korean:
  - 반역자
  - 반항하는 사람
  - 반역한 사람
  lexicon: HALOT
  rationale: 추상명사보다 인물을 가리키는 메토님적 용법이므로, 한국어에서는 자연스럽게 사람 중심 표현으로 옮겼습니다.
- source_word: מַלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 메신저
  - 천사
  lexicon: HALOT
  rationale: 문맥상 심판을 집행하는 파견된 존재를 가리키므로, 문자적 의미를 보존하면서도 ‘천사’로 과도하게 특정하지 않는 ‘사자’를 택했습니다.
- source_word: יְשֻׁלַּח
  english_pob_choice: will be sent
  chosen_korean: 보내집니다
  alternatives_korean:
  - 보내질 것입니다
  - 파견됩니다
  - 전달됩니다
  lexicon: HALOT
  rationale: פּוּ알 수동의 결과적 의미를 살려 잠언의 일반적 미래 진술로 자연스럽게 표현했습니다.
theological_decisions:
- issue: מַלְאָךְ를 초자연적 ‘천사’로 특정할지 여부
  chosen_reading: 문맥을 따라 ‘사자’로 두고, 초자연적 존재로는 단정하지 않습니다.
  alternative_readings:
  - 천사
  - 전령
  rationale: 본문은 그 존재가 하늘의 존재인지 밝히지 않으므로, 원문의 의미 범위를 유지하면서 독자에게 해석 여지를 남기는 번역이 더 적절합니다.
  doctrine_reference: '번역 원칙: 원문이 명시하지 않는 신학적 특정화는 피하고, 본문의 긴장을 보존합니다.'
