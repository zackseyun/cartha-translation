review_pass:
  verdict: revise
  source_fidelity: 현 번역은 히브리어 어순과 통사 관계를 뒤바꾸었습니다. מְרִי는 ‘반역/거역’으로, רָע는 명사적으로 쓰인 ‘악한 자’로 이해하는 것이 문법과 잠언의 통상적 해석에 가장 잘 맞습니다. 따라서 ‘반역하는 사람이 악을 찾는다’가 아니라 ‘악한 자가 반역만을 꾀한다’로 옮겨야 합니다. 두 번째 절의 수동 및 적대적 방향은 적절히 반영할 수 있습니다.
  naturalness: ‘악한 자는 반역만을 꾀하고, 잔혹한 사자가 그에게 보내질 것입니다’는 현대 표준어 합쇼체에 자연스럽고, 잠언의 격언적·경고적 문체도 유지합니다. ‘사자’는 성경 한국어에서 파견된 전달자·집행자를 뜻하는 관용적 용례이며, 문맥상 동물과 혼동될 가능성은 낮습니다.
  terminology: מַלְאָךְ는 ‘사자’로 유지하여 인간 전령과 천사라는 원문의 의미 범위를 좁히지 않았습니다. אַכְזָרִי는 ‘잔혹한’으로, יְשֻׁלַּח은 결과적 미래 수동인 ‘보내질 것입니다’로 옮겼습니다. 각주에서 ‘천사’ 가능성을 보존합니다.
  issues:
