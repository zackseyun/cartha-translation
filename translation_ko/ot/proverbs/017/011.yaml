  - 반역한 사람
  lexicon: HALOT
  rationale: 추상명사보다 인물을 가리키는 메토님적 용법이므로, 한국어에서는 자연스럽게 사람 중심 표현으로 옮겼습니다.
- source_word: מַלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 메신저
  - 천사
  lexicon: HALOT
  rationale: 문맥상 심판을 집행하는 파견된 존재를 가리키므로, 문자적 의미를 보존하면서도 ‘천사’로 과도하게 특정하지 않는 ‘사자’를 택했습니다.
- source_word: יְשֻׁלַּח
