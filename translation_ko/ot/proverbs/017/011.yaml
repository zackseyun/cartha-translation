base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
  footnotes:
  - marker: a
    text: Or 'a cruel angel will be sent against him.' The Hebrew word can mean either 'messenger' or 'angel.'
    reason: alternative_reading
translation:
  language: ko
  text: 악한 자는 반역만을 꾀하고, 잔혹한 사자가 그에게 보내질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잔혹한 천사가 그에게 보내질 것입니다.’ 히브리어 מַלְאָךְ는 ‘사자’ 또는 ‘천사’를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그저
  - 오로지
  lexicon: HALOT
  rationale: 제한적·집중적 용법을 살려 반역자의 추구가 ‘악’에만 한정됨을 분명히 드러냅니다.
- source_word: מְרִי
  english_pob_choice: a rebellious man
  chosen_korean: 반역하는 사람
