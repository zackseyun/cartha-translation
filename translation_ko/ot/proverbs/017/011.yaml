    rationale: פּוּ알 미완료형의 결과적·경고적 뉘앙스를 ‘보내질 것입니다’로 드러내면 더 명확합니다.
  revised_text: 악한 자는 반역만을 꾀하고, 잔혹한 사자가 그에게 보내질 것입니다.[a]
