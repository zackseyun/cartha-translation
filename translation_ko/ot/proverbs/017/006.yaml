source:
  edition: WLC
  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
  footnotes:
  - marker: a
    text: Literally, 'children of children.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the aged' could be rendered 'old men'; the Hebrew refers to elderly people, not necessarily community elders.
    reason: lexical_alternative
translation:
  language: ko
  text: 손주들은[a] 노인들[b]의 면류관이며, 자녀들의 영광은 그들의 아버지들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘자녀의 자녀들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노인들’은 직분상의 ‘장로들’이 아니라 연로한 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 면류관
  alternatives_korean:
  - 왕관
  - 관
  lexicon: HALOT
  rationale: 지혜문학의 비유적 영예를 살리면서도 한국어 성경문체에 자연스럽게 어울리는 표지어로 옮겼습니다.
- source_word: זְקֵנִים
  english_pob_choice: the aged
  chosen_korean: 노인들
  alternatives_korean:
  - 늙은이들
  - 장로들
  lexicon: HALOT
  rationale: 이 구절의 זְקֵנִים은 직분의 ‘장로’가 아니라 연로한 사람들을 가리키므로, 이를 분명히 드러내는 ‘노인들’로 옮겼습니다.
- source_word: בְּנֵי בָנִים
  english_pob_choice: Grandchildren
  chosen_korean: 손자들
  alternatives_korean:
  - 자녀의 자녀들
  - 손자손녀들
  lexicon: HALOT
  rationale: 직역하면 ‘아들의 아들들’이지만, 문맥상 자연스러운 관용 표현인 ‘손자들’이 가장 간결하게 뜻을 전달합니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 아버지들
  alternatives_korean:
  - 그들의 부모들
  - 그들의 조상들
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘그들의 아버지들’이라고 말하므로, 관계를 일반화한 ‘부모들’이나 ‘조상들’로 완화하지 않았습니다.
theological_decisions:
- issue: 부성 표지의 유지
  chosen_reading: ‘children’ 대신 문맥에 맞는 집합적 의미를 살리되, אֲבוֹתָם은 ‘그들의 아버지들’로 유지했습니다.
  alternative_readings:
  - ‘자녀들’과 ‘그들의 부모들’로 더 중성적으로 처리
  - ‘아들들’과 ‘그들의 아버지들’로 더 형식적으로 처리
  rationale: 지혜문학의 평행법을 자연스럽게 살리면서도, 원문의 남성형 친족어가 지닌 구체성을 지워 버리지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
