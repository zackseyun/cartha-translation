id: PRO.17.13
reference: Proverbs 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵשִׁ֣יב רָ֭עָה תַּ֣חַת טוֹבָ֑ה לֹא תמיש רָ֝עָ֗ה מִ/בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/013.yaml
  text: Whoever repays evil for good[a], evil will not depart from his house.
  footnotes:
  - marker: a
    text: Or 'calamity will not depart from his house.' The second 'evil' (רָעָה) can denote either moral evil or harmful consequence/disaster; the main text preserves the Hebrew repetition.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 선한 일에 악으로 갚으면, 그의 집에서 악이 떠나지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집에서 재앙이 떠나지 않습니다.’ 여기서 두 번째 ‘악’(רָעָה)은 도덕적 악이나 해악/재앙을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  english_pob_choice: repays
  chosen_korean: 갚으면
  alternatives_korean:
  - 되갚으면
  - 보답하면
  lexicon: HALOT
  rationale: 히필 분사로서 ‘~에 대해 되돌려 주다/갚다’의 상호 보응 뉘앙스를 가지므로, ‘갚으면’이 문맥상 가장 자연스럽고 보응 관계를 잘 드러냅니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 해
  - 재앙
  lexicon: HALOT
  rationale: 첫 번째 רָעָה는 선에 맞서는 도덕적 악을 가리키므로, 한국어에서도 ‘악’으로 두어 반복과 대조를 보존했습니다.
- source_word: תַּחַת טוֹבָה
  english_pob_choice: for good
  chosen_korean: 선한 일에
  alternatives_korean:
  - 좋은 것에
  - 선에 대한 대가로
  lexicon: HALOT
  rationale: תַּחַת은 교환/대응 관계를 나타내므로, ‘선한 일에’로 옮겨 ‘악으로 갚는’ 역보응의 구조를 자연스럽게 살렸습니다.
- source_word: לֹא תמיש רָעָה מִבֵּיתוֹ
  english_pob_choice: evil will not depart from his house
  chosen_korean: 그의 집에서 악이 떠나지 않습니다
  alternatives_korean:
  - 그 집에서 악이 물러나지 않습니다
  - 그의 집안에서 재앙이 떠나지 않습니다
  lexicon: HALOT
  rationale: לֹא תמיש는 ‘떠나지 않다/물러나지 않다’의 지속적 부재를 뜻하므로 ‘떠나지 않습니다’가 가장 सीधे합니다. מִבֵּיתוֹ는 잠언적 표현을 따라 ‘그의 집’으로 유지했습니다.
theological_decisions:
- issue: 마지막 רָעָה의 의미를 도덕적 악과 재앙/해악 중 어떻게 처리할지
  chosen_reading: 본문에는 첫 번째와 같은 ‘악’을 유지하고, 결과적 재앙의 뉘앙스는 해석 여지를 남깁니다.
  alternative_readings:
  - ‘재앙’으로 옮겨 결과적 의미를 드러내기
  - ‘해악’으로 옮겨 중립적으로 처리하기
  rationale: 히브리어의 반복을 보존해야 잠언의 대구와 경고의 강도가 살아납니다. 결과적 의미는 어휘 자체의 범위 안에 있으므로 번역 본문을 바꾸지 않고도 해석상 수용 가능합니다.
  doctrine_reference: 잠언의 보응/인과 구조, 어휘 반복 보존 원칙
