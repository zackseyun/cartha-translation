  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: ko
  text: 왜곡된 마음은 좋은 것을 찾지 못하고, 말이 비뚤어진 사람은 재앙에 빠집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘굽은 마음’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  english_pob_choice: a crooked heart
  chosen_korean: 왜곡된 마음
  alternatives_korean:
  - 삐뚤어진 마음
  - 굽은 마음
  lexicon: עִקֶּשׁ
  rationale: ‘crooked’의 도덕적·인격적 비틀림을 자연스러운 표준어로 옮기기 위해 ‘왜곡된’과 ‘마음’을 결합했습니다.
- source_word: לֹא יִמְצָא טוֹב
  english_pob_choice: does not find good
  chosen_korean: 좋은 것을 찾지 못하고
  alternatives_korean:
  - 선을 얻지 못하고
  - 복을 찾지 못하고
  lexicon: מצא
  rationale: 동사의 ‘찾다/얻다’ 의미를 살리되, יִמְצָא טוֹב의 직접적 대상을 한국어에서 자연스럽게 풀어 ‘좋은 것’을 택했습니다.
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  english_pob_choice: one who is twisted in his tongue
  chosen_korean: 혀가 뒤틀린 사람
  alternatives_korean:
  - 말이 뒤틀린 사람
  - 혀가 비뚤어진 사람
  lexicon: הפך
  rationale: POB의 ‘twisted’ 선택을 반영하되, לשון을 단순한 ‘말’로 약화시키지 않고 ‘혀’로 유지했습니다.
- source_word: יִפּוֹל בְּרָעָה
  english_pob_choice: falls into trouble
  chosen_korean: 재앙에 떨어집니다
  alternatives_korean:
  - 화에 빠집니다
  - 불행에 떨어집니다
  lexicon: רעה
  rationale: רָעָה의 넓은 ‘악/재앙/해악’ 범위 중, 문맥상 결과를 강하게 드러내는 ‘재앙’이 가장 직접적이라고 보았습니다.
theological_decisions:
- issue: רָעָה의 범위
  chosen_reading: ‘재앙’으로 옮겨 윤리적 악행의 결과로서 닥치는 파국을 드러냈습니다.
  alternative_readings:
  - ‘악’
  - ‘불행’
  rationale: 잠언의 경구체에서 רָעָה는 단순한 추상적 악보다 실제적 해악·파국을 뜻하는 경우가 많아, 문맥상 결과의 강도를 살렸습니다.
  doctrine_reference: 잠언의 지혜 문학에서 도덕적 상태와 그 필연적 결과의 연결
- issue: “crooked / twisted”의 형식
  chosen_reading: 두 표현을 모두 인격의 비틀림으로 연결해 병렬적으로 유지했습니다.
  alternative_readings:
  - 한 표현으로 통합
  - 보다 완곡한 도덕적 표현 사용
  rationale: 히브리어 본문은 마음과 혀의 왜곡을 평행으로 제시하므로, 한국어에서도 두 영역의 왜곡을 구분해 살렸습니다.
  doctrine_reference: 평행법 보존
