revisions:
- from: 왜곡된 마음은 좋은 것을 찾지 못하고, 혀가 뒤틀린 사람은 재앙에 떨어집니다.[a]
  to: 왜곡된 마음은 좋은 것을 찾지 못하고, 말이 비뚤어진 사람은 재앙에 빠집니다.[a]
  rationale: 첫 행과 각주는 유지했습니다. 둘째 행의 ‘혀’를 ‘말’로 옮겨 히브리어 לָשׁוֹן의 문맥상 관용적 의미를 한국어에서 분명히 하고, 결과 표현을 자연스러운 ‘재앙에 빠집니다’로 다듬었습니다. 이는 영어 감사 기록의 ‘tongue’라는 형태보다 원문과 목표 언어의 자연스러운 의미 전달을 우선한 제한적 수정입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:09Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘마음이 굽은 자’와 ‘자기 혀/말에서 뒤틀린 자’를 병행시키며, 전자는 좋은 것을 얻지 못하고 후자는 רָעָה(재앙·불행·해악)에 빠진다고 말합니다. 초안은 전반적 의미와 병행을 잘 보존합니다. 다만 ‘혀가 뒤틀린 사람’은 한국어에서 실제 혀의 물리적 상태를 먼저 연상시킬 수 있으므로, לשון의 관용적 ‘말/언어’ 의미를 자연스럽게 드러내는 표현이 더 정확합니다. ‘재앙에 떨어집니다’도 한국어 결합이 다소 부자연스럽습니다.
  naturalness: ‘말이 비뚤어진 사람’은 말의 왜곡되고 그릇된 성격을 자연스럽게 나타내며, 원문의 ‘혀로/말에서 뒤틀린’ 뜻을 유지합니다. ‘재앙에 빠집니다’는 בְּרָעָה와 יִפּוֹל의 결과적 이미지를 자연스러운 표준 한국어로 옮깁니다.
  terminology: ‘왜곡된 마음’은 עִקֵּשׁ לֵב의 도덕적 비뚤어짐을 적절히 전달합니다. רָעָה는 여기서 도덕적 ‘악’ 자체라기보다 그 사람이 맞게 되는 해악·불행을 가리킬 수 있으므로 ‘재앙’을 유지할 수 있습니다. 각주 ‘굽은 마음’은 원문의 직역 가능성을 유익하게 제시합니다.
