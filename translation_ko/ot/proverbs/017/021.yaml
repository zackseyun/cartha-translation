  text: יֹלֵ֣ד כְּ֭סִיל לְ/ת֣וּגָה ל֑/וֹ וְ/לֹֽא יִ֝שְׂמַ֗ח אֲבִ֣י נָבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
  footnotes:
  - marker: a
    text: Or 'One who begets a fool begets him for sorrow.' The Hebrew wording is compact and may be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Vile man'' translates Hebrew nabal, a term for a morally shameful or disgraceful person, not merely one lacking intelligence.'
    reason: cultural_note
translation:
  language: ko
  text: 미련한 자를 낳는 사람에게는 슬픔이 따르고, 비열한 자의 아버지에게는 기쁨이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축적으로 ‘미련한 자를 낳는 이는 그에게 슬픔을 낳고’라고 읽을 수 있습니다. ‘그에게’는 그를 낳은 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹלֵד
  english_pob_choice: He who fathers
  chosen_korean: 낳는 자
  alternatives_korean:
  - 아비가 되는 자
  - 아들을 낳는 자
  - 아버지가 되는 자
  lexicon: HALOT
  rationale: Qal 분사로서 ‘낳다/생기게 하다’의 행위자를 가리키므로, 속담형 문맥에 맞는 중립적 표현인 ‘낳는 자’를 택했습니다.
- source_word: כְּסִיל
  english_pob_choice: a fool
  chosen_korean: 미련한 자
  alternatives_korean:
  - 어리석은 자
  - 우둔한 자
  - 바보
  lexicon: HALOT
  rationale: 지혜문학의 כְּסִיל은 단순한 지능 부족보다 완고하고 분별이 없는 사람을 뜻하므로, 한국어에서 도덕적·지적 어리석음을 함께 담는 ‘미련한 자’로 옮겼습니다.
- source_word: לְתוּגָה
  english_pob_choice: to his own grief
  chosen_korean: 자기의 슬픔을
  alternatives_korean:
  - 슬픔이 되도록
  - 슬픔으로
  - 근심이 되도록
  lexicon: HALOT
  rationale: 전치사 ל의 결과·귀착 의미를 살려, 아버지 자신에게 돌아오는 내적 고통임을 분명히 하는 표현으로 번역했습니다.
- source_word: נָבָל
  english_pob_choice: a vile man
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 비천한 자
  - 비열한 자
  - 악한 자
  lexicon: HALOT
  rationale: נָבָל은 단순 무지보다 도덕적으로 수치스러운 사람을 가리키지만, 이 절의 병행법과 기존 번역 전승을 고려하면 첫 번째 כְּסִיל과 과도하게 분화하지 않는 ‘어리석은 자’가 가장 자연스럽습니다.
theological_decisions:
- issue: 두 번째 행의 נָבָל을 첫 행의 כְּסִיל과 어떻게 구분할지
  chosen_reading: 두 용어를 모두 한국어로는 유사하게 처리하되, 첫 행의 ‘미련한 자’와 둘째 행의 ‘어리석은 자’를 약간 달리 두어 병행을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘미련한 자’로 통일
  - 둘째 행을 ‘비열한 자’로 강하게 차별화
  rationale: 히브리어는 어휘상 차이가 있으나, 속담의 압축성과 병행성을 해치지 않도록 지나친 해석적 확대는 피했습니다.
  doctrine_reference: 지혜문학의 어휘 병행과 의미 범위 보존
