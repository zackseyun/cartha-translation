id: PRO.17.9
reference: Proverbs 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
  footnotes:
  - marker: a
    text: Or 'covers a transgression.' The Hebrew keeps the metaphor of covering rather than stating forgiveness explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'he who brings up a matter again' or 'he who repeats a matter.' The sense is revisiting an offense rather than letting it rest.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'separates an intimate friend' (singular); the English plural 'close friends' expresses the proverb's generic force more naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 허물을 덮어 주는 사람은 사랑을 구합니다. 그러나 일을 다시 들추는 사람은 친한 벗을 멀어지게 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘용서하다’보다 ‘덮다’의 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 잘못을 다시 끄집어내는 행동을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 단수 ‘친한 벗’은 잠언에서 일반적인 관계를 가리키는 표현으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  english_pob_choice: covers over
  chosen_korean: 덮어 주는
  alternatives_korean:
  - 덮는
  - 감추는
  - 용서하는
  lexicon: HALOT
  rationale: כסה의 기본 이미지는 ‘덮다/가리다’이므로, ‘덮어 주는’으로 은유를 살리면서 자연스러운 한국어로 옮겼습니다. ‘용서하는’은 뜻은 가깝지만 원문의 비유를 직접 드러내지 못합니다.
- source_word: פֶּשַׁע
  english_pob_choice: an offense
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 죄과
  - 반역
  lexicon: HALOT
  rationale: 지혜문맥에서 פֶּשַׁע는 대인 관계의 잘못을 가리키는 경우가 많아, 너무 법정적이거나 무거운 ‘범죄’보다 관계적 뉘앙스를 살리는 ‘허물’이 적절합니다.
- source_word: שֹׁנֶה בְדָבָר
  english_pob_choice: repeats a matter
  chosen_korean: 일을 다시 들추는
  alternatives_korean:
  - 일을 반복하는
  - 문제를 다시 꺼내는
  - 말을 되풀이하는
  lexicon: HALOT
  rationale: ‘다시 들추다’는 בעבר מחדש로 이전의 잘못을 다시 꺼내는 행동을 자연스럽게 전달하며, 단순 반복보다 갈등을 재점화하는 의미를 더 분명히 드러냅니다.
- source_word: אַלּוּף
  english_pob_choice: close friends
  chosen_korean: 친한 벗
  alternatives_korean:
  - 가까운 벗
  - 가까운 친구
  - 친밀한 친구
  lexicon: HALOT
  rationale: אַלּוּף는 친밀한 동반자/가까운 벗을 뜻하므로, 단수 형식의 일반성을 살리면서도 한국어 속담체에 어울리는 ‘친한 벗’으로 옮겼습니다.
theological_decisions:
- issue: אַהֲבָה의 관계적 의미를 ‘사랑’으로 유지할지, 한국어 관용에 따라 ‘우정’ 계열로 좁힐지
  chosen_reading: ‘사랑’을 유지하되 문맥상 관계적 실천으로 읽히도록 했습니다.
  alternative_readings:
  - 우정을 구합니다
  - 친절을 구합니다
  rationale: 히브리어 אַהֲבָה는 넓게 ‘사랑’을 뜻하며, 본문의 도덕적 명제는 상대의 잘못을 덮어 관계를 지키는 사랑을 말합니다. ‘우정’으로 좁히면 어휘는 자연스러워도 원문의 넓이를 줄일 수 있습니다.
  doctrine_reference: 잠언의 지혜윤리와 이웃 사랑의 관계성
- issue: 문장 후반의 결과를 ‘분리하다’보다 관계 손상으로 옮길지
  chosen_reading: ‘친한 벗을 멀어지게 합니다’로 관계 파괴의 결과를 드러냈습니다.
  alternative_readings:
  - 친한 벗을 갈라놓습니다
  - 친한 벗을 떠나게 합니다
  rationale: מַפְרִיד는 문자적으로 ‘분리하다’이지만, 속담의 자연스러운 효과는 관계 단절입니다. 한국어에서는 ‘멀어지게 합니다’가 결과를 더 생생하고 정확하게 전달합니다.
  doctrine_reference: 지혜문학의 사회적 관계 이해
