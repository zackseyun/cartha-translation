  naturalness: ‘아들 위에 군림하고’보다 ‘아들을 다스리며’가 현대 표준 한국어에서 더 자연스럽고 원문의 통치·권위 관계를 간결하게 나타냅니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 독자의 이해에 더 명확합니다.
