source:
  edition: WLC
  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent slave will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
  footnotes:
  - marker: a
    text: Or “servant.” The Hebrew עֶבֶד can denote either, but “slave” is used here because the proverb’s force depends on the social reversal of a bonded person rising above a disgraceful son.
    reason: lexical_alternative
  - marker: b
    text: Or “siblings.” Hebrew “brothers” reflects the masculine familial term and likely refers to the family heirs.
    reason: lexical_alternative
translation:
  language: ko
  text: 분별 있는 노예[a]는 수치를 끼치는 아들을 다스리며, 형제들[b] 가운데서 상속 재산을 나누어 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “종.” 히브리어 עֶבֶד는 둘 다 뜻할 수 있으나, 이 잠언은 예속된 사람이 수치를 끼치는 아들보다 높은 지위에 이르는 사회적 역전을 강조하므로 “노예”를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “형제자매들.” 히브리어의 남성 복수형은 문자 그대로 “형제들”이지만, 문맥상 가족 상속인 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
