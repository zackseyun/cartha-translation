  source_fidelity: 원문의 מֵבִין은 일반적인 ‘지혜 있는 자’보다 ‘분별력 있는 사람/깨닫는 사람’에 가깝습니다. 또한 מֵהַכּוֹת כְּסִיל מֵאָה는 ‘백 번의 채찍’이 아니라 ‘어리석은 사람을 백 번 때리는 것’이라는 비교 구문입니다. 수정문은 꾸짖음이 분별 있는 사람에게 미치는 효과와 어리석은 사람을 백 번 때리는 일을 정확히 대비합니다.
  naturalness: ‘더 깊이 스며듭니다’는 תֵּחַת의 비유적 침투·영향의 뜻을 현대 표준 한국어 합쇼체로 자연스럽게 나타냅니다. ‘분별 있는 사람’과 ‘어리석은 사람’은 잠언의 격언적 문체에도 무리 없이 어울립니다.
  terminology: ‘꾸짖음’은 גְּעָרָה(질책, 견책)에 적절합니다. כְּסִיל은 잠언의 정형적 용어인 ‘어리석은 사람’으로 옮겼습니다. 원문에 없는 도구인 ‘채찍’과 횟수 단위인 ‘한 번’은 제거했습니다.
  issues:
  - severity: medium
    issue: ‘지혜 있는 자’
    rationale: מֵבִין은 ‘지혜로운’ 자체보다 이해력·분별력이 있는 사람을 가리킵니다. ‘분별 있는 사람’이 어휘적 의미를 더 잘 보존합니다.
  - severity: high
    issue: ‘백 번의 채찍’
    rationale: 원문은 채찍이라는 도구를 언급하지 않고, ‘어리석은 사람을 백 번 때리는 것’을 말합니다. 채찍을 넣으면 본문에 없는 구체적 수단을 추가합니다.
  - severity: medium
    issue: 각주의 대안 표현
    rationale: ‘꾸짖음이 한 번 들어가는 것’은 원문에 없는 ‘한 번’을 보태며, 비교 대상도 부자연스럽게 처리합니다. 본문과 의미상 구별되는 유효한 대안이 아니므로 삭제하는 것이 안전합니다.
