  source_fidelity: ‘그의 만드신 이’는 한국어 문법상 ‘그가 만드신 사람’으로 읽힐 수 있어, 히브리어 עֹשֵׂהוּ(가난한 이를 지으신 분)의 의미를 정확히 전달하지 못합니다. 또한 ‘비방하다’는 허위 사실로 헐뜯는 뉘앙스가 있어 חֵרֵף의 ‘모욕하다/능욕하다’보다 덜 정확합니다. 수정문은 두 분사의 병행과 ‘벌을 면하지 못함’이라는 משפט적 결과를 보존합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 일관되게 표현했습니다. ‘하리니’ 같은 고어적 종결을 피하고, ‘가난한 이’와 ‘그를 지으신 분’이라는 자연스러운 격식체 표현을 사용했습니다.
  terminology: ‘그를 지으신 분’은 가난한 이를 지으신 하나님을 가리키는 히브리어의 소유 접미사 관계를 보존하면서 과도한 해석을 피합니다. 대안 표현으로 ‘창조주’를 각주에 제시합니다. חֵרֵף는 ‘모욕하다’, אֵיד는 ‘재앙’, לֹא יִנָּקֶה는 ‘벌을 피하지 못합니다’로 옮겼습니다.
  issues:
