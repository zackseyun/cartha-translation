  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
  footnotes:
  - marker: a
    text: Or, 'and a brother is born for a time of trouble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 친구는 언제나 사랑하고, 형제는 환난을 위해 태어납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “형제는 고난의 때를 위해 태어납니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֵת
  english_pob_choice: at all times
  chosen_korean: 언제나
  alternatives_korean:
  - 모든 때에
  - 항상
  lexicon: HALOT
  rationale: 포괄적 시간 범위를 압축해 드러내는 한국어 관용 표현으로, 잠언의 보편적 진술성을 자연스럽게 살렸습니다.
- source_word: אֹהֵב הָ/רֵעַ
  english_pob_choice: a friend loves
  chosen_korean: 친구는 ... 사랑하고
  alternatives_korean:
  - 한 친구는 ... 사랑합니다
  - 친구가 ... 사랑합니다
  lexicon: HALOT
  rationale: 히브리어의 일반적 주어를 한국어 잠언체로 옮겨, 특정 인물보다 ‘친구’라는 유형을 가리키는 뜻을 살렸습니다.
- source_word: לְ֝/צָרָה
  english_pob_choice: for adversity
  chosen_korean: 환난을 위해
  alternatives_korean:
  - 고난을 위해
  - 어려움을 위해
  - 재난을 위해
  lexicon: HALOT
  rationale: צָרָה의 핵심 의미는 압박과 곤경입니다. ‘환난’은 압축적이고 경구적인 어감을 유지하면서도 의미 범위를 충분히 담습니다.
- source_word: יִוָּלֵד
  english_pob_choice: is born
  chosen_korean: 태어납니다
  alternatives_korean:
  - 태어지게 됩니다
  - 태어나는 것입니다
  lexicon: HALOT
  rationale: 니팔형 ילד를 가장 직접적으로 옮기되, 한국어에서는 목적 의미가 자연스럽게 드러나도록 ‘환난을 위해 태어납니다’로 표현했습니다.
theological_decisions:
- issue: 마지막 절의 목적/소명 뉘앙스
  chosen_reading: ‘형제는 환난을 위해 태어납니다’로 옮겨, 고난 때 드러나는 형제의 존재 목적성을 살렸습니다.
  alternative_readings:
  - ‘형제는 환난 때를 위해 태어납니다’
  - ‘형제는 재난을 위해 태어납니다’
  rationale: 히브리어는 단순 발생보다 ‘환난과의 적합성/목적성’을 암시할 수 있지만, 본문이 허용하는 범위를 넘지 않도록 지나친 해석을 피했습니다.
  doctrine_reference: 잠언의 지혜적 진술과 관계 윤리
