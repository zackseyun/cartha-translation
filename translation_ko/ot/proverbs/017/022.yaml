  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב גֵּהָ֑ה וְ/ר֥וּחַ נְ֝כֵאָ֗ה תְּיַבֶּשׁ גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
  footnotes:
  - marker: a
    text: Or 'does good like medicine.' The Hebrew noun גֵּהָה can denote healing, recovery, or remedy/medicine; the main text renders the broader sense 'healing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기뻐하는 마음은 치유를 돕지만, 상한 영은 뼈를 말라붙게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גֵּהָה는 치유, 회복, 또는 처방/의료를 뜻할 수 있습니다. 본문은 더 넓은 뜻의 '치유'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  english_pob_choice: A joyful heart
  chosen_korean: 기뻐하는 마음
  alternatives_korean:
  - 즐거운 마음
  - 기쁜 마음
  - 환한 마음
  lexicon: HALOT
  rationale: 히브리어 לֵב은 잠언에서 내면 전체를 가리키며, שָׂמֵחַ는 단순 감정이 아니라 기쁨의 상태를 뜻하므로 '기뻐하는 마음'이 자연스럽고 원문의 인격적 내면 이미지를 살립니다.
- source_word: יֵיטִב גֵּהָה
  english_pob_choice: promotes healing
  chosen_korean: 치유를 돕지만
  alternatives_korean:
  - 치유에 이바지하지만
  - 회복에 유익하지만
  - 치료에 좋지만
  lexicon: HALOT
  rationale: יֵיטִב의 사역적 의미를 살리면서 גֵּהָה의 넓은 뜻(치유, 회복, 처방/의료)을 한국어에서 과도하게 좁히지 않기 위해 '치유를 돕다'로 옮겼습니다.
- source_word: רוּחַ נְכֵאָה
  english_pob_choice: a crushed spirit
  chosen_korean: 상한 영
  alternatives_korean:
  - 부서진 영
  - 짓눌린 영
  - 꺾인 영
  lexicon: HALOT
  rationale: רוּחַ는 여기서 사람의 내적 생기를 가리키므로 '영'을 유지했고, נְכֵאָה는 눌려 상한 상태를 뜻해 '상한'이 가장 직접적입니다.
- source_word: גָּרֶם
  english_pob_choice: the bones
  chosen_korean: 뼈
  alternatives_korean:
  - 뼈대
  - 골격
  - 뼈들
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 잠언의 관용적 표현에서는 신체 전체의 쇠약을 가리키므로, 한국어에서는 복수형 없이 '뼈'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: מַחֲלָה/רפואה 계열이 아닌 גֵּהָה의 의미 범위
  chosen_reading: '''치유''라는 넓은 표현으로 옮겨 신체적 회복과 전반적 회복 가능성을 함께 열어 두었습니다.'
  alternative_readings:
  - '''치료''로 좁혀 옮기기'
  - '''회복''으로 옮기기'
  - '''의약''의 뉘앙스를 살리기'
  rationale: 본문은 지혜 격언으로서 결과의 일반 원리를 말하므로, 특정 의료 행위보다 회복의 결과를 폭넓게 나타내는 번역이 원문의 범위를 더 잘 보존합니다.
  doctrine_reference: 잠언 17:22의 지혜 문학적 평행법
