  rationale: אַף כִּי의 a fortiori 논리를 한국어에서 자연스럽게 드러내어, ‘어리석은 자에게도 어울리지 않는데 고귀한 사람에게는 더욱 아니다’라는 대비가 분명해지도록 했습니다.
  doctrine_reference: 잠언의 수사 구조와 지혜 문학의 대비법
