  source_fidelity: 첫 행의 שְׂפַת יֶתֶר는 ‘고상한/높은 말’처럼 지위나 격에 걸맞은 말을 가리킬 수 있으며, 둘째 행의 אַף כִּי는 ‘하물며’의 강화 비교입니다. 현 초안은 이 비교를 대체로 전달하지만, ‘거짓된 입술은 더욱 그렇습니다’는 한국어에서 비교의 부정 결론이 불완전하게 들립니다.
