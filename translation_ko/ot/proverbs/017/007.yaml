source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
  footnotes:
  - marker: a
    text: Or 'lofty speech.' The Hebrew expression may emphasize elevated, excessive, or grand speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'a prince' or 'a generous man.' The Hebrew נָדִיב can refer to noble rank or noble character.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자에게는 탁월한 말이 어울리지 않고, 고귀한 사람에게 거짓된 입술은 더욱 그렇습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יֶתֶר는 ‘탁월한’뿐 아니라 ‘높은/과한/고상한’ 말의 뉘앙스도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: נָדִיב은 ‘고귀한 사람’ 외에 ‘지도자/귀족’ 또는 ‘관대한 사람’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָאוָה
  english_pob_choice: is not fitting
  chosen_korean: 어울리지 않고
  alternatives_korean:
  - 합당하지 않고
  - 마땅하지 않고
  - 적절하지 않고
  lexicon: HALOT
  rationale: נָאוָה가 가리키는 ‘어울림/합당함’의 뜻을 현대 한국어로 자연스럽게 살려, 잠언의 품위·적합성 대비를 전달했습니다.
- source_word: נָבָל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 미련한 자
  - 어리석은 사람
  lexicon: HALOT
  rationale: 잠언 문맥의 اخلاق적·지혜문학적 ‘fool’을 한국어 성경 어휘에 맞게 풀어, 단순 지적 부족보다 도덕적 어리석음을 함께 담았습니다.
- source_word: שְׂפַת יֶתֶר
  english_pob_choice: Excellent speech
  chosen_korean: 탁월한 말
  alternatives_korean:
  - 고상한 말
  - 과한 말
  - 높은 말
  lexicon: HALOT
  rationale: 직역의 ‘입술’보다 한국어에서는 ‘말’이 자연스러워, ‘탁월/고상/높은’ 뉘앙스를 살린 ‘탁월한 말’로 옮겼습니다. 영어 주해의 ‘lofty speech’ 가능성은 의미 범위로 반영했습니다.
- source_word: נָדִיב
  english_pob_choice: a noble man
  chosen_korean: 고귀한 사람
  alternatives_korean:
  - 귀족
  - 귀한 사람
  - 후한 사람
  lexicon: HALOT
  rationale: נָדִיב의 신분적·인격적 의미를 함께 포괄하도록 ‘고귀한 사람’으로 번역해, 단순 계급명이나 ‘관대한 사람’으로 좁아지지 않게 했습니다.
- source_word: שְׂפַת שָׁקֶר
  english_pob_choice: lying lips
  chosen_korean: 거짓된 입술
  alternatives_korean:
  - 거짓말하는 입술
  - 거짓의 입술
  - 거짓된 말
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘입술’을 유지하여, 말의 내용보다 발화 주체의 성격을 강조하는 잠언의 표현력을 살렸습니다.
theological_decisions:
- issue: אַף כִּי의 강화 비교
  chosen_reading: 첫 행보다 둘째 행을 더 강하게 금하는 ‘더욱 그렇습니다’로 옮겼습니다.
  alternative_readings:
  - 하물며
  - 더구나
  - 더더욱
  rationale: אַף כִּי의 a fortiori 논리를 한국어에서 자연스럽게 드러내어, ‘어리석은 자에게도 어울리지 않는데 고귀한 사람에게는 더욱 아니다’라는 대비가 분명해지도록 했습니다.
  doctrine_reference: 잠언의 수사 구조와 지혜 문학의 대비법
