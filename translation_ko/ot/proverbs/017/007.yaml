  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
  footnotes:
  - marker: a
    text: Or 'lofty speech.' The Hebrew expression may emphasize elevated, excessive, or grand speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'a prince' or 'a generous man.' The Hebrew נָדִיב can refer to noble rank or noble character.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자에게 고상한 말[a]이 어울리지 않는데, 하물며 고귀한 사람[b]에게 거짓을 말하는 입술이겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יֶתֶר는 ‘고상한’ 외에 ‘높은’, ‘과한’, 또는 ‘탁월한’ 말의 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: נָדִיב은 ‘고귀한 사람’ 외에 ‘지도자’, ‘귀족’, 또는 ‘관대한 사람’으로도 이해될 수 있습니다.
    reason: lexical_alternative
