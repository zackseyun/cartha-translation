  - 귀한 사람
  - 후한 사람
  lexicon: HALOT
  rationale: נָדִיב의 신분적·인격적 의미를 함께 포괄하도록 ‘고귀한 사람’으로 번역해, 단순 계급명이나 ‘관대한 사람’으로 좁아지지 않게 했습니다.
- source_word: שְׂפַת שָׁקֶר
