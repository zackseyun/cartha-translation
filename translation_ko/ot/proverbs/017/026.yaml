  lexicon: HALOT
  rationale: 추가 격언을 여는 부사로서, 현대 한국어에서 자연스럽고 간결하게 누적성을 드러냅니다.
- source_word: עֲנוֹשׁ לַצַּדִּיק
  english_pob_choice: to punish a righteous man
  chosen_korean: 의인에게 벌을 주는 것
  alternatives_korean:
