  lexicon: HALOT
  rationale: עֲנוֹשׁ은 일반적인 ‘벌하다/벌을 주다’의 의미가 적절하며, לַצַּדִּיק은 대상이 되는 사람을 한국어 조사로 분명하게 옮기는 것이 자연스럽습니다.
- source_word: נְדִיבִים
  english_pob_choice: nobles
  chosen_korean: 고귀한 사람들
  alternatives_korean:
  - 귀족들
  - 지도자들
  - 방백들
  lexicon: HALOT
  rationale: 사회적 지위를 가리키는 복수명사로, 전통적 왕정 용어보다 현대 독자가 이해하기 쉬운 ‘고귀한 사람들’이 본문의 품격과 범위를 함께 살립니다.
- source_word: עַל יֹשֶׁר
  english_pob_choice: for their uprightness / contrary to justice
  chosen_korean: 그들의 바름 때문에
  alternatives_korean:
  - 정직함 때문에
  - 의로움 때문에
  - 의에 어긋나게
  lexicon: HALOT
  rationale: 히브리어 עַל은 원인/근거를 나타낼 수 있어 본문 흐름상 ‘~때문에’가 자연스럽습니다. POB가 제시한 해석상 긴장(‘바름 때문에’인지 ‘정의에 반하여’인지)을 본문에는 보존하고, 선택적 해석은 각주로 남깁니다.
theological_decisions:
- issue: עַל יֹשֶׁר의 의미 범위
  chosen_reading: 본문에는 ‘그들의 바름 때문에’로 두어, 의로운 행위가 오히려 처벌의 이유가 되는 역설을 드러냈습니다.
  alternative_readings:
  - ‘정의에 어긋나게’
  - ‘옳지 않게’
  rationale: 지혜문학의 경구적 평행법에서는 원인 표현을 그대로 살리는 것이 핵심 의미를 보존합니다. 동시에 히브리어 전치사 עַל의 해석 여지를 훼손하지 않도록 의미 범위를 주석으로 남깁니다.
  doctrine_reference: 잠언의 의인/악인 대조, 공의와 불의에 대한 지혜 전통
