  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
  footnotes:
  - marker: a
    text: Or 'The crucible is for silver, and the furnace for gold, and the LORD examines hearts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively, 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 도가니는 은을 위한 것이요, 용광로는 금을 위한 것이며, 야훼[b]께서는 마음을 시험하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 신명 יְהוָה는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצְרֵף
  english_pob_choice: crucible
  chosen_korean: 도가니
  alternatives_korean:
  - 정련 그릇
  - 제련 용기
  lexicon: HALOT
  rationale: 금속을 정련하는 용기를 가리키는 비유적 도구명으로, 한국어에서도 ‘도가니’가 가장 자연스럽고 압축적입니다.
- source_word: כּוּר
  english_pob_choice: furnace
  chosen_korean: 용광로
  alternatives_korean:
  - 제련로
  - 풀무로
  lexicon: HALOT
  rationale: 금속을 녹이거나 제련하는 용광의 이미지를 살리기 위해 ‘용광로’로 옮겼습니다.
- source_word: וּבֹחֵן
  english_pob_choice: tests
  chosen_korean: 시험하십니다
  alternatives_korean:
  - 살피십니다
  - 검사하십니다
  - 검증하십니다
  lexicon: HALOT
  rationale: בחן의 평가·검증적 의미를 살리면서도, 금속 정련의 비유와 대응되는 능동적 심판 행위를 한국어 동사로 자연스럽게 드러냅니다.
- source_word: לִבּוֹת
  english_pob_choice: hearts
  chosen_korean: 마음들
  alternatives_korean:
  - 마음
  - 심장들
  - 속사람들
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 사고와 의지를 포함하는 내면 전체를 가리키므로, 현대 한국어에서 그 기능을 가장 잘 전달하는 ‘마음들’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유 신명은 대체 칭호가 아니라 음역형 ‘야훼’로 재현하여, 원문의 인격적 이름을 보존했습니다.
theological_decisions:
- issue: 히브리어 신명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 직접 신명을 사용하므로, 전통적 대치어보다 고유 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘마음들’의 복수 처리
  chosen_reading: 마음들을 시험하십니다
  alternative_readings:
  - 마음을 시험하십니다
  - 사람의 내면을 시험하십니다
  rationale: 히브리어 복수형 לִבּוֹת를 반영해 복수 표지를 살리되, 한국어에서는 보편 진리를 말하는 잠언의 성격상 어색하지 않게 처리했습니다.
  doctrine_reference: Translation philosophy §3, §6
