  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
  footnotes:
  - marker: a
    text: Or 'vexation to his father.' The Hebrew noun can denote anger, vexation, or grief; here it likely refers to the father's distress caused by the son.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the one who bore him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 아들은 아버지에게 근심이 되고[a], 그를 낳은 여인에게는 쓰라림이 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּעַס는 ‘분노’ 또는 ‘격분’을 뜻할 수도 있으나, 여기서는 아들로 인해 아버지가 겪는 ‘근심’이나 ‘괴로움’을 가리키는 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 일반적인 ‘어머니’라는 말 대신, 직역하여 ‘그를 낳은 이’라는 표현을 사용합니다.
    reason: lexical_alternative
