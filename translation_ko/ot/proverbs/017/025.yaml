id: PRO.17.25
reference: Proverbs 17:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ֣עַס לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וּ֝/מֶ֗מֶר לְ/יוֹלַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
  footnotes:
  - marker: a
    text: Or 'vexation to his father.' The Hebrew noun can denote anger, vexation, or grief; here it likely refers to the father's distress caused by the son.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the one who bore him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 아들은 아버지에게 근심이 되고, 그를 낳은 여자에게는 쓰라림이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּעַס는 여기서 ‘분노’도 가능하지만, 문맥상 아버지가 느끼는 ‘근심’이나 ‘괴로움’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그를 낳은 여자에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  english_pob_choice: grief
  chosen_korean: 근심
  alternatives_korean:
  - 분노
  - 괴로움
  - 슬픔
  lexicon: HALOT
  rationale: 이 문맥에서는 아들이 아버지에게 끼치는 정서적 고통이 핵심이므로, 반응적 감정보다는 결과를 드러내는 ‘근심’이 POB의 ‘grief’를 가장 자연스럽게 옮깁니다.
- source_word: בֵּן כְּסִיל
  english_pob_choice: a foolish son
  chosen_korean: 어리석은 아들
  alternatives_korean:
  - 우매한 아들
  - 바보 같은 아들
  - 어리석은 아들이
  lexicon: HALOT
  rationale: כְּסִיל은 잠언의 지혜문학 용례에서 도덕적·실천적 어리석음을 가리키므로, 일상적이면서도 평가적 뉘앙스를 살리는 ‘어리석은’이 적절합니다.
- source_word: וּמֶמֶר
  english_pob_choice: and bitterness
  chosen_korean: 쓰라림
  alternatives_korean:
  - 쓴맛
  - 비통함
  - 괴로움
  lexicon: HALOT
  rationale: 앞 절의 ‘근심’과 평행을 이루는 감정적 고통을 한국어로 자연스럽게 살리기 위해 ‘쓰라림’을 택했습니다.
- source_word: לְיוֹלַדְתּוֹ
  english_pob_choice: to the woman who bore him
  chosen_korean: 그를 낳은 여자에게
  alternatives_korean:
  - 그의 어머니에게
  - 그를 낳아 준 이에게
  - 낳은 여자에게
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘어머니’보다 ‘그를 낳은 여자’라는 직설적 표현을 쓰므로, 그 구체성을 유지하면서도 한국어 문장 흐름에 맞게 옮겼습니다.
theological_decisions:
- issue: 잠언의 평행법에서 정서적 결과를 어떻게 표현할지
  chosen_reading: 아버지와 어머니에게 미치는 고통을 각각 ‘근심’과 ‘쓰라림’으로 대응시켰습니다.
  alternative_readings:
  - ‘분노’와 ‘쓴마음’으로 더 직접적으로 옮김
  - ‘괴로움’과 ‘비통함’으로 더 일반화함
  rationale: 원문은 아들의 어리석음이 부모에게 초래하는 상이한 정서를 병렬로 제시하므로, 두 항의 대비가 살아나도록 한국어에서도 감정의 결을 구분해 주는 것이 중요합니다.
  doctrine_reference: 잠언의 지혜 문학적 평행법과 가족 윤리
