base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
  footnotes:
  - marker: a
    text: 'Or ''a precious stone,'' ''a magic stone,'' or ''a lucky charm.'' Hebrew: ''a stone of favor.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'he succeeds.' The Hebrew verb can denote acting with success or prospering.
    reason: lexical_alternative
translation:
  language: ko
  text: 뇌물은 그 소유자의 눈에는 행운을 가져다주는 돌과 같습니다[a]. 그가 어디로 향하든 성공합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘값진 돌’, ‘마법의 돌’, ‘행운의 부적’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘호의의 돌’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 형통합니다’로 옮길 수 있습니다. 히브리어 동사는 성공하거나 형통하는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  english_pob_choice: a charm-stone
  chosen_korean: 매력의 돌
  alternatives_korean:
  - 호감의 돌
  - 행운의 돌
  - 부적
  lexicon: HALOT
  rationale: 직역하면 ‘은혜/호의의 돌’이지만, 잠언의 비유적 관용을 살려 돌 이미지와 유효성을 함께 드러내는 표현이 필요했습니다. ‘매력의 돌’은 외형과 효험의 뉘앙스를 함께 살립니다.
- source_word: הַשֹּׁחַד
  english_pob_choice: a bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 선물
  lexicon: HALOT
  rationale: 이 어휘는 중립적 ‘선물’보다 분명히 부정적 의미의 ‘뇌물’이 문맥에 맞습니다.
- source_word: בְּעֵינֵי בְעָלָיו
  english_pob_choice: in the eyes of its owner
  chosen_korean: 그것을 가진 자의 눈에는
  alternatives_korean:
  - 그것의 주인의 눈에는
  - 그것을 소유한 자의 눈에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 평가 기준이 보는 자의 인식에 있다는 점을 유지했습니다.
- source_word: יַשְׂכִּיל
  english_pob_choice: he prospers
  chosen_korean: 형통합니다
  alternatives_korean:
  - 성공합니다
  - 지혜롭게 행합니다
  lexicon: HALOT
  rationale: 이 동사는 ‘성공하다/형통하다’의 결과를 나타낼 수 있으므로, 이 속담의 실질적 성과를 나타내는 ‘형통합니다’를 선택했습니다.
