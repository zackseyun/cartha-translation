source:
  edition: WLC
  text: פּ֣וֹטֵֽר מַ֭יִם רֵאשִׁ֣ית מָד֑וֹן וְ/לִ/פְנֵ֥י הִ֝תְגַּלַּ֗ע הָ/רִ֥יב נְטֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
  footnotes:
  - marker: a
    text: Or 'The beginning of strife is like one who releases water'; the Hebrew image may suggest opening a breach in a dam or channel, after which the flow becomes hard to stop.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'breaks out' is difficult; alternatives include 'bursts forth' or 'is exposed/escalates.' The sense is that one should stop the dispute before it becomes openly unmanageable.
    reason: lexical_alternative
translation:
  language: ko
  text: 다툼의 시작은 물이 터져 나오는 것과 같습니다[a]; 그러므로 분쟁이 일어나기 전에 다툼을 버리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다툼의 시작은 물을 풀어 놓는 사람과 같습니다.” 히브리어 이미지는 둑이나 수로의 틈을 열어 물이 쏟아져 나오게 하는 상황을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  english_pob_choice: letting out water
  chosen_korean: 물이 터져 나오는 것
  alternatives_korean:
