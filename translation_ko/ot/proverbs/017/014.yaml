  - 물을 터뜨리는 것
  lexicon: HALOT
  rationale: 물에 대한 은유를 살리되, 단순한 방출보다 한 번 틈이 나면 제어하기 어려운 상황을 드러내기 위해 '터져 나오는 것'으로 옮겼습니다.
- source_word: מָדוֹן
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 분열
  - 논쟁
  lexicon: HALOT
  rationale: מָדוֹן은 지속적 갈등을 가리키므로, 잠언 문맥에서 자연스럽고 짧은 '다툼'이 적절합니다.
- source_word: הִתְגַּלַּע הָרִיב
  english_pob_choice: it breaks out / the quarrel
  chosen_korean: 분쟁이 일어나기 전에
  alternatives_korean:
