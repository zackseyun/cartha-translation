  - 물을 내보내는 것
  - 물을 터뜨리는 것
  lexicon: HALOT
  rationale: 물에 대한 은유를 살리되, 단순한 방출보다 한 번 틈이 나면 제어하기 어려운 상황을 드러내기 위해 '터져 나오는 것'으로 옮겼습니다.
- source_word: מָדוֹן
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
