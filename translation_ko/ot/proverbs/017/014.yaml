  - 분쟁이 노출되기 전에
  - 분쟁이 격화되기 전에
  lexicon: HALOT
  rationale: 동사의 의미가 कठिन하여, 공개적으로 통제 불가능한 상태가 되기 전이라는 문맥을 따라 '일어나기 전에'로 처리했습니다.
- source_word: נְטוֹשׁ
  english_pob_choice: abandon
  chosen_korean: 버리십시오
  alternatives_korean:
  - 끊으십시오
  - 떠나십시오
  - 그만두십시오
  lexicon: HALOT
  rationale: 명령형의 강도를 살리면서도 현대 한국어에서 자연스럽게 경고하는 표현으로 '버리십시오'를 택했습니다.
