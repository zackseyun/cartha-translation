  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
  footnotes:
  - marker: a
    text: Or 'he who raises his door/gate high seeks ruin.' The image may suggest arrogant self-exaltation, ostentatious building, or a posture that invites disaster.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 죄악을 사랑하는 자는 다툼을 사랑합니다[a]. 자기 문을 높이는 자는 파멸을 구합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “자기 문을 높이는 자”로도 읽을 수 있으며, 그 이미지는 교만한 과시, 호화로운 건축, 또는 재난을 자초하는 태도를 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב פֶּשַׁע
  english_pob_choice: loves transgression
  chosen_korean: 죄악을 사랑하는 자
  alternatives_korean:
  - 반역을 사랑하는 자
  - 범죄를 좋아하는 자
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 의도적 위반/반역의 뉘앙스가 강하므로, 한국어에서는 ‘죄악’으로 옮겨 도덕적·의지적 무게를 살렸습니다.
- source_word: מַצָּה
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 시비
  lexicon: HALOT
  rationale: 잠언의 병행법에서 분쟁 상태를 간결하게 드러내는 표현으로 ‘다툼’이 가장 자연스럽고 문맥상 일반적입니다.
- source_word: מַגְבִּיהַּ פִּתְחוֹ
  english_pob_choice: he who makes his door high
  chosen_korean: 자기 문을 높이는 자
  alternatives_korean:
  - 자기 문을 높게 세우는 자
  - 자기 출입구를 높이는 자
  lexicon: HALOT
  rationale: 히필 분사와 목적어의 직선적 구조를 살려, 건축적 자기 과시의 이미지를 한국어에서도 그대로 보이게 했습니다.
- source_word: שָׁבֶר
  english_pob_choice: destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 붕괴
  lexicon: HALOT
  rationale: שֶׁבֶר의 결과적·재난적 의미를 담으면서도 잠언체에 어울리는 간결한 말로 ‘파멸’을 선택했습니다.
theological_decisions:
- issue: 잠언의 경고를 해석하는 방식
  chosen_reading: 이 절은 죄를 사랑하는 태도와 자기과시적 행위가 결국 파멸을 부른다는 지혜문학적 경고로 읽었습니다.
  alternative_readings:
  - 도시 성문/집 문에 대한 문자적 건축 지시로 읽는 방식
  - 일반적 분쟁이 아니라 특정한 법적 소송을 가리킨다고 보는 방식
  rationale: 본문의 두 행은 병행법으로 연결되어 있어, 문자적 건축 지시보다 도덕적·비유적 경고가 중심입니다. 따라서 이미지를 살리되 교훈적 의미를 분명히 했습니다.
  doctrine_reference: 잠언의 지혜적 교훈과 행위의 결과에 대한 일반적 성경 신학
