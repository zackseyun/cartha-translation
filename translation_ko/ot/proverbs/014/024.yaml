id: PRO.14.24
reference: Proverbs 14:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲטֶ֣רֶת חֲכָמִ֣ים עָשְׁרָ֑/ם אִוֶּ֖לֶת כְּסִילִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
  footnotes:
  - marker: a
    text: Or, following some ancient versions and interpreters, 'the wealth of fools is folly.' The Masoretic Text reads literally, 'the folly of fools is folly.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 이들의 면류관은 그들의 재산이지만, 어리석은 자들의 어리석음은 어리석음입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 역본과 해석자들은 ‘어리석은 자들의 재산은 어리석음’으로 이해하기도 하지만, 마소라 본문은 문자적으로 ‘어리석은 자들의 어리석음은 어리석음’이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 면류관
  alternatives_korean:
  - 왕관
  - 관
  lexicon: HALOT
  rationale: 지혜의 상징적 ‘crown’ 이미지를 살리되, 한국어에서 비유적·격식 있는 표현으로 자연스러운 ‘면류관’을 택했습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise
  chosen_korean: 지혜로운 이들
  alternatives_korean:
  - 지혜로운 사람들
  - 지혜자들
  lexicon: HALOT
  rationale: 집단적 명사성을 살리면서 성중립적으로 읽히는 표현을 선택해 ‘the wise’의 일반성을 보존했습니다.
- source_word: עָשְׁרָם
  english_pob_choice: their wealth
  chosen_korean: 그들의 재산
  alternatives_korean:
  - 그들의 부
  - 그들의 부유함
  lexicon: HALOT
  rationale: 문맥상 소유물·풍요를 뜻하는 표현으로서 한국어 속담체에 자연스러운 ‘재산’을 사용해 대조를 분명히 했습니다.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  english_pob_choice: the folly of fools is folly
  chosen_korean: 어리석은 자들의 어리석음은 어리석음입니다
  alternatives_korean:
  - 어리석은 자들의 어리석음은 어리석음이다
  - 어리석은 자들의 어리석음은 어리석습니다
  lexicon: HALOT
  rationale: MT의 반복과 말장난을 살려, ‘fools’의 표지 자체가 ‘folly’라는 강한 역설을 한국어에서도 반복으로 드러냈습니다.
theological_decisions:
- issue: MT의 반복 구문을 매끈하게 완화할지 여부
  chosen_reading: 본문의 반복을 그대로 살려, 어리석은 자들의 특징이 곧 어리석음이라는 점을 전면에 두었습니다.
  alternative_readings:
  - ‘어리석은 자들의 재산은 어리석음입니다’처럼 일부 고대역본을 따른 완화 읽기
  rationale: 영어 POB가 본문 전통의 반복을 मुख्य 본문에 보존한 판단을 따르며, 잠재적 대안은 주석이 아니라 번역 본문에서 제시하지 않았습니다.
  doctrine_reference: 지혜문학의 수사와 본문비평
