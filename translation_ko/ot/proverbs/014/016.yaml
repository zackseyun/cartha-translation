base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
  footnotes:
  - marker: a
    text: Or 'becomes enraged' or 'oversteps bounds'; the Hebrew verb is difficult, but here likely describes rash, unrestrained behavior.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 두려워하며 악에서 떠나지만, 어리석은 사람은 성급하게 행동하며[a] 자신만만합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 מִתְעַבֵּר는 문맥상 ‘성급하게 날뛰다’, ‘분을 터뜨리다’, 또는 ‘경계를 넘다’라는 뜻이 가능하여 번역이 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 자
  - 현명한 사람
  lexicon: HALOT
  rationale: 히브리어 형용사가 명사적으로 쓰인 표현이지만, 한국어에서는 성별을 드러내지 않는 자연스러운 표현이 더 적절하여 '지혜로운 사람'으로 옮겼습니다.
- source_word: יָרֵא
  english_pob_choice: fears
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 경외하며
  lexicon: HALOT
  rationale: 이 절에서는 하나님에 대한 경외보다 악을 대하는 신중한 두려움이 핵심이므로, 어휘의 기본값인 '두려워하다'를 살렸습니다.
- source_word: וְסָר מֵרָע
  english_pob_choice: turns away from evil
  chosen_korean: 악에서 떠나지만
  alternatives_korean:
  - 악을 피하지만
  - 악에서 돌아서지만
  lexicon: HALOT
  rationale: סור의 의미인 '돌아서다, 떠나다'를 반영해 도덕적 대상인 '악'에서 물러나는 동작을 분명히 했습니다.
- source_word: מִתְעַבֵּר וּבוֹטֵחַ
  english_pob_choice: is reckless and confident
  chosen_korean: 성급하고 자신만만합니다
  alternatives_korean:
  - 분노하며 자신합니다
  - 무리하고 자신합니다
  - 과감하고 자신만만합니다
  lexicon: HALOT
  rationale: 히타펠 동사 미트아베르와 뒤의 בטח는 문맥상 절제되지 않은 돌진성과 잘못된 확신을 함께 나타내므로, '성급하고 자신만만하다'로 압축해 의미를 살렸습니다.
theological_decisions:
- issue: 악에 대한 지혜자의 태도와 어리석은 자의 태도 대비
  chosen_reading: 지혜로운 사람은 악을 단순히 피하는 수준이 아니라 두려움을 가지고 멀어집니다.
  alternative_readings:
  - 지혜로운 사람은 신중합니다
  - 지혜로운 사람은 악을 피합니다
  rationale: 히브리어의 두 동사(두려워하다/떠나다)를 둘 다 살려, 지혜가 단순한 조심성이 아니라 악을 경계하여 실제로 물러서는 태도임을 드러냈습니다.
  doctrine_reference: 잠언의 지혜 문학이 제시하는 도덕적 분별과 실천적 경건
