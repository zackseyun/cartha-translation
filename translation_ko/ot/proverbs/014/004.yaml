lexical_decisions:
- source_word: בְּאֵין / אֲלָפִים
  english_pob_choice: Where there are no oxen
  chosen_korean: 소가 없으면
  alternatives_korean:
  - 황소가 없으면
  - 가축이 없으면
  lexicon: HALOT
  rationale: אֲלָפִים는 문맥상 농경에 쓰이는 짐승을 가리키므로, 한국어에서는 가장 자연스럽고 포괄적인 ‘소’로 옮기되 조건절로 처리했습니다.
- source_word: אֵבוּס בָּר
  english_pob_choice: the manger is clean
  chosen_korean: 구유는 깨끗하지만
  alternatives_korean:
  - 먹이통은 깨끗하지만
  - 구유는 비어 있지만
  lexicon: HALOT
  rationale: אֵבוּס는 동물의 먹이통/구유를 뜻하므로 전통적이면서도 이해되는 ‘구유’를 택했고, בָּר는 오물이 없는 상태를 가리켜 ‘깨끗하다’가 문맥에 맞습니다.
- source_word: וְרָב תְּבוּאוֹת
  english_pob_choice: but abundant crops
  chosen_korean: 곡식이 풍성하게
  alternatives_korean:
  - 수확이 많게
  - 산물이 풍성하게
  lexicon: HALOT
  rationale: תְּבוּאוֹת는 농작물의 산출/추수를 가리키므로, 현대 한국어에서는 ‘곡식’으로 구체화해 지혜문학의 농경 이미지를 살렸습니다.
- source_word: בְּכֹחַ שׁוֹר
  english_pob_choice: by the strength of an ox
  chosen_korean: 황소의 힘으로
  alternatives_korean:
  - 소의 힘으로
  - 소의 강한 힘으로
  lexicon: HALOT
  rationale: בְּ는 수단을 나타내므로 ‘~으로’가 적절하고, שׁוֹר는 노동용 수소를 가리키는 말이라 한국어에서는 ‘황소’가 자연스럽습니다.
