id: PRO.14.25
reference: Proverbs 14:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַצִּ֣יל נְ֭פָשׁוֹת עֵ֣ד אֱמֶ֑ת וְ/יָפִ֖חַ כְּזָבִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
  footnotes:
  - marker: a
    text: Or, 'A true witness delivers souls/persons.' Here 'lives' reflects Hebrew nephashot in the sense of persons or lives preserved, not specifically immaterial souls.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'breathes out lies.' The Hebrew uses vivid speech imagery for uttering falsehood.
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also be rendered more literally, 'and one who breathes out lies is deceit,' or understood adverbially, 'breathes out lies deceitfully.'
    reason: alternative_reading
translation:
  language: ko
  text: 진실한 증인은 생명을 구합니다.[a] 그러나 거짓을 내뿜는 자는[b] 기만적입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְפָשׁוֹת는 여기서 비물질적 ‘영혼’보다 ‘생명’ 또는 ‘사람들’을 뜻하는 것으로 이해하는 것이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘거짓을 내뿜는’이라는 생생한 표현을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 말은 더 문자적으로 ‘기만’으로 옮길 수 있습니다. 또한 ‘기만하는 방식으로 거짓을 내뿜는다’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל נְפָשׁוֹת
  english_pob_choice: rescues lives
  chosen_korean: 생명을 구원합니다
  alternatives_korean:
  - 생명을 구합니다
  - 사람들의 생명을 건져냅니다
  - 영혼들을 구합니다
  lexicon: HALOT
  rationale: נצל은 ‘위험에서 건져내다/구출하다’의 뜻이므로, 속담의 실제적 맥락을 살려 ‘구원하다’보다 결과 중심의 ‘구하다/건져내다’ 계열을 고려할 수 있지만, 한국어에서는 ‘생명을 구원합니다’가 가장 자연스럽고 압축적입니다. נֶפֶשׁ는 여기서 ‘영혼’보다 ‘생명’이 문맥에 맞습니다.
- source_word: עֵד אֱמֶת
  english_pob_choice: a truthful witness
  chosen_korean: 진실한 증인
  alternatives_korean:
  - 진실된 증인
  - 참된 증인
  - 정직한 증인
  lexicon: HALOT
  rationale: ‘증인’이 אמת로 특징지어지는 구문이므로, 단순한 사실 확인자가 아니라 진실에 속한 사람이라는 점을 드러내는 ‘진실한’이 가장 직접적입니다.
- source_word: וְיָפִחַ כְּזָבִים
  english_pob_choice: one who breathes out lies
  chosen_korean: 거짓을 내뿜는 자
  alternatives_korean:
  - 거짓말을 내뿜는 자
  - 거짓을 말하는 자
  - 거짓을 뿜어내는 자
  lexicon: HALOT
  rationale: פוח의 생생한 ‘숨을 내뿜다’ 이미지를 살려, 단순한 ‘말하다’보다 ‘내뿜다’로 옮겼습니다. כְּזָבִים은 복수형이지만 한국어에서는 관용적으로 ‘거짓’이 자연스럽습니다.
- source_word: מִרְמָה
  english_pob_choice: is deceitful
  chosen_korean: 속임수입니다
  alternatives_korean:
  - 속임수입니다
  - 기만입니다
  - 속이는 자입니다
  lexicon: HALOT
  rationale: 문장 끝의 מִרְמָה는 서술적 명사로 짧게 기능하므로, 한국어에서는 ‘속임수입니다’가 가장 간결합니다. POB의 ‘deceitful’과 달리 명사형을 택했지만, 속이는 성격을 결과적으로 드러내는 번역으로 읽힙니다.
theological_decisions:
- issue: 마지막 절구의 מִרְמָה를 형용사적으로 볼지 명사적으로 볼지
  chosen_reading: ‘속임수입니다’로 처리해, 거짓을 내뿜는 자의 성격을 명사적으로 압축했습니다.
  alternative_readings:
  - ‘속임수로 행합니다’
  - ‘속이는 자입니다’
  - ‘속임수입니다/속임수로 드러납니다’
  rationale: 히브리어는 짧은 술어 구문으로 끝나며, POB도 ‘is deceitful’과 ‘deceit’ 가능성을 병기합니다. 한국어에서는 문법상 자연성을 우선하되, 그 사람이 속임수로 규정된다는 긴장을 유지했습니다.
  doctrine_reference: 잠언의 지혜 문장 해석 원리
