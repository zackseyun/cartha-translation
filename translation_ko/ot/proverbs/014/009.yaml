  text: Fools mock guilt[b][a], but among the upright there is favor.
  footnotes:
  - marker: a
    text: Or 'Fools mock the guilt offering.' The Hebrew אָשָׁם can mean either 'guilt' or, in sacrificial contexts, 'guilt offering.'
