source:
  edition: WLC
  text: חַיֵּ֣י בְ֭שָׂרִים לֵ֣ב מַרְפֵּ֑א וּ/רְקַ֖ב עֲצָמ֣וֹת קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
  footnotes:
  - marker: a
    text: Or 'A healing heart is life to the flesh/body.' The Hebrew term rendered 'tranquil' is more literally related to healing or health.
    reason: lexical_alternative
  - marker: b
    text: Or 'envy' for 'jealousy.' The Hebrew word can denote jealousy, envy, or zeal depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 평온한 마음은 몸에 생명을 주지만, 시기는 뼈를 썩게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘치유하는 마음’ 또는 ‘건강한 마음’. 히브리어 마르페는 더 문자적으로 치유 또는 건강과 관련된 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘질투’. 히브리어 단어는 문맥에 따라 질투, 시기, 또는 열심을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי בְשָׂרִים
  english_pob_choice: life to the body
  chosen_korean: 몸에 생명
  alternatives_korean:
  - 육체에 생명
  - 몸의 생명
  - 살에 생명
  lexicon: HALOT
  rationale: 히브리어의 ‘생명’과 ‘육체/몸’의 병렬을 살리되, 지혜문학의 자연스러운 한국어로는 ‘몸에 생명’이 가장 간결하고 의미를 잘 전달합니다.
- source_word: לֵב מַרְפֵּא
  english_pob_choice: A tranquil heart
  chosen_korean: 온유한 마음
  alternatives_korean:
  - 평온한 마음
  - 치유하는 마음
  - 건강한 마음
  lexicon: HALOT
  rationale: מַרְפֵּא는 문자적으로 ‘치유/건강’ 계열이지만, 이 절의 맥락에서는 생명을 주는 내적 상태를 가리키므로 한국어에서는 결과 상태를 드러내는 ‘온유한 마음’이 가장 자연스럽습니다.
- source_word: וּרְקַב עֲצָמוֹת
  english_pob_choice: rottenness to the bones
  chosen_korean: 뼈를 썩게 합니다
  alternatives_korean:
  - 뼈의 썩음입니다
  - 뼈를 부패하게 합니다
  - 뼈에 썩은 것을 가져옵니다
  lexicon: HALOT
  rationale: רְקַב는 ‘썩음/부패’의 강한 이미지이므로 동사화하여 한국어의 생생한 대비를 살렸습니다.
- source_word: קִנְאָה
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 투기
  - 열심
  lexicon: HALOT
  rationale: 이 문맥의 부정적 대비를 고려하면 ‘질투’가 가장 직접적이며, ‘시기’도 가능하지만 한국어 관용에서는 ‘질투’가 더 강한 해악의 뉘앙스를 전달합니다.
