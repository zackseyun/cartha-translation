  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֣רֶךְ אַ֭פַּיִם רַב תְּבוּנָ֑ה וּ/קְצַר ר֝֗וּחַ מֵרִ֥ים אִוֶּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
  footnotes:
  - marker: a
    text: Literally, 'short of spirit'; that is, impatient or short-tempered.
    reason: lexical_alternative
translation:
  language: ko
  text: 분노하기를 더디하는 이는 큰 이해를 얻고, 성급한 사람은 어리석음을 드러냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘영이 짧은’으로, 참을성이 없거나 성급한 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: one who is slow to anger
  chosen_korean: 분노하기를 더디하는 이는
  alternatives_korean:
  - 인내심이 많은 이는
  - 노하기를 더디하는 이는
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 자연스럽게 살리면서, 지혜문학 문맥에 어울리는 현대 한국어 표현으로 옮겼습니다.
- source_word: רַב תְּבוּנָה
  english_pob_choice: has great understanding
  chosen_korean: 큰 이해를 얻고
  alternatives_korean:
  - 깊은 분별을 지니고
  - 큰 통찰을 갖고
  lexicon: HALOT
  rationale: תְּבוּנָה를 ‘이해’로 옮겨 지혜의 인지적 의미를 살렸고, רַב은 그 정도를 ‘큰’으로 간결하게 반영했습니다.
- source_word: קְצַר רוּחַ
  english_pob_choice: one who is quick-tempered
  chosen_korean: 성급한 사람은
  alternatives_korean:
  - 조급한 사람은
  - 마음이 좁은 사람은
  lexicon: HALOT
  rationale: POB의 최종 반영처럼 이 표현은 ‘short of spirit’의 직역보다 문맥상 뜻인 ‘quick-tempered/성급한’이 한국어 독자에게 더 분명합니다.
- source_word: מֵרִים אִוֶּלֶת
  english_pob_choice: exalts folly
  chosen_korean: 어리석음을 드러냅니다
  alternatives_korean:
  - 어리석음을 높입니다
  - 어리석음을 치켜세웁니다
  lexicon: HALOT
  rationale: מֵרִים의 ‘들어 올리다’ 이미지를 한국어에서 자연스럽게 풀어, 분노가 어리석음을 밖으로 드러나게 한다는 의미를 살렸습니다.
theological_decisions:
- issue: קְצַר רוּחַ의 이미지 보존 여부
  chosen_reading: 본문에는 직역적 이미지보다 의미역을 택해 ‘성급한’으로 번역했습니다.
  alternative_readings:
  - ‘영이 짧은’
  - ‘기운이 짧은’
  rationale: 지혜문학의 교훈성을 해치지 않으면서 현대 한국어에서 즉시 이해되는 표현을 우선했습니다. 다만 원문의 직유적 표현은 주석 없이도 충분히 추적 가능합니다.
  doctrine_reference: 지혜문학의 수사와 의미 전달
