base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
  footnotes:
  - marker: a
    text: Literally, 'short of spirit'; that is, impatient or short-tempered.
    reason: lexical_alternative
translation:
  language: ko
  text: 분노하기에 더딘 이는 분별력이 뛰어나지만, 성급한 이는[a] 어리석음을 드러냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘영이 짧은’이라는 말로, 참을성이 없거나 쉽게 성내는 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: one who is slow to anger
  chosen_korean: 분노하기를 더디하는 이는
