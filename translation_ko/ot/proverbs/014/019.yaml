base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
  footnotes:
  - marker: a
    text: Or 'prostrate themselves before the good.' The Hebrew verb can denote a deeper act of bowing low.
    reason: lexical_alternative
  - marker: b
    text: '''At the gates of the righteous'' may imply coming in dependence, supplication, or acknowledgment of the righteous person''s standing.'
    reason: cultural_note
translation:
  language: ko
  text: 악한 자들은 선한 자들 앞에 엎드리며[a], 악인들은 의인의 문 앞에 엎드립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 더 깊이 몸을 낮추어 ‘엎드리다’ 또는 ‘절하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인의 문 앞에’는 의존, 간청, 또는 의인의 지위에 대한 인정을 시사할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ
  english_pob_choice: bow down
  chosen_korean: 굽실거리고
  alternatives_korean:
  - 엎드리고
  - 몸을 낮추고
  - 굽혀 절하고
  lexicon: HALOT
  rationale: 문맥상 낮은 자세로 굴복하는 이미지를 살리되, 현대 한국어에서 ‘굽실거리다’가 지나치게 가볍게 들릴 수 있어, 굴복과 아첨의 뉘앙스를 함께 담는 선택으로 사용했습니다.
- source_word: רָעִים
  english_pob_choice: the evil
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악인들
  - 악한 사람들
  lexicon: HALOT
  rationale: 히브리어 형용사 복수의 실질적 명사 용법을 한국어에서 자연스럽게 풀어 ‘자들’로 옮겼습니다.
- source_word: טוֹבִים
  english_pob_choice: the good
  chosen_korean: 선한 자들
  alternatives_korean:
  - 선한 사람들
  - 의인들
  lexicon: HALOT
  rationale: 첫 행의 ‘악한 자들’과 대구를 이루도록 ‘선한 자들’로 옮겨, 잠언 특유의 간결한 대비를 살렸습니다.
- source_word: שַׁעֲרֵי
  english_pob_choice: the gates of
  chosen_korean: 문 앞에
  alternatives_korean:
  - 성문에
  - 문에서
  - 성문 앞에
  lexicon: HALOT
  rationale: 히브리어 ‘문/성문’은 단순 출입구를 넘어 의지와 호소의 장소를 가리킬 수 있으므로, POB의 문화적 뉘앙스를 살려 ‘문 앞에’로 자연화했습니다.
theological_decisions:
- issue: 의인에게 악인이 ‘문 앞에’ 서 있는 장면의 함의
  chosen_reading: 의인의 문 앞에 서 있는 것은 단순한 위치 묘사만이 아니라, 의인의 지위에 대한 인정이나 도움을 구하는 의존의 태도를 시사합니다.
  alternative_readings:
  - 그냥 집이나 성문의 물리적 위치를 가리킨다
  - 법정/공적 심문 장소를 암시한다
  rationale: POB 주석이 지적하듯 ‘문’은 고대 근동에서 접근, 탄원, 인정의 장소가 될 수 있으므로, 그 함의를 숨기지 않고 열어 두는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 지혜문학의 역전 원리
