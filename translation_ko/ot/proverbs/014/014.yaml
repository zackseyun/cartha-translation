id: PRO.14.14
reference: Proverbs 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
  footnotes:
  - marker: a
    text: Or, 'The one who turns away in heart will be filled from his own ways, and a good man from his own deeds.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the second line is difficult; the sense is likely that the good man is satisfied from what proceeds from his own conduct, in contrast to the inwardly wayward person.
    reason: alternative_reading
translation:
  language: ko
  text: 마음이 돌아선 사람은 자기 길의 열매로 배부를 것이며, 좋은 사람은 자기에게서 나온 것으로 만족할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 길들로’, 또는 ‘자기 행실의 결과로’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 둘째 행은 난해하여, ‘좋은 사람은 자기의 행동에서 비롯된 것으로 만족한다’는 뜻으로 이해하는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו / מִן + דְּרָכָיו
  english_pob_choice: will be filled with his own ways
  chosen_korean: 자기 길의 열매로
  alternatives_korean:
  - 자기 길로
  - 자기 길에서
  - 자기 길에서 나온 것으로
  lexicon: HALOT
  rationale: מִן은 여기서 단순한 위치보다 ‘출처/결과’의 뜻이 강하므로, ‘배부르다’와 결합해 그 행위의 결과를 뜻하는 한국어로 옮겼습니다.
- source_word: יִשְׂבַּע
  english_pob_choice: will be filled
  chosen_korean: 배부를 것이며
  alternatives_korean:
  - 만족할 것이며
  - 가득 찰 것이며
  - 배가 부를 것이며
  lexicon: HALOT
  rationale: יָשַׂב/שָׂבַע 계열은 단순 감정보다 포만의 이미지를 살리므로, 형상을 보존하는 ‘배부르다’를 택했습니다.
- source_word: סוּג לֵב
  english_pob_choice: the one who turns away in heart
  chosen_korean: 마음이 돌아선 사람
  alternatives_korean:
  - 마음이 등을 돌린 사람
  - 마음이 떠난 사람
  - 배교한 마음의 사람
  lexicon: HALOT
  rationale: סוּג는 ‘돌아서다/물러서다’의 의미이므로, 정서적 흔들림보다 도덕적 이탈을 드러내는 ‘마음이 돌아선 사람’이 가장 자연스럽습니다.
- source_word: וּמֵעָלָיו / עָלָיו
  english_pob_choice: with what comes from himself
  chosen_korean: 자기에게서 나온 것으로
  alternatives_korean:
  - 자기에게서 비롯된 것으로
  - 자기 행위로
  - 자기 자신으로부터
  lexicon: HALOT
  rationale: 둘째 행의 קשה 한 구문은 출처를 가리키는 병행으로 이해하는 것이 가장 설득력 있으므로, ‘그에게서 나온 것’이라는 방향을 드러냈습니다.
theological_decisions:
- issue: 둘째 행의 의미가 ‘행위의 결과’인지 ‘자기에게서 나온 것’인지
  chosen_reading: 좋은 사람은 자기에게서 나온 것으로 만족할 것입니다
  alternative_readings:
  - 좋은 사람은 자기 행위의 열매로 만족할 것입니다
  - 좋은 사람은 자기의 길에서 만족할 것입니다
  rationale: 히브리어는 직접적으로 ‘열매’라는 단어를 주지 않지만, 병행법상 둘째 행도 첫째 행처럼 출처/결과의 대조를 이루므로, 해석을 최소화하면서도 자연스럽게 옮겼습니다.
  doctrine_reference: 잠언의 지혜 문학적 병행법과 히브리어 전치사 מִן의 출처 의미
