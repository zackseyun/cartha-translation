id: PRO.14.21
reference: Proverbs 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
  footnotes:
  - marker: a
    text: Or 'happy is he who is gracious to the poor.' The Hebrew term expresses a state of flourishing or blessedness, not merely an emotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃을 업신여기는 자는 죄를 짓습니다. 그러나 가난한 사람에게 은혜를 베푸는 자는 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복이 있습니다’는 히브리어 אַשְׁרָיו가 가리키는 복된 상태를 반영한 표현입니다. 이는 단순한 감정적 ‘행복’보다 삶의 형통과 하나님의 복을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  english_pob_choice: despises
  chosen_korean: 업신여기는
  alternatives_korean:
  - 멸시하는
  - 경멸하는
  lexicon: HALOT
  rationale: בָּז는 단순히 무시하는 정도가 아니라 사람을 깔보며 낮추어 대하는 태도를 뜻하므로, 현대 한국어에서 그 강도를 자연스럽게 살리는 ‘업신여기다’를 택했습니다.
- source_word: לְרֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 그의 이웃
  - 동료
  lexicon: HALOT
  rationale: רֵעַ는 공동체 안의 타인을 가리키며, 잠언 문맥에서는 관계적·윤리적 대상을 넓게 가리키는 ‘이웃’이 가장 자연스럽습니다.
- source_word: חוֹטֵא
  english_pob_choice: sins
  chosen_korean: 죄를 짓습니다
  alternatives_korean:
  - 죄를 범합니다
  - 잘못합니다
  lexicon: HALOT
  rationale: 분사형 חוֹטֵא는 ‘죄인으로서의 상태’보다 ‘죄를 짓는 행위’를 드러내므로, 문어체이면서도 직접적인 ‘죄를 짓습니다’로 옮겼습니다.
- source_word: וּמְחוֹנֵן עניים
  english_pob_choice: is gracious to the poor
  chosen_korean: 가난한 사람에게 은혜를 베푸는
  alternatives_korean:
  - 가난한 사람에게 호의를 베푸는
  - 가난한 사람에게 긍휼을 베푸는
  lexicon: HALOT
  rationale: חנן 계열의 핵심은 호의/은혜를 베푸는 것이므로 ‘은혜를 베푸는’이 어근과 신학적 어감을 가장 잘 살립니다. עניים는 여기서 경제적 취약성을 가리키는 ‘가난한 사람’이 적절합니다.
- source_word: אַשְׁרָיו
  english_pob_choice: blessed is he
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복됩니다
  - 행복합니다
  lexicon: HALOT
  rationale: אַשְׁרֵי/אַשְׁרָיו는 주관적 감정보다 하나님 앞의 번영과 복된 상태를 선언하므로, 전통적이지만 너무 옛스러운 표현은 피하고 ‘복이 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 אַשְׁרָיו가 가리키는 상태
  chosen_reading: 개인의 감정이 아니라 복된 상태와 삶의 형통을 선언하는 표현으로 읽었습니다.
  alternative_readings:
  - 행복하다는 심리 상태로 읽는 해석
  - 단순한 칭찬 구문으로 약화하는 해석
  rationale: 지혜문학의 אַשְׁרֵי 계열은 윤리적 행위에 대한 객관적 복과 번영을 선포하는 형식이므로, ‘복이 있습니다’가 본문의 무게를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §6; wisdom blessing formula
