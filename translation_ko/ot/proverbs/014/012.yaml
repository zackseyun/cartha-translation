base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
  footnotes:
  - marker: a
    text: Or 'There is a way that seems right to a man.' The Hebrew literally says 'before a man,' an idiom for what appears right in one's own view.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 보기에[a] 옳은 길이 있으나, 그 끝은 죽음의 길들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람 앞에’라고 하며, 여기서는 ‘사람 보기에’ 또는 ‘자기 눈에는’이라는 관용적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: 있습니다
  alternatives_korean:
  - 존재합니다
  - 있습니다만
  lexicon: WLC
  rationale: 지혜문학의 일반 진술을 자연스러운 현대 한국어로 옮기되, 존재 진술의 단정성을 살렸습니다.
- source_word: דֶּרֶךְ
  english_pob_choice: a way
  chosen_korean: 길
  alternatives_korean:
  - דרך
  - 노선
  - 방식
  lexicon: HALOT
  rationale: 삶의 과정이나 행실을 가리키는 비유로서 한국어에서도 가장 자연스럽고 반복 어휘와의 연결이 분명한 ‘길’을 택했습니다.
- source_word: יָשָׁר לִפְנֵי אִישׁ
  english_pob_choice: seems right to a man / before a man
  chosen_korean: 사람에게는 옳아 보이는
  alternatives_korean:
  - 사람 앞에서 바른
  - 한 사람에게 바른
  - 사람 보기에 옳은
  lexicon: HALOT
  rationale: לִפְנֵי אִישׁ의 ‘사람 앞에’라는 직역 가능성보다, POB가 지시한 것처럼 자기 눈에는 옳아 보인다는 관용적 뜻을 한국어로 드러냈습니다.
- source_word: דַּרְכֵי מָוֶת
  english_pob_choice: the ways of death
  chosen_korean: 죽음의 길들
  alternatives_korean:
  - 죽음의 길
  - 죽음에 이르는 길들
  - 죽음의 여러 길
  lexicon: HALOT
  rationale: 히브리어 복수형 דַּרְכֵי를 살려 단수보다 넓은 범주의 ‘길들’로 옮겼고, 마וֶת는 해석을 덧붙이지 않고 ‘죽음’으로 유지했습니다.
theological_decisions:
- issue: 복수형 ‘ways of death’의 보존
  chosen_reading: 죽음의 길들
  alternative_readings:
  - 죽음의 길
  - 죽음에 이르는 길
  rationale: 원문 복수형은 단순한 한 길이 아니라 죽음으로 귀결되는 여러 경로를 암시하므로, 한국어에서도 복수성을 보존하는 편이 source-direct합니다.
  doctrine_reference: Translation philosophy §1, §3
