id: PRO.14.5
reference: Proverbs 14:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
  footnotes:
  - marker: a
    text: Or 'utters falsehoods' for 'breathes out lies.' The Hebrew verb pictures false testimony as something exhaled or poured out.
    reason: lexical_alternative
translation:
  language: ko
  text: 신실한 증인은 거짓말하지 않지만, 거짓 증인은 거짓을 내뿜습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “거짓들을 내뿜습니다”입니다. 히브리어 동사는 거짓 증언이 마치 호흡처럼 밖으로 흘러나오는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד אֱמוּנִים
  english_pob_choice: faithful witness
  chosen_korean: 신실한 증인
  alternatives_korean:
  - 충실한 증인
  - 믿을 만한 증인
  lexicon: HALOT
  rationale: עֵד는 법정·증언 맥락의 ‘증인’이 자연스럽고, אֱמוּנִים의 신뢰성은 한국어에서 ‘신실한’이 가장 간결하게 살립니다.
- source_word: לֹא יְכַזֵּב
  english_pob_choice: does not lie
  chosen_korean: 거짓말하지 않습니다
  alternatives_korean:
  - 거짓을 말하지 않습니다
  - 속이지 않습니다
  lexicon: HALOT
  rationale: 증언 문맥에서 כזב의 핵심은 사실을 거슬러 말하는 것이므로, 현대 한국어에서 즉시 이해되는 ‘거짓말하다’로 옮겼습니다.
- source_word: וְיָפִיחַ כְּזָבִים
  english_pob_choice: breathes out lies
  chosen_korean: 거짓을 내뿜습니다
  alternatives_korean:
  - 거짓을 뿜어냅니다
  - 거짓을 토해냅니다
  lexicon: HALOT
  rationale: פוח의 생생한 호흡 이미지를 살리되, 한국어에서 과도하게 생경하지 않도록 ‘내뿜다’를 택했습니다.
- source_word: עֵד שָׁקֶר
  english_pob_choice: a false witness
  chosen_korean: 거짓 증인
  alternatives_korean:
  - 거짓말하는 증인
  - 허위 증인
  lexicon: HALOT
  rationale: שׁקר은 ‘거짓/허위’의 성격을 가리키므로, 관용적인 법정 표현인 ‘거짓 증인’이 가장 분명합니다.
theological_decisions:
- issue: 대구 구조에서 첫 행의 부정과 둘째 행의 생생한 은유를 어떻게 살릴지
  chosen_reading: 첫 행은 단정적 부정문으로, 둘째 행은 ‘거짓을 내뿜습니다’로 대비를 유지했습니다.
  alternative_readings:
  - 첫 행과 둘째 행을 모두 평이한 서술로 맞추는 번역
  - 둘째 행의 이미지를 약화해 ‘거짓말합니다’로 통일하는 번역
  rationale: 히브리어는 성실한 증인의 신실함과 거짓 증인의 역동적 허위를 대조하므로, 두 절의 수사적 차이를 한국어에서도 분명히 드러내는 것이 좋습니다.
  doctrine_reference: 지혜문학의 도덕적 대조법 보존
