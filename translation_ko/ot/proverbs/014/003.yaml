source:
  edition: WLC
  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
  footnotes:
  - marker: a
    text: Or 'a shoot of pride.' The Hebrew word translated 'rod' can also mean 'shoot' or 'branch,' but in this context the image of a rod better fits the proverb's warning about proud speech.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' likely refers to the wise, that is, the lips of the wise protect their owners.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자의 입에는 교만의 막대기가[a] 있으나, 지혜로운 이들의 입술은 그들을[b] 지킵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹטֶר는 ‘막대기’ 외에 ‘싹’이나 ‘가지’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그들’은 명시된 선행사가 없습니다. 문맥상 지혜로운 이들 자신, 곧 그 입술의 소유자들을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  english_pob_choice: In the mouth of
  chosen_korean: 입에는
  alternatives_korean:
  - 입속에는
  - 입 안에는
  lexicon: HALOT
  rationale: בְּ + פֶּה의 장소적 이미지를 한국어에서는 자연스러운 ‘입에는’으로 옮겨, 입에서 나오는 말의 자리라는 속담적 표현을 살렸습니다.
- source_word: אֱוִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 바보
  - 미련한 자
  lexicon: HALOT
  rationale: 지혜문학의 אֱוִיל은 단순한 지능 부족보다 도덕적·영적 완고함을 가리키므로, 구어체의 ‘바보’보다 중립적이면서도 평가적인 ‘어리석은 자’로 옮겼습니다.
- source_word: חֹטֶר
  english_pob_choice: a rod
  chosen_korean: 몽둥이
  alternatives_korean:
  - 막대기
  - 지팡이
  - 싹
  lexicon: HALOT
  rationale: 이 문맥에서는 ‘싹/가지’보다 교만한 말이 가져오는 해악과 징계를 떠올리게 하는 도구 이미지가 더 강하므로, 한국어에서 직관적으로 그 이미지를 전달하는 ‘몽둥이’를 택했습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise
  chosen_korean: 지혜로운 이들
  alternatives_korean:
  - 지혜로운 자들
  - 지혜자들
  - 지혜로운 사람들
  lexicon: HALOT
  rationale: 복수 형용사의 실체명사적 용법을 살려 대표적 집단을 가리키는 표현으로 옮겼고, 시적 병행을 위해 자연스러운 한국어 복수 표현을 사용했습니다.
theological_decisions:
- issue: 대조 접속과 지시대명사 처리
  chosen_reading: 후반절을 대조적으로 읽어 ‘지혜로운 이들의 입술’이 ‘그들’을 지키는 것으로 옮겼습니다.
  alternative_readings:
  - 그리고 지혜로운 이들의 입술은 그것을 지킵니다
  - 지혜로운 이들의 입술은 자신들을 지킵니다
  rationale: 히브리어의 ו는 단순한 ‘그리고’일 수도 있지만, 잠언의 평행구에서는 대조 의미가 자연스럽고, כְּמָשְׁל 스타일상 ‘그들’은 지혜로운 이들의 소유자 자신을 가리키는 압축 표현으로 보입니다.
  doctrine_reference: 잠언의 평행법과 대조적 경구 구조
