id: PRO.14.2
reference: Proverbs 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
  footnotes:
  - marker: a
    text: Or, 'but he who is devious in his ways'; the Hebrew describes a person twisted or crooked in conduct.
    reason: lexical_alternative
  - marker: b
    text: The pronoun in 'despises him' most naturally refers to the LORD; alternatively, some take it more generally.
    reason: alternative_reading
translation:
  language: ko
  text: 정직하게 행하는 사람은 야훼를 두려워합니다. 그러나 그의 길이 비뚤어진 사람은 그분을 멸시합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 길들이 비뚤어진 사람’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분을’은 가장 자연스럽게 야훼를 가리킵니다. 더 넓게는 사람이나 지혜의 질서를 가리킨다고 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ בְּיָשְׁרוֹ
  english_pob_choice: walks in his uprightness
  chosen_korean: 정직하게 걷는 사람
  alternatives_korean:
  - 그의 정직함 가운데 걷는 사람
  - 올곧게 걷는 사람
  lexicon: HALOT
  rationale: הלך는 지혜문학에서 삶의 방식 전체를 가리키는 관용으로 쓰이므로 ‘걷다’를 유지하되, 한국어에서는 ‘정직하게 걷는 사람’이 의미와 문맥을 가장 자연스럽게 드러냅니다.
- source_word: יְרֵא יְהוָה
  english_pob_choice: fears Yahweh
  chosen_korean: 야훼를 두려워합니다
  alternatives_korean:
  - 야훼를 경외합니다
  - 야훼를 무서워합니다
  lexicon: HALOT
  rationale: יָרֵא + 여호와/야훼는 잠언의 핵심 지혜 관용구이므로, 부드럽게 완화하지 않고 ‘두려워합니다’로 직접 옮겼습니다.
- source_word: וּנְלוֹז דְּרָכָיו
  english_pob_choice: the one whose ways are crooked
  chosen_korean: 그의 길이 비뚤어진 사람
  alternatives_korean:
  - 그의 길들이 구부러진 사람
  - 그의 행실이 비뚤어진 사람
  lexicon: HALOT
  rationale: נלוז와 ‘길들’ 이미지는 행위의 비틀림을 가리키므로, 한국어에서는 ‘길이 비뚤어진’으로 옮겨 관용과 이미지 둘 다 살렸습니다.
- source_word: בּוֹזֵהוּ
  english_pob_choice: despises him
  chosen_korean: 그분을 멸시합니다
  alternatives_korean:
  - 그를 업신여깁니다
  - 그분을 경멸합니다
  lexicon: HALOT
  rationale: בזה는 ‘멸시하다/업신여기다’의 강한 경멸을 뜻하므로 그 강도를 유지했습니다. 대명사 ‘그분’은 문맥상 앞의 야훼를 가리키는 해석을 드러냅니다.
theological_decisions:
- issue: בּוֹזֵהוּ의 대명사 지시 대상
  chosen_reading: 마지막 ‘그분’은 가장 자연스럽게 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 더 일반적으로는 지혜의 질서나 앞의 의로운 사람을 가리킨다고 볼 수도 있습니다.
  rationale: 문장은 ‘야훼를 두려워함’과 ‘그분을 멸시함’의 대조로 구성되어 있어, 가장 가까운 선행사인 야훼를 따르면 평행법이 가장 선명해집니다.
  doctrine_reference: 의미상의 긴장을 평준화하지 않고, 본문 문맥이 가장 강하게 지시하는 읽기를 채택합니다.
