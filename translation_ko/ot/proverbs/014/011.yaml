id: PRO.14.11
reference: Proverbs 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
  footnotes:
  - marker: a
    text: Or 'will blossom' or 'will sprout'; the Hebrew verb evokes the imagery of budding growth.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 집은 멸망하고, 정직한 이들의 천막은 번성합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번성합니다’는 히브리어 동사가 지닌 ‘싹트다/피다’의 성장 이미지를 뜻으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  english_pob_choice: house of
  chosen_korean: 집은
  alternatives_korean:
  - 집
  - 가문은
  - 가정은
  lexicon: HALOT
  rationale: 히브리어 구성형은 소유·연관 관계를 나타내므로 한국어에서는 ‘집은’으로 처리해 대조 구조를 자연스럽게 살렸습니다. 여기서 ‘집’은 물리적 건물뿐 아니라 그 집안/가문까지도 포함하는 시적 이미지입니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 지속적인 도덕적 악함을 가리키는 통상적 명사적 용법이므로, 간결하고 관용적인 ‘악인’이 적절합니다.
- source_word: אֹהֶל
  english_pob_choice: tent
  chosen_korean: 천막
  alternatives_korean:
  - 장막
  - 텐트
  - 거처
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 살리기 위해 ‘집’과 평행되는 ‘천막’을 택했습니다. ‘장막’보다 현대 한국어에서 직관적이면서도 임시 거처의 대비를 더 분명히 드러냅니다.
- source_word: יַפְרִיחַ
  english_pob_choice: will flourish
  chosen_korean: 번성합니다
  alternatives_korean:
  - 피어납니다
  - 싹틉니다
  - 무성해집니다
  lexicon: HALOT
  rationale: 동사의 본래 이미지에는 ‘꽃피다/싹트다’의 생장 은유가 있지만, 잠언의 관용적 의미는 ‘형통하다, 번성하다’이므로 이를 우선 살렸습니다. 다만 성장 이미지를 완전히 지우지 않는 범위에서 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 의인의 거처를 ‘house’와 대조되는 ‘tent’로 살릴지 여부
  chosen_reading: ‘천막’을 사용해 악인의 ‘집’과 의인의 ‘천막’이라는 대조를 유지했습니다.
  alternative_readings:
  - ‘집’으로 평준화
  - ‘장막’으로 성서적 어휘화
  rationale: 이 절은 안정된 ‘집’과 소박한 ‘천막’의 대비를 통해 악인의 견고해 보이는 기반이 무너지고 의인의 겸손한 삶이 번성함을 강조합니다. 대조를 약화시키는 평준화는 피했습니다.
  doctrine_reference: 잠언의 시적 지혜 문맥과 보응의 대조
