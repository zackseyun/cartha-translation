source:
  edition: WLC
  text: קְֽצַר אַ֭פַּיִם יַעֲשֶׂ֣ה אִוֶּ֑לֶת וְ/אִ֥ישׁ מְ֝זִמּ֗וֹת יִשָּׂנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
  footnotes:
  - marker: a
    text: Or 'quick-tempered' for 'short-tempered.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a man of evil schemes'; the Hebrew 'schemes/plans' can carry a negative sense in wisdom literature.
    reason: lexical_alternative
translation:
  language: ko
  text: 성미가 급한 사람은 어리석게 행동하고, 음모를 꾸미는 사람은 미움을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 관용구는 문자적으로 '콧구멍/숨이 짧은' 뜻이지만, 실제 의미는 '성미가 급한'입니다.
    reason: lexical_alternative
  - marker: b
    text: '''음모''는 여기서 단순한 계획보다 부정적인 뉘앙스를 살린 번역입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  english_pob_choice: short-tempered
  chosen_korean: 성미가 급한
  alternatives_korean:
  - 단기(短氣)인
  - 속이 좁은
  - 빨리 화내는
  lexicon: HALOT
  rationale: 직역하면 '콧구멍/숨이 짧은' 관용구이지만, 한국어에서는 '성미가 급한'이 감정이 빨리 치미는 뜻을 자연스럽게 살립니다.
- source_word: יַעֲשֶׂה אִוֶּלֶת
  english_pob_choice: acts foolishly
  chosen_korean: 어리석게 행동하고
  alternatives_korean:
  - 어리석음을 행하고
  - 우매하게 하고
  - 어리석은 일을 하고
  lexicon: HALOT
  rationale: 동사 'עשה'와 명사 'אִוֶּלֶת'의 결합을 한국어에서는 '어리석게 행동하다'로 옮기는 것이 의미와 문장 자연성을 함께 살립니다.
- source_word: מְזִמּוֹת
  english_pob_choice: schemes
  chosen_korean: 음모를 꾸미는
  alternatives_korean:
  - 계획을 세우는
  - 꾀를 부리는
  - 사악한 계획을 꾸미는
  lexicon: HALOT
  rationale: 잠언 문맥에서 이 단어는 대개 부정적 뉘앙스를 띠므로, 영어 POB의 'schemes'에 맞춰 한국어도 부정성이 드러나는 표현을 택했습니다.
- source_word: יִשָּׂנֵא
  english_pob_choice: is hated
  chosen_korean: 미움을 받습니다
  alternatives_korean:
  - 미움을 당합니다
  - 미움을 받습니다만
  - 사람들에게 미움을 받습니다
  lexicon: HALOT
  rationale: 니팔형의 수동 의미를 한국어에서도 직접적으로 반영해, 주체가 타인에게서 미움을 받는다는 뜻을 간결하게 살렸습니다.
theological_decisions:
- issue: 격언문의 일반 진술을 현재형으로 옮길지 미래형으로 옮길지
  chosen_reading: 현재형 진술로 옮겨 잠언의 보편적 지혜 진술 성격을 살렸습니다.
  alternative_readings:
  - 미래형으로 옮겨 예언적 뉘앙스를 주는 번역
  - '''될 것입니다''로 약화된 서술'
  rationale: 히브리어 잠언의 격언적 현재/미완료는 일반 진리를 말하는 기능이 강하므로, 한국어에서도 현재형이 가장 자연스럽고 원문 기능을 잘 반영합니다.
  doctrine_reference: 잠언 문학의 격언적 일반화
