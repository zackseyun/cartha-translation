  - 꾀를 부리는
  - 사악한 계획을 꾸미는
  lexicon: HALOT
  rationale: 잠언 문맥에서 이 단어는 대개 부정적 뉘앙스를 띠므로, 영어 POB의 'schemes'에 맞춰 한국어도 부정성이 드러나는 표현을 택했습니다.
- source_word: יִשָּׂנֵא
  english_pob_choice: is hated
  chosen_korean: 미움을 받습니다
  alternatives_korean:
