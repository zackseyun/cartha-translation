base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
  footnotes:
  - marker: a
    text: Or 'quick-tempered' for 'short-tempered.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a man of evil schemes'; the Hebrew 'schemes/plans' can carry a negative sense in wisdom literature.
    reason: lexical_alternative
translation:
  language: ko
  text: 성미가 급한 사람[a]은 어리석게 행동하고, 계략을 꾸미는 사람[b]은 미움을 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '콧구멍이 짧은 사람'이라는 히브리어 관용구입니다. '성미가 급한 사람' 또는 '쉽게 화내는 사람'을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '계획을 세우는 사람'. 히브리어는 '계획들/계책들'을 뜻하며, 이 문맥에서는 부정적인 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  english_pob_choice: short-tempered
