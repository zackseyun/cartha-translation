    rationale: 히브리어 부정사 לָסוּר의 행위자는 일반적으로 이해되지만 명시되어 있지 않습니다. 한국어에서도 목적어를 보충하지 않고 ‘피하게 합니다’로 표현하면 의미와 일반성을 유지할 수 있습니다.
  - severity: medium
