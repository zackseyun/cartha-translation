    rationale: 본문이 이미 ‘샘’인데 ‘또는 샘’은 대안이 아닙니다. 또한 ‘돌아서게 하도록’은 해당 문맥에서 독립적인 대안 번역으로 기능하지 못합니다. 각주는 각각 ‘근원’과 부정사의 목적 표현을 제시하도록 수정합니다.
