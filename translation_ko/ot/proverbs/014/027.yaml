id: PRO.14.27
reference: Proverbs 14:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
  footnotes:
  - marker: a
    text: Or 'a spring of life.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to turn away from the snares of death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 두려워하는 것은 생명의 샘입니다. 그것은 사람을 죽음의 올무에서 돌아서게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '샘'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '죽음의 올무에서 돌아서게 하도록'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: fear of Yahweh
  chosen_korean: 여호와를 두려워하는
  alternatives_korean:
  - 여호와를 경외하는
  - 여호와를 무서워하는
  lexicon: HALOT
  rationale: 히브리어 יִרְאַת는 지혜문학의 핵심 표현으로 단순한 존중보다 두려움과 경외를 함께 담습니다. 한국어에서는 관용적이면서도 긴장을 살리는 '두려워하는'이 가장 직접적입니다.
- source_word: מְקוֹר
  english_pob_choice: fountain
  chosen_korean: 샘
  alternatives_korean:
  - 근원
  - 분수
  lexicon: HALOT
  rationale: 메타포는 생명을 공급하는 물의 근원을 가리키므로 한국어에서는 자연스럽고 시각적인 '샘'이 적절합니다. '근원'은 의미는 분명하지만 비유의 생동감이 약합니다.
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 지혜문맥의 חַיִּים는 단순한 생물학적 생존을 넘어 삶 전체와 생명력을 아우르므로 '생명'이 가장 넓고도 정확합니다.
- source_word: לָסוּר מִמֹּקְשֵׁי מָוֶת
  english_pob_choice: to turn one away from the snares of death
  chosen_korean: 사람을 죽음의 올무에서 돌아서게 합니다
  alternatives_korean:
  - 죽음의 올무에서 돌이키게 합니다
  - 죽음의 덫에서 벗어나게 합니다
  lexicon: HALOT
  rationale: לָסוּר의 결과/목적 용법을 한국어 자연문으로 풀어 '돌아서게 합니다'로 옮겼습니다. מֹקֵשׁ는 사냥/함정의 이미지를 살려 '올무'로 번역했습니다.
theological_decisions:
- issue: '''여호와를 두려워함''의 의미 범위'
  chosen_reading: '''두려워하는''을 유지해 경외와 순종을 포함하는 지혜문학의 긴장을 보존했습니다.'
  alternative_readings:
  - 여호와를 경외하는 것은 생명의 샘입니다
  - 여호와를 경외함은 생명의 샘입니다
  rationale: 이 구절은 단순한 감정이 아니라 하나님 앞의 근본 태도를 말하므로, 부드러운 '경외'로만 좁히지 않고 원문의 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §3; Contested terms table for יְהוָה
- issue: לָסוּר의 기능
  chosen_reading: 후반절을 목적/결과로 자연스럽게 풀어 '사람을 죽음의 올무에서 돌아서게 합니다'로 옮겼습니다.
  alternative_readings:
  - 죽음의 올무에서 돌이키기 위해
  - 죽음의 올무에서 돌아서게 하기 위하여
  rationale: 히브리어 부정사구는 문자적으로 '돌아가게 하다'이지만, 한국어에서는 속담적 진술로서 결과를 드러내는 문장이 더 정확하게 전달됩니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
