  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
  footnotes:
  - marker: a
    text: Or 'kindness and truth,' or 'mercy and faithfulness.' The Hebrew pair often denotes loyal love together with reliability or truthfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 꾀하는 자들은 길을 잃지 않겠습니까? 그러나 선을 꾀하는 자들에게는 인애와 진실이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인애와 진실’은 히브리어의 관용적 짝을 반영한 번역입니다. 다른 가능한 번역으로는 ‘자비와 신실함’ 또는 ‘인자와 성실’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Will not
  chosen_korean: 길을 잃지 않겠습니까?
  alternatives_korean:
  - 그렇지 않겠습니까?
  - 정녕 길을 잃지 않겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 기대 답변을 살리면서, 지혜문맥의 도덕적 이탈을 한국어로 자연스럽게 나타내기 위해 ‘길을 잃다’를 택했습니다.
- source_word: יִתְעוּ
  english_pob_choice: go astray
  chosen_korean: 길을 잃다
  alternatives_korean:
  - 그릇되다
  - 방황하다
  lexicon: HALOT
  rationale: 단순한 이동의 방황보다 도덕적·지혜적 이탈을 가리키므로 ‘길을 잃다’가 의미를 가장 잘 전달합니다.
- source_word: חֶסֶד וֶאֱמֶת
  english_pob_choice: steadfast love and faithfulness
  chosen_korean: 인애와 진실
  alternatives_korean:
  - 인자와 신실함
  - 자애와 성실
  lexicon: HALOT
  rationale: 히브리어의 관용적 짝을 한국어에서 지나치게 교회화하지 않으면서도, יחס/신의 관계를 담는 ‘인애’와 ‘진실’로 옮겨 긴밀한 대응을 살렸습니다.
- source_word: חֹרְשֵׁי טוֹב
  english_pob_choice: those who devise good
  chosen_korean: 선을 꾀하는 자들
  alternatives_korean:
  - 선을 도모하는 자들
  - 선을 계획하는 자들
  lexicon: HALOT
  rationale: 앞부분의 ‘악을 꾀하는 자들’과 같은 동사를 반복해 대조를 살렸고, ‘좋은 것’보다 윤리적 범주인 ‘선’을 택해 잠언의 대구를 분명히 했습니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 한국어 대응이 전통 교회 용어보다 더 넓은 의미를 가질 수 있음
  chosen_reading: ‘인애와 진실’로 번역해 언약적 사랑과 신뢰성을 함께 드러냈습니다.
  alternative_readings:
  - ‘자비와 신실함’
  - ‘인자와 성실’
  rationale: 이 구절의 핵심은 추상적 ‘진리’보다 관계적 신뢰와 충성입니다. 따라서 두 용어의 관용적 결합이 주는 윤리적·언약적 힘을 유지하는 방향을 택했습니다.
  doctrine_reference: 지혜문학의 평행법; חֶסֶד וֶאֱמֶת의 관용적 쌍어법
