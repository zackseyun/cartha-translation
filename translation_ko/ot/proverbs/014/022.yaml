  source_fidelity: 첫 절의 ‘악을 꾀하는 이들이 길을 잃지 않겠습니까?’는 הֲלוֹא와 יִתְעוּ의 수사 의문 및 도덕적 이탈의 뜻을 적절히 살립니다. 둘째 절은 동사가 생략된 히브리어 명사절이므로, ‘…에게는 …이 있습니다’는 사랑과 신실함이 그들에게 속하거나 그들에게 주어진다는 열린 관계를 과도하게 한쪽으로 확정하지 않습니다.
  naturalness: ‘인애’는 성서 문체에서는 통용되지만 현대 표준어의 일반 독자에게는 다소 낯선 한자어입니다. ‘한결같은 사랑’은 חֶסֶד의 지속적·충실한 사랑의 뉘앙스를 자연스러운 현대 한국어로 전달합니다. ‘신실함’은 אֱמֶת의 관계적 신뢰성이라는 문맥적 의미를 ‘진실’보다 분명히 드러냅니다.
  terminology: ‘악/선’과 ‘꾀하다’의 대구는 유지합니다. חֶסֶד וֶאֱמֶת는 ‘한결같은 사랑과 신실함’으로 옮기고, 각주에서 ‘인애와 진실’ 및 다른 어휘 가능성을 밝혀 직역적·전통적 대응도 확인할 수 있게 합니다.
