reference: Proverbs 14:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
  footnotes:
  - marker: a
    text: Or 'Wisdom rests in the heart of one who has understanding, but among fools it becomes known.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분별 있는 사람의 마음에는 지혜가 머물러 있지만, 어리석은 자들 가운데에서는 지혜가 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어리석은 자들 가운데에서는 지혜가 알려집니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֵב נָבוֹן
  english_pob_choice: in the heart of a discerning man
  chosen_korean: 분별 있는 사람의 마음에는
  alternatives_korean:
  - 분별 있는 자의 마음에는
  - 이해하는 사람의 마음에는
  lexicon: HALOT
  rationale: לֵב의 중심 의미를 한국어 ‘마음’으로 자연스럽게 옮기되, נָבוֹן은 지적 능력보다 분별력을 가리키므로 ‘분별 있는 사람’이 가장 직접적입니다.
- source_word: תָּנוּחַ
  english_pob_choice: rests
  chosen_korean: 쉰다
  alternatives_korean:
  - 머문다
  - 안식한다
  - 자리 잡는다
  lexicon: HALOT
  rationale: נוח의 핵심 이미지는 ‘쉬다/안정되다’이므로 짧고 평이한 ‘쉰다’가 잠잠히 머무는 지혜의 상태를 잘 드러냅니다.
- source_word: וּבְקֶרֶב כְּסִילִים
  english_pob_choice: but in the midst of fools
  chosen_korean: 그러나 어리석은 자들 가운데서는
  alternatives_korean:
  - 그런데 어리석은 자들 가운데서는
  - 어리석은 자들 한가운데서는
  - 어리석은 자들 가운데
  lexicon: HALOT
  rationale: קֶרֶב의 공간적 이미지는 ‘가운데/한가운데’로 살리되, 앞절과의 대비를 한국어 접속사 ‘그러나’로 명확히 했습니다.
- source_word: תִּוָּדֵעַ
  english_pob_choice: it makes itself known
  chosen_korean: 그것이 드러납니다
  alternatives_korean:
  - 그것이 알려집니다
  - 그것이 나타납니다
  - 그것이 스스로 알려집니다
  lexicon: HALOT
  rationale: 니팔형 ידע는 단순 수동인 ‘알려지다’보다 상태가 밖으로 드러나는 의미가 있어, 지혜가 어리석은 자들 가운데서 눈에 띄게 나타난다는 점을 ‘드러납니다’로 옮겼습니다.
