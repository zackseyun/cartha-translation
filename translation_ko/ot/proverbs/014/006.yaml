  terminology: ‘지혜’, ‘지식’, ‘분별’은 적절합니다. לֵץ는 ‘거만한 자’보다 ‘비웃는 자’로 옮겨 조롱하는 의미를 반영했습니다. נָבוֹן은 대표적 남성 단수이지만 속담의 일반적 사람을 가리키므로 한국어에서는 ‘분별 있는 사람’이 자연스럽습니다.
