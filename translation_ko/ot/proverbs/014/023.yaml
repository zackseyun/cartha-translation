  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
  footnotes:
  - marker: a
    text: Or 'to poverty.' The Hebrew מַחְסוֹר can denote lack, want, or poverty.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 수고에는 이익이 있으나, 말만 하는 것은 오직 궁핍에 이르게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난.’ 히브리어 מַחְסוֹר는 결핍, 부족, 궁핍, 가난을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֶצֶב
  english_pob_choice: In all labor
  chosen_korean: 모든 수고에는
  alternatives_korean:
  - 모든 노동에는
  - 모든 노력에는
  - 모든 노고에는
  lexicon: HALOT
  rationale: עֶצֶב은 고된 노동과 수고의 뉘앙스를 가지므로, 현대 한국어에서는 자연스럽고 뜻을 살리는 '수고'가 적절합니다. 조사는 '에는'으로 일반 원리를 제시하는 격언체를 살렸습니다.
- source_word: מוֹתָר
  english_pob_choice: profit
  chosen_korean: 이익
  alternatives_korean:
  - 유익
  - 남는 것
  - 이득
  lexicon: HALOT
  rationale: מוֹתָר는 남는 이익, 잔여분, 유익을 가리킬 수 있으므로, 지혜문맥에서 간결하고 현대적인 '이익'이 적합합니다.
- source_word: וּדְבַר שְׂפָתַיִם
  english_pob_choice: but mere talk
  chosen_korean: 입술의 말
  alternatives_korean:
  - 헛말
  - 입술의 이야기
  - 말뿐인 말
  lexicon: HALOT
  rationale: 직역에 가까운 '입술의 말'을 택해 히브리어 관용구를 보존했습니다. '말뿐인 말'처럼 해석을 더하기보다 원문의 이미지를 유지합니다.
- source_word: אַךְ לְמַחְסוֹר
  english_pob_choice: only to lack
  chosen_korean: 오직 궁핍만 가져옵니다
  alternatives_korean:
  - 오직 부족만 가져옵니다
  - 오직 결핍만 낳습니다
  - 오직 가난만 가져옵니다
  lexicon: HALOT
  rationale: מַחְסוֹר는 부족, 결핍, 궁핍, 가난까지 아우를 수 있으므로, POB의 'lack'을 한국어에서 가장 강하게 드러내는 '궁핍'으로 옮겼습니다. 동사의 방향성을 살려 '가져옵니다'로 자연스럽게 처리했습니다.
