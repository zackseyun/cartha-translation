    text: 또는 '낯선 사람이 그 기쁨에 섞이지 않는다' 또는 '그 기쁨에 관여하지 않는다'. 히브리어 동사는 어떤 것에 관여하거나 참여함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '그의 영혼'. 여기서 '영혼'은 내면의 자아나 삶을 가리키며, 반드시 인간의 본질에 관한 기술적 진술은 아닙니다.
    reason: lexical_alternative
