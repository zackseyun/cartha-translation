  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יִרְאַ֣ת יְ֭הוָה מִבְטַח עֹ֑ז וּ֝/לְ/בָנָ֗י/ו יִהְיֶ֥ה מַחְסֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
  footnotes:
  - marker: a
    text: Or, less likely, 'and for his children' may mean 'and for the LORD's children there will be a refuge,' taking 'his' to refer to the LORD rather than to the one who fears him.
    reason: alternative_reading
translation:
  language: ko
  text: 여호와를 경외하는 데에는 강한 확신이 있고, 그의 자녀들에게[a]는 피난처가 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 자녀들’은 여호와를 경외하는 사람의 자녀들을 가리키는 것으로 이해했지만, 덜 유력하게는 ‘여호와의 자녀들’로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת יְהוָה
  english_pob_choice: In the fear of Yahweh
  chosen_korean: 여호와를 경외하는 데에는
  alternatives_korean:
  - 여호와를 두려워하는 가운데에는
  - 여호와를 경외함 속에는
  lexicon: HALOT
  rationale: ב + יִרְאָה는 단순한 감정이 아니라 여호와 앞에서의 경외의 영역을 가리키므로, 한국어에서도 ‘경외하는 데’로 그 삶의 상태를 살렸습니다.
- source_word: מִבְטַח עֹז
  english_pob_choice: strong confidence
  chosen_korean: 강한 확신
  alternatives_korean:
  - 견고한 신뢰
  - 튼튼한 안전
  lexicon: HALOT
  rationale: מִבְטַח은 신뢰/확신의 상태를 뜻하고 עֹז가 이를 강화하므로, 자연스러운 현대 한국어로 ‘강한 확신’이라 옮겼습니다.
- source_word: וּ/לְ/בָנָ֗י/ו
  english_pob_choice: and for his children
  chosen_korean: 그의 자녀들에게는
  alternatives_korean:
  - 그의 아들들에게는
  - 그 자녀들을 위해
  lexicon: HALOT
  rationale: בָּנִים은 문맥상 후손/자녀를 가리킬 수 있으므로 포괄적인 ‘자녀들’로 옮겼고, ל는 한국어 조사 ‘-에게는’으로 살렸습니다.
- source_word: מַחְסֶה
  english_pob_choice: a refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 피할 곳
  - 도피처
  lexicon: HALOT
  rationale: מַחְסֶה는 보호와 피난의 이미지를 지니므로, 간결하고 성경적 뉘앙스가 살아 있는 ‘피난처’가 적절합니다.
theological_decisions:
- issue: 대명사 ‘his’의 선행사
  chosen_reading: ‘그의 자녀들’은 여호와를 경외하는 사람의 자녀들을 가리키는 것으로 본문에 반영했습니다.
  alternative_readings:
  - ‘그의’가 여호와를 가리켜 ‘여호와의 자녀들’로 이해할 수 있습니다.
  rationale: 직접적인 구문과 잠언 문체상 선행사는 경외하는 사람으로 읽는 것이 가장 자연스럽지만, 대안 독법도 완전히 배제하지 않기 위해 본문은 한 가지 읽기를 택했습니다.
  doctrine_reference: 해석상 긴장이 있는 경우 주본문은 하나의 읽기를 제시하고, 다른 가능성은 주석으로 보존합니다.
