  source_fidelity: 첫 행의 פְתָאיִם은 이미 어리석음(אִוֶּלֶת)을 물려받는 이들과 구별되는, 경험과 분별이 부족하여 쉽게 이끌릴 수 있는 사람들을 가리킵니다. 이를 ‘어리석은 사람들’로 옮기면 목적어 ‘어리석음’과 의미가 중복되고 대조가 약화됩니다. נָחֲלוּ의 상속 은유와 עֲרוּמִים 및 כתר의 관 비유는 유지할 수 있습니다.
  naturalness: ‘유산으로 받다’보다 ‘물려받다’가 한국어에서 상속의 비유를 더 자연스럽게 나타냅니다. ‘분별 있는 자들’과 ‘지식으로 관을 씁니다’는 현대 표준어의 격식 있는 잠언 문체에 자연스럽습니다.
  terminology: פְתָאיִם은 ‘어수룩한 자들’로 조정하여 ‘어리석음’과의 어휘·개념상 구별을 보존했습니다. עֲרוּמִים은 긍정적 문맥에 맞게 ‘분별 있는 자들’로, דָעַת은 ‘지식’으로 유지했습니다. 각주에서 능동적 해석과 관을 쓴 결과 상태의 해석을 문법적으로 자연스럽게 제시했습니다.
