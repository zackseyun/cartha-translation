base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
  footnotes:
  - marker: a
    text: Or 'The prudent crown themselves with knowledge.' The Hebrew verb may be understood actively ('crown') or as describing being adorned/crowned with knowledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 어수룩한 자들은 어리석음을 물려받지만, 분별 있는 자들은 지식으로 관을 씁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 능동적으로 ‘지식으로 관을 씌우다’로도 이해할 수 있으며, 지식으로 관을 쓰거나 관을 씌운 상태가 된다는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  english_pob_choice: inherit
  chosen_korean: 유산으로 받다
  alternatives_korean:
  - 상속받다
  - 받아 소유하다
  lexicon: HALOT
  rationale: נחל의 유산-소유 이미지를 살리되, 한국어에서는 ‘유산으로 받다’가 비유를 자연스럽게 드러내어 동사를 과도하게 풀이하지 않습니다.
- source_word: פְתָאיִם
  english_pob_choice: the simple
  chosen_korean: 어리석은 사람들
  alternatives_korean:
  - 단순한 사람들
  - 미숙한 사람들
  lexicon: HALOT
  rationale: 잠언 문맥의 פתי는 단순한 미성숙만이 아니라 쉽게 잘못 이끌리는 지혜 부재를 가리키므로, 본 절의 대조를 분명히 하는 ‘어리석은 사람들’로 옮겼습니다.
- source_word: עֲרוּמִים
  english_pob_choice: the prudent
  chosen_korean: 신중한 사람들
  alternatives_korean:
  - 분별 있는 사람들
  - 슬기로운 사람들
  lexicon: HALOT
  rationale: 잠언에서 긍정적 의미의 עָרוּם 계열은 분별과 신중함을 뜻하므로, ‘신중한 사람들’이 현대 한국어에서 가장 안정적으로 그 의미를 전달합니다.
- source_word: יַכְתִּרוּ דָעַת
  english_pob_choice: are crowned with knowledge
  chosen_korean: 지식으로 관을 씁니다
  alternatives_korean:
  - 지식으로 관을 씁니다
  - 지식으로 장식됩니다
  lexicon: HALOT
  rationale: 히필 형태의 כתר는 ‘두르다/관을 씌우다’의 이미지를 지니므로, 수동적 상태를 풀어 쓰기보다 ‘지식으로 관을 씁니다’로 은유를 보존했습니다.
theological_decisions:
- issue: 지혜문학의 은유를 현대 한국어에서 어떻게 유지할지
  chosen_reading: ‘관을 쓴다’는 왕권 은유를 그대로 살려, 지식이 신중한 자를 외적 장식이 아니라 정체성과 명예로 둘러싼다는 뜻을 드러냈습니다.
  alternative_readings:
  - 지식으로 장식됩니다
  - 지식의 면류관을 씁니다
  rationale: 본문은 단순한 소유보다 ‘둘러 씌움/관’의 비유가 핵심이므로, 한국어에서도 상징성을 유지하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 잠언의 지혜-어리석음 대조, 지식과 명예의 상징적 결합
