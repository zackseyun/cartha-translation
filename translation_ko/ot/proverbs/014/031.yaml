id: PRO.14.31
reference: Proverbs 14:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
  footnotes:
  - marker: a
    text: Or, 'but whoever honors the poor is gracious to the needy.' The Hebrew pronoun in 'honors him' can be read as referring either to the poor person or to his Maker; the main text takes it as referring to God because of the parallelism.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 사람을 억압하는 자는 그를 지으신 분을 모욕합니다. 그러나 궁핍한 사람에게 은혜를 베푸는 자는 그분을 공경합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁핍한 사람에게 은혜를 베푸는 자는 가난한 사람을 존중합니다’로도 읽을 수 있습니다. 히브리어의 ‘그분을’에 해당하는 대명사는 그를 지으신 분을 가리킬 수도 있고 가난한 사람을 가리킬 수도 있습니다. 본문은 문맥의 평행에 따라 그를 지으신 분을 가리키는 것으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  english_pob_choice: Whoever oppresses
  chosen_korean: 억압하는 자
  alternatives_korean:
  - 착취하는 자
  - 괴롭히는 자
  lexicon: HALOT
  rationale: 지혜문학의 일반화된 잠언 구조를 살려 주어를 명사화했고, 부당한 압박과 착취를 모두 포함할 수 있는 ‘억압하다’로 옮겼습니다.
- source_word: דָּל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 약한 사람
  - 힘없는 사람
  lexicon: HALOT
  rationale: 이 절에서는 사회적·경제적 취약성을 지닌 대상을 가리키므로, 현대 한국어에서 가장 자연스럽고 분명한 ‘가난한 사람’으로 옮겼습니다.
- source_word: חֵרֵף
  english_pob_choice: insults
  chosen_korean: 모욕합니다
  alternatives_korean:
  - 모독합니다
  - 비난합니다
  - 조롱합니다
  lexicon: HALOT
  rationale: ‘비난하다’보다 더 강하게 경멸과 수치를 드러내는 표현이어서, 하나님을 향한 행위를 포함하는 문맥에 맞게 ‘모욕하다’를 택했습니다.
- source_word: עֹשֵׂהוּ
  english_pob_choice: his Maker
  chosen_korean: 그의 만드신 이
  alternatives_korean:
  - 그의 창조주
  - 그를 지으신 분
  lexicon: HALOT
  rationale: 원문의 소유 접미사가 가난한 사람을 가리키는 점을 살리면서도, ‘Maker’의 창조-창작 이미지를 보존하기 위해 직역에 가까운 형태로 옮겼습니다.
- source_word: וּמְכַבְּדוֹ / חֹנֵן אֶבְיוֹן
  english_pob_choice: but whoever is gracious to the needy honors him
  chosen_korean: 그러나 가난한 사람에게 은혜를 베푸는 자는 그를 존중합니다
  alternatives_korean:
  - 그러나 가난한 사람을 존중하는 자는 그에게 은혜를 베풉니다
  - 그러나 궁핍한 사람에게 친절한 자는 그를 존중합니다
  lexicon: HALOT
  rationale: 영어 POB의 최종 판단에 따라 두 번째 행을 ‘가난한 사람에게 은혜를 베푸는 자’로 유지해 히브리어의 행 순서와 의미를 반영했고, ‘honors him’은 ‘그를 존중합니다’로 번역해 보응적 대조를 살렸습니다.
theological_decisions:
- issue: 두 번째 행의 대명사 ‘그를’의 지시 대상
  chosen_reading: ‘그를’은 앞의 ‘그의 만드신 이’, 곧 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 가난한 사람을 가리켜 ‘가난한 사람을 존중하는 자는 가난한 사람에게 은혜를 베푸는 자’로 읽을 수 있습니다.
  rationale: 평행 구조상 ‘가난한 사람을 업신여기는 것 = 그를 지으신 이를 모욕하는 것’과 대응하여, ‘가난한 사람에게 은혜를 베푸는 것 = 그분을 존중하는 것’이라는 신학적 대조가 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it without documentation)
