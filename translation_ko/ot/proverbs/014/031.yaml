    rationale: ‘가난한 사람을 존중하는 자는 가난한 사람에게 은혜를 베푸는 자’에는 종결 서술어가 없습니다. 또한 대명사가 가리킬 수 있는 두 대상과 본문이 택한 독법을 완결된 문장으로 밝혀야 합니다.
