id: PRO.14.13
reference: Proverbs 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם בִּ/שְׂח֥וֹק יִכְאַב לֵ֑ב וְ/אַחֲרִיתָ֖/הּ שִׂמְחָ֣ה תוּגָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/013.yaml
  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
  footnotes:
  - marker: a
    text: Or 'Even in laughter the heart aches'; the Hebrew imperfect can be rendered as a general present in proverbial speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'the outcome of joy is grief' or 'after joy comes grief.'
    reason: lexical_alternative
translation:
  language: ko
  text: 웃음 속에서도 마음은 아플 수 있고, 기쁨의 끝은 슬픔입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 잠언에서 일반적 현재나 가능을 나타낼 수 있으므로, ‘마음이 아픕니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기쁨의 끝’은 ‘기쁨의 결과’ 또는 ‘기쁨 뒤에 오는 것’의 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: -속에서도 / 아플 수 있고
  alternatives_korean:
  - 또
  - 심지어
  lexicon: HALOT
  rationale: 여기서 גַּם은 단순한 덧붙임보다 양보·강조의 뉘앙스를 가지므로, 앞의 상황을 인정하면서도 그 안에 반전 가능성이 있음을 드러내는 방식으로 옮겼습니다.
- source_word: בִּשְׂחוֹק
  english_pob_choice: in laughter
  chosen_korean: 웃음 속에서도
  alternatives_korean:
  - 웃음 가운데
  - 웃는 중에도
  lexicon: HALOT
  rationale: 명사적 이미지인 ‘웃음’을 살리면서 한국어에서 자연스러운 ‘속에서도’ 구문으로 감정의 역설을 표현했습니다.
- source_word: יִכְאַב לֵב
  english_pob_choice: the heart may ache
  chosen_korean: 마음은 아플 수 있고
  alternatives_korean:
  - 마음이 아픕니다
  - 마음이 아플 수 있습니다
  lexicon: HALOT
  rationale: 잠언체의 일반 진술을 반영해 단정적 현재보다 가능·일반성을 담는 ‘-ㄹ 수 있다’로 처리했고, לֵב은 감정과 내면의 중심을 뜻하는 한국어 ‘마음’으로 옮겼습니다.
- source_word: וְאַחֲרִיתָהּ
  english_pob_choice: and the end of
  chosen_korean: 기쁨의 끝은
  alternatives_korean:
  - 그리고 그 결과는
  - 기쁨의 결말은
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 시간적 뒤가 아니라 결과·종결을 가리키므로, 문맥상 대조를 선명하게 하는 ‘끝’으로 옮겼습니다.
- source_word: תוּגָה
  english_pob_choice: grief
  chosen_korean: 슬픔입니다
  alternatives_korean:
  - 근심입니다
  - 비탄입니다
  lexicon: HALOT
  rationale: תוּגָה는 깊은 슬픔·비애를 뜻하지만, 속담형 결구에서는 한국어에서 가장 직관적인 대응인 ‘슬픔’이 대조를 분명하게 드러냅니다.
theological_decisions:
- issue: 잠언의 일반 진술을 현재 단정으로 할지 가능형으로 할지
  chosen_reading: ‘마음은 아플 수 있고’로 일반적 진술의 개연성을 살렸습니다.
  alternative_readings:
  - ‘마음이 아픕니다’
  - ‘마음이 아픕니다만’
  rationale: 히브리어 미완료형은 잠언에서 보편 진술이나 일반적 가능성을 나타낼 수 있으므로, 한국어에서도 과도한 단정 없이 격언의 성격을 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 격언적 일반 진술
