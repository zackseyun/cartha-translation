  source_fidelity: 첫 절의 명령과 어리석은 사람에게서 물러나라는 공간적 의미는 대체로 반영되었습니다. 그러나 “지식의 입술을 … 알지 못합니다”는 히브리어의 ‘지식의 입술’(지식 있는 발화)을 한국어에서 부자연스럽게 직역한 것으로, ‘알다’의 목적어로도 적절하지 않아 후반절의 뜻이 불명확합니다.
