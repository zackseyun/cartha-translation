base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
  footnotes:
  - marker: a
    text: Or 'Go away from a foolish man, for you will not find words of knowledge there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람에게서 떠나십시오[a]. 그에게서는 지식 있는 말을 알 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람의 면전에서 떠나십시오. 그에게서는 지식의 말을 찾지 못합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 가십시오
  - 가 버리십시오
  lexicon: HALOT
  rationale: 지혜 격언의 직접적 명령을 살리면서, 문맥상 단순 이동보다 ‘그 사람의 앞에서 물러남’을 분명히 드러내는 동사로 옮겼습니다.
- source_word: מִנֶּגֶד
  english_pob_choice: from the presence of
  chosen_korean: 앞에서
  alternatives_korean:
  - 곁에서
  - 앞을 떠나
  lexicon: HALOT
  rationale: ‘~의 앞/면전에서’라는 공간적 뉘앙스를 살려, 상대의 면전에서 물러나는 뜻을 간결하게 표현했습니다.
- source_word: לְאִישׁ כְּסִיל
  english_pob_choice: a foolish man
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 남자
  - 어리석은 자
  lexicon: HALOT
  rationale: כְּסִיל의 전형적 지혜 문학 용례를 반영해 ‘어리석은’으로 옮겼고, 이 구절은 일반적 경계이므로 한국어에서는 자연스럽게 ‘사람’으로 다듬었습니다.
- source_word: שִׂפְתֵי דָעַת
  english_pob_choice: lips of knowledge
  chosen_korean: 지식의 입술
  alternatives_korean:
  - 지식의 말
  - 지식의 말들
  lexicon: HALOT
  rationale: 히브리어의 비유적 표현을 살려 ‘입술’을 유지했습니다. 다만 한국어에서는 ‘입술’을 주어처럼 두기보다 뒤절에서 ‘알지 못합니다’와 결합해, 지혜로운 말의 부재를 드러내도록 했습니다.
theological_decisions:
- issue: 어리석은 자와의 거리두기 권면의 강도
  chosen_reading: 단순한 정보 부족이 아니라, 어리석은 사람의 면전에서 물러나 지혜 없는 말에 노출되지 말라는 실천적 경고로 읽었습니다.
  alternative_readings:
  - 그냥 자리를 피하라는 중립적 조언
  - 어리석은 사람과 완전히 단절하라는 강한 명령
  rationale: 히브리어 명령형과 부정절은 지혜 격언 특유의 생활 지침으로 기능하므로, 과도한 관계 단절이나 약화된 권고로도 흐르지 않게 균형을 잡았습니다.
  doctrine_reference: 지혜 문학의 경계 설정과 분별의 권면
