id: PRO.14.35
reference: Proverbs 14:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
  footnotes:
  - marker: a
    text: Or 'toward a servant who is prudent' or 'for a skillful servant.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his wrath will be [for/against] one who brings shame.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 호의는 지혜롭게 행동하는 종을 향하지만, 그의 분노는 수치를 끼치는 자를 향합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 있는 종’ 또는 ‘유능한 종’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 분노는 수치를 가져오는 자에게/대하여 있게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은총
  - 좋아하심
  - 기호
  lexicon: HALOT
  rationale: 왕과 신하의 궁정 문맥에서 רְצוֹן은 우호적이고 기꺼운 태도를 가리키므로, 한국어에서는 자연스럽고 격식 있는 ‘호의’가 가장 잘 맞습니다.
- source_word: לְעֶבֶד
  english_pob_choice: for a servant
  chosen_korean: 종을 향하지만
  alternatives_korean:
  - 종에게
  - 노예에게
  - 시종에게
  lexicon: HALOT
  rationale: 전치사 ל의 방향성을 살려 ‘향하다’로 옮겼고, 이 절은 궁정의 봉사자 맥락이므로 기본어 ‘종’을 사용했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: who acts wisely
  chosen_korean: 지혜롭게 행동하는
  alternatives_korean:
  - 슬기로운
  - 분별 있는
  - 유능한
  lexicon: HALOT
  rationale: שׂכל 계열 분사는 단순 지적 상태보다 실제로 지혜롭게 처신하는 행위를 가리키므로, 동작성을 드러내는 표현이 적절합니다.
- source_word: מֵבִישׁ
  english_pob_choice: one who brings shame
  chosen_korean: 수치를 끼치는 자
  alternatives_korean:
  - 수치를 당하게 하는 자
  - 부끄럽게 만드는 자
  - 치욕을 가져오는 자
  lexicon: HALOT
  rationale: 히필 분사의 인과적 의미를 살려, 결과로서의 ‘수치’를 남에게 가져다주는 사람이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 대조 구조의 강도
  chosen_reading: 왕의 호의와 분노를 평행적으로 대조하여, 지혜로운 종과 수치를 끼치는 자를 각각 향하는 상반된 반응으로 살렸습니다.
  alternative_readings:
  - 호의를 먼저, 분노를 나중에 약하게 대조하는 표현
  - 분노를 단순한 ‘화’로 완화하는 표현
  rationale: 히브리어는 궁정적 선호와 거절을 강하게 대조하므로, 한국어에서도 ‘호의 / 분노’의 대비를 유지해야 본문의 교훈적 긴장이 살아납니다.
  doctrine_reference: 잠언의 지혜-어리석음 대비
