  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
  footnotes:
  - marker: a
    text: Or 'Every wise woman builds her house.' The Hebrew opening may be understood generically as a class statement rather than as a superlative expression.
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also include the sense of ''household'' or ''family establishment,'' not only the physical dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가장 지혜로운 여인은 자기 집을 세우지만, 어리석은 여인은 자기 손으로 그것을 무너뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 물리적 건물뿐 아니라 가정이나 가족의 형성을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 시작 구문은 ‘가장 지혜로운 여인’으로도, ‘모든 지혜로운 여인’이라는 일반 진술로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  english_pob_choice: the wisest of women
  chosen_korean: 가장 지혜로운 여인
  alternatives_korean:
  - 지혜로운 여자들
  - 지혜로운 여인
  - 모든 지혜로운 여인
  lexicon: HALOT
  rationale: 히브리어 복수형 결합은 잠언체에서 종종 집합적·강조적 표현으로 쓰이므로, 한국어에서는 자연스러운 최상급 표현인 ‘가장 지혜로운 여인’으로 옮겨 대비를 살렸습니다.
- source_word: בֵיתָהּ
  english_pob_choice: her house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그녀의 집
  - 가정
  - 가문
  lexicon: HALOT
  rationale: בַּיִת은 물리적 집과 가정/가족 체제를 함께 가리킬 수 있어, 이미지와 의미 범위를 함께 살리는 ‘자기 집’이 가장 무난합니다.
- source_word: בְּיָדֶיהָ
  english_pob_choice: with her own hands
  chosen_korean: 자기 손으로
  alternatives_korean:
  - 자기 손으로 직접
  - 손으로
  - 그녀의 손으로
  lexicon: HALOT
  rationale: 도구적 의미와 주체의 직접성을 드러내면서도 한국어 잠언체에서 자연스러운 표현이므로 ‘자기 손으로’로 옮겼습니다.
- source_word: תֶהֶרְסֶנּוּ
  english_pob_choice: tears it down
  chosen_korean: 무너뜨립니다
  alternatives_korean:
  - 헐어 버립니다
  - 파괴합니다
  - 허물어뜨립니다
  lexicon: HALOT
  rationale: בננה/הרס의 건축-해체 대비를 유지하되, 현대 한국어에서 간결하고 강한 동작을 주는 ‘무너뜨립니다’가 가장 적절합니다.
theological_decisions:
- issue: בית의 범위
  chosen_reading: ‘집’은 건물만이 아니라 가정과 그 기반을 함께 함의하는 표현으로 두었습니다.
  alternative_readings:
  - 물리적 주거만 가리키는 ‘집’
  - ‘가정’으로 한정하는 번역
  rationale: 본문의 ‘세우다/무너뜨리다’ 대비는 단순 건물보다 가족·생활 질서 전체를 포함하는 잠언적 범위를 암시하므로, 한국어에서도 그 폭을 열어 두는 번역이 더 충실합니다.
  doctrine_reference: 잠언의 지혜 문학적 비유와 משפחה/בית의 의미 범위
