id: PRO.14.8
reference: Proverbs 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
  footnotes:
  - marker: a
    text: Or 'The wisdom of the shrewd is to discern his path.'
    reason: lexical_alternative
  - marker: b
    text: '''Deceit'' may refer either to deceptive behavior or to self-deception as the defining mark of fools'' folly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 슬기로운 사람의 지혜는 자기 길을 분별하는 데 있고, 어리석은 자들의 어리석음은 속임수입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬기로운 사람의 지혜는 자기 길을 식별하는 데 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘속임수’는 기만적인 행위를 가리킬 수도 있고, 어리석은 자들의 어리석음을 특징짓는 자기기만을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת עָרוּם
  english_pob_choice: the wisdom of the prudent
  chosen_korean: 지혜로운 사람의 지혜
  alternatives_korean:
  - 슬기로운 자의 지혜
  - 신중한 자의 지혜
  lexicon: HALOT
  rationale: עָרוּם을 여기서는 잠언의 지혜 문맥에 따라 긍정적 의미의 '지혜로운 사람'으로 풀고, 히브리어 관형구를 자연스러운 한국어 소유 구문으로 옮겼습니다.
- source_word: הָבִין דַּרְכּוֹ
  english_pob_choice: is to understand his way
  chosen_korean: 자신의 길을 분별하는 것
  alternatives_korean:
  - 자신의 길을 이해하는 것
  - 자신의 길을 알아차리는 것
  lexicon: HALOT
  rationale: הָבִין은 단순한 지식 이해보다 분별·식별의 뜻이 강해 잠언적 문맥에서 '분별하다'가 더 정확합니다. דַּרְכּוֹ는 삶의 방식/행로를 가리키므로 '길'로 옮겼습니다.
- source_word: וְאִוֶּלֶת כְּסִילִים
  english_pob_choice: but the folly of fools
  chosen_korean: 어리석은 자들의 어리석음
  alternatives_korean:
  - 미련한 자들의 어리석음
  - 우둔한 자들의 어리석음
  lexicon: HALOT
  rationale: 대조 접속사는 한국어에서 '하지만'으로 살렸고, כְּסִילִים은 잠언에서 통용되는 '어리석은 자들'로 옮겨 인물 대비를 분명히 했습니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 속여 넘김
  lexicon: HALOT
  rationale: מִרְמָה는 속임·기만을 뜻하며, 잠언의 압축성을 살려 '속임수'로 간결하게 옮겼습니다.
theological_decisions:
- issue: 대표적 단수 대명사와 한국어 일반화
  chosen_reading: '''his way''를 ''자신의 길''로 옮겼습니다.'
  alternative_readings:
  - 그의 길
  - 자기 길
  rationale: 히브리어 남성 단수는 대표적 일반인을 가리키는 용법이므로, 한국어에서는 성별 표지를 드러내지 않으면서도 문맥의 개인적 책임을 살리는 '자신의 길'이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: עָרוּם의 윤리적 방향성
  chosen_reading: 긍정적 의미의 '지혜로운 사람'으로 읽었습니다.
  alternative_readings:
  - 간교한 사람
  - 교활한 사람
  rationale: 이 절은 지혜와 어리석음을 대조하는 잠언이므로, עָרוּם를 부정적으로 옮기면 대조 구조가 왜곡됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
