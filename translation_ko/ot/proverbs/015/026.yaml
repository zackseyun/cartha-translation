lexical_decisions:
- source_word: תּוֹעֲבַת יְהוָה
  english_pob_choice: an abomination to Yahweh
  chosen_korean: 야훼께 가증한 것
  alternatives_korean:
  - 야훼께 혐오스러운 것
  - 야훼께 역겨운 것
  lexicon: HALOT
  rationale: תּוֹעֲבַת는 지혜문학에서 도덕적·언약적 혐오를 강하게 나타내므로 ‘가증한 것’이 가장 직접적입니다. יְהוָה는 본문대로 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: מַחְשְׁבוֹת רָע
  english_pob_choice: Evil plans
  chosen_korean: 악한 생각들
  alternatives_korean:
  - 악한 계획들
  - 악한 꾀들
  - 악한 생각의 것들
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת은 생각, 계획, 꾀를 모두 아우를 수 있지만, 영어 POB의 잠정 판단과 달리 히브리어 자체는 내적 구상까지 포함하는 넓은 뜻이므로 ‘악한 생각들’로 넓게 살렸습니다.
- source_word: טְהֹרִים אִמְרֵי נֹעַם
  english_pob_choice: pleasant words are pure
  chosen_korean: 부드러운 말은 순결합니다
  alternatives_korean:
  - 즐거운 말은 순결합니다
  - 사랑스러운 말은 순결합니다
  - 부드러운 말은 깨끗합니다
  lexicon: HALOT
  rationale: נֹעַם은 ‘pleasant’보다 한국어에서 말의 온화함과 듣기 좋음을 함께 담는 ‘부드러운’이 자연스럽습니다. טְהֹרִים는 도덕적·의식적 정결을 함께 시사하므로 ‘순결합니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 병행구의 어순과 대조 강조
  chosen_reading: 앞 절의 ‘가증한 것’과 뒤 절의 ‘순결합니다’를 대조해, 자연스러운 한국어 어순으로 재배치했습니다.
  alternative_readings:
  - 히브리어 어순을 따라 ‘순결한 것은 부드러운 말입니다’로 옮김
  - 직역하여 ‘그리고 순결한 부드러운 말’로 유지
  rationale: 히브리어는 후반 절에서 형용사를 앞으로 두지만, 한국어 합쇼체에서는 대구법의 대조가 분명히 들리도록 재배치하는 것이 의미 전달에 가장 충실합니다.
  doctrine_reference: 잠언의 대구법과 지혜문학의 수사
