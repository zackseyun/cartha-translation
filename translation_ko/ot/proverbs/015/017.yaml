reference: Proverbs 15:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֤וֹב אֲרֻחַ֣ת יָ֭רָק וְ/אַהֲבָה שָׁ֑ם מִ/שּׁ֥וֹר אָ֝ב֗וּס וְ/שִׂנְאָה בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/017.yaml
  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
  footnotes:
  - marker: a
    text: Or 'than an ox from the stall'; the Hebrew expression can emphasize either stall-feeding or the resulting fattened condition.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and hatred in it,' likely referring to the meal or household setting being marked by hatred.
    reason: lexical_alternative
translation:
  language: ko
  text: 사랑이 있는 곳에서 먹는 채소로 차린 식사가, 미움이 있는 비육한 소보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에서 기른 소’. 히브리어 표현은 우리에서 먹여 기른 소 또는 그 결과 비육된 소를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 안에 미움이’. ‘그 안’은 식사 자체나 그 식사가 이루어지는 가정·상황을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִשּׁוֹר ...
  english_pob_choice: Better is ... than ...
  chosen_korean: '...보다 낫습니다'
  alternatives_korean:
  - '...보다 좋습니다'
