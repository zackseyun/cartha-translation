id: PRO.15.17
reference: Proverbs 15:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֤וֹב אֲרֻחַ֣ת יָ֭רָק וְ/אַהֲבָה שָׁ֑ם מִ/שּׁ֥וֹר אָ֝ב֗וּס וְ/שִׂנְאָה בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/017.yaml
  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
  footnotes:
  - marker: a
    text: Or 'than an ox from the stall'; the Hebrew expression can emphasize either stall-feeding or the resulting fattened condition.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and hatred in it,' likely referring to the meal or household setting being marked by hatred.
    reason: lexical_alternative
translation:
  language: ko
  text: 채소 한 그릇에 사랑이 있는 것이, 미움이 깃든 살진 소보다 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִשּׁוֹר ...
  english_pob_choice: Better is ... than ...
  chosen_korean: '...보다 낫습니다'
  alternatives_korean:
  - '...보다 좋습니다'
  - '...가 더 낫습니다'
  lexicon: HALOT
  rationale: 지혜문학의 비교격 구조를 자연스러운 현대 한국어로 살리면서, 히브리어의 비교 판단을 분명하게 드러냅니다.
- source_word: אֲרֻחַת יָרָק
  english_pob_choice: a meal of vegetables
  chosen_korean: 채소 한 그릇
  alternatives_korean:
  - 채소로 된 한 끼
  - 채소 반찬 한 끼
  lexicon: HALOT
  rationale: 아루하트는 단순한 재료가 아니라 식사/식탁의 한 끼를 가리키므로, 현대 독자가 즉시 이해할 수 있는 식사 표지로 옮겼습니다.
- source_word: וְאַהֲבָה שָׁם
  english_pob_choice: where there is love
  chosen_korean: 사랑이 있는
  alternatives_korean:
  - 사랑이 있는 곳의
  - 사랑이 함께하는
  lexicon: HALOT
  rationale: שָׁם의 위치 개념을 한국어에서는 관계적 상태로 풀어, 식사 자체보다 공동체 분위기가 핵심임을 드러냈습니다.
- source_word: שׁוֹר אָבוּס
  english_pob_choice: a fattened ox
  chosen_korean: 살진 소
  alternatives_korean:
  - 살이 찐 소
  - 우리에서 살찌운 소
  lexicon: HALOT
  rationale: אָבוּס의 ‘살찌워진/비육된’ 뉘앙스를 자연스럽게 전하면서도, 사치스러운 잔칫상을 가리키는 대조를 살렸습니다.
- source_word: וְשִׂנְאָה בֽוֹ
  english_pob_choice: with hatred in it
  chosen_korean: 미움이 깃든
  alternatives_korean:
  - 그 안에 미움이 있는
  - 미움이 함께한
  lexicon: HALOT
  rationale: 전치사+대명사의 압축된 이미지를 직역하면 어색하므로, ‘그 안에 스며 있는 상태’를 한국어 관용으로 살려 원문의 긴장감을 유지했습니다.
theological_decisions:
- issue: 지혜 격언의 대조 초점
  chosen_reading: 핵심 대조를 ‘소박한 식사 + 사랑’ 대 ‘풍성한 식사 + 미움’으로 유지했습니다.
  alternative_readings:
  - 음식의 질 자체를 중심으로 읽는 방식
  - 가정의 평안만을 강조하는 방식
  rationale: 히브리어는 음식과 관계를 함께 대비하지만, 결론의 무게는 식사의 호화로움보다 사랑의 임재에 있으므로 그 초점을 유지했습니다.
  doctrine_reference: 잠언의 지혜 전통과 공동체 윤리
- issue: שִׂנְאָה의 관계적 범위
  chosen_reading: ‘미움이 깃든’으로 번역해 음식보다 식탁/가정 분위기에 번지는 적대감을 표현했습니다.
  alternative_readings:
  - ‘미움이 있는’
  - ‘미움이 그 안에 있는’
  rationale: 원문은 단순 감정 명칭보다 상황 전체를 오염시키는 적대의 존재를 암시하므로, 그 함의를 자연스럽게 전달했습니다.
  doctrine_reference: 문맥 기반 의미 보존
