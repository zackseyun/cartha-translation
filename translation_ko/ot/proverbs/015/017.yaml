  lexicon: HALOT
  rationale: 지혜문학의 비교격 구조를 자연스러운 현대 한국어로 살리면서, 히브리어의 비교 판단을 분명하게 드러냅니다.
- source_word: אֲרֻחַת יָרָק
  english_pob_choice: a meal of vegetables
  chosen_korean: 채소 한 그릇
  alternatives_korean:
