  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
  footnotes:
  - marker: a
    text: Or 'scatter knowledge.' The Hebrew verb carries the image of scattering or dispersing; 'spread' is used here for natural English.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is elliptical: literally, ''but the heart of fools, not so.'' The sense is that fools do not distribute knowledge in the same way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 이들의 입술은 지식을 흩뿌리지만, 어리석은 이들의 마음은 그렇지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂפְתֵי
  english_pob_choice: the lips of
  chosen_korean: 입술은
  alternatives_korean:
  - 입술이
  - 말은
  lexicon: HALOT
  rationale: ‘입술’의 구체적 신체 이미지와 평행 구조를 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise
