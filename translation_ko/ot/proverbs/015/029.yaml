source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; rendered ''the LORD'' following the translation''s standard practice for the divine name.'
    reason: alternative_reading
translation:
  language: ko
  text: 여호와께서는 악인에게서 멀리 계시지만, 의인들의 기도는 들으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문은 여호와의 언약적 이름을 가리키므로 한국어 본문에서는 통용도가 높은 표준 교회 용례를 따르되, 원어는 유다 전통의 신명 사용을 유지합니다.
- source_word: רָחוֹק
  english_pob_choice: far from
  chosen_korean: 멀리 계시지만
  alternatives_korean:
  - 멀리 계십니다
  - 먼 곳에 계시지만
  - 멀리 떨어져 계시지만
  lexicon: HALOT
  rationale: רָחוֹק은 단순 공간 거리보다 관계적 거리감을 나타내므로, ‘멀리’로 옮겨 대조를 살리되 하나님 주어와 자연스러운 한국어 서술을 위해 ‘계시다’를 보탰습니다.
- source_word: מֵ/רְשָׁעִים
  english_pob_choice: from the wicked
  chosen_korean: 악인에게서
  alternatives_korean:
  - 악인들로부터
  - 악한 자들에게서
  - 악한 사람들에게서
  lexicon: HALOT
  rationale: רְשָׁעִים은 도덕적으로 악한 사람들의 집합을 가리키므로, 지혜문학의 통상적 범주어인 ‘악인’이 가장 간결하고 직접적입니다.
- source_word: יִשְׁמָע
  english_pob_choice: he hears
  chosen_korean: 들으십니다
  alternatives_korean:
  - 들으십니다
  - 들으십니다만
  - 들어주십니다
  lexicon: HALOT
  rationale: שׁמע는 문자적으로 ‘듣다’이므로, 응답까지 단정하는 ‘들어주십니다’보다 청원의 내용을 듣고 받아들이는 뜻을 보존하는 ‘들으십니다’가 원문에 더 가깝습니다.
theological_decisions:
- issue: 여호와와 악인 사이의 ‘멀리’의 의미
  chosen_reading: 하나님의 공간적 부재가 아니라, 악인에 대한 관계적 दूरी와 호의적 응답의 부재를 말합니다.
  alternative_readings:
  - 하나님이 악인을 전혀 인식하지 못하신다는 뜻
  - 하나님이 악인의 기도를 절대 들으시지 않는다는 뜻
  rationale: 지혜문학의 ‘멀리’는 물리적 부재보다 도덕적·관계적 분리를 가리키며, 후반절의 ‘의인들의 기도는 들으신다’가 대조를 분명히 합니다.
  doctrine_reference: 잠언의 의인/악인 대조와 하나님의 거룩하심
