id: PRO.15.30
reference: Proverbs 15:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
  footnotes:
  - marker: a
    text: Or 'brightness of the eyes,' that is, a cheerful or shining look.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fattens the bone'; the expression is an idiom for deep bodily vigor or refreshment.
    reason: cultural_note
translation:
  language: ko
  text: 눈의 빛은 마음을 기쁘게 하고, 좋은 소식은 뼈를 윤택하게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘눈의 빛’이며, 밝고 쾌활한 표정을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현 ‘뼈를 살찌우다’는 몸의 깊은 생기와 회복을 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  english_pob_choice: The light of the eyes
  chosen_korean: 눈의 빛
  alternatives_korean:
  - 눈빛
  - 눈의 밝음
  - 눈의 광채
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 살리되, 한국어에서는 자연스럽게 들리는 ‘눈의 빛’으로 옮겨 눈빛의 밝음과 표정을 함께 열어 둡니다.
- source_word: יְשַׂמַּח לֵב
  english_pob_choice: gladdens the heart
  chosen_korean: 마음을 기쁘게 하고
  alternatives_korean:
  - 마음을 즐겁게 하고
  - 마음을 환하게 하고
  - 마음을 기쁘게 합니다
  lexicon: HALOT
  rationale: 동사 שׂמח의 사역적 의미를 살려 ‘기쁘게 하다’로 옮기고, ‘마음’은 히브리어 לֵב의 내면 전체를 나타내는 표준 대응으로 유지했습니다.
- source_word: שְׁמוּעָה טוֹבָה
  english_pob_choice: good news
  chosen_korean: 좋은 소식
  alternatives_korean:
  - 기쁜 소식
  - 좋은 خبر
  - 복된 소식
  lexicon: HALOT
  rationale: שְׁמוּעָה는 ‘소식/보고’의 뜻이므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘좋은 소식’으로 옮겼습니다.
- source_word: תְּדַשֶּׁן עָצֶם
  english_pob_choice: fattens the bones
  chosen_korean: 뼈를 윤택하게 합니다
  alternatives_korean:
  - 뼈를 살찌웁니다
  - 뼈를 살찌게 합니다
  - 뼈를 새롭게 합니다
  lexicon: HALOT
  rationale: ‘살찌우다’의 직역은 한국어에서 다소 거칠 수 있어, 본문이 가진 풍성함과 활력의 이미지를 살리는 ‘윤택하게 하다’를 택했습니다. 다만 본문의 신체적 은유는 유지했습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘뼈를 살찌우다/윤택하게 하다’의 표현 강도
  chosen_reading: 직역을 완전히 풀지 않고, 신체적 활력과 깊은 회복의 이미지를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘뼈를 살찌웁니다’처럼 더 직설적으로 옮기는 방식
  - ‘몸을 새롭게 합니다’처럼 의미 중심으로 풀어 쓰는 방식
  rationale: 이 속담은 단순한 감정이 아니라 몸 전체의 생기를 말하므로, 한국어에서도 물질적·신체적 은유를 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 잠언의 지혜 시학과 히브리 관용구 보존 원칙
