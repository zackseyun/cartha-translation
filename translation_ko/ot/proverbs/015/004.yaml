id: PRO.15.4
reference: Proverbs 15:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַרְפֵּ֣א לָ֭שׁוֹן עֵ֣ץ חַיִּ֑ים וְ/סֶ֥לֶף בָּ֝֗/הּ שֶׁ֣בֶר בְּ/רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
  footnotes:
  - marker: a
    text: Or 'A wholesome tongue is a tree of life'; מַרְפֵּא can denote healing, health, or wholesomeness.
    reason: lexical_alternative
  - marker: b
    text: Or 'crookedness in it is a fracture to the spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 치유하는 혀는 생명나무이지만, 그 안의 비뚤어짐은 영의 깨짐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '건강한 혀는 생명나무입니다'; מַרְפֵּא는 치유, 건강, 온전함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 안의 비뚤어짐은 영의 부서짐입니다'.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְפֵּא
  english_pob_choice: healing
  chosen_korean: 치유하는
  alternatives_korean:
  - 건강한
  - 온화한
  - 유익한
  lexicon: HALOT
  rationale: מַרְפֵּא는 치유, 건강, 회복력을 가리킬 수 있으므로, '치유하는'으로 옮겨 회복시키는 성격을 살리고 '온화한'처럼 성질만 약화시키는 해석을 피했습니다.
- source_word: לָשׁוֹן
  english_pob_choice: tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 언어
  - 말씀
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 살려 '혀'로 옮겼습니다. 잠언의 비유적 표현과도 잘 맞습니다.
- source_word: סֶלֶף
  english_pob_choice: perverseness
  chosen_korean: 비뚤어짐
  alternatives_korean:
  - 굴절됨
  - 왜곡
  - 사악함
  lexicon: HALOT
  rationale: 말의 굽음, 뒤틀림이라는 뜻을 살려 '비뚤어짐'으로 옮겼습니다. '사악함'보다 언어적 왜곡의 성격이 더 분명합니다.
- source_word: שֶׁבֶר בְּרוּחַ
  english_pob_choice: a breaking of the spirit
  chosen_korean: 영의 깨짐
  alternatives_korean:
  - 영의 부서짐
  - 마음의 상함
  - 영의 파괴
  lexicon: HALOT
  rationale: 명사구의 직설적 구조를 유지해 '깨짐'을 살렸고, רוּחַ는 여기서 사람의 내적 영을 가리키므로 '성령'이 아니라 '영'으로 번역했습니다.
theological_decisions:
- issue: רוּחַ의 지시 대상
  chosen_reading: 사람의 내적 영/기운
  alternative_readings:
  - 성령
  rationale: 문맥은 지혜 문학의 인간 경험에 관한 대비이므로, 신적 성령이 아니라 사람의 내적 상태를 뜻하는 것으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 문맥 우선 원칙; 불필요하게 성령으로 신학화하지 않음
