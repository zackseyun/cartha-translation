  rationale: 문맥은 지혜 문학의 인간 경험에 관한 대비이므로, 신적 성령이 아니라 사람의 내적 상태를 뜻하는 것으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 문맥 우선 원칙; 불필요하게 성령으로 신학화하지 않음
