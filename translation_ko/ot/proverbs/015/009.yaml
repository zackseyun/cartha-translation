id: PRO.15.9
reference: Proverbs 15:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
  footnotes:
  - marker: a
    text: Or 'detestable to the LORD is the path of a wicked man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he loves whoever pursues justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 길은 야훼께 가증한 것이지만, 그분은 의를 추구하는 사람을 사랑하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의를 추구하는 사람’은 문자적으로 ‘의를 추구하는 이’ 또는 ‘의를 추구하는 자’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가증한 것’은 히브리어 תּוֹעֲבַת의 강한 혐오 표현을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 역겨운 것
  - 혐오스러운 것
  lexicon: HALOT
  rationale: 히브리어 תּוֹעֲבַת의 강한 혐오·가증의 평가를 그대로 살리되, 한국어에서는 관용적이면서도 문어적인 ‘가증한 것’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 대체 칭호가 아니라 고유명사이므로, POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: דֶּרֶךְ רָשָׁע
  english_pob_choice: the way of the wicked
  chosen_korean: 악인의 길
  alternatives_korean:
  - 악한 자의 길
  - 악한 사람의 길
  lexicon: HALOT
  rationale: 잠언의 ‘길’은 단순한 경로가 아니라 삶의 방식 전체를 가리키므로, 한국어에서도 ‘길’로 유지했습니다. רָשָׁע는 대표적 단수로서 집합적 의미를 가지므로 ‘악인’이 자연스럽습니다.
- source_word: מְרַדֵּף צְדָקָה
  english_pob_choice: the one who pursues righteousness
  chosen_korean: 의를 추구하는 사람
  alternatives_korean:
  - 의를 좇는 자
  - 의를 추구하는 이
  lexicon: HALOT
  rationale: 분사 מְרַדֵּף는 지속적 성격을 나타내므로 ‘추구하는’으로 옮겼고, צְדָקָה는 잠언 문맥의 도덕적·언약적 올바름을 살려 ‘의’로 번역했습니다.
- source_word: יֶאֱהָב
  english_pob_choice: he loves
  chosen_korean: 사랑하십니다
  alternatives_korean:
  - 사랑합니다
  - 사랑하십니다
  lexicon: HALOT
  rationale: 주어가 야훼이므로 한국어에서는 존대 종결을 써서 신적 주어에 대한 경어를 반영했습니다. 잠언의 일반 진술이지만 현재형으로 옮기는 것이 적절합니다.
theological_decisions:
- issue: 악인의 길에 대한 강한 평가를 완화할지 여부
  chosen_reading: ‘가증한 것’으로 번역해 מקור의 강한 도덕적 평가를 유지했습니다.
  alternative_readings:
  - ‘싫어하시는 것’
  - ‘좋아하지 않으시는 것’
  rationale: תּוֹעֲבַת는 단순한 호불호가 아니라 하나님 앞에서의 강한 혐오를 나타내므로, 한국어에서도 그 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
- issue: צְדָקָה를 ‘의’로 둘지 ‘정의’로 둘지
  chosen_reading: ‘의’로 번역했습니다.
  alternative_readings:
  - ‘정의’
  - ‘올바름’
  rationale: 잠언의 문맥에서는 צְדָקָה가 개인의 도덕적 올바름과 하나님 앞의 바른 삶을 포함하므로, 협의의 사회정의보다 넓은 ‘의’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: δικαιοσύνη/צדקה'
