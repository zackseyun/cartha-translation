id: PRO.15.12
reference: Proverbs 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
  footnotes:
  - marker: a
    text: Or "to wise men." The Hebrew is masculine plural, but here likely refers generically to wise persons.
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 자는 자기를 바로잡는 이를 사랑하지 않습니다[a]. 그는 지혜로운 이들에게 가지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 바로잡는 이를.” 히브리어는 남성 단수 분사구로, 여기서는 책망·교정하는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵץ
  english_pob_choice: mocker
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조소하는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: 지혜문학에서 לֵץ는 단순한 농담꾼이 아니라 남을 업신여기고 조롱하는 사람을 가리키므로, 동작성을 살린 ‘조롱하는 자’가 현대 한국어에서 가장 분명합니다.
- source_word: יֶאֱהַב
  english_pob_choice: does not love
  chosen_korean: 사랑하지 않습니다
  alternatives_korean:
  - 좋아하지 않습니다
  - 미워합니다
  lexicon: HALOT
  rationale: 히브리어의 기본 동사 ‘사랑하다’를 그대로 살려, 단순한 호감 부족이나 더 강한 ‘미워하다’로 과장하지 않았습니다.
- source_word: הוֹכֵחַ לֽוֹ
  english_pob_choice: one who corrects him
  chosen_korean: 자기를 바로잡는 이
  alternatives_korean:
  - 그를 책망하는 이
  - 그를 꾸짖는 이
  - 교훈하는 이
  lexicon: HALOT
  rationale: 이 분사구는 단순한 질책보다 교정·훈계의 기능이 핵심이므로, 관계를 자연스럽게 드러내는 ‘자기를 바로잡는 이’로 옮겼습니다.
- source_word: אֶל חֲכָמִים
  english_pob_choice: to the wise
  chosen_korean: 지혜로운 이들에게
  alternatives_korean:
  - 지혜로운 남자들에게
  - 지혜자들에게
  - 현자들에게
  lexicon: HALOT
  rationale: 히브리어 복수형은 잠언에서 대표적·일반적 의미로 쓰이므로, 남성에 한정되지 않게 ‘지혜로운 이들’로 번역했습니다.
theological_decisions:
- issue: 명령형이 아닌 거절/습관 진술의 뉘앙스
  chosen_reading: 두 반절 모두 조롱하는 자의 성향과 행동을 일반 진술로 표현했습니다.
  alternative_readings:
  - 직역하여 ‘사랑하지 않을 것입니다’
  - ‘가지 않을 것입니다’만 따로 강조
  rationale: 잠언의 예언적 일반 진술을 한국어에서도 현재형 일반 진술로 자연스럽게 드러내면서, 의지적 거절의 뜻은 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
