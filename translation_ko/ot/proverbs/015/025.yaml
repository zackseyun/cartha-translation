  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
  footnotes:
  - marker: a
    text: Or 'uproots the house of the proud.' The Hebrew verb can carry the sense of removing or uprooting, not only demolishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'establishes the widow's boundary line' or 'landmark.' The image is of the LORD protecting the property rights of the vulnerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 교만한 자의 집을 무너뜨리시지만, 과부의 경계를 굳게 세우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교만한 자의 집을 뿌리 뽑으신다’로 옮길 수도 있습니다. 히브리어 동사는 단순히 허무는 것뿐 아니라 제거하거나 뽑아내는 뜻도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘과부의 경계선’ 또는 ‘경계표’를 세우신다는 뜻일 수 있습니다. 이 이미지는 야훼께서 약자의 재산권을 보호하신다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  english_pob_choice: house of
  chosen_korean: 집
  alternatives_korean:
  - 가문
  - 가정
  - 집안
  lexicon: HALOT
  rationale: בֵּית는 소유격 구성으로 ‘~의 집/가문’의 의미를 지니므로, 여기서는 구체적 이미지인 ‘집’을 살리되 문맥상 가문·소유 전체를 아우를 수 있게 했습니다.
- source_word: גֵּאִים
  english_pob_choice: the proud
  chosen_korean: 교만한 자
  alternatives_korean:
  - 오만한 자
  - 거만한 자
  - 교만한 사람들
  lexicon: HALOT
  rationale: 지혜문학에서 גֵּאִים은 단순히 높은 지위가 아니라 하나님 앞에서 거만한 사람들을 가리키므로, 표준적이면서도 인격 주체를 드러내는 ‘교만한 자’로 옮겼습니다.
- source_word: יִסַּח
  english_pob_choice: tears down
  chosen_korean: 무너뜨리시지만
  alternatives_korean:
  - 허무시지만
  - 헐어 버리시지만
  - 뒤엎으시지만
  lexicon: HALOT
  rationale: 동사는 제거·뜯어냄·파괴의 강한 의미를 지니며, ‘집’이 목적어이므로 자연스러운 한국어로는 ‘무너뜨리다’가 파괴성을 잘 전달합니다.
- source_word: גְּב֣וּל
  english_pob_choice: the boundary
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 경계표
  - 지계
  lexicon: HALOT
  rationale: 기본 의미는 경계 또는 경계선이며, 이 절의 보호·소유권 이미지에는 ‘경계’가 가장 포괄적이고 현대 한국어로도 이해하기 쉽습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 고유명사 יְהוָה를 제목 대체어가 아니라 고유한 신명으로 드러내기 위해 ‘야훼’를 사용했습니다. POB의 본문 원칙을 반영합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וְיַצֵּב의 역접 처리
  chosen_reading: 하지만
  alternative_readings:
  - 그리고
  rationale: 형태상 접속사 ‘그리고’이지만, 교만한 자의 집을 허무시는 동작과 과부의 경계를 세우시는 동작이 대조를 이루므로, 담화 기능을 살려 역접 ‘하지만’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
