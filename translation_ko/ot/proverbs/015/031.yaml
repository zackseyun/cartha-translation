source:
  edition: WLC
  text: אֹ֗זֶן שֹׁ֭מַעַת תּוֹכַ֣חַת חַיִּ֑ים בְּ/קֶ֖רֶב חֲכָמִ֣ים תָּלִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
  footnotes:
  - marker: a
    text: Or 'An ear that hears the rebuke of life will lodge among the wise.' The Hebrew verb is literally 'lodge' or 'spend the night,' here used figuratively for remaining or dwelling among the wise.
    reason: lexical_alternative
  - marker: b
    text: '''Life-giving rebuke'' renders a Hebrew expression that could also be translated ''rebuke of life'' or ''rebuke for life,'' meaning correction that leads to life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 생명을 주는 책망을 듣는 귀는 지혜로운 사람들 가운데 머무를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머무를 것입니다’는 히브리어 동사가 문자적으로는 ‘묵다/밤을 지내다’를 뜻하지만, כאן에서는 지혜로운 이들 가운데 계속 속해 있다는 비유적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명을 주는 책망’은 히브리어 표현 תּוֹכַחַת חַיִּים의 가능한 뜻인 ‘생명의 책망’ 또는 ‘생명을 위한 책망’을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  english_pob_choice: ear
  chosen_korean: 귀
  alternatives_korean:
  - 귀 있는 사람
  - 듣는 사람
  lexicon: HALOT
  rationale: 히브리어에서 ‘귀’는 수용하는 사람을 가리키는 환유로 쓰였으므로, 한국어에서도 그 이미지를 살리기 위해 직역에 가깝게 ‘귀’로 옮겼습니다.
- source_word: שֹׁמַעַת
  english_pob_choice: that listens
  chosen_korean: 듣는
  alternatives_korean:
  - 귀 기울이는
  - 듣고 있는
  lexicon: HALOT
  rationale: 단순한 청각이 아니라 지속적으로 수용하는 태도를 나타내므로, 현재적 의미를 지닌 관형사형 ‘듣는’이 가장 자연스럽습니다.
- source_word: תּוֹכַחַת חַיִּים
  english_pob_choice: life-giving rebuke
  chosen_korean: 생명을 주는 책망
  alternatives_korean:
  - 생명을 주는 꾸지람
  - 생명의 책망
  - 삶의 책망
  lexicon: HALOT
  rationale: ‘책망’이 지혜문학의 훈계·경고 뉘앙스를 비교적 잘 살리며, חַיִּים은 단순한 ‘생명의’보다 결과를 드러내는 ‘생명을 주는’으로 풀어 의미를 분명하게 했습니다.
- source_word: בְּקֶרֶב חֲכָמִים
  english_pob_choice: among the wise
  chosen_korean: 지혜로운 사람들 가운데
  alternatives_korean:
  - 지혜로운 이들 가운데
  - 지혜자들 가운데
  lexicon: HALOT
  rationale: חֲכָמִים은 명사적 복수형이지만 한국어에서는 집단 범주를 자연스럽게 드러내는 ‘지혜로운 사람들’이 가장 읽기 쉽고, ‘가운데’가 בתוך/among의 관계를 잘 전달합니다.
- source_word: תָּלִין
  english_pob_choice: will remain
  chosen_korean: 머무를 것입니다
  alternatives_korean:
  - 머물 것입니다
  - 묵을 것입니다
  - 잠잘 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘밤을 지내다/묵다’이지만, 이 잠언에서는 비유적으로 ‘계속 함께 있다, 남아 있다’는 뜻이므로 현대 한국어의 결과 표현인 ‘머무를 것입니다’로 옮겼습니다.
