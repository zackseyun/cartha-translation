id: PRO.15.23
reference: Proverbs 15:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
  footnotes:
  - marker: a
    text: Or 'for a man there is joy in an answer from his mouth.' The Hebrew construction can be rendered more formally, but the main text expresses the sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'a word at the right time' or 'a word in season.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 자기 입으로 하는 대답에서 기쁨을 얻고, 제때에 하는 말은 얼마나 좋습니까!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂמְחָה
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 기쁨과 즐거움
  lexicon: HALOT
  rationale: 명사 שִׂמְחָה의 기본 의미를 자연스러운 현대 한국어로 옮겼습니다. 잠언의 간결한 경구체에 맞게 ‘기쁨’이 가장 직결됩니다.
- source_word: לָאִישׁ
  english_pob_choice: a man
  chosen_korean: 사람에게
  alternatives_korean:
  - 한 남자에게
  - 사람에게는
  lexicon: HALOT
  rationale: 히브리어의 단수 남성형을 그대로 드러내기보다, 잠언의 일반적 진술 기능을 살려 대표적 인간을 뜻하는 ‘사람’으로 옮겼습니다. 한국어에서는 ‘~에게 기쁨이 되다’ 구문이 자연스럽습니다.
- source_word: בְּמַעֲנֵה פִיו
  english_pob_choice: in the answer of his mouth
  chosen_korean: 말에 대한 응답
  alternatives_korean:
  - 입의 대답
  - 입에서 나오는 응답
  lexicon: HALOT
  rationale: מַעֲנֶה פִיו의 직역인 ‘그의 입의 응답’은 한국어에서 다소 어색하므로, 몸-부분 이미지를 완전히 지우지 않으면서도 의미를 분명히 하는 방향으로 ‘말에 대한 응답’으로 옮겼습니다.
- source_word: וְדָבָר בְּעִתּוֹ
  english_pob_choice: and a word in its time
  chosen_korean: 때맞은 말
  alternatives_korean:
  - 적절한 말
  - 시의적절한 말
  lexicon: HALOT
  rationale: דָבָר는 여기서 일반 ‘사물’보다 발화된 ‘말’의 의미가 자연스럽고, בְּעִתּוֹ는 ‘제때에/때맞게’의 뜻을 가집니다. 병렬 구조를 살려 간결하게 ‘때맞은 말’로 옮겼습니다.
- source_word: מַה טּוֹב־־
  english_pob_choice: how good it is!
  chosen_korean: 얼마나 좋습니까
  alternatives_korean:
  - 참 좋습니다
  - 얼마나 좋은지요
  lexicon: HALOT
  rationale: 히브리어 감탄형을 한국어 감탄문으로 옮겼습니다. 종결감과 운율을 살리기 위해 ‘얼마나 좋습니까!’를 사용했습니다.
