  source_fidelity: 첫 행의 히브리어 בְּמַעֲנֵה פִיו는 ‘그의 입의 대답’, 곧 사람이 자기 입으로 하는 대답을 가리킵니다. 초안의 ‘말에 대한 응답’은 ‘누군가의 말에 응답함’으로 뜻이 바뀌어 원문의 소유·행위 관계를 보존하지 못합니다. ‘제때에 하는 말’은 וְדָבָר בְּעִתּוֹ의 시간적 적절성을 충실히 드러냅니다.
  naturalness: ‘자기 입으로 하는 대답에서 기쁨을 얻고’는 현대 표준 한국어에서 자연스럽고, 잠언의 일반적 경구체에도 어울립니다. ‘얼마나 좋습니까!’는 합쇼체의 감탄 종결을 유지합니다.
  terminology: שִׂמְחָה는 ‘기쁨’, מַעֲנֶה는 ‘대답’, דָבָר는 문맥상 ‘말’로 적절합니다. אִישׁ은 대표적 일반 진술로서 ‘사람’으로 옮겨도 무방합니다.
