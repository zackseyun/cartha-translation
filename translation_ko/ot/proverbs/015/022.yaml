base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
  footnotes:
  - marker: a
    text: Or 'Plans are frustrated without deliberation, but with many advisers they are established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 조언이 없으면 계획은 무너지고, 조언자가 많으면 세웁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 숙의가 없으면 계획은 좌절되고, 조언자가 많으면 세워집니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵר
  english_pob_choice: fail
  chosen_korean: 무너지고
  alternatives_korean:
  - 실패하고
  - 깨지고
  - 좌절되고
  lexicon: HALOT
  rationale: פרר의 사역적 의미는 ‘깨뜨리다/무너뜨리다’에 가깝고, 문맥상 ‘계획’이 주어이므로 한국어에서는 결과를 자연스럽게 보여 주는 ‘무너지고’가 적절합니다.
- source_word: מַחֲשָׁבוֹת
  english_pob_choice: plans
  chosen_korean: 계획은
  alternatives_korean:
  - 생각은
  - 뜻은
  - 의도는
  lexicon: HALOT
  rationale: 지혜문맥에서 이 명사는 단순한 내적 생각보다 숙고된 계획이나 의도를 가리키므로 ‘계획’이 가장 분명합니다.
- source_word: סוֹד
  english_pob_choice: counsel
  chosen_korean: 지혜로운 조언
  alternatives_korean:
  - 조언
  - 의논
  - 비밀스러운 회의
  lexicon: HALOT
  rationale: סוֹד는 비밀성보다 친밀한 의논, 조언, 상담의 뜻을 가질 수 있는데, 여기서는 뒤의 ‘조언자들’과의 대조 때문에 실질적인 조언/숙의가 핵심이므로 ‘지혜로운 조언’으로 옮겼습니다.
- source_word: יוֹעֲצִים
  english_pob_choice: advisers
  chosen_korean: 조언자
  alternatives_korean:
  - 상담자
  - 권고하는 사람들
  - 참모
  lexicon: HALOT
  rationale: יעץ의 능동 분사로서 조언을 주는 사람들을 가리키므로, 현대 한국어에서 가장 직접적인 대응인 ‘조언자’가 적절합니다.
