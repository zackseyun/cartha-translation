  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
  footnotes:
  - marker: a
    text: Or 'but he who keeps/observes reproof becomes shrewd.' The Hebrew verb behind 'heeds' is literally 'keeps' or 'guards,' and the final verb can carry the sense 'becomes prudent' or 'shows shrewdness.'
