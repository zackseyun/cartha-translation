id: PRO.15.6
reference: Proverbs 15:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
  footnotes:
  - marker: a
    text: Or 'produce,' 'harvest,' or 'revenue' of the wicked.
    reason: lexical_alternative
  - marker: b
    text: Or 'it is ruined/disturbed'; the Hebrew verb can express trouble, disturbance, or ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 집에는 큰 재물이 있고, 악인의 소득에는 환난이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산물’, ‘수확’, ‘수입’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘혼란스럽다’, ‘무너진다’, ‘뒤엉킨다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  english_pob_choice: In the house of the righteous
  chosen_korean: 의인의 집
  alternatives_korean:
  - 의로운 사람의 집
  - 의로운 자의 집
  - 의인의 가정
  lexicon: HALOT
  rationale: בֵּית은 구체적인 ‘집’을 가리키면서도 소유와 삶의 터전을 함께 떠올리게 하므로, 한국어에서도 간결한 ‘의인의 집’으로 옮겨 원문의 이미지와 수사적 평행을 살렸습니다.
- source_word: חֹסֶן רָב
  english_pob_choice: great wealth
  chosen_korean: 큰 재물
  alternatives_korean:
  - 큰 부
  - 많은 재물
  - 큰 재산
  lexicon: HALOT
  rationale: חֹסֶן은 단순한 현금보다 넓은 물질적 풍요를 가리킬 수 있지만, 속담적 대조에서는 자연스럽고 직관적인 ‘재물’이 적절하며, רָב은 ‘큰’으로 간단히 살렸습니다.
- source_word: תְבוּאַת
  english_pob_choice: income
  chosen_korean: 소득
  alternatives_korean:
  - 산물
  - 수확
  - 수입
  lexicon: HALOT
  rationale: תְבוּאָה는 원래 생산물/수확이지만, 여기서는 경제적 결과를 가리키는 폭이 있어 현대어 ‘소득’이 대조를 분명하게 전달합니다.
- source_word: נֶעְכָּרֶת
  english_pob_choice: there is trouble
  chosen_korean: 환난이 있습니다
  alternatives_korean:
  - 문제가 있습니다
  - 혼란이 있습니다
  - 망합니다
  lexicon: HALOT
  rationale: עכר는 ‘뒤섞다, 괴롭게 하다, 혼란케 하다’의 의미 영역을 가지므로, 단순한 ‘ruin’보다 원문의 부정적 상태를 살리는 ‘환난’으로 옮겼습니다.
theological_decisions:
- issue: 의인과 악인의 대조를 지혜문학의 일반 진술로 처리할지 여부
  chosen_reading: 개별 사례가 아니라 대표적/격언적 대조로 읽어, ‘의인의 집’과 ‘악인의 소득’이라는 평행 구조를 그대로 살렸습니다.
  alternative_readings:
  - 도덕적 원칙을 강하게 일반화한 문장으로 읽는 방식
  - 두 집단의 운명을 종말론적으로 확대 해석하는 방식
  rationale: 본문은 지혜문학적 잠언으로서 관찰된 일반 경향을 압축합니다. 따라서 신학적 과잉 확대보다 속담의 대조를 간명하게 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 격언적 일반성
- issue: נֶעְכָּרֶת의 의미를 ‘파괴’보다 ‘환난’으로 옮길지 여부
  chosen_reading: 악인의 소득 자체가 ‘환난’과 연결되어 있다는 식으로 표현했습니다.
  alternative_readings:
  - ‘무너집니다’
  - ‘뒤엉킵니다’
  - ‘혼란스럽습니다’
  rationale: 히브리어는 상태의 훼손, 혼란, 재난을 모두 포괄할 수 있으므로, 한국어에서 너무 물리적 파괴로 좁히기보다 포괄적인 부정 상태를 드러내는 표현이 적절합니다.
  doctrine_reference: 어휘 의미역 보존
