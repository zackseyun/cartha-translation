  - 현명한
  lexicon: HALOT
  rationale: 지혜문학의 عملی적·윤리적 지혜를 드러내기 위해 ‘지혜로운’을 택했습니다.
- source_word: יְשַׂמַּח
  english_pob_choice: brings joy to
  chosen_korean: 기쁘게 합니다
  alternatives_korean:
  - 기쁨을 줍니다
  - 즐겁게 합니다
  lexicon: HALOT
  rationale: 사역적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽고 간결하게 표현했습니다.
- source_word: בּוֹזֶה
  english_pob_choice: despises
  chosen_korean: 업신여깁니다
  alternatives_korean:
  - 멸시합니다
  - 경멸합니다
  lexicon: HALOT
  rationale: 히브리어 분사가 나타내는 지속적 태도와 강한 경멸의 뜻을 한국어에서 잘 드러내는 말로 옮겼습니다.
theological_decisions:
- issue: כְסִיל אָדָם의 성격과 인간 지칭
  chosen_reading: ‘어리석은 사람’으로 옮기되, 특정 개인을 가리키는 일반적 인물 표현으로 이해했습니다.
  alternative_readings:
  - ‘어리석은 남자’
  - ‘어리석은 자’
  rationale: 본문의 אָדָם은 인류 일반이 아니라 한 개인을 가리키는 것으로 보이며, 한국어에서는 잠언의 성격을 살리기 위해 성별을 드러내지 않는 자연스러운 인물 표현을 택했습니다.
  doctrine_reference: 잠언의 대구법과 인물 일반화 표현
