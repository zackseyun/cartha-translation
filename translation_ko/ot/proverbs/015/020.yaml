  text: בֵּ֣ן חָ֭כָם יְשַׂמַּח אָ֑ב וּ/כְסִ֥יל אָ֝דָ֗ם בּוֹזֶ֥ה אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
  footnotes:
  - marker: a
    text: Or 'a foolish person'; Hebrew has 'a foolish man' (כְסִיל אָדָם), with אָדָם here referring to an individual rather than humankind.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 아들은 아버지를 기쁘게 하지만, 어리석은 사람은 어머니를 업신여깁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람’; 히브리어는 ‘어리석은 남자’(כְסִיל אָדָם)이며, 여기서 אָדָם은 인류 전체가 아니라 한 개인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 아이
  lexicon: HALOT
  rationale: 히브리어 단수 남성형을 그대로 살려, 잠언의 대구법에서 자연스러운 ‘아들’로 옮겼습니다.
- source_word: חָכָם
  english_pob_choice: wise
  chosen_korean: 지혜로운
  alternatives_korean:
