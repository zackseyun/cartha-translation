  text: 지혜로운 아들은 아버지를 기쁘게 하지만, 어리석은 남자[a]는 자기 어머니를 업신여깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람’. 히브리어는 ‘어리석은 남자’(כְסִיל אָדָם)이며, 여기서 אָדָם은 인류 전체가 아니라 한 개인을 가리킵니다.
    reason: lexical_alternative
