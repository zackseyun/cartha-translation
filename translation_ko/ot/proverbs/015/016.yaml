  to: 야훼를 경외하며 적게 가진 것이 큰 보물과 그에 따르는 소란보다 낫습니다.[a]
  rationale: 첫 구절을 소유의 적음과 야훼 경외의 동반을 자연스럽고 정확하게 나타내도록 고쳤습니다. 둘째 구절의 ‘그에 따르는 소란’은 보물과 관련된 מְהוּמָה를 간결하게 반영하며, 대명사의 관계적 모호성은 각주에서 대안을 제시해 보존했습니다. 각주의 미번역 영어를 모두 한국어로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:07Z'
