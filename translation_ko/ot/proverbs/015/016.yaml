base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
  footnotes:
  - marker: a
    text: Or 'and trouble with it' or 'and confusion in it.' The Hebrew term can denote turmoil, disturbance, or confusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 경외하며 적게 가진 것이 큰 보물과 그에 따르는 소란보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것과 함께하는 괴로움’ 또는 ‘그 안의 혼란’일 수 있습니다. 히브리어 용어는 소란, 동요, 혼란을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מְעַט
  english_pob_choice: Better is a little
  chosen_korean: 작은 것이 ... 낫습니다
  alternatives_korean:
  - 적은 것이 ... 낫습니다
  - 조금이 ... 낫습니다
  lexicon: HALOT
  rationale: 잠언의 비교 구조를 한국어에서 자연스럽게 살리기 위해 '작은 것'과 '낫습니다'로 옮겼습니다. '적은 것'도 가능하지만, 문장 흐름상 '작은 것'이 더 매끄럽습니다.
- source_word: בְּיִרְאַת יְהוָה
  english_pob_choice: with the fear of Yahweh
  chosen_korean: 야훼를 경외하는
  alternatives_korean:
  - 야훼에 대한 경외와 함께하는
  - 야훼를 두려워하며
  lexicon: HALOT
  rationale: ב의 동반 의미와 지혜문학의 관용구를 반영하여 '야훼를 경외하는'으로 자연스럽게 옮겼습니다. '두려워하다'는 가능하지만 여기서는 경외의 예배적·언약적 뉘앙스가 더 분명합니다.
- source_word: מֵאוֹצָר רָב
  english_pob_choice: great treasure
  chosen_korean: 큰 보물
  alternatives_korean:
  - 많은 보물
  - 큰 재물
  lexicon: HALOT
  rationale: אוֹצָר는 축적된 재물/보물을 가리키므로 '보물'이 핵심 이미지를 잘 살립니다. רָב는 크고 많은 양을 강조하므로 '큰'으로 압축해 비교 대조를 분명히 했습니다.
- source_word: וּמְהוּמָה בּוֹ
  english_pob_choice: and turmoil with it
  chosen_korean: 따르는 소란
  alternatives_korean:
  - 그 안의 소란
  - 그것과 함께하는 혼란
  - 동반되는 혼란
  lexicon: HALOT
  rationale: מְהוּמָה의 의미 범위(소란, 혼란, 동요, 불안)를 고려해 '소란'을 택했습니다. בוֹ를 한국어에서 '따르는'으로 풀어, 많은 재물에 수반되는 불안정함을 간결하게 드러냈습니다.
theological_decisions:
- issue: ‘야훼를 경외함’의 지혜문학적 의미
  chosen_reading: 본문의 관용구를 유지해 '야훼를 경외하는'으로 번역했습니다.
  alternative_readings:
  - 야훼에 대한 경외
  - 야훼를 공경하는
  rationale: 잠언의 핵심 신학 표현을 축소하지 않기 위해 '경외'를 유지했습니다. 이는 단순한 감정이 아니라 하나님께 대한 언약적 태도와 삶의 방향을 포함합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
