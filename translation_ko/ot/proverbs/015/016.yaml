  source_fidelity: 수정안은 מְעַט를 ‘적게 가진 것’으로, בְּיִרְאַת יְהוָה를 ‘야훼를 경외하며’로, מֵאוֹצָר רָב וּמְהוּמָה בוֹ를 ‘큰 보물과 그에 따르는 소란’으로 옮겨 히브리어의 비교와 동반 관계를 충실히 반영합니다. בּוֹ의 ‘with/in it’ 범위는 각주에서 보존합니다.
  naturalness: 초안의 ‘야훼를 경외하는 작은 것’은 ‘작은 것’이 야훼를 경외한다는 뜻으로 잠시 읽힐 수 있고, ‘작은 것’도 소유의 적음을 나타내기에는 다소 부자연스럽습니다. ‘야훼를 경외하며 적게 가진 것’이 현대 표준 한국어에서 명료하고 자연스럽습니다.
  terminology: ‘야훼’, ‘경외’, ‘보물’, ‘소란’은 본문의 신명과 지혜문학의 핵심 표현 및 מְהוּמָה의 의미 범위에 적절합니다. 각주에 남아 있던 영어 단어 trouble, confusion은 한국어로 바로잡아야 합니다.
