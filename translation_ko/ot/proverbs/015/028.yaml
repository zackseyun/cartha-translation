  source_fidelity: 히브리어의 대조 구조와 핵심 어휘는 대체로 잘 반영했습니다. 다만 ‘대답할 말을’은 לַעֲנוֹת(‘대답하기 위해/대답하려고’)가 명시하지 않는 목적어 ‘말’을 보충합니다. 이를 목적 표현으로 옮기면 원문의 범위를 더 충실히 보존할 수 있습니다.
