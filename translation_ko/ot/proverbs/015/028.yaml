  terminology: ‘의인’, ‘악인’, ‘마음’은 지혜문학의 대조와 한국어 성경 문체에 적절합니다. ‘악한 것들’은 רָעוֹת의 복수성과 넓은 의미를 유지하며, 이를 ‘악한 말’로 한정하지 않는 편이 안전합니다.
  issues:
