  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
  footnotes:
  - marker: a
    text: Or 'meditates before answering.' The Hebrew verb can carry the sense of musing or pondering, and the phrase may be rendered more formally as 'ponders to answer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 마음은 대답하려고 숙고하지만, 악인들의 입은 악한 것들을 쏟아 냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘묵상하다’ 또는 ‘곰곰이 생각하다’라는 뜻도 담을 수 있습니다. 따라서 “대답하기 전에 숙고한다”로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב / heart
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  lexicon: HALOT
  rationale: 히브리어 wisdom 문맥의 לֵב은 내면 전체, 특히 사고와 분별을 가리키므로 한국어로는 ‘마음’이 가장 자연스럽고 원뜻도 잘 살립니다.
- source_word: יֶהְגֶּה
  english_pob_choice: considers
  chosen_korean: 생각해 보지만
  alternatives_korean:
  - 숙고합니다
  - 묵상합니다
  - 헤아립니다
  lexicon: HALOT
  rationale: 이 동사는 중얼거리며 되새기거나 미리 숙고하는 뜻을 담으므로, ‘대답할 말을 생각해 보지만’이 답하기 전의 신중한 숙고를 읽기 쉽게 드러냅니다.
- source_word: לַעֲנוֹת
  english_pob_choice: how to answer
  chosen_korean: 대답할 말을
  alternatives_korean:
  - 어떻게 대답할지
  - 대답하는 것
  lexicon: HALOT
  rationale: 전치사 ל가 목적·관계를 나타내므로, 의인의 마음이 ‘대답할 말’을 미리 숙고한다는 의미를 한국어 관용에 맞게 풀었습니다.
- source_word: יַבִּיעַ רָעוֹת
  english_pob_choice: pours out evil things
  chosen_korean: 악한 것들을 쏟아 냅니다
  alternatives_korean:
  - 악을 쏟아 냅니다
  - 악한 말을 쏟아 냅니다
  - 악한 것들을 내뱉습니다
  lexicon: HALOT
  rationale: יַבִּיעַ는 샘물처럼 흘러나오게 하는 생생한 이미지를 가지므로 ‘쏟아 냅니다’가 과장되지 않으면서도 통제되지 않은 발화를 잘 살립니다. רָעוֹת는 단순히 추상적 ‘악’보다 복수형의 ‘악한 것들’이 더 직접적입니다.
