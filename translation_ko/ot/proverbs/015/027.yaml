  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
  footnotes:
  - marker: a
    text: Hebrew 'gifts'; in this context the sense is likely 'bribes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이익을 탐하는 자는 자기 집을 어지럽히고, 뇌물을 미워하는 자는 살 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘선물’이지만, 이 문맥에서는 ‘뇌물’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  english_pob_choice: troubles
  chosen_korean: 어지럽히고
  alternatives_korean:
  - 괴롭게 하고
  - 해치고
  - 망가뜨리고
  lexicon: HALOT
  rationale: עכר는 ‘혼란을 일으키다, 괴롭히다’의 뜻이어서, 잠언의 짧은 경구성에 맞게 ‘어지럽히고’로 옮겨 결과적 혼란을 살렸습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 집
  alternatives_korean:
  - 자기 집안
  - 자기 가정
  - 자기 가족
  lexicon: HALOT
  rationale: בַּיִת은 문자적으로 ‘집’이지만 여기서는 가정/집안을 포함하는 삶의 영역을 가리킬 수 있으므로, 이미지를 유지하면서도 자연스러운 ‘자기 집’으로 옮겼습니다.
- source_word: בּוֹצֵעַ בָּצַע
  english_pob_choice: is greedy for gain
  chosen_korean: 이익을 탐하는 자
  alternatives_korean:
  - 부정한 이익을 탐하는 자
  - 불의한 이익을 탐하는 자
  - 이득을 탐하는 자
  lexicon: HALOT
  rationale: 어근 반복은 탐욕의 강도를 강조하지만, 본문 자체에는 ‘불의한’의 명시가 없으므로 과도한 규정 없이 ‘이익을 탐하는 자’로 간결하게 살렸습니다.
- source_word: מַתָּנֹת
  english_pob_choice: bribes
  chosen_korean: 뇌물
  alternatives_korean:
  - 선물
  - 예물
  lexicon: HALOT
  rationale: 직역하면 ‘선물’이지만, 이 문맥에서는 재판이나 관계를 왜곡하는 ‘뇌물’이 더 정확합니다. 다만 히브리어 자체가 더 넓은 의미를 가지므로 원문 뉘앙스의 긴장은 유지됩니다.
theological_decisions:
- issue: 잠언의 도덕적 대비 구조
  chosen_reading: 탐욕과 뇌물 혐오를 대조하는 지혜 격언으로 읽고, 결과를 ‘자기 집의 혼란’과 ‘생명/생존’의 대비로 드러냈습니다.
  alternative_readings:
  - 단순한 재물 경계의 교훈
  - 가정 윤리만을 말하는 경구
  rationale: 본문은 개인의 탐욕이 공동체적·가정적 파괴를 낳고, 뇌물을 거부하는 태도가 생명으로 이어진다는 도덕적 인과를 제시합니다.
  doctrine_reference: 지혜문학의 보응 원리
- issue: ‘살 것입니다’의 범위
  chosen_reading: יִחְיֶה는 단지 생물학적 생존보다도 지혜 아래서의 참된 삶/보존을 포함할 수 있으나, 본문은 짧은 미래형으로 그대로 살렸습니다.
  alternative_readings:
  - 살아남을 것입니다
  - 번성할 것입니다
  rationale: 문맥상 의미 확장은 가능하지만, 원문의 간결한 약속을 보존하기 위해 가장 직접적인 ‘살 것입니다’를 택했습니다.
  doctrine_reference: 히브리어 동사 חיה의 잠언 용례
