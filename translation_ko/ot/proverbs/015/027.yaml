  lexicon: HALOT
  rationale: 직역하면 ‘선물’이지만, 이 문맥에서는 재판이나 관계를 왜곡하는 ‘뇌물’이 더 정확합니다. 다만 히브리어 자체가 더 넓은 의미를 가지므로 원문 뉘앙스의 긴장은 유지됩니다.
theological_decisions:
- issue: 잠언의 도덕적 대비 구조
  chosen_reading: 탐욕과 뇌물 혐오를 대조하는 지혜 격언으로 읽고, 결과를 ‘자기 집의 혼란’과 ‘생명/생존’의 대비로 드러냈습니다.
  alternative_readings:
  - 단순한 재물 경계의 교훈
  - 가정 윤리만을 말하는 경구
  rationale: 본문은 개인의 탐욕이 공동체적·가정적 파괴를 낳고, 뇌물을 거부하는 태도가 생명으로 이어진다는 도덕적 인과를 제시합니다.
  doctrine_reference: 지혜문학의 보응 원리
- issue: ‘살 것입니다’의 범위
  chosen_reading: יִחְיֶה는 단지 생물학적 생존보다도 지혜 아래서의 참된 삶/보존을 포함할 수 있으나, 본문은 짧은 미래형으로 그대로 살렸습니다.
  alternative_readings:
  - 살아남을 것입니다
  - 번성할 것입니다
  rationale: 문맥상 의미 확장은 가능하지만, 원문의 간결한 약속을 보존하기 위해 가장 직접적인 ‘살 것입니다’를 택했습니다.
  doctrine_reference: 히브리어 동사 חיה의 잠언 용례
