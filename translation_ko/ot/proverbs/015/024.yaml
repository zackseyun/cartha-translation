  text: אֹ֣רַח חַ֭יִּים לְ/מַ֣עְלָ/ה לְ/מַשְׂכִּ֑יל לְמַ֥עַן ס֝֗וּר מִ/שְּׁא֥וֹל מָֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: ko
  text: 분별력 있는 사람에게 생명의 길은 위로 향하는 길이니, 그가 아래에 있는 스올을 피하게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח חַיִּים
  english_pob_choice: The path of life
  chosen_korean: 생명의 길
  alternatives_korean:
  - 생명으로 가는 길
  - 살아 있는 길
  lexicon: אֹרַח
  rationale: אֹרַח는 ‘길/행로’이며, חַיִּים은 ‘생명’이므로 직역에 가까운 ‘생명의 길’이 가장 자연스럽고 간결합니다.
- source_word: לְמַשְׂכִּיל
  english_pob_choice: for the prudent
  chosen_korean: 분별력 있는 사람에게
  alternatives_korean:
  - 지혜로운 이에게
  - 슬기로운 사람에게
  lexicon: מַשְׂכִּיל
  rationale: מַשְׂכִּיל은 단순한 지식보다 상황을 분별해 올바르게 행동하는 사람을 가리키므로, ‘분별력 있는 사람’이 의미를 잘 살립니다.
- source_word: לְמַעַן סוּר
  english_pob_choice: so that he may turn away
  chosen_korean: 그래서 그가 돌아서게 합니다
  alternatives_korean:
  - 그리하여 그가 떠나게 합니다
  - 그가 돌이키도록 하려는 것입니다
  lexicon: לְמַעַן + סוּר
  rationale: 목적을 나타내는 לְמַעַן을 결과의 흐름이 드러나는 ‘그래서’로 옮기고, סוּר는 ‘돌아서다/돌이키다’로 표현했습니다.
- source_word: מִשְּׁאוֹל מָטָּה
  english_pob_choice: from Sheol below
  chosen_korean: 아래에 있는 스올에서
  alternatives_korean:
  - 아래 스올에서
  - 밑에 있는 스올에서
  lexicon: שְׁאוֹל
  rationale: שְׁאוֹל은 전통적 교회 용어보다 원어 음가를 살린 ‘스올’로 두고, מָטָּה의 아래쪽 이미지는 ‘아래에 있는’으로 분명히 했습니다.
theological_decisions:
- issue: 스올의 번역 방식
  chosen_reading: ‘스올’을 음역하여 죽음의 처소라는 구약적 개념을 보존했습니다.
  alternative_readings:
  - ‘음부’로 번역
  - ‘무덤’으로 번역
  rationale: 원문의 שְׁאוֹל은 단순한 무덤보다 더 넓은 죽음의 영역을 가리킬 수 있으므로, 의미를 좁히는 번역은 피했습니다.
  doctrine_reference: 구약의 사후 영역 표현
