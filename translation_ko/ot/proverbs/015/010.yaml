base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
  footnotes:
  - marker: a
    text: Or 'severe discipline.' The Hebrew adjective can also be rendered 'bad' or 'evil,' but here it most likely describes the painful severity of the discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'the way.' The Hebrew uses a common wisdom metaphor for one's moral course of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 길을 버리는 자에게는 가혹한 징계가 있고,[a] 훈계를 미워하는 자는 죽습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가혹한’은 히브리어 רָע의 가능한 의미들 가운데 이 문맥에서 가장 자연스러운 해석입니다. ‘악한’이나 ‘나쁜’으로도 옮길 수 있으나, 여기서는 징계의 고통스럽고 엄한 성격을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘길’은 히브리어 אֹרַח을 옮긴 말입니다. 지혜문학에서는 흔히 사람이 살아가는 도덕적 행로를 비유적으로 가리킵니다. ‘도’ 또는 ‘삶의 길’로도 옮길 수 있습니다.
    reason: lexical_alternative
