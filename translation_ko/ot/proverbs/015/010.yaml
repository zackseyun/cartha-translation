  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
  footnotes:
  - marker: a
    text: Or 'severe discipline.' The Hebrew adjective can also be rendered 'bad' or 'evil,' but here it most likely describes the painful severity of the discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'the way.' The Hebrew uses a common wisdom metaphor for one's moral course of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 징계가혹은 길을 버리는 자에게 있고 — 훈계를 미워하는 자는 죽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가혹한’은 רָע의 가능한 의미들 가운데 여기 문맥에서 가장 자연스러운 해석입니다. ‘악한’이나 ‘나쁜’도 가능하지만, 징계의 체감 강도를 드러내는 데는 덜 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘길’은 지혜문학에서 흔한 ‘the way’의 비유를 살린 번역입니다. 더 직역하면 ‘길/도’ 또는 ‘삶의 길’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈육
  - 교정
  - 책망
  lexicon: HALOT
  rationale: מוסר은 지혜문학에서 교정적 징계와 훈육을 아우르며, 여기서는 뒤의 ‘훈계’와 짝을 이루어 경고의 성격이 두드러지므로 ‘징계’가 가장 자연스럽습니다.
- source_word: רָע
  english_pob_choice: harsh
  chosen_korean: 가혹한
  alternatives_korean:
  - 악한
  - 나쁜
  - 엄한
  lexicon: HALOT
  rationale: 형용사 רָע는 보통 ‘악한’이지만, 여기서는 징계의 성격을 묘사하므로 도덕적 평결보다 체감되는 강도를 살리는 ‘가혹한’이 원문의 힘을 더 잘 반영합니다.
- source_word: אֹרַח
  english_pob_choice: the path
  chosen_korean: 길
  alternatives_korean:
  - 길
  - way
  - 삶의 길
  lexicon: HALOT
  rationale: אֹרַח은 지혜문학에서 삶의 도덕적 행로를 가리키는 비유이므로, 한국어에서는 간결하고 관용적인 ‘길’로 옮겨 그 비유를 유지했습니다.
- source_word: תוֹכַחַת
  english_pob_choice: reproof
  chosen_korean: 훈계
  alternatives_korean:
  - 책망
  - 책벌
  - 교정
  lexicon: HALOT
  rationale: תוֹכַחַת은 책망과 교정을 포함하는 말로, 앞의 ‘징계’와 구별되면서도 지혜서 어조에 맞는 ‘훈계’가 가장 균형 잡힌 대응입니다.
theological_decisions:
- issue: 죽음의 범위
  chosen_reading: 그냥 ‘죽습니다’라고 옮겨, 육체적 죽음인지 최종적 멸망인지 특정하지 않았습니다.
  alternative_readings:
  - 멸망합니다
  - 죽임을 당합니다
  - 영적으로 죽습니다
  rationale: 히브리어 יָמוּת는 문맥상 폭이 넓고 잠언은 그 결과를 구체화하지 않으므로, 해석을 좁히지 않고 경고의 직접성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
