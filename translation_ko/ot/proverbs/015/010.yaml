theological_decisions:
- issue: 죽음의 범위
  chosen_reading: 그냥 ‘죽습니다’라고 옮겨, 육체적 죽음인지 최종적 멸망인지 특정하지 않았습니다.
  alternative_readings:
  - 멸망합니다
  - 죽임을 당합니다
  - 영적으로 죽습니다
  rationale: 히브리어 יָמוּת는 문맥상 폭이 넓고 잠언은 그 결과를 구체화하지 않으므로, 해석을 좁히지 않고 경고의 직접성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
