theological_decisions:
- issue: 속담적 평행법의 대조를 한국어에서 어떻게 살릴지
  chosen_reading: 첫 행은 지혜로운 말이 지식을 유익하게 드러내고, 둘째 행은 어리석은 말이 어리석음을 넘쳐 나오게 한다는 대조로 읽었습니다.
  alternative_readings:
  - 지혜로운 자가 지식을 잘 사용한다
  - 어리석은 자가 어리석은 말을 많이 한다
  rationale: 히브리어 평행법의 핵심은 내용의 대조와 이미지의 강도에 있으므로, 단순한 평면적 진술보다 ‘좋게 만들다/쏟아 내다’의 대비를 살렸습니다.
  doctrine_reference: 잠언의 지혜 문학 해석 원리
