  source_fidelity: 히브리어의 대조 구조(지혜로운 이들의 혀/어리석은 이들의 입), '지식'과 '어리석음', 그리고 יביע의 풍부하게 터져 나오는 이미지는 대체로 충실히 반영되었습니다. 다만 '지식을 좋게 만들다'는 תֵּיטִיב דָּעַת의 직역 흔적은 남기지만 현대 한국어에서는 부자연스럽고 의미가 불명확합니다. 본문은 문맥상 가능한 의미인 지식을 잘 드러내는 것으로 자연스럽게 옮기고, 주석에서 '잘 사용하다'를 포함한 어휘적 폭을 보존하는 것이 적절합니다.
  naturalness: '''지혜로운 자/어리석은 자들''보다 ''지혜로운 이들/어리석은 이들''이 현대 표준어에서 더 자연스럽고, 복수 대조도 유지합니다. ''쏟아 냅니다''는 ''쏟아냅니다''로 붙여 쓰는 것이 표준 표기에 맞습니다. 각 주석 표지는 해당 어휘 바로 뒤에 두는 편이 독자가 가리키는 말을 분명히 알 수 있습니다.'
  terminology: '''혀'', ''입'', ''지식'', ''어리석음''은 잠언의 비유적 신체 이미지와 지혜 문학의 핵심 어휘를 적절히 보존합니다. ''지혜로운 이들''과 ''어리석은 이들''은 히브리어 복수의 범주적 용법을 성별을 특정하지 않고 전달합니다.'
