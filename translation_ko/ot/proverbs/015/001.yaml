id: PRO.15.1
reference: Proverbs 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַֽעֲנֶה רַּ֭ךְ יָשִׁ֣יב חֵמָ֑ה וּ/דְבַר עֶ֝֗צֶב יַעֲלֶה אָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
  footnotes:
  - marker: a
    text: Or 'a hurtful word' or 'a harsh word.' The Hebrew phrase literally means 'a word of pain/grief,' which can describe speech that causes hurt and so provokes anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 부드러운 대답은 분노를 돌이키지만, 고통스러운 말은 분노를 일으킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통스러운’은 히브리어 표현의 문자적 의미인 ‘고통/슬픔의 말’에 가깝습니다. 이 표현은 단지 말투가 거칠다는 뜻일 수도 있고, 실제로 상처를 주는 말을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  english_pob_choice: answer
  chosen_korean: 대답
  alternatives_korean:
  - 응답
  - 답변
  lexicon: HALOT
  rationale: 문맥이 말의 주고받음에 관한 잠언이므로, 자연스럽고 간결한 현대 한국어인 ‘대답’이 가장 적절합니다.
- source_word: רַּךְ
  english_pob_choice: gentle
  chosen_korean: 부드러운
  alternatives_korean:
  - 온화한
  - 다정한
  - 연한
  lexicon: HALOT
  rationale: ‘부드러운’은 상대를 누그러뜨리는 말의 성격을 잘 살리며, 뒤의 거친 말과도 분명한 대조를 이룹니다.
- source_word: יָשִׁיב חֵמָה
  english_pob_choice: turns away wrath
  chosen_korean: 분노를 돌이키다
  alternatives_korean:
  - 분노를 물리치다
  - 분노를 가라앉히다
  - 분노를 되돌리다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도, 화를 향한 반응을 바꾸어 놓는다는 관용적 뜻을 자연스럽게 전달합니다.
- source_word: עֶצֶב
  english_pob_choice: painful
  chosen_korean: 고통스러운
  alternatives_korean:
  - 아픈
  - 상처 주는
  - 괴로운
  - 해로운
  lexicon: HALOT
  rationale: 히브리어가 단순히 말투의 ‘거침’보다 상처와 고통을 주는 성격을 가리키므로, ‘고통스러운’이 핵심 의미를 보존합니다.
- source_word: יַעֲלֶה אָף
  english_pob_choice: stirs up anger
  chosen_korean: 분노를 일으킵니다
  alternatives_korean:
  - 분노를 자아냅니다
  - 분노를 끌어올립니다
  - 분노가 치밀게 합니다
  lexicon: HALOT
  rationale: עלה의 ‘올라가게 하다’는 직역보다, 분노를 촉발한다는 문맥적 뜻인 ‘일으키다’가 잠언체 한국어에 더 적합합니다.
