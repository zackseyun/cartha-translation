base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
  footnotes:
  - marker: a
    text: Hebrew 'lacking heart,' an idiom meaning lacking sense or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석음은 분별이 없는 자에게 기쁨이지만, 명철한 사람은 자기 길을 곧게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음이 없는’은 히브리어 관용구로, 감정이 없다는 뜻이 아니라 분별과 판단력이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִ֭וֶּלֶת
  english_pob_choice: Folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 어리석은 행위
  lexicon: HALOT
  rationale: הִוֶּלֶת는 지혜문학에서 어리석음의 추상명사이므로, 한국어에서도 추상명사인 ‘어리석음’이 가장 자연스럽고 간결합니다.
- source_word: לַחֲסַר לֵב
  english_pob_choice: one lacking sense
  chosen_korean: 분별이 없는 자
  alternatives_korean:
  - 마음이 없는 자
  - 지각이 없는 자
  - 분별이 부족한 사람
  lexicon: HALOT
  rationale: 직역의 ‘마음이 없는’은 한국어에서 감정 결핍처럼 들릴 수 있어, 잠언 문맥의 관용적 의미인 판단력 부족을 살려 ‘분별이 없는 자’로 옮겼습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 깨달음
  - 분별
  lexicon: HALOT
  rationale: 지혜문학에서 תְּבוּנָה는 단순한 이해보다 통찰과 판단력을 포함하므로, 한국어 지혜 어휘로 굳어진 ‘명철’이 적합합니다.
- source_word: יְיַשֶׁר לָכֶת
  english_pob_choice: makes his path straight
  chosen_korean: 자기 길을 곧게 합니다
  alternatives_korean:
  - 자기 길을 바르게 합니다
  - 자기 걸음을 곧게 합니다
  - 자기 길을 곧추세웁니다
  lexicon: HALOT
  rationale: 동사 יְיַשֶׁר의 사역적 의미를 살리면서, ‘길’의 은유를 유지해 삶의 행로를 바로잡는다는 뜻이 드러나도록 했습니다.
theological_decisions:
- issue: 잠언의 대표적 남성 단수 표현을 한국어에서 어떻게 보일지
  chosen_reading: ‘분별이 없는 자’와 ‘명철한 사람’으로 옮겨, 대표성은 살리되 한국어 독자에게 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - ‘분별이 없는 한 남자’
  - ‘분별이 없는 사람’
  rationale: 히브리어는 남성 단수의 대표적 표현이지만, 한국어에서는 성별 표지가 핵심 의미가 아니므로 과도한 성별 부각을 피하고 문장 기능을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
