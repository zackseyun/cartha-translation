  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
  footnotes:
  - marker: a
    text: Or 'his favor' or 'acceptable to him.' The Hebrew noun can denote pleasure, favor, or acceptance.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들의 제사는 야훼께 가증한 것이나, 올곧은 이들의 기도는 그분의 기쁨입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분의 기쁨’은 ‘그분의 호의’ 또는 ‘그분께 받아들여짐’으로도 옮길 수 있습니다. 히브리어 명사는 기쁨, 호의, 받아들여짐의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  english_pob_choice: sacrifice
  chosen_korean: 제사
  alternatives_korean:
  - 희생제물
  - 희생
  - 헌물
  lexicon: HALOT
  rationale: 잠언의 대구에서 제의적 행위를 가리키므로, 한국어에서 가장 자연스럽고 압축적인 ‘제사’를 택했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 형용사적 집합 명사로서 도덕적으로 악한 사람들을 가리키므로, 관용적이고 간결한 ‘악인’을 사용했습니다.
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 역겨운 것
  - 혐오스러운 것
  lexicon: HALOT
  rationale: 하나님께서 혐오하시는 강한 언약-도덕적 용어를 살리기 위해 ‘가증한 것’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 자리에 해당하는 신적 고유명사를 POB 기준에 따라 ‘야훼’로 옮겨, 칭호가 아닌 이름임을 드러냈습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 이들
  alternatives_korean:
  - 올곧은 이들
  - 의로운 이들
  lexicon: HALOT
  rationale: 도덕적으로 곧은 사람들을 가리키는 표현으로, 시적 대구 안에서 한국어 독자가 즉시 이해할 수 있는 ‘정직한 이들’을 택했습니다.
- source_word: רְצוֹנוֹ
  english_pob_choice: his delight
  chosen_korean: 그의 기쁨
  alternatives_korean:
  - 그의 선호
  - 그의 호의
  - 그가 기뻐하시는 것
  lexicon: HALOT
  rationale: 명사 רָצוֹן의 뜻 범위(기쁨, 호의, 받아들임)를 반영하되, 앞의 ‘가증한 것’과 강한 대조를 이루도록 ‘그의 기쁨’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 여호와 신명(יְהוָה) 표기
  chosen_reading: 본문의 Tetragrammaton은 ‘야훼’로 직역해 고유한 언약명을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 칭호가 아니라 하나님의 이름을 직접 사용하므로, 전통적 대체어보다 स्रोत-직접적인 표기를 유지하는 것이 аудitable합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
