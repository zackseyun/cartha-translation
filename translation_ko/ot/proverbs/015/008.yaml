    rationale: 이 어휘는 말의 정직성만이 아니라 삶과 품성의 도덕적 곧음을 뜻합니다. ‘올곧은 이들’이 본문의 윤리적 의미를 더 넓고 정확하게 반영합니다.
  revised_text: 악인들의 제사는 야훼께 가증한 것이나, 올곧은 이들의 기도는 그분의 기쁨입니다.[a]
