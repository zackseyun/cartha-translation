    issue: ‘야훼께서는 가증한 것’의 조사 및 문장 구조
    rationale: 히브리어 תּוֹעֲבַת יְהוָה는 ‘야훼의 가증한 것’, 곧 야훼께서 가증하게 여기시는 것이라는 관계입니다. ‘야훼께’로 옮기면 한국어에서 그 평가 관계가 자연스럽게 표현됩니다.
  - severity: low
