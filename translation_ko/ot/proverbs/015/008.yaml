  source_fidelity: 대구와 핵심 어휘는 대체로 충실합니다. 다만 תּוֹעֲבַת יְהוָה는 ‘야훼께서는’처럼 야훼를 주제로 삼기보다 ‘야훼께 가증한 것’으로 옮겨 소유·평가 관계를 자연스럽게 드러내는 편이 정확합니다. יְשָׁרִים은 단순한 정직성보다 도덕적 올곧음을 가리키므로 ‘올곧은 이들’이 더 적절합니다.
  naturalness: ‘야훼께서는 가증한 것’은 조사와 서술 관계가 다소 어색합니다. ‘야훼께 가증한 것’은 현대 표준어 문장으로 자연스럽고, 잠언의 간결한 대구도 유지합니다.
  terminology: ‘제사’, ‘악인들’, ‘가증한 것’, ‘야훼’는 적절합니다. רָצוֹנוֹ의 ‘그분의 기쁨’도 원문의 명사적 표현과 대조를 보존합니다. 존대 지시 표현은 ‘그분’으로 통일했습니다.
  issues:
