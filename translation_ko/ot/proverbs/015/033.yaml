  text: יִרְאַ֣ת יְ֭הוָה מוּסַ֣ר חָכְמָ֑ה וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
  footnotes:
  - marker: a
    text: Or 'The fear of the LORD is the discipline of wisdom.' The Hebrew term for 'instruction' can also carry the sense of corrective discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하는 것은 지혜에 대한 훈계[a]이며, 겸손은 명예보다 앞섭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와를 경외하는 것은 지혜의 훈계입니다.’ 히브리어 ‘instruction’에 해당하는 말은 교정과 징계의 뉘앙스도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 여호와를 경외하는 것
  alternatives_korean:
  - 야훼를 두려워하는 것
  - 여호와를 두려워하는 것
  - 여호와에 대한 경외
  lexicon: HALOT
  rationale: 문맥상 지혜문학의 정형구로서 하나님을 향한 경외를 뜻하므로, POB의 신명기 관례와는 달리 본문 의미를 살려 ‘여호와’를 사용하고 ‘경외하는 것’으로 옮겼습니다.
- source_word: מוּסַר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교훈
  - 'discipline: 징계'
  lexicon: HALOT
  rationale: 히브리어 מוּסַר은 문맥에 따라 가르침과 교정적 훈계를 아우르므로, 잠언의 권면적 성격을 살려 ‘훈계’로 옮겼습니다.
- source_word: כָבוֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 존귀
  - 영광
  - 존중
  lexicon: HALOT
  rationale: 지혜문학에서의 כָבוֹד는 추상적 ‘영광’보다 사회적 인정과 지위를 가리키는 의미가 강하므로 ‘명예’가 가장 자연스럽습니다.
- source_word: עֲנָוָה
  english_pob_choice: humility comes
  chosen_korean: 겸손은
  alternatives_korean:
  - 겸손이
  - 온유함은
  - 낮아짐은
  lexicon: HALOT
  rationale: 히브리어는 서술어가 없는 병렬구조이므로 한국어에서는 자연스럽게 주어를 세워 ‘겸손은’으로 시작하고, 뒤의 ‘앞섭니다’로 순서를 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절은 히브리어 본문에 직접 יְהוָה를 포함하지만, 한국어 POB 기본 방침에 따라 본문 표기는 전통적으로 널리 인식되는 ‘여호와’를 사용했습니다.
  doctrine_reference: 'POB Korean glossary: יהוה / YHWH'
