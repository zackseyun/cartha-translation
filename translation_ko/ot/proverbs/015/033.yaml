  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
  footnotes:
  - marker: a
    text: Or 'The fear of the LORD is the discipline of wisdom.' The Hebrew term for 'instruction' can also carry the sense of corrective discipline.
