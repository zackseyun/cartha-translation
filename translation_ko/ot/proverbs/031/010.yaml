  source_fidelity: 첫 행의 수사적 질문과 אֵשֶׁת־חַיִל을 ‘현숙한 아내’로 옮긴 것은 문맥상 적절합니다. 다만 מִכְרָהּ는 ‘값/가치/평가’이고 וְרָחֹק מִפְּנִינִים은 그 가치가 귀한 보석보다 훨씬 높다는 비교입니다. 현 번역의 ‘그녀의 값은 진주보다 훨씬 더 귀합니다’는 값 자체가 ‘귀하다’고 서술하여 비교 관계가 다소 흐려지며, פְּנִינִים의 불확실성에도 본문에서 ‘진주’를 확정합니다.
  naturalness: ‘그녀의 가치는 보석보다 훨씬 더 높습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 가치 비교를 분명히 드러냅니다. ‘현숙한 아내를 누가 찾을 수 있겠습니까?’도 자연스럽습니다.
  terminology: ‘현숙한 아내’는 חַיִל의 능력·덕성·가치가 결합된 뜻을 전통적이면서도 이해 가능한 한국어로 전달합니다. פְּנִינִים은 정확한 보석이 논쟁 중이므로 본문에서는 ‘보석’으로 일반화하고, 각주에서 진주·루비 등의 가능성을 밝혀야 합니다.
