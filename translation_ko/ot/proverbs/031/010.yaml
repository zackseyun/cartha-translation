id: PRO.31.10
reference: Proverbs 31:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
  footnotes:
  - marker: a
    text: Or 'A woman of noble character'; the Hebrew can refer more generally to a woman, though the household context favors 'wife.'
    reason: lexical_alternative
  - marker: b
    text: פְּנִינִים may also be rendered 'pearls' or traditionally 'rubies'; the exact gemstone is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'Her worth is far above jewels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 현숙한 아내를 누가 찾을 수 있겠습니까? 그녀의 값은 진주보다 훨씬 더 귀합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '현숙한 여자'. 히브리어는 더 일반적으로 '여자'를 가리킬 수 있으나, 가정 문맥은 '아내'를 더 잘 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: פְּנִינִים은 '진주' 또는 전통적으로 '루비'로도 옮길 수 있으나, 정확한 보석 종류는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그녀의 가치는 진주보다 훨씬 더 높습니다'.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  english_pob_choice: A wife of noble character
  chosen_korean: 현숙한 아내
  alternatives_korean:
  - 덕이 높은 아내
  - 능력 있는 아내
  - 유능한 아내
  lexicon: HALOT
  rationale: חַיִל의 핵심을 힘·능력·가치의 결합으로 보되, 한국어에서는 잠언의 지혜문맥과 가정적 맥락을 살려 '현숙한'으로 간결하게 옮겼습니다. אֵשֶׁת은 문맥상 '아내'가 가장 자연스럽습니다.
- source_word: מִי יִמְצָא
  english_pob_choice: who can find?
  chosen_korean: 누가 찾을 수 있겠습니까?
  alternatives_korean:
  - 누가 찾겠습니까?
  - 누가 발견할 수 있겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 희귀성과 찾기 어려움을 드러내므로, 단순 미래형보다 가능성 질문인 '찾을 수 있겠습니까?'가 원문의 효과를 잘 살립니다.
- source_word: פְּנִינִים
  english_pob_choice: jewels
  chosen_korean: 진주보다
  alternatives_korean:
  - 보석보다
  - 루비보다
  lexicon: HALOT
  rationale: פְּנִינִים의 정확한 보석 종류가 불확실하므로, 특정 보석명보다 일반 독자에게 자연스러운 '진주/보석' 계열로 처리했습니다. 비교 표현은 원문의 귀중함을 유지합니다.
- source_word: מִכְרָהּ
  english_pob_choice: Her value
  chosen_korean: 값은
  alternatives_korean:
  - 가치는
  - 값어치는
  - 소중함은
  lexicon: HALOT
  rationale: מִכְרָהּ는 가격·평가값의 뜻이므로, 한국어에서는 비교 문맥에 맞게 '값'으로 옮겨 원문의 평가적 의미를 살렸습니다.
theological_decisions:
- issue: 현숙한 아내의 사회적·가정적 역할을 단순 미덕 일반으로 약화시키지 않을지
  chosen_reading: 문맥상 '아내'를 유지하여 가정과 혼인 관계의 이상형을 분명히 드러냈습니다.
  alternative_readings:
  - 현숙한 여자
  - 유덕한 여성
  rationale: 지혜문학의 통상적 일반화 가능성은 있으나, 본절은 집안의 이상적 배우자를 찬양하는 흐름이므로 '아내'가 더 정확합니다.
  doctrine_reference: 잠언 31장 문맥
