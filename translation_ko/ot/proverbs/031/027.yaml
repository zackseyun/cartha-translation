id: PRO.31.27
reference: Proverbs 31:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צ֭וֹפִיָּה הֲלִיכ֣וֹת בֵּיתָ֑/הּ וְ/לֶ֥חֶם עַ֝צְל֗וּת לֹ֣א תֹאכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
  footnotes:
  - marker: a
    text: Or 'She looks well to the affairs of her household.' The Hebrew literally speaks of 'the ways/goings of her house.'
    reason: lexical_alternative
  - marker: b
    text: '''The bread of idleness'' is a Hebrew idiom for living in laziness or feeding on unproductive ease.'
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 집안의 길들을 살피며, 게으름의 빵은 먹지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 집의 길들/다님들’을 말합니다.
    reason: source_note
  - marker: b
    text: ‘게으름의 빵’은 게으름에 기대어 사는 삶을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  english_pob_choice: watches over
  chosen_korean: 살피며
  alternatives_korean:
  - 지켜보며
  - 감독하며
  - 살펴봅니다
  lexicon: HALOT
  rationale: 지속적으로 주의 깊게 돌보는 동작을 나타내며, 가정의 상태와 흐름을 꾸준히 살핀다는 뜻을 자연스럽게 드러냅니다.
- source_word: הֲלִיכוֹת
  english_pob_choice: the ways
  chosen_korean: 길들
  alternatives_korean:
  - 가는 일들
  - 행실
  - 살림살이의 일들
  lexicon: HALOT
  rationale: 직역하면 ‘걸음들/다님들’이지만, 여기서는 집안의 운영과 움직임을 가리키므로 ‘길들’이 원문의 이미지와 반복적 관찰의 뉘앙스를 함께 살립니다.
- source_word: בֵּיתָהּ
  english_pob_choice: her household
  chosen_korean: 집안
  alternatives_korean:
  - 그녀의 집
  - 가정
  - 살림
  lexicon: HALOT
  rationale: 물리적 집보다 가정 공동체 전체를 가리키는 뜻이 강하므로, 한국어에서는 ‘집안’이 사회적·기능적 범위를 잘 전달합니다.
- source_word: לֶחֶם עַצְלוּת
  english_pob_choice: the bread of idleness
  chosen_korean: 게으름의 빵
  alternatives_korean:
  - 나태의 빵
  - 게으른 생활의 떡
  - 무위의 양식
  lexicon: HALOT
  rationale: ‘빵’ 이미지를 유지해 히브리어 관용구를 드러내되, ‘게으름’으로 그 의미 영역을 분명히 하여 ‘먹지 않는다’와의 대비를 살렸습니다.
theological_decisions:
- issue: 잠언의 관용적 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘게으름의 빵’은 단순한 음식이 아니라 나태에 기대어 사는 삶의 양식을 가리키는 관용 표현으로 유지했습니다.
  alternative_readings:
  - ‘게으른 생활을 하지 않습니다’
  - ‘무위의 양식을 먹지 않습니다’
  rationale: 본문의 비유적 표현을 평이하게 풀기보다 이미지 자체를 남겨, 게으름을 일종의 ‘먹는 것/의존하는 것’으로 묘사하는 원문의 힘을 보존합니다.
  doctrine_reference: 잠언의 지혜 문학적 관용 표현 보존
- issue: 주어 대명사의 성별 표지
  chosen_reading: 문맥상의 여인을 ‘그녀’로 유지했습니다.
  alternative_readings:
  - ‘그 사람은’
  - ‘아내는’
  rationale: 직전 문맥의 현숙한 여인 묘사를 이어받는 것이며, 본문의 여성 주어를 흐리지 않기 위함입니다.
  doctrine_reference: 문맥 연속성
