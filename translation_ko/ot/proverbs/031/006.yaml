    text: 또는 '죽어 가는 사람'. 히브리어 분사형은 망해 가거나 파멸하거나 죽어 가는 사람을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '영혼이 쓰라린 자들'. 깊은 내적 고통이나 비통함을 나타내는 관용적 표현입니다.
    reason: cultural_note
