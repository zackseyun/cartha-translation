    text: '''망해가는 자''는 ''죽어가는 자''로 번역될 수 있습니다. 히브리어 분사형은 망하거나 파멸하거나 죽어가는 자를 광범위하게 지칭할 수 있습니다.'
    reason: alternative_reading
