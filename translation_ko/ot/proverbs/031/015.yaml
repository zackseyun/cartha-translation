  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
  footnotes:
  - marker: a
    text: Or 'and an assigned share to her maidservants.' The Hebrew word for 'portions' can also mean a prescribed due or fixed allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 아직 밤일 때 일어나 자기 집안에 먹을 것을 주고 자기 여종들에게 몫을 나눠 줍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여종들에게 정해진 몫을 준다.' 히브리어 חֹק은 '정해진 할당분'이나 '규정된 몫'을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: She rises
  chosen_korean: 일어나
  alternatives_korean:
  - 일어납니다
  - 깨어 일어납니다
  lexicon: HALOT
  rationale: 지혜문학의 반복적 행위를 자연스럽게 살리기 위해 현재형 서술로 옮기되, 동작의 즉시성을 유지했습니다.
