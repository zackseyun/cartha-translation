  yaml_path: translation/ot/proverbs/031/015.yaml
  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
  footnotes:
  - marker: a
    text: Or 'and an assigned share to her maidservants.' The Hebrew word for 'portions' can also mean a prescribed due or fixed allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 아직 밤일 때에 일어나 자기 집안에는 먹을 것을 주고 여종들에게는 몫을 줍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여종들에게 정해진 몫을 준다.’ 히브리어 חֹק은 ‘정해진 할당분’이나 ‘규정된 몫’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
