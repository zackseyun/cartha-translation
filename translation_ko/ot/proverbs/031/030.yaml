id: PRO.31.30
reference: Proverbs 31:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
  footnotes:
  - marker: a
    text: Or, more literally, 'beauty is vapor'; the Hebrew image can emphasize transience as well as emptiness.
    reason: lexical_alternative
  - marker: b
    text: Or 'a wife'; the Hebrew אִשָּׁה can mean either 'woman' or 'wife' depending on context.
    reason: alternative_reading
  - marker: c
    text: Or 'may praise herself' if taken reflexively, though the context strongly favors 'shall be praised.'
    reason: alternative_reading
translation:
  language: ko
  text: 매력은 속이는 것이고, 아름다움은 덧없습니다. 그러나 야훼를 경외하는 여인은 칭송받을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘아름다움은 증기’입니다. 히브리어 이미지는 덧없음과 공허함을 함께 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아내’일 수 있습니다. 히브리어 אִשָּׁה는 문맥에 따라 ‘여자’ 또는 ‘아내’를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 반사적으로 이해하면 ‘스스로 칭송할 것입니다’가 될 수 있으나, 문맥은 ‘칭송받을 것입니다’를 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: deceitful
  chosen_korean: 속이는 것
  alternatives_korean:
  - 거짓된
  - 기만적인
  - 속임수
  lexicon: HALOT
  rationale: שֶׁקֶר는 ‘거짓/속임’의 뜻이므로, ‘매력은 속이는 것’이라고 풀어 말하면 속성 판단을 자연스럽게 살리면서도 원문의 평가를 보존합니다.
- source_word: הֶבֶל
  english_pob_choice: fleeting
  chosen_korean: 덧없는
  alternatives_korean:
  - 헛된
  - 허무한
  - 입김 같은
  - 연기 같은
  lexicon: HALOT
  rationale: הֶבֶל은 본래 ‘입김/증기’의 이미지에서 온 말로 덧없음과 허무함을 함께 담습니다. 여기서는 아름다움의 소멸성을 강조하는 ‘덧없는’이 가장 적절합니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 여인
  alternatives_korean:
  - 여자
  - 아내
  lexicon: HALOT
  rationale: 지혜문학의 일반 진술이므로 관계적 의미를 특정하는 ‘아내’보다 일반적 인물 지시를 살리는 ‘여인’이 문맥에 맞습니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: who fears Yahweh
  chosen_korean: 야훼를 경외하는
  alternatives_korean:
  - 야훼를 두려워하는
  - 여호와를 경외하는
  - 야훼 경외의
  lexicon: HALOT
  rationale: יִרְאַת יְהוָה는 지혜의 핵심 표지인 ‘야훼 경외’를 가리키므로, 현대 한국어에서는 관형절로 풀어 ‘야훼를 경외하는’이 가장 분명합니다.
- source_word: תִתְהַלָּל
  english_pob_choice: shall be praised
  chosen_korean: 칭송받을 것입니다
  alternatives_korean:
  - 찬양받을 것입니다
  - 스스로 자랑할 것입니다
  - 자랑스러워할 것입니다
  lexicon: HALOT
  rationale: 히트파엘은 반사적 의미 가능성도 있으나, 앞의 대조와 문맥상 이 여인이 칭찬의 대상이 된다는 뜻이 자연스럽습니다. ‘칭송받을 것입니다’는 그 수동적 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 야훼 신명(יהוה)이 직접 나오므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 이름을 보존합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
