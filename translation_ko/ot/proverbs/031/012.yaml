  to: 그녀는 평생토록 그에게 선을 행하고 해를 끼치지 않습니다.[a]
  rationale: 여성 단수 주어를 바로잡고, 시간구를 자연스러운 현대 한국어로 재배치했습니다. ‘선을 행하고’는 원문의 ‘좋음’을 목적어로 유지하면서도 ‘선을 베풀다’보다 자선 행위의 뉘앙스를 덜어 관계적 대조를 충실히 드러냅니다. 각주는 גמל의 ‘보답하다’라는 가능한 의미를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:08Z'
