translation:
  language: ko
  text: 그녀는 평생토록 그에게 선을 행하고 해를 끼치지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 선으로 보답하고 해를 끼치지 않습니다.’ 히브리어 동사는 누군가를 대하거나 보답한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  english_pob_choice: does him good
  chosen_korean: 그에게 선을 베풀고
  alternatives_korean:
  - 그를 잘 대하고
  - 그에게 보답하고
  - 그에게 은혜를 갚고
  lexicon: HALOT
  rationale: גמל은 ‘대하다, 갚다, 보답하다’의 뜻을 가질 수 있지만, 여기서는 ‘good’과 ‘not harm’이 병렬이므로 관계 속에서 ‘선을 베풀다’로 옮기면 보상 행위로 과도하게 좁히지 않으면서 원문의 동사를 살릴 수 있습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선을
  alternatives_korean:
  - 좋은 것
  - 유익
  - 선
  lexicon: HALOT
  rationale: טוֹב는 여기서 동사 뒤의 목적어처럼 쓰여 ‘좋음/선’의 실체를 가리키므로, 한국어에서는 간결하게 ‘선’을 써서 대구를 유지했습니다.
- source_word: וְלֹא רָע
  english_pob_choice: and not harm
  chosen_korean: 해를 끼치지 않으며
  alternatives_korean:
  - 악을 행하지 않으며
  - 나쁜 일을 하지 않으며
  - 해를 주지 않으며
  lexicon: HALOT
  rationale: רָע는 여기서 추상적 ‘악’보다 관계적·실질적 ‘해’의 뜻이 자연스러우므로, 한국어에서는 결과적 표현인 ‘해를 끼치지 않으며’로 옮겼습니다.
- source_word: כֹּל יְמֵי חַיֶּיהָ
  english_pob_choice: all the days of her life
  chosen_korean: 그녀의 생애의 모든 날 동안
  alternatives_korean:
  - 그녀의 평생 동안
  - 그녀의 생애 동안
  - 그가 사는 모든 날 동안
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 그대로 살리기 위해 ‘모든 날 동안’ 구조를 유지했고, חַיִּים은 사람의 생애를 가리키는 관용법이므로 ‘생애’가 가장 직접적입니다.
theological_decisions:
- issue: 잠언의 일반 지혜 진술을 도덕적 명령으로 과도하게 재구성하지 않는 문제
  chosen_reading: 이 절은 이상적인 아내의 지속적 행위를 묘사하는 지혜 문장으로 읽고, 서술적 현재를 살렸습니다.
  alternative_readings:
  - 명령문처럼 들리게 옮기는 읽기
  - 미래 약속처럼 옮기는 읽기
  rationale: 원문은 묘사적 진술이며, 히브리 시의 병행법을 유지하는 것이 독자가 지혜 문장의 성격을 이해하는 데 도움이 됩니다.
  doctrine_reference: 잠언 31장 문맥의 지혜시/칭송시 성격
