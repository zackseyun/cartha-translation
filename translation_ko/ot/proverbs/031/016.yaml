  yaml_path: translation/ot/proverbs/031/016.yaml
  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
  footnotes:
  - marker: a
    text: Or 'plans for a field and takes it'; the Hebrew verbs can be rendered more literally, but the main text aims for natural English while preserving the sense of deliberate economic action.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'from the fruit of her hands,' an idiom for the yield or proceeds of her labor.
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 밭을 살펴보고 그것을 얻으며[a], 자기 손의 소산으로[b] 포도원을 심습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭을 계획하여 그것을 취한다.’ 히브리어 동사는 더 문자적으로 옮길 수 있으나, 여기서는 의도적으로 숙고하여 경제적 행동을 하는 뜻을 자연스럽게 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그녀의 손의 열매’라고 말합니다. 이는 그녀의 노동으로 얻은 수확이나 소산을 가리키는 관용적 표현입니다.
    reason: cultural_note
