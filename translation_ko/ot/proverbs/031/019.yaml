  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֭דֶי/הָ שִׁלְּחָ֣ה בַ/כִּישׁ֑וֹר וְ֝/כַפֶּ֗י/הָ תָּ֣מְכוּ פָֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/019.yaml
  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
  footnotes:
  - marker: a
    text: Or 'She puts her hands to the distaff, and her palms grasp the spindle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 손을 방적대에 뻗고, 손바닥으로 방추를 잡습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 방적대는 실을 잣기 전 섬유를 걸어 두는 막대이다. 또는 ‘그녀는 손을 방적대에 대고, 손바닥으로 방추를 붙잡습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיהָ
  english_pob_choice: her hands
  chosen_korean: 손을
  alternatives_korean:
  - 두 손을
  - 그녀의 손을
  lexicon: HALOT
  rationale: 히브리어 쌍수형에 3인칭 여성 단수 소유격이 붙어 있으므로, 한국어에서는 자연스러운 복수 감각의 ‘손’을 쓰되, 소유는 문맥상 생략해도 됩니다.
- source_word: שִׁלְּחָה
  english_pob_choice: stretches out
  chosen_korean: 뻗으며
  alternatives_korean:
  - 내밀며
  - 펴며
  - 뻗습니다
  lexicon: HALOT
  rationale: 동작의 의도성과 물건을 향한 팔의 확장을 살리기 위해, 단순한 ‘손을 대다’보다 ‘뻗다’가 원문의 힘을 더 잘 반영합니다.
- source_word: בַכִּישׁוֹר
  english_pob_choice: to the distaff
  chosen_korean: 물레방아채로
  alternatives_korean:
  - 물레채로
  - 방추받이로
  - 물레로
  lexicon: HALOT
  rationale: כִּישׁוֹר는 방적 도구를 가리키므로, 한국어에서 기능을 드러내는 도구명으로 옮겼습니다. 다만 현대어 대응어가 일정하지 않아 주석 여지를 남깁니다.
- source_word: וְכַפֶּיהָ
  english_pob_choice: and her palms
  chosen_korean: 손바닥은
  alternatives_korean:
  - 손바닥을
  - 그녀의 손바닥은
  - 손은
  lexicon: HALOT
  rationale: כַּף는 손바닥/손의 오목한 부분을 가리키므로, 앞절의 ‘손’과 평행을 이루면서도 더 구체적인 ‘손바닥’을 유지했습니다.
- source_word: פָלֶךְ
  english_pob_choice: the spindle
  chosen_korean: 물레를
  alternatives_korean:
  - 방추를
  - 물레축을
  - 실패를
  lexicon: HALOT
  rationale: פָלֶךְ는 방적 도구를 가리키며, 문맥상 손으로 붙드는 대상이므로 한국어에서는 기능상 가장 가까운 ‘물레’를 택했습니다. 다만 고대 도구의 정확한 형태는 불확실합니다.
theological_decisions:
- issue: 방적 도구를 한국어로 어떻게 옮길지
  chosen_reading: 고대의 구체적 도구 이미지를 살리되, 한국어 독자가 이해할 수 있도록 기능 중심의 도구명으로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘방추’와 ‘물레받이’로 구분할 수 있습니다.
  - 음역 없이 ‘물레채’처럼 설명적 표현을 사용할 수 있습니다.
  rationale: 이 절은 지혜로운 여인의 부지런함을 생활 작업의 구체적 이미지로 보여 주므로, 지나치게 현대적이거나 추상적인 표현은 피하는 것이 좋습니다.
  doctrine_reference: 잠언 31장의 지혜/덕행 묘사
- issue: 문장 성조
  chosen_reading: 서술은 평서형 합쇼체를 유지했고, 인물 묘사이므로 직접적 존대 호칭은 사용하지 않았습니다.
  alternative_readings:
  - 시적 문맥을 살려 종결을 더 압축할 수 있습니다.
  - 직설적인 현재형으로 바꿀 수 있습니다.
  rationale: 히브리 시의 병렬성과 관찰적 서술을 한국어 현대문체로 자연스럽게 살리기 위한 선택입니다.
  doctrine_reference: 문학적-수사적 재현 원칙
