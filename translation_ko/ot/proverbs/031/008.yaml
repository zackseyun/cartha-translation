  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
  footnotes:
  - marker: a
    text: Or 'for the rights/case of all who are destitute,' 'for all who are passing away,' or 'for all the sons of transience.' The Hebrew phrase is difficult, especially the rare noun חֲלוֹף.
    reason: lexical_alternative
translation:
  language: ko
  text: 말 못하는 이들을 위해, 모든 사라져 가는 이들의 권리를 위해 입을 여십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빈곤한 이들을 위해’, ‘모든 사라져 가는 이들을 위해’, ‘모든 전락하는 자들을 위해’. 히브리어 구절은 특히 희귀명사 חֲלוֹף 때문에 난해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  english_pob_choice: Open your mouth
  chosen_korean: 입을 여십시오
  alternatives_korean:
  - 당신의 입을 여십시오
  - 말을 꺼내십시오
  lexicon: HALOT
  rationale: 히브리어의 직설적 명령형과 신체 이미지를 살리되, 한국어에서는 ‘입을 여십시오’가 자연스럽고 권고의 힘을 유지합니다.
- source_word: לְאִלֵּם
  english_pob_choice: for the mute
  chosen_korean: 말 못하는 이들을 위해
  alternatives_korean:
  - 벙어리들을 위해
  - 말할 수 없는 이들을 위해
  lexicon: HALOT
  rationale: אִלֵּם은 말 못하는 상태를 가리키므로, 현대 한국어에서 비하 뉘앙스가 강한 표현은 피하고 의미를 직접 드러냈습니다.
- source_word: אֶל דִּין
  english_pob_choice: for the cause
  chosen_korean: 권리를 위해
  alternatives_korean:
  - 사건을 위해
  - 정의를 위해
  - 법적 다툼을 위해
  lexicon: HALOT
  rationale: dîn은 단순한 감정적 ‘사건’이 아니라 변호와 판정이 얽힌 법정적/권리 주장 맥락을 담으므로, 한국어에서는 공적 옹호를 드러내는 ‘권리’를 택했습니다.
- source_word: בְּנֵי חֲלוֹף
  english_pob_choice: all the passing away
  chosen_korean: 모든 사라져 가는 이들
  alternatives_korean:
  - 모든 지나가는 자들
  - 모든 유한한 자들
  - 모든 소멸해 가는 자들
  lexicon: HALOT
  rationale: 희귀명사 חֲלוֹף의 난해함을 반영하여, ‘사라져 가는’으로 전이되는/사라지는 상태를 살리고 사람을 가리키는 복수 표현으로 자연화했습니다.
theological_decisions:
- issue: 희귀어 חֲלוֹף의 해석 범위
  chosen_reading: ‘사라져 가는 이들’로 옮겨, 사회적으로 소외되거나 소멸해 가는 사람들을 포괄하는 넓은 의미를 유지했습니다.
  alternative_readings:
  - ‘빈곤한 이들’
  - ‘죽어 가는 이들’
  - ‘전혀 남지 못하는 자들’
  rationale: 본문 자체가 뜻이 분명치 않으므로, 한쪽 해석으로 고정하기보다 POB의 보류된 난해성을 한국어에서 그대로 남기는 것이 source-grounded합니다.
  doctrine_reference: 해석학적 보류와 본문 난해성 처리
- issue: אֶל דִּין의 법정적/권리 옹호 뉘앙스
  chosen_reading: ‘권리를 위해’로 옮겨, 약자를 대신해 변론하고 옹호하는 의미를 드러냈습니다.
  alternative_readings:
  - ‘정의를 위해’
  - ‘법적 사건을 위해’
  - ‘판결을 위해’
  rationale: 문맥상 단순한 추상적 정의보다 구체적 옹호의 행위가 핵심이므로, 한국어에서 가장 직접적으로 그 기능을 드러내는 표현을 선택했습니다.
  doctrine_reference: 지혜문학의 사회적 정의와 변호
