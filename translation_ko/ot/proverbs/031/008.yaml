  - 모든 소멸해 가는 자들
  lexicon: HALOT
  rationale: 희귀명사 חֲלוֹף의 난해함을 반영하여, ‘사라져 가는’으로 전이되는/사라지는 상태를 살리고 사람을 가리키는 복수 표현으로 자연화했습니다.
theological_decisions:
- issue: 희귀어 חֲלוֹף의 해석 범위
  chosen_reading: ‘사라져 가는 이들’로 옮겨, 사회적으로 소외되거나 소멸해 가는 사람들을 포괄하는 넓은 의미를 유지했습니다.
  alternative_readings:
  - ‘빈곤한 이들’
  - ‘죽어 가는 이들’
  - ‘전혀 남지 못하는 자들’
  rationale: 본문 자체가 뜻이 분명치 않으므로, 한쪽 해석으로 고정하기보다 POB의 보류된 난해성을 한국어에서 그대로 남기는 것이 source-grounded합니다.
  doctrine_reference: 해석학적 보류와 본문 난해성 처리
- issue: אֶל דִּין의 법정적/권리 옹호 뉘앙스
  chosen_reading: ‘권리를 위해’로 옮겨, 약자를 대신해 변론하고 옹호하는 의미를 드러냈습니다.
  alternative_readings:
  - ‘정의를 위해’
  - ‘법적 사건을 위해’
  - ‘판결을 위해’
  rationale: 문맥상 단순한 추상적 정의보다 구체적 옹호의 행위가 핵심이므로, 한국어에서 가장 직접적으로 그 기능을 드러내는 표현을 선택했습니다.
  doctrine_reference: 지혜문학의 사회적 정의와 변호
