translation:
  language: ko
  text: 말 못하는 이들을 위하여, 사라져 가는 모든 이들의 권리를 위하여 입을 여십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁핍한 모든 이들의 권리(또는 송사)를 위하여’, ‘사라져 가는 모든 이들의 송사를 위하여’, 또는 ‘무상함의 모든 자녀들의 송사를 위하여’. 히브리어 구절은 특히 희귀 명사 חֲלוֹף 때문에 난해합니다.
    reason: lexical_alternative
