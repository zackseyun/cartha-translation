  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּנוּ לָ֭/הּ מִ/פְּרִ֣י יָדֶ֑י/הָ וִֽ/יהַלְל֖וּ/הָ בַ/שְּׁעָרִ֣ים מַעֲשֶֽׂי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/031.yaml
  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
  footnotes:
  - marker: a
    text: Or 'at the city gates'—the gates were the public place of recognition, judgment, and honor in ancient Israelite society.
    reason: cultural_note
  - marker: b
    text: Or 'let her deeds praise her'; the Hebrew personifies her works as bearing public witness to her worth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀에게 그녀의 손의 열매를 주고, 그녀의 행위가 성문에서 그녀를 찬양하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성문에서’—성문은 고대 이스라엘 사회에서 공적 인정, 재판, 명예의 장소였습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그녀의 행위가 그녀를 찬양하게 하십시오’; 히브리어는 그녀의 행위를 의인화하여 공적으로 그녀의 가치를 증언하게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  english_pob_choice: Give
  chosen_korean: 주십시오
  alternatives_korean:
  - 주어라
  - 주시기 바랍니다
  lexicon: HALOT
  rationale: 복수 명령형의 직접적 요청을 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מִפְּרִי יָדֶיהָ
  english_pob_choice: of the fruit of her hands
  chosen_korean: 그녀의 손의 열매
  alternatives_korean:
  - 그녀의 손이 맺은 열매
  - 그녀의 손에서 난 열매
  lexicon: HALOT
  rationale: ‘손의 열매’라는 히브리어의 구체적 이미지와 수고의 결과라는 은유를 유지했습니다.
- source_word: וִיהַלְלוּהָ
  english_pob_choice: let her works praise her
  chosen_korean: 그녀의 행위가 … 찬양하게 하십시오
  alternatives_korean:
  - 그녀의 행위가 … 칭찬하게 하십시오
  - 그녀의 행위가 … 찬미하게 하십시오
  lexicon: HALOT
  rationale: 행위가 스스로 증언하는 의인법을 살리되, 한국어에서는 ‘찬양하다’로 공적 인정의 뉘앙스를 유지했습니다.
- source_word: בַשְּׁעָרִים
  english_pob_choice: in the gates
  chosen_korean: 성문에서
  alternatives_korean:
  - 문들에서
  - 도성의 성문에서
  lexicon: HALOT
  rationale: 고대 이스라엘에서 성문이 공적 인정과 재판의 장소라는 문화적 기능을 반영하는 가장 간결한 표현입니다.
theological_decisions:
- issue: 의인법으로 된 ‘행위’의 공적 증언
  chosen_reading: 그녀의 행위가 그녀를 찬양하게 하십시오
  alternative_readings:
  - 그녀의 행위를 사람들이 찬양하게 하십시오
  - 그녀의 업적이 그녀를 높이게 하십시오
  rationale: 본문은 사람들의 칭찬보다도 그녀의 행위 자체가 공적으로 증언하는 효과를 말하므로, 의인법을 유지하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 잠언의 지혜 문학적 의인법
