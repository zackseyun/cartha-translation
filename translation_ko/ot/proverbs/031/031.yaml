  source_fidelity: 히브리어의 복수 명령(תְּנוּ), 노동의 산물이라는 ‘손의 열매’의 비유, 행위가 주어가 되는 의인법, 그리고 공적 장소인 성문이라는 배경을 모두 유지했습니다. 다만 ‘찬양’은 한국어에서 예배·종교적 찬미를 강하게 연상시킬 수 있어, 여기의 공적 칭송 의미에는 ‘칭송’이 더 정확합니다.
  naturalness: 기존의 ‘그녀에게 그녀의 손의 열매를’은 소유 표현의 반복과 직역적 결합 때문에 다소 부자연스럽습니다. ‘그녀의 손으로 얻은 열매를 그녀에게’로 바꾸어 노동의 결실이라는 뜻을 자연스럽게 드러냈습니다. 두 명령은 문장으로 분리하여 합쇼체 명령의 병렬도 분명히 했습니다.
  terminology: ‘성문’은 원문의 문화적 배경을 보존하는 적절한 표현입니다. מַעֲשֶׂיהָ는 ‘그녀의 행위’로 유지하고, 의인화된 행위가 그녀를 공적으로 칭송한다는 뜻을 ‘칭송하게 하십시오’로 옮겼습니다.
