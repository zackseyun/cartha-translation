  terminology: ‘가난한 이’와 ‘궁핍한 이’는 각각 עָנִי와 אֶבְיוֹן에 적절하며, 특정 교파적 해석을 덧붙이지 않습니다. ‘손바닥’과 ‘손’의 구별도 원문의 כַּף와 יָד의 차이를 잘 반영합니다.
