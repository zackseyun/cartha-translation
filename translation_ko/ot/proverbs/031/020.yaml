  text: כַּ֭פָּ/הּ פָּרְשָׂ֣ה לֶ/עָנִ֑י וְ֝/יָדֶ֗י/הָ שִׁלְּחָ֥ה לָֽ/אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/020.yaml
  text: She opens her palm to the poor[b][a], and extends her hands to the needy.
  footnotes:
  - marker: a
    text: Or 'She spreads out her palm to the poor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'stretches out' or 'reaches out' for 'extends.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 가난한 이에게 손바닥을 펴고, 궁핍한 이에게 손을 내밉니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפָּהּ
  english_pob_choice: her palm
  chosen_korean: 손바닥
  alternatives_korean:
  - 손
  - 손바닥을
  lexicon: HALOT
  rationale: כַּף는 손의 ‘손바닥’ 또는 오목한 면을 가리키므로, 구체적인 이미지를 살리면서도 한국어로 자연스러운 ‘손바닥’이 적절합니다.
- source_word: פָּרְשָׂה
  english_pob_choice: opens
  chosen_korean: 펴고
  alternatives_korean:
  - 펼치고
  - 내밀고
  lexicon: HALOT
  rationale: ‘펴다’는 손바닥을 열어 보이는 동작을 자연스럽게 나타내며, 자비의 몸짓이라는 문맥을 잘 전달합니다.
- source_word: לֶעָנִי
  english_pob_choice: to the poor
  chosen_korean: 가난한 이에게
  alternatives_korean:
  - 가난한 자에게
  - 궁핍한 이에게
  lexicon: HALOT
  rationale: עָנִי는 가난하고 사회적으로 취약한 사람을 가리키므로, 현대 한국어에서는 포괄적이고 품위 있는 ‘가난한 이’가 알맞습니다.
- source_word: שִׁלְּחָה / לָאֶבְיוֹן
  english_pob_choice: extends ... to the needy
  chosen_korean: 손을 내밉니다
  alternatives_korean:
  - 손을 뻗습니다
  - 내어 줍니다
  - 뻗어 줍니다
  lexicon: HALOT
  rationale: ‘손을 내밀다’는 원문의 ‘손을 뻗어 돕는’ 의미를 자연스럽게 살리면서, 한국어에서 자비로운 도움의 동작을 분명하게 전달합니다. 두 번째 절구의 אֶבְיוֹן은 첫 절구의 עָנִי와 구별되는 ‘궁핍한 이’로 옮길 수 있지만, 문장 흐름상 ‘궁핍한 이’보다 ‘손을 내밉니다’가 동작 중심을 더 분명히 드러냅니다.
