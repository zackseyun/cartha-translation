  terminology: 고유명사는 한국어 성서 사용례와 원음에 무리 없는 ‘르무엘’로 통일합니다. מַשָּׂא의 본문 번역은 ‘예언’으로 유지하며, 대안 지명 표기는 ‘마싸’로 각주 처리합니다. ‘말씀들’보다 이 표제문에서는 집합적 의미의 ‘말씀’이 더 자연스럽습니다.
