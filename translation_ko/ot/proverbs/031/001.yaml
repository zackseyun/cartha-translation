  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּ֭בְרֵי לְמוּאֵ֣ל מֶ֑לֶךְ מַ֝שָּׂ֗א אֲֽשֶׁר יִסְּרַ֥תּ/וּ אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
  footnotes:
  - marker: a
    text: Or 'The words of King Lemuel of Massa, which his mother taught him.' The Hebrew מַשָּׂא can be read as 'oracle' or as the place-name 'Massa.'
    reason: alternative_reading
  - marker: b
    text: The verb can also mean 'disciplined' or 'instructed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀들입니다. 「므우엘 왕의 말씀, 곧 어머니가 그에게 가르친 예언입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마싸의 왕 므우엘의 말씀, 곧 그의 어머니가 그에게 가르친 것’으로도 읽을 수 있습니다. 히브리어 מַשָּׂא는 ‘예언’ 또는 지명 ‘마싸’로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 동사는 ‘훈계하다’ 또는 ‘징계하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말씀들
  alternatives_korean:
  - 말들
  - 언급들
  lexicon: HALOT
  rationale: 표제문으로서 דִּבְרֵי의 복수형을 자연스럽게 살리되, 한국어에서는 ‘말씀들’이 가장 직접적이고 문맥상 권위 있는 도입 표현입니다.
- source_word: לְמוּאֵל
  english_pob_choice: Lemuel
  chosen_korean: 므우엘
  alternatives_korean:
  - 레무엘
  - 르무엘
  lexicon: 고유명사 음역
  rationale: 히브리어 자음 לְמוּאֵל을 표준 음역으로 옮겼습니다. 익숙한 교회식 형태가 있지만, 원형에 더 가까운 음역을 우선했습니다.
- source_word: מַשָּׂא
  english_pob_choice: an oracle
  chosen_korean: 예언
  alternatives_korean:
  - 신탁
  - 마싸
  lexicon: HALOT
  rationale: 문맥상 어머니가 전한 교훈적 발화라는 점을 살려 ‘예언’으로 옮겼습니다. 지명 가능성은 본문 각주로 보존합니다.
- source_word: יִסְּרַתּוּ
  english_pob_choice: taught him
  chosen_korean: 가르친
  alternatives_korean:
  - 훈계한
  - 징계한
  - 훈련한
  lexicon: HALOT
  rationale: יסר의 의미 범위는 ‘훈계하다/가르치다/징계하다’까지 있지만, 여기서는 어머니가 아들에게 지혜를 전수하는 맥락이므로 ‘가르친’이 가장 정확합니다.
theological_decisions:
- issue: מַשָּׂא의 의미를 ‘예언’으로 본문에 둘지, 지명 가능성을 살릴지
  chosen_reading: 본문은 ‘예언’으로 읽되, 지명 ‘마싸’ 가능성은 각주로 남깁니다.
  alternative_readings:
  - 므우엘 왕의 마싸
  - 므우엘 왕의 신탁
  rationale: 마소라 모음은 ‘oracle’ 의미를 강하게 지지하지만, 자음만으로는 지명 해석도 가능하므로 본문과 각주를 분리해 긴장을 보존합니다.
  doctrine_reference: 본문 해석의 다의성 보존 원칙
