  text: Many daughters have done nobly[b][a], but you surpass them all.
  footnotes:
  - marker: a
    text: Hebrew 'daughters' can idiomatically refer more broadly to women or young women.
    reason: lexical_alternative
  - marker: b
    text: Or 'Many women have acted excellently, but you excel them all.' The Hebrew term for 'nobly' can also carry senses such as strength, valor, or excellence.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 딸들이[a] 훌륭하게[b] 행하였지만, 당신은 그들 모두보다 뛰어나십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '딸들'은 문맥상 넓게는 여성이나 젊은 여성들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘훌륭하게’에 해당하는 히브리어는 힘, 용맹, 탁월함의 뜻도 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת בָּנוֹת
  english_pob_choice: Many daughters
  chosen_korean: 많은 딸들
  alternatives_korean:
  - 많은 여자들
  - 많은 젊은 여성들
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 살리되, 한국어에서는 자연스럽게 복수 주어로 옮겼습니다. '딸들'은 원문 이미지를 보존하고, 넓은 의미의 여성 지칭 가능성은 각주로 처리하는 편이 더 투명합니다.
- source_word: עָשׂוּ חָיִל
  english_pob_choice: have done nobly
  chosen_korean: 훌륭하게 행하였지만
  alternatives_korean:
  - 능력 있게 행하였지만
  - 용맹하게 행하였지만
  - 탁월하게 행하였지만
  lexicon: HALOT
  rationale: חָיִל은 힘, 능력, 탁월함, 용맹을 아우르는 넓은 말이라 한국어 한 단어로 좁히기보다 행위의 질을 드러내는 부사구로 옮겼습니다. '훌륭하게'는 문맥상 미덕과 뛰어남을 함께 살립니다.
- source_word: עָלִית עַל כֻּלָּנָה
  english_pob_choice: you surpass them all
  chosen_korean: 그들 모두보다 뛰어나십니다
  alternatives_korean:
  - 그들 모두를 능가하십니다
  - 그들 모두 위에 계십니다
  - 그들 모두보다 높이 오르셨습니다
  lexicon: HALOT
  rationale: 문자적으로는 '올라가다'지만 비교 구문에서는 '능가하다/뛰어나다'의 뜻이 분명하므로 자연스러운 비교 표현으로 옮겼습니다. 합쇼체 종결을 유지해 시적 칭송의 높임을 드러냈습니다.
