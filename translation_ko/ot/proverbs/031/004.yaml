  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
  footnotes:
  - marker: a
    text: 'Or, more literally, ''nor for rulers: Where is strong drink?'' The Hebrew expression is terse and may depict rulers seeking intoxicating drink.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕들에게는, 르무엘이여, 왕들에게는 포도주를 마시는 것이, 통치자들에게는 독주를 탐하는 것이 마땅하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 더 문자적으로, ‘통치자들에게는: 독주가 어디 있는가?’ 히브리어 표현이 매우 압축되어 있어 통치자들이 독주를 찾는 장면으로도 이해할 수 있습니다.'
    reason: lexical_alternative
