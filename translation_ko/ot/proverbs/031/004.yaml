base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
  footnotes:
  - marker: a
    text: 'Or, more literally, ''nor for rulers: Where is strong drink?'' The Hebrew expression is terse and may depict rulers seeking intoxicating drink.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕들에게는, 르무엘이여, 왕들에게는 포도주를 마시는 것이 마땅하지 않으며, 통치자들에게는 독주를 탐하는 것도 마땅하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘통치자들에게는 “독주가 어디 있는가?”라고 하는 것.’ 히브리어 표현은 매우 압축되어 있으며, 통치자들이 독주를 찾거나 바라보는 것으로 이해할 수도 있습니다.
    reason: lexical_alternative
