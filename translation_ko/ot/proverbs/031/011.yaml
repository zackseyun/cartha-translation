  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֣טַח בָּ֭/הּ לֵ֣ב בַּעְלָ֑/הּ וְ֝/שָׁלָ֗ל לֹ֣א יֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/011.yaml
  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: ko
  text: 남편의 마음은 그 여인을 믿으며, 그는 이득이 모자라지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח ... לֵב
  english_pob_choice: trusts
  chosen_korean: 믿으며
  alternatives_korean:
  - 신뢰하며
  - 의지하며
  lexicon: בָּטַח
  rationale: 히브리어 בָּטַח의 핵심은 신뢰·안심의 뉘앙스이므로, 한국어에서는 문맥상 자연스러운 ‘믿다’ 계열로 옮기되 현재적 지속을 나타내는 연결형을 살렸습니다.
- source_word: בָּעְלָהּ
  english_pob_choice: her husband
  chosen_korean: 남편
  alternatives_korean:
  - 그의 남편
  - 그 남편
  lexicon: בַּעַל
  rationale: 소유격 접미사가 붙은 명사구는 관계를 분명히 하므로, 현대 한국어에서는 가장 자연스러운 호칭어인 ‘남편’으로 옮겼습니다.
- source_word: וְשָׁלָל
  english_pob_choice: gain
  chosen_korean: 이득
  alternatives_korean:
  - 소득
  - 노획물
  - 전리품
  lexicon: שָׁלָל
  rationale: 영어 POB가 본문을 ‘spoil’에서 ‘gain’으로 되돌린 점을 따라, 전쟁적 ‘전리품’보다 본문 전체의 가정적·경제적 맥락에 맞는 ‘이득’을 채택했습니다.
- source_word: לֹא יֶחְסָר
  english_pob_choice: will lack no
  chosen_korean: 모자라지 않을 것입니다
  alternatives_korean:
  - 부족하지 않을 것입니다
  - 모자라지 않게 될 것입니다
  lexicon: חָסֵר
  rationale: 결핍 부정 표현을 현대 한국어의 자연스러운 미래 부정으로 옮겨, ‘no gain’이 아니라 ‘결핍이 없음’을 분명히 했습니다.
theological_decisions:
- issue: וְשָׁלָל의 의미 범위
  chosen_reading: ‘이득’으로 옮겨 가정의 신뢰가 가져오는 실제적 유익을 드러냈습니다.
  alternative_readings:
  - 전리품
  - 노획물
  rationale: 문맥은 전쟁 약탈이 아니라 지혜로운 가정의 신뢰와 안정에 관한 것이므로, 원문의 확장된 의미 가능성을 살리되 한국어 독자에게 과도한 군사 이미지를 주지 않도록 했습니다.
  doctrine_reference: 잠언의 지혜 문학적 문맥
- issue: 성별 지시의 재현
  chosen_reading: ‘그 여인’보다 대명사를 보완하지 않고 ‘남편의 마음은 그 여인을 믿으며’로 자연스럽게 정리했습니다.
  alternative_readings:
  - 그의 아내를
  - 그 여자에게
  rationale: 히브리어는 여성 주인공에 대한 관계를 전제하므로, 한국어에서는 문맥이 보존되는 범위 안에서 과도한 반복 없이 읽기 자연성을 확보했습니다.
  doctrine_reference: 문맥적 지시어 재현 원칙
