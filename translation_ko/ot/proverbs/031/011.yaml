  source_fidelity: 초안의 ‘그는 이득이 모자라지 않을 것입니다’는 한국어 문법상 남편 자신이 모자라지 않다는 뜻으로 읽힐 수 있어, ‘그가 이득을 결코 부족하게 여기지 않을 것’이라는 לֹא יֶחְסָר의 목적어 관계를 충분히 드러내지 못합니다. 또한 בַּעְלָהּ는 본 절의 여성 주인공과의 혼인 관계를 가리키므로 ‘그 여인의 남편’과 ‘아내’로 명시하는 것이 정확합니다.
  naturalness: ‘그에게는 이득이 부족하지 않을 것입니다’는 한국어에서 결핍되지 않는 대상이 ‘이득’임을 분명히 하며, 합쇼체의 격식 있는 문체에도 자연스럽습니다.
  terminology: בָּטַח는 ‘신뢰하다’로, שָׁלָל은 이 문맥에서 군사적 ‘전리품’으로 한정하지 않고 ‘이득’으로 옮길 수 있습니다. 원문의 ‘마음’은 한국어에서 ‘마음으로’로 보존했습니다.
