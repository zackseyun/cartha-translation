  - 고운 베옷
  lexicon: HALOT
  rationale: סָדִין은 아마 재질의 물품이지만 문맥상 판매되는 완성품이므로, 원문의 상품성을 살리면서도 한국어에서 자연스러운 ‘세마포 옷’으로 옮겼습니다.
- source_word: וַתִּמְכֹּר
  english_pob_choice: and sells them
  chosen_korean: 팔고
  alternatives_korean:
  - 그리고 팝니다
