  rationale: 히브리어 연속 동작은 지혜시의 관습적 현재상으로 읽히므로, 한국어도 현재 서술형 ‘팔고’로 자연스럽게 표현했습니다.
- source_word: חֲגוֹר
  english_pob_choice: belts
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠끈
