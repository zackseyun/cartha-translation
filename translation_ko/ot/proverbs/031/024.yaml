  - 팔며
  lexicon: HALOT
  rationale: 히브리어 연속 동작은 지혜시의 관습적 현재상으로 읽히므로, 한국어도 현재 서술형 ‘팔고’로 자연스럽게 표현했습니다.
- source_word: חֲגוֹר
  english_pob_choice: belts
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠끈
  - 허리끈
  lexicon: HALOT
  rationale: 허리에 두르는 물건이라는 기본 의미를 유지하되, 직물·복식 맥락에서 지나치게 현대적이지 않은 표준어 ‘띠’를 선택했습니다.
- source_word: לַכְּנַעֲנִי
  english_pob_choice: to the merchant
  chosen_korean: 상인에게
  alternatives_korean:
  - 가나안 사람에게
  - 장사꾼에게
  - 무역상에게
  lexicon: HALOT
  rationale: 문맥상 민족 표지가 아니라 거래 대상을 가리키는 관용적 용법이므로, 의미를 드러내는 직업명 ‘상인’으로 옮겼습니다.
