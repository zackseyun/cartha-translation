  english_pob_choice: to the merchant
  chosen_korean: 상인에게
  alternatives_korean:
  - 가나안 사람에게
  - 장사꾼에게
  - 무역상에게
  lexicon: HALOT
  rationale: 문맥상 민족 표지가 아니라 거래 대상을 가리키는 관용적 용법이므로, 의미를 드러내는 직업명 ‘상인’으로 옮겼습니다.
