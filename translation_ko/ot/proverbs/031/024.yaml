translation:
  language: ko
  text: 그녀는 세마포 옷을 만들어 팔고, 상인에게 띠를 공급합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세마포 천’이나 ‘고운 세마포 옷’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘가나안 사람에게’이지만, 문맥상 여기서는 ‘상인에게’ 또는 ‘장사꾼에게’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘허리띠’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  english_pob_choice: linen garments
  chosen_korean: 세마포 옷
  alternatives_korean:
  - 세마포 천
