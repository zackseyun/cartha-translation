  text: Let him drink and forget his poverty[a], and remember his trouble no more.
  footnotes:
  - marker: a
    text: Or 'his toil' for 'his trouble'; the Hebrew can refer to labor, hardship, or misery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 마시고 자신의 가난[a]을 잊으며, 자신의 고난을 다시는 기억하지 못하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 수고’; 히브리어는 노동, 고난, 비참함을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  english_pob_choice: Let him drink
  chosen_korean: 마시고
  alternatives_korean:
  - 마시게 하십시오
  - 마시십시오
  lexicon: HALOT
  rationale: 문맥상 앞절들의 권면을 이어 받는 허용/권고의 뉘앙스이므로, 간결한 동사 연결로 처리해 명령적 흐름을 살렸습니다.
- source_word: רִישׁוֹ
  english_pob_choice: his poverty
  chosen_korean: 자신의 가난
  alternatives_korean:
  - 자신의 빈곤
  - 자신의 궁핍
  lexicon: HALOT
  rationale: רִישׁ는 가난한 상태를 가리키므로, 가장 직관적이고 직접적인 ‘가난’으로 옮겼습니다.
- source_word: וַעֲמָלוֹ
  english_pob_choice: his trouble
  chosen_korean: 자신의 고난
  alternatives_korean:
  - 자신의 수고
  - 자신의 괴로움
  - 자신의 고통
  lexicon: HALOT
  rationale: 이 어휘는 수고, 고역, 고난, 괴로움까지 아우를 수 있어, 여기서는 맥락상 단순 노동보다 짐이 되는 삶의 무게를 드러내는 ‘고난’이 더 적절합니다.
- source_word: לֹא יִזְכָּר עוֹד
  english_pob_choice: remember ... no more
  chosen_korean: 다시는 기억하지 못하게 하십시오
  alternatives_korean:
  - 더 이상 기억하지 않게 하십시오
  - 다시는 기억하지 않도록 하십시오
  lexicon: HALOT
  rationale: 부정과 ‘다시/더 이상’의 종결감을 살리기 위해, 완료된 금지처럼 들리는 표현보다 결과적·종결적 의미를 드러내는 문장으로 옮겼습니다.
