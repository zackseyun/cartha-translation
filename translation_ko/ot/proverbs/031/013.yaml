lexical_decisions:
- source_word: דָּרְשָׁה
  english_pob_choice: seeks
  chosen_korean: 찾고
  alternatives_korean:
  - 구하고
  - 찾아 구하고
  - 찾아 나서고
  lexicon: HALOT
  rationale: דרשׁ는 여기서 적극적으로 찾고 구하는 행동을 가리키므로, 문맥에 맞게 간결한 ‘찾고’로 옮겼습니다.
- source_word: צֶמֶר
  english_pob_choice: wool
  chosen_korean: 양털
  alternatives_korean:
  - 털
  - 양모
  lexicon: HALOT
  rationale: 지시 대상이 방직 재료이므로 ‘양털’이 ‘wool’의 자연스러운 한국어 대응이며, 원문의 재료성을 드러냅니다.
- source_word: וּפִשְׁתִּים
  english_pob_choice: flax
  chosen_korean: 아마
  alternatives_korean:
  - 삼
  - 린넨
  lexicon: HALOT
  rationale: פִשְׁתִּים은 식물/원재료인 아마를 가리키므로, 가공된 직물명보다 ‘아마’가 원문에 더 가깝습니다.
- source_word: בְּחֵפֶץ
  english_pob_choice: with willing
  chosen_korean: 기꺼운
  alternatives_korean:
  - 즐거운
  - 마음에 기쁜
  - 기쁜
  lexicon: HALOT
  rationale: חֵפֶץ는 기쁨, 즐거움, 의향, 자원함을 포함하므로, 손의 상태를 수식하는 말로는 ‘기꺼운’이 자원하고 즐거이 일하는 태도를 함께 담습니다.
theological_decisions:
- issue: 여성 주어의 능동성과 노동의 태도 표현
  chosen_reading: 그녀가 재료를 찾고 손으로 일하는 적극적이고 자원하는 모습으로 옮겼습니다.
  alternative_readings:
  - 더 중립적으로 '그녀는 양털과 아마를 구하며 손으로 일합니다.'
  - 더 정서적으로 '그녀는 양털과 아마를 찾아 기쁜 마음으로 일합니다.'
  rationale: 잠언 31장의 지혜로운 여인의 실천적 성실성을 살리되, 원문의 ‘찾다/하다/기꺼움’의 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 잠언 31장의 지혜와 근면에 대한 서술
