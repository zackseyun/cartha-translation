id: PRO.31.25
reference: Proverbs 31:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹז וְ/הָדָ֥ר לְבוּשָׁ֑/הּ וַ֝/תִּשְׂחַ֗ק לְ/י֣וֹם אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
  footnotes:
  - marker: a
    text: Or 'she laughs at the future'; literally, 'she laughs at a latter/last day.'
    reason: alternative_reading
translation:
  language: ko
  text: 힘과 위엄은 그의 옷이며, 그는 다가올 날들을 비웃습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미래를 비웃습니다’; 직역하면 ‘마지막/나중 날을 비웃습니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 능력
  lexicon: HALOT
  rationale: 지혜문맥에서 עֹז는 물리적 힘보다 내적 역량과 든든함을 가리키므로, 자연스럽고 간결한 한국어 ‘힘’이 가장 잘 맞습니다.
- source_word: הָדָר
  english_pob_choice: dignity
  chosen_korean: 위엄
  alternatives_korean:
  - 존귀
  - 품위
  - 장엄
  lexicon: HALOT
  rationale: 여성의 인격적 품격과 고귀한 태도를 가리키는 말로는 ‘위엄’이 가장 균형 있게 대응합니다.
- source_word: לְבוּשָׁהּ
  english_pob_choice: are her clothing
  chosen_korean: 은 그의 옷이며
  alternatives_korean:
  - 은 그의 의복이며
  - 은 그가 입는 옷이며
  lexicon: HALOT
  rationale: ‘옷’ 이미지를 그대로 살리되 한국어에서는 ‘A와 B는 그의 옷이다’보다 ‘A와 B는 그의 옷이며’가 더 자연스럽습니다.
- source_word: וַתִּשְׂחַק לְיוֹם אַחֲרוֹן
  english_pob_choice: she laughs at the days to come
  chosen_korean: 그는 다가올 날들을 비웃습니다
  alternatives_korean:
  - 그는 미래를 웃습니다
  - 그는 앞날을 웃어넘깁니다
  lexicon: HALOT
  rationale: שׂחק는 단순한 미소보다 ‘웃다/비웃다’의 생생한 뉘앙스를 가지므로, 두려움 없이 앞날을 대하는 태도를 살려 ‘비웃습니다’로 옮겼습니다.
theological_decisions:
- issue: לְיוֹם אַחֲרוֹן의 시간적 범위
  chosen_reading: 지혜문맥의 장래성으로 이해하여 ‘다가올 날들’로 번역했습니다.
  alternative_readings:
  - 종말론적 ‘마지막 날’
  - ‘미래’라는 더 일반적인 표현
  rationale: 잠언 31장은 종말론보다 일상적 삶의 지혜를 다루므로, 문맥상 미래에 대한 담대함을 한국어로 분명하게 드러냈습니다.
  doctrine_reference: 문맥 우선 원칙; 잠언의 지혜 담화는 종말론적 정밀화보다 현재적 삶의 태도를 강조합니다.
