id: PRO.31.9
reference: Proverbs 31:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּתַח פִּ֥י/ךָ שְׁפָט צֶ֑דֶק וְ֝/דִ֗ין עָנִ֥י וְ/אֶבְיֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
  footnotes:
  - marker: a
    text: Or 'Speak up, judge justly, and plead for the poor and needy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 입을 여십시오[a]. 공정하게 판결하고, 가난한 자와 궁핍한 자의 송사를 변호하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  english_pob_choice: Open your mouth
  chosen_korean: 입을 열어
  alternatives_korean:
  - 말을 꺼내십시오
  - 발언하십시오
  lexicon: WLC; HALOT
  rationale: 히브리어의 직설적인 관용구를 살리면서, 한국어에서는 자연스럽게 ‘입을 열어’로 옮겨 발언 촉구의 뉘앙스를 보존했습니다.
- source_word: שְׁפָט צֶדֶק
  english_pob_choice: judge righteously
  chosen_korean: 의롭게 판단하고
  alternatives_korean:
  - 공의롭게 판단하고
  - 정의롭게 판단하고
  lexicon: WLC; HALOT
  rationale: שׁפט의 사법적 의미를 유지하되, צֶדֶק을 부사적으로 받아 ‘의롭게’로 옮겨 righteousness와의 어휘 연결을 살렸습니다.
- source_word: וְדִין
  english_pob_choice: plead the cause of
  chosen_korean: 송사를 변호하십시오
  alternatives_korean:
  - 사건을 변호하십시오
  - 변론하십시오
  - 억울한 사정을 변호하십시오
  lexicon: WLC; HALOT
  rationale: דין은 여기서 단순 판단보다 소송·분쟁의 법정적 변론/변호를 가리키므로, 권리 없는 자를 위해 적극적으로 개입하는 뜻을 드러내는 ‘송사를 변호하다’로 옮겼습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 자와 궁핍한 자
  alternatives_korean:
  - 가난하고 궁핍한 자
  - 가난한 이들과 궁핍한 이들
  lexicon: WLC; HALOT
  rationale: 두 형용사를 병렬로 유지하여 어휘적 구분을 살렸고, עָנִי는 일반적으로 ‘가난한 자’, אֶבְיוֹן은 결핍·궁핍의 뉘앙스를 가진 ‘궁핍한 자’로 구별했습니다.
theological_decisions:
- issue: 지혜문학의 윤리적 명령을 법정적 언어로 살릴지 여부
  chosen_reading: 이 구절을 단순한 일반적 친절 권고가 아니라, 약자를 위해 말하고 판결하며 변호하라는 법정적·공적 책임의 명령으로 읽었습니다.
  alternative_readings:
  - 일반적 사회적 약자 배려의 권면으로 완화할 수 있음
  - ‘변호’보다 단순한 ‘도와주다’로 순화할 수 있음
  rationale: 원문 동사들(פתח, שׁפט, דין)과 병렬 구조가 공적 판단과 변론을 강하게 요구하므로, 이를 약화시키지 않고 그대로 드러내는 것이 본문의 힘에 더 충실합니다.
  doctrine_reference: 잠언 31:9의 공의와 약자 보호 윤리
- issue: ‘입을 열다’의 직역성과 자연스러움
  chosen_reading: 직역적 이미지인 ‘입을 열어’를 유지하되 한국어 문장 안에서 명령형으로 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘말을 하십시오’로 완전히 의역
  - ‘발언하십시오’로 공적 문체화
  rationale: 히브리어 관용구의 시각적 이미지를 보존해야 후기 해설 없이도 수사적 강조가 살아나므로, 이미지와 자연스러움 사이의 균형을 택했습니다.
  doctrine_reference: 성경 번역의 원문 이미지 보존 원칙
