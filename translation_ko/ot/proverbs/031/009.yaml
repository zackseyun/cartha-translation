  rationale: 첫 명령을 독립 문장으로 처리하여 히브리어의 강한 발화 촉구를 자연스럽게 살리고, 그 직후에 각주를 붙여 대안의 적용 범위를 분명히 했습니다. ‘공정하게 판결하고’는 צֶדֶק의 사법적 의미를 현대 한국어로 자연스럽게 표현합니다. 마지막 절은 가난하고 궁핍한 이들의 법적 사안을 위해 변론·옹호하라는 דין의 의미를 유지하기 위해 ‘송사를 변호하십시오’로 보존했습니다.
