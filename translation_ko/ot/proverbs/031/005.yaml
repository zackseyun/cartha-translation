  rationale: 경고의 접속사 פֶּן을 한국어의 ‘~하지 않도록 하십시오’로 옮겨 원문의 권고적 기능을 보존했습니다. משפט적 맥락의 דִּין은 ‘공의’로, 피엘 וִישַׁנֶּה의 부당한 변경은 ‘굽게 하다’로 표현했습니다. 두 주석의 표지를 해당 어구에 직접 붙였습니다.
