  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the sons of affliction,' an idiom for people who are suffering or oppressed.
    reason: lexical_alternative
  - marker: b
    text: Or 'forget the decree' / 'forget what is prescribed.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 술을 마시고 규정된 것을 잊어버리며, 모든 고통받는 이들의 정의를 왜곡할까 두렵습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘고통의 아들들’이며, 고통받거나 억압받는 사람들을 가리키는 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘규정’을 잊어버린다 / ‘정해진 것’을 잊어버린다.
    reason: alternative_reading
