    rationale: 한국어 ‘길을 내주다’는 보통 길을 비켜 주거나 통행권을 양보한다는 뜻입니다. 본문의 ‘ways’를 왕들을 멸망시키는 일에 관련시키는 경고로 이해하기 어렵게 만듭니다.
