source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לַ/נָּשִׁ֣ים חֵילֶ֑/ךָ וּ֝/דְרָכֶ֗י/ךָ לַֽ/מְח֥וֹת מְלָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
  footnotes:
  - marker: a
    text: Or 'Do not give your strength to women, nor your paths to what destroys kings.' The Hebrew can also be construed more abstractly, with 'destroy' expressed as a verbal noun ('destruction'/'ruin').
    reason: lexical_alternative
  - marker: b
    text: '''Strength'' may also include vigor, resources, or wealth, not only physical power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 힘을 여자들에게 주지 말고, 당신의 길을 왕들을 무너뜨리는 것에 내주지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너뜨리는 것’은 히브리어의 파괴 동사를 추상적으로 옮긴 것으로, ‘무너뜨리는 자들’처럼 인격화해서도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘힘’에는 체력만이 아니라 역량, 재원, 기력의 뜻도 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  english_pob_choice: Do not give
  chosen_korean: 주지 말고
  alternatives_korean:
  - 주지 마십시오
  - 내주지 말고
  lexicon: HALOT
  rationale: 부정 명령의 금지를 자연스러운 현대 한국어로 옮기면서, 뒤의 병렬 금지구문과 연결되도록 했습니다.
- source_word: לַנָּשִׁים
  english_pob_choice: to women
  chosen_korean: 여자들에게
  alternatives_korean:
  - 여인들에게
  - 아내들에게
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘נשים’을 과도하게 좁히지 않고 그대로 ‘여자들’로 옮겨, 본문의 일반적 경고를 유지했습니다.
- source_word: חֵילֶךָ
  english_pob_choice: your strength
  chosen_korean: 당신의 힘
  alternatives_korean:
  - 당신의 능력
  - 당신의 재력
  - 당신의 기력
  lexicon: HALOT
  rationale: חיל은 힘, 역량, 재산까지 포괄할 수 있어, 한국어에서는 문맥상 가장 넓게 잡히는 ‘힘’이 적절합니다.
- source_word: וּדְרָכֶיךָ לַמְחוֹת מְלָכִין
  english_pob_choice: or your ways to that which destroys kings
  chosen_korean: 당신의 길을 왕들을 무너뜨리는 것에
  alternatives_korean:
  - 당신의 길을 왕들을 파괴하는 것에
  - 당신의 길을 왕들을 멸망시키는 것에
  - 당신의 길을 왕들을 무너뜨리는 자들에게
  lexicon: HALOT
  rationale: דרך는 삶의 방식/행로를 가리키므로 ‘길’로 살렸고, המחות의 파괴력을 보존하기 위해 ‘무너뜨리는 것’으로 옮겼습니다. 인칭화하지 않고 사물화해 본문의 문법적 추상성을 유지했습니다.
theological_decisions:
- issue: 수신자 성별과 경고의 범위
  chosen_reading: 본절은 여성을 일반적으로 정죄하는 말이 아니라, 통치자의 힘을 약화시키는 관계적·도덕적 낭비에 대한 지혜 문장으로 읽었습니다.
  alternative_readings:
  - 특정한 외국인 아내나 왕의 다처제를 겨냥한 경고
  - 여성 일반에 대한 도덕적 비난
  rationale: 히브리어 본문은 실제로 ‘여자들’이라고 말하지만, 잠언의 의도는 여성 비난이 아니라 왕에게 주는 실천적 경고입니다. 한국어는 본문의 표현을 보존하되, 그 의미를 확장해 오독하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: לַמְחוֹת מְלָכִין의 문법적 성격
  chosen_reading: ‘왕들을 무너뜨리는 것’처럼 추상적·명사화된 파괴의 힘으로 옮겼습니다.
  alternative_readings:
  - 왕들을 무너뜨리는 자들
  - 왕들을 파괴하는 행위
  - 왕들을 멸망시키는 것
  rationale: 히브리어는 특정 인물을 지칭하기보다 파괴 자체를 가리키는 방향이 강하므로, 한국어에서도 주어를 덧붙여 뜻을 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
