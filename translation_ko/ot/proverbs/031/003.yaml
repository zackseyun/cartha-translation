- from: 당신의 힘을 여자들에게 주지 말고, 당신의 길을 왕들을 무너뜨리는 것에 내주지 마십시오.[a][b]
  to: 그대의 힘을 여자들에게 주지 마십시오.[b] 또 왕들을 멸망시키는 일에 그대의 길을 쓰지 마십시오.[a]
  rationale: 첫 금지 명령의 대상과 ‘힘’의 넓은 의미는 유지했습니다. 둘째 병렬구는 원문의 추상적 해석 가능성을 본문과 각주에 보존하면서, 한국어에서 오해되기 쉬운 ‘길을 내주다’를 ‘길을 쓰다’로 고쳐 삶의 행로·처신을 파괴적인 일에 사용하지 말라는 경고를 자연스럽게 전달했습니다. ‘그대’와 합쇼체를 사용하여 현대적이면서도 격식을 갖춘 성경 문체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 구절은 אַל תִּתֵּן לַנָּשִׁים חֵילֶךָ를 충실히 옮겼습니다. 그러나 ‘당신의 길을 왕들을 무너뜨리는 것에 내주지 마십시오’에서 ‘길을 …에 내주다’는 한국어에서 통행을 양보한다는 뜻으로 주로 이해되어, 히브리어의 ‘길/행로를 …에 주다’라는 비유적 병렬을 잘 전달하지 못합니다. לַמְחוֹת מְלָכִין은 ‘왕들을 멸망시키는 일’로 추상적으로 옮길 수 있으며, 이를 본문에 유지하되 각주에서 인격적 해석 가능성을 밝혀 두는 것이 적절합니다.
  naturalness: ‘여자들에게’와 ‘힘’은 현대 표준어로 자연스럽습니다. 다만 성경 문맥의 직접 호칭으로 쓰인 ‘당신의’는 현대 한국어에서 거리감 또는 대립적 뉘앙스를 낼 수 있어 ‘그대의’가 더 자연스럽고 문체에 맞습니다. 또한 두 금지 명령은 ‘주지 마십시오. 또 … 쓰지 마십시오’로 분리하면 병렬과 합쇼체가 선명해집니다.
  terminology: חֵיל은 ‘힘’으로 유지하고, 각주에서 역량·재원·기력을 포괄할 수 있음을 밝히는 것이 좋습니다. נשים은 원문의 복수와 비한정성을 보존하는 ‘여자들’이 적절합니다. מְלָכִין은 ‘왕들’로 유지합니다. ‘무너뜨리다’보다 왕권·왕의 파국이라는 문맥에서 ‘멸망시키다’가 מחה의 소멸·파괴 의미를 더 분명히 전달합니다.
