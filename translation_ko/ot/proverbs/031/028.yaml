id: PRO.31.28
reference: Proverbs 31:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָ֣מוּ בָ֭נֶי/הָ וַֽ/יְאַשְּׁר֑וּ/הָ בַּ֝עְלָ֗/הּ וַֽ/יְהַֽלְלָ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
  footnotes:
  - marker: a
    text: Or 'her sons rise up.' The Hebrew בָנֶיהָ can refer specifically to sons or more generally to children.
    reason: lexical_alternative
  - marker: b
    text: Or 'pronounce her blessed.' The Hebrew verb carries the sense of declaring someone fortunate or blessed.
    reason: lexical_alternative
translation:
  language: ko
  text: '그의 자녀들이 일어나 그녀를 복되다고 부릅니다[a]. 그의 남편도 그러하며, 그녀를 찬양합니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들이 일어납니다.’ 히브리어 בָנֶיהָ는 ‘아들들’로도, 더 일반적으로는 ‘자녀들’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָנֶיהָ
  english_pob_choice: her children
  chosen_korean: 그의 자녀들
  alternatives_korean:
  - 그의 아들들
  - 그의 자식들
  lexicon: HALOT
  rationale: בנים은 문맥상 아들들로도, 더 넓게 자녀로도 읽힐 수 있으므로, 가정 내 칭송 장면에 맞게 남녀를 모두 아우르는 ‘자녀들’로 옮겼습니다.
- source_word: וַיְאַשְּׁרוּהָ
  english_pob_choice: call her blessed
  chosen_korean: 복되다고 부릅니다
  alternatives_korean:
  - 복되다고 선언합니다
  - 행복하다고 부릅니다
  - 복을 빕니다
  lexicon: HALOT
  rationale: 이 동사는 누군가를 복되고 행복한 사람으로 ‘선언/평가하다’는 뜻이므로, 한국어에서는 자연스럽고 평가적 뉘앙스를 살리는 ‘복되다고 부릅니다’가 적절합니다.
- source_word: בַּעְלָהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그녀의 남편
  - 그의 주인
  lexicon: HALOT
  rationale: בעל은 다른 문맥에서 소유주를 뜻할 수 있으나, 여기서는 가정 맥락의 인칭 접미사와 함께 ‘남편’이 분명하므로 직역 가능한 보통 표현을 택했습니다.
- source_word: וַיְהַלְלָהּ
  english_pob_choice: he praises her
  chosen_korean: 그녀를 찬양합니다
  alternatives_korean:
  - 그녀를 칭찬합니다
  - 그녀를 높이 찬미합니다
  lexicon: HALOT
  rationale: הלל은 ‘찬양하다/찬미하다’의 기본 뜻이므로, 공적 칭송의 울림을 유지하는 ‘찬양합니다’로 옮겼습니다.
