id: PRO.31.23
reference: Proverbs 31:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
  footnotes:
  - marker: a
    text: '''In the gates'' refers to the public place where civic, legal, and communal matters were conducted.'
    reason: cultural_note
  - marker: b
    text: Or 'is respected' / 'is recognized.' The Hebrew says literally 'is known.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 남편은 성문에서 알려집니다[a][b] — 그가 그 땅의 장로들 가운데 앉아 있을 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 시민·법정·공동체의 공적 일이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘알려집니다’는 직역적 의미를 살린 표현이며, 문맥상 ‘존중받습니다’나 ‘인정받습니다’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  english_pob_choice: is known
  chosen_korean: 알려집니다
  alternatives_korean:
  - 알려져 있습니다
  - 존중받습니다
  - 인정받습니다
  lexicon: HALOT
  rationale: ידע의 니팔은 ‘알려지다/알려지다’의 상태를 나타내므로, 사회적 명예를 지나치게 특정하지 않으면서도 문맥상의 공적 인지성을 살렸습니다.
- source_word: בַּשְּׁעָרִים
  english_pob_choice: in the gates
  chosen_korean: 성문에서
  alternatives_korean:
  - 문들에서
  - 도성의 문에서
  - 성문 안에서
  lexicon: HALOT
  rationale: שערים의 문자적 이미지를 유지하되, 잠언의 문맥상 시민·재판·공적 활동의 장소라는 뜻이 드러나도록 ‘성문’으로 옮겼습니다.
- source_word: זִקְנֵי אָרֶץ
  english_pob_choice: the elders of the land
  chosen_korean: 그 땅의 장로들
  alternatives_korean:
  - 그 나라의 장로들
  - 땅의 장로들
  - 그 지역의 원로들
  lexicon: HALOT
  rationale: ארץ를 ‘땅’으로 보존하여 본문의 넓은 어휘 범위를 유지했고, זקנים은 연장자/원로의 공적 지도층을 가리키므로 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: 공적 인정과 명예의 정도를 어떻게 표현할지
  chosen_reading: ‘알려집니다’로 옮겨, 본문이 보장하는 공적 인지성을 드러내되 과도한 도덕적 칭송으로 좁히지 않았습니다.
  alternative_readings:
  - 존중받습니다
  - 인정받습니다
  rationale: 히브리어 נוֹדָע는 기본적으로 ‘알려지다/인식되다’의 상태를 뜻하며, 문맥상 명예가 함축되지만 본문 자체는 그보다 넓은 공적 가시성을 말합니다.
  doctrine_reference: 잠언 31장 문맥의 지혜문학적 관찰
