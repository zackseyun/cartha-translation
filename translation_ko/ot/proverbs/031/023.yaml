  naturalness: 초안의 ‘그가 그 땅의 장로들 가운데 앉아 있을 때입니다’는 앞 절에 독립적으로 이어져 한국어 문장 연결이 다소 부자연스럽습니다. ‘그가 그 땅의 장로들과 함께 앉을 때’로 고치면 현대 표준어 합쇼체 문장으로 자연스럽고 간결합니다.
