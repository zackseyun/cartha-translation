  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּ֭י/הָ פָּתְחָ֣ה בְ/חָכְמָ֑ה וְ/תֽוֹרַת חֶ֝֗סֶד עַל לְשׁוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
  footnotes:
  - marker: a
    text: Or 'the law of kindness is on her tongue.' The Hebrew תּוֹרָה can mean 'law,' but here likely refers more broadly to instruction or teaching.
    reason: lexical_alternative
  - marker: b
    text: Or 'steadfast love,' 'mercy,' or 'faithful love' for 'kindness' (חֶסֶד), depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 지혜로 입을 열고, 친절의 가르침이 그녀의 혀에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 혀 위에는 친절의 법이 있습니다.’ 히브리어 תּוֹרָה는 ‘율법’도 뜻할 수 있지만, 여기서는 더 넓게 ‘가르침/교훈’의 뜻일 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘인애,’ ‘자비,’ ‘신실한 사랑’으로도 옮길 수 있습니다. 히브리어 חֶסֶד의 의미 범위는 문맥에 따라 달라집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּתְחָה בְחָכְמָה
  english_pob_choice: opens her mouth with wisdom
  chosen_korean: 지혜로 입을 열고
  alternatives_korean:
  - 지혜와 함께 입을 열고
  - 지혜롭게 입을 열고
  lexicon: HALOT
  rationale: 동사의 구체성을 살리되 한국어에서는 ‘입을 열다’가 관용적으로 발화 행위를 나타내므로 유지했습니다. בְחָכְמָה는 수단을 드러내는 ‘지혜로’로 옮겨 원문의 방식 의미를 보존했습니다.
- source_word: וְתוֹרַת
  english_pob_choice: the instruction of
  chosen_korean: 가르침이
  alternatives_korean:
  - 교훈이
  - 율법이
  lexicon: HALOT
  rationale: 지혜문맥의 תּוֹרָה는 모세 율법보다 ‘가르침/교훈’의 뜻이 강하므로, 법률적 뉘앙스를 피한 ‘가르침’이 원문 의도에 가깝습니다.
- source_word: חֶסֶד
  english_pob_choice: kindness
  chosen_korean: 친절의
  alternatives_korean:
  - 인애의
  - 자애의
  - 변함없는 사랑의
  lexicon: HALOT
  rationale: 이 절에서는 관계적·실천적 선의를 가리키므로, 한국어로는 가장 직접적인 ‘친절’이 자연스럽습니다. 다만 언약적 울림을 완전히 지우지 않도록 소유격 구조를 유지했습니다.
- source_word: עַל לְשׁוֹנָהּ
  english_pob_choice: is on her tongue
  chosen_korean: 그녀의 혀에 있습니다
  alternatives_korean:
  - 그녀의 혀 위에 있습니다
  - 그녀의 말에 있습니다
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지와 현재적 상시성을 살리기 위해 ‘혀에 있습니다’를 직역에 가깝게 유지했습니다. ‘말에 있습니다’는 의미는 자연스럽지만 원문 이미지를 약화시킵니다.
theological_decisions:
- issue: תּוֹרָה의 범위
  chosen_reading: 지혜문학 맥락의 일반적 ‘가르침’으로 읽었습니다.
  alternative_readings:
  - 모세 율법으로 읽는 해석
  - 윤리 규범으로 넓게 읽는 해석
  rationale: 잠언 31:26의 병행 구조와 지혜문학 문맥상, כאן의 תּוֹרָה는 제도적 율법보다 형성적 교훈을 뜻하는 것으로 보는 편이 더 자연스럽습니다.
  doctrine_reference: 지혜문학의 용례와 어휘 범주
