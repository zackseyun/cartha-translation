source:
  edition: WLC
  text: אַל תְּהִ֥י בְ/סֹֽבְאֵי יָ֑יִן בְּ/זֹלֲלֵ֖י בָשָׂ֣ר לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
  footnotes:
  - marker: a
    text: Or possibly, 'among those who gorge themselves on meat for themselves'; the final Hebrew term לָמוֹ is syntactically difficult and may add emphasis rather than a distinct new idea.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 포도주를 즐겨 마시는 자들과 함께하지 말며, 고기를 탐하는 자들과도 함께하지 마십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들을 위해 고기를 탐하는 자들’로 볼 수도 있습니다. 마지막 히브리어 말 לָמוֹ는 통사적으로 어렵고, 별도의 새 뜻을 더하기보다 강조를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל + תְּהִי
  english_pob_choice: Do not be
  chosen_korean: 함께하지 말며
  alternatives_korean:
  - 되지 마십시오
  - 있지 마십시오
  - 무리하지 마십시오
  lexicon: HALOT
  rationale: אַל + היה는 단순 존재 금지라기보다 특정 부류와 어울려 그들 가운데 속하지 말라는 금지로 읽히므로, 한국어에서는 ‘함께하다’를 써서 소속·교제의 뉘앙스를 살렸습니다.
- source_word: בְסֹבְאֵי יָיִן
  english_pob_choice: among heavy drinkers of wine
  chosen_korean: 포도주를 즐겨 마시는 자들
  alternatives_korean:
  - 술에 빠진 자들
  - 과음하는 자들
  - 포도주를 많이 마시는 자들
  lexicon: HALOT
  rationale: סבא는 단순 음주가 아니라 과음·상습적 음주를 가리키므로, ‘즐겨 마시는’보다 강한 뉘앙스를 살리되 현대 한국어에서 자연스럽고 품위 있게 표현했습니다.
- source_word: בְזֹלֲלֵי בָשָׂר
  english_pob_choice: among gluttonous eaters of meat
  chosen_korean: 고기를 탐하는 자들
  alternatives_korean:
  - 고기를 탐식하는 자들
  - 고기를 게걸스럽게 먹는 자들
  - 육식을 탐하는 자들
  lexicon: HALOT
  rationale: זלל은 탐식·게걸스러움의 의미이므로 ‘탐하는’으로 압축해 한국어 문장 흐름을 살리고, ‘고기’는 여기서 문자적으로 meat를 가리키는 평이한 번역으로 유지했습니다.
- source_word: לָמוֹ
  english_pob_choice: possibly, 'for themselves' or an emphatic suffix
  chosen_korean: a주
  alternatives_korean:
  - for themselves에 해당하는 말
  - 해당 어미를 별도로 옮김
  lexicon: HALOT
  rationale: 마지막 לָמוֹ는 통사적으로 난해하고 별도의 새 의미를 추가하기보다 강조적 요소일 수 있으므로, 본문에는 자연스럽게 처리하고 각주에서 대안 독해를 밝혔습니다.
