source:
  edition: WLC
  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
  footnotes:
  - marker: a
    text: Or 'from a child' or 'from a youth.' The Hebrew noun can refer to a boy or young person more broadly; the main text keeps the masculine singular form of the proverb.
    reason: lexical_alternative
  - marker: b
    text: The proverb states that such correction is not, in itself, fatal; it should not be read as a blanket approval of abusive violence or as an absolute guarantee in every case.
    reason: cultural_note
translation:
  language: ko
  text: 소년에게서 훈육을 거두지 마십시오[a]. 네가 그를 막대기로 치더라도 그는 죽지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이에게서’ 또는 ‘청년에게서’로 옮길 수도 있습니다. 히브리어 명사는 소년이나 더 넓게는 젊은이를 가리킬 수 있지만, 본문은 잠언의 남성 단수 형식을 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 이 잠언은 이런 교정이 그 자체로 치명적이지 않다는 뜻을 말합니다. 이것을 학대적 폭력의 일반적 승인이나 모든 경우에 대한 절대적 보장으로 읽어서는 안 됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  english_pob_choice: Do not withhold
  chosen_korean: 거두지 마십시오
  alternatives_korean:
  - 멀리하지 마십시오
  - 아끼지 마십시오
  - 거절하지 마십시오
  lexicon: WLC/HALOT
  rationale: מנע의 핵심은 ‘막다/거두다/보류하다’로, 훈육을 주지 않는 상태를 자연스럽게 드러내기 위해 ‘거두지 마십시오’로 옮겼습니다.
- source_word: מִנַּעַר
  english_pob_choice: from a boy
  chosen_korean: 소년에게서
  alternatives_korean:
  - 어린아이에게서
  - 청년에게서
  - 어린이에게서
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 소년, 청년, 아이를 가리킬 수 있으나, 잠언의 가정적 훈육 장면과 남성 단수 형식을 살려 ‘소년’으로 번역했습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈육
  alternatives_korean:
  - 교정
  - 훈련
  - 책망
  lexicon: HALOT
  rationale: מוּסָר는 단순한 지시보다 교정적 훈련과 징계를 함께 포함하므로, 현대 한국어에서 그 결을 살릴 수 있는 ‘훈육’을 선택했습니다.
- source_word: בַשֵּׁבֶט
  english_pob_choice: with the rod
  chosen_korean: 막대기로
  alternatives_korean:
  - 지팡이로
  - 막대기로서
  - 회초리로
  lexicon: HALOT
  rationale: שֵׁבֶט는 문맥상 징계 도구를 뜻하지만, 한국어 ‘막대기’가 이미지와 직역성을 가장 무리 없이 전달합니다.
theological_decisions:
- issue: 잠언의 징계 진술을 어떻게 처리할지
  chosen_reading: 본문은 ‘치더라도 그는 죽지 않을 것입니다’라고 직설적으로 옮기되, 해석적 완화는 본문에 넣지 않았습니다.
  alternative_readings:
  - 그것이 그를 죽이지는 않을 것입니다
  - 그는 그것으로 죽지 않을 것입니다
  rationale: 히브리어는 단정적 격언 형태의 진술을 사용합니다. 현대 독자가 폭력의 정당화로 오해할 수는 있으나, 그 조정은 각주로 처리하고 본문은 원문의 힘을 유지하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
