translation:
  language: ko
  text: 옛 경계표를 옮기지 말며, 고아들의 밭에 들어가지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 경계를 옮기지 말며, 아버지 없는 자들의 밭에 들어가지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּ֭סֵּג
  english_pob_choice: move
  chosen_korean: 옮기지
  alternatives_korean:
  - 치우지
  - 이동시키지
  - 변경하지
  lexicon: HALOT
  rationale: 경계표를 제자리에서 ‘move’한다는 법적·재산권적 의미를 살려, 한국어에서는 ‘옮기다’로 간결하게 옮겼습니다.
- source_word: גְּבוּל עוֹלָ֑ם
  english_pob_choice: ancient boundary marker
  chosen_korean: 옛 경계표
  alternatives_korean:
  - 오래된 경계
  - 옛 경계선
  - 옛 경계표지
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘경계’보다 경계 위치를 표시하는 구체적 표지가 어울리므로 ‘경계표’로 옮기고, עוֹלָם은 시간적으로 ‘옛’으로 반영했습니다.
- source_word: בִשְׂדֵי
  english_pob_choice: the fields of
  chosen_korean: 고아들의 밭에
  alternatives_korean:
  - 고아들의 들에
  - 고아들의 토지에
  - 고아들의 농지에
  lexicon: HALOT
  rationale: 전치사 ב의 진입 의미를 살려 ‘…에 들어가지’와 호응하도록 ‘밭에’로 직역에 가깝게 옮겼습니다.
- source_word: יְתוֹמִים
  english_pob_choice: orphans
  chosen_korean: 고아들
  alternatives_korean:
  - 아버지 없는 자들
  - 부친 없는 자들
  lexicon: HALOT
  rationale: 히브리어는 아버지를 잃은 아이들을 가리키지만, 현대 한국어에서는 ‘고아들’이 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: 재산 경계 침범 금지의 경고를 얼마나 직접적으로 드러낼지
  chosen_reading: 경계표를 옮기지 말며, 고아들의 밭에 들어가지 마십시오.
  alternative_readings:
  - 옛 경계를 옮기지 말며, 고아들의 땅에 들어가지 마십시오.
  - 옛 경계표를 치우지 말며, 고아의 토지에 들어가지 마십시오.
  rationale: 지혜문학의 법적 경고를 약화하지 않기 위해 ‘경계표’와 ‘들어가지 마십시오’를 유지해 침범 행위를 분명히 드러냈습니다.
  doctrine_reference: 잠언 23:10의 사회적 정의와 약자 보호
