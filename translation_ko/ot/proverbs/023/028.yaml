  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַף הִ֭יא כְּ/חֶ֣תֶף תֶּֽאֱרֹ֑ב וּ֝/בוֹגְדִ֗ים בְּ/אָדָ֥ם תּוֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
  footnotes:
  - marker: a
    text: Or 'like a bandit.' The Hebrew term חֶתֶף is rare and difficult; some understand it more generally as violent seizure or sudden attack.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among man,' with אָדָם used generically for humanity; that is, she increases the treacherous among humankind.
    reason: lexical_alternative
translation:
  language: ko
  text: 정녕 그녀는 강도처럼 매복하고, 사람들 가운데서 배신자들을 더합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산적처럼’. 히브리어 חֶתֶף는 희귀하고 난해하여, 어떤 해석은 더 일반적으로 폭력적 탈취나 돌발적 습격의 뜻으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람 가운데서’입니다. 여기서 אָדָם은 집합적으로 인류를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 정녕
  alternatives_korean:
  - 또한
  - 심지어
  - 참으로
  lexicon: HALOT
  rationale: אַף는 여기서 단순한 접속이 아니라 강조의 부사적 용법이므로, 한국어에서는 앞 절을 힘주어 여는 ‘정녕’으로 옮겼습니다.
- source_word: כְּחֶתֶף
  english_pob_choice: like a robber
  chosen_korean: 강도처럼
  alternatives_korean:
