  - 산적처럼
  - 약탈자처럼
  lexicon: HALOT
  rationale: חֶתֶף은 희귀하고 난해하지만, ‘매복하다’와 결합할 때 폭력적 탈취자의 이미지를 가장 잘 살리는 것은 ‘강도’입니다.
- source_word: תֶּאֱרֹב
  english_pob_choice: lies in wait
  chosen_korean: 매복하고
  alternatives_korean:
  - 숨어 기다리고
  - 잠복하고
  - 매복하여
  lexicon: HALOT
  rationale: אָרב는 공격할 목적의 잠복·매복을 뜻하므로, 동작성을 살리면서도 문장 흐름이 자연스러운 ‘매복하고’로 옮겼습니다.
- source_word: וּבוֹגְדִים
  english_pob_choice: the treacherous
  chosen_korean: 배신자들을
  alternatives_korean:
  - 간사한 자들을
  - 불신실한 자들을
  - 배반자들을
  lexicon: HALOT
  rationale: בוגדים는 단순한 감정적 비난보다 신의 없는 배반 행위를 가리키므로, 지혜문맥에 맞게 인격화된 복수형 ‘배신자들’을 택했습니다.
- source_word: בְּאָדָם
  english_pob_choice: among men
  chosen_korean: 사람들 가운데서
  alternatives_korean:
  - 인류 가운데서
  - 사람 가운데서
  - 사람들 사이에
  lexicon: HALOT
  rationale: אָדָם은 여기서 집합적 인간 일반을 가리키므로, 성별을 좁히지 않으면서도 보편성을 살리는 ‘사람들 가운데서’로 번역했습니다.
- source_word: תּוֹסִף
  english_pob_choice: increases
  chosen_korean: 더합니다
  alternatives_korean:
  - 늘립니다
  - 더해 줍니다
  - 증가시킵니다
  lexicon: HALOT
  rationale: יסף의 히필은 ‘더하다/늘리다’의 사역적 의미이므로, 한국어에서는 간결한 ‘더합니다’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: אָדָם의 포괄성
  chosen_reading: ‘사람들 가운데서’로 옮겨, 특정 성별이 아니라 인간 일반을 가리키는 포괄적 의미를 드러냈습니다.
  alternative_readings:
  - ‘남자들 가운데서’
  - ‘인류 가운데서’
  rationale: 문맥상 지혜문학의 일반화 표현이므로, 성별을 제한하는 표현은 피하면서도 원문의 집합적 뉘앙스를 유지하는 것이 적절합니다.
  doctrine_reference: 성경 번역의 포괄적 인간 지시어 처리 원칙
