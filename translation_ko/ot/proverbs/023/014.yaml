  terminology: ‘스올’은 히브리어 개념을 보존하는 적절한 음역입니다. נַפְשׁוֹ는 여기서 ‘생명’으로 옮기되 ‘영혼’이라는 어휘 대안을 각주에 남기는 것이 적절합니다. 각주 표지는 해당 낱말 바로 뒤에 배치해야 합니다.
