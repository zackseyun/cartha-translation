source:
  edition: WLC
  text: אַ֭תָּה בַּ/שֵּׁ֣בֶט תַּכֶּ֑/נּוּ וְ֝/נַפְשׁ֗/וֹ מִ/שְּׁא֥וֹל תַּצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
  footnotes:
  - marker: a
    text: Or 'his soul.' Hebrew nephesh can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 막대기로 그를 치십시오. 그러면 그의 생명[b]을 스올[a]에서 건져 낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 히브리어로 죽은 자들의 영역을 가리키는 말이며, ‘무덤’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명’은 히브리어 네페쉬의 문맥적 의미를 반영한 번역입니다. ‘영혼’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  english_pob_choice: with the rod
  chosen_korean: 채찍으로
  alternatives_korean:
  - 막대기로
  - 지팡이로
  - 몽둥이로
  lexicon: HALOT
  rationale: שֵׁבֶט은 막대기, 지팡이, 통치의 상징까지 넓게 가리키지만, 징계 문맥에서는 물리적 도구로서의 강한 감각을 살려 한국어로는 '채찍'이 가장 직접적입니다.
- source_word: תַּכֶּנּוּ
  english_pob_choice: you shall strike him
  chosen_korean: 그를 치십시오
  alternatives_korean:
  - 그를 치셔야 합니다
  - 그를 때리십시오
  - 그를 치십시오
  lexicon: HALOT
  rationale: נכה의 기본 의미를 살려 실제로 '치다'라고 옮겼고, 잠언의 권면체에 맞게 공손 명령형으로 처리했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 목숨
  - 그의 영혼
  - 그의 삶
  lexicon: HALOT
  rationale: 문맥상 스올과의 병렬이 죽음/구출의 의미를 이루므로, '생명'이 히브리어 נֶפֶשׁ의 'life' 감각을 가장 자연스럽게 반영합니다.
- source_word: מִשְּׁאוֹל
  english_pob_choice: from Sheol
  chosen_korean: 스올에서
  alternatives_korean:
  - 지옥에서
  - 무덤에서
  - 죽은 자들의 세계에서
  lexicon: HALOT
  rationale: 스올은 히브리어 고유 개념을 보존하는 것이 핵심이므로 음역 '스올'을 유지했습니다.
theological_decisions:
- issue: 징계의 목적과 구원 표현의 긴장
  chosen_reading: 물리적 징계가 생명을 보존하는 수단이라는 잠언적 진술로 읽고, '건져 주실 것입니다'로 구출 의미를 분명히 살렸습니다.
  alternative_readings:
  - 훈육의 은유로 완화하여 읽기
  - 영혼 구원으로 신학적으로 확장하기
  rationale: 본문은 도덕적·지혜문학적 권면으로서 실제 징계와 생명 보존을 병치합니다. 한국어도 이 긴장을 희석하지 않고 그대로 드러내는 것이 원문의 의도를 가장 잘 반영합니다.
  doctrine_reference: 지혜문학의 잠언적 인과관계는 신학 교리의 직접 진술로 과잉 확대하지 않습니다.
