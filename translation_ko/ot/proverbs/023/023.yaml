id: PRO.23.23
reference: Proverbs 23:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמֶ֣ת קְ֭נֵה וְ/אַל תִּמְכֹּ֑ר חָכְמָ֖ה וּ/מוּסָ֣ר וּ/בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/023.yaml
  text: Buy truth[a], and do not sell wisdom, instruction[c][b], and understanding.
  footnotes:
  - marker: a
    text: Or 'Acquire truth'; the Hebrew verb can mean 'buy' or more broadly 'acquire/get,' but the commercial imagery is likely intentional because of the following 'do not sell.'
    reason: lexical_alternative
  - marker: b
    text: '''Instruction'' may also be rendered ''discipline'' or ''correction.'''
    reason: lexical_alternative
  - marker: c
    text: '''Understanding'' may also be rendered ''discernment'' or ''insight.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 진리를 사라. 지혜와 훈계와 깨달음을 팔지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קְנֵה는 문자적으로 ‘사다’이지만, 넓게는 ‘획득하다/얻다’의 뜻도 가질 수 있습니다. 다만 뒤의 ‘팔지 마십시오’와 짝을 이루는 상업적 대비가 분명하므로 본문에는 ‘사라’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: מוּסָר는 ‘훈계’ 외에도 ‘훈련’, ‘징계’, ‘교정’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: בִינָה는 ‘깨달음’ 외에도 ‘이해’, ‘분별’, ‘통찰’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  - 진리성
  lexicon: HALOT
  rationale: 지혜 문맥에서 אֱמֶת는 단순 사실성보다 올바르고 신뢰할 만한 진실의 성격을 가리키므로, 한국어에서는 짧고 단호한 ‘진리’가 가장 자연스럽습니다.
- source_word: קְנֵה
  english_pob_choice: Buy
  chosen_korean: 사라
  alternatives_korean:
  - 획득하십시오
  - 얻으십시오
  - 사십시오
  lexicon: HALOT
  rationale: 뒤의 ‘팔지 마십시오’와 짝을 이루는 상업적 이미지를 살리기 위해 ‘사다’를 택했습니다. 합쇼체 명령으로는 어미만 조정해 ‘사라’가 본문의 압축성을 가장 잘 보존합니다.
- source_word: מוּסָר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 교훈
  - 징계
  - 교정
  lexicon: HALOT
  rationale: מוּסָר는 잠언에서 훈육·책망·교훈의 범위를 가지므로, 단순 정보 전달보다 삶을 바로잡는 성격을 드러내는 ‘훈계’가 적절합니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: בִינָה는 분별력과 이해를 아우르므로, 지혜·훈계와 함께 읽힐 때 자연스럽고 포괄적인 ‘깨달음’이 문맥상 가장 잘 맞습니다.
theological_decisions:
- issue: 본문의 명령형 어조를 한국어에서 어떻게 살릴지
  chosen_reading: 직접 명령형으로 ‘사라… 팔지 마십시오’라고 옮겨, 잠언 특유의 압축적 권면을 살렸습니다.
  alternative_readings:
  - ‘사십시오… 팔지 마십시오’처럼 완곡한 권고형으로 완화
  - 서술형으로 바꾸어 ‘진리를 사는 것이 낫습니다’처럼 의역
  rationale: 히브리어는 짧은 명령과 금지로 구성되어 있으므로, 한국어도 권면의 긴박함을 유지하는 편이 원문 충실성에 부합합니다.
  doctrine_reference: 잠언의 지혜 교훈 형식
- issue: 모든 항목을 한 번에 나열하는 병렬 구조를 유지할지
  chosen_reading: ‘지혜와 훈계와 깨달음’을 하나의 병렬 목록으로 유지했습니다.
  alternative_readings:
  - 쉼표를 늘려 설명적으로 풀어쓰기
  - ‘지혜, 훈계, 깨달음’ 대신 의미를 묶어 재구성
  rationale: 히브리어의 연속 접속 구조를 보존해야 세 단어의 균형과 강조가 유지됩니다.
  doctrine_reference: 히브리 시문의 평행법
