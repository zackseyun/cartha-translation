  rationale: 뒤의 ‘팔지 마십시오’와 짝을 이루는 상업적 이미지를 살리기 위해 ‘사다’를 택했습니다. 합쇼체 명령으로는 어미만 조정해 ‘사라’가 본문의 압축성을 가장 잘 보존합니다.
- source_word: מוּסָר
