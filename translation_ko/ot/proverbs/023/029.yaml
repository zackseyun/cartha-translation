  text: לְ/מִ֨י א֥וֹי לְ/מִ֪י אֲב֡וֹי לְ/מִ֤י מדונים לְ/מִ֥י שִׂ֗יחַ לְ֭/מִי פְּצָעִ֣ים חִנָּ֑ם לְ֝/מִ֗י חַכְלִל֥וּת עֵינָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'grief' for 'sorrow' (אֲבוֹי), preserving the lament-like nuance of the Hebrew cry.
    reason: lexical_alternative
  - marker: b
    text: Or 'without cause' for 'for nothing' (חִנָּם).
    reason: lexical_alternative
  - marker: c
    text: Or 'bloodshot eyes' for 'redness of eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 화를 당합니까? 누가 슬픔을 당합니까? 누가 다툼이 있습니까? 누가 불평합니까? 누가 까닭 없이 상처를 입습니까? 누가 눈이 충혈됩니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘슬픔을 당합니까?’는 אֲבוֹי의 탄식적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘까닭 없이’는 חִנָּם의 ‘for nothing’에 대한 번역으로, ‘없이/무고하게’의 뜻을 함께 포괄합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘눈이 충혈됩니까?’는 ‘눈의 붉음’에 대한 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/מִי א֥וֹי
  english_pob_choice: Who has woe?
  chosen_korean: 누가 화를 당합니까?
  alternatives_korean:
  - 누가 화가 있습니까?
  - 누가 재앙을 당합니까?
  lexicon: HALOT
  rationale: אָוֹי는 감탄사적 탄식이지만 이 질문 연쇄에서는 상태를 가리키는 표현으로 기능하므로, 한국어에서는 ‘화를 당하다’가 짧고 경구체의 압박감을 살립니다.
- source_word: אֲב֡וֹי
  english_pob_choice: Who has sorrow?
  chosen_korean: 슬픔을 당합니까?
  alternatives_korean:
  - 슬픔이 있습니까?
  - 근심이 있습니까?
  lexicon: HALOT
  rationale: 앞의 ‘화’와 구별하면서도 탄식의 뉘앙스를 유지하기 위해 ‘슬픔’을 택했습니다. ‘당하다’를 반복해 히브리어의 병렬적 물음을 살렸습니다.
- source_word: מדונים
  english_pob_choice: strife
  chosen_korean: 다툼이 있습니까?
  alternatives_korean:
  - 분쟁이 있습니까?
  - 쟁투가 있습니까?
  lexicon: HALOT
  rationale: מדון의 반복적 갈등을 드러내는 말로 ‘다툼’이 자연스럽고, 지혜문학의 짧은 목록형 문장에 잘 맞습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: 까닭 없이
  alternatives_korean:
  - 헛되이
  - 아무 이유 없이
  lexicon: HALOT
  rationale: ‘for nothing’의 무근거성·부당성을 한국어에서 가장 간결하게 살릴 수 있는 표현으로 보았습니다.
- source_word: חַכְלִל֥וּת עֵינָֽיִם
  english_pob_choice: redness of eyes
  chosen_korean: 눈이 충혈됩니까?
  alternatives_korean:
  - 눈이 붉어집니까?
  - 눈의 붉음이 있습니까?
  lexicon: HALOT
  rationale: 직역하면 ‘눈의 붉음’이지만, 문맥상 음주로 인한 눈 상태를 가리키므로 ‘충혈’이 원문의 관찰 가능한 상태를 더 자연스럽게 드러냅니다.
