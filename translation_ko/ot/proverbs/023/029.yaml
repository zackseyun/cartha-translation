  naturalness: ‘슬픔을 당하다’와 ‘누가 다툼이 있습니까?’는 현대 표준 한국어 합쇼체로 매끄럽지 않습니다. 모든 항목을 ‘누구에게 …이 있습니까?’로 통일하면 원문의 반복과 한국어 문법을 함께 살릴 수 있습니다.
