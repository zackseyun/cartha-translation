base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
  footnotes:
  - marker: a
    text: Or 'on the top of a mast.' The Hebrew חִבֵּל can refer to ship's tackle, ropes, or related nautical equipment; 'mast' reflects a traditional contextual interpretation.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 바다 한가운데에 누워 있는 사람 같고, 돛대[a] 꼭대기에 누워 있는 사람 같게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חִבֵּל은 밧줄이나 배의 장비를 가리킬 수도 있습니다. ‘돛대’는 문맥에 따른 전통적 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  english_pob_choice: And you will be
  chosen_korean: 그러면 당신은 … 같을 것입니다
  alternatives_korean:
  - 그리고 당신은 … 될 것입니다
  - 그러면 당신은 … 될 것입니다
  lexicon: HALOT
  rationale: 경고의 결과를 나타내는 2인칭 미래 뉘앙스를 살리되, 한국어에서는 ‘같을 것입니다’로 뒤의 두 비유를 자연스럽게 이끕니다.
- source_word: כְּשֹׁכֵב
  english_pob_choice: like one lying down
  chosen_korean: 누워 있는 사람 같
  alternatives_korean:
  - 누운 사람 같
  - 잠든 사람 같
  lexicon: HALOT
  rationale: שׁכב의 현재적 상태를 드러내기 위해 ‘누워 있는’으로 옮기고, 실제 수면으로 오해될 수 있는 ‘잠든’은 피했습니다.
- source_word: בְּלֶב יָם
  english_pob_choice: in the heart of the sea
  chosen_korean: 바다 한가운데에
  alternatives_korean:
  - 바다의 중심에
  - 바다 속에
  lexicon: HALOT
  rationale: לֵב의 직역인 ‘마음’보다 관용적으로 이해되는 ‘한가운데’가 의미를 분명히 전달하면서도 원문의 중심 이미지를 유지합니다.
- source_word: חִבֵּל
  english_pob_choice: the mast / the rigging (footnote)
  chosen_korean: 돛대
  alternatives_korean:
  - 돛대 장비
  - 밧줄
  lexicon: HALOT
  rationale: 항해 이미지에서 한국어로 가장 자연스럽고 전통적 해석과도 잘 맞는 기본어는 ‘돛대’입니다. 본문은 매달리거나 위험하게 올라간 위치를 살리기 위해 간결하게 처리했습니다.
