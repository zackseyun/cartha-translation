id: PRO.23.24
reference: Proverbs 23:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גול יגול אֲבִ֣י צַדִּ֑יק יולד חָ֝כָ֗ם ו/ישמח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/024.yaml
  text: The father of a righteous man will greatly rejoice[b][a]; he who fathers a wise son will be glad in him.
  footnotes:
  - marker: a
    text: Hebrew literally, 'The father of a righteous man, rejoicing he will rejoice.' The doubled verb intensifies the joy.
    reason: lexical_alternative
  - marker: b
    text: Or 'he who begets a wise one.' The Hebrew does not explicitly repeat 'son' in this line, though the filial sense is strongly implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 아버지는 크게 기뻐할 것이며[a], 지혜로운 아들을 둔 아버지는 그로 인해 기뻐할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘의인의 아버지는 기뻐하고 또 기뻐할 것이다’에 가깝습니다. 동사의 반복은 기쁨을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜로운 이를 둔 아버지는’. 히브리어는 이 행에서 ‘아들’을 명시하지 않지만, 부모와 자녀를 말하는 문맥상 그 뜻이 강하게 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גול יגול
  english_pob_choice: will greatly rejoice
  chosen_korean: 크게 기뻐하고
  alternatives_korean:
  - 기꺼이 기뻐하고
  - 크게 즐거워하고
  - 반드시 기뻐하고
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형 반복은 기쁨의 강도를 높이므로, 한국어에서는 반복을 그대로 옮기기보다 자연스러운 강도 표현인 ‘크게 기뻐하다’로 살렸습니다.
- source_word: אֲבִי צַדִּיק
  english_pob_choice: the father of a righteous man
  chosen_korean: 의인의 아버지는
  alternatives_korean:
  - 의로운 사람의 아버지는
  - 의인을 둔 아버지는
  - 의로운 자의 아버지는
  lexicon: HALOT
  rationale: 구문은 ‘의인 한 사람의 아버지’라는 소유 관계를 가리키므로, 한국어에서도 같은 관계를 간결하게 드러내는 ‘의인의 아버지’를 택했습니다.
- source_word: יולד חָכָם
  english_pob_choice: he who fathers a wise son
  chosen_korean: 지혜로운 아들을 낳는 이는
  alternatives_korean:
  - 지혜로운 아들을 낳는 사람은
  - 지혜로운 이를 낳는 이는
  - 지혜로운 아들을 둔 이는
  lexicon: HALOT
  rationale: 히브리어는 ‘아들’을 명시하지 않지만 문맥상 자녀-부모의 병행이 분명하므로, 영어 POB의 해석을 따라 ‘아들’을 보완하되 ‘낳는 이’로 동사의 뜻을 유지했습니다.
- source_word: וישמח בו
  english_pob_choice: will be glad in him
  chosen_korean: 그에게서 즐거워합니다
  alternatives_korean:
  - 그를 기뻐합니다
  - 그 안에서 즐거워합니다
  - 그로 인해 기뻐합니다
  lexicon: HALOT
  rationale: בו의 관계를 살리면서도 한국어에서 ‘~안에서’보다 자연스러운 감정의 대상/근거 표현인 ‘그에게서’로 옮겨, 아들을 기쁨의 근거로 드러냈습니다.
theological_decisions:
- issue: 지혜로운 아들을 낳는다는 표현의 적극성
  chosen_reading: ‘낳는 이는’로 옮겨, 출산보다 ‘아버지가 아들을 얻는 행위’에 초점을 둔 히브리어 관용을 살렸습니다.
  alternative_readings:
  - 아들을 낳는 사람은
  - 아들을 두는 이는
  rationale: 문맥상 부성의 기쁨을 말하는 속담이므로, 너무 생물학적으로 좁히지 않으면서도 본문이 말하는 친자 관계를 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학적 관용과 평행법
- issue: ‘의인의 아버지’와 ‘지혜로운 아들’의 평행 구조
  chosen_reading: 두 절 모두 아버지의 기쁨을 강조하는 평행 구조로 읽었습니다.
  alternative_readings:
  - 첫 절은 상태, 둘째 절은 원인
  - 둘째 절만이 기쁨의 원인을 명시
  rationale: 히브리어의 병행은 유사한 구조를 통해 의미를 증폭하므로, 두 절을 각각 독립 진술로 두기보다 기쁨의 강도와 원인을 함께 드러냈습니다.
  doctrine_reference: 히브리어 시가의 평행법
