  to: 의인의 아버지는 크게 기뻐할 것이며[a], 지혜로운 아들을 둔 아버지는 그로 인해 기뻐할 것입니다.[b]
  rationale: 히브리어의 강조와 미래 지향적 동사 형태를 한국어의 자연스러운 합쇼체로 반영했습니다. 특히 ‘낳는 이’가 낳는 여성으로 이해될 수 있는 문제를 피하면서, 남성 단수 participle 및 앞 행의 부성 문맥을 ‘아들을 둔 아버지’로 명확히 했습니다. 둘째 행의 ‘아들’ 보충은 유지하되, 원문에 명시되지 않았음을 각주에서 밝혔습니다.
