  - 청유형으로 바꾸는 번역
  rationale: 잠언의 지혜 권면을 현대 한국어에서 직접적이고 분명하게 전달하기 위해, 원문의 기원·권면 기능을 유지했습니다.
  doctrine_reference: 잠언의 교훈적·권면적 장르 특성
