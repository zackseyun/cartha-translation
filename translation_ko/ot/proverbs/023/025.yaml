  lexicon: HALOT
  rationale: גיל의 더 강한 기쁨을 반영해 ‘기뻐하다’로 옮기되, 앞 동사와는 한국어 어휘를 약간 달리해 반복을 줄였습니다.
- source_word: יוֹלַדְתֶּךָ
