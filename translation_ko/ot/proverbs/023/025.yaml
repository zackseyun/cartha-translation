lexical_decisions:
- source_word: יִשְׂמַח
  english_pob_choice: be glad
  chosen_korean: 즐거워하게 하십시오
  alternatives_korean:
  - 기뻐하게 하십시오
  - 즐겁게 하십시오
  lexicon: HALOT
  rationale: 첫 번째 동사 שׂמח의 권고·기원형 뉘앙스를 살려, 둘째 동사와 구별되도록 ‘즐거워하다’로 옮겼습니다.
- source_word: וְתָגֵל
  english_pob_choice: and let ... rejoice
  chosen_korean: 기뻐하게 하십시오
  alternatives_korean:
  - 환호하게 하십시오
  - 즐거워하게 하십시오
  lexicon: HALOT
  rationale: גיל의 더 강한 기쁨을 반영해 ‘기뻐하다’로 옮기되, 앞 동사와는 한국어 어휘를 약간 달리해 반복을 줄였습니다.
- source_word: יוֹלַדְתֶּךָ
  english_pob_choice: her who gave birth to you
  chosen_korean: 당신을 낳은 이
  alternatives_korean:
  - 당신을 낳은 어머니
  - 당신을 낳아 준 이
  lexicon: HALOT
  rationale: 직역하면 ‘당신을 낳은 자/사람’이지만, 현대 한국어에서 자연스럽고 성별 의미도 보존되도록 중립적으로 처리했습니다.
theological_decisions:
