  text: כִּֽי תֵ֭שֵׁב לִ/לְח֣וֹם אֶת מוֹשֵׁ֑ל בִּ֥ין תָּ֝בִ֗ין אֶת אֲשֶׁ֥ר לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
  footnotes:
  - marker: a
    text: Or, 'what is set before you.' The Hebrew may refer specifically to the food on the table, though it can also imply the broader situation before you.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 통치자와 함께 앉아 음식을 먹게 되면, 네 앞에 있는 것을 잘 헤아리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 앞에 차려진 것’. 히브리어는 식탁에 놓인 음식만 가리킬 수도 있지만, 더 넓게는 그 앞에 놓인 상황 전체를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: 네가 … 되면
  alternatives_korean:
  - 만일 …라면
  - …할 때
  lexicon: HALOT
  rationale: 지혜 문맥에서 상황을 여는 כִּי를 한국어 조건·상황절로 자연스럽게 옮겼습니다.
- source_word: תֵשֵׁב
  english_pob_choice: you sit down
  chosen_korean: 앉게 되면
  alternatives_korean:
  - 앉으면
  - 자리에 앉으면
  lexicon: HALOT
  rationale: 식사 자리의 동작을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ללחום
  english_pob_choice: to dine
  chosen_korean: 음식을 먹게
  alternatives_korean:
  - 식사하게
  - 먹게
  lexicon: HALOT
  rationale: 단순히 ‘먹다’보다 공식적인 식사 장면을 드러내는 말로 보되, 과도하게 격식화하지 않도록 조정했습니다.
- source_word: את אשר לפניך
  english_pob_choice: what is before you
  chosen_korean: 네 앞에 있는 것
  alternatives_korean:
  - 네 앞에 차려진 것
  - 네 앞에 놓인 것
  lexicon: HALOT
  rationale: 접시 위의 음식이라는 좁은 뜻과 앞에 놓인 상황이라는 넓은 뜻을 함께 살리기 위해 포괄적으로 번역했습니다.
theological_decisions:
- issue: 모שוֵל의 권위 호칭
  chosen_reading: 통치자
  alternative_readings:
  - 지배자
  - 관리
  - 군주
  rationale: מוֹשֵׁל은 단순한 신분명보다 권위를 행사하는 자를 가리키므로, 한국어에서 중립적이면서도 권력 관계를 드러내는 ‘통치자’가 적절합니다.
  doctrine_reference: 지혜문학의 현실적 권위 인식
- issue: 마지막 권면의 강도
  chosen_reading: 잘 헤아리십시오
  alternative_readings:
  - 세심히 분별하십시오
  - 유의하십시오
  rationale: 빈번한 도덕 훈계보다 원문이 요구하는 분별과 주의의 의미를 함께 살리는 존대 명령으로 처리했습니다.
  doctrine_reference: 지혜문학의 분별 촉구
