id: PRO.23.17
reference: Proverbs 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
  footnotes:
  - marker: a
    text: Or, 'Do not let your heart be jealous of sinners, but let it remain in the fear of the LORD all day long.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마음으로 죄인들을 부러워하지 마십시오.[a] 그러나 온종일 야훼를 경외하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 죄인들을 시기하지 않게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יְקַנֵּא לִבְּךָ
  english_pob_choice: Do not let your heart envy
  chosen_korean: 너의 마음이 … 부러워하지 않게 하십시오
  alternatives_korean:
  - 너의 마음이 … 시기하지 않게 하십시오
  - 네 마음에 … 질투가 없게 하십시오
  lexicon: HALOT
  rationale: יְקַנֵּא는 여기서 남의 형편을 탐내는 감정이므로, 한국어에서는 ‘부러워하다’가 가장 자연스럽고 문맥에 맞는 대응입니다. ‘마음’도 그대로 살려 내면의 성향을 드러냈습니다.
- source_word: בַּחַטָּאִים
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄 지은 사람들
  - 악인들
  lexicon: HALOT
  rationale: חַטָּאִים은 죄로 규정되는 사람들을 가리키므로, 짧고 직설적인 ‘죄인들’이 원문 범주를 잘 보존합니다.
- source_word: כִּי אִם
  english_pob_choice: but
  chosen_korean: 그러나
  alternatives_korean:
  - 오히려
  - 다만
  lexicon: HALOT
  rationale: 두 절의 대조 관계를 한국어에서 가장 자연스럽게 드러내는 접속어로 ‘그러나’를 택했습니다. 앞의 금지와 뒤의 권면을 선명하게 대비시킵니다.
- source_word: בְּיִרְאַת יְהוָה
  english_pob_choice: be in the fear of Yahweh
  chosen_korean: 야훼를 경외하십시오
  alternatives_korean:
  - 야훼를 두려워하십시오
  - 야훼를 경외하는 가운데 있으십시오
  lexicon: HALOT
  rationale: ‘야훼를 경외하다’는 지혜문학의 핵심 표현이므로 관용구를 유지했습니다. 영어의 ‘be in the fear of’는 한국어에서 어색하므로 동작 상태를 드러내는 합쇼체 권면으로 옮겼습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 늘
  lexicon: HALOT
  rationale: משך זמן을 나타내는 표현으로 ‘온종일’이 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 고유명사로서 야훼를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 역본의 기본 원칙에 따라 여호와나 대체 칭호 대신 신명기적 고유명사 ‘야훼’를 유지해 원문이 가진 이름의 직접성을 보존했습니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: 두 번째 절의 형태
  chosen_reading: ‘야훼를 경외하십시오’로 직접 권면형을 택했습니다.
  alternative_readings:
  - 야훼를 경외하는 가운데 있으십시오
  - 야훼를 두려워하는 상태에 있으십시오
  rationale: 히브리어는 생략된 서술 구조로 대조를 이루므로, 한국어에서는 불필요한 설명을 덧붙이지 않고 간명한 권면으로 재현하는 편이 원문에 더 가깝습니다.
  doctrine_reference: optimal equivalence; preserve source ellipsis
