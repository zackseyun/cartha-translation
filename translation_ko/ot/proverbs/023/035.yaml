id: PRO.23.35
reference: Proverbs 23:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִכּ֥וּ/נִי בַל חָלִיתִי֮ הֲלָמ֗וּ/נִי בַּל יָ֫דָ֥עְתִּי מָתַ֥י אָקִ֑יץ א֝וֹסִ֗יף אֲבַקְשֶׁ֥/נּוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
  footnotes:
  - marker: a
    text: Or 'They struck me, but I did not feel it; they beat me, but I was unaware.' The Hebrew verbs can be rendered with slightly different nuances of injury, pain, or awareness.
    reason: lexical_alternative
  - marker: b
    text: The pronoun in 'I will seek it again' most likely refers to wine or strong drink from the surrounding context.
    reason: cross_reference
translation:
  language: ko
  text: 그들이 나를 쳤으나, 나는 아프지 않았습니다. 그들이 나를 때렸으나, 나는 알지 못했습니다.[a] 내가 언제 깨어나겠습니까? 나는 그것을 다시 찾겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쳤으나/때렸으나’는 히브리어의 연속된 두 폭력 동사를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘그것’은 문맥상 술이나 독주를 가리키는 것으로 보는 해석이 가장 유력합니다.
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּ/נִי
  english_pob_choice: They struck me
  chosen_korean: 그들이 나를 쳤으나
  alternatives_korean:
  - 그들이 나를 때렸으나
  - 그들이 나를 치셨으나
  lexicon: HALOT
  rationale: נכה의 기본 의미는 치다/때리다이므로, 첫 번째 동사는 간결한 ‘쳤으나’로 옮겨 물리적 폭력을 자연스럽게 드러냈습니다.
- source_word: בַל חָלִיתִי
  english_pob_choice: but I was not hurt
  chosen_korean: 나는 상하지 않았고
  alternatives_korean:
  - 나는 아프지 않았고
  - 나는 다치지 않았고
  - 나는 병들지 않았고
  lexicon: HALOT
  rationale: חלה는 병들다/약해지다/상하다의 범위를 가지는데, 여기서는 구타를 받은 직후의 진술이므로 ‘상하지 않았고’가 가장 넓고 자연스럽습니다.
- source_word: הֲלָמוּ/נִי בַּל יָדָעְתִּי
  english_pob_choice: they beat me, but I did not know it
  chosen_korean: 나를 때렸으나 나는 그것을 알지 못했습니다
  alternatives_korean:
  - 나를 때렸으나 나는 느끼지 못했습니다
  - 나를 때렸으나 나는 알아차리지 못했습니다
  lexicon: HALOT
  rationale: 두 번째 동사는 첫째 동사와 어감을 구별해 ‘때렸으나’로 하고, ידע는 여기서 취중 무감각으로 인한 인식 부재를 나타내므로 ‘알지 못했습니다’가 원문 구조를 잘 살립니다.
- source_word: מָתַי אָקִיץ
  english_pob_choice: When will I awake?
  chosen_korean: 내가 언제 깨어나겠습니까?
  alternatives_korean:
  - 내가 언제 깨어나겠습니다?
  - 내가 언제 일어나겠습니까?
  lexicon: HALOT
  rationale: קיץ는 ‘깨어나다/잠에서 깨다’의 뜻이므로 ‘깨어나겠습니까?’가 가장 직접적이며, 시점 질문인 מָתַי를 한국어 어순에 맞게 앞에 두었습니다.
- source_word: אֲבַקְשֶׁנּוּ עוֹד
  english_pob_choice: I will seek it again
  chosen_korean: 나는 그것을 다시 찾겠습니다
  alternatives_korean:
  - 나는 그것을 다시 구하겠습니다
  - 나는 다시 그것을 찾겠습니다
  - 나는 그것을 또 찾겠습니다
  lexicon: HALOT
  rationale: בקש는 찾다/구하다를 포함하므로, 주변 문맥의 술에 대한 갈망을 직접 좇아 ‘다시 찾겠습니다’로 옮겼습니다. 반복의 의미는 ‘다시’가 분명히 드러냅니다.
theological_decisions:
- issue: 화자의 반복적 음주 의지 표현
  chosen_reading: 마지막 절은 술에 대한 집착과 재탐색의 의지를 드러내는 말로 이해했습니다.
  alternative_readings:
  - ‘그것’을 덜 구체적으로 두어 단순한 재탐색으로 읽는 해석
  rationale: 영어 POB의 주석처럼 대명사 ‘그것’은 문맥상 술/독주를 가리키며, 본문의 풍자적·경고적 힘을 살리기 위해 이를 흐리지 않았습니다.
  doctrine_reference: 잠언의 지혜 문학적 경고와 음주의 자기기만 묘사
