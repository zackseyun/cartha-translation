  rationale: 목적어가 없는 히브리어 절에서 보충된 ‘그것을’을 제거하여 원문의 미결정성을 보존했습니다. 또한 ‘상하지 않았고’를 자연스러운 현대 합쇼체 표현인 ‘아프지 않았습니다’로 고치고, 병렬절을 분리했습니다. 마지막 대명사는 문맥상 지시 대상을 각주로만 설명하여 본문에서는 해석적 확정을 피했습니다.
