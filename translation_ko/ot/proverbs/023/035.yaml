  source_fidelity: 전반적으로 히브리어의 병렬 구조와 마지막의 반복적 탐색을 충실히 옮겼습니다. 다만 בַל יָדָעְתִּי에는 명시된 목적어가 없으므로 ‘그것을 알지 못했습니다’보다 목적어를 보충하지 않은 번역이 원문에 더 가깝습니다. חָלִיתִי는 구타 문맥에서 ‘다치다/아프다’의 뜻이며, ‘상하다’보다 ‘아프지 않았습니다’가 자연스럽고 의미 범위도 적절히 보존합니다.
  naturalness: ‘나는 상하지 않았고’는 현대 한국어에서 사람의 신체 상태를 말할 때 다소 부자연스럽습니다. 절을 분리하여 ‘나는 아프지 않았습니다’와 ‘나는 알지 못했습니다’로 옮기면 합쇼체의 자연스러운 리듬과 히브리어 병렬이 모두 살아납니다. 각주 표지는 해당 표현에 직접 붙이는 편이 명확합니다.
  terminology: ‘치다’와 ‘때리다’로 두 히브리어 폭행 동사를 구별한 점은 적절합니다. 마지막 ‘그것’은 문맥상 술 또는 독주를 가리킬 가능성이 높지만 본문에서는 대명사로 유지하여 해석을 과도하게 확정하지 않았습니다.
