base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
  footnotes:
  - marker: a
    text: Literally, 'my kidneys,' a Hebrew expression for the inner self or deepest emotions.
    reason: cultural_note
  - marker: b
    text: Or 'when your lips speak what is right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 깊은 속이 크게 기뻐할 것입니다, 당신의 입술이 바른 것을 말할 때에[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘내 콩팥들’이며, 내면 또는 가장 깊은 감정을 가리키는 관용 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 입술이 옳은 것을 말할 때’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  english_pob_choice: will rejoice
  chosen_korean: 즐거워지고
  alternatives_korean:
  - 기뻐하고
  - 환호하고
  lexicon: HALOT
  rationale: עלז는 넘치는 기쁨이나 환희를 뜻하므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘즐거워지다’로 옮겼습니다.
- source_word: כִלְיוֹתַי
  english_pob_choice: my inmost being
  chosen_korean: 내 속
  alternatives_korean:
  - 내 심장
  - 내 깊은 속
  - 내 심정
  lexicon: HALOT
  rationale: 직역하면 ‘내 콩팥들’이지만, 히브리어 관용구로서 내면 전체를 가리키므로 ‘내 속’으로 풀어 옮겨 원문 이미지를 과도하게 해석하지 않도록 했습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: what is upright
  chosen_korean: 바른 말
  alternatives_korean:
  - 의로운 말
  - 곧은 말
  - 옳은 말
  lexicon: HALOT
  rationale: מֵישָׁרִים은 곧음/바름의 의미를 가지며 지혜문맥에서는 اخلاق적 바름을 가리키므로, 한국어에서는 말의 내용에 초점을 둔 ‘바른 말’이 자연스럽습니다.
theological_decisions:
- issue: ‘내 속’과 ‘바른 말’의 관계를 어떻게 드러낼지
  chosen_reading: 화자의 내면이 자녀의 바른 언어를 들을 때 기쁨으로 응답하는, 지혜문학적 정서 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 감정 반응으로 축소하는 읽기
  - ‘심장’ 같은 특정 기관으로 내면을 한정하는 읽기
  rationale: 본문은 부모의 교육적 기쁨을 시적으로 말하므로, 히브리어 관용구의 내면적 의미를 살리되 한국어에서는 과도한 신체화 없이 옮기는 것이 적절합니다.
  doctrine_reference: 잠언의 지혜 교육과 내면 정서 표현
