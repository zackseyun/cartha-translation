- from: 내 속이 즐거워지고, 당신의 입술이 바른 말을 할 때입니다[a][b].
  to: 내 깊은 속이 크게 기뻐할 것입니다, 당신의 입술이 바른 것을 말할 때에[a][b].
  rationale: 미래형 동사 וְתַעְלֹזְנָה와 בְּדַבֵּר가 이끄는 시간적 관계를 ‘… 기뻐할 것입니다, … 말할 때에’로 복원했습니다. כִלְיוֹתַי는 문자적 기관명이 아니라 깊은 내면을 뜻하므로 ‘내 깊은 속’으로 옮기고 각주에서 직역과 관용적 의미를 밝혔습니다. מֵישָׁרִים은 ‘바른 것’을 말한다는 표현으로 유지하여 원문의 윤리적·시적 범위를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:21Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘즐거워지고 … 할 때입니다’는 히브리어의 미래형 주절과 시간절의 관계를 한국어에서 부자연스럽게 바꾸며, ‘때입니다’는 본문에 없는 서술 초점을 만듭니다. כִלְיוֹתַי의 관용적 내면 의미와 מֵישָׁרִים의 윤리적 바름은 대체로 잘 파악했습니다.
  naturalness: ‘내 깊은 속이 크게 기뻐할 것입니다. 당신의 입술이 바른 것을 말할 때에.’는 현대 표준어로 자연스럽고, 합쇼체의 미래 서술을 유지합니다. ‘깊은 속’은 신체 기관을 직역하지 않으면서도 원문의 강한 내면성을 ‘내 속’보다 분명히 드러냅니다.
  terminology: ‘바른 것을’은 מֵישָׁרִים의 복수형·실질적 용법을 무리 없이 반영하며, ‘바른 말’보다 원문의 ‘곧고 올바른 것들’이라는 범위를 덜 좁힙니다. ‘당신의 입술’은 원문의 시적 신체 이미지를 보존합니다.
  issues:
  - severity: medium
    issue: 주절과 시간절의 문법 관계가 부정확하고 부자연스럽습니다.
    rationale: ‘내 속이 즐거워지고, … 할 때입니다’는 진행·변화 표현과 ‘때입니다’를 결합하여, ‘네 입술이 올바른 것을 말할 때 내 깊은 곳이 기뻐할 것이다’라는 히브리어의 미래 진술을 재현하지 못합니다.
  - severity: low
    issue: ‘내 속’은 כִלְיוֹתַי의 강조된 내면성을 다소 약하게 드러냅니다.
    rationale: ‘콩팥들’은 히브리어에서 가장 깊은 감정과 내면을 가리키므로 ‘내 깊은 속’이 관용적 의미와 시적 강도를 더 잘 전달합니다.
  - severity: low
    issue: ‘바른 말’은 מֵישָׁרִים의 표현 범위를 말 자체로 좁힐 수 있습니다.
    rationale: 문맥상 발화 내용이지만, 원문은 ‘올바른 것들’을 말한다는 표현입니다. ‘바른 것을 말하다’가 더 가깝습니다.
