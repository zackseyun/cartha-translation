theological_decisions:
- issue: 두 번째 행의 의미
  chosen_reading: 부를 추구하는 자기 주도적 판단과 의존을 함께 경계하는 경고로 읽었습니다.
  alternative_readings:
  - 단순히 ‘자기 지혜를 끊으라’는 일반적 권면
  - 부를 추구하지 말라는 첫 행의 반복
  rationale: 잠언의 문맥상 지혜 자체를 부정할 수 없으므로, 부를 얻기 위해 자기 분별에 기대는 태도를 경계하는 것으로 옮겨 책 전체의 지혜 신학과 충돌하지 않게 했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
