  source_fidelity: 첫 행의 ‘부자가 되려고 몸을 혹사하지 마십시오’는 אַל תִּיגַע לְהַעֲשִׁיר의 금지와 지치도록 수고한다는 강도를 잘 옮겼습니다. 둘째 행은 חֲדָל מִבִּינָתְךָ의 압축된 표현을 ‘자기 분별에 의지하는 것을 그치십시오’로 풀어, 영어 POB의 해석적 선택과 자연스러운 한국어를 함께 반영합니다. 다만 대안 각주의 ‘자기 지혜를 그치십시오’는 한국어 결합이 부자연스럽고 원문의 명령을 명료하게 전달하지 못합니다.
  naturalness: 본문은 합쇼체로 자연스럽습니다. ‘의지하는 일을 그치십시오’보다 ‘의지하는 것을 그치십시오’가 불필요한 명사화 없이 더 간결하고 현대적인 표현입니다. 각주도 자연스러운 한국어 문장으로 고쳐야 합니다.
  terminology: ‘분별’은 בִּינָה의 문맥상 적절한 역어이며, ‘부자가 되려고’도 목적을 나타내는 לְהַעֲשִׁיר에 알맞습니다. 각주의 ‘자기 지혜’는 가능한 대안이지만, ‘그치십시오’와 직접 결합시키지 않고 ‘따르는 것을 그치십시오’로 표현하는 편이 적절합니다.
