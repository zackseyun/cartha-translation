translation:
  language: ko
  text: 어리석은 사람이 듣는 데서[a] 말하지 마십시오. 그는 당신 말에 담긴 분별을[b] 업신여길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어리석은 사람의 귀에’.
