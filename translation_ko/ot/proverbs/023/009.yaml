    text: 또는 ‘당신 말에 담긴 지혜’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: …의 귀에 대고
  alternatives_korean:
  - …의 귀 속에
  - …의 듣는 앞에서
  lexicon: WLC; HALOT
  rationale: 히브리어 관용구의 이미지(‘귀에’)를 살리면서도 한국어에서 자연스럽게 들리도록 ‘귀에 대고’로 옮겼습니다.
- source_word: כְסִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우둔한 사람
  - 미련한 사람
  lexicon: HALOT
  rationale: 지혜문학의 כְסִיל은 단순 지능 부족보다 완고하고 분별 없는 인물을 가리키므로, 현대 한국어에서 과도하게 교회화되지 않은 ‘어리석은 사람’이 무난합니다.
- source_word: יָב֗וּז
  english_pob_choice: he will despise
  chosen_korean: 업신여길 것입니다
  alternatives_korean:
  - 멸시할 것입니다
  - 경멸할 것입니다
  lexicon: HALOT
  rationale: 동사의 냉소적·경멸적 거절감을 한국어에서 가장 직접적으로 드러내는 말로 ‘업신여기다’를 택했습니다.
- source_word: לְ/שֵׂכֶל מִלֶּי/ךָ
  english_pob_choice: the wisdom of your words
  chosen_korean: 당신 말의 지혜
  alternatives_korean:
  - 당신 말의 분별
  - 당신 말의 슬기
  lexicon: HALOT
  rationale: שֵׂכֶל은 분별, 통찰, 지혜의 영역을 가리키므로, POB의 ‘wisdom’ 선택을 따라 ‘지혜’로 옮기되, 말과 결합한 표현을 자연스럽게 정리했습니다.
