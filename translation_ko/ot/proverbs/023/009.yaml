  source_fidelity: ‘귀에 대고’는 가까이 대고 말하거나 귓속말한다는 뜻을 강하게 내포하여, 단지 어리석은 사람이 듣는 곳에서 말하지 말라는 בְּאָזְנֵי의 뜻을 좁힙니다. 또한 שֵׂכֶל은 여기서 ‘지혜’보다 말에 나타난 분별·통찰을 가리키는 표현이 더 가깝습니다.
  naturalness: ‘어리석은 사람이 듣는 데서 말하지 마십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 금지와 이유의 간결한 병행을 유지합니다. ‘당신 말에 담긴 분별’은 한국어 소유·수식 관계를 매끄럽게 표현합니다.
  terminology: כְסִיל의 ‘어리석은 사람’과 בוז의 ‘업신여기다’는 적절합니다. שֵׂכֶל은 ‘분별’로 옮기고 ‘지혜’는 가능한 대안으로 각주에 둡니다.
