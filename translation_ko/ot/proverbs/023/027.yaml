  - 간음하는 여인
  rationale: 히브리어의 기본 의미를 과도하게 특정한 도덕 범주로 좁히지 않으면서도, 잠언 문맥의 경고성을 한국어 관용구로 전달할 수 있어 본문에 채택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
