    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 음녀는 깊은 구덩이요, 이방 여인은 좁은 우물이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 여인’; 더 해석적으로는 ‘간음하는 여인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - 곧
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞 절의 경고를 뒷받침하는 이유를 제시하므로, 한국어에서는 자연스럽게 원인·설명을 여는 연결어로 옮겼습니다.
- source_word: זוֹנָה
