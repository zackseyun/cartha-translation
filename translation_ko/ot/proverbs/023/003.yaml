  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
  footnotes:
  - marker: a
    text: Hebrew literally, 'bread/food of lies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 진미를 탐내지 마십시오. 그것은 속이는 음식입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '거짓의 빵/음식'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְאָו
  english_pob_choice: Do not crave
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 갈망하지 마십시오
  - 욕심내지 마십시오
  - 원하지 마십시오
  lexicon: HALOT
  rationale: אַל의 금지와 תִּתְאָו의 강한 욕구를 자연스러운 합쇼체 금지문으로 옮겼습니다. '탐내다'는 단순한 선호보다 더 강한 내적 욕망을 잘 드러냅니다.
- source_word: מַטְעַמּוֹתָיו
  english_pob_choice: his delicacies
  chosen_korean: 진미
  alternatives_korean:
  - 맛난 음식
  - 별미
  - 귀한 음식
  lexicon: HALOT
  rationale: 맛있고 고급스러운 음식물을 가리키므로, 간결하고 관용적인 '진미'가 적합합니다.
- source_word: לֶחֶם כְּזָבִים
  english_pob_choice: deceptive food
  chosen_korean: 속이는 음식
  alternatives_korean:
  - 거짓된 음식
  - 속임수의 빵
  - 거짓의 음식
  lexicon: HALOT
  rationale: 직역하면 '거짓의 빵/음식'이지만, 한국어에서는 음식 자체가 사람을 속인다는 뜻을 자연스럽게 살려 '속이는 음식'으로 옮겼습니다.
theological_decisions:
- issue: 수신자 지시대명사와 소유격의 처리
  chosen_reading: '''his''를 특정 인물의 접대 음식으로 이해해 ''남의 진미''로 옮겼습니다.'
  alternative_readings:
  - 그의 진미
  - 그 사람의 진미
  - 그의 맛난 음식
  rationale: 잠언의 문맥상 남이 권하는 자리의 음식이라는 관계가 중요하므로, 소유격의 지시를 한국어에서 더 분명하게 드러냈습니다.
  doctrine_reference: 잠언 문맥의 권면적 지혜 문학
