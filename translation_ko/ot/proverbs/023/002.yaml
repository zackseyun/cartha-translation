  rationale: 문맥상 위협적 도구를 가리키므로 현대 한국어의 가장 직접적이고 짧은 대응어인 ‘칼’을 택했습니다.
- source_word: בְּ/לֹעֶךָ
  english_pob_choice: to your throat
  chosen_korean: 목에
