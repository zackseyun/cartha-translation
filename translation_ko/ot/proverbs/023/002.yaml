  text: and put a knife to your throat if you are a man of appetite[a].
  footnotes:
  - marker: a
    text: Or, 'if you are given to appetite' or 'if you are a glutton.' The Hebrew idiom is literally 'a בעל of appetite/soul,' describing a person ruled by strong desire in this setting.
