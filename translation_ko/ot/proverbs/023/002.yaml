translation:
  language: ko
  text: 당신이 식욕이 왕성한 사람이라면, 목에 칼을 대십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘식욕에 사로잡힌 사람이라면’ 또는 ‘탐식하는 사람이라면’. 히브리어는 문자적으로 ‘네페쉬(혼/욕구)의 주인’이라는 관용적 표현이며, 이 문맥에서는 식욕이나 욕망에 강하게 이끌리는 사람을 가리킵니다.
    reason: lexical_alternative
