translation:
  language: ko
  text: 술자리에 앉아 있는 자여, 목에 칼을 들이대십시오. 식욕에 사로잡힌 사람이라면 그렇게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘식욕에 사로잡힌 사람’은 문자적으로는 ‘욕망/혼의 주인’에 해당하는 히브리어 관용구를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  english_pob_choice: and put
  chosen_korean: 들이다 / 들이대다
  alternatives_korean:
  - 두십시오
  - 놓으십시오
  - 대십시오
  lexicon: BDB/HALOT
  rationale: 원문은 연속된 권고를 이어 가는 동사로, 한국어에서는 ‘칼을 목에 대다’라는 관용적이고 강한 경고를 살리기 위해 ‘들이대십시오’로 옮겼습니다.
