id: PRO.23.33
reference: Proverbs 23:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֭ינֶי/ךָ יִרְא֣וּ זָר֑וֹת וְ֝/לִבְּ/ךָ֗ יְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/033.yaml
  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
  footnotes:
  - marker: a
    text: Or 'strange women.' The Hebrew זָרוֹת can, in some contexts, refer to foreign or illicit women; here it may also be understood more generally as strange or distorted sights brought on by intoxication.
    reason: alternative_reading
  - marker: b
    text: Or 'twisted things' or 'crooked things.' The Hebrew תַּהְפֻּכוֹת refers to what is distorted or perverse, especially in speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 눈은 이상한 것들을 보고, 당신의 마음은 비뚤어진 것들을 말할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이상한 여자들’. 히브리어 זָרוֹת는 문맥에 따라 외국 여자나 부정한 여자를 가리킬 수 있지만, 여기서는 술 취함으로 인한 왜곡된 지각을 더 넓게 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘뒤틀린 것들’, ‘굽은 것들’. 히브리어 תַּהְפֻּכוֹת은 왜곡되거나 비뚤어진 말과 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ / יִרְאוּ
  english_pob_choice: your eyes will see
  chosen_korean: 당신의 눈은 … 보고
  alternatives_korean:
  - 당신의 눈은 … 볼 것이고
  - 당신의 눈은 … 보게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적인 미래형 경고를 살리되, 현대 한국어에서는 자연스럽게 ‘보게 될 것입니다’보다 ‘보고’ 구조로 결과를 앞세운 표현이 더 생생합니다.
- source_word: זָרוֹת
  english_pob_choice: strange things
  chosen_korean: 이상한 것들
  alternatives_korean:
  - 낯선 것들
  - 이상한 여자들
  - 외국 여자들
  lexicon: HALOT
  rationale: 문맥상 술 취함으로 인한 왜곡된 지각을 가리킬 수 있으므로, 특정 대상을 정하지 않는 ‘이상한 것들’이 원문의 모호성을 가장 잘 보존합니다.
- source_word: לִבְּךָ / יְדַבֵּר
  english_pob_choice: your heart will speak
  chosen_korean: 당신의 마음은 … 말할 것입니다
  alternatives_korean:
  - 당신의 হৃদ?
  - 당신의 속은 … 말할 것입니다
  - 당신의 마음은 … 입을 열 것입니다
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 생각과 의지를 포함하는 내면을 뜻하므로, 해석을 좁히지 않고 ‘마음’으로 유지했습니다.
- source_word: תַּהְפֻּכוֹת
  english_pob_choice: perverse things
  chosen_korean: 비뚤어진 것들
  alternatives_korean:
  - 뒤틀린 것들
  - 사악한 것들
  - 패역한 것들
  lexicon: HALOT
  rationale: 이 단어는 왜곡·뒤틀림의 뜻을 가지며 특히 말의 왜곡을 가리킬 수 있으므로, 도덕적 비난과 형태상의 굴절을 함께 담는 ‘비뚤어진 것들’로 옮겼습니다.
theological_decisions:
- issue: 술 취함의 결과를 묘사하는 경고의 강도
  chosen_reading: 본절은 단순한 취기 묘사가 아니라, 지각과 언어가 함께 왜곡되는 결과를 경고하는 문장으로 읽었습니다.
  alternative_readings:
  - 가벼운 과장된 표현으로 읽는 것
  - 오직 환각만을 말하는 것으로 제한하는 것
  rationale: 앞 절들의 술 취함 경고와 연결될 때, 눈의 왜곡과 마음의 왜곡된 발화가 병렬로 제시되어 도덕적·실질적 붕괴를 함께 보여 줍니다.
  doctrine_reference: 지혜문학의 도덕적 경고와 절제에 대한 일반 원리
