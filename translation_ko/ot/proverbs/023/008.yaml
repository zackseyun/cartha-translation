  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
  footnotes:
  - marker: a
    text: Or 'sweet words' or 'gracious words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 먹은 한입을 다시 토해 내고, 네의 기분 좋은 말들을 낭비하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달콤한 말들’ 혹은 ‘상냥한 말들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְּךָ
  english_pob_choice: the morsel you ate
  chosen_korean: 네가 먹은 한입
  alternatives_korean:
  - 네 몫의 음식
  - 네가 먹은 조각
  lexicon: HALOT
  rationale: פַּת는 빵이나 음식의 ‘한 조각, 한입’에 해당하므로, 한국어에서는 비유를 살리면서도 자연스러운 ‘한입’이 가장 간결합니다.
- source_word: תְקִיאֶנָּה
  english_pob_choice: you will vomit up
  chosen_korean: 다시 토해 내고
  alternatives_korean:
  - 토해 내고
  - 다시 게워 내고
  lexicon: HALOT
  rationale: 히필 형태의 강한 동작을 살려 ‘토해 내다’를 썼고, ‘up’의 방향성을 ‘다시’로 보강해 원문의 생생한 이미지를 유지했습니다.
- source_word: הַנְּעִימִים
  english_pob_choice: pleasant words
  chosen_korean: 기분 좋은 말들
  alternatives_korean:
  - 상냥한 말들
  - 달콤한 말들
  - 즐거운 말들
  lexicon: HALOT
  rationale: 형용사 נעים은 ‘즐겁고, 기분 좋은, 마음에 드는’ 뜻이므로, 직역의 경직함보다 속담 문맥에 맞는 자연스러운 한국어로 옮겼습니다.
- source_word: דְּבָרֶיךָ
  english_pob_choice: your words
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 언사
  - 네 말
  lexicon: HALOT
  rationale: 복수형 דְּבָרִים의 짧고 집약적인 속담체를 살리기 위해 단수보다 복수 느낌의 ‘말들’을 선택했습니다.
