  to: 네가 먹은 음식 한 조각을 토해 내고, 네 상냥한 말[a]을 허비하게 될 것입니다.
  rationale: 원문에 없는 ‘다시’를 삭제하고, 비표준적인 ‘네의’를 ‘네’로 바로잡았습니다. פַּת의 음식 조각 이미지를 ‘음식 한 조각’으로 명확히 했으며, נְעִימִים은 본문에서 자연스러운 ‘상냥한’으로 옮기고 가능한 의미 범위는 각주에 남겼습니다. 각주 표지는 해당 형용사구에 직접 연결했습니다.
