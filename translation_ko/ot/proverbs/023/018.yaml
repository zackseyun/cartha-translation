  text: כִּ֭י אִם יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/018.yaml
  text: For surely there is a future[a], and your hope will not be cut off.
  footnotes:
  - marker: a
    text: Or 'there is an end/outcome'; Hebrew אַחֲרִית can denote an end, latter end, outcome, or future. Here it is rendered 'future' because the context is one of positive expectation.
    reason: lexical_alternative
translation:
  language: ko
  text: 정녕히 미래가 있고, 당신의 소망은 끊어지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝/결말이 있다’. 히브리어 אַחֲרִית는 끝, 나중의 상태, 결과, 또는 미래를 뜻할 수 있습니다. 여기서는 소망과 함께 쓰여 긍정적 전망을 이루므로 ‘미래’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For surely
  chosen_korean: 정녕히
  alternatives_korean:
  - 참으로
  - 확실히
  - 오직
  lexicon: HALOT
  rationale: 이 관용구는 단순 조건이 아니라 앞 절과 연결되는 강조를 담으므로, 한국어에서는 서술을 자연스럽게 강조하는 부사로 옮기는 것이 적절합니다.
- source_word: אַחֲרִית
  english_pob_choice: a future
  chosen_korean: 미래
  alternatives_korean:
  - 끝
  - 결말
  - 나중
  - 미래의 결과
  lexicon: HALOT
  rationale: 문맥이 소망과 결합된 긍정적 전망이므로, ‘끝’보다 현대 한국어의 긍정적 시간 전망인 ‘미래’가 원문의 의미를 더 잘 드러냅니다.
- source_word: תִקְוָה
  english_pob_choice: your hope
  chosen_korean: 당신의 소망
  alternatives_korean:
  - 당신의 희망
  - 당신의 기대
  - 당신의 바람
  lexicon: HALOT
  rationale: תִקְוָה는 일반적 기대를 넘어 신뢰에 근거한 소망의 뉘앙스가 있어, 한국어에서는 성경적 어감을 살리면서도 자연스러운 ‘소망’이 적절합니다.
- source_word: לֹא תִכָּרֵת
  english_pob_choice: will not be cut off
  chosen_korean: 끊어지지 않을 것입니다
  alternatives_korean:
  - 잘려 없어지지 않을 것입니다
  - 끊기지 않을 것입니다
  - 사라지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘잘리다/끊어지다’ 이미지를 유지하되, 현대 한국어에서 이해가 쉬운 수동 표현으로 옮겨 원문의 비유를 보존했습니다.
