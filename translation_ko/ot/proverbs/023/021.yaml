  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
  footnotes:
  - marker: a
    text: Or 'slumber will clothe a person with rags.' The Hebrew noun נוּמָה can be rendered 'slumber' as well as 'drowsiness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 술에 빠진 사람과 탐식하는 사람은 가난해지고, 나태함은 사람을 누더기로 입힙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נוּמָה는 '나태함'뿐 아니라 '졸음', '슬럼버'의 뜻으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹבֵא
