  rationale: 단순한 '많이 먹는 사람'이 아니라 절제 없는 탐닉의 의미를 살리기 위해 '탐식하는 사람'으로 옮겼습니다.
- source_word: יִוָּרֵשׁ
  english_pob_choice: will come to poverty
  chosen_korean: 가난해지고
  alternatives_korean:
