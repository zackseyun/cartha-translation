  - 가난하게 됩니다
  lexicon: HALOT
  rationale: 히브리어는 결과적으로 가난해지는 상태를 나타내므로, 결과를 자연스럽게 드러내는 한국어로 풀었습니다.
- source_word: נוּמָה
  english_pob_choice: drowsiness
  chosen_korean: 나태함
  alternatives_korean:
