  - 졸림
  - 졸음기
  lexicon: HALOT
  rationale: 문맥상 단순한 졸음보다 게으름과 무기력을 낳는 상태가 강조되므로, 잠에 드는 상태와 생활 태도의 둔화를 함께 드러내는 '나태함'을 택했습니다.
