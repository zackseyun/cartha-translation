  source_fidelity: ‘나태함’은 히브리어 נוּמָה의 직접적인 뜻인 ‘졸음/잠듦/잠’을 지나치게 해석하여 옮긴 것입니다. 문맥상 게으름과 연결될 수 있으나, 본문은 ‘졸음(잠)’이 누더기를 입힌다는 은유를 사용하므로 그 어휘적 이미지를 보존하는 편이 적절합니다. 나머지 병렬 표현과 ‘가난해지고’, ‘누더기로 입힙니다’는 원문의 결과 관계와 은유를 충실히 반영합니다.
  naturalness: ‘술에 빠진 사람’과 ‘탐식하는 사람’은 현대 표준어에서 이해하기 자연스럽고, ‘졸음은 사람을 누더기로 입힙니다’도 원문의 의인화된 경고를 유지하면서 합쇼체 문장으로 무리 없이 읽힙니다.
