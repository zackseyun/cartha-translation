  english_pob_choice: drunkard
  chosen_korean: 술에 빠진 사람
  alternatives_korean:
  - 술주정뱅이
  - 술꾼
  lexicon: HALOT
  rationale: 상습적 음주를 가리키는 비난적 표현을 살리되, 현대 한국어에서 지나치게 구어적이거나 낡은 말보다 의미가 분명한 표현을 택했습니다.
