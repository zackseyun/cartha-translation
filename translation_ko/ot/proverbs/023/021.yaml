  doctrine_reference: 지혜문학의 경고와 형상적 표현 보존
- issue: '''노름/방탕''이 아닌 음주·탐식의 병렬성'
  chosen_reading: 원문의 두 악습 병렬을 그대로 살려 술과 식탐을 함께 제시했습니다.
  alternative_readings:
  - 술꾼과 게으른 사람
  - 방탕한 사람과 게으른 사람
  rationale: 본문은 특정한 자기절제 실패 두 가지를 병렬로 경고하므로, 보다 넓은 도덕 범주로 일반화하지 않았습니다.
