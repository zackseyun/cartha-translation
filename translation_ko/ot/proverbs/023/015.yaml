translation:
  language: ko
  text: 내 아들아, 네 마음이 지혜로우면 내 마음도 기뻐할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘나도’는 강조되어 있어, ‘내 마음, 곧 나도, 기뻐할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아들
  lexicon: HALOT
  rationale: 히브리어 친밀한 부자 호칭을 살리기 위해 ‘아들’로 옮기고, 직접 호소를 드러내는 호격 ‘-아’를 붙였습니다.
- source_word: לִבֶּךָ / לִבִּי
  english_pob_choice: your heart / my heart
  chosen_korean: 네 마음 / 내 마음
  alternatives_korean:
  - 네 심장 / 내 심장
  - 네 속사람 / 내 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב/לֵבָב의 관용적 의미는 단순한 감정이 아니라 내적 중심이므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘마음’으로 옮겼습니다.
- source_word: יִשְׂמַח
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하리라
  alternatives_korean:
  - 즐거워하리라
  - 기뻐할 것입니다
  lexicon: HALOT
  rationale: 지혜로운 아들의 상태에 대한 아버지의 반응을 미래 결과로 표현하므로, 문어적이면서도 자연한 ‘기뻐하리라’로 옮겼습니다.
- source_word: גַם אָנִי
  english_pob_choice: also / even I
  chosen_korean: 도
  alternatives_korean:
  - 또
  - 심지어
  lexicon: HALOT
  rationale: 히브리어의 첨가·강조를 한국어에서는 ‘도’로 간결하게 살려, ‘내 마음도’가 ‘나도’라는 중첩을 피하면서 자연스럽게 강조를 전합니다.
