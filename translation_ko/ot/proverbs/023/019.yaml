lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어라
  - 들으라
  - 들으십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 핵심은 단순 청취가 아니라 주의 깊게 받아들이는 것이므로, 현대 표준어에서 공손한 명령으로 자연스럽게 전달되는 ‘들으십시오’를 택했습니다.
- source_word: בְנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 호격이므로, 성별 정보를 지우지 않고 직설적으로 ‘내 아들아’로 옮겼습니다.
- source_word: וַחֲכָם
  english_pob_choice: and be wise
  chosen_korean: 그리고 지혜로우며
  alternatives_korean:
  - 그리고 지혜로우십시오
  - 그리고 지혜롭게 되십시오
  lexicon: HALOT
  rationale: 지혜의 상태를 촉구하는 병행법으로 보아 ‘지혜로우며’로 간결하게 살렸고, 앞 명령과 자연스럽게 이어지도록 했습니다.
- source_word: וְאַשֵּׁר
  english_pob_choice: and direct
  chosen_korean: 네 마음을 길로 곧게 하십시오
  alternatives_korean:
  - 네 마음을 길에서 인도하십시오
  - 네 마음을 바르게 하십시오
  lexicon: HALOT
  rationale: 이 동사는 ‘곧게 하다/바로잡다/인도하다’의 뜻을 가지므로, ‘길’과 결합된 이미지를 살려 ‘곧게 하십시오’로 옮겼습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속마음
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고와 의지의 중심을 가리키므로, 한국어의 통용 표현인 ‘마음’을 사용했습니다.
theological_decisions:
- issue: 부모-자녀 지혜 교육의 호격 표현
  chosen_reading: 남성 단수 호격을 유지해 ‘내 아들아’로 번역했습니다.
  alternative_readings:
  - 중립적으로 ‘내 자녀야’로 옮김
  rationale: 잠언의 교훈 화자는 실제 문법 형태대로 남성 단수 호격을 사용하며, 이를 중립화하면 원문의 직접성과 대표성이 약해집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
