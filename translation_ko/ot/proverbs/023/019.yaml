  rationale: 지혜의 상태를 촉구하는 병행법으로 보아 ‘지혜로우며’로 간결하게 살렸고, 앞 명령과 자연스럽게 이어지도록 했습니다.
- source_word: וְאַשֵּׁר
  english_pob_choice: and direct
  chosen_korean: 네 마음을 길로 곧게 하십시오
  alternatives_korean:
  - 네 마음을 길에서 인도하십시오
  - 네 마음을 바르게 하십시오
  lexicon: HALOT
  rationale: 이 동사는 ‘곧게 하다/바로잡다/인도하다’의 뜻을 가지므로, ‘길’과 결합된 이미지를 살려 ‘곧게 하십시오’로 옮겼습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속마음
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고와 의지의 중심을 가리키므로, 한국어의 통용 표현인 ‘마음’을 사용했습니다.
