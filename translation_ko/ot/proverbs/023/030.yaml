source:
  edition: WLC
  text: לַֽ/מְאַחֲרִ֥ים עַל הַ/יָּ֑יִן לַ֝/בָּאִ֗ים לַ/חְקֹ֥ר מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
  footnotes:
  - marker: a
    text: Or 'spiced wine' or 'blended drink.' The Hebrew refers to wine that has been mixed, likely to intensify flavor or strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주에 오래 머무는 이들, 섞은 포도주를 찾아 나서는 이들에 대하여[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향을 넣어 섞은 포도주’, ‘혼합 음료’로도 옮길 수 있습니다. 히브리어는 맛이나 도수를 높이기 위해 섞은 술을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים
  english_pob_choice: linger over
  chosen_korean: 오래 머무는
  alternatives_korean:
  - 오래 지체하는
  - 머무르기를 오래 하는
  lexicon: HALOT
  rationale: 동사 אחר의 여기서의 용법은 포도주 곁에 오래 머무르며 탐닉하는 뜻이므로, 현대 한국어에서 자연스럽고 의미를 살리는 표현으로 옮겼습니다.
- source_word: עַל הַיָּיִן
  english_pob_choice: over wine
  chosen_korean: 포도주에
  alternatives_korean:
  - 포도주 곁에
  - 포도주 위에
  lexicon: HALOT
  rationale: 전치사 עַל은 이 문맥에서 ‘~에 매달려/집착하여’의 뉘앙스를 가지므로, ‘포도주에’로 간결하게 옮겨 원문의 구도를 유지했습니다.
- source_word: מִמְסָךְ
  english_pob_choice: mixed wine
  chosen_korean: 섞은 포도주
  alternatives_korean:
  - 혼합한 포도주
  - 향을 넣어 섞은 포도주
  - 향료를 탄 술
  lexicon: HALOT
  rationale: מִמְסָךְ는 섞여 제조된 음료를 가리키므로, 직역에 가까운 ‘섞은 포도주’를 택해 POB의 lexical alternative를 한국어로 반영했습니다.
theological_decisions:
- issue: 금주 경고의 대상이 단순 음주가 아니라 의도적으로 더 강한 술을 찾는 탐닉이라는 점
  chosen_reading: ‘찾아 나서는’으로 옮겨, 단순히 마시는 행위보다 더 강한 술을 적극적으로 구하는 태도를 드러냈습니다.
  alternative_readings:
  - ‘찾는 이들’
  - ‘구하는 이들’
  rationale: 히브리어 לַחְקֹר는 단순한 발견보다 탐색·추적의 뉘앙스가 강하므로, 잠언의 도덕적 경고를 희석하지 않도록 적극적 추구의 성격을 살렸습니다.
  doctrine_reference: 잠언의 지혜 교훈과 절제 윤리
- issue: 문장 종결과 호명 방식
  chosen_reading: ‘~에 대하여’로 끝내어 히브리어 전치사구의 열거적 호명을 살렸습니다.
  alternative_readings:
  - ‘~하는 사람들에게’
  - ‘~하는 자들에게’
  rationale: 이 절은 다음 행과 연결되는 표제로 기능하므로, 대상 집단을 나열하는 형식을 유지하는 것이 원문 구조에 더 가깝습니다.
  doctrine_reference: 문맥 구조 보존
