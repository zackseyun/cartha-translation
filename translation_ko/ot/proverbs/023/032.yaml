id: PRO.23.32
reference: Proverbs 23:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭חֲרִית/וֹ כְּ/נָחָ֣שׁ יִשָּׁ֑ךְ וּֽ/כְ/צִפְעֹנִ֥י יַפְרִֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/032.yaml
  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
  footnotes:
  - marker: a
    text: Or 'Its end bites like a snake.' The Hebrew literally says 'its end,' referring to the eventual outcome of the wine described in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'adder' for 'viper.' The Hebrew term denotes a venomous snake.
    reason: lexical_alternative
  - marker: c
    text: The final verb is lexically difficult; it is traditionally rendered 'stings,' though 'strikes' or 'spreads venom' are also proposed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 끝은 뱀처럼 물고, 독사처럼 쏩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 끝은’은 히브리어 אַחֲרִיתוֹ의 문자적 뜻을 따른 것입니다. 문맥상 포도주를 가리키는 ‘그것의 끝/결말’이라는 뉘앙스를 담고 있습니다.
    reason: source_note
  - marker: b
    text: ‘독사’는 צִפְעֹנִי의 의미 범위를 반영한 번역으로, ‘살무사’나 ‘독뱀’도 가능한 대안입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사 יַפְרִשׁ은 해석이 어려워 전통적으로 ‘쏘다’로 옮겨 왔습니다. ‘찌르다’나 ‘독을 퍼뜨리다’로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  english_pob_choice: In the end
  chosen_korean: 그 끝은
  alternatives_korean:
  - 마침내는
  - 그 결과는
  - 그의 끝은
  lexicon: HALOT
  rationale: אַחֲרִית은 ‘마지막/결국/결과’의 뜻이므로, 문맥의 포도주를 가리키는 말로 자연스럽게 풀어 ‘그 끝은’으로 옮겼습니다.
- source_word: כְּנָחָשׁ
  english_pob_choice: like a snake
  chosen_korean: 뱀처럼
  alternatives_korean:
  - 뱀같이
  - 서펜트처럼
  lexicon: HALOT
  rationale: נָחָשׁ은 일반적인 ‘뱀’이 가장 직접적이며, ‘serpent’보다 현대 한국어에서 자연스럽습니다.
- source_word: יִשָּׁךְ
  english_pob_choice: it bites
  chosen_korean: 물고
  alternatives_korean:
  - 문다
  - 물듯이
  - 무는
  lexicon: HALOT
  rationale: נשׁך의 기본 의미는 ‘물다’이므로, 앞절과의 평행을 살려 동사형으로 ‘물고’라고 옮겼습니다.
- source_word: וּכְצִפְעֹנִי ... יַפְרִשׁ
  english_pob_choice: and it stings like a viper
  chosen_korean: 독사처럼 쏩니다
  alternatives_korean:
  - 살무사처럼 쏩니다
  - 독사처럼 독을 퍼뜨립니다
  - 독사처럼 찌릅니다
  lexicon: HALOT
  rationale: צִפְעֹנִי는 독사류의 뱀을 가리키므로 ‘독사’로 옮겼고, קשה한 יַפְרִשׁ은 전통적 해석인 ‘쏘다/독이 박히다’의 의미를 살려 ‘쏩니다’로 처리했습니다.
theological_decisions:
- issue: 잠언의 비유적 경고를 직설적 독성 묘사로 유지할지 여부
  chosen_reading: 포도주의 ‘끝’이 뱀의 물고 독사의 쏨에 비유되는 강한 경고를 그대로 살렸습니다.
  alternative_readings:
  - 부드럽게 풀어 ‘결국 해롭습니다’로 완화
  - 의미를 해석해 ‘마지막엔 상처를 줍니다’로 일반화
  rationale: 히브리어 원문의 감각적·은유적 경고를 약화하지 않는 것이 핵심이므로, 독사와 물음의 이미지를 보존했습니다.
  doctrine_reference: 잠언의 지혜문학적 경고와 비유 보존
