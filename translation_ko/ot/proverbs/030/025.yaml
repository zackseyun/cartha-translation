  text: הַ֭/נְּמָלִים עַ֣ם לֹא עָ֑ז וַ/יָּכִ֖ינוּ בַ/קַּ֣יִץ לַחְמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
  footnotes:
  - marker: a
    text: Hebrew 'their bread'; here 'bread' carries the broader sense of 'food' or 'provisions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 개미들은 힘이 약한 한 백성이지만, 여름에 자기 양식을 마련합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּמָלִים
  english_pob_choice: the ants
  chosen_korean: 개미들은
  alternatives_korean:
  - 개미가
  - 개미들
  lexicon: HALOT
  rationale: 히브리어 정관 복수 명사는 여기서 개미라는 종류 전체를 가리키므로, 한국어에서는 주어로 자연스러운 복수형을 택했습니다.
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 한 민족
  - 한 사람들
  lexicon: HALOT
  rationale: 동물인 개미에게 인간 집단을 비유적으로 붙인 표현이므로, 비유의 형식을 살리기 위해 ‘백성’을 유지하되 수식어 ‘한’을 붙여 수량화의 낯섦을 보존했습니다.
- source_word: לֹא עָז
  english_pob_choice: not strong
  chosen_korean: 힘이 약한
  alternatives_korean:
  - 강하지 않은
  - 약한
  - 힘센 것이 아닌
  lexicon: HALOT
  rationale: 직역하면 ‘강하지 않은’이지만 한국어에서는 상태를 더 자연스럽게 드러내기 위해 ‘힘이 약한’으로 옮겼습니다. 단, 완전히 ‘약한’으로 단정하지 않고 부정을 유지했습니다.
- source_word: לַחְמָם
  english_pob_choice: their food
  chosen_korean: 자기 양식
  alternatives_korean:
  - 그들의 음식
  - 그들의 먹을 것
  - 그들의 빵
  lexicon: HALOT
  rationale: לֶחֶם의 기본 뜻인 ‘빵’보다 여기서는 넓은 의미의 먹을거리/양식이 맞으므로, POB의 의미 결정을 반영해 ‘양식’으로 번역했습니다.
