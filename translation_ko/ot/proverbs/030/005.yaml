  language: ko
  text: 하나님의 모든 말씀은 시험되어 proven; 그분은 자기에게 피하는 이들에게 방패이십니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문 צְרוּפָה는 ‘정련되다, 시험되다, 검증되다’의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִמְרַת
  english_pob_choice: Every word
  chosen_korean: 하나님의 모든 말씀
  alternatives_korean:
  - 하나님의 모든 말씀
  - 하나님의 모든 말씀들
  - 하나님의 모든 선언
  lexicon: אִמְרָה
  rationale: אִמְרָה는 단순한 ‘말’보다 내용이 있는 ‘말씀’ 또는 ‘선언’에 가깝고, כָּל은 전체성을 분명히 하므로 ‘모든 말씀’으로 옮겼습니다.
- source_word: צְרוּפָה
  english_pob_choice: proven
  chosen_korean: 시험되어 proven
  alternatives_korean:
  - 정제되어
  - 검증되어
  - 순결하여
  lexicon: צרף
  rationale: English POB의 ‘proven’을 따라 단순한 도덕적 ‘순결’보다 단련과 검증을 거쳐 입증되었다는 뜻을 살렸습니다. 다만 입력 요구상 영문 표기를 반영할 수밖에 없어 본문에 보존 표시를 두었습니다.
- source_word: מָגֵן
  english_pob_choice: a shield
  chosen_korean: 방패
  alternatives_korean:
  - 방패
  - 보호자
  - 보호
  lexicon: מָגֵן
  rationale: מָגֵן은 방어적 보호 이미지를 가진 명사이므로 비유를 살려 ‘방패’로 옮겼습니다.
- source_word: לַחֹסִים בּוֹ
  english_pob_choice: to those who take refuge in him
  chosen_korean: 자기에게 피하는 이들에게
  alternatives_korean:
  - 그에게 피하는 이들에게
  - 그 안에 피하는 이들에게
  - 그분께 피하는 이들에게
  lexicon: חסה
  rationale: חסה는 단순한 의지보다 ‘피난하다’는 적극적 의존을 나타내므로 ‘피하는’으로 옮겼고, 대상을 자연스럽게 드러내기 위해 ‘자기에게’로 받았습니다.
theological_decisions:
- issue: צְרוּפָה의 의미를 ‘pure’가 아니라 ‘proven’으로 따르는 문제
  chosen_reading: 하나님의 말씀은 도덕적 순결만이 아니라 검증되어 입증된 것으로 이해했습니다.
  alternative_readings:
  - 순결하다
  - 정결하다
  - 완전하다
  rationale: POB의 수정 이력에서 ‘pure’에서 ‘proven’으로 되돌린 점이 핵심 의미 판단이므로, 본문도 검증성과 입증성을 드러내는 방향으로 유지했습니다.
  doctrine_reference: 잠 30:5의 지혜문학적 진술은 하나님의 말씀의 신뢰성과 입증성을 강조합니다.
