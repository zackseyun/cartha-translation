  lexicon: HALOT
  rationale: שִׁפְחָה와 짝을 이루는 여성 상급자를 가리키므로 현대 한국어에서 가장 직접적인 관계어인 '여주인'을 사용했습니다.
theological_decisions:
- issue: 사회적 역전의 압축 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: 두 절을 모두 '~할 때' 구조로 옮겨, 문맥상 이어지는 불길한 사회적 역전의 나열로 읽히도록 했습니다.
  alternative_readings:
  - 각 절을 독립적 명제처럼 분리하는 방식
  - 상징적으로 완곡하게 풀어 쓰는 방식
  rationale: 히브리어 원문은 조건-상황을 압축적으로 병렬 제시하므로, 한국어도 그 긴장과 충격을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 잠언의 시적-지혜문학적 문맥; 계층 질서의 전복이라는 서술 의도 보존
