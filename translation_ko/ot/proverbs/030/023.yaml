  lexicon: HALOT
  rationale: 종속적 신분을 드러내는 기본어로 '여종'을 택했고, 본문이 계층적 역전을 말하므로 완곡한 대체어보다 직접적인 표현이 적절합니다.
- source_word: תִירַשׁ
  english_pob_choice: displaces / inherits
  chosen_korean: 자기 여주인의 자리를 차지할
