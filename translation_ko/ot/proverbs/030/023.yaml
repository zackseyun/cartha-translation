  lexicon: HALOT
  rationale: 이 절에서 תַּחַת은 앞 절과 이어지는 조건문적 상황을 나타내므로, 한국어에서는 자연스럽게 '~할 때'로 풀어 앞뒤 열거 구조를 살렸습니다.
- source_word: שְׂנוּאָה
