  source_fidelity: 히브리어의 병렬 구조와 사회적 역전의 표현은 대체로 잘 반영했습니다. 다만 תִירַשׁ גְּבִרְתָּהּ는 문자적으로는 ‘자기 여주인을 상속하다/차지하다’라는 이례적 표현이어서, ‘여주인의 자리를 차지하다’는 문맥상 타당한 해석이지만 주석 표지는 해당 표현 바로 뒤에 두는 편이 원문의 어휘적 쟁점을 정확히 가리킵니다. תַּחַת이 앞절에 의존하는 연결 표현이라는 점은 한국어의 ‘~할 때’ 병렬로 무리 없이 처리되었습니다.
  naturalness: ‘미움받는 여자’와 ‘여종’, ‘여주인’은 현대 표준어에서 자연스럽고 문맥상 명확합니다. ‘그리고’보다 접속 조사 ‘와’를 써서 두 항목을 대등하게 병렬하면 잠언의 압축된 열거가 더 자연스럽습니다. 앞절에 이어지는 문장임을 고려한 종결 ‘입니다’도 합쇼체 문맥에서 가능합니다.
  terminology: ‘여종’은 שִׁפְחָה의 예속 신분을 보존하며, ‘여주인’은 גְּבִרְתָּהּ의 여성 상급자 관계를 명확히 드러냅니다. ‘미움받는’은 שְׂנוּאָה의 강도를 불필요하게 완화하지 않습니다. ‘여주인의 자리를 차지하다’는 תִירַשׁ의 문맥상 지위 역전 의미를 자연스럽게 전달하되, 상속/소유의 어휘적 가능성은 주석으로 보존합니다.
