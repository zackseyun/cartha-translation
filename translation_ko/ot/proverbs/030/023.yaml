  - 자기 여주인의 몫을 물려받을
  - 자기 여주인을 대신할
  lexicon: HALOT
  rationale: 이 동사는 단순 상속보다 사회적 지위의 전복을 가리키므로, 문맥에 맞게 '자리를 차지할'로 옮겨 역전의 뉘앙스를 드러냈습니다.
- source_word: גְּבִרְתָּהּ
  english_pob_choice: her mistress
  chosen_korean: 여주인
  alternatives_korean:
