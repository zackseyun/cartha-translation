source:
  edition: WLC
  text: תַּ֣חַת שְׂ֭נוּאָה כִּ֣י תִבָּעֵ֑ל וְ֝/שִׁפְחָ֗ה כִּֽי תִירַ֥שׁ גְּבִרְתָּֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/023.yaml
  text: under a hated woman when she is married[a], and a female slave when she inherits from her mistress.
  footnotes:
  - marker: a
    text: Or 'inherits her mistress.' The Hebrew verb often means 'inherit' or 'take possession of'; here it likely refers to taking over the mistress's place or status.
    reason: lexical_alternative
translation:
  language: ko
  text: 미움받는 여자가 결혼할 때와 여종이 자기 여주인의 자리를 차지할[a] 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 여주인의 자리를 물려받을.’ 히브리어 동사는 흔히 ‘상속하다’ 또는 ‘차지하다’를 뜻하며, 여기서는 여종이 여주인의 지위나 자리를 이어받는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: under
  chosen_korean: ~할 때
  alternatives_korean:
