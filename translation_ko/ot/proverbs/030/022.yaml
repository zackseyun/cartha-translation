  lexicon: HALOT
  rationale: 동사는 ‘왕이 되다/통치하다’의 뜻이므로, 역전의 순간을 살리는 ‘왕이 되고’가 문맥상 가장 직설적입니다.
- source_word: נָבָל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우둔한 사람
  - 미련한 자
  lexicon: HALOT
  rationale: 지혜문학에서의 נָבָל은 단순 지적 부족보다 도덕적·사회적 어리석음을 가리키므로, 고어적 색채를 줄이되 의미를 유지하는 ‘어리석은 사람’으로 옮겼습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘빵’이며, 한국어 성경에서는 일상적 식량 이미지를 유지하는 ‘빵’이 자연스럽고 본문의 구체성을 살립니다.
theological_decisions:
- issue: 비유적 과장과 사회적 역전의 효과
  chosen_reading: 본문은 두 불안정한 상황—종이 왕이 되는 것과 어리석은 사람이 빵으로 배가 차는 것—을 병렬로 제시하여 질서의 전복이 빚는 불안을 드러냅니다.
  alternative_readings:
  - 단순한 두 사실의 나열
  - 도덕적 교훈을 약화한 일반 진술
  rationale: 히브리어의 압축된 병렬을 살려야 잠언의 경고성이 유지되므로, 설명을 덧붙이지 않고 역전의 충격을 그대로 드러냈습니다.
  doctrine_reference: 지혜문학의 경고와 사회적 질서의 역전
