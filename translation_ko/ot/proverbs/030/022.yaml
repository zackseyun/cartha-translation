translation:
  language: ko
  text: 종이 왕이 되고, 어리석은 사람이 빵으로 배가 차면 땅이 떱니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’은 본문의 עֶבֶד을 따른 번역입니다. 이 단어는 봉사자보다 신분상 종속을 더 분명히 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빵’은 문자적 표현입니다. 문맥상 보다 넓게 ‘음식’으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: HALOT
  rationale: 히브리어 עֶבֶד은 본문에서 신분의 역전이 강조되지만, 잠언의 일반적 사회어법에서는 한국어 ‘종’이 가장 자연스럽고 지나치게 현대적·제도적 뉘앙스를 덜어 줍니다.
- source_word: יִמְלֹךְ
  english_pob_choice: he becomes king
  chosen_korean: 왕이 되고
  alternatives_korean:
  - 다스리게 되고
  - 왕이 되며
  lexicon: HALOT
  rationale: 동사는 ‘왕이 되다/통치하다’의 뜻이므로, 역전의 순간을 살리는 ‘왕이 되고’가 문맥상 가장 직설적입니다.
- source_word: נָבָל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우둔한 사람
  - 미련한 자
  lexicon: HALOT
  rationale: 지혜문학에서의 נָבָל은 단순 지적 부족보다 도덕적·사회적 어리석음을 가리키므로, 고어적 색채를 줄이되 의미를 유지하는 ‘어리석은 사람’으로 옮겼습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘빵’이며, 한국어 성경에서는 일상적 식량 이미지를 유지하는 ‘빵’이 자연스럽고 본문의 구체성을 살립니다.
theological_decisions:
- issue: 비유적 과장과 사회적 역전의 효과
  chosen_reading: 본문은 두 불안정한 상황—종이 왕이 되는 것과 어리석은 사람이 빵으로 배가 차는 것—을 병렬로 제시하여 질서의 전복이 빚는 불안을 드러냅니다.
  alternative_readings:
  - 단순한 두 사실의 나열
  - 도덕적 교훈을 약화한 일반 진술
  rationale: 히브리어의 압축된 병렬을 살려야 잠언의 경고성이 유지되므로, 설명을 덧붙이지 않고 역전의 충격을 그대로 드러냈습니다.
  doctrine_reference: 지혜문학의 경고와 사회적 질서의 역전
