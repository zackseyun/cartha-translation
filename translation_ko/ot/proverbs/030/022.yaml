  naturalness: ‘노예가 왕이 될 때와 어리석은 사람이 빵으로 배부를 때입니다’는 앞절의 ‘땅이 견딜 수 없는 것들’이라는 선행 틀을 받는 절 의존적 열거로서 자연스럽습니다. 원문의 압축성과 병렬을 유지합니다.
