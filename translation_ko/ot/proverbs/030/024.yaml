    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  english_pob_choice: Four
  chosen_korean: 넷
  alternatives_korean:
  - 네 가지
  - 네 마리
  - 넷이 있습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 수사적 숫자 표현을 살려, 설명을 덧붙이지 않고 ‘넷’으로 시작했습니다.
- source_word: קְטַנֵּי אָרֶץ
  english_pob_choice: small on the earth
  chosen_korean: 땅 위의 작은 것들
  alternatives_korean:
  - 땅 위에서 작은 것들
  - 땅의 작은 것들
  - 땅 위의 작은 존재들
  lexicon: HALOT
  rationale: 문맥상 생물 일반을 가리키는 관용적 표현으로 보이므로, 직역의 어색함을 피하면서도 ‘작음’과 ‘땅/지상’의 의미를 유지했습니다.
- source_word: חֲכָמִים מְחֻכָּמִים
  english_pob_choice: exceedingly wise
  chosen_korean: 매우 지혜롭습니다
  alternatives_korean:
  - 지혜롭고 또 지혜롭습니다
  - 지극히 지혜롭습니다
  - 몹시 지혜롭습니다
  lexicon: HALOT
  rationale: 형용사와 수동형 분사의 중첩이 만드는 강조를 한국어의 자연스러운 강조 부사 ‘매우’로 옮겼습니다. ‘지혜롭다’가 잠언 문맥에 가장 자연스럽습니다.
theological_decisions:
- issue: 강조형 반복(‘wise, made wise’)의 재현
  chosen_reading: 의미상 ‘아주/매우 지혜롭다’는 강조를 살리되, 본문에 없는 해석적 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘지혜롭고 더 지혜롭습니다’
  - ‘지혜롭게도 지혜롭습니다’
  rationale: 히브리어의 반복·강조를 한국어에서도 드러내야 하지만, 지나치게 해설적이거나 부자연스러운 표현은 피하는 것이 본문 충실성에 더 맞습니다.
  doctrine_reference: 잠언의 수사적 지혜 표현
