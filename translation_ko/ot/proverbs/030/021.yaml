  terminology: ‘땅’, ‘떨다’, ‘감당하다’는 적절합니다. תַּחַת는 이 수사 형식에서 원인적 의미를 자연스럽게 드러내도록 ‘때문에’로 옮길 수 있습니다. 각주도 נָשָׂא의 ‘감당하다/지다/견디다’ 의미 범위를 적절히 보존합니다.
