  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
  footnotes:
  - marker: a
    text: Or “hyraxes”; traditionally “coneys.”
    reason: lexical_alternative
translation:
  language: ko
  text: 바위너구리들은 힘센 백성이 아니지만, 바위 틈에 자기 집을 지읍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하이랙스들”; 전통적으로는 “coneys(들)”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַנִּים
  english_pob_choice: rock badgers
  chosen_korean: 바위너구리들
  alternatives_korean:
  - 바위오소리들
  - 하이랙스들
  - 산토끼들
  lexicon: HALOT
  rationale: 전통적 ‘coneys’보다 현대 독자가 동물의 정체를 이해하기 쉬운 명칭을 택하되, 바위 서식 맥락을 살려 ‘바위너구리들’로 옮겼습니다.
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  - 무리
  lexicon: HALOT
  rationale: 동물 집단을 의인화한 표현이므로, 문자적 ‘백성’이 히브리어의 집합명사적 뉘앙스를 가장 직접적으로 반영합니다.
- source_word: לֹא עָצוּם
  english_pob_choice: not mighty
  chosen_korean: 힘센
  alternatives_korean:
  - 강하지 않은
  - 힘이 없는
  - 강력하지 않은
  lexicon: HALOT
  rationale: ‘강하다/세다’보다 잠언체의 대비를 살리는 자연스러운 표현으로, 능력·세력의 부족을 간결하게 드러냅니다.
- source_word: בַ/סֶּלַע
  english_pob_choice: in the crag
  chosen_korean: 바위 틈에
  alternatives_korean:
  - 바위 속에
  - 절벽 틈에
  - 바위에
  lexicon: HALOT
  rationale: סֶלַע의 기본 뜻인 바위/절벽 중에서, 동물이 숨는 거처라는 장면을 가장 생생하게 전달하는 공간 표현으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 동물 묘사의 보존
  chosen_reading: 동물 집단을 ‘백성’으로, 거처를 ‘집’으로 번역해 잠언의 의인화와 교훈적 대비를 그대로 살렸습니다.
  alternative_readings:
  - 동물 무리로 풀어 설명하기
  - 단순히 ‘무리’로 완화하기
  rationale: 이 절은 지혜문학 특유의 의인화 표현을 통해 겸손한 피조물의 지혜를 드러내므로, 설명적 완화보다 원문의 수사 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 잠언의 지혜문학적 수사와 창조 질서 묘사
