id: PRO.30.32
reference: Proverbs 30:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם נָבַ֥לְתָּ בְ/הִתְנַשֵּׂ֑א וְ/אִם זַ֝מּ֗וֹתָ יָ֣ד לְ/פֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
  footnotes:
  - marker: a
    text: Or 'have devised' or 'have schemed'; the Hebrew verb can mean to plan or contrive, often with a negative sense in wisdom contexts.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'hand to mouth,' an idiom meaning to stop speaking or to restrain oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 스스로 어리석게 굴어 높아졌거나, 악을 도모하였거든 — 네 손을 입에 대어라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘계획하다, 꾸미다, 도모하다’의 뜻을 가질 수 있으며, 지혜문맥에서는 대체로 부정적 의도를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손을 입에’이며, 더 이상 말하지 않도록 멈추라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבַלְתָּ
  english_pob_choice: have acted foolishly
  chosen_korean: 스스로 어리석게 굴어
  alternatives_korean:
  - 어리석게 행하였다
  - 미련하게 굴었다
  lexicon: HALOT
  rationale: נבל은 단순 지적 부족보다 어리석고 경솔하게 행동하는 뜻을 가지므로, 잠언의 도덕적 경고를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: בְהִתְנַשֵּׂא
  english_pob_choice: by exalting yourself
  chosen_korean: 높아졌거나
  alternatives_korean:
  - 스스로 높였거나
  - 자기를 높였거나
  lexicon: HALOT
  rationale: 히트파엘형은 자기 높임, 자만의 뉘앙스를 담으므로 반사적 의미를 살려 ‘스스로 높아짐’을 뜻하게 했습니다.
- source_word: זַמּוֹתָ
  english_pob_choice: have plotted
  chosen_korean: 악을 도모하였거든
  alternatives_korean:
  - 꾀하였거든
  - 계획하였거든
  lexicon: HALOT
  rationale: זמם은 ‘꾀하다/도모하다’가 기본이지만, 지혜문맥에서 부정적 의도가 암시되므로 한국어에서는 그 부정성을 드러내는 ‘악을 도모하다’로 옮겼습니다.
- source_word: יָד לְפֶה
  english_pob_choice: put your hand over your mouth
  chosen_korean: 네 손을 입에 대어라
  alternatives_korean:
  - 네 손으로 입을 막아라
  - 네 손을 입에 갖다 대어라
  lexicon: HALOT
  rationale: 이 관용구는 말을 멈추고 침묵하라는 뜻이므로, 직역의 구체성을 유지하면서도 현대 한국어에서 자연스러운 명령형으로 표현했습니다.
theological_decisions:
- issue: 조건절의 두 번째 행을 한국어에서 어떻게 처리할지
  chosen_reading: ‘... 하였거든’으로 끝맺어 두 경우 모두 경고의 조건문으로 제시했습니다.
  alternative_readings:
  - ‘... 하였거나’
  - ‘... 하면’
  rationale: 히브리어의 이중 조건구조 אִם ... וְאִם는 대안을 나란히 제시하는 경고이므로, 한국어에서도 각각 조건을 유지해 권면의 압박감을 살렸습니다.
  doctrine_reference: 잠언 30:32의 지혜 교훈 구조
- issue: 후반부 행동 지시의 강도
  chosen_reading: ‘네 손을 입에 대어라’로 짧고 강한 중지를 명령했습니다.
  alternative_readings:
  - ‘말을 멈추어라’
  - ‘입을 다물어라’
  rationale: 본문의 신체적 관용구를 심리적 설명으로 풀기보다, 원문의 강한 이미지와 절제의 윤리적 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: 지혜문학의 자제와 침묵 교훈
