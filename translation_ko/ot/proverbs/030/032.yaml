  source_fidelity: 첫 조건절의 히트파엘형은 ‘높아지다’가 아니라 자신을 높이는 행위를 가리킵니다. 또한 זַמּוֹתָ의 목적어는 본문에 명시되지 않았으므로 ‘악을’은 보충하지 않는 것이 안전합니다.
  naturalness: 초안의 ‘스스로 어리석게 굴어 높아졌거나’는 ‘어리석게 행동한 결과 높아졌다’로 읽힐 수 있습니다. ‘스스로를 높이며 어리석게 행하였거나’는 원문의 관계를 더 분명하고 자연스럽게 나타냅니다. 합쇼체 명령형도 ‘대십시오’가 요구된 문체에 맞습니다.
  terminology: ‘스스로를 높이다’는 자기 높임의 반사적 의미를 보존합니다. ‘꾀를 내다’는 목적어가 없는 זמם의 열린 의미를 유지하면서 문맥상 숙고·도모의 뉘앙스를 자연스럽게 전달합니다. ‘손을 입에 대십시오’는 신체 관용구를 보존합니다.
