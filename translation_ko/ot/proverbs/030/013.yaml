lexical_decisions:
- source_word: דּוֹר
  english_pob_choice: There is a generation
  chosen_korean: 한 세대가 있습니다
  alternatives_korean:
  - 세대가 있습니다
  - 한 무리의 세대가 있습니다
  lexicon: HALOT
  rationale: 여기서는 특정한 한 부류의 사람들을 가리키는 도입문으로 쓰이므로, 존재를 드러내는 표현을 살려 ‘한 세대가 있습니다’로 옮겼습니다.
- source_word: מָה
  english_pob_choice: how
  chosen_korean: 얼마나
  alternatives_korean:
  - 어찌
  - 무슨
  lexicon: HALOT
  rationale: מָה가 여기서는 의문사가 아니라 감탄의 정도를 나타내므로, 한국어의 자연스러운 감탄 부사인 ‘얼마나’가 적절합니다.
- source_word: רָמוּ / יִנָּשֵׂאוּ
  english_pob_choice: how lofty are its eyes ... are raised high
  chosen_korean: 높이 그 눈이 들려 있고 ... 그 눈꺼풀이 치켜올라 있는지요
  alternatives_korean:
  - 높아져 있고 ... 들어올려져 있습니다
  - 교만하게 치켜든 눈 ... 치켜올린 눈꺼풀
  lexicon: HALOT
  rationale: 두 동사는 눈과 눈꺼풀의 물리적 상승 이미지를 유지하면서도 교만의 뉘앙스를 드러내므로, 직역성을 살린 ‘들려 있고’, ‘치켜올라 있는지요’로 옮겼습니다.
- source_word: עֵינָיו / עַפְעַפָּיו
  english_pob_choice: its eyes / its eyelids
  chosen_korean: 그 눈 / 그 눈꺼풀
  alternatives_korean:
  - 그의 눈 / 그의 눈꺼풀
  - 눈 / 눈꺼풀
  lexicon: HALOT
  rationale: 히브리어의 3인칭 단수 소유를 반영해 집단을 하나의 유형으로 보는 표현으로 처리했으며, 신체 이미지 자체를 보존하기 위해 구체적인 ‘눈꺼풀’을 유지했습니다.
theological_decisions:
- issue: 풍자적·윤리적 묘사의 강도
  chosen_reading: 눈과 눈꺼풀의 높음은 단순한 생김새가 아니라 교만한 태도를 가리키는 시적 풍자입니다.
  alternative_readings:
  - 단순히 자세가 당당하다는 뜻으로 완화해 읽기
  - 신체적 특징 묘사로만 읽기
  rationale: 잠언 30장의 병렬 문맥에서 외적 이미지가 내적 교만을 풍자하는 것으로 읽히므로, 그 윤리적 뉘앙스를 약화하지 않고 보존했습니다.
  doctrine_reference: 잠언 30:13의 지혜문학적 풍자 해석
- issue: 감탄문 종결
  chosen_reading: 원문의 감탄적 어조를 살려 문장 끝을 ‘-지요’로 마무리했습니다.
  alternative_readings:
  - 평서문으로만 처리하기
  - 강한 단정형으로 끝내기
  rationale: מָה의 감탄과 병렬 구조를 한국어에서도 살리기 위해, 읽는 이가 시적 탄성을 느끼도록 완곡한 감탄 종결을 사용했습니다.
  doctrine_reference: 히브리 시가의 수사적 감탄 유지
