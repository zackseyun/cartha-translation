  yaml_path: translation/ot/proverbs/030/033.yaml
  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
  footnotes:
  - marker: a
    text: Or 'curds' for 'butter'; the Hebrew term refers broadly to a milk product produced by churning or curdling.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew uses a wordplay: ''pressing the nose'' and ''pressing anger'' both use forms of אַף, which can mean ''nose'' or, idiomatically, ''anger.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우유를 휘저으면 버터[a]가 나오고, 코를 누르면 피가 나며, 분노를 자극하면 다툼이 일어납니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''버터''는 ''응고유'' 또는 ''커드''로 옮길 수도 있습니다. 히브리어는 휘젓거나 응고시켜 만든 유제품을 넓게 가리킬 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 말놀이가 있습니다. '코를 누름'의 '코'는 אַף이고, '분노를 자극함'의 '분노'는 그 형태인 אַפַּיִם이며, 이 말은 문자적으로는 '콧구멍들'을 뜻하지만 관용적으로 '분노'를 뜻합니다.
    reason: lexical_alternative
