  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
  footnotes:
  - marker: a
    text: Or 'curds' for 'butter'; the Hebrew term refers broadly to a milk product produced by churning or curdling.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew uses a wordplay: ''pressing the nose'' and ''pressing anger'' both use forms of אַף, which can mean ''nose'' or, idiomatically, ''anger.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우유를 저어 버터를 내듯, 코를 비비면 피가 나고, 노를 비비면 다툼이 나옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''버터'' 대신 ''치즈''로 번역할 수도 있습니다. 히브리어 용어는 저어 내거나 응고시킨 유제품을 광범위하게 가리킵니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어는 말장난을 사용합니다. '코를 비비다'와 '노를 비비다'는 모두 '아프'라는 어근을 사용하며, 이는 '코'를 뜻하거나 관용적으로 '노'를 의미합니다.
    reason: alternative_reading
