source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
  footnotes:
  - marker: a
    text: Or 'the way of a man with a virgin.' The Hebrew עלמה more broadly means 'young woman' and does not itself require the more specific sense 'virgin.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the heart of the sea,' an idiom for the midst of the sea.
    reason: cultural_note
  - marker: c
    text: The Hebrew term translated 'eagle' can also refer more broadly to a large bird of prey.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘을 나는 독수리[c]의 길, 바위 위를 기어가는 뱀의 길, 바다 한가운데[b]를 가르는 배의 길, 젊은 여자[a]와 함께하는 남자의 길입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊은 여자’로 옮긴 히브리어 ‘עלמה’는 더 넓게는 젊은 여자를 뜻하며, 본문 자체가 반드시 더 좁은 뜻인 ‘처녀’를 요구하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바다의 심장’이며, 이는 ‘바다 한가운데’를 뜻하는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘독수리’로 옮긴 히브리어는 더 넓게는 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
