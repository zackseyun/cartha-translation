source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
  footnotes:
  - marker: a
    text: Or 'the way of a man with a virgin.' The Hebrew עלמה more broadly means 'young woman' and does not itself require the more specific sense 'virgin.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the heart of the sea,' an idiom for the midst of the sea.
    reason: cultural_note
  - marker: c
    text: The Hebrew term translated 'eagle' can also refer more broadly to a large bird of prey.
    reason: lexical_alternative
translation:
  language: ko
  text: 독수리의 길이 하늘에 있고, 뱀의 길이 바위 위에 있으며, 배의 길이 바다 한가운데에 있고, 남자가 젊은 여자와 함께하는 길도 그러합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘עלמה’는 더 넓게는 ‘젊은 여자’를 뜻하며, 본문 자체가 반드시 ‘처녀’라는 더 좁은 뜻을 요구하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바다의 심장’이지만, 이것은 ‘바다 한가운데’라는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘독수리’로 옮긴 히브리어는 더 넓게는 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길목
  - 행로
  - 방식
  lexicon: HALOT
  rationale: 네 번 반복되는 구조어이므로 한국어에서도 가장 자연스럽고 포괄적인 ‘길’로 맞춰 반복성을 살렸습니다.
- source_word: הַנֶּשֶׁר
  english_pob_choice: eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 매
  - 큰 맹금류
  lexicon: HALOT
  rationale: 표준 한국어에서 시각적 이미지가 분명한 ‘독수리’가 ‘eagle’의 관용적 대응이며, 본문의 비유적 힘을 살립니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the sky
  chosen_korean: 하늘에
  alternatives_korean:
  - 하늘 가운데
  - 공중에
  lexicon: HALOT
  rationale: 새가 나는 물리적 공간을 가리키므로, 추상적인 ‘하늘들’보다 ‘하늘에’가 더 직접적입니다.
- source_word: בְלֶב יָם
  english_pob_choice: in the heart of the sea
  chosen_korean: 바다 한가운데에
  alternatives_korean:
  - 바다의 심장에
  - 바다의 한복판에
  lexicon: HALOT
  rationale: 히브리어의 직역적 이미지인 ‘심장’을 한국어에서는 관용적으로 이해되는 ‘한가운데’로 풀어, 관용구의 의미를 보존했습니다.
- source_word: בְּעַלְמָה
  english_pob_choice: with a young woman
  chosen_korean: 젊은 여자와 함께하는
  alternatives_korean:
  - 처녀와 함께하는
  - 미혼 여성과 함께하는
  lexicon: HALOT
  rationale: ‘עלמה’는 ‘젊은 여자/처녀’의 범위를 가지지만 본문이 명시하는 것은 연령대와 관계성이지 처녀성 자체가 아니므로, POB의 뜻을 따라 덜 특정적인 표현을 택했습니다.
theological_decisions:
- issue: 마지막 행의 관계 표현 בְּעַלְמָה의 의미
  chosen_reading: ‘젊은 여자와 함께하는 길’로 옮겨, 남녀 사이의 이해하기 어려운 관계적 움직임이라는 수수께끼성을 유지했습니다.
  alternative_readings:
  - ‘젊은 여자 안에서의 길’
  - ‘처녀와 함께하는 길’
  rationale: 지혜문학의 병렬 목록은 ‘흔적을 남기며 지나가지만 완전히 포착하기 어려운 길’의 예들을 나열합니다. 따라서 전치사를 관계적으로 처리해, 원문의 암시성과 절제된 수수께끼성을 유지하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
