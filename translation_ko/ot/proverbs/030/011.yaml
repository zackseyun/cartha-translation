  yaml_path: translation/ot/proverbs/030/011.yaml
  text: There is a generation that curses its father and does not bless its mother[a][b].
  footnotes:
  - marker: a
    text: Or 'his father ... his mother.' The Hebrew uses singular pronominal suffixes; the English 'its' follows the collective noun 'generation.'
    reason: lexical_alternative
  - marker: b
    text: '''Does not bless'' can also carry the sense ''does not speak well of'' or ''does not honor'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 아버지를 저주하고 자기 어머니를 축복하지 않는 세대가 있습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지 ... 그의 어머니’. 히브리어는 ‘아버지’와 ‘어머니’에 각각 남성 단수 소유 접미사를 붙입니다. 한국어의 ‘자기’는 이 세대에 속한 사람들의 부모를 자연스럽게 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: ‘축복하지 않는다’는 이 문맥에서 ‘좋게 말하지 않는다’ 또는 ‘존중하지 않는다’라는 뜻을 내포할 수도 있습니다.
    reason: alternative_reading
