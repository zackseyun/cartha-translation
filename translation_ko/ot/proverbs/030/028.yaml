base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/028.yaml
  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
  footnotes:
  - marker: a
    text: Or 'spider.' The Hebrew שְׂמָמִית is rare and uncertain; many traditional translations render it 'spider,' while others understand a kind of lizard or gecko.
    reason: alternative_reading
translation:
  language: ko
  text: 도마뱀은[a] 손으로 잡을 수 있지만, 왕궁에도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거미’. 히브리어 שְׂמָמִית은 드물게 쓰인 말이며 뜻이 확실하지 않습니다. 전통적인 번역 중에는 ‘거미’로 옮긴 것이 많고, 다른 번역들은 도마뱀이나 도마뱀붙이로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  english_pob_choice: lizard
  chosen_korean: 도마뱀
  alternatives_korean:
  - 거미
  - 도마뱀붙이
  lexicon: HALOT
  rationale: 히브리어 שְׂמָמִית은 희귀하고 뜻이 불확실하지만, 문맥상 작은 벽 타는 파충류를 가리키는 이해가 가장 자연스럽습니다. 한국어로는 더 좁은 ‘도마뱀붙이’보다 포괄적인 ‘도마뱀’이 원문의 불확실성을 과하게 좁히지 않습니다.
- source_word: בְּיָדַיִם
  english_pob_choice: with your hands
  chosen_korean: 손으로도
  alternatives_korean:
  - 손으로
  - 두 손으로
  lexicon: HALOT
  rationale: ב의 수단 용법을 살려 ‘손으로’로 옮겼고, 속담의 대비감을 살리기 위해 ‘도’로 ‘쉽게 잡을 수 있음’의 뉘앙스를 드러냈습니다.
- source_word: תְּתַפֵּשׂ
  english_pob_choice: you can catch
  chosen_korean: 잡을 수 있는
  alternatives_korean:
  - 붙잡을 수 있는
  - 잡습니다
  lexicon: HALOT
  rationale: 동사의 능동적 가능성을 한국어 관용에 맞게 분사형으로 풀어, 속담의 일반 진술을 자연스럽게 전달했습니다.
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  english_pob_choice: in kings’ palaces
  chosen_korean: 왕의 궁궐들에
  alternatives_korean:
  - 왕궁에
  - 왕의 궁전에
  lexicon: HALOT
  rationale: 복수형 ‘palaces’를 반영해 단수 ‘왕궁’보다 ‘궁궐들’로 옮겼습니다. 이는 특정 한 왕이 아니라 왕권의 거처 일반을 가리키는 속담적 표현을 살립니다.
theological_decisions:
- issue: 희귀 동물명 해석의 불확실성
  chosen_reading: 본문에는 ‘도마뱀’으로 두고, 각주로 ‘거미’ 가능성을 밝혔습니다.
  alternative_readings:
  - 거미
  - 도마뱀붙이
  rationale: 히브리어 어휘가 희귀하여 단정적 번역은 과도할 수 있으므로, 본문은 가장 자연스러운 일반어로 처리하고 전승상의 다른 이해를 각주에 보존했습니다.
  doctrine_reference: 성경 번역의 명료성 vs. 어휘 불확실성 보존
- issue: 속담의 일반 진술 문체
  chosen_reading: 직접적인 2인칭 가능 표현을 사용해 속담의 생동감을 살렸습니다.
  alternative_readings:
  - 더 서술적인 문장형
  - 수동형 표현
  rationale: 히브리어 2인칭 단수는 일반적 청자를 향한 속담적 직설이므로, 한국어도 이를 자연스럽게 살리는 것이 원문의 효과를 잘 보존합니다.
  doctrine_reference: 문학 장르의 수사 효과 보존
