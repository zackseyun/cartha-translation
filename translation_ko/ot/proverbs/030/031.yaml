base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/031.yaml
  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
  footnotes:
  - marker: a
    text: Or, 'a king against whom there is no rising up.' The Hebrew expression is difficult and admits more than one plausible interpretation.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term rendered 'strutting rooster' is rare and uncertain; other renderings include 'greyhound' or 'war-horse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 날렵하게 걷는 수탉과 수염염소와, 맞서 일어설 자가 없는 왕입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 대항하여 일어날 수 없는 왕’. 히브리어 표현은 어렵고, 가능한 해석이 하나 이상입니다.
    reason: alternative_reading
  - marker: b
    text: ‘날렵하게 걷는’으로 옮긴 히브리어는 희귀하고 뜻이 확실하지 않으며, ‘회색하운드’나 ‘전쟁마’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  english_pob_choice: a strutting rooster
  chosen_korean: 날렵하게 걷는 수탉
  alternatives_korean:
  - 꿋꿋이 걸어가는 수탉
  - 당당하게 거니는 수탉
  - 허리를 바짝 세운 수탉
  lexicon: HALOT, BDB
  rationale: 희귀하고 불확실한 표현을 한국어로는 문맥상 위엄 있고 당당한 걸음의 이미지를 살려 옮겼습니다. '날렵하게'는 POB의 'strutting'이 주는 뽐내며 걷는 느낌을 자연스럽게 반영합니다.
- source_word: תָּיִשׁ
  english_pob_choice: a he-goat
  chosen_korean: 수염염소
  alternatives_korean:
  - 염소 숫컷
  - 숫염소
  lexicon: HALOT, BDB
  rationale: 히브리어가 수컷 염소를 가리키므로 성별을 분명히 드러냈습니다. '숫염소'도 가능하지만, 현대 한국어에서는 '수염소'보다 '수염염소'가 뜻을 더 바로 전달합니다.
- source_word: מֶלֶךְ אַלְקוּם עִמּוֹ
  english_pob_choice: a king against whom there is no rising up
  chosen_korean: 맞서 일어설 자가 없는 왕
  alternatives_korean:
  - 그에게 대항하여 일어날 수 없는 왕
  - 그 앞에 반역할 수 없는 왕
  - 그와 함께 일어설 자가 없는 왕
  lexicon: HALOT, BDB
  rationale: 난해한 히브리어 관용구를 POB의 본문 선택에 따라 '대항하여 일어나다'의 의미로 풀었습니다. '자가 없는'은 대상의 부재를 간명하게 드러내며, 본문의 위압적 병렬 구조와도 잘 맞습니다.
theological_decisions:
- issue: 난해한 마지막 절의 의미 처리
  chosen_reading: 본문에는 '맞서 일어설 자가 없는 왕'을 두고, 대안 독법은 각주로 남기지 않았습니다.
  alternative_readings:
  - '''왕의 군대가 그와 함께 있는''으로 이해할 수 있음'
  - '''그에게 대항하여 일어날 수 없는 왕''이라는 독법'
  rationale: 제공된 최신 POB 본문 선택은 'against whom there is no rising up'이며, 한국어 본문은 그 의미를 직접 반영했습니다. 별도 각주를 두면 본문 결정을 약화시킬 만큼 이 절은 POB에서 이미 단일 본문으로 정리되어 있습니다.
  doctrine_reference: 잠언의 지혜시적 관찰; 교리적 쟁점 없음
