id: PRO.30.20
reference: Proverbs 30:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
  footnotes:
  - marker: a
    text: Or, more literally, 'I have done no wickedness.'
    reason: lexical_alternative
  - marker: b
    text: The imagery of eating and wiping the mouth portrays casual concealment, as though the act left no moral trace.
    reason: cultural_note
translation:
  language: ko
  text: 이와 같은 것은 음행하는 여자의 길입니다. 그는 먹고 입을 닦고는, "나는 악을 행하지 않았습니다"라고 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘나는 악을 행하지 않았다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 먹고 입을 닦는 이미지는, 마치 그 행위가 아무 도덕적 흔적도 남기지 않은 것처럼 태연하게 숨기는 모습을 보여 줍니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן דֶּרֶךְ
  english_pob_choice: So is the way
  chosen_korean: 이와 같은 것은 …의 길입니다
  alternatives_korean:
  - 그와 같은 것은 …의 길입니다
  - 이처럼 …의 길입니다
  lexicon: HALOT
  rationale: כֵּן과 דֶּרֶךְ의 비교·판단 구조를 한국어의 자연스러운 ‘이와 같은 것은 …의 길’로 옮겨, 잠언의 유형적 진술을 살렸습니다.
- source_word: אִשָּׁה מְנָאָפֶת
  english_pob_choice: an adulterous woman
  chosen_korean: 음행하는 여자
  alternatives_korean:
  - 간음하는 여자
  - 음행하는 여인
  lexicon: HALOT
  rationale: 참여분사형의 지속적 성격을 살려 ‘음행하는’으로 옮겼고, 라벨형 명사보다 원문의 행위성을 드러내도록 했습니다.
- source_word: וּמָחֲתָה פִיהָ
  english_pob_choice: and wipes her mouth
  chosen_korean: 입을 닦고는
  alternatives_korean:
  - 입을 훔치고는
  - 입을 닦은 뒤
  - 입술을 닦고는
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입을 닦고는’을 택해, 먹은 흔적을 지우는 무심한 제스처라는 이미지가 드러나게 했습니다.
- source_word: לֹא פָעַלְתִּי אָוֶן
  english_pob_choice: I have done no wrong / no wickedness
  chosen_korean: 나는 악을 행하지 않았습니다
  alternatives_korean:
  - 나는 잘못을 저지르지 않았습니다
  - 나는 악을 행한 적이 없습니다
  - 나는 죄를 짓지 않았습니다
  lexicon: HALOT
  rationale: אָוֶן의 도덕적·위법적 뉘앙스를 고려해 ‘잘못’보다 강한 ‘악’을 택했고, פעל의 동사성을 살려 ‘행하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 비유적·풍자적 이미지 보존
  chosen_reading: 먹고 입을 닦는 동작을 죄의 흔적을 가볍게 지워 버리는 태도로 읽히게 했습니다.
  alternative_readings:
  - 단순한 식사 동작으로만 읽기
  - 도덕적 의미를 약화해 중립적으로 옮기기
  rationale: 영어 POB의 주석처럼 이 이미지는 ‘흔적 없는 은폐’를 풍자하므로, 한국어에서도 행동의 무심함과 자기기만이 드러나도록 유지했습니다.
  doctrine_reference: 잠 30:20 문맥상의 지혜 문학적 풍자
- issue: “악”과 “잘못” 사이의 강도
  chosen_reading: ‘악을 행하지 않았습니다’로 번역해 אָוֶן의 단순한 실수보다 더 강한 도덕적 무게를 보존했습니다.
  alternative_readings:
  - 잘못을 저지르지 않았습니다
  - 죄를 짓지 않았습니다
  rationale: 문맥상 화자의 자기변호는 가벼운 과실 부인이 아니라 도덕적 책임 회피이므로, 원문의 긴장을 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 오언 30:20의 어휘 범위(אָוֶן)
