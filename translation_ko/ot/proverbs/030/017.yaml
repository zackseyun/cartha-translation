  lexicon: HALOT
  rationale: נשר는 독수리/독수리류 큰 맹금으로 이해될 수 있으나, 전통적 한국어 관용과 대비를 살리기 위해 ‘독수리의 새끼들’로 옮겼습니다.
theological_decisions:
- issue: 부모 공경의 대상 표현
  chosen_reading: ‘아버지’와 ‘어머니의 가르침’으로 병렬하여, 단순한 감정 문제가 아니라 지혜 전통에서 부모 권위를 거스르는 행위를 드러냈습니다.
  alternative_readings:
  - ‘아버지’를 ‘자기 아버지’로 풀어 구체화
  - ‘어머니의 순종’을 직접 사용
  rationale: 히브리어는 소유격을 명시하지 않으므로 일반적 속담 표현을 유지하면서, 어머니 쪽은 희귀어의 의미를 한국어로 풀어 주는 것이 본문의 의도를 가장 잘 보존합니다.
  doctrine_reference: 잠언의 교육적 윤리와 부모 공경 주제
- issue: 보응의 시적 이미지
  chosen_reading: 새들이 눈을 쪼아 빼고 먹는다는 과격한 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 완화하여 ‘벌을 받을 것입니다’
  - 상징적으로만 ‘수치를 당할 것입니다’
  rationale: 본문은 도덕적 경고를 신체적 심판 이미지로 표현하므로, 그 충격을 완화하면 잠언의 경고 효과가 약해집니다.
  doctrine_reference: 지혜문학의 보응적 경고
