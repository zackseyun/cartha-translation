  text: עַ֤יִן תִּֽלְעַ֣ג לְ/אָב֮ וְ/תָב֪וּז לִֽ/יקֲּהַ֫ת אֵ֥ם יִקְּר֥וּ/הָ עֹרְבֵי נַ֑חַל וְֽ/יֹאכְל֥וּ/הָ בְנֵי נָֽשֶׁר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
  footnotes:
  - marker: a
    text: Or 'a mother's command/instruction'; the rare Hebrew term likely refers to the obedience or heed owed to one's mother.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ravens of the valley'; 'valley' may also be understood as 'wadi' or 'brook-bed.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew nesher can refer to an eagle or a vulture; traditionally rendered 'eagle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지를 조롱하고 어머니의 가르침을 멸시하는 눈은 골짜기의 까마귀들이 쪼아 빼고, 독수리의 새끼들이 먹을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 희귀어 יקהת은 여기서 어머니에게 요구되는 경청이나 순종을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נחל은 골짜기, 와디, 골짜기 물길로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 nesher는 독수리나 독수리류 큰 맹금으로 이해될 수 있으며, 전통적으로는 ‘독수리’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  english_pob_choice: The eye
  chosen_korean: 눈
  alternatives_korean:
  - 그 눈
  - 한 눈
  lexicon: HALOT
  rationale: 히브리어 단수 ‘눈’은 속담의 주어로 자연스럽게 한국어에서도 단수 일반명사로 옮기는 것이 가장 직접적입니다.
- source_word: תִּלְעַג / וְתָבוּז
  english_pob_choice: mocks / despises
  chosen_korean: 조롱하고 / 멸시하는
  alternatives_korean:
  - 비웃고 / 업신여기는
  - 조소하고 / 경멸하는
  lexicon: HALOT
  rationale: 둘 다 모욕과 경멸의 태도를 나타내므로, 현대 한국어에서 대칭적으로 읽히는 ‘조롱하다 / 멸시하다’가 속담의 강한 윤리적 어조를 잘 살립니다.
- source_word: לִיקֲּהַת אֵם
  english_pob_choice: obedience to a mother
  chosen_korean: 어머니의 가르침
  alternatives_korean:
  - 어머니의 순종
  - 어머니의 명령
  - 어머니의 지시
  lexicon: HALOT
  rationale: 희귀한 יקהת는 문맥상 어머니에게서 받아야 할 경청·순종의 태도를 가리키지만, 한국어에서는 ‘가르침’이 그 권위와 반응의 의무를 가장 자연스럽게 전달합니다.
- source_word: עֹרְבֵי נַחַל
  english_pob_choice: ravens of the valley
  chosen_korean: 골짜기의 까마귀들
  alternatives_korean:
  - 계곡의 까마귀들
  - 와디의 까마귀들
  - 시내골짜기의 까마귀들
  lexicon: HALOT
  rationale: נחל은 골짜기/와디/골짜기 물길을 가리킬 수 있으나, 한국어 본문에서는 시각적 이미지가 분명한 ‘골짜기’가 가장 읽기 쉽고 원문의 장소감을 잘 드러냅니다.
- source_word: בְנֵי נָשֶׁר
  english_pob_choice: the young of the eagle
  chosen_korean: 독수리의 새끼들
  alternatives_korean:
  - 독수리의 새끼
  - 황조롱이의 새끼들
  - 수리의 새끼들
  lexicon: HALOT
  rationale: נשר는 독수리/독수리류 큰 맹금으로 이해될 수 있으나, 전통적 한국어 관용과 대비를 살리기 위해 ‘독수리의 새끼들’로 옮겼습니다.
theological_decisions:
- issue: 부모 공경의 대상 표현
  chosen_reading: ‘아버지’와 ‘어머니의 가르침’으로 병렬하여, 단순한 감정 문제가 아니라 지혜 전통에서 부모 권위를 거스르는 행위를 드러냈습니다.
  alternative_readings:
  - ‘아버지’를 ‘자기 아버지’로 풀어 구체화
  - ‘어머니의 순종’을 직접 사용
  rationale: 히브리어는 소유격을 명시하지 않으므로 일반적 속담 표현을 유지하면서, 어머니 쪽은 희귀어의 의미를 한국어로 풀어 주는 것이 본문의 의도를 가장 잘 보존합니다.
  doctrine_reference: 잠언의 교육적 윤리와 부모 공경 주제
- issue: 보응의 시적 이미지
  chosen_reading: 새들이 눈을 쪼아 빼고 먹는다는 과격한 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 완화하여 ‘벌을 받을 것입니다’
  - 상징적으로만 ‘수치를 당할 것입니다’
  rationale: 본문은 도덕적 경고를 신체적 심판 이미지로 표현하므로, 그 충격을 완화하면 잠언의 경고 효과가 약해집니다.
  doctrine_reference: 지혜문학의 보응적 경고
