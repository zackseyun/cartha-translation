  source_fidelity: 히브리어의 일반적 속담 표현인 ‘눈’을 유지하고, 아버지를 조롱하는 행위와 어머니에 대한 마땅한 태도를 멸시하는 행위를 연결한 점, 그리고 까마귀와 נשר의 새끼가 그 눈을 해치는 생생한 보응 이미지를 보존한 점은 적절합니다. 다만 לִיקֲּהַת אֵם은 ‘어머니의 가르침’보다 ‘어머니께 순종함/경청함’에 더 가깝게 이해되는 희귀어이므로, 본문에서는 그 관계적 의미를 더 직접적으로 드러내는 편이 안전합니다. 또한 nesher의 대안은 ‘큰 맹금’으로만 넓히기보다 시식성 조류일 가능성을 명시해야 영어 감사 기록과도 부합합니다.
  naturalness: ‘아버지를 조롱하고 어머니께 순종하기를 멸시하는 눈’은 현대 표준 한국어의 문어적 잠언 문체에서 자연스럽습니다. ‘쪼아 빼낼 것입니다’는 원문의 눈을 쪼아 내는 이미지를 자연스럽고 정확하게 전달합니다. 각주 표지는 해당 어휘 바로 뒤에 두어 참조 관계를 분명히 했습니다.
