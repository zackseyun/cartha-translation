source:
  edition: WLC
  text: פֶּ֥ן אֶשְׂבַּ֨ע וְ/כִחַשְׁתִּי֮ וְ/אָמַ֗רְתִּי מִ֥י יְה֫וָ֥ה וּ/פֶֽן אִוָּרֵ֥שׁ וְ/גָנַ֑בְתִּי וְ֝/תָפַ֗שְׂתִּי שֵׁ֣ם אֱלֹהָֽ/י׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Who is Yahweh?'' The main text follows the project''s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'misuse the name of my God.' The Hebrew literally reads 'seize/grasp the name of my God,' likely an idiom for dishonoring or profaning God's name.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 배부르게 되어 야훼를 부인하고 “야훼가 누구냐?” 하고 말할까 두렵습니다. 또 제가 가난해져 도둑질하고 내 하나님의 이름을 욕되게 할까[a] 두렵습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 하나님의 이름을 붙잡다/취하다’입니다. 이는 하나님의 이름을 욕되게 하거나 모독한다는 뜻의 관용적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: ~할까 두렵습니다
  alternatives_korean:
  - 혹시
  - ~하지 않도록
  lexicon: HALOT
  rationale: 두려워하는 부정적 결과를 나타내는 פֶּן의 경고 뉘앙스를 합쇼체에 자연스럽게 살렸습니다.
- source_word: כִחַשְׁתִּי
  english_pob_choice: deny you
  chosen_korean: 주를 부인하고
  alternatives_korean:
  - 주를 버리고
  - 주를 거부하고
  lexicon: HALOT
  rationale: 대상은 하나님이므로 단순한 거짓말보다 신앙적 거절·부인의 의미를 살리는 표현이 적절합니다.
- source_word: מִי יְהוָה
  english_pob_choice: Who is the LORD?
  chosen_korean: 「야훼가 누구냐?」
  alternatives_korean:
  - 「주님이 누구냐?」
  - 「야훼가 무엇이냐?」
  lexicon: HALOT
  rationale: 문맥상 교만한 무시를 드러내는 수사적 질문이므로, 본문에 있는 신명 표기를 직접 드러냈습니다.
- source_word: תָפַשְׂתִּי שֵׁם אֱלֹהָי
  english_pob_choice: profane the name of my God
  chosen_korean: 내 하나님의 이름을 더럽힐까
  alternatives_korean:
  - 내 하나님의 이름을 욕되게 할까
  - 내 하나님의 이름을 함부로 다룰까
  lexicon: HALOT
  rationale: 직역의 '붙잡다/취하다'보다는 문맥이 요구하는 '모독하다, 더럽히다'의 의미를 한국어 관용으로 분명하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값에 따라 신명사를 본문에서 직접 표기하여 원문 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 첫 절의 화법과 후반부 병렬
  chosen_reading: 두 개의 두려운 결과를 각각 "~할까 두렵습니다"로 병렬 처리했습니다.
  alternative_readings:
  - 한 번만 반복해 자연스럽게 묶기
  - 평서문으로 압축하기
  rationale: 히브리어의 פֶּן... וּפֶן... 구조가 두 가지 경고를 나란히 제시하므로, 한국어에서도 대칭을 유지하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
