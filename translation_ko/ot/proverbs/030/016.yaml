  text: שְׁאוֹל֮ וְ/עֹ֪צֶ֫ר רָ֥חַם אֶ֭רֶץ לֹא שָׂ֣בְעָה מַּ֑יִם וְ֝/אֵ֗שׁ לֹא אָ֥מְרָה הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead' for 'Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the restraint/closure of the womb,' that is, a womb that does not bear children.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression at the end is difficult; many understand it as 'Enough!' Others have proposed a sense related to 'wealth' or 'substance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스올[a]과 잉태하지 못하는 자궁[b], 물이 부족함을 알지 못하는 땅, 그리고 ‘충분하다’고 말하지 않는 불[c]이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '무덤' 또는 '죽음의 세계'로 번역될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 문자적으로는 '자궁의 폐쇄'를 의미하며, 즉 자녀를 낳지 못하는 자궁을 뜻합니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 표현의 끝부분이 어렵습니다. 많은 학자들은 이를 '충분하다!'로 이해합니다. 다른 학자들은 '부'나 '실체'와 관련된 의미를 제안하기도 했습니다.
    reason: alternative_reading
