source:
  edition: WLC
  text: שָׁ֤וְא וּֽ/דְבַר כָּזָ֡ב הַרְחֵ֬ק מִמֶּ֗/נִּי רֵ֣אשׁ וָ֭/עֹשֶׁר אַל תִּֽתֶּן לִ֑/י הַ֝טְרִיפֵ֗/נִי לֶ֣חֶם חֻקִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
  footnotes:
  - marker: a
    text: Or 'deceitful speech' for 'lying words.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the bread of my portion'; alternatively, 'my portion of bread' or 'my daily bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓과 거짓말하는 말을 내게서 멀리하셔서, 가난도 부요도 내게 주지 마시고, 내게 정하신 몫의 떡으로 먹이소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거짓말하는 말’은 문자적으로는 ‘거짓의 말’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내게 정하신 몫의 떡’은 문자적으로 ‘나의 몫의 떡’이며, ‘일용한 떡’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허무
  - 헛됨
  - 속임
  lexicon: HALOT
  rationale: ‘거짓’은 다음의 ‘거짓말하는 말’과 병렬을 이루며, 단순한 허무보다 도덕적·언어적 거짓의 뜻을 분명하게 드러냅니다.
- source_word: דְבַר כָּזָב
  english_pob_choice: lying words
  chosen_korean: 거짓말하는 말
  alternatives_korean:
  - 거짓된 말
  - 속이는 말
  - 거짓말
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘거짓의 말’이므로, 복수적 뉘앙스를 살려 ‘거짓말하는 말’로 옮기면 기만적 발화를 자연스럽게 담아낼 수 있습니다.
- source_word: הַרְחֵק מִמֶּנִּי
  english_pob_choice: Keep ... far from me
  chosen_korean: 내게서 멀리하셔서
  alternatives_korean:
  - 내게서 멀리 두셔서
  - 내게서 치워 주셔서
  - 내게서 제거하셔서
  lexicon: HALOT
  rationale: 히필 명령형의 사역적 의미를 살려 ‘멀리하다’로 옮겼고, 기도문 맥락에 맞게 공손한 청유형으로 처리했습니다.
- source_word: לֶחֶם חֻקִּי
  english_pob_choice: the bread allotted to me
  chosen_korean: 내게 정하신 몫의 떡
  alternatives_korean:
  - 내게 정해진 빵
  - 내 몫으로 주신 떡
  - 내게 할당된 양식
  lexicon: HALOT
  rationale: ‘חֻקִּי’를 단순한 ‘일용한’으로 풀기보다, 분배·배당의 뜻이 살아 있는 ‘정하신 몫’으로 옮겨 지혜문학의 적정한 분량이라는 의미를 보존했습니다.
theological_decisions:
- issue: 가난과 부요 사이의 중도적 간구
  chosen_reading: 가난도 부요도 함께 피하게 해 달라는, 적정한 몫을 구하는 기도문으로 읽었습니다.
  alternative_readings:
  - 단순히 물질적 부족과 풍요를 함께 거절하는 일반적 기도
  - 윤리적 겸손보다 경제적 안정에 초점을 둔 기도
  rationale: 문맥상 핵심은 양극단을 피하고 자기에게 맞는 몫을 구하는 데 있으므로, ‘정하신 몫’이라는 표현으로 절제와 만족의 지혜를 드러냈습니다.
  doctrine_reference: 잠언 30:8의 지혜문학적 절제 이해
