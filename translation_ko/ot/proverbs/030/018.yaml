lexical_decisions:
- source_word: שְׁלֹשָׁה
  english_pob_choice: Three things
  chosen_korean: 세 가지
  alternatives_korean:
  - 세 가지 일
  - 세 가지 것들
  - 셋
  lexicon: HALOT
  rationale: 히브리어 수사법의 관용적 표현을 살려, 한국어에서도 자연스러운 ‘세 가지’로 옮겼습니다. 여기에는 생략된 대상이 암시되므로 별도 명사를 굳이 덧붙이지 않았습니다.
- source_word: נִפְלְאוּ מִמֶּנִּי
  english_pob_choice: too wonderful for me
  chosen_korean: 내게 너무 놀랍고
  alternatives_korean:
  - 내게 너무 기이하고
  - 내가 헤아릴 수 없고
  - 내게 너무 경이롭고
  lexicon: HALOT
  rationale: פלא 계열의 뜻은 단순한 ‘좋다’가 아니라, 화자의 이해를 넘어서는 놀라움·경이로움입니다. ‘너무 놀랍고’는 그 초월성과 난해함을 함께 살립니다.
- source_word: לֹא יְדַעְתִּים
  english_pob_choice: I do not understand
  chosen_korean: 내가 알지 못합니다
  alternatives_korean:
  - 내가 이해하지 못합니다
  - 나는 그것들을 알지 못합니다
  - 내가 모릅니다
  lexicon: HALOT
  rationale: ידע는 여기서 단순한 지식보다 이해·파악의 의미를 띱니다. 한국어에서는 ‘알지 못합니다’가 가장 무난하게 그 인지적 한계를 드러냅니다.
theological_decisions:
- issue: 지혜 격언의 수사적 절제
  chosen_reading: ‘너무 놀랍고 … 알지 못합니다’로 마무리하여, 화자의 한계와 피조물 세계의 신비를 과장 없이 드러냈습니다.
  alternative_readings:
  - ‘너무 경이롭고 … 헤아릴 수 없습니다’
  - ‘너무 놀랍습니다 … 이해하지 못합니다’
  rationale: 이 절은 교리 진술보다 지혜문학의 겸손한 인식 고백에 가깝습니다. 따라서 신학적 해설을 덧붙이지 않고, 원문의 절제된 놀라움과 무지의 대조를 보존했습니다.
  doctrine_reference: 잠언 30장 지혜문학의 관찰과 겸손
- issue: x/x+1 수사구조
  chosen_reading: ‘세 가지… 네 가지…’로 히브리어의 증가 병렬을 유지했습니다.
  alternative_readings:
  - ‘셋… 넷…’
  - ‘세 가지가… 네 가지가…’
  rationale: 히브리어 격언의 리듬은 숫자의 점증에 있습니다. 한국어에서도 ‘세 가지 / 네 가지’의 병렬로 그 구조를 가장 자연스럽게 전달할 수 있습니다.
  doctrine_reference: 히브리어 지혜문학의 병행법
