id: PRO.30.1
reference: Proverbs 30:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבְרֵ֤י אָג֥וּר בִּן יָקֶ֗ה הַ/מַּ֫שָּׂ֥א נְאֻ֣ם הַ֭/גֶּבֶר לְ/אִֽיתִיאֵ֑ל לְ/אִ֖יתִיאֵ֣ל וְ/אֻכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
  footnotes:
  - marker: a
    text: Or, possibly, “The words of Agur son of Jakeh of Massa,” taking הַמַּשָּׂא as a place or tribal name rather than “the oracle.”
    reason: alternative_reading
  - marker: b
    text: Or, possibly, “I am weary, O God; I am weary, O God, and worn out,” if the final words are repointed as a verbal clause rather than read as the names Ithiel and Ucal.
    reason: alternative_reading
translation:
  language: ko
  text: 야게의 아들 아굴의 말씀, 곧 신탁입니다. 이 사람이 이디엘에게, 이디엘과 우갈에게 한 선언입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야게의 아들 아굴, 곧 마사 사람의 말씀”으로 볼 수 있습니다. 이 경우 הַמַּשָּׂא를 ‘신탁’이 아니라 지명 또는 집단명인 ‘마사’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 마지막 말을 이름들이 아니라 “나는 지쳤습니다, 하나님이여. 나는 지쳤습니다, 하나님이여, 그리고 소진되었습니다”라는 동사절로 다시 모음할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말입니다 / 말씀
  alternatives_korean:
  - 말씀들입니다
  - 말들입니다
  lexicon: HALOT
  rationale: 표제문 형식의 דִּבְרֵי를 한국어에서는 자연스러운 서두인 ‘말’로 옮기되, 뒤의 ‘말씀’으로 격식을 살려 지혜문학 표제의 어조를 유지했습니다.
- source_word: הַמַּשָּׂא
  english_pob_choice: the oracle
  chosen_korean: 말씀
  alternatives_korean:
  - 예언
  - 짐
  - 마사
  lexicon: HALOT
  rationale: 문맥상 지혜서의 표제에서 ‘oracle’에 해당하는 공적 선언의 성격을 살려 ‘말씀’으로 처리했습니다. 본문의 애매성은 주석으로 보존합니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 이 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: HALOT
  rationale: 직역적 ‘그 남자’보다 표제문의 화자 지시를 자연스럽게 드러내는 ‘이 사람’을 택해, 문장의 수사적 자기지시를 살렸습니다.
- source_word: לְאִיתִיאֵל ... לְאִיתִיאֵל וְאֻכָל
  english_pob_choice: to Ithiel, to Ithiel and Ucal
  chosen_korean: 이디엘에게, 이디엘과 우갈에게
  alternatives_korean:
  - 이디엘에게, 이디엘과 우칼에게
  - 이디엘에게, 이디엘과 유갈에게
  lexicon: HALOT
  rationale: 두 이름을 고유명사로 유지하고, 반복 구조를 그대로 살려 원문의 호칭 배열을 보존했습니다. 음역은 현대 한국어 표기 관행에 맞추되, 원문의 어려움은 주석으로 남깁니다.
theological_decisions:
- issue: הַמַּשָּׂא의 의미를 ‘oracle’로 볼지 고유명사로 볼지
  chosen_reading: 본문은 공통명사적 표제어로 읽어 ‘말씀’으로 옮겼습니다.
  alternative_readings:
  - ‘마사’라는 지명/집단명으로 읽기
  - ‘짐’으로 직역하기
  rationale: 문법상 정관사가 붙은 표제어로 읽는 해석이 자연스럽고, 지혜서 서문에서 공적 선언의 기능을 가장 잘 드러냅니다. 다만 다른 유력 해석이 있으므로 본문 주석으로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: 해석상 긴장은 주석으로 보존하고 본문에서 무리하게 단정하지 않습니다.'
- issue: וְאֻכָל을 이름으로 읽을지 동사로 재모음할지
  chosen_reading: 마소라 본문을 따라 고유명사 ‘우갈’로 읽었습니다.
  alternative_readings:
  - ‘내가 지쳤다’
  - ‘내가 소진되었다’
  rationale: 받침점이 이름을 지시하는 형태이므로 본문은 고유명사로 유지했습니다. 동사로 읽는 대안은 본문 의미를 크게 바꾸므로 주석으로만 처리합니다.
  doctrine_reference: 'Translation philosophy §3: 본문 전승이 가진 애매성을 삭제하지 않습니다.'
