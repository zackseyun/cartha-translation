  - severity: medium
    issue: הַמַּשָּׂא를 ‘말씀’으로 번역
    rationale: 앞선 דִּבְרֵי의 ‘말씀’과 구별되지 않아 원문의 두 표제 요소와 영어 감사본의 ‘oracle’을 모두 흐립니다. ‘신탁’이 더 직접적입니다.
  - severity: medium
    issue: 각주 a의 대안 문구가 한국어 문법상 불명확함
    rationale: ‘아굴의 말, 야게의 아들, 마사 사람의 말씀’은 수식 관계가 분명하지 않습니다. 마사를 아굴의 출신/소속으로 읽는 대안을 명료하게 제시해야 합니다.
