  text: מֶ֭לֶךְ אֵ֣ין לָ/אַרְבֶּ֑ה וַ/יֵּצֵ֖א חֹצֵ֣ץ כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
  footnotes:
  - marker: a
    text: Or 'and they go out divided,' that is, arranged in bands or divisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 메뚜기에는 왕이 없지만, 그것들은 모두 무리를 지어 나갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나뉘어 나간다’, 곧 무리나 구분으로 조직되어 나간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 통치자
  - 임금
  lexicon: HALOT
  rationale: מֶלֶךְ는 기본적으로 왕을 뜻하므로, 짧은 잠언의 동물 비유에서는 가장 सीधे적인 대응어인 ‘왕’이 적절합니다.
- source_word: אֵין לָ/אַרְבֶּה
  english_pob_choice: have no / the locusts
  chosen_korean: 메뚜기에는 … 없다
  alternatives_korean:
  - 메뚜기에게는 … 없다
  - 메뚜기들은 … 없다
  lexicon: HALOT
  rationale: 히브리어의 부정 존재 구문을 한국어에서는 ‘-에는 … 없다’로 자연스럽게 옮기면, 메뚜기에게 왕이 없다는 소유·존재 관계가 분명해집니다.
- source_word: וַיֵּצֵא חֹצֵץ
  english_pob_choice: yet all of them march out in ranks
  chosen_korean: 무리를 지어 나갑니다
  alternatives_korean:
  - 줄지어 나갑니다
  - 대열을 지어 나갑니다
  - 나뉘어 나갑니다
  lexicon: HALOT
  rationale: חֹצֵץ는 ‘나뉨/구분됨’의 뜻을 가지지만, 메뚜기의 질서 있는 이동을 가리키는 문맥상 ‘무리를 지어’가 그 의미를 과하게 좁히지 않으면서도 자연스럽습니다.
- source_word: כֻּלּוֹ
  english_pob_choice: all of them
  chosen_korean: 모두
  alternatives_korean:
  - 전부
  - 온통
  lexicon: HALOT
  rationale: 집합적 명사 אַרְבֶּה의 전체성을 한국어에서는 간결하게 ‘모두’로 나타내어, 개별 개체의 총체적 움직임을 살립니다.
theological_decisions:
- issue: 잠언의 동물 비유를 직역할지, 한국어 관용에 맞춰 다듬을지
  chosen_reading: ‘무리를 지어 나갑니다’로 옮겨, 왕이 없는 상태와 질서 있는 이동의 대비를 유지했습니다.
  alternative_readings:
  - ‘대열을 지어 나갑니다’
  - ‘나뉘어 나갑니다’
  rationale: 이 절의 핵심은 메뚜기 무리가 통치자 없이도 질서 있게 움직인다는 역설이므로, 한국어에서도 그 대비가 분명히 드러나야 합니다.
  doctrine_reference: 잠언 30:27의 관찰적 지혜 문장
