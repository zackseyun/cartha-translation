translation:
  language: ko
  text: 노예를 그의 주인에게[a] 비방하지 마십시오. 그렇지 않으면 그가 당신을 저주하고, 당신은 죄책을 지게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예’는 כאן의 עֶבֶד가 가리키는 신분적 구속 상태를 드러내기 위해 선택한 번역입니다. 다른 가능성으로는 ‘종’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּלְשֵׁן
  english_pob_choice: slander
  chosen_korean: 비방하다
  alternatives_korean:
  - 중상하다
  - 모함하다
  - 고발하다
  lexicon: HALOT
  rationale: לטשן 계열 동사는 혀로 남에게 해를 끼치는 악의적 말을 가리키므로, 경고의 금지문에 자연스럽고 도덕적 잘못을 분명히 드러내는 ‘비방하다’가 적절합니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종살이하는 사람
  lexicon: HALOT
  rationale: 이 문맥에서는 신분의 종속성과 취약성이 핵심이므로, 프로젝트 지침에 따라 ‘종’보다 사회적 구속 상태를 더 직접적으로 드러내는 ‘노예’를 사용했습니다.
- source_word: אֶל אדניו
  english_pob_choice: to his master
  chosen_korean: 그의 주인에게
  alternatives_korean:
  - 그의 주에게
  - 그의 상전에게
  lexicon: HALOT
  rationale: אדון + 인칭접미사는 여기서 노예의 소유자/상전 관계를 뜻하므로, 한국어에서는 일상적이면서도 관계를 분명히 하는 ‘주인’이 가장 자연스럽습니다.
- source_word: וְאָשָׁמְתָּ
  english_pob_choice: and you become guilty
  chosen_korean: 죄책을 지게 됩니다
  alternatives_korean:
  - 유죄가 됩니다
  - 죄를 짓게 됩니다
  lexicon: HALOT
  rationale: אשם는 단순한 감정적 죄책감보다 책임이 따르는 죄의 상태를 뜻하므로, 현대 한국어에서 그 결과적 부담을 드러내는 ‘죄책을 지게 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 노예/주인 표현의 직설성
  chosen_reading: 본절의 사회적 약자 보호 경고를 살리기 위해 완곡한 ‘종/주’ 대신 ‘노예/주인’을 유지했습니다.
  alternative_readings:
  - 종/주인
  - 종/상전
  rationale: 지혜문학의 경고는 실제 취약한 노동·소유 관계를 전제로 하며, 이를 약화시키면 경고의 윤리적 날이 무뎌집니다.
  doctrine_reference: 사회윤리와 본문 직역의 투명성
