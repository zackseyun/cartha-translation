review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 소유·지시 관계상 비방의 대상은 ‘그 노예의 주인’이고, 저주하는 이는 그 노예입니다. 이를 명시하면 뜻의 혼동을 막을 수 있습니다. וְאָשָׁמְתָּ는 단순한 심리적 ‘죄책감’보다 죄를 범하여 죄책/책임을 입는 것을 가리키므로 ‘죄를 범하게 됩니다’가 더 적절합니다.
  naturalness: 합쇼체 금지문과 경고문의 흐름은 자연스럽습니다. 그러나 ‘그의 주인’과 ‘그가’는 선행사가 노예인지 주인인지 일시적으로 모호할 수 있으므로 명시적으로 풀어 쓰는 편이 현대 표준어에서 더 명료합니다.
  terminology: ‘노예’와 ‘주인’은 이 문맥의 종속적 사회 관계를 투명하게 드러내며 유지할 수 있습니다. 각주에 남아 있는 ‘כאן’는 한국어 문장에 부적절하게 혼입된 표기이므로 ‘여기서’로 바로잡아야 합니다. ‘종’은 대안 번역으로 제시할 수 있습니다.
  issues:
  - severity: medium
    issue: 대명사 선행사 모호성
    rationale: ‘노예를 그의 주인에게’와 이어지는 ‘그가’는 문법적으로 이해 가능하지만, 한국어에서는 주인이 저주하는 것처럼 잠시 읽힐 수 있습니다. 원문의 관계를 드러내도록 ‘그 노예의 주인’ 및 ‘그 노예가’로 밝혀야 합니다.
  - severity: medium
    issue: ‘죄책을 지게 됩니다’의 의미 범위
    rationale: 이는 심리적 죄책감을 뜻할 수도 있습니다. אשם의 죄책·책임을 입는 결과를 ‘죄를 범하게 됩니다’로 옮기면 경고의 도덕적·법적 책임 의미가 더 분명합니다.
  - severity: low
    issue: 각주의 비한국어 표기 혼입
    rationale: ‘כאן의’는 문맥상 한국어 ‘여기서’가 잘못 삽입된 것으로 보입니다. 독자용 각주에서는 수정이 필요합니다.
  revised_text: 노예를 그 노예의 주인에게 비방하지 마십시오. 그렇지 않으면 그 노예가 당신을 저주하고, 당신은 죄를 범하게 됩니다.
  revised_footnotes:
  - marker: a
    text: ‘노예’는 여기서 히브리어 עֶבֶד가 가리키는 신분적 구속 상태를 드러내기 위해 선택한 번역입니다. 다른 가능성으로는 ‘종’이 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 소유 관계와 저주의 주체를 명확히 하여 한국어 대명사 모호성을 제거했습니다. 또한 아샴의 의미를 심리적 감정보다 죄책과 책임을 입는 결과로 반영하도록 ‘죄를 범하게 됩니다’로 조정했습니다. 각주의 잘못된 외국어 표기를 한국어로 수정했습니다.
