id: PRO.30.6
reference: Proverbs 30:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
  footnotes:
  - marker: a
    text: Or 'and you be found a liar' / 'and you be shown false.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말씀에 더하지 마십시오[a]. 그렇지 않으면 그분께서 당신을 꾸짖으시고, 당신은 거짓말쟁이로 드러납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓말쟁이로 판명됩니다’ / ‘거짓됨이 드러납니다’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תּוֹסְףְּ עַל
  english_pob_choice: Do not add to
  chosen_korean: 더하지 마십시오
  alternatives_korean:
  - 덧붙이지 마십시오
  - 더 보태지 마십시오
  lexicon: HALOT
  rationale: יסף의 금지형을 한국어 경고문답게 간결한 명령 부정으로 옮겼습니다. ‘더하다’가 ‘add to’의 직접 대응이며, 문맥상 말씀에 내용을 보태는 행위를 금지합니다.
- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 말
  - 그의 말씀들
  lexicon: HALOT
  rationale: 30:5의 ‘하나님의 말씀’과 연결되므로, 단순한 ‘말’보다 경외적·문맥적 연결을 살려 ‘말씀’으로 옮겼습니다.
- source_word: יוֹכִיחַ
  english_pob_choice: he rebuke
  chosen_korean: 꾸짖으시고
  alternatives_korean:
  - 책망하시고
  - 질책하시고
  - 꾸짖으실 것입니다
  lexicon: HALOT
  rationale: יכח의 직접적이고 경고적인 의미를 살려 ‘꾸짖다’로 옮겼습니다. 한국어에서도 즉각적 경고와 책망의 뉘앙스가 분명합니다.
- source_word: וְנִכְזָבְתָּ
  english_pob_choice: and you be proved a liar
  chosen_korean: 거짓말쟁이로 드러납니다
  alternatives_korean:
  - 거짓된 사람으로 드러납니다
  - 거짓말하는 자로 판명됩니다
  - 거짓말쟁이로 판명됩니다
  lexicon: HALOT
  rationale: Niphal of כזב의 ‘거짓됨이 드러남’과 도덕적 비난을 함께 담기 위해, 결과 상태를 나타내는 ‘드러납니다’를 택했습니다. ‘거짓말쟁이’는 실질적 함의를 살리되 과도한 해석은 피합니다.
theological_decisions:
- issue: ‘그의’의 지시 대상
  chosen_reading: ‘그의’는 앞절의 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 지혜 교훈 일반의 ‘그의 말씀’으로 더 일반적으로 볼 수 있습니다.
  rationale: 바로 앞절이 하나님의 말씀에 관한 진술이므로, 6절의 경고도 그 말씀에 말을 보태지 말라는 의미로 자연스럽게 이어집니다. 히브리어의 대명사는 그대로 살리되, 문맥상 지시 대상을 반영했습니다.
  doctrine_reference: 잠언 30:5-6 문맥 일관성
- issue: ‘꾸짖다/거짓말쟁이’의 강도
  chosen_reading: 하나님의 말씀을 덧붙이는 행위는 단순한 실수보다 하나님 앞에서의 거짓됨으로 드러난다는 경고를 유지했습니다.
  alternative_readings:
  - ‘책망받는다’처럼 더 완곡하게 옮길 수 있습니다.
  - ‘허위로 판명된다’처럼 법정적 표현을 쓸 수 있습니다.
  rationale: 본문의 경고는 강합니다. 이를 약화하지 않기 위해 ‘꾸짖으시고… 거짓말쟁이로 드러납니다’로 직설성을 유지했습니다.
  doctrine_reference: 계시의 완전성과 말씀에 대한 경외
