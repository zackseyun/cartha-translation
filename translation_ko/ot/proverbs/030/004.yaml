id: PRO.30.4
reference: Proverbs 30:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
  footnotes:
  - marker: a
    text: Or 'the heavens.' Hebrew שָׁמַיִם is formally plural.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''if you know.'' The Hebrew can be taken as an ironic challenge: ''if you know.'''
    reason: lexical_alternative
  - marker: c
    text: Christian interpretation has often seen significance in 'his son's name,' but the Hebrew text itself does not explicitly identify the son.
    reason: cross_reference
translation:
  language: ko
  text: 누가 하늘로 올라갔다가 내려왔습니까? 누가 바람을 자기 손에 모았습니까? 누가 물을 겉옷에 싸맸습니까? 누가 땅의 모든 끝을 세우셨습니까? 그의 이름이 무엇이며, 그의 아들의 이름이 무엇입니까[a][b]? 정말 아시겠습니까!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁמַיִם은 형태상 복수형입니다. 문맥에서는 ‘하늘’로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘만일 네가 안다면’이라는 반어적 도전을 뜻할 수도 있습니다. 본문은 그 도전의 뉘앙스를 살려 ‘정말 아시겠습니까!’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  english_pob_choice: has gone up to heaven and come down
  chosen_korean: 하늘로 올라갔다가 내려왔습니까
  alternatives_korean:
  - 하늘에 올라갔다가 내려왔습니까
  - 하늘로 올랐다가 내려왔습니까
  lexicon: WLC; HALOT
  rationale: 상승-하강의 대조를 살리되 한국어에서는 과거완료보다 서술형 질문이 자연스러워 ‘올라갔다가 내려왔습니까’로 옮겼습니다.
- source_word: בְּחָפְנָיו
  english_pob_choice: in his hands
  chosen_korean: 자기 손에
  alternatives_korean:
  - 자기 주먹에
  - 자기 움켜쥔 손에
  lexicon: HALOT
  rationale: חָפְנָיו는 손바닥/오목한 손의 한 움큼을 가리키므로, 영어 POB의 본문 선택인 ‘hands’를 따라 과도하게 구체화하지 않고 ‘자기 손에’로 자연스럽게 살렸습니다.
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  english_pob_choice: has wrapped the waters in a garment
  chosen_korean: 물을 겉옷에 싸맸습니까
  alternatives_korean:
  - 물을 옷에 감쌌습니까
  - 물을 망토에 싸맸습니까
  lexicon: HALOT
  rationale: צָרַר의 ‘싸다/묶다’와 שִׂמְלָה의 겉옷 이미지를 함께 살리기 위해 ‘겉옷에 싸맸다’로 번역했습니다.
- source_word: מַה שְּׁמוֹ ... וּמַה שֶּׁם בְּנוֹ
  english_pob_choice: What is his name, and what is his son's name
  chosen_korean: 그의 이름이 무엇이며, 그의 아들의 이름이 무엇입니까
  alternatives_korean:
  - 그 이름이 무엇이며, 그 아들의 이름이 무엇입니까
  - 그의 이름은 무엇이며, 그의 아들의 이름은 무엇입니까
  lexicon: HALOT
  rationale: 히브리어의 직설적 질문 구조를 보존했고, ‘아들’도 본문이 명시하므로 약화하지 않았습니다.
theological_decisions:
- issue: כִּי תֵדָע의 종결 감각
  chosen_reading: 정말 아시겠습니까!
  alternative_readings:
  - if you know
  - 혹시 아십니까
  rationale: 문맥상 무지한 청자에게 던지는 수사적 도전이므로, 영어 POB가 회복한 조롱/반어의 힘을 한국어에서는 ‘정말 아시겠습니까!’로 옮겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: ‘그의 아들의 이름’의 의미를 본문 밖으로 확장하지 않음
  chosen_reading: 메시아적 해석을 본문 본문에는 명시하지 않고 질문 형태를 유지함
  alternative_readings:
  - 그 아들을 암시하는 신학적 독해를 본문에 반영
  - 후대 그리스도론적 독해를 본문에 직접 주입
  rationale: 히브리어 본문은 아들의 정체를 밝히지 않으므로, 해석 가능성은 열어 두되 본문이 말하는 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it; OT wisdom literature contextual restraint'
