    issue: ‘누가 땅의 모든 끝을 세우셨습니까?’의 존대 선어말어미
    rationale: 앞선 ‘누가 … 모았습니까/싸맸습니까’와 달리 ‘세우셨습니까’만 존대를 사용하여 문체가 불균형합니다. 불특정 수사적 주체에 대한 본문 문체로는 ‘세웠습니까’가 일관됩니다.
