  rationale: 원문의 직접적인 반복 요구를 보존하고, 무동사 구문을 인과 의미 없이 자연스러운 한국어 존재문으로 옮겼습니다. 마지막의 הוֹן은 영어 POB 감사 기록을 따라 충족을 뜻하는 말로 유지하되, 현대 한국어에 맞게 ‘충분하다’로 다듬었습니다. 각주 표지도 해당 어구 뒤로 이동시켰습니다.
