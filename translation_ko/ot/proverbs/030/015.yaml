  lexicon: HALOT
  rationale: 히브리어의 무동사 구문을 한국어에서는 존재 표현으로 풀어, 간결한 속담체를 유지했습니다.
- source_word: הַב הַב
  english_pob_choice: Give, give
  chosen_korean: “주십시오, 주십시오.”
  alternatives_korean:
  - “주라, 주라.”
  - “더, 더.”
  lexicon: HALOT
  rationale: 반복된 명령형의 압박감을 살리면서도 한국어 성경 문체에 맞게 공손 명령형으로 옮겼습니다. 해석적 ‘더, 더’는 보조 의미로 남기고 본문에는 직설적 요구를 유지했습니다.
- source_word: לֹא אָמְרוּ הוֹן
  english_pob_choice: four never say, “Enough”
  chosen_korean: 네 가지는 “넉넉하다”라고 말하지 않습니다
  alternatives_korean:
  - 네 가지는 “충분하다”라고 말하지 않습니다
  - 네 가지는 “족하다”라고 말하지 않습니다
  - 네 가지는 “이제 됐다”라고 말하지 않습니다
  lexicon: HALOT
  rationale: הוֹן을 ‘wealth’로 읽지 않고 충분함을 뜻하는 관용적 감탄으로 이해한 POB의 결정을 따라, 현대 한국어에서 가장 자연스러운 ‘넉넉하다’로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 격언적 반복과 의인화 표현 유지
  chosen_reading: ‘딸 둘’과 ‘주십시오, 주십시오’의 이미지를 그대로 살려, 탐욕의 성격을 도덕적 설명으로 풀지 않고 속담적 긴장으로 제시했습니다.
  alternative_readings:
  - ‘두 딸’을 ‘두 번 외침’으로 해석해 의역
  - ‘주십시오’를 ‘더 많이’로 완화
  rationale: 본문은 비유적 숫자격언이므로 이미지를 보존하는 것이 독자가 원문 효과를 이해하는 데 더 충실합니다.
  doctrine_reference: 잠언의 지혜 격언 번역 원칙
