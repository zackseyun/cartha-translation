  terminology: ‘거머리’, ‘딸 둘’, ‘세 가지/네 가지’를 유지했습니다. 반복 요구는 공손 청원이 아닌 직접적 요구로 ‘주어라, 주어라’로 옮겼습니다. 마지막 표현은 재산이라는 일반 명사 뜻을 본문에 도입하지 않고 ‘충분하다’로 번역했습니다.
