source:
  edition: WLC
  text: לַֽ/עֲלוּקָ֨ה שְׁתֵּ֥י בָנוֹת֮ הַ֤ב הַ֥ב שָׁל֣וֹשׁ הֵ֭נָּה לֹ֣א תִשְׂבַּ֑עְנָה אַ֝רְבַּ֗ע לֹא אָ֥מְרוּ הֽוֹן׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/015.yaml
  text: 'The leech has two daughters: “Give[a], give.” Three things are never satisfied; four never say[c][b], “Enough.”'
  footnotes:
  - marker: a
    text: Or, “For the leech there are two daughters.” The Hebrew opens with a topic-marking construction that can be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: “Give, give” may represent the daughters’ cry for more; some take it more interpretively as “More, more.”
    reason: lexical_alternative
  - marker: c
    text: Or, “four do not say, ‘It is enough.’” The final word is understood here as an idiom of sufficiency rather than the more common noun sense “wealth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 거머리에게는[a] 딸 둘이 있습니다. “주어라, 주어라.”[b] 세 가지는 만족하지 않으며, 네 가지는 “충분하다”라고 말하지 않습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “거머리에게 두 딸이 있다.” 히브리어는 주제를 앞세우는 ל־로 시작하므로, 더 형식적으로 이렇게 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주어라, 주어라’는 두 딸의 외침을 나타낼 수 있습니다. 일부는 이를 더 해석적으로 ‘더, 더’로 이해합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, “네 가지는 ‘족하다’라고 말하지 않습니다.” 여기서 הוֹן은 흔한 명사 뜻인 ‘재산’보다 충분함을 나타내는 관용적 표현으로 이해됩니다.
    reason: lexical_alternative
