  lexicon: HALOT
  rationale: 여격 표지 ל를 주제 표지처럼 받아 자연스럽게 ‘거머리에게는’으로 옮기되, 속담의 대상을 앞에 세워 주제성을 살렸습니다.
- source_word: שְׁתֵּי בָנוֹת
  english_pob_choice: has two daughters
  chosen_korean: 딸 둘이 있으니
  alternatives_korean:
