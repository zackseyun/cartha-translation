  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ֭יִשׁ גִּבּ֣וֹר בַּ/בְּהֵמָ֑ה וְ/לֹא יָ֝שׁ֗וּב מִ/פְּנֵי כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/030.yaml
  text: the lion[a], mighty among beasts, and does not turn back before any.
  footnotes:
  - marker: a
    text: Or “a lion, mighty among animals.” The Hebrew uses a poetic word for lion and a broad term for animal life.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자[a]는 짐승들 가운데서 힘이 세고, 어떤 앞에서도 물러서지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사자, 곧 짐승들 가운데서 힘센 존재”로도 옮길 수 있습니다. 히브리어는 사자를 가리키는 시적 표현과 동물 세계 전체를 가리키는 넓은 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  english_pob_choice: the lion
  chosen_korean: 사자
  alternatives_korean:
  - 그 사자
  - 한 사자
  lexicon: HALOT
  rationale: לַיִשׁ는 시적 표현의 ‘사자’이므로 한국어에서도 일반적이면서도 격식을 유지하는 ‘사자’로 옮겼습니다. 영어의 정관사 효과는 문맥상 종별 대표를 가리키는 말로 처리했습니다.
- source_word: גִּבּוֹר
  english_pob_choice: mighty
  chosen_korean: 힘이 세고
  alternatives_korean:
  - 강하고
  - 용맹하고
  lexicon: HALOT
  rationale: גִּבּוֹר의 핵심은 힘과 위세이므로, 한국어에서는 자연스럽고 간결한 ‘힘이 세고’로 풀어 짧은 잠언체의 리듬을 살렸습니다.
- source_word: בַּבְּהֵמָה
  english_pob_choice: among beasts
  chosen_korean: 짐승들 가운데서
  alternatives_korean:
  - 동물들 가운데서
  - 짐승들 사이에서
  lexicon: HALOT
  rationale: 여기서 בְּהֵמָה는 특정 가축이 아니라 동물 세계 전체를 가리키므로, 영어 POB의 ‘among beasts’에 맞추어 ‘짐승들 가운데서’로 옮겼습니다.
- source_word: וְלֹא יָשׁוּב
  english_pob_choice: and does not turn back
  chosen_korean: 물러서지 않습니다
  alternatives_korean:
  - 뒤로 물러서지 않습니다
  - 돌아서지 않습니다
  lexicon: HALOT
  rationale: יָשׁוּב의 직역은 ‘돌아서다/되돌아가다’이지만, 문맥상 겁내어 후퇴하지 않는다는 뜻이어서 한국어에서는 ‘물러서지 않습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 보편적 부정문 מִפְּנֵי כֹל의 범위
  chosen_reading: ‘어떤 앞에서도’로 넓게 처리하여 특정 대상에 한정하지 않았습니다.
  alternative_readings:
  - ‘아무 앞에서도’
  - ‘누구 앞에서도’
  rationale: כֹל은 넓은 포괄성을 가지므로, 사자와 맞서는 모든 상대를 포함하는 잠언의 일반 진술로 유지하는 것이 적절합니다.
  doctrine_reference: 잠언의 일반 지혜 진술은 특정 예언적 대상이 아니라 보편적 관찰을 제시합니다.
