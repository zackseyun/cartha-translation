language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
  footnotes:
  - marker: a
    text: Or, 'the knowledge of holy ones.' The Hebrew form is plural, but in Proverbs it can refer to God as 'the Holy One.'
    reason: alternative_reading
translation:
  language: ko
  text: 저는 지혜를 배우지도 못했고, 거룩하신 분에 대한 지식도 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 복수형이지만, 잠언에서는 하나님을 가리키는 말로 쓰일 수 있습니다. 그래서 여기서는 ‘거룩하신 분’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמַדְתִּי
  english_pob_choice: have not learned
  chosen_korean: 배우지도 못했고
  alternatives_korean:
  - 배우지 않았고
  - 익히지 못했고
  lexicon: HALOT
  rationale: 완료형의 현재 결과를 살려, 말하는 이가 지금도 지혜를 획득하지 못한 상태임을 자연스럽게 나타냅니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: HALOT
  rationale: 잠언에서의 표준 대응어로, 실천적·도덕적 지혜의 의미를 가장 직접적으로 전달합니다.
- source_word: דַעַת קְדֹשִׁים
  english_pob_choice: the knowledge of the Holy One
  chosen_korean: 거룩하신 분에 대한 지식
  alternatives_korean:
  - 거룩한 분들의 지식
  - 거룩하신 이의 지식
  lexicon: HALOT
  rationale: 히브리어 복수형의 표면 형태를 존중하면서도, 잠언 9:10과의 연관을 살려 하나님을 가리키는 것으로 자연스럽게 읽히도록 했습니다.
- source_word: אֵדָע
  english_pob_choice: do I know
  chosen_korean: 알지 못합니다
  alternatives_korean:
  - 압니다
  - 알겠습니다
  lexicon: HALOT
  rationale: 화자의 현재적 부정을 분명하게 드러내며, 앞절과의 평행을 한국어로 매끄럽게 유지합니다.
theological_decisions:
- issue: קְדֹשִׁים의 단수/복수 이해
  chosen_reading: 본문은 하나님을 가리키는 단수적 표현으로 옮기되, 원문의 복수 형태가 지닌 모호성은 문맥상 완전히 제거하지는 않았습니다.
  alternative_readings:
  - ‘거룩한 이들’로 복수 이해
  - ‘거룩한 자들’로 일반적 성격 이해
  rationale: 잠언 9:10의 평행 표현이 하나님을 가리키는 관용구를 강하게 뒷받침하므로 단수적 의미가 가장 자연스럽습니다. 다만 히브리어 표면형의 복수성은 해설 없이 숨기지 않도록 번역을 다소 완화했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
