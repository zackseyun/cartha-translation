    rationale: לֹא לָמַדְתִּי는 ‘배우지 않았다/배운 적이 없다’는 뜻이며, 배울 능력이 없었다는 뜻을 직접 표현하지 않습니다.
  - severity: low
    issue: ‘지식도 알지 못합니다’가 한국어에서 의미상 중복되어 어색합니다.
    rationale: 다עת(지식)와 ידע(알다)의 어근 반복은 히브리어에서는 의도된 평행일 수 있으나, 한국어에서는 ‘지식을 가지고 있지 않습니다’로 자연스럽게 옮길 수 있습니다.
  - severity: medium
    issue: 각주가 복수형에 따른 실질적 대안 번역을 명시하지 않습니다.
    rationale: 원문의 קְדֹשִׁים은 형태상 복수이므로, ‘거룩한 이들에 대한 지식’이라는 가능한 독해를 각주에 밝혀 모호성을 보존해야 합니다.
