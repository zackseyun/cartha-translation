  text: דּ֤וֹר חֲרָב֣וֹת שִׁנָּי/ו֮ וּֽ/מַאֲכָל֪וֹת מְֽתַלְּעֹ֫תָ֥י/ו לֶ/אֱכֹ֣ל עֲנִיִּ֣ים מֵ/אֶ֑רֶץ וְ֝/אֶבְיוֹנִ֗ים מֵ/אָדָֽם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
  footnotes:
  - marker: a
    text: Or 'from the land' for 'from the earth.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from man'; here אָדָם is used generically for humankind.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같은 세대는, 그들의 이빨이 칼이고 그들의 송곳니가 칼날이어서, 가난한 사람들을 땅에서, 궁핍한 사람들을 사람들 가운데서 삼켜 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 מֵאֶרֶץ는 ‘땅에서’로도, ‘땅으로부터/땅에서’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מֵאָדָם은 문자적으로는 ‘사람으로부터’이지만, 여기서는 남성 한 사람을 뜻하지 않고 인류 일반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  english_pob_choice: a generation
  chosen_korean: 이와 같은 세대
  alternatives_korean:
  - 한 세대
  - 세대
  lexicon: HALOT
  rationale: 히브리어 דּוֹר는 여기서 특정 집단의 유형을 가리키므로, 단순한 ‘세대’보다 성격을 드러내는 ‘이와 같은 세대’가 문맥의 판단적 뉘앙스를 살립니다.
- source_word: חֲרָבוֹת
  english_pob_choice: swords
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: HALOT
  rationale: חֶרֶב의 복수형은 본래 ‘칼/검’ 계열의 무기를 뜻하므로, 현대 한국어에서는 가장 자연스럽고 직설적인 ‘칼’이 폭력적 비유를 분명하게 전달합니다.
- source_word: מַאֲכָלוֹת
  english_pob_choice: knives
  chosen_korean: 칼날
  alternatives_korean:
  - 식칼
  - 날붙이
  lexicon: HALOT
  rationale: 어근상 ‘먹는 도구’와 연결되지만, 여기서는 이빨과 평행을 이루는 살상 도구이므로 ‘칼날’이 ‘칼’과의 병렬을 살리면서도 과도한 구어체를 피합니다.
- source_word: לֶאֱכֹל עֲנִיִּים מֵאֶרֶץ וְאֶבְיוֹנִים מֵאָדָם
  english_pob_choice: to devour the poor from the earth and the needy from among mankind
  chosen_korean: 가난한 사람들을 땅에서, 궁핍한 사람들을 사람들 가운데서 삼켜 버립니다
  alternatives_korean:
  - 가난한 자들을 땅에서, 궁핍한 자들을 사람 가운데서 먹어 치웁니다
  - 가난한 이들을 땅에서, 궁핍한 이들을 인류 가운데서 삼켜 버립니다
  lexicon: HALOT
  rationale: לֶאֱכֹל은 문자적으로 ‘먹다’이지만 여기서는 약탈적 착취를 가리키므로 ‘삼켜 버립니다’가 영어 POB의 ‘devour’를 자연스럽게 옮기며, 두 빈곤층 명칭의 평행을 유지합니다.
theological_decisions:
- issue: מֵאֶרֶץ의 의미 범위
  chosen_reading: 땅에서
  alternative_readings:
  - 땅
  - 나라에서
  - 땅 위에서
  rationale: 히브리어 אֶרֶץ는 여기서 ‘땅/땅에서’가 가장 무난하며, 뒤의 ‘사람들 가운데서’와 대구를 이루어 보편적 착취의 범위를 드러냅니다.
  doctrine_reference: 시적 병행과 어휘 범위에 대한 번역 원칙
