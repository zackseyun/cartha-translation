translation:
  language: ko
  text: 그런 세대가 있습니다. 그 이빨은 칼이고 그 어금니는 칼이어서, 땅에서[a] 가난한 사람들을, 사람들 가운데서[b] 궁핍한 사람들을 먹어 치웁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘나라/지역’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מֵאָדָם은 문자적으로 ‘사람으로부터’이며, 여기서 אָדָם은 남성 한 사람이 아니라 인류 일반을 가리킵니다.
    reason: lexical_alternative
