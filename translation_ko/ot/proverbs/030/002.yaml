  rationale: The revision retains the source’s explanatory connective and emphatic self-abasement, while making the dative/possessive sense of לִי explicit and using idiomatic modern formal Korean. The footnote preserves the viable alternative sense (‘too brutish/senseless to be a man’) more precisely.
