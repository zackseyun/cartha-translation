    text: Or 'For I am too stupid to be a man, and I do not have the understanding of a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 제가 사람보다 더 짐승 같으며, 제게는 사람의 분별력이 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저는 사람이라 할 수 없을 만큼 우둔하며, 제게는 사람의 분별력이 없습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 실로
  - 그러므로
  lexicon: HALOT
  rationale: 앞말을 설명하는 이유 제시로 읽혀, 문두의 설명적 연결을 자연스럽게 살리기 위해 '이는'으로 옮겼습니다.
- source_word: בַעַר
  english_pob_choice: more brutish
  chosen_korean: 더 짐승 같고
  alternatives_korean:
  - 더 우둔하고
  - 더 미련하고
  - 더 짐승스럽고
  lexicon: HALOT
  rationale: 이 형용사는 단순한 지적 부족보다 동물적·야만적 어조가 강하므로, 자기를 낮추는 뉘앙스를 살려 '짐승 같고'로 옮겼습니다.
- source_word: מֵאִישׁ
  english_pob_choice: than a man
  chosen_korean: 사람보다
  alternatives_korean:
  - 어떤 사람보다
  - 한 사람보다
  - 남자보다
  lexicon: HALOT
  rationale: 비교 전치사의 의미를 살리되 한국어에서는 자연스럽게 비교 대상으로 처리했습니다. '사람'은 איש의 일반적·대표적 의미를 유지합니다.
- source_word: בִינַת אָדָם
  english_pob_choice: human understanding
  chosen_korean: 사람의 분별
  alternatives_korean:
  - 인간의 이해
  - 사람의 이해력
  - 인간 분별력
  lexicon: HALOT
  rationale: בינה는 단순 지식보다 분별·이해력을 가리키므로 '분별'이 가장 핵심을 잘 드러냅니다. אָדָם은 여기서 성별보다 인간 일반을 가리키므로 '사람의'로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 일반적 인류 지시를 한국어에서 어떻게 살릴지
  chosen_reading: 사람의 분별
  alternative_readings:
  - 남자의 분별
  - 인간의 이해
  rationale: 본문은 남성 개인을 대비하는 것이 아니라 인간 일반의 한계를 말하므로, 성별을 좁히지 않고 인류적 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
