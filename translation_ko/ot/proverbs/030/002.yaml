  text: 이는 제가 사람보다 더 짐승 같고, 사람의 분별도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 사람답지 못할 만큼 너무 어리석고, 사람의 분별도 없습니다.”
