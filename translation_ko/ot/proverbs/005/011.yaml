id: PRO.5.11
reference: Proverbs 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָהַמְתָּ֥ בְ/אַחֲרִיתֶ֑/ךָ בִּ/כְל֥וֹת בְּ֝שָׂרְ/ךָ֗ וּ/שְׁאֵרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/011.yaml
  text: and you groan at your end[b][a], when your flesh and your body are consumed.
  footnotes:
  - marker: a
    text: Or 'and you moan' for 'and you groan'; the Hebrew verb conveys an audible cry of distress.
    reason: lexical_alternative
  - marker: b
    text: Or 'in your latter end' or 'at the end of your life'; the Hebrew can refer both to one's final outcome and to life's end.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 네 마지막에 신음하게 될 것입니다[a][b], 네 살과 네 몸이 소진될 때에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 신음하게 될 것이며’로도 옮길 수 있습니다. 히브리어 동사는 고통 속에서 내는 가시적인 소리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 마지막에’ 또는 ‘네 인생의 끝에’로도 옮길 수 있습니다. 히브리어는 최종 결과와 생애의 끝을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  english_pob_choice: and you groan
  chosen_korean: 그리고 너는 … 신음하게 될 것입니다
  alternatives_korean:
  - 그리고 너는 … moan하게 될 것입니다
  - 그리고 너는 … 탄식하게 될 것입니다
  - 그리고 너는 … 신음할 것입니다
  lexicon: HALOT
  rationale: נ־ה־ם 계열의 낮고 거친 울림을 살리기 위해 ‘신음하다’를 택했고, 합쇼체 서술로 미래의 비참한 반응을 드러냈습니다.
- source_word: בְאַחֲרִיתֶךָ
  english_pob_choice: at your end
  chosen_korean: 네 마지막에
  alternatives_korean:
  - 네 끝에
  - 네 나중에
  - 네 인생의 끝에
  lexicon: HALOT
  rationale: ‘마지막/끝/결말’의 중의성을 살리되, 한국어에서는 ‘네 마지막에’가 결과와 생애의 종결을 함께 가장 간결하게 드러냅니다.
- source_word: בְּשָׂרְךָ / וּשְׁאֵרֶךָ
  english_pob_choice: your flesh ... your body
  chosen_korean: 네 살과 네 몸
  alternatives_korean:
  - 네 육체와 네 몸
  - 네 살과 네 지체
  - 네 살과 네 몸뚱이
  lexicon: HALOT
  rationale: ‘살’은 בשר의 구체적 이미지를, ‘몸’은 שׁאר의 전체적 육체 의미를 살리며, 두 표현을 구분해 병렬을 유지했습니다.
theological_decisions:
- issue: 결말을 가리키는 ‘at your end’의 범위
  chosen_reading: 죄의 결과가 최종적 파멸로 귀결되는 개인의 마지막 국면과 삶의 종결을 함께 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘마지막 결과’로만 이해하는 번역
  - 오직 ‘죽음의 순간’으로만 한정하는 번역
  rationale: 히브리어 אַחֲרִית는 결과와 종말을 함께 담을 수 있으므로, 어느 한쪽으로 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 지혜문학의 경고가 현재적 결과와 종말론적 귀결을 함께 지시하는 방식
