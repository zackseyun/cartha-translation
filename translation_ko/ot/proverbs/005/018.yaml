base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
  footnotes:
  - marker: a
    text: Or "your spring" for "your fountain." The Hebrew keeps the water metaphor and may imply both the source of life and marital fertility.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 샘이 복을 받기를 바라며, 젊은 시절의 아내로 말미암아 기뻐하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘샘’은 ‘근원’으로도 옮길 수 있습니다. 히브리어는 물의 은유를 유지하며, 생명의 근원과 혼인의 결실을 함께 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  english_pob_choice: Let ... be
  chosen_korean: …이/가 되게 하시고
  alternatives_korean:
  - …이/가 되기를 바라며
  - …이/가 되게 하십시오
  lexicon: HALOT
  rationale: 희구/명령의 뉘앙스를 자연스러운 현대 한국어로 살리되, 직설적인 명령형보다 문맥상 권면에 가까운 합쇼체로 처리했습니다.
- source_word: מְקוֹרְךָ
  english_pob_choice: your fountain
  chosen_korean: 당신의 샘
  alternatives_korean:
  - 당신의 근원
  - 당신의 샘물
  lexicon: HALOT
  rationale: מָקוֹר의 물 이미지와 성적·생명 이미지가 함께 살아 있으므로, 추상적인 ‘근원’보다 ‘샘’이 더 직접적입니다.
- source_word: בָרוּךְ
  english_pob_choice: blessed
  chosen_korean: 복을 받게
  alternatives_korean:
  - 복되게
  - 복을 받도록
  lexicon: HALOT
  rationale: 형용사적 ‘복되다’보다 여기서는 상태가 복으로 채워지기를 비는 뉘앙스가 자연스러워 ‘복을 받게’로 옮겼습니다.
- source_word: וּשְׂמַח
  english_pob_choice: and rejoice
  chosen_korean: 그리고 … 기뻐하십시오
  alternatives_korean:
  - 그리고 … 즐거워하십시오
  - 그리고 … 즐기십시오
  lexicon: HALOT
  rationale: 뒤이은 권면의 동사로서 ‘rejoice’의 적극적 즐거움을 공손하고 직관적으로 옮겼습니다.
theological_decisions:
- issue: ‘wife of your youth’의 관계적 의미
  chosen_reading: ‘젊은 시절의 아내’로 옮겨, 오랜 언약적 결속과 젊을 때 맞은 아내라는 표지를 함께 드러냈습니다.
  alternative_readings:
  - ‘젊은 아내’
  - ‘젊은 날의 아내’
  rationale: 히브리어 관용구는 단순히 나이가 어린 아내가 아니라, 젊은 시절에 맞이한 아내를 가리키므로 시간 표지를 보존했습니다.
  doctrine_reference: 창세기 2장; 잠언의 혼인 지혜 전통
- issue: 성적 은유의 보존
  chosen_reading: ‘샘’ 이미지를 그대로 유지해 생명과 출산의 은유를 희미하게 하지 않았습니다.
  alternative_readings:
  - ‘근원’
  - ‘샘물’
  rationale: 본문은 물의 은유를 통해 혼인 관계의 생명력과 결실 가능성을 암시하므로, 해설적으로 평탄화하지 않는 것이 소스에 더 충실합니다.
  doctrine_reference: 잠언 5장의 문맥
