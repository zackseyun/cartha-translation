  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֭/מְעַט הָיִ֣יתִי בְ/כָל רָ֑ע בְּ/ת֖וֹךְ קָהָ֣ל וְ/עֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/014.yaml
  text: I was almost in every kind of evil in the midst of the assembly and congregation[a].
  footnotes:
  - marker: a
    text: Or 'I was nearly in utter ruin' or 'I was almost in all evil.' The Hebrew phrase is compact and may emphasize either moral evil or disastrous ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 거의 모든 악 가운데 있었고 — 회중과 모임 한복판에 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 거의 완전한 파멸 가운데 있었습니다” 또는 “내가 거의 모든 악 가운데 있었습니다.” 히브리어 표현은 매우 압축적이어서 도덕적 악이나 재앙적 파멸을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  english_pob_choice: almost
  chosen_korean: 거의
  alternatives_korean:
  - 잠시
  - 간신히
  - 조금만 더
  lexicon: HALOT
  rationale: 히브리어 관용구에서 ‘거의/간신히’의 근접성을 나타내므로, 현대 한국어에서도 가장 자연스럽게 ‘거의’로 옮겼습니다.
- source_word: בְכָל רָע
  english_pob_choice: in every kind of evil
  chosen_korean: 모든 악 가운데
  alternatives_korean:
  - 모든 재앙 가운데
  - 온갖 악 가운데
  - 완전한 파멸 가운데
  lexicon: HALOT
  rationale: 문맥상 도덕적 악과 파멸적 재난의 중의성을 모두 열어 두기 위해, POB의 폭넓은 해석을 따라 ‘모든 악 가운데’로 비교적 직역했습니다.
- source_word: קָהָל וְעֵדָה
  english_pob_choice: assembly and congregation
  chosen_korean: 회중과 모임
  alternatives_korean:
  - 집회와 회중
  - 모임과 공동체
  - 회의와 회중
  lexicon: HALOT
  rationale: 두 유사어의 병렬을 살리되, ‘회중’은 공동체적 집합을, ‘모임’은 더 넓은 공적 모임을 나타내도록 번역했습니다.
theological_decisions:
- issue: 문장 화자와 자기고백의 뉘앙스
  chosen_reading: 화자가 과거를 돌아보며 자기 처지를 고백하는 표현으로, ‘내가 … 있었습니다’라는 반말적 서술이 아니라 평서형 합쇼체로 유지했습니다.
  alternative_readings:
  - 내가 거의 모든 악 가운데 있었습니다
  - 나는 거의 모든 악 가운데 있었습니다
  rationale: 히브리어 פשוט 과거의 회고적 고백을 한국어 현대 문체로 자연스럽게 살리기 위한 선택입니다.
  doctrine_reference: 지혜문학의 경고적 자기고백 문맥
