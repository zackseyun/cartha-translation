    text: 더 직역하면, ‘당신의 샘물이 밖으로 흩어져, 거리의 물줄기가 되라’로 읽을 수 있습니다. 히브리어 형태는 이렇게도 읽을 수 있으나, 넓은 문맥은 수사적 질문을 강하게 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: 물의 이미지는 결혼의 충실함이라는 맥락에서 남자의 성적 생명력과 후손을 비유적으로 가리킵니다(잠언 5:15–18 참조).
    reason: cross_reference
