  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
  footnotes:
  - marker: a
    text: Or, more formally, 'Let your springs be scattered abroad, streams of water in the streets.' The Hebrew form itself can be read this way, but the wider context strongly favors a rhetorical question.
    reason: alternative_reading
  - marker: b
    text: The water imagery refers metaphorically to a man's sexual vitality and offspring in the context of marital faithfulness (see Prov 5:15–18).
    reason: cross_reference
