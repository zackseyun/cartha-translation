  naturalness: ‘그녀의 발/그녀의 걸음’은 선행하는 금지된 여인을 가리키는 문맥에서 현대 한국어의 격식 있는 성경 문체로 이해 가능합니다. ‘스올을 굳게 붙잡습니다’는 직역적 시어이지만 원문의 강한 동작 이미지를 보존하며, 기존의 ‘스올에 굳게 서 있습니다’보다 자연스럽고 정확합니다.
  terminology: מָוֶת은 ‘죽음’, שְׁאוֹל은 음역하여 ‘스올’로 유지했습니다. 스올의 가능한 뜻은 하나의 각주에서만 설명하여, ‘죽음’에 스올 관련 대안을 잘못 연결한 기존 앵커와 중복 각주를 제거했습니다.
