id: PRO.5.19
reference: Proverbs 5:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיֶּ֥לֶת אֲהָבִ֗ים וְֽ/יַעֲלַ֫ת חֵ֥ן דַּ֭דֶּי/הָ יְרַוֻּ֣/ךָ בְ/כָל עֵ֑ת בְּ֝/אַהֲבָתָ֗/הּ תִּשְׁגֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/019.yaml
  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
  footnotes:
  - marker: a
    text: Or 'a graceful ibex.' The Hebrew יַעֲלָה refers to a wild mountain goat.
    reason: lexical_alternative
  - marker: b
    text: Or 'be enraptured always with her love.' The Hebrew verb can literally mean 'go astray,' but here it is used positively for being carried away by love.
    reason: lexical_alternative
translation:
  language: ko
  text: 사랑스러운 암사슴[a], 우아한 산양이여—그의 젖이 언제나 너를 만족하게 하며[b], 너는 늘 그 사랑에 취하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우아한 아이벡스’. 히브리어 יַעֲלָה는 야생 산양을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 젖이 언제나 너를 도취하게 하며’. 히브리어 동사는 문자적으로는 ‘길을 잃다’에 가깝지만, 여기서는 사랑에 사로잡이는 긍정적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  english_pob_choice: a loving doe
  chosen_korean: 사랑스러운 암사슴
  alternatives_korean:
  - 사랑의 암사슴
  - 사랑에 속한 암사슴
  - 사랑스러운 암사슴
  lexicon: HALOT
  rationale: אַיֶּלֶת는 암사슴이고, אֲהָבִים은 사랑과 관련된 수식이므로 성적·정감적 비유를 살리되 자연스러운 표준어로 옮겼습니다.
- source_word: וְיַעֲלַת חֵן
  english_pob_choice: a graceful mountain goat
  chosen_korean: 우아한 산양
  alternatives_korean:
  - 우아한 야생염소
  - 우아한 아이벡스
  - 우아한 산염소
  lexicon: HALOT
  rationale: יַעֲלָה는 야생 산양/아이벡스를 가리키며, חֵן은 아름다움과 우아함을 뜻하므로 이미지가 살아나는 현대어 표현으로 옮겼습니다.
- source_word: דַּדֶּיהָ
  english_pob_choice: her breasts
  chosen_korean: 그의 젖
  alternatives_korean:
  - 그녀의 젖가슴
  - 그녀의 가슴
  - 그의 젖가슴
  lexicon: HALOT
  rationale: 문맥이 결혼의 성적 친밀성을 분명히 하므로 완곡어보다 구체적인 신체 표현을 택했습니다. 한국어에서는 ‘젖’이 다소 직설적이지만 מקור의 육체성을 가장 직접적으로 반영합니다.
- source_word: תִּשְׁגֶּה
  english_pob_choice: be intoxicated
  chosen_korean: 취하십시오
  alternatives_korean:
  - 도취되십시오
  - 황홀해지십시오
  - 즐거워하십시오
  lexicon: HALOT
  rationale: שׁגה는 본래 ‘그릇되다’이지만 여기서는 사랑에 사로잡이는 긍정적·역설적 의미로 쓰이므로, 명령형의 흐름을 살려 ‘취하십시오’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 혼인-성적 비유를 한국어로 얼마나 직설적으로 드러낼지
  chosen_reading: 완곡하게 흐리지 않고, 남편의 아내에 대한 육체적 즐거움을 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 가슴
  - 애정
  - 황홀해지십시오
  rationale: 본문은 간음의 대안으로 아내와의 기쁨을 권하므로, 원문의 감각적·혼인적 이미지를 약화시키지 않는 것이 신학적으로도 적절합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 허락하는 범위에서의 명료성과 직설성 유지'
