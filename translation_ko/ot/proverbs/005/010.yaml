  naturalness: ‘낯선 이들이 당신의 힘으로 배부르게 되고’는 타인이 화자의 자원으로 이득을 얻는 뜻을 자연스럽게 나타냅니다. ‘들어갈까 하여’는 앞 문맥의 권면에 이어지는 פֶּן의 경고 기능을 살리면서, 원문의 전이·귀속 함의를 과도하게 구체화하지 않습니다.
