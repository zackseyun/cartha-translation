id: PRO.5.10
reference: Proverbs 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּֽן יִשְׂבְּע֣וּ זָרִ֣ים כֹּחֶ֑/ךָ וַ֝/עֲצָבֶ֗י/ךָ בְּ/בֵ֣ית נָכְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/010.yaml
  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
  footnotes:
  - marker: a
    text: Or 'be satisfied with your strength.' The Hebrew verb can denote being filled or being satisfied.
    reason: lexical_alternative
  - marker: b
    text: '''Your labors'' may also mean ''the fruit of your labor'' or ''your hard-earned wealth.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않도록, 낯선 사람들이 당신의 힘을 배불리고, 당신의 수고가 이방인의 집으로 가게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 힘에 만족하다’일 수 있습니다. 히브리어 동사는 ‘채워지다’와 ‘만족하다’ 모두를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 수고’는 ‘수고의 열매’ 또는 ‘애써 얻은 재산’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: 그렇지 않도록
  alternatives_korean:
  - 그러지 않도록
  - 그렇게 되지 않도록
  lexicon: HALOT
  rationale: 경고하는 결과를 간결하게 나타내는 표현으로 옮겨, 잠언의 금지·경고 뉘앙스를 살렸습니다.
- source_word: יִשְׂבְּעוּ
  english_pob_choice: be filled
  chosen_korean: 배불리고
  alternatives_korean:
  - 만족하고
  - 충분히 채우고
  - 배부르게 하고
  lexicon: HALOT
  rationale: ‘채워지다/배부르다’의 이미지를 살리되, 한국어에서 자연스러운 서술형으로 정리했습니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 낯선 사람들이
  alternatives_korean:
  - 외인들이
  - 낯선 자들이
  - 이방인들이
  lexicon: HALOT
  rationale: 첫 행의 זָרִים와 둘째 행의 נָכְרִי를 구별하기 위해, 보다 일반적인 관계 밖의 사람을 뜻하는 ‘낯선 사람들’을 택했습니다.
- source_word: וַעֲצָבֶיךָ
  english_pob_choice: your labors
  chosen_korean: 당신의 수고
  alternatives_korean:
  - 당신의 노동
  - 당신의 애쓴 것
  - 당신의 수고의 열매
  lexicon: HALOT
  rationale: 노력으로 얻은 것과 그 고통스러운 수고를 함께 포괄하는 말로, 원문의 노동/수고 의미를 과도하게 특정하지 않도록 했습니다.
- source_word: בְּבֵית נָכְרִי
  english_pob_choice: the house of a foreigner
  chosen_korean: 이방인의 집
  alternatives_korean:
  - 외국인의 집
  - 낯선 사람의 집
  - 외인의 집
  lexicon: HALOT
  rationale: נָכְרִי의 외부자·타자 의미를 살려 ‘이방인’으로 옮기되, 한국어에서 자연스러운 소유격 구조로 정리했습니다.
theological_decisions:
- issue: 잠언의 경고 어조를 한국어로 어떻게 재현할지
  chosen_reading: 직설적 예언이 아니라 결과를 경고하는 잠언의 어조로, ‘그렇지 않도록’이라는 완곡한 경고문 형태를 유지했습니다.
  alternative_readings:
  - 직역형의 ‘~할까 하여’
  - 설명형의 ‘~하지 않도록 조심하십시오’
  rationale: 히브리어 פֶּן은 금지보다 바람직하지 않은 결과를 경고하는 기능이므로, 한국어에서도 그 긴장감을 보존했습니다.
  doctrine_reference: 잠언 문학의 교훈적·지혜문학적 화용론
