translation:
  language: ko
  text: 낯선 이들이 당신의 힘으로 배부르게 되고[a], 당신의 수고[b]가 타인의 집에 들어갈까 하여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 힘에 만족하게 되고’. 히브리어 동사는 ‘배부르다’, ‘채워지다’, 또는 ‘만족하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 수고’는 ‘수고의 열매’ 또는 ‘애써 얻은 재산’을 뜻할 수도 있습니다.
    reason: lexical_alternative
