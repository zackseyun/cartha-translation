  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
  footnotes:
  - marker: a
    text: Or 'be satisfied with your strength.' The Hebrew verb can denote being filled or being satisfied.
    reason: lexical_alternative
  - marker: b
    text: '''Your labors'' may also mean ''the fruit of your labor'' or ''your hard-earned wealth.'''
