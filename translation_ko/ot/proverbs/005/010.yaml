theological_decisions:
- issue: 잠언의 경고 어조를 한국어로 어떻게 재현할지
  chosen_reading: 직설적 예언이 아니라 결과를 경고하는 잠언의 어조로, ‘그렇지 않도록’이라는 완곡한 경고문 형태를 유지했습니다.
  alternative_readings:
  - 직역형의 ‘~할까 하여’
  - 설명형의 ‘~하지 않도록 조심하십시오’
  rationale: 히브리어 פֶּן은 금지보다 바람직하지 않은 결과를 경고하는 기능이므로, 한국어에서도 그 긴장감을 보존했습니다.
  doctrine_reference: 잠언 문학의 교훈적·지혜문학적 화용론
