  source_fidelity: 히브리어 וְאַחֲרִיתָהּ는 문자적으로 ‘그 여자의 끝/결말’을 뜻합니다. 초안의 ‘끝에는’은 시간 부사로 읽혀 소유 접미사가 가리키는 여성의 결말이라는 의미가 약화됩니다. ‘쑥처럼 쓰고 양날 칼처럼 날카롭습니다’는 מָרָה, כַלַּעֲנָה, חַדָּה, כְּחֶרֶב פִּיּוֹת의 비유와 병렬을 충실히 반영합니다.
  naturalness: ‘그러나 그 여자의 끝은 쑥처럼 쓰고 양날 칼처럼 날카롭습니다’는 현대 표준어 합쇼체로 자연스럽고, 잠언의 간결한 병렬 표현을 유지합니다. ‘양날 칼’은 ‘두 날 가진 칼’보다 더 관용적입니다.
  terminology: ‘쑥’은 לענה의 전통적 성경 번역어로 적절합니다. 다만 식물학적 동일성을 단정하지 않도록 각주를 쓴맛의 이미지에 초점을 맞추어 정리했습니다. ‘양날 칼’은 חֶרֶב פִּיּוֹת(두 날/날들이 있는 칼)의 자연스러운 대응입니다.
