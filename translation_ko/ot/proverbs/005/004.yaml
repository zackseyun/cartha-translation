  footnotes:
  - marker: a
    text: ‘쑥’은 히브리어 לענה의 통상적 한국어 대응으로, 여기서는 식물명 자체보다 ‘쓰라림’의 비유를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  english_pob_choice: but in the end she
  chosen_korean: 그러나 끝에는
  alternatives_korean:
  - 그러나 그녀의 끝은
  - 그러나 나중에는
  lexicon: HALOT
  rationale: אַחֲרִית의 핵심은 ‘끝, 결말, 마지막 결과’이므로, 문맥상 여성 대상의 최종 결과를 드러내되 한국어에서는 직접 주어 반복보다 ‘끝에는’으로 자연스럽게 옮겼습니다.
- source_word: מָרָה
  english_pob_choice: is bitter
  chosen_korean: 쓰고
  alternatives_korean:
  - 쓴
  - 쓴맛이 나고
  lexicon: HALOT
  rationale: 문장의 술어적 형용사로서 ‘쓰다’가 가장 직접적이며, ‘쑥처럼’과의 병렬을 살려 감각적·비유적 쓴맛을 유지합니다.
- source_word: כַלַּעֲנָה
  english_pob_choice: like wormwood
  chosen_korean: 쑥처럼
  alternatives_korean:
  - 압신토스처럼
  - 쓴풀처럼
  lexicon: HALOT
  rationale: לענה는 성서에서 비유적으로 쓰이는 쓴 식물로, 한국어 성경에서 가장 익숙하고 투명한 대응은 ‘쑥’입니다. 다만 이는 완전한 식물학적 동일성보다 비유의 효과를 살리는 선택입니다.
- source_word: כְחֶרֶב פִּיּוֹת
  english_pob_choice: like a double-edged sword
  chosen_korean: 두 날 가진 칼처럼
  alternatives_korean:
  - 양날 칼처럼
  - 두 날의 칼처럼
  lexicon: HALOT
  rationale: פִּיּוֹת는 문자적으로 ‘입들/날들’의 관용으로 두 날을 뜻하므로, 한국어에서는 현대적이고 직관적인 ‘두 날 가진 칼’로 옮겨 이미지를 보존했습니다.
