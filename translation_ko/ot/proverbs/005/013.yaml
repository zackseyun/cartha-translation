  source_fidelity: 첫 절의 מוֹרָי와 둘째 절의 מְלַמְּדַי는 모두 복수 1인칭 소유형입니다. 초안은 둘째 대상을 단수인 ‘내 가르치는 자에게’로 옮겨 복수성을 잃었습니다. 또한 שׁמע בְּקוֹל의 ‘듣다/귀 기울이다’와 הִטָּה אָזֶן의 관용적 ‘귀를 기울이다’를 보존할 수 있습니다.
  naturalness: ‘내 교훈하는 자들’, ‘내 가르치는 자’는 현대 표준 한국어에서 다소 부자연스럽고, ‘…하였나니’는 요청된 현대 합쇼체와 맞지 않습니다. ‘내 스승들’, ‘나를 가르친 이들’ 및 ‘…않았습니다’가 자연스러운 현대 문어체입니다.
  terminology: ‘스승’과 ‘나를 가르친 이들’은 교육·지혜 문맥을 자연스럽게 나타내며, 두 히브리어 교육 관련 명사의 반복도 과도하게 해석하지 않고 반영합니다. 각주에서는 שׁמע가 이 문맥에서 ‘순종하다/따르다’의 뉘앙스를 지닐 수 있음을 대안으로 유지합니다.
