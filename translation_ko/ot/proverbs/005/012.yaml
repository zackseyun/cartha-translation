base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/012.yaml
  text: and you say[a], “How I hated discipline[b], and my heart despised reproof!”
  footnotes:
  - marker: a
    text: Or “and you will say,” reflecting the Hebrew perfect used in a future or consequential sense within the father's warning.
    reason: lexical_alternative
  - marker: b
    text: “Reproof” may also be rendered “rebuke” or “correction.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너는 이렇게 말할 것입니다[a]. “어찌하여 내가 훈계를 미워하고 내 마음은 책망을[b] 멸시하였던가!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 너는 말합니다.” 히브리어 완료형은 이 문맥에서 미래적·결과적 의미를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘책망’은 ‘질책’이나 ‘교정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and you say
  chosen_korean: 그리고 너는 말하게 될 것입니다
  alternatives_korean:
