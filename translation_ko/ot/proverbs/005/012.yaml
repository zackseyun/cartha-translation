  - 그때 너는 말할 것입니다
  lexicon: HALOT
  rationale: 예언적·후결적 맥락에서 히브리어 완료형 2인칭은 미래적/결과적 진술로 읽히므로, 직설적인 미래 표현을 써서 후회의 발화를 자연스럽게 살렸습니다.
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 어떻게
  - 아, 어찌
  lexicon: HALOT
  rationale: 정보 질문이 아니라 탄식형 감탄이므로, 한국어에서도 탄식의 정서를 드러내는 ‘어찌’를 택했습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교훈
  - 교정
  lexicon: HALOT
  rationale: 잠언에서의 מוּסָר는 교육과 교정의 힘을 함께 가지므로, 너무 형벌 쪽으로 기울지 않으면서도 권면의 강도를 살리는 ‘훈계’를 선택했습니다.
- source_word: וְתוֹכַחַת
  english_pob_choice: reproof
  chosen_korean: 책망
  alternatives_korean:
  - 질책
  - 경책
  - 훈계
  lexicon: HALOT
  rationale: תוֹכַחַת은 말로 하는 바로잡음이나 꾸짖음을 뜻하므로, ‘훈계’와 짝을 이루면서도 말의 교정성을 분명히 드러내는 ‘책망’이 적절합니다.
theological_decisions:
- issue: 지혜 문학의 회개적 후회 진술을 현재형·미래형 어느 쪽으로 살릴지
  chosen_reading: 미래적 결과를 드러내는 ‘말하게 될 것입니다’로 번역했습니다.
  alternative_readings:
  - 그리고 너는 말합니다
  - 그리고 너는 말할 것입니다
  rationale: 문맥상 실제로 벌어진 일이 아니라 경고 속에서 예상되는 후회의 발화를 말하므로, 한국어에서도 결과적 미래를 분명히 하는 편이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 지혜문학의 훈계 수용과 회개의 서사적 경고
