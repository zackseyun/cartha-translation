  source_fidelity: 초안은 첫째 명사 בּוֹרֶךָ(‘당신의 저수조/물 저장고’)와 둘째 בְּאֵרֶךָ(‘당신의 우물’)를 모두 ‘우물’로 옮겨 원문의 의도적인 병행과 어휘 구별을 잃었습니다. 또한 מִתּוֹךְ(‘안에서/속에서’)의 뜻도 둘째 행에 반영되어야 합니다. 수정문은 단수 명령 שְׁתֵה를 한국어의 연결형+종결 명령으로 자연스럽게 보존하고, נֹזְלִים의 타원적 ‘흐르는 물’도 유지합니다.
  naturalness: ‘당신의 저수조에서 물을 마시고, 당신의 우물 안에서 흘러나오는 물을 마시십시오’는 현대 표준어로 이해 가능하며 합쇼체 종결을 일관되게 사용합니다. ‘저수조’는 다소 기술적인 말이지만, 우물과 구별되는 ‘cistern’의 구체적 물 저장 시설을 가장 간결하게 나타냅니다.
