    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 네가 분별[a]을 지키고 네 입술[b]이 지식을 간직하게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분별’은 여기서 מְזִמּוֹת의 긍정적 의미를 따른 번역입니다. 문맥에 따라 ‘신중함’이나 ‘지혜로운 판단’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 입술’은 문자적 표현입니다. 문맥상 지식을 간직하거나 드러내는 말하기를 가리킵니다.
    reason: lexical_alternative
