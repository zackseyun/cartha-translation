  lexicon: HALOT
  rationale: 비교 구문을 살리면서 현대 한국어에서 자연스러운 형용사로 옮기기 위해 ‘부드럽습니다’를 택했습니다. POB의 비교 의미와 연결되도록 ‘더’를 넣었습니다.
theological_decisions:
- issue: זָרָה의 의미 범위
  chosen_reading: ‘음녀’로 번역해 성적·도덕적 금지의 함의를 드러냈습니다.
  alternative_readings:
  - 낯선 여자
  - 외국 여자
  - 간음한 여자
  rationale: 잠언의 지혜문맥에서 이 표현은 혈통이 아니라 관계의 불법성과 유혹의 위험을 가리키므로, 독자가 즉시 경고의 성격을 읽도록 ‘음녀’를 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
