  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
  footnotes:
  - marker: a
    text: Or 'a strange woman,' 'a foreign woman,' or 'an adulteress.' The Hebrew term in Proverbs often refers to a woman outside the bounds of lawful sexual relationship.
    reason: lexical_alternative
  - marker: b
    text: Literally 'her palate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 음녀의 입술은 꿀을 뚝뚝 떨어뜨리고, 그의 입천장은 기름보다 더 부드럽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 여자’, ‘외국 여자’, ‘간음한 여자’일 수 있습니다. 히브리어 이 표현은 잠언에서 흔히 합법적 성관계의 경계를 벗어난 여자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그녀의 입천장’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 참으로
  - 이는
  - for
  lexicon: HALOT
  rationale: 문맥상 앞선 경고를 뒷받침하는 설명적 연결이므로, 한국어에서는 원인·근거를 자연스럽게 밝히는 ‘왜냐하면’이 가장 잘 맞습니다.
- source_word: זָרָה
  english_pob_choice: a forbidden woman
  chosen_korean: 음녀
  alternatives_korean:
  - 낯선 여자
  - 외국 여자
  - 간음한 여자
  lexicon: HALOT
  rationale: 잠언에서 이 어휘는 단순한 민족적 외국인이 아니라 성적으로 금지된 여성을 가리키는 지혜문학적 용례가 강하므로, 그 도덕적 의미를 드러내는 ‘음녀’로 옮겼습니다.
- source_word: חִכָּהּ
  english_pob_choice: her palate
  chosen_korean: 그의 입천장
  alternatives_korean:
  - 그녀의 입천장
  - 그의 입
  - 그의 미각
  lexicon: HALOT
  rationale: 직역상 ‘입천장’이 맞고, 히브리어의 신체적 비유를 살리기 위해 의역인 ‘입’보다 구체적인 해부학적 표현을 유지했습니다.
- source_word: וְחָלָק מִשֶּׁמֶן
  english_pob_choice: is smoother than oil
  chosen_korean: 기름보다 더 부드럽습니다
  alternatives_korean:
  - 기름보다 더 매끈합니다
  - 기름보다 더 미끈합니다
  - 기름보다 더 매끄럽습니다
  lexicon: HALOT
  rationale: 비교 구문을 살리면서 현대 한국어에서 자연스러운 형용사로 옮기기 위해 ‘부드럽습니다’를 택했습니다. POB의 비교 의미와 연결되도록 ‘더’를 넣었습니다.
theological_decisions:
- issue: זָרָה의 의미 범위
  chosen_reading: ‘음녀’로 번역해 성적·도덕적 금지의 함의를 드러냈습니다.
  alternative_readings:
  - 낯선 여자
  - 외국 여자
  - 간음한 여자
  rationale: 잠언의 지혜문맥에서 이 표현은 혈통이 아니라 관계의 불법성과 유혹의 위험을 가리키므로, 독자가 즉시 경고의 성격을 읽도록 ‘음녀’를 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
