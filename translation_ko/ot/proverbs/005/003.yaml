base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
  footnotes:
  - marker: a
    text: Or 'a strange woman,' 'a foreign woman,' or 'an adulteress.' The Hebrew term in Proverbs often refers to a woman outside the bounds of lawful sexual relationship.
    reason: lexical_alternative
  - marker: b
    text: Literally 'her palate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 금지된 여자[a]의 입술에서 꿀이 떨어지고, 그 여자의 입천장[b]은 기름보다 더 매끄럽기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 여자’, ‘외국 여자’, 또는 ‘간음한 여자’. 이 히브리어 표현은 잠언에서 흔히 합법적인 성관계의 범위 밖에 있는 여자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 입천장’입니다. 문맥상 입이나 말을 비유적으로 가리킬 수도 있습니다.
    reason: lexical_alternative
