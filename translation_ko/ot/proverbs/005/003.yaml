revisions:
- from: 왜냐하면 음녀의 입술은 꿀을 뚝뚝 떨어뜨리고, 그의 입천장은 기름보다 더 부드럽습니다.[a][b]
  to: 이는 금지된 여자[a]의 입술에서 꿀이 떨어지고, 그 여자의 입천장[b]은 기름보다 더 매끄럽기 때문입니다.
