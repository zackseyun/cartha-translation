  rationale: עָוֹן의 복수형은 단순한 개별 죄보다 도덕적 왜곡과 책임을 포함한 ‘죄악’의 뉘앙스를 강하게 지니므로, 한국어도 그 무게를 살려 옮겼습니다.
- source_word: יִלְכְּדֻנוֹ
