  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
  footnotes:
  - marker: a
    text: Or 'the wicked'; the Hebrew is singular masculine.
    reason: lexical_alternative
  - marker: b
    text: Or 'ropes' instead of 'cords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 죄악들은 악한 사람을 붙잡고, 그의 죄의 줄에 그는 굳게 매입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 사람’이 아니라 ‘악인’으로도 옮길 수 있습니다. 히브리어는 남성 단수형입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘줄’ 대신 ‘밧줄’ 또는 ‘끈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוֹּנוֹתָיו
  english_pob_choice: his iniquities
  chosen_korean: 그의 죄악들은
  alternatives_korean:
  - 그의 죄들은
  - 그의 악행들은
  lexicon: HALOT
  rationale: עָוֹן의 복수형은 단순한 개별 죄보다 도덕적 왜곡과 책임을 포함한 ‘죄악’의 뉘앙스를 강하게 지니므로, 한국어도 그 무게를 살려 옮겼습니다.
- source_word: יִלְכְּדֻנוֹ
  english_pob_choice: will capture
  chosen_korean: 붙잡고
  alternatives_korean:
  - 사로잡고
  - 덮치고
  lexicon: HALOT
  rationale: לָכַד의 핵심 의미는 ‘잡다, 사로잡다’이므로, 시적 이미지와 자연스러운 문장을 함께 살릴 수 있는 ‘붙잡고’를 택했습니다.
- source_word: הָרָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 악한 자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형의 실체화된 형용사이지만, 한국어에서는 성별 표지를 과도하게 드러내기보다 인물 지시를 분명히 하는 ‘악한 사람’이 본문의 일반명사적 용법을 잘 드러냅니다.
- source_word: חַטָּאתוֹ
  english_pob_choice: his sin
  chosen_korean: 그의 죄의 줄
  alternatives_korean:
  - 그의 죄의 끈
  - 그의 죄의 밧줄
  lexicon: HALOT
  rationale: ‘줄’은 חֶבֶל의 물리적 도구성을 자연스럽게 살리면서도 뒤의 ‘굳게 매입니다’와 결합해 속박 이미지를 분명히 전달합니다.
- source_word: יִתָּמֵךְ
  english_pob_choice: he will be held fast
  chosen_korean: 굳게 매입니다
  alternatives_korean:
  - 붙들립니다
  - 잡혀 있습니다
  - 매여 있습니다
  lexicon: HALOT
  rationale: נִפְעַל형 תמך는 여기서 ‘지지되다’가 아니라 ‘단단히 붙들려 속박되다’의 뜻으로 보이므로, 결과 상태를 드러내는 ‘굳게 매입니다’로 옮겼습니다.
theological_decisions:
- issue: 죄가 스스로를 얽는 인과 구조
  chosen_reading: 이 절은 악인이 외부의 임의적 힘이 아니라 자기 죄악과 죄 자체에 의해 포획되고 구속되는 모습을 말합니다.
  alternative_readings:
  - 단순히 나쁜 결과가 따른다는 일반적 교훈
  - 징벌의 기계적 법칙을 말하는 표현
  rationale: 두 개의 포획/속박 이미지는 죄가 죄인을 붙드는 도구가 된다는 지혜문학적 인과를 분명히 하므로, 그 긴장을 풀지 않고 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it; §4, gender-accurate over gender-neutral.
