  to: 악인은 자기 죄악에 사로잡히고, 자기 죄의 줄에 굳게 매입니다.[a][b]
  rationale: 수정문은 죄악이 악인을 포획하고 죄의 줄이 그를 속박한다는 원문의 평행 이미지를 유지합니다. 수동 구문 ‘사로잡히고’는 히브리어의 능동형이 나타내는 인과 관계를 한국어에서 자연스럽게 표현하며, ‘자기’를 사용하여 죄와 악인의 관계를 명확히 했습니다. 각주 a는 불필요한 부정 대조를 제거하여 대안 번역과 히브리어 남성 단수 정보를 명료하게 제시했습니다.
