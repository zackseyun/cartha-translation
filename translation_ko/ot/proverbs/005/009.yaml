translation:
  language: ko
  text: 당신의 명예를 남에게 주지 않도록 하십시오[a], 또 당신의 세월을 잔인한 자에게 주지 않도록 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명예’는 히브리어 הוֹד의 가능한 뜻인 ‘영광’, ‘위엄’, ‘기력’도 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잔인한 자’는 ‘잔인한 사람’, ‘무자비한 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
