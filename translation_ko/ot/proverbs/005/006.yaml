id: PRO.5.6
reference: Proverbs 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
  footnotes:
  - marker: a
    text: Or, 'you do not know,' if the final clause is taken as addressing the listener rather than describing the woman.
    reason: alternative_reading
  - marker: b
    text: Or, 'Lest you ponder the path of life; her paths wander.' The Hebrew of this verse is compact and has been understood in more than one way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 생명의 길을 평탄하게 하지 못하게 하려는 듯, 그녀의 길들은 흔들리며, 그녀는 그것을 알지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 마지막 절을 청자에게 직접 말하는 것으로 보면 ‘당신은 그것을 알지 못합니다’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘생명의 길을 숙고하게 하려는 듯; 그녀의 길들은 흔들립니다’로도 옮길 수 있습니다. 히브리어 원문은 매우 압축되어 있어 여러 방식으로 이해되어 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח חַיִּים
  english_pob_choice: the path of life
  chosen_korean: 생명의 길
  alternatives_korean:
  - 생명으로 가는 길
  - 삶의 길
  lexicon: HALOT
  rationale: אֹרַח은 구체적 ‘길/통로’이고 חַיִּים은 ‘생명’이므로, 한국어에서도 압축된 비유를 살려 ‘생명의 길’로 옮기는 것이 자연스럽습니다.
- source_word: תְּפַלֵּס
  english_pob_choice: level
  chosen_korean: 평탄하게 하지 못하게 하려는 듯
  alternatives_korean:
  - 곧게 하려는 듯
  - 고르게 하려는 듯
  - 저울질하려는 듯
  lexicon: HALOT
  rationale: פלס의 핵심은 길을 고르고 평평하게 만들다/곧게 하다인데, 문맥의 도로 이미지에 맞게 ‘평탄하게 하다’로 살리면 비유가 유지됩니다.
- source_word: נָעוּ מַעְגְּלֹתֶיהָ
  english_pob_choice: her tracks wander
  chosen_korean: 그녀의 길들은 흔들리며
  alternatives_korean:
  - 그녀의 발자취는 흔들리며
  - 그녀의 행로는 빗나가며
  - 그녀의 길들은 방황하며
  lexicon: HALOT
  rationale: מַעְגָּל은 ‘궤적/길’의 반복 어휘이므로 앞의 ‘길’과 구분하면서도 같은 이동 이미지를 살리기 위해 ‘길들’과 ‘흔들리다’를 사용했습니다.
- source_word: לֹא תֵדָע
  english_pob_choice: she does not know it
  chosen_korean: 그녀는 그것을 알지 못합니다
  alternatives_korean:
  - 당신은 그것을 알지 못합니다
  - 그녀는 그것을 모릅니다
  lexicon: HALOT
  rationale: 본문 문맥상 3인칭 여성 주어를 유지하는 읽기가 가장 자연스럽고, 영어 POB의 본문 선택도 이를 따르므로 한국어도 그 흐름을 따라갑니다.
theological_decisions:
- issue: 마지막 절의 주어 해석
  chosen_reading: 끝부분을 계속해서 ‘그녀’에 대한 설명으로 읽었습니다.
  alternative_readings:
  - 끝부분을 청자에게 직접 말하는 ‘당신은 그것을 알지 못합니다’로 읽을 수 있습니다.
  rationale: 3–6절의 흐름이 일관되게 유혹하는 여인을 3인칭으로 묘사하므로, 급작스러운 2인칭 전환보다 본문 흐름을 보존하는 읽기를 본문에 두었습니다. 다만 히브리어 전통의 다른 읽기는 주석으로 남깁니다.
  doctrine_reference: 'Translation philosophy §3: 해석상 긴장을 성급히 해소하지 말고, 본문이 허용하는 범위를 보존합니다.'
