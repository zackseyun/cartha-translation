base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
  footnotes:
  - marker: a
    text: Or 'children.' The Hebrew is masculine plural ('sons'), and the translation preserves that form in keeping with the source wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아들들아[a], 내 말을 들으십시오. 내 입의 말에서 벗어나지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형 ‘아들들’입니다. 번역은 본문 형식을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 전환과 권면의 흐름을 살리되, 한국어에서는 ‘이제’가 가장 자연스럽고 간결하게 시작 전환을 드러냅니다.
- source_word: בָנִים
  english_pob_choice: sons
  chosen_korean: 아들들아
  alternatives_korean:
  - 자녀들아
  - 내 아들들아
  lexicon: HALOT
  rationale: 히브리어 남성 복수 호칭을 살려 ‘아들들아’로 옮겼습니다. 소유격 ‘내’는 본문에 없으므로 덧붙이지 않았습니다.
- source_word: שִׁמְעוּ לִי
  english_pob_choice: listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내 말을 들으라
  - 내게 귀를 기울이십시오
  lexicon: HALOT
  rationale: wisdom 권면의 청각적 주의를 현대 한국어로 자연스럽게 살리되, 단순한 ‘듣다’보다 직접 대상이 분명한 ‘내 말을 들으십시오’로 옮겼습니다.
- source_word: מֵאִמְרֵי פִי
  english_pob_choice: from the words of my mouth
  chosen_korean: 내 입의 말에서
  alternatives_korean:
  - 내 입에서 나오는 말에서
  - 내 입의 말씀에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘입의 말’을 살리되, 한국어 문장 흐름에 맞게 ‘에서’ 구조로 정리했습니다. ‘말씀’은 원문의 일반적 ‘말/발언’보다 종교적 어감을 더해 배제했습니다.
theological_decisions:
- issue: 남성 복수 호칭을 성중립적으로 완화할지 여부
  chosen_reading: ‘아들들아’로 남성 복수 호칭을 유지했습니다.
  alternative_readings:
  - ‘자녀들아’로 포괄화
  - ‘사랑하는 이들아’로 완화
  rationale: 지혜문학의 직접 권면 대상과 히브리어 형태를 보존하기 위해 성중립화하지 않았습니다. 본문이 드러내는 호칭의 표지를 흐리지 않는 것이 우선입니다.
  doctrine_reference: source-faithfulness / lexical transparency
