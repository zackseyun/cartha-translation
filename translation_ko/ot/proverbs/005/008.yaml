translation:
  language: ko
  text: 그 여자에게서 당신의 길을 멀리하고, 그 여자의 집 문간에 가까이 가지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 여자에게서 멀리 떨어져 있으십시오. 그 여자의 집 출입구에 다가가지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְחֵק
  english_pob_choice: Keep ... far
  chosen_korean: 멀리 두고
  alternatives_korean:
  - 멀리하십시오
  - 멀리 떼어 두고
  - 멀리 두십시오
  lexicon: HALOT
  rationale: 히필 명령형의 거리 두기 명령을 한국어에서 자연스럽게 풀어, 단순 상태 묘사보다 의도적인 분리를 드러냈습니다.
- source_word: דַרְכֶּךָ
  english_pob_choice: your way
  chosen_korean: 당신의 길
  alternatives_korean:
  - 당신의 길을
  - 당신의 행로
  - 당신의 삶의 길
  lexicon: HALOT
  rationale: 문맥상 행위와 삶의 방향을 가리키는 비유이므로, 직역적이면서도 현대 한국어에서 자연한 ‘길’을 살렸습니다.
- source_word: וְאַל תִּקְרַב
  english_pob_choice: and do not go near
  chosen_korean: 가까이 가지 마십시오
  alternatives_korean:
  - 가까이 오지 마십시오
  - 가까이하지 마십시오
  - 다가가지 마십시오
  lexicon: HALOT
  rationale: 부정 명령의 금지 뉘앙스를 살리되, 한국어에서는 ‘가까이 가지 마십시오’가 가장 평이하고 분명합니다.
- source_word: פֶּתַח
  english_pob_choice: the entrance of
  chosen_korean: 문턱
  alternatives_korean:
  - 현관
  - 출입구
  - 문
  lexicon: HALOT
  rationale: ‘문턱’은 집의 출입 지점에 대한 경계선을 강조하여, 단순한 문보다 경계의 함의를 더 잘 드러냅니다.
theological_decisions:
- issue: 지혜 문학의 경고를 도덕적 거리 두기 명령으로 유지할지 여부
  chosen_reading: 구체적 공간 이미지(길, 문턱)를 그대로 살려, 유혹에 대한 실천적 회피를 강조했습니다.
  alternative_readings:
  - ‘길’을 추상적으로 ‘행실’로 바꾸는 읽기
  - ‘문턱’을 단순히 ‘문’으로 완화하는 읽기
  rationale: 이 절은 추상 교훈이 아니라 실제 접근 금지를 통해 유혹을 피하라는 지혜의 경고이므로, 공간적 긴장을 약화시키지 않는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 잠언의 지혜 문학적 권고
- issue: 대상 지시 대명사의 성중립성
  chosen_reading: 히브리어의 3인칭 여성 지시를 한국어에서 ‘그녀’가 아닌 ‘그’로 완화하지 않고, 문맥을 따라 ‘그에게서’로 처리했습니다.
  alternative_readings:
  - ‘그녀에게서’
  - 성별을 드러내지 않는 우회 표현
  rationale: 한국어에서는 대상이 이미 앞문맥으로 특정되므로 과도한 성별 표지보다 경고의 직접성을 유지하는 편이 자연스럽습니다.
  doctrine_reference: 원문 문맥 충실성
