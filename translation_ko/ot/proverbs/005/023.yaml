  lexicon: HALOT
  rationale: רֹב의 ‘많음/풍성함’이라는 양적 강조를 살리되, 한국어에서는 ‘많음 가운데서’가 어색한 직역 느낌을 줄이면서도 누적적 강조를 유지합니다.
- source_word: יִשְׁגֶּה
  english_pob_choice: he goes astray
  chosen_korean: 길을 벗어납니다
