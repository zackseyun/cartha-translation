    text: Or 'He will die without discipline, and in the abundance of his folly he will go astray.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 훈계가 없어서 죽고[a], 자기 어리석음이 넘쳐서 길을 벗어납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 훈계 없이 죽을 것이며, 자기 어리석음이 넘쳐 길을 벗어날 것입니다.’
    reason: 히브리어 미완료형은 잠언의 일반적 결과를 나타내는 현재형으로, 또는 미래의 확정적 결과를 나타내는 미래형으로 옮길 수 있습니다. בְּאֵין은 ‘없어서’ 또는 ‘없이’로 번역될 수 있습니다.
