    issue: ‘자기 어리석음의 많음 가운데서’는 비문에 가까우며 의미 관계가 불명확합니다.
    rationale: 한국어에서 ‘-의 많음 가운데서’는 자연스럽지 않고, 소유격 구조가 ‘어리석음이 많다’는 원문의 양적 강조를 부자연스럽게 만듭니다. ‘자기 어리석음이 넘쳐서’는 בְּרֹב의 상황적/인과적 뉘앙스를 자연스럽게 전달합니다.
