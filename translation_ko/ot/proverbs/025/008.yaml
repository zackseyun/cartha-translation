  rationale: 원문 및 영어 POB가 명시적으로 풀어 낸 생략 구조는 유지하되, 원문에 없는 ‘두렵습니다’를 제거했습니다. 이에 따라 경고의 인과관계와 현대 한국어 합쇼체의 자연스러움을 함께 확보했습니다.
