  source_fidelity: ‘두렵습니다’는 원문에 없는 화자의 두려움을 도입하고, פֶּן이 이끄는 경고의 결과를 화자의 심리 상태로 바꿉니다. 이를 ‘…될 수 있습니다’로 고쳐 성급한 다툼의 예상 결과라는 원문의 경고를 보존했습니다. ‘다툼’, ‘성급하게’, ‘이웃이 당신을 부끄럽게 하다’는 רִיב, מַהֵר, כלם 및 רֵעֶךָ를 충실히 반영합니다.
  naturalness: ‘다툼에 성급하게 나서지 마십시오’와 ‘어찌할 바를 알지 못하게 될 수 있습니다’는 현대 표준어 합쇼체에서 자연스럽고 잠언의 경계 어조에도 적절합니다. ‘끝에 가서’는 분쟁의 결과라는 אַחֲרִיתָהּ의 뜻을 무리 없이 전달합니다.
  terminology: ‘다툼’은 일반적 분쟁과 법적 다툼의 가능성을 함께 남기며, 각주에서 송사·재판의 뉘앙스를 보충하는 방식이 적절합니다. ‘이웃’은 רֵעַ의 폭넓은 사회적 관계를 유지합니다.
  issues:
