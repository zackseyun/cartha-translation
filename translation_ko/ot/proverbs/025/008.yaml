id: PRO.25.8
reference: Proverbs 25:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
  footnotes:
  - marker: a
    text: 'Hebrew is elliptical: literally, ''lest what will you do in its end, when your neighbor puts you to shame?'' The translation makes explicit the implied sense, ''you not know what to do.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not go out quickly to quarrel' or, with a more legal nuance, 'Do not go out hastily to court.'
    reason: alternative_reading
translation:
  language: ko
  text: 다툼에 성급하게 나아가지 마십시오. 끝에 가서는, 이웃이 당신을 부끄럽게 할 때, 어떻게 해야 할지 알지 못하게 될까 두렵습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략적입니다. 직역하면 “그 끝에, 네 이웃이 너를 부끄럽게 할 때, 무엇을 하겠느냐?”에 가깝습니다. 번역문은 그 함축된 뜻, 곧 ‘어떻게 해야 할지 알지 못하게 될 것’임을 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다툼’은 일반적 분쟁을 가리킬 수도 있고, 문맥에 따라 ‘송사/재판’의 뉘앙스도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּצֵא
  english_pob_choice: Do not go out
  chosen_korean: 나아가지 마십시오
  alternatives_korean:
  - 들어가지 마십시오
  - 나서지 마십시오
  lexicon: WLC / HALOT
  rationale: יצא의 기본 의미는 ‘나가다’이지만, כאן은 다툼에 스스로 뛰어드는 행위를 경계하는 관용적 표현이므로 한국어에서는 자연스럽게 ‘나아가지 마십시오’로 옮겨 경계의 힘을 살렸습니다.
- source_word: לָרִיב
  english_pob_choice: to a dispute
  chosen_korean: 다툼에
  alternatives_korean:
  - 송사에
  - 논쟁에
  lexicon: WLC / HALOT
  rationale: ריב은 법적 분쟁과 일반적 다툼을 함께 아우를 수 있으므로, 본문 범위를 좁히지 않는 ‘다툼’이 가장 적절합니다.
- source_word: מַהֵר
  english_pob_choice: hastily
  chosen_korean: 성급하게
  alternatives_korean:
  - 급히
  - 서둘러
  lexicon: WLC / HALOT
  rationale: 단순 속도보다 판단의 경솔함까지 담는 말이 필요하므로, 잠언체 경고에 맞는 ‘성급하게’를 택했습니다.
- source_word: בְּאַחֲרִיתָהּ
  english_pob_choice: in the end
  chosen_korean: 끝에 가서는
  alternatives_korean:
  - 결국에는
  - 마지막에는
  lexicon: WLC / HALOT
  rationale: אַחֲרִית는 결과와 종결을 가리키므로, 시간적·결과적 뉘앙스를 함께 담는 ‘끝에 가서는’이 자연스럽습니다.
- source_word: בְּהַכְלִים אֹתְךָ רֵעֶךָ
  english_pob_choice: when your neighbor puts you to shame
  chosen_korean: 이웃이 당신을 부끄럽게 할 때
  alternatives_korean:
  - 이웃이 당신을 수치스럽게 할 때
  - 이웃이 당신에게 수치를 안길 때
  lexicon: WLC / HALOT
  rationale: כלם은 수치/망신의 의미를 지니며, 잠언의 사회적 수치 감각을 살리기 위해 ‘부끄럽게 하다’로 옮겼습니다. רֵעַ는 친밀한 ‘친구’보다 사회적 상대를 포괄하는 ‘이웃’이 더 적합합니다.
theological_decisions:
- issue: 마지막 절의 히브리어 생략 구조 처리
  chosen_reading: “어떻게 해야 할지 알지 못하게 될까 두렵습니다”로 풀어, 원문의 생략된 결과를 자연스럽게 드러냈습니다.
  alternative_readings:
  - “무엇을 해야 할지”
  - “어찌할 바를 모르리라”
  rationale: 히브리어는 직역하면 “그 끝에 무엇을 하겠느냐”에 가깝지만, 문맥상 ‘어찌할 바를 모름’이 내포되어 있으므로 이를 명시해 잠언의 경고를 분명히 했습니다.
  doctrine_reference: '잠언의 지혜 문학 번역 원칙: 함축된 결과를 현대 한국어에서 명료화'
