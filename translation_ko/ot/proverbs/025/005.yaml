id: PRO.25.5
reference: Proverbs 25:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָג֣וֹ רָ֭שָׁע לִ/פְנֵי מֶ֑לֶךְ וְ/יִכּ֖וֹן בַּ/צֶּ֣דֶק כִּסְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/005.yaml
  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
  footnotes:
  - marker: a
    text: Or 'Take away the wicked from before the king.' The imperative likely has the sense of removing corrupt influence from the royal court.
    reason: lexical_alternative
  - marker: b
    text: '''In righteousness'' could also be rendered ''in justice'' or ''by righteousness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 악인을 왕 앞에서 제거하십시오. 그러면 그의 보좌가 의로 굳게 서게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕 앞에서 악인을 치워라.’ 이 명령형은 왕실 주변의 부패한 영향력을 제거하라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의로’는 ‘정의로’ 또는 ‘의에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ / Remove
  english_pob_choice: Remove
  chosen_korean: 제거하십시오
  alternatives_korean:
  - 치우십시오
  - 없애십시오
  - 내쫓으십시오
  lexicon: HALOT
  rationale: 명령형의 제거·제거함이라는 힘을 살리면서도, 궁정 맥락에서 부자연스럽지 않은 현대 한국어로 옮겼습니다.
- source_word: רָשָׁע / the wicked
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 자
  - 악한 사람
  - 불의한 자
  lexicon: HALOT
  rationale: 히브리어 단수 명사적 형용사를 인격화한 표현으로 자연스럽고, 도덕적 성격을 분명히 드러냅니다.
- source_word: בַּצֶּדֶק / in righteousness
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의롭게
  - 정의로
  lexicon: HALOT
  rationale: בְּ + צֶדֶק의 상태·영역 의미를 간결하게 살리면서, 왕좌가 ‘의’라는 성격 위에 굳게 선다는 의미를 유지했습니다.
theological_decisions:
- issue: 왕의 보좌가 세워지는 근거 표현
  chosen_reading: ‘의로 굳게 서게 됩니다’로 옮겨, 단순한 물리적 안정이 아니라 통치의 정당성과 도덕적 질서를 함께 드러냈습니다.
  alternative_readings:
  - ‘정의로 굳게 서게 됩니다’
  - ‘의로 말미암아 세워집니다’
  rationale: צֶדֶק은 여기서 재판·통치의 올바름을 포함하는 넓은 개념이므로, ‘의’로 유지하되 한국어에서는 자연스러운 서술형으로 풀었습니다.
  doctrine_reference: 잠언의 왕권 신학과 의/정의 어휘의 문맥적 사용
