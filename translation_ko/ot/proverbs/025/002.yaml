source:
  edition: WLC
  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
  footnotes:
  - marker: a
    text: Or 'honor' for 'glory' in both lines.
    reason: lexical_alternative
  - marker: b
    text: Or 'hide a matter' and 'investigate a matter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 영광은 일을 감추는 데 있고, 왕들의 영광은 일을 살피는 데 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 여기서 ‘존귀’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감추는 데’는 ‘숨기는 데’로, ‘살피는 데’는 ‘조사하는 데’ 또는 ‘찾아내는 데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: HALOT
  rationale: כבוד은 지위에 따른 무게와 광채를 가리키므로, 하나님과 왕의 평행을 살리는 ‘영광’이 가장 자연스럽습니다.
- source_word: הַסְתֵּר דָּבָר
  english_pob_choice: to conceal a matter
  chosen_korean: 일을 숨기는 것
  alternatives_korean:
  - 일을 감추는 것
  - 사안을 숨기는 것
  lexicon: HALOT
  rationale: דָּבָר는 잠언 문맥에서 단순한 ‘말’보다 사안이나 일을 뜻하므로, ‘일’로 옮겨 행위의 대상이 분명하게 드러나게 했습니다.
- source_word: חֲקֹר דָּבָר
  english_pob_choice: to search out a matter
  chosen_korean: 일을 찾아내는 것
  alternatives_korean:
  - 사안을 파헤치는 것
  - 일을 조사하는 것
  lexicon: HALOT
  rationale: חקר는 탐구하고 캐내는 뜻이어서, 왕의 지혜로운 판단을 드러내는 ‘찾아내다’가 가장 압축적이고 자연스럽습니다.
theological_decisions:
- issue: 하나님의 숨기심과 왕들의 탐구 사이의 관계
  chosen_reading: 두 행을 도덕적 대조로 과장하지 않고, 각각의 영광을 병렬로 살렸습니다.
  alternative_readings:
  - 하나님의 비밀과 인간 통치의 대비로 해석하기
  - 왕들이 하나님이 숨기신 것을 드러낸다고 확장해서 읽기
  rationale: 히브리어는 지혜시의 대구법으로 말하므로, 번역도 하나님의 숨기심과 왕의 탐구를 각각 고유한 영광으로 제시하고 신학적 설명은 덧붙이지 않는 것이 본문에 충실합니다.
  doctrine_reference: 본문의 시적 병렬과 긴장을 보존합니다.
