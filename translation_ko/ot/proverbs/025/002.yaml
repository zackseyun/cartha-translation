  verdict: revise
  source_fidelity: 히브리어의 두 병행구(‘하나님의 영광—일을 감춤’, ‘왕들의 영광—일을 탐구함’)와 반복되는 דָּבָר를 잘 반영합니다. 다만 ‘찾아내다’는 탐구 행위보다 발견된 결과를 다소 강하게 전제할 수 있으므로, חקר의 조사·탐구 의미에는 ‘살피다’가 더 중립적입니다.
  naturalness: ‘…것이고/…것입니다’도 문법적으로 가능하나, 잠언의 격언적 병렬에는 ‘…하는 데 있고/…하는 데 있습니다’가 더 자연스럽고 간결한 현대 표준어 합쇼체입니다.
  terminology: ‘영광’은 כבוד의 격조 있는 병렬을 보존하며 적절합니다. דָּבָר의 반복은 ‘일’로 유지할 수 있습니다. ‘감추다’는 הַסְתֵּר에 자연스럽고, ‘살피다’는 חֲקֹר의 탐구 의미를 결과 편향 없이 전달합니다.
