  to: 하나님의 영광은 일을 감추는 데 있고, 왕들의 영광은 일을 살피는 데 있습니다.[a][b]
  rationale: ‘감추는 데 있고/살피는 데 있습니다’로 다듬어 히브리어의 병행된 격언 표현을 자연스러운 현대 한국어 합쇼체로 옮겼습니다. 특히 חקר는 조사·탐구의 뜻을 보존하도록 ‘살피다’로 번역했으며, 하나님이 감추신 것을 왕이 반드시 밝혀낸다는 해석은 본문에 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:26Z'
