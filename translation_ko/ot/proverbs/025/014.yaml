translation:
  language: ko
  text: 비 없는 구름과 바람은 거짓 선물을 자랑하는 사람과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비 없는 구름과 바람처럼, 선물을 주지 않으면서 그것을 자랑하는 사람과 같다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂיאִים
  english_pob_choice: clouds
  chosen_korean: 구름
  alternatives_korean:
  - 먹구름
  - 구름들
  - 물기운
  lexicon: HALOT
  rationale: 날씨 비유에서 하늘의 구름이 비를 암시하므로, 가장 자연스럽고 직관적인 ‘구름’으로 옮겼습니다.
- source_word: וְרוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  - 바람결
  lexicon: HALOT
  rationale: 구름과 비의 동반 이미지이므로 ‘영’이나 ‘숨’이 아니라 기상 현상인 ‘바람’이 맞습니다.
- source_word: מִתְהַלֵּל
  english_pob_choice: boasts
  chosen_korean: 자랑하는
  alternatives_korean:
  - 뽐내는
  - 떠벌리는
  - 과시하는
  lexicon: HALOT
  rationale: 히트파엘의 자기과시·자랑의 뉘앙스를 살리되, 잠언체에 어울리는 표준적 표현으로 ‘자랑하는’을 택했습니다.
- source_word: בְּמַתַּת שָׁקֶר
  english_pob_choice: a false gift
  chosen_korean: 거짓된 선물
  alternatives_korean:
  - 거짓 선물
  - 주지 않을 선물
  - 헛된 선물
  lexicon: HALOT
  rationale: 히브리어의 짧은 결합을 살려 ‘거짓된 선물’로 옮기면, 실제로는 주어지지 않거나 속이는 선물이라는 긴장을 보존할 수 있습니다.
theological_decisions:
- issue: 마지막 절구의 관계를 어떻게 한국어로 드러낼지
  chosen_reading: 비가 없는 구름과 바람처럼, 거짓된 선물을 자랑하는 사람도 공허하다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘구름과 바람과 비가 없는 것처럼’이라는 직역
  - ‘비 없는 구름, 바람과 같다’는 더 압축된 번역
  rationale: 히브리어는 비유와 결과를 압축적으로 병치합니다. 한국어에서는 독자가 잠언의 판단을 즉시 이해하도록 하면서도, 원문의 경구적 긴장을 유지하는 쪽이 적절합니다.
  doctrine_reference: 잠언의 지혜 문학적 비유 해석
