    rationale: ‘거짓 선물’이 현대 한국어에서 더 간결하며, 원문의 압축적 결합을 더 잘 반영합니다. 실제로 주지 않는 선물이라는 해석적 확장은 각주에 남깁니다.
  revised_text: 비 없는 구름과 바람은 거짓 선물을 자랑하는 사람과 같습니다.[a]
