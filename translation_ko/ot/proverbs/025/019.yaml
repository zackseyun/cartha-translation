translation:
  language: ko
  text: 환난의 날에 신의 없는 사람을 신뢰하는 것은[a] 상한 이와 미끄러지는 발[b]과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의지하는 것’.
    reason: lexical_alternative
  - marker: b
    text: ‘미끄러지는 발’은 ‘비틀거리는 발’ 또는 ‘불안정한 발’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  english_pob_choice: bad tooth
  chosen_korean: 아픈 이
  alternatives_korean:
  - 나쁜 이
  - 썩은 이
  - 상한 이
  lexicon: HALOT
  rationale: 히브리어는 상태가 좋지 않은 이를 가리키며, 한국어에서는 ‘아픈 이’가 자연스럽게 기능을 못 하는 이를 떠올리게 하여 비유의 실감을 살립니다.
- source_word: וְרֶגֶל מוּעָדֶת
  english_pob_choice: a slipping foot
  chosen_korean: 미끄러지는 발
  alternatives_korean:
