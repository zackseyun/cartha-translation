  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
  footnotes:
  - marker: a
    text: Or 'trust in a faithless person.'
    reason: lexical_alternative
  - marker: b
    text: The image of 'a slipping foot' may also be understood as an unsteady or tottering foot.
    reason: lexical_alternative
translation:
  language: ko
  text: 믿을 수 없는 사람을 신뢰하는 것은 아픈 이와 미끄러지는 발과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미끄러지는 발’은 ‘비틀거리는 발’ 또는 ‘불안정한 발’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בּוֹגֵד는 ‘믿을 수 없는 사람’ 또는 ‘배신하는 사람’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  english_pob_choice: bad tooth
  chosen_korean: 아픈 이
  alternatives_korean:
  - 나쁜 이
  - 썩은 이
  - 상한 이
  lexicon: HALOT
  rationale: 히브리어는 상태가 좋지 않은 이를 가리키며, 한국어에서는 ‘아픈 이’가 자연스럽게 기능을 못 하는 이를 떠올리게 하여 비유의 실감을 살립니다.
- source_word: וְרֶגֶל מוּעָדֶת
  english_pob_choice: a slipping foot
  chosen_korean: 미끄러지는 발
  alternatives_korean:
  - 비틀거리는 발
  - 흔들리는 발
  - 불안정한 발
  lexicon: HALOT
  rationale: רֶגֶל은 기본적으로 ‘발’이므로 이를 살리고, מוּעָדֶת의 미끄러짐·불안정을 ‘미끄러지는’으로 옮겨 몸의 이미지가 선명하게 드러나게 했습니다.
- source_word: מִבְטָח
  english_pob_choice: confidence
  chosen_korean: 신뢰하는 것
  alternatives_korean:
  - 믿음
  - 의지
  - 확신
  lexicon: HALOT
  rationale: 명사형 ‘믿을 만함/신뢰’의 뜻이지만, 한국어 속담형 비교문에서는 ‘신뢰하는 것’으로 풀어야 앞뒤 비유가 자연스럽습니다.
- source_word: בּוֹגֵד
  english_pob_choice: treacherous man
  chosen_korean: 믿을 수 없는 사람
  alternatives_korean:
  - 배신하는 사람
  - 배신자
  - 불성실한 사람
  lexicon: HALOT
  rationale: 히브리어 분사는 관계적·성품적 의미로 ‘신의 없는 사람’을 가리키므로, 직역적 ‘배신자’보다 문맥상 일반적인 불신의 성격을 드러내는 표현을 택했습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in a day of trouble
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 재난의 날에
  - 곤란한 때에
  lexicon: HALOT
  rationale: 관용적 시간표현을 살리되, צָרָה의 압박·고통의 뉘앙스를 한국어 성경 문체에 맞게 ‘환난’으로 옮겼습니다.
theological_decisions:
- issue: 보편적 남성 단수 בּוֹגֵד의 처리
  chosen_reading: 성별 특정성을 드러내지 않는 ‘사람’으로 옮겨 잠언의 일반 경구적 성격을 살렸습니다.
  alternative_readings:
  - 믿을 수 없는 남자
  - 배신하는 사람
  rationale: 잠언의 진술은 대표적 인물을 통한 일반 원리를 말하므로, 한국어에서는 독자가 성별보다 행위의 본질에 주목하도록 하는 편이 더 정확합니다.
  doctrine_reference: POB translation philosophy / gender-accurate rendering
