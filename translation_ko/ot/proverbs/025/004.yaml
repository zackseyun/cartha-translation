id: PRO.25.4
reference: Proverbs 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָג֣וֹ סִיגִ֣ים מִ/כָּ֑סֶף וַ/יֵּצֵ֖א לַ/צֹּרֵ֣ף כֶּֽלִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/004.yaml
  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
  footnotes:
  - marker: a
    text: Or 'for the silversmith.' The Hebrew term can refer more broadly to a metalworker, but 'refiner' best fits the immediate context of removing dross from silver.
    reason: lexical_alternative
translation:
  language: ko
  text: 은에서 찌꺼기를 걷어 내십시오. 그러면 정련하는 이가 쓸 그릇이 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정련하는 이’(히브리어 צֹרֵף)는 금속을 정련하는 사람을 뜻합니다. 문맥에 따라 ‘은세공인’ 또는 더 넓게 ‘금속 세공인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  english_pob_choice: Remove
  chosen_korean: 제거하면
  alternatives_korean:
  - 치우면
  - 없애면
  - 걷어내면
  lexicon: HALOT
  rationale: 금속 정련의 맥락에서 불순물을 분리해 내는 동작을 자연스럽게 옮기되, 잠언의 일반적 교훈성을 살리기 위해 조건문 형태로 표현했습니다.
- source_word: סִיגִים
  english_pob_choice: the dross
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 불순물
  - 드로스
  - 슬래그
  lexicon: HALOT
  rationale: 금속에서 걸러져 나오는 폐물이라는 의미를 살리면서 현대 한국어에서 이해가 쉬운 표현을 택했습니다. '찌꺼기'는 다소 넓지만 본문 이미지에는 적절합니다.
- source_word: לַצֹּרֵף
  english_pob_choice: for the refiner
  chosen_korean: 연마하는 사람을 위한
  alternatives_korean:
  - 정련하는 사람을 위한
  - 세공인을 위한
  - 은세공인을 위한
  lexicon: HALOT
  rationale: צֹרֵף는 단순한 장인이 아니라 금속을 정련하는 사람을 가리키므로, 문맥상 '연마하는 사람'으로 옮겨 정련의 기능을 드러냈습니다.
- source_word: כֶּלִי
  english_pob_choice: a vessel
  chosen_korean: 그릇
  alternatives_korean:
  - 기구
  - 용기
  - 도구
  lexicon: HALOT
  rationale: כְּלִי는 넓게는 기구를 뜻하지만, 이 구절의 결과물 이미지는 완성된 금속 용기이므로 가장 간결하고 자연스러운 '그릇'이 적절합니다.
theological_decisions:
- issue: 잠언의 조건-결과 진술 형식
  chosen_reading: 직설적 격언을 한국어에서 '제거하면 ... 나옵니다'의 조건문으로 옮겨, 보편적 원리를 드러냈습니다.
  alternative_readings:
  - 찌꺼기를 은에서 제거하라. 그러면 연마하는 사람을 위한 그릇이 나온다.
  - 은에서 찌꺼기를 제거하면 연마하는 사람을 위한 그릇이 나옵니다.
  rationale: 히브리어의 지시적 격언을 한국어에서 가장 자연스럽게 재현하는 방식은 조건-결과 구조입니다. 명령문으로 바꾸면 잠언의 관찰적 성격이 약해질 수 있습니다.
  doctrine_reference: 잠언 장르의 지혜 교훈과 문장 기능
