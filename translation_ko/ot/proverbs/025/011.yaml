    rationale: In Korean, ‘알맞게 한 말’ naturally expresses a spoken utterance while retaining the source’s characterization of the word as spoken.
  - severity: low
    issue: The plural image ‘apples of gold’ is rendered as singular ‘금사과.’
    rationale: Using ‘금사과들’ more closely reflects the Hebrew plural without harming Korean style.
