id: PRO.25.11
reference: Proverbs 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּפּוּחֵ֣י זָ֭הָב בְּ/מַשְׂכִּיּ֥וֹת כָּ֑סֶף דָּ֝בָ֗ר דָּבֻ֥ר עַל אָפְנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
  footnotes:
  - marker: a
    text: Or 'fitly spoken'; literally, 'spoken upon its wheels,' an idiom for speech given in a fitting or timely way.
    reason: lexical_alternative
  - marker: b
    text: The precise fruit denoted by the Hebrew may not correspond exactly to the modern apple.
    reason: cultural_note
  - marker: c
    text: Or 'in carvings of silver' or 'in filigree of silver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 알맞게 한 말[a]은 은 세공 장식[c]에 놓인 금사과들[b]과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 바퀴들 위에’라고 읽힙니다. 이 어려운 표현은 문맥상 흔히 ‘알맞게’ 또는 ‘적절하게’ 말한 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 가리키는 과일은 현대 한국어의 ‘사과’와 정확히 일치한다고 단정할 수는 없습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘은 세공 장식’ 외에도 ‘은 조각품’ 또는 ‘은 세선 세공품’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  english_pob_choice: apples
  chosen_korean: 사과
  alternatives_korean:
  - 과실
  - 열매
  - 사과처럼 생긴 과일
  lexicon: HALOT, BDB
  rationale: 히브리어 תַּפּוּחַ는 정확한 식별이 확정적이지 않지만, POB가 영어로 'apples'를 택한 비유 이미지를 따라 한국어에서도 가장 자연스럽고 널리 알려진 ‘사과’로 옮겼습니다.
- source_word: בְּמַשְׂכִּיּוֹת כָּסֶף
  english_pob_choice: in settings of silver
  chosen_korean: 은으로 만든 장식 속의
  alternatives_korean:
  - 은 세공 속의
  - 은 장식 속의
  - 은의 세공품 속의
  lexicon: HALOT, BDB
  rationale: מַשְׂכִּיּוֹת는 정교한 장식 세공이나 장식 틀을 가리키므로, POB의 'settings of silver'를 살려 ‘은으로 만든 장식’으로 옮기고 위치 관계는 ‘속의’로 자연스럽게 처리했습니다.
- source_word: דָּבָר דָּבֻר
  english_pob_choice: a word spoken
  chosen_korean: 말해진 한마디
  alternatives_korean:
  - 한 말
  - 말씀 하나
  - 말해진 말
  lexicon: HALOT, BDB
  rationale: 지혜 격언의 짧은 음성을 살리기 위해 דָּבָר를 ‘한마디’로 옮겼고, דָּבֻר는 수동적 뉘앙스를 반영해 ‘말해진’으로 처리했습니다.
- source_word: עַל אָפְנָיו
  english_pob_choice: at the right time
  chosen_korean: 때에 맞게
  alternatives_korean:
  - 적절하게
  - 알맞게
  - 제때에
  lexicon: HALOT, BDB
  rationale: 직역하면 ‘바퀴 위에’이지만 관용적으로 적절함과 시기를 뜻하므로, POB의 의미 선택을 따라 ‘때에 맞게’로 옮겨 격언의 핵심을 분명히 했습니다.
theological_decisions:
- issue: 비유의 문장 순서와 강조점
  chosen_reading: 히브리어의 비교구문을 따라, ‘말해진 한마디’가 ‘금사과’에 비유되는 구조를 앞뒤를 바꿔 보존했습니다.
  alternative_readings:
  - 한마디는 때에 맞게 말해질 때 은 장식 속 금사과와 같습니다.
  - 때에 맞게 말해진 말은 금사과와 같습니다.
  rationale: POB의 최신 수정처럼 비교 대상과 비교 항목의 순서를 살려, 지혜 격언의 수사적 힘을 유지하는 것이 본문 의미 전달에 더 충실합니다.
  doctrine_reference: 잠언의 지혜 문학적 비유
- issue: '''apples''의 문화적 불확실성'
  chosen_reading: 과실의 정확한 품종을 단정하지 않고도, POB의 대표적 이미지인 ‘사과’를 유지했습니다.
  alternative_readings:
  - 불명확한 열매
  - 고대 과일
  rationale: 원어의 식별 불확실성은 인정하되, 독자가 즉시 떠올릴 수 있는 비유 이미지를 보존하는 편이 본문의 효과를 더 잘 전달합니다.
  doctrine_reference: 잠언 25:11의 비유적 표현
