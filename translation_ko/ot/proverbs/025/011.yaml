  naturalness: A more idiomatic formal Korean proverb is achieved with ‘알맞게 한 말’ rather than ‘때에 맞게 말해진 한마디.’ ‘은 세공 장식에 놓인 금사과들’ is clear, natural, and retains the crafted-object image.
  terminology: '‘사과’ remains acceptable as the conventional rendering, provided the uncertainty note is retained. ‘은 세공 장식’ gives an appropriately noncommittal rendering of מַשְׂכִּיּוֹת while the footnote records viable alternatives. The difficult phrase עַל־אָפְנָיו should be glossed cautiously: its literal wording is retained in the note, but its idiomatic force is not certain enough to state as unqualified.'
  issues:
