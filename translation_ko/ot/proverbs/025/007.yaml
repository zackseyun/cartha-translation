  source_fidelity: 현 번역은 비교 구문의 후반을 ‘귀인이 네가 보는 앞에서 너를 낮추는 것’으로 옮겨, 히브리어 לִפְנֵי נָדִיב(‘귀인 앞에서’)을 행위자의 주어 및 목격 상황으로 바꾸었습니다. 원문은 낮추는 행위의 주체를 명시하지 않고, 독자가 이미 본 귀인 앞에서 낮추어지는 상황을 말합니다. 이를 바로잡아야 합니다.
  naturalness: ‘너에게 말해지기를’은 문어적으로 가능하나 다소 부자연스럽습니다. ‘…라는 말을 듣는 것이’가 비인칭적 발화와 비교 구문을 현대 표준어로 자연스럽게 표현합니다. 인용문의 ‘이리 올라오게’는 화자가 상대를 더 높은 자리로 부르는 장면에 어울리며, 본문의 합쇼체 서술과도 충돌하지 않습니다.
  terminology: נָדִיב은 ‘귀인’으로 옮길 수 있습니다. הַשְׁפִּילְךָ는 ‘네가 낮아지는 것’으로 번역하여 낮은 자리·지위로 내려지는 의미를 보존하되, 수치라는 해석을 본문에 과도하게 명시하지 않았습니다. ‘네가 눈으로 본 귀인’은 עֵינֶיךָ의 강조를 자연스러운 한국어 안에서 유지합니다.
