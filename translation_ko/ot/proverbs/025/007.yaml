  - 올라오너라
  lexicon: HALOT
  rationale: 상향 이동과 사회적 승격을 함께 드러내기 위해 ‘올라오다’를 쓰고, 초대의 직접성을 살렸습니다.
- source_word: מֵהַשְׁפִּילְךָ
  english_pob_choice: than that you be humiliated
  chosen_korean: 너를 낮추는 것보다
  alternatives_korean:
