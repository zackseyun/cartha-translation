  lexicon: HALOT
  rationale: 주어가 드러나지 않는 수동/비인칭 뉘앙스를 살려, 말해지는 상황 자체를 표현했습니다.
- source_word: עֲלֵה הֵנָּה
  english_pob_choice: Come up here
  chosen_korean: 이리 올라오너라
  alternatives_korean:
