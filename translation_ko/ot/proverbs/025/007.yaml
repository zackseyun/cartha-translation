  lexicon: HALOT
  rationale: כִּי의 설명적 연결을 살리면서, טוֹב의 비교 의미를 한국어의 ‘…하는 편이 …보다 낫습니다’로 자연스럽게 옮겼습니다.
- source_word: אֲמָר לְךָ
