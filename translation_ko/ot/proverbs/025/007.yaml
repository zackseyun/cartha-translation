  lexicon: HALOT
  rationale: הִשְׁפִּיל의 핵심인 ‘낮추다/낮아지게 하다’를 직결해, 사회적 굴욕의 함의를 한국어로 과장하지 않고 반영했습니다.
- source_word: נָדִיב
  english_pob_choice: a nobleman
  chosen_korean: 귀인
  alternatives_korean:
