  lexicon: HALOT
  rationale: נָדִיב은 단순한 신분명보다 고위의 존귀한 인물을 가리키므로, 한국어 성서 문맥에서 자연스러운 ‘귀인’을 택했습니다.
- source_word: אֲשֶׁר רָאוּ עֵינֶי/ךָ
  english_pob_choice: whom your eyes have seen
  chosen_korean: 네가 보는 앞에서
  alternatives_korean:
  - 네 눈이 본
  - 네가 본
  lexicon: HALOT
  rationale: 히브리어의 생생한 관용을 살리되 한국어에서는 어색할 수 있어, ‘눈으로 보았다’의 현장성을 담아 자연스럽게 풀었습니다.
