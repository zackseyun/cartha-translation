source:
  edition: WLC
  text: מַ֣יִם קָ֭רִים עַל נֶ֣פֶשׁ עֲיֵפָ֑ה וּ/שְׁמוּעָ֥ה ט֝וֹבָ֗ה מֵ/אֶ֥רֶץ מֶרְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/025.yaml
  text: Like cold water to a weary soul[a], so is good news from a distant land.
  footnotes:
  - marker: a
    text: Or 'a good report from a distant land.' The Hebrew שְׁמוּעָה can mean 'news,' 'report,' or 'tidings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지친 영혼에게 차가운 물이 그러하듯이, 먼 땅에서 온 좋은 소식도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 땅에서 온 좋은 보고’. 히브리어 שְׁמוּעָה는 ‘소식’, ‘보고’, ‘전언’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  english_pob_choice: cold water
  chosen_korean: 서늘한 물
  alternatives_korean:
  - 차가운 물
  - 냉수
  lexicon: HALOT
  rationale: 물의 차가움이 주는 생기 회복 이미지를 살리되, 한국어에서는 시적이고 자연스러운 ‘서늘한 물’이 과도하게 냉랭하지 않으면서도 원문의 감각을 잘 전달합니다.
- source_word: עַל נֶפֶשׁ עֲיֵפָה
  english_pob_choice: to a weary soul
  chosen_korean: 지친 영혼에 시원함이 되듯이
  alternatives_korean:
  - 지친 영혼에게
  - 피곤한 사람에게
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 단순한 ‘사람’보다 내면의 생명을 가리키는 뜻으로 보고 ‘영혼’으로 옮겼고, עֲיֵפָה의 소모된 상태를 한국어 관용에 맞게 ‘지친’으로 표현했습니다.
- source_word: וּשְׁמוּעָה טוֹבָה
  english_pob_choice: good news
  chosen_korean: 좋은 소식
  alternatives_korean:
  - 좋은 보고
  - 좋은 소문
  - 반가운 소식
  lexicon: HALOT
  rationale: שְׁמוּעָה는 ‘소식/보고/전언’의 범위를 가지며, 문맥상 정서적 대조를 가장 자연스럽게 살리는 표현은 ‘좋은 소식’입니다.
- source_word: מֵאֶרֶץ מֶרְחָק
  english_pob_choice: from a distant land
  chosen_korean: 먼 땅에서 온
  alternatives_korean:
  - 먼 나라에서 온
  - 아득한 땅에서 온
  lexicon: HALOT
  rationale: 직역형보다 한국어에서 더 자연스러운 지리적 거리감을 주기 위해 ‘먼 땅에서 온’으로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 비유적 진술을 한국어에서 얼마나 직접적으로 살릴지
  chosen_reading: 비유 구조를 유지하되, ‘시원함이 되듯이’로 자연스러운 비교를 드러냈습니다.
  alternative_readings:
  - ‘…와 같습니다’처럼 더 평면적으로 옮김
  - ‘…처럼’만으로 단순화함
  rationale: 원문은 물과 소식의 대응을 통한 생생한 지혜적 비유이므로, 비교의 힘을 약화시키지 않으면서도 현대 한국어로 읽히는 문장을 택했습니다.
  doctrine_reference: 잠언의 비유적 수사와 지혜 교육의 전달 원리
