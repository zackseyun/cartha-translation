  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֗וֹב שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מדונים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/024.yaml
  text: It is better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
  footnotes:
  - marker: a
    text: Or 'with a contentious wife and a house in common.' The final phrase is terse in Hebrew and may emphasize sharing the same household rather than the pleasantness of companionship.
    reason: lexical_alternative
translation:
  language: ko
  text: 지붕 한쪽 구석에 사는 것이, 다투기 좋아하는 아내와 함께 한 집에 사는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 구절은 매우 압축되어 있어 ‘함께 쓰는 집’ 또는 ‘공동의 집’의 뉘앙스로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 낫습니다
  lexicon: HALOT
  rationale: 지혜 격언의 비교 구문이므로 한국어에서는 자연스러운 비교 표현인 ‘…보다 낫습니다’로 옮겼습니다.
- source_word: שֶׁבֶת
  english_pob_choice: to live
  chosen_korean: 사는 것
  alternatives_korean:
  - 거하는 것
  - 머무는 것
  lexicon: HALOT
  rationale: 직역하면 ‘앉는 것’이지만, 장소와 결합된 문맥에서는 거주 의미가 분명하므로 현대 한국어의 ‘사는 것’이 가장 자연스럽습니다.
- source_word: עַל פִּנַּת גָּג
  english_pob_choice: on a corner of the roof
  chosen_korean: 지붕 한쪽 구석에
  alternatives_korean:
  - 지붕 모퉁이에
  - 지붕 한 귀퉁이에
  lexicon: HALOT
  rationale: 평평한 지붕의 가장자리 한 구석이라는 구체적 이미지를 살리되, 한국어에서는 ‘한쪽 구석’이 가장 간결하고 읽기 쉽습니다.
- source_word: מִדְיָנִים
  english_pob_choice: quarrelsome
  chosen_korean: 다투기 좋아하는
  alternatives_korean:
  - 다툼이 잦은
  - 분쟁을 일으키는
  - 성질이 고약한
  lexicon: HALOT
  rationale: 복수형 추상명사가 형용사적으로 쓰여 지속적 성향을 나타내므로, 행동 특성을 드러내는 ‘다투기 좋아하는’이 적절합니다.
- source_word: וּבֵית חָבֶר
  english_pob_choice: in a shared house
  chosen_korean: 한 집에
  alternatives_korean:
  - 공동의 집에
  - 함께 쓰는 집에
  - 공유된 집에
  lexicon: HALOT
  rationale: 히브리어가 매우 압축되어 있어 ‘공동 거주/같은 집’의 뜻을 자연스럽게 드러내는 표현으로 옮겼습니다. 전통 교회어인 ‘가정’은 원문의 물리적 대비를 약화시킬 수 있습니다.
theological_decisions:
- issue: 구문상의 대비가 ‘지붕 구석의 고립’과 ‘갈등적인 동거’ 사이의 현실적 긴장으로 읽히는지 여부
  chosen_reading: 단순한 불쾌감보다, 좁고 노출된 지붕 한구석의 고립이 다투기 좋아하는 배우자와의 공동생활보다 낫다는 현실적 대비로 옮겼습니다.
  alternative_readings:
  - 관계적 갈등을 완곡하게 표현하여 ‘함께 사는 것보다’로만 처리하는 읽기
  - ‘가정’ 중심으로 일반화하는 읽기
  rationale: 잠언의 풍자적 힘은 생활의 불편함을 선명하게 드러내는 데 있으므로, 원문의 구체성을 유지하는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: 잠언 문학의 수사적 대비
