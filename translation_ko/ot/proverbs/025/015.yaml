  text: בְּ/אֹ֣רֶךְ אַ֭פַּיִם יְפֻתֶּ֣ה קָצִ֑ין וְ/לָשׁ֥וֹן רַ֝כָּ֗ה תִּשְׁבָּר גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/015.yaml
  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
  footnotes:
  - marker: a
    text: Or 'By long-suffering a ruler is won over.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'a soft tongue breaks a bone'—a metaphor for the power of gentle speech to overcome hardness or resistance.
    reason: cultural_note
translation:
  language: ko
  text: 인내로 통치자는 설득될 수 있고, 부드러운 혀는 뼈를 부러뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오래 참음으로 통치자는 설득될 수 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘부드러운 혀는 뼈를 부러뜨립니다’라는 뜻으로, 온유한 말이 완강한 저항도 이길 수 있다는 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  english_pob_choice: By patience
  chosen_korean: 인내로
  alternatives_korean:
  - 오래 참음으로
  - 오래 참는 마음으로
  - 오랜 인내로
  lexicon: HALOT
  rationale: 직역하면 ‘코/분노가 길다’는 관용어로, 분노를 늦추는 참을성을 뜻합니다. 한국어에서는 간결하고 자연스러운 ‘인내로’가 잠언의 격언체에 가장 잘 맞습니다.
- source_word: יְפֻתֶּה
  english_pob_choice: may be persuaded
  chosen_korean: 설득될 수 있고
  alternatives_korean:
  - 설득될 수 있고
  - 마음이 움직일 수 있고
  - 꾀일 수 있고
  lexicon: HALOT
  rationale: 지혜문맥에서는 속임수보다 ‘권유에 의해 마음이 움직이는 것’이 핵심이므로, 소극적 수동성을 살리되 한국어에서 자연스러운 ‘설득될 수 있다’로 옮겼습니다.
- source_word: לָשׁוֹן רַכָּה
  english_pob_choice: a gentle tongue
  chosen_korean: 부드러운 혀
  alternatives_korean:
  - 온유한 혀
  - 부드러운 말
  - 온화한 혀
  lexicon: HALOT
  rationale: 원문의 은유를 유지하려면 ‘혀’를 살리는 것이 좋습니다. 다만 한국어에서 더 자연스러운 의미는 ‘부드러운 말’일 수 있으나, 본문 이미지의 힘을 보존하기 위해 ‘부드러운 혀’를 택했습니다.
- source_word: תִּשְׁבָּר גָּרֶם
  english_pob_choice: breaks a bone
  chosen_korean: 뼈를 부러뜨립니다
  alternatives_korean:
  - 뼈를 꺾습니다
  - 뼈를 부술 만큼 강합니다
  - 뼈를 꺾어 버립니다
  lexicon: HALOT
  rationale: 원문의 과장법과 충격을 그대로 살리기 위해 물리적 이미지를 직설적으로 유지했습니다. 이는 부드러운 말이 완강함까지도 꺾을 수 있다는 격언적 힘을 드러냅니다.
theological_decisions:
- issue: 잠언의 비유적 과장과 문자적 이미지의 균형
  chosen_reading: ‘부드러운 혀는 뼈를 부러뜨립니다’라는 직설적 이미지를 유지해, 부드러운 말의 예기치 않은 힘이라는 잠언의 역설을 드러냈습니다.
  alternative_readings:
  - ‘부드러운 말은 완강함도 꺾습니다’처럼 의미를 풀어 쓸 수 있음
  - ‘부드러운 혀가 뼈까지 꺾습니다’처럼 약간 완화해 옮길 수 있음
  rationale: 히브리어 속담은 의도적으로 강한 은유를 사용하므로, 의미만 풀어버리면 본문의 충격과 기억성이 약해집니다. 따라서 이미지 보존을 우선했습니다.
  doctrine_reference: 잠언의 지혜문학에서 비유적 과장은 교훈을 강화하는 수사입니다.
