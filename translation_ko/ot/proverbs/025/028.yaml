    rationale: 원어는 성읍의 방어선이 뚫리거나 허물어진 상태를 가리킵니다. 제안 표현은 무엇이 무너져 들어가는지 불분명하며, 침입의 결과를 과도하게 덧붙일 수 있습니다.
