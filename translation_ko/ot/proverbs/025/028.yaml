  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִ֣יר פְּ֭רוּצָה אֵ֣ין חוֹמָ֑ה אִ֝֗ישׁ אֲשֶׁ֤ר אֵ֖ין מַעְצָ֣ר לְ/רוּחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
  footnotes:
  - marker: a
    text: Or 'A person who has no control over his temper' or '...over himself.' The Hebrew says 'his spirit,' which can refer to one's inner disposition or temper.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 영을 제어하지 못하는 사람은 무너져 들어가 성벽이 없는 성읍과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 성질을 제어하지 못하는 사람’ 혹은 ‘…자기 자신을’. 히브리어는 ‘그의 영’이라고 하며, 이는 내면의 성향이나 기질을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  english_pob_choice: city
  chosen_korean: 성읍
  alternatives_korean:
  - 도시
  - 성
  lexicon: HALOT
  rationale: 지혜문학의 비유에서 עיר는 단순한 정주지가 아니라 방어벽을 가진 공동체를 가리키므로, 한국어에서는 ‘성읍’이 이미지와 문맥을 가장 잘 살립니다.
- source_word: פְּרוּצָה
  english_pob_choice: broken into
  chosen_korean: 무너져 들어가
  alternatives_korean:
  - 돌파된
  - 침입당한
  - 허물어진
  lexicon: HALOT
  rationale: פרץ는 ‘뚫고 들어가다/틈을 내다’의 뜻으로, 이미 방어가 뚫린 상태를 나타냅니다. ‘무너져 들어가’는 파괴와 침입의 결과를 함께 살리는 자연스러운 한국어입니다.
- source_word: מַעְצָר
  english_pob_choice: restraint
  chosen_korean: 제어
  alternatives_korean:
  - 절제
  - 억제
  - 통제
  lexicon: HALOT
  rationale: 명사는 내면의 억제력이나 통제력을 가리키므로, ‘제어’가 본문의 의미를 간결하게 전달합니다. ‘절제’는 다소 덕목화될 수 있어 본문에는 덜 직접적입니다.
- source_word: לְרוּחוֹ
  english_pob_choice: over his spirit
  chosen_korean: 자기 영
  alternatives_korean:
  - 자기 마음
  - 자기 성정
  - 자기 분노
  lexicon: HALOT
  rationale: רוּחַ는 이 구절에서 단순한 감정만이 아니라 내면의 동력과 성향을 포함할 수 있으므로, ‘영’을 살리되 한국어에서는 소유 관계를 자연스럽게 드러내기 위해 ‘자기 영’으로 옮겼습니다.
theological_decisions:
- issue: אִישׁ의 대표적 남성형 표현을 어떻게 옮길지
  chosen_reading: 사람
  alternative_readings:
  - 한 사람
  - 남자
  rationale: 속담 형식에서 אִישׁ은 대표적 일반인을 가리키므로, 한국어에서는 남성 특정성을 약화하지 않으면서도 자연스러운 일반 독해를 위해 ‘사람’으로 옮겼습니다. 본문의 교훈적 초점을 유지하는 선택입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
