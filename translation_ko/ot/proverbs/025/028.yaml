    rationale: ‘…자기 자신을’은 본문 표현의 어떤 부분을 대체하는지 즉시 분명하지 않습니다. 완전한 대안 문장으로 제시하는 편이 독자에게 명료합니다.
  revised_text: 자기 영을 다스릴 절제가 없는 사람은 성벽이 뚫리고 성벽이 없는 성읍과 같습니다.[a]
