review_pass:
  verdict: revise
  source_fidelity: 원문의 רִיבְךָ רִיב는 ‘당신의 분쟁/사안을 다루거나 따지라’는 반복 어근 표현입니다. 초안의 ‘직접’은 히브리어에 명시되어 있지 않으며, ‘다투고’는 분쟁을 더 적대적인 말다툼으로 좁힐 수 있습니다. ‘다른 사람의 비밀을 드러내지 마십시오’는 וְסוֹד אַחֵר אַל־תְּגָל을 충실하게 옮깁니다.
  naturalness: ‘이웃과 자신의 문제를 따지십시오’는 현대 표준 한국어에서 분쟁 당사자와 직접 사안을 다룬다는 뜻을 자연스럽게 전달하며, 합쇼체 권면/명령 어조에도 맞습니다.
  terminology: ‘이웃’은 רֵעֶךָ의 넓은 관계어를 유지하고, ‘비밀’은 סוֹד의 문맥상 핵심 의미를 적절히 보존합니다. ‘드러내지 마십시오’는 גלה의 공개·누설 금지를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ‘직접’이 본문에 명시되지 않았습니다.
    rationale: 영어 감사본은 문맥적 대비를 반영하여 ‘himself/directly’를 보충하지만, 히브리어 본문에는 이에 해당하는 어휘가 없습니다. 한국어 본문에서는 이를 단정적으로 첨가하지 않는 편이 더 안전합니다.
  - severity: low
    issue: ‘다투고’가 ריב의 의미를 다소 좁힙니다.
    rationale: ריב는 다툼 자체뿐 아니라 분쟁 사안이나 그 사안을 제기·변론하는 행위를 가리킬 수 있습니다. ‘문제를 따지십시오’는 이 폭을 더 잘 유지합니다.
  - severity: low
    issue: 각주 b는 번역문에 추가된 ‘직접’을 해설합니다.
    rationale: 해당 보충어를 삭제하므로 그 각주도 불필요합니다. 남는 표현은 원문 의미를 충분히 전달하므로 각주 없이 처리할 수 있습니다.
  revised_text: 이웃과 자신의 문제를 따지십시오. 다른 사람의 비밀은 드러내지 마십시오.
