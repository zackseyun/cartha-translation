  text: רִֽ֭יבְ/ךָ רִ֣יב אֶת רֵעֶ֑/ךָ וְ/ס֖וֹד אַחֵ֣ר אַל תְּגָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/009.yaml
  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
  footnotes:
  - marker: a
    text: Or 'Plead your case with your neighbor' or 'Settle your dispute with your neighbor directly.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the secret of another'; that is, confidential information belonging to someone else.
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃과는 직접 다투고, 다른 사람의 비밀은 드러내지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘다른 사람의 비밀’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘직접’은 상대를 피하지 말고 그 사람과 바로 문제를 다루라는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ / רִיב
  english_pob_choice: your case / argue your case
  chosen_korean: 직접 다투고
  alternatives_korean:
  - 사정을 따지고
  - 분쟁을 벌이고
  - 주장을 펴고
  lexicon: HALOT
  rationale: ריב은 단순한 감정적 다툼보다 분쟁을 제기하고 다루는 행위를 가리킬 수 있으므로, 현대 한국어에서 자연스럽고 문맥상 직접적인 ‘직접 다투고’로 옮겼습니다.
- source_word: אֶת רֵעֶךָ
  english_pob_choice: with your neighbor himself
  chosen_korean: 이웃과는
  alternatives_korean:
  - 이웃과 직접
  - 이웃 자신과
  - 이웃에게
  lexicon: HALOT
  rationale: אֶת은 여기서 분쟁의 상대를 표시하므로, 한국어에서는 ‘과’로 자연스럽게 처리했고, POB의 ‘직접’ 뉘앙스는 문장 구조로 드러나게 했습니다.
- source_word: וְסוֹד אַחֵר
  english_pob_choice: another person's secret
  chosen_korean: 다른 사람의 비밀
  alternatives_korean:
  - 남의 비밀
  - 타인의 비밀
  - 다른 이의 비밀
  lexicon: HALOT
  rationale: סוֹד는 비밀, 친밀한 상담, 은밀한 사정을 모두 가리킬 수 있으나 여기서는 타인의 비밀을 누설하지 말라는 대비가 분명하므로 ‘비밀’로 옮겼습니다.
- source_word: אַל תְּגָל
  english_pob_choice: do not reveal
  chosen_korean: 드러내지 마십시오
  alternatives_korean:
  - 밝히지 마십시오
  - 폭로하지 마십시오
  - 공개하지 마십시오
  lexicon: HALOT
  rationale: גלה의 ‘드러내다/폭로하다’ 의미를 살리면서도, 속담체의 금지문에 맞는 현대 한국어로 ‘드러내지 마십시오’를 선택했습니다.
theological_decisions:
- issue: 지혜문학의 권고문 어조
  chosen_reading: 명령형 금지와 권고를 현대 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서문형으로 완화
  - 더 강한 훈계체로 변환
  rationale: 본문은 공동체 안에서 분쟁과 비밀 누설을 다루는 지혜의 권면이므로, 원문의 실천적 권위를 살리되 현대 독자가 자연스럽게 읽을 수 있게 했습니다.
  doctrine_reference: 잠언의 지혜 권면은 법정 절차보다 공동체 윤리와 신실함을 강조합니다.
