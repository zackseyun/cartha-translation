  lexicon: HALOT
  rationale: 방향을 나타내는 관용적 합성어로 자연스럽고 간결하게 옮겼습니다.
- source_word: תְּח֣וֹלֵֽל
  english_pob_choice: brings forth
  chosen_korean: 일으키고
  alternatives_korean:
  - 가져오고
