  - 생겨나게 하고
  lexicon: HALOT
  rationale: 동사 חול의 원인적 의미를 살려, 북풍이 비를 ‘일으킨다’는 능동적 이미지를 유지했습니다.
- source_word: לְשׁ֣וֹן סָֽתֶר
  english_pob_choice: a slanderous tongue
  chosen_korean: 은밀한 혀
  alternatives_korean:
  - 은밀한 말
  - 뒤에서 헐뜯는 혀
  - 비밀스러운 혀
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘혀’를 유지해 원문의 비유를 보존하되, סָתֶר의 ‘숨은/은밀한’ 의미를 드러냈습니다.
theological_decisions:
- issue: פָנִים נִזְעָמִים의 정서 표지
  chosen_reading: ‘분노한 얼굴’로 옮겨, 히브리어 관용구가 나타내는 겉으로 드러난 분노의 표정을 살렸습니다.
  alternative_readings:
  - ‘노한 얼굴’
  - ‘격분한 얼굴’
  rationale: נִזְעָם은 단순한 감정 상태보다 표정으로 드러나는 분노를 가리키므로, 문맥상 짧고 직접적인 표현이 적절합니다.
  doctrine_reference: 잠언의 지혜 격언은 도덕적 결과와 언어의 힘을 강조하므로, 의역으로 교훈성을 약화시키지 않도록 했습니다.
