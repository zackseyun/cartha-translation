source:
  edition: WLC
  text: ר֣וּחַ צָ֭פוֹן תְּח֣וֹלֵֽל גָּ֑שֶׁם וּ/פָנִ֥ים נִ֝זְעָמִ֗ים לְשׁ֣וֹן סָֽתֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/023.yaml
  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
  footnotes:
  - marker: a
    text: Or 'The north wind drives away rain, and a backbiting tongue [brings] an angry face.' The Hebrew verb can be understood differently, and some interpreters take the proverb to mean that the north wind dispels rain rather than produces it.
    reason: alternative_reading
  - marker: b
    text: Literally 'a tongue of secrecy' or 'a hidden tongue,' that is, covert speech such as backbiting or slander.
    reason: lexical_alternative
translation:
  language: ko
  text: 북풍은 비를 일으키고, 은밀한 혀는 분노한 얼굴을 일으킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일으키고’는 히브리어 동사 חול의 원인적 의미를 따른 번역입니다. 이 동사는 문맥에 따라 ‘비를 만들어 내다’ 또는 ‘비를 흩어 버리다’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘은밀한 혀’는 문자적으로는 ‘숨은 혀’ 또는 ‘비밀의 혀’에 가깝습니다. 즉, 뒤에서 하는 험담이나 중상 같은 은밀한 말을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  english_pob_choice: the north wind
  chosen_korean: 북풍
  alternatives_korean:
  - 북쪽 바람
