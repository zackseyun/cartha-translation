id: PRO.25.12
reference: Proverbs 25:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֣זֶם זָ֭הָב וַ/חֲלִי כָ֑תֶם מוֹכִ֥יחַ חָ֝כָ֗ם עַל אֹ֥זֶן שֹׁמָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/012.yaml
  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
  footnotes:
  - marker: a
    text: Or 'Like a gold nose ring and jewelry of fine gold is a wise reprover to an ear that hears.' The Hebrew terms for the ornaments are somewhat general, and the final phrase emphasizes receptive hearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 황금 고리와 순금 장식처럼, 지혜로운 책망은 듣는 귀에 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황금 코걸이와 순금 장식처럼, 지혜롭게 책망하는 사람은 듣는 귀에 그러합니다.’ 히브리어의 장신구 표현은 다소 일반적이며, 마지막 구절은 수용하는 경청을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  english_pob_choice: ring
  chosen_korean: 고리
  alternatives_korean:
  - 코걸이
  - 귀고리
  lexicon: HALOT
  rationale: נֶזֶם은 코나 귀에 다는 고리형 장신구를 가리킬 수 있으나, 본문에서는 위치가 특정되지 않으므로 더 넓은 의미의 ‘고리’로 옮겨 이미지를 과도하게 한정하지 않았습니다.
- source_word: וַחֲלִי כָּתֶם
  english_pob_choice: and an ornament of fine gold
  chosen_korean: 순금 장식
  alternatives_korean:
  - 금 장식
  - 정금 장신구
  lexicon: HALOT
  rationale: חֲלִי와 כָּתֶם은 귀한 장신구와 정련된 금을 가리키므로, 두 표현의 가치를 살리면서도 자연스러운 한국어로 ‘순금 장식’이라 옮겼습니다.
- source_word: מוֹכִיחַ חָכָם
  english_pob_choice: a wise reprover
  chosen_korean: 지혜로운 책망
  alternatives_korean:
  - 지혜로운 책망하는 사람
  - 현명한 교정자
  lexicon: HALOT
  rationale: מוֹכִיחַ는 단순 비난이 아니라 교정적 책망을 뜻하므로 ‘책망’으로 살리고, חָכָם의 형용사적 성격은 ‘지혜로운’으로 옮겨 잠언의 짧은 명사구 리듬을 유지했습니다.
- source_word: אֹזֶן שֹׁמָעַת
  english_pob_choice: a listening ear
  chosen_korean: 듣는 귀
  alternatives_korean:
  - 경청하는 귀
  - 듣는 귀 하나
  lexicon: HALOT
  rationale: 직역하면 ‘듣는 귀’이지만, 이것은 단순 청각이 아니라 받아들이는 태도를 뜻하므로 한국어에서도 비유를 유지한 채 자연스럽게 표현했습니다.
