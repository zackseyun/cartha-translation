  - 좋은 일이 아닙니다
  lexicon: HALOT
  rationale: 지혜문학의 평가 표현을 간결한 표준어로 유지해, 도덕적·실천적 부정 평가를 드러냈습니다.
- source_word: וְחֵקֶר
  english_pob_choice: and searching out
  chosen_korean: 그리고 탐구하는 것
  alternatives_korean:
  - 그리고 캐내는 것
  - 그리고 찾아내는 것
  lexicon: HALOT
  rationale: 명사형 '탐구'를 한국어 동명사 구조로 풀어, 두 번째 행의 행위성을 보존했습니다.
- source_word: כְּבֹדָם כָּבֽוֹד
  english_pob_choice: their glory is glory
  chosen_korean: 그들의 영광을 탐구하는 것은 영광입니다
  alternatives_korean:
  - 그들의 영광을 탐구하는 것은 영광입니다
  - 그들의 영광을 캐내는 것은 영광입니다
  - 그들의 영광은 영광입니다
  lexicon: HALOT
  rationale: 마소라 본문의 난해한 반복어를 평탄화하지 않고, '영광'의 반복을 살려 원문의 압축과 수사를 최대한 보존했습니다.
theological_decisions:
- issue: 난해한 후반부의 해석 범위
  chosen_reading: 후반부를 '그들의 영광을 탐구하는 것은 영광입니다'로 비교적 직역해, 본문이 지닌 중의성을 열어 둡니다.
  alternative_readings:
  - 자기 영광을 추구하는 것은 영광스럽지 않다
  - 무거운 일/중요한 문제를 조사하는 것은 영광이다
  rationale: 영어 POB가 지적하듯 이 행은 해석이 어렵습니다. 문맥을 단정적으로 좁히기보다, 마소라 본문의 반복과 수수께끼성을 한국어에서도 드러내는 쪽이 본문 충실성에 맞습니다.
  doctrine_reference: 잠언 25:27의 문학적 난해성에 대한 본문 비평/주해적 판단
