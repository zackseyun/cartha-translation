  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹקַ֣ר רַ֭גְלְ/ךָ מִ/בֵּ֣ית רֵעֶ֑/ךָ פֶּן יִ֝שְׂבָּעֲ/ךָ֗ וּ/שְׂנֵאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Make your foot rare from your neighbor’s house.' The expression means to visit infrequently.
    reason: lexical_alternative
  - marker: b
    text: Or 'your friend’s house'; the Hebrew word can mean 'neighbor,' 'friend,' or 'companion.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 발을 이웃의 집에 드물게 하십시오.[a][b] 그렇지 않으면 그가 당신에게 싫증을 내고 당신을 미워할까 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 발을 이웃의 집에서 드물게 하라’는 뜻입니다. 여기서는 ‘드물게 가다/방문하다’라는 관용적 의미를 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רֵעַ는 ‘이웃,’ ‘친구,’ ‘동반자’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר רַגְלְךָ
  english_pob_choice: Let your foot be seldom
  chosen_korean: 네 발을 … 드물게 하십시오
  alternatives_korean:
  - 네 발을 아끼십시오
  - 네 발이 드물게 하십시오
  - 네 발을 희소하게 하십시오
  lexicon: HALOT
  rationale: 직역의 ‘발’ 이미지를 살리되, 한국어에서는 ‘드물게 하다/드물게 가다’가 관용적 의미를 가장 자연스럽게 전달합니다. ‘아끼다’는 의미가 약간 바뀌고, ‘희소하게 하다’는 부자연스럽습니다.
- source_word: מִבֵּית רֵעֶךָ
  english_pob_choice: in your neighbor’s house
  chosen_korean: 이웃의 집에
  alternatives_korean:
  - 네 이웃의 집에
  - 친구의 집에
  - 동무의 집에
  lexicon: HALOT
  rationale: רֵעַ는 ‘이웃/친구/동반자’가 가능하지만, 지혜문학의 일반적 사회 관계를 고려해 ‘이웃’이 가장 무난합니다. ‘집에’는 영어 POB의 관용적 재구성을 한국어로 자연스럽게 옮긴 것입니다.
- source_word: פֶּן יִשְׂבָּעֲךָ
  english_pob_choice: lest he have his fill of you
  chosen_korean: 그가 당신에게 싫증을 내고
  alternatives_korean:
  - 그가 당신으로 배부를까 하여
  - 그가 당신에게 질까 하여
  - 그가 당신을 한껏 먹어 배부를까 하여
  lexicon: HALOT
  rationale: שׂבע는 본래 ‘배부르다/충분하다’이지만, 사람 관계에서는 과도한 접촉으로 인한 불쾌와 염증을 뜻합니다. 한국어에서는 ‘싫증을 내다’가 그 의미를 가장 압축적으로 전달합니다.
- source_word: וּשְׂנֵאֶךָ
  english_pob_choice: and hate you
  chosen_korean: 당신을 미워할까 합니다
  alternatives_korean:
  - 당신을 미워할까 합니다
  - 당신을 미워하리라
  - 당신을 미워하게 될까 합니다
  lexicon: HALOT
  rationale: שׂנא의 기본 의미를 약화하지 않고 그대로 살리되, פֶּן 뒤의 경계 표현을 한국어의 ‘-할까 합니다’로 옮겨 경고의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 잠언의 경고문 형식
  chosen_reading: 직접적인 명령과 경고를 살려, 관계의 절제를 권면하는 지혜 격언으로 읽었습니다.
  alternative_readings:
  - 일반적인 인간관계 예절 조언으로 완화해 읽기
  - 단순한 방문 빈도에 대한 사회적 조언으로 축소해 읽기
  rationale: 본문은 과도한 방문이 상대에게 부담과 혐오를 낳을 수 있다는 실제적 지혜를 말하므로, 경고의 힘을 약화시키지 않는 것이 좋습니다.
  doctrine_reference: 잠언의 지혜문학적 권면
