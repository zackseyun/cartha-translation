  naturalness: 현 초안은 ‘네’와 ‘당신’을 한 절 안에서 혼용하며, ‘발을 … 드물게 하십시오’라는 표현도 현대 표준 한국어에서 비문에 가깝습니다. ‘이웃의 집에는 드물게 가십시오’가 간결하고 자연스럽게 같은 명령을 전달합니다. 경고 절은 ‘…하지 않도록’으로 옮겨 합쇼체의 자연스러움과 פֶּן의 예방적 경고를 함께 살렸습니다.
