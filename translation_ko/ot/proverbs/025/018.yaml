  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
  footnotes:
  - marker: a
    text: Or 'A maul, a sword, and a sharp arrow is a man who bears false witness against his neighbor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 곤봉과 칼과 날카로운 화살은 자기 이웃에게 거짓 증언을 하는 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁 곤봉’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵפִיץ
  english_pob_choice: club
  chosen_korean: 곤봉
  alternatives_korean:
  - 몽둥이
  - 망치
  - 전쟁 곤봉
  lexicon: HALOT
  rationale: 파괴하는 무기라는 뜻을 살리면서, 현대 한국어에서 이미지가 분명하고 문맥상 무기 연쇄에 잘 맞는 표현으로 옮겼습니다.
- source_word: חֶרֶב
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: HALOT
  rationale: 히브리어의 일반적인 무기명으로, 한국어 속담체에서도 자연스럽고 간결한 대응어입니다.
- source_word: חֵץ שָׁנוּן
  english_pob_choice: sharp arrow
  chosen_korean: 날카로운 화살
  alternatives_korean:
  - 예리한 화살
  - 날 선 화살
  lexicon: HALOT
  rationale: ‘샤눈’의 ‘날카로운/예리한’ 뜻을 직역하되, 무기 이미지의 강도를 유지했습니다.
- source_word: עֵד שָׁקֶר
  english_pob_choice: false testimony
  chosen_korean: 거짓 증언
  alternatives_korean:
  - 거짓 증언을 하는 증인
  - 거짓 증언하는 자
  - 거짓 증언
  lexicon: HALOT
  rationale: 직역하면 ‘거짓의 증인’이지만, 앞의 ‘답한다’/법정 맥락을 고려할 때 한국어에서는 행위 중심의 ‘거짓 증언’이 더 분명합니다.
theological_decisions:
- issue: 잠언의 격언적 판결문 구조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘A is a man who…’의 진술 구조를 유지해, 비유적 폭력 무기 목록과 거짓 증언자의 동일시를 단정적으로 표현했습니다.
  alternative_readings:
  - “…하는 사람은 곤봉과 칼과 날카로운 화살과 같습니다.”
  - “…하는 사람은 곤봉이요 칼이요 날카로운 화살입니다.”
  rationale: 히브리어는 사람을 세 무기와 동일선상에 놓는 강한 비유를 사용하므로, 비교문으로 약화시키지 않고 서술문으로 유지하는 편이 소스의 힘을 더 잘 전달합니다.
  doctrine_reference: 잠언의 지혜-윤리 경구의 수사 구조
