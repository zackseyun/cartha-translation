  - 퍼 올리게 될
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘집어 모으다/긁어 모으다’를 살리되, 머리 위에 점점 쌓이는 형상을 한국어로 드러내는 표현을 택했습니다.
- source_word: עַל רֹאשׁוֹ
  english_pob_choice: on his head
  chosen_korean: 머리 위에
  alternatives_korean:
  - 그의 머리 위에
  - 머리 위에다
  lexicon: HALOT
  rationale: 직역적인 공간 표지를 유지하여 관용구를 본문에서 설명해 버리지 않도록 했습니다.
- source_word: יְשַׁלֶּם לָךְ
  english_pob_choice: will repay you
  chosen_korean: 갚아 주실 것입니다
  alternatives_korean:
  - 보상해 주실 것입니다
  - 되갚아 주실 것입니다
  - 갚으실 것입니다
  lexicon: HALOT
  rationale: שלם의 ‘보상하다/갚다’ 의미를 살리면서, 여기서는 선한 보응의 문맥을 반영해 한국어에서 자연스러운 ‘갚아 주시다’를 사용했습니다.
- source_word: וַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘머리 위에 타는 숯불’ 관용구의 의미
  chosen_reading: 주석으로 해석을 고정하지 않고 본문에서는 비유를 그대로 보존했습니다.
  alternative_readings:
  - 수치를 통해 원수의 회개를 촉구하는 이미지
  - 하나님의 더 큰 심판을 초래하는 이미지
  - 두 의미가 함께 열려 있는 이미지
  rationale: 히브리어는 비유를 제시할 뿐 그 효과를 명시하지 않으므로, 해석 전통 가운데 하나를 본문에 선택적으로 밀어 넣지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
