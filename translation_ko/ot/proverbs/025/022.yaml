  source_fidelity: 본문의 주어가 히브리어 2인칭 단수(‘당신은’)인데 초안은 ‘그는’으로 되어 있어 핵심 문법 의미가 바뀌었습니다. 또한 목적어의 소유대명사 ‘그의’를 본문에 명시하는 것이 원문에 더 충실합니다. ‘숯불을 쌓게 되다’는 חֹתֶה의 비유적 이미지를 해석으로 환원하지 않고 적절히 보존합니다.
  naturalness: ‘당신은 그의 머리 위에 숯불을 쌓게 될 것이며’와 ‘야훼께서 당신에게 갚아 주실 것입니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 각주 b의 ‘כאן의’는 한국어 문장 안에 부적절하게 남은 표기로, ‘여기의’로 바로잡아야 합니다.
  terminology: ‘야훼’는 제시된 프로젝트 선택과 일치합니다. ‘숯불’은 גֶחָלִים의 살아 있는 숯 이미지를 자연스럽게 전달하며, ‘갚아 주실 것입니다’는 יְשַׁלֶּם לָךְ의 넓은 보응 의미를 유지합니다. ‘머리 위에 숯불’의 의미는 본문에서 해설하지 않고 각주에서 해석 가능성만 제시합니다.
