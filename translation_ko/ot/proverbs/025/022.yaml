theological_decisions:
- issue: ‘머리 위에 타는 숯불’ 관용구의 의미
  chosen_reading: 주석으로 해석을 고정하지 않고 본문에서는 비유를 그대로 보존했습니다.
  alternative_readings:
  - 수치를 통해 원수의 회개를 촉구하는 이미지
  - 하나님의 더 큰 심판을 초래하는 이미지
  - 두 의미가 함께 열려 있는 이미지
  rationale: 히브리어는 비유를 제시할 뿐 그 효과를 명시하지 않으므로, 해석 전통 가운데 하나를 본문에 선택적으로 밀어 넣지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
