reference: Proverbs 25:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י גֶֽחָלִ֗ים אַ֭תָּה חֹתֶ֣ה עַל רֹאשׁ֑/וֹ וַֽ֝/יהוָ֗ה יְשַׁלֶּם לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/022.yaml
  text: for you will heap burning coals on his head[b][a], and Yahweh will repay you.
  footnotes:
  - marker: a
    text: Or, 'for you will gather/rake coals on his head.' The Hebrew idiom is preserved; interpreters differ on whether it implies shaming an enemy into repentance or increasing his judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the LORD will reward you.' The Hebrew verb can denote repayment or recompense, here in a favorable sense toward the righteous person.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그의 머리 위에 숯불을 쌓게 될 것이며, 야훼께서 당신에게 갚아 주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 머리 위에 숯을 긁어모으게 될 것이다’라는 뜻일 수 있습니다. 히브리어 관용구는 보존되며, 이것이 수치를 통한 회개 촉구를 가리키는지, 더 큰 심판을 뜻하는지는 해석이 갈립니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼께서 당신에게 보상해 주실 것입니다’로 옮길 수도 있습니다. 여기의 동사는 갚음이나 보상을 뜻할 수 있으며, 여기서는 의로운 사람에게 유익한 보응의 뜻으로 쓰였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶחָלִים
  english_pob_choice: burning coals
  chosen_korean: 타는 숯불
  alternatives_korean:
