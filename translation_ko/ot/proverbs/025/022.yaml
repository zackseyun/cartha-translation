    rationale: 한국어 각주로서 자연스럽지 않으며 편집 잔재로 보입니다. 의미 변화 없이 ‘여기의 동사’로 고칠 수 있습니다.
  revised_text: 당신은 그의 머리 위에 숯불을 쌓게 될 것이며, 야훼께서 당신에게 갚아 주실 것입니다.[a][b]
