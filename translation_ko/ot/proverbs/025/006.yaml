    reason: lexical_alternative
  revision_rationale: The revision retains the two imperative prohibitions and the source’s courtly, status-oriented imagery. It improves Korean idiom in the second clause and adjusts the footnote to preserve the audited lexical alternative without over-specifying the referents.
