review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders both prohibitions. ‘스스로를 높이지 말고’ appropriately conveys the reflexive Hitpael sense of presenting oneself as honored or exalted, and ‘왕 앞에서’ preserves the courtly setting. The second clause’s social-status sense is present, though ‘높은 사람들’ can sound somewhat vague or physically spatial in Korean.
  naturalness: The sentence is clear and uses appropriate modern formal-polite register. Replacing ‘높은 사람들의’ with ‘높은 이들의’ makes the expression more concise and idiomatic while retaining the source’s deliberately broad designation for socially eminent people.
  terminology: ‘왕’ and ‘스스로를 높이다’ are suitable. ‘높은 이들’ naturally denotes persons of high standing without over-specifying them as officials or nobles. The footnote should identify this social-status meaning and retain the lexical alternative rather than merely restating it.
  issues:
  - severity: low
    issue: ‘높은 사람들’ is slightly awkward and may not immediately signal social prominence.
    rationale: גדלים denotes socially great or prominent persons in this setting, not persons who are physically high. ‘높은 이들’ is more natural Korean while preserving the broad source term.
  - severity: low
    issue: The footnote labeled lexical_alternative supplies explanation but no stated alternative.
    rationale: The English audit trail preserves ‘important people’ as an alternative. The Korean note can preserve that interpretive option while explaining the social-status sense.
  revised_text: 왕 앞에서 스스로를 높이지 말고, 높은 이들의 자리에 서지 마십시오.[a]
  revised_footnotes:
