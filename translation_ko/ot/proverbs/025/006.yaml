translation:
  language: ko
  text: 왕 앞에서 스스로를 높이지 말고, 높은 이들의 자리에 서지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중요한 사람들’. 원문의 ‘높은 이들’은 사회적으로 높은 지위에 있는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַדַּר
  english_pob_choice: exalt yourself
  chosen_korean: 스스로를 높이다
  alternatives_korean:
  - 자기를 드러내다
  - 스스로를 영화롭게 하다
  - 자기를 내세우다
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 뉘앙스를 살려, 타인 앞에서 자신을 높이거나 과시하는 태도를 한국어로 자연스럽게 옮겼습니다.
- source_word: לִפְנֵי מֶלֶךְ
  english_pob_choice: before a king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 앞에서
  - 왕 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·관계적 의미를 간결하게 반영하여 궁정적 상황을 자연스럽게 드러냈습니다.
- source_word: בִּמְקוֹם גְּדֹלִים
  english_pob_choice: in the place of great men
  chosen_korean: 높은 사람들의 자리
  alternatives_korean:
  - 위대한 사람들의 자리
  - 중요한 사람들의 자리
  - 귀한 사람들의 자리
  lexicon: HALOT
  rationale: מָקוֹם의 ‘자리/장소’와 גְּדֹלִים의 사회적 지위 의미를 살리되, 한국어에서 더 자연스러운 표현으로 옮겼습니다.
- source_word: תַּעֲמֹד
  english_pob_choice: stand
  chosen_korean: 서다
  alternatives_korean:
  - 자리를 차지하다
  - 서 있다
  - 자리하다
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘서다’가 가장 직접적이며, 높은 자리에 자신을 두려는 태도를 경계하는 뜻을 분명히 합니다.
theological_decisions:
- issue: 가나안/궁정 사회의 위계 속에서의 태도 경고를 어떻게 한국어로 전달할지
  chosen_reading: ‘스스로를 높이지 말고… 서지 마십시오’로, 자만과 자리 넘보기를 함께 경계하는 권고로 번역했습니다.
  alternative_readings:
  - ‘자기를 드러내지 마십시오’
  - ‘자신을 영화롭게 하지 마십시오’
  rationale: 히브리어는 단순한 예의범절보다 사회적 상승 욕망과 자기 과시를 경계합니다. 한국어에서도 그 긴장을 유지하는 것이 문맥상 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1-2
