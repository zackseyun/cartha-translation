id: PRO.25.13
reference: Proverbs 25:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
  footnotes:
  - marker: a
    text: Or 'Like the cold of snow in harvest time.' The Hebrew image likely refers to refreshing coolness associated with snow, not snowfall damaging the harvest.
    reason: lexical_alternative
  - marker: b
    text: Or 'he restores the soul of his masters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 추수하는 날의 눈의 서늘함과 같으니, 충실한 사자는 자신을 보낸 이들에게 그러하며, 주인들의 생명을 소생시킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '추수 때 눈의 차가움처럼.' 히브리어 이미지는 수확을 해치는 눈보라가 아니라, 눈과 관련된 시원한 서늘함을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 주인들의 생명을 회복시킵니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת שֶׁלֶג
  english_pob_choice: Like the coolness of snow
  chosen_korean: 눈의 서늘함과 같으니
  alternatives_korean:
  - 눈의 차가움과 같으니
  - 눈의 냉기와 같으니
  lexicon: HALOT
  rationale: צִנָּה는 단순한 '차가움'보다 사람을 시원하게 해 주는 서늘함/냉기를 가리키므로, 긍정적 비유에 맞게 '서늘함'으로 옮겼습니다.
- source_word: בְּיוֹם קָצִיר
  english_pob_choice: on a harvest day
  chosen_korean: 추수하는 날
  alternatives_korean:
  - 추수 때
  - 추수철에
  lexicon: HALOT
  rationale: 히브리어의 구체적 시간 표현을 살리되, 한국어에서는 자연스럽게 '추수하는 날'로 풀어 과도한 직역을 피했습니다.
- source_word: צִיר נֶאֱמָן
  english_pob_choice: a faithful messenger
  chosen_korean: 충실한 사자
  alternatives_korean:
  - 신실한 전령
  - 믿음직한 사자
  lexicon: HALOT
  rationale: צִיר는 지혜문학에서 '보내진 자/전달자'의 뜻이 강하므로, 현대 한국어에서 자연스럽고 위엄 있는 '사자'를 택하고 נֶאֱמָן은 '충실한'으로 옮겼습니다.
- source_word: לְשֹׁלְחָיו
  english_pob_choice: to those who send him
  chosen_korean: 자신을 보낸 이들에게
  alternatives_korean:
  - 그를 보낸 사람들에게
  - 보내는 이들에게
  lexicon: HALOT
  rationale: 히브리어 복수형과 소유 접미를 살려 '자신을 보낸 이들'로 옮겨, 단수화 없이 수신자 복수를 보존했습니다.
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  english_pob_choice: for he refreshes the life of his masters
  chosen_korean: 주인들의 생명을 소생시킵니다
  alternatives_korean:
  - 주인들의 생명을 새롭게 합니다
  - 주인들의 삶을 회복시킵니다
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 '영혼'보다 생명/활력의 의미가 자연스럽고, יָשִׁיב은 '돌아오게 하다/회복시키다'의 뜻을 살려 '소생시키다'로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנָיו의 복수성과 관계의 강도
  chosen_reading: '''주인들의''로 복수성을 그대로 드러내되, 노예제의 법적 구조를 과도하게 전면화하지는 않았습니다.'
  alternative_readings:
  - '''그의 주인들의'''
  - '''그의 주인에게'''
  rationale: 본문은 복수형을 분명히 가지므로 이를 보존해야 하지만, 잠언의 비유적 문맥상 주인/종 관계를 지나치게 확장해 해석할 필요는 없습니다.
  doctrine_reference: 문법적 수(복수) 보존과 비유문맥 존중
