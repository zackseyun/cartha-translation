  to: 추수하는 날의 눈의 서늘함처럼, 충실한 전령은 자신을 보낸 이들에게 같습니다.[a] 그는 그의 주인들의 생기를 되살립니다.[b]
  rationale: 비교문의 대상과 수혜자를 명시적으로 연결하여 히브리어 구문을 정확하고 자연스러운 한국어로 옮겼습니다. 마지막 절은 יָשִׁיב의 ‘되돌리다/회복시키다’ 의미를 유지하면서, נֶפֶשׁ의 문맥상 활력이라는 뜻을 ‘생기’로 드러냈습니다. 본문과 각주의 표지도 각각 해당 표현 뒤에 배치했습니다.
