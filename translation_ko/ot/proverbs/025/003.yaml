id: PRO.25.3
reference: Proverbs 25:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
  footnotes:
  - marker: a
    text: Or 'is unsearchable' or 'there is no fathoming.' The Hebrew literally says 'there is no searching/finding out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘은 높고, 땅은 깊으며, 왕들의 마음은 헤아릴 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘찾아봄/헤아림이 없다’는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘들(천상)
  lexicon: HALOT
  rationale: 히브리어 복수형은 관용적으로 ‘하늘들/하늘’의 뜻이지만, 한국어 성경 문맥에서는 자연스럽게 ‘하늘’이 가장 직접적이며 높이의 대비를 살립니다.
- source_word: לָ֭/רוּם
  english_pob_choice: for height
  chosen_korean: 높고
  alternatives_korean:
  - 높이로
  - 높음으로
  - 높이에 관하여
  lexicon: HALOT
  rationale: 앞절의 ‘하늘’에 걸리는 비교의 의미를 한국어에서는 짧은 형용사구로 풀어 ‘높고’라고 옮겨, 높이의 척도를 자연스럽게 드러냈습니다.
- source_word: לָ/עֹ֑מֶק
  english_pob_choice: for depth
  chosen_korean: 깊으며
  alternatives_korean:
  - 깊이로
  - 깊음으로
  - 깊이에 관하여
  lexicon: HALOT
  rationale: ‘높고’와 대구를 이루도록 ‘깊으며’로 옮겨, 땅의 깊이를 하늘의 높이와 평행하게 제시하는 히브리어 구조를 살렸습니다.
- source_word: אֵין חֵקֶר
  english_pob_choice: there is no searching out
  chosen_korean: 헤아릴 수 없습니다
  alternatives_korean:
  - 찾아낼 수 없습니다
  - 다 헤아릴 수 없습니다
  - 샅샅이 찾아낼 수 없습니다
  lexicon: HALOT
  rationale: 직역의 ‘찾아봄이 없다’보다는 한국어에서 ‘측량 불가/헤아릴 수 없음’이 관용적으로 같은 무한성을 전달하므로, 특히 왕들의 마음에 대한 인간적 탐지 불가를 분명히 했습니다.
theological_decisions:
- issue: 마지막 절의 범위—‘헤아릴 수 없음’이 어디에 가장 직접 걸리는가
  chosen_reading: ‘왕들의 마음은 헤아릴 수 없습니다’로 옮겨, 마지막 진술이 가장 직접적으로 왕들의 마음을 가리키되, 하늘과 땅의 비유적 무한성도 함께 울리도록 했습니다.
  alternative_readings:
  - ‘헤아릴 수 없는 것은 왕들의 마음입니다’
  - ‘왕들의 마음을 헤아릴 수 없습니다’
  rationale: 히브리어는 세 대상(하늘, 땅, 왕들의 마음)을 병렬로 세우고 결론으로 ‘검색할 수 없음’을 붙이므로, 한국어에서도 결론을 왕들의 마음에 직접 연결하되 앞의 비교 구조를 해치지 않는 표현이 가장 적절합니다.
  doctrine_reference: 문학적 지혜문학의 관찰 진술; 특별한 교리 쟁점 없음
