  rationale: The revision removes only the unsupported adversative connective, preserving the Hebrew’s direct two-clause proverb structure, all concrete imagery, the masculine-singular youth reference, and the formal-polite Korean register. The footnote is retained with a clearer Korean rationale for the lexical age-range alternative.
