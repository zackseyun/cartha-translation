    text: 또는 ‘어리석음은 한 젊은이의 마음에 묶여 있습니다.’
    reason: נָעַר는 문맥에 따라 소년보다 넓게 ‘젊은이’를 가리킬 수도 있습니다.
  revision_rationale: The revision removes only the unsupported adversative connective, preserving the Hebrew’s direct two-clause proverb structure, all concrete imagery, the masculine-singular youth reference, and the formal-polite Korean register. The footnote is retained with a clearer Korean rationale for the lexical age-range alternative.
