  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
  footnotes:
  - marker: a
    text: Or 'Foolishness is tied to the heart of a youth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석음은 소년[a]의 마음에 묶여 있고, 훈육의 막대기는 그것을 그에게서 멀리 쫓아냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석음은 한 젊은이의 마음에 묶여 있습니다.’
    reason: נָעַר는 문맥에 따라 소년보다 넓게 ‘젊은이’를 가리킬 수도 있습니다.
lexical_decisions:
- source_word: אִוֶּלֶת
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매
  - 어리석은 것
  lexicon: HALOT
  rationale: 지혜문학의 אִוֶּלֶת은 단순한 지적 부족보다 도덕적·영적 어리석음을 가리키므로, 한국어에서는 ‘어리석음’이 가장 간결하고 자연스럽게 그 뉘앙스를 살립니다.
- source_word: קְשׁוּרָה
  english_pob_choice: is bound up
  chosen_korean: 묶여 있지만
  alternatives_korean:
  - 매여 있지만
  - 붙들려 있지만
  lexicon: HALOT
  rationale: ‘묶이다’는 마음에 깊이 고정·결박된 상태를 살리며, ‘묶여 있지만’은 속담적 압축과 현재 상태를 함께 전달합니다.
- source_word: בְלֶב
  english_pob_choice: in the heart
  chosen_korean: 마음에
  alternatives_korean:
  - 심장에
  - 속에
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 사고·의지·욕망의 중심을 가리키므로, 한국어도 ‘마음’으로 옮겨 원문의 인간학적 이미지를 유지합니다.
- source_word: נָעַר
  english_pob_choice: a boy
  chosen_korean: 소년
  alternatives_korean:
  - 청년
  - 어린이
  - 청소년
  lexicon: HALOT
  rationale: 문법상 남성 단수이며 문맥상 훈육 대상인 미성숙한 남자아이를 가리키므로, 성중립화보다 ‘소년’이 가장 정확합니다.
- source_word: שֵׁבֶט מוּסָר
  english_pob_choice: the rod of discipline
  chosen_korean: 훈육의 막대기
  alternatives_korean:
  - 징계의 막대기
  - 교정의 지팡이
  - 훈육의 몽둥이
  lexicon: HALOT
  rationale: שֵׁבֶט의 구체적 물체 이미지를 유지하되, 한국어에서 ‘막대기’는 상징적·물리적 의미를 함께 살릴 수 있습니다. מוּסָר는 단순 처벌보다 형성적 교정이므로 ‘훈육’이 적절합니다.
- source_word: יַרְחִיקֶנָּה
  english_pob_choice: will drive it far
  chosen_korean: 멀리 쫓아냅니다
  alternatives_korean:
  - 멀리 내쫓습니다
  - 멀리 몰아냅니다
  - 멀리 떨어지게 합니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미인 ‘멀어지게 하다’를 살리면서, 속담의 강한 동작성을 자연스럽게 전달하는 표현입니다.
theological_decisions:
- issue: 문자의 구체성(막대기)을 추상화할지 여부
  chosen_reading: 본문의 구체적 이미지인 ‘훈육의 막대기’를 유지했습니다.
  alternative_readings:
  - ‘훈육’만 남기고 도구 이미지를 제거하는 번역
  - ‘징계’처럼 더 완화된 표현
  rationale: 히브리어 원문은 실제 도구를 말하므로, 현대적 불편을 이유로 삭제하기보다 원문이 가진 긴장을 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 원문 우선 번역 원칙; 해소되지 않은 윤리적 긴장 보존
- issue: נָעַר의 성별과 연령 범위
  chosen_reading: 문맥상 남성 단수의 ‘소년’으로 옮겼습니다.
  alternative_readings:
  - ‘청년’
  - ‘어린아이’
  - 성중립적 ‘젊은이’
  rationale: 형태와 문맥이 남자아이/미성숙한 아들을 가리키므로, 성중립화보다 원문의 성별 표지를 유지하는 편이 정확합니다.
  doctrine_reference: 성별-정확 번역 원칙
