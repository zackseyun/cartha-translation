translation:
  language: ko
  text: 이로써 너의 신뢰가 야훼께 있게 하려는 것입니다. 내가 오늘, 바로 너에게 그것을 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '오늘 너에게, 바로 너에게 알렸다'에 가깝습니다. 앞뒤 문맥상 '그것들'(이 말씀들/훈계들)이 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת בַּיהוָה מִבְטַחֶךָ
  english_pob_choice: So that your trust may be in Yahweh
  chosen_korean: 이로써 너의 신뢰가 야훼께 있게 하려는 것입니다
  alternatives_korean:
  - 너의 신뢰가 야훼 안에 있게 하려는 것입니다
  - 너의 의지가 야훼께 있게 하려는 것입니다
  lexicon: HALOT
  rationale: לִהְיוֹת의 목적 용법을 한국어 목적 표현으로 살렸고, בַּיהוָה는 신뢰의 대상/근거를 나타내므로 '야훼께 있게'로 자연스럽게 옮겼습니다.
- source_word: מִבְטַחֶךָ
  english_pob_choice: your trust
  chosen_korean: 너의 신뢰
  alternatives_korean:
  - 너의 믿음
  - 너의 확신
  lexicon: HALOT
  rationale: מִבְטָח은 의지하는 바, 신뢰의 의미이므로 교리적 용어인 '믿음'보다 문맥상 직접적인 '신뢰'가 더 정확합니다.
- source_word: הוֹדַעְתִּיךָ
  english_pob_choice: I have made known to you
  chosen_korean: 내가 ... 알렸습니다
  alternatives_korean:
  - 내가 ... 알려 주었습니다
  - 내가 ... 깨닫게 했습니다
  lexicon: HALOT
  rationale: Hiphil ידע의 '알게 하다/알리다'를 반영해 직접적이고 공적인 어조의 '알렸습니다'로 옮겼습니다.
- source_word: אַף אָתָּה
  english_pob_choice: even to you
  chosen_korean: 바로 너에게
  alternatives_korean:
  - 심지어 너에게
  - 너에게도
  lexicon: HALOT
  rationale: אַף의 강조와 독립대명사 אָתָּה의 도드라짐을 한국어에서 자연스럽게 드러내기 위해 '바로 너에게'로 처리했습니다.
