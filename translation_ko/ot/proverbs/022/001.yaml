id: PRO.22.1
reference: Proverbs 22:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִבְחָ֣ר שֵׁ֭ם מֵ/עֹ֣שֶׁר רָ֑ב מִ/כֶּ֥סֶף וּ֝/מִ/זָּהָ֗ב חֵ֣ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
  footnotes:
  - marker: a
    text: Or 'A name is more desirable than great wealth; favor is better than silver and gold.'
    reason: lexical_alternative
  - marker: b
    text: '''Name'' here carries the sense of reputation or honor.'
    reason: cultural_note
  - marker: c
    text: Or 'grace' for 'favor.' The Hebrew term can denote graciousness or favorable regard depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이름[a]은 큰 재물보다 더 택할 만하고[c], 호의[b]는 은과 금보다 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘이름’은 단순한 호칭이 아니라 평판이나 명예를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 חֵן은 문맥에 따라 ‘호의’, ‘은총’, 또는 ‘은혜’로 옮길 수 있습니다. 여기서는 사람들에게서 받는 호의나 좋은 평판을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이름은 큰 재물보다 더 바람직하며’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  english_pob_choice: is to be chosen
  chosen_korean: 택함을 받아야 하고
  alternatives_korean:
  - 택함을 받아야 합니다
  - 선택되어야 합니다
  - 선택받는 것이 낫습니다
  lexicon: HALOT
  rationale: 비교격 잠언 구조에서 단순한 상태가 아니라 ‘선택의 우선성’을 드러내기 위해 수동적 가치판단을 살린 표현을 택했습니다.
- source_word: שֵׁם
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 평판
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘이름’을 살리되, 잠언 문맥에서 암시되는 평판의 의미는 독자가 자연스럽게 읽도록 두었습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 은혜
  - 호감
  lexicon: HALOT
  rationale: 문맥상 사람 사이의 호의와 호감을 가리키지만, 잠언의 간결하고 긍정적인 어감을 살리기 위해 ‘은총’을 택했습니다. 여기서는 신학적 ‘은혜’보다 사회적 호의를 더 넓게 포괄합니다.
- source_word: טוֹב
  english_pob_choice: better
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 히브리어의 비교문 구조를 한국어에서 자연스럽게 드러내기 위해 ‘좋다’보다 ‘더 낫다’로 옮겼습니다.
theological_decisions:
- issue: חֵן의 번역을 ‘은혜’로 둘지 ‘은총/호의’로 둘지
  chosen_reading: 문맥상 상호관계적 호의를 뜻하는 말로 읽어 ‘은총’으로 옮겼습니다.
  alternative_readings:
  - 은혜
  - 호의
  - 호감
  rationale: 이 절은 하나님과의 구원론적 ‘은혜’보다 사람들 사이에서 받는 좋은 평판과 호의를 말하는 잠언입니다. 따라서 신학적 고유어를 과도하게 불러오지 않도록 했습니다.
  doctrine_reference: 잠언 22:1의 지혜문학적 문맥
- issue: שֵׁם을 ‘이름’으로 직역할지 ‘명성’으로 풀어낼지
  chosen_reading: 본문에는 ‘이름’을 두고, 의미는 평판/명예로 읽히도록 열어 두었습니다.
  alternative_readings:
  - 명성
  - 평판
  rationale: 원문의 이미지와 비교 구조를 보존하는 것이 중요하므로, 해석어로 고정하기보다 문자적 표현을 유지했습니다.
  doctrine_reference: 지혜문학의 잠언적 비유
