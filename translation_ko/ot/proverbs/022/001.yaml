  rationale: The revision preserves the Hebrew’s literal ‘name,’ its paired comparative structure, and its concise proverbial register. It replaces the deontic and less idiomatic passive wording with a Korean comparative expression that reflects the evaluative force of נִבְחָר. It also renders חֵן as ‘호의’ to fit the social-estimation context, while retaining possible lexical breadth in a note. Footnote anchors have been moved to their relevant terms and clause.
