  - 친해지지 마시고
  - 교제하지 마시고
  lexicon: HALOT
  rationale: 히트파엘형은 단순 접촉보다 친밀한 교제·동행의 의미가 있어, 자연스러운 합쇼체로는 ‘어울리다’가 관계적 밀착을 잘 드러냅니다.
- source_word: בַּעַל אָף
  english_pob_choice: a man given to anger
  chosen_korean: 성미가 급한 사람
  alternatives_korean:
  - 화를 잘 내는 사람
  - 분노를 잘 내는 사람
