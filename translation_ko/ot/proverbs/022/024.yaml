base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/024.yaml
  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
  footnotes:
  - marker: a
    text: Or 'associate with an angry man.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'do not come with'; the sense here is joining or keeping company with such a person.
    reason: lexical_alternative
translation:
  language: ko
  text: 화를 잘 내는 사람과 사귀지 마시고[a], 격분하기 쉬운 사람과 함께 다니지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘분노의 주인’에 가깝습니다. 여기서는 분노로 특징지어지는 사람을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘…와 함께 오지 마십시오’에 가깝습니다. 여기서는 그러한 사람과 동행하거나 그와 어울리는 것을 금하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
