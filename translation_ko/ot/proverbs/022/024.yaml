  text: אַל תִּ֭תְרַע אֶת בַּ֣עַל אָ֑ף וְ/אֶת אִ֥ישׁ חֵ֝מוֹת לֹ֣א תָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/024.yaml
  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
  footnotes:
  - marker: a
    text: Or 'associate with an angry man.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'do not come with'; the sense here is joining or keeping company with such a person.
    reason: lexical_alternative
translation:
  language: ko
  text: 성미가 급한 사람과 어울리지 마시고, 분노를 품은 사람과 함께 가지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘분노의 소유자’에 가깝지만, 여기서는 성향을 가리키는 관용구로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 절도 문자적으로는 ‘오지 마십시오/함께 가지 마십시오’의 뜻이지만, 문맥상 특정 사람과의 동행·교제를 금하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  english_pob_choice: befriend
  chosen_korean: 어울리지 마시고
  alternatives_korean:
