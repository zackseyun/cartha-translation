  lexicon: HALOT
  rationale: 첫 절과 병행되는 성격 묘사로서, 단순 감정 폭발보다 지속적으로 분노를 품는 인물을 드러내는 표현을 택했습니다.
- source_word: תָבֽוֹא
  english_pob_choice: go with
  chosen_korean: 함께 가지 마십시오
  alternatives_korean:
  - 같이 다니지 마십시오
  - 동행하지 마십시오
  - 그와 함께 가지 마십시오
  lexicon: HALOT
  rationale: 기본 뜻은 ‘오다’이지만 문맥상 사람과의 동행·동반 관계를 금하는 말이므로, ‘함께 가다’로 자연스럽게 풀었습니다.
