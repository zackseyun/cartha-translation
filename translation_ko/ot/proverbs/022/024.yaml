  lexicon: HALOT
  rationale: 직역하면 ‘분노의 소유자’이지만, 히브리어 관용구의 성격을 살려 성향을 나타내는 한국어 표현으로 옮겼습니다.
- source_word: אִישׁ חֵמוֹת
  english_pob_choice: a man of wrath
  chosen_korean: 분노를 품은 사람
