  source_fidelity: 히브리어의 병렬 구조와 비유를 대체로 충실히 옮겼습니다. צִנִּים은 ‘가시’, פַּחִים은 ‘올무’, נַפְשׁוֹ는 이 문맥에서 ‘자기 생명’으로 옮기는 것이 적절합니다. 다만 יִרְחַק מֵהֶם은 위험물들을 의도적으로 피한다는 뜻이므로 기존의 ‘그것들로부터 멀리합니다’보다 ‘그것들을 멀리합니다’가 한국어 문법과 의미 전달 양면에서 낫습니다.
  naturalness: ‘그것들로부터 멀리합니다’는 현대 한국어에서 목적어 또는 보어 구성이 어색합니다. ‘그것들을 멀리합니다’는 격언체로 자연스럽고, ‘멀리하다’의 의도적 회피 의미도 살립니다. ‘비뚤어진 사람’은 현대 표준어에서 자연스럽습니다.
  terminology: ‘가시와 올무’는 원문의 구체적 위험 이미지와 잠언의 비유적 어조를 잘 보존합니다. עִקֵּשׁ의 대안으로 제시된 ‘사악한’은 도덕적 악의 의미를 다소 좁히므로, ‘패역한’ 또는 ‘교활한’과 같이 원문의 ‘뒤틀림/일그러짐’ 및 ‘간교함’ 범위를 반영하도록 각주를 조정했습니다.
