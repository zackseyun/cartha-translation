id: PRO.22.5
reference: Proverbs 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
  footnotes:
  - marker: a
    text: Or 'traps' for 'snares.'
    reason: lexical_alternative
  - marker: b
    text: '''The crooked'' may also be rendered ''the perverse'' or ''the devious.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his soul'; here 'life' conveys the sense of preserving oneself from danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 가시와 올무가 삐뚤어진 자의 길에 있습니다[a][b]; 자기 생명을 지키는 사람은 그것들로부터 멀리합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덫’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삐뚤어진’은 ‘비뚤어진’이나 ‘사악한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그의 영혼’을 말하지만, 여기서는 위험을 피하며 자기 생명을 보존한다는 뜻에서 ‘생명’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  english_pob_choice: thorns
  chosen_korean: 가시
  alternatives_korean:
  - 엉겅퀴
  - 가시덤불
  lexicon: HALOT
  rationale: 직역적 이미지인 'thorns'를 한국어의 가장 자연스러운 대응인 '가시'로 옮겨, 위험이 깔린 길의 비유를 살렸습니다.
- source_word: פַּחִים
  english_pob_choice: snares
  chosen_korean: 올무
  alternatives_korean:
  - 덫
  - 함정
  lexicon: HALOT
  rationale: '''snares''는 숨겨진 포획 장치를 가리키므로, 관용적이고 비유적인 한국어 표현인 ''올무''가 적절합니다.'
- source_word: בְּדֶרֶךְ
  english_pob_choice: in the path of
  chosen_korean: …의 길에
  alternatives_korean:
  - …의 길 안에
  - …의 행위에
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문자적 길이면서 삶의 행로를 뜻하므로, 한국어에서는 '…의 길'로 옮겨 비유를 유지했습니다.
- source_word: עִקֵּשׁ
  english_pob_choice: the crooked
  chosen_korean: 삐뚤어진 자
  alternatives_korean:
  - 굽은 자
  - 비뚤어진 자
  - 사악한 자
  lexicon: HALOT
  rationale: 도덕적으로 뒤틀린 사람이라는 이미지를 살리면서도 현대 한국어에서 이해하기 쉬운 표현을 택했습니다. '사악한'은 의미를 좁혀 원문의 형상을 약화시킬 수 있습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 자기 생명
  alternatives_korean:
  - 자기 목숨
  - 자기 영혼
  - 자기 자신
  lexicon: HALOT
  rationale: 지혜문학 문맥에서는 נֶפֶשׁ이 '생명/목숨'의 뜻으로 쓰이므로, '자기 생명'이 원문의 보존·위험 회피 맥락을 가장 잘 드러냅니다.
- source_word: יִרְחַק
  english_pob_choice: keeps far
  chosen_korean: 멀리합니다
  alternatives_korean:
  - 멀리합니다
  - 멀어집니다
  - 떨어져 지냅니다
  lexicon: HALOT
  rationale: 격언형 현재적 진술을 한국어의 평서적 현재로 자연스럽게 풀어, 의도적인 거리두기를 분명히 했습니다.
theological_decisions:
- issue: 지혜 격언의 일반 명제와 남성 단수 표현
  chosen_reading: 자기 생명을 지키는 사람
  alternative_readings:
  - 자기 생명을 지키는 이
  - 자기 생명을 지키는 자
  rationale: 히브리어 남성 단수 분사를 한국어에서 성별을 드러내지 않는 일반 명제로 옮겨, 잠언의 보편적 교훈성을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 비유의 강도 유지
  chosen_reading: 가시와 올무
  alternative_readings:
  - 가시와 덫
  - 가시와 함정
  rationale: 원문은 위험 요소를 병렬로 제시하므로, 너무 기술적인 '덫'보다 비유적 울림이 있는 '올무'를 택해 지혜문학의 경구성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §source-direct figurative rendering
