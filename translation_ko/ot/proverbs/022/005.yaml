  lexicon: HALOT
  rationale: 격언형 현재적 진술을 한국어의 평서적 현재로 자연스럽게 풀어, 의도적인 거리두기를 분명히 했습니다.
theological_decisions:
- issue: 지혜 격언의 일반 명제와 남성 단수 표현
  chosen_reading: 자기 생명을 지키는 사람
  alternative_readings:
  - 자기 생명을 지키는 이
  - 자기 생명을 지키는 자
  rationale: 히브리어 남성 단수 분사를 한국어에서 성별을 드러내지 않는 일반 명제로 옮겨, 잠언의 보편적 교훈성을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 비유의 강도 유지
  chosen_reading: 가시와 올무
  alternative_readings:
  - 가시와 덫
  - 가시와 함정
  rationale: 원문은 위험 요소를 병렬로 제시하므로, 너무 기술적인 '덫'보다 비유적 울림이 있는 '올무'를 택해 지혜문학의 경구성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §source-direct figurative rendering
