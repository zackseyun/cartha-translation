  text: שׁוּחָ֣ה עֲ֭מֻקָּה פִּ֣י זָר֑וֹת זְע֥וּם יְ֝הוָ֗ה יפול שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
  footnotes:
  - marker: a
    text: Or 'strange women,' 'foreign women,' or 'adulterous women.' The Hebrew term in Proverbs commonly refers to women who are outside proper covenantal sexual boundaries.
    reason: lexical_alternative
translation:
  language: ko
  text: 금지된 여인들의 입은 깊은 구덩이입니다[a]; 야훼의 진노 아래 있는 자는 그곳에 떨어집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 여인들’, ‘외국 여인들’, ‘간음한 여인들’로도 옮길 수 있습니다. 이 히브리어 표현은 잠언에서 흔히 정당한 언약적·성적 경계 밖에 있는 여인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה עֲ֭מֻקָּה
  english_pob_choice: a deep pit
  chosen_korean: 깊은 구덩이
  alternatives_korean:
  - 깊은 구렁
  - 깊은 함정
  lexicon: HALOT
  rationale: שׁוּחָה는 깊은 구덩이/구렁을 가리키므로, 이미지와 위험성을 살리면서도 현대 한국어에서 자연스러운 ‘깊은 구덩이’로 옮겼습니다.
- source_word: פִּי
  english_pob_choice: mouth
  chosen_korean: 입술이
  alternatives_korean:
  - 입이
  - 말이
  - 혀가
  lexicon: HALOT
  rationale: 직역하면 ‘입’이지만, 잠언의 유혹적 발화 이미지를 한국어로 더 자연스럽게 드러내기 위해 ‘입술’로 옮겨 화자의 말하는 기능을 살렸습니다.
- source_word: זָרוֹת
  english_pob_choice: forbidden women
  chosen_korean: 금지된 여인들
  alternatives_korean:
  - 낯선 여인들
  - 외국 여인들
  - 음란한 여인들
  lexicon: HALOT
  rationale: 잠언에서 זָרָה는 단순한 민족적 ‘외국인’보다 언약적·성적 경계를 벗어난 여인을 가리키는 경우가 많아, 이를 설명적으로 ‘금지된 여인들’로 옮겼습니다.
- source_word: זְעוּם יְהוָה
  english_pob_choice: he who is under Yahweh’s wrath
  chosen_korean: 야훼의 분노 아래 있는 자
  alternatives_korean:
  - 야훼께 저주받은 자
  - 야훼께서 혐오하시는 자
  lexicon: HALOT
  rationale: זְעוּם은 단순한 감정이 아니라 하나님의 진노/분노의 상태에 놓인 사람을 뜻하므로, 결과 상태를 드러내는 ‘분노 아래 있는 자’로 번역했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 고유명사 יְהוָה를 직접 사용하므로, POB 기준에 따라 이를 ‘야훼’로 옮겨 본문이 가진 언약적 명명성을 보존했습니다.
  doctrine_reference: POB divine-name policy
