id: PRO.22.10
reference: Proverbs 22:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
  footnotes:
  - marker: a
    text: Or 'mocker' for 'scoffer.' The Hebrew לֵץ is a stock wisdom term for a person who arrogantly ridicules correction and wisdom.
    reason: lexical_alternative
  - marker: b
    text: '''Contention'' translates Hebrew דִּין here in the sense of dispute or quarrel; elsewhere the word can mean ''judgment'' or ''legal case.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 사람을 내쫓으십시오. 그러면 다툼이 떠나고, 분쟁과 수치가 그칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֵץ는 지혜의 교훈을 오만하게 비웃고 거부하는 사람을 가리키므로, '조롱하는 사람'으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 דִּין은 여기서 '판결'보다 분쟁·논쟁의 뜻으로 쓰인 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  english_pob_choice: Drive out
  chosen_korean: 내쫓으십시오
  alternatives_korean:
  - 쫓아내십시오
  - 몰아내십시오
  lexicon: HALOT
  rationale: גרשׁ의 강한 추방·배제 의미를 살리면서, 현대 한국어에서 명령형으로 자연스럽고 직접적인 표현을 택했습니다.
- source_word: לֵץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 사람
  alternatives_korean:
  - 조롱꾼
  - 비웃는 사람
  lexicon: HALOT
  rationale: לץ는 지혜의 훈계를 거부하며 오만하게 비웃는 사람을 가리키므로, 인물의 태도를 드러내는 표현으로 옮겼습니다.
- source_word: מָדוֹן
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 다툼거리
  lexicon: HALOT
  rationale: מָדוֹן은 분쟁과 갈등을 뜻하며, 여기서는 앞의 추방 결과로 사라지는 갈등 상황을 간결하게 나타내는 '다툼'이 자연합니다.
- source_word: דִּין
  english_pob_choice: contention / judgment
  chosen_korean: 분쟁
  alternatives_korean:
  - 판결
  - 재판
  - 시비
  lexicon: HALOT
  rationale: 문맥상 דִּין은 법정의 '판결'보다 מחלוקת적 의미의 분쟁·논쟁을 가리키므로, POB의 유보를 반영해 갈등 의미로 번역했습니다.
theological_decisions:
- issue: 지혜문학의 대구에서 דִּין을 어떻게 처리할지
  chosen_reading: 법적 의미를 약화시키지 않고, 이 절의 병렬 구조에 맞게 관계적 갈등인 '분쟁'으로 옮겼습니다.
  alternative_readings:
  - 판결과 수치가 그칩니다
  - 시비와 수치가 그칩니다
  rationale: 앞 절의 מָדוֹן과 짝을 이루는 병렬성과 뒤의 קָלוֹן(수치)을 고려하면, 여기서는 법정 절차보다 공동체 내부의 다툼이 더 적절합니다.
  doctrine_reference: 잠언의 지혜적 일반원리
