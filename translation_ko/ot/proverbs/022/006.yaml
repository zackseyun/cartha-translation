id: PRO.22.6
reference: Proverbs 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'Train up a boy in the way he should go.' The Hebrew more literally reads 'according to his way.'
    reason: alternative_reading
  - marker: b
    text: '''Boy'' renders a masculine singular Hebrew term used generically for a youth; the proverb states a general principle, not a promise without exception.'
    reason: cultural_note
translation:
  language: ko
  text: 소년을[b] 그의 길에 따라[a] 훈련시키십시오. 그가 늙어도 그 길에서 떠나지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 길에 따라’입니다. 더 해석적으로는 ‘그가 마땅히 가야 할 길에 따라’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘소년’은 히브리어 남성 단수 표현을 옮긴 말이며, 이 잠언은 예외 없는 절대 보증이 아니라 일반 원리를 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  english_pob_choice: Train up
  chosen_korean: 훈련시키십시오
  alternatives_korean:
  - 기르십시오
  - 가르치십시오
  - 훈육하십시오
  lexicon: HALOT
  rationale: חנך의 교육·형성적 명령을 현대 한국어의 자연스러운 명령형으로 옮기되, 단순한 지식 전달보다 형성의 의미를 살리기 위해 '훈련시키십시오'를 택했습니다.
- source_word: לַנַּעַר
  english_pob_choice: a boy
  chosen_korean: 소년을
  alternatives_korean:
  - 한 소년을
  - 청년을
  - 아이를
  lexicon: HALOT
  rationale: נַעַר는 남성 단수의 젊은이를 가리키므로, 일반적·성중립적 확장보다 원문의 성별 표지를 살린 '소년'이 적합합니다.
- source_word: עַל פִּי
  english_pob_choice: according to
  chosen_korean: …에 따라
  alternatives_korean:
  - …에 맞추어
  - …대로
  - …을 따라
  lexicon: HALOT
  rationale: 관용구 עַל־פִּי의 ‘according to’ 의미를 한국어에서 가장 자연스럽게 담기 위해 '…에 따라'로 옮겼습니다.
- source_word: דַרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 그의 길
  alternatives_korean:
  - 그의 방식
  - 그의 행로
  - 그 길
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 '그의 길'이라고 말하므로, 해석을 덧붙인 '마땅히 가야 할 길'보다 원문 이미지를 보존했습니다.
- source_word: לֹא יָסוּר מִמֶּנָּה
  english_pob_choice: he will not turn from it
  chosen_korean: 그것에서 떠나지 않을 것입니다
  alternatives_korean:
  - 그것을 버리지 않을 것입니다
  - 그것에서 벗어나지 않을 것입니다
  - 그 길에서 떠나지 않을 것입니다
  lexicon: HALOT
  rationale: סור의 ‘turn away / depart’ 의미를 한국어의 '떠나지 않다'로 자연스럽게 옮겼고, 지시대명사 '그것'은 앞선 '길'을 받습니다.
theological_decisions:
- issue: חֲנֹךְ의 권면이 지닌 형성적·교육적 의미
  chosen_reading: 이 구절은 단순한 정보 전달이 아니라 어린이의 삶을 형성하는 훈련을 말하므로, 명령형을 부드럽게 약화시키지 않고 적극적 교육의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 전념시키십시오
  - 헌납하십시오
  - 교육하십시오
  rationale: 잠언의 지혜 문맥에서 חנך는 시작·형성·훈련의 의미를 띠므로, 한국어에서도 행동의 적극성을 유지하는 것이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 잠언서 지혜 문맥, Translation philosophy §§1, 3, 4
- issue: ‘his way’의 해석적 긴장 유지
  chosen_reading: 본문에는 '그의 길'을 유지하고, '마땅히 가야 할 길'로 확장하지 않았습니다.
  alternative_readings:
  - 그가 마땅히 가야 할 길
  - 그의 성향에 맞는 길
  rationale: 히브리어는 '그의 길에 따라'라고 말할 뿐이므로, 널리 알려진 해석을 본문에 흡수하지 않고 의미의 긴장을 남겨 두는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
