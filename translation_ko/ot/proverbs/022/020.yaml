  text: הֲ/לֹ֤א כָתַ֣בְתִּי לְ֭/ךָ שלשום בְּ/מ֖וֹעֵצֹ֣ת וָ/דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
  footnotes:
  - marker: a
    text: Or 'Have I not written for you before now about counsel and knowledge?' The Hebrew word traditionally rendered 'formerly' is difficult here; many understand it instead as 'thirty,' possibly referring to a collection of thirty sayings.
    reason: alternative_reading
  - marker: b
    text: Traditional English versions often read 'excellent things' instead of 'thirty sayings.' This reflects a different construal of the difficult Hebrew expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 위하여 권면과 지식에 관한 말 삼십 마디를 기록하지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 이전에 너를 위하여 권면과 지식에 관하여 기록하지 않았습니까?’일 수 있습니다. 전통적으로 ‘이전에’로 옮기는 난해한 히브리어 형태는 여기서 그렇게 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 전통적인 영어 성경 번역본들은 흔히 ‘탁월한 것들’이라고 읽습니다. 이는 난해한 히브리어 표현을 다르게 해석한 결과입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Have I not
  chosen_korean: 내가 … 기록하지 않았느냐
  alternatives_korean:
  - 내가 … 적지 않았느냐
  - 내가 … 쓰지 않았느냐
  lexicon: HALOT
  rationale: 수사적 질문으로서 이미 알려진 사실을 전제하는 힘을 살리기 위해 한국어도 반문형으로 옮겼습니다.
- source_word: כָתַבְתִּי
  english_pob_choice: written
  chosen_korean: 기록하지 않았느냐
  alternatives_korean:
  - 쓰지 않았느냐
  - 적지 않았느냐
  lexicon: HALOT
  rationale: 잠언의 교훈을 단순한 문자 행위보다 권위 있는 문서화로 자연스럽게 드러내기 위해 ‘기록하다’를 택했습니다.
- source_word: שלשום
  english_pob_choice: thirty sayings
  chosen_korean: 삼십 마디
  alternatives_korean:
  - 옛날에
  - 이전에
  - 삼십 가지 말
  lexicon: HALOT
  rationale: 문맥상 난해한 형태를 ‘삼십’으로 이해하는 본문의 주요 해석을 따르되, 한국어에서는 지혜 격언의 단위를 자연스럽게 드러내는 ‘마디’로 옮겼습니다.
- source_word: בְּמוֹעֵצֹת וָדָעַת
  english_pob_choice: of counsel and knowledge
  chosen_korean: 권면과 지식의 말
  alternatives_korean:
  - 권면과 지식에 관한
  - 조언과 지식의 말
  lexicon: HALOT
  rationale: בְּמוֹעֵצֹת과 וָדָעַת의 병렬을 살리면서, 잠언다운 교훈적 표현을 위해 ‘권면’과 ‘지식’을 사용했습니다.
theological_decisions:
- issue: שלשום의 난해한 표현을 ‘삼십’으로 읽을지 ‘이전/옛날에’로 읽을지
  chosen_reading: 본문의 주된 해석을 따라 ‘삼십’으로 이해해 한국어 본문에 반영했습니다.
  alternative_readings:
  - ‘이전에/옛날에 너를 위해 기록하지 않았느냐’
  rationale: 영어 POB가 본문 안에서는 ‘thirty sayings’를 채택하고 대안 해석을 각주로 보존하므로, 한국어도 동일한 긴장을 유지했습니다.
  doctrine_reference: 본문비평 및 지혜문학 해석
