source:
  edition: WLC
  text: אָמַ֣ר עָ֭צֵל אֲרִ֣י בַ/ח֑וּץ בְּ/ת֥וֹךְ רְ֝חֹב֗וֹת אֵֽרָצֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/013.yaml
  text: The sluggard says[b][a], “There is a lion outside! I will be killed in the streets!”
  footnotes:
  - marker: a
    text: Or “in the squares” / “in the open plazas”; the Hebrew term can refer to broad public spaces, not only narrow streets.
    reason: lexical_alternative
  - marker: b
    text: Or “I will be murdered” / “I will be slain”; the Hebrew verb can carry the sense of violent killing, but “I will be killed” is chosen for natural English in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 말합니다. 「밖에 사자가 있다! 내가 거리 한복판에서 죽을 것이다!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רְחֹבוֹת는 좁은 골목만이 아니라 넓은 공공장소나 광장도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רצח는 ‘살해하다’의 뜻을 가질 수 있지만, 문맥상 자연스러운 한국어로는 ‘죽다/죽임을 당하다’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  english_pob_choice: The sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 나태한 사람
  lexicon: HALOT
  rationale: 속담적 인물 유형을 가리키므로, 현대 한국어에서 자연스럽고 직관적인 표현으로 옮겼습니다. ‘게으른 자’보다 덜 고어적입니다.
- source_word: אֲרִי
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 사자 짐승
  lexicon: HALOT
  rationale: 직접적인 어휘 대응입니다. 문맥상 비유가 아니라 실제로 위험을 과장하는 말로 읽히므로 그대로 옮겼습니다.
- source_word: בְּתוֹךְ רְחֹבוֹת
  english_pob_choice: in the streets
  chosen_korean: 거리 한복판에서
  alternatives_korean:
  - 거리에서
  - 광장 한복판에서
  - 공개된 광장에서
  lexicon: HALOT
  rationale: רְחֹבוֹת가 넓은 공공장소를 가리킬 수 있고, בְּתוֹךְ는 ‘한가운데’의 뜻이 있으므로, 노출과 과장을 살리는 ‘거리 한복판에서’로 옮겼습니다.
- source_word: אֵרָצֵחַ
  english_pob_choice: I will be killed
  chosen_korean: 죽을 것이다
  alternatives_korean:
  - 살해될 것이다
  - 죽임을 당할 것이다
  lexicon: HALOT
  rationale: רצח 계열의 강한 살해 의미는 유지하되, 속담 속 과장된 자기변명을 한국어에서 가장 자연스럽게 전달하는 표현으로 처리했습니다.
theological_decisions:
- issue: 속담 화자의 자기합리화 어조
  chosen_reading: 직설화법을 그대로 살려, 위험을 실제로 진술하기보다 게으름을 정당화하는 과장된 말투로 보이게 했습니다.
  alternative_readings:
  - 설명체로 완화하여 번역하는 방식
  - ‘살해될 것이다’로 더 법적·강한 뉘앙스를 강조하는 방식
  rationale: 잠언의 풍자적 효과는 과장된 공포 발화를 드러내는 데 있으므로, 내용의 긴장과 조롱을 보존하는 쪽을 택했습니다.
  doctrine_reference: 잠언 문맥의 지혜 문학적 풍자
