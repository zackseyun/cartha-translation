source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
  footnotes:
  - marker: a
    text: Or, 'One who oppresses the poor to enrich himself and gives to the rich—only to poverty.' The Hebrew can be read as describing either two comparable actions or one combined pattern of behavior.
    reason: alternative_reading
  - marker: b
    text: '''To poverty'' may also be rendered ''to lack'' or ''to want.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람을 착취하여 자신의 재산을 불리거나, 부자에게 주는 사람은 — 결국 가난에 이를 뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신의 재산을 불리거나’는 ‘자기를 부유하게 하다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘가난’은 여기서 ‘궁핍’ 또는 ‘결핍’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  english_pob_choice: One who oppresses
  chosen_korean: 착취하여
  alternatives_korean:
  - 억압하는
  - 착취하는
  - 압제하는
  lexicon: HALOT
  rationale: 분사형의 지속적·습관적 행위를 살리면서, 경제적 약자를 해치는 뉘앙스를 한국어에서 가장 직접적으로 드러내는 말로 옮겼습니다.
- source_word: דָּל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 가난한 이
  - 약한 사람
  lexicon: HALOT
  rationale: 문맥상 사회경제적 궁핍이 핵심이므로 ‘가난한 사람’이 가장 자연스럽고, 추상명사 ‘가난한 자’보다 현대 한국어에서 읽기 쉽습니다.
- source_word: לְהַרְבּוֹת לוֹ
  english_pob_choice: to increase his own wealth
  chosen_korean: 자신의 재산을 불리거나
  alternatives_korean:
  - 자기 이익을 늘리거나
  - 자기 몫을 늘리거나
  - 자신을 부유하게 하거나
  lexicon: HALOT
  rationale: 목적 구문을 ‘자신의 재산을 불리다’로 풀어, 본문의 자기이익 추구를 분명히 하되 과도한 해석은 피했습니다.
- source_word: לְמַחְסוֹר
  english_pob_choice: to poverty
  chosen_korean: 가난에
  alternatives_korean:
  - 궁핍에
  - 부족에
  - 결핍에
  lexicon: HALOT
  rationale: 마지막 결과어는 ‘결핍/부족’도 가능하지만, 잠언의 경제적 경고로서는 ‘가난’이 가장 직관적입니다.
theological_decisions:
- issue: 두 분사의 관계
  chosen_reading: 두 가지 자멸적인 행위—가난한 사람을 착취하여 자기 이익을 늘리거나, 부자에게 주는 행위—를 병렬적으로 제시한 것으로 옮겼습니다.
  alternative_readings:
  - 가난한 사람을 착취하고 부자에게 주는 하나의 결합된 행위로 읽을 수 있음
  rationale: 히브리어는 압축되어 있어 병렬·결합 해석이 모두 가능하므로, POB의 읽기처럼 경고의 대칭성을 살리는 방향을 택했습니다.
  doctrine_reference: 잠언의 지혜 문학 해석; 본문 문법의 다의성
