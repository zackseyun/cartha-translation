base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
  footnotes:
  - marker: a
    text: Or 'diligent in his work.' The Hebrew adjective can emphasize quickness/readiness and, by extension, competence.
    reason: lexical_alternative
  - marker: b
    text: Literally 'before obscure ones,' that is, people of no prominence or distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 일에 능숙한[a] 사람을 보셨습니까? 그는 왕들 앞에 서고, 이름 없는[b] 사람들 앞에는 서지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 일에 재빠르거나 준비된.” 히브리어 형용사는 빠름·준비성을 나타낼 수도 있으며, 여기서는 일의 숙련과 유능함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “어두운 이들” 또는 “드러나지 않는 이들.” 여기서는 명성이나 두드러짐이 없는 사람들을 가리킵니다.
    reason: lexical_alternative
