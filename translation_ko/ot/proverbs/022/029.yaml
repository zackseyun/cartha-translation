base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
  footnotes:
  - marker: a
    text: Or 'diligent in his work.' The Hebrew adjective can emphasize quickness/readiness and, by extension, competence.
    reason: lexical_alternative
  - marker: b
    text: Literally 'before obscure ones,' that is, people of no prominence or distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 솜씨를 가진 사람을 보셨습니까? 그는 왕들 앞에 서게 되지만[a], 비천한 사람들 앞에는 서지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕들 앞에서”이며, 히브리어 관용구의 공적 출석 이미지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  english_pob_choice: Do you see
  chosen_korean: 보셨습니까?
  alternatives_korean:
  - 보십니까?
  - 보게 됩니까?
  lexicon: HALOT
  rationale: 수사적 관찰 질문을 한국어의 자연스러운 존대 질문으로 옮겨, 잠정적 관찰을 촉구하는 잠언의 힘을 살렸습니다.
- source_word: מָהִיר
  english_pob_choice: skillful
  chosen_korean: 지혜로운 솜씨를 가진
  alternatives_korean:
  - 능숙한
  - 재빠른
  - 유능한
  lexicon: HALOT
  rationale: 문맥상 단순한 속도보다 일의 능숙함과 준비성을 가리키므로, 결과를 강조하는 표현으로 풀어 옮겼습니다.
- source_word: לִפְנֵי מְלָכִים
  english_pob_choice: before kings
  chosen_korean: 왕들 앞에
  alternatives_korean:
  - 왕들 앞에서
  - 왕들의 면전에
  lexicon: HALOT
  rationale: 히브리어 관용구의 공간적 이미지를 살리면서, 공적 출석의 의미가 드러나도록 간결하게 옮겼습니다.
- source_word: חֲשֻׁכִּים
  english_pob_choice: obscure men
  chosen_korean: 비천한 사람들
  alternatives_korean:
  - 무명한 사람들
  - 보잘것없는 사람들
  - 드러나지 않은 사람들
  lexicon: HALOT
  rationale: 직역인 '어두운 사람들'은 한국어에서 의미가 모호하므로, 영어 POB가 설명한 비중·지위의 결핍을 반영하는 표현을 택했습니다.
