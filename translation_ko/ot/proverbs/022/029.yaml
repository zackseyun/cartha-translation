  source_fidelity: ‘지혜로운 솜씨를 가진’은 מָהִיר(일에 재빠르고 능숙한)를 ‘지혜로운’ 것으로 확대하여 옮긴 표현입니다. 또한 חֲשֻׁכִּים은 도덕적·사회경제적 ‘비천함’보다 알려지지 않거나 두드러지지 않는 사람들을 가리킵니다. 이를 수정하면 원문의 대조와 어휘 범위를 더 정확히 보존합니다.
  naturalness: ‘자기 일에 능숙한 사람’과 ‘왕들 앞에 서고’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘이름 없는 사람들’은 여기서 비유적인 ‘obscure ones’를 자연스럽게 전달합니다.
  terminology: ‘왕들’, ‘앞에 서다’는 לִפְנֵי מְלָכִים 및 יִתְיַצָּב의 공적 출석/현현 이미지를 유지합니다. ‘능숙한’은 마히르의 역량·숙련 의미를, 각주는 재빠름/준비됨의 가능한 뉘앙스를 보존합니다.
  issues:
