  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
  footnotes:
  - marker: a
    text: Or, more literally, 'his lips have grace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a king is his friend.'
    reason: alternative_reading
translation:
  language: ko
  text: 마음의 정결함을 사랑하고 말에 은혜가 있는 사람은 왕의 친구가 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입술에 은혜가 있다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 왕이 그의 친구가 됩니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  english_pob_choice: He who loves
  chosen_korean: 사랑을 받고
  alternatives_korean:
  - 사랑하는 사람은
