  rationale: 직역형보다 형용사적 표현이 한국어 속담체에 자연스럽고, 내면의 도덕적 상태를 잘 드러냅니다.
- source_word: חֵן
  english_pob_choice: gracious
  chosen_korean: 은혜로운
  alternatives_korean:
  - 호의로운
  - 은총 있는
