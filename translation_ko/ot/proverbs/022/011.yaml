  - 친한 사람이 됩니다
  lexicon: HALOT
  rationale: 관계적 동반자를 가리키는 단어로, 한국어에서는 가장 직접적이고 자연스러운 ‘친구’가 적절합니다.
- source_word: מֶלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕의
  alternatives_korean:
  - 한 왕의
  - 그 왕의
  lexicon: HALOT
  rationale: 속담체의 일반성을 살리기 위해 관사 없는 명사를 한국어에서는 보편적 지시로 처리했습니다.
theological_decisions:
- issue: 의인화된 잠언의 일반 명제 처리
  chosen_reading: 이 절은 특정 인물에 대한 서술이 아니라, 정결함과 은혜로운 말이 권력자와의 관계를 여는 일반 원리로 읽었습니다.
  alternative_readings:
  - 왕을 특정 역사적 인물로 보는 읽기
  - 단순한 인간관계 기술로만 축소하는 읽기
  rationale: 히브리어 잠언의 속담적 형식은 보편적 지혜를 전달하므로, 문장 전체를 일반 명제로 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 잠언의 지혜문학적 일반 명제
- issue: 문장 배열과 관계절의 압축
  chosen_reading: ‘말이 은혜로운 사람은 왕의 친구가 됩니다’로 압축하여, 히브리어의 생략된 관계 구조를 한국어에서 명료하게 풀었습니다.
  alternative_readings:
  - ‘그의 말이 은혜로우면 왕이 그의 친구입니다’
  - ‘은혜로운 말을 하는 사람은 왕의 친구입니다’
  rationale: 원문은 관계를 압축적으로 제시하므로, 한국어에서는 독자가 즉시 이해할 수 있게 하면서도 과도한 설명을 피했습니다.
  doctrine_reference: 문학적 평행법과 속담적 압축
