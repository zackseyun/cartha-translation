  naturalness: ‘마음의 정결함을 사랑하고 말에 은혜가 있는 사람’은 현대 표준어 문어체에서 자연스럽고, 잠언의 간결한 격언체에도 맞습니다. ‘왕의 친구가 됩니다’는 합쇼체의 일반 명제 표현으로 적절합니다.
  terminology: טהור לֵב는 ‘마음의 정결함’, חֵן שְׂפָתָיו는 ‘말에 은혜가 있는’으로 옮겨 내적 순결과 호의롭고 품위 있는 말이라는 의미를 유지했습니다. רֵעֵהוּ는 ‘왕의 친구’로 처리했습니다. מֶלֶךְ는 정관사 없는 일반적 용법일 수 있으므로 각주에서 ‘한 왕’이라는 가능성을 남깁니다.
