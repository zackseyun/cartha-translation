  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹהֵ֥ב טהור לֵ֑ב חֵ֥ן שְׂ֝פָתָ֗י/ו רֵעֵ֥/הוּ מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
  footnotes:
  - marker: a
    text: Or, more literally, 'his lips have grace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a king is his friend.'
    reason: alternative_reading
translation:
  language: ko
  text: 마음이 정결한 사람은 사랑을 받고, 말이 은혜로운 사람은 왕의 친구가 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입술에 은혜가 있다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕이 그의 친구입니다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  english_pob_choice: He who loves
  chosen_korean: 사랑을 받고
  alternatives_korean:
  - 사랑하는 사람은
  - 사랑하는 자는
  lexicon: HALOT
  rationale: 히브리어 분사는 속담에서 일반적인 사람을 가리키므로, 한국어에서는 자연스러운 일반화 표현으로 옮겼습니다.
- source_word: טהור לֵב
  english_pob_choice: purity of heart
  chosen_korean: 마음이 정결한
  alternatives_korean:
  - 마음의 정결함을 사랑하는
  - 정결한 마음의
  lexicon: HALOT
  rationale: 직역형보다 형용사적 표현이 한국어 속담체에 자연스럽고, 내면의 도덕적 상태를 잘 드러냅니다.
- source_word: חֵן
  english_pob_choice: gracious
  chosen_korean: 은혜로운
  alternatives_korean:
  - 호의로운
  - 은총 있는
  - 우아한
  lexicon: HALOT
  rationale: 여기서는 입술/말의 특질을 가리키므로, 단순한 ‘호의’보다 말 자체가 사람에게 베푸는 호감과 품격을 살리는 ‘은혜로운’이 적절합니다.
- source_word: שְׂפָתָיו
  english_pob_choice: whose speech
  chosen_korean: 말이
  alternatives_korean:
  - 입술이
  - 그의 입술이
  - 말씨가
  lexicon: HALOT
  rationale: ‘입술’의 신체적 이미지를 한국어에서는 발화 내용 전체를 가리키는 ‘말’로 옮겨 메타포를 자연스럽게 살렸습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his friend
  chosen_korean: 친구가 됩니다
  alternatives_korean:
  - 벗이 됩니다
  - 동료가 됩니다
  - 친한 사람이 됩니다
  lexicon: HALOT
  rationale: 관계적 동반자를 가리키는 단어로, 한국어에서는 가장 직접적이고 자연스러운 ‘친구’가 적절합니다.
- source_word: מֶלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕의
  alternatives_korean:
  - 한 왕의
  - 그 왕의
  lexicon: HALOT
  rationale: 속담체의 일반성을 살리기 위해 관사 없는 명사를 한국어에서는 보편적 지시로 처리했습니다.
theological_decisions:
- issue: 의인화된 잠언의 일반 명제 처리
  chosen_reading: 이 절은 특정 인물에 대한 서술이 아니라, 정결함과 은혜로운 말이 권력자와의 관계를 여는 일반 원리로 읽었습니다.
  alternative_readings:
  - 왕을 특정 역사적 인물로 보는 읽기
  - 단순한 인간관계 기술로만 축소하는 읽기
  rationale: 히브리어 잠언의 속담적 형식은 보편적 지혜를 전달하므로, 문장 전체를 일반 명제로 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 잠언의 지혜문학적 일반 명제
- issue: 문장 배열과 관계절의 압축
  chosen_reading: ‘말이 은혜로운 사람은 왕의 친구가 됩니다’로 압축하여, 히브리어의 생략된 관계 구조를 한국어에서 명료하게 풀었습니다.
  alternative_readings:
  - ‘그의 말이 은혜로우면 왕이 그의 친구입니다’
  - ‘은혜로운 말을 하는 사람은 왕의 친구입니다’
  rationale: 원문은 관계를 압축적으로 제시하므로, 한국어에서는 독자가 즉시 이해할 수 있게 하면서도 과도한 설명을 피했습니다.
  doctrine_reference: 문학적 평행법과 속담적 압축
