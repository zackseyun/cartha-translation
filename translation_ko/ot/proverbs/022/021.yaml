    reason: alternative_reading
translation:
  language: ko
  text: 이는 진리의 말씀들이 확실하다는 것을 너에게 알게 하고[a], 너를 보낸 이들에게 진리의 말씀을 되돌려 주게 하려는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리의 말씀들이 참되다는 것’. קֹשְׁט는 ‘진리’, ‘정확성’, ‘신뢰성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너를 보낸 이들에게 진실한 말로 대답하게 하려는 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  english_pob_choice: to make known to you
