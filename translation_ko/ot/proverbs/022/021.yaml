  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
  footnotes:
  - marker: a
    text: Or 'the truth of words of truth'; קֹשְׁט can also be rendered 'truth,' 'correctness,' or 'reliability.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that you may answer with truthful words to those who sent you.'
    reason: alternative_reading
translation:
  language: ko
  text: 진리의 말씀의 확실함을 너에게 알게 하려 함이며, 너를 보낸 이들에게 진리의 말씀으로 대답하게 하려 함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리의 말씀의 진리/정확성/신뢰성’; קֹשְׁט는 ‘진리’, ‘정확성’, ‘신뢰성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너를 보낸 이들에게 진리의 말씀으로 대답하게 하려 함입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  english_pob_choice: to make known to you
  chosen_korean: 너에게 알게 하려 함
  alternatives_korean:
  - 너에게 가르치려 함
  - 너에게 알게 하려는 것
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘알게 하다’로 옮기되, 현대 한국어에서 자연스럽게 읽히도록 목적 표현으로 처리했습니다.
- source_word: קֹשְׁט
  english_pob_choice: certainty
  chosen_korean: 확실함
  alternatives_korean:
  - 진리
  - 정확함
  - 신뢰성
  lexicon: HALOT
  rationale: 뒤의 אֱמֶת ‘진리’와 구별되도록, 이 단어는 말씀의 믿을 만한 확정성을 드러내는 ‘확실함’으로 옮겼습니다.
- source_word: אִמְרֵי אֱמֶת / אֲמָרִים אֱמֶת
  english_pob_choice: words of truth
  chosen_korean: 진리의 말씀
  alternatives_korean:
  - 진리의 말들
  - 참된 말씀
  - 진실한 말
  lexicon: HALOT
  rationale: 히브리어의 ‘말씀/말들’ 구조를 유지하면서도 한국어에서 자연스럽고 반복을 살려 읽히는 표현으로 정리했습니다.
- source_word: לְשֹׁלְחֶיךָ
  english_pob_choice: to those who sent you
  chosen_korean: 너를 보낸 이들에게
  alternatives_korean:
  - 너를 보낸 자들에게
  - 너를 파견한 이들에게
  - 너를 보내신 분들에게
  lexicon: HALOT
  rationale: 분사 복수형의 복수성을 살리면서, ‘보낸 이들’로 자연스럽게 옮겨 행위 주체를 분명히 했습니다.
theological_decisions:
- issue: 반복되는 אמת의 표현 방식
  chosen_reading: 두 번째 핵심어를 모두 ‘진리’로 통일하지 않고, 앞에서는 ‘확실함’, 뒤에서는 ‘진리의 말씀’으로 구별했습니다.
  alternative_readings:
  - 두 곳 모두 ‘진리’로 번역
  - 앞의 קֹשְׁט를 ‘정확함’으로 번역
  rationale: 본문은 ‘진리’라는 말을 두 번 쓰지만 첫 번째 단어 קֹשְׁט는 같은 어휘 반복을 피하면서 말의 신뢰성과 확정성을 강조합니다. 이를 구별해 옮겨 수사적 대비를 보존했습니다.
  doctrine_reference: 잠언의 지혜 문맥에서 말의 참됨과 신뢰성
