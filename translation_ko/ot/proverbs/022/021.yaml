  rationale: 분사 복수형의 복수성을 살리면서, ‘보낸 이들’로 자연스럽게 옮겨 행위 주체를 분명히 했습니다.
theological_decisions:
- issue: 반복되는 אמת의 표현 방식
  chosen_reading: 두 번째 핵심어를 모두 ‘진리’로 통일하지 않고, 앞에서는 ‘확실함’, 뒤에서는 ‘진리의 말씀’으로 구별했습니다.
  alternative_readings:
  - 두 곳 모두 ‘진리’로 번역
  - 앞의 קֹשְׁט를 ‘정확함’으로 번역
  rationale: 본문은 ‘진리’라는 말을 두 번 쓰지만 첫 번째 단어 קֹשְׁט는 같은 어휘 반복을 피하면서 말의 신뢰성과 확정성을 강조합니다. 이를 구별해 옮겨 수사적 대비를 보존했습니다.
  doctrine_reference: 잠언의 지혜 문맥에서 말의 참됨과 신뢰성
