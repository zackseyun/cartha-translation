  source_fidelity: 현 번역은 첫 כִּי의 이유 제시와 둘째 כִּי가 이끄는 조건을 충분히 구별하지 못하고, ‘굳게 서게 됩니다’로 결과 진술처럼 옮겼습니다. 히브리어는 지혜의 말씀을 내면에 보존하고 입술에 함께 갖추어 둔 상태가 ‘즐거운’ 이유/조건임을 나타냅니다.
  naturalness: ‘입술 위에 함께 굳게 서게 됩니다’는 현대 한국어에서 다소 부자연스럽고, 말씀들이 입술에 준비되어 있는 비유를 잘 전달하지 못합니다. ‘입술에 모두 갖추어져 있으면’이 자연스럽고 원문의 발화 준비 이미지를 보존합니다.
