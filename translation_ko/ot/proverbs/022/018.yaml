id: PRO.22.18
reference: Proverbs 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
  footnotes:
  - marker: a
    text: Literally, 'in your belly,' a Hebrew expression for the inner person.
    reason: cultural_note
  - marker: b
    text: Or 'they will be ready together on your lips.' The verb may emphasize firm establishment or readiness for speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 당신 안에 간직하면 좋습니다[b][a]—그것들이 당신의 입술 위에 함께 굳게 서게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 배 속에’이지만, 여기서는 히브리어의 내면을 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그것들이 당신의 입술 위에 함께 준비되게 됩니다.’로도 옮길 수 있습니다. 동사는 굳게 확립됨 또는 말할 준비가 됨을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For / if
  chosen_korean: 그것들을 당신 안에 간직하면 좋습니다
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 만일
  lexicon: HALOT
  rationale: 첫 번째 כִּי의 설명적 힘과 두 번째 כִּי의 조건적 힘을 한국어로 자연스럽게 묶기 위해, 앞절을 포괄하는 ‘…하면 좋습니다’ 구조로 옮겼습니다.
- source_word: תִשְׁמְרֵם
  english_pob_choice: you keep them
  chosen_korean: 간직하면
  alternatives_korean:
  - 지키면
  - 보존하면
  - 마음에 새기면
  lexicon: HALOT
  rationale: 지혜의 말씀을 내면에 붙들어 두는 뜻을 살리면서도, 문맥상 단순한 보관보다 ‘간직하다’가 더 자연스럽습니다.
- source_word: בְּבִטְנֶךָ
  english_pob_choice: within you
  chosen_korean: 당신 안에
  alternatives_korean:
  - 배 속에
  - 내면에
  - 마음속에
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 배 안에’이지만, 히브리어의 내적 인간 표현이므로 현대 한국어에서는 ‘당신 안에’로 처리하되, 문자적 이미지는 각주로 남겼습니다.
- source_word: יִכֹּנוּ יַחְדָּו
  english_pob_choice: they will be established together
  chosen_korean: 함께 굳게 서게 됩니다
  alternatives_korean:
  - 함께 확고히 자리 잡게 됩니다
  - 함께 세워지게 됩니다
  - 함께 준비되게 됩니다
  lexicon: HALOT
  rationale: כון의 ‘세워지다/확립되다’와 POB의 ‘established’에 맞춰 안정성과 발화 준비성을 함께 살리는 표현을 택했습니다.
- source_word: עַל שְׂפָתֶיךָ
  english_pob_choice: on your lips
  chosen_korean: 당신의 입술 위에
  alternatives_korean:
  - 당신의 입술에
  - 당신 입에
  - 당신의 말끝에
  lexicon: HALOT
  rationale: ‘입술 위에’는 원문의 공간적 이미지를 보존하면서도 한국어로 충분히 자연스럽고, 말하기의 준비 상태를 잘 드러냅니다.
