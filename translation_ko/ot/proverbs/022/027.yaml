  text: אִם אֵֽין לְ/ךָ֥ לְ/שַׁלֵּ֑ם לָ֥/מָּה יִקַּ֥ח מִ֝שְׁכָּבְ/ךָ֗ מִ/תַּחְתֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/027.yaml
  text: If you have nothing with which to pay[a], why should he take your bed from under you?
  footnotes:
  - marker: a
    text: Or 'your couch' or 'your sleeping place.' The Hebrew specifically names the object taken, not merely a generic pledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 갚을 것이 없거든, 왜 네 밑에서 네 침상을[a] 가져가겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 잠자리’ 또는 ‘네 요’. 히브리어는 일반적인 담보물이 아니라 누워 자는 침상을 구체적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - if
  - ~라면
  lexicon: HALOT
  rationale: 조건절을 여는 말로서 직설적이고 문어적인 ‘만일’이 합쇼체 경고문의 흐름에 잘 맞습니다.
- source_word: אֵין לְךָ
  english_pob_choice: have nothing
  chosen_korean: 갚을 것이 없거든
  alternatives_korean:
  - 네게 아무것도 없거든
  - 네가 가진 것이 없거든
  lexicon: HALOT
  rationale: 문맥상 ‘갚을 수 있는 것/갚을 것’의 부재를 가리키므로, 자연스러운 한국어로 ‘갚을 것이 없다’로 옮기되 동사의 부담을 살렸습니다.
- source_word: לְשַׁלֵּם
  english_pob_choice: with which to pay
  chosen_korean: 갚을
  alternatives_korean:
  - 지불할
  - 상환할
  lexicon: HALOT
  rationale: 빚을 갚는 의미가 분명하므로 ‘갚다’를 사용해 원문의 채무 상황을 직접 드러냈습니다.
- source_word: מִשְׁכָּבְךָ
  english_pob_choice: your bed
  chosen_korean: 네 침상
  alternatives_korean:
  - 네 침대
  - 네 잠자리를
  - 네 요
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘담보물’이 아니라 실제로 가져가는 대상을 지목하므로, 전통적이지만 여전히 이해 가능한 ‘침상’으로 구체성을 살렸습니다.
