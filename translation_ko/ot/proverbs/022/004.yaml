  text: עֵ֣קֶב עֲ֭נָוָה יִרְאַ֣ת יְהוָ֑ה עֹ֖שֶׁר וְ/כָב֣וֹד וְ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
  footnotes:
  - marker: a
    text: Or, less likely, 'The reward of humility is the fear of the LORD, wealth and honor and life.'
    reason: alternative_reading
translation:
  language: ko
  text: 겸손과 야훼를 경외함의 보상은 재물과 명예와 생명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 덜 가능성이 높게는, ‘겸손의 보상은 야훼를 경외함, 재물과 명예와 생명이다.’
    reason: alternative_reading
lexical_decisions:
- source_word: עֵקֶב
  english_pob_choice: reward of
  chosen_korean: 보상은
  alternatives_korean:
  - 결과는
  - 보답은
  - 대가는
  lexicon: HALOT
  rationale: 속담 문맥에서 원인-결과 및 보상적 뉘앙스를 함께 담는 표현으로, ‘보상’이 가장 자연스럽고 간결하게 대응합니다.
- source_word: עֲנָוָה
  english_pob_choice: humility
  chosen_korean: 겸손
  alternatives_korean:
  - 온유
  - 낮아짐
  lexicon: HALOT
  rationale: 히브리어 명사는 태도상의 낮아짐과 겸손을 가리키므로, 현대 한국어에서 가장 직접적인 대응어인 ‘겸손’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 신명기 표기를 살려 하나님의 고유명을 유지하기 위해 ‘야훼’를 사용합니다. 여기서는 관용구 ‘야훼를 경외함’으로 옮겨 원문 결을 보존합니다.
- source_word: עֹשֶׁר וְכָבוֹד וְחַיִּים
  english_pob_choice: wealth and honor and life
  chosen_korean: 재물과 명예와 생명
  alternatives_korean:
  - 부와 존귀와 삶
  - 부와 명예와 생명
  lexicon: HALOT
  rationale: 지혜문학의 병렬 목록으로서 물질적 풍요, 사회적 존중, 생명을 각각 직접적으로 드러내기 위해 ‘재물, 명예, 생명’을 택했습니다.
theological_decisions:
- issue: ‘겸손’과 ‘야훼를 경외함’의 관계
  chosen_reading: 두 명사를 함께 한 쌍의 덕목으로 읽어, 그 결과가 재물과 명예와 생명이라고 옮겼습니다.
  alternative_readings:
  - ‘겸손의 보상은 야훼를 경외함, 재물과 명예와 생명이다’라는 앱포지션 읽기
  rationale: 히브리어는 압축되어 있어 두 번째 명사를 전치사 없이 이어 붙인 형식이므로 약간의 모호성이 있습니다. 그러나 문맥상 지혜격언의 평행 구조를 살려 두 덕목의 결과로 읽는 편이 가장 자연스럽습니다.
  doctrine_reference: 의미가 실제로 열려 있는 경우는 해소하지 말고, 본문 의미를 유지한 채 대안 읽기를 각주로 남깁니다.
