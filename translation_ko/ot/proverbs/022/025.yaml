theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: 이 경고는 영혼 교리 진술이 아니라, 잘못된 길을 따를 때 ব্যক্তি 전체가 해를 입는다는 뜻으로 이해했습니다.
  alternative_readings:
  - 영혼에 대한 위험으로 읽기
  - 단순히 목숨의 위험으로만 제한하기
  rationale: POB의 영어 주해처럼 כאן의 נֶפֶשׁ는 기술적 신학어가 아니라 사람 자신을 가리키는 말이므로, 문맥상 도덕적 자기손상을 강조하는 방향이 가장 적절합니다.
  doctrine_reference: 잠언 22:25의 경고적 지혜 문맥
