id: PRO.22.25
reference: Proverbs 22:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּן תֶּאֱלַ֥ף ארחת/ו וְ/לָקַחְתָּ֖ מוֹקֵ֣שׁ לְ/נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/025.yaml
  text: lest you learn his ways and take a snare for yourself[a][b].
  footnotes:
  - marker: a
    text: Or 'his path' or 'his manner of life.' The Hebrew singular can refer to a person's habitual conduct.
    reason: lexical_alternative
  - marker: b
    text: Or 'take a trap for your life' or 'for your soul.' Hebrew nephesh here likely means the person himself rather than making a technical statement about the soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 길을 배워서[a] 자기 자신을 위한 올무[b]를 잡지 않도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 길’이나 ‘그의 삶의 방식’입니다. 히브리어 단수는 한 사람의 습관적 행실을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 생명을 위한 올무’나 ‘자기 영혼을 위한 올무’입니다. 여기서 히브리어 nephesh는 기술적 ‘영혼’보다 그 사람 자신을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: ~하지 않도록 하십시오
  alternatives_korean:
  - 그렇지 않으면
  - ~하지 않게
  lexicon: HALOT
  rationale: פֶּן이 이 구절에서 경고의 목적·결과를 나타내므로, 한국어에서는 자연스러운 경계 표현인 ‘~하지 않도록’으로 옮겨 위협적 경고의 힘을 살렸습니다.
- source_word: תֶּאֱלַף
  english_pob_choice: you learn
  chosen_korean: 배우다
  alternatives_korean:
  - 익히다
  - 습관이 들다
  lexicon: HALOT
  rationale: 동사의 핵심은 어떤 행위를 익히고 익숙해지는 것이므로, ‘배우다’가 가장 간결하게 해당 의미를 전달합니다.
- source_word: אָרְחֹתוֹ
  english_pob_choice: his ways
  chosen_korean: 그의 길
  alternatives_korean:
  - 그의 행실
  - 그의 방식
  lexicon: HALOT
  rationale: 히브리어 단수형은 한 사람의 삶의 방식 전체를 가리킬 수 있으므로, 잠언 문맥에서 자연스러운 ‘길’로 옮겼습니다.
- source_word: מוֹקֵשׁ
  english_pob_choice: a snare
  chosen_korean: 올무
  alternatives_korean:
  - 덫
  - 함정
  lexicon: HALOT
  rationale: 지혜문학의 비유적 위험을 살리면서도 한국어에서 사냥·포획의 이미지가 분명한 ‘올무’를 선택했습니다.
- source_word: לְנַפְשֶׁךָ
  english_pob_choice: for yourself
  chosen_korean: 자기 자신을 위한
  alternatives_korean:
  - 목숨을 위한
  - 영혼을 위한
  lexicon: HALOT
  rationale: נֶפֶשׁ가 여기서는 신학적 ‘영혼’ 용어라기보다 그 사람 자신/생명을 가리키므로, 반사 의미를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: 이 경고는 영혼 교리 진술이 아니라, 잘못된 길을 따를 때 ব্যক্তি 전체가 해를 입는다는 뜻으로 이해했습니다.
  alternative_readings:
  - 영혼에 대한 위험으로 읽기
  - 단순히 목숨의 위험으로만 제한하기
  rationale: POB의 영어 주해처럼 כאן의 נֶפֶשׁ는 기술적 신학어가 아니라 사람 자신을 가리키는 말이므로, 문맥상 도덕적 자기손상을 강조하는 방향이 가장 적절합니다.
  doctrine_reference: 잠언 22:25의 경고적 지혜 문맥
