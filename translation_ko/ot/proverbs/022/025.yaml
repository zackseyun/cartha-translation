  yaml_path: translation/ot/proverbs/022/025.yaml
  text: lest you learn his ways and take a snare for yourself[a][b].
  footnotes:
  - marker: a
    text: Or 'his path' or 'his manner of life.' The Hebrew singular can refer to a person's habitual conduct.
    reason: lexical_alternative
  - marker: b
    text: Or 'take a trap for your life' or 'for your soul.' Hebrew nephesh here likely means the person himself rather than making a technical statement about the soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 길을 배워 스스로 올무를 취하게 되지 않도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 길’이나 ‘그의 삶의 방식’입니다. 히브리어 단수는 한 사람의 습관적 행실을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 생명을 위한 올무’나 ‘자기 영혼을 위한 올무’입니다. 여기서 히브리어 네페쉬는 기술적 의미의 ‘영혼’이라기보다 그 사람 자신을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
