  naturalness: ‘올무를 잡다’는 현대 한국어에서 대체로 올무로 대상을 포획한다는 뜻으로 읽혀 부자연스럽습니다. ‘스스로 올무를 취하게 되다’는 비유적 경고의 뜻과 합쇼체 문체를 모두 유지합니다.
