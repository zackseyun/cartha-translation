  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
  footnotes:
  - marker: a
    text: Or 'calamity,' 'disaster,' or 'sorrow' for 'trouble.' The Hebrew אָוֶן can denote harmful consequence or misery.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rod of his wrath will come to an end.' The Hebrew phrase may refer to the collapse of the wrongdoer's angry power.
    reason: alternative_reading
translation:
  language: ko
  text: 누구든지 불의를 심으면 trouble[a]을 거두고, 그의 분노의 막대기는 끝이 납니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '재앙', '재난', '고통'으로 옮길 수 있습니다. 히브리어 אָוֶן은 해로운 결과나 비참을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 진노의 막대기는 끝이 난다.' 이 표현은 악인의 분노 어린 권세가 붕괴되는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  english_pob_choice: Whoever sows
  chosen_korean: 누구든지 불의를 심으면
  alternatives_korean:
  - 불의를 뿌리는 자는
  - 불의를 심는 자는
  lexicon: WLC participle
  rationale: 힐렐식 격언의 일반적·습관적 의미를 살리기 위해 조건문 형태의 현대 한국어로 옮기되, 농경 은유를 유지했습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 잘못
  - 불공정
  lexicon: HALOT
  rationale: 지혜문맥에서의 도덕적·법적 불의를 가장 간결하게 드러내는 표준적 대응어로 보았습니다.
- source_word: אָוֶן
  english_pob_choice: trouble
  chosen_korean: trouble
  alternatives_korean:
  - 재앙
  - 재난
  - 고통
  lexicon: HALOT
  rationale: 본문의 영어 POB가 이 단어를 그대로 'trouble'로 유지하므로, 한국어 본문에서도 의미 범위를 넓게 열어 두는 차원에서 영어 원문형을 보존했습니다. 필요하면 각주로 대체 의미를 제시할 수 있습니다.
- source_word: וְשֵׁבֶט עֶבְרָתוֹ
  english_pob_choice: the rod of his fury
  chosen_korean: 그의 분노의 막대기
  alternatives_korean:
  - 그의 진노의 막대기
  - 그의 분노의 지팡이
  - 그의 진노의 몽둥이
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 권세/징계의 도구로서 '막대기'가 가장 직설적이며, עֶבְרָה는 '분노/진노'로 옮길 수 있으나 현대어로는 '분노'가 더 자연스럽습니다.
- source_word: יִכְלֶה
  english_pob_choice: will come to an end
  chosen_korean: 끝이 납니다
  alternatives_korean:
  - 사라집니다
  - 다합니다
  - 끝납니다
  lexicon: HALOT
  rationale: כלה의 '끝나다/다하다' 의미를 반영해, 권세의 소멸이라는 뜻이 자연스럽게 드러나도록 했습니다.
theological_decisions:
- issue: '마지막 절의 의미: 권세의 소멸인가, 단순히 분노의 소진인가'
  chosen_reading: '''그의 분노의 막대기''가 결국 끝나는, 곧 악인의 폭력적 권세가 소멸하는 뜻으로 읽었습니다.'
  alternative_readings:
  - '''그의 진노의 막대기''가 끝난다'
  - '''그의 분노를 위한 막대기''가 소진된다'
  rationale: 히브리어의 문법상 '분노의 막대기'는 도구적·소유격적 표현 모두 가능하지만, 지혜문맥에서는 폭력적 권세의 종말을 말하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
