  verdict: revise
  source_fidelity: The draft conveys both prohibitions, but its causal clause is awkwardly attached and can be read as merely explaining the person's poverty rather than the exploitative motive. "문에서" is overly literal and unnatural in Korean without identifying the city gate. The Hebrew distinction between דל and עני may be retained naturally as "가난한 사람" and "궁핍한 사람."
  naturalness: The draft uses the plain imperative -말라, whereas the requested target register is modern formal-polite 합쇼체. "그가 가난하기 때문이요" and "문에서" are also stilted in contemporary Korean.
  terminology: '"강탈하다" is possible but commonly takes property as its object in Korean; "가난한 사람이니 그의 것을 빼앗다" accurately expresses גזל without an unnatural object construction. "짓밟다" suitably preserves the force of Piel דכא. "성문" preserves the concrete setting while the note supplies the judicial context.'
  issues:
  - severity: medium
    issue: Register does not follow the specified modern formal-polite 합쇼체.
    rationale: Both negative imperatives should use forms such as "-지 마십시오," rather than "-지 말라."
  - severity: medium
    issue: The first clause is syntactically and semantically awkward in Korean.
    rationale: '"가난한 자를 강탈하지 말라 그가 가난하기 때문이요" makes "because he is poor" sound disconnected. Recasting it as "가난한 사람이니 그의 것을 빼앗지 마십시오" clearly conveys the prohibited exploitation while preserving the causal motivation.'
  - severity: low
    issue: '"문에서" lacks the concrete referent of the Hebrew שער in idiomatic Korean.'
    rationale: '"성문에서" is both natural and source-faithful; a cultural footnote can explain its legal function.'
  - severity: low
    issue: Footnote b gives an overly broad alternative for גזל and is not needed to explain the Korean rendering.
    rationale: The main translation already reflects the lexical sense of unjust taking. Retaining only the cultural note avoids presenting "억압하다" as an equivalent translation of the verb.
  revised_text: 가난한 사람이니 그의 것을 빼앗지 마시며, 성문에서 궁핍한 사람을 짓밟지 마십시오.[a]
