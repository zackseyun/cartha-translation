  text: The rich rules over the poor[a], and the borrower is a slave to the lender.
  footnotes:
  - marker: a
    text: Or, more literally, 'and a borrower is a slave to a man who lends.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부자는 가난한 사람들을 지배하며, 빌리는 사람은 빌려주는 사람에게 종입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그리고 빌리는 사람은 빌려주는 사람에게 종입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: the rich
  chosen_korean: 부유한 사람
  alternatives_korean:
  - 부자
  - 부유층
  lexicon: HALOT
  rationale: 형용사적 명사로 쓰인 일반적 ‘부유한 사람’을 자연스럽게 풀어, 계층적 대비를 살리면서도 속담체를 해치지 않게 했습니다.
- source_word: בְּרָשִׁים
  english_pob_choice: over the poor
  chosen_korean: 가난한 사람들을
  alternatives_korean:
  - 가난한 이들 위에
  - 가난한 자들에 대하여
  lexicon: HALOT
  rationale: 지배의 대상/영역을 드러내는 표현으로 옮기되, 한국어에서는 ‘~을 지배하다’가 가장 직접적이어서 전치사 ב의 관계를 자연스럽게 반영했습니다.
- source_word: וְעֶבֶד
  english_pob_choice: is a slave
  chosen_korean: 종이 됩니다
  alternatives_korean:
  - 노예가 됩니다
  - 종입니다
  lexicon: HALOT
  rationale: 본문의 예속 상태를 분명히 하면서도 현대 한국어에서 지나치게 거친 울림을 줄이기 위해 기본어 ‘종’을 사용했습니다. 현재형 속담 표현으로 처리했습니다.
- source_word: לֹוֶה לְאִישׁ מַלְוֶה
  english_pob_choice: the borrower is a slave to the lender
  chosen_korean: 빚을 진 사람은 빌려주는 사람의 종
  alternatives_korean:
  - 빌리는 사람은 빌려주는 사람의 종
  - 채무자는 채권자의 종
  lexicon: HALOT
  rationale: 동사적 관계를 한국어 속담으로 풀어, 단순한 ‘borrower/lender’보다 채무 관계의 종속성을 더 분명히 드러냈습니다.
theological_decisions:
- issue: עֶבֶד의 사회적 강도
  chosen_reading: ‘종’으로 옮겨 예속과 종속의 강도를 유지했습니다.
  alternative_readings:
  - ‘노예’로 더 강하게 표현
  - ‘종사람’처럼 완화
  rationale: 잠언의 비유는 경제적 차용이 실제 종속으로 이어질 수 있음을 날카롭게 말하므로, 의미를 약화시키는 완곡어를 피했습니다.
  doctrine_reference: 사회윤리/지혜문학의 비유적 경고
