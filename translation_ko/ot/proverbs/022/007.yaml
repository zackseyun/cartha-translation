  naturalness: ‘부자는 가난한 사람들을 지배하며, 빌리는 사람은 빌려주는 사람에게 종입니다’는 현대 표준어 합쇼체로 자연스럽고, 잠언의 간결한 대구를 유지합니다. ‘종이 됩니다’는 변화·결과의 뉘앙스를 더하므로 피하는 편이 좋습니다.
