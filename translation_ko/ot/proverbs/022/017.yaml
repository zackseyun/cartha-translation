  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֥ט אָזְנְ/ךָ֗ וּ֭/שְׁמַע דִּבְרֵ֣י חֲכָמִ֑ים וְ֝/לִבְּ/ךָ֗ תָּשִׁ֥ית לְ/דַעְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/017.yaml
  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
  footnotes:
  - marker: a
    text: Or "set your heart to my teaching." The Hebrew reads literally "to my knowledge," which may refer either to the speaker's knowledge itself or, by extension, to the instruction that knowledge conveys.
    reason: lexical_alternative
translation:
  language: ko
  text: 귀를 기울이고 지혜로운 사람들의 말을 들으며, 마음을 내 지식에 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 가르침에 마음을 두십시오.” 히브리어는 문자적으로 “내 지식에”라고 되어 있으며, 이는 말하는 이의 지식 자체를 가리키거나, 넓게는 그 지식이 전하는 교훈을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  english_pob_choice: Incline your ear
  chosen_korean: 귀를 기울이고
  alternatives_korean:
  - 귀를 돌리고
  - 귀를 내밀어
  - 귀를 숙이고
  lexicon: HALOT
  rationale: 히필 명령형의 ‘기울이다/향하다’라는 적극적 자세를 살려, 한국어에서도 단순한 청취보다 의도적 주의를 나타내는 표현을 택했습니다.
- source_word: דִּבְרֵי חֲכָמִים
  english_pob_choice: the words of the wise
  chosen_korean: 지혜로운 사람들의 말
  alternatives_korean:
  - 지혜자들의 말
  - 지혜로운 이들의 말
  - 현자들의 말
  lexicon: HALOT
  rationale: חכמים는 복수의 ‘지혜로운 이들’을 가리키므로, 성별이 드러나지 않는 자연스러운 한국어로 옮기되 ‘말’로 דברי의 구체성을 유지했습니다.
- source_word: לְדַעְתִּי
  english_pob_choice: on my knowledge
  chosen_korean: 내 지식에 두십시오
  alternatives_korean:
  - 내 지식에
  - 내 가르침에 두십시오
  - 내 지식을 향하십시오
  lexicon: HALOT
  rationale: 직역상 ‘내 지식으로/내 지식에’이지만, 한국어에서는 ‘마음을 두다’와 결합해 자연스럽고 문맥상 지시의 대상을 분명히 하는 표현으로 처리했습니다.
theological_decisions:
- issue: לְדַעְתִּי의 해석 범위
  chosen_reading: ‘내 지식’이라는 명사를 살리되, 그 지식이 곧 교훈적 내용으로 전달된다는 점은 문맥에 맡겼습니다.
  alternative_readings:
  - ‘내 가르침’으로 명시적으로 풀기
  - ‘내가 아는 것’으로 이해하기
  rationale: 히브리어는 문자적으로 ‘나의 지식’이므로, 의미를 지나치게 교훈어로 고정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 지혜문학의 교훈 전달 방식
