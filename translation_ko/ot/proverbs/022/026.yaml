  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손을 맞대어 약정하는 자들 가운데.’ 손을 치거나 맞대는 것은 보증이나 약정을 확증하는 몸짓을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  english_pob_choice: Do not be
