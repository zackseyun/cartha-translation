base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
  footnotes:
  - marker: a
    text: Or 'guard knowledge.' The Hebrew verb can mean 'guard,' 'keep,' or 'preserve.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he subverts' or 'he distorts.' The Hebrew verb may convey making something crooked or overturning it.
    reason: lexical_alternative
  - marker: c
    text: Or 'the faithless.' The Hebrew term refers to one who acts treacherously or unfaithfully.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 눈은 지식을 지키십니다[a]. 그러나 그분은 배신하는 자[c]의 말을 뒤엎으십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지식을 보존하십니다.’ 히브리어 동사는 ‘지키다’, ‘간수하다’, ‘보존하다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 말을 비뚤어지게 하십니다’ 또는 ‘그 말을 뒤틀어 놓으십니다.’ 히브리어 동사는 어떤 것을 비뚤게 만들거나 뒤엎는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불성실한 자’. 히브리어 용어는 배신하거나 신의 없이 행동하는 사람을 가리킵니다.
    reason: lexical_alternative
