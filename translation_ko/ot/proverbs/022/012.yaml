  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
  footnotes:
  - marker: a
    text: Or 'guard knowledge.' The Hebrew verb can mean 'guard,' 'keep,' or 'preserve.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he subverts' or 'he distorts.' The Hebrew verb may convey making something crooked or overturning it.
    reason: lexical_alternative
  - marker: c
    text: Or 'the faithless.' The Hebrew term refers to one who acts treacherously or unfaithfully.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 눈은 지식을 보존하십니다[a], 그러나 그분은 배신자의 말을 뒤엎으십니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지식을 지키십니다.’ 히브리어 동사는 ‘지키다’, ‘간수하다’, ‘보존하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 전복하십니다’ 혹은 ‘그분은 왜곡하십니다.’ 히브리어 동사는 무엇인가를 비틀거나 뒤엎는 의미를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불성실한 자의.’ 히브리어 용어는 배신하거나 불성실하게 행동하는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  english_pob_choice: The eyes of Yahweh
  chosen_korean: 야훼의 눈
  alternatives_korean:
  - 야훼의 눈들
  - 야훼의 시선
  lexicon: HALOT
  rationale: 히브리어의 신인동형적 표현을 살려 하나님의 감찰과 돌보심의 이미지를 직접적으로 드러내기 위해 직역했습니다.
- source_word: נָצְרוּ
  english_pob_choice: preserve
  chosen_korean: 보존하십니다
  alternatives_korean:
  - 지키십니다
  - 보호하십니다
  - 간직하십니다
  lexicon: HALOT
  rationale: 지혜문맥에서 지식이 훼손되지 않도록 유지한다는 뜻을 살려, ‘지키다’보다 지식 자체를 유지·보전하는 뉘앙스가 있는 ‘보존하다’를 택했습니다.
- source_word: וַיְסַלֵּף
  english_pob_choice: he overturns
  chosen_korean: 뒤엎으십니다
  alternatives_korean:
  - 뒤틀어 버리십니다
  - 엎어 버리십니다
  - 왜곡하십니다
  lexicon: HALOT
  rationale: 히브리어가 ‘비뚤게 만들다/뒤엎다’의 힘을 가지므로, 배신자의 말을 무효화하고 전복하는 적극성을 살린 표현으로 옮겼습니다.
- source_word: בֹגֵד
  english_pob_choice: the treacherous
  chosen_korean: 배신자
  alternatives_korean:
  - 불성실한 자
  - 간사한 자
  - 배반하는 자
  lexicon: HALOT
  rationale: בוגד는 언약적·관계적 불성실과 배신을 가리키므로, 한국어에서 가장 직접적으로 그 의미를 드러내는 ‘배신자’를 선택했습니다.
