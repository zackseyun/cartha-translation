id: PRO.16.15
reference: Proverbs 16:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אוֹר פְּנֵי מֶ֥לֶךְ חַיִּ֑ים וּ֝/רְצוֹנ֗/וֹ כְּ/עָ֣ב מַלְקֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/015.yaml
  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
  footnotes:
  - marker: a
    text: Or, more formally, 'his favor is like a cloud of the latter rain.'
    reason: lexical_alternative
  - marker: b
    text: The image is of the king’s favorable expression and goodwill bringing life and blessing, like the beneficial late-season rain for crops.
    reason: cultural_note
translation:
  language: ko
  text: 왕의 얼굴빛에는 생명이 있고, 그의 호의는 봄비 구름과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그의 호의는 늦은 비의 구름과 같습니다’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 왕의 얼굴빛은 왕의 좋은 표정과 호의가 생명과 복을 가져오는 모습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/אוֹר פְּנֵי
  english_pob_choice: In the light of a king’s face
  chosen_korean: “왕의 얼굴빛”
  alternatives_korean:
  - “왕의 얼굴의 빛”
  - “왕의 얼굴에서 비치는 빛”
  - “왕의 임재의 빛”
  lexicon: WLC; HALOT
  rationale: בְּ/אוֹר פְּנֵי의 직유 이미지를 살리되, 한국어에서는 ‘얼굴빛’이 얼굴의 표정과 비추는 인상을 함께 자연스럽게 전달합니다.
- source_word: חַיִּים
  english_pob_choice: there is life
  chosen_korean: “생명이 있고”
  alternatives_korean:
  - “생명이 있습니다”
  - “삶이 있고”
  lexicon: WLC; HALOT
  rationale: 명사 חַיִּים의 존재 진술을 한국어 자연문으로 옮기되, 히브리어의 압축된 병행 구조를 유지했습니다.
- source_word: וּ/רְצוֹנ/וֹ
  english_pob_choice: and his favor
  chosen_korean: “그의 호의”
  alternatives_korean:
  - “그의 은총”
  - “그의 기쁨”
  - “그의 인정”
  lexicon: WLC; HALOT
  rationale: 왕실 문맥에서 רָצוֹן은 단순 감정보다 ‘호의/호감/선의’의 의미가 적절하여, 원문의 왕적 은혜 이미지를 살렸습니다.
- source_word: מַלְקוֹשׁ
  english_pob_choice: spring rain
  chosen_korean: “봄비”
  alternatives_korean:
  - “늦은 비”
  - “후비”
  - “이른봄비”
  lexicon: WLC; HALOT
  rationale: מַלְקוֹשׁ의 농경적 의미를 현대 독자가 바로 이해하도록 ‘봄비’로 옮기되, 계절적 유익의 이미지를 유지했습니다.
theological_decisions:
- issue: 왕의 얼굴과 호의가 주는 생명·복의 이미지
  chosen_reading: 이 구절은 왕의 표정이나 임재가 백성에게 생명과 복을 가져오는 고대 근동적 왕권 언어로 읽었습니다.
  alternative_readings:
  - 일반적인 인간 관계의 호감 표현
  - 하나님의 왕권을 직접 가리키는 표현
  rationale: 문맥상 지혜문학의 왕적 비유를 그대로 살리는 것이 가장 직접적이며, 본문이 말하는 권위와 생명 부여의 이미지를 희석하지 않습니다.
  doctrine_reference: 잠언의 왕권-지혜 비유
- issue: מַלְקוֹשׁ의 계절적 뉘앙스
  chosen_reading: ‘봄비’로 본문을 읽되, 농작물에 유익한 늦은 계절의 비라는 배경을 보존했습니다.
  alternative_readings:
  - ‘늦은 비’로 직역
  - ‘이른비’로 계절을 조정
  rationale: 한국어에서 ‘봄비’가 자연스럽지만, 원문의 핵심은 계절상 농작물에 결정적 유익을 주는 비라는 점이므로 그 기능을 유지하는 데 초점을 두었습니다.
  doctrine_reference: 잠언의 농경적 비유
