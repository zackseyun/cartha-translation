  naturalness: ‘제비는 품에 던져지지만’은 자연스럽고 격식 있는 현대 한국어입니다. ‘그 모든 판단은 야훼께 있습니다’보다는 ‘그 모든 결정은 야훼께로부터 나옵니다’가 문맥상 결과의 근원과 문장 연결을 더 분명하고 자연스럽게 전달합니다.
