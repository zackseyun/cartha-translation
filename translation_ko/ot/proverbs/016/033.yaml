id: PRO.16.33
reference: Proverbs 16:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ֭/חֵיק יוּטַ֣ל אֶת הַ/גּוֹרָ֑ל וּ֝/מֵ/יְהוָ֗ה כָּל מִשְׁפָּטֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
  footnotes:
  - marker: a
    text: Or 'its every verdict' or 'its every judgment.' The Hebrew term can carry a judicial nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 제비는 품에 던져지지만, 그 모든 판단은 야훼께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 판결’ 또는 ‘그 모든 결정’입니다. 히브리어 מִשְׁפָּט는 여기서 법정적 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק / חֵיק
  english_pob_choice: into the lap
  chosen_korean: 품에
  alternatives_korean:
  - 무릎에
  - 가슴에
  - 품속에
  lexicon: HALOT
  rationale: חֵיק은 ‘가슴’, ‘품’, ‘무릎’의 뜻이 있으나, 속담의 그림을 자연스럽게 살리면서도 제비가 던져지는 자리를 너무 좁게 한정하지 않도록 ‘품에’로 옮겼습니다.
- source_word: יוּטַל
  english_pob_choice: is cast
  chosen_korean: 던져집니다
  alternatives_korean:
  - 던져집니다
  - 던집니다
  - 던져집혀집니다
  lexicon: HALOT
  rationale: 수동/사역적 뉘앙스를 살려 ‘던져집니다’로 옮겼습니다. 제비를 사람이 행위자로 직접 세우지 않고, 던져지는 결과를 드러냅니다.
- source_word: מִשְׁפָּטוֹ
  english_pob_choice: its every decision
  chosen_korean: 그 모든 판단
  alternatives_korean:
  - 그 모든 결정
  - 그 모든 판결
  - 그 모든 재판
  lexicon: HALOT
  rationale: מִשְׁפָּט는 문맥상 법정적 ‘판결’까지 포함할 수 있지만, 제비의 결과라는 맥락에서는 ‘판단’이 의미 범위를 넓게 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮겼습니다. 이는 칭호가 아니라 고유한 이름을 드러냅니다.
theological_decisions:
- issue: 인간의 제비 던지기와 하나님의 주권의 긴장
  chosen_reading: 사람이 제비를 던지지만, 그 결과를 정하시는 분은 야훼이십니다.
  alternative_readings:
  - 제비의 사용을 특정 종교적 의례로만 제한하는 읽기
  - 단순히 우연을 통제하신다는 일반 원리로만 넓히는 읽기
  rationale: 히브리어는 인간의 행위와 야훼의 निर्ण정/판단을 대조합니다. 번역은 그 긴장을 풀어버리지 않고 그대로 보존합니다.
  doctrine_reference: 섭리와 인간 행위의 긴장 보존
