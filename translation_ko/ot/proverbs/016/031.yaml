  source_fidelity: ‘얻어집니다’는 히브리어 נִפְעַל(‘발견되다/얻어지다’)이 지닌 수동적이고 다소 열려 있는 표현을 한국어에서 ‘백발이 획득된다’는 다소 부자연스러운 뜻으로 좁힐 수 있습니다. ‘발견됩니다’는 본문의 직역적 표현과 격언의 열린 관계를 더 잘 보존합니다.
  naturalness: 본문은 전반적으로 자연스럽고 합쇼체에도 맞습니다. 다만 ‘의의 길에서 얻어집니다’보다 ‘의의 길에서 발견됩니다’가 문법적 연결과 관용적 자연스러움에서 더 낫습니다. 각주 b의 ‘말하지’는 문장 연결상 ‘말하며’로 고쳐야 합니다.
  terminology: ‘백발’, ‘영광의 관’, ‘의의 길’은 각각 שֵׂיבָה, עֲטֶרֶת תִּפְאֶרֶת, דֶּרֶךְ צְדָקָה를 충실하고 자연스럽게 옮깁니다. ‘의’는 잠언의 윤리적 의로움을 보존하며, 특정 교리적 해석을 강요하지 않습니다.
