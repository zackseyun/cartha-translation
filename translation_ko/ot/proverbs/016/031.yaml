  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
  footnotes:
  - marker: a
    text: Or 'on the path of righteousness.' The Hebrew idiom speaks of a course of life marked by righteousness.
    reason: lexical_alternative
  - marker: b
    text: That is, gray hair is honorable when it accompanies a righteous life; the proverb expresses a general wisdom principle, not an absolute promise of long life to every righteous person.
    reason: cultural_note
translation:
  language: ko
  text: 백발은 영광의 관이며, 의의 길에서 발견됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘의의 길’은 삶의 방식이나 행로를 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 속담은 일반적인 지혜의 진술로서, 백발과 의로움의 결합이 지닌 명예를 말하며, 모든 의인이 반드시 노년에 이른다는 뜻은 아닙니다.
    reason: theological_note
lexical_decisions:
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 화관
  lexicon: HALOT
  rationale: 머리에 두르는 ‘crown’의 비유를 자연스럽게 살리되, 지혜문학의 명예 표상으로서 ‘관’이 가장 간결하고 적절합니다.
- source_word: תִּפְאֶרֶת
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 아름다움
  - 아름다운 영예
  - 찬란함
  lexicon: HALOT
  rationale: 문맥상 단순한 미모보다 존귀함과 명예를 가리키므로, 한국어에서도 ‘영광’이 가장 잘 대응합니다.
- source_word: שֵׂיבָה
  english_pob_choice: gray hair
  chosen_korean: 백발
  alternatives_korean:
  - 흰머리
  - 노년
  - 호호백발
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 살리면서도 현대 한국어에서 자연스러운 표현은 ‘백발’입니다.
- source_word: בְּדֶרֶךְ צְדָקָה
  english_pob_choice: in the way of righteousness
  chosen_korean: 의의 길에서
  alternatives_korean:
  - 의로운 삶의 길에서
  - 의의 길 위에서
  - 정의의 길에서
  lexicon: HALOT
  rationale: ‘דרך’의 삶의 방식이라는 관용을 살려 ‘길’로 옮기고, ‘צְדָקָה’는 잠언의 윤리적 의미에 맞춰 ‘의’로 번역했습니다.
theological_decisions:
- issue: 두 번째 절의 일반 지혜 진술 여부
  chosen_reading: 이 절은 의인이 반드시 장수한다는 보장이 아니라, 백발이 의로운 삶과 함께할 때 명예로운 관이라는 일반 지혜를 말합니다.
  alternative_readings:
  - 백발 자체가 곧 존귀하다는 단순 진술
  - 의가 장수를 보장한다는 약속으로 읽는 해석
  rationale: 히브리 지혜문학의 격언적 성격을 보존하여, 문장이 주는 윤리적 통찰은 살리되 기계적 약속으로 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
