    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דַּרְכֵי אִישׁ
  english_pob_choice: All a man's ways
  chosen_korean: 사람의 모든 길
  alternatives_korean:
  - 한 남자의 모든 길
  - 한 사람의 모든 길
  lexicon: HALOT
  rationale: 히브리어 דֶּרֶךְ는 지혜문학에서 문자 그대로의 길보다 삶의 행로와 행실을 가리키므로 ‘길’로 살리고, כָּל은 ‘모든’으로 옮겨 전체성을 드러냈습니다.
- source_word: זַךְ
  english_pob_choice: pure
  chosen_korean: 깨끗해 보이지만
  alternatives_korean:
  - 깨끗하지만
  - 순결하지만
  - 정결하지만
  lexicon: HALOT
  rationale: 문맥상 자기평가의 느낌을 살리기 위해 ‘깨끗해 보이다’로 풀어, 외형적/주관적 판단임을 드러냈습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 자기 눈에
  alternatives_korean:
  - 자기 보기에
  - 자기 눈에는
  - 스스로 보기에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 주관적 판단이라는 의미가 분명하도록 ‘자기 눈에’로 간결하게 처리했습니다.
- source_word: וְתֹכֵן רוּחוֹת
  english_pob_choice: weighs the spirits
  chosen_korean: 영들을 달아보십니다
  alternatives_korean:
  - 영들을 살피십니다
  - 동기를 평가하십니다
  - 속마음을 달아보십니다
  lexicon: HALOT
  rationale: תכן의 ‘달다/무게를 재다’ 이미지를 살려 하나님의 정확한 판정을 보존했고, רוּחוֹת는 본문이 허용하는 보다 넓은 인간 내면의 실재를 유지하기 위해 ‘영들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 신명 표현을 보존하기 위해 전통적 대체 호칭 대신 학술적 음역 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: רוּחוֹת의 의미 범위
  chosen_reading: 하나님께서 사람들의 내면적 영/정향을 달아보신다는 뜻을 유지했습니다.
  alternative_readings:
  - 동기
  - 속마음
  - 기질
  rationale: 지혜문학의 압축된 시적 표현을 좁게 해석해 도덕 심리 용어로 환원하지 않고, 본문이 가진 인간 자기평가와 하나님의 심사를 대비시키는 긴장을 보존했습니다.
  doctrine_reference: 문맥 우선의 최적 대응 원칙
- issue: 남성 단수 אִישׁ의 대표성
  chosen_reading: ‘사람의’로 옮기되 남성 단수의 대표적 용법은 주석으로 과도하게 중화하지 않았습니다.
  alternative_readings:
  - 한 사람의
  - 인간의
  rationale: 히브리어의 문법적 남성 단수는 대표성 있는 일반 진술로 기능하므로, 본문의 보편성을 살리면서도 성중립적 재구성은 피했습니다.
  doctrine_reference: 번역 원칙 §4 (성별 정확성 우선)
