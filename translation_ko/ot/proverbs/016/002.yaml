    rationale: זַךְ는 ‘깨끗하다/순수하다’라는 서술이며, בְּעֵינָיו가 판단의 주체를 충분히 표시합니다. ‘보이다’를 덧붙이지 않는 편이 원문의 압축성과 대조를 보존합니다.
