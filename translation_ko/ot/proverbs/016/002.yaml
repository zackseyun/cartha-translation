translation:
  language: ko
  text: 사람의 모든 길은 자기 눈에 깨끗해 보이지만, 야훼께서는 영들을 달아보십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 모든 길은 자기 눈에 깨끗합니다.’
