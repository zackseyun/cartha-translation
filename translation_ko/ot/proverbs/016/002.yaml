  to: 사람의 모든 길은 자기 눈에는 깨끗하지만, 야훼께서는 영들을 달아 보십니다.[a][b]
  rationale: 주관적 판단을 나타내는 히브리어 관용구를 ‘자기 눈에는’으로 직접 옮기고, ‘깨끗해 보이다’가 덧붙일 수 있는 외관상·추정적 뉘앙스를 제거했습니다. 하나님의 평가를 나타내는 ‘달다’의 은유, רוּחוֹת의 복수형, 그리고 야훼라는 신명은 유지했습니다. 각주 a는 주본문과 실질적으로 중복되지 않도록 ‘정결하다’라는 어휘 대안을 제시했습니다.
