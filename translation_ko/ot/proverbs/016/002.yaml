translation:
  language: ko
  text: 사람의 모든 길은 자기 눈에는 깨끗하지만, 야훼께서는 영들을 달아 보십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 모든 길은 그 자신이 보기에 정결합니다.’
