  source_fidelity: 히브리어의 대조 병행을 충실히 반영합니다. ‘비뚤어진 사람’은 אִישׁ תַּהְפֻּכוֹת의 도덕적으로 뒤틀린 성향을 자연스럽게 드러내며, ‘다툼을 일으키고’는 יְשַׁלַּח מָדוֹן의 관용적 결과를 정확히 전달합니다. ‘수군거리는 사람’은 נִרְגָּן의 은밀하고 관계를 해치는 말의 성격을 보존하고, ‘친한 친구들을 갈라놓습니다’는 אַלּוּף의 친밀한 동반자라는 뜻과 잠언의 일반적 적용을 잘 살립니다.
  naturalness: 문장은 현대 표준 한국어로 자연스럽고, 잠언의 간결한 격언체와 합쇼체 종결이 조화를 이룹니다. ‘갈라놓습니다’는 관계를 이간하고 분리한다는 결과를 명료하게 나타냅니다.
  terminology: ‘비뚤어진 사람’, ‘다툼’, ‘수군거리는 사람’, ‘친한 친구들’은 모두 문맥에 맞고 과도한 신학적·법률적 의미를 덧붙이지 않습니다. 특히 נִרְגָּן을 ‘중상하는 사람’처럼 지나치게 한정하지 않은 선택이 적절합니다.
