id: PRO.16.28
reference: Proverbs 16:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
  footnotes:
  - marker: a
    text: Or 'A perverse man sends out contention.' The Hebrew verb is literally 'sends out,' and תַּהְפֻּכוֹת may be rendered 'perversity' or 'crookedness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a gossip' or 'a slanderer.' The Hebrew נִרְגָּן refers to one who speaks covertly in a way that damages relationships.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'an intimate friend' or 'a close companion'; the English plural 'close friends' expresses the proverb's general force.
    reason: lexical_alternative
translation:
  language: ko
  text: 비뚤어진 사람은 다툼을 일으키고, 수군거리는 사람은 친한 친구들을 갈라놓습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  english_pob_choice: A perverse man
  chosen_korean: 비뚤어진 사람
  alternatives_korean:
  - 패역한 사람
  - 왜곡된 사람
  - 사악한 사람
  lexicon: HALOT
  rationale: תַּהְפֻּכוֹת의 핵심은 뒤틀림·삐뚤어짐이므로, 도덕적 평가를 살리면서도 과도하게 강한 ‘사악한’보다 ‘비뚤어진 사람’이 자연스럽습니다.
- source_word: יְשַׁלַּח מָדוֹן
  english_pob_choice: stirs up strife
  chosen_korean: 다툼을 일으키고
  alternatives_korean:
  - 분쟁을 일으키고
  - 분란을 퍼뜨리고
  - 다툼을 퍼뜨리고
  lexicon: HALOT
  rationale: 직역하면 ‘보내다’이지만 관용적으로 분쟁을 촉발하는 뜻이므로, 현대 한국어에서 자연스러운 ‘다툼을 일으키다’로 옮겼습니다.
- source_word: נִרְגָּן
  english_pob_choice: a whisperer
  chosen_korean: 수군거리는 사람
  alternatives_korean:
  - 헐뜯는 사람
  - 뒷말하는 사람
  - 중상하는 사람
  lexicon: HALOT
  rationale: 낮은 목소리로 몰래 말해 관계를 해치는 뉘앙스를 살리기 위해, ‘수군거리는 사람’으로 옮겨 은밀성과 부정성을 함께 드러냈습니다.
- source_word: אַלּוּף
  english_pob_choice: close friends
  chosen_korean: 친한 친구들
  alternatives_korean:
  - 가까운 동무들
  - 친밀한 벗들
  - 가까운 친구들
  lexicon: HALOT
  rationale: אַלּוּף는 친밀한 관계를 가리키므로, 속담의 일반성을 자연스럽게 드러내는 복수형 ‘친한 친구들’이 가장 읽기 쉽고 의미도 잘 전달합니다.
theological_decisions:
- issue: 속담의 일반적 진술을 한국어에서 어떻게 유지할지
  chosen_reading: 개별 인물을 지칭하기보다, 이런 유형의 사람을 가리키는 보편적 경구로 읽히도록 평서형으로 옮겼습니다.
  alternative_readings:
  - ‘한 사람’으로 제한해 번역하는 방법
  - 직역조로 ‘비뚤어진 사람은 분쟁을 보내고’라고 옮기는 방법
  rationale: 잠언의 문장은 삶의 패턴을 말하는 일반 진술이므로, 한국어에서도 보편적 교훈이 자연스럽게 전달되도록 했습니다.
  doctrine_reference: 잠언 문학의 일반적 경구 형식
- issue: ‘whisperer’의 도덕적 기능과 관계 파괴를 어떻게 살릴지
  chosen_reading: ‘수군거리는 사람’으로 번역해 은밀한 언어가 관계를 깨뜨린다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘중상하는 사람’으로 더 강하게 옮기는 방법
  - ‘헐뜯는 사람’으로 공격성을 강조하는 방법
  rationale: 문맥의 핵심은 공개적 공격보다 은밀한 말로 관계를 분리시키는 데 있으므로, 과장 없이도 그 파괴성을 드러내는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 언어 윤리
