  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ בְּ֭לִיַּעַל כֹּרֶ֣ה רָעָ֑ה וְ/עַל שפתי/ו כְּ/אֵ֣שׁ צָרָֽבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
  footnotes:
  - marker: a
    text: Or 'A wicked man digs up harm'; the Hebrew terms can emphasize either moral evil or the destructive trouble a person causes.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and on his lips [is] like a scorching fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불량한 사람은 악을 파헤치고[a], 그의 입술 위에는 사르는 불과 같은 것이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 사람이 해를 파헤친다.’ 히브리어는 도덕적 악과 사람이 일으키는 파괴적인 해악을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 입술 위에는 사르는 불처럼 [있다].’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 이시는 문자적으로는 ‘남자’지만, 잠언의 격언적 문맥에서는 대표적 인물을 가리키므로 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽고 문맥에 맞습니다.
- source_word: בְּלִיַּעַל
  english_pob_choice: worthless
  chosen_korean: 무가치한
  alternatives_korean:
  - 악한
  - 불량한
  - 쓸모없는
  lexicon: HALOT
  rationale: בליעל은 도덕적 타락과 인격적 무가치를 함께 띠는 표현이어서, 단순한 ‘악한’보다 인물의 품성과 가치 결핍을 함께 살리는 ‘무가치한’이 적절합니다.
- source_word: כֹּרֶה רָעָה
  english_pob_choice: digs up evil
  chosen_korean: 악을 파헤치고
  alternatives_korean:
  - 악을 캐내고
  - 악을 꾸미고
  - 해를 파헤치고
  lexicon: HALOT
  rationale: כּרה의 기본 동사 이미지를 살려 ‘파헤치다’로 옮기면, 악을 밖으로 드러내거나 만들어 내는 비유적 동작이 보존됩니다.
- source_word: שׂפתיו
  english_pob_choice: his lips
  chosen_korean: 그의 입술에는
  alternatives_korean:
  - 그의 말에는
  - 그의 입에는
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입술’은 원문의 신체 이미지와 불의 비유를 연결해 주므로, 의미를 풀어쓴 ‘말’보다 더 source-direct합니다.
- source_word: כְּאֵשׁ צָרָבֶת
  english_pob_choice: like a scorching fire
  chosen_korean: 타는 불
  alternatives_korean:
  - 사르는 불
  - 뜨겁게 타는 불
  - 시뻘건 불
  lexicon: HALOT
  rationale: 히브리어는 ‘불처럼, 타는/스코칭하는’의 비유를 담고 있어 ‘타는 불’로 옮기면 비교 표현을 과장 없이 자연스럽게 살릴 수 있습니다.
theological_decisions:
- issue: עַל שְׂפָתָיו의 비유적 관계를 어떻게 처리할지
  chosen_reading: ‘그의 입술에는 타는 불이 있습니다’로 옮겨, 입술 위에 얹힌 불의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘그의 말은 타는 불입니다’
  - ‘그의 입술 위에는 타는 불이 있습니다’
  rationale: 잠언의 압축적 은유를 풀어버리기보다 신체 이미지와 폭력적 언어의 결합을 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 잠언의 지혜 문학적 은유 보존
