  terminology: ‘분노’, ‘죽음의 사자들’, ‘달랠 것입니다’는 각각 חֵמָה, מַלְאֲכֵי מָוֶת, כפר의 이 문맥상 의미를 적절히 전달합니다. 각주 a는 ‘사자’와 ‘천사’의 어휘적 가능성을, 각주 b는 속죄 어근과 문맥상 비제의적 ‘달램’의 의미를 적절히 설명합니다.
