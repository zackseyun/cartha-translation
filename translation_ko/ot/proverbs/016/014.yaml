id: PRO.16.14
reference: Proverbs 16:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
  footnotes:
  - marker: a
    text: Hebrew 'messengers of death'; the term for 'messengers' can also mean 'angels,' but here it most likely refers to agents sent out by the king.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is from the same root often rendered 'make atonement.' In this context it means to appease or turn away the king's wrath.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 분노는 죽음의 사자[a]들이지만, 지혜로운 사람은 그것을 달랠 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘죽음의 사자들’입니다. 여기서 ‘사자’는 하늘 존재인 ‘천사’보다 왕이 보내는 대리자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 흔히 ‘속죄하다’로 옮기는 어근에서 나옵니다. 이 절에서는 제의적 속죄가 아니라 왕의 분노를 달래거나 돌이키는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 격분
  lexicon: HALOT
  rationale: 여기서는 왕의 위협적이고 중대한 감정을 가리키므로, 일상적인 ‘화’보다 무게감 있는 ‘분노’가 적절합니다.
- source_word: מַלְאֲכֵי מָוֶת
  english_pob_choice: messengers of death
  chosen_korean: 죽음의 사자들
  alternatives_korean:
  - 죽음의 메시지들
  - 죽음의 천사들
  - 죽음의 사신들
  lexicon: HALOT
  rationale: מַלְאֲכֵי는 문맥상 왕이 보내는 사람들을 가리키므로 ‘사자들’로 옮기고, מָוֶת은 직역하여 소유격 구조를 살렸습니다.
- source_word: יְכַפְּרֶנָּה
  english_pob_choice: will appease it
  chosen_korean: 달랠 것입니다
  alternatives_korean:
  - 누그러뜨릴 것입니다
  - 화목시킬 것입니다
  - 속죄할 것입니다
  lexicon: HALOT
  rationale: 이 동사는 제의적 ‘속죄’ 의미도 있으나, 여기서는 왕의 분노를 대상으로 하므로 ‘달래다/누그러뜨리다’가 문맥에 가장 잘 맞습니다.
theological_decisions:
- issue: כפר 동사의 제의적 속죄 의미를 살릴지, 왕의 분노를 ‘달래는’ 비제의적 의미로 옮길지
  chosen_reading: 비제의적 의미로 ‘달랠 것입니다’라고 번역합니다.
  alternative_readings:
  - 속죄할 것입니다
  - 화를 가라앉힐 것입니다
  rationale: 문맥이 성소 제사가 아니라 왕의 분노를 다루므로, 제의적 배경을 과도하게 불러오지 않도록 했습니다. 다만 히브리어 어근의 넓은 의미는 각주로 남깁니다.
  doctrine_reference: 번역 원칙 §3, §6
