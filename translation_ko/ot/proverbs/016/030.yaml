id: PRO.16.30
reference: Proverbs 16:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹצֶ֣ה עֵ֭ינָי/ו לַ/חְשֹׁ֣ב תַּהְפֻּכ֑וֹת קֹרֵ֥ץ שְׂ֝פָתָ֗י/ו כִּלָּ֥ה רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
  footnotes:
  - marker: a
    text: Or 'who compresses his lips.' Some translations render the gesture more loosely; the Hebrew specifically refers to the lips, not the eyes.
    reason: lexical_alternative
  - marker: b
    text: Or 'has completed evil' / 'has accomplished evil.' The Hebrew verb emphasizes bringing an evil scheme to its full end.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈을 감아 비뚤어진 일을 꾀하며, 입술을 오므리는[a] 자는 악을 끝내 이루었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 입술을 오므리는’이라고 말합니다. 이 몸짓의 직접 대상은 눈이 아니라 입술입니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사 כִּלָּה는 ‘완성하다’, ‘끝내다’라는 뜻입니다. 여기서는 악한 계략이나 행위를 끝까지 수행하여 마쳤다는 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  english_pob_choice: He who shuts his eyes
  chosen_korean: 눈을 감고
  alternatives_korean:
  - 눈을 감아
  - 눈을 닫고
  - 눈을 꼭 감고
  lexicon: HALOT
  rationale: 히브리어는 눈을 ‘감는’ 동작으로, 한국어에서는 ‘눈을 감고’가 가장 자연스럽고 관용적입니다. ‘shuts’의 의미를 살리되 지나치게 문자적이지 않게 했습니다.
- source_word: לַחְשֹׁב תַּהְפֻּכ֑וֹת
  english_pob_choice: to devise perverse things
  chosen_korean: 비뚤어진 일을 꾀하며
  alternatives_korean:
  - 뒤틀린 것을 꾀하며
  - 사특한 일을 꾀하며
  - 패역한 것을 꾸미며
  lexicon: HALOT
  rationale: תַּהְפֻּכוֹת는 단순한 ‘생각’이 아니라 도덕적으로 뒤틀린 계책을 가리키므로, ‘꾀하다’로 의도적 계획을 드러냈습니다. ‘비뚤어진’은 품위를 해치지 않으면서도 우회적 악함을 전달합니다.
- source_word: קֹרֵץ שְׂפָתָיו
  english_pob_choice: who purses his lips
  chosen_korean: 입술을 오므리는 자는
  alternatives_korean:
  - 입술을 압박하는 자는
  - 입술을 찡그리는 자는
  - 입술을 조이는 자는
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 동작의 대상은 눈이 아니라 입술이므로, 한국어도 이를 분명히 반영했습니다. ‘오므리다’는 입술의 긴장된 제스처를 자연스럽게 표현합니다.
- source_word: כִּלָּה רָעָה
  english_pob_choice: has completed evil
  chosen_korean: 악을 완성합니다
  alternatives_korean:
  - 악을 끝냅니다
  - 악을 완결합니다
  - 악을 성취합니다
  lexicon: HALOT
  rationale: כִּלָּה는 ‘끝내다/완성하다’의 완료 의미를 지니므로, POB의 ‘completed evil’을 그대로 살렸습니다. 현재형처럼 읽히는 한국어 관용을 택해 악한 계략이 완결된 상태를 강조했습니다.
theological_decisions:
- issue: 악의 진행성과 완결성의 표현
  chosen_reading: 이 구절은 단순한 내적 악의 소유가 아니라, 눈짓과 입술 동작으로 드러나는 의도적 계략이 끝까지 수행되어 ‘악을 완성’한 상태를 말합니다.
  alternative_readings:
  - ‘악을 저지릅니다’처럼 일반적 행위로 약화하는 읽기
  - ‘악을 끝냅니다’처럼 단순 종료로만 보는 읽기
  rationale: 히브리어 동사와 POB 주석은 악한 계획이 실행 단계까지 밀고 간 결과를 강조하므로, 그 긴장과 도덕적 무게를 보존해야 합니다.
  doctrine_reference: 잠언의 지혜-윤리 문맥; 행위와 의도의 책임성
- issue: ‘눈’과 ‘입술’의 결합된 신체 제스처
  chosen_reading: 본문의 두 동작을 모두 살려, 눈을 감는 행위와 입술을 오므리는 행위가 함께 악한 꾀의 표지로 보이도록 번역했습니다.
  alternative_readings:
  - 눈과 입술 중 하나만 강조하는 번역
  - 의미를 풀어 ‘몰래 음모를 꾸미는 사람’으로 의역하는 번역
  rationale: 원문의 이미지성을 유지해야 잠언 특유의 날카로운 풍자와 관찰이 살아납니다.
  doctrine_reference: 잠언 16장 문맥의 관찰적 경구 문체
