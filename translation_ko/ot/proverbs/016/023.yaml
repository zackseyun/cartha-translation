  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
  footnotes:
  - marker: a
    text: Or 'The heart of a wise man makes his mouth prudent.' The Hebrew verb can carry the sense of causing prudence or insight.
    reason: lexical_alternative
  - marker: b
    text: Or 'adds persuasiveness to his lips.' The Hebrew לֶקַח can denote instruction/learning and, by extension in context, speech that is instructive or persuasive.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람의 마음은 그의 입을 슬기롭게 하며[a], 그의 입술에 가르침을 더합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 사람의 마음은 그의 입에 통찰을 줍니다.’ 히브리어 동사는 ‘슬기롭게 하다’ 또는 ‘통찰을 주다’라는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 입술에 설득력을 더합니다.’ 히브리어 לֶקַח는 가르침이나 배움을 뜻하며, 문맥에 따라 가르침이 되는 말 또는 설득력 있는 말을 가리킬 수 있습니다.
    reason: alternative_reading
