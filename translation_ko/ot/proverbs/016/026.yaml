id: PRO.16.26
reference: Proverbs 16:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֣פֶשׁ עָ֭מֵל עָ֣מְלָה לּ֑/וֹ כִּֽי אָכַ֖ף עָלָ֣י/ו פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
  footnotes:
  - marker: a
    text: Or 'The soul/desire of the laborer labors for him.' Hebrew nephesh can mean 'soul,' 'life,' or 'appetite'; here the context of 'his mouth' favors 'appetite.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for himself.' The Hebrew says 'for him,' but some understand the sense reflexively.
    reason: alternative_reading
  - marker: c
    text: Or 'his mouth urges him,' 'drives him,' or 'compels him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 수고하는 사람의 욕구는 그를 위해 수고합니다[a][b], 그의 입이 그를 몰아붙이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수고하는 사람의 영혼/생명/소원’. 히브리어 네페쉬는 ‘영혼’, ‘생명’, ‘욕구’를 뜻할 수 있으며, 여기서는 ‘그의 입’이라는 문맥이 ‘욕구’ 쪽을 더 강하게 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 자신을 위해’. 히브리어는 ‘그를 위해’라고 말하지만, 일부는 반사적인 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 입이 그를 재촉합니다’, ‘몰아갑니다’, ‘강요합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: appetite
  chosen_korean: 욕구
  alternatives_korean:
  - 목마름
  - 입맛
  - 마음의 소원
  lexicon: HALOT
  rationale: 문맥상 ‘영혼’보다 사람을 움직이는 배고픔/욕구의 의미가 더 자연스러워서, 인격 전체보다 내적 충동을 나타내는 ‘욕구’로 옮겼습니다.
- source_word: עָמֵל / עָמְלָה
  english_pob_choice: laborer / labors
  chosen_korean: 수고하는 사람 / 수고합니다
  alternatives_korean:
  - 일하는 사람 / 일합니다
  - 애쓰는 사람 / 애씁니다
  - 수고꾼 / 수고합니다
  lexicon: HALOT
  rationale: 동일 어근의 반복과 말장난을 살리기 위해 ‘수고하는 사람’과 ‘수고합니다’를 대응시켜, 문장의 리듬과 반복 효과를 보존했습니다.
- source_word: פִּיהוּ
  english_pob_choice: his mouth
  chosen_korean: 그의 입
  alternatives_korean:
  - 그의 입술
  - 그의 배
  - 그의 배고픔
  lexicon: HALOT
  rationale: 히브리어의 직설적 이미지를 따라 ‘입’을 그대로 살렸고, 이를 해석어로 바꾸지 않았습니다.
- source_word: אָכַף עָלָיו
  english_pob_choice: presses him on
  chosen_korean: 그를 몰아붙이기 때문입니다
  alternatives_korean:
  - 그를 압박하기 때문입니다
  - 그를 재촉하기 때문입니다
  - 그를 강제로 움직이기 때문입니다
  lexicon: HALOT
  rationale: 동사의 압박·강제 뉘앙스를 현대 한국어에서 자연스럽게 드러내면서도, ‘입’이 사람을 움직이는 힘이라는 비유를 유지했습니다.
theological_decisions:
- issue: ‘נֶפֶשׁ’의 의미를 영혼으로 볼지, 욕구/식욕으로 볼지
  chosen_reading: 지혜문맥의 생리적·실천적 의미에 맞춰 ‘욕구’로 번역했습니다.
  alternative_readings:
  - ‘영혼’
  - ‘생명’
  - ‘소원’
  rationale: 바로 뒤의 ‘그의 입’이 노동을 재촉하는 원인으로 제시되므로, 형이상학적 ‘영혼’보다 배고픔과 관련된 내적 욕구를 가리키는 것으로 읽는 것이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: 잠언의 지혜어법과 נֶפֶשׁ의 문맥적 의미
- issue: ‘for him’의 방향을 반사적으로 풀지 여부
  chosen_reading: 본문 형태를 따라 ‘그를 위해’로 두고, 반사적 뉘앙스는 본문 밖에서 확정하지 않았습니다.
  alternative_readings:
  - ‘자기 자신을 위해’
  - ‘자기를 위해’
  rationale: 히브리어는 직접적으로 3인칭 단수 대명사형이므로, 해석을 과도하게 반사적으로 고정하지 않고 원문 형식을 우선했습니다.
  doctrine_reference: 히브리어 대명사 용법과 절의 문법
