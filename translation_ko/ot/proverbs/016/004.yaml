source:
  edition: WLC
  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
  footnotes:
  - marker: a
    text: Or 'for himself'; the Hebrew phrase can also be understood as 'The LORD has made everything for himself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the day of calamity' or 'for a day of evil.' Here 'evil' refers to disaster or ruin, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 모든 것을 그 목적을 위하여 만드셨습니다[a], 곧 악인도 재앙의 날을 위하여 만드셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 자신을 위하여’로도 옮길 수 있습니다. 히브리어 표현은 ‘야훼께서 모든 것을 자신을 위하여 만드셨다’는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재난의 날’ 또는 ‘화난의 날’로도 옮길 수 있습니다. 여기서 ‘악’은 도덕적 악이 아니라 재앙이나 파국을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  english_pob_choice: everything
  chosen_korean: 모든 것
  alternatives_korean:
  - 만물
  - 전부
  lexicon: HALOT
  rationale: 히브리어 כֹּל의 포괄성을 현대 한국어에서 가장 자연스럽게 드러내는 표현입니다.
- source_word: פָּעַל
  english_pob_choice: has made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 하셨습니다
  - 지으셨습니다
  - 만들어 내셨습니다
  lexicon: HALOT
  rationale: 하나님을 주어로 한 창조·섭리적 행위에 가장 자연스러운 합쇼체 표현으로, ‘has made’의 결과성과 목적성을 살립니다.
- source_word: לַמַּעֲנֵהוּ
  english_pob_choice: for its purpose
  chosen_korean: 그 목적을 위하여
  alternatives_korean:
  - 그를 위하여
  - 그의 목적을 위하여
  - 그 답을 위하여
  lexicon: HALOT
  rationale: 이 표현은 ‘응답/대답’의 직역보다 비유적·목적론적 의미가 문맥에 더 맞으므로, 목적을 드러내는 한국어로 옮겼습니다.
- source_word: לְיוֹם רָעָה
  english_pob_choice: for the day of disaster
  chosen_korean: 재앙의 날을 위하여
  alternatives_korean:
  - 재난의 날을 위하여
  - 화난의 날을 위하여
  - 악한 날을 위하여
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 재앙·파국을 가리키므로, 오해를 피하면서도 경고의 뉘앙스를 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 야훼의 주권과 악인의 존재 목적을 어떻게 표현할지
  chosen_reading: 본문은 야훼께서 모든 것을 목적 있게 두셨으며, 악인까지도 재앙의 날과 연결된다는 점을 말합니다. 그러나 하나님을 도덕적 악의 조성자로 단정하지는 않습니다.
  alternative_readings:
  - 하나님이 모든 것을 자기 자신을 위하여 만드셨습니다.
  - 하나님이 악인도 악 자체를 위하여 만드셨습니다.
  rationale: 히브리어는 섭리와 정해진 결말을 분명히 말하지만, 이를 도덕적 악의 창시라는 뜻으로 강화하지 않도록 ‘재앙’과 ‘목적’을 사용해 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
