base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
  footnotes:
  - marker: a
    text: Or 'for himself'; the Hebrew phrase can also be understood as 'The LORD has made everything for himself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the day of calamity' or 'for a day of evil.' Here 'evil' refers to disaster or ruin, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 모든 것을 각각 그 목적을 위하여 만드셨습니다[a]. 심지어 악인도 재앙의 날을 위하여 만드셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 자신을 위하여’로도 옮길 수 있습니다. 히브리어 표현은 ‘야훼께서 모든 것을 자신을 위하여 만드셨다’는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재난의 날’ 또는 ‘환난의 날’로도 옮길 수 있습니다. 여기서 ‘악’은 도덕적 악이 아니라 재앙이나 파국을 가리킵니다.
    reason: lexical_alternative
