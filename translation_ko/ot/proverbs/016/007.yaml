  to: 사람의 행실이 야훼를 기쁘시게 하면, 그분은 그의 원수들까지도 그와 화목하게 하십니다.
  rationale: 히브리어 דַּרְכֵי אִישׁ의 관용적 의미를 현대 한국어의 ‘사람의 행실’로 옮겨 정확성과 자연스러움을 높였습니다. 나머지 구문은 하나님의 주도적 사역과 원수들과의 평화라는 원문의 관계를 유지했습니다. 본문에서 이미 일반적 단수 의미가 충분히 전달되므로 부정확하고 부자연스러운 각주는 삭제했습니다.
