id: PRO.16.7
reference: Proverbs 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
  footnotes:
  - marker: a
    text: Or, 'a person's ways'; Hebrew 'a man's ways,' with representative/generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 행실이 야훼를 기쁘시게 하면, 그분은 그의 원수들까지도 그와 화목하게 하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְצוֹת יְהוָה
  english_pob_choice: When a man's ways please Yahweh
  chosen_korean: 사람의 길들이 야훼를 기쁘시게 하면
  alternatives_korean:
  - 야훼께서 사람의 길들을 기뻐하실 때
  - 야훼께서 한 사람의 길에 기뻐하시면
  lexicon: HALOT
  rationale: בִּרְצוֹת는 상황절을 이루는 infinitive construct로, 한국어에서는 ‘-으면’ 조건/상황 표현이 가장 자연스럽습니다. יְהוָה는 본문 원형을 살려 야훼로 옮겼습니다.
- source_word: דַּרְכֵי אִישׁ
  english_pob_choice: a man's ways
  chosen_korean: 사람의 길들
  alternatives_korean:
  - 한 남자의 길들
  - 한 사람의 길
  lexicon: HALOT
  rationale: אִישׁ는 여기서 대표적 일반인칭으로 쓰였으므로, 현대 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽지만, 원문의 복수형 דַּרְכֵי를 살려 ‘길들’로 옮겼습니다.
- source_word: גַּם ... יַשְׁלִם אִתּוֹ
  english_pob_choice: he makes even his enemies be at peace with him
  chosen_korean: 그분은 그의 원수들까지도 그와 화목하게 하십니다
  alternatives_korean:
  - 그분은 그의 원수들까지도 그와 평화롭게 하십니다
  - 그분은 그의 원수들과도 그를 화목하게 하십니다
  lexicon: HALOT
  rationale: גַּם의 강조를 ‘까지도’로 살리고, יַשְׁלִם의 사역적 의미를 관계 회복의 결과로 자연스럽게 드러내기 위해 ‘화목하게 하십니다’를 선택했습니다.
- source_word: אִתּוֹ
  english_pob_choice: with him
  chosen_korean: 그와
  alternatives_korean:
  - 그와 함께
  - 그에게
  lexicon: HALOT
  rationale: 전치사 אִתּוֹ는 단순한 동반/관계 표지를 가지므로, 한국어에서는 목적어적 관계보다 ‘그와’가 가장 직접적입니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 프로젝트 기본 원칙에 따라 신명기적 고유명사인 יהוה는 대체 호칭이 아니라 음역된 신명 ‘야훼’로 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 인칭 일반화와 성별 표지
  chosen_reading: 사람의 길들
  alternative_readings:
  - 한 남자의 길들
  - 한 사람의 길
  rationale: 히브리어 אִישׁ의 대표적 일반인칭을 현대 독자가 오해하지 않도록 하되, 원문의 남성 단수 형식이 지닌 일반화된 힘은 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
