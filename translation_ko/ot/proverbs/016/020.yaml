id: PRO.16.20
reference: Proverbs 16:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
  footnotes:
  - marker: a
    text: Or 'acts wisely concerning a matter' or 'whoever is prudent in a matter.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blessed is he'; the masculine singular is generic, referring to any person who trusts in the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 사실을 깊이 살피는 사람은 좋은 것을 찾고, 야훼를 신뢰하는 이는 복됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사실을 깊이 살피는 사람’은 ‘일에 대해 지혜롭게 행동하는 사람’ 또는 ‘일을 분별 있게 처리하는 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수형이지만, 여기서는 야훼를 신뢰하는 모든 사람을 가리키는 일반적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל דָּבָר
  english_pob_choice: Whoever gives careful attention to a matter
  chosen_korean: 사실을 깊이 살피는 사람
  alternatives_korean:
  - 한 일을 지혜롭게 처리하는 사람
  - 어떤 일을 주의 깊게 다루는 사람
  - 일에 대해 신중히 판단하는 사람
  lexicon: HALOT
  rationale: מַשְׂכִּיל은 단순한 지적 이해보다 분별력 있게 살피고 숙고하는 적극적 태도를 가리키므로, 한국어로는 자연스럽고 압축적인 ‘깊이 살피는 사람’으로 옮겼습니다. דָּבָר는 여기서 ‘말씀’보다 ‘사실/일/사안’의 뜻이 더 적절합니다.
- source_word: יִמְצָא טוֹב
  english_pob_choice: will find good
  chosen_korean: 좋은 것을 찾고
  alternatives_korean:
  - 좋은 것을 얻고
  - 복을 얻고
  - 좋은 결과를 만나고
  lexicon: HALOT
  rationale: יִמְצָא는 기본적으로 ‘찾다/얻다’의 뜻이고, טוֹב는 여기서 물질적 번영으로 좁히기보다 선함·유익·좋음 전체를 가리키므로, ‘좋은 것을 찾고’로 간결하게 살렸습니다.
- source_word: בַּיהוָה
  english_pob_choice: trusts in Yahweh
  chosen_korean: 야훼를 신뢰하는
  alternatives_korean:
  - 여호와를 신뢰하는
  - 주님을 신뢰하는
  - 야훼 안에서 신뢰하는
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 하나님의 이름 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. בטח ב의 관용적 의미는 ‘신뢰하다’가 가장 직접적입니다.
- source_word: אַשְׁרָיו
  english_pob_choice: blessed is he
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복 있는 사람입니다
  - 복되다 할 수 있습니다
  - 행복합니다
  lexicon: HALOT
  rationale: אַשְׁרֵי 형식은 단순 감정의 ‘행복’보다 복된 상태를 선포하는 축복문이므로, 현대 한국어에서 자연스러운 선언형인 ‘복됩니다’로 처리했습니다. 히브리어 남성 단수는 일반적 인칭으로 이해했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 하나님의 이름 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나온 신명표기를 보존해 언약적 이름의 뉘앙스를 드러내고, 프로젝트 기본 용례와 일치시키기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
