  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/חֲכַם לֵ֭ב יִקָּרֵ֣א נָב֑וֹן וּ/מֶ֥תֶק שְׂ֝פָתַ֗יִם יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/021.yaml
  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
  footnotes:
  - marker: a
    text: Or 'adds persuasiveness' or 'adds instruction' for 'increases learning.' The Hebrew term can denote learning received, instruction, or the effect of persuasive teaching.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음이 지혜로운 사람은 분별력 있는 사람이라고 불리고, 입술의 달콤함은 배움을 더합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘설득력을 더합니다’, ‘가르침을 더합니다’. 여기의 히브리어는 배움으로 받은 내용, 교훈, 또는 설득력 있는 가르침의 효과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  english_pob_choice: The wise of heart
  chosen_korean: 마음이 지혜로운 사람
  alternatives_korean:
  - 마음이 지혜로운 이
  - 지혜로운 마음의 사람
  - 마음이 지혜로운 자
  lexicon: HALOT
  rationale: 히브리어의 관용구로서 내면의 지혜를 가리키므로 ‘마음이 지혜로운 사람’으로 자연스럽게 옮기되, 원문의 이미지도 유지했습니다.
- source_word: יִקָּרֵא נָבוֹן
  english_pob_choice: is called discerning
  chosen_korean: 분별력 있는 사람이라고 불리고
  alternatives_korean:
  - 분별력 있다고 불리고
  - 이해력 있는 사람이라고 불리고
  - 슬기롭다고 불리고
  lexicon: HALOT
  rationale: נָבוֹן은 단순한 지식보다 분별과 판단력을 가리키므로 ‘분별력 있는 사람’이 문맥에 가장 잘 맞습니다.
- source_word: וּמֶתֶק שְׂפָתַיִם
  english_pob_choice: and sweetness of lips
  chosen_korean: 입술의 달콤함
  alternatives_korean:
  - 달콤한 입술
  - 입술의 부드러움
  - 말의 달콤함
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입술의 달콤함’을 택해 히브리어의 비유를 살렸고, ‘입술’이 말/언어를 가리키는 환유임을 보존했습니다.
- source_word: יֹסִיף לֶקַח
  english_pob_choice: increases learning
  chosen_korean: 배움을 더합니다
  alternatives_korean:
  - 가르침을 더합니다
  - 지식을 더합니다
  - 설득력을 더합니다
  lexicon: HALOT
  rationale: לֶקַח은 배움으로 받은 교훈이나 가르침을 뜻할 수 있어, 문맥상 가장 무난한 ‘배움’을 본문에 두고 의미 범위를 보존했습니다.
