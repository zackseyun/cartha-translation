review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the two nominal clauses, the generic אדם as ‘사람,’ לב as ‘마음,’ and יהוה as ‘야훼.’ The adversative connection is a legitimate contextual rendering of ו. However, ‘혀의 대답’ is overly literal in Korean and can sound as though the physical tongue itself gives an answer, obscuring the Hebrew metonym for spoken speech.
  naturalness: The sentence is otherwise fluent modern formal-polite Korean. Recasting the final phrase as ‘혀가 하는 대답’ retains the source image while making the intended metonymic sense intelligible and natural.
  terminology: ‘마음,’ ‘계획,’ and ‘야훼’ are appropriate. ‘혀’ should be retained, but its relation to ‘대답’ needs an idiomatic Korean construction.
  issues:
  - severity: medium
    issue: ‘혀의 대답’ is unnatural and semantically opaque in Korean.
    rationale: Hebrew לָשׁוֹן is a metonym for speech. Korean possessive wording here can misleadingly personify the tongue or sound mechanically literal. ‘혀가 하는 대답’ preserves the concrete ‘tongue’ image and clearly denotes a spoken answer.
  revised_text: 사람에게는 마음의 계획이 있지만, 혀가 하는 대답은 야훼에게서 나옵니다.
  revised_footnotes: []
  revision_rationale: Only the Korean expression for מַעֲנֵה לָשׁוֹן has been adjusted for naturalness and clarity. The revision preserves the literal lexical image ‘혀,’ the human/divine contrast, and the ambiguity of how the proverb relates human planning to Yahweh’s role in the answer.
