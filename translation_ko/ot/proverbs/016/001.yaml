id: PRO.16.1
reference: Proverbs 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
  footnotes:
  - marker: a
    text: Or 'The arrangements/preparations of the heart are for man, but the answer of the tongue is from the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'man' (אָדָם) is a representative singular for a human being generally.
    reason: cultural_note
translation:
  language: ko
  text: 사람에게는 마음의 계획이 있지만, 혀의 대답은 야훼에게서 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאָדָם
  english_pob_choice: belong to man
  chosen_korean: 사람에게는
  alternatives_korean:
  - 사람의 몫은
  - 인간에게는
  - 사람에게 속한 것은
  lexicon: HALOT
  rationale: לְ 앞의 אָדָם을 소유·귀속 관계로 이해해, 인간 쪽에 속하는 영역이라는 점을 한국어 여격으로 자연스럽게 살렸습니다. אָדָם은 대표 단수의 일반 명사이므로 ‘사람’으로 옮겼습니다.
- source_word: מַעַרְכֵי
  english_pob_choice: plans
  chosen_korean: 계획
  alternatives_korean:
  - 배열
  - 준비
  - 구상
  lexicon: HALOT
  rationale: 어근 ערך의 ‘배열/정돈’ 의미가 지혜문맥에서는 내적 설계나 의도를 가리키므로, 가장 자연스럽고 간결한 ‘계획’으로 옮겼습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 내면
  - 생각
  lexicon: HALOT
  rationale: 히브리어 לֵב은 사고와 의지를 포함한 내적 중심을 뜻하므로, 한국어 성경 문맥에서 통용되는 ‘마음’으로 살렸습니다.
- source_word: מַעֲנֵה לָשׁוֹן
  english_pob_choice: the answer of the tongue
  chosen_korean: 혀의 대답
  alternatives_korean:
  - 입의 대답
  - 말의 응답
  - 혀의 응답
  lexicon: HALOT
  rationale: ‘혀’는 말의 행위를 가리키는 히브리어의 구체적 환유를 보존합니다. ‘대답’은 מַעֲנֵה의 직접적인 대응어이며, 간결한 잠언체에 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 POB 기본 원칙에 따라 고유명사 ‘야훼’로 옮겨, 제목어 ‘주님’으로 대체하지 않았습니다.
theological_decisions:
- issue: 인간의 계획과 야훼의 주권의 대비
  chosen_reading: 이 절은 사람에게는 내적 계획이 있지만, 실제로 입에서 나오는 응답은 야훼에게서 온다는 대비를 유지합니다.
  alternative_readings:
  - 사람의 계획 전체가 야훼에 의해 결정된다는 더 강한 운명론적 읽기
  - 인간의 말만 야훼의 직접 통제를 받는다는 좁은 읽기
  rationale: 히브리어는 두 절을 병렬로 놓아 인간의 계획과 야훼의 발언적 개입을 대조합니다. 한국어도 이 긴장을 풀지 않고 ‘하지만’으로 대비를 드러냈습니다.
  doctrine_reference: 지혜문학의 병렬 구조가 만드는 주권-책임의 긴장을 보존합니다.
