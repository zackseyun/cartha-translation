id: PRO.16.12
reference: Proverbs 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
  footnotes:
  - marker: a
    text: 'Or: "for a throne is established by justice."'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕들에게는 악을 행하는 것이 가증한 일입니다. 의로 말미암아 왕좌가 굳게 섭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “정의로 말미암아 왕좌가 굳게 섭니다.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 혐오스러운 일
  - 역겨운 일
  lexicon: HALOT
  rationale: 지혜문학에서 강한 도덕적 혐오를 나타내는 נ־אכ류 표현을 한국어로는 ‘가증한 일’이 가장 압축적으로 살립니다.
- source_word: מְלָכִים
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 통치자들
  - 임금들
  lexicon: HALOT
  rationale: 복수형 명사 그대로 ‘왕들’로 옮겨 왕권 일반에 대한 잠언의 진술을 유지했습니다.
- source_word: רֶשַׁע
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 불의
  lexicon: HALOT
  rationale: 여기서는 ‘행하다’와 결합한 목적어로 자연스럽게 들리도록, 넓지만 강한 도덕적 범주인 ‘악’을 택했습니다.
- source_word: בְּצְדָקָה
  english_pob_choice: by righteousness
  chosen_korean: 의로 말미암아
  alternatives_korean:
  - 의로써
  - 정의로 말미암아
  lexicon: HALOT
  rationale: 전치사 בְּ의 수단/근거 의미를 살려 ‘말미암아’를 썼고, צדקה는 기본값인 ‘의’로 옮겼습니다. 왕권의 공적 정당성이라는 뜻을 담되, ‘정의’는 대안으로 남겼습니다.
- source_word: יִכּוֹן כִּסֵּא
  english_pob_choice: a throne is established
  chosen_korean: 왕좌가 굳게 섭니다
  alternatives_korean:
  - 왕좌가 세워집니다
  - 왕좌가 확립됩니다
  lexicon: HALOT
  rationale: כּוּן의 ‘굳게 서다/견고해지다’의 이미지를 살리되, 한국어 잠언체에 맞게 간결하고 힘 있게 표현했습니다.
theological_decisions:
- issue: צדקה를 ‘의’로 둘지 ‘정의’로 둘지
  chosen_reading: ‘의’로 번역하되, 왕권 문맥의 공적 통치 의미를 함께 지니도록 했습니다.
  alternative_readings:
  - 정의
  - 의로움
  rationale: 본문은 왕의 정당한 शासन이 무엇에 의해 굳어지는지를 말하므로 ‘의’가 넓은 성경적 핵심어로서 적절합니다. 동시에 royal-wisdom 문맥의 통치적 뉘앙스는 문장 전체에서 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: contested terms — righteousness 기본값 유지, justice는 문맥상 대안 보존'
