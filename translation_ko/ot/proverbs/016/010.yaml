id: PRO.16.10
reference: Proverbs 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
  footnotes:
  - marker: a
    text: 'Hebrew qesem often means ''divination''; here it is rendered ''a divine verdict'' because the context is judicial speech. Possible alternatives: ''divination'' or ''oracle.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'in judgment' or 'when judging' for 'justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 입술에는 신탁이 있고, 그의 입은 정의를 배반하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קֶסֶם은 보통 ‘점술’을 뜻하지만, 여기서는 왕의 사법적 발화를 가리키는 문맥에 따라 ‘신탁’으로 옮겼습니다. 가능한 대안은 ‘점술’, ‘예언’, ‘신의 판결’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בְּמִשְׁפָּט은 ‘판결에서’, ‘재판할 때’의 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  english_pob_choice: a divine verdict
  chosen_korean: 신탁
  alternatives_korean:
  - 점술
  - 예언
  - 신의 판결
  lexicon: HALOT
  rationale: 문맥상 부정적 의미의 ‘점술’보다, 왕의 판결을 높이는 예언적·권위적 발화를 살리는 ‘신탁’이 더 잘 맞습니다. 다만 히브리어는 다른 문맥에서 ‘점술’의 뜻도 가지므로 그 긴장을 보존합니다.
- source_word: שִׂפְתֵי מֶלֶךְ
  english_pob_choice: the lips of a king
  chosen_korean: 왕의 입술
  alternatives_korean:
  - 한 왕의 입술
  - 임금의 입술
  lexicon: HALOT
  rationale: 속담적 일반성을 살려 정관사 없이 ‘왕의 입술’로 옮겼습니다. ‘임금’보다 현대 문어에서 더 중립적인 ‘왕’을 택했습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 판결에서
  - 재판에서
  - 심판에서
  lexicon: HALOT
  rationale: 문맥상 법적 판단의 영역을 가리키지만, 한국어에서는 ‘정의를 배반하지 않는다’가 더 자연스럽게 왕의 공정한 재판을 드러냅니다. 영어 POB의 ‘justice’ 선택을 그대로 반영했습니다.
- source_word: לֹא יִמְעַל
  english_pob_choice: does not betray
  chosen_korean: 배반하지 않습니다
  alternatives_korean:
  - 저버리지 않습니다
  - 속이지 않습니다
  - 불성실하지 않습니다
  lexicon: HALOT
  rationale: מעל의 핵심인 ‘불충실하게 행동하다/배반하다’를 살려, ‘정의’를 대상화한 표현으로 ‘배반하지 않습니다’를 선택했습니다.
theological_decisions:
- issue: קֶסֶם의 의미를 ‘점술’로 볼지, 왕의 न्याय적 발화를 가리키는 긍정적 표현으로 볼지
  chosen_reading: 왕의 입술에 있는 권위 있는 신적 발화를 가리키는 ‘신탁’으로 옮겼습니다.
  alternative_readings:
  - 점술
  - 예언
  - 신의 판결
  rationale: 이 잠언은 왕의 이상적 재판 발화를 묘사하므로, 금지된 주술을 말하는 것으로 읽으면 문맥이 어긋납니다. 그렇다고 단순히 ‘예언’으로 평준화하면 히브리어의 오라클적 긴장이 약해져서 ‘신탁’이 가장 균형적입니다.
  doctrine_reference: 잠언의 왕권/정의 신학
