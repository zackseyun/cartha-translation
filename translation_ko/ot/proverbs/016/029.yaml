  source_fidelity: 히브리어의 주어 ‘폭력/포악함의 사람’, 목적어 ‘그의 이웃’, 피엘형 פתה의 ‘꾀다/유인하다’, 히필형 הלך의 사역 의미, 그리고 ‘좋지 않은 길’이라는 절제된 도덕 평가를 대체로 잘 반영했습니다. 다만 ‘꾀어내다’는 사람을 어떤 장소 밖으로 불러낸다는 뜻으로도 쉽게 읽혀 פתה의 유인 의미에 비해 부정확할 수 있습니다. 또한 원문의 소유 접미사(‘그의’)는 ‘자기 이웃’으로 드러내는 편이 안전합니다.
  naturalness: ‘자기 이웃을 꾀어 좋지 않은 길을 걷게 합니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 상대를 그릇된 삶의 행로로 이끈다는 잠언의 비유를 명료하게 전달합니다.
  terminology: ‘포악한 사람’은 אִישׁ חָמָס의 폭력적·억압적 성격을 자연스럽게 나타냅니다. ‘이웃’은 רֵעַ의 넓은 관계 범위를 보존하며, ‘좋지 않은’은 לֹא טוֹב를 ‘악한’으로 과도하게 강화하지 않습니다.
