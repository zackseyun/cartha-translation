  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
  footnotes:
  - marker: a
    text: Or 'his friend' or 'his companion' for 'his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in a way not good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 포악한 사람은 이웃을 꾀어내어 좋지 않은 길로 이끕니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친구’ 또는 ‘그의 동료’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘좋지 않은 길로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָמָס
  english_pob_choice: a violent man
  chosen_korean: 포악한 사람
  alternatives_korean:
  - 폭력적인 남자
  - 폭력적인 사람
  - 포악한 남자
  lexicon: HALOT
  rationale: 히브리어는 ‘폭력/포악함의 사람’이라는 성격 규정이므로, 현대 한국어에서 자연스럽고 도덕적 성격을 드러내는 ‘포악한 사람’으로 옮겼습니다.
- source_word: יְפַתֶּה
  english_pob_choice: entices
  chosen_korean: 꾀어내어
  alternatives_korean:
  - 유혹하여
  - 설득하여
  - 속여
  lexicon: HALOT
  rationale: 지혜문맥에서의 פתה는 단순 설득보다 부정한 길로 ‘꾀어 끌어들이는’ 뉘앙스가 강하므로, 과도한 성적 함의를 피하면서도 유인성을 살린 ‘꾀어내어’를 택했습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 친구
  - 동료
  - 동무
  lexicon: HALOT
  rationale: רֵעַ는 친구/동료/이웃을 포괄할 수 있으나, 여기서는 특정 친밀관계보다 가까운 타자를 가리키는 일반적 의미가 적절하므로 ‘이웃’으로 번역했습니다.
- source_word: לֹא טוֹב
  english_pob_choice: that is not good
  chosen_korean: 좋지 않은
  alternatives_korean:
  - 선하지 않은
  - 악한
  - 나쁜
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현 ‘좋지 않은’을 살려, 도덕적 평가를 지나치게 강하게 고정하지 않고 원문의 간결함을 유지했습니다.
theological_decisions:
- issue: ‘דרך’의 비유적 의미
  chosen_reading: 물리적 길이 아니라 삶의 방향이나 행로를 가리키는 비유로 이해했습니다.
  alternative_readings:
  - 실제 도로/길
  - 행동 방식
  rationale: 잠언의 ‘길’은 반복적으로 삶의 방식과 선택을 뜻하므로, 한국어에서도 ‘길’의 이미지를 유지하되 문맥상 비유성을 반영했습니다.
  doctrine_reference: 잠언 지혜문학의 행보/삶의 길 이미지
