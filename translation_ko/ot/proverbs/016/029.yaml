- from: 포악한 사람은 이웃을 꾀어내어 좋지 않은 길로 이끕니다.[a][b]
  to: 포악한 사람은 자기 이웃을[a] 꾀어 좋지 않은 길을 걷게 합니다.[b]
  rationale: ‘꾀어내어’를 ‘꾀어’로 고쳐 פתה의 유인 의미를 정확히 하고, ‘자기’를 보충하여 רֵעֵהוּ의 소유 접미사를 반영했습니다. ‘걷게 합니다’는 히필형 וְהוֹלִיכוֹ의 사역적 의미와 잠언에서 ‘길’이 지닌 삶의 행로 비유를 자연스럽게 살립니다. 각주 표지는 각각 해당 어휘에 붙이고, b 각주는 원문의 문자적 전치사 표현을 설명하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:11Z'
