source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
  footnotes:
  - marker: a
    text: Or 'Just lips are the favor of kings.' The Hebrew רְצוֹן can mean 'favor,' 'pleasure,' or 'delight,' and צֶדֶק may be rendered 'justice' or 'righteousness' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'he loves one who speaks what is right.' The phrase 'what is upright' renders a plural form used substantivally in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 의로운 말은 왕들이 기뻐하는 것이며, 왕은 바른 것을 말하는 사람을 사랑합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 말은 왕들의 호의입니다.’ 히브리어 רָצוֹן은 ‘호의’, ‘기쁨’, ‘즐거움’으로도 옮길 수 있고, צֶדֶק은 문맥에 따라 ‘의’ 또는 ‘정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕은 옳은 것을 말하는 사람을 사랑합니다.’ 히브리어의 복수형 형용사는 명사처럼 쓰여 ‘바른 것들’ 또는 문맥상 ‘바른 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
