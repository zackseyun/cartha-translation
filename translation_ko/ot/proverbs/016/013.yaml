  rationale: 왕들이 의로운 말을 기뻐한다는 평가를 자연스럽게 드러내기 위해 ‘기쁨’을 택했습니다. ‘호의’는 다소 제도적이고, ‘좋아함’은 문맥의 품격을 약화시킬 수 있습니다.
- source_word: מְלָכִים
