id: PRO.16.13
reference: Proverbs 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
  footnotes:
  - marker: a
    text: Or 'Just lips are the favor of kings.' The Hebrew רְצוֹן can mean 'favor,' 'pleasure,' or 'delight,' and צֶדֶק may be rendered 'justice' or 'righteousness' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'he loves one who speaks what is right.' The phrase 'what is upright' renders a plural form used substantivally in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 의로운 입술은 왕들의 기쁨입니다[a]. 그리고 그는 옳은 것을 말하는 자를 사랑합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 입술은 왕들의 호의입니다.’ 히브리어 רְצוֹן은 ‘호의’, ‘기쁨’, ‘즐거움’으로도 옮길 수 있고, צֶדֶק은 문맥에 따라 ‘의’ 또는 ‘정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘옳은 것을 말하는 자를 사랑합니다.’ 히브리어의 복수형 형용사는 명사처럼 쓰여 ‘옳은 것들/옳은 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  english_pob_choice: delight
  chosen_korean: 기쁨
  alternatives_korean:
  - 호의
  - 즐거움
  - 좋아함
  lexicon: HALOT
  rationale: 왕들이 의로운 말을 기뻐한다는 평가를 자연스럽게 드러내기 위해 ‘기쁨’을 택했습니다. ‘호의’는 다소 제도적이고, ‘좋아함’은 문맥의 품격을 약화시킬 수 있습니다.
- source_word: מְלָכִים
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 군왕들
  - 통치자들
  lexicon: HALOT
  rationale: 히브리어의 구체적 사회 배경을 살려 ‘왕들’로 옮겼습니다. 잠언의 궁정적 지혜 문맥에도 가장 직접적입니다.
- source_word: שִׂפְתֵי צֶדֶק
  english_pob_choice: Righteous lips
  chosen_korean: 의로운 입술
  alternatives_korean:
  - 의로운 말
  - 정의로운 입술
  - 의의 입술
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입술’을 유지하되, 한국어에서 자연스러운 형용사 수식을 사용해 ‘의로운 입술’로 옮겼습니다. 이는 말의 성격을 가리키는 메토님으로 읽히게 합니다.
- source_word: יְשָׁרִים
  english_pob_choice: what is upright
  chosen_korean: 옳은 것을
  alternatives_korean:
  - 정직한 것을
  - 바른 것을
  - 의로운 것을
  lexicon: HALOT
  rationale: 복수형 형용사가 명사적으로 쓰인 점을 반영하면서, 한국어에서는 가장 무리 없는 실체화 표현인 ‘옳은 것’을 사용했습니다. ‘바른 것’도 가능하지만, 반복되는 도덕적 의미를 고려해 ‘옳은 것’이 더 분명합니다.
- source_word: יֶאֱהָב
  english_pob_choice: he loves
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 사랑하십니다
  - 좋아합니다
  - 기뻐합니다
  lexicon: HALOT
  rationale: 히브리어 3인칭 단수의 일반적/격언적 현재를 한국어 현재형으로 옮겼습니다. 문장 전체의 잠언체 진술에 맞춰 ‘사랑합니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יֶאֱהָב의 인칭과 잠언체 일반 진술
  chosen_reading: 주어를 일반화된 왕으로 이해하되, 동사는 단수 격언 현재로 유지했습니다.
  alternative_readings:
  - ‘그들은 사랑합니다’처럼 복수화하는 읽기
  - 특정 왕 한 사람으로만 제한하는 읽기
  rationale: 히브리어 동사 형태는 3인칭 단수이며, 잠언에서는 단수형이 보편적 진술을 나타내는 경우가 많습니다. 따라서 형태를 보존하면서도 뜻은 일반적 성격으로 읽는 것이 가장 충실합니다.
  doctrine_reference: 히브리어 문법과 잠언의 격언적 화법
