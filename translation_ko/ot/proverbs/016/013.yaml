  - 의의 입술
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입술’을 유지하되, 한국어에서 자연스러운 형용사 수식을 사용해 ‘의로운 입술’로 옮겼습니다. 이는 말의 성격을 가리키는 메토님으로 읽히게 합니다.
- source_word: יְשָׁרִים
  english_pob_choice: what is upright
  chosen_korean: 옳은 것을
  alternatives_korean:
  - 정직한 것을
  - 바른 것을
  - 의로운 것을
  lexicon: HALOT
  rationale: 복수형 형용사가 명사적으로 쓰인 점을 반영하면서, 한국어에서는 가장 무리 없는 실체화 표현인 ‘옳은 것’을 사용했습니다. ‘바른 것’도 가능하지만, 반복되는 도덕적 의미를 고려해 ‘옳은 것’이 더 분명합니다.
- source_word: יֶאֱהָב
  english_pob_choice: he loves
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 사랑하십니다
  - 좋아합니다
  - 기뻐합니다
  lexicon: HALOT
  rationale: 히브리어 3인칭 단수의 일반적/격언적 현재를 한국어 현재형으로 옮겼습니다. 문장 전체의 잠언체 진술에 맞춰 ‘사랑합니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יֶאֱהָב의 인칭과 잠언체 일반 진술
  chosen_reading: 주어를 일반화된 왕으로 이해하되, 동사는 단수 격언 현재로 유지했습니다.
  alternative_readings:
  - ‘그들은 사랑합니다’처럼 복수화하는 읽기
  - 특정 왕 한 사람으로만 제한하는 읽기
  rationale: 히브리어 동사 형태는 3인칭 단수이며, 잠언에서는 단수형이 보편적 진술을 나타내는 경우가 많습니다. 따라서 형태를 보존하면서도 뜻은 일반적 성격으로 읽는 것이 가장 충실합니다.
  doctrine_reference: 히브리어 문법과 잠언의 격언적 화법
