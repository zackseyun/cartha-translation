  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: ko
  text: 지혜를 얻는 것—금보다 얼마나 더 나은지 모릅니다! 그리고 명철을 얻는 것은 은보다 택함을 받는 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 מֵ/חָרוּץ는 문맥상 ‘금’으로 이해되는 전통적 읽기를 따랐습니다.
    reason: source_note
lexical_decisions:
- source_word: קְנֹה חָכְמָה
  english_pob_choice: To acquire wisdom
  chosen_korean: 지혜를 얻는 것
  alternatives_korean:
  - 지혜를 사는 것
  - 지혜를 획득하는 것
  lexicon: קנה + חכמה
  rationale: חָכְמָה를 단순히 ‘가지다’가 아니라 ‘얻다’로 옮겨, 행위적·목적적 뉘앙스를 살렸습니다.
- source_word: מַה טּוֹב מֵ/חָרוּץ
  english_pob_choice: how much better than gold
  chosen_korean: 금보다 얼마나 더 나은지 모릅니다
  alternatives_korean:
  - 금보다 훨씬 더 좋습니다
  - 금보다 얼마나 좋은지요
  lexicon: טוב + מִן
  rationale: 수사적 감탄을 한국어의 자연스러운 비교 표현으로 풀어, 원문의 ‘얼마나 더 나은가’라는 강조를 살렸습니다.
- source_word: וּ/קְנ֥וֹת בִּ֝ינָ֗ה
  english_pob_choice: And to acquire understanding
  chosen_korean: 그리고 명철을 얻는 것은
  alternatives_korean:
  - 그리고 분별을 얻는 것은
  - 그리고 통찰을 얻는 것은
  lexicon: קנה + בינה
  rationale: בִּינָה는 문맥상 지적 통찰이지만, 지혜서의 평행법을 살려 기존 POB 용어인 ‘명철’을 채택했습니다.
- source_word: נִבְחָ֥ר מִ/כָּֽסֶף
  english_pob_choice: is to be chosen over silver
  chosen_korean: 은보다 택함을 받는 것입니다
  alternatives_korean:
  - 은보다 선택되는 것입니다
  - 은보다 선택받는 것입니다
  lexicon: בחר + כסף
  rationale: נִבְחָר의 수동적·가치판정적 의미를 살려, 비교 대상인 은보다 ‘선택됨/택함’을 강조했습니다.
theological_decisions:
- issue: 지혜와 명철의 관계를 한국어에서 어떻게 평행하게 살릴지
  chosen_reading: ‘지혜’와 ‘명철’을 서로 다른 두 덕목으로 병렬하고, 둘 다 ‘얻는 것’이라는 동사 구조로 맞췄습니다.
  alternative_readings:
  - ‘지혜’와 ‘분별’로 옮겨 더 해석적으로 구분함
  - 두 행을 모두 ‘얻다’ 대신 ‘추구하다’로 옮김
  rationale: 히브리어 평행법의 대칭을 유지해야 하므로, 의미를 넓히거나 도덕적 권면으로 바꾸기보다 간결한 획득의 이미지를 보존했습니다.
  doctrine_reference: 잠언의 지혜 전통과 히브리 시의 평행법
