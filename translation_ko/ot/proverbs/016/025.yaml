  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: ko
  text: 사람 앞에는 바른 듯 보이는 길이 있지만, 그 끝은 죽음의 길들입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “한 사람 앞에”입니다. 영어 POB의 “before a man”을 따라, 외형상 바르게 보이는 판단 기준을 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - דרך
  - 방식
  lexicon: דרך
  rationale: 히브리어 דֶּרֶךְ는 문자적 ‘길’이면서 삶의 ‘방식’도 뜻하지만, 여기서는 뒤의 ‘끝’과 ‘죽음의 길들’에 맞물리는 삶의 행로로 보이므로 ‘길’이 가장 자연스럽습니다.
- source_word: יָשָׁר
  english_pob_choice: seems right
  chosen_korean: 바른 듯 보이는
  alternatives_korean:
  - 옳아 보이는
  - 바른 것 같은
  - 올곧아 보이는
  lexicon: ישׁר
  rationale: 형용사 יָשָׁר는 도덕적·실질적 ‘바름’을 가리키며, 영어 POB의 ‘seems right before a man’을 반영해 외형상 바르게 여겨지는 뉘앙스를 살렸습니다.
- source_word: לִפְנֵי אִישׁ
  english_pob_choice: before a man
  chosen_korean: 사람 앞에는
  alternatives_korean:
  - 한 사람 앞에는
  - 사람에게는
  - 사람 보기에
  lexicon: לפני
  rationale: לִפְנֵי는 단순한 인지적 판단보다 ‘~의 앞에서, ~에게 보이는 기준으로’라는 전면적 관점을 나타내므로, POB의 ‘before a man’을 따라 ‘사람 앞에는’으로 옮겼습니다.
- source_word: דַּרְכֵי מָוֶת
  english_pob_choice: the ways of death
  chosen_korean: 죽음의 길들
  alternatives_korean:
  - 죽음의 길
  - 사망의 길들
  - 죽음으로 가는 길들
  lexicon: דרך; מות
  rationale: 복수형 ‘길들’은 히브리어 다중 형태를 반영해 단일 추상보다 여러 경로의 총체를 드러내며, ‘죽음’은 מָוֶת의 직접적 의미를 유지합니다.
theological_decisions:
- issue: 사람의 판단과 종말의 대비
  chosen_reading: 겉으로 바르게 보이는 길과 실제로는 죽음에 이르는 길을 대조하는 지혜문으로 읽었습니다.
  alternative_readings:
  - 단순한 주관적 오판 경고
  - 도덕적 자율성 비판
  rationale: 문맥상 인간의 시야에 ‘바른 듯 보이는’ 길이 საბოლო적으로는 죽음으로 귀결된다는 지혜 전통의 경고를 분명히 드러내는 것이 핵심입니다.
  doctrine_reference: 잠언의 지혜와 인간 분별의 한계
