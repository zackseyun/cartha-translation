id: PRO.16.3
reference: Proverbs 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה מַעֲשֶׂ֑י/ךָ וְ֝/יִכֹּ֗נוּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Roll your works onto the LORD'; the idiom means to entrust or commit them to him.
    reason: lexical_alternative
  - marker: b
    text: Or 'your thoughts' or 'your purposes' for 'your plans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 일을 야훼께 맡기면, 너의 계획이 이루어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너의 일들을 그분 위로 굴리라’는 뜻이며, 관용적으로는 그 일들을 그분께 맡기거나 의탁하라는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너의 계획’은 문자적으로는 ‘너의 생각들’ 또는 ‘너의 의도들’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  english_pob_choice: Commit
  chosen_korean: 맡기면
  alternatives_korean:
  - 위탁하면
  - 굴려 올리면
  lexicon: HALOT
  rationale: 직역의 ‘굴리다’ 이미지는 원문의 관용을 드러내지만 한국어에서는 매우 어색하므로, 의미상 핵심인 ‘신뢰하여 맡김’을 살려 ‘맡기면’으로 옮겼습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문은 여호와의 고유명사 יְהוָה를 사용하므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고 여격 조사 ‘-께’를 붙였습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 너의 일
  alternatives_korean:
  - 너의 행위
  - 너의 일들
  lexicon: HALOT
  rationale: 여기서 מַעֲשֶׂיךָ는 도덕적 ‘행위’로만 좁히기보다 삶의 맡은 일과 행위 전반을 가리키므로, 잠언의 실제적 문맥에 맞는 ‘일’로 자연스럽게 옮겼습니다.
- source_word: מַחְשְׁבֹתֶיךָ
  english_pob_choice: your plans
  chosen_korean: 너의 계획
  alternatives_korean:
  - 너의 생각
  - 너의 의도
  lexicon: HALOT
  rationale: 이 단어는 ‘생각’도 가능하지만, 앞의 ‘일’과 평행을 이루는 실제적 의미에서는 ‘계획’이 가장 적절합니다.
theological_decisions:
- issue: ‘맡기다’와 ‘이루어지다’ 사이의 지혜문학적 약속
  chosen_reading: 이 구절은 인간의 일을 야훼께 신뢰로 맡기라는 권면과, 그 결과 계획이 굳게 서게 된다는 지혜문학적 약속을 말합니다.
  alternative_readings:
  - 하나님이 사람의 계획을 무조건 자동으로 성공시키신다는 읽기
  - 성공과 번영을 모든 경우에 보장하는 약속으로만 읽는 해석
  rationale: 히브리어는 권면과 결과를 함께 제시할 뿐, 성취의 범위를 과도하게 확대하지 않습니다. 번역도 그 긴장을 유지해 과장된 결정론이나 번영주의를 도입하지 않도록 했습니다.
  doctrine_reference: 지혜문학의 권면-결과 구조를 보존합니다.
