  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
  footnotes:
  - marker: a
    text: Or 'patient'; literally 'long of nostrils,' a Hebrew idiom for being slow to anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'his temper' or 'himself' for 'his spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 노하기를 더디 하는 사람이 용사보다 낫고, 자기 마음을 다스리는 사람이 성을 정복하는 사람보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노하기를 더디 하는’은 히브리어 관용구를 풀어 옮긴 표현입니다. 직역하면 ‘콧구멍이 긴’이라는 말로, 쉽게 분노하지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 마음’은 ‘자기 영’, ‘자기 기질’, 또는 ‘자기 자신’으로도 옮길 수 있습니다. 여기서 히브리어 ‘루아흐’는 내면의 충동과 성향을 포함하는 넓은 뜻을 지닙니다.
    reason: lexical_alternative
