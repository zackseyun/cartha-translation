  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
  footnotes:
  - marker: a
    text: Or 'patient'; literally 'long of nostrils,' a Hebrew idiom for being slow to anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'his temper' or 'himself' for 'his spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분노를 더디 하는 사람이 용사보다 낫고, 자기 영을 다스리는 사람이 성을 정복하는 사람보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분노를 더디 하는’은 히브리어 관용구 ‘긴 콧구멍’의 뜻을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 영’은 ‘자기 마음’이나 ‘자기 자신’으로도 옮길 수 있으나, כאן의 רוח는 내면의 충동과 성향을 포함하는 넓은 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - …보다 좋습니다
  - 더 낫습니다
  lexicon: HALOT
  rationale: 히브리어 지혜문학의 비교격을 자연스러운 현대 한국어 비교문으로 옮기되, 잠언 특유의 간결한 판단문 형식을 살렸습니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: one who is slow to anger
  chosen_korean: 분노를 더디 하는 사람
  alternatives_korean:
  - 인내하는 사람
  - 노하기를 더디 하는 사람
  - 성급히 화내지 않는 사람
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘long of nostrils’를 풀어, 분노의 속도를 늦추는 뜻을 드러내는 표현으로 옮겼습니다.
- source_word: בְּרוּחוֹ
  english_pob_choice: his spirit
  chosen_korean: 자기 영
  alternatives_korean:
  - 자기 마음
  - 자기 성품
  - 자기 자신
  lexicon: HALOT
  rationale: רוּחַ의 폭을 좁혀 ‘마음’으로만 한정하지 않고, 본문의 자기 통제 대조를 살리면서도 원어의 넓은 의미를 보존했습니다.
- source_word: מִלֹּכֵד עִיר
  english_pob_choice: than one who captures a city
  chosen_korean: 성을 정복하는 사람
  alternatives_korean:
  - 도시를 점령하는 사람
  - 성을 사로잡는 사람
  - 도시를 빼앗는 사람
  lexicon: HALOT
  rationale: לכד의 군사적 의미를 유지하면서, 현대 한국어에서 가장 자연스럽고 강한 대조가 되도록 ‘정복하다’로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 자기통제 대조
  chosen_reading: 외적 무력의 영웅성보다 내면의 절제와 자기 지배를 더 높은 가치로 제시하는 잠언으로 읽었습니다.
  alternative_readings:
  - 단순한 성격 수양 교훈
  - 정치적 통치 능력에 대한 비유
  rationale: 본문은 도시 정복이라는 군사적 성취와 내면 통치를 직접 대비하므로, 도덕훈을 넘어 지혜의 가치 전도를 분명히 드러내야 합니다.
  doctrine_reference: Translation philosophy §§3, 5
