- from: 분별은 그것을 가진 이에게 생명 샘이 되지만, 어리석은 자들의 징계는 어리석음입니다.[a][b]
  to: 분별은 그것을 가진 사람에게 생명의 샘[a]입니다. 그러나 어리석은 자들의 훈계[b]는 어리석음입니다.
  rationale: ‘생명의 샘’으로 한국어의 자연스러운 명사 결합을 회복하고, 대조를 한국어 문장 구조에 맞게 ‘그러나’로 명시했습니다. מוּסַר는 특정한 처벌 의미로 좁히지 않도록 ‘훈계’로 옮겼으며, 원문의 압축된 구성연계가 허용하는 관계의 폭은 각주에서 과도하게 단정하지 않고 설명했습니다. 각주 표지도 각각의 해당 어구에 붙였습니다.
