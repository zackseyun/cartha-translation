id: PRO.16.22
reference: Proverbs 16:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
  footnotes:
  - marker: a
    text: Or 'Understanding is a spring of life for the one who has it.'
    reason: lexical_alternative
  - marker: b
    text: '''Discipline'' may also be rendered ''instruction'' or ''correction''; the line likely means that what serves as correction for fools is nothing but folly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분별은 그것을 가진 사람에게 생명의 샘[a]입니다. 그러나 어리석은 자들의 훈계[b]는 어리석음입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘샘’은 מְקוֹר의 구체적 비유를 살린 번역이며, ‘근원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מוּסַר은 ‘징계’나 ‘교정’으로도 옮길 수 있습니다. 이 행은 어리석은 자들과 관련된 훈계가 결국 어리석음이라는 역설을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר חַיִּים
  english_pob_choice: a fountain of life
  chosen_korean: 생명 샘
  alternatives_korean:
  - 생명의 샘
  - 생명의 샘터
  - 생명 샘물
  lexicon: HALOT
  rationale: מְקוֹר은 ‘샘, 원천, 근원’의 구체적 이미지를 지니므로, 비유를 살리되 한국어로도 자연스러운 ‘생명 샘’으로 옮겼습니다.
- source_word: שֵׂכֶל
  english_pob_choice: understanding
  chosen_korean: 분별
  alternatives_korean:
  - 이해
  - 지혜
  - 통찰
  lexicon: HALOT
  rationale: 잠언 문맥에서 שֵׂכֶל은 단순한 지식보다 실제 삶을 분별하는 판단력을 가리키므로, 현대 한국어에서 기능이 가까운 ‘분별’을 택했습니다.
- source_word: בְּעָלָיו
  english_pob_choice: its possessor
  chosen_korean: 그것을 가진 이
  alternatives_korean:
  - 그것의 소유자
  - 그것을 소유한 사람
  - 그것의 소유자에게
  lexicon: HALOT
  rationale: 직역하면 ‘그것의 소유자’이지만, 한국어에서는 지혜의 성격상 어색한 소유 표현보다 ‘그것을 가진 이’가 관계를 더 자연스럽고 정확하게 드러냅니다.
- source_word: מוּסַר אֱוִלִים אִוֶּלֶת
  english_pob_choice: the discipline of fools is folly
  chosen_korean: 어리석은 자들의 징계는 어리석음
  alternatives_korean:
  - 어리석은 자들의 훈계는 어리석음
  - 어리석은 자들의 교정은 어리석음
  - 어리석은 자들을 위한 징계는 어리석음
  lexicon: HALOT
  rationale: מוּסַר은 ‘훈계/교정/징계’의 범위를 가지며, 여기서는 대비되는 결말인 אִוֶּלֶת과 함께 아이러니를 이루므로 ‘징계’가 긴장을 가장 잘 살립니다.
theological_decisions:
- issue: 잠언적 병행에서 첫 행의 주어를 어떻게 한국어로 처리할 것인가
  chosen_reading: 첫 행을 ‘분별은 … 생명 샘이 되지만’으로 옮겨, 문장 중심을 지혜의 실제 효용에 두었습니다.
  alternative_readings:
  - ‘분별은 생명의 샘이다’
  - ‘분별은 그것을 가진 이의 생명 샘이다’
  rationale: 히브리어는 ‘분별’과 ‘그것을 가진 이’의 관계를 압축적으로 제시하므로, 한국어에서는 이해 가능한 술어 구조로 풀어 주되 소유 관계는 유지했습니다.
  doctrine_reference: 잠언의 지혜 문학적 비유와 평행법
