  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
  footnotes:
  - marker: a
    text: Or 'directs his steps.' The Hebrew verb can mean 'makes firm,' 'establishes,' or in context 'directs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 마음은 자기 길을 계획하지만, 야훼께서 그의 걸음을 굳게 세우십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 걸음을 인도하십니다.’ 히브리어 동사는 ‘굳게 하다’, ‘견고하게 하다’, 문맥상 ‘인도하다’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב은 감정만이 아니라 생각과 의도의 중심을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘마음’이 원문의 내적 중심 이미지를 잘 살립니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 자기 길
  alternatives_korean:
  - 그의 길
  - 그의 행로
  - 그의 삶의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 살리면서도 한국어에서 문어적으로 자연스러운 표현으로 ‘자기 길’을 택했습니다.
- source_word: יָכִין
  english_pob_choice: establishes
  chosen_korean: 굳게 세우십니다
  alternatives_korean:
  - 세우십니다
  - 정하십니다
  - 견고하게 하십니다
  - 인도하십니다
  lexicon: HALOT
  rationale: 히필형 כון의 ‘견고하게 하다, 확립하다’라는 뜻을 살려, 단순한 안내보다 확정성과 안정성을 드러내는 ‘굳게 세우십니다’를 선택했습니다.
- source_word: צַעֲדוֹ
  english_pob_choice: his steps
  chosen_korean: 걸음
  alternatives_korean:
  - 발걸음
  - 걸음걸이
  - 발자취
  lexicon: HALOT
  rationale: 복수적 뉘앙스를 한국어에서는 자연스럽게 단수보다 집합적으로 포착하는 ‘걸음’으로 옮겨, 삶의 진행을 가리키는 비유를 유지했습니다.
theological_decisions:
- issue: 하나님의 주권과 인간의 계획의 긴장 보존
  chosen_reading: ‘계획하지만’과 ‘굳게 세우십니다’를 병치하여, 인간의 실제 계획과 야훼의 निर्ण정적 확립을 함께 드러냈습니다.
  alternative_readings:
  - 야훼께서 그의 걸음을 인도하십니다
  - 야훼께서 그의 걸음을 정하십니다
  rationale: 원문은 인간의 계획을 부정하지 않으면서도 야훼의 주도권을 분명히 합니다. ‘인도하십니다’는 방향 안내로 좁아질 수 있고, ‘정하십니다’는 결정론적으로 들릴 수 있어, ‘굳게 세우십니다’로 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
