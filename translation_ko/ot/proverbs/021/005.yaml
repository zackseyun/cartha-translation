  source_fidelity: 히브리어의 대구 구조와 인과 관계를 충실히 반영했습니다. מַחְשְׁבוֹת חָרוּץ는 ‘부지런한 사람의 계획’, לְמוֹתָר는 ‘풍성함으로 이어지고’, אָץ는 ‘서두르는 사람’, לְמַחְסוֹר는 ‘궁핍에 이릅니다’로 자연스럽고 정확하게 옮겼습니다. אַךְ의 강조는 양 절의 ‘반드시’로 재현되어, 제한의 뜻보다 확언적·강조적 용법이라는 원문 및 영어 감사 기록의 판단과 부합합니다.
