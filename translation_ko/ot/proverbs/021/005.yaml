source:
  edition: WLC
  text: מַחְשְׁב֣וֹת חָ֭רוּץ אַךְ לְ/מוֹתָ֑ר וְ/כָל אָ֝֗ץ אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
  footnotes:
  - marker: a
    text: Or 'lead to profit' for לְמוֹתָר; the Hebrew term can denote surplus, advantage, or gain.
    reason: lexical_alternative
  - marker: b
    text: Or 'everyone who rushes' for אָץ, emphasizing impulsive speed rather than a settled trait.
    reason: lexical_alternative
  - marker: c
    text: Or 'comes to poverty' for לְמַחְסוֹר; the Hebrew can refer broadly to lack, need, or impoverishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 부지런한 사람의 계획은 반드시 풍성함으로 이어지고, 서두르는 사람은 반드시 궁핍에 이릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍성함’은 לְמוֹתָר의 가능한 의미들(남음, 이익, 넉넉함) 가운데 하나를 본문 맥락에 따라 선택한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서두르는 사람’은 אָץ를 성향을 나타내는 현재적 표현으로 옮긴 것입니다. ‘급히 달려가는 사람’처럼 동작 중심으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘궁핍’은 לְמַחְסוֹר의 뜻(부족, 필요, 결핍, 빈곤)을 넓게 포괄하는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁב֣וֹת
  english_pob_choice: plans
  chosen_korean: 계획
  alternatives_korean:
  - 생각
  - 궁리
  lexicon: HALOT
  rationale: 잠언에서 이 명사는 단순한 내적 생각보다 의도된 설계나 계획을 가리키므로, 현대 한국어에서는 ‘계획’이 가장 자연스럽고 의미도 분명합니다.
- source_word: חָ֭רוּץ
  english_pob_choice: the diligent
  chosen_korean: 부지런한 사람
  alternatives_korean:
  - 근면한 사람
  - 열심히 일하는 사람
  lexicon: HALOT
  rationale: 형용사적 표지를 살려 성향을 나타내는 표현으로 옮겼습니다. ‘부지런한’은 잠언의 지혜 문맥에 어울리며 지나치게 교회식 어휘가 아닙니다.
- source_word: לְמוֹתָ֑ר
  english_pob_choice: lead to abundance
  chosen_korean: 풍성함으로 이어지고
  alternatives_korean:
  - 이익으로 이어지고
  - 넉넉함으로 이어지고
  - 많은 유익으로 이어지고
  lexicon: HALOT
  rationale: מוֹתָר는 ‘남음, 풍성함, 이익’을 뜻할 수 있습니다. 대조되는 ‘궁핍’과의 평행을 살리기 위해 ‘풍성함’이 가장 넓고도 본문에 충실합니다.
- source_word: לְ/מַחְסוֹר
  english_pob_choice: comes to want
  chosen_korean: 궁핍에 이릅니다
  alternatives_korean:
  - 부족에 이릅니다
  - 결핍에 이릅니다
  - 가난에 이릅니다
  lexicon: HALOT
  rationale: מַחְסוֹר는 부족, 필요, 빈곤을 아우르므로, 결과 상태를 자연스럽게 드러내는 ‘궁핍’이 대구상 ‘풍성함’과 가장 잘 짝을 이룹니다.
theological_decisions:
- issue: 잠언의 확언적 어조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘반드시’로 두 번 반복해 결과의 확실성과 경구적 단언을 드러냈습니다.
  alternative_readings:
  - ‘확실히’
  - ‘틀림없이’
  - 그냥 서술형으로만 옮김
  rationale: 히브리어 אַךְ의 강조 기능을 반영하여, 지혜 문학 특유의 일반적 진리를 약화시키지 않도록 했습니다.
  doctrine_reference: wisdom literature / proverbial certainty
