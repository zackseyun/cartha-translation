  source_fidelity: 개정이 필요합니다. 마소라 본문의 마지막 표현 מְבַקְשֵׁי מָוֶת는 문자적으로 ‘죽음을 찾는 자들/죽음의 추구자들’이며, 초안의 ‘죽음을 찾는 자들의 덫’은 본문에 없는 ‘덫’을 본문으로 끌어들입니다. 이는 고대 역본의 영향을 받은 해석적 독법으로는 가능하지만 WLC 본문을 우선하는 본문 번역으로는 부적절합니다. 또한 הֶבֶל נִדָּף의 바람에 흩어지는 숨결/수증기 이미지를 ‘덧없는 안개’보다 더 직접적으로 드러낼 필요가 있습니다.
  naturalness: ‘거짓된 혀’는 현대 한국어에서 다소 어색합니다. ‘거짓을 말하는 혀’는 원문의 혀 비유를 보존하면서 자연스럽습니다. 마지막 난구는 한국어 완결문으로 만들기 위해 행위자를 보충하되, 본문의 압축성과 해석상 불확실성은 각주에서 밝혔습니다.
  terminology: ‘재물’, ‘죽음’, ‘입김’은 지혜문학의 간결한 문체와 원문의 이미지를 잘 반영합니다. ‘입김’은 הֶבֶל의 숨결·증기 이미지를 살리며, ‘바람에 흩어지는’은 נִדָּף의 수동적 분산 이미지를 반영합니다.
