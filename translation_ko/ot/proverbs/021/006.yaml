id: PRO.21.6
reference: Proverbs 21:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
  footnotes:
  - marker: a
    text: Or 'with a false tongue.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'vapor driven away'; that is, something insubstantial and quickly gone.
    reason: lexical_alternative
  - marker: c
    text: The final Hebrew phrase is difficult. It may also mean 'those who get such wealth seek death,' or, in some ancient-version-influenced renderings, 'it is a snare of death.'
    reason: alternative_reading
translation:
  language: ko
  text: 거짓된 혀로 재물을 얻는 것은 덧없는 안개이며[a][b], 죽음을 찾는 자들의 덫입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘거짓의 혀’를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֶבֶל נִדָּף는 ‘흩날려 사라지는 덧없음’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 히브리어 구문은 난해하여, ‘죽음을 찾는 자들’ 또는 ‘죽음을 구하는 자들’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  english_pob_choice: The getting of treasures
  chosen_korean: 재물을 얻는 것
  alternatives_korean:
  - 보화를 모으는 것
  - 재산을 얻는 일
  lexicon: HALOT
  rationale: פֹּעַל은 단순한 소유보다 ‘얻어내는 행위/과정’에 가깝고, אֹצָרוֹת는 이 문맥에서 축적된 부를 가리키므로, 현대 한국어에서는 ‘재물을 얻는 것’이 가장 자연스럽고 원뜻도 잘 살립니다.
- source_word: בִּלְשׁוֹן שָׁקֶר
  english_pob_choice: by a lying tongue
  chosen_korean: 거짓된 혀로
  alternatives_korean:
  - 거짓말하는 혀로
  - 속이는 혀로
  lexicon: HALOT
  rationale: 직역하면 ‘거짓의 혀로/와 함께’이므로, 행위의 수단을 드러내는 ‘거짓된 혀로’가 원문의 비유를 유지하면서도 한국어 문장에 자연스럽습니다.
- source_word: הֶבֶל נִדָּף
  english_pob_choice: a fleeting vapor
  chosen_korean: 덧없는 안개
  alternatives_korean:
  - 날아가는 허무
  - 바람에 날리는 수증기
  lexicon: HALOT
  rationale: הֶבֶל과 נִדָּף는 함께 ‘흩날리며 사라지는 덧없음’을 그리므로, 전통어 ‘허무’보다 현대 독자가 즉시 이해할 수 있는 ‘덧없는 안개’로 옮겨 이미지와 의미를 함께 살렸습니다.
- source_word: מְבַקְשֵׁי מָוֶת
  english_pob_choice: those who seek death
  chosen_korean: 죽음을 찾는 자들
  alternatives_korean:
  - 죽음을 구하는 자들
  - 죽음을 추구하는 자들
  lexicon: HALOT
  rationale: 마소라 본문은 마지막 구절을 압축적으로 제시하므로, ‘seek death’의 직접적 대응을 유지해 문맥상 위험한 자들을 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 난해한 구문(מְבַקְשֵׁי מָוֶת) 처리
  chosen_reading: 문맥상 ‘재물을 얻는 행위’가 ‘죽음을 찾는 자들’의 덫이 된다는 쪽으로 읽어, ‘죽음을 찾는 자들의 덫’으로 옮겼습니다.
  alternative_readings:
  - ‘그런 재물을 얻는 자들은 죽음을 찾는다’
  - ‘죽음의 덫’(고대 역본을 반영한 완화/재구성)
  rationale: 본문은 문법적으로 압축되어 있어 해석이 갈리지만, 원문 우선 원칙에 따라 마소라 본문의 어순과 이미지를 최대한 유지했습니다. 동시에 한국어에서는 의미 관계가 즉시 드러나도록 ‘덫’ 구문으로 자연화했습니다.
  doctrine_reference: Translation philosophy §1, §3
