revisions:
- from: 거짓된 혀로 재물을 얻는 것은 덧없는 안개이며[a][b], 죽음을 찾는 자들의 덫입니다[c].
  to: 거짓을 말하는 혀로 재물을 얻는 자들은 바람에 흩어지는 입김과 같고[a][b], 죽음을 찾는 자들입니다[c].
  rationale: WLC를 우선하여, 본문에 없는 ‘덫’을 제거하고 마지막 명사구를 재물을 부정하게 얻는 이들에 대한 압축적 술어로 옮겼습니다. 이 해석적 연결은 한국어 문장의 완결성을 위해 최소한으로 보충했으며, 난해한 히브리어 구문의 다른 분석과 고대 역본 계열의 ‘덫’ 독법은 각주에 보존했습니다. 어휘는 원문의 혀와 흩어지는 숨결 이미지를 더 자연스러운 현대 표준 한국어로 반영하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:22Z'
