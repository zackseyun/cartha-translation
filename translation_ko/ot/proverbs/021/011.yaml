id: PRO.21.11
reference: Proverbs 21:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
  footnotes:
  - marker: a
    text: Or 'when a wise person is instructed, he or she gains knowledge.' The Hebrew reads 'a wise man,' using a masculine singular form as a representative type in proverbial style.
    reason: lexical_alternative
  - marker: b
    text: Or 'By the punishment of a scoffer, the simple become wise.' The Hebrew construction can be rendered more formally with 'by/in the punishing of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 자가 벌을 받을 때에 단순한 자는 지혜롭게 되고[a], 지혜로운 사람이 가르침을 받을 때에 그는 지식을 얻습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조롱하는 자를 벌함으로 단순한 자는 지혜롭게 됩니다.’ 히브리어의 בְּ + 부정사구는 ‘~할 때’ 또는 ‘~함으로’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜로운 사람을 가르칠 때에 그는 지식을 얻습니다.’ 히브리어는 남성 단수 형태로 ‘지혜로운 사람’을 대표형으로 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְנָשׁ
  english_pob_choice: When a scoffer is punished
  chosen_korean: 조롱하는 자가 벌을 받을 때에
  alternatives_korean:
  - 비로소 조롱하는 자를 벌할 때에
  - 조롱하는 자의 벌을 통해
  lexicon: HALOT
  rationale: בַּ + ענשׁ의 상황·계기 용법을 한국어의 시간절로 자연스럽게 살려, 징계의 순간에 주는 교훈을 드러냈습니다.
- source_word: לֵץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조소하는 자
  lexicon: HALOT
  rationale: לץ는 단순한 농담꾼보다 훈계를 거부하고 경멸적으로 비웃는 인물을 가리키므로, 그 태도를 드러내는 ‘조롱하는 자’를 택했습니다.
- source_word: פֶּתִי
  english_pob_choice: the simple
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 순진한 자
  - 미숙한 자
  - 단순한 자
  lexicon: HALOT
  rationale: 잠언의 פתי는 도덕적·지적 미성숙을 지닌 ‘단순한 자’ 범주이지만, 한국어에서는 문맥상 ‘어리석은 자’가 경구의 대비를 가장 분명하게 전달합니다.
- source_word: וּבְהַשְׂכִּיל לְחָכָם
  english_pob_choice: and when a wise man is instructed
  chosen_korean: 지혜로운 사람이 깨우침을 받을 때에
  alternatives_korean:
  - 지혜로운 사람을 깨우칠 때에
  - 지혜로운 사람에게 가르침이 있을 때에
  lexicon: HALOT
  rationale: הַשְׂכִּיל의 사역적 뉘앙스를 ‘깨우침을 받다’로 옮겨, 단순한 정보 전달이 아니라 분별을 더하는 교정적 가르침을 살렸습니다.
- source_word: יִקַּח דָּעַת
  english_pob_choice: he gains knowledge
  chosen_korean: 그는 지식을 얻습니다
  alternatives_korean:
  - 그는 지식을 취합니다
  - 그는 지식을 얻게 됩니다
  lexicon: HALOT
  rationale: לקח + דַּעַת의 관용적 의미를 현대 한국어의 ‘지식을 얻다’로 자연스럽게 옮기되, 잠언의 획득 이미지도 유지했습니다.
theological_decisions:
- issue: 잠언의 대표적 남성 단수 표현 처리
  chosen_reading: ‘지혜로운 사람’으로 옮기되, 한국어에서는 성별 표지를 드러내지 않는 일반적 대표형으로 처리했습니다.
  alternative_readings:
  - ‘지혜로운 남자’
  - ‘지혜로운 사람/사람이’
  rationale: 히브리어는 남성 단수 형태를 쓰지만 잠언의 전형적 대표형으로 기능하므로, 한국어에서는 의미를 훼손하지 않으면서도 오늘의 독자가 읽기 자연스럽도록 중립적 대표형을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
