id: PRO.21.20
reference: Proverbs 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
  footnotes:
  - marker: a
    text: Or 'a fool devours it' or 'consumes it.' The Hebrew verb is literally 'swallows it up,' a vivid image for reckless use of resources.
    reason: lexical_alternative
translation:
  language: ko
  text: 귀한 보물과 기름은 지혜로운 사람의 집에 있으나, 어리석은 사람은 그것을 삼켜 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘그것을 삼키다’입니다. ‘삼켜 버립니다’는 낭비적 소비라는 생생한 이미지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  english_pob_choice: Precious treasure
  chosen_korean: 귀한 보물
  alternatives_korean:
  - 값진 보물
  - 귀중한 보물
  - 소중한 보물
  lexicon: HALOT
  rationale: אוֹצָר는 저장된 부나 귀중품을 가리키므로 ‘보물’이 자연스럽고, נֶחְמָד의 가치감을 ‘귀한’으로 간결하게 살렸습니다.
- source_word: וָשֶׁמֶן
  english_pob_choice: and oil
  chosen_korean: 기름
  alternatives_korean:
  - 올리브기름
  - 기름과
  - 기름 한
  lexicon: HALOT
  rationale: 원문은 특정하지 않고 단지 שֶׁמֶן을 말하므로, 문화적 배경을 해치지 않으면서 일반 명사 ‘기름’으로 옮겼습니다.
- source_word: בִּנְוֵה חָכָם
  english_pob_choice: in the dwelling of a wise man
  chosen_korean: 지혜로운 사람의 집에
  alternatives_korean:
  - 지혜로운 사람의 거처에
  - 현명한 사람의 집에
  lexicon: HALOT
  rationale: נוה는 거처/주거를 뜻하지만 잠언의 평행구에서는 일상적인 ‘집’이 가장 자연스럽고, חָכָם은 형용사적 용법을 살려 ‘지혜로운 사람’으로 옮겼습니다.
- source_word: וּכְסִיל אָדָם
  english_pob_choice: but a foolish man
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 남자
  - 우둔한 사람
  - 바보
  lexicon: HALOT
  rationale: כְסִיל은 잠언의 전형적 ‘어리석은 자’이지만, 한국어에서는 ‘사람’으로 옮겨 속담적 일반성을 유지하되 평가 의미는 ‘어리석은’으로 분명히 했습니다.
- source_word: יְבַלְּעֶנּוּ
  english_pob_choice: swallows it up
  chosen_korean: 삼켜 버립니다
  alternatives_korean:
  - 먹어 치웁니다
  - 소모해 버립니다
  - 삼켜 버려요
  lexicon: HALOT
  rationale: בלע의 핵심 이미지는 ‘삼키다’이며, 문맥상 낭비적 소비를 나타내므로 ‘삼켜 버립니다’로 원문의 생생한 은유를 보존했습니다.
theological_decisions:
- issue: 원문의 남성 단수 지혜/어리석음 유형 표현
  chosen_reading: ‘지혜로운 사람’과 ‘어리석은 사람’으로 일반적 인간 유형을 살리되, 한국어에서는 성별 표지를 강하게 드러내지 않았습니다.
  alternative_readings:
  - 지혜로운 남자 ... 어리석은 남자
  - 지혜로운 자 ... 어리석은 자
  rationale: 히브리어는 남성 단수의 대표적/일반적 표현이지만, 한국어 잠언 문체에서는 성별보다 유형 대비가 더 직접적으로 전달되므로 본문 의미를 해치지 않는 범위에서 자연스럽게 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
