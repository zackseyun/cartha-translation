base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
  footnotes:
  - marker: a
    text: Or “guards himself from distresses”; Hebrew “guards his nephesh from troubles.”
    reason: lexical_alternative
translation:
  language: ko
  text: 입과 혀를 지키는 사람은 고난에서 자기 생명을 지킵니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고난에서 자신을 지킨다”; 히브리어는 “자기 생명을 고난에서 지킨다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  english_pob_choice: guards
  chosen_korean: 지키는
  alternatives_korean:
  - 감시하는
  - 간수하는
  - 보호하는
  lexicon: HALOT
  rationale: Qal 분사로서 반복되는 동작과 보호의 의미를 살려 ‘지키는’으로 옮겼습니다. 절의 앞뒤에 같은 동사를 반복해 원문의 대응을 보존했습니다.
- source_word: פִּיו / לְשׁוֹנוֹ
  english_pob_choice: his mouth / his tongue
  chosen_korean: 입과 혀
  alternatives_korean:
  - 그의 입과 혀
  - 입술과 혀
  - 말과 혀
  lexicon: HALOT
  rationale: 직역에 가까운 ‘입’과 ‘혀’는 지혜문학의 ‘말’ 이미지보다 원문의 신체 비유를 더 분명히 드러냅니다. 한국어에서는 소유격을 반복하지 않아도 뜻이 자연스럽게 전달됩니다.
- source_word: מִצָּרוֹת
  english_pob_choice: from troubles
  chosen_korean: 고난에서
  alternatives_korean:
  - 환난에서
  - 재난에서
  - 곤경에서
  lexicon: HALOT
  rationale: 복수형 צָרוֹת은 일반적인 어려움과 압박을 가리키므로, 지나치게 강한 ‘재난’보다 폭넓고 자연스러운 ‘고난’이 적절합니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 자기 생명
  alternatives_korean:
  - 그의 생명
  - 자기 목숨
  - 자기 영혼
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ은 형이상학적 ‘영혼’보다 사람의 생명/자기 존재를 가리키는 말이므로, POB의 영어 결정을 따라 ‘생명’으로 옮겼습니다. ‘자기’는 문맥상 반사적 소유를 자연스럽게 살립니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: ‘생명’으로 번역해 생활 지혜의 실천적 결과를 드러냅니다.
  alternative_readings:
  - 영혼
  - 자기 자신
  rationale: 이 절은 혀를 절제함으로써 해를 피하는 지혜를 말하므로, ‘영혼’처럼 교리적 함의를 강하게 띠는 표현보다 ‘생명’이 문맥을 더 정확하게 반영합니다.
  doctrine_reference: 인간론 일반
- issue: 원문의 반복 구조
  chosen_reading: 동사 ‘지키다’를 두 번 반복했습니다.
  alternative_readings:
  - 첫째는 ‘지키다’, 둘째는 ‘보전하다’
  rationale: 히브리어의 반복은 수사적 강조 역할을 하므로, 한국어에서도 같은 동사를 반복해 원문의 긴장과 대구를 유지했습니다.
  doctrine_reference: 시문학 번역 원칙
