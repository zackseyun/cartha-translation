    issue: ‘은혜’는 종교적·신학적 연상이 강합니다.
    rationale: יֻחַן은 여기서 이웃에게 보이는 친절과 호의를 뜻하므로 ‘호의’를 쓰면 문맥상 관계적 의미가 더 명확합니다.
