  - 악을 탐합니다
  lexicon: HALOT
  rationale: 지혜문학의 도덕적 긴장을 살리기 위해 단순한 ‘원하다’보다 강한 욕망의 뉘앙스를 지닌 ‘욕망하다’를 택했습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그의 눈에
  alternatives_korean:
