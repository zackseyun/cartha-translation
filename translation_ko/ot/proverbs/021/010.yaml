    issue: 각주 a의 표지가 ‘악을 욕망합니다’ 뒤에 붙어 있으나, 각주 내용은 רֵעֵהוּ(‘이웃’)의 대안 번역에 관한 것입니다.
    rationale: 각주 표지는 해당 어휘인 ‘이웃’에 붙어야 독자가 대안 번역의 적용 대상을 정확히 알 수 있습니다.
  - severity: low
    issue: ‘영혼’은 נֶפֶשׁ의 문맥상 의미보다 좁고 한국어에서 영혼론적 함의를 강하게 유발할 수 있습니다.
    rationale: 이 구절에서 נֶפֶשׁ는 악인이 품는 내적 욕구의 주체를 나타내므로 ‘마음’이 의미와 현대적 자연스러움을 더 잘 살립니다.
