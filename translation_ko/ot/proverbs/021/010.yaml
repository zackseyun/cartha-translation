  - 악한 사람
  - 악한 자들
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 살려 대표적 단수를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אִוְּתָה רָע
  english_pob_choice: desires evil
  chosen_korean: 악을 욕망합니다
  alternatives_korean:
