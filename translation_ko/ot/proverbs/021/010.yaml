id: PRO.21.10
reference: Proverbs 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
  footnotes:
  - marker: a
    text: Or 'his friend' or 'his companion' for 'his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'finds no favor in his eyes,' a Hebrew idiom for receiving no kindness or approval from him.
    reason: cultural_note
translation:
  language: ko
  text: 악인의 마음은 악을 원합니다. 그의 이웃은 그의 눈에 호의를 입지 못합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친구’나 ‘그의 동료’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 눈에 호의를 입지 못한다’는 뜻입니다. 이는 악인이 이웃에게 호의나 인정을 베풀지 않는다는 히브리어 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 사람
  - 자아
  - 속사람
  lexicon: HALOT
  rationale: נֶפֶשׁ의 내적 욕구 중심을 살리되, 한국어에서 속담적·인간학적 무게를 유지하는 표현으로 ‘영혼’을 택했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악한 자
  alternatives_korean:
