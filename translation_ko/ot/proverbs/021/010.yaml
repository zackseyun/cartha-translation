id: PRO.21.10
reference: Proverbs 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
  footnotes:
  - marker: a
    text: Or 'his friend' or 'his companion' for 'his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'finds no favor in his eyes,' a Hebrew idiom for receiving no kindness or approval from him.
    reason: cultural_note
translation:
  language: ko
  text: 악한 자의 영혼은 악을 욕망합니다[a]; 그의 이웃은 그의 눈에 은혜를 입지 못합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친구’나 ‘그의 동반자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 눈에 은혜를 얻지 못한다’는 뜻으로, 악인이 이웃에게 호의나 인정도 베풀지 않는다는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 사람
  - 자아
  - 속사람
  lexicon: HALOT
  rationale: נֶפֶשׁ의 내적 욕구 중심을 살리되, 한국어에서 속담적·인간학적 무게를 유지하는 표현으로 ‘영혼’을 택했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악한 자
  alternatives_korean:
  - 악인
  - 악한 사람
  - 악한 자들
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 살려 대표적 단수를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אִוְּתָה רָע
  english_pob_choice: desires evil
  chosen_korean: 악을 욕망합니다
  alternatives_korean:
  - 악을 원합니다
  - 악을 갈망합니다
  - 악을 탐합니다
  lexicon: HALOT
  rationale: 지혜문학의 도덕적 긴장을 살리기 위해 단순한 ‘원하다’보다 강한 욕망의 뉘앙스를 지닌 ‘욕망하다’를 택했습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그의 눈에
  alternatives_korean:
  - 그의 시야에서
  - 그에게
  - 그의 관점에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역적으로 보존해 평가와 시선을 뜻하는 생생한 이미지를 유지했습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 그의 이웃
  alternatives_korean:
  - 그의 친구
  - 그의 동료
  - 그의 동반자
  lexicon: HALOT
  rationale: 윤리적·사회적 관계를 가리키는 문맥에 가장 잘 맞는 기본 번역으로 ‘이웃’을 선택했습니다.
theological_decisions:
- issue: יֻחַן의 수동 의미를 어떻게 한국어로 드러낼지
  chosen_reading: ‘은혜를 입지 못합니다’로 옮겨, 호팔형이 나타내는 ‘호의/은총을 받지 못함’을 반영했습니다.
  alternative_readings:
  - ‘호의를 받지 못합니다’
  - ‘은총을 받지 못합니다’
  - ‘그에게서 은혜를 얻지 못합니다’
  rationale: 이 구절의 핵심은 악인이 이웃에게 호의와 선의를 베풀지 않는다는 점이므로, 수동적 거절의 의미를 살리면서도 자연스러운 합쇼체 문장으로 정리했습니다.
  doctrine_reference: 잠언의 인과적 지혜 진술; חנן의 수동형 의미
- issue: ‘눈에’라는 관용구의 유지 여부
  chosen_reading: 관용구를 유지해, 악인의 평가 기준이 자기 시선과 판단에 있음을 드러냈습니다.
  alternative_readings:
  - ‘그가 보기에’
  - ‘그의 판단으로는’
  rationale: 직역이 한국어 관용과 충돌하지 않으면서 원문의 시각적 은유를 보존하므로, 도덕적 판단의 편향성을 더 분명히 보여 줍니다.
  doctrine_reference: 히브리 시문학의 관용구 보존 원칙
