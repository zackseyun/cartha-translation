id: PRO.21.7
reference: Proverbs 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֹׁד רְשָׁעִ֥ים יְגוֹרֵ֑/ם כִּ֥י מֵ֝אֲנ֗וּ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/007.yaml
  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
  footnotes:
  - marker: a
    text: Or "The plunder of the wicked will sweep them away." The Hebrew of the verb is difficult, and interpreters differ on whether the emphasis is on violence, plunder, terror, or being carried off by one's own wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 폭력은 그들을 끌어가고, 그들은 공의를 행하기를 거부하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악인의 약탈이 그들을 휩쓸어 갈 것입니다.” 히브리어 동사는 뜻이 어렵고, 해석자들은 폭력, 약탈, 공포, 혹은 자기 악행에 의해 끌려감 가운데 서로 다르게 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 약탈
  - 파괴
  - 강탈
  lexicon: HALOT
  rationale: שֹׁד는 단순한 절도보다 폭력적 파괴와 약탈을 함께 가리킬 수 있으므로, 문맥상 악인의 파괴적 행위를 포괄하는 ‘폭력’이 가장 자연스럽습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 복수형 명사/형용사의 상투적 의미를 한국어 성경 문체로 간결하게 살리기 위해 ‘악인’으로 옮겼습니다.
- source_word: יְגוֹרֵם
  english_pob_choice: will drag them away
  chosen_korean: 그들을 끌어가고
  alternatives_korean:
  - 그들을 휩쓸어 가고
  - 그들을 끌고 가고
  - 그들을 데려가고
  lexicon: HALOT
  rationale: 동사의 정확한 형태는 어렵지만, 문맥상 악인의 폭력이 그들 자신을 파멸 쪽으로 강제로 몰고 간다는 결과를 나타내므로 ‘끌어가다’가 이미지와 의미를 함께 살립니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 옳은 일
  - 공정
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט는 법정 판결보다 올바른 행위 자체를 뜻하므로, 잠언 문맥에 맞는 윤리적·법적 무게를 함께 담는 ‘공의’가 적절합니다.
theological_decisions:
- issue: 악인의 폭력이 그들을 '끌어가는' 인과 구조
  chosen_reading: 악인의 폭력이 결국 그들 자신을 파멸로 이끄는 자기파괴적 결과로 이해하고 본문에 반영했습니다.
  alternative_readings:
  - 악인의 약탈이 그들을 휩쓸어 간다
  - 악인이 다른 이들에게 행한 폭력이 되돌아온다
  rationale: 히브리어 동사의 난해함 때문에 결과의 방향을 명시해야 했습니다. 영어 POB가 'drag them away'를 택한 흐름을 따라, 문맥상 보복이라기보다 악행의 자기귀결을 드러내도록 처리했습니다.
  doctrine_reference: 잠언의 보응/인과 원리
- issue: מִשְׁפָּט의 번역
  chosen_reading: ‘공의’로 번역해 단순한 법적 판결이 아니라 의롭고 바른 행위를 뜻하게 했습니다.
  alternative_readings:
  - 정의
  - 재판
  - 판결
  rationale: 본문은 악인들이 바른 삶 자체를 거부한다는 점을 말하므로, 규범적 실천을 포괄하는 표현이 필요했습니다.
  doctrine_reference: 구약의 משפט 용례
