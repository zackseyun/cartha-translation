  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
  footnotes:
  - marker: a
    text: Or 'the weak' or 'the needy.' The Hebrew דָּל can denote a person who is poor, weak, or socially vulnerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람의 부르짖음에 귀를 막는 자는 자신도 부르짖을 것이나 응답을 받지 못합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּל은 ‘가난한 사람’뿐 아니라 ‘약한 사람’이나 ‘사회적으로 취약한 사람’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  english_pob_choice: shuts
  chosen_korean: 귀를 막는
  alternatives_korean:
  - 귀를 닫는
  - 귀를 막아버리는
  lexicon: HALOT
  rationale: 분사형의 적극적·의도적 거절을 살리면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: מִזַּעֲקַת
  english_pob_choice: to the cry of
  chosen_korean: 부르짖음에
  alternatives_korean:
  - 부르짖음으로부터
  - 부르짖는 소리에
  lexicon: HALOT
  rationale: ‘귀를 막다’와 결합할 때 한국어에서는 대상을 받는 처격으로 자연스럽게 나타내는 것이 원문의 거절 대상 의미를 잘 보존합니다.
- source_word: דָּל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 약한 자
  - 궁핍한 사람
  lexicon: HALOT
  rationale: דָּל은 가난함, 약함, 사회적 취약성을 모두 가질 수 있으나, 문맥상 가장 분명한 기본값인 ‘가난한 사람’으로 옮겼습니다.
- source_word: יִקְרָא
  english_pob_choice: will call out
  chosen_korean: 부르짖을 것이나
  alternatives_korean:
  - 외칠 것이나
  - 부를 것이나
  lexicon: HALOT
  rationale: 앞선 ‘부르짖음’과 대응시키되, 절박한 호소라는 뉘앙스를 살리기 위해 ‘부르짖다’를 택했습니다.
theological_decisions:
- issue: 응답하지 않는 주체의 암시
  chosen_reading: 본문의 수동형을 살려 ‘응답을 받지 못합니다’로 두고, 응답하지 않는 주체는 본문에서 명시하지 않았습니다.
  alternative_readings:
  - 하나님이 응답하지 않으신다는 뜻을 분명히 드러내기
  - 사람들이 응답하지 않는 뜻으로 제한하기
  rationale: 히브리어는 행위 주체를 밝히지 않으므로, 잠언의 보응 원리를 암시하더라도 본문이 말하지 않은 부분은 열어 두는 편이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
