base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/009.yaml
  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
  footnotes:
  - marker: a
    text: Or 'in a house shared with others'; the Hebrew phrase is literally 'and a house of company/association.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지붕 한쪽 구석에 사는 것이, 다투는 아내와 한 집에서 사는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘동반/교제의 집’에 가깝습니다. 따라서 ‘한 집에서’는 공동 거주라는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 낫습니다
  lexicon: HALOT
  rationale: 잠언의 비교 격언 구조를 자연스러운 현대 한국어로 옮기기 위해 형용사적 비교를 살린 ‘낫습니다’를 선택했습니다.
- source_word: לָשֶׁבֶת
  english_pob_choice: to live
  chosen_korean: 사는 것이
  alternatives_korean:
  - 거하는 것이
  - 앉아 있는 것이
  lexicon: HALOT
  rationale: 직역하면 ‘앉다’이지만, 거주 상황에서는 ‘살다/거하다’의 뜻이므로 문맥에 맞게 ‘사는 것’으로 옮겼습니다.
- source_word: עַל פִּנַּת גָּג
  english_pob_choice: on a corner of the roof
  chosen_korean: 지붕 한쪽 구석에
  alternatives_korean:
  - 지붕의 모퉁이에
  - 옥상 한구석에
  lexicon: HALOT
  rationale: פִּנָּה의 ‘모퉁이/구석’과 גָּג의 ‘지붕/옥상’ 이미지를 현대 독자가 바로 이해하도록 ‘지붕 한쪽 구석’으로 풀었습니다.
- source_word: מִדְיָנִים
  english_pob_choice: quarrelsome
  chosen_korean: 다투는
  alternatives_korean:
  - 말다툼하는
  - 분쟁을 일으키는
  lexicon: HALOT
  rationale: 명사 ‘다툼들, 분쟁들’에서 나온 형용적 성격을 자연스럽게 드러내는 말로 ‘다투는’을 택했습니다.
- source_word: וּבֵית חָבֶר
  english_pob_choice: in a shared house
  chosen_korean: 한 집에서
  alternatives_korean:
  - 공동의 집에서
  - 남들과 함께 사는 집에서
  lexicon: HALOT
  rationale: 직역상 ‘동반/교제의 집’에 해당하는 표현으로, 영어 POB가 밝힌 공동 거주의 의미를 반영해 ‘한 집에서’로 간결하게 살렸습니다.
