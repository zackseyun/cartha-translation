base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
  footnotes:
  - marker: a
    text: Or 'A wise man goes up to the city of warriors and brings down the strength of its confidence.' The Hebrew allows a more literal rendering with 'strength' rather than 'stronghold,' but the context favors a concrete defensive sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 용사들의 성으로 올라가 그들이 의지하는 견고한 요새를 무너뜨립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성’은 כאן의 עיר가 지닌 방어적·군사적 함의를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
