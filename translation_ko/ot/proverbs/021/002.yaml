translation:
  language: ko
  text: 각 사람의 길은 자기 눈에는 바르지만, 야훼께서는 마음을 달아보십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל דֶּרֶךְ אִישׁ
  english_pob_choice: Every man's way
  chosen_korean: 사람의 모든 길
  alternatives_korean:
  - 각 사람의 길
  - 모든 사람의 길
  lexicon: HALOT
  rationale: 잠언의 보편적 진술로 읽히므로, 대표적 남성 단수의 관용을 살리되 한국어에서는 성중립적으로 자연스러운 ‘사람의 모든 길’로 옮겼습니다.
- source_word: יָשָׁר
  english_pob_choice: right
  chosen_korean: 바르지만
  alternatives_korean:
  - 옳지만
  - 올곧지만
  lexicon: HALOT
  rationale: 여기서는 객관적 심판보다 자기판단상 ‘옳다/바르다’는 평가를 가리키므로, 문맥상 자연스러운 ‘바르다’를 택했습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 자기 눈에는
  alternatives_korean:
  - 자기 생각에는
  - 자기 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 자기평가의 기준점을 드러내되, 한국어에서도 비유가 살아 있도록 ‘눈’ 이미지를 유지했습니다.
- source_word: וְתֹכֵן
  english_pob_choice: weighs
  chosen_korean: 달아보십니다
  alternatives_korean:
  - 저울질하십니다
  - 살피십니다
  - 평가하십니다
  lexicon: HALOT
  rationale: 저울의 이미지가 내포된 ‘달다’는 표현을 살려 인간의 자기판단과 하나님의 판정을 대비시켰습니다.
- source_word: לִבּוֹת
  english_pob_choice: hearts
  chosen_korean: 마음들을
  alternatives_korean:
  - 마음을
  - 속마음을
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 사고와 동기의 중심을 가리키므로, 복수형을 반영해 ‘마음들을’로 옮겨 내면 전체에 대한 심판을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기식 표기 יְהוָה를 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨, 제목어가 아니라 개인적 언약 이름임을 보존했습니다.
theological_decisions:
- issue: 하나님이 사람의 내면을 판정하신다는 대조 구조
  chosen_reading: 인간은 자기 길을 옳다고 여기지만, 야훼께서는 내면의 실체를 저울로 달아 판정하십니다.
  alternative_readings:
  - 단순히 행동의 옳고 그름을 평가하신다
  - 마음을 살피신다
  rationale: ‘달아보십니다’는 단순 관찰보다 적극적인 판정과 검증의 이미지를 유지하여, 잠언의 지혜 대조를 더 분명히 드러냅니다.
  doctrine_reference: 잠언의 지혜 문맥에서 인간 자기기만과 하나님의 전지하심
