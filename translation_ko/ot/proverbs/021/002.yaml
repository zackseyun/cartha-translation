base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
  footnotes:
  - marker: a
    text: 'Hebrew: "Yahweh." The main text follows the project’s default rendering of the divine name as "the LORD."'
