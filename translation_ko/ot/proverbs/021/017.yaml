reference: Proverbs 21:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
  footnotes:
  - marker: a
    text: Or 'who loves joy' or 'who loves merrymaking.' The Hebrew term can denote joy or festivity, but here likely refers to a pleasure-seeking lifestyle.
    reason: lexical_alternative
  - marker: b
    text: '''Oil'' likely refers to olive oil and may imply luxury or costly ointment, not merely a basic food item.'
    reason: cultural_note
translation:
  language: ko
  text: 쾌락을 사랑하는 사람은 가난해집니다. 포도주와 기름을 사랑하는 사람은 부자가 되지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쾌락’은 여기서 단순한 즐거움이 아니라 향락적 삶의 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름’은 올리브 기름을 가리키며, 보통 식재료보다 사치품이나 값비싼 기름의 함의를 가질 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  english_pob_choice: A man who loves pleasure will become poor
  chosen_korean: 쾌락을 사랑하는 사람은 가난해집니다
  alternatives_korean:
  - 즐거움을 사랑하는 사람은 가난해집니다
  - 유흥을 사랑하는 사람은 가난해집니다
  - 부족함의 사람은 가난해집니다
  lexicon: HALOT
  rationale: מַחְסוֹר는 문자적으로 ‘부족/결핍’이지만, 잠언의 경구적 문맥에서는 그 결과 상태인 ‘가난해짐’이 자연스럽습니다. שִׂמְחָה는 단순한 기쁨보다 향락적 생활을 가리키는 경우가 있어 ‘쾌락’으로 옮겨 경고의 뉘앙스를 살렸습니다.
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  english_pob_choice: whoever loves wine and oil
  chosen_korean: 포도주와 기름을 사랑하는 사람은
  alternatives_korean:
  - 포도주와 올리브 기름을 사랑하는 사람은
  - 포도주와 좋은 기름을 사랑하는 사람은
  lexicon: HALOT
  rationale: יַיִן은 ‘포도주’가 자연스럽고, שֶׁמֶן은 기본적으로 ‘기름’이지만 여기서는 사치나 값비싼 기름을 포함하는 이미지이므로 본문 이미지를 보존하는 쪽을 택했습니다.
- source_word: לֹא יַעֲשִׁיר
  english_pob_choice: will not become rich
  chosen_korean: 부자가 되지 못합니다
  alternatives_korean:
  - 부유해지지 못합니다
  - 부자가 되지 않습니다
  - 풍족해지지 못합니다
  lexicon: HALOT
  rationale: 히필형 עָשַׁר의 결과 상태를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘부자가 되다’입니다. 여기서는 단순한 번영보다 실제 재물의 결핍을 말하므로 ‘부유하다’보다 ‘부자가 되지 못하다’가 더 직접적입니다.
theological_decisions:
- issue: שִׂמְחָה의 의미 범위
  chosen_reading: 단순한 ‘기쁨’이 아니라 향락적 쾌락/유흥을 가리키는 쪽으로 옮겼습니다.
  alternative_readings:
  - 기쁨
  - 즐거움
  - 유흥
  rationale: 지혜문학의 경고 문맥에서 일반적인 기쁨을 부정하는 뜻으로 읽으면 의미가 지나치게 약해집니다. POB의 해설처럼 삶의 방식으로서의 쾌락 추구를 드러내는 번역이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 잠언의 지혜 경구는 도덕적 실천을 권면합니다.
- issue: שֶׁמֶן의 문화적 함의
  chosen_reading: ‘기름’은 기본 의미를 유지하되, 배후의 사치·고급품 이미지를 전제로 읽도록 두었습니다.
  alternative_readings:
  - 올리브 기름
  - 좋은 기름
  - 향유
  rationale: 히브리어의 표면 이미지를 보존하면서도, 독자가 본문이 단순 식재료가 아니라 풍요와 사치의 상징일 수 있음을 알 수 있게 하는 것이 적절합니다.
  doctrine_reference: 잠언의 상징어는 문자적 의미와 사회적 함의를 함께 고려해야 합니다.
