id: PRO.21.31
reference: Proverbs 21:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ס֗וּס מ֭וּכָן לְ/י֣וֹם מִלְחָמָ֑ה וְ֝/לַֽ/יהוָ֗ה הַ/תְּשׁוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
  footnotes:
  - marker: a
    text: Or 'salvation' or 'deliverance belongs to the LORD.' The Hebrew term can denote rescue broadly; here 'victory' fits the battle context.
    reason: lexical_alternative
translation:
  language: ko
  text: 말은 전투의 날을 위해 준비되어 있지만, 승리는 야훼께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַתְּשׁוּעָה는 넓게는 ‘구원’ 또는 ‘구출’을 뜻할 수 있습니다. 이 문맥에서는 전투의 결과를 가리키므로 ‘승리’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  english_pob_choice: horse
  chosen_korean: 말
  alternatives_korean:
  - 말 한 마리
  - 전쟁말
  lexicon: WLC
  rationale: 히브리어는 일반 명사로서 ‘말’을 뜻하며, 문맥상 군사적 용도는 뒤의 ‘전투의 날’이 분명히 합니다. ‘전쟁말’은 원문에 없는 의미를 덧붙일 수 있어 피했습니다.
- source_word: מוּכָן
  english_pob_choice: is prepared
  chosen_korean: 준비해 두어도
  alternatives_korean:
  - 준비됩니다
  - 예비됩니다
  lexicon: WLC
  rationale: 수동 분사형의 ‘준비된 상태’를 한국어 자연문으로 옮기기 위해 ‘준비해 두어도’로 처리했습니다. 잠언의 간결한 대비 구조도 살릴 수 있습니다.
- source_word: מִלְחָמָה
  english_pob_choice: battle
  chosen_korean: 전투
  alternatives_korean:
  - 전쟁
  - 싸움
  lexicon: WLC
  rationale: 영어 POB의 ‘battle’을 따라, ‘전투’가 직전의 말 준비와 가장 직접적으로 맞물리는 표현으로 보았습니다.
- source_word: הַתְּשׁוּעָה
  english_pob_choice: victory
  chosen_korean: 승리
  alternatives_korean:
  - 구원
  - 구출
  lexicon: HALOT
  rationale: 이 단어는 넓게는 구원·구출을 뜻하지만, 전투 맥락에서는 결과로서의 승리가 가장 자연스럽습니다. 한국어에서 ‘승리는 야훼께 있습니다’가 잠언의 힘을 살립니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본어에 따라 신성호는 ‘야훼’로 옮겨, 원문 고유명을 보존했습니다.
theological_decisions:
- issue: 전투 맥락의 תְּשׁוּעָה 번역
  chosen_reading: ‘승리’로 번역해 인간의 준비와 대비되는 하나님의 निर्ण정적 결과를 드러냈습니다.
  alternative_readings:
  - ‘구원’으로 번역
  - ‘구출’로 번역
  rationale: 문맥이 전투 준비와 승패를 다루므로, ‘구원’보다 ‘승리’가 독자에게 원문의 대비를 더 직접적으로 전달합니다. 동시에 승리가 야훼께 속한다는 신학적 진술은 유지됩니다.
  doctrine_reference: 잠언 21:31의 문맥상 하나님의 주권과 전쟁의 결과에 대한 진술
- issue: 문장 연결의 대비
  chosen_reading: ‘말을 … 준비해 두어도, 승리는 야훼께 있습니다’로 인간의 준비와 하나님의 주권을 대조했습니다.
  alternative_readings:
  - ‘그리고 야훼께 승리가 있습니다’
  - ‘그러나 야훼께서 구원을 주십니다’
  rationale: 히브리어의 וְ와 전치사 결합은 단순 연결을 넘어 대비를 형성하므로, 한국어에서도 ‘-어도’와 쉼표를 사용해 잠언의 반대 구조를 분명히 했습니다.
  doctrine_reference: 하나님의 주권과 인간의 책임/준비의 병치
