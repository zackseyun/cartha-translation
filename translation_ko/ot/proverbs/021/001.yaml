id: PRO.21.1
reference: Proverbs 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
  footnotes:
  - marker: a
    text: Or 'streams of water' or 'watercourses.' The Hebrew image is of divided channels that can be directed.
    reason: lexical_alternative
  - marker: b
    text: Or 'he pleases' or 'he wills.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 마음은 야훼의 손 안에 있는 물줄기와 같아서—그분이 원하시는 곳마다 그것을 돌리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물줄기’는 분기된 물길, 곧 ‘시냇물’이나 ‘수로’의 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘원하시는’은 ‘기뻐하시다’ 또는 ‘뜻하시다’의 의미 가능성을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  english_pob_choice: channels of water
  chosen_korean: 물줄기
  alternatives_korean:
  - 물의 흐름
  - 수로
  - 물길
  lexicon: HALOT
  rationale: פֶּלֶג 계열의 이미지는 단순한 ‘물’이 아니라 갈라져 흐르며 방향을 바꿀 수 있는 물의 흐름을 가리키므로, 한국어로는 간결하게 ‘물줄기’로 옮겨 수로적 이미지를 살렸습니다.
- source_word: לֶב מֶלֶךְ
  english_pob_choice: a king’s heart
  chosen_korean: 왕의 마음
  alternatives_korean:
  - 한 왕의 마음
  - 왕의 심장
  - 임금의 마음
  lexicon: HALOT
  rationale: 히브리어 ‘마음’(לֵב)은 감정만이 아니라 의지와 내면의 중심을 포함하므로, 현대 한국어에서는 ‘마음’이 가장 자연스럽고 본문의 일반적 잠언 진술에도 잘 맞습니다.
- source_word: בְּיַד יְהוָה
  english_pob_choice: in the hand of Yahweh
  chosen_korean: 야훼의 손 안에
  alternatives_korean:
  - 야훼의 손에
  - 야훼의 권세 아래
  - 야훼의 통제 아래
  lexicon: HALOT
  rationale: ‘손 안에’는 히브리 관용구가 지닌 통치·지배의 감각을 비교적 직접적으로 보존합니다. 한국어에서도 ‘손에’보다 ‘손 안에’가 보유·통제의 이미지를 더 선명하게 드러냅니다.
- source_word: יַחְפֹּץ
  english_pob_choice: he desires
  chosen_korean: 원하시는
  alternatives_korean:
  - 원하십니다
  - 기뻐하시는
  - 뜻하시는
  lexicon: HALOT
  rationale: חפץ는 ‘기뻐하다/원하다/원의가 있다’의 폭을 가지므로, 한국어에서는 의지와 소원을 함께 담는 ‘원하시는’이 가장 균형적입니다.
- source_word: יַטֶּנּוּ
  english_pob_choice: he turns it
  chosen_korean: 돌리십니다
  alternatives_korean:
  - 향하게 하십니다
  - 돌이키십니다
  - 이끄십니다
  lexicon: HALOT
  rationale: 히필 נָטָה는 ‘돌리다, 기울이다, 방향을 바꾸다’의 뜻을 가지며, 물줄기 비유와 결합할 때 ‘돌리다’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 여호와 신명 처리
  chosen_reading: 원문 יהוה는 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’로 음역
  - ‘주님’으로 대체
  rationale: 이 프로젝트의 기본 방침대로 신명은 대체 호칭이 아니라 고유명으로 드러내어, 본문이 말하는 야훼의 주권을 직접 보존합니다.
  doctrine_reference: Translation philosophy / divine-name policy
- issue: 왕의 마음에 대한 하나님의 주권
  chosen_reading: 본문은 야훼께서 왕의 내면적 방향을 실제로 돌리신다는 강한 진술을 유지합니다.
  alternative_readings:
  - 단순한 영향력으로 약화된 읽기
  - 결정론으로 과도하게 확정하는 읽기
  rationale: 잠언의 비유는 물줄기를 돌리는 주권적 행위를 말하지만, 철학적 모델을 덧붙여 인간 자유와 섭리를 해소하지는 않으므로, 한국어도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3 Preserve theological tension rather than resolve it
