id: PRO.21.21
reference: Proverbs 21:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
  footnotes:
  - marker: a
    text: Or 'justice' for one or both instances of 'righteousness'; the Hebrew term can include both personal righteousness and just conduct.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term that can also be rendered ''kindness,'' ''mercy,'' or ''loyal love.'''
    reason: lexical_alternative
  - marker: c
    text: The second 'righteousness' may also be understood as 'vindication' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 의와 인자를 따르는 사람은 생명과 의와 명예를 얻습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹדֵף
  english_pob_choice: pursues
  chosen_korean: 따르는
  alternatives_korean:
  - 추구하는
  - 뒤쫓는
  lexicon: HALOT
  rationale: 분사형의 계속적·적극적 행위를 한국어에서 자연스럽게 살리되, 지혜문학의 격언체에 맞게 매끄러운 현대어로 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: HALOT
  rationale: 문맥상 도덕적·언약적 올바름을 함께 담는 기본 대응으로 ‘의’를 택해, 첫 번째와 두 번째 출현의 어휘 반복을 유지했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자
  alternatives_korean:
  - 변함없는 사랑
  - 자비
  - 친절
  lexicon: HALOT
  rationale: 헤세드는 단순한 친절보다 언약적 신실함을 포함하므로, 한국어 성경에서 익숙하면서도 그 밀도를 비교적 잘 담는 ‘인자’를 사용했습니다.
- source_word: כָבוֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 영광
  - 존귀
  - 영예
  lexicon: HALOT
  rationale: 지혜문맥의 כָבוֹד는 사회적 존중과 위신을 가리킬 수 있으므로, 물질적 뉘앙스가 강한 ‘영광’보다 ‘명예’가 삼항 구조를 더 정확히 살립니다.
theological_decisions:
- issue: 반복되는 צְדָקָה의 처리
  chosen_reading: 두 번 모두 ‘의’로 유지했습니다.
  alternative_readings:
  - 첫 번째는 ‘정의’, 두 번째는 ‘의’ 또는 ‘의롭다 하심’
  - 두 번째를 ‘의롭다 함’이나 ‘변호’로 풀기
  rationale: 히브리어의 반복을 보존해, ‘의와 인자’를 추구하는 자가 ‘생명과 의와 명예’를 얻는다는 지혜문학적 대칭을 그대로 드러내도록 했습니다. 본문 안에서 의미를 좁혀 재해석하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Consistency of key terms, or documented exception'
