  source_fidelity: ‘따르는’은 רֹדֵף의 능동적이고 지속적인 ‘추구’의 뜻을 다소 약화할 수 있습니다. ‘추구하는’이 해당 분사의 적극성을 더 정확히 반영합니다. 결과 동사 יִמְצָא를 ‘얻습니다’로 옮긴 것은 이 문맥에서 자연스럽고 충실합니다. 두 차례의 צְדָקָה를 모두 ‘의’로 유지하여 히브리어의 반복과 의미 범위를 보존했습니다.
