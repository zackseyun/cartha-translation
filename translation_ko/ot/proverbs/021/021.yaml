  terminology: ‘의’는 צְדָקָה의 도덕적 올바름과 정의의 범주를 포괄하는 전통적이며 적절한 대응어입니다. 두 번째 ‘의’가 ‘의롭다 함/변호’로도 이해될 여지는 각주로 남기되 본문에서는 해석을 확정하지 않았습니다. חֶסֶד에는 ‘한결같은 사랑’을 사용하고 대안 번역을 각주에 제시합니다. כָבוֹד의 ‘명예’도 문맥상 적절합니다.
