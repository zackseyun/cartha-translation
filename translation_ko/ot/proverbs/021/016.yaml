id: PRO.21.16
reference: Proverbs 21:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
  footnotes:
  - marker: a
    text: Or "the shades"; Hebrew "Rephaim," a term used in wisdom literature for the departed dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 이해의 길에서 벗어나 헤매다가 죽은 자들의 모임에서 쉬게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그림자들”; 히브리어 “레파임”은 지혜문학에서 죽은 자들을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: A man
  chosen_korean: 사람은
  alternatives_korean:
  - 한 남자는
  - 한 사람은
  lexicon: HALOT
  rationale: 잠언의 보편적 교훈을 살리기 위해 성별을 드러내는 직역보다 대표적 인간을 가리키는 표준어 ‘사람’을 택했습니다.
- source_word: תּוֹעֶה
  english_pob_choice: who wanders
  chosen_korean: 이해의 길에서 벗어나 헤매다가
  alternatives_korean:
  - 길을 벗어나 헤매는
  - 그릇된 길로 방황하는
  lexicon: HALOT
  rationale: ‘wanders’의 계속적·진행적 뉘앙스를 살리되, 잠언의 길-비유에 맞게 ‘헤매다’를 사용했습니다.
- source_word: הַשְׂכֵּל
  english_pob_choice: of understanding
  chosen_korean: 이해의
  alternatives_korean:
  - 지혜의
  - 통찰의
  - 분별의
  lexicon: HALOT
  rationale: חכמת-문학의 관용적 표현인 ‘길’과 결합해 의미를 자연스럽게 드러내는 말로 ‘이해’를 선택했습니다.
- source_word: בִּקְהַל רְפָאִים
  english_pob_choice: in the assembly of the dead
  chosen_korean: 죽은 자들의 모임에서
  alternatives_korean:
  - 죽은 자들의 회중에서
  - 그림자들의 모임에서
  - 레파임의 모임에서
  lexicon: HALOT
  rationale: ‘assembly’의 집합성을 살리면서도, 여기서 רְפָאִים이 저승의 죽은 자들을 가리키는 점을 분명히 하려고 ‘모임’을 썼습니다.
- source_word: יָנוּחַ
  english_pob_choice: will come to rest
  chosen_korean: 쉬게 됩니다
  alternatives_korean:
  - 쉬게 될 것입니다
  - 안식하게 됩니다
  - 머물게 됩니다
  lexicon: HALOT
  rationale: 동사의 종결 결과를 한국어로 자연스럽게 옮기되, 여기서의 ‘rest’가 평안한 안식이라기보다 죽음의 귀착이라는 문맥을 해치지 않도록 했습니다.
theological_decisions:
- issue: רְפָאִים의 번역 범위
  chosen_reading: 본문에는 의미를 분명히 하는 ‘죽은 자들’로 옮기고, 고유명사화는 피했습니다.
  alternative_readings:
  - 그림자들
  - 레파임
  rationale: 지혜문학에서 רְפָאִים은 저승의 죽은 자들을 가리키므로, 현대 독자가 의미를 바로 이해하도록 본문에서는 설명적 번역을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
