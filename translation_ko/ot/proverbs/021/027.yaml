  to: 악인들의 제물은 가증한 것입니다. 하물며 그가 악한 뜻으로[a] 그것을 바칠 때에는 더욱 그렇습니다.
  rationale: 원문에 명시되지 않은 ‘주님께’를 삭제하고, 제물을 가리키는 목적어와 행위자를 보완했습니다. ‘바치다’는 제의적 제물을 가져와 드리는 행위를 자연스럽게 나타내며, 각주로 זִמָּה의 ‘악한 계략’ 가능성을 보존했습니다. 모든 종결을 현대 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:50Z'
