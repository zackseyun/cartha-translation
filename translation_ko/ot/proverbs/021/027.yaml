  source_fidelity: 첫 문장에 원문에 없는 ‘주님께’를 보충한 것은 תּוֹעֵבָה가 함의하는 신적 평가를 명시화한 것이나, 원문에는 대상이 명시되지 않으므로 보충하지 않는 편이 더 충실합니다. 또한 יְבִיאֶנּוּ의 ‘그가 그것을 가져오다/바치다’라는 주어와 목적어를 번역문에 드러내는 것이 안전합니다. אַף כִּי의 강화 비교는 잘 반영되었습니다.
  naturalness: 초안은 ‘것이니라’와 ‘그렇습니다’를 섞어 현대 합쇼체 문체가 일관되지 않습니다. ‘가증한 것입니다’와 ‘더욱 그렇습니다’로 통일하고, 제물을 예배·제의 문맥에서 ‘바치다’로 표현하면 자연스럽습니다.
  terminology: ‘악인들’, ‘제물’, ‘가증한 것/가증한 것입니다’, ‘악한 뜻’은 적절합니다. זִמָּה의 의미 범위에 관한 각주도 본문 선택을 잘 뒷받침합니다.
