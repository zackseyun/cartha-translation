source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
  footnotes:
  - marker: a
    text: Or 'even more when he brings it with a wicked scheme.' The Hebrew phrase can denote depraved intent or a malicious plan.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들의 제물은 주님께 가증한 것이니라. 하물며 악한 뜻으로 가져올 때는 더욱 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 계략으로 가져올 때’입니다. 히브리어 표현은 타락한 의도나 악한 계획을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  english_pob_choice: sacrifice
  chosen_korean: 제물
  alternatives_korean:
  - 희생제물
  - 희생
  - 제사
  lexicon: HALOT
  rationale: זֶבַח는 일반적 ‘제사 행위’보다 실제로 드려지는 제의적 희생물을 가리키므로, 문맥상 자연스럽고 구체적인 ‘제물’이 적절합니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  - 악한 자들
  lexicon: HALOT
  rationale: 복수 서술명사로서 도덕적으로 악한 사람들을 가리키므로, 잠언체의 범주를 살리는 ‘악인들’이 가장 간결합니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 역겨운 것
  - 가증스럽습니다
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 하나님 앞에서의 강한 혐오를 한국어 성경어휘로 충분히 살리기 위해 ‘가증한 것’으로 옮겼습니다.
- source_word: בְזִמָּה
  english_pob_choice: with evil intent
  chosen_korean: 악한 뜻으로
  alternatives_korean:
  - 악한 꾀로
  - 악한 계획으로
  - 사악한 계략으로
  lexicon: HALOT
  rationale: 이 표현은 여기서 성적 부도덕보다 제물을 드리는 데 깔린 왜곡된 의도나 계획을 가리키므로, 목적과 내면 동기를 드러내는 ‘악한 뜻으로’가 적절합니다.
theological_decisions:
- issue: אַף כִּי의 강화 비교
  chosen_reading: ‘하물며 … 더욱 그렇습니다’로 옮겨, 이미 악인의 제물이 가증하다는 진술에서 더 강한 경우로 나아가는 수사적 강화로 유지했습니다.
  alternative_readings:
  - ‘더욱이 … 할 때’
  - ‘심지어 … 할 때’
  rationale: 잠언의 אַף כִּי는 단순 시간 조건이 아니라 비교적 강화의 논리를 만드므로, 한국어의 ‘하물며’가 그 논리를 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
