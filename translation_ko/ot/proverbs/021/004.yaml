base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
  footnotes:
  - marker: a
    text: Or, 'the plowing of the wicked is sin' (also 'the tillage' or 'the fallow ground' of the wicked). The Hebrew word rendered 'lamp' can also be understood in an agricultural sense.
    reason: alternative_reading
translation:
  language: ko
  text: 교만한 눈과 거만한 마음, 곧 악인의 등불은 죄입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인의 쟁기질’(또는 ‘경작’이나 ‘묵힌 땅’)입니다. 여기서 ‘등불’로 옮긴 히브리어는 농경적 의미로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  english_pob_choice: Haughty eyes
  chosen_korean: 교만한 눈
  alternatives_korean:
  - 높은 눈
  - 들린 눈
  lexicon: HALOT
  rationale: ‘눈’이 높아진 태도를 가리키는 관용적 표현을 한국어에서도 자연스럽게 살리되, 단순한 신체 묘사로 흐르지 않도록 ‘교만한’으로 옮겼습니다.
- source_word: וּרְחַב לֵב
  english_pob_choice: a proud heart
  chosen_korean: 거만한 마음
  alternatives_korean:
  - 넓은 마음
  - 넓어진 마음
  lexicon: HALOT
  rationale: 문맥상 ‘넓은 마음’의 긍정적 의미가 아니라 자기 과시와 자만을 뜻하므로, 교만의 뜻을 분명히 드러내는 ‘거만한 마음’으로 옮겼습니다.
- source_word: נִר
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 쟁기질
  - 경작
  - 묵혀 둔 땅
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 ‘lamp’를 반영하되, 한국어 속담체에서 자연스럽고 상징성을 유지하는 ‘등불’을 택했습니다. 농경적 대안은 주석으로 보존했습니다.
- source_word: חַטָּאת
  english_pob_choice: are sin
  chosen_korean: 죄입니다
  alternatives_korean:
  - 죄악입니다
  - 죄된 것입니다
  lexicon: HALOT
  rationale: 명사형 ‘죄’를 유지해 원문의 판단문 구조를 살렸고, 현대 한국어 문체에 맞게 종결은 ‘-입니다’로 정리했습니다.
theological_decisions:
- issue: נִר רְשָׁעִים의 의미 선택
  chosen_reading: ‘악인의 등불’로 본문을 옮기고, 농경적 해석은 각주로 남깁니다.
  alternative_readings:
  - 악인의 쟁기질
  - 악인의 경작
  - 악인의 묵은 땅
  rationale: 이 구절은 해석상 갈래가 크므로, 본문에서는 POB의 채택을 따르되 대안 읽기를 삭제하지 않고 각주에 보존해 독자가 원문 의미의 긴장을 볼 수 있게 했습니다.
  doctrine_reference: Translation philosophy §3, §5
