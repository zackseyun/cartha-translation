  naturalness: ‘교만한 눈과 거만한 마음, 곧 악인의 등불은 죄입니다’가 대시로 분절한 초안보다 현대 한국어의 격식 있는 문장 흐름에 자연스럽습니다. ‘곧’은 영어 POB가 채택한 동격적 연결을 드러냅니다.
  terminology: ‘교만한 눈’, ‘거만한 마음’, ‘악인’, ‘등불’, ‘죄’는 지혜문학의 관용과 현대 표준어에 잘 맞습니다. 대안의 fallow ground는 ‘묵은 땅’보다 의도적으로 쉬게 둔 땅이라는 뜻의 ‘묵힌 땅’이 적절합니다.
