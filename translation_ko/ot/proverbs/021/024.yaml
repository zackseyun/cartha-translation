  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
  footnotes:
  - marker: a
    text: Or “Proud, haughty, a mocker is his name; he acts with arrogant fury.”
    reason: lexical_alternative
translation:
  language: ko
  text: “교만하고, 오만하며, 조롱하는 자”가 그의 이름입니다 — 그는 오만한 분노 속에서 행동합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “교만하고, 거만하며, 조롱하는 자”가 그의 이름입니다 — 그는 거만한 분노로 행동합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵד
  english_pob_choice: Proud
  chosen_korean: 교만하고
  alternatives_korean:
  - 교만한
  - 거만한
  - 주제넘은
  lexicon: HALOT
  rationale: זֵד는 단순한 성격 묘사보다 자기확신과 거만함이 섞인 태도를 가리키므로, 첫 항목을 ‘교만하고’로 옮겨 뒤의 형용사와 평행을 이루게 했습니다.
- source_word: יָהִיר
  english_pob_choice: arrogant
  chosen_korean: 오만하며
  alternatives_korean:
  - 거만하며
  - 뽐내며
  - 잘난 체하며
  lexicon: HALOT
  rationale: יָהִיר는 자기 높임의 뉘앙스를 강화하므로, 한국어에서는 ‘오만하며’로 구분해 앞의 ‘교만하고’와 의미적 중복을 줄였습니다.
- source_word: לֵץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조롱꾼
  - 냉소하는 자
  lexicon: HALOT
  rationale: 지혜문학의 לֵץ는 단순한 농담꾼이 아니라 지혜를 업신여기며 조롱하는 유형이어서, 인격 묘사로서 ‘조롱하는 자’를 택했습니다.
- source_word: עֹשֶׂה בְּעֶבְרַת זָדֽוֹן
  english_pob_choice: one who acts in the fury of presumption
  chosen_korean: 오만한 분노 속에서 행동합니다
  alternatives_korean:
  - 주제넘은 분노 속에서 행동합니다
  - 교만한 격분으로 행동합니다
  - 무례한 분노 가운데 행합니다
  lexicon: HALOT
  rationale: 활용형 분사 עֹשֶׂה의 습관적·성격 규정적 힘을 ‘행동합니다’로 살렸고, בְּעֶבְרַת זָדוֹן은 ‘오만한 분노’로 옮겨 מקור의 강도를 유지했습니다.
theological_decisions:
- issue: 지혜격언의 명명식 표현(‘그의 이름입니다’)을 어떻게 처리할지
  chosen_reading: 문자적으로 살려 성격 규정의 선언처럼 읽히도록 했습니다.
  alternative_readings:
  - ‘그는 …라고 불립니다’
  - ‘그의 평판은 …입니다’
  rationale: 히브리어의 שְׁמוֹ는 단순 호칭이 아니라 인격과 명성을 총체적으로 규정하는 공식이므로, 한국어에서도 ‘그의 이름입니다’로 직접적으로 남겼습니다.
  doctrine_reference: 잠언의 지혜적 인격 묘사와 수사 구조
