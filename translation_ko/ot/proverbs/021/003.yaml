  text: עֲ֭שֹׂה צְדָקָ֣ה וּ/מִשְׁפָּ֑ט נִבְחָ֖ר לַ/יהוָ֣ה מִ/זָּֽבַח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
  footnotes:
  - marker: a
    text: Or 'is preferred by the LORD'; the Hebrew literally has 'is chosen to/by the LORD,' expressing divine preference or acceptability.
    reason: lexical_alternative
translation:
  language: ko
  text: 공의와 정의를 행하는 것이 제사보다 야훼께 더 받아들여집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 더 선호하신다’; 히브리어는 문자적으로 ‘야훼께 선택된/선택받는’이라는 뜻으로, 하나님의 선호나 받아들여지심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  english_pob_choice: to do
  chosen_korean: 행하는 것
  alternatives_korean:
  - 하는 것
  - 실천하는 것
  lexicon: HALOT
  rationale: 부정사구가 명사적으로 쓰여 행동 자체를 평가하므로, 현대 한국어에서는 ‘행하는 것’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 공의
  alternatives_korean:
  - 의
  - 의로움
  lexicon: HALOT
  rationale: משפט와 병렬이므로 단순히 ‘의’로만 두기보다 사회적·윤리적 올바름을 드러내는 ‘공의’가 짝을 더 분명히 살립니다.
- source_word: וּמִשְׁפָּט
  english_pob_choice: and justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 공정
  lexicon: HALOT
  rationale: 지혜문맥에서 משפט은 윤리적 판정과 바른 질서를 포함하므로, 현대 독자에게는 ‘정의’가 가장 분명합니다.
- source_word: נִבְחָר לַ/יהוָ֣ה
  english_pob_choice: is more acceptable to Yahweh
  chosen_korean: 야훼께 더 받아들여집니다
  alternatives_korean:
  - 야훼께 더 선택됩니다
  - 야훼께 더 기뻐받습니다
  lexicon: HALOT
  rationale: נבחר의 문자적 ‘선택됨’보다, 제사와의 비교에서 드러나는 선호/가치의 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘더 받아들여집니다’로 옮겼습니다.
- source_word: מִזָּבַח
  english_pob_choice: than sacrifice
  chosen_korean: 제사보다
  alternatives_korean:
  - 희생제물보다
  - 제물보다
  lexicon: HALOT
  rationale: 비교격 מן의 의미를 살리면서도 잠언의 일반적 진술에 맞게 ‘제사’로 간결하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
