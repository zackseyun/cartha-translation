translation:
  language: ko
  text: 의와 공의를 행하는 것을 야훼께서는 제사보다 더 선호하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 더 받아들여진다’. 히브리어는 문자적으로 ‘야훼께 선택된’이라고 하며, 야훼의 선호 또는 받아들이심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  english_pob_choice: to do
  chosen_korean: 행하는 것
  alternatives_korean:
  - 하는 것
  - 실천하는 것
  lexicon: HALOT
  rationale: 부정사구가 명사적으로 쓰여 행동 자체를 평가하므로, 현대 한국어에서는 ‘행하는 것’이 가장 자연스럽고 문맥에 맞습니다.
