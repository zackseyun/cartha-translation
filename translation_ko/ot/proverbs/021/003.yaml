  rationale: 이 구절은 신명기 전통의 하나님의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
