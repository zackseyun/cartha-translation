  rationale: נבחר의 문자적 ‘선택됨’보다, 제사와의 비교에서 드러나는 선호/가치의 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘더 받아들여집니다’로 옮겼습니다.
- source_word: מִזָּבַח
