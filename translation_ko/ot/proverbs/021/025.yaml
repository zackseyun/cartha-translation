  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: ko
  text: 게으른 사람의 갈망은 그를 죽음에 이르게 합니다. 왜냐하면 그의 손이 일하는 것을 거부하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  english_pob_choice: craving
  chosen_korean: 갈망
  alternatives_korean:
  - 욕구
  - 욕망
  - 바람
  lexicon: תַּאֲוָה
  rationale: POB의 ‘craving’을 따라 단순한 의지보다 강한 내적 욕구를 드러내기 위해 ‘갈망’을 택했습니다.
- source_word: עָצֵל
  english_pob_choice: lazy man
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 태만한 사람
  - 나태한 사람
  lexicon: עָצֵל
  rationale: 히브리어의 일반적 인간형을 자연스러운 현대 한국어로 옮기되, 속담적 경고의 톤을 유지했습니다.
- source_word: תְּמִיתֶנּוּ
  english_pob_choice: puts him to death
  chosen_korean: 그를 죽음에 이르게 합니다
  alternatives_korean:
  - 그를 죽게 합니다
  - 그를 죽입니다
  - 그를 파멸시킵니다
  lexicon: מות
  rationale: 직접적 살해보다 결과적 파멸/죽음의 도달을 뜻하는 문맥을 반영해, 과도하게 기계적이지 않으면서도 강한 결과를 살렸습니다.
- source_word: מֵאֲנוּ
  english_pob_choice: refuse
  chosen_korean: 거부하기 때문입니다
  alternatives_korean:
  - 하기를 마다하기 때문입니다
  - 하려 하지 않기 때문입니다
  - 거절하기 때문입니다
  lexicon: מאן
  rationale: 손의 의인화된 거부를 분명히 보이기 위해 ‘거부하다’를 사용했습니다.
theological_decisions:
- issue: 격언의 인과관계 표현
  chosen_reading: 게으름의 내적 갈망과 노동 거부가 죽음으로 이어진다는 직설적 경고를 유지했습니다.
  alternative_readings:
  - ‘파멸시킵니다’처럼 완곡하게 처리하는 읽기
  - 도덕적 훈계로만 약화시키는 읽기
  rationale: 잠언의 경고 강도를 약화하지 않도록, 원문의 결과 진술을 그대로 드러냈습니다.
  doctrine_reference: 지혜문학의 경고적 수사
