  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֗וֹב שֶׁ֥בֶת בְּ/אֶֽרֶץ מִדְבָּ֑ר מֵ/אֵ֖שֶׁת מדונים וָ/כָֽעַס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/019.yaml
  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
  footnotes:
  - marker: a
    text: Or 'than with a contentious and angry wife.' The final term can be understood as describing either her disposition ('angry') or her effect on others ('vexing, provoking').
    reason: lexical_alternative
translation:
  language: ko
  text: 광야 땅에 사는 것이 다툼이 많고 화가 난 아내와 함께 사는 것보다 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב שֶׁבֶת
  english_pob_choice: It is better to live
  chosen_korean: 사는 것이 낫습니다
  alternatives_korean:
  - 거주하는 것이 낫습니다
  - 머무는 것이 낫습니다
  lexicon: HALOT
  rationale: טוֹב의 비교 격언 구조를 한국어의 자연스러운 비교형으로 살려, 문어체이면서도 현대적으로 읽히는 ‘사는 것이 낫습니다’로 옮겼습니다.
- source_word: בְּאֶרֶץ מִדְבָּר
  english_pob_choice: in a desert land
  chosen_korean: 광야 땅에
  alternatives_korean:
  - 사막 땅에
  - 광야에
  - 황무지 땅에
  lexicon: HALOT
  rationale: אֶרֶץ와 מִדְבָּר를 함께 살리되, 성경적 배경을 해치지 않는 표준어 표현으로 ‘광야 땅’이 가장 적절합니다.
- source_word: מֵאֵשֶׁת מדונים
  english_pob_choice: than with a quarrelsome ... wife
  chosen_korean: 다툼이 많고
  alternatives_korean:
  - 다투기 좋아하는
  - 분쟁을 일으키는
  - 말다툼이 잦은
  lexicon: HALOT
  rationale: מדונים의 핵심은 지속적인 다툼과 분쟁이므로, 관계적 성향을 드러내는 한국어로 ‘다툼이 많고’가 자연스럽습니다.
- source_word: וָכָעַס
  english_pob_choice: angry / vexing
  chosen_korean: 화가 난
  alternatives_korean:
  - 성난
  - 화를 돋우는
  - 짜증나게 하는
  lexicon: HALOT
  rationale: כעס는 ‘분노/화남’의 의미가 직접적이므로, POB의 최종 선택인 ‘angry’를 따라 상태를 나타내는 ‘화가 난’으로 옮겼습니다.
theological_decisions:
- issue: 속담의 비교 구조를 한국어에서 어떻게 유지할지
  chosen_reading: ‘…하는 것이 …보다 낫습니다’로 직역에 가까운 비교형을 유지했습니다.
  alternative_readings:
  - ‘…보다 낫습니다’만으로 압축
  - ‘…하는 편이 낫습니다’로 완화
  rationale: 히브리어 잠언의 판단형 비교를 흐리지 않으면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
  doctrine_reference: 잠언 문학의 교훈적 비교법
- issue: כָעַס의 의미 범위를 상태로 볼지 원인으로 볼지
  chosen_reading: ‘화가 난’으로 상태를 우선 반영했습니다.
  alternative_readings:
  - ‘화를 돋우는’으로 영향 중심
  - ‘짜증나게 하는’으로 작용 중심
  rationale: 본문의 병렬성상 아내의 성향을 묘사하는 읽기가 가장 직접적이며, POB의 ‘angry’ 선택과도 맞닿습니다.
  doctrine_reference: 히브리어 כעס의 어휘 의미와 문맥적 병렬
