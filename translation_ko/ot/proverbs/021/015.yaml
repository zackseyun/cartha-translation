id: PRO.21.15
reference: Proverbs 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂמְחָ֣ה לַ֭/צַּדִּיק עֲשׂ֣וֹת מִשְׁפָּ֑ט וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/015.yaml
  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
  footnotes:
  - marker: a
    text: Or 'Doing justice is joy to the righteous, and ruin to evildoers.' The Hebrew noun מְחִתָּה can denote terror, dismay, or ruin/destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 의를 행하는 것은 의인에게는 기쁨이지만, 악을 행하는 자들에게는 멸망입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의를 행하는 것은 의인에게는 기쁨이고, 악을 행하는 자들에게는 멸망입니다.” 히브리어 מְחִתָּה는 공포, 당혹, 파멸/멸망을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: HALOT
  rationale: 명사 שִׂמְחָה의 기본 의미를 자연스러운 현대 한국어 명사로 옮겼습니다. '기쁨'이 문장 전체의 평행구조를 가장 간결하게 살립니다.
- source_word: עֲשׂוֹת מִשְׁפָּט
  english_pob_choice: Doing justice
  chosen_korean: 의를 행하는 것
  alternatives_korean:
  - 정의를 행하는 것
  - 공의를 행하는 것
  - 재판을 집행하는 것
  lexicon: HALOT
  rationale: מִשְׁפָּט은 잠언에서 단순한 법정 판결보다 도덕적·사회적 '의'의 실천을 가리키는 경우가 많아, 문맥상 '의를 행하다'가 가장 직접적입니다.
- source_word: לַצַּדִּיק
  english_pob_choice: to the righteous
  chosen_korean: 의인에게는
  alternatives_korean:
  - 의인에게
  - 의로운 사람에게는
  lexicon: HALOT
  rationale: ל 접두사는 수혜·관계의 의미를 가지며, צַדִּיק는 실질적으로 '의인'을 가리키므로 한국어에서는 주제를 드러내는 '-에게는' 구조로 자연스럽게 옮겼습니다.
- source_word: מְחִתָּה
  english_pob_choice: destruction
  chosen_korean: 멸망
  alternatives_korean:
  - 파멸
  - 공포
  - 두려움
  lexicon: HALOT
  rationale: 이 명사는 '공포/당혹/붕괴/파멸'까지 포괄할 수 있으나, 대구법에서 악인에게 미치는 최종적 결과를 드러내는 '멸망'이 가장 안정적입니다.
- source_word: פֹעֲלֵי אָוֶן
  english_pob_choice: evildoers
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악인들
  - 불의를 행하는 자들
  - 불법을 행하는 자들
  lexicon: HALOT
  rationale: 직역하면 '악을 일하는 자들'이므로, 한국어에서는 행위성을 살린 '악을 행하는 자들'로 옮겨 אָוֶן의 도덕적 악성을 유지했습니다.
theological_decisions:
- issue: מִשְׁפָּט의 범위
  chosen_reading: 이 구절의 מִשְׁפָּט은 단지 법정 절차가 아니라 의로운 삶의 실천으로 이해하고 '의를 행하다'로 번역했습니다.
  alternative_readings:
  - '''정의를 행하다'''
  - '''판결을 행하다'''
  rationale: 잠언의 지혜 문맥에서는 מִשְׁפָּט가 윤리적 질서와 올바름을 포함하므로, 좁은 사법적 의미로 축소하지 않는 것이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: 지혜문학의 윤리적 의 개념
