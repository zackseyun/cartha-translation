id: PRO.6.8
reference: Proverbs 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּכִ֣ין בַּ/קַּ֣יִץ לַחְמָ֑/הּ אָגְרָ֥ה בַ֝/קָּצִ֗יר מַאֲכָלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/008.yaml
  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
  footnotes:
  - marker: a
    text: Hebrew 'its bread'; here likely meaning 'its food' or sustenance more generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'it stores up its food at harvest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 개미는 여름에 먹을 것을[a] 마련하고, 추수 때에 양식을 모읍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것의 빵’입니다. 여기서는 개미의 먹이를 가리키는 더 넓은 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘추수 때에 먹을 것을 저장합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  english_pob_choice: prepares
  chosen_korean: 준비합니다
  alternatives_korean:
  - 마련합니다
  - 갖춥니다
  lexicon: HALOT
  rationale: 히필형 כון은 여기서 ‘미리 준비하다’의 뜻이므로, 개미의 부지런함을 자연스럽게 살리는 ‘준비하다’가 가장 직접적입니다.
- source_word: בַּקַּיִץ
  english_pob_choice: in summer
  chosen_korean: 여름에
  alternatives_korean:
  - 여름 동안
  - 한여름에
  lexicon: HALOT
  rationale: 전치사 ב의 시간적 용법을 그대로 살려, 행동이 이루어지는 계절을 간명하게 나타냈습니다.
- source_word: לַחְמָהּ
  english_pob_choice: its food
  chosen_korean: 자기 먹을 것
  alternatives_korean:
  - 자기 양식
  - 자기 음식
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로 ‘빵’이지만 여기서는 개미의 먹이를 가리키는 넓은 뜻이어서, 인간 중심의 ‘빵’보다 ‘먹을 것’이 본뜻을 잘 드러냅니다.
- source_word: אָגְרָה
  english_pob_choice: it gathers
  chosen_korean: 모읍니다
  alternatives_korean:
  - 쌓아 둡니다
  - 저장합니다
  lexicon: HALOT
  rationale: אגר는 모아 들이는 동작을 가리키므로, 앞 절의 ‘준비합니다’와 평행을 이루는 ‘모읍니다’가 자연스럽습니다.
- source_word: מַאֲכָלָהּ
  english_pob_choice: its provisions
  chosen_korean: 자기 양식
  alternatives_korean:
  - 자기 먹을 것
  - 자기 비축물
  lexicon: HALOT
  rationale: 두 번째 절은 장차 먹을 비축분의 뉘앙스가 있어, 단순 반복을 피하면서도 ‘provisions’의 저장된 먹거리를 반영하는 ‘양식’이 적절합니다.
