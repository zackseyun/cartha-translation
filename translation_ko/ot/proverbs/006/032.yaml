base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
  footnotes:
  - marker: a
    text: Or, 'He who commits adultery with a wife lacks understanding; whoever does it ruins his life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여자와 간음하는 자는 분별이 없으며[a], 그 일을 하는 자는 자기 자신을 파멸시킵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아내와 간음하는 자는 이해력이 없으며, 그 일을 하는 자는 자기 삶을 파멸시킵니다.”
    reason: אִשָּׁה는 ‘여자’ 또는 ‘아내’로, נֶפֶשׁ는 여기서 ‘자기 자신’ 또는 ‘삶/생명’으로 옮길 수 있습니다.
lexical_decisions:
- source_word: נֹאֵף
  english_pob_choice: commits adultery
  chosen_korean: 간음하는 자
  alternatives_korean:
  - 간음합니다
  - 음행하는 자
  lexicon: WLC/문맥
  rationale: 히브리어 분사는 행위를 반복적으로 행하는 사람을 가리키므로, 한국어에서는 동작성을 살린 ‘간음하는 자’가 자연스럽고 간결합니다.
- source_word: אִשָּׁה
  english_pob_choice: with a woman
  chosen_korean: 여자와
  alternatives_korean:
  - 아내와
  - 여인과
  lexicon: HALOT
  rationale: אִשָּׁה는 ‘여자/아내’ 모두 가능하지만, כאן에서는 간음 행위의 상대를 넓게 드러내는 ‘여자와’가 원문의 의미를 더 직접적으로 옮깁니다.
- source_word: חֲסַר לֵב
  english_pob_choice: lacks sense
  chosen_korean: 분별이 없고
  alternatives_korean:
  - 지각이 없고
  - 마음이 없고
  - 이해가 없고
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 부족한’이지만 잠언의 관용구로서는 판단력과 통찰의 결핍을 뜻하므로, 현대 한국어에서는 ‘분별이 없다’가 가장 자연스럽습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: himself
  chosen_korean: 자기 자신을
  alternatives_korean:
  - 자기 생명을
  - 자기 목숨을
  - 자신의 영혼을
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 추상적 ‘영혼’보다 인격 전체/자기 자신을 가리키므로, 문맥상 반사적 의미를 살린 ‘자기 자신을’이 적절합니다.
