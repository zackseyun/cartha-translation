base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/005.yaml
  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
  footnotes:
  - marker: a
    text: Or 'Deliver yourself' or 'Escape.' The Hebrew imperative carries the sense of urgently getting free.
    reason: lexical_alternative
  - marker: b
    text: '''Gazelle'' may also be rendered ''deer'' or traditionally ''roe.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'from the hand of the trapper.' The Hebrew names the person who sets snares.
    reason: lexical_alternative
translation:
  language: ko
  text: 가젤처럼[b] 손에서, 새처럼 올무 놓는 자의 손에서 벗어나십시오.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벗어나십시오’는 히브리어 명령형으로, 급히 스스로 빠져나오라는 뜻입니다. ‘자신을 구해 내십시오’ 또는 ‘도망치십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가젤’은 히브리어 צְבִי의 구체적인 번역입니다. ‘사슴’ 또는 전통적으로 ‘노루’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘올무 놓는 자’는 히브리어 יָקוּשׁ을 옮긴 말입니다. 문맥상 ‘새잡이’ 또는 ‘덫 놓는 자’로도 번역할 수 있습니다.
    reason: lexical_alternative
