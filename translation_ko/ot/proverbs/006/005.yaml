id: PRO.6.5
reference: Proverbs 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֭נָּצֵל כִּ/צְבִ֣י מִ/יָּ֑ד וּ֝/כְ/צִפּ֗וֹר מִ/יַּ֥ד יָקֽוּשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/005.yaml
  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
  footnotes:
  - marker: a
    text: Or 'Deliver yourself' or 'Escape.' The Hebrew imperative carries the sense of urgently getting free.
    reason: lexical_alternative
  - marker: b
    text: '''Gazelle'' may also be rendered ''deer'' or traditionally ''roe.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'from the hand of the trapper.' The Hebrew names the person who sets snares.
    reason: lexical_alternative
translation:
  language: ko
  text: 사냥꾼의 손에서, 가젤처럼 자신을 구하십시오. 새처럼, 새잡이의 손에서 벗어나십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신을 구하십시오’는 히브리어 명령형의 긴급한 자기-해방 촉구를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가젤’은 히브리어 צְבִי의 더 구체적인 번역이며, 더 넓은 ‘사슴’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘새잡이’는 히브리어가 가리키는 올무를 놓는 사람, 곧 새를 잡는 자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּצֵל
  english_pob_choice: Rescue yourself
  chosen_korean: 자신을 구하십시오
  alternatives_korean:
  - 자신을 구해 내십시오
  - 벗어나십시오
  - 도망치십시오
  lexicon: HALOT
  rationale: 니팔 명령형의 긴급한 자기-탈출 권고를 살려, ‘구하다’ 계열로 직접적이고 능동적인 촉구를 옮겼습니다.
- source_word: כִּצְבִי
  english_pob_choice: like a gazelle
  chosen_korean: 가젤처럼
  alternatives_korean:
  - 사슴처럼
  - 노루처럼
  lexicon: HALOT
  rationale: צְבִי는 일반적인 ‘사슴’보다 ‘가젤’이 더 정확하므로, 현대 한국어에서도 비교 이미지를 분명히 살렸습니다.
- source_word: מִיָּד
  english_pob_choice: from the hand
  chosen_korean: 손에서
  alternatives_korean:
  - 손아귀에서
  - 권세에서
  lexicon: HALOT
  rationale: 직역적인 ‘손’ 이미지를 유지해, 사냥 장면의 구체성과 히브리어 관용의 압박감을 보존했습니다.
- source_word: יָקוּשׁ
  english_pob_choice: fowler
  chosen_korean: 새잡이
  alternatives_korean:
  - 사냥꾼
