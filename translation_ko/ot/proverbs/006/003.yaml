  - 네 이웃에게 세게 요청하십시오
  lexicon: HALOT
  rationale: רהב의 강한 압박적 요청이라는 뜻을 ‘간청하다’로 옮기고, MT의 복수형을 반영하여 ‘이웃들에게’로 처리했습니다.
