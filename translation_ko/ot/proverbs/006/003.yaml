  source_fidelity: The draft accurately conveys the sequence of imperatives, the figurative force of being in a neighbor's grasp, the self-abasing sense of הִתְרַפֵּס, and the received plural רֵעֶיךָ. However, footnote a is anchored to ‘이것을 하십시오’ even though its content concerns ‘이웃의 손바닥 안에’; this must be corrected. A modest recasting also improves the natural placement of the filial address and discourse particle in Korean.
  naturalness: ‘그러면 내 아들아’ after a sentence break is somewhat stilted in modern formal Korean. Placing ‘내 아들아’ first and rendering אֵפוֹא as ‘이제’ yields a more idiomatic urgent exhortation without changing the sense.
  terminology: ‘손바닥 안에’ appropriately preserves the concrete image of כַּף. ‘스스로 낮추고’ is a sound non-over-specific rendering of the rare reflexive imperative. ‘간절히 요청하십시오’ expresses the insistent appeal of וּרְהַב without supplying a specific object such as ‘plea’; the plural addressee is retained.
