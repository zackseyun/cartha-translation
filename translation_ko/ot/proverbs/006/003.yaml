- source_word: הִתְרַפֵּס
  english_pob_choice: humble yourself
  chosen_korean: 스스로 낮추고
  alternatives_korean:
  - 자신을 낮추고
  - 엎드리고
  - 스스로 굽히고
  lexicon: HALOT
  rationale: 어근이 요구하는 자기 비하/자기 낮춤의 태도를 한국어로 간결하게 표현하되, 과도하게 몸짓을 특정하지 않았습니다.
- source_word: וּרְהַב רֵעֶיךָ
  english_pob_choice: press your plea with your neighbors
  chosen_korean: 네 이웃들에게 간청하십시오
  alternatives_korean:
