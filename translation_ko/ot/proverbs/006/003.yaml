base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
  footnotes:
  - marker: a
    text: Literally, 'into the palm of your neighbor,' that is, into your neighbor's power or control.
    reason: lexical_alternative
  - marker: b
    text: Or 'throw yourself down' / 'submit yourself' for 'humble yourself.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew reads 'your neighbors' (plural), though many understand the sense as singular, 'your neighbor' or 'your friend,' in line with the earlier phrase.
    reason: textual_variant
translation:
  language: ko
  text: 내 아들아, 이제 이것을 하여 너 자신을 건져 내십시오. 네가 이웃의 손바닥 안에 들어갔기 때문입니다[a]. 가서 스스로 낮추고[b], 네 이웃들에게 간절히 요청하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이웃의 손바닥 안에’입니다. 곧 이웃의 힘이나 통제 아래에 들어갔다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘엎드리십시오’, ‘자기를 굽히십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘네 이웃들’(복수)로 되어 있지만, 앞의 표현과 맞추어 단수 ‘네 이웃’으로 이해하는 경우도 많습니다.
    reason: textual_variant
