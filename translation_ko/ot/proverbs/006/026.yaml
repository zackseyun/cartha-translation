  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 가리키는 빈곤/몰락의 결과를 그대로 풀어, 문자적 이미지를 살리면서도 의미가 전달되도록 했습니다.
- source_word: וְאֵשֶׁת אִישׁ
  english_pob_choice: a married woman
  chosen_korean: 남의 아내
  alternatives_korean:
  - 한 남자의 아내
  - 결혼한 여자
  - 남편 있는 여자
  lexicon: HALOT
  rationale: 문맥상 다른 남편의 아내와의 간음을 가리키므로, 관계적 함의를 드러내는 한국어로 옮겼습니다.
- source_word: נֶפֶשׁ יְקָרָה תָצֽוּד
