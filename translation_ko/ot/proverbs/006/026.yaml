theological_decisions:
- issue: נֶפֶשׁ יְקָרָה의 의미
  chosen_reading: ‘귀한 생명’으로 번역해, 단순한 영혼 개념보다 전체 인간의 생명과 존재가 위험에 놓인다는 경고로 읽었습니다.
  alternative_readings:
  - 귀한 혼
  - 소중한 영혼
  - 귀한 삶
  rationale: 잠언의 경계 문맥에서는 존재 전체의 상실과 파괴가 강조되므로, ‘생명’이 가장 직접적으로 주의를 전달합니다.
  doctrine_reference: 지혜문학의 경고적 표현과 נֶפֶשׁ의 의미 범위
