  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
  footnotes:
  - marker: a
    text: Or 'shuffling/scraping with his foot' or more generally 'making signs with his feet'; the Hebrew verb מֹלֵל is rare, and the exact gesture is uncertain, though the context clearly suggests covert bodily signaling.
    reason: lexical_alternative
  - marker: b
