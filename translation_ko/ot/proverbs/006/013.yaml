  text: קֹרֵ֣ץ בְּ֭/עֵינָ/ו מֹלֵ֣ל בְּ/רַגְלָ֑/ו מֹ֝רֶ֗ה בְּ/אֶצְבְּעֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/013.yaml
  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
  footnotes:
  - marker: a
    text: Or 'shuffling/scraping with his foot' or more generally 'making signs with his feet'; the Hebrew verb מֹלֵל is rare, and the exact gesture is uncertain, though the context clearly suggests covert bodily signaling.
    reason: lexical_alternative
  - marker: b
    text: Or 'teaching/directing with his fingers.' Here 'pointing' is chosen because the verse lists physical gestures rather than verbal instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 눈으로 윙크하고, 발로 신호하며, 손가락으로 가리킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발을 끌며/문지르며’ 또는 더 일반적으로 ‘발로 신호를 보내며’로도 옮길 수 있습니다. 히브리어 동사 מֹלֵל은 희귀하여 정확한 몸짓은 확실하지 않지만, 문맥상 은밀한 신체 신호를 가리키는 것은 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘손가락으로 가르치며/지시하며’로도 옮길 수 있습니다. 여기서는 말로 가르친다기보다 몸짓 목록의 일부이므로 ‘가리키다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ
  english_pob_choice: winking
  chosen_korean: 윙크하고
  alternatives_korean:
  - 눈을 찡그리고
  - 눈짓하고
  - 흘겨보며
  lexicon: HALOT
  rationale: 눈으로 몰래 신호하는 동작을 가리키므로, 현대 한국어에서 가장 자연스럽게 그 뉘앙스를 살리는 표현은 ‘윙크하다’입니다.
- source_word: מֹלֵל
  english_pob_choice: signaling
  chosen_korean: 발로 신호하며
  alternatives_korean:
  - 발로 흔들며
  - 발을 끌며
  - 발짓하며
  - 발로 신호를 보내며
  lexicon: HALOT
  rationale: 희귀한 분사로서 정확한 동작은 불확실하지만, 문맥상 비밀스러운 신체 신호를 뜻하므로 과도하게 구체화하지 않고 ‘신호하다’로 옮겼습니다.
- source_word: מֹרֶה
  english_pob_choice: pointing
  chosen_korean: 가리킵니다
  alternatives_korean:
  - 지시합니다
  - 가르칩니다
  - 손짓합니다
  lexicon: HALOT
  rationale: 여기서는 말로 가르치는 뜻보다 손가락으로 하는 몸짓이 문맥에 맞으므로, ‘가리키다’가 가장 직접적입니다.
theological_decisions:
- issue: 비난 목록 속 은밀한 몸짓의 전달 방식
  chosen_reading: 세 동작을 모두 실제 신체 제스처로 옮겨, 숨어서 의도를 전달하는 풍자를 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘은밀히 신호를 보냅니다’로 일반화함
  - ‘교묘하게 사람을 조종합니다’처럼 해석을 덧붙임
  rationale: 이 절은 악인의 말과 행동을 비꼬는 지혜문학적 묘사이므로, 구체적 몸짓의 연쇄를 살려야 문맥의 날카로움이 유지됩니다.
  doctrine_reference: 잠언의 지혜/경계 문맥
