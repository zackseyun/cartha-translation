    issue: ‘손을 잡아맹세하였다’가 손을 치는 약정 관용구를 부정확하고 부자연스럽게 옮깁니다.
    rationale: תקע כף는 손을 쳐 약정·보증을 확정하는 행위를 가리키며, 단순한 손잡음이나 종교적 맹세로 한정되지 않습니다.
