id: PRO.6.1
reference: Proverbs 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֭נִ/י אִם עָרַ֣בְתָּ לְ/רֵעֶ֑/ךָ תָּקַ֖עְתָּ לַ/זָּ֣ר כַּפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
  footnotes:
  - marker: a
    text: Or 'if you have become a guarantor for your friend.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'if you have struck your hands to a stranger'; that is, sealed a pledge by a handclasp.
    reason: cultural_note
translation:
  language: ko
  text: 내 아들아, 네가 네 이웃을 위하여 보증을 서고, 낯선 사람에게 손을 쳐서 약정을 맺었다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘낯선 사람에게 네 손바닥을 쳤다면’입니다. 이는 손을 쳐 약정이나 보증을 확정하던 관습적 행위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 아들아
  - 내 아들
  lexicon: HALOT
  rationale: 잠언의 아버지-교사 호칭을 자연스러운 직접호격으로 살리되, 소유격 '내'로 친밀한 권면의 뉘앙스를 유지했습니다.
- source_word: עָרַבְתָּ
  english_pob_choice: have gone surety
  chosen_korean: 보증하였고
  alternatives_korean:
  - 보증인이 되었고
  - 연대보증하였고
  - 보증해 주었고
  lexicon: HALOT
  rationale: עָרַב의 법적·재정적 의미를 한국어 법률 감각에 맞게 간결하게 살려, 단순한 약속이 아니라 채무 보증 행위를 드러냈습니다.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  english_pob_choice: have struck your hands in pledge
  chosen_korean: 손을 잡아맹세하였다
  alternatives_korean:
  - 손을 맞잡았다
  - 손바닥을 마주쳤다
  - 손을 쳐서 약정하였다
  lexicon: HALOT
  rationale: 손을 치거나 맞잡는 관용적 제스처를 한국어에서 이해 가능한 한 표현으로 옮기되, 맹세·약정의 체결 행위를 드러내도록 했습니다.
- source_word: לַזָּר
  english_pob_choice: to a stranger
  chosen_korean: 낯선 사람에게
  alternatives_korean:
  - 외인에게
  - 외부인에게
  - 타인에게
  lexicon: HALOT
  rationale: זָר의 '낯선/외부의' 의미를 현대 표준어로 자연스럽게 전달하면서, 관계의 거리감을 유지했습니다.
theological_decisions:
- issue: 잠언의 교훈적 경구를 어떻게 한국어 호칭으로 살릴지
  chosen_reading: 직접호격 '내 아들아'를 사용해 지혜 교사의 권면 구조를 분명히 했습니다.
  alternative_readings:
  - '''아들아''로 더 간단히 처리'
  - 문맥상 일반 독자를 위해 호칭을 완화
  rationale: 원문의 교육적·권면적 호칭을 약화하지 않는 것이 중요하므로, 한국어에서도 장면의 음성을 그대로 드러냈습니다.
  doctrine_reference: 잠언의 지혜 교육 구조와 경구체 화법
- issue: 손잡음 제스처를 문자적으로 둘지 관용적으로 풀지
  chosen_reading: 원문 관용을 완전히 풀기보다, 한국어 독자가 이해할 수 있는 '손을 잡아맹세하였다'로 처리했습니다.
  alternative_readings:
  - '''손을 쳤다''처럼 더 문자적으로'
  - 주석 없이 '보증하였다'로만 평탄화
  rationale: 핵심은 보증 행위와 그 체결 제스처이므로, 과도한 직역이나 평탄화보다 의미가 드러나는 절충이 적절합니다.
  doctrine_reference: 잠언 6장의 지혜적 경고와 법적 관용구 이해
