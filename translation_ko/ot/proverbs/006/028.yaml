  lexicon: HALOT
  rationale: 문맥상 뜨겁게 타는 숯/불씨를 가리키므로, 한국어에서는 이미지가 즉각 전달되는 '숯불'이 가장 자연스럽습니다.
- source_word: תִכָּוֶינָה
