  rationale: 원문의 '시들게/그슬리게 타다'보다 한국어에서는 결과를 간명하게 드러내는 '타지'가 적절하며, 지나친 과장을 피합니다.
theological_decisions:
- issue: 수사적 질문의 형식
  chosen_reading: 직설적 조건문이 아니라, 앞절과 병행되는 반문으로 읽히도록 '-겠습니까?'를 사용했습니다.
  alternative_readings:
  - 만일 사람이 숯불 위를 걷는다면 그의 발이 타지 않습니까?
  - 사람이 숯불 위를 걸으면 그의 발이 타겠습니까?
  rationale: 지혜문학의 논증 방식에 맞게, 독자가 '그럴 수 없다'는 결론을 즉시 느끼도록 반문형을 살렸습니다.
  doctrine_reference: 잠언 6:27-28의 수사적 경고 구조
