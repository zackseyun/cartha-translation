  - ~하면
  lexicon: HALOT
  rationale: 히브리어 אִם이 여기서는 단순 조건문보다 수사적 질문을 여는 기능을 하므로, 한국어에서는 가능성 질문의 어조를 살린 '-겠습니까?'로 옮겼습니다.
- source_word: יְהַלֵּךְ
