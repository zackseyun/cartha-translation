  - 팔짱을 끼고
  lexicon: HALOT
  rationale: 직역상의 ‘손의 포옹’이라는 표현보다, 게으름과 무위의 자세를 드러내는 한국어로 ‘손을 모아’가 가장 자연스럽고 원뜻을 덜 훼손합니다.
- source_word: לִשְׁכָּב
  english_pob_choice: to lie down
  chosen_korean: 누워 있으면
  alternatives_korean:
  - 누우려 하면
  - 누워 지내면
  lexicon: HALOT
  rationale: 부정적 경고의 문맥에서 목적/결과를 드러내는 ‘누워 있으면’이 한국어 독자에게 자연스럽고, 단순한 동작보다 태도를 더 분명히 보여 줍니다.
theological_decisions:
- issue: 잠과 게으름의 경고를 직설적으로 유지할지 여부
  chosen_reading: 잠과 졸음, 손을 모아 누워 있는 자세를 그대로 제시해, 경구의 도덕적 경고를 약화하지 않았습니다.
  alternative_readings:
  - 부드럽게 풀어 ‘조금 쉬고, 조금 쉬며’처럼 완화하기
  - 해석을 보태 ‘게으르게 쉬고’로 명시하기
  rationale: 이 절은 경구의 리듬 자체가 경고의 힘을 형성하므로, 독자가 원문의 반복과 누적 효과를 그대로 느끼도록 직선적으로 옮기는 것이 적절합니다.
  doctrine_reference: 잠언의 지혜 교훈과 게으름 경계
- issue: 동사형화로 인한 의미 확장
  chosen_reading: 명사 나열을 한국어 시구로 옮기기 위해 일부를 동사형으로 풀었지만, ‘잠시/잠깐/손을 모아/누워 있으면’의 순차성은 원문 범위를 벗어나지 않도록 유지했습니다.
  alternative_readings:
  - 명사형을 억지로 맞춰 ‘조금의 잠, 조금의 졸음’으로 번역하기
  rationale: 히브리어의 압축된 병렬구조를 한국어에서 읽기 자연한 형태로 재현하기 위한 최소한의 문법적 조정입니다.
  doctrine_reference: 히브리 시편·잠언의 평행법 보존
