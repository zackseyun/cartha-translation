lexical_decisions:
- source_word: מְעַט
  english_pob_choice: a little
  chosen_korean: 잠시
  alternatives_korean:
  - 조금
  - 잠깐
  lexicon: HALOT
  rationale: 반복되는 מְעַט의 짧은 분량감을 한국어 관용에 맞게 간결하게 살리되, 반복 수사와 시구의 압축성을 유지하려고 했습니다.
- source_word: שֵׁנוֹת
  english_pob_choice: sleep
  chosen_korean: 잠들고
  alternatives_korean:
  - 잠
  - 수면
  lexicon: HALOT
  rationale: 원문의 명사형을 그대로 옮기기보다, 한국어에서는 동사적으로 풀어야 시적 병렬이 자연스럽습니다. 앞뒤의 ‘잠깐 졸며’와도 어울리게 했습니다.
- source_word: תְּנוּמוֹת
  english_pob_choice: slumber
  chosen_korean: 잠깐 졸며
  alternatives_korean:
  - 졸며
  - 선잠이 들며
  lexicon: HALOT
  rationale: ‘slumber’가 가리키는 가벼운 졸음의 뉘앙스를 살리기 위해 ‘잠깐 졸다’를 택했습니다. ‘잠’과의 평행도 유지됩니다.
- source_word: חִבֻּק יָדַיִם
  english_pob_choice: folding of the hands
  chosen_korean: 손을 모아
  alternatives_korean:
