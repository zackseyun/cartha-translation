  naturalness: ‘외국 여자의 매끄러운 혀에서’는 한국어에서 부자연스럽고 의미 관계가 불분명합니다. ‘외국 여자의 매끄러운 말에서’는 현대 표준어로 자연스러우며, 각주에서 문자적 ‘매끄러운 혀’를 밝혀 원문의 비유를 보존합니다. ‘지키기 위한 것입니다’는 앞절에 이어지는 목적 부정사를 합쇼체로 무리 없이 표현합니다.
  terminology: ‘악한 여자’는 אֵשֶׁת רָע의 도덕적 평가를 유지하고, ‘외국 여자’는 נָכְרִיָּה의 기본 어휘 의미를 보존합니다. ‘낯선 여자’ 및 더 좁은 ‘간음하는 여자’는 각주 대안으로만 제시합니다.
