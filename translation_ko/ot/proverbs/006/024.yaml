lexical_decisions:
- source_word: לִשְׁמָרְךָ
  english_pob_choice: to keep you
  chosen_korean: 지키려는 것입니다
  alternatives_korean:
  - 너를 지켜 주려는 것입니다
  - 너를 보호하려는 것입니다
  lexicon: WLC; HALOT
  rationale: 부정사 목적구로서 앞절의 결과/목적을 나타내므로, 현대 한국어에서는 자연스러운 목적 표현인 ‘지키려는 것입니다’로 옮겼습니다. ‘지키다’는 보호의 의미를 살리면서도 간결합니다.
- source_word: מֵאֵשֶׁת רָע
  english_pob_choice: the evil woman
  chosen_korean: 악한 여자
  alternatives_korean:
  - 악한 여인
  - 사악한 여자
  - 악한 아내
  lexicon: WLC; HALOT
  rationale: אֵשֶׁת은 문자적으로 ‘여자/아내’의 구성형이지만, 지혜문맥에서 유혹의 대상을 가리키므로 ‘여자’가 가장 직접적입니다. רָע의 강한 도덕적 평가를 ‘악한’으로 살렸습니다.
- source_word: מֵחֶלְקַת לָשׁוֹן
  english_pob_choice: from the smooth tongue
  chosen_korean: 매끄러운 혀
  alternatives_korean:
  - 부드러운 혀
  - 아첨하는 혀
  - 미끄러운 말
  lexicon: WLC; HALOT
  rationale: חֶלְקַת의 핵심은 ‘매끄러움/미끄러움’이므로, 이미지가 살아 있는 ‘매끄러운 혀’로 옮겼습니다. ‘아첨하는’은 해석을 더한 표현이므로 본문에는 두지 않았습니다.
- source_word: נָכְרִיָּה
  english_pob_choice: the foreign woman
  chosen_korean: 외국 여자
  alternatives_korean:
  - 이방 여자
  - 낯선 여자
  - 외국 여인
  lexicon: WLC; HALOT
  rationale: 기본 의미는 ‘외국/이방의’이므로, 본문 의미를 직접 반영하는 ‘외국 여자’를 택했습니다. 전통적 ‘낯선 여자’는 현대어에서 의미가 흐려질 수 있어 주본문에서는 피했습니다.
theological_decisions:
- issue: נָכְרִיָּה의 해석 범위
  chosen_reading: 본문에서는 ‘외국 여자’로 직역해, 도덕적 함의는 문맥과 병렬 표현(‘악한 여자’, ‘매끄러운 혀’)이 드러내게 했습니다.
  alternative_readings:
  - 낯선 여자
  - 음행하는 여자
  - 창녀
  rationale: 본문이 원어의 어휘 의미를 유지하도록 하면서도, 유혹과 타락의 경고는 전체 구절의 문맥에서 충분히 전달됩니다. 해석적 라벨로 좁혀 버리면 lexical tension이 사라집니다.
  doctrine_reference: 원어 우선 번역 원칙; 지혜문학의 어휘적 긴장 보존
