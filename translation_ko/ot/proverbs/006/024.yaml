translation:
  language: ko
  text: 너를 악한 여자에게서,[b] 외국 여자의 매끄러운 말에서[a] 지키기 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아첨하는 말’. 히브리어는 문자적으로 ‘매끄러운 혀’입니다.
