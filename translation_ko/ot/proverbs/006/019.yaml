revisions:
- from: 거짓 증언을 하며 거짓을 토해 내는 사람, 그리고 형제들 사이에 다툼을 일으키는 사람입니다.
  to: 거짓을 내뿜는 거짓 증인과 형제들 사이에 다툼을 일으키는 사람입니다.
  rationale: 원문의 두 항목을 한국어에서도 ‘거짓을 내뿜는 거짓 증인’과 ‘형제들 사이에 다툼을 일으키는 사람’으로 병렬시켰습니다. ‘내뿜는’은 פוח의 호흡 비유를 보존하면서도 ‘토해 내는’보다 현대 표준어의 격식 있는 성서 문체에 적합합니다. 현행 영어 주석은 한국어 본문에 별도 주석을 반드시 요구할 만큼의 번역상 손실을 일으키지 않으므로 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:38:10Z'
