source:
  edition: WLC
  text: יָפִ֣יחַ כְּ֭זָבִים עֵ֣ד שָׁ֑קֶר וּ/מְשַׁלֵּ֥חַ מְ֝דָנִ֗ים בֵּ֣ין אַחִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/019.yaml
  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
  footnotes:
  - marker: a
    text: Or 'a lying witness who utters falsehoods.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'between brothers'; this can refer literally to brothers or more broadly to close members of a community.
    reason: cultural_note
translation:
  language: ko
  text: 거짓을 내뿜는 거짓 증인과 형제들 사이에 다툼을 일으키는 사람입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָפִיחַ כְּזָבִים
  english_pob_choice: breathes out lies
  chosen_korean: 거짓을 토해 내는
  alternatives_korean:
  - 거짓말을 내뱉는
  - 거짓을 내뿜는
  - 거짓을 말하는
  lexicon: HALOT
  rationale: ‘breathes out’의 숨을 내뿜는 비유를 살리면서, 한국어에서는 ‘토해 내다’가 거짓을 밖으로 쏟아내는 강한 이미지와 어울립니다.
- source_word: עֵד שָׁקֶר
  english_pob_choice: a false witness
  chosen_korean: 거짓 증언을 하는 사람
  alternatives_korean:
  - 거짓 증인
  - 거짓된 증인
  - 거짓 증언자
  lexicon: HALOT
  rationale: 히브리어는 법정적 의미의 ‘거짓 증언하는 증인’이므로, 한국어에서도 행위를 드러내는 표현이 가장 분명합니다.
- source_word: וּמְשַׁלֵּחַ מְדָנִים
  english_pob_choice: one who sends out strife
  chosen_korean: 다툼을 일으키는 사람
  alternatives_korean:
  - 분쟁을 퍼뜨리는 사람
  - 다툼을 보내는 사람
  - 분쟁을 조장하는 사람
  lexicon: HALOT
  rationale: 문자적으로는 ‘보내다’이지만, 문맥상 분쟁을 적극적으로 촉발하는 뜻이므로 한국어에서는 관용적으로 자연스러운 ‘일으키다’가 가장 잘 맞습니다.
- source_word: בֵּין אַחִים
  english_pob_choice: among brothers
  chosen_korean: 형제들 사이에
  alternatives_korean:
  - 형제들 가운데
  - 형제 사이에
  - 동료들 사이에
  lexicon: HALOT
  rationale: 직역하면 ‘형제들 사이에’이며, 남성 복수형을 유지해 원문의 친족·공동체적 관계를 보존합니다.
theological_decisions:
- issue: אַחִים의 성별 표지 유지
  chosen_reading: 형제들
  alternative_readings:
  - 형제자매
  - 동료들
  - 사람들
  rationale: 지혜문학의 일반적 남성 복수 표지를 지우지 않고, 원문의 관계 언어를 그대로 드러내는 쪽이 본문 충실성에 더 부합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
