  terminology: ‘거짓 증인’은 עֵד שָׁקֶר의 통상적이고 법정적인 한국어 대응어입니다. ‘형제들’은 אַחִים의 남성 복수형을 유지하며, ‘다툼을 일으키는’은 문맥상 מְשַׁלֵּחַ מְדָנִים의 능동적 분쟁 조성 의미를 자연스럽게 전달합니다.
