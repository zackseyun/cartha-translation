translation:
  language: ko
  text: 불량한 사람, 악한 사람은 비뚤어진 말을[a] 하며 다닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘비뚤어진 입으로.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: HALOT
  rationale: 지혜문학의 일반적 개인 유형을 가리키므로, 성별을 지나치게 강조하는 '남자'보다 현대 한국어에서 자연스러운 '사람'으로 옮겼습니다. 병행하는 אִישׁ의 개인적 지시도 유지됩니다.
- source_word: בְּלִיַּעַל
  english_pob_choice: worthless
  chosen_korean: 무가치한
  alternatives_korean:
  - 쓸모없는
  - 비열한
  - 벨리알의
  lexicon: HALOT
  rationale: 이 표현은 고유명사 '벨리알'이 아니라 인격의 무가치함을 나타내는 형용사적 용법이므로, 도덕적 타락을 드러내면서도 과도하게 해석하지 않는 '무가치한'을 선택했습니다.
- source_word: אָוֶן
  english_pob_choice: wickedness
  chosen_korean: 악행
  alternatives_korean:
  - 악
  - 불의
  - 죄악
  lexicon: HALOT
  rationale: 문맥상 단순한 재난이나 막연한 '악'이 아니라 도덕적 왜곡과 악한 행위를 가리키므로, פָּתִיל한 추상명사보다 한국어에서 의미가 분명한 '악행'으로 옮겼습니다.
- source_word: עִקְּשׁוּת פֶּה
  english_pob_choice: perverse mouth
  chosen_korean: 비뚤어진 입
  alternatives_korean:
  - 뒤틀린 입
  - 비뚤어진 말
  - 구부러진 입
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 '입'을 살리되, 실제 의미는 말의 왜곡에 있으므로 한국어에서도 직접적이면서도 자연스러운 '비뚤어진 입'으로 옮겼습니다.
theological_decisions:
- issue: אָוֶן의 도덕적 강도
  chosen_reading: '''악행''은 본문의 도덕적 비난을 유지하면서도 한국어 독자가 즉시 이해할 수 있는 표현으로 처리했습니다.'
  alternative_readings:
  - 악
  - 불의
  - 죄악
  rationale: 이 절은 단순한 성격 묘사가 아니라 악한 행실을 특징짓는 경구이므로, 의미를 약화시키지 않는 범위에서 행위성을 드러내는 번역이 적절합니다.
  doctrine_reference: 잠언의 지혜 경구는 인격과 행위의 도덕적 실재를 드러내며, 용어 선택은 그 윤리적 경고를 흐리지 않아야 합니다.
