theological_decisions:
- issue: 수사적 경고의 강도
  chosen_reading: ‘탐내지 마십시오… 붙들리지 마십시오’로 직설적 금지를 유지했습니다.
  alternative_readings:
  - 부드럽게 경계하라
  - 마음 두지 마십시오
  rationale: 잠언의 교훈은 단순 조언보다 경고의 성격이 강하므로, 원문의 금지형을 약화시키지 않았습니다.
  doctrine_reference: 지혜문학의 권면과 도덕적 자기절제
- issue: 신체 은유의 처리
  chosen_reading: ‘눈매’로 옮겨 노골적 성적 표현으로 과잉 전환하지 않았습니다.
  alternative_readings:
  - 속눈썹
  - 눈꺼풀
  - 눈길
  rationale: 원문은 육체적 세부를 통해 유혹의 감각적 힘을 말하므로, 의미를 유지하면서도 현대 한국어에서 자연스러운 표현을 선택했습니다.
  doctrine_reference: 문학적 은유의 보존
