source:
  edition: WLC
  text: אַל תַּחְמֹ֣ד יָ֭פְיָ/הּ בִּ/לְבָבֶ֑/ךָ וְ/אַל תִּ֝קָּֽחֲ/ךָ֗ בְּ/עַפְעַפֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/025.yaml
  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
  footnotes:
  - marker: a
    text: Or 'do not covet her beauty in your heart.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'do not let her take you with/by her eyelids'; the image is of seductive eye-appeal.
    reason: lexical_alternative
translation:
  language: ko
  text: 음욕을 품고 마음속으로 그 여자의 아름다움을 탐내지 마십시오[a], 또 그 여자의 눈매에 붙들리지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자의 아름다움을 마음속에서 탐내지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 여자의 눈꺼풀/속눈썹에 의해 또는 그것과 함께 붙들리지 마십시오’로, 유혹적인 눈매의 이미지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  english_pob_choice: desire
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 욕망하지 마십시오
  - 원하지 마십시오
  - 탐하지 마십시오
  lexicon: HALOT
  rationale: חמד의 내적 갈망과 탐심의 뉘앙스를 살리되, 잠언의 경계문답게 도덕적 긴장감을 유지하기 위해 ‘탐내다’를 택했습니다.
- source_word: יָפְיָהּ
  english_pob_choice: her beauty
  chosen_korean: 그 여자의 아름다움
  alternatives_korean:
  - 그 여자의 미모
  - 그 여자의 매력
  - 그 여자의 곱디고운 모습
  lexicon: HALOT
  rationale: יֹפִי의 가장 직접적인 의미인 ‘아름다움’을 유지해, 외적 매혹의 대상을 분명히 드러냈습니다.
- source_word: בִּלְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음에
  - 마음 안에서
  - 마음속에
  lexicon: HALOT
  rationale: 히브리어의 내면적 인지·욕구의 장을 한국어로 자연스럽게 옮기되, ‘마음속으로’로 행위 이전의 내적 동의를 강조했습니다.
- source_word: תִּקָּחֲךָ בְּעַפְעַפֶּיהָ
  english_pob_choice: let yourself be captured by her eyelashes
  chosen_korean: 그 여자의 눈매에 붙들리지 마십시오
  alternatives_korean:
  - 그 여자의 속눈썹에 사로잡히지 마십시오
  - 그 여자의 눈꺼풀에 이끌리지 마십시오
  - 그 여자의 눈길에 붙잡히지 마십시오
  lexicon: HALOT
  rationale: 문자적으로는 ‘눈꺼풀/속눈썹’이지만, 한국어에서는 유혹의 시각적 표지로 자연스럽게 전달되는 ‘눈매’가 과도한 설명 없이 이미지와 의미를 함께 살립니다.
theological_decisions:
- issue: 수사적 경고의 강도
  chosen_reading: ‘탐내지 마십시오… 붙들리지 마십시오’로 직설적 금지를 유지했습니다.
  alternative_readings:
  - 부드럽게 경계하라
  - 마음 두지 마십시오
  rationale: 잠언의 교훈은 단순 조언보다 경고의 성격이 강하므로, 원문의 금지형을 약화시키지 않았습니다.
  doctrine_reference: 지혜문학의 권면과 도덕적 자기절제
- issue: 신체 은유의 처리
  chosen_reading: ‘눈매’로 옮겨 노골적 성적 표현으로 과잉 전환하지 않았습니다.
  alternative_readings:
  - 속눈썹
  - 눈꺼풀
  - 눈길
  rationale: 원문은 육체적 세부를 통해 유혹의 감각적 힘을 말하므로, 의미를 유지하면서도 현대 한국어에서 자연스러운 표현을 선택했습니다.
  doctrine_reference: 문학적 은유의 보존
