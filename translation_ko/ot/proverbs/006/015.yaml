  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞 구절의 묘사에 따른 결과를 나타내는 연결어로, 문맥상의 인과를 자연스럽고 분명하게 살립니다.
