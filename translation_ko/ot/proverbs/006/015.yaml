source:
  edition: WLC
  text: עַל כֵּ֗ן פִּ֭תְאֹם יָב֣וֹא אֵיד֑/וֹ פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/015.yaml
  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
  footnotes:
  - marker: a
    text: Or 'his calamity will come' / 'his ruin will come.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with no remedy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그의 재난이 갑자기 닥치고[a], 순식간에 부서지며[b], 치유함이 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 재앙이 올 것입니다’ / ‘그의 멸망이 올 것입니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘치료할 수 없게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞 구절의 묘사에 따른 결과를 나타내는 연결어로, 문맥상의 인과를 자연스럽고 분명하게 살립니다.
- source_word: פִּתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 돌연히
  - 뜻밖에
  lexicon: HALOT
  rationale: ‘갑작스러움’을 직접 드러내는 현대 한국어 표현으로, 첫 번째 급작성의 뉘앙스를 살립니다.
- source_word: יָבֹוא אֵידוֹ
  english_pob_choice: his disaster will come
  chosen_korean: 그의 재난이 닥치고
  alternatives_korean:
  - 그의 재앙이 찾아오고
  - 그의 멸망이 닥치고
  lexicon: HALOT
  rationale: אֵיד의 재난·재앙·멸망 범위를 반영하되, 지혜문학 경고의 어조에 맞는 ‘재난’과 도착 동사 ‘닥치다’를 택했습니다.
- source_word: יִשָּׁבֵר
  english_pob_choice: he will be broken
  chosen_korean: 부서지며
  alternatives_korean:
  - 깨어지며
  - 산산이 부서지며
  lexicon: HALOT
  rationale: 수동적 결과를 살리면서도 한국어에서 육체적·삶의 붕괴까지 포괄할 수 있는 표현으로 옮겼습니다.
- source_word: וְאֵין מַרְפֵּא
  english_pob_choice: and there will be no healing
  chosen_korean: 치유함이 없을 것입니다
  alternatives_korean:
  - 회복될 길이 없을 것입니다
  - 고칠 방도가 없을 것입니다
  lexicon: HALOT
  rationale: מַרְפֵּא의 치료·회복 의미를 살리되, 시구의 종결감과 단정을 주는 현대어로 표현했습니다.
theological_decisions:
- issue: 두 개의 급작성 부사 פִּתְאֹם / פֶּתַע의 처리
  chosen_reading: ‘갑자기’와 ‘순식간에’로 나누어 번역해, 반복된 급작성의 강조를 유지했습니다.
  alternative_readings:
  - 둘 다 ‘갑자기’로 통일
  - ‘뜻밖에’와 ‘순식간에’로 번역
  rationale: 히브리어는 유사어를 병렬해 긴박감을 강화하므로, 한국어에서도 동일어 반복보다 미세한 차이를 두는 편이 본문의 수사적 힘을 더 잘 드러냅니다.
  doctrine_reference: 잠언의 지혜/경고 문맥에서의 수사적 강조
