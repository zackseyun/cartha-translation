  - 고칠 방도가 없을 것입니다
  lexicon: HALOT
  rationale: מַרְפֵּא의 치료·회복 의미를 살리되, 시구의 종결감과 단정을 주는 현대어로 표현했습니다.
theological_decisions:
- issue: 두 개의 급작성 부사 פִּתְאֹם / פֶּתַע의 처리
  chosen_reading: ‘갑자기’와 ‘순식간에’로 나누어 번역해, 반복된 급작성의 강조를 유지했습니다.
  alternative_readings:
  - 둘 다 ‘갑자기’로 통일
  - ‘뜻밖에’와 ‘순식간에’로 번역
  rationale: 히브리어는 유사어를 병렬해 긴박감을 강화하므로, 한국어에서도 동일어 반복보다 미세한 차이를 두는 편이 본문의 수사적 힘을 더 잘 드러냅니다.
  doctrine_reference: 잠언의 지혜/경고 문맥에서의 수사적 강조
