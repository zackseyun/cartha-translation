  rationale: 수동적 결과를 살리면서도 한국어에서 육체적·삶의 붕괴까지 포괄할 수 있는 표현으로 옮겼습니다.
- source_word: וְאֵין מַרְפֵּא
  english_pob_choice: and there will be no healing
  chosen_korean: 치유함이 없을 것입니다
