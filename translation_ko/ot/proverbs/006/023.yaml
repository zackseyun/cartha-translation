  - marker: b
    text: '''징계의 책망'' 또는 ''교정적인 책망''으로 번역할 수 있음. 히브리어 구절은 언어적 교정 (תּוֹכְחוֹת) 과 형식적 훈련 (מוּסָר) 을 결합하고 있음.'
