base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
  footnotes:
  - marker: a
    text: Or 'teaching' for 'instruction' (תּוֹרָה); in this wisdom context the term likely refers to authoritative teaching rather than specifically 'law.'
    reason: lexical_alternative
  - marker: b
    text: Or 'rebukes of discipline' or 'corrective rebukes'; the Hebrew phrase combines verbal correction (תּוֹכְחוֹת) with formative discipline (מוּסָר).
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 계명이 등불이고, 교훈[a]이 빛이며, 징계의 책망[b]이 생명의 길이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘교훈’은 ‘가르침’ 또는 ‘율법’으로도 번역할 수 있습니다. 이 지혜 문맥에서는 구체적으로 율법이라기보다 권위 있는 가르침을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘징계의 책망’은 ‘징계의 꾸짖음’ 또는 ‘교정적인 책망’으로도 번역할 수 있습니다. 히브리어는 언어적 교정(תּוֹכְחוֹת)과 사람을 형성하는 징계(מוּסָר)를 결합합니다.
    reason: lexical_alternative
