  yaml_path: translation/ot/proverbs/006/002.yaml
  text: you have been snared by the words of your mouth[a]; you have been caught by the words of your mouth.
  footnotes:
  - marker: a
    text: Or 'you are trapped by the words of your mouth.' The Hebrew perfects may be rendered with present-result force in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 입술의 말에 걸렸고, 당신은 입술의 말에 사로잡혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 שני 동사는 완료형이지만, 한국어에서는 현재 결과를 드러내는 말투로도 자연스럽게 읽힙니다.
    reason: source_note
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  english_pob_choice: you have been snared
  chosen_korean: 걸렸고
  alternatives_korean:
  - 덫에 걸렸고
  - 함정에 빠졌고
  - 포획되었고
  lexicon: HALOT
  rationale: 피동형 ‘걸리다’는 함정이나 올가미에 ‘snared’된 이미지를 자연스럽게 살리며, 다음 반절의 ‘사로잡히다’와 평행을 이룹니다.
- source_word: בְאִמְרֵי
  english_pob_choice: by the words of
  chosen_korean: 입술의 말에
  alternatives_korean:
  - 당신의 말로
  - 당신의 입에서 나온 말에
  - 말들에
  lexicon: HALOT
  rationale: 히브리어는 ‘말씀/말’(אִמְרֵי)과 ‘입술/입’(פִיךָ)을 직결시키므로, ‘입술의 말’로 옮겨 입에서 나온 말이라는 구체적 이미지를 보존했습니다.
- source_word: פִיךָ
  english_pob_choice: your mouth
  chosen_korean: 입술의
  alternatives_korean:
  - 입의
  - 당신의 입의
  lexicon: HALOT
  rationale: 직역의 ‘입’보다 한국어에서 더 자연스럽고 시적 병렬을 살릴 수 있는 ‘입술’을 택해, 말이 사람의 발화기관에서 나와 자신을 얽는다는 점을 드러냈습니다.
- source_word: נִלְכַּדְתָּ
  english_pob_choice: you have been caught
  chosen_korean: 사로잡혔습니다
  alternatives_korean:
  - 붙잡혔습니다
  - 포로가 되었습니다
  - 잡혔습니다
  lexicon: HALOT
  rationale: ‘caught’의 기본 뜻을 유지하면서도, 앞 절의 ‘걸리다’보다 한층 강한 포획·구속의 느낌을 주는 ‘사로잡히다’가 평행구문에 적절합니다.
theological_decisions:
- issue: 비유적 구속 이미지의 강도
  chosen_reading: ‘걸렸고… 사로잡혔습니다’로 두 동사를 분리해, 말이 덫과 포획의 원인이 되는 경고를 그대로 살렸습니다.
  alternative_readings:
  - ‘함정에 빠졌고… 붙잡혔습니다’
  - ‘덫에 걸렸고… 잡혔습니다’
  rationale: 잠언의 경구적 경고를 약화하지 않기 위해, 도덕적 자책이 아니라 실제 포획의 이미지를 유지했습니다.
  doctrine_reference: 잠언 6:1–5의 지혜 경고와 책임 언어
