id: PRO.6.22
reference: Proverbs 6:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
  footnotes:
  - marker: a
    text: Or, 'she will speak with you.' The Hebrew has a feminine pronoun, referring to the commandment/teaching in the immediate context and echoing Proverbs' broader personification of wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 걸을 때에는 그것이 너를 인도하고, 네가 누울 때에는 그것이 너를 지키며, 네가 깨어날 때에는 그것이 너와 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성 단수 대명사를 사용하며, 앞 문맥의 여성형 ‘명령’과 ‘가르침’을 가리킵니다. 본문의 ‘그것이’는 이를 가리키며, 문맥의 의인화를 드러내어 ‘그녀가’로 옮길 수도 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  english_pob_choice: when you walk
  chosen_korean: 네가 걸어갈 때에는
  alternatives_korean:
  - 네가 다닐 때에는
  - 네가 행할 때에는
  lexicon: HALOT
  rationale: 히트파엘 형태와 시간적 ב를 따라 일상의 ‘걸어감’으로 옮기되, 잠자기/깨어남과 병렬되는 생활 전체의 흐름을 살려 ‘걸어갈 때’로 자연스럽게 번역했습니다.
- source_word: תַּנְחֶה אֹתָךְ
  english_pob_choice: it will guide you
  chosen_korean: 그것이 너를 인도하고
  alternatives_korean:
  - 그것이 너를 안내하고
  - 그것이 너를 이끌고
  lexicon: HALOT
  rationale: נחה의 ‘인도하다/이끌다’ 의미를 살려 지혜의 가르침이 길을 잡아 주는 뉘앙스를 유지했습니다.
- source_word: תִּשְׁמֹר עָלֶיךָ
  english_pob_choice: it will watch over you
  chosen_korean: 그것이 너를 지키며
  alternatives_korean:
  - 그것이 너를 지켜 주며
  - 그것이 너를 보호하며
  lexicon: HALOT
  rationale: שׁמר עַל의 보호·감시 의미를 한국어의 ‘지키다’로 간결하게 옮겼습니다.
- source_word: הִיא תְשִׂיחֶךָ
  english_pob_choice: it will speak with you
  chosen_korean: 그것이 너와 말할 것입니다
  alternatives_korean:
  - 그것이 너와 이야기할 것입니다
  - 그것이 너에게 말할 것입니다
  - 그녀가 너와 말할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 여성형 대명사는 앞선 여성형 명사(명령/가르침)를 가리키지만, 한국어 본문에서는 추상적 지시 대상에 맞춰 ‘그것’으로 두고, שׂיח의 상호적 대화를 ‘너와 말하다’로 옮겼습니다.
theological_decisions:
- issue: 여성형 대명사 הִיא의 처리
  chosen_reading: 본문은 ‘그것’으로 옮기고, 여성형 표지는 각주 없이 본문 의미에 반영했습니다.
  alternative_readings:
  - ‘그녀가’로 옮겨 지혜/가르침의 여성적 의인화를 더 분명히 드러내기
  - ‘그것이’로 옮겨 추상적 지시를 자연스럽게 처리하기
  rationale: 문맥상 여성형은 앞선 ‘명령/가르침’의 히브리어 성에 따른 것이며, 한국어에서는 이를 그대로 인격화하기보다 자연스러운 추상 지시로 전달하는 편이 본문의 의도를 잘 보존합니다.
  doctrine_reference: 번역 원칙 §5, §6 (문맥 충실성과 현대어 가독성)
