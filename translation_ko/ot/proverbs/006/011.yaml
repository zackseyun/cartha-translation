base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/011.yaml
  text: and your poverty will come like a prowler[b][a], and your lack like an armed man.
  footnotes:
  - marker: a
    text: Or, more literally, 'like one who walks about.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'like a man with a shield.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 가난이 [a] 배회하는 사람처럼 닥치고, 너의 궁핍이 [b] 무장한 사람처럼 닥칠 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘걸어 다니는 사람처럼’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘방패를 든 사람처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  english_pob_choice: and ... will come
  chosen_korean: 올 것입니다
  alternatives_korean:
  - 옵니다
  - 찾아올 것입니다
  lexicon: BDB/HALOT
  rationale: 잠언의 경고적 문맥에서 완료형의 결과적 미래 뉘앙스를 한국어로 자연스럽게 살려 ‘올 것입니다’로 옮겼습니다.
- source_word: כִמְהַלֵּךְ
  english_pob_choice: like a prowler
  chosen_korean: …처럼
  alternatives_korean:
  - 돌아다니는 사람처럼
  - 배회하는 사람처럼
  lexicon: HALOT
  rationale: 영어 POB가 footnote로 남긴 문자적 뜻을 반영해, 본문에서는 위협적 비유의 강도를 살리되 보다 자연스럽게 ‘…처럼’으로 처리하고 문자적 의미는 각주로 보완했습니다.
- source_word: וּמַחְסֹרְךָ
  english_pob_choice: and your lack
  chosen_korean: 너의 궁핍
  alternatives_korean:
  - 너의 결핍
  - 너의 부족
  lexicon: HALOT
  rationale: מַחְסוֹר는 단순한 ‘부족’보다 실질적 결핍과 궁핍을 가리키므로, 앞의 ‘가난’과 평행을 이루는 한국어로 ‘궁핍’을 택했습니다.
- source_word: מָגֵן
  english_pob_choice: armed / man with a shield
  chosen_korean: 무장한 사람
  alternatives_korean:
  - 방패를 든 사람
  - 방패를 가진 사람
  lexicon: HALOT
  rationale: 문자적으로는 ‘방패를 가진 사람’이지만, 관용적 위협 이미지를 살리기 위해 본문은 ‘무장한 사람’으로 옮기고, 문자적 대안은 각주로 남겼습니다.
theological_decisions:
- issue: 잠언의 의인화된 비유를 어떻게 유지할 것인가
  chosen_reading: 가난과 궁핍이 실제로 다가오는 존재처럼 묘사되는 문학적 비유를 그대로 유지했습니다.
  alternative_readings:
  - 가난이 닥칠 것입니다
  - 궁핍이 찾아올 것입니다
  rationale: 이 절은 도덕적 경고를 위해 가난과 궁핍을 인격화하는 잠언의 수사이므로, 비유의 긴장감을 약화시키지 않도록 유지했습니다.
  doctrine_reference: 잠언의 지혜 문학적 표현
