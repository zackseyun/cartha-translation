translation:
  language: ko
  text: 언제까지입니까, 게으른 자여? 언제 잠에서 일어나겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지입니까
  alternatives_korean:
  - 얼마나 더 그러시겠습니까
  - 언제입니까
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간 질문을 한국어 경책 문맥에 맞게 자연스럽게 옮겼습니다. 반문·책망의 톤을 살리기 위해 종결을 합쇼체 의문형으로 처리했습니다.
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 자
  alternatives_korean:
  - 게으른 사람
  - 나태한 자
  lexicon: HALOT
  rationale: 잠언의 지혜어법에서 반복되는 규범적 표현을 살려 ‘게으른 자’로 옮겼습니다. ‘sluggard’의 경구적·경책적 뉘앙스를 유지하면서도 현대 한국어에서 읽히게 했습니다.
- source_word: תִּשְׁכָּב / תָּקוּם / מִשְּׁנָתֶךָ
  english_pob_choice: will you lie there / will you rise / from your sleep
  chosen_korean: 잠에서 일어나겠습니까
  alternatives_korean:
  - 그대로 누워 있겠습니까
  - 잠에서 깨어나겠습니까
  - 일어나겠습니까
  lexicon: HALOT
  rationale: 두 번째 질문을 한국어에서는 한 덩어리로 자연스럽게 묶어, 침대에 누워 있는 지속 상태와 그 상태에서의 기상 여부를 함께 드러냈습니다. ‘잠’은 מִשְּׁנָה의 직접 대응이며, ‘일어나다’는 תָּקוּם의 기본 의미를 충실히 반영합니다.
theological_decisions:
- issue: 책망하는 지혜문학의 직접 호칭 톤
  chosen_reading: ‘게으른 자여’는 경책의 직설성을 유지하고, 의문형을 합쇼체로 처리해 현대 한국어에서도 예언자적 책망의 날카로움을 살렸습니다.
  alternative_readings:
  - ‘게으른 사람아’
  - ‘나태한 자여’
  rationale: 본문은 단순 정보가 아니라 경고와 책망의 수사이므로, 완곡하게 순화하지 않고 직접 호칭을 유지하는 것이 소스의 의도에 가깝습니다.
  doctrine_reference: 잠언의 훈계와 권면의 수사
- issue: 반복 질문의 리듬
  chosen_reading: 두 개의 질문을 분리하되 한국어에서 가장 자연스러운 순서로 배치하여 히브리어의 압박감 있는 반복을 보존했습니다.
  alternative_readings:
  - 한 문장으로 합쳐 번역
  - 더 설명적으로 풀어 번역
  rationale: 원문은 연속된 두 질문으로 게으름을 꾸짖습니다. 이를 유지해야 본문의 수사적 긴장이 살아납니다.
  doctrine_reference: 지혜문학의 수사 구조
