id: PRO.6.14
reference: Proverbs 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּֽהְפֻּכ֨וֹת בְּ/לִבּ֗/וֹ חֹרֵ֣שׁ רָ֣ע בְּ/כָל עֵ֑ת מדנים יְשַׁלֵּֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/014.yaml
  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
  footnotes:
  - marker: a
    text: Or 'he stirs up strife.' The Hebrew literally says 'he sends out strife,' an idiom for causing or spreading conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음에는 비뚤어진 것들이 있고, 그는 늘 악을 꾀하며, 다툼을 퍼뜨립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘다툼을 보낸다’는 뜻이지만, 관용적으로는 갈등을 조장하거나 퍼뜨린다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהְפֻּכ֨וֹת
  english_pob_choice: Perversity
  chosen_korean: 비뚤어진 것들
  alternatives_korean:
  - 패역
  - 사악함
  - 삐뚤어짐
  lexicon: HALOT
  rationale: 복수형 추상명사의 도덕적 뒤틀림을 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다. 단수 명사처럼 굳히기보다 내부의 왜곡 상태를 드러내기 위해 복수감이 남도록 했습니다.
- source_word: חֹרֵשׁ רָע
  english_pob_choice: he devises evil
  chosen_korean: 악을 꾀하며
  alternatives_korean:
  - 악을 도모하며
  - 악을 계획하며
  - 악을 궁리하며
  lexicon: HALOT
  rationale: חורש은 문자적으로 ‘갈다’이지만 지혜문학에서는 ‘꾀하다/도모하다’의 뜻으로 쓰이므로, 의도적으로 악을 설계하는 뉘앙스를 살려 옮겼습니다.
- source_word: בְּכָל עֵת
  english_pob_choice: at all times
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 언제나
  - 모든 때에
  lexicon: HALOT
  rationale: 지속적·상습적 행동을 간결하게 드러내는 한국어로 ‘늘’을 택했습니다. 시간 표현의 반복성을 유지하면서 문장 흐름을 자연스럽게 했습니다.
- source_word: מְדָנִים יְשַׁלֵּחַ
  english_pob_choice: he sends out strife
  chosen_korean: 다툼을 퍼뜨립니다
  alternatives_korean:
  - 다툼을 보냅니다
  - 다툼을 내보냅니다
  - 다툼을 일으킵니다
  lexicon: HALOT
  rationale: 히브리어의 직역적 ‘보내다’는 한국어에서 어색하므로, POB 주석이 밝힌 관용적 의미인 갈등의 확산을 살려 ‘퍼뜨립니다’로 옮겼습니다.
theological_decisions:
- issue: 마음과 행위의 병렬 구조
  chosen_reading: ‘그의 마음에는 비뚤어진 것들이 있고’와 ‘그는 늘 악을 꾀하며’와 ‘다툼을 퍼뜨립니다’를 병렬로 유지해, 내적 왜곡과 지속적 악행과 대인 갈등 조장을 함께 드러냈습니다.
  alternative_readings:
  - ‘그 마음은 비뚤어져 있습니다’처럼 의역하여 단순화함
  - ‘그는 다툼을 일으킵니다’로 결과를 일반화함
  rationale: 이 절은 내면 상태, 상시적 의도, 외적 결과를 차례로 보여 주므로, 각 항목의 긴장과 단계성을 보존하는 것이 본문의 수사와 윤리를 더 정확히 전달합니다.
  doctrine_reference: '잠언의 지혜 윤리: 내면의 왜곡이 지속적 행위와 공동체 해악으로 이어진다는 인과 구조'
