id: PRO.6.20
reference: Proverbs 6:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
  footnotes:
  - marker: a
    text: Or 'Guard, my son, your father's command; and do not abandon your mother's teaching.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 네 아버지의 명령을 지키고[a] 네 어머니의 가르침을 버리지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지키고’는 ‘간직하고’ 또는 ‘보호하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצֹר
  english_pob_choice: Keep
  chosen_korean: 지키고
  alternatives_korean:
  - 간직하고
  - 보호하고
  - 지켜
  lexicon: HALOT
  rationale: נצר는 단순 보유보다 ‘주의 깊게 지키다/보호하다’의 뉘앙스가 있어, 합쇼체에서 자연스럽고 권면의 힘을 살리는 ‘지키다’로 옮겼습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어의 남성 단수·1인칭 접미를 살려 친밀한 훈계 호칭인 ‘내 아들아’로 옮겼습니다.
- source_word: מִצְוַת
  english_pob_choice: commandment
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 명령문
  - 가르침
  lexicon: HALOT
  rationale: מִצְוָה는 명령/계명의 의미가 있으나, 잠언의 부모 훈계 문맥에서는 법조항보다 권위 있는 지시로서의 ‘명령’이 가장 직접적입니다.
- source_word: תּוֹרַת
  english_pob_choice: instruction
  chosen_korean: 가르침
  alternatives_korean:
  - 교훈
  - 율법
  - 교육
  lexicon: HALOT
  rationale: 여기서 תּוֹרָה는 제도적 ‘율법’보다 형성적 ‘가르침/교훈’을 뜻하므로, 부모의 훈계를 드러내는 ‘가르침’으로 번역했습니다.
theological_decisions:
- issue: 부모 훈계의 병렬 구조를 어떻게 살릴 것인가
  chosen_reading: ‘아버지의 명령’과 ‘어머니의 가르침’을 대구로 유지해, 지혜문학의 권면 구조를 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - ‘아버지의 계명’과 ‘어머니의 교훈’
  - ‘아버지의 명령’과 ‘어머니의 가르침’ 대신 더 중립적인 표현
  rationale: 본문은 아버지/어머니를 병렬로 제시해 전통의 연속성을 강조하므로, 둘 사이의 문체 균형을 유지하는 것이 중요합니다.
  doctrine_reference: 잠언의 지혜교육과 부모 권위에 대한 성경적 강조
