  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
  footnotes:
  - marker: a
    text: Literally, 'seven abominations to his soul,' that is, seven things abhorrent to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 미워하시는 것은 여섯 가지요, 그분이 가증히 여기시는 것은 일곱 가지입니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그분의 혼/자기에게 가증한 일곱 가지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁשׁ הֵ֭נָּה
  english_pob_choice: There are six things
  chosen_korean: 여섯 가지는
  alternatives_korean:
  - 여섯 가지가 있습니다
  - 여섯 가지는 있습니다
  lexicon: HALOT
  rationale: 히브리어의 수사적 수/수+1 도식은 한국어에서 존재문으로 풀기보다 항목 제시형으로 옮기는 것이 더 자연스러워, 첫 항목을 ‘여섯 가지는’으로 시작해 다음 절과 평행을 이루게 했습니다.
- source_word: שָׂנֵא
  english_pob_choice: hates
  chosen_korean: 미워하시는
  alternatives_korean:
  - 증오하시는
  - 싫어하시는
  lexicon: HALOT
  rationale: 단순한 호불호보다 강한 도덕적 혐오를 나타내므로 ‘미워하다’가 직역성과 자연성을 함께 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공개본 원칙에 따라 신명은 전통적 대체어가 아니라 음역형 ‘야훼’로 옮겨, 본문의 고유 신명성을 보존했습니다.
- source_word: תועבות
  english_pob_choice: an abomination
  chosen_korean: 혐오하시는 것
  alternatives_korean:
  - 가증한 것
  - 역겨워하시는 것
  lexicon: HALOT
  rationale: ‘toʿevot’의 강한 종교·도덕적 혐오를 살리되, 한국어 관용과 공공성에 맞게 ‘혐오하시는 것’으로 옮겼습니다. 영문 POB의 단수 클래스 표현을 따라 뒤 절의 서술과 결합했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: to him
  chosen_korean: 그분께서
  alternatives_korean:
  - 그의 혼에
  - 그분 자신에게
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의 נפש(혼/자기)’이지만, 한국어에서는 인격적 귀속을 자연스럽게 드러내는 ‘그분께서’가 히브리어 관용을 가장 정확하게 전달합니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 야훼의 고유명을 직접 사용하므로, 이를 제목어로 대치하지 않고 고유명 자체를 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נפשׁוֹ의 인격적 표현을 한국어에서 어떻게 처리할지
  chosen_reading: 그분께서 혐오하시는 것
  alternative_readings:
  - 그분의 혼이 혐오하는 것
  - 그분의 영혼이 혐오하는 것
  rationale: ‘그의 נפש’는 여기서 신체-영혼 이분법을 말하기보다 인격 전체를 가리키는 관용이므로, 한국어에서는 신학적 오해를 피하면서도 강도를 유지하는 방향이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense without unnecessary paraphrase'
