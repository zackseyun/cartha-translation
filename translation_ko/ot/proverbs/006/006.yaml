  naturalness: ‘그 길들을 살펴보고’는 한국어에서 개미의 실제 이동 경로를 떠올리게 하고 다소 어색합니다. ‘개미의 행동을 살펴보고’는 지혜문학 문맥의 관찰과 배움이라는 뜻을 자연스럽고 현대적인 합쇼체로 전달합니다.
  terminology: ‘게으른 사람아’는 עָצֵל의 직접적인 꾸짖음의 호격을 자연스럽게 살립니다. ‘지혜로워지십시오’는 וַחֲכָם의 지혜를 얻어 지혜로운 사람이 되라는 권면에 적절합니다. 히브리어의 문법 여성형은 한국어 본문에 인위적으로 드러낼 필요가 없으나 주석은 영어에만 한정하지 않고 원문 현상을 정확히 설명해야 합니다.
