base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
  footnotes:
  - marker: a
    text: Hebrew literally, 'see her ways and be wise.'
    reason: lexical_alternative
  - marker: b
    text: The ant is grammatically feminine in Hebrew, hence 'her ways'; English could also say 'its ways.'
    reason: cultural_note
translation:
  language: ko
  text: 개미에게 가십시오, 게으른 사람아. 개미의 행동을 살펴보고 지혜로워지십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 길들을 보고 지혜로워지십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 ‘개미’는 문법상 여성형이며, ‘그 길들’에는 여성 단수 소유 접사가 붙어 있습니다. 한국어 번역에서는 이를 성별로 나타내지 않았습니다.
    reason: cultural_note
