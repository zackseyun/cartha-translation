  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵֽךְ אֶל נְמָלָ֥ה עָצֵ֑ל רְאֵ֖ה דְרָכֶ֣י/הָ וַ/חֲכָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
  footnotes:
  - marker: a
    text: Hebrew literally, 'see her ways and be wise.'
    reason: lexical_alternative
  - marker: b
    text: The ant is grammatically feminine in Hebrew, hence 'her ways'; English could also say 'its ways.'
    reason: cultural_note
translation:
  language: ko
  text: 개미에게 가 보십시오, 게으른 사람아—그 길들을 살펴보고 지혜로워지십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 길들을 보고 지혜로워지라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 ‘개미’는 문법상 여성형이어서 영어 주석은 ‘her ways’가 될 수 있지만, 한국어 본문에서는 성별 대명사를 드러내지 않았습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가 보십시오
  alternatives_korean:
  - 가십시오
  - 가서 보십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형을 한국어 자연스러운 권면으로 옮기되, 뒤의 관찰 명령과 연결되는 움직임을 살려 ‘가 보십시오’로 처리했습니다.
- source_word: נְמָלָה
  english_pob_choice: the ant
  chosen_korean: 개미
  alternatives_korean:
  - 그 개미
  - 한 개미
  lexicon: HALOT
  rationale: 지혜문학의 전형적 본보기로서 일반 명사를 자연스럽게 살려 ‘개미’로 옮겼습니다.
- source_word: עָצֵל
  english_pob_choice: you sluggard
  chosen_korean: 게으른 사람아
  alternatives_korean:
  - 나태한 사람아
  - 게으른 자야
  lexicon: HALOT
  rationale: 직설적 꾸짖음의 호격을 살리면서도 현대 한국어에서 과도하게 낯선 ‘슬러거드’식 음역을 피하고, 직접 호칭 형태로 옮겼습니다.
- source_word: רְאֵה דְרָכֶיהָ
  english_pob_choice: consider her ways
  chosen_korean: 그 길들을 살펴보고
  alternatives_korean:
  - 그 행실을 살펴보고
  - 그 길을 생각해 보고
  lexicon: HALOT
  rationale: רְאֵה의 단순한 ‘보다’보다 관찰하여 배우라는 뜻을 살려 ‘살펴보고’로, דְרָכֶיהָ는 지혜문학의 상투적 ‘ways’를 따라 ‘그 길들’로 옮겼습니다.
- source_word: וַחֲכָם
  english_pob_choice: and become wise
  chosen_korean: 지혜로워지십시오
  alternatives_korean:
  - 지혜로우십시오
  - 지혜롭게 되십시오
  lexicon: HALOT
  rationale: 결과 지향적 권면을 반영해 상태 묘사보다 변화 과정을 드러내는 ‘지혜로워지십시오’를 택했습니다.
theological_decisions:
- issue: 개미의 여성형 문법과 한국어 대명사 처리
  chosen_reading: 한국어 본문에서는 성별을 드러내지 않고 ‘그 길들’로 번역했습니다.
  alternative_readings:
  - ‘그녀의 길들’
  - ‘그것의 길들’
  rationale: 히브리어에서는 ‘개미’가 여성형이어서 3인칭 여성 접사가 붙지만, 한국어에서는 동물에 대한 성별 대명사 사용이 부자연스럽고 본문의 교훈 초점도 성별이 아니라 관찰과 학습에 있습니다.
  doctrine_reference: 문법 성별과 의미 성별의 구분
