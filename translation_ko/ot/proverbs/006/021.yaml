  yaml_path: translation/ot/proverbs/006/021.yaml
  text: Bind them on your heart continually[b][a]; tie them around your neck.
  footnotes:
  - marker: a
    text: Or 'always' for 'continually.'
    reason: lexical_alternative
  - marker: b
    text: Or 'wear them around your neck.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 계속해서 당신의 마음에 매어 두고, 당신의 목에 묶어 두십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘항상’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목에 두르십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָשְׁרֵם
  english_pob_choice: Bind them
  chosen_korean: 매어 두다
  alternatives_korean:
  - 묶어 두다
  - 매다
  lexicon: HALOT
  rationale: 원문의 명령형은 단순 소유가 아니라 몸에 단단히 고정하는 이미지를 담고 있으므로, ‘매어 두다’로 강한 결속감을 살렸습니다.
- source_word: לִבְּךָ
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 হৃদ심
  - 당신의 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고와 의지까지 포괄하는 내적 중심을 가리키므로, 한국어에서는 ‘마음’이 가장 자연스럽게 그 기능을 전달합니다.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_korean: 계속해서
  alternatives_korean:
  - 늘
  - 항상
  lexicon: HALOT
  rationale: 지속적이고 중단 없는 상태를 나타내므로, 현대 한국어에서 흐름이 자연스러운 ‘계속해서’로 옮겼습니다.
- source_word: עָנְדֵם
  english_pob_choice: tie them
  chosen_korean: 묶어 두다
  alternatives_korean:
  - 차다
  - 걸다
  - 매다
  lexicon: HALOT
  rationale: 두 번째 동사는 장식처럼 몸에 걸어 두는 행위를 가리키지만, 한국어에서는 반복 없이 앞 구와의 대비를 살리는 ‘묶어 두다’가 가장 무난합니다.
- source_word: גַּרְגְּרֹתֶךָ
  english_pob_choice: your neck
  chosen_korean: 당신의 목
  alternatives_korean:
  - 당신의 목덜미
  - 당신의 목구멍
  lexicon: HALOT
  rationale: 문맥상 목에 두르는 장식의 자리이므로, ‘목’이 가장 자연스럽고 관용적인 대응입니다.
theological_decisions:
- issue: 지혜 교훈의 신체 은유 유지
  chosen_reading: 지혜의 가르침을 마음에 간직할 뿐 아니라 몸의 표지처럼 목에 두르라는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 추상적으로 ‘기억하라’로 완화하는 읽기
  - 단순한 상징으로만 처리하는 읽기
  rationale: 본문은 내면화(마음)와 외적 표지(목)를 병렬로 제시하므로, 둘의 긴장을 살려 지혜가 삶 전체를 규율해야 함을 드러내는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 잠언의 지혜 교육과 내면화의 신학
