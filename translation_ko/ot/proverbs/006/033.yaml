    reason: lexical_alternative
translation:
  language: ko
  text: 그는 상처와 수치를 입을 것이며, 그의 치욕은 지워지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상처와 불명예’로 옮길 수 있으며, 히브리어는 더 구체적으로 신체적 해와 공개적 수치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 수치는 지워지지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  english_pob_choice: injury
  chosen_korean: 상처
  alternatives_korean:
  - 부상
  - 해
  - 재앙
  lexicon: HALOT
  rationale: 지혜문맥에서 נֶגַע의 구체적 해를 살리되, 신체적 상해까지 포함할 수 있는 자연스러운 현대어로 ‘상처’를 택했습니다.
- source_word: קָלוֹן
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 불명예
  - 수욕
  lexicon: HALOT
  rationale: קָלוֹן이 가리키는 공개적 수치와 사회적 굴욕을 한국어에서 간결하게 드러내기 위해 ‘수치’를 썼습니다.
- source_word: חֶרְפָּתוֹ
  english_pob_choice: his reproach
  chosen_korean: 그의 치욕
  alternatives_korean:
  - 그의 모욕
  - 그의 책망
  - 그의 수치
  lexicon: HALOT
  rationale: חֶרְפָּה의 지속적이고 타인 앞에서 남는 수모를 살리기 위해 ‘치욕’으로 옮겼습니다.
- source_word: לֹא תִמָּחֶה
  english_pob_choice: will not be wiped away
  chosen_korean: 지워지지 않습니다
  alternatives_korean:
  - 닦여 없어지지 않습니다
  - 씻겨지지 않습니다
  - 지워지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘지워짐/닦임’ 이미지를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘지워지지 않습니다’를 선택했습니다.
theological_decisions:
- issue: 죄의 결과를 물리적·사회적 두 차원으로 함께 제시하는 방식
  chosen_reading: ‘상처와 수치’와 ‘치욕’의 병렬을 유지하여, 본문이 말하는 실제적 손상과 सार्वजनिक적 수치를 둘 다 드러냈습니다.
  alternative_readings:
  - ‘상처와 불명예’
  - ‘부상과 치욕’
  rationale: 잠언의 경구적 경고는 행위의 결과를 구체적으로 보여 주므로, 한 항목을 추상화하지 않고 두 차원의 손상을 함께 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 잠언 6:33의 지혜문학적 경고 구조
