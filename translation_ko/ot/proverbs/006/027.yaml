translation:
  language: ko
  text: 사람이 가슴에 불을 품고도 자기 옷이 타지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가슴에’는 히브리어 חֵיק의 범위를 좁혀 잡은 번역입니다. 본문은 품/가슴, 곧 몸에 바짝 지닌 자리나 옷의 접힌 부분까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  english_pob_choice: carry
  chosen_korean: 품고
  alternatives_korean:
  - 들고
  - 안고
  - 가져
  lexicon: HALOT
  rationale: 불을 단순히 ‘옮겨 들다’보다 몸에 가까이 지닌 상태를 살리기 위해 ‘품다’를 택했습니다. 이어지는 ‘가슴에’와 자연스럽게 맞물립니다.
- source_word: בְּחֵיקוֹ
  english_pob_choice: in his bosom
  chosen_korean: 가슴에
  alternatives_korean:
  - 품에
  - 무릎에
  - 옷자락 안에
  lexicon: HALOT
  rationale: 히브리어 חֵיק은 품/가슴 부위를 가리키므로, 현대 한국어에서 가장 자연스럽고 직관적인 ‘가슴에’로 옮겼습니다. ‘품에’도 가능하지만 여기서는 신체 부위를 더 직접적으로 드러내는 표현을 택했습니다.
- source_word: וּבְגָדָיו
  english_pob_choice: and his clothes
  chosen_korean: 자기 옷이
  alternatives_korean:
  - 그의 옷이
  - 옷들이
  - 의복이
  lexicon: HALOT
  rationale: בְּגָדִים의 일상적 의미를 살려 ‘옷’으로 옮겼고, 소유 관계는 한국어답게 ‘자기’로 풀어 자연성을 확보했습니다.
- source_word: לֹא תִשָּׂרַפְנָה
  english_pob_choice: not be burned
  chosen_korean: 타지 않겠습니까
  alternatives_korean:
  - 불타지 않겠습니까
  - 타지 않겠느냐
  - 불에 타지 않겠습니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어 의문문으로 살리면서, 결과를 예고하는 ‘타다’로 번역해 비유의 경고성을 유지했습니다. ‘불에 타다’는 의미는 분명하지만 중복을 피했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 이 절을 단순 정보 전달이 아니라 자명한 결론을 끌어내는 경고형 수사 질문으로 번역했습니다.
  alternative_readings:
  - '직설형: 사람은 가슴에 불을 품으면 자기 옷이 탄다'
  - '완화형: 사람이 불을 품고도 옷이 멀쩡할 수 있겠습니까'
  rationale: 잠언의 경구적 경고를 보존하기 위해 의문형을 유지하는 편이 원문의 압박감을 더 잘 전달합니다.
  doctrine_reference: 지혜문학의 수사적 권면
