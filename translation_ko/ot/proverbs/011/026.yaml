  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
  footnotes:
  - marker: a
    text: Or 'the nation' or 'the populace' curse him; Hebrew לְאֹם can denote a people-group or the public collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who distributes grain'; the Hebrew participle can emphasize supplying grain, though in context it commonly refers to selling/provisioning rather than hoarding.
    reason: lexical_alternative
translation:
  language: ko
  text: 곡식을 내놓지 않는 자는 백성이 그를 저주하지만[a], 곡식을 파는 자의 머리에는 복이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 민족’ 또는 ‘대중’이 그를 저주합니다. 히브리어 לְאֹם은 민족 집단이나 집합적인 대중을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곡식을 공급하는 자’. 히브리어 분사는 곡식을 공급하는 행위를 강조할 수 있으나, 이 문맥에서는 곡식을 억류하는 것과 대조되어 판매하거나 공급하는 일을 가리킵니다.
    reason: lexical_alternative
