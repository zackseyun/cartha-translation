base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
  footnotes:
  - marker: a
    text: Or 'Thus righteousness is for life' or 'Indeed, righteousness leads to life.' The Hebrew first clause is verbless, so English must supply the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 의는 참으로 생명에 이르게 하지만, 악을 추구하는 자는 자기 죽음에 이릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 절은 동사가 없는 문장입니다. 따라서 한국어에서는 결과 관계를 드러내기 위해 「생명에 이르게 하다」처럼 뜻을 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그렇습니다
  alternatives_korean:
  - 그러므로
  - 이처럼
  - 그리하여
  lexicon: HALOT
  rationale: כֵּן은 앞뒤 잠언을 잇는 결론·요약의 부사로 보아, 한국어에서는 담화 표지에 가까운 「그렇습니다」로 시작해 앞 문맥의 귀결임을 자연스럽게 살렸습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  - 정의
  lexicon: HALOT
  rationale: 지혜문학의 도덕적 대조에서 צְדָקָה는 개인의 올바름을 가리키므로, POB의 righteousness에 맞춰 표준적인 「의」로 옮겼습니다.
- source_word: לְחַיִּים
  english_pob_choice: leads to life
  chosen_korean: 생명에 이르지만
  alternatives_korean:
  - 생명으로 이끌지만
  - 생명을 낳지만
  - 생명을 가져오지만
  lexicon: HALOT
  rationale: 히브리어는 계사 없는 결과/목적 표현이므로, ל의 방향성을 살려 「~에 이르다」로 옮겨 결과적 도달을 드러냈습니다.
- source_word: וּמְרַדֵּף רָעָה
  english_pob_choice: but he who pursues evil
  chosen_korean: 악을 추구하는 자는
  alternatives_korean:
  - 악을 좇는 자는
  - 악을 뒤쫓는 자는
  - 악을 따르는 자는
  lexicon: HALOT
  rationale: 분사구문은 습관적 행위를 가리키므로 「추구하는 자」로 처리했고, 대조를 분명히 하려고 문맥상 필요한 역접을 한국어 어순에 자연스럽게 반영했습니다.
- source_word: לְמוֹתוֹ
  english_pob_choice: to his own death
  chosen_korean: 자기 죽음에 이릅니다
  alternatives_korean:
  - 그의 죽음에 이릅니다
  - 자신의 죽음에 이릅니다
  - 죽음으로 갑니다
  lexicon: HALOT
  rationale: ל의 결과·도착 의미를 살리고, 3인칭 남성 접미사를 한국어 관용에 맞게 「자기」로 풀어 자기에게 돌아오는 죽음을 분명히 했습니다.
theological_decisions:
- issue: צְדָקָה의 윤리적 범위
  chosen_reading: 개인의 도덕적 올바름으로서의 의
  alternative_readings:
  - 사회정의로서의 공의
  - 언약적 의로움
  rationale: 본문의 평행법은 의와 악, 생명과 죽음의 대조를 이루므로, 여기서는 제도적 정의보다 잠언적 윤리 차원의 의를 택하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §5'
