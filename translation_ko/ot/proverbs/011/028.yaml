source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/עָשְׁר/וֹ ה֣וּא יִפֹּ֑ל וְ֝/כֶ/עָלֶ֗ה צַדִּיקִ֥ים יִפְרָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
  footnotes:
  - marker: a
    text: Or, more literally, 'like a leaf.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부에 의지하는 자는 넘어지지만, 의인들은 잎사귀처럼 번성합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘잎처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ / trusts
  english_pob_choice: trusts
  chosen_korean: 의지하는
  alternatives_korean:
  - 신뢰하는
  - 믿는
  lexicon: HALOT
  rationale: בטח는 단순한 정보상 믿음이 아니라 안전을 두는 신뢰/의지의 의미이므로, 속담의 경고를 살려 ‘의지하는’으로 옮겼습니다.
- source_word: בְּעָשְׁרוֹ / in his wealth
  english_pob_choice: in his wealth
  chosen_korean: 부에
  alternatives_korean:
  - 재물에
  - 재산에
  lexicon: HALOT
  rationale: עֹשֶׁר는 재물 일반보다 ‘부/재산의 많음’을 가리키므로, 지닌 것 자체보다 그것에 기대는 태도를 드러내는 ‘부에’가 자연스럽습니다.
- source_word: וְכֶעָלֶה / like a leaf
  english_pob_choice: like foliage
  chosen_korean: 잎사귀처럼
  alternatives_korean:
  - 잎처럼
  - 나뭇잎처럼
  lexicon: HALOT
  rationale: עָלֶה는 문자적으로 ‘잎’이지만, 문맥상 의인들의 번성과 생기 넘침을 비유하므로 한국어에서는 단수성을 지나치게 강조하지 않는 ‘잎사귀처럼’이 시각적 이미지를 살립니다.
- source_word: יִפְרָחוּ / will flourish
  english_pob_choice: will flourish
  chosen_korean: 번성합니다
  alternatives_korean:
  - 피어납니다
  - 꽃피웁니다
  lexicon: HALOT
  rationale: פרח는 꽃피다/번성하다의 넓은 의미가 있어, 대비 구조 속에서 결과와 성장의 이미지를 살리는 ‘번성합니다’가 가장 적절합니다.
theological_decisions:
- issue: 잠언의 일반 진술을 한국어에서 어떻게 처리할지
  chosen_reading: 현재형 진술로 옮겨 일반적 진리를 간결하게 전달했습니다.
  alternative_readings:
  - 미래형 ‘번성할 것입니다’
  - 일반적 현재형 ‘번성합니다’
  rationale: 히브리어 잠언은 문법적으로 미래/결과를 띨 수 있으나, 지혜문학의 보편적 진리를 한국어에서는 현재형으로 자연스럽게 전달하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
