  rationale: ‘잎사귀처럼’을 원문의 단수 명사에 더 직접적으로 대응하면서도 한국어에서 자연스러운 ‘잎처럼’으로 고치고, 더 이상 필요하지 않은 어휘 대안 각주를 삭제했습니다. ‘자신의 부’는 בְּעָשְׁרוֹ의 소유 표현을 명시하되, 잠언의 일반적 진술을 유지합니다.
