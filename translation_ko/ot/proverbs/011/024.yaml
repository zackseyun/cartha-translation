theological_decisions:
- issue: 대구법의 도덕적 역설을 한국어에서 어떻게 보존할지
  chosen_reading: ‘흩어 주는 사람은 더 많아지고’와 ‘마땅한 것보다 더 움켜쥐는 사람은 결국 가난해집니다’로 대조를 선명하게 살렸습니다.
  alternative_readings:
  - ‘흩으면 더 얻고’
  - ‘아끼는 사람은 가난해집니다’
  rationale: 잠언의 지혜 격언은 단순 정보보다 도덕적 역설의 충격이 중요하므로, 원문의 대구를 흐리지 않는 선에서 압축적 현대어로 옮겼습니다.
  doctrine_reference: 잠언의 지혜 문학적 교훈과 윤리적 역설
