  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
  footnotes:
  - marker: a
    text: Or, 'and one who withholds more than is right.' The Hebrew phrase מִיֹּשֶׁר is difficult; it may mean withholding beyond what is proper, or withholding what fairness requires.
    reason: lexical_alternative
translation:
  language: ko
  text: 흩어 주는 사람은 더 많아지고, 마땅한 것보다 더 움켜쥐는 사람은 결국 가난해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִיֹּשֶׁר는 해석이 어려운 표현으로, ‘마땅한 것보다 더’ 또는 ‘공정이 요구하는 몫을 넘어서’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is one who
  chosen_korean: 흩어 주는 사람은
  alternatives_korean:
  - 어떤 사람은
  - 한 사람은
  lexicon: HALOT
  rationale: 히브리어는 일반적 유형을 도입하므로, 한국어에서는 자연스럽게 ‘~하는 사람’으로 유형 진술을 살렸습니다.
- source_word: מְפַזֵּר
  english_pob_choice: scatters
  chosen_korean: 흩어 주는
  alternatives_korean:
  - 흩뿌리는
  - 나누어 주는
  lexicon: HALOT
  rationale: 직역적 ‘흩다’의 이미지가 있으나, 잠언의 자비로운 분배 문맥을 살려 ‘흩어 주는’으로 옮기되 원문의 역설은 유지했습니다.
- source_word: וְחוֹשֵׂךְ מִיֹּשֶׁר
  english_pob_choice: withholds more than is right
  chosen_korean: 마땅한 것보다 더 움켜쥐는
  alternatives_korean:
  - 옳은 것보다 더 아끼는
  - 마땅한 몫을 넘겨서 아끼는
  - 정도 이상으로 움켜쥐는
  lexicon: HALOT
  rationale: מִיֹּשֶׁר는 ‘바름/마땅함’의 영역을 가리키는 어려운 표현이므로, 단순히 ‘옳은 것’을 보류한다는 뜻이 아니라 ‘마땅한 기준을 넘겨서’ 움켜쥔다는 뉘앙스를 한국어 관용으로 살렸습니다.
- source_word: לְמַחְסוֹר
  english_pob_choice: to poverty
  chosen_korean: 가난해집니다
  alternatives_korean:
  - 궁핍에 이릅니다
  - 부족함에 빠집니다
  - 결핍으로 갑니다
  lexicon: HALOT
  rationale: 명사 ‘부족/결핍’의 결과를 한국어 독자에게 분명히 전달하기 위해, 잠언의 결론적 귀결을 나타내는 동사형으로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: 대구법의 도덕적 역설을 한국어에서 어떻게 보존할지
  chosen_reading: ‘흩어 주는 사람은 더 많아지고’와 ‘마땅한 것보다 더 움켜쥐는 사람은 결국 가난해집니다’로 대조를 선명하게 살렸습니다.
  alternative_readings:
  - ‘흩으면 더 얻고’
  - ‘아끼는 사람은 가난해집니다’
  rationale: 잠언의 지혜 격언은 단순 정보보다 도덕적 역설의 충격이 중요하므로, 원문의 대구를 흐리지 않는 선에서 압축적 현대어로 옮겼습니다.
  doctrine_reference: 잠언의 지혜 문학적 교훈과 윤리적 역설
