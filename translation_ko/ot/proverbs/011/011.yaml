id: PRO.11.11
reference: Proverbs 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
  footnotes:
  - marker: a
    text: Or 'Through the blessing of the upright a city rises.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the mouth of the wicked'; the phrase points to the destructive power of wicked speech.
    reason: cultural_note
translation:
  language: ko
  text: 의인의 복으로 한 성읍은 높아지지만, 악인의 입으로는 무너집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인의 복을 통해 한 성읍은 높아집니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/בִרְכַּת
  english_pob_choice: By the blessing of
  chosen_korean: 의인의 복으로
  alternatives_korean:
  - 의인의 축복으로
  - 의인의 복을 통해
  lexicon: HALOT
  rationale: בְּ는 여기서 수단/매개의 뜻으로 쓰였고, בִּרְכָּה는 ‘복’이 가장 직접적입니다. 한국어에서는 ‘복으로’가 간결하면서도 원문의 도구적 의미를 자연스럽게 살립니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 의인
  alternatives_korean:
  - 정직한 사람들
  - 올바른 사람들
  lexicon: HALOT
  rationale: 지혜문학에서 יָשָׁר은 도덕적으로 곧은 사람들을 가리키므로 ‘의인’이 문맥상 가장 응축된 표현입니다.
- source_word: תָּר֣וּם קָ֑רֶת
  english_pob_choice: a city is exalted
  chosen_korean: 한 성읍은 높아집니다
  alternatives_korean:
  - 한 성읍은 높아집니다
  - 한 도시는 높아집니다
  lexicon: HALOT
  rationale: Qal 3fs 동사 תָּרוּם은 여성형 주어 קָרֶת와 호응하며, 한국어에서는 ‘높아집니다’가 ‘들어 올려집니다’보다 잠언의 비유적 상승을 더 자연스럽게 담습니다. ‘성읍’은 도시 공동체의 공적 차원을 살립니다.
- source_word: וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים
  english_pob_choice: by the mouth of the wicked
  chosen_korean: 악인의 입으로는
  alternatives_korean:
  - 악인의 말로는
  - 악인의 입을 통해서는
  lexicon: HALOT
  rationale: 원문은 ‘입’이라는 신체어를 유지해 말의 파괴성을 형상화하므로, 이를 그대로 살린 ‘악인의 입으로는’을 택했습니다. ‘말로는’은 의미는 전달하지만 이미지가 약해집니다.
- source_word: תֵּהָרֵֽס׃
  english_pob_choice: it is torn down
  chosen_korean: 무너집니다
  alternatives_korean:
  - 허물어집니다
  - 파괴됩니다
  lexicon: HALOT
  rationale: Niphal הרס는 ‘무너지다/허물어지다’의 수동적 결과를 뜻하므로, 잠언의 대조 구조에 맞게 간결한 ‘무너집니다’를 선택했습니다.
theological_decisions:
- issue: ‘복’과 ‘입’의 대조가 단순한 언어 효과를 넘어 공동체적 परिणाम을 드러내는지
  chosen_reading: 의인의 복은 성읍을 높이고, 악인의 입은 성읍을 무너뜨리는 실제적 원인으로 제시됩니다.
  alternative_readings:
  - 도덕적 일반론으로만 읽는 해석
  - 단순한 개인 차원의 언어 윤리로 축소하는 해석
  rationale: 본문은 공동체(성읍)의 흥망을 말하므로, 축복과 악한 말이 실제 사회적 परिणाम을 낳는다는 잠언의 지혜적 현실 이해를 보존해야 합니다.
  doctrine_reference: '잠언의 지혜 문학: 말의 اخلاق적·공동체적 परिणाम'
- issue: ‘성읍’의 범위
  chosen_reading: ‘성읍’은 단순한 건축물이 아니라 공동체 전체를 가리키는 표현으로 번역합니다.
  alternative_readings:
  - 물리적 도시 건물로만 제한하는 읽기
  - 추상적 사회 개념으로만 바꾸는 읽기
  rationale: 히브리어 קָרֶת는 도시/성읍을 뜻하며, 잠언에서는 공동체적 삶의 질서를 대표하는 말입니다. 한국어 ‘성읍’이 그 공적·공동체적 뉘앙스를 가장 잘 유지합니다.
  doctrine_reference: 공동체 윤리와 지혜 전통
