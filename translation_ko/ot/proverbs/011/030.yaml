  naturalness: ‘의인의 열매는 생명나무이며’와 합쇼체 종결은 자연스럽습니다. 다만 ‘영혼들을 얻는 이’는 현대 한국어에서 부자연스럽고 전도 또는 영혼의 소유라는 특정 의미를 강하게 암시합니다. ‘사람을 얻는 이는’이 잠언의 간결한 문체와 현대 표준어에 더 잘 맞습니다.
