  edition: WLC
  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
  footnotes:
  - marker: a
    text: Or 'he who takes persons/lives is wise.' The Hebrew literally uses 'takes' with 'souls,' an idiom that can mean winning people over or gaining influence with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 열매는 생명나무이며, 사람을 얻는 이는 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들/생명들을 취하는 이는 지혜롭습니다.’ 히브리어는 문자적으로 ‘생명들(사람들)을 취하는 이’라고 합니다. 이 표현은 사람들을 얻거나 그들에게 영향력을 미친다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי
  english_pob_choice: fruit
  chosen_korean: 열매
  alternatives_korean:
  - 과실
  - 결실
  lexicon: HALOT
  rationale: 지혜문학의 비유를 자연스럽게 살리면서, 의인의 삶에서 맺히는 결과라는 함의도 함께 담을 수 있는 가장 직접적인 대응어입니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 한국어에서 가장 간결하게 살리기 위해 단수 대표성을 지닌 ‘의인’으로 옮겼습니다.
- source_word: עֵץ חַיִּים
  english_pob_choice: a tree of life
  chosen_korean: 생명나무
  alternatives_korean:
  - 생명의 나무
  - 생명을 주는 나무
  lexicon: HALOT
  rationale: 잠언과 창세기의 상호본문성을 살리기 위해 관용구로 굳어진 ‘생명나무’를 사용했습니다.
- source_word: וְלֹקֵחַ נְפָשׂוֹת
  english_pob_choice: he who wins souls
  chosen_korean: 영혼들을 얻는 이
  alternatives_korean:
  - 사람들을 얻는 이
  - 생명을 취하는 이
  - 영혼을 차지하는 이
  lexicon: HALOT
  rationale: לקח의 기본 뜻인 ‘취하다/얻다’를 살리되, כאן의 관용적 결합을 한국어에서 오해 없이 드러내기 위해 직역에 가까운 ‘얻는 이’를 택했습니다. ‘영혼들’은 nephesh의 전통적 어휘를 유지하면서도, 본절의 의미가 단지 비물질적 영혼만을 가리키지 않는다는 점은 각주로 보완합니다.
- source_word: חָכָם
  english_pob_choice: is wise
  chosen_korean: 지혜롭습니다
  alternatives_korean:
  - 지혜로운 사람입니다
  - 슬기롭습니다
  lexicon: HALOT
  rationale: 잠언의 평가적 결론을 합쇼체로 간결하게 살리기 위해 서술형 ‘지혜롭습니다’를 선택했습니다.
theological_decisions:
- issue: ‘영혼들을 얻는’의 의미 범위
  chosen_reading: 전도 개념으로 좁히지 않고, 사람들을 얻고 영향력을 미치는 지혜로운 행위라는 더 넓은 잠언적 의미를 유지했습니다.
  alternative_readings:
  - 영혼을 구하는 이
  - 사람을 설득하는 이
  - 사람들을 얻는 이
  rationale: 히브리어 표현은 후대 기독교적 ‘구령’ 용어를 직접 지시하지 않으므로, 본문의 관용적·지혜문학적 의미를 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
