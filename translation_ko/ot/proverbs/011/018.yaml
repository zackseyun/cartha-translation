  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
  footnotes:
  - marker: a
    text: Or 'does a work of falsehood'; the Hebrew expression may emphasize either deceitful gain or labor that proves empty.
    reason: lexical_alternative
  - marker: b
    text: Or 'sure wages' or 'reliable reward'; literally 'wages/reward of truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사람은 속이는 삯을 받지만, 의를 심는 사람은 참된 상을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘거짓의 일/행위’를 뜻할 수 있으며, 문맥상 속임의 결과로 얻는 삯을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘진리의 삯/보상’이며, ‘확실한 삯’ 또는 ‘믿을 만한 보상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 악한 자
  - 불의한 사람
  lexicon: HALOT
  rationale: 속담의 일반적 주어를 자연스러운 현대 한국어로 옮기되, 인격적 주체성을 살리기 위해 ‘사람’을 유지했습니다.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  english_pob_choice: earns deceptive wages
  chosen_korean: 속이는 삯을 받다
  alternatives_korean:
  - 거짓의 일을 하다
  - 속임의 삯을 거두다
  - 속이는 보수를 받다
  lexicon: HALOT
  rationale: 히브리어는 ‘일/행위’와 ‘거짓’이 결합된 표현이지만, 문맥상 결과로서의 보상/삯의 역설을 강조하므로 ‘받다’를 사용해 POB의 의미를 살렸습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 옳은 일
  lexicon: HALOT
  rationale: 잠언에서 צְדָקָה는 윤리적·신학적 ‘의’의 범위를 담는 말이므로, 프로젝트 기본어인 ‘의’를 유지했습니다.
- source_word: שֶׂכֶר אֱמֶת
  english_pob_choice: a true reward
  chosen_korean: 참된 상
  alternatives_korean:
  - 확실한 삯
  - 믿을 만한 보상
  - 진리의 삯
  lexicon: HALOT
  rationale: 직역의 ‘truth/reward’ 구조를 한국어에서 자연스럽게 드러내기 위해 ‘참된’으로 옮기되, 앞의 ‘속이는 삯’과 대조되는 ‘상’으로 응답성을 살렸습니다.
theological_decisions:
- issue: צְדָקָה의 번역 범위
