  lexicon: HALOT
  rationale: 잠언에서 צְדָקָה는 윤리적·신학적 ‘의’의 범위를 담는 말이므로, 프로젝트 기본어인 ‘의’를 유지했습니다.
- source_word: שֶׂכֶר אֱמֶת
  english_pob_choice: a true reward
  chosen_korean: 참된 상
  alternatives_korean:
