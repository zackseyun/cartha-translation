base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
  footnotes:
  - marker: a
    text: Or 'does a work of falsehood'; the Hebrew expression may emphasize either deceitful gain or labor that proves empty.
    reason: lexical_alternative
  - marker: b
    text: Or 'sure wages' or 'reliable reward'; literally 'wages/reward of truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인은 거짓된 삯을 얻지만[a], 의를 심는 사람은 참된 보상을 받습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘거짓의 일/행위’를 뜻할 수 있으며, 문맥상 속임의 결과로 얻는 삯을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘진리의 삯/보상’이며, ‘확실한 삯’ 또는 ‘믿을 만한 보상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
