  lexicon: HALOT
  rationale: 히브리어는 ‘일/행위’와 ‘거짓’이 결합된 표현이지만, 문맥상 결과로서의 보상/삯의 역설을 강조하므로 ‘받다’를 사용해 POB의 의미를 살렸습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
