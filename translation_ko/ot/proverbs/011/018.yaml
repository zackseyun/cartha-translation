  - 진리의 삯
  lexicon: HALOT
  rationale: 직역의 ‘truth/reward’ 구조를 한국어에서 자연스럽게 드러내기 위해 ‘참된’으로 옮기되, 앞의 ‘속이는 삯’과 대조되는 ‘상’으로 응답성을 살렸습니다.
theological_decisions:
