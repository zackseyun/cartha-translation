source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
  footnotes:
  - marker: a
    text: Or 'expectation' for 'hope.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fury.' The Hebrew does not explicitly say whose wrath is meant; it may refer to the wicked's angry expectation or to the wrath that comes upon them.
    reason: alternative_reading
translation:
  language: ko
  text: 의인들이 바라는 것은 오직 선한 것이지만, 악인들의 기대[a]는 진노입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진노’는 여기서 악인들이 품은 분노일 수도 있고, 그들에게 임하는 진노일 수도 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: תַּאֲוַת
  english_pob_choice: desire
  chosen_korean: 소망
  alternatives_korean:
  - 욕망
  - 갈망
  lexicon: HALOT
  rationale: 문맥상 의인의 내적 지향을 가리키므로, 한국어에서는 단순한 욕구보다 긍정적 목표를 드러내는 ‘소망’이 가장 자연스럽습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의인들
  - 의로운 사람들
  lexicon: HALOT
  rationale: 복수 실질형을 한국어 성경체에서 압축적으로 살려 ‘의인’으로 옮겼습니다.
- source_word: אַךְ
  english_pob_choice: only
  chosen_korean: 오직
  alternatives_korean:
  - 단지
  - 그저
  lexicon: HALOT
  rationale: 제한과 배타성을 분명히 드러내는 부사로 ‘오직’이 잠언의 간결한 대구를 가장 잘 살립니다.
- source_word: עֶבְרָה
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 격노
  - 분노
  lexicon: HALOT
  rationale: 히브리어의 강한 분노/격분의 뜻을 한국어에서 격조 있게 전달하면서도, 누구의 진노인지 본문이 명시하지 않는 긴장을 유지하기 위해 ‘진노’를 택했습니다.
theological_decisions:
- issue: 악인의 마지막 항의 주체가 명시되지 않음
  chosen_reading: ‘악인의 기대는 진노입니다’로 옮겨, 진노가 악인의 내적 상태인지 그들에게 임하는 진노인지 본문의 모호성을 그대로 남겼습니다.
  alternative_readings:
  - 하나님의 진노입니다
  - 악인의 분노입니다
  rationale: 히브리어는 단순히 ‘악인의 소망[은] 진노’라고만 말하므로, 특정 주체를 덧붙이면 원문의 압축성과 의도된 여지를 좁히게 됩니다.
  doctrine_reference: 본문이 허용하는 모호성은 해소하지 않고 보존합니다.
