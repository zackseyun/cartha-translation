id: PRO.11.6
reference: Proverbs 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צִדְקַ֣ת יְ֭שָׁרִים תַּצִּילֵ֑/ם וּ֝/בְ/הַוַּ֗ת בֹּגְדִ֥ים יִלָּכֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
  footnotes:
  - marker: a
    text: Or 'but the treacherous are caught in their ruin' or 'by their destruction.' The Hebrew noun can denote either destructive desire/craving or calamity/ruin; the main text takes it as the inner craving that ensnares them.
    reason: lexical_alternative
translation:
  language: ko
  text: 올곧은 이들의 의로움은 그들을 구해 내지만, 배신자들은 자기 욕망에 사로잡힙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배신자들은 자기 파멸에 사로잡힙니다’ 또는 ‘자기 멸망으로 붙잡힙니다.’ 히브리어 명사는 파괴적인 욕망이나 탐욕을 뜻할 수도 있고, 재앙이나 파멸을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 올바름
  lexicon: HALOT
  rationale: 지혜문학에서 צְדָקָה 계열은 개인의 도덕적 바름을 가리키므로, 한국어에서는 ‘의’가 가장 간결하고 본문 대조를 잘 살립니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 의로운 이들
  alternatives_korean:
  - 곧은 이들
  - 정직한 이들
  - 올곧은 사람들
  lexicon: HALOT
  rationale: 직역적 형용사보다 인물 유형을 드러내는 ‘의로운 이들’이 잠언의 윤리적 범주를 자연스럽게 전달합니다.
- source_word: תַּצִּילֵם
  english_pob_choice: rescues them
  chosen_korean: 구해 내지만
  alternatives_korean:
  - 건져 내지만
  - 구출하지만
  - 살려 내지만
  lexicon: HALOT
  rationale: נצל의 ‘건져내다/구해내다’ 의미를 살리되, 속담의 간결한 병렬을 위해 ‘구해 내다’로 옮겼습니다.
- source_word: וּבְהַוַּת
  english_pob_choice: by their own desire
  chosen_korean: 자기 욕망에
  alternatives_korean:
  - 자기 탐욕에
  - 자기 갈망에
  - 자기 파멸에
  lexicon: HALOT
  rationale: 하וָּה는 욕망과 재앙/파멸의 범위를 가지므로, 본문은 내부의 파괴적 욕망을 택한 영어 POB의 취지를 따라 ‘자기 욕망’으로 번역했습니다.
- source_word: בֹּגְדִים
  english_pob_choice: the treacherous
  chosen_korean: 배신자들
  alternatives_korean:
  - 배반자들
  - 간사한 자들
  - 불성실한 자들
  lexicon: HALOT
  rationale: בגד는 단순한 불성실보다 배신/배반의 뉘앙스가 강하므로, 윤리적 악행의 인물을 드러내는 ‘배신자들’이 적절합니다.
- source_word: יִלָּכֵדוּ
  english_pob_choice: are caught
  chosen_korean: 잡힙니다
  alternatives_korean:
  - 걸립니다
  - 붙잡힙니다
  - 덫에 걸립니다
  lexicon: HALOT
  rationale: נלכד의 수동 의미를 살리면서도 한국어 속담체에 맞는 자연스러운 표현으로 ‘잡히다’를 선택했습니다.
theological_decisions:
- issue: בְהַוַּת의 의미 범위
  chosen_reading: 본문은 배신자들이 자기 안의 파괴적 욕망에 의해 붙들리는 것으로 읽습니다.
  alternative_readings:
  - 배신자들은 자기 파멸에 잡힙니다.
  - 배신자들은 자기 멸망에 걸립니다.
  rationale: 히브리어 명사는 욕망/탐욕과 재앙/파멸의 두 범위를 모두 가질 수 있으므로, 영어 POB처럼 내부 욕망을 기본으로 하되 파멸 의미는 주석으로 열어 두는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: 잠언 문맥의 도덕적 인과와 어휘적 다의성
- issue: 의인과 악인의 대조 구조
  chosen_reading: 의가 의로운 이들을 구하고, 배신자의 욕망이 그들을 붙잡는다는 대조를 유지합니다.
  alternative_readings:
  - 의로움이 곧 구원한다는 일반 원리로 평탄화
  - 배신자들은 단순히 벌받는다고만 처리
  rationale: 이 구절은 추상적 교훈이 아니라 두 인물 유형의 역설적 대비를 말하므로, 주어와 수동형의 긴장을 그대로 살리는 것이 좋습니다.
  doctrine_reference: 잠언의 보응/인과 구조
