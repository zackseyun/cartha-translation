  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
  footnotes:
  - marker: a
    text: Hebrew 'Hand to hand,' an idiom likely meaning 'surely' or expressing firm certainty.
    reason: lexical_alternative
translation:
  language: ko
  text: 손에서 손으로[a] 악인은 형벌을 면하지 못하고, 의인들의 후손은 피할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용구로, ‘확실히’ 또는 ‘틀림없이’라는 뜻을 나타낼 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  english_pob_choice: Hand to hand
  chosen_korean: 손에서 손으로
  alternatives_korean:
  - 확실히
  - 손과 손으로
  - 손에서 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 손 이미지를 살리면서도 한국어로 읽히는 형태를 택했습니다. POB가 본문에 남긴 직역 이미지를 보존하되, 의미는 각주로 보완합니다.
- source_word: רָּע
  english_pob_choice: the evil
  chosen_korean: 악인
  alternatives_korean:
  - 악한 자
  - 악한 사람
  - 악
  lexicon: HALOT
  rationale: 문맥상 형용사가 명사적으로 쓰인 단수 남성 표현이므로, 한국어에서는 자연스럽게 인격적 주체를 드러내는 ‘악인’으로 옮겼습니다.
- source_word: יִנָּקֶה
  english_pob_choice: will go unpunished
  chosen_korean: 형벌을 면하지 못하고
  alternatives_korean:
  - 벌을 면하지 못하고
  - 무죄로 풀려나지 못하고
  - 벌받지 않고 지나가지 못하고
  lexicon: HALOT
  rationale: 법정적 ‘무죄 선고’보다 지혜문학의 도덕적·징벌적 결과를 드러내는 표현으로 옮겼습니다.
- source_word: זֶרַע צַדִּיקִים
  english_pob_choice: the offspring of the righteous
  chosen_korean: 의인들의 후손
  alternatives_korean:
  - 의인들의 자손
  - 의인들의 씨
  - 의로운 사람들의 후손
  lexicon: HALOT
  rationale: זֶרַע의 후손/자손 의미를 반영하고, 집합적 의미를 유지하기 위해 복수 소유구문으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יָד לְיָד 관용구의 처리
  chosen_reading: 본문에는 ‘손에서 손으로’로 관용구를 보존하고, 의미는 각주로 보충합니다.
  alternative_readings:
  - 확실히
  - 손을 맞잡아
  - 반드시
  rationale: 이 표현은 의미가 다소 압축되어 있으므로, 해석을 본문에 흡수하기보다 원형 이미지를 보존하는 편이 원문 추적성과 공존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: רָּע의 번역
  chosen_reading: ‘악인’으로 옮겨 단수의 인격적 주체를 유지합니다.
  alternative_readings:
  - 악한 자
  - 악한 사람
  - 악
  rationale: 히브리어 형태가 단수 남성의 실질적 인물을 가리키므로, 추상명사로 완화하지 않고 인격적 악을 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
