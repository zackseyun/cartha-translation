id: PRO.11.10
reference: Proverbs 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
  footnotes:
  - marker: a
    text: Or, 'When it goes well with the righteous, a city rejoices.' The Hebrew literally speaks of the 'good' or 'well-being' of the righteous.
    reason: lexical_alternative
  - marker: b
    text: Or, 'there is a cry of joy.' The Hebrew term can denote ringing or jubilant shouting.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들이 번영하면[a] 한 성읍이 기뻐하고, 악인들이 망하면 환성이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들에게 형통함이 있을 때’라는 뜻일 수 있습니다. 히브리어는 의인들의 ‘좋음’ 또는 ‘잘됨’을 문자적으로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기쁜 환호가 있습니다’로도 옮길 수 있습니다. 히브리어 רִנָּה는 울려 퍼지는 환호나 기쁨의 외침을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב / צַדִּיקִים
  english_pob_choice: In the prosperity of the righteous
  chosen_korean: 의인들이 번영하면
  alternatives_korean:
  - 의인들의 선함 안에서
  - 의인들의 복됨 안에서
  - 의인들의 형통함으로
  lexicon: HALOT
  rationale: בְּ + טוּב은 단순한 ‘좋음’보다 처지의 좋음, 번영, 형통을 가리킬 수 있으므로 한국어에서는 결과적·상황적 의미가 자연스러운 ‘번영하면’으로 옮겼습니다.
- source_word: קִרְיָה
  english_pob_choice: a city
  chosen_korean: 한 성읍이
  alternatives_korean:
  - 그 성읍이
  - 한 도시가
  - 도성이
  lexicon: HALOT
  rationale: 잠언의 일반 진리를 살리기 위해 정관사적 특정성보다 보편적 주어가 자연스럽고, ‘성읍’은 히브리어의 도시/읍성 뉘앙스를 비교적 잘 보존합니다.
- source_word: תַּעֲלֹץ
  english_pob_choice: rejoices
  chosen_korean: 기뻐하고
  alternatives_korean:
  - 환호하고
  - 즐거워하고
  - 기뻐합니다
  lexicon: HALOT
  rationale: 사람이 아닌 ‘성읍’이 주어이므로 의인화된 감정을 지나치게 강하게 만들지 않으면서도, עלץ의 들뜬 기쁨을 자연스럽게 표현하는 동사로 ‘기뻐하다’를 택했습니다.
- source_word: רִנָּה
  english_pob_choice: there is shouting
  chosen_korean: 환성이 있습니다
  alternatives_korean:
  - 기쁜 외침이 있습니다
  - 환호성이 있습니다
  - 기쁨의 외침이 있습니다
  lexicon: HALOT
  rationale: רִנָּה는 단순한 소리보다 기쁨이 섞인 외침/환호를 가리킬 수 있으므로, 한국어에서는 공적 환호의 의미가 드러나는 ‘환성’으로 옮겼습니다.
theological_decisions:
- issue: 악인의 멸망을 기쁨의 계기로 말하는 시적 평행법
  chosen_reading: ‘악인들이 망하면 환성이 있습니다’로, 시편·잠언 특유의 도덕 질서 진술을 유지했습니다.
  alternative_readings:
  - ‘악인들이 사라지면 소리가 납니다’
  - ‘악인들이 망할 때 기쁨이 있습니다’
  rationale: 본문은 악인의 제거를 도덕적 세계질서의 회복으로 보는 잠언적 관찰이므로, 이를 완화하지 않고 평행 구조대로 옮겼습니다.
  doctrine_reference: 잠언의 지혜 전통, 의인/악인 대비
