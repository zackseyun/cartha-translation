id: PRO.11.15
reference: Proverbs 11:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַע יֵ֭רוֹעַ כִּי עָ֣רַב זָ֑ר וְ/שֹׂנֵ֖א תֹקְעִ֣ים בּוֹטֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
  footnotes:
  - marker: a
    text: Literally, 'striking hands'—a gesture used to seal a pledge or guarantee.
    reason: cultural_note
  - marker: b
    text: Or, 'whoever hates giving pledges is safe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 위하여 보증인이 되는 자는 반드시 해를 입을 것이나, 손을 치는 것을 미워하는 자는 안전합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손을 치는 것’으로, 보증이나 약속을 확정할 때 쓰던 몸짓입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘보증을 서는 것을 미워하는 자는 안전합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  english_pob_choice: He will surely suffer harm
  chosen_korean: 반드시 해를 입을 것이나
  alternatives_korean:
  - 반드시 불행을 겪을 것이나
  - 정말로 손해를 볼 것이나
  lexicon: HALOT
  rationale: הרע/רעע의 결합은 도덕적 ‘악’이 아니라 재난·손해의 결과를 가리키므로, 한국어도 ‘해를 입다’로 결과적 피해를 살렸습니다.
- source_word: עָרַב
  english_pob_choice: becomes surety
  chosen_korean: 보증인이 되는
  alternatives_korean:
  - 담보를 서는
  - 빚보증을 서는
  lexicon: HALOT
  rationale: 법적·금융적 책임을 지는 ‘surety’의 뜻을 살리기 위해, 비교적 문어적인 ‘보증인이 되다’를 택했습니다.
- source_word: תֹקְעִים
  english_pob_choice: striking hands
  chosen_korean: 손을 치는 것
  alternatives_korean:
  - 손을 맞잡는 것
  - 악수하는 것
  lexicon: HALOT
  rationale: 문자적으로는 언약이나 보증을 확정하는 몸짓인 ‘손을 치다’이므로, 관용을 직역해 원문의 생생한 이미지를 보존했습니다.
- source_word: בּוֹטֵחַ
  english_pob_choice: is secure
  chosen_korean: 안전합니다
  alternatives_korean:
  - 평안합니다
  - 확실합니다
  lexicon: HALOT
  rationale: 잠언의 결론적 평가는 단순한 심리 상태보다 위험에서 벗어난 상태를 가리키므로, ‘안전하다’로 간결하게 옮겼습니다.
