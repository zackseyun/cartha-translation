  source_fidelity: 첫 절의 히브리어 תְיַשֵּׁר는 ‘곧게 하다’라는 뜻으로, 주어인 ‘온전한 사람의 의’에 맞추어 비존대 서술어로 옮겨야 합니다. 현 번역의 ‘하시고’는 무생물·추상 명사 주어에 부적절한 높임을 부여합니다. 둘째 절의 בְּרִשְׁעָתוֹ는 ‘그의 악함으로/그의 악함 가운데서’라는 수단 또는 상태의 뉘앙스를 보존할 수 있습니다.
  naturalness: ‘무구한 자’는 현대 표준 한국어 성경 문맥에서 다소 문어적이고 낯섭니다. ‘온전한 사람’은 תָּמִים의 도덕적 온전함을 자연스럽게 나타냅니다. 두 절을 각각 ‘합니다/넘어집니다’로 종결하면 잠언의 대구적 격언 문체와 합쇼체에 잘 맞습니다.
  terminology: צִדְקָה는 ‘의’, תָּמִים은 ‘온전한 사람’, רָשָׁע는 ‘악인’으로 옮겼습니다. ‘의’는 지혜문학의 핵심 윤리 용어를 유지하며, ‘온전한’은 무죄나 완전무결을 과도하게 주장하지 않습니다.
