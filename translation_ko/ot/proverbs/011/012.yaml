base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
  footnotes:
  - marker: a
    text: Or 'his friend' or 'his companion.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'lacks heart,' an idiom for lacking sense or understanding.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'a man of understanding,' using masculine singular language in a representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 이웃을[a] 멸시하는 자는 지각이 없지만[b], 명철한 사람은 침묵합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֵעַ는 ‘친구’, ‘동반자’, 또는 ‘이웃’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음이 부족하다’이며, 여기서 ‘마음’은 판단력과 이해력을 가리키는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז / despises
  english_pob_choice: despises
  chosen_korean: 멸시하는
  alternatives_korean:
  - 업신여기는
  - 경멸하는
  - 깔보는
  lexicon: HALOT
  rationale: בָּז는 상대를 낮추고 업신여기는 태도를 가리키므로, 짧고 직접적인 ‘멸시하는’이 잠언의 도덕적 대비를 가장 분명하게 살립니다.
- source_word: לְרֵעֵהוּ / his neighbor
  english_pob_choice: his neighbor
  chosen_korean: 남을
  alternatives_korean:
  - 이웃을
  - 친구를
  - 동료를
  lexicon: HALOT
  rationale: רֵעַ는 친구·동반자·이웃의 범위를 가질 수 있으나, 지혜문학의 윤리적 일반성을 살리기 위해 특정 관계를 좁히지 않는 ‘남을’로 옮겼습니다.
- source_word: חֲסַר לֵב / lacks sense
  english_pob_choice: lacks sense
  chosen_korean: 지각이 없고
  alternatives_korean:
  - 마음이 없고
  - 이해가 없고
  - 분별이 없고
  lexicon: HALOT
  rationale: ‘마음이 부족하다’는 히브리 관용구를 한국어에서 판단력 부족을 뜻하는 ‘지각이 없다’로 풀어, 직역의 어색함 없이 관용적 의미를 드러냈습니다.
- source_word: תְּבוּנוֹת / of understanding
  english_pob_choice: of understanding
  chosen_korean: 명철한
  alternatives_korean:
  - 분별 있는
  - 이해 있는
  - 통찰력 있는
  lexicon: HALOT
  rationale: תְּבוּנוֹת은 분별과 통찰의 성격을 가진 말이므로, ‘사람’에 자연스럽게 연결되는 형용사형 ‘명철한’으로 압축했습니다.
theological_decisions:
- issue: וְאִישׁ의 대표적 남성형 표현
  chosen_reading: 명철한 사람
  alternative_readings:
  - 명철한 자
  - 명철한 이
  - 명철한 사람 한 명
  rationale: 히브리어는 남성 단수 대표 표현이지만 잠언의 일반적 교훈을 한국어에서 자연스럽고 과도하게 성별화하지 않도록 ‘사람’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
