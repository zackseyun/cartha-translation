  text: מֹאזְנֵ֣י מִ֭רְמָה תּוֹעֲבַ֣ת יְהוָ֑ה וְ/אֶ֖בֶן שְׁלֵמָ֣ה רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
  footnotes:
  - marker: a
    text: Literally, 'a complete stone.' That is, a full and accurate standard weight used in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 속이는 저울은 야훼께 가증한 것이지만, 완전한 추는 그의 기쁨입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘완전한 돌’입니다. 즉, 거래에서 쓰는 완전하고 정확한 표준 추를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  english_pob_choice: dishonest scales
  chosen_korean: 속이는 저울
  alternatives_korean:
  - 부정한 저울
  - 사기 저울
  lexicon: HALOT
  rationale: מֹאזְנֵי는 상거래에서 쓰는 저울을 가리키며, מִרְמָה는 속임수·기만을 뜻하므로 한국어에서는 자연스럽게 ‘속이는 저울’로 옮겨 상거래의 부정성을 살렸습니다.
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 가증스러운 것
  lexicon: HALOT
  rationale: 이 표현은 단순한 불쾌감이 아니라 하나님 앞에서의 강한 도덕적 혐오를 나타내므로, 성경적 강도를 유지하는 ‘가증한 것’을 택했습니다.
- source_word: אֶבֶן שְׁלֵמָה
  english_pob_choice: a full weight
  chosen_korean: 완전한 추
  alternatives_korean:
  - 온전한 추
  - 정확한 추
  lexicon: HALOT
  rationale: אֶבֶן은 문자적으로 ‘돌’이지만 여기서는 저울추를 뜻하므로 ‘추’로 옮겼고, שְׁלֵמָה는 온전함·완전함을 뜻해 기준의 결함이 없는 ‘완전한’이 자연스럽습니다.
- source_word: רְצוֹנוֹ
  english_pob_choice: his delight
  chosen_korean: 그의 기쁨
  alternatives_korean:
  - 그의 즐거움
  - 그의 마음에 드심
  lexicon: HALOT
  rationale: רָצוֹן/רְצוֹנוֹ는 호의·기쁨·마음에 드심의 의미를 가지며, 앞의 ‘가증한 것’과 대조를 이루는 평가적 표현으로는 ‘그의 기쁨’이 간결하고 분명합니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 이름 자체로 드러내기 위해 전통적 대치어 ‘주’ 대신 ‘야훼’를 사용했습니다. 이는 POB의 본문 직역 원칙과 이름 보존 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
