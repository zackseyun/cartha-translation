  text: 속이는 저울은 야훼께 가증한 것이지만, 온전한 추는 야훼께서 기뻐하시는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘온전한 돌’입니다. 이는 거래에서 사용하는 온전하고 정확한 표준 추를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  english_pob_choice: dishonest scales
  chosen_korean: 속이는 저울
