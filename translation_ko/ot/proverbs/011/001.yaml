base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
  footnotes:
  - marker: a
    text: Literally, 'a complete stone.' That is, a full and accurate standard weight used in trade.
    reason: lexical_alternative
translation:
