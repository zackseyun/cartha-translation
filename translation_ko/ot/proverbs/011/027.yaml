id: PRO.11.27
reference: Proverbs 11:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
  footnotes:
  - marker: a
    text: Or 'seeks early for good'; the Hebrew verb can carry the sense of earnest or early seeking.
    reason: lexical_alternative
  - marker: b
    text: '''Favor'' may refer broadly to acceptance or goodwill, whether from God, from people, or both.'
    reason: lexical_alternative
  - marker: c
    text: Or 'evil will come upon him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 것을 부지런히 찾는 사람은 호의를 구합니다[a][b]. 그러나 악을 찾는 사람에게는 악이 닥칩니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부지런히 찾는’으로 옮긴 히브리어 동사는 ‘일찍 찾다’ 또는 ‘열심히 찾다’라는 뉘앙스도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘호의’는 받아들여짐이나 선의를 가리킬 수 있으며, 그 출처가 하나님인지 사람인지 원문은 특정하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘악이 그에게 올 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  english_pob_choice: diligently seeks
  chosen_korean: 간절히 찾는
  alternatives_korean:
  - 부지런히 찾는
  - 열심히 찾는
  - 일찍 찾는
  lexicon: HALOT
  rationale: 표면상 ‘일찍’의 가능성도 있지만, 이 문맥에서는 ‘간절히/열심히 찾다’의 적극적 추구 의미가 더 자연스럽고 원문의 강도를 잘 드러냅니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선
  alternatives_korean:
  - 좋은 것
  - 선한 것
  - 좋음
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰여 ‘좋은 것/선’의 대상을 가리키므로, 잠언의 도덕적 뉘앙스를 살려 ‘선’으로 옮겼습니다.
- source_word: רָצוֹן
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 호감
  - 받아들여짐
  lexicon: HALOT
  rationale: 히브리어는 출처를 특정하지 않은 폭넓은 ‘호의/받아들여짐’을 뜻하므로, 문맥상 자연스럽고 포괄적인 표현으로 ‘은혜’를 선택했습니다.
- source_word: וְדֹרֵשׁ רָעָה
  english_pob_choice: but the one who searches for evil
  chosen_korean: 악을 찾는 자는
  alternatives_korean:
  - 악을 추구하는 자는
  - 악을 구하는 자는
  - 악을 찾는 사람은
  lexicon: HALOT
  rationale: 대조적 평행법이므로 접속은 ‘그리고’보다 ‘-는 자는’ 구조로 한국어에서 대조를 분명히 했고, דָּרַשׁ의 ‘찾다/구하다’ 의미를 유지했습니다.
- source_word: תְבוֹאֶנּוּ
  english_pob_choice: evil comes to the one who searches for it
  chosen_korean: 악이 닥칩니다
  alternatives_korean:
  - 악이 그에게 옵니다
  - 그에게 악이 옵니다
  - 악이 찾아옵니다
  lexicon: HALOT
  rationale: 동사의 ‘오다’ 의미를 살리되, 잠언의 결과성·불가피성을 한국어 관용에 맞게 ‘닥치다’로 표현했습니다.
theological_decisions:
- issue: רָצוֹן의 범위
  chosen_reading: ‘은혜’로 옮기되, 그 출처를 하나님이나 사람으로 좁히지 않았습니다.
  alternative_readings:
  - 하나님의 은혜
  - 사람들의 호의
  - 받아들여짐
  rationale: 원문은 호의의 출처를 명시하지 않으므로, 잠언의 일반적 지혜 진술을 보존하기 위해 범위를 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
