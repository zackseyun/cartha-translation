  source_fidelity: 첫 행은 히브리어 시간절과 רָשָׁע 및 תִּקְוָה의 의미를 충실히 옮겼습니다. 그러나 אוֹנִים은 여기서 ‘힘 있는 자’라는 인칭 표현으로 확정하기보다 ‘재물/부’의 뜻으로 읽는 것이 WLC의 문맥과 영어 POB 본문에 더 잘 맞습니다. 난해성 및 ‘힘/강한 자들’이라는 가능한 대안은 각주로 보존해야 합니다.
