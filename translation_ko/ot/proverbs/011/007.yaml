id: PRO.11.7
reference: Proverbs 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
  footnotes:
  - marker: a
    text: Or, 'the expectation of the strong perishes.' The Hebrew אוֹנִים is difficult and may refer either to strength/power or to strong ones.
    reason: alternative_reading
translation:
  language: ko
  text: 악한 사람이 죽으면 그의 희망은 사라지고, 힘 있는 자의 기대도 사라집니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '강한 자들의 기대'로도 옮길 수 있습니다. 히브리어 אוֹנִים은 어렵고, 힘/능력 또는 강한 자들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  english_pob_choice: When ... dies
  chosen_korean: '...이 죽으면'
  alternatives_korean:
  - '...이 죽을 때'
  - '...의 죽음에서'
  lexicon: HALOT
  rationale: 히브리어 전치사 ב와 מות의 부정사 구문은 시간 조건을 나타내므로, 한국어에서는 자연스러운 시간절인 '-으면'으로 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: wicked
  chosen_korean: 악한
  alternatives_korean:
  - 사악한
  - 불의한
  lexicon: HALOT
  rationale: 잠언에서 רָשָׁע는 의인과 대비되는 도덕적으로 악한 사람을 가리키므로, 평이하면서도 강한 '악한'이 적절합니다.
- source_word: תִּקְוָה
  english_pob_choice: hope
  chosen_korean: 희망
  alternatives_korean:
  - 소망
  - 기대
  lexicon: HALOT
  rationale: תִּקְוָה는 기본적으로 '희망'이므로, 의미를 직접 드러내는 표준어 '희망'을 택했습니다.
- source_word: אוֹנִים
  english_pob_choice: the expectation of the strong
  chosen_korean: 힘 있는 자의
  alternatives_korean:
  - 강한 자의
  - 강자의
  - 힘의
  lexicon: HALOT
  rationale: אוֹנִים은 문맥상 강함/힘 또는 '힘 있는 자들'로 이해될 수 있는 난해한 표현입니다. 영어 POB의 주석 가능성을 따라, 한국어 본문에서는 '힘 있는 자의'로 옮겨 두어 본문의 함의를 유지했습니다.
theological_decisions:
- issue: אוֹנִים의 난해성 보존
  chosen_reading: 힘 있는 자의 기대
  alternative_readings:
  - 힘의 기대
  - 강한 자의 기대
  - 부의 기대
  rationale: 히브리어가 난해하므로 특정 의미로 과도하게 확정하지 않고, 문맥상 가능한 '힘 있는 자' 이해를 본문에 반영했습니다. 이는 영어 POB가 남긴 해석의 여지를 한국어에서도 보존하는 방식입니다.
  doctrine_reference: Translation philosophy 3, 5
