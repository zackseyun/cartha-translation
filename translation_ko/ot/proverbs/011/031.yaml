base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
  footnotes:
  - marker: a
    text: Or 'Indeed, the righteous is recompensed in the land'; the Hebrew can also be rendered more formally as 'Behold, the righteous will be repaid in the land/earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 의인은 땅에서 갚음을 받습니다. 하물며 악인과 죄인은 더욱 그러하지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로, 의인은 땅에서 갚음을 받습니다.’ 히브리어는 더 형식적으로 ‘보라, 의인은 땅/지상에서 갚음을 받을 것이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사/도입어로서 현대 한국어에서는 ‘보십시오’가 자연스럽고, 원문의 강조를 살리면서도 합쇼체 문체에 맞습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의를 행하는 사람
  - 의로운 사람
  lexicon: HALOT
  rationale: 지혜문학의 관용적 실체 명사로서 ‘의인’이 가장 간결하고, 영어의 대표적 단수 표현과도 잘 대응합니다.
- source_word: יְשֻׁלָּם
  english_pob_choice: is repaid
  chosen_korean: 갚음을 받습니다
  alternatives_korean:
  - 보상받습니다
  - 되갚음을 받습니다
  - 보답받습니다
  lexicon: HALOT
  rationale: שלם의 수동형은 단순한 ‘상’보다 넓은 ‘지불/보상/되갚음’의 뜻을 담으므로, 긍정·부정 중 어느 한쪽으로 좁히지 않는 ‘갚음’을 택했습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: on earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅 위에서
  - 이 땅에서
  - 세상에서
  lexicon: HALOT
  rationale: 여기서는 ארץ의 넓은 의미가 ‘땅/지상’으로 드러나며, ‘땅에서’가 영어의 ‘on earth’보다 원문 이미지에 더 가깝습니다.
- source_word: אַף כִּי
  english_pob_choice: how much more
  chosen_korean: 하물며
  alternatives_korean:
  - 더구나
  - 하물며 더욱
  lexicon: HALOT
  rationale: a fortiori 논증을 한국어에서 가장 자연스럽게 표지하는 표현이 ‘하물며’입니다.
- source_word: רָשָׁע וְחוֹטֵא
  english_pob_choice: the wicked and the sinner
  chosen_korean: 악인과 죄인
  alternatives_korean:
  - 악한 사람과 죄인
  - 악인과 죄를 짓는 사람
  lexicon: HALOT
  rationale: 두 명사형의 병렬을 살리되, 지혜문학의 전형적 도덕 범주를 한국어 성경체에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 의인의 ‘갚음’의 성격
  chosen_reading: 의인도 땅에서 ‘갚음’을 받는다고만 말하고, 그것이 상급인지 징계인지로는 좁히지 않았습니다.
  alternative_readings:
  - 의인은 땅에서 보상받습니다
  - 의인은 땅에서 벌을 받습니다
  rationale: 원문의 수동형은 넓은 의미의 보응을 허용하므로, 한쪽 의미로 해석을 고정하면 잠언의 의도적 긴장을 훼손할 수 있습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
