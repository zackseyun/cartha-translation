base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
  footnotes:
  - marker: a
    text: Or 'his body'; alternatively, 'his kin' if שְׁאֵרוֹ is taken in the sense of blood-relatives rather than flesh/body.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자한 사람은 자신을 이롭게 하지만, 잔인한 사람은 자기 몸을 해칩니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 살’; 다만 שְׁאֵרוֹ를 혈족이나 친족의 뜻으로 볼 경우 ‘자기 친족’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  english_pob_choice: benefits
  chosen_korean: 유익을 줍니다
  alternatives_korean:
  - 잘되게 합니다
  - 은혜를 베풉니다
  - 도움을 줍니다
  lexicon: HALOT
  rationale: גמל의 여기서는 ‘호의를 베풀어 이롭게 하다’는 뜻이므로, 짧고 자연스러운 ‘유익을 줍니다’가 잠언의 대조 구조를 잘 살립니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: himself
  chosen_korean: 자기 자신에게
  alternatives_korean:
  - 그의 영혼에게
  - 그의 생명에게
  - 자기 자신
  lexicon: HALOT
  rationale: 네페시는 이 문맥에서 인류학적 ‘영혼’보다 반사적 의미가 강하므로, ‘자기 자신에게’로 옮겨 행위가 본인에게 돌아오는 뜻을 분명히 했습니다.
- source_word: חָסֶד
  english_pob_choice: kind
  chosen_korean: 친절한
  alternatives_korean:
  - 자비로운
  - 인자한
  - 은혜로운
  lexicon: HALOT
  rationale: חָסֶד는 언약적 전문용어로만 좁히기보다 사람의 성품을 가리키는 일반적 의미가 강하므로, 현대 한국어에서 자연스러운 ‘친절한’으로 표현했습니다.
- source_word: שְׁאֵרוֹ
  english_pob_choice: his own flesh
  chosen_korean: 자기 살
  alternatives_korean:
  - 자기 몸
  - 자기 육신
  - 친족
  lexicon: HALOT
  rationale: שְׁאֵר는 ‘살/몸’과 ‘친족’ 가능성이 있으나, 첫 행의 נַפְשׁוֹ와 짝을 이룬 평행법상 자기 자신을 해치는 신체적 이미지가 더 직접적이므로 ‘자기 살’을 택했습니다.
