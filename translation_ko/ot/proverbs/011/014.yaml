translation:
  language: ko
  text: 지도력이 없으면 한 백성이 넘어지지만, 조언자들이 많으면 구원이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지도력이 없으면 한 백성이 넘어지지만, 조언자들이 많으면 안전/승리가 있습니다.’
