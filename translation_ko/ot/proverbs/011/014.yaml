lexical_decisions:
- source_word: בְּ/אֵין
  english_pob_choice: Without
  chosen_korean: ~이 없으면
  alternatives_korean:
  - ~이 없는 경우
  - ~이 없을 때
  - 없이는
  lexicon: HALOT
  rationale: בְּ/אֵין이 이루는 부재의 상황을 한국어 조건문으로 자연스럽게 옮기되, 잠언의 경구성을 살리기 위해 간결한 표현을 택했습니다.
- source_word: תַּחְבֻּלוֹת
  english_pob_choice: guidance
  chosen_korean: 지도력
  alternatives_korean:
  - 지침
  - 지혜로운 인도
  - 전략
  lexicon: HALOT
  rationale: 지휘·방향 설정의 뉘앙스를 살리면서도 한국어에서 잠언 문맥에 자연스러운 추상명사로 옮겼습니다. '조언'과 구별되도록 했습니다.
- source_word: תְשׁוּעָה
  english_pob_choice: deliverance
  chosen_korean: 구원
  alternatives_korean:
  - 건짐
  - 구출
  - 승리
  - 안전
  lexicon: HALOT
  rationale: 히브리어 תְּשׁוּעָה는 구출, 도움, 승리를 아우르지만, 이 구절의 지혜문학적 진술에서는 결과적 해방을 넓게 담는 '구원'이 가장 적절합니다.
- source_word: יוֹעֵץ
  english_pob_choice: counselors
  chosen_korean: 조언자들
  alternatives_korean:
  - 상담자들
  - 참모들
  - 의논하는 이들
  lexicon: HALOT
  rationale: 복수적 집합 표현으로서 '많은 조언자들'의 뜻을 살리면서, 앞절의 '지도력'과 대구를 이루도록 했습니다.
