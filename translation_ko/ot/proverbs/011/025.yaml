revisions:
- from: 은혜를 베푸는 사람은 풍성하게 되고, 다른 이들에게 시원함을 주는 사람은 자신도 시원함을 얻습니다.[a][b]
  to: 너그럽게 베푸는 사람은[a] 풍요롭게 되고, 남을 시원하게 하는 사람은 자신도 시원하게 됩니다.[b]
  rationale: 첫 절에서는 ‘은혜’의 좁거나 신학적으로 들릴 수 있는 함의를 피하고, 원문의 관대함과 베풂을 ‘너그럽게 베푸는 사람’으로 옮겼습니다. 결과는 ‘풍요롭게 됩니다’로 자연화했습니다. 둘째 절은 물의 은유를 한국어의 ‘시원하게 하다’라는 상응하는 비유로 유지하고, ‘자신도’로 גַּם הוּא의 상호성을 드러냈습니다. 각주는 해당 어구에 직접 연결되도록 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:37:31Z'
