id: PRO.11.25
reference: Proverbs 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶֽפֶשׁ בְּרָכָ֥ה תְדֻשָּׁ֑ן וּ֝/מַרְוֶ֗ה גַּם ה֥וּא יוֹרֶֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
  footnotes:
  - marker: a
    text: Literally, 'A soul of blessing will be made fat.' The Hebrew uses imagery of abundance and flourishing.
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'the one who waters will himself be watered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 은혜를 베푸는 사람은 풍성하게 되고, 다른 이들에게 시원함을 주는 사람은 자신도 시원함을 얻습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘복의 영혼’ 또는 ‘복의 사람’에 가까우며, 여기서는 타인에게 복을 끼치는 사람을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘물을 주는 사람은 자신도 물을 받는다’는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ בְּרָכָה
  english_pob_choice: a generous person
  chosen_korean: 은혜를 베푸는 사람
  alternatives_korean:
  - 복 주는 사람
  - 복이 있는 사람
  - 축복의 사람
  lexicon: HALOT
  rationale: נֶפֶשׁ을 단순히 ‘영혼’으로 옮기기보다 전체 인격을 가리키는 용법으로 보고, בְּרָכָה의 관계적·윤리적 기능을 살려 ‘은혜를 베푸는 사람’으로 풀었습니다.
- source_word: תְדֻשָּׁן
  english_pob_choice: will be enriched
  chosen_korean: 풍성하게 되고
  alternatives_korean:
  - 살찌게 되고
  - 부요해지고
  - 풍족해지고
  lexicon: HALOT
  rationale: 동사의 원뜻에는 ‘살찌다/풍요롭게 되다’의 이미지가 있으므로, 현대 한국어에서는 그 은유를 살리면서도 오해를 줄이는 ‘풍성하게 되다’가 가장 자연스럽습니다.
- source_word: וּמַרְוֶה
  english_pob_choice: whoever refreshes others
  chosen_korean: 다른 이들에게 시원함을 주는 사람
  alternatives_korean:
  - 남들을 적시는 사람
  - 남들을 물 주는 사람
  - 남들을 새롭게 하는 사람
  lexicon: HALOT
  rationale: 문자적으로는 ‘물을 주는/적시는’ 이미지지만, 문맥상 타인을 유익하게 하고 회복시키는 뜻이므로 ‘시원함을 주는 사람’으로 형상과 의미를 함께 살렸습니다.
- source_word: יוֹרֶא־־
  english_pob_choice: will himself be refreshed
  chosen_korean: 자신도 시원함을 얻습니다
  alternatives_korean:
  - 자신도 물을 얻습니다
  - 자신도 적셔집니다
  - 자신도 새 힘을 얻습니다
  lexicon: HALOT
  rationale: 뒤의 대응절도 수동적 ‘물을 받다’의 이미지를 가지지만, 한국어에서는 같은 어근 반복보다 상호성·보응성을 자연스럽게 드러내는 표현이 더 읽기 쉽습니다.
theological_decisions:
- issue: 보응의 대칭성과 은유의 처리
  chosen_reading: 주시는 자가 다시 받는다는 대칭을 유지하되, 한국어에서 이해되기 쉬운 ‘시원함’과 ‘풍성함’의 은유로 옮겼습니다.
  alternative_readings:
  - ‘물을 주는 사람은 자신도 물을 받습니다’처럼 더 문자적으로 옮김
  - ‘은혜를 베푸는 사람은 부요해집니다’처럼 더 해석적으로 옮김
  rationale: 히브리어 원문의 농업적·수리적 은유를 완전히 평문화하면 반복 구조가 약해지므로, 의미는 풀되 상응 관계는 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학적 보응 원리
