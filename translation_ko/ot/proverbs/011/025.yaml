  source_fidelity: 첫 절의 ‘은혜를 베푸는 사람’은 בְּרָכָה의 관대한 베풂이라는 뜻을 대체로 전달하지만, ‘은혜’는 한국어에서 신적 은총 또는 호의라는 신학적·관계적 함의가 강하여 원문의 일반적 관대함을 다소 좁힐 수 있습니다. ‘시원함을 주는/얻는’은 물을 주고 받는 은유와 상호성을 잘 살립니다.
  naturalness: ‘풍성하게 되고’는 사람이 ‘풍성하게 된다’는 표현으로도 가능하나 다소 미완성처럼 들릴 수 있습니다. ‘풍요롭게 됩니다’가 현대 표준 한국어에서 더 자연스럽고, 두 절의 평행도 유지합니다. 각주 표지는 해당 표현 가까이에 두는 편이 독자에게 명확합니다.
  terminology: ‘너그럽게 베푸는 사람’은 נֶפֶשׁ בְּרָכָה의 관대한 사람이라는 관용적 의미를 자연스럽게 옮기며 특정 교리 용어를 피합니다. ‘시원하게 하다/시원하게 되다’는 רוה의 물·새로움의 비유를 한국어의 자연스러운 비유로 보존합니다.
