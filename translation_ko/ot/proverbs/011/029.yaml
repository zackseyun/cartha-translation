base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
  footnotes:
  - marker: a
    text: Or 'will inherit nothing' / 'will inherit emptiness'; Hebrew 'wind' is a metaphor for what is insubstantial or futile.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house' may refer to one's household or family, not merely the physical dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 집안[b]을 어지럽히는 자는 바람[a]을 상속받고, 어리석은 자는 지혜로운 마음을 지닌 이의 종이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바람’은 실체 없음과 헛됨을 가리키는 비유일 수 있으므로, ‘아무것도’나 ‘헛것’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 단순한 건물보다 가정이나 식구 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  english_pob_choice: troubles
  chosen_korean: 어지럽히는
  alternatives_korean:
