  lexicon: HALOT
  rationale: ‘바람’이라는 비유를 유지해 허망함과 실체 없음의 역설을 드러내되, 한국어에서는 ‘유산으로 받다’가 잠언적 반어를 가장 자연스럽게 전달합니다.
- source_word: וְעֶבֶד אֱוִיל לַחֲכַם־לֵב
  english_pob_choice: and the fool will be a servant to the wise of heart
  chosen_korean: 어리석은 자는 마음이 지혜로운 이의 종이 될 것입니다
  alternatives_korean:
  - 어리석은 자는 마음이 지혜로운 이에게 종이 될 것입니다
  - 미련한 자는 지혜로운 마음의 사람의 종이 될 것입니다
  - 어리석은 자는 지혜로운 자의 종이 될 것입니다
  lexicon: HALOT
  rationale: ‘עֶבֶד’는 기본적으로 ‘종’이 적절하며, ‘마음이 지혜로운 이’는 히브리어의 심장 중심 지혜 표현을 풀어 옮겨 잠언의 인류학적 이미지를 보존합니다.
theological_decisions:
- issue: 잠언의 인과적 반어 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘바람을 유산으로 받을 것입니다’로 옮겨, 행위의 허망한 결말을 도덕적 경고로 유지했습니다.
  alternative_readings:
  - ‘아무것도 받지 못할 것입니다’
  - ‘헛것을 상속받을 것입니다’
  rationale: 히브리어의 ‘바람’은 실체 없음과 헛됨의 은유이므로, 해석을 완전히 평면화하지 않고 독자가 비유 자체를 느끼도록 하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 지혜문학의 비유적 언어와 도덕적 인과성
