  - 문제를 일으키는
  - 망가뜨리는
  lexicon: HALOT
  rationale: 분사형의 능동적 의미를 살리면서도, 잠언답게 과장되지 않은 자연스러운 한국어로 집안을 해치는 행위를 나타냅니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 집안
  alternatives_korean:
