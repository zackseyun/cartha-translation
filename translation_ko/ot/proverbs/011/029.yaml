id: PRO.11.29
reference: Proverbs 11:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עוֹכֵ֣ר בֵּ֭ית/וֹ יִנְחַל ר֑וּחַ וְ/עֶ֥בֶד אֱ֝וִ֗יל לַ/חֲכַם לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
  footnotes:
  - marker: a
    text: Or 'will inherit nothing' / 'will inherit emptiness'; Hebrew 'wind' is a metaphor for what is insubstantial or futile.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house' may refer to one's household or family, not merely the physical dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 집안을 어지럽히는 자는 바람을 유산으로 받을 것이며, 어리석은 자는 마음이 지혜로운 이의 종이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바람’은 실체 없음과 헛됨을 가리키는 비유일 수 있으므로, ‘아무것도’나 ‘헛것’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 단순한 건물보다 가정이나 식구 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  english_pob_choice: troubles
  chosen_korean: 어지럽히는
  alternatives_korean:
  - 괴롭게 하는
  - 문제를 일으키는
  - 망가뜨리는
  lexicon: HALOT
  rationale: 분사형의 능동적 의미를 살리면서도, 잠언답게 과장되지 않은 자연스러운 한국어로 집안을 해치는 행위를 나타냅니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 집안
  alternatives_korean:
  - 자기 집
  - 자기 가문
  - 자기 가족
  lexicon: HALOT
  rationale: ‘집’의 물리적 의미를 넘어서 가정과 식구 전체를 포함할 수 있는 히브리어 뉘앙스를 살리기 위해 ‘집안’을 택했습니다.
- source_word: יִנְחַל רוּחַ
  english_pob_choice: will inherit wind
  chosen_korean: 바람을 유산으로 받을
  alternatives_korean:
  - 바람을 상속받을
  - 헛것을 물려받을
  - 아무것도 받지 못할
  lexicon: HALOT
  rationale: ‘바람’이라는 비유를 유지해 허망함과 실체 없음의 역설을 드러내되, 한국어에서는 ‘유산으로 받다’가 잠언적 반어를 가장 자연스럽게 전달합니다.
- source_word: וְעֶבֶד אֱוִיל לַחֲכַם־לֵב
  english_pob_choice: and the fool will be a servant to the wise of heart
  chosen_korean: 어리석은 자는 마음이 지혜로운 이의 종이 될 것입니다
  alternatives_korean:
  - 어리석은 자는 마음이 지혜로운 이에게 종이 될 것입니다
  - 미련한 자는 지혜로운 마음의 사람의 종이 될 것입니다
  - 어리석은 자는 지혜로운 자의 종이 될 것입니다
  lexicon: HALOT
  rationale: ‘עֶבֶד’는 기본적으로 ‘종’이 적절하며, ‘마음이 지혜로운 이’는 히브리어의 심장 중심 지혜 표현을 풀어 옮겨 잠언의 인류학적 이미지를 보존합니다.
theological_decisions:
- issue: 잠언의 인과적 반어 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘바람을 유산으로 받을 것입니다’로 옮겨, 행위의 허망한 결말을 도덕적 경고로 유지했습니다.
  alternative_readings:
  - ‘아무것도 받지 못할 것입니다’
  - ‘헛것을 상속받을 것입니다’
  rationale: 히브리어의 ‘바람’은 실체 없음과 헛됨의 은유이므로, 해석을 완전히 평면화하지 않고 독자가 비유 자체를 느끼도록 하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 지혜문학의 비유적 언어와 도덕적 인과성
