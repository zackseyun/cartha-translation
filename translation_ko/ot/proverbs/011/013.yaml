revisions:
- from: 험담하는 사람은 비밀을 드러내지만, 영이 신실한 사람은 일을 숨깁니다.[a][b]
  to: 험담을 퍼뜨리는 사람은 비밀을 드러내지만[a], 신뢰할 만한 사람은 일을 감춥니다.[b]
  rationale: The revision replaces the unnatural and potentially theologically loaded ‘영이 신실한 사람’ with an idiomatic Korean expression for dependable discretion, while preserving the Hebrew’s literal ‘faithful of spirit’ in a footnote. It also corrects the first note so that it reflects gossip/tale-bearing rather than formal accusation, and moves the anchors to their respective referents.
