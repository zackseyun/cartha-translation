source:
  edition: WLC
  text: הוֹלֵ֣ךְ רָ֭כִיל מְגַלֶּה סּ֑וֹד וְ/נֶאֱמַן ר֝֗וּחַ מְכַסֶּ֥ה דָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/013.yaml
  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
  footnotes:
  - marker: a
    text: Or 'One who goes about as a talebearer reveals a secret.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'faithful of spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 험담을 퍼뜨리는 사람은 비밀을 드러내지만[a], 신뢰할 만한 사람은 일을 감춥니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘돌아다니며 험담을 퍼뜨리는 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영이 신실한 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  english_pob_choice: A gossip
  chosen_korean: 험담하는 사람
  alternatives_korean:
  - 수다쟁이
  - 소문을 옮기는 사람
  - 비방하는 사람
  lexicon: HALOT
  rationale: 직역의 ‘돌아다니는 자’보다 현대 한국어에서 행위의 성격을 바로 드러내는 표현이 속담의 경고를 자연스럽게 전달합니다.
- source_word: מְגַלֶּה סּוֹד
  english_pob_choice: reveals a secret
  chosen_korean: 비밀을 드러내다
  alternatives_korean:
  - 비밀을 폭로하다
  - 은밀한 것을 밝히다
  - 내밀한 일을 드러내다
  lexicon: HALOT
  rationale: סּוֹד는 여기서 비밀스러운 정보/내밀한 내용을 가리키므로, ‘드러내다’가 폭로의 뉘앙스를 살리면서도 과하지 않습니다.
- source_word: נֶאֱמַן רוּחַ
  english_pob_choice: one who is faithful in spirit
  chosen_korean: 영이 신실한 사람
  alternatives_korean:
  - 마음이 신실한 사람
  - 영적으로 신뢰할 만한 사람
  - 신실한 심령의 사람
  lexicon: HALOT
  rationale: ‘faithful of spirit’의 רוח를 살리기 위해 ‘영’을 유지하되, 한국어 어순에 맞게 인격을 받쳐 주는 표현으로 옮겼습니다.
- source_word: מְכַסֶּה דָבָר
  english_pob_choice: conceals a matter
  chosen_korean: 일을 숨깁니다
  alternatives_korean:
  - 사안을 감춥니다
  - 사정을 덮어 둡니다
  - 일을 감춥니다
  lexicon: HALOT
  rationale: דָבָר는 넓게는 ‘말’이지만 여기서는 대조 구조상 어떤 ‘일/사안’을 뜻하므로, 한국어에서는 가장 자연스러운 ‘일’로 옮겼습니다.
theological_decisions:
- issue: ‘faithful in spirit’의 רוח를 어떻게 살릴지
  chosen_reading: ‘영이 신실한 사람’으로 옮겨 내적 신뢰성과 분별을 함께 드러냈습니다.
  alternative_readings:
  - ‘마음이 신실한 사람’
  - ‘신실한 사람’
  rationale: 본문은 단순한 성격 묘사보다 내면의 충실함을 강조하므로, ‘영’을 보존해 원문의 인류학적 표현을 유지했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 인격의 내면성 강조
