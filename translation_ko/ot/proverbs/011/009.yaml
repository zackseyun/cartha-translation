id: PRO.11.9
reference: Proverbs 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
  footnotes:
  - marker: a
    text: Or 'the hypocrite destroys his neighbor with his mouth.' The Hebrew word can denote a hypocritical, impious, or godless person.
    reason: lexical_alternative
  - marker: b
    text: Or 'the righteous escape by knowledge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 입으로 뻔뻔한 자는 그의 이웃을 멸망시키지만, 지식으로 의인들은 구출됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위선자가 그의 입으로 이웃을 멸망시킨다.’ 히브리어 חָנֵף은 위선자, 불경한 자, 경건하지 않은 자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인들은 지식으로 벗어난다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  english_pob_choice: With his mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 그의 입으로
  - 말로
  lexicon: HALOT
  rationale: ב + פֶה의 도구적 의미를 살리되, 한국어에서는 ‘입으로’가 가장 직접적이고 자연스럽게 말의 수단성을 드러냅니다.
- source_word: חָנֵף
  english_pob_choice: the godless man
  chosen_korean: 뻔뻔한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 위선자
  - 불경한 자
  lexicon: HALOT
  rationale: 이 어근은 위선뿐 아니라 불경·사악함까지 포괄하므로, 잠언의 도덕적 비난을 살리되 ‘godless’의 종교적 뉘앙스를 과도하게 좁히지 않는 표현으로 옮겼습니다.
- source_word: יֵחָלֵצוּ
  english_pob_choice: are delivered
  chosen_korean: 구출됩니다
  alternatives_korean:
  - 구원받습니다
  - 벗어납니다
  - 탈출합니다
  lexicon: HALOT
  rationale: 니팔형의 ‘풀려 나다/구해지다’ 의미를 현대 한국어에서 가장 분명하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: צַדִּיקִים의 주어성
  chosen_reading: ‘의인들은 구출됩니다’로 의인 자신이 구출의 주어가 되도록 옮겼습니다.
  alternative_readings:
  - 지식으로 의인들이 남을 구출합니다
  - 의인들이 지식으로 탈출합니다
  rationale: 히브리어 문법상 צַדִּיקִים은 יֵחָלֵצוּ의 주어로 읽는 것이 가장 자연스럽기 때문에, 타인을 구하는 의미로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
