id: PRO.11.2
reference: Proverbs 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
  footnotes:
  - marker: a
    text: Or 'When pride comes, then comes shame.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오만이 오면 수치도 함께 오고, 겸손한 사람에게는 지혜가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오만이 오면, 수치가 온다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא / וַיָּבֹא
  english_pob_choice: comes / comes also
  chosen_korean: 오면 / 함께 오고
  alternatives_korean:
  - 찾아오면 / 그러면
  - 들어오면 / 들어오고
  lexicon: HALOT
  rationale: 잠언의 일반적·격언적 현재성을 살리기 위해 ‘오면’으로 자연스럽게 옮기고, שני 절의 병행 관계는 ‘함께 오고’로 유지했습니다.
- source_word: זָדוֹן
  english_pob_choice: arrogance
  chosen_korean: 오만
  alternatives_korean:
  - 교만
  - 자만
  - 방자함
  lexicon: HALOT
  rationale: 이 단어는 단순한 자존감이 아니라 도덕적으로 문제적인 거만함을 가리키므로, 현대 한국어에서 의미가 분명한 ‘오만’을 선택했습니다.
- source_word: קָלוֹן
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 불명예
  - 치욕
  - 수치심
  lexicon: HALOT
  rationale: 공적 망신과 불명예의 뉘앙스를 담는 말로 ‘수치’가 가장 간결하고 병행구조에도 잘 맞습니다.
- source_word: צְנוּעִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 사람
  alternatives_korean:
  - 겸손한 이들
  - 온유한 사람
  - 소박한 사람
  lexicon: HALOT
  rationale: 형용사적 집합 표현을 한국어에서 자연스럽게 풀어 ‘겸손한 사람’으로 옮겨, 오만과의 대조를 분명히 했습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 현명함
  lexicon: HALOT
  rationale: 히브리어 잠언의 핵심 어휘이므로 기본 대응어인 ‘지혜’를 유지했습니다.
theological_decisions:
- issue: 격언의 압축된 대조 구조를 한국어에서 어떻게 살릴지
  chosen_reading: 두 절의 병렬을 유지하면서 후반부는 ‘겸손한 사람에게는 지혜가 있습니다’로 마무리했습니다.
  alternative_readings:
  - 겸손한 자에게는 지혜가 있습니다
  - 겸손한 이들과 함께 지혜가 있습니다
  rationale: 원문의 ‘with the humble is wisdom’는 소유·동반의 압축된 진술이므로, 한국어에서는 존재 진술로 풀어 자연성을 확보하되 대조 구조는 보존했습니다.
  doctrine_reference: 잠언 문학의 간결한 대구법 보존
