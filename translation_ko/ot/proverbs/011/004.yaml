id: PRO.11.4
reference: Proverbs 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
  footnotes:
  - marker: a
    text: Or 'riches do not profit on a day of wrath.'
    reason: lexical_alternative
  - marker: b
    text: '''Righteousness'' can also be rendered ''justice'' or ''right conduct'' in wisdom contexts.'
    reason: lexical_alternative
  - marker: c
    text: '''The day of wrath'' may refer broadly to a time of judgment or calamity; the proverb does not specify further.'
    reason: alternative_reading
translation:
  language: ko
  text: 재물은 진노의 날에 아무 소용이 없으나, 의는 죽음에서 건져냅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 ‘부’나 ‘재산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 지혜문학 문맥에서 ‘정의’ 또는 ‘올바른 행실’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘진노의 날’은 더 넓게는 심판이나 재앙의 때를 가리킬 수 있으며, 본문은 그 범위를 더 구체화하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 재산
  - 부유함
  lexicon: HALOT
  rationale: הוֹן은 물질적 재산과 부를 가리키므로, ‘재물’이 현대 한국어에서 가장 자연스럽고 폭이 넓어 시의성을 살립니다.
- source_word: יוֹעִ֣יל
  english_pob_choice: is of no use
  chosen_korean: 아무 소용이 없으나
  alternatives_korean:
  - 도움이 되지 않으나
  - 유익하지 않으나
  - 유효하지 않으나
  lexicon: HALOT
  rationale: Hiphil יעל의 ‘이익이 되다/유익하다’ 의미를 한국어 관용에 맞게 ‘아무 소용이 없다’로 옮겨 효용 부재를 분명히 했습니다.
- source_word: בְּיוֹם עֶבְרָה
  english_pob_choice: on the day of wrath
  chosen_korean: 진노의 날에
  alternatives_korean:
  - 분노의 날에
  - 격노의 날에
  - 진노의 때에
  lexicon: HALOT
  rationale: עֶבְרָה는 단순한 기분의 분노보다 강한 분노·격노를 뜻하므로, 문어적이면서도 성서적 뉘앙스가 살아 있는 ‘진노’로 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 올바른 행실
  lexicon: HALOT
  rationale: 지혜문학에서 צְדָקָה는 윤리적·관계적 올바름을 포괄하므로, 프로젝트 기본어인 ‘의’를 유지하되 동사구로 그 기능을 드러냈습니다.
- source_word: תַּצִּ֥יל מִמָּוֶת
  english_pob_choice: delivers from death
  chosen_korean: 죽음에서 건져냅니다
  alternatives_korean:
  - 죽음에서 구해냅니다
  - 죽음에서 건집니다
  - 사망에서 구원합니다
  lexicon: HALOT
  rationale: נצל의 ‘구해내다/건져내다’ 뜻을 살려, 시적 평행 구조 안에서 능동적 구출감을 주는 ‘건져냅니다’를 선택했습니다.
theological_decisions:
- issue: ‘진노의 날’의 범위
  chosen_reading: 특정 종말론을 확정하지 않고, 심판 또는 재앙이 임하는 결정적 때를 가리키는 표현으로 남겼습니다.
  alternative_readings:
  - 미래의 종말 심판의 날
  - 단순한 인간적 재난의 날
  rationale: 히브리어 본문은 재물이 무력해지는 ‘진노의 때’와 의가 죽음에서 건져내는 대조를 말할 뿐, 범위를 더 좁히지 않습니다. 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
