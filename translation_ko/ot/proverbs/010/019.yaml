  text: 말이 많으면 허물이 그치지 않지만, 자기 입술을 절제하는 사람은 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말이 많으면 허물이 부족하지 않다.’
