translation:
  language: ko
  text: 말이 많으면 죄가 끊이지 않지만, 자기 입술을 절제하는 사람은 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말이 많은 곳에는 죄가 없지 않다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  english_pob_choice: When words are many
  chosen_korean: 말이 많으면
  alternatives_korean:
  - 말이 많은 경우에는
  - 말이 많을 때
  lexicon: HALOT
  rationale: בְּרֹב דְּבָרִים의 상황적·양적 의미를 한국어 속담체에 자연스럽게 옮겨, 잠언의 경구성을 살렸습니다.
- source_word: פָּשַׁע
  english_pob_choice: transgression
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 죄
  lexicon: HALOT
  rationale: פֶּשַׁע의 도덕적 위반 의미를 살리되, 한국어 잠언 문맥에서 과도하게 법정적이지 않게 ‘허물’로 옮겼습니다.
- source_word: וְחֹשֵׂךְ שְׂפָתָיו
  english_pob_choice: but whoever restrains his lips
  chosen_korean: 자기 입술을 절제하는 사람은
  alternatives_korean:
  - 입술을 아끼는 사람은
  - 입술을 억제하는 사람은
  lexicon: HALOT
  rationale: חֹשֵׂךְ는 ‘억제하다/절제하다’의 뜻이므로, 말의 자제를 분명히 드러내는 ‘절제하다’를 택했습니다. ‘입술’을 그대로 살려 원문의 신체 은유도 보존했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: is prudent
  chosen_korean: 지혜롭습니다
  alternatives_korean:
  - 슬기롭습니다
  - 분별이 있습니다
  lexicon: HALOT
  rationale: 마스킬은 단순한 지식보다 분별 있게 행동하는 사람을 가리키므로, 잠언의 윤리적 대조를 살리는 ‘지혜롭습니다’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 일반적 진술에서 인칭과 보편성 표현
  chosen_reading: ‘자기 입술을 절제하는 사람은’으로 일반 명제를 자연스럽게 살렸습니다.
  alternative_readings:
  - ‘그의 입술을 절제하는 자는’
  - ‘입술을 절제하는 이는’
  rationale: 히브리어의 현재분사와 대표적 남성 단수는 잠언의 보편적 교훈을 전합니다. 한국어에서는 성중립적 일반 표현으로 의미를 분명히 했습니다.
  doctrine_reference: 잠언 문학의 일반적/보편적 교훈 원리
