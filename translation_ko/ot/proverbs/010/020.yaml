id: PRO.10.20
reference: Proverbs 10:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֶּ֣סֶף נִ֭בְחָר לְשׁ֣וֹן צַדִּ֑יק לֵ֖ב רְשָׁעִ֣ים כִּ/מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/020.yaml
  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
  footnotes:
  - marker: a
    text: Or 'is of little value,' 'is little,' or 'is as nothing.' The Hebrew כִּמְעָט is concise and can express slight worth or near-nothingness.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 혀는 택한 은과 같고, 악인의 마음은 값어치가 거의 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘값이 적다’, ‘적다’, 혹은 ‘아무것도 아니다’. 히브리어 כִּמְעָט은 간결하게 적은 가치나 거의 무가치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 돈
  - 은화
  lexicon: HALOT
  rationale: 히브리어는 기본적으로 ‘은’을 가리키며, 잠언의 가치 비유를 살리려면 추상적 ‘돈’보다 구체적 금속 명칭인 ‘은’이 더 직접적입니다.
- source_word: נִבְחָר
  english_pob_choice: choice
  chosen_korean: 택한
  alternatives_korean:
  - 선택된
  - 고른
  - 정선한
  lexicon: HALOT
  rationale: 영어 POB의 ‘choice’에 해당하는 높은 가치·선별된 품질을 한국어에서 가장 간결하게 나타내는 표현으로 ‘택한’을 선택했습니다.
- source_word: לְשׁוֹן צַדִּיק
  english_pob_choice: the tongue of the righteous
  chosen_korean: 의인의 혀
  alternatives_korean:
  - 의인의 말
  - 의로운 사람의 혀
  lexicon: HALOT
  rationale: 원문은 ‘혀’를 직설적으로 써서 말의 성격을 메타포로 드러내므로, 이를 ‘말’로 풀지 않고 ‘혀’로 유지했습니다.
- source_word: כִּמְעָט
  english_pob_choice: worth little
  chosen_korean: 값어치가 거의 없습니다
  alternatives_korean:
  - 거의 가치가 없습니다
  - 값이 거의 없습니다
  - 하찮습니다
  lexicon: HALOT
  rationale: כִּמְעָט의 압축된 의미는 ‘거의 아무것도 아닌 정도’에서 ‘가치가 적음’까지 포괄하므로, 직역보다 자연스러운 한국어로 그 미약한 가치를 분명히 했습니다.
theological_decisions:
- issue: 성도덕적 대조의 표현 수위
  chosen_reading: ‘의인’과 ‘악인’의 대조를 그대로 유지해 잠언의 도덕적 평가를 흐리지 않았습니다.
  alternative_readings:
  - ‘착한 사람’과 ‘나쁜 사람’
  - ‘정직한 사람’과 ‘악한 사람’
  rationale: 잠언의 지혜 문맥은 단순 성격 묘사가 아니라 의와 악의 범주를 대비하므로, 익숙한 도덕적 범주 표현을 유지하는 것이 원문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 잠언 문학의 지혜-윤리 대조
