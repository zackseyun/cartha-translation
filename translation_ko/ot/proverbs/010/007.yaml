base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/007.yaml
  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
  footnotes:
  - marker: a
    text: Or 'The remembrance of the righteous is for a blessing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인에 대한 기억은 복이 되지만, 악인의 이름은 썩습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵכֶר
  english_pob_choice: memory
  chosen_korean: 기억
  alternatives_korean:
  - 회상
  - 기념
  - 생각
  lexicon: HALOT
  rationale: זֵכֶר은 ‘기억/회상’의 뜻이므로, 한국어에서는 현대적이고 자연스러운 ‘기억’으로 옮겼습니다. ‘기념’은 의례적 뉘앙스가 강하고, ‘생각’은 의미가 약해집니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰인 일반적 인물을 가리키므로, 잠언 문맥에 맞는 간결한 ‘의인’을 택했습니다.
- source_word: לִבְרָכָה
  english_pob_choice: is a blessing
  chosen_korean: 복이 되다
  alternatives_korean:
  - 복입니다
  - 축복이 됩니다
  - 복이 됩니다
  lexicon: HALOT
  rationale: 직역하면 ‘복을 향하여/복을 위해’이지만, 한국어 속담식 표현에서는 결과 상태를 나타내는 ‘복이 되다’가 가장 자연스럽고 원문의 평가적 의미를 잘 살립니다.
- source_word: יִרְקָב
  english_pob_choice: will rot
  chosen_korean: 썩습니다
  alternatives_korean:
  - 부패합니다
  - 썩을 것입니다
  - 무너집니다
  lexicon: HALOT
  rationale: יִרְקָב의 구체적 이미지가 ‘썩다/부패하다’이므로, 추상적인 ‘사라집니다’보다 육체적 부패감을 살리는 ‘썩습니다’를 선택했습니다.
