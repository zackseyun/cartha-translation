source:
  edition: WLC
  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
  footnotes:
  - marker: a
    text: Or, 'is a path to life'; the Hebrew can be read more tersely, with 'path to life' functioning as a predicate expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈계를 지키는 사람은 생명의 길에 있습니다[a]. 그러나 책망을 버리는 사람은 다른 이들을 그릇된 길로 이끕니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 간결하게 읽을 수도 있어 ‘생명의 길’이 술어처럼 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  english_pob_choice: path
  chosen_korean: 길
  alternatives_korean:
  - 길목
  - 행로
  - 도로
  lexicon: HALOT
  rationale: 지혜문학의 비유적 ‘course of life’를 자연스럽게 살리되, 현대 한국어에서 가장 무리 없는 ‘길’로 옮겼습니다.
- source_word: לְחַיִּים
  english_pob_choice: to life
  chosen_korean: 생명의
  alternatives_korean:
  - 생명으로의
  - 생명에 이르는
  - 생명을 향한
  lexicon: HALOT
  rationale: 히브리어 לְ의 방향·결과 뉘앙스를 반영해 ‘생명의 길’로 압축해 표현했습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교훈
  - 훈련
  lexicon: HALOT
  rationale: 잠언에서 מוּסָר은 교육적 교정과 훈련을 함께 담지만, 이 절에서는 ‘지키는’과 짝을 이룰 때 ‘훈계’를 쓰면 경고와 가르침의 성격이 잘 드러납니다.
- source_word: תּוֹכַחַת
  english_pob_choice: reproof
  chosen_korean: 책망
  alternatives_korean:
  - 훈계
  - 경고
  - 비난
  lexicon: HALOT
  rationale: 대조되는 항목으로서 단순한 ‘가르침’보다 잘못을 바로잡는 말의 뉘앙스를 살리는 ‘책망’이 적절합니다.
- source_word: מַתְעֶה
  english_pob_choice: leads others astray
  chosen_korean: 다른 이들을 그릇된 길로 이끕니다
  alternatives_korean:
  - 사람들을 미혹합니다
  - 다른 이들을 길에서 벗어나게 합니다
  - 사람들을 잘못 이끕니다
  lexicon: HALOT
  rationale: 히필 분사의 사역적 의미를 살려 단순히 ‘자기가 그릇되다’가 아니라 남을 오도하는 결과를 분명히 드러냈습니다.
theological_decisions:
- issue: 히브리어 분사문의 간결한 평행법을 한국어에서 어떻게 보존할지
  chosen_reading: 첫 절은 상태 진술인 ‘생명의 길에 있습니다’로, 둘째 절은 결과를 드러내는 능동적 진술로 옮겨 잠언의 대조를 살렸습니다.
  alternative_readings:
  - ‘생명으로 가는 길입니다’
  - ‘생명의 길입니다’
  rationale: 원문은 ‘훈계를 지키는 자’와 ‘책망을 버리는 자’를 대구로 세우며, 첫 절의 미묘한 술어적 표현을 너무 풀지 않는 것이 좋습니다.
  doctrine_reference: 잠언의 지혜 대구법과 히브리어 분사 구문
