base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
  footnotes:
  - marker: a
    text: Or 'stores up in summer is a wise son.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'son' is masculine singular; in Proverbs it often has representative force while retaining the father-to-son instructional form.
    reason: cultural_note
translation:
  language: ko
  text: 여름에 거두어들이는[b] 이는 슬기로운 아들[a]이지만, 추수 때에 잠을 자는 이는 수치를 안기는 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들’은 남성 단수형이지만, 잠언에서는 아버지와 아들의 교육적 형식을 유지한 채 대표적 의미로 쓰입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘여름에 저장하는 이는 슬기로운 아들입니다’.
    reason: lexical_alternative
