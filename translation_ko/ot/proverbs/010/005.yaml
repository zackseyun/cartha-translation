- source_word: מַשְׂכִּיל
  english_pob_choice: prudent
  chosen_korean: 슬기로운
  alternatives_korean:
  - 신중한
  - 지혜로운
  lexicon: HALOT
  rationale: 행동의 결과를 잘 분별하고 때를 아는 실천적 지혜를 한국어에서 가장 자연스럽게 드러내는 표현으로 보았습니다.
- source_word: מֵבִישׁ
  english_pob_choice: who brings shame
  chosen_korean: 부끄러움을 가져오는
  alternatives_korean:
