language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹגֵ֣ר בַּ֭/קַּיִץ בֵּ֣ן מַשְׂכִּ֑יל נִרְדָּ֥ם בַּ֝/קָּצִ֗יר בֵּ֣ן מֵבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
  footnotes:
  - marker: a
    text: Or 'stores up in summer is a wise son.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'son' is masculine singular; in Proverbs it often has representative force while retaining the father-to-son instructional form.
    reason: cultural_note
translation:
  language: ko
  text: 여름에 거두어들이는 이는 슬기로운 아들이지만, 추수 때에 잠드는 이는 부끄러움을 가져오는 아들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들’은 남성 단수형이지만, 잠언에서는 아버지와 아들의 교육적 형식을 유지한 채 대표적 의미로 쓰입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘여름에 저장하는 이는 슬기로운 아들입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹגֵר
  english_pob_choice: gathers
  chosen_korean: 거두어들이는
  alternatives_korean:
  - 모으는
  - 저장하는
  lexicon: HALOT
  rationale: 곡식과 수확 문맥에서 단순 축적보다 제때 거두는 동작을 살리기 위해 ‘거두어들이는’을 택했습니다.
- source_word: בַּקַּיִץ
  english_pob_choice: in summer
  chosen_korean: 여름에
  alternatives_korean:
  - 여름 동안
  - 여름철에
  lexicon: HALOT
  rationale: 히브리어의 계절 표지를 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: prudent
  chosen_korean: 슬기로운
  alternatives_korean:
  - 신중한
  - 지혜로운
  lexicon: HALOT
  rationale: 행동의 결과를 잘 분별하고 때를 아는 실천적 지혜를 한국어에서 가장 자연스럽게 드러내는 표현으로 보았습니다.
- source_word: מֵבִישׁ
  english_pob_choice: who brings shame
  chosen_korean: 부끄러움을 가져오는
  alternatives_korean:
  - 수치를 가져오는
  - 부끄럽게 하는
  lexicon: HALOT
  rationale: 히필 분사로서의 원인성—남에게 수치를 안기거나 가족의 체면을 손상시키는 의미—를 동사구로 살렸습니다.
theological_decisions:
- issue: 잠과 추수의 대비가 단순한 생활 교훈을 넘는 지혜 문학의 도덕적 평가를 어떻게 드러낼지
  chosen_reading: ‘잠드는’과 ‘부끄러움을 가져오는’의 대비를 통해, 때를 놓치는 게으름이 공동체 안에서 수치로 이어진다는 평가를 분명히 드러냈습니다.
  alternative_readings:
  - ‘잠을 자는’처럼 더 중립적으로 옮기는 방식
  - ‘수치를 당하게 하는’처럼 결과 중심으로만 옮기는 방식
  rationale: 원문의 분사적 대조는 행위의 성격과 그 결과를 함께 보여 주므로, 한국어에서도 책임 있는 도덕 평가가 드러나도록 옮겼습니다.
  doctrine_reference: 잠언의 지혜-어리석음 대비
