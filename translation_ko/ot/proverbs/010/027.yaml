  text: 여호와를 경외하는 것은 날수를 더합니다.[a] 그러나 악인들의 햇수는 짧아집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날들을 연장합니다.’ 히브리어 동사는 문자적으로 ‘더합니다’이며, ‘날들’이 목적어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 여호와를 경외하면
