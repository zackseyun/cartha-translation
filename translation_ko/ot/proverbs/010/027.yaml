id: PRO.10.27
reference: Proverbs 10:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
  footnotes:
  - marker: a
    text: Or 'prolongs days.' The Hebrew verb is literally 'adds,' with 'days' as its object.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하면 날수가 더해지지만, 악인들의 해는 짧아집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날들을 연장합니다.’ 히브리어 동사는 문자적으로 ‘더합니다’이며, ‘날들’이 목적어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 여호와를 경외하면
  alternatives_korean:
  - 여호와를 두려워하면
  - 야훼를 경외하면
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 단순한 공포가 아니라 언약적 경외이므로 ‘경외하다’를 쓰되, 속격 구조는 한국어 조건문으로 자연스럽게 풀었습니다.
- source_word: תּוֹסִיף יָמִים
  english_pob_choice: adds days
  chosen_korean: 날수가 더해지지만
  alternatives_korean:
  - 날들이 더해지지만
  - 수명이 더 길어지지만
  - 날수를 연장하지만
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘날들을 더한다’이므로, POB의 ‘adds days’를 따라 구체성을 살리면서 한국어에서는 결과를 자연스럽게 표현했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들의
  alternatives_korean:
  - 악한 사람들의
  - 불의한 자들의
  lexicon: HALOT
  rationale: 지혜문학의 대표적 도덕 범주를 한국어 성경 용례에 맞는 ‘악인’으로 옮기되, 복수 소유격으로 뒤절과 호응시켰습니다.
- source_word: תִּקְצֹרְנָה
  english_pob_choice: will be cut short
  chosen_korean: 해는 짧아집니다
  alternatives_korean:
  - 해는 짧아질 것입니다
  - 해는 잘려 짧아집니다
  lexicon: HALOT
  rationale: 동사는 ‘짧아지다/짧게 되다’의 상태 결과를 가리키므로, 한국어에서는 수동적 은유를 과도하게 살리지 않고 의미를 분명히 했습니다.
theological_decisions:
- issue: 의인의 장수와 악인의 단명에 대한 격언의 성격
  chosen_reading: 일반적 지혜 원리로 옮기고, 모든 경우에 대한 절대적 약속처럼 표현하지 않았습니다.
  alternative_readings:
  - 경외하는 자는 반드시 오래 살고 악인은 반드시 일찍 죽는다는 절대 규정으로 표현
  rationale: 히브리어 잠언은 통계적·도덕적 경향을 말하므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 지혜문학의 일반 원리와 예외의 긴장 유지
