  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
  footnotes:
  - marker: a
    text: Or 'The LORD's way' or 'the path of the LORD'; the Hebrew may refer both to the LORD's own way of acting and to the way he sets before people.
    reason: lexical_alternative
  - marker: b
    text: Or 'ruin' or 'terror' for 'destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 길은 흠 없는 이에게는 요새이지만, 악을 행하는 이들에게는 파멸입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 행하심’으로 옮길 수 있습니다. 히브리어는 야훼 자신의 길 또는 행하심과, 그분이 사람들에게 제시하시는 길을 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘파멸’은 ‘붕괴’나 ‘공포’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 피난처
  - 성채
  - 견고한 곳
  lexicon: HALOT
  rationale: מָעוֹז는 보호와 안전의 장소를 가리키므로, 한국어에서는 구체적 이미지가 살아 있는 ‘요새’가 가장 자연스럽습니다.
- source_word: לַתֹּם
  english_pob_choice: for the blameless
  chosen_korean: 흠없는 이에게는
  alternatives_korean:
  - 완전한 이에게는
  - 정직한 이에게는
  - 무죄한 이에게는
  lexicon: HALOT
  rationale: תֹּם의 핵심은 도덕적 온전함과 흠없음이므로, 인물을 가리키는 한국어로 풀어 ‘흠없는 이’로 옮겼습니다.
- source_word: דֶּרֶךְ יְהוָה
  english_pob_choice: the way of Yahweh
  chosen_korean: 야훼의 길
  alternatives_korean:
  - 야훼의 방식
  - 야훼의 행하심
  - 주님의 길
  lexicon: HALOT
  rationale: 구문의 기본 이미지를 살려 ‘길’로 직역하되, 하나님의 이름은 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּמְחִתָּה
  english_pob_choice: destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 파괴와 두려움
  lexicon: HALOT
  rationale: מְחִתָּה는 붕괴와 파멸의 결과를 가리키므로, 대조를 선명하게 하는 ‘파멸’이 적절합니다.
theological_decisions:
- issue: ‘야훼의 길’의 의미 범위
  chosen_reading: 하나님의 행하심과 그가 사람에게 제시하는 길을 둘 다 열어 둔 표현으로 유지했습니다.
  alternative_readings:
  - 야훼의 행동 방식
  - 야훼가 명하시는 길
  rationale: 지혜문학의 압축된 표현이 지닌 중의성을 해소하지 않고 그대로 살기는 것이 본문의 신학적 폭을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
