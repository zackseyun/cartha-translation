id: PRO.10.31
reference: Proverbs 10:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
  footnotes:
  - marker: a
    text: Or 'brings forth wisdom.' The Hebrew verb evokes sprouting or bearing fruit.
    reason: lexical_alternative
  - marker: b
    text: Or 'the tongue of perversity' or 'the perverse tongue.' The Hebrew plural may emphasize repeated twisted speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 입은 지혜를 맺고, 패역의 혀는 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘맺다’이지만, 히브리어 동사는 싹트거나 열매를 맺는 이미지를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘패역’은 히브리어의 뒤틀림·전도된 성격을 압축해 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  english_pob_choice: The mouth of the righteous
  chosen_korean: 의인의 입
  alternatives_korean:
  - 의로운 사람의 입
  - 의인들의 입
  lexicon: HALOT
  rationale: 히브리어의 관용적 ‘입’과 단수 형용사 ‘의인’을 살려, 잠언의 대표적 인물을 가리키는 집합적 표현으로 옮겼습니다.
- source_word: יָנוּב חָכְמָה
  english_pob_choice: bears wisdom as fruit
  chosen_korean: 지혜를 맺고
  alternatives_korean:
  - 지혜를 내고
  - 지혜를 생산하고
  - 지혜를 열매로 맺고
  lexicon: HALOT
  rationale: יָנוּב의 싹트다/열매 맺다의 생장 이미지를 살려, 한국어에서도 자연스러운 ‘맺다’를 택해 결과물보다 생명적 산출을 드러냈습니다.
- source_word: לְשׁוֹן תַּהְפֻּכוֹת
  english_pob_choice: the tongue of perversity
  chosen_korean: 패역의 혀
  alternatives_korean:
  - 뒤틀린 혀
  - 패역한 혀
  - 패역의 말
  lexicon: HALOT
  rationale: תַּהְפֻּכוֹת의 뒤틀림·일탈의 뜻을 ‘패역’으로 옮기고, 원문의 병행구를 따라 ‘혀’를 유지했습니다.
- source_word: תִּכָּרֵת
  english_pob_choice: will be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 잘려 나갈 것입니다
  - 제거될 것입니다
  - 끊겨질 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동적·엄중한 처형 이미지를 살리되, 한국어에서 물리적·비유적으로 모두 자연스러운 ‘끊어지다’를 사용했습니다.
theological_decisions:
- issue: 의인의 입과 패역의 혀를 대비하는 지혜 문학의 도덕적 평가
  chosen_reading: ‘입’이 지혜를 ‘맺고’, ‘혀’는 ‘끊어질 것’이라는 대조를 통해 말의 도덕적 결과를 강하게 드러냈습니다.
  alternative_readings:
  - 중립적인 ‘말하다/언어하다’로 완화하는 번역
  - ‘침묵당할 것이다’처럼 결과를 설명하는 번역
  rationale: 히브리어 잠언의 강한 대구법과 응보적 결말을 유지하는 것이 본문의 교훈적 힘을 보존합니다.
  doctrine_reference: 잠언 10장 전체의 지혜-어리석음 대비, 특히 말의 윤리
