id: PRO.10.18
reference: Proverbs 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְכַסֶּ֣ה שִׂ֭נְאָה שִׂפְתֵי שָׁ֑קֶר וּ/מוֹצִ֥א דִ֝בָּ֗ה ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
  footnotes:
  - marker: a
    text: Or 'False lips hide hatred.' The Hebrew may be construed more literally with 'lips of falsehood' as the subject.
    reason: lexical_alternative
  - marker: b
    text: Or 'whoever brings out a bad report.' The Hebrew expression can denote circulating a harmful report more broadly, not only formal slander.
    reason: lexical_alternative
translation:
  language: ko
  text: 미움을 숨기는 자는 거짓된 입술을 지녔고[a], 비방을 퍼뜨리는 자는 어리석은 자입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓된 입술은 미움을 숨깁니다.’ 히브리어는 ‘거짓된 입술’을 주어로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해로운 소문을 퍼뜨리는 자’. 히브리어 표현은 공식적인 중상모략에만 한정되지 않고, 해로운 보고나 소문을 퍼뜨리는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי שָׁקֶר
  english_pob_choice: lying lips
  chosen_korean: 거짓의 입술
  alternatives_korean:
  - 거짓말하는 입술
  - 거짓된 입술
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘거짓의 입술’이지만, 한국어에서는 속성을 나타내는 소유격 구조가 자연스럽고 ‘거짓말하는’보다 원문의 명사적 대구를 더 잘 보존합니다.
- source_word: מְכַסֶּה
  english_pob_choice: conceal
  chosen_korean: 숨기고
  alternatives_korean:
  - 감추고
  - 가리고
  lexicon: HALOT
  rationale: כסה의 기본 의미는 덮다/가리다이지만, 여기서는 마음속 미움을 겉말로 덮어 감추는 뜻이므로 ‘숨기다’가 가장 자연스럽습니다.
- source_word: דִּבָּה
  english_pob_choice: slander
  chosen_korean: 중상모략
  alternatives_korean:
  - 비방
  - 악평
  - 나쁜 소문
  lexicon: HALOT
  rationale: דִּבָּה는 단순한 소문보다 해로운 말의 유포를 가리키므로, 한국어에서는 공식적·도덕적 뉘앙스가 살아 있는 ‘중상모략’이 적절합니다.
- source_word: כְסִיל
  english_pob_choice: is a fool
  chosen_korean: 어리석습니다
  alternatives_korean:
  - 우둔합니다
  - 미련합니다
  - 어리석은 사람입니다
  lexicon: HALOT
  rationale: 잠언의 כְּסִיל은 단순 지능 부족이 아니라 도덕적·지혜문학적 어리석음을 뜻하므로, 판정형 진술을 유지하면서도 문장 흐름에 맞게 ‘어리석습니다’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 도덕적 판단을 현대 한국어에서 어떻게 유지할지
  chosen_reading: 행동의 결과를 단정적으로 규정하는 잠언체를 그대로 살려, ‘어리석습니다’로 마무리했습니다.
  alternative_readings:
  - ‘어리석은 사람입니다’로 완화
  - ‘어리석은 자입니다’로 고어적 표현 사용
  rationale: 본문은 단순 설명이 아니라 지혜문학의 규범적 판단을 제시하므로, 완화하지 않고 짧고 단호한 판정을 유지하는 것이 source-direct합니다.
  doctrine_reference: 잠언의 지혜/우매 대조
- issue: ‘slander’의 번역 범위
  chosen_reading: ‘중상모략’으로 옮겨, 공식적 비방과 해로운 소문 유포를 함께 포괄하게 했습니다.
  alternative_readings:
  - ‘비방’
  - ‘나쁜 소문을 퍼뜨리는 사람’
  rationale: 영어 POB 주석이 ‘bad report’의 더 넓은 가능성을 인정하므로, 한국어도 단일 법률용어로 좁히기보다 해로운 발화 일반을 드러내는 표현을 택했습니다.
  doctrine_reference: 말과 공동체 윤리
