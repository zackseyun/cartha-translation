id: PRO.10.2
reference: Proverbs 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
  footnotes:
  - marker: a
    text: Or, more formally, 'Treasures of wickedness do not profit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'justice delivers from death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 재물은 유익하지 못하지만, 의는 죽음에서 건져냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘악한 재물은 유익하지 못합니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의가 죽음에서 건져냅니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא י֭וֹעִילוּ
  english_pob_choice: do not profit
  chosen_korean: 유익하지 못합니다
  alternatives_korean:
  - 이익이 되지 않습니다
  - 도움이 되지 않습니다
  lexicon: HALOT
  rationale: יועיל의 ‘유익하다/도움이 되다’ 의미를 자연스러운 합쇼체로 옮기되, 잠언의 짧은 단정성을 살리기 위해 간결하게 표현했습니다.
- source_word: אוֹצְר֣וֹת רֶ֑שַׁע
  english_pob_choice: Treasures of wickedness
  chosen_korean: 악한 재물
  alternatives_korean:
  - 악인의 보물
  - 악으로 모은 재물
  - 사악한 보물
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘악의 보물/재물’이지만, 잠언 문맥상 ‘악으로 축적한 재물’의 뜻이 자연스러워 한국어에서는 간결한 명사구로 압축했습니다.
- source_word: וּ֝צְדָקָ֗ה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 의로움
  lexicon: HALOT
  rationale: 지혜문학에서 צְדָקָה는 기본적으로 하나님 앞에서의 바른 삶을 가리키므로, POB 기본어휘에 맞춰 ‘의’로 옮겼습니다.
- source_word: תַּצִּ֥יל מִמָּוֶת
  english_pob_choice: delivers from death
  chosen_korean: 죽음에서 건져냅니다
  alternatives_korean:
  - 죽음에서 구원합니다
  - 죽음에서 구출합니다
  lexicon: HALOT
  rationale: נצל의 ‘건져내다/구해내다’ 이미지를 살리면서도, ‘구원하다’처럼 신학적으로 좁혀 읽히는 표현은 피했습니다.
theological_decisions:
- issue: צְדָקָה의 번역어 선택
  chosen_reading: 의
  alternative_readings:
  - 공의
  - 의로움
  rationale: 이 절에서는 보응적·윤리적 대조가 핵심이므로, POB의 표준 용례대로 ‘의’를 택하는 것이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: צְדָקָה / δικαιοσύνη 기본 렌더링 원칙'
- issue: מָוֶת의 범위
  chosen_reading: 죽음
  alternative_readings:
  - 사망
  - 치명적 위험
  rationale: 지혜문학의 잠언적 일반성을 보존하기 위해 문자 그대로 ‘죽음’을 유지했습니다.
  doctrine_reference: 잠언 문맥에서의 일반적 종말/생명 대비
