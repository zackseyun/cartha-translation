translation:
  language: ko
  text: 악으로 얻은 재물은 유익하지 못합니다[a]. 그러나 의[b]는 죽음에서 건져냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘악의 재물은 유익하지 못합니다.’
