  naturalness: ‘악으로 얻은 재물’과 ‘그러나’는 현대 표준어의 간결한 잠언 문체에 자연스럽습니다. ‘의는 죽음에서 건져냅니다’도 합쇼체에 적합합니다.
  terminology: צְדָקָה는 ‘의’가 적절하며, נצל과 מָוֶת는 각각 ‘건져냅니다’와 ‘죽음’으로 무리 없이 반영됩니다. 기존 b 각주는 본문의 ‘의’에 대한 대안이 아니라 동일한 절을 반복하고 있으므로 ‘공의’라는 실제 어휘 대안으로 고쳐야 합니다.
