base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
  footnotes:
  - marker: a
    text: Or 'Doing an evil scheme is sport to a fool.' The Hebrew term for 'wickedness' can also suggest a shameless or outrageous act.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람에게는 악을 행하는 것이 장난처럼 여겨지지만, 지혜는 분별력 있는 사람에게 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람에게는 악한 계략을 꾸미는 것이 유희와 같습니다.’ 히브리어 זִמָּה는 ‘악’이라는 뜻 외에도 파렴치하거나 수치스러운 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  english_pob_choice: is like a joke
  chosen_korean: 농담 같지만
  alternatives_korean:
  - 장난 같지만
  - 웃음거리 같지만
  - 놀이 같지만
  lexicon: WLC + HALOT
  rationale: 비교 접두 כִּ의 ‘~같이’와 שְׂחוֹק의 ‘웃음/유희’ 의미를 살려, 어리석은 자가 악을 가볍고 우스운 일처럼 여긴다는 뜻을 한국어 관용에 맞게 표현했습니다.
- source_word: לִכְסִיל
  english_pob_choice: to a fool
  chosen_korean: 어리석은 사람에게는
  alternatives_korean:
  - 어리석은 자에게는
  - 우매한 사람에게는
  lexicon: HALOT
  rationale: ל의 관계·관점 용법을 반영해 ‘~에게는’으로 옮겼고, כְסִיל은 문맥상 도덕적·지적 어리석음을 함께 드러내는 ‘어리석은 사람’으로 자연스럽게 처리했습니다.
- source_word: זִמָּה
  english_pob_choice: wickedness
  chosen_korean: 악을 행하는 것
  alternatives_korean:
  - 악한 계략
  - 음란함
  - 사악함
  lexicon: HALOT
  rationale: זִמָּה는 문맥에 따라 계략·음행·망측함을 가질 수 있지만, 잠언에서는 폭넓은 도덕적 악을 가리키므로 ‘악을 행하는 것’으로 풀어 좁은 성적 의미를 피하면서도 무게를 유지했습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 분별력 있는
  alternatives_korean:
  - 깨달음 있는
  - 통찰력 있는
  - 이해 있는
  lexicon: HALOT
  rationale: תְּבוּנָה는 단순 지식보다 사태를 꿰뚫어 판단하는 능력을 뜻하므로, 명사형 반복보다 형용사화한 ‘분별력 있는’이 잠언의 대비를 더 자연스럽게 살립니다.
theological_decisions:
- issue: 대구법의 생략된 술어 처리
  chosen_reading: ‘지혜는 … 사람에게 있습니다’로 보충해, 히브리어의 생략을 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘지혜는 분별력 있는 사람을 위한 것입니다’
  - ‘지혜는 분별력 있는 사람의 것입니다’
  rationale: 후반 절은 히브리어상 ‘to a man of understanding’로 술어가 생략되어 있으므로, 한국어에서는 관계를 드러내는 최소한의 보충이 필요합니다. ‘있습니다’는 원문의 간결성을 크게 훼손하지 않으면서 의미를 명료하게 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, source-faithfulness
