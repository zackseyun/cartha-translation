  - marker: b
    text: 또는 '소득', '수확', 또는 '거두어들이기'를 '산물'로 번역할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 חַטָּאת은 제사적 맥락에서 '죄 제물'을 의미할 수도 있으나, 여기서는 '죄'의 의미입니다.
