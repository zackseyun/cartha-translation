  source_fidelity: 첫 행은 מְגוֹרַת רָשָׁע를 ‘악인이 두려워하는 것’으로, תְבוֹאֶנּוּ를 ‘그에게 닥칠 것’으로 정확히 옮겼습니다. 둘째 행도 복수 צַדִּיקִים을 ‘의인들’, 생략된 주어의 יִתֵּן을 주어를 특정하지 않는 결과 표현으로 처리하여 원문의 여지를 보존합니다. 다만 두 동사가 모두 미완료형으로 미래적·일반적 귀결을 나타내는데, 한국어 번역은 첫 행은 미래, 둘째 행은 현재 종결로 시제가 불균형합니다.
  naturalness: 문장은 현대 표준어 합쇼체로 자연스럽습니다. ‘의인들의 소원’도 잠언의 간결한 문체에 적절합니다. 둘째 행을 ‘이루어질 것입니다’로 하면 첫 행과 평행을 이루고 미래적 귀결이 더 분명해집니다.
  terminology: ‘악인’, ‘의인’, ‘소원’은 잠언 문맥과 한국어 성경 문체에서 널리 통용되며 적절합니다. 하나님이나 다른 행위자를 명시하지 않은 점도 יִתֵּן의 미표시 주어를 존중합니다.
  issues:
