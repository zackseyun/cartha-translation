source:
  edition: WLC
  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
  footnotes:
  - marker: a
    text: Or, 'The dread of the wicked—it will come upon him.' The Hebrew can be rendered more formally, but the main text expresses the same sense in clearer English.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'he will give.' The subject is unstated; the main text renders the sense without specifying the giver.
    reason: alternative_reading
translation:
  language: ko
  text: 악인이 두려워하는 것이 그에게 닥칠 것이지만, 의인들의 소원은 이루어질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְגוֹרַת
  english_pob_choice: what the wicked dreads
  chosen_korean: 악인이 두려워하는 것
  alternatives_korean:
  - 악인의 두려움
  - 악인이 두려워하는 대상
  lexicon: HALOT
  rationale: construct 관계에서 ‘두려움’ 자체보다 ‘두려워하는 것/대상’의 뜻이 살아 있어야 하므로, 한국어도 그 객체성을 드러내는 표현을 택했습니다.
- source_word: תְבוֹאֶנּוּ
  english_pob_choice: will come upon him
  chosen_korean: 그에게 닥칠 것이지만
  alternatives_korean:
  - 그에게 올 것입니다
  - 그를 덮칠 것입니다
  lexicon: HALOT
  rationale: בוא의 도래·임박성을 살리되, 한국어 속담체에 맞게 ‘닥치다’로 임박한 불가피성을 전했습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의인
  - 의로운 사람들
  lexicon: HALOT
  rationale: 복수 명사이므로 한국어에서도 복수성을 반영했고, 잠언의 일반화된 대구를 살리기 위해 ‘의인들’로 옮겼습니다.
- source_word: יִתֵּן
  english_pob_choice: will be granted
  chosen_korean: 이루어집니다
  alternatives_korean:
  - 주어집니다
  - 허락됩니다
  - 이뤄질 것입니다
  lexicon: HALOT
  rationale: 히브리어는 주어가 생략된 능동형이지만, 문맥상 의인의 소원이 성취되는 결과에 초점이 있으므로 한국어에서는 자연스러운 수동 의미로 정리했습니다.
theological_decisions:
- issue: יִתֵּן의 생략된 주어
  chosen_reading: 하나님을 명시하지 않고, 소원이 성취된다는 결과만 드러냈습니다.
  alternative_readings:
  - ‘하나님이 이루어 주십니다’처럼 주어를 명시하는 번역
  - ‘그가 주십니다’로 불특정 행위자를 남기는 번역
  rationale: 원문이 하나님을 직접 말하지 않으므로, 잠언의 압축성과 해석적 여지를 보존하기 위해 주어를 밝히지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
