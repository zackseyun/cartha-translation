  text: רָ֗אשׁ עֹשֶׂ֥ה כַף רְמִיָּ֑ה וְ/יַ֖ד חָרוּצִ֣ים תַּעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
  footnotes:
  - marker: a
    text: Or 'A deceitful hand makes poor'; the noun רְמִיָּה can elsewhere carry the sense of deceit, but in this labor proverb the context favors 'slack' or 'lazy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른[a] 손은 사람을 가난하게 하고, 부지런한 이의 손은 사람을 부하게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속이는’; רְמִיָּה는 다른 곳에서 ‘속임’ 또는 ‘기만’의 뜻을 가질 수 있습니다. 그러나 이 노동 격언에서는 ‘게으른’ 또는 ‘느슨한’이라는 뜻이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  english_pob_choice: poor
  chosen_korean: 가난하게
  alternatives_korean:
  - 빈궁하게
  - 빈곤하게
  lexicon: HALOT
  rationale: 문맥상 결과 상태를 나타내므로 형용사적 결과를 살린 ‘가난하게’가 한국어에서 가장 자연스럽고, ‘부하게’와의 대구도 유지합니다.
- source_word: כַף / יָד
  english_pob_choice: hand / the hand
  chosen_korean: 손
  alternatives_korean:
  - 손바닥
  - 손의 작업
  lexicon: HALOT
  rationale: 두 행 모두 노동의 도구를 가리키는 신체 은유이므로, 현대 한국어에서는 ‘손’이 가장 직접적이고 관용적입니다.
- source_word: רְמִיָּה
  english_pob_choice: slack
  chosen_korean: 게으른
  alternatives_korean:
  - 나태한
  - 느슨한
  - 속이는
  lexicon: HALOT
  rationale: 이 절에서는 ‘손’과 결합해 노동의 느슨함/태만을 뜻하므로, 의미를 분명히 드러내는 ‘게으른’으로 옮겼습니다. ‘속이는’은 이 문맥에서는 과도하게 도덕적 의미를 앞세웁니다.
- source_word: חָרוּצִים
  english_pob_choice: the diligent
  chosen_korean: 부지런한 사람의
  alternatives_korean:
  - 부지런한 이들의
  - 근면한 사람의
  - 부지런한
  lexicon: HALOT
  rationale: 히브리어 복수 형용사가 사람들을 가리키는 명사적 용법이므로, 한국어에서는 주어성을 분명히 하기 위해 ‘부지런한 사람의 손’으로 풀었습니다.
theological_decisions:
- issue: רְמִיָּה의 의미 범위
  chosen_reading: 이 절에서는 ‘속이는 손’이 아니라 노동 태만을 뜻하는 ‘게으른 손’으로 읽었습니다.
  alternative_readings:
  - 속이는 손은 가난하게 한다
  - 부정한 손은 가난하게 한다
  rationale: 지혜문학의 평행법상 대비는 도덕적 기만보다 노동의 성실성과 태만에 있습니다. 영어 POB도 이 문맥에서 ‘slack’ 쪽을 우선했습니다.
  doctrine_reference: 잠언의 일반 지혜 명제와 문맥적 평행법
