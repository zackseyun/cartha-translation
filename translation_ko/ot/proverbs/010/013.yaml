id: PRO.10.13
reference: Proverbs 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שִׂפְתֵ֣י נָ֭בוֹן תִּמָּצֵ֣א חָכְמָ֑ה וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
  footnotes:
  - marker: a
    text: Literally, 'lacking heart,' a Hebrew idiom for lacking sense or understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 분별 있는 사람의 입술에는 지혜가 있되, 미련한 자의 등에는 막대기가 있느니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음이 부족한’은 지혜문학에서 이해력과 판단력이 부족하다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שִׂפְתֵי
  english_pob_choice: On the lips of
  chosen_korean: 입술에는
  alternatives_korean:
  - 입술 위에는
  - 입술에
  lexicon: HALOT
  rationale: ב + ‘입술’의 위치·출처 표지를 한국어에서는 자연스럽게 ‘입술에는’으로 옮겨, 말과 지혜의 연관을 살렸습니다.
- source_word: נָבוֹן
  english_pob_choice: a discerning man
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 깨닫는 사람
  - 지혜로운 사람
  - 분별 있는 남자
  lexicon: HALOT
  rationale: נָבוֹן은 이해력과 분별력을 지닌 사람을 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘분별 있는 사람’으로 옮겼습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: HALOT
  rationale: 잠언에서의 표준어휘이므로 ‘지혜’를 유지했습니다.
- source_word: חֲסַר לֵב
  english_pob_choice: one who lacks sense
  chosen_korean: 미련한 자
  alternatives_korean:
  - 마음이 없는 자
  - 이해가 부족한 자
  - 어리석은 자
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 부족한’이지만, 잠언의 관용적 의미는 분별력과 판단력의 결핍이므로 한국어 관용에 맞는 ‘미련한 자’로 압축했습니다.
theological_decisions:
- issue: 교훈적 잠언의 현재형 진술과 징계 도구의 이미지
  chosen_reading: ‘지혜가 있되’와 ‘있느니라’로 잠언의 일반 진리를 현재적 진술로 살리고, ‘막대기’의 물리적 징계 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘지혜가 발견됩니다’처럼 수동형을 살리는 번역
  - ‘채찍’처럼 더 강한 징계 표현을 쓰는 번역
  rationale: 히브리어는 격언적 현재/일반 진술이며, שֵׁבֶט은 징계·처벌 도구의 구체적 이미지를 지니므로 약화시키지 않는 것이 본문 의도에 부합합니다.
  doctrine_reference: 잠언의 지혜-어리석음 대비, 징계의 교훈적 기능
- issue: חֲסַר לֵב의 관용구 처리
  chosen_reading: ‘마음이 부족한’의 직역을 본문에 두지 않고, 의미를 드러내는 ‘미련한 자’로 번역했습니다.
  alternative_readings:
  - ‘마음이 부족한 자’
  - ‘이해가 없는 자’
  rationale: 히브리어에서 ‘마음’은 이해와 판단의 자리이므로, 한국어 독자가 즉시 이해할 수 있도록 관용적 의미를 본문에 반영하되 원문의 경멸적 대비는 유지했습니다.
  doctrine_reference: 지혜문학의 심장/마음 관용어법
