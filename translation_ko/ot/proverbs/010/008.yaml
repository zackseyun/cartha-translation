revisions:
- from: 지혜로운 마음의 사람은 명령을 받아들입니다. 그러나 입술의 어리석은 사람은 무너집니다.[a]
  to: 마음이 지혜로운 사람은 명령을 받아들입니다. 그러나 어리석은 말을 하는 사람은 파멸합니다.[a]
  rationale: 수식 관계가 불명확한 직역투를 현대 한국어의 자연스러운 표현으로 고쳤습니다. ‘입술’의 비유적 표현은 본문에서 말로 드러나는 어리석음으로 전달하되, 원문의 문자적 표현과 희귀 동사의 다른 가능한 의미는 각주에 남겼습니다. 명령을 기꺼이 받아들이는 지혜로운 사람과 말로 드러나는 어리석은 사람의 결말이라는 대조를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:38:21Z'
