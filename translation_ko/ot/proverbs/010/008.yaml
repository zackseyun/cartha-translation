    rationale: חֲכַם לֵב은 직역상 ‘마음이 지혜로운 [사람]’입니다. ‘마음이 지혜로운 사람’이 원문의 인지·의지 중심으로서의 ‘마음’ 이미지를 유지하면서도 자연스럽습니다.
