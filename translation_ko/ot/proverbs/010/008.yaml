  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
  footnotes:
  - marker: a
    text: Or, more literally, 'a fool of lips will be thrown down.' The final verb is rare and may carry the sense of being cast down or coming to ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음이 지혜로운 사람은 명령을 받아들입니다. 그러나 어리석은 말을 하는 사람은 파멸합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘입술의 어리석은 자는 내던져질 것입니다.’ 마지막 동사는 드물며, ‘내던져지다’, ‘쓰러지다’ 또는 ‘파멸하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  english_pob_choice: a wise-hearted man
  chosen_korean: 지혜로운 마음의 사람
  alternatives_korean:
  - 마음이 지혜로운 사람
  - 지혜로운 사람
  - 지혜로운 마음을 가진 사람
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 생각과 의지의 중심이므로, 단순히 ‘지혜로운’으로만 풀기보다 ‘마음의 사람’ 구조를 살려 내부 성향을 드러냈습니다.
- source_word: יִקַּח מִצְוֺת
  english_pob_choice: accepts commands
  chosen_korean: 명령을 받아들입니다
  alternatives_korean:
  - 명령을 받습니다
  - 명령을 수용합니다
  - 계명을 받습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘취하다’이지만 여기서는 명령을 기꺼이 받아들이는 뜻이므로, 현대 한국어에서는 ‘받아들이다’가 가장 자연스럽고 의미도 분명합니다.
- source_word: אֱוִיל שְׂפָתַיִם
  english_pob_choice: a foolish man of lips
  chosen_korean: 입술의 어리석은 사람
  alternatives_korean:
  - 말 많은 어리석은 사람
  - 입술만 있는 어리석은 사람
  - 입술의 어리석은 자
  lexicon: HALOT
  rationale: ‘입술’은 단순한 성격 묘사가 아니라 말과 언어의 영역을 가리키는 표현이므로, 이를 그대로 살려 어리석음이 말에서 드러나는 사람임을 보존했습니다.
- source_word: יִלָּבֵט
  english_pob_choice: will come to ruin
  chosen_korean: 무너집니다
  alternatives_korean:
  - 넘어집니다
  - 파멸합니다
  - 전복됩니다
  lexicon: HALOT
  rationale: 희귀한 니팔 동사로 ‘끌려 내려가다/무너지다’의 결과를 보이므로, 현재형 서술의 잠언체에 맞게 ‘무너집니다’로 옮겼습니다.
theological_decisions:
- issue: 두 행의 대비를 한국어에서 어떻게 살릴지
  chosen_reading: 첫 행은 지혜로운 수용, 둘째 행은 말로 드러나는 어리석음과 붕괴의 대비로 살렸습니다.
  alternative_readings:
  - 첫 행은 단순 지적 능력과 순종의 대비로만 읽는 것
  - 둘째 행의 이미지를 약화시켜 ‘어리석은 사람은 실패합니다’로 일반화하는 것
  rationale: 본문은 지혜와 어리석음의 대조를 통해 태도와 결말을 함께 보여 주므로, 명령을 ‘받아들임’과 ‘무너짐’의 대비를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 잠언 문학의 지혜-어리석음 대조
