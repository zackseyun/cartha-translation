id: PRO.10.32
reference: Proverbs 10:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
  footnotes:
  - marker: a
    text: Or 'what is pleasing' or 'favor.' The Hebrew noun can denote favor, goodwill, or what is acceptable/fitting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply 'but the mouth of the wicked—perversities/perverse things'; the English verb 'speaks' is supplied for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들의 입술은 합당한 것을 압니다. 그러나 악인들의 입은 비뚤어진 것들을 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘합당한 것’은 히브리어 רָצוֹן이 가질 수 있는 ‘기쁨, 호의, 받아들일 만함’의 의미 범위를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비뚤어진 것들’은 히브리어 תַּהְפֻּכוֹת의 ‘뒤틀림, 패역, 일그러짐’을 한국어에서 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי / פִי
  english_pob_choice: the lips of / the mouth of
  chosen_korean: 입술은 / 입은
  alternatives_korean:
  - 말은
  - 말하는 것은
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지와 대구를 살리기 위해 추상적인 ‘말’보다 ‘입술’과 ‘입’을 그대로 유지했습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인들의
  alternatives_korean:
  - 의로운 사람들의
  - 정직한 이들의
  lexicon: HALOT
  rationale: 잠언의 범주적 대비를 살려 개인이 아니라 의인의 집단을 나타내는 복수형으로 옮겼습니다.
- source_word: רָצוֹן
  english_pob_choice: what is acceptable
  chosen_korean: 합당한 것
  alternatives_korean:
  - 기쁜 것
  - 호의
  - 받아들일 만한 것
  lexicon: HALOT
  rationale: 문맥상 의인의 입술이 분별하는 대상은 ‘호의’ 자체보다 말로서 적합하고 받아들일 만한 것이라서, 한국어에서는 ‘합당한 것’이 가장 자연스럽고 원문의 의미 범위를 좁히지 않습니다.
- source_word: תַּהְפֻּכוֹת
  english_pob_choice: perversity
  chosen_korean: 비뚤어진 것들
  alternatives_korean:
  - 패역함
  - 뒤틀린 말들
  - 사악함
  lexicon: HALOT
  rationale: 명사적 추상어를 직역식으로 ‘패역함’이라 하기보다, 병렬 구조에 맞게 악인의 입이 내는 ‘뒤틀린 것들’로 풀어 원문의 다의성과 시적 이미지를 살렸습니다.
theological_decisions:
- issue: 의인과 악인의 지혜 문학적 대조를 어떻게 현대 한국어로 유지할지
  chosen_reading: 도덕적 범주를 분명히 드러내되, 종교적 교단어보다 본문이 말하는 성품과 말의 성격을 직접 보여 주는 표현을 택했습니다.
  alternative_readings:
  - 신자/불신자
  - 착한 사람/악한 사람
  rationale: 잠언의 대조는 공동체 소속보다 삶의 성격과 언어 행위를 평가하는 지혜 전통의 범주이므로, ‘의인/악인’을 유지하는 것이 본문의 논리를 가장 잘 보존합니다.
  doctrine_reference: 지혜문학의 윤리적 분별과 언어 윤리
