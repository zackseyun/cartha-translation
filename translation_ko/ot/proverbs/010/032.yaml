revisions:
- from: 의인들의 입술은 합당한 것을 압니다. 그러나 악인들의 입은 비뚤어진 것들을 말합니다.[a][b]
  to: 의인의 입술은 받아들일 만한 것을 압니다.[a] 그러나 악인의 입은 패역한 말을 합니다.[b]
  rationale: 원문의 시적 신체 대구와 윤리적 대비를 유지하되, 범주적 단수 표현을 한국어 잠언 문체에 맞게 ‘의인/악인’으로 정리했습니다. ‘합당한 것’은 원문의 רָצוֹן이 지닌 ‘기쁘게 함/호의/받아들여짐’의 뉘앙스를 충분히 드러내지 못할 수 있어 ‘받아들일 만한 것’으로 조정했습니다. 또한 ‘비뚤어진 것들’은 한국어에서 발화의 목적어로 어색하므로, 원문이 가리키는 왜곡되고 패역한 발화를 ‘패역한 말’로 자연스럽게 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:37:28Z'
