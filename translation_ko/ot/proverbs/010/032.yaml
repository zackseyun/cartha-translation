  naturalness: ‘의인의 입술은 받아들일 만한 것을 압니다’는 잠언의 의인화된 시적 표현을 보존하면서도 현대 한국어에서 이해 가능합니다. ‘악인의 입은 패역한 말을 합니다’는 생략된 동사를 자연스럽게 보충하고 תַּהְפֻּכוֹת가 가리키는 뒤틀리고 그릇된 말을 명료하게 나타냅니다.
