source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
  footnotes:
  - marker: a
    text: Or 'what is pleasing' or 'favor.' The Hebrew noun can denote favor, goodwill, or what is acceptable/fitting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply 'but the mouth of the wicked—perversities/perverse things'; the English verb 'speaks' is supplied for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 입술은 받아들일 만한 것을 압니다.[a] 그러나 악인의 입은 패역한 말을 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받아들일 만한 것’에 해당하는 히브리어 רָצוֹן은 문맥에 따라 ‘호의’, ‘기쁘게 하는 것’, 또는 ‘받아들일 만한 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그러나 악인들의 입은 패역들’입니다. ‘말을 합니다’는 한국어 문장을 위해 보충했습니다. ‘패역한 말’은 ‘뒤틀린 것들’, ‘그릇된 말들’로도 옮길 수 있습니다.
    reason: lexical_alternative
