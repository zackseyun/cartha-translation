  lexicon: HALOT
  rationale: 문맥상 의인의 입술이 분별하는 대상은 ‘호의’ 자체보다 말로서 적합하고 받아들일 만한 것이라서, 한국어에서는 ‘합당한 것’이 가장 자연스럽고 원문의 의미 범위를 좁히지 않습니다.
