base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
  footnotes:
  - marker: a
    text: Or 'When the whirlwind passes' or 'As the storm passes.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'and there is no wicked.' The sense is that the wicked disappear or perish.
    reason: lexical_alternative
translation:
  language: ko
  text: 폭풍이 지나가면 악인은 더 이상 없지만, 의인은 영원한 기초입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 סוּפָה는 ‘폭풍’ 외에 ‘회오리바람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그리고 악인이 없다’입니다. 문맥상 악인이 사라지거나 멸망한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר סוּפָה
  english_pob_choice: When the storm passes
  chosen_korean: 폭풍이 지나가면
  alternatives_korean:
  - 폭풍이 스쳐 지나가면
  - 회오리바람이 지나가면
  - 폭풍이 지나갈 때
  lexicon: HALOT
  rationale: כעבור는 시간적 ‘지나감’을 나타내고 סוּפָה는 폭풍/회오리바람 계열의 강한 자연현상입니다. 한국어에서는 ‘폭풍이 지나가면’이 가장 자연스럽고, 원문의 사건성 있는 대비를 잘 살립니다.
- source_word: וְאֵין רָשָׁע
  english_pob_choice: the wicked are no more
  chosen_korean: 악인은 더 이상 없지만
  alternatives_korean:
  - 악인이 더 이상 없지만
  - 악인은 사라지지만
  - 악인은 없다
  lexicon: HALOT
  rationale: ‘וְאֵין’은 단순 존재 부정이지만 문맥상 사라짐/소멸의 결과를 뜻하므로 ‘더 이상 없지만’으로 옮겼습니다. 대표 단수 표현인 רָשָׁע는 집합적 의미의 ‘악인’이 자연스럽습니다.
- source_word: וְצַדִּיק יְסוֹד עוֹלָם
  english_pob_choice: the righteous are an everlasting foundation
  chosen_korean: 의인은 영원한 기초입니다
  alternatives_korean:
  - 의인은 영원한 토대입니다
  - 의인은 영원한 기초가 됩니다
  - 의인은 영원한 기둥입니다
  lexicon: HALOT
  rationale: צַדִּיק은 집합적으로 ‘의인’이라 옮기고, יְסוֹד는 ‘기초/토대’ 중 직접적인 ‘기초’를 선택했습니다. עוֹלָם은 단순히 부사처럼 ‘영원히’보다 수식어로 자연스러운 ‘영원한’이 적합합니다.
theological_decisions:
- issue: 대표 단수의 집합적 의미
  chosen_reading: ‘악인’과 ‘의인’을 각각 한 사람의 남성으로 좁히지 않고, 잠언의 일반 진술로 읽히도록 집합명사로 번역했습니다.
  alternative_readings:
  - 악한 사람
  - 의로운 사람
  - 악인들
  - 의인들
  rationale: 히브리어의 단수 형용사는 잠언에서 범주 전체를 대표하는 방식으로 쓰입니다. 한국어에서도 집합적 표현을 써서 원문의 일반적 지혜 진술을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
