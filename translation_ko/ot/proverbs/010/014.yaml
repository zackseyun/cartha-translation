  source_fidelity: 히브리어의 대조 구조와 핵심 어휘는 대체로 잘 반영되었습니다. 다만 מְחִתָּה קְרוֹבָה는 어리석은 자의 ‘입’이 멸망에 가까움을 말하므로, 현행 ‘입은 멸망이 가깝습니다’는 한국어 문장 구조상 멸망 자체가 가까이 온다는 뜻으로 쉽게 읽혀 원문의 술어 관계가 흐려집니다.
