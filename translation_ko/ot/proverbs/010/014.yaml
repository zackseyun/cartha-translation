id: PRO.10.14
reference: Proverbs 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲכָמִ֥ים יִצְפְּנוּ דָ֑עַת וּ/פִֽי אֱ֝וִיל מְחִתָּ֥ה קְרֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
  footnotes:
  - marker: a
    text: Or 'The wise store up knowledge, and the mouth of a fool brings near ruin.' The Hebrew conjunction can be read as either simple 'and' or adversative 'but'; the context favors contrast.
    reason: lexical_alternative
  - marker: b
    text: '''Store up'' may also be rendered ''treasure up'' or ''hide,'' conveying the prudent preservation of knowledge.'
    reason: lexical_alternative
  - marker: c
    text: '''Ruin'' may also be translated ''destruction'' or ''dismay/terror,'' depending on how מְחִתָּה is understood in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람들은 지식을 저장해 두지만, 어리석은 자의 입은 멸망이 가깝습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저장해 두다’는 ‘간직하다’나 ‘숨겨 두다’로도 옮길 수 있는데, 여기서는 지식을 지혜롭게 보존하는 뜻을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸망’은 문맥에 따라 ‘파멸’이나 ‘파괴’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכָמִים
  english_pob_choice: Wise men
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜로운 자들
  - 지혜자들
  lexicon: HALOT
  rationale: 히브리어 복수형 지혜로운 이들을 가리키므로 대표적 복수 표현으로 옮겼습니다. ‘사람들’은 현대 한국어에서 자연스럽고 성별 고정 없이 속담체를 살립니다.
- source_word: יִצְפְּנוּ
  english_pob_choice: store up
  chosen_korean: 저장해 두지만
  alternatives_korean:
  - 간직하지만
  - 쌓아 두지만
  - 숨겨 두지만
  lexicon: HALOT
  rationale: 지혜 문맥에서 צפן은 단순 은닉이 아니라 지식의 신중한 보존을 뜻하므로, ‘저장해 두다’로 실용적이고 누적적인 의미를 살렸습니다.
- source_word: וּפִי
  english_pob_choice: but the mouth of
  chosen_korean: 하지만 … 입은
  alternatives_korean:
  - 그리고 … 입은
  lexicon: HALOT
  rationale: 와우 접속사는 문맥상 대비를 이루므로 한국어에서도 ‘하지만’으로 대조를 분명히 했습니다.
- source_word: מְחִתָּה
  english_pob_choice: ruin
  chosen_korean: 멸망
  alternatives_korean:
  - 파멸
  - 파괴
  - 재앙
  lexicon: HALOT
  rationale: 문맥상 감정적 ‘두려움’보다 입에서 비롯되는 임박한 붕괴/재난을 가리키므로, 간결하고 강한 ‘멸망’을 택했습니다.
