  - 숨깁니다
  - 덮어 줍니다
  lexicon: HALOT
  rationale: 직역 이미지인 '덮다'를 유지해 사랑이 허물을 들추거나 증폭시키지 않는다는 비유를 보존했습니다.
theological_decisions:
- issue: '''사랑이 모든 허물을 덮는다''의 의미'
  chosen_reading: 사랑은 허물을 폭로하거나 확대하지 않고, 관계를 깨뜨리는 방향으로 다루지 않습니다.
  alternative_readings:
  - 사랑은 모든 죄를 무조건 용서한다
  - 사랑은 모든 잘못을 외면해도 된다
  rationale: 히브리어는 '덮다'라는 은유를 사용하므로, 용서의 교리로 과도하게 좁히거나 부정의한 은폐로 오해되지 않도록 은유 자체를 살려야 합니다.
  doctrine_reference: 비유는 보존하고 신학적 긴장은 해소하지 않습니다.
