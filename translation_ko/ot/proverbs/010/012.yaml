source:
  edition: WLC
  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
  footnotes:
  - marker: a
    text: Or 'strife' instead of 'conflicts.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'covers all transgressions'; the image is of love not exposing or perpetuating offenses.
    reason: lexical_alternative
translation:
  language: ko
  text: 미움은 다툼을 일으키지만, 사랑은 모든 허물을 덮습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다툼’은 여기서 מְדָנִים의 자연스러운 한국어 표현이며, 대조를 더 분명히 하는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘모든 허물을 덮는다’고 하며, 사랑이 허물을 들추거나 퍼뜨리지 않는 이미지를 담습니다.
    reason: source_note
lexical_decisions:
- source_word: שִׂנְאָה
  english_pob_choice: Hatred
  chosen_korean: 미움
  alternatives_korean:
  - 증오
  - 혐오
  lexicon: HALOT
  rationale: 추상명사 주어로서의 כוח을 살리면서도 현대 한국어에서 자연스러운 대조항을 만들기 위해 '미움'을 택했습니다.
- source_word: תְּעוֹרֵר מְדָנִים
  english_pob_choice: stirs up conflicts
  chosen_korean: 다툼을 일으키다
  alternatives_korean:
  - 분쟁을 일으키다
  - 갈등을 불러일으키다
  - 논쟁을 부추기다
  lexicon: HALOT
  rationale: 동사의 적극적 선동 의미를 살리되, 잠언 문맥에서 가장 간결하고 구어적이면서도 문어적인 표현으로 옮겼습니다.
- source_word: פְּשָׁעִים
  english_pob_choice: transgressions
  chosen_korean: 허물
  alternatives_korean:
  - 죄과
  - 범죄
  - 죄악
  lexicon: HALOT
  rationale: 도덕적 잘못이라는 무게를 유지하면서도 한국어 잠언체에서 자연스럽고 폭넓게 쓰이는 표현입니다.
- source_word: תְּכַסֶּה
  english_pob_choice: covers
  chosen_korean: 덮습니다
  alternatives_korean:
  - 가립니다
  - 숨깁니다
  - 덮어 줍니다
  lexicon: HALOT
  rationale: 직역 이미지인 '덮다'를 유지해 사랑이 허물을 들추거나 증폭시키지 않는다는 비유를 보존했습니다.
theological_decisions:
- issue: '''사랑이 모든 허물을 덮는다''의 의미'
  chosen_reading: 사랑은 허물을 폭로하거나 확대하지 않고, 관계를 깨뜨리는 방향으로 다루지 않습니다.
  alternative_readings:
  - 사랑은 모든 죄를 무조건 용서한다
  - 사랑은 모든 잘못을 외면해도 된다
  rationale: 히브리어는 '덮다'라는 은유를 사용하므로, 용서의 교리로 과도하게 좁히거나 부정의한 은폐로 오해되지 않도록 은유 자체를 살려야 합니다.
  doctrine_reference: 비유는 보존하고 신학적 긴장은 해소하지 않습니다.
