translation:
  language: ko
  text: 미움은 다툼을 일으키지만, 사랑은 모든 허물을 덮습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 허물을 덮는다’고 합니다. 이는 사랑이 허물을 들추거나 퍼뜨리지 않는다는 이미지를 담습니다.
    reason: source_note
