  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יִרְע֣וּ רַבִּ֑ים וֶֽ֝/אֱוִילִ֗ים בַּ/חֲסַר לֵ֥ב יָמֽוּתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
  footnotes:
  - marker: a
    text: Or 'nourish many'; the Hebrew verb can also mean 'shepherd' or 'pasture.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'by lack of heart,' with 'heart' in Hebrew often referring to understanding or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들의 입술은 많은 사람을 먹이고, 어리석은 자들은 마음의 부족함 때문에 죽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘먹이다’ 외에 ‘목양하다’, ‘기르다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음의 부족함으로’이며, 히브리어에서 ‘마음’은 종종 이해와 판단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  english_pob_choice: the lips of
  chosen_korean: 입술은
  alternatives_korean:
  - 말은
  - 입의 말은
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘~의 입술’이지만, 잠언의 비유를 살리면서도 한국어에서 자연스럽게 읽히도록 주어를 ‘입술은’으로 옮겼습니다.
- source_word: יִרְעוּ
  english_pob_choice: feed
  chosen_korean: 먹이고
  alternatives_korean:
  - 기르고
  - 목양하고
  - 먹여 살리고
  lexicon: HALOT
  rationale: 동사는 원뜻상 ‘목양하다/먹이다’의 범위를 가지며, POB의 ‘feed’에 맞춰 생명을 살리는 공급의 이미지를 살리기 위해 ‘먹이고’로 옮겼습니다.
- source_word: בַּחֲסַר לֵב
  english_pob_choice: for lack of sense
  chosen_korean: 마음의 부족함 때문에
  alternatives_korean:
  - 마음이 부족하여
  - 분별이 없어서
  - 마음이 없어
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 감정보다 이해·판단을 가리키므로, POB 주석의 취지를 따라 ‘마음의 부족함’으로 옮겨 지혜의 결핍을 드러냈습니다.
theological_decisions:
- issue: ‘지혜로운 말’의 생명 부여 이미지 유지
  chosen_reading: 의인의 입술이 다른 이들을 살리는 공급자 역할을 한다는 비유를 그대로 살렸습니다.
  alternative_readings:
  - 의인의 말은 많은 사람을 돕습니다
  - 의인의 말은 많은 사람에게 유익합니다
  rationale: 본문은 단순한 유익이 아니라 ‘먹임/목양’의 강한 생명 공급 이미지를 사용하므로, 이를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 의인의 말은 공동체를 살리는 통로라는 주제
