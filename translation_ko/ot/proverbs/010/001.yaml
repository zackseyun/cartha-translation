    text: Or 'a foolish son is a grief to his mother.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 잠언입니다. 지혜로운 아들은 아버지를 기쁘게 하지만, 어리석은 아들은 어머니의 근심입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어머니의 근심’은 ‘어머니의 슬픔’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁלֵי שְׁלֹמֹה
  english_pob_choice: The proverbs of Solomon
  chosen_korean: 솔로몬의 잠언입니다
  alternatives_korean:
  - 솔로몬의 속담입니다
  - 솔로몬의 잠언들입니다
  lexicon: HALOT
  rationale: 표제어 기능을 살려 책의 첫 머리를 자연스럽게 제시하되, מִשְׁלֵי의 관용적 복수성을 한국어에서도 잠언으로 유지했습니다.
- source_word: חָכָם
  english_pob_choice: wise
  chosen_korean: 지혜로운
  alternatives_korean:
  - 현명한
  - 슬기로운
  lexicon: HALOT
  rationale: 잠언 문맥에서 חָכָם은 단순한 지적 능력보다 삶의 분별과 도덕적 지혜를 가리키므로, 현대 한국어에서 그 의미를 가장 자연스럽게 드러내는 ‘지혜로운’을 택했습니다.
- source_word: יְשַׂמַּח אָב
  english_pob_choice: makes a father glad
  chosen_korean: 아버지를 기쁘게 하지만
  alternatives_korean:
  - 아버지를 즐겁게 하지만
  - 아버지를 기쁘게 하여
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘기쁘게 하다’로 옮겼고, 앞뒤 대조를 분명히 하기 위해 종결 연결을 자연스럽게 조정했습니다.
- source_word: כְּסִיל
  english_pob_choice: foolish
  chosen_korean: 어리석은
  alternatives_korean:
  - 우매한
  - 미련한
  lexicon: HALOT
  rationale: כְּסִיל은 지적 부족보다 도덕적·실천적 어리석음을 뜻하므로, 현대 한국어에서 가장 무난하고도 강한 ‘어리석은’을 선택했습니다.
- source_word: תּוּגַת אִמּוֹ
  english_pob_choice: the grief of his mother
  chosen_korean: 어머니의 근심입니다
  alternatives_korean:
  - 어머니의 슬픔입니다
  - 어머니의 고통입니다
  lexicon: HALOT
  rationale: תּוּגָה의 기본 의미는 슬픔/근심이지만, 잠언의 짧은 대구에서 한국어로는 ‘근심’이 더 자연스럽게 지속적 마음의 짐을 전달합니다.
theological_decisions:
- issue: 대조 접속의 처리
  chosen_reading: ‘하지만’으로 אנטיתhetic parallelism을 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그러나
  rationale: 히브리어 ו는 형식상 ‘그리고’이지만, 두 행이 명백한 대조를 이루므로 한국어 독자가 구조를 즉시 파악하도록 ‘하지만’으로 옮겼습니다.
  doctrine_reference: 지혜문학의 대구법과 수사 구조 보존
