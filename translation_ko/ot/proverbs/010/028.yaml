  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
  footnotes:
  - marker: a
    text: Or 'hope' for 'expectation' in the first line; the Hebrew uses a different noun than in the second line, though the meanings overlap.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들의 기대는 기쁨이지만, 악인들의 희망은 사라집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫째 행의 תּוֹחֶלֶת은 둘째 행의 תִקְוָה와 의미는 겹치지만 서로 다른 명사이므로, 한국어에서는 ‘기대’로 구별해 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  english_pob_choice: expectation
  chosen_korean: 기대
  alternatives_korean:
  - 희망
  - 기다림
  lexicon: HALOT
  rationale: 첫 행의 תּוֹחֶלֶת은 단순한 ‘희망’보다 ‘기대’가 더 잘 드러내며, 둘째 행의 תִקְוָה와 한국어에서 지나치게 평행해지는 것을 조금 피할 수 있습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 지혜문학의 집단 대조를 살리기 위해 명사화된 복수 표현을 택했습니다.
- source_word: שִׂמְחָה
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: HALOT
  rationale: 시어에서 가장 자연스럽고 간결한 대응어입니다.
- source_word: תֹּאבֵד
  english_pob_choice: will perish
  chosen_korean: 사라집니다
  alternatives_korean:
  - 멸망합니다
  - 없어집니다
  lexicon: HALOT
  rationale: 문법상 직접적으로는 ‘악인들의 희망’이 사라진다는 뜻이므로, 한국어에서는 ‘사라집니다’로 옮겨 주어 희망의 소멸을 분명히 했습니다.
theological_decisions:
- issue: 둘째 행의 소멸 대상
  chosen_reading: 사라지는 것은 악인 자체가 아니라 악인들의 희망입니다.
  alternative_readings:
  - 악인 전체의 몰락을 넓게 암시한다고 볼 수 있습니다.
  rationale: 히브리어 동사는 תִקְוַת('희망')에 일치하므로, 본문이 직접 말하는 범위를 넘겨 최종 심판론을 덧씌우지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
