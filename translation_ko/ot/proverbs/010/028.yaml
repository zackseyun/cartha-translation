translation:
  language: ko
  text: 의인들의 기대[a]는 기쁨이지만, 악인들의 희망은 사라집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫째 행의 תּוֹחֶלֶת은 둘째 행의 תִּקְוָה와 의미가 겹치지만 서로 다른 명사입니다. 이 차이를 반영하여 첫째 행은 ‘기대’로, 둘째 행은 ‘희망’으로 구별해 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  english_pob_choice: expectation
  chosen_korean: 기대
  alternatives_korean:
  - 희망
  - 기다림
  lexicon: HALOT
  rationale: 첫 행의 תּוֹחֶלֶת은 단순한 ‘희망’보다 ‘기대’가 더 잘 드러내며, 둘째 행의 תִקְוָה와 한국어에서 지나치게 평행해지는 것을 조금 피할 수 있습니다.
