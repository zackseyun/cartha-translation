id: PRO.28.25
reference: Proverbs 28:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
  footnotes:
  - marker: a
    text: Literally, 'broad of soul,' an idiom for a grasping or insatiable appetite; alternatively, 'the proud person' or 'the one of large appetite.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'will be made fat,' a Hebrew image for flourishing or abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 탐욕스러운 사람은 다툼을 일으키고, 야훼를 신뢰하는 이는 풍성해집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘넓은 영혼’이지만, 이 관용구는 잠언에서 탐욕이나 만족하지 못하는 욕구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘살찌게 되다’에 가까우며, 여기서는 번성이나 풍요의 이미지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  english_pob_choice: A greedy person
  chosen_korean: 탐욕스러운 사람
  alternatives_korean:
  - 욕심 많은 사람
  - 욕망이 큰 사람
  - 넓은 영혼의 사람
  lexicon: HALOT, BDB
  rationale: 직역하면 ‘넓은 영혼’이지만, 잠언 문맥에서는 절제되지 않은 탐욕을 가리키는 관용구이므로 한국어로는 도덕적 의미가 분명한 ‘탐욕스러운 사람’이 가장 자연스럽습니다.
- source_word: יְגָרֶה מָדוֹן
  english_pob_choice: stirs up strife
  chosen_korean: 다툼을 일으키고
  alternatives_korean:
  - 분쟁을 일으키고
  - 논쟁을 부추기고
  - 다툼을 자극하고
  lexicon: HALOT, BDB
  rationale: 동사의 원뜻은 갈등을 촉발하는 것이므로, 잠언의 간결한 평행법에 맞게 ‘다툼을 일으키고’로 옮겼습니다.
- source_word: וּבֹטֵחַ עַל יְהוָה
  english_pob_choice: the one who trusts in Yahweh
  chosen_korean: 야훼를 신뢰하는 이는
  alternatives_korean:
  - 야훼를 믿는 이는
  - 야훼께 의지하는 이는
  - 주님을 신뢰하는 이는
  lexicon: HALOT, BDB
  rationale: עַל + בטח의 기본 의미는 ‘~을 의지하다/신뢰하다’이지만, 한국어에서는 ‘신뢰하다’가 더 직접적으로 대응합니다. יְהוָה는 본문 그대로 ‘야훼’로 옮겼습니다.
- source_word: יְדֻשָּׁן
  english_pob_choice: will be enriched
  chosen_korean: 풍성해집니다
  alternatives_korean:
  - 부유해집니다
  - 번성합니다
  - 살이 찝니다
  lexicon: HALOT, BDB
  rationale: 직역의 ‘살찌다’는 한국어에서 물질적·신체적 이미지가 지나치게 강해질 수 있어, 히브리어의 번성·풍요 이미지를 살리는 ‘풍성해집니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 언약적 고유명사를 ‘야훼’로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 지혜문학의 대표적 단수 표현
  chosen_reading: 탐욕스러운 사람 / 야훼를 신뢰하는 이는
  alternative_readings:
  - 탐욕스러운 자 / 야훼를 신뢰하는 자는
  - 탐욕스러운 사람 / 야훼를 믿는 사람은
  rationale: 히브리어는 남성 단수 대표형이지만, 한국어에서는 잠언의 일반 진술로 자연스럽게 읽히도록 ‘사람/이는’으로 옮겼습니다. 의미의 대표성은 유지하되 문체는 현대 합쇼체를 따랐습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
