id: PRO.28.16
reference: Proverbs 28:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
  footnotes:
  - marker: a
    text: Or, 'and commits much extortion.' The Hebrew phrase is literally 'and great in oppressions.'
    reason: lexical_alternative
  - marker: b
    text: '''Unjust gain'' can also be rendered ''greedy profit'' or ''ill-gotten gain.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 분별이 없는 지도자는 압제를 일삼지만[a], 불의한 이익을 미워하는 사람은[b] 오래 삽니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘그리고 압제 행위가 많다’에 가깝습니다.
    reason: source_note
  - marker: b
    text: ‘불의한 이익’은 ‘탐욕스러운 이익’ 또는 ‘부정한 이익’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 지도자
  alternatives_korean:
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: נָגִיד는 권위를 가진 통치자를 가리키지만, 잠언의 일반적 교훈문맥에는 ‘지도자’가 자연스럽고 오늘날 한국어에서 과도한 왕정적 뉘앙스를 피합니다.
- source_word: חֲסַר תְּבוּנוֹת
  english_pob_choice: lacking understanding
  chosen_korean: 분별이 없는
  alternatives_korean:
  - 이해가 없는
  - 통찰이 부족한
  lexicon: HALOT
  rationale: תְּבוּנוֹת는 지혜문학에서 단순 지식보다 분별과 판단력을 뜻하므로, ‘분별이 없는’이 짧고도 의미를 잘 살립니다.
- source_word: וְרַב מַעֲשַׁקּוֹת
  english_pob_choice: great in acts of oppression
  chosen_korean: 압제를 일삼지만
  alternatives_korean:
  - 압제에 많지만
  - 억압 행위가 많지만
  - 압제와 착취가 많지만
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘압제에 크다/많다’에 가까워 한국어로는 비유를 풀어 ‘압제를 일삼다’로 옮기는 것이 자연스럽습니다. 동사적 표현은 반복적이고 적극적인 가해를 드러냅니다.
- source_word: בֶצַע
  english_pob_choice: unjust gain
  chosen_korean: 불의한 이익
  alternatives_korean:
  - 부정한 이익
  - 탐욕스러운 이익
  - 불법한 이익
  lexicon: HALOT
  rationale: בֶצַע는 단순한 ‘이익’이 아니라 부당하게 얻은 이익이나 탐욕과 결부된 이득을 뜻하므로, ‘불의한 이익’이 도덕적 함의를 보존합니다.
- source_word: יַאֲרִיךְ יָמִים
  english_pob_choice: will prolong his days
  chosen_korean: 자기 날을 길게 합니다
  alternatives_korean:
  - 오래 살 것입니다
  - 그의 날을 길게 할 것입니다
  - 생명을 연장할 것입니다
  lexicon: HALOT
  rationale: 히브리 관용구를 그대로 살려 ‘날을 길게 하다’로 옮겼고, 주어를 일반적 잠언형 ‘사람’으로 이어 한국어 문장으로 자연스럽게 만들었습니다.
theological_decisions:
- issue: 보응의 일반 원리와 문장 형식
  chosen_reading: 이 절은 절대적 약속문이라기보다 잠언적 일반 원리로 읽고, 압제와 불의한 이익을 미워하는 태도에 장수의 귀결을 대비시켰습니다.
  alternative_readings:
  - 개별 사례에 대한 직접적 예언
  - 정치 지도자에 대한 특정한 역사 서술
  rationale: 지혜문학의 격언 형식은 일반적 진리를 압축해 말하므로, 한국어도 그 성격을 유지하는 것이 본문 의도를 가장 잘 반영합니다.
  doctrine_reference: 잠언의 지혜 교훈과 보응 원리
