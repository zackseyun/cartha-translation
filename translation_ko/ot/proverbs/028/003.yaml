  source_fidelity: 원문의 주어는 ‘가난한 사람’이며, עֹשֵׁק은 그가 ‘약한 이들을 억압하는’ 지속적 행위를 수식합니다. 현 초안의 ‘압제하면’은 원문에 없는 조건 관계를 넣습니다. 또한 וְאֵין לָחֶם은 파괴적인 비가 양식을 남기지 않는 결과를 나타내므로, 비를 수식하는 방식으로 더 분명히 표현하는 것이 좋습니다.
  naturalness: ‘먹을 것 없는 휩쓸어 가는 비’는 무엇이 먹을 것이 없는지 수식 관계가 불분명하고 어순도 자연스럽지 않습니다. ‘양식을 남기지 않는 쓸어 가는 비’는 현대 표준 한국어에서 비유의 파괴적 결과를 명료하게 전달합니다.
