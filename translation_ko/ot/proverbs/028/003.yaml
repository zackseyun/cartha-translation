source:
  edition: WLC
  text: גֶּ֣בֶר רָ֭שׁ וְ/עֹשֵׁ֣ק דַּלִּ֑ים מָטָ֥ר סֹ֝חֵ֗ף וְ/אֵ֣ין לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/003.yaml
  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
  footnotes:
  - marker: a
    text: Literally, 'and there is no bread.' 'Bread' here likely stands for food or provision generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람이 약한 이들을 억압하는 것은 양식을 남기지 않는 쓸어 가는 비와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그리고 빵이 없다’입니다. 여기서 ‘빵’은 음식이나 양식 일반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר רָשׁ
  english_pob_choice: A poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 가난한 자
  lexicon: HALOT
  rationale: גֶּבֶר는 문법상 남성형이지만 잠언의 일반적 인물을 가리키므로 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽습니다. רָשׁ은 경제적 궁핍을 뜻하므로 ‘가난한’으로 옮겼습니다.
- source_word: עֹשֵׁק דַּלִּים
  english_pob_choice: who oppresses the lowly
  chosen_korean: 낮은 자들을 압제하면
  alternatives_korean:
  - 가난한 자들을 압제하면
  - 약한 자들을 학대하면
  - 낮은 자들을 착취하면
  lexicon: HALOT
  rationale: עֹשֵׁק은 단순한 해악이 아니라 억압·착취의 지속적 행위를 가리키므로 ‘압제하다’가 가장 직접적입니다. דַּלִּים은 이미 앞의 רָשׁ과 구별되는 낮은 신분/연약함의 뉘앙스를 살려 ‘낮은 자들’로 옮겼습니다.
- source_word: מָטָר סֹחֵף
  english_pob_choice: a sweeping rain
  chosen_korean: 휩쓸어 가는 비
  alternatives_korean:
  - 몰아치는 비
  - 쓸어버리는 비
  - 세차게 내리는 비
  lexicon: HALOT
  rationale: סֹחֵף의 핵심은 휩쓸어 가는 파괴성입니다. 한국어에서는 ‘휩쓸어 가는’이 이미지와 동작을 그대로 살리면서도 시적·직설적입니다.
- source_word: וְאֵין לָחֶם
  english_pob_choice: that leaves no food
  chosen_korean: 먹을 것 없는
  alternatives_korean:
  - 빵이 없는
  - 양식이 없는
  - 먹을 것이 남지 않는
  lexicon: HALOT
  rationale: 직역하면 ‘그리고 빵이 없다’이지만, 여기서 לָחֶם은 음식/공급을 가리키는 환유로 보입니다. 본문 이미지에 맞게 ‘먹을 것’으로 풀어 의미를 전달하고, 더 문자적인 표현은 각주로 남깁니다.
theological_decisions:
- issue: 잠언의 비교문에서 원문의 비유 구조를 어떻게 처리할지
  chosen_reading: ‘~하면, ... 같습니다’로 조건-비유 구조를 유지했습니다.
  alternative_readings:
  - ‘...와 같습니다’로 단순 평서형 처리
  - ‘...과 같으니’로 고전적 문체 처리
  rationale: 히브리어의 진술형 비교를 한국어에서 자연스럽게 드러내면서도, 인과·조건의 도덕적 경고를 약화시키지 않기 위해 조건절과 비교절을 함께 살렸습니다.
  doctrine_reference: 잠언 문학의 교훈적 비유 구조
- issue: ‘빵/먹을 것’의 환유를 어떻게 표기할지
  chosen_reading: 본문은 ‘먹을 것’으로 옮기고, 각주에 문자적 ‘빵’의 의미를 밝혔습니다.
  alternative_readings:
  - 본문에 ‘빵’이라고 직역
  - 본문에 ‘양식’이라고 의역
  rationale: 한국어에서 ‘빵’은 현대 독자에게 음식 일반보다 특정 식품으로 좁게 들릴 수 있어, 본문은 보편적 의미를 전달하는 ‘먹을 것’이 더 적절합니다.
  doctrine_reference: 의미 보존과 환유 처리
