id: PRO.28.2
reference: Proverbs 28:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/פֶ֣שַֽׁע אֶ֭רֶץ רַבִּ֣ים שָׂרֶ֑י/הָ וּ/בְ/אָדָ֥ם מֵבִ֥ין יֹ֝דֵ֗עַ כֵּ֣ן יַאֲרִֽיךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
  footnotes:
  - marker: a
    text: Or, 'Because of a land's transgression, its princes are many; but by a man who understands and knows, it is prolonged.' The Hebrew of the second line is difficult; the sense is that wise understanding brings lasting stability.
    reason: alternative_reading
  - marker: b
    text: '''Man'' translates Hebrew adam, a singular generic term here referring representatively to a human leader or counselor, not necessarily excluding others by sex.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 죄악 때문에 그 통치자들은 많지만, 분별력과 지식이 있는 사람으로 말미암아 그 땅의 안정은 오래 유지됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 둘째 행, 특히 כֵּן의 뜻과 문장 연결은 어렵습니다. 이 말은 직역하면 ‘그렇게/그와 같이’이지만, 문맥상 분별력과 지식이 있는 사람으로 말미암아 그 땅의 확립된 상태 또는 안정이 오래 유지된다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람’은 히브리어 אָדָם의 단수 일반명사입니다. 여기서는 성별을 특정하지 않고, 지도자나 조언자와 같은 사람을 대표적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  english_pob_choice: Because of ... transgression
  chosen_korean: 범죄 때문에
  alternatives_korean:
  - 불법 때문에
  - 허물 때문에
  lexicon: HALOT
  rationale: בְ는 원인 관계를 나타내므로 ‘때문에’로 옮기고, פשע의 도덕·법정적 강도를 살려 ‘범죄’로 번역했습니다.
- source_word: אֶרֶץ
  english_pob_choice: a land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 한 땅
  lexicon: HALOT
  rationale: 잠언의 일반적 격언 표현에서 특정 국가명보다 포괄적인 ‘땅’이 자연스럽고, 원문의 보편성을 유지합니다.
- source_word: רַבִּים שָׂרֶיהָ
  english_pob_choice: its rulers are many
  chosen_korean: 통치자들이 많아지지만
  alternatives_korean:
  - 그 통치자들이 많지만
  - 지도자들이 많아지지만
  lexicon: HALOT
  rationale: שׂרים은 정치적 지배층을 가리키므로 ‘통치자들’이 가장 분명하며, רבים의 의미를 단순 수량보다 증식·증가의 흐름으로 살렸습니다.
- source_word: מֵבִין יֹדֵעַ
  english_pob_choice: of understanding and knowledge
  chosen_korean: 지각과 지식이 있는
  alternatives_korean:
  - 이해와 지식을 가진
  - 분별과 지식이 있는
  lexicon: HALOT
  rationale: 두 분사형을 한국어의 소유/특성 표현으로 자연스럽게 묶되, ‘분별/지각’과 ‘지식’의 두 요소를 분리해 보존했습니다.
- source_word: כֵּן יַאֲרִיךְ
  english_pob_choice: stability endures
  chosen_korean: 질서가 오래 지속됩니다
  alternatives_korean:
  - 안정이 오래 지속됩니다
  - 그것이 오래 지속됩니다
  lexicon: HALOT
  rationale: כֵּן은 단순 ‘그렇게’보다 ‘질서 있게 바로 선 상태’의 함의를 띠므로, 영어 POB의 복원된 해석을 따라 ‘질서’로 풀어 원문의 의미를 분명히 했습니다. יַאֲרִיךְ는 ‘오래 지속됩니다’로 옮겨 히필의 ‘길게 하다/연장하다’의 결과를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: כֵּן의 해석
  chosen_reading: ‘질서’로 옮겨, 지각과 지식이 있는 사람을 통해 공동체의 바로 선 상태가 오래 유지된다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘안정’으로 옮김
  - ‘그것이 오래 지속됩니다’로 직역
  rationale: 영어 POB는 최종적으로 ‘stability endures’로 복원되었고, 원문의 כֵּן을 단순 시간 부사로 축소하지 않고 질서·안정의 상태로 이해했습니다. 한국어에서는 그 의미를 한 단어로 드러내기 위해 ‘질서’를 선택했습니다.
  doctrine_reference: 잠언의 지혜 문학에서 사회 질서와 공동체 안정에 대한 일반 원리
- issue: אָדָם의 보편성
  chosen_reading: ‘한 사람’으로 표현해, 성별을 불필요하게 좁히지 않되 원문의 단수 대표성을 살렸습니다.
  alternative_readings:
  - ‘사람’
  - ‘인간’
  rationale: 영어 POB의 주석처럼 אָדָם은 대표적 단수이므로, 한국어에서는 직역적 ‘한 사람’이 문맥상 가장 자연스럽고 성별 배제 없이 읽힙니다.
  doctrine_reference: 대표적 단수의 일반 인간 지시
