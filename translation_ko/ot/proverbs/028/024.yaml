  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
  footnotes:
  - marker: a
    text: Or, “is a companion with a destroyer” / “is a companion to one who destroys.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지와 어머니에게서 빼앗고서도 “이것은 죄가 아닙니다”라고 말하는 자는 파괴하는 자의 동료입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “파괴하는 자와 동료입니다” / “파괴하는 자와 한패입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹזֵל
  english_pob_choice: robs
  chosen_korean: 강탈하고
  alternatives_korean:
  - 훔치고
  - 빼앗고
  lexicon: HALOT
  rationale: 가족에게서 강제로 빼앗는 행위를 드러내기 위해, 일반적인 ‘훔치다’보다 강도가 센 ‘강탈하다’를 택했습니다.
- source_word: אָבִיו וְאִמּוֹ
  english_pob_choice: his father and his mother
  chosen_korean: 아버지와 어머니
  alternatives_korean:
  - 부모를
  - 그의 아버지와 어머니를
  lexicon: HALOT
  rationale: 히브리어가 아버지와 어머니를 각각 따로 적으므로, 한국어에서도 둘을 분명히 드러냈습니다.
- source_word: אֵין פָּשַׁע
  english_pob_choice: It is no transgression
  chosen_korean: 이것은 범죄가 아닙니다
  alternatives_korean:
  - 이것은 죄가 아닙니다
  - 이것은 잘못이 아닙니다
  - 위법이 아닙니다
  lexicon: HALOT
  rationale: פָּשַׁע는 단순 실수보다 도덕적 위반을 가리키므로, 법적 뉘앙스를 과도하게 좁히지 않으면서도 ‘범죄’로 옮겼습니다.
- source_word: חָבֵר הוּא לְאִישׁ מַשְׁחִית
  english_pob_choice: is a companion of a destructive man
  chosen_korean: 파괴하는 사람의 동류입니다
  alternatives_korean:
  - 파괴하는 사람의 동무입니다
  - 파괴하는 자와 한패입니다
  - 파괴하는 사람과 동류입니다
  lexicon: HALOT
  rationale: חָבֵר는 단순한 우정보다 ‘같이 속한 관계’를 가리키므로, ‘동류’로 옮겨 도덕적 동일시를 살렸습니다.
theological_decisions:
- issue: 악행을 정당화하는 자기기만의 표현
  chosen_reading: “이것은 범죄가 아닙니다”라는 말은 행위를 무죄화하려는 자기기만으로 이해했습니다.
  alternative_readings:
  - “이것은 죄가 아닙니다”
  - “문제가 없습니다”
  rationale: פָּשַׁע의 도덕적 무게를 유지하면서, 화자가 자신의 행위를 합리화하는 뉘앙스를 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: 잠언의 지혜 전통과 도덕적 분별
- issue: מַשְׁחִית의 성격
  chosen_reading: ‘파괴하는 사람’은 단순한 파괴 행위가 아니라 사람과 공동체를 무너뜨리는 성향을 가리키는 것으로 보았습니다.
  alternative_readings:
  - ‘파괴자’
  - ‘멸망시키는 사람’
  rationale: 히브리어 분사형의 지속적 성격을 살리되, 한국어에서 과도하게 추상화되지 않도록 ‘사람’을 넣었습니다.
  doctrine_reference: 지혜문학의 성품-행위 연관
