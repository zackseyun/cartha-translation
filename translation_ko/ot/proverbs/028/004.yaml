source:
  edition: WLC
  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
  footnotes:
  - marker: a
    text: Or 'oppose them' or 'contend against them.' The Hebrew verb can carry the sense of striving against someone.
    reason: lexical_alternative
  - marker: b
    text: '''The law'' may also be rendered ''instruction'' or ''teaching,'' especially in wisdom contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 율법을 버리는 자들은 악인을 칭송하고, 율법을 지키는 자들은 그들과 다투게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투다’는 여기서 단순한 언쟁이 아니라, 맞서서 대항하거나 겨루는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 잠언의 지혜 문맥에서 ‘교훈’이나 ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי תוֹרָה
  english_pob_choice: those who forsake the law
  chosen_korean: 율법을 버리는 자들
  alternatives_korean:
  - 율법을 떠나는 자들
  - 율법을 저버리는 자들
  lexicon: HALOT
  rationale: תּוֹרָה를 이 절의 지혜문맥에서도 권위 있는 규범으로 보고 기본어휘인 ‘율법’으로 옮겼으며, עֹזְבֵי는 단순한 ‘떠남’보다 도덕적 배신감을 살리는 ‘버리다’가 더 적절합니다.
- source_word: יְהַלְּלוּ
  english_pob_choice: praise
  chosen_korean: 칭송하고
  alternatives_korean:
  - 찬양하고
  - 칭찬하고
  lexicon: HALOT
  rationale: פּיעל형의 적극적 평가/찬양의 뜻을 살리되, 악인을 향한 역설적 칭찬이라는 잠언적 뉘앙스를 반영해 ‘칭송하다’를 택했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: 히브리어 단수형이 대표적 집합 의미를 띠므로, 한국어에서는 단수 인칭보다 범주를 드러내는 ‘악인’이 자연스럽고 간결합니다.
- source_word: שֹׁמְרֵי תוֹרָה
  english_pob_choice: those who keep the law
  chosen_korean: 율법을 지키는 자들
  alternatives_korean:
  - 율법을 지키는 이들
  - 율법을 준수하는 자들
  lexicon: HALOT
  rationale: שׁמר의 핵심은 단순 보존이 아니라 규범을 충실히 지키는 행위이므로, 관용적인 ‘지키다’를 사용해 대조 구조를 분명하게 했습니다.
- source_word: יִתְגָּרוּ בָם
  english_pob_choice: contend with them
  chosen_korean: 그들과 다투게 됩니다
  alternatives_korean:
  - 그들과 대적하게 됩니다
  - 그들을 상대로 다투게 됩니다
  lexicon: HALOT
  rationale: 히트파엘형 גרה는 단순한 반대보다 ‘맞서 다툼을 벌이다’에 가깝기 때문에, 영어의 ‘contend’와 유사한 긴장감을 주는 ‘다투다’를 본문에 반영했습니다.
theological_decisions:
- issue: 둘째 행의 ‘그들’의 지시 대상
  chosen_reading: ‘그들’은 앞의 율법 버리는 자들, 곧 악인들을 가리킵니다.
  alternative_readings:
  - 일반적인 악인 전체를 가리킨다고 볼 수 있습니다
  - 문법상 앞선 복수 범주를 넓게 이어받는 표현으로 볼 수 있습니다
  rationale: 히브리어는 첫 행의 단수 대표명사와 둘째 행의 복수 대명사가 이어지므로, 한국어도 앞 절의 범주를 자연스럽게 이어 받아 ‘그들’로 처리하는 것이 본문의 압축성을 살립니다.
  doctrine_reference: 잠언 28:4의 평행법과 대명사 지시 관계
