  source_fidelity: 첫 절은 בּוֹטֵחַ בְּלִבּוֹ를 ‘자기 마음을 신뢰하는’으로, כְסִיל을 ‘어리석은 자’로 충실하게 옮겼습니다. 후반의 בְּחָכְמָה는 삶의 행로를 나타내는 지혜문학적 용례이므로 ‘지혜롭게 살아가는’이 자연스럽고 의미를 보존합니다. יִמָּלֵט은 ‘벗어납니다’로 옮겨 ‘escape’의 결과를 유지하며, 대안인 수동적 ‘구출됩니다’는 각주에 둡니다.
  naturalness: 현행 ‘피하게 됩니다’는 무엇을 피하는지 목적어 또는 보어가 생략되어 한국어 문장으로 다소 부자연스럽습니다. ‘벗어납니다’가 잠언의 압축적인 결과 진술에 더 자연스럽습니다. 또한 각주 표지는 해당 어휘 뒤에 직접 배치하는 편이 참조 범위를 명확히 합니다.
