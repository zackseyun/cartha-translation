id: PRO.28.26
reference: Proverbs 28:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
  footnotes:
  - marker: a
    text: Hebrew 'heart' often refers to the inner person, including thought, judgment, and will, not only emotion.
    reason: cultural_note
  - marker: b
    text: Or 'will be delivered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 마음을 신뢰하는 자는 어리석은 자요, 지혜로 행하는 자는 피하게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음’은 단지 감정만이 아니라 생각, 판단, 의지를 포함하는 내면을 가리키는 경우가 많습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘구출받게 됩니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  english_pob_choice: trusts
  chosen_korean: 신뢰하는
  alternatives_korean:
  - 믿는
  - 의지하는
  - 확신하는
  lexicon: HALOT
  rationale: בטח는 어떤 대상에 신뢰를 두는 뜻이므로, 문맥의 자기의존적 경고를 살리면서도 자연스러운 ‘신뢰하는’으로 옮겼습니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: in his own heart
  chosen_korean: 자기 마음
  alternatives_korean:
  - 그의 마음
  - 자기 속마음
  - 자기 심중
  lexicon: HALOT
  rationale: לֵב는 단순 감정보다 생각·판단·의지를 포함하는 내면을 가리키므로, ‘마음’으로 두되 소유·자기지시를 드러내기 위해 ‘자기’를 붙였습니다.
- source_word: כְסִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 자
  - 우매한 자
  - 어리석은 사람
  lexicon: HALOT
  rationale: כְסִיל은 지혜문학의 규범적 인물 유형이므로, 형용사보다 인격적 범주를 드러내는 ‘어리석은 자’가 가장 가깝습니다.
- source_word: יִמָּלֵט
  english_pob_choice: will escape
  chosen_korean: 피하게 됩니다
  alternatives_korean:
  - 도망하게 됩니다
  - 벗어나게 됩니다
  - 구출받게 됩니다
  lexicon: HALOT
  rationale: נלט의 নিপ할은 ‘도망하다/벗어나다/구출되다’의 폭이 있으나, 잠언의 간결한 결론을 살리면서 결과를 자연스럽게 나타내는 ‘피하게 됩니다’를 택했습니다.
theological_decisions:
- issue: ‘heart’의 인류학적 범위
  chosen_reading: ‘마음’을 유지하고, 이를 단순한 감정이 아니라 내면 전체로 읽히도록 두었습니다.
  alternative_readings:
  - 마음 대신 생각
  - 자기 자신
  rationale: 히브리어 לֵב는 사고·판단·의지를 포함하는 내면을 가리키므로, 현대 심리학적 범주로 축소하지 않고 본문 이미지를 보존했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 히브리 인류학 보존
- issue: 남성 단수의 대표성
  chosen_reading: ‘자기… 자는 … 자는’으로 남성 단수의 일반적 대표성을 크게 훼손하지 않는 방향으로 처리했습니다.
  alternative_readings:
  - 사람은 … 사람은
  - 누구든지 … 하는 이는
  rationale: 히브리어가 남성 단수로 말하지만 잠언의 일반 원리를 전달하는 데에는 한국어에서 성별 비특정의 관용적 명사가 적절합니다.
  doctrine_reference: 원문 문법의 대표성 유지
