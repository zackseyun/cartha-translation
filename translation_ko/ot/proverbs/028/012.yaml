  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
  footnotes:
  - marker: a
    text: Or 'a person' or 'people' in the sense that ordinary people go into hiding when the wicked gain power.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들이 기뻐하면 큰 영광이 있지만, 악인들이 일어서면 사람들이 숨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 특정 개인보다 일반적인 사람들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹץ צַדִּיקִים
  english_pob_choice: When the righteous rejoice
  chosen_korean: 의인들이 기뻐하면
  alternatives_korean:
  - 의인들이 즐거워하면
  - 의인들의 기쁨 속에
  lexicon: HALOT
  rationale: ב plus 동명사적 용법은 시간 절을 이루므로 ‘-하면’으로 옮겼고, צַדִּיקִים는 지혜문학의 통상적 표지인 ‘의인들’로 간결하게 살렸습니다.
- source_word: רַבָּה תִפְאָרֶת
  english_pob_choice: there is great glory
  chosen_korean: 큰 영광이 있지만
  alternatives_korean:
  - 큰 영화가 있지만
  - 큰 존귀함이 있지만
  - 영광이 풍성합니다
  lexicon: HALOT
  rationale: תִפְאָרֶת는 여기서 공적 번영과 존귀의 뉘앙스를 띠므로 ‘영광’으로, רַבָּה는 그 정도를 나타내는 형용사로 ‘큰’으로 옮겼습니다.
- source_word: וּבְקוּם רְשָׁעִים
  english_pob_choice: but when the wicked rise
  chosen_korean: 악인들이 일어서면
  alternatives_korean:
  - 악인들이 일어나면
  - 악인들이 권세를 잡으면
  lexicon: HALOT
  rationale: 대조를 이루는 접속사와 קום의 시간적 용법을 반영해 ‘-면’으로 처리했고, 정치·사회적 상황에서의 ‘일어남/등장함’을 자연스럽게 드러내기 위해 ‘일어서다’를 택했습니다.
- source_word: יְחֻפַּשׂ אָדָם
  english_pob_choice: people hide themselves
  chosen_korean: 사람들이 숨습니다
  alternatives_korean:
  - 한 사람이 숨습니다
  - 사람이 숨습니다
  - 사람들이 몸을 숨깁니다
  lexicon: HALOT
  rationale: Pual형은 수동·비인칭적으로 읽는 것이 자연스러워 능동 반사형으로 과도하게 좁히지 않고, אָדָם의 일반적 의미를 한국어 문맥에 맞게 ‘사람들’로 풀었습니다.
theological_decisions:
- issue: אָדָם의 일반적 단수 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: 사람들이
  alternative_readings:
  - 사람이
  - 한 사람이
  rationale: 히브리어는 단수 אדם을 일반명사적으로 쓰지만, 한국어에서는 이 뜻을 가장 자연스럽게 전달하는 복수 일반 표현이 ‘사람들이’이므로 독자가 사회적 일반성을 즉시 이해하도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; contested term אָדָם
