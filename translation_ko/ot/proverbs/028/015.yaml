id: PRO.28.15
reference: Proverbs 28:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲרִי נֹ֭הֵם וְ/דֹ֣ב שׁוֹקֵ֑ק מֹשֵׁ֥ל רָ֝שָׁ֗ע עַ֣ל עַם דָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/015.yaml
  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
  footnotes:
  - marker: a
    text: Or 'a ravenous bear' or 'a rushing bear'; the Hebrew participle for the bear conveys aggressive threat and may emphasize either its violent movement or its predatory hunger.
    reason: lexical_alternative
translation:
  language: ko
  text: 포효하는 사자와 달려드는 곰 같으니, 악한 통치자가 가난한 백성 위에 있는 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “탐욕스러운 곰” 또는 “몰려드는 곰”으로 옮길 수 있습니다. 히브리어 분사는 곰의 폭력적 움직임이나 사냥감에 대한 탐욕을 함께 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 젊은 사자
  lexicon: HALOT
  rationale: 일반 명사로서의 사자를 자연스럽게 살려 비유의 힘을 유지했습니다.
- source_word: נֹהֵם
  english_pob_choice: roaring
  chosen_korean: 포효하는
  alternatives_korean:
  - 으르렁거리는
  lexicon: HALOT
  rationale: 사자가 내는 소리를 한국어로 가장 생생하게 드러내는 표현으로, POB의 'roaring'에 대응합니다.
- source_word: שׁוֹקֵק
  english_pob_choice: charging
  chosen_korean: 달려드는
  alternatives_korean:
  - 맹렬히 몰려드는
  - 급히 덤벼드는
  lexicon: HALOT
  rationale: 곰의 위협적 움직임을 동적인 이미지로 옮겨, 'charging bear'의 급습성과 공격성을 살렸습니다.
- source_word: מֹשֵׁל רָשָׁע
  english_pob_choice: wicked ruler
  chosen_korean: 악한 통치자
  alternatives_korean:
  - 악한 군주
  - 악인인 통치자
  lexicon: HALOT
  rationale: מֹשֵׁל을 '통치자'로 옮기고, רָשָׁע의 도덕적 평가를 '악한'으로 직접 반영했습니다.
- source_word: עַם דָּל
  english_pob_choice: poor people
  chosen_korean: 가난한 백성
  alternatives_korean:
  - 가난한 사람들
  - 궁핍한 백성
  lexicon: HALOT
  rationale: עַם을 공동체로서의 '백성'으로, דָּל을 사회적 취약성을 드러내는 '가난한'으로 옮겼습니다.
theological_decisions:
- issue: 비유 구조 보존
  chosen_reading: 사자와 곰의 위협적 이미지가 악한 통치자의 폭압성과 정면으로 대응하도록, 직역보다 한국어 자연성을 택하되 비교 구문을 유지했습니다.
  alternative_readings:
  - 사자와 곰 같은 악한 통치자가 가난한 백성을 다스리는 것
  - 포효하는 사자와 돌진하는 곰처럼 악한 통치자는 가난한 백성 위에 있습니다
  rationale: 잠언의 지혜 문장은 압축된 비유가 핵심이므로, 이미지의 강도와 문장 대조를 유지하는 것이 의미 전달에 중요합니다.
  doctrine_reference: 잠언의 비유적 경구 해석 원리
- issue: '''위에 있는''의 권력 관계'
  chosen_reading: עַל의 지배 관계를 '위에 있는'으로 드러내어, 단순한 적대가 아니라 통치 권세 아래의 압박을 표현했습니다.
  alternative_readings:
  - 대해 있는
  - 대적하는
  rationale: 문맥상 동물의 공격성은 폭군의 권력 남용을 비유하며, 피지배 집단의 취약성을 함께 보여 줍니다.
  doctrine_reference: 지혜문학의 사회윤리적 비유
