source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
  footnotes:
  - marker: a
    text: Or 'empty things'; the Hebrew may also be understood by some as referring to empty or worthless people.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 땅을 가는 자는 빵이 넉넉하겠지만, 헛된 것들을 뒤쫓는 자는 가난으로 배부르게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 것들’은 히브리어를 보다 문자적으로 살린 표현이며, 일부는 ‘헛된 사람들’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  english_pob_choice: works
  chosen_korean: 가는
  alternatives_korean:
  - 일하는
  - 경작하는
  - 농사짓는
  lexicon: HALOT
  rationale: 문맥이 농경에 관한 잠언이므로 ‘가는’이 땅을 실제로 경작하는 행위를 자연스럽게 드러내며, 한국어 관용도에 맞습니다.
- source_word: אַדְמָתוֹ
  english_pob_choice: his land
  chosen_korean: 자기 땅
  alternatives_korean:
  - 그의 땅
  - 자기 토지
  - 자기 밭
  lexicon: HALOT
  rationale: אַדְמָה는 땅/토지를 가리키며, 소유 대명사를 살려 ‘자기 땅’으로 옮기면 원문의 소유 관계와 농경적 이미지를 함께 보존할 수 있습니다.
- source_word: רֵקִים
  english_pob_choice: worthless things
  chosen_korean: 헛된 것들
  alternatives_korean:
  - 빈 것들
  - 무가치한 것들
  - 헛된 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘빈 것들/빈 사람들’까지 가능하지만, 본절의 대조 구조상 허망하고 소용없는 추구를 가리키므로 ‘헛된 것들’이 가장 무난합니다.
- source_word: יִשְׂבַּע רִישׁ
  english_pob_choice: will have his fill of poverty
  chosen_korean: 가난으로 배부르게 됩니다
  alternatives_korean:
  - 가난에 흡족하게 됩니다
  - 가난으로 가득 차게 됩니다
  - 빈곤으로 배부르게 됩니다
  lexicon: HALOT
  rationale: שׂבע의 반복을 살리면서도 역설적 표현을 유지하기 위해 ‘배부르게 됩니다’를 사용했고, רִישׁ은 한국어 성경에서 일반적인 ‘가난’으로 옮겼습니다.
