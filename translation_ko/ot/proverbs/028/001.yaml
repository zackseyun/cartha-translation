id: PRO.28.1
reference: Proverbs 28:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָ֣סוּ וְ/אֵין רֹדֵ֣ף רָשָׁ֑ע וְ֝/צַדִּיקִ֗ים כִּ/כְפִ֥יר יִבְטָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
  footnotes:
  - marker: a
    text: Or, 'The wicked flee though no one pursues ... but the righteous are bold like a lion.' The Hebrew allows slightly different nuances for both clauses; 'young lion' reflects the more specific sense of כְּפִיר.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인은 쫓는 자가 없어도 도망하지만, 의인들은 어린 사자처럼 담대합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도망하다’는 본문이 단순한 이동이 아니라 두려움에 따른 도피를 가리킨다는 점을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  english_pob_choice: flee
  chosen_korean: 도망하지만
  alternatives_korean:
  - 달아나지만
  - 도망칩니다
  lexicon: HALOT
  rationale: 잠언의 격언체에서 יח의 일반적 진술을 자연스럽게 살리기 위해 현재적 일반 서술로 옮겼습니다.
- source_word: וְאֵין רֹדֵף
  english_pob_choice: when no one is pursuing
  chosen_korean: 쫓는 자가 없어도
  alternatives_korean:
  - 추적하는 이가 없을 때
  - 아무도 쫓지 않아도
  lexicon: HALOT
  rationale: ‘없어도’가 원문의 역설적 상황(추적자가 없는데도 도망함)을 한국어로 가장 간결하게 드러냅니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들은
  alternatives_korean:
  - 의로운 자들은
  - 의로운 사람들은
  lexicon: HALOT
  rationale: 복수형 명사적 형용사를 집단을 가리키는 ‘의인들’로 옮겨 악인과의 대조를 보존했습니다.
- source_word: כְּפִיר
  english_pob_choice: young lion
  chosen_korean: 어린 사자처럼
  alternatives_korean:
  - 젊은 사자처럼
  - 사자처럼
  lexicon: HALOT
  rationale: כְּפִיר의 더 구체적인 뜻을 살려 단순히 ‘사자’로 완화하지 않고 ‘어린 사자’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 집단적 도덕 유형 표현
  chosen_reading: ‘악인’과 ‘의인들’을 특정 개인이 아니라 대표적 도덕 범주로 번역했습니다.
  alternative_readings:
  - 악한 사람
  - 의로운 사람들
  rationale: 히브리어 원문의 일반적 격언 구조를 한국어에서도 유지하기 위해 집단적 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 4
