id: PRO.28.20
reference: Proverbs 28:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
  footnotes:
  - marker: a
    text: Or 'will not be held innocent' / 'will not be acquitted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 충실한 사람은 복을 많이 받지만, 부자가 되려고 서두르는 사람은 벌을 면하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄로 인정받지 못합니다’ / ‘무죄 선고를 받지 못합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 단수 אישׁ은 대표적·보편적 인간을 가리키는 속담 표현이므로, 현대 한국어에서는 성별을 불필요하게 좁히지 않는 ‘사람’이 가장 자연스럽습니다.
- source_word: אֱמוּנוֹת
  english_pob_choice: faithful
  chosen_korean: 충실한
  alternatives_korean:
  - 신실한
  - 믿음직한
  - 신뢰할 만한
  lexicon: HALOT
  rationale: 명사형 ‘믿음들/신실함들’이 형용사적으로 쓰인 것으로 보이므로, 관계의 성실성과 신뢰성을 함께 담는 ‘충실한’이 문맥상 적절합니다.
- source_word: לֹא יִנָּקֶה
  english_pob_choice: will not go unpunished
  chosen_korean: 벌을 면하지 못합니다
  alternatives_korean:
  - 무죄로 인정되지 못합니다
  - 벌을 받지 않습니다
  - 깨끗함을 얻지 못합니다
  lexicon: HALOT
  rationale: נקה의 니팔은 ‘무죄로 여겨지지 않다/벌을 면하지 못하다’의 뜻을 가질 수 있으므로, 지혜문학의 경고를 분명히 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 재물 추구의 도덕적 평가
  chosen_reading: ‘부자가 되려고 서두르는 사람’은 단순한 부의 소유가 아니라 조급하고 탐욕적인 축재를 경계하는 표현으로 읽었습니다.
  alternative_readings:
  - ‘빨리 부자가 되려는 사람’
  - ‘재물을 급히 모으려는 사람’
  rationale: 히브리어 אָץ לְהַעֲשִׁיר는 ‘서두르다/조급하다’와 ‘부자가 되다’의 결합으로, 결과보다 과정의 탐욕과 성급함을 비판합니다.
  doctrine_reference: 잠언의 지혜 전통에서 정직한 삶과 조급한 축재의 대비
