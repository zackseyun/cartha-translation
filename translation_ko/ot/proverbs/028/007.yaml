  text: נוֹצֵ֣ר תּ֭וֹרָה בֵּ֣ן מֵבִ֑ין וְ/רֹעֶה זֽ֝וֹלְלִ֗ים יַכְלִ֥ים אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
  footnotes:
  - marker: a
    text: Or 'associates with gluttons'; literally, 'shepherds gluttons.' The Hebrew verb carries a pastoral image used idiomatically for keeping company with certain people.
    reason: lexical_alternative
  - marker: b
    text: '''Gluttons'' may also be understood more broadly as wastrels or profligates—people given to excess and dissipation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 율법을 지키는 이는 분별 있는 아들이지만, 탐식하는 자들과 어울리는 이는 자기 아버지를 욕되게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘탐식하는 자들’은 더 넓게는 낭비와 방탕에 빠진 사람들, 곧 절제 없이 흥청망청 사는 자들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 רעה는 본래 ‘목양하다’ 또는 ‘치다’라는 뜻이지만, 여기서는 사람들과 ‘어울리다’ 또는 ‘교제하다’라는 관용적 의미로 쓰였습니다.
    reason: lexical_alternative
