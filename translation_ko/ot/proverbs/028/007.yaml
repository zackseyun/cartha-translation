  rationale: רֹעֶה의 목양 이미지는 여기서 동행/교제의 관용적 표현이므로 어울리는으로 옮겼고, זֹלְלִים은 단순한 과식보다 방탕한 낭비까지 포함할 수 있어 먹어 치우는 자들로 직역해 폭을 남겼습니다.
- source_word: יַכְלִים אָבִיו
  english_pob_choice: shames his father
  chosen_korean: 자기 아버지를 욕되게 합니다
