  text: 바른 사람들을 악한 길로 그릇 인도하는 사람은 자신이 자기 구덩이에 빠질 것이나, 흠 없는 사람들은 좋은 것을 물려받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
