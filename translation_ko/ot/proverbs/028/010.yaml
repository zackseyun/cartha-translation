  rationale: 원문에 없는 ‘오직’을 삭제하고, ‘자기 구덩이’로 원문의 소유 관계와 함정 이미지를 보존했습니다. 병행절의 복수형을 ‘바른 사람들’과 ‘흠 없는 사람들’로 반영했으며, ‘좋은 것’은 טוֹב의 넓은 의미를 유지합니다. 각주는 구덩이와 파멸/멸망이라는 어휘적 대안을 정확히 제시하도록 수정했습니다.
