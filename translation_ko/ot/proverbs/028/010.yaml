  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
  footnotes:
  - marker: a
    text: Or 'will fall into his own destruction' or 'his own ruin.' The Hebrew term can denote a pit or ruin/destruction; the main text preserves the proverb's trap imagery.
