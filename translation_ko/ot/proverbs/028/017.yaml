  source_fidelity: 초안의 ‘피의 책임을 진’은 혈죄라는 문맥적 의미를 전달하지만, עָשֻׁק의 ‘짓눌린/압박받는’ 상태와 בְּדַם נָפֶשׁ의 구체적 피의 이미지를 충분히 살리지 못합니다. 또한 בּוֹר를 본문에서 단정적으로 ‘무덤’으로 옮기면 ‘구덩이’라는 원이미지를 좁힙니다.
  naturalness: ‘그를 붙들어 주는 사람은 없어야 합니다’는 자연스럽기는 하나, 원문의 복수 금지/명령인 ‘아무도 그를 돕지 말라’보다 다소 우회적입니다. 수정문은 현대 표준어 합쇼체로 자연스럽고 간결합니다.
  terminology: ‘한 생명의 피를 흘린 죄책’은 혈죄의 함의를 드러내면서도, 주석에서 히브리어의 직역적 표현을 보존합니다. ‘구덩이’는 בּוֹר의 기본 의미와 죽음의 함의를 함께 열어 둡니다.
