id: PRO.28.17
reference: Proverbs 28:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a man oppressed/burdened by the blood of a life.' The expression refers to bloodguilt for taking a life.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the grave.' The Hebrew 'pit' can carry the sense of a deadly end.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 생명의 피를 흘린 죄책에 짓눌린 사람은 구덩이까지 달아날 것이니, 아무도 그를 돕지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘한 생명의 피로 짓눌린 사람’입니다. 이 표현은 한 생명을 죽인 데 따른 혈죄를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בּוֹר는 ‘구덩이’이며, 문맥에 따라 무덤이나 죽음에 이르는 종말을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: A man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 אָדָם은 여기서 특정 개인을 가리키는 단수 일반명사이므로, 한국어에서는 성별을 드러내는 표현보다 문맥상 중립적인 ‘사람’이 자연스럽습니다.
- source_word: עָשֻׁק
  english_pob_choice: burdened
  chosen_korean: 책임을 진
  alternatives_korean:
  - 억눌린
  - 눌린
  - 짐을 진
  lexicon: HALOT
  rationale: 이 어구는 혈흔 자체가 아니라 살해로 인한 혈죄의 부담을 가리키므로, 문맥에 맞게 ‘책임을 진’으로 옮겨 혈죄의 무게를 드러냈습니다.
- source_word: בְּדַם נָפֶשׁ
  english_pob_choice: with the blood of a life
  chosen_korean: 피의 책임
  alternatives_korean:
  - 생명의 피와 함께
  - 한 생명의 피로
  - 피흘림의 죄
  lexicon: HALOT
  rationale: 직역하면 ‘한 생명의 피’이지만, 본문은 살인으로 인한 유혈책임을 뜻하므로 한국어에서는 의미를 분명히 하는 ‘피의 책임’으로 표현했습니다.
- source_word: בּוֹר
  english_pob_choice: the pit
  chosen_korean: 무덤
  alternatives_korean:
  - 구덩이
  - 웅덩이
  - 깊은 구덩이
  lexicon: HALOT
  rationale: בּוֹר는 문자적으로 구덩이이지만 여기서는 죽음의 종착점을 가리킬 수 있어, 영어 주석의 허용 범위를 따라 ‘무덤’으로 번역해 종말적 함의를 살렸습니다.
- source_word: אַל יִתְמְכוּ בוֹ
  english_pob_choice: let no one support him
  chosen_korean: 그를 붙들어 주는 사람은 없어야 합니다
  alternatives_korean:
  - 그를 지탱하는 사람은 없어야 합니다
  - 그를 도와서는 안 됩니다
  - 아무도 그를 붙들지 말아야 합니다
  lexicon: HALOT
  rationale: 금지 표현을 한국어에서는 자연스러운 금지·권고형으로 풀어, 혈죄를 진 사람에게 공적 지지나 보호를 제공하지 말라는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 혈죄를 진 사람에 대한 최종 결과를 어떻게 드러낼 것인가
  chosen_reading: ‘무덤까지 달아날 것’으로 옮겨, 죄책이 결국 죽음의 자리로 그를 몰아간다는 종결성을 드러냈습니다.
  alternative_readings:
  - ‘구덩이까지 달아날 것’
  - ‘죽음까지 달아날 것’
  rationale: 히브리어 בּוֹר는 물리적 구덩이이면서도 죽음/파멸의 이미지를 담을 수 있으므로, 한국어 본문은 의미를 유지하되 과도한 해석을 피하는 방향을 택했습니다.
  doctrine_reference: 잠언의 지혜 문학이 말하는 도덕적 인과와 혈죄의 गंभीर성을 반영
