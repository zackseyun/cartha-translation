language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/ק֣וּם רְ֭שָׁעִים יִסָּתֵ֣ר אָדָ֑ם וּ֝/בְ/אָבְדָ֗/ם יִרְבּ֥וּ צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
  footnotes:
  - marker: a
    text: Or 'is hidden'; the Hebrew verb may be read as passive ('a man is hidden') or with a reflexive/middle sense ('a man hides himself').
    reason: lexical_alternative
  - marker: b
    text: '''A man'' renders Hebrew adam, which can function generically for a human being in proverbial speech.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들이 일어날 때에는 사람이 숨고, 그들이 멸망할 때에는 의인들이 많아집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּקוּם / יִסָּתֵר אָדָם
  english_pob_choice: when the wicked rise / a man hides himself
  chosen_korean: “악인들이 일어날 때에는 사람이 숨고”
  alternatives_korean:
  - 악인들이 일어날 때에는 사람이 숨습니다
  - 악인들이 일어날 때에는 사람이 숨겨집니다
  lexicon: HALOT
  rationale: ב plus 부정사구는 시간 부사절로 처리했고, יִסָּתֵר는 문맥상 수동/반사 둘 다 가능하므로 한국어에서는 자연스럽게 “사람이 숨고”로 두어 그 중의성을 보존했습니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 인간
  lexicon: HALOT
  rationale: 잠언의 일반적 격언 표현에서 אָדָם은 특정 성별보다 일반 인간을 가리키므로, 한국어에서는 자연스러운 보통명사 “사람”으로 옮겼습니다.
- source_word: וּבְאָבְדָם / יִרְבּוּ
  english_pob_choice: but when they perish / the righteous increase
  chosen_korean: “그들이 멸망할 때에는 의인들이 많아집니다”
  alternatives_korean:
  - 그들이 없어질 때에는 의인들이 많아집니다
  - 그들이 망할 때에는 의인들이 번성합니다
  lexicon: HALOT
  rationale: אָבַד는 단순 소멸보다 ‘멸망하다/없어지다’의 강한 상실을 띠므로 “멸망하다”를 택했고, רבה는 수적·사회적 증가를 포괄하므로 “많아집니다”로 간명하게 처리했습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 지혜문학에서 צַדִּיקִים의 통상적 집합명사성을 살리기 위해 복수형 “의인들”로 옮겼습니다.
