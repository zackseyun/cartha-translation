revisions:
- from: 정직하게 걷는 사람은 구원을 받지만, 자기 길이 비뚤어진 사람은 곧 넘어집니다.[a][b]
  to: 온전하게 살아가는 사람은 구출되지만, 행실이 비뚤어진 사람은 갑자기 넘어집니다.[a]
  rationale: 문맥상 일반적인 건짐을 뜻하는 יִוָּשֵׁעַ를 ‘구출됩니다’로 옮겨 불필요한 종말론적 함의를 피했습니다. תָּמִים의 도덕적 온전함과 נֶעְקַשׁ דְּרָכַיִם의 비뚤어진 행실이라는 대조를 자연스러운 현대 합쇼체로 표현했습니다. 난해한 בְּאֶחָת에 대한 각주는 해당 표현 뒤에만 배치하여 구조와 의미를 모두 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:09Z'
review_pass:
  verdict: revise
  source_fidelity: יִוָּשֵׁעַ in this wisdom saying most naturally denotes deliverance/preservation rather than a specifically eschatological sense; ‘구출됩니다’ communicates the passive future sense without importing that narrower connotation. נֶעְקַשׁ דְּרָכַיִם describes a person whose conduct is crooked, not primarily a physically crooked road. בְּאֶחָת is difficult and is reasonably represented by ‘갑자기,’ with a note retaining the literal wording and uncertainty.
  naturalness: ‘정직하게 걷는 사람’ is intelligible but somewhat wooden in contemporary Korean, and ‘자기 길이 비뚤어진 사람’ can suggest that the person’s road, rather than the person’s conduct, is crooked. ‘온전하게 살아가는 사람’ and ‘행실이 비뚤어진 사람’ are natural formal Korean while preserving the proverb’s moral contrast.
  terminology: ‘온전하게’ appropriately renders תָּמִים as moral wholeness without asserting sinless perfection. ‘구출됩니다’ is preferable here to ‘구원을 받습니다,’ whose common Korean theological resonance is more specific than the proverb requires. The lexical note on בְּאֶחָת is retained and correctly anchored to the phrase it explains.
  issues:
  - severity: medium
    issue: ‘구원을 받지만’ may be heard as specifically theological or eschatological salvation.
    rationale: The Niphal of ישׁע can bear ‘saved,’ but in this proverbial context general deliverance/preservation is the primary contextual sense. The draft’s own footnote acknowledges this tension; a contextual main-text rendering avoids it.
  - severity: medium
    issue: ‘자기 길이 비뚤어진 사람’ shifts the modifier toward the person’s path rather than the person characterized by crooked conduct.
    rationale: The Hebrew construction describes one who is crooked with respect to his ways. ‘행실이 비뚤어진 사람’ expresses this directly in idiomatic Korean.
  - severity: low
    issue: 'Footnote anchors are misplaced: both [a] and [b] occur after the final predicate, although [b] concerns ‘구원을 받다’ and [a] concerns the final temporal expression.'
    rationale: Anchors should immediately follow the words they explain. Since the revised text avoids ‘구원을 받다,’ its explanatory theological note is no longer needed.
  - severity: low
    issue: The note’s literal expression ‘한 번에’ is less exact and less idiomatic for the debated Hebrew phrase than ‘한순간에’/‘한꺼번에.’
    rationale: בְּאֶחָת literally contains ‘in/with one (feminine),’ and its idiomatic force is uncertain; the note should preserve that uncertainty without presenting an overly fixed Korean equivalent.
  revised_text: 온전하게 살아가는 사람은 구출되지만, 행실이 비뚤어진 사람은 갑자기 넘어집니다.[a]
  revised_footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘한순간에’ 또는 ‘한꺼번에’에 해당합니다. ‘갑자기’나 ‘단번에’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 일반적인 건짐을 뜻하는 יִוָּשֵׁעַ를 ‘구출됩니다’로 옮겨 불필요한 종말론적 함의를 피했습니다. תָּמִים의 도덕적 온전함과 נֶעְקַשׁ דְּרָכַיִם의 비뚤어진 행실이라는 대조를 자연스러운 현대 합쇼체로 표현했습니다. 난해한 בְּאֶחָת에 대한 각주는 해당 표현 뒤에만 배치하여 구조와 의미를 모두 바로잡았습니다.
