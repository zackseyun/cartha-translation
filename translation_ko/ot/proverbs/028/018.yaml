  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
  footnotes:
  - marker: a
    text: Or 'will be saved' or 'will be kept safe.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in one'; likely meaning 'all at once' or 'suddenly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 정직하게 걷는 사람은 구원을 받지만, 자기 길이 비뚤어진 사람은 곧 넘어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘한 번에’. 뜻은 ‘곧’ 또는 ‘갑자기’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원을 받다’는 여기서 종말론적 구원이라기보다 건짐·보호의 뜻일 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: הוֹלֵךְ תָּמִים
  english_pob_choice: whoever walks in integrity
  chosen_korean: 정직하게 걷는 사람은
  alternatives_korean:
  - 온전함으로 걷는 사람은
  - 결백하게 사는 사람은
  lexicon: HALOT
  rationale: הלך의 비유적 ‘걷다’ 이미지를 살리되, תמים의 핵심을 ‘정직’과 ‘온전함’ 중 한국어에서 자연스러운 품사로 풀어 문장성을 유지했습니다.
- source_word: יִוָּשֵׁעַ
  english_pob_choice: will be delivered
  chosen_korean: 구원을 받지만
  alternatives_korean:
  - 구출됩니다
  - 보호를 받지만
  - 살아남지만
  lexicon: HALOT
  rationale: 이 잠언 문맥에서는 종말론적 ‘구원’보다 위기에서의 건짐/보호를 뜻할 수 있으나, 한국어에서는 수동적 ‘구원을 받다’가 가장 무리 없이 그 범위를 담습니다.
- source_word: נֶעְקַשׁ דְּרָכַיִם
  english_pob_choice: one crooked in his ways
  chosen_korean: 자기 길이 비뚤어진 사람은
  alternatives_korean:
  - 자기 길이 굽은 사람은
  - 자기 행실이 비뚤어진 사람은
  lexicon: HALOT
  rationale: עקשׁ의 도덕적 ‘비뚤어짐’을 한국어의 직관적인 형용사로 옮기되, ‘길’ 이미지를 유지해 문장의 대구를 살렸습니다.
- source_word: בְּאֶחָת
  english_pob_choice: will fall at once
  chosen_korean: 곧 넘어집니다
  alternatives_korean:
  - 한번에 넘어집니다
  - 갑자기 넘어집니다
  lexicon: HALOT
  rationale: בְאֶחָת의 관용적 ‘즉시/갑자기’ 의미를 현대 한국어의 자연스러운 부사 ‘곧’으로 압축해 과잉 해석을 피했습니다.
theological_decisions:
- issue: יִוָּשֵׁעַ의 범위
  chosen_reading: 잠언적 보존/건짐의 의미를 살리되, 한국어에서는 ‘구원을 받다’로 넓게 옮겼습니다.
  alternative_readings:
  - 구출됩니다
  - 안전하게 지켜집니다
  - 구원받습니다
  rationale: 본문은 지혜문학의 일반적 진술로서 구체적 교리 명제를 전개하지 않으므로, 문맥에 맞는 실질적 보존의 뜻을 유지하면서도 신학적 과잉을 피했습니다.
  doctrine_reference: 원문 우선과 문맥 우선의 번역 원칙
