  source_fidelity: 히브리어의 두 절 구조와 대조를 충실히 반영합니다. ‘스스로 보기에’는 בְּעֵינָיו의 자기평가적 관용을 자연스럽게 드러내며, ‘분별 있는 가난한 사람’은 וְדַל מֵבִין을 적절히 옮깁니다. ‘그를 살핍니다’는 יַחְקְרֶנּוּ의 조사·탐색·통찰의 의미 범위 안에 있으며, 각주가 더 강한 ‘찾아냄’ 또는 ‘조사’의 가능성을 보완합니다.
