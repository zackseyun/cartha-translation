id: PRO.28.11
reference: Proverbs 28:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָכָ֣ם בְּ֭/עֵינָי/ו אִ֣ישׁ עָשִׁ֑יר וְ/דַ֖ל מֵבִ֣ין יַחְקְרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
  footnotes:
  - marker: a
    text: Or "finds him out" or "investigates him." The Hebrew verb can carry the sense of searching out, examining, or penetrating someone's true character.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자는 스스로 보기에 지혜롭지만, 분별 있는 가난한 사람은 그를 살핍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사는 ‘찾아내다, 조사하다, 깊이 살피다’의 범위를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  english_pob_choice: wise
  chosen_korean: 지혜롭지만
  alternatives_korean:
  - 똑똑하지만
  - 스스로 현명하지만
  lexicon: HALOT
  rationale: 원문은 부자를 곧바로 ‘지혜로운’ 사람으로 진술하고 있으므로, 해석을 덧붙이기보다 기본 의미인 ‘지혜롭다’를 살렸습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 스스로 보기에
  alternatives_korean:
  - 자기 눈에는
  - 자기 자신에게는
  lexicon: HALOT
  rationale: 히브리어 관용구의 자기평가적 뉘앙스를 자연스러운 한국어로 옮기기 위해 ‘스스로 보기에’를 선택했습니다.
- source_word: מֵבִין
  english_pob_choice: who has understanding
  chosen_korean: 분별 있는
  alternatives_korean:
  - 이해하는
  - 깨달은
  - 총명한
  lexicon: HALOT
  rationale: 분사형이 가난한 사람의 성향을 수식하므로, 문장 흐름에 맞게 ‘분별 있는’으로 간결하게 처리했습니다.
- source_word: יַחְקְרֶנּוּ
  english_pob_choice: searches him out
  chosen_korean: 그를 살핍니다
  alternatives_korean:
  - 그를 찾아냅니다
  - 그를 조사합니다
  - 그를 탐구합니다
  lexicon: HALOT
  rationale: 원문 동사는 ‘찾아내다, 조사하다, 깊이 살피다’의 뜻을 가지므로, 과도하게 학술적이지 않으면서도 탐색·검증의 뉘앙스를 담는 ‘살피다’를 택했습니다.
theological_decisions:
- issue: 지혜의 자기기만과 참된 분별의 대비
  chosen_reading: 부자는 자기 인식에 갇혀 스스로를 지혜롭다 여기지만, 실제 분별은 가난한 사람에게서 드러납니다.
  alternative_readings:
  - 부자가 단지 세상적 지혜를 가진다는 뜻
  - 가난한 사람이 단순히 정보를 수집한다는 뜻
  rationale: 잠언의 대조 구조를 따라 외형적 지위보다 실제 분별이 더 깊은 통찰을 드러낸다는 점을 보존했습니다.
  doctrine_reference: 잠언의 지혜 문학, 자기기만과 참된 분별의 대비
