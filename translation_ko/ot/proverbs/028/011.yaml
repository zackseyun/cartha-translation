  terminology: ‘지혜롭다’와 ‘분별 있는’은 지혜문학 문맥 및 חָכָם/מֵבִין의 구별을 무리 없이 유지합니다. ‘살피다’는 특정 신학적 또는 교파적 해석을 덧붙이지 않습니다.
