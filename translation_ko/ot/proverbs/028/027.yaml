source:
  edition: WLC
  text: נוֹתֵ֣ן לָ֭/רָשׁ אֵ֣ין מַחְס֑וֹר וּ/מַעְלִ֥ים עֵ֝ינָ֗י/ו רַב מְאֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
  footnotes:
  - marker: a
    text: Or 'shuts his eyes' / 'turns his eyes away'—an idiom for deliberately ignoring the poor.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람에게 주는 이는 부족함이 없고, 눈을 감는 이는 많은 저주를 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘눈을 숨기는’이며, 도움이 필요한 이를 의도적으로 외면하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן / לָרָשׁ
  english_pob_choice: Whoever gives to the poor
  chosen_korean: 가난한 사람에게 주는 이는
  alternatives_korean:
  - 가난한 자에게 주는 이는
  - 궁핍한 이에게 베푸는 이는
  lexicon: HALOT
  rationale: נוֹתֵן은 잠언의 일반적·격언적 현재분사이므로 ‘주는 이’로 옮겼고, רָשׁ은 ‘가난한 사람’이 가장 자연스럽고 넓게 대응합니다.
- source_word: אֵין מַחְסוֹר
  english_pob_choice: will have no lack
  chosen_korean: 부족함이 없고
  alternatives_korean:
  - 결핍이 없고
  - 모자람이 없고
  lexicon: HALOT
  rationale: אֵין מַחְסוֹר는 ‘결핍이 없음’을 뜻하는 관용적 진술이므로, 약속의 성격을 살려 ‘부족함이 없고’로 간결하게 옮겼습니다.
- source_word: וּמַעְלִים עֵינָיו
  english_pob_choice: he who hides his eyes
  chosen_korean: 눈을 감는 이는
  alternatives_korean:
  - 자기 눈을 숨기는 이는
  - 눈을 돌리는 이는
  lexicon: HALOT
  rationale: ‘눈을 가리다/숨기다’는 도움이 필요한 이를 의도적으로 외면하는 관용 표현이므로, 한국어에서 자연스럽고 경고가 분명한 ‘눈을 감는 이’로 옮겼습니다.
- source_word: רַב מְאֵרוֹת
  english_pob_choice: many curses
  chosen_korean: 많은 저주를 받습니다
  alternatives_korean:
  - 많은 저주가 있습니다
  - 많은 저주가 임합니다
  lexicon: HALOT
  rationale: 히브리어는 동사 없이 ‘많은 저주’라는 결과를 제시하므로, 한국어에서는 문맥상 수동적 결과를 드러내는 ‘많은 저주를 받습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 잠언의 격언적 약속을 미래형으로 옮길지 여부
  chosen_reading: 현재형 성격을 살리되 한국어에서는 결과 진술로 읽히는 종결을 택했습니다.
  alternative_readings:
  - '직설적 현재형: ‘부족함이 없습니다’'
  - '미래형: ‘부족함이 없을 것입니다’'
  rationale: 히브리어 문장은 일반적 진리를 말하는 지혜문학의 격언이므로, 단정적 결과를 전하면서도 과도한 시간 해석은 피했습니다.
  doctrine_reference: 지혜문학의 격언적 진술
- issue: ‘눈을 감는’ 이미지의 해석
  chosen_reading: 의도적으로 가난한 이를 외면하는 태도로 이해하고 번역했습니다.
  alternative_readings:
  - 단순히 보지 못하는 상태
  - 중립적 회피 표현
  rationale: 본문의 동사는 단순한 시각 장애가 아니라 의도적 외면의 관용구로 쓰이므로, 윤리적 책임을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 잠언의 도덕적 권고
