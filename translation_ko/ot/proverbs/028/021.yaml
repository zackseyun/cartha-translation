source:
  edition: WLC
  text: הַֽכֵּר פָּנִ֥ים לֹא ט֑וֹב וְ/עַל פַּת לֶ֝֗חֶם יִפְשַׁע גָּֽבֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to recognize faces,' an idiom meaning to show partiality or favoritism.
    reason: lexical_alternative
  - marker: b
    text: Or 'for a morsel of bread'; the point is that a person may commit wrongdoing for something very small.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'a man' in a generic proverbial sense.
    reason: cultural_note
translation:
  language: ko
  text: 편파적으로 대하는 것은[a] 좋지 않습니다. 그러나 빵 한 조각[b] 때문에 사람이[c] 죄를 범합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘얼굴을 알아보다’라는 뜻의 관용구이며, 편파성이나 편애를 보인다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 입거리의 빵’. 요지는 사람이 아주 작은 것을 위해서도 잘못을 저지를 수 있다는 데 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘사람’은 속담에서 보편적으로 쓰인 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  english_pob_choice: to show partiality
  chosen_korean: 사람을 편들어 주는 것
  alternatives_korean:
  - 편파를 보이는 것
  - 사람의 얼굴을 알아보는 것
  - 사람을 차별하는 것
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미는 재판이나 대우에서 편을 드는 것이므로, 한국어에서는 뜻을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: לֹא טוֹב
  english_pob_choice: is not good
  chosen_korean: 좋지 않습니다
  alternatives_korean:
  - 좋은 것이 아닙니다
  - 옳지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 평가적 진술을 현대 합쇼체로 자연스럽게 살리되, 도덕적 판단의 폭을 좁히지 않기 위해 ‘좋지 않습니다’를 택했습니다.
- source_word: פַּת לֶחֶם
  english_pob_choice: a piece of bread
  chosen_korean: 빵 한 조각
  alternatives_korean:
  - 빵 한 덩이
  - 한 입거리의 빵
  - 빵 한 조각쯤
  lexicon: HALOT
  rationale: 아주 적은 이익을 가리키는 표현이므로, 한국어에서도 크기가 작은 분량을 직관적으로 드러내는 표현으로 옮겼습니다.
- source_word: יִפְשַׁע
  english_pob_choice: will transgress
  chosen_korean: 범죄합니다
  alternatives_korean:
  - 죄를 범합니다
  - 죄를 짓습니다
  - 반역합니다
  lexicon: HALOT
  rationale: 문맥상 단순 실수보다 도덕적·법적 위반의 무게가 있어, ‘범죄합니다’로 강도를 유지했습니다.
theological_decisions:
- issue: 남성 단수 보편형 גָּבֶר의 처리
  chosen_reading: 사람은 범죄합니다
  alternative_readings:
  - 한 남자는 범죄합니다
  - 한 사람은 범죄합니다
  rationale: 속담형 일반 진술이지만, 영어 POB가 ‘a man’을 유지한 점과 한국어의 자연스러움을 함께 고려해 문장 내부에서는 ‘사람’으로 일반성을 전달했습니다. 다만 이는 성별 중립화의 해석적 선택이므로 본문 의미는 보편적 인간을 가리킨다는 점을 전제로 합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
