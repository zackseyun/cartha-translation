  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
  footnotes:
  - marker: a
    text: Or 'Happy is the man who fears continually.' The Hebrew does not state an explicit object for 'fears.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will fall into evil/trouble.' The Hebrew רָעָה can mean evil, harm, trouble, or calamity; here it likely refers to disastrous trouble.
    reason: lexical_alternative
translation:
  language: ko
  text: 항상 두려워하는 사람에게는 복이 있습니다. 그러나 자기 마음을 완고하게 하는 사람은 재앙에 빠질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속 두려워하는 사람에게는 복이 있다.’ 히브리어에는 ‘두려워하다’의 명시된 대상이 없다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘악/고난에 빠질 것이다.’ 히브리어 רָעָה는 악, 해, 고난, 재앙을 뜻할 수 있으며, 여기서는 파멸적인 고난을 가리킬 가능성이 크다.
    reason: alternative_reading
