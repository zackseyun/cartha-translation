base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
  footnotes:
  - marker: a
    text: Or 'understand all things'; in context this refers to broad moral discernment, especially regarding justice, not to knowing everything without limit.
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사람들은 정의를 이해하지 못하지만, 야훼를 찾는 사람들은 모든 것[a]을 이해합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘모든 것’은 문자적 전지라기보다, 특히 정의와 관련된 넓은 도덕적 분별을 가리키는 잠언적 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  english_pob_choice: Evil men
  chosen_korean: 악한 사람들
  alternatives_korean:
  - 악인들
  - 악한 자들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘악의 사람들’이지만, 한국어에서는 ‘악한 사람들’이 가장 자연스럽고 일반명사적 대조를 잘 살립니다. 남성형 복수의 대표성을 해치지 않는 범위에서 성별을 과도하게 부각하지 않는 표현입니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  - 의로운 질서
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 מִשְׁפָּט는 단순한 법정 판결보다 도덕적·사회적 올바름을 가리키므로, 여기서는 ‘정의’가 가장 적절합니다.
- source_word: מְבַקְשֵׁי יְהוָה
  english_pob_choice: those who seek Yahweh
  chosen_korean: 야훼를 찾는 사람들
  alternatives_korean:
  - 야훼를 구하는 이들
  - 야훼를 찾는 자들
  lexicon: HALOT
  rationale: 현재분사적 표현은 지속적으로 하나님을 찾는 사람들의 성격을 나타내므로, 관계적이고 자연스러운 한국어인 ‘~하는 사람들’로 옮겼습니다. יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 유지했습니다.
- source_word: כֹל
  english_pob_choice: all things
  chosen_korean: 모든 것
  alternatives_korean:
  - 전부
  - 모든 일
  lexicon: HALOT
  rationale: כֹל의 포괄성을 살리면서도 한국어에서 과도하게 추상적이지 않은 표현은 ‘모든 것’입니다. 문맥상 절대적 전지(omniscience)가 아니라 폭넓은 도덕적 분별을 가리키는 일반화로 이해합니다.
theological_decisions:
- issue: ‘모든 것’을 아는가의 범위
  chosen_reading: 의와 선악을 분별하는 폭넓은 이해를 가리키는 잠언적 일반화로 읽었습니다.
  alternative_readings:
  - 문자적 의미의 전지(모든 사실에 대한 앎)
  rationale: 지혜문학의 대비는 악한 사람들의 이해 불능과 야훼를 찾는 이들의 넓은 분별력을 대조합니다. 따라서 ‘모든 것’은 과장된 약속이 아니라 잠언적 진술로 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 잠언의 일반화는 문자적 절대명제로 과잉해석하지 않고, 본문이 말하는 범위 안에서 유지합니다.
