  source_fidelity: 원문의 ‘악한 눈’ 관용구, 부를 향한 성급한 추구, 그리고 결핍이 그에게 닥친다는 경고의 구조를 대체로 충실히 반영합니다. 다만 한국어 본문의 ‘악한 눈을 가진 사람’은 히브리어 관용구의 의미보다 신체적·주술적 연상을 불필요하게 일으킬 수 있어, 관용구의 뜻을 본문에서 자연스럽게 드러내고 직역과 의미 범위는 주석으로 보완하는 편이 더 적절합니다.
  naturalness: ‘부를 좇아 서두르지만’과 ‘빈곤이 그에게 닥칠 줄은 알지 못합니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 반면 ‘악한 눈을 가진 사람’은 현대 한국어에서 관용적으로 통용되지 않으며 뜻이 불명확합니다.
  terminology: חֶסֶר를 ‘빈곤’으로, יְבֹאֶנּוּ를 ‘닥칠’로 옮긴 것은 문맥상 적절합니다. רַע עָיִן은 이 문맥에서 인색하고 탐욕스러운 성향을 가리키므로, 본문은 ‘인색한’으로 번역하되 주석에서 문자적 표현 및 더 넓은 의미 가능성을 밝혀야 합니다.
