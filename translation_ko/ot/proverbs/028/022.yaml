  to: 인색한 사람은 부를 좇아 서두르지만, 빈곤이 그에게 닥칠 줄은 알지 못합니다.[a]
  rationale: 본문의 비자연스러운 직역을 문맥상 가장 직접적인 의미인 ‘인색한 사람’으로 바꾸었습니다. 이는 원문의 관용구가 지닌 탐욕·시기 등의 가능한 함의를 배제하려는 것이 아니라, 한국어 본문에서 핵심 의미를 명료하게 전달하기 위한 것입니다. 문자적 표현과 의미 범위는 각주에 보존하여 원문의 표현상 다의성과 영어 POB 감사 기록을 존중했습니다.
