source:
  edition: WLC
  text: נִֽבֳהָ֥ל לַ/ה֗וֹן אִ֭ישׁ רַ֣ע עָ֑יִן וְ/לֹֽא יֵ֝דַע כִּי חֶ֥סֶר יְבֹאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
  footnotes:
  - marker: a
    text: Or 'stingy' or 'greedy'; literally 'a man with an evil eye,' a Hebrew idiom for a selfish, begrudging disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 눈을 가진 사람은 부를 좇아 서두르지만, 빈곤이 자기에게 닥칠 줄은 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘악한 눈을 가진 사람’이지만 인색함, 시기, 탐욕 같은 자기중심적 태도를 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: נִבֳהָל
  english_pob_choice: hastens
  chosen_korean: 서두르다
  alternatives_korean:
  - 급히 달려가다
  - 재촉하다
  lexicon: HALOT
  rationale: 히필/니팔 계열의 ‘서두름’과 무리한 추구의 뉘앙스를 자연스러운 현대 한국어 동사 ‘서두르다’로 살렸습니다.
- source_word: לַהוֹן
  english_pob_choice: after wealth
  chosen_korean: 부를 좇아
  alternatives_korean:
  - 재물을 향해
  - 부를 위해
  lexicon: HALOT
  rationale: ל + 명사는 목표 지향을 나타내므로, 단순 목적어보다 추적·추구의 방향을 드러내는 ‘좇아’가 적절합니다.
- source_word: רַע עָיִן
  english_pob_choice: with an evil eye
  chosen_korean: 악한 눈을 가진
  alternatives_korean:
  - 시샘하는
  - 인색한
  - 탐욕스러운
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서 이해 가능하도록 ‘악한 눈을 가진’으로 옮기고, 본문만으로는 한 가지 의미로 좁히지 않았습니다.
- source_word: חֶסֶר
  english_pob_choice: poverty
  chosen_korean: 빈곤
  alternatives_korean:
  - 결핍
  - 부족
  - 궁핍
  lexicon: HALOT
  rationale: 지혜문맥에서 뒤따르는 결과를 사회경제적 파탄으로 분명히 보여 주는 말로 ‘빈곤’을 택했습니다.
theological_decisions:
- issue: 관용구 רַע עָיִן의 처리
  chosen_reading: 본문에는 관용구를 직역에 가깝게 유지하고, 의미는 ‘악한 눈을 가진’으로 열어 둡니다.
  alternative_readings:
  - 시샘하는
  - 인색한
  - 탐욕스러운
  rationale: 이 표현은 성경 히브리어에서 정서·태도·행동이 겹친 넓은 관용구이므로, 해석을 본문에 단정적으로 주입하기보다 원형을 보존하는 것이 독자 이해와 감사 가능한 주석성을 함께 살립니다.
  doctrine_reference: 잠언 28장 지혜 전승의 اخلاق/윤리적 권고
- issue: ‘빈곤이 닥칠 것’의 인격화
  chosen_reading: ‘빈곤이 자기에게 닥칠 줄은 알지 못합니다’로, 결과의 불가피성을 경고적으로 살립니다.
  alternative_readings:
  - 빈곤이 그를 따라잡을 것입니다
  - 가난이 그에게 올 것입니다
  rationale: 원문은 결핍이 ‘오다’는 동사로 표현되어 결과가 단순 추상 개념이 아니라 실제로 ‘다가오는 재앙’처럼 묘사됩니다. 한국어에서도 그 경고성을 유지했습니다.
  doctrine_reference: 잠언의 보응 원리
