review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 대조, 곧 의인이 여러 차례 넘어져도 다시 일어나는 것과 악인이 재난 가운데 비틀거리는 것은 정확히 반영되어 있습니다. 다만 ‘걸려 넘어집니다’는 히브리어 יִכָּשְׁלוּ(비틀거리다, 넘어지다)에 없는 외적 장애물에 ‘걸리는’ 뉘앙스를 더합니다.
  naturalness: ‘재앙 속에서 걸려 넘어집니다’는 현대 한국어에서 다소 부자연스럽고 의미가 중복됩니다. ‘재앙 속에서 비틀거립니다’가 원문의 비유와 한국어의 격언적 문체를 더 자연스럽게 보존합니다.
  terminology: ‘의인’, ‘악인’, ‘재앙’은 잠언의 문맥과 표준 한국어 성서 문체에 적절합니다. ‘의인’은 히브리어의 대표적 남성 단수를 자연스럽게 명사화하되, 한국어에 불필요한 성별 표지를 강요하지 않습니다.
  issues:
