source:
  edition: WLC
  text: כִּ֤י שֶׁ֨בַע יִפּ֣וֹל צַדִּ֣יק וָ/קָ֑ם וּ֝/רְשָׁעִ֗ים יִכָּשְׁל֥וּ בְ/רָעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
  footnotes:
  - marker: a
    text: Or 'the righteous' or 'a righteous person'; Hebrew has a masculine singular form used representatively in a proverb.
    reason: lexical_alternative
  - marker: b
    text: '''Seven'' is likely idiomatic for repeated occurrence or fullness: the righteous may fall many times, yet rise again.'
    reason: cultural_note
  - marker: c
    text: Or 'stumble in disaster' or 'are overthrown by calamity.' The Hebrew term can denote adversity or disaster rather than moral evil in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인은 일곱 번 넘어져도 다시 일어나지만, 악인들은 재앙 속에서 걸려 넘어집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 잠언에서 대표적 의미로 쓰인 남성 단수 형태를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일곱’은 반복의 완결성이나 거듭되는 횟수를 가리키는 관용적 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘재앙’은 이 문맥에서 도덕적 악이 아니라 불행·재난을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 히브리어 단수 형용사가 격언에서 대표적 인물을 가리키므로, 표준적인 명사화인 ‘의인’으로 자연스럽게 옮기되 의미의 대표성을 유지했습니다.
- source_word: יִפּוֹל
  english_pob_choice: falls
  chosen_korean: 넘어져도
  alternatives_korean:
  - 떨어져도
  - 쓰러져도
  lexicon: HALOT
  rationale: 문맥상 도덕적 타락보다 삶의 곤란 속에서의 비유적 ‘넘어짐’이 더 자연스러워, 반복적 곤경을 드러내는 ‘넘어져도’를 택했습니다.
- source_word: שֶׁבַע
  english_pob_choice: seven times
  chosen_korean: 일곱 번
  alternatives_korean:
  - 반복해서
  - 거듭
  lexicon: HALOT
  rationale: ‘일곱’은 완전수/반복의 관용적 뉘앙스를 지니지만, 이미지를 보존하는 것이 우선이므로 수사적 표현을 유지했습니다.
- source_word: בְרָעָה
  english_pob_choice: in calamity
  chosen_korean: 재앙 속에서
  alternatives_korean:
  - 재난 속에서
  - 고난 속에서
  - 악 속에서
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’보다 재난·불행의 뜻이 자연스러워, POB의 판단을 따라 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: 잠언의 대조 구조 해석
  chosen_reading: 의인은 반복적으로 넘어져도 회복하지만, 악인은 재앙이 닥칠 때 무너집니다.
  alternative_readings:
  - 의인이 죄를 반복해도 회개한다
  - 단순한 물리적 넘어짐과 일어섬을 말한다
  rationale: 본문의 대비는 의인의 회복성과 악인의 재난 앞 붕괴를 말하며, ‘재앙 속에서’라는 표현은 도덕적 악이 아니라 불행/재난의 상황을 가리킵니다. 본문에 없는 회개 교리를 덧씌우지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
