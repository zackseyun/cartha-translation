- from: 그들의 재앙은 갑자기 일어날 것이며, 그 둘의 파멸을 누가 알겠습니까?[a]
  to: 이는 그들의 재앙이 갑자기 일어날 것이며, 그 둘에게서 오는 파멸을 누가 알겠습니까?[a]
  rationale: The revision restores the explicit causal connection of the Hebrew and prevents Korean readers from taking ‘the ruin of them both’ as the ruin that befalls the LORD and the king. The note preserves the contextual and syntactic uncertainty rather than treating a disputed referent as certain.
