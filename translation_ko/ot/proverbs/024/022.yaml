  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי פִ֭תְאֹם יָק֣וּם אֵידָ֑/ם וּ/פִ֥יד שְׁ֝נֵי/הֶ֗ם מִ֣י יוֹדֵֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/022.yaml
  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
  footnotes:
  - marker: a
    text: Or 'their calamity will arise suddenly.'
    reason: lexical_alternative
  - marker: b
    text: '''Them both'' likely refers to the LORD and the king mentioned in the previous verse; alternatively, some understand it more generally or as referring to other implied parties in the context.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 재앙은 갑자기 일어날 것이며, 그 둘의 파멸을 누가 알겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 앞절에 나온 여호와와 왕을 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: -이니/며
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞절에 대한 이유를 잇는 접속으로 이해하여, 한국어에서는 문장 연결형으로 자연스럽게 풀었습니다.
- source_word: פִתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 순식간에
  - 뜻밖에
  lexicon: HALOT
  rationale: 돌발성과 경고의 긴박함을 살리는 가장 자연스러운 현대 한국어 표현입니다.
- source_word: אֵידָם
  english_pob_choice: their disaster
  chosen_korean: 그들의 재앙
  alternatives_korean:
  - 그들의 재난
  - 그들의 파멸
  lexicon: HALOT
  rationale: אֵיד의 중량감 있는 불행·멸망의 뉘앙스를 살려, 합쇼체 문맥에서 가장 적절한 표준어로 옮겼습니다.
- source_word: שְׁנֵיהֶם
  english_pob_choice: of them both
  chosen_korean: 그 둘의
  alternatives_korean:
  - 그 두 사람의
  - 그들 둘의
  lexicon: HALOT
  rationale: 히브리어의 이중/복수 표현을 간결하게 반영하되, 본문이 가리키는 두 대상의 불확정성은 유지했습니다.
theological_decisions:
- issue: ‘그 둘’의 지시 대상
  chosen_reading: 앞 절의 여호와와 왕을 가리키는 이중 지시로 두되, 본문에서는 한국어가 그 불확정성을 유지하도록 했습니다.
  alternative_readings:
  - 반역자들과 왕을 가리킨다고 볼 수 있음
  - 더 일반적인 ‘두 당사자’로 이해할 수 있음
  rationale: 직전 문맥이 여호와와 왕을 언급하므로 그 둘을 기본 지시 대상으로 보되, 시어의 여지를 좁히지 않기 위해 본문에서는 특정 명칭을 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙 #3: 문맥적 긴장과 해석의 여지를 본문에서 보존한다'
