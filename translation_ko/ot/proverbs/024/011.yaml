id: PRO.24.11
reference: Proverbs 24:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֭צֵּל לְקֻחִ֣ים לַ/מָּ֑וֶת וּ/מָטִ֥ים לַ֝/הֶ֗רֶג אִם תַּחְשֽׂוֹךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and those staggering to the slaughter, if you hold back'' (or ''do not hold back''). The final words are syntactically difficult and may be taken with the next verse; the main text renders the likely sense in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 죽음으로 끌려가는 이들을 구출하십시오[a]. 또한 살육을 향해 비틀거리는 이들을 붙들어 막으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘죽음으로 끌려가는 이들을 구출하라. 살육을 향해 비틀거리는 이들을, 만일 네가 삼간다면.’ 끝말은 통사적으로 난해하며 다음 절과 연결될 수도 있습니다. ‘삼간다면’은 문맥에 따라 ‘개입하기를 삼가거나 물러선다면’이라는 뜻으로 이해될 수 있고, ‘삼가지 말라’로 이해되기도 합니다. 본문은 문맥상 가장 그럴듯한 뜻으로 옮겼습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  english_pob_choice: Rescue
  chosen_korean: 구출하십시오
  alternatives_korean:
  - 구해 주십시오
  - 건져 내십시오
  - 구원하십시오
  lexicon: HALOT
  rationale: 긴급히 위험에서 건져 내라는 명령이므로, 현대 한국어에서 직접적이고 구체적인 ‘구출하십시오’가 가장 잘 맞습니다.
- source_word: לְקֻחִים לַמָּוֶת
  english_pob_choice: those being taken away to death
  chosen_korean: 죽음으로 끌려가는 이들
  alternatives_korean:
  - 죽음으로 데려가지는 이들
  - 죽음으로 끌려가는 사람들
  - 죽음으로 잡혀가는 이들
  lexicon: HALOT
  rationale: ‘לקח’의 수동 분사와 목적지 표현을 살려, 죽음을 향해 현재 진행형으로 끌려가는 장면을 자연스럽게 옮겼습니다.
- source_word: וּמָטִים לַהֶרֶג
  english_pob_choice: those staggering to the slaughter
  chosen_korean: 살육을 향해 비틀거리는 이들
  alternatives_korean:
  - 도살로 비틀거리는 이들
  - 죽임을 향해 비틀거리는 이들
  - 학살로 비틀거리는 이들
  lexicon: HALOT
  rationale: ‘הרג’는 단순한 죽음보다 폭력적 살해의 뉘앙스가 강하므로, 목가적 표현인 ‘도살’보다 의미를 더 직접적으로 드러내는 ‘살육’을 택했습니다.
- source_word: אִם תַּחְשׂוֹךְ
  english_pob_choice: and hold them back
  chosen_korean: 붙들어 주십시오
  alternatives_korean:
  - 막아 주십시오
  - 멈추게 하십시오
  - 그만두게 하십시오
  lexicon: HALOT
  rationale: 히브리어 끝맺음은 문법적으로 난해하지만, 문맥상 방관하지 말고 개입하라는 권면으로 이해하는 것이 자연스럽습니다. 따라서 ‘hold back’의 소극적 억제가 아니라 실제로 붙들어 제지하는 행동을 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 난해한 구문 처리
  chosen_reading: 독립 절로서의 권면을 살려, 둘째 행도 명령으로 읽었습니다.
  alternative_readings:
  - ‘만일 당신이 붙들지 않으면’처럼 조건문으로 남겨 다음 절과 연결
  - ‘붙들지 말라’는 금지로 이해
  rationale: 이 구절은 히브리어 말미가 축약적이라 번역이 갈립니다. 본문이 요구하는 윤리적 긴급성을 분명히 전달하기 위해, POB 영어처럼 둘째 행을 권면형으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3, 본문이 실제로 애매한 경우 긴장을 보존하되 문맥상 핵심 명령은 분명히 전달
