id: PRO.24.4
reference: Proverbs 24:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֭/בְ/דַעַת חֲדָרִ֣ים יִמָּלְא֑וּ כָּל ה֖וֹן יָקָ֣ר וְ/נָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/004.yaml
  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
  footnotes:
  - marker: a
    text: Or 'chambers' for 'rooms.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be filled'; the Hebrew imperfect may be read futurally, though the proverb is rendered here as a general present truth.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all wealth, precious and pleasant'; the translation smooths the phrase as 'every precious and pleasant kind of wealth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 지식으로 방들은 모든 귀하고 즐거운 재물로 채워집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְדַעַת
  english_pob_choice: and by knowledge
  chosen_korean: 그리고 지식으로
  alternatives_korean:
  - 그리고 앎으로
  - 그리고 지식을 통해
  lexicon: HALOT
  rationale: 전치사 וּבְ의 도구·수단 의미를 살려 ‘-으로’로 옮기고, דַּעַת는 지혜문맥에서 자연스러운 ‘지식’으로 렌더링했습니다.
- source_word: חֲדָרִים
  english_pob_choice: rooms
  chosen_korean: 방들은
  alternatives_korean:
  - 침실들은
  - 방(실)들은
  - 내실들은
  lexicon: HALOT
  rationale: 문맥상 집 안의 방들을 가리키므로 현대 한국어의 자연스러운 기본어 ‘방들’을 택했습니다. ‘chambers’에 해당하는 격식성은 본문이 요구하지 않습니다.
- source_word: יִמָּלְאוּ
  english_pob_choice: are filled
  chosen_korean: 채워집니다
  alternatives_korean:
  - 가득 차게 됩니다
  - 채워질 것입니다
  lexicon: HALOT
  rationale: 잠언의 격언적 현재를 반영해 결과 상태를 나타내는 현재형으로 옮겼습니다. 미래형도 가능하지만 일반 진리를 더 잘 드러냅니다.
- source_word: כָּל הוֹן יָקָר וְנָעִים
  english_pob_choice: all precious and pleasant wealth
  chosen_korean: 모든 귀하고 즐거운 재물
  alternatives_korean:
  - 모든 값지고 즐거운 재물
  - 모든 귀하고 아름다운 재물
  - 모든 귀하고 즐거운 부
  lexicon: HALOT
  rationale: כָּל הוֹן을 포괄적으로 ‘모든 … 재물’로 옮기되, יָקָר와 נָעִים의 두 형용사를 각각 ‘귀하고 즐거운’으로 살렸습니다. ‘재물’은 הוֹן의 물질적 축적 의미를 자연스럽게 반영합니다.
