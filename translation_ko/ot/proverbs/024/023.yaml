  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
  footnotes:
  - marker: a
    text: Hebrew literally, 'These also, to/for the wise.' The sense is likely, 'These also are sayings of the wise.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'to recognize faces in judgment,' an idiom meaning to show favoritism or partiality.
    reason: cultural_note
translation:
  language: ko
  text: 이것도 지혜자들의 말씀입니다. 재판에서 사람을 차별하는 것은 좋지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '이것도 지혜자들에게/지혜자들을 위하여'이지만, 문맥상 다음 지혜 격언들의 표제처럼 읽는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구는 문자적으로 '얼굴을 알아보다'이지만, 재판에서의 편파·차별을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה לַחֲכָמִים
  english_pob_choice: These also are sayings of the wise
  chosen_korean: 이것도 지혜자들의 말씀입니다
  alternatives_korean:
  - 이것도 지혜자들의 것입니다
  - 이것도 지혜자들을 위한 것입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 '이것도 지혜자들에게/지혜자들을 위하여'이지만, 문맥상 다음 지혜 격언들의 표제처럼 기능하므로 한국어에서는 '지혜자들의 말씀'으로 풀어 자연스러운 표제 기능을 살렸습니다.
- source_word: הַכֵּר פָּנִים
  english_pob_choice: to show partiality
  chosen_korean: 사람을 차별하는 것
  alternatives_korean:
  - 편파를 보이는 것
  - 특정인을 봐주는 것
  - 얼굴을 알아보는 것
  lexicon: HALOT
  rationale: 직역하면 '얼굴을 알아보다'이지만 재판 맥락에서는 편애·편파를 뜻하는 관용구이므로, 현대 한국어에서 분명한 '차별하다'를 택했습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: in judgment
  chosen_korean: 재판에서
  alternatives_korean:
  - 판결에서
  - 심판할 때
  - 판정에서
  lexicon: HALOT
  rationale: 여기서는 추상적 '의/정의'보다 사법적 판단의 장면이 분명하므로, 맥락을 살려 '재판에서'로 옮겼습니다.
- source_word: בַּל טוֹב
  english_pob_choice: is not good
  chosen_korean: 좋지 않습니다
  alternatives_korean:
  - 좋지 못합니다
  - 옳지 않습니다
  - 선하지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 평가적 진술을 한국어의 간결한 부정 평가로 옮겨, 도덕적 판단을 유지하면서도 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 지혜문학 표제의 기능
  chosen_reading: 첫 절을 독립 진술이 아니라 다음 속담들을 여는 표제로 이해하여 번역했습니다.
  alternative_readings:
  - 이것도 지혜자들에게 속한 것이다
  - 이것도 지혜자들을 위한 것이다
  rationale: 본문의 축약된 형태는 독자에게 '지혜자들의 말씀'이라는 표제적 기능으로 읽히는 것이 가장 분명하며, 이는 영어 POB의 문맥 판단과도 일치합니다.
  doctrine_reference: 잠언 24장 구조 및 지혜문학 표제 관찰
- issue: 편파 금지의 윤리적 초점
  chosen_reading: '''사람을 차별하는 것''으로 옮겨 재판에서의 불공정성을 직접 드러냈습니다.'
  alternative_readings:
  - 편애하는 것
  - 편파를 보이는 것
  rationale: 관용구의 의미는 단순한 감정적 편애가 아니라 법정에서의 불공정 판단이므로, 독자가 실제 윤리 명령을 즉시 이해하도록 표현했습니다.
  doctrine_reference: 신 1:17, 잠 28:21의 공의 원리
