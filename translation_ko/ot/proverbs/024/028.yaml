  source_fidelity: The draft correctly conveys both prohibitions, including the legal-social force of being a witness against one’s neighbor and the speech-related sense of the final clause. However, ‘이웃을 상대로 증인이 되다’ is less idiomatic Korean for adverse testimony than ‘이웃에게 불리한 증인이 되다.’
