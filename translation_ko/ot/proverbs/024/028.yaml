language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תְּהִ֣י עֵד חִנָּ֣ם בְּ/רֵעֶ֑/ךָ וַ֝/הֲ/פִתִּ֗יתָ בִּ/שְׂפָתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/028.yaml
  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
  footnotes:
  - marker: a
    text: Or 'and deceive with your lips.' The Hebrew conjunction can be read simply as 'and'; 'or' is used in the main text to express the paired prohibitions more naturally in English.
    reason: lexical_alternative
  - marker: b
    text: '''Without cause'' may also be rendered ''for nothing'' or ''without reason.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이유 없이 이웃을 상대로 증인이 되지 마십시오. 또한 입술로 속이지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속이지 마십시오’는 히브리어 동사의 의미를 직접 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘이유 없이’는 ‘까닭 없이’, ‘무고하게’, ‘헛되이’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי עֵד
  english_pob_choice: Do not be a witness
  chosen_korean: 증인이 되지 마십시오
  alternatives_korean:
  - 증언하지 마십시오
  - 증인으로 서지 마십시오
  lexicon: WLC
  rationale: אַל의 금지와 עֵד의 법정적 의미를 자연스러운 한국어 금지문으로 옮기되, ‘증언하다’보다 명사구를 살려 행위 주체를 분명히 했습니다.
- source_word: חִנָּם
  english_pob_choice: without cause
  chosen_korean: 이유 없이
  alternatives_korean:
  - 까닭 없이
  - 무고하게
  - 헛되이
  lexicon: HALOT
  rationale: 여기서는 근거 없는, 정당화되지 않은 증언의 뜻이므로 ‘이유 없이’가 가장 간결하고 문맥상 분명합니다.
- source_word: בְרֵעֶךָ
  english_pob_choice: against your neighbor
  chosen_korean: 이웃을 상대로
  alternatives_korean:
  - 이웃에게 대하여
  - 이웃에 관해
  lexicon: HALOT
  rationale: ב + רֵעַ는 관계의 대상이지만, ‘증인’과 결합하면 한국어에서는 ‘상대로’가 가장 자연스럽게 반대 의미를 드러냅니다.
- source_word: וַהֲפִתִּיתָ
  english_pob_choice: or deceive
  chosen_korean: 속이지 마십시오
  alternatives_korean:
  - 유혹하지 마십시오
  - 현혹하지 마십시오
  - 기만하지 마십시오
  lexicon: HALOT
  rationale: פתה는 유혹·기만·속임의 폭이 있으나, 입술과 결합한 허위 발화의 문맥에서는 ‘속이다’가 가장 직접적입니다.
- source_word: בִּשְׂפָתֶיךָ
  english_pob_choice: with your lips
  chosen_korean: 입술로
  alternatives_korean:
  - 입술로써
  - 당신의 말로
  lexicon: HALOT
  rationale: 히브리어의 신체적 이미지와 말의 도구성을 살리기 위해 ‘입술로’로 옮겼습니다.
