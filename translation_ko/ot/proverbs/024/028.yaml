    rationale: Its stated subject is ‘이유 없이’; the current placement can structurally appear to modify the final clause instead.
  - severity: low
    issue: ‘이웃을 상대로 증인이 되다’ is somewhat awkward and less precise for testimony adverse to someone.
    rationale: ‘이웃에게 불리한 증인이 되다’ naturally expresses the legal-adverse implication of בְּרֵעֶךָ without adding a specific accusation.
  - severity: low
    issue: Footnote a does not identify the relevant translation issue.
    rationale: Saying that ‘속이지 마십시오’ directly translates the verb offers no useful alternative or explanation. A note on the Hebrew conjunction accounts for the translation choice more accurately.
