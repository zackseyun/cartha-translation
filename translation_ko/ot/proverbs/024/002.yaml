id: PRO.24.2
reference: Proverbs 24:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
  footnotes:
  - marker: a
    text: Or 'destruction' / 'devastation' for 'violence' (שֹׁד), emphasizing the ruin they contemplate.
    reason: lexical_alternative
  - marker: b
    text: Or 'mischief' for 'trouble' (עָמָל), highlighting harmful intent rather than general distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 마음은 폭력을 묵상하고, 그들의 입술은 고난을 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁד
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 파괴
  - 멸망
  - 약탈
  lexicon: HALOT
  rationale: 문맥상 내면에서 꾀하는 악한 행위를 가리키므로, 단순한 ‘고난’이나 ‘파괴’보다 행위의 폭력성과 해악을 드러내는 ‘폭력’이 영어 POB의 선택을 한국어로 가장 직접적으로 옮깁니다.
- source_word: יֶהְגֶּה
  english_pob_choice: meditates on
  chosen_korean: 묵상하고
  alternatives_korean:
  - 되뇌고
  - 꾀하고
  - 생각하고
  lexicon: HALOT
  rationale: 동사가 마음을 주어로 하여 내면에서 계속 되새기는 상태를 나타내므로, ‘묵상하다’가 반복적·내적 사유를 간결하게 살립니다.
- source_word: עָמָל
  english_pob_choice: trouble
  chosen_korean: 고난
  alternatives_korean:
  - 고생
  - 해악
  - 수고
  lexicon: HALOT
  rationale: POB의 ‘trouble’은 단순한 일상적 곤란보다 해를 끼치는 결과를 가리키는 문맥이지만, 한국어에서는 입술이 내뱉는 해악을 자연스럽게 드러내기 위해 ‘고난’으로 옮겼습니다.
- source_word: שִׂפְתֵיהֶם
  english_pob_choice: their lips
  chosen_korean: 그들의 입술
  alternatives_korean:
  - 그들의 입
  - 그들의 말
  lexicon: HALOT
  rationale: 히브리어의 시적 대비인 ‘마음/입술’을 보존하기 위해 보다 문자적인 ‘입술’을 유지했습니다.
