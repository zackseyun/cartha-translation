source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
  footnotes:
  - marker: a
    text: Or, 'lest the LORD see it and it be displeasing in his sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그것을 보시고 그것을 그분 보시기에 악하게 여기시며, 그에게서 그분의 분노를 거두실까 하여서입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그것이 그분의 눈에 악하게 되고.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: 그러니 …까 하노라
  alternatives_korean:
  - 그렇지 않으면
  - 혹시
  lexicon: HALOT
  rationale: 경고문의 결과를 나타내는 פֶּן은 한국어에서 단순한 직역보다 ‘…까 하노라’가 금지의 뒤따르는 부정적 결과를 자연스럽게 살립니다.
- source_word: יִרְאֶה יְהוָה
  english_pob_choice: Yahweh will see
  chosen_korean: 야훼께서 그것을 보시고
  alternatives_korean:
  - 야훼께서 보실 것이고
  - 주님께서 보시고
  lexicon: HALOT
  rationale: יהוה는 본문에 직접 나온 하나님의 이름이므로 ‘야훼’로 옮기고, 동사는 단순히 ‘보다’의 감지 의미를 살려 ‘보시고’로 처리했습니다.
- source_word: וְרַע בְּעֵינָיו
  english_pob_choice: and it be evil in his eyes
  chosen_korean: 그의 눈에 악하게 여기시며
  alternatives_korean:
  - 그의 눈에 나쁘게 여기시며
  - 그분 보시기에 불쾌하게 여겨지며
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 유지하되 한국어로는 ‘악하다’의 도덕적/평가적 뉘앙스를 살려 ‘악하게 여기시며’로 옮겼습니다.
- source_word: וְהֵשִׁיב מֵעָלָיו אַפּוֹ
  english_pob_choice: and he turn his anger away from him
  chosen_korean: 자기 분노를 그에게서 거두실까 하노라
  alternatives_korean:
  - 자기 분노를 그에게서 돌이키실까 하노라
  - 그의 진노를 그에게서 거두실까 하노라
  lexicon: HALOT
  rationale: ‘돌이키다/거두다’ 중 여기서는 מן־עליו의 제거 의미를 더 분명히 드러내는 ‘거두다’를 택했고, אַף는 관용적으로 ‘분노’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명(神名) יהוה를 제목 대체어로 바꾸지 않고, POB 기준에 따라 고유한 이름 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
