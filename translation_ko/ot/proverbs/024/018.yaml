revisions:
- from: 그러니 야훼께서 그것을 보시고, 그의 눈에 악하게 여기시며, 자기 분노를 그에게서 거두실까 하노라.[a]
  to: 야훼께서 그것을 보시고 그것을 그분 보시기에 악하게 여기시며, 그에게서 그분의 분노를 거두실까 하여서입니다.[a]
  rationale: The revision restores the warning force of פֶּן, makes the object of Yahweh's evaluation explicit in idiomatic Korean, retains the divine name ‘야훼,’ and preserves the source's meaning that Yahweh may withdraw his anger from the person in view. The formal-polite sentence ending is designed to continue the preceding prohibition in verse 17.
