  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
  footnotes:
  - marker: a
    text: Or 'end' or 'outcome' for 'future.' The Hebrew אַחֲרִית can refer to a person's latter end, outcome, or future prospect.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lamp of the wicked will go out.' The image of the lamp signifies the extinguishing of life, prosperity, or enduring standing.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인에게는 미래가 없을 것이며, 악인들의 등불은 꺼질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תִהְיֶה אַחֲרִית
  english_pob_choice: there will be no future
  chosen_korean: 미래가 없을 것이며
  alternatives_korean:
  - 끝이 없을 것입니다
  - 결말이 없을 것입니다
  - 결과가 없을 것입니다
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 종말보다 장래의 전망이나 귀결을 가리킬 수 있으므로, 문맥의 대비를 살려 ‘미래’로 옮겼습니다. 부정 존재문은 한국어에서 ‘없을 것입니다’가 자연스럽습니다.
- source_word: לָרָע
  english_pob_choice: the evil
  chosen_korean: 악인에게는
  alternatives_korean:
  - 악한 자에게는
  - 악한 사람에게는
  - 악에게는
  lexicon: HALOT
  rationale: 히브리어는 단수의 명사적 형용사로 사람을 가리키므로 추상적 ‘악’이 아니라 인격적 주체인 ‘악인’으로 옮겼습니다. 문장 초두의 범주 표시를 살리기 위해 조사 ‘-에게는’을 붙였습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들의
  alternatives_korean:
  - 악한 자들의
  - 악인들의
  - 악한 사람들의
  lexicon: HALOT
  rationale: 복수 집합 명사로서 ‘악인들’이 가장 간결하고 본문 대조를 분명히 드러냅니다. 영어 POB의 복수성을 유지하되 한국어에서 자연스럽게 소유격으로 처리했습니다.
- source_word: יִדְעָךְ
  english_pob_choice: will be put out
  chosen_korean: 꺼질 것입니다
  alternatives_korean:
  - 꺼질 것입니다
  - 소멸될 것입니다
  - 불이 꺼질 것입니다
  lexicon: HALOT
  rationale: 등불에 대한 동사로는 ‘꺼지다’가 가장 직접적으로 어울리며, 수동적 의미와 비유적 소멸을 함께 담을 수 있습니다. 문맥상 ‘불이’는 중복되므로 생략했습니다.
theological_decisions:
- issue: 악인/악의 번역에서 인격성과 비유의 보존
  chosen_reading: 첫 절구는 개인적 대상인 ‘악인’, 둘째 절구는 집합적 ‘악인들’로 옮겨 히브리어의 단수-복수 대비를 살렸습니다.
  alternative_readings:
  - 둘 다 ‘악한 사람들’로 평준화하기
  - 첫 절구를 ‘악한 자’로 일반화하기
  rationale: 본문은 단수에서 복수로 이동하며 관찰적 지혜 진술의 긴장을 만듭니다. 이를 평준화하면 원문의 수사적 대비가 약해집니다.
  doctrine_reference: 'Translation philosophy #1, #4, #5'
