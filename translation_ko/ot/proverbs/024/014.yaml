id: PRO.24.14
reference: Proverbs 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
  footnotes:
  - marker: a
    text: Or 'there is an outcome' or 'there is an end'; the Hebrew אַחֲרִית can denote one's latter end, outcome, or future prospect.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for your soul'; נֶפֶשׁ can also mean 'self' or 'life' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜가 네 영혼을 위하는 것이 이러합니다. 네가 그것을 찾으면[a] 미래가 있고, 네 희망은 끊어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘결과가 있다’, ‘끝이 있다’로도 옮길 수 있습니다. 히브리어 אַחֲרִית는 마지막, 결과, 장래의 전망을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: thus
  chosen_korean: 이러합니다
  alternatives_korean:
  - 그와 같이
  - 그러하니
  - 이와 같습니다
  lexicon: HALOT
  rationale: 앞절의 꿀 비유와 연결되는 비교·귀결의 힘을 살리면서, 현대 한국어에서 자연스러운 설명형으로 옮겼습니다.
- source_word: לְנַפְשֶׁךָ
  english_pob_choice: for your soul
  chosen_korean: 네 영혼을 위하는 것이
  alternatives_korean:
  - 네 자신을 위한 것이
  - 네 생명을 위한 것이
  - 네 속사람을 위한 것이
  lexicon: HALOT
  rationale: נֶפֶשׁ의 ‘생명/자기 자신’ 가능성을 인정하되, 지혜의 개인적 유익과 내적 차원을 드러내기 위해 ‘영혼’으로 유지했습니다.
- source_word: וְיֵשׁ אַחֲרִית
  english_pob_choice: then there is a future
  chosen_korean: 미래가 있고
  alternatives_korean:
  - 결말이 있고
  - 결국이 있고
  - 마지막이 있고
  lexicon: HALOT
  rationale: אַחֲרִית의 ‘끝/결과/미래 전망’ 가운데 지혜문맥에 가장 맞는 미래성을 살리되, 한국어에서는 과도한 직역보다 간결한 명사구가 자연스럽습니다.
- source_word: לֹא תִכָּרֵת
  english_pob_choice: will not be cut off
  chosen_korean: 끊어지지 않을 것입니다
  alternatives_korean:
  - 잘려 나가지 않을 것입니다
  - 끊기지 않을 것입니다
  - 단절되지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘잘라 내다’ 이미지를 완전히 지우지 않으면서, 희망의 지속성을 현대 한국어로 유려하게 전달했습니다.
theological_decisions:
- issue: אַחֲרִית의 종말론적·윤리적 범위
  chosen_reading: 이 절은 지혜를 얻는 자에게 ‘미래’가 보장된다는 일반적 지혜 진술로 옮겼습니다.
  alternative_readings:
  - 종말론적 ‘마지막’으로 좁혀 읽기
  - 개인적 번영 약속으로만 한정하기
  rationale: 문맥상 즉각적 종말 예언이 아니라, 지혜가 사람의 삶의 결말과 장래를 밝힌다는 지혜문학적 진술이므로, 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: 잠언 24장 문맥의 지혜-보응 전통
