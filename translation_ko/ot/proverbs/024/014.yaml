  - severity: medium
    issue: 각주 표지가 ‘그것을 찾으면’에 붙어 있으나 각주 내용은 אַחֲרִית(‘장래’)에 관한 것입니다.
    rationale: 각주는 해당 어휘 바로 뒤에 배치되어야 독자가 대체 번역의 적용 대상을 정확히 알 수 있습니다.
  - severity: low
    issue: לְנַפְשֶׁךָ의 의미 범위에 대한 각주가 없습니다.
    rationale: ‘영혼’은 가능한 번역이나 히브리어 נֶפֶשׁ는 문맥에 따라 자기 자신 또는 생명도 뜻하므로, 번역의 교리적 협소화를 피하려면 각주가 유익합니다.
