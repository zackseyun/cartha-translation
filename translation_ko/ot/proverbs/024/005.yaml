base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/005.yaml
  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
  footnotes:
  - marker: a
    text: Or 'A wise strong man' / 'A wise man is in strength.' The Hebrew construction with בַּעֹז is compact and may be taken either attributively or predicatively; the main text adopts the predicative sense for clearer English.
    reason: lexical_alternative
  - marker: b
    text: Or 'a man of knowledge increases strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 강하며[a], 지식 있는 사람은 힘을 굳세게 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘 있는 지혜로운 사람’/‘지혜로운 사람은 힘이 있다’. 히브리어 בַּעֹז는 간결한 표현이어서 수식어적으로 또는 서술적으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지식 있는 사람은 힘을 더합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר חָכָם בַּעֹז
  english_pob_choice: A wise man is strong
  chosen_korean: 지혜로운 사람은 강하고
  alternatives_korean:
  - 지혜로운 용사는 강하고
  - 지혜로운 남자는 힘이 있습니다
  lexicon: HALOT
  rationale: בַּעֹז의 압축된 표현을 한국어에서 자연스러운 서술로 풀어, 지혜가 실제 힘을 낳는다는 격언의 의미를 살렸습니다.
- source_word: אִישׁ דַּעַת
  english_pob_choice: a man of knowledge
  chosen_korean: 지식이 있는 사람은
  alternatives_korean:
  - 지식의 사람은
  - 분별 있는 사람은
  lexicon: HALOT
  rationale: 지혜문학의 דַּעַת를 단순한 정보가 아니라 지식/분별의 소유로 보아, 성별을 드러내는 원문의 관용적 남성형을 한국어에서는 대표적 ‘사람’으로 옮겼습니다.
- source_word: מְאַמֶּץ כֹּחַ
  english_pob_choice: strengthens his might
  chosen_korean: 자신의 힘을 더욱 강하게 합니다
  alternatives_korean:
  - 자신의 힘을 강화합니다
  - 자신의 능력을 더 굳게 합니다
  lexicon: HALOT
  rationale: מְאַמֶּץ의 ‘강하게 하다’라는 동사를 살리면서, כֹּחַ를 ‘힘’으로 옮겨 첫 절의 강함과 구별되도록 했습니다.
theological_decisions:
- issue: 첫 절의 בַּעֹז를 형용적/서술적으로 이해할지 여부
  chosen_reading: ‘지혜로운 사람은 강하고’로 서술형 의미를 채택했습니다.
  alternative_readings:
  - ‘지혜로운 강한 사람은’처럼 수식어적으로 읽을 수 있습니다
  - ‘지혜로운 사람은 힘 안에 있습니다’처럼 직역할 수 있습니다
  rationale: 히브리어의 압축된 구문은 둘 다 가능하지만, 한국어에서는 지혜가 실제 강함으로 드러난다는 잠언의 핵심을 가장 분명히 전달하는 서술형이 적절합니다.
  doctrine_reference: 잠언의 지혜-능력 연결에 대한 문학적/신학적 독해
