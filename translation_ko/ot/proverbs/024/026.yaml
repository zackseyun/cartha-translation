  rationale: 동사의 능동적 의미를 살리면서도 한국어 잠언체에 자연스러운 관용 표현으로 옮겼습니다.
- source_word: מֵשִׁיב
  english_pob_choice: who gives
  chosen_korean: 말하는 사람은
  alternatives_korean:
