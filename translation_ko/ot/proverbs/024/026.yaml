base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
  footnotes:
  - marker: a
    text: Or, 'An honest answer is like a kiss on the lips.' The Hebrew verb is active ('he kisses'), but the proverb may function idiomatically to compare a fitting answer to the intimacy or sincerity of a kiss.
    reason: alternative_reading
  - marker: b
    text: '''Upright words'' may also be rendered ''right words,'' ''straightforward words,'' or ''honest words.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 말을 하는 사람은 입술에 입 맞춥니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “입술을 입맞춥니다”로, 원문의 능동형 동사를 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘지혜로운 말’은 원문의 ‘곧은/바른 말’을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  english_pob_choice: the lips
  chosen_korean: 입술
  alternatives_korean:
  - 입술들
  lexicon: HALOT
  rationale: 히브리어 쌍수형을 한국어에서는 자연스럽게 단수 명사 ‘입술’로 옮기되, 구체적 신체 이미지는 유지했습니다.
- source_word: יִשָּׁק
  english_pob_choice: he kisses
  chosen_korean: 입 맞춥니다
