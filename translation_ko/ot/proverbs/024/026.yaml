  lexicon: HALOT
  rationale: 원문은 ‘곧고 바른’ 말의 성격을 가리키므로, 한국어에서는 그 의미를 담아 자연스러운 품질 형용사로 압축했습니다.
theological_decisions:
- issue: 히브리어 속담의 비유를 직설로 풀지, 이미지 중심으로 유지할지
  chosen_reading: 입 맞춤이라는 신체적 이미지를 살려, 바른 말을 하는 응답의 친밀함과 적절함을 드러내는 번역을 택했습니다.
  alternative_readings:
  - “정직한 대답은 입술에 입 맞춤과 같습니다.”
  - “바른 말을 하는 이는 입술에 입 맞춥니다.”
  rationale: 이 절은 단순한 정보 전달보다 잠언 특유의 응축된 비유가 핵심이므로, 이미지를 보존하는 쪽이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 잠언의 비유적 지혜 문학 해석
