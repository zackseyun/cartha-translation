  lexicon: HALOT
  rationale: 문맥상 ‘말’을 내어놓는 응답자를 가리키므로, 한국어에서는 매끄럽게 ‘말하는 사람’으로 처리했습니다.
- source_word: נְכֹחִים
  english_pob_choice: upright words
  chosen_korean: 지혜로운
