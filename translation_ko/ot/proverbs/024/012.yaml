id: PRO.24.12
reference: Proverbs 24:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
  footnotes:
  - marker: a
    text: Or “we knew nothing of this.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “he who weighs hearts,” an image of God examining inner motives.
    reason: cultural_note
  - marker: c
    text: Or “he who guards your life.” Hebrew nephesh can mean “soul,” “life,” or “self,” depending on context.
    reason: lexical_alternative
  - marker: d
    text: Hebrew “a man,” used here in a generic sense for a human being.
    reason: lexical_alternative
  - marker: e
    text: Or “according to what he has done.”
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 “보십시오, 우리는 이것을 알지 못했습니다[a]”라고 말한다면, 마음을 달아보시는 이[b]가 어찌 깨닫지 못하시겠으며, 당신의 영혼을 지키시는 이[c]가 어찌 알지 못하시겠습니까? 그가 사람[d]에게 그 행위대로[e] 갚지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “우리는 이것을 전혀 알지 못했습니다”로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘마음을 달아보시는 이’입니다. 하나님이 사람의 내면 동기를 살피신다는 이미지를 담고 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 네페쉬는 문맥에 따라 ‘영혼’, ‘생명’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘사람’은 여기서 일반적인 인간을 가리키는 말입니다.
    reason: lexical_alternative
  - marker: e
    text: “그가 행한 것대로”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי תֹאמַר
  english_pob_choice: If you say
  chosen_korean: 만일 당신이 …라고 말한다면
  alternatives_korean:
  - 당신이 …라고 말하면
  - 혹시 당신이 …라고 말한다면
  lexicon: HALOT
  rationale: 가정적 조건문으로 시작하는 구조를 살려, 자연스러운 현대 한국어 조건 표현으로 옮겼습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 말속의 이목을 끄는 감탄사로서, 문어체 합쇼체에 맞는 직접적 호명 표현을 택했습니다.
- source_word: תֹכֵן לִבּוֹת
  english_pob_choice: he who weighs hearts
  chosen_korean: 마음을 달아보시는 이
  alternatives_korean:
  - 마음을 살피시는 이
  - 마음을 헤아리시는 이
  lexicon: HALOT
  rationale: ‘달다/달아보다’는 저울로 무게를 재는 이미지를 살려, 마음을 평가하시는 하나님이라는 은유를 보존합니다.
- source_word: וְנֹצֵר נַפְשְׁךָ
  english_pob_choice: and he who keeps your soul
  chosen_korean: 당신의 영혼을 지키시는 이
  alternatives_korean:
  - 당신의 생명을 지키시는 이
  - 당신의 목숨을 지키시는 이
  lexicon: HALOT
  rationale: נפש의 넓은 의미를 한국어 ‘영혼’으로 옮겨, 단순한 생물학적 생명으로만 축소하지 않도록 했습니다.
- source_word: לְאָדָם כְּפָעֳלוֹ
  english_pob_choice: a man according to his work
  chosen_korean: 사람에게 그의 행위대로
  alternatives_korean:
  - 한 사람에게 그가 한 일대로
  - 사람에게 그의 한 일에 따라
  lexicon: HALOT
  rationale: אָדם의 대표적 일반성을 살리되, 한국어에서는 성별을 드러내지 않는 ‘사람’으로 옮겨 문맥의 보편적 심판 선언을 드러냈습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역에서 ‘영혼’ 유지 여부
  chosen_reading: 당신의 영혼을 지키시는 이
  alternative_readings:
  - 당신의 생명을 지키시는 이
  - 당신 자신을 지키시는 이
  rationale: 본문은 하나님의 내밀한 아심과 보호를 병렬로 말하므로, ‘영혼’이 원문의 표현 범위를 가장 잘 보존합니다. 다만 한국어 독자에게는 ‘생명’도 가능하므로, 주해적 여지를 남깁니다.
  doctrine_reference: Translation philosophy §1, §6
