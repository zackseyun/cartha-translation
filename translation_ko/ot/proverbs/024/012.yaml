  to: 만일 당신이 “보십시오, 우리는 이것을 알지 못했습니다[a]”라고 말한다면, 마음을 달아보시는 이[b]가 어찌 깨닫지 못하시겠으며, 당신의 영혼을 지키시는 이[c]가 어찌 알지 못하시겠습니까? 그가 사람[d]에게 그 행위대로[e] 갚지 않겠습니까?
  rationale: 본문의 의미와 합쇼체 문체는 유지하면서, 수사 의문의 병렬을 ‘깨닫다/알다’로 자연스럽게 드러냈습니다. 주석 표지를 각각의 해당 어구에 옮겨 구조적·참조상 모호함을 해소했고, 마지막 대명사를 정리하여 보응의 기준이 각 사람의 행위임을 분명히 했습니다.
