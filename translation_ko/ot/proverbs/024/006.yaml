id: PRO.24.6
reference: Proverbs 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
  footnotes:
  - marker: a
    text: Or 'with strategy' or 'with wise counsel'; the Hebrew term refers to skillful guidance or tactical planning.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance'; in this battle context, the Hebrew more specifically points to 'victory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 조언으로 전쟁을 치르며, 승리는 조언자들의 풍성함 속에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전략으로’, ‘지혜로운 조언으로’. 히브리어는 숙련된 지휘와 전술적 계획을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구원’. 다만 이 전쟁 맥락에서는 ‘승리’가 더 구체적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְתַחְבֻּלוֹת
  english_pob_choice: by wise guidance
  chosen_korean: 지혜로운 조언으로
  alternatives_korean:
  - 전략으로
  - 지략으로
  - 슬기로운 지도로
  lexicon: HALOT
  rationale: תַּחְבֻּלוֹת는 전술·항해술적 ‘조종/지휘’와 전략적 계획을 아우르므로, 한국어에서는 군사적 느낌을 유지하면서도 지나치게 기술적이지 않은 ‘지혜로운 조언’으로 옮겼습니다.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  english_pob_choice: you will wage war
  chosen_korean: 전쟁을 치르며
  alternatives_korean:
  - 전쟁을 벌이며
  - 전쟁을 하며
  - 너를 위해 전쟁을 하며
  lexicon: HALOT
  rationale: עָשָׂה מִלְחָמָה의 관용적 뜻은 ‘전쟁을 치르다/벌이다’이므로 자연스러운 동사구로 풀었고, לְךָ는 영어 POB의 조정처럼 한국어에서도 부자연스러운 직역을 피했습니다.
- source_word: וּתְשׁוּעָה
  english_pob_choice: and victory
  chosen_korean: 승리는
  alternatives_korean:
  - 구원은
  - 해방은
  - 승전은
  lexicon: HALOT
  rationale: 전투 맥락에서 תְּשׁוּעָה는 일반적 ‘구원’보다 전쟁의 성공 결과를 가리키므로, POB의 선택을 따라 ‘승리’로 구체화했습니다.
- source_word: בְּרֹב יוֹעֵץ
  english_pob_choice: in an abundance of counselors
  chosen_korean: 조언자들의 풍성함 속에
  alternatives_korean:
  - 많은 조언자들 가운데
  - 조언자들의 많음 속에
  - 많은 상담자들 가운데
  lexicon: HALOT
  rationale: רֹב는 ‘많음/풍성함’의 뜻을 살리고, יוֹעֵץ의 단수형을 집합적으로 이해하여 복수 ‘조언자들’로 옮겼습니다. ‘상담자들’보다 ‘조언자들’이 문맥상 더 자연스럽습니다.
theological_decisions:
- issue: 전쟁과 조언의 관계를 어떻게 표현할지
  chosen_reading: 지혜로운 전략이나 조언이 전쟁의 성공을 좌우한다는 잠언의 일반 원리를 전달했습니다.
  alternative_readings:
  - 도덕적 교훈으로만 약화하여 표현할 수 있음
  - 승리를 하나님의 직접적 개입으로만 한정할 수 있음
  rationale: 이 절은 전쟁 자체를 미화하기보다, 다수의 조언과 신중한 계획이 결과를 좌우한다는 지혜 문학의 통찰을 말합니다. 따라서 본문이 말하는 인과를 그대로 드러냈습니다.
  doctrine_reference: 잠언 24:6의 지혜문학적 교훈
