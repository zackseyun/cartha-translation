  - 크게 기뻐하지 마십시오
  lexicon: HALOT
  rationale: גיל의 더 강한 들뜬 기쁨을 반영해 첫 절의 ‘기뻐하다’와 구별되도록 더 격한 표현을 택했습니다.
theological_decisions:
- issue: 두 개의 유사하지만 구별되는 기쁨 동사 유지
  chosen_reading: 첫째는 일반적 기쁨(שמח), 둘째는 격한 환희/들뜸(גיל)로 구별해 번역했습니다.
  alternative_readings:
  - 두 절 모두 단순히 ‘기뻐하다’로 평준화
  - 둘째도 같은 수준의 감정으로 번역
  rationale: 지혜문학의 수사적 평행을 살리려면 두 동사의 강도 차이를 한국어에서도 드러내는 것이 중요합니다.
  doctrine_reference: 잠언의 수사적 평행법과 정서 어휘의 구별
