translation:
  language: ko
  text: 당신의 원수가 넘어질 때 기뻐하지 마십시오. 그가 비틀거릴 때 마음속으로 환희에 차지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 관련되지만 구별되는 두 기쁨 동사(שמח, גיל)를 사용합니다. 첫째는 일반적인 기쁨을, 둘째는 더 고조된 환희를 나타냅니다.
    reason: lexical_alternative
