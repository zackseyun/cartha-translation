  - 기뻐하지 말라
  lexicon: HALOT
  rationale: שמח의 기본 의미인 기쁨/즐거움을 표준적인 합쇼체 금지형으로 옮겼습니다.
- source_word: יָגֵל
  english_pob_choice: exult
  chosen_korean: 기뻐 뛰게 하지 마십시오
  alternatives_korean:
