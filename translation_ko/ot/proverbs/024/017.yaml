  - 원수가 넘어짐에
  lexicon: HALOT
  rationale: ב+부정사구의 시간적 용법을 한국어의 자연스러운 ‘-ㄹ 때’로 옮겨, 사건의 시점을 분명하게 살렸습니다.
- source_word: אויביך
  english_pob_choice: your enemy
  chosen_korean: 네 원수
  alternatives_korean:
  - 네 적
  - 네 원수들
  lexicon: HALOT
  rationale: 히브리어 형식은 단수적 집합 의미로 읽히며, 뒤의 ‘그가’가 단수 해석을 뒷받침하므로 ‘원수’가 가장 직접적입니다.
- source_word: תִּשְׂמָח
  english_pob_choice: rejoice
  chosen_korean: 기뻐하지 마십시오
  alternatives_korean:
