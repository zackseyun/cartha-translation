  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
  footnotes:
  - marker: a
    text: 'Or ''Do not be glad when your enemy falls, and do not let your heart rejoice when he stumbles.'' The Hebrew uses two related but distinct joy terms: שמח (''rejoice/be glad'') and גיל (''exult'').'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 원수가 넘어질 때 기뻐하지 마십시오. 그가 비틀거릴 때 당신의 마음이 기뻐 뛰게 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 관련되지만 구별되는 두 기쁨 동사(שמח, גיל)를 사용합니다. 그래서 첫 절은 일반적인 기쁨, 둘째 절은 더 들뜬 환희로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְפֹל
  english_pob_choice: when your enemy falls
  chosen_korean: 네 원수가 넘어질 때
  alternatives_korean:
  - 원수가 쓰러질 때
