id: PRO.24.7
reference: Proverbs 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאמ֣וֹת לֶֽ/אֱוִ֣יל חָכְמ֑וֹת בַּ֝/שַּׁ֗עַר לֹ֣א יִפְתַּח פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
  footnotes:
  - marker: a
    text: Or 'Wisdoms are exalted for a fool'; the Hebrew uses a plural form for 'wisdom,' likely as an abstract or intensive expression.
    reason: lexical_alternative
  - marker: b
    text: The 'gate' was the place of public deliberation, legal decisions, and civic leadership in an Israelite town.
    reason: cultural_note
translation:
  language: ko
  text: 지혜는 어리석은 자에게 너무 높습니다[a]; 성문에서는 그가 입을 열지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜’는 히브리어에서 복수형이나, 잠언에서는 추상적 또는 강조적 복수로 쓰인 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 이스라엘 성읍에서 공적 논의와 재판, 공동체의 의사 결정이 이루어지던 장소였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רָאמֹות / רָאמוֹת
  english_pob_choice: too high
  chosen_korean: 너무 높습니다
  alternatives_korean:
  - 높습니다
  - 뛰어납니다
  - 접근하기 어렵습니다
  lexicon: HALOT
  rationale: 지혜가 단순히 ‘높다’기보다 어리석은 자가 닿을 수 없는 높이라는 뜻을 살려, 한국어에서는 자연스러운 관용인 ‘너무 높습니다’로 옮겼습니다.
- source_word: לֶאֱוִיל
  english_pob_choice: for a fool
  chosen_korean: 어리석은 자에게는
  alternatives_korean:
  - 어리석은 자를 위해
  - 바보에게
  - 어리석은 자에게
  lexicon: HALOT
  rationale: ל의 관계 용법을 따라 지혜가 ‘어리석은 자에게’ 해당되지 않거나 그의 범위를 넘어선다는 뜻을 드러내기 위해 ‘에게는’으로 처리했습니다.
- source_word: חָכְמוֹת
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜들
  - 지혜로운 것들
  lexicon: HALOT
  rationale: 형태는 복수형이지만 잠언의 관용적 복수/추상 표현으로 보아 단수 ‘지혜’로 자연스럽게 번역했습니다.
- source_word: בַּשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 문에서
  alternatives_korean:
  - 성문에서
  - 성문 안에서
  - 문 안에서
  lexicon: HALOT
  rationale: ‘문/성문’은 공동체의 재판과 공적 논의가 이루어지는 장소이므로, 본문의 공적 발화 장면을 간결하게 살리되 필요 이상으로 풀지 않았습니다.
- source_word: לֹא יִפְתַּח פִּיהוּ
  english_pob_choice: he does not open his mouth
  chosen_korean: 입을 열지 못합니다
  alternatives_korean:
  - 입을 열지 않습니다
  - 말을 하지 못합니다
  - 입을 열 수 없습니다
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘입을 열지 않는다’이지만, 여기서는 공적 자리에서 말문이 막힌 상태를 자연스럽게 드러내기 위해 ‘열지 못합니다’로 옮겼습니다.
theological_decisions:
- issue: ‘문/성문’의 사회적 배경을 본문에 어떻게 반영할지
  chosen_reading: 본문에는 간결히 ‘문에서’로 두고, 공적 재판·협의의 장소라는 의미는 문화 주석으로만 유지합니다.
  alternative_readings:
  - 성문에서
  - 재판석에서
  - 공론의 장에서
  rationale: 히브리어의 관용을 과도하게 해설하지 않으면서도, 독자가 공적 발화의 장면을 이해할 수 있도록 최소한의 직역을 유지했습니다.
  doctrine_reference: 잠언의 지혜 문학적 맥락과 성문 관습
