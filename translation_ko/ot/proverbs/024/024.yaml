source:
  edition: WLC
  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
  footnotes:
  - marker: a
    text: Or “He who says to the wicked, ‘You are in the right,’ peoples will curse him; nations will be indignant at him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사람에게 “당신은 의롭습니다”라고 말하는 사람은, 민족들이 그를 저주할 것이며 나라들이 그를 분개할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 사람’은 רָשָׁע의 직역적 의미를 살린 것으로, 법정상 ‘유죄인’보다 도덕적으로 악한 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵר
  english_pob_choice: Whoever says
  chosen_korean: 말하는 사람은
  alternatives_korean:
  - 누구든지 말하는 자는
  - 말하는 이는
  lexicon: HALOT
  rationale: 분사형의 일반화된 진술을 한국어에서는 ‘말하는 사람은’으로 자연스럽게 옮겨, 격언적 보편성을 유지했습니다.
- source_word: לְרָשָׁע
  english_pob_choice: to the wicked
  chosen_korean: 악한 사람에게
  alternatives_korean:
  - 악인에게
  - 악한 자에게
  lexicon: HALOT
  rationale: רָשָׁע은 도덕적 범주로서의 ‘악한 사람’이 가장 직관적이며, 현대 한국어에서 성경적 어감을 과도하게 고정하지 않으면서도 원뜻을 보존합니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의롭습니다
  alternatives_korean:
  - 의인입니다
  - 옳습니다
  lexicon: HALOT
  rationale: 직접화법에서 צַדִּיק의 윤리적·법적 정당성을 살리기 위해 ‘의롭습니다’를 택했습니다. ‘옳습니다’는 다소 약하고, ‘의인입니다’는 명사화가 강합니다.
- source_word: יִקְּבֻהוּ עַמִּים / יִזְעָמוּהוּ לְאֻמִּים
  english_pob_choice: peoples will curse him; nations will denounce him
  chosen_korean: 민족들이 그를 저주할 것이며 나라들이 그를 분개할 것입니다
  alternatives_korean:
  - 백성들이 그를 저주할 것이며 민족들이 그를 분개할 것입니다
  - 민족들이 그를 저주할 것이며 나라들이 그를 격분할 것입니다
  lexicon: HALOT
  rationale: 두 평행절의 어휘 차이를 살려 עַמִּים은 ‘민족들’, לְאֻמִּים은 ‘나라들’로 구분했고, יִזְעָמוּהוּ는 단순한 ‘저주’보다 공개적 비난·격분의 뉘앙스를 담는 ‘분개하다’로 옮겼습니다.
theological_decisions:
- issue: 잠언의 일반격언을 한국어에서 어떻게 주어화할 것인가
  chosen_reading: 익명 일반 주어 ‘말하는 사람은’으로 옮겨, 특정 개인이 아니라 보편적 원리를 말하는 구조를 드러냈습니다.
  alternative_readings:
  - ‘누구든지 말하는 자는’
  - ‘그런 말을 하는 자는’
  rationale: 히브리어 분사는 특정인을 지칭하지 않는 격언적 진술이므로, 한국어도 동일한 교훈적 일반성을 유지하는 쪽이 문맥상 더 정확합니다.
  doctrine_reference: 잠언의 교훈적 일반화와 지혜문학의 격언 형식
