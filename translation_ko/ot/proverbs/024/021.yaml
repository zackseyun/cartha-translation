  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
  footnotes:
  - marker: a
    text: Or 'do not mix with rebels'; the Hebrew literally refers to 'those who change,' likely people inclined toward upheaval or disloyal change.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼[a]와 왕을 두려워하십시오, 내 아들아. 변화를 좋아하는 자들과는 어울리지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘야훼’는 히브리어 본문의 신명 יהוה를 옮긴 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: יְרָא
  english_pob_choice: Fear
  chosen_korean: 두려워하십시오
  alternatives_korean:
  - 경외하십시오
  - 두려워하라
  lexicon: HALOT
  rationale: 지혜문학의 명령형으로서 순종을 동반한 경외를 요구하지만, 한국어에서는 ‘경외하다’보다 ‘두려워하다’가 원문의 강한 권면과 긴장을 더 직접적으로 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기를 관습적 대체어로 풀지 않고, POB의 원칙에 따라 고유명사로 음역했습니다.
- source_word: שׁוֹנִים
  english_pob_choice: those who are given to change
  chosen_korean: 변화를 좋아하는 자들
  alternatives_korean:
  - 변화를 일삼는 자들
  - 반역자들
  - 불안정한 자들
  lexicon: HALOT
  rationale: 어근상 ‘변하다/바꾸다’의 의미를 살리되, 정치적·사회적 불온성을 지나치게 좁혀 단정하지 않도록 본문 수준에서 자연스럽게 옮겼습니다.
- source_word: אַל תִּתְעָרָב
  english_pob_choice: do not associate
  chosen_korean: 어울리지 마십시오
  alternatives_korean:
  - 섞이지 마십시오
  - 사귀지 마십시오
  - 관여하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘의 ‘섞이다/얽히다’ 뉘앙스를 현대 한국어의 관계·결속 금지 표현으로 옮겨, 단순한 동행보다 깊은 연루 금지를 드러냈습니다.
theological_decisions:
- issue: 여호와와 왕을 함께 두려워하라는 구조
  chosen_reading: 한 명령 아래에 ‘야훼’와 ‘왕’을 함께 두되, 동일한 신적 위상으로 평평하게 만들지는 않았습니다.
  alternative_readings:
  - ‘야훼와 왕을 공경하십시오’로 완화
  - 왕에 대한 두려움을 단순한 정치적 존중으로 축소
  rationale: 히브리어는 두 대상을 모두 ירא의 목적어로 놓습니다. 번역은 그 구조를 보존하되, 야훼의 궁극 권위와 왕의 파생 권위를 본문이 허용하는 긴장 속에 남겨 둡니다.
  doctrine_reference: '번역 원칙: 본문이 만든 신학적 긴장을 해소하지 않고 유지한다.'
