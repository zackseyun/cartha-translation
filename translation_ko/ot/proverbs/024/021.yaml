base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
  footnotes:
  - marker: a
    text: Or 'do not mix with rebels'; the Hebrew literally refers to 'those who change,' likely people inclined toward upheaval or disloyal change.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 야훼[a]와 왕을 두려워하십시오. 변화를 일삼는 자들[b]과는 어울리지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘야훼’는 히브리어 본문의 신명 יהוה를 옮긴 것입니다.
    reason: ot_citation
  - marker: b
    text: 또는 ‘반역자들’. 히브리어는 직역하면 ‘변하는/바꾸는 자들’을 가리키며, 문맥에서는 변화를 일삼거나 기존 질서를 뒤흔들려 하는 사람들을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָא
  english_pob_choice: Fear
  chosen_korean: 두려워하십시오
  alternatives_korean:
  - 경외하십시오
  - 두려워하라
  lexicon: HALOT
  rationale: 지혜문학의 명령형으로서 순종을 동반한 경외를 요구하지만, 한국어에서는 ‘경외하다’보다 ‘두려워하다’가 원문의 강한 권면과 긴장을 더 직접적으로 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
