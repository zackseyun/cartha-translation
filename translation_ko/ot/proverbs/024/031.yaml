base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
  footnotes:
  - marker: a
    text: Or 'thistles' for קִמְּשֹׂנִים; the exact plant is uncertain, but it denotes noxious overgrowth.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its face,' an idiom here meaning 'its surface.'
    reason: lexical_alternative
  - marker: c
    text: Or 'brambles' or 'weeds' for חֲרֻלִּים; the term refers to unwanted wild growth, traditionally 'nettles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 온통 가시덤불이 무성하게 자랐고, 쐐기풀이 그 표면을 덮었으며[b][c], 그 돌담은 무너져 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엉겅퀴’. קִמְּשֹׂנִים이 가리키는 정확한 식물은 불확실하나, 해로운 잡초성 식물을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘그 얼굴’이며, 여기서는 관용적으로 그 땅의 ‘표면’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가시덤불’이나 ‘잡초’. חֲרֻלִּים은 원하지 않는 야생 식물을 가리키며, 전통적으로 ‘쐐기풀’로 옮깁니다.
    reason: lexical_alternative
