base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
  footnotes:
  - marker: a
    text: Or 'those who reprove' or 'those who correct.' The Hebrew participle refers to people who give needed rebuke or correction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blessing of good,' that is, a beneficial or favorable blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 책망하는 이들[a]에게는 기쁨이 있을 것이며, 좋은 복[b]이 그들에게 임할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 ‘책망하다’뿐 아니라 ‘교정하다, 바로잡다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘좋음의 복’으로, 곧 유익하고 호의적인 복을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  english_pob_choice: But for those who rebuke
  chosen_korean: 하지만 책망하는 이들에게는
  alternatives_korean:
  - 하지만 꾸짖는 이들에게는
  - 하지만 교정하는 이들에게는
  lexicon: HALOT
  rationale: יכח의 분사형은 필요한 책망이나 교정을 주는 사람들을 가리키므로, 문맥에 맞게 ‘책망하는 이들’로 옮겼습니다. 앞절과의 대비는 ‘하지만’으로 살렸습니다.
- source_word: יִנְעָם
  english_pob_choice: it will be pleasant
  chosen_korean: 좋습니다
  alternatives_korean:
  - 즐겁습니다
  - 기쁠 것입니다
  - 유익합니다
  lexicon: HALOT
  rationale: 동사 נעם의 핵심은 ‘즐겁고 좋다, 유쾌하다’는 뜻이므로, 한국어에서는 짧고 자연스럽게 ‘좋습니다’로 옮겨 결과의 유익함을 드러냈습니다.
- source_word: בִרְכַּת טוֹב
  english_pob_choice: a good blessing
  chosen_korean: 좋은 복
  alternatives_korean:
  - 선한 복
  - 복된 복
  - 유익한 복
  lexicon: HALOT
  rationale: 직역하면 ‘좋음의 복’에 가까우나, 한국어에서는 ‘좋은 복’이 히브리어의 간결한 수식을 가장 자연스럽게 전달합니다. ‘복’은 문맥상 내리는 좋은 결과를 가리킵니다.
theological_decisions:
- issue: ‘복’의 성격
  chosen_reading: 여기서의 복은 책망하는 자에게 임하는 유익하고 호의적인 결과로 이해했습니다.
  alternative_readings:
  - 물질적 번영의 복
  - 일반적 행복
  rationale: 문맥상 지혜의 말은 도덕적 책망을 행하는 사람에게 돌아오는 유익을 말하므로, 과도한 번영 약속으로 읽지 않도록 했습니다.
  doctrine_reference: 잠언의 지혜 전통과 보응의 일반 원리
