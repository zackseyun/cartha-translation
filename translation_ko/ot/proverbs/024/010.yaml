  lexicon: HALOT
  rationale: 히트파엘의 רפה는 ‘약해지다, 느슨해지다, 기운을 잃다’의 뜻이 있어, 여기서는 실패나 무기력으로 무너지는 뉘앙스를 살린 ‘falter하면’이 가장 가깝습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in a day of distress
  chosen_korean: 곤경의 날에
  alternatives_korean:
  - 환난의 날에
  - 고난의 날에
  - 재난의 날에
  lexicon: HALOT
  rationale: צָרָה는 단순한 ‘문제’보다 압박과 위급함이 있는 ‘곤경/환난’에 가깝기 때문에, 간결한 문장 안에서 의미를 압축한 ‘곤경의 날에’를 택했습니다.
- source_word: צַר כֹּחֶךָ
  english_pob_choice: your strength is small
  chosen_korean: 당신의 힘은 작습니다
  alternatives_korean:
  - 당신의 힘은 제한됩니다
  - 당신의 힘은 부족합니다
  - 당신의 기력은 적습니다
  lexicon: HALOT
  rationale: צַר는 문자적으로는 ‘좁다/좁아지다’이지만, 여기서는 힘의 부족함을 뜻하므로 형용의 이미지를 살리면서도 자연스러운 한국어인 ‘작습니다’로 옮겼습니다.
theological_decisions:
- issue: 격언의 조건문과 평가적 어조
  chosen_reading: 조건을 직접적으로 살려, 실패의 가능성을 경고하는 지혜문학의 평가적 문장을 유지했습니다.
  alternative_readings:
  - ‘만일 낙심하면’처럼 심리 상태를 더 분명히 풀어 쓰는 방식
  - ‘약해 보이면’처럼 완곡하게 만드는 방식
  rationale: 이 절은 도덕적 충고보다 현실적 진단을 통해 지혜를 전달하므로, 원문의 짧고 날카로운 경고성을 보존하는 번역이 적합합니다.
  doctrine_reference: 지혜문학의 교훈적 경고 어조 보존
