  text: 지혜로 집[a]이 지어지고, 명철로 집이 견고해집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 물리적 거처뿐 아니라 가정이나 집안을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘굳게 섭니다’ 또는 ‘안정됩니다’.
    reason: lexical_alternative
lexical_decisions:
