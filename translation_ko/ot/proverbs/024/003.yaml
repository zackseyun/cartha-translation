  source_fidelity: 히브리어의 수단을 나타내는 בְּ는 ‘지혜로/명철로’로 잘 반영됩니다. בַּיִת의 폭넓은 뜻도 ‘집’과 각주로 보존할 수 있습니다. 다만 יִתְכּוֹנָן은 집이 안정되고 견고한 상태에 이르는 뜻이므로, 초안의 ‘그것이 굳게 섭니다’보다 ‘집이 견고해집니다’가 더 자연스럽고 분명합니다.
