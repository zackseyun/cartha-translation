  text: בְּ֭/חָכְמָה יִבָּ֣נֶה בָּ֑יִת וּ֝/בִ/תְבוּנָ֗ה יִתְכּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/003.yaml
  text: By wisdom a house is built[b][a], and by understanding it is established.
  footnotes:
  - marker: a
    text: Or 'a household'; 'house' may refer both to a physical dwelling and, by extension, to a family or household.
    reason: lexical_alternative
  - marker: b
    text: Or 'is made secure' / 'is set firm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로 집이 세워지고, 분별로 그것이 굳게 섭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''집''은 물리적 거처뿐 아니라 가정이나 집안을 가리킬 수도 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''굳게 섭니다''는 ''굳게 세워집니다'' 또는 ''안전하게 됩니다''의 자연스러운 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  english_pob_choice: By wisdom
  chosen_korean: 지혜로
  alternatives_korean:
  - 지혜와 함께
  - 지혜를 통해
  lexicon: HALOT
  rationale: ב의 수단 용법을 자연스럽게 살리면서, 잠언 문맥의 격언적 진술에 맞게 간결하게 옮겼습니다.
- source_word: יִבָּנֶה בָּיִת
  english_pob_choice: a house is built
  chosen_korean: 집이 세워지고
  alternatives_korean:
  - 집이 지어지고
  - 가옥이 세워지고
  - 한 집이 세워지고
  lexicon: HALOT
  rationale: בַּיִת의 기본 이미지를 살려 '집'으로 옮기되, 잠언의 보편적 진술을 드러내기 위해 수동적·일반적 표현인 '세워지고'를 택했습니다.
- source_word: בִּתְבוּנָה
  english_pob_choice: by understanding
  chosen_korean: 분별로
  alternatives_korean:
  - 이해로
  - 깨달음으로
  lexicon: HALOT
  rationale: תְבוּנָה는 단순한 지적 이해보다 분별·판단의 뉘앙스가 강해, 지혜와의 평행을 더 선명하게 드러내는 '분별'이 적절합니다.
- source_word: יִתְכּוֹנָן
  english_pob_choice: it is established
  chosen_korean: 그것이 굳게 섭니다
  alternatives_korean:
  - 그것이 확립됩니다
  - 그것이 견고해집니다
  - 그것이 정돈됩니다
  lexicon: HALOT
  rationale: כון의 결과 상태를 한국어에서 가장 자연스럽게 드러내는 표현으로 '굳게 섭니다'를 사용해, 단순한 건축 완료가 아니라 안정된 정착을 살렸습니다.
theological_decisions:
- issue: בַּיִת의 범위
  chosen_reading: '''집''을 기본으로 유지하되, 물리적 건물과 가정/집안의 넓은 의미를 함께 열어 둡니다.'
  alternative_readings:
  - '''가정''으로 한정'
  - '''집안''으로 풀어씀'
  rationale: 히브리어 בַּיִת는 물리적 집과 가문/가정을 모두 가리킬 수 있으므로, 본문 이미지인 '집'을 유지하는 것이 의미 범위를 가장 덜 훼손합니다.
  doctrine_reference: 잠언의 일반적 지혜 격언 해석
