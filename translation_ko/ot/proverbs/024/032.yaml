  source_fidelity: 첫 절의 אָשִׁית לִבִּי는 직역하면 ‘나는 내 마음을 두었다/기울였다’이며, 문맥상 앞서 본 대상에 주의를 기울여 숙고했다는 뜻입니다. 초안의 ‘그것을 마음에 새겼습니다’는 의미상 가능하지만, 원문에 없는 목적어 ‘그것을’을 명시하고 ‘새기다’가 다소 더 강한 영속성의 뉘앙스를 더합니다. ‘보고 마음에 두었습니다’가 원문의 절제된 표현과 순서를 더 잘 보존합니다. לָקַחְתִּי מוּסָר는 ‘교훈을 받았다/얻었다’로 적절히 옮길 수 있습니다.
