id: PRO.24.32
reference: Proverbs 24:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶחֱזֶ֣ה אָ֭נֹכִֽי אָשִׁ֣ית לִבִּ֑/י רָ֝אִ֗יתִי לָקַ֥חְתִּי מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/032.yaml
  text: Then I saw and took it to heart[b][a]; I looked and received instruction.
  footnotes:
  - marker: a
    text: Or 'set my heart'; the Hebrew is literally 'I set my heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'received discipline' or 'learned a lesson.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고서 나는 보고 그것을 마음에 새겼습니다[a]. 나는 살펴보고 교훈을 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘내 마음을 두었다/세웠다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘교훈’은 여기의 מוּסָר가 지닌 교육적·교정적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחֱזֶה
  english_pob_choice: Then I saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았습니다
  - 응시했습니다
  lexicon: HALOT
  rationale: חזה는 단순한 시각 행위보다 인식적 ‘봄’을 가리키므로, 문맥상 이어지는 깨달음의 흐름을 살려 ‘보고’로 자연스럽게 옮겼습니다.
- source_word: אָשִׁית לִבִּי
  english_pob_choice: took it to heart
  chosen_korean: 마음에 새겼습니다
  alternatives_korean:
  - 마음에 두었습니다
  - 제 마음을 두었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘마음을 두다/마음을 놓다’이지만, 지혜문학의 내면적 숙고를 현대 한국어에서 가장 분명하게 드러내는 표현으로 ‘마음에 새겼습니다’를 택했습니다.
- source_word: לָקַחְתִּי מוּסָר
  english_pob_choice: received instruction
  chosen_korean: 교훈을 받았습니다
  alternatives_korean:
  - 훈계를 받았습니다
  - 가르침을 받았습니다
  - 징계를 받았습니다
  lexicon: HALOT
  rationale: מוּסָר는 문맥에 따라 교훈·훈계·징계를 아우르지만, 여기서는 지혜를 배워 얻는 뜻이 핵심이므로 ‘교훈’을 택했습니다.
theological_decisions:
- issue: 지혜문학의 반성적 서술에서 반복되는 ‘보다/마음에 두다/배우다’의 단계
  chosen_reading: 화자가 관찰한 뒤 내면화하고, 그 결과 교훈을 얻는 순서를 그대로 살렸습니다.
  alternative_readings:
  - ‘그리고 나는 보았습니다’로 단순 병렬 처리
  - ‘마음을 두었습니다’로 보다 직역적인 표현
  rationale: 본문은 단순한 시각이 아니라 관찰에서 숙고, 그리고 배움으로 이어지는 지혜의 형성을 보여 주므로, 그 진행을 한국어에서도 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 잠언의 지혜 교육과 훈계 이해
