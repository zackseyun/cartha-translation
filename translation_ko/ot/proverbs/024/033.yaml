  rationale: The revision removes the added conditional sense, restores the Hebrew infinitive as a Korean nominal construction, and uses “포개고” to represent the folding of the hands. It retains the repeated “조금만,” the sleep/slumber parallelism, and the dash indicating that this line continues into the following verse.
