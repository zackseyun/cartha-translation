id: PRO.24.33
reference: Proverbs 24:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
  footnotes:
  - marker: a
    text: Or 'a little folding of the hands to rest.' The Hebrew infinitive can denote lying down generally, with rest or sleep as the implied result.
    reason: lexical_alternative
translation:
  language: ko
  text: 조금만 잠을 자고, 조금만 졸고, 손을 조금만 포개고 눕는 것—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉬기 위해 손을 조금만 포개는 것’이라고 옮길 수 있습니다. 히브리어 부정사는 일반적으로 눕는 것을 가리킬 수 있으며, 그 결과로 쉼이나 잠이 암시될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  english_pob_choice: a little
  chosen_korean: 조금만
  alternatives_korean:
  - 약간
  - 조금
  lexicon: HALOT
  rationale: 세 번 반복되는 מְעַט의 점층적·경구적 효과를 살리기 위해 간결한 ‘조금만’을 반복해 리듬과 긴박감을 유지했습니다.
- source_word: שֵׁנוֹת
  english_pob_choice: sleep
  chosen_korean: 자고
  alternatives_korean:
  - 잠
  - 수면
  lexicon: HALOT
  rationale: 히브리어는 형식상 복수지만, 한국어에서는 자연스러운 동사 표현 ‘자고’가 잠의 행위를 직접적으로 전합니다.
- source_word: תְּנוּמוֹת
  english_pob_choice: slumber
  chosen_korean: 졸고
  alternatives_korean:
  - 졸고만
  - 꾸벅거리며
  lexicon: HALOT
  rationale: 앞의 ‘자고’와 평행을 이루는 약한 졸림의 뉘앙스를 ‘졸고’로 옮겨, 단순 반복이 아니라 점차 느슨해지는 상태를 드러냈습니다.
- source_word: חִבֻּק יָדַיִם
  english_pob_choice: folding of the hands
  chosen_korean: 손을 조금만 모아
  alternatives_korean:
  - 손을 포개고
  - 손을 깍지 끼고
  lexicon: HALOT
  rationale: 관용적으로는 게으름을 뜻하지만, 히브리어의 구체적 손동작을 보존하기 위해 ‘손을 … 모아’로 옮기고, POB의 의미상 여지를 살려 과도한 해석은 피했습니다.
- source_word: לִשְׁכָּב
  english_pob_choice: to lie down
  chosen_korean: 누우면
  alternatives_korean:
  - 눕기 위해
  - 누울 때
  lexicon: HALOT
  rationale: 동사의 목적/결과를 자연스러운 한국어 종결 구조로 풀어, ‘쉬다’보다 더 넓은 ‘누움’의 의미를 유지했습니다.
theological_decisions:
- issue: 잠과 나태를 연결하는 잠언의 경고를 어떻게 전할지
  chosen_reading: 본문의 반복과 병렬을 유지해, 단순한 휴식의 권면이 아니라 게으름으로 기울어지는 미세한 진행을 경고하는 말로 읽히게 했습니다.
  alternative_readings:
  - 중립적으로 ‘조금만 자면…’처럼 휴식 일반으로 읽기
  - 직설적으로 ‘게으름’이라는 해석어를 본문에 넣기
  rationale: 히브리어는 명시적으로 ‘게으름’을 말하지 않으므로, 원문이 보여 주는 수사적 흐름을 보존하는 편이 더 정확합니다.
  doctrine_reference: 잠언 24장 문맥의 지혜 문학적 경고
- issue: ‘손을 모아’의 표현을 해석적으로 풀어 쓸지 여부
  chosen_reading: 문자적 동작을 우선 살리되, 한국어에서 관용적 의미가 자연히 떠오르도록 과도한 설명을 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘손을 접어’처럼 더 직역하기
  - ‘손을 모아 쉬면’처럼 의미를 명시하기
  rationale: 원문은 구체적 몸동작을 통해 나태의 태도를 그리므로, 본문에서 해석을 덧붙이기보다 여백을 남기는 것이 좋습니다.
  doctrine_reference: 성경 번역의 문법-수사 보존 원칙
