id: PRO.29.9
reference: Proverbs 29:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
  footnotes:
  - marker: a
    text: Or, 'If a wise man contends with a fool, the fool may rage or laugh, but there is no rest.' The Hebrew does not explicitly identify whether the one raging/laughing is the wise man or the fool; context favors the fool for many interpreters.
    reason: alternative_reading
  - marker: b
    text: '''Laughs'' may carry the sense of derisive laughter or scoffing in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람이 어리석은 사람과 다투면, 그가 성을 내든지 웃든지 간에 평온이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘지혜로운 사람이 어리석은 사람과 다투면, 어리석은 사람이 성을 내든지 웃든지 간에 평온이 없습니다.’ 히브리어는 성을 내거나 웃는 주체를 분명히 밝히지 않지만, 많은 해석자들은 문맥상 어리석은 사람으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: ‘웃다’는 문맥에서 조롱하거나 비웃는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 현명한 사람
  lexicon: HALOT
  rationale: 히브리어는 남성형 단수이지만, 잠언의 격언적 문맥에서는 대표성 있는 일반 진술이므로 한국어에서는 성별 표지를 완화한 ‘사람’이 자연스럽고 독자에게도 덜 협소합니다.
- source_word: נִשְׁפָּט אֶת אִישׁ אֱוִיל
  english_pob_choice: has a dispute with a foolish man
  chosen_korean: 어리석은 사람과 다투면
  alternatives_korean:
  - 어리석은 사람과 분쟁하면
  - 어리석은 사람과 소송하면
  lexicon: HALOT
  rationale: נִשְׁפָּט는 법정 절차를 반드시 뜻하지 않고 대립·분쟁의 개시를 가리킬 수 있으므로, 현대어에서 가장 무리 없는 ‘다투다’를 택했습니다.
- source_word: וְרָגַז וְשָׂחַק
  english_pob_choice: whether he rages or laughs
  chosen_korean: 그가 성을 내든지 웃든지 간에
  alternatives_korean:
  - 그가 분노하든지 비웃든지 간에
  - 그가 격분하든지 조소하든지 간에
  lexicon: HALOT
  rationale: 히브리어는 주어가 명시적으로 분명하지 않지만, POB의 문맥 판단을 따르되 한국어에서는 주어를 일반화해 불확정성을 유지했습니다. שָׂחַק은 단순한 웃음보다 조롱의 뉘앙스를 가질 수 있으나 본문에는 기본 의미를 살렸습니다.
- source_word: וְאֵין נָחַת
  english_pob_choice: there is no rest
  chosen_korean: 평온이 없습니다
  alternatives_korean:
  - 쉬임이 없습니다
  - 평안이 없습니다
  - 안식이 없습니다
  lexicon: HALOT
  rationale: נחת는 휴식·고요·안정을 아우르므로, 대립의 결과로 남는 불안정함을 잘 담는 ‘평온’으로 옮겼습니다.
theological_decisions:
- issue: 주어의 모호성 유지
  chosen_reading: ‘그가 성을 내든지 웃든지 간에’로 옮겨, 분노/웃음의 주체를 본문이 명시하지 않는 모호성 그대로 보존했습니다.
  alternative_readings:
  - ‘어리석은 사람이 성을 내든지 웃든지 간에’
  - ‘지혜로운 사람이 성을 내든지 웃든지 간에’
  rationale: 히브리어는 동작의 주체를 문법적으로 명확히 지시하지 않으므로, 해석을 한쪽으로 고정하면 본문의 긴장을 지워 버립니다. POB 각주가 지적하듯 문맥상 어리석은 사람이 더 유력하지만, 본문 본체는 모호성을 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문 주해/해석학 원칙
- issue: ‘웃다’의 뉘앙스
  chosen_reading: 본체의 ‘웃다’는 기본 의미를 유지하되, 조롱·비웃음의 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 비웃다
  - 조롱하다
  rationale: שָׂחַק은 문맥상 냉소적 웃음을 뜻할 수 있지만, 본문 자체가 그 뉘앙스를 강제하지는 않으므로 번역문은 과도하게 해석하지 않았습니다.
  doctrine_reference: 어휘 의미론
