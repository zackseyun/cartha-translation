  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
  footnotes:
  - marker: a
    text: 'Hebrew: ''The fear of man gives a snare.'' The expression means that fearing people becomes a trap.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be safe' or 'will be protected'; Hebrew literally 'will be set on high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람에 대한 두려움은 올무가 되지만[a], 야훼를 신뢰하는 자는 높이 올려집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람에 대한 두려움은 올무를 준다’입니다. 곧 사람을 두려워하는 것이 함정이 된다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안전하게 된다’, ‘보호받는다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘높이 올려진다’입니다.
    reason: lexical_alternative
lexical_decisions:
