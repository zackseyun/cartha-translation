  - 올무가 됩니다
  lexicon: HALOT
  rationale: יִתֵּן은 직역상 ‘준다’이지만, 여기서는 ‘무엇을 놓아 사람을 걸리게 하다’는 관용적 이미지이므로 ‘올무가 놓이다’로 옮겨 원문의 비유를 유지했습니다.
- source_word: וּבוֹטֵחַ בַּיהוָה
  english_pob_choice: whoever trusts in Yahweh
  chosen_korean: 야훼를 신뢰하는 자는
  alternatives_korean:
  - 야훼를 신뢰하는 사람은
