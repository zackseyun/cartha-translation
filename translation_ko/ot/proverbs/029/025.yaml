  lexicon: HALOT
  rationale: בוֹטֵחַ는 지속적·일반적 태도를 나타내는 분사이므로 ‘신뢰하는 자’가 경구의 보편성을 잘 드러냅니다. POB의 ‘Yahweh’를 따라 신뢰의 대상도 ‘야훼’로 일관되게 옮겼습니다.
- source_word: יְשֻׂגָּב
  english_pob_choice: will be set on high
  chosen_korean: 높이 올려집니다
  alternatives_korean:
  - 높이 세워집니다
  - 안전하게 지켜집니다
  - 높은 곳에 올려집니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘높이 올려지다/높은 곳에 두이다’의 뜻을 가지며, 이 절에서는 그 고양이 곧 안전을 함축합니다. 한국어에서는 이미지와 의미를 함께 살려 ‘높이 올려집니다’로 옮겼습니다.
