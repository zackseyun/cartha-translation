source:
  edition: WLC
  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
  footnotes:
  - marker: a
    text: 'Hebrew: ''The fear of man gives a snare.'' The expression means that fearing people becomes a trap.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be safe' or 'will be protected'; Hebrew literally 'will be set on high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 두려워하면 올무가 놓이지만, 야훼를 신뢰하는 자는 높이 올려집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람의 두려움은 올무를 준다’입니다. 곧 사람을 두려워하는 것이 함정이 된다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안전하게 된다’, ‘보호받는다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘높이 올려진다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  english_pob_choice: The fear of man
  chosen_korean: 사람을 두려워하면
  alternatives_korean:
  - 사람에 대한 두려움은
  - 사람을 무서워하면
  - 사람을 두려워하는 것은
  lexicon: HALOT
  rationale: 히브리어 속격 구성은 사람에 대한 두려움이 사람을 지배하는 상태를 가리키며, 한국어에서는 조건형으로 풀어 ‘사람을 두려워하면’이 가장 자연스럽고 경구의 힘도 잘 살립니다.
- source_word: יִתֵּן מוֹקֵשׁ
  english_pob_choice: lays a snare
  chosen_korean: 올무가 놓이지만
  alternatives_korean:
  - 올무를 놓지만
  - 덫을 놓지만
  - 올무가 됩니다
  lexicon: HALOT
  rationale: יִתֵּן은 직역상 ‘준다’이지만, 여기서는 ‘무엇을 놓아 사람을 걸리게 하다’는 관용적 이미지이므로 ‘올무가 놓이다’로 옮겨 원문의 비유를 유지했습니다.
- source_word: וּבוֹטֵחַ בַּיהוָה
  english_pob_choice: whoever trusts in Yahweh
  chosen_korean: 야훼를 신뢰하는 자는
  alternatives_korean:
  - 야훼를 신뢰하는 사람은
  - 야훼를 믿는 자는
  - 야훼께 의지하는 자는
  lexicon: HALOT
  rationale: בוֹטֵחַ는 지속적·일반적 태도를 나타내는 분사이므로 ‘신뢰하는 자’가 경구의 보편성을 잘 드러냅니다. POB의 ‘Yahweh’를 따라 신뢰의 대상도 ‘야훼’로 일관되게 옮겼습니다.
- source_word: יְשֻׂגָּב
  english_pob_choice: will be set on high
  chosen_korean: 높이 올려집니다
  alternatives_korean:
  - 높이 세워집니다
  - 안전하게 지켜집니다
  - 높은 곳에 올려집니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘높이 올려지다/높은 곳에 두이다’의 뜻을 가지며, 이 절에서는 그 고양이 곧 안전을 함축합니다. 한국어에서는 이미지와 의미를 함께 살려 ‘높이 올려집니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 이 절은 히브리어 본문에 여호와의 이름이 직접 나오므로, POB의 기본 원칙에 따라 전통적 대체어보다 원형을 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
