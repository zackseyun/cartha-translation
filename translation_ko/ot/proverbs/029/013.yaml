id: PRO.29.13
reference: Proverbs 29:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
  footnotes:
  - marker: a
    text: Or 'a man of oppressions'; the Hebrew expression may refer to an exploitative or oppressive person, and has also been understood as 'a deceitful man' or 'a usurer.'
    reason: lexical_alternative
  - marker: b
    text: The expression 'gives light to the eyes' can mean gives sight, gives life, or sustains and enlightens.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람과 압제자가 서로 만납니다[a]; 야훼께서 그 둘의 눈을 밝히십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘압제자’ 외에도 ‘속이는 사람’ 또는 ‘고리대금하는 사람’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘눈을 밝히다’는 시력을 주다, 생명을 유지하다, 또는 깨우쳐 주다의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈곤한 사람
  - 가난한 이
  lexicon: HALOT
  rationale: 히브리어 רָשׁ는 가난하거나 궁핍한 사람을 가리키므로, 한국어에서는 자연스러운 합쇼체 문맥에 맞게 ‘가난한 사람’으로 옮겼습니다. 남성형 단수의 대구 구조도 무리 없이 유지됩니다.
- source_word: אִישׁ תְּכָכִים
  english_pob_choice: an oppressor
  chosen_korean: 압제자
  alternatives_korean:
  - 학대하는 사람
  - 속이는 사람
  - 고리대금하는 사람
  - 압제하는 사람
  lexicon: HALOT
  rationale: 표현이 난해하지만 문맥상 착취적·억압적 행위를 하는 사람을 가리키는 뜻이 가장 가능성이 크므로, 의미를 살린 ‘압제자’를 택했습니다. 직역인 ‘압제들의 사람’은 한국어에서 불투명합니다.
- source_word: מֵאִיר עֵינֵי שְׁנֵיהֶם
  english_pob_choice: gives light to the eyes of both of them
  chosen_korean: 그 둘의 눈을 밝히십니다
  alternatives_korean:
  - 그 둘의 눈에 빛을 주십니다
  - 그 둘의 눈을 비추십니다
  - 그 둘에게 시력을 주십니다
  lexicon: HALOT
  rationale: ‘눈을 밝히다’는 히브리어 관용구의 빛/시력/생기 부여 가능성을 모두 열어 두면서도 한국어에서 자연스럽습니다. POB가 보존한 비유적 다의성을 과도하게 해소하지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전적·학술적 관행에 따라 여호와가 아니라 ‘야훼’로 옮겨, 히브리어 고유 신명을 직접 드러냈습니다. 본문이 하나님을 호칭이 아닌 이름으로 지칭한다는 점을 유지합니다.
theological_decisions:
- issue: ‘눈을 밝히다’의 의미 범위
  chosen_reading: 야훼께서 가난한 사람과 압제자 모두에게 시력, 생기, 인식을 주시는 분이라는 표현의 여지를 남깁니다.
  alternative_readings:
  - 야훼께서 두 사람의 도덕적 상태를 비추십니다
  - 야훼께서 단지 두 사람을 공평하게 보십니다
  rationale: 히브리어 관용구는 물리적 시력, 생명 유지, 혹은 깨우침을 모두 암시할 수 있으므로, 한국어 번역에서도 의미를 한쪽으로 닫지 않았습니다. 이는 본문의 시적 긴장과 신학적 여백을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
