  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
  footnotes:
  - marker: a
    text: Or 'will see their fall.' The Hebrew verb is simply 'see,' and the noun can be rendered 'fall' or 'downfall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들이 많아지면 죄악도 많아지지만, 의인들은 그들의 몰락을 보게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 넘어짐을 볼 것입니다.’ 히브리어 동사는 단순히 ‘보다’이고, 명사는 ‘넘어짐’ 또는 ‘몰락’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת רְשָׁעִים
  english_pob_choice: When the wicked increase
  chosen_korean: 악인들이 많아지면
  alternatives_korean:
  - 악인들이 늘어날 때
  - 악인들이 번성하면
  lexicon: HALOT
  rationale: בִּרְבוֹת은 ‘...이 많아질 때/증가할 때’의 시간·상황절로 이해하는 것이 자연스럽고, רְשָׁעִים은 단순한 ‘악한 사람들’보다 지혜문학에서 관용적인 ‘악인들’이 적절합니다.
- source_word: יִרְבֶּה פָּשַׁע
  english_pob_choice: transgression increases
  chosen_korean: 범죄도 많아지고
  alternatives_korean:
  - 반역도 늘어나고
  - 죄악도 많아지고
  lexicon: HALOT
  rationale: פָּשַׁע는 일반적 ‘죄’보다 위반·반역의 뉘앙스가 강하므로, 문맥에 맞는 강도를 살리기 위해 ‘범죄’로 옮겼습니다.
- source_word: וְצַדִּיקִים
  english_pob_choice: but the righteous
  chosen_korean: 의인들은
  alternatives_korean:
  - 그러나 의인들은
  - 그런데 의인들은
  lexicon: HALOT
  rationale: 앞절과의 대조는 문맥상 분명하지만, 히브리어 접속사 וְ 자체는 단순 연결이므로 한국어에서는 과도한 접속어를 덧붙이지 않고 문장 흐름으로 대비를 드러냈습니다.
- source_word: בְּמַפַּלְתָּם יִרְאוּ
  english_pob_choice: will look upon their downfall
  chosen_korean: 그들의 몰락을 보게 됩니다
  alternatives_korean:
  - 그들의 넘어짐을 보게 됩니다
  - 그들의 추락을 목격하게 됩니다
  lexicon: HALOT
  rationale: מַפָּלָה는 ‘넘어짐/몰락/추락’의 범위가 있으나, 지혜문학의 결과적·판결적 뉘앙스를 살리기에 ‘몰락’이 가장 자연스럽습니다. יִרְאוּ는 단순 ‘보다’이므로 ‘보게 됩니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: ‘그들의’의 지시 대상
  chosen_reading: ‘그들의’는 첫 절의 악인들을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 일반적으로 넘어지는 자들을 가리킬 수 있습니다.
  rationale: 가장 가까운 선행사와 병행 구조상 악인들을 가리키는 해석이 가장 일관됩니다. 이는 교리 문제가 아니라 문맥과 통사에 따른 결정입니다.
  doctrine_reference: 문맥적 지시대상 해석
