translation:
  language: ko
  text: 매와 훈계는 지혜를 주지만, 내버려 둔 아이[a]는 자기 어머니에게 수치를 안깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방치된’, ‘제어받지 못한’. 히브리어는 문자적으로 ‘보내진’ 또는 ‘풀려난’ 아이를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  english_pob_choice: rod
  chosen_korean: 매
  alternatives_korean:
  - 막대기
  - 징계의 막대기
  lexicon: HALOT
  rationale: 지혜문학의 훈육 문맥에서 שֵׁבֶט은 구체적 징계 도구를 가리키므로, 한국어에서는 자연스럽고 관용적인 ‘매’가 물리적 징계의 이미지를 잘 살립니다.
- source_word: וְתוֹכַחַת
  english_pob_choice: and reproof
  chosen_korean: 훈계는
  alternatives_korean:
