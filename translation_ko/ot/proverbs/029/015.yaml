  - 교정은
  lexicon: HALOT
  rationale: תוֹכַחַת은 말로 하는 꾸짖음·교정을 뜻하므로, ‘훈계’가 짧고 자연스럽게 verbal correction의 기능을 드러냅니다.
- source_word: מְשֻׁלָּח
  english_pob_choice: left to himself
  chosen_korean: 제멋대로 내버려진
  alternatives_korean:
  - 방치된
  - 제어받지 못한
  - 내버려진
  lexicon: HALOT
  rationale: ‘보내다/놓아두다’의 수동 분사로서, 단순 방치보다 ‘억제 없이 풀려 있음’의 뜻이 있어 한국어에서는 ‘제멋대로 내버려진’이 문맥상 의미를 가장 잘 담습니다.
- source_word: מֵבִישׁ
  english_pob_choice: brings shame to
  chosen_korean: 수치를 안깁니다
  alternatives_korean:
  - 부끄러움을 줍니다
  - 수치를 줍니다
  lexicon: HALOT
  rationale: בוש의 사역적 의미를 살리면서도 속담의 간결성을 유지하기 위해, ‘수치를 안기다’로 옮겨 어머니에게 미치는 결과를 분명히 했습니다.
theological_decisions:
- issue: 훈육의 두 수단을 어떻게 보존할지
  chosen_reading: ‘매와 훈계’로 물리적 징계와 언어적 책망의 병치를 그대로 유지했습니다.
  alternative_readings:
  - ‘징계와 책망’처럼 추상화함
  - ‘벌과 교정’처럼 완곡하게 바꿈
  rationale: 히브리어는 구체적 도구(שֵׁבֶט)와 말의 교정(תוֹכַחַת)을 대조적으로 제시하므로, 이를 추상화하면 속담의 힘이 약해집니다.
  doctrine_reference: 잠언의 지혜 훈육 전통
