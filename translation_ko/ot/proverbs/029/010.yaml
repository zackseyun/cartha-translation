  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
  footnotes:
  - marker: a
    text: Or 'the upright care for his life' or 'seek to protect him.' The Hebrew can be understood positively here.
    reason: alternative_reading
translation:
  language: ko
  text: 피를 흘리는 사람들은 흠 없는 이를 미워하지만, 정직한 사람들은 그의 생명을 찾습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정직한 사람들은 그의 생명을 돌봅니다’ 혹은 ‘그를 보호하려 합니다’로도 이해할 수 있습니다. 히브리어는 긍정적으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  english_pob_choice: Men of blood
  chosen_korean: 피를 흘리는 사람들
  alternatives_korean:
  - 피의 사람들
  - 피투성이인 사람들
  - 폭력적인 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 힘을 살리면서도 한국어에서 자연스럽게 이해되도록 ‘피를 흘리는 사람들’로 옮겼습니다. ‘폭력적인 사람들’은 의미를 풀어 주지만 관용의 이미지가 약해집니다.
- source_word: תָם
  english_pob_choice: the blameless
  chosen_korean: 흠 없는 이
  alternatives_korean:
  - 무죄한 이
  - 온전한 이
  - 결백한 사람
  lexicon: HALOT
  rationale: 지혜문학에서의 도덕적 흠 없음과 무결함을 드러내는 표현으로 ‘흠 없는 이’를 택했습니다. ‘정직한’과 구별되어 첫 번째 행의 대상이 흐려지지 않게 합니다.
- source_word: וִישָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 사람들
  alternatives_korean:
  - 올곧은 사람들
  - 의로운 사람들
  - 바른 사람들
  lexicon: HALOT
  rationale: 복수 집단을 드러내고 첫 행의 ‘흠 없는 이’와 어조를 달리하기 위해 ‘정직한 사람들’로 옮겼습니다. 이는 도덕적으로 곧은 사람들을 가리키는 지혜문학의 일반적 용법과도 맞습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 목숨
  - 그의 삶
  - 그의 혼
  lexicon: HALOT
  rationale: נפש의 기본적 의미인 ‘생명’을 살리면서, 문맥상 ‘해치려 찾다’와 ‘보호하려 찾다’의 긴장을 모두 남길 수 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: 두 번째 행의 의미가 적대적 추격인지, 보호를 위한 관심인지의 긴장
  chosen_reading: 정직한 사람들은 그의 생명을 찾습니다.
  alternative_readings:
  - 정직한 사람들은 그의 생명을 돌봅니다.
  - 정직한 사람들은 그를 보호하려 합니다.
  - 정직한 사람들은 그의 생명을 구합니다.
  rationale: 히브리어 יְבַקְשׁוּ נַפְשׁוֹ는 직역상 ‘그의 생명을 찾다’로, 파괴적 의미와 보호적 의미가 함께 열려 있습니다. 본문이 가진 이 긴장을 풀어 버리지 않기 위해 직설적 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve source-text tension rather than resolving ambiguity.'
