  source_fidelity: 첫째 행의 אַנְשֵׁי דָמִים는 피를 흘리는 행위를 일삼는 폭력적·살인적인 자들을 가리킵니다. 초안의 ‘피를 흘리는 사람들’은 한국어에서 그들 자신이 피를 흘리는 사람이라는 뜻으로도 들릴 수 있어 행위 주체성이 충분히 드러나지 않습니다. 둘째 행은 ‘그의 생명/목숨을 찾다’라는 히브리어의 의도적으로 논쟁적인 표현을 유지하되, 각주의 긍정적 해석을 보존하는 것이 적절합니다.
  naturalness: ‘피 흘리기를 일삼는 자들’은 현대 표준어에서 살인·유혈을 일삼는 자들이라는 뜻을 분명히 하면서도 원문의 ‘피의 사람들’이라는 강한 이미지를 유지합니다. ‘그의 목숨을 찾습니다’는 다소 긴장된 직역이지만, 본문의 모호성을 보존하며 각주와 함께 기능합니다.
