  source_fidelity: 히브리어의 시간적 부정사구 בִּרְבוֹת과 וּבִמְשֹׁל을 각각 ‘의인들이 많아지면’과 ‘악인이 다스리면’으로 자연스럽고 정확하게 옮겼습니다. צַדִּיקִים의 복수와 רָשָׁע의 단수 대조, 그리고 יֵאָנַח의 고통스러운 신음의 뜻도 보존됩니다.
  naturalness: ‘의인들이 많아지면 백성이 기뻐하고, 악인이 다스리면 백성이 신음합니다’는 현대 표준 한국어로 자연스럽고, 잠언의 간결한 대구적 문체와 합쇼체 종결을 잘 유지합니다.
  terminology: ‘의인’, ‘악인’, ‘백성’은 한국어 성경 문맥에서 안정적이면서도 과도하게 교파적인 표현이 아닙니다. ‘신음합니다’는 악한 통치 아래의 고통을 적절히 전달합니다.
