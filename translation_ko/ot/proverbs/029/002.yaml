id: PRO.29.2
reference: Proverbs 29:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/רְב֣וֹת צַ֭דִּיקִים יִשְׂמַ֣ח הָ/עָ֑ם וּ/בִ/מְשֹׁ֥ל רָ֝שָׁ֗ע יֵאָ֥נַֽח עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
  footnotes:
  - marker: a
    text: Or 'When the righteous are many, the people rejoice.' The Hebrew infinitive construction can emphasize either increase or multiplicity.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들이 많아지면 백성이 기뻐하고, 악인이 다스리면 백성이 신음합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְבוֹת
  english_pob_choice: when the righteous increase
  chosen_korean: 의인들이 많아지면
  alternatives_korean:
  - 의인들이 증가하면
  - 의인들이 늘어나면
  - 의인들이 많을 때
  lexicon: HALOT
  rationale: ב + 부정사구가 여기서는 시간적 조건을 이루므로, 한국어에서는 자연스러운 조건형 ‘-면’으로 풀어 ‘증가/증가할 때’의 의미를 살렸습니다. ‘많아지면’은 증가와 다수라는 뉘앙스를 함께 담습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 자들
  - 의인
  lexicon: HALOT
  rationale: 복수의 형용사 명사 용법이므로 집단성을 살려 ‘의인들’로 옮겼습니다. 전통적 교회어 ‘의인’보다 복수성이 분명합니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 한 악한 사람
  lexicon: HALOT
  rationale: 문맥상 통치자 한 사람을 가리키지만, 한국어 속담체에서는 ‘악인’이 간결하고 대조도 선명합니다. 성별을 굳이 드러내는 표현은 원문의 초점이 아니라서 피했습니다.
- source_word: יֵאָנַח
  english_pob_choice: groan
  chosen_korean: 신음합니다
  alternatives_korean:
  - 탄식합니다
  - 한숨 쉽니다
  - 신음합니다
  lexicon: HALOT
  rationale: אנח의 고통스러운 신음이라는 뜻을 살려 ‘신음합니다’로 옮겼습니다. ‘탄식합니다’보다 육체적·사회적 압박의 무게가 더 직접적으로 드러납니다.
