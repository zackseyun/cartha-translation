  chosen_korean: 길
  alternatives_korean:
  - 행실
  - 삶의 길
  - 삶
  lexicon: HALOT
  rationale: דָּרֶךְ의 기본 이미지를 유지하기 위해 ‘길’을 택했고, 한국어에서도 도덕적 삶의 방식을 가리키는 표준적인 표현입니다.
theological_decisions:
- issue: 대구 구조에서 ‘의인/악인’의 대칭 유지
  chosen_reading: 첫째 행은 ‘의인’, 둘째 행은 ‘악인’으로 대응시켜 히브리어의 도덕적 대조를 분명하게 보존했습니다.
  alternative_readings:
  - 의로운 사람 / 악한 사람
  - 의인에게 / 악인에게
  rationale: 잠언 29:27은 두 집단의 상호 반감을 대칭적으로 제시하므로, 한국어에서도 같은 범주의 대조를 드러내는 표현이 가장 분명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 2
