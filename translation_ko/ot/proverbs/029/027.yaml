source:
  edition: WLC
  text: תּוֹעֲבַ֣ת צַ֭דִּיקִים אִ֣ישׁ עָ֑וֶל וְ/תוֹעֲבַ֖ת רָשָׁ֣ע יְשַׁר דָּֽרֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
  footnotes:
  - marker: a
    text: Or 'detestable to' / 'abhorrent to' for 'an abomination to.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'upright of way,' that is, one whose conduct is upright.
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 사람은 의인에게는 혐오스러운 존재이며, 그 길이 바른 사람은 악인에게는 혐오스러운 존재입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘바른 길’은 곧 바른 행실을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혐오스러운 존재’는 כאן תּוֹעֲבַת의 강한 도덕적 혐오를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination to
  chosen_korean: 혐오스러운 존재
  alternatives_korean:
  - 가증스러운 존재
  - 역겨운 존재
  - 혐오 대상
  lexicon: HALOT
  rationale: 히브리어 תּוֹעֲבַת는 강한 도덕적 혐오를 나타내므로, ‘혐오스러운 존재’로 옮겨 단순한 불쾌감보다 더 강한 평가를 살렸습니다.
- source_word: אִישׁ עָוֶל
  english_pob_choice: an unjust man
  chosen_korean: 불의한 사람
  alternatives_korean:
  - 부정한 사람
  - 불공정한 사람
  - 불의한 자
  lexicon: HALOT
  rationale: אִישׁ עָוֶל은 ‘불의/부정의에 속한 사람’이라는 성격 묘사이므로, 현대 한국어에서 자연스러운 ‘불의한 사람’으로 옮겼습니다.
- source_word: יְשַׁר דָּרֶךְ
  english_pob_choice: one whose way is upright
  chosen_korean: 그 길이 바른 사람
  alternatives_korean:
  - 행실이 바른 사람
  - 그 행실이 바른 사람
  - 바른 길의 사람
  lexicon: HALOT
  rationale: 직역상 ‘바른 길’이지만, 지혜문학의 관용구로서 삶의 행실을 뜻하므로 ‘그 길이 바른 사람’으로 이미지와 의미를 함께 살렸습니다.
- source_word: דָּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 행실
  - 삶의 길
  - 삶
  lexicon: HALOT
  rationale: דָּרֶךְ의 기본 이미지를 유지하기 위해 ‘길’을 택했고, 한국어에서도 도덕적 삶의 방식을 가리키는 표준적인 표현입니다.
theological_decisions:
- issue: 대구 구조에서 ‘의인/악인’의 대칭 유지
  chosen_reading: 첫째 행은 ‘의인’, 둘째 행은 ‘악인’으로 대응시켜 히브리어의 도덕적 대조를 분명하게 보존했습니다.
  alternative_readings:
  - 의로운 사람 / 악한 사람
  - 의인에게 / 악인에게
  rationale: 잠언 29:27은 두 집단의 상호 반감을 대칭적으로 제시하므로, 한국어에서도 같은 범주의 대조를 드러내는 표현이 가장 분명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 2
