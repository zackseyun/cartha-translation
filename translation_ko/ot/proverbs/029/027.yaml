  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
  footnotes:
  - marker: a
    text: Or 'detestable to' / 'abhorrent to' for 'an abomination to.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'upright of way,' that is, one whose conduct is upright.
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 사람은 의인에게 가증스러운 자이며, 길이 바른 사람[a]은 악인에게 가증스러운 자입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘길이 바른 사람’이며, 바른 행실을 지닌 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가증스러운 자’는 히브리어 תּוֹעֲבַת의 강한 도덕적 혐오와 배척의 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination to
  chosen_korean: 혐오스러운 존재
  alternatives_korean:
