  rationale: 직역상 ‘바른 길’이지만, 지혜문학의 관용구로서 삶의 행실을 뜻하므로 ‘그 길이 바른 사람’으로 이미지와 의미를 함께 살렸습니다.
- source_word: דָּרֶךְ
