  rationale: 본문을 히브리어의 분사적 주어 구조에 맞추어 격언으로 다듬고, בֶּאֱמֶת가 재판의 기준·방식을 나타낸다는 점을 분명히 했습니다. 각주는 진실, 성실, 공정이라는 어휘적 가능성을 보존하며 어느 한 해석으로 좁히지 않습니다.
