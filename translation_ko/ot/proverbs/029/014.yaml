id: PRO.29.14
reference: Proverbs 29:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֶ֤לֶךְ שׁוֹפֵ֣ט בֶּֽ/אֱמֶ֣ת דַּלִּ֑ים כִּ֝סְא֗/וֹ לָ/עַ֥ד יִכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
  footnotes:
  - marker: a
    text: Or 'judges the poor faithfully,' or 'judges the poor justly.' The Hebrew phrase 'with truth' can carry the sense of truthfulness, faithfulness, or justice in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 가난한 자를 진실로 재판하면 그의 왕좌는 영원히 견고해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진실로’는 ‘성실하게’ 또는 ‘공정하게’의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: A king
  chosen_korean: 왕이
  alternatives_korean:
  - 한 왕이
  - 어떤 왕이
  - 왕은
  lexicon: HALOT
  rationale: 잠언의 일반 원리를 나타내므로 특정 왕이 아니라 보편적 주어로 옮겼습니다. 한국어에서는 관사 없이 ‘왕이’로 시작하면 일반적 진술이 자연스럽습니다.
- source_word: שׁוֹפֵט
  english_pob_choice: who judges
  chosen_korean: 재판하면
  alternatives_korean:
  - 판단하면
  - 심판하면
  - 다스리면
  lexicon: HALOT
  rationale: 문맥이 통치 일반보다 사법 판단에 가깝기 때문에 ‘재판하다’를 택했습니다. ‘재판하면’은 분사적 수식과 결과 절을 한국어에서 간결하게 살립니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: with truth
  chosen_korean: 진실로
  alternatives_korean:
  - 성실하게
  - 공정하게
  - 참으로
  lexicon: HALOT
  rationale: אֱמֶת의 진리/성실/정의의 중첩 의미를 지나치게 좁히지 않으면서, 재판 행위에 자연스럽게 붙는 부사로 ‘진실로’를 선택했습니다. 이는 원문의 핵심 어휘 ‘truth’와의 연결도 유지합니다.
- source_word: דַּלִּים
  english_pob_choice: the poor
  chosen_korean: 가난한 자를
  alternatives_korean:
  - 궁핍한 자를
  - 약한 자를
  - 빈곤한 자를
  lexicon: HALOT
  rationale: 지위가 낮고 취약한 사람들을 가리키는 말로, 잠언의 왕의 정의로운 판결 문맥에서는 ‘가난한 자’가 가장 표준적이고 분명합니다.
- source_word: כִּסְאוֹ
  english_pob_choice: his throne
  chosen_korean: 그의 왕좌는
  alternatives_korean:
  - 그의 보좌는
  - 그의 왕위는
  - 그의 자리는
  lexicon: HALOT
  rationale: 히브리어의 구체적 왕권 이미지를 살리기 위해 ‘왕좌’를 택했습니다. ‘왕위’보다 형상성이 강해 원문의 왕권-왕좌 은유를 더 직접적으로 전달합니다.
- source_word: יִכּוֹן
  english_pob_choice: will be established
  chosen_korean: 견고해집니다
  alternatives_korean:
  - 세워집니다
  - 확립됩니다
  - 튼튼해집니다
  lexicon: HALOT
  rationale: נכון의 ‘세워지다/확립되다/견고해지다’ 의미를 한국어에서 자연스럽게 풀었습니다. 왕좌의 안정성을 강조하는 문맥에 맞게 결과 상태를 드러냅니다.
theological_decisions:
- issue: לָעַד의 지속 기간
  chosen_reading: ‘영원히’로 옮기되, 잠언의 격언적 표현으로서 지속성과 안정성을 말하는 것으로 읽었습니다.
  alternative_readings:
  - ‘오랫동안’으로 완화
  - ‘늘’로 일반화
  rationale: 원문의 강한 지속 표현을 약화하지 않되, 지혜문학의 격언성 안에서 절대론적 보증으로 오독하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense without importing doctrinal claims the text does not make.'
