translation:
  language: ko
  text: 당신은 말을 성급하게 하는 사람을 보십니까? 그 사람보다 어리석은 자에게 희망이 더 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십니까’는 히브리어 완료형을 현재의 수사적 질문으로 옮긴 것입니다. ‘보셨습니까’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזִיתָ
  english_pob_choice: Do you see
  chosen_korean: 보십니까
  alternatives_korean:
  - 보셨습니까
  - 보느냐
  lexicon: HALOT
  rationale: 지혜문학의 수사적 관찰을 한국어에서 자연스러운 현재형 질문으로 살리되, 2인칭 직접 호소의 힘을 유지했습니다.
- source_word: אָץ
  english_pob_choice: hasty
  chosen_korean: 성급한
  alternatives_korean:
  - 서두르는
  - 경솔한
  - 급한
  lexicon: HALOT
  rationale: 말과 연결된 성급함을 드러내면서도, 단순한 속도보다 판단과 발화의 조급함을 함께 담는 표현으로 옮겼습니다.
- source_word: בִּדְבָרָיו
  english_pob_choice: in his words
  chosen_korean: 말에
  alternatives_korean:
  - 말 속에
  - 그의 말에
  - 그가 하는 말에
  lexicon: HALOT
  rationale: 히브리어의 ‘그의 말들 안에서’라는 직설적 이미지를 유지하면서 한국어로는 가장 간결하고 자연스럽게 정리했습니다.
- source_word: כְסִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 사람
  - 우둔한 자
  - 바보
  lexicon: HALOT
  rationale: 잠언의 기술어로서 윤리적·지적 둔함을 함께 담되, 현대 공적 문체에서 지나치게 구어적이거나 조롱적으로 들릴 수 있는 ‘바보’를 피했습니다.
theological_decisions:
- issue: 비교 구문의 압축성
  chosen_reading: ‘그보다 … 희망이 있습니다’로 옮겨, 히브리어의 ‘그에게서보다’라는 비교를 한국어에서 명확하게 풀었습니다.
  alternative_readings:
  - ‘그에게보다 더 희망이 있습니다’
  - ‘그 사람보다 어리석은 자에게 희망이 더 있습니다’
  rationale: 원문은 성급한 사람에 대한 희망이 다른 대상보다 적다는 비교를 짧게 제시하므로, 한국어에서도 의미 관계가 즉시 드러나도록 했습니다.
  doctrine_reference: 잠언의 지혜 비교법
- issue: 수사적 질문 유지
  chosen_reading: 첫 절반을 선언문이 아니라 질문으로 유지했습니다.
  alternative_readings:
  - ‘당신은 말에 성급한 사람을 보셨습니다’
  - ‘말에 성급한 사람을 보라’
  rationale: 히브리어 완료형은 단순 과거보다 관찰을 촉구하는 수사적 질문으로 기능하므로, 독자의 주의를 깨우는 형식을 보존했습니다.
  doctrine_reference: 지혜문학의 수사적 관찰
