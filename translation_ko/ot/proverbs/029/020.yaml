    issue: ‘말에 성급한’은 히브리어의 발화 방식에 관한 수식을 충분히 명료하게 전달하지 못합니다.
    rationale: בִּדְבָרָיו는 ‘그의 말에서/말할 때’라는 범위를 나타냅니다. ‘말을 성급하게 하는’으로 옮기면 성급함이 말하는 행위에 관련됨을 자연스럽게 드러냅니다.
  - severity: medium
    issue: 비교 구문에 ‘더’가 빠져 있습니다.
