  source_fidelity: 첫 행의 בְּפֶשַׁע는 악한 사람의 범죄와 올무의 연관을 간결하게 표현하며, ‘범죄에는 올무가’는 그 위치적/결과적 관계를 보존합니다. יָרוּן은 노래 자체보다 기쁨의 소리·환호를 가리킬 수 있으므로, 본문에서는 ‘환호하며’가 더 직접적입니다.
