  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
  footnotes:
  - marker: a
    text: Or 'A man of many reproofs, hardening his neck, will suddenly be broken, and there will be no remedy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 책망을 받은 사람이라도 목을 곧게 세우면, 갑자기 부서져 치유되지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 책망을 받은 사람, 목을 곧게 세우는 사람은 갑자기 부서져 고칠 길이 없게 된다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 사람 한 명
  lexicon: HALOT
  rationale: 속담체에서 대표적 개인을 가리키는 단수형이므로, 성별을 과도하게 드러내지 않으면서도 자연스러운 한국어로 ‘사람’이라고 옮겼습니다.
- source_word: תּוֹכָחוֹת
  english_pob_choice: often reproved
  chosen_korean: 많은 책망을 받은
  alternatives_korean:
  - 자주 책망받은
  - 여러 차례 책망을 받은
  - 많은 꾸지람을 받은
  lexicon: HALOT
  rationale: 복수형 명사는 반복적 책망을 뜻하므로, 영어 POB의 ‘often reproved’에 맞추어 누적된 책망을 드러내는 표현으로 옮겼습니다.
- source_word: מַקְשֶׁה עֹרֶף
  english_pob_choice: who stiffens his neck
  chosen_korean: 목을 곧게 세우면
  alternatives_korean:
  - 목을 뻣뻣하게 하면
  - 목을 굳게 하면
  - 고집을 부리면
  lexicon: HALOT
  rationale: ‘목’의 몸짓 은유를 살리되 한국어에서 자연스럽게 들리도록 했습니다. ‘곧게 세우다’는 완고한 저항의 자세를 직관적으로 전달합니다.
- source_word: וְאֵין מַרְפֵּא
  english_pob_choice: beyond healing
  chosen_korean: 치유되지 못합니다
  alternatives_korean:
  - 고칠 길이 없습니다
  - 치유할 수 없습니다
  - 회복될 수 없습니다
  lexicon: HALOT
  rationale: 직역하면 ‘치유/치료가 없다’이므로, 결론의 최종성을 살리면서 현대 한국어로 자연스러운 ‘치유되지 못합니다’로 옮겼습니다.
