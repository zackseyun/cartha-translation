source:
  edition: WLC
  text: מְפַנֵּ֣ק מִ/נֹּ֣עַר עַבְדּ֑/וֹ וְ֝/אַחֲרִית֗/וֹ יִהְיֶ֥ה מָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/021.yaml
  text: Whoever pampers his slave from youth[a], in the end he will become a son.
  footnotes:
  - marker: a
    text: Hebrew מָנוֹן is uncertain. It has also been understood as 'a son' or 'one acting like a son,' yielding the sense that an indulged slave may presume on filial status; others take it more generally as 'trouble' or 'insubordination.'
    reason: alternative_reading
translation:
  language: ko
  text: 누구든지 자기 종을 어릴 때부터 응석받이로 기르면, 마침내 그 종은 아들이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מָנוֹן은 뜻이 분명하지 않습니다. 이를 ‘아들’ 또는 ‘아들처럼 행동하는 자’로 이해하여, 지나치게 응석받이로 길러진 종이 아들 같은 지위를 요구하거나 아들처럼 행세하게 된다는 뜻으로 보기도 합니다. 다른 이들은 이를 더 일반적으로 ‘문제’나 ‘반항’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  english_pob_choice: pampers
  chosen_korean: 지나치게 감싸면
  alternatives_korean:
  - 버릇없이 키우면
  - 응석받이로 대하면
  - 귀하게만 대하면
  lexicon: HALOT
  rationale: פנק의 뜻은 지나치게 부드럽고 편하게 대하는 것이므로, 한국어에서는 ‘지나치게 감싸다’로 그 부정적 뉘앙스를 자연스럽게 살렸습니다.
- source_word: מִנֹּעַר
  english_pob_choice: from youth
  chosen_korean: 어려서부터
  alternatives_korean:
  - 젊어서부터
  - 어린 시절부터
  lexicon: HALOT
  rationale: 초기부터라는 시간 표시를 한국어 관용에 맞게 ‘어려서부터’로 옮겼습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his slave
  chosen_korean: 자기 종
  alternatives_korean:
  - 자기 노예
  - 자기 하인
  lexicon: HALOT
  rationale: POB 영어는 slave를 택했지만, 한국어에서는 직역 ‘노예’가 현재 문맥에서 과도하게 현대적 충격을 줄 수 있어, 주종 관계를 유지하는 범위에서 ‘종’으로 옮겼습니다. 소유대명사도 ‘자기’로 자연스럽게 반영했습니다.
- source_word: מָנֽוֹן
  english_pob_choice: he will become a son
  chosen_korean: 아들이 될 것입니다
  alternatives_korean:
  - 아들처럼 될 것입니다
  - 아들 노릇을 하게 될 것입니다
  - 문제가 될 것입니다
  lexicon: HALOT
  rationale: 이 어휘는 난해하고 해석이 갈리므로, POB의 채택을 따라 본문 의미를 드러내는 직역 쪽인 ‘아들이 될 것입니다’를 본문에 두었습니다.
theological_decisions:
- issue: מָנוֹן의 난해한 의미를 본문에 어떻게 반영할지
  chosen_reading: 본문에는 ‘아들이 될 것입니다’로 두고, 난해한 대안 해석은 각주에서 설명합니다.
  alternative_readings:
  - ‘문제가 될 것입니다’
  - ‘아들처럼 굴게 될 것입니다’
  - ‘불손한 자가 될 것입니다’
  rationale: 히브리어가 불확실하므로 단정적 의역으로 닫기보다, 본문은 POB의 선택을 따르되 각주로 의미의 긴장을 보존하는 편이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 잠언의 경구적 문맥과 본문 비평상의 난해 어휘 처리
