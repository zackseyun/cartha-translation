    text: 또는 '맹세' 또는 '엄숙한 맹세의 요구'. 히브리어 낱말은 저주를 수반하는 맹세나 엄숙한 요구를 가리킬 수 있으며, 증인이 알고 있는 일을 말하도록 요구받는 법적 상황을 암시할 수 있습니다.
