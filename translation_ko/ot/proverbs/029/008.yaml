  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַנְשֵׁ֣י לָ֭צוֹן יָפִ֣יחוּ קִרְיָ֑ה וַ֝/חֲכָמִ֗ים יָשִׁ֥יבוּ אָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
  footnotes:
  - marker: a
    text: Or 'Mockers set a city ablaze'; the Hebrew verb is metaphorical and can evoke kindling or stirring up civic turmoil.
    reason: lexical_alternative
  - marker: b
    text: Or 'the wise' instead of 'wise men'; the Hebrew is masculine plural.
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 사람들은 성읍을 들끓게 하지만, 지혜로운 사람들은 분노를 가라앉힙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들끓게 하다’는 히브리어 동사의 비유적 의미를 살린 번역으로, 문자적으로는 ‘불붙이다/태우다’의 이미지를 함축합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지혜로운 사람들’은 히브리어 복수 남성형을 자연스럽게 옮긴 표현입니다. 원문은 성별보다 인물 유형을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  english_pob_choice: Mockers
  chosen_korean: 조롱하는 사람들
  alternatives_korean:
  - 비웃는 자들
  - 조롱꾼들
  - 희롱하는 사람들
  lexicon: HALOT
  rationale: 구문상 ‘조롱의 사람들’에 해당하지만, 현대 한국어에서는 ‘조롱하는 사람들’이 인물 유형을 자연스럽게 드러내면서도 경멸적 성격을 유지합니다.
- source_word: יָפִיחוּ
  english_pob_choice: inflame
  chosen_korean: 들끓게 하지만
  alternatives_korean:
  - 불타게 하지만
  - 격동시키지만
  - 달아오르게 하지만
  lexicon: HALOT
  rationale: 동사의 비유적 의미가 도시의 소요와 긴장을 일으키는 데 있으므로, 물리적 ‘불붙이다’보다 공동체가 소란해지는 이미지를 담은 ‘들끓게 하다’가 적절합니다.
- source_word: חֲכָמִים
  english_pob_choice: wise men
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜로운 자들
  - 지혜자들
  - 현명한 사람들
  lexicon: HALOT
  rationale: 히브리어 복수 남성형을 과도하게 성별화하지 않으면서도, 속담체에 맞는 자연스러운 한국어로 옮기기 위해 ‘지혜로운 사람들’을 선택했습니다.
- source_word: יָשִׁיבוּ אָף
  english_pob_choice: turn away anger
  chosen_korean: 분노를 가라앉힙니다
  alternatives_korean:
  - 분노를 돌이킵니다
  - 진노를 누그러뜨립니다
  - 화를 돌이킵니다
  lexicon: HALOT
  rationale: ‘돌이키다/되돌리다’의 동작 이미지는 유지하되, אָף가 가리키는 감정의 상태를 한국어 속담 표현에 맞게 ‘가라앉히다’로 풀어 자연스럽고 명료하게 했습니다.
theological_decisions:
- issue: 속담의 병렬 구조와 인과 대비
  chosen_reading: 조롱하는 사람들은 공동체를 소란하게 만들고, 지혜로운 사람들은 분노를 잠재웁니다.
  alternative_readings:
  - 조롱하는 사람들은 성읍을 불태웁니다
  - 지혜로운 사람들은 화를 돌이킵니다
  rationale: 히브리어는 도시와 분노의 대비를 통해 공동체적 결과를 제시하므로, 단순 감정 조절이 아니라 사회적 평화를 회복하는 의미가 드러나도록 옮겼습니다.
  doctrine_reference: '잠언의 지혜 문학 일반: 말과 태도가 공동체 질서를 세우거나 무너뜨림'
