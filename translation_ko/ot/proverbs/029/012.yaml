  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֹ֭שֵׁל מַקְשִׁ֣יב עַל דְּבַר שָׁ֑קֶר כָּֽל מְשָׁרְתָ֥י/ו רְשָׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: ko
  text: 통치자가 거짓말을 듣기만 하면 그의 모든 신하가 악해집니다.
  philosophy: formal
lexical_decisions:
- source_word: מֹשֵׁל
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지배자
  - 군주
  - 임금
  lexicon: רָשָׁה / מָשַׁל 계열
  rationale: 권력을 가진 통치자를 가리키는 일반 명사로 옮겨, 원문의 통치 권위와 지배적 위치를 분명히 했습니다.
- source_word: מַקְשִׁיב עַל דְּבַר שָׁקֶר
  english_pob_choice: listens to a lying word
  chosen_korean: 거짓말을 듣기만 하면
  alternatives_korean:
  - 거짓된 말을 귀 기울여 들으면
  - 거짓말에 귀를 기울이면
  lexicon: שֶׁקֶר
  rationale: 원문의 ‘거짓’과 ‘들음’의 결합을 자연스러운 한국어로 살리되, 단순 청취가 아니라 수용/경청의 뉘앙스를 유지했습니다.
- source_word: מְשָׁרְתָי/ו
  english_pob_choice: his servants
  chosen_korean: 그의 모든 신하
  alternatives_korean:
  - 그의 모든 종들
  - 그의 모든 종사자들
  lexicon: מְשָׁרֵת
  rationale: 궁정·행정 맥락에서 통치자에게 속한 신하들을 가리키므로, 현대 독자가 이해하기 쉬운 ‘신하’로 옮겼습니다.
- source_word: רְשָׁעִים
  english_pob_choice: become wicked
  chosen_korean: 악해집니다
  alternatives_korean:
  - 악인이 됩니다
  - 악한 자가 됩니다
  lexicon: רָשָׁע
  rationale: 마지막 술어는 상태 변화로 제시되므로, POB의 ‘become’를 반영해 ‘악해집니다’로 번역했습니다.
theological_decisions:
- issue: 마지막 동사의 상태 변화
  chosen_reading: ‘악합니다’가 아니라 ‘악해집니다’로 옮겨, 통치자의 경청이 신하들을 그 방향으로 변화시키는 결과를 드러냈습니다.
  alternative_readings:
  - 그의 모든 신하가 악합니다
  - 그의 모든 신하가 악인이 됩니다
  rationale: 영어 POB의 개정 의도와 히브리어 어형이 모두 결과적 변화의 뉘앙스를 지지하므로, 도덕적 상태의 ‘변화’를 명시했습니다.
  doctrine_reference: 지혜문학의 인과 진술
