  text: אִֽישׁ אַ֭ף יְגָרֶ֣ה מָד֑וֹן וּ/בַ֖עַל חֵמָ֣ה רַב פָּֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a man of anger ... and a master of wrath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'multiplies transgression.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분노한 사람은 다툼을 일으키고, 성미 급한 사람은 죄과를 많이 범합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אַף
  english_pob_choice: an angry man
  chosen_korean: 분노한 사람
  alternatives_korean:
  - 화가 난 사람
  - 성내는 사람
  - 분노의 사람
  lexicon: HALOT
  rationale: 히브리어는 ‘분노의 사람’에 가까운 성격 규정이므로, 현대 한국어에서는 자연스럽게 ‘분노한 사람’으로 옮겨 인격적 성향을 살렸습니다.
- source_word: יְגָרֶה מָדוֹן
  english_pob_choice: stirs up strife
  chosen_korean: 다툼을 일으키고
  alternatives_korean:
  - 분쟁을 부추기고
  - 논쟁을 불러일으키고
  - 다툼을 자극하고
  lexicon: HALOT
  rationale: 동사는 ‘일으키다/부추기다’의 의미를 가지며, ‘다툼’은 지혜문학의 מָדוֹן을 간결하고 자연스럽게 반영합니다.
- source_word: בַעַל חֵמָה
  english_pob_choice: a hot-tempered man
  chosen_korean: 성미 급한 사람
  alternatives_korean:
  - 분노의 사람
  - 격한 성격의 사람
  - 노를 잘 내는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘격노의 주인/소유자’이지만, 지속적인 성향을 드러내는 관용적 표현이므로 ‘성미 급한 사람’이 문맥상 가장 자연스럽습니다.
- source_word: רַב פָּשַׁע
  english_pob_choice: abounds in transgression
  chosen_korean: 죄과를 많이 범합니다
  alternatives_korean:
  - 죄과가 많습니다
  - 범죄를 많이 저지릅니다
  - 허물을 많이 쌓습니다
  lexicon: HALOT
  rationale: ‘많다’의 서술적 용법과 פָּשַׁע의 도덕적 무게를 살리되, 한국어에서 어색한 ‘넘친다’보다 ‘많이 범합니다’가 의미를 분명히 전달합니다.
