theological_decisions:
- issue: ‘나라’의 범위
  chosen_reading: 보편적 잠언 진술로서 특정 국가가 아니라 통치 아래 있는 ‘나라/국가’를 가리키는 일반적 의미로 읽었습니다.
  alternative_readings:
  - ‘땅’으로 직역
  - ‘세상’으로 확대 해석
  rationale: 히브리어 אֶרֶץ는 여기서 왕의 통치 대상인 공동체/영역을 뜻하는 일반적 용례가 적절하므로, 과도한 확대나 축소 없이 ‘나라’로 번역했습니다.
  doctrine_reference: 잠언의 일반 교훈 문맥
