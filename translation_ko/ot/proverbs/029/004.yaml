  source_fidelity: 핵심 대조(공정한 통치가 나라를 세움 / 부패한 금품과 관련된 사람이 나라를 무너뜨림)는 잘 반영되었습니다. 다만 אִישׁ תְּרוּמוֹת를 직역한 듯한 ‘뇌물의 사람’은 한국어에서 의미 관계가 불명확합니다. 문맥상 뇌물을 받거나 요구하는 부패한 자를 가리키므로 ‘뇌물을 받는 자’가 안전하고 분명합니다.
