- from: 의로 왕은 나라를 견고하게 세우지만, 뇌물의 사람은 그것을 허물어뜨립니다.[a][b]
  to: 왕은 정의로 나라를 견고히 세우지만, 뇌물을 받는 자는 그것을 무너뜨립니다.[a][b]
  rationale: 본문의 통치와 붕괴라는 대조 및 ‘나라’의 일반적 의미는 유지했습니다. 한국어에서 어색한 ‘뇌물의 사람’을 문맥상 분명한 ‘뇌물을 받는 자’로 고치고, מִשְׁפָּט의 공적 정의 의미와 현대 합쇼체의 자연스러움을 위해 ‘정의로’, ‘무너뜨립니다’를 사용했습니다. תְּרוּמוֹת의 다른 가능한 의미는 각주에 남겨 어휘적 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:06Z'
