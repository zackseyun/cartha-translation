  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
  footnotes:
  - marker: a
    text: Or 'a man of contributions/gifts'; the Hebrew term can denote offerings or levies, but in this context it likely refers to corrupt payments, hence 'bribes.'
    reason: lexical_alternative
  - marker: b
