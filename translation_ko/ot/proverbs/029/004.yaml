translation:
  language: ko
  text: 의로 왕은 나라를 견고하게 세우지만, 뇌물의 사람은 그것을 허물어뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ은 여기서 특정 남성 개인보다 대표적·일반적 의미의 ‘사람’을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: תְּרוּמוֹת은 보통 ‘헌물/기여물’을 뜻할 수 있지만, 이 문맥에서는 부패한 금품 곧 ‘뇌물’로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
