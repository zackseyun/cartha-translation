- source_word: תְּרוּמוֹת
  english_pob_choice: of bribes
  chosen_korean: 뇌물의
  alternatives_korean:
  - 공물의
  - 기증물의
  - 헌물의
  lexicon: HALOT
  rationale: 문맥상 통치자를 무너뜨리는 부패한 금품을 가리키므로, 일반적 ‘헌물/공물’보다 의미를 분명히 드러내는 ‘뇌물의’로 옮겼습니다.
- source_word: יַעֲמִיד ... יֶהֶרְסֶנָּה
  english_pob_choice: establishes ... tears it down
  chosen_korean: 견고하게 세우다 ... 허물어뜨리다
  alternatives_korean:
  - 세우다 ... 무너뜨리다
  - 존립하게 하다 ... 파괴하다
  lexicon: HALOT
  rationale: 히필 ‘세우다’와 הרס의 ‘허물다’라는 구체적 대비를 살리되, 한국어로는 통치의 안정성과 붕괴를 자연스럽게 드러내는 동사구로 정리했습니다.
theological_decisions:
- issue: ‘나라’의 범위
  chosen_reading: 보편적 잠언 진술로서 특정 국가가 아니라 통치 아래 있는 ‘나라/국가’를 가리키는 일반적 의미로 읽었습니다.
  alternative_readings:
  - ‘땅’으로 직역
  - ‘세상’으로 확대 해석
  rationale: 히브리어 אֶרֶץ는 여기서 왕의 통치 대상인 공동체/영역을 뜻하는 일반적 용례가 적절하므로, 과도한 확대나 축소 없이 ‘나라’로 번역했습니다.
  doctrine_reference: 잠언의 일반 교훈 문맥
