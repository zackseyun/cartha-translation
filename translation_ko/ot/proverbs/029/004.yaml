  text: מֶ֗לֶךְ בְּ֭/מִשְׁפָּט יַעֲמִ֣יד אָ֑רֶץ וְ/אִ֖ישׁ תְּרוּמ֣וֹת יֶֽהֶרְסֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
  footnotes:
  - marker: a
    text: Or 'a man of contributions/gifts'; the Hebrew term can denote offerings or levies, but in this context it likely refers to corrupt payments, hence 'bribes.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man,' used here in a representative or generic sense.
    reason: cultural_note
translation:
  language: ko
  text: 왕은 정의로 나라를 견고히 세우지만, 뇌물을 받는 자는 그것을 무너뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ은 여기서 특정 남성 개인보다 대표적·일반적 의미의 ‘사람’을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: תְּרוּמוֹת은 보통 ‘헌물’, ‘기여물’ 또는 ‘부과금’을 뜻할 수 있지만, 이 문맥에서는 부패한 금품, 곧 ‘뇌물’을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: a king
  chosen_korean: 왕
  alternatives_korean:
  - 한 왕
  - 어떤 왕
  lexicon: HALOT
  rationale: 잠언의 일반적 진술이므로 특정 왕이 아니라 보편적 주체를 가리키는 ‘왕’으로 자연스럽게 옮겼습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: by justice
  chosen_korean: 의로
  alternatives_korean:
