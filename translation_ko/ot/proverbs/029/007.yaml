id: PRO.29.7
reference: Proverbs 29:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֹדֵ֣עַ צַ֭דִּיק דִּ֣ין דַּלִּ֑ים רָ֝שָׁ֗ע לֹא יָבִ֥ין דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
  footnotes:
  - marker: a
    text: Or 'A righteous man knows the rights/justice of the poor.' The Hebrew דִּין can mean 'case,' 'cause,' or 'justice.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply 'does not understand knowledge'; the translation 'such knowledge' makes explicit the implied connection to the previous clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 의로운 사람은 가난한 사람들의 사정을 압니다. 그러나 악한 사람은 지식을 깨닫지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דִּין은 ‘사건’, ‘사정’, ‘권리’, ‘정의’까지 넓게 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘지식을 깨닫지 못합니다’라고만 되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יֹדֵעַ
  english_pob_choice: knows
  chosen_korean: 압니다
  alternatives_korean:
  - 알고 있습니다
  - 깨닫습니다
  lexicon: HALOT
  rationale: ידע의 분사형은 기본적으로 ‘알다/알고 있다’의 의미이므로, 현대 한국어에서는 ‘압니다’가 가장 सीधे하고 자연스럽습니다. ‘깨닫다’는 인지의 깊이를 더해 원문의 기본 어감보다 해석적입니다.
- source_word: צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의인
  - 의로운 사람
  lexicon: HALOT
  rationale: 단수 형용사의 명사적 용법을 살리되, 한국어에서 ‘의인’보다 문장 흐름이 자연스러운 ‘의로운 사람’을 택했습니다. 이는 대표적 인물을 가리키는 잠언체의 일반화를 잘 드러냅니다.
- source_word: דִּין דַּלִּים
  english_pob_choice: the case of the poor
  chosen_korean: 가난한 사람들의 사정
  alternatives_korean:
  - 가난한 사람들의 경우
  - 가난한 사람들의 권리
  - 가난한 사람들의 재판 사안
  lexicon: HALOT
  rationale: דִּין은 ‘사건/사정/권리/소송’까지 넓을 수 있는데, כאן에서는 ‘가난한 사람들’과 결합해 그들의 실제 처지와 호소를 가리키는 뜻이 강하므로 ‘사정’이 가장 포괄적이고 한국어답습니다. ‘권리’로만 좁히면 법적 의미를 과도하게 한정할 수 있습니다.
- source_word: דָּעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 이해
  lexicon: HALOT
  rationale: 문장의 끝에서 דָּעַת은 추상명사로서 ‘지식’이 가장 직접적입니다. 영어 POB가 문제 삼은 연결어 ‘such’는 한국어에서 굳이 보충하지 않고, 원문의 짧은 대조를 살렸습니다.
theological_decisions:
- issue: 지혜문학의 도덕적 대조를 어떻게 살릴지
  chosen_reading: 의로운 사람과 악한 사람의 대조를 일반적 인간 유형으로 유지했습니다.
  alternative_readings:
  - ‘의인/악인’으로 교회적 용어를 고정하는 읽기
  - 사회윤리적으로만 풀어 ‘착한 사람/나쁜 사람’으로 약화하는 읽기
  rationale: 원문은 개인적·전형적 대비를 통해 지혜와 무지의 차이를 보여 주므로, 한국어에서도 도덕적 평가를 분명히 드러내되 교회적 전문용어로만 환원하지 않았습니다.
  doctrine_reference: 잠언의 지혜/어리석음 대조
