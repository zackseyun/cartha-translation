id: PRO.29.3
reference: Proverbs 29:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽישׁ אֹהֵ֣ב חָ֭כְמָה יְשַׂמַּ֣ח אָבִ֑י/ו וְ/רֹעֶ֥ה ז֝וֹנ֗וֹת יְאַבֶּד הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/003.yaml
  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
  footnotes:
  - marker: a
    text: Literally, 'one who shepherds/feeds with prostitutes'; the Hebrew idiom means associating with or frequenting them.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜를 사랑하는 사람은 아버지를 기쁘게 합니다. 그러나 창녀들과 어울리는 사람은 재산을 허비합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘창녀들과 함께 먹이듯 돌보는/치듯 하는 자’에 가깝지만, 관용구로는 그들과 어울리거나 빈번히 드나드는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: A man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 어떤 사람
  lexicon: HALOT
  rationale: 잠언의 대표적 일반 진술로서 성별을 드러내는 직역보다, 한국어에서 자연스럽고 보편적으로 읽히는 ‘사람’이 기능상 더 잘 대응합니다.
- source_word: אֹהֵב חָכְמָה
  english_pob_choice: who loves wisdom
  chosen_korean: 지혜를 사랑하는
  alternatives_korean:
  - 지혜를 사랑하는 사람
  - 지혜를 좋아하는
  lexicon: HALOT
  rationale: אָהֵב의 지속적 성향을 현재분사형 수식으로 살려 ‘지혜를 사랑하는’으로 옮겼고, חָכְמָה는 문맥상 ‘지혜’가 가장 직접적입니다.
- source_word: וְרֹעֶה זֹנוֹת
  english_pob_choice: one who keeps company with prostitutes
  chosen_korean: 창녀들과 어울리는
  alternatives_korean:
  - 매춘부들과 어울리는
  - 창녀들과 함께 지내는
  - 창녀들을 치는
  lexicon: HALOT
  rationale: רעה의 문자적 ‘치다/먹이다’보다 이 관용구의 뜻인 ‘교제하다, 어울리다’를 살려 읽히는 한국어로 옮겼습니다. זֹנוֹת은 사회적으로 직설적인 ‘창녀들’이 원문의 도덕적 대비를 가장 분명하게 드러냅니다.
- source_word: יְאַבֶּד הוֹן
  english_pob_choice: destroys wealth
  chosen_korean: 재산을 허비합니다
  alternatives_korean:
  - 재산을 망가뜨립니다
  - 재물을 파멸시킵니다
  - 부를 파괴합니다
  lexicon: HALOT
  rationale: הוֹן은 ‘재산/재물’의 뜻이며, 잠언의 경구적 문맥에서는 완전한 소멸보다 낭비·탕진의 결과를 강조하는 ‘허비하다’가 자연스럽습니다.
theological_decisions:
- issue: 잠언의 일반 진술을 성별 포괄적으로 옮길지 여부
  chosen_reading: 대표적 남성형 어휘를 한국어의 일반 인용어 ‘사람’으로 풀어 보편적 교훈을 살렸습니다.
  alternative_readings:
  - ‘남자’로 직역
  - ‘누구든지’로 일반화
  rationale: 히브리어 אִישׁ은 형식상 남성 단수지만 잠언의 격언적 문맥에서는 특정 남성만이 아니라 일반 원리를 제시합니다. 한국어에서 ‘사람’이 원문 기능을 가장 자연스럽게 전달합니다.
  doctrine_reference: 언어적·문맥적 일반화
- issue: ‘재산을 허비합니다’의 동사 선택
  chosen_reading: 파멸의 결과를 담되, 잠언의 실제 생활감각에 맞는 ‘허비하다’로 옮겼습니다.
  alternative_readings:
  - ‘파괴합니다’
  - ‘망하게 합니다’
  - ‘소멸시킵니다’
  rationale: 히브리어 יְאַבֶּד는 ‘멸하다/잃게 하다’의 강한 의미를 지니지만, 대상이 재산일 때는 도덕적·실용적 손실을 드러내는 ‘허비하다’가 의미를 덜 약화시키면서도 한국어로 더 자연스럽습니다.
  doctrine_reference: 경구체의 수사적 강도
