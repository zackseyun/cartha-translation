  to: 많은 사람이 통치자의 호의를 구하지만, 한 사람에게 내려질 공의로운 판결은 야훼에게서 나옵니다.
  rationale: ‘얼굴을 구하다’라는 히브리어 관용구는 한국어 관용 표현인 ‘호의를 구하다’로 옮겼습니다. 결행의 מִשְׁפַּט אִישׁ는 특정 해석 전통을 강요하지 않으면서도 개인에게 관련된 न्याय/판결이라는 뜻이 드러나도록 ‘한 사람에게 내려질 공의로운 판결’로 번역했습니다. 야훼라는 신명 표기와 원문의 인간 통치자 대 야훼의 대조는 유지했습니다.
