  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: ko
  text: 많은 사람이 통치자의 호의를 구하지만, 한 사람에게 내려질 공의로운 판결은 야훼에게서 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵי מוֹשֵׁל
  english_pob_choice: the face of a ruler
  chosen_korean: 통치자의 얼굴
  alternatives_korean:
  - 군주의 얼굴
  - 지도자의 얼굴
  - 통치자를 알현하려는 것
  lexicon: פָּנִים / פְּנֵי
  rationale: פְּנֵי를 단순히 ‘호의’로 돌리기보다, POB의 직역 흐름을 살려 ‘얼굴’로 옮겨 ‘찾는다’와 결합된 구체적 이미지를 보존했습니다.
- source_word: רַבִּים מְבַקְשִׁים
  english_pob_choice: Many seek
  chosen_korean: 많은 사람이 찾지만
  alternatives_korean:
  - 많은 사람이 구하지만
  - 많은 사람이 찾습니다
  lexicon: רַבִּים / מְבַקְשִׁים
  rationale: ‘seek’을 한국어의 자연스러운 ‘찾다’로 옮기되, 반복되는 탐색·청탁의 뉘앙스를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 본문의 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 직접 옮겨, 원문과의 대응을 분명히 했습니다.
- source_word: מִשְׁפַּט אִישׁ
  english_pob_choice: a man's justice
  chosen_korean: 사람의 정의
  alternatives_korean:
  - 한 사람의 न्याय
  - 한 사람의 권리
  - 사람에게서 오는 정의
  lexicon: מִשְׁפָּט
  rationale: 문맥상 משפט는 단순한 ‘재판’보다 사람에게 주어지는 올바른 판정/정의를 가리키므로 ‘정의’로 옮겼습니다.
theological_decisions:
- issue: 야훼와 통치자의 대비
  chosen_reading: 사람들은 통치자의 호의나 승인보다 권력 외부의 최종 판단을 야훼께서 주시는 것으로 이해해야 합니다.
  alternative_readings:
  - 통치자에게 인정받으려는 사회적 현실에 대한 관찰
  - 일반적 인생 원리로서의 정의의 출처 진술
  rationale: 본절은 인간 권력에 대한 의존과 하나님의 निर्ण정 권위를 대비하며, 정의의 근원이 야훼께 있음을 강조합니다.
  doctrine_reference: 하나님의 주권과 공의
