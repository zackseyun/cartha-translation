  text: 말씀으로만은 종이 교정되지 아니하나니, 그가 깨달을지라도 대답이 없음이라[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '종이는 말씀으로만은 교정되지 아니하나니.' 히브리어 עָבֶ드 (아베드) 는 문맥에 따라 종이나 노예를 가리킬 수 있으나, 여기서는 그 용어가 내포하는 종속된 상태를 보존하기 위해 '노예'로 번역하였다.
    reason: alternative_reading
  - marker: b
    text: 또는, '그가 깨달을지라도 대답이 없음이라.' 마지막 절은 말의 대답이 없음을 가리킬 수도 있고, 반응하는 행위가 없음을 가리킬 수도 있다.
    reason: alternative_reading
