  source_fidelity: 현 번역은 יוכיח(꾸짖다/책망하다)를 두 차례 모두 ‘징계하다’로 넓게 옮기고, 후반부의 압축된 비유 구문을 ‘기뻐하시는 아들’로 처리하여 누가 기뻐하는지 불분명합니다. 히브리어의 직접적인 책망 의미와 아버지-아들의 비유를 드러내는 편이 더 충실합니다.
  naturalness: ‘…하심이라’는 현대 표준 한국어 합쇼체에서 다소 고풍스럽고, ‘아버지처럼 징계하심’은 비교의 대상과 행위 주체가 불명료합니다. 완결된 합쇼체 문장으로 고치면 자연스럽습니다.
  terminology: יְהוָה는 프로젝트 관례에 따라 ‘여호와’로 유지할 수 있습니다. יוכיח는 이 절에서 ‘꾸짖으시다’로 옮기고, 더 넓은 ‘징계’는 각주 대안으로 제시하는 것이 적절합니다. ‘단속’은 이 문맥의 도덕적 교정 의미에 맞지 않아 제거해야 합니다.
