translation:
  language: ko
  text: 이는 여호와께서 사랑하시는 사람을 꾸짖으시고[a], 아버지가 기뻐하는 아들을 꾸짖듯 하시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교정하십니다’, ‘징계하십니다’. 히브리어 동사는 책망하거나 바로잡는다는 뜻을 강조하며, 문맥에서는 더 넓은 훈육의 주제와도 관련됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그리고 아버지가 기뻐하는 아들처럼’입니다. 히브리어는 앞선 ‘꾸짖으시다’를 이 비유절에도 이해하게 하는 압축된 표현입니다.
    reason: alternative_reading
