source:
  edition: WLC
  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
  footnotes:
  - marker: a
    text: Or 'mercy and truth.' The Hebrew pair often denotes covenant loyalty and reliability; here rendered 'steadfast love and faithfulness' to reflect that sense in contemporary English.
    reason: lexical_alternative
translation:
  language: ko
  text: 사랑과 진실이 당신을 떠나지 않게 하십시오[a]. 그것들을 목에 매어 두고, 마음의 판에 새기십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인애와 진리’. 히브리어의 이 짝은 흔히 언약적 사랑과 신뢰성을 뜻하므로, 여기서는 현대 한국어의 의미 전달을 위해 ‘사랑과 진실’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 사랑
  alternatives_korean:
  - 인애
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 충성심이 담긴 사랑을 가리키므로, 한국어에서는 문맥상 가장 직접적이고 현대적인 ‘사랑’으로 옮기되, 그 충성의 뉘앙스는 문장 전체와 각주로 보완했습니다.
- source_word: אֱמֶת
  english_pob_choice: faithfulness
  chosen_korean: 진실
  alternatives_korean:
  - 신실함
  - 성실함
  - 진리
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘진리’보다 관계적·윤리적 신뢰성을 가리키므로 ‘진실’로 옮겨, POB의 ‘faithfulness’가 겨냥한 신뢰성의 뜻을 살렸습니다.
- source_word: אַל יַעַזְבֻךָ
  english_pob_choice: Let ... not forsake you
  chosen_korean: 당신을 떠나지 않게 하십시오
  alternatives_korean:
  - 당신을 버리지 않게 하십시오
  - 당신을 떠나게 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 권면적 부정(jussive) 구조를 한국어 명령형으로 자연스럽게 옮기되, 두 덕목이 주어처럼 작동하는 인격화된 표현을 유지했습니다.
- source_word: קָשְׁרֵם / גַּרְגְּרוֹתֶיךָ
  english_pob_choice: bind them around your neck
  chosen_korean: 그것들을 목에 매어 두고
  alternatives_korean:
  - 그것들을 목에 묶고
  - 그것들을 목에 걸고
  lexicon: HALOT
  rationale: ‘목/목줄’ 이미지를 한국어에서 너무 생경하지 않게 유지하면서도, 단순한 장식보다 지속적 기억과 소지의 비유를 드러내기 위해 ‘매어 두고’로 옮겼습니다.
- source_word: כָּתְבֵם / לוּחַ לִבֶּךָ
  english_pob_choice: write them on the tablet of your heart
  chosen_korean: 마음의 판에 새기십시오
  alternatives_korean:
  - 마음의 판에 쓰십시오
  - 마음의 판에 기록하십시오
  lexicon: HALOT
  rationale: ‘판’은 לוּחַ의 구체적 이미지를 살리고, ‘새기다’는 단순 기록을 넘어 내면화된 지속성을 잘 나타내므로 한국어 관용과 원문의 은유를 함께 살립니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 관용적 짝 표현
  chosen_reading: ‘사랑과 진실’로 간결하게 두어, 언약적 충성과 신뢰성의 의미를 문맥에서 드러내도록 했습니다.
  alternative_readings:
  - ‘인애와 진실’
  - ‘변함없는 사랑과 신실함’
  - ‘은혜와 진실’
  rationale: 이 구절은 지혜 문학의 권면으로서 덕목의 내면화를 강조하므로, 교회 전통어를 그대로 고정하기보다 히브리어 짝이 가진 관계적 윤리를 현대 한국어에서 가장 자연스럽게 드러내는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; covenantal ethic in wisdom literature.'
