- from: 이웃에게 해를 꾀하지 말라 — 그가 당신 곁에 안전하게 거주하고 있을 때에는.[a]
  to: 당신 곁에 안전하게 살고 있는 이웃에게 해를 꾀하지 마십시오.[a]
  rationale: 원문의 분사구 ‘그가 당신과 함께/곁에 안전히 거주하는 동안’을 한국어의 자연스러운 관형절로 옮겼습니다. 이로써 초안의 미완 문장을 해소하고, 명령문을 합쇼체로 통일했습니다. 각주도 완결된 대안 문장으로 고쳤으며, ‘평안히’와 ‘악을 꾸미다’는 각각 לָבֶטַח 및 רָעָה/חרשׁ의 가능한 어휘적 대안을 제시합니다.
