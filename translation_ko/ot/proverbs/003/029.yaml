translation:
  language: ko
  text: 당신 곁에 안전하게 살고 있는 이웃에게 해를 꾀하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신 곁에 평안히 살고 있는 이웃에게 악을 꾸미지 마십시오.”
