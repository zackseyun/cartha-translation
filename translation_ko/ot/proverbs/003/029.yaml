  text: Do not devise harm against your neighbor while he dwells securely with you[a].
  footnotes:
  - marker: a
    text: Or 'Do not plot evil against your neighbor while he dwells in safety with you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃에게 해를 꾀하지 말라 — 그가 당신 곁에 안전하게 거주하고 있을 때에는.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이웃에게 악을 꾸미지 말라 — 그가 당신 곁에 안전하게 거주할 때에는.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  english_pob_choice: devise
  chosen_korean: 꾀하지 말라
  alternatives_korean:
  - 계획하지 말라
  - 도모하지 말라
  - 꾸미지 말라
  lexicon: HALOT
  rationale: חרשׁ의 관용적 용법은 단순한 ‘갈다’가 아니라 악한 일을 마음속에 설계하거나 궁리하는 뜻이므로, 현대 한국어에서는 ‘꾀하다’가 가장 자연스럽게 그 의도를 드러냅니다.
- source_word: רֵעֲךָ
  english_pob_choice: your neighbor
  chosen_korean: 이웃에게
  alternatives_korean:
  - 네 이웃에게
  - 네 친구에게
  - 동료에게
  lexicon: HALOT
  rationale: רֵעַ는 친한 친구보다 윤리적 책임의 대상인 ‘이웃’의 범위를 잘 담아, 잠언의 도덕적 경고를 분명하게 전달합니다.
- source_word: רָעָה
  english_pob_choice: harm
  chosen_korean: 해
  alternatives_korean:
  - 악
  - 악한 일
  - 해악
  lexicon: HALOT
  rationale: 여기서 רָעָה는 추상적 ‘악’보다 타인에게 가해지는 실제적 해를 가리키므로, 일상적이면서도 구체적인 ‘해’가 적절합니다.
- source_word: לָבֶטַח
  english_pob_choice: securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 확실히
  - 안심하고
  lexicon: HALOT
  rationale: בֶּטַח는 안전과 보장을 뜻하므로, ‘안전하게’가 무방비한 신뢰 상태를 현대 한국어로 간명하게 살립니다.
