translation:
  language: ko
  text: 그것들이 네 영혼의 생명이 되고 네 목의 은총이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵן은 ‘은총’ 외에 ‘호의’, ‘호감’, ‘아름다움’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ는 ‘영혼’ 외에 ‘생명’, ‘자기’, ‘내면’까지 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  english_pob_choice: and they will be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되게 하십시오
  lexicon: HALOT
  rationale: 미래/결과적 진술로 읽는 문맥을 살려, 권고의 뉘앙스보다 진술형으로 옮겼습니다.
