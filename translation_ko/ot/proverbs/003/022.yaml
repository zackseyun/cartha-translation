  - 은혜
  - 호감
  lexicon: HALOT
  rationale: חֵן은 호의/호감/은총의 폭을 가지지만, 목에 두르는 장식의 비유와 어울리도록 한국어에서는 품위 있는 긍정적 의미의 ‘은총’을 택했습니다.
- source_word: לְגַרְגְּרֹתֶיךָ
  english_pob_choice: to your neck
  chosen_korean: 네 목의
  alternatives_korean:
