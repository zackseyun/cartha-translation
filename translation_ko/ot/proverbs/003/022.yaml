theological_decisions:
- issue: חַיִּים / נֶפֶשׁ의 의미 범위
  chosen_reading: ‘생명’과 ‘영혼’을 함께 살려, 지혜의 가르침이 단지 육체적 생존이 아니라 인격 전체의 생명에 미친다는 점을 드러냈습니다.
  alternative_readings:
  - ‘삶’과 ‘자신’으로 더 중립적으로 옮길 수 있습니다.
  - ‘생명’ 하나로 통일해도 가능합니다.
  rationale: 히브리 시어의 평행구문이 내적 생명과 외적 삶을 함께 가리키므로, 한국어에서도 그 폭을 축소하지 않는 것이 중요합니다.
  doctrine_reference: 잠언의 지혜-생명 연결(잠 3:18, 3:22)
