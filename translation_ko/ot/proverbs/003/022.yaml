  lexicon: HALOT
  rationale: 히브리어 복수형이 추상명사로 기능하므로, 한국어에서는 자연스럽고 응축된 ‘생명’이 적절합니다.
- source_word: לְנַפְשֶׁךָ
  english_pob_choice: to your soul
  chosen_korean: 네 영혼의
  alternatives_korean:
  - 네 생명의
  - 네 자신에게
  lexicon: HALOT
  rationale: נֶפֶשׁ의 넓은 의미를 살리되, 한국어 성경 문맥에서 ‘영혼’이 원문의 인격적·내적 차원을 가장 잘 보존합니다.
- source_word: וְחֵן
  english_pob_choice: and grace
  chosen_korean: 은총
  alternatives_korean:
