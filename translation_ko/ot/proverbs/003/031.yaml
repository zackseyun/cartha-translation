  rationale: קנא는 문맥상 타인의 형편을 탐내는 ‘부러워하다/시기하다’의 의미를 가질 수 있어, 자연스러운 합쇼체로 ‘부러워하지 마시고’를 택했습니다.
- source_word: אִישׁ חָמָס
  english_pob_choice: a violent man
  chosen_korean: 포악한 사람
