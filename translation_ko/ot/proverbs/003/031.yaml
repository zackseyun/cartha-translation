  - 그의 행실도
  lexicon: HALOT
  rationale: דרך의 비유적 의미인 삶의 방식/행실을 살리되, בְּכָל의 총체성을 한국어로 자연스럽게 옮기기 위해 ‘어떤 길도’로 표현했습니다.
