  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
  footnotes:
  - marker: a
    text: Or 'be jealous of a violent man.' The Hebrew verb can express either envy or jealousy in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 포악한 사람을 부러워하지 마시고[a], 그의 어떤 길도 택하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시기하다’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 부러움이나 질투의 뉘앙스를 둘 다 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  english_pob_choice: Do not
  chosen_korean: ~하지 마십시오
  alternatives_korean:
  - ~하지 마세요
  - ~하지 말아야 합니다
  lexicon: HALOT
  rationale: 금지형 אַל의 직접적인 현대 한국어 대응으로, 잠언의 권면체에 맞게 정중한 명령형을 사용했습니다.
- source_word: תְּקַנֵּא
  english_pob_choice: envy
  chosen_korean: 부러워하지 마시고
  alternatives_korean:
  - 시기하지 마시고
  - 질투하지 마시고
  lexicon: HALOT
  rationale: קנא는 문맥상 타인의 형편을 탐내는 ‘부러워하다/시기하다’의 의미를 가질 수 있어, 자연스러운 합쇼체로 ‘부러워하지 마시고’를 택했습니다.
- source_word: אִישׁ חָמָס
  english_pob_choice: a violent man
  chosen_korean: 포악한 사람
  alternatives_korean:
  - 폭력적인 사람
  - 불의를 행하는 사람
  lexicon: HALOT
  rationale: חָמָס는 폭력·포악·포악한 행위를 포괄하므로, 한국어에서는 행위의 성격을 드러내는 ‘포악한’이 잠언의 경고 톤을 잘 살립니다.
- source_word: דְּרָכָיו
  english_pob_choice: his ways
  chosen_korean: 그의 어떤 길도
  alternatives_korean:
  - 그의 모든 길도
  - 그의 행실도
  lexicon: HALOT
  rationale: דרך의 비유적 의미인 삶의 방식/행실을 살리되, בְּכָל의 총체성을 한국어로 자연스럽게 옮기기 위해 ‘어떤 길도’로 표현했습니다.
