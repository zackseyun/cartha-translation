  text: Do not envy a violent man[a], and do not choose any of his ways.
  footnotes:
  - marker: a
    text: Or 'be jealous of a violent man.' The Hebrew verb can express either envy or jealousy in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 포악한 사람을 부러워하지 마시고, 그의 어떤 길도 택하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시기하다’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 부러움이나 질투의 뉘앙스를 둘 다 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  english_pob_choice: Do not
  chosen_korean: ~하지 마십시오
  alternatives_korean:
  - ~하지 마세요
  - ~하지 말아야 합니다
  lexicon: HALOT
  rationale: 금지형 אַל의 직접적인 현대 한국어 대응으로, 잠언의 권면체에 맞게 정중한 명령형을 사용했습니다.
- source_word: תְּקַנֵּא
