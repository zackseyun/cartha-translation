  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
  footnotes:
  - marker: a
    text: Or 'well-being' or 'wholeness' for 'peace' (Hebrew shalom).
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 길들은 즐거움의 길들이며, 그녀의 모든 길은 평화[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안녕’, ‘온전함’. 히브리어 샬롬.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ / דַרְכֵי
  english_pob_choice: her ways / ways of
  chosen_korean: 길들은
  alternatives_korean:
  - 길
  - 행실
  - 삶의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문자적 ‘길’이면서도 지혜문학에서는 삶의 행로를 가리킬 수 있습니다. 앞절의 의인화된 ‘그’에 맞춰 ‘그의 길들’로 옮겨 반복 구조를 살렸습니다.
- source_word: נֹעַם
  english_pob_choice: pleasantness
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 유쾌함
  - 호감
  lexicon: HALOT
  rationale: נֹעַם은 ‘유쾌함/아름다움/기분 좋은 성질’의 폭을 가지지만, 한국어에서는 ‘즐거움’이 지혜시의 긍정적 품격을 해치지 않으면서도 자연스럽게 읽힙니다.
- source_word: נְתִיבוֹתֶיהָ
  english_pob_choice: her paths
  chosen_korean: 오솔길
  alternatives_korean:
  - 길목
  - 길들
  - 뻗은 길
  lexicon: HALOT
  rationale: נְתִיבָה는 보통 ‘길/통로’이지만, 앞의 דֶּרֶךְ와 평행을 이루는 시적 변주를 살리기 위해 더 구체적이고 시적인 ‘오솔길’을 택했습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 온전함
  lexicon: HALOT
  rationale: שָׁלוֹם의 넓은 의미를 고려하면 ‘평화’보다 ‘평강’이 한국어 성경어휘에서 더 포괄적으로 쓰이며, 단순한 전쟁 부재를 넘어선 온전함의 뉘앙스를 담아낼 수 있습니다.
