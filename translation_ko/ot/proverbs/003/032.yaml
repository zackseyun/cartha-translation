base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
  footnotes:
  - marker: a
    text: Or "his secret is with the upright"; the Hebrew סוֹד can mean confidential counsel, secret, or intimate fellowship.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜곡된 자는 야훼께서 가증히 여기시지만, 정직한 사람들과는 그의 은밀한 뜻이 함께합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סוֹד는 비밀, 친밀한 의논, 내밀한 교제를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증히 여기시지만
  alternatives_korean:
  - 가증한 존재이지만
  - 혐오스러운 존재이지만
  - 가증스럽게 여기시지만
  lexicon: HALOT
  rationale: תוֹעֲבַת은 단순한 불쾌감보다 언약적·도덕적 혐오를 나타내므로, 동사형으로 옮겨 야훼의 평가를 직접 드러냈습니다.
- source_word: נָלוֹז
  english_pob_choice: the crooked person
  chosen_korean: 왜곡된 자
  alternatives_korean:
  - 구부러진 사람
  - 비뚤어진 사람
  - 간사한 자
  lexicon: HALOT
  rationale: 지혜문맥의 ‘비뚤어짐/굽어짐’을 살리되 현대 한국어에서 자연스럽고 도덕적 일탈의 뜻이 드러나는 표현으로 옮겼습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 사람들
  alternatives_korean:
  - 곧은 사람들
  - 올곧은 이들
  - 의로운 사람들
  lexicon: HALOT
  rationale: ‘굽은 자’와의 대조를 살리면서도, 한국어에서 지혜문학의 اخلاق적 의미를 자연스럽게 전달하는 표현을 선택했습니다.
- source_word: סוֹד
  english_pob_choice: his counsel / his intimate counsel
  chosen_korean: 그의 은밀한 뜻
  alternatives_korean:
  - 그의 친밀한 의논
  - 그의 비밀한 뜻
  - 그의 친밀한 교제
  lexicon: HALOT
  rationale: סוֹד는 비밀, 친밀한 의논, 내밀한 교제를 모두 가질 수 있으므로, 본문이 주는 친밀성과 숨은 소통의 긴장을 함께 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 야훼께 속한 סוֹד의 범위
  chosen_reading: 야훼께서는 정직한 사람들과 내밀한 뜻을 나누십니다.
  alternative_readings:
  - 정직한 사람들과 비밀을 나누십니다
  - 정직한 사람들과 친밀히 교제하십니다
  rationale: 본문은 단순한 정보 제공보다 특별한 접근과 친밀성을 암시하므로, 의미를 한쪽으로만 좁히지 않고 ‘은밀한 뜻’으로 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
