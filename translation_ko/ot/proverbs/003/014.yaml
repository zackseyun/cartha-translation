  - 이는
  lexicon: HALOT
  rationale: 이 절은 앞선 지혜 찬양의 이유를 제시하므로, 한국어에서는 별도 접속사보다 자연스러운 설명형 종결로 처리했습니다.
- source_word: סַחְרָהּ
