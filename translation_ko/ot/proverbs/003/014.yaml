  lexicon: HALOT
  rationale: 여성 인칭 소유격을 살리면서, 지혜가 가져오는 경제적 가치를 현대 한국어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: מִסְּחַר כָּסֶף
  english_pob_choice: than the profit of silver
  chosen_korean: 은의 수익보다
