base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/014.yaml
  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
  footnotes:
  - marker: a
    text: Or 'her merchandise' / 'her gain' for 'her profit'; the Hebrew uses commercial language for the value wisdom brings.
    reason: lexical_alternative
  - marker: b
    text: Or 'than fine gold'; the Hebrew term can denote especially precious or refined gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그녀가 주는 이익[a]이 은 거래의 이익보다 낫고, 그녀가 내는 소출이 금[b]보다 낫기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이익’으로 옮긴 말은 상업적 표현입니다. 문맥에 따라 ‘거래’, ‘상품’, 또는 ‘장사에서 얻는 이익’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 특히 값지고 정련된 금을 가리킬 수 있으므로, ‘정금’ 또는 ‘순금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
