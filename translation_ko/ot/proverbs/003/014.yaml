  - 수확
  lexicon: HALOT
  rationale: 수확/산출의 이미지를 유지하면서도 한국어에서 앞의 '수익'과 짝을 이루어 자연스럽게 들리는 표현을 택했습니다.
theological_decisions:
- issue: 지혜의 의인화와 여성 소유격
  chosen_reading: 지혜를 여성 인칭으로 의인화한 표현을 그대로 살려 '그 수익', '그 소득'으로 옮겼습니다.
  alternative_readings:
  - 지혜의 수익
  - 그 이익
  rationale: 본문의 히브리어는 지혜를 여성형으로 의인화하며 소유격을 사용하므로, 이를 평평하게 만들지 않고 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: 잠언의 지혜 의인화
