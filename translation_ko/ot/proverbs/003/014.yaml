  lexicon: HALOT
  rationale: 히브리어의 상업적 대비를 유지하기 위해 비교 구조를 살렸고, 반복되는 profit/סחר의 이미지를 한국어에서 가장 간결하게 전달했습니다.
- source_word: וּמֵחָרוּץ
  english_pob_choice: than gold
  chosen_korean: 금보다
  alternatives_korean:
  - 순금보다
  - 정금보다
  lexicon: HALOT
  rationale: חָרוּץ가 지혜문학에서 귀금속, 특히 값비싼 금을 가리킬 수 있지만, 본문 의미를 분명히 하는 데는 '금'이 충분합니다.
- source_word: תְּבוּאָתָהּ
  english_pob_choice: her yield
  chosen_korean: 소득
