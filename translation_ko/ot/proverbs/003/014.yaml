source:
  edition: WLC
  text: כִּ֤י ט֣וֹב סַ֭חְרָ/הּ מִ/סְּחַר כָּ֑סֶף וּ֝/מֵ/חָר֗וּץ תְּבוּאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/014.yaml
  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
  footnotes:
  - marker: a
    text: Or 'her merchandise' / 'her gain' for 'her profit'; the Hebrew uses commercial language for the value wisdom brings.
    reason: lexical_alternative
  - marker: b
    text: Or 'than fine gold'; the Hebrew term can denote especially precious or refined gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 수익은 은의 수익보다 낫고, 그 소득은 금보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수익’은 히브리어의 상업적 비유를 살린 번역이며, 문자적으로는 ‘거래’ 또는 ‘장사’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘금’은 여기서 특히 값비싼 금속을 가리키며, ‘정금’ 또는 ‘순금’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
