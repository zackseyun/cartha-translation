    rationale: 잠언의 지혜 어휘에서 ‘명철’은 ‘지혜’와의 전통적이고 자연스러운 짝을 이루며, תְּבוּנָה의 분별·이해의 의미를 잘 보존합니다.
  - severity: low
    issue: 각주 위치와 설명이 두 번 반복되는 אָדָם 전체를 충분히 가리키지 못합니다.
