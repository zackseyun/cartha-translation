  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
  footnotes:
  - marker: a
    text: Or 'Blessed is the person who finds wisdom, and the person who obtains understanding.' The Hebrew uses 'man' in a representative sense.
