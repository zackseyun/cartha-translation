translation:
  language: ko
  text: 복이 있는 사람은 지혜를 찾아내고, 통찰을 얻는 사람은 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 대표적 의미의 단수 표현을 사용하므로, 문맥상 ‘사람’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복이 있는
  alternatives_korean:
  - 복된
  - 행복한
  - 복 있는
  lexicon: HALOT
  rationale: 지혜 문학의 축복 선언을 자연스럽게 살리면서, 단순한 감정 상태인 ‘행복한’보다 복된 상태를 나타내는 표현으로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 사람
  - 인간
  - 사람 한 명
  lexicon: HALOT
  rationale: 히브리어의 대표적 단수 표현을 한국어에서 성별을 드러내지 않는 일반 명사로 옮기되, 보편적 의미는 유지했습니다.
- source_word: מָצָא
  english_pob_choice: finds
  chosen_korean: 찾아내고
  alternatives_korean:
  - 찾고
  - 발견하고
  - 얻고
  lexicon: HALOT
  rationale: 잠언의 격언적 현재 의미를 살리면서, 지혜를 단순히 우연히 찾는 것보다 적극적으로 ‘찾아내는’ 뉘앙스를 반영했습니다.
- source_word: יָפִיק
  english_pob_choice: obtains
  chosen_korean: 얻는
  alternatives_korean:
  - 획득하는
  - 끌어내는
  - 가져오는
  lexicon: HALOT
  rationale: ‘지혜를 찾는 것’과의 평행법을 살려, 통찰을 성공적으로 얻는다는 뜻을 가장 자연스럽게 표현했습니다.
theological_decisions:
- issue: 오디언스에게 전달되는 대표성 있는 남성 단수 표현
  chosen_reading: 대표적 단수 의미를 한국어 일반 표현으로 옮겨 성별 제한을 두지 않았습니다.
  alternative_readings:
  - 남자
  - 그 사람
  - 한 사람
  rationale: 히브리어 אָדָם은 여기서 대표적 인간 일반을 가리키므로, 한국어에서는 문맥상 자연스러운 ‘사람’으로 옮겨 원문의 보편성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
