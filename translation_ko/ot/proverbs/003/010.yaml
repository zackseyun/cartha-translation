translation:
  language: ko
  text: 그러면 네 곳간은 풍성하게 가득 차고, 네 포도주 통은 새 포도주로 터져 나올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새 포도주가 흘러넘칠 것입니다.’ 히브리어 동사는 문자적으로 ‘터져 나오다, 분출하다’를 뜻하며, 풍성함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסָמֶיךָ
  english_pob_choice: your barns
  chosen_korean: 곡식 곳간
  alternatives_korean:
  - 곳간
  - 창고
  lexicon: HALOT
  rationale: אסם은 곡식이나 수확물을 저장하는 곳을 가리키므로, 현대 한국어에서는 ‘곡식 곳간’이 이미지와 기능을 함께 가장 잘 살립니다.
- source_word: יִמָּלְאוּ
  english_pob_choice: will be filled
  chosen_korean: 가득 차
  alternatives_korean:
  - 채워질
  - 채워져 있을
  lexicon: HALOT
  rationale: 미래 수동의 의미를 자연스럽게 살리면서, 결과 상태를 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: תִירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 신 포도주
  - 포도주
  lexicon: HALOT
  rationale: תירוש은 일반적인 포도주보다 갓 나온 포도즙/새 포도주를 가리키므로, ‘새 포도주’가 어휘 구분을 가장 잘 보존합니다.
- source_word: יְקָבֶיךָ
  english_pob_choice: your vats
  chosen_korean: 술틀마다
  alternatives_korean:
  - 포도주 틀마다
  - 술 저장독마다
  lexicon: HALOT
  rationale: יקב은 포도를 밟아 짜거나 포도주를 모으는 틀/독을 가리키므로, 한국어에서는 농경적 그림이 살아 있는 ‘술틀’로 옮겼습니다.
- source_word: יִפְרֹצוּ
  english_pob_choice: will burst
  chosen_korean: 넘쳐흐를 것입니다
  alternatives_korean:
  - 터질 것입니다
  - 흘러넘칠 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘터져 나오다/분출하다’의 강한 이미지를 가지지만, 한국어에서는 파손 뉘앙스를 피하면서도 풍성함을 살리는 ‘넘쳐흐르다’가 더 적절합니다.
theological_decisions:
- issue: 물질적 풍요의 약속 이미지
  chosen_reading: 구체적인 농경적 풍요의 그림을 그대로 살려, 추상적 축복으로 약화하지 않았습니다.
  alternative_readings:
  - 일반적인 복으로만 완화해 번역하기
  rationale: 히브리어 본문은 곳간, 술틀, 새 포도주라는 ملم한 이미지를 사용하므로, 독자가 지혜문학의 실제적 번영 비유를 그대로 이해하도록 보존하는 것이 타당합니다.
  doctrine_reference: 본문의 농경적 은유를 보존하고 신학적 긴장은 해설로 남깁니다.
