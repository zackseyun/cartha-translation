  source_fidelity: 본문의 ‘곡식 곳간’과 ‘새 포도주’는 히브리어의 농경적 이미지를 잘 보존합니다. 그러나 יְקָבֶיךָ는 술을 짜는 행위보다 포도주를 받거나 담는 용기/시설의 이미지이므로 ‘술틀마다’보다 ‘포도주 통은’이 문맥상 더 정확합니다. 또한 יִפְרֹצוּ의 강한 ‘터져 나오다’ 이미지는 본문에서 살리는 편이 좋습니다.
