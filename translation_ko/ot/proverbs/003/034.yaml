id: PRO.3.34
reference: Proverbs 3:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: If it is to scoffers, he scoffs[c]; but to the humble[b] he gives favor[a].
  footnotes:
  - marker: a
    text: Or 'to mockers, he mocks'; the Hebrew repeats the same root for both 'scoffers' and 'scoffs,' creating a deliberate wordplay.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the poor' or 'to the afflicted'; the Hebrew term can denote those who are lowly in status or circumstance, though here 'humble' best fits the contrast with 'scoffers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'grace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 조롱하는 자들에게는 조롱하시고, 겸손한 자들에게는 은혜를 주십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은혜’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가난한 자들에게’ 또는 ‘고난받는 자들에게’로 옮길 수 있습니다. 히브리어는 낮은 신분이나 처지에 있는 사람들을 가리킬 수 있으나, 여기서는 ‘겸손한 자들’이 대조를 가장 잘 살립니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘조롱합니다’로 옮길 수 있습니다. 히브리어는 같은 어근을 반복해 ‘조롱하는 자들’과 ‘조롱하신다’ 사이의 말장난을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/לֵּצִ֥ים
  english_pob_choice: to scoffers
  chosen_korean: 조롱하는 자들에게는
  alternatives_korean:
  - 비웃는 자들에게는
  - 경멸하는 자들에게는
  lexicon: HALOT
  rationale: לץ의 기본 뜻은 조롱하고 업신여기는 사람들입니다. 한국어에서는 ‘조롱하는 자들’이 지혜문학의 통용 의미를 가장 직접적으로 살립니다.
- source_word: יָלִ֑יץ
  english_pob_choice: he scoffs
  chosen_korean: 조롱하시고
  alternatives_korean:
  - 비웃으시고
  - 조롱하십니다
  lexicon: HALOT
  rationale: 히브리어의 어근 반복에 해당하는 대응을 살리기 위해 앞의 ‘조롱하는 자들’과 같은 어근 계열로 받았습니다. 문장 연결상 ‘조롱하시고’가 가장 자연스럽습니다.
- source_word: ו/ל/עניים
  english_pob_choice: to the humble
  chosen_korean: 겸손한 자들에게는
  alternatives_korean:
  - 가난한 자들에게는
  - 곤고한 자들에게는
  - 낮은 자들에게는
  lexicon: HALOT
  rationale: 문맥상 단순한 경제적 가난보다 조롱하는 자들과 대조되는 태도·상태가 핵심이어서 ‘겸손한 자들’로 옮겼습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은혜를
  alternatives_korean:
  - 호의를
  - 은총을
  lexicon: HALOT
  rationale: חן은 호의나 은혜를 뜻할 수 있지만, 한국어 합쇼체 성경 문맥에서는 ‘은혜’가 가장 자연스럽고 신학적으로도 넓게 받아들여집니다.
theological_decisions:
- issue: 잠언의 보응적 대구와 야훼의 행위 표현
  chosen_reading: ‘그는 … 주십니다’로 옮겨, 본문의 행위 주체를 분명히 하되 직접 명칭은 생략했습니다.
  alternative_readings:
  - ‘야훼께서는 … 하십니다’로 명시
  - 주어를 생략해 더 압축적으로 번역
  rationale: 히브리어는 대명사 הוּא로 행위 주체를 강조하지만, 문맥상 하나님을 가리킵니다. 한국어에서는 주어를 살리면서도 본문에 없는 명칭을 덧붙이지 않는 쪽이 source-direct합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘עניים’의 의미 범위
  chosen_reading: ‘겸손한 자들’로 번역했습니다.
  alternative_readings:
  - 가난한 자들
  - 고난받는 자들
  - 낮은 자들
  rationale: 지혜문학의 대조 구조에서 핵심은 사회경제적 상태보다 교만한 조롱꾼과 대비되는 태도입니다. 따라서 ‘겸손한 자들’이 대조를 가장 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
