  source_fidelity: 원문의 신명 יְהוָה는 영어 POB의 정책상 ‘Yahweh’로 음역되어야 하므로, 한국어도 관습적 대체명인 ‘여호와’보다 ‘야훼’로 옮기는 것이 감사 추적과 일치합니다. יָסַד의 기초를 놓는 뉘앙스, כּוֹנֵן의 견고하게 세우는 뉘앙스, 그리고 지혜/명철의 병행을 구별해 반영했습니다.
  naturalness: ‘하셨나이다’는 현대 표준어 합쇼체보다 문어적·고어적입니다. ‘하셨습니다’가 요청된 현대 격식체에 자연스럽습니다. ‘땅의 기초를 놓으셨고’와 ‘하늘을 굳게 세우셨습니다’는 한국어에서 자연스럽고 시적 병행도 유지합니다.
  terminology: חָכְמָה는 ‘지혜’, תְּבוּנָה는 잠언의 지혜 어휘를 구별하여 ‘명철’로 옮겼습니다. יְהוָה는 영어 POB의 ‘Yahweh’ 선택에 맞춰 ‘야훼’로 음역했습니다.
