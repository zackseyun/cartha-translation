base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
  footnotes:
  - marker: a
    text: Or 'in the house of the wicked'; the Hebrew preposition can be rendered more literally, but 'is on the house of' better conveys the sense of a curse resting upon it.
    reason: lexical_alternative
  - marker: b
    text: Or 'abode' or 'home' for 'dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 저주는 악인의 집에[a] 임하고, 그분은 의인들의 거처[b]에 복을 내리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 문자적으로 ‘~안에’로도 옮길 수 있습니다. 그러나 저주가 한 집에 닥쳐 머무는 뜻을 살려 ‘집에 임하고’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: נָוֶה는 ‘거처’ 외에도 ‘주거지’, ‘집’, ‘보금자리’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  english_pob_choice: curse
  chosen_korean: 저주
  alternatives_korean:
