  - 저주받음
  - 저주가 임함
  lexicon: HALOT
  rationale: 명사 מְאֵרָה는 ‘저주/저주받은 상태’를 뜻하므로, 한국어에서는 가장 مستقیم한 명사형 ‘저주’로 옮겨 징벌의 상태를 분명히 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
