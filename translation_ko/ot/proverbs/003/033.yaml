base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
  footnotes:
  - marker: a
    text: Or 'in the house of the wicked'; the Hebrew preposition can be rendered more literally, but 'is on the house of' better conveys the sense of a curse resting upon it.
    reason: lexical_alternative
  - marker: b
    text: Or 'abode' or 'home' for 'dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 저주는 악인의 집에 임하고, 의인의 거처는 복을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 문자적으로 ‘~안에’일 수 있으나, 여기서는 저주가 집 위에 덮이는 뜻을 더 잘 살리는 ‘임하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: נָוֶה는 ‘거처’ 외에도 ‘주거지’, ‘집’, ‘보금자리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  english_pob_choice: curse
  chosen_korean: 저주
  alternatives_korean:
  - 주검
  - 저주받음
  - 저주가 임함
  lexicon: HALOT
  rationale: 명사 מְאֵרָה는 ‘저주/저주받은 상태’를 뜻하므로, 한국어에서는 가장 مستقیم한 명사형 ‘저주’로 옮겨 징벌의 상태를 분명히 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 관용적 대명사로 바꾸지 않고, 프로젝트 기준에 따라 고유 신명 ‘야훼’로 옮겨 신명의 직접성을 보존했습니다.
- source_word: בְּבֵית
  english_pob_choice: is on the house of
  chosen_korean: 집에 임하고
  alternatives_korean:
  - 집 안에
  - 집 위에
  - 집에 있다
  lexicon: HALOT
  rationale: ב + בַּיִת은 문자적으로 ‘집 안에/집에’이지만, 저주가 한 집 위에 얹혀 있는 효과를 한국어에서 자연스럽게 살리기 위해 ‘임하고’로 처리했습니다.
- source_word: וּנְוֵה
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 초막
  - 집
  - 살 곳
  lexicon: HALOT
  rationale: נָוֶה는 거처·주거지를 가리키므로, 현대 한국어에서 공간적 이미지를 유지하는 ‘거처’가 가장 간결하고 안정적입니다.
theological_decisions:
- issue: 여호와의 저주와 복을 대칭적으로 표현하는 방식
  chosen_reading: 저주는 악인의 집에 임하고, 의인의 거처는 복을 받습니다
  alternative_readings:
  - 야훼의 저주는 악인의 집에 있고, 의인의 거처는 야훼께서 복을 주십니다
  - 야훼의 저주는 악인의 집 위에 있고, 의인의 거처는 복을 받습니다
  rationale: 잠언의 평행법을 살리면서, پہلی 절의 ‘임하고’와 둘째 절의 ‘복을 받습니다’로 저주/복의 작용을 대칭적으로 드러냈습니다. 둘째 절의 히브리어 동사는 야훼를 주어로 밝히지 않아, 한국어에서도 주어를 과도하게 보충하지 않았습니다.
  doctrine_reference: 잠언의 지혜 문학적 평행법; source-text minimal supplementation 원칙
