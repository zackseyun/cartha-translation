  source_fidelity: The final Hebrew clause is circumstantial ('while it is with you'), not a rhetorical question. The draft's '이미 ... 있지 않습니까?' changes both its syntax and force. The placement of the prohibition is also clearer when the available possession clause qualifies the whole refusal.
  naturalness: The revised wording is natural modern standard Korean in formal-polite style. The direct quoted imperatives retain the deliberately blunt speech being prohibited, while the narrator's prohibition uses 합쇼체.
  terminology: ‘이웃’ appropriately renders רֵעַ in this ethical context. ‘다시 오라’ is a natural rendering of the return command, and ‘그것을 가지고 있으면서도’ retains the source's unspecified object without making it a rhetorical question.
  issues:
