id: PRO.3.28
reference: Proverbs 3:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תֹּ֘אמַ֤ר ל/רעי/ך לֵ֣ךְ וָ֭/שׁוּב וּ/מָחָ֥ר אֶתֵּ֗ן וְ/יֵ֣שׁ אִתָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
  footnotes:
  - marker: a
    text: Or “return” for “come back.”
    reason: lexical_alternative
  - marker: b
    text: The final clause means the person already has the means to give and should not delay.
    reason: cultural_note
translation:
  language: ko
  text: 당신이 그것을 가지고 있으면서도, 이웃에게 “가서 다시 오라[a]. 내일 내가 주겠다”라고 말하지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 이미 줄 수 있는 것을 가지고 있으면서도 주기를 미루는 일을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  english_pob_choice: neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 친구
  - 동료
  lexicon: HALOT
  rationale: 잠언의 רֵעַ는 친밀한 친구보다 사회적 근접성 안의 타인을 가리키는 경우가 많아, 윤리적 책임을 살리는 ‘이웃’이 가장 적절합니다.
- source_word: לֵךְ וָשׁוּב
  english_pob_choice: Go, and come back
  chosen_korean: 가서 돌아오라
  alternatives_korean:
  - 가서 다시 오라
  - 가십시오, 돌아오십시오
  lexicon: HALOT
  rationale: 두 명령형의 연속을 자연스러운 한국어 명령문으로 옮기되, 원문의 간결하고 직접적인 어조를 유지했습니다.
- source_word: מָחָר אֶתֵּן
  english_pob_choice: tomorrow I will give
  chosen_korean: 내일 내가 주겠다
  alternatives_korean:
  - 내일 줄 것이다
  - 내일 내가 드리겠다
  lexicon: HALOT
  rationale: 미래 시제의 약속을 평이하게 옮겼고, 히브리어에서 생략된 목적어는 한국어에서도 굳이 보충하지 않았습니다.
- source_word: יֵשׁ אִתָּךְ
  english_pob_choice: when you have it with you
  chosen_korean: 이미 당신에게 그것이 있지 않습니까?
  alternatives_korean:
  - 이미 가지고 있지 않습니까?
  - 당신과 함께 있지 않습니까?
  lexicon: HALOT
  rationale: 문맥상 지체할 이유가 없는 ‘이미 소유·가용한 상태’를 분명히 하기 위해, 영어 POB의 취지를 따라 현재의 보유 상태를 자연스럽게 드러냈습니다.
