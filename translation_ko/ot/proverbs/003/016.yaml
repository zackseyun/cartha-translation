  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
  footnotes:
  - marker: a
    text: Or 'long life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 오른손에는 장수의 길이 있고, 그의 왼손에는 부와 명예가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장수의 길이’는 문자적인 표현이며, 자연스러운 뜻으로는 ‘오랜 생명’ 또는 ‘장수’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: Length of days
  chosen_korean: 장수의 길이
  alternatives_korean:
  - 오랜 생명
  - 긴 생명
  lexicon: HALOT
  rationale: 히브리어의 관용적 결합을 직역하되, 한국어에서 자연스럽게 이해되도록 ‘장수의 길이’로 옮겨 시적 평행을 살렸습니다.
- source_word: בִּימִינָהּ
  english_pob_choice: in her right hand
  chosen_korean: 그의 오른손에는
  alternatives_korean:
  - 그 오른손에
  - 그의 오른편에
  lexicon: HALOT
  rationale: ב + 명사구를 소유격과 함께 ‘~에는’으로 옮겨, 손 안에 쥐고 있는 이미지와 평행 구조를 분명히 했습니다.
- source_word: עֹשֶׁר
  english_pob_choice: riches
  chosen_korean: 부
  alternatives_korean:
  - 재물
  - 부유함
  lexicon: HALOT
  rationale: 지혜가 가져오는 물질적 풍요를 간결하게 드러내는 기본어로 ‘부’를 선택했습니다.
- source_word: כָבוֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 존귀
  - 영광
  lexicon: HALOT
  rationale: 지혜의 결과로 주어지는 사회적 인정의 뜻이므로, 문맥상 ‘영광’보다 ‘명예’가 더 직접적입니다.
theological_decisions:
- issue: 지혜의 여성형 지시 대상
  chosen_reading: ‘그의’는 문맥의 의인화된 지혜를 가리키는 여성형 지시를 한국어에서 성별 비특이적으로 풀어 옮겼습니다.
  alternative_readings:
  - ‘그녀의’로 성별을 드러내는 번역
  - 지혜를 인격화하지 않고 중성화하는 번역
  rationale: 본문의 여성형 접미사는 잠언의 문학적 의인화 장치이므로, 한국어에서는 어색하지 않게 성별표지를 중화하되 의인화 자체는 보존했습니다.
  doctrine_reference: Translation philosophy §3
