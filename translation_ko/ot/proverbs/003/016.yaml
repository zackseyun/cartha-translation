  source_fidelity: 히브리어 אֹרֶךְ יָמִים은 ‘날들의 길이’라는 관용구로 장수하거나 긴 삶을 뜻합니다. 초안의 ‘장수의 길이’는 그 뜻을 중복적으로 결합하여 원문의 의미를 부정확하고 부자연스럽게 만듭니다. 여성형 소유 접미사는 문맥상 의인화된 지혜를 가리키므로, ‘지혜의’로 선행사를 밝혀 자연스럽게 보존할 수 있습니다.
  naturalness: ‘장수의 길이’는 현대 표준 한국어에서 자연스럽지 않습니다. ‘장수’는 간결하고 격식 있는 잠언의 문체에 적합합니다. ‘지혜의 오른손… 그 왼손’은 반복을 줄이면서도 손에 선물을 들고 있는 평행 이미지를 유지합니다.
