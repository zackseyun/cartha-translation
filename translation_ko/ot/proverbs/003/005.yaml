translation:
  language: ko
  text: 야훼를 온 마음으로 신뢰하십시오[a]. 그리고 자신의 이해에 의지하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자신의 이해에 기대지 마십시오.' 히브리어 동사는 문자적으로 '기대다' 또는 '지탱하다'를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  english_pob_choice: Trust
  chosen_korean: 신뢰하십시오
  alternatives_korean:
  - 믿으십시오
  - 의지하십시오
  lexicon: HALOT
  rationale: 지혜문학의 명령형으로, 관계적이고 전인적인 의탁을 나타내는 의미를 자연스럽게 살리면서도 현대 한국어 합쇼체로 직접 명령을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명문은 관용적 대명사로 바꾸지 않고, 프로젝트 기본값에 따라 하나님의 고유명사인 야훼로 옮겼습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 온 마음
  alternatives_korean:
  - 마음
  - 심장
  lexicon: HALOT
  rationale: 히브리어 לֵב는 정서만이 아니라 사고와 의지까지 포함하는 내면 전체를 가리키므로, 한국어에서는 '온 마음'으로 전인의 총체성을 드러냈습니다.
- source_word: תִּשָּׁעֵן
  english_pob_choice: lean
  chosen_korean: 의지하지 마십시오
  alternatives_korean:
  - 기대지 마십시오
  - 기울지 마십시오
  lexicon: HALOT
  rationale: 동사의 직유인 '기대다/기울다' 이미지를 살릴 수 있지만, 한국어에서는 지혜명령의 의미를 분명히 하는 '의지하다'가 더 자연스러워 본문에는 그 의미를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문이 יְהוָה를 직접 사용하므로, 대체 호칭으로 완화하지 않고 고유명을 보존하는 것이 원문 충실성과 감사 가능성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
