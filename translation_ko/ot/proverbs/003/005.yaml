  - 여호와
  rationale: 히브리어 원문이 יְהוָה를 직접 사용하므로, 대체 호칭으로 완화하지 않고 고유명을 보존하는 것이 원문 충실성과 감사 가능성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
