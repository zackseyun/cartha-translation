  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
  footnotes:
  - marker: a
    text: Or 'do not rely on your own understanding.' The Hebrew verb literally means 'lean' or 'support yourself' on something.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 온 마음을 다하여 신뢰하십시오. 자신의 분별력에 기대지 마십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 분별력에 의지하지 마십시오.’ 히브리어 동사는 문자적으로 ‘기대다’ 또는 ‘자신을 지탱하다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  english_pob_choice: Trust
  chosen_korean: 신뢰하십시오
  alternatives_korean:
  - 믿으십시오
  - 의지하십시오
  lexicon: HALOT
  rationale: 지혜문학의 명령형으로, 관계적이고 전인적인 의탁을 나타내는 의미를 자연스럽게 살리면서도 현대 한국어 합쇼체로 직접 명령을 유지했습니다.
