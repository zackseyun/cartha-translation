source:
  edition: WLC
  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
  footnotes:
  - marker: a
    text: Or 'do not let them slip out of your sight.' The plural 'them' refers back to the instruction or qualities in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: '''Sound wisdom'' may also be rendered ''sound judgment'' or ''resourcefulness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 그것들이 네 눈에서 떠나지 않게 하라. 지혜와 분별력을 지켜라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 복수 대명사 ‘그것들’은 앞 문맥의 교훈이나 덕목들을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘지혜’에 해당하는 תֻּשִׁיָּה는 문맥에 따라 ‘건전한 판단’ 또는 ‘실천적 지혜’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 호격을 그대로 살려, 잠언의 아버지-아들 권면 형식을 유지했습니다.
- source_word: יָלֻזוּ מֵעֵינֶיךָ
  english_pob_choice: do not let them depart from your eyes
  chosen_korean: 그것들이 네 눈에서 떠나지 않게 하라
  alternatives_korean:
  - 네 눈에서 벗어나지 않게 하라
  - 네 시야에서 사라지지 않게 하라
  lexicon: HALOT
  rationale: 복수 동사의 대상이 앞 문맥의 교훈/덕목들을 가리키므로, ‘그것들’로 보완해 한국어에서 자연스럽게 옮겼습니다.
- source_word: תֻּשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 건전한 지혜
  - 확실한 지혜
  - 지혜로운 판단
  lexicon: HALOT
  rationale: 문맥상 지혜문학의 핵심 덕목을 가리키므로 기본 의미를 살리되, 한국어에서는 관용적으로 풀어 ‘지혜’로 옮겼습니다.
- source_word: וּמְזִמָּה
  english_pob_choice: discretion
  chosen_korean: 분별력
  alternatives_korean:
  - 신중함
  - 분별
  - 사려
  lexicon: HALOT
  rationale: 이 문맥에서는 부정적 ‘계교’가 아니라 긍정적 ‘신중한 분별’의 뜻이므로, 현대 한국어에서 의미가 분명한 ‘분별력’으로 옮겼습니다.
