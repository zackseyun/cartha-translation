  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
  footnotes:
  - marker: a
    text: Or 'from your wealth'; the Hebrew preposition can be rendered either way after 'honor.'
    reason: lexical_alternative
  - marker: b
    text: '''Firstfruits'' refers to the first and best portion of the harvest given in honor to God.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼를 당신의 재물로[a]와 모든 소산의 첫 열매로[b] 공경하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물로’에 해당하는 히브리어 전치사 מִן은 문맥에 따라 ‘재물에서 나온 것으로’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘첫 열매’는 수확의 첫째이자 가장 좋은 몫을 하나님께 드리는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  english_pob_choice: Honor
  chosen_korean: 공경하십시오
  alternatives_korean:
