source:
  edition: WLC
  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
  footnotes:
  - marker: a
    text: Or 'from your wealth'; the Hebrew preposition can be rendered either way after 'honor.'
    reason: lexical_alternative
  - marker: b
    text: '''Firstfruits'' refers to the first and best portion of the harvest given in honor to God.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼를 당신의 재물로, 그리고 모든 소산의 첫 열매로 공경하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물로’는 히브리어 전치사 מִן을 ‘~으로/~로’로 자연스럽게 옮긴 것입니다. ‘재물에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘첫 열매’는 수확의 첫째이자 가장 좋은 몫을 하나님께 드리는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  english_pob_choice: Honor
  chosen_korean: 공경하십시오
  alternatives_korean:
  - 존귀하게 여기십시오
  - 영광을 돌리십시오
  - 존경하십시오
  lexicon: HALOT
  rationale: 지혜문학의 권면으로서 כבד의 핵심 의미인 ‘무겁게 여기다/존중하다’를 살리면서, 예배적 과장보다 생활 윤리를 드러내는 표준어 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사를 따라 한국어 표기인 ‘야훼’를 유지해, 본절이 단순한 칭호가 아니라 언약적 하나님의 이름을 말한다는 점을 드러냈습니다.
- source_word: מֵהוֹנֶךָ
  english_pob_choice: with your wealth
  chosen_korean: 당신의 재물로
  alternatives_korean:
  - 당신의 재물로부터
  - 당신의 재산으로
  - 당신의 소유로
  lexicon: HALOT
  rationale: מִן의 관계를 한국어 조사 ‘-로’로 자연스럽게 나타내면서, הוֹן의 의미 범위인 재물·소유를 담아 현대 독자가 이해하기 쉬운 표현으로 정리했습니다.
- source_word: וּמֵרֵאשִׁית כָּל תְּבוּאָתֶךָ
  english_pob_choice: and with the firstfruits of all your produce
  chosen_korean: 모든 소산의 첫 열매로
  alternatives_korean:
  - 모든 수확의 첫 열매로
  - 모든 소출의 첫 부분으로
  - 모든 생산물의 첫 열매로
  lexicon: HALOT
  rationale: רֵאשִׁית와 농경적 문맥을 반영해 ‘첫 열매’를 유지했고, תְּבוּאָה는 성경적이면서도 현대 한국어에서 이해 가능한 ‘소산’으로 옮겨 농업적 헌납의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 여호와 신명호칭의 한국어 표기
  chosen_reading: ‘야훼’로 직역성 있게 유지합니다.
  alternative_readings:
  - ‘주님’으로 치환
  - ‘여호와’로 표기
  rationale: 본문이 신명기적 전통의 고유명사를 직접 사용하므로, 경어적 칭호로 완화하지 않고 하나님의 이름 자체를 보존하는 것이 원문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
