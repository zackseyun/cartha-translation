  rationale: ‘새 힘’을 שִׁקּוּי의 어휘적 범위와 병행되는 신체 회복의 이미지를 더 잘 반영하는 ‘원기’로 조정했습니다. 각 각주를 해당 어구에 붙여 앵커를 명확히 했으며, שָׁרֶּךָ의 구체적 대안인 ‘배꼽’과 שִׁקּוּי의 물질적 대안은 각주에 보존했습니다.
