  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רִ֭פְאוּת תְּהִ֣י לְ/שָׁרֶּ֑/ךָ וְ֝/שִׁקּ֗וּי לְ/עַצְמוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/008.yaml
  text: It will be healing to your body and refreshment to your bones[a][b].
  footnotes:
  - marker: a
    text: Or 'to your navel.' The Hebrew term may refer specifically to the navel, though in this context it likely stands more broadly for the body's physical well-being.
    reason: lexical_alternative
  - marker: b
    text: Or 'moisture' or 'nourishment' to your bones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 네 몸에 치유가 되고 네 뼈에 새 힘이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배꼽에’. 히브리어는 문자적으로 ‘배꼽’을 가리킬 수 있지만, 이 문맥에서는 몸의 건강을 더 넓게 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘촉촉함’이나 ‘양분’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 건강
  - 치료
  lexicon: HALOT
  rationale: 명사 רִפְאוּת의 결과적·상태적 의미를 자연스러운 현대어로 살리면서, 단순한 의학적 ‘치료’보다 회복의 뜻을 넓게 담습니다.
- source_word: תְּהִי
  english_pob_choice: it will be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되리라
  lexicon: HALOT
  rationale: 문맥상 권면의 결과로 나타날 효력을 말하므로, 미래 결과를 나타내는 ‘될 것입니다’가 가장 자연스럽습니다.
- source_word: לְשָׁרֶּךָ
  english_pob_choice: to your body
  chosen_korean: 네 몸에
  alternatives_korean:
  - 네 배꼽에
  - 네 배에
  lexicon: HALOT
  rationale: 히브리어 שֹׁר은 문자적으로는 ‘배꼽’이지만, 이 문맥에서는 몸 전체의 생명력과 건강을 가리키는 표현으로 보이므로 ‘몸’으로 옮겼습니다.
- source_word: וְשִׁקּוּי
  english_pob_choice: and refreshment
  chosen_korean: 새 힘
  alternatives_korean:
  - 상쾌함
  - 촉촉함
  - 양분
  lexicon: HALOT
  rationale: ‘마시게 함/적심’에서 나온 명사로서 뼈를 살리는 회복의 이미지를 담고 있어, 현대 한국어에서 의미를 잘 드러내는 ‘새 힘’으로 옮겼습니다.
- source_word: לְעַצְמוֹתֶיךָ
  english_pob_choice: to your bones
  chosen_korean: 네 뼈에
  alternatives_korean:
  - 네 골수에
  - 네 뼈들에게
  lexicon: HALOT
  rationale: ‘뼈’는 히브리적 인체 표현에서 사람의 깊은 생명력을 가리키므로, 구체적 이미지를 유지했습니다.
theological_decisions:
- issue: 히브리어 שֹׁר의 범위
  chosen_reading: 문자적 ‘배꼽’ 대신 문맥상 몸 전체의 건강을 가리키는 표현으로 이해해 번역했습니다.
  alternative_readings:
  - 배꼽
  - 배
  rationale: 잠언 3:8의 병행법은 신체의 중심부를 통해 전인적 회복을 말하는 흐름이므로, 독자가 의미를 오해하지 않도록 넓은 뜻을 우선했습니다.
  doctrine_reference: 문맥 우선의 시적 병행법 해석
