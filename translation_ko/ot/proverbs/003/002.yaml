  yaml_path: translation/ot/proverbs/003/002.yaml
  text: for they will add to you length of days and years of life and peace[a].
  footnotes:
  - marker: a
    text: Or 'well-being' or 'wholeness' for 'peace' (shalom), reflecting a fuller sense of flourishing, not merely the absence of conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 네게 장수와 생명의 해와 평강을 더해 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''평강''은 כאן의 שָׁלוֹם이 단지 갈등의 부재가 아니라 온전함과 복됨을 포함할 수 있음을 반영합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 날들의 길이
  - 오랜 세월
  - 긴 생애
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽고 간결하게 살리기 위해 '장수'로 옮겼습니다. 직역형보다 잠언의 격언적 문체에 더 잘 맞습니다.
- source_word: וּשְׁנוֹת חַיִּים
  english_pob_choice: and years of life
  chosen_korean: 생명의 해
  alternatives_korean:
  - 생애의 해
  - 삶의 해
  - 생명의 세월
  lexicon: HALOT
  rationale: 평행구조를 유지하면서도 한국어에서 중복을 줄이기 위해 '생명의 해'로 옮겼습니다. 앞의 '장수'와 함께 중의적 반복을 자연스럽게 전달합니다.
- source_word: וְשָׁלוֹם
  english_pob_choice: and peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 잘됨
  lexicon: HALOT
  rationale: שָׁלוֹם의 의미 범위는 넓지만, 잠언 문맥에서는 단순한 갈등 부재보다 삶의 온전함을 포함하는 '평강'이 적절합니다.
- source_word: יוֹסִיפוּ
  english_pob_choice: will add
  chosen_korean: 더해 줄 것입니다
  alternatives_korean:
  - 더할 것입니다
  - 추가할 것입니다
  - 더해 주실 것입니다
  lexicon: HALOT
  rationale: 히필형 יסף의 '더하다/덧붙이다' 의미를 살리되, 한국어에서는 목적어와 자연스럽게 결합하는 '더해 줄 것입니다'가 가장 매끄럽습니다.
theological_decisions:
- issue: שָׁלוֹם의 범위
  chosen_reading: '''평강''을 사용해 단순한 무사함이 아니라 삶의 온전함과 번영을 함께 담았습니다.'
  alternative_readings:
  - '''평화''로 좁게 옮김'
  - '''잘됨''으로 의역'
  rationale: 영문 POB가 각주에서 'well-being'과 'wholeness' 가능성을 열어 두었으므로, 한국어 본문은 그 폭을 유지하는 번역이 필요합니다.
  doctrine_reference: 잠언의 지혜 문학에서 샬롬은 하나님이 주시는 전인적 복의 개념으로 자주 기능합니다.
