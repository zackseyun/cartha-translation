lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 날들의 길이
  - 오랜 세월
  - 긴 생애
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽고 간결하게 살리기 위해 '장수'로 옮겼습니다. 직역형보다 잠언의 격언적 문체에 더 잘 맞습니다.
- source_word: וּשְׁנוֹת חַיִּים
  english_pob_choice: and years of life
