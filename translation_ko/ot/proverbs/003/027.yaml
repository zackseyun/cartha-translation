  source_fidelity: 현 번역의 ‘그에게서’는 히브리어 מִבְּעָלָיו(직역하면 ‘그것의 소유자들로부터’, 관용적으로는 ‘마땅히 받을 이들에게’)의 복수 대상과 권리·자격의 뜻을 전달하지 못합니다. 또한 ‘유익’은 טוֹב의 의도적으로 넓은 의미를 다소 좁힙니다. 수정문은 대상과 관용적 의미를 분명히 하면서도, 할 수 있는 때라는 조건절을 보존합니다.
  naturalness: ‘마땅히 받을 이들에게 좋은 것을 베풀기를 거절하지 마십시오’는 현대 표준 한국어의 합쇼체에 자연스럽고, 잠언의 직접적인 금지 명령에 어울립니다. ‘당신의 손에 … 힘’이라는 직역적 표현은 본문보다 각주에서 처리하는 편이 자연스럽습니다.
  terminology: טוֹב는 ‘좋은 것’으로 옮겨 포괄성을 유지했습니다. מִבְּעָלָיו는 본문에서 ‘마땅히 받을 이들’로 관용적 뜻을 드러내고, 각주에서 ‘그것의 소유자들’이라는 직역을 제시했습니다. לְאֵל יָדֶךָ는 ‘할 수 있을 때’로 자연스럽게 옮기며 각주에서 손/능력의 이미지를 보존했습니다.
