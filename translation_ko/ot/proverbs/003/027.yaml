  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּמְנַע ט֥וֹב מִ/בְּעָלָ֑י/ו בִּ/הְי֨וֹת לְ/אֵ֖ל ידי/ך לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
  footnotes:
  - marker: a
    text: Or, 'Do not withhold good from those to whom it is due.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'when it is to the power of your hand to do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유익을 그에게서 거두지 마십시오 — 당신의 손에 그것을 행할 힘이 있을 때에.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “마땅히 받을 사람에게서 유익을 거두지 마십시오.”
    reason: alternative_reading
  - marker: b
    text: 직역하면, “당신의 손에 그것을 행할 힘이 있을 때”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  english_pob_choice: Do not withhold
  chosen_korean: 거두지 마십시오
  alternatives_korean:
  - 물러나게 하지 마십시오
  - 보류하지 마십시오
  - 아끼지 마십시오
  lexicon: HALOT
  rationale: מנע의 핵심 의미는 '막다/제지하다/거두어 두다'이며, 여기서는 의무적으로 내어줄 수 있는 선을 거두지 않는다는 뜻을 자연스럽게 드러내기 위해 '거두지 마십시오'를 택했습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 유익
  alternatives_korean:
  - 좋은 것
  - 선한 것
  - 좋음
  lexicon: HALOT
  rationale: 문맥상 추상적 도덕성보다 실제로 다른 이에게 주어질 수 있는 선한 도움을 가리키므로, 한국어에서는 너무 넓은 '좋은 것'보다 실천적 뉘앙스가 살아 있는 '유익'이 더 자연스럽습니다.
- source_word: מִבְּעָלָיו
  english_pob_choice: from those to whom it is due
  chosen_korean: 그에게서
  alternatives_korean:
  - 마땅히 받아야 할 사람에게서
  - 그 소유자에게서
  - 그것에 권리가 있는 이에게서
  lexicon: HALOT
  rationale: 히브리어 בעליו는 직역하면 '그것의 주인들/소유자들'이지만, 이 구절에서는 마땅히 받을 권리가 있는 대상이라는 관용적 의미가 핵심이므로, 본문은 간결하게 '그에게서'로 두고 영어 POB의 관용적 해석을 반영했습니다.
- source_word: לְאֵל יָדֶךָ
  english_pob_choice: when it is in your power
  chosen_korean: 당신의 손에 그것을 행할 힘이 있을 때에
  alternatives_korean:
  - 당신의 손이 그것을 행할 수 있을 때에
  - 당신이 그것을 할 수 있을 때에
  - 당신의 능력 안에 있을 때에
  lexicon: HALOT
  rationale: 직역상 '손'은 능력/권세의 관용어이므로, POB의 'in your power'를 따라 의미를 풀되 이미지도 보존하기 위해 '당신의 손에'와 '행할 힘'을 함께 살렸습니다.
theological_decisions:
- issue: עניית 윤리 명령의 직접성
  chosen_reading: 이 구절은 단순한 권고가 아니라, 선을 줄 수 있는 상황에서 주저 없이 행하라는 직접 명령으로 읽었습니다.
  alternative_readings:
  - 일반적 지혜 조언으로 완화하여 읽는 해석
  - 상황의 여지를 크게 두는 권면으로 읽는 해석
  rationale: אַל + 미완료형 금지는 강한 금지/명령을 이루므로, 한국어도 완곡하게 흐리지 않고 명령형 높임으로 옮기는 것이 본문의 힘을 더 잘 살립니다.
  doctrine_reference: 잠언의 지혜 명령문 수사
