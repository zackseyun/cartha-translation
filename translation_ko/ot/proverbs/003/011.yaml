source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
  footnotes:
  - marker: a
    text: Or 'do not be weary of his rebuke.' The Hebrew verb can also carry the sense of becoming weary or impatient, not only loathing.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 야훼의 징계를 업신여기지 말고 그의 책망을 싫어하지 마십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 책망을 싫증내지 마십시오’로도 옮길 수 있습니다. 히브리어 동사는 싫증을 내거나 참을성을 잃는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈계
  - 교정
  - 징련
  lexicon: HALOT
  rationale: 지혜문맥의 מוּסַר은 단순한 정보 전달보다 바로잡고 훈련하는 징계의 뜻이 강하므로, 현대 한국어에서 자연스럽고 형성적 의미를 살리는 ‘징계’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사본의 하나님의 이름 יְהוָה를 직역적 호칭이 아니라 고유명으로 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: תּוֹכַחְתּוֹ
  english_pob_choice: his reproof
  chosen_korean: 그의 책망
  alternatives_korean:
  - 그의 꾸짖음
  - 그의 교정
  - 그의 훈계
  lexicon: HALOT
  rationale: תּוֹכַחַת는 말로 바로잡는 책망·경고의 뜻이 있어, ‘징계’와 구별되면서도 현대어로 분명한 ‘책망’이 적절합니다.
- source_word: תָּקֹץ
  english_pob_choice: do not loathe
  chosen_korean: 싫어하지 마십시오
  alternatives_korean:
  - 싫증내지 마십시오
  - 혐오하지 마십시오
  - 못마땅해하지 마십시오
  lexicon: HALOT
  rationale: קוּץ는 혐오, 짜증, 진저리침의 폭을 가지며, 이 절의 평행법상 ‘업신여기지 말고’와 짝을 이루는 자연스러운 현대어로 ‘싫어하지 마십시오’를 선택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 이를 일반 칭호로 바꾸지 않고 고유명 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
