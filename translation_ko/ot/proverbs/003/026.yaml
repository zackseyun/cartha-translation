base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
  footnotes:
  - marker: a
    text: Or 'the LORD will be at your side'; the Hebrew expression can be understood more literally, though here it is likely figurative for confidence or security.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 네 확신이 되시고, 네 발이 잡히지 않도록 지키실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘케셀’은 문자적으로 ‘옆구리’나 ‘허리’를 뜻할 수도 있습니다. 따라서 ‘야훼께서 네 곁에 계실 것이다’로 옮길 수도 있으나, 여기서는 문맥상 확신 또는 안전을 가리키는 비유로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: אנגלית POB가 Tetragrammaton을 고유명사로 처리하므로, 한국어도 전통 대체어인 ‘주님’보다 음역 ‘야훼’를 따라 하나님의 언약 이름을 드러냈습니다.
- source_word: בְּכִסְלֶךָ
  english_pob_choice: your confidence
  chosen_korean: 너의 신뢰
  alternatives_korean:
  - 너의 확신
  - 너의 안전
  - 너의 의지처
  lexicon: HALOT
  rationale: 문맥상 ‘엉덩이/허리’의 문자적 의미보다 비유적 의미가 우세하므로, POB의 ‘confidence/security’ 흐름을 살려 하나님을 의지하는 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: וְשָׁמַר
  english_pob_choice: and he will keep
  chosen_korean: 지키십니다
  alternatives_korean:
  - 지키실 것입니다
  - 보호하십니다
  - 지켜 주십니다
  lexicon: HALOT
  rationale: ‘keep/guard’의 보호 의미를 살리면서도, 앞절과 이어지는 격언체 약속을 현대 한국어 현재-미래형으로 간결하게 표현했습니다.
- source_word: רַגְלְךָ מִלָּכֶד
  english_pob_choice: your foot from being caught
  chosen_korean: 네 발이 잡히지 않도록
  alternatives_korean:
  - 네 발이 올무에 걸리지 않도록
  - 네 발이 덫에 걸리지 않도록
  - 네 발이 사로잡히지 않도록
  lexicon: HALOT
  rationale: 히브리어는 ‘발’ 단수와 ‘잡히다/사로잡히다’의 이미지를 갖기 때문에, 구체적 덫을 덧붙이기보다 포괄적으로 ‘잡히지 않도록’으로 옮겨 원문 범위를 지켰습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 옮겨 하나님의 고유한 언약 이름을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: POB의 일관된 원칙이 Tetragrammaton의 고유명 보존이므로, 한국어에서도 관습적 대체표현보다 स्रोत-직결성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 문장 전반의 약속체 톤
  chosen_reading: 격언의 선언적 약속을 살려 평서형으로 번역했습니다.
  alternative_readings:
  - 명령형
  - 설명형
  rationale: 본문은 권면의 근거를 제시하는 지혜문맥의 진술이므로, 한국어에서도 직접적 권면보다 신뢰와 보호에 대한 약속 진술로 유지했습니다.
  doctrine_reference: Proverbs wisdom genre
