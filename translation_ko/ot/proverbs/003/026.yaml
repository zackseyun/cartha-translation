  to: 이는 야훼께서 네 확신이 되시고, 네 발이 잡히지 않도록 지키실 것이기 때문입니다.[a]
  rationale: The revision restores the causal force of כִּי and the future force of both Hebrew imperfect verbs, while retaining the established rendering ‘야훼,’ the singular ‘네 발,’ and the broad image of being caught. The footnote now presents the lexical alternative accurately without treating it as the preferred meaning.
