base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
  footnotes:
  - marker: a
    text: Or 'my teaching.' The Hebrew torah here refers to instruction or teaching, not necessarily law in the narrow legal sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'guard my commandments.' The verb carries the sense of keeping carefully or watching over.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 내 훈계를[a] 잊지 말고, 네 마음으로 내 명령들을 지키십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가르침.’ 여기서 תּוֹרָה는 좁은 의미의 율법이라기보다 훈계와 교훈을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 명령들을 잘 지키십시오.’ 동사는 주의 깊게 지키고 보전하는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 호격의 부자(父子) 지혜 교육 형식이므로, 성중립화하지 않고 직접적인 호격인 '내 아들아'로 옮겼습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my instruction
  chosen_korean: 내 훈계
  alternatives_korean:
  - 내 율법
  - 내 가르침
  lexicon: HALOT
  rationale: 여기서 תּוֹרָה는 좁은 의미의 율법보다 지혜 문맥의 교훈/훈계를 가리키므로, 한국어로는 명령적·훈도적 뉘앙스를 살리는 '훈계'를 택했습니다.
- source_word: יִצֹּר
  english_pob_choice: keep
  chosen_korean: 지키게 하십시오
  alternatives_korean:
  - 간직하게 하십시오
  - 보호하게 하십시오
  lexicon: HALOT
  rationale: נצר의 핵심은 주의 깊게 지키고 보전하는 것이어서, 한국어에서는 '지키다'가 'keep'의 의미와 함께 감시·보존의 뉘앙스를 가장 자연스럽게 담습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속마음
  lexicon: HALOT
  rationale: 히브리어 '마음'은 사고·의지·정서의 중심이므로, 현대 한국어의 통용어인 '마음'으로 옮겨 내적 순종의 중심을 살렸습니다.
theological_decisions:
- issue: 남성 단수 호칭의 보존
  chosen_reading: 지혜 문학의 아버지-아들 권면 형식을 따라 '내 아들아'를 유지했습니다.
  alternative_readings:
  - 내 자녀야
  - 내 아이야
  rationale: 본문의 문학적·문법적 형식이 남성 단수 호격이므로, 이를 중화하지 않고 보존하는 것이 원문의 청중 이해를 더 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
