id: PRO.3.30
reference: Proverbs 3:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
  footnotes:
  - marker: a
    text: Or 'Do not quarrel with a man without cause, if he has done you no wrong.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man' may function generically here for any person.
    reason: cultural_note
translation:
  language: ko
  text: 그가 당신에게 해를 끼치지 않았다면, 아무 이유 없이 그와 다투지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תרוב
  english_pob_choice: Do not contend
  chosen_korean: 다투지 마십시오
  alternatives_korean:
  - 맞서지 마십시오
  - 다투지 말십시오
  - 변론하지 마십시오
  lexicon: HALOT
  rationale: ריב는 다투다, 다투어 맞서다, 다투어 소송하다의 넓은 뜻이 있으므로, 잠언의 훈계체에 자연스러우면서도 법적·언쟁적 갈등을 모두 포괄하는 표현으로 옮겼습니다.
- source_word: עִם אָדָם
  english_pob_choice: with a man
  chosen_korean: 사람과
  alternatives_korean:
  - 한 사람과
  - 어떤 사람과
  - 남자와
  lexicon: HALOT
  rationale: אָדָם은 여기서 특정 성별보다 일반적인 인간 상대를 가리킬 수 있으므로, 한국어에서는 문맥상 자연스럽고 일반적인 ‘사람’으로 옮겼습니다.
- source_word: חִנָּם
  english_pob_choice: without cause
  chosen_korean: 아무 이유 없이
  alternatives_korean:
  - 까닭 없이
  - 무고하게
  - 소용없이
  lexicon: HALOT
  rationale: חִנָּם의 핵심은 정당한 이유가 없음이므로, 현대 한국어에서 가장 분명하고 문어체에 맞는 ‘아무 이유 없이’로 옮겼습니다.
- source_word: גְמָלְךָ רָעָה
  english_pob_choice: if he has done you no harm
  chosen_korean: 그가 당신에게 해를 끼치지 않았다면
  alternatives_korean:
  - 그가 당신에게 악을 행하지 않았다면
  - 그가 당신에게 잘못하지 않았다면
  - 그가 당신에게 해를 입히지 않았다면
  lexicon: HALOT
  rationale: גמל은 갚다/대하다의 폭이 있고, 이 문맥에서는 רָעָה와 함께 실제적 피해를 뜻하므로 ‘해를 끼치다’가 자연스럽고 원문의 상호행위성을 잘 드러냅니다.
theological_decisions:
- issue: אָדָם의 일반적 지시와 성별 표지
  chosen_reading: ‘사람’으로 일반화해 번역하되, 특정 남성 개인으로 좁히지 않았습니다.
  alternative_readings:
  - ‘한 남자와’
  - ‘어떤 사람과’
  rationale: 지혜문학의 격언에서 אָדָם은 흔히 보편적 인간 상대를 가리키므로, 의미를 훼손하지 않으면서 현대 독자가 일반 명제로 읽도록 했습니다.
  doctrine_reference: 해석학적 일반화 원칙
- issue: 두 조건절의 관계
  chosen_reading: 첫 절의 금지와 둘째 절의 조건을 ‘— 말입니다’로 연결해, 무고한 경우의 다툼 금지를 분명히 했습니다.
  alternative_readings:
  - ‘…하지 마십시오. 그가 당신에게 해를 끼치지 않았다면.’
  - ‘…하지 마십시오. 다만 그가 당신에게 해를 끼치지 않았을 때는 제외합니다.’
  rationale: 히브리어의 조건 구조는 무고한 대립을 피하라는 수사적 예외를 형성하므로, 한국어에서도 예외 조건을 매끄럽게 드러내는 종결 표현이 가장 충실합니다.
  doctrine_reference: 문맥-수사 구조
