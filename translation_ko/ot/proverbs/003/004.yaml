  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
  footnotes:
  - marker: a
    text: Or 'humankind' or 'people'; Hebrew 'man' (אָדָם) here represents human beings in contrast with God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 하나님과 사람의 눈앞에서 은혜와 좋은 분별력을 얻게 될 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’나 ‘사람들’; 여기의 히브리어 ‘אָדָם’은 하나님과 대조되는 인간 일반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  english_pob_choice: Then you will find
  chosen_korean: 그러면 … 얻게 될 것입니다
  alternatives_korean:
  - 그리고 … 찾게 될 것입니다
  - 그리하여 … 발견할 것입니다
  lexicon: HALOT
  rationale: 지혜 문맥의 결과 진술이므로, 앞선 권면에 이어지는 귀결을 드러내는 ‘그러면’과 미래형을 사용해 자연스럽게 옮겼습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 총애
  lexicon: HALOT
  rationale: חֵן은 본래 ‘호의/은총’의 뜻이며, 한국어에서는 하나님과 사람 앞에서 받는 긍정적 호의라는 맥락을 살려 ‘은혜’로 옮겼습니다.
- source_word: וְשֵׂכֶל טוֹב
  english_pob_choice: good sense
  chosen_korean: 좋은 분별력
  alternatives_korean:
  - 좋은 이해력
  - 좋은 판단력
  - 선한 지혜
  lexicon: HALOT
  rationale: שֵׂכֶל טוֹב는 단순한 지식보다 분별과 판단의 적절함을 가리키므로, 현대 한국어에서 가장 자연스럽고 문맥에 맞는 ‘좋은 분별력’으로 표현했습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 눈앞에서
  alternatives_korean:
  - 보시기에
  - 눈에
  lexicon: HALOT
  rationale: 히브리어 관용구의 평가·인정의 뉘앙스를 살리면서 한국어로는 ‘~의 눈앞에서’가 가장 직접적이므로 유지했습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 사람들
  - 인류
  lexicon: HALOT
  rationale: 여기서는 하나님과 대비되는 인간 일반을 뜻하므로, 성별 뉘앙스를 과도하게 좁히지 않되 원뜻을 보존하는 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 대표적 인간 의미와 성별 표현
  chosen_reading: ‘사람’으로 번역해 하나님-인간 대비를 유지합니다.
  alternative_readings:
  - ‘남자’
  - ‘인간’
  - ‘사람들’
  rationale: 본문은 하나님과 인간의 평가를 대조하는 지혜 격언이므로, 대표적 인간 의미를 보존하면서도 한국어에서 덜 남성 중심적으로 읽히는 ‘사람’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; contested terms for אָדָם'
