id: PRO.3.15
reference: Proverbs 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
  footnotes:
  - marker: a
    text: Or 'rubies'; the Hebrew term likely refers more generally to precious gems or jewels, and its exact identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 보석보다 더 귀하고, 당신의 어떤 즐거움도 그녀와 견줄 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְקָרָה
  english_pob_choice: more precious
  chosen_korean: 더 귀하고
  alternatives_korean:
  - 더 값지고
  - 더 소중하고
  - 더 귀한
  lexicon: HALOT
  rationale: 비교 구문이므로 ‘precious’의 가치를 드러내는 비교형으로 옮겼습니다. ‘귀하다’가 문맥상 지혜의 뛰어남과 고귀함을 자연스럽게 담습니다.
- source_word: מִפְּנִינִים
  english_pob_choice: than jewels
  chosen_korean: 보석보다
  alternatives_korean:
  - 루비보다
  - 진주보다
  - 귀한 보석보다
  lexicon: HALOT
  rationale: 히브리어 פְּנִינִים는 정확한 보석 종류가 불확실하므로, 의미 범위를 살린 ‘보석’이 가장 안전합니다.
- source_word: חֲפָצֶיךָ
  english_pob_choice: your delights
  chosen_korean: 당신의 어떤 즐거움도
  alternatives_korean:
  - 당신의 어떤 소원도
  - 당신이 좋아하는 어떤 것들도
  - 당신의 어떤 기쁨도
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘원하는 것/즐기는 것’의 객관적 대상이므로, 주관적 욕망보다는 문맥에 맞는 ‘즐거움’으로 옮겼습니다.
- source_word: לֹא יִשְׁווּ בָהּ
  english_pob_choice: can compare with her
  chosen_korean: 그녀와 견줄 수 없습니다
  alternatives_korean:
  - 그녀와 같을 수 없습니다
  - 그녀와 비교될 수 없습니다
  - 그녀와 맞먹을 수 없습니다
  lexicon: HALOT
  rationale: שוה는 ‘같다, 견줄 만하다’의 뜻이므로, 한국어에서는 비교 가능성의 부정을 자연스럽게 드러내는 ‘견줄 수 없습니다’가 적절합니다.
theological_decisions:
- issue: 지혜의 인격화 유지
  chosen_reading: ‘그녀’로 번역하여 지혜를 여성 인격으로 유지했습니다.
  alternative_readings:
  - ‘그것’으로 무성화
  - ‘지혜는’으로 반복
  rationale: 본문의 히브리어 대명사 הִיא는 여성 단수로, 바로 앞뒤 문맥의 지혜를 가리킵니다. 인격화를 지우지 않는 것이 स्रोत의 수사와 신학적 강조를 더 잘 보존합니다.
  doctrine_reference: 잠언 1–9장의 지혜 인격화
- issue: 비교의 절대적 우월성
  chosen_reading: 지혜의 가치를 보석과 모든 즐거움보다도 우위에 두는 비교를 그대로 살렸습니다.
  alternative_readings:
  - 가치가 크다고 완화
  - 단순히 귀하다고 축소
  rationale: 본문은 단순한 칭찬이 아니라 모든 다른 즐거움과의 비교 불가능성을 말하므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 잠언 3:13-18의 지혜 찬가
