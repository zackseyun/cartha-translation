translation:
  language: ko
  text: 그러면 길을 안전히[a] 걸을 것이며, 발이 걸려 넘어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לָבֶטַח는 ‘안전하게’ 또는 ‘안심하고’로도 옮길 수 있습니다.
