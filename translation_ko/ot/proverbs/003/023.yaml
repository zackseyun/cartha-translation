  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
  footnotes:
  - marker: a
    text: Or 'in safety.' The Hebrew phrase can be rendered more literally as 'in security' or 'in safety.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 당신의 길을 안전하게 걸을 것이며, 당신의 발이 걸려 넘어지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: לָבֶטַח는 ‘안전하게’ 또는 ‘안심하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때에는
  alternatives_korean:
  - 그러면
  - 그리하면
  lexicon: HALOT
  rationale: 앞 절의 결과를 이어 주는 시간·결과 접속을 자연스러운 한국어로 살리되, 문어체의 연결감을 유지하기 위해 ‘그때에는’으로 옮겼습니다.
- source_word: תֵּלֵךְ לָבֶטַח
  english_pob_choice: you will walk securely
  chosen_korean: 안전하게 걸을 것이며
  alternatives_korean:
  - 안심하고 걸을 것이며
  - 평안히 걸을 것이며
  lexicon: HALOT
  rationale: לָבֶטַח의 객관적 안전 의미를 살려 ‘안전하게’로 옮겼고, 지혜문학의 ‘걷다’ 이미지를 유지했습니다.
- source_word: דַּרְכֶּךָ
  english_pob_choice: on your way
  chosen_korean: 당신의 길을
  alternatives_korean:
  - 당신의 길에서
  - 당신의 길 위를
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적·실제적 ‘길/행로’ 의미를 살려 한국어에서도 일반적이면서도 상징성이 있는 ‘길’을 택했습니다.
- source_word: לֹא תִגּוֹף
  english_pob_choice: will not stumble
  chosen_korean: 걸려 넘어지지 않을 것입니다
  alternatives_korean:
  - 넘어지지 않을 것입니다
  - 발을 다치지 않을 것입니다
  lexicon: HALOT
  rationale: נגף의 발-이미지와 ‘넘어짐’의 결과를 함께 살리기 위해 직역보다 자연스러운 ‘걸려 넘어지다’를 선택했습니다.
theological_decisions:
- issue: 지혜의 약속을 어떻게 표현할지
  chosen_reading: 조건에 대한 보편적 원리로 읽어, 안전과 보호의 일반적 결과를 진술하는 미래형으로 번역했습니다.
  alternative_readings:
  - 개인별 절대 보장으로 읽는 번역
  - 권면적 명령으로 완화하는 번역
  rationale: 본문은 전후 맥락의 지혜 교훈이 제시하는 삶의 원리를 말하므로, 과도한 절대화나 훈계문으로 바꾸지 않고 약속형 진술을 유지하는 것이 소스에 더 충실합니다.
  doctrine_reference: 잠언의 지혜 문학적 일반원리
- issue: ‘안전하게’의 뉘앙스
  chosen_reading: לָבֶטַח를 주관적 ‘확신’보다 객관적 ‘안전’ 중심으로 옮겼습니다.
  alternative_readings:
  - 확신하며
  - 담대하게
  rationale: 영어 POB가 ‘securely’를 택한 것도 외적 안전성을 우선한 판단이므로, 한국어에서도 심리 상태보다 보호받는 상태를 드러내는 표현이 더 적절합니다.
  doctrine_reference: HALOT 의미 범위
