  text: צֹפְנֶ֥י/הָ צָֽפַן ר֑וּחַ וְ/שֶׁ֖מֶן יְמִינ֣/וֹ יִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/016.yaml
  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
  footnotes:
  - marker: a
    text: Or more literally, 'and his right hand calls oil.' The Hebrew here is difficult; the main text follows the sense of the proverb rather than a strictly literal rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 그 여자를 억제하는 자는 바람을 억제하는 것과 같고, 그의 오른손은 기름을 움켜쥡니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘그의 오른손은 기름을 부릅니다.’ 히브리어 본문은 난해하므로, 본문은 속담의 의미를 따라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ / צָפַן
  english_pob_choice: whoever restrains her / restrains
  chosen_korean: 그 여자를 억제하는 자 / 억제하는
  alternatives_korean:
  - 그 여자를 숨기는 자 / 숨기는
  - 그 여자를 감추는 자 / 감추는
  - 그 여자를 제어하는 자 / 제어하는
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘숨기다’보다 이전 절의 다투는 아내를 붙들어 두려는 의미가 더 강하므로, 한국어에서는 ‘억제하다’로 긴장감과 통제의 뉘앙스를 살렸습니다.
- source_word: רוּחַ
  english_pob_choice: the wind
  chosen_korean: 바람
  alternatives_korean:
  - 바람
  - 영
  lexicon: HALOT
  rationale: 이 속담에서는 추상적 ‘영’이 아니라 물리적으로 붙잡을 수 없는 대상과의 비교이므로, 한국어도 직접적으로 ‘바람’으로 옮겼습니다.
- source_word: וְשֶׁמֶן
  english_pob_choice: oil
  chosen_korean: 기름
  alternatives_korean:
  - 기름
  - 올리브기름
  lexicon: HALOT
  rationale: 히브리어가 구체적으로 ‘올리브기름’까지 말하지 않으므로, 불필요한 세부를 덧붙이지 않고 기본어 ‘기름’을 택했습니다.
- source_word: יִקְרָא
  english_pob_choice: grasps / calls
  chosen_korean: 움켜쥡니다
  alternatives_korean:
  - 부릅니다
  - 외칩니다
  - 붙잡습니다
  lexicon: HALOT
  rationale: 이 동사는 본문 자체가 난해해 영어 POB도 해석적 번역을 택하고 각주를 달았으므로, 한국어 본문에서는 속담의 요지를 살리는 ‘움켜쥡니다’로 옮기고, 문자적으로는 ‘부르다/외치다’의 여지를 남깁니다.
