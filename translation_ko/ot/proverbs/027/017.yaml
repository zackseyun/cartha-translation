translation:
  language: ko
  text: 철은 철을 날카롭게 하고, 사람은 친구의 얼굴을 날카롭게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘철이 철의 얼굴을 날카롭게 한다’입니다. 이는 한 사람을 다듬고 개선한다는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל / בְּבַרְזֶל
  english_pob_choice: iron / with iron
  chosen_korean: 철은 철을
  alternatives_korean:
  - 쇠는 쇠를
  - 철로 철을
  lexicon: HALOT
  rationale: 두 절의 대칭을 살리기 위해 첫째 항과 둘째 항 모두에 같은 명사 ‘철’을 반복했고, ב 접두사의 도구적 의미는 한국어 문맥상 동사와 어순으로 자연스럽게 드러냈습니다.
- source_word: יָחַד
  english_pob_choice: sharpens
  chosen_korean: 날카롭게 하고
  alternatives_korean:
  - 갈고 닦고
  - 예리하게 하고
  lexicon: HALOT
  rationale: 동사 יָחַד의 ‘날카롭게 하다’라는 기본 의미를 직접 반영하여, 잠언의 압축된 교훈성과 감각적 이미지를 살렸습니다.
- source_word: וְאִישׁ
  english_pob_choice: a man
  chosen_korean: 사람은
  alternatives_korean:
  - 한 사람은
  - 남자는
  lexicon: HALOT
  rationale: 히브리어의 대표적 단수 표현을 한국어에서는 자연스러운 일반 인칭 ‘사람은’으로 옮겨, 성별을 과도하게 좁히지 않으면서도 격언의 보편성을 유지했습니다.
- source_word: פְּנֵי רֵעֵהוּ
  english_pob_choice: the face of his friend
  chosen_korean: 친구의 얼굴을
  alternatives_korean:
  - 친구의 낯을
  - 벗의 얼굴을
  lexicon: HALOT
  rationale: ‘얼굴’을 유지해 히브리어의 구체적 이미지를 보존했고, פְּנֵי를 추상화하지 않아 원문의 수사적 긴장을 살렸습니다.
theological_decisions:
- issue: פְּנֵי רֵעֵהוּ의 관용적 의미를 어떻게 처리할지
  chosen_reading: 직역 이미지를 유지하되 한국어에서는 ‘친구의 얼굴을 날카롭게 합니다’로 두어, 상호 연마의 의미를 독자가 자연스럽게 읽도록 했습니다.
  alternative_readings:
  - ‘친구를 다듬습니다’
  - ‘서로를 연마합니다’
  rationale: 히브리어는 문자적으로 ‘친구의 얼굴’을 말하지만, 영어 POB도 이를 관용구로 설명합니다. 본문에서는 은유를 지우지 않고, 주석 없이도 독자가 잠언의 의미를 읽을 수 있도록 충분히 투명하게 옮겼습니다.
  doctrine_reference: Translation philosophy; lexical transparency
- issue: 대표적 남성 단수 אִישׁ의 한국어 처리
  chosen_reading: ‘사람은’으로 옮겨, 원문의 대표적 단수성을 유지하면서도 현대 한국어 독자에게 보편적 교훈으로 들리게 했습니다.
  alternative_readings:
  - ‘한 남자는’
  - ‘한 사람은’
  rationale: 지혜문학의 격언 형식에서는 문법적 남성형이 보편적 인간을 대표하는 경우가 많습니다. 한국어에서는 ‘사람’이 그 기능을 가장 자연스럽게 수행합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
