  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
  footnotes:
  - marker: a
    text: Or 'Iron sharpens iron, and one man sharpens another.' The Hebrew literally says 'sharpens the face of his friend,' an idiom that may refer to improving or honing another person.
