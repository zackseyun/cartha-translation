  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
  footnotes:
  - marker: a
    text: Or 'male goats' / 'he-goats.' The Hebrew is more specific than the broader English 'goats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어린 양들은 당신의 옷이 되고, 염소들은 밭의 값이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘염소들’보다 더 구체적으로는 숫염소/수염소를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבָשִׂים
  english_pob_choice: Lambs
  chosen_korean: 어린 양들
  alternatives_korean:
  - 양들
  - 새끼 양들
  lexicon: HALOT
  rationale: 히브리어 כְּבָשִׂים은 어린 양/양을 가리킬 수 있지만, POB의 ‘Lambs’에 맞추어 어린 나이의 양이라는 뜻을 살렸습니다.
- source_word: לִלְבוּשֶׁךָ
  english_pob_choice: for your clothing
  chosen_korean: 당신의 옷이 되고
  alternatives_korean:
  - 당신의 의복이 되고
  - 당신의 옷을 위해
  lexicon: HALOT
  rationale: לְ + לְבוּשׁ은 ‘옷/의복을 위한 것’이라는 용법이므로, 자연스러운 한국어로 기능을 드러내어 ‘당신의 옷이 되고’로 옮겼습니다.
- source_word: וּמְחִיר
  english_pob_choice: the price
  chosen_korean: 값이 됩니다
  alternatives_korean:
  - 가격이 됩니다
  - 대가가 됩니다
  lexicon: HALOT
  rationale: מְחִיר는 ‘값, 대가, 구매가’를 뜻하므로, 문맥상 매매·교환의 이미지를 살려 ‘값이 됩니다’로 렌더링했습니다.
- source_word: עַתּוּדִים
  english_pob_choice: goats
  chosen_korean: 염소들
  alternatives_korean:
  - 수염소들
  - 숫염소들
  lexicon: HALOT
  rationale: 히브리어는 보다 구체적으로 숫염소를 가리키지만, 본문 흐름에서는 가축 범주를 자연스럽게 전달하는 ‘염소들’이 적절합니다.
theological_decisions:
- issue: 잠언의 평행법과 경제적 비유를 한국어에서 어떻게 보존할지
  chosen_reading: 두 평행절을 병렬적으로 살리고, ‘값’과 ‘옷’의 실용적 의미를 유지했습니다.
  alternative_readings:
  - 비유적으로 풀어 ‘생활에 필요합니다’
  - 더 설명적으로 ‘의복을 마련하게 하고 밭을 사게 합니다’
  rationale: 본문은 지혜 격언의 압축된 경제 언어를 사용하므로, 해설을 덧붙이기보다 평행 구조 자체가 전달되도록 하는 것이 source-direct합니다.
  doctrine_reference: 잠언 27:26의 지혜 문학적 평행법
