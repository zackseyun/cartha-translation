  naturalness: ‘어린 양들은 당신의 옷을 위한 것이며, 수염소들은 밭 한 필지를 살 값입니다’는 잠언의 압축된 병행 구조를 유지하면서도 현대 표준 한국어로 자연스럽습니다. 문장 종결은 합쇼체 ‘입니다’로 유지됩니다.
  terminology: כְּבָשִׂים은 ‘어린 양들’로, עַתּוּדִים는 ‘수염소들’로 옮겼습니다. 수염소라는 구체성은 본문에 반영했으므로 해당 어휘 대안 각주는 불필요합니다.
