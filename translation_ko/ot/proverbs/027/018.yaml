  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
  footnotes:
  - marker: a
    text: Or 'guards' / 'keeps' a fig tree; the Hebrew emphasizes careful, faithful attention.
    reason: lexical_alternative
  - marker: b
    text: Or 'guards his master'; the phrase refers primarily to attentive, faithful care for one's superior, not necessarily to physical protection alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 무화과나무를 돌보는 이는 그 열매를 먹고, 자기 주인을 지키는 이는 존귀를 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נצר는 여기서 ‘지키다’와 함께 ‘정성껏 돌보다’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 주인’을 뜻합니다. 문맥상 신적 호칭이 아니라 사람 상전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  english_pob_choice: tends / guards / keeps
  chosen_korean: 돌보는
  alternatives_korean:
  - 지키는
  - 간수하는
  - 돌보며 지키는
  lexicon: HALOT
  rationale: 무화과나무를 대상으로 한 נצר는 단순한 감시보다 정성껏 가꾸고 돌보는 뜻이 자연스럽습니다. 한국어 ‘돌보는’은 농경적 관리의 뉘앙스를 살리면서 잠언의 원인-결과 구조를 분명히 합니다.
- source_word: תְּאֵנָה
  english_pob_choice: fig tree
  chosen_korean: 무화과나무
  alternatives_korean:
  - 무화과
  - 무화과 나무
  lexicon: HALOT
  rationale: 대상은 열매가 아니라 나무 자체이므로 ‘무화과나무’로 구체화하는 것이 원문 이미지를 가장 잘 보존합니다.
- source_word: שֹׁמֵר אֲדֹנָיו
  english_pob_choice: watches over his master
  chosen_korean: 자기 주인을 지키는
  alternatives_korean:
  - 자기 주인을 돌보는
  - 자기 주인을 섬기는
  - 자기 주인을 간수하는
  lexicon: HALOT
  rationale: שמר는 지키다/보호하다/살피다의 범위를 가지며, 여기서는 종속된 인물의 충실한 책임을 나타냅니다. ‘지키는’은 물리적 보호로만 좁히지 않으면서도 충성스러운 돌봄을 담습니다.
- source_word: יְכֻבָּד
  english_pob_choice: will be honored
  chosen_korean: 존귀를 받습니다
  alternatives_korean:
  - 존중을 받습니다
  - 영예를 얻습니다
  - 존경을 받습니다
  lexicon: HALOT
  rationale: Pual형 כבד는 ‘영광/존귀를 받다’의 수동적 수여를 나타냅니다. 한국어에서는 ‘존귀를 받습니다’가 잠언의 간결한 결론과 잘 맞고, 단순한 평판보다 더 강한 सम्मान/명예의 뉘앙스를 살립니다.
theological_decisions:
- issue: ‘자기 주인’의 referent
  chosen_reading: 지혜 잠언 안의 인간 상전/상급자에 대한 충실한 봉사의 비유로 유지합니다.
  alternative_readings:
  - 주님/하나님에 대한 적용 가능성을 번역에 직접 반영하는 읽기
  rationale: 히브리어 אֲדֹנָיו는 본문상 신적 표지가 없고, 무화과나무 비유와 평행을 이루므로 인간적 관계로 읽는 것이 원문에 가장 충실합니다. 신학적 적용은 가능하지만 번역문에 미리 주입하지는 않습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
