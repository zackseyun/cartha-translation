  - severity: low
    issue: ‘친구의 달콤함’은 관계의 즐거움을 뜻하는 비유로는 다소 부자연스럽습니다.
    rationale: מֶתֶק의 감각적 비유는 살려야 하나, 한국어에서는 사람의 성품·관계에 ‘다정함’을 쓰는 편이 자연스럽습니다.
