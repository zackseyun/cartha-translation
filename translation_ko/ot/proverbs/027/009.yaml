  lexicon: HALOT
  rationale: הנפש를 '영혼'으로 고정하면 지나치게 종교화될 수 있어, 문맥상 내면의 깊이를 드러내는 '마음'으로 풀어 한국어 독자가 뜻을 따라가게 했습니다.
theological_decisions:
- issue: 두 번째 행의 압축된 히브리어 표현(מֵעֲצַת נָפֶשׁ)의 해석
  chosen_reading: '''마음의 조언에서''로 옮겨, 친구의 달콤함이 내면에서 우러난 신중한 권면과 관련됨을 드러냈습니다.'
  alternative_readings:
  - '''영혼의 조언에서'''
  - '''자기 조언에서'''
  - '''마음 깊은 조언에서'''
  rationale: 히브리어가 매우 압축적이어서 단일 해석을 과도하게 고정하지 않되, 문맥이 요구하는 관계적 지혜의 의미를 자연스럽게 전달하도록 했습니다.
  doctrine_reference: 잠언의 지혜문학 문맥
