  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
  footnotes:
  - marker: a
    text: Or, 'and the sweetness of a friend is better than self-counsel' (taking the phrase differently). The Hebrew of the second line is notably compact and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 기름과 향은 마음을 즐겁게 하고, 친구의 다정함은 진심 어린 조언에서 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘친구의 다정함은 스스로의 조언보다 낫습니다’로도 읽을 수 있습니다. 둘째 행의 히브리어는 매우 압축되어 있어, 전치사의 뜻과 구문의 결속을 여러 방식으로 이해할 수 있습니다.
    reason: alternative_reading
