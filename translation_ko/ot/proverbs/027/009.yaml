  text: שֶׁ֣מֶן וּ֭/קְטֹרֶת יְשַׂמַּֽח לֵ֑ב וּ/מֶ֥תֶק רֵ֝עֵ֗/הוּ מֵֽ/עֲצַת נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
  footnotes:
  - marker: a
    text: Or, 'and the sweetness of a friend is better than self-counsel' (taking the phrase differently). The Hebrew of the second line is notably compact and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 기름과 향은 마음을 즐겁게 하고, 친구의 달콤함은 마음의 조언에서 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '친구의 달콤함은 자기 조언보다 낫습니다'로도 읽을 수 있습니다(구문을 다르게 취함). 둘째 행의 히브리어는 매우 압축되어 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  english_pob_choice: oil
  chosen_korean: 기름
  alternatives_korean:
  - 향유
  - 오일
  lexicon: HALOT
  rationale: 보편적이고 직접적인 대응어로, 향과 나란히 놓인 구체적 이미지가 한국어에서도 자연스럽게 살아납니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향불
  - 분향
  - 향료
  lexicon: HALOT
  rationale: 제의적 번역어를 덧붙이기보다, 본문이 말하는 향기로운 물질의 이미지를 간결하게 살리기 위해 '향'으로 옮겼습니다.
- source_word: יְשַׂמַּח לֵב
  english_pob_choice: make the heart glad
  chosen_korean: 마음을 즐겁게 하고
  alternatives_korean:
  - 마음을 기쁘게 하고
  - 마음을 즐겁게 합니다
  lexicon: HALOT
  rationale: 히브리어의 '마음'을 그대로 살리면서 현대 한국어에서 자연스럽게 읽히는 동사구로 옮겼습니다.
- source_word: מֶתֶק רֵעֵהוּ
  english_pob_choice: the sweetness of a friend
  chosen_korean: 친구의 달콤함
  alternatives_korean:
  - 친구의 달콤함
  - 친구의 다정함
  - 친구의 부드러움
  lexicon: HALOT
  rationale: '''달콤함''은 מן맛의 비유를 유지해 앞절의 기름과 향과 어울리며, 친구 관계의 유쾌함을 직접적으로 드러냅니다.'
- source_word: מֵעֲצַת נָפֶשׁ
  english_pob_choice: comes from the counsel of the soul
  chosen_korean: 마음의 조언에서 나옵니다
  alternatives_korean:
  - 영혼의 조언에서 나옵니다
  - 마음 깊은 조언에서 나옵니다
  - 자기의 조언에서 나옵니다
  lexicon: HALOT
  rationale: הנפש를 '영혼'으로 고정하면 지나치게 종교화될 수 있어, 문맥상 내면의 깊이를 드러내는 '마음'으로 풀어 한국어 독자가 뜻을 따라가게 했습니다.
theological_decisions:
- issue: 두 번째 행의 압축된 히브리어 표현(מֵעֲצַת נָפֶשׁ)의 해석
  chosen_reading: '''마음의 조언에서''로 옮겨, 친구의 달콤함이 내면에서 우러난 신중한 권면과 관련됨을 드러냈습니다.'
  alternative_readings:
  - '''영혼의 조언에서'''
  - '''자기 조언에서'''
  - '''마음 깊은 조언에서'''
  rationale: 히브리어가 매우 압축적이어서 단일 해석을 과도하게 고정하지 않되, 문맥이 요구하는 관계적 지혜의 의미를 자연스럽게 전달하도록 했습니다.
  doctrine_reference: 잠언의 지혜문학 문맥
