  source_fidelity: 첫 행의 ‘기름’과 ‘향’, 그리고 ‘마음을 즐겁게 하다’는 원문에 충실합니다. 둘째 행은 מֵעֲצַת נָפֶשׁ의 결속과 מִן의 기능이 논쟁적이지만, 주된 읽기는 친구 관계의 즐거움이 진심에서 나온 조언과 관련된다는 뜻으로 이해할 수 있습니다. ‘마음의 조언’은 נָפֶשׁ를 기계적으로 옮긴 듯하여 한국어 의미가 불분명하므로, ‘진심 어린 조언’이 내면에서 비롯된 조언이라는 뜻을 자연스럽게 전달합니다. 대안 읽기는 각주로 유지합니다.
  naturalness: ‘친구의 달콤함’과 ‘마음의 조언’은 현대 표준 한국어에서 어색하거나 의미가 즉시 드러나지 않습니다. ‘친구의 다정함’과 ‘진심 어린 조언’은 잠언의 간결한 격언 문체를 유지하면서 자연스럽습니다.
  terminology: קְטֹרֶת에 ‘향’을 쓴 것은 한국어 성경 문체와 원문의 향기로운 물질 이미지를 잘 반영합니다. נָפֶשׁ는 이 문맥에서 실체론적 ‘영혼’으로 고정할 필요가 없으며, ‘진심 어린’은 과도한 종교적 함의를 피합니다.
