  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
  footnotes:
  - marker: a
    text: Or 'and your father’s friend.' The Hebrew conjunction can be rendered either way; 'or' is used in the main text for smoother English under a single prohibition.
    reason: lexical_alternative
  - marker: b
    text: '''Brother'' may also be understood more broadly as a close relative or kinsman.'
    reason: lexical_alternative
translation:
  language: ko
  text: 친구나 아버지의 친구를 버리지 마십시오[a]. 재난의 날에 형제의 집에 들어가지 마십시오[b]. 가까운 이웃이 먼 형제보다 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지의 친구를’. 히브리어 연결사는 ‘그리고’로도, ‘또는’으로도 옮길 수 있으나, 여기서는 하나의 금지로 묶어 자연스럽게 표현했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 문맥에 따라 친형제뿐 아니라 가까운 친족을 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ / וְרֵעַ אָבִיךָ
  english_pob_choice: your friend / your father’s friend
  chosen_korean: 친구나 아버지의 친구
  alternatives_korean:
  - 벗이나 아버지의 벗
  - 친구와 아버지의 친구
  lexicon: HALOT
  rationale: רֵעַ는 친밀한 관계의 친구·동료를 가리키므로 ‘친구’로 옮기고, ו는 금지문에서 묶인 두 대상을 자연스럽게 나열하는 의미로 처리해 ‘나’로 표현했습니다.
- source_word: אַל תַּעֲזֹב
  english_pob_choice: Do not forsake
  chosen_korean: 버리지 마십시오
  alternatives_korean:
  - 저버리지 마십시오
  - 버려 두지 마십시오
  lexicon: HALOT
  rationale: עָזַב는 관계를 끊거나 외면하는 뉘앙스가 있어, 현대 한국어에서 자연스럽고 관계적 무게를 살릴 수 있는 ‘버리다’ 계열로 옮겼습니다.
- source_word: בְּיוֹם אֵידֶךָ
  english_pob_choice: in the day of your calamity
  chosen_korean: 재난의 날
  alternatives_korean:
  - 재앙의 날
  - 환난의 날
  lexicon: HALOT
  rationale: אֵיד는 큰 불행·재난·파멸을 가리키므로, 과도하게 좁히지 않으면서도 강도를 살리는 ‘재난’이 적절합니다.
- source_word: שָׁכֵן קָרוֹב / אָח רָחוֹק
  english_pob_choice: a nearby neighbor ... a distant brother
  chosen_korean: 가까운 이웃이 먼 형제보다 더 낫습니다
  alternatives_korean:
  - 가까운 이웃이 먼 형제보다 낫습니다
  - 가까운 이웃이 멀리 있는 형제보다 더 좋습니다
  lexicon: HALOT
  rationale: שָׁכֵן קָרוֹב은 물리적 근접성을 강조하므로 ‘가까운 이웃’으로, אָח רָחוֹק은 혈연을 유지한 채 실질적 거리감을 드러내는 ‘먼 형제’로 옮겼습니다.
theological_decisions:
- issue: אָח의 범위
  chosen_reading: 주요 본문에서는 ‘형제’를 유지해 혈연 대비 이미지를 살렸습니다.
  alternative_readings:
  - 친척
  - 가까운 친족
  rationale: 잠언의 대비는 ‘가까이 있는 이웃’과 ‘멀리 있는 형제’의 역설에 있으므로, אָח을 넓혀 버리면 문장 효과와 상징적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
