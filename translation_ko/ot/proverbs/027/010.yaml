  terminology: ‘친구’, ‘재난’, ‘형제’, ‘가까운 이웃’, ‘먼 형제’는 원문의 관계적·공간적 대비를 적절히 보존합니다. ‘형제’의 친족 범위는 각주에서 제한 없이 적절히 설명됩니다.
