base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
  footnotes:
  - marker: a
    text: Or 'envy' for 'jealousy' (Hebrew קִנְאָה); the term can denote either depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 분노는 잔혹하고 노여움은 홍수이지만, 질투 앞에 누가 설 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시기’. 히브리어 קִנְאָה는 문맥에 따라 ‘질투’나 ‘시기’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  english_pob_choice: cruel
  chosen_korean: 잔혹하고
  alternatives_korean:
  - 잔인하고
  - 사납고
  lexicon: HALOT
  rationale: 명사 אַכְזְרִיּוּת의 핵심 뜻은 ‘잔혹함/잔인함’이므로, 분노를 인격화한 서술형으로 옮겨 첫 절의 단정성을 살렸습니다.
- source_word: חֵמָה
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격분
  lexicon: HALOT
  rationale: 첫 행의 חֵמָה는 강한 분노를 가리키므로 ‘분노’로 옮겼고, 다음 행의 אָף와 구별되도록 좀 더 일반적인 감정을 택했습니다.
- source_word: שֶׁטֶף
  english_pob_choice: a flood
  chosen_korean: 홍수 같으나
  alternatives_korean:
  - 넘치는 물결 같으나
  - 범람 같으나
  - 폭풍우 같으나
  lexicon: HALOT
  rationale: ‘넘쳐 흐르는 홍수/급류’의 이미지를 간결하게 살리기 위해 ‘홍수’로 옮겼습니다.
- source_word: קִנְאָה
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 질투심
  - 열심
  lexicon: HALOT
  rationale: 지혜문맥에서 파괴적 정서를 가리키는 용례에 맞춰 본문은 ‘질투’로 두었고, 영어 주해처럼 다른 가능성은 각주에서 열어 두었습니다.
theological_decisions:
- issue: 문장 종결의 수사적 긴장
  chosen_reading: 마지막 절을 질문형으로 유지해, 분노·노여움보다 더 압도적인 질투 앞에서는 아무도 설 수 없다는 경고를 그대로 드러냈습니다.
  alternative_readings:
  - 서술형으로 바꾸어 경구처럼 완화하는 번역
  - ‘감당할 수 있겠습니까?’로 기능적으로 풀어 쓰는 번역
  rationale: 히브리어 원문의 수사적 질문은 단순 정보가 아니라 경고의 효과를 지니므로, 이를 약화시키지 않고 유지했습니다.
  doctrine_reference: 지혜문학의 수사적 질문과 경구 표현
- issue: ‘קִנְאָה’의 의미 범위
  chosen_reading: 본문은 ‘질투’를 본문어로 두되, 주석에서 ‘시기’ 가능성을 열어 두었습니다.
  alternative_readings:
  - 시기
  - 열심
  rationale: 문맥상 인간 관계를 파괴하는 정서를 가리키는 쪽이 자연스럽지만, 히브리어 어휘의 다의성을 지워서는 안 되므로 대안 의미를 보존했습니다.
  doctrine_reference: 어휘 다의성 보존
