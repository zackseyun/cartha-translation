source:
  edition: WLC
  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
  footnotes:
  - marker: a
    text: Or 'riches'; חֹסֶן can denote material resources, wealth, or strength, but the context favors material wealth.
    reason: lexical_alternative
  - marker: b
    text: Or 'diadem' or possibly 'consecration'; the Hebrew נֵזֶר can carry these senses, but here likely refers to a crown as a symbol of status or rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 재물은 영원히 남지 않고, 왕관도 대대로 이어지지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재물’은 חֹסֶן이 가질 수 있는 ‘부, 재산, 힘’ 가운데 문맥상 가장 자연스러운 의미를 따른 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕관’은 נֵזֶר의 가능한 뜻인 ‘관, diadem, 왕의 지위 표징’ 가운데 이 문맥에 맞는 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹסֶן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부요
  - 재산
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘힘’보다 물질적 자원이라는 뜻이 더 자연스러우므로, 현대 한국어에서 널리 이해되는 ‘재물’로 옮겼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 부정문과 결합한 비지속성을 간결하게 살리기 위해 ‘영원히’로 옮겼습니다.
- source_word: נֵזֶר
  english_pob_choice: crown
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 면류관
  - 왕의 관
  lexicon: HALOT
  rationale: 문맥에서 지위와 통치를 상징하는 구체적 이미지가 중요하므로, 일반적 ‘관’보다 의미가 분명한 ‘왕관’으로 옮겼습니다.
- source_word: לְדוֹר דּוֹר
  english_pob_choice: from generation to generation
  chosen_korean: 대대로 이어지지
  alternatives_korean:
  - 대대에 걸쳐
  - 세세대대로
  lexicon: HALOT
  rationale: 반복 구조가 전하는 세대 간 지속을 한국어 관용으로 자연스럽게 살리되, ‘이어지다’를 써서 지속성을 분명히 했습니다.
theological_decisions:
- issue: נֵזֶר의 의미 범위
  chosen_reading: 왕관으로 번역해, 지속될 것처럼 보이는 지위나 통치의 상징을 가리키게 했습니다.
  alternative_readings:
  - 거룩하게 구별됨
  - 관(일반적 왕관)
  rationale: 이 절은 재물과 더불어 세습적 지위의 불확실성을 병렬로 말하므로, 제의적 의미보다 왕권 상징을 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 잠언의 지혜 문맥과 히브리어 시적 평행법
