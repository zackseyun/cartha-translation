theological_decisions:
- issue: נֵזֶר의 의미 범위
  chosen_reading: 왕관으로 번역해, 지속될 것처럼 보이는 지위나 통치의 상징을 가리키게 했습니다.
  alternative_readings:
  - 거룩하게 구별됨
  - 관(일반적 왕관)
  rationale: 이 절은 재물과 더불어 세습적 지위의 불확실성을 병렬로 말하므로, 제의적 의미보다 왕권 상징을 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 잠언의 지혜 문맥과 히브리어 시적 평행법
