    rationale: ‘둥지에서 떠도는’과 ‘자기 자리에서 떠도는’은 각 장소 안에서 떠도는 것으로도 읽힐 수 있습니다. ‘떠나 떠도는’은 מִן의 이탈 의미를 한국어에서 분명히 합니다.
