  to: 둥지를 떠나 떠도는 새처럼, 제 자리를 떠나 떠도는 사람도 그러합니다.[a]
  rationale: 동일한 히브리어 동사 נוד가 두 행에서 반복되는 점을 한국어 ‘떠돌다’의 반복으로 보존했습니다. ‘떠나 떠도는’은 מִן(‘~에서/부터’)이 나타내는 이탈을 자연스럽게 드러내면서도, ‘제 자리’가 지닌 장소·처지·마땅한 위치의 의미 범위를 좁히지 않습니다. 각주도 해당 어휘의 넓은 범위를 간결하고 정확하게 설명하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:46Z'
