  text: כְּ֭/צִפּוֹר נוֹדֶ֣דֶת מִן קִנָּ֑/הּ כֵּֽן אִ֝֗ישׁ נוֹדֵ֥ד מִ/מְּקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
  footnotes:
  - marker: a
    text: Or 'a person who wanders from his home'; Hebrew 'from his place' is broader and may include one's proper location or station, not only a house.
    reason: lexical_alternative
translation:
  language: ko
  text: 둥지를 떠나 떠도는 새처럼, 제 자리를 떠나 떠도는 사람도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 자리’는 히브리어 마콤(‘장소’)의 폭넓은 뜻을 살린 표현입니다. 이는 집만이 아니라 사람이 있어야 할 위치나 맡은 자리까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפּוֹר / like a bird
  english_pob_choice: Like a bird
  chosen_korean: 새가
  alternatives_korean:
  - 참새가
  - 새 한 마리가
  lexicon: HALOT
  rationale: צִפּוֹר는 특정 종이 아니라 일반적인 ‘새’를 가리키므로, 한국어도 과도하게 특정화하지 않고 자연스럽게 ‘새’로 옮겼습니다.
- source_word: נוֹדֶדֶת / that wanders
  english_pob_choice: that wanders
  chosen_korean: 헤매듯이
  alternatives_korean:
  - 방황하듯이
  - 떠돌듯이
  lexicon: HALOT
  rationale: 동사 נוד는 단순 이동보다 불안정하게 떠돌거나 헤매는 뉘앙스를 담으므로, 속담의 그림을 살려 ‘헤매다’로 옮겼습니다.
- source_word: מִן קִנָּהּ / from its nest
  english_pob_choice: from its nest
  chosen_korean: 둥지에서
  alternatives_korean:
  - 보금자리에서
  - 둥지를 떠나
  lexicon: HALOT
  rationale: קֵן은 새의 ‘둥지’이므로 직접적이고 분명한 한국어 표현을 택했습니다. ‘보금자리’는 정서적 뉘앙스가 강해 원문의 이미지보다 부드러워집니다.
- source_word: מִמְּקוֹמוֹ / from his place
  english_pob_choice: from his place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 자기 있는 곳에서
  - 자기 처소에서
  lexicon: HALOT
  rationale: מָקוֹם은 단순한 주거지만이 아니라 자리, 위치, 마땅한 처소까지 포함하는 넓은 표현이므로, 영어 주해의 범위를 반영해 ‘자리’로 옮겨 의미의 폭을 살렸습니다.
theological_decisions:
- issue: אִישׁ의 대표적 남성 단수 표현
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 어떤 사람
  rationale: 히브리어는 남성 단수 형태이지만, 속담의 일반 진술이라는 점에서 한국어에서는 대표적 인간을 가리키는 중립적 ‘사람’이 가장 자연스럽습니다. 성별 정보는 본문의 핵심 의미가 아니므로 과도하게 드러내지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
