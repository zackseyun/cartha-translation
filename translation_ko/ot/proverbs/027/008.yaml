  source_fidelity: ‘헤매다’는 길을 잃거나 판단에 혼란을 겪는다는 뜻을 흔히 수반하여, 원문의 נוד가 이루는 ‘떠돌다/방랑하다’의 병행을 충분히 살리지 못합니다. 또한 ‘둥지에서/자기 자리에서 헤매다’는 해당 장소 안에서 헤매는 뜻으로도 읽힐 수 있습니다.
  naturalness: ‘그와 같습니다’는 뜻은 통하지만 잠언의 비교 문장에서는 다소 장황합니다. ‘그러합니다’가 현대 한국어 합쇼체의 격식과 간결한 잠언 문체에 더 잘 맞습니다.
  terminology: צִפּוֹר는 ‘새’, קֵן은 ‘둥지’로 적절합니다. מָקוֹם의 넓은 의미를 위해 ‘제 자리’를 유지할 수 있습니다. אִישׁ은 이 일반적 잠언 진술에서 자연스러운 대표 표현인 ‘사람’으로 옮겨도 원문의 의미를 손상하지 않습니다.
