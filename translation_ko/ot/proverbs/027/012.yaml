id: PRO.27.12
reference: Proverbs 27:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
  footnotes:
  - marker: a
    text: Or 'are punished.' The Hebrew can express suffering penalty or bearing the consequences.
    reason: lexical_alternative
translation:
  language: ko
  text: 슬기로운 사람은 위험을 보고 몸을 숨기지만, 어리석은 자들은 그냥 지나가다가 벌을 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌을 받습니다.’ 히브리어는 형벌을 받는 것과 그 결과를 겪는 것을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  english_pob_choice: prudent man
  chosen_korean: 슬기로운 사람
  alternatives_korean:
  - 신중한 사람
  - 지혜로운 사람
  - 교활한 사람
  lexicon: HALOT
  rationale: 이 단어는 잠언에서 긍정적으로 쓰이는 경우가 많아, 부정적 뉘앙스의 ‘교활한’은 피하고 문맥에 맞는 분별과 신중함을 살린 ‘슬기로운 사람’으로 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: danger
  chosen_korean: 위험
  alternatives_korean:
  - 재앙
  - 악
  - 해
  lexicon: HALOT
  rationale: 문맥상 도덕적 ‘악’보다 미리 피할 수 있는 해악이나 곤경을 가리키므로, 한국어에서 자연스럽고 실용적인 ‘위험’이 적절합니다.
- source_word: נִסְתָּר
  english_pob_choice: hides himself
  chosen_korean: 몸을 숨기다
  alternatives_korean:
  - 자신을 숨기다
  - 숨다
  - 숨는다
  lexicon: HALOT
  rationale: 니팔형의 반사적 의미를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘몸을 숨기다’로 옮겼습니다.
- source_word: נֶעֱנָשׁוּ
  english_pob_choice: suffer for it
  chosen_korean: 벌을 받습니다
  alternatives_korean:
  - 그 대가를 치릅니다
  - 고통을 겪습니다
  - 징벌을 받습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 감정적 고통보다 결과로서의 제재나 처벌을 포함할 수 있으므로, 영어 POB의 유보를 유지하되 한국어에서는 가장 직접적인 ‘벌을 받다’로 번역했습니다.
theological_decisions:
- issue: ‘simple’의 번역 톤
  chosen_reading: ‘어리석은 자들’로 번역해 잠언의 대조 구조를 분명히 했습니다.
  alternative_readings:
  - ‘순진한 사람들’
  - ‘미련한 자들’
  rationale: פְּתָאיִם은 경험과 분별이 부족한 사람들을 가리키므로, 현대 한국어에서 의미 대비가 선명한 표현을 택했습니다.
  doctrine_reference: 잠언의 지혜-어리석음 대조
