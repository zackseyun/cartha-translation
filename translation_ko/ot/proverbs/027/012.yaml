    rationale: 히브리어 니팔형은 처벌을 받는 뜻과 결과적으로 손해·고난을 겪는 뜻을 모두 낼 수 있습니다. 영어 감사 기록도 이 모호성을 명시합니다. 따라서 본문은 포괄적 표현을 택하고 처벌 의미를 각주로 제시해야 합니다.
  - severity: low
    issue: ‘어리석은 자들’은 פְּתָאיִם의 의미를 다소 강하게 번역합니다.
    rationale: 이 단어는 지혜문학에서 경험과 분별이 부족하여 쉽게 행동하는 사람들을 가리킵니다. ‘분별없는 사람들’은 원문의 대조를 유지하면서도 불필요하게 강화하지 않습니다.
