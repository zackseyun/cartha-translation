id: PRO.27.20
reference: Proverbs 27:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁא֣וֹל ו/אבדה לֹ֣א תִשְׂבַּ֑עְנָה וְ/עֵינֵ֥י הָ֝/אָדָ֗ם לֹ֣א תִשְׂבַּֽעְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
  footnotes:
  - marker: a
    text: Or 'Destruction.' Hebrew Abaddon can denote destruction or the place/personified realm of destruction.
    reason: lexical_alternative
  - marker: b
    text: '''Man'' here is generic, referring to human beings generally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스올과 아바돈[a]은 결코 만족하지 않으며, 사람[b]의 눈도 결코 만족하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아바돈’은 ‘멸망’ 또는 ‘멸망의 곳’으로도 옮길 수 있습니다. 히브리어 אֲבַדָּה는 파괴, 멸망, 또는 파괴의 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘사람’은 특정한 남자가 아니라 인간 일반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  lexicon: HALOT
  rationale: 히브리어 שְׁאוֹל의 고유 개념을 유지하기 위해 음역했습니다. ‘무덤’이나 ‘지옥’으로 풀면 단어가 지닌 음부/죽은 자의 영역이라는 폭넓은 의미와 후대 교리적 연상을 함께 잃기 쉽습니다.
- source_word: אֲבַדָּה
  english_pob_choice: Abaddon
  chosen_korean: 아바돈
  alternatives_korean:
  - 멸망
  - 멸망의 곳
  lexicon: HALOT
  rationale: 시적 평행을 살리기 위해 음역을 유지했습니다. 이 말은 파괴 자체 또는 파괴의 영역을 가리킬 수 있으므로, 본문에서는 고유명사처럼 남겨 의미의 여지를 보존했습니다.
- source_word: לֹא תִשְׂבַּעְנָה
  english_pob_choice: are never satisfied
  chosen_korean: 결코 만족하지 못합니다
  alternatives_korean:
  - 만족하지 않습니다
  - 배부르지 않습니다
  lexicon: HALOT
  rationale: שׂבע의 ‘충분히 차서 만족하다’는 뜻을 한국어 관용에 맞게 옮겼습니다. 속담체의 단호한 반복을 살리기 위해 ‘결코’로 부정의 강도를 유지했습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 남자
  lexicon: HALOT
  rationale: 히브리어 단수형 אדם의 일반적·대표적 의미를 현대 한국어에서 자연스럽게 드러내기 위해 ‘사람’으로 옮겼습니다. 남성 한정이 아니라 인간 일반을 가리키는 점을 보존하면서도 속담의 간결성을 유지합니다.
theological_decisions:
- issue: 스올과 아바돈의 대응을 어떻게 살릴 것인가
  chosen_reading: 두 용어를 모두 음역해 병렬 구조와 개념적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘무덤과 멸망’으로 의미 번역
  - ‘음부와 멸망’으로 혼합 번역
  rationale: 본문은 사망/파괴의 영역이 끝없이 탐욕스럽다는 지혜문학적 비유를 압축적으로 제시합니다. 용어를 풀어버리면 평행법의 밀도와 전통적 개념어의 범위가 좁아질 수 있어, 원문 어휘의 강도를 유지하는 쪽을 택했습니다.
  doctrine_reference: 지혜문학의 시적 평행과 어휘 보존 원칙
- issue: הָאָדָם의 일반적 의미를 어떻게 반영할 것인가
  chosen_reading: ‘사람’으로 번역해 인간 일반을 가리키는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘인간’
  - ‘사람들’
  rationale: 히브리어 단수형이지만 일반적 의미로 쓰인 경우이므로, 한국어에서도 단수의 대표성을 유지하는 표현이 적절합니다. ‘사람’은 현대 독자에게 자연스럽고, 남성 중심으로 오해될 가능성도 줄입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
