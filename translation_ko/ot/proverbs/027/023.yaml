  yaml_path: translation/ot/proverbs/027/023.yaml
  text: Know well the condition of your flock[b][a]; set your heart on the herds.
  footnotes:
  - marker: a
    text: Literally, 'Know, know the face of your flock'; the Hebrew expression means to know their condition well.
    reason: lexical_alternative
  - marker: b
    text: Or 'set your heart on the flocks.' The final term can overlap in sense with 'flock' or 'herd,' referring generally to groups of livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 자신의 가축 떼의 형편을 잘 살피십시오[a]. 가축 무리들에 마음을 두십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 가축 떼의 얼굴을 반드시 알라’입니다. 여기서 ‘얼굴’은 가축 떼의 보이는 상태나 형편을 뜻하며, ‘가축 떼’는 양과 염소를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가축 무리들’은 ‘떼들’ 또는 ‘목축 무리들’로도 옮길 수 있습니다. 히브리어 단어는 앞 절의 ‘가축 떼’와 의미가 겹치지만 더 넓은 가축 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
