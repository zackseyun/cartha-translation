base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/023.yaml
  text: Know well the condition of your flock[b][a]; set your heart on the herds.
  footnotes:
  - marker: a
    text: Literally, 'Know, know the face of your flock'; the Hebrew expression means to know their condition well.
    reason: lexical_alternative
  - marker: b
    text: Or 'set your heart on the flocks.' The final term can overlap in sense with 'flock' or 'herd,' referring generally to groups of livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 양 떼의 형편을 잘 알아보십시오[a]; 당신의 마음을 무리들에 두십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 양 떼의 얼굴을 알라, 알라’에 가깝지만, 관용적으로는 그 형편을 잘 살피라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 단어는 ‘떼들’ 또는 ‘무리들’의 뜻으로 넓게 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  english_pob_choice: Know well
  chosen_korean: 잘 알아보십시오
  alternatives_korean:
  - 반드시 아십시오
  - 분명히 아십시오
