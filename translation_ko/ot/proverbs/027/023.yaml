  lexicon: HALOT
  rationale: 부정사 절대형과 동사 반복이 주는 강조를 한국어의 자연스러운 명령형으로 살리되, 직역적 반복보다 의미상 강세를 담는 표현으로 옮겼습니다.
- source_word: פְּנֵי
  english_pob_choice: the condition of
  chosen_korean: 형편
  alternatives_korean:
  - 얼굴
  - 모습
  - 상태
  lexicon: HALOT
  rationale: ‘얼굴’의 문자적 의미보다 문맥상 가축 떼의 보이는 형편·상태를 가리키므로, 한국어에서는 ‘형편’이 가장 자연스럽고 오해가 적습니다.
- source_word: צֹאנְךָ
  english_pob_choice: your flock
  chosen_korean: 당신의 양 떼
  alternatives_korean:
  - 당신의 떼
  - 당신의 양 무리
  - 당신의 작은 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함할 수 있지만, 한국어 속담적 표현에서는 ‘양 떼’가 관용적이며 목양의 이미지를 잘 전달합니다.
- source_word: לַעֲדָרִים
  english_pob_choice: the herds
  chosen_korean: 무리들
  alternatives_korean:
  - 떼들
  - 가축 무리들
  - 양 떼들
  lexicon: HALOT
  rationale: 앞의 צֹאן과 완전히 같은 단어를 반복하지 않으면서, 더 넓은 집단적 가축 무리를 가리키는 뜻을 한국어에서 유연하게 살리기 위해 ‘무리들’로 옮겼습니다.
