  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲכַ֣ם בְּ֭נִ/י וְ/שַׂמַּ֣ח לִבִּ֑/י וְ/אָשִׁ֖יבָה חֹרְפִ֣/י דָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and I may return a word to the one who reproaches me'—that is, 'answer the one who reproaches me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Become wise, my son.' The Hebrew imperative can emphasize either a state ('be wise') or the pursuit of wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로우십시오,[a] 내 아들아. 그리고 내 마음을 기쁘게 하십시오. 그러면 내가 나를 비난하는 사람에게 대답하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜롭게 되십시오.’ 히브리어 명령형은 지혜로운 상태에 있으라는 뜻이나 지혜를 얻어 가라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내가 나를 비난하는 사람에게 한 마디를 되돌려 주겠다’입니다. 이는 ‘대답하다’라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  english_pob_choice: Be wise
  chosen_korean: 지혜롭고
  alternatives_korean:
  - 지혜로우십시오
  - 지혜롭게 되십시오
  lexicon: HALOT
  rationale: 히브리어 남성 단수 명령형 חכם의 권고를 한국어 합쇼체로 자연스럽게 옮겼습니다. 형상상 ‘지혜롭게 행동하라’보다 상태 권면의 힘을 살려 ‘지혜롭다’로 표현했습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: בן + 1인칭 단수 소유격은 문자적으로 ‘내 아들’이므로, 지혜문학의 직접 호칭을 살려 유지했습니다.
- source_word: וְשַׂמַּח לִבִּי
  english_pob_choice: and make my heart glad
  chosen_korean: 내 마음을 기쁘게 하십시오
  alternatives_korean:
  - 내 마음을 즐겁게 하십시오
  - 내 마음을 기쁘게 해 주십시오
  lexicon: HALOT
  rationale: 사역형 שמח와 목적어 ‘내 마음’을 살리되, 한국어에서는 ‘마음을 기쁘게 하다’가 가장 자연스럽고 구체적입니다.
- source_word: חֹרְפִי דָבָר
  english_pob_choice: answer the one who reproaches me
  chosen_korean: 나를 꾸짖는 사람에게 대답할 수 있습니다
  alternatives_korean:
  - 나를 조롱하는 사람에게 응답할 수 있습니다
  - 나를 비난하는 사람에게 답할 수 있습니다
  lexicon: HALOT
  rationale: שׁוב + דבר의 관용구를 직역하면 ‘한 말을 돌려주다’이지만, POB의 해석을 따라 자연스러운 ‘대답하다’로 옮겼습니다. חָרַף는 맥락상 조롱/모욕보다 ‘꾸짖다’가 가장 직접적입니다.
theological_decisions:
- issue: 잠언의 지혜 호소에서 1인칭 목적구가 전달하는 관계적 뉘앙스
  chosen_reading: ‘내 마음을 기쁘게 하십시오’와 ‘내 아들아’의 직접 호칭을 유지해, 지혜로운 아들의 행동이 아버지의 명예와 기쁨에 연결된다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘나를 기쁘게 하십시오’로 평탄화
  - ‘내 아이야’로 중립화
  rationale: 본문은 단순한 도덕 권면이 아니라, 아들의 지혜가 아버지의 체면과 응답 능력에 직접 연결되는 지혜 전통의 관계 구조를 드러냅니다.
  doctrine_reference: 지혜문학의 교육적-언약적 관계 구조
