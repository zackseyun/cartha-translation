  text: נֶ֭אֱמָנִים פִּצְעֵ֣י אוֹהֵ֑ב וְ֝/נַעְתָּר֗וֹת נְשִׁיק֥וֹת שׂוֹנֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/006.yaml
  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
  footnotes:
  - marker: a
    text: Or 'profuse'; the sense may be that an enemy's kisses are overabundant and therefore insincere or deceptive.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구의 상처는 신실하지만, 원수의 입맞춤은 지나칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “풍부한”; 문맥상 원수의 입맞춤이 지나치게 많아 오히려 진실하지 않거나 속임수일 수 있다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱמָנִים
  english_pob_choice: faithful
  chosen_korean: 신실하지만
  alternatives_korean:
  - 믿을 만하지만
  - 신뢰할 만하지만
  - 충실하지만
  lexicon: HALOT
  rationale: 형용사 נֶאֱמָנִים의 핵심은 신뢰할 수 있음, 변함없음의 뜻이므로, 짧은 잠언형 문맥에서 '신실하다'가 가장 응축되며 도덕적 뉘앙스를 잘 살립니다.
- source_word: פִּצְעֵי
  english_pob_choice: wounds
  chosen_korean: 상처는
  alternatives_korean:
  - 상처들
  - 상해는
  - 상처받은 흔적은
  lexicon: HALOT
  rationale: פִּצְעֵי는 문자적으로 상처·부상을 뜻하므로, 은유적 권면의 통증까지 포괄할 수 있는 '상처'가 적절합니다.
- source_word: אוֹהֵב
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 사랑하는 이
  - 사랑하는 사람
  - 벗
  lexicon: HALOT
  rationale: 잠언의 대조 구조에서 '원수'와 대응하는 관계어로는 '친구'가 가장 자연스럽고, 히브리어 분사형의 사랑하는 사람이라는 의미도 충분히 전달합니다.
- source_word: וְנַעְתָּרוֹת
  english_pob_choice: excessive
  chosen_korean: 지나칩니다
  alternatives_korean:
  - 과도합니다
  - 넘칩니다
  - 풍부합니다
  lexicon: HALOT
  rationale: 이 형태는 '풍부한/과도한' 뜻과, 문맥상 '지나치게 넘치는' 인상을 함께 가질 수 있으므로, 본문은 과잉과 부자연스러움을 함축하는 '지나칩니다'로 옮겼습니다.
- source_word: נְשִׁיקוֹת
  english_pob_choice: kisses
  chosen_korean: 입맞춤은
  alternatives_korean:
  - 키스는
  - 입맞춤들는
  - 입맞춤들은
  lexicon: HALOT
  rationale: נְשִׁיקוֹת는 문자적으로 '입맞춤들'이지만, 현대 한국어 합쇼체 잠언 문맥에서는 '입맞춤'이 자연스럽고 문학적인 대응입니다.
- source_word: שׂוֹנֵא
  english_pob_choice: enemy
  chosen_korean: 원수의
  alternatives_korean:
  - 미워하는 이의
  - 적의
  - 원한 품은 자의
  lexicon: HALOT
  rationale: 분사형 '미워하는 자'의 직역보다 잠언의 대립쌍인 '친구/원수'가 한국어에서 더 응축되고 분명한 의미 대조를 만듭니다.
theological_decisions:
- issue: 잠언의 도덕적 역설 표현
  chosen_reading: 사랑에서 비롯된 상처는 참되며, 적의 과도한 애정 표현은 신뢰할 수 없다는 역설을 그대로 유지했습니다.
  alternative_readings:
  - 친구의 상처는 믿을 만하다로 완화
  - 원수의 입맞춤을 단순한 거짓 애정으로 해석해 본문을 풀어씀
  rationale: 본문은 고통스러운 책망이 오히려 충실한 사랑의 표지일 수 있음을 말하며, 반대로 적의 과잉된 애정은 의심스럽다는 긴장을 유지합니다. 이 대조를 약화시키지 않도록 직설적 잠언 형태를 보존했습니다.
  doctrine_reference: 잠언 문학의 지혜 대조와 분별의 교훈
