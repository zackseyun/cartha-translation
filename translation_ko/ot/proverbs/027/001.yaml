  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
  footnotes:
  - marker: a
    text: Literally, 'what a day will give birth to' or 'produce.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내일을 자랑하지 마십시오. 하루가 무엇을 가져올지 알지 못하기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하루가 무엇을 낳을지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  english_pob_choice: boast
  chosen_korean: 자랑하지 마십시오
  alternatives_korean:
  - 뽐내지 마십시오
  - 스스로를 높이지 마십시오
  lexicon: HALOT
  rationale: 히트파엘형의 자기과시·자기영광을 경계하는 뜻을 살려, 현대 한국어에서 자연스럽고 경고의 뉘앙스가 분명한 ‘자랑하다’를 택했습니다.
- source_word: בְּיוֹם מָחָר
  english_pob_choice: about tomorrow
  chosen_korean: 내일을
  alternatives_korean:
  - 내일에 대하여
  - 내일에 관하여
  lexicon: HALOT
  rationale: 히브리어의 ‘내일’ 지시 대상을 한국어에서는 직접 목적어형으로 자연스럽게 옮겨, 자랑의 대상이 ‘내일’임을 분명히 했습니다.
- source_word: מַה יֵּלֶד יּוֹם
  english_pob_choice: what a day may bring
  chosen_korean: 하루가 무엇을 낳을지
  alternatives_korean:
  - 하루가 무엇을 생산할지
  - 하루가 무엇을 출산할지
  lexicon: HALOT
  rationale: יָלַד의 문자적 ‘낳다/해산하다’ 이미지를 살리되, 한국어에서 문맥상 이해되는 표현으로 ‘무엇을 낳을지’라고 옮겨 원문의 은유를 보존했습니다.
theological_decisions:
- issue: 미래에 대한 자기확신을 경계하는 잠언의 권고어조
  chosen_reading: 명령형 경고를 살려 반말보다 정중한 금지형 ‘-지 마십시오’로 옮겼습니다.
  alternative_readings:
  - ‘자랑하지 마라’
  - ‘자랑하지 말라’
  rationale: 잠언의 보편적 교훈을 현대 표준어 합쇼체로 전달하면서도, 원문의 단호한 금지를 약화시키지 않기 위한 선택입니다.
  doctrine_reference: 잠언의 지혜 교훈과 인간의 제한된 지식에 대한 일반계시적 통찰
- issue: ‘무엇을 낳을지’의 은유 보존 여부
  chosen_reading: 직역적 은유를 유지해 미래의 불확실성과 결과의 미지성을 드러냈습니다.
  alternative_readings:
  - ‘무엇을 가져올지’
  - ‘무슨 일이 일어날지’
  rationale: 원문은 단순한 시간 언급이 아니라 ‘날’이 산출하는 결과를 말하므로, 은유를 지워 버리는 매끈한 의역보다 원문 감각을 보존하는 쪽을 택했습니다.
  doctrine_reference: 섭리 앞에서 인간의 제한성과 겸손
