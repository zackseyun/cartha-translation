  terminology: ‘자랑하지 마십시오’는 תִּתְהַלֵּל의 자기과시 금지를 적절히 옮깁니다. ‘가져오다’는 יָלַד의 비유적 결과 산출 의미를 자연스럽게 전달하며, 문자적 출산 이미지는 각주에서 밝혀야 합니다.
