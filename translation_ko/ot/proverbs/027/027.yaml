id: PRO.27.27
reference: Proverbs 27:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דֵ֤י חֲלֵ֬ב עִזִּ֗ים לְֽ֭/לַחְמְ/ךָ לְ/לֶ֣חֶם בֵּיתֶ֑/ךָ וְ֝/חַיִּ֗ים לְ/נַעֲרוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
  footnotes:
  - marker: a
    text: Or 'and life for your maidservants.' The Hebrew literally says 'and lives/life for your young women/servant girls,' using 'life' in the sense of what sustains life.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bread' in both occurrences likely means food or provision more generally, not bread alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 염소의 젖이 너의 음식[a]과 네 집의 음식[b]과 네 여종들의 생명이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너의 빵’을 말하지만, 여기서는 음식 또는 양식을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘집의 빵’을 말하지만, 여기서는 가정의 먹을거리, 곧 생계 공급을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי חֲלֵב עִזִּים
  english_pob_choice: And there will be enough goats’ milk
  chosen_korean: 염소의 젖이 … 될 것입니다
  alternatives_korean:
  - 염소젖이 … 될 것입니다
  - 염소의 젖이 넉넉할 것입니다
  lexicon: HALOT
  rationale: דַּי/וְדֵי의 충분함을 한국어에서는 존재문으로 자연스럽게 풀어, 공급의 의미를 살리면서도 직역의 어색함을 피했습니다.
- source_word: לְלַחְמְךָ
  english_pob_choice: for your food
  chosen_korean: 너의 음식
  alternatives_korean:
  - 너의 빵
  - 너의 먹을거리
  lexicon: HALOT
  rationale: לֶחֶם이 문자적으로는 ‘빵’이지만, 여기서는 젖이 공급이 되는 맥락이므로 ‘음식’으로 옮겨 음식/양식의 넓은 뜻을 반영했습니다.
- source_word: לְלֶחֶם בֵּיתֶךָ
  english_pob_choice: for the food of your household
  chosen_korean: 네 집의 음식
  alternatives_korean:
  - 네 집의 빵
  - 네 가문의 양식
  lexicon: HALOT
  rationale: בַּיִת은 단순한 건물보다 가정/집안을 가리키므로 ‘집’으로, לֶחֶם은 같은 이유로 ‘음식’으로 옮겼습니다.
- source_word: וְחַיִּים לְנַעֲרוֹתֶיךָ
  english_pob_choice: and sustenance for your servant girls
  chosen_korean: 네 여종들의 생명
  alternatives_korean:
  - 네 여종들의 삶
  - 네 시녀들의 양식
  lexicon: HALOT
  rationale: חַיִּים는 문자적으로 ‘생명/삶’이지만, 공급 문맥에서는 ‘생명을 유지하게 하는 것’이라는 긴장을 살려 ‘생명’으로 두었습니다. נַעֲרָה는 여기서 가사 종속의 여성들을 가리키는 것으로 보고 ‘여종들’로 옮겼습니다.
theological_decisions:
- issue: חַיִּים의 처리(‘life’의 공급적 의미)
  chosen_reading: ‘생명’으로 직역하되 문맥상 생존을 떠받치는 공급의 뜻이 드러나게 했습니다.
  alternative_readings:
  - ‘삶’으로 완화
  - ‘양식’으로 의미 번역
  rationale: 히브리어의 ‘life/lives’라는 표현이 단순한 물질 공급을 넘어 삶 자체를 유지하는 의미를 지니므로, 의미를 지우지 않기 위해 ‘생명’을 선택했습니다.
  doctrine_reference: 문맥적 의미 보존; 잠언의 지혜 문학적 표현
- issue: 여성 종속 인물의 사회적 지위 반영
  chosen_reading: ‘여종들’로 옮겨 household economy 안의 종속 관계를 드러냈습니다.
  alternative_readings:
  - ‘하녀들’
  - ‘젊은 여자들’
  rationale: 나עֲרָה는 문맥에 따라 다양한 뜻이 있으나, 이 절의 생계 목록에서는 가사에 속한 종속 여성들을 가리키는 쪽이 가장 적절합니다.
  doctrine_reference: 본문 사회사적 맥락
