  terminology: לֶחֶם은 두 경우 모두 ‘양식’으로 일관되게 옮기고 각주에서 넓은 뜻을 설명합니다. נַעֲרוֹתֶיךָ는 가정 경제의 종속 여성들을 가리키는 문맥을 따라 ‘여종들’로 유지합니다. חַיִּים은 문자적 ‘생명/삶’의 표현을 각주로 밝혀 ‘생계’라는 문맥적 번역을 투명하게 처리합니다.
