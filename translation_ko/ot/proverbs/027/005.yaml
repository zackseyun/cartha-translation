source:
  edition: WLC
  text: ט֭וֹבָה תּוֹכַ֣חַת מְגֻלָּ֑ה מֵֽ/אַהֲבָ֥ה מְסֻתָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/005.yaml
  text: Open rebuke is better than hidden love[a].
  footnotes:
  - marker: a
    text: Or 'concealed love.' The Hebrew may refer to love that is unexpressed rather than absent.
    reason: lexical_alternative
translation:
  language: ko
  text: 드러난 꾸짖음이 숨은 사랑보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감춰진 사랑.’ 히브리어는 사랑이 없다는 뜻보다, 드러내지 않은 사랑을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  english_pob_choice: better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 히브리어의 비교 표현으로, 잠언의 평가적 대비를 자연스러운 한국어 비교형으로 옮겼습니다.
- source_word: תּוֹכַחַת
  english_pob_choice: rebuke
  chosen_korean: 꾸짖음
  alternatives_korean:
  - 책망
  - 훈계
  - 꾸지람
  lexicon: HALOT
  rationale: 단순한 교정보다 말의 날카로운 질책을 드러내는 표현이 필요해, 현대 한국어에서 바로 이해되는 ‘꾸짖음’을 선택했습니다.
- source_word: מְגֻלָּה
  english_pob_choice: open
  chosen_korean: 드러난
  alternatives_korean:
  - 열린
  - 공개된
  - 드러내진
  lexicon: HALOT
  rationale: 직역적 ‘열린’보다 ‘드러난’이 꾸짖음의 성격이 숨김없이 나타난 상태를 더 자연스럽게 보여 줍니다.
- source_word: מְסֻתָּרֶת
  english_pob_choice: hidden
  chosen_korean: 숨은
  alternatives_korean:
  - 감춰진
  - 은밀한
  - 숨겨진
  lexicon: HALOT
  rationale: 히브리어의 ‘숨겨진/가려진’ 의미를 살리면서, 사랑이 표현되지 않았을 수 있다는 여지를 남기기 위해 ‘숨은’으로 옮겼습니다.
theological_decisions:
- issue: 잠언의 가치판단을 도덕적 명령이 아니라 지혜 문장으로 어떻게 보존할지
  chosen_reading: 비교형의 지혜 진술로 읽어, ‘낫습니다’로 평가를 분명히 하되 명령문으로 바꾸지 않았습니다.
  alternative_readings:
  - 명령적 권면처럼 옮김
  - 더 강한 도덕 판정으로 확장
  rationale: 원문은 행동을 명령하기보다 두 태도를 비교해 지혜를 말하므로, 한국어에서도 그 비교적·잠언적 성격을 유지해야 합니다.
  doctrine_reference: 잠언 문학의 교훈적·비교적 성격
- issue: ‘숨은 사랑’의 의미를 비밀스러운 사랑으로 과도하게 제한하지 않을지
  chosen_reading: ‘숨은 사랑’으로 직역하되, 표현되지 않은 사랑까지 포함할 수 있는 열린 의미를 유지했습니다.
  alternative_readings:
  - ‘비밀 사랑’으로 좁힘
  - ‘감춰진 애정’으로 완화
  rationale: 영문 주석이 암시하듯, 히브리어는 사랑이 없어서가 아니라 드러나지 않은 사랑도 가리킬 수 있으므로 그 긴장을 보존하는 것이 맞습니다.
  doctrine_reference: 문맥상 사랑의 비표현/감춤 가능성
