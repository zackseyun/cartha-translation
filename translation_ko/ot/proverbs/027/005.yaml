  terminology: ‘꾸짖음’은 תּוֹכַחַת의 질책·책망의 어감을 적절히 전달합니다. ‘숨은 사랑’은 부적절하게 연애적 비밀로 좁히지 않으며, 각주도 ‘표현되지 않은 사랑’이라는 가능한 의미를 정확히 설명합니다.
