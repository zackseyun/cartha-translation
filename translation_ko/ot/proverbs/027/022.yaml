  source_fidelity: 핵심 도구와 결과는 대체로 충실합니다. 그러나 רִיפוֹת는 ‘부서진/찧은 곡식’인데 본문의 ‘곡식과 함께’는 가공 상태를 빠뜨리고, בְּתוֹךְ(‘가운데/속에서’)의 공간·상황 관계도 다소 약화합니다.
  naturalness: ‘당신이’는 잠언의 일반적 가정을 표현하는 데 불필요하게 청자를 특정합니다. ‘사람을 … 찧어도’와 ‘그에게서 떠나지 않습니다’는 자연스럽지만, 주어를 일반화하고 어순을 조금 다듬으면 현대 표준어 합쇼체의 잠언 문체에 더 잘 맞습니다.
  terminology: ‘절구/절굿공이’, ‘어리석은 사람’, ‘어리석음’은 적절합니다. רִיפוֹת는 ‘부서진 곡식’으로 명시하는 것이 원문의 어휘적 정보를 보존합니다. 각주 안의 영어 ‘grits’는 한국어 독자에게 설명 없이 제시하기보다 음역 또는 뜻풀이를 병기하는 편이 낫습니다.
