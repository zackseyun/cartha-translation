source:
  edition: WLC
  text: אִ֥ם תִּכְתּֽוֹשׁ אֶת הָ/אֱוִ֨יל בַּֽ/מַּכְתֵּ֡שׁ בְּ/ת֣וֹךְ הָ֭/רִיפוֹת בַּֽ/עֱלִ֑י לֹא תָס֥וּר מֵ֝/עָלָ֗י/ו אִוַּלְתּֽ/וֹ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/022.yaml
  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
  footnotes:
  - marker: a
    text: Or 'crushed grain,' 'pounded grain,' or traditionally 'grits' for Hebrew רִיפוֹת.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람을 절구에 넣고 절굿공이로 부서진 곡식 가운데서 찧어도, 그의 어리석음은 그에게서 떠나지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִיפוֹת는 ‘부서진 곡식’, ‘찧은 곡식’으로 옮길 수 있으며, 전통적으로는 ‘그리츠(거칠게 간 곡식)’로도 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תִּכְתּוֹשׁ
  english_pob_choice: Even if you grind
  chosen_korean: 당신이 … 찧어도
  alternatives_korean:
  - 당신이 … 갈아도
  - 당신이 … 빻아도
  lexicon: HALOT
  rationale: 절구와 절굿공이의 구체적 도구 이미지를 살리면서도, 한국어 속담체에서는 ‘찧다’가 가장 자연스럽게 강한 물리적 파괴를 드러냅니다.
- source_word: אֱוִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 바보
  - 우매한 사람
  lexicon: HALOT
  rationale: 잠언의 אֱוִיל은 단순한 지적 부족보다 도덕적·지혜문학적 완고함을 가리키므로, 속어적 ‘바보’보다 ‘어리석은 사람’이 더 정확합니다.
- source_word: בַּמַּכְתֵּשׁ ... בְּתוֹךְ הָרִיפוֹת ... בַּעֱלִי
  english_pob_choice: in a mortar with a pestle among crushed grain
  chosen_korean: 절구 안에서 절굿공이로 곡식과 함께
  alternatives_korean:
  - 맷돌에 절굿공이로 부서진 곡식 가운데
  - 절구 속에서 공이로 찧어도
  lexicon: HALOT
  rationale: מַּכְתֵּשׁ과 עֱלִי의 도구 관계를 ‘절구/절굿공이’로 옮기고, רִיפוֹת는 POB의 ‘crushed grain’에 맞춰 ‘곡식’으로 옮겨 음식 준비의 구체성을 살렸습니다.
- source_word: תָסוּר מֵעָלָיו אִוַּלְתּוֹ
  english_pob_choice: his foolishness will not depart from him
  chosen_korean: 그의 어리석음은 그에게서 떠나지 않습니다
  alternatives_korean:
  - 그의 어리석음은 그를 떠나지 않습니다
  - 그의 우매함은 그에게서 물러나지 않습니다
  lexicon: HALOT
  rationale: ‘떠나지 않습니다’가 히브리어의 이탈·분리 동사를 자연스럽게 반영하며, 소유대명사도 관계를 분명히 드러냅니다.
theological_decisions:
- issue: 잠언의 과장된 농업·조리 이미지가 전달하는 교훈의 강도
  chosen_reading: 극단적 물리적 행위를 제시해도 어리석은 사람의 내적 상태는 바뀌지 않는다는 잠언 특유의 냉정한 관찰로 읽었습니다.
  alternative_readings:
  - 단순히 교육 방법의 실패를 말하는 표현
  - 성격을 고칠 수 없다는 숙명론적 진술
  rationale: 문학적 과장은 관찰적 지혜의 수사이며, 본문은 운명론보다 어리석음의 뿌리 깊음을 강조합니다.
  doctrine_reference: 지혜문학의 수사와 인간의 완고함에 대한 관찰
