  rationale: 히브리어 בגד는 일반적인 옷을 가리킬 수 있으므로, 담보 이미지가 살아나도록 가장 넓고 자연스러운 표현을 택했습니다.
- source_word: עָרַב
  english_pob_choice: has put up security
  chosen_korean: 보증을 섰기
  alternatives_korean:
