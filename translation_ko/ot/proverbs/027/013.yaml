  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נָכְרִיָּ֣ה חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/013.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
  footnotes:
  - marker: a
    text: Or, 'Take a pledge from him for a foreign woman.' The Hebrew of the second line is terse, and the verb may be understood as taking or holding collateral from the man himself.
    reason: lexical_alternative
  - marker: b
    text: '''Foreign woman'' translates a Hebrew term that can mean a non-Israelite woman or, in Proverbs, a socially/morally illicit woman; the broader wording is retained here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 옷을 취하십시오[a]. 그가 낯선 사람을 위하여 보증을 섰기 때문이며, 낯선 여인을 위하여는 그를 담보로 잡으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 담보를 잡으십시오’. 히브리어 두 번째 행은 매우 간결하여, 담보를 취하는 주체를 남자의 소유물에서 취하는 것으로도, 남자 자신에게서 취하는 것으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 취하십시오
  alternatives_korean:
