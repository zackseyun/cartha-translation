  - 이방 여인
  - 외인 여성
  lexicon: HALOT
  rationale: 문자적 ‘외국인 여성’보다 잠언의 경계 대상으로서의 사회적 거리감을 드러내는 ‘낯선 여인’이 더 자연스럽지만, 도덕적 함의를 과도하게 좁히지는 않도록 했습니다.
- source_word: חַבְלֵהוּ
  english_pob_choice: hold it in pledge
  chosen_korean: 그를 담보로 잡으십시오
  alternatives_korean:
  - 그것을 담보로 잡으십시오
  - 그에게서 담보를 잡으십시오
  - 그를 저당잡으십시오
  lexicon: HALOT
  rationale: 히브리어는 전형적인 담보/저당의 법적 이미지를 가지므로, 전절의 ‘옷’을 그대로 반복하기보다 대상 남성을 가리키는 대명사를 살린 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: נָכְרִיָּה의 의미 범위
  chosen_reading: ‘낯선 여인’으로 옮겨, 단순한 외국인 여성과 도덕적으로 부적절한 여인이라는 잠언적 뉘앙스 둘 다를 열어 두었습니다.
  alternative_readings:
  - 외국 여자
  - 음탕한 여인
  - 이방 여인
  rationale: 본문은 직접적으로 도덕 판단어를 쓰지 않으므로, 의미를 한쪽으로 과도하게 고정하지 않는 번역이 원문에 더 충실합니다.
  doctrine_reference: 잠언의 경계 언어와 문맥적 함의
