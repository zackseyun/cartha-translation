  - 보증인이 되었기
  - 담보를 제공했기
  lexicon: HALOT
  rationale: 이 동사는 여기서 채무 보증의 법적 의미이므로, 한국어의 관용적 법률 표현인 ‘보증을 서다’를 사용했습니다.
- source_word: נָכְרִיָּה
  english_pob_choice: a foreign woman
  chosen_korean: 낯선 여인
  alternatives_korean:
