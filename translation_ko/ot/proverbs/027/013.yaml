  source_fidelity: 첫 행의 보증 행위와 옷을 취하라는 명령은 대체로 충실합니다. 그러나 חַבְלֵהוּ의 남성 단수 접미사는 ‘그를 담보로’라고 옮기기보다, 담보 취득 관용구에 따라 ‘그에게서 담보를 잡다’로 옮기는 것이 자연스럽고 원문의 법률·경제적 이미지를 더 정확히 보존합니다.
  naturalness: ‘그를 담보로 잡으십시오’는 현대 한국어에서 사람 자체를 담보물로 삼는다는 뜻으로 쉽게 읽혀 부자연스럽습니다. 또한 문장 끝의 ‘때문이며’는 마침표와 결합되어 문장 연결이 어색합니다. 병렬을 살린 두 문장으로 정리하는 것이 자연스럽습니다.
  terminology: ‘보증을 서다’와 ‘담보를 잡다’는 적절한 법률·경제 용어입니다. זָר는 ‘낯선 이’, נָכְרִיָּה는 원문의 폭을 보존하여 ‘낯선 여인’으로 유지할 수 있습니다. ‘옷’도 בִּגְדוֹ의 넓은 의미에 맞습니다.
