  - 빼앗으십시오
  lexicon: BDB
  rationale: 지혜문학의 직접적인 명령형을 살리되, 현대 한국어에서 법적·실무적 맥락에 어울리는 공손한 명령으로 옮겼습니다.
- source_word: בִּגְדוֹ
  english_pob_choice: his garment
  chosen_korean: 그의 옷
  alternatives_korean:
