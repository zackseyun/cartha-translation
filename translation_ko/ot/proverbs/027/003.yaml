  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽבֶד אֶ֭בֶן וְ/נֵ֣טֶל הַ/ח֑וֹל וְ/כַ֥עַס אֱ֝וִ֗יל כָּבֵ֥ד מִ/שְּׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/003.yaml
  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
  footnotes:
  - marker: a
    text: Or 'A stone is heavy and a load of sand [is heavy], but a fool’s vexation is heavier than both.' The Hebrew uses closely related terms for heaviness in the first and third lines.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌은 무겁고, 모래는 무거우며, 어리석은 자의 분노는 둘보다 더 무겁습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫째 행과 셋째 행에서 서로 가까운 ‘무겁다’ 계열 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּבֶד
  english_pob_choice: is heavy
  chosen_korean: 무겁고
  alternatives_korean:
  - 무게가 있고
  - 무겁습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘무게/무거움’이라는 명사적 표현을 한국어 속담체에 맞게 서술적으로 옮겼습니다.
- source_word: נֵטֶל הַחוֹל
  english_pob_choice: sand is weighty
  chosen_korean: 모래는 무거우며
  alternatives_korean:
  - 모래는 짐이며
  - 모래는 무게가 있으며
  lexicon: HALOT
  rationale: nēṭel은 ‘짐/짐짝’의 뜻이지만, 병행구조상 첫 행의 ‘무겁다’와 같은 무게 영역을 유지하는 것이 자연스럽습니다.
- source_word: כַעַס אֱוִיל
  english_pob_choice: a fool’s anger
  chosen_korean: 어리석은 자의 분노
  alternatives_korean:
  - 어리석은 자의 화
  - 어리석은 자의 노여움
  lexicon: HALOT
  rationale: כַעַס는 단순한 감정 폭발보다 분노/격분에 가깝기 때문에, 한국어에서는 ‘분노’가 가장 직접적입니다.
- source_word: מִשְּׁנֵיהֶם
  english_pob_choice: than both of them
  chosen_korean: 둘보다 더
  alternatives_korean:
  - 그 둘보다
  - 두 가지보다 더
  lexicon: HALOT
  rationale: 두 앞 행의 대상(돌과 모래)을 가리키는 비교를 간결하게 살리기 위해 ‘둘보다 더’로 옮겼습니다.
