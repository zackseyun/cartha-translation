revisions:
- from: 이웃을 큰 소리로, 아침 일찍 축복하는 사람은 그에게 저주로 여겨집니다.[a][b][c]
  to: 이웃에게 큰 소리로 아침 일찍 복을 비는 사람의 축복은 그에게 저주로 여겨집니다.[a][b][c]
  rationale: 문장의 주어를 ‘사람’에서 ‘사람의 축복’으로 명시하여, 축복이 그에게 저주로 간주된다는 히브리어의 반어적 결말을 분명히 했습니다. 또한 ‘이웃에게 ... 복을 비는’으로 바꾸어 원문의 대인 관계와 발화 행위를 자연스러운 현대 표준 한국어로 표현했습니다. 각주 표지와 내용은 모두 유지했습니다.
  reviewer_model: gpt-5.6-terra
