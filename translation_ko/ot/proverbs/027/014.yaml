id: PRO.27.14
reference: Proverbs 27:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
  footnotes:
  - marker: a
    text: Or 'his friend' or 'his companion' for 'his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: 'The sense is ironic: an ostentatious early-morning blessing is received as though it were a curse.'
    reason: cultural_note
  - marker: c
    text: Or 'it will be regarded as a curse to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃을 큰 소리로, 아침 일찍 축복하는 사람은 그에게 저주로 여겨집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이웃’은 ‘친구’나 ‘동료’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 의도는 반어적입니다. 요란한 이른 아침의 축복은 마치 저주처럼 받아들여집니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그에게 저주로 간주됩니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבָרֵךְ
  english_pob_choice: blesses
  chosen_korean: 축복하는
  alternatives_korean:
  - 축복합니다
  - 복을 빕니다
  - 인사하는
  lexicon: HALOT
  rationale: ברך의 피엘 분사로서 실제로 복을 비는 말을 가리키므로, ‘축복하는’으로 옮겨 원문의 행위를 직접 살렸습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 이웃을
  alternatives_korean:
  - 그의 친구를
  - 그의 동료를
  lexicon: HALOT
  rationale: רֵעַ는 친구·동료·이웃의 폭넓은 뜻이 있어, 지혜문맥에 자연스럽고 관계의 폭을 유지하는 ‘이웃’을 선택했습니다.
- source_word: בְּקוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 목소리로
  - 크게
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞는 ‘큰 소리로’가 원문의 분명한 청각적 과장을 잘 전달합니다.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  english_pob_choice: rising early in the morning
  chosen_korean: 아침 일찍
  alternatives_korean:
  - 새벽에
  - 이른 아침에
  lexicon: HALOT
  rationale: אַשְׁכֵּים의 ‘일찍 일어남’과 זמן 표현을 한국어 자연문장으로 압축하되, 서두름의 뉘앙스를 유지했습니다.
- source_word: תֵּחָשֶׁב לוֹ
  english_pob_choice: it will be counted to him as
  chosen_korean: 그에게 ...로 여겨집니다
  alternatives_korean:
  - 그에게 ...로 계산됩니다
  - 그에게 ...로 간주됩니다
  lexicon: HALOT
  rationale: חשב의 ‘헤아리다/간주하다’ 의미를 살려 결과적 평가를 나타내는 ‘여겨집니다’로 옮겼습니다.
theological_decisions:
- issue: 잠언 27:14의 반어적 효과
  chosen_reading: 겉으로는 축복이지만 실제 평가는 저주로 돌아가는 반어를 한국어에서도 드러냈습니다.
  alternative_readings:
  - 단순히 예의 없는 아침 인사로 완화해 옮기는 읽기
  rationale: 본문의 핵심은 과장된 조기 축복이 사회적으로 반대 의미로 받아들여진다는 점이므로, 반어를 약화하지 않았습니다.
  doctrine_reference: 지혜문학의 반어와 사회적 분별
