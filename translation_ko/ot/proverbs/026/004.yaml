    text: 또는, '미련한 태도로.' 히브리어 구절 '그의 미련함대로'는 미련한 자의 미련함을 그대로 따라 대답하는 것을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 잠언 26장 5 절은 상보적인 교훈인 '미련한 자에게 그 미련함대로 대답하라'를 줍니다. 이 두 말씀은 모순이 아니라 상황적 지혜를 가르칩니다.
    reason: alternative_reading
