  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
  footnotes:
  - marker: a
    text: Or, 'in a foolish manner.' The Hebrew phrase 'according to his folly' can refer to answering in a way that mirrors the fool's own foolishness.
    reason: lexical_alternative
  - marker: b
    text: Proverbs 26:5 gives the complementary instruction, 'Answer a fool according to his folly.' The two sayings together teach situational wisdom, not contradiction.
    reason: cross_reference
