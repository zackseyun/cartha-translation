  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
  footnotes:
  - marker: a
    text: Or, 'in a foolish manner.' The Hebrew phrase 'according to his folly' can refer to answering in a way that mirrors the fool's own foolishness.
    reason: lexical_alternative
  - marker: b
    text: Proverbs 26:5 gives the complementary instruction, 'Answer a fool according to his folly.' The two sayings together teach situational wisdom, not contradiction.
    reason: cross_reference
translation:
  language: ko
  text: 어리석은 자에게 그의 어리석음대로[a] 대답하지 마십시오. 그렇지 않으면 당신도 그와 같아질 수 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어리석은 방식으로.’ 히브리어의 ‘그의 어리석음대로’는 어리석은 자의 어리석은 방식을 따라 대답하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 잠언 26장 5절은 서로 보완하는 교훈으로 ‘어리석은 자에게 그의 어리석음대로 대답하라’고 말합니다. 이 두 말씀은 모순이 아니라 상황에 맞는 지혜를 가르칩니다.
    reason: cross_reference
