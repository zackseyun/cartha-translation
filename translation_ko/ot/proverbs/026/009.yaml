  source_fidelity: 히브리어의 대조 구조를 충실히 옮겼습니다. חוֹחַ를 ‘가시’로, עָלָה를 ‘올라온’으로 번역하여 술 취한 사람의 손과 관련된 다소 난해한 원이미지를 ‘들어 올린’ 등으로 과도하게 해석하지 않고 보존했습니다. ‘입에 있는 잠언’도 בְּפִי와 מָשָׁל을 적절히 반영합니다.
  naturalness: ‘술 취한 사람의 손에 올라온 가시 같으니, 어리석은 자들의 입에 있는 잠언도 그러합니다’는 잠언의 압축적 병행법에 맞으며 현대 표준어로 이해 가능합니다. ‘그러합니다’는 요청된 현대 합쇼체 종결에도 부합합니다.
  terminology: ‘가시’, ‘술 취한 사람’, ‘잠언’, ‘어리석은 자들’은 지혜문학 문맥과 현대 한국어의 격식 있는 성경 번역 문체에 적절합니다. 특히 ‘잠언’은 מָשָׁל의 격언적 의미를 이 책의 장르와 연결하면서도 유지합니다.
