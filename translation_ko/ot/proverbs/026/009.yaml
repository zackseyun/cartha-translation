id: PRO.26.9
reference: Proverbs 26:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ח֭וֹחַ עָלָ֣ה בְ/יַד שִׁכּ֑וֹר וּ֝/מָשָׁ֗ל בְּ/פִ֣י כְסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/009.yaml
  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
  footnotes:
  - marker: a
    text: Or 'Like a thornbush in the hand of a drunkard, so is a proverb in the mouth of fools.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb literally means 'goes up' or 'ascends'; the image may be of a thorn being lifted, brandished, or coming up into the drunkard's hand in a dangerous, uncontrolled way.
    reason: lexical_alternative
translation:
  language: ko
  text: 술 취한 사람의 손에 올라온 가시 같으니, 어리석은 자들의 입에 있는 잠언도 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוֹחַ
  english_pob_choice: thorn
  chosen_korean: 가시
  alternatives_korean:
  - 가시나무
  - 찔레
  - 엉겅퀴
  lexicon: HALOT
  rationale: חוֹחַ는 해로운 가시성 식물을 가리키므로, 짧고 직설적인 ‘가시’가 비유의 날카로움과 위험성을 가장 자연스럽게 살립니다.
- source_word: עָלָה
  english_pob_choice: comes up
  chosen_korean: 올라온
  alternatives_korean:
  - 들어올린
  - 솟아오른
  - 올라가는
  lexicon: HALOT
  rationale: 동사의 기본 이미지를 살려 ‘올라온’으로 옮겨, 술 취한 사람의 손에서 가시가 불안정하게 드러나는 장면을 과도한 해석 없이 반영했습니다.
- source_word: בְּיַד שִׁכּוֹר
  english_pob_choice: in the hand of a drunkard
  chosen_korean: 술 취한 사람의 손에
  alternatives_korean:
  - 술주정뱅이의 손에
  - 술 취한 자의 손안에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어의 구체적 신체 이미지를 그대로 유지하며, שִׁכּוֹר는 관용적인 ‘술 취한 사람’으로 옮기는 것이 현대 한국어에서 가장 자연스럽습니다.
- source_word: מָשָׁל
  english_pob_choice: proverb
  chosen_korean: 잠언
  alternatives_korean:
  - 속담
  - 비유
  - 격언
  lexicon: HALOT
  rationale: 이 책 전체의 장르와 직접 연결되는 말이므로, 일반적인 ‘속담’보다 ‘잠언’이 본문 자체의 형식을 더 정확히 드러냅니다.
- source_word: כְסִילִים
  english_pob_choice: fools
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 바보들
  - 우둔한 자들
  - 미련한 자들
  lexicon: HALOT
  rationale: כְסִילִים은 단순한 지적 부족이 아니라 지혜를 거부하는 어리석음을 가리키므로, 합쇼체 문맥에서는 ‘어리석은 자들’이 가장 무난하고 정확합니다.
