translation:
  language: ko
  text: 미친 사람처럼 불화살과 화살과 죽음을 쏘는 사람과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  english_pob_choice: Like a madman
  chosen_korean: 미친 사람처럼
  alternatives_korean:
  - 정신이 나간 사람처럼
  - 광기 어린 사람처럼
  - 무모한 사람처럼
  lexicon: HALOT
  rationale: 비교 접두 כְּ와 히트파엘형의 의미를 살려, 비정상적이고 위험한 행동을 하는 사람의 이미지를 간결하게 옮겼습니다.
- source_word: הַיֹּרֶה
  english_pob_choice: who shoots
  chosen_korean: 쏘는
  alternatives_korean:
  - 던지는
  - 내던지는
  lexicon: HALOT
  rationale: 뒤따르는 ‘화살’과 함께 투사체를 겨냥해 발사하는 동작을 자연스럽게 드러내므로 ‘쏘는’이 가장 적절합니다.
- source_word: זִקִּים
  english_pob_choice: firebrands
  chosen_korean: 불화살
  alternatives_korean:
  - 횃불
  - 불붙은 막대기
  - 불붙는 화살
  lexicon: HALOT
  rationale: 직역형 ‘firebrands’의 위험한 불붙은 투사체 이미지를 한국어에서 곧바로 이해되도록 옮겼습니다.
- source_word: וָמָוֶת
  english_pob_choice: and death
  chosen_korean: 죽음
  alternatives_korean:
  - 죽게 함
  - 치명상
  lexicon: HALOT
  rationale: 히브리어의 추상명사 ‘죽음’을 그대로 살려, 단순한 결과 설명보다 비유의 종결감을 유지했습니다.
