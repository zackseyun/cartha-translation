source:
  edition: WLC
  text: ב/שפת/ו יִנָּכֵ֣ר שׂוֹנֵ֑א וּ֝/בְ/קִרְבּ֗/וֹ יָשִׁ֥ית מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
  footnotes:
  - marker: a
    text: Or 'A hater pretends with his lips.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in his inward part' or 'within him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미워하는 자는 자기 입술로 자신을 숨기지만, 속으로는 속임수를 품습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשְׂפָתוֹ
  english_pob_choice: with his lips
  chosen_korean: 자기 입술로
  alternatives_korean:
  - 입술로
  - 자기 입술로써
  - 말로
  lexicon: HALOT
  rationale: ב + ‘입술’은 수단을 나타내므로, 한국어에서는 ‘입술로’가 가장 자연스럽고, 소유를 분명히 하려고 ‘자기’를 덧붙였습니다.
- source_word: יִנָּכֵר
  english_pob_choice: disguises himself
  chosen_korean: 자신을 숨기지만
  alternatives_korean:
  - 자신을 가장하지만
  - 자신을 감추지만
  - 자신을 알아보기 어렵게 하지만
  lexicon: HALOT
  rationale: 이 동사는 자신을 다른 사람처럼 보이게 하는 뉘앙스를 가지므로, 직역에 가까우면서도 자연스러운 ‘자신을 숨기다’로 옮겼습니다.
- source_word: וּבְקִרְבּוֹ
  english_pob_choice: within himself
  chosen_korean: 속으로는
  alternatives_korean:
  - 자기 속에는
  - 내면에는
  - 마음속에는
  lexicon: HALOT
  rationale: קֶרֶב은 내면의 중심을 가리키지만, ‘마음’으로 특정하지 않기 위해 ‘속으로는’으로 처리해 겉과 속의 대비를 살렸습니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 속임
  - 사기
  lexicon: HALOT
  rationale: 지혜문맥에서 מִרְמָה는 일반적인 ‘속임수/기만’을 뜻하므로, 지나치게 법률적이거나 강한 ‘사기’보다 ‘속임수’가 적절합니다.
