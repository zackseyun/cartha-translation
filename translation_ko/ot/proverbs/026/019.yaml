id: PRO.26.19
reference: Proverbs 26:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּֽן אִ֭ישׁ רִמָּ֣ה אֶת רֵעֵ֑/הוּ וְ֝/אָמַ֗ר הֲֽ/לֹא מְשַׂחֵ֥ק אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/019.yaml
  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
  footnotes:
  - marker: a
    text: Or “his friend” or “his companion.” The Hebrew רֵעַ can refer to a neighbor, friend, or associate depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or “Am I not playing?” / “Am I not jesting?” The Hebrew participle can denote play or jest; here it functions as a dismissive excuse for harmful deception.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 이웃[a]을 속이고서 “내가 그냥 농담하는 것[b] 아니냐?”라고 말하는 사람도 그와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “친구”나 “동료”입니다. 히브리어 רֵעַ는 문맥에 따라 이웃, 친구, 또는 동료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “놀고 있는 것” 또는 “장난치는 것”입니다. 히브리어 분사는 놀이나 농담을 뜻할 수 있으나, 여기서는 해로운 속임수를 가볍게 넘기려는 변명으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So is
  chosen_korean: ~과 같습니다
  alternatives_korean:
  - ~입니다
  - 그와 같습니다
  - 이와 같습니다
  lexicon: HALOT
  rationale: 앞절과의 비교·유비를 자연스럽게 살리기 위해 단정문보다 비교 표현으로 옮겼습니다.
- source_word: אִישׁ רִמָּה
  english_pob_choice: the man who deceives
  chosen_korean: 사람이 … 속이고서
  alternatives_korean:
  - 그 사람이 … 속이고
  - 한 사람이 … 속이며
  - 속이는 사람이
  lexicon: HALOT
  rationale: 잠언의 대표적 단수 표현을 한국어에서 자연스럽게 풀어, 속임의 행위가 인물 규정의 핵심임을 드러냈습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 자기 친구
  - 자기 동료
  - 자기 이웃 사람
  lexicon: HALOT
  rationale: רֵעַ의 범위가 친구·동료·이웃을 모두 포함할 수 있으나, 본문에서는 윤리적 관계를 가리키는 ‘이웃’이 가장 넓고 적절합니다.
- source_word: מְשַׂחֵק
  english_pob_choice: only joking
  chosen_korean: 그냥 농담하는 것
  alternatives_korean:
  - 그냥 장난하는 것
  - 그저 놀고 있는 것
  - 농담하고 있는 것
  lexicon: HALOT
  rationale: ‘놀다/장난하다/농담하다’의 의미 중 여기서는 남을 속인 뒤 책임을 가볍게 넘기려는 말로 쓰이므로, 현대 한국어에서 변명성 뉘앙스가 살아 있는 ‘농담하다’를 택했습니다.
theological_decisions:
- issue: 속임수의 자기정당화 표현 처리
  chosen_reading: “내가 그냥 농담하는 것 아니냐?”처럼 옮겨, 해로운 속임수를 가볍게 여기며 변명하는 태도를 드러냈습니다.
  alternative_readings:
  - “내가 그냥 놀고 있는 것 아니냐?”
  - “내가 그냥 장난치는 것 아니냐?”
  rationale: 히브리어 השחק 계열 동사는 단순한 놀이보다 ‘무해한 농담’처럼 가장하는 뉘앙스가 있으므로, 문맥상 피해를 축소하는 자기변호를 한국어로 명확히 해야 합니다.
  doctrine_reference: 잠언의 지혜 윤리와 언어의 책임
- issue: 비교구문의 종결 방식
  chosen_reading: ‘~과 같습니다’로 마무리해 전절과의 비교를 분명히 했습니다.
  alternative_readings:
  - ‘~입니다’
  - ‘~와 같습니다’
  rationale: 원문의 כֵּן은 앞선 예와의 대응을 표시하므로, 한국어에서도 단정이 아니라 비교·유비 구조가 보이도록 하는 것이 문맥상 적절합니다.
  doctrine_reference: 지혜문학의 비유적 진술
