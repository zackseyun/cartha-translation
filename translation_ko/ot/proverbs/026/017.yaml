  text: Like one who grabs a dog by the ears is a passerby who gets involved in a quarrel not his own[a].
  footnotes:
  - marker: a
    text: Or 'who meddles in a quarrel not his own.' The Hebrew verb can carry the sense of involving oneself in another person's dispute.
    reason: lexical_alternative
translation:
  language: ko
  text: 개의 귀를 잡는 사람처럼, 자기 것이 아닌 다툼에 끼어드는 사람은 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 것이 아닌 다툼에 참견하는 사람.’ 히브리어 동사는 다른 사람의 분쟁에 스스로 관여한다는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
