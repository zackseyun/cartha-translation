  naturalness: ‘개의 귀를 잡는 사람처럼, … 사람은 그렇습니다’는 한국어에서 비교의 귀결이 부자연스럽고 ‘그렇습니다’의 지시 대상도 불명확합니다. ‘개의 귀를 붙잡는 사람은 … 지나가는 사람과 같습니다’가 자연스럽고 격식 있는 현대 한국어입니다.
