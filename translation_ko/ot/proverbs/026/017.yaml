  text: 개의 귀를 붙잡는 사람은 자기와 상관없는 다툼에 끼어드는 지나가는 사람과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기와 상관없는 다툼에 참견하는 지나가는 사람.’ 히브리어 동사는 다른 사람의 분쟁에 스스로 관여한다는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
