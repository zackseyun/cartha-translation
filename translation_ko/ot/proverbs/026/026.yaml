id: PRO.26.26
reference: Proverbs 26:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּכַּסֶּ֣ה שִׂ֭נְאָה בְּ/מַשָּׁא֑וֹן תִּגָּלֶ֖ה רָעָת֣/וֹ בְ/קָהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
  footnotes:
  - marker: a
    text: Or 'with guile' or 'by deception' for 'with deceit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the congregation.' The Hebrew refers to a gathered community or assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 미움은 속임수로 가려져도 그 악은 회중 가운데서 드러납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기만으로’, ‘간계로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회중’은 단순한 공개성이 아니라 모인 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה שִׂנְאָה
  english_pob_choice: Though hatred is covered
  chosen_korean: 미움은 … 가려져도
  alternatives_korean:
  - 증오는 … 덮여도
  - 미움은 … 숨겨져도
  lexicon: HALOT
  rationale: נifal의 수동적 의미를 살려 ‘가려져도’로 옮기고, שִׂנְאָה는 한국어에서 자연스럽고 문맥에 맞는 ‘미움’으로 렌더링했습니다.
- source_word: בְּמַשָּׁאוֹן
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 간계로
  - 속이는 행위로
  lexicon: HALOT
  rationale: 이 말은 미움을 숨기는 수단/방식이므로 조사 ‘-로’를 써서 수단성을 드러냈고, 현대 한국어에서 가장 분명한 ‘속임수’를 택했습니다.
- source_word: תִּגָּלֶה רָעָתוֹ
  english_pob_choice: his evil will be exposed
  chosen_korean: 그 악은 … 드러납니다
  alternatives_korean:
  - 그 악은 … 폭로됩니다
  - 그의 악은 … 나타납니다
  lexicon: HALOT
  rationale: נifal of גלה의 결과적 의미를 살려 ‘드러납니다’로 옮겼고, רָעָתוֹ는 범위를 넓게 잡는 ‘그 악’이 원문보다 지나치게 협소하지 않습니다.
- source_word: בְקָהָל
  english_pob_choice: in the assembly
  chosen_korean: 회중 가운데서
  alternatives_korean:
  - 회중 안에서
  - 모인 자리에서
  - 공동체 가운데서
  lexicon: HALOT
  rationale: קָהָל의 핵심은 단순한 공개성보다 ‘모인 공동체’이므로, POB의 ‘assembly’에 맞춰 ‘회중’으로 옮겼습니다.
theological_decisions:
- issue: קהָל의 공동체성 vs. 단순한 공개성
  chosen_reading: ‘회중 가운데서’로 번역해, 악이 사적인 영역에 머물지 않고 공동체 한가운데서 밝혀진다는 점을 살렸습니다.
  alternative_readings:
  - ‘공개적으로’
  - ‘사람들 앞에서’
  rationale: 원문의 קָהָל은 단순한 노출보다 실제로 모인 공동체를 가리키므로, 공동체적 심판/분별의 뉘앙스를 보존하는 쪽이 더 source-direct합니다.
  doctrine_reference: 잠언의 지혜 전승과 공동체 윤리
