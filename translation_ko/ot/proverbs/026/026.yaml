  source_fidelity: 히브리어의 수동형 동사들과 대조적 전개는 전반적으로 잘 반영되었습니다. 다만 רָעָתוֹ의 남성 단수 소유 접미사는 미움을 품고 속임수로 그것을 감추는 사람을 가리키므로, ‘그 악’보다 ‘그의 악’이 원문의 소유 관계를 더 직접적으로 보존합니다.
  naturalness: ‘미움은 속임수로 가려져도’와 ‘회중 가운데서 드러납니다’는 현대 표준어 합쇼체로 자연스럽습니다. 각주 표지는 해당 낱말 바로 뒤에 두는 편이 독자에게 더 명확합니다.
  terminology: ‘속임수’는 בְּמַשָּׁאוֹן의 수단적 의미를, ‘회중’은 קָהָל의 집합체 의미를 적절히 전달합니다. ‘악’은 רָעָה의 넓은 의미를 보존합니다.
