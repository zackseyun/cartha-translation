  text: חָכָ֣ם עָצֵ֣ל בְּ/עֵינָ֑י/ו מִ֝/שִּׁבְעָ֗ה מְשִׁ֣יבֵי טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/016.yaml
  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
  footnotes:
  - marker: a
    text: Or 'than seven who can give a sensible answer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 자기 눈에는 분별 있게 대답하는 일곱 사람보다 더 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 있는 대답을 할 수 있는 일곱 사람보다’
    reason: ‘분별 있게 대답하는’에 대한 자연스러운 어휘적 대안입니다.
lexical_decisions:
- source_word: חָכָם
  english_pob_choice: wiser
  chosen_korean: 더 지혜롭게 보입니다
  alternatives_korean:
  - 지혜롭습니다
  - 더 지혜롭습니다
  lexicon: HALOT
  rationale: 히브리어는 비교 구문으로 쓰여 ‘지혜로운’의 단순 진술보다 ‘~보다 더 지혜롭게 여김/보임’의 뜻이 자연스럽습니다. 한국어에서는 자의적 자평을 드러내기 위해 ‘보입니다’를 붙였습니다.
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으름뱅이
  - 나태한 사람
  lexicon: HALOT
  rationale: 지혜문학의 관용적 인물 유형을 한국어로 무리 없이 살리되, ‘게으름뱅이’보다 덜 구어적이고 현대 문어에 맞는 표현을 택했습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 자기 눈에
  alternatives_korean:
  - 자기 생각에
  - 스스로 보기에는
  lexicon: HALOT
  rationale: 직역하면 ‘그의 눈에’이지만, 관용적으로 자기평가를 뜻하므로 반사적 의미가 드러나도록 ‘자기 눈에’로 옮겼습니다.
- source_word: מִשִּׁבְעָה
  english_pob_choice: than seven
  chosen_korean: 일곱 사람보다
  alternatives_korean:
  - 일곱보다
  - 일곱 명보다
  lexicon: HALOT
  rationale: 비교를 나타내는 מִן의 기능을 살려 ‘~보다’로 처리했고, 문맥상 사람을 가리키므로 ‘사람’ 또는 ‘명’을 보충해 뜻을 분명히 했습니다.
- source_word: מְשִׁיבֵי טָעַם
  english_pob_choice: who answer with discernment
  chosen_korean: 분별 있게 대답하는 사람들
  alternatives_korean:
  - 분별 있는 대답을 하는 사람들
  - 지각 있게 답하는 사람들
  lexicon: HALOT
  rationale: מְשִׁיבֵי는 ‘대답하는 사람들’이고, טָעַם은 문자적 ‘맛’이 아니라 판단력·분별을 뜻하므로 한국어 관용에 맞게 결합해 옮겼습니다.
theological_decisions:
- issue: 속담적 비교의 과장 표현
  chosen_reading: ‘일곱 사람보다 더 지혜롭게’라는 과장된 비교를 그대로 살려, 어리석은 자기확신을 비판하는 격언의 힘을 유지했습니다.
  alternative_readings:
  - ‘일곱 명의 분별 있는 대답자보다’
  - ‘일곱 사람보다 낫다’
  rationale: 잠언의 수사법은 과장된 대비를 통해 교훈을 선명하게 하므로, 의미를 완화하지 않고 비교 구조를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 지혜문학의 수사와 교훈적 대비
- issue: ‘자기 눈에’의 자기기만 뉘앙스
  chosen_reading: ‘자기 눈에’는 단순한 시각이 아니라 자기기만적 자기평가를 드러내는 관용구로 유지했습니다.
  alternative_readings:
  - ‘자기 생각에는’
  - ‘스스로 보기에는’
  rationale: 원문의 관용적 표현을 부드럽게 풀어도 되지만, 여기서는 잠언의 날카로운 자책/자기확신 비판을 보존하는 편이 더 소스-직접적입니다.
  doctrine_reference: 인간의 자기기만에 대한 지혜문학의 통찰
