  lexicon: HALOT
  rationale: 잠언의 고정된 인물 유형이지만 한국어에서는 지나치게 구어적인 ‘게으름뱅이’보다 표준적이고 출판용에 맞는 ‘게으른 사람’이 자연스럽습니다.
- source_word: בַּצַּלָּחַת
  english_pob_choice: in the dish
  chosen_korean: 그릇에
  alternatives_korean:
  - 접시에
  - 사발에
  - 접시에
  lexicon: HALOT
  rationale: 먹는 장면의 용기 일반을 가리키는 말로는 ‘그릇’이 가장 무난하며, 원문의 구체성을 과도하게 좁히지 않습니다.
- source_word: נִלְאָה לַהֲשִׁיבָהּ
  english_pob_choice: he is too weary to bring it back
  chosen_korean: 그것을 입으로 가져오는 것조차 너무 지칩니다
  alternatives_korean:
  - 그것을 입으로 다시 가져올 힘조차 없습니다
  - 그것을 입으로 옮겨 오는 것조차 피곤해합니다
  lexicon: HALOT
  rationale: 히필 ‘다시 가져오다’의 동작을 살리면서, ‘너무 지칩니다’로 결과 상태를 자연스럽게 표현했습니다.
- source_word: אֶל פִּיו
  english_pob_choice: to his mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 자기 입으로
  - 그의 입으로
  lexicon: HALOT
  rationale: 한국어에서는 소유를 반복하지 않아도 뜻이 분명하므로, 직역적이면서도 간결한 ‘입으로’를 사용했습니다.
