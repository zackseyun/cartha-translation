id: PRO.26.15
reference: Proverbs 26:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת נִ֝לְאָ֗ה לַֽ/הֲשִׁיבָ֥/הּ אֶל פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
  footnotes:
  - marker: a
    text: Or 'hides his hand in the dish.' The Hebrew verb can mean 'hide' or 'bury'; 'buries' was chosen to preserve the proverb's exaggerated imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the bowl' or 'in the platter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 그릇에 손을 묻고서는, 그것을 입으로 가져오는 것조차 너무 지칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘묻고서는’은 히브리어 טָמַן의 ‘숨기다/파묻다’ 중, 잠언의 과장된 우스꽝스러움을 살리기 위해 선택한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: בַּצַּלָּחַת는 ‘접시’, ‘그릇’, ‘쟁반/접시류’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  english_pob_choice: buries
  chosen_korean: 묻고서는
  alternatives_korean:
  - 숨기고서는
  - 넣고서는
  - 파묻고서는
  lexicon: HALOT
  rationale: 원문의 과장된 비유를 살리기 위해 단순히 ‘넣다’보다 ‘묻다’ 계열을 택했고, 동작의 기이함을 드러내도록 ‘묻고서는’으로 옮겼습니다.
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 게으름뱅이
  lexicon: HALOT
  rationale: 잠언의 고정된 인물 유형이지만 한국어에서는 지나치게 구어적인 ‘게으름뱅이’보다 표준적이고 출판용에 맞는 ‘게으른 사람’이 자연스럽습니다.
- source_word: בַּצַּלָּחַת
  english_pob_choice: in the dish
  chosen_korean: 그릇에
  alternatives_korean:
  - 접시에
  - 사발에
  - 접시에
  lexicon: HALOT
  rationale: 먹는 장면의 용기 일반을 가리키는 말로는 ‘그릇’이 가장 무난하며, 원문의 구체성을 과도하게 좁히지 않습니다.
- source_word: נִלְאָה לַהֲשִׁיבָהּ
  english_pob_choice: he is too weary to bring it back
  chosen_korean: 그것을 입으로 가져오는 것조차 너무 지칩니다
  alternatives_korean:
  - 그것을 입으로 다시 가져올 힘조차 없습니다
  - 그것을 입으로 옮겨 오는 것조차 피곤해합니다
  lexicon: HALOT
  rationale: 히필 ‘다시 가져오다’의 동작을 살리면서, ‘너무 지칩니다’로 결과 상태를 자연스럽게 표현했습니다.
- source_word: אֶל פִּיו
  english_pob_choice: to his mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 자기 입으로
  - 그의 입으로
  lexicon: HALOT
  rationale: 한국어에서는 소유를 반복하지 않아도 뜻이 분명하므로, 직역적이면서도 간결한 ‘입으로’를 사용했습니다.
