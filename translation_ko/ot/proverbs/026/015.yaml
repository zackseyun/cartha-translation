  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
  footnotes:
  - marker: a
    text: Or 'hides his hand in the dish.' The Hebrew verb can mean 'hide' or 'bury'; 'buries' was chosen to preserve the proverb's exaggerated imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the bowl' or 'in the platter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 그릇[b]에 손을 파묻고[a]도 그 손을 자기 입으로 다시 가져올 힘조차 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘파묻고’는 히브리어 טָמַן을 옮긴 말입니다. 이 동사는 ‘숨기다’ 또는 ‘묻다’를 뜻할 수 있으며, 여기서는 잠언의 과장되고 우스꽝스러운 장면을 살리기 위해 ‘파묻다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בַּצַּלָּחַת는 ‘접시’, ‘사발’, 또는 ‘쟁반/접시류’로도 옮길 수 있습니다.
    reason: lexical_alternative
