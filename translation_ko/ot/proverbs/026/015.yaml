  lexicon: HALOT
  rationale: 원문의 과장된 비유를 살리기 위해 단순히 ‘넣다’보다 ‘묻다’ 계열을 택했고, 동작의 기이함을 드러내도록 ‘묻고서는’으로 옮겼습니다.
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
