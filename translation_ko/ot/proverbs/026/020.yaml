source:
  edition: WLC
  text: בְּ/אֶ֣פֶס עֵ֭צִים תִּכְבֶּה אֵ֑שׁ וּ/בְ/אֵ֥ין נִ֝רְגָּ֗ן יִשְׁתֹּ֥ק מָדֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
  footnotes:
  - marker: a
    text: Or 'gossip' for 'whisperer.' The Hebrew term refers to a person who spreads damaging talk, often secretly or in a murmuring way.
    reason: lexical_alternative
translation:
  language: ko
  text: 나무가 없으면 불이 꺼지고, 이간질하는 사람이 없으면 다툼이 그칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이간질하는 사람’은 히브리어 נִרְגָּן의 문맥적 의미를 풀어 옮긴 것입니다. 문자적으로는 ‘속삭이는 사람’ 또는 ‘수군거리는 사람’의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס עֵצִים
  english_pob_choice: For lack of wood
  chosen_korean: 나무가 없으면
  alternatives_korean:
  - 장작이 없으면
  - 나무가 부족하면
  lexicon: HALOT
  rationale: בְּאֶפֶס는 ‘부족함/없음’의 조건을 나타내므로, 속담체에 자연스럽고 원문의 인과를 살리는 ‘나무가 없으면’으로 옮겼습니다.
- source_word: נִרְגָּן
  english_pob_choice: whisperer
  chosen_korean: 이간질하는 사람
  alternatives_korean:
  - 수군거리는 사람
  - 헐뜯는 사람
  - 속삭이는 사람
  lexicon: HALOT
  rationale: נִרְגָּן은 단순한 ‘속삭임’보다 남을 해치도록 은밀히 말을 퍼뜨리는 사람을 가리키므로, 문맥적 기능을 드러내는 ‘이간질하는 사람’이 적절합니다.
- source_word: יִשְׁתֹּק מָדוֹן
  english_pob_choice: strife grows quiet
  chosen_korean: 다툼이 그칩니다
  alternatives_korean:
  - 다툼이 잠잠해집니다
  - 분쟁이 그칩니다
  - 갈등이 잠잠해집니다
  lexicon: HALOT
  rationale: שׁתק는 ‘잠잠해지다/그치다’의 뜻이고, מָדוֹן은 ‘다툼/분쟁’이므로, 속담의 결과를 간결하게 살리는 ‘다툼이 그칩니다’로 옮겼습니다.
theological_decisions:
- issue: נִרְגָּן의 사회적 해악을 어떻게 드러낼지
  chosen_reading: ‘이간질하는 사람’으로 옮겨, 공동체 관계를 깨뜨리는 말의 파괴력을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘수군거리는 사람’
  - ‘헐뜯는 사람’
  rationale: 잠언의 경구는 단순한 언어 습관이 아니라 공동체를 분열시키는 행위를 겨냥하므로, 한국어 독자가 결과를 즉시 이해하도록 기능 중심 번역을 택했습니다.
  doctrine_reference: 잠언의 지혜 문학은 공동체 질서를 해치는 말과 행위를 경고합니다.
