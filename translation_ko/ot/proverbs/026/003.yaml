id: PRO.26.3
reference: Proverbs 26:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֣וֹט לַ֭/סּוּס מֶ֣תֶג לַ/חֲמ֑וֹר וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/003.yaml
  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
  footnotes:
  - marker: a
    text: Or 'a lash' for שׁוֹט.
    reason: lexical_alternative
  - marker: b
    text: מֶתֶג can also be rendered 'bit,' though 'bridle' better reflects the controlling gear as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 말에게는 채찍, 나귀에게는 굴레[a], 어리석은 자들의 등에는 막대기가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굴레’는 여기서 단순한 ‘재갈’보다 동물을 제어하는 장비 전체를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹט
  english_pob_choice: whip
  chosen_korean: 채찍
  alternatives_korean:
  - 매
  - 채
  lexicon: HALOT
  rationale: 동물이나 대상을 몰거나 훈육하는 도구라는 뜻을 살려, 현대 한국어에서 가장 자연스러운 대응인 ‘채찍’을 택했습니다.
- source_word: מֶתֶג
  english_pob_choice: bridle
  chosen_korean: 굴레
  alternatives_korean:
  - 재갈
  - 고삐
  lexicon: HALOT
  rationale: 단순한 ‘bit’보다 말 전체를 제어하는 장비라는 점을 살려, 통제용 장구를 넓게 가리키는 ‘굴레’로 옮겼습니다.
- source_word: שֵׁבֶט לְגֵו
  english_pob_choice: a rod for the back
  chosen_korean: 등에 막대기
  alternatives_korean:
  - 등을 위한 회초리
  - 등을 위한 몽둥이
  lexicon: HALOT
  rationale: שֵׁבֶט의 징계·타격 도구라는 의미를 보존하되, 한국어에서는 ‘막대기’가 가장 무난하게 물리적 징계를 드러냅니다. ‘등’은 לְגֵו의 ‘back’에 해당합니다.
- source_word: כְּסִילִים
  english_pob_choice: fools
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 자
  - 우매한 자
  lexicon: HALOT
  rationale: 잠언의 도덕적·지혜문학적 ‘fool’을 한국어의 통상적 성경 어감에 맞추면서도 지나치게 교회식 표현에 고정되지 않도록 ‘어리석은 자’로 옮겼습니다.
