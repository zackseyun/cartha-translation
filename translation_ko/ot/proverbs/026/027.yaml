  - 돌을 옮기는 자는
  lexicon: HALOT
  rationale: 병렬 구조를 살려 두 번째 절도 일반적 행위자를 가리키는 현재분사적 표현으로 옮겼습니다.
- source_word: תָּשׁוּב־
  english_pob_choice: it will come back on him
  chosen_korean: 그 돌이 그에게 되돌아올 것입니다
  alternatives_korean:
  - 그에게 돌아올 것입니다
  - 그에게 되튀어 올 것입니다
  lexicon: HALOT
  rationale: תָּשׁוּב의 되돌아옴/반향의 이미지를 한국어로 자연스럽게 표현하되, 해를 끼치는 역전의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 잠언의 보응 원리 표현
  chosen_reading: 행위가 행위자에게 되돌아오는 도덕적 역전의 원리를 직설적으로 드러냈습니다.
  alternative_readings:
  - 추상적으로 ‘손해를 보게 된다’로 완화하는 읽기
  - 단순 인과로만 축소하는 읽기
  rationale: 이 절은 단순한 실용 조언이 아니라, 악의 의도가 자신에게 되돌아오는 지혜문학의 보응 구조를 보여 주므로 그 긴장을 보존했습니다.
  doctrine_reference: 잠언의 보응/역전 모티프
