    text: Or 'and he who rolls a stone, it will return to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 구덩이를 파는 자는 그 속에 빠질 것이고, 돌을 굴리는 자는 그 돌이 그에게 되돌아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌을 굴리는 자는 그 돌이 그에게 돌아올 것입니다”로도 옮길 수 있습니다.
