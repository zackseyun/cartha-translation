review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two generic participial subjects, the pit, falling into it, and the stone's returning to the one who rolled it. The future-style consequence is appropriate for the Hebrew imperfects. The Korean revision retains this sense, including the potentially harmful reversal implied by the image without adding an explicit motive or theological interpretation.
  naturalness: “누구든지 구덩이를 파는 자는” redundantly combines 누구든지 with a -는 자 construction and is less natural in modern formal Korean. “그 속에” is understandable, but “그 안에” is more idiomatic for a pit. Restructuring the second colon as “돌을 굴리는 사람에게는 그 돌이” naturally represents the Hebrew return ‘to/on him.’
  terminology: “구덩이,” “돌,” and “되돌아오다” are accurate, natural choices. The footnote preserves the stated lexical alternative between 되돌아오다 and 돌아오다. No doctrinally loaded terminology is introduced.
  issues:
  - severity: medium
    issue: Redundant generic-subject expression
    rationale: “누구든지 … 파는 자는” is grammatically possible but stylistically redundant and awkward in standard modern formal Korean. A single generic noun phrase better reflects the Hebrew substantival participle.
  - severity: low
    issue: Overstated interpretive rationale in the metadata
    rationale: The theological decision calls the act an ‘evil intention,’ but the verse itself does not explicitly state the actor’s motive. The translation does not add this claim and should remain limited to the proverb’s reversal imagery.
  revised_text: 구덩이를 파는 사람은 그 안에 빠질 것이며, 돌을 굴리는 사람에게는 그 돌이 되돌아올 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “돌을 굴리는 사람에게는 그 돌이 돌아올 것입니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the redundant mixed generic construction, improves idiomatic Korean reference to the pit, and makes the second clause’s return-to-the-actor relation explicit and natural. It preserves the Hebrew parallelism, generic force, and future consequence, as well as the supplied lexical-alternative footnote.
