  lexicon: WLC/HALOT
  rationale: זֶה류 일반화된 분사 구문을 한국어 속담체로 풀어, 행위자를 보편적으로 가리키는 의미를 살렸습니다.
- source_word: שַּׁחַת
  english_pob_choice: a pit
  chosen_korean: 구덩이
