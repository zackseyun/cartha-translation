  - 웅덩이
  lexicon: HALOT
  rationale: 지혜문학의 보편적 이미지인 ‘pit’를 자연스럽게 옮기되, 덫의 뉘앙스를 과도하게 좁히지 않기 위해 ‘구덩이’를 택했습니다.
- source_word: וְגֹלֵל אֶבֶן
  english_pob_choice: and he who rolls a stone
  chosen_korean: 돌을 굴리는 자는
  alternatives_korean:
