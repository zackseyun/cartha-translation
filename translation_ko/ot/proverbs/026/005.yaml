  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
  footnotes:
  - marker: a
    text: Or, 'Answer a fool as his folly deserves.' The Hebrew means to answer in a way fitting to his folly, not to imitate his foolishness.
    reason: lexical_alternative
  - marker: b
    text: This saying intentionally stands in tension with Proverbs 26:4; wisdom discerns when silence and when rebuttal are appropriate.
    reason: cross_reference
translation:
  language: ko
  text: 미련한 자를 그 미련함대로 대답하라. 그가 스스로 지혜롭다고 여기지 않게 하려 함이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '미련한 자를 그 미련함의 상응하는 대로 대답하라.' 히브리어는 그의 미련함에 합당한 방식으로 대답하는 것을 의미하며, 그의 미련함을 본받는 것을 뜻하지는 않는다.
    reason: alternative_reading
  - marker: b
    text: 이 말씀은 잠언 26:4과 의도적으로 긴장 관계를 이루며, 지혜는 언제 침묵하고 언제 반박해야 하는지를 분별한다.
    reason: alternative_reading
