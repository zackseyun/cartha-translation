  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
  footnotes:
  - marker: a
    text: Or, 'Have you seen a man wise in his own eyes?' The Hebrew perfect can be rendered as a rhetorical observation or question.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 자기 눈에 지혜로운 사람을 보십니까? 그보다 어리석은 사람에게 더 큰 희망이 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 눈에 지혜로운 사람을 본 적이 있습니까?’ 히브리어 완료형은 수사적 관찰이나 질문으로도 번역될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתָ
  english_pob_choice: Do you see
  chosen_korean: 보십니까?
  alternatives_korean:
  - 보셨습니까?
  - 보십니까
  lexicon: HALOT
  rationale: 히브리어 완료형 2인칭 남성 단수는 잠언에서 수사적 관찰이나 질문으로 자연스럽게 읽히므로, 한국어도 현재형 수사 의문문으로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 어떤 사람
  lexicon: HALOT
  rationale: 지혜서의 일반적 사례를 가리키므로, 성별을 과도하게 부각하는 '남자'보다 자연스럽고 보편적인 '사람'을 택했습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 자기 눈에
  alternatives_korean:
  - 자기 보기에
  - 자기 생각에는
  lexicon: HALOT
  rationale: 관용구의 자기평가 의미를 살리되, 직역에 가까운 '자기 눈에'로 본래의 표현력을 유지했습니다.
- source_word: כְּסִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 미련한 사람
  lexicon: HALOT
  rationale: 잠언의 도덕적·지적 완고함을 가리키는 표준 어휘이지만, 현대 한국어에서 비하 강도를 조금 낮추면서도 의미를 보존하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 처리
  chosen_reading: 문두를 실제 질문형으로 옮겨, 잠언이 제시하는 관찰을 독자에게 직접 묻게 했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 '당신은 자기 눈에 지혜로운 사람을 본 적이 있습니다'라고 옮김
  rationale: 히브리어 완료형이 여기서는 단순 과거보다 수사적 질문으로 기능하는 점을 반영해야 잠언의 경구적 긴장이 살아납니다.
  doctrine_reference: 잠언의 수사법과 지혜문학 문체
- issue: לִכְסִיל מִמֶּנּוּ의 비교
  chosen_reading: '''그보다 어리석은 사람에게 더 큰 희망이 있습니다''로 비교 의미를 분명히 했습니다.'
  alternative_readings:
  - '''그에게는 어리석은 사람보다 더 큰 희망이 있습니다'''
  - '''그보다 어리석은 자에게 희망이 더 있습니다'''
  rationale: 히브리어 מן 비교구문을 한국어로 자연스럽게 풀어, 자기만 옳다고 여기는 자보다 오히려 어리석은 자가 더 낫다는 잠언의 역설을 선명하게 전달했습니다.
  doctrine_reference: 지혜문학의 대조적 격언 구조
