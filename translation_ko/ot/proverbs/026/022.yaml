source:
  edition: WLC
  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
  footnotes:
  - marker: a
    text: Or 'like dainty bits' / 'like things greedily swallowed.' The Hebrew term is rare and debated; older tradition rendered it 'like wounds.'
    reason: lexical_alternative
  - marker: b
    text: '''The inner chambers of the belly'' is a Hebrew image for the deepest inward parts of a person.'
    reason: cultural_note
translation:
  language: ko
  text: 수군거리는 자의 말들은 맛있는 한입거리들과 같고, 배 속 깊은 곳으로 내려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 히브리어 표현으로, ‘맛있는 한입거리들’ 외에 ‘입맛 당기는 조각들’ 또는 옛 번역처럼 ‘상처들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배 속 깊은 곳’은 문자적으로 ‘배의 깊은 방들’이라는 히브리어의 신체 은유로, 사람의 가장 깊은 내면을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말은
  alternatives_korean:
  - 말씀은
  - 언사들은
  - 말들
  lexicon: HALOT
  rationale: 히브리어 구성형 복수의 일반적 의미를 자연스럽게 살리되, 잠언체의 간결함을 위해 ‘말은’으로 옮겼습니다.
- source_word: נִרְגָּן
  english_pob_choice: a whisperer
  chosen_korean: 수군거리는 자
  alternatives_korean:
  - 떠드는 사람
  - 헐뜯는 자
  - 뒷말하는 자
  lexicon: HALOT
  rationale: 이 단어는 비밀스럽고 이간하는 말을 퍼뜨리는 사람을 가리키므로, ‘속삭이다’의 이미지보다 행위의 성격을 드러내는 ‘수군거리는 자’가 가장 가까우면서도 문맥에 맞습니다.
- source_word: כְּמִתְלַהֲמִים
  english_pob_choice: like delicious morsels
  chosen_korean: 맛있는 한입거리 같아서
  alternatives_korean:
  - 진미 같은 것처럼
  - 달콤한 한입거리 같아서
  - 탐스럽게 삼키는 것 같아서
  lexicon: HALOT
  rationale: 희귀하고 의미가 논쟁적인 표현이지만, 본문 병행상 사람들에게 달콤하고 쉽게 삼켜지는 말의 이미지를 살려 ‘맛있는 한입거리’로 옮겼습니다. 'wounds'라는 전통 번역은 여기서는 문맥 적합성이 낮아 본문에는 채택하지 않았습니다.
- source_word: חַדְרֵי בָטֶן
  english_pob_choice: the inner chambers of the belly
  chosen_korean: 배 속 깊은 골방들
  alternatives_korean:
  - 배의 방들
  - 내장의 골방들
  - 사람의 가장 깊은 속마음
  lexicon: HALOT
  rationale: 직역하면 ‘배의 방들’이지만, 히브리어의 구체적 은유를 보존하면서도 한국어에서 의미가 통하도록 ‘배 속 깊은 골방들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 신체 은유의 해석 범위
  chosen_reading: ‘배 속 깊은 골방들’은 단순한 신체 내부를 넘어 사람의 가장 깊은 내면까지 가리키는 은유로 읽었습니다.
  alternative_readings:
  - 문자적으로 위장/배의 내부를 가리키는 표현
  - ‘속마음’으로 완전히 풀어쓴 해석
  rationale: 본문의 구체적 이미지를 유지해야 잠언의 경구적 힘이 살아나므로, 본문에는 은유를 살리고 의미는 직역에 가까운 표현으로 전달했습니다.
  doctrine_reference: 성경 은유와 문자-비유 병행 원칙
