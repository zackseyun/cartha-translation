revisions:
- from: 수군거리는 자의 말은 맛있는 한입거리 같아서, 사람의 배 속 깊은 골방들로 내려갑니다.[a][b]
  to: 수군거리는 자의 말들은 맛있는 한입거리들과 같고, 배 속 깊은 곳으로 내려갑니다.[a][b]
  rationale: 단순 병렬인 히브리어 문장 구조를 ‘같고’로 반영하고, 논쟁적인 음식 비유의 복수 형태를 살렸습니다. ‘배 속 깊은 곳’은 현대 한국어에서 자연스럽게 읽히면서도 원문의 신체 은유를 유지하며, 문자적 ‘방들/골방들’의 이미지는 각주에서 명시했습니다.
