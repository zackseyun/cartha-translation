  - ‘말’
  - ‘격언’
  rationale: 본문은 ‘어리석은 자의 입에 있는 잠언’이라는 기이한 대비를 말하므로, 장르명과 속담의 내용을 함께 살릴 수 있는 ‘잠언’이 가장 적절합니다.
  doctrine_reference: 지혜문학의 문학적 평행법과 어휘 의미 범위
- issue: 비교 구조의 처리
  chosen_reading: 첫 절의 이미지에 맞춰 둘째 절을 ‘그러합니다’로 대응시켰습니다.
  alternative_readings:
  - ‘같습니다’
  - ‘이와 같습니다’
  - ‘또한 그러합니다’
  rationale: 히브리어 평행법의 대응 관계를 자연스러운 한국어 비교문으로 옮기되, 원문의 강한 대조를 흐리지 않도록 했습니다.
  doctrine_reference: 히브리 시가의 평행법
