  text: As a door turns on its hinge[a], so a sluggard on his bed.
  footnotes:
  - marker: a
    text: Or 'The door turns on its hinge, and the sluggard on his bed.' The Hebrew uses the article in both nouns, but English proverb style may render them generically.
    reason: lexical_alternative
translation:
  language: ko
  text: 문은 경첩 위에서 돌아가고, 게으른 사람은 침대 위에서 돌아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “문은 경첩 위에서 돌아가고, 게으른 사람은 침대 위에서 돌아갑니다.” 히브리어는 두 명사에 모두 관사를 쓰지만, 잠언식 일반 진술에서는 한국어로 관사를 드러내지 않는 편이 자연스럽습니다.
    reason: lexical_alternative
