translation:
  language: ko
  text: 악한 마음을 품은 불타는 입술은 질그릇에 은 찌꺼기를 입힌 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불타는’은 히브리어 말이 열을 내거나 타오르는 모습을 가리키는 말입니다. ‘뜨거운 입술’로도 옮길 수 있으며, 열렬하거나 강렬하게 들리는 말을 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  english_pob_choice: silver dross
  chosen_korean: 은 찌꺼기
  alternatives_korean:
  - 은의 찌꺼기
  - 은 찌꺼기처럼 보이는 것
  - 은 슬래그
  lexicon: HALOT
  rationale: 정련된 은이 아니라 불순한 잔재라는 뜻을 살리기 위해 ‘은 찌꺼기’로 옮겼습니다. ‘은처럼 만든’은 뒤의 동사와 결합해 겉모양만 번드르르한 대비를 드러냅니다.
- source_word: מְצֻפֶּה
  english_pob_choice: overlaid
  chosen_korean: 입힌
  alternatives_korean:
  - 덮인
  - 입혀진
  - 코팅된
  lexicon: HALOT
  rationale: 겉에 얇게 씌운 외피라는 이미지를 자연스럽게 드러내기 위해 ‘입힌’으로 옮겼습니다. ‘코팅된’은 현대적이지만 비유의 농도를 약화시킬 수 있어 피했습니다.
- source_word: עַל חָרֶשׂ
  english_pob_choice: on earthenware
  chosen_korean: 토기에
  alternatives_korean:
  - 질그릇에
  - 도자기에
  - 흙그릇에
  lexicon: HALOT
  rationale: חָרֶשׂ의 재료 의미를 살리면서도 현대 한국어에서 자연스러운 대비를 이루는 말로 ‘토기’를 택했습니다.
- source_word: דֹּלְקִים
  english_pob_choice: fervent
  chosen_korean: 뜨거운
  alternatives_korean:
  - 불타는
  - 격한
  - 열정적인
  lexicon: HALOT
  rationale: 히브리어 분사는 문자적으로는 ‘타는/불타는’ 열을 가리키므로, 입술의 말이 강하게 달아오른 듯한 이미지를 보존하는 ‘뜨거운’을 썼습니다. EN POB의 ‘fervent’와도 대응됩니다.
- source_word: וְלֶב רָע
  english_pob_choice: with an evil heart
  chosen_korean: 악한 마음
  alternatives_korean:
  - 악한 심장
  - 그리고 악한 마음
  - 그러나 악한 마음
  lexicon: HALOT
  rationale: רָע의 도덕적 악함을 약화시키지 않기 위해 ‘악한’으로 옮겼고, 히브리어의 병렬 대비를 한국어에서는 ‘따릅니다’로 풀어 외적 언어와 내적 실재의 불일치를 드러냈습니다.
theological_decisions:
- issue: 속 겉 대비를 어떻게 드러낼지
  chosen_reading: 겉보기의 번드르름과 내면의 악함이 충돌하는 지혜문학적 경고로 읽었습니다.
  alternative_readings:
  - 단순한 외양과 본심의 대비
  - 아첨하는 말의 비판
  rationale: 본문은 ‘은 찌꺼기-토기’와 ‘뜨거운 입술-악한 마음’의 대비를 통해 말의 외관이 진실을 가릴 수 있음을 경고합니다. EN POB가 ‘fervent’로 과도한 특정 해석을 피한 점을 따라, 한국어도 아첨으로 좁히지 않았습니다.
  doctrine_reference: 잠언의 분별, 위선에 대한 경계
- issue: 관계 표현을 문장으로 풀어낼지
  chosen_reading: 히브리어의 단순 병치를 한국어에서는 ‘따릅니다’로 옮겨 함축된 대비를 분명히 했습니다.
  alternative_readings:
  - 악한 마음과 함께 있습니다
  - 악한 마음이 있습니다
  rationale: 원문은 두 이미지의 병치를 통해 겉말과 속마음의 결합을 보여주므로, 한국어에서 관계를 드러내는 연결동사가 필요합니다. ‘따릅니다’는 표면적 열심이 실제로는 악한 내면에 붙어 있음을 자연스럽게 표현합니다.
  doctrine_reference: 성품의 진실성, 위선의 폭로
