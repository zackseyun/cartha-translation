  source_fidelity: 원문의 비유 구조와 ‘은 찌꺼기’ 및 ‘토기’의 물질 이미지는 대체로 포착했으나, 현행 ‘은처럼 만든 찌꺼기’는 כֶּסֶף סִיגִים(은의 찌꺼기/은 찌꺼기)의 의미를 바꿉니다. 또한 ‘악한 마음이 따릅니다’는 히브리어의 단순 병치·결합을 일방적인 수반 관계로 해석하여 다소 과도하게 풀어냅니다.
  naturalness: ‘은처럼 만든 찌꺼기’는 한국어로도 부자연스럽고 뜻이 불명확합니다. ‘악한 마음을 품은 … 입술’로 관계를 자연스럽게 표현하고, 비유의 비교 대상을 문장 앞뒤로 명료하게 배치하는 편이 현대 표준어에 적합합니다.
  terminology: חָרֶשׂ는 ‘질그릇’이 일상적이고 정확한 대응어이며, סִיגִים는 ‘은 찌꺼기’로 옮기는 것이 적절합니다. דֹּלְקִים의 불·열 이미지와 해석의 여지를 보존하여 ‘불타는’으로 번역하고, 각주에서 ‘뜨거운’을 가능한 대안으로 제시합니다. לֵב רָע는 도덕적 의미를 보존하여 ‘악한 마음’으로 유지합니다.
