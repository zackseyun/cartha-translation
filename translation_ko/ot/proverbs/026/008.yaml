base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/008.yaml
  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
  footnotes:
  - marker: a
    text: Or possibly, 'Like placing a stone in a heap of stones, so is one who gives honor to a fool.' The Hebrew term translated 'sling' is lexically uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌에 새총을 묶어 놓은 것과 같듯이, 어리석은 사람에게 존귀를 주는 사람도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌무더기에 돌을 놓아 두는 것과 같듯이’일 수도 있습니다. 여기서 ‘새총’으로 옮긴 히브리어는 어휘적으로 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/צְר֣וֹר
  english_pob_choice: Like one who binds
  chosen_korean: 묶어 놓은 것과 같듯이
  alternatives_korean:
  - 묶는 것과 같듯이
  - 매는 것과 같듯이
  lexicon: HALOT
  rationale: 히브리어 צרר의 동작성을 살리면서도, 한국어에서 자연스러운 완료된 상태를 나타내는 표현으로 옮겨 비유의 역동성을 유지했습니다.
- source_word: אֶבֶן
  english_pob_choice: a stone
  chosen_korean: 돌
  alternatives_korean:
  - 돌멩이
  - 바위
  lexicon: HALOT
  rationale: 이 단어는 일반적인 ‘돌’이 가장 무표지적이며, 새총 이미지와도 가장 잘 맞습니다.
- source_word: בְּ/מַרְגֵּמָ֑ה
  english_pob_choice: in a sling
  chosen_korean: 새총
  alternatives_korean:
  - 돌무더기
  - 돌더미
  lexicon: HALOT
  rationale: 문맥상 새총 해석이 속담의 비교 구조를 가장 분명하게 살리므로 본문에는 그렇게 옮기고, 어휘상 불확실성은 각주로 남겼습니다.
- source_word: כָּבֽוֹד
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 영광
  - 명예
  lexicon: HALOT
  rationale: 잠언에서의 사회적 평가와 체면의 의미를 살리면서, 현대 한국어에서 ‘주다’와 결합할 때 다소 격식 있는 품위를 유지하는 표현으로 ‘존귀’를 택했습니다.
