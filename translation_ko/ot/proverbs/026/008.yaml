  - severity: medium
    issue: ‘새총’은 여기서 가리키는 고대 물매와 부정확하게 겹칠 수 있습니다.
    rationale: 현대 한국어의 ‘새총’은 보통 Y자형 발사 도구를 뜻합니다. ‘물매’가 성서의 sling에 대한 정착된 표현이며 오해가 적습니다.
  - severity: medium
    issue: 각주 표지가 불확실한 히브리어 단어가 아니라 문장 끝에 놓여 있습니다.
    rationale: 어휘 대안은 מַרְגֵּמָה, 곧 ‘물매’에 관한 것이므로 그 번역어에 표지를 붙여 독자가 각주의 적용 범위를 알 수 있게 해야 합니다.
