  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
  footnotes:
  - marker: a
    text: Or 'When he speaks graciously' or 'When he makes himself sound gracious.' The Hebrew literally says 'when he makes his voice gracious.'
    reason: lexical_alternative
  - marker: b
    text: '''Seven'' likely conveys fullness or completeness in wisdom style, but the number is retained in the main text.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 목소리를 부드럽게 할 때[a], 그를 믿지 말[b]라. 그 마음에는 일곱 가지 가증한 일이 있기[c] 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그가 부드럽게 말할 때' 또는 '그가 자신을 부드럽게 보이게 할 때'. 히브리어는 문자적으로 '그가 목소리를 부드럽게 할 때'라고 합니다.
    reason: alternative_reading
  - marker: b
    text: '''일곱''은 지혜의 문체에서 완전함이나 완성을 나타내는 것으로 보이지만, 본문에는 숫자가 그대로 유지됩니다.'
    reason: alternative_reading
  - marker: c
    text: 히브리어 원문에는 '일곱'이라는 숫자가 명시되어 있으며, 이는 완전함을 상징합니다.
    reason: alternative_reading
