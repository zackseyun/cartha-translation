  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
  footnotes:
  - marker: a
    text: Or 'When he speaks graciously' or 'When he makes himself sound gracious.' The Hebrew literally says 'when he makes his voice gracious.'
    reason: lexical_alternative
  - marker: b
    text: '''Seven'' likely conveys fullness or completeness in wisdom style, but the number is retained in the main text.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 목소리를 상냥하게 낼 때에는[a] 그를 믿지 마십시오. 그의 마음속에는 가증한 것 일곱 가지가 있기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 부드럽게 말할 때’ 또는 ‘그가 자신을 호감 가게 보이게 할 때’. 히브리어를 문자적으로 옮기면 ‘그가 그의 목소리를 은혜롭게 할 때’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일곱’은 지혜 문학의 문체에서 충만함이나 완전함을 나타낼 수 있으나, 본문은 그 숫자를 그대로 사용합니다.
    reason: cultural_note
