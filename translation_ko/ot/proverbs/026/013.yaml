base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/013.yaml
  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
  footnotes:
  - marker: a
    text: Or “in the streets.” The Hebrew refers more specifically to broad public places or squares within a town.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 「길에 사자가 있다! 광장들 가운데에 사자가 있다!」라고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거리들 가운데에’. 히브리어 רְחֹבוֹת는 좁은 골목보다 도시의 넓은 공공 공간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 나태한 사람
  - 게으름뱅이
  lexicon: HALOT
  rationale: 속담에서의 인물 유형을 가리키므로, 문어적이면서도 현대 한국어에서 이해되는 표현으로 옮겼습니다. ‘게으름뱅이’는 구어적 뉘앙스가 강해 품위를 낮출 수 있어 피했습니다.
- source_word: אָמַר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말합니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이지만 잠언의 격언적 현재를 살리기 위해 한국어도 현재형으로 처리했습니다.
- source_word: שַׁחַל / אֲרִי
  english_pob_choice: lion / lion
  chosen_korean: 사자
  alternatives_korean:
  - 큰 사자
  - 사나운 사자
  lexicon: HALOT
  rationale: 두 단어가 나란히 반복되어 게으른 자의 과장된 핑계를 강조하므로, 둘 다 단순히 ‘사자’로 옮겨 반복 효과를 보존했습니다.
- source_word: בֵּין הָרְחֹבוֹת
  english_pob_choice: in the public squares
  chosen_korean: 광장들 가운데에
  alternatives_korean:
  - 큰길들 가운데에
  - 거리들 가운데에
  - 공공 광장들 안에
  lexicon: HALOT
  rationale: רְחֹבוֹת는 좁은 거리보다 도시의 넓은 열린 장소를 가리키므로, 직역적이면서도 한국어에서 자연스러운 ‘광장들’로 옮겼습니다. POB의 ‘public squares’ 의미를 반영해 ‘거리’보다 ‘광장’ 쪽을 택했습니다.
theological_decisions:
- issue: 잠언의 격언적 화법 처리
  chosen_reading: 서술형 과거가 아니라 현재형으로 옮겨, 게으른 사람의 반복적·전형적 발화를 드러냈습니다.
  alternative_readings:
  - 과거형 ‘말하였습니다’
  - 미래/습관상 표현
  rationale: 이 절은 특정 한 번의 발화보다 전형적 태도를 묘사하므로, 한국어에서도 현재형이 저자의 의도를 더 잘 전달합니다.
  doctrine_reference: 지혜문학의 격언적 현재
