- source_word: וּפֶה חָלָק
  english_pob_choice: a flattering mouth
  chosen_korean: 아첨하는 입
  alternatives_korean:
  - 매끄러운 입
  - 매끈한 입
  lexicon: HALOT
  rationale: ‘smooth mouth’의 직역보다, 히브리 관용이 가리키는 아첨·기만의 뜻을 한국어 독자가 바로 이해하도록 ‘아첨하는 입’으로 옮겼습니다.
- source_word: יַעֲשֶׂה מִדְחֶה
  english_pob_choice: causes ruin
  chosen_korean: 파멸을 일으킵니다
  alternatives_korean:
  - 파멸을 가져옵니다
  - 몰락을 일으킵니다
  - 넘어짐을 일으킵니다
  lexicon: HALOT
  rationale: ‘עשה + 명사’의 결과 초래 표현을 한국어 자연어로 풀어 ‘일으키다’로 옮겼습니다. POB의 ‘ruin’은 잠언 문맥상 ‘파멸’이 가장 직접적입니다.
theological_decisions:
- issue: 잠언의 일반 진술 시제 처리
  chosen_reading: 현재형 진술로 옮겨, 거짓과 아첨의 상시적 성격을 드러냈습니다.
  alternative_readings:
  - 미래형 경고로 옮길 수 있음
  - 명령형적 경구로 완화할 수 있음
  rationale: 히브리어 미완료형은 여기서 단순 미래보다 잠언적 일반 진리를 나타내므로, 한국어도 현재형으로 처리하는 것이 의미와 문체에 가장 잘 맞습니다.
  doctrine_reference: 잠언 문학의 격언적 일반화
