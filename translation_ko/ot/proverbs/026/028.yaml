id: PRO.26.28
reference: Proverbs 26:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְֽשׁוֹן שֶׁ֭קֶר יִשְׂנָ֣א דַכָּ֑י/ו וּ/פֶ֥ה חָ֝לָ֗ק יַעֲשֶׂ֥ה מִדְחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/028.yaml
  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
  footnotes:
  - marker: a
    text: Or 'those wounded by it' or 'its crushed ones.' The Hebrew points to victims who have been crushed or oppressed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a smooth mouth'; that is, speech marked by flattery or deceitful smoothness.
    reason: lexical_alternative
  - marker: c
    text: Or 'causes downfall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓 혀는 자기가 짓누른 자들을 미워하고, 아첨하는 입은 파멸을 일으킵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에 의해 상처 입은 자들’ 혹은 ‘짓눌린 자들’입니다. 히브리어는 이미 짓눌리거나 억눌린 피해자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매끄러운 입’입니다. 곧 아첨이나 교묘하게 미끄러운 말투를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘몰락을 일으킵니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  english_pob_choice: a lying tongue
  chosen_korean: 거짓 혀
  alternatives_korean:
  - 거짓말하는 혀
  - 거짓된 혀
  lexicon: HALOT
  rationale: 직역하면 ‘거짓의 혀’이지만, 한국어에서는 ‘거짓 혀’가 잠언의 인격화된 비유를 자연스럽게 살리면서도 도덕적 성격을 분명히 드러냅니다.
- source_word: יִשְׂנָא דַכָּיו
  english_pob_choice: hates those it crushes
  chosen_korean: 자기가 짓누른 자들을 미워하고
  alternatives_korean:
  - 그가 짓누른 자들을 미워하고
  - 짓눌린 자들을 미워하고
  lexicon: HALOT
  rationale: 동사와 분사적 대상의 관계를 한국어에서 분명히 하려고 ‘자기가 짓누른 자들’로 옮겼습니다. 원문의 폭력적 뉘앙스와 주체-대상 관계를 함께 드러냅니다.
- source_word: וּפֶה חָלָק
  english_pob_choice: a flattering mouth
  chosen_korean: 아첨하는 입
  alternatives_korean:
  - 매끄러운 입
  - 매끈한 입
  lexicon: HALOT
  rationale: ‘smooth mouth’의 직역보다, 히브리 관용이 가리키는 아첨·기만의 뜻을 한국어 독자가 바로 이해하도록 ‘아첨하는 입’으로 옮겼습니다.
- source_word: יַעֲשֶׂה מִדְחֶה
  english_pob_choice: causes ruin
  chosen_korean: 파멸을 일으킵니다
  alternatives_korean:
  - 파멸을 가져옵니다
  - 몰락을 일으킵니다
  - 넘어짐을 일으킵니다
  lexicon: HALOT
  rationale: ‘עשה + 명사’의 결과 초래 표현을 한국어 자연어로 풀어 ‘일으키다’로 옮겼습니다. POB의 ‘ruin’은 잠언 문맥상 ‘파멸’이 가장 직접적입니다.
theological_decisions:
- issue: 잠언의 일반 진술 시제 처리
  chosen_reading: 현재형 진술로 옮겨, 거짓과 아첨의 상시적 성격을 드러냈습니다.
  alternative_readings:
  - 미래형 경고로 옮길 수 있음
  - 명령형적 경구로 완화할 수 있음
  rationale: 히브리어 미완료형은 여기서 단순 미래보다 잠언적 일반 진리를 나타내므로, 한국어도 현재형으로 처리하는 것이 의미와 문체에 가장 잘 맞습니다.
  doctrine_reference: 잠언 문학의 격언적 일반화
