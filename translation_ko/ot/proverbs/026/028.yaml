source:
  edition: WLC
  text: לְֽשׁוֹן שֶׁ֭קֶר יִשְׂנָ֣א דַכָּ֑י/ו וּ/פֶ֥ה חָ֝לָ֗ק יַעֲשֶׂ֥ה מִדְחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/028.yaml
  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
  footnotes:
  - marker: a
    text: Or 'those wounded by it' or 'its crushed ones.' The Hebrew points to victims who have been crushed or oppressed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a smooth mouth'; that is, speech marked by flattery or deceitful smoothness.
    reason: lexical_alternative
  - marker: c
    text: Or 'causes downfall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓말하는 혀는 자신이 짓밟은 이들을[a] 미워하고, 아첨하는 입은[b] 파멸을[c] 초래합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에게 상처 입은 이들’ 또는 ‘그것에게 짓밟힌 이들’입니다. 히브리어는 짓밟히거나 억눌린 피해자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매끄러운 입’입니다. 곧 아첨하거나 교활하게 꾸미는 말을 하는 입을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘몰락을 초래합니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  english_pob_choice: a lying tongue
  chosen_korean: 거짓 혀
  alternatives_korean:
