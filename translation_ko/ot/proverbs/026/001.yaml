  language: ko
  text: 겨울에 내리는 눈과 추수 때 내리는 비처럼, 어리석은 사람에게 존귀는 어울리지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여름에 눈과 추수 때 비가 내리는 것처럼, 어리석은 사람에게 존귀는 어울리지 않습니다.”
