base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
  footnotes:
  - marker: a
    text: Or 'As snow in summer and rain at harvest, so honor does not befit a fool.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여름에 내리는 눈과 추수 때 내리는 비처럼, 어리석은 사람에게 명예는 어울리지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּשֶּׁלֶג ... וְכַמָּטָר
  english_pob_choice: Like snow ... and like rain
  chosen_korean: “겨울에 내리는 눈과 추수 때 내리는 비”
  alternatives_korean:
  - 눈처럼 ... 비처럼
  - 여름의 눈과 추수의 비
  lexicon: HALOT
  rationale: 비유 구조를 한국어의 자연스러운 관용으로 옮기되, 비교의 핵심인 두 계절적 이미지가 분명히 드러나도록 했습니다.
- source_word: בַּקַּיִץ / בַּקָּצִיר
  english_pob_choice: in summer / at harvest
  chosen_korean: “겨울에 … 추수 때”
  alternatives_korean:
  - “여름에 … 수확할 때”
  - “한여름에 … 추수할 때”
  lexicon: HALOT
  rationale: 히브리어의 계절 대비를 한국어 독자가 즉시 이해하도록 풀어 적되, 원문의 부조화(눈과 여름, 비와 추수)를 보존하기 위해 ‘추수 때’라는 시기성을 살렸습니다.
- source_word: לֹא נָאוֶה
  english_pob_choice: is not fitting
  chosen_korean: “어울리지 않습니다”
  alternatives_korean:
  - “적절하지 않습니다”
  - “마땅하지 않습니다”
  - “합당하지 않습니다”
  lexicon: HALOT
  rationale: נָאוֶה의 ‘어울림/적합함’ 뉘앙스를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 선택했습니다.
- source_word: כָּבוֹד
  english_pob_choice: honor
  chosen_korean: “존귀”
  alternatives_korean:
  - “명예”
  - “존경”
  - “영광”
  lexicon: HALOT
  rationale: 이 지혜문맥에서 כָּבוֹד는 사회적 명예나 위신을 뜻하지만, 한국어에서는 ‘존귀’가 지나치게 종교화되지 않으면서도 사람에게 부여되는 높은 존칭의 무게를 잘 드러냅니다.
