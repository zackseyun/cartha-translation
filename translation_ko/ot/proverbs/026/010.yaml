  yaml_path: translation/ot/proverbs/026/010.yaml
  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
  footnotes:
  - marker: a
    text: Hebrew text is notoriously difficult. 'Like an archer who wounds everyone' follows a long-standing interpretation. Other renderings take the opening more literally, such as 'A great man brings forth all things' or similar, but these are less coherent in context.
    reason: alternative_reading
  - marker: b
    text: Or 'hires a fool and hires any passerby.' The point is indiscriminate hiring that causes harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 사람에게 상처를 입히는 궁수와 같은 이는 미련한 자를 고용하거나 지나가는 사람을 고용하는 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 매우 어렵습니다. ‘모든 사람에게 상처를 입히는 궁수와 같은 이’라는 번역은 오랜 해석을 따릅니다. 다른 번역들은 첫 구절을 더 문자적으로 ‘위대한 사람이 모든 것을 낳는다’ 또는 이와 비슷하게 이해하지만, 문맥에서는 덜 분명합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘미련한 자와 아무 지나가는 사람이나 고용하는 사람’. 요지는 해를 일으키는 무분별한 고용입니다.
    reason: lexical_alternative
