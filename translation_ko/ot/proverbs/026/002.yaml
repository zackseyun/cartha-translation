  source_fidelity: 두 새의 움직임과 까닭 없는 저주라는 기본 의미는 잘 반영했습니다. 그러나 ‘닿지 않습니다’는 לֹא תָבֹא(문자적으로 ‘오지 않는다’)보다 저주가 특정 대상에 도달한다는 의미를 다소 명시적으로 보태며, 원문의 열린 비유를 좁힐 수 있습니다.
  naturalness: ‘그 떠돎 속에 있는 것 같고’, ‘그 날아감 속에 있는 것 같으니’는 현대 한국어에서 부자연스럽고 장황합니다. 동작을 직접 연결한 간결한 비유 표현이 자연스럽습니다.
  terminology: ‘참새’와 ‘제비’는 본문 선택으로 적절합니다. 다만 swift의 한국어 명칭은 ‘빠른새’가 아니라 통상 ‘칼새’입니다. ‘까닭 없는 저주’도 חִנָּם의 의미를 충실히 보존합니다.
  issues:
