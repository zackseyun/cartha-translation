id: PRO.26.2
reference: Proverbs 26:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/צִּפּ֣וֹר לָ֭/נוּד כַּ/דְּר֣וֹר לָ/ע֑וּף כֵּ֥ן קִֽלְלַ֥ת חִ֝נָּ֗ם לא תָבֹֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
  footnotes:
  - marker: a
    text: Or 'like a swift' for the second bird term.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a curse without cause'; that is, a baseless or undeserved curse.
    reason: lexical_alternative
  - marker: c
    text: Literally 'does not come.' The imagery suggests it does not land or take effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 참새가 그 떠돎 속에 있는 것 같고, 제비가 그 날아감 속에 있는 것 같으니 — 까닭 없는 저주는 닿지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빠른새’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘까닭 없는 저주’, 곧 근거 없고 마땅하지 않은 저주를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘오지 않는다’입니다. 새가 내려앉지 않거나 효력을 얻지 못한다는 그림이 함께 떠오릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  english_pob_choice: Like a sparrow
  chosen_korean: 참새가
  alternatives_korean:
  - 새가
  - 작은 새가
  lexicon: HALOT
  rationale: צִפּוֹר은 일반적으로 작은 새를 가리킬 수 있지만, 지혜문학의 평행법에서 ‘참새’가 자연스럽고 간결한 구체화입니다.
- source_word: לָנוּד
  english_pob_choice: in its wandering
  chosen_korean: 그 떠돎 속에 있는 것 같고
  alternatives_korean:
  - 떠돌며
  - 방황하며
  - 그 떠돎 가운데
  lexicon: HALOT
  rationale: נוּד의 핵심은 정처 없이 이리저리 움직이는 상태이므로, 동사보다 명사구로 살려 앞 절의 비유적 정서를 유지했습니다.
- source_word: כַּדְּרוֹר
  english_pob_choice: like a swallow
  chosen_korean: 제비가
  alternatives_korean:
  - 아마도 그 빠른 새가
  - 제비과 새가
  lexicon: HALOT
  rationale: 드로르는 통상 ‘제비’로 옮기며, 영어 POB의 본문 선택과도 맞물립니다. ‘swift’ 가능성은 주석으로 남길 수 있습니다.
- source_word: לָעוּף
  english_pob_choice: in its flying
  chosen_korean: 그 날아감 속에 있는 것 같으니
  alternatives_korean:
  - 날며
  - 비행하는 가운데
  lexicon: HALOT
  rationale: עוּף의 단순한 ‘날다’를 한국어로 직역하기보다, 첫 절과 대칭되는 상태 표현으로 처리해 시적 평행을 살렸습니다.
- source_word: חִנָּם
  english_pob_choice: undeserved
  chosen_korean: 까닭 없는
  alternatives_korean:
  - 부당한
  - 아무 근거 없는
  - 헛된
  lexicon: HALOT
  rationale: חִנָּם의 ‘without cause / gratuitously’ 의미를 현대 한국어로 자연스럽게 옮겨, 저주의 근거 없음이 드러나게 했습니다.
- source_word: לֹא תָבֹא
  english_pob_choice: does not come to rest
  chosen_korean: 닿지 않습니다
  alternatives_korean:
  - 내리지 않습니다
  - 도달하지 않습니다
  - 머물지 않습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘오지 않는다’이지만, 날아다니는 새의 비유 안에서 저주가 대상에 이르러 정착하지 않는 뜻을 살리기 위해 ‘닿지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 속담의 결론부를 어떻게 드러낼지
  chosen_reading: 저주는 결국 대상에 붙지 못하고 효력을 얻지 못한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘오지 않는다’로 옮기는 읽기
  - 하나님의 보호를 암시하는 더 강한 신학적 해석
  rationale: 본문은 지혜문학의 비유로서, 근거 없는 저주의 무력함을 말합니다. ‘닿지 않습니다’는 그 비유적 함의를 과장 없이 드러냅니다.
  doctrine_reference: 잠언 26:2의 지혜적 관찰
- issue: 두 번째 새의 명칭 변이
  chosen_reading: 본문은 전통적으로 ‘제비’로 옮기되, 다른 조류 식별 가능성은 주석으로 열어 둡니다.
  alternative_readings:
  - ‘빠른 새(swift)’로 본문 번역
  - 그냥 ‘새’로 일반화
  rationale: 독자는 익숙한 한국어 조류명을 통해 이미지에 바로 접근할 수 있어야 하며, 식별상의 불확실성은 본문이 아니라 주석에서 처리하는 것이 적절합니다.
  doctrine_reference: 잠언 번역의 어휘 선택 원칙
