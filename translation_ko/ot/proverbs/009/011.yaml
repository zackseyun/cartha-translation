  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 여기서 ‘~로 말미암아’, ‘~안에서’, ‘~통하여’처럼 가까운 의미 범위로 이해될 수 있으나, 문맥상 수단·매개를 나타내는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  english_pob_choice: by me
  chosen_korean: 내게서 말미암아
  alternatives_korean:
  - 내 안에서
  - 나를 통해
  lexicon: HALOT
  rationale: 문맥상 지혜가 생명을 늘리는 수단이므로, 단순한 위치보다 원인·매개를 드러내는 표현이 적절합니다.
- source_word: יִרְבּוּ
  english_pob_choice: will be multiplied
  chosen_korean: 많아질 것입니다
