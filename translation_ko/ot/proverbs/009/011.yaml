translation:
  language: ko
  text: 이는 나로 말미암아 네 날들이 많아지고, 네가 살 햇수가 더해질 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 여기서 ‘나로 말미암아’, ‘내 안에서’, ‘나를 통하여’ 등 서로 가까운 뜻으로 이해될 수 있습니다. 문맥상으로는 수단이나 매개를 나타내는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  english_pob_choice: by me
  chosen_korean: 내게서 말미암아
  alternatives_korean:
  - 내 안에서
  - 나를 통해
  lexicon: HALOT
  rationale: 문맥상 지혜가 생명을 늘리는 수단이므로, 단순한 위치보다 원인·매개를 드러내는 표현이 적절합니다.
- source_word: יִרְבּוּ
  english_pob_choice: will be multiplied
  chosen_korean: 많아질 것입니다
  alternatives_korean:
  - 증가할 것입니다
  - 배가될 것입니다
  lexicon: HALOT
  rationale: ‘날들’이 주어이므로 한국어에서는 ‘많아지다’가 자연스럽고, 히브리어의 ‘많아지다/불어나다’ 의미를 잘 살립니다.
- source_word: וְיוֹסִיפוּ לְּךָ
  english_pob_choice: will be added to you
  chosen_korean: 네게 … 더해질 것입니다
  alternatives_korean:
  - 네게 더하여질 것입니다
  - 너에게 보태질 것입니다
  lexicon: HALOT
  rationale: 여격 표지의 수혜 관계를 살리면서도 수동적 결과를 자연스럽게 옮기기 위해 ‘더해지다’를 택했습니다.
- source_word: שְׁנוֹת חַיִּים
  english_pob_choice: years of life
  chosen_korean: 생명의 해들
  alternatives_korean:
  - 살아 있는 해들
  - 생명과 같은 해들
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 비교적 직역하되, 한국어로는 관용적인 ‘생명의 해들’이 간결하고 의미를 보존합니다.
theological_decisions:
- issue: 지혜가 말하는 1인칭 표현을 어떻게 옮길지
  chosen_reading: ‘내게서 말미암아’로 지혜의 인격화된 발화를 유지했습니다.
  alternative_readings:
  - ‘나로 말미암아’
  - ‘내 안에서’
  rationale: 잠언 9장의 지혜는 인격화된 화자로 제시되므로, 무생물적 설명보다 1인칭 화자성을 살리는 번역이 본문 의도에 가깝습니다.
  doctrine_reference: '문맥 신학: 잠언 9장의 지혜 인격화'
