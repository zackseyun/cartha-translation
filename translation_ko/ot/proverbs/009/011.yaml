  yaml_path: translation/ot/proverbs/009/011.yaml
  text: For by me your days will be multiplied[a], and years of life will be added to you.
  footnotes:
  - marker: a
    text: 'Or ''in me'' or ''through me''; the Hebrew preposition can be understood in several closely related senses here, though the context favors instrumentality: Wisdom is the means by which life is prolonged.'
