  - 배가될 것입니다
  lexicon: HALOT
  rationale: ‘날들’이 주어이므로 한국어에서는 ‘많아지다’가 자연스럽고, 히브리어의 ‘많아지다/불어나다’ 의미를 잘 살립니다.
- source_word: וְיוֹסִיפוּ לְּךָ
  english_pob_choice: will be added to you
  chosen_korean: 네게 … 더해질 것입니다
