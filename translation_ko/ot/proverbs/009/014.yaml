base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/014.yaml
  text: and sits at the doorway of her house[a], on a seat at the heights of the city,
  footnotes:
  - marker: a
    text: Or 'on a throne at the high places of the city.' The Hebrew כִּסֵּא can denote a royal seat or throne, but the immediate context does not require regal imagery, so 'seat' is retained in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자기 집 문어귀에, 도시의 높은 곳에 있는 자리에 앉아 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시의 높은 곳에 있는 왕좌’로 옮길 수 있습니다. 히브리어 כִּסֵּא는 왕의 자리나 왕좌를 가리킬 수 있지만, 바로 앞뒤 문맥은 왕실 이미지를 요구하지 않으므로 본문에서는 ‘자리’를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבָה
  english_pob_choice: and sits
  chosen_korean: 앉아 있으며
  alternatives_korean:
  - 앉아 있습니다
  - 앉아 있고
  - 앉아 있습니다만
  lexicon: HALOT
  rationale: 지속적이고 장면 묘사적인 현재상을 살리기 위해 한국어 연결형으로 처리했습니다. 단순 과거보다 현재 진행적 상태가 자연스럽습니다.
- source_word: לְפֶתַח
  english_pob_choice: at the doorway
  chosen_korean: 집 문 어귀에
  alternatives_korean:
  - 문간에
  - 현관에
  - 입구에
  lexicon: HALOT
  rationale: פֶּתַח의 ‘열림/입구’ 이미지를 살리면서도 현대 한국어에서 자연스러운 구체적 공간 표현으로 옮겼습니다.
- source_word: כִּסֵּא
  english_pob_choice: a seat
  chosen_korean: 자리
  alternatives_korean:
  - 좌석
  - 왕좌
  - 의자
  lexicon: HALOT
  rationale: 문맥상 왕권 이미지를 확정할 필요는 없으므로, POB의 'seat'처럼 중립적인 ‘자리’를 택해 과도한 왕정적 의미를 피했습니다.
- source_word: מְרֹמֵי קָרֶת
  english_pob_choice: the heights of the city
  chosen_korean: 도시의 높은 곳
  alternatives_korean:
  - 도시의 높은 곳들
  - 성읍의 높은 곳
  - 도시의 고지대
  lexicon: HALOT
  rationale: ‘높은 곳’이라는 지리적·공공적 위치를 자연스럽게 전달하되, 히브리어 복수 구성의 수사성을 과도하게 풀어쓰지 않았습니다.
theological_decisions:
- issue: כִּסֵּא의 왕좌/보통 자리 의미
  chosen_reading: 이 구절에서는 통치의 왕좌가 아니라 공개된 장소에 놓인 보통의 ‘자리’로 읽었습니다.
  alternative_readings:
  - 왕좌로 읽을 수 있음
  - 권력적 위상을 강조하는 번역
  rationale: POB 주석처럼 즉각적 문맥은 왕권보다 ‘어리석음’의 공개적 유혹 장면에 초점이 있으므로, 상징을 과장하지 않고 본문이 요구하는 범위 안에서 번역했습니다.
  doctrine_reference: 문맥 우선의 서술 해석
