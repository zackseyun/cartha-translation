lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  english_pob_choice: The woman Folly
  chosen_korean: 어리석음의 여인
  alternatives_korean:
  - 어리석음 여인
  - 우매의 여인
  - 어리석은 여인
  lexicon: HALOT
  rationale: 히브리어의 '지혜/어리석음' 의인화 구조를 살려, 단순한 성격 묘사보다 '어리석음'이라는 개념 자체가 여인으로 형상화된 점을 드러냈습니다.
- source_word: הֹמִיָּה
  english_pob_choice: is loud
  chosen_korean: 시끄럽습니다
  alternatives_korean:
  - 요란합니다
  - 소란스럽습니다
  - 떠들썩합니다
  lexicon: HALOT
  rationale: 소리의 크기뿐 아니라 사람들을 끌어들이는 공공연한 소란스러움을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: פְּתַיּוּת
  english_pob_choice: simple
  chosen_korean: 어리석고
  alternatives_korean:
  - 순진하고
  - 단순하고
  - 미숙하고
  lexicon: HALOT
  rationale: 문맥상 '단순함' 자체보다 지혜가 결여된 상태를 말하므로, 한국어에서는 앞 절의 '어리석음'과 연결되는 형용사로 풀어 주었습니다.
- source_word: וּבַל יָדְעָה מָּה
  english_pob_choice: knows nothing
  chosen_korean: 아무것도 모릅니다
  alternatives_korean:
  - 무엇도 알지 못합니다
  - 도대체 무엇인지 모릅니다
  - 무엇인지도 알지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 '무엇을 알지 못한다'는 표현을 자연스러운 한국어 관용구로 옮기되, 완전한 무지의 강조를 유지했습니다.
theological_decisions:
- issue: 의인화된 '어리석음'의 번역
  chosen_reading: 개념을 인격화한 표현으로 유지했습니다.
  alternative_readings:
  - 단순히 '어리석은 여자'로 완화함
  - 추상명사를 빼고 성격 묘사로만 처리함
  rationale: 잠언 9장의 대조 구조에서 어리석음은 지혜와 대응하는 여성 인물로 제시되므로, 그 의인화를 약화시키지 않는 번역이 본문의 수사와 의미를 더 잘 전달합니다.
  doctrine_reference: 잠언 9장의 지혜/어리석음 의인화
