id: PRO.9.3
reference: Proverbs 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָֽׁלְחָ֣ה נַעֲרֹתֶ֣י/הָ תִקְרָ֑א עַל גַּ֝פֵּ֗י מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
  footnotes:
  - marker: a
    text: Or 'her maidens.' The Hebrew may refer to young female attendants or servant-girls; 'young women' preserves the age/gender sense without overstating social rank.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the heights of the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자기 젊은 여자들을 보내고[a] — 도시의 높은 곳에서 외칩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그녀의 젊은 여자들’로, 나이와 성별을 드러내는 표현입니다. 문맥상 시녀를 뜻할 수 있지만, 지위까지 강하게 못 박지 않기 위해 이렇게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘도시의 높이 위에서’입니다. 한국어에서는 공적 외침의 장소를 자연스럽게 살리기 위해 ‘도시의 높은 곳에서’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְחָה
  english_pob_choice: has sent out
  chosen_korean: 보내고
  alternatives_korean:
  - 보냈습니다
  - 내보내고
  - 보내어
  lexicon: HALOT
  rationale: 여성 주어(지혜)의 완료 동작을 한국어 연결형으로 자연스럽게 살리되, 영어의 현재완료가 가진 ‘이미 준비해 둔 뒤 이어지는 부름’의 흐름을 과도하게 해석하지 않도록 했습니다.
- source_word: נַעֲרֹתֶיהָ
  english_pob_choice: her young women
  chosen_korean: 자기 젊은 여자들
  alternatives_korean:
  - 그녀의 시녀들
  - 그녀의 처녀들
  - 그녀의 젊은 여성들
  lexicon: HALOT
  rationale: hebrew의 נערות는 나이·성별을 드러내는 말이어서, 지위까지 강하게 지정하는 ‘시녀들’보다 ‘젊은 여자들’이 원문의 폭을 더 잘 보존합니다.
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  english_pob_choice: from the heights of the city
  chosen_korean: 도시의 높은 곳에서
  alternatives_korean:
  - 도시의 높은 지대에서
  - 도시의 꼭대기에서
  - 도성의 높은 곳에서
  lexicon: HALOT
  rationale: 직역하면 ‘도시의 높이 위에서’에 가깝지만, 한국어에서는 ‘높은 곳에서’가 공적 외침의 장면을 가장 자연스럽게 전달합니다.
- source_word: תִקְרָא
  english_pob_choice: she calls
  chosen_korean: 외칩니다
  alternatives_korean:
  - 부릅니다
  - 소리칩니다
  - 외쳐 부릅니다
  lexicon: HALOT
  rationale: 공공장소에서의 호소를 드러내는 동사로서 단순 ‘부르다’보다 ‘외치다’가 더 적절하며, 현재형으로 계속되는 선포성을 살렸습니다.
theological_decisions:
- issue: 지혜의 인격화와 여성 대명사 유지
  chosen_reading: 지혜를 여성 주어로 살리고, 3인칭 여성형의 동작을 그대로 반영했습니다.
  alternative_readings:
  - 중성적 표현으로 바꾸어 주어의 성별 표지를 희석함
  - ‘그녀’를 생략해 문장을 일반화함
  rationale: 이 절은 지혜가 의인화되어 공개적으로 부르는 장면이므로, 여성 주어와 그에 맞는 서술을 유지해야 본문의 수사와 구조가 드러납니다.
  doctrine_reference: 잠언의 지혜 의인화 수사
