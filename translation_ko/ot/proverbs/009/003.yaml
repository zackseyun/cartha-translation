  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
  footnotes:
  - marker: a
    text: Or 'her maidens.' The Hebrew may refer to young female attendants or servant-girls; 'young women' preserves the age/gender sense without overstating social rank.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the heights of the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자신의 젊은 여인들을 보냈고[a], 도시의 높은 곳에서 외칩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그녀의 젊은 여인들’입니다. 문맥상 시녀나 여성 수행원을 가리킬 수 있으나, 그 지위를 분명히 정하는 말은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘도시의 높은 곳들 위에서’입니다. 히브리어는 도시의 높고 두드러진 곳에서 외치는 모습을 나타냅니다.
    reason: lexical_alternative
