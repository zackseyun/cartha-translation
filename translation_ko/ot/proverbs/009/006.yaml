  text: Leave the simple[a], and live; and walk in the way of understanding.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Leave the simple ones.' The sense in context is to leave behind simplicity or the company/condition of the simple, hence 'Leave your simple ways.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자들을 떠나고, 살며, 명철의 길로 걸으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어리석은 자들’을 뜻합니다. 문맥상 단순함의 상태를 떠나라는 뜻까지 포함하므로, ‘어리석은 자들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  english_pob_choice: Leave
  chosen_korean: 떠나고
  alternatives_korean:
  - 버리고
  - 떠나십시오
  lexicon: HALOT
  rationale: 히브리어 복수 명령형의 결단성은 살리되, 한국어에서는 대상과의 분리를 자연스럽게 표현하는 ‘떠나고’가 가장 간결합니다.
- source_word: פְתָאיִם
  english_pob_choice: the simple / your simple ways
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 단순한 자들
  - 미숙한 자들
  - 너희의 어리석은 길
  lexicon: HALOT
  rationale: 본문은 ‘단순함’이라는 상태보다 ‘פתאים’ 자체, 곧 분별이 없는 사람들을 가리키므로 직역에 가깝게 ‘어리석은 자들’로 옮겼습니다.
- source_word: בִּינָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 분별
  - 깨달음
  lexicon: HALOT
  rationale: 잠언의 지혜 문맥에서 בינה는 단순한 이해보다 분별력 있는 지혜를 뜻하므로, 한국어 지혜문학의 어감이 살아 있는 ‘명철’을 택했습니다.
theological_decisions:
- issue: 대상 회피 명령의 수용
  chosen_reading: 지혜가 제시하는 길을 따르기 위해, 먼저 잘못된 사람들의 무리와 상태를 떠나라는 촉구로 읽었습니다.
  alternative_readings:
  - 단지 지적 습관의 교정
  - 추상적 무지에서의 전환
  rationale: 문맥상 지혜는 삶의 방향 전환을 요구하므로, 사회적·윤리적 분리를 포함하는 강한 권면을 유지하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 회개·훈련 강조
