    rationale: 문맥상 지혜는 ‘어수룩한 자들’에게 말하고 있으며, 이를 그대로 한국어로 옮기면 수신자가 자기 자신을 떠나라는 부자연스러운 뜻이 됩니다. 또한 פתי는 악한 자를 뜻하는 표현이 아니라 경험과 분별이 부족한 사람을 가리킵니다.
