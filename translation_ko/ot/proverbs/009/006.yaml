  verdict: revise
  source_fidelity: פְתָאִים은 문자적으로는 ‘어수룩한/미숙한 사람들’을 가리키지만, 이 구절에서는 바로 그 부류에게 자신의 단순함을 버리라고 권하는 것으로 이해하는 것이 문맥에 가장 잘 맞습니다. 초안의 ‘어리석은 자들을 떠나고’는 수신자 자신을 떠나라는 말처럼 들리고, פתי를 도덕적 악행을 뜻하는 ‘어리석은’으로 과도하게 좁힙니다. 세 명령의 병렬성과 בְּדֶרֶךְ בִּינָה의 삶의 길 비유를 보존했습니다.
  naturalness: ‘어수룩함을 버리고 살며, 명철의 길을 걸으십시오’는 현대 표준어 합쇼체로 자연스럽고, 잠언의 간결한 권면 문체도 유지합니다. ‘명철의 길로 걸으십시오’보다 ‘명철의 길을 걸으십시오’가 한국어에서 더 자연스럽습니다.
  terminology: פתי에는 ‘어수룩한’이 ‘어리석은’보다 적절하며, בינה는 잠언 문맥에서 ‘명철’로 옮길 수 있습니다. 원문의 명사 복수형과 문맥적 추상 이해 사이의 긴장은 각주로 밝혀야 합니다.
  issues:
