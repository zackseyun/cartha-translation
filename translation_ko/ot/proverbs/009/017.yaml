  text: מַֽיִם גְּנוּבִ֥ים יִמְתָּ֑קוּ וְ/לֶ֖חֶם סְתָרִ֣ים יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/017.yaml
  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
  footnotes:
  - marker: a
    text: Or 'bread of secrecy' / 'bread in hidden places.' The Hebrew expression is compressed; the translation brings out the likely idiomatic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 훔친 물은 달고, 비밀의 빵은 즐겁습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘비밀의 빵’ 또는 ‘숨은 곳의 빵’입니다. 원문은 압축적 표현이어서 문맥상 ‘비밀리에 얻은 빵’의 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַֽיִם גְּנוּבִ֥ים
  english_pob_choice: stolen water
  chosen_korean: 훔친 물
  alternatives_korean:
  - 도둑맞은 물
  - 훔쳐 온 물
  lexicon: HALOT
  rationale: גְּנוּבִים은 גנב의 수동 분사로 ‘훔친/도둑맞은’이 직접적이며, 물을 일반 명사로 자연스럽게 살려 ‘훔친 물’로 옮겼습니다.
- source_word: יִמְתָּקוּ
  english_pob_choice: is sweet
  chosen_korean: 달고
  alternatives_korean:
  - 달다
  - 달게 느껴집니다
  lexicon: HALOT
  rationale: 맛의 상태를 나타내는 형용적 서술이므로, 한국어에서는 ‘달다’보다 병렬을 살린 ‘달고’가 앞절과 자연스럽게 이어집니다.
- source_word: לֶחֶם סְתָרִים
  english_pob_choice: bread of secrecy
  chosen_korean: 비밀의 빵
  alternatives_korean:
  - 숨은 곳의 빵
  - 비밀스러운 빵
  - 은밀한 빵
  lexicon: HALOT
  rationale: סְתָרִים은 ‘숨김/비밀’의 명사적 표현이므로, 영어 POB의 문맥을 따르되 원문의 압축성을 반영해 ‘비밀의 빵’으로 옮겼습니다.
- source_word: יִנְעָם
  english_pob_choice: is pleasant
  chosen_korean: 즐겁습니다
  alternatives_korean:
  - 기분 좋습니다
  - 달갑습니다
  - 즐겁습니다
  lexicon: HALOT
  rationale: נעם의 평정적·감각적 ‘즐겁다/기쁘다’의 뉘앙스를 살리면서, 앞절의 ‘달고’와 대구를 이루도록 자연스러운 서술형으로 처리했습니다.
theological_decisions:
- issue: 잠언 9:17의 경구적·유혹적 어조
  chosen_reading: 문장은 사실 진술처럼 말하지만, 전체적으로는 금지된 쾌락의 유혹을 은근히 부추기는 경구로 읽었습니다.
  alternative_readings:
  - 단순한 관찰 진술
  - 도덕적 경고의 직접화
  rationale: 원문은 짧은 병렬 문장으로 유혹의 매력을 압축해 제시하므로, 해설을 덧붙이지 않고 문장 자체의 아이러니를 보존하는 번역이 적절합니다.
  doctrine_reference: 잠언 문학의 경구적 아이러니와 지혜/어리석음의 대비
