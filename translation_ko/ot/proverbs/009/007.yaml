id: PRO.9.7
reference: Proverbs 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֹ֤סֵ֨ר לֵ֗ץ לֹקֵ֣חַֽ ל֣/וֹ קָל֑וֹן וּ/מוֹכִ֖יחַ לְ/רָשָׁ֣ע מוּמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
  footnotes:
  - marker: a
    text: Or 'takes disgrace to himself' for 'gets dishonor for himself.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his blemish'; the phrase may mean that the rebuker receives abuse or reproach from the wicked person.
    reason: lexical_alternative
  - marker: c
    text: '''Wicked man'' renders a masculine singular Hebrew form used generically.'
    reason: cultural_note
translation:
  language: ko
  text: 훈계하는 자는 조롱하는 자에게서 자기에게 돌아오는 수치를 얻고, 책망하는 자는 악한 사람에게서 자기에게 돌아오는 흠을 얻습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹסֵר
  english_pob_choice: Whoever corrects
  chosen_korean: 훈계하는 자는
  alternatives_korean:
  - 교정하는 자는
  - 책망하는 자는
  - 가르쳐 바로잡는 자는
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 יסר는 징계만이 아니라 바로잡는 훈계의 뜻을 포함하므로, 한국어에서는 과도하게 형벌적으로 들리지 않는 ‘훈계하다’로 옮겼습니다.
- source_word: לֵץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조소하는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: לץ의 핵심은 지혜를 경멸하며 조롱하는 태도이므로, 현대 한국어에서 그 경멸적 뉘앙스를 살리는 ‘조롱하는 자’를 선택했습니다.
- source_word: קָלוֹן
  english_pob_choice: dishonor
  chosen_korean: 수치
  alternatives_korean:
  - 불명예
  - 치욕
  - 수모
  lexicon: HALOT
  rationale: קָלוֹן은 공적 수치와 불명예를 가리키므로, 시어의 간결함을 살리면서도 강도를 유지하는 ‘수치’로 옮겼습니다.
- source_word: מוּמוֹ
  english_pob_choice: a blemish
  chosen_korean: 흠
  alternatives_korean:
  - 결점
  - 결함
  - 오점
  lexicon: HALOT
  rationale: מוּם은 본래 ‘흠/결점’이지만 여기서는 반박하는 자가 상대에게서 받는 손상·오명을 암시할 수 있어, 간결한 ‘흠’으로 두어 원문의 압축성을 보존했습니다.
