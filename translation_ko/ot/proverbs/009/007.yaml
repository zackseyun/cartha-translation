  source_fidelity: 첫째 행의 לֹקֵחַ לוֹ는 훈계하는 사람이 수치/불명예를 스스로 입거나 자초한다는 뜻입니다. 둘째 행은 동사가 생략된 압축 표현이며 מוּמוֹ(직역하면 ‘그의 흠’)의 소유격 지시 대상과 비유적 의미에 해석 여지가 있습니다. 초안의 ‘~에게서 ... 돌아오는’은 두 행 모두에 상대방이 수치와 흠을 가한다는 인과를 명시하여, 원문의 압축성과 둘째 행의 모호성을 지나치게 해석합니다.
  naturalness: ‘자기에게 돌아오는 수치를 얻고’와 ‘자기에게 돌아오는 흠을 얻습니다’는 중복되고 한국어 관용상 부자연스럽습니다. ‘수치를 자초하고’와 ‘흠을 입습니다’가 간결하고 현대 표준어 합쇼체에 자연스럽습니다.
