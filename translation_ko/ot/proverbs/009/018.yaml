review_pass:
  verdict: revise
  source_fidelity: 본문은 רְפָאִים을 ‘죽은 자들’로, שְׁאוֹל을 ‘스올’로 보존하고, קְרֻאֶיהָ를 ‘그녀의 손님들’로 옮겨 히브리어의 핵심 의미와 영어 POB의 결정들을 충실히 반영합니다. 다만 ‘거기 있다’와 ‘스올의 깊은 곳들’은 한국어 조사와 관용상 약간 다듬는 편이 더 정확하고 자연스럽습니다.
  naturalness: 합쇼체는 일관됩니다. 쉼표를 접속 조사 앞에서 제거하고, ‘거기에 있고’ 및 ‘스올의 깊은 곳에’로 고치면 현대 표준 한국어 문장으로 더 매끄럽습니다. 각주 속 ‘그늘들이’는 한국어에서 부자연스럽고 의미가 불분명할 수 있어 ‘망령들’로 다듬었습니다.
  terminology: ‘스올’은 유지하여 ‘무덤’이나 ‘지옥’으로 의미를 좁히지 않았습니다. ‘죽은 자들’은 רְפָאִים의 문맥상 의미를 무리 없이 전달합니다. 각주의 ‘망령들’은 ‘그늘들/shades’라는 대안을 이해 가능한 한국어로 제시하되, 본문 번역으로 채택하지 않아 본문의 의미를 과도하게 특정하지 않습니다.
