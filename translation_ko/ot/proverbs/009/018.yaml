    issue: 각주의 ‘그늘들이’가 비관용적임
    rationale: ‘그늘’은 한국어에서 이 의미로 독립 복수 명사로 쓰일 때 뜻이 불명확합니다. ‘망령들’은 대안적 ‘shades’의 죽은 자/떠난 자라는 뜻을 더 분명하게 전달합니다.
