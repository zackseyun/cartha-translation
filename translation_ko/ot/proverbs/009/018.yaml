  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
  footnotes:
  - marker: a
    text: Or 'the shades are there.' The Hebrew רְפָאִים refers to the dead, the departed in Sheol.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 죽은 자들이 거기에 있고 그녀의 손님들이 스올의 깊은 곳에 있다는 것을 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망령들이 거기에 있다.’ 히브리어 רְפָאִים은 스올에 있는 죽은 자들, 곧 떠난 자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָדַע
  english_pob_choice: But he does not know
  chosen_korean: 그러나 그는 알지 못합니다
  alternatives_korean:
  - 그런데 그는 모릅니다
  - 그러나 그는 모르고 있습니다
  lexicon: HALOT
  rationale: 문맥상 앞절의 유혹과 대비되는 역접을 살려 ‘그러나’로 시작하고, 상태적 무지를 자연스럽게 ‘알지 못합니다’로 옮겼습니다.
- source_word: רְפָאִים
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 이들
  - 망자들
  - 그늘들
  lexicon: HALOT
  rationale: 지혜문학 맥락에서 רְפָאִים은 스올에 있는 죽은 자들을 가리키므로, 의미를 분명히 하되 ‘그늘들’처럼 독자를 좁게 해석시키는 표현은 피했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  lexicon: HALOT
  rationale: 신학적 함의를 평면화하지 않기 위해 전통적 종교어휘보다 히브리어 음역 ‘스올’을 유지했습니다.
- source_word: קְרֻאֶיהָ
  english_pob_choice: her guests
  chosen_korean: 그녀의 손님들
  alternatives_korean:
  - 그녀가 부른 자들
  - 초대받은 자들
  lexicon: HALOT
  rationale: 수동 분사형의 ‘초대받은 이들’이라는 뜻을 살리면서도 문맥상 자연스러운 한국어인 ‘손님들’로 옮겼습니다.
theological_decisions:
- issue: 스올의 번역 유지
  chosen_reading: ‘스올’로 음역하여 독자가 본문의 죽음/저승 이미지를 그대로 접하게 했습니다.
  alternative_readings:
  - ‘무덤’으로 의미를 완화하는 읽기
  - ‘지옥’으로 후대 교리적 함의를 강하게 부여하는 읽기
  rationale: 이 잠언은 사후세계에 대한 시적 경고를 담고 있으므로, 본문이 가진 긴장과 모호성을 보존하는 것이 중요합니다.
  doctrine_reference: Contested terms / wisdom literature의 이미지 보존
