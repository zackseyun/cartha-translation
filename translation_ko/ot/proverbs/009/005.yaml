base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
  footnotes:
  - marker: a
    text: 'Or ''Go, eat of my bread.'' The Hebrew verb literally means ''go,'' but in this invitation context it functions idiomatically as a summons: ''Come.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the wine I have prepared.' The Hebrew verb specifically refers to mixed wine, likely prepared with water or spices.
    reason: lexical_alternative
translation:
  language: ko
  text: 오십시오[a]. 내 빵을 먹고, 내가 섞은[b] 포도주를 마시십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가서 내 빵을 먹으십시오.’ 히브리어 동사는 문자적으로는 ‘가다’이지만, 초대의 문맥에서는 관용적으로 ‘오다’의 뜻으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 준비한 포도주.’ 히브리어 동사는 섞은 포도주를 가리키며, 아마 물이나 향신료와 섞어 마련한 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Come
  chosen_korean: 오십시오
  alternatives_korean:
  - 가십시오
  lexicon: HALOT
  rationale: 초대의 문맥에서 히브리어 문자값은 ‘가다’이지만, 한국어 초청문에서는 청자를 불러들이는 ‘오십시오’가 자연스럽고 POB의 ‘Come’과도 같은 기능을 합니다.
- source_word: לַחֲמוּ / בְלַחְמִי
  english_pob_choice: eat of my bread
  chosen_korean: 내 빵을 먹고
  alternatives_korean:
  - 내 빵을 드시고
  - 내 빵을 먹으십시오
  lexicon: HALOT
  rationale: 동사 לַחֲמוּ는 이 구절에서 ‘먹다’의 뜻이며, בְלַחְמִי는 ‘~의 빵’을 뜻하므로 ‘내 빵을 먹고’로 옮겨 초대의 직접성을 살렸습니다.
- source_word: וּשְׁתוּ / בְּיַיִן
  english_pob_choice: drink of the wine
  chosen_korean: 포도주를 마시십시오
  alternatives_korean:
  - 그 포도주를 마시십시오
  - 포도주를 마시고
  lexicon: HALOT
  rationale: 평행 구조를 살리되 한국어에서는 ‘마시다’가 이미 대상을 자연스럽게 취하므로 부사격을 과도하게 드러내지 않고 간결하게 옮겼습니다.
- source_word: מָסָכְתִּי
  english_pob_choice: I have mixed
  chosen_korean: 내가 섞은
  alternatives_korean:
  - 내가 준비한
  - 내가 타서 만든
  lexicon: HALOT
  rationale: 동사는 포도주를 섞어 만든다는 구체성을 가지므로, 더 넓은 ‘준비한’보다 ‘섞은’이 원문 의미를 더 정확하게 반영합니다.
theological_decisions:
- issue: 지혜의 초대가 지닌 구체적 잔치 이미지
  chosen_reading: 상징을 과도하게 풀지 않고, 실제 식사 초대의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 성찬적 의미로 확장하기
  - 교훈을 비유적으로 일반화하기
  rationale: 본문은 지혜가 마련한 잔치로 초대하는 장면이므로, 번역은 원문이 명시하지 않은 신학적 해석을 덧붙이지 않고 구체적 이미지를 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3
