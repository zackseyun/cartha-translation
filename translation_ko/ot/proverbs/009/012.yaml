id: PRO.9.12
reference: Proverbs 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
  footnotes:
  - marker: a
    text: Or 'will bear the consequences alone.' The Hebrew simply says 'will bear,' leaving the burden implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 지혜롭다면, 너 자신을 위한 지혜입니다. 네가 조롱한다면, 너 홀로 그 짐을 질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '짐을 지다/짊어지다'만 말하며, 무엇을 지는지는 밝히지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 네가 ... -다면
  alternatives_korean:
  - 만약 ...
  - '...할 때'
  lexicon: HALOT
  rationale: 히브리어 조건문을 한국어 조건 연결어미로 자연스럽게 살려, 잠언의 가언적 경고 구조를 그대로 유지했습니다.
- source_word: חָכַמְתָּ חָכַמְתָּ לָּךְ
  english_pob_choice: you are wise, you are wise for yourself
  chosen_korean: 네가 지혜롭다면, 너 자신을 위한 지혜입니다
  alternatives_korean:
  - 네가 지혜롭다면, 너를 위해 지혜로운 것입니다
  - 지혜로우면 네게 유익합니다
  lexicon: HALOT
  rationale: 반복된 '지혜롭다'를 살리되, לָךְ의 관용적 뜻을 '너 자신을 위한'으로 풀어 개인적 유익과 귀속을 함께 드러냈습니다.
- source_word: וְלַצְתָּ
  english_pob_choice: if you scoff
  chosen_korean: 조롱한다면
  alternatives_korean:
  - 비웃는다면
  - 모욕한다면
  lexicon: HALOT
  rationale: לוץ의 잠언적 용례는 단순한 '웃다'가 아니라 교만한 비웃음/조롱의 태도를 가리키므로, 그 뉘앙스를 보존했습니다.
- source_word: תִשָּׂא
  english_pob_choice: will bear it
  chosen_korean: 그 짐을 질 것입니다
  alternatives_korean:
  - 그것을 감당할 것입니다
  - 그 결과를 홀로 짊어질 것입니다
  lexicon: HALOT
  rationale: 히브리어는 부담의 대상이 생략된 '지다/짊어지다'를 말하므로, 한국어에서는 자연스러운 목적어를 보충하되 결과의 책임을 암시하도록 했습니다.
theological_decisions:
- issue: 잠언의 상응 구조에서 '지혜'와 '조롱'의 결과가 개인에게 귀속됨
  chosen_reading: 행위의 결과는 공동체가 대신 떠안지 않으며, 각 사람이 자기 행위의 짐을 집니다.
  alternative_readings:
  - 단순한 자기이익/자기해로만 읽기
  - 도덕적 비난을 약화시켜 일반 교훈으로만 읽기
  rationale: 본문은 지혜와 조롱을 모두 개인적 귀속으로 묶어, 지혜는 스스로에게 유익하고 조롱은 스스로 짐이 된다는 대조를 강조합니다.
  doctrine_reference: 잠언의 보응 원리
