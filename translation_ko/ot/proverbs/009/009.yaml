id: PRO.9.9
reference: Proverbs 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תֵּ֣ן לְ֭/חָכָם וְ/יֶחְכַּם ע֑וֹד הוֹדַ֥ע לְ֝/צַדִּ֗יק וְ/י֣וֹסֶף לֶֽקַח־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'Give instruction to a wise man.' The Hebrew leaves the object of 'give' unstated.
    reason: lexical_alternative
  - marker: b
    text: '''Righteous man'' uses the masculine singular form of the Hebrew as a representative singular, a common style in Proverbs.'
    reason: cultural_note
translation:
  language: ko
  text: 지혜로운 사람에게 주십시오[a]. 그러면 그는 더욱 지혜로워질 것입니다. 의로운 사람을 가르치십시오[b]. 그러면 그는 배움을 더 얻게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주십시오’의 목적어를 밝히지 않습니다. 문맥상 ‘가르침을’과 같이 이해할 수 있으나, 본문은 원문의 간결한 표현을 유지합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 남성 단수형은 잠언에서 흔한 대표 단수로, 특정 개인이 아니라 일반적인 ‘의로운 사람’을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן לְחָכָם
  english_pob_choice: Give to a wise man
  chosen_korean: 지혜로운 사람에게 주십시오
  alternatives_korean:
  - 지혜 있는 사람에게 주십시오
  - 지혜로운 자에게 주십시오
  - 가르치십시오
  lexicon: HALOT
  rationale: נתן의 명령형을 한국어에서는 자연스럽게 ‘~에게 주십시오’로 옮기되, 지혜의 대상이 명시되지 않은 히브리어의 간결함을 살려 ‘가르치십시오’를 본문에 넣지 않았습니다.
- source_word: וְיֶחְכַּם עוֹד
  english_pob_choice: and he will become wiser still
  chosen_korean: 그러면 그는 더욱 지혜로워질 것입니다
  alternatives_korean:
  - 그러면 그는 더 지혜로워질 것입니다
  - 그러면 그는 한층 더 지혜로워질 것입니다
  - 그리고 그는 더욱 지혜로워질 것입니다
  lexicon: HALOT
  rationale: חכם의 증가 의미를 한국어의 비교 표현 ‘더욱 지혜로워지다’로 살려, 결과를 나타내는 문맥에 맞게 ‘그러면’으로 연결했습니다.
- source_word: הוֹדַע לְצַדִּיק
  english_pob_choice: teach a righteous man
  chosen_korean: 의로운 사람을 가르치십시오
  alternatives_korean:
  - 의로운 사람에게 알리십시오
  - 의로운 사람을 깨우치십시오
  - 의인에게 가르치십시오
  lexicon: HALOT
  rationale: הודיע의 ‘알게 하다’ 의미가 지혜문맥에서는 교육 행위로 자연스럽게 드러나므로 ‘가르치십시오’가 가장 적절하며, צדיק은 POB의 ‘righteous man’을 따라 ‘의로운 사람’으로 옮겼습니다.
- source_word: וְיוֹסֶף לֶקַח
  english_pob_choice: and he will add learning
  chosen_korean: 그러면 그는 배움을 더할 것입니다
  alternatives_korean:
  - 그러면 그는 더 많은 배움을 얻게 될 것입니다
  - 그러면 그는 학식을 더할 것입니다
  - 그러면 그는 교훈을 더할 것입니다
  lexicon: HALOT
  rationale: יסף의 ‘더하다’와 לֶקַח의 ‘받은 교훈/배움’의 결합을 한국어에서 ‘배움을 더하다’로 간결하게 유지해, 증가의 이미지를 본문 수준에서 보존했습니다.
theological_decisions:
- issue: 지혜문학의 대표 단수 표현 처리
  chosen_reading: ‘지혜로운 사람’과 ‘의로운 사람’을 단수로 유지했습니다.
  alternative_readings:
  - 복수화하여 ‘지혜로운 이들’
  - 일반화하여 ‘지혜로운 자들’
  rationale: 히브리어 단수는 잠언에서 대표 단수로 쓰이므로, 일반화하지 않고 단수로 유지해 문장의 보편적 교훈과 원문의 형식을 함께 살렸습니다.
  doctrine_reference: 잠언의 대표 단수 관용법
- issue: 명령형의 어조
  chosen_reading: 문두의 두 절을 모두 공손한 명령형 ‘~하십시오’로 옮겼습니다.
  alternative_readings:
  - 더 평서적으로 완화
  - 체계적 권고형으로 변환
  rationale: 원문은 지혜 교훈의 직접 권면이므로, 한국어 합쇼체의 직접 명령을 사용해 교훈성을 유지했습니다.
  doctrine_reference: 문체/화행 보존
