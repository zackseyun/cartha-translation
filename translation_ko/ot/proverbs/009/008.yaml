  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
  footnotes:
  - marker: a
    text: Or 'mocker.' The Hebrew לֵץ refers to a person marked by arrogant, dismissive scorn.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a wise man'; the masculine singular is used representatively in Proverbs.
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 사람을 꾸짖지 마십시오. 그렇지 않으면 그가 당신을 미워할 것입니다. 지혜로운 사람을 꾸짖으십시오. 그러면 그가 당신을 사랑할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֵץ는 단순히 장난스럽게 놀리는 사람이 아니라, 교만하고 경멸적으로 조롱하는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수 형태를 사용하지만, 잠언에서는 대표적으로 일반 사람을 가리키는 용법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  english_pob_choice: Do not
  chosen_korean: ~하지 마십시오
  alternatives_korean:
  - ~하지 마세요
  - ~하지 말십시오
  lexicon: HALOT
  rationale: אַל의 금지형을 현대 합쇼체 금지 표현으로 자연스럽게 옮겼습니다.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  english_pob_choice: rebuke
  chosen_korean: 꾸짖다
  alternatives_korean:
  - 책망하다
  - 바로잡다
  lexicon: HALOT
  rationale: 지혜문학에서의 공개적이고 직접적인 훈계를 살리기 위해 '꾸짖다'를 택했습니다. '바로잡다'보다 더 강한 대립감을 드러냅니다.
- source_word: לֵץ
  english_pob_choice: scoffer
  chosen_korean: 조롱하는 사람
  alternatives_korean:
  - 조롱꾼
  - 비웃는 사람
  lexicon: HALOT
  rationale: לֵץ의 핵심은 단순한 농담이 아니라 교만한 조롱의 태도이므로, 의미를 드러내는 설명적 표현으로 옮겼습니다.
- source_word: לְחָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 자
  - 현명한 사람
  lexicon: HALOT
  rationale: 히브리어 남성 단수의 대표적 일반용법을 한국어에서 무리 없이 반영하면서도, 한국어 독자에게 자연스럽게 들리는 표현을 택했습니다.
theological_decisions:
- issue: 경고절의 결과 표현
  chosen_reading: 그가 당신을 미워할까 염려됩니다 / 그가 당신을 사랑할 것입니다
  alternative_readings:
  - 그러면 그가 당신을 미워할 것입니다
  - 그래서 그는 당신을 사랑할 것입니다
  rationale: פֶּן이 나타내는 피해야 할 결과를 한국어의 '염려됩니다'로 자연스럽게 살리면서, 뒤의 결과절은 평행을 유지해 명료하게 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
