id: PRO.9.10
reference: Proverbs 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
  footnotes:
  - marker: a
    text: 'Hebrew: ''holy ones.'' The plural form is often understood here as referring to God, hence ''the Holy One.'''
    reason: alternative_reading
translation:
  language: ko
  text: 지혜의 시작은 야훼를 경외하는 것이며, 거룩하신 분을 아는 것이 명철입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 복수형 '거룩한 이들'입니다. 문맥상 하나님을 가리키는 것으로 이해되므로 본문에서는 '거룩하신 분'으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  english_pob_choice: beginning of
  chosen_korean: 시작은
  alternatives_korean:
  - 처음은
  - 출발점은
  - 근본은
  lexicon: HALOT
  rationale: 히브리어 구성형은 지혜의 출발점 또는 시작을 가리키므로, 한국어에서는 자연스러운 명사구인 '시작은'으로 옮겨 원문의 구조를 살렸습니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼를 두려워하는 것
  - 야훼에 대한 경외
  - 여호와를 경외하는 것
  lexicon: HALOT
  rationale: '''fear of''는 단순한 감탄이나 공경보다 더 강한 경외와 두려움의 긴장을 함께 담으므로, 합쇼체 문맥에서 ''경외하는 것''으로 풀어 의미를 보존했습니다.'
- source_word: קְדֹשִׁים
  english_pob_choice: the Holy One
  chosen_korean: 거룩하신 분
  alternatives_korean:
  - 거룩한 이들
  - 거룩하신 분
  lexicon: HALOT
  rationale: 형태는 복수지만 문맥상 하나님을 가리키는 것으로 읽히는 긴장을 살리기 위해, 본문에서는 단수적 신적 지시를 드러내는 '거룩하신 분'으로 옮겼습니다.
- source_word: בִּינָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 분별
  - 깨달음
  lexicon: HALOT
  rationale: 잠언에서 בִּינָה는 단순한 이해보다 분별력 있는 명철을 가리키는 경우가 많아, 평행구조상 '지혜/지식'과 어울리는 한국어로 '명철'을 택했습니다.
theological_decisions:
- issue: קְדֹשִׁים의 복수형과 신적 단수 지시
  chosen_reading: 본문에는 '거룩하신 분'을 두어 하나님을 가리키는 문맥적 의미를 살리되, 히브리어 복수형의 긴장은 주석으로 보존합니다.
  alternative_readings:
  - 직역하여 '거룩한 이들'로 읽는 방식
  rationale: 평행법상 앞절의 '야훼를 경외하는 것'과 대응하므로, 여기서는 하나님을 가리키는 읽기가 가장 자연스럽습니다. 그러나 원형의 복수성은 삭제하지 않고 해설로 남겨 두었습니다.
  doctrine_reference: 번역 철학 §3 (의미를 보존하되 해석적 긴장을 지운 채 평탄화하지 않음)
