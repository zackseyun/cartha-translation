  - 캐냈습니다
  lexicon: HALOT
  rationale: 원뜻은 돌을 ‘깎아/다듬어’ 만드는 작업이지만, 한국어 성경문맥에서는 구조물을 정교하게 마련하는 느낌을 주는 ‘다듬었습니다’가 가장 지나치게 거칠지 않으면서도 공력을 드러냅니다.
- source_word: עַמּוּדֶיהָ
  english_pob_choice: her pillars
  chosen_korean: 자기 일곱 기둥
  alternatives_korean:
  - 자기 일곱 받침기둥
  - 자기 일곱 주춧기둥
  lexicon: HALOT
  rationale: 건축적 장면을 살리면서도 현대 독자가 이해하기 쉬운 표준어로는 ‘기둥’이 적절하며, ‘일곱’은 본문의 수치를 그대로 보존합니다.
theological_decisions:
- issue: 지혜의 의인화
  chosen_reading: ‘지혜’를 여성적 의인으로 읽되, 본문 자체에는 ‘여인/부인’ 같은 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘여인 지혜’
  - ‘지혜 여인’
  rationale: 히브리어는 지혜를 여성 단수로 의인화하지만, 본문에 없는 해석적 호칭을 넣으면 시의 간결함이 흐려집니다. 따라서 인칭화는 유지하되 표현은 절제했습니다.
  doctrine_reference: '번역 원리: optimal equivalence, source text의 직접적 의미를 보존'
