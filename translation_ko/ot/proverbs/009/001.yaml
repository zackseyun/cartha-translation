translation:
  language: ko
  text: 지혜가 자기 집을 지었습니다[a]. 또 자기 일곱 기둥을 다듬었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חָכְמוֹת은 형태상 복수형이지만, 여기서는 뒤의 단수 여성 동사들과 함께 의인화된 단수 ‘지혜’로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜들
  - 여인 지혜
  lexicon: HALOT
  rationale: 형태는 복수처럼 보이지만 뒤의 단수 여성 동사들이 가리키듯 의인화된 단수로 기능하므로, 본문에는 해석어를 덧붙이지 않고 ‘지혜’로 살렸습니다.
- source_word: בָּנְתָה
  english_pob_choice: has built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 세웠습니다
  - 건축했습니다
  lexicon: HALOT
  rationale: 완료 동사의 뜻을 살리되, ‘집’을 대상으로 한 자연스러운 현대 한국어로는 ‘지었습니다’가 가장 무난합니다.
- source_word: בֵיתָהּ
  english_pob_choice: her house
  chosen_korean: 자기 집
  alternatives_korean:
  - 자기 가정
  - 자기 집안
  lexicon: HALOT
  rationale: 뒤의 ‘기둥’ 이미지와 맞는 실제 건축물의 감각을 유지하려고 ‘집’으로 옮겼고, 소유 대명사는 자연스럽게 ‘자기’로 처리했습니다.
- source_word: חָצְבָה
  english_pob_choice: has hewn out
  chosen_korean: 다듬었습니다
  alternatives_korean:
  - 깎아 만들었습니다
  - 캐냈습니다
  lexicon: HALOT
  rationale: 원뜻은 돌을 ‘깎아/다듬어’ 만드는 작업이지만, 한국어 성경문맥에서는 구조물을 정교하게 마련하는 느낌을 주는 ‘다듬었습니다’가 가장 지나치게 거칠지 않으면서도 공력을 드러냅니다.
- source_word: עַמּוּדֶיהָ
  english_pob_choice: her pillars
  chosen_korean: 자기 일곱 기둥
  alternatives_korean:
  - 자기 일곱 받침기둥
  - 자기 일곱 주춧기둥
  lexicon: HALOT
  rationale: 건축적 장면을 살리면서도 현대 독자가 이해하기 쉬운 표준어로는 ‘기둥’이 적절하며, ‘일곱’은 본문의 수치를 그대로 보존합니다.
theological_decisions:
- issue: 지혜의 의인화
  chosen_reading: ‘지혜’를 여성적 의인으로 읽되, 본문 자체에는 ‘여인/부인’ 같은 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘여인 지혜’
  - ‘지혜 여인’
  rationale: 히브리어는 지혜를 여성 단수로 의인화하지만, 본문에 없는 해석적 호칭을 넣으면 시의 간결함이 흐려집니다. 따라서 인칭화는 유지하되 표현은 절제했습니다.
  doctrine_reference: '번역 원리: optimal equivalence, source text의 직접적 의미를 보존'
