lexical_decisions:
- source_word: חָכְמוֹת
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜들
  - 여인 지혜
  lexicon: HALOT
  rationale: 형태는 복수처럼 보이지만 뒤의 단수 여성 동사들이 가리키듯 의인화된 단수로 기능하므로, 본문에는 해석어를 덧붙이지 않고 ‘지혜’로 살렸습니다.
- source_word: בָּנְתָה
