  lexicon: HALOT
  rationale: 완료 동사의 뜻을 살리되, ‘집’을 대상으로 한 자연스러운 현대 한국어로는 ‘지었습니다’가 가장 무난합니다.
- source_word: בֵיתָהּ
  english_pob_choice: her house
  chosen_korean: 자기 집
  alternatives_korean:
  - 자기 가정
  - 자기 집안
  lexicon: HALOT
  rationale: 뒤의 ‘기둥’ 이미지와 맞는 실제 건축물의 감각을 유지하려고 ‘집’으로 옮겼고, 소유 대명사는 자연스럽게 ‘자기’로 처리했습니다.
- source_word: חָצְבָה
  english_pob_choice: has hewn out
  chosen_korean: 다듬었습니다
  alternatives_korean:
