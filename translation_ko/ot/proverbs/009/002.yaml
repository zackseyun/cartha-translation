source:
  edition: WLC
  text: טָבְחָ֣ה טִ֭בְחָ/הּ מָסְכָ֣ה יֵינָ֑/הּ אַ֝֗ף עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
  footnotes:
  - marker: a
    text: Or 'her slaughtered animals'; the Hebrew noun refers to butchered meat prepared for the banquet.
    reason: lexical_alternative
  - marker: b
    text: That is, she has prepared the wine by mixing it, likely as part of banquet custom.
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 짐승[a]을 잡고, 포도주[b]를 섞고, 상도 차렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 고기’입니다. 히브리어 명사는 잔치를 위해 잡은 짐승, 곧 그 고기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 잔치를 위해 포도주를 물이나 향료 등과 섞어 마련했다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָ֣ה טִ֭בְחָ/הּ
  english_pob_choice: has slaughtered her meat
  chosen_korean: 잔칫감[a]을 잡아놓고
  alternatives_korean:
  - 고기[a]를 잡아놓고
  - 도축한 짐승[a]을 준비해놓고
  lexicon: HALOT
  rationale: טבח의 핵심은 ‘도살하다/잡다’의 구체적 행위이므로 ‘준비하다’보다 행위를 드러내는 ‘잡아놓고’로 옮겼습니다. טִבְחָהּ는 단순한 ‘고기’보다 잔치용으로 마련된 음식이라는 뉘앙스를 살리기 위해 ‘잔칫감’으로 풀었습니다.
- source_word: מָסְכָ֣ה יֵינָ֑/הּ
  english_pob_choice: has mixed her wine
  chosen_korean: 자기 포도주[b]를 섞었으며
  alternatives_korean:
  - 자기 포도주[b]를 타서 만들었으며
  - 자기 포도주[b]를 준비했으며
  lexicon: HALOT
  rationale: מָסַךְ은 포도주를 섞다/타다의 뜻이므로, 연회 관습을 반영하되 직설적인 ‘섞다’를 유지했습니다. ‘타다’도 가능하지만 원문의 혼합 행위를 더 직접적으로 보이게 합니다.
- source_word: עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ
  english_pob_choice: has also set her table
  chosen_korean: 자기 상도 차렸습니다
  alternatives_korean:
  - 자기 상도 벌였습니다
  - 자기 상도 마련했습니다
  lexicon: HALOT
  rationale: עָרַךְ은 ‘차리다/벌이다/정돈하다’의 뜻이므로, 식탁을 단정하게 ‘차리다’로 옮겼습니다. ‘상’을 써서 연회 장면의 구체성을 살렸습니다.
- source_word: טִבְחָהּ / יֵינָהּ / שֻׁלְחָנָהּ
  english_pob_choice: her meat / her wine / her table
  chosen_korean: 자기 잔칫감 / 자기 포도주 / 자기 상
  alternatives_korean:
  - 그녀의 고기 / 그녀의 포도주 / 그녀의 식탁
  - 자기의 음식 / 자기의 포도주 / 자기의 식탁
  lexicon: HALOT
  rationale: 히브리어의 소유 접미사는 반복적으로 붙어 있어 한국어도 ‘자기’로 일관되게 살렸습니다. ‘상’은 현대 한국어에서 ‘table’의 자연스러운 대응이면서도 잔칫상을 충분히 떠올리게 합니다.
theological_decisions:
- issue: 잠언의 의인화된 여성 주체를 어떻게 옮길지
  chosen_reading: 문맥이 이미 지혜의 의인화임을 보여 주므로, 본문에는 별도 설명을 덧붙이지 않고 여성 단수 주체를 자연스럽게 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - 지혜는 자기 잔칫감을 잡아놓고…
  - 그녀는 잔칫감을 잡아놓고…
  rationale: 히브리어 동사들이 여성 단수이므로 인칭을 유지하는 것이 원문에 가장 가깝습니다. 본문 밖 설명 없이도 문맥상 참조 대상이 분명하므로, 과도한 해설을 피했습니다.
  doctrine_reference: 'Translation philosophy: 본문의 문학적 인격화를 그대로 보존하고, 문맥이 제공하는 의미 이상을 주입하지 않습니다.'
