  naturalness: ‘지각이 없는 사람에게는 그가 말합니다’는 조사와 주어의 연결이 부자연스럽고 의미상도 불명확합니다. ‘분별이 없는 사람에게 지혜가 말합니다’는 현대 표준 한국어 합쇼체 서술에 자연스럽고, 다음 절에 이어지는 지혜의 발화를 잘 도입합니다.
  terminology: חֲסַר־לֵב는 한국어의 정서적 의미를 띠는 직역 ‘마음이 없는 사람’ 대신 ‘분별이 없는 사람’으로 옮기는 것이 적절합니다. 각주도 이 표현에 직접 연결해야 합니다. 의인화된 지혜의 여성형은 불필요한 교리적 해석 없이 문법과 문맥을 반영하여 ‘지혜가’로 밝혔습니다.
