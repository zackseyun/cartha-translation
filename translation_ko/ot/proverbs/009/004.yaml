lexical_decisions:
- source_word: מִי פֶתִי
  english_pob_choice: Whoever is simple
  chosen_korean: 누구든지 미숙한 사람
  alternatives_korean:
  - 누구든지 단순한 사람
  - 누구든지 어리석은 사람
  - 누구든지 철없는 사람
  lexicon: HALOT
  rationale: פתי는 잠언에서 경험과 분별이 부족한 사람을 가리키므로, 한국어에서는 ‘미숙한 사람’이 무지함보다 분별의 미흡함을 더 잘 드러냅니다.
- source_word: יָסֻר הֵנָּה
  english_pob_choice: let him turn in here
  chosen_korean: 이리로 돌이키십시오
  alternatives_korean:
  - 이리로 들어오십시오
  - 이리로 돌아오십시오
  - 이리로 들어서십시오
  lexicon: HALOT
  rationale: 초대의 뉘앙스를 살리면서도 지혜의 집 안으로 들어오는 장면에 맞게, 단순한 이동보다 ‘돌이키십시오’가 방향 전환의 호소를 잘 나타냅니다.
- source_word: חֲסַר לֵב
  english_pob_choice: lacks sense
  chosen_korean: 지각이 없는 사람
  alternatives_korean:
  - 마음이 없는 사람
  - 분별이 없는 사람
  - 이해가 없는 사람
  lexicon: HALOT
  rationale: 직역인 ‘마음이 없다’는 한국어에서 오해를 부를 수 있어, 히브리어 관용구의 의미인 판단력·분별의 결핍을 ‘지각이 없는 사람’으로 옮겼습니다.
- source_word: אָמְרָה לּוֹ
  english_pob_choice: she says, / to him
  chosen_korean: 그가 말합니다
  alternatives_korean:
  - 그녀가 말합니다
  - 그에게 말합니다
  - 지혜가 말합니다
  lexicon: HALOT
  rationale: 문맥상 지혜가 말하는 장면이지만, 본문은 ‘그녀’라는 3인칭 여성형 동사와 목적어를 갖습니다. 한국어에서는 화자의 인칭 표지보다 직접 화법의 현재성을 살려 자연스럽게 처리했습니다.
theological_decisions:
- issue: 지혜의 초대에서 화자 성별과 인칭의 처리
  chosen_reading: 본문의 문법적 여성형을 노골적으로 옮기기보다, 초대의 기능을 살려 ‘그가 말합니다’로 자연스럽게 표현했습니다.
  alternative_readings:
  - 그녀가 말합니다
  - 지혜가 말합니다
  rationale: 잠언의 지혜 의인화는 본문의 수사 장치이므로, 한국어 독자에게 불필요한 성별 강조를 피하면서도 초대의 성격을 유지하는 것이 적절합니다.
  doctrine_reference: 잠언의 의인화된 지혜 표현
