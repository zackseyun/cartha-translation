id: PRO.1.11
reference: Proverbs 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יֹאמְרוּ֮ לְכָ֪/ה אִ֫תָּ֥/נוּ נֶאֶרְבָ֥ה לְ/דָ֑ם נִצְפְּנָ֖ה לְ/נָקִ֣י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
  footnotes:
  - marker: a
    text: Or “let us hide ourselves for the innocent without cause.” The Hebrew verb can more literally mean “hide ourselves,” but in this context it carries the sense of lying concealed in order to ambush.
    reason: lexical_alternative
  - marker: b
    text: “For blood” is a terse Hebrew expression for violent bloodshed or murder.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그들이 “우리와 함께 가자. 피를 위해 매복하자. 이유 없이 무죄한 자를 덮치자” 하고 말하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 “우리 자신을 숨기자”에 가깝지만, 여기서는 숨어서 기습하려는 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: “피를 위해”는 히브리어의 압축된 표현으로, 폭력적 유혈이나 살해를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일에
  lexicon: HALOT
  rationale: 조건절의 경고 구조를 분명히 살리기 위해 현대 한국어에서 자연스러운 ‘만일’을 택했습니다.
- source_word: נֶאֶרְבָה
  english_pob_choice: let us lie in wait
  chosen_korean: 매복하자
  alternatives_korean:
  - 숨어 기다리자
  - 엎드려 기다리자
  - 매복해서 기다리자
  lexicon: HALOT
  rationale: אָרַב의 전형적 의미가 계획된 공격을 위한 매복이므로, 동작의 성격을 가장 직접적으로 드러내는 ‘매복하자’로 옮겼습니다.
- source_word: לְדָם
  english_pob_choice: for blood
  chosen_korean: 피를 위해
  alternatives_korean:
  - 피를 위하여
  - 피흘리기를 위해
  - 유혈을 위해
  lexicon: HALOT
  rationale: 히브리어의 간결한 표현을 살리기 위해 직역에 가깝게 두되, 한국어에서는 어색함이 덜한 ‘피를 위해’로 유지했습니다. 문맥상 살인을 뜻하는 완곡이 아니라 실제 유혈의 의도를 드러냅니다.
- source_word: לְנָקִי
  english_pob_choice: the innocent
  chosen_korean: 무죄한 자
  alternatives_korean:
  - 무고한 자
  - 죄 없는 사람
  - 의로운 사람
  lexicon: HALOT
  rationale: 형용사의 실체적 용법을 살려 피해 대상을 인격체로 드러내는 ‘무죄한 자’를 선택했습니다.
theological_decisions:
- issue: ‘without cause’의 윤리적 폭력성 보존
  chosen_reading: 이유 없이
  alternative_readings:
  - 까닭 없이
  - 무고하게
  - 정당한 이유 없이
  rationale: 공격이 어떤 정당화도 없는 폭력임을 분명히 하기 위해 현대 한국어에서 가장 직접적인 ‘이유 없이’를 사용했습니다.
  doctrine_reference: 잠언의 지혜 교육은 죄의 유혹을 폭로하는 것이므로, 도덕적 비난의 강도를 약화시키지 않도록 직설성을 유지합니다.
