theological_decisions:
- issue: 공동체적 약탈 초대의 직접성 유지
  chosen_reading: 부드럽게 완화하지 않고 ‘던져 넣으십시오’와 ‘한 지갑’으로 무리의 공유 재산을 만드는 초대를 그대로 드러냈습니다.
  alternative_readings:
  - 합류하십시오
  - 한 주머니를 쓰게 될 것입니다
  - 우리와 함께 나누십시오
  rationale: 이 절은 단순한 우정 제안이 아니라 폭력적 집단의 공모 초대이므로, 본문의 윤리적 긴장과 어두운 권유를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 잠언 1장의 지혜/미련함 대비와 악한 무리의 유혹에 대한 경계
