  language: ko
  text: 네 몫을 우리 가운데 던져 넣으십시오. 우리 모두에게는 한 지갑이 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 כִּיס는 돈을 넣는 주머니, 곧 ‘돈주머니’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 몫을’은 직역상 ‘네 제비/몫을’에 해당하며, 무리와 운명을 함께하라는 관용적 초대를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹרָלְךָ
  english_pob_choice: your lot
  chosen_korean: 네 몫
  alternatives_korean:
  - 네 운명
  - 네 분깃
  - 네 제비
  lexicon: HALOT
  rationale: 여기서는 제비뽑기 자체보다 무리와 운명을 함께하라는 초대가 핵심이므로, ‘몫’이 소속과 참여의 의미를 비교적 자연스럽게 살립니다.
- source_word: תַּפִּיל
  english_pob_choice: Throw in
  chosen_korean: 던져 넣으십시오
  alternatives_korean:
  - 던지십시오
  - 넣으십시오
  - 던져 버리십시오
  lexicon: HALOT
  rationale: 히필형의 ‘떨어뜨리다/떨어지게 하다’에 해당하는 동작성과, 영어 POB의 관용적 ‘Throw in’이 주는 합류의 뉘앙스를 함께 살렸습니다.
- source_word: בְּתוֹכֵנוּ
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
  - 우리 중에
  - 우리 사이에
  - 우리 무리 안에
  lexicon: HALOT
  rationale: 직역에 가까운 ‘우리 가운데’가 원문의 ‘우리의 한가운데’라는 소속·편입의 감각을 잘 드러냅니다.
- source_word: כִּיס
  english_pob_choice: purse
  chosen_korean: 지갑
  alternatives_korean:
  - 돈주머니
  - 돈지갑
  - 주머니
  lexicon: HALOT
  rationale: 원어는 돈을 넣는 주머니/주낭을 가리키며, 현대 한국어에서는 ‘지갑’이 가장 간결하게 공용 자금 주머니의 이미지를 전달합니다.
theological_decisions:
- issue: 공동체적 약탈 초대의 직접성 유지
  chosen_reading: 부드럽게 완화하지 않고 ‘던져 넣으십시오’와 ‘한 지갑’으로 무리의 공유 재산을 만드는 초대를 그대로 드러냈습니다.
  alternative_readings:
  - 합류하십시오
  - 한 주머니를 쓰게 될 것입니다
  - 우리와 함께 나누십시오
  rationale: 이 절은 단순한 우정 제안이 아니라 폭력적 집단의 공모 초대이므로, 본문의 윤리적 긴장과 어두운 권유를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 잠언 1장의 지혜/미련함 대비와 악한 무리의 유혹에 대한 경계
