  source_fidelity: ‘네 몫’은 גּוֹרָלְךָ의 결과적 의미(분깃)는 일부 전달하지만, תַּפִּיל(‘던지다/캐스팅하다’)과 결합된 ‘제비를 던지다’의 비유를 약화합니다. 또한 כִּיס는 개인용 현대 지갑보다 공동 자금을 담는 ‘돈주머니’가 더 정확합니다. 둘째 문장은 단일하고 공동인 돈주머니라는 뜻이 분명히 드러나야 합니다.
  naturalness: ‘우리 가운데 던져 넣으십시오’와 ‘우리 모두에게는 한 지갑이 있을 것입니다’는 다소 직역투이며, 특히 ‘지갑’은 현대의 개인용 지갑을 쉽게 연상시킵니다. ‘네 제비를 우리 가운데 던지십시오’ 및 ‘우리 모두의 돈주머니는 하나일 것입니다’가 현대 표준어 합쇼체에서 더 자연스럽고 뜻도 분명합니다.
