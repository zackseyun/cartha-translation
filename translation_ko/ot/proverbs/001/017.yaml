revisions:
- from: 이는 그물을 아무 소용없이 펼쳐 놓는 것이니, 새라면 누구나 보는 앞에서 그러합니다.[a]
  to: 이는 모든 새가 보는 앞에 그물을 펼쳐 놓는 것은 헛된 일이기 때문입니다.[a]
  rationale: 'The revision makes the Hebrew assertion explicit and idiomatic in modern formal-polite Korean: spreading a net where birds can see it is futile. It retains the explanatory connection (“이는 … 때문입니다”), the generic force of כָל, and the contextual Korean term “새,” while the footnote preserves the Hebrew idiom.'
  reviewer_model: gpt-5.6-terra
