  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 곧
  lexicon: HALOT
  rationale: 앞선 경고를 뒷받침하는 설명의 접속으로 이해하여, 한국어에서는 원인 설명을 자연스럽게 여는 ‘이는’으로 옮겼습니다.
