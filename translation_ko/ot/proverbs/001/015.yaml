id: PRO.1.15
reference: Proverbs 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנִ֗/י אַל תֵּלֵ֣ךְ בְּ/דֶ֣רֶךְ אִתָּ֑/ם מְנַ֥ע רַ֝גְלְ/ךָ֗ מִ/נְּתִיבָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/015.yaml
  text: My son[a], do not walk in the way with them; keep your foot from their path.
  footnotes:
  - marker: a
    text: Or 'do not go on the road with them.' The Hebrew uses 'way' language common in wisdom literature for a course of life, not only a literal road.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 그들과 함께 길을 걷지 마십시오. 그들의 길에서 발을 멀리하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 문자적인 도로뿐 아니라 삶의 과정과 행로를 가리키는 지혜문학적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 아들아
  lexicon: HALOT
  rationale: 지혜문학의 아버지-아들 훈계 호칭을 살리면서, 한국어에서는 1인칭 소유를 앞세운 직접 호칭 ‘내 아들아’가 가장 자연스럽고 밀도 있게 대응합니다.
- source_word: תֵּלֵךְ / בְּדֶרֶךְ
  english_pob_choice: walk in the way
  chosen_korean: 그 길로 걷지 말고
  alternatives_korean:
  - 그 길로 가지 말고
  - 그 길에서 행하지 말고
  lexicon: HALOT
  rationale: הלך와 דרך의 결합은 단순한 이동이 아니라 삶의 행로를 가리키므로, ‘걷다’와 ‘길’을 함께 살려 도덕적 삶의 방향이라는 비유를 보존했습니다.
- source_word: מְנַע רַגְלְךָ
  english_pob_choice: keep your foot
  chosen_korean: 네 발을 멀리하라
  alternatives_korean:
  - 네 발을 막으라
  - 네 발을 멈추라
  lexicon: HALOT
  rationale: 직역하면 ‘네 발을 제지하라’이지만, 한국어에서는 행동의 거리 두기를 드러내는 ‘멀리하라’가 시어의 힘과 경계의 뜻을 더 자연스럽게 전달합니다.
- source_word: מִנְּתִיבָתָם
  english_pob_choice: from their path
  chosen_korean: 그들의 길에서
  alternatives_korean:
  - 그들의 길로부터
  - 그들의 길에서부터
  lexicon: HALOT
  rationale: נתיבה의 평행어로 앞의 דרך와 같은 ‘길’을 유지하되, מן의 분리 의미를 한국어 조사 ‘에서’로 풀어 발을 떼어 두라는 금지의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 지혜문학의 ‘길’ 은유를 한국어에서 어떻게 보존할지
  chosen_reading: 물리적 도로만이 아니라 삶의 방식과 행로를 가리키는 은유로 유지했습니다.
  alternative_readings:
  - 문자 그대로의 길로 좁혀 읽기
  - ‘행실’로 뜻을 풀어버리기
  rationale: 본문의 דרך/נתיבה는 반복된 ‘길’ 언어로 도덕적 선택을 가르치므로, 은유를 풀어 뜻만 남기기보다 이미지 자체를 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 지혜문학의 교훈적 은유
