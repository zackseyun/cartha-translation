  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
  footnotes:
  - marker: a
    text: Or 'reverence for the LORD' or 'awe of the LORD.' The Hebrew phrase includes reverence, awe, and submissive fear before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'instruction' or 'correction.' The Hebrew term includes training that can involve correction.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하는 것이 지식의 시작이요, 어리석은 자들은 지혜와 훈계를 멸시합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여호와를 경외함' 또는 '여호와를 두려워함'입니다. 히브리어 표현에는 하나님 앞의 경외, 두려움, 복종이 함께 담겨 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '훈련' 또는 '교정'입니다. 이 히브리어는 교정을 포함할 수 있는 훈련의 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: fear of Yahweh
  chosen_korean: 여호와를 경외하는 것
  alternatives_korean:
  - 여호와를 두려워하는 것
  - 야훼를 경외하는 것
  lexicon: HALOT
  rationale: 지혜문학의 관용구인 'fear of Yahweh'는 단순 공포보다 경외와 복종의 함의를 함께 가지므로, 한국어에서는 자연스럽고 의미를 보존하는 '경외하다'를 택했습니다. 본문은 영문 POB의 이름형이 아니라 전통적 한글 성경에서 널리 통용되는 '여호와'를 사용했습니다.
- source_word: רֵאשִׁית
  english_pob_choice: beginning
  chosen_korean: 시작
  alternatives_korean:
  - 처음
  - 첫 원리
  - 근본
  lexicon: HALOT
  rationale: 히브리어 רֵאשִׁית는 시작점이면서 기초라는 뉘앙스를 함께 가질 수 있어, 한국어에서는 그 폭을 지나치게 좁히지 않는 '시작'으로 옮겼습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교훈
  - 훈련
  lexicon: HALOT
  rationale: מוּסָר는 단순한 정보 전달이 아니라 교정과 훈련을 포함하는 말이어서, 잠언 문맥에서 자연스럽고 교정적 뉘앙스를 살리는 '훈계'를 택했습니다.
- source_word: בָּזוּ
  english_pob_choice: despise
  chosen_korean: 멸시합니다
  alternatives_korean:
  - 경멸합니다
  - 업신여깁니다
  lexicon: HALOT
  rationale: בָּזוּ는 강한 거부와 경멸을 나타내므로, 한국어에서도 같은 강도를 유지하는 '멸시하다'를 사용했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 본문에는 '여호와'를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문 יְהוָה는 하나님의 고유명을 가리키지만, 한국어 공용 가독성과 기존 성경 수용성을 고려해 본문에서는 '여호와'로 옮겼습니다. 이는 의미를 약화시키기보다 독자에게 곧바로 인지 가능한 하나님의 이름을 제시합니다.
  doctrine_reference: YHWH 표기 원칙; 본문 가독성
