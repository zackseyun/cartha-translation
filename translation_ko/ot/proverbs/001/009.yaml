lexical_decisions:
- source_word: לִוְיַת חֵן
  english_pob_choice: a graceful wreath
  chosen_korean: 아름다운 관
  alternatives_korean:
  - 은혜의 관
  - 우아한 화관
  - 아름다운 화관
  lexicon: HALOT
  rationale: ‘לִוְיַת’는 둘러 씌운 장식물을 가리키므로 ‘관’으로, ‘חֵן’은 추상적 은혜보다 문맥상 매력·아름다움의 성격을 살려 ‘아름다운’으로 옮겼습니다.
- source_word: הֵם
  english_pob_choice: they are
  chosen_korean: 그것들은 ... 됩니다
  alternatives_korean:
  - 그것들은 ... 입니다
  - 그것이 ... 됩니다
  lexicon: HALOT
  rationale: 앞 절의 아버지의 훈계와 어머니의 가르침을 가리키는 지시대명사이므로 복수로 살리고, 한국어에서는 자연스러운 서술을 위해 ‘됩니다’를 택했습니다.
- source_word: לְרֹאשֶׁךָ
  english_pob_choice: for your head
  chosen_korean: 당신의 머리에
  alternatives_korean:
  - 당신의 머리 위에
  - 당신의 머리를 위한
  lexicon: HALOT
  rationale: 장식의 부착 위치를 자연스럽게 전달하기 위해 ‘머리에’로 옮겼습니다.
- source_word: וַעֲנָקִים
  english_pob_choice: necklaces
  chosen_korean: 목걸이
  alternatives_korean:
  - 목의 장식
  - 사슬
  - 목걸이들
  lexicon: HALOT
  rationale: 병렬 구조에서 장식품 의미가 분명하므로 ‘목걸이’로 옮겼고, 히브리어 복수는 한국어에서 통상 단수 명사로도 집합적 의미를 전달할 수 있어 그렇게 처리했습니다.
- source_word: לְגַרְגְּרֹתֶיךָ
  english_pob_choice: for your neck
  chosen_korean: 당신의 목에
  alternatives_korean:
  - 당신의 목을 위해
  - 당신의 목 둘레에
  lexicon: HALOT
  rationale: ‘목/목구멍’ 계열의 어휘지만 보석 비유에서는 한국어로 ‘목’이 가장 자연스럽고 직접적입니다.
theological_decisions:
- issue: 지혜 훈계의 비유적 보상 이미지
  chosen_reading: 훈계와 가르침을 몸에 두르는 장신구 이미지로 그대로 살렸습니다.
  alternative_readings:
  - 도덕적 덕목으로 일반화
  - 상징을 약화해 단순한 장식으로 번안
  rationale: 본문은 지혜의 가르침이 외적인 아름다움과 존귀함을 부여하는 비유를 사용하므로, 이를 약화하지 않고 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 잠언 1:8-9의 지혜 교훈 비유
