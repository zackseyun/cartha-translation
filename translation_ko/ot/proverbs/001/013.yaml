id: PRO.1.13
reference: Proverbs 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
  footnotes:
  - marker: a
    text: Or 'valuable wealth' or 'costly riches.'
    reason: lexical_alternative
  - marker: b
    text: Or 'spoil'; Hebrew שָׁלָל refers to goods taken as plunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 온갖 귀한 재물을 찾아내고[a] 우리 집들을 약탈물로 가득 채우겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가치 있는 재물’, ‘값비싼 부’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전리품’, ‘노획물’. 히브리어 שָׁלָל은 약탈하여 얻은 물건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הוֹן יָקָר
  english_pob_choice: all precious wealth
  chosen_korean: 온갖 귀한 재물
  alternatives_korean:
  - 모든 귀중한 부
  - 온갖 값진 재물
  lexicon: HALOT
  rationale: כָּל의 포괄성과 הוֹן יָקָר의 경제적·가치적 뉘앙스를 함께 살려, 현대 한국어에서 자연스럽게 들리는 ‘온갖 귀한 재물’로 옮겼습니다.
- source_word: נִמְצָא
  english_pob_choice: we will find
  chosen_korean: 찾아내고
  alternatives_korean:
  - 얻고
  - 발견하고
  lexicon: HALOT
  rationale: 문맥이 약탈을 전제한 탐색·획득의 자랑이므로 단순한 ‘찾다’보다 결과 도출을 드러내는 ‘찾아내다’가 더 적절합니다.
- source_word: בָתֵּינוּ
  english_pob_choice: our houses
  chosen_korean: 우리 집들
  alternatives_korean:
  - 우리 집
  - 우리 가옥들
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 ‘우리 집들’로 옮기되, 현대 한국어에서 과도하게 어색해지지 않도록 유지했습니다.
- source_word: שָׁלָל
  english_pob_choice: plunder
  chosen_korean: 약탈물
  alternatives_korean:
  - 노획물
  - 전리품
  - 전리
  lexicon: HALOT
  rationale: ‘plunder’의 의미를 분명하게 드러내는 현대 한국어로, 도덕적으로 부당한 취득물을 가리키는 ‘약탈물’을 선택했습니다.
theological_decisions:
- issue: 도적질을 자랑하는 화자의 자기의사 표현
  chosen_reading: 말하는 주체의 오만한 결의가 그대로 드러나도록 미래형 진술을 유지했습니다.
  alternative_readings:
  - 명령형처럼 다듬어 ‘가득 채우자’로 옮길 수 있음
  - 완곡하게 일반화하여 도덕적 긴장을 약화시킬 수 있음
  rationale: 잠언 1:13은 유혹하는 악인들의 자기확신을 드러내는 장면이므로, 그 거친 확신을 순화하지 않고 그대로 보여 주는 것이 문맥에 충실합니다.
  doctrine_reference: 지혜문학의 악한 유혹 묘사
