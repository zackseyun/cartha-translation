  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
  footnotes:
  - marker: a
    text: Or 'discipline' for 'instruction' (מוּסָר), emphasizing corrective training as well as teaching.
    reason: lexical_alternative
  - marker: b
    text: Or 'law' for 'teaching' (תּוֹרָה); here the sense is a mother's authoritative instruction rather than a formal legal code.
    reason: lexical_alternative
