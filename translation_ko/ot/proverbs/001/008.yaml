  text: 내 아들아, 네 아버지의 훈계를 들으십시오[a]. 네 어머니의 가르침을 버리지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 무사르(מוּסָר)는 ‘교훈’으로도, 교정적 훈련을 강조하여 ‘징계’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가르침’ 대신 ‘율법’으로 옮길 수 있습니다(תּוֹרָה). 여기서는 공식적인 법전보다는 어머니의 권위 있는 교훈을 가리킵니다.
    reason: lexical_alternative
