  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
  footnotes:
  - marker: a
    text: Or 'And the one who hears me will dwell in safety and be undisturbed by the dread of calamity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나에게 듣는 이는 안전하게 거하며 평안하며, 재앙의 두려움이 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에게 듣는 이는 안전하게 살며 재앙의 두려움에 흔들리지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  english_pob_choice: But whoever listens to me
  chosen_korean: 그러나 나에게 듣는 이는
  alternatives_korean:
  - 그리고 나에게 듣는 이는
  - 그러나 나를 듣는 이는
  - 그러나 내 말을 듣는 이는
  lexicon: HALOT
  rationale: שׁמע는 단순한 청취가 아니라 응답하는 ‘듣기’이므로, 지혜의 직접 발화에 맞게 ‘나에게 듣는 이’로 옮겼습니다. ראשית의 וְ는 앞 문맥의 경고와 대조를 살려 ‘그러나’로 처리했습니다.
- source_word: יִשְׁכָּן בֶּטַח
  english_pob_choice: will dwell securely
  chosen_korean: 안전하게 거하며
  alternatives_korean:
  - 안전하게 살며
  - 평안히 거하며
  - 안전 가운데 거하며
  lexicon: HALOT
  rationale: שׁכן의 거처/정착 뉘앙스를 살려 ‘거하며’로 옮기고, בֶּטַח은 안전·보호의 상태를 한국어 부사구 ‘안전하게’로 자연스럽게 표현했습니다.
- source_word: וְשַׁאֲנַן
  english_pob_choice: and be at ease
  chosen_korean: 평안하며
  alternatives_korean:
  - 편안하며
  - 고요하며
  - 근심 없이
  lexicon: HALOT
  rationale: שׁאנ은 단순한 정지보다 ‘고요하고 두려움 없는 안식 상태’를 가리키므로, 긍정적 약속의 어조를 살려 ‘평안하며’로 옮겼습니다.
- source_word: מִפַּחַד רָעָה
  english_pob_choice: without fear of disaster
  chosen_korean: 재앙의 두려움이 없을 것입니다
  alternatives_korean:
  - 재앙을 두려워하지 않을 것입니다
  - 화가 닥칠 두려움이 없을 것입니다
  - 재난의 두려움이 없을 것입니다
  lexicon: HALOT
  rationale: מִן + פחד는 ‘~로부터의 자유’ 또는 ‘~의 두려움에서 벗어남’을 나타낼 수 있으므로, 결과절을 한국어로 분명하게 풀어 ‘두려움이 없을 것입니다’로 옮겼습니다. רָעָה는 이 지혜문맥에서 도덕적 악보다 실제적 재앙을 뜻하므로 ‘재앙’이 적절합니다.
theological_decisions:
- issue: 지혜의 1인칭 화자 유지
  chosen_reading: 본문의 1인칭 ‘나’를 그대로 유지했습니다.
  alternative_readings:
  - ‘지혜에게 듣는 이는’
  - ‘지혜인 나에게 듣는 이는’
  rationale: 주변 문맥에서 지혜가 직접 말하므로, 본문에 설명적 삽입을 더하지 않고 1인칭 발화를 유지하는 것이 히브리어의 수사와 인격화된 지혜의 구조를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy 1, 6
- issue: מין פחד의 자유를 한국어로 명시
  chosen_reading: ‘두려움이 없을 것입니다’로 결과를 분명히 밝혔습니다.
  alternative_readings:
  - ‘두려움에서 벗어나 있을 것입니다’
  - ‘두려움 없이 지낼 것입니다’
  rationale: 히브리어는 단순한 감정 진술이 아니라 안전한 거주의 결과를 말하므로, 한국어에서도 ‘없을 것입니다’로 약속의 확실성을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
