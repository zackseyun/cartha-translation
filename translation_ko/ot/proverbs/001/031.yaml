  text: וְֽ֭/יֹאכְלוּ מִ/פְּרִ֣י דַרְכָּ֑/ם וּֽ/מִ/מֹּעֲצֹ֖תֵי/הֶ֣ם יִשְׂבָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
  footnotes:
  - marker: a
    text: Or 'and they will eat from the fruit of their way.'
    reason: lexical_alternative
  - marker: b
    text: Or 'be satisfied with their own counsels' or 'have their fill of their own plans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기 길의 열매를 먹고, 자기 계획의 결과로 배부를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 길의 열매를 먹고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 계획들에 배부를 것입니다’, ‘자기 꾀에 만족할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאכְלוּ
  english_pob_choice: So they will eat
  chosen_korean: 그들이 … 먹고
  alternatives_korean:
  - 그래서 그들이 … 먹고
  - 그러므로 그들이 … 먹고
  lexicon: HALOT
  rationale: 문맥상 앞절의 거절에 대한 결과를 나타내므로 한국어에서는 인과를 자연스럽게 살린 연결로 옮겼습니다.
- source_word: מִפְּרִי דַרְכָּם
  english_pob_choice: from the fruit of their way
  chosen_korean: 자기 길의 열매
  alternatives_korean:
  - 자기 길에서 난 열매
  - 그들의 길의 열매
  lexicon: HALOT
  rationale: ‘길’은 잠언의 삶의 방식 은유를 그대로 살리고, ‘열매’는 מקור의 이미지와 결과성을 함께 보존합니다.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  english_pob_choice: with their own counsels
  chosen_korean: 자기 계획의 결과
  alternatives_korean:
  - 자기 조언들로
  - 자기 꾀로
  - 자기 계획들로
  lexicon: HALOT
  rationale: מֹעֲצוֹת는 조언, 계획, 꾀를 포괄하지만 여기서는 심판 맥락에서 자초한 내적 결의의 결과를 드러내는 ‘계획의 결과’가 가장 자연스럽고, POB의 ‘counsels/plans’ 범위를 무리 없이 반영합니다.
- source_word: יִשְׂבָּעוּ
  english_pob_choice: be filled
  chosen_korean: 배부를 것입니다
  alternatives_korean:
  - 만족할 것입니다
  - 배불리 먹을 것입니다
  lexicon: HALOT
  rationale: ‘배부르다’는 ‘filled’의 수동적 포만 이미지를 유지하면서도, 여기서는 복이 아니라 자기 선택의 결과로 가득 차는 역설을 드러냅니다.
theological_decisions:
- issue: 지혜문학의 보응 구조
  chosen_reading: 이 구절은 사람이 자기 선택의 결과를 그대로 겪는다는 합당한 보응의 진술로 옮겼습니다.
  alternative_readings:
  - 더 직역하여 보응 관계를 한국어에서 덜 분명하게 두는 번역
  rationale: 히브리어의 ‘먹다/배부르다’ 이미지는 추상 교리보다 삶의 결과를 체감하는 지혜문학의 보응을 표현하므로, 이를 분명하게 드러내되 과도한 신학화는 피했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
