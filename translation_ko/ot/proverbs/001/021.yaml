id: PRO.1.21
reference: Proverbs 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
  footnotes:
  - marker: a
    text: Or 'At the top of the tumultuous places she calls out.' The Hebrew expression may emphasize either the most prominent location or an elevated/foremost point within the public commotion.
    reason: lexical_alternative
  - marker: b
    text: City gates were the main public gathering places, where commerce, legal matters, and civic life were conducted.
    reason: cultural_note
  - marker: c
    text: Or 'she says her sayings.' The Hebrew is literally 'she says her words,' an idiom for public speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 소란스러운 거리의 어귀에서[a] 그녀가 외치며, 성 안의 성문 어귀에서[b] 그녀는 자기 말을 합니다:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소란스러운 곳의 높은 곳에서.’ 히브리어 표현은 가장 두드러진 위치를 가리킬 수도 있고, 소란스러운 공공 공간에서 높은 곳이나 앞쪽의 지점을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 성문은 상업, 재판, 시민 생활이 이루어지던 주요 공적 집합 장소였습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그녀가 자기의 말들을 말합니다.’ 히브리어는 문자적으로 ‘그녀가 자기의 말들을 말한다’이며, 공개적으로 말하는 것을 나타내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ
  english_pob_choice: At the head of
  chosen_korean: ~의 꼭대기에서
  alternatives_korean:
  - ~의 맨 앞에서
  - ~의 꼭대기에
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리’이지만 여기서는 공공 장소의 가장 두드러진 위치를 가리키므로, 영어 POB의 ‘At the head of’에 맞춰 한국어로는 ‘꼭대기/맨 앞’의 공간적 우세를 살렸습니다.
- source_word: הֹמִיּוֹת
  english_pob_choice: the noisy streets
  chosen_korean: 길거리의 소란한 곳
  alternatives_korean:
  - 소란한 거리들
  - 북적이는 곳
  lexicon: HALOT
  rationale: 이 어형은 ‘소란/웅성거림’이 특징인 장소들을 뜻하므로, 도시적 공공 공간의 느낌을 살리되 현대 한국어에서 자연스러운 ‘소란한 곳’으로 옮겼습니다.
- source_word: תִּקְרָא
  english_pob_choice: she cries out
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 부르짖으며
  lexicon: HALOT
  rationale: קרא는 단순한 ‘말하다’보다 강한 공개적 호소를 나타내므로, 지혜의 공개 선포를 드러내는 ‘외치다’를 택했습니다.
- source_word: אֲמָרֶי/הָ תֹאמֵר
  english_pob_choice: she speaks her words
  chosen_korean: 자기 말을 합니다
  alternatives_korean:
  - 그녀의 말을 합니다
  - 자기 말들을 합니다
  - 자기 이야기를 합니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그녀가 자기 말들을 말한다’는 관용적 표현이므로, POB의 뜻을 따라 ‘자기 말’을 유지하되 한국어에서는 반복을 줄여 ‘말합니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 잠언의 지혜가 여성 인칭으로 의인화됨
  chosen_reading: 여성 인칭 대명사 ‘그녀’와 여성 주어를 유지했습니다.
  alternative_readings:
  - 무인칭적으로 ‘그것이 외친다’로 바꿈
  - ‘지혜’만 반복하고 대명사를 생략함
  rationale: 히브리어 동사와 접미사는 여성 단수이므로, 지혜의 의인화를 약화시키지 않기 위해 여성 인칭을 보존했습니다.
  doctrine_reference: 'Translation philosophy: gender-accurate over gender-neutral'
