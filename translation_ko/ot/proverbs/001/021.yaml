  source_fidelity: 원문의 בְּרֹאשׁ הֹמִיּוֹת는 소란스럽고 붐비는 공적 공간의 ‘머리/앞부분’, 곧 길목이나 두드러진 지점을 가리킵니다. 초안의 ‘꼭대기’는 문자적 가능성은 있으나 이 도시 공간 문맥에서는 지나치게 수직적 의미를 강하게 합니다. 성문들과 성 안이라는 장소 관계, 여성 단수 화자, 공개적으로 외치고 말하는 두 동사는 유지되어야 합니다.
  naturalness: ‘길거리의 소란한 곳 꼭대기’와 ‘성문들의 입구, 곧 성 안에서’는 현대 한국어로 다소 부자연스럽고 장소 관계가 불명확합니다. ‘소란스러운 거리의 어귀’, ‘성 안의 성문 어귀’는 간결하고 자연스럽게 공적 장소의 의미를 전달합니다. 합쇼체 종결도 유지했습니다.
  terminology: ‘외치다’는 תִּקְרָא의 공개적이고 큰 소리의 호소에 알맞습니다. 여성 인칭 ‘그녀’를 유지하여 지혜의 문법적 의인화를 보존했습니다. אֲמָרֶיהָ תֹאמֵר의 명시된 목적어는 한국어에서 ‘자기 말을 합니다’로 무리 없이 반영했습니다.
