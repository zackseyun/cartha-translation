  source_fidelity: 현 초안은 פְּתָיִם(단순하고 분별이 부족한 자들)와 כְסִילִים(지혜를 거부하는 어리석은 자들)를 모두 ‘어리석은 자들’로 옮겨 두 지혜문학 범주를 구별하지 못합니다. 또한 חָמְדוּ는 ‘기뻐하다’보다 ‘탐하다/갈망하다’에 가깝고, לָהֶם의 ‘자기들을 위하여’라는 뉘앙스가 누락되었습니다. ‘언제까지’의 물음은 세 병렬 절 전체에 걸쳐 적용되도록 옮기는 것이 자연스럽고 원문에 충실합니다.
  naturalness: ‘언제까지 … 사랑하고 … 탐하며 … 미워하겠습니까?’라는 한 문장의 병렬 수사 의문문은 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 첫 대상을 부르는 호격 ‘어수룩한 자들아’를 사용하여 원문의 호격을 반영했습니다.
  terminology: פְּתָיִם/פֶתִי의 어근 반복은 ‘어수룩한 자들/어수룩함’으로 보존하고, כְסִילִים은 별도로 ‘어리석은 자들’로 옮겼습니다. לֵצִים/לָצוֹן의 반복도 ‘조롱하는 자들/조롱’으로 유지했습니다.
  issues:
  - severity: high
    issue: 서로 다른 두 지혜문학 범주를 모두 ‘어리석은 자들’로 번역함
    rationale: פְּתָיִם은 쉽게 속고 아직 분별이 형성되지 않은 사람들을, כְסִילִים은 지식과 교훈을 거부하는 어리석은 사람들을 가리킵니다. 동일 번역은 원문의 대조와 첫 절의 말놀이를 잃게 합니다.
