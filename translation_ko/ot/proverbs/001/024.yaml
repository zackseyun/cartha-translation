id: PRO.1.24
reference: Proverbs 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣עַן קָ֭רָאתִי וַ/תְּמָאֵ֑נוּ נָטִ֥יתִי יָ֝דִ֗/י וְ/אֵ֣ין מַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
  footnotes:
  - marker: a
    text: Or 'listened' or 'was listening.' The Hebrew participle emphasizes attentive listening.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 불렀는데도 너희는 거절하고, 내 손을 내밀었는데도 아무도 주의하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주의하지 않았습니다’는 히브리어 מַקְשִׁיב의 적극적 의미를 반영한 번역입니다. ‘들었습니다’보다 ‘귀 기울였습니다/주의했습니다’가 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  english_pob_choice: Because
  chosen_korean: -는데도 / -했는데도로 원인·상황을 연결
  alternatives_korean:
  - 왜냐하면
  - 그 까닭에
  lexicon: HALOT
  rationale: 히브리어의 원인 표지를 한국어에서는 앞절 전체를 받아 주는 연결 표현으로 자연스럽게 풀어, 다음 판단 선언의 이유를 분명히 드러냈습니다.
- source_word: קָרָאתִי
  english_pob_choice: I called
  chosen_korean: 내가 불렀다
  alternatives_korean:
  - 내가 외쳤다
  - 내가 소리쳐 불렀다
  lexicon: HALOT
  rationale: 지혜가 사람들을 향해 부르는 직접적 호출을 살리되, 현대 한국어에서 가장 직접적인 동사로 옮겼습니다.
- source_word: וַתְּמָאֵנוּ
  english_pob_choice: you refused
  chosen_korean: 너희는 거절하다
  alternatives_korean:
  - 너희는 마다하다
  - 너희는 응하지 않다
  lexicon: HALOT
  rationale: 단순한 불응보다 분명한 거부를 뜻하는 מאן의 의미를 살려, 청자들의 책임 있는 거절을 드러냈습니다.
- source_word: נָטִיתִי יָדִי
  english_pob_choice: I stretched out my hand
  chosen_korean: 내 손을 내밀다
  alternatives_korean:
  - 내 손을 뻗다
  - 내 손을 펼치다
  lexicon: HALOT
  rationale: נטה의 물리적 ‘펴다/뻗다’ 이미지를 유지하면서도 한국어 관용 표현으로 경고와 호소의 몸짓을 자연스럽게 전달했습니다.
- source_word: מַקְשִׁיב
  english_pob_choice: paid attention
  chosen_korean: 주의하다
  alternatives_korean:
  - 귀 기울이다
  - 듣다
  lexicon: HALOT
  rationale: קשב의 핵심은 단순 청취보다 적극적 주의이므로, 청자들이 응답하지 않은 상태를 ‘주의하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 지혜의 호소에 대한 인간의 책임 있는 거절
  chosen_reading: 이 절은 지혜가 먼저 부르고 손을 내밀었으나 청자들이 의도적으로 거절하고 주의하지 않았다는 책임 추궁으로 읽습니다.
  alternative_readings:
  - 단순한 정보 전달 실패
  - 무의미한 일방적 호소
  rationale: 히브리어 동사들이 의도적 거부와 무응답을 분명히 말하므로, 본문을 인간 책임의 강조로 보존하는 것이 문맥상 적절합니다.
  doctrine_reference: 잠언 1장 전반의 지혜 초청과 경고
