id: PRO.1.18
reference: Proverbs 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/הֵם לְ/דָמָ֣/ם יֶאֱרֹ֑בוּ יִ֝צְפְּנ֗וּ לְ/נַפְשֹׁתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
  footnotes:
  - marker: a
    text: Hebrew 'blood' is retained rather than paraphrased as 'bloodshed' or 'death,' preserving the concrete image and the irony that their violence turns back on them.
    reason: lexical_alternative
  - marker: b
    text: Or 'they hide for their own lives.' The Hebrew verb can more literally mean 'hide/conceal,' but here likely refers to setting a concealed ambush.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 자기 피[a]를 노리고 숨어 기다리며, 자기 목숨을 노려 몸을 숨깁니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '피'를 그대로 사용하며, 이를 '유혈'이나 '죽음'으로 풀어 쓰지 않습니다. 그들의 폭력이 결국 자신들에게 되돌아온다는 아이러니를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '자기 목숨을 노려 매복합니다.' 히브리어 동사는 문자적으로 '숨기다, 감추다'를 뜻하지만, 이 문맥에서는 은밀히 매복하는 행위를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그런데 그들은
  lexicon: HALOT
  rationale: 문맥상 앞절의 경고와 대비되는 역접이므로 '그러나'로 처리하고, 히브리어의 독립 인칭대명사도 살려 '그들은'을 분명히 드러냈습니다.
- source_word: לְדָמָם
  english_pob_choice: for their own blood
  chosen_korean: 자기 피를 위해
  alternatives_korean:
  - 자기들의 피를 위해
  - 자기들의 유혈을 위해
  - 자기들의 죽음을 위해
  lexicon: HALOT
  rationale: דָם을 '피'로 유지해 히브리어의 구체적이고 충격적인 이미지를 보존했으며, 소유 접미사는 '자기'로 반영해 자기에게 되돌아오는 역설을 살렸습니다.
- source_word: יֶאֱרֹבוּ
  english_pob_choice: lie in wait
  chosen_korean: 숨어 기다리며
  alternatives_korean:
  - 매복하며
  - 노리며
  - 기다리며
  lexicon: HALOT
  rationale: אָרַב의 기본 의미인 '매복하다/숨어 기다리다'를 반영하되, 다음 절의 יִצְפְּנוּ와 구별되도록 첫 동사는 '숨어 기다리며'로 옮겼습니다.
- source_word: יִצְפְּנוּ
  english_pob_choice: set an ambush for their own lives
  chosen_korean: 매복합니다
  alternatives_korean:
  - 몰래 숨습니다
  - 숨어 덮칩니다
  - 숨겨 기다립니다
  lexicon: HALOT
  rationale: צפן은 본래 숨기다/감추다의 뜻이지만 여기서는 앞동사와 평행을 이루며 은밀한 공격을 가리키므로, 한국어에서는 행위의 결과를 드러내는 '매복합니다'로 옮겼습니다.
- source_word: לְנַפְשֹׁתָם
  english_pob_choice: for their own lives
  chosen_korean: 자기 생명을 위해
  alternatives_korean:
  - 자기 영혼을 위해
  - 자기 자신을 위해
  - 자기 목숨을 위해
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 육체적 생명을 뜻하므로 '생명'이 가장 자연스럽고, 소유 접미사는 다시 '자기'로 반영했습니다.
theological_decisions:
- issue: 폭력의 자기역전이라는 지혜문학적 역설
  chosen_reading: 가해를 계획하는 자들의 폭력이 결국 자기 자신에게 되돌아온다는 역설을 드러내었습니다.
  alternative_readings:
  - '''피''를 ''유혈''이나 ''죽음''으로 완화하는 읽기'
  - 반복되는 자기지시를 약화하는 읽기
  rationale: 히브리어는 구체적인 '피'와 '생명'을 병치해 도덕적 자기파괴를 강조하므로, 이를 완화하지 않고 그대로 드러내는 것이 본문의 지혜문학적 경고를 보존합니다.
  doctrine_reference: 잠언 1:18의 인과적·도덕적 보응 이해
- issue: 두 개의 서로 다른 매복 동사 보존
  chosen_reading: 두 히브리 동사의 평행을 유지하기 위해 첫 동사는 '숨어 기다리며', 둘째는 '매복합니다'로 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 '매복하다'로 통일하는 읽기
  - 두 동사를 모두 '숨다'로 통일하는 읽기
  rationale: English POB가 두 동사의 구별을 유지하려는 점을 반영해, 한국어에서도 반복을 평탄화하지 않고 은밀한 공격의 점층을 살렸습니다.
  doctrine_reference: 시적 평행법 보존
