id: PRO.1.25
reference: Proverbs 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּפְרְע֥וּ כָל עֲצָתִ֑/י וְ֝/תוֹכַחְתִּ֗/י לֹ֣א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/025.yaml
  text: but you ignored all my counsel[b][a], and you were unwilling to accept my reproof—
  footnotes:
  - marker: a
    text: Or 'you neglected all my counsel' or 'you cast aside all my counsel.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''you refused my reproof.'' The Hebrew more literally emphasizes unwillingness: ''you were not willing for my reproof.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 내 모든 권면을 무시하고, 내 책망을 받아들이려 하지 않았습니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 모든 권면을 소홀히 하고’ 또는 ‘내 모든 권면을 버리고.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 책망을 거절하려 하지 않았습니다.’ 히브리어는 더 문자적으로 ‘내 책망을 원하지 않았습니다’라는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  english_pob_choice: you ignored
  chosen_korean: 무시하고
  alternatives_korean:
  - 소홀히 하고
  - 버리고
  - 외면하고
  - 거절하고
  lexicon: HALOT
  rationale: 문맥상 지혜의 권면을 의도적으로 경시하고 따르지 않은 뜻이므로, ‘무시하다’가 현대 한국어에서 가장 자연스럽게 그 뉘앙스를 살립니다.
- source_word: עֲצָתִי
  english_pob_choice: my counsel
  chosen_korean: 내 모든 권면
  alternatives_korean:
  - 내 조언
  - 내 계획
  - 내 뜻
  lexicon: HALOT
  rationale: 잠언의 지혜 문맥에서 עֵצָה는 단순한 조언보다 권위 있는 지혜의 권면을 가리키므로 ‘권면’이 적절합니다. ‘모든’은 히브리어 כָּל을 자연스럽게 옮깁니다.
- source_word: תוֹכַחְתִּי
  english_pob_choice: my reproof
  chosen_korean: 내 책망
  alternatives_korean:
  - 내 훈계
  - 내 질책
  - 내 교정
  lexicon: HALOT
  rationale: תוֹכַחַת은 잠언에서 교정적 질책을 뜻하므로 ‘책망’이 가장 직접적입니다. ‘훈계’는 다소 완화되고, ‘교정’은 추상적입니다.
- source_word: לֹא אֲבִיתֶם
  english_pob_choice: you were unwilling to accept
  chosen_korean: 받아들이려 하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 동의하지 않았습니다
  - 거절했습니다
  lexicon: HALOT
  rationale: אָבָה의 핵심은 의지의 부정이므로, 단순한 ‘거절’보다 ‘받아들이려 하지 않다’가 내적 비의지를 더 분명히 드러냅니다.
theological_decisions:
- issue: 초두 접속사 וַ의 역접 처리
  chosen_reading: 문맥 흐름에 맞춰 ‘그러나’로 시작했습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 앞절들의 부르심과 대비되는 거절을 강조하는 문맥이므로, 한국어에서는 역접 ‘그러나’가 전달력을 높입니다.
  doctrine_reference: 지혜문학의 수사적 대조
- issue: 책망의 성격
  chosen_reading: ‘책망’으로 옮겨 교정적 경고의 성격을 유지했습니다.
  alternative_readings:
  - 훈계
  - 경고
  rationale: 본문은 단순 정보 전달이 아니라 죄책과 책임을 드러내는 지혜의 교정을 말하므로, 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 잠언의 지혜-훈계 구조
