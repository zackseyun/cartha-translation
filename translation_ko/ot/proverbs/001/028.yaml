base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
  footnotes:
  - marker: a
    text: Or 'they will seek me early' or 'they will seek me earnestly.' The Hebrew verb can carry the idea of early, eager seeking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그들이 나를 부르겠지만, 나는 대답하지 않겠습니다. 그들이 나를 간절히 찾겠지만, 나를 찾지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나를 일찍 찾을 것이다’ 또는 ‘그들이 나를 열심히 찾을 것이다.’ 히브리어 동사는 일찍 찾는 것과 열심히 찾는 것의 뉘앙스를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
