  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז יִ֭קְרָאֻ/נְנִי וְ/לֹ֣א אֶֽעֱנֶ֑ה יְ֝שַׁחֲרֻ֗/נְנִי וְ/לֹ֣א יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
  footnotes:
  - marker: a
    text: Or 'they will seek me early' or 'they will seek me earnestly.' The Hebrew verb can carry the idea of early, eager seeking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그들은 나를 부르겠지만, 내가 대답하지 않을 것이며, 나를 간절히 찾겠지만, 나를 찾지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나를 일찍 찾겠다’ 또는 ‘그들이 나를 간절히 찾겠다.’ 히브리어 동사는 ‘일찍’ 혹은 ‘간절히’ 찾는 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그때
  - 그 후에
  lexicon: HALOT
  rationale: 앞절의 경고에 이어지는 결과·시점 전환을 자연스럽게 드러내는 현대 한국어 표현입니다.
- source_word: יִקְרָאֻנְנִי
  english_pob_choice: they will call on me
  chosen_korean: 그들은 나를 부르겠지만
  alternatives_korean:
  - 그들은 나를 불러보겠지만
  - 그들은 내게 부르짖겠지만
  lexicon: HALOT
  rationale: קרא의 ‘부르다/불러 호소하다’ 의미를 살려, 단순한 호명이 아니라 응답을 기대하는 호소의 뉘앙스를 유지했습니다.
- source_word: יְשַׁחֲרֻנְנִי
  english_pob_choice: they will seek me diligently
  chosen_korean: 나를 간절히 찾겠지만
  alternatives_korean:
  - 나를 일찍 찾겠지만
  - 나를 부지런히 찾겠지만
  lexicon: HALOT
  rationale: שׁחר의 ‘일찍/간절히 찾다’의 중첩 의미 가운데, 이 지혜 문맥에서 핵심인 절박함·성실함을 한국어로 가장 자연스럽게 옮겼습니다.
- source_word: וְלֹא יִמְצָאֻנְנִי
  english_pob_choice: but they will not find me
  chosen_korean: 나를 찾지 못할 것입니다
  alternatives_korean:
  - 그러나 나를 찾지 못할 것입니다
  - 그리고 나를 찾지 못할 것입니다
  lexicon: HALOT
  rationale: מצא의 직설적 의미를 유지하면서, 앞 절과의 대비는 한국어 문장 흐름으로 충분히 드러나므로 과도한 접속어는 피했습니다.
theological_decisions:
- issue: 화자의 정체를 본문 안에서 어떻게 처리할지
  chosen_reading: 지혜가 1인칭으로 말하는 문학적 화법을 그대로 살려 번역했습니다.
  alternative_readings:
  - 지혜를 하나님 자신으로 명시적으로 풀어 쓰기
  - 후대의 그리스도론적 연결을 본문에 반영하기
  rationale: 이 절은 잠언 1장의 지혜의 경고 연설 안에 있으므로, 본문이 허용하는 범위 안에서 화자 목소리를 보존하고 해석은 독자에게 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문의 문학적 음성 보존; 해석학적 유보
