- source_word: מְלִיצָה
  english_pob_choice: a saying
  chosen_korean: 말의 뜻
  alternatives_korean:
  - 말
  - 표현
  - 해석
  lexicon: HALOT
  rationale: 이 단어는 단순한 말보다 함축적이거나 재치 있는 표현을 가리킬 수 있으므로, 영어 본문의 'a saying'과 대조되는 해석적 뉘앙스를 살려 '말의 뜻'으로 풀었습니다.
- source_word: חִידֹתָם
  english_pob_choice: their riddles
  chosen_korean: 그들의 수수께끼
  alternatives_korean:
  - 그들의 난해한 말
  - 그들의 암시적 말
  - 그들의 수수께끼 같은 말
  lexicon: HALOT
  rationale: חִידָה는 풀어야 하는 수수께끼를 뜻하므로, 현대 한국어에서 직관적인 '수수께끼'가 가장 직접적입니다. 3인칭 복수 소유격도 '그들의'로 보존했습니다.
theological_decisions:
- issue: 지혜 문헌의 인식 목적을 어떻게 살릴지
  chosen_reading: 이 구절은 지혜를 단순히 아는 것이 아니라, 비유와 함축적 표현의 뜻을 실제로 깨닫는 것을 목표로 제시합니다.
  alternative_readings:
  - 그저 교훈적 지식을 습득하는 것으로 완화
  - '''말의 뜻''을 생략해 일반적 이해로 축소'
  rationale: 문맥상 이전 절들의 목적절이 이어지므로, 지혜의 말씀을 해석하고 분별하는 훈련이라는 기능을 드러내는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 잠언 1장 서두의 지혜 교육 목적
