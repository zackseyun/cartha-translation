id: PRO.1.6
reference: Proverbs 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הָבִ֣ין מָ֭שָׁל וּ/מְלִיצָ֑ה דִּבְרֵ֥י חֲ֝כָמִ֗ים וְ/חִידֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/006.yaml
  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
  footnotes:
  - marker: a
    text: Or 'a proverb and an interpretation' for מְלִיצָה; the Hebrew term can refer to a pointed or artful saying and, in some contexts, an interpretive expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'their dark sayings.' The Hebrew word can denote riddles or enigmatic sayings that require reflection.
    reason: lexical_alternative
translation:
  language: ko
  text: 비유와 말의 뜻을 깨닫고, 지혜로운 자들의 말과 그들의 수수께끼를 이해하게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말의 해석’. מְלִיצָה는 재치 있거나 함축적인 표현, 어떤 문맥에서는 해석적 표현을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 어두운 말’. 히브리어 חִידֹתָם은 수수께끼나 뜻을 풀어야 하는 난해한 말을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  english_pob_choice: to understand
  chosen_korean: 깨닫고, ... 이해하게 하려는 것입니다
  alternatives_korean:
  - 이해하려고
  - 분별하려고
  - 깨닫게 하려는 것입니다
  lexicon: HALOT
  rationale: 목적을 나타내는 לְ+부정사 구문을 한국어 목적 표현으로 옮기되, 단순 정보 파악보다 지혜를 '깨닫고 이해하는' 흐름이 자연스럽습니다.
- source_word: מָשָׁל
  english_pob_choice: a proverb
  chosen_korean: 비유
  alternatives_korean:
  - 속담
  - 잠언
  - 비유적 말
  lexicon: HALOT
  rationale: 잠언서 문맥에서는 속담보다 넓은 지혜 문장으로 기능하므로, 형식적 장르보다 의미 범주를 살린 '비유'가 본문 흐름을 잘 반영합니다.
- source_word: מְלִיצָה
  english_pob_choice: a saying
  chosen_korean: 말의 뜻
  alternatives_korean:
  - 말
  - 표현
  - 해석
  lexicon: HALOT
  rationale: 이 단어는 단순한 말보다 함축적이거나 재치 있는 표현을 가리킬 수 있으므로, 영어 본문의 'a saying'과 대조되는 해석적 뉘앙스를 살려 '말의 뜻'으로 풀었습니다.
- source_word: חִידֹתָם
  english_pob_choice: their riddles
  chosen_korean: 그들의 수수께끼
  alternatives_korean:
  - 그들의 난해한 말
  - 그들의 암시적 말
  - 그들의 수수께끼 같은 말
  lexicon: HALOT
  rationale: חִידָה는 풀어야 하는 수수께끼를 뜻하므로, 현대 한국어에서 직관적인 '수수께끼'가 가장 직접적입니다. 3인칭 복수 소유격도 '그들의'로 보존했습니다.
theological_decisions:
- issue: 지혜 문헌의 인식 목적을 어떻게 살릴지
  chosen_reading: 이 구절은 지혜를 단순히 아는 것이 아니라, 비유와 함축적 표현의 뜻을 실제로 깨닫는 것을 목표로 제시합니다.
  alternative_readings:
  - 그저 교훈적 지식을 습득하는 것으로 완화
  - '''말의 뜻''을 생략해 일반적 이해로 축소'
  rationale: 문맥상 이전 절들의 목적절이 이어지므로, 지혜의 말씀을 해석하고 분별하는 훈련이라는 기능을 드러내는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 잠언 1장 서두의 지혜 교육 목적
