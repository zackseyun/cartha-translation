base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/006.yaml
  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
  footnotes:
  - marker: a
    text: Or 'a proverb and an interpretation' for מְלִיצָה; the Hebrew term can refer to a pointed or artful saying and, in some contexts, an interpretive expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'their dark sayings.' The Hebrew word can denote riddles or enigmatic sayings that require reflection.
    reason: lexical_alternative
translation:
  language: ko
  text: 비유와 격언[a], 지혜로운 이들의 말과 그들의 수수께끼[b]를 이해하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말의 해석’. מְלִיצָה는 재치 있거나 함축적인 표현을, 어떤 문맥에서는 해석적인 표현을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 난해한 말’. 히브리어 חִידֹתָם은 수수께끼나 곰곰이 생각하여 뜻을 풀어야 하는 난해한 말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  english_pob_choice: to understand
  chosen_korean: 깨닫고, ... 이해하게 하려는 것입니다
  alternatives_korean:
  - 이해하려고
  - 분별하려고
  - 깨닫게 하려는 것입니다
  lexicon: HALOT
  rationale: 목적을 나타내는 לְ+부정사 구문을 한국어 목적 표현으로 옮기되, 단순 정보 파악보다 지혜를 '깨닫고 이해하는' 흐름이 자연스럽습니다.
- source_word: מָשָׁל
  english_pob_choice: a proverb
  chosen_korean: 비유
  alternatives_korean:
  - 속담
  - 잠언
