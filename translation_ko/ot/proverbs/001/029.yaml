id: PRO.1.29
reference: Proverbs 1:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
  footnotes:
  - marker: a
    text: Or 'the fear of Yahweh.' The Hebrew uses the divine name יְהוָה.
    reason: alternative_reading
  - marker: b
    text: '''The fear of the LORD'' is a key wisdom expression that includes reverent awe, not mere terror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 지식을 미워하고 야훼[a]를 경외하기를[b] 선택하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 יְהוָה는 하나님의 이름 야훼를 가리킵니다.
    reason: ot_citation
  - marker: b
    text: ‘야훼를 경외하기’는 잠언의 핵심 지혜 표현으로, 단순한 공포가 아니라 경외와 도덕적 엄중함을 함께 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּ֭חַת כִּי
  english_pob_choice: Because
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - ~하여
  - ~한 까닭입니다
  lexicon: HALOT
  rationale: 문맥상 뒤의 판단을 뒷받침하는 원인·이유를 나타내므로, 한국어에서는 자연스러운 이유 절 종결인 '-기 때문입니다'로 옮겼습니다.
- source_word: שָׂנְאוּ
  english_pob_choice: they hated
  chosen_korean: 미워하였고
  alternatives_korean:
  - 증오하였고
  - 싫어하였고
  - 거부하였고
  lexicon: HALOT
  rationale: 히브리어 שׂנא의 강한 감정적·윤리적 적대감을 살리기 위해 약화된 '거부하다'보다 직접적인 '미워하다'를 택했습니다.
- source_word: דָעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 지혜
  - 분별
  - 깨달음
  lexicon: HALOT
  rationale: 잠언에서 דָעַת는 단순 정보보다 하나님과 삶의 바른 앎을 가리키지만, 표제어상 가장 직접적인 대응은 '지식'이므로 이를 유지했습니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼를 두려워하는 것
  - 여호와 경외
  - 주를 경외하는 것
  lexicon: HALOT
  rationale: 지혜문학의 핵심 표현인 'fear'의 긴장을 보존하면서도 한국어에서 자연스러운 명사구로 풀어 '경외하는 것'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה는 직역 관례에 따라 호칭이 아닌 고유명 '야훼'로 반영했습니다.
- source_word: לֹא בָחָרוּ
  english_pob_choice: did not choose
  chosen_korean: 선택하지 않았습니다
  alternatives_korean:
  - 택하지 않았습니다
  - 고르지 않았습니다
  - 받아들이지 않았습니다
  lexicon: HALOT
  rationale: בחר의 기본 의미를 살려 의지적 선택의 결여를 분명히 드러내는 '선택하지 않다'를 사용했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 본문에서 신적 고유명은 '야훼'로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 히브리어 원문이 직접 하나님의 이름을 사용하므로, 직함으로 바꾸지 않고 고유명 자체를 보존하는 것이 소스 충실성과 감사가능성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יִרְאַת יְהוָה의 표현
  chosen_reading: '''야훼를 경외하는 것''으로 옮겨, 단순 공포가 아닌 지혜적 경외의 긴장을 유지했습니다.'
  alternative_readings:
  - 야훼를 두려워하는 것
  - 야훼에 대한 경외
  rationale: 잠언의 표준적 신학 표현을 약화시키지 않기 위해 '두려움/공포'와 '존경' 사이의 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
