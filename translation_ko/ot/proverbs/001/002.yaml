  terminology: ‘지혜’와 ‘훈계’는 חָכְמָה와 מוּסָר에 적절합니다. ‘훈계’는 교정적·훈련적 의미를 포함하되, 각주로 ‘교훈’을 보충하는 방식도 적절합니다. בִינָה는 ‘통찰’로 유지할 수 있습니다.
  issues:
