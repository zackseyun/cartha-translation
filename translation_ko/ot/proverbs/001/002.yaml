lexical_decisions:
- source_word: לָדַעַת
  english_pob_choice: to know
  chosen_korean: 알며
  alternatives_korean:
  - 알기 위해
  - 알도록
  lexicon: HALOT
  rationale: לָדַעַת의 목적 부정사 의미를 살리면서도 한국어 문장 흐름에 자연스럽게 맞추기 위해 ‘알며’로 옮겼습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  lexicon: HALOT
  rationale: 잠언에서 חָכְמָה의 기본 대응은 ‘지혜’가 가장 안정적이며, 본문의 핵심 덕목을 직접 드러냅니다.
- source_word: מוּסָר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교훈
  - discipline
  lexicon: HALOT
  rationale: English POB가 지적한 것처럼 מוּסָר에는 교정과 훈련의 뉘앙스가 있어, 단순한 가르침보다 더 강한 ‘훈계’가 그 긴장을 더 잘 드러냅니다.
- source_word: אִמְרֵי בִינָה
  english_pob_choice: words of insight
  chosen_korean: 통찰의 말
  alternatives_korean:
  - 이해의 말
  - 분별의 말
  - 통찰의 말씀
  lexicon: HALOT
  rationale: 직역하면 ‘분별/이해의 말들’이지만, 현대 한국어에서는 ‘통찰의 말’이 טבע스럽고, 뒤의 ‘깨닫게 하려는’과도 중복을 줄입니다.
theological_decisions:
- issue: 목적 부정사 연쇄의 표현
  chosen_reading: ‘지혜와 훈계를 알며, 통찰의 말을 깨닫게 하려는 것입니다’로 목적성을 분명히 했습니다.
  alternative_readings:
  - ‘알고 … 깨닫는 것’
  - ‘지혜와 훈계를 알고 … 통찰의 말을 이해하는 것’
  rationale: 히브리어의 ל + 부정사 연쇄는 잠언 서문의 목적을 제시하므로, 한국어에서도 단순 나열보다 목적 지향성을 분명히 살리는 편이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 지혜문학 서문의 교육적 목적 진술
