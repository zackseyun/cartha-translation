    issue: 목적 부정사 연쇄가 ‘알며’와 ‘깨닫게 하려는’으로 옮겨졌습니다.
    rationale: לָדַעַת와 לְהָבִין은 모두 목적을 나타내는 부정사입니다. ‘알며’는 목적성을 약화하고, ‘깨닫게 하려는’은 ‘~하게 하다’라는 사역 구문을 도입합니다. 두 동사를 병렬 목적 표현으로 옮겨야 합니다.
