  alternatives_korean:
  - 솔로몬 왕
  lexicon: 고유명사 표기
  rationale: 인명은 현대 한국어 외래어 표기 관례에 따라 ‘솔로몬’으로 옮겼습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들로서
  alternatives_korean:
  - 아들
  - 자손으로
  lexicon: HALOT
  rationale: 단순 혈연 관계를 직접 드러내되, 한국어 표제문에서는 ‘다윗의 아들’ 뒤에 관계를 분명히 해 주는 ‘-로서’를 보태어 자연스러운 수식을 만들었습니다.
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  lexicon: HALOT
  rationale: 이스라엘의 통치 직함으로서 일반적이고 중립적인 ‘왕’이 원문의 직책 표현을 가장 सीधे하게 반영합니다.
