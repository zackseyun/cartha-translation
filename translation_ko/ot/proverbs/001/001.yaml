  text: 솔로몬, 다윗의 아들로서 이스라엘의 왕이 전하는 잠언입니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁלֵי는 ‘잠언’뿐 아니라 ‘속담’, ‘지혜의 말’도 뜻할 수 있으나, 여기서는 책 제목과 표제의 기능에 가장 잘 맞는 ‘잠언’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁלֵי
  english_pob_choice: proverbs
  chosen_korean: 잠언
  alternatives_korean:
  - 속담
  - 지혜의 말
  lexicon: HALOT
  rationale: 책 제목이자 표제의 기능을 함께 가지므로, 보다 일반적인 ‘말들’보다 전통적으로도 널리 통용되는 ‘잠언’이 원문의 수집명과 표제성을 가장 잘 살립니다.
- source_word: שְׁלֹמֹה
