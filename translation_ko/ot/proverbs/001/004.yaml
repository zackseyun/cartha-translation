base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
  footnotes:
  - marker: a
    text: Or 'to the youth' or 'to a young person.' The Hebrew is masculine singular ('young man') and may function representatively in wisdom instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 지각이 없는 자들에게는 신중함을, 젊은이에게는 지식과 분별을 주려 함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수(‘젊은이’)를 사용하며, 지혜 교육에서는 대표적 대상 표현으로 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  english_pob_choice: to give
  chosen_korean: 주려 함입니다
  alternatives_korean:
  - 주기 위함입니다
  - 주도록 하기 위함입니다
  lexicon: HALOT
  rationale: 히브리어 부정사구가 1절의 목적 진술을 이어 가므로, 한국어에서는 목적의 뜻을 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: לִפְתָאיִם
  english_pob_choice: to the simple
  chosen_korean: 지각이 없는 자들에게는
  alternatives_korean:
  - 단순한 자들에게는
  - 어리숙한 자들에게는
  lexicon: HALOT
  rationale: פְּתָאִים은 지적 장애가 아니라 쉽게 속는 미숙함을 가리키므로, 문맥의 교육적 의미를 살려 ‘지각이 없는 자들’로 옮겼습니다.
- source_word: עָרְמָה
  english_pob_choice: prudence
  chosen_korean: 신중함
  alternatives_korean:
  - 분별
  - 지혜로운 판단
  lexicon: HALOT
  rationale: 잠언에서 긍정적으로 쓰이는 עָרְמָה의 실용적·조심스러운 뉘앙스를, 부정적 ‘간계’가 아닌 ‘신중함’으로 반영했습니다.
- source_word: לְנַעַר
  english_pob_choice: to the young man
  chosen_korean: 젊은이에게는
  alternatives_korean:
  - 젊은 남자에게는
  - 청년에게는
  lexicon: HALOT
  rationale: 히브리어가 남성 단수인 점은 유지하되, 한국어에서는 자연스러운 대표 표현으로 ‘젊은이’를 선택했습니다. 젠더 표지를 과도하게 굳히지 않으면서도 대상의 연령층을 살립니다.
- source_word: וּמְזִמָּה
  english_pob_choice: and discretion
  chosen_korean: 분별을
  alternatives_korean:
  - 신중한 판단을
  - 사려를
  lexicon: HALOT
  rationale: מְזִמָּה는 계획, 분별, 사려 깊은 판단을 아우를 수 있으므로, ‘지식’과 병렬을 이루는 두 번째 덕목으로 ‘분별’을 택했습니다.
theological_decisions:
- issue: 남성 단수 표현의 한국어 처리
  chosen_reading: 젊은이에게는
  alternative_readings:
  - 젊은 남자에게는
  - 청년에게는
  rationale: 본문의 נַעַר는 남성 단수이지만, 지혜 교육의 대표적 수혜자를 가리키는 관용적 용법이므로 한국어에서는 읽기 자연성을 위해 대표명사로 옮겼습니다. 이는 성별 중립화가 아니라 문맥상 대표성을 살린 처리입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
