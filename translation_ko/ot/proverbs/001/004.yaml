    rationale: ‘지각이 없는 자들’은 판단력 자체가 없는 사람처럼 들릴 수 있습니다. 원어는 주로 순진하고 경험이 부족하여 쉽게 속을 수 있는 사람들을 가리키므로 ‘미숙한 이들’이 교육 문맥에 더 적합합니다.
  - severity: medium
    issue: לְנַעַר의 남성 단수가 본문에서 중립화되었습니다.
    rationale: 영어 POB 감사 기록은 남성 단수 ‘young man’을 본문에 보존합니다. 한국어 본문도 ‘젊은 남자’로 옮기고, 대표적 용법 및 ‘젊은이’ 가능성은 각주로 처리하는 편이 원문 형태에 더 충실합니다.
