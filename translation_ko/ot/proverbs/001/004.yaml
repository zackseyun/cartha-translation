translation:
  language: ko
  text: 미숙한 이들에게 슬기로움을, 젊은 남자에게 지식과 분별력을 주려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수로 ‘젊은 남자’를 사용합니다. 지혜 교육에서는 대표적인 대상을 가리킬 수 있으므로 ‘젊은이’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  english_pob_choice: to give
  chosen_korean: 주려 함입니다
  alternatives_korean:
  - 주기 위함입니다
  - 주도록 하기 위함입니다
  lexicon: HALOT
  rationale: 히브리어 부정사구가 1절의 목적 진술을 이어 가므로, 한국어에서는 목적의 뜻을 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: לִפְתָאיִם
  english_pob_choice: to the simple
  chosen_korean: 지각이 없는 자들에게는
  alternatives_korean:
