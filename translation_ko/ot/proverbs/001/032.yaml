  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
  footnotes:
  - marker: a
    text: Or 'Because the waywardness of the simple will kill them, and the ease/security of fools will destroy them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 미련한 자들의 빗나감이 그들을 죽이고, 어리석은 자들의 안일함이 그들을 멸망시킬 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미련한 자들의 등 돌림이 그들을 죽이고, 어리석은 자들의 안일함이 그들을 멸망시킬 것이다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞선 경고를 설명하는 이유를 제시하므로, 합쇼체 문맥에서 자연스러운 인과 연결인 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: מְשׁוּבַת
  english_pob_choice: turning away
  chosen_korean: 돌이킴
  alternatives_korean:
  - 떠남
  - 배반
  - 배교
  lexicon: HALOT
  rationale: ית/שׁוב 계열의 ‘돌아섬/돌이킴’ 의미를 살리면서도, 지혜문맥에서의 일반적 이탈을 ‘배교’처럼 종교적으로 과도하게 특정하지 않기 위해 ‘돌이킴’을 택했습니다.
- source_word: פְּתָיִם
  english_pob_choice: the simple
  chosen_korean: 미련한 자들
  alternatives_korean:
  - 단순한 자들
  - 순진한 자들
  - 어리석은 자들
  lexicon: HALOT
  rationale: 잠언에서 פְּתָיִם은 단순한 무지가 아니라 경계하지 못하는 어리석음을 가리키므로, 문맥상 ‘미련한 자들’이 가장 무난하면서도 경고의 뉘앙스를 살립니다.
- source_word: שַׁלְוַת
  english_pob_choice: complacency of
  chosen_korean: 안일함
  alternatives_korean:
  - 평안함
  - 편안함
  - 안전함
  lexicon: HALOT
  rationale: 문맥상 칭찬되는 평안이 아니라, 지혜를 무시하는 자기만족적 평온이므로 ‘안일함’이 영어 POB의 ‘complacency’에 가장 가깝습니다.
theological_decisions:
- issue: 지혜문맥에서 פְּתָיִם과 כְּסִילִים의 차이
  chosen_reading: 두 표현 모두 도덕적·지혜적 어리석음을 가리키지만, 첫 절반은 ‘미련한 자들’, 둘째 절반은 ‘어리석은 자들’로 약간 달리 옮겨 반복의 평행을 살렸습니다.
  alternative_readings:
  - 둘 다 ‘어리석은 자들’로 통일
  - 둘 다 ‘미련한 자들’로 통일
  rationale: 히브리어 평행법은 의미 반복을 통해 강조하므로, 한국어에서도 같은 범주의 인물을 지칭하되 약간의 변주를 주어 운율과 병렬성을 유지했습니다.
  doctrine_reference: 잠언 1:32 지혜와 어리석음의 대비
