  rationale: 문맥이 도덕적 평이 아니라 ‘한 덩어리로’ 삼켜지는 형상을 요구하므로, ‘온전한 채로’로 물리적 완전성을 살렸습니다.
- source_word: כְּיֹרְדֵי בוֹר
  english_pob_choice: like those who go down to the pit
  chosen_korean: 무덤으로 내려가는 자들처럼
