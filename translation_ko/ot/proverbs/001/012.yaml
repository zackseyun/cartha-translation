source:
  edition: WLC
  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
  footnotes:
  - marker: a
    text: Or 'like the grave'; 'Sheol' refers to the realm of the dead in Hebrew thought.
    reason: lexical_alternative
  - marker: b
    text: Or 'and intact' or 'and sound'; the Hebrew can denote completeness or wholeness here.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그들을 스올[a]처럼 살아 있는 채로, 무덤[b]으로 내려가는 자들처럼 온전한 채로 삼켜 버리자」라고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’. ‘스올’은 히브리어 사상에서 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구덩이’. 히브리어는 여기서 죽음과 관련된 구체적 이미지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  english_pob_choice: Let us swallow them
  chosen_korean: 삼켜 버리자
  alternatives_korean:
  - 삼키자
  - 집어삼키자
  lexicon: HALOT
  rationale: 공동체의 가해 의도를 드러내는 1인칭 복수 청유형을 살리면서, 먹잇감을 덮치는 폭력적 이미지를 자연스럽게 전달합니다.
- source_word: כִּשְׁאוֹל
  english_pob_choice: like Sheol
  chosen_korean: 스올처럼
  alternatives_korean:
  - 무덤처럼
  - 죽음처럼
  lexicon: HALOT
  rationale: 시적·신학적 이미지를 보존하기 위해 שְׁאוֹל을 ‘무덤’으로 평탄화하지 않고 음역형 ‘스올’을 유지했습니다.
- source_word: חַיִּים
  english_pob_choice: alive
  chosen_korean: 살아 있는 채로
  alternatives_korean:
  - 생생한 채로
  - 살아서
  lexicon: HALOT
  rationale: 포식의 대상이 아직 죽지 않은 상태로 삼켜진다는 점을 분명히 하는 가장 자연스러운 현대 한국어 표현입니다.
- source_word: וּתְמִימִים
  english_pob_choice: whole
  chosen_korean: 온전한 채로
  alternatives_korean:
  - 완전한 채로
  - 흠 없는 채로
  - 온전하게
  lexicon: HALOT
  rationale: 문맥이 도덕적 평이 아니라 ‘한 덩어리로’ 삼켜지는 형상을 요구하므로, ‘온전한 채로’로 물리적 완전성을 살렸습니다.
- source_word: כְּיֹרְדֵי בוֹר
  english_pob_choice: like those who go down to the pit
  chosen_korean: 무덤으로 내려가는 자들처럼
  alternatives_korean:
  - 구덩이로 내려가는 자들처럼
  - 웅덩이로 내려가는 자들처럼
  lexicon: HALOT
  rationale: בּוֹר의 기본적 죽음-이미지를 한국어 독자가 바로 이해할 수 있도록 ‘무덤’으로 옮기되, 하위 각주에서 원문 이미지를 보완할 수 있게 했습니다.
theological_decisions:
- issue: שְׁאוֹל의 보존 여부
  chosen_reading: 음역형 ‘스올’을 본문에 유지합니다.
  alternative_readings:
  - 무덤
  - 죽음
  rationale: 히브리어 사상 세계의 죽은 자의 영역이라는 이미지를 보존하는 것이 본문의 시적 긴장과 POB의 원문 우선 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §1, 원문 이미지 보존
