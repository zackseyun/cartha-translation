base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
  footnotes:
  - marker: a
    text: Or 'like the grave'; 'Sheol' refers to the realm of the dead in Hebrew thought.
    reason: lexical_alternative
  - marker: b
    text: Or 'and intact' or 'and sound'; the Hebrew can denote completeness or wholeness here.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그들을 스올[a]처럼 산 채로, 구덩이로 내려가는 자들처럼 온전한[b] 채로 삼켜 버리자.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’. ‘스올’은 히브리어 사상에서 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온전하게’, ‘흠 없이’. 히브리어는 여기서 완전함이나 온전함을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
