id: PRO.1.10
reference: Proverbs 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
  footnotes:
  - marker: a
    text: Or 'do not yield' / 'do not be willing.' The Hebrew verb means to be willing or to consent.
    reason: lexical_alternative
  - marker: b
    text: '''My son'' preserves the masculine singular form of the Hebrew; the address is a fatherly wisdom appeal.'
    reason: cultural_note
translation:
  language: ko
  text: 내 아들아[a], 죄인들이 너를 유혹하면[b] 따르지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 남성 단수 호칭을 반영한 표현입니다. 지혜문학의 아버지-아들 훈계 형식을 살립니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사 פתה는 ‘유혹하다, 꾀다’의 뜻으로, 단순한 설득보다 도덕적 함의를 지닌 유혹을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자식아
  - 내 아이야
  lexicon: HALOT
  rationale: 지혜문학의 부성적 훈계 호칭을 살리기 위해 직역에 가깝게 옮겼으며, 남성 단수 호칭이라는 형태도 반영했습니다.
- source_word: יְפַתּוּךָ
  english_pob_choice: entice you
  chosen_korean: 너를 유혹하면
  alternatives_korean:
  - 너를 꾀하면
  - 너를 설득하면
  lexicon: HALOT
  rationale: פתה의 ‘유혹하다/꾀다’는 조작적이고 도덕적 경고가 있는 뜻을 담아, 문맥상 가장 자연스러운 한국어로 옮겼습니다.
- source_word: חַטָּאִים
  english_pob_choice: sinners
  chosen_korean: 죄인들이
  alternatives_korean:
  - 죄인들
  - 죄를 짓는 자들이
  lexicon: HALOT
  rationale: 명사화된 복수형을 그대로 받아, 죄에 의해 규정되는 사람들을 가리키는 직접적 표현으로 옮겼습니다.
- source_word: תֹּבֵא
  english_pob_choice: consent
  chosen_korean: 따르지 마십시오
  alternatives_korean:
  - 동의하지 마십시오
  - 응하지 마십시오
  - 허락하지 마십시오
  lexicon: HALOT
  rationale: אבה의 핵심 의미는 ‘기꺼이 하다/동의하다’이므로, 단순한 감정이 아니라 실제로 그 제안에 몸을 싣는 행위를 금하는 뜻을 한국어 동사구로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 훈계문의 직접적 금지 표현의 강도
  chosen_reading: ‘따르지 마십시오’로 번역해 유혹에 대한 내적 동의와 외적 추종을 함께 금하는 경고로 읽었습니다.
  alternative_readings:
  - 동의하지 마십시오
  - 응하지 마십시오
  rationale: 히브리어 동사 אבה는 단순한 수동적 청취보다 ‘의지하여 받아들이는 것’을 포함하므로, 한국어에서도 단호한 거절로 전달하는 것이 문맥에 맞습니다.
  doctrine_reference: 지혜문학의 도덕적 훈계와 인간의 책임 반응
