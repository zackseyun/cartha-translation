source:
  edition: WLC
  text: יִשְׁמַ֣ע חָ֭כָם וְ/י֣וֹסֶף לֶ֑קַח וְ֝/נָב֗וֹן תַּחְבֻּל֥וֹת יִקְנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
  footnotes:
  - marker: a
    text: Or 'he will hear ... and gain'; the Hebrew imperfect verbs can be read more descriptively, but here they are rendered exhortational in keeping with the instructional setting.
    reason: alternative_reading
  - marker: b
    text: '''Guidance'' translates a term that can also mean ''wise counsel,'' ''direction,'' or, more literally, ''steering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 이는 듣고[a] 배움을 더하고, 분별력 있는 이는 지침을 얻습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 일반적 또는 미래의 진술로도, 이 교훈적 문맥에서는 권면적 호소로도 이해할 수 있습니다. 본문은 한국어 격언체의 일반적 진술로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘지침’은 ‘지혜로운 조언’, ‘인도’, 또는 문자적으로 ‘조타·항해술’을 뜻할 수도 있는 단어를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  english_pob_choice: Let ... hear
  chosen_korean: 듣고
  alternatives_korean:
  - 들으십시오
  - 들을 것입니다
  - 들으라
  lexicon: HALOT
  rationale: 히브리어 미완료형이 잠언의 교훈적 문맥에서는 권면적 뉘앙스로 읽히므로, 한국어에서는 명령형보다 자연스러운 연결형 '듣고'로 옮겨 권면의 힘을 살렸습니다.
- source_word: לֶקַח
  english_pob_choice: learning
  chosen_korean: 학식
  alternatives_korean:
  - 배움
  - 교훈
  - 가르침
  lexicon: HALOT
  rationale: 문맥상 '듣고 더한다'는 흐름에서, 단순히 받는 '가르침'보다 습득된 지식과 훈련을 아우르는 '학식'이 자연스럽습니다.
- source_word: תַּחְבֻּל֥וֹת
  english_pob_choice: guidance
  chosen_korean: 길잡이
  alternatives_korean:
  - 지침
  - 지혜로운 조언
  - 방향
  lexicon: HALOT
  rationale: 이 단어의 '방향 잡기, 항해술, 지략'이라는 비유적 폭을 살리면서도, 잠언 문맥에서 추상적 '전략'보다 실질적으로 이끄는 뜻이 드러나는 '길잡이'를 택했습니다.
theological_decisions:
- issue: 지혜문학의 직설적 권면을 한국어에서 어떻게 살릴지
  chosen_reading: 미래형보다 권면적 현재/명령의 뉘앙스를 살려, 지혜로운 사람과 분별 있는 사람이 지금 듣고 더하는 형식으로 번역했습니다.
  alternative_readings:
  - 지혜로운 사람은 들을 것입니다
  - 지혜로운 사람이 듣고 더할 것입니다
  rationale: 히브리어 미완료형은 문법적으로 미래/일반적 진술도 가능하지만, 문맥상 교육적 권면이 핵심이므로 독자에게 즉각적인 순종을 촉구하는 느낌을 유지하는 것이 더 충실합니다.
  doctrine_reference: 잠언의 교훈적 형식과 지혜 습득의 책임성
