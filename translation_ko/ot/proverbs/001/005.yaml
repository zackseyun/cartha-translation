  source_fidelity: 히브리어의 두 미완료형은 문맥상 권면적으로 이해될 수도 있고 일반적·기대의 진술로도 이해될 수 있습니다. 한국어의 격언적 현재 서술은 이 범위를 무리 없이 보존합니다. לֶקַח은 이미 갖춘 ‘학식’보다는 계속 받아 더하는 ‘배움’이 더 정확하며, תַּחְבֻּלוֹת은 사람이나 도구를 가리키기 쉬운 ‘길잡이’보다 ‘지침’으로 옮기는 편이 적절합니다.
