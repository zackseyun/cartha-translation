id: PRO.1.27
reference: Proverbs 1:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/בֹ֤א כ/שאוה פַּחְדְּ/כֶ֗ם וְֽ֭/אֵידְ/כֶם כְּ/סוּפָ֣ה יֶאֱתֶ֑ה בְּ/בֹ֥א עֲ֝לֵי/כֶ֗ם צָרָ֥ה וְ/צוּקָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
  footnotes:
  - marker: a
    text: Or 'like devastation' for 'like a storm'; the Hebrew term can emphasize destructive ruin as well as the crashing force of a storm.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 두려움이 폭풍처럼 닥쳐오고, 너희의 재앙이 회오리바람처럼 이르며, 환난과 곤경이 너희 위에 닥칠 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 כְּשָׁאוָה는 ‘폭풍’뿐 아니라 파괴적 ‘재앙/폐허’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  english_pob_choice: when ... comes
  chosen_korean: '...이 닥쳐올 때'
  alternatives_korean:
  - '...이 올 때'
  - '...이 이르러'
  lexicon: WLC
  rationale: 시간을 나타내는 ב + 부정사구를 한국어 종속절로 자연스럽게 옮기되, 시적 문맥의 급작스러움을 살려 ‘닥쳐올 때’로 처리했습니다.
- source_word: כְּשָׁאוָה
  english_pob_choice: like a storm
  chosen_korean: 폭풍처럼
  alternatives_korean:
  - 재앙처럼
  - 파괴처럼
  lexicon: HALOT
  rationale: 히브리어가 파괴적 붕괴의 이미지도 담지만, POB의 영어 해석처럼 뒤의 ‘회오리바람’과 병행되는 강한 자연재난 이미지를 살려 ‘폭풍처럼’으로 옮겼습니다.
- source_word: פַּחְדְּכֶם
  english_pob_choice: your dread
  chosen_korean: 너희의 두려움
  alternatives_korean:
  - 너희의 공포
  - 너희가 두려워하는 것
  lexicon: HALOT
  rationale: 문맥상 감정 상태인 ‘fear/dread’가 자연스럽고, 대상어를 덧붙이지 않는 직역성을 유지하면서도 현대 한국어에서 가장 무리 없는 ‘두려움’을 선택했습니다.
- source_word: וְאֵידְכֶם
  english_pob_choice: and your calamity
  chosen_korean: 너희의 재앙
  alternatives_korean:
  - 너희의 재난
  - 너희의 파멸
  lexicon: HALOT
  rationale: אֵיד는 ‘재앙/재난/멸망’ 계열로, 시어의 무게를 살리면서도 한국어 성경 문체에 맞는 ‘재앙’을 채택했습니다.
- source_word: כְּסוּפָה
  english_pob_choice: like a whirlwind
  chosen_korean: 회오리바람처럼
  alternatives_korean:
  - 폭풍처럼
  - 회오리처럼
  lexicon: HALOT
  rationale: סוּפָה는 격렬한 바람storm/whirlwind을 가리키므로, POB의 ‘whirlwind’에 맞춰 ‘회오리바람처럼’이 가장 직접적입니다.
theological_decisions:
- issue: 지혜문학의 경고문장 톤
  chosen_reading: 예언적 선언이 아니라 경고의 조건절로 읽어, 직접적인 미래형보다 ‘...할 때’ 구조로 옮겼습니다.
  alternative_readings:
  - 직설적 미래 선언으로 옮김
  - 명령/권고 문장처럼 처리
  rationale: 본절은 악인의 종말을 경고하는 지혜문학적 진술이므로, 원문의 시간표시와 결과적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 잠언 1장의 지혜-경고 문맥
