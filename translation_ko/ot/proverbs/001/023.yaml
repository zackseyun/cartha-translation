id: PRO.1.23
reference: Proverbs 1:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
  footnotes:
  - marker: a
    text: Or 'Return to my reproof' or 'Repent at my rebuke.'
    reason: lexical_alternative
  - marker: b
    text: '''My spirit'' may also be understood as ''my mind'' or ''my inner thought''; some readers see a broader canonical resonance with God''s Spirit, though the verse itself presents personified Wisdom speaking.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 내 책망을 듣고 돌이키십시오.[a] 보십시오, 내가 내 영을 너희에게 쏟아 내고[b] 내 말을 너희에게 알게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 책망을 받고 돌이키십시오’ 또는 ‘내 책망에 응답하여 회개하십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 영’은 ‘내 마음’ 또는 ‘내 속마음’으로도 이해할 수 있습니다. 일부 독자는 더 넓은 정경적 울림으로 하나님의 영을 떠올릴 수 있지만, 이 절 자체는 인격화된 지혜의 발화를 제시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  english_pob_choice: Turn
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌이키십시오
  - 전환하십시오
  - 회개하십시오
  lexicon: HALOT
  rationale: שׁוּב의 핵심 이미지인 ‘돌아감’을 살리면서, 지혜의 책망에 응답하는 권면으로 자연스럽게 들리도록 옮겼습니다. ‘회개하십시오’는 신학적 무게를 더 강하게 불러와 원문보다 넓을 수 있어 피했습니다.
- source_word: לְתוֹכַחְתִּי
  english_pob_choice: at my rebuke
  chosen_korean: 내 책망에
  alternatives_korean:
  - 내 꾸지람에
  - 내 훈계에
  - 내 책망을 듣고
  lexicon: HALOT
  rationale: תּוֹכַחַת는 책망/꾸지람/교정의 뜻이 있으므로, 지혜가 주는 경고와 교정의 뉘앙스를 담는 ‘책망’이 가장 균형적입니다. ל의 반응·대응 관계는 한국어 조사 ‘에’로 자연스럽게 표현했습니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 마음
  - 내 숨결
  - 내 속마음
  lexicon: HALOT
  rationale: רוח의 의미 범위가 넓지만, 문맥상 지혜의 내적 생명력과 발화를 가리키므로 ‘영’이 가장 직역에 가깝습니다. 인격화된 지혜의 말이므로 대문자화나 성령으로의 동일시는 피했습니다.
- source_word: אוֹדִיעָה דְבָרַי
  english_pob_choice: I will make my words known
  chosen_korean: 내 말을 … 알려 주겠습니다
  alternatives_korean:
  - 내 말을 … 알게 하겠습니다
  - 내 말을 … 드러내겠습니다
  - 내 말을 … 선포하겠습니다
  lexicon: HALOT
  rationale: ידע의 사역형을 살려 ‘알려 주다’로 옮겼고, דברי는 지혜문맥에 맞게 ‘말’로 자연스럽게 표현했습니다. ‘선포하다’는 너무 공적이고, ‘드러내다’는 의미가 다소 넓어져 배제했습니다.
theological_decisions:
- issue: 지혜가 말하는 ‘내 영’의 정체
  chosen_reading: 본문은 인격화된 지혜가 자기의 ‘영’을 부어 주겠다고 말하는 것으로 옮기되, 이를 곧바로 하나님의 성령으로 동일시하지 않았습니다.
  alternative_readings:
  - 하나님의 성령에 대한 예표로 읽기
  - 지혜의 마음/생각으로 완화해 읽기
  rationale: 히브리어 원문과 바로 앞뒤 문맥은 지혜의 화자를 전면에 두고 있으므로, 본문의 문학적 의미를 보존하는 번역이 우선입니다. 다만 정경적 연관 가능성은 남겨 두되 번역문 자체에서 교리적으로 확정하지 않았습니다.
  doctrine_reference: 문학적 1차 의미를 보존하고, 정경적 적용은 주석과 독서의 몫으로 남깁니다.
