revisions:
- from: 이러한 길은 불의를 통한 이익을 얻는 모든 사람의 길이며, 그것은 그 소유자들의 생명을 빼앗습니다.
  to: 부당한 이익을 얻는 모든 이의 길도 이와 같으니, 그러한 이익은 그것을 얻은 이들의 생명을 빼앗습니다.
  rationale: The revision retains the metaphor of paths, the universal scope, and the warning that wrongful gain destroys those who possess it. It replaces the awkward repeated noun phrase and explicitly identifies 'gain' as the destructive subject, avoiding a Korean pronoun antecedent shift. No footnote is required because the translation states the main contextual reading directly and no textual variant is being asserted.
  reviewer_model: gpt-5.6-terra
