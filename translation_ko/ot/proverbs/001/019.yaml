  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
  footnotes:
  - marker: a
    text: Or, 'Such are the ways of everyone who is greedy for gain; it takes away the life of those who possess it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 길은 불의를 통한 이익을 얻는 모든 사람의 길이며, 그것은 그 소유자들의 생명을 빼앗습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: Such are
  chosen_korean: 이러한
  alternatives_korean:
  - 그러한
  - 이와 같은
  lexicon: HALOT
  rationale: 앞절의 경고를 요약하며 비교를 여는 지시어로 보아, 한국어에서는 서술을 자연스럽게 받는 형용사형 ‘이러한’이 적절합니다.
- source_word: בֹּצֵעַ בָּצַע
  english_pob_choice: gains unjust profit
  chosen_korean: 불의를 통한 이익을 얻는
  alternatives_korean:
  - 부당한 이익을 탐하는
  - 부정한 이익을 얻는
  - 탐욕으로 이익을 추구하는
  lexicon: HALOT
  rationale: בֹּצֵעַ בָּצַע의 중첩은 단순한 이익이 아니라 윤리적으로 일그러진 이익 추구를 가리키므로, 문맥에 맞게 ‘불의를 통한 이익을 얻는’으로 옮겨 탐욕과 부당성을 함께 드러냈습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: the life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 영혼
  - 삶
  lexicon: HALOT
  rationale: 잠언 문맥에서 נֶפֶשׁ은 비물질적 ‘영혼’보다 실제 생명 자체를 가리키므로, 경고의 파괴성을 분명히 하는 ‘생명’이 가장 적절합니다.
- source_word: בְּעָלָיו
  english_pob_choice: its possessors
  chosen_korean: 그 소유자들의
  alternatives_korean:
  - 그것을 가진 이들의
  - 그 소유자들의
  - 그 주인들의
  lexicon: HALOT
  rationale: 선행사는 앞의 ‘이익’으로 보는 것이 자연스러워, ‘그 소유자들’로 처리해 문맥과 소유 관계를 간결하게 살렸습니다.
