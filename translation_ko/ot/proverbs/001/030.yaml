source:
  edition: WLC
  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
  footnotes:
  - marker: a
    text: Or 'They would not accept my counsel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they spurned all my correction' or 'all my rebuke.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 권고를 받아들이려 하지 않았고, 내 모든 책망을 멸시하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 권고를 원치 않았다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 모든 교정을 멸시하였다’ 또는 ‘내 모든 꾸지람을 멸시하였다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ לַעֲצָתִי
  english_pob_choice: were unwilling to accept my counsel
  chosen_korean: 내 권고를 받아들이려 하지 않았고
  alternatives_korean:
  - 내 권고를 거절하였고
  - 내 조언을 받아들이지 않았고
  - 내 권고를 원치 않았고
  lexicon: HALOT
  rationale: אָבוּ는 단순한 부정이 아니라 의지적 비수용을 나타내므로, 한국어에서는 ‘받아들이려 하지 않았다’로 무르게가 아닌 의사 거부의 뉘앙스를 살렸습니다. עֵצָה는 ‘조언’도 가능하지만 지혜문학의 격식과 무게를 살려 ‘권고’로 옮겼습니다.
- source_word: נָאֲצוּ
  english_pob_choice: despised
  chosen_korean: 멸시하였습니다
  alternatives_korean:
  - 경멸하였습니다
  - 업신여겼습니다
  - 가볍게 여겼습니다
  lexicon: HALOT
  rationale: נָאַץ는 단순 거절보다 강한 경멸적 배척을 뜻하므로, ‘멸시하다’가 가장 직설적으로 대응합니다.
- source_word: תּוֹכַחְתִּי
  english_pob_choice: my reproof
  chosen_korean: 내 모든 책망
  alternatives_korean:
  - 내 모든 훈계
  - 내 모든 꾸지람
  - 내 모든 교정
  lexicon: HALOT
  rationale: תּוֹכַחַת은 훈계·책망·시정의 의미를 가지며, 여기서는 지혜의 훈육적 어조를 살리기 위해 ‘책망’으로 옮겼습니다. ‘모든’은 כָּל의 총괄성을 반영합니다.
theological_decisions:
- issue: 지혜의 음성이 단순 정보 전달이 아니라 도덕적 권위 있는 훈계로 들리도록 할 것인지
  chosen_reading: ‘권고’와 ‘책망’을 함께 사용해, 지혜가 제시하는 말이 단순한 조언이 아니라 받아들여야 할 권위 있는 교훈임을 드러냈습니다.
  alternative_readings:
  - ‘조언’과 ‘교정’을 사용해 더 중립적으로 옮길 수 있음
  - ‘훈계’와 ‘꾸지람’을 사용해 더 직접적으로 옮길 수 있음
  rationale: 잠언의 문맥에서 화자는 지혜이므로, 한국어에서 너무 일상적인 ‘조언’보다 ‘권고/책망’이 경고성과 권위를 더 잘 보존합니다.
  doctrine_reference: 지혜문학의 훈계와 책망의 권위
