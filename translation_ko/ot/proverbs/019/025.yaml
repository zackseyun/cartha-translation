id: PRO.19.25
reference: Proverbs 19:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ֣ץ תַּ֭כֶּה וּ/פֶ֣תִי יַעְרִ֑ם וְ/הוֹכִ֥יחַ לְ֝/נָב֗וֹן יָבִ֥ין דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
  footnotes:
  - marker: a
    text: Or 'mocker' for 'scoffer.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the simple will learn prudence.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a discerning man'; rendered 'one who has understanding' to preserve the singular personal sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱하는 자를 치면, 미숙한 자는 슬기로워지고, 분별 있는 자를 꾸짖으면 그는 지식을 얻습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  english_pob_choice: scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: 지혜문맥의 לֵץ는 단순한 농담꾼이 아니라 경멸적으로 조롱하는 사람을 가리키므로, 한국어에서도 행위를 드러내는 표현으로 옮겼습니다.
- source_word: פֶתִי
  english_pob_choice: the simple
  chosen_korean: 미련한 자
  alternatives_korean:
  - 단순한 자
  - 순진한 자
  lexicon: HALOT
  rationale: 잠언의 פֶתִי는 미숙하고 분별이 부족한 인물을 뜻하므로, 한국어 지혜문학 관용에 맞는 '미련한 자'를 택했습니다.
- source_word: יַעְרִם
  english_pob_choice: will become shrewd
  chosen_korean: 슬기로워지고
  alternatives_korean:
  - 지혜로워지고
  - 신중해지고
  lexicon: HALOT
  rationale: 동사 ערם의 문맥상 의미를 결과 상태로 자연스럽게 살려, '슬기로워지고'로 옮겼습니다.
- source_word: וְהוֹכִיחַ לְנָבוֹן
  english_pob_choice: rebuke one who has understanding
  chosen_korean: 깨닫는 자를 꾸짖으면
  alternatives_korean:
  - 분별 있는 자를 꾸짖으면
  - 이해하는 자를 책망하면
  lexicon: HALOT
  rationale: נבון은 이해력이 있는 사람을 가리키므로, 한국어에서는 자연스럽고 개인 지칭이 분명한 '깨닫는 자'로 옮겼습니다. '꾸짖다'는 הוכיח의 교정·책망 기능을 반영합니다.
- source_word: יָבִין דָּעַת
  english_pob_choice: he will gain knowledge
  chosen_korean: 지식을 얻습니다
  alternatives_korean:
  - 지식을 깨닫습니다
  - 지식을 이해합니다
  lexicon: HALOT
  rationale: דעת는 잠언의 표준적 '지식'이며, יָבִין은 여기서 결과적으로 그것을 '얻다/깨닫다'는 뜻이므로 '지식을 얻습니다'가 가장 자연스럽습니다.
