  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֖יחַ כְּזָבִ֣ים יֹאבֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
  footnotes:
  - marker: a
    text: Or 'will not be acquitted' / 'will not be held innocent.' The Hebrew verb can emphasize either lack of acquittal or the certainty of punishment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'breathes out lies.' The expression pictures lies flowing out as readily as breath.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓 증인은 형벌을 면하지 못하고, 거짓을 내뿜는 자는 멸망합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형벌을 면하지 못하고’는 히브리어 동사의 뜻을 따라 처벌을 피하지 못한다는 의미를 드러낸 번역입니다. 다른 가능성으로는 ‘무죄로 인정받지 못하고’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓을 내뿜는 자’는 히브리어의 생생한 비유를 살린 표현으로, 거짓말이 숨처럼 쉽게 흘러나온다는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  english_pob_choice: false witness
  chosen_korean: 거짓 증인
  alternatives_korean:
  - 거짓된 증인
  - 거짓말하는 증인
  lexicon: HALOT
  rationale: 증언의 법정적 성격을 살리면서 שְׁקָרִים의 '거짓/허위'를 자연스러운 합쇼체 한국어로 압축했습니다.
- source_word: לֹא יִנָּקֶה
  english_pob_choice: will not go unpunished / will not be acquitted
  chosen_korean: 형벌을 면하지 못하고
  alternatives_korean:
  - 죄 없다고 판정받지 못하고
  - 무죄로 인정받지 못하고
  lexicon: HALOT
  rationale: נקה가 '깨끗하다, 면제되다, 무죄로 인정되다'의 폭을 가지지만, 잠언의 경고문맥에서는 처벌을 피하지 못한다는 결과가 핵심이어서 그 의미를 드러냈습니다.
- source_word: וְיָפִיחַ כְּזָבִים
  english_pob_choice: and one who breathes out lies
  chosen_korean: 거짓을 내뿜는 자
  alternatives_korean:
  - 거짓을 내쉬는 자
  - 거짓말을 쏟아내는 자
  lexicon: HALOT
  rationale: פוח의 생생한 '숨을 내뿜다' 이미지를 살려, 말이 호흡처럼 쉽게 흘러나오는 뉘앙스를 한국어로 옮겼습니다.
- source_word: יֹאבֵד
  english_pob_choice: will perish
  chosen_korean: 멸망합니다
  alternatives_korean:
  - 망합니다
  - 소멸합니다
  lexicon: HALOT
  rationale: 어휘상 단순한 '없어지다'보다 파멸의 종결을 드러내는 동사로 옮기되, 지혜문학의 경고 어조에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: 잠언의 보응 경고를 어떻게 한국어에서 전달할지
  chosen_reading: 법적·도덕적 책임이 실제 형벌과 파멸로 이어진다는 경고를 분명히 살렸습니다.
  alternative_readings:
  - 도덕적으로 용납되지 않는다는 약한 표현
  - 단순한 평판 손상으로 완화하는 표현
  rationale: 본문은 단순한 사회적 비난이 아니라, 거짓 증언과 거짓말이 야훼의 도덕 질서 아래에서 실제 심판을 받는다는 지혜문학적 경고를 말합니다.
  doctrine_reference: 잠언의 보응 원리
