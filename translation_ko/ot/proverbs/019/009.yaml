source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֖יחַ כְּזָבִ֣ים יֹאבֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
  footnotes:
  - marker: a
    text: Or 'will not be acquitted' / 'will not be held innocent.' The Hebrew verb can emphasize either lack of acquittal or the certainty of punishment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'breathes out lies.' The expression pictures lies flowing out as readily as breath.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓 증인은 형벌을 면하지 못하고[a], 거짓을 내뿜는 자는[b] 멸망합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형벌을 면하지 못하고’는 히브리어 동사의 뜻을 따라 처벌을 피하지 못한다는 의미를 드러낸 번역입니다. 다른 가능성으로는 ‘무죄로 인정받지 못하고’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓을 내뿜는 자’는 히브리어의 생생한 비유를 살린 표현으로, 거짓말이 숨처럼 쉽게 흘러나온다는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  english_pob_choice: false witness
  chosen_korean: 거짓 증인
  alternatives_korean:
