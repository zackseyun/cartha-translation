  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
  footnotes:
  - marker: a
    text: Or 'will not be acquitted' / 'will not be held innocent.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'breathes out lies,' an image for speaking lies continually or freely; alternatively, 'utters lies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓 증인은 형벌을 면하지 못하며, 거짓을 내뿜는 자도 피하지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄로 인정받지 못하며’ / ‘무죄로 여기지 못합니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘거짓을 내뿜는’이라는 생생한 이미지를 사용합니다. 또 다른 가능성으로는 ‘거짓을 말하는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  english_pob_choice: a false witness
  chosen_korean: 거짓 증인
  alternatives_korean:
  - 거짓말하는 증인
  - 거짓 증언을 하는 증인
  lexicon: HALOT
  rationale: 법정적 증언의 성격을 살리면서도 현대 한국어에서 자연스러운 관용 표현으로 옮겼습니다.
- source_word: לֹא יִנָּקֶה
  english_pob_choice: will not go unpunished
  chosen_korean: 형벌을 면하지 못하며
  alternatives_korean:
  - 무죄로 인정받지 못하며
  - 벌을 면하지 못하며
  lexicon: HALOT
  rationale: נקה의 결과를 한국어로 자연스럽게 드러내기 위해 ‘형벌을 면하다’로 옮겼고, 법정적·윤리적 뉘앙스를 함께 담았습니다.
- source_word: וְיָפִיחַ כְּזָבִים
  english_pob_choice: one who breathes out lies
  chosen_korean: 거짓을 내뿜는 자
  alternatives_korean:
  - 거짓을 내쉬는 자
  - 거짓을 말해 내는 자
  lexicon: HALOT
  rationale: ‘숨을 내뿜다’의 생생한 이미지를 살리되, 한국어에서 이해가 자연스럽도록 ‘내뿜는’으로 옮겼습니다.
- source_word: יִמָּלֵט
  english_pob_choice: will not escape
  chosen_korean: 피하지 못합니다
  alternatives_korean:
  - 도망치지 못합니다
  - 벗어나지 못합니다
  lexicon: HALOT
  rationale: 문맥상 처벌과 책임을 피하지 못한다는 뜻을 현대 한국어로 자연스럽게 전달하기 위해 ‘피하지 못합니다’로 옮겼습니다.
theological_decisions:
- issue: 법정적 경고의 반복 구조
  chosen_reading: 두 행을 모두 미래 부정으로 맞추어, 거짓 증언과 거짓 발화 모두 반드시 심판을 받는다는 경고를 분명히 했습니다.
  alternative_readings:
  - 첫 행은 선언문처럼, 둘째 행은 일반 진술처럼 옮기는 방식
  rationale: 히브리어 평행법이 강조하는 확실성을 한국어에서도 유지하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 잠언의 지혜문학적 경고와 보응 원리
