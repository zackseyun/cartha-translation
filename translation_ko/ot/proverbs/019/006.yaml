id: PRO.19.6
reference: Proverbs 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַ֭בִּים יְחַלּ֣וּ פְנֵֽי נָדִ֑יב וְ/כָל הָ֝/רֵ֗עַ לְ/אִ֣ישׁ מַתָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
  footnotes:
  - marker: a
    text: Or 'Many entreat the face of a nobleman.' The Hebrew נָדִיב can mean 'nobleman' or 'prince,' but here 'generous man' fits the proverb's focus on gift-giving and social favor.
    reason: lexical_alternative
  - marker: b
    text: Literally 'everyone is a friend to a man of gifts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 귀인의 호의를 구하고, 선물을 주는 사람에게는 모두가 친구가 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 많은 이
  lexicon: HALOT
  rationale: 속담체의 간결한 복수 주어를 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: יְחַלּוּ פְנֵי
  english_pob_choice: seek the favor of
  chosen_korean: 호의를 구하고
  alternatives_korean:
  - 얼굴을 간청하고
  - 얼굴 앞에 간청하고
  - 호의를 청하고
  lexicon: HALOT
  rationale: 직역하면 '얼굴을 구하다'이지만, 관용적으로는 누군가의 호의나 호감을 구하는 뜻이므로 한국어에서는 그 관용적 의미를 살렸습니다.
- source_word: נָדִיב
  english_pob_choice: a generous man / noble man
  chosen_korean: 귀인
  alternatives_korean:
  - 후한 사람
  - 고귀한 사람
  - 유력한 사람
  lexicon: HALOT
  rationale: 문맥상 단순한 신분보다 선물과 호의가 오가는 사회적 지위를 가리키므로, 한국어로는 '귀인'이 가장 압축적으로 대응합니다.
- source_word: אִישׁ מַתָּן
  english_pob_choice: a man who gives gifts
  chosen_korean: 선물을 주는 사람
  alternatives_korean:
  - 선물의 사람
  - 선물하는 사람
  - 선물 주는 자
  lexicon: HALOT
  rationale: 직역보다 속담의 의미를 분명하게 드러내는 표현으로, 'gift-giver'의 의미를 자연스럽게 옮겼습니다.
