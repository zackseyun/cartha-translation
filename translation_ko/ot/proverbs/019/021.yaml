id: PRO.19.21
reference: Proverbs 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
  footnotes:
  - marker: a
    text: Or 'thoughts' or 'intentions' for 'plans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 마음에는 계획이 많지만, 야훼의 뜻은 반드시 서게 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבּוֹת מַחֲשָׁבוֹת
  english_pob_choice: Many are the plans
  chosen_korean: 계획이 많지만
  alternatives_korean:
  - 생각이 많지만
  - 의도가 많지만
  - 생각거리가 많지만
  lexicon: HALOT
  rationale: 지혜문맥에서 מַחֲשָׁבוֹת는 단순한 내적 ‘생각’보다 의도된 구상이나 계획을 가리키므로, 한국어도 핵심 의미를 살린 ‘계획’으로 옮겼습니다.
- source_word: בְּלֶב אִישׁ
  english_pob_choice: in a man's heart
  chosen_korean: 사람의 마음에는
  alternatives_korean:
  - 한 남자의 마음에는
  - 남자의 마음에는
  - 사람의 심장에는
  lexicon: HALOT
  rationale: לב는 히브리 인간론에서 사고와 의지의 중심이므로 ‘마음’이 적절하며, אִישׁ의 대표성을 살리되 한국어에서는 자연스럽게 ‘사람’으로 풀어 읽었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 옮겨, 본문의 고유한 하나님의 이름을 유지했습니다.
- source_word: תָקוּם
  english_pob_choice: will stand
  chosen_korean: 반드시 서게 됩니다
  alternatives_korean:
  - 서게 됩니다
  - 굳게 섭니다
  - 지속됩니다
  lexicon: HALOT
  rationale: קום은 여기서 ‘일어나다’보다 ‘서다/굳게 서다’의 의미가 핵심이므로, 결과의 확실성을 드러내는 ‘반드시 서게 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 인간의 계획과 하나님의 뜻의 대비
  chosen_reading: 많은 인간의 계획이 존재하지만, საბოლო적으로 성립하는 것은 야훼의 뜻이라는 대비를 살렸습니다.
  alternative_readings:
  - 하나님의 뜻만 실제로 일어난다는 더 강한 결정론적 표현
  - 인간 계획을 단순 무가치하게 만드는 표현
  rationale: 잠언은 인간 계획의 다수성과 야훼의 뜻의 지속성을 대조하지만, 원문이 허용하는 범위를 넘어 원인론을 과도하게 체계화하지는 않습니다.
  doctrine_reference: 잠언의 지혜적 대비를 유지하고, 본문이 말하는 범위 이상으로 결정론을 덧붙이지 않음
