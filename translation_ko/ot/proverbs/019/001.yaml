id: PRO.19.1
reference: Proverbs 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
  footnotes:
  - marker: a
    text: Or, 'than a fool who is crooked in speech.' The Hebrew syntax allows the final phrase 'and he is a fool' to identify the contrasted person more compactly.
    reason: alternative_reading
  - marker: b
    text: Literally, 'walks in his integrity.' 'Walk' is a Hebrew metaphor for one's manner of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람이 자신의 온전함으로 걸어가는 것이, 입술이 비뚤어지고 어리석은 사람보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘입술이 비뚤어진 어리석은 사람보다 낫습니다.’ 히브리어 통사는 마지막 구절을 앞선 사람을 더 압축적으로 규정하는 방식으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘걷다’는 히브리어에서 삶의 방식이나 행위를 가리키는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - …하는 것이 더 좋습니다
  - 좋습니다
  lexicon: HALOT
  rationale: 지혜문학의 비교격언 형식을 자연스러운 현대 한국어 비교 표현으로 옮겼습니다.
- source_word: רָשׁ
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 빈곤한 사람
  lexicon: HALOT
  rationale: 형식상 남성 단수이지만, 한국어에서는 성을 드러내지 않는 ‘가난한 사람’이 더 자연스럽고 문맥의 일반성을 잘 살립니다.
- source_word: הוֹלֵךְ בְּתֻמּוֹ
  english_pob_choice: who walks in his integrity
  chosen_korean: 자신의 온전함으로 걸어가는
  alternatives_korean:
  - 자신의 성실함 안에서 걷는
  - 자신의 무흠함으로 사는
  lexicon: HALOT
  rationale: ‘걷다’는 삶의 방식이라는 히브리어 은유를 보존했고, תֹּם/תֻם은 ‘온전함’으로 옮겨 도덕적 무결성과 전인적 성실함을 함께 담았습니다.
- source_word: עִקֵּשׁ שְׂפָתָיו
  english_pob_choice: one who is crooked in his speech
  chosen_korean: 입술이 비뚤어진 사람
  alternatives_korean:
  - 말이 비뚤어진 사람
  - 혀가 꼬인 사람
  lexicon: HALOT
  rationale: 직역하면 ‘입술’이지만, 한국어에서는 ‘입술이 비뚤어지다’보다 ‘입술이 비뚤어진 사람’이 원문 이미지와 도덕적 왜곡을 함께 전달합니다.
- source_word: וְהוּא כְסִיל
  english_pob_choice: and is a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 그리고 그는 어리석습니다
  - 곧 어리석은 사람입니다
  lexicon: HALOT
  rationale: 마지막 절은 왜곡된 말의 사람을 ‘어리석은 사람’으로 규정하는 종결부이므로, 한국어에서는 명사구로 정리해 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 'শেষ절의 통사 해석: ‘입술이 비뚤어진 사람’과 ‘어리석은 사람’의 관계'
  chosen_reading: 후자를 앞선 사람의 동일 인물 규정으로 읽어, 한 사람이 ‘입술이 비뚤어지고 어리석다’고 말했습니다.
  alternative_readings:
  - ‘입술이 비뚤어진 사람’과 ‘어리석은 사람’을 별개의 대비 대상로 읽는 해석
  rationale: 히브리어 구문은 마지막 절이 앞의 대상을 압축적으로 식별하는 방식이 가능하므로, 이 읽기를 본문 의미를 가장 직접적으로 드러내는 것으로 보았습니다.
  doctrine_reference: 잠언의 평행법과 히브리어 구문론
- issue: ‘walk’ 은유의 유지
  chosen_reading: 행위를 뜻하는 삶의 은유를 살려 ‘걸어가는’으로 옮겼습니다.
  alternative_readings:
  - ‘사는’으로 의역
  rationale: 원문은 단순한 존재 상태가 아니라 삶의 방식과 행로를 말하므로, 은유를 유지하는 편이 소스 충실도에 더 맞습니다.
  doctrine_reference: 히브리어 지혜문학의 관용적 은유
