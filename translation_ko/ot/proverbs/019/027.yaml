  - 내 자녀야
  lexicon: HALOT
  rationale: 지혜문학의 직접 호칭을 보존하면서, 한국어에서는 소유격을 반복하지 않아도 친밀한 권면으로 자연스럽게 들립니다.
- source_word: מוּסָר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 교훈
  - 가르침
  - 징계
  lexicon: HALOT
  rationale: 문맥상 지혜 훈련의 권면을 가리키므로, 단순 정보 전달보다 권면과 교정의 뉘앙스가 있는 '훈계'를 택했습니다.
- source_word: לִשְׁגּוֹת / מֵאִמְרֵי דָעַת
  english_pob_choice: to stray from the words of knowledge
  chosen_korean: 지식의 말씀에서 떠나지 말아라
  alternatives_korean:
  - 지식의 말씀에서 벗어나지 말아라
  - 지식의 말들에서 빗나가지 말아라
  lexicon: HALOT
  rationale: 히브리어의 압축된 구조를 한국어에서 자연스럽게 풀어, '떠나다'로 이탈의 결과를 분명히 하면서도 본문의 경고 의미를 유지했습니다.
theological_decisions:
- issue: 압축된 히브리어 구문의 관계
  chosen_reading: 권면은 '훈계를 듣는 일을 그치지 말라'는 뜻으로 이해해, 그 결과가 '지식의 말씀에서 떠나는 것'이 되도록 옮겼습니다.
  alternative_readings:
  - '''훈계를 듣지 않으면 지식의 말씀에서 떠나게 된다''는 조건/결과식 이해'
  - '''훈계를 들으려 하지 말라''는 반어적 경고'
  rationale: 영어 POB의 주석이 인정하듯 히브리어 구문은 압축되어 있으므로, 본문이 실제로 경고하는 바를 한국어로 분명하게 드러내되 해석을 과도하게 확정하지 않도록 했습니다.
  doctrine_reference: 지혜문학의 권면적 문체와 잠언의 교육적 경고 구조
