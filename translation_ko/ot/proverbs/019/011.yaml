id: PRO.19.11
reference: Proverbs 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
  footnotes:
  - marker: a
    text: Or 'A person's prudence makes him slow to anger.' The Hebrew literally says 'A man's insight lengthens his nose,' an idiom for patience.
    reason: lexical_alternative
  - marker: b
    text: Or 'to pass over a transgression.'
    reason: lexical_alternative
translation:
  language: ko
  text: 분별이 있는 사람은 성내기를 더디 하며, 허물을 넘어가는 것이 그의 영광입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “코를 길게 하다”라는 관용구로, 인내와 분노 억제를 뜻합니다.
    reason: source_note
  - marker: b
    text: 또는 “허물을 지나치다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  english_pob_choice: insight
  chosen_korean: 분별
  alternatives_korean:
  - 통찰
  - 지혜
  - 슬기
  lexicon: HALOT
  rationale: 행동을 절제하게 만드는 실천적 판단력을 가리키므로, 문맥상 자연스럽고 압축적인 '분별'로 옮겼습니다.
- source_word: הֶאֱרִיךְ אַפּוֹ
  english_pob_choice: makes him slow to anger
  chosen_korean: 성내기를 더디 하며
  alternatives_korean:
  - 노하기를 더디 하며
  - 화를 오래 참게 하며
  - 분노를 길게 하며
  lexicon: HALOT
  rationale: 히브리어의 직역인 '코를 길게 하다'는 관용구이므로, 현대 한국어에서 그 기능을 가장 자연스럽게 전달하는 '성내기를 더디 하다'를 택했습니다.
- source_word: וְתִפְאַרְתּוֹ
  english_pob_choice: and it is his glory
  chosen_korean: …그의 영광입니다
  alternatives_korean:
  - 그의 자랑입니다
  - 그의 아름다움입니다
  - 그의 명예입니다
  lexicon: HALOT
  rationale: תִפְאָרֶת의 의미 범위(아름다움, 영광, 명예) 가운데, 지혜문학의 평가 문맥에는 '영광'이 가장 잘 맞습니다.
- source_word: עֲבֹר עַל פָּשַׁע
  english_pob_choice: to overlook an offense
  chosen_korean: 허물을 넘어가는 것
  alternatives_korean:
  - 허물을 덮어두는 것
  - 죄를 지나치는 것
  - 허물을 용서하는 것
  lexicon: HALOT
  rationale: 동사는 '지나가다/지나쳐 가다'의 뜻이 핵심이므로, '용서하다'보다 덜 해석적인 '넘어가다'를 써서 원문의 표현을 살렸습니다.
theological_decisions:
- issue: פֶּשַׁע의 윤리적 무게를 어떻게 한국어로 드러낼지
  chosen_reading: '''허물''로 옮겨 개인 관계 안에서의 잘못을 가리키되, 문장의 요구는 보복하지 않고 지나치는 태도에 둡니다.'
  alternative_readings:
  - '''범죄'''
  - '''반역'''
  - '''죄과'''
  rationale: 이 속담은 법정적 반역보다 일상적 관계에서의 잘못을 염두에 두므로, 지나치게 강한 신학 용어를 피하면서도 도덕적 무게를 유지해야 합니다.
  doctrine_reference: 잠언의 지혜 윤리
