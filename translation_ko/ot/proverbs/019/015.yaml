base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
  footnotes:
  - marker: a
    text: 'Or ''a lazy soul will hunger.'' Hebrew: ''soul'' (נֶפֶשׁ) can mean the person or self in context.'
    reason: lexical_alternative
  - marker: b
    text: '''Slack person'' renders Hebrew רְמִיָּה here in the sense of negligence or slackness; elsewhere the word can carry the sense ''deceitful.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 게으름은 깊은 잠에 빠지게 하고, 태만한 사람은 배고프게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “태만한 영혼은 배고프게 됩니다.” 히브리어 נֶפֶשׁ은 문맥에 따라 사람이나 자기 자신을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “태만한 사람”은 여기서 רְמִיָּה를 소홀함이나 태만함의 뜻으로 옮긴 것입니다. 이 단어는 다른 문맥에서는 “속임”의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
