source:
  edition: WLC
  text: עַ֭צְלָה תַּפִּ֣יל תַּרְדֵּמָ֑ה וְ/נֶ֖פֶשׁ רְמִיָּ֣ה תִרְעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
  footnotes:
  - marker: a
    text: 'Or ''a lazy soul will hunger.'' Hebrew: ''soul'' (נֶפֶשׁ) can mean the person or self in context.'
    reason: lexical_alternative
  - marker: b
    text: '''Slack person'' renders Hebrew רְמִיָּה here in the sense of negligence or slackness; elsewhere the word can carry the sense ''deceitful.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 게으름은 깊은 잠에 빠지게 하고, 느슨한 사람은 배고프게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “게으른 사람의 영혼은 굶주린다.” 히브리어 נֶפֶשׁ은 문맥에 따라 사람/자기 자신을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “느슨한 사람”은 여기서 רְמִיָּה를 소홀함/느슨함의 뜻으로 옮긴 것입니다. 이 단어는 다른 문맥에서는 “속이는” 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַ֭צְלָה
  english_pob_choice: laziness
  chosen_korean: 게으름
  alternatives_korean:
  - 나태
  - 태만
  lexicon: HALOT
  rationale: 히브리어 명사는 여기서 게으름/나태의 태도를 가리키므로, 현대 한국어에서 가장 분명한 ‘게으름’으로 옮겼습니다.
- source_word: תַּפִּ֣יל תַּרְדֵּמָ֑ה
  english_pob_choice: brings on deep sleep
  chosen_korean: 깊은 잠에 빠지게 하고
  alternatives_korean:
  - 깊은 잠을 가져오고
  - 깊은 잠을 불러오고
  lexicon: HALOT
  rationale: 원문은 원인-결과 관계를 나타내는 사역형이므로, 자연스러운 한국어로 ‘빠지게 하다’라고 풀어 causative force를 살렸습니다.
- source_word: תַּרְדֵּמָה
  english_pob_choice: deep sleep
  chosen_korean: 깊은 잠
  alternatives_korean:
  - 깊은 졸음
  - 숙면
  lexicon: HALOT
  rationale: 단순한 졸림이 아니라 무거운 수면 상태를 뜻하므로 ‘깊은 잠’이 가장 직접적입니다.
- source_word: רְמִיָּה
  english_pob_choice: slack person
  chosen_korean: 느슨한 사람
  alternatives_korean:
  - 게으른 사람
  - 나태한 사람
  - 태만한 사람
  lexicon: HALOT
  rationale: 이 단어는 문맥상 ‘속이는’ 의미보다 ‘느슨하고 소홀한’ 의미가 맞으므로, 앞의 ‘게으름’과 완전히 겹치지 않게 ‘느슨한 사람’으로 옮겨 원문의 뉘앙스를 구분했습니다.
- source_word: תִרְעָֽב
  english_pob_choice: will go hungry
  chosen_korean: 배고프게 됩니다
  alternatives_korean:
  - 굶주리게 됩니다
  - 배고프게 될 것입니다
  lexicon: HALOT
  rationale: 동사의 결과 상태를 한국어 관용으로 자연스럽게 살리되, 과도하게 강한 ‘굶주리다’보다 원문의 일반적 결론을 반영해 ‘배고프게 됩니다’로 옮겼습니다.
