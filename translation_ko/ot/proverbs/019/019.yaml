source:
  edition: WLC
  text: גרל חֵ֭מָה נֹ֣שֵׂא עֹ֑נֶשׁ כִּ֥י אִם תַּ֝צִּ֗יל וְ/ע֣וֹד תּוֹסִֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
  footnotes:
  - marker: a
    text: Or, more literally, 'a possessor of wrath bears a penalty'; the Hebrew is compact and idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 분노를 품은 사람은 벌을 받습니다[a]. 그를 구해 주더라도, 또다시 그렇게 해야 할 뿐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 압축적으로 ‘분노의 소유자’에 가깝습니다. 영어 POB의 각주처럼, ‘분노를 지닌 사람’이라는 관용적 뜻을 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  english_pob_choice: A hot-tempered man
  chosen_korean: 분노를 품은 사람
  alternatives_korean:
  - 화를 잘 내는 사람
  - 성급한 사람
  - 격노한 사람
  lexicon: HALOT
  rationale: 히브리어는 ‘분노의 소유자/지닌 자’라는 압축된 관용구이므로, 직역의 어색함을 피하면서도 성격적 특징을 드러내는 표현으로 옮겼습니다. ‘분노를 품은’은 열의 이미지와 지속적 성향을 함께 살립니다.
- source_word: נֹשֵׂא
  english_pob_choice: bears
  chosen_korean: 벌을 받습니다
  alternatives_korean:
  - 벌을 짊어집니다
  - 벌을 지닙니다
  - 벌을 감당합니다
  lexicon: HALOT
  rationale: נשׂא의 ‘지다/감당하다’ 의미를 한국어에서 자연스럽게 풀어, 결과로서의 형벌을 실제로 받는다는 뜻을 분명히 했습니다. 잠언의 격언적 현재 의미도 살렸습니다.
- source_word: עֹנֶשׁ
  english_pob_choice: the penalty
  chosen_korean: 벌
  alternatives_korean:
  - 형벌
  - 처벌
  - 벌금
  lexicon: HALOT
  rationale: 문맥상 법적·실질적 불이익을 가리키므로 지나치게 특정한 ‘벌금’보다 넓은 ‘벌’이 적합합니다. 영어 POB의 ‘penalty’와도 대응됩니다.
- source_word: כִּי אִם תַּצִּיל וְעוֹד תּוֹסִיף
  english_pob_choice: for if you rescue him, you will only have to do it again
  chosen_korean: 그를 구해 주더라도, 또다시 그렇게 해야 할 뿐입니다
  alternatives_korean:
  - 그를 구해 주면, 또다시 그렇게 해야 합니다
  - 구해 주더라도 다시 구해야 할 뿐입니다
  - 그를 건져 주어도 또다시 덧붙이게 됩니다
  lexicon: HALOT
  rationale: 원문의 생략된 목적어와 반복성(‘다시’)을 한국어에서 자연스럽게 복원했습니다. ‘또다시 그렇게 해야 할 뿐입니다’는 반복 개입의 경고를 분명히 전하면서도 히브리어의 간결함을 유지합니다.
theological_decisions:
- issue: 잠언의 경구적 현재 시제와 조건문의 뉘앙스
  chosen_reading: 현재 일반 진술로 읽어, 한 사람의 성격과 그 결과가 반복적으로 드러난다는 뜻으로 번역했습니다.
  alternative_readings:
  - 미래형 경고로만 읽기
  - 특정 개인 사례로 한정하기
  rationale: 히브리어 분사와 조건 구조는 특정 사건 예보보다 일반적 지혜 진술을 형성합니다. 따라서 합쇼체로 옮기되 반복적 교훈이 살아나도록 했습니다.
  doctrine_reference: 잠언 문학의 일반적 지혜 진술
