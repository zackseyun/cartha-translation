  source_fidelity: 첫 구절의 히브리어 גְּדָל־חֵמָה는 단순히 ‘분노를 품은’ 사람이 아니라 ‘분노가 큰/몹시 화를 내는’ 사람을 가리킵니다. 또한 כִּי אִם은 여기서 조건을 제시하므로 ‘구해 주더라도’보다 ‘구해 주면’이 적절합니다. 후반절은 구출을 반복해서 해야 한다는 생략된 내용을 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘몹시 화를 내는 사람’과 ‘그를 구해 주면, 다시 그렇게 해야 합니다’는 현대 표준 한국어 합쇼체로 자연스럽고 잠언의 일반적 경구 문체에도 맞습니다.
