base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
  footnotes:
  - marker: a
    text: Or 'A person without knowledge is not good'; the Hebrew phrase with נֶפֶשׁ can be understood in more than one way, but here it is taken idiomatically as 'desire' or 'appetite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 지식 없는 욕구[a]는 좋지 않고, 발걸음을 재촉하는 사람은 죄를 짓습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지식 없는 사람은 좋지 않다.’ 히브리어 네페쉬(נֶפֶשׁ)는 여기서 ‘욕구’나 ‘식욕’을 뜻할 수도 있고 ‘사람’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא דַעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이
  alternatives_korean:
  - 지혜 없이
  - 분별 없이
  lexicon: HALOT
  rationale: 부정 전치사구의 직접적 의미를 살려 ‘없이’로 옮기고, דַעַת의 기본값인 ‘지식’을 유지해 잠언의 인식적·도덕적 범위를 함께 보존했습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: desire
  chosen_korean: 욕구
  alternatives_korean:
  - 마음
  - 혼
  - 영혼
  lexicon: HALOT
  rationale: 이 구절에서는 נֶפֶשׁ가 인격 자체보다 내적 충동을 가리키는 관용으로 쓰이므로, ‘욕구’가 영어 POB의 ‘desire/appetite’와 가장 가깝고 현대 한국어에서도 자연스럽습니다.
- source_word: וְאָץ בְּרַגְלַיִם
  english_pob_choice: whoever hurries with his feet
  chosen_korean: 자기 발을 재촉하는 사람은
  alternatives_korean:
  - 발로 서두르는 사람은
  - 발걸음을 재촉하는 사람은
  lexicon: HALOT
  rationale: 히브리어의 몸짓적 이미지를 살리되 한국어로는 ‘자기 발을 재촉하다’가 무모하게 급히 나아가는 뉘앙스를 비교적 직역에 가깝게 전달합니다.
- source_word: חוֹטֵא
  english_pob_choice: sins
  chosen_korean: 죄를 짓습니다
  alternatives_korean:
  - 잘못을 범합니다
  - 죄합니다
  lexicon: HALOT
  rationale: חטא의 도덕적 무게를 그대로 살리면서, 한국어 잠언 문맥에서 가장 직접적인 표현인 ‘죄를 짓다’를 선택했습니다.
theological_decisions:
- issue: 첫 절의 נֶפֶשׁ를 인격적 주체로 볼지, 내적 욕구로 볼지
  chosen_reading: 내적 욕구를 가리키는 관용으로 읽어 ‘욕구’로 번역했습니다.
  alternative_readings:
  - ‘사람’으로 읽어 ‘지식 없이 사람은 좋지 않다’
  - ‘영혼’으로 직역
  rationale: 영어 POB도 주석에서 이 표현의 관용성을 인정하므로, 문맥상 지혜 없는 충동을 경계하는 의미를 드러내는 번역이 가장 공정합니다.
  doctrine_reference: 잠언 문맥의 관용적 어법과 인간 내면의 도덕적 분별에 관한 일반 원리
