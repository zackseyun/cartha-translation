translation:
  language: ko
  text: 아버지를 망하게 하고 어머니를 쫓아내는 사람은 수치와 치욕을 가져오는 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지를 약탈하고 어머니를 쫓아버리는 사람은 수치와 치욕을 끼치는 아들입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁדֶּד
  english_pob_choice: devastates
  chosen_korean: 망하게 하고
  alternatives_korean:
  - 유린하고
  - 약탈하고
  - 파괴하고
  lexicon: HALOT
  rationale: שׁדד의 강한 파괴·유린 의미를 살리되, 한국어에서는 관계 파괴까지 드러내는 ‘망하게 하고’가 문맥상 자연스럽습니다.
- source_word: יַבְרִיחַ
  english_pob_choice: drives away
  chosen_korean: 쫓아내는
  alternatives_korean:
  - 몰아내는
  - 내쫓는
  - 쫓아버리는
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 반영해, 어머니를 떠나게 하거나 내몰아 버리는 동작을 직설적으로 표현했습니다.
- source_word: בֵּן מֵבִישׁ וּמַחְפִּיר
  english_pob_choice: a son who brings shame and reproach
  chosen_korean: 수치와 치욕을 가져오는 아들
  alternatives_korean:
  - 수치와 책망을 가져오는 아들
  - 부끄러움과 치욕을 끼치는 아들
  lexicon: HALOT
  rationale: 두 분사형이 병렬로 더해 만드는 강한 수치화 효과를 한국어의 유사한 중첩 표현으로 옮겼습니다. ‘치욕’은 'reproach'의 공개적 수치감을 잘 드러냅니다.
theological_decisions:
- issue: 잠언의 수치/치욕 표현의 강도
  chosen_reading: 도덕적 비난을 넘어 공동체적 수치와 관계적 파괴를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘부끄러움을 주는 아들’처럼 완화된 표현
  - ‘책망받을 아들’처럼 법정적 표현
  rationale: 히브리어 분사들이 단순 감정이 아니라 사회적 수치와 경멸을 함께 가리키므로, 이를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 잠언의 지혜 문학에서 수치와 치욕은 언약 공동체 안의 도덕적 질서 붕괴를 드러내는 표지입니다.
