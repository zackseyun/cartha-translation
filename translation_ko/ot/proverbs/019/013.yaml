base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
  footnotes:
  - marker: a
    text: Or 'A foolish son is calamity to his father, and a wife's contentions are a constant dripping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미련한 아들은 아버지에게 파멸이며, 아내의 다툼은 끊임없이 떨어지는 물방울과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미련한 아들은 아버지에게 재앙이며, 아내의 다툼은 끊임없이 떨어지는 물방울과 같습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוֹּת
  english_pob_choice: ruin
  chosen_korean: 파멸
  alternatives_korean:
  - 재앙
  - 멸망
  - 파괴
  lexicon: HALOT
  rationale: 복수형이지만 잠언적 용법에서는 파괴적 결과를 집약적으로 가리키므로, 자연스러우면서도 강한 대응어인 ‘파멸’을 택했습니다.
- source_word: בֵּן כְּסִיל
  english_pob_choice: a foolish son
  chosen_korean: 미련한 아들
  alternatives_korean:
  - 어리석은 아들
  - 둔한 아들
  lexicon: HALOT
  rationale: כְּסִיל은 단순 지적 부족보다 도덕적·지혜문학적 어리석음을 뜻하므로, 잠언에서 익숙한 ‘미련한’이 의미를 가장 잘 살립니다.
- source_word: דֶּלֶף טֹרֵד
  english_pob_choice: a continual dripping
  chosen_korean: 계속 떨어지는 물방울
  alternatives_korean:
  - 끊임없는 누수
  - 지속적인 물방울
  lexicon: HALOT
  rationale: ‘dripping’의 생활감 있는 비유를 살리면서, טֹרֵד가 나타내는 지속성을 ‘계속 떨어지는’으로 분명히 드러냈습니다.
- source_word: מִדְיְנֵי אִשָּׁה
  english_pob_choice: a wife’s quarrels
  chosen_korean: 아내의 다툼
  alternatives_korean:
  - 아내의 말다툼
  - 여자의 다툼
  lexicon: HALOT
  rationale: 문맥이 가정 내 갈등을 가리키므로 ‘아내’가 가장 구체적이며, מדון 계열의 의미는 ‘다툼’이 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 잠언의 직설적 비유를 한국어에서 약화하지 않는 문제
  chosen_reading: 가정의 지속적 갈등을 ‘계속 떨어지는 물방울’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘끊임없는 누수’
  - ‘계속되는 짜증’
  rationale: 본문의 지혜문학적 비유는 생활의 불편함을 강하게 환기하므로, 의미를 완화하는 심리적 표현보다 원문의 이미지가 살아 있는 표현을 선택했습니다.
  doctrine_reference: 지혜문학 비유의 보존
