id: PRO.19.4
reference: Proverbs 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
  footnotes:
  - marker: a
    text: Or 'is deserted by his friend.' The Hebrew verb can describe separation without specifying whether the poor man withdraws or is abandoned; the context strongly suggests social abandonment.
    reason: lexical_alternative
translation:
  language: ko
  text: 재물은 많은 친구를 더해 주지만, 가난한 사람은 자기 친구와 멀어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 친구에게 버림받습니다.’ 히브리어 동사는 가난한 사람이 스스로 물러나는지, 아니면 버림받는지를 특정하지 않으며, 문맥상 사회적 버림이 강하게 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 돈
  - 재산
  lexicon: HALOT
  rationale: הוֹן은 단순한 현금보다 소유한 재산과 물질적 풍요를 가리키므로, 현대 한국어에서 넓은 의미를 살리는 ‘재물’이 적절합니다.
- source_word: יֹסִיף
  english_pob_choice: adds
  chosen_korean: 더하다
  alternatives_korean:
  - 늘리다
  - 보태다
  - 증가시키다
  lexicon: HALOT
  rationale: 히필 יסף의 기본 의미인 ‘더하다, 증가시키다’를 직설적으로 살려, 재물이 사람을 ‘더하게 한다’는 인과를 유지했습니다.
- source_word: רֵעִים רַבִּים
  english_pob_choice: many friends
  chosen_korean: 친구를 많이
  alternatives_korean:
  - 많은 친구를
  - 많은 동무를
  - 많은 벗을
  lexicon: HALOT
  rationale: רֵעִים은 문맥상 단순한 동료보다 관계적 친밀성을 가진 ‘친구’가 자연스럽고, רַבִּים은 수적 다수를 강조하므로 어순을 한국어에 맞게 옮겼습니다.
- source_word: יִפָּרֵד
  english_pob_choice: is separated
  chosen_korean: 떨어져 나갑니다
  alternatives_korean:
  - 분리됩니다
  - 끊어집니다
  - 멀어집니다
  lexicon: HALOT
  rationale: 니팔형 פרד의 핵심은 ‘분리되다’이지만, 문맥상 사회적 단절과 소외가 함께 느껴지므로 수동적 ‘떨어져 나가다’로 옮겨 원문이 허용하는 모호성을 보존했습니다.
theological_decisions:
- issue: 가난한 사람이 친구에게서 ‘분리되는’ 주체가 누구인지
  chosen_reading: 친구가 떠나든, 가난한 사람이 스스로 물러나든 단정하지 않고 관계가 끊기는 결과를 전면에 드러냈습니다.
  alternative_readings:
  - 친구에게 버림받습니다
  - 스스로 친구에게서 물러납니다
  rationale: 히브리어 니팔형은 주체를 명시적으로 지정하지 않으므로, 번역도 사회적 고립이라는 결과를 그대로 살려 해석을 열어 두는 것이 원문에 충실합니다.
  doctrine_reference: 잠언 19:4의 사회적 통찰
- issue: ‘재물은 친구를 많이 더한다’의 평가 방향
  chosen_reading: 도덕적 칭찬으로 완화하지 않고, 재물의 사회적 영향력을 사실 진술로 옮겼습니다.
  alternative_readings:
  - 재물은 많은 친구를 얻게 합니다
  - 부자는 친구가 많아집니다
  rationale: 본문은 재물이 실제로 관계를 늘리는 현실을 관찰적으로 말할 뿐, 그 관계의 진정성을 보장하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 잠언의 관찰적·교훈적 문체
