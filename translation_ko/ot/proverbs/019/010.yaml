  rationale: שָׂרִים는 고위 지도자나 유력자를 가리키므로, 현대 한국어에서 신분·권위를 함께 드러내는 ‘고관들’이 자연스럽습니다.
theological_decisions:
- issue: 잠언의 a fortiori 구조(‘much less’)를 한국어에서 어떻게 살릴지
  chosen_reading: ‘하물며’로 두 번째 절의 부적절함을 더 강하게 상승시키는 구조를 유지했습니다.
  alternative_readings:
  - ‘더더욱’
  - ‘얼마나 더’
  - ‘게다가’
  rationale: אַף כִּי는 첫 진술보다 훨씬 강한 부적합을 제시하는 관용구이므로, 한국어에서도 논리적 상승을 분명히 하는 표현이 필요합니다.
  doctrine_reference: 지혜문학의 수사 구조 보존
