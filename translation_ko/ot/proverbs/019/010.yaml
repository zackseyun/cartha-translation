  lexicon: HALOT
  rationale: 문맥상 ‘어울리다/어울리지 않다’는 어떤 것이 그 사람에게 맞는가를 자연스럽게 드러내며, 히브리어의 적합성 판단을 현대 한국어로 간명하게 옮깁니다.
- source_word: כְסִיל
  english_pob_choice: fool
  chosen_korean: 미련한 자
  alternatives_korean:
  - 어리석은 자
  - 우둔한 자
  - 미련한 사람
  lexicon: HALOT
  rationale: 잠언에서 כְסִיל은 단순 지능 부족이 아니라 도덕적·지혜적 부류를 가리키므로, ‘미련한 자’가 전통적 의미와 문체를 함께 살립니다.
- source_word: תַּעֲנוּג
  english_pob_choice: luxury
  chosen_korean: 사치
  alternatives_korean:
