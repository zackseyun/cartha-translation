  - 향락
  lexicon: HALOT
  rationale: 여기서는 일반적 즐거움보다 부유한 안락함과 방종한 생활을 가리키므로, 영어 POB의 ‘luxury’에 맞춰 ‘사치’가 가장 직접적입니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  - 종살이하는 자
  lexicon: HALOT
  rationale: 이 잠언의 역전 효과는 종속적 신분을 강하게 드러낼 때 살아나므로, 프로젝트 지침에 따라 완화된 ‘종’보다 ‘노예’를 택했습니다.
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 고관들
  alternatives_korean:
  - 방백들
  - 귀족들
  - 관리들
  lexicon: HALOT
  rationale: שָׂרִים는 고위 지도자나 유력자를 가리키므로, 현대 한국어에서 신분·권위를 함께 드러내는 ‘고관들’이 자연스럽습니다.
theological_decisions:
- issue: 잠언의 a fortiori 구조(‘much less’)를 한국어에서 어떻게 살릴지
  chosen_reading: ‘하물며’로 두 번째 절의 부적절함을 더 강하게 상승시키는 구조를 유지했습니다.
  alternative_readings:
  - ‘더더욱’
  - ‘얼마나 더’
  - ‘게다가’
  rationale: אַף כִּי는 첫 진술보다 훨씬 강한 부적합을 제시하는 관용구이므로, 한국어에서도 논리적 상승을 분명히 하는 표현이 필요합니다.
  doctrine_reference: 지혜문학의 수사 구조 보존
