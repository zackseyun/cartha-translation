source:
  edition: WLC
  text: לֹֽא נָאוֶ֣ה לִ/כְסִ֣יל תַּעֲנ֑וּג אַ֝֗ף כִּֽי לְ/עֶ֤בֶד מְשֹׁ֬ל בְּ/שָׂרִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/010.yaml
  text: Luxury is not fitting for a fool[c][b][a], much less for a slave to rule over princes.
  footnotes:
  - marker: a
    text: Or 'pleasure' or 'delight' for 'luxury.' The Hebrew term can denote enjoyment generally, but here likely refers to affluent ease or indulgence.
    reason: lexical_alternative
  - marker: b
    text: Or 'servant' instead of 'slave.' The Hebrew עֶבֶד can cover a range of servile statuses; 'slave' is used here because the proverb's force depends on the sharp social reversal.
    reason: lexical_alternative
  - marker: c
    text: Or 'nobles' or 'officials' for 'princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미련한 자에게 사치[a]는 어울리지 않습니다. 하물며 노예[b]가 고관들[c]을 다스리는 일이야 더 말할 것도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사치’는 여기서 일반적인 ‘즐거움’보다 부유한 안락함이나 방종한 생활에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노예’는 עֶבֶד의 종속 신분을 강하게 드러내기 위한 선택입니다. ‘종’으로도 옮길 수 있지만, 이 잠언의 사회적 역전이 더 선명해집니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고관들’은 ‘방백들’, ‘귀족들’, ‘관리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
