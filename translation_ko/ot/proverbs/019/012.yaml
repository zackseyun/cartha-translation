id: PRO.19.12
reference: Proverbs 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַ֣הַם כַּ֭/כְּפִיר זַ֣עַף מֶ֑לֶךְ וּ/כְ/טַ֖ל עַל עֵ֣שֶׂב רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
  footnotes:
  - marker: a
    text: Or 'roaring of a young lion.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his goodwill' or 'his pleasure' is like dew on the grass.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 노여움은 어린 사자의 으르렁거림[a] 같고, 그의 호의[b]는 풀 위의 이슬 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 사자의 포효’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 선의’ 또는 ‘그의 기쁨’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם / כְּפִיר
  english_pob_choice: growling of a young lion
  chosen_korean: 어린 사자의 으르렁거림
  alternatives_korean:
  - 어린 사자의 포효
  - 새끼 사자의 울부짖음
  lexicon: HALOT
  rationale: 나함은 사자 울음의 거친 소리를 가리키므로, 한국어에서는 ‘으르렁거림’이 위협적이고 낮게 울리는 느낌을 가장 자연스럽게 살립니다. כְּפִיר은 ‘어린 사자’로 옮겨 POB의 ‘young lion’ 이미지를 그대로 유지했습니다.
- source_word: זַעַף מֶלֶךְ
  english_pob_choice: A king’s wrath
  chosen_korean: 왕의 노여움
  alternatives_korean:
  - 왕의 진노
  - 임금의 노여움
  lexicon: HALOT
  rationale: זַעַף는 강한 분노를 뜻하지만, 속담체의 압축성과 자연스러움을 살려 ‘노여움’으로 옮겼습니다. ‘진노’도 가능하지만 다소 더 무겁고 설교체로 들릴 수 있어 여기서는 피했습니다.
- source_word: רְצוֹנוֹ
  english_pob_choice: his favor
  chosen_korean: 그의 호의
  alternatives_korean:
  - 그의 은총
  - 그의 선의
  - 그의 기쁨
  lexicon: HALOT
  rationale: רְצוֹן은 호의, 기쁨, 뜻을 가리킬 수 있으나, 왕의 노여움과 대조되는 의미를 한국어에서 가장 분명하게 드러내는 말은 ‘호의’입니다. POB가 주석에서 ‘goodwill/pleasure’ 가능성을 열어 둔 점을 반영해, 문맥상 핵심인 호의적 태도를 택했습니다.
- source_word: עַל עֵשֶׂב
  english_pob_choice: dew on the grass
  chosen_korean: 풀 위의 이슬
  alternatives_korean:
  - 잔디 위의 이슬
  - 풀에 내린 이슬
  lexicon: HALOT
  rationale: עַל은 위치 관계를 나타내므로 ‘풀 위의’로 직역성을 유지했습니다. עֵשֶׂב은 일반적인 초목/풀을 가리키며, 시적 이미지로는 ‘풀’이 가장 간결하고 자연스럽습니다.
