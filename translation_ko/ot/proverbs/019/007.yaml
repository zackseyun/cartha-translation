id: PRO.19.7
reference: Proverbs 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
  footnotes:
  - marker: a
    text: Or, 'He pursues words that are nothing,' or 'He pursues promises, but they are not there.' The final clause is textually and syntactically difficult in Hebrew.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'brothers' is grammatically masculine; here it refers to family members in the proverb's social setting.
    reason: cultural_note
translation:
  language: ko
  text: 가난한 자의 형제는 다 그를 미워합니다. 하물며 그의 친구들은 얼마나 더 그에게서 멀어지겠습니까! 그는 말을 뒤쫓지만, 그것들은 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절은 히브리어가 매우 어렵습니다. ‘그는 헛된 말을 좇지만, 그것들은 없습니다’ 또는 ‘그는 약속을 좇지만, 그것들은 없습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘형제’는 문법상 남성형이지만, 이 속담에서는 가족 구성원을 가리키는 사회적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רָשׁ
  english_pob_choice: a poor man
  chosen_korean: 가난한 자
  alternatives_korean:
  - 가난한 사람
  - 빈곤한 사람
  lexicon: HALOT
  rationale: 히브리어는 단수 남성형이지만 속담 문맥에서는 일반적인 유형을 가리키므로, 한국어에서는 자연스러운 포괄 표현인 ‘가난한 자’로 옮겼습니다.
- source_word: אֲחֵי
  english_pob_choice: brothers
  chosen_korean: 형제는 다
  alternatives_korean:
  - 형제들
  - 친족들
  - 가족들
  lexicon: HALOT
  rationale: 직역하면 ‘형제들’이지만, 속담의 사회적 배경에서는 가족 구성원을 가리키는 집단 표현으로 읽혀서 ‘형제는 다’로 처리해 가족적 결속과 배신의 대비를 살렸습니다.
- source_word: אַף כִּי
  english_pob_choice: how much more
  chosen_korean: 하물며
  alternatives_korean:
  - 더욱이
  - 하려니와
  - 얼마나 더
  lexicon: HALOT
  rationale: 아포르테리오리 논증을 나타내는 관용구이므로, 한국어 속담·수사에서 자연스럽고 힘 있는 ‘하물며’로 옮겼습니다.
- source_word: מְרֵעֵהוּ / רָחֲקוּ מִמֶּנּוּ
  english_pob_choice: his friends keep far from him
  chosen_korean: 그의 친구들은 얼마나 더 그에게서 멀어지겠습니까
  alternatives_korean:
  - 그의 친구들은 그에게서 멀리 떨어집니다
  - 그의 친구들은 그를 멀리합니다
  lexicon: HALOT
  rationale: ‘keep far from him’의 관계적 거리두기를 살리기 위해 단순한 물리적 이동보다 ‘멀어지다’로 옮겼습니다. 의문형은 원문의 비교 강조를 한국어에서 자연스럽게 강화합니다.
- source_word: מְרַדֵּף אֲמָרִים לֹא הֵמָּה
  english_pob_choice: He pursues words, but they are not there
  chosen_korean: 그는 말을 뒤쫓지만, 그것들은 없습니다
  alternatives_korean:
  - 그는 말을 추구하지만, 그것들은 없습니다
  - 그는 헛된 말을 좇지만, 그것들은 없습니다
  - 그는 말들을 뒤쫓지만, 그것들은 없습니다
  lexicon: HALOT
  rationale: 마지막 절은 히브리어가 매우 난해하므로, POB의 열린 해석을 따르되 ‘말’로 옮겨 문맥상 헛된 기대나 빈말을 좇는 뉘앙스를 남겼습니다. ‘그것들은 없습니다’는 원문의 짧고 단정적인 결말을 유지합니다.
theological_decisions:
- issue: 속담의 비교 강조를 한국어로 어떻게 살릴지
  chosen_reading: 직역보다 아포르테리오리 수사(‘하물며’)를 분명하게 드러내는 번역을 채택했습니다.
  alternative_readings:
  - 평탄한 서술형으로 ‘더욱이’라고 옮김
  - 비교를 약화시켜 단순 병렬로 처리
  rationale: 이 절의 핵심은 형제의 미움에서 친구의 소원함으로 나아가는 논증 구조이므로, 비교 논리를 희미하게 하지 않고 독자가 즉시 이해하도록 하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 잠언의 수사 구조 보존
