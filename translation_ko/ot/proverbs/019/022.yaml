translation:
  language: ko
  text: 사람에게서 바라는 것은 그의 한결같은 사랑[a][b]이요, 가난한 사람은 거짓된 사람보다 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 소망은 그의 한결같은 사랑입니다.’ 히브리어 첫 줄은 간결하여, 사람에게서 바라는 것이 무엇인지를 말하는 것으로도, 사람의 소망을 그의 사랑이나 충성으로 말하는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד를 번역한 것으로, 문맥에 따라 친절, 충성, 또는 신실한 사랑을 뜻할 수도 있습니다.
    reason: lexical_alternative
