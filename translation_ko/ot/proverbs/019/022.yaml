  text: 사람에게서 바라는 것은 그의 굳은 사랑[a][b]이요, 가난한 자는 거짓말쟁이보다 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람의 소망은 그의 굳은 사랑'입니다. 히브리어 첫 줄은 간결하여, 어떤 것이 사람에게서 바라는 것인지를 설명하거나, 사람의 소망을 그의 자비/충성심으로 동일시하는 것으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''굳은 사랑''은 히브리어 חֶסֶד를 번역한 것으로, 문맥에 따라 자비, 충성, 혹은 충실한 사랑이라는 뜻도 가질 수 있는 풍부한 용어입니다.'
    reason: alternative_reading
