id: PRO.19.3
reference: Proverbs 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'a man's' uses a singular generic form, referring to a person in general.
    reason: cultural_note
  - marker: b
    text: Or 'perverts his way' or 'makes his path crooked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석음은 사람의 길을 망치게 하고, 그의 마음은 야훼를 향해 분노합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람’은 여기서 일반적인 한 개인을 가리키는 단수 용법입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그의 길을 비틀어 놓고’, ‘그의 길을 굽게 하고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 미련함
  lexicon: HALOT
  rationale: 지혜문학의 대조를 살리면서도 현대 한국어에서 자연스럽고, 행동의 상태를 가리키는 명사로 충분히 대응됩니다.
- source_word: תְּסַלֵּף
  english_pob_choice: ruins
  chosen_korean: 망치게 하고
  alternatives_korean:
  - 왜곡하고
  - 비틀고
  - 굴곡지게 하고
  lexicon: HALOT
  rationale: 원어는 ‘비틀다/굽게 하다’의 뜻이지만, 문맥상 사람의 삶의 길이 실제로 파괴되는 결과를 드러내는 표현으로 옮기는 것이 한국어에서 더 분명합니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 길을
  alternatives_korean:
  - 길
  - 삶의 길
  - 행로를
  lexicon: HALOT
  rationale: 잠언의 관용적 은유를 살리기 위해 ‘길’을 유지했습니다. 한국어에서도 삶의 방향과 행위를 아우르는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: יִזְעַף
  english_pob_choice: rages
  chosen_korean: 분노합니다
  alternatives_korean:
  - 격분합니다
  - 성을 냅니다
  - 화냅니다
  lexicon: HALOT
  rationale: 동사의 강한 정서 반응을 살리되, 한국어 문장에서는 지나치게 구어적이거나 시적 과장을 피하는 표현이 적절합니다.
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 마음은
  alternatives_korean:
  - 마음이
  - 심장은
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 사고와 감정의 중심을 가리키므로, 한국어도 그 관용을 그대로 반영하는 것이 좋습니다.
theological_decisions:
- issue: 잠언의 일반적 ‘사람’ 표현
  chosen_reading: ‘사람의’로 옮겨, 원문의 단수 일반 용법을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘한 사람의’
  - ‘어떤 사람의’
  - ‘인간의’
  rationale: 히브리어 אָדָם의 단수 일반 용법을 살리면서도, 한국어 독자가 보편적 교훈으로 읽도록 했습니다. 성별 중립화로 문장을 바꾸기보다 원문의 형식을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: 야훼를 향한 분노의 방향성
  chosen_reading: 마음이 야훼를 향해 분노한다고 옮겨, 원문이 말하는 하나님에 대한 원망의 방향을 분명히 했습니다.
  alternative_readings:
  - 야훼를 원망합니다
  - 야훼에게 성을 냅니다
  rationale: 원문은 자기 삶을 망가뜨린 뒤 그 책임을 하나님께 돌리는 역설을 드러냅니다. ‘분노합니다’는 그 정서를 유지하면서도 해석을 과도하게 좁히지 않습니다.
  doctrine_reference: 잠언 19:3의 문맥상 자기파괴와 하나님 원망의 대조
