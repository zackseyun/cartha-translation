- from: 어리석음은 사람의 길을 망치게 하고, 그의 마음은 야훼를 향해 분노합니다.[a][b]
  to: 사람의 어리석음은 그의 길을 굽게 하고, 그의 마음은 야훼를 향해 분노합니다.[a][b]
  rationale: ‘굽게 하고’는 סלף의 기본 의미와 잠언에서 ‘길’이 지닌 삶의 행로라는 은유를 보존합니다. ‘망치고’는 가능한 문맥적 번역이므로 각주 대안으로 유지했습니다. 나머지 표현과 각주 표지는 원문의 의미 및 구조에 맞습니다.
