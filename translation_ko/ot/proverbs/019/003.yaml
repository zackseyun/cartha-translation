  source_fidelity: 히브리어 אִוֶּלֶת אָדָם은 ‘사람의 어리석음’이며, תְּסַלֵּף는 ‘망치다’보다 기본적으로 ‘굽게 하다, 비틀다, 왜곡하다’를 뜻합니다. 또한 יִזְעַף는 분노의 주체가 ‘그의 마음’임을 유지해야 합니다.
