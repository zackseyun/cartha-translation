  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁמַ֣ע עֵ֭צָה וְ/קַבֵּ֣ל מוּסָ֑ר לְ֝מַ֗עַן תֶּחְכַּ֥ם בְּ/אַחֲרִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
  footnotes:
  - marker: a
    text: Or “for your future” or “in the end.” The Hebrew אַחֲרִית can refer to one’s latter end, outcome, or future.
    reason: lexical_alternative
translation:
  language: ko
  text: 권고를 들으시고 훈계를 받아들이십시오.[a] 그러면 끝에 가서 지혜로워지실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 미래에” 또는 “끝에”. 히브리어 אַחֲרִית는 마지막, 결과, 또는 미래를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Listen
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으십시오
  - 들으라
  lexicon: HALOT
  rationale: 지혜 문맥의 명령형으로서 단순 청취가 아니라 주의를 기울여 듣는 뜻을 살려 ‘들으시고’로 옮겼습니다.
- source_word: עֵצָה
  english_pob_choice: counsel
  chosen_korean: 권고
  alternatives_korean:
  - 조언
  - 상담
  - 훈계
  lexicon: HALOT
  rationale: 잠언에서 עֵצָה는 가벼운 조언보다 분별 있는 안내를 가리키므로, 현대 한국어에서 그 무게를 살릴 수 있는 ‘권고’를 선택했습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 교정
  - 징계
  - 훈련
  lexicon: HALOT
  rationale: מוּסָר는 단순 정보가 아니라 바로잡고 형성하는 교훈을 포함하므로, 권면성과 교정성을 함께 담는 ‘훈계’를 택했습니다.
- source_word: בְּאַחֲרִיתֶךָ
  english_pob_choice: in the end
  chosen_korean: 끝에 가서
  alternatives_korean:
  - 마지막에
  - 결국
  - 장차
  lexicon: HALOT
  rationale: אַחֲרִית는 끝, 결과, 미래를 모두 가질 수 있으나 여기서는 삶의 종국 또는 최종 결과를 가리키므로, 자연스러운 현대어로 ‘끝에 가서’라고 옮겼습니다.
theological_decisions:
- issue: 명령형의 공손한 표지와 지혜문학의 권면 어조
  chosen_reading: 문장 전체를 합쇼체 권면으로 유지하되, 원문의 지시성을 살려 동사 명령형을 공손하게 처리했습니다.
  alternative_readings:
  - 평서형으로 완화하는 번역
  - 직설 명령형(들으십시오/받아들이십시오)
  rationale: 잠언의 잠언적 권면은 독자를 직접 가르치는 방식이므로, 현대 한국어의 공손한 명령형으로 옮기되 강도를 약화시키지 않도록 했습니다.
  doctrine_reference: 지혜문학의 권면 장르
- issue: בְּאַחֲרִיתֶךָ의 시간·결과 중첩 의미
  chosen_reading: ‘끝에 가서’로 시간적 종말과 그에 따른 결과를 함께 열어 두었습니다.
  alternative_readings:
  - ‘미래에’
  - ‘인생의 끝에서’
  - ‘결과적으로’
  rationale: 히브리어 אַחֲרִית는 미래, 종말, 결과를 포괄하므로 한쪽으로 지나치게 좁히지 않고 원문의 의미 폭을 보존했습니다.
  doctrine_reference: 히브리어 어휘의 다의성
