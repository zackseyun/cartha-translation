id: PRO.19.23
reference: Proverbs 19:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
  footnotes:
  - marker: a
    text: Or 'is for life'; the Hebrew expression is very concise and may be rendered more literally.
    reason: lexical_alternative
  - marker: b
    text: Or 'will spend the night satisfied' or 'will sleep satisfied.'
    reason: lexical_alternative
  - marker: c
    text: Or 'no evil/disaster will visit him.' Here 'evil' refers to calamity or harm, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하는 것은 생명에 이르고, 그것을 가진 사람은 만족하게 쉬게 되며, 그에게는 해가 닥치지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: The fear of Yahweh
  chosen_korean: 여호와를 경외하는 것
  alternatives_korean:
  - 야훼를 두려워함
  - 야훼를 경외함
  lexicon: HALOT
  rationale: 히브리어의 יִרְאַת는 단순한 공포보다 경외를 포함한 두려움을 가리키므로, 한국어에서는 관용적이면서도 의미를 살릴 수 있는 ‘경외하는 것’으로 옮겼습니다.
- source_word: לְחַיִּים
  english_pob_choice: leads to life
  chosen_korean: 생명에 이르고
  alternatives_korean:
  - 생명을 향하고
  - 생명을 위한
  lexicon: HALOT
  rationale: לְ + 명사 구조의 결과·방향성을 살려 ‘~에 이르다’로 옮겼습니다. 잠언의 압축성을 유지하면서 자연스럽게 읽히는 표현입니다.
- source_word: וְשָׂבֵעַ
  english_pob_choice: satisfied
  chosen_korean: 만족하게
  alternatives_korean:
  - 충족되어
  - 배부르게
  lexicon: HALOT
  rationale: 여기서는 단순한 배부름보다 평안한 충족감을 나타내므로, 쉼과 함께 어울리는 ‘만족하게’가 더 적절합니다.
- source_word: יָלִין
  english_pob_choice: will rest
  chosen_korean: 쉬게 되며
  alternatives_korean:
  - 묵게 되며
  - 잠들게 되며
  - 밤을 지내게 되며
  lexicon: HALOT
  rationale: 동사의 문자적 의미인 ‘밤을 지내다’보다, 잠언 문맥의 안전하고 충만한 휴식을 드러내는 ‘쉬다’를 택했습니다.
- source_word: יִפָּקֶד רָע
  english_pob_choice: he will not be visited by harm
  chosen_korean: 해가 닥치지 않습니다
  alternatives_korean:
  - 재앙이 그를 찾아오지 않습니다
  - 악이 그에게 임하지 않습니다
  lexicon: HALOT
  rationale: רָע는 여기서 도덕적 악이 아니라 해악·재난을 뜻하므로, ‘해’로 옮겨 의미를 분명히 했습니다. פקד의 ‘방문하다’ 이미지는 한국어에서 자연스러운 ‘닥치다’로 풀었습니다.
theological_decisions:
- issue: 이 구절의 ‘생명’이 무엇을 가리키는지
  chosen_reading: 궁극적 생명으로만 좁히지 않고, 잠언 특유의 삶의 충만함과 안전을 함께 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 영생으로 한정
  - 장수와 번영으로만 한정
  rationale: 잠언의 ‘생명’은 종종 하나님 질서 아래의 전인적 삶을 가리키므로, 본문이 허락하는 폭을 그대로 유지했습니다.
  doctrine_reference: 잠언 19:23의 지혜 문맥
- issue: 마지막 절이 모든 고난의 절대적 면제를 약속하는지 여부
  chosen_reading: ‘해가 닥치지 않습니다’로 옮겨 잠언의 일반 진술 성격을 살렸습니다.
  alternative_readings:
  - 아무 해도 없을 것입니다
  - 그는 어떤 고난도 겪지 않을 것입니다
  rationale: 지혜문학의 압축된 일반 진술을 과도하게 절대화하지 않으면서, 원문의 경고·보호 이미지를 유지합니다.
  doctrine_reference: 지혜문학의 일반화된 진술 방식
