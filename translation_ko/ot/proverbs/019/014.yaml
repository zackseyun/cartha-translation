  text: בַּ֣יִת וָ֭/הוֹן נַחֲלַ֣ת אָב֑וֹת וּ֝/מֵ/יְהוָ֗ה אִשָּׁ֥ה מַשְׂכָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
  footnotes:
  - marker: a
    text: Or 'a discerning woman.' The Hebrew אִשָּׁה can mean 'woman' or 'wife'; in this context 'wife' best fits the proverb's contrast with inherited property.
    reason: lexical_alternative
translation:
  language: ko
  text: 집과 재물은 아버지들에게서 물려받은 유산이지만, 분별 있는 아내는 야훼에게서 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 있는 여자’입니다. 히브리어 אִשָּׁה는 ‘여자’ 또는 ‘아내’를 뜻할 수 있는데, 이 문맥에서는 재물의 유산과 대조되므로 ‘아내’가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 가정
  - 집안
  lexicon: HALOT
  rationale: 재산과 함께 유산으로 병렬되는 구체적 소유물을 가리키므로, 추상적인 ‘가정’보다 ‘집’이 원문 대비를 더 분명히 살립니다.
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  lexicon: HALOT
  rationale: 지혜문학에서 물질적 소유를 가리키는 말로, 유산 문맥에 맞게 현대 한국어의 ‘재물’이 자연스럽습니다.
- source_word: נַחֲלַת אָב֑וֹת
  english_pob_choice: an inheritance from fathers
  chosen_korean: 아버지들에게서 물려받은 유산
  alternatives_korean:
  - 조상들의 유산
  - 아버지들의 유산
  lexicon: HALOT
  rationale: אָמ/אבות의 남성 복수성을 유지하면서도 한국어에서 자연스럽게 들리도록 ‘물려받은 유산’으로 풀었습니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 야훼로부터
  - 주님에게서
  lexicon: HALOT
  rationale: 원문의 출처표현 מִן을 ‘에게서’로 옮겨, 뒤의 아내가 인간 계보가 아니라 신적 기원/선물임을 살렸습니다. POB의 יְהוָה 처리 원칙에 따라 ‘야훼’를 사용했습니다.
- source_word: אִשָּׁה מַשְׂכָּלֶת
  english_pob_choice: a prudent wife
  chosen_korean: 분별 있는 아내
  alternatives_korean:
  - 분별 있는 여자
  - 슬기로운 아내
  lexicon: HALOT
  rationale: 문맥상 일반적 ‘여자’보다 결혼 관계를 전제하는 ‘아내’가 적절하며, מַשְׂכָּלֶת의 실천적 지혜를 ‘분별 있는’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 번역
  chosen_reading: יהוה를 ‘야훼’로 옮겨 하나님의 언약적 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신적 공급의 출처를 이름으로 직접 지시하므로, 약화된 칭호보다 고유이름을 보존하는 것이 원문 효과를 더 충실히 반영합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
