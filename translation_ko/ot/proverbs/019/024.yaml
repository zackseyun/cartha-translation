  verdict: revise
  source_fidelity: 첫 절의 ‘손을 그릇에 묻습니다’는 טָמַן의 과장된 ‘묻다/숨기다’ 이미지를 잘 보존합니다. 그러나 둘째 절의 여성 단수 목적어 접미사는 앞의 ‘손’을 가리키므로, ‘그것’보다 ‘그 손’을 명시하는 편이 원문 지시 관계를 충실히 드러냅니다. 또한 גַּם의 강조는 ‘심지어’로 나타내는 것이 좋습니다.
  naturalness: ‘그것을 입으로 다시 가져오지도 않습니다’는 무엇을 가리키는지 다소 불분명하고 한국어 동작 묘사로도 어색합니다. ‘그 손을 자기 입으로 도로 가져가지도 않습니다’가 자연스럽고, 잠언 특유의 과장도 유지합니다.
  terminology: ‘게으른 사람’, ‘그릇’, ‘묻습니다’는 현대 표준어 합쇼체에 적절합니다. 용기의 형태를 특정하지 않는 ‘그릇’도 צַלָּחַת에 알맞습니다.
