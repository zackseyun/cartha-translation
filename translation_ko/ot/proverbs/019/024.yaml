  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת גַּם אֶל פִּ֝֗י/הוּ לֹ֣א יְשִׁיבֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/024.yaml
  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
  footnotes:
  - marker: a
    text: Or 'hides his hand in the dish.' The Hebrew verb can mean 'hide' or 'bury'; 'buries' was chosen to preserve the proverb's exaggerated imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the bowl' or 'in the platter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 자기 손을 그릇[b]에 묻습니다[a]. 그는 심지어 그 손을 자기 입으로 도로 가져가지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그릇에 손을 숨깁니다.’ 히브리어 동사는 ‘숨기다’와 ‘묻다/파묻다’의 뜻이 모두 가능하므로, 이 잠언의 과장된 이미지를 살리기 위해 ‘묻습니다’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘접시에’ 혹은 ‘사발에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  english_pob_choice: buries
  chosen_korean: 묻습니다
  alternatives_korean:
  - 숨깁니다
  - 파묻습니다
  lexicon: HALOT
  rationale: 히브리어의 기본 뜻은 ‘숨기다/묻다/파묻다’이며, 잠언의 과장된 이미지를 살리면서도 한국어에서 자연스럽게 읽히는 동작으로 옮겼습니다.
- source_word: עָצֵל
  english_pob_choice: sluggard
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으름뱅이
  - 나태한 사람
  lexicon: HALOT
  rationale: 속담체 인물을 가리키는 표현이므로, 현대 한국어에서 이해하기 쉬운 ‘게으른 사람’으로 옮겼습니다.
- source_word: בַּצַּלָּחַת
  english_pob_choice: in the dish
  chosen_korean: 그릇에
  alternatives_korean:
  - 접시에
  - 사발에
  lexicon: HALOT
  rationale: 먹는 상황의 용기를 가리키므로, 형태를 지나치게 특정하지 않는 ‘그릇’이 원문의 음식 장면을 무리 없이 전달합니다.
- source_word: לֹא יְשִׁיבֶנָּה
  english_pob_choice: he will not even bring it back
  chosen_korean: 그것을 입으로 다시 가져오지도 않습니다
  alternatives_korean:
  - 그것을 되돌려 놓지도 않습니다
  - 그것을 입으로 되돌리지도 않습니다
  lexicon: HALOT
  rationale: Hiphil 형태의 ‘다시 가져오다/되돌리다’라는 의미를 살리되, 손에서 입으로의 동작을 한국어 관용으로 자연스럽게 표현했습니다.
