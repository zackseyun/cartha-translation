source:
  edition: WLC
  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
  footnotes:
  - marker: a
    text: 'Or: ''while there is hope.'' The Hebrew clause can be understood causally (''for there is hope'') or temporally (''while there is hope'').'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not lift up your soul to put him to death'—a Hebrew idiom meaning not to direct your desire or resolve toward a deadly outcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들을 징계하십시오. 그에게 희망이 있으므로.[a] 그를 죽이는 데 마음을 두지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘희망이 있을 동안.’ 히브리어 절은 원인(‘희망이 있으므로’)으로도 시간(‘희망이 있을 동안’)으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그를 죽이는 데 네 영혼을 들지 말라’입니다. 이는 죽음에 이르게 하는 결과를 바라거나 그것을 향해 의지와 결심을 두지 말라는 히브리어 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  english_pob_choice: Discipline
  chosen_korean: 징계하십시오
  alternatives_korean:
  - 훈계하십시오
  - 교정하십시오
  - 훈련하십시오
  lexicon: HALOT
  rationale: 피엘 명령형 יסר는 교정적 징계의 뜻이므로, 현대 한국어에서는 ‘징계하다’가 가장 직접적으로 대응합니다.
- source_word: בִּנְךָ
  english_pob_choice: your son
  chosen_korean: 아들을
  alternatives_korean:
  - 자녀를
  - 아들을 네
  lexicon: HALOT
  rationale: 히브리어는 성별이 분명한 ‘당신의 아들’이므로, 성중립화하지 않고 그대로 ‘아들’로 옮겼습니다.
- source_word: כִּי יֵשׁ תִּקְוָה
  english_pob_choice: for there is hope
  chosen_korean: 희망이 있으니 말입니다
  alternatives_korean:
  - 희망이 있으니
  - 희망이 있기 때문입니다
  - 희망이 있기에
  lexicon: HALOT
  rationale: 원문의 이유 절을 한국어에서 자연스럽게 풀어, 명령의 근거를 드러내는 ‘-니 말입니다’ 구조로 옮겼습니다.
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  english_pob_choice: do not set your heart on
  chosen_korean: 마음을 두지 마십시오
  alternatives_korean:
  - 욕심을 내지 마십시오
  - 그것을 바라지 마십시오
  - 그를 죽이려 하지 마십시오
  lexicon: HALOT
  rationale: ‘영혼을 들다’는 히브리 관용구이므로, 의지와 내적 지향을 살려 ‘마음을 두다’로 옮겼습니다.
theological_decisions:
- issue: 둘째 행의 경고가 무엇을 금하는가
  chosen_reading: 징계는 필요하지만, 아들의 죽음을 목표로 하거나 그쪽으로 마음을 두는 가혹한 처사를 금합니다.
  alternative_readings:
  - 징계를 아끼지 말라는 뜻으로 볼 수 있습니다
  - 아들이 죽지 않도록만 하라는 뜻으로 약화시킬 수 있습니다
  rationale: 히브리어는 ‘죽이려는 데’로 향하는 의지 자체를 금하는 표현이므로, 징계와 치명적 의도 사이의 긴장을 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 6
