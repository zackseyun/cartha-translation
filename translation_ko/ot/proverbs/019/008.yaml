id: PRO.19.8
reference: Proverbs 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
  footnotes:
  - marker: a
    text: Literally, 'acquires heart.' In Hebrew wisdom literature, 'heart' often refers to the mind or the capacity for discernment.
    reason: lexical_alternative
  - marker: b
    text: Or 'loves himself' or 'loves his soul/life.' The Hebrew noun can denote the self or life, not only the soul in a narrow sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 분별을 얻는 사람은 자기 생명을 사랑합니다[a]; 지혜를 지키는 사람은 좋은 것을 찾게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자상 ‘마음을 얻는’이지만, 지혜문학에서 ‘마음’은 사고와 분별의 중심을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה לֵּב
  english_pob_choice: gains sense
  chosen_korean: 분별을 얻는
  alternatives_korean:
  - 마음을 얻는
  - 지혜를 얻는
  - 생각을 얻는
  lexicon: HALOT
  rationale: קנה는 ‘얻다/획득하다’의 뜻으로 쓰였고, לֵב는 지혜문학에서 마음이 아니라 분별 능력을 가리키므로, 한국어에서는 자연스럽게 ‘분별을 얻다’로 옮겼습니다.
- source_word: אֹהֵב נַפְשׁוֹ
  english_pob_choice: loves his own life
  chosen_korean: 자기 생명을 사랑합니다
  alternatives_korean:
  - 자기 자신을 사랑합니다
  - 자기 영혼을 사랑합니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 ‘영혼’보다 ‘생명/자기 존재’의 뜻이 자연스러우므로, 후대의 이분법적 뉘앙스를 피해서 ‘자기 생명’으로 옮겼습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 지혜를
  alternatives_korean:
  - 분별을
  - 깨달음을
  lexicon: HALOT
  rationale: 두 번째 행의 תְּבוּנָה는 분별·통찰을 뜻하지만, 앞 행의 ‘분별’과의 중복을 피하면서 잠언의 통상적 어휘 흐름을 살려 한국어에서는 ‘지혜’로 옮겼습니다.
- source_word: לִמְצֹא טוֹב
  english_pob_choice: will find good
  chosen_korean: 좋은 것을 찾게 됩니다
  alternatives_korean:
  - 좋은 것을 찾습니다
  - 복을 얻게 됩니다
  - 선을 찾게 됩니다
  lexicon: HALOT
  rationale: 직역의 ‘좋음을 찾다’는 한국어에서 어색하므로, 결과 의미를 살려 ‘좋은 것을 찾게 됩니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: לֵב와 נֶפֶשׁ의 인간 이해
  chosen_reading: ‘분별’과 ‘자기 생명’을 통해, 잠언이 말하는 인격의 중심과 생명 보존의 실제적 지혜를 드러냈습니다.
  alternative_readings:
  - ‘마음’과 ‘자기 자신’으로 옮길 수 있음
  - ‘마음’과 ‘영혼’으로 영성화할 수 있음
  rationale: 이 절은 내면 심리와 영혼론을 말하기보다, 지혜가 삶 전체를 보존한다는 실천적 통찰을 강조합니다. לכן 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 잠언의 지혜문학적 인간 이해
- issue: תְּבוּנָה의 반복 회피
  chosen_reading: 두 번째 행은 앞 행과 동일어 반복 대신 의미를 확장해 ‘지혜’로 옮겼습니다.
  alternative_readings:
  - ‘분별’을 반복해 ‘분별을 지키는 사람은 좋은 것을 찾게 됩니다’
  - ‘통찰’을 사용해 ‘통찰을 지키는 사람은 좋은 것을 찾게 됩니다’
  rationale: 히브리어는 평행법을 통해 의미를 보강하므로, 한국어는 반복을 줄여도 원문의 뜻을 해치지 않습니다.
  doctrine_reference: 시편·잠언의 평행법 원리
