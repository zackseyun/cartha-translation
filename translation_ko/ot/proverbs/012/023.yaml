base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
  footnotes:
  - marker: a
    text: Or 'A shrewd man covers knowledge.' The Hebrew adjective can carry the sense 'shrewd' as well as 'prudent,' and the verb literally means 'covers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the heart of fools calls out folly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 슬기로운 사람은 지식을 감춥니다.[a] 그러나 미련한 자들의 마음은 어리석음을 외칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영리한 사람은 지식을 가립니다.’ 히브리어 형용사는 ‘슬기로운’뿐 아니라 ‘영리한’ 또는 ‘간교한’의 뜻도 가질 수 있으며, 동사는 문자적으로 ‘덮다’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘미련한 자들의 마음은 어리석음을 부릅니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 지혜 문맥의 대표적 단수 인물을 가리키므로 한국어에서는 성별을 직접 드러내는 ‘남자’보다 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: עָרוּם
  english_pob_choice: prudent
  chosen_korean: 슬기로운
  alternatives_korean:
  - 신중한
  - 영리한
  - 간교한
  lexicon: HALOT
  rationale: 잠언에서는 이 형용사가 긍정적 지혜 성격을 가지므로, 부정적 뉘앙스가 강한 ‘간교한’은 피하고 ‘슬기로운’으로 표현했습니다.
- source_word: כֹּסֶה
  english_pob_choice: conceals
  chosen_korean: 감춥니다
  alternatives_korean:
  - 숨깁니다
  - 가립니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 덮다/감추다이며, 문맥상 지식을 드러내지 않고 보류하는 의미를 살려 ‘감춥니다’로 번역했습니다.
- source_word: יִקְרָא
  english_pob_choice: proclaims
  chosen_korean: 드러냅니다
  alternatives_korean:
  - 외칩니다
  - 선포합니다
  - 부릅니다
  lexicon: HALOT
  rationale: 직역하면 ‘부르다/외치다’이지만, 여기서는 어리석음이 공개적으로 드러난다는 의미가 핵심이므로 ‘드러냅니다’로 자연화했습니다.
theological_decisions:
- issue: ‘כְּסִילִים’과 ‘אִוֶּלֶת’의 지혜문학적 대비
  chosen_reading: ‘미련한 자들’과 ‘어리석음’으로 맞서게 하여, 사람의 내적 성향과 그가 밖으로 드러내는 내용의 대비를 살렸습니다.
  alternative_readings:
  - ‘우둔한 사람들’과 ‘어리석음’
  - ‘미련한 자들’과 ‘미련함’
  rationale: 잠언의 고정된 지혜 범주를 보존하면서도 현대 한국어에서 지나치게 거칠지 않게 의미 대비를 분명히 하기 위함입니다.
  doctrine_reference: 잠언의 지혜/어리석음 대조
- issue: 두 번째 절의 동사 ‘יִקְרָא’
  chosen_reading: ‘드러냅니다’로 옮겨 공개적 표출의 의미를 살렸습니다.
  alternative_readings:
  - ‘외칩니다’
  - ‘선포합니다’
  rationale: 이 절은 단순 발성보다 마음의 내용이 밖으로 노출되는 대조가 핵심이므로, 문맥상 기능을 우선했습니다.
  doctrine_reference: 지혜문학의 수사적 대조
