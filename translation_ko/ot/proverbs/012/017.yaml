id: PRO.12.17
reference: Proverbs 12:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָפִ֣יחַ אֱ֭מוּנָה יַגִּ֣יד צֶ֑דֶק וְ/עֵ֖ד שְׁקָרִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
  footnotes:
  - marker: a
    text: 'Or ''faithfulness'': ''He who breathes out faithfulness declares what is right.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'declares righteousness' or 'declares justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진실을 내뿜는 이는 의를 드러내지만, 거짓 증인은 속임수입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘충실함’: ‘충실함을 내뿜는 이는 옳은 것을 드러냅니다.’'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의를 드러냅니다’ 또는 ‘정의를 드러냅니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפִיחַ אֱמוּנָה
  english_pob_choice: He who breathes out truth
  chosen_korean: 진실을 내뿜는 이는
  alternatives_korean:
  - 진실을 내어놓는 이는
  - 진실을 말하는 이는
  - 충실함을 내뿜는 이는
  lexicon: HALOT
  rationale: יָפִיחַ의 생생한 숨/내뿜기 이미지를 살리면서, אֱמוּנָה는 이 문맥에서 증언의 진실성을 가리키므로 ‘진실’로 옮겼습니다.
- source_word: יַגִּיד צֶדֶק
  english_pob_choice: declares righteousness / what is right
  chosen_korean: 의를 드러내지만
  alternatives_korean:
  - 의를 말하지만
  - 옳은 것을 밝히지만
  - 정의를 선포하지만
  lexicon: HALOT
  rationale: נגד의 ‘알리다/드러내다’ 뉘앙스를 반영했고, צֶדֶק은 법정적·윤리적 문맥에서 ‘의’가 가장 자연스럽고 압축적입니다.
- source_word: עֵד שְׁקָרִים
  english_pob_choice: a false witness
  chosen_korean: 거짓 증인은
  alternatives_korean:
  - 거짓된 증인은
  - 거짓말하는 증인은
  lexicon: HALOT
  rationale: עֵד는 이 문맥에서 ‘증인’이 적절하며, שְׁקָרִים은 증인을 수식하는 속성적 표현이므로 ‘거짓 증인’이 간결합니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수입니다
  alternatives_korean:
  - 기만입니다
  - 사기입니다
  - 속이는 말입니다
  lexicon: HALOT
  rationale: 끝의 명사는 서술적으로 압축되어 있어, 한국어에서도 결과물처럼 남기는 ‘속임수’가 평행 구조를 잘 보존합니다.
theological_decisions:
- issue: צֶדֶק을 ‘의’로 둘지 ‘정의/옳음’으로 풀지
  chosen_reading: ‘의’로 유지해 문장 전체의 법정적·윤리적 대비를 살렸습니다.
  alternative_readings:
  - 정의
  - 옳은 것
  - 올바름
  rationale: 잠언의 간결한 대구를 해치지 않으면서, 진실한 증언이 만들어 내는 결과를 폭넓게 담을 수 있습니다.
  doctrine_reference: 지혜문학의 공적 진실성과 공의 개념
- issue: שְׁקָרִים을 ‘거짓’이 아니라 ‘거짓 증인’으로 처리할지
  chosen_reading: ‘거짓 증인’으로 옮겨 인물 묘사적 기능을 드러냈습니다.
  alternative_readings:
  - 거짓말하는 증인
  - 허위 증인
  rationale: 히브리어에서 복수형 명사가 형용사적으로 작동하는 점을 반영해, 한국어에서도 자연스러운 법정 표현으로 처리했습니다.
  doctrine_reference: 증언의 진실성과 거짓 증언 금지
