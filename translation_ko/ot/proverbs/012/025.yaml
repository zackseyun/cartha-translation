  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
  footnotes:
  - marker: a
    text: Or 'bows it down.' The Hebrew verb pictures being brought low or made to stoop.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in a man's heart.' The singular 'man' is representative.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 마음속[a] 근심은 그 마음을 짓누르지만[b], 좋은 말은 그 마음을 기쁘게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘한 사람의 마음 안에’입니다. 여기서 ‘사람’은 대표적 단수로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 낮추거나 굽히게 한다는 이미지를 지닙니다.
    reason: lexical_alternative
