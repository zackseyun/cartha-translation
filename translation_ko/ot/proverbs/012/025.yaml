source:
  edition: WLC
  text: דְּאָגָ֣ה בְ/לֶב אִ֣ישׁ יַשְׁחֶ֑/נָּה וְ/דָבָ֖ר ט֣וֹב יְשַׂמְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
  footnotes:
  - marker: a
    text: Or 'bows it down.' The Hebrew verb pictures being brought low or made to stoop.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in a man's heart.' The singular 'man' is representative.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음에 있는 근심은 그것을 꺾어 놓지만, 좋은 말은 그것을 기쁘게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘한 사람의 마음 안에’입니다. 여기서 ‘사람’은 대표적 단수로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 ‘꺾어 놓다/굽히다’의 이미지를 지닙니다. 영어 POB도 ‘bows it down’이라는 대안을 제시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  english_pob_choice: anxiety
  chosen_korean: 근심
  alternatives_korean:
  - 걱정
  - 불안
  - 염려
  lexicon: HALOT
  rationale: 지혜문학의 짧은 격언에서는 ‘anxiety’의 내적 무게를 한국어 ‘근심’이 자연스럽고 간결하게 살립니다.
- source_word: בְלֶב אִישׁ
  english_pob_choice: in a man's heart
  chosen_korean: 마음에 있는
  alternatives_korean:
  - 한 사람의 마음에 있는
  - 사람의 마음에 있는
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 단순한 감정이 아니라 내면 전체를 가리키므로, 합쇼체의 자연스러운 문장 속에서 ‘마음에 있는’으로 옮기되 대표적 단수의 뉘앙스를 유지했습니다.
- source_word: יַשְׁחֶנָּה
  english_pob_choice: weighs it down
  chosen_korean: 꺾어 놓지만
  alternatives_korean:
  - 눌러 낮추지만
  - 구부려 낮추지만
  - 기운을 꺾지만
  lexicon: HALOT
  rationale: 동사의 핵심 이미지는 아래로 굽히거나 낮추게 하는 것이므로, 한국어에서는 ‘꺾어 놓다’가 그 비유적 효과를 가장 자연스럽게 전달합니다.
- source_word: וְדָבָר טוֹב
  english_pob_choice: but a good word
  chosen_korean: 좋은 말
  alternatives_korean:
  - 좋은 한마디
  - 선한 말
  - 좋은 소식
  lexicon: HALOT
  rationale: ‘דָבָר’는 말, మాట, 메시지를 폭넓게 가리키므로, 문맥상 위로와 격려를 포함할 수 있는 ‘좋은 말’이 가장 무리 없는 대응입니다.
- source_word: יְשַׂמְּחֶנָּה
  english_pob_choice: makes it glad
  chosen_korean: 기쁘게 합니다
  alternatives_korean:
  - 즐겁게 합니다
  - 마음을 기쁘게 합니다
  - 환히 기쁘게 합니다
  lexicon: HALOT
  rationale: 힙필의 사역 의미를 살리면서도 한국어에서 자연스럽게 들리는 결과 상태를 표현하기 위해 ‘기쁘게 합니다’로 옮겼습니다.
