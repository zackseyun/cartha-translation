- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 대조 구조를 살리기 위해 צַדִּיק을 관용적인 ‘의인’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 압축 문구의 관계(장소/수단)
  chosen_reading: ‘입술의 범죄에는’으로 처리해, 죄된 말이 올무의 영역이 된다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘입술의 범죄로’
  - ‘입술의 범죄를 통해’
  rationale: 본문은 ב의 관계가 엄밀히 하나로 고정되지 않는 압축형이므로, 해석을 과도하게 좁히지 않으면서도 한국어에서 가장 자연스러운 관계를 선택했습니다.
