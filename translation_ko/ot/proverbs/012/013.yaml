base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
  footnotes:
  - marker: a
    text: Or 'By the transgression of the lips an evil man is snared.' The Hebrew is compact, and the relation between 'transgression of the lips' and 'snare' may be taken either as location ('in') or means/result ('by').
    reason: alternative_reading
  - marker: b
    text: '''The lips'' is a Hebrew idiom for speech or spoken words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 입술의 범죄에는 악인에게 올무가 있으나, 의인은 환난에서 벗어납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이어서, ‘입술의 범죄’와 ‘올무’의 관계를 ‘~안에’로도, ‘~로/통해’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘입술’은 여기서 문자적으로는 입술이지만, 관용적으로는 말이나 발언을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  english_pob_choice: In the transgression of
  chosen_korean: 입술의 범죄에는
  alternatives_korean:
