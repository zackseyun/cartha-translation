  - 함정
  lexicon: HALOT
  rationale: 지혜문학의 포획 이미지에 잘 맞는 한국어로 ‘올무’를 택해, ‘덫’보다 더 전통적이면서도 생생한 함정의 뉘앙스를 살렸습니다.
- source_word: רָע
  english_pob_choice: the evil man
  chosen_korean: 악인
  alternatives_korean:
