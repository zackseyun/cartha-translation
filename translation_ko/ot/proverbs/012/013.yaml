  lexicon: HALOT
  rationale: 직역하면 ‘입술’이며, 몸의 부분을 통해 말을 가리키는 히브리어 관용을 살리기 위해 ‘말’로 풀지 않았습니다.
- source_word: מוֹקֵשׁ
  english_pob_choice: a snare
  chosen_korean: 올무
  alternatives_korean:
