  - 입술의 범죄로 인해
  lexicon: HALOT
  rationale: ב의 관계를 장소/영역으로 살려, 죄된 말이 올무가 놓이는 영역이라는 의미를 자연스럽게 전달했습니다.
- source_word: שְׂפָתַיִם
