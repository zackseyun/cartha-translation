  text: לֹא יַחֲרֹ֣ךְ רְמִיָּ֣ה צֵיד֑/וֹ וְ/הוֹן אָדָ֖ם יָקָ֣ר חָרֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
  footnotes:
  - marker: a
    text: Or, 'A lazy man does not catch his prey,' if the verb is taken more broadly as obtaining or preparing game rather than specifically roasting it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man'; the singular masculine here is representative, referring to a person in general through proverbial male language.
    reason: cultural_note
translation:
  language: ko
  text: 게으른 사람은 자기 사냥감을 구워 내지 못하지만, 부지런함은 사람에게 귀한 재산입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사냥감을 구워 내지 못하지만’은 동사 חרך를 문자적으로 따라간 번역입니다. 문맥에 따라 ‘사냥감을 잡지 못하지만’ 또는 ‘사냥감을 준비하지 못하지만’으로 넓게 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 남성 ‘사람/남자’를 사용하지만, 잠언에서는 일반적인 사람을 대표하는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יַחֲרֹךְ
  english_pob_choice: roast
  chosen_korean: 구워 내지 못하지만
  alternatives_korean:
  - 굽지 못하지만
  - 볶지 못하지만
  - 조리하지 못하지만
  lexicon: HALOT
  rationale: 동사는 문자적으로 불에 굽는 뜻이므로, POB의 ‘roast’를 따라 음식처럼 사냥감을 실제로 활용하지 못하는 이미지를 살렸습니다.
- source_word: רְמִיָּה
  english_pob_choice: lazy man
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 나태한 사람
  - 게으른 자
  - 태만한 사람
  lexicon: HALOT
  rationale: 잠언의 대조는 ‘부지런함’과 ‘게으름’ 사이의 성격 대비이므로, 현대 한국어로 자연스러운 ‘게으른 사람’을 택했습니다.
- source_word: צֵידוֹ
  english_pob_choice: his game
  chosen_korean: 자기 사냥감
  alternatives_korean:
  - 자기 먹이
  - 자기 사냥한 짐승
  - 자기 사냥물
  lexicon: HALOT
  rationale: 사냥하여 얻은 짐승/먹이를 가리키므로, ‘사냥감’이 이미지와 뜻을 가장 직접적으로 전달합니다.
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 귀한 재산
  alternatives_korean:
  - 부
  - 재물
  - 재산
  lexicon: HALOT
  rationale: הון은 물질적 풍요를 가리키므로, 잠언의 압축된 평가를 살려 ‘재산’에 ‘귀한’을 붙여 가치 판단을 분명히 했습니다.
- source_word: חָרוּץ
  english_pob_choice: diligence
  chosen_korean: 부지런함
  alternatives_korean:
  - 근면
  - 열심
  - 근면함
  lexicon: HALOT
  rationale: 형용사/명사적 용법이 여기서는 성품보다 태도나 상태를 가리키므로, 추상명사 ‘부지런함’으로 옮겨 게으름과의 대비를 살렸습니다.
theological_decisions:
- issue: 잠언의 남성 단수 표현 אָדָם의 처리
  chosen_reading: 사람에게
  alternative_readings:
  - 한 남자에게
