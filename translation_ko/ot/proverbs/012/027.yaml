  rationale: 히브리어의 대표적 남성 단수 표현을 그대로 노출하기보다, 한국어 잠언의 자연스러운 일반화 표현인 ‘사람에게’로 옮겨 포괄적 의미를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
