  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
  footnotes:
  - marker: a
    text: Or 'secures goodwill from the LORD.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''a man of schemes''; the phrase likely carries a negative sense here: one characterized by crafty or wicked plans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 사람은 야훼께 은총을 얻지만, 꾀를 꾸미는 사람은 정죄하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은총을 얻다’는 רָצוֹן의 ‘호의/호감’을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘꾀를 꾸미는 사람’은 히브리어 ‘계략/음모’를 품은 사람이라는 부정적 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋은
  alternatives_korean:
  - 선한
  - 의로운
  - 바른
  lexicon: HALOT
  rationale: 지혜문학의 일반적 도덕 평가를 가장 넓고 자연스럽게 살리기 위해 ‘좋은’으로 옮겼습니다.
- source_word: יָפִיק רָצוֹן
  english_pob_choice: obtains favor
  chosen_korean: 은총을 얻습니다
  alternatives_korean:
  - 호의를 얻습니다
  - 은혜를 얻습니다
  - 마음에 듦을 얻습니다
  lexicon: HALOT
  rationale: ‘얻다’는 מקור/획득의 동사를 간결하게 살리고, רָצוֹן의 하나님께서 베푸시는 호의·호감을 한국어에서 가장 자연스럽게 전달하기 위해 ‘은총’을 택했습니다.
- source_word: מְזִמּוֹת
  english_pob_choice: schemes
  chosen_korean: 꾀를 꾸미는
  alternatives_korean:
  - 음모를 꾸미는
  - 악한 계획을 세우는
  - 계략을 꾸미는
  lexicon: HALOT
  rationale: 이 구절의 대조 구조상 중립적 ‘계획’보다 도덕적으로 의심스러운 ‘꾀/계략’이 맞지만, 지나치게 강한 ‘음모’는 본문의 압축성을 넘어설 수 있어 ‘꾀를 꾸미는’으로 처리했습니다.
- source_word: יַרְשִׁיעַ
  english_pob_choice: he condemns
  chosen_korean: 정죄하십니다
  alternatives_korean:
  - 유죄로 선언하십니다
  - 정죄합니다
  - 악하다고 판정하십니다
  lexicon: HALOT
  rationale: 히필형의 ‘유죄 판결/정죄’ 의미를 살리면서, 첫 절의 주어 야훼를 한국어에서는 문맥상 드러내어 ‘정죄하십니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה/YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 이 본문은 히브리어 고유명사 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 둘째 절의 주어 생략 처리
  chosen_reading: 첫 절의 야훼를 둘째 절의 주어로 이어 받아 ‘정죄하십니다’로 번역했습니다.
  alternative_readings:
  - '주어를 생략한 수동형: ‘꾀를 꾸미는 사람은 정죄됩니다’'
  - '주어를 반복한 번역: ‘야훼께서는 꾀를 꾸미는 사람을 정죄하십니다’'
  rationale: 히브리어는 둘째 절에서 주어를 생략하지만, 첫 절의 야훼가 문맥상 계속 주어가 되는 평행법이 가장 자연스럽습니다. 한국어에서는 그 관계를 드러내면서도 압축성을 유지하기 위해 존대형 동사로 처리했습니다.
  doctrine_reference: Hebrew parallelism and ellipsis in Proverbs
