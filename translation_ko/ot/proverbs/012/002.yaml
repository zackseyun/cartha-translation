  source_fidelity: 첫째 절은 대체로 충실합니다. 그러나 둘째 절의 ‘꾀를 꾸미는 사람은 정죄하십니다’는 한국어 문법상 목적어가 빠져 있고, 화제 표지 ‘은’이 붙은 명사를 정죄의 대상으로 자연스럽게 읽기 어렵습니다. 히브리어의 생략된 주어는 첫 절의 야훼로 보아 명시하는 것이 안전합니다.
  naturalness: ‘좋은 사람’은 가능하나 지혜문학의 도덕적 대조에서는 ‘선한 사람’이 더 자연스럽습니다. רָצוֹן은 하나님에게서 받는 ‘은총’보다 문맥상 ‘호의’ 또는 ‘인정’이 더 직접적입니다. ‘계략을 꾸미는 사람’은 현대 표준어로 자연스럽고, 원문의 부정적 뉘앙스를 과도하게 확대하지 않습니다.
  terminology: 야훼는 주어진 프로젝트 방침과 일치합니다. יַרְשִׁיעַ는 ‘정죄하십니다’로 적절하되, 야훼를 주어로 하고 ‘계략을 꾸미는 사람’을 목적어로 밝혀야 합니다.
