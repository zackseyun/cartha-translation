  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
  footnotes:
  - marker: a
    text: Or 'brutish' for 'stupid.' The Hebrew adjective בָּעַר can denote a person who is dull, senseless, or beastlike.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈계를 사랑하는 사람은 지식을 사랑합니다. 그러나 책망을 미워하는 사람은 어리석습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어리석습니다’로 옮긴 히브리어 בָּעַר는 ‘우둔한’, ‘분별없는’, 또는 ‘짐승 같은’ 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב מוּסָר
  english_pob_choice: Whoever loves discipline
  chosen_korean: 훈계를 사랑하는 사람은
  alternatives_korean:
  - 훈육을 사랑하는 사람은
  - 교정을 사랑하는 사람은
  - 가르침을 사랑하는 사람은
  lexicon: HALOT
  rationale: מוּסָר는 잠언에서 단순한 정보 전달보다 훈계·교정이 포함된 형성적 ‘훈련/훈계’를 뜻하므로, 한국어에서는 ‘훈계’가 가장 자연스럽고 문맥상 적절합니다.
- source_word: דָּעַת
  english_pob_choice: knowledge
  chosen_korean: 지식을
  alternatives_korean:
  - 지혜를
  - 앎을
  - 이해를
  lexicon: HALOT
  rationale: דָּעַת는 잠언에서 축적된 ‘지식’을 뜻하며, 훈계와의 병행을 살리기 위해 ‘지식’을 유지하는 것이 좋습니다.
- source_word: תוֹכַחַת
  english_pob_choice: reproof
  chosen_korean: 책망을
  alternatives_korean:
  - 훈계를
  - 꾸짖음을
  - 견책을
  lexicon: HALOT
  rationale: תוֹכַחַת는 말로 주는 교정·질책의 뉘앙스가 있어, 현대 한국어에서는 짧고 강한 ‘책망’이 가장 잘 대응합니다.
- source_word: בָּעַר
  english_pob_choice: stupid
  chosen_korean: 어리석습니다
  alternatives_korean:
  - 우둔합니다
  - 미련합니다
  - 무지합니다
  lexicon: HALOT
  rationale: בָּעַר는 지혜문학에서 둔하고 감각 없는 사람을 가리키며, 직설적이지만 현대 독자에게 분명한 ‘어리석습니다’로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 대조 구조와 어조
  chosen_reading: 문장 전체를 대조적 잠언으로 살려, 첫 절은 긍정의 반복, 둘째 절은 ‘그러나’로 강한 대비를 드러냈습니다.
  alternative_readings:
  - 그리고 책망을 미워하는 사람은 어리석습니다
  - 반면 책망을 미워하는 사람은 어리석습니다
  rationale: 히브리어의 אַנטיתזה(대조) 구조를 한국어에서 분명히 드러내야 잠언의 교훈성이 약화되지 않습니다.
  doctrine_reference: 잠언 12:1의 지혜 대조 구조
