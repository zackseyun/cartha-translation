  source_fidelity: 히브리어 יָתֵר מֵרֵעֵהוּ는 문법과 의미가 난해합니다. 본문의 능동적 해석을 따를 경우 ‘(자기) 이웃을 살펴보다’는 ‘searches out/examines’의 신중한 의미를 무리 없이 반영합니다. 후반부 תַּתְעֵם은 ‘그들(악인들)을 방황하게/길을 잃게 하다’라는 사역 의미이므로 이를 분명히 하는 편이 좋습니다. 영어 POB 본문의 ‘is a guide to’는 제공된 영어 어휘 결정의 ‘searches out’ 및 한국어 초안과 일치하지 않지만, 한국어는 원문과 난해성 주석에 근거하여 능동적 해석을 유지할 수 있습니다.
  naturalness: ‘그들을 그릇되게 합니다’는 현대 한국어에서 어색하고 의미 범위도 불명확합니다. ‘그들을 방황하게 합니다’가 자연스럽고 תעה 히필의 의미를 더 직접적으로 전달합니다. 대조 병행을 드러내기 위해 ‘하지만’을 사용하는 것이 자연스럽습니다.
