  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
  footnotes:
  - marker: a
    text: Or, 'The righteous is more excellent than his neighbor.' The Hebrew verb יָתֵר here is difficult, and this traditional rendering remains possible.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'his neighbor' could also be rendered 'his friend' or 'his companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인은 그의 이웃을 살펴보고, 악인들의 길은 그들을 그릇되게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인은 그의 이웃보다 더 뛰어납니다.’ 히브리어 יָתֵר은 여기서 어려우며, 전통적인 비교적 번역도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘그의 이웃’은 ‘그의 친구’ 또는 ‘그의 동료’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  english_pob_choice: searches out / is a guide to
  chosen_korean: 살펴보고
  alternatives_korean:
  - 이웃보다 더 낫고
  - 인도하고
  - 탐색하고
  - 면밀히 고려하고
  lexicon: HALOT
  rationale: 이 동사는 히브리어에서 난해하지만, 본문 대조상 의인이 이웃과 길을 분별하여 신중히 대하는 뜻을 살려 ‘살펴보고’로 옮겼습니다.
- source_word: מֵרֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 그의 이웃
  alternatives_korean:
  - 그의 친구
  - 그의 동료
  lexicon: HALOT
  rationale: רֵעַ는 ‘친구, 동료, 이웃’을 아우를 수 있어 지혜문학의 사회적 범위를 넓게 담는 ‘이웃’이 적절합니다.
- source_word: וְדֶרֶךְ רְשָׁעִים
  english_pob_choice: but the way of the wicked
  chosen_korean: 악인들의 길은
  alternatives_korean:
  - 그리고 악인들의 길은
  - 악한 사람들의 길은
  lexicon: HALOT
  rationale: 대조 구조를 살리기 위해 접속사를 역접으로 이해했고, 복수 명사 רְשָׁעִים은 간결한 ‘악인들’로 옮겼습니다.
- source_word: תַּתְעֵם
  english_pob_choice: leads them astray
  chosen_korean: 그들을 그릇되게 합니다
  alternatives_korean:
  - 그들을 길 잃게 합니다
  - 그들을 미혹합니다
  - 그들을 방황하게 합니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영하면서도 현대 한국어에서 자연스럽게 들리는 ‘그릇되게 합니다’로 번역했습니다.
theological_decisions:
- issue: 의인의 행위를 ‘지혜로운 분별’로 볼지 ‘도덕적 우월성’으로 볼지
  chosen_reading: 본문의 핵심을 의인이 이웃과 길을 분별해 신중히 대하는 모습으로 읽었습니다.
  alternative_readings:
  - 의인은 그의 이웃보다 더 뛰어납니다
  - 의인은 그의 이웃의 본보기입니다
  rationale: 히브리어 יָתֵר의 난해성을 인정하되, 악인의 길이 사람을 그릇되게 한다는 대조가 행동적·실천적 뜻을 더 강하게 지지하므로 비교 우월보다 분별의 의미를 택했습니다.
  doctrine_reference: 잠언의 지혜 윤리와 대조 병행법
