id: PRO.12.4
reference: Proverbs 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל עֲטֶ֣רֶת בַּעְלָ֑/הּ וּ/כְ/רָקָ֖ב בְּ/עַצְמוֹתָ֣י/ו מְבִישָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
  footnotes:
  - marker: a
    text: Or 'a capable wife,' 'a valiant wife,' or 'an excellent wife.' The Hebrew חַיִל carries a broad sense including strength, worth, competence, and excellence.
    reason: lexical_alternative
  - marker: b
    text: Literally 'like rot in his bones,' a figure for deep inward ruin or corrosive disgrace.
    reason: cultural_note
translation:
  language: ko
  text: 지혜로운 아내는 남편의 면류관이지만, 수치를 끼치는 이는 그의 뼈를 썩게 하는 부패와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַיִל은 힘, 가치, 역량, 탁월함까지 아우르는 넓은 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 뼈 속의 썩음’으로, 내면 깊숙이 퍼지는 부패를 가리키는 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  english_pob_choice: A wife of noble character
  chosen_korean: 지혜로운 아내
  alternatives_korean:
  - 덕스러운 아내
  - 유능한 아내
  - 유력한 아내
  lexicon: HALOT
  rationale: חַיִל의 넓은 뜻(능력, 가치, 탁월함, 힘)을 한국어에서 자연스럽게 살리면서, 잠언 문맥의 이상적 아내라는 의미를 간결하게 드러내기 위해 ‘지혜로운 아내’로 옮겼습니다.
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 면류관
  alternatives_korean:
  - 왕관
  - 관
  lexicon: HALOT
  rationale: ‘면류관’은 명예와 영예의 비유를 살리면서도 한국어 성경 문맥에서 충분히 자연스럽습니다. ‘왕관’보다 비유적 의미가 더 분명합니다.
- source_word: מְבִישָׁה
  english_pob_choice: one who brings shame
  chosen_korean: 수치를 끼치는 이
  alternatives_korean:
  - 수치를 주는 아내
  - 수치스럽게 하는 이
  - 부끄럽게 하는 이
  lexicon: HALOT
  rationale: 히필 분사형의 능동적 의미를 살려 ‘수치를 끼치는 이’로 번역했습니다. 성별을 한국어에서 과도하게 드러내지 않으면서도, 원문이 가리키는 아내를 문맥상 유지합니다.
- source_word: כְרָקָב בְעַצְמוֹתָיו
  english_pob_choice: like rot in his bones
  chosen_korean: 그의 뼈를 썩게 하는 부패와 같습니다
  alternatives_korean:
  - 그의 뼈 속의 썩음과 같습니다
  - 그의 뼈에 든 부패와 같습니다
  lexicon: HALOT
  rationale: ‘뼈’ 이미지를 유지하되 한국어에서 ‘썩게 하는 부패’로 풀어, 단순 상태가 아니라 내면을 잠식하는 해악이라는 비유를 분명하게 전달했습니다.
theological_decisions:
- issue: ‘여자/아내’의 성별 표지와 문맥상 지시
  chosen_reading: 본문의 첫 구절이 이미 ‘아내’로 혼인 관계를 분명히 하므로, 뒤의 부정적 대구도 같은 범주를 가리키는 것으로 이해하여 ‘수치를 끼치는 이’로 옮겼습니다.
  alternative_readings:
  - ‘그녀가 수치를 끼치면’으로 여성대명사를 드러내는 읽기
  - ‘수치를 끼치는 아내’로 명시하는 읽기
  rationale: 히브리어 분사형은 단순히 ‘한 사람’의 행위를 가리키지만, 앞 구와의 평행 구조상 혼인 상대 여성을 계속 지시합니다. 한국어에서는 과도한 성별 반복보다 문맥적 연속성이 더 자연스럽습니다.
  doctrine_reference: 잠언의 지혜 문학적 평행법과 문맥 지시
