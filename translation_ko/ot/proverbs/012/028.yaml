id: PRO.12.28
reference: Proverbs 12:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
  footnotes:
  - marker: a
    text: Or, 'and its pathway is immortality.' This reflects an alternative understanding of the difficult Hebrew in the second line.
    reason: alternative_reading
translation:
  language: ko
  text: 의의 길에는 생명이 있고, 그 길에서는 죽음이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 길은 불멸입니다.’ 이는 두 번째 행의 어려운 히브리어에 대한 대안적 이해를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/אֹרַח צְדָקָה
  english_pob_choice: In the path of righteousness
  chosen_korean: 의의 길에는
  alternatives_korean:
  - 의로운 길에는
  - 의의 길 안에는
  lexicon: HALOT
  rationale: אֹרַח의 ‘path’와 צְדָקָה의 윤리적 의미를 살려, 한국어에서는 자연스럽고도 시적 압축이 있는 ‘의의 길’로 옮겼습니다. 위치/영역의 ב는 조사 ‘-에는’로 풀었습니다.
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명이
  alternatives_korean:
  - 삶이
  - 생명이 있습니다
  lexicon: HALOT
  rationale: 문맥상 ‘생명’이 죽음과의 대조를 가장 직접적으로 드러냅니다. 히브리어 복수형이지만 관용적으로 단수 의미로 읽는 점을 반영했습니다.
- source_word: וְ/דֶרֶךְ נְתִיבָה
  english_pob_choice: and in its pathway
  chosen_korean: 그 길의 좇음에는
  alternatives_korean:
  - 그 길의 통로에는
  - 그 길의 길에는
  lexicon: HALOT
  rationale: דֶרֶךְ/נְתִיבָה의 중복적 평행을 한국어에서 그대로 ‘길/길’로 반복하면 어색하므로, 의미를 유지하면서도 자연스러운 표현으로 ‘좇음’(따라가는 길, 행로)을 택해 시적 평행을 살렸습니다.
- source_word: אַל מָוֶת
  english_pob_choice: there is no death
  chosen_korean: 죽음이 없습니다
  alternatives_korean:
  - 죽음이 없고
  - 죽음에 이르지 않습니다
  lexicon: HALOT
  rationale: 알과 מָוֶת의 부정적 진술을 한국어에서 가장 자연스럽게 풀어 ‘죽음이 없습니다’로 옮겼습니다. 이렇게 해야 잠언의 단정적인 경구체가 유지됩니다.
theological_decisions:
- issue: 두 번째 행의 קשה한 히브리어 표현(אַל־מָוֶת)의 처리
  chosen_reading: 본문은 의의 길이 죽음으로 이어지지 않는다는 뜻으로 읽고, 본문대로 ‘죽음이 없습니다’라고 번역했습니다.
  alternative_readings:
  - ‘그 길의 좇음은 불멸입니다’라는 전통적/대안적 이해
  - 부정의 세부를 다르게 잡아 ‘죽음으로 가지 않습니다’라고 명시하는 읽기
  rationale: 마소라 본문이 압축적이어서 해석 여지가 있지만, 지혜문학의 평행법과 앞행의 ‘생명’과의 대조를 따르면 본문이 말하는 핵심은 생명 vs. 죽음의 대비입니다. 원문의 긴장을 해소하기보다, 한국어 본문에서는 그 부정 진술을 보존했습니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 평탄화하지 말 것'
