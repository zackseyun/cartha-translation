translation:
  language: ko
  text: 함부로 말하는 이는 칼로 거듭 찌르는 것과 같지만,[a] 지혜로운 이들의 혀는 치유를 가져옵니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘칼의 찌름들’에 해당하는 복수형 비유를 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘지혜로운 이들의 혀는 치유/치료제’라는 직설 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is one who
  chosen_korean: …하는 사람
  alternatives_korean:
  - 한 사람이 있습니다
  - 어떤 이는
  lexicon: HALOT
  rationale: 히브리어의 존재 진술을 한국어 속담체로 자연스럽게 풀어, 특정 개인이 아니라 그런 유형의 사람을 가리킨다는 점을 살렸습니다.
- source_word: בּוֹטֶה
  english_pob_choice: speaks rashly
  chosen_korean: 무책임하게 말하는
  alternatives_korean:
  - 성급하게 말하는
  - 경솔하게 말하는
  - 함부로 말하는
  lexicon: HALOT
  rationale: 말을 거칠고 통제 없이 내뱉는 뉘앙스를 살리면서, 도덕적 경고의 힘을 유지하는 표현으로 옮겼습니다.
- source_word: כְּמַדְקְרֹת חָרֶב
  english_pob_choice: like the thrusts of a sword
  chosen_korean: 칼의 찌름과 같
  alternatives_korean:
  - 칼의 찌르는 것과 같
  - 칼의 창상처럼
  - 검의 찔림처럼
  lexicon: HALOT
  rationale: 비유의 초점은 칼에 의한 반복적 상처이므로, ‘찌름’으로 물리적 상해의 생생함을 유지했습니다.
- source_word: מַרְפֵּא
  english_pob_choice: brings healing
  chosen_korean: 치유를 가져옵니다
  alternatives_korean:
  - 치료를 가져옵니다
  - 치유가 됩니다
  - 회복을 가져옵니다
  lexicon: HALOT
  rationale: 명사형 의미(치유/치료제)를 한국어에서는 결과를 드러내는 동사구로 옮겨, 지혜로운 말의 회복적 효과를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지혜로운 말의 기능을 단순한 정보 전달이 아니라 상처를 덮고 회복시키는 능력으로 표현할지 여부
  chosen_reading: ‘지혜로운 이들의 혀는 치유를 가져옵니다’로, 말의 효능이 공동체적 회복을 낳는다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘지혜로운 자의 혀는 치료제입니다’
  - ‘지혜로운 자의 혀는 낫게 합니다’
  rationale: מַרְפֵּא의 치료/치유 의미를 살리되, 한국어 문장에서는 자연스러운 효과 서술로 옮겨 지혜로운 언어의 치유적 성격을 보존했습니다.
  doctrine_reference: 잠언의 지혜 윤리
- issue: 대조문의 폭력을 과도하게 완화하지 않을지 여부
  chosen_reading: ‘무책임하게 말하는 사람의 말은 칼의 찌름과 같다’로 직설적 대비를 유지했습니다.
  alternative_readings:
  - ‘거친 말은 사람을 찌릅니다’
  - ‘함부로 말하는 말은 상처를 줍니다’
  rationale: 히브리어 비유의 폭력성과 경고성을 약화시키지 않기 위해, 상처의 구체적 이미지를 보존했습니다.
  doctrine_reference: 언어 윤리와 생명 보호
