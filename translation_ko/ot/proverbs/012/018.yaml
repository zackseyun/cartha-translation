base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
  footnotes:
  - marker: a
    text: Or 'like sword thrusts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the tongue of the wise [is] healing/remedy.'
