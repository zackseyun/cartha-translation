source:
  edition: WLC
  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
  footnotes:
  - marker: a
    text: Or 'A wicked man desires the net of evil men.' The Hebrew noun מְצוֹד is difficult and may refer to a net, snare, prey, or plunder; the main text adopts 'plunder' because it best fits the contrast with the fruitful root of the righteous.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the root of the righteous gives.' The translation 'yields fruit' makes explicit the likely agricultural sense of the Hebrew idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 사람은 악인들의 노략물을 탐하지만, 의인들의 뿌리는 열매를 맺습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְצוֹד는 ‘그물’, ‘덫’, ‘사냥감/노략물’ 등으로 이해될 수 있는 어려운 어휘입니다. 본문은 악인이 탐내는 대상으로 읽히는 뜻을 취했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘의인들의 뿌리가 준다’입니다. ‘열매를 맺습니다’는 그 농경적 뜻을 분명히 드러낸 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  english_pob_choice: desires
  chosen_korean: 탐합니다
  alternatives_korean:
  - 원합니다
  - 갈망합니다
  - 욕심냅니다
  lexicon: HALOT
  rationale: 강한 욕망을 뜻하므로, 문맥상 부정적 뉘앙스를 살리면서도 ‘원하다’보다 더 분명한 ‘탐하다’를 택했습니다.
- source_word: מְצוֹד
  english_pob_choice: the plunder / prey
  chosen_korean: 노략물
  alternatives_korean:
  - 덫
  - 그물
  - 사냥감
  - 노획물
  lexicon: HALOT
  rationale: 이 어휘는 의미가 어렵지만, 문맥상 악인이 차지하려는 ‘얻은 것/빼앗은 것’의 뉘앙스를 살려 ‘노략물’로 옮겼습니다. ‘그물/덫’도 가능하지만, 대조 구조에는 소유·취득된 대상으로 읽는 편이 더 자연스럽습니다.
- source_word: שֹׁרֶשׁ
  english_pob_choice: the root
  chosen_korean: 뿌리
  alternatives_korean:
  - 근원
  - 뿌리채
  lexicon: HALOT
  rationale: 식물 이미지를 그대로 살리는 것이 핵심이므로 표준적인 ‘뿌리’를 사용했습니다.
- source_word: יִתֵּן
  english_pob_choice: yields fruit
  chosen_korean: 열매를 맺습니다
  alternatives_korean:
  - 줍니다
  - 생깁니다
  - 내놓습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로는 ‘준다’이지만, ‘뿌리’가 주어인 경우 한국어에서는 생산성을 드러내는 ‘열매를 맺다’가 가장 자연스럽고 원문의 농경적 비유도 보존합니다.
theological_decisions:
- issue: 의인의 ‘뿌리’가 무엇을 ‘준다’는 표현의 해석
  chosen_reading: 직역적 ‘줍니다’보다 비유를 살린 ‘열매를 맺습니다’로 처리해, 뿌리의 생명력과 결과성을 드러냈습니다.
  alternative_readings:
  - 뿌리는 줍니다
  - 의인의 뿌리는 생산합니다
  rationale: 히브리어는 간결하지만 한국어에서는 ‘뿌리가 준다’가 어색하므로, 비유를 풀어도 이미지와 대비가 유지되는 표현을 택했습니다.
  doctrine_reference: 잠언의 지혜 문학적 비유
