id: PRO.12.9
reference: Proverbs 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֣וֹב נִ֭קְלֶה וְ/עֶ֣בֶד ל֑/וֹ מִ֝/מְּתַכַּבֵּ֗ד וַ/חֲסַר לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
  footnotes:
  - marker: a
    text: Or, 'than one who pretends to be important and has no bread.' The Hebrew for 'honors himself' can carry the sense of making oneself appear honorable or important.
    reason: lexical_alternative
translation:
  language: ko
  text: 가볍게 여겨지는 사람이 종을 두는 것이, 스스로를 높이며 빵이 없는 사람보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기를 중요해 보이게 꾸미며 빵이 없는 사람보다’라고도 옮길 수 있습니다. ‘스스로를 높이다’에 해당하는 히브리어는 자신을 존귀하게 보이게 하거나 중요하게 보이게 한다는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: …하는 것이 …보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 히브리어 잠언의 비교형을 한국어에서는 자연스러운 비교문으로 옮기는 것이 가장 적절합니다.
- source_word: נִקְלֶה
  english_pob_choice: one who is lightly esteemed
  chosen_korean: 가볍게 여겨지는 사람
  alternatives_korean:
  - 천대받는 사람
  - 경멸받는 사람
  - 낮게 여겨지는 사람
  lexicon: HALOT
  rationale: 사회적 명예가 낮게 평가되는 뉘앙스를 살리되, '경멸'처럼 감정적 적대까지는 과하게 넣지 않기 위해 '가볍게 여겨지는'을 택했습니다.
- source_word: וְעֶבֶד לוֹ
  english_pob_choice: and has a servant
  chosen_korean: 종을 두는 것이
  alternatives_korean:
  - 노예를 두는 것이
  - 종이 있는 것이
  - 하인을 두는 것이
  lexicon: HALOT
  rationale: 문맥상 종속 상태 자체보다 집안의 종을 거느릴 정도의 최소한의 형편을 가리키므로 '종'을 쓰되, 한국어 문맥에서는 소유 표현으로 풀어 자연스럽게 옮겼습니다.
- source_word: מִמְּתַכַּבֵּד
  english_pob_choice: one who honors himself
  chosen_korean: 스스로를 높이며
  alternatives_korean:
  - 스스로를 존귀하게 여기며
  - 스스로를 과시하며
  - 스스로를 중요하게 여기며
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 살리면서, 'honors himself'가 가진 자기고양/자기과시의 가능성을 한국어에서 자연스럽게 드러냈습니다.
- source_word: וַחֲסַר לָחֶם
  english_pob_choice: and lacks bread
  chosen_korean: 빵이 없는
  alternatives_korean:
  - 먹을 것이 없는
  - 양식이 없는
  - 떡이 없는
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 'bread'를 보존하되, 현대 한국어에서는 '빵'이 가장 직접적인 대응어이므로 채택했습니다.
theological_decisions:
- issue: 종(עֶבֶד) 표현의 사회적 뉘앙스
  chosen_reading: 문맥상 노예 제도를 논하는 구절이 아니라, 적어도 한 사람을 거느릴 정도의 미약한 가정 형편을 가리키는 표현으로 이해해 '종'을 유지했습니다.
  alternative_readings:
  - '''노예''로 직역해 지위의 종속성을 강하게 드러내는 읽기'
  - '''하인''으로 완화하는 읽기'
  rationale: 지혜문학의 대조는 신분제 논쟁이 아니라 명예와 결핍의 역설에 있으므로, 원문의 사회경제적 그림을 해치지 않는 범위에서 번역했습니다.
  doctrine_reference: 지혜문학의 사회적 관찰
