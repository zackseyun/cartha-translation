id: PRO.12.19
reference: Proverbs 12:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְֽׂפַת אֱ֭מֶת תִּכּ֣וֹן לָ/עַ֑ד וְ/עַד אַ֝רְגִּ֗יעָה לְשׁ֣וֹן שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/019.yaml
  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
  footnotes:
  - marker: a
    text: Or, more formally, 'The lip of truth is established forever, but the tongue of falsehood is only for a moment.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression in the second line is difficult; the sense is that false speech is short-lived in contrast to truth's permanence.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실한 입술은 영원히 굳게 서 있지만, 거짓말을 하는 혀는 잠깐뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘진리의 입술은 영원히 굳게 서 있지만, 거짓의 혀는 잠깐뿐입니다.’
    reason: lexical_alternative
  - marker: b
    text: 둘째 행의 히브리어 표현은 다소 어렵지만, 거짓 말은 진실의 지속성과 달리 짧게 지나간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  english_pob_choice: A truthful lip
  chosen_korean: 진실한 입술
  alternatives_korean:
  - 진리의 입술
  - 진실의 입술
  - 참된 입술
  lexicon: HALOT
  rationale: 히브리어의 단수 관용구를 살리되 한국어에서는 자연스럽게 복수 없이 ‘입술’로 옮기고, אֱמֶת는 문맥상 ‘진실한’으로 형용사화하는 것이 가장 간결합니다.
- source_word: תִּכּוֹן
  english_pob_choice: is established
  chosen_korean: 굳게 서 있지만
  alternatives_korean:
  - 세워집니다
  - 확립됩니다
  - 견고합니다
  lexicon: HALOT
  rationale: 프로버브의 현재적 진리성을 살리면서 ‘established’의 지속성과 견고함을 한국어 관용으로 전달하기 위해 ‘굳게 서 있다’로 옮겼습니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 항상
  lexicon: HALOT
  rationale: 지속의 극대치를 나타내는 부사로, 표준적이고 분명한 ‘영원히’가 מתאים합니다.
- source_word: אַרְגִּיעָה
  english_pob_choice: lasts only a moment
  chosen_korean: 잠깐뿐입니다
  alternatives_korean:
  - 한순간뿐입니다
  - 잠시뿐입니다
  - 순식간입니다
  lexicon: HALOT
  rationale: 어려운 표현이지만 문맥상 거짓 말의 짧은 지속을 가리키므로, ‘only a moment’의 의미를 자연스럽고 압축적으로 살리는 표현을 택했습니다.
- source_word: לְשׁוֹן שָׁקֶר
  english_pob_choice: a lying tongue
  chosen_korean: 거짓된 혀
  alternatives_korean:
  - 거짓말하는 혀
  - 거짓의 혀
  - 속이는 혀
  lexicon: HALOT
  rationale: ‘혀’는 지혜문학의 상투적 비유이므로 유지하고, שָׁקֶר의 특성을 ‘거짓된’으로 옮겨 ‘lying’의 성격을 드러냈습니다.
theological_decisions:
- issue: 대조 구조의 전달
  chosen_reading: 진실의 지속성과 거짓의 일시성을 강한 대조로 보이게 했습니다.
  alternative_readings:
  - ‘영원히’와 ‘순식간에’의 중립적 병렬
  - 보다 직역적인 ‘확립된다 / 잠깐이다’
  rationale: 본문의 핵심은 진실의 영속성과 거짓의 덧없음이므로, 한국어에서도 대비가 선명하게 드러나야 잠언의 수사력이 살아납니다.
  doctrine_reference: 잠언서의 지혜 격언, 진실과 거짓의 도덕적 대조
- issue: 히브리어 단수 관용구 보존
  chosen_reading: ‘입술’과 ‘혀’를 단수로 유지했습니다.
  alternative_readings:
  - ‘입술들’ ‘혀들’
  - 의미역으로 ‘말’ ‘발언’
  rationale: 히브리어의 신체 은유를 보존해야 본문의 관찰적이고 교훈적인 어조가 유지됩니다.
  doctrine_reference: 문학적-수사적 충실성
