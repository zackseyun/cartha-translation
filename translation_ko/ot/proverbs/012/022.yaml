  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
  footnotes:
  - marker: a
    text: Or 'those who practice faithfulness,' 'those who act truthfully,' or 'those who are trustworthy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓말하는 입술은 야훼께 가증한 것이지만, 신실하게 행하는 이들은 그의 기쁨입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '신실함을 실천하는 이들', '진실하게 행하는 이들', '신뢰할 만한 이들'.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  english_pob_choice: an abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 역겨운 것
  lexicon: HALOT
  rationale: יְהוָה 앞에 놓인 도덕적 혐오를 강하게 드러내는 표현으로, 전통적 교회어를 그대로 따르기보다 מקור의 윤리적 무게를 유지했습니다.
- source_word: שִׂפְתֵי שָׁקֶר
  english_pob_choice: lying lips
  chosen_korean: 거짓말하는 입술
  alternatives_korean:
  - 거짓의 입술
  - 거짓된 입술
  lexicon: HALOT
  rationale: 직역적 '거짓의 입술'보다 한국어에서 자연스러운 관용구로서 거짓말하는 행위를 분명히 드러냅니다.
- source_word: אֱמוּנָה
  english_pob_choice: faithfully
  chosen_korean: 신실하게
  alternatives_korean:
  - 믿음직하게
  - 진실하게
  - 신의 있게
  lexicon: HALOT
  rationale: 명사 אֱמוּנָה의 핵심 의미인 신실함, 신의, 신뢰성을 사람의 행위에 맞게 부사형으로 살렸습니다.
- source_word: רְצוֹנוֹ
  english_pob_choice: his delight
  chosen_korean: 그의 기쁨
  alternatives_korean:
  - 그의 즐거움
  - 그의 좋아하심
  - 그의 호의
  lexicon: HALOT
  rationale: 야훼의 반응을 단순한 '호의'보다 관계적이고 감정적인 '기쁨'으로 옮겨, 앞의 '가증한 것'과 대응시키는 대조를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사표지 יְהוָה를 제목화된 '주님'으로 돌리지 않고, 프로젝트 기준에 따라 고유명사 '야훼'로 옮겨 언약적 인격성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֱמוּנָה의 의미 범위
  chosen_reading: 신실하게 행하는 이들
  alternative_readings:
  - 진실하게 행동하는 이들
  - 믿음직하게 행하는 이들
  - 신실함을 실천하는 이들
  rationale: 이 속담은 단순한 사실 진술보다 삶의 태도와 행실의 충실성을 대조하므로, '행하는 이들'로 번역해 윤리적 실천을 강조했습니다.
  doctrine_reference: 'HALOT: אֱמוּנָה as faithfulness/trustworthiness'
