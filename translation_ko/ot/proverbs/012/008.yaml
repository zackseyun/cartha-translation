  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
  footnotes:
  - marker: a
    text: Or 'A man is praised in proportion to his prudence.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'twisted of heart,' an idiom for a morally crooked inner disposition.
    reason: cultural_note
translation:
  language: ko
  text: 사람은 자신의 통찰력에 따라 칭찬을 받지만, 마음이 비뚤어진 사람은 멸시를 받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용으로, 직역하면 “마음이 비뚤어진”이라는 뜻입니다. 도덕적으로 굽은 내면의 상태를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: “통찰력”은 히브리어 שֵׂכֶל의 의미 범위인 분별, 판단력, 이해를 아우르는 현대 한국어 표현입니다.
    reason: lexical_alternative
