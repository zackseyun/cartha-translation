  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
  footnotes:
  - marker: a
    text: Or 'A man is praised in proportion to his prudence.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'twisted of heart,' an idiom for a morally crooked inner disposition.
    reason: cultural_note
translation:
  language: ko
  text: 사람은 자신의 분별력에 따라[a] 칭찬을 받지만, 마음이 비뚤어진[b] 사람은 멸시를 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “통찰력”. 히브리어 שֵׂכֶל은 분별, 판단력, 이해를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로 “마음이 비뚤어진”. 도덕적으로 굽은 내면의 상태를 가리키는 표현입니다.
    reason: cultural_note
