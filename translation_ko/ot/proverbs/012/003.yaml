  terminology: ‘악으로’, ‘사람’, ‘의인들의 뿌리’는 각각 בְּרֶשַׁע, אָדָם, שֹׁרֶשׁ צַדִּיקִים를 충실히 반영합니다. 각주에서 ‘아담’은 음역보다 히브리어 אָדָם이라는 어휘 설명으로 제시하고, 영어가 남아 있던 ‘enduring’을 자연스러운 한국어로 바로잡았습니다.
