  source_fidelity: 수정이 필요합니다. 초안의 ‘악을 행하는 사람’은 בְּרֶשַׁע(‘악으로/악에 의해’)를 사람의 행위·정체성으로 바꾸어, 악이 견고함을 얻는 수단이 될 수 없다는 원문의 대조를 약화합니다. אָדָם의 단수 일반용법, צַדִּיקִים의 복수, 그리고 ‘뿌리’의 비유는 보존되어야 합니다.
