id: PRO.12.16
reference: Proverbs 12:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱוִ֗יל בַּ֭/יּוֹם יִוָּדַ֣ע כַּעְס֑/וֹ וְ/כֹסֶ֖ה קָל֣וֹן עָרֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
  footnotes:
  - marker: a
    text: Or 'A fool’s anger is known the same day'; Hebrew literally, 'in the day.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a prudent man conceals an insult/disgrace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람의 분노는 즉시 드러나지만, 신중한 사람은 수치를 가립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그날에’ 또는 ‘한날에’입니다. 속담적 문맥에서는 ‘즉시/바로’의 뜻으로 자연스럽게 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘덮다’의 동사를 써서 ‘수치/불명예’를 가리는 그림을 나타냅니다. 여기서는 직역적 은유를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 우매한 사람
  lexicon: HALOT
  rationale: 잠언 문맥에서 도덕적·실천적 어리석음을 가리키므로, 한국어로는 인격적 표현인 ‘어리석은 사람’이 자연스럽고 ‘fool’의 평가적 뉘앙스를 유지합니다.
- source_word: בַּיּוֹם יִוָּדַע
  english_pob_choice: at once
  chosen_korean: 즉시 드러나지만
  alternatives_korean:
  - 그날에 알려지지만
  - 바로 알게 되지만
  - 당일에 드러나지만
  lexicon: HALOT
  rationale: 직역하면 ‘그날에 알려지다’이지만, 속담적 표현에서는 분노가 곧바로 밖으로 드러난다는 뜻이어서 ‘즉시 드러나다’가 의미를 가장 자연스럽게 옮깁니다.
- source_word: כַּעְסוֹ
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 성냄
  lexicon: HALOT
  rationale: 이 어근은 단순한 짜증보다 강한 격정적 분노를 가리킬 수 있어, 대조되는 절제의 뉘앙스를 살리기 위해 ‘분노’로 옮겼습니다.
- source_word: כֹסֶה קָלוֹן
  english_pob_choice: covers shame
  chosen_korean: 수치를 가립니다
  alternatives_korean:
  - 수치를 덮습니다
  - 치욕을 숨깁니다
  - 모욕을 감춥니다
  lexicon: HALOT
  rationale: ‘덮다/가리다’의 은유를 살리면서 한국어에서 자연스러운 관용을 택해, 공개적 반응을 자제하고 수치를 드러내지 않는 태도를 표현했습니다.
- source_word: עָרוּם
  english_pob_choice: a prudent man
  chosen_korean: 신중한 사람
  alternatives_korean:
  - 슬기로운 사람
  - 지혜로운 사람
  - 영리한 사람
  lexicon: HALOT
  rationale: 잠언에서는 대체로 긍정적 의미의 분별과 조심성을 가리키므로, ‘신중한 사람’이 문맥상 절제와 숙고의 대비를 가장 잘 전달합니다.
theological_decisions:
- issue: 잠언의 대구법에서 ‘수치를 가린다’는 표현의 뉘앙스
  chosen_reading: 지혜로운 태도는 남의 수치나 불명예를 즉각 드러내지 않고 감싸는 절제를 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 타인의 모욕을 무시한다
  - 문제를 은폐한다
  rationale: 이 구절은 공적 갈등을 부추기기보다 지혜로운 자의 절제와 덮어 줌을 강조하므로, 부정적 의미의 은폐나 무관심으로 좁히지 않았습니다.
  doctrine_reference: 잠언의 지혜-어리석음 대조
- issue: ‘어리석은 사람’의 성별 표지
  chosen_reading: 히브리어 남성 단수형을 한국어 일반 표현으로 옮겨 ‘어리석은 사람’으로 처리했습니다.
  alternative_readings:
  - 어리석은 남자
  - 어리석은 자
  rationale: 대표적 남성형이지만 한국어에서는 성별을 과도하게 강조하지 않는 일반 명사형이 본문의 인격 대조를 더 자연스럽게 전달합니다.
  doctrine_reference: 문법적 성별과 대표성
