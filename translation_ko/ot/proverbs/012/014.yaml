    issue: פִי를 ‘입술’로 번역함
    rationale: 히브리어 פִי는 ‘입’이며, ‘입술’에 해당하는 별도 어휘가 아닙니다. 비유적 표현은 유지하되 ‘입의 열매’로 옮기는 것이 정확합니다.
  - severity: medium
    issue: ‘사람의 손의 보응’이라는 표현의 부자연스러움과 연결 관계의 불명확성
    rationale: גְמוּל יְדֵי אָדָם은 사람이 손으로 행한 일에 따라 돌아오는 대가를 뜻합니다. ‘손으로 한 일의 대가’는 이 관계를 자연스럽고 충실하게 표현합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓여 선행어가 불명확함
    rationale: 일반성 각주는 ‘사람’에, 어휘 각주는 ‘대가’에 각각 붙여 참조 대상을 분명히 하는 편이 좋습니다.
