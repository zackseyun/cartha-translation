id: PRO.12.14
reference: Proverbs 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
  footnotes:
  - marker: a
    text: Hebrew 'a man' in both lines uses singular masculine terms generically; the proverb states a general truth about people.
    reason: cultural_note
  - marker: b
    text: Or 'the recompense of a man's hands returns to him.' The Hebrew term can emphasize what one's actions earn or bring back.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람[a]은 자기 입의 열매로 좋은 것으로 만족을 얻고, 사람이 손으로 한 일의 대가[b]는 그에게 돌아옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘사람’은 두 행 모두 단수 남성형이지만, 이 격언은 특정 남자가 아니라 사람 일반에 대한 진리를 말합니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 גְמוּל은 ‘대가’ 외에도 행위에 따라 되돌아오는 보응이나 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי
  english_pob_choice: From the fruit of
  chosen_korean: 입술의 열매로
  alternatives_korean:
  - 입의 열매로
  - 말의 열매로
  lexicon: HALOT
  rationale: מִן은 여기서 출처를 나타내므로 ‘~로’로 풀고, פְּרִי의 비유를 살려 ‘열매’로 옮겼습니다. מקביל어인 ‘입’보다 한국어에서 자연스러운 ‘입술’을 택해 말의 결과라는 이미지를 유지했습니다.
- source_word: פִי אִישׁ
  english_pob_choice: a man's mouth
  chosen_korean: 사람의 입술
  alternatives_korean:
  - 한 사람의 입
  - 한 사람의 입술
  lexicon: HALOT
  rationale: אִישׁ과 אָדָם이 모두 대표적 단수로 쓰여 일반 진리를 말하므로, 성중립화하기보다 문맥상 자연스러운 일반 표현인 ‘사람’으로 옮겼습니다. ‘입술’은 직접적인 발화 기관을 드러내어 시적 평행을 살립니다.
- source_word: יְדֵי אָדָם
  english_pob_choice: a man's hands
  chosen_korean: 사람의 손
  alternatives_korean:
  - 한 사람의 손
  - 인간의 손
  lexicon: HALOT
  rationale: ‘hands of a man/human’의 일반성을 살려 ‘사람의 손’으로 옮겼습니다. 첫 행과 맞춰 대표적 단수라는 점을 유지하면서도 한국어에서 과도하게 남성 중심으로 들리지 않게 했습니다.
- source_word: גְמוּל
  english_pob_choice: the recompense
  chosen_korean: 보응
  alternatives_korean:
  - 대가
  - 갚음
  - 보상
  lexicon: HALOT
  rationale: גְמוּל은 행위에 대한 되돌림, 보응, 보수를 뜻하므로 ‘보응’이 가장 직접적입니다. POB의 보응/recompense 방향을 따르되, ‘보상’처럼 완화된 뉘앙스는 피했습니다.
theological_decisions:
- issue: 격언의 일반 진리 표현과 인칭의 보편성
  chosen_reading: ‘사람’으로 옮겨, 특정 개인이 아니라 누구에게나 적용되는 일반 진리로 읽히게 했습니다.
  alternative_readings:
  - 한 사람
  - 어떤 사람
  - 인간
  rationale: 히브리어는 단수 남성형을 쓰지만 지시 대상은 보편적입니다. 본문의 도덕적 원리—말과 행위가 자신에게 돌아온다는 사실—를 흐리지 않기 위해 일반화하되, 원문의 대표적 단수성을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אִישׁ / אָדָם
