  to: 사람[a]은 자기 입의 열매로 좋은 것으로 만족을 얻고, 사람이 손으로 한 일의 대가[b]는 그에게 돌아옵니다.
  rationale: 원문의 ‘입’과 ‘열매’ 비유, 좋은 것으로 만족하게 되는 결과, 그리고 손으로 한 일의 대가가 자신에게 되돌아온다는 평행 구조를 보존했습니다. ‘대가’는 긍정적 보상과 부정적 보응 어느 한쪽으로 의미를 한정하지 않아 גְמוּל의 문맥상 넓은 의미를 유지합니다.
