  verdict: revise
  source_fidelity: 개정이 필요합니다. פִי는 ‘입’이지 ‘입술’이 아니므로 ‘입의 열매’로 옮기는 것이 원문에 더 가깝습니다. 또한 גְמוּל은 손 자체가 아니라 손으로 행한 일에 따라 돌아오는 대가/보응을 가리키므로, 한국어의 어색한 ‘사람의 손의 보응’보다 ‘손으로 한 일의 대가’가 원문의 인과 관계를 정확히 드러냅니다.
  naturalness: 현 문장의 ‘사람의 입술의 열매로 그는’은 일반적 격언 문맥에서 지시가 다소 불명확하고, ‘사람의 손의 보응’은 현대 한국어에서 부자연스럽습니다. ‘사람은 자기 입의 열매로 …, 사람이 손으로 한 일의 대가는 …’으로 하면 자연스럽고 격언의 보편적 적용도 분명해집니다.
  terminology: ‘입술’은 פִי의 직접 대응어가 아니므로 ‘입’으로 바로잡습니다. גְמוּל에 대해서는 한국어 ‘보응’이 주로 부정적 응보를 연상시킬 수 있으므로, 문맥의 넓은 결과·되돌림의 의미를 보존하는 ‘대가’를 사용하고 각주에서 가능한 의미 범위를 밝힙니다.
  issues:
