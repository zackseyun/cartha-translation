revisions:
- from: 부지런한 자의 손은 다스리게 되지만, 게으른 자는 강제 노역에 종속됩니다.[a]
  to: 부지런한 사람의 손은 다스리지만, 게으른 사람은 강제 노역을 하게 됩니다.[a]
  rationale: 원문의 일반적 결과 진술에 맞추어 ‘다스리게 되지만’을 ‘다스리지만’으로 다듬고, 부자연스러운 ‘강제 노역에 종속됩니다’를 원문의 לָמַס가 나타내는 부역 부과의 의미에 맞는 ‘강제 노역을 하게 됩니다’로 고쳤습니다. 각주는 מַס의 부역 의미를 더 직접적으로 설명하도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:43:07Z'
