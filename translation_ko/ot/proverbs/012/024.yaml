id: PRO.12.24
reference: Proverbs 12:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
  footnotes:
  - marker: a
    text: Or 'laziness' for 'slackness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew מַס refers to compulsory labor service, sometimes called corvée or tribute labor.
    reason: cultural_note
translation:
  language: ko
  text: 부지런한 자의 손은 다스리게 되지만, 게으른 자는 강제 노역에 종속됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַס는 부역이나 강제 노역을 뜻하는 말로, 단순한 금전적 조세를 가리키지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  english_pob_choice: hand
  chosen_korean: 손
  alternatives_korean:
  - 권세
  - 역량
  - 힘
  lexicon: HALOT
  rationale: 히브리어의 구체적 ‘손’을 그대로 살려 행위 주체와 능력의 비유를 보존했습니다.
- source_word: חָרוּצִים
  english_pob_choice: the diligent
  chosen_korean: 부지런한 자
  alternatives_korean:
  - 근면한 자
  - 성실한 자
  - 일찍이 힘쓰는 자
  lexicon: HALOT
  rationale: 잠언에서 지혜적 성품을 가리키는 표현으로, 영어 POB의 ‘the diligent’에 맞춰 인물 지시를 드러냈습니다.
- source_word: תִּמְשׁוֹל
  english_pob_choice: will rule
  chosen_korean: 다스리게 되지만
  alternatives_korean:
  - 통치하게 되지만
  - 권세를 잡게 되지만
  - 다스릴 것입니다
  lexicon: HALOT
  rationale: משׁל의 기본 의미인 ‘다스리다/통치하다’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: רְמִיָּה
  english_pob_choice: slackness / the slack
  chosen_korean: 게으른 자
  alternatives_korean:
  - 느슨한 자
  - 나태한 자
  - 게으름
  lexicon: HALOT
  rationale: 문맥상 근면한 자와 대조되는 사람을 가리키므로, 추상명사보다 인물형으로 풀어 대비를 분명히 했습니다.
- source_word: מַס
  english_pob_choice: forced labor
  chosen_korean: 강제 노역
  alternatives_korean:
  - 부역
  - 노역
  - 강제 노동
  lexicon: HALOT
  rationale: מַס가 단순 세금이 아니라 부과된 강제 노동 서비스라는 점을 반영해, 사회적 강제를 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 잠언의 인과적 지혜 진술을 한국어에서 과도하게 약화하지 않는 문제
  chosen_reading: 근면은 지배/책임의 자리에 이르게 하고, 나태는 강제된 종속 상태로 떨어뜨리는 지혜의 일반 법칙으로 읽었습니다.
  alternative_readings:
  - 도덕적 격언으로 완화해 일반적 교훈만 전달
  - ‘다스리다’를 단순한 성공으로 순화
  rationale: 히브리어 병행은 삶의 실제 결과를 강하게 대비하므로, 그 긴장과 경고를 유지했습니다.
  doctrine_reference: 잠언 문학의 지혜-행위 상응 원리
- issue: מַס의 사회적 강제성 표현
  chosen_reading: ‘강제 노역’으로 옮겨, 압박과 종속의 현실을 분명히 했습니다.
  alternative_readings:
  - 부역
  - 세금
  - 공역
  rationale: POB의 공시적 주석이 가리키는 corvée 성격을 반영해, 단순 재정 부담으로 오해되지 않게 했습니다.
  doctrine_reference: 출애굽/열왕기 문맥의 부역 개념
