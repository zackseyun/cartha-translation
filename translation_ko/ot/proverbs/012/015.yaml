  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
  footnotes:
  - marker: a
    text: Or 'The way of a fool seems right to him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in his own eyes,' an idiom for one's own judgment or self-assessment.
    reason: cultural_note
translation:
  language: ko
  text: 어리석은 자의 길은 자기 눈에 바릅니다. 그러나 권고를 듣는 자는 지혜롭습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 자기 판단이나 자기 평가를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘바릅니다’는 여기서 도덕적 완전성이 아니라 ‘옳다고 여김/타당하다고 판단함’의 관용적 뜻을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 삶의 길
  - 행위
  lexicon: HALOT
  rationale: 지혜문학의 비유적 표현인 삶의 행로를 한국어로 자연스럽게 살리기 위해 ‘길’을 택했습니다.
- source_word: אֱוִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 미련한 자
  - 바보
  lexicon: HALOT
  rationale: 잠언에서의 도덕적·지혜적 결핍을 드러내면서도 구어적 비하를 줄이기 위해 ‘어리석은 자’로 옮겼습니다.
- source_word: יָשָׁר בְּעֵינָיו
  english_pob_choice: right in his own eyes
  chosen_korean: 자기 눈에 바릅니다
  alternatives_korean:
  - 자기 눈에는 옳습니다
  - 스스로 옳다고 여깁니다
  - 자기 판단에 옳습니다
  lexicon: HALOT
  rationale: 직역하면 ‘자기 눈에 옳다’이지만, 한국어에서는 판단·평가의 관용적 뉘앙스를 살려 ‘자기 눈에 바르다’로 자연스럽게 표현했습니다.
- source_word: שֹׁמֵעַ לְעֵצָה
  english_pob_choice: he who listens to counsel
  chosen_korean: 권고를 듣는 자
  alternatives_korean:
  - 충고를 듣는 사람
  - 조언에 귀 기울이는 자
  - 권고에 귀 기울이는 자
  lexicon: HALOT
  rationale: ‘권고/충고’는 지혜문학의 सलाह적 문맥을 잘 살리며, 분사구문을 한국어의 보편적 주어 표현인 ‘-는 자’로 옮겼습니다.
- source_word: חָכָם
  english_pob_choice: is wise
  chosen_korean: 지혜롭습니다
  alternatives_korean:
  - 지혜 있습니다
  - 지혜로운 자입니다
  - 슬기롭습니다
  lexicon: HALOT
  rationale: 형용사 서술을 한국어의 자연스러운 합쇼체로 풀어, 대조 구조를 분명하게 했습니다.
theological_decisions:
- issue: 잠언의 일반적 진술에서 남성 단수 표현의 처리
  chosen_reading: 한국어에서는 문법적 성별이 없으므로 ‘어리석은 자’와 ‘듣는 자’로 대표적 단수를 유지했습니다.
  alternative_readings:
  - 어리석은 사람의 길은 자기 눈에 바릅니다
  - 누구든지 권고를 들으면 지혜롭습니다
  rationale: 히브리어의 남성 단수 일반용법을 무리하게 중성화하지 않되, 한국어에서는 독자적 성별 표지 없이 대표적 인물을 그대로 드러내는 방식이 원문과 가장 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
