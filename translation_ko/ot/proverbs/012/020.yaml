id: PRO.12.20
reference: Proverbs 12:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֭רְמָה בְּ/לֶב חֹ֣רְשֵׁי רָ֑ע וּֽ/לְ/יֹעֲצֵ֖י שָׁל֣וֹם שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
  footnotes:
  - marker: a
    text: Or 'but to those who counsel peace, there is joy.'
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being or wholeness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 꾸미는 자들의 마음에는 기만이 있고, 평화를[a] 권하는 자들에게는 기쁨이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평화’로 옮긴 히브리어 ‘샬롬’은 문맥에 따라 ‘평안’이나 ‘온전함’의 뉘앙스도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  english_pob_choice: Deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 속임
  lexicon: HALOT
  rationale: 내면의 부정직한 상태를 가리키는 명사로, 한국어에서는 ‘속임수’가 짧고 자연스럽게 그 성격을 드러냅니다.
- source_word: בְּלֶב
  english_pob_choice: is in the heart of
  chosen_korean: 마음에는
  alternatives_korean:
  - 마음속에는
  - 심장에는
  lexicon: HALOT
  rationale: 히브리어 ‘심장’은 사고와 의도의 중심을 뜻하므로, 현대 한국어에서는 ‘마음’이 가장 자연스럽게 대응합니다.
- source_word: חֹרְשֵׁי רָע
  english_pob_choice: those who devise evil
  chosen_korean: 악을 꾸미는 자들
  alternatives_korean:
  - 악을 모의하는 자들
  - 악을 계획하는 자들
  lexicon: HALOT
  rationale: 분사형은 단순 행위보다 의도적으로 악한 계략을 짜는 뉘앙스가 강해 ‘꾸미는’이 가장 근접합니다.
- source_word: יֹעֲצֵי שָׁלוֹם
  english_pob_choice: those who counsel peace
  chosen_korean: 평화를 권하는 자들
  alternatives_korean:
  - 평화를 सलाह하는 자들
  - 평화를 조언하는 자들
  lexicon: HALOT
  rationale: ‘יֹעֲצֵי’는 조언하는 자들을 뜻하므로, 한국어에서는 관계를 이루고 화평을 도모하는 뜻을 살려 ‘권하는 자들’로 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평화
  alternatives_korean:
  - 평안
  - 온전함
  lexicon: HALOT
  rationale: 이 잠언의 대조 구조에서는 ‘평화’가 가장 직관적이며, 샬롬의 넓은 의미는 문맥상 보존되되 본문에는 간결하게 반영하는 것이 적절합니다.
- source_word: שִׂמְחָה
  english_pob_choice: joy belongs to
  chosen_korean: 기쁨이 있습니다
  alternatives_korean:
  - 기쁨이 있습니다
  - 기쁨이 그들에게 있습니다
  lexicon: HALOT
  rationale: 서술어가 없는 명사절이므로 한국어에서는 존재 구문으로 풀어 주는 것이 자연스럽고, 앞 절과의 대조도 선명해집니다.
