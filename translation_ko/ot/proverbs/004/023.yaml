review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the imperative to guard the heart and the causal relation. However, “가장 지킬 만한 것보다 더욱” changes the Hebrew noun ‘guarding/keeping’ into ‘things worth guarding’ and is not idiomatic Korean. The final clause is better expressed with ‘생명의 근원’ in Korean, which naturally conveys the Hebrew image of life’s outlets/sources without suggesting several literal springs.
  naturalness: “모든 것을 지키는 일보다 네 마음을 더 지키십시오” is natural modern formal-polite Korean and retains the comparative priority and the guarding wordplay. Repeating “마음” in the explanatory clause is clearer and more natural than “그 마음.”
  terminology: “마음” appropriately retains the Hebrew anthropological term. “생명의 근원” is established, comprehensible Korean and represents תּוֹצְאוֹת (‘outlets/sources’) without importing doctrinal interpretation. The footnotes have been rewritten in idiomatic Korean; ‘생명의 이슈들’ and ‘나감들’ are not suitable Korean lexical alternatives.
  issues:
  - severity: medium
    issue: The comparative phrase ‘가장 지킬 만한 것보다 더욱’ is semantically and stylistically inaccurate.
    rationale: מִכָּל מִשְׁמָר means ‘above/more than all guarding (or keeping),’ not ‘more than the thing most worth guarding.’ The proposed revision preserves the comparison with guarding itself.
  - severity: low
    issue: ‘생명의 샘들이 나옵니다’ is understandable but somewhat unnatural and overly literal in Korean.
    rationale: The Hebrew noun can mean outlets, outgoings, or sources. ‘생명의 근원이 마음에서 나오기 때문입니다’ is idiomatic Korean while preserving the source image and explanatory force.
  - severity: medium
    issue: Footnote b contains unnatural or nonstandard Korean alternatives (‘나감들,’ ‘생명의 이슈들’).
    rationale: Notes should clarify lexical possibilities in standard Korean. ‘생명의 근원/생명이 흘러나오는 곳’ accurately conveys the alternatives.
  revised_text: 모든 것을 지키는 일보다 네 마음을 더 지키십시오. 생명의 근원이 마음에서 나오기 때문입니다.[a][b]
