revisions:
- from: 가장 지킬 만한 것보다 더욱 네 마음을 지키십시오. 그 마음에서 생명의 샘들이 나옵니다.[a][b]
  to: 모든 것을 지키는 일보다 네 마음을 더 지키십시오. 생명의 근원이 마음에서 나오기 때문입니다.[a][b]
  rationale: The revision replaces an awkward and slightly shifted comparison with a Korean expression that directly compares guarding one’s heart with every other act of guarding. It also uses idiomatic Korean for the Hebrew metaphor of life’s sources/outlets and corrects the explanatory notes, while retaining ‘마음,’ the imperative, and the causal connection.
