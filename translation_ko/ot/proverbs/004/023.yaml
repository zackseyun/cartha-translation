  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽ/כָּל מִ֭שְׁמָר נְצֹ֣ר לִבֶּ֑/ךָ כִּֽי מִ֝מֶּ֗/נּוּ תּוֹצְא֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
  footnotes:
  - marker: a
    text: Or 'Guard your heart more than anything you guard.' The Hebrew literally says 'above all guarding, guard your heart,' emphasizing supreme vigilance.
    reason: lexical_alternative
  - marker: b
    text: Or 'for from it are the sources/outgoings of life.' Traditional English 'issues of life' reflects the same Hebrew expression but is less clear in modern usage.
    reason: lexical_alternative
translation:
  language: ko
  text: 가장 지킬 만한 것보다 더욱 네 마음을 지키십시오. 그 마음에서 생명의 샘들이 나옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무엇보다도 네가 지키는 것보다 네 마음을 지키라’입니다. 히브리어는 문자적으로 ‘모든 지킴 위에 네 마음을 지키라’라고 하며, 최고의 경계를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 마음에서 생명의 근원들/나감들이 나옵니다’입니다. 전통적인 ‘생명의 이슈들’은 같은 히브리어 표현을 반영하지만 오늘 한국어에서는 덜 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  english_pob_choice: more than all guarding
  chosen_korean: 가장 지킬 만한 것보다 더욱
  alternatives_korean:
  - 무엇보다도
  - 모든 지킴보다
  - 지키는 모든 것보다
  lexicon: HALOT
  rationale: 히브리어의 מן 비교 용법과 מִשְׁמָר의 ‘지킴/보호’ 의미를 살려, 우선순위의 극대화를 자연스러운 한국어로 옮겼습니다.
- source_word: נְצֹר
  english_pob_choice: Guard
  chosen_korean: 지키십시오
  alternatives_korean:
  - 보호하십시오
  - 감시하십시오
  - 간수하십시오
  lexicon: HALOT
  rationale: 명령형의 긴박함을 유지하면서도 한국어에서 가장 자연스럽고 포괄적인 보호 행위를 나타내는 동사로 옮겼습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속사람
  - 네 중심
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 감정만이 아니라 사고와 의지의 중심을 가리키므로, 이를 문자 그대로 살리되 한국어에서는 ‘마음’이 가장 넓은 의미를 전달합니다.
- source_word: תּוֹצְאוֹת חַיִּים
  english_pob_choice: the springs of life
  chosen_korean: 생명의 샘들이
  alternatives_korean:
  - 생명의 근원들이
  - 생명의 흐름들이
  - 생명의 나감들이
  lexicon: HALOT
  rationale: POB가 제시한 ‘springs’는 출구/샘의 이미지를 살린 해석이므로, 생명이 솟아나오는 비유를 한국어의 ‘샘들’로 옮겨 원문의 시각적 힘을 보존했습니다.
theological_decisions:
- issue: ‘마음’의 인류학적 범위
  chosen_reading: ‘마음’을 감정으로만 좁히지 않고 사고·의지·정서의 중심으로 그대로 유지했습니다.
  alternative_readings:
  - 생각
  - 속사람
  - 내면
  rationale: 잠언의 히브리 인류학을 보존해야 하므로, 전통적 교회어휘의 좁은 정서 중심 해석으로 환원하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
