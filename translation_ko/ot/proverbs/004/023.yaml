  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
  footnotes:
  - marker: a
    text: Or 'Guard your heart more than anything you guard.' The Hebrew literally says 'above all guarding, guard your heart,' emphasizing supreme vigilance.
    reason: lexical_alternative
  - marker: b
    text: Or 'for from it are the sources/outgoings of life.' Traditional English 'issues of life' reflects the same Hebrew expression but is less clear in modern usage.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 것을 지키는 일보다 네 마음을 더 지키십시오. 생명의 근원이 마음에서 나오기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무엇보다도 네 마음을 지키십시오’라고 할 수 있습니다. 히브리어는 문자적으로 ‘모든 지킴보다 네 마음을 지키라’라고 하여, 마음을 지키는 일을 가장 우선해야 함을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마음에서 생명의 샘들’ 또는 ‘생명이 흘러나오는 곳’이라고 할 수 있습니다. 히브리어 표현은 생명이 흘러나오는 출구나 근원을 가리킬 수 있습니다.
    reason: lexical_alternative
