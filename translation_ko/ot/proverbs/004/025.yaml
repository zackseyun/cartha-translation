  text: עֵ֭ינֶי/ךָ לְ/נֹ֣כַח יַבִּ֑יטוּ וְ֝/עַפְעַפֶּ֗י/ךָ יַיְשִׁ֥רוּ נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/025.yaml
  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
  footnotes:
  - marker: a
    text: Or 'Let your eyelids be straight before you.' The Hebrew verb can more literally express straightness.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 눈은 곧장 앞을 바라보고, 네 눈꺼풀은 네 앞을 똑바로 향하게 하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곧장’은 לְנֹכַח의 방향성을 살린 표현이며, 히브리어는 문자적으로 ‘앞에/마주하여’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  english_pob_choice: your eyes
  chosen_korean: 네 눈은
  alternatives_korean:
  - 네 눈
  - 네 눈들이
  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유격이 붙은 신체 부위를 자연스러운 한국어로 복수형 없이도 가능하지만, 병행구와 리듬을 살리기 위해 ‘네 눈은’으로 옮겼습니다.
- source_word: לְנֹכַח יַבִּיטוּ
  english_pob_choice: look straight ahead
  chosen_korean: 곧장 앞을 바라보고
  alternatives_korean:
  - 바로 앞을 보고
  - 정면을 바라보고
  lexicon: HALOT
  rationale: לְנֹכַח은 ‘앞에, 마주하여’의 뜻이므로 방향성과 직진성을 살린 ‘곧장 앞을’이 가장 자연스럽습니다. יַבִּיטוּ는 단순한 응시보다 ‘바라보다’가 문맥에 잘 맞습니다.
- source_word: וְעַפְעַפֶּיךָ יַיְשִׁרוּ נֶגְדֶּךָ
  english_pob_choice: and your eyelids be directed before you
  chosen_korean: 네 눈꺼풀은 네 앞을 똑바로 향하게 하라
  alternatives_korean:
  - 네 눈꺼풀은 네 앞에서 곧게 하라
  - 네 눈꺼풀은 네 앞을 곧게 하라
  lexicon: HALOT
  rationale: 히브리어는 ‘눈꺼풀’과 ‘곧게 하다/세우다’의 시적 병행을 유지하므로, 이를 평이하게 풀어 ‘똑바로 향하게 하라’로 옮겼습니다. נֶגְדֶּךָ는 ‘네 앞’을 뜻하므로 이를 분명히 반영했습니다.
theological_decisions:
- issue: 지혜 문학의 명령형 어조
  chosen_reading: 권면형 명령으로 그대로 살려 ‘하라’를 사용했습니다.
  alternative_readings:
  - 권면형 청유로 완화
  - 설명문으로 바꿈
  rationale: 잠언의 교훈적 직설을 약화하지 않기 위해, 히브리어의 명령/지시 어조를 한국어 명령형으로 보존했습니다.
  doctrine_reference: 지혜문학의 수사와 권면 기능
