  - 설명문으로 바꿈
  rationale: 잠언의 교훈적 직설을 약화하지 않기 위해, 히브리어의 명령/지시 어조를 한국어 명령형으로 보존했습니다.
  doctrine_reference: 지혜문학의 수사와 권면 기능
