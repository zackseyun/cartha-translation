revisions:
- from: 그들은 악을 행하지 않고서는 잠들지 못하며, 사람을 걸려 넘어지게 하지 않고서는 잠이 그들에게서 빼앗깁니다.[a]
  to: 이는 그들이 악을 행하지 않고서는 잠을 자지 않으며, 사람을 걸려 넘어지게 하지 않고서는 그들의 잠이 빼앗기기 때문입니다.[a]
  rationale: 인과 접속사 כִּי를 명시하고, ‘잠들지 못하다’의 추가된 불능 뉘앙스를 피하도록 수정했습니다. 둘째 절에서는 히브리어의 수동 표현을 유지했으며, 논쟁 가능한 יכשולו의 대안 독법은 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:37:40Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 כִּי는 앞선 권면의 이유를 제시하는 접속사이므로, 단순 병렬 연결인 ‘-며’보다 ‘이는 … 때문입니다’로 드러내는 편이 낫습니다. 또한 יִשְׁנוּ는 ‘잠들지 못하다’보다 ‘잠을 자지 않다’가 부정 미완료형의 습관적 진술을 덜 해석적으로 보존합니다. 둘째 절의 수동 표현과, יכשולו의 가능한 대안 독법은 유지했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 앞 문맥을 설명하는 잠언의 논증적 흐름에도 맞습니다. ‘그들의 잠이 빼앗깁니다’는 수동형을 보존하면서도 이해 가능합니다.
  terminology: ‘악을 행하다’는 목적어가 명시되지 않은 יָרֵעוּ의 넓은 도덕적 의미를 적절히 보존합니다. ‘사람을 걸려 넘어지게 하다’는 본문의 타인 해침 독법을 반영하되, 대안은 각주에 남깁니다.
  issues:
  - severity: medium
    issue: כִּי의 인과 관계가 ‘-며’로 충분히 나타나지 않습니다.
    rationale: 히브리어는 앞 절에 대한 이유를 도입합니다. 병렬 연결은 그 논리 관계를 약화시키므로, ‘이는 … 때문입니다’가 더 충실합니다.
  - severity: low
    issue: ‘잠들지 못하며’는 단순 부정 진술에 불능의 뉘앙스를 더합니다.
    rationale: יִשְׁנוּ는 일반적으로 ‘잠을 자다’이며, 여기서는 악행 전에는 잠을 자지 않는 습관적 상태를 말합니다. ‘잠을 자지 않다’가 더 직접적입니다.
  revised_text: 이는 그들이 악을 행하지 않고서는 잠을 자지 않으며, 사람을 걸려 넘어지게 하지 않고서는 그들의 잠이 빼앗기기 때문입니다.[a]
