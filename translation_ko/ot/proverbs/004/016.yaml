id: PRO.4.16
reference: Proverbs 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
  footnotes:
  - marker: a
    text: Or, 'unless they themselves stumble.' The Hebrew form is brief and has been understood either as causing another to stumble or as stumbling themselves; the context favors harm done to others.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그들이 악을 행하지 않고서는 잠을 자지 않으며, 사람을 걸려 넘어지게 하지 않고서는 그들의 잠이 빼앗기기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 걸려 넘어지지 않고서는.’ 히브리어 형태는 짧아서, 타인을 넘어지게 한다는 뜻과 그들 자신이 넘어지는 뜻으로 모두 읽힐 수 있으나, 문맥은 타인에게 해를 끼치는 뜻을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -며
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞 절의 이유를 잇는 접속으로, 한국어에서는 문장 초두의 설명 기능을 자연스럽게 살리는 연결 어미가 적절합니다.
- source_word: יִשְׁנוּ
  english_pob_choice: they do not sleep
  chosen_korean: 잠들지 못하며
  alternatives_korean:
  - 잠자지 않으며
  - 잠을 자지 않으며
  lexicon: HALOT
  rationale: 단순한 상태 진술보다 반복적·습관적 불면의 뉘앙스를 살려 ‘잠들지 못하다’로 옮겼습니다.
- source_word: יָרֵעוּ
  english_pob_choice: they have done evil
  chosen_korean: 악을 행하지 않고서는
  alternatives_korean:
  - 악을 행한 뒤에야
  - 악을 저지르지 않고서는
  - 해를 끼치지 않고서는
  lexicon: HALOT
  rationale: 히브리어는 목적어가 생략된 넓은 악행을 가리키므로, 과도하게 구체화하지 않고 도덕적 행위를 드러내는 표현을 택했습니다.
- source_word: יכשולו
  english_pob_choice: they make someone stumble
  chosen_korean: 사람을 걸려 넘어지게 하지 않고서는
  alternatives_korean:
  - 사람을 넘어뜨리지 않고서는
  - 사람을 실족하게 하지 않고서는
  - 자신들이 걸려 넘어지지 않고서는
  lexicon: HALOT
  rationale: 문맥상 다른 사람에게 해를 끼치는 뜻이 우세하므로, ‘걸려 넘어지게 하다’로 비유를 보존했습니다.
theological_decisions:
- issue: יכשולו의 주체-목적 구조
  chosen_reading: 타인을 넘어지게 하는 행위로 읽어 본문 흐름을 따름
  alternative_readings:
  - 그들 자신이 걸려 넘어지는 뜻
  rationale: 잠언의 병렬 구조와 악인에 대한 묘사는 남에게 해를 끼친 뒤에야 잠든다는 의미를 더 잘 지지하므로, 본문 의미를 반영해 본문에 두고 다른 읽기는 각주로 남깁니다.
  doctrine_reference: Translation philosophy §3
