  - 깨달음
  lexicon: HALOT
  rationale: בִינָה는 지혜문학에서 분별과 이해를 아우르므로, 현대 한국어에서 기능을 가장 분명히 드러내는 ‘이해력’을 선택했습니다.
theological_decisions:
- issue: 지혜의 ‘시작’이 시간적 순서인지, 또는 최고 우선순위인지
  chosen_reading: 본문은 지혜를 추구하는 첫 단계이자 가장 중요한 원리로 말하며, 한국어 본문에서는 이를 열거형 설명으로 풀지 않고 ‘시작은 이러합니다’로 남겼습니다.
  alternative_readings:
  - 지혜의 으뜸은 이것입니다
  - 지혜의 첫째는 이것입니다
  rationale: 히브리어 רֵאשִׁית는 문맥에 따라 ‘처음’과 ‘주된 것’을 모두 열 수 있으므로, 한쪽으로만 고정해 신학적/해석적 긴장을 지우지 않도록 했습니다.
  doctrine_reference: 잠언의 지혜 전승과 히브리어 어휘의 다의성
- issue: ‘모든 소유’의 범위를 재산으로 좁힐지 여부
  chosen_reading: ‘당신이 가진 모든 것’으로 넓게 옮겨 물질적 재산에만 한정되지 않는 총체적 헌신의 요구를 드러냈습니다.
  alternative_readings:
  - 당신의 모든 재산으로
  - 당신의 모든 소유로
  rationale: קִנְיָן은 재산을 가리킬 수 있지만, 문맥상 지혜를 얻기 위해 전부를 걸라는 압박이 핵심이므로 범위를 너무 좁히지 않는 표현이 더 적절합니다.
  doctrine_reference: 잠언의 지혜 훈계와 총체적 헌신
