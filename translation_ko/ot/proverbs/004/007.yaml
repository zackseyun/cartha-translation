  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
  footnotes:
  - marker: a
    text: Or, 'Wisdom is the principal thing; therefore acquire wisdom,' preserving רֵאשִׁית in the sense of 'chief' or 'first importance.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'with all your acquisition' or 'with all your possessions'; the wording likely plays on the repeated verb 'acquire.'
    reason: lexical_alternative
translation:
  language: ko
  text: '지혜의 시작은 이러합니다: 지혜를 얻으십시오[a]. 그리고 당신이 가진 모든 것으로 이해력을 얻으십시오[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜가 가장 중요합니다. 그러므로 지혜를 얻으십시오.’ רֵאשִׁית를 ‘첫째’나 ‘으뜸’의 뜻으로 읽는 해석입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘당신의 모든 획득물로’ 또는 ‘당신의 모든 소유로’도 뜻할 수 있으며, 반복되는 동사 ‘얻으십시오’와 말놀이를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁ֣ית
  english_pob_choice: The beginning of
  chosen_korean: 지혜의 시작은 이러합니다
  alternatives_korean:
  - 지혜의 첫째는
  - 지혜의 으뜸은
  - 지혜의 근본은
  lexicon: HALOT
  rationale: רֵאשִׁית는 단순한 시간적 시작뿐 아니라 우선성/주된 성격도 담을 수 있어, 한국어에서는 본문 도입의 기능을 살려 ‘시작은 이러합니다’로 옮겼습니다.
- source_word: קְנֵ֣ה / קְנֵ֣ה
  english_pob_choice: acquire / acquire
  chosen_korean: 얻으십시오 / 얻으십시오
  alternatives_korean:
  - 사십시오 / 사십시오
  - 획득하십시오 / 획득하십시오
  - 갖으십시오 / 갖으십시오
  lexicon: HALOT
  rationale: קנה의 명령형은 구매, 획득, 얻음을 모두 가질 수 있지만, 여기서는 지혜를 값없이 단순 소유하는 뜻이 아니라 의도적으로 붙잡고 획득하라는 권면이므로 ‘얻으십시오’가 가장 자연스럽습니다.
- source_word: קִנְיָנְךָ
  english_pob_choice: what you acquire / your possessions
  chosen_korean: 당신이 가진 모든 것
  alternatives_korean:
  - 당신의 소유
  - 당신의 재산
  - 당신이 획득한 모든 것
  lexicon: HALOT
  rationale: קִנְיָן은 소유물, 획득물, 재산을 가리킬 수 있어 ‘당신이 가진 모든 것’으로 옮기면 반복 동사 קנה와의 말놀이를 살리면서도 의미를 좁히지 않습니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 이해력
  alternatives_korean:
  - 분별
  - 통찰
  - 깨달음
  lexicon: HALOT
  rationale: בִינָה는 지혜문학에서 분별과 이해를 아우르므로, 현대 한국어에서 기능을 가장 분명히 드러내는 ‘이해력’을 선택했습니다.
theological_decisions:
- issue: 지혜의 ‘시작’이 시간적 순서인지, 또는 최고 우선순위인지
  chosen_reading: 본문은 지혜를 추구하는 첫 단계이자 가장 중요한 원리로 말하며, 한국어 본문에서는 이를 열거형 설명으로 풀지 않고 ‘시작은 이러합니다’로 남겼습니다.
  alternative_readings:
  - 지혜의 으뜸은 이것입니다
  - 지혜의 첫째는 이것입니다
  rationale: 히브리어 רֵאשִׁית는 문맥에 따라 ‘처음’과 ‘주된 것’을 모두 열 수 있으므로, 한쪽으로만 고정해 신학적/해석적 긴장을 지우지 않도록 했습니다.
  doctrine_reference: 잠언의 지혜 전승과 히브리어 어휘의 다의성
- issue: ‘모든 소유’의 범위를 재산으로 좁힐지 여부
  chosen_reading: ‘당신이 가진 모든 것’으로 넓게 옮겨 물질적 재산에만 한정되지 않는 총체적 헌신의 요구를 드러냈습니다.
  alternative_readings:
  - 당신의 모든 재산으로
  - 당신의 모든 소유로
  rationale: קִנְיָן은 재산을 가리킬 수 있지만, 문맥상 지혜를 얻기 위해 전부를 걸라는 압박이 핵심이므로 범위를 너무 좁히지 않는 표현이 더 적절합니다.
  doctrine_reference: 잠언의 지혜 훈계와 총체적 헌신
