    issue: ‘지혜의 시작은 이러합니다’라는 보충 표현
    rationale: 원문에는 ‘이러합니다’에 해당하는 말이 없습니다. 한국어 문장으로 풀어 쓰는 것은 가능하지만, 이 절의 압축된 격언 형식과 ‘지혜를 얻으라’는 직접적 연결을 약화합니다.
