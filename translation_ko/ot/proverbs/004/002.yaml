source:
  edition: WLC
  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
  footnotes:
  - marker: a
    text: Or 'my instruction'; traditionally, 'my law.' The Hebrew torah can denote instruction broadly, not only statutory law.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 좋은 가르침을 주었으니, 내 교훈을[a] 버리지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가르침’; 전통적으로 ‘내 율법’. 히브리어 torah는 단지 법규만이 아니라 넓게는 교훈이나 가르침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶקַח טוֹב
  english_pob_choice: good instruction
  chosen_korean: 좋은 가르침
  alternatives_korean:
  - 좋은 교훈
  - 좋은 교육
  - 좋은 배움
  lexicon: HALOT
  rationale: לֶקַח는 지혜문학에서 ‘받아들여야 할 가르침/교훈’의 뜻이므로, 한국어에서는 자연스러운 ‘가르침’으로 옮겼습니다. ‘좋은’은 טוֹב의 직접적 질을 살립니다.
- source_word: נָתַתִּי לָכֶם
  english_pob_choice: I have given you
  chosen_korean: 내가 너희에게 ... 주었으니
  alternatives_korean:
  - 내가 너희에게 주었습니다
  - 내가 너희에게 ... 주었기 때문에
  lexicon: HALOT
  rationale: 완료된 부여 행위와 그에 따른 근거를 한국어 연결로 살려, 앞절의 이유를 자연스럽게 드러내는 형식으로 옮겼습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my teaching
  chosen_korean: 내 교훈
  alternatives_korean:
  - 내 가르침
  - 내 율법
  - 내 훈계
  lexicon: HALOT
  rationale: 지혜문맥의 תּוֹרָה는 모세 율법이라기보다 권위 있는 가르침을 뜻하므로, 문맥상 무리 없이 읽히는 ‘교훈’을 택했습니다.
- source_word: אַל תַּעֲזֹבוּ
  english_pob_choice: do not forsake
  chosen_korean: 버리지 마십시오
  alternatives_korean:
  - 떠나지 마십시오
  - 저버리지 마십시오
  - 외면하지 마십시오
  lexicon: HALOT
  rationale: עזב의 금지 명령은 단순히 ‘두고 가다’보다 지속적 충실성을 요구하는 뉘앙스가 있어, 관계적·윤리적 무게를 담는 ‘버리다’로 옮겼습니다.
theological_decisions:
- issue: תּוֹרָה in wisdom literature
  chosen_reading: ‘내 교훈’으로 번역해, 화자가 자신의 권위 있는 가르침을 주고 있음을 드러냈습니다.
  alternative_readings:
  - ‘내 율법’
  - ‘내 가르침’
  rationale: 이 절은 아버지가 아들에게 주는 지혜 교육의 맥락이므로, מוספת적 율법 개념을 덧씌우지 않고도 권위성을 유지하는 표현이 적절합니다.
  doctrine_reference: 원어 우선 번역 원칙; 지혜문학의 תּוֹרָה 의미 범위 존중
