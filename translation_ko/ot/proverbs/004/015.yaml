id: PRO.4.15
reference: Proverbs 4:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
  footnotes:
  - marker: a
    text: Or 'Shun it' for 'Avoid it.' The Hebrew verb is rare and conveys keeping clear of the wicked path.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Turn aside from upon it and pass on.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 길을 피하십시오[a]. 그 길로 지나가지 마십시오[b]. 그 길에서 돌아서서 지나가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 드물며, 악한 길에서 멀리 떨어져 있으라는 뜻을 강하게 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 위에서/그것 위로부터 돌이켜 지나가라’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵ֥/הוּ
  english_pob_choice: Avoid it
  chosen_korean: 그 길을 피하십시오
  alternatives_korean:
  - 그것을 피하십시오
  - 그 길을 멀리하십시오
  - 그 길을 버리십시오
  lexicon: HALOT
  rationale: 문맥상 악인의 길을 가리키므로, 현대 한국어에서 자연스럽고 경고의 힘을 살리는 ‘피하십시오’로 옮겼습니다. ‘멀리하십시오’도 가능하지만 원문의 회피 명령을 덜 직접적으로 전달합니다.
- source_word: אַל תַּעֲבָר בּ֑/וֹ
  english_pob_choice: do not pass through it
  chosen_korean: 그 길로 지나가지 마십시오
  alternatives_korean:
  - 그 길을 통과하지 마십시오
  - 그 길에 들어서지 마십시오
  lexicon: HALOT
  rationale: עבר + ב의 공간적 이미지를 살려 ‘지나가지 마십시오’로 옮겼습니다. ‘들어서지 마십시오’는 의미는 맞지만 원문의 ‘지나가다/통과하다’ 뉘앙스가 약합니다.
- source_word: שְׂטֵ֖ה מֵ/עָלָ֣י/ו
  english_pob_choice: Turn away from it
  chosen_korean: 그 길에서 돌아서서
  alternatives_korean:
  - 그것에서 벗어나
  - 그 길을 비켜
  lexicon: HALOT
  rationale: שטה는 방향을 꺾어 이탈하라는 뜻이므로, ‘돌아서서’가 회피의 의도와 방향 전환을 자연스럽게 드러냅니다. ‘비켜’는 대상이 사람처럼 들릴 수 있어 덜 적합합니다.
- source_word: וַ/עֲבוֹר
  english_pob_choice: pass on
  chosen_korean: 지나가십시오
  alternatives_korean:
  - 계속 가십시오
  - 지나치십시오
  lexicon: HALOT
  rationale: 마지막 명령도 ‘עבר’의 연속된 동작을 따라 ‘지나가십시오’로 옮겨, 접근-진입-이탈-통과의 연쇄를 살렸습니다.
theological_decisions:
- issue: 악한 길에 대한 연속적 금지의 표현 방식
  chosen_reading: 두 개의 금지 명령과 두 개의 회피 명령을 분리해, 길에 대한 적극적 회피와 진입 금지를 모두 드러냈습니다.
  alternative_readings:
  - 한 문장으로 부드럽게 묶어 ‘그 길을 피하고 지나가지 마십시오’라고 할 수 있음
  rationale: 히브리어는 짧은 명령들의 연속으로 경고를 강화하므로, 한국어도 이를 평평하게 만들지 않고 단계적으로 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 잠언의 지혜 권면 구조
