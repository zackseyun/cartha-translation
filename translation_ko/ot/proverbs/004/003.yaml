    text: 또는 ‘내가 아버지의 아들이었고, 여렸으며, 어머니에게 유일한 자였기 때문입니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 יָחִיד는 ‘유일한 자’, ‘외아들’, ‘독특한 자’를 뜻할 수 있으며, 어떤 문맥에서는 ‘사랑받는 자’를 뜻하기도 합니다.
    reason: lexical_alternative
