  text: For I was a son to my father[b][a], tender and an only child before my mother.
  footnotes:
  - marker: a
    text: Or 'Because I was my father's son, tender and my mother's only one.'
    reason: lexical_alternative
  - marker: b
    text: '''The only one'' translates Hebrew יָחִיד, which can also mean ''only son,'' ''unique one,'' or in some contexts ''beloved one.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 아버지의 아들이었고 — 연약하며 어머니 앞에서는 외아들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 아버지의 아들이었던 까닭에, 연약하며 어머니의 외아들이었습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 יָחִיד는 ‘외아들’, ‘유일한 자’, 어떤 경우에는 ‘사랑받는 자’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
