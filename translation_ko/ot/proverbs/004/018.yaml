    rationale: נְכוֹן은 ‘확고한, 확립된’의 뜻이지만, 여기서는 새벽빛과 완전한 낮의 대비 속에서 날이 충분히 밝아진 상태를 가리킵니다. 한국어에서는 ‘날이 완전히 밝아질 때까지’가 자연스럽게 그 시간적 도달점을 전달합니다.
