  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
  footnotes:
  - marker: a
    text: Or 'the brightness of dawn.'
    reason: lexical_alternative
  - marker: b
    text: Or 'growing brighter until full day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 의인들의 길은 새벽 빛처럼, 날이 완전히 서기까지 점점 더 밝아집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '새벽의 밝음'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '온전한 낮이 될 때까지 점점 더 밝아지는'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֹרַח
  english_pob_choice: But the path
  chosen_korean: 그러나 … 길은
  alternatives_korean:
  - 그리고 … 길은
  - 또 … 길은
  lexicon: HALOT
  rationale: 문맥상 잠언의 대비를 살리기 위해 וְ를 역접으로 자연스럽게 풀었습니다. '길'은 אֹרַח의 기본 의미를 간결하게 반영합니다.
- source_word: צַדִּיקִים
  english_pob_choice: of the righteous
  chosen_korean: 의인들의
  alternatives_korean:
  - 의로운 사람들의
  - 정직한 사람들의
  lexicon: HALOT
  rationale: 잠언에서의 윤리적 범주를 살려 전형적인 성경 한국어인 '의인'을 선택했습니다.
- source_word: כְּ/אוֹר נֹגַהּ
  english_pob_choice: like the light of dawn
  chosen_korean: 새벽 빛처럼
  alternatives_korean:
  - 새벽의 밝음처럼
  - 동틀 무렵의 빛처럼
  lexicon: HALOT
  rationale: נֹגַהּ를 정적 추상어인 '밝음'보다 시간적으로 전개되는 이미지인 '새벽 빛'으로 살려, 다음 절의 '온전한 낮'으로 향하는 흐름을 보존했습니다.
- source_word: הוֹלֵךְ וָ/אוֹר
  english_pob_choice: going on and shining
  chosen_korean: 점점 더 밝아집니다
  alternatives_korean:
  - 가며 비칩니다
  - 가면서 빛납니다
  lexicon: HALOT
  rationale: 두 분사 연쇄의 진행성과 증가감을 한국어에서 자연스럽게 드러내기 위해 '점점 더 밝아집니다'로 옮겼습니다. 다만 영어 개정의 'brighter and brighter'를 기계적으로 따르지 않고, 히브리어의 '가며/비추다' 동작을 의미상 재현했습니다.
- source_word: נְכוֹן הַ/יּוֹם
  english_pob_choice: until the day is fully established
  chosen_korean: 날이 완전히 서기까지
  alternatives_korean:
  - 날이 굳게 서기까지
  - 낮이 완전히 정해지기까지
  lexicon: HALOT
  rationale: נְכוֹן의 '굳게 서다/확립되다' 의미를 한국어 관용으로 살려, '날이 완전히 서다'로 마무리의 안정성과 성숙을 표현했습니다.
theological_decisions:
- issue: 의인의 길을 비유로 어떻게 표현할지
  chosen_reading: 의인의 삶의 진로를 '새벽 빛'에서 '완전히 선 날'로 가는 점증적 빛으로 제시했습니다.
  alternative_readings:
  - 의인의 길은 빛처럼 밝아진다
  - 의인의 길은 점점 더 좋아진다
  rationale: 이 절은 도덕적 교훈을 일반화하기보다, 지혜 문학 특유의 생생한 빛의 비유로 의인의 길이 점증적으로 드러나는 모습을 묘사합니다. 따라서 비유의 감각을 유지하는 번역이 소스에 더 충실합니다.
  doctrine_reference: 잠언 4장의 지혜-의인 대비, 형상언어 보존 원칙
