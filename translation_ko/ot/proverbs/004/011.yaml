source:
  edition: WLC
  text: בְּ/דֶ֣רֶךְ חָ֭כְמָה הֹרֵתִ֑י/ךָ הִ֝דְרַכְתִּ֗י/ךָ בְּ/מַעְגְּלֵי יֹֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
  footnotes:
  - marker: a
    text: Or 'paths of straightness.' The Hebrew noun can evoke both literal straightness and moral uprightness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 지혜의 길로 너희를 가르쳤고[a], 정직의 길들로 너희를 인도하였느니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곧은 길들’. 히브리어 명사는 문자적 ‘곧음’과 도덕적 ‘정직함’을 함께 떠올리게 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דֶרֶךְ חָכְמָה
  english_pob_choice: in the way of wisdom
  chosen_korean: 지혜의 길
  alternatives_korean:
  - 지혜의 길로
  - 지혜의 도로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 이미지인 ‘길/way’를 살리면서, Proverbs의 비유적 용법에 맞게 삶의 방향으로 자연스럽게 옮겼습니다.
- source_word: הֹרֵתִיךָ
  english_pob_choice: I have instructed you
  chosen_korean: 너희를 가르쳤고
  alternatives_korean:
  - 너를 가르쳤고
  - 너희에게 가르쳤고
  - 너희를 훈계했고
  lexicon: HALOT
  rationale: Hiphil ירה는 ‘가르치다, 지시하다, 인도하다’의 뜻이 있어, 지혜문학의 교육적 맥락에는 ‘가르치다’가 가장 자연스럽습니다.
- source_word: בְּ/מַעְגְּלֵי יֹשֶׁר
  english_pob_choice: in paths of uprightness
  chosen_korean: 정직의 길들
  alternatives_korean:
  - 정직의 길
  - 바른 길들
  - 곧은 길들
  lexicon: HALOT
  rationale: מַעְגָּל의 복수형을 살리기 위해 ‘길들’로 옮겼고, יֹשֶׁר은 윤리적 의미의 ‘uprightness’가 분명하므로 ‘정직’으로 번역했습니다.
