  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
  footnotes:
  - marker: a
    text: That is, wisdom, personified as a woman in this passage.
    reason: cultural_note
translation:
  language: ko
  text: 지혜를[a] 버리지 마십시오. 그러면 지혜가 여러분을 지킬 것입니다. 지혜를 사랑하십시오. 그러면 지혜가 여러분을 보호할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 이 단락에서는 여성으로 의인화된 지혜를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַּעַזְבֶהָ
  english_pob_choice: forsake her
  chosen_korean: 버리지 마십시오
  alternatives_korean:
  - 떠나지 마십시오
  - 버려두지 마십시오
  lexicon: HALOT
  rationale: עזב의 핵심은 단순한 이동이 아니라 관계적으로 ‘버리다/저버리다’는 뜻이므로, 지혜를 상대하는 권면의 뉘앙스를 살려 ‘버리다’로 옮겼습니다.
- source_word: וְתִשְׁמְרֶךָּ
  english_pob_choice: and she will keep you
  chosen_korean: 그러면 지혜가 여러분을 지킬 것입니다
  alternatives_korean:
  - 그러면 지혜가 여러분을 지켜 줄 것입니다
  - 그리고 지혜가 여러분을 보호할 것입니다
  lexicon: HALOT
  rationale: שׁמר와 다음 절의 נצר를 구별하기 위해 앞에는 비교적 일반적인 ‘지키다’를 사용했고, 인과적 연결은 한국어 문맥에 맞게 ‘그러면’으로 자연스럽게 드러냈습니다.
- source_word: אֱהָבֶהָ
  english_pob_choice: love her
  chosen_korean: 지혜를 사랑하십시오
  alternatives_korean:
  - 그녀를 사랑하십시오
  - 지혜를 사랑하세요
  lexicon: HALOT
  rationale: 히브리어의 여성 목적어 대명사는 앞문맥의 의인화된 지혜를 가리키므로, 한국어에서는 반복을 줄이면서도 대상이 분명하도록 ‘지혜를’로 풀어 주었습니다.
- source_word: וְתִצְּרֶךָּ
  english_pob_choice: and she will guard you
  chosen_korean: 그러면 지혜가 여러분을 지켜 줄 것입니다
  alternatives_korean:
  - 그러면 지혜가 여러분을 보호할 것입니다
  - 그리고 지혜가 여러분을 지킬 것입니다
  lexicon: HALOT
  rationale: נצר는 보호하고 간수하는 뜻이 강해, 앞의 ‘지키다’보다 한층 더 돌봄을 드러내는 ‘지켜 주다’로 옮겨 보호의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 지혜의 여성 의인화 유지
  chosen_reading: 지혜를 ‘지혜’로 명시하고, 남성/중성화하지 않은 채 보호·보전의 주체로 제시했습니다.
  alternative_readings:
  - ‘그것’으로 바꾸어 추상화하기
  - 대명사만 남겨 성별 표지를 희석하기
  rationale: 본문의 여성형 접미사와 동사형은 지혜를 한 여성 인물처럼 의인화합니다. 이를 한국어에서도 유지해야 본문의 문학적 형상과 권면의 힘이 살아납니다.
  doctrine_reference: Translation philosophy §1, §4, §5
