translation:
  language: ko
  text: 들으십시오, 내 아들아, 내 말을 받아들이십시오. 그러면 당신의 생애의 햇수는 많아질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '들으십시오, 내 아들아.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 말을 취하십시오.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '당신의 생애의 햇수는 늘어날 것입니다' 혹은 '많아질 것입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  - 들어라
  lexicon: HALOT
  rationale: 지혜 교훈의 명령형을 살리면서, 합쇼체로 자연스럽고 공손한 권고를 표현했습니다. '듣다'보다 '들으십시오'가 청자에게 주의를 기울여 순종하라는 뉘앙스를 함께 전달합니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 호격을 그대로 살려, 지혜문학의 아버지-아들 교육 장면을 보존했습니다. 성중립화보다 원문의 호칭 형태를 우선했습니다.
- source_word: וְקַח אֲמָרַי
  english_pob_choice: and receive my words
  chosen_korean: 내 말을 받아들이십시오
  alternatives_korean:
  - 내 말을 받으십시오
  - 내 말을 취하십시오
  lexicon: HALOT
  rationale: '''לקח''는 단순히 물건을 ''취하다''보다 교훈을 ''받아들이다''는 뜻이 자연스럽습니다. ''말''은 ''words''를 직역하면서 한국어에서 더 자연스러운 복수/총칭 표현입니다.'
- source_word: וְיִרְבּוּ לְךָ שְׁנוֹת חַיִּים
  english_pob_choice: and the years of your life will be many
  chosen_korean: 당신의 생애의 햇수는 많아질 것입니다
  alternatives_korean:
  - 당신의 생명의 해는 많아질 것입니다
  - 당신의 삶의 햇수는 많아질 것입니다
  lexicon: HALOT
  rationale: '''רבה''의 결과 상태를 ''많아질 것입니다''로 옮겨, 단순한 수량 증가를 보존했습니다. ''생애의 햇수''는 ''years of life''의 소유 관계를 자연스럽게 살리면서도 원문의 표현을 비교적 가깝게 반영합니다.'
theological_decisions:
- issue: 지혜 교훈의 직접 호칭을 현대 한국어 예배체로 어떻게 옮길지
  chosen_reading: 명령형은 유지하되 합쇼체로 '들으십시오'와 '받아들이십시오'를 사용했습니다.
  alternative_readings:
  - 들으라, 내 아들아, 내 말을 받아라
  - 들으세요, 내 아들아, 내 말을 받아들이세요
  rationale: 원문은 친밀한 권면이면서도 분명한 명령입니다. 현대 한국어 성경 문체에서는 존대형 명령이 독자에게 더 자연스럽고, 동시에 권면의 강도를 약화시키지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 2
- issue: 성별이 표시된 호칭 בְּנִי를 중성화할지 여부
  chosen_reading: '''내 아들아''를 유지했습니다.'
  alternative_readings:
  - 내 자녀야
  - 내 아이야
  rationale: 잠언의 교육 장르는 남성 단수 호칭을 통해 전승되는 지혜 교훈의 문학적 틀을 갖습니다. 이를 중성화하면 장르적 특징과 원문의 직접성이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
