  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
  footnotes:
  - marker: a
    text: Or 'listen attentively to my words.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'incline your ear,' an idiom meaning to listen carefully.
    reason: cultural_note
translation:
  language: ko
  text: 내 아들아, 내 말에 주의를 기울이고 내 가르침에 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 단순히 ‘듣다’가 아니라 주의 깊게 경청하라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아들
  lexicon: HALOT
  rationale: 지혜 교사의 직접 호칭을 살리되, 문맥의 남성 단수 호칭을 한국어 자연문으로 옮겼습니다.
- source_word: לִדְבָרַי
  english_pob_choice: to my words
  chosen_korean: 내 말에
  alternatives_korean:
  - 내 말씀에
  - 내 말들에
  lexicon: HALOT
  rationale: דבר은 여기서 교훈적 ‘말’로 읽히므로, 현대 한국어에서 가장 자연스러운 ‘말’로 옮겼습니다.
- source_word: הַקְשִׁיבָה
  english_pob_choice: pay attention
  chosen_korean: 주의를 기울이고
  alternatives_korean:
  - 잘 들으십시오
  - 귀를 기울이고
  lexicon: HALOT
  rationale: 단순 청취보다 적극적이고 주의 깊은 경청을 요구하는 명령형의 힘을 살렸습니다.
- source_word: הַט אָזְנֶךָ
  english_pob_choice: incline your ear
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 귀를 돌리십시오
  - 귀를 숙이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 대응 표현으로 옮겨, ‘듣기 위해 자세를 낮추다’는 비유를 유지했습니다.
theological_decisions:
- issue: 지혜 교사의 권면 어조와 직접 호칭
  chosen_reading: 직접 화법을 유지해 ‘내 아들아’와 두 번째 사람 명령형으로 번역했습니다.
  alternative_readings:
  - 서술형으로 완화하여 번역
  - 간접적 권면 표현으로 바꿈
  rationale: 잠언의 교훈적·가정적 권면 구조를 보존해야 하므로, 명령과 호칭의 직접성을 약화하지 않았습니다.
  doctrine_reference: 잠언의 지혜 교육 문맥
- issue: 히브리어 관용구 ‘귀를 기울이다’의 이미지 보존
  chosen_reading: ‘귀를 기울이다’로 관용적 의미와 은유를 함께 살렸습니다.
  alternative_readings:
  - ‘잘 듣다’로 평탄화
  - ‘귀를 굽히다’처럼 직역
  rationale: 원문의 신체 은유를 유지하면서도 한국어에서 이해 가능한 경청의 뉘앙스를 전달합니다.
  doctrine_reference: 문학적 은유의 보존
