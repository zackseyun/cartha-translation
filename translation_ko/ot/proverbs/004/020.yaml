  source_fidelity: 히브리어는 남성 단수 호칭 ‘내 아들아’ 뒤에, ‘내 말들에 주의를 기울이라’와 ‘내 말씀들/말들에 네 귀를 기울이라’라는 두 명령을 병행합니다. 초안은 호칭, 명령의 직접성, 그리고 ‘귀를 기울이다’라는 관용적 이미지를 충실히 전달합니다. 다만 두 번째 ‘내 말들’은 현대 한국어에서 부자연스럽고, אָמָרַי가 첫 행의 דְבָרַי와 이루는 어휘적 병행을 자연스럽게 반영하려면 ‘내 가르침’이 적절합니다.
  naturalness: ‘내 말들에’는 한국어에서 통상 쓰이지 않는 복수 표현입니다. ‘내 가르침에’는 지혜 교사의 훈계·교훈 문맥에서 자연스럽고, 첫 행의 ‘내 말’과도 적절한 병행을 이룹니다. 연결형 첫 명령과 종결형 둘째 명령의 구성은 합쇼체에서 자연스럽습니다.
  terminology: ‘내 아들아’는 문맥상 남성 단수 호칭을 보존합니다. ‘주의를 기울이다’와 ‘귀를 기울이다’는 각각 능동적 경청과 귀를 기울이는 신체 은유를 자연스럽게 살립니다. ‘가르침’은 여기서 교사의 발화를 가리키는 אָמָרַי를 문맥상 무리 없이 옮깁니다.
