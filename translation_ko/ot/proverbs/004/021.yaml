id: PRO.4.21
reference: Proverbs 4:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יַלִּ֥יזוּ מֵ/עֵינֶ֑י/ךָ שָׁ֝מְרֵ֗/ם בְּ/ת֣וֹךְ לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/021.yaml
  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
  footnotes:
  - marker: a
    text: Or 'Do not let them out of your sight.'
    reason: lexical_alternative
  - marker: b
    text: '''Heart'' here refers to the inner person—the seat of thought, will, and affection in Hebrew usage.'
    reason: cultural_note
translation:
  language: ko
  text: 그것들을 네 눈에서 떠나게 하지 말고, 네 마음 한가운데 지키십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 눈에서’는 곧 ‘네 시야에서’라는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음’은 히브리어 용례에서 생각, 의지, 애정의 중심인 내적 사람을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יַלִּיזוּ
  english_pob_choice: Do not let them depart
  chosen_korean: 떠나게 하지 말고
  alternatives_korean:
  - 눈에서 벗어나게 하지 말고
  - 사라지게 하지 말고
  lexicon: HALOT
  rationale: אַל의 금지와 לוז의 ‘떠나다/빗나가다’ 의미를 자연스러운 한국어 금지 표현으로 옮겼습니다. '떠나게 하지 말고'가 이미지와 금지를 함께 살립니다.
- source_word: מֵעֵינֶיךָ
  english_pob_choice: from your eyes
  chosen_korean: 네 눈에서
  alternatives_korean:
  - 네 시야에서
  - 네 눈앞에서
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 살려 직역에 가깝게 옮겼습니다. '시야'는 뜻은 분명하지만 원문보다 추상적일 수 있습니다.
- source_word: שָׁמְרֵם
  english_pob_choice: keep them
  chosen_korean: 지키십시오
  alternatives_korean:
  - 간직하십시오
  - 보호하십시오
  lexicon: HALOT
  rationale: שמר의 보존·보호·유지의 폭을 포괄하는 말로 '지키다'를 택했습니다. '간직하다'는 내면적 보유 쪽으로 치우칩니다.
- source_word: בְּתוֹךְ לְבָבֶךָ
  english_pob_choice: within your heart
  chosen_korean: 네 마음 한가운데
  alternatives_korean:
  - 네 마음속에
  - 네 속사람 안에
  lexicon: HALOT
  rationale: בְּתוֹךְ의 ‘가운데/내부’와 לֵבָב의 내적 중심을 함께 드러내기 위해 '마음 한가운데'로 옮겼습니다. 단순히 '마음속에'보다 중심성의 비유가 더 분명합니다.
theological_decisions:
- issue: לֵבָב/heart의 의미 범위
  chosen_reading: ‘마음’은 단순한 감정이 아니라 생각과 의지의 중심이라는 히브리어적 의미를 내포합니다.
  alternative_readings:
  - ‘마음’을 감정 중심으로 제한해 읽는 것
  - ‘마음’을 ‘생각’이나 ‘이성’으로만 풀어 쓰는 것
  rationale: 잠언의 ‘마음’은 인간 내면의 중심을 가리키므로, 번역은 이미지로 유지하고 의미는 주해로 보완하는 편이 원문에 충실합니다.
  doctrine_reference: 잠언 4장 문맥상 지혜 교육의 내면화
