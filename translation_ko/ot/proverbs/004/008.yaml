id: PRO.4.8
reference: Proverbs 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סַלְסְלֶ֥/הָ וּֽ/תְרוֹמְמֶ֑/ךָּ תְּ֝כַבֵּ֗דְ/ךָ כִּ֣י תְחַבְּקֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/008.yaml
  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
  footnotes:
  - marker: a
    text: Or 'Cherish her, and she will exalt you.' The opening verb is rare and may carry the sense of valuing, cherishing, or extolling wisdom.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for/because you embrace her'; the clause may also be understood causally rather than temporally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀를 소중히 여기십시오[a]. 그러면 그녀가 당신을 높여 줄 것입니다[b]. 당신이 그녀를 껴안을 때 그녀가 당신을 존귀하게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀 동사 סלסל은 ‘소중히 여기다, 귀히 여기다, 높이 평가하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘당신이 그녀를 껴안기 때문에/껴안을 때’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  english_pob_choice: Prize her highly
  chosen_korean: 그녀를 소중히 여기십시오
  alternatives_korean:
  - 그녀를 귀히 여기십시오
  - 그녀를 사랑스럽게 여기십시오
  - 그녀를 높이 평가하십시오
  lexicon: HALOT
  rationale: 희귀 동사 סלסל의 핵심인 ‘값지게 여기다/소중히 대하다’의 의미를 살리되, 뒤의 ‘높이다’와 중복되지 않도록 자연스럽게 옮겼습니다.
- source_word: וּתְרוֹמְמֶךָ
  english_pob_choice: and she will exalt you
  chosen_korean: 그러면 그녀가 당신을 높여 줄 것입니다
  alternatives_korean:
  - 그리고 그녀가 당신을 높여 줄 것입니다
  - 그리고 그녀가 당신을 끌어올릴 것입니다
  lexicon: HALOT
  rationale: רומם의 ‘들어 올리다, 높이다’ 의미를 따라 인격화된 지혜가 주는 승귀를 현대 한국어로 분명하게 표현했습니다.
- source_word: תכבדך
  english_pob_choice: she will honor you
  chosen_korean: 그녀가 당신을 존귀하게 할 것입니다
  alternatives_korean:
  - 그녀가 당신을 존중할 것입니다
  - 그녀가 당신에게 영광을 줄 것입니다
  lexicon: HALOT
  rationale: כבד의 피엘이 단순한 예의상의 존중보다 ‘명예/무게를 더하다’는 뉘앙스를 가지므로, ‘존귀하게 하다’로 조금 더 강하게 살렸습니다.
- source_word: כי
  english_pob_choice: when
  chosen_korean: 당신이 그녀를 껴안을 때
  alternatives_korean:
  - 왜냐하면 당신이 그녀를 껴안을 때
  - 당신이 그녀를 껴안을 경우
  lexicon: HALOT
  rationale: 문맥상 이유를 덧붙이는 ‘because’보다, 뒤의 행위와 함께 일어나는 상황을 나타내는 ‘때’가 한국어로 더 자연스럽습니다.
theological_decisions:
- issue: 지혜의 여성 인격화와 직접 호칭 유지
  chosen_reading: 지혜를 여성 대명사 ‘그녀’로 일관되게 유지하고, 상징을 약화시키지 않았습니다.
  alternative_readings:
  - 그것을 소중히 여기십시오
  - 지혜를 소중히 여기십시오
  rationale: 히브리어 동사의 3인칭 여성형과 앞뒤 문맥의 지혜 인격화를 그대로 드러내는 것이 본문의 수사와 신학적 장치를 가장 잘 보존합니다.
  doctrine_reference: 잠언의 지혜 문학에서 지혜는 단순한 개념이 아니라 인격화된 대상입니다.
