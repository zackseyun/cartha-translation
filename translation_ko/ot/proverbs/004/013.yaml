id: PRO.4.13
reference: Proverbs 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
  footnotes:
  - marker: a
    text: Or 'discipline' or 'correction' for 'instruction' (Hebrew musar), emphasizing formative training as well as teaching.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈계[a]를 굳게 붙드시고 놓지 마십시오. 그것을 지키십시오. 그것이 당신의 생명이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훈계’는 히브리어 무사르(musar)를 옮긴 말입니다. 이 말은 가르침뿐 아니라 교정이나 징계를 포함하는 형성적 훈련을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  english_pob_choice: Hold fast
  chosen_korean: 굳게 붙들고
  alternatives_korean:
  - 붙잡고
  - 꽉 잡고
  - 굳게 잡고
  lexicon: HALOT
  rationale: חזק의 강한 ‘붙들다/굳게 잡다’는 뜻을 살려, 권면의 긴박함과 지속성을 자연스러운 합쇼체로 옮겼습니다.
- source_word: בַּמּוּסָר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교훈
  - 징계
  lexicon: HALOT
  rationale: 지혜문맥의 מוּסָר는 단순한 정보 전달보다 훈련과 교정이 포함된 형성적 가르침을 가리키므로, ‘훈계’가 그 긴장감을 비교적 잘 살립니다.
- source_word: אַל תֶּרֶף
  english_pob_choice: do not let go
  chosen_korean: 놓치지 마십시오
  alternatives_korean:
  - 놓지 마십시오
  - 손에서 놓지 마십시오
  - 버리지 마십시오
  lexicon: HALOT
  rationale: רפה의 ‘느슨하게 하다/놓다’ 의미를 한국어의 관용적 금지 표현으로 옮기되, 앞의 ‘붙들다’와 대응되도록 했습니다.
- source_word: נִצְּרֶהָ
  english_pob_choice: Guard her
  chosen_korean: 그것을 지키십시오
  alternatives_korean:
  - 그녀를 지키십시오
  - 보호하십시오
  - 간수하십시오
  lexicon: HALOT
  rationale: 히브리어의 여성형 인칭은 문법적 인격화이지만, 한국어에서는 ‘훈계’를 가리키는 중성적 지시어 ‘그것’을 써서 의미를 분명하게 했습니다.
theological_decisions:
- issue: 무사르(musar)의 한국어 뉘앙스
  chosen_reading: ‘훈계’로 옮겨, 지식 전달만이 아니라 삶을 빚는 교정과 훈련의 성격을 드러냈습니다.
  alternative_readings:
  - ‘교훈’으로 완화
  - ‘징계’로 강하게
  rationale: 잠언의 문맥에서는 훈련적·교정적 차원이 함께 있으므로, 둘 중 하나로만 고정해 의미를 좁히지 않되 한국어로는 ‘훈계’가 균형적입니다.
  doctrine_reference: 지혜문학의 형성적 교육 이해
- issue: 문법적 여성 인칭의 처리
  chosen_reading: 히브리어의 ‘그녀’를 한국어에서 그대로 여성 인격화로 옮기지 않고, 대상인 ‘훈계’를 가리키는 ‘그것’으로 처리했습니다.
  alternative_readings:
  - ‘그녀를 지키십시오’로 직역
  - 의인화를 유지한 번역
  rationale: 원문의 수사적 의인화는 인정하되, 한국어 독자가 대상이 무엇인지 즉시 파악하도록 하여 문맥의 명료성을 우선했습니다.
  doctrine_reference: 문법적 성/인칭의 한국어 자연성
