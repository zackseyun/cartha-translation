review_pass:
  verdict: revise
  source_fidelity: 첫 명령과 ‘아들들’ 및 ‘훈계’는 원문에 대체로 충실합니다. 그러나 וְהַקְשִׁיבוּ는 단순히 ‘주의하다’보다 ‘귀를 기울이다/경청하다’에 가깝고, ‘이해를 알도록’은 한국어에서 부자연스럽습니다. בִּינָה의 지혜문학적 뜻을 ‘분별’로 옮기고 목적 표현을 자연스럽게 정리하는 것이 적절합니다.
  naturalness: ‘이해를 알도록 주의하십시오’는 목적어 결합과 동사 선택이 모두 어색합니다. ‘분별을 알기 위해 귀를 기울이십시오’는 현대 표준어 합쇼체로 자연스럽고, 두 명령의 점층도 유지합니다.
  terminology: מוּסַר를 ‘훈계’로, בָנִים을 ‘아들들아’로 옮긴 것은 적절합니다. בִּינָה는 여기서 단순한 ‘이해’보다 지혜·식별의 의미를 드러내는 ‘분별’이 더 알맞습니다.
  issues:
