    issue: ‘주의하십시오’는 וְהַקְשִׁיבוּ의 청취·경청 의미를 충분히 반영하지 못합니다.
    rationale: קשב의 명령형은 집중하여 듣고 귀를 기울이라는 요청입니다. 한국어 ‘주의하다’는 조심하거나 유의한다는 뜻으로도 주로 이해되어 의미가 흐려집니다.
  - severity: medium
    issue: ‘이해를 알도록’은 현대 한국어에서 어색하며 בִּינָה의 지혜문학적 의미를 약화합니다.
    rationale: ‘알다’의 목적어로 ‘이해’는 중복적이고 비문에 가깝습니다. ‘분별을 알다’는 원문의 לדעת בינה를 비교적 직역적으로 보존하면서도 자연스럽습니다.
