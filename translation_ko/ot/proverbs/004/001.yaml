  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
  footnotes:
  - marker: a
    text: Or “children.” The Hebrew says “sons,” preserving the father-to-son framing typical of Proverbs.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들들아, 아버지의 훈계를 들으십시오. 그리고 이해를 알도록 주의하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아들들’이라고 되어 있습니다. 잠언의 전형적 부자 교육 형식을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 잘 들으십시오
  - 들어야 합니다
  lexicon: WLC; HALOT
  rationale: 복수 명령의 직접적 촉구를 살리면서도, 현대 표준어 합쇼체의 공적 권면 문체에 맞게 간결하게 옮겼습니다.
- source_word: בָנִים
  english_pob_choice: sons
  chosen_korean: 아들들아
  alternatives_korean:
  - 자녀들아
  - 아들아
  lexicon: WLC; HALOT
  rationale: 히브리어가 남성 복수형이므로 ‘아들들’로 대표적 대상을 살렸고, 잠언의 교훈적 호명에 맞게 직접 호칭형으로 만들었습니다.
- source_word: מוּסַר
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교육
  - 교훈
  lexicon: HALOT
  rationale: 지혜문학에서 מוּסַר는 단순 정보 전달보다 형성·교정의 뉘앙스를 포함하므로, 한국어에서 그 긴장을 비교적 잘 드러내는 ‘훈계’를 택했습니다.
- source_word: לָדַעַת בִּינָה
  english_pob_choice: to know understanding
  chosen_korean: 이해를 알도록
  alternatives_korean:
  - 분별을 알도록
  - 통찰을 알도록
  - 이해하게 되도록
  lexicon: HALOT
  rationale: לָדַעַת는 목적을 나타내므로 결과를 드러내는 ‘~도록’으로 옮겼고, בִּינָה는 지혜문맥의 핵심어로서 ‘이해’보다 ‘분별/통찰’도 가능하지만, 문장 흐름상 ‘이해’를 기본값으로 선택했습니다.
theological_decisions:
- issue: 잠언의 아들 호칭을 성중립화할지 여부
  chosen_reading: 히브리어의 남성 복수 호칭을 유지해 ‘아들들아’로 번역합니다.
  alternative_readings:
  - 자녀들아
  - 어린이들아
  rationale: 본문은 교훈의 전형적 부자 관계 틀을 유지하며 말하고 있으므로, 성중립화로 이 구조를 흐리지 않고 원문의 표지를 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
