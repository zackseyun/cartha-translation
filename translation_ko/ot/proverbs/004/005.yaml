  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
  footnotes:
  - marker: a
    text: Or 'Get wisdom; get understanding.' The Hebrew verb can mean obtain, acquire, or buy, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not turn aside' or 'do not swerve' from the words of my mouth.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜를 얻으십시오[a]; 명철을 얻으십시오. 잊지 마시고, 내 입에서 나온 말에서 돌아서지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜를 사십시오; 명철을 사십시오.’ 히브리어 동사는 문맥에 따라 얻다, 획득하다, 사다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 입에서 나온 말에서 벗어나지 마십시오’ 또는 ‘내 입에서 나온 말에서 치우치지 마십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  english_pob_choice: Acquire
  chosen_korean: 얻으십시오
  alternatives_korean:
  - 획득하십시오
  - 사십시오
  - 사들이십시오
  lexicon: HALOT
  rationale: 지혜와 명철은 상업적 구매보다 ‘얻다/획득하다’가 자연스럽고, 명령형의 강한 촉구도 살릴 수 있습니다.
- source_word: חָכְמָה / בִינָה
  english_pob_choice: wisdom / understanding
  chosen_korean: 지혜 / 명철
  alternatives_korean:
  - 지혜 / 이해
  - 지혜 / 분별
  lexicon: HALOT
  rationale: 지혜와 대구를 이루는 בינה는 단순한 지적 이해보다 판단력 있는 분별을 포함하므로, 한국어에서는 ‘명철’이 짝을 더 잘 살립니다.
- source_word: אַל תִּשְׁכַּח
  english_pob_choice: Do not forget
  chosen_korean: 잊지 마십시오
  alternatives_korean:
  - 기억하십시오
  - 잊어버리지 마십시오
  lexicon: HALOT
  rationale: 핵심 의미인 ‘잊다’를 그대로 살리되, 합쇼체로 간결하게 옮겼습니다.
- source_word: וְאַל תֵּט
  english_pob_choice: and do not turn away
  chosen_korean: 그리고 ...에서 돌아서지 마십시오
  alternatives_korean:
  - 그리고 ...에서 벗어나지 마십시오
  - 그리고 ...에서 치우치지 마십시오
  lexicon: HALOT
  rationale: נטה의 ‘돌다/기울다’ 이미지를 현대 한국어에서 자연스럽게 살리면서, 다음 구절의 권면에 대한 이탈 금지를 드러냅니다.
- source_word: מֵאִמְרֵי פִי
  english_pob_choice: from the words of my mouth
  chosen_korean: 내 입의 말들에서
  alternatives_korean:
  - 내 입의 말에서
  - 내 입술의 말에서
  lexicon: HALOT
  rationale: 히브리어의 직유적 표현을 보존하기 위해 ‘입의 말들’ 구조를 유지하여, 말씀의 출처와 권위를 드러냈습니다.
theological_decisions:
- issue: 지혜와 명철에 대한 반복 명령의 기능
  chosen_reading: 두 개의 병렬 명령을 그대로 살려, 지혜와 명철을 각각 따로 ‘얻으라’고 권합니다.
  alternative_readings:
  - 한 번의 명령으로 묶어 번역
  - ‘지혜를 얻고 명철을 얻으라’로 단순화
  rationale: 히브리어의 반복은 수사적 강조이므로, 한국어에서도 반복을 보존해야 경구의 힘이 약화되지 않습니다.
  doctrine_reference: 잠언의 지혜 문학적 권면 구조
