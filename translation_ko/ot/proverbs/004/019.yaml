id: PRO.4.19
reference: Proverbs 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דֶּ֣רֶךְ רְ֭שָׁעִים כָּֽ/אֲפֵלָ֑ה לֹ֥א יָ֝דְע֗וּ בַּ/מֶּ֥ה יִכָּשֵֽׁלוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
  footnotes:
  - marker: a
    text: Or 'like thick darkness' or 'like gloom.' The Hebrew term denotes especially dense darkness.
    reason: lexical_alternative
  - marker: b
    text: Or 'they do not know what they stumble over.' The Hebrew expression can be understood as either what causes their stumbling or the object over which they stumble.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들의 길은 깊은 어둠과 같습니다.[a] 그들은 무엇에 걸려 넘어지는지도 알지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깊은 어둠’은 히브리어 אֲפֵלָה가 나타내는 짙고 캄캄한 어둠을 옮긴 것입니다. ‘짙은 어둠’, ‘캄캄함’, ‘흑암’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘무엇에 걸려 넘어지는지’ 또는 ‘무엇 때문에 넘어지는지’로 이해할 수 있습니다. 히브리어 표현은 걸림의 대상과 원인을 모두 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 삶의 길
  - 행로
  lexicon: HALOT
  rationale: 잠언의 표상에서 דֶּרֶךְ는 삶의 진행 방식이나 행로를 가리키므로, 한국어에서는 자연스럽고 비유를 살리는 ‘길’이 적절합니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악인
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 명사적 복수로서 도덕적으로 악한 사람들을 가리키므로, 현대 한국어에서 간결한 ‘악인들’이 가장 직접적입니다.
- source_word: כָּאֲפֵלָה
  english_pob_choice: like deep darkness
  chosen_korean: 깊은 어둠과 같아서
  alternatives_korean:
  - 짙은 어둠과 같아서
  - 캄캄한 어둠과 같아서
  - 짙은 흑암과 같아서
  lexicon: HALOT
  rationale: אֲפֵלָה의 강한 어둠 이미지를 살리되, ‘깊은 어둠’으로 과도한 고어감을 피하면서도 농도를 유지했습니다.
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  english_pob_choice: they do not know what makes them stumble
  chosen_korean: 무엇에 걸려 넘어지는지도 알지 못합니다
  alternatives_korean:
  - 무엇에 걸려 넘어지는지 알지 못합니다
  - 무엇 때문에 넘어지는지도 알지 못합니다
  - 무엇 위에 걸려 넘어지는지도 알지 못합니다
  lexicon: HALOT
  rationale: בַּמֶּה는 여기서 걸림의 대상/원인을 함께 품을 수 있으므로, ‘무엇에 걸려 넘어지는지도’로 한국어에서 가능한 중의성을 비교적 자연스럽게 반영했습니다.
theological_decisions:
- issue: 어두움과 걸려 넘어짐의 관계를 어떻게 표현할지
  chosen_reading: 악인의 길이 단순히 어둡기만 한 것이 아니라, 자신이 무엇에 걸리는지도 분별하지 못하는 상태로 묘사했습니다.
  alternative_readings:
  - 악인들의 길은 깊은 어둠과 같아서 그들은 그들이 무엇을 넘어뜨리는지 알지 못합니다
  - 악인들의 길은 깊은 어둠과 같아서 그들은 무엇 위를 넘어지는지도 알지 못합니다
  rationale: 문맥은 도덕적 무지와 자기파괴적 위험을 함께 보여 주므로, 원문의 비유를 약화시키지 않으면서도 독자가 이해할 수 있게 옮겼습니다.
  doctrine_reference: 지혜문학의 도덕적 인식론
