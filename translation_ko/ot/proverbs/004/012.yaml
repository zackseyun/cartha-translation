id: PRO.4.12
reference: Proverbs 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּֽ֭/לֶכְתְּ/ךָ לֹא יֵצַ֣ר צַעֲדֶ֑/ךָ וְ/אִם תָּ֝ר֗וּץ לֹ֣א תִכָּשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
  footnotes:
  - marker: a
    text: Or 'your step will not be cramped/restricted.' The Hebrew verb conveys the idea of being narrowed or constrained.
    reason: lexical_alternative
translation:
  language: ko
  text: 걸어갈 때에는 당신의 걸음이 좁아지지 않을 것이며, 달릴 때에도 비틀거리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좁아지지 않을’은 히브리어 동사가 담는 ‘좁아지다, 제약되다’의 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  english_pob_choice: When you walk
  chosen_korean: 걸어갈 때에는
  alternatives_korean:
  - 걸을 때에는
  - 걸어가는 동안
  lexicon: HALOT
  rationale: הלך의 부정사구가 시간 부사절로 쓰인 표현이므로, 자연스러운 한국어 조건·시간 표현인 ‘걸어갈 때에는’로 옮겼습니다.
- source_word: יֵצַר
  english_pob_choice: will be hindered
  chosen_korean: 좁아지지 않을
  alternatives_korean:
  - 방해받지 않을
  - 제약받지 않을
  - 비좁아지지 않을
  lexicon: HALOT
  rationale: 히브리어는 ‘좁아지다/제한되다’의 뜻을 가지므로, 직역적 핵심을 살리되 한국어에서는 ‘걸음’과 자연스럽게 연결되는 ‘좁아지지 않을’로 표현했습니다.
- source_word: צַעֲדֶךָ
  english_pob_choice: your step
  chosen_korean: 당신의 걸음
  alternatives_korean:
  - 당신의 발걸음
  - 당신의 한 걸음
  - 당신의 발자국
  lexicon: HALOT
  rationale: 단수형이지만 일반적 행보를 가리키는 집합적 의미이므로, 현대 한국어에서 가장 자연스러운 ‘걸음’으로 옮겼습니다.
- source_word: תָּרוּץ / תִכָּשֵׁל
  english_pob_choice: you run / you will not stumble
  chosen_korean: 달릴 때에도 비틀거리지 않을 것입니다
  alternatives_korean:
  - 뛰어갈 때에도 넘어지지 않을 것입니다
  - 달려도 넘어지지 않을 것입니다
  - 뛰어도 실족하지 않을 것입니다
  lexicon: HALOT
  rationale: ‘run’은 그대로 ‘달리다’로, כשל는 지혜문학의 길 이미지에 맞는 ‘비틀거리다’로 옮겨 신체적·비유적 의미를 함께 살렸습니다.
