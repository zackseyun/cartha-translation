id: PRO.4.17
reference: Proverbs 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
  footnotes:
  - marker: a
    text: Or 'For they feed on the bread of wickedness.' The verb can carry the sense of consuming or feeding on, but 'eat' is the most straightforward rendering in this parallel with 'drink.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wine of violences.' The plural likely intensifies or collectivizes the idea; English idiom normally renders it 'wine of violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 악의 떡을 먹고, 폭력의 포도주를 마시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 앞선 권면의 이유를 드러내는 접속사이므로, 문어체에서 자연스럽고 설명 기능을 살리는 ‘이는’으로 옮겼습니다.
- source_word: לָחֲמוּ לֶחֶם
  english_pob_choice: they eat the bread
  chosen_korean: 악의 떡을 먹고
  alternatives_korean:
  - 불의의 떡을 먹고
  - 악한 떡을 먹고
  lexicon: HALOT
  rationale: ‘먹다’는 원문의 לָחֲמוּ를 가장 직접적으로 반영하며, ‘떡’은 לֶחֶם의 구체적 이미지와 포도주와의 병행을 살립니다.
- source_word: רֶשַׁע
  english_pob_choice: wickedness
  chosen_korean: 악의
  alternatives_korean:
  - 악함의
  - 불의의
  lexicon: HALOT
  rationale: 지혜문학에서 רֶשַׁע의 도덕적 성격을 살리되, 한국어 관용상 ‘악의 떡’처럼 간결한 소유 구조로 표현했습니다.
- source_word: חֲמָסִים
  english_pob_choice: violence
  chosen_korean: 폭력의
  alternatives_korean:
  - 포악의
  - 폭행의
  lexicon: HALOT
  rationale: 복수형이 집합적·강조적 기능을 하므로 단수적 추상명사 ‘폭력’으로 자연스럽게 옮겼습니다.
- source_word: יִשְׁתּוּ
  english_pob_choice: drink
  chosen_korean: 마시기 때문입니다
  alternatives_korean:
  - 마시기 때문입니다
  - 마십니다
  lexicon: HALOT
  rationale: 둘째 행의 동사를 문장 전체의 이유절 안에 흡수해 한국어 병렬성을 유지하되, 원문의 ‘마시다’ 대응을 분명히 했습니다.
