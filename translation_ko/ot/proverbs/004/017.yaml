base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
  footnotes:
  - marker: a
    text: Or 'For they feed on the bread of wickedness.' The verb can carry the sense of consuming or feeding on, but 'eat' is the most straightforward rendering in this parallel with 'drink.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wine of violences.' The plural likely intensifies or collectivizes the idea; English idiom normally renders it 'wine of violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 악의 떡을 먹고, 폭력의 포도주를 마시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 앞선 권면의 이유를 드러내는 접속사이므로, 문어체에서 자연스럽고 설명 기능을 살리는 ‘이는’으로 옮겼습니다.
- source_word: לָחֲמוּ לֶחֶם
