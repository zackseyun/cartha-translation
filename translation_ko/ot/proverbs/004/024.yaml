source:
  edition: WLC
  text: הָסֵ֣ר מִ֭מְּ/ךָ עִקְּשׁ֣וּת פֶּ֑ה וּ/לְז֥וּת שְׂ֝פָתַ֗יִם הַרְחֵ֥ק מִמֶּֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/024.yaml
  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
  footnotes:
  - marker: a
    text: Or 'a perverse mouth' and 'perverse lips.' The Hebrew nouns in both clauses describe speech that is morally twisted or distorted.
    reason: lexical_alternative
translation:
  language: ko
  text: 입에서 비뚤어진 것을 버리고, 입술에서 사특함을 멀리하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 명사는 문자적으로 ‘입의 비뚤어짐’과 ‘입술의 굽음/사특함’을 가리키며, 말의 도덕적 왜곡을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  english_pob_choice: Put away
  chosen_korean: 버리고
  alternatives_korean:
  - 치워버리고
  - 떼어내고
  - 제거하고
  lexicon: HALOT
  rationale: 명령형으로서 적극적인 제거를 나타내며, 한국어에서는 ‘버리다’가 도덕적·행동적 단절을 자연스럽게 드러냅니다.
- source_word: עִקְּשׁוּת פֶּה
  english_pob_choice: crookedness of mouth
  chosen_korean: 입에서 비뚤어진 것
  alternatives_korean:
  - 입의 비뚤어짐
  - 비뚤어진 입
  - 굽은 말
  lexicon: HALOT
  rationale: 직역하면 ‘입의 비뚤어짐/비뚤어진 것’이지만, 한국어에서는 관용적으로 ‘입에서 비뚤어진 것’이라 옮겨 입과 말의 연결을 살리면서 추상명사의 성격도 보존했습니다.
- source_word: וּלְזוּת שְׂפָתַיִם
  english_pob_choice: devious lips
  chosen_korean: 입술에서 사특함
  alternatives_korean:
  - 사특한 입술
  - 비뚤어진 입술
  - 간사한 말
  lexicon: HALOT
  rationale: ‘입술’을 유지하되, 히브리어의 도덕적으로 굽어진 말의 뉘앙스를 살리기 위해 ‘사특함’을 택했습니다. 이는 단순한 기교가 아니라 윤리적 왜곡을 가리킵니다.
- source_word: הַרְחֵק מִמֶּךָּ
  english_pob_choice: keep ... far from you
  chosen_korean: 멀리하십시오
  alternatives_korean:
  - 멀리 두십시오
  - 떼어 놓으십시오
  - 멀리 치우십시오
  lexicon: HALOT
  rationale: 두 번째 명령은 거리를 두게 하는 강한 사역형이므로, 현대 한국어에서는 간결한 명령 ‘멀리하십시오’가 원문의 강도를 자연스럽게 전달합니다.
theological_decisions:
- issue: 지혜문학의 도덕적 언어를 어떻게 살릴 것인가
  chosen_reading: ‘비뚤어진 것’과 ‘사특함’으로 옮겨, 말의 왜곡을 단순한 스타일 문제가 아니라 윤리적 타락으로 이해하게 했습니다.
  alternative_readings:
  - ‘굽은 말’
  - ‘부정직한 말’
  - ‘간사한 말’
  rationale: 본문은 입과 입술이라는 신체어를 통해 말의 도덕적 성격을 강조합니다. 따라서 의미를 완화하지 않고, 인간의 말이 하나님 앞에서 곧아야 한다는 교훈을 보존했습니다.
  doctrine_reference: 잠언의 지혜윤리, 말의 성결과 진실성
