    text: 히브리어의 두 명사는 문자적으로 ‘입의 비뚤어짐’과 ‘입술의 왜곡’을 가리키며, 도덕적으로 비뚤어지거나 왜곡된 말을 뜻합니다.
    reason: lexical_alternative
