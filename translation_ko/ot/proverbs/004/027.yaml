  lexicon: HALOT
  rationale: 지혜문맥의 רַע를 도덕적 악으로 이해해, 의미를 좁히지 않으면서도 한국어에서 가장 직관적인 ‘악’으로 번역했습니다.
theological_decisions:
- issue: 좌우로 치우치지 말라는 권면의 성격
  chosen_reading: 도덕적 삶의 전반적 방향을 어기지 말고 악에서 물러서라는 지혜의 경계로 읽었습니다.
  alternative_readings:
  - 특정한 우상숭배나 율법 위반만을 가리키는 제한적 경고
  - 단순한 신중함을 권하는 일반적 조언
  rationale: 문맥상 지혜서의 교훈은 삶의 길 전체에 대한 윤리적 인도를 말하며, 좌우 모두로의 일탈과 악으로부터의 거리두기를 함께 요구합니다.
  doctrine_reference: 잠언의 지혜윤리
