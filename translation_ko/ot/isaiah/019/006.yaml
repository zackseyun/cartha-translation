id: ISA.19.6
reference: Isaiah 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶאֶזְנִ֣יחוּ נְהָר֔וֹת דָּלֲל֥וּ וְ/חָרְב֖וּ יְאֹרֵ֣י מָצ֑וֹר קָנֶ֥ה וָ/ס֖וּף קָמֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
  footnotes:
  - marker: a
    text: Or 'The rivers will become foul.' The Hebrew verb is rare, and the sense is that the waterways become putrid or stink.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the canals of Matzor'; here 'Matzor' is best understood as a poetic name for Egypt.
    reason: lexical_alternative
  - marker: c
    text: Or 'papyrus' for 'rush.' The Hebrew term refers to marsh vegetation associated with riverbanks.
    reason: lexical_alternative
translation:
  language: ko
  text: 강들이 악취를 풍기고[a] — 이집트의 운하들은 줄어들고 말라 버리며[b], 갈대와 부들이 시들 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강들이 썩은 냄새를 풍길 것입니다.’ 희귀한 히브리어 동사로, 물길이 부패하거나 악취를 내는 상태를 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘맛초르의 운하들’인데, 여기서는 ‘맛초르’를 이집트의 시적 명칭으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부들’ 대신 ‘파피루스’로 볼 수 있습니다. 히브리어는 강가의 습지 식생을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִ֣יחוּ
  english_pob_choice: will stink
  chosen_korean: 악취를 풍기고
  alternatives_korean:
  - 썩은 냄새가 나고
  - 악취가 나며
  lexicon: HALOT
  rationale: 드문 히필형의 뉘앙스를 물길이 썩어 불쾌한 냄새를 내는 상태로 옮기되, 한국어에서 가장 자연스럽고 압축적인 표현을 택했습니다.
- source_word: נְהָר֔וֹת
  english_pob_choice: the rivers
  chosen_korean: 강들이
  alternatives_korean:
  - 하천들이
  - 시내들이
  lexicon: HALOT
  rationale: 복수 명사로서 강/하천을 가리키는 일반적 의미를 살려 ‘강들’로 옮겼습니다.
- source_word: יְאֹרֵ֣י מָצ֑וֹר
  english_pob_choice: the canals of Egypt
  chosen_korean: 이집트의 운하들은
  alternatives_korean:
  - 맛초르의 운하들은
  - 이집트의 물길들은
  lexicon: HALOT
  rationale: 문맥상 מָצוֹר을 이집트의 시적 명칭으로 이해한 POB의 판단을 따라, 독자가 지리적 대상을 바로 이해하도록 ‘이집트의’로 풀었습니다.
- source_word: קָנֶ֥ה וָס֖וּף
  english_pob_choice: reed and rush
  chosen_korean: 갈대와 부들
  alternatives_korean:
  - 갈대와 수초
  - 갈대와 습지풀
  lexicon: HALOT
  rationale: 두 식물의 병렬을 살리면서, 습지 식생을 가리키는 한국어로 자연스럽고 구분되는 ‘갈대/부들’을 택했습니다.
- source_word: קָמֵֽלוּ
  english_pob_choice: will wither
  chosen_korean: 시들 것입니다
  alternatives_korean:
  - 말라 버릴 것입니다
  - 시들어 갈 것입니다
  lexicon: HALOT
  rationale: 식물의 쇠퇴를 나타내는 동사를 한국어의 표준적 예언형으로 옮겨, 앞의 물길 묘사와 대비를 살렸습니다.
theological_decisions:
- issue: 이집트를 가리키는 מָצוֹר의 처리
  chosen_reading: 맛초르를 직역하지 않고 ‘이집트’로 의역했습니다.
  alternative_readings:
  - ‘맛초르’로 음역하기
  - ‘포위/견고한 성읍’으로 직역하기
  rationale: 이 절에서는 ‘이집트의 운하들’이라는 평행 구조가 분명하므로, 희귀어를 그대로 남겨 독해를 방해하기보다 본문이 의도한 지리적 대상을 드러내는 것이 더 충실합니다.
  doctrine_reference: 본문의 지리적-예언적 의미 전달
