source:
  edition: WLC
  text: יְהוָ֛ה מָסַ֥ךְ בְּ/קִרְבָּ֖/הּ ר֣וּחַ עִוְעִ֑ים וְ/הִתְע֤וּ אֶת מִצְרַ֨יִם֙ בְּ/כָֽל מַעֲשֵׂ֔/הוּ כְּ/הִתָּע֥וֹת שִׁכּ֖וֹר בְּ/קִיאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
  footnotes:
  - marker: a
    text: Or 'a spirit of distortion,' 'a spirit of perversity,' or 'a spirit of dizziness.' The Hebrew expression denotes a disorienting, twisting influence sent in judgment.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew verb is plural: ''and they have led Egypt astray.'' The subject is not explicitly identified in English; it may refer to the confusing influences or to Egypt''s leaders under that influence.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그들 가운데에 혼란의 영을 섞으셨고, 그들은 애굽을 그 모든 일에서 잘못된 길로 이끌어, 마치 술 취한 사람이 자기 토사물 속에서 비틀거리듯 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘혼란의 영’은 ‘비틀림의 영’, ‘어지러움의 영’, ‘왜곡의 영’으로도 옮길 수 있습니다. 히브리어 표현은 심판으로 주어진 방향 상실과 뒤틀림의 영향을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 복수형입니다. 따라서 ‘그들은’은 바로 앞의 혼란한 영향들이나, 그 영향 아래 있는 애굽의 지도자들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사/신명사 표기
  rationale: 원문의 신적 고유명사 יהוה를 대체 호칭이 아니라 이름으로 살리기 위해 POB의 기본 표기인 ‘야훼’를 따랐습니다.
- source_word: מָסַךְ
  english_pob_choice: has mixed
  chosen_korean: 섞으셨고
  alternatives_korean:
  - 부으셨고
  - 뒤섞으셨고
  lexicon: 동사 의미장
  rationale: ‘섞다/뒤섞다’는 본문의 물리적 이미지와 혼란을 함께 살리며, 단순히 ‘부었다’보다 원문의 은유를 더 가깝게 전달합니다.
- source_word: רוּחַ עִוְעִים
  english_pob_choice: a spirit of confusion
  chosen_korean: 혼란의 영
  alternatives_korean:
  - 혼미의 영
  - 비뚤어짐의 영
  - 어지러움의 영
  lexicon: רוּחַ + עִוְעִים
  rationale: ‘עִוְעִים’의 뒤틀림·혼돈·어지러움의 뉘앙스를 한국어로 자연스럽게 묶어 주는 표현으로 ‘혼란’을 택했습니다. 문맥상 심리적 혼미를 넘어 판단과 행동의 혼돈을 가리킵니다.
- source_word: וְהִתְעוּ
  english_pob_choice: and they have led astray
  chosen_korean: 잘못된 길로 이끌어
  alternatives_korean:
  - 길에서 벗어나게 하여
  - 미혹하여
  - 잘못 가게 하여
  lexicon: 동사 הִתְעָה
  rationale: 동사의 사역적 의미를 살리되, 한국어에서 가장 자연스럽고 읽기 쉬운 ‘잘못된 길로 이끌다’로 옮겨 원문의 인도-오도 이미지를 보존했습니다.
- source_word: בְּכָל מַעֲשֵׂהוּ
  english_pob_choice: in all its work
  chosen_korean: 그 모든 일에서
  alternatives_korean:
  - 그 모든 행위에서
  - 그 모든 일에
  - 그 모든 작업에서
  lexicon: מַעֲשֶׂה
  rationale: ‘מַעֲשֶׂה’는 구체적 작업보다 포괄적인 활동·일을 가리키므로, 애굽의 전반적 행위를 아우르는 ‘그 모든 일에서’가 적절합니다.
theological_decisions:
- issue: 야훼의 심판 행위 표현
  chosen_reading: 야훼께서 애굽 안에 혼란의 영을 직접 ‘섞으셨다’는 진술을 그대로 살려, 심판의 주도권을 약화시키지 않았습니다.
  alternative_readings:
  - 야훼께서 혼란을 허락하셨다
  - 야훼께서 혼란을 보내셨다
  rationale: 히브리어 동사와 문맥은 하나님의 적극적 심판 행동을 보여 주므로, 원문의 강한 주어-행위 관계를 유지했습니다.
  doctrine_reference: 심판 주권 / 번역 원칙
- issue: 3인칭 복수 동사의 주어 불명확성
  chosen_reading: ‘그들은 … 이끌어’로 복수를 유지해, 누가 애굽을 오도했는지에 대한 원문의 압축된 모호성을 남겼습니다.
  alternative_readings:
  - 그것이 애굽을 이끌어
  - 애굽이 잘못된 길로 이끌려
  rationale: 원문은 복수 동사를 사용하지만 주어를 명시하지 않으므로, 한국어에서도 그 여지를 보존하는 편이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 모호성 보존
