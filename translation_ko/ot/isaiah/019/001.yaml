id: ISA.19.1
reference: Isaiah 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
  footnotes:
  - marker: a
    text: Or 'A burden concerning Egypt' or 'A pronouncement concerning Egypt.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from before him,' that is, at the LORD's presence.
    reason: lexical_alternative
  - marker: c
    text: Or 'within him'; the Hebrew treats Egypt as a singular entity.
    reason: lexical_alternative
translation:
  language: ko
  text: '이집트에 대한 엄중한 선포입니다: 보십시오, 야훼께서 빠른 구름을 타고 이집트로 오십니다. 이집트의 우상들이 그 앞에서 떨 것이며, 이집트의 마음은 그 속에서 녹아내릴 것입니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'מַשָּׂא의 번역 가능성: ‘짐’, ‘엄중한 선포’, 또는 ‘신탁’.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 앞에서/그 앞에’를 뜻하며, 야훼의 임재 앞이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 이집트를 문법상 단수처럼 다루므로 ‘그 속에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 엄중한 선포
  alternatives_korean:
  - 예언
  - 신탁
  - 경고의 말씀
  lexicon: HALOT
  rationale: 예언서 표제어의 무게와 심판적 성격을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다. 단순한 ‘예언’보다 표제의 기능을 더 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명(神名)을 그대로 옮겨, 제목이 아닌 고유명으로 드러나게 했습니다. POB의 기준에 따라 전통적 대체어인 ‘주님’은 피했습니다.
- source_word: רֹכֵב עַל עָב קַל
  english_pob_choice: is riding on a swift cloud
  chosen_korean: 빠른 구름을 타고
  alternatives_korean:
  - 가벼운 구름을 타고
  - 신속한 구름 위에 타고
  lexicon: HALOT
  rationale: ‘타고’는 רכב의 탑승 이미지를 살리고, ‘빠른’은 קַל의 속도감을 자연스럽게 전달합니다. ‘가벼운’은 한국어에서 물성으로 오해될 수 있어 피했습니다.
- source_word: וְנָעוּ אֱלִילֵי מִצְרַיִם מִפָּנָיו
  english_pob_choice: the idols of Egypt will tremble before him
  chosen_korean: 이집트의 우상들이 그 앞에서 떨 것이며
  alternatives_korean:
  - 이집트의 우상들이 그의 앞에서 떨 것이며
  - 이집트의 우상들이 그의 임재 앞에서 떨 것이며
  lexicon: HALOT
  rationale: מִפָּנָיו의 ‘그 앞에서’라는 직접적 공간 표현을 살리면서도, 우상들의 무력함과 공포를 압축적으로 드러냈습니다.
- source_word: וּלְבַב מִצְרַיִם יִמַּס בְּקִרְבּוֹ
  english_pob_choice: and the heart of Egypt will melt within it
  chosen_korean: 이집트의 마음은 그 속에서 녹아내릴 것입니다
  alternatives_korean:
  - 이집트의 마음은 그 안에서 녹을 것입니다
  - 이집트의 심장은 그 속에서 녹아내릴 것입니다
  lexicon: HALOT
  rationale: ‘마음’은 לְבַב의 내적·의지적 중심을 자연스럽게 옮기며, ‘녹아내릴 것입니다’는 יִמַּס의 공포·붕괴 은유를 보존합니다. ‘그 속에서’는 국가를 단수로 보는 히브리어 표현을 반영합니다.
theological_decisions:
- issue: 예언적 현시에서 야훼의 구름-강림 이미지 보존
  chosen_reading: ‘빠른 구름을 타고… 오십니다’로 직설적으로 유지했습니다.
  alternative_readings:
  - ‘신속하게 이집트로 오십니다’처럼 이미지 완화
  - ‘구름 타고 임하십니다’처럼 교회적 표현 사용
  rationale: 본문은 야훼의 강림을 생생한 신현(神顯) 이미지로 제시합니다. 이를 추상화하지 않고 유지해야 독자가 히브리어의 충격과 장엄함을 그대로 이해할 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
