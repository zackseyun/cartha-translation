revisions:
- from: '이집트에 대한 엄중한 선포입니다: 보십시오, 야훼께서 빠른 구름을 타고 이집트로 오십니다. 이집트의 우상들이 그 앞에서 떨 것이며, 이집트의 마음은 그 속에서 녹아내릴 것입니다.[a][b][c]'
  to: '이집트에 관한 신탁[a]입니다: 보십시오, 야훼께서 빠른 구름을 타고 이집트로 오십니다. 이집트의 우상들이 그 앞에서[b] 떨 것이며, 이집트의 마음은 그 안에서[c] 녹아내릴 것입니다.'
  rationale: מַשָּׂא의 장르적 의미를 과도한 해석 없이 ‘신탁’으로 옮기고, 모든 각주 표지를 해당 본문 어구에 직접 연결했습니다. 나머지 표현은 원문의 신현 이미지, 예언적 현재성, 공포의 은유, 이집트의 단수 의인화를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:27Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미와 신현 이미지, 야훼라는 신명, 국가를 단수로 받는 마지막 표현은 대체로 충실합니다. 다만 מַשָּׂא에 ‘엄중한’이라는 해석적 뉘앙스를 더하기보다 예언서 표제에 맞는 ‘신탁’이 더 직접적입니다. 또한 각주 표지는 해당 어구에 붙여야 합니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. ‘이집트에 관한 신탁’은 표제로 자연스럽고, 각주 표지를 해당 문구 뒤에 배치하면 독해가 더 분명해집니다.
  terminology: ‘야훼’, ‘우상’, ‘마음’, ‘녹아내리다’는 적절합니다. מַשָּׂא는 여기서 ‘신탁’으로 옮기는 것이 현대 한국어의 예언서 표제 관습과 원문의 기능에 가장 잘 맞습니다.
