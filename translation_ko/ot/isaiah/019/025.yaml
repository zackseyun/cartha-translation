source:
  edition: WLC
  text: אֲשֶׁ֧ר בֵּרֲכ֛/וֹ יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר בָּר֨וּךְ עַמִּ֜/י מִצְרַ֗יִם וּ/מַעֲשֵׂ֤ה יָדַ/י֙ אַשּׁ֔וּר וְ/נַחֲלָתִ֖/י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
  footnotes:
  - marker: a
    text: Or “the LORD of Hosts.”
    reason: lexical_alternative
  - marker: b
    text: The titles “my people” and “the work of my hands,” often associated with Israel, are here applied to Egypt and Assyria as well.
    reason: cross_reference
translation:
  language: ko
  text: 만군의 야훼께서 복을 주신 이들에게 이렇게 말씀하십니다.[a] “내 백성 이집트와 내 손의 작품 앗시리아와 나의 유업 이스라엘에게 복이 있습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צְבָאוֹת은 문자적으로 ‘군대들’ 또는 ‘무리들’을 뜻하며, 이 칭호는 전통적으로 ‘만군의 여호와’로도 옮겨집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 백성’과 ‘내 손의 작품’은 이스라엘에 흔히 붙는 표현이지만, 여기서는 이집트와 앗시리아에도 적용됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 주
  alternatives_korean:
  - 여호와 만군의 주
  - 야훼의 군대의 주
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת은 한국어 성경의 익숙한 관용을 살리면서도 군대/전쟁적 다중성을 유지하는 만군의 주로 옮겼습니다.
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 복되도다
  alternatives_korean:
  - 복을 받으십시오
  - 복이 있도다
  lexicon: HALOT
  rationale: 축복 선언의 형식을 살리기 위해 단순 서술보다 선언적 감탄형을 택했고, 이어지는 직접 인용 안에서 보다 압축적인 축복 어법을 유지했습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 사람들
  - 내 백성들
  lexicon: HALOT
  rationale: עם의 언약적 소속을 한국어에서 가장 자연스럽게 드러내는 표현은 내 백성입니다. 이 표현은 이스라엘에 한정되던 호칭이 이집트에까지 적용된다는 긴장을 보존합니다.
- source_word: וּמַעֲשֵׂה יָדַי
  english_pob_choice: and Assyria the work of my hands
  chosen_korean: 내 손의 일인 앗시리아
  alternatives_korean:
  - 내 손으로 지은 앗시리아
  - 내 손의 일인 아시리아
  lexicon: HALOT
  rationale: מַעֲשֵׂה יָדַי의 직역을 살리되 한국어에서 어색하지 않도록 관계적 서술인 내 손의 일로 옮겼습니다. 이는 창조/조성의 주권을 강조하는 표현입니다.
- source_word: וְנַחֲלָתִי
  english_pob_choice: and Israel my inheritance
  chosen_korean: 나의 유업 이스라엘
  alternatives_korean:
  - 나의 상속 이스라엘
  - 내 기업 이스라엘
  lexicon: HALOT
  rationale: נַחֲלָה는 단순한 재산보다 ‘받아 소유한 몫/유업’의 뜻이 강하므로, 전통적 교회어인 기업보다 의미가 분명한 유업을 택했습니다.
theological_decisions:
- issue: 이집트와 앗시리아에 적용된 언약적 호칭
  chosen_reading: 내 백성 이집트와 내 손의 일인 앗시리아라는 직설적 표지를 그대로 유지했습니다.
  alternative_readings:
  - 이집트를 이제 내 백성으로, 앗시리아를 내 손으로 지은 자로 풀어 쓰는 설명적 번역
  rationale: 본문은 이스라엘에 전형적으로 붙는 언약 언어를 이방 민족에 그대로 적용하여 충격과 확장을 드러냅니다. 이를 풀어 설명하면 본문의 신학적 긴장이 약화됩니다.
  doctrine_reference: 'Translation philosophy #3'
