id: ISA.19.8
reference: Isaiah 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנוּ֙ הַ/דַּיָּגִ֔ים וְ/אָ֣בְל֔וּ כָּל מַשְׁלִיכֵ֥י בַ/יְא֖וֹר חַכָּ֑ה וּ/פֹרְשֵׂ֥י מִכְמֹ֛רֶת עַל פְּנֵי מַ֖יִם אֻמְלָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
  footnotes:
  - marker: a
    text: Or 'the river'; in this Egyptian context, the Hebrew term commonly refers specifically to the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or 'will languish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어부들은 애통할 것이며, 나일강에 낚싯바늘을 드리우는 모든 사람은 슬퍼할 것입니다. 물 위에 그물을 펼치는 사람들은 쇠잔해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이집트의 ‘강’은 보통 나일강을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘쇠잔해질 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדַּיָּגִים
  english_pob_choice: the fishermen
  chosen_korean: 어부들
  alternatives_korean:
  - 낚시꾼들
  - 물고기잡이들
  lexicon: HALOT
  rationale: 직업 집단을 가리키므로 표준적이고 자연스러운 ‘어부들’이 적절합니다.
- source_word: וְאָנוּ
  english_pob_choice: will lament
  chosen_korean: 애통할 것입니다
  alternatives_korean:
  - 탄식할 것입니다
  - 슬퍼할 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 감정 표현보다 공개적이고 비통한 애도를 나타내므로 ‘애통하다’가 מקור의 비애를 잘 드러냅니다.
- source_word: בַיְאֹר
  english_pob_choice: into the Nile
  chosen_korean: 나일강에
  alternatives_korean:
  - 강에
  - 나일에
  lexicon: HALOT
  rationale: 이집트 문맥에서 יְאֹר는 일반적인 ‘강’보다 나일을 가리키는 경우가 분명하므로, 독자가 식별할 수 있게 ‘나일강’으로 옮겼습니다.
- source_word: אֻמְלָלוּ
  english_pob_choice: will waste away
  chosen_korean: 쇠잔해질 것입니다
  alternatives_korean:
  - 기운이 빠질 것입니다
  - 쇠약해질 것입니다
  lexicon: HALOT
  rationale: 단순한 슬픔을 넘어 기력이 빠지고 마르는 상태를 나타내므로, 경제적·삶의 붕괴를 함께 암시하는 ‘쇠잔해지다’가 어울립니다.
theological_decisions:
- issue: 예언적 미래 시제의 한국어 처리
  chosen_reading: 모든 동사를 미래형으로 번역해 심판의 확정성을 드러냈습니다.
  alternative_readings:
  - 현재형으로 옮겨 묘사적 느낌을 주는 방식
  - ‘-게 될 것입니다’로 완곡하게 옮기는 방식
  rationale: 히브리어 연속 동사는 예언적 선언으로 기능하므로, 한국어에서도 미래형을 유지해 선포의 힘을 보존했습니다.
  doctrine_reference: 예언 문체와 심판 선언의 수사적 기능
