id: ISA.19.19
reference: Isaiah 19:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶ֤ה מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה בְּ/ת֖וֹךְ אֶ֣רֶץ מִצְרָ֑יִם וּ/מַצֵּבָ֥ה אֵֽצֶל גְּבוּלָ֖/הּ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
  footnotes:
  - marker: a
    text: Or 'and a standing stone to the LORD near its border.' The Hebrew מַצֵּבָה can denote an erected stone or pillar; 'pillar' is used in the main text as the most natural concise rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 이집트 땅 한가운데에 야훼를 위한 제단이 있고, 그 땅의 경계 가까이에 야훼를 위한 기둥이 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기둥’은 ‘세운 돌’로도 옮길 수 있습니다. 히브리어 מַצֵּבָה는 세워 놓은 돌이나 기둥을 뜻할 수 있으며, 본문에서는 가장 간결하고 자연스러운 표현으로 ‘기둥’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그 날에
  - 그때에는
  lexicon: HALOT
  rationale: 예언서의 관용적 시간 표지로, 장중한 미래 지시를 자연스럽게 살리기 위해 ‘그날에는’으로 옮겼습니다.
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제사단
  - 단
  lexicon: HALOT
  rationale: 예배·제사 맥락의 표준어인 ‘제단’이 히브리어의 기본 의미를 가장 직접적으로 드러냅니다.
- source_word: מַצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 세운 돌
  - 석주
  - 비석
  lexicon: HALOT
  rationale: 문맥상 야훼께 드리는 표지물로 세워진 돌/기둥을 가리키므로, 간결하면서도 물리적 형상을 살리는 ‘기둥’이 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께 드리는
  alternatives_korean:
  - 야훼께
  - 야훼를 위한
  lexicon: HALOT
  rationale: ל의 소속·봉헌 의미를 반영해 제단과 기둥이 야훼께 바쳐진 대상임을 분명히 하기 위해 ‘드리는’을 보완했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기식 고유명사인 YHWH를 직접 사용하므로, 한국어 본문에서도 대체 칭호가 아니라 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מַצֵּבָה의 긍정적 사용
  chosen_reading: 기둥
  alternative_readings:
  - 세운 돌
  - 석주
  - 우상 기둥
  rationale: 이 구절은 금지된 우상 숭배의 문맥이 아니라 야훼께 속한 표지로 מַצֵּבָה를 긍정적으로 제시하므로, 의미를 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
