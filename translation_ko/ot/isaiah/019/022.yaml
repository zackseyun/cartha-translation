id: ISA.19.22
reference: Isaiah 19:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
  footnotes:
  - marker: a
    text: Or 'turn to the LORD.' The Hebrew verb can denote turning or returning, often with repentance in prophetic contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will be entreated by them' / 'he will hear their supplication.' The Hebrew expression means that the LORD responds favorably to their appeal.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이집트[a]를 치시되 치고도 고치실 것이며, 그들이 야훼께로 돌아오면[b] 그들의 간구를 들으시고 그들을 고치실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이집트’는 מִצְרַיִם의 현대 한국어 표준 지명입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼께로 돌이키면’. שׁוב는 예언서에서 회개와 관계 회복을 함께 함의할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: POB의 일관된 원칙에 따라 신명사 יְהוָה는 대체 호칭이 아니라 고유명으로 옮겨야 하므로, 한국어에서도 음역형 ‘야훼’를 사용했습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 현대 표준 한국어 지명으로 옮겨 본문이 가진 역사·지리적 지시를 분명하게 했습니다.
- source_word: נָגֹף וְרָפוֹא
  english_pob_choice: striking and healing
  chosen_korean: 치고도 고치실 것이며
  alternatives_korean:
  - 치고 고치실 것이며
  - 치시고 회복시키실 것이며
  lexicon: HALOT
  rationale: 히브리어의 병렬된 분사/명사적 표현이 심판과 치유의 긴장을 함께 드러내므로, 단순한 순서 표시보다 ‘치고도 고치실’로 두 동작을 함께 살렸습니다.
- source_word: וְשָׁבוּ עַד יְהוָה
  english_pob_choice: and they will return to Yahweh
  chosen_korean: 그들이 야훼께로 돌아오면
  alternatives_korean:
  - 그들이 야훼께로 돌아가면
  - 그들이 야훼께로 돌이키면
  lexicon: HALOT
  rationale: שׁוב의 예언서적 용례에서 ‘돌아오다’는 회개와 관계 회복의 뉘앙스를 함께 담을 수 있어, 문맥의 종교적 의미를 과도하게 좁히지 않는 표현으로 선택했습니다.
- source_word: וְנֶעְתַּר לָהֶם
  english_pob_choice: and he will respond to their pleas
  chosen_korean: 그들의 간구를 들으시고
  alternatives_korean:
  - 그들의 청원을 들으시고
  - 그들에게 간구를 받아주시고
  lexicon: HALOT
  rationale: עתר의 수동/반사적 뉘앙스는 ‘간청에 응답하다’는 뜻이므로, 한국어에서는 ‘간구를 들으시다’로 자연스럽고도 호의적 응답을 표현했습니다.
theological_decisions:
- issue: 심판과 치유의 병치
  chosen_reading: 본문이 야훼께서 이집트를 치시는 동시에 고치시는 분으로 제시한다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 치시는 행위는 징벌이고 치유는 단순한 정치적 회복으로만 축소하는 읽기
  rationale: 히브리어는 두 행위를 모두 야훼의 사역으로 귀속시키므로, 번역에서도 어느 한쪽으로 해소하지 않고 함께 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
