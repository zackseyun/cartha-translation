  source_fidelity: 수정이 필요합니다. וְשָׁבוּ는 직설적 미래 접속으로 ‘돌아올 것이며’로 옮겨야 하며, 초안의 ‘돌아오면’은 원문에 없는 조건 관계를 만듭니다. 또한 נָגֹף וְרָפוֹא의 병치는 ‘치시되, 치시고 고치실’로 보존할 수 있습니다.
  naturalness: 합쇼체 문체와 현대 표준어에 맞게 ‘고치실 것입니다’, ‘간청을 들어 주시고’를 사용했습니다. ‘치시되, 치시고 고치실’은 히브리어의 의도적인 반복과 심판·치유의 병치를 자연스럽게 반영합니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. מִצְרַיִם은 ‘이집트’, רפא는 문맥의 폭을 제한하지 않는 ‘고치다’로 옮깁니다. עתר의 니팔형은 단순 청취보다 호의적인 간청 수납을 뜻하므로 ‘간청을 들어 주시고’로 번역하고 주석으로 보완합니다.
