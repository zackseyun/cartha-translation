revisions:
- from: 야훼께서 이집트[a]를 치시되 치고도 고치실 것이며, 그들이 야훼께로 돌아오면[b] 그들의 간구를 들으시고 그들을 고치실 것입니다.
  to: 야훼께서 이집트를 치시되, 치시고 고치실 것입니다. 그들은 야훼께로 돌아올 것이며[a], 야훼께서는 그들의 간청을 들어 주시고[b] 그들을 고치실 것입니다.
  rationale: 조건절을 미래 서술로 고쳐 원문의 접속 구조를 보존했습니다. ‘치시되, 치시고 고치실’은 נָגֹף וְרָפוֹא의 반복과 병치를 반영하며, ‘들어 주시고’에는 נעתר의 호의적 응답 의미를 주석으로 명시했습니다. 불필요한 이집트 지명 주석은 제거하고 번역상 실제 쟁점인 두 표현에 주석을 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:29Z'
