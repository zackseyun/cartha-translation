id: ISA.19.21
reference: Isaiah 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
  footnotes:
  - marker: a
    text: Or, 'the LORD will be known to Egypt.' The Hebrew verb can be rendered more passively, but the main text brings out the sense of divine self-disclosure.
    reason: lexical_alternative
  - marker: b
    text: Or, 'they will serve with sacrifice and offering.' The Hebrew verb can mean 'serve,' but here it refers to worship in a sacrificial context.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'vow vows,' an emphatic expression meaning they will make vows to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이집트에 자신을 알리실 것이며,[a] 그날에 이집트는 야훼를 알게 될 것입니다. 그들은 희생 제물과 예물로 야훼를 섬기며,[b] 야훼께 서원을 드리고 그것을 이행할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 이집트에 알려지실 것입니다.’ 히브리어 동사는 더 수동적으로도 옮길 수 있지만, 본문은 하나님의 자기계시의 의미를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 희생 제물과 예물로 야훼를 예배할 것입니다.’ 히브리어 동사는 ‘섬기다’의 뜻을 지니지만, 여기서는 제의적 문맥에서 사용됩니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘서원을 서원하고’라는 동족 목적어의 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע יְהוָה לְמִצְרַיִם
  english_pob_choice: will make himself known to Egypt
  chosen_korean: 야훼께서 이집트에게 알려지실 것이며
  alternatives_korean:
  - 이집트에게 자신을 드러내실 것이며
  - 이집트에게 알려질 것이며
  lexicon: HALOT
  rationale: נודע의 수동/반사 뉘앙스를 살리되, 한국어에서는 ‘알려지다’가 가장 자연스럽고 원문의 신적 자기계시를 충분히 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 여호와 대체어가 아니라 신명 자체를 옮겨야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: וְעָבְדוּ זֶבַח וּמִנְחָה
  english_pob_choice: they will serve/worship with sacrifice and offering
  chosen_korean: 그들은 희생제물과 예물로 섬기고
  alternatives_korean:
  - 그들은 희생제물과 예물로 예배하고
  - 그들은 희생제물과 예물을 드리며 섬기고
  lexicon: HALOT
  rationale: עבד는 제의적 문맥에서 단순한 ‘봉사’보다 ‘섬기다’가 한국어 본문에서 더 직접적으로 대응하며, 제물과 예물이 뒤따르므로 예배 행위를 암시합니다. ‘예물’은 일반적 cultic offering을 무리 없이 담습니다.
- source_word: וְנָדְרוּ נֵדֶר וְשִׁלֵּמוּ
  english_pob_choice: they will vow vows ... and fulfill them
  chosen_korean: 야훼께 서원한 서원을 이루어 낼 것입니다
  alternatives_korean:
  - 야훼께 서원한 서원을 갚을 것입니다
  - 야훼께 서원한 서원을 지킬 것입니다
  lexicon: HALOT
  rationale: 히브리어의 같은 어근 반복(‘vow vows’)을 한국어에서 ‘서원한 서원’으로 일부 반영했고, שלם는 서원을 ‘갚다/이루다’의 뜻이므로 ‘이루어 내다’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 이사야 19:21의 열방-예배 전망과 제의 언어
  chosen_reading: 이집트가 야훼를 알고, 제물과 서원으로 야훼를 섬기는 미래를 직설적으로 진술합니다.
  alternative_readings:
  - 상징적·비유적으로 완화해 읽는 방식
  - 단순한 도덕적 ‘섬김’으로 좁히는 방식
  rationale: 본문은 야훼의 자기계시와 이집트의 인식, 그리고 실제 제의적 언어를 나란히 두므로, 이를 약화하지 않고 그대로 옮기는 것이 원문의 신학적 강도를 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
