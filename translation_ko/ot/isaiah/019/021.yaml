revisions:
- from: 야훼께서 이집트에게 알려지실 것이며, 그 날에 이집트는 야훼를 알게 될 것입니다. 그들은 희생제물과 예물로 섬기고, 야훼께 서원한 서원을 이루어 낼 것입니다.[a][b][c]
  to: 야훼께서 이집트에 자신을 알리실 것이며,[a] 그날에 이집트는 야훼를 알게 될 것입니다. 그들은 희생 제물과 예물로 야훼를 섬기며,[b] 야훼께 서원을 드리고 그것을 이행할 것입니다.[c]
  rationale: 본문의 의미를 바꾸지 않고, נודע의 자기계시적 문맥을 더 자연스러운 한국어로 표현했습니다. 또한 제의적 섬김의 대상인 야훼를 문맥상 명시하고, 서원의 이행을 현대 한국어 관용에 맞게 옮겼습니다. 모든 각주 표지를 해당 어구 뒤로 옮기고, 각주 b를 실제 번역 대안으로 수정했습니다.
