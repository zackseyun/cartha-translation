  naturalness: ‘다듬은 아마를 다루는 자들’과 ‘흰 천을 짜는 자들’은 현대 표준 한국어로 자연스럽습니다. 병렬된 두 직업군에 대한 결과는 두 번째 절에서 생략되어 있으므로 ‘자들도 그러할 것입니다’로 보충하여 자연스럽게 나타낼 수 있습니다.
  terminology: ‘아마’는 flax의 정확한 식물명이며, ‘흰 천’은 חוֹרָי의 불확실성을 과도하게 좁히지 않습니다. בוש의 수치·굴욕의 결과는 ‘수치를 당할 것입니다’로 적절히 전달됩니다.
