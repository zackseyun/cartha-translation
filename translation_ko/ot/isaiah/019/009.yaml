base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
  footnotes:
  - marker: a
    text: Or 'fine flax' for 'combed flax.' The Hebrew term likely refers to specially prepared high-quality flax.
    reason: lexical_alternative
  - marker: b
    text: Or 'white linen.' The Hebrew likely refers to whitened or bleached textile material.
    reason: lexical_alternative
translation:
  language: ko
  text: 삼을 다듬는 자들은 부끄러움을 당하고, 희고 얇은 천을 짜는 자들도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '고운 삼'. 히브리어는 특별히 정리된 고급 아마를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '흰 아마천'. 히브리어는 희게 표백한 직물을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  english_pob_choice: will be ashamed
  chosen_korean: 부끄러움을 당하고
  alternatives_korean:
  - 부끄러워하고
  - 수치를 당하고
  - 당황하고
  lexicon: HALOT
  rationale: בוש의 핵심은 수치와 굴욕이므로, 문맥상의 심판 결과를 살려 수동적 표현인 '부끄러움을 당하고'로 옮겼습니다.
- source_word: עֹבְדֵי פִשְׁתִּים
  english_pob_choice: those who work with combed flax
  chosen_korean: 삼을 다듬는 자들
  alternatives_korean:
  - 삼을 가공하는 자들
  - 삼을 작업하는 자들
  - 빗질한 삼을 다루는 자들
  lexicon: HALOT
  rationale: עֹבְדֵי는 단순 노동자보다 특정 물질을 다루는 직종을 가리키므로, POB의 'work with'를 자연스럽게 살려 '삼을 다듬는 자들'로 옮겼습니다.
- source_word: שְׂרִיקוֹת
  english_pob_choice: combed
  chosen_korean: 다듬는
  alternatives_korean:
  - 빗질한
  - 고운
  - 선별된
  lexicon: HALOT
  rationale: 이 형용사는 고급으로 정리된 아마를 뜻할 가능성이 크므로, 원문의 가공 상태를 드러내는 동사형 표현으로 처리했습니다.
- source_word: חוֹרָי
  english_pob_choice: white cloth
  chosen_korean: 희고 얇은 천
  alternatives_korean:
  - 흰 천
  - 흰 베
  - 백포
  lexicon: HALOT
  rationale: 어근상 흰색/희게 된 직물의 뜻을 반영하면서도, 한국어에서 더 자연스럽게 직조품의 성격을 드러내기 위해 '희고 얇은 천'으로 옮겼습니다.
theological_decisions:
- issue: 심판 예언의 결과를 나타내는 동사 뉘앙스
  chosen_reading: 단순한 실패보다 수치와 굴욕의 결과를 강조하는 '부끄러움을 당하고'로 옮겼습니다.
  alternative_readings:
  - 실망하고
  - 망하고
  rationale: 본문의 בוש는 경제적 실패를 넘어 공적 수치와 좌절을 포함하므로, 예언적 심판의 어조를 유지하는 번역이 필요합니다.
  doctrine_reference: 예언서의 심판 선언은 단순 정보 전달이 아니라 언약적 수치와 반전을 드러냅니다.
