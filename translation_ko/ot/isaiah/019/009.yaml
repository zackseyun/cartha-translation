  language: ko
  text: 다듬은 아마[a]를 다루는 자들은 수치를 당할 것이며, 흰 천[b]을 짜는 자들도 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고운 아마’. 히브리어는 특별히 정리되거나 가공된 고급 아마를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘흰 아마천’. 히브리어는 희게 하거나 표백한 직물을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
