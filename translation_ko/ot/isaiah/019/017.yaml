revisions:
- from: 유다의 땅은 이집트에게 공포가 될 것입니다[c][a]. 그것이 언급될 때마다 누구든지 야훼 만군의 계획 때문에 두려워할 것입니다[b]. 그는 그것을 거슬러 계획하고 계십니다.
  to: 유다의 땅은 이집트에 공포가 될 것입니다[a]. 유다에 대한 말이 누구에게 들리든[b], 그 사람은 만군의 야훼[c]께서 이집트를 거슬러 세우고 계신 계획 때문에 두려워할 것입니다.
  rationale: 원문의 관계절을 ‘계획’에 직접 연결하고, 이집트를 마지막 접미사의 선행사로 명시했습니다. 압축된 히브리어 구문은 한국어의 자연스러운 조건·분배 구문으로 풀되, 모든 언급을 듣는 사람이 두려워한다는 뜻을 보존했습니다. 신명 및 각주 앵커도 해당 대상에 맞추어 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:29Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 잘 옮겼습니다. 그러나 원문의 마지막 관계절(‘그가 그것을 거슬러 계획하고 계신’)은 앞 문장에서 분리하지 말고 ‘만군의 야훼께서 이집트를 거슬러 세우고 계신 계획’으로 결속하는 편이 원문 구조와 지시 대상(이집트)을 더 분명히 드러냅니다. 또한 원문의 ‘모든 사람/누구든지’는 유다에 대한 언급을 듣는 각 사람을 가리킵니다.
  naturalness: 초안의 ‘그것이 언급될 때마다 누구든지’는 수식 관계가 다소 어색하고, ‘야훼 만군’은 현대 한국어에서 명사구 결속이 불분명합니다. ‘유다에 대한 말이 누구에게 들리든’ 및 ‘만군의 야훼’가 더 자연스럽고 명료합니다.
  terminology: ‘유다의 땅’, ‘이집트’, ‘공포’, ‘야훼’는 적절합니다. צְבָאוֹת은 ‘만군’으로 유지하되, 신명과의 관계를 ‘만군의 야훼’로 표현합니다. 전통적 한국어 성경의 명칭은 ‘만군의 여호와’이므로 관련 각주도 바로잡습니다.
  issues:
  - severity: medium
    issue: 마지막 문장이 원문의 관계절에서 분리되어 선행사와 목적어의 지시가 약해집니다.
    rationale: אֲשֶׁר הוּא יוֹעֵץ עָלָיו는 ‘만군의 야훼의 계획’을 수식하며, 마지막 접미사는 이집트를 가리킵니다. 이를 한 문장 안에 결속하면 구조와 의미가 명료해집니다.
  - severity: medium
    issue: ‘그것이 언급될 때마다 누구든지’는 한국어 문장 구조상 부자연스럽습니다.
    rationale: 원문은 유다에 대한 언급이 전달되는 사람을 분배적으로 가리킵니다. ‘유다에 대한 말이 누구에게 들리든, 그 사람은’이 이를 자연스럽게 나타냅니다.
  - severity: low
    issue: ‘야훼 만군’의 소유·수식 관계가 불분명하고, 전통 번역 각주의 표현이 부정확합니다.
    rationale: 히브리어 신명은 ‘야훼 만군’이 아니라 ‘만군의 야훼’로 결속하는 것이 자연스럽습니다. 한국어 전통 번역의 통상 표현은 ‘만군의 여호와’입니다.
  - severity: low
    issue: 각주 c의 앵커가 ‘공포’ 뒤에 놓여 있으나, 그 내용은 신명 번역에 관한 것입니다.
    rationale: 각주 앵커는 ‘야훼’ 또는 해당 신명구 뒤에 배치해야 합니다.
