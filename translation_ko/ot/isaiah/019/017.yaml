id: ISA.19.17
reference: Isaiah 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָיְתָה אַדְמַ֨ת יְהוּדָ֤ה לְ/מִצְרַ֨יִם֙ לְ/חָגָּ֔א כֹּל֩ אֲשֶׁ֨ר יַזְכִּ֥יר אֹתָ֛/הּ אֵלָ֖י/ו יִפְחָ֑ד מִ/פְּנֵ֗י עֲצַת֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא יוֹעֵ֥ץ עָלָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
  footnotes:
  - marker: a
    text: Or 'a dread,' 'a horror,' or according to another interpretive tradition, 'reeling.' The Hebrew term is rare and difficult.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'everyone to whom it is mentioned'; the wording means that any mention of Judah will make an Egyptian afraid.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 땅은 이집트에 공포가 될 것입니다[a]. 유다에 대한 말이 누구에게 들리든[b], 그 사람은 만군의 야훼[c]께서 이집트를 거슬러 세우고 계신 계획 때문에 두려워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 희귀하고 난해한 단어는 ‘공포’, ‘두려움’, ‘전율’로도 옮길 수 있으며, 다른 해석 전통에서는 ‘비틀거림’으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그것이 그에게 언급되는 모든 사람’에 가깝습니다. 유다에 대한 언급을 듣는 이집트 사람마다 두려워한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 전통 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  english_pob_choice: the land of Judah
  chosen_korean: 유다의 땅
  alternatives_korean:
  - 유다의 토지
  - 유다의 땅덩이
  lexicon: HALOT
  rationale: 지리·정치적 문맥에서 אַדְמָה는 문자 그대로의 ‘흙’보다 영토를 가리키므로, 한국어도 자연스럽게 ‘유다의 땅’으로 옮겼습니다.
- source_word: לְחָגָּא
  english_pob_choice: a terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 전율
  - 공포스러운 존재
  lexicon: HALOT
  rationale: 희귀하고 난해한 명사이지만 바로 뒤의 ‘두려워할 것입니다’와 의미가 맞물리므로, 결과 상태를 드러내는 ‘공포’가 가장 투명합니다.
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  english_pob_choice: everyone to whom it is mentioned
  chosen_korean: 그것이 언급될 때마다 누구든지
  alternatives_korean:
  - 그것이 말해질 때마다 누구든지
  - 누구든지 그것을 언급받을 때마다
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문은 ‘유다에 대한 언급을 듣는 사람마다’라는 분배적 뜻이므로, 어색한 직역보다 그 기능을 살린 한국어로 풀었습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군
  alternatives_korean:
  - 야훼 군대들의 주
  - 야훼의 군대
  lexicon: HALOT
  rationale: 본 프로젝트의 기본값에 따라 יהוה는 ‘야훼’로, צְבָאוֹת은 전통어 ‘만군’을 사용하되, 하나님의 군사적 권위를 유지하도록 했습니다.
theological_decisions:
- issue: ‘이집트에게’에 해당하는 ל의 방향성과 प्रभाव
  chosen_reading: 유다가 이집트에게 공포가 된다는 관계를 살려 번역했습니다.
  alternative_readings:
  - 이집트를 위한 공포
  - 이집트를 향한 공포
  rationale: 문맥상 ל는 단순한 수혜가 아니라 ‘이집트의 경험/인식 속에서’라는 관계를 나타내므로, ‘~에게 공포가 되다’로 옮기는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §2, source-context rendering
