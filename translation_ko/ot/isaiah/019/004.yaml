  source_fidelity: 히브리어의 두 미래형을 각각 미래의 직접 진술로 옮겨야 합니다. 초안의 ‘넘겨 주며’는 뒤 절에 종속되고, ‘다스리게 하겠습니다’는 왕이 다스리도록 하나님이 원인 제공을 하신다는 사역 의미를 더합니다. 또한 הָאָדוֹן יְהוָה צְבָאוֹת는 ‘주, 만군의 야훼’보다 ‘만군의 야훼이신 주’가 한국어 문법과 원문의 동격 관계를 더 분명히 드러냅니다.
  naturalness: ‘엄한 주인’은 현대 한국어에서 훈육상의 엄격함을 쉽게 연상시켜 억압적 통치라는 문맥에 다소 약합니다. ‘가혹한 주인’이 자연스럽고 정확합니다. ‘사나운 왕’도 사람 통치자에게는 다소 동물적인 어감이므로 ‘강력한 왕’으로 다듬는 편이 좋습니다.
  terminology: יְהוָה는 판본 원칙에 따라 ‘야훼’로 유지하고, צְבָאוֹת는 ‘만군’으로 옮깁니다. 인간 지배자인 אֲדֹנִים에는 신적 칭호와 구별되도록 ‘주인’을 유지합니다.
