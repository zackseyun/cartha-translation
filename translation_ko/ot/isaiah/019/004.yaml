  chosen_korean: 손에
  alternatives_korean:
  - 권력 아래
  - 지배 아래
  - 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘손에’로 옮기면, 누군가의 통제와 권세 아래 들어가는 이미지를 직접 유지할 수 있습니다.
- source_word: אֲדֹנִים קָשֶׁה
  english_pob_choice: a harsh master
  chosen_korean: 엄한 주인
  alternatives_korean:
  - 혹독한 주인
  - 가혹한 주인
  - 엄한 임금
  lexicon: HALOT
  rationale: 문맥상 인간 통치자를 가리키므로 ‘주인’이 적절하고, קָשֶׁה는 단순한 강함보다 억압적 엄격함을 나타내므로 ‘엄한’이 자연스럽습니다.
- source_word: וּמֶלֶךְ עַז
  english_pob_choice: a fierce king
  chosen_korean: 사나운 왕
  alternatives_korean:
  - 강한 왕
  - 위력 있는 왕
  - 포악한 왕
  lexicon: HALOT
  rationale: עַז는 여기서 정치적 능력보다 심판적·압제적 위세를 띠므로, 단순한 ‘강한’보다 ‘사나운’이 문맥의 위협감을 더 잘 살립니다.
theological_decisions:
- issue: יהוה צְבָאוֹת의 한국어 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 여호와
  - 만군의 주님
  - 만군의 주, 야훼
  rationale: 문서의 기본 원칙에 따라 יְהוָה는 고유명사 ‘야훼’로 옮기고, צְבָאוֹת는 군사적 의미가 분명한 ‘만군’으로 처리해 전통적 대체어를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
