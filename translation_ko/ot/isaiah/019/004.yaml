  - 넘겨주겠습니다
  lexicon: HALOT
  rationale: 여기서는 애굽을 다른 세력의 지배 아래 두는 의미가 핵심이므로, 소유 이전보다 권력 이양을 드러내는 ‘넘겨 주다’가 본문에 가장 가깝습니다.
- source_word: בְּיַד
