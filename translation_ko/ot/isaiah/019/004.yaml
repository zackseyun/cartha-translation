base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'I will hand Egypt over into the power of a harsh master.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a harsh master'; the noun is morphologically plural ('lords') but likely functions here as a singular of majesty or intensity, as reflected by the following singular 'king.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: ''the Lord GOD of Hosts.'''
    reason: alternative_reading
translation:
  language: ko
  text: 내가 애굽을 엄한 주인의 손에 넘겨 주며, 사나운 왕이 그들을 다스리게 하겠습니다. 주, 만군의 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엄한 주인’은 히브리어의 복수형 어형(‘주인들’)을 따로 드러내지 않고, 문맥상 단수 지배자를 뜻하는 것으로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘여호와’ 또는 ‘주 여호와’로도 옮기지만, 이 판본은 하나님의 이름 יְהוָה를 ‘야훼’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  english_pob_choice: I will give
  chosen_korean: 넘겨 주며
  alternatives_korean:
  - 주겠습니다
