  rationale: 명사 מַעֲשֶׂה와 관계절을 함께 받아, 단순한 ‘일’보다 ‘할 수 있는 일’로 능력 부재를 분명히 했습니다.
- source_word: רֹ֥אשׁ וְ/זָנָ֖ב כִּפָּ֥ה וְ/אַגְמֽוֹן
  english_pob_choice: head or tail, palm branch or reed
  chosen_korean: “머리나 꼬리, 종려가지나 갈대”
  alternatives_korean:
  - 머리와 꼬리, 종려가지와 갈대
  - 머리나 꼬리, 야자가지나 갈대
  lexicon: HALOT
  rationale: 이 네 항목은 사회적 상하를 가리키는 비유이므로, 직역 이미지를 유지하면서 한국어에서 가장 직관적인 식물 명칭을 택했습니다.
theological_decisions:
- issue: 비유적 열거의 기능
  chosen_reading: ‘머리나 꼬리, 종려가지나 갈대’는 이집트 사회의 최고층부터 최하층까지를 포괄하는 비유로 읽었습니다.
  alternative_readings:
  - 각 항목을 개별 식물·신체 부위로만 읽는 해석
  - 단순한 수사적 과장으로만 읽는 해석
  rationale: 직전 절과 평행하는 관용적 대비를 보존해야 본문의 핵심인 ‘아무 계층도 아무 일도 할 수 없음’이 드러납니다.
  doctrine_reference: 이사야 19:14-15 문맥
