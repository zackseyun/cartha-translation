  text: וְ/לֹֽא יִהְיֶ֥ה לְ/מִצְרַ֖יִם מַֽעֲשֶׂ֑ה אֲשֶׁ֧ר יַעֲשֶׂ֛ה רֹ֥אשׁ וְ/זָנָ֖ב כִּפָּ֥ה וְ/אַגְמֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
  footnotes:
  - marker: a
    text: Hebrew 'head or tail, palm branch or reed' is a figurative expression for every level of society, from highest to lowest; compare Isaiah 19:15 with the similar imagery in Isaiah 9:14.
    reason: cross_reference
  - marker: b
    text: Or 'head and tail, palm branch and reed.' The Hebrew pairs may be read coordinately, but the sense is that no part of Egypt, high or low, will be able to act.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트에는 머리나 꼬리, 종려가지나 갈대가 할 수 있는 일이 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리나 꼬리, 종려가지나 갈대’는 사회의 높고 낮음을 모두 가리키는 비유입니다. 이사야 9:14의 유사한 이미지와 비교할 수 있습니다.
    reason: cross_reference
  - marker: b
    text: 히브리어의 대응쌍은 ‘머리와 꼬리, 종려가지와 갈대’로도 읽을 수 있지만, 뜻은 이집트의 어느 부분도 일을 해낼 수 없다는 데 있습니다.
    reason: lexical_alternative
