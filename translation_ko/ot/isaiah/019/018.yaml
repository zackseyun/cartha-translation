id: ISA.19.18
reference: Isaiah 19:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: ko
  text: 그 날에 이집트 땅에는 가나안의 언어를 말하고 만군의 야훼께 충성을 맹세하는 다섯 성읍이 있을 것이며, 그 가운데 하나는 파멸의 성읍이라 불릴 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘충성을 맹세하는’은 히브리어의 서약 표현을 POB의 ‘swearing allegiance’에 따라 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/יּ֣וֹם הַ/ה֡וּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그때
  - 그날
  lexicon: source phrase
  rationale: 예언서의 관용적 종말/회복 시점을 자연스러운 한국어로 옮기되, 본문의 시간 표지를 유지했습니다.
- source_word: מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן
  english_pob_choice: speaking the language of Canaan
  chosen_korean: 가나안의 언어를 말하고
  alternatives_korean:
  - 가나안 말을 하고
  - 가나안 방언을 말하고
  lexicon: source phrase
  rationale: ‘언어’를 선택해 원문의 표현을 직역에 가깝게 살리면서, ‘가나안’의 고유 지명을 보존했습니다.
- source_word: וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת
  english_pob_choice: swearing allegiance to the LORD of Armies
  chosen_korean: 만군의 야훼께 충성을 맹세하는
  alternatives_korean:
  - 만군의 야훼께 맹세하는
  - 만군의 주님께 충성 맹세를 하는
  lexicon: יהוה / YHWH
  rationale: YHWH는 본 프로젝트 기본값인 ‘야훼’로 옮기고, POB의 ‘swearing allegiance’는 단순 서약보다 충성의 공개적 맹세를 드러내므로 ‘충성을 맹세하는’으로 반영했습니다.
- source_word: עִ֣יר הַ/הֶ֔רֶס
  english_pob_choice: the City of Destruction
  chosen_korean: 파멸의 성읍
  alternatives_korean:
  - 멸망의 성읍
  - 파괴의 성읍
  lexicon: source phrase
  rationale: 어휘상 ‘파멸/멸망’이 가능하지만, 한국어에서 도시의 운명을 선명하게 드러내는 ‘파멸의 성읍’을 택했습니다.
theological_decisions:
- issue: יהוה in an oath formula within prophetic restoration speech
  chosen_reading: ‘만군의 야훼’로 본문에 반영해, 서약의 대상이 단순한 일반 신이 아니라 언약의 하나님임을 분명히 했습니다.
  alternative_readings:
  - ‘만군의 주님’
  - ‘만군의 여호와’
  rationale: 본문은 이집트의 성읍들이 야훼께 충성 맹세를 하는 장면이므로, 예언적 회복의 핵심이 우상 숭배의 전환과 언약 충성에 있음을 드러내야 합니다.
  doctrine_reference: 언약 신실성, 야훼의 주권
- issue: עִיר הַהֶרֶס의 의미
  chosen_reading: 지명/호칭으로서의 ‘파멸의 성읍’은 문자적 이름이면서도 심판의 표지를 유지하는 것으로 보았습니다.
  alternative_readings:
  - ‘멸망의 성읍’
  - 지명 의미를 완화한 의역
  rationale: 이 표현은 회복 예언 속에 남아 있는 심판의 긴장을 보존하므로, 완화하지 않고 직접적으로 옮겼습니다.
  doctrine_reference: 심판과 회복의 병존
