  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְּׁתוּ מַ֖יִם מֵֽ/הַ/יָּ֑ם וְ/נָהָ֖ר יֶחֱרַ֥ב וְ/יָבֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/005.yaml
  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
  footnotes:
  - marker: a
    text: Or 'the waters will be drained from the sea.' The Hebrew verb can denote waters being exhausted or dried up.
    reason: lexical_alternative
  - marker: b
    text: '''The river'' likely refers to the Nile in context, but the Hebrew text uses the common noun rather than the proper name.'
    reason: cultural_note
translation:
  language: ko
  text: 바다의 물들이 마르게 되고, 강은 메말라 바짝 마를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 물이 ‘마르게 되다’ 또는 ‘고갈되다’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강’은 문맥상 이집트의 나일강을 가리킬 가능성이 크지만, 히브리어 본문은 고유명사 대신 보통명사를 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/נִשְּׁתוּ
  english_pob_choice: will be dried up
  chosen_korean: 마르게 되고
  alternatives_korean:
  - 말라 버리고
  - 물러나고
  - 고갈되고
  lexicon: HALOT
  rationale: 니팔형의 결과적·수동적 의미를 살려 물이 ‘말라 없어지는’ 상태를 자연스럽게 나타냈습니다.
- source_word: מַ֖יִם מֵֽ/הַ/יָּ֑ם
  english_pob_choice: the waters of the sea
  chosen_korean: 바다의 물들
  alternatives_korean:
  - 바다의 물이
  - 바다에서 나온 물들이
  - 바다의 물이
  lexicon: HALOT
  rationale: 히브리어 복수형 מַיִם을 살려 ‘물들’로 옮기고, מקור 관계를 ‘바다의’로 간결하게 반영했습니다.
- source_word: נָהָ֖ר
  english_pob_choice: the river
  chosen_korean: 강
  alternatives_korean:
  - 그 강
  - 하천
  - 나일강
  lexicon: HALOT
  rationale: 원문은 보통명사 ‘강’을 사용하므로 고유명사로 바꾸지 않고, 문맥상 이집트의 큰 강을 가리키지만 본문 수준에서는 일반 명사를 유지했습니다.
- source_word: יֶחֱרַ֥ב וְ/יָבֵֽשׁ
  english_pob_choice: will be parched and dry
  chosen_korean: 메말라 바짝 마를 것입니다
  alternatives_korean:
  - 바짝 메말라 마를 것입니다
  - 바싹 마를 것입니다
  - 메마르고 마를 것입니다
  lexicon: HALOT
  rationale: 두 동사의 연속을 살려 첫 동사는 ‘메마르다/바싹 마르다’의 건조·황폐 뉘앙스로, 둘째는 상태의 종결을 ‘바짝 마르다’로 강화해 반복을 피했습니다.
