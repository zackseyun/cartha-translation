  source_fidelity: 원문의 시간 표지, 이집트의 여성 비유, 두 동사의 공포 표현, 그리고 야훼의 손을 흔드는 심판 이미지는 대체로 보존되었습니다. 그러나 ‘그 위에 흔드시는’은 עָלָיו의 적대적 방향과 선행사인 이집트를 한국어에서 부자연스럽고 모호하게 처리합니다. ‘이집트를 향해 흔드시는’이 문맥과 원문에 더 충실합니다.
  naturalness: 현 번역의 ‘만군의 야훼께서 그 위에 흔드시는 손의 흔들림’은 수식 관계가 길고 어색합니다. ‘만군의 야훼께서 이집트를 향해 흔드시는 손의 흔들림’으로 고치면 자연스럽고 의미도 분명해집니다. 또한 ‘여자들처럼 되어 떨며 두려워할 것입니다’는 원문의 상태 변화와 병렬 동사를 자연스러운 합쇼체로 반영합니다.
  terminology: ‘야훼’와 ‘만군’은 프로젝트의 용례 및 히브리어 יהוה צבאות에 부합합니다. כַּנָּשִׁים은 완화하지 않고 ‘여자들처럼’으로 유지하되, 고대 전쟁 비유라는 설명은 각주에 둡니다.
  issues:
