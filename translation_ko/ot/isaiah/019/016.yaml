id: ISA.19.16
reference: Isaiah 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: The simile 'like women' reflects ancient wartime imagery of vulnerability and fear; the Hebrew explicitly uses 'women.'
    reason: cultural_note
  - marker: c
    text: Or 'the brandishing of the hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 이집트는 여자들처럼[a] 되어 떨며 두려워할 것입니다. 이는 만군의 야훼께서 이집트를 향해 흔드시는 손의 흔들림[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여자들처럼’입니다. 이 비유는 고대 전쟁 상황에서 취약함과 두려움을 나타내는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘손의 흔들림’이라는 구체적 이미지를 사용합니다. 또는 ‘손을 휘두르심’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 때에
  - 그 날
  lexicon: HALOT
  rationale: 예언문에서 반복되는 시간 표지를 자연스러운 현대 한국어로 옮기되, 종말론적·예언적 울림을 살리기 위해 ‘그 날에’를 택했습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 나라
  lexicon: HALOT
  rationale: 문맥상 한 민족/국가를 가리키므로 고유 지명으로 옮겼습니다. 현대 표준어와 가독성을 고려해 ‘이집트’를 사용했습니다.
- source_word: כַּנָּשִׁים
  english_pob_choice: like women
  chosen_korean: 여자들처럼
  alternatives_korean:
  - 여인들처럼
  - 여성들처럼
  lexicon: HALOT
  rationale: 히브리어가 실제로 ‘여자들’이라는 성별 표지를 사용하므로, 이를 완화하지 않고 그대로 드러냈습니다.
- source_word: תְּנוּפַת יַד יְהוָה צְבָאוֹת
  english_pob_choice: the waving of the hand of Yahweh of Armies
  chosen_korean: 만군의 야훼께서 흔드시는 손의 흔들림
  alternatives_korean:
  - 만군의 야훼의 손을 흔드심
  - 야훼 만군의 손의 흔들림
  lexicon: HALOT
  rationale: ‘손의 흔들림’은 히브리어의 구체적 이미지와 동사의 반복을 살리며, 야훼의 심판 행위를 보다 직설적으로 드러냅니다.
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  english_pob_choice: which he waves against it
  chosen_korean: 그 위에 흔드시는
  alternatives_korean:
  - 그에게 흔드시는
  - 그 위로 흔드시는
  lexicon: HALOT
  rationale: 대상은 집합적으로 이집트이므로 대명사는 ‘그’로 받았고, 원문의 적대적 방향성을 반영해 ‘위에’라고 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 용례를 따라 언약명 יְהוָה를 ‘야훼’로 옮겨, 전통 교회 용례보다 원문 식별성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: צְבָאוֹת의 번역
  chosen_reading: 만군
  alternative_readings:
  - 군대들의
  - 호스트들의
  rationale: ‘만군’은 한국어 성경에서 널리 이해되면서도 צְבָאוֹת의 군사적·권능적 뉘앙스를 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
