    rationale: 원문의 שָׂרֵי가 가리키는 통치·정치 지도층을 ‘지도자들’로 옮기면 현대적이면서 의미 손실이 없습니다.
  - severity: medium
    issue: 마지막 동격구의 관계와 이집트를 가리키는 소유 관계가 다소 불분명합니다.
    rationale: ‘그 나라 지파들의 모퉁이돌’보다 ‘이집트 지파들의 모퉁잇돌인 그들’이라고 하면 פִּנַּת שְׁבָטֶיהָ가 앞선 지도자들을 설명하며, 여성 단수 접미사가 이집트를 가리킨다는 점이 분명해집니다.
