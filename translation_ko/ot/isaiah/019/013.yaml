id: ISA.19.13
reference: Isaiah 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for Memphis.
    reason: alternative_reading
translation:
  language: ko
  text: 소안의 방백들은 어리석게 되었습니다. 놉의 방백들은 속았습니다. 그들은 이집트를 그릇된 길로 이끌었으니, 바로 그 나라 지파들의 모퉁이돌이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 놉은 히브리어 지명으로, 일반적으로 이집트의 멤피스로 식별됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  english_pob_choice: have become foolish
  chosen_korean: 어리석게 되었습니다
  alternatives_korean:
  - 어리석어졌습니다
  - 어리석은 자가 되었습니다
  lexicon: HALOT
  rationale: Niphal의 결과 상태를 살려 단순한 형용사보다 ‘되다’ 계열로 옮겼습니다.
- source_word: שָׂרֵי
  english_pob_choice: princes
  chosen_korean: 방백들
  alternatives_korean:
  - 지도자들
  - 고관들
  - 군주들
  lexicon: HALOT
  rationale: 예언서의 정치적 수뇌를 가리키는 말로, 한국어 성경 전통에서 널리 쓰이면서도 고어성이 지나치지 않은 표현을 택했습니다.
- source_word: נִשְּׁאוּ
  english_pob_choice: are deceived
  chosen_korean: 속았습니다
  alternatives_korean:
  - 현혹되었습니다
  - 속임을 당했습니다
  - 미혹되었습니다
  lexicon: HALOT
  rationale: ‘들어 올리다’가 아니라 문맥상 ‘속다/현혹되다’의 뜻이므로, 수동적 기만 상태를 직접 드러냈습니다.
- source_word: הִתְעוּ
  english_pob_choice: have led ... astray
  chosen_korean: 그릇된 길로 이끌었으니
  alternatives_korean:
  - 길을 잃게 했으니
  - 미혹시켰으니
  - 방황하게 했으니
  lexicon: HALOT
  rationale: 사역형의 ‘길을 잃게 하다/그릇되게 이끌다’ 의미를 살리되 한국어로 자연스럽게 정리했습니다.
- source_word: פִּנַּת
  english_pob_choice: cornerstone
  chosen_korean: 모퉁이돌
  alternatives_korean:
  - 기둥돌
  - 주춧돌
  - 핵심
  lexicon: HALOT
  rationale: 비유적 핵심 지지 요소라는 뜻을 살려 가장 직관적인 ‘모퉁이돌’로 옮겼습니다.
