revisions:
- from: 그러면 너희 지혜로운 사람들은 어디에 있습니까? 이제 그들에게 말하게 하십시오. 그들이 야훼 만군의 주님이 이집트에 대해 무엇을 뜻하셨는지 알게 하십시오.[a]
  to: 그러면 너희 지혜자들은 어디에 있습니까? 그들이 부디 당신에게 알리게 하십시오. 만군의 야훼께서 이집트를 거슬러 무엇을 계획하셨는지 그들이 알게 하십시오.[a]
  rationale: 여격 목적어 ‘당신에게’를 복원하고, נָא의 촉구를 ‘부디’로 반영했습니다. 두 청유형의 수사적 도전을 유지했으며, 신적 칭호를 원문 어순과 의미에 따라 ‘만군의 야훼’로 바로잡았습니다. 심판 문맥의 방향성을 ‘이집트를 거슬러’로 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:29Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 두 개의 청유형을 각각 ‘말하게 하십시오/알게 하십시오’로 처리하여 대체로 형태를 반영했으나, 첫 청유형의 여격 목적어 ‘너에게’를 ‘그들에게’로 바꾸어 누락·왜곡했습니다. 또한 יְהוָה צְבָאוֹת는 ‘만군의 야훼’로 옮겨야 하며, 원문에 없는 ‘주님’을 덧붙일 수 없습니다. עַל מִצְרַיִם는 이 심판 문맥에서 ‘이집트를 거슬러’가 적절합니다.
  naturalness: ‘그들이 부디 당신에게 알리게 하십시오’와 ‘그들이 … 알게 하십시오’는 원문의 도발적인 청유·반문을 현대 표준어 합쇼체 안에서 자연스럽게 유지합니다. 복수의 지혜자들에게 말하면서 이집트를 단수로 인격화해 ‘당신’이라고 부르는 원문의 전환도 보존했습니다.
  terminology: יְהוָה는 ‘야훼’, צְבָאוֹת는 ‘만군’으로 옮겨 ‘만군의 야훼’라 해야 합니다. ‘야훼 만군의 주님’은 신명과 호칭을 중복하고 원문에 없는 ‘주님’을 추가합니다. ‘계획하셨는지’는 יָעַץ의 숙고된 의도를 적절히 반영합니다.
  issues:
  - severity: high
    issue: ‘그들에게 말하게 하십시오’가 וְיַגִּידוּ נָא לָךְ의 여격 목적어를 바꿈
    rationale: לָךְ는 ‘당신에게/너에게’이지 ‘그들에게’가 아닙니다. 지혜자들이 이집트에게 말해야 한다는 구문을 보존해야 합니다.
  - severity: high
    issue: ‘야훼 만군의 주님’이라는 신명·호칭 처리
    rationale: 원문 יְהוָה צְבָאוֹת는 ‘만군의 야훼’입니다. ‘주님’은 원문에 없고, 야훼라는 고유명 뒤에 덧붙이면 의미와 구조가 달라집니다.
  - severity: medium
    issue: ‘이집트에 대해’가 심판적 방향성을 약화함
    rationale: 이사야 19장의 심판 문맥과 עַל의 용법상, 야훼의 계획은 이집트를 거스르는 계획으로 표현하는 것이 더 충실합니다.
  - severity: low
    issue: 각주가 잘못된 본문 호칭을 전제함
    rationale: 전통적 대안은 ‘만군의 주님’이 아니라, 한국어 성경의 통상적 신명 표기를 반영한 ‘만군의 여호와’로 제시하는 것이 적절합니다.
  revised_text: 그러면 너희 지혜자들은 어디에 있습니까? 그들이 부디 당신에게 알리게 하십시오. 만군의 야훼께서 이집트를 거슬러 무엇을 계획하셨는지 그들이 알게 하십시오.[a]
