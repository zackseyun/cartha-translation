  - 주님
  rationale: 본문이 신명기 본명을 직접 사용하므로, 전통적 대체 호칭 대신 원문 고유명을 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צְבָאוֹת의 한국어 처리
  chosen_reading: 만군
  alternative_readings:
