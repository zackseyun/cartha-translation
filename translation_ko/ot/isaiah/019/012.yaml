id: ISA.19.12
reference: Isaiah 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희 지혜로운 사람들은 어디에 있습니까? 이제 그들에게 말하게 하십시오. 그들이 야훼 만군의 주님이 이집트에 대해 무엇을 뜻하셨는지 알게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘만군의 주님’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּם
  english_pob_choice: Where ... are
  chosen_korean: 어디에 있습니까
  alternatives_korean:
  - 어디 있습니까
  - 어디에 있느냐
  lexicon: HALOT
  rationale: 직접적인 도발적 질문이므로 한국어에서는 자연스러운 어순으로 ‘어디에 있습니까’가 가장 잘 맞습니다.
- source_word: אֵפוֹא
  english_pob_choice: then
  chosen_korean: 그러면
  alternatives_korean:
  - 이제
  - 그렇다면
  lexicon: HALOT
  rationale: 문맥상 반문을 강화하는 담화 입자이므로, 도전적 뉘앙스를 살리는 ‘그러면’이 적절합니다.
- source_word: חֲכָמֶיךָ
  english_pob_choice: your wise men
  chosen_korean: 너희 지혜로운 사람들
  alternatives_korean:
  - 너희 현인들
  - 너희 지혜자들
  lexicon: HALOT
  rationale: 이집트의 조언자·지혜자 집단을 가리키므로, 직역보다 역할이 드러나는 표현을 택했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 주님
  alternatives_korean:
  - 야훼 만군의 하나님
  - 야훼 군대의 주님
  lexicon: HALOT
  rationale: 본문의 신명은 ‘야훼’로, צְבָאוֹת는 ‘만군’으로 옮기되, 한국어 문장 안에서는 주호칭을 살려 ‘주님’을 덧붙였습니다.
- source_word: עַל מִצְרַיִם
  english_pob_choice: against Egypt
  chosen_korean: 이집트에 대해
  alternatives_korean:
  - 이집트를 향해
  - 이집트에 관해
  lexicon: HALOT
  rationale: עַל은 여기서 심판의 대상에 대한 의도/결정을 나타내므로, 원문의 문장 구조를 살리면서도 한국어에서는 ‘~에 대해’로 처리했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기 본명을 직접 사용하므로, 전통적 대체 호칭 대신 원문 고유명을 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צְבָאוֹת의 한국어 처리
  chosen_reading: 만군
  alternative_readings:
  - 군대의
  - 천군
  rationale: ‘hosts’의 전통적 교회어를 그대로 쓰기보다, 원문의 군사적·권능적 호칭을 한국어로 투명하게 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §6
