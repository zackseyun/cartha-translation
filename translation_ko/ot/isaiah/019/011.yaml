id: ISA.19.11
reference: Isaiah 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
  footnotes:
  - marker: a
    text: Or 'offer senseless advice'; literally, 'counsel is brutish/stupid.'
    reason: lexical_alternative
  - marker: b
    text: '''A son of wise men'' and ''a son of ancient kings'' are idioms of lineage or pedigree, not necessarily immediate sonship.'
    reason: cultural_note
translation:
  language: ko
  text: 확실히 소안의 방백들은 어리석습니다[a]. 바로의 지혜로운 모사들은 어리석은 모략을 냅니다. 어떻게 바로에게 이렇게 말할 수 있겠습니까? “나는 지혜로운 사람들의 아들이요[b], 옛 왕들의 아들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무의미한 조언을 합니다’; 히브리어 문자적으로는 ‘모략이 어리석다/짐승 같다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지혜로운 사람들의 아들’과 ‘옛 왕들의 아들’은 혈통이나 계보를 가리키는 관용구로, 반드시 직계 아들을 뜻하는 것은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 확실히
  alternatives_korean:
  - 참으로
  - 분명히
  - 오직
  lexicon: HALOT
  rationale: 강한 강조의 입자를 한국어에서 자연스럽고 격식 있게 살려 주는 말로 옮겼습니다. 제한의 뜻인 ‘오직’은 문맥에 맞지 않습니다.
- source_word: אֱוִלִים
  english_pob_choice: fools
  chosen_korean: 어리석습니다
  alternatives_korean:
  - 어리석은 자들입니다
  - 바보들입니다
  - 미련합니다
  lexicon: HALOT
  rationale: 소안의 방백들을 향한 평가적 진술을 한국어 합쇼체로 직접 살렸습니다. ‘어리석습니다’가 현대적이면서도 단정적인 평가를 유지합니다.
- source_word: עֵצָה נִבְעָרָה
  english_pob_choice: give stupid counsel
  chosen_korean: 어리석은 모략을 냅니다
  alternatives_korean:
  - 어리석은 조언을 합니다
  - 미련한 계책을 냅니다
  - 우둔한 조언을 합니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 한국어에서는 동사를 보충해 자연스럽게 풀었습니다. ‘모략’은 이사야서의 궁정·정책 문맥에서 ‘counsel’의 무게를 살립니다.
- source_word: בֶּן חֲכָמִים אֲנִי
  english_pob_choice: I am a son of wise men
  chosen_korean: 나는 지혜로운 사람들의 아들이요
  alternatives_korean:
  - 나는 지혜자들의 아들이요
  - 나는 현자들의 아들이요
  - 나는 지혜로운 이들의 후손이요
  lexicon: HALOT
  rationale: 직계 아들만이 아니라 혈통·계보를 가리키는 관용구이므로, POB의 문화적 주석을 따라 친족·계보의 함의를 살렸습니다. ‘사람들’은 한국어에서 과도하게 고상한 어감을 줄이는 데 도움이 됩니다.
- source_word: בֶּן מַלְכֵי קֶדֶם
  english_pob_choice: a son of ancient kings
  chosen_korean: 옛 왕들의 아들입니다
  alternatives_korean:
  - 고대 왕들의 아들입니다
  - 예전 왕들의 아들입니다
  - 옛날 왕들의 후손입니다
  lexicon: HALOT
  rationale: קֶדֶם은 여기서 동쪽이 아니라 ‘옛/고대’의 뜻이므로 시간적 의미를 우선했습니다. 앞의 관용구와 병렬을 이루도록 자연스러운 계보 표현으로 옮겼습니다.
