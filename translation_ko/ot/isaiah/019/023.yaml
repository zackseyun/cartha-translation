  naturalness: 초안은 ‘있을 것이고’와 ‘들어갈 것입니다’가 한 문장 안에서 섞여 합쇼체 종결의 일관성이 약합니다. 또한 각주는 해당 절 바로 뒤에 붙여야 독자가 무엇을 설명하는지 분명히 알 수 있습니다. 이를 바로잡아 현대 표준 한국어의 자연스러운 합쇼체로 다듬었습니다.
  terminology: ‘이집트’, ‘앗수르’, ‘큰길’, ‘섬기다’는 적절합니다. ‘예배하다’로 한정하지 않고 ‘섬기다’를 유지한 것은 עבד의 의미 범위를 보존합니다. 본문에 명시되지 않은 하나님은 문맥적 설명으로만 각주에 유지했습니다.
