id: ISA.19.23
reference: Isaiah 19:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא תִּהְיֶ֨ה מְסִלָּ֤ה מִ/מִּצְרַ֨יִם֙ אַשּׁ֔וּרָ/ה וּ/בָֽא אַשּׁ֥וּר בְּ/מִצְרַ֖יִם וּ/מִצְרַ֣יִם בְּ/אַשּׁ֑וּר וְ/עָבְד֥וּ מִצְרַ֖יִם אֶת אַשּֽׁוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
  footnotes:
  - marker: a
    text: Or, more literally, 'and Egypt will serve Assyria.' The Hebrew syntax can be read this way, though the broader context favors the sense that Egypt joins Assyria in worship/service of God.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew is elliptical in the second half of the line: ''and Egypt into Assyria,'' that is, ''and Egypt will come into Assyria.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에는 이집트에서 앗수르로 가는 큰길이 있을 것이고, 앗수르는 이집트로 들어올 것이며, 이집트도 앗수르로 들어갈 것입니다. 그리고 이집트가 앗수르와 함께 섬길 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘이집트가 앗수르를 섬길 것이다.’ 히브리어 문장은 이렇게도 읽을 수 있지만, 더 넓은 문맥은 이집트가 앗수르와 함께 하나님을 섬기는 뜻을 더 잘 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 둘째 행에서 생략적입니다. 곧 ‘그리고 이집트가 앗수르로’는 ‘그리고 이집트가 앗수르로 올 것이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלָּה
  english_pob_choice: highway
  chosen_korean: 큰길
  alternatives_korean:
  - 대로
  - 도로
  - 고속도로
  lexicon: HALOT
  rationale: מְסִלָּה는 단순한 길보다 넓고 열린 통로의 이미지를 가지므로, 현대 한국어에서 자연스럽고 위계를 과장하지 않는 ‘큰길’로 옮겼습니다.
- source_word: מִמִּצְרַיִם ... אַשּׁוּרָה
  english_pob_choice: from Egypt to Assyria
  chosen_korean: 이집트에서 앗수르로
  alternatives_korean:
  - 이집트에서 앗수르까지
  - 이집트로부터 앗수르로
  lexicon: HALOT
  rationale: 출발점과 방향을 간결하게 살리기 위해 ‘에서 … 로’를 사용했습니다.
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  english_pob_choice: and Assyria will come into Egypt
  chosen_korean: 앗수르는 이집트로 들어올 것이며
  alternatives_korean:
  - 앗수르는 이집트에 들어갈 것이며
  - 앗수르는 이집트 안으로 올 것이며
  lexicon: HALOT
  rationale: בוא + ב의 이동 의미를 자연스럽게 살려 ‘들어오다’로 옮겼습니다.
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  english_pob_choice: and Egypt into Assyria
  chosen_korean: 이집트도 앗수르로 들어갈 것입니다
  alternatives_korean:
  - 이집트도 앗수르에 들어갈 것입니다
  - 이집트도 앗수르 안으로 갈 것입니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 동사를 한국어에서는 보완해야 하므로, 앞절의 동사를 이어 받아 평행성을 유지했습니다.
- source_word: וְעָבְדוּ
  english_pob_choice: will serve with Assyria
  chosen_korean: 함께 섬길 것입니다
  alternatives_korean:
  - 함께 예배할 것입니다
  - 섬길 것입니다
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다’이지만, 문맥상 단순한 정치적 예속보다 야훼를 향한 공동 섬김의 가능성이 더 크므로 ‘함께 섬기다’로 번역하고, ‘예배하다’는 지나치게 좁은 해석이어서 본문에는 쓰지 않았습니다.
theological_decisions:
- issue: וְעָבְדוּ מִצְרַיִם אֶת אַשּׁוּר의 관계 설정
  chosen_reading: 이집트가 앗수르와 함께 섬긴다는 공동 섬김의 의미를 본문에 반영했습니다.
  alternative_readings:
  - 이집트가 앗수르를 섬길 것입니다
  - 이집트가 앗수르를 예배할 것입니다
  rationale: 바로 뒤 문맥(19:24-25)이 이집트와 앗수르를 함께 복 주시는 야훼의 구원을 보여 주므로, 한 나라가 다른 나라의 종속국이 되는 뜻으로 읽기보다 두 나라가 함께 야훼를 섬기는 방향이 더 적절합니다.
  doctrine_reference: 이사야 19:24-25의 문맥적 일치
