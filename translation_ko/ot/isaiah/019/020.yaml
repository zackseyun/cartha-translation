id: ISA.19.20
reference: Isaiah 19:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
  footnotes:
  - marker: a
    text: Or 'a savior and a champion'; the Hebrew expression is difficult. The second term may also be understood more literally as 'a great one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 이집트 땅에서 만군의 야훼께 드리는 표징과 증거가 될 것입니다. 그들이 압제자들 때문에 야훼께 부르짖을 것이며, 그분께서는 그들에게 구원자와 위대한 이를 보내시고 그들을 건져 내실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구원자와 옹호자’ 또는 ‘구원자와 챔피언’. 히브리어 표현은 해석하기 어렵습니다. 둘째 말은 더 문자적으로 ‘위대한 이’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: It will be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 이루어질 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 자연스러운 미래형으로 옮기되, המקרא의 진행감이 살아 있도록 단순 과거/현재로 고정하지 않았습니다.
- source_word: לְאוֹת וּלְעֵד
  english_pob_choice: for a sign and for a witness
  chosen_korean: 표징이자 증거
  alternatives_korean:
  - 표징과 증거
  - 표와 증언
  lexicon: HALOT
  rationale: ‘표징’과 ‘증거’의 법적·선언적 병치를 살리면서 한국어에서 더 자연스러운 동격 구조로 정리했습니다.
- source_word: לַיהוָה צְבָאוֹת
  english_pob_choice: to Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주
  - 야훼 군대의 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값인 ‘야훼’로, צְבָאוֹת은 관용적 ‘만군’으로 옮겨 신학적 호칭의 울림을 유지했습니다.
- source_word: מוֹשִׁיעַ וָרָב
  english_pob_choice: a savior and champion
  chosen_korean: 구원자와 챔피언
  alternatives_korean:
  - 구원자와 수호자
  - 구원자와 용사
  lexicon: HALOT
  rationale: מוֹשִׁיעַ는 ‘구원자’가 직접적이며, וָרָב는 POB의 판정대로 단순한 ‘큰 자’보다 상대를 위해 나서는 결투자/옹호자의 뜻을 살려 음역형 차용어 ‘챔피언’으로 남겼습니다.
- source_word: וְהִצִּילָם
  english_pob_choice: and he will deliver them
  chosen_korean: 그들을 건져내실 것입니다
  alternatives_korean:
  - 그들을 구해주실 것입니다
  - 그들을 구원하실 것입니다
  lexicon: HALOT
  rationale: נצל의 핵심은 ‘구출/탈출’의 동적 행위이므로, 결과를 강조하는 ‘건져내다’로 옮겨 ‘구원자’와의 반복을 피했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나온 여호와 이름을 보존하기 위해, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְבָאוֹת의 번역
  chosen_reading: 만군
  alternative_readings:
  - 군대들
  - 군사
  rationale: 히브리어 צְבָאוֹת의 전통적·투명한 의미를 살리면서, 한국어에서 하나님의 호칭으로 굳은 ‘만군’을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
