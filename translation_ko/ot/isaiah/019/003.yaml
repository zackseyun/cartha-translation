id: ISA.19.3
reference: Isaiah 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
  footnotes:
  - marker: a
    text: Or possibly 'the mutterers' or 'the charmers' for the rare Hebrew term translated 'ghosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트의 영은 그 가운데에서 비워질 것이며, 내가 그것의 계획을 삼켜 버리겠습니다. 그러고 나서 그들은 우상들과 중얼거리는 자들과 무당들과 영매들과 영적 점쟁이들을 찾을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희귀어를 따라 ‘중얼거리는 자들’로 옮겼습니다. 전승상 ‘주술사들’ 또는 ‘마술사들’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָבְקָה רוּחַ מִצְרַיִם בְּקִרְבּוֹ
  english_pob_choice: will be emptied out ... within it
  chosen_korean: 이집트의 영은 그 가운데에서 비워질 것이며
  alternatives_korean:
  - 이집트의 영은 그 안에서 고갈될 것이며
  - 이집트의 영은 그 가운데에서 빠져나갈 것이며
  lexicon: HALOT
  rationale: נָבְקָה의 ‘비워지다/비워지게 되다’ 이미지를 살려 국가의 내적 소진을 직접적으로 드러냈습니다. רוּחַ는 여기서 단순한 바람보다 집단의 내적 기세를 가리키므로 ‘영’으로 옮겼습니다.
- source_word: וַעֲצָתוֹ אֲבַלֵּעַ
  english_pob_choice: I will swallow up its counsel
  chosen_korean: 내가 그것의 계획을 삼켜 버리겠습니다
  alternatives_korean:
  - 내가 그것의 모략을 삼켜 버리겠습니다
  - 내가 그것의 조언을 삼켜 버리겠습니다
  lexicon: HALOT
  rationale: עֵצָה는 ‘계획/모략’의 뜻을 가지지만, 문맥상 국가적 정책과 판단의 좌절을 가리키므로 ‘계획’이 자연스럽습니다. אֲבַלֵּעַ는 구체적 은유를 살려 ‘삼켜 버리겠습니다’로 옮겼습니다.
- source_word: וְדָרְשׁוּ אֶל הָאֱלִילִים ... וְאֶל הָאֹבוֹת וְאֶל הַיִּדְּעֹנִים
  english_pob_choice: they will seek the idols, the mutterers, the mediums, and the spiritists
  chosen_korean: 그들은 우상들과 중얼거리는 자들과 무당들과 영매들과 영적 점쟁이들을 찾을 것입니다
  alternatives_korean:
  - 그들은 우상들과 주문을 외는 자들과 무당들과 영매들과 점쟁이들을 찾을 것입니다
  - 그들은 우상들과 주술사들과 무당들과 영매들과 신비한 자들을 찾을 것입니다
  lexicon: HALOT
  rationale: דרשׁ אֶל은 점술적 ‘의뢰/문의’의 뉘앙스가 있어 ‘찾다’로 두되, 뒤따르는 대상들이 불법적 영적 상담임을 드러내도록 했습니다. הָאִטִּים은 의미가 불확실하므로 POB의 ‘mutterers’를 반영해 ‘중얼거리는 자들’로 살렸고, הָאֹבוֹת와 הַיִּדְּעֹנִים는 각각 ‘무당들’, ‘영매들/영적 점쟁이들’로 자연스럽게 구분했습니다.
theological_decisions:
- issue: 점술·영적 매체 목록의 강한 부정적 뉘앙스를 보존할 것인가
  chosen_reading: ‘우상들, 중얼거리는 자들, 무당들, 영매들, 영적 점쟁이들’처럼 현대적이면서도 불법적 영적 의존을 분명히 드러내는 표현을 사용했습니다.
  alternative_readings:
  - 더 전통적인 ‘신접한 자들’, ‘초혼자들’, ‘주술사들’로 옮길 수 있습니다.
  - 완곡하게 ‘점술가들’로 뭉뚱그릴 수 있습니다.
  rationale: 이 본문은 위기 속 이집트가 야훼 대신 금지된 영적 자원으로 향하는 장면이므로, 한국어에서도 비판적 성격이 약화되지 않도록 했습니다.
  doctrine_reference: 이사야 19장 문맥의 우상숭배 비판 및 금지된 영적 상담에 대한 성경적 일관성
