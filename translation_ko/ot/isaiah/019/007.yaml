id: ISA.19.7
reference: Isaiah 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָר֥וֹת עַל יְא֖וֹר עַל פִּ֣י יְא֑וֹר וְ/כֹל֙ מִזְרַ֣ע יְא֔וֹר יִיבַ֥שׁ נִדַּ֖ף וְ/אֵינֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/007.yaml
  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
  footnotes:
  - marker: a
    text: Or 'The bare places/meadows along the Nile.' The Hebrew word עָרוֹת is uncertain in this context; the translation 'reeds' reflects the riverbank vegetation sense suggested by the surrounding phrases.
    reason: lexical_alternative
  - marker: b
    text: Hebrew יְאֹר can mean 'river' or 'canal,' but in this Egypt context it refers to the Nile.
    reason: cultural_note
  - marker: c
    text: Or 'all that is sown by the Nile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나일 강가, 곧 나일 강둑의 갈대[a][b]와 나일 강가의 모든 파종지[c]가 말라, 날려 가고, 더 이상 없게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대’로 옮긴 히브리어 עָרוֹת의 뜻은 이 문맥에서 확실하지 않습니다. ‘벌거벗은 곳들’, ‘초원들’ 또는 ‘강가의 식물들’로 이해할 수도 있으나, 주변 문맥은 나일 강변의 식생을 가리키는 이해를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְאֹר는 ‘강’ 또는 ‘운하’를 뜻할 수 있습니다. 이집트에 관한 이 문맥에서는 나일 강을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나일 강가에 뿌려진 모든 것’. 히브리어 מִזְרַע는 ‘씨’, ‘파종지’ 또는 ‘뿌려진 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  english_pob_choice: the reeds
  chosen_korean: 갈대
  alternatives_korean:
  - 벌거벗은 곳들
  - 초원들
  - 물가 식물들
  lexicon: HALOT
  rationale: 본문의 난해한 어휘로, 문맥상 나일 강변 식생을 가리키는 뜻을 살려 이해하기 쉬운 ‘갈대’로 옮겼습니다. POB의 ‘reeds’ 선택을 한국어로 자연스럽게 반영합니다.
- source_word: יְאֹר
  english_pob_choice: the Nile
  chosen_korean: 나일 강
  alternatives_korean:
  - 강
  - 운하
  lexicon: HALOT
  rationale: 이사야의 애굽 심판 맥락에서는 일반적인 강이 아니라 나일 강을 가리키므로, 독자가 곧바로 식별할 수 있게 ‘나일 강’으로 옮겼습니다.
- source_word: עַל פִּי יְאֹר
  english_pob_choice: along the bank of the Nile
  chosen_korean: 나일 강가의
  alternatives_korean:
  - 나일 강의 입구의
  - 나일 강변의
  lexicon: HALOT
  rationale: פִּי는 문자적으로 ‘입’이지만 물길과 함께 쓰일 때는 가장자리, 강가를 뜻하므로 ‘강가의’로 자연스럽게 풀었습니다.
- source_word: מִזְרַע יְאֹר
  english_pob_choice: every sown field of the Nile
  chosen_korean: 나일 강의 모든 심은 밭
  alternatives_korean:
  - 나일 강의 모든 씨
  - 나일 강가의 모든 파종지
  - 나일 강이 심은 모든 것
  lexicon: HALOT
  rationale: 여기서는 씨앗 자체보다 경작지/재배된 곡물의 의미가 문맥에 맞으므로, 농경적 파괴를 분명히 드러내는 ‘심은 밭’으로 옮겼습니다.
- source_word: יִיבַשׁ נִדַּף וְאֵינֶנּוּ
  english_pob_choice: will dry up, be driven away, and be no more
  chosen_korean: 말라 버리고, 흩날려 가 버리며, 더 이상 없게 될 것입니다
  alternatives_korean:
  - 말라 버리고, 쫓겨나 사라지며, 더 이상 없게 될 것입니다
  - 마르게 되어, 날려 가 버리고, 없어질 것입니다
  lexicon: HALOT
  rationale: 세 동사의 연속적 파괴를 살리기 위해 ‘말라 버리고’ ‘흩날려 가 버리며’ ‘더 이상 없게 될 것입니다’로 단계적으로 옮겼습니다. 마지막 관용구는 존재 소멸의 종결성을 살렸습니다.
theological_decisions:
- issue: 심판의 점층적 묘사
  chosen_reading: 강가 식생과 경작지가 말라 사라지는 이미지를 통해 나일 의존 체계 전체의 붕괴를 드러냅니다.
  alternative_readings:
  - 단순한 농업 피해 묘사
  - 비유적 소멸 표현
  rationale: 히브리어의 세 동사열은 단순한 마름을 넘어서 운반·소멸까지 포함하는 점층을 이루므로, 한국어도 연속적 붕괴를 드러내도록 구성했습니다.
  doctrine_reference: 이사야 19장의 애굽 심판 신탁
