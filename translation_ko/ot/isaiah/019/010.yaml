  source_fidelity: 히브리어의 여성 단수 소유격은 문맥상 이집트를 가리키며, 이를 존칭 인격 대명사인 ‘그분의’로 옮기면 지시 대상이 왜곡될 수 있습니다. 또한 שָׁתֹתֶיהָ는 복수형이므로 ‘기초들은’으로 반영하는 것이 적절합니다. 난해한 마지막 표현은 본문에서 내적 괴로움으로 제한적으로 번역하고 주석에서 모호성을 보존할 수 있습니다.
  naturalness: ‘그분의 기초’는 국가·도시를 가리키는 문맥에서 부자연스럽고 한국어 독자에게 신적 인물을 연상시킬 수 있습니다. ‘그 기초들은’ 및 ‘마음이 괴로울 것입니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘품삯을 받고 일하는 사람들’은 עֹשֵׂי שֶׂכֶר의 의미를 충실하고 자연스럽게 전달합니다. מְדֻכָּאִים에는 ‘짓눌릴 것입니다’를 사용하여 ‘무너지다’보다 ‘crushed/broken down’의 수동적 강도를 더 잘 살렸습니다. 각주 b의 표지는 해당 난해 표현 뒤로 옮겼습니다.
