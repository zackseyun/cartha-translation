id: ISA.19.10
reference: Isaiah 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
  footnotes:
  - marker: a
    text: Hebrew text is difficult. 'Her foundations' may also be understood as 'her pillars/supports'; some have proposed 'her weavers.'
    reason: alternative_reading
  - marker: b
    text: The final phrase is obscure in Hebrew. Literally, it reads something like 'pools of soul' or 'marshes of appetite/life'; many understand it idiomatically as inward grief or dejection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분의 기초는 무너질 것입니다[a][b]; 품삯을 받으며 일하는 사람은 모두 마음이 상할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 어렵습니다. '기초'는 '기둥/버팀목'으로도 이해될 수 있으며, 어떤 이들은 '직조공들'로 제안합니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 구절도 모호합니다. 문자적으로는 '영혼의 웅덩이' 또는 '욕구/생명의 늪'과 비슷하게 읽히며, 많은 이들은 이를 내적 슬픔이나 낙담의 관용적 표현으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָי֥וּ
  english_pob_choice: will be
  chosen_korean: 무너질 것입니다
  alternatives_korean:
  - 될 것입니다
  - 무너지게 될 것입니다
  lexicon: WLC
  rationale: 미래의 파괴적 결과를 한국어에서 자연스럽게 살리기 위해 단순 상태보다 동사적 표현을 택했습니다.
- source_word: שָׁתֹתֶיהָ
  english_pob_choice: her foundations
  chosen_korean: 그분의 기초
  alternatives_korean:
  - 그녀의 기초
  - 그분의 버팀목
  - 그분의 받침대
  lexicon: HALOT
  rationale: 히브리어가 난해하므로 POB의 'foundations'를 따라 핵심 이미지를 살리되, 도시/체제의 붕괴를 나타내는 한국어로 옮겼습니다. 주어는 문맥상 여성형 대상이지만 한국어에서는 자연스러운 지시를 위해 '그분의'로 처리했습니다.
- source_word: מְדֻכָּאִים
  english_pob_choice: will be crushed
  chosen_korean: 무너질 것입니다
  alternatives_korean:
  - 짓눌릴 것입니다
  - 부서질 것입니다
  - 압제당할 것입니다
  lexicon: HALOT
  rationale: 수동 분사로 된 '짓눌리다/부서지다'의 의미를 담되, 앞절의 기초 이미지와 겹치도록 '무너지다'를 선택했습니다.
- source_word: עֹשֵׂי שֶׂכֶר
  english_pob_choice: who work for wages
  chosen_korean: 품삯을 받으며 일하는 사람
  alternatives_korean:
  - 임금을 받으며 일하는 사람
  - 삯을 받고 일하는 사람
  - 품삯 노동자
  lexicon: HALOT
  rationale: 직역적 '임금/품삯' 의미를 유지하면서 한국어 문맥에서 자연스러운 노동자 표현으로 옮겼습니다.
- source_word: אַגְמֵי נָפֶשׁ
  english_pob_choice: grieved in soul
  chosen_korean: 마음이 상할 것입니다
  alternatives_korean:
  - 영이 상할 것입니다
  - 심령이 괴로울 것입니다
  - 마음이 괴로울 것입니다
  lexicon: HALOT
  rationale: 문구 자체가 난해하므로 POB의 해석을 따라 내적 고통을 드러내되, 한국어에서 가장 무난한 '마음이 상하다'로 표현했습니다.
theological_decisions:
- issue: 난해한 히브리어 표현의 처리
  chosen_reading: 문맥이 요구하는 붕괴와 내적 고통의 의미를 살리되, 본문이 애매한 지점은 주석으로 남깁니다.
  alternative_readings:
  - '''기둥/버팀목'''
  - '''베틀/직조공들'''
  - '''연못/늪 같은 표현의 직역'''
  rationale: 히브리어 원문이 모호하므로 과도하게 매끈하게 만들지 않고, POB가 제시한 해석과 대안을 함께 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 본문 비평/해석학
- issue: 수신 대상을 가리키는 대명사
  chosen_reading: 히브리어 여성형 소유격을 한국어에서는 문맥상 자연스럽게 '그분의'로 옮겼습니다.
  alternative_readings:
  - '''그녀의'''
  - '''그 도시의'''
  rationale: 한국어 성별 대명사 노출이 본문 의도를 흐릴 수 있어, 문맥상 대상(도시/체제)의 붕괴를 우선해 중립적으로 처리했습니다.
  doctrine_reference: 문체/번역 관례
