id: ISA.19.10
reference: Isaiah 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
  footnotes:
  - marker: a
    text: Hebrew text is difficult. 'Her foundations' may also be understood as 'her pillars/supports'; some have proposed 'her weavers.'
    reason: alternative_reading
  - marker: b
    text: The final phrase is obscure in Hebrew. Literally, it reads something like 'pools of soul' or 'marshes of appetite/life'; many understand it idiomatically as inward grief or dejection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기초들은[a] 짓눌릴 것입니다. 품삯을 받고 일하는 사람들은 모두 마음이 괴로울 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 어렵습니다. ‘기초들’은 ‘기둥들’ 또는 ‘버팀목들’로도 이해될 수 있으며, 어떤 이들은 ‘직조공들’이라는 해석을 제안합니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 표현은 히브리어에서 모호합니다. 문자적으로는 ‘영혼의 웅덩이들’ 또는 ‘욕망/생명의 늪지들’과 비슷하게 읽히며, 많은 이들은 이를 내적 슬픔이나 낙담을 나타내는 관용적 표현으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָי֥וּ
  english_pob_choice: will be
  chosen_korean: 무너질 것입니다
