revisions:
- from: 그날에 이스라엘은 이집트와 앗수르와 함께 셋째가 되어, 땅의 한가운데서 복이 될 것입니다.[a]
  to: 그날에 이스라엘은 이집트와 앗수르와 함께 세 번째가 되어, 땅 한가운데에 복이 될 것입니다.[a]
  rationale: ‘세 번째’로 고쳐 이스라엘이 이집트와 앗수르에 더해지는 세 번째 구성원이라는 원문의 관계를 자연스러운 현대 한국어로 드러냈습니다. ‘땅 한가운데에’는 בְּקֶרֶב הָאָרֶץ의 위치 표현을 유지하며, ‘땅’이 ‘세상’ 또는 특정 ‘땅/지역’을 뜻할 수 있는 어휘적 여지는 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:38Z'
