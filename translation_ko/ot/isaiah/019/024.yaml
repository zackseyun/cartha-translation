language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֤ה יִשְׂרָאֵל֙ שְׁלִ֣ישִׁיָּ֔ה לְ/מִצְרַ֖יִם וּ/לְ/אַשּׁ֑וּר בְּרָכָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
  footnotes:
  - marker: a
    text: Or 'a blessing in the midst of the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 이스라엘은 이집트와 앗수르와 함께 셋째가 되어, 땅의 한가운데서 복이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’과 ‘땅/세상(earth)’ 모두를 뜻할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때
  lexicon: HALOT
  rationale: 예언 문맥의 정형적인 시간표현을 현대 한국어에서 자연스럽게 살려, 격식은 유지하되 지나치게 번역투가 되지 않도록 했습니다.
- source_word: יִשְׂרָאֵל שְׁלִישִׁיָּה לְמִצְרַיִם וּלְאַשּׁוּר
  english_pob_choice: Israel will be the third with Egypt and Assyria
  chosen_korean: 이스라엘은 이집트와 앗수르와 함께 셋째가 되어
  alternatives_korean:
  - 이스라엘은 이집트와 앗수르와 더불어 셋째가 되어
  - 이스라엘은 이집트와 앗수르의 셋째가 되어
  lexicon: HALOT
  rationale: 셋째는 단순 서수보다 삼자 구도 속의 ‘세 번째 구성원’이라는 관계를 드러내므로 ‘~와 함께 셋째가 되어’로 옮겼습니다. 앗수르는 본문 전통을 살려 현대 표기법의 ‘앗수르’를 택했습니다.
- source_word: בְּרָכָה
  english_pob_choice: a blessing
  chosen_korean: 복이 될 것입니다
  alternatives_korean:
  - 복이 됩니다
  - 축복이 될 것입니다
  - 복입니다
  lexicon: HALOT
  rationale: 명사절을 한국어에서 자연스러운 서술어로 풀어, 이스라엘이 단지 ‘복’이라고 불리는 것만이 아니라 실제로 ‘복이 되는’ 역할을 한다는 뉘앙스를 살렸습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the earth
  chosen_korean: 땅의 한가운데서
  alternatives_korean:
  - 땅 한복판에서
  - 세상의 한가운데서
  - 땅의 가운데에서
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 영어 POB의 결정에 따라 ‘earth/land’의 긴장을 갖지만, 한국어 본문에서는 가장 직접적인 공간 감각인 ‘땅의 한가운데’로 옮기고, 주석으로 대안을 남겼습니다.
theological_decisions:
- issue: 'אֶרֶץ의 범위: ‘땅’인가 ‘세상/땅(land)’인가'
  chosen_reading: 본문은 ‘땅의 한가운데서’로 옮기되, 이는 보편적 지평과 지역적 의미를 모두 열어 두는 표현입니다.
  alternative_readings:
  - 세상의 한가운데서
  - 그 땅의 한가운데서
  rationale: 문맥상 이집트와 앗수르, 이스라엘의 삼자 관계는 국제적 범위를 시사하지만, 히브리어 אֶרֶץ 자체는 ‘땅/땅, 땅’의 중의를 가집니다. 한국어에서는 과도한 해석을 피하면서도 독자가 넓은 지평을 읽어낼 수 있게 했습니다.
  doctrine_reference: Translation philosophy §3, §5
