source:
  edition: WLC
  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Egypt against Egypt'; the translation makes explicit that the sense is Egyptians in internal conflict.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will incite Egypt against Egypt.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 이집트 사람들을 이집트 사람들과 맞서게 하겠습니다[a]. 사람마다 자기 형제와, 또 자기 이웃과 싸우며, 성읍은 성읍과, 나라는 나라와 맞서 싸울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이집트 대 이집트’입니다. 번역은 이 말이 이집트 사람들 사이의 내부 분쟁을 뜻함을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִכְסַכְתִּי
  english_pob_choice: I will stir up
  chosen_korean: 내가 … 맞서게 하겠습니다
  alternatives_korean:
  - 내가 … 충동하겠습니다
  - 내가 … 선동하겠습니다
  - 내가 … 분쟁하게 하겠습니다
  lexicon: HALOT
  rationale: 이 동사는 내부 분열과 상호 대립을 일으키는 원인을 뜻하므로, 한국어에서는 직접적이고 자연스러운 ‘맞서게 하다’가 본문의 정치·사회적 긴장을 잘 드러냅니다.
- source_word: מִצְרַיִם / בְּמִצְרַיִם
  english_pob_choice: Egyptians against Egyptians
  chosen_korean: 이집트 사람들을 이집트 사람들과
  alternatives_korean:
  - 이집트를 이집트와
  - 이집트인들을 이집트인들과
  lexicon: HALOT
  rationale: 히브리어는 나라 이름을 반복하지만 문맥상 국민 상호 간의 내전적 충돌을 가리키므로, 한국어에서는 사람을 명시해 내부 분열의 의미를 분명히 했습니다.
- source_word: אִישׁ בְּאָחִיו / וְאִישׁ בְּרֵעֵהוּ
  english_pob_choice: each will fight against his brother ... against his neighbor
  chosen_korean: 그들은 각각 자기 형제와, 각각 자기 이웃과 싸우고
  alternatives_korean:
  - 사람이 자기 형제와, 사람이 자기 이웃과
  - 각 사람이 자기 형제와, 각 사람이 자기 이웃과
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 ‘각각’으로 옮기면 반복되는 ‘한 사람… 한 사람…’보다 자연스러우면서도 개인 단위의 충돌을 보존할 수 있습니다.
- source_word: עִיר בְּעִיר מַמְלָכָה בְּמַמְלָכָה
  english_pob_choice: city against city, kingdom against kingdom
  chosen_korean: 성읍이 성읍을 거슬러, 나라가 나라를 거슬러
  alternatives_korean:
  - 성읍 대 성읍, 나라 대 나라
  - 성읍과 성읍이, 나라와 나라가
  lexicon: HALOT
  rationale: 병렬 구조의 상승 효과를 살리기 위해 짧고 대칭적인 표현을 택했습니다. ‘거슬러’는 대립·적대의 방향성을 드러내면서도 반복되는 구조를 유지합니다.
theological_decisions:
- issue: ‘미צְרַיִם’의 집합명사적 의미를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: 나라 이름을 사람으로 풀어 내부 분열을 분명히 드러냈습니다.
  alternative_readings:
  - 지명 그대로 ‘이집트 대 이집트’
  - ‘이집트에 이집트를 맞서게 하다’
  rationale: 본문은 이집트 전체가 아니라 그 국민들 사이의 상호 충돌을 묘사하므로, 의미를 드러내는 번역이 문맥상 가장 충실합니다. 이는 교리 문제가 아니라 집합명사의 번역 결정입니다.
  doctrine_reference: 번역 원칙 §1, §6
