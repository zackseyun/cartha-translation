id: ISA.11.12
reference: Isaiah 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
  footnotes:
  - marker: a
    text: Or 'the outcasts of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the scattered women of Judah'; the feminine form may reflect grammatical agreement with Judah as a collective, so some translations render more generally, 'the dispersed of Judah.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'from the four wings of the earth,' an idiom for the earth's farthest extremities.
    reason: cultural_note
translation:
  language: ko
  text: 그는 민족들을 향해 깃발을 세우시고, 이스라엘의 쫓겨난 자들[a]을 모으시며, 유다의 흩어진 자들[b]을 땅의 사방[c]에서 모으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 추방된 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여성형 복수 형태를 사용하지만, 여성들만을 뜻한다고 단정할 수 없으며, 문맥상 유다에 속한 흩어진 사람들을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘땅의 네 날개에서’라는 뜻으로, 땅의 가장 먼 끝들을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  english_pob_choice: He will raise a banner
  chosen_korean: 깃발을 세우시고
  alternatives_korean:
  - 기치를 드시고
  - 신호를 세우시고
  lexicon: HALOT
  rationale: נֵס은 높이 세운 표지나 깃발로 이해되므로, 한국어로는 ‘깃발을 세우다’가 가장 자연스럽고 공적 소집의 이미지를 잘 드러냅니다.
- source_word: לַגּוֹיִם
  english_pob_choice: for the nations
  chosen_korean: 민족들을 위해
  alternatives_korean:
  - 민족들에게
  - 나라들을 위해
  lexicon: HALOT
  rationale: ל의 용법은 대상 방향과 목적을 함께 담을 수 있어, 여기서는 깃발이 민족들을 향해/그들을 위해 세워진다는 뜻을 살려 ‘-을 위해’로 옮겼습니다.
- source_word: נִדְחֵי יִשְׂרָאֵל
  english_pob_choice: the banished of Israel
  chosen_korean: 이스라엘의 쫓겨난 자들
  alternatives_korean:
  - 이스라엘의 추방된 자들
  - 이스라엘의 내쫓긴 자들
  lexicon: HALOT
  rationale: נדח는 단순한 분산보다 강한 ‘쫓김/추방’의 의미가 있어, 회복 이전의 상실 상태를 분명히 드러내는 ‘쫓겨난 자들’로 번역했습니다.
- source_word: וּנְפֻצוֹת יְהוּדָה
  english_pob_choice: the scattered of Judah
  chosen_korean: 유다의 흩어진 자들
  alternatives_korean:
  - 유다의 흩어진 여자들
  - 유다의 흩어진 사람들
  lexicon: HALOT
  rationale: 히브리어는 여성 복수 형태이지만, 문맥상 유다 공동체 전체를 가리키므로 성별을 과도하게 특정하지 않고 집합적 의미를 살려 옮겼습니다.
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  english_pob_choice: from the four corners of the earth
  chosen_korean: 땅의 사방에서
  alternatives_korean:
  - 땅의 네 모퉁이에서
  - 세상의 끝에서
  lexicon: HALOT
  rationale: ‘four wings/corners’는 관용적으로 가장 먼 곳들을 뜻하므로, 한국어 관용에 맞는 ‘사방에서’로 간결하게 전달했습니다.
theological_decisions:
- issue: 회복의 범위와 대상
  chosen_reading: 이스라엘과 유다가 함께 모여지는 종말론적 회복 장면으로 읽고, 이를 현대 한국어에서 선명하게 드러냈습니다.
  alternative_readings:
  - 단순한 역사적 귀환 예언으로만 읽기
  - 민족적 회복보다 영적 회복을 앞세워 완화하기
  rationale: 본문은 민족들, 이스라엘, 유다, 땅의 사방이라는 넓은 범위를 통해 포로 귀환을 넘어선 포괄적 회복을 묘사하므로, 그 스케일을 줄이지 않았습니다.
  doctrine_reference: 이사야서 회복 예언의 문맥과 POB 직역-의미 보존 원칙
