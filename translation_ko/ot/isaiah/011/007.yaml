  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָרָ֤ה וָ/דֹב֙ תִּרְעֶ֔ינָה יַחְדָּ֖ו יִרְבְּצ֣וּ יַלְדֵי/הֶ֑ן וְ/אַרְיֵ֖ה כַּ/בָּקָ֥ר יֹֽאכַל תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
  footnotes:
  - marker: a
    text: Or 'The cow and the bear will feed.' The Hebrew verb can be rendered more generally as 'feed,' though 'graze' fits the animal imagery well.
    reason: lexical_alternative
  - marker: b
    text: Or 'like cattle.' The Hebrew בָּקָר can refer collectively to cattle as well as to an individual bovine.
    reason: lexical_alternative
translation:
  language: ko
  text: 암소와 곰이 함께 먹이를 먹고, 그들의 새끼들이 함께 누우며, 사자는 소처럼 짚을 먹을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹이를 먹고’는 히브리어 רעה의 보다 일반적인 뜻을 반영한 번역일 수 있습니다. 본문 이미지상 ‘풀을 뜯다’도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘소처럼’은 히브리어 בָּקָר를 단수의 소로 읽은 번역입니다. 이 단어는 집합적으로 ‘가축’/‘소 떼’를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָרָה וָדֹב
  english_pob_choice: the cow and the bear
  chosen_korean: 암소와 곰
  alternatives_korean:
  - 소와 곰
  - 암소와 곰
  lexicon: HALOT
  rationale: פָּרָה는 암소/소를 가리키지만, 대조되는 맹수와의 평행을 살리기 위해 자연스러운 단수 동물명인 ‘암소’를 택했습니다.
- source_word: תִּרְעֶינָה
  english_pob_choice: will graze
  chosen_korean: 먹이를 먹고
  alternatives_korean:
  - 풀을 뜯고
  - 먹고
  lexicon: HALOT
  rationale: 동물의 섭식 행동을 나타내는 רעה를 목초지에 한정된 ‘풀을 뜯다’보다 더 넓은 ‘먹이를 먹다’로 옮겨, 영어 POB가 제시한 ‘feed/graze’의 의미 범위를 반영했습니다.
- source_word: יַחְדָּו יִרְבְּצוּ
  english_pob_choice: together ... will lie down
  chosen_korean: 함께 누우며
  alternatives_korean:
  - 함께 엎드리며
  - 함께 누워
  lexicon: HALOT
  rationale: יַחְדָּו와 רבץ의 결합은 동물들이 나란히 눕는 장면을 가리키므로, 현대 한국어에서 자연스럽고 구체적인 ‘함께 누우며’로 옮겼습니다.
- source_word: יֹאכַל תֶּבֶן
  english_pob_choice: will eat straw
  chosen_korean: 짚을 먹을 것입니다
  alternatives_korean:
  - 짚을 먹습니다
  - 볏짚을 먹을 것입니다
  lexicon: HALOT
  rationale: תֶּבֶן은 여기서 가축 사료로 쓰이는 짚을 뜻하므로, ‘짚’으로 직역하되 예언적 미래를 살려 ‘먹을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 사자가 소처럼 짚을 먹는 비전의 성격
  chosen_reading: 동물 세계의 평화와 질서 회복을 구체적으로 그리되, 그것이 문자적 변형인지 상징인지 단정하지 않았습니다.
  alternative_readings:
  - 인간 사회의 평화만을 상징하는 표현
  - 오직 문자적 생태 변화로만 이해하는 표현
  rationale: 히브리어 본문은 생생한 동물 이미지로 종말적 평화를 보여 주지만, 그 성취 방식은 여기서 규정하지 않습니다. 번역은 해석을 앞세우지 않고 본문의 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
