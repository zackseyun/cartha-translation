lexical_decisions:
- source_word: צֶדֶק
  english_pob_choice: Righteousness
  chosen_korean: 공의
  alternatives_korean:
  - 의
  - 정의
  lexicon: HALOT
  rationale: 이 문맥에서는 메시아적 통치자의 도덕적 성품을 묘사하므로, 한국어로는 '의'보다 의미가 조금 더 드러나는 '공의'가 자연스럽고, POB의 'Righteousness'와도 잘 대응합니다.
- source_word: אֵזוֹר
  english_pob_choice: belt
  chosen_korean: 띠
  alternatives_korean:
  - 벨트
  - 허리띠
  - 띠개
  lexicon: HALOT
  rationale: 몸에 두르는 구체적 물건이라는 이미지를 살리면서도 문학적 평행을 유지하기 위해 '띠'를 선택했습니다.
- source_word: מָתְנָיו
  english_pob_choice: his waist
  chosen_korean: 허리
  alternatives_korean:
  - 허리띠 부분
  - 옆구리
  - 몸통
  lexicon: HALOT
  rationale: 히브리어의 몸통 부위를 가리키는 표현을 한국어의 기본 해부학 용어인 '허리'로 옮겨, 앞뒤 행의 평행성을 자연스럽게 했습니다.
- source_word: חֲלָצָיו
  english_pob_choice: his loins
  chosen_korean: 허리
  alternatives_korean:
  - 요대
  - 허벅지
  - 복부
  lexicon: HALOT
  rationale: 두 번째 반행은 첫 번째와 같은 신체 부위를 변주해 반복 효과를 주므로, 한국어에서도 동일한 '허리'를 유지해 평행 구조를 보존했습니다.
theological_decisions:
- issue: צֶדֶק / אֱמוּנָה의 윤리적 성격
  chosen_reading: 이 구절은 메시아의 내적 자질을 의복 은유로 묘사하는 것으로 보고, 교리적 확장 없이 '공의'와 '신실함'의 병렬로 유지했습니다.
  alternative_readings:
  - '''의''와 ''충실함''으로 더 직역'
  - '''정의''와 ''진실''로 윤리적 속성 강조'
  rationale: 원문은 왕의 성품이 외적 장식처럼 둘러진다는 시적 진술이므로, 한국어 번역도 그 상징성을 보존하되 신학적 체계를 과도하게 덧씌우지 않는 것이 적절합니다.
  doctrine_reference: 원문 우선, 시적 이미지 보존
