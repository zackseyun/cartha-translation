language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲרִיח֖/וֹ בְּ/יִרְאַ֣ת יְהוָ֑ה וְ/לֹֽא לְ/מַרְאֵ֤ה עֵינָי/ו֙ יִשְׁפּ֔וֹט וְ/לֹֽא לְ/מִשְׁמַ֥ע אָזְנָ֖י/ו יוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
  footnotes:
  - marker: a
    text: Or, more literally, 'his smelling/perception shall be in the fear of the LORD'; the Hebrew verb is difficult and may suggest keen discernment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 기쁨은 야훼를 경외하는 데 있을 것이며, 그는 그의 눈에 보이는 것에 따라 판단하지 않을 것이며, 그의 귀에 들리는 것에 따라 판정하지도 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 냄새 맡음/지각은 야훼를 경외하는 데 있을 것이다’; 히브리어 동사는 난해하며 예리한 분별을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  english_pob_choice: his delight shall be
  chosen_korean: 그의 기쁨은 ... 데 있으며
  alternatives_korean:
  - 그는 냄새를 맡을 것이며
  - 그의 분별력은 ... 데 있으며
  - 그의 지각/통찰은 ... 데 있으며
  lexicon: HALOT
  rationale: 히필형 ריח는 문자적으로는 후각을 가리킬 수 있으나, 문맥상 야훼를 경외하는 데 대한 내적 성향과 판별력을 함께 드러내므로 POB의 해석을 따라 ‘기쁨’으로 옮겨 자연스러운 한국어로 표현했습니다.
- source_word: בְּיִרְאַת יְהוָה
  english_pob_choice: in the fear of Yahweh
  chosen_korean: 야훼를 경외하는 데
  alternatives_korean:
  - 야훼에 대한 두려움 속에
  - 여호와를 경외하는 데
  - 야훼를 두려워함 속에
  lexicon: HALOT
  rationale: יִרְאָה는 단순한 공포보다 경외를 포함한 언약적 두려움을 뜻하므로, 한국어에서는 ‘경외하다’를 써서 종교적 무게를 살렸습니다. יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: לְמַרְאֵה עֵינָיו / לְמִשְׁמַע אָזְנָיו
  english_pob_choice: by what his eyes see / by what his ears hear
  chosen_korean: 자기 눈에 보이는 대로 / 자기 귀에 들리는 대로
  alternatives_korean:
  - 눈으로 보는 것에 따라 / 귀로 듣는 것에 따라
  - 눈이 보는 모습대로 / 귀가 듣는 소리대로
  - 겉으로 보이는 대로 / 들은 말대로
  lexicon: HALOT
  rationale: 두 구는 감각적 보고와 청취에 근거한 판단을 가리키는 병렬 구조이므로, 직역을 유지하면서도 현대 한국어에서 자연스럽게 들리도록 ‘~에 보이는 대로’, ‘~에 들리는 대로’로 옮겼습니다.
- source_word: יִשְׁפֹּט / יוֹכִיחַ
  english_pob_choice: he shall judge / decide
  chosen_korean: 판단하지 않으며 / 결정하지도 않습니다
  alternatives_korean:
  - 심판하지 않으며 / 분별하지도 않습니다
  - 재판하지 않으며 / 판결하지도 않습니다
  - 판정하지 않으며 / 변론하지도 않습니다
  lexicon: HALOT
  rationale: שׁפט와 יכח는 여기서 왕적·사법적 판정의 뉘앙스를 가지지만, 앞의 감각적 기준과 대비되는 의미를 살려 한국어로는 ‘판단하다’와 ‘결정하다’로 옮겨 의미의 폭을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: POB의 기본 원칙에 따라 신적 고유명사를 대체 칭호로 바꾸지 않고 음역하여, 본문의 개인적·언약적 하나님의 이름을 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
