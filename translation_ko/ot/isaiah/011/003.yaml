  source_fidelity: 두 병렬구의 감각적 기준(눈에 보이는 것, 귀에 들리는 것)에 따라 বিচার하지 않는다는 뜻과 יִשְׁפּוֹט/יוֹכִיחַ의 판정·결정의 대조는 대체로 충실합니다. 다만 히브리어 문맥과 영어 POB가 미래적 서술로 옮긴 점에 맞추어 한국어 시제를 미래로 통일하는 것이 필요합니다. 난해한 וַהֲרִיחוֹ를 본문에서 ‘기쁨’으로 처리하고 문자적/지각적 가능성을 각주에 남긴 방식은 허용됩니다.
  naturalness: 현재형 ‘있으며/판단하지 않으며/결정하지도 않습니다’는 문법적으로 가능하지만, 이사야 11장의 장차 올 통치자에 대한 예언적 묘사에서는 미래형이 더 자연스럽고 문맥적으로 정확합니다. ‘판정하다’는 여기서 사법적 뉘앙스를 지닌 יוֹכִיחַ에 ‘결정하다’보다 조금 더 적합하면서도 현대 표준어로 자연스럽습니다.
  terminology: ‘야훼’와 ‘경외하다’는 프로젝트 표기 원칙 및 יִרְאַת יְהוָה의 종교적 의미에 적절합니다. 각주의 ‘냄새 맡음/지각’은 논쟁적인 어휘의 문자적·확장적 가능성을 보존합니다.
