  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
  footnotes:
  - marker: a
    text: Or 'the people of the east' / 'the easterners.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the shoulder of the Philistines,' likely meaning their flank or the Philistine region on the west.
    reason: cultural_note
  - marker: c
    text: Or 'Edom and Moab will be under their hand' or 'they will lay their hand on Edom and Moab.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the Ammonites will be subject to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서쪽으로 블레셋 사람들의 어깨에 들이닥치고, 함께 동방 사람들을 노략질할 것입니다. 에돔과 모압은 그들의 손이 뻗는 대상이 되고, 암몬 자손은 그들에게 복종할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘블레셋 사람들의 어깨’는 그들의 측면이나 블레셋 서쪽 지역을 가리키는 말일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘그들의 손이 뻗는 대상’은 ‘그들의 손 아래에 있게 됨’ 또는 ‘그들이 손을 얹음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘에돔과 모압’은 ‘그들이 에돔과 모압을 손아귀에 넣음’이라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘암몬 자손은 그들에게 복종할 것입니다’는 ‘암몬 사람들은 그들 아래에 놓일 것입니다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָפוּ
  english_pob_choice: they will swoop down
  chosen_korean: 들이닥치고
  alternatives_korean:
  - 급강하하고
  - 날아들고
  lexicon: HALOT
  rationale: 전투적 맥락에서 새처럼 급히 덮치는 동작을 살리면서, 현대 한국어에서 자연스러운 공격 이미지를 전달합니다.
- source_word: בְכָתֵף פְּלִשְׁתִּים
  english_pob_choice: on the shoulder of the Philistines
  chosen_korean: 블레셋 사람들의 어깨에
  alternatives_korean:
  - 블레셋 사람들의 측면에
  - 블레셋 지역의 변두리에
  lexicon: HALOT
  rationale: כָּתֵף의 직역인 ‘어깨’를 유지해 원문의 비유를 보존하고, ‘블레셋 사람들’로 자연스러운 집단 명칭을 살렸습니다.
- source_word: מִשְׁלוֹח יָדָם
  english_pob_choice: will be the putting forth of their hand
  chosen_korean: 그들의 손이 뻗는 대상이 되고
  alternatives_korean:
  - 그들의 손 아래에 있게 되고
  - 그들이 손을 뻗는 곳이 되고
  - 그들의 손이 미치는 대상이 되고
  lexicon: HALOT
  rationale: 문법적으로 압축된 명사구를 한국어에서 이해 가능한 표현으로 풀어, 권세의 확장이나 장악의 뉘앙스를 드러내되 과도하게 의미를 특정하지 않았습니다.
- source_word: וּבְנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬의 아들들
  lexicon: HALOT
  rationale: 문자적으로는 ‘암몬의 아들들’이지만, 성경 한국어에서 널리 통용되는 집단 명칭을 사용해 가독성을 확보했습니다.
theological_decisions:
- issue: 정복·굴복 이미지를 완화할지 여부
  chosen_reading: 전투, 노략, 복종의 표현을 그대로 유지했습니다.
  alternative_readings:
  - 정치적 우위나 영향력 정도로 완화할 수 있습니다.
  rationale: 히브리어 동사들이 공격과 약탈, 종속을 분명히 말하므로 이를 희석하지 않는 것이 본문의 예언적 긴장과 힘을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
