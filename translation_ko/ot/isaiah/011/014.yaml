base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
  footnotes:
  - marker: a
    text: Or 'the people of the east' / 'the easterners.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the shoulder of the Philistines,' likely meaning their flank or the Philistine region on the west.
    reason: cultural_note
  - marker: c
    text: Or 'Edom and Moab will be under their hand' or 'they will lay their hand on Edom and Moab.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the Ammonites will be subject to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서쪽에 있는 블레셋의 측면으로 날아들어[a] 함께 동방 사람들을 약탈하고[b], 에돔과 모압은 그들이 손을 뻗을 대상이 되며[c], 암몬 자손은 그들에게 복종할 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘블레셋의 어깨 위로’입니다. ‘어깨’는 측면·경계 또는 이스라엘 서쪽의 블레셋 지역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘동방의 아들들’입니다. ‘동쪽 사람들’ 또는 ‘동방 민족들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘그들의 손을 내밂’입니다. 에돔과 모압이 그들의 권세 아래 놓이거나 그들이 에돔과 모압에 손을 댄다는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘암몬 사람들은 그들에게 복종할 것입니다’ 또는 ‘그들의 지배 아래 있을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
