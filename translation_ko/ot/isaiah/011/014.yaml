revisions:
- from: 그들은 서쪽으로 블레셋 사람들의 어깨에 들이닥치고, 함께 동방 사람들을 노략질할 것입니다. 에돔과 모압은 그들의 손이 뻗는 대상이 되고, 암몬 자손은 그들에게 복종할 것입니다.[a][b][c][d]
  to: 그들은 서쪽에 있는 블레셋의 측면으로 날아들어[a] 함께 동방 사람들을 약탈하고[b], 에돔과 모압은 그들이 손을 뻗을 대상이 되며[c], 암몬 자손은 그들에게 복종할 것입니다.[d]
  rationale: 수정은 의미를 완화하지 않고, כָּתֵף와 יָמָּה의 지리적·비유적 불확실성을 본문과 주석에서 균형 있게 보존했습니다. 또한 מִשְׁלוֹחַ יָדָם의 명사적 관용구를 자연스러운 한국어로 풀되, 권세 행사라는 원문의 의미 범위를 주석에 남겼습니다. 주석 앵커를 각각의 해당 어구에 배치하고 중복 주석을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:16Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 공격·약탈·복종이라는 본문의 강한 동작을 대체로 잘 보존합니다. 그러나 ‘블레셋 사람들의 어깨에’는 한국어에서 공격의 목표나 위치로 자연스럽게 이해되지 않으며, 주석의 ‘블레셋 서쪽 지역’도 יָמָּה의 지리적 방향과 כָּתֵף의 가능한 지리적 의미를 부정확하게 표현합니다. מִשְׁלוֹחַ יָדָם은 ‘손을 뻗는 대상’으로 풀 수 있으나, 원문의 ‘손을 내밂/권세의 행사’라는 압축된 관용성을 주석으로 밝혀 두는 편이 좋습니다.
  naturalness: ‘서쪽에 있는 블레셋의 측면으로 날아들어’는 현대 표준 한국어에서 문맥상 자연스럽고, ‘날아들어’는 עוּף의 비유를 유지합니다. 각 주석 표지를 해당 어구 바로 뒤에 배치하여 참조 관계도 분명하게 했습니다.
  terminology: 에돔, 모압, 암몬, 블레셋은 통용되는 성경 지명을 유지했습니다. בְּנֵי קֶדֶם은 본문에서 ‘동방 사람들’로 자연스럽게 옮기고 직역 대안을 주석에 남겼습니다. ‘복종할 것입니다’는 מִשְׁמַעְתָּם의 종속·복종 의미를 적절히 전달합니다.
  issues:
  - severity: medium
    issue: ‘블레셋 사람들의 어깨에’ 및 관련 주석의 지리적 설명
    rationale: כָּתֵף는 문자적으로 ‘어깨’이지만 여기서는 측면·경계 또는 블레셋 지역을 가리킬 수 있습니다. ‘블레셋 서쪽 지역’은 블레셋이 위치한 방향을 잘못 암시할 수 있으므로 ‘서쪽에 있는 블레셋 지역’ 또는 ‘블레셋의 측면’처럼 표현해야 합니다.
  - severity: low
    issue: 주석 표지가 모두 문장 끝에 집중됨
    rationale: 각 표지가 어느 어구를 설명하는지 불분명합니다. 특히 ‘동방 사람들’에 대한 어휘 대안과 ‘손을 뻗을 대상’에 대한 관용적 대안을 각각 해당 본문 어구에 연결하는 것이 좋습니다.
  - severity: low
    issue: 에돔과 모압에 관한 두 주석의 중복
    rationale: 기존 b와 c는 모두 מִשְׁלוֹחַ יָדָם의 의미를 설명하면서 실질적으로 중복됩니다. 하나를 동방 사람들(בְּנֵי־קֶדֶם)의 대안으로 교체하면 원문의 주요 어휘적 모호성을 더 충실히 반영합니다.
