source:
  edition: WLC
  text: וְ/סָ֨רָה֙ קִנְאַ֣ת אֶפְרַ֔יִם וְ/צֹרְרֵ֥י יְהוּדָ֖ה יִכָּרֵ֑תוּ אֶפְרַ֨יִם֙ לֹֽא יְקַנֵּ֣א אֶת יְהוּדָ֔ה וִֽ/יהוּדָ֖ה לֹֽא יָצֹ֥ר אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
  footnotes:
  - marker: a
    text: Or 'envy' for 'jealousy' in both occurrences involving Ephraim; the Hebrew קנא/קנאה can denote jealous rivalry or envy in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Judah will not be hostile to Ephraim' or 'will not oppress Ephraim'; the Hebrew verb can convey enmity, harassment, or oppression.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임의 질투는 사라질 것이며[a], 유다의 적대자들은 끊어질 것입니다. 에브라임은 유다를 질투하지 않을 것이며, 유다는 에브라임을 괴롭히지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시기’로도 옮길 수 있습니다. 히브리어 קנא/קנאה는 이 문맥에서 질투와 시기를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에브라임을 적대하지 않을 것입니다’ 또는 ‘에브라임을 압박하지 않을 것입니다’로도 옮길 수 있습니다. 히브리어 동사는 적대, 괴롭힘, 압박의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה קִנְאַת אֶפְרַיִם
  english_pob_choice: The jealousy of Ephraim will depart
  chosen_korean: 에브라임의 질투는 사라지고
  alternatives_korean:
  - 에브라임의 시기는 떠나고
  - 에브라임의 질투는 물러가고
  - 에브라임의 질투는 없어지고
  lexicon: HALOT
  rationale: סור는 여기서 감정/태도의 ‘떠남’으로 읽히므로, ‘사라지고’로 옮겨 동사의 흐름과 심상을 함께 살렸습니다. קִנְאָה는 이 문맥에서 긍정적 열심이 아니라 이웃 지파를 향한 경쟁적 질투를 가리킵니다.
- source_word: וְצֹרְרֵי יְהוּדָה
  english_pob_choice: the adversaries of Judah
  chosen_korean: 유다의 적대자들
  alternatives_korean:
  - 유다의 원수들
  - 유다의 적들
  - 유다를 대적하는 자들
  lexicon: HALOT
  rationale: צֹרְרֵי는 단순한 감정적 반감보다 실제로 적대 행위를 하는 자들을 가리키므로, ‘적대자들’이 가장 중립적이면서도 원문 강도를 보존합니다.
- source_word: יִכָּרֵתוּ
  english_pob_choice: will be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 잘려 나갈 것입니다
  - 끊어져 없어질 것입니다
  - 제거될 것입니다
  lexicon: HALOT
  rationale: כרת의 기본 이미지는 ‘베어 끊다’이므로, 한국어에서도 직역적 힘을 살리되 문맥상 자연스럽게 ‘끊어질 것입니다’로 옮겼습니다.
- source_word: לֹא יְקַנֵּא אֶת יְהוּדָה
  english_pob_choice: Ephraim will not be jealous of Judah
  chosen_korean: 에브라임은 유다를 질투하지 않을 것이며
  alternatives_korean:
  - 에브라임은 유다를 시기하지 않을 것이며
  - 에브라임은 유다를 질투하지 않을 것입니다
  - 에브라임은 유다에게 질투심을 품지 않을 것이며
  lexicon: HALOT
  rationale: 동일 어근 קנא를 반복해 앞절의 ‘질투’를 이어 가므로, ‘질투하지 않을’로 대응해 평행 구조를 분명히 했습니다.
- source_word: לֹא יָצֹר אֶת אֶפְרָיִם
  english_pob_choice: Judah will not harass Ephraim
  chosen_korean: 유다는 에브라임을 괴롭히지 않을 것입니다
  alternatives_korean:
  - 유다는 에브라임을 적대하지 않을 것입니다
  - 유다는 에브라임을 압박하지 않을 것입니다
  - 유다는 에브라임을 괴롭히지 않겠습니다
  lexicon: HALOT
  rationale: צרר/צור 계열은 적대, 압박, 괴롭힘의 뜻을 가질 수 있는데, 여기서는 지파 간 상호 적대의 종결이 핵심이므로 ‘괴롭히지 않을 것입니다’가 가장 넓고 자연스럽습니다.
theological_decisions:
- issue: 에브라임과 유다의 지시 대상
  chosen_reading: 지파 이름을 그대로 유지해, ‘북왕국/남왕국’으로 해석적으로 풀지 않았습니다.
  alternative_readings:
