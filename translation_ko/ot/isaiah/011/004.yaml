id: ISA.11.4
reference: Isaiah 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
  footnotes:
  - marker: a
    text: 'Or ''and he will judge.'' The conjunction may be read simply as ''and,'' but ''but'' brings out the contrast with the previous verse: he does not judge by appearances.'
    reason: lexical_alternative
  - marker: b
    text: '''With righteousness'' could also be rendered ''with justice.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'for the meek of the land.'
    reason: lexical_alternative
  - marker: d
    text: '''Earth'' may also be translated ''land.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'he will slay the wicked one.' The Hebrew singular may be read as a representative singular ('the wicked') or as an individual figure.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 가난한 자들을 의로 심판하시고, 땅의 겸손한 자들을 공정하게 판결하실 것입니다. 그는 입의 막대기로 땅을 치시고, 입술의 숨으로 악한 자를 죽이실 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의로’는 ‘의/의로움/정의’의 의미를 모두 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겸손한 자들’은 ‘온유한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘땅’은 ‘나라/땅의 지역’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘입의 막대기’는 ‘입의 지팡이’ 또는 ‘입의 홀’로도 볼 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘악한 자’는 단수 대표형으로도, 총칭적 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  english_pob_choice: but he will judge
  chosen_korean: 그는 … 심판하시고
  alternatives_korean:
  - 그는 … 판단하시고
  - 그러나 그는 … 심판하시고
  lexicon: HALOT
  rationale: 문맥상 왕적 통치 안에서 재판적 판단을 뜻하므로 ‘심판하다’가 가장 자연스럽고, 앞절과의 대비는 한국어 어순과 문맥으로 충분히 드러납니다.
- source_word: בְּצֶדֶק
  english_pob_choice: with righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의롭게
  - 정의로
  lexicon: HALOT
  rationale: צֶדֶק의 도덕·재판적 성격을 살리되, 한국어에서는 부사격 ‘의로’가 가장 간결하게 원문의 수단/기준 의미를 전달합니다.
- source_word: לְעַנְוֵי אָרֶץ
  english_pob_choice: for the humble of the earth
  chosen_korean: 땅의 겸손한 자들
  alternatives_korean:
  - 땅의 온유한 자들
  - 땅의 낮은 자들
  - 땅의 온유한 백성
  lexicon: HALOT
  rationale: עָנָו는 겸손·온유·낮아짐을 아우르므로, 윤리적 성향을 살리는 ‘겸손한 자들’이 가장 균형적입니다.
- source_word: בְּשֵׁבֶט פִּיו / וּבְרוּחַ שְׂפָתָיו
  english_pob_choice: with the rod of his mouth / and with the breath of his lips
  chosen_korean: 입의 막대기로 / 입술의 숨으로
  alternatives_korean:
  - 입의 지팡이로
  - 입의 채찍으로
  - 입술의 호흡으로
  lexicon: HALOT
  rationale: 말씀이 심판의 도구라는 은유를 보존하기 위해 ‘막대기’와 ‘숨’을 직역에 가깝게 유지했습니다. ‘지팡이’는 통치 상징으로 기울고, ‘호흡’은 시적 이미지가 약해집니다.
- source_word: יָמִית רָשָׁע
  english_pob_choice: he will put the wicked to death
  chosen_korean: 악한 자를 죽이실 것입니다
  alternatives_korean:
  - 악인을 죽이실 것입니다
  - 악한 자를 멸하실 것입니다
  - 악한 자를 죽음에 이르게 하실 것입니다
  lexicon: HALOT
  rationale: 원문의 사역형 ‘죽게 하다’를 한국어에서는 가장 직접적인 ‘죽이다’로 옮기되, 문맥상 종말론적 심판의 강도를 유지했습니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅/땅 위의 지역
  - 온 땅
  - 땅(혹은 나라)
  rationale: 이 절은 메시아적 통치의 범위를 말하지만, 여기서의 אֶרֶץ는 시적 병행 속에서 ‘땅’이 가장 무리 없는 직접 대응입니다. 앞의 ‘가난한 자들/겸손한 자들’과도 잘 맞습니다.
  doctrine_reference: 문맥 우선의 어휘 선택
- issue: רָשָׁע의 단수성
  chosen_reading: 악한 자
  alternative_readings:
  - 악인
  - 악한 자들
  - 그 악한 자
  rationale: 히브리어 단수는 대표적·총칭적으로도 쓰일 수 있으므로, 본문은 포괄적 심판을 보존하는 ‘악한 자’로 두었습니다. 개별 인물화는 여기서 확정하지 않습니다.
  doctrine_reference: 해석적 긴장 보존
