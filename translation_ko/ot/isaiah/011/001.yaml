source:
  edition: WLC
  text: וְ/יָצָ֥א חֹ֖טֶר מִ/גֵּ֣זַע יִשָׁ֑י וְ/נֵ֖צֶר מִ/שָּׁרָשָׁ֥י/ו יִפְרֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
  footnotes:
  - marker: a
    text: Or 'And a shoot will come out from the stump of Jesse.' The conjunction may be rendered simply 'and'; 'then' reflects the verse's movement from prior judgment to renewed hope.
    reason: lexical_alternative
  - marker: b
    text: Or 'a rod' or 'a twig' for 'shoot.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a sprout' for 'branch.' Some readers see messianic significance in this image, but the translation keeps the ordinary botanical sense in the main text.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'his roots'; some translations smooth the metaphor as 'its roots.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이새의 그루터기에서 새싹이 돋아날 것입니다.[a][b] 그의 뿌리에서 가지가 열매를 맺을 것입니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그때’는 단순히 ‘그리고’로도 옮길 수 있습니다. 여기서는 앞선 심판에서 새 희망으로 이어지는 흐름을 드러내기 위해 ‘그때’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새싹’(히브리어 חֹטֶר)은 ‘순’, ‘막대기’, ‘작은 가지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘가지’(히브리어 נֵצֶר)는 ‘새순’ 또는 ‘싹’으로도 옮길 수 있습니다. 본문은 일반적인 식물 비유를 유지하며, 특정 신학적 칭호를 덧붙이지 않습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘그의 뿌리’라는 남성 단수 소유 접미사를 사용합니다. 비유를 매끄럽게 하기 위해 ‘그 뿌리’ 또는 ‘그것의 뿌리’로 옮기는 번역도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: Then ... will come out
  chosen_korean: 그때 ... 나고
  alternatives_korean:
