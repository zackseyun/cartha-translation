id: ISA.11.1
reference: Isaiah 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָ֥א חֹ֖טֶר מִ/גֵּ֣זַע יִשָׁ֑י וְ/נֵ֖צֶר מִ/שָּׁרָשָׁ֥י/ו יִפְרֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
  footnotes:
  - marker: a
    text: Or 'And a shoot will come out from the stump of Jesse.' The conjunction may be rendered simply 'and'; 'then' reflects the verse's movement from prior judgment to renewed hope.
    reason: lexical_alternative
  - marker: b
    text: Or 'a rod' or 'a twig' for 'shoot.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a sprout' for 'branch.' Some readers see messianic significance in this image, but the translation keeps the ordinary botanical sense in the main text.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'his roots'; some translations smooth the metaphor as 'its roots.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이새의 그루터기에서 한 새싹이 나고, 그의 뿌리에서 한 가지가 열매를 맺을 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그때’로 옮긴 것은 단순한 ‘그리고’도 가능하나, 앞선 심판에서 새 희망으로 넘어가는 흐름을 드러내기 위한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새싹’은 ‘순’, ‘줄기’, ‘가지’보다 현대 한국어에서 새로 돋는 식물 이미지를 가장 분명하게 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한 가지’는 ‘branch’의 자연스러운 대응이면서, 앞의 ‘새싹’과의 평행 구조를 유지합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 3인칭 남성 단수 소유격을 쓰므로 ‘그의 뿌리’로 옮겼습니다. 일부 번역은 비인칭적으로 ‘그것의 뿌리’로 부드럽게 처리합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: Then ... will come out
  chosen_korean: 그때 ... 나고
  alternatives_korean:
  - 그리고 ... 나고
  - 그러면 ... 나고
  - 그때 ... 나올 것입니다
  lexicon: HALOT
  rationale: וְ는 문맥상 단순 접속을 넘어 앞선 심판에서 새 희망으로 넘어가는 흐름을 드러내므로, ‘그때’로 옮겨 서사적 전환을 살렸습니다.
- source_word: חֹטֶר
  english_pob_choice: shoot
  chosen_korean: 새싹
  alternatives_korean:
  - 순
  - 줄기
  - 가지
  lexicon: HALOT
  rationale: חֹטֶר은 그루터기에서 돋는 식물 이미지를 가리키므로, 현대 한국어에서 가장 자연스럽고 생장 이미지를 살리는 ‘새싹’을 택했습니다.
- source_word: מִגֵּזַע
  english_pob_choice: from the stump
  chosen_korean: 그루터기에서
  alternatives_korean:
  - 그루터기로부터
  - 잘린 밑동에서
  - 줄기에서
  lexicon: HALOT
  rationale: גֵּזַע는 베어진 나무의 그루터기/밑동을 뜻하므로, 심판 이후 남은 흔적이라는 이미지를 분명히 하는 ‘그루터기’로 옮겼습니다.
- source_word: וְנֵצֶר
  english_pob_choice: branch
  chosen_korean: 한 가지
  alternatives_korean:
  - 한 새순
  - 한 싹
  - 한 가지기
  lexicon: HALOT
  rationale: נֵצֶר은 새로 돋는 가지/순을 가리키며, 앞 절의 ‘새싹’과 평행을 이루도록 ‘한 가지’로 옮겨 식물 비유의 병렬성을 유지했습니다.
- source_word: מִשָּׁרָשָׁיו
  english_pob_choice: from his roots
  chosen_korean: 그의 뿌리에서
  alternatives_korean:
  - 그 뿌리에서
  - 그의 뿌리들에서
  - 그것의 뿌리에서
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 접미사를 반영해 ‘그의’를 유지했고, 왕조적 기원을 드러내는 뿌리 이미지를 살렸습니다.
- source_word: יִפְרֶה
  english_pob_choice: will bear fruit
  chosen_korean: 열매를 맺을 것입니다
  alternatives_korean:
  - 열매를 맺게 될 것입니다
  - 열매를 맺을 것입니다
  - 번성할 것입니다
  lexicon: HALOT
  rationale: פרה는 단순한 생존이 아니라 생산적 번성을 뜻하므로, 식물 이미지와 결과성을 함께 담는 ‘열매를 맺다’로 옮겼습니다.
theological_decisions:
- issue: 메시아적 암시를 본문에 직접 넣을지 여부
  chosen_reading: 본문은 일차적으로 이새의 계보에서 돋는 식물 이미지로 번역하고, 메시아적 의미는 본문 밖의 정경적 맥락에 맡겼습니다.
  alternative_readings:
  - ‘가지’ 또는 대문자화로 메시아 표지를 본문에 강하게 드러내는 번역
  rationale: 히브리어 자체는 별칭이나 칭호보다 성장 비유를 제시하므로, 원문의 직접 의미를 보존하면서 신학적 해석의 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 남성 소유격의 보존
  chosen_reading: ‘his roots’를 반영해 ‘그의 뿌리’로 유지했습니다.
  alternative_readings:
  - ‘그 뿌리’ 또는 ‘그것의 뿌리’로 중화
  rationale: 히브리어의 남성 단수 접미사는 이새/계보와의 연결을 유지하므로, 한국어에서도 인칭을 지워버리지 않았습니다.
  doctrine_reference: Translation philosophy §4
