  lexicon: HALOT
  rationale: וְ는 문맥상 단순 접속을 넘어 앞선 심판에서 새 희망으로 넘어가는 흐름을 드러내므로, ‘그때’로 옮겨 서사적 전환을 살렸습니다.
- source_word: חֹטֶר
