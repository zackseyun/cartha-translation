id: ISA.11.11
reference: Isaiah 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
  footnotes:
  - marker: a
    text: Or 'will recover ... a second time.' The Hebrew literally says 'will again/add to extend his hand ... to acquire,' an idiom many versions render 'recover.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the islands of the sea.' The Hebrew expression can refer to islands or maritime coastlands more broadly.
    reason: lexical_alternative
  - marker: c
    text: Cush is the Hebrew place name, often associated with regions south of Egypt; some translations use 'Ethiopia.'
    reason: cultural_note
translation:
  language: ko
  text: 그 날에 주님께서 다시 한 번 손을 펴셔서, 아시리아와 이집트와 바드로스와 구스와 엘람과 시날과 하맛과 바다의 해안들에서 남아 있는 자기 백성의 남은 자를 거두어 오실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  english_pob_choice: And in that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날이 되면
  - 그 날에는
  lexicon: HALOT
  rationale: 예언적 시간 표지를 한국어에서 자연스럽게 살리되, 문두의 전환 감각을 유지했습니다.
- source_word: יוֹסִיף ... יָדוֹ / שֵׁנִית
  english_pob_choice: will again extend his hand, a second time
  chosen_korean: 다시 한 번 손을 펴셔서
  alternatives_korean:
  - 다시 손을 내밀어
  - 두 번째로 손을 펴셔서
  - 다시 한 번 손을 내미셔서
  lexicon: HALOT
  rationale: ‘손’을 유지해 하나님의 적극적 개입 이미지를 살렸고, ‘다시 한 번’으로 יוֹסִיף와 שֵׁנִית의 반복성을 함께 반영했습니다.
- source_word: לִקְנוֹת
  english_pob_choice: to acquire
  chosen_korean: 거두어 오실 것입니다
  alternatives_korean:
  - 얻으실 것입니다
  - 되찾으실 것입니다
  - 회복하실 것입니다
  lexicon: HALOT
  rationale: קנה의 핵심 의미를 ‘획득/얻음’으로 보되, 문맥상 흩어진 백성을 다시 모아 들이는 동작을 드러내기 위해 ‘거두어 오시다’로 옮겼습니다. ‘회복하다’는 결과를 앞세우므로 피했습니다.
- source_word: שְׁאָר עַמּוֹ
  english_pob_choice: the remnant of his people
  chosen_korean: 자기 백성의 남은 자
  alternatives_korean:
  - 자기 백성의 남은 무리
  - 그의 백성의 남은 자
  lexicon: HALOT
  rationale: 예언서의 정착된 표현인 ‘remnant’를 ‘남은 자’로 옮겨 수량적·신학적 함의를 보존했습니다.
- source_word: וּמֵאִיֵּי הַיָּם
  english_pob_choice: from the coastlands of the sea
  chosen_korean: 바다의 해안들에서
  alternatives_korean:
  - 바다의 섬들에서
  - 바다의 연안들에서
  lexicon: HALOT
  rationale: אִיִּים의 지리적 범위를 ‘섬들/해안지대’로 모두 담을 수 있어, 보다 넓은 해안 지역을 뜻하는 한국어 표현을 택했습니다.
theological_decisions:
- issue: 주의 ‘손’을 유지할지, 수습/회복이라는 뜻으로 완전히 풀어쓸지
  chosen_reading: 손을 펴셔서
  alternative_readings:
  - 회복하셔서
  - 다시 모으셔서
  rationale: 히브리어 본문은 주님의 ‘손’을 명시하므로, 비유적 이미지를 지우지 않고 보존하는 것이 원문 친화적입니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘거두어 오시다’가 회복의 결과를 암시하는지
  chosen_reading: 거두어 오실 것입니다
  alternative_readings:
  - 되찾으실 것입니다
  - 회복하실 것입니다
  rationale: 문맥상 하나님이 흩어진 백성을 다시 모아 들이시는 행위가 중심이므로, ‘거두어 오다’는 동작성과 수집의 이미지를 유지하면서도 신학적 과장을 덜합니다.
  doctrine_reference: Translation philosophy §5
