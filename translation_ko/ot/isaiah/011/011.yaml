- from: 그 날에 주님께서 다시 한 번 손을 펴셔서, 아시리아와 이집트와 바드로스와 구스와 엘람과 시날과 하맛과 바다의 해안들에서 남아 있는 자기 백성의 남은 자를 거두어 오실 것입니다.
  to: 그 날에 주님께서 다시 한 번 손을 내미시어, 아시리아와 이집트와 바드로스와 구스와 엘람과 시날과 하맛과 바다의 섬들[a]에서 자기 백성 가운데 남아 있는 남은 자를 얻으실 것입니다.
  rationale: 원문의 ‘손’이라는 비유적 표현과 반복적 행동(‘다시 한 번’)은 유지했습니다. 다만 לִקְנוֹת에 문맥상 귀환·수집의 동작을 덧씌우지 않고 ‘얻다’로 옮겼으며, 마지막 지명 표현의 지리적 모호성은 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:15Z'
review_pass:
  verdict: revise
  source_fidelity: ‘거두어 오실 것입니다’는 흩어진 백성을 모아 귀환시키는 뜻을 강하게 보태며, לִקְנוֹת(얻다/취하다)의 어휘적 중심을 충분히 반영하지 못합니다. 이를 ‘얻으실 것입니다’로 바로잡았습니다. 또한 אִיֵּי הַיָּם의 ‘섬들/해안 지역’ 범위는 한쪽으로 단정하지 않도록 각주로 보존했습니다.
  naturalness: ‘손을 내미시어’는 히브리어의 손 이미지를 유지하면서 현대 표준어 합쇼체에서 자연스럽습니다. ‘자기 백성 가운데 남아 있는 남은 자’는 원문의 ‘남은 자’와 이를 한정하는 ‘남아 있는’을 모두 반영합니다.
  terminology: 아시리아, 이집트, 바드로스, 구스, 엘람, 시날, 하맛은 음역을 유지했습니다. ‘주님’과 존대 종결 표현은 요청된 현대 합쇼체에 맞습니다.
  issues:
  - severity: medium
    issue: לִקְנוֹת를 ‘거두어 오실 것입니다’로 번역함
    rationale: ‘거두어 오다’는 수집·귀환의 동작과 ‘되찾음’의 결과를 구체화합니다. 본문의 동사는 기본적으로 ‘얻다/취득하다’이며, 문맥적 회복 의미를 본문 번역에 앞세우지 않는 편이 더 충실합니다.
  - severity: low
    issue: ‘바다의 해안들’이 אִיֵּי의 의미 범위를 좁히고 한국어로도 다소 부자연스러움
    rationale: אִיִּים은 섬들을 가리킬 수도, 더 넓게 해양 연안 지역을 가리킬 수도 있습니다. 본문에는 ‘바다의 섬들’을 쓰고 각주에서 ‘해안 지역’ 가능성을 밝혀 모호성을 보존하는 것이 안전합니다.
