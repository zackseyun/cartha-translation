source:
  edition: WLC
  text: וְ/שִֽׁעֲשַׁ֥ע יוֹנֵ֖ק עַל חֻ֣ר פָּ֑תֶן וְ/עַל֙ מְאוּרַ֣ת צִפְעוֹנִ֔י גָּמ֖וּל יָד֥/וֹ הָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
  footnotes:
  - marker: a
    text: Or 'asp' for 'cobra.' The Hebrew term denotes a venomous snake, traditionally identified with the asp/cobra.
    reason: lexical_alternative
  - marker: b
    text: Or 'will stretch out his hand' instead of 'will put his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 젖먹이가 코브라[a]의 굴 위에서 뛰놀고, 젖 뗀 아이가 독사의 굴에 손을 대[b]게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아스프’로 옮길 수 있습니다. 히브리어는 독이 있는 뱀을 가리키며, 전통적으로 아스프 또는 코브라로 여겨집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘손을 뻗을’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  english_pob_choice: will play
  chosen_korean: 뛰놀고
  alternatives_korean:
  - 놀고
  - 장난치고
  lexicon: HALOT
  rationale: 무해하고 자유로운 유희의 느낌을 살리기 위해 ‘뛰놀다’를 택했습니다. 단순히 ‘즐거워하다’보다 장면의 역동성을 더 잘 드러냅니다.
- source_word: יוֹנֵק
  english_pob_choice: the nursing child
  chosen_korean: 젖먹이
  alternatives_korean:
  - 젖먹는 아이
  - 수유 중인 아이
  lexicon: HALOT
  rationale: 아직 젖을 먹는 어린아이라는 뜻을 한국어에서 자연스럽고 간결하게 전달하는 표현으로 ‘젖먹이’를 사용했습니다.
- source_word: פָּתֶן
  english_pob_choice: cobra
  chosen_korean: 코브라
  alternatives_korean:
  - 독사
  - 뱀
  lexicon: HALOT
  rationale: 특정한 독사류를 가리키는 점을 살리기 위해 음역형 고유명사에 가까운 ‘코브라’를 유지했습니다. 이는 일반적인 ‘뱀’보다 원문의 구체성을 더 보존합니다.
- source_word: צִפְעוֹנִי
  english_pob_choice: viper
  chosen_korean: 독사
  alternatives_korean:
  - 살무사
  - 독을 지닌 뱀
  lexicon: HALOT
  rationale: 원문이 가리키는 맹독성 뱀의 일반성을 한국어로 압축해 주는 말로 ‘독사’를 택했습니다. 앞의 ‘코브라’와 함께 서로 다른 독사 이미지를 병렬로 유지합니다.
theological_decisions:
- issue: 종말적 평화의 이미지 처리
  chosen_reading: 이 구절을 어린아이와 치명적인 뱀이 공존해도 해를 입지 않는 초월적 평화의 시적으로 제시했습니다.
  alternative_readings:
  - 상징적 메시아 평화의 비유
  - 피조세계의 문자적 변화 묘사
  rationale: 본문 자체가 위험이 사라진 정경을 시적으로 보여 주므로, 그 긴장과 힘을 보존하고 해석적 결론은 내리지 않았습니다.
  doctrine_reference: 예언시의 이미지와 종말적 평화에 대한 해석적 유보
