translation:
  language: ko
  text: 늑대가 어린 양과 함께 살며, 표범이 어린 염소와 함께 누울 것입니다. 송아지와 젊은 사자와 살진 송아지가 함께 있을 것이며, 어린아이가 그들을 이끌 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘늑대가 어린 양과 함께 ‘머무를’ 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘새끼 염소’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘사자 새끼’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘어린아이가 그들을 인도할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  english_pob_choice: will dwell
  chosen_korean: 함께 살며
  alternatives_korean:
  - 거주하며
  - 머물며
  - 함께 거하며
  lexicon: HALOT
  rationale: גור의 거주/체류 이미지를 자연스러운 현대 한국어로 옮기되, ‘함께 살다’는 평화로운 공존을 잘 드러냅니다.
- source_word: גְּדִי
  english_pob_choice: young goat
  chosen_korean: 어린 염소
  alternatives_korean:
  - 염소 새끼
  - 새끼 염소
  - 어린 염소새끼
  lexicon: HALOT
  rationale: ‘young goat’의 의미를 분명히 하면서도 ‘kid’에 해당하는 한국어의 모호함을 피하기 위해 ‘어린 염소’로 옮겼습니다.
- source_word: כְּפִיר
  english_pob_choice: young lion
  chosen_korean: 젊은 사자
  alternatives_korean:
  - 사자 새끼
  - 어린 사자
  lexicon: HALOT
  rationale: כפיר는 어린 사자를 가리키지만, 예언시의 품격과 한국어 리듬을 고려해 ‘젊은 사자’로 옮겼습니다.
- source_word: נַעַר קָטֹן
  english_pob_choice: a little boy
  chosen_korean: 어린아이
  alternatives_korean:
  - 작은 소년
  - 어린 소년
  - 어린 남자아이
  lexicon: HALOT
  rationale: נַעַר의 남성적 뉘앙스를 살릴 수 있으나, 한국어에서는 시적 장면의 자연스러움과 포괄성을 위해 ‘어린아이’로 간결하게 표현했습니다.
theological_decisions:
- issue: 평화의 나라 이미지 처리
  chosen_reading: 동물들이 실제로 어울려 사는 장면을 그대로 살리되, 번역문 안에서 그것을 곧바로 문자적 변형이나 단순한 비유로 해석하지 않았습니다.
  alternative_readings:
  - 전적으로 문자적인 동물 평화로 단정
  - 전적으로 인간 사회의 은유로 환원
  rationale: 히브리어 본문은 구체적 동물 이미지로 평화를 그리므로, 번역은 해석을 확정하기보다 그 긴장을 보존해야 합니다.
  doctrine_reference: 예언적 상징과 문자적 기대의 긴장 보존
