    rationale: ‘땅이 야훼를 아는 지식으로 바다를 덮는 물처럼 가득할’은 한국어에서 ‘지식이 바다를 덮는다’는 식으로 순간적으로 읽힐 수 있습니다. ‘땅이 바다를 덮는 물처럼 … 가득할’로 두어 히브리어 비교절의 관계를 명료하게 해야 합니다.
