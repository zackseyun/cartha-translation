  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
  footnotes:
  - marker: a
    text: Or 'the land will be full of the knowledge of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 거룩한 산 전체에서 해를 끼치거나 파괴하지 않을 것입니다. 이는 땅이 야훼를 아는 지식으로 바다를 덮는 물처럼 가득할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅이 주를 아는 지식으로 가득할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹֽא יָרֵעוּ
  english_pob_choice: do harm
  chosen_korean: 해를 끼치지 않을 것입니다
  alternatives_korean:
  - 악을 행하지 않을 것입니다
  - 해치지 않을 것입니다
  lexicon: HALOT
  rationale: 히필형 רעע의 구체적 의미를 반영해, 단순한 도덕적 악행보다 ‘해를 끼침’의 의미를 살렸습니다.
- source_word: וְ/לֹֽא יַשְׁחִ֖יתוּ
  english_pob_choice: bring destruction
  chosen_korean: 파괴하지 않을 것입니다
  alternatives_korean:
  - 멸망시키지 않을 것입니다
  - 망가뜨리지 않을 것입니다
  lexicon: HALOT
  rationale: שׁחת의 히필이 가진 ‘파괴하다/망치다’의 사역적 뉘앙스를 간결하게 살렸습니다.
- source_word: בְּ/כָל הַ֣ר קָדְשִׁ֑י
  english_pob_choice: all my holy mountain
  chosen_korean: 내 거룩한 산 전체에서
  alternatives_korean:
  - 내 거룩한 산에서
  - 내 거룩한 산 위에서
  lexicon: HALOT
  rationale: בְּ와 כָל의 포괄성을 살리면서, 한국어에서 자연스러운 ‘전체에서’로 범위를 분명히 했습니다.
- source_word: יְהוָ֔ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명(神名) יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨 고유성을 보존했습니다.
theological_decisions:
- issue: 하나님의 지식이 충만해지는 범위
  chosen_reading: ‘땅’이 야훼를 아는 지식으로 가득해지는 우주적 비전을 반영했습니다.
  alternative_readings:
  - ‘땅’보다 ‘그 땅’으로 제한하는 읽기
  rationale: 문맥의 바다 비유가 범위의 확장을 보여 주므로, 지역적 한정보다 보편적 충만을 드러내는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
