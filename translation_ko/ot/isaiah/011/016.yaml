id: ISA.11.16
reference: Isaiah 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'that is left from Assyria.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the day of his coming up from the land of Egypt'; that is, as in Israel's exodus from Egypt.
    reason: cross_reference
translation:
  language: ko
  text: 그의 백성 중 남은 자에게, 곧 앗수르에서 살아남은 자들에게 대로가 있을 것입니다. 이스라엘이 이집트 땅에서 올라오던 날과 같을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앗수르에서 남아 있는 자들에게’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이집트 땅에서 올라오던 날’입니다. 즉, 이스라엘의 출애굽을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: מְסִלָּה
  english_pob_choice: a highway
  chosen_korean: 대로
  alternatives_korean:
  - 큰길
  - 고속도로
  - 길
  lexicon: HALOT
  rationale: 예비된 이동 경로라는 이미지를 살리면서도 현대 한국어에서 자연스럽고 품위 있는 표현으로 옮겼습니다.
- source_word: לִשְׁאָר עַמּוֹ / אֲשֶׁר יִשָּׁאֵר
  english_pob_choice: for the remnant of his people that remains
  chosen_korean: 그의 백성 중 남은 자에게, 곧 앗수르에서 살아남은 자들에게
  alternatives_korean:
  - 그의 백성의 남은 자에게
  - 그의 백성 가운데 남은 무리에게
  - 그의 백성 중 남아 있는 사람들에게
  lexicon: HALOT
  rationale: שְׁאָר의 핵심인 ‘남은 자/남은 무리’를 살리되, 한국어에서는 반복을 피하고 의미를 분명하게 하려고 설명적 병치를 사용했습니다.
- source_word: מֵאַשּׁוּר
  english_pob_choice: from Assyria
  chosen_korean: 앗수르에서
  alternatives_korean:
  - 아수르에서
  - 앗시리아에서
  lexicon: HALOT
  rationale: 성서 번역에서 널리 쓰이는 고유명사 음역을 따랐습니다.
- source_word: בְּיוֹם עֲלֹתוֹ
  english_pob_choice: in the day of his coming up
  chosen_korean: 올라오던 날
  alternatives_korean:
  - 올라간 날
  - 올라오던 그날
  - 올라온 날
  lexicon: HALOT
  rationale: 히브리어의 ‘올라가다/올라오다’라는 출애굽 관용구를 살리면서, 과거 회상과 비교의 뉘앙스를 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘그의 백성’의 소유격이 누구를 가리키는지
  chosen_reading: 소유격을 해소하지 않고 ‘그의 백성’으로 유지했습니다.
  alternative_readings:
  - 야훼의 백성
  - 메시아의 백성
  rationale: 문맥상 지시 대상이 열려 있으므로, 본문이 직접 말하지 않는 신학적 해석을 번역문에 선반영하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 출애굽 비교의 표현
  chosen_reading: 이스라엘의 이집트 탈출을 직접 암시하는 역사적 비교로 옮겼습니다.
  alternative_readings:
  - 새 출애굽
  - 출애굽적 구원
  rationale: 본문은 개념어를 덧붙이기보다 비교 자체를 말하므로, 해석어를 추가하지 않고 원문의 유비를 그대로 드러냈습니다.
  doctrine_reference: Original-language primacy over translation tradition.
