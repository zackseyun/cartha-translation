id: ISA.11.15
reference: Isaiah 11:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
  footnotes:
  - marker: a
    text: Or 'the gulf of Egypt'; literally 'the tongue of the sea of Egypt.'
    reason: lexical_alternative
  - marker: b
    text: That is, the Euphrates.
    reason: cross_reference
  - marker: c
    text: Or 'with the heat of his wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이집트 바다의 혀[a]를 완전히 멸하실 것이며, 강 위에 손을 흔드실 것입니다. 그의 바람의 뜨거움으로[c] 그것을 치셔서 일곱 갈래의 시내[b]가 되게 하시고, 사람들이 샌들을 신고 건너가게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 만’; 문자적으로는 ‘이집트 바다의 혀’입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 유프라테스 강입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그의 바람의 열기로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִים / יְהוָה
  english_pob_choice: will utterly destroy / Yahweh
  chosen_korean: 완전히 멸하실 것이며 / 야훼
  alternatives_korean:
  - 멸망시키실 것이며
  - 진멸하실 것이며
  - 여호와
  lexicon: HALOT
  rationale: החרים의 निर्ण착적 제거 의미를 살려 ‘완전히 멸하다’로 옮기고, יהוה는 본 프로젝트 기본값에 따라 고유명 ‘야훼’로 옮겼습니다.
- source_word: לְשׁוֹן יָם מִצְרַיִם
  english_pob_choice: the tongue of the sea of Egypt
  chosen_korean: 이집트 바다의 혀
  alternatives_korean:
  - 이집트 바다의 곶
  - 이집트 바다의 수역
  lexicon: HALOT
  rationale: לשון의 문자적 이미지인 ‘혀’를 본문에 보존해, 지리적 표현이면서도 비유적 형상을 독자가 보게 했습니다.
- source_word: בַּעְיָם רוּחוֹ
  english_pob_choice: with the scorching of his wind
  chosen_korean: 그의 바람의 뜨거움으로
  alternatives_korean:
  - 그의 바람의 열기로
  - 그의 바람의 scorching으로
  lexicon: HALOT
  rationale: בעים의 열기/뜨거움 의미를 살리면서, רוח를 여기서는 ‘바람’으로 두어 물을 말리는 심판의 힘을 드러냈습니다.
- source_word: לְשִׁבְעָה נְחָלִים
  english_pob_choice: into seven streams
  chosen_korean: 일곱 갈래의 시내
  alternatives_korean:
  - 일곱 시내
  - 일곱 물줄기
  lexicon: HALOT
  rationale: נחלים는 현대 한국어에서 가장 자연스럽게 ‘시내/갈래’의 흐름으로 전달되는 경우가 많아, 분기된 물길의 이미지를 살렸습니다.
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  english_pob_choice: make people walk through in sandals
  chosen_korean: 사람들이 샌들을 신고 건너가게 하실 것입니다
  alternatives_korean:
  - 샌들을 신고 지나가게 하실 것입니다
  - 신을 신고 건너가게 하실 것입니다
  lexicon: HALOT
  rationale: 히필의 ‘걷게 하다/건너게 하다’ 의미를 반영하되, 한국어에서는 사람을 명시해 결과를 자연스럽게 표현했습니다. ‘샌들’은 신발을 벗지 않고 쉽게 건너는 장면을 구체화합니다.
theological_decisions:
- issue: 이사야 11:15의 물 이미지 처리
  chosen_reading: 지리적 물길을 실제로 다루시는 하나님의 심판 행위로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 정치적 장애물의 상징으로만 번역
  - 출애굽 유형론을 번역문에 직접 주입
  rationale: 본문은 출애굽을 연상시키는 물 이미지 자체를 사용하므로, 번역이 그 구체성을 지우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3
