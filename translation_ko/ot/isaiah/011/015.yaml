review_pass:
  verdict: revise
  source_fidelity: 수정안은 וְהֵנִיף יָדוֹ עַל־הַנָּהָר בַּעְיָם רוּחוֹ를 한 문장 안에서 유지하여, ‘강’ 위로 손을 흔드는 행위와 ‘그분의 바람의 열기’를 연결합니다. 이어지는 3인칭 목적어 ‘그것’은 문맥상 ‘강’을 가리키며, 일곱 물줄기로 나뉘게 되는 뜻을 보존합니다.
  naturalness: 초안의 ‘강 위에 손을 흔드실 것입니다. 그의 바람의…’는 원문의 한 절을 부자연스럽게 분리하고 수식 관계를 흐립니다. ‘그분의 바람의 열기로 강 위에 손을 흔드시고’로 연결하면 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다. ‘일곱 갈래의 시내로 만드시고’는 ‘시내가 되게 하시고’보다 목적어 ‘그것’을 더 분명히 유지합니다.
  terminology: ‘야훼’, ‘이집트 바다의 혀’, ‘강’, ‘일곱 갈래의 시내’, ‘샌들’은 원문의 고유명·지리 이미지·구체적 신발 이미지를 적절히 보존합니다. ‘강’의 각주 표지는 유프라테스라는 식별을 설명하므로 반드시 ‘강’에 붙여야 합니다.
  issues:
  - severity: medium
    issue: 원문의 ‘강 위에 손을 흔드시고’와 ‘그분의 바람의 열기로’의 연결이 문장 분리로 흐려졌습니다.
    rationale: 히브리어는 이 요소들을 하나의 연속된 절로 제시합니다. 초안처럼 마침표로 나누면 ‘그의 바람의 뜨거움으로’가 다음 절에만 걸리는 듯하여 원문의 구문 관계가 불명확해집니다.
  - severity: medium
    issue: 각주 b가 ‘강’이 아니라 ‘시내’에 잘못 연결되어 있습니다.
    rationale: 각주 b의 ‘곧 유프라테스 강입니다’는 הַנָּהָר(그 강)를 설명합니다. ‘일곱 갈래의 시내’에 붙이면 유프라테스가 시내들을 뜻하는 것처럼 오해될 수 있습니다.
  revised_text: 야훼께서 이집트 바다의 혀[a]를 완전히 멸하실 것이며, 그분의 바람의 열기로 강[b] 위에 손을 흔드시고 그것을 쳐서 일곱 갈래의 시내로 만드시며, 사람들이 샌들을 신고 건너가게 하실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이집트 만’; 문자적으로는 ‘이집트 바다의 혀’입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 유프라테스 강입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그분의 바람의 뜨거움으로’.
    reason: lexical_alternative
  revision_rationale: 안전한 최소 수정으로 원문의 절 연결을 회복하고, 유프라테스 식별 각주를 해당 명사인 ‘강’으로 옮겼습니다. 본문 표현을 ‘그분의 바람의 열기’로 다듬었으므로, 대안 표현 각주도 ‘뜨거움’으로 교체했습니다. 지리적 물 이미지와 히필 동사의 사역적 결과는 유지했습니다.
