id: ISA.11.2
reference: Isaiah 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
  footnotes:
  - marker: a
    text: 'Hebrew repeats ''spirit'' three times after ''the Spirit of the LORD,'' emphasizing the qualities or operations of that one Spirit: wisdom and understanding, counsel and might, knowledge and the fear of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'reverence for the LORD' for 'the fear of the LORD'; the Hebrew expression includes reverent awe, not mere terror.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 영, 곧 지혜와 명철의 영, 모략과 능력의 영, 지식과 야훼를 경외하는 영이 그 위에 머무를 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 영’ 뒤에 ‘영’을 세 번 반복합니다. 이 반복은 지혜와 명철, 모략과 능력, 지식과 야훼 경외라는 성격과 작용을 강조합니다.
    reason: source_note
  - marker: b
    text: ‘야훼를 경외하는’은 히브리어 ‘야훼의 두려움/경외’라는 관용구를 옮긴 것입니다. 이는 단순한 공포만이 아니라 야훼를 향한 경외와 순종을 포함합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָחָה
  english_pob_choice: will rest
  chosen_korean: 머무를 것이며
  alternatives_korean:
  - 쉬게 될 것이며
  - 머물러 있을 것이며
  - 내릴 것입니다
  lexicon: HALOT
  rationale: נוח은 ‘쉬다/머무르다’의 뜻으로, 예언 문맥에서 지속적으로 임하는 상태를 나타내므로 한국어로는 ‘머무르다’가 가장 자연스럽고 지속성을 잘 살립니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 여호와의 영
  - 야훼의 성령
  - 주님의 영
  lexicon: HALOT
  rationale: 이 본문은 하나님의 영을 가리키며, 본 프로젝트의 기본 원칙에 따라 신명기 이름 יְהוָה는 ‘야훼’로 옮기고, רוּחַ는 여기서 초월적 존재를 뜻하는 ‘영’으로 번역했습니다.
- source_word: רוּחַ חָכְמָה וּבִינָה
  english_pob_choice: a spirit of wisdom and understanding
  chosen_korean: 지혜와 깨달음의 영
  alternatives_korean:
  - 지혜와 이해의 영
  - 지혜와 분별의 영
  - 지혜와 명철의 영
  lexicon: HALOT
  rationale: 반복되는 ‘영’ 구문을 한국어에서 매번 ‘한 영’으로 번역하면 부자연스러워져, 영어 POB의 반복 효과를 살리되 한국어에서는 핵심 속성을 묶어 ‘지혜와 깨달음의 영’으로 표현했습니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 명철
  - 분별
  lexicon: HALOT
  rationale: בינה는 단순한 지적 이해를 넘어 사물을 분별해 아는 능력을 포함하므로, 현대 한국어에서 그 뉘앙스를 살리는 ‘깨달음’을 선택했습니다.
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  english_pob_choice: a spirit of counsel and might
  chosen_korean: 권고와 능력의 영
  alternatives_korean:
  - 모략과 능력의 영
  - 상담과 힘의 영
  - 권고와 힘의 영
  lexicon: HALOT
  rationale: עצה는 왕적·지도적 문맥에서 ‘권고/모략’의 뜻이므로, ‘권고’가 가장 직접적입니다. גבורה는 단순한 힘보다 뛰어난 역량과 위력을 가리켜 ‘능력’이 적절합니다.
- source_word: דַּעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 지식
  - 앎
  - 인식
  lexicon: HALOT
  rationale: דעת은 여기서 하나님과 그의 뜻을 아는 인식으로, 한국어 성경 문맥에서 안정적인 ‘지식’이 가장 무난합니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 두려워하는 영
  alternatives_korean:
  - 야훼에 대한 경외의 영
  - 야훼를 경외하는 영
  - 야훼를 두려워함의 영
  lexicon: HALOT
  rationale: stock 표현 ‘the fear of Yahweh’를 그대로 살리되, 한국어에서는 관용적으로 ‘두려워하는’으로 옮겨 어휘적 긴장—경외와 두려움이 함께 있는 의미—을 보존했습니다.
theological_decisions:
- issue: 반복되는 רוּחַ 구문을 여러 영으로 볼지, 하나의 영의 여러 속성으로 볼지
  chosen_reading: 야훼의 한 영을 설명하는 반복적 수식으로 이해했습니다.
  alternative_readings:
  - 서로 다른 여러 영의 열거
  - 일곱 가지 독립된 영적 은사 목록
  rationale: 히브리어 문장은 ‘야훼의 영’ 뒤에 ‘영’이 반복되며 그 작용과 성격을 묘사합니다. 한국어도 이 반복을 완전히 지우지 않되, 하나의 영이 지혜·권고·지식·야훼 경외로 특징지어진다는 점을 보존했습니다.
  doctrine_reference: 원문 구문이 허용하는 신학적 긴장을 그대로 유지
