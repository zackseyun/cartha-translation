id: ISA.18.3
reference: Isaiah 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֥י תֵבֵ֖ל וְ/שֹׁ֣כְנֵי אָ֑רֶץ כִּ/נְשֹׂא נֵ֤ס הָרִים֙ תִּרְא֔וּ וְ/כִ/תְקֹ֥עַ שׁוֹפָ֖ר תִּשְׁמָֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
  footnotes:
  - marker: a
    text: Or 'signal' or 'standard' for 'banner' (Hebrew נֵס), a raised sign visible from afar.
    reason: lexical_alternative
  - marker: b
    text: Or 'horn' or 'ram's horn' for 'trumpet' (Hebrew שׁוֹפָר).
    reason: lexical_alternative
translation:
  language: ko
  text: 온 세상의 모든 거주자들과 땅에 사는 이들아, 산들 위에 깃발이 세워지면 너희가 보게 될 것이며, 나팔이 불리면 너희가 듣게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֵס는 ‘깃발’ 외에 ‘신호’ 또는 ‘기치’를 뜻할 수 있습니다. 여기서는 멀리서 볼 수 있도록 높이 든 표지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 שׁוֹפָר는 ‘나팔’ 외에 ‘뿔’ 또는 ‘숫양의 뿔로 만든 나팔’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  english_pob_choice: All you inhabitants of the world
  chosen_korean: 세상 모든 주민들
  alternatives_korean:
  - 온 세상의 거주자들
  - 세상에 사는 모든 사람들
  lexicon: HALOT
  rationale: תֵבֵל은 넓은 거주 세계를 가리키므로, 단순히 '땅'으로 좁히지 않고 보편적 호출을 살려 옮겼습니다.
- source_word: וְשֹׁכְנֵי אָרֶץ
  english_pob_choice: and you dwellers on the earth
  chosen_korean: 땅에 사는 모든 사람들
  alternatives_korean:
  - 땅의 거주자들
  - 땅에 거하는 자들
  lexicon: HALOT
  rationale: 앞 구와 평행을 이루는 동의 반복으로 보아, 같은 뜻을 약간 달리 반복하는 효과를 한국어에서도 유지했습니다.
- source_word: נֵס
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 기치
  - 신호
  lexicon: HALOT
  rationale: נֵס은 멀리서 보이는 높이 든 표지이므로, 현대 한국어에서 즉시 이해되는 '깃발'을 사용하되, 의도된 '신호'의 성격도 유지했습니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 숫양의 뿔
  lexicon: HALOT
  rationale: שׁוֹפָר의 기본 의미는 뿔나팔이지만, 이 문맥에서는 신호를 알리는 악기로서 자연스러운 '나팔'이 적절합니다.
theological_decisions:
- issue: 보편적 호칭의 범위
  chosen_reading: 이 구절을 특정 민족이나 지역이 아니라 '세상 모든 주민들'에게 향한 보편적 호명으로 읽었습니다.
  alternative_readings:
  - 이스라엘 주변 열방에 대한 제한된 호명
  - 시적인 과장 표현
  rationale: 히브리어의 두 평행구가 의도적으로 범위를 확장하므로, 번역에서도 보편성을 분명히 드러내는 것이 본문 효과에 충실합니다.
  doctrine_reference: 창 10장 열방 도식, 이사야의 열방 신탁 문맥
- issue: 기호와 소리의 대응
  chosen_reading: 깃발과 나팔은 단순한 장식물이 아니라, 멀리서 인식되고 응답을 요구하는 경고/소집 표지로 옮겼습니다.
  alternative_readings:
  - 중립적 표지와 소리
  - 종교 의식용 상징
  rationale: 본문의 초점은 상징 자체보다 '보게 되고 듣게 되는' 반응에 있으므로, 기능을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 이사야서의 심판/소집 이미지
