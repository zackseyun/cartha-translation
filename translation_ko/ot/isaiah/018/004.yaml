revisions:
- from: 이것은 야훼께서 내게 말씀하신 바입니다. “내가 내 거처에서[a] 조용히 있으며 지켜보리니, 햇빛 가운데의 맑은 더위[b] 같고, 추수 때의 더위 속의 이슬 구름 같을 것입니다.”
  to: 야훼께서 내게 이렇게 말씀하셨습니다. “내 처소에서[a] 조용히 있으면서 지켜보겠습니다. 햇빛 아래의 맑은 열기[b]처럼, 추수 때 더위 속의 이슬구름처럼.”
  rationale: 비유를 각각 ‘…처럼’으로 처리하여 히브리어의 병렬적이고 시적인 수식 관계를 보존했습니다. 동사의 미래적 선언은 합쇼체 직접화법 ‘지켜보겠습니다’로 자연스럽게 옮겼으며, 야훼의 고요한 관찰을 심판이나 무관심으로 해석해 덧붙이지 않았습니다. 각주 a는 본문의 ‘처소’에 직접 대응하도록 간결하게 정리했고, 각주 b는 직역상 낯선 전치사 관계를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:50:55Z'
