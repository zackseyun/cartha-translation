id: ISA.18.4
reference: Isaiah 18:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
  footnotes:
  - marker: a
    text: Or “I will be still and watch from my fixed place.”
    reason: lexical_alternative
  - marker: b
    text: Literally “like clear heat upon light.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내게 이렇게 말씀하셨습니다. “내 처소에서[a] 조용히 있으면서 지켜보겠습니다. 햇빛 아래의 맑은 열기[b]처럼, 추수 때 더위 속의 이슬구름처럼.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 정해진 자리에서.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “빛 위의 맑은 열기”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 고유한 언약 이름을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다. 문맥상 일반적인 ‘주님’보다 원문 표지를 더 분명히 드러냅니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 대하여
  lexicon: HALOT
  rationale: אָמַר 뒤의 여격으로 자연스럽게 ‘내게’가 맞고, 원문의 직접 수신자를 분명히 드러냅니다.
- source_word: אשקוטה וְאַבִּיטָה
  english_pob_choice: I will remain quiet and look on
  chosen_korean: 조용히 있으며 지켜보리니
  alternatives_korean:
  - 잠잠히 있으며 바라보리니
  - 가만히 있으며 살펴보리니
  lexicon: HALOT
  rationale: שׁקט의 정적과 נבט의 응시를 함께 살리되, 한국어에서 하나의 자연스러운 문장으로 묶었습니다. ‘지켜보다’는 단순 시선보다 관찰적 태도를 더 잘 드러냅니다.
- source_word: בִמְכוֹנִי
  english_pob_choice: from my dwelling place
  chosen_korean: 내 거처에서
  alternatives_korean:
  - 내 고정된 자리에서
  - 내 처소에서
  lexicon: HALOT
  rationale: מָכוֹן의 ‘정해진 자리/거처’ 의미를 반영하되, 문맥상 관망의 위치를 나타내는 말로 ‘거처’가 가장 분명합니다. 전치사 ב는 여기서 출발점/위치의 관점으로 자연스럽게 풀었습니다.
- source_word: כְחֹם צַח עֲלֵי אֹור
  english_pob_choice: like clear heat in sunshine
  chosen_korean: 햇빛 가운데의 맑은 더위
  alternatives_korean:
  - 햇빛 위의 맑은 열기
  - 밝은 빛 속의 맑은 더위
  lexicon: HALOT
  rationale: 직역하면 ‘빛 위의 맑은 더위’이지만, 한국어에서는 자연스러운 자연 현상 이미지인 ‘햇빛 가운데’로 옮기되, צַח의 낯선 ‘맑은/밝은’ 감각은 유지했습니다.
- source_word: כְעָב טַל בְּחֹם קָצִיר
  english_pob_choice: like a cloud of dew in the heat of harvest
  chosen_korean: 추수 때의 더위 속의 이슬 구름
  alternatives_korean:
  - 추수의 더위 속 이슬 구름
  - 추수철 더위 속의 이슬구름
  lexicon: HALOT
  rationale: עָב와 טַל의 구체적 이미지를 그대로 살려 ‘이슬 구름’으로 옮겼고, בְּחֹם קָצִיר은 추수철의 더운 상황을 분명히 하기 위해 ‘추수 때의 더위 속’으로 풀었습니다.
theological_decisions:
- issue: 야훼의 침묵과 관찰의 뉘앙스
  chosen_reading: ‘조용히 있으며 지켜보리니’로 옮겨, 무관심이나 즉각적 심판을 단정하지 않고 원문의 의도된 긴장—고요한 관찰—을 유지했습니다.
  alternative_readings:
  - ‘잠잠히 있으며 바라보리니’로 보다 직역할 수 있음
  - 심판의 예고로 해석하여 문구를 더 강하게 만들 수 있음
  rationale: 본문은 자연 비유를 통해 야훼의 정적과 주시를 제시할 뿐, 그 의미를 번역 단계에서 단정적으로 풀어버리지 않습니다. 그래서 관찰적 긴장을 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존)
