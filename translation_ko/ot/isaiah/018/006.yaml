  text: יֵעָזְב֤וּ יַחְדָּו֙ לְ/עֵ֣יט הָרִ֔ים וּֽ/לְ/בֶהֱמַ֖ת הָ/אָ֑רֶץ וְ/קָ֤ץ עָלָי/ו֙ הָ/עַ֔יִט וְ/כָל בֶּהֱמַ֥ת הָ/אָ֖רֶץ עָלָ֥י/ו תֶּחֱרָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
  footnotes:
  - marker: a
    text: 'Or ''together'': ''They will be left together to the birds of prey of the mountains and to the beasts of the earth.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew uses singular nouns ('bird of prey,' 'upon him') with collective force; the translation renders them as plurals in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 산의 새들과 땅의 짐승들에게 버려질 것입니다[a]. 새들은 그들 위에서 여름을 보내고[b], 땅의 모든 짐승도 그들 위에서 겨울을 보낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘함께’: ‘그들은 모두 산의 새들과 땅의 짐승들에게 함께 버려질 것입니다.’'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘새’와 ‘그 위에’가 단수형이지만 집합적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  english_pob_choice: will be left
  chosen_korean: 버려질 것입니다
  alternatives_korean:
  - 남겨질 것입니다
  - 그대로 놓일 것입니다
  lexicon: HALOT
  rationale: 니팔 미완료형의 수동적 의미를 살려, 사망자들이 방치된 상태로 남는 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: יַחְדָּו
  english_pob_choice: all
  chosen_korean: 모두
  alternatives_korean:
  - 함께
  - 다 같이
  lexicon: HALOT
  rationale: 직역하면 ‘함께’이지만, 문맥상 ‘모두 버려진다’는 집합적 의미가 더 분명하므로 한국어에서는 ‘모두’로 풀었습니다.
- source_word: לְעֵיט / הָעַיִט
  english_pob_choice: the birds of prey
  chosen_korean: 산의 새들
  alternatives_korean:
  - 사나운 새들
  - 독수리들
  lexicon: HALOT
  rationale: 히브리어 עַיִט는 사체를 노리는 맹금류를 가리키며, ‘산의’는 מקור 구문의 지리적 이미지를 반영합니다. 다만 한국어에서 본문 흐름상 지나치게 전문적인 조류명이 아니라 포식성 새들의 집합을 드러내는 표현을 택했습니다.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  english_pob_choice: and to the beasts of the earth
  chosen_korean: 땅의 짐승들에게
  alternatives_korean:
  - 땅의 들짐승들에게
  - 땅의 동물들에게
  lexicon: HALOT
  rationale: בֶּהֱמָה 계열은 여기서 포식성·사체섭식 동물을 포함하는 넓은 ‘짐승’의 뜻이므로, 예배적 어조를 해치지 않는 ‘땅의 짐승들’이 적절합니다.
- source_word: וְקָץ ... תֶּחֱרָף
  english_pob_choice: will summer ... will winter
  chosen_korean: 여름을 보내고 ... 겨울을 보낼 것입니다
  alternatives_korean:
  - 여름을 나고 ... 겨울을 날 것입니다
  - 여름을 지나고 ... 겨울을 지나게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 계절을 ‘지내다’는 관용적 동사를 사용하므로, 영어 POB의 ‘summer/winter’에 해당하는 자연스러운 한국어로 ‘여름을 보내고 / 겨울을 보낼 것입니다’를 택했습니다.
theological_decisions:
- issue: 포식 동물과 계절 동사의 반복이 만드는 심판 이미지
  chosen_reading: 이 구절은 전쟁 후 시체가 방치되어 자연의 먹이와 계절에 맡겨지는 극단적 심판의 풍경을 그대로 드러냅니다.
  alternative_readings:
  - 단순한 묘사로 완화하는 읽기
  - 상징적으로만 이해하는 읽기
  rationale: 원문의 생생한 잔혹성과 예언적 경고를 약화시키지 않기 위해, 자연스러운 한국어로 옮기되 심판의 직접성을 보존했습니다.
  doctrine_reference: 예언서의 심판 선언과 언약 저주의 이미지
