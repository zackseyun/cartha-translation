id: ISA.18.1
reference: Isaiah 18:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וֹי אֶ֖רֶץ צִלְצַ֣ל כְּנָפָ֑יִם אֲשֶׁ֥ר מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/001.yaml
  text: Ah[a], land of whirring wings, which is beyond the rivers of Cush[b],
  footnotes:
  - marker: a
    text: Or 'Woe, land of buzzing wings' or 'Ah, land of rustling wings.' The Hebrew expression is difficult and may evoke the sound of wings, insects, or something wing-like in motion.
    reason: lexical_alternative
  - marker: b
    text: Cush refers to the region south of Egypt, often associated with Nubia or ancient Ethiopia.
    reason: cultural_note
translation:
  language: ko
  text: 아, 날갯짓하는 소리가 나는 땅이여 — 구스의 강들 건너편에 있는 땅이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화 있을진저, 윙윙거리는 날개의 땅’ 또는 ‘아, 바스락거리는 날개의 땅’으로 옮길 수 있습니다. 히브리어 표현은 어렵고, 날개, 곤충, 혹은 움직이는 무언가의 소리를 떠올리게 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 구스는 이집트 남쪽의 지역을 가리키며, 흔히 누비아나 고대 에티오피아와 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 슬프다
  - 화 있을진저
  - 오
  lexicon: HALOT
  rationale: 히브리어 감탄사 הוֹי는 탄식, 부름, 경고를 모두 띨 수 있으므로, 아직 직접적 책망이 드러나지 않는 여기서는 '아'로 옮겨 감탄의 힘을 살렸습니다.
- source_word: צִלְצַל כְּנָפָיִם
  english_pob_choice: whirring wings
  chosen_korean: 날갯짓하는 소리가 나는
  alternatives_korean:
  - 윙윙거리는
  - 철컹거리는
  - 바스락거리는
  lexicon: HALOT
  rationale: 이 표현은 소리와 움직임이 뒤섞인 난해한 관용구이므로, 특정 이미지(곤충·무기 등)로 좁히지 않고 ‘날갯짓하는 소리’로 음향적 인상을 보존했습니다.
- source_word: מֵעֵבֶר לְנַהֲרֵי
  english_pob_choice: beyond the rivers of
  chosen_korean: 강들 건너편에 있는
  alternatives_korean:
  - 강들을 넘어 있는
  - 강들 너머의
  - 강들 저편에 있는
  lexicon: HALOT
  rationale: מֵעֵבֶר는 ‘건너편/저편’의 위치를 가리키므로, 한국어에서는 자연스러운 지리 표현인 ‘강들 건너편에 있는’으로 옮겼습니다.
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 에티오피아
  - 누비아
  lexicon: HALOT
  rationale: 고유지명은 해석을 덧씌우기보다 음역을 유지하는 것이 원문의 지리적 지시를 가장 정확하게 보존하므로, 전통적 성서 표기인 ‘구스’를 사용했습니다.
theological_decisions:
- issue: 해당 절의 감탄사 הוֹי의 정조
  chosen_reading: ‘아’로 시작해 곧바로 지리적 호칭으로 이어지는 감탄형을 유지했습니다.
  alternative_readings:
  - ‘화 있을진저’로 강한 책망을 드러내는 번역
  - ‘슬프다’로 탄식 중심 번역
  rationale: 이 절은 아직 심판 선언을 노골화하기보다 먼 땅을 부르는 도입부이므로, 과도한 정죄 뉘앙스를 피하면서도 원문의 호소성을 남기는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 문맥이 확정하지 않는 정조를 지나치게 신학화하지 않기'
- issue: כּוּשׁ의 역사적 지시
  chosen_reading: ‘구스’로 음역하여 현대 국가명으로 특정하지 않았습니다.
  alternative_readings:
  - 에티오피아
  - 누비아
  rationale: 원문은 역사적 지명만 제시하므로, 현대 지리·정치적 동일시를 확정하지 않는 것이 주석적 절제에 부합합니다.
  doctrine_reference: '번역 원칙: 고유명사는 가능한 한 음역으로 처리'
