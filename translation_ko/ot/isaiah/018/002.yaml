id: ISA.18.2
reference: Isaiah 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שֹּׁלֵ֨חַ בַּ/יָּ֜ם צִירִ֗ים וּ/בִ/כְלֵי גֹמֶא֮ עַל פְּנֵי מַיִם֒ לְכ֣וּ מַלְאָכִ֣ים קַלִּ֗ים אֶל גּוֹי֙ מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט אֶל עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֚וֹי קַו קָ֣ו וּ/מְבוּסָ֔ה אֲשֶׁר בָּזְא֥וּ נְהָרִ֖ים אַרְצֽ/וֹ־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'sending envoys by sea[a], in papyrus vessels over the surface of the waters: Go, swift messengers, to a nation tall and smooth-skinned, to a people feared far and wide, a nation mighty and trampling down[d][c][b], whose land the rivers divide.'
  footnotes:
  - marker: a
    text: Or "and in boats of reeds/papyrus."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "a nation stretched out and polished"; the phrase likely describes physical appearance.
    reason: lexical_alternative
  - marker: c
    text: Hebrew "a nation of line upon line" or similar; the expression is obscure.
    reason: lexical_alternative
  - marker: d
    text: Or "whose land rivers plunder/spoil."
    reason: lexical_alternative
translation:
  language: ko
  text: 바다로 사절들을 보내는 자여[a], 갈대 배를 타고 물의 표면 위로 보내는 자여. 빠른 사자들아, 가서 키가 크고 피부가 매끈한 민족에게, 멀리까지 두려움의 대상인 백성에게, 명령과 명령의 민족이자 짓밟는 민족에게 가라[c][b][d]. 강들이 그 땅을 가르는 그 민족에게 가라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대/파피루스로 된 배들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘길게 뻗고 닦인’이라는 뜻의 표현으로, 아마도 외형을 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘선 위에 선’ 또는 이와 비슷한 뜻으로, 표현이 분명하지 않습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그 땅을 강들이 약탈/훼손하는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  english_pob_choice: sending
  chosen_korean: 보내는 자여
  alternatives_korean:
  - 보내시는 분이여
  - 파견하는 자여
  lexicon: HALOT
  rationale: 분사구문을 문장 서두의 호칭처럼 살려, 계속되는 파송 행위를 강조했습니다.
- source_word: צִירִים
  english_pob_choice: envoys
  chosen_korean: 사절들
  alternatives_korean:
  - 사자들
  - 외교 사절들
  lexicon: HALOT
  rationale: 국가 간 파송의 뉘앙스를 살리되, 현대 한국어에서 자연스러운 외교적 표현으로 옮겼습니다.
- source_word: וּבִכְלֵי גֹמֶא
  english_pob_choice: in papyrus vessels
  chosen_korean: 갈대 배를 타고
  alternatives_korean:
  - 파피루스 용기 속에
  - 파피루스 배를 타고
  lexicon: HALOT
  rationale: כְלֵי와 גֹמֶא의 결합은 배/선박을 가리키는 것으로 이해되므로, 재료 이미지를 살리면서도 한국어로는 자연스럽게 옮겼습니다.
- source_word: גּוֹי קַו קָו
  english_pob_choice: a nation mighty
  chosen_korean: 명령과 명령의 민족
  alternatives_korean:
  - 선과 선의 민족
  - 강한 민족
  lexicon: HALOT
  rationale: POB의 영어가 본문을 명확히 해석하지 않고 문맥상 난해한 표현을 드러내려는 점을 따라, 히브리어의 반복 표현을 최대한 직접적으로 옮겼습니다.
theological_decisions:
- issue: 가난한 직역과 가독성 사이의 긴장 — קַו קָו의 처리
  chosen_reading: ‘명령과 명령의 민족’으로 옮겨, 본문의 난해함을 완화하지 않고 드러냈습니다.
  alternative_readings:
  - ‘선과 선의 민족’
  - ‘강한 민족’
  rationale: 히브리어 표현은 본문 자체가 모호하므로, 의미를 과도하게 매끈하게 만들기보다 독자가 난해성을 인지하도록 하는 편이 POB의 원칙에 부합합니다.
  doctrine_reference: 본문 의미의 투명성 원칙 및 번역상 난해구 보존
- issue: ‘갈대 배’의 이미지 보존
  chosen_reading: 재료명과 운송수단을 결합한 ‘갈대 배’로 유지했습니다.
  alternative_readings:
  - ‘파피루스 배’
  - ‘갈대로 만든 배’
  rationale: 히브리어의 물질적 이미지를 보존하면서도, 한국어 독자가 장면을 즉시 이해할 수 있게 했습니다.
  doctrine_reference: 원문 이미지 보존과 자연스러운 현대어 번역
