base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'sending envoys by sea[a], in papyrus vessels over the surface of the waters: Go, swift messengers, to a nation tall and smooth-skinned, to a people feared far and wide, a nation mighty and trampling down[d][c][b], whose land the rivers divide.'
  footnotes:
  - marker: a
    text: Or "and in boats of reeds/papyrus."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "a nation stretched out and polished"; the phrase likely describes physical appearance.
    reason: lexical_alternative
  - marker: c
    text: Hebrew "a nation of line upon line" or similar; the expression is obscure.
    reason: lexical_alternative
  - marker: d
    text: Or "whose land rivers plunder/spoil."
    reason: lexical_alternative
translation:
  language: ko
  text: 바다로 사절들을 보내고 파피루스 배를 물 위에 띄우는 자여[a], 빠른 사자들아, 가십시오. 키가 크고 매끈한 피부를 지닌 민족에게[b], 멀리까지 두려움의 대상이 되는 백성에게, 선 위에 선의 민족이자 짓밟는 민족에게[c], 강들이 그 땅을 가르는 민족에게[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대로 만든 배들’ 또는 ‘파피루스로 만든 배들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘길게 뻗고 닦인’이라는 뜻의 표현으로, 아마도 외형을 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘선 위에 선’ 또는 이와 비슷한 뜻으로, 표현의 의미가 분명하지 않습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘강들이 그 땅을 약탈하거나 훼손하는 민족’.
    reason: lexical_alternative
