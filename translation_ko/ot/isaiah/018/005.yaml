  source_fidelity: ‘익은 포도’는 בֹסֶר(아직 익지 않은 포도)의 뜻과 맞지 않으며, ‘꽃송이가’가 포도가 된다는 표현도 원문의 꽃-열매 전환 이미지를 부정확하게 처리합니다. 또한 동작은 예언적 장면에서 미래로 제시하는 것이 적절합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 포도나무의 성장과 가지치기 장면을 자연스럽게 연결합니다. 각주 표지를 해당 어구 바로 뒤에 배치하여 지시 대상도 분명히 했습니다.
  terminology: בֹסֶר는 ‘풋포도’, גֹּמֵל은 ‘익어 가는’으로 옮겼습니다. 희귀한 포도나무 성장부 명사는 본문에서 ‘새가지들’과 ‘뻗은 가지들’로 구분하고, 가능한 대안은 각주에서 보존했습니다. מַזְמֵרוֹת는 ‘전정칼’로 유지했습니다.
