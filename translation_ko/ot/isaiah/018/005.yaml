source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֤י קָצִיר֙ כְּ/תָם פֶּ֔רַח וּ/בֹ֥סֶר גֹּמֵ֖ל יִֽהְיֶ֣ה נִצָּ֑ה וְ/כָרַ֤ת הַ/זַּלְזַלִּים֙ בַּ/מַּזְמֵר֔וֹת וְ/אֶת הַ/נְּטִישׁ֖וֹת הֵסִ֥יר הֵתַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
  footnotes:
  - marker: a
    text: Or 'when the blossom is complete, and the flower becomes an unripe grape.' The Hebrew imagery moves from blossom to developing fruit before harvest.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms for the vine growth here are rare and may also be rendered 'sprigs,' 'tendrils,' or 'trailing branches.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 추수 전에, 꽃이 시들고 꽃송이가 익은 포도가 될 때에, 그가 전정칼로 새가지들을 잘라 내고, 퍼져 나온 가지들을 제거하여 꺾어 버리기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 꽃이 끝나는 장면과, 꽃에서 덜 익은 포도로 넘어가는 장면을 이어서 그립니다.
    reason: source_note
  - marker: b
    text: 여기의 포도나무 가지 관련 표현은 희귀어로, ‘새순’, ‘덩굴’, ‘뻗은 가지들’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לִפְנֵי קָצִיר
  english_pob_choice: For before the harvest
  chosen_korean: 이는 추수 전에
  alternatives_korean:
  - 왜냐하면 추수 전에
  - 추수 전에
  lexicon: HALOT
  rationale: כִּי의 설명적/인과적 기능을 한국어에서 문맥에 맞는 ‘이는’으로 풀고, לִפְנֵי קָצִיר는 자연스러운 현대어로 ‘추수 전에’라고 옮겼습니다.
- source_word: כְּתָם פֶּרַח
  english_pob_choice: when the blossom is finished
  chosen_korean: 꽃이 시들고
  alternatives_korean:
  - 꽃이 다 피고
  - 꽃이 끝나고
  lexicon: HALOT
  rationale: תם의 완료감을 꽃의 생애 주기에 맞게 ‘시들고’로 옮겨, 꽃이 끝나는 시점을 드러냈습니다.
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  english_pob_choice: and the flower becomes a ripening grape
  chosen_korean: 꽃송이가 익은 포도가 될 때에
  alternatives_korean:
  - 풋포도가 익어 갈 때에
  - 꽃이 익어 가는 포도가 될 때에
  lexicon: HALOT
  rationale: בֹסֶר와 גֹּמֵל, נִצָּה가 함께 이루는 포도 성장 이미지를 한국어로 자연스럽게 연결하되, ‘익은 포도’로 성숙 과정을 분명히 했습니다.
- source_word: בַּמַּזְמֵרוֹת וְאֶת הַנְּטִישׁוֹת הֵסִיר הֵתַז
  english_pob_choice: with pruning knives, and he will remove and lop off the spreading branches
  chosen_korean: 전정칼로 새가지들을 잘라 내고, 퍼져 나온 가지들을 제거하여 꺾어 버리기
  alternatives_korean:
  - 가지치기 칼로 새순들을 잘라 내고, 뻗은 가지들을 잘라 버리기
  - 전정용 칼로 새가지들을 잘라 내고, 뻗어 나온 가지들을 쳐 내기
  lexicon: HALOT
  rationale: 두 개의 희귀한 포도나무 용어를 ‘새가지들’과 ‘퍼져 나온 가지들’로 나누어, 절단과 제거의 이중 동작을 한국어에서도 구분해 보존했습니다.
theological_decisions:
- issue: 예언적 미래 시제의 처리
  chosen_reading: 장면의 설명적 예언을 현재적 서술이 아닌 미래 전망으로 옮겨 ‘~할 때에’와 ‘~합니다/합니다’의 흐름을 유지했습니다.
  alternative_readings:
  - 현재형으로 ‘~합니다’라고 평면적으로 서술
  - 완료형으로 ‘~했습니다’라고 옮김
  rationale: 히브리어는 예언적 장면을 묘사하지만, 한국어에서는 독자가 사건의 전개를 따라가도록 미래 지향의 서술이 가장 자연스럽고 원문 의도를 잘 드러냅니다.
  doctrine_reference: 예언 문체와 수사 구조
