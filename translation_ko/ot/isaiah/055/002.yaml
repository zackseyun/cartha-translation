id: ISA.55.2
reference: Isaiah 55:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
  footnotes:
  - marker: a
    text: Or 'spend money'; Hebrew literally 'weigh out silver,' reflecting payment by weight.
    reason: lexical_alternative
  - marker: b
    text: Or 'Listen, listen to me'; the Hebrew intensifies the command by pairing an imperative with an infinitive absolute.
    reason: lexical_alternative
  - marker: c
    text: Or 'let your soul delight itself in fatness' or 'in abundance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너희는 떡이 아닌 것에 은을 달아 내고[a], 너희 수고를 배부르게 하지 못하는 것에 들이십니까? 내 말을 잘 들으십시오.[b] 좋은 것을 먹으십시오. 그러면 너희 자신은 기름진 것으로 즐거워할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈을 쓰고’. 히브리어는 문자적으로 ‘은을 달아 내고’이며, 무게로 값을 치르던 거래 관행을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 명령형과 부정법 절대형을 결합하여 ‘들으라’는 명령을 강하게 강조합니다. 또는 ‘내 말을, 참으로 들으십시오’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘기름짐으로’ 또는 ‘기름진 것으로’. 문맥상 풍성함, 넉넉함, 또는 풍성한 먹을거리를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  english_pob_choice: weigh out silver
  chosen_korean: 은을 달아 주고
  alternatives_korean:
  - 돈을 쓰고
  - 은을 지불하고
  lexicon: HALOT
  rationale: שׁקל의 기본 이미지는 ‘무게로 달다’이므로, 거래 관행을 살린 ‘은을 달아 주고’가 원문의 구체성을 가장 잘 보존합니다.
- source_word: בְּלוֹא לֶחֶם
  english_pob_choice: for what is not bread
  chosen_korean: 떡이 아닌 것에
  alternatives_korean:
  - 떡이 아닌 데에
  - 빵이 아닌 것에
  lexicon: HALOT
  rationale: 히브리어의 부정 명사구를 지나치게 풀지 않고, 실제 양식이 아닌 것을 가리키는 대조를 살려 옮겼습니다.
- source_word: וִיגִיעֲכֶם בְּלוֹא לְשָׂבְעָה
  english_pob_choice: and your labor for what does not satisfy
  chosen_korean: 배부르지 못할 것에 너희 수고를 들이십니까
  alternatives_korean:
  - 만족시키지 못할 것에 너희 수고를 쓰십니까
  - 배부름이 없는 것에 너희 노력을 바치십니까
  lexicon: HALOT
  rationale: יָגִיעַ는 노동의 결과이자 수고를 뜻할 수 있어 ‘수고를 들이다’로 표현해, 소비 대상과 수고의 소모를 함께 드러냈습니다.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  english_pob_choice: Listen carefully
  chosen_korean: 내게 귀를 기울여 들으십시오
  alternatives_korean:
  - 나에게 귀 기울여 들으십시오
  - 내 말을 자세히 들으십시오
  lexicon: HALOT
  rationale: 명령형과 부정법 절대형의 강조를 한국어의 중첩 표현으로 살려, 단순한 청취가 아니라 집중된 경청을 나타냈습니다.
- source_word: וְאִכְלוּ טוֹב
  english_pob_choice: eat what is good
  chosen_korean: 좋은 것을 먹고
  alternatives_korean:
  - 좋은 것을 먹으십시오
  - 좋은 먹을거리를 먹고
  lexicon: HALOT
  rationale: טוֹב의 넓은 의미를 자연스러운 현대 한국어로 옮기되, 단순한 도덕적 추상보다 실제로 먹는 초대를 유지했습니다.
- source_word: בַּדֶּשֶׁן
  english_pob_choice: in richness
  chosen_korean: 기름진 데서
  alternatives_korean:
  - 풍성한 데서
  - 기름짐 속에서
  - 풍요 속에서
  lexicon: HALOT
  rationale: דֶּשֶׁן의 문자적 ‘기름짐/살찜’ 이미지를 살리면서도, 한국어에서 자연스럽고 오해가 적은 표현으로 옮겼습니다.
- source_word: נַפְשְׁכֶם
  english_pob_choice: your soul
  chosen_korean: 너희 영혼
  alternatives_korean:
  - 너희 목숨
  - 너희 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ의 내면적·인격적 의미를 살려 ‘영혼’으로 옮겼으며, 시적 초청의 어조를 유지합니다.
theological_decisions:
- issue: 식사 이미지의 비유성
  chosen_reading: 본문의 빵, 먹음, 배부름 이미지를 영적 설명으로 바꾸지 않고 그대로 유지했습니다.
  alternative_readings:
  - 왜 너희가 진정한 만족을 주지 않는 것에 돈을 씁니까?
  rationale: 히브리어는 실제 양식의 이미지를 통해 하나님의 공급과 만족을 초대하므로, 본문이 허락하는 범위를 넘어 지나치게 영적으로 풀이하지 않았습니다.
  doctrine_reference: '번역 원칙: 원문이 말하는 이미지를 보존하고, 해석을 본문 안에서 과잉 결정하지 않는다.'
