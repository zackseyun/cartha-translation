  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
  footnotes:
  - marker: a
    text: Or 'fir' for 'cypress'; the exact species denoted by Hebrew berosh is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'nettle' or 'bramble' for 'brier'; the exact plant denoted by Hebrew sirpad is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'for a name,' an idiom for renown or memorial.
    reason: lexical_alternative
translation:
  language: ko
  text: 가시덤불 대신에 편백나무가 돋아나고, 찔레 대신에 화석류가 돋아날 것입니다. 그리고 그것이 야훼를 위한 이름이 되어, 영원한 표지가 되어 없어지지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְרֹושׁ의 정확한 수종은 확정하기 어렵습니다. 여기서는 한국어에서 자연스러운 상록수 이미지로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 סִּרְפַּד의 식물 동정은 불확실합니다. 본문은 거친 가시성 식물을 가리키는 대조적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘이름’은 여기서 명성이나 기념을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: instead of
  chosen_korean: ~ 대신에
  alternatives_korean:
  - ~을/를 대신하여
  - ~ 자리에서
  - ~ 아래에
  lexicon: HALOT
  rationale: 이 문맥에서 대조와 교체를 나타내므로, 공간적 의미보다 교체 의미를 살리는 ‘대신에’가 가장 자연스럽습니다.
- source_word: בְרֹושׁ
  english_pob_choice: cypress
  chosen_korean: 편백나무
  alternatives_korean:
