  rationale: 본문의 לְשֵׁם 과 לְאוֹת עוֹלָם 은 단순 장식이 아니라 공개적 증언과 기억의 기능을 함께 지니므로, ‘이름’과 ‘표지’를 함께 살렸습니다.
