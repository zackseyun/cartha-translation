  text: 가시덤불 대신에 잣나무[a]가 돋아나고, 찔레[b] 대신에 화석류가 돋아날 것입니다. 이것이 야훼께 이름[c]이 되고, 영원한 표지가 되어 끊어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשׁ가 가리키는 정확한 수종은 확실하지 않습니다. 노송나무나 전나무로도 옮길 수 있습니다.
