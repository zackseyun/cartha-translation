  - 잣나무
  - 전나무
  lexicon: HALOT
  rationale: 히브리어의 정확한 수종은 불확실하지만, 한국어에서 상록성의 위엄 있는 나무 이미지를 살리기 위해 ‘편백나무’를 택했습니다.
- source_word: סִּרְפַּד
  english_pob_choice: brier
  chosen_korean: 찔레
  alternatives_korean:
  - 가시덤불
  - 쐐기풀
  - 들장미
  lexicon: HALOT
  rationale: 정확한 식물 동정이 불확실한 점을 반영하면서도, 거친 가시성 식물이라는 이미지를 유지하기 위해 ‘찔레’로 옮겼습니다.
- source_word: לְשֵׁם
  english_pob_choice: a name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 기념
  - 평판
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역인 ‘이름’은 ‘명성/기념’의 함의를 담으면서도 본문 구조를 가장 잘 보존합니다.
theological_decisions:
- issue: 야훼의 이름과 표지의 목적
  chosen_reading: 이 변화는 야훼를 위한 ‘이름’과 ‘영원한 표지’로 제시되어, 하나님의 회복 행위가 그분의 명예와 기념을 드러냅니다.
  alternative_readings:
  - 단순히 하나님의 소유물로 보는 읽기
  - ‘이름’을 명성만으로 축소하는 읽기
  rationale: 본문의 לְשֵׁם 과 לְאוֹת עוֹלָם 은 단순 장식이 아니라 공개적 증언과 기억의 기능을 함께 지니므로, ‘이름’과 ‘표지’를 함께 살렸습니다.
  doctrine_reference: Isaiah 55:13의 회복-표지 신학; YHWH의 자기-드러내심
