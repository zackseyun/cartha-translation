id: ISA.55.10
reference: Isaiah 55:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁ֣ר יֵרֵד֩ הַ/גֶּ֨שֶׁם וְ/הַ/שֶּׁ֜לֶג מִן הַ/שָּׁמַ֗יִם וְ/שָׁ֨מָּ/ה֙ לֹ֣א יָשׁ֔וּב כִּ֚י אִם הִרְוָ֣ה אֶת הָ/אָ֔רֶץ וְ/הוֹלִידָ֖/הּ וְ/הִצְמִיחָ֑/הּ וְ/נָ֤תַן זֶ֨רַע֙ לַ/זֹּרֵ֔עַ וְ/לֶ֖חֶם לָ/אֹכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
  footnotes:
  - marker: a
    text: Or 'from the heavens.' The Hebrew שָׁמַיִם is formally plural and can denote 'heaven,' 'the heavens,' or 'the sky' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'made it produce and made it grow.' The paired verbs emphasize the earth's fruitful response to the rain and snow.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 비와 눈이 하늘에서 내려 땅을 적시고, 땅이 열매를 맺고 싹이 나게 하며, 씨 뿌리는 이에게 씨를 주고 먹는 이에게 빵을 주기까지는 그곳으로 돌아가지 않는 것처럼,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  english_pob_choice: For just as
  chosen_korean: 비와 눈이 하늘에서 내렸다가
  alternatives_korean:
  - 이는 곧 비와 눈이 하늘에서 내렸다가
  - 정녕 비와 눈이 하늘에서 내렸다가
  lexicon: HALOT
  rationale: 비교를 여는 כִּי כַּאֲשֶׁר의 설명·비교 기능을 한국어에서는 문맥상 자연스럽게 이어 주는 방식으로 옮겼습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 천상에서
  lexicon: HALOT
  rationale: שָׁמַיִם의 문맥상 자연스러운 표준 한국어로 '하늘에서'를 택해, 고양된 느낌은 살리되 지나치게 종교적 용어화하지 않았습니다.
- source_word: וְהִרְוָה אֶת הָאָרֶץ
  english_pob_choice: they have watered the earth
  chosen_korean: 땅을 적시고
  alternatives_korean:
  - 땅을 물들게 하고
  - 땅에 물을 대고
  lexicon: HALOT
  rationale: רוה의 Hiphil이 가리키는 '충분히 적시다/물주다'의 뜻을 한국어에서는 간결한 동사 '적시다'로 살렸습니다.
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  english_pob_choice: made it bear fruit, and made it sprout
  chosen_korean: 열매를 맺게 하며 싹트게 하고
  alternatives_korean:
  - 열매를 맺게 하고 싹이 나게 하며
  - 열매를 내게 하며 자라게 하고
  lexicon: HALOT
  rationale: 연속된 사역형 두 동사의 농경적 이미지를 유지하면서, '열매를 맺게 하다'와 '싹트게 하다'로 자연스럽고 구체적으로 옮겼습니다.
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ וְלֶחֶם לָאֹכֵל
  english_pob_choice: and have given seed to the sower and bread to the eater
  chosen_korean: 씨 뿌리는 이에게는 씨를, 먹는 이에게는 빵을 주기 전에는
  alternatives_korean:
  - 씨 뿌리는 자에게는 씨를, 먹는 자에게는 빵을 주기 전에는
  - 파종하는 이에게는 씨를, 먹는 이에게는 빵을 주기 전에는
  lexicon: HALOT
  rationale: פַּראַלել리즘을 살리기 위해 'to the sower / to the eater'를 각각 '씨 뿌리는 이 / 먹는 이'로 대응시켰고, לֶחֶם은 기본 의미인 '빵'으로 옮겼습니다.
theological_decisions:
- issue: 비와 눈의 순환이 하나님의 말씀의 효력에 대한 비유라는 점
  chosen_reading: 본문은 자연의 과정 자체를 묘사하지만, 11절의 말씀 성취를 예고하는 비교로 기능하므로 비유적 인과 구조를 유지했습니다.
  alternative_readings:
  - 단순한 자연 묘사로만 처리하는 읽기
  - 말씀의 능력을 노골적으로 설명문처럼 풀어 쓰는 읽기
  rationale: 10절은 11절과 연결되는 비교절이므로, 자연 현상의 묘사를 과도하게 해설하지 않고 비교의 긴장을 남겨 두는 것이 문맥에 충실합니다.
  doctrine_reference: 이사야 55:10-11 문맥
