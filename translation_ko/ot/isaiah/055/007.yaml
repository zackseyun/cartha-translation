revisions:
- from: 악인은 자신의 길을 버리고, 불의한 사람은 자신의 생각을 버리십시오. 그가 야훼께 돌아오면 그분은 그를 불쌍히 여기실 것이며, 우리의 하나님께 돌아오면 그분은 널리 용서하실 것입니다.[a]
  to: 악인은 자기 길을 버리고, 불의한 사람[a]은 자기 생각을 버리십시오. 야훼께, 곧 우리의 하나님께로 돌아오십시오. 그분께서는 그를 불쌍히 여기시고 풍성히 용서하실 것입니다.
  rationale: 원문의 권면형을 한국어 합쇼체 명령형으로 보존했습니다. ‘야훼’와 ‘우리의 하나님’은 동일한 귀환의 대상으로 동격적으로 연결하여, 히브리어의 병렬과 생략된 동사를 자연스럽게 반영했습니다. 하나님의 긍휼과 풍성한 용서라는 결과 약속도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:28Z'
