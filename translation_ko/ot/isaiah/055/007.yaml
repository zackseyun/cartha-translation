source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
  footnotes:
  - marker: a
    text: Or 'the unrighteous man'; Hebrew 'the man of iniquity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let him turn back' or 'repent.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
  - marker: d
    text: Or 'for he will freely forgive.'
    reason: lexical_alternative
  - marker: e
    text: Or 'him, and to our God'.
    reason: previous_rendering
translation:
  language: ko
  text: 악인은 자기 길을 버리고, 불의한 사람[a]은 자기 생각을 버리십시오. 야훼께, 곧 우리의 하나님께로 돌아오십시오. 그분께서는 그를 불쌍히 여기시고 풍성히 용서하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘불의의 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲזֹב / דַּרְכּוֹ
  english_pob_choice: forsake his way
  chosen_korean: 자신의 길을 버리다
  alternatives_korean:
  - 자신의 길을 떠나다
  - 자신의 행실을 버리다
  lexicon: HALOT
  rationale: יַעֲזֹב의 결단적·윤리적 뉘앙스를 살려 ‘버리다’로 옮기고, דַּרְכּוֹ는 삶의 방식 전체를 가리키는 ‘길’로 유지했습니다.
- source_word: רָשָׁע
  english_pob_choice: wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: 히브리어는 단순 형용사보다 실체를 가리키는 명사적 용법이므로, 한국어도 명사형인 ‘악인’으로 처리해 대구를 살렸습니다.
- source_word: אִישׁ אָוֶן / מַחְשְׁבֹתָיו
  english_pob_choice: the man of iniquity / his thoughts
  chosen_korean: 불의한 사람은 자신의 생각을 버리십시오
  alternatives_korean:
  - 죄악의 사람은 그의 생각을 버리십시오
  - 불의한 자는 그의 계획을 버리십시오
  lexicon: HALOT
  rationale: אִישׁ אָוֶן은 도덕적 타락을 가리키는 결합어로 보고 ‘불의한 사람’으로 자연스럽게 옮겼고, מַחְשְׁבֹתָיו는 외적 ‘길’과 대응하는 내적 차원으로서 ‘생각’이 가장 직접적입니다.
- source_word: יְהוָה / אֱלֹהֵינוּ
  english_pob_choice: Yahweh / our God
  chosen_korean: 야훼께 / 우리의 하나님께
  alternatives_korean:
  - 여호와께 / 우리의 하나님께
  - 주께 / 우리의 하나님께
  lexicon: HALOT
  rationale: יהוה는 본문이 지닌 고유명을 살려 ‘야훼’로, אֱלֹהֵינוּ는 공동체적 소유격을 보존해 ‘우리의 하나님’으로 옮겼습니다.
- source_word: וִירַחֲמֵהוּ / יַרְבֶּה לִסְלוֹחַ
  english_pob_choice: he will have compassion on him / he will abundantly pardon
  chosen_korean: 그분은 그를 불쌍히 여기실 것이며 / 그분은 널리 용서하실 것입니다
  alternatives_korean:
  - 그를 긍휼히 여기실 것이며 / 풍성히 용서하실 것입니다
  - 그를 불쌍히 여기시며 / 넘치도록 용서하실 것입니다
  lexicon: HALOT
  rationale: רחם의 정서적·관계적 자비를 ‘불쌍히 여기다’로, רבה의 ‘풍성함’은 한국어에서 자연스러운 ‘널리’로 옮겨 과도한 직역을 피하면서도 풍부한 용서의 뜻을 살렸습니다.
theological_decisions:
- issue: שׁוּב의 번역을 ‘회개하다’로 좁힐지 여부
  chosen_reading: 돌아오다/버리고 돌아오다
  alternative_readings:
  - 회개하다
  - 되돌아오다
  rationale: 본문은 악한 길과 생각을 버리고 야훼께로 돌아오는 관계적 귀환을 강조하므로, 단일한 교리어 ‘회개하다’보다 원문의 비유와 폭을 보존하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 하나님의 고유명을 제목어 ‘주’로 대체하지 않고, POB 원칙에 따라 고유명 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: Contested terms — יהוה YHWH → Yahweh
