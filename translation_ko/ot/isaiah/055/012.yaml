  - severity: medium
    issue: ‘노래하며 터져 나오고’는 한국어에서 부자연스럽고 수식 관계가 불명확합니다.
    rationale: יִפְצְחוּ ... רִנָּה는 ‘기쁨의 노래를 터뜨리다/노래로 터져 나오다’라는 뜻입니다. 목적어를 명시한 표현이 본문의 시적 의미를 더 정확히 전달합니다.
  - severity: low
