  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
  footnotes:
  - marker: a
    text: Or 'be led in peace.' The Hebrew verb means 'be led' or 'be conducted'; 'be led out' is chosen to reflect the parallel with 'you will go out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will burst forth into song before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 기쁨으로 나가며 평강으로 인도받을 것입니다[a]. 산들과 언덕들이 여러분 앞에서 노래하며 터져 나오고[b], 들의 모든 나무가 손뼉을 칠 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평강 가운데 인도받을 것입니다.’ 히브리어 동사는 ‘인도되다’ 또는 ‘호송되다’를 뜻하며, 앞의 ‘나가다’와의 평행을 살리기 위해 이처럼 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 앞에서 노래로 터져 나올 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 여러분은
  alternatives_korean:
  - 이는
  - For
  lexicon: HALOT
  rationale: 문맥상 앞선 약속의 결과를 이어 주는 연결이므로, 한국어에서는 자연스러운 문두 전환으로 처리했습니다.
- source_word: תֵצֵאוּ
  english_pob_choice: you will go out
  chosen_korean: 나가며
  alternatives_korean:
  - 나갈 것입니다
  - 나오며
  lexicon: HALOT
  rationale: 출애굽/귀환 이미지를 살리면서 뒤의 병렬 구문과 맞추기 위해 동작 진행형으로 옮겼습니다.
- source_word: וּבְשָׁלוֹם תּוּבָלוּן
  english_pob_choice: be led in peace
  chosen_korean: 평강으로 인도받을 것입니다
  alternatives_korean:
  - 평강 가운데 인도될 것입니다
  - 평안으로 끌려갈 것입니다
  lexicon: HALOT
  rationale: 이끌림의 수동 의미를 살리되, שָׁלוֹם의 포괄적 의미를 ‘평강’으로 유지했습니다.
- source_word: יִפְצְחוּ ... רִנָּה
  english_pob_choice: will break out in singing
  chosen_korean: 노래하며 터져 나오고
  alternatives_korean:
  - 기뻐 노래하며 터져 나오고
  - 노래로 터져 나오고
  lexicon: HALOT
  rationale: פצח + רנה의 환호성/노래의 폭발적 이미지를 한국어의 자연스러운 동적 표현으로 살렸습니다.
theological_decisions:
- issue: 비인격적 피조물의 의인화
  chosen_reading: 산들과 언덕들과 나무가 실제로 기뻐 반응하는 시적 의인화를 그대로 유지했습니다.
  alternative_readings:
  - 자연의 아름다움을 묘사하는 비의인화로 완화함
  rationale: 본문은 회복의 기쁨에 창조세계가 함께 참여하는 그림을 의도하므로, 의인화를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
