revisions:
- from: 여러분은 기쁨으로 나가며 평강으로 인도받을 것입니다[a]. 산들과 언덕들이 여러분 앞에서 노래하며 터져 나오고[b], 들의 모든 나무가 손뼉을 칠 것입니다.
  to: 이는 여러분이 기쁨으로 나아가고 평안 가운데 인도될 것이기 때문입니다[a]. 산들과 언덕들은 여러분 앞에서 기쁨의 노래를 터뜨리고[b], 들의 모든 나무는 손뼉을 칠 것입니다.
  rationale: 문두의 ‘이는’으로 כִּי의 문맥 연결을 보존하고, 두 미래 동사를 ‘나아가고 … 인도될 것’으로 병렬화했습니다. ‘평안 가운데’는 בְשָׁלוֹם의 상태적 의미를 반영합니다. 산과 언덕의 반응은 ‘기쁨의 노래를 터뜨리다’로 옮겨 히브리 시어의 환희와 의인화를 자연스러운 현대 한국어로 유지했습니다. 각주 a는 본문과 중복되던 대안을 제거하고 동사의 어휘 범위만 간결하게 설명했습니다.
  reviewer_model: gpt-5.6-terra
