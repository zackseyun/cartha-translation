base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
  footnotes:
  - marker: a
    text: Or 'while he is to be found.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 찾으십시오. 그가 만날 수 있을 동안[a] 그에게 부르짖으십시오. 그가 가까이 계실 동안 그에게 부르짖으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 발견되실 동안”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  english_pob_choice: Seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아 구하십시오
  lexicon: HALOT
  rationale: דרש의 명령형은 하나님을 향한 추구와 간구를 뜻하므로, 현대 한국어에서는 짧고 직설적인 ‘찾으십시오’가 권면의 힘을 가장 자연스럽게 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문이 신명기적 고유명사 יהוה를 직접 사용하므로, POB의 원칙에 따라 한국어에서도 тит를 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: קְרָאֻהוּ
  english_pob_choice: call on him
  chosen_korean: 그에게 부르짖으십시오
  alternatives_korean:
  - 그를 부르십시오
  - 그에게 부르세요
  lexicon: HALOT
  rationale: קרא는 여기서 단순 호출보다 하나님께 간구하는 종교적 ‘부르짖음’을 가리키므로, 예배·회개 맥락을 살려 ‘부르짖으십시오’로 옮겼습니다.
- source_word: בְּהִמָּצְאוֹ / בִּהְיוֹתוֹ קָרוֹב
  english_pob_choice: while he may be found / while he is near
  chosen_korean: 그가 만날 수 있을 동안 / 그가 가까이 계실 동안
  alternatives_korean:
  - 그가 발견되실 동안
  - 그가 가까이 계시는 동안
  lexicon: HALOT
  rationale: 두 시간절의 병행을 따라 ‘~할 동안’ 구조를 유지해 긴급한 기회를 드러내되, ‘만날 수 있을’로 זמנ적 가능성과 접근성을 함께 살렸습니다.
theological_decisions:
- issue: 하나님의 이름을 한국어로 어떻게 드러낼지
  chosen_reading: ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - ‘주’를 사용하기
  - ‘여호와’를 사용하기
  rationale: 히브리어 본문은 제목이 아니라 고유명사 יְהוָה를 사용하므로, POB의 공적 규범에 맞춰 대체 호칭 대신 하나님의 이름을 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
