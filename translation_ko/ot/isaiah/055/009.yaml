  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
  footnotes:
  - marker: a
    text: Or 'the skies.' Hebrew שָׁמַיִם is plural in form and often rendered 'heavens.'
    reason: lexical_alternative
  - marker: b
    text: '''Thoughts'' can also mean ''plans'' or ''intentions'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘이 땅보다 높듯이, 내 길들은 너희의 길들보다 높고 내 생각들은 너희의 생각들보다 높습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '하늘들'은 복수형이지만, 한국어에서는 통상 '하늘'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''생각들''은 이 문맥에서 ''계획들'' 또는 ''의도들''을 뜻할 수도 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞절의 설명을 잇는 접속사이지만, 한국어에서는 문맥상 자연스러운 진술로 시작하는 편이 더 매끄러워 별도 대응어를 두지 않았습니다.
- source_word: גָבְהוּ שָׁמַיִם מֵ/אָ֑רֶץ
  english_pob_choice: the heavens are higher than the earth
  chosen_korean: 하늘이 땅보다 높다
  alternatives_korean:
  - 하늘들이 땅보다 높다
  - 하늘들이 땅 위에 있다
  lexicon: HALOT
  rationale: 히브리어 비교 구문을 한국어의 자연스러운 비교로 옮기되, 'heavens'의 복수형은 관용적으로 '하늘'로 처리해 시적 진술을 살렸습니다.
- source_word: דְרָכַ/י
  english_pob_choice: my ways
  chosen_korean: 내 길들
  alternatives_korean:
  - 내 방식들
  - 내 행하심
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 용법을 살려 '길'로 옮겼고, 앞뒤 병렬과 비교를 분명히 하기 위해 복수성을 반영했습니다.
- source_word: מַחְשְׁבֹתַ/י
  english_pob_choice: my thoughts
  chosen_korean: 내 생각들
  alternatives_korean:
  - 내 계획들
  - 내 뜻들
  lexicon: HALOT
  rationale: 이 문맥에서는 '생각들'이 원문의 폭넓은 의미(생각, 계획, 의도)를 가장 덜 좁히면서 보존합니다.
theological_decisions:
- issue: 하나님의 초월성을 과도하게 풀이하지 않고 시적 비교로 유지할지 여부
  chosen_reading: 하나님의 '길'과 '생각'을 그대로 유지하여 인간의 인식과 행위의 한계를 대조하는 시적 긴장을 보존했습니다.
  alternative_readings:
  - 내 행하시는 방식
  - 내 계획과 뜻
  rationale: 원문은 비유를 해설하기보다 비교를 통해 초월성을 드러냅니다. 따라서 의미를 좁혀 설명하기보다 원문의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it.'
