id: ISA.55.11
reference: Isaiah 55:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֣ן יִֽהְיֶ֤ה דְבָרִ/י֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/פִּ֔/י לֹֽא יָשׁ֥וּב אֵלַ֖/י רֵיקָ֑ם כִּ֤י אִם עָשָׂה֙ אֶת אֲשֶׁ֣ר חָפַ֔צְתִּי וְ/הִצְלִ֖יחַ אֲשֶׁ֥ר שְׁלַחְתִּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
  footnotes:
  - marker: a
    text: Or 'void.' The Hebrew means 'empty, without result.'
    reason: lexical_alternative
  - marker: b
    text: Or 'prosper in that for which I sent it.'
    reason: lexical_alternative
  - marker: c
    text: Or 'so my word that goes out from my mouth will be:'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 입에서 나가는 내 말도 그와 같을 것입니다.[c] 그것은 헛되이[a] 내게로 돌아오지 않고, 내가 원하는 것을 이루며, 내가 그것을 보낸 목적을 이루어 낼 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛되이’는 히브리어 רֵיקָם의 ‘비어 있게, 아무 결과 없이’라는 뜻을 자연스럽게 옮긴 것입니다. ‘공허하게’ 또는 ‘빈손으로’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 그것을 보낸 목적을 이루어 낼 것입니다’는 ‘내가 그것을 보낸 바에서 성공할 것이다’라는 히브리어의 압축된 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 문장 구조상 ‘내 입에서 나가는 내 말이 그와 같을 것입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: so
  chosen_korean: 그와 같습니다
  alternatives_korean:
  - 그처럼입니다
  - 이와 같이 됩니다
  lexicon: HALOT
  rationale: 앞 절의 비와 눈의 비유와 연결되는 비교적 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: דְבָרִי
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 이야기
  lexicon: HALOT
  rationale: 하나님의 발화와 선언을 가리키므로, 장중한 '말씀'도 가능하지만 여기서는 맥락의 직접적인 발화를 드러내는 '내 말'이 source-direct합니다.
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  english_pob_choice: it will not return to me empty
  chosen_korean: 헛되이 내게로 돌아오지 않고
  alternatives_korean:
  - 빈손으로 내게 돌아오지 않고
  - 공허하게 내게 돌아오지 않고
  lexicon: HALOT
  rationale: '''רֵיקָם''의 핵심은 결과 없이 돌아오지 않는다는 뜻이므로, 한국어에서는 ''헛되이''가 의미를 정확하고 간결하게 전달합니다.'
- source_word: עָשָׂה ... וְהִצְלִיחַ
  english_pob_choice: it will accomplish ... and succeed
  chosen_korean: 이루며 ... 성취합니다
  alternatives_korean:
  - 성공하며 ... 번성합니다
  - 행하며 ... 형통합니다
  lexicon: HALOT
  rationale: 동사의 결과적·효과적 의미를 살리되, 물질적 번영 뉘앙스가 강한 '형통'은 피하고 목적 달성의 뜻을 분명히 했습니다.
- source_word: אֲשֶׁר חָפַצְתִּי
  english_pob_choice: what I desire
  chosen_korean: 내가 기뻐하는 것
  alternatives_korean:
  - 내가 원하는 것
  - 내가 뜻하는 것
  lexicon: HALOT
  rationale: '''חפץ''는 원함/기쁨/즐거움을 포함하므로, 문맥상 하나님의 의지와 만족을 함께 드러내는 ''기뻐하는 것''이 적절합니다.'
theological_decisions:
- issue: 하나님의 말씀의 인격화 과도화 여부
  chosen_reading: '''내 말''은 하나님의 선포된 말씀과 효력을 가리키는 것으로 옮기고, 별도의 인격적 칭호로 확장하지 않았습니다.'
  alternative_readings:
  - 로고스적 함의를 강하게 드러내는 번역
  - 메시아적/그리스도론적 해석을 본문에 직접 반영하는 번역
  rationale: 본문의 즉각적 초점은 말씀의 효력과 성취에 있으며, 히브리어 자체가 여기서 인격적 실체화를 요구하지는 않습니다.
  doctrine_reference: 번역 원칙 1, 3
- issue: '''헛되이''와 ''이루며/성취합니다''의 동시 보존'
  chosen_reading: 말씀의 무효 반환 부정과, 하나님의 뜻의 실제 성취를 함께 드러냈습니다.
  alternative_readings:
  - 더 교리적으로 강한 예정 언어를 추가하는 번역
  - 단순히 '잘 될 것입니다'로 완화하는 번역
  rationale: 본문은 말씀의 목적 달성과 성공을 분명히 말하지만, 특정 교단식 용어로 확장하거나 약화할 이유가 없습니다.
  doctrine_reference: 이사야 55:11 본문 맥락
