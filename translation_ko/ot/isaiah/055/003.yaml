id: ISA.55.3
reference: Isaiah 55:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
  footnotes:
  - marker: a
    text: Or, 'the sure mercies of David' / 'the steadfast love promised to David.' The Hebrew phrase can be rendered in several ways because חֶסֶד carries senses such as covenant love, kindness, or mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 귀를 기울이고 내게로 오십시오. 들으십시오. 그리하면 당신의 혼이 살 것입니다. 내가 당신들과 영원한 언약을 맺겠습니다 — 곧 다윗에게 약속된 신실한 사랑입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에게 약속된 확실한 인자’ / ‘다윗에게 약속된 변함없는 사랑’으로 옮길 수 있습니다. 히브리어 חֶסֶד는 언약 사랑, 친절, 자비의 뜻을 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  english_pob_choice: Incline your ear
  chosen_korean: 귀를 기울이고
  alternatives_korean:
  - 귀를 돌리고
  - 귀를 숙이고
  - 귀를 내십시오
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 히브리어 관용구의 자세한 듣기, 주의 깊은 수용을 자연스럽게 살리면서도 현대 한국어에서 가장 직관적입니다.
- source_word: וּלְכוּ אֵלַי
  english_pob_choice: come to me
  chosen_korean: 내게로 오십시오
  alternatives_korean:
  - 내게로 가십시오
  - 내게 나오십시오
  lexicon: HALOT
  rationale: 말하는 이의 초대라는 방향성을 살려 ‘오다’로 옮겼고, 합쇼체 명령형으로 초청의 어조를 유지했습니다.
- source_word: נַפְשְׁכֶם
  english_pob_choice: your soul
  chosen_korean: 당신의 혼
  alternatives_korean:
  - 당신의 생명
  - 당신 자신
  lexicon: HALOT
  rationale: נפש의 의미 범위는 넓지만, 이 절에서는 ‘살다’와 연결된 전인적 생명/자아를 드러내므로 ‘혼’이 원문 어휘의 장중함을 비교적 잘 보존합니다.
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  english_pob_choice: the faithful covenant love promised to David
  chosen_korean: 다윗에게 약속된 신실한 사랑
  alternatives_korean:
  - 다윗에게 베풀어진 신실한 언약의 사랑
  - 다윗에게 약속된 변함없는 인자
  lexicon: HALOT
  rationale: חסד는 단일어로 옮기기 어려운 언약적 사랑/인자/은혜의 결합 의미를 가지므로, 문맥상 가장 투명하게 ‘신실한 사랑’으로 풀고 ‘약속된’으로 다윗 언약의 보증성을 살렸습니다.
theological_decisions:
- issue: ‘영원한 언약’과 ‘다윗에게 약속된 신실한 사랑’의 관계
  chosen_reading: 본문은 새 언약의 초청을 다윗 언약의 신실한 약속과 연결해 제시합니다.
  alternative_readings:
  - 다윗이 하나님께 보인 신실함
  - 다윗에게 주어진 자비의 행위들
  rationale: 문맥상 하나님이 청자에게 영원한 언약을 맺겠다고 선언하므로, ‘다윗에게 약속된 신실한 사랑’은 다윗 언약의 확실한 복을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 원문 우선 및 언약 연속성 보존
