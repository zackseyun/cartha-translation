revisions:
- from: 귀를 기울이고 내게로 오십시오. 들으십시오. 그리하면 당신의 혼이 살 것입니다. 내가 당신들과 영원한 언약을 맺겠습니다 — 곧 다윗에게 약속된 신실한 사랑입니다.[a]
  to: 귀를 기울이고 내게로 오십시오. 들으십시오. 그러면 여러분이 살 것입니다. 내가 여러분과 영원한 언약을 맺겠습니다—곧 다윗에게 베푸신 변함없는 사랑입니다.[a]
  rationale: 현대 합쇼체의 자연스러운 복수 호칭으로 정비하고, נֶפֶשׁ의 전인적 의미를 ‘여러분이 살 것입니다’로 옮겼습니다. 다윗과 관련된 חַסְדֵי의 구성 관계 및 ‘약속’의 함의에는 논의의 여지가 있으므로, 본문에서는 문맥상 하나님의 은총을 직접적으로 표현하고 대안적 해석은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:25Z'
review_pass:
