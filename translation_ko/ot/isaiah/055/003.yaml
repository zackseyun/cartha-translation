  source_fidelity: 핵심 구조(귀를 기울임—하나님께 나아옴—들음—삶—영원한 언약)는 충실히 반영했습니다. 그러나 נֶפֶשׁ를 ‘혼’으로 옮긴 것은 현대 표준 한국어에서 부자연스럽고, 히브리어의 전인적 생명이라는 의미를 불필요하게 실체론적으로 좁힐 수 있습니다. 또한 ‘약속된’은 문맥상 가능한 해석이나 히브리어 본문에 명시된 말은 아니므로, 본문에서는 더 직접적으로 ‘다윗에게 베푸신’으로 표현하고 각주에서 대안을 보존하는 편이 안전합니다.
  naturalness: ‘당신의 혼’과 ‘당신들과’는 현대 한국어 성경 문체에서 어색합니다. 청자 복수에는 ‘여러분’과 ‘여러분과’가 자연스럽습니다. ‘여러분이 살 것입니다’는 נֶפֶשׁ의 문맥적 의미를 자연스럽게 전달합니다.
  terminology: ‘영원한 언약’은 적절합니다. חַסְדֵי는 문맥상 하나님의 지속적 은총/인애를 가리키므로 ‘변함없는 사랑’이 현대어로 자연스럽습니다. 다만 이 표현의 번역 가능성은 넓으므로 각주에서 ‘확실한 인자/은총’ 및 ‘다윗에게 약속된’ 해석을 밝혀야 합니다.
