  to: 나는 포도주 틀을 홀로 밟았습니다[a]. 민족들 중에는 나와 함께한 사람이 아무도 없었습니다. 나는 내 분노로 그들을 밟았고 내 진노로 그들을 짓밟았습니다. 그들의 피가 내 옷에 튀었고[b], 나는 내 모든 옷을 더럽혔습니다.
