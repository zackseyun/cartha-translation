  source_fidelity: 히브리어의 반복되는 ‘밟다’ 이미지, 분노와 진노의 병행, 그리고 단독 심판의 진술은 대체로 잘 보존되었습니다. 다만 וּמֵעַמִּים은 ‘민족들 가운데서’보다 ‘민족들 중에는/민족들 중에서’가 문맥상 더 자연스럽고, נִצְחָם의 포도즙/피의 중의성은 비문에 가까운 ‘생명력 있는 피’보다 본문과 각주로 처리하는 편이 정확합니다.
  naturalness: ‘포도즙틀’, ‘생명력 있는 피’, ‘모든 겉옷’은 현대 표준 한국어 성경 문체에서 다소 어색합니다. ‘포도주 틀’, ‘그들의 피’, ‘모든 옷’으로 고치면 자연스럽고 원문의 시적·격정적 어조도 유지됩니다.
  terminology: פּוּרָה는 한국어 성경 문체상 ‘포도주 틀’이 적절합니다. נִצְחָם은 피와 포도즙의 이미지를 겹치게 하는 말이므로 본문은 심판 문맥에 맞게 ‘피’로 번역하고, 각주에서 ‘즙’ 가능성과 중의성을 밝혀야 합니다. אִישׁ은 한국어 본문에서 ‘사람’으로 자연스럽게 옮길 수 있으나, 각주에서 문자적으로 남성 단수임을 밝혀야 합니다.
