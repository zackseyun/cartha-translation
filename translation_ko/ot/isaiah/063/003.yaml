reference: Isaiah 63:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פּוּרָ֣ה דָּרַ֣כְתִּי לְ/בַדִּ֗/י וּ/מֵֽ/עַמִּים֙ אֵֽין אִ֣ישׁ אִתִּ֔/י וְ/אֶדְרְכֵ֣/ם בְּ/אַפִּ֔/י וְ/אֶרְמְסֵ֖/ם בַּ/חֲמָתִ֑/י וְ/יֵ֤ז נִצְחָ/ם֙ עַל בְּגָדַ֔/י וְ/כָל מַלְבּוּשַׁ֖/י אֶגְאָֽלְתִּי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
  footnotes:
  - marker: a
    text: Or 'no one was with me.' The Hebrew reads 'no man was with me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their blood.' The Hebrew term may evoke the flow of grape juice in the winepress image while referring to the blood of those judged.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 포도주 틀을 홀로 밟았습니다[a]. 민족들 중에는 나와 함께한 사람이 아무도 없었습니다. 나는 내 분노로 그들을 밟았고 내 진노로 그들을 짓밟았습니다. 그들의 피가 내 옷에 튀었고[b], 나는 내 모든 옷을 더럽혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 함께한 사람 없이.’ 히브리어는 문자적으로 ‘민족들 중에서 나와 함께한 남자가 없었다’라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 즙.’ 이 말은 포도주 틀에서 튀는 포도즙의 이미지를 불러일으키면서, 동시에 심판받는 자들의 피를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוּרָה
  english_pob_choice: the winepress
  chosen_korean: 포도즙틀
  alternatives_korean:
  - 포도주틀
  - 포도압착기
  - 포도즙틀
  lexicon: HALOT
  rationale: פּוּרָה는 포도를 밟는 틀/압착 장치를 가리키므로, ‘포도즙틀’이 원문의 이미지와 심판 비유를 가장 직접적으로 살립니다.
- source_word: לְבַדִּי
  english_pob_choice: alone
  chosen_korean: 홀로
  alternatives_korean:
  - 혼자
  - 단독으로
  lexicon: HALOT
  rationale: 혼자 행동하는 고립성을 간결하고 자연스러운 한국어로 드러내기 위해 ‘홀로’를 택했습니다.
- source_word: אִישׁ
  english_pob_choice: no man was with me
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 아무도
  lexicon: HALOT
  rationale: 본문의 אָישׁ은 남성 단수지만, 한국어에서는 ‘사람’으로 옮겨 ‘남자’라는 성별 어감을 과도하게 부각하지 않으면서도 1인칭 고립을 유지했습니다. 본문은 ‘아무도’로 재진술했고, 각주로 남성형의 직역 가능성을 남겼습니다.
- source_word: בְּאַפִּי / בַּחֲמָתִי
  english_pob_choice: in my anger / in my wrath
  chosen_korean: 내 분노 / 내 진노
  alternatives_korean:
  - 내 노 / 내 격노
  - 내 화 / 내 격분
  lexicon: HALOT
  rationale: אַף와 חֵמָה의 강도 차이를 살리기 위해 앞은 ‘분노’, 뒤는 더 강한 ‘진노’로 구분했습니다. 이는 영어 POB의 ‘anger / wrath’ 대비를 한국어에서도 보존합니다.
- source_word: נִצְחָם
  english_pob_choice: their lifeblood
  chosen_korean: 생명력 있는 피
  alternatives_korean:
  - 그들의 피
  - 그들의 생명 피
  - 그들의 붉은 즙
  lexicon: HALOT
  rationale: 포도즙 비유와 피의 심판 이미지를 함께 살리기 위해, 단순한 ‘피’보다 메타포적 중첩을 드러내는 ‘생명력 있는 피’를 택했습니다.
theological_decisions:
- issue: 야훼의 단독 심판과 격렬한 포도즙틀 이미지
  chosen_reading: 하나님의 단독 심판 행위를 약화하지 않고, 1인칭의 격렬한 포도즙틀 비유를 그대로 유지했습니다.
  alternative_readings:
  - 은유를 완화해 단순한 승리 장면으로 읽기
  - 분노 표현을 더 중립적인 판결 언어로 바꾸기
  rationale: 히브리어는 야훼의 홀로 행하시는 심판을 매우 구체적이고 폭력적인 이미지로 제시합니다. 번역은 이 긴장을 누그러뜨리지 않고 보존합니다.
  doctrine_reference: 심판과 진노의 긴장을 해소하지 않고 보존
