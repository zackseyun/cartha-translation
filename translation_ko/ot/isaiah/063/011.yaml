id: ISA.63.11
reference: Isaiah 63:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
  footnotes:
  - marker: a
    text: Hebrew 'with the shepherds of his flock'; some read 'with the shepherd of his flock,' likely referring to Moses.
    reason: alternative_reading
  - marker: b
    text: Or 'within them' or 'in the midst of them.' The Hebrew has a singular suffix ('within him'), but its referent is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 그분께서 모세와 그분의 백성의 옛날을 기억하셨습니다. “그의 양 떼의 목자들과 함께 그들을 바다에서 이끌어 내신 분은 어디 계십니까?” “그분의 성령을 그의 안에 두신 분은 어디 계십니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 양 떼의 목자들’로 복수형입니다. 그러나 일부는 문맥상 모세를 가리키는 단수 ‘그의 양 떼의 목자’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그의 안에’라는 단수 접미사를 사용합니다. 그 지시 대상은 논쟁적이며, ‘그들 안에’ 또는 ‘그들 가운데’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר / Then he remembered
  english_pob_choice: Then he remembered the ancient days
  chosen_korean: 그때에 그는 … 기억하셨습니다
  alternatives_korean:
  - 그리고 그는 … 기억하셨습니다
  - 그는 … 기억하셨습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 이어지는 탄식문으로 넘어가는 전환을 ‘그때에’로 나타냈습니다.
- source_word: יְמֵי עוֹלָם / the ancient days
  english_pob_choice: the ancient days
  chosen_korean: 옛날
  alternatives_korean:
  - 옛적
  - 태고의 날들
  lexicon: HALOT
  rationale: ‘오래전’이 아니라 구원 역사상의 먼 과거를 가리키는 관용을 간결하게 살렸습니다.
- source_word: מֹשֶׁה עַמּוֹ / Moses and his people
  english_pob_choice: Moses and his people
  chosen_korean: 모세와 그의 백성의 날들
  alternatives_korean:
  - 모세와 그의 백성
  - 모세, 곧 그의 백성
  lexicon: HALOT
  rationale: 히브리어의 압축된 결합을 한국어에서는 ‘날들’에 걸어 자연스럽게 풀되, 모세와 백성이 함께 회상되는 점을 반영했습니다.
- source_word: אֵת רֹעֵי צֹאנֹו / with the shepherds of his flock
  english_pob_choice: with the shepherds of his flock
  chosen_korean: 그의 양 떼의 목자들과 함께한 이가
  alternatives_korean:
  - 그의 양 떼의 목자와 함께한 이가
  - 그의 양 떼의 목자들과 함께한 자가
  lexicon: HALOT
  rationale: MT의 복수형 ‘목자들’을 본문에 유지했습니다. 다만 문맥상 모세를 가리키는 단수 이해가 가능하므로, ‘함께한 이’로 대상의 성격을 살렸습니다.
- source_word: רוּחַ קָדְשׁוֹ / his Holy Spirit
  english_pob_choice: his Holy Spirit
  chosen_korean: 자기의 거룩한 영
  alternatives_korean:
  - 자기의 성령
  - 그의 거룩한 영
  lexicon: HALOT
  rationale: 이사야 문맥에서 신적 ‘영’을 가리키지만, 본문 자체의 표현을 따라 ‘영’으로 두어 성령 용어를 과도하게 단정하지 않았습니다.
theological_decisions:
- issue: ‘within him’의 지시 대상
  chosen_reading: ‘그들 가운데’로 옮겨, 히브리어의 단수 소유격이 가리킬 수 있는 집단적/개인적 긴장을 열어 두었습니다.
  alternative_readings:
  - 그의 안에
  - 그들 안에
  rationale: 히브리어는 단수형이지만 지시 대상이 모세인지, 백성인지, 또는 그들 가운데인지가 분명하지 않습니다. 한국어에서는 문맥상 가능한 넓이를 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
- issue: 구약의 ‘영’ 표현을 성령으로 단정할지 여부
  chosen_reading: 본문에서는 ‘거룩한 영’으로 두고, 문맥상 하나님의 영을 가리키는 표현임을 살렸습니다.
  alternative_readings:
  - 성령
  - 거룩하신 영
  rationale: 이사야의 용례는 분명히 신적 영을 가리키지만, 한국어 전통어인 ‘성령’을 자동 대입하기보다 원문 표현의 밀도를 유지하는 편이 더 직접적입니다.
  doctrine_reference: Source-first rendering of divine-spirit language in Isaiah
