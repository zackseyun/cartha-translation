revisions:
- from: 그때에 그는 옛날 곧 모세와 그의 백성의 날들을 기억하셨습니다. “그들을 바다에서 올라오게 한 이가 어디 있습니까? 그의 양 떼의 목자들과 함께한 이가 어디 있습니까? 그분이 자기의 거룩한 영을 그들 가운데 두신 이가 어디 있습니까?”[a][b]
  to: 그때에 그분께서 모세와 그분의 백성의 옛날을 기억하셨습니다. “그의 양 떼의 목자들과 함께 그들을 바다에서 이끌어 내신 분은 어디 계십니까?” “그분의 성령을 그의 안에 두신 분은 어디 계십니까?”[a][b]
  rationale: 개정문은 ‘옛날/모세와 그분의 백성’이라는 압축된 히브리어 구문을 과도하게 해석하지 않고 유지했습니다. ‘목자들’의 복수형과 ‘그의 안에’의 단수형을 각각 본문에 보존했으며, 실제로 논쟁적인 대안은 해당 어구에 연결된 각주로 제시했습니다. 또한 두 אַיֵּה 질문의 수사적 현재를 한국어의 ‘어디 계십니까?’로 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:27Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 MT의 복수형 ‘목자들’을 반영했지만, בְּקִרְבּוֹ의 단수 접미사를 본문에서 ‘그들 가운데’로 바꾸어 원문의 형태와 영어 POB의 보존 원칙을 따르지 않았습니다. 또한 ‘바다에서 올라오게 한 이’와 ‘목자들과 함께한 이’를 별도 질문으로 나누어, 원문의 ‘목자들과 함께 그들을 바다에서 이끌어 올린 이’라는 결합을 흐렸습니다.
  naturalness: ‘그는 … 기억하셨습니다’는 대명사와 높임 종결이 어울리지 않으며, 마지막 질문의 ‘그분이 … 두신 이가 어디 있습니까?’는 중복되고 부자연스럽습니다. 존칭을 일관되게 적용한 ‘그분께서’ 및 ‘어디 계십니까?’가 현대 표준어 합쇼체에 더 자연스럽습니다.
  terminology: רוּחַ קָדְשׁוֹ는 이사야 63:10과 연결되는 표지된 신적 표현이므로 한국어 성경 용례와 영어 POB의 ‘Holy Spirit’에 맞추어 ‘그분의 성령’으로 옮겼습니다. 모세 및 양 떼의 목자들에 관한 본문과 주석은 MT의 복수형을 유지합니다.
  issues:
