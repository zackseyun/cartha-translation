base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
  footnotes:
  - marker: a
    text: Or 'the year of my redeemed ones had come.' The Hebrew may be understood either as the time of the speaker's redeeming action or as the time concerning those he redeems.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 보복의 날이 내 마음에 있었고, 내 구속[a]의 해가 이르렀기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 구속한 자들의 해가 이르렀다’로도 이해할 수 있습니다. 히브리어는 화자의 구속 행위의 때를 가리킬 수도 있고, 그가 구속한 사람들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 연결을 한국어에서는 자연스러운 설명형 종결로 옮기되, 원문의 인과 관계를 유지했습니다.
- source_word: יוֹם נָקָם
  english_pob_choice: the day of vengeance
  chosen_korean: 보복의 날
  alternatives_korean:
  - 복수의 날
  - 징벌의 날
  lexicon: HALOT
  rationale: נָקָם은 개인적 복수보다 공적·사법적 응징의 뉘앙스가 강해, 직역적이면서도 현대 한국어에서 가장 가까운 ‘보복’으로 옮겼습니다.
- source_word: בְּלִבִּי
  english_pob_choice: in my heart
  chosen_korean: 내 마음에
  alternatives_korean:
  - 내 심중에
  - 내 마음속에
  lexicon: HALOT
  rationale: 히브리어의 내적 의도·결심을 나타내는 관용구를 자연스러운 현대 한국어 표현으로 살렸습니다.
- source_word: גְּאוּלַי
  english_pob_choice: my redemption
  chosen_korean: 내 구속
  alternatives_korean:
  - 내 구속받은 자들
  - 내가 구속할 자들
  - 내 속량
  lexicon: HALOT
  rationale: 주어의 구원 행위와 그 결과를 함께 열어 두는 추상명사로 처리하여, 본문의 심판과 구원의 대구를 유지했습니다.
theological_decisions:
- issue: גְּאוּלַי의 의미를 ‘구속의 해’로 둘지, ‘구속받은 자들’로 구체화할지
  chosen_reading: 내 구속의 해
  alternative_readings:
  - 내 구속받은 자들의 해
  - 내가 구속한 자들의 해
  rationale: 문맥상 ‘보복의 날’과 병렬을 이루는 것은 사람 집단보다 사건/시기이므로, ‘구속’이라는 추상적 표현을 유지해 심판과 구원의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
