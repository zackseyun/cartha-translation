base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
  footnotes:
  - marker: a
    text: Or 'the year of my redeemed ones had come.' The Hebrew may be understood either as the time of the speaker's redeeming action or as the time concerning those he redeems.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 보복의 날이 내 마음에 있고, 내 구속의 해가 이르렀기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 구속받은 자들의 해가 이르렀다’로도 이해할 수 있습니다. 히브리어는 구속 행위의 때일 수도 있고, 구속받는 사람들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 연결을 한국어에서는 자연스러운 설명형 종결로 옮기되, 원문의 인과 관계를 유지했습니다.
- source_word: יוֹם נָקָם
  english_pob_choice: the day of vengeance
