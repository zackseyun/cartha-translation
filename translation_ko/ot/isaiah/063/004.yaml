  lexicon: HALOT
  rationale: נָקָם은 개인적 복수보다 공적·사법적 응징의 뉘앙스가 강해, 직역적이면서도 현대 한국어에서 가장 가까운 ‘보복’으로 옮겼습니다.
- source_word: בְּלִבִּי
  english_pob_choice: in my heart
  chosen_korean: 내 마음에
  alternatives_korean:
  - 내 심중에
  - 내 마음속에
  lexicon: HALOT
  rationale: 히브리어의 내적 의도·결심을 나타내는 관용구를 자연스러운 현대 한국어 표현으로 살렸습니다.
- source_word: גְּאוּלַי
  english_pob_choice: my redemption
  chosen_korean: 내 구속
