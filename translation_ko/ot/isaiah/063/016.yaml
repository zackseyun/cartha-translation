revisions:
- from: 이는 주께서 우리의 아버지이시기 때문입니다. 아브라함은 우리를 알지 못하고 이스라엘은 우리를 인정하지 않더라도, 주님, 주께서는 우리의 아버지이시며 옛부터 우리를 속량하시는 이십니다. 주님의 이름은 영원부터 그러합니다.[a][b]
  to: 이는 주께서 우리의 아버지이시기 때문입니다. 아브라함이 우리를 알지 못하고 이스라엘[b]이 우리를 인정하지 않아도, 야훼여, 주께서는 우리의 아버지이십니다. 예로부터 ‘우리의 구속자’가 주님의 이름입니다.[a]
  rationale: 신명 יְהוָה를 ‘야훼’로 회복하고, 마지막 히브리어 명사절을 한국어에서 명료한 인용 술어 구문으로 재구성했습니다. מֵעוֹלָם은 본문에서 ‘예로부터’로 유지하고 ‘영원부터’는 대안 번역으로 각주에 보존했습니다. 족장 야곱을 뜻하는 ‘이스라엘’ 설명도 해당 위치의 각주로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:25Z'
