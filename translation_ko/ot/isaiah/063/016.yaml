  verdict: revise
  source_fidelity: 개정이 필요합니다. יְהוָה는 영어 POB 방침 및 제공된 신학 용례에 따라 ‘야훼’로 옮겨야 하며, גֹּאֲלֵנוּ מֵעוֹלָם שְׁמֶךָ의 술어 관계도 ‘우리의 속량하시는 이십니다’와 ‘그러합니다’로 분리하지 않고 ‘예로부터 … 주님의 이름입니다’로 보존하는 편이 원문에 더 충실합니다.
  naturalness: 원안의 ‘주님의 이름은 영원부터 그러합니다’는 현대 한국어에서 무엇을 가리키는지 불명확하고 자연스럽지 않습니다. ‘예로부터 “우리의 구속자”가 주님의 이름입니다’는 히브리어의 명사절을 명료하게 재현하면서도 합쇼체에 맞습니다.
  terminology: אָבִינוּ는 ‘우리의 아버지’, ידע/נכר는 ‘알지 못하다/인정하지 않다’로 적절히 구별했습니다. גֹּאֲלֵנוּ는 한국어 성경 용례와 자연스러움을 고려해 ‘우리의 구속자’로 옮겼습니다. יְהוָה는 ‘야훼’로 일관되게 표기했습니다.
  issues:
