id: ISA.63.16
reference: Isaiah 63:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
  footnotes:
  - marker: a
    text: Or, “our Redeemer from everlasting is your name.”
    reason: alternative_reading
  - marker: b
    text: “Israel” here likely refers to Jacob, the patriarch, parallel to Abraham.
    reason: cross_reference
translation:
  language: ko
  text: 이는 주께서 우리의 아버지이시기 때문입니다. 아브라함이 우리를 알지 못하고 이스라엘[b]이 우리를 인정하지 않아도, 야훼여, 주께서는 우리의 아버지이십니다. 예로부터 ‘우리의 구속자’가 주님의 이름입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영원부터 ‘우리의 구속자’가 주님의 이름입니다.”
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘이스라엘’은 아브라함과 병행되는 족장 야곱을 가리킬 가능성이 높습니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי / אָבִינוּ
  english_pob_choice: For you are our Father
  chosen_korean: 이는 주께서 우리의 아버지이시기 때문입니다
  alternatives_korean:
  - 왜냐하면 주께서는 우리의 아버지이십니다
  - 주께서는 우리의 아버지이십니다
  lexicon: HALOT
  rationale: כִּי의 설명·근거 기능을 살려 앞절의 간구를 뒷받침하는 이유로 옮겼고, אָבִינוּ는 혈연적 '조상'보다 언약적·관계적 호칭인 '아버지'를 유지했습니다.
- source_word: יְדָעָנוּ / יַכִּירָנוּ
  english_pob_choice: does not know us / does not acknowledge us
  chosen_korean: 우리를 알지 못하고 / 우리를 인정하지 않더라도
  alternatives_korean:
  - 우리를 모르고 / 우리를 알아보지 않더라도
  - 우리를 알지 못하고 / 우리를 알아주지 않더라도
  lexicon: HALOT
  rationale: ידע는 '알다'의 기본 의미를 살려 '알지 못하다'로, נכר의 공적·관계적 뉘앙스를 '인정하다'로 구분해 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절의 문맥에서는 호칭적 직접호소가 두드러지므로 합쇼체 기도 문맥에 맞는 '주님'을 사용했고, 본문 안에서는 동일 지시를 '주께서/주님'으로 일관되게 처리했습니다.
- source_word: גֹּאֲלֵנוּ
  english_pob_choice: our Redeemer
  chosen_korean: 우리의 속량하시는 이
  alternatives_korean:
  - 우리의 구속자
  - 우리의 구속하시는 분
  - 우리의 구원자
  lexicon: HALOT
  rationale: גאל의 구속·속량 의미와 친족 구속자의 함의를 보존하기 위해 전통적 '구속자'보다 동사성을 드러내는 '속량하시는 이'를 택했습니다.
- source_word: מֵעוֹלָם
  english_pob_choice: from of old
  chosen_korean: 옛부터
  alternatives_korean:
  - 영원부터
  - 태초부터
  - 오래전부터
  lexicon: HALOT
  rationale: עוֹלָם의 먼 과거/지속성의 긴장을 남기기 위해, '영원부터'의 형이상학적 강도를 조금 누그러뜨린 '옛부터'를 사용했습니다.
theological_decisions:
- issue: יְהוָה의 호칭 처리와 기도체 존칭
  chosen_reading: 본문 안의 יְהוָה는 직접 호소의 호칭으로 '주님'을 쓰고, 문장 내부에서는 '주께서/주님'으로 존대했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 예언적 기도문으로서 하나님께 직접 아뢰는 형식이므로, 합쇼체에서 자연스러운 호칭인 '주님'이 문맥상 가장 적절합니다. 다만 고유명사 보존을 위해서는 주석 차원의 야훼 표기가 가능하나, 본문 가독성을 우선했습니다.
  doctrine_reference: 기도문/직접호칭의 문체 일관성
- issue: מֵעוֹלָם의 시간적 범위
  chosen_reading: 옛부터
  alternative_readings:
  - 영원부터
  - 태초부터
  rationale: 이 표현은 하나님의 영원성을 강하게 주장할 수도 있으나, 본문 자체는 그 긴장을 완전히 해소하지 않습니다. 그래서 '옛부터'로 옮겨 고대성의 의미를 살리되, 형이상학적 결론을 본문 밖에서 단정하지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
