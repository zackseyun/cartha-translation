reference: Isaiah 63:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
  footnotes:
  - marker: a
    text: Or 'lovingkindness' or 'mercies' for 'steadfast love' (Hebrew חסד), a term denoting loyal, covenantal love.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
  - marker: c
    text: Or 'has dealt bountifully with us' for 'has bestowed on us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 야훼의 인자하심을, 야훼의 찬양을, 곧 야훼께서 우리에게 베푸신 모든 것과 이스라엘 집에 베푸신 큰 선함을, 그의 긍휼에 따라, 그의 크신 인자하심의 풍성함에 따라 전하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חסד는 언약적이고 신실한 사랑을 가리키므로, 여기서는 '인자하심'으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 한국어에서는 이를 '야훼'로 옮겼습니다.
    reason: ot_citation
  - marker: c
    text: גמל은 문맥상 '보응하다'보다 '베풀다, 호의로 행하다'의 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: חסד의 핵심인 언약적이고 신실한 사랑의 뉘앙스를 살리기 위해, 한국어에서는 교회 용어에 가까운 '인자하심'보다 더 오래된 '자비'를 피하고, 관계의 지속성과 선의를 함께 담는 '인자하심'을 택했습니다.
- source_word: אַזְכִּיר
  english_pob_choice: I will recount
  chosen_korean: 전하겠습니다
  alternatives_korean:
  - 기억하겠습니다
  - 말하겠습니다
  - 기리겠습니다
  lexicon: HALOT
  rationale: 화자가 내면적으로 기억하는 것이 아니라 공개적으로 말로 드러내는 행위이므로, 예언적 찬양 문맥에 맞게 '전하겠습니다'로 옮겼습니다.
- source_word: תְּהִלֹּת
  english_pob_choice: the praises
  chosen_korean: 찬양을
  alternatives_korean:
  - 찬양들
  - 찬양의 일들
  - 찬미를
  lexicon: HALOT
  rationale: 복수형의 형식을 그대로 한국어에서 자연스럽게 살리기 어려워, 앞의 '인자하심'과 병렬되는 예배적 응답을 드러내는 '찬양'으로 옮겼습니다.
- source_word: גְּמָלָנוּ / גְּמָלָם
  english_pob_choice: has bestowed on us / has bestowed on them
  chosen_korean: 베푸신
  alternatives_korean:
  - 행하신
  - 갚아주신
  - 해주신
  lexicon: HALOT
  rationale: גמל은 문맥상 보응보다 은혜로운 베풂을 뜻하므로, 하나님의 호의적 행위를 드러내는 '베푸신'이 가장 적절합니다.
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: to the house of Israel
  chosen_korean: 이스라엘 집에
  alternatives_korean:
  - 이스라엘의 집에
  - 이스라엘 가문에
  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: '''집''의 언약적 공동체 표현을 보존하기 위해 직역에 가깝게 유지하되, 한국어 어순에 맞게 ''이스라엘 집에''로 옮겼습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 제목 대체어보다 이름 자체를 드러내는 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חסד의 반복 번역
  chosen_reading: 인자하심
  alternative_readings:
  - 자비
  - 사랑
  - 은혜
  rationale: 시구 안에서 חסד가 반복되므로 같은 핵심어로 일관되게 옮겨, 하나님의 언약적 신실함과 풍성함의 반복 구조를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
