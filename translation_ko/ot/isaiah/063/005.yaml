  edition: WLC
  text: וְ/אַבִּיט֙ וְ/אֵ֣ין עֹזֵ֔ר וְ/אֶשְׁתּוֹמֵ֖ם וְ/אֵ֣ין סוֹמֵ֑ךְ וַ/תּ֤וֹשַֽׁע לִ/י֙ זְרֹעִ֔/י וַ/חֲמָתִ֖/י הִ֥יא סְמָכָֽתְ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
  footnotes:
  - marker: a
    text: Or 'I was astonished.' The Hebrew verb can denote stunned astonishment or appalled desolation.
    reason: lexical_alternative
  - marker: b
    text: Or 'my arm brought me victory.' The Hebrew verb is from the root often rendered 'save' or 'deliver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 둘러보았으나 돕는 이가 없었고, 내가 놀라 멍해졌으나 붙들어 주는 이가 없었습니다. 그러므로 내 팔이 나에게 구원을 가져다주었고, 내 분노가 나를 떠받들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놀라 멍해졌으나’는 히브리어 동사의 ‘놀라움’과 ‘황망한 마비 상태’를 함께 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원을 가져다주었다’는 ‘구하다/구원하다’의 의미를 살리면서도, 문맥상 해방 또는 승리의 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבִּיט
  english_pob_choice: I looked
  chosen_korean: 내가 둘러보았으나
  alternatives_korean:
  - 내가 보았으나
  - 내가 살펴보았으나
  lexicon: HALOT
  rationale: 단순한 ‘보다’보다 주변 상황을 살피는 동작을 드러내어 문맥의 절박함을 살렸습니다.
- source_word: וְ/אֵין עֹזֵר / וְ/אֵין סוֹמֵךְ
  english_pob_choice: there was no one to help / there was no one to support
  chosen_korean: 돕는 이가 없었고 … 붙들어 주는 이가 없었습니다
  alternatives_korean:
  - 도와줄 사람이 없었고 … 지탱해 주는 사람이 없었습니다
  - 돕는 자가 없었고 … 받쳐 주는 자가 없었습니다
  lexicon: HALOT
  rationale: 분사형을 한국어 관용에 맞게 ‘돕는 이’, ‘붙들어 주는 이’로 옮겨 도움과 지지의 병행을 살렸습니다.
- source_word: וְ/אֶשְׁתּוֹמֵם
  english_pob_choice: I was appalled
  chosen_korean: 내가 놀라 멍해졌으나
  alternatives_korean:
  - 내가 크게 놀랐으나
  - 내가 경악했으나
  lexicon: HALOT
  rationale: שמם의 ‘놀람/황망함/멍해짐’ 범위를 반영하여, 단순한 감탄보다 충격으로 멍해진 상태를 나타냈습니다.
- source_word: וַ/תּוֹשַֽׁע לִ/י זְרֹעִ/י
  english_pob_choice: my own arm brought me salvation
  chosen_korean: 내 팔이 나에게 구원을 가져다주었고
  alternatives_korean:
  - 내 팔이 나를 구원했고
  - 내 팔이 나에게 승리를 가져다주었고
  lexicon: HALOT
  rationale: ישע의 구원/해방 의미를 살리되, 한국어에서는 ‘구원을 가져다주다’가 문장 흐름과 의미를 가장 자연스럽게 전달합니다.
- source_word: וַ/חֲמָתִ֖/י הִ֥יא סְמָכָֽתְ/נִי
  english_pob_choice: and my wrath—it upheld me
  chosen_korean: 내 분노가 나를 떠받들었습니다
  alternatives_korean:
  - 내 분노가 나를 붙들었습니다
  - 내 분노가 나를 지탱했습니다
  lexicon: HALOT
  rationale: סמך의 ‘받치다/지탱하다’ 의미를 살려, 시적 병행을 유지하면서도 강한 이미지인 ‘떠받들다’를 선택했습니다.
theological_decisions:
- issue: 하나님의 자기-구원을 인간적 신체 이미지로 표현하는 방식
  chosen_reading: 내 팔이 나에게 구원을 가져다주었고
  alternative_readings:
  - 내 팔이 나를 구원했고
  - 내 팔이 나에게 승리를 가져다주었고
  rationale: 본문의 ‘팔’은 비유적 자기-구원의 수단을 가리키므로, 특정 교리적 설명을 덧붙이지 않고 원문이 지닌 구원/해방의 긴장을 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘내 분노’가 지탱하는 힘으로 제시되는 역설
  chosen_reading: 내 분노가 나를 떠받들었습니다
  alternative_readings:
  - 내 분노가 나를 지탱했습니다
  - 내 분노가 나를 붙들었습니다
  rationale: 심판 맥락의 강한 이미지를 약화하지 않기 위해, 분노가 실제로 행동을 떠받친다는 역설적 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §3
