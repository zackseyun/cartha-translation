id: ISA.63.19
reference: Isaiah 63:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
  footnotes:
  - marker: a
    text: Or, more literally, 'at your presence' (lit. 'from before your face/presence').
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'the mountains would flow down' or 'melt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 당신께서 한 번도 다스리지 않으신 자들, 당신의 이름으로 불린 적이 없는 자들과 같아졌습니다. 오, 당신께서 하늘을 찢고 내려오신다면, 당신 앞에서[a] 산들이 떨 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 얼굴/임재 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘산들이 흘러내리거나 녹아내릴 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ
  english_pob_choice: We have become
  chosen_korean: 우리는 ... 같아졌습니다
  alternatives_korean:
  - 우리는 되었습니다
  - 우리는 ...이었습니다
  lexicon: HALOT
  rationale: 현재의 결과 상태를 나타내는 뉘앙스를 살려, 단순 과거보다 ‘... 같아졌습니다’로 표현했습니다.
- source_word: לֹא מָשַׁלְתָּ בָּם
  english_pob_choice: over whom you have never ruled
  chosen_korean: 당신께서 한 번도 다스리지 않으신 자들
  alternatives_korean:
  - 당신께서 그들을 다스리지 않으신 자들
  - 당신께서 다스려 본 적이 없는 자들
  lexicon: HALOT
  rationale: מָשַׁל의 지배/통치 의미를 살려 ‘다스리다’로 옮겼고, 부정의 반복성을 ‘한 번도’로 분명히 했습니다.
- source_word: לֹא נִקְרָא שִׁמְ/ךָ עֲלֵי/הֶם
  english_pob_choice: those who were never called by your name
  chosen_korean: 당신의 이름으로 불린 적이 없는 자들
  alternatives_korean:
  - 당신의 이름이 그들 위에 불리지 않은 자들
  - 당신의 이름이 그들 위에 불린 적이 없는 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 소속/식별 의미를 한국어에서 자연스럽게 드러내기 위해 ‘이름으로 불리다’를 사용했습니다.
- source_word: קָרַעְתָּ שָׁמַיִם יָרַדְתָּ
  english_pob_choice: you would tear open the heavens and come down
  chosen_korean: 당신께서 하늘을 가르시고 내려오신다면
  alternatives_korean:
  - 당신께서 하늘을 찢고 내려오신다면
  - 당신께서 하늘을 가르며 내려오신다면
  lexicon: HALOT
  rationale: קרע의 ‘찢다/가르다’ 중 한국어 예배·시가 문맥에서 자연스러운 ‘가르시고’로 옮겨, 강한 신현(神顯) 이미지를 살렸습니다.
- source_word: הָרִים נָזֹלּוּ
  english_pob_choice: the mountains would quake
  chosen_korean: 산들이 떨 것입니다
  alternatives_korean:
  - 산들이 녹아내릴 것입니다
  - 산들이 흐를 것입니다
  lexicon: HALOT
  rationale: POB가 본문의 신현적 효과를 현대적으로 살린 ‘quake’를 따라, 산의 흔들림을 직관적으로 드러내는 ‘떨다’로 옮겼습니다.
theological_decisions:
- issue: מִפָּנֶיךָ의 관계사/위치 관계
  chosen_reading: ‘당신 앞에서’로 옮겨, 하나님의 임재 앞에서 산들이 반응하는 장면을 드러냈습니다.
  alternative_readings:
  - 당신의 앞에서
  - 당신의 임재 앞에서
  rationale: 본문의 핵심은 하나님의 나타나심 앞에서 피조세계가 흔들리는 효과이므로, 위치를 분명히 하는 표현을 유지했습니다.
  doctrine_reference: 시적 신현 이미지
- issue: לוּא의 간구 어조
  chosen_reading: ‘오, ...한다면’으로 간구의 절박함을 살렸습니다.
  alternative_readings:
  - 부디 ...해 주십시오
  - 아, ...하시기를
  rationale: 히브리어의 강한 소원 표현을 한국어 시적 간구로 자연스럽게 옮기되, 지나치게 고어적이지 않게 했습니다.
  doctrine_reference: 탄원시/예언적 탄식의 수사
