  to: 우리는 당신께서 한 번도 다스리지 않으신 자들, 당신의 이름으로 불린 적이 없는 자들과 같아졌습니다. 오, 당신께서 하늘을 찢고 내려오신다면, 당신 앞에서[a] 산들이 떨 것입니다[b].
