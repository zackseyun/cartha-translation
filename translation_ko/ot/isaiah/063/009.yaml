  terminology: ‘구원하시다’, ‘속량하시다’, ‘긍휼’, ‘임재의 천사’는 현대 정중 문체와 성서 번역어법에 맞으며, גאל의 구속·친족 구속 어휘의 울림도 유지합니다.
