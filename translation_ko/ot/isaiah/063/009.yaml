base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
  footnotes:
  - marker: a
    text: 'Or, following an ancient alternative reading: ''In all their distress, he was distressed.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 모든 고난 속에서 그분은 고난받지 않으셨고, 그분의 얼굴 앞의 천사가 그들을 구원했습니다. 그분의 사랑과 그분의 긍휼로 그분이 그들을 속량하셨고, 옛날의 모든 날 동안 그들을 들어 올리시고 안고 가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 고대의 다른 읽기를 따르면, ‘그들의 모든 고난 속에서 그분은 고난받으셨다.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  english_pob_choice: In all their distress
  chosen_korean: 그들의 모든 고난 속에서
  alternatives_korean:
  - 그들의 모든 환난 속에서
  - 그들의 모든 고통 가운데
  lexicon: HALOT
  rationale: בְּכָל의 포괄성과 צָרָה의 감정·상황적 의미를 함께 살리기 위해 ‘모든 고난 속에서’로 옮겼습니다.
- source_word: לֹא צָר
  english_pob_choice: he was not distressed
  chosen_korean: 그분은 고난받지 않으셨고
  alternatives_korean:
  - 그분은 괴로워하지 않으셨고
  - 그분은 괴로움을 당하지 않으셨고
  lexicon: HALOT
  rationale: 마소라 본문의 לֹא를 따라 부정문으로 유지하되, 한국어에서는 신의 내적 상태를 자연스럽게 드러내는 ‘고난받지 않으셨고’로 표현했습니다.
- source_word: וּמַלְאַךְ פָּנָיו
  english_pob_choice: the angel of his presence
  chosen_korean: 그분의 얼굴 앞의 천사
  alternatives_korean:
  - 그분의 임재의 천사
  - 그분의 현존의 천사
  lexicon: HALOT
  rationale: פָּנִים의 직역 가능성을 살리면서도 문맥상 신현적 표현임을 드러내기 위해 ‘얼굴 앞의 천사’로 옮겼습니다.
- source_word: הוֹשִׁיעָם
  english_pob_choice: saved them
  chosen_korean: 그들을 구원했습니다
  alternatives_korean:
  - 그들을 구했습니다
  - 그들을 건져냈습니다
  lexicon: HALOT
  rationale: יָשַׁע의 구원·구출 의미를 한국어 성서어법에 맞게 유지하기 위해 ‘구원했습니다’를 선택했습니다.
theological_decisions:
- issue: לֹא צָר의 본문 이해
  chosen_reading: 주본문은 ‘그분은 고난받지 않으셨고’로 두고, 마소라 본문의 부정을 살렸습니다.
  alternative_readings:
  - ‘그들의 모든 고난 속에서 그분은 고난받으셨다’라는 전통적 반대 해석
  rationale: 이 절은 고난에 대한 하나님의 공감 여부를 둘러싼 해석 차이가 크지만, 본문 우선 원칙에 따라 MT의 לֹא를 한국어 본문에 반영했습니다. 다만 본문 자체는 의미상 긴장을 남기므로 직설적 완화는 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3
