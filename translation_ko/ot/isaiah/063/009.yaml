revisions:
- from: 그들의 모든 고난 속에서 그분은 고난받지 않으셨고, 그분의 얼굴 앞의 천사가 그들을 구원했습니다. 그분의 사랑과 그분의 긍휼로 그분이 그들을 속량하셨고, 옛날의 모든 날 동안 그들을 들어 올리시고 안고 가셨습니다.[a]
  to: 그들이 겪은 모든 고난 가운데서도, 그분은 괴로워하지 않으셨습니다.[a] 그분의 임재의 천사가 그들을 구원하셨습니다. 그분은 사랑과 긍휼로 그들을 속량하셨고, 옛적의 모든 날 동안 그들을 들어 올리시고 품어 옮기셨습니다.
  rationale: 마소라 자음 본문의 부정 לֹא를 주본문에서 유지하면서, 고대의 대안 본문 읽기를 각주에 명확히 보존했습니다. ‘임재의 천사’로 פָּנָיו의 문맥적 의미를 정확하고 자연스러운 한국어로 옮겼으며, 두 개의 돌봄 동사(들어 올리다/나르다)는 ‘들어 올리시고 품어 옮기셨습니다’로 구별했습니다.
