id: ISA.63.8
reference: Isaiah 63:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
  footnotes:
  - marker: a
    text: Or “sons who will not lie” / “sons who will not prove false.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하시기를 “분명히 그들은 내 백성이요, 거짓을 행하지 않을 자녀들입니다” 하셨으므로, 그들의 구원자가 되셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아들들로서 거짓을 말하지 않을 자들” / “거짓됨을 드러내지 않을 아들들”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 참으로
  - 진실로
  - 오직
  lexicon: HALOT
  rationale: 여기서 אַךְ는 제한보다 강한 확언의 뉘앙스이므로, 한국어에서도 단순 연결어보다 확신을 드러내는 ‘분명히’가 가장 자연스럽습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 ժողովուրդ
  - 내 사람들
  - 내 백성들
  lexicon: HALOT
  rationale: 언약적 소속을 드러내는 관용구이므로 ‘백성’이 가장 직접적이며, 단수 소유격 ‘내’를 그대로 살렸습니다.
- source_word: בָּנִים
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아들들
  - 아들
  - 아이들
  lexicon: HALOT
  rationale: 히브리어 복수 남성형이지만 여기서는 성별보다 하나님과의 자녀 관계가 핵심이므로, 한국어에서는 대표성 있는 포괄어 ‘자녀들’이 적절합니다.
- source_word: לֹא יְשַׁקֵּרוּ
  english_pob_choice: will not deal falsely
  chosen_korean: 거짓을 행하지 않을
  alternatives_korean:
  - 거짓말하지 않을
  - 속이지 않을
  - 헛되이 행하지 않을
  lexicon: HALOT
  rationale: יְשַׁקֵּרוּ는 단순 발화의 거짓말보다 더 넓은 ‘거짓되이 행함/속임’의 의미가 있어, 문맥상 윤리적·언약적 함의를 살린 표현을 택했습니다.
- source_word: לְמוֹשִׁיעַ
  english_pob_choice: Savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구해 주시는 분
  - 구원하시는 분
  - 구출자
  lexicon: HALOT
  rationale: מוֹשִׁיעַ는 ‘구원하는 자’라는 칭호이므로, 한국어에서는 신학적 무게를 유지하는 ‘구원자’가 가장 적절합니다.
theological_decisions:
- issue: יבֹא/ויהי 문맥의 결과 진술을 어떻게 처리할지
  chosen_reading: ‘그들의 구원자가 되셨습니다’로 결과를 서술했습니다.
  alternative_readings:
  - ‘그들의 구원자가 되었습니다’
  - ‘그들에게 구원자가 되셨습니다’
  rationale: וַיְהִי לָהֶם לְמוֹשִׁיעַ는 상태 변화보다 관계적 결과를 말하므로, 종결형에서 하나님의 구원자 되심을 자연스럽게 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: בָּנִים의 성별 처리
  chosen_reading: ‘자녀들’로 포괄 번역했습니다.
  alternative_readings:
  - ‘아들들’
  - ‘아들’
  rationale: 문맥상 이 표현은 남성만을 지시하지 않고 언약 공동체 전체를 가리키므로, 성별을 제한하지 않는 번역이 원문의 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §4
