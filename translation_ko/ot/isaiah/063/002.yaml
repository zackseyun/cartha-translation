  text: מַדּ֥וּעַ אָדֹ֖ם לִ/לְבוּשֶׁ֑/ךָ וּ/בְגָדֶ֖י/ךָ כְּ/דֹרֵ֥ךְ בְּ/גַֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
  footnotes:
  - marker: a
    text: Or 'reddened' or 'crimson'; the Hebrew simply says 'red,' leaving the cause to be clarified by the context.
    reason: lexical_alternative
  - marker: b
    text: The comparison is to a person treading grapes in a winepress, whose garments are stained red by the juice.
    reason: cultural_note
translation:
  language: ko
  text: 어찌하여 당신의 옷이 붉으며, 당신의 겉옷이 포도즙 틀에서 밟는 자의 것과 같습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 원인보다 색을 직접 말하므로, ‘붉다’는 기본 의미를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 비유는 포도즙 틀에서 포도를 밟는 사람의 옷이 붉게 물드는 장면을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 직접적인 의문 부사를 자연스러운 현대 한국어로 옮겼습니다. ‘어찌하여’가 시적이면서도 합쇼체 질문에 잘 맞습니다.
- source_word: אָדֹם
  english_pob_choice: red
  chosen_korean: 붉으며
  alternatives_korean:
  - 빨갛습니까
  - 붉은
  lexicon: HALOT
  rationale: 히브리어는 단순히 색을 말하므로, 원문의 시각적 묘사를 유지해 ‘붉으며’로 옮겼습니다. 원인까지 미리 설명하지 않도록 했습니다.
- source_word: לִלְבוּשֶׁךָ / וּבְגָדֶיךָ
  english_pob_choice: your clothing / and your garments
  chosen_korean: 당신의 옷 / 당신의 겉옷
  alternatives_korean:
  - 당신의 의복 / 당신의 옷들
  - 당신의 옷가지 / 당신의 옷
  lexicon: HALOT
  rationale: 두 명사는 평행법으로 반복되므로 모두 살리되, 한국어에서는 지나치게 중복되지 않도록 첫째는 ‘옷’, 둘째는 좀 더 시적인 ‘겉옷’으로 옮겼습니다.
- source_word: כְּדֹרֵךְ בְּגַת
  english_pob_choice: like one who treads in the winepress
  chosen_korean: 포도즙 틀에서 밟는 자의 것과 같이
  alternatives_korean:
  - 포도주 틀을 밟는 사람과 같이
  - 포도즙 틀에서 포도를 밟는 자와 같이
  lexicon: HALOT
  rationale: 비유의 핵심은 포도즙 틀에서 발로 밟는 행위이므로, 문화적 이미지를 유지하면서도 현대 독자가 이해할 수 있게 ‘포도즙 틀’로 옮겼습니다.
theological_decisions:
- issue: 붉은 옷의 의미를 혈흔으로 미리 해석할지 여부
  chosen_reading: 본문의 표면 이미지대로 ‘붉다’는 묘사를 유지하고, 혈흔 해석은 본문 다음 전개에 맡겼습니다.
  alternative_readings:
  - 왜 옷이 피로 물들었습니까?
  - 왜 옷이 혈흔처럼 붉습니까?
  rationale: 히브리어 자체는 단순한 색채 진술이며, 현재 절만으로는 원인 설명을 확정하지 않습니다. 따라서 문학적 긴장을 보존하기 위해 해석을 앞세우지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
