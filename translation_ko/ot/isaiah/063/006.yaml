    rationale: 각주 b는 히브리어 נִצְחָם의 의미 문제를 설명하므로, 번역어 ‘생명력’에 붙어야 독자가 주석의 대상어를 정확히 알 수 있습니다.
  - severity: low
    issue: ‘끌어내렸습니다’가 원문의 동사보다 강한 ‘끌다’의 의미를 덧붙입니다.
