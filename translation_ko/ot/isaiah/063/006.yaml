id: ISA.63.6
reference: Isaiah 63:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָב֤וּס עַמִּים֙ בְּ/אַפִּ֔/י וַ/אֲשַׁכְּרֵ֖/ם בַּ/חֲמָתִ֑/י וְ/אוֹרִ֥יד לָ/אָ֖רֶץ נִצְחָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
  footnotes:
  - marker: a
    text: Or 'nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their nitscham'; possibly 'their juice' or 'their blood.' The translation 'lifeblood' preserves the judgment imagery in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 분노 가운데 여러 민족을 짓밟았고[a], 내 분노 가운데 그들을 취하게 하였으며[b], 그들의 생명을 땅으로 끌어내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 니츠함(nitscham)’. 문맥상 ‘그들의 즙’ 또는 ‘그들의 피’를 가리킬 수 있습니다. 여기서는 심판 이미지를 살려 ‘생명’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 여러 민족
  alternatives_korean:
  - 백성들
  - 족속들
  lexicon: HALOT
  rationale: עַמִּים는 문맥상 단수의 ‘백성’보다 복수 집단인 ‘민족들/여러 민족’이 더 잘 맞습니다. 영어 POB의 peoples를 반영해 현대 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: אָבוּס
  english_pob_choice: I trampled
  chosen_korean: 짓밟았고
  alternatives_korean:
  - 밟았고
  - 유린했고
  lexicon: HALOT
  rationale: בוס의 핵심 이미지는 발로 짓밟는 행위이므로 ‘짓밟다’가 가장 직접적입니다. ‘유린하다’는 의미는 전달되지만 물리적 압박 이미지를 약화시킬 수 있습니다.
- source_word: וַאֲשַׁכְּרֵם
  english_pob_choice: I made them drunk
  chosen_korean: 그들을 취하게 하였으며
  alternatives_korean:
  - 그들을 술 취하게 하였으며
  - 그들을 술에 취하게 하였으며
  lexicon: HALOT
  rationale: שׁכר의 기본 뜻은 ‘취하게 하다’이므로, 여기서는 심판의 이미지로서 술에 취함을 직접 드러내되 한국어 문장 흐름상 ‘취하게 하다’가 간결합니다.
- source_word: נִצְחָם
  english_pob_choice: their lifeblood
  chosen_korean: 그들의 생명
  alternatives_korean:
  - 그들의 피
  - 그들의 생명수
  - 그들의 생혈
  lexicon: HALOT
  rationale: 이 어휘는 난해하지만 문맥상 포도즙/피의 심판 이미지를 가리킵니다. 한국어에서는 POB의 ‘lifeblood’를 과도하게 해설하지 않고 ‘생명’으로 옮겨, 유혈과 생명 소진의 심판감을 유지했습니다.
- source_word: וְאוֹרִיד לָאָרֶץ
  english_pob_choice: I brought ... down to the earth
  chosen_korean: 땅으로 끌어내렸습니다
  alternatives_korean:
  - 땅에 내렸습니다
  - 땅으로 내렸습니다
  - 땅에 쏟아부었습니다
  lexicon: HALOT
  rationale: ירד의 사역형은 ‘내리다/끌어내리다’의 뜻이어서, 땅으로 향하는 하강 동작을 살렸습니다. 물을 붓는 식의 표현은 원문보다 해석이 강해질 수 있어 피했습니다.
theological_decisions:
- issue: 폭력적 심판 이미지의 강도 유지
  chosen_reading: 포도즙 틀 같은 심판 은유를 약화시키지 않고, ‘짓밟았고… 취하게 하였으며… 끌어내렸습니다’로 연쇄 동작을 살렸습니다.
  alternative_readings:
  - ‘분노로 그들을 무너뜨렸습니다’처럼 완화하는 번역
  - ‘그들의 생명액을 땅에 쏟았습니다’처럼 은유를 더 노출하는 번역
  rationale: 본문은 하나님의 심판을 매우 강한 신체적·이미지적 언어로 묘사합니다. 한국어에서도 그 충격을 유지해야 하므로, 완화하거나 지나치게 설명적으로 바꾸지 않았습니다.
  doctrine_reference: Isaiah 63:1-6의 심판-구원 문맥
