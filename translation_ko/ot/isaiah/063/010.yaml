revisions:
- from: 그러나 그들은 반역하여 그의 거룩한 영을 근심하게 했습니다[a]. 그래서 그분은 그들에게 등을 돌려 원수가 되셨고, 그분 자신이 그들과 싸우셨습니다.
  to: 그러나 그들은 반역하여 그의 거룩한 영을 슬프게 했습니다[a]. 그래서 그분은 그들에게 원수가 되셨고, 그분 자신이 그들을 대적하여 싸우셨습니다.
  rationale: 대적의 방향성을 분명히 하고, 원문의 관계적 전환을 직결되게 옮겼습니다. 또한 각주의 부정확한 대립 구문을 바로잡아 ‘거룩한 영’의 가능한 번역과 더 문자적인 번역을 제시했습니다. 이 수정은 교리적 해석을 추가하지 않으면서 히브리어의 의미와 현대 한국어의 명료성을 함께 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:22Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 역접, 반역, 하나님의 영을 슬프게 함, 하나님께서 그들에게 원수가 되심, 그리고 친히 그들을 대적하여 싸우심을 대체로 충실히 반영합니다. 다만 ‘그들과 싸우셨습니다’는 한국어에서 그들과 함께 싸웠다는 뜻으로도 이해될 수 있으므로, בָּם의 대적 의미를 명시해야 합니다.
  naturalness: 본문은 전반적으로 현대 표준어 합쇼체로 자연스럽습니다. ‘그들에게 등을 돌려’는 원문의 적대적 전환을 풀어 쓴 표현으로 가능하지만, ‘그들에게 원수가 되셨고’가 더 직접적이고 간결합니다. 기존 각주는 ‘또는 …이 아니라’라는 대립 구문 때문에 비문이며 의미상도 부정확합니다.
  terminology: ‘그의 거룩한 영’은 רוּחַ קָדְשׁוֹ의 비교리적이면서도 충실한 번역입니다. ‘반역’과 ‘원수’도 문맥과 어휘의 강도에 적절합니다. ‘근심하게 했다’는 가능하지만, עִצְּבוּ의 직접적인 슬픔·고통의 의미에는 ‘슬프게 했다’가 더 자연스럽고 명료합니다.
  issues:
  - severity: medium
    issue: ‘그들과 싸우셨습니다’의 방향성이 모호합니다.
    rationale: לחם + ב는 여기서 그들을 대적하여 싸우셨다는 뜻입니다. 한국어 ‘그들과 싸우다’는 문맥에 따라 그들과 함께 싸운다는 의미로도 읽힐 수 있으므로 ‘그들을 대적하여 싸우셨습니다’로 명시하는 것이 안전합니다.
  - severity: medium
    issue: 각주가 구조·의미상 부정확합니다.
    rationale: ‘또는 ‘그의 거룩한 영’이 아니라’는 본문 번역 자체를 부정하는 형태이며, 어휘 대안을 제시하는 각주로 기능하지 않습니다. 대안과 더 문자적인 표현을 병렬로 제시해야 합니다.
  - severity: low
    issue: ‘그들에게 등을 돌려’는 원문보다 다소 관용적으로 확장된 표현입니다.
    rationale: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב은 하나님께서 그들에게 원수가 되셨다는 관계 변화가 핵심입니다. ‘그들에게 원수가 되셨고’가 더 직접적으로 대응합니다.
  revised_text: 그러나 그들은 반역하여 그의 거룩한 영을 슬프게 했습니다[a]. 그래서 그분은 그들에게 원수가 되셨고, 그분 자신이 그들을 대적하여 싸우셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그의 성령’. 더 문자적으로는 ‘그의 거룩함의 영’.
    reason: lexical_alternative
  revision_rationale: 대적의 방향성을 분명히 하고, 원문의 관계적 전환을 직결되게 옮겼습니다. 또한 각주의 부정확한 대립 구문을 바로잡아 ‘거룩한 영’의 가능한 번역과 더 문자적인 번역을 제시했습니다. 이 수정은 교리적 해석을 추가하지 않으면서 히브리어의 의미와 현대 한국어의 명료성을 함께 보존합니다.
