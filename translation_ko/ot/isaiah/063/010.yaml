id: ISA.63.10
reference: Isaiah 63:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
  footnotes:
  - marker: a
    text: Or 'his holy spirit' or more literally 'the spirit of his holiness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 반역하여 그의 거룩한 영을 근심하게 했습니다[a]. 그래서 그분은 그들에게 등을 돌려 원수가 되셨고, 그분 자신이 그들과 싸우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 거룩한 영’이 아니라 더 문자적으로는 ‘그의 거룩의 영’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그런데 그들은
  lexicon: HALOT
  rationale: 문맥상 앞선 하나님의 구원 행위와 대조되는 전환이므로, 한국어에서도 역접을 분명히 드러냈습니다.
- source_word: מָרוּ
  english_pob_choice: rebelled
  chosen_korean: 반역하여
  alternatives_korean:
  - 거역하여
  - 반항하여
  lexicon: HALOT
  rationale: 하나님께 대한 공적이고 강한 불순종을 나타내는 말이므로, 단순한 ‘거역’보다 ‘반역’이 원어의 강도를 더 잘 살립니다.
- source_word: וְעִצְּבוּ
  english_pob_choice: grieved
  chosen_korean: 근심하게 했습니다
  alternatives_korean:
  - 슬프게 했습니다
  - 고통스럽게 했습니다
  lexicon: HALOT
  rationale: עצב의 감정적·관계적 상처를 한국어에서 자연스럽게 드러내기 위해 ‘근심하게 하다’를 택했습니다.
- source_word: רוּחַ קָדְשׁוֹ
  english_pob_choice: his Holy Spirit
  chosen_korean: 그의 거룩한 영
  alternatives_korean:
  - 그의 성령
  - 그의 거룩한 성령
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그의 거룩의 영’에 가까우므로, 본문 의미를 과도하게 신학적으로 고정하지 않고 ‘거룩한 영’으로 옮겼습니다.
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  english_pob_choice: turned against them as an enemy
  chosen_korean: 그분은 그들에게 등을 돌려 원수가 되셨고
  alternatives_korean:
  - 그들에게 원수가 되셨고
  - 그들에게 적이 되어 돌아서셨고
  lexicon: HALOT
  rationale: ‘to them for an enemy’의 관계적 역전을 한국어에서 자연스럽게 표현하면서, 단순한 감정 변화가 아니라 적대적 전환임을 살렸습니다.
- source_word: נִלְחַם בָּם
  english_pob_choice: fought against them
  chosen_korean: 그분 자신이 그들과 싸우셨습니다
  alternatives_korean:
  - 그들과 싸우셨습니다
  - 그들에 맞서 싸우셨습니다
  lexicon: HALOT
  rationale: 에누리 없이 주체가 하나님 자신임을 드러내기 위해 강조어를 두고, בָּם의 대립 의미를 ‘그들과’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: רוּחַ קָדְשׁוֹ의 신학적 지칭
  chosen_reading: ‘거룩한 영’으로 옮기되, 본문이 하나님의 영을 인격적으로 ‘근심하게 할 수 있는’ 존재로 말한다는 점을 유지했습니다.
  alternative_readings:
  - ‘그의 성령’
  - ‘그의 거룩의 영’
  rationale: 히브리어 표현은 문자적으로는 다양하게 옮길 수 있지만, 문맥상 반역의 대상이면서 근심을 받는 ‘영’의 인격성을 약화시키지 않는 번역이 필요합니다. 동시에 주어진 본문만으로 표현을 지나치게 교리화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
