  naturalness: ‘하늘에서 내려다보시고 보소서’와 이어지는 ‘처소에서 보소서’는 ‘보다’가 반복되어 다소 부자연스럽습니다. ‘하늘에서 굽어보시고 … 처소에서 살펴보소서’가 현대 표준어 합쇼체에서 더 자연스럽습니다. ‘주의 깊은 내면의 떨림’도 수식 관계가 어색하므로 ‘주의 속의 격동’으로 다듬는 것이 좋습니다.
