id: ISA.63.15
reference: Isaiah 63:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the stirring of your inward parts'; an idiom for deep inner emotion or compassion.
    reason: cultural_note
  - marker: b
    text: Or 'your jealousy' for 'your zeal.'
    reason: lexical_alternative
  - marker: c
    text: Or 'hold themselves back from me' for 'are withheld from me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘에서 내려다보시고 보소서. 주의 거룩하고 영광스러운 처소에서 보소서. 주의 열심과 주의 능력의 일들은 어디에 있습니까? 주의 깊은 내면의 떨림과 주의 긍휼이 제게서 거두어졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주의 깊은 내면의 떨림’이며, 깊은 정서와 긍휼을 가리키는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘주의 질투’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제게서 스스로를 억제하고 계십니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  english_pob_choice: Look down from heaven and see
  chosen_korean: 하늘에서 내려다보시고 보소서
  alternatives_korean:
  - 하늘에서 보시고 보소서
  - 하늘을 굽어보시고 보소서
  lexicon: HALOT
  rationale: 두 명령형을 한국어에서 자연스럽게 살리되, 위에서 아래를 향한 시선을 분명히 하기 위해 ‘내려다보시고’로 옮겼습니다.
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  english_pob_choice: from your holy and glorious dwelling
  chosen_korean: 주의 거룩하고 영광스러운 처소에서
  alternatives_korean:
  - 주의 거룩한 영광의 처소에서
  - 주의 거룩하고 영화로운 거처에서
  lexicon: HALOT
  rationale: זְבֻל을 단순한 ‘거처’보다 격이 있는 ‘처소’로 옮기고, קדשך와 תפארתך를 형용사로 풀어 원문의 병렬적 수식을 살렸습니다.
- source_word: קִנְאָתְךָ וּגְבוּרֹתֶיךָ
  english_pob_choice: your zeal and your mighty deeds
  chosen_korean: 주의 열심과 주의 능력의 일들
  alternatives_korean:
  - 주의 질투와 주의 큰 일들
  - 주의 열정과 주의 능력의 역사
  lexicon: HALOT
  rationale: 하나님께 대한 קנאה는 부정적 ‘질투’보다 언약적 ‘열심’이 더 적절하고, גבורות는 추상적 ‘능력’보다 그 능력이 드러난 행위로 보아 ‘능력의 일들’로 옮겼습니다.
- source_word: הֲמוֹן מֵעֶיךָ וְרַחֲמֶיךָ
  english_pob_choice: The stirring of your inward parts and your compassions
  chosen_korean: 주의 깊은 내면의 떨림과 주의 긍휼
  alternatives_korean:
  - 주의 내장 깊은 떨림과 주의 자비
  - 주의 속의 요동과 주의 긍휼
  lexicon: HALOT
  rationale: 히브리어의 신체적 비유를 완화하지 않되 한국어에서 거친 표현을 피하기 위해 ‘내면의 떨림’으로 살리고, רַחֲמִים은 표준적 교회 용어인 ‘긍휼’로 옮겼습니다.
- source_word: הִתְאַפָּקוּ
  english_pob_choice: are withheld from me
  chosen_korean: 제게서 거두어졌습니다
  alternatives_korean:
  - 저를 향해 스스로를 억누르고 있습니다
  - 제게서 스스로를 억제하고 계십니다
  lexicon: HALOT
  rationale: 원문의 ‘자제/억제’ 의미를 한국어에서 자연스럽고 수동적인 결과로 드러내기 위해 ‘거두어졌습니다’로 처리했습니다.
theological_decisions:
- issue: 하나님의 신체-정서적 비유 유지
  chosen_reading: ‘주의 깊은 내면의 떨림’처럼 신체적 정서 이미지를 그대로 살려, 추상적 ‘마음’으로 평평하게 만들지 않았습니다.
  alternative_readings:
  - 주의 마음
  - 주의 감정
  - 주의 자비
  rationale: 본문은 하나님의 깊은 연민을 몸의 내부를 가리키는 히브리어 관용으로 표현하므로, 그 이미지를 보존하는 것이 원문의 탄성을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: קִנְאָה의 신학적 뉘앙스
  chosen_reading: ‘열심’으로 옮겨 하나님의 언약적 열정을 드러냈습니다.
  alternative_readings:
  - 질투
  - 열정
  rationale: 이 문맥은 하나님의 거룩한 개입을 호소하는 탄식이므로, 현대 한국어에서 오해를 줄이면서도 적극적 개입의 의미를 살리는 ‘열심’이 적합합니다.
  doctrine_reference: Translation philosophy §6
