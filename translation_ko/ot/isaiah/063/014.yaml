id: ISA.63.14
reference: Isaiah 63:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
  footnotes:
  - marker: a
    text: Or 'the wind of the LORD gave him rest.' Hebrew רוּחַ can mean 'spirit,' 'wind,' or 'breath,' though 'Spirit' best fits the context here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'gave him rest'; the singular likely refers to Israel as a people considered collectively. Some translations render 'gave them rest.'
    reason: alternative_reading
  - marker: c
    text: Or 'a name of glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 가축이 골짜기로 내려가듯이 야훼의 영이 그들에게 안식을 주셨습니다. 그래서 주께서는 당신의 백성을 이끄셨으니, 이는 스스로를 위해 영광스러운 이름을 얻으시려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’으로도 번역될 수 있습니다. 여기서는 문맥상 ‘영’이 가장 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단수형이지만, ‘백성’을 집합적으로 가리키는 표현으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘영광의 이름’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה ... בַּבִּקְעָה
  english_pob_choice: Like livestock going down into the valley
  chosen_korean: 마치 가축이 골짜기로 내려가듯이
  alternatives_korean:
  - 마치 가축이 평야로 내려가듯이
  - 마치 짐승이 골짜기로 내려가듯이
  lexicon: HALOT
  rationale: בְּהֵמָה는 문맥상 길들인 가축의 집합 개념이므로 ‘가축’이 자연스럽고, בִּקְעָה는 ‘골짜기/계곡’으로 옮겨 하강의 이미지를 살렸습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 바람
  - 주님의 영
  lexicon: HALOT
  rationale: ר֫וּחַ는 ‘바람/숨/영’의 여지가 있지만, 구원사적 맥락과 야훼의 인도·안식의 행위를 고려하면 ‘영’이 가장 적절합니다.
- source_word: תְּנִיחֶנּוּ
  english_pob_choice: gave them rest
  chosen_korean: 그들에게 안식을 주셨습니다
  alternatives_korean:
  - 그에게 안식을 주셨습니다
  - 그들을 쉬게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 접미사는 단수지만, 문맥상 ‘백성’을 집합적으로 가리키므로 한국어는 의미를 따라 복수로 자연스럽게 풀었습니다.
- source_word: נִהַגְתָּ עַמְּךָ
  english_pob_choice: you led your people
  chosen_korean: 주께서는 당신의 백성을 이끄셨습니다
  alternatives_korean:
  - 주께서는 당신의 백성을 인도하셨습니다
  - 주께서는 당신의 백성을 몰고 가셨습니다
  lexicon: HALOT
  rationale: נָהַג는 이끌다/인도하다의 뜻이므로 ‘이끄셨습니다’가 모세-출애굽 배경의 인도 이미지를 잘 살립니다.
- source_word: שֵׁם תִּפְאָרֶת
  english_pob_choice: a glorious name
  chosen_korean: 영광스러운 이름
  alternatives_korean:
  - 영광의 이름
  - 찬란한 이름
  lexicon: HALOT
  rationale: שֵׁם תִּפְאָרֶת은 ‘영광을 지닌 이름’이라는 관용적 의미이므로, 한국어에서는 자연스럽게 ‘영광스러운 이름’으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ יְהוָה를 인격적 영으로 볼지 자연현상인 바람으로 볼지
  chosen_reading: ‘야훼의 영’으로 번역했습니다.
  alternative_readings:
  - ‘야훼의 바람’으로 번역
  - 의도적으로 모호성을 살려 ‘야훼의 바람/영’ 처리
  rationale: 이 절은 광야-구원사의 회상 속에서 하나님의 주도적 임재와 안식을 말하므로, 단순 자연현상보다 인격적 신적 행위자로 읽는 것이 본문 흐름에 더 잘 맞습니다.
  doctrine_reference: 성령/하나님의 영의 구약적 임재 이해
- issue: תְּנִיחֶנּוּ의 단수 접미사를 한국어에서 어떻게 반영할지
  chosen_reading: 히브리어 형태의 단수성을 주석적으로 유지하지 않고, 문맥상 집합명사인 ‘백성’을 따라 복수 의미로 옮겼습니다.
  alternative_readings:
  - ‘그에게 안식을 주셨습니다’처럼 단수를 유지
  - ‘그 백성에게 안식을 주셨습니다’처럼 직역
  rationale: 히브리어의 단수 접미사는 공동체를 한 몸처럼 보는 집합적 단수로 이해되는 경우가 많아, 한국어에서는 독자가 뜻을 즉시 이해하도록 풀어 번역했습니다.
  doctrine_reference: 집합적 단수의 허용과 본문 문맥 우선 원칙
