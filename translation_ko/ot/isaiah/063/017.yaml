    issue: ‘주의 기업의 지파들’의 속격 관계가 모호합니다.
    rationale: שִׁבְטֵי נַחֲלָתֶךָ는 지파들이 하나님의 기업이라는 뜻입니다. ‘주의 기업인 지파들’은 이 동격 관계를 자연스럽고 명료하게 나타냅니다.
