id: ISA.63.17
reference: Isaiah 63:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֣/מָּה תַתְעֵ֤/נוּ יְהוָה֙ מִ/דְּרָכֶ֔י/ךָ תַּקְשִׁ֥יחַ לִבֵּ֖/נוּ מִ/יִּרְאָתֶ֑/ךָ שׁ֚וּב לְמַ֣עַן עֲבָדֶ֔י/ךָ שִׁבְטֵ֖י נַחֲלָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
  footnotes:
  - marker: a
    text: Or 'do you lead us astray' or 'do you let us wander.' The Hebrew verb is causative ('make/cause to wander'), and the prayer voices the tension of God's sovereignty in Israel's straying.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'our heart' (singular), a collective expression for the people as one.
    reason: lexical_alternative
  - marker: c
    text: Or 'Turn back.' The plea asks God to turn again toward his people in covenant favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여[a] 야훼여, 주께서는 우리가 주의 길에서 벗어나게 하시고 주를 경외하지 않도록 우리의 마음을[b] 완고하게 하십니까? 주의 종들, 곧 주의 기업인 지파들을 위하여 돌아오소서.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어찌하여’는 단순한 정보 질문이 아니라 탄식 어린 호소를 나타냅니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 ‘우리의 마음’에 해당하는 단수형을 사용하며, 이는 백성을 하나로 보는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘돌이키소서’. 이는 하나님께서 자기 백성에게 다시 호의로 향하여 주시기를 구하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 탄식과 호소가 함께 있는 질문이므로, 단순한 정보 질문보다 문학적·예배적 어조가 있는 ‘어찌하여’가 잘 맞습니다.
- source_word: תַתְעֵנוּ
  english_pob_choice: do you make us wander
  chosen_korean: 우리가 주의 길에서 벗어나게 하시고
  alternatives_korean:
  - 우리를 방황하게 하시고
  - 우리를 길 잃게 하시고
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려, 하나님이 원인 제공자로 지목되는 긴장을 유지했습니다. 한국어에서는 ‘방황하게 하다’보다 ‘길에서 벗어나게 하다’가 문맥상 더 자연스럽고, 주의 길이라는 대상도 분명히 드러냅니다.
- source_word: תַּקְשִׁיחַ לִבֵּנוּ
  english_pob_choice: harden our hearts
  chosen_korean: 우리의 마음을 … 굳어지게 하시고
  alternatives_korean:
  - 우리의 마음을 완악하게 하시고
  - 우리의 마음을 강퍅하게 하시고
  lexicon: HALOT
  rationale: ‘마음’의 공동체적 단수 표현을 한국어에서는 자연스러운 복수형 ‘우리의 마음’으로 옮기되, ‘굳어지게 하시고’로 히필의 사역성과 경직됨을 보존했습니다.
- source_word: מִיִּרְאָתֶךָ
  english_pob_choice: from fearing you
  chosen_korean: 주를 경외하는 데서
  alternatives_korean:
  - 주를 두려워하는 데서
  - 주에 대한 경외에서
  lexicon: HALOT
  rationale: 여기서 יראה는 단순 공포보다 언약적 경외를 가리키므로 ‘경외’가 적절합니다. 한국어에서는 동사구를 명사화해 ‘경외하는 데서’로 매끄럽게 표현했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들
  alternatives_korean:
  - 주의 노예들
  - 주의 시종들
  lexicon: HALOT
  rationale: 이곳은 예배적·언약적 호칭으로 쓰였으므로 ‘종들’이 가장 자연스럽습니다. POB의 ‘servants’를 그대로 반영하면서도 관계의 충성을 드러냅니다.
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  english_pob_choice: the tribes of your inheritance
  chosen_korean: 주의 기업의 지파들
  alternatives_korean:
  - 주의 유업의 지파들
  - 주의 상속의 지파들
  lexicon: HALOT
  rationale: שִׁבְטֵי는 ‘지파들’로 직역하고, נַחֲלָה는 언약적 의미를 살려 ‘기업’으로 옮겼습니다. 한국어 성경에서 ‘기업’은 하나님이 자기 백성을 소유하신다는 함의를 보존합니다.
theological_decisions:
- issue: 하나님이 백성을 길에서 벗어나게 하시고 마음을 굳어지게 하신다는 직접 귀속
  chosen_reading: 직접 귀속을 본문에 그대로 유지했습니다.
  alternative_readings:
  - 허용적 표현으로 완화해 ‘우리가 벗어나도록 두시고’처럼 옮김
  rationale: 히브리어는 사역형을 사용하며, 이 본문은 하나님의 주권과 백성의 탈선 사이의 긴장을 해소하지 않고 탄식 속에 드러냅니다. 번역에서 이를 완화하면 본문의 신학적 충돌이 사라집니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 해소하지 말고 보존할 것'
- issue: ‘우리의 마음’의 공동체적 단수/복수 처리
  chosen_reading: 한국어에서는 자연스러운 복수형 ‘우리의 마음’으로 옮겼습니다.
  alternative_readings:
  - 우리의 마음(단수형 유지)
  rationale: 히브리어의 단수 집합표현은 원문적 특징이지만, 한국어에서는 복수형이 더 자연스럽고 독자가 오해 없이 공동체 전체의 상태로 이해할 수 있습니다.
  doctrine_reference: 시적/탄식 문맥에서의 집합명사 처리
