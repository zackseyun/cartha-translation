review_pass:
  verdict: revise
  source_fidelity: 히브리어의 직접 사역형(‘우리로 벗어나게 하시고’, ‘우리의 마음을 완고하게 하시고’)과 탄식의 질문 형식, 그리고 하나님께 ‘돌아오소서’라고 청하는 내용을 대체로 잘 보존했습니다. 다만 ‘주의 기업의 지파들’은 소유·속격 관계가 다소 불분명하므로, 지파들이 곧 하나님의 기업이라는 원문의 관계를 명시하는 편이 정확합니다. ‘굳어지게 하시고’도 문맥상 가능하나, ‘마음을 완고하게 하시고’가 קשׁח의 의미와 ‘경외에서 멀어짐’의 관계를 더 분명하고 자연스럽게 드러냅니다.
  naturalness: 합쇼체와 탄식 기도의 문체는 적절합니다. 그러나 ‘우리의 마음을 주를 경외하는 데서 굳어지게 하시고’는 한국어 결합이 다소 어색합니다. 또한 각주 표지는 해당 어휘·구절에 붙이는 것이 독자의 확인에 훨씬 분명합니다.
  terminology: ‘야훼’, ‘경외’, ‘주의 종들’, ‘기업’, ‘지파들’은 현대 한국어 성경·예배 문맥에서 적절합니다. ‘기업인 지파들’로 고치면 נַחֲלָתֶךָ가 가리키는 언약적 소유 관계를 보존하면서도 ‘기업의 지파들’의 모호함을 피할 수 있습니다.
  issues:
