revisions:
- from: 어찌하여, 야훼여, 주께서는 우리가 주의 길에서 벗어나게 하시고 우리의 마음을 주를 경외하는 데서 굳어지게 하십니까? 주의 종들, 곧 주의 기업의 지파들을 위하여 돌아오소서.[a][b][c]
  to: 어찌하여[a] 야훼여, 주께서는 우리가 주의 길에서 벗어나게 하시고 주를 경외하지 않도록 우리의 마음을[b] 완고하게 하십니까? 주의 종들, 곧 주의 기업인 지파들을 위하여 돌아오소서.[c]
  rationale: 직접적인 하나님의 사역을 유지하되, ‘경외에서 멀어지게 하는 마음의 완고함’을 자연스러운 한국어로 표현했습니다. 또한 지파들이 하나님의 기업이라는 원문의 관계를 ‘기업인’으로 분명히 하고, 각주 표지를 해당 표현에 배치했습니다.
  reviewer_model: gpt-5.6-terra
