id: ISA.63.18
reference: Isaiah 63:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מִּצְעָ֕ר יָרְשׁ֖וּ עַם קָדְשֶׁ֑/ךָ צָרֵ֕י/נוּ בּוֹסְס֖וּ מִקְדָּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
  footnotes:
  - marker: a
    text: Or 'for a little while' or 'briefly.' The Hebrew phrase may express brevity or small extent.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'possessed' leaves the object unstated; context implies the land or inheritance, not necessarily the sanctuary itself.
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 거룩한 백성은 그것[b]을 잠시 동안[a] 차지하였고, 우리의 대적들은 주님의 성소를 짓밟았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠시 동안’은 히브리어 표현이 시간의 짧음이나 규모의 작음을 나타낼 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’은 히브리어가 생략한 목적어를 문맥에 따라 보충한 것입니다. 여기서는 땅이나 기업을 가리키는 것으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּצְעָר
  english_pob_choice: for a little while
  chosen_korean: 잠시 동안
  alternatives_korean:
  - 짧은 동안
  - 잠깐
  - 아주 잠시
  lexicon: HALOT
  rationale: מִצְעָר는 규모의 작음이나 기간의 짧음을 나타내므로, 여기서는 문맥상 시간의 짧음을 살려 ‘잠시 동안’으로 옮겼습니다.
- source_word: יָרְשׁוּ
  english_pob_choice: possessed it
  chosen_korean: 그것을 차지하였고
  alternatives_korean:
  - 그것을 소유하였고
  - 그것을 차지했었고
  - 그것을 물려받았고
  lexicon: HALOT
  rationale: ירשׁ는 ‘상속하다/소유하다/차지하다’의 뜻이 있으나, 애가 문맥에서 일시적 점유의 뉘앙스를 살리기 위해 ‘차지하다’를 택했습니다.
- source_word: עַם קָדְשֶׁךָ
  english_pob_choice: your holy people
  chosen_korean: 주님의 거룩한 백성
  alternatives_korean:
  - 주님의 성스러운 백성
  - 주님의 거룩한 ժողովրդի
  - 주님의 거룩한 백성들
  lexicon: HALOT
  rationale: 직역의 ‘거룩함의 백성’보다 소유 관계와 성별된 신분을 자연스럽게 드러내는 ‘주님의 거룩한 백성’이 한국어로 가장 직접적입니다.
- source_word: צָרֵינוּ
  english_pob_choice: our adversaries
  chosen_korean: 우리의 대적들
  alternatives_korean:
  - 우리의 적들
  - 우리의 원수들
  - 우리의 적대자들
  lexicon: HALOT
  rationale: צָר는 단순한 적보다 ‘대적/적대자’의 대립성을 강하게 띠므로, 시적·탄식적 어조를 살려 ‘대적들’로 옮겼습니다.
- source_word: בּוֹסְסוּ
  english_pob_choice: have trampled
  chosen_korean: 짓밟았습니다
  alternatives_korean:
  - 밟아 짓이겼습니다
  - 밟고 다녔습니다
  - 발로 짓밟았습니다
  lexicon: HALOT
  rationale: בוסס는 성소를 모독하는 ‘짓밟다/유린하다’의 뜻을 지니므로, 한국어에서도 훼손과 모독의 감각이 분명한 ‘짓밟았습니다’를 선택했습니다.
- source_word: מִקְדָּשֶׁךָ
  english_pob_choice: your sanctuary
  chosen_korean: 주님의 성소
  alternatives_korean:
  - 주님의 성전
  - 주님의 거룩한 곳
  - 주님의 성막
  lexicon: HALOT
  rationale: מקדש는 특정 건물로 좁히기보다 거룩한 공간 일반을 가리키므로, 본문이 지닌 성스러운 공간성을 보존하는 ‘성소’가 적절합니다.
theological_decisions:
- issue: 히브리어의 소유·점유 대상이 첫 절에 명시되지 않음
  chosen_reading: 한국어에서는 대상을 ‘그것’으로 보충해, 첫 절이 막연한 소유 진술로 끝나지 않도록 했습니다.
  alternative_readings:
  - 대상을 생략해 ‘주님의 거룩한 백성은 잠시 동안 차지하였고…’로 둘 수 있음
  - 대상을 ‘땅’으로 구체화할 수 있음
  rationale: 영어 POB도 동일하게 중립적 대명사로 보완하듯, 히브리어의 생략을 과도하게 특정하지 않고 문맥상 이해 가능한 ‘그것’을 유지하는 것이 가장 안전합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: לַמִּצְעָר의 의미
  chosen_reading: 시간적 의미인 ‘잠시 동안’으로 읽었습니다.
  alternative_readings:
  - ‘적은 정도로’
  - ‘작은 몫으로’
  rationale: 탄식의 핵심은 하나님의 백성이 잠깐만 차지했을 뿐이라는 대조이므로, 문맥상 시간적 의미가 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §6
