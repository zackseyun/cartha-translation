  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
  footnotes:
  - marker: a
    text: Or, 'with garments stained red.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'striding' in the greatness of his strength.
    reason: lexical_alternative
  - marker: c
    text: Or, 'speaking in justice.'
    reason: alternative_reading
translation:
  language: ko
  text: 에돔에서, 곧 보스라에서 붉게 물든 옷[a]을 입고 오는 이, 옷차림이 화려하고 큰 능력으로 나아가는[b] 이는 누구입니까? “나는 의롭게 말하며[c], 구원하기에 능합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘진홍빛 옷’.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘큰 능력으로 성큼성큼 걷는’.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘정의로 말하며’.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֱדוֹם
  english_pob_choice: from Edom
  chosen_korean: 에돔에서
  alternatives_korean:
  - 에돔으로부터
  - 에돔 땅에서
  lexicon: WLC/지명
  rationale: 히브리어 전치사 מִן/מֵ는 출발점을 나타내므로 한국어도 ‘에서’로 자연스럽게 옮겨 지리적 출처를 분명히 했습니다.
- source_word: חֲמוּץ בְּגָדִים
  english_pob_choice: with crimson garments
  chosen_korean: 붉게 물든 옷
  alternatives_korean:
  - 진홍빛 옷
  - 피에 물든 옷
  - 붉게 물든 의복
  lexicon: HALOT
  rationale: POB의 ‘crimson garments’에 맞추되, 한국어에서는 ‘옷’에 ‘붉게 물든’을 붙여 색상과 물든 상태를 함께 살렸습니다. 본문만으로 원인(염색/피)을 단정하지 않도록 했습니다.
- source_word: הָדוּר בִּלְבוּשׁוֹ
  english_pob_choice: this one splendid in his clothing
  chosen_korean: 자기 옷차림이 장중하고
  alternatives_korean:
  - 옷차림이 화려하고
  - 자기 의복이 장엄하고
  - 그 옷차림이 빛나고
  lexicon: HALOT
  rationale: הָדוּר는 외형적 위엄·장식을 가리키므로 ‘장중하다’로 옮겨 과도한 신학적 해석 없이 위엄 있는 분위기를 살렸습니다. ‘옷차림’은 לְבוּשׁ의 현대적 대응으로 자연스럽습니다.
- source_word: צֹעֶה
  english_pob_choice: marching
  chosen_korean: 나아가는
  alternatives_korean:
  - 행진하는
  - 성큼성큼 걷는
  - 전진하는
  lexicon: HALOT
  rationale: 어휘가 난해하므로 POB가 채택한 ‘marching’의 해석을 반영하되, 한국어에서는 과도한 군사적 뉘앙스를 줄이기 위해 ‘나아가는’으로 처리했습니다.
- source_word: בְּרֹב כֹּחוֹ
  english_pob_choice: in the greatness of his strength
  chosen_korean: 큰 능력으로
  alternatives_korean:
  - 그 능력의 크기로
  - 힘의 عظ대함 속에서
  - 큰 힘으로
  lexicon: HALOT
  rationale: רֹב+כֹחַ는 ‘힘/능력의 풍성함·크기’를 나타내므로, 한국어에서는 간결하게 ‘큰 능력으로’로 옮겨 규모와 동력을 함께 전달했습니다.
- source_word: מְדַבֵּר בִּצְדָקָה
  english_pob_choice: speaking in righteousness
  chosen_korean: 의로 말하며
  alternatives_korean:
  - 의 가운데 말하며
  - 의 안에서 말하며
  - 의롭게 말하며
  lexicon: HALOT
  rationale: ב + צְדָקָה를 단순 부사화한 ‘의롭게’보다, 히브리어의 전치사 구조를 살리는 ‘의로’가 더 직접적입니다. ‘말하며’는 ‘speaking’의 진행적 화법을 자연스럽게 반영합니다.
- source_word: רַב לְהוֹשִׁיעַ
  english_pob_choice: mighty to save
  chosen_korean: 구원하기에 능한 이입니다
  alternatives_korean:
  - 구원에 능한 이입니다
  - 구원하기에 강한 이입니다
  - 구원할 힘이 많은 이입니다
  lexicon: HALOT
  rationale: רַב는 ‘많은/큰/막강한’의 의미를 가지므로, 한국어에서는 ‘능한’으로 옮겨 구원 행위에 대한 능력·충분성을 살렸습니다. 문맥상 인격적 주어를 유지하기 위해 ‘이입니다’를 덧붙였습니다.
theological_decisions:
- issue: 정체를 밝히지 않는 응답자의 신원
  chosen_reading: 본문의 극적 대화를 유지하여, 화자의 정체를 한국어 본문에서 단정하지 않았습니다.
  alternative_readings:
  - 야훼의 전사로 명시
  - 메시아적 인물로 명시
  - 예언적 의인화로 명시
  rationale: 히브리어는 질문과 1인칭 응답만 제시하며 해석을 열어 둡니다. 본문이 허용하는 긴장을 보존하기 위해 식별을 본문에 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
- issue: צְדָקָה의 번역
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 공의
  rationale: 이 구절에서 화자의 말이 단순한 도덕성보다 언약적·법정적 올바름을 함께 품고 있으므로, 한국어에서는 포괄적으로 ‘의’로 두었습니다.
  doctrine_reference: Contested semantic range of צְדָקָה in prophetic diction.
