revisions:
- from: 에돔에서 오는 이가 누구입니까[a]—붉게 물든 옷[b]을 입고 보스라에서 오는 이, 자기 옷차림이 장중하고 큰 능력으로 나아가는 이입니까? “바로 나입니다. 의[c]로 말하며 구원하기에 능한 이입니다.”
  to: 에돔에서, 곧 보스라에서 붉게 물든 옷[a]을 입고 오는 이, 옷차림이 화려하고 큰 능력으로 나아가는[b] 이는 누구입니까? “나는 의롭게 말하며[c], 구원하기에 능합니다.”
  rationale: 문장 구조를 하나의 질문으로 정리하여 히브리어의 수식어 열거를 반영했고, 두 지명과 붉은 색채의 모호성을 유지했습니다. הָדוּר에는 현대어로 자연스러운 ‘화려하고’를 사용했으며, צֹעֶה와 צְדָקָה의 주요 해석 가능성은 각주에 남겼습니다. 응답은 합쇼체를 유지하되 히브리어 1인칭 화자의 직접 진술로 바로잡았습니다.
