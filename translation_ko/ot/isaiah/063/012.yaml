  source_fidelity: 초안의 ‘그들을 앞지나’는 מִפְּנֵיהֶם(‘그들 앞에서’)를 ‘그들을 앞질러’라는 다른 뜻으로 바꾸므로 수정이 필요합니다. מוֹלִיךְ는 하나님의 ‘영광스러운 팔’을 모세의 오른편에서 이끌어 가게 하신다는 표현으로, 이를 그대로 유지했습니다. לַעֲשׂוֹת לוֹ שֵׁם עוֹלָם은 자신을 위하여 영원한 이름을 이루시려는 목적을 나타냅니다.
  naturalness: ‘모세의 오른편에’보다 ‘모세의 오른편에서’가 팔의 활동 위치를 자연스럽게 나타냅니다. 이 절은 앞 절의 ‘어디 계십니까?’에 이어지는 관계절이므로, 한국어에서도 질문의 완결을 반영해 자연스러운 합쇼체 문장으로 정리했습니다.
  terminology: ‘영광스러운 팔’, ‘영원한 이름’은 원문의 비유적·신학적 어휘를 과도하게 해석하지 않고 유지했습니다. ‘자신을 위하여’는 לוֹ의 재귀적 지시를 명시합니다.
  issues:
