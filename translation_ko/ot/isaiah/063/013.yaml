translation:
  language: ko
  text: 그들을 깊은 곳을 지나 이끄셨고, 그들은 광야의 말처럼 걸려 넘어지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊은 물을 지나서’. 히브리어는 ‘깊은 곳들’을 말하며, 출애굽 때의 건넘을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיכָם
  english_pob_choice: leading them
  chosen_korean: 그들을 … 이끄셨으나
  alternatives_korean:
  - 그들을 이끌고 계셨으나
  - 그들을 인도하셨으나
  lexicon: HALOT
  rationale: 히필 분사로서 지속적·서술적 진행을 나타내므로, 과거 서술 속에서 자연스럽게 이어지는 「이끄셨으나」로 옮겼습니다. POB의 participial flow를 살리되 한국어 문장으로는 매끄럽게 처리했습니다.
- source_word: בַּתְּהֹמֹות
  english_pob_choice: through the depths
  chosen_korean: 깊음 속으로
  alternatives_korean:
  - 깊음 가운데로
  - 깊은 물속으로
  - 깊은 바다 속으로
  lexicon: HALOT
  rationale: תְּהֹמוֹת은 단순한 ‘장소’보다 물의 깊은 심연을 가리키는 말이어서, 이동 방향을 드러내는 「속으로」를 써서 ‘through the depths’의 통과 이미지를 살렸습니다.
- source_word: כַּסּוּס בַּמִּדְבָּר
  english_pob_choice: like a horse in the wilderness
  chosen_korean: 광야의 말처럼
  alternatives_korean:
  - 광야 속의 말처럼
  - 광야에 있는 말처럼
  lexicon: HALOT
  rationale: 비유 구조를 간결한 한국어 관용으로 옮겨 「광야의 말처럼」으로 했습니다. 말의 거침없는 진행과 광야 이미지가 함께 살아납니다.
- source_word: לֹא יִכָּשֵׁלוּ
  english_pob_choice: they did not stumble
  chosen_korean: 그들은 걸려 넘어지지 않았습니다
  alternatives_korean:
  - 그들은 넘어지지 않았습니다
  - 그들은 비틀리지 않았습니다
  lexicon: HALOT
  rationale: כשל의 기본 의미인 ‘비틀거리다/걸려 넘어지다’를 살려, 단순한 ‘넘어지다’보다 구체적인 「걸려 넘어지지 않았습니다」를 택했습니다.
theological_decisions:
- issue: 출애굽의 물길 이미지와 ‘깊음’의 번역 범위
  chosen_reading: ‘깊음 속으로’로 옮겨, 본문의 심연 이미지는 살리되 ‘바다’라는 말을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 바다 속으로
  - 깊은 물속으로
  rationale: 히브리어 תְּהֹמוֹת 자체는 ‘깊음들/심연들’이 더 직접적이므로, 문맥의 출애굽 암시는 유지하되 어휘는 원문에 가깝게 두는 편이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
