  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/כֹ֣ל הַ/יּ֔וֹם יַחֲרֹ֥שׁ הַ/חֹרֵ֖שׁ לִ/זְרֹ֑עַ יְפַתַּ֥ח וִֽ/ישַׂדֵּ֖ד אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/024.yaml
  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
  footnotes:
  - marker: a
    text: Or 'Does he keep breaking up and leveling his soil?' The Hebrew agricultural verbs can be rendered more generally, but the main text preserves the likely sequence of field preparation.
    reason: lexical_alternative
translation:
  language: ko
  text: 밭가는 사람은 씨를 뿌리려고 온종일 밭을 가는 것입니까? 그는 계속 자기 땅을 엎고 고르지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자기 흙을 깨고 고르지 않습니까?' 히브리어의 농업 동사들은 좀 더 일반적으로 옮길 수 있지만, 본문은 밭 준비의 가능한 순서를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  english_pob_choice: Does ... all day
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 계속해서 하루 종일
  lexicon: HALOT
  rationale: 히브리어의 수사 의문문을 한국어로 자연스럽게 옮기되, 시간의 전면성을 살리기 위해 '온종일'을 사용했습니다.
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  english_pob_choice: the plowman plow
  chosen_korean: 밭가는 사람은 ... 밭을 가는 것입니까
  alternatives_korean:
  - 농부는 ... 밭을 가는 것입니까
  - 가는 사람은 ... 가는 것입니까
  lexicon: HALOT
  rationale: '''플로우먼/플로우''의 반복 효과를 한국어에서도 살리기 위해 ''밭가는 사람''과 ''밭을 가다''를 대응시켰습니다.'
- source_word: לִזְרֹעַ
  english_pob_choice: to sow
  chosen_korean: 씨를 뿌리려고
  alternatives_korean:
  - 파종하려고
  - 심으려고
  lexicon: HALOT
  rationale: 목적의 부정사 의미를 살려 '—하려고'로 풀었고, 농사 맥락에서는 '씨를 뿌리다'가 가장 직접적입니다.
- source_word: יְפַתַּח וִישַׂדֵּד אַדְמָתוֹ
  english_pob_choice: keep opening and harrowing his ground
  chosen_korean: 계속 자기 땅을 엎고 고르지 않습니까
  alternatives_korean:
  - 계속 흙을 뒤엎고 고르지 않습니까
  - 계속 땅을 깨고 평평하게 하지 않습니까
  lexicon: HALOT
  rationale: פתח와 שדד는 경작 과정의 연속 동작을 가리키므로, 문자적 기계 번역보다 경작 이미지가 자연스럽게 드러나는 '엎고 고르다'를 택했습니다.
theological_decisions:
- issue: 예언서의 수사 의문문 처리
  chosen_reading: 두 개의 수사 의문문을 그대로 살려, 농부의 상식적 노동 순서를 전제하는 문장으로 옮겼습니다.
  alternative_readings:
  - 서술문으로 평서화
  - 설명적인 문장으로 풀어쓰기
  rationale: 이 절은 비유적 질문 형식 자체가 논지를 이루므로, 질문의 긴장과 상식을 묻는 효과를 보존하는 편이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: Isaiah 28 문맥의 수사적 교훈
- issue: 경작 동사의 번역 강도
  chosen_reading: '''엎고 고르다''로 옮겨, 밭을 준비하는 연속 과정을 드러냈습니다.'
  alternative_readings:
  - '''열고 써레질하다'''
  - '''갈아엎고 써레질하다'''
  rationale: 히브리어 동사들의 농사 현장성을 살리면서도 한국어에서 이해 가능한 표현으로 균형을 잡았습니다.
  doctrine_reference: 예언서의 농경 비유
