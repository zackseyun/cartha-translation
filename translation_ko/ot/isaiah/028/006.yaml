id: ISA.28.6
reference: Isaiah 28:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/ר֖וּחַ מִשְׁפָּ֑ט לַ/יּוֹשֵׁב֙ עַל הַ/מִּשְׁפָּ֔ט וְ/לִ֨/גְבוּרָ֔ה מְשִׁיבֵ֥י מִלְחָמָ֖ה שָֽׁעְרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
  footnotes:
  - marker: a
    text: Or 'a spirit of judgment.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on the judgment seat' for 'in judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'those who repel the battle/war at the gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 공의의 영과 재판하는 자에게는 심판의 영을, 성문에서 전쟁을 물리치는 자들에게는 힘을 주십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판의 영’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재판석에 앉은 이에게’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성문에서 전쟁을 되돌리는 자들에게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  english_pob_choice: and a spirit of justice
  chosen_korean: 공의의 영
  alternatives_korean:
  - 심판의 영
  - 정의의 영
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 재판 행위만이 아니라 올바른 판결과 질서를 포괄하는 성격을 가리키므로, ‘공의’가 문맥상 가장 자연스럽고 폭이 좁지 않습니다.
- source_word: לַיּוֹשֵׁב עַל הַמִּשְׁפָּט
  english_pob_choice: to the one who sits in judgment
  chosen_korean: 재판하는 자에게
  alternatives_korean:
  - 판결석에 앉은 자에게
  - 재판석에 앉은 이에게
  lexicon: HALOT
  rationale: 직역하면 ‘재판 위에 앉아 있는 이’이지만, 한국어에서는 직무를 드러내는 ‘재판하는 자’가 자연스럽고 의미를 덜 흐립니다.
- source_word: וְלִגְבוּרָה
  english_pob_choice: and strength
  chosen_korean: 힘을
  alternatives_korean:
  - 능력을
  - 용맹을
  lexicon: HALOT
  rationale: גְּבוּרָה는 전투 맥락에서 힘/용맹의 뜻이 있으나, 앞의 공의와 짝을 이루는 축복 표현으로는 일반적이고 포괄적인 ‘힘’이 가장 적절합니다.
- source_word: מְשִׁיבֵי מִלְחָמָה שַׁעְרָה
  english_pob_choice: to those who turn back the battle at the gate
  chosen_korean: 성문에서 전쟁을 물리치는 자들에게
  alternatives_korean:
  - 성문에서 싸움을 되돌리는 자들에게
  - 성문에서 전투를 막아내는 자들에게
  lexicon: HALOT
  rationale: מְשִׁיבֵי는 ‘되돌리다/물리치다’의 능동적 의미이고, שַׁעְרָה는 성문 부근을 가리키므로 ‘성문에서 전쟁을 물리치는’으로 현장감을 살렸습니다.
theological_decisions:
- issue: מִשְׁפָּט의 번역을 ‘정의’로 할지 ‘공의/심판’으로 할지
  chosen_reading: ‘공의의 영’으로 옮겨, 재판 기능을 넘어서 하나님의 질서와 올바른 판결을 함께 드러냈습니다.
  alternative_readings:
  - 심판의 영
  - 정의의 영
  rationale: 이 절은 통치자/재판관에게 주어지는 자질을 말하므로, ‘공의’가 한국어 독자에게 가장 넓고도 문맥에 맞는 의미를 전달합니다. 다만 ‘심판’ 가능성은 본문 의미의 한 축이어서 대안으로 남깁니다.
  doctrine_reference: Isaiah 28:6의 왕권/재판관 자질 묘사
- issue: 전쟁·전투 문맥의 표현을 완화할지 유지할지
  chosen_reading: 전쟁 이미지를 유지하여, 성문에서 적대 세력을 막아내는 실제적 군사 상황을 분명히 드러냈습니다.
  alternative_readings:
  - 싸움을 막는 자들에게
  - 전투를 막아내는 자들에게
  rationale: 이 절의 병행구는 법정과 전장 두 영역을 함께 그리므로, 군사적 긴장을 약화시키지 않는 번역이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 원문 수사와 병행법 보존
