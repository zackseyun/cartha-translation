revisions:
- from: 그리고 공의의 영과 재판하는 자에게는 심판의 영을, 성문에서 전쟁을 물리치는 자들에게는 힘을 주십니다.[a][b][c]
  to: 또한 재판하는 이에게는 공의의 영이 되시며[a], 성문에서 전투를 물리치는 이들에게는 힘이 되십니다.[b][c]
  rationale: 원문의 수식 관계를 바로잡아 ‘공의의 영’이 재판하는 이에게, ‘힘’이 성문에서 전투를 물리치는 이들에게 각각 관련되도록 했습니다. 앞 절에 이어지는 술어는 ‘되시며/되십니다’로 반영했습니다. 각주 앵커는 해당 표현 뒤에 배치하여 대안의 지시 대상도 분명하게 했습니다.
