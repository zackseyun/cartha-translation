  - 자리
  - 눕는 곳
  lexicon: HALOT
  rationale: 몸을 뻗는 대상이라는 문맥을 살리면서도 현대 한국어에서 너무 구어적이지 않은 ‘침상’이 적절합니다.
- source_word: מֵהִשְׂתָּרֵעַ
  english_pob_choice: to stretch oneself out on
  chosen_korean: 몸을 뻗을 수 없고
  alternatives_korean:
  - 눕기에는
