  lexicon: HALOT
  rationale: 히브리어의 재귀적 동작을 살리되 한국어에서는 행위 가능성의 부정을 통해 자연스럽게 표현했습니다.
- source_word: הַמַּסֵּכָה
  english_pob_choice: the covering
  chosen_korean: 덮개
  alternatives_korean:
  - 담요
  - 덮는 것
  - 이불
  lexicon: HALOT
  rationale: 문맥상 침구용 덮개라는 점을 드러내면서도, 어근이 지닌 일반적 ‘덮는 것’의 의미를 과도하게 좁히지 않기 위해 ‘덮개’를 택했습니다.
- source_word: כְּהִתְכַּנֵּס
  english_pob_choice: to wrap oneself in
  chosen_korean: 몸을 감쌀 수 없기
  alternatives_korean:
  - 둘러쌀 수 없기
  - 감싸 쓸 수 없기
  - 몸을 웅크려 감쌀 수 없기
  lexicon: HALOT
  rationale: 자기 몸에 둘러 감는 동작을 자연스러운 한국어로 옮겼으며, 반사적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 문맥상 동일 어근의 이중 의미 가능성(덮개/우상 주조물)
  chosen_reading: 여기서는 침구용 덮개로 읽었습니다.
  alternative_readings:
  - 주조한 형상
  - 우상
  rationale: 본문은 침상과 몸을 뻗고 감싸는 동작을 병렬로 제시하므로, 문맥이 명확하게 침구 이미지를 지시합니다. 같은 어근의 다른 용례 가능성은 각주로만 남기는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 사전적 다의성은 본문 문맥으로 판별
