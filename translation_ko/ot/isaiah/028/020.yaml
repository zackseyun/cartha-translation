source:
  edition: WLC
  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
  footnotes:
  - marker: a
    text: Or 'the blanket'; the Hebrew noun here refers to a bed-covering, though elsewhere a related form can refer to a cast image. Context determines the sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 침상이 지나치게 짧아 몸을 뻗을 수 없고, 덮개가 너무 좁아 몸을 감쌀 수 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘담요’. 여기의 히브리어 명사는 침구용 덮개를 가리키지만, 다른 곳에서는 관련된 형태가 주조한 형상을 가리킬 수 있습니다. 문맥이 뜻을 결정합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 이는 ... 때문입니다
  - 곧
  lexicon: HALOT
  rationale: 앞절에 대한 설명적 근거를 자연스럽게 연결하기 위해 원인·이유를 나타내는 종결 표현으로 옮겼습니다.
- source_word: הַמַּצָּע
  english_pob_choice: the bed
  chosen_korean: 침상
  alternatives_korean:
