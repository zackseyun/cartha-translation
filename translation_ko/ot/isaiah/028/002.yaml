id: ISA.28.2
reference: Isaiah 28:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
  footnotes:
  - marker: a
    text: Or 'for the Lord there is one mighty and strong.' The Hebrew phrase may emphasize that this agent belongs to the Lord or stands ready for his use.
    reason: lexical_alternative
  - marker: b
    text: Or 'he lays it low to the ground by hand.' The Hebrew verb can be rendered less violently, but the storm imagery favors a forceful sense.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오[a], 주님께는 강하고 힘센 이가 있습니다. 그는 우박 폭풍 같고 파괴하는 폭풍 같으며, 큰 물이 거세게 넘쳐흐르는 급류 같아서, 손으로 그것을 땅에 내던집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님에게는 강하고 힘센 이가 있다.” 히브리어 표현은 이 존재가 주님께 속하거나 주님께서 쓰실 수 있도록 마련되어 있음을 강조할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 손으로 그것을 땅에 내려놓는다.” 히브리어 동사는 덜 격렬하게 옮길 수도 있으나, 폭풍의 비유는 강력한 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 주의 환기를 나타내는 담화 표지로서, 합쇼체에서 자연스럽고 직접적인 호소인 「보십시오」가 원문의 긴박함을 잘 살립니다.
- source_word: חָזָק וְאַמִּץ
  english_pob_choice: mighty and strong
  chosen_korean: 강하고 힘센
  alternatives_korean:
  - 힘세고 강한
  - 강력하고 힘센
  lexicon: HALOT
  rationale: 두 형용사의 병렬적 강조를 살리면서도 한국어에서 가장 자연스러운 힘의 중첩 표현으로 옮겼습니다.
- source_word: כְּזֶרֶם בָּרָד שַׂעַר קָטֶב
  english_pob_choice: like a storm of hail, a destroying tempest
  chosen_korean: 우박의 폭풍 같고, 파괴하는 폭풍 같으며
  alternatives_korean:
  - 우박 폭풍 같고, 멸망시키는 폭풍 같으며
  - 우박이 몰아치는 폭풍 같고, 파괴의 폭풍 같으며
  lexicon: HALOT
  rationale: זֶרֶם의 격렬한 기상 이미지를 ‘폭풍’으로 살리고, שַׂעַר קָטֶב은 단순한 강풍보다 파괴성을 드러내기 위해 ‘파괴하는 폭풍’으로 옮겼습니다.
- source_word: מַיִם כַּבִּירִים שֹׁטְפִים
  english_pob_choice: mighty, overflowing waters
  chosen_korean: 강하고 넘쳐흐르는 물의 폭풍
  alternatives_korean:
  - 크고 넘쳐흐르는 물
  - 강대하고 범람하는 물
  lexicon: HALOT
  rationale: כַּבִּירִים의 ‘강한/거대한’ 힘과 שֹׁטְפִים의 ‘넘쳐 흐르는’ 동작을 함께 보존하려고 ‘강하고 넘쳐흐르는’으로 처리했습니다.
- source_word: הִנִּיחַ לָאָרֶץ בְּיָד
  english_pob_choice: he casts it down to the earth with his hand
  chosen_korean: 그가 손으로 그것을 땅에 던져 버리십니다
  alternatives_korean:
  - 그가 손으로 그것을 땅에 떨어뜨리십니다
  - 그가 손으로 그것을 땅에 내리십니다
  lexicon: HALOT
  rationale: 문맥이 심판적 폭력을 띠므로, 단순한 ‘내리다/놓다’보다 힘 있게 떨어뜨리는 동작을 드러내는 ‘던져 버리다’가 원문의 이미지를 더 잘 전달합니다.
theological_decisions:
- issue: ‘주님께’에 담긴 אדֹנָי의 처리
  chosen_reading: 본문을 ‘주님께는’으로 옮겨, 어떤 강한 존재가 주님의 소유이거나 주님을 위한 준비된 도구라는 여지를 남겼습니다.
  alternative_readings:
  - 주님에게는
  - 주님을 위하여는
  rationale: 히브리어는 소유·귀속 또는 가용성을 모두 열어 두며, 영어 POB도 그 긴장을 보존합니다. 한국어도 해석을 단정하지 않고 그대로 유지했습니다.
  doctrine_reference: 해석의 긴장 보존
- issue: 마지막 절의 주어와 목적어의 지속
  chosen_reading: ‘그가 … 그것을’으로 처리해, 힘센 이가 계속 주어로 이어지고 대상은 문맥상 암시하도록 했습니다.
  alternative_readings:
  - 그가 … 그들을
  - 그가 … 그것을/그것들을
  rationale: 히브리어 단수 동사와 구문은 개인적 주어를 지지하지만, 한국어는 목적어를 보충해야 하므로 문맥상 가장 보수적인 단수형을 택했습니다.
  doctrine_reference: 문맥 기반 대명사 처리
