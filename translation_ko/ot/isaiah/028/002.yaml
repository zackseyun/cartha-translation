  source_fidelity: 원문의 병렬 비유와 마지막 절의 단수 주어·암시된 목적어를 대체로 따랐으나, 「강하고 넘쳐흐르는 물의 폭풍」은 ‘넘쳐흐르는 큰 물의 급류/물살’이라는 히브리어 표현에 ‘폭풍’을 중복하여 보태므로 수정이 필요합니다. 또한 הִנִּיחַ의 강제적 의미는 살리되 「던져 버리다」의 부가적 완결·배제 뉘앙스는 피하는 편이 안전합니다.
  naturalness: 「큰 물이 넘쳐흐르는 급류」는 현대 표준어에서 자연스럽고 원문의 홍수성 물살 이미지를 명확히 합니다. 「그가 손으로 그것을 땅에 내던집니다」는 합쇼체를 유지하면서도 불필요한 높임이나 구어적 「-버리다」를 피합니다.
  terminology: אֲדֹנָי는 문맥과 초안의 관례에 따라 「주님」으로 유지했습니다. 강한 존재의 정체, 마지막 목적어의 정확한 지시 대상은 본문에서 특정하지 않았습니다. 영어 감사 기록에 있는 주석 표지를 한국어 본문과 주석에 보존했습니다.
  issues:
