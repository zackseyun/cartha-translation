id: ISA.28.5
reference: Isaiah 28:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ יְהוָ֣ה צְבָא֔וֹת לַ/עֲטֶ֣רֶת צְבִ֔י וְ/לִ/צְפִירַ֖ת תִּפְאָרָ֑ה לִ/שְׁאָ֖ר עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.' The Hebrew title יְהוָה צְבָאוֹת is traditionally rendered 'LORD of Hosts'; 'of Armies' makes the underlying sense more transparent in modern English.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 만군의 야훼께서 그분의 백성의 남은 자들에게 아름다움의 관이 되시며 영광의 화관이 되십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼 체바오트’는 직역하면 ‘만군의 야훼’입니다. 전통적 한국어 성경에서는 흔히 ‘만군의 여호와’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간 표현을 자연스럽게 살리되, 종말론적 분위기를 유지하도록 짧고 분명하게 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주
  - 야훼 만군의 주님
  lexicon: HALOT
  rationale: 신명은 야훼로 유지하고, צְבָאוֹת은 문자적 의미를 살려 ‘만군’으로 옮겼습니다. 한국어에서는 ‘야훼 만군의 하나님’이 가장 자연스럽게 주어-호칭 관계를 드러냅니다.
- source_word: לַעֲטֶרֶת צְבִי
  english_pob_choice: a crown of beauty
  chosen_korean: 아름다운 관
  alternatives_korean:
  - 아름다움의 관
  - 아름다운 왕관
  lexicon: HALOT
  rationale: עֲטֶרֶת의 기본 의미를 ‘관’으로 살리고, צְבִי의 미적 의미를 ‘아름다운’으로 옮겨 뒤의 ‘영광스러운’과 구별되게 했습니다.
- source_word: וְלִצְפִירַת תִּפְאָרָה
  english_pob_choice: and a diadem of splendor
  chosen_korean: 영광스러운 왕관
  alternatives_korean:
  - 영광의 관
  - 찬란한 왕관
  lexicon: HALOT
  rationale: צְפִירָה는 장식된 둘레관/왕관의 느낌이 있어 ‘왕관’으로 옮기고, תִּפְאָרָה의 장엄함은 ‘영광스러운’으로 표현해 앞 구절과의 평행을 유지했습니다.
- source_word: לִשְׁאָר עַמּוֹ
  english_pob_choice: for the remnant of his people
  chosen_korean: 그의 백성의 남은 자에게
  alternatives_korean:
  - 그의 백성의 남은 자를 위해
  - 그 백성의 남은 자에게
  lexicon: HALOT
  rationale: שְׁאָר는 예언서에서 단순한 ‘나머지’보다 신학적으로 의미 있는 ‘남은 자’로 옮겼고, ל의 수혜/대상 의미를 살려 ‘-에게’로 처리했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유 신명으로 드러나므로, 한국어 전통 번역어 ‘주’나 관습적 대체어보다 원어의 신명인 ‘야훼’를 유지하는 것이 출처 충실성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צְבָאוֹת의 의미
  chosen_reading: 만군
  alternative_readings:
  - 군대
  - 군사들
  rationale: 히브리어 명칭은 ‘Hosts’의 전통적 관용보다 원뜻을 드러내는 집합 명사로 이해하는 것이 적절하며, 한국어에서는 ‘만군’이 가장 압축적이고 성경적 호칭으로 기능합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 5'
