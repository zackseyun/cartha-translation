id: ISA.28.15
reference: Isaiah 28:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
  footnotes:
  - marker: a
    text: Or “with Sheol we have made a pact/treaty.” The Hebrew term is difficult; some have taken it as “vision,” but in this context it most likely means an agreement parallel to “covenant.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew Sheol, the realm of the dead; not necessarily identical with later notions of hell.
    reason: cultural_note
  - marker: c
    text: Or “the overflowing scourge” or “the flooding whip.” The Hebrew expression is difficult and combines imagery of a sweeping flood and a striking scourge.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 말하기를 “우리는 죽음과 언약을 맺었고, 스올과 약정을 맺었다[a]. 넘쳐흐르는 재앙[b]이 지나가도 우리에게 미치지 않을 것이다. 우리는 거짓을 우리의 피난처로 삼았고, 속임수 속에 숨었다”라고 하였기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹזֶה는 여기서 앞의 ‘언약’과 병행되는 ‘약정’ 또는 ‘협정’을 뜻하는 것으로 이해됩니다. 일부는 이 말을 ‘환상’으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘넘쳐흐르는 재앙’은 난해한 히브리어 표현입니다. 홍수처럼 휩쓸고 넘치는 것과 채찍질하는 재앙의 이미지를 함께 담고 있을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘스올’은 히브리어 שְׁאוֹל을 음역한 말로, 죽은 자들의 영역을 가리킵니다. 후대의 ‘지옥’ 개념과 반드시 동일하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אֲמַרְתֶּם
  english_pob_choice: Because you have said
  chosen_korean: 너희가 말하기를 … 하였기 때문입니다
  alternatives_korean:
  - 너희가 말했기 때문입니다
  - 너희가 이렇게 말하였기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 심판 선언의 이유를 제시하는 접속사 כִּי를 ‘…때문입니다’로 살리고, 아말템은 직접인용을 도입하는 표현으로 자연스럽게 옮겼습니다.
- source_word: כָּרַתְנוּ בְרִית
  english_pob_choice: we have made a covenant
  chosen_korean: 우리는 … 언약을 맺었고
  alternatives_korean:
  - 우리는 …와 계약을 맺었고
  - 우리는 …와 언약을 세웠고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘언약을 자르다’를 현대 한국어의 자연한 표현인 ‘언약을 맺다’로 옮기되, 법적·언약적 힘은 유지했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 죽은 자들의 세계
  - 무덤
  lexicon: HALOT
  rationale: 후대의 ‘지옥’ 개념으로 평평하게 만들지 않기 위해 음역을 유지했습니다.
- source_word: שׁיט שׁוֹטֵף
  english_pob_choice: the overwhelming scourge
  chosen_korean: 넘쳐흐르는 재앙
  alternatives_korean:
  - 넘쳐흐르는 채찍
  - 휩쓸고 지나가는 재앙
  lexicon: HALOT
  rationale: 난해한 히브리어 이미지를 ‘홍수처럼 밀려오는 파괴’의 뉘앙스가 살아 있는 말로 옮겨, scourge와 flood의 결합 이미지를 과도하게 풀지 않았습니다.
- source_word: כָזָב / וּבַשֶּׁקֶר
  english_pob_choice: falsehood / deceit
  chosen_korean: 거짓 / 속임수
  alternatives_korean:
  - 거짓말 / 기만
  - 허위 / 속임
  lexicon: HALOT
  rationale: 두 추상명사를 병렬 구조로 살려, ‘거짓’을 피난처로 삼고 ‘속임수’ 속에 숨는 대구를 한국어에서도 분명히 드러냈습니다.
theological_decisions:
- issue: שְׁאוֹל의 개념 보존
  chosen_reading: 스올로 음역해, 본문이 말하는 죽은 자의 영역을 후대 교리 용어로 대체하지 않았습니다.
  alternative_readings:
  - 무덤
  - 지옥
  rationale: 본문의 수사적 대상을 그대로 보존하는 것이 중요하며, ‘지옥’은 본문의 의미 범위를 좁히고 ‘무덤’은 개념을 평면화할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 죽음과 스올의 인격화된 언약 파트너 이미지
  chosen_reading: ‘죽음과 언약’, ‘스올과 합의’라는 도전적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 비유적으로 단순화
  - 도치된 표현으로 완화
  rationale: 예언적 조롱과 반어의 강도를 약화시키지 않기 위해, 본문의 불편한 수사학을 설명으로 누그러뜨리지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
