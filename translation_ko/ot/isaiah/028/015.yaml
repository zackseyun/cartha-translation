revisions:
- from: 너희가 말하기를 「우리는 죽음과 언약을 맺었고, 스올과는 합의를 보았다. 넘쳐흐르는 재앙이 지나가더라도 우리에게는 미치지 않을 것이다. 우리는 거짓을 우리의 피난처로 삼았고, 속임수 속에 숨었다」고 하였기 때문입니다.[a][b][c]
  to: 너희가 말하기를 “우리는 죽음과 언약을 맺었고, 스올과 약정을 맺었다[a]. 넘쳐흐르는 재앙[b]이 지나가도 우리에게 미치지 않을 것이다. 우리는 거짓을 우리의 피난처로 삼았고, 속임수 속에 숨었다”라고 하였기 때문입니다.[c]
  rationale: ‘합의를 보았다’를 ‘약정을 맺었다’로 고쳐 언약 체결의 병렬성과 예언서의 격식을 살렸습니다. 원문 및 영어 POB 감사 기록에서 난해하다고 밝힌 חֹזֶה와 שִׁיט שׁוֹטֵף에 각주를 직접 연결했고, 스올 설명도 해당 용어에 연결했습니다. 죽음과 스올의 인격화는 본문 표현 자체로 보존하되 별도 교리적 해설은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
