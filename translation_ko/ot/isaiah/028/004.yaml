id: ISA.28.4
reference: Isaiah 28:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
  footnotes:
  - marker: a
    text: Or 'like a first-ripe fig before summer.' The Hebrew בִּכּוּרָה can denote first-ripe fruit more generally, though in this context the image is commonly understood as an early fig.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the valley of fatnesses,' an idiom for a rich or fertile valley.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그의 영화로운 아름다움의 시든 꽃은—비옥한 골짜기 꼭대기에 있는 그것은—여름이 오기 전의 이른 무화과와 같을 것입니다. 그것을 보는 사람은 누구나, 그것이 아직 그의 손에 있을 때 그것을 삼켜 버립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  english_pob_choice: the fading flower
  chosen_korean: 시든 꽃
  alternatives_korean:
  - 시들어 가는 꽃
  - 시든 꽃송이
  lexicon: HALOT
  rationale: צִיצַת는 꽃/꽃송이 같은 이미지이고 נֹבֵל은 시들다의 현재분사적 뉘앙스를 가지므로, 자연스러우면서도 이미지가 살아 있는 ‘시든 꽃’으로 옮겼습니다.
- source_word: צְבִי תִפְאַרְתּוֹ
  english_pob_choice: his glorious beauty
  chosen_korean: 그의 영화로운 아름다움
  alternatives_korean:
  - 그의 영광스러운 아름다움
  - 그의 빛나는 영화
  lexicon: HALOT
  rationale: צְבִי와 תִפְאַרְתּוֹ가 겹쳐 아름다움/영화의 강한 강조를 이루므로, 두 어감을 모두 살린 ‘영화로운 아름다움’으로 처리했습니다.
- source_word: גֵּיא שְׁמָנִים
  english_pob_choice: the fertile valley
  chosen_korean: 비옥한 골짜기
  alternatives_korean:
  - 풍요한 골짜기
  - 살진 골짜기
  lexicon: HALOT
  rationale: 직역하면 ‘기름진 것들의 골짜기’이지만 한국어에서는 관용적으로 풍요함을 드러내는 ‘비옥한 골짜기’가 원문의 지형적·상징적 뜻을 가장 분명히 전달합니다.
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  english_pob_choice: like an early fig before summer
  chosen_korean: 여름이 오기 전의 이른 무화과와 같을 것입니다
  alternatives_korean:
  - 여름 전에 난 첫 무화과와 같을 것입니다
  - 여름 전에 익은 처음 열매와 같을 것입니다
  lexicon: HALOT
  rationale: בִּכּוּרָה는 첫 익은 열매 일반을 가리킬 수 있지만, 문맥상 이른 무화과 이미지가 강하므로 POB의 선택을 따라 ‘이른 무화과’로 옮겼습니다.
- source_word: בְּכַפּוֹ
  english_pob_choice: in his hand
  chosen_korean: 그의 손에 있을 때
  alternatives_korean:
  - 그의 손바닥에 있을 때
  - 그의 손아귀에 있을 때
  lexicon: HALOT
  rationale: כַּף는 문자적으로 손바닥이지만, 한국어에서는 물건을 든 상태를 가장 자연스럽게 나타내는 ‘그의 손에 있을 때’가 본문 이미지와 시간적 긴박함을 모두 살립니다.
- source_word: יִבְלָעֶנָּה
  english_pob_choice: swallows it down
  chosen_korean: 삼켜 버립니다
  alternatives_korean:
  - 꿀꺽 삼켜 버립니다
  - 삼켜 넘깁니다
  lexicon: HALOT
  rationale: בלע의 핵심은 빠르고 즉각적인 삼킴/삼켜 버림이므로, 비유의 급박함을 살리는 ‘삼켜 버립니다’로 옮겼습니다.
theological_decisions:
- issue: 직유의 공격성 유지
  chosen_reading: 이 구절은 잘 익은 열매를 즉시 집어 삼켜 버리는 장면을 통해, 대상의 덧없음과 쉽게 빼앗김을 강하게 드러내는 직유로 읽었습니다.
  alternative_readings:
  - 단순히 아름다움을 칭찬하는 묘사로 완화하는 읽기
  - ‘삼켜 버린다’를 과장된 표현으로 약화하는 읽기
  rationale: 원문의 비교 구조와 동사 בלע의 강한 소비 이미지를 약화하면 예언적 경고의 효과가 줄어듭니다.
  doctrine_reference: 예언서의 심판 비유와 이미지 강도 보존
- issue: ‘그의’의 지시 대상 보존
  chosen_reading: 대명사적 소유격 ‘그의’를 유지해, 문맥에서 대상의 자기 영화가 문제된다는 점을 드러냈습니다.
  alternative_readings:
  - 소유격을 삭제해 일반적 표현으로 바꾸는 읽기
  - 대상을 명시적으로 풀어 쓰는 읽기
  rationale: 히브리어의 소유 표지가 지닌 수사적 긴장을 보존하기 위해 직관적이되 너무 해설적이지 않게 처리했습니다.
  doctrine_reference: 히브리어 수사 구조 보존
