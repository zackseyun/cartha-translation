source:
  edition: WLC
  text: אֶת מִי֙ יוֹרֶ֣ה דֵעָ֔ה וְ/אֶת מִ֖י יָבִ֣ין שְׁמוּעָ֑ה גְּמוּלֵי֙ מֵֽ/חָלָ֔ב עַתִּיקֵ֖י מִ/שָּׁדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
  footnotes:
  - marker: a
    text: Or 'report' or 'what is heard' for 'the message.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew leaves the subject of 'will he teach' and 'will he explain' implicit; context may suggest the speaker is referring mockingly to Isaiah.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 누구에게 지식을 가르치며, 누구에게 그 메시지를 설명하겠습니까? 젖에서 뗀 아이들, 가슴에서 떨어진 아이들에게 하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소식’, 혹은 ‘들리는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘가르치다’와 ‘설명하다’의 주어를 밝히지 않습니다. 문맥상 이사야를 조롱하는 말일 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה דֵעָה
  english_pob_choice: will he teach knowledge
  chosen_korean: 지식을 가르치며
  alternatives_korean:
  - 지식을 가르치겠습니까
  - 지식을 가르치고
  - 지식을 가르쳐 주겠습니까
  lexicon: HALOT
  rationale: 히필 יוֹרֶה는 ‘가르치다/교수하다’의 뜻이므로, 한국어에서는 자연스럽게 ‘지식을 가르치다’로 옮겼습니다.
- source_word: שְׁמוּעָה
  english_pob_choice: the message
  chosen_korean: 그 메시지
  alternatives_korean:
  - 그 소식
  - 그 보고
  - 그 전달된 말
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘소문’보다 가르쳐지는 내용 자체를 가리키므로, 현대 한국어에서 가장 직접적인 ‘메시지’로 옮겼습니다.
- source_word: גְּמוּלֵי מֵחָלָב
  english_pob_choice: Those weaned from milk
  chosen_korean: 젖에서 뗀 아이들
  alternatives_korean:
  - 젖을 뗀 자들
  - 젖에서 단 아이들
  lexicon: HALOT
  rationale: 수유를 끊은 어린이를 가리키는 표현이므로, 직역성을 유지하면서도 한국어로 자연스러운 ‘젖에서 뗀 아이들’로 옮겼습니다.
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  english_pob_choice: those taken from the breasts
  chosen_korean: 가슴에서 떨어진 아이들
  alternatives_korean:
  - 젖가슴에서 떼어진 아이들
  - 가슴에서 떼인 아이들
  lexicon: HALOT
  rationale: ‘떼다/떼어내다’의 수동적 의미를 살리되, 한국어에서 원문의 은유를 지나치게 생경하게 만들지 않도록 ‘떨어진’으로 처리했습니다.
theological_decisions:
- issue: 이사야의 대상이 누구인지에 대한 3인칭 단수의 모호성
  chosen_reading: 본문의 모호성을 유지하여 ‘그가’로 옮기고, 특정 화자를 확정하지 않았습니다.
  alternative_readings:
  - 여호와께서
  - 이사야가
  - 조롱하는 제사장들과 선지자들이
  rationale: 히브리어 본문은 주어를 명시하지 않으므로, 해석을 앞서 확정하지 않고 독자가 문맥에서 판단할 수 있도록 모호성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
