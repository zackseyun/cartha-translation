id: ISA.28.17
reference: Isaiah 28:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
  footnotes:
  - marker: a
    text: Or 'judgment' for 'justice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'plummet.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the hiding place'; the Hebrew term denotes a place of concealment or protection.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 공의를 측량줄로, 의를 수직추로 삼을 것입니다. 우박이 거짓의 피난처를 쓸어버리고, 물들이 은신처를 덮쳐 넘칠 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공의’로 번역한 מִשְׁפָּט은 여기서 ‘심판’보다 판정의 기준이 되는 바른 질서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: לְמִשְׁקָלֶת은 문자적으로는 ‘추’ 또는 ‘수직추’입니다.
    reason: lexical_alternative
  - marker: c
    text: מַחְסֵה כָזָב는 ‘거짓의 피난처’ 또는 ‘거짓된 피난처’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 삼을 것입니다
  alternatives_korean:
  - 내가 … 만들 것입니다
  - 내가 … 두겠습니다
  lexicon: HALOT
  rationale: 여기서는 단순히 ‘두다’보다, 두 개의 기준을 판정의 표준으로 ‘삼다’는 뜻이 더 분명하여 예언적 선언의 비유를 자연스럽게 살립니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 심판
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּט은 재판 행위보다 하나님이 세우시는 바른 기준을 가리키므로, 한국어 성경어법에서 그 의미 범위를 잘 드러내는 ‘공의’를 선택했습니다.
- source_word: לְקָו / לְמִשְׁקָלֶת
  english_pob_choice: the measuring line / the plumb line
  chosen_korean: 측량줄 / 수직추
  alternatives_korean:
  - 줄 / 추
  - 잣대 / 수직선
  lexicon: HALOT
  rationale: 건축 비유를 그대로 살리기 위해 ‘줄’보다 더 구체적인 ‘측량줄’, ‘plummet’의 기능을 드러내는 ‘수직추’를 택했습니다.
- source_word: וּצְדָקָה
  english_pob_choice: and righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: מִשְׁפָּט과 구별되는 윤리적·언약적 차원을 유지하려고, 한국어 성경의 핵심어인 ‘의’를 사용했습니다.
- source_word: מַחְסֵה כָזָב / וְסֵתֶר
  english_pob_choice: the refuge of lies / the shelter
  chosen_korean: 거짓의 피난처 / 은신처
  alternatives_korean:
  - 거짓된 피난처 / 숨는 곳
  - 거짓의 피신처 / 숨겨진 곳
  lexicon: HALOT
  rationale: מַחְסֵה와 סֵתֶר는 각각 보호 장소와 은닉처를 가리키므로, 두 이미지를 구분해 ‘피난처’와 ‘은신처’로 옮겼습니다.
theological_decisions:
- issue: 공의와 의의 병렬을 한국어로 어떻게 유지할 것인가
  chosen_reading: ‘공의 / 의’로 구분하여 번역했습니다.
  alternative_readings:
  - ‘정의 / 의로움’
  - ‘정의 / 정의’
  rationale: 원문은 두 개의 관련되지만 동일하지 않은 기준을 병렬로 제시합니다. 둘 다 ‘정의’로 평탄화하면 시적 대비와 신학적 뉘앙스가 약해지므로 구별을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
