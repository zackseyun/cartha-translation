source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
  footnotes:
  - marker: a
    text: Or 'sound wisdom' or 'resourcefulness' for 'wisdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것도 만군의 야훼에게서 나왔습니다. 그분의 계획은 놀라우며, 그분의 지혜는 크십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜’는 ‘건전한 지혜’ 또는 ‘실천적 지략’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם זֹאת
  english_pob_choice: This also
  chosen_korean: 이것도
  alternatives_korean:
  - 이것 또한
  - 이것 역시
  lexicon: HALOT
  rationale: 앞 문맥의 농사 비유에 이 진술을 덧붙이는 연결어로서, 간결하고 자연스러운 ‘이것도’가 원문의 추가 의미를 잘 살립니다.
- source_word: מֵעִם יְהוָה צְבָאוֹת / יָצָאָה
  english_pob_choice: has come from Yahweh of hosts
  chosen_korean: 만군의 야훼에게서 나왔습니다
  alternatives_korean:
  - 만군의 야훼에게서 나왔습니다
  - 만군의 야훼로부터 나왔습니다
  lexicon: HALOT
  rationale: מֵעִם은 출처를 나타내므로 ‘에게서/로부터’로 옮겼고, יָצָאָה는 완료된 발출을 나타내어 ‘나왔습니다’로 처리했습니다.
- source_word: הִפְלִיא עֵצָה
  english_pob_choice: he is wonderful in counsel
  chosen_korean: 조언에 있어 놀라우시고
  alternatives_korean:
  - 계획에 있어 놀라우시고
  - 모의에 있어 놀라우시고
  lexicon: HALOT
  rationale: עֵצָה는 문맥상 지략·계획·조언의 범위를 가지지만, 여기서는 하나님의 지혜로운 판단을 가리키므로 ‘조언’이 간결하면서도 적절합니다.
- source_word: הִגְדִּיל תּוּשִׁיָּה
  english_pob_choice: great in wisdom
  chosen_korean: 지혜에 있어 크십니다
  alternatives_korean:
  - 지혜가 크십니다
  - 탁월한 지혜를 지니십니다
  - 실천적 지혜에 있어 크십니다
  lexicon: HALOT
  rationale: תּוּשִׁיָּה는 단순한 지식보다 실질적·실천적 지혜를 가리키므로, 시적 평행을 살려 ‘지혜에 있어 크십니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 드러낼지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 용례에 따라 언약명 יהוה는 ‘야훼’로 옮겨, 시편·이사야의 신명 표지를 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 시적 평행의 인격적 술어 처리
  chosen_reading: 그분은 조언에 있어 놀라우시고 지혜에 있어 크십니다
  alternative_readings:
  - 그분은 조언이 놀라우시고 지혜가 크십니다
  - 그분은 놀라운 조언자시며 큰 지혜를 지니십니다
  rationale: 히브리어의 명사구 평행을 한국어에서 자연스러운 서술문으로 풀되, 하나님의 탁월한 지략과 지혜를 약화시키지 않도록 유지했습니다.
  doctrine_reference: Poetic parallelism and divine attribute rendering
