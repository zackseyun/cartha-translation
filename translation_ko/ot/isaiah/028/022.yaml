id: ISA.28.22
reference: Isaiah 28:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
  footnotes:
  - marker: a
    text: Or 'against the whole earth.' The Hebrew word can mean either 'land' or 'earth.'
    reason: alternative_reading
  - marker: b
    text: Or 'of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 조롱하지 마십시오. 그렇지 않으면 여러분의 결박이 더 강해질 것입니다. 이는 내가 온 땅에 대하여 만군의 주 하나님께로부터 완전히 정해진 멸망을 들었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅을 향하여’로도 옮길 수 있습니다. 히브리어 אָרֶץ는 ‘땅’과 ‘지구/세상’ 둘 다를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘만군의’입니다. 히브리어 צְבָאוֹת은 문자적으로 ‘군대들/군대의’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  - 지금
  lexicon: HALOT
  rationale: 앞선 경고를 이어받는 급박한 전환이므로, 인과와 시간 전환을 함께 드러내는 ‘그러므로 이제’가 자연스럽습니다.
- source_word: תִּתְלוֹצָצוּ
  english_pob_choice: scoff
  chosen_korean: 조롱하지 마십시오
  alternatives_korean:
  - 비웃지 마십시오
  - 빈정대지 마십시오
  - 조소하지 마십시오
  lexicon: HALOT
  rationale: לוץ의 경멸적 조롱을 현대 한국어에서 가장 직접적으로 살리는 표현으로 ‘조롱하지 마십시오’를 택했습니다.
- source_word: מֽוֹסְרֵיכֶם
  english_pob_choice: your bonds
  chosen_korean: 여러분의 결박
  alternatives_korean:
  - 여러분의 속박
  - 여러분의 족쇄
  - 여러분의 매임
  lexicon: HALOT
  rationale: 물리적이든 비유적이든 묶임의 이미지를 유지하면서, 예언적 심판의 문맥에 더 강하게 맞는 말로 ‘결박’을 선택했습니다.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: the Lord GOD of Armies
  chosen_korean: 만군의 주 하나님
  alternatives_korean:
  - 만군의 주 야훼
  - 만군의 주 하나님께서
  - 만군의 주 하나님
  lexicon: HALOT
  rationale: 아도나이+야훼+צְבָאוֹת의 중첩 칭호를 한국어에서 읽히도록 ‘주 하나님’으로 합치되, צְבָאוֹת은 관용적으로 ‘만군’으로 옮겨 위엄을 살렸습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: against the whole land
  chosen_korean: 온 땅에 대하여
  alternatives_korean:
  - 온 땅을 향하여
  - 그 땅 전체에
  - 온 땅 위에
  lexicon: HALOT
  rationale: עַל의 대항/대상 방향성을 살리되, אָרֶץ의 ‘땅/지면’과 ‘지역’ 가능성을 포괄하는 중립적 표현으로 유지했습니다.
theological_decisions:
- issue: יְהוָה를 한국어로 어떻게 처리할지
  chosen_reading: 본문에서는 ‘주 하나님’으로 자연스럽게 읽히게 하고, 고유한 이름 표기는 드러내지 않았습니다.
  alternative_readings:
  - 야훼
  - 주 야훼
  - 여호와
  rationale: 이 구절의 초점은 신적 칭호의 중첩과 심판 선포에 있으므로, 한국어 가독성을 위해 직역적 이름 표기보다 칭호 중심으로 번역했습니다.
  doctrine_reference: POB Korean rendering policy for compound divine titles
