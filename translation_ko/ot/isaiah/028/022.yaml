source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
  footnotes:
  - marker: a
    text: Or 'against the whole earth.' The Hebrew word can mean either 'land' or 'earth.'
    reason: alternative_reading
  - marker: b
    text: Or 'of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 조롱하지 마십시오. 그렇지 않으면 여러분의 결박이 더 단단해질 것입니다. 내가 만군[b]의 주 야훼에게서 온 땅 전체[a]에 내릴 철저히 작정된 멸망에 대한 말씀을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상 전체’. 히브리어 אָרֶץ는 문맥에 따라 ‘땅/나라’ 또는 ‘세상’을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 צְבָאוֹת은 문자적으로 ‘군대들’을 뜻하며, 관용적으로 ‘만군’으로 옮깁니다.
    reason: lexical_alternative
