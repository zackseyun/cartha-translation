  source_fidelity: 핵심 경고와 심판 선포는 대체로 반영되었으나, אֲדֹנָי יְהוִה의 신명 요소를 ‘주 하나님’으로 처리하여 원문의 고유한 신명 야훼를 누락했습니다. 또한 כָלָה וְנֶחֱרָצָה는 ‘완전히 정해진 멸망’보다 ‘철저히 작정된 멸망’처럼 멸망을 수식하는 표현으로 옮기는 것이 원문에 더 충실합니다.
  naturalness: ‘결박이 더 강해질 것입니다’와 ‘완전히 정해진 멸망을 들었기 때문입니다’는 다소 부자연스럽습니다. ‘결박이 더 단단해질 것입니다’, ‘철저히 작정된 멸망이 … 내리리라는 말씀을 들었기 때문입니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: יְהוִה는 프로젝트 원칙과 원문 보존을 위해 ‘야훼’로 표기해야 합니다. צְבָאוֹת의 ‘만군’은 적절합니다. 기존 각주는 본문과 멀리 떨어진 문장 끝에 함께 붙어 있어 해당 어휘의 위치에 맞게 재배치해야 하며, b 각주의 ‘또는 만군의’는 한국어 본문이 이미 ‘만군’을 사용하므로 유효한 대안 표기가 아닙니다.
