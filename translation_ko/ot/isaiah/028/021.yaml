  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
  footnotes:
  - marker: a
    text: Mount Perazim recalls the LORD's bursting out against David's enemies (2 Samuel 5:20; 1 Chronicles 14:11).
    reason: cross_reference
  - marker: b
    text: The Valley at Gibeon likely recalls the LORD's intervention in battle at Gibeon (Joshua 10:10–14).
    reason: cross_reference
  - marker: c
    text: Or 'his alien work ... his strange task.' The paired adjectives emphasize that this act of judgment is portrayed as unusual or foreign.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서는 브라심 산에서처럼 일어나시고, 기브온 골짜기에서처럼 격동하시어 — 자기의 일, 곧 낯선 일을 하시고, 자기의 사역, 곧 이방의 사역을 이루실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브라심 산은 다윗의 원수들을 무너뜨리신 야훼의 돌파하심을 떠올리게 합니다(사무엘하 5:20; 역대상 14:11).
    reason: cross_reference
  - marker: b
    text: 기브온 골짜기는 야훼께서 전투에서 개입하신 일을 떠올리게 합니다(여호수아 10:10–14).
    reason: cross_reference
  - marker: c
    text: 또는 ‘그의 외래의 일… 그의 낯선 사역…’ 본문의 짝을 이루는 형용사는 이 심판 행위가 비정상적이거나 낯선 것으로 제시됨을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 경고와 연결되는 이유 제시로 읽어, 한국어에서는 자연스러운 인과 연결어인 ‘그러므로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신적 칭호가 아니라 여호와의 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: יָקוּם / יִרְגָּז
  english_pob_choice: will rise up / will be stirred up
  chosen_korean: 일어나시고 / 격동하시어
  alternatives_korean:
  - 일어나시고 / 흔들리시어
  - 일어나시고 / 분발하시어
  - 일어나시고 / 진동하시어
  lexicon: HALOT
  rationale: 두 동사는 하나님의 निर्ण정적 개입을 그리므로, ‘격동하시어’로 강한 움직임을 살리되 무질서한 감정을 뜻하는 쪽으로는 기울지 않게 했습니다.
- source_word: זָר / נָכְרִיָּה
  english_pob_choice: strange / foreign
  chosen_korean: 낯선 / 이방의
  alternatives_korean:
  - 이상한 / 외국의
  - 낯선 / 외국의
  - 이질적인 / 외래의
  lexicon: HALOT
  rationale: 두 형용사의 반복과 변화를 살려, 첫째는 ‘낯선’, 둘째는 ‘이방의’로 구별했습니다. 둘 다 하나님의 평소 방식에 비추어 비정상적이고 외래적인 성격을 드러냅니다.
- source_word: עֲבֹדָתוֹ
  english_pob_choice: his task
  chosen_korean: 사역
  alternatives_korean:
  - 일
  - 일거리
  - 임무
  - 사역
  lexicon: HALOT
  rationale: עֲבֹדָה는 단순 노동보다 맡겨진 수행의 뉘앙스가 있어, 문맥상 ‘사역’이 가장 압축적으로 대응합니다.
theological_decisions:
- issue: 하나님의 ‘낯선/이방의’ 일과 사역을 어떻게 드러낼지
  chosen_reading: 본문의 긴장을 보존하여 ‘낯선 일’과 ‘이방의 사역’으로 유지했습니다.
  alternative_readings:
  - ‘뜻밖의 심판’으로 풀어 쓰기
  - ‘기이한 일’로 완화하기
  rationale: 히브리어는 심판이 하나님의 통상적 행위와는 다른, 외래적이고 낯선 방식으로 묘사된다는 긴장을 유지합니다. 이를 설명으로 풀어버리면 본문 효과가 약해집니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
