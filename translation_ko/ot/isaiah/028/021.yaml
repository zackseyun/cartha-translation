revisions:
- from: 그러므로 야훼께서는 브라심 산에서처럼 일어나시고, 기브온 골짜기에서처럼 격동하시어 — 자기의 일, 곧 낯선 일을 하시고, 자기의 사역, 곧 이방의 사역을 이루실 것입니다.[a][b][c]
  to: 이는 야훼께서 브라심 산에서처럼[a] 일어나시고, 기브온 골짜기에서처럼[b] 움직이시어, 자신의 일, 곧 낯선 일을 행하시고, 자신의 과업, 곧 이질적인 과업을 이루시려고 하시기 때문입니다.[c]
  rationale: 인과 접속사, 목적 부정사, 그리고 ‘낯선/이질적인’이라는 어휘적 긴장을 보존했습니다. ‘이방의 사역’과 ‘사역’이 한국어에서 불러오는 부정확한 종교·민족적 연상을 피했으며, 각주 표지를 해당 지명과 어휘 대구에 각각 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:26Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 כִּי는 앞 문장의 근거나 설명을 잇는 접속사이므로 ‘그러므로’보다 ‘이는’이 적절합니다. זָר와 נָכְרִיָּה는 각각 ‘낯선/기이한’과 ‘이질적인/외래적인’이라는 긴장을 이루며, ‘이방의 사역’은 민족·종교 집단을 가리키는 뜻으로 오해될 수 있습니다. לַעֲשׂוֹת와 וְלַעֲבֹד는 목적을 나타내므로 ‘…하시려고’로 옮겼습니다.
  naturalness: ‘격동하시어’는 현대 표준어에서 하나님을 주어로 할 때 다소 부자연스럽고 정서적으로 과도하게 들릴 수 있어, 문맥의 행동을 위한 동요를 살린 ‘움직이시어’로 다듬었습니다. ‘사역’은 한국어 교회 용례에서 종교적 봉사를 강하게 뜻하므로 일반적인 עֲבֹדָה에는 ‘과업’이 더 중립적이고 자연스럽습니다.
  terminology: 야훼, 브라심 산, 기브온 골짜기는 유지했습니다. ‘자기의’는 현대 문체상 ‘자신의’으로 했고, 두 명사의 반복 및 두 형용사의 구별은 ‘일/과업’, ‘낯선/이질적인’으로 보존했습니다.
