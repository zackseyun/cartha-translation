id: ISA.28.26
reference: Isaiah 28:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִסְּר֥/וֹ לַ/מִּשְׁפָּ֖ט אֱלֹהָ֥י/ו יוֹרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/026.yaml
  text: For his God instructs him in justice[a]; he teaches him.
  footnotes:
  - marker: a
    text: Or 'For he is instructed properly; his God teaches him.' The Hebrew allows a more adverbial sense for לַמִּשְׁפָּט ('properly' / 'according to proper rule').
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 하나님이 그를 올바른 방식으로 가르치시며, 그를 지도하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 올바르게 가르침을 받으니, 그의 하나님이 그를 가르치신다.’ 히브리어는 לַמִּשְׁפָּט를 ‘적절하게/바른 규범에 따라’라는 부사적 의미로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  english_pob_choice: instructs him
  chosen_korean: 가르치시며
  alternatives_korean:
  - 훈계하시며
  - 교정하시며
  - 훈련시키시며
  lexicon: HALOT
  rationale: Piel יסר는 여기서 징벌보다 지식과 기술을 주는 ‘가르침/훈련’의 뜻이 강하므로, 한국어에서는 자연스럽고 소스에 가까운 ‘가르치시며’로 옮겼습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: in justice / in the right order / properly
  chosen_korean: 올바른 방식으로
  alternatives_korean:
  - 정의 가운데
  - 판단에 따라
  - 바른 질서로
  - 올바르게
  lexicon: HALOT
  rationale: מִשְׁפָּט가 여기서는 법정적 ‘정의’보다 작업의 올바른 규범·방법을 가리키므로, 절차와 방식의 뉘앙스를 살린 ‘올바른 방식으로’가 한국어로 가장 자연스럽습니다.
- source_word: אֱלֹהָיו
  english_pob_choice: his God
  chosen_korean: 그의 하나님
  alternatives_korean:
  - 그의 하나님께서
  - 자기의 하나님
  lexicon: HALOT
  rationale: 3인칭 소유격을 그대로 반영하여, 주어가 누구의 지혜의 근원인지 분명하게 드러내는 ‘그의 하나님’으로 옮겼습니다.
- source_word: יוֹרֶנּוּ
  english_pob_choice: he teaches him
  chosen_korean: 그를 지도하십니다
  alternatives_korean:
  - 그를 가르치십니다
  - 그를 이끄십니다
  lexicon: HALOT
  rationale: ירה Hiphil은 ‘가르치다’뿐 아니라 ‘방향을 제시하다/인도하다’의 뜻도 있어, 앞의 ‘가르치시며’와 중복을 피하면서 보완하는 의미를 살린 ‘지도하십니다’를 택했습니다.
theological_decisions:
- issue: 하나님이 농부의 실무 지식을 주시는 방식
  chosen_reading: 이 절은 농사 기술과 판단의 근원이 그의 하나님께 있음을 직접적으로 말합니다.
  alternative_readings:
  - 일반적인 섭리적 도움으로만 읽을 수도 있습니다.
  rationale: 두 동사 ‘가르치다/지도하다’와 소유격 ‘그의 하나님’이 결합되어, 인간의 실용 지혜가 하나님에게서 온다는 점을 본문 자체가 강조합니다.
  doctrine_reference: Translation philosophy §1, §3
