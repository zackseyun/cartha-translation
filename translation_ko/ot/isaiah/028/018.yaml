id: ISA.28.18
reference: Isaiah 28:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֻפַּ֤ר בְּרִֽיתְ/כֶם֙ אֶת מָ֔וֶת וְ/חָזוּתְ/כֶ֥ם אֶת שְׁא֖וֹל לֹ֣א תָק֑וּם שׁ֤וֹט שׁוֹטֵף֙ כִּ֣י יַֽעֲבֹ֔ר וִ/הְיִ֥יתֶם ל֖/וֹ לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
  footnotes:
  - marker: a
    text: Or 'the overflowing scourge.' The Hebrew image combines a scourge with sweeping, flood-like force.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 죽음과 맺은 언약은 무효가 되고, 스올[a]과 맺은 너희의 합의는 성립하지 못할 것입니다. 넘쳐흐르는 채찍[b]이 지나갈 때, 너희는 그것에게 짓밟힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스올은 히브리어에서 죽은 자들의 영역을 가리키는 말입니다. ‘무덤’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘넘쳐흐르는 채찍’은 채찍이 범람하는 물처럼 휩쓸고 지나가는 이미지를 담고 있습니다.
    reason: source_note
lexical_decisions:
- source_word: כֻפַּר
  english_pob_choice: will be annulled
  chosen_korean: 무효가 되고
  alternatives_korean:
  - 폐기되고
  - 취소되고
  - 무효화되고
  lexicon: HALOT
  rationale: 언약이 더 이상 법적 효력을 갖지 못한다는 뜻을 살려, 제의적 ‘속죄’보다 합의의 효력 상실을 드러내는 ‘무효가 되다’를 택했습니다.
- source_word: בְּרִיתְכֶם / חָזוּתְכֶם
  english_pob_choice: your covenant / your agreement
  chosen_korean: 언약 / 합의
  alternatives_korean:
  - 계약 / 조약
  - 맹약 / 협정
  - 언약 / 계약
  lexicon: HALOT
  rationale: 앞의 בְּרִית는 관계적·공식적 언약이어서 ‘언약’이 적절하고, 평행구의 חָזוּת는 ‘환상’이 아니라 죽음과 스올과의 결속을 가리키는 의미이므로 현대 한국어에서 분명한 ‘합의’로 옮겼습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 음부
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: ‘스올’로 음역하여 히브리어의 개념적 배경과 죽음과의 평행을 유지했습니다.
- source_word: שׁוֹט שׁוֹטֵף
  english_pob_choice: the overwhelming scourge
  chosen_korean: 넘쳐흐르는 재앙
  alternatives_korean:
  - 쓸어가는 채찍
  - 덮쳐오는 재앙
  - 넘쳐흐르는 채찍
  lexicon: HALOT
  rationale: ‘채찍’의 도구 이미지는 살리되, 넘치는 물처럼 휩쓸고 지나가는 심판의 힘을 한국어에서 자연스럽게 드러내기 위해 ‘재앙’으로 풀었습니다.
- source_word: לְמִרְמָס
  english_pob_choice: a trampling place
  chosen_korean: 밟히는 곳
  alternatives_korean:
  - 짓밟히는 곳
  - 발에 짓밟힐 곳
  - 밟힘의 자리
  lexicon: HALOT
  rationale: נִרְמָס의 수동적 의미를 살려, 재앙이 지나간 뒤 그들이 ‘밟히는 곳’이 된다는 이미지를 간결하게 표현했습니다.
theological_decisions:
- issue: Sheol의 표기 유지
  chosen_reading: 스올을 음역하여 본문의 인격화된 죽음 이미지와 병렬 구조를 보존했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: ‘무덤’은 범위를 좁히고, ‘죽은 자들의 세계’는 설명적이지만 원문이 의도한 긴장과 고유 개념을 약화시킬 수 있습니다.
  doctrine_reference: 번역 철학 §1, §3
- issue: 죽음과 스올의 인격화
  chosen_reading: ‘죽음’과 ‘스올’을 각각 실재하는 권세처럼 유지했습니다.
  alternative_readings:
  - 죽음을 비유적으로만 처리
  - 스올을 단순 지하묘지로 환원
  rationale: 본문은 유다가 죽음과 스올과 동맹을 맺은 듯한 조롱을 통해 심판을 말하므로, 그 수사적 긴장을 유지하는 것이 필요합니다.
  doctrine_reference: 번역 철학 §1, §3
