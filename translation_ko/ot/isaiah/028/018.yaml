revisions:
- from: 너희의 죽음과 맺은 언약은 무효가 되고, 스올과 맺은 너희의 합의는 서지 못할 것입니다. 넘쳐흐르는 재앙이 지나갈 때, 너희는 그것의 밟히는 곳이 될 것입니다.[a][b]
  to: 너희가 죽음과 맺은 언약은 무효가 되고, 스올[a]과 맺은 너희의 합의는 성립하지 못할 것입니다. 넘쳐흐르는 채찍[b]이 지나갈 때, 너희는 그것에게 짓밟힐 것입니다.
  rationale: 원문의 법적 병행(언약/합의)과 죽음·스올의 의인화는 유지했습니다. 다만 שׁוֹט의 구체적 ‘채찍’ 은유를 본문에 복원하고, לְמִרְמָס를 자연스럽고 직접적인 수동 표현으로 고쳤습니다. 각주 표지도 각각의 해당 낱말 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:51Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘무효가 되고’는 כֻפַּר의 법적·언약적 문맥을 적절히 반영하고, ‘스올’의 음역도 원문의 죽음과 스올의 병행 및 의인화된 수사를 보존합니다. 그러나 שׁוֹט(채찍)를 ‘재앙’으로 바꾸면 핵심 비유가 사라집니다. לְמִרְמָס는 ‘밟히는 곳’보다 ‘짓밟힐 것’으로 옮기는 편이 한국어와 원문의 결과적 관계를 더 충실히 드러냅니다.
  naturalness: ‘스올과 맺은 너희의 합의’와 ‘무효가 되고’는 자연스럽습니다. 반면 ‘그것의 밟히는 곳’은 한국어에서 소유·행위자 관계가 부자연스럽고 의미도 불명확합니다. ‘그것에게 짓밟힐 것입니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘언약’, ‘합의’, ‘스올’은 적절합니다. 심판의 은유인 שׁוֹט שׁוֹטֵף는 ‘넘쳐흐르는 채찍’으로 보존하고, 각주에서 범람하듯 휩쓰는 이미지를 설명하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘넘쳐흐르는 재앙’이 שׁוֹט의 ‘채찍’ 이미지를 삭제합니다.
    rationale: 원문은 넘쳐흐르거나 휩쓸듯 움직이는 ‘채찍/징벌 도구’의 복합 은유를 사용합니다. ‘재앙’은 결과를 설명할 수는 있지만 원문의 구체적 비유를 대체합니다.
  - severity: medium
    issue: ‘그것의 밟히는 곳’은 לְמִרְמָס의 의미를 부자연스럽게 처리합니다.
    rationale: 이 표현은 한국어에서 무엇이 누구에게 밟히는지 분명하지 않습니다. 문맥상 백성이 그 채찍에 짓밟히는 대상이 된다는 뜻입니다.
  - severity: low
    issue: 각주 표지가 해당 어휘 바로 뒤가 아니라 문장 끝에 함께 놓여 있습니다.
    rationale: a는 ‘넘쳐흐르는 채찍’, b는 ‘스올’에 각각 붙여야 독자가 각주의 대상과 기능을 즉시 알 수 있습니다.
