  english_pob_choice: those overcome by wine
  chosen_korean: 포도주에 압도된 자들
  alternatives_korean:
  - 포도주에 치인 자들
  - 포도주에 쓰러진 자들
  lexicon: HALOT
  rationale: הלם의 ‘맞다/때려눕히다’라는 강한 동사를 한국어로 자연스럽게 반영하여, 단순히 ‘취한’보다 더 강한 이미지로 옮겼습니다.
theological_decisions:
- issue: 시적 병렬에서 심판의 대상이 반복적으로 확장되는 방식
  chosen_reading: 첫 절의 ‘화’ 선언을 앞에 두고, 관·꽃·머리·포도주 이미지가 한 덩어리의 조롱과 심판으로 들리게 했습니다.
  alternative_readings:
  - 이미지들을 쉼표로 느슨하게 나열하는 방식
  - 각 이미지를 별도의 독립 진술처럼 분리하는 방식
  rationale: 원문의 예언 시는 연속된 은유로 동일 대상을 압축적으로 비판하므로, 한국어에서도 그 응축감을 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: 예언서의 심판 선언과 시적 은유
