id: ISA.28.1
reference: Isaiah 28:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
  footnotes:
  - marker: a
    text: Or 'the crown of pride ... and the withering blossom of its glorious beauty.' The Hebrew poetry allows slightly different ways of expressing the metaphors while referring to the same object.
    reason: lexical_alternative
  - marker: b
    text: '''Fertile valley'' is literally ''valley of fatnesses,'' an idiom for rich, luxuriant land.'
    reason: cultural_note
  - marker: c
    text: Or 'those overcome by wine.' The Hebrew expression is more vivid, literally suggesting people beaten or struck down by wine.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임의 술취한 자들의 교만의 관, 그의 영화로운 아름다움의 시드는 꽃, 곧 기름진 골짜기의 머리에 있는 자들, 포도주에 압도된 자들에게 화가 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관’은 문자적 관의 의미라기보다 교만과 영화의 표상을 가리키는 은유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름진 골짜기’는 문자적으로는 ‘기름짐의 골짜기’로, 비옥하고 풍성한 땅을 뜻하는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 구절은 ‘포도주에 압도된 자들’로도 옮길 수 있으며, 히브리어는 더 생생하게 ‘포도주에 맞아 쓰러진’ 이미지를 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있을 것입니다
  alternatives_korean:
  - 슬프도다
  - 재앙이 있을 것입니다
  lexicon: HALOT
  rationale: 예언적 경고와 심판의 어조를 살리면서도 현대 한국어에서 자연스러운 탄식·선언으로 옮겼습니다.
- source_word: עֲטֶרֶת גֵּאוּת
  english_pob_choice: the proud crown
  chosen_korean: 교만의 관
  alternatives_korean:
  - 교만한 관
  - 자랑의 관
  lexicon: HALOT
  rationale: 히브리어의 소유/연결 구조를 따라 ‘관’이 ‘교만’과 결합된 은유임을 드러냈습니다.
- source_word: שִׁכֹּרֵי אֶפְרַ֔יִם
  english_pob_choice: the drunkards of Ephraim
  chosen_korean: 에브라임의 술취한 자들
  alternatives_korean:
  - 에브라임의 술주정꾼들
  - 에브라임의 취한 자들
  lexicon: HALOT
  rationale: 민족/집단을 지시하는 소유격 구조를 유지하면서, ‘drunkards’의 직접적 의미를 살렸습니다.
- source_word: הֲל֥וּמֵי יָֽיִן
  english_pob_choice: those overcome by wine
  chosen_korean: 포도주에 압도된 자들
  alternatives_korean:
  - 포도주에 치인 자들
  - 포도주에 쓰러진 자들
  lexicon: HALOT
  rationale: הלם의 ‘맞다/때려눕히다’라는 강한 동사를 한국어로 자연스럽게 반영하여, 단순히 ‘취한’보다 더 강한 이미지로 옮겼습니다.
theological_decisions:
- issue: 시적 병렬에서 심판의 대상이 반복적으로 확장되는 방식
  chosen_reading: 첫 절의 ‘화’ 선언을 앞에 두고, 관·꽃·머리·포도주 이미지가 한 덩어리의 조롱과 심판으로 들리게 했습니다.
  alternative_readings:
  - 이미지들을 쉼표로 느슨하게 나열하는 방식
  - 각 이미지를 별도의 독립 진술처럼 분리하는 방식
  rationale: 원문의 예언 시는 연속된 은유로 동일 대상을 압축적으로 비판하므로, 한국어에서도 그 응축감을 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: 예언서의 심판 선언과 시적 은유
