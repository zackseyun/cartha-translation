    reason: lexical_alternative
translation:
  language: ko
  text: 귀를 기울이고 내 목소리를 들으십시오[a]; 주의를 기울이고 내 말을 들으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “귀를 기울이고 내 목소리를 들으십시오”로도 옮길 수 있습니다.
