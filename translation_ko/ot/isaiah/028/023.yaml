lexical_decisions:
- source_word: הַאֲזִינוּ
  english_pob_choice: Give ear
  chosen_korean: 귀를 기울이다
  alternatives_korean:
  - 들어라
  - 주의를 기울이다
  lexicon: HALOT
  rationale: אזן의 히필 명령형이 요구하는 ‘주의 깊게 귀를 돌리다’는 동작을 한국어 관용으로 살리기 위해 ‘귀를 기울이다’로 옮겼습니다.
- source_word: וְשִׁמְעוּ
  english_pob_choice: and hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 듣고
  - 들어
  lexicon: HALOT
  rationale: שמע의 반복 명령을 자연스러운 합쇼체로 반영하되, 앞의 ‘귀를 기울이다’와 구별되는 직설적 청취를 유지했습니다.
- source_word: קוֹלִי
  english_pob_choice: my voice
  chosen_korean: 내 목소리
  alternatives_korean:
  - 내 음성
  - 내 소리
  lexicon: HALOT
  rationale: קוֹל은 직접 화법에서 ‘목소리’가 가장 자연스럽고, 이어지는 ‘말’과의 평행도 잘 드러냅니다.
- source_word: הַקְשִׁיבוּ
  english_pob_choice: pay attention
  chosen_korean: 주의를 기울이다
  alternatives_korean:
  - 잘 들으십시오
  - 귀담아 듣다
  lexicon: HALOT
  rationale: קשב의 초점은 단순 청취보다 집중된 주의이므로, ‘주의를 기울이다’로 구분해서 옮겼습니다.
- source_word: אִמְרָתִי
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 발언
  lexicon: HALOT
  rationale: אמרה는 ‘말/발화/말씀’의 뜻이지만, 시적 평행과 현대 한국어의 간결성을 위해 ‘내 말’로 옮겼습니다.
