lexical_decisions:
- source_word: בְּרַגְלַיִם
  english_pob_choice: underfoot
  chosen_korean: 발에 밟혀
  alternatives_korean:
  - 발로
  - 발 아래
  lexicon: HALOT
  rationale: 히브리어의 ב + ‘두 발’ 표현은 도구적·장소적 의미를 함께 지니므로, 한국어에서는 ‘발에 밟혀’가 자연스럽게 압축해 전달합니다.
- source_word: תֵּרָמַסְנָה
  english_pob_choice: will be trampled
  chosen_korean: 짓밟힐 것입니다
  alternatives_korean:
  - 밟힐 것입니다
  - 짓뭉개질 것입니다
  lexicon: HALOT
  rationale: 니팔 미완료형의 수동적 짓밟힘을 현대 한국어에서 분명하게 드러내기 위해 ‘짓밟힐 것입니다’로 옮겼습니다.
- source_word: עֲטֶרֶת גֵּא֖וּת
  english_pob_choice: the proud crown
  chosen_korean: 교만한 면류관
  alternatives_korean:
  - 교만의 면류관
  - 자랑의 면류관
  lexicon: HALOT
  rationale: 명사 ‘gēʾût’를 한국어에서 가장 직접적으로 드러내는 말은 ‘교만’이므로, 영어 POB의 형용사적 처리에 맞추되 의미를 보존해 ‘교만한 면류관’으로 옮겼습니다.
- source_word: שִׁכּוֹרֵי
  english_pob_choice: the drunkards of
  chosen_korean: 술취한 자들의
  alternatives_korean:
  - 술꾼들의
  - 취한 자들의
  lexicon: HALOT
  rationale: 분사형은 단순한 상태보다 그 상태로 규정된 무리를 가리키므로, ‘술취한 자들’이 비하적 뉘앙스와 집단성을 함께 살립니다.
theological_decisions:
- issue: 비유적 ‘면류관’과 심판 이미지
  chosen_reading: ‘면류관’은 영예의 상징을 유지하되, 전체 문맥에서 그 영예가 짓밟히는 심판 선언으로 읽었습니다.
  alternative_readings:
  - ‘관’
  - ‘왕관’
  rationale: 본문은 사마리아의 교만한 영광이 무너지는 장면을 그리므로, 교회적 상징어보다 시적·왕권적 뉘앙스를 가진 ‘면류관’이 원문의 이미지를 더 잘 보존합니다.
  doctrine_reference: 이사야 28장의 심판 신탁 문맥
