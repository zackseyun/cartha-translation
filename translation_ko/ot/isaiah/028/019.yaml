id: ISA.28.19
reference: Isaiah 28:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
  footnotes:
  - marker: a
    text: Or 'Whenever it passes through, it will seize you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it will be nothing but terror to understand the report'; some render 'to hear the message,' taking 'understand' in close connection with what is heard.
    reason: alternative_reading
translation:
  language: ko
  text: 그것이 지나갈 때마다 여러분을 사로잡을 것입니다. 이는 아침마다, 아침마다 지나가며, 낮과 밤에 지나가니[a], 그것의 소식을 이해하는 것이 오직 두려움만이 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것이 지나갈 때마다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 보고를 이해하는 것이 오직 두려움만이 될 것입니다’로도 옮길 수 있습니다. 어떤 번역은 ‘듣는 것’과 더 가깝게 ‘소식을 듣는 것’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  english_pob_choice: As often as it passes through
  chosen_korean: 그것이 지나갈 때마다
  alternatives_korean:
  - 지날 때마다
  - 지나갈 적마다
  lexicon: HALOT
  rationale: 반복적 분포를 드러내는 관용구이므로 ‘-때마다’로 자연스럽게 옮기되, 주어 ‘그것’은 앞 문맥의 심판 재앙을 가리키도록 유지했습니다.
- source_word: יִקַּח אֶתְכֶם
  english_pob_choice: it will seize you
  chosen_korean: 여러분을 사로잡을 것입니다
  alternatives_korean:
  - 여러분을 취할 것입니다
  - 여러분을 붙잡을 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘데려감’보다 적대적 포획의 뉘앙스가 강하므로 ‘사로잡다’를 택했습니다.
- source_word: בַבֹּקֶר בַּבֹּקֶר ... בַּיּוֹם וּבַלָּיְלָה
  english_pob_choice: morning by morning, by day and by night
  chosen_korean: 아침마다, 아침마다 … 낮과 밤에
  alternatives_korean:
  - 매일 아침 … 낮과 밤에
  - 아침마다 … 낮이든 밤이든
  lexicon: HALOT
  rationale: 아침-아침의 분배적 반복을 살리기 위해 중복을 그대로 반영했고, ‘낮과 밤’은 계속성을 나타내는 대구로 보존했습니다.
- source_word: רַק זְוָעָה
  english_pob_choice: sheer terror
  chosen_korean: 오직 두려움만이
  alternatives_korean:
  - 온통 두려움뿐일 것입니다
  - 그것은 두려움일 뿐입니다
  lexicon: HALOT
  rationale: רַק의 배타적 강조를 살리되, 현대 한국어에서 과도하게 추상적인 ‘공포’보다 체감되는 ‘두려움’으로 옮겼습니다.
- source_word: הָבִין שְׁמוּעָה
  english_pob_choice: to understand the message
  chosen_korean: 그것의 소식을 이해하는 것
  alternatives_korean:
  - 그 소식을 깨닫는 것
  - 그 보고를 이해하는 것
  lexicon: HALOT
  rationale: שְׁמוּעָה는 ‘소식/보고’의 의미를 가지므로, 청각적 전달을 자연스럽게 드러내는 ‘소식’을 택했고, הָבִין은 ‘이해하다’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 마지막 절의 의미 관계(‘이해하다’와 ‘두려움’의 결합)
  chosen_reading: ‘그것의 소식을 이해하는 것이 오직 두려움만이 될 것입니다’로, 이해/듣기 자체가 두려움을 낳는다는 압축된 히브리어의 긴장을 유지했습니다.
  alternative_readings:
  - ‘그 소식을 듣는 것만으로도 두려울 것입니다’
  - ‘그 소식을 이해하려는 것 자체가 두려움입니다’
  rationale: 히브리어의 도치적이고 압축된 문장을 해설적으로 풀지 않고, 의미의 날카로움을 보존하는 쪽이 본문의 경고성을 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3
