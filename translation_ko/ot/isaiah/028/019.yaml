  to: 그것이 지나갈 때마다[a] 여러분을 붙잡을 것입니다. 그것은 아침마다 거듭 지나갈 것이며, 낮에도 밤에도 그러할 것입니다. 그 소식을 이해하는 일은 두려움뿐일 것입니다[b].
  rationale: 원문의 반복적·지속적 재앙 묘사를 유지하되, 한국어에서 어색한 중복과 서술을 다듬었습니다. 마지막 절의 어려운 구문은 해설적으로 풀어 쓰지 않고, 소식을 이해하는 일이 두려움과 결부된다는 압축된 의미를 보존했습니다. ‘그것의’는 원문에 없는 관계를 추가하므로 삭제했습니다.
