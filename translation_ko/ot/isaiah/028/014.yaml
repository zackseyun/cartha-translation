id: ISA.28.14
reference: Isaiah 28:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'scoffing men' or 'mockers.' The Hebrew phrase is literally 'men of mockery/scoffing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼의 말씀을 들으십시오, 조롱하는 남자들이여—이 예루살렘에 있는 이 백성의 통치자들이여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조롱하는 남자들’, ‘비웃는 남자들’. 히브리어 표현은 문자적으로 ‘조롱/비웃음의 남자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞 문맥의 논지를 이어 주는 결론 표지이므로, 예언서 문맥에 자연스럽고 격식을 갖춘 ‘그러므로’로 옮겼습니다.
- source_word: שִׁמְע֥וּ
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들으라
  lexicon: HALOT
  rationale: 예언적 호소의 명령형으로서 단순 청취보다 응답을 포함하는 촉구를 살리되, 현대 한국어의 공손한 명령형으로 표현했습니다.
- source_word: אַנְשֵׁי לָצוֹן
  english_pob_choice: scoffing men
  chosen_korean: 조롱하는 남자들
  alternatives_korean:
  - 조롱하는 사람들
  - 비웃는 남자들
  - 조롱꾼들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 호칭을 살려 ‘남자들’로 옮기고, לָצוֹן의 조롱/비웃음 의미를 ‘조롱하는’으로 드러냈습니다.
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  english_pob_choice: rulers of this people
  chosen_korean: 이 백성의 통치자들
  alternatives_korean:
  - 이 백성을 다스리는 자들
  - 이 백성의 지도자들
  lexicon: HALOT
  rationale: מֹשְׁלֵי는 ‘다스리는 자들/통치자들’의 뜻이므로 직역성을 유지하면서 한국어에서 자연스러운 ‘통치자들’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 신명기적 고유명을 음역한 ‘야훼’를 사용해 원문의 직접성을 보존했습니다.
theological_decisions:
- issue: 직접 호칭의 화용론적 톤
  chosen_reading: 예언자적 경고의 명령을 현대 합쇼체로 옮기되, 대상자에 대한 책망의 날카로움을 유지했습니다.
  alternative_readings:
  - 더 중립적인 진술형으로 완화
  - 고어체 명령형으로 강화
  rationale: 이 절은 단순 정보 전달이 아니라 공개적 책망과 경고이므로, 공손체를 쓰되 호소력과 긴장감을 잃지 않도록 했습니다.
  doctrine_reference: Translation philosophy §2 (register and rhetoric)
