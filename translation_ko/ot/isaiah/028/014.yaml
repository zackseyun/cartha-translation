  source_fidelity: 히브리어의 접속적 결론 표지(לָכֵן), 복수 명령(שִׁמְעוּ), 신명 야훼, 조롱하는 남성들(אַנְשֵׁי לָצוֹן), ‘이 백성의 통치자들’(מֹשְׁלֵי הָעָם הַזֶּה)은 대체로 충실하게 반영되었습니다. 그러나 אֲשֶׁר בִּירוּשָׁלָם은 ‘이 백성’이 아니라 통치자들을 수식할 수도 있는 구조이지만, 한국어 초안의 ‘이 예루살렘에 있는 이 백성’은 ‘이’가 예루살렘을 수식하는 것으로 읽혀 원문에 없는 지시성을 부가하고 수식 관계를 흐립니다.
  naturalness: ‘이 예루살렘에 있는 이 백성’은 현대 표준 한국어에서 부자연스럽고 ‘이 예루살렘’이라는 뜻으로 오해될 수 있습니다. ‘예루살렘에 있는 이 백성의 통치자들’로 고치면 자연스럽고 원문의 의미를 보존합니다. 합쇼체 명령과 예언적 책망의 어조는 적절합니다.
  terminology: ‘야훼’, ‘말씀’, ‘통치자들’은 일관되고 적절합니다. ‘조롱하는 남자들’은 히브리어의 남성 복수 호칭을 보존하는 다소 직역적인 표현으로 문맥상 허용됩니다. 다만 각주가 본문과 동일한 ‘조롱하는 남자들’을 대안으로 제시하므로 실제 대안들만 남겨야 합니다.
  issues:
