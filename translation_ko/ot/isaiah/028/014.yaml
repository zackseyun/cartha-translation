  lexicon: HALOT
  rationale: 앞 문맥의 논지를 이어 주는 결론 표지이므로, 예언서 문맥에 자연스럽고 격식을 갖춘 ‘그러므로’로 옮겼습니다.
- source_word: שִׁמְע֥וּ
