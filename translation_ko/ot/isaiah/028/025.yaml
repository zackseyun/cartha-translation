theological_decisions:
- issue: 농사 비유의 인칭과 서술 태도
  chosen_reading: 세 번째 인칭의 농부를 그대로 두어, 징계 뒤 회복을 설명하는 비유의 관찰자 시점을 유지했습니다.
  alternative_readings:
  - 직설적 교훈문으로 풀어쓰기
  - 비유적 주어를 생략해 일반화하기
  rationale: 이 절은 하나님의 교육 방식에 대한 비유적 관찰이므로, 해석을 과도하게 도덕화하지 않고 원문의 서술적 거리를 보존했습니다.
  doctrine_reference: 사 28:23-29 문맥의 비유적 교훈
- issue: 작물 명칭의 식별 불확실성
  chosen_reading: 불확실한 식물명은 본문에서 너무 낯설게 만들지 않되, 주석으로 식별의 유동성을 드러냈습니다.
  alternative_readings:
  - 전통 교회 용어로 단정
  - 모두 음역으로 처리
  rationale: 원문 자체가 특정 작물의 정확한 식별을 보장하지 않으므로, 본문 가독성과 학술적 투명성을 함께 지키는 방식이 적절합니다.
  doctrine_reference: 번역 투명성 원칙
