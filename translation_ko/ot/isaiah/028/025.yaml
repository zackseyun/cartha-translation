- source_word: שׂוֹרָה / נִסְמָן / גְּבֻלָתוֹ
  english_pob_choice: in rows / in its appointed place / at its border
  chosen_korean: 줄지어 두고 / 정해 놓은 자리[a]에 / 가장자리에
