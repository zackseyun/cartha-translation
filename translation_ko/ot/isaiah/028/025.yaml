id: ISA.28.25
reference: Isaiah 28:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לוֹא֙ אִם שִׁוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֥יץ קֶ֖צַח וְ/כַמֹּ֣ן יִזְרֹ֑ק וְ/שָׂ֨ם חִטָּ֤ה שׂוֹרָה֙ וּ/שְׂעֹרָ֣ה נִסְמָ֔ן וְ/כֻסֶּ֖מֶת גְּבֻלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
  footnotes:
  - marker: a
    text: Or 'black caraway'; the exact identification of קֶצַח is uncertain. Older English versions often have 'fitches.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term שׂוֹרָה is difficult; it may mean 'in rows,' 'as the principal crop,' or 'in the best place.'
    reason: lexical_alternative
  - marker: c
    text: Or 'emmer'; the exact grain denoted by כֻסֶּמֶת is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 흙의 면을 고르게 한 뒤에는 검은깨를 흩뿌리고 향유풀을 뿌리며, 밀을 줄지어 두고 보리는 정해 놓은 자리[a]에, 그리고 스펠트를 가장자리에 둡니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׂוֹרָה와 연결된 표현은 뜻이 분명하지 않으며, ‘줄지어’, ‘가장 좋은 곳에’, ‘정해진 자리’ 등으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  english_pob_choice: Does he not, when
  chosen_korean: 그가 … 한 뒤에는
  alternatives_korean:
  - 그가 … 할 때마다
  - 그가 … 하면
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문과 조건·시간의 결합을 한국어에서는 농사 절차를 자연스럽게 잇는 표현으로 옮겼습니다.
- source_word: שִׁוָּה פָנֶיהָ
  english_pob_choice: he has leveled its surface
  chosen_korean: 그 흙의 면을 고르게 한
  alternatives_korean:
  - 그 흙의 표면을 평평하게 한
  - 그 땅의 면을 매끈하게 한
  lexicon: HALOT
  rationale: פָּנִים의 ‘면/표면’과 שׁוה의 ‘고르게 하다’라는 뜻을 살려, 농경적 문맥이 분명한 자연스러운 한국어로 옮겼습니다.
- source_word: קֶצַח / כַמֹּן / חִטָּה / שְׂעֹרָה / כֻסֶּמֶת
  english_pob_choice: black cumin / cumin / wheat / barley / spelt
  chosen_korean: 검은깨 / 향유풀 / 밀 / 보리 / 스펠트
  alternatives_korean:
  - 검은 회향 / 쿠민 / 밀 / 보리 / 에머
  lexicon: HALOT
  rationale: POB의 주석처럼 작물·향신료 식별이 일부 불확실하므로, 본문은 현대 독자에게 읽히는 식물명으로 두고 불확실성이 있는 항목은 주석으로 보완했습니다.
- source_word: שׂוֹרָה / נִסְמָן / גְּבֻלָתוֹ
  english_pob_choice: in rows / in its appointed place / at its border
  chosen_korean: 줄지어 두고 / 정해 놓은 자리[a]에 / 가장자리에
  alternatives_korean:
  - 줄에 맞추어 / 지정된 곳에 / 경계에
  lexicon: HALOT
  rationale: 배치의 질서와 의도성을 살리기 위해 שׂוֹרָה는 ‘줄지어’, נִסְמָן은 ‘정해 놓은 자리’, גְּבֻלָה는 ‘가장자리’로 옮겼습니다.
theological_decisions:
- issue: 농사 비유의 인칭과 서술 태도
  chosen_reading: 세 번째 인칭의 농부를 그대로 두어, 징계 뒤 회복을 설명하는 비유의 관찰자 시점을 유지했습니다.
  alternative_readings:
  - 직설적 교훈문으로 풀어쓰기
  - 비유적 주어를 생략해 일반화하기
  rationale: 이 절은 하나님의 교육 방식에 대한 비유적 관찰이므로, 해석을 과도하게 도덕화하지 않고 원문의 서술적 거리를 보존했습니다.
  doctrine_reference: 사 28:23-29 문맥의 비유적 교훈
- issue: 작물 명칭의 식별 불확실성
  chosen_reading: 불확실한 식물명은 본문에서 너무 낯설게 만들지 않되, 주석으로 식별의 유동성을 드러냈습니다.
  alternative_readings:
  - 전통 교회 용어로 단정
  - 모두 음역으로 처리
  rationale: 원문 자체가 특정 작물의 정확한 식별을 보장하지 않으므로, 본문 가독성과 학술적 투명성을 함께 지키는 방식이 적절합니다.
  doctrine_reference: 번역 투명성 원칙
