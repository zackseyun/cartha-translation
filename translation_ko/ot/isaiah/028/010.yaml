  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
  footnotes:
  - marker: a
    text: Or more literally, “command to command, command to command, line to line, line to line, a little there, a little there.” The Hebrew is highly repetitive and may imitate mocking, childish speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 ‘명령에 명령, 명령에 명령, 줄에 줄, 줄에 줄, 조금 여기, 조금 저기’입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “명령에 명령, 명령에 명령, 줄에 줄, 줄에 줄, 조금 저기, 조금 저기.” 히브리어는 매우 반복적이며, 비웃는 말투나 어린아이 말투를 흉내 낸 것일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절과의 연결을 자연스럽게 이어 주면서, 본절이 앞선 책망의 이유를 제시하는 설명문임을 한국어로 매끄럽게 드러냅니다.
- source_word: צַו / לָצָו
  english_pob_choice: command on command
  chosen_korean: 명령에 명령
  alternatives_korean:
  - 명령 위에 명령
  - 명령 대 명령
  lexicon: HALOT
  rationale: 반복 구조를 살리면서도 현대 한국어에서 가장 간결하고 자연스럽게 들리는 대응으로 옮겼습니다. ל의 반복을 ‘에’로 처리해 구호처럼 들리는 리듬을 보존했습니다.
- source_word: קַו / לָקָו
  english_pob_choice: line on line
  chosen_korean: 줄에 줄
  alternatives_korean:
  - 선에 선
  - 측량줄에 측량줄
  lexicon: HALOT
  rationale: 문맥상 교훈의 파편화와 반복을 나타내는 짧은 표현이므로, ‘줄’로 옮겨 반복성과 음성적 압박감을 유지했습니다. ‘측량줄’은 의미는 더 분명하지만 리듬이 무거워집니다.
- source_word: זְעֵיר שָׁם
  english_pob_choice: a little here, a little there
  chosen_korean: 조금 여기, 조금 저기
  alternatives_korean:
  - 조금 여기, 조금 거기
  - 조금 저기, 조금 저기
  lexicon: HALOT
  rationale: 원문의 반복성과 분산된 전달을 살리되, 한국어 관용상 ‘여기/저기’ 대조가 가장 자연스럽습니다. 영어 POB의 해설적 조정에 해당하는 부분도 과도하게 해석하지 않는 범위에서 반영했습니다.
theological_decisions:
- issue: 이 구절을 단순한 교육 방법으로 볼지, 조롱 섞인 되뇌임으로 볼지
  chosen_reading: 따옴표를 사용해 반복적이고 빈정대는 말투의 인용으로 처리했습니다.
  alternative_readings:
  - 중립적인 교훈 방식의 진술로 처리
  rationale: 이사야 28:9–13의 문맥에서 지도자들의 태도는 예언자적 가르침을 조롱하는 쪽으로 읽히므로, 본문이 가진 빈정거림과 유아어 같은 리듬을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
