    text: ‘말들’은 문맥상 농사 장면에 맞춘 번역입니다. 히브리어는 일부 문맥에서 ‘기병들’ 또는 ‘말 탄 사람들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
