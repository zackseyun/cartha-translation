id: ISA.28.28
reference: Isaiah 28:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֶ֣חֶם יוּדָ֔ק כִּ֛י לֹ֥א לָ/נֶ֖צַח אָד֣וֹשׁ יְדוּשֶׁ֑/נּוּ וְ֠/הָמַם גִּלְגַּ֧ל עֶגְלָת֛/וֹ וּ/פָרָשָׁ֖י/ו לֹֽא יְדֻקֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
  footnotes:
  - marker: a
    text: Or 'grain for bread is crushed.' The Hebrew לֶחֶם ('bread') is used here for grain intended to become bread.
    reason: lexical_alternative
  - marker: b
    text: Or 'his horsemen.' The Hebrew term can denote riders in some contexts, but 'horses' fits the farming image here.
    reason: lexical_alternative
translation:
  language: ko
  text: 빵을 위한 곡식은 빻아지지만, 사람이 그것을 끝없이 계속 타작하지는 않습니다. 그의 수레 바퀴와 말들이 그 위를 요란하게 지나가도, 그는 그것을 곱게 빻지는 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘빵’입니다. 여기서는 빵이 되기 위한 곡식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말들’은 문맥상 농사 장면에 맞춘 번역입니다. 히브리어는 일부 문맥에서 ‘기병들’ 또는 ‘말 탄 사람들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: Bread grain
  chosen_korean: 곡식
  alternatives_korean:
  - 빵
  - 빵용 곡식
  lexicon: HALOT
  rationale: 문맥상 לֶחֶם은 이미 만든 빵이 아니라 빵이 되기 위한 곡식을 가리키므로, 한국어에서는 농사 이미지가 살아나는 ‘곡식’으로 옮겼습니다.
- source_word: יוּדָק
  english_pob_choice: is crushed
  chosen_korean: 깨뜨려집니다
  alternatives_korean:
  - 부서집니다
  - 빻아집니다
  lexicon: HALOT
  rationale: דקק의 ‘잘게 부수다/부서뜨리다’ 뜻을 살리면서, 이어지는 ‘곱게 부수다’와도 어울리도록 했습니다.
- source_word: לֹא לָנֶצַח אָדוֹשׁ יְדוּשֶׁנּוּ
  english_pob_choice: not forever does one keep threshing it
  chosen_korean: 영원히 계속 타작하지는 않으니
  alternatives_korean:
  - 끝없이 타작하지는 않으니
  - 영원히 그것을 계속 타작하지는 않으니
  lexicon: HALOT
  rationale: לָנֶצַח의 지속성을 ‘영원히’로, דושׁ의 반복 타작을 ‘계속 타작하다’로 옮겨 과도한 반복을 허용하지 않는 뜻을 자연스럽게 드러냈습니다.
- source_word: וְהָמַם גִּלְגַּל עֶגְלָתוֹ וּפָרָשָׁיו
  english_pob_choice: though the wheel of his cart and his horses rumble over it
  chosen_korean: 그의 수레 바퀴와 말들이 그것 위를 요란하게 지나가더라도
  alternatives_korean:
  - 그의 수레 바퀴와 말들이 그것 위를 요란하게 굴러가더라도
  - 그의 수레 바퀴와 말들이 그것 위를 시끄럽게 지나가더라도
  lexicon: HALOT
  rationale: הָמַם의 ‘요란하게 만들다/소란케 하다’ 뉘앙스를 살려, 농기구가 곡식 위를 거칠고 시끄럽게 지나가는 장면으로 표현했습니다.
- source_word: לֹא יְדֻקֶּנּוּ
  english_pob_choice: he does not crush it fine
  chosen_korean: 그것을 곱게 부수지는 않습니다
  alternatives_korean:
  - 그것을 잘게 부수지는 않습니다
  - 그것을 가루가 되게 만들지는 않습니다
  lexicon: HALOT
  rationale: 마지막 반복 동사도 דקק의 ‘잘게 하다’ 의미를 유지하되, 앞의 ‘깨뜨려집니다’보다 한 단계 더 강한 정도 차이를 한국어로 분명히 했습니다.
theological_decisions:
- issue: 농사 비유의 의도적 제한성
  chosen_reading: 하나님이 곡식의 타작을 무한히 계속하지 않으시는 분으로 묘사된다는 점을 살렸습니다.
  alternative_readings:
  - 단순한 농사 관찰로 약화시키는 읽기
  - 심판의 절제와 한계를 드러내는 읽기
  rationale: 본문은 곡식이 깨뜨려지지만 끝없이 짓이겨지지는 않는다는 비유로, 하나님의 다루심에 절제와 목적이 있음을 드러냅니다. 이를 너무 일반적 농업 정보로만 축소하지 않도록 했습니다.
  doctrine_reference: 하나님의 징계와 심판은 목적적이며 무제한적 파괴가 아니라는 성경적 주제(사 28장 문맥)
