revisions:
- from: 곡식은 깨뜨려집니다. 그러나 사람은 그것을 영원히 계속 타작하지는 않으니, 그의 수레 바퀴와 말들이 그것 위를 요란하게 지나가더라도 그것을 곱게 부수지는 않습니다.[a][b]
  to: 빵을 위한 곡식은 빻아지지만, 사람이 그것을 끝없이 계속 타작하지는 않습니다. 그의 수레 바퀴와 말들이 그 위를 요란하게 지나가도, 그는 그것을 곱게 빻지는 않습니다.[a][b]
  rationale: The revision uses ‘빻다’ to preserve the grain-processing sense and the repetition of דקק, makes the generic singular agent explicit in the final clause, and corrects the lexical footnote for פָרָשָׁיו. It keeps the difficult motion/noise clause broadly rendered as ‘요란하게 지나가도,’ without overcommitting to a more specific reconstruction of the Hebrew syntax.
