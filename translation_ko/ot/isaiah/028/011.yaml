id: ISA.28.11
reference: Isaiah 28:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
  footnotes:
  - marker: a
    text: Or 'with stammering lips'; some translations take the phrase to emphasize unintelligible speech rather than mocking speech.
    reason: lexical_alternative
  - marker: b
    text: '''Another tongue'' means a foreign language; the expression likely points to God speaking in judgment through foreign invaders.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 그가 조롱하는 입술로, 다른 언어로 이 백성에게 말씀하실 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더듬는 입술로’. 일부 번역은 이 표현이 조롱보다는 알아듣기 어려운 말을 강조한다고 봅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다른 언어’는 외국어를 뜻합니다. 이 표현은 문맥상 하나님께서 외국의 침략자들을 통해 심판 가운데 말씀하심을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלַעֲגֵי שָׂפָה
  english_pob_choice: with mocking lips
  chosen_korean: 조롱하는 입술과
  alternatives_korean:
  - 더듬는 입술과
  - 비웃는 입술과
  lexicon: HALOT
  rationale: לַעַג의 기본 의미가 조롱·비웃음이므로, POB의 해석을 따라 ‘조롱하는’으로 옮기되 한국어에서 자연스러운 명사구로 다듬었습니다.
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  english_pob_choice: and with another tongue
  chosen_korean: 다른 언어로
  alternatives_korean:
  - 다른 혀로
  - 외국어로
  lexicon: HALOT
  rationale: לָשׁוֹן은 문자적으로 ‘혀’이지만 여기서는 외국어/다른 말씨를 가리키므로, 현대 한국어 독자가 즉시 이해할 수 있도록 ‘다른 언어로’로 번역했습니다.
- source_word: יְדַבֵּר
  english_pob_choice: he will speak
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말합니다
  - 말하실 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 나타내는 미완료형이므로 미래형으로 옮겼고, 문맥상 주체를 명시하지 않은 히브리어를 따라 일반 서술형으로 처리했습니다.
- source_word: אֶל הָעָם הַזֶּה
  english_pob_choice: to this people
  chosen_korean: 이 백성에게
  alternatives_korean:
  - 이 사람들에게
  - 이 민족에게
  lexicon: HALOT
  rationale: עָם의 기본값은 ‘백성’이며, 선지자적 호칭의 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘조롱하는’ vs ‘더듬는/불분명한’의 의미 긴장
  chosen_reading: 본문에는 ‘조롱하는 입술’로 두고, 불분명한 발화 가능성은 본문 밖의 대안으로만 남깁니다.
  alternative_readings:
  - 더듬는 입술
  - 알아들을 수 없는 입술
  rationale: 히브리어 לַעַג가 직접적으로 지시하는 의미를 본문에 우선 반영하고, 전통적 해석 차이는 본문의 뜻을 약화시키지 않도록 각주 수준의 대안으로 처리하는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선 원칙과 해석상의 긴장 보존
- issue: 익명의 화자 처리
  chosen_reading: 주어를 명시해 번역하지 않고 ‘그는’으로 유지했습니다.
  alternative_readings:
  - 야훼께서
  - 주께서
  rationale: 히브리어는 동사의 주어를 문맥상 암시할 뿐 이 절 자체에서는 명시하지 않으므로, 번역문에서 신학적 해석을 앞서 주입하지 않도록 했습니다.
  doctrine_reference: 문맥 의존 주어의 절제된 처리
