  naturalness: ‘이는 그가 … 말씀하실 것이기 때문입니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 앞 문맥과의 인과 관계도 분명히 드러냅니다. ‘조롱하는 입술과 다른 언어로’보다 ‘조롱하는 입술로, 다른 언어로’가 병렬 관계를 명료하게 합니다.
  terminology: ‘이 백성’은 עָם הַזֶּה의 예언서적 어조를 잘 보존합니다. לַעֲגֵי는 본문에서 ‘조롱하는’으로 유지하되, ‘더듬는’ 및 알아듣기 어려운 말이라는 대안은 각주에 남기는 것이 적절합니다. ‘다른 언어’는 לָשׁוֹן אַחֶרֶת의 의미를 자연스럽게 전달합니다.
