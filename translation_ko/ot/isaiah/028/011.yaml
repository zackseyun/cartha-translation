- from: 그는 조롱하는 입술과 다른 언어로 이 백성에게 말할 것입니다.[a][b]
  to: 이는 그가 조롱하는 입술로, 다른 언어로 이 백성에게 말씀하실 것이기 때문입니다.[a][b]
  rationale: כִּי를 ‘이는 … 때문입니다’로 반영하여 앞 절과의 설명·인과 관계를 보존했습니다. 두 בְּ 전치사구를 각각 ‘~로’로 옮겨 원문의 병렬성을 살렸습니다. 동사의 주어는 본 절에서 명시되지 않으므로 ‘그가’로 두되, 문맥상 하나님을 가리키는 존대 서술어 ‘말씀하실 것입니다’를 사용했습니다. 각주는 본문의 ‘조롱하는’을 유지하면서도 ‘더듬는/알아듣기 어려운’ 대안을 공정하게 보존합니다.
