  text: וְ/הָיָ֨ה לָ/הֶ֜ם דְּבַר יְהוָ֗ה צַ֣ו לָ/צָ֞ו צַ֤ו לָ/צָו֙ קַ֤ו לָ/קָו֙ קַ֣ו לָ/קָ֔ו זְעֵ֥יר שָׁ֖ם זְעֵ֣יר שָׁ֑ם לְמַ֨עַן יֵלְכ֜וּ וְ/כָשְׁל֤וּ אָחוֹר֙ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
  footnotes:
  - marker: a
    text: Or “command on command, command on command”; traditionally, “precept upon precept, precept upon precept.” The Hebrew is terse and likely mimics mocking or childish repetition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게는 야훼의 말씀이 「명령에 명령, 명령에 명령, 줄에 줄, 줄에 줄, 여기 조금, 저기 조금」이 되어서, 그들이 가다가 뒤로 비틀거리고, 부서지고, 덫에 걸리고, 사로잡히게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이며, 조롱이나 어린아이 같은 되풀이를 흉내 내는 말투일 가능성이 있습니다. 또한 צַו는 '명령' 외에 '규례/계명'으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀
  lexicon: HALOT
  rationale: דָּבָר는 예언문맥에서 단순한 '말'보다 권위 있는 '말씀'이 자연스럽고, יְהוָה는 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
- source_word: צַו לָצָו צַו לָצָו
  english_pob_choice: Order on order, order on order
  chosen_korean: 명령에 명령, 명령에 명령
  alternatives_korean:
  - 규례에 규례, 규례에 규례
  - 계명에 계명, 계명에 계명
  lexicon: HALOT
  rationale: 히브리어의 압축적·반복적 어감과 조롱 섞인 리듬을 살리기 위해 직역에 가까운 반복 구조를 유지했습니다. '명령'은 צַו의 의미를 비교적 안정적으로 반영합니다.
- source_word: קַו לָקָו קַו לָקָו
  english_pob_choice: line on line, line on line
  chosen_korean: 줄에 줄, 줄에 줄
  alternatives_korean:
  - 선에 선, 선에 선
  - 측량줄에 측량줄, 측량줄에 측량줄
  lexicon: HALOT
  rationale: קַו는 기본적으로 '줄/선'이지만 여기서는 반복적 낭송 효과가 중요하므로 가장 간결한 '줄'로 처리했습니다.
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  english_pob_choice: a little here, a little there
  chosen_korean: 여기 조금, 저기 조금
  alternatives_korean:
  - 여기 조금, 거기 조금
  - 조금 여기, 조금 저기
  lexicon: HALOT
  rationale: 지시어와 양 표현의 분배적 의미를 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וְכָשְׁלוּ אָחוֹר
  english_pob_choice: and stumble backward
  chosen_korean: 뒤로 비틀거리고
  alternatives_korean:
  - 뒤로 넘어지고
  - 뒤로 흔들리고
  lexicon: HALOT
  rationale: אָחוֹר의 방향성을 살리면서 כָשַׁל의 '비틀거리다/걸려 넘어지다' 뉘앙스를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 야훼의 말씀이 그들에게 재앙의 도구가 되는 문장 구조
  chosen_reading: 말씀이 단순한 정보가 아니라 그들의 완고함 속에서 심판의 도구가 되어 넘어짐과 포획으로 이어집니다.
  alternative_readings:
  - 단순히 그들이 그렇게 듣는다는 묘사로만 약화시킬 수 있습니다.
  - 조롱 섞인 말장난만 강조하고 심판 기능을 희미하게 할 수 있습니다.
  rationale: 앞 문맥과 목적절(לְמַעַן)은 말씀의 반복이 결과적으로 그들의 سقوط/포획으로 이어지는 심판적 기능을 가리키므로, 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문의 심판적 인과성을 그대로 보존
