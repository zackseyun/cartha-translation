  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
  footnotes:
  - marker: a
    text: Or 'they err in vision'; the Hebrew may refer specifically to prophetic seeing rather than ordinary sight.
    reason: lexical_alternative
  - marker: b
    text: Or 'they stumble in giving judgment' or 'in legal decision.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들도 포도주 때문에 비틀거리고 독주 때문에 비틀거립니다. 제사장과 예언자도 독주 때문에 비틀거리고, 포도주에 삼켜지며, 독주 때문에 비틀거립니다. 환상에서 비틀거리고 판단에서 휘청거립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환상에서 그릇되게 행합니다’라는 뜻일 수 있습니다. 히브리어는 특히 예언적 보는 능력을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘판결을 내리다가 비틀거립니다’ 혹은 ‘법적 판단에서 휘청거립니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  english_pob_choice: And even these
  chosen_korean: 이들도
  alternatives_korean:
  - 그리고 이들도
  - 심지어 이들도
  lexicon: HALOT
  rationale: 앞절의 대상들을 이어 받아 강조하는 말이므로, 자연스러운 한국어로 압축하면서도 포함적·강조적 연결을 살려 옮겼습니다.
- source_word: שָׁגוּ / תָּעוּ / פָּקוּ
  english_pob_choice: reel / stagger / totter
  chosen_korean: 비틀거리고 / 비틀거리고 / 휘청거립니다
  alternatives_korean:
  - 흔들리고 / 비틀거리고 / 넘어질 듯합니다
  - 흔들거리고 / 비틀거리고 / 비틀거립니다
  lexicon: HALOT
  rationale: 세 동사는 모두 술 취한 상태의 불안정함과 방향 상실을 그리므로, 한국어에서도 반복을 유지하되 마지막만 다르게 처리해 리듬과 병행을 살렸습니다.
- source_word: שֵּׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 독한 술
  - 강한 술
  lexicon: HALOT
  rationale: 포도주와 구별되는 취하게 하는 술을 가리키므로, 현대 한국어에서 의미가 분명한 ‘독주’를 택했습니다.
- source_word: נִבְלְעוּ
  english_pob_choice: they are swallowed up by wine
  chosen_korean: 포도주에 삼켜지며
  alternatives_korean:
  - 포도주에 잠기며
  - 포도주에 압도되며
  lexicon: HALOT
  rationale: 히브리어의 ‘삼키다’ 이미지를 그대로 살려, 단순한 과음보다 더 강한 압도와 소멸의 뉘앙스를 보존했습니다.
- source_word: בָּרֹאֶה
  english_pob_choice: in seeing / in vision
  chosen_korean: 환상에서
  alternatives_korean:
  - 보는 일에서
  - 비전에서
  - 예언적 환상에서
  lexicon: HALOT
  rationale: 문맥상 제사장과 예언자의 기능이므로, POB의 각주가 가리키는 ‘vision’의 의미를 살려 ‘환상’으로 옮겼습니다.
- source_word: פְּלִילִיָּה
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 재판
  - 판결
  - 법적 판단
  lexicon: HALOT
  rationale: 재판관적·분별적 결정을 함께 포괄하는 말이므로, 한국어에서는 넓은 의미의 ‘판단’이 가장 자연스럽습니다.
theological_decisions:
- issue: 지식인·종교 지도자들의 기능 상실을 어떻게 드러낼지
  chosen_reading: ‘제사장과 예언자’가 술 취함으로 인해 환상과 판단 능력을 상실한 것으로 드러내는 직역적 표현을 유지했습니다.
  alternative_readings:
  - ‘예언적 환상’과 ‘법적 판결’로 더 풀어 쓸 수 있음
  - ‘보는 일’과 ‘재판’으로 일반화할 수 있음
  rationale: 히브리어는 짧고 압축적이어서, 기능 상실의 범위를 지나치게 풀지 않고 원문의 긴장과 비판성을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve source tension and office-specific indictment'
