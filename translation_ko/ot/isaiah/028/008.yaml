lexical_decisions:
- source_word: כִּ֚י
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 이는 곧
  - 왜냐하면
  - 그러므로
  lexicon: כִּי
  rationale: 문맥상 앞말을 이유로 받으면서도 예언적 진술을 자연스럽게 이끄는 연결어로 처리했습니다.
- source_word: כָּל שֻׁלְחָנֹות
  english_pob_choice: all the tables
  chosen_korean: 모든 상이
  alternatives_korean:
  - 모든 식탁이
  - 모든 탁자가
  lexicon: שֻׁלְחָן
  rationale: שֻׁלְחָן은 일반적으로 식사·연회용 탁자를 가리키므로, 현대 한국어에서는 ‘상’이 가장 자연스럽고 본문의 다수성을 잘 살립니다.
- source_word: קִיא צֹאָה
  english_pob_choice: vomit and filth
  chosen_korean: 토한 것과 더러운 것
  alternatives_korean:
  - 구토와 오물
  - 토사물과 배설물
  lexicon: קִיא / צֹאָה
  rationale: 두 명사의 강한 혐오감을 유지하되, 직역어보다 한국어에서 의미가 즉시 전달되는 표현으로 옮겼습니다.
- source_word: בְּלִי מָקוֹם
  english_pob_choice: with no place left
  chosen_korean: 더 이상 빈 곳이 없습니다
  alternatives_korean:
  - 빈 곳이 남지 않았습니다
  - 더는 자리가 없습니다
  lexicon: בְּלִי / מָקוֹם
  rationale: ‘장소/자리’의 남김없음을 한국어에서 가장 자연스럽게 드러내기 위해 부정적 잔여 상태로 풀어 옮겼습니다.
theological_decisions:
- issue: 예언적 심판 이미지의 강도 유지
  chosen_reading: 식탁들이 부정결로 가득 차 더 이상 쓸 자리가 없다는 뜻을 직설적으로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘더럽혀졌습니다’로 낮추는 번역
  - 도덕적 상징만 강조하는 의역
  rationale: 히브리어의 혐오·오염 이미지를 약화시키지 않고, 문맥의 심판 선언으로 읽히도록 했습니다.
  doctrine_reference: 예언서의 심판 진술은 수사적 완곡화보다 본문의 충격을 보존하는 것이 우선입니다.
