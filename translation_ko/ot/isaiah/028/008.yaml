  terminology: קִיא는 ‘토사물’, צֹאָה는 넓게는 ‘오물’로 옮겨 각각의 의미와 수사적 강도를 보존했습니다. ‘오물’은 문맥상 배설물을 포함하지만 불필요하게 해석을 좁히지 않습니다.
