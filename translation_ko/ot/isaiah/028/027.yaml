  source_fidelity: 히브리어의 농경 비유와 대조는 대체로 충실히 옮겼습니다. חָרוּץ를 ‘타작 썰매’, אוֹפַן עֲגָלָה를 ‘수레 바퀴’로 옮긴 것은 적절하며, 두 향신료 씨앗에 더 가벼운 도구를 쓰는 대조도 보존되었습니다. 다만 각주 표지가 해당 어휘가 아닌 문장 끝에 함께 놓여 있어, 식물명에 관한 각주의 지시 대상이 불분명합니다.
  naturalness: 합쇼체 문체는 유지되어 있습니다. 그러나 ‘쿠민은 막대로 칩니다’은 쿠민이 막대를 친다는 식으로도 잠시 읽힐 수 있습니다. ‘두드려 털어 냅니다’로 병렬을 명시하면 농사 행위와 수동적 의미가 더 자연스럽게 전달됩니다.
  terminology: ‘검은 쿠민’과 ‘쿠민’은 원문의 식물 식별에 대한 불확실성을 과도하게 단정하지 않는 적절한 본문 용어입니다. ‘지팡이’와 ‘막대’의 구별도 유지할 수 있습니다. 각주는 설명식 문장을 줄이고, 원어와 대체 식별을 직접 제시하는 편이 자연스럽습니다.
