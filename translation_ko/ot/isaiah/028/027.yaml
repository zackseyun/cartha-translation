source:
  edition: WLC
  text: כִּ֣י לֹ֤א בֶֽ/חָרוּץ֙ י֣וּדַשׁ קֶ֔צַח וְ/אוֹפַ֣ן עֲגָלָ֔ה עַל כַּמֹּ֖ן יוּסָּ֑ב כִּ֧י בַ/מַּטֶּ֛ה יֵחָ֥בֶט קֶ֖צַח וְ/כַמֹּ֥ן בַּ/שָּֽׁבֶט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
  footnotes:
  - marker: a
    text: Or possibly 'dill' or archaic 'fitches' for black cumin (Hebrew qetsaḥ).
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'caraway' for cumin (Hebrew kammon).
    reason: lexical_alternative
translation:
  language: ko
  text: “검은 쿠민은 타작 썰매로 타작하지 않고, 수레 바퀴를 쿠민 위에 굴리지도 않습니다. 오히려 검은 쿠민은 지팡이로 두들겨 떨어내고, 쿠민은 막대로 칩니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 검은 쿠민은 ‘딜’ 또는 고어 ‘피치스’로도 옮길 수 있는 히브리어 קֶצַח의 번역 가능성을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쿠민’은 히브리어 כַּמֹּן에 대해 ‘캐러웨이’로도 번역될 수 있는 식별상의 대안을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצַח
  english_pob_choice: black cumin
  chosen_korean: 검은 쿠민
  alternatives_korean:
  - 딜
  - 피치스
  - 니겔라
  lexicon: HALOT
  rationale: 영어 POB가 제시한 식물 식별을 따라 현대 독자가 이해하기 쉬운 ‘검은 쿠민’을 본문에 두고, 식별이 절대적이지 않은 점은 각주로 보완합니다.
- source_word: חָרוּץ
  english_pob_choice: sledge
  chosen_korean: 타작 썰매
  alternatives_korean:
  - 타작 기구
  - 썰매형 타작 기구
  lexicon: HALOT
  rationale: 농경 맥락의 타작 도구라는 점을 살리되, 한국어에서 ‘sledge’의 기능이 드러나도록 ‘타작 썰매’로 옮겼습니다.
- source_word: יֵחָבֶט
  english_pob_choice: is beaten out
  chosen_korean: 두들겨 떨어내고
  alternatives_korean:
  - 타작하고
  - 쳐서 털어내고
  lexicon: HALOT
  rationale: 단순히 ‘치다’보다 곡식이나 씨를 떨구는 결과를 드러내기 위해 ‘두들겨 떨어내다’로 옮겼습니다.
- source_word: שָּׁבֶט
  english_pob_choice: rod
  chosen_korean: 막대
  alternatives_korean:
  - 막대기
  - 몽둥이
  lexicon: HALOT
  rationale: 앞의 ‘지팡이’와 구별되는 더 가벼운 타격 도구로서, 일상적이면서도 대조가 살아나는 ‘막대’를 택했습니다.
theological_decisions:
- issue: 예언적 비유의 완곡화 여부
  chosen_reading: 본문의 농사 비유를 직설적으로 유지해, 하나님이 징계와 분별을 절제된 방식으로 행하신다는 문맥적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘타작 도구’처럼 설명을 덧붙여 비유를 풀어 쓰는 방식
  - 징계의 의미를 노골적으로 주석화하는 방식
  rationale: 이 절은 교리 진술보다 관찰 가능한 농사 행위를 통해 질서를 말하므로, 비유를 설명으로 풀어버리기보다 원문의 이미지와 대조를 보존하는 것이 더 충실합니다.
  doctrine_reference: 예언서의 비유적 심판/훈육 표현(문맥상 28장 전체)
