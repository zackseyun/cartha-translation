  - severity: medium
    issue: 돌의 동격 열거와 ‘기초입니다’의 문장 연결
    rationale: 원문은 놓이는 한 돌을 여러 건축적 표현으로 수식·동격화합니다. 현행처럼 문장을 나누면 ‘돌’과 ‘기초’의 관계가 한국어에서 다소 불분명해집니다.
  - severity: low
