revisions:
- from: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보라, 내가 시온에 한 돌을 놓고 있습니다. 곧 시험받은 돌, 귀한 모퉁잇돌, 든든히 놓인 기초입니다. 믿는 사람은 서두르지 않을 것입니다.”[a][b][c]
  to: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 시온에 돌[c] 하나를 놓습니다. 그것은 시험을 거친 돌, 귀한 모퉁잇돌, 견고한 기초입니다. 믿는[a] 사람은 서두르지 않을 것입니다.[b]”
  rationale: 선언적 동사를 합쇼체 현재 선언형으로 고치고, 한 돌에 대한 동격적 건축 비유를 자연스러운 한국어 문장으로 정리했습니다. ‘시험을 거친’과 ‘견고한 기초’는 원문의 검증됨과 확고함을 보존합니다. 각주는 각각 ‘믿는’, ‘서두르지’, ‘돌’에 직접 연결하여 앵커의 범위를 명확히 했으며, 본문에는 메시아적 해석을 삽입하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:11Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 건축 비유와 ‘믿는/신뢰하는 자는 서두르지 않는다’는 의미는 대체로 충실합니다. 다만 הִנְנִי+동사의 선언적·임박한 어조를 ‘놓고 있습니다’라는 진행상보다 ‘놓습니다’로 옮기는 편이 적절합니다. 또한 מוּסָד מוּסָּד의 견고함을 ‘든든히 놓인 기초’보다 ‘견고한 기초’로 자연스럽고 정확하게 나타낼 수 있습니다.
  naturalness: 현행 문장은 ‘한 돌을 놓고 있습니다. 곧 … 기초입니다’에서 앞의 목적어와 뒤의 서술어 연결이 다소 어색합니다. 동격 관계를 한 문장 안에서 분명히 하고, 각주를 해당 낱말·구절 바로 뒤에 배치하면 현대 표준 한국어 합쇼체에서 더 자연스럽고 검증 가능해집니다.
  terminology: ‘주 야훼’, ‘시온’, ‘모퉁잇돌’은 원문의 신명 결합과 건축 이미지를 보존하는 선택으로 수용 가능합니다. ‘시험받은 돌’은 시험의 결과로 검증된 의미가 충분히 드러나지 않을 수 있으므로 ‘시험을 거친 돌’로 고칩니다. 메시아 적용은 본문에 넣지 않고 연결 각주에만 둡니다.
  issues:
  - severity: medium
    issue: ‘내가 시온에 한 돌을 놓고 있습니다’의 진행상
