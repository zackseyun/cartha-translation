id: ISA.28.16
reference: Isaiah 28:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
  footnotes:
  - marker: a
    text: Or 'the one who trusts.' The Hebrew participle can carry the sense of trusting reliance as well as believing.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not hurry'; some understand the sense more interpretively as 'will not panic.'
    reason: lexical_alternative
  - marker: c
    text: This 'stone' is later applied to the Messiah in Romans 9:33 and 1 Peter 2:6.
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보라, 내가 시온에 한 돌을 놓고 있습니다. 곧 시험받은 돌, 귀한 모퉁잇돌, 든든히 놓인 기초입니다. 믿는 사람은 서두르지 않을 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿는 사람’은 ‘신뢰하는 사람’으로도 옮길 수 있습니다. 히브리어 분사는 믿음과 의탁의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서두르지 않을 것입니다’는 직역하면 ‘급히 서두르지 않을 것입니다’에 가깝고, 어떤 해석은 ‘당황하지 않을 것입니다’로 이해합니다.
    reason: lexical_alternative
  - marker: c
    text: 이 ‘돌’은 로마서 9:33과 베드로전서 2:6에서 메시아에게 적용됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 두 칭호의 결합을 한국어에서 중복 없이 살리기 위해 ‘주’와 신명기 표지인 ‘야훼’를 병기했습니다. POB의 ‘Lord GOD’처럼, 전통적 완곡어법보다 원문 구분을 우선했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 보십시오, 내가
  - 여기 내가
  lexicon: HALOT
  rationale: 예언 선언의 강조를 살리되 현대 한국어에서 자연스러운 감탄·지시 표현으로 옮겼습니다.
- source_word: בֹּחַן / יִקְרַת / מוּסָד מוּסָּד
  english_pob_choice: a tested stone, a precious cornerstone, a sure foundation
  chosen_korean: 시험받은 돌, 귀한 모퉁잇돌, 든든히 놓인 기초
  alternatives_korean:
  - 검증된 돌, 귀한 모퉁잇돌, 확실한 기초
  - 시험된 돌, 값진 모퉁잇돌, 확고한 기초
  lexicon: HALOT
  rationale: 반복과 병렬을 살리면서도 한국어에서는 ‘든든히 놓인 기초’가 מוּסָד의 स्थाप성/견고함을 가장 자연스럽게 드러냅니다. ‘모퉁잇돌’은 전통적 교회 용어이지만, 원문의 건축 은유를 그대로 전달합니다.
- source_word: הַמַּאֲמִין
  english_pob_choice: the one who believes
  chosen_korean: 믿는 사람
  alternatives_korean:
  - 믿는 자
  - 신뢰하는 사람
  lexicon: HALOT
  rationale: 분사형의 인격적 특성을 한국어에서 가장 읽기 쉽게 풀었습니다. POB의 ‘believes’에 맞추되, ‘신뢰하다’의 뉘앙스는 해석 여지를 남겨 둡니다.
- source_word: לֹא יָחִישׁ
  english_pob_choice: will not be in haste
  chosen_korean: 서두르지 않을 것입니다
  alternatives_korean:
  - 급히 행동하지 않을 것입니다
  - 당황하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘서두르다/급히 서두르다’라는 기본 뜻을 살리되, 한국어에서 가장 자연스럽고 오해가 적은 표현으로 옮겼습니다.
theological_decisions:
- issue: 돌의 궁극적 메시아적 적용을 본문에 직접 드러낼지 여부
  chosen_reading: 본문에는 건축 은유를 그대로 두고, 메시아적 적용은 암시하지 않습니다.
  alternative_readings:
  - ‘메시아’나 ‘그리스도’를 본문에 직접 삽입하기
  - 주석 없이 본문만으로 그리스도론적 해석을 고정하기
  rationale: 히브리어 본문 자체는 시온에 놓이는 야훼의 기초석 이미지를 제시하며, 신약의 메시아 적용은 정경적 수용사에 속합니다. 번역문은 원문이 말하는 바를 유지하고, 신학적 확장은 주석/연결구절로 남기는 것이 적절합니다.
  doctrine_reference: 정경적 해석 원리 / 번역 신학 §3
- issue: הַמַּאֲמִין의 믿음-신뢰 의미
  chosen_reading: ‘믿는 사람’으로 두되 신뢰의 뉘앙스를 배제하지 않습니다.
  alternative_readings:
  - ‘신뢰하는 사람’으로 제한하기
  - ‘믿는 자’라는 교회적 고정어 사용하기
  rationale: 어근 אמן은 믿음과 신뢰 둘 다를 포괄할 수 있습니다. 문맥상 믿음의 주체를 분명히 하면서도, 원문의 신뢰 뉘앙스를 지나치게 좁히지 않기 위해 ‘믿는 사람’을 선택했습니다.
  doctrine_reference: 어휘 의미의 중첩 / 번역 신학 §3
