id: ISA.3.7
reference: Isaiah 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשָּׂא֩ בַ/יּ֨וֹם הַ/ה֤וּא לֵ/אמֹר֙ לֹא אֶהְיֶ֣ה חֹבֵ֔שׁ וּ/בְ/בֵיתִ֕/י אֵ֥ין לֶ֖חֶם וְ/אֵ֣ין שִׂמְלָ֑ה לֹ֥א תְשִׂימֻ֖/נִי קְצִ֥ין עָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
  footnotes:
  - marker: a
    text: Or “I will not be one who binds up,” preserving the literal image behind “healer.”
    reason: lexical_alternative
  - marker: b
    text: Or “chief of the people” or “ruler of the people.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 그는 외쳐 말할 것입니다. “나는 상처를 싸매는 사람[a]이 되지 않겠습니다. 내 집에는 빵도 없고 겉옷도 없습니다. 나를 백성의 지도자[b]로 삼지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “치유자.” 원문은 상처를 싸매는 사람의 문자적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “백성의 우두머리” 또는 “백성의 통치자.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  english_pob_choice: he will cry out
  chosen_korean: 그가 이렇게 외칠 것입니다
  alternatives_korean:
  - 그가 목소리를 높일 것입니다
  - 그가 외쳐 말할 것입니다
  lexicon: HALOT
  rationale: 말과 함께 쓰인 동사로서 단순한 ‘들어 올리다’보다 공개적이고 강한 거절의 발화를 나타내므로, POB의 ‘cry out’을 자연스럽게 반영해 ‘외칠 것입니다’로 옮겼습니다.
- source_word: חֹבֵשׁ
  english_pob_choice: healer
  chosen_korean: 상처를 싸매는 사람
  alternatives_korean:
  - 치유자
  - 의사
  - 싸매는 사람
  lexicon: HALOT
  rationale: 어근의 기본 이미지는 ‘감싸다/싸매다’이므로, 사회를 돌보는 직무를 비유적으로 가리키는 뜻을 살려 ‘상처를 싸매는 사람’으로 옮겼습니다. ‘치유자’는 의미는 매끄럽지만 원문 이미지가 약해집니다.
- source_word: שִׂמְלָה
  english_pob_choice: cloak
  chosen_korean: 겉옷
  alternatives_korean:
  - 망토
  - 외투
  - 의복
  lexicon: HALOT
  rationale: 기본 생필품의 병렬 구조에서 bread에 대응하는 구체적 옷가지로, 고대 맥락을 지나치게 낯설게 하지 않으면서도 바깥옷의 의미를 살리는 ‘겉옷’을 선택했습니다.
- source_word: תְשִׂימֻנִי קְצִין עָם
  english_pob_choice: you must not make me leader of the people
  chosen_korean: 나를 백성의 지도자로 삼지 마십시오
  alternatives_korean:
  - 나를 백성의 지도자로 세우지 마십시오
  - 나를 백성의 우두머리로 삼지 마십시오
  - 나를 백성의 통치자로 삼지 마십시오
  lexicon: HALOT
  rationale: קצין은 군사적 ‘대장’보다 공적 책임자/지도자를 가리키므로, 현대 한국어에서 자연스럽고 과도한 뉘앙스를 피하는 ‘지도자’를 택했습니다. 명령형 거절의 힘은 ‘삼지 마십시오’로 살렸습니다.
theological_decisions:
- issue: 직접 화법의 어조와 공적 거절의 강도
  chosen_reading: 인물이 공개적으로 직분을 거절하는 장면이므로, 평서형보다 직접 청유 금지형인 “삼지 마십시오”로 옮겨 거절의 사회적 긴장을 유지했습니다.
  alternative_readings:
  - 나를 지도자로 임명하지 마십시오
  - 나를 지도자로 세우지 마십시오
  rationale: 히브리어의 금지/거절 뉘앙스를 한국어에서 가장 자연스럽게 전달하는 형태를 선택했습니다.
  doctrine_reference: 본문 해석 및 담화 기능
- issue: ‘healer’의 비유성 유지
  chosen_reading: 이 표현은 실제 의료인이라기보다 공동체의 상처를 ‘싸매는’ 수습자라는 비유를 유지했습니다.
  alternative_readings:
  - 치유자
  - 회복자
  rationale: POB가 ‘one who binds up’의 문자 이미지를 보존한 점을 따라, 번역에서도 원문 은유를 드러내는 쪽을 택했습니다.
  doctrine_reference: 어휘-수사학적 보존
