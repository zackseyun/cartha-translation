  to: 야훼께서 자기 백성의 장로들과 그 지도자들을 심판하시려고 나아오십니다.[a] “바로 너희가 포도원을 망쳐 놓았다.[b][c] 가난한 이들에게서 빼앗은 것이 너희 집들에 있다.”[d]
