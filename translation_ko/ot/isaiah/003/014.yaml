source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
  footnotes:
  - marker: a
    text: Or 'comes in judgment' or 'comes to judgment.'
    reason: lexical_alternative
  - marker: b
    text: '''Have devoured the vineyard'' may also be rendered ''have burned up the vineyard'' or ''have consumed the vineyard''; the Hebrew verb conveys destructive consumption.'
    reason: lexical_alternative
  - marker: c
    text: '''The vineyard'' likely functions metaphorically for the people or community, echoing Isaiah''s vineyard imagery.'
    reason: cross_reference
  - marker: d
    text: Or 'the spoil of the poor' or 'what was stolen from the poor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자기 백성의 장로들과 그 지도자들을 심판하시려고 나아오십니다.[a] “바로 너희가 포도원을 망쳐 놓았다.[b][c] 가난한 이들에게서 빼앗은 것이 너희 집들에 있다.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심판하시려고 나아오십니다’는 ‘심판 가운데 오십니다’ 또는 ‘심판을 위해 오십니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포도원을 망쳐 놓았다’는 ‘포도원을 불살랐다’, ‘포도원을 먹어 치웠다’ 또는 ‘포도원을 소모하였다’로도 옮길 수 있습니다. 히브리어 동사는 파괴적으로 태우거나 소모하는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘포도원’은 이사야의 다른 포도원 이미지와 연결되어 백성이나 공동체를 가리키는 비유로 기능할 가능성이 큽니다.
    reason: cross_reference
  - marker: d
    text: ‘가난한 이들에게서 빼앗은 것’은 ‘가난한 이들의 약탈물’, ‘가난한 이들의 탈취물’ 또는 ‘가난한 이들에게서 강탈한 재물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: Tetragrammaton은 직함이 아니라 고유한 신적 이름이므로, POB의 원칙에 따라 ‘야훼’로 옮겨 이름성을 보존했습니다.
- source_word: בְּמִשְׁפָּט יָבֹוא
  english_pob_choice: enters into judgment
  chosen_korean: 심판하러 오십니다
  alternatives_korean:
  - 심판 가운데 오십니다
  - 심판으로 오십니다
  - 심판하러 들어오십니다
  lexicon: HALOT
  rationale: 히브리어 표현의 법정적 의미를 살리되 한국어에서는 ‘심판하러 오십니다’가 가장 자연스럽고, 동사의 현재형은 예언적 긴박감을 잘 전달합니다.
- source_word: וְשָׂרָיו
  english_pob_choice: and its princes
  chosen_korean: 그들의 통치자들
  alternatives_korean:
  - 그들의 방백들
  - 그들의 군주들
  - 그들의 고관들
  lexicon: HALOT
  rationale: שׂרים의 높은 정치적 지위를 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 ‘통치자들’을 선택했습니다.
- source_word: בִּעַרְתֶּם הַכֶּרֶם
  english_pob_choice: have devoured the vineyard
  chosen_korean: 포도원을 삼켜 버렸고
  alternatives_korean:
  - 포도원을 먹어 치웠고
  - 포도원을 불살라 버렸고
  - 포도원을 소비해 버렸고
  lexicon: HALOT
  rationale: בער의 파괴적 소모를 드러내기 위해 직역보다 강한 ‘삼켜 버렸고’를 택했으며, 한국어에서 폭력적 착취의 뉘앙스를 선명하게 전달합니다.
- source_word: גְּזֵלַת הֶעָנִי
  english_pob_choice: the plunder of the poor
  chosen_korean: 가난한 자의 노략물
  alternatives_korean:
  - 가난한 자의 약탈물
  - 가난한 자의 빼앗긴 것
  - 가난한 자의 탈취물
  lexicon: HALOT
  rationale: גְּזֵלָה는 강탈로 얻은 물건을 가리키므로, 예언적 고발의 강도를 살려 ‘노략물’로 옮겼습니다.
theological_decisions:
- issue: אַתֶּם의 강한 책망과 심판 문맥
  chosen_reading: “너희가 …”로 직접 책망하는 형태를 유지했습니다.
  alternative_readings:
  - “너희는 …”
  - “바로 너희가 …”
  rationale: 독립 인칭대명사의 강조를 한국어에서도 살려, 단순 서술이 아니라 고발의 직접성을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘포도원’의 비유성
  chosen_reading: 비유를 풀지 않고 ‘포도원’을 그대로 유지했습니다.
  alternative_readings:
  - ‘내 백성’으로 해석하여 번역
  - ‘나라’로 의역
  rationale: 이사야의 포도원 이미지와 연결되는 상징성을 본문 안에서 보존하여, 해석을 본문에 앞서 주입하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
