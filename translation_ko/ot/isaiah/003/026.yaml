base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/026.yaml
  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
  footnotes:
  - marker: a
    text: Or 'emptied' or 'left bare.' The Hebrew verb can convey being cleared out or stripped down.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀의 문들은 탄식하고 애곡하며, 그녀는 헐벗은 채[a] 땅에 앉을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비워진 채’ 또는 ‘헐벗어 드러난 채’. 히브리어 동사는 비워지거나 헐벗어 남은 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  english_pob_choice: will lament
  chosen_korean: 탄식하고
  alternatives_korean:
  - 신음하고
  - 슬퍼하고
  lexicon: HALOT
  rationale: 문맥상 성읍의 문들을 의인화한 애도 표현이므로, 소리 내어 슬퍼하는 뜻을 살려 ‘탄식하고’로 옮겼습니다.
- source_word: וְאָבְל֖וּ
  english_pob_choice: and mourn
  chosen_korean: 애곡하며
  alternatives_korean:
  - 애도하며
  - 슬퍼하며
  lexicon: HALOT
  rationale: 앞의 ‘탄식하다’와 병렬을 이루는 mourning 동사이므로, 장례·재난의 울부짖음 뉘앙스를 살려 ‘애곡하며’로 번역했습니다.
- source_word: וְנִקָּ֖תָה
  english_pob_choice: stripped bare
  chosen_korean: 벌거벗겨진 채
  alternatives_korean:
  - 텅 빈 채
  - 비워진 채
  - 벗겨진 채
  lexicon: HALOT
  rationale: 이 동사는 비워지거나 벗겨져 남는 상태를 나타내므로, 본문의 수치와 박탈 이미지를 직접 드러내는 표현을 택했습니다.
- source_word: לָאָ֥רֶץ תֵּשֵֽׁב
  english_pob_choice: she will sit on the ground
  chosen_korean: 땅에 앉을 것입니다
  alternatives_korean:
  - 땅바닥에 앉을 것입니다
  - 땅에 주저앉을 것입니다
  lexicon: HALOT
  rationale: ‘땅에’와 ‘앉다’의 결합은 굴욕적 자세를 가리키므로, 과장하지 않고도 수치의 장면을 살리는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 문들의 의인화와 여성 단수 주어
  chosen_reading: 성읍의 문들과 ‘그녀/그녀는’으로 이어지는 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 중성적 성읍 표현으로 완화
  - ‘그것은’으로 번역
  rationale: 히브리어는 성읍을 여성 단수로 이어가며 문들까지 애도하는 장면을 그리므로, 이를 완화하지 않고 그대로 재현해야 본문의 시적 충격이 유지됩니다.
  doctrine_reference: 이사야 3장 문맥의 시적 의인화
