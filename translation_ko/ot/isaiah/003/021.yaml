  - 코의 반지들
  lexicon: HALOT
  rationale: ‘코’(הָאָף)와 결합한 נֶזֶם은 한국어에서 자연스럽고 구체적인 장신구명인 ‘코걸이’로 옮기는 것이 원문의 이미지에 가장 가깝습니다.
- source_word: הָאָף
  english_pob_choice: nose
  chosen_korean: 코
  alternatives_korean:
  - 콧구멍
  - 코끝
  lexicon: HALOT
  rationale: אָף는 여기서 해부학적 의미의 ‘코’이므로, 현대 한국어에서는 ‘코’가 가장 सीधे하고 자연스럽습니다.
