  lexicon: HALOT
  rationale: טַבָּעַת의 기본 의미는 ‘반지’이므로, 장신구 목록의 일반적 의미를 살려 ‘반지들’로 옮겼습니다. '인장반지들'은 본문이 요구하지 않는 구체화입니다.
- source_word: וְנִזְמֵי הָאָף
  english_pob_choice: and nose rings
  chosen_korean: 코걸이들
  alternatives_korean:
