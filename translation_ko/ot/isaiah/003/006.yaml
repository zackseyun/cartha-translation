id: ISA.3.6
reference: Isaiah 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִתְפֹּ֨שׂ אִ֤ישׁ בְּ/אָחִי/ו֙ בֵּ֣ית אָבִ֔י/ו שִׂמְלָ֣ה לְ/כָ֔ה קָצִ֖ין תִּֽהְיֶה לָּ֑/נוּ וְ/הַ/מַּכְשֵׁלָ֥ה הַ/זֹּ֖את תַּ֥חַת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
  footnotes:
  - marker: a
    text: Or “this collapse” or, more literally, “this stumbling block.”
    reason: lexical_alternative
  - marker: b
    text: “Under your hand” is a Hebrew idiom meaning under your authority or in your charge.
    reason: cultural_note
translation:
  language: ko
  text: 이는 한 사람이 자기 아버지 집에서 자기 형제를 붙잡고 말할 것이기 때문입니다. “네게는 겉옷이 있으니, 네가 우리의 지도자가 되어라. 이 몰락도 네 손 아래에 두어라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이 몰락”은 문자적으로는 “이 걸림/넘어짐”에 가까운 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: “네 손 아래에”는 어떤 일을 네 권한이나 책임 아래에 두는 것을 뜻하는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 곧 …
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 선언을 이어 주는 설명·이유의 접속사이므로, 현대 한국어에서는 원인 설명을 자연스럽게 드러내는 표현이 적절합니다.
- source_word: יִתְפֹּשׂ
  english_pob_choice: will seize
  chosen_korean: 붙들며
  alternatives_korean:
  - 붙잡으며
  - 움켜쥐며
  lexicon: HALOT
  rationale: אִישׁ이 다른 사람에게 강하게 매달리는 장면을 살리기 위해 ‘붙들다’를 택했습니다. 단순한 접촉보다 절박한 요구의 뉘앙스를 더 잘 드러냅니다.
- source_word: שִׂמְלָה
  english_pob_choice: a cloak
  chosen_korean: 외투
  alternatives_korean:
  - 겉옷
  - 망토
  lexicon: HALOT
  rationale: שִׂמְלָה는 외출용 겉의 옷을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘외투’가 적절합니다. ‘겉옷’보다 일상적이지만, 의복 한 벌을 소유한 사람이 지도자로 지목되는 대비도 유지합니다.
- source_word: קָצִין
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 통치자
  - 지휘관
  lexicon: HALOT
  rationale: 이 단어는 권위자나 책임자를 뜻하므로, 군사적 뉘앙스를 덜고 문맥의 공동체적 요구를 살리는 ‘지도자’가 가장 자연스럽습니다.
- source_word: הַמַּכְשֵׁלָה
  english_pob_choice: this ruin
  chosen_korean: 이 몰락
  alternatives_korean:
  - 이 걸림돌
  - 이 붕괴
  - 이 재난
  lexicon: HALOT
  rationale: 직역상 ‘걸림’ 계열의 단어이지만, 여기서는 사회적 붕괴를 가리키는 비유적 표현이므로 독자가 의미를 즉시 파악할 수 있는 ‘몰락’을 택했습니다.
- source_word: תַּחַת יָדֶךָ
  english_pob_choice: shall be under your hand
  chosen_korean: 네 손 아래에
  alternatives_korean:
  - 네 권한 아래에
  - 네 관리 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서 살려 ‘손 아래에’로 옮기되, 한국어에서도 지배·책임의 관용적 감각이 전달되도록 했습니다.
theological_decisions:
- issue: 성별을 가진 보편적 예시 인물의 처리
  chosen_reading: אִישׁ을 ‘한 사람’이 아니라 ‘한 사람이’와 함께, 이어지는 호칭은 ‘네가’로 옮겨 가족·공동체 내부의 남성 예시성을 유지했습니다.
  alternative_readings:
  - 성중립적으로 ‘누군가’로 완화
  - ‘어떤 이가’로 일반화
  rationale: 본문은 실제 남성 형상의 예시를 통해 사회 붕괴를 묘사하므로, 이를 중화하면 מקור의 구체성이 약해집니다.
  doctrine_reference: 본문 문맥의 역사·문학적 정확성
