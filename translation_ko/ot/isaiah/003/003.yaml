source:
  edition: WLC
  text: שַׂר חֲמִשִּׁ֖ים וּ/נְשׂ֣וּא פָנִ֑ים וְ/יוֹעֵ֛ץ וַ/חֲכַ֥ם חֲרָשִׁ֖ים וּ/נְב֥וֹן לָֽחַשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/003.yaml
  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
  footnotes:
  - marker: a
    text: Or 'the skillful charmer.' The Hebrew phrase literally refers to one discerning or expert in whispering/incantation.
    reason: lexical_alternative
translation:
  language: ko
  text: 오십 명의 지휘관과, 높은 지위의 사람과, 조언자와, 숙련된 장인과, 주문에 능숙한 주술사를[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주문에 능한 사람’. 히브리어 구는 문자적으로 속삭임이나 주문에 분별력 또는 전문성이 있는 사람을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  english_pob_choice: the captain of fifty
  chosen_korean: 군대의 지휘관
  alternatives_korean:
  - 오십 명의 대장
  - 오십 명의 지휘관
  lexicon: HALOT
  rationale: שַׂר는 지휘관·우두머리의 뜻이므로, 한국어에서는 군사적 위계를 자연스럽게 드러내는 ‘지휘관’으로 옮겼습니다. ‘오십’의 숫자 요소는 원문 구조를 따르되, 본절 목록의 사회적 직함 열거라는 흐름을 살려 간결하게 처리했습니다.
- source_word: נְשׂוּא פָנִים
  english_pob_choice: the man of rank
  chosen_korean: 높은 지위의 사람
  alternatives_korean:
  - 존귀한 사람
  - 존대받는 사람
  - 귀인
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴이 들어 올려진 사람’으로, 존중받는 사회적 지위를 가리키는 관용구이므로 ‘높은 지위의 사람’으로 옮겼습니다. 전통적 교회 용어인 ‘귀인’보다 현대 한국어에서 의미가 더 분명합니다.
- source_word: חֲכַם חֲרָשִׁים
  english_pob_choice: the skillful craftsman
  chosen_korean: 숙련된 장인
  alternatives_korean:
  - 지혜로운 장인
  - 능숙한 공예가
  - 기술에 뛰어난 장인
  lexicon: HALOT
  rationale: חכם은 이 문맥에서 추상적 ‘지혜’보다 기술적 숙련을 가리키므로 ‘숙련된’으로, חרשים는 장인·기술자를 가리키므로 ‘장인’으로 옮겼습니다. English audit trail의 ‘skillful craftsman’ 선택을 한국어에서도 유지했습니다.
- source_word: נְבוֹן לָחַשׁ
  english_pob_choice: the expert enchanter
  chosen_korean: 능숙한 주술사
  alternatives_korean:
  - 주문에 능한 사람
  - 능숙한 주문자
  - 숙련된 주술사
  lexicon: HALOT
  rationale: נבון은 분별·숙련을, לחש은 속삭임·주문·주술을 가리킬 수 있어, 문맥상 ‘주술사’가 가장 직접적으로 원문의 종교적/주술적 의미를 드러냅니다. English POB가 지시한 occult한 의미를 약화시키지 않기 위해 ‘능숙한’으로 대응했습니다.
theological_decisions:
- issue: לחש를 현대 한국어에서 어떻게 드러낼지
  chosen_reading: ‘주술사’로 옮겨 원문의 주술적·주문적 함의를 분명히 했습니다.
  alternative_readings:
  - ‘주문에 능한 사람’
  - ‘속삭임에 능한 사람’
  rationale: 이 목록은 유다 사회의 지도층을 열거하면서 마지막 항목에 주술 관련 인물을 포함합니다. 의미를 완화해 단순한 ‘말 잘하는 사람’으로 만들지 않고, 본문이 지닌 불편한 긴장을 그대로 드러내는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve theological tension rather than resolve it'
