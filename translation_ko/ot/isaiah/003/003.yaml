  source_fidelity: 수정이 필요합니다. שַׂר חֲמִשִּׁים에 명시된 ‘오십’이 초안에서 빠졌으며, 본절의 히브리어는 앞 절의 ‘제거하다’에 이어지는 목적어 목록이므로 종결 서술형 ‘입니다’는 원문의 통사 관계를 바꿉니다. נְבוֹן לָחַשׁ은 주문·주술의 숙련자를 뜻하는 것으로 옮긴 것은 적절합니다.
  naturalness: ‘군대의 지휘관’은 자연스럽지만 수적 직함을 누락합니다. ‘오십 명의 지휘관’은 현대 표준어로 이해 가능하고 원문의 수량 구성을 보존합니다. 앞 절에 종속되는 열거이므로 마지막에 목적격 조사 ‘을’을 두고 ‘입니다’를 제거하는 편이 한국어 성경 문맥과 원문에 자연스럽습니다.
  terminology: ‘높은 지위의 사람’, ‘조언자’, ‘숙련된 장인’은 각각 נְשׂוּא פָנִים, יוֹעֵץ, חֲכַם חֲרָשִׁים에 적절합니다. ‘주문에 능숙한 주술사’는 לָחַשׁ의 주문/주술적 의미와 נָבוֹן의 전문성을 모두 드러내며, 영어 POB의 ‘expert enchanter’와도 부합합니다.
