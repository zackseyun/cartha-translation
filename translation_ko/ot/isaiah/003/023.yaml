  language: ko
  text: 그리고 거울들[a], 그리고 아마포 옷들, 그리고 터번들, 그리고 베일들[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판들’로 옮길 수 있습니다. 히브리어는 매끈하고 닦인 물건을 더 넓게 가리킬 수 있으나, 이 문맥에서는 ‘거울들’이 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숄들’이나 ‘두르는 천들’로 옮길 수 있습니다. 정확한 의복 형태는 확정하기 어렵습니다.
