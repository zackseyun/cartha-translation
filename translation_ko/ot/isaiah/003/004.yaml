base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
  footnotes:
  - marker: a
    text: Or 'children,' 'infants,' or 'babes'; the Hebrew term may emphasize either youth or childish, capricious behavior.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 청년들을 그들의 고관으로 삼겠고, 변덕스러운 아이들이 그들을 다스릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이들’ 또는 ‘어린아이들’로도 옮길 수 있으며, 히브리어 표현은 나이의 어림과 어린애 같은 변덕스러움을 함께 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 삼겠고
  alternatives_korean:
  - 내가 줄 것이고
  - 내가 임명하겠고
  lexicon: HALOT
  rationale: נתן의 단순한 ‘주다’보다 여기서는 통치자를 세우는 뜻이므로, ‘삼다’로 옮겨 임명·배치의 뉘앙스를 살렸습니다.
- source_word: נְעָרִים
  english_pob_choice: youths
  chosen_korean: 청년들
  alternatives_korean:
  - 소년들
  - 젊은이들
  - 아이들
  lexicon: HALOT
  rationale: נְעָרִים는 미성숙한 젊은 남자들을 가리키므로, 한국어에서는 ‘청년들’이 나이의 젊음과 통치 부적합성을 함께 가장 자연스럽게 드러냅니다.
- source_word: שָׂרֵיהֶם
  english_pob_choice: their princes
  chosen_korean: 그들의 고관
  alternatives_korean:
  - 그들의 방백
  - 그들의 통치자
  - 그들의 지도자
  lexicon: HALOT
  rationale: שַׂר는 단순한 지도자보다 높은 지위의 통치자·관리자이므로, ‘고관’이 위계와 공적 직분을 잘 반영합니다.
- source_word: וְתַעֲלוּלִים
  english_pob_choice: capricious children
  chosen_korean: 변덕스러운 아이들
  alternatives_korean:
  - 아이들
  - 어린아이들
  - 유치한 자들
  - 제멋대로 구는 아이들
  lexicon: HALOT
  rationale: תַעֲלוּלִים는 단순한 연령뿐 아니라 유치하고 변덕스러운 행태를 시사하므로, ‘변덕스러운 아이들’로 두 의미를 함께 살렸습니다.
theological_decisions:
- issue: judgment image of immature rulers
  chosen_reading: 여호와께서 미성숙하고 변덕스러운 통치자를 세우심으로 심판하신다는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 나이만 어린 통치자에 대한 말로 한정
  - 전적으로 비유적 무능한 지도자만 가리킴
  rationale: 히브리어는 나이 어린 자들과 어린아이 같은 행태를 모두 열어 두므로, 해석을 한쪽으로 고정하지 않고 긴장을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 예언적 심판 표상을 본문 수준에서 보존
