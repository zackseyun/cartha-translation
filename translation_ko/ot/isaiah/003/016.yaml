  lexicon: HALOT
  rationale: 문맥상 단순한 높이의 묘사보다 예언적 책망에 맞는 교만의 태도를 드러냅니다.
- source_word: נטוות גָּרוֹן
  english_pob_choice: with outstretched necks
  chosen_korean: 목을 빳빳이 세우고
  alternatives_korean:
  - 목을 길게 빼고
  - 목을 곧게 세우고
  lexicon: HALOT
  rationale: 과장된 자세와 뻣뻣한 태도를 자연스러운 현대 한국어로 옮기되, 본문의 신체 이미지를 유지했습니다.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  english_pob_choice: glancing with their eyes
  chosen_korean: 눈짓을 하며
  alternatives_korean:
  - 유혹하는 눈길을 보내며
  - 눈을 흘기며
  lexicon: HALOT
  rationale: 희귀한 표현의 핵심인 눈의 움직임을 살리면서, 해석을 과도하게 좁히지 않는 중립적 표현을 택했습니다.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  english_pob_choice: walking and mincing as they go
  chosen_korean: 걸어가면서 종종걸음치고
  alternatives_korean:
  - 가며 잔걸음으로 걷고
  - 종종걸음으로 걸어가고
  lexicon: HALOT
  rationale: 반복·강조를 나타내는 히브리어 형태를 살리면서, 왜소하고 인위적인 걸음걸이를 자연스럽게 표현했습니다.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  english_pob_choice: making a jingling with their feet
  chosen_korean: 발로 짤랑거립니다
  alternatives_korean:
  - 발목 장식으로 짤랑거리게 합니다
  - 발걸음에 짤랑 소리를 냅니다
  lexicon: HALOT
  rationale: 구체적 장신구는 본문에 직접 없으므로, 발에서 나는 금속성 소리를 살리는 방식으로 옮겼습니다.
