  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
  footnotes:
  - marker: a
    text: Or 'making their anklets jingle with their feet.' The Hebrew verb likely refers to producing a tinkling or jingling sound, probably from ankle ornaments, though 'anklets' is not stated explicitly in this verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'casting seductive glances with their eyes.' The Hebrew expression is rare and may refer to flirtatious or deceptive eye movements.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 말씀하셨습니다. 「시온의 딸들이 교만하여 목을 빳빳이 세우고, 눈짓을 하며, 걸어가면서 종종걸음치고, 발로 짤랑거립니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발목 장식으로 발을 짤랑거리게 하는 것’일 수 있습니다. 히브리어 동사는 종종 발목 장식에서 나는 짤랑거림을 가리키는 듯하지만, 이 구절에 ‘발목 장식’이 명시되지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘눈으로 유혹하듯 눈짓하는 것’일 수 있습니다. 히브리어 표현은 드물며, 유혹적이거나 속이는 눈의 움직임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 언약 이름을 보존하기 위해 전통적 대체호칭보다 음역인 야훼를 사용했습니다.
- source_word: גָבְהוּ
  english_pob_choice: are haughty
  chosen_korean: 교만하여
  alternatives_korean:
  - 거만하여
  - 높아져
  lexicon: HALOT
  rationale: 문맥상 단순한 높이의 묘사보다 예언적 책망에 맞는 교만의 태도를 드러냅니다.
- source_word: נטוות גָּרוֹן
  english_pob_choice: with outstretched necks
  chosen_korean: 목을 빳빳이 세우고
  alternatives_korean:
  - 목을 길게 빼고
  - 목을 곧게 세우고
  lexicon: HALOT
  rationale: 과장된 자세와 뻣뻣한 태도를 자연스러운 현대 한국어로 옮기되, 본문의 신체 이미지를 유지했습니다.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  english_pob_choice: glancing with their eyes
  chosen_korean: 눈짓을 하며
  alternatives_korean:
  - 유혹하는 눈길을 보내며
  - 눈을 흘기며
  lexicon: HALOT
  rationale: 희귀한 표현의 핵심인 눈의 움직임을 살리면서, 해석을 과도하게 좁히지 않는 중립적 표현을 택했습니다.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  english_pob_choice: walking and mincing as they go
  chosen_korean: 걸어가면서 종종걸음치고
  alternatives_korean:
  - 가며 잔걸음으로 걷고
  - 종종걸음으로 걸어가고
  lexicon: HALOT
  rationale: 반복·강조를 나타내는 히브리어 형태를 살리면서, 왜소하고 인위적인 걸음걸이를 자연스럽게 표현했습니다.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  english_pob_choice: making a jingling with their feet
  chosen_korean: 발로 짤랑거립니다
  alternatives_korean:
  - 발목 장식으로 짤랑거리게 합니다
  - 발걸음에 짤랑 소리를 냅니다
  lexicon: HALOT
  rationale: 구체적 장신구는 본문에 직접 없으므로, 발에서 나는 금속성 소리를 살리는 방식으로 옮겼습니다.
