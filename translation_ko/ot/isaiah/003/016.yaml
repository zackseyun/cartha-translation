  rationale: 프로젝트의 본문-직결 원칙에 따라 Tetragrammaton을 고유명으로 드러내며, 예언 선포문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
