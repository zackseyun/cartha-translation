id: ISA.3.18
reference: Isaiah 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יָסִ֣יר אֲדֹנָ֗/י אֵ֣ת תִּפְאֶ֧רֶת הָ/עֲכָסִ֛ים וְ/הַ/שְּׁבִיסִ֖ים וְ/הַ/שַּׂהֲרֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/018.yaml
  text: In that day the Lord will take away the beauty of the anklets[a], the headbands[c][b], and the crescent ornaments.
  footnotes:
  - marker: a
    text: Or 'On that day.'
    reason: lexical_alternative
  - marker: b
    text: The precise meaning of 'headbands' is uncertain; alternatives include 'caps' or 'hairnets.'
    reason: lexical_alternative
  - marker: c
    text: Or 'crescent necklaces'; the Hebrew refers to crescent-shaped ornaments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 주께서는 발찌들의 아름다움과 머리띠들과 초승달 장식들을 없애실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날에’.
    reason: lexical_alternative
  - marker: b
    text: ‘머리띠들’의 정확한 뜻은 불확실하며, ‘모자들’이나 ‘헤어넷들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘초승달 목걸이들’; 히브리어는 초승달 모양 장신구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언문에서 반복되는 시점 표지로, 자연스러운 현대 한국어이면서도 종말론적·심판적 분위기를 유지합니다.
- source_word: יָסִיר
  english_pob_choice: will take away
  chosen_korean: 없애실 것입니다
  alternatives_korean:
  - 거두어 가실 것입니다
  - 제거하실 것입니다
  lexicon: HALOT
  rationale: 문맥이 장신구를 빼앗아 치우는 심판 행위이므로, 단순한 이동보다 상실·박탈의 뉘앙스를 드러내는 표현을 택했습니다.
- source_word: תִּפְאֶרֶת הָעֲכָסִים
  english_pob_choice: the beauty of the anklets
  chosen_korean: 발찌들의 아름다움
  alternatives_korean:
  - 발찌의 화려함
  - 발찌들의 장식미
  lexicon: HALOT
  rationale: 히브리어는 개별 장신구 자체보다 그것들이 만들어내는 ‘아름다움/장식성’을 말하므로, 소유격 구조를 살려 옮겼습니다.
- source_word: הַשְּׁבִיסִים
  english_pob_choice: the headbands
  chosen_korean: 머리띠들
  alternatives_korean:
  - 모자들
  - 헤어넷들
  - 두건들
  lexicon: HALOT
  rationale: 정확한 물건은 불확실하지만 머리에 쓰는 장식을 가리키므로, 과도한 특정화를 피하면서도 이해하기 쉬운 ‘머리띠들’을 택했습니다.
- source_word: הַשַּׂהֲרֹנִים
  english_pob_choice: the crescent ornaments
  chosen_korean: 초승달 장식들
  alternatives_korean:
  - 초승달 목걸이들
  - 달 모양 장신구들
  lexicon: HALOT
  rationale: 어근이 ‘달/초승달’ 이미지를 분명히 담고 있어, 형태를 특정하지 않되 형상은 분명하게 드러내는 번역이 적절합니다.
theological_decisions:
- issue: 심판 주체인 '아도나이'의 번역
  chosen_reading: 주께서는
  alternative_readings:
  - 주님은
  - 주께서
  rationale: 본문의 אֲדֹנָי 는 야훼 표기가 아니라 주권자 칭호이므로, 한국어에서도 경어를 유지한 ‘주께서는’으로 옮겨 심판의 주체성을 분명히 했습니다.
  doctrine_reference: 하나님의 주권과 심판
