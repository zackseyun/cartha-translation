revisions:
- from: 그들의 얼굴빛이 그들에게 불리한 증언을 하고, 그들은 자기 죄를 소돔처럼 드러내며 숨기지 않습니다. 자기 자신에게 화가 있으니 — 그들이 자기에게 악을 가져왔기 때문입니다.[a][b][c]
  to: 그들의 얼굴에 드러난 모습이 그들에게 불리하게 증언합니다[a]. 그들은 소돔처럼[b] 자기들의 죄를 드러내고 숨기지 않습니다. 그들 자신에게[c] 화가 있습니다. 그들이 스스로 악을 불러들였기 때문입니다.
  rationale: 문장의 합쇼체 종결을 일관되게 유지하고, 원문의 법정적 증언 이미지와 소돔 비교를 보존했습니다. 마지막 절은 하나님의 심판의 작동 방식을 본문보다 더 명시하지 않으면서, 그들이 자신들에게 악한 결과를 초래했다는 뜻을 자연스러운 현대 한국어로 옮겼습니다. 각주 표지도 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:11Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문과 영어 감사 번역의 의미를 충실히 반영합니다. 그러나 마지막 절의 ‘자기에게 악을 가져왔다’는 한국어에서 부자연스럽고, גמל의 ‘자기에게 악을 초래하다/되돌리다’라는 결과적·보응적 의미가 충분히 드러나지 않습니다. ‘스스로 악을 불러들였다’로 고치면 원문의 자기초래적 결과를 자연스럽게 보존합니다.
  naturalness: ‘그들에게 불리한 증언을 하고’는 가능하나, 주어가 ‘얼굴빛’인 문맥에서는 ‘그들을 불리하게 증언합니다’보다 ‘그들에게 불리하게 증언합니다’ 또는 ‘그들을 거슬러 증언합니다’가 더 매끄럽습니다. 또한 각주 표지는 해당 표현 바로 뒤에 두는 편이 독해와 주석 연결에 적절합니다.
  terminology: ‘얼굴빛’은 문맥상 허용되지만 표정·안색으로 좁혀 읽힐 수 있습니다. ‘얼굴에 드러난 모습’은 הַכָּרַת פְּנֵיהֶם의 보이는 표정/용모라는 폭을 자연스럽게 살립니다. ‘화’와 ‘악’은 예언적 심판 및 רָעָה의 무게를 유지합니다. ‘소돔’ 및 ‘자기 자신’의 처리는 적절합니다.
  issues:
  - severity: medium
    issue: 마지막 절의 ‘그들이 자기에게 악을 가져왔기 때문입니다’가 한국어 관용상 부자연스럽습니다.
    rationale: 히브리어 גָמְלוּ לָהֶם רָעָה는 자신들에게 악한 결과를 초래하거나 악으로 되갚았다는 뜻입니다. ‘스스로 악을 불러들였습니다’는 그 자기초래적 결과를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 표지가 문단 끝에 한꺼번에 배치되어 각각의 주석 대상이 즉시 분명하지 않습니다.
    rationale: a는 얼굴의 모습, b는 ‘소돔처럼’, c는 ‘자기 자신’에 각각 붙여야 주석의 연결이 명확합니다.
  - severity: low
    issue: ‘얼굴빛’은 원문의 표현 범위를 다소 좁힐 수 있습니다.
