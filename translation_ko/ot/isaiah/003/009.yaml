id: ISA.3.9
reference: Isaiah 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
  footnotes:
  - marker: a
    text: Or 'The expression of their faces bears witness against them.' The Hebrew may refer to their visible countenance or expression as evidence of guilt.
    reason: lexical_alternative
  - marker: b
    text: '''Like Sodom'' evokes shameless, public wickedness; compare Genesis 13:13; 19:5.'
    reason: cross_reference
  - marker: c
    text: Or 'Woe to their soul' or 'Woe to them.' Hebrew nephesh often means 'self,' 'life,' or 'person,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 얼굴빛이 그들에게 불리한 증언을 하고, 그들은 자기 죄를 소돔처럼 드러내며 숨기지 않습니다. 자기 자신에게 화가 있으니 — 그들이 자기에게 악을 가져왔기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴빛’은 얼굴에 드러난 표정이나 외양이 그들의 죄를 드러낸다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소돔처럼’은 소돔이 공공연하고 뻔뻔한 악행의 대표 상징으로 쓰인다는 점을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: ‘자기 자신에게’는 히브리어 nephesh가 여기서 ‘영혼’보다 ‘자기 자신/자기 존재’를 뜻할 수 있다는 점을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  english_pob_choice: The look on their faces
  chosen_korean: 그들의 얼굴빛
  alternatives_korean:
  - 그들의 얼굴의 표정
  - 그들의 얼굴의 모습
  - 그들의 얼굴의 인상
  lexicon: HALOT
  rationale: 얼굴에 나타난 외형적 표정이 증언한다는 뜻을 자연스럽게 살리기 위해 ‘얼굴빛’으로 옮겼습니다. 이는 공개적 부끄러움과 드러난 내면을 함께 암시합니다.
- source_word: עָנְתָה בָּם
  english_pob_choice: testifies against them
  chosen_korean: 그들에게 불리한 증언을 하고
  alternatives_korean:
  - 그들에게 대답하고
  - 그들을 향해 증언하고
  - 그들을 거슬러 증언하고
  lexicon: HALOT
  rationale: ענה + ב의 법정적, 대적적 뉘앙스를 살려 ‘불리한 증언’을 택했습니다. 현대 한국어에서 자연스럽고 문맥의 유죄 판정을 분명히 드러냅니다.
- source_word: כִּסְדֹם
  english_pob_choice: like Sodom
  chosen_korean: 소돔처럼
  alternatives_korean:
  - 소돔과 같이
  - 소돔의 경우처럼
  - 소돔같이
  lexicon: HALOT
  rationale: 직접적 비교와 수치를 드러내는 상징성을 보존하기 위해 간결하게 ‘소돔처럼’으로 옮겼습니다.
- source_word: לְנַפְשָׁם
  english_pob_choice: Woe to themselves
  chosen_korean: 자기 자신에게 화가 있으니
  alternatives_korean:
  - 그들의 영혼에게 화가 있으니
  - 그들에게 화가 있으니
  - 그들 자신에게 화가 있으니
  lexicon: HALOT
  rationale: נפש를 좁게 ‘영혼’으로 옮기지 않고, 문맥상 자기 자신 전체를 가리키는 반사적 용법으로 이해해 ‘자기 자신에게’로 처리했습니다.
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  english_pob_choice: for they have brought evil on themselves
  chosen_korean: 그들이 자기에게 악을 가져왔기 때문입니다
  alternatives_korean:
  - 그들이 자기에게 악으로 갚았기 때문입니다
  - 그들이 자기에게 악을 되돌렸기 때문입니다
  - 그들이 자기에게 악을 행했기 때문입니다
  lexicon: HALOT
  rationale: גמל의 보응/되갚음 의미를 반영하되, 결과가 자기에게 되돌아온다는 점을 현대어로 분명히 하기 위해 ‘악을 가져왔다’로 옮겼습니다. רָעָה는 단순한 불이익보다 강한 ‘악’으로 유지했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: 여기서는 존재 전체를 가리키는 반사적 표현으로 이해하여 ‘자기 자신’으로 번역했습니다.
  alternative_readings:
  - 그들의 영혼에게 화가 있으니
  - 그들에게 화가 있으니
  - 그들의 생명에게 화가 있으니
  rationale: 예언자의 탄식은 영혼론적 진술이 아니라 당사자들 자신에 대한 재앙 선포입니다. 따라서 한국어에서도 ‘영혼’보다 자기 지시를 드러내는 표현이 더 정확합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 절의 신학적 무게
  chosen_reading: 죄의 결과가 자기들에게 되돌아오는 자기초래적 심판으로 유지했습니다.
  alternative_readings:
  - 하나님의 심판을 더 직접적으로 밝히는 번역
  - 사회적 결과만을 암시하는 번역
  rationale: 본문은 그 메커니즘을 길게 설명하지 않고, 그들이 악을 자기에게 가져왔다는 사실을 진술합니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3
