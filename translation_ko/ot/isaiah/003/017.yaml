base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
  footnotes:
  - marker: a
    text: Or 'their nakedness'; the Hebrew term is difficult, and some take it more specifically as a euphemism for intimate parts, while others understand it differently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주께서 시온의 딸들의 정수리에 부스럼이 나게 하실 것이며, 야훼께서 그들의 은밀한 부분을 드러내실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 나체’. 히브리어 낱말은 뜻이 분명하지 않습니다. 이를 은밀한 부분을 가리키는 완곡한 표현으로 보는 이들도 있고, 다른 뜻으로 이해하는 이들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  english_pob_choice: will strike ... with scabs
  chosen_korean: 종기로 치시고
  alternatives_korean:
  - 종기로 치실 것입니다
  - 부스럼으로 치시고
  - 종기가 나게 하시고
  lexicon: HALOT
  rationale: 히브리어 동사는 벌로서 피부병성 상처를 입히는 뜻이므로, 한국어에서는 결과를 명시한 ‘종기로 치시고’가 징벌의 강도를 살립니다.
- source_word: קָדְקֹד
  english_pob_choice: the crown
  chosen_korean: 정수리
  alternatives_korean:
  - 머리 꼭대기
  - 머리의 꼭대기
  lexicon: HALOT
  rationale: 직역상 ‘머리 꼭대기’이지만, 한국어에서는 신체 부위로서 ‘정수리’가 자연스럽고 본문이 말하는 수치스러운 상해를 잘 드러냅니다.
- source_word: בְּנוֹת צִיּוֹן
  english_pob_choice: the daughters of Zion
  chosen_korean: 시온의 딸들
  alternatives_korean:
  - 시온의 여자들
  - 시온의 소녀들
  lexicon: HALOT
  rationale: 예언 시가의 인격화와 문학적 호칭을 보존하기 위해 직역에 가깝게 ‘시온의 딸들’로 옮겼습니다.
- source_word: פָּתְהֵן
  english_pob_choice: their private parts
  chosen_korean: 그들의 속
  alternatives_korean:
  - 그들의 민낯
  - 그들의 나체
  - 그들의 은밀한 부분
  lexicon: HALOT
  rationale: 히브리어가 난해하고 노출·수치의 뉘앙스를 갖기 때문에, 지나치게 해석을 고정하지 않으면서도 노출을 암시하는 완곡한 표현으로 옮겼습니다.
theological_decisions:
- issue: 아도나이와 야훼를 서로 구별해 옮기는 문제
  chosen_reading: אֲדֹנָי를 ‘주’로, יהוה를 ‘야훼’로 구별하여 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주’로 번역
  - יהוה도 ‘주’로 번역
  rationale: 원문은 두 신적 호칭을 병렬로 사용하므로, 구별을 보존하는 것이 본문 형식을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
