translation:
  language: ko
  text: 용사와 전사, 재판관과 예언자, 점술가와 장로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘점치는 사람’. 히브리어 용어는 점술을 행하는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  english_pob_choice: the mighty man
  chosen_korean: 유력한 사람
  alternatives_korean:
  - 강한 사람
  - 용사
  - 영웅
  lexicon: HALOT
  rationale: 문맥이 예루살렘과 유다에서 제거될 사회적 지도층의 목록이므로, 무공을 과장하는 표현보다 힘과 영향력을 가진 남성을 가리키는 쪽이 적절합니다. ‘유력한 사람’은 영어 POB의 ‘mighty man’이 지닌 대표성도 비교적 자연스럽게 살립니다.
- source_word: אִישׁ מִלְחָמָה
  english_pob_choice: the man of war
  chosen_korean: 전쟁하는 사람
  alternatives_korean:
  - 전사
  - 군인
  - 전투원
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 표현과 ‘전쟁의 사람’이라는 관용을 비교적 직역에 가깝게 살리면서도 한국어에서 어색한 ‘전쟁의 사람’을 피했습니다. 앞의 ‘유력한 사람’과 구별되는 군사적 역할을 유지합니다.
- source_word: שׁוֹפֵט
  english_pob_choice: the judge
  chosen_korean: 재판관
  alternatives_korean:
  - 판관
  - 판사
  lexicon: HALOT
  rationale: 법정·통치 기능을 함께 품는 고대 히브리어 직분을 오늘날 독자가 이해하기 쉽게 옮기기 위해 ‘재판관’을 택했습니다. 단순히 직업명 ‘판사’보다 본문의 사회적 직무 범주를 더 넓게 반영합니다.
- source_word: קֹסֵם
  english_pob_choice: the diviner
  chosen_korean: 점술가
  alternatives_korean:
  - 무당
  - 예언자
  - 복술가
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 이 말은 점복·주술적 점술 행위를 가리키므로, 의미를 직접 드러내는 한국어를 택했습니다. ‘점술가’는 본문의 비판적 맥락을 흐리지 않으면서도 문학적으로 과도하게 속되지는 않습니다.
- source_word: זָקֵן
  english_pob_choice: the elder
  chosen_korean: 장로
  alternatives_korean:
  - 노인
  - 연장자
  lexicon: HALOT
  rationale: 여기서는 단순한 나이보다 공적 지위와 공동체 नेतृत्व을 가리키므로 ‘장로’가 가장 적절합니다. 영어 POB의 ‘elder’에 대응하면서도 한국어 성서 용례와도 잘 맞습니다.
theological_decisions:
- issue: 점술가/점술 행위의 번역
  chosen_reading: ‘점술가’로 직설적으로 옮겨, 본문이 제거될 대상의 목록이라는 점을 분명히 했습니다.
  alternative_readings:
  - ‘복술가’
  - ‘점쟁이’
  - 완곡하게 ‘점치는 사람’
  rationale: 본문은 이러한 인물들을 승인하는 것이 아니라 심판으로 제거될 사회적 요소로 열거합니다. 따라서 의미를 약화시키지 않는 직접 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
