source:
  edition: WLC
  text: וְ/הָיָה֩ תַ֨חַת בֹּ֜שֶׂם מַ֣ק יִֽהְיֶ֗ה וְ/תַ֨חַת חֲגוֹרָ֤ה נִקְפָּה֙ וְ/תַ֨חַת מַעֲשֶׂ֤ה מִקְשֶׁה֙ קָרְחָ֔ה וְ/תַ֥חַת פְּתִיגִ֖יל מַחֲגֹ֣רֶת שָׂ֑ק כִּי תַ֖חַת יֹֽפִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
  footnotes:
  - marker: a
    text: Or 'a cord.' The rare Hebrew term may refer either to a rope replacing an ornamental belt or to a rope-like mark of humiliation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase rendered 'well-set hair' is difficult and may refer more broadly to elaborate adornment or finely worked attire; the pairing with 'baldness' favors a reference to dressed hair.
    reason: lexical_alternative
  - marker: c
    text: The final clause is textually and lexically difficult. Many understand the sense to be 'branding instead of beauty,' while some translations render more generally 'instead of beauty, shame' or similar.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이렇게 될 것입니다. 향수 대신 썩음이, 허리띠 대신 밧줄이[a], 잘 손질한 머리 대신 대머리가[b], 값비싼 겉옷 대신 굵은 베를 허리에 두름이, 아름다움 대신 낙인이 있을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 히브리어는 장식용 허리띠를 대신하는 밧줄, 또는 굴욕을 드러내는 밧줄 같은 흔적을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잘 손질한 머리’는 더 넓게는 정성껏 꾸민 장식이나 정교하게 만든 치장을 가리킬 수도 있습니다. 그러나 바로 뒤의 ‘대머리’와의 짝을 고려하면 머리손질을 뜻하는 쪽이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 히브리어 본문상 매우 어렵습니다. 많은 번역은 ‘아름다움 대신 낙인’의 뜻으로 이해하며, 더 일반적으로는 ‘아름다움 대신 수치’로 옮기기도 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  english_pob_choice: perfume
  chosen_korean: 향수
  alternatives_korean:
  - 향료
  - 향내
  lexicon: HALOT
  rationale: 향내보다 물건성 있는 향유·향수의 이미지를 살리고, 뒤의 ‘썩음’과 대비되는 감각적 효과를 현대적으로 분명하게 드러냅니다.
- source_word: מַק
  english_pob_choice: rottenness
  chosen_korean: 썩음
  alternatives_korean:
  - 부패
  - 썩은 것
  - 악취
  lexicon: HALOT
  rationale: 문자적으로는 부패 상태를 가리키므로, ‘썩음’이 가장 직접적이고 압축적으로 대응합니다.
- source_word: חֲגוֹרָה
  english_pob_choice: belt
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 벨트
  lexicon: HALOT
  rationale: 일상적이고 자연스러운 현대 한국어로 허리에 두르는 장식용 띠를 잘 전달합니다.
- source_word: מַעֲשֶׂה מִקְשֶׁה
  english_pob_choice: well-set hair
  chosen_korean: 잘 손질한 머리
  alternatives_korean:
  - 정성껏 꾸민 머리
  - 잘 빗어 올린 머리
  - 화려하게 꾸민 머리
  lexicon: HALOT
  rationale: 원문은 어렵지만 문맥상 장식된 머리 모양을 가리키는 것으로 보이므로, ‘머리’로 풀어 주되 장식성과 손질의 뉘앙스를 유지했습니다.
- source_word: פְּתִיגִיל
  english_pob_choice: a rich robe
  chosen_korean: 값비싼 겉옷
  alternatives_korean:
  - 화려한 옷
  - 고운 겉옷
  - 사치스러운 옷
  lexicon: HALOT
  rationale: 희귀어의 고급 외투 이미지를 살리면서도, 구체적 형태를 과도하게 단정하지 않도록 했습니다.
- source_word: מַחֲגֹרֶת שָׂק
  english_pob_choice: a girding of sackcloth
  chosen_korean: 베옷을 두른 몸
  alternatives_korean:
  - 베옷 허리띠
  - 베옷을 띠처럼 두름
  - 삼베를 허리에 두름
  lexicon: HALOT
  rationale: 직역형 표현보다 한국어에서 더 자연스럽게 수치와 애도의 옷차림을 드러내기 위해 ‘두른 몸’으로 옮겼습니다.
- source_word: כִּי תַחַת יֹפִי
  english_pob_choice: branding instead of beauty
  chosen_korean: 아름다움 대신 낙인
  alternatives_korean:
  - 아름다움 대신 수치
  - 아름다움 대신 화상 자국
  - 아름다움 대신 찍힌 흔적
  lexicon: HALOT
  rationale: 마지막 절은 본문상 난해하지만, POB의 해석을 따라 ‘낙인’으로 옮겨 조롱과 훼손의 의미를 살렸습니다.
theological_decisions:
- issue: 마지막 난구의 처리
  chosen_reading: ‘브랜딩/낙인’의 이미지로 번역해, 아름다움이 공적 수치와 훼손으로 뒤집히는 심판의 역전을 드러냈습니다.
  alternative_readings:
  - ‘아름다움 대신 수치’
  - ‘아름다움 대신 상처’
  - ‘아름다움 대신 화상 자국’
  rationale: 히브리어가 매우 어렵기 때문에 의미를 완전히 단정하기보다, 문맥이 요구하는 수치와 훼손의 강한 이미지를 보존하는 쪽을 택했습니다.
  doctrine_reference: 예언서의 심판 이미지와 수치/굴욕의 반전
- issue: 문장 전체의 종결 형식
  chosen_reading: 예언 선언체에 맞춰 ‘그리고 이렇게 될 것입니다’로 시작했습니다.
  alternative_readings:
  - ‘그리고 이렇게 됩니다’
  - ‘그리하여 될 것입니다’
  rationale: 히브리어의 미래·예언적 확정성을 한국어에서 자연스럽게 살리기 위한 선택입니다.
  doctrine_reference: 예언적 확정 표현
