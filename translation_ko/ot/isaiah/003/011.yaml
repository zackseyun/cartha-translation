  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
  footnotes:
  - marker: a
    text: Or, more formally, 'Woe to the wicked! Evil is upon him, for the recompense of his hands shall be done to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인에게 화가 있습니다! 그에게 재앙이 닥칠 것입니다. 그의 손으로 한 일의 보응이 그에게 행해질 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘악인에게 화가 있다! 그에게 재앙이 있다. 그의 손의 보응이 그에게 행해질 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֖וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 책망과 경고를 함께 담는 감탄사로, 현대 한국어에서 자연스럽고 합쇼체에 맞게 옮겼습니다.
- source_word: לְ/רָשָׁ֣ע
  english_pob_choice: to the wicked
  chosen_korean: 악인에게
  alternatives_korean:
  - 악한 자에게
  - 악인에게로
  lexicon: HALOT
  rationale: 전치사 לְ가 책망의 대상임을 표시하므로, 한국어에서는 목적격 조사로 자연스럽게 처리했습니다.
- source_word: גְמ֥וּל יָדָ֖י/ו
  english_pob_choice: what his hands have done
  chosen_korean: 그의 손이 한 일대로
  alternatives_korean:
  - 그의 손의 보응대로
  - 그의 손이 행한 대로
  lexicon: HALOT
  rationale: גְמוּל은 보응/되갚음의 의미이지만, 본문에서는 행위와 그에 상응하는 결과를 가리키므로 ‘한 일대로’로 의미를 드러내면서도 응보의 관계를 살렸습니다.
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  english_pob_choice: will be done to him
  chosen_korean: 그에게 이루어질 것이기 때문입니다
  alternatives_korean:
  - 그에게 행해질 것이기 때문입니다
  - 그에게 갚아질 것이기 때문입니다
  lexicon: HALOT
  rationale: Nifal of עשה의 수동/사동적 결과를 한국어에서 자연스럽게 살리기 위해 ‘이루어질’로 옮겼습니다. 응보의 뉘앙스는 문맥이 분명히 드러냅니다.
theological_decisions:
- issue: 대표적 단수의 보응 선언
  chosen_reading: ‘그에게’와 단수형을 유지해, 악인 일반을 대표하는 단수 경고로 읽었습니다.
  alternative_readings:
  - 그들에게
  - 악인들에게
  rationale: 히브리어가 단수 구성을 사용하므로, 일반적 범주를 뜻하더라도 단수를 보존하는 것이 본문 구조와 경고의 직설성을 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: 응보의 문맥을 직접적 법률어로 과도하게 풀이하지 않음
  chosen_reading: ‘이루어질’로 번역해, 행위에 상응하는 결과가 돌아온다는 본문 자체의 논리를 유지했습니다.
  alternative_readings:
  - 갚아질
  - 보응받을
  rationale: 본문은 교리적 설명보다 예언적 선언의 형식이 강하므로, 해석을 앞세운 법정 용어보다 원문의 반복과 응보성을 그대로 드러내는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 3
