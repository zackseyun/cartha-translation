base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/013.yaml
  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
  footnotes:
  - marker: a
    text: Or 'to bring a case' / 'to plead a case'; the Hebrew verb can carry legal-contest imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'the nations'; Hebrew 'the peoples' is plural and may refer broadly to multiple peoples.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 다투시려고[a] 서시며, 백성들을[b] 심판하시려고 서 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소송을 제기하시려고’ 또는 ‘소송을 다투시려고’로 옮길 수 있습니다. 히브리어 동사는 법정적 다툼의 이미지를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들을’로 옮길 수 있습니다. 히브리어는 복수형이며, 여러 백성이나 집단을 넓게 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּב
  english_pob_choice: takes his stand
  chosen_korean: 서시며
  alternatives_korean:
  - 서 계시며
  - 자리를 잡으시며
  - 굳게 서시며
  lexicon: HALOT
  rationale: 법정적 대결 장면에서 ‘takes his stand’의 능동적·준비된 자세를 한국어로는 간결하게 ‘서시며’로 옮기되, 과도한 해설 없이 긴장감을 살렸습니다.
- source_word: לָרִיב
  english_pob_choice: to contend
  chosen_korean: 변론하시려고
  alternatives_korean:
  - 다투시려고
  - 송사하시려고
  - 논쟁하시려고
  lexicon: HALOT
  rationale: ריב은 법적 다툼/소송의 뜻을 가지므로, 단순한 감정적 ‘다툼’보다 법정 언어에 가까운 ‘변론’이 소송적 뉘앙스를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭 대체어가 아니라 고유한 신적 이름을 보존했습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 민족들을
  alternatives_korean:
  - 백성들을
  - 여러 백성들을
  - 나라들을
  lexicon: HALOT
  rationale: 히브리어 복수형의 넓은 범위를 살리기 위해 단수화하지 않고 ‘민족들을’로 옮겼습니다. ‘백성들’보다 외연이 넓어 본문의 보편적 심판 이미지를 유지합니다.
theological_decisions:
- issue: ריב의 법정 이미지와 한국어 선택
  chosen_reading: ‘변론하시려고’로 소송/쟁론의 법정적 긴장을 유지했습니다.
  alternative_readings:
  - ‘다투시려고’로 더 일반적으로 옮길 수 있음
  - ‘송사하시려고’로 더 직접적인 법정 용어를 쓸 수 있음
  rationale: 문맥은 단순한 언쟁이 아니라 야훼의 공적 심판 장면이므로, 법정적 의미를 드러내되 지나치게 기술적이지 않은 표현을 택했습니다.
  doctrine_reference: Preserve legal-contest imagery without domesticating the prophetic courtroom scene
