  to: 백성이 서로 억누를 것입니다. 사람이 사람을, 각 사람이 자기 이웃을 억누를 것입니다. 젊은이가 노인에게, 비천한 사람이 존귀한 사람에게 거만하게 굴 것입니다.[a][b]
