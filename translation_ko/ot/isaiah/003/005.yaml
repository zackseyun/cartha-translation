base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
  footnotes:
  - marker: a
    text: Or, 'man against man, and each against his neighbor.' The Hebrew repeats distributive expressions to emphasize widespread mutual hostility.
    reason: lexical_alternative
  - marker: b
    text: '''The elder'' may also be rendered ''the old man'' or ''the aged''; the Hebrew term can denote both age and social seniority.'
    reason: lexical_alternative
  - marker: c
    text: Or 'one another, each man his fellow'.
    reason: previous_rendering
translation:
  language: ko
  text: 백성이 서로를 학대할 것입니다 — 사람과 사람 사이에, 각자 자기 이웃과 싸우듯이 말입니다. 젊은이는 노인에게, 천한 사람은 존귀한 사람에게 거만하게 굴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 분배적 표현을 반복하여 상호 적대가 널리 퍼짐을 강조합니다.
    reason: source_note
  - marker: b
    text: ‘זקן’은 ‘노인’뿐 아니라 ‘장로’나 ‘어른’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגַּשׂ
  english_pob_choice: will oppress
  chosen_korean: 학대할 것입니다
  alternatives_korean:
  - 압박할 것입니다
  - 짓누를 것입니다
  - 핍박할 것입니다
  lexicon: HALOT
  rationale: 상호적 사회 붕괴를 나타내는 동사로, 단순한 ‘다가감’보다 폭력적 사회적 압박을 드러내는 표현이 필요합니다.
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  english_pob_choice: man against man, and each against his neighbor
  chosen_korean: 사람과 사람 사이에, 각자 자기 이웃과 싸우듯이
  alternatives_korean:
  - 사람 대 사람으로, 각자 자기 이웃과
  - 사람이 사람을, 각자가 자기 이웃을
  lexicon: HALOT
  rationale: 히브리어의 분배적 반복을 살려 상호 적대와 개인별 대립을 함께 보이도록 옮겼습니다.
- source_word: יִרְהֲב֗וּ
  english_pob_choice: will act arrogantly toward
  chosen_korean: 거만하게 굴 것입니다
  alternatives_korean:
  - 오만하게 굴 것입니다
  - 불손하게 대할 것입니다
  - 뻔뻔하게 굴 것입니다
  lexicon: HALOT
  rationale: 사회적 무례와 우쭐거림을 함께 담는 현대 한국어 표현으로, 문맥의 불손함을 자연스럽게 전달합니다.
- source_word: בַּזָּקֵן / הַנִּקְלֶה / בַּנִּכְבָּד
  english_pob_choice: toward the elder / the despised / toward the honored
  chosen_korean: 노인에게 / 천한 사람은 / 존귀한 사람에게
  alternatives_korean:
  - 장로에게 / 멸시받는 사람은 / 존중받는 사람에게
  - 어른에게 / 천하게 여김받는 자는 / 귀한 사람에게
  lexicon: HALOT
  rationale: ‘זקן’은 연령과 사회적 위계를 함께 가리킬 수 있어 ‘노인’으로, 마지막 대조는 사회적 평가의 높고 낮음을 살려 ‘천한 사람’과 ‘존귀한 사람’으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 사회적 붕괴 묘사와 ‘학대하다’의 강도
  chosen_reading: 백성이 서로를 학대할 것입니다
  alternative_readings:
  - 백성이 서로를 압박할 것입니다
  - 백성이 서로를 공격할 것입니다
  rationale: 예언문맥의 폭력성과 공동체 해체를 분명히 드러내기 위해, 단순한 압박보다 강한 사회적 폭력을 나타내는 동사를 선택했습니다.
  doctrine_reference: 이사야 3장 문맥의 심판 선언
- issue: ‘זקן’의 번역 범위
  chosen_reading: 노인
  alternative_readings:
  - 장로
  - 어른
  - 늙은 사람
  rationale: 여기서는 제도적 직분보다 연령과 사회적 존중의 대비가 핵심이므로, ‘노인’이 가장 직접적으로 대조를 살립니다.
  doctrine_reference: 이사야 3장 5절의 사회 질서 붕괴 묘사
