  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/פְּאֵרִ֤ים וְ/הַ/צְּעָדוֹת֙ וְ/הַ/קִּשֻּׁרִ֔ים וּ/בָתֵּ֥י הַ/נֶּ֖פֶשׁ וְ/הַ/לְּחָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/020.yaml
  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
  footnotes:
  - marker: a
    text: Or 'charms'; the Hebrew term is related to whispering or incantation, so it may refer to amulets associated with spells.
    reason: lexical_alternative
  - marker: b
    text: Literally 'houses of the soul/life,' likely small containers for perfume or fragrant substances.
    reason: lexical_alternative
translation:
  language: ko
  text: 머리장식들과 발목사슬들과 띠들과 향수 상자들과 부적들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘영혼/생명의 집들’이며, 문맥상 향수나 향기로운 물질을 담는 작은 용기를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어는 속삭임이나 주술적 주문과 관련된 말로, 부적이나 주문용 물건을 뜻하는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  english_pob_choice: the headdresses
  chosen_korean: 머리장식들
  alternatives_korean:
  - 두건들
  - 터번들
  - 장식품들
  lexicon: HALOT
  rationale: 머리에 쓰는 장신구라는 의미를 살리면서 현대 한국어에서 자연스럽고 포괄적으로 들리는 표현으로 옮겼습니다.
- source_word: הַצְּעָדוֹת
  english_pob_choice: the ankle chains
  chosen_korean: 발목사슬들
  alternatives_korean:
  - 발찌들
  - 발목장식들
  - 발목사슬 장신구들
  lexicon: HALOT
  rationale: 발이나 발목에 차는 장신구라는 점과 사슬 같은 형식을 함께 드러내기 위해 직역에 가까운 표현을 택했습니다.
- source_word: הַקִּשֻּׁרִים
  english_pob_choice: the sashes
  chosen_korean: 띠들
  alternatives_korean:
  - 허리띠들
  - 장식띠들
  - 매는 끈들
  lexicon: HALOT
  rationale: ‘묶는 것’이라는 어근 의미를 반영하면서도, 장신구 목록의 맥락에서 가장 무난한 한국어로 옮겼습니다.
- source_word: בָּתֵּי הַנֶּפֶשׁ
  english_pob_choice: the perfume boxes
  chosen_korean: 향수 상자들
  alternatives_korean:
  - 향유 병들
  - 향료 통들
  - 생명 상자들
  lexicon: HALOT
  rationale: 직역하면 ‘영혼/생명의 집들’이지만, 문맥상 향기로운 물질을 담는 작은 용기이므로 그 추정되는 기능을 드러내는 표현으로 옮겼습니다.
- source_word: הַלְּחָשִׁים
  english_pob_choice: the amulets
  chosen_korean: 부적들
  alternatives_korean:
  - 호신부들
  - 주문 부적들
  - 속삭임 장신구들
  lexicon: HALOT
  rationale: ‘속삭임/주문’과 관련된 어근을 가진 말로서, 주술적 성격을 가진 물건을 가리키는 것으로 이해하여 한국어의 ‘부적’으로 옮겼습니다.
theological_decisions:
- issue: לְחָשִׁים의 주술적 뉘앙스를 어떻게 살릴 것인가
  chosen_reading: ‘부적들’로 구체적 물건을 제시해, 우상적·주술적 의존의 대상을 드러냈습니다.
  alternative_readings:
  - ‘주문들’
  - ‘속삭이는 말들’
  - ‘부적류’
  rationale: 이 단락은 심판 아래서 제거되는 사치품 목록이므로, 추상적 말행위보다 몸에 지닌 물건으로 읽는 편이 문맥에 맞습니다. 동시에 어근이 지닌 주술적 배경은 ‘부적’이 비교적 잘 보존합니다.
  doctrine_reference: 문맥 우선의 의미 보존; 주술/우상성 관련 긴장을 완화하지 않음
