id: ISA.3.10
reference: Isaiah 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
  footnotes:
  - marker: a
    text: Or, more formally, 'Say of the righteous one that it is good, for they/he will eat the fruit of their/his deeds.' The Hebrew shifts from a representative singular ('righteous') to plural forms in the final clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인에게는 잘될 것이라고 말하라[a]. 그들의 행위의 열매를 그들이 먹을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 형식적으로는 ‘의인에게는 좋다고 말하라…’로도 옮길 수 있습니다. 히브리어는 앞부분에서 대표적 단수 표현을 쓰다가 끝부분에서 복수형으로 전환합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  english_pob_choice: Say
  chosen_korean: 말하라
  alternatives_korean:
  - 이르라
  - 말하십시오
  - 선포하라
  lexicon: HALOT
  rationale: 히브리어 복수 명령형 אמר의 직접적 명령을 살리되, 현대 한국어에서 가장 자연스럽고 간결한 명령형인 ‘말하라’로 옮겼습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의인들
  - 의로운 사람
  - 의로운 이
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰인 표현으로, 집합적 의미를 담으면서도 한국어에서 자연스러운 성서 용어인 ‘의인’을 택했습니다.
- source_word: טוֹב
  english_pob_choice: it will be well
  chosen_korean: 잘될 것이라고
  alternatives_korean:
  - 좋을 것이라고
  - 복될 것이라고
  - 평안할 것이라고
  lexicon: HALOT
  rationale: 직역의 ‘좋다’보다 문맥상의 관용적 뜻인 ‘잘되다’가 결과의 복을 더 자연스럽게 드러냅니다.
- source_word: פְרִי מַעַלְלֵיהֶם
  english_pob_choice: the fruit of their deeds
  chosen_korean: 그들의 행위의 열매
  alternatives_korean:
  - 그들의 행실의 열매
  - 그들의 소산
  - 그들의 행동의 결과
  lexicon: HALOT
  rationale: ‘열매’의 은유를 유지하고, מַעַלְלִים의 ‘행위/소행’ 의미를 ‘행위’로 옮겨 도덕적 책임의 뉘앙스를 살렸습니다.
- source_word: יֹאכֵלוּ
  english_pob_choice: they will eat
  chosen_korean: 먹을 것이기 때문입니다
  alternatives_korean:
  - 먹을 것이기 때문입니다
  - 먹게 될 것이기 때문입니다
  - 누리게 될 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘먹다’를 그대로 유지해 보상/수확의 이미지를 보존했고, 한국어에서는 앞절과의 인과를 자연스럽게 잇기 위해 ‘~것이기 때문입니다’로 풀었습니다.
theological_decisions:
- issue: 집합적 의인과 복수 결론의 대응
  chosen_reading: צַדִּיק을 단수 대표형이 아니라 집합적 표현인 ‘의인’으로 옮기고, 뒤의 복수 동사와 복수 접미사는 ‘그들이’로 반영했습니다.
  alternative_readings:
  - ‘의로운 사람’으로 단수 대표형을 살리는 번역
  - ‘의인들’로 명시적 복수 번역
  rationale: 히브리어는 시작 부분에서 대표적 단수처럼 보이지만 결론은 복수형이므로, 한국어에서도 집합적 의미와 복수 결과를 함께 드러내는 것이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 번역 원칙 §4, §5
