  to: 내 백성아—그를 억압하는 자들은 어린아이들이며, 여인들이 그를 다스립니다. 내 백성아, 너의 인도자들은[a] 너를 그릇된 길로 이끌고 너의 길의 행로를 삼켜 버립니다.[b]
