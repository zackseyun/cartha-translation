id: ISA.3.12
reference: Isaiah 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
  footnotes:
  - marker: a
    text: Or, 'your blessers' or 'those who call you blessed'; the Hebrew form can carry that sense, but in context it likely refers to leaders or guides who misdirect the people.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says, 'the way of your paths they have swallowed up,' a vivid metaphor for obliterating the people's proper course.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성아—그를 억압하는 자들은 어린아이들이며, 여인들이 그를 다스립니다. 내 백성아, 너의 인도자들은[a] 너를 그릇된 길로 이끌고 너의 길의 행로를 삼켜 버립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 형태는 ‘너를 복되다 하는 자들’ 또는 ‘너를 복되다 일컫는 자들’이라는 뜻일 수도 있습니다. 그러나 여기서는 백성을 그릇된 길로 이끄는 지도자들 또는 인도자들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘너의 길들의 길을 그들이 삼켜 버렸다’고 말합니다. 이는 백성이 가야 할 올바른 길을 없애 버린다는 생생한 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי / נֹגְשָׂיו
  english_pob_choice: My people—his oppressors
  chosen_korean: 내 백성아—너희를 억압하는 자들은
  alternatives_korean:
  - 내 백성아—그를 억압하는 자들은
  - 내 백성아—그들의 압제자들은
  lexicon: HALOT
  rationale: עַם을 집합적 단수로 보아 3인칭 단수 소유격의 긴장을 살리되, 한국어에서는 자연스럽게 복수 주어로 옮겼습니다. נגשׂ는 단순한 ‘부역 담당자’보다 사회적 억압의 뉘앙스가 강해 ‘억압하는 자들’이 적절합니다.
- source_word: מְעוֹלֵל
  english_pob_choice: are children
  chosen_korean: 어린아이들이며
  alternatives_korean:
  - 아이들이며
  - 어린 자들이며
  - 어린아이처럼 행동하며
  lexicon: HALOT
  rationale: 문맥상 미성숙하고 통치에 부적합한 존재를 가리키는 이미지가 핵심이므로, ‘어린아이들’로 직역에 가까우면서도 의미를 살렸습니다.
- source_word: מְאַשְּׁרֶיךָ
  english_pob_choice: your guides
  chosen_korean: 너희 안내자들은
  alternatives_korean:
  - 너희 인도자들은
  - 너희를 복되다 하는 자들은
  - 너희를 칭찬하는 자들은
  lexicon: HALOT
  rationale: 아쉬르의 פי엘형은 문맥에 따라 ‘복되다 하다’도 가능하지만, 여기서는 다음 절의 ‘그릇된 길로 이끌고’와 병행되어 실제 지도자/안내자의 의미가 더 강합니다. 한국어에서는 ‘안내자들’이 오도하는 지도자라는 뉘앙스를 유지합니다.
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ / בִּלֵּעוּ
  english_pob_choice: the course of your paths / swallow up
  chosen_korean: 너희 길의 행로를 삼켜 버립니다
  alternatives_korean:
  - 너희 길의 길을 삼켜 버립니다
  - 너희의 길을 집어삼킵니다
  - 너희 길의 진로를 없애 버립니다
  lexicon: HALOT
  rationale: 중복된 ‘way/path’ 표현을 모두 살리기 위해 ‘길의 행로’로 옮겼고, בלע의 생생한 은유는 ‘삼켜 버립니다’로 보존했습니다.
theological_decisions:
- issue: 여인들이 다스린다는 표현의 처리
  chosen_reading: 본문의 ‘여인들이 그들을 다스립니다’를 그대로 유지해, 이사야의 예언적 역전/무질서 비판을 드러내고 여성 일반에 대한 교리적 진술로 확장하지 않았습니다.
  alternative_readings:
  - 더 일반적으로 ‘약한 자들이 그들을 다스립니다’로 완화
  - 성별 언급을 삭제하고 ‘통치가 무너집니다’로 의역
  rationale: 히브리어 본문은 실제로 ‘여인들’을 말하므로 성별 표지를 지우지 않았습니다. 동시에 문맥상 심판의 수사임을 분명히 하여 여성 전체에 대한 평가로 읽히지 않게 했습니다.
  doctrine_reference: Translation philosophy §§1, 4
