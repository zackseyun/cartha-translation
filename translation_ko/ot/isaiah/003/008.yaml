- from: 예루살렘이 넘어졌고, 유다가 쓰러졌습니다. 이는 그들의 혀와 그들의 행위가 야훼를 거슬러, 그의 영광의 눈앞에서 반역하기 때문입니다.[a]
  to: 예루살렘이 비틀거렸고 유다가 넘어졌습니다. 그들의 혀와 행위가 야훼를 거슬러 그의 영광의 눈앞에서 반역하기 때문입니다.[a]
