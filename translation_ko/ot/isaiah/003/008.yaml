id: ISA.3.8
reference: Isaiah 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָשְׁלָה֙ יְר֣וּשָׁלִַ֔ם וִ/יהוּדָ֖ה נָפָ֑ל כִּֽי לְשׁוֹנָ֤/ם וּ/מַֽעַלְלֵי/הֶם֙ אֶל יְהוָ֔ה לַ/מְר֖וֹת עֵנֵ֥י כְבוֹדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
  footnotes:
  - marker: a
    text: Or 'in the sight of his glory.' The Hebrew is literally 'the eyes of his glory,' a vivid expression for open defiance before the LORD's glorious presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘이 비틀거렸고 유다가 넘어졌습니다. 그들의 혀와 행위가 야훼를 거슬러 그의 영광의 눈앞에서 반역하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영광이 보시는 앞에서.’ 히브리어는 문자적으로 ‘그의 영광의 눈들’이라고 하며, 야훼의 영광스러운 임재 앞에서 공공연히 거스르는 모습을 생생하게 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For / because
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 심판 선언을 설명하는 인과를 자연스러운 문어체로 이어 주기 위해 ‘이는’으로 옮겼습니다.
- source_word: כָשְׁלָה / נָפָל
  english_pob_choice: has stumbled / has fallen
  chosen_korean: 넘어졌고 / 쓰러졌습니다
  alternatives_korean:
  - 비틀거렸고 / 무너졌습니다
  - 실족했고 / 넘어졌습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 살리되, ‘넘어지다/쓰러지다’로 시적 평행을 한국어에서 자연스럽게 재현했습니다.
- source_word: לְשׁוֹנָם וּמַעַלְלֵיהֶם
  english_pob_choice: their tongue and their deeds
  chosen_korean: 그들의 혀와 그들의 행위
  alternatives_korean:
  - 그들의 말과 그들의 행동
  - 그들의 혀와 그들의 소행
  lexicon: HALOT
  rationale: ‘혀’는 발화의 구체적 은유를 보존하고, ‘행위’는 도덕적 책임이 걸린 ‘doings’의 무게를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 학술적 음역 ‘야훼’를 사용해 고유 이름을 보존했습니다.
- source_word: לַמְרוֹת עֵנֵי כְבוֹדֽוֹ
  english_pob_choice: rebelling before the eyes of his glory
  chosen_korean: 그의 영광의 눈앞에서 반역하기
  alternatives_korean:
  - 그의 영광의 눈앞에서 거슬러
  - 그의 영광의 눈을 거슬러
  lexicon: HALOT
  rationale: ‘to rebel/provoke against’의 동사적 의미를 ‘반역하기’로, ‘the eyes of his glory’의 낯선 이미지를 ‘영광의 눈앞’으로 최대한 가까이 옮겼습니다.
theological_decisions:
- issue: יַהְוֶה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 신명기적 고유명을 보존하는 것이 문맥의 예언적, 언약적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘영광의 눈앞’의 이미지 보존
  chosen_reading: 그의 영광의 눈앞에서
  alternative_readings:
  - 그의 영광 앞에서
  - 그의 영광스러운 임재 앞에서
  rationale: 히브리어의 직설적이고 낯선 표현을 완화하지 않고 유지해, 공개적 도전과 모독의 뉘앙스를 살렸습니다.
  doctrine_reference: Isaiah 3:8 source wording
