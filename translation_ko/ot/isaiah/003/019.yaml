lexical_decisions:
- source_word: הַנְּטִיפוֹת
  english_pob_choice: the pendants
  chosen_korean: 목걸이들
  alternatives_korean:
  - 펜던트들
  - 귀걸이들
  lexicon: HALOT
  rationale: 걸어서 장식하는 금속 장신구라는 핵심을 살리면서, 한국어에서 가장 자연스럽고 즉각 이해되는 현대적 대응으로 옮겼습니다.
- source_word: הַשֵּׁירוֹת
  english_pob_choice: the bracelets
  chosen_korean: 팔목 장식들
  alternatives_korean:
  - 팔찌들
  - 팔목띠들
  - 팔찌와 쇠사슬들
  lexicon: HALOT
  rationale: 희귀어라 정확한 품목이 확정되지 않으므로, 단정적인 ‘팔찌’보다 기능과 위치를 드러내는 중립적 표현을 택했습니다.
- source_word: הָרְעָלוֹת
  english_pob_choice: the veils
  chosen_korean: 너울들
  alternatives_korean:
  - 베일들
  - 장막들
  - 스카프들
  lexicon: HALOT
  rationale: 머리나 얼굴을 가리는 덮개라는 뜻을 한국어의 전통적이지만 너무 교회적이지 않은 ‘너울’로 옮겼습니다.
