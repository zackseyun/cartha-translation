  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: ko
  text: 보십시오, 만군의 야훼, 주님께서 예루살렘과 유다에서 모든 지팡이 되는 의지와 버팀을 거두어 가십니다—곧 양식의 모든 버팀과 물의 모든 버팀입니다.
  philosophy: formal
lexical_decisions:
- source_word: הִנֵּה / English POB 'look'
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: look
  rationale: 예언 선포의 주의를 환기하는 감탄사로서, 현대 합쇼체에서는 직설적이면서도 공적인 호소인 ‘보십시오’가 가장 자연스럽습니다.
- source_word: יְהוָה צְבָאֹות / English POB 'the LORD of Armies'
  english_pob_choice: the LORD of Armies
  chosen_korean: 만군의 야훼, 주님
  alternatives_korean:
  - 만군의 야훼
  - 만군의 주
  - 만군의 여호와
  lexicon: YHWH / divine title
  rationale: 본문의 주어를 야훼로 옮기되, 뒤따르는 ‘주(主)’의 호칭을 살려 ‘만군의 야훼, 주님’으로 처리해 히브리어의 긴 호칭을 자연스럽게 드러냈습니다.
- source_word: מַשְׁעֵן / מַשְׁעֵנָה
  english_pob_choice: support
  chosen_korean: 버팀
  alternatives_korean:
  - 지탱
  - 의지
  - 지주
  lexicon: support
  rationale: 물질적 의존처라는 이미지를 살리면서도 ‘support’의 반복을 한국어에서 과도하게 추상화하지 않기 위해 ‘버팀’을 선택했습니다.
- source_word: מִשְׁעַן לֶחֶם / מִשְׁעַן מָיִם
  english_pob_choice: all support of bread / all support of water
  chosen_korean: 양식의 모든 버팀과 물의 모든 버팀
  alternatives_korean:
  - 빵의 모든 버팀과 물의 모든 버팀
  - 양식에 대한 모든 의지와 물에 대한 모든 의지
  lexicon: support of bread / water
  rationale: 히브리어의 속격 구조를 보존하여, 생존에 필수적인 ‘양식’과 ‘물’이 각각 의존처로 제시된다는 점이 보이도록 옮겼습니다.
theological_decisions:
- issue: ‘야훼’와 ‘주님’의 병기
  chosen_reading: ‘만군의 야훼, 주님’으로 옮겨, 본문의 신적 이름과 주권 호칭을 함께 드러냈습니다.
  alternative_readings:
  - 만군의 야훼
  - 만군의 주
  rationale: 히브리어의 신명 표기와 칭호가 겹쳐 있는 구조를 한국어에서도 가능한 한 유지하기 위한 선택입니다.
  doctrine_reference: YHWH / κύριος 구분 보존 원칙
