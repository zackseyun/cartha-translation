source:
  edition: WLC
  text: מ/ל/כם תְּדַכְּא֣וּ עַמִּ֔/י וּ/פְנֵ֥י עֲנִיִּ֖ים תִּטְחָ֑נוּ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''What is it to you that...?'' An idiomatic rebuke, rendered here as ''What do you mean by...?'''
    reason: lexical_alternative
  - marker: b
    text: Or 'grinding down the face of the poor.' The Hebrew image is a vivid metaphor for ruthless oppression.
    reason: lexical_alternative
translation:
  language: ko
  text: “어찌하여 내 백성을 짓밟으며 가난한 이들의 얼굴을 빻아 버리느냐?”라고 주(主) 야훼 만군의 하나님께서 선언하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 מָה־לָכֶם을 자연스러운 한국어 책망으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얼굴을 빻다’는 가난한 이들을 잔혹하게 모욕하고 짓밟는 이미지를 살린 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 신명기적 호칭은 ‘주(主) 야훼 만군의 하나님’으로 옮겼습니다.
    reason: theological_note
lexical_decisions:
- source_word: מ/ל/כם
  english_pob_choice: What do you mean by
  chosen_korean: 어찌하여
  alternatives_korean:
  - 무슨 뜻으로
  - 무엇 때문에
  lexicon: HALOT
  rationale: מָה־לָכֶם의 관용적 책망을 한국어 자연문장으로 옮기되, 단순 원인 질문이 아니라 강한 꾸짖음임을 살리기 위해 ‘어찌하여’를 택했습니다.
- source_word: תְּדַכְּא֣וּ
  english_pob_choice: crushing
  chosen_korean: 짓밟으며
  alternatives_korean:
  - 짓누르며
  - 억압하며
  lexicon: HALOT
  rationale: 동사의 물리적·폭력적 이미지를 살리기 위해 추상적인 ‘억압하다’보다 구체적인 ‘짓밟다’를 선택했습니다.
- source_word: עֲנִיִּ֖ים
  english_pob_choice: the poor
  chosen_korean: 가난한 이들
  alternatives_korean:
  - 가난한 자들
  - 궁핍한 이들
  lexicon: HALOT
  rationale: 사회경제적 억압의 대상이라는 문맥을 따라, 현대 한국어에서 자연스러우면서도 비하적이지 않은 표현으로 옮겼습니다.
- source_word: תִּטְחָנ֑וּ
  english_pob_choice: grinding
  chosen_korean: 빻아 버리느냐
  alternatives_korean:
  - 갈아 버리느냐
  - 분쇄하느냐
  lexicon: HALOT
  rationale: טחן의 ‘갈다/빻다’라는 구체적 이미지를 유지하되, 얼굴을 대상으로 한 잔혹한 비유가 드러나도록 ‘빻아 버리다’를 택했습니다.
theological_decisions:
- issue: 이사야 3:15의 책망형 수사와 직접화법의 강도
  chosen_reading: 직접 인용부호 안에 강한 책망을 살린 수사 질문으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화해 번역하는 방식
  - ‘왜 내 백성을...’처럼 단순 원인 질문으로 옮기는 방식
  rationale: 히브리어 מָה־לָכֶם는 단순 정보 질문이 아니라 예언자적 책망이므로, 한국어에서도 그 공격성과 윤리적 고발을 보존해야 합니다.
  doctrine_reference: 예언 문학의 수사적 책망 유지
