  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''What is it to you that...?'' An idiomatic rebuke, rendered here as ''What do you mean by...?'''
    reason: lexical_alternative
  - marker: b
    text: Or 'grinding down the face of the poor.' The Hebrew image is a vivid metaphor for ruthless oppression.
    reason: lexical_alternative
translation:
  language: ko
  text: “어찌하여 너희가 내 백성을 짓밟으며 가난한 이들의 얼굴을 빻느냐?” 만군의 주 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마 라켐’(מָה־לָכֶם)은 직역하면 ‘너희에게 무엇이냐?’이며, 강한 책망을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가난한 이들의 얼굴을 빻다’는 그들을 가혹하게 짓밟고 학대하는 모습을 나타내는 생생한 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מ/ל/כם
