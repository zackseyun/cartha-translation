    reason: lexical_alternative
translation:
  language: ko
  text: 화려한 옷[a], 겉옷[b], 숄[c], 그리고 주머니[d]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고운 옷’으로도 옮길 수 있습니다. 히브리어는 평상복이 아니라 특별하고 값비싼 옷을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두르는 옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘스카프’, ‘베일’로도 옮길 수 있습니다. 정확한 종류는 분명하지 않습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘가방’, ‘주머니주머니’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  english_pob_choice: festal robes
  chosen_korean: 화려한 옷
  alternatives_korean:
  - 축제용 옷
  - 고운 옷
  - 잔치옷
  lexicon: HALOT, BDB
  rationale: 특정 의복의 종류보다 값비싸고 특별한 옷이라는 점이 핵심이므로, 현대 한국어에서 자연스럽고 위신적 뉘앙스를 살리는 ‘화려한 옷’으로 옮겼습니다.
- source_word: מַּעֲטָפֹות
  english_pob_choice: cloaks
  chosen_korean: 겉옷
  alternatives_korean:
  - 망토
  - 두르는 옷
  - 외투
  lexicon: HALOT, BDB
  rationale: ‘감싸는’ 의미의 외투류이므로, 기능과 형태를 모두 무난하게 드러내는 ‘겉옷’이 가장 안정적입니다.
- source_word: מִּטְפָּחֹות
  english_pob_choice: shawls
  chosen_korean: 숄
  alternatives_korean:
  - 스카프
  - 머리수건
  - 베일
  lexicon: HALOT, BDB
  rationale: 정확한 품목이 불확실하므로 과도하게 얼굴 가리개로 좁히지 않으면서도, 옷차림의 장식성 있는 천 조각을 가리키는 현대어 ‘숄’로 처리했습니다.
- source_word: חֲרִיטִים
  english_pob_choice: purses
  chosen_korean: 주머니
  alternatives_korean:
  - 돈주머니
  - 파우치
  - 가방
  lexicon: HALOT, BDB
  rationale: 원어는 귀중품이나 돈을 넣는 작은 주머니를 뜻하므로, 현행 한국어에서 용법이 가장 가깝고 간결한 ‘주머니’로 옮겼습니다.
