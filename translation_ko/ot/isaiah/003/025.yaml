  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
  footnotes:
  - marker: a
    text: Or 'your heroes' or 'your warriors' for 'your mighty ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 남자들은 칼에 쓰러지고, 네 용사들은 전쟁터에서 쓰러집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַיִךְ
  english_pob_choice: your men
  chosen_korean: 네 남자들
  alternatives_korean:
  - 네 사람들
  - 네 죽은 자들
  - 네 용사들
  lexicon: HALOT
  rationale: 문맥상 이미 죽은 자를 뜻하기보다 전쟁에 나선 도시의 남자들을 가리키므로, 자연스러운 현대 한국어로 ‘네 남자들’이 가장 직접적입니다.
- source_word: בַּחֶרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼에
  alternatives_korean:
  - 칼로
  - 칼에 의해
  - 검에
  lexicon: HALOT
  rationale: 히브리어의 수단/도구적 표현을 한국어에서는 피해를 입는 자리인 ‘칼에’로 옮기면, 죽음의 수단이라는 의미가 가장 자연스럽게 살아납니다.
- source_word: וּגְבוּרָתֵךְ
  english_pob_choice: your mighty ones
  chosen_korean: 네 용사들
  alternatives_korean:
  - 네 힘센 자들
  - 네 영웅들
  - 네 강한 자들
  lexicon: HALOT
  rationale: גְבוּרָה가 여기서는 추상적 ‘힘’보다 전투 맥락의 강한 사람들, 곧 용사들을 가리키는 메톤미이므로, ‘네 용사들’이 의미를 가장 분명하게 전달합니다.
- source_word: בַּמִּלְחָמָה
  english_pob_choice: in battle
  chosen_korean: 전쟁터에서
  alternatives_korean:
  - 전쟁에서
  - 전투에서
  lexicon: HALOT
  rationale: ‘칼에’와 평행하는 전투 상황을 살리기 위해, 장소감이 있는 ‘전쟁터에서’로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 어미의 대상 이해
  chosen_reading: 예루살렘/시온을 향한 여성 단수 직접호칭으로 처리했습니다.
  alternative_readings:
  - 시온의 딸들을 집단적으로 부르는 표현
  rationale: 본문의 여성 단수 어미가 도시를 의인화한 خطاب과 맞물리므로, 본문 안에서 해설을 덧붙이지 않고 2인칭 소유를 그대로 살렸습니다.
  doctrine_reference: 예언서의 의인화된 예루살렘 호칭 관행
