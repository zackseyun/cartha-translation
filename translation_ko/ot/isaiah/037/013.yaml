id: ISA.37.13
reference: Isaiah 37:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיֵּ֤ה מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
  footnotes:
  - marker: a
    text: Hena may also be rendered 'Henah.'
    reason: lexical_alternative
  - marker: b
    text: Ivvah may also be rendered 'Avva' in some translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 하맛 왕과 아르밧 왕과 스발와임 성읍과 헤나와 이와의 왕들은 어디에 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤나’는 ‘헤나흐’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이와’는 일부 번역에서 ‘아와(Avva)’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  english_pob_choice: Where is
  chosen_korean: 어디에 있습니까?
  alternatives_korean:
  - 어디에 있습니까
  - 어디 있습니까
  lexicon: HALOT
  rationale: 히브리어 의문부사 אַיֵּה의 직접적인 질문을 살리면서, 합쇼체에서 자연스러운 존재 질문으로 옮겼습니다.
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: HALOT
  rationale: 히브리어 מלך의 기본 의미를 가장 सीधे하게 반영하는 표준어로 ‘왕’을 사용했습니다.
- source_word: לָעִיר סְפַרְוָיִם
  english_pob_choice: of the city of Sepharvaim
  chosen_korean: 스발와임의 성의
  alternatives_korean:
  - 스발와임의 도시의
  - 스발와임 성읍의
  lexicon: HALOT
  rationale: לָעִיר는 단순한 여격보다 ‘~의 성/도시’라는 소유·관계 표현으로 기능하므로, 한국어에서는 ‘~의 성의’로 관계를 드러냈습니다.
- source_word: הֵנַע
  english_pob_choice: Hena
  chosen_korean: 헤나
  alternatives_korean:
  - 헤낙
  - 헤나흐
  lexicon: transliteration
  rationale: 고유명사는 현대 한글 음역으로 옮겼고, 영어 POB의 각주처럼 다른 전사 가능성은 본문이 아닌 이름 표기에서만 최소화했습니다.
- source_word: עִוָּה
  english_pob_choice: Ivvah
  chosen_korean: 이와
  alternatives_korean:
  - 아와
  - 이바
  lexicon: transliteration
  rationale: 히브리어 자음과 통용 음역을 고려해 ‘이와’로 옮겼으며, 영어 전통의 ‘Ivvah’/‘Avva’ 차이는 한국어 본문에서 과도하게 확장하지 않았습니다.
theological_decisions:
- issue: 조롱문의 수사적 반복을 어떻게 살릴 것인가
  chosen_reading: ‘어디에 있습니까?’를 세 번 반복해 히브리어의 조롱 섞인 열거를 그대로 드러냈습니다.
  alternative_readings:
  - 한 번만 묶어 번역하기
  - 문장 하나로 평탄하게 정리하기
  rationale: 이 절은 멸망한 여러 왕들을 나열하며 야훼의 심판을 암시하는 수사적 질문이 핵심이므로, 반복을 줄이지 않고 보존하는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 예언서의 조롱/심판 수사
- issue: 지명들의 소유·관계 구조
  chosen_reading: ‘스발와임의 성의 왕’처럼 ‘~의’ 구조를 유지해 지명과 왕의 관계를 드러냈습니다.
  alternative_readings:
  - 지명을 모두 병렬로 나열하기
  - 관계를 약화해 자연스러운 한국어로만 재배열하기
  rationale: 히브리어는 도시-왕의 관계를 통해 패전한 정치 실체들을 열거하므로, 관계 표지를 보존해야 예언적 조롱의 힘이 유지됩니다.
  doctrine_reference: 본문 구조 보존
