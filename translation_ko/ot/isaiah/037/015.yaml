lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘형 פלל은 여기서 직접적인 ‘기도하다’의 행위를 가리키므로, 서술 흐름을 살리면서도 현대 한국어에서 자연한 ‘기도하며’로 옮겼습니다.
- source_word: חִזְקִיָּהוּ
  english_pob_choice: Hezekiah
  chosen_korean: 히스기야
  alternatives_korean:
  - 헤스기야
  - 히זק야
  lexicon: 표준 성경 인명 표기
  rationale: 고유명사는 한국어 성경에서 널리 정착된 ‘히스기야’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 원문이 여호와의 고유명사(사중음자)를 직접 사용하므로, 전통적 대체 칭호 대신 프로젝트 기본값인 ‘야훼’로 옮겨 이름 자체를 보존했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 이어지는 직접 화법을 자연스럽게 여는 연결어로 ‘말했습니다’를 택해, 서술문 속 화행을 한국어답게 처리했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 인격적 호칭이 아니라 언약의 고유 이름 יְהוָה를 사용하므로, 제목화된 대체 번역보다 이름을 드러내는 ‘야훼’가 원문 의도를 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
