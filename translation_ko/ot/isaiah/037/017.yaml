  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שְׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת כָּל דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שָׁלַ֔ח לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: ko
  text: 주님, 귀를 기울이시고 들으소서.[a] 주님, 눈을 뜨시고 보소서. 산헤립이 살아 계신 하나님을 조롱하려고 보낸 모든 말을 들으소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 하나님께 귀 기울여 들으시기를 청하는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה / O LORD
  english_pob_choice: O LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: יהוה
  rationale: 이 절은 직접적인 기도문으로, 한국어 독자가 자연스럽게 부를 수 있는 호칭인 ‘주님’을 본문에 두고, 원어적 대응은 설명 부담이 큰 경우로 보아 본문 자체는 기도체를 우선했습니다.
- source_word: הַטֵּה ... אָזְנְךָ / incline your ear
  english_pob_choice: Incline your ear
  chosen_korean: 귀를 기울여 들으소서
  alternatives_korean:
  - 귀를 돌리소서
  - 귀를 기울이소서
  lexicon: הטה + אזן
  rationale: ‘귀를 기울이다’는 히브리어 관용구의 청취 요청을 가장 자연스럽게 살리며, 뒤의 ‘들으소서’와 함께 청원 어조를 분명히 합니다.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה / open your eyes ... and see
  english_pob_choice: open your eyes ... and see
  chosen_korean: 눈을 떠서 보소서
  alternatives_korean:
  - 눈을 밝히소서
  - 눈을 열어 보소서
  lexicon: פקח + ראה
  rationale: ‘눈을 뜨다’는 직역성보다도 ‘보다’와 결합해 원문의 인식 요청을 자연스럽게 전달하며, 하나님의 주목을 간구하는 문맥에도 잘 맞습니다.
- source_word: לְחָרֵף / to mock, reproach
  english_pob_choice: to mock
  chosen_korean: 조롱하려고
  alternatives_korean:
  - 비방하려고
  - 능욕하려고
  - 모욕하려고
  lexicon: חרף
  rationale: 영어 POB가 이번 개정에서 ‘to mock’를 채택했으므로 그 결정을 따르되, 한국어에서는 상대를 깎아내리는 행위를 가장 직접적으로 드러내는 ‘조롱하다’가 적합합니다.
theological_decisions:
- issue: יהוה를 본문에서 어떻게 호칭할지
  chosen_reading: 기도문 형식에 맞춰 ‘주님’으로 번역하고, 야훼 표기는 본문 주석이 없는 이 구절에서는 쓰지 않았습니다.
  alternative_readings:
  - 야훼
  - 주(主)
  rationale: 직접 청원하는 시적 기도문에서 한국어 합쇼체의 유려함과 예배적 자연스러움을 우선했습니다. 다만 이는 원어 대체가 아니라 한국어 호칭 선택입니다.
  doctrine_reference: 예배 언어와 번역 관례의 균형
