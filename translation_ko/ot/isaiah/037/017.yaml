  terminology: ‘주님’은 직접 기도문에서 자연스러운 יהוה 호칭이며, ‘산헤립’, ‘살아 계신 하나님’, ‘조롱하다’는 각각 סַנְחֵרִיב, אֱלֹהִים חָי, חרף에 적절히 대응합니다. ‘조롱하다’는 영어 감사본의 ‘mock’ 및 원문의 모욕·능욕의 의미 범위 안에 있습니다.
