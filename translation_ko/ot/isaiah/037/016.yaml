id: ISA.37.16
reference: Isaiah 37:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
  footnotes:
  - marker: a
    text: Or “dwelling between the cherubim” or “enthroned upon the cherubim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님, 그룹들 위에 좌정하신 분이여[a], 주님만이 땅의 모든 왕국을 다스리시는 하나님이십니다. 주님께서 하늘과 땅을 만드셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그룹들 사이에 거하시는 분” 혹은 “그룹들 위에 좌정하신 분”.
    reason: 히브리어 יֹשֵׁב הַכְּרֻבִים은 그룹들과 관련된 하나님의 왕적 임재를 가리키며, 공간 관계의 정확한 뉘앙스에는 번역상 대안이 있습니다.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: O Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צבאות는 군사적 좁은 뜻보다 포괄적인 천상 세력의 뉘앙스를 살려 만군으로 옮겼습니다.
- source_word: יֹשֵׁב הַכְּרֻבִים
  english_pob_choice: enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하신 분
  alternatives_korean:
  - 그룹들 사이에 거하시는 분
  - 그룹들 위에 앉으신 분
  lexicon: HALOT
  rationale: 이 분사는 왕적 임재의 관용구로 기능하므로 ‘좌정하다’로 옮겨 통치적 의미를 살렸고, 영어 POB의 ‘above’에 맞춰 ‘위에’로 처리했습니다.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  english_pob_choice: you alone are God
  chosen_korean: 주님만이 … 하나님이십니다
  alternatives_korean:
  - 주님은 홀로 하나님이십니다
  - 주님만 하나님이십니다
  lexicon: HALOT
  rationale: אַתָּה הוּא와 לְבַדְּךָ의 중복 강조를 한국어에서 자연스럽게 살리기 위해 ‘만이’를 사용해 배타적 신성을 분명히 했습니다.
- source_word: עָשִׂיתָ
  english_pob_choice: made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 창조하셨습니다
  lexicon: HALOT
  rationale: עשה는 일반 동사 ‘하다/만들다’이므로, 창조를 의미하더라도 ברא를 전제하지 않는 ‘만들다’가 더 정확합니다.
theological_decisions:
- issue: 야훼 이름의 음역 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 여호와
  - 주님 만군의 하나님
  rationale: 본문에 יְהוָה가 직접 나오므로 전통적 대체어보다 고유 신명인 야훼를 유지해 언약명 호칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님의 유일성 강조
  chosen_reading: 주님만이 온 땅의 모든 왕국들 위의 하나님이십니다
  alternative_readings:
  - 주님은 온 땅의 유일한 하나님이십니다
  - 주님만이 하나님이십니다
  rationale: 히브리어는 하나님 되심의 독점성을 강조하지만 철학적으로 과잉 해석하지 않도록, 통치 범위를 포함한 문맥 안에서 유일성을 자연스럽게 표현했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
