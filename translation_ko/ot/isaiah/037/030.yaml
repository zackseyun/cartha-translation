reference: Isaiah 37:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית שָׁחִ֑יס וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים ו/אכול פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
  footnotes:
  - marker: a
    text: Or, 'in the second year, second growth' or 'aftergrowth.' The Hebrew term is rare and refers to produce arising without normal sowing.
    reason: lexical_alternative
translation:
  language: ko
  text: 「이것이 당신에게 주는 표징입니다.」 올해에는 저절로 난 것을 먹고, 둘째 해에는 그로부터 난 것을 먹으십시오. 그러나 셋째 해에는 씨를 뿌리고 거두며, 포도원을 심고 그 열매를 먹으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저절로 난 것’은 정규 파종 없이 자연적으로 난 농산물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징조
  - 증거
  lexicon: HALOT
  rationale: 히브리어 정관사 있는 הָאוֹת는 특정한 확인 표지를 가리키므로, 단순한 ‘표’보다 성경적 문맥에 어울리는 ‘표징’이 자연스럽습니다.
- source_word: סָפִיחַ
  english_pob_choice: what grows by itself
  chosen_korean: 저절로 난 것
  alternatives_korean:
  - 자생한 것
  - 저절로 자란 소출
  - 들난 곡식
  lexicon: HALOT
  rationale: 정규 파종 없이 저절로 솟아난 농산물을 가리키므로, 현대 한국어로는 의미가 바로 드러나는 ‘저절로 난 것’이 적절합니다.
- source_word: שָׁחִיס
  english_pob_choice: what springs from that
  chosen_korean: 그로부터 난 것
  alternatives_korean:
  - 둘째 해의 새싹
  - 그다음 해의 소출
  - 뒤이어 난 것
  lexicon: HALOT
  rationale: 희귀한 농업 용어의 뜻을 과도하게 단정하지 않고, 앞의 자생 소출에서 이어져 나온다는 관계를 살려 옮겼습니다.
- source_word: וְנִטְעוּ כְרָמִים
  english_pob_choice: plant vineyards
  chosen_korean: 포도원을 심고
  alternatives_korean:
  - 포도원을 세우고
  - 포도나무를 심고
  lexicon: HALOT
  rationale: כְרָמִים은 ‘포도밭/포도원’을 뜻하므로, 본문의 농경 평행구조를 살려 ‘포도원을 심고’로 옮겼습니다.
theological_decisions:
- issue: 안내문 전체의 화자와 청자 호칭
  chosen_reading: 예언적 선언문으로 보고, 전체는 존대 명령형으로 옮기되 직접 화법 표지는 표준 문장부호로 처리했습니다.
  alternative_readings:
  - 서술문형으로 완화
  - 평서형 미래문으로 처리
  rationale: 히브리어는 짧은 예언적 약속/지시문으로 구성되어 있어, 한국어에서는 수신자에게 주는 실제 지시감이 드러나도록 하되 과도한 고어체는 피하는 것이 적절합니다.
  doctrine_reference: 예언문체와 수신자 지시의 문체 재현
- issue: אָכוֹל, זִרְעוּ, וְקִצְרוּ, וְנִטְעוּ, וְאִכְלוּ의 처리
  chosen_reading: 명령형-예고형 연쇄를 한국어 명령형으로 자연스럽게 살렸습니다.
  alternative_readings:
  - 전부 미래형으로 처리
  - 전부 권고형으로 처리
  rationale: 히브리어의 연속 동사는 실제 행동 지침을 강하게 전달하므로, 한국어에서도 ‘먹으십시오/뿌리고 거두며/심고/먹으십시오’로 구체성을 유지했습니다.
  doctrine_reference: 문장 역동성 보존
