revisions:
- from: 그때 아모스의 아들 이사야가 히스기야에게 사람을 보내어 말했습니다. “야훼께서 이스라엘의 하나님이 이렇게 말씀하십니다. 네가 앗수르 왕 산헤립에 관해 내게 기도했기 때문이다.”[a][b]
  to: 그때 아모스의 아들 이사야가 히스기야에게 전갈을 보내어 말했습니다. “이스라엘의 하나님 야훼[a]께서 이렇게 말씀하십니다. 네가 앗수르 왕 산헤립에 관하여 내게 기도하였으므로—”[b]
  rationale: 원문에 없는 ‘사람’을 제거하고 한국어의 자연스러운 전달 표현인 ‘전갈을 보내어’를 사용했습니다. 신명과 ‘이스라엘의 하나님’의 어순을 바로잡았으며, 원문 및 영어 POB 감사 기록이 지적하는 생략적 구문을 대시로 보존했습니다. 각주 a는 실제 가능한 형식적 대안을 제시하도록 수정하고, 각주 b는 ‘야훼’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
