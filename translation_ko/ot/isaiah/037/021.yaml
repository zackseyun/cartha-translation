base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
  footnotes:
  - marker: a
    text: Or, more formally, “What you have prayed to me concerning Sennacherib king of Assyria—” The Hebrew clause is elliptical and continues into the following statement.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the LORD” represents the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 아모스의 아들 이사야가 히스기야에게 전갈을 보내어 말했습니다. “이스라엘의 하나님 야훼[a]께서 이렇게 말씀하십니다. 네가 앗수르 왕 산헤립에 관하여 내게 기도하였으므로—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 YHWH를 가리키며, 여기서는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 더 형식적으로, “네가 앗수르 왕 산헤립에 관하여 내게 기도한 일에 관하여—” 히브리어 절은 압축되어 있으며 다음 구절에서 이어집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 전갈을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단순히 ‘보내다’의 뜻이며, 문맥상 목적어가 생략되어 있으므로 한국어에서는 자연스럽게 ‘사람을 보내어’로 풀어 주었습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르며
  lexicon: HALOT
  rationale: 메신저 서술 공식이므로 현대 한국어에서는 ‘말했습니다’가 가장 자연스럽고, 뒤따르는 직접 인용을 안정적으로 이끕니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기적 고유명사인 ‘야훼’를 사용해, 본문의 고유한 이름을 제목어로 바꾸지 않도록 했습니다.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי אֶל סַנְחֵרִיב
  english_pob_choice: Because you have prayed to me concerning Sennacherib king of Assyria
  chosen_korean: 네가 앗수르 왕 산헤립에 관해 내게 기도했기 때문이다
  alternatives_korean:
  - 네가 앗수르 왕 산헤립을 두고 내게 기도했기 때문이다
  - 네가 앗수르 왕 산헤립에 대하여 내게 기도했기 때문이다
  lexicon: HALOT
  rationale: 히브리어의 압축된 연결을 한국어에서는 이유를 나타내는 ‘…때문이다’로 풀어, 다음 절로 이어지는 미완료감을 유지하면서도 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 아모스의 아들 이사야가 히스기야에게 ‘사람을 보내어’ 말하는 장면의 서술 방식
  chosen_reading: 직접 인용을 시작하기 전의 서술은 현대 서사체에 맞게 ‘사람을 보내어 말했습니다’로 옮겼습니다.
  alternative_readings:
  - ‘히스기야에게 보내어 말했습니다’
  - ‘히스기야에게 전갈을 보내어 말했습니다’
  rationale: 히브리어의 단순한 파견 동사를 과도하게 구체화하지 않으면서, 본문의 사절-전언 구조를 분명히 드러내기 위한 선택입니다.
  doctrine_reference: 서사 문체와 사절 공식의 직역 가능성
