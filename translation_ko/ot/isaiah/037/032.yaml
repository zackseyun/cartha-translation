id: ISA.37.32
reference: Isaiah 37:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י מִ/ירֽוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
  footnotes:
  - marker: a
    text: Or 'The jealousy of the LORD of hosts will do this.' The Hebrew noun can mean either 'zeal' or 'jealousy'; here it refers to the LORD's intense covenant commitment to accomplish his promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 예루살렘에서 한 남은 자가 나오고, 시온 산에서 피한 자들이 나올 것이기 때문입니다. 야훼 만군의 열심이 이것을 이루실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '만군의 주님의 질투가 이것을 이루실 것입니다.' 히브리어 명사는 '열심'과 '질투'를 모두 뜻할 수 있으며, 여기서는 약속을 이루려는 야훼의 강한 언약적 헌신을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירוּשָׁלִַם / מֵהַר צִיּוֹן
  english_pob_choice: from Jerusalem / from Mount Zion
  chosen_korean: 예루살렘에서 / 시온 산에서
  alternatives_korean:
  - 예루살렘으로부터 / 시온 산으로부터
  - 예루살렘에서부터 / 시온 산에서부터
  lexicon: HALOT
  rationale: 히브리어 전치사 미ן은 출처를 나타내므로 한국어는 자연스러운 출발점 표지인 '-에서'로 살렸습니다. '시온 산'은 관용적 성경 지명을 유지했습니다.
- source_word: שְׁאֵרִית
  english_pob_choice: a remnant
  chosen_korean: 한 남은 자
  alternatives_korean:
  - 남은 자
  - 남은 무리
  lexicon: HALOT
  rationale: 예언서의 핵심 용어를 살리되, '한 남은 자'로 두어 집단성보다 존속된 소수라는 뉘앙스를 분명히 했습니다.
- source_word: וּפְלֵיטָה
  english_pob_choice: and survivors
  chosen_korean: 피한 자들
  alternatives_korean:
  - 생존자들
  - 도망쳐 나온 자들
  lexicon: HALOT
  rationale: 이 단어는 단순한 '생존자'보다 재난에서 벗어난 사람들의 의미가 강하므로, 병행구절의 '남은 자'와 함께 피신·탈출의 감각을 살렸습니다.
- source_word: קִנְאַת יְהוָה צְבָאוֹת
  english_pob_choice: The zeal of Yahweh of hosts
  chosen_korean: 야훼 만군의 열심
  alternatives_korean:
  - 야훼 만군의 질투
  - 야훼 만군의 열정
  lexicon: HALOT
  rationale: קנאה는 '열심'과 '질투'를 모두 가질 수 있으나, 여기서는 언약을 이루려는 능동적 추진력이 핵심이므로 '열심'을 택했습니다. '만군의'는 고정 칭호를 따라 '만군의'로 옮겼습니다.
- source_word: תַּעֲשֶׂה זֹּאת
  english_pob_choice: will do this
  chosen_korean: 이것을 이루실 것입니다
  alternatives_korean:
  - 이것을 하실 것입니다
  - 이것을 행하실 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 행위보다 약속 성취를 가리키므로, 한국어에서는 '이루다'로 결과 지향성을 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유 신명은 직역 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 하나님의 이름 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קִנְאָת의 의미 범위
  chosen_reading: 열심
  alternative_readings:
  - 질투
  - 열정
  rationale: 하나님의 감정적 질투로 축소하지 않고, 언약 백성을 구원하시려는 적극적 헌신과 실행력을 함께 드러내기 위해 '열심'을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it unnecessarily
