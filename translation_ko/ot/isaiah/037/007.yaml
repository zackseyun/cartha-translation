id: ISA.37.7
reference: Isaiah 37:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
  footnotes:
  - marker: a
    text: Or 'a report,' 'news,' or 'a rumor.' The Hebrew שְׁמוּעָה can denote information received without specifying whether it is confirmed.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am giving him a spirit.' The Hebrew רוּחַ may refer to an inward impulse, disposition, or spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 그 안에 영을 넣어 주겠습니다[a]. 그러면 그가 소식을 듣고 자기 땅으로 돌아갈 것이며[b], 내가 그를 자기 땅에서 칼로 쓰러지게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내가 그에게 영을 주겠다.' 히브리어 רוּחַ는 내적 충동, 성향, 또는 영을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '보고,' '뉴스,' 또는 '소문.' 히브리어 שְׁמוּעָה는 확인된 정보인지 여부를 특정하지 않는 말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 지시어를 살리되, 현대 합쇼체에서 자연스럽고 공손한 호명으로 옮겼습니다.
- source_word: נוֹתֵן בּוֹ רוּחַ
  english_pob_choice: I am putting a spirit in him
  chosen_korean: 내가 그 안에 영을 넣어 주면
  alternatives_korean:
  - 내가 그에게 영을 주면
  - 내가 그 안에 숨을 넣어 주면
  lexicon: HALOT
  rationale: רוּחַ의 폭넓은 의미를 단정하지 않고 '영'으로 두었으며, בּוֹ의 내적 작용을 '그 안에'로 반영했습니다.
- source_word: שְׁמוּעָה
  english_pob_choice: a report
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 전갈
  - 소문
  lexicon: HALOT
  rationale: 문맥상 확인 여부를 특정하지 않는 정보 전달을 나타내므로, 한국어에서도 중립적인 '소식'이 가장 자연스럽습니다.
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  english_pob_choice: I will cause him to fall by the sword
  chosen_korean: 내가 그를 그의 땅에서 칼에 쓰러지게 하겠습니다
  alternatives_korean:
  - 내가 그를 칼로 쓰러뜨리겠습니다
  - 내가 그를 칼로 죽이겠습니다
  lexicon: HALOT
  rationale: 히필의 사역성을 살리면서도 한국어로는 자연스럽게 '쓰러지게 하다'로 옮겼고, בַּחֶרֶב은 관용적 의미를 따라 '칼에'로 처리했습니다.
theological_decisions:
- issue: 하나님이 왕의 내적 반응을 일으키는 방식(רוּחַ)
  chosen_reading: 내가 그 안에 영을 넣어 주면
  alternative_readings:
  - 내가 그에게 기운을 넣어 주면
  - 내가 그에게 마음을 불어넣으면
  rationale: 본문은 하나님의 주권적 개입을 분명히 하면서도 그 메커니즘을 세부적으로 설명하지 않으므로, '영'을 유지해 해석의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 주권적 섭리와 본문상의 모호성 보존
- issue: 히브리어 עַל/בְּ 계열 반복 없이 'his own land'를 두 번 강조하는 구조
  chosen_reading: 자기 땅 / 그의 땅에서
  alternative_readings:
  - 자기 나라 / 그 나라에서
  - 자기 땅 / 자기 땅에서
  rationale: 앞부분과 뒷부분의 반복을 한국어에서도 살리되, 첫 번째는 귀환의 목적지, 두 번째는 죽음의 장소라는 대비를 분명히 했습니다.
  doctrine_reference: 서술 강조 구조 보존
