id: ISA.37.38
reference: Isaiah 37:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'was bowing down' or 'was prostrating himself'; the Hebrew verb can emphasize the bodily act of worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of Nisroch his god'; Hebrew literally, 'the house of Nisroch his god.'
    reason: lexical_alternative
  - marker: c
    text: Esar-haddon is more commonly spelled 'Esarhaddon' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 신 니스록의 집에서 예배하고 있을 때, 아드람멜렉과 사르에셋, 그의 아들들이 그를 칼로 쳐 죽였고, 그들은 아라랏 땅으로 도망쳤습니다. 그의 아들 에사르핫돈이 그를 대신하여 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁתַּחֲוֶה
  english_pob_choice: was worshiping
  chosen_korean: 예배하고 있을 때
  alternatives_korean:
  - 엎드려 경배하고 있을 때
  - 절하고 있을 때
  lexicon: HALOT
  rationale: 히트파엘 동사는 몸을 굽혀 경배하는 행위를 가리킬 수 있으므로, 이 문맥의 종교적 의미를 살려 ‘예배하다’로 옮기되 진행 상황을 드러냈습니다.
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  english_pob_choice: the house of Nisroch his god
  chosen_korean: 그의 신 니스록의 집
  alternatives_korean:
  - 니스록 그의 신의 집
  - 니스록 그의 신전
  lexicon: HALOT
  rationale: 히브리어의 직역 구조인 ‘…의 집’을 유지해 원문 접촉감을 살렸고, ‘his god’는 소유 관계로 자연스럽게 반영했습니다.
- source_word: הִכֻּהוּ בַחֶרֶב
  english_pob_choice: struck him down with the sword
  chosen_korean: 칼로 쳐 죽였고
  alternatives_korean:
  - 칼로 쳤고
  - 칼로 살해했고
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다’를 살리면서, 뒤의 ‘칼’이 이미 치명적 수단임을 드러내 문맥상 분명한 살해 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  english_pob_choice: escaped to the land of Ararat
  chosen_korean: 아라랏 땅으로 도망쳤습니다
  alternatives_korean:
  - 아라랏 땅으로 탈출했습니다
  - 아라랏 땅으로 피했습니다
  lexicon: HALOT
  rationale: נמלט는 성공적으로 빠져나가다의 뜻이므로, 문맥상 반역 후의 도주를 분명히 하는 ‘도망치다’로 옮겼습니다.
- source_word: אֵסַר חַדֹּן
  english_pob_choice: Esar-haddon
  chosen_korean: 에사르핫돈
  alternatives_korean:
  - 에살핫돈
  - 에사르하돈
  lexicon: HALOT
  rationale: 고유명사는 현대 음역을 따르되, 한국어 독자에게 익숙한 자모 분해를 고려해 읽기 쉬운 형태로 옮겼습니다.
theological_decisions:
- issue: 역사 서술의 최종 행위 표현
  chosen_reading: “그를 칼로 쳐 죽였고”로 옮겨 암살의 결과를 분명히 했습니다.
  alternative_readings:
  - “그를 칼로 쳤고”
  - “그를 칼로 쳐서 죽였습니다”
  rationale: 원문은 ‘치다’와 수단 표현을 결합해 살해 사건을 서술하므로, 한국어에서도 결과를 분명히 드러내되 과장된 해석 없이 직설적으로 전달했습니다.
  doctrine_reference: 본문의 역사 서술 유지
