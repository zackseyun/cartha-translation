revisions:
- from: 아마도 야훼 당신의 하나님께서 랍사게의 말을 들으실 것입니다. 그의 주인이며 앗시리아 왕이 그를 보내어 살아 계신 하나님을 모독하게 한 그 말들을 들으시고는 그 말을 책망하실 것입니다. 그러므로 아직 남아 있는 남은 자를 위하여 기도를 드리십시오.[a][b][c]
  to: 아마도 야훼, 당신의 하나님께서 그의 주인인 앗시리아 왕이 살아 계신 하나님을 모욕하려고 보낸 랍사게[a]의 말을 들으시고, 야훼, 당신의 하나님께서 들으신 그 말들에 관하여 그를 책망하실[b] 것입니다. 그러므로 남아 있는 남은 자[c]를 위하여 기도를 드리십시오.
  rationale: 원문의 통사 관계를 따라 앗시리아 왕이 랍사게를 보낸 목적을 ‘살아 계신 하나님을 모욕하려고’로 명시했습니다. וְהוֹכִיחַ בַּדְּבָרִים의 목적어가 명시되지 않은 점은 한국어에서 ‘그 말들에 관하여 그를 책망하실’로 처리하여, 말과 발화자 사이의 원문상 함축을 과도하게 단정하지 않으면서 자연스럽게 전달했습니다. ‘남은 자’의 신학적·문학적 어감은 유지하되, הַנִּמְצָאָה의 잔존 의미를 ‘남아 있는’으로 반영했습니다.
