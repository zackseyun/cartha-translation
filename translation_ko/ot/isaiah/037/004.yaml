id: ISA.37.4
reference: Isaiah 37:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
  footnotes:
  - marker: a
    text: Or 'the chief cupbearer.' 'Rabshakeh' is an Assyrian official title used here as a name-like designation.
    reason: cultural_note
  - marker: b
    text: Or 'will reprove/call to account for the words.' The Hebrew may mean that God will answer or judge the blasphemous speech he has heard.
    reason: lexical_alternative
  - marker: c
    text: Or 'the remnant that remains' or 'the survivors who are left.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마도 야훼 당신의 하나님께서 랍사게의 말을 들으실 것입니다. 그의 주인이며 앗시리아 왕이 그를 보내어 살아 계신 하나님을 모독하게 한 그 말들을 들으시고는 그 말을 책망하실 것입니다. 그러므로 아직 남아 있는 남은 자를 위하여 기도를 드리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 랍사게는 앗시리아 관직명으로, 여기서는 고유명처럼 쓰였습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그 말들에 대해 책망하실 것입니다.’ 히브리어는 하나님께서 그 불경한 말을 심판하거나 따지시는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘남아 있는 남은 자’ 혹은 ‘남아 있는 생존자들’.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼, 당신의 하나님
  - 여호와 당신의 하나님
  lexicon: HALOT
  rationale: 여호와가 아니라 프로젝트 기본값인 야훼를 유지하고, 이사야 37:4의 직접 호칭을 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 라브사게
  - 랍-사게
  lexicon: HALOT
  rationale: 앗시리아 관직명은 한국어 성경에서 널리 알려진 음역을 사용하되, 본문에서는 이름처럼 기능하므로 직역보다 음역을 택했습니다.
- source_word: לְחָרֵף אֱלֹהִים חַי
  english_pob_choice: to reproach the living God
  chosen_korean: 살아 계신 하나님을 모독하게 한
  alternatives_korean:
  - 살아 계신 하나님을 욕되게 한
  - 살아 계신 하나님을 비방하게 한
  lexicon: HALOT
  rationale: חָרֵף는 단순한 조롱보다 하나님에 대한 공개적 모독의 뉘앙스가 강하므로, ‘모독하다’로 옮겨 강도를 살렸습니다.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  english_pob_choice: and will rebuke the words
  chosen_korean: 그 말을 책망하실 것입니다
  alternatives_korean:
  - 그 말들을 꾸짖으실 것입니다
  - 그 말들에 대해 책망하실 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘말들’을 대상화해 하나님의 응답을 말하므로, 한국어에서는 자연스러운 능동 표현으로 옮기되 ‘책망하다’로 의미를 보존했습니다.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  english_pob_choice: the remnant that is found
  chosen_korean: 아직 남아 있는 남은 자
  alternatives_korean:
  - 발견된 남은 자
  - 남아 있는 남은 무리
  lexicon: HALOT
  rationale: ‘מצא’의 문자적 ‘발견된’보다 문맥상 생존해 남아 있는 상태가 핵심이므로, 예언서의 용례를 살려 ‘남은 자’와 ‘남아 있는’으로 풀었습니다.
theological_decisions:
- issue: 야훼의 음역 유지와 원문 직접성
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 전통 교회어인 ‘여호와’ 대신 프로젝트 기준인 ‘야훼’를 사용해 본문의 언약명 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘남은 자’의 예언서적 함의
  chosen_reading: 남은 자
  alternative_readings:
  - 생존자
  - 남아 있는 사람들
  rationale: 이사야 문맥에서 שְׁאֵרִית는 단순 생존 집단을 넘어 하나님이 보존하시는 공동체를 가리킬 수 있으므로, 신학적 울림이 있는 ‘남은 자’를 본문에 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #5'
