  source_fidelity: 개정이 필요합니다. 초안은 ‘그의 주인이며 앗시리아 왕이 그를 보내어 … 모독하게 한’이라고 하여 앗시리아 왕이 랍사게에게 모독을 하게 했다는 식으로 문장 구조를 바꾸었고, 뒤의 ‘그 말들을 들으시고는 그 말을 책망하실’도 원문의 관계절과 책망의 대상을 불분명하게 만듭니다. 원문은 앗시리아 왕이 랍사게를 ‘살아 계신 하나님을 모욕하려고’ 보냈으며, 하나님이 들으신 그 말에 관하여 책망하시기를 바라는 표현입니다.
  naturalness: ‘야훼, 당신의 하나님’은 직접 호칭의 관계를 자연스럽게 드러내며, ‘남아 있는 남은 자’는 중복이므로 ‘남아 있는 남은 사람들’ 또는 ‘남아 있는 자들’로 정리해야 합니다. ‘기도를 드리십시오’는 합쇼체 요청에 맞습니다.
  terminology: 야훼, 랍사게, 살아 계신 하나님, 남은 자는 적절합니다. רַב־שָׁקֵה는 관직명이라는 주석을 유지하고, הַשְּׁאֵרִית의 ‘남은 자’도 이사야서의 어감을 보존합니다.
