    rationale: לְחָרֵף는 앗시리아 왕이 랍사게를 보낸 목적을 나타냅니다. ‘왕이 그를 보내어 하나님을 모독하게 한’은 한국어상 가능하지만 이어지는 문장 구성 때문에 랍사게의 말이라는 원문 관계가 흐려집니다.
