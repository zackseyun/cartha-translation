id: ISA.37.33
reference: Isaiah 37:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
  footnotes:
  - marker: a
    text: Or 'advance against it with a shield.' The Hebrew expression pictures assault preparations in siege warfare.
    reason: lexical_alternative
  - marker: b
    text: Or 'build up an embankment against it.' The Hebrew literally says 'pour out a siege mound/ramp against it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 앗시리아 왕에 대하여 이렇게 말씀하십니다. 그는 이 성읍으로 들어오지 못하고, 거기에서 화살을 쏘지도 못하며, 그것을 향해 방패를 앞세우지도 못하고, 그것을 향해 포위 흙더미를 쌓지도 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 향해 방패를 앞세우다’라는 뜻일 수 있습니다. 히브리어 표현은 포위전의 공격 준비를 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포위 흙둑을 쌓다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘포위 흙더미를 그것 위에 쏟다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 따라서
  lexicon: HALOT
  rationale: 앞선 맥락의 결론을 나타내는 접속이므로, 현대 한국어에서 논리적 귀결을 가장 자연스럽게 드러내는 ‘그러므로’를 택했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 ... 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 ... 이같이 말씀하십니다
  - 야훼께서 ... 이렇게 이르십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 살리되 합쇼체로 자연스럽게 옮기기 위해 ‘말씀하십니다’를 사용했고, יְהוָה는 POB 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: יָבוֹא אֶל הָעִיר הַזֹּאת
  english_pob_choice: He will not come into this city
  chosen_korean: 이 성읍으로 들어오지 못하고
  alternatives_korean:
  - 이 성읍에 들어오지 못하고
  - 이 도시로 들어오지 못하고
  lexicon: HALOT
  rationale: אַת הָעִיר הַזֹּאת는 문맥상 예루살렘을 가리키는 방어 대상 도시이므로 ‘성읍’이 가장 정확하며, ‘들어오다’가 침입의 움직임을 잘 드러냅니다.
- source_word: יְקַדְּמֶנָּה מָגֵן
  english_pob_choice: come before it with a shield
  chosen_korean: 방패를 앞세우지도 못하고
  alternatives_korean:
  - 방패를 들고 맞서지도 못하고
  - 방패를 가지고 그 앞에 서지도 못하고
  lexicon: HALOT
  rationale: 직역의 ‘앞서다/맞서다’보다 전투 준비의 동작을 한국어 관용으로 압축해, 포위 공격의 장면을 나타내는 ‘방패를 앞세우다’로 옮겼습니다.
- source_word: יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  english_pob_choice: heap up a siege ramp against it
  chosen_korean: 포위 흙더미를 쌓지도 못할 것입니다
  alternatives_korean:
  - 공성 흙더미를 쌓지도 못할 것입니다
  - 공성로를 쌓지도 못할 것입니다
  lexicon: HALOT
  rationale: סֹלְלָה의 비유적·군사적 의미를 살리기 위해 ‘포위 흙더미’로 옮겼고, שׁפך의 ‘쏟다/쌓다’ 이미지는 한국어에서 자연스러운 ‘쌓다’로 구현했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 번역
  chosen_reading: 이 구절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 문서화된 기준에 따라 신적 칭호가 아닌 언약적 고유명으로 보존하여, 예언 선포의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
