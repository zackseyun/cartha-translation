revisions:
- from: 그러므로 야훼께서 앗시리아 왕에 대하여 이렇게 말씀하십니다. 그는 이 성읍으로 들어오지 못하고, 거기에서 화살을 쏘지도 못하며, 그것을 향해 방패를 앞세우지도 못하고, 그것을 향해 포위 흙더미를 쌓지도 못할 것입니다.[a][b]
  to: 그러므로 야훼께서 앗시리아 왕에 대하여 이렇게 말씀하십니다. ‘그는 이 성읍에 들어오지 않을 것이며, 그곳에 화살을 쏘지도 않을 것이며, 방패를 앞세워 그 성읍 앞에 나아가지도 않을 것이며[a], 그 성읍을 향해 공성 흙둑을 쌓지도 않을 것입니다.[b]’
  rationale: 미래 부정의 병렬을 명료하게 하고, 공성전 용어를 자연스럽고 정확하게 다듬었습니다. 또한 대명사의 지시 대상을 ‘그 성읍’으로 명시하고 각주를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
