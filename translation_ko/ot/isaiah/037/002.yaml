id: ISA.37.2
reference: Isaiah 37:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/אֵ֣ת שֶׁבְנָ֣א הַ/סּוֹפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
  footnotes:
  - marker: a
    text: Or 'clothed in sackcloth' or 'wearing sackcloth.' The Hebrew describes them as being in a state of mourning or humiliation.
    reason: lexical_alternative
  - marker: b
    text: '''Who was over the household'' is an official title for the one in charge of the royal household.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 궁내를 맡은 엘리아김과 서기관 셰브나와 제사장들의 장로들을, 베옷을 입은 채, 아모스의 아들 이사야 선지자에게 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베옷을 입은 채’는 히브리어가 말하는 애통·굴욕의 상태를 옮긴 표현입니다. 직역하면 ‘베옷으로 덮인/입은’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘궁내를 맡은’은 히브리어 관용구 ‘집 위에 있는 자’의 관직 표현입니다. 본문은 왕실 가정/궁정을 관리하는 직책을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 그리고 보냈습니다
  - 그때 보냈습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 자연스러운 과거 서술로 옮기되, 과도하게 해석하지 않고 단순한 행위 동사를 유지했습니다.
- source_word: אֲשֶׁר עַל הַבַּיִת
  english_pob_choice: who was over the household
  chosen_korean: 궁내를 맡은
  alternatives_korean:
  - 왕실을 맡은
  - 궁정을 맡은
  lexicon: HALOT
  rationale: 관직 표현의 핵심은 ‘집안/궁정의 관리’이므로, 한국어에서는 직책 성격이 드러나면서도 본문의 관용구를 과도하게 풀지 않는 표현을 택했습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 비서
  lexicon: HALOT
  rationale: 소페르의 공식 직함을 한국어 성경어휘로 직접 옮기되, 현대 독자가 이해할 수 있는 행정 관직어를 사용했습니다.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  english_pob_choice: covered with sackcloth
  chosen_korean: 베옷을 입은 채
  alternatives_korean:
  - 베옷으로 덮인 채
  - 굵은 베옷을 입은 채
  lexicon: HALOT
  rationale: 히트파엘의 상태 묘사를 한국어의 자연한 상태표현으로 옮겼습니다. ‘베옷’은 애통과 굴욕의 표지를 살리며, 문자적 ‘덮다’보다 본문 의미를 더 분명히 드러냅니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 선지자
  alternatives_korean:
  - 예언자
  - 예언자 선지자
  lexicon: HALOT
  rationale: 이사야의 공적 호칭으로서 한국어 성경 전통에서 확립된 ‘선지자’를 사용했습니다. 본문이 지칭하는 직무를 분명히 전달합니다.
