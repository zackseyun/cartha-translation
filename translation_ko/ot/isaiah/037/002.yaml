  source_fidelity: 히브리어의 인물 열거, 관직, 제사장 집단의 장로들, 베옷을 입은 상태, 그리고 이사야의 부칭과 예언자 호칭은 대체로 충실히 옮겼습니다. 다만 현 번역의 쉼표 처리에서는 ‘베옷을 입은 채’가 어느 범위에 걸리는지가 다소 불분명합니다. 히브리어의 복수 분사는 파견된 사람들 전체를 묘사하는 것으로 자연스럽게 읽히므로 이를 명확히 했습니다.
  naturalness: ‘제사장들의 장로들’은 원문의 구성 관계를 따르지만 현대 한국어로 다소 어색합니다. ‘제사장들 가운데 장로들’이 의미를 보존하면서 더 자연스럽습니다. ‘궁내를 맡은’도 다소 불분명하여 왕실의 집안을 관리하는 관직이라는 문맥을 반영해 ‘왕궁을 맡은’으로 다듬었습니다.
  terminology: ‘서기관’, ‘베옷’, ‘예언자’는 적절합니다. ‘예언자’는 현대 표준어에서 자연스러우며 הַנָּבִיא의 공적 호칭을 직접 옮깁니다. 아모스(אָמֹוץ)는 아모스(עָמוֹס)와 히브리어 철자가 다르지만, 한국어 성경 전통의 음역을 따랐습니다.
