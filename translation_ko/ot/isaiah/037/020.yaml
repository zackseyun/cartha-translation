id: ISA.37.20
reference: Isaiah 37:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
  footnotes:
  - marker: a
    text: Or, 'deliver us from his hand.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you are the LORD alone'; the sense is that the LORD alone is God over all the kingdoms of the earth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 야훼 우리 하나님이시여, 그의 손에서 우리를 구원해 주십시오[a]. 그리하여 땅의 모든 나라가 당신만이 야훼이심을 알게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손에서 우리를 건져 주십시오’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신만이 야훼이십니다’입니다. 뜻은 야훼만이 땅의 모든 나라 위에 계신 하나님이시라는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 연결사 ו와 시간 부사 עתה를 함께 살려, 기도문 흐름 속의 전환을 자연스럽게 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명문자 יהוה를 전통적 대체호칭이 아니라 고유명으로 옮겨, 영어 POB의 audit trail과 일치시켰습니다.
- source_word: הוֹשִׁיעֵנוּ מִיָדוֹ
  english_pob_choice: save us from his hand
  chosen_korean: 그의 손에서 우리를 구원해 주십시오
  alternatives_korean:
  - 그의 손에서 우리를 구해 주십시오
  - 그의 손에서 우리를 살려 주십시오
  lexicon: HALOT
  rationale: 히필 명령/청원의 구원 요청을 한국어 기도체로 옮겼습니다. '손' 이미지는 그대로 유지하되, '구원해 주십시오'로 본문의 긴박한 간구를 분명히 했습니다.
- source_word: לְבַדֶּךָ
  english_pob_choice: you alone are the LORD
  chosen_korean: 당신만이 야훼이심을
  alternatives_korean:
  - 당신만이 야훼이십니다
  - 오직 당신만이 야훼이심을
  lexicon: HALOT
  rationale: לבדך의 배타성을 살리기 위해 '당신만이'로 옮겼고, 서술절은 종결형보다 종속절형으로 처리해 뒤의 목적절과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 여호와/야훼의 호칭 처리
  chosen_reading: 야훼를 고유한 언약 이름으로 직역하여 사용했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 יְהוָה를 직접 사용하므로, 본 프로젝트의 기본 방침에 따라 대체 호칭 대신 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 마지막 절의 배타적 신앙 고백
  chosen_reading: “당신만이 야훼이심”으로 야훼의 유일성을 분명히 했습니다.
  alternative_readings:
  - 당신이 야훼 홀로이심
  - 당신은 야훼만이십니다
  rationale: 히브리어 לְבַדֶּךָ는 단순한 강조가 아니라 다른 모든 주장과 대비되는 배타성을 지니므로, 그 신학적 힘을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve theological tension rather than resolve it)
