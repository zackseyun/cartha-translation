  rationale: 히브리어 서술 전개를 자연스러운 현대 한국어로 옮기되, 화행 표지를 분명히 살려 전달합니다.
- source_word: כֹּה תֹאמְרוּן אֶל אֲדֹנֵיכֶם
  english_pob_choice: Thus you shall say to your master
  chosen_korean: 너희는 너희 주인에게 이렇게 말해야 합니다
  alternatives_korean:
  - 너희는 너희 상전에게 이렇게 말해야 합니다
  - 너희는 너희 주군에게 이렇게 말해야 합니다
  lexicon: HALOT
  rationale: 문맥상 앗수르 관원들이 히스기야에게 전해야 할 사자 공식이므로, 인간 상급자를 가리키는 '주인'을 택해 신적 호칭과 혼동되지 않게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 프로젝트 기본값에 따라 하나님의 이름은 '야훼'로 옮겨 언약 სახელ을 유지합니다.
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים אֲשֶׁר שָׁמַעְתָּ
  english_pob_choice: Do not be afraid because of the words that you have heard
  chosen_korean: 네가 들은 그 말들 때문에 두려워하지 말아라
  alternatives_korean:
  - 네가 들은 말들을 두려워하지 말아라
  - 네가 들은 그 말들 앞에서 두려워하지 말아라
  lexicon: HALOT
  rationale: מִפְּנֵי의 원인·계기 용법을 한국어의 '때문에'로 자연스럽게 살렸고, '말들'은 직전의 모욕적 발화를 가리킵니다.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  english_pob_choice: the servants of the king of Assyria
  chosen_korean: 앗수르 왕의 종들이
  alternatives_korean:
  - 앗수르 왕의 신하들이
  - 앗수르 왕의 젊은이들이
  lexicon: HALOT
  rationale: 나아르의 직역적 범위는 넓지만, 여기서는 왕의 휘하에 있는 수행원/신하를 가리키므로 '종들'로 옮겨 위계적 종속을 드러냈습니다.
- source_word: גִּדְּפוּ נַעֲרֵי ... אוֹתִי
  english_pob_choice: have blasphemed me
  chosen_korean: 나를 모독하여 말한
  alternatives_korean:
  - 나를 욕되게 한
  - 나를 신성모독한
  lexicon: HALOT
  rationale: 히브리어 גִּדֵּף의 비난·모독 뉘앙스를 살리되, 한국어에서 지나치게 기술적인 '신성모독'보다 동사적 표현 '모독하여 말한'이 문맥에 더 직접적입니다.
theological_decisions:
- issue: 야훼의 발화 형식과 직접 인용 안의 존대 체계
  chosen_reading: 본문 서술은 합쇼체를 유지하고, 인용된 야훼의 명령은 '두려워하지 말아라'처럼 직접 명령형으로 옮겼습니다.
  alternative_readings:
  - ‘두려워하지 마십시오’로 전체를 공손체화하는 방식
  - 인용 내부도 서술체로 완화하는 방식
  rationale: 히브리어 예언-사자 공식은 권위 있는 직접 발화를 포함하므로, 한국어에서도 서술부와 인용부의 긴장을 유지하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 예언적 직접화법과 화행 보존 원칙
