  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֔עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶלֶךְ אַשּׁ֖וּר אוֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
  footnotes:
  - marker: a
    text: Or 'have reviled me' or 'have defied me.' The Hebrew verb can denote abusive or contemptuous speech against God.
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야가 그들에게 말했습니다. “너희는 너희 주군에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. “네가 들은 말들, 곧 앗수르 왕의 신하들이 나를 모독한 말들 때문에 두려워하지 마십시오.”’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모독한’으로 옮긴 히브리어 동사는 하나님을 향해 욕하거나 비방하고 도전하는 말을 하다는 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֲלֵיהֶם
  english_pob_choice: And Isaiah said to them
  chosen_korean: 이사야가 그들에게 말했습니다
  alternatives_korean:
