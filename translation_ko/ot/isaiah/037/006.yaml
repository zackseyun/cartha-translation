  to: 이사야가 그들에게 말했습니다. “너희는 너희 주군에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. “네가 들은 말들, 곧 앗수르 왕의 신하들이 나를 모독한 말들 때문에 두려워하지 마십시오.”’”[a]
