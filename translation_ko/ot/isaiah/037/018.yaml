  source_fidelity: 히브리어 אָמְנָם의 강조, 호격 ‘야훼여’, ‘앗수르 왕들’, הֶחֱרִיבוּ의 황폐화 의미, 그리고 אֶת כָּל הָאֲרָצוֹת וְאֶת אַרְצָם의 병렬을 충실히 반영합니다. ‘그들의 땅’은 원문의 3인칭 복수 소유 접미사가 붙은 단수 ‘땅’을 그대로 보존하며, 이를 임의로 복수화하지 않은 점도 적절합니다.
  naturalness: ‘진실로, 야훼여’와 ‘황폐하게 하였습니다’는 현대 표준어의 격식 있는 합쇼체 문맥에서 자연스럽고, 히스기야의 기도라는 문맥에도 어울립니다. ‘그들의 땅’은 원문 자체가 지닌 지시 대상의 다소 난해한 면을 과도하게 해소하지 않습니다.
  terminology: ‘야훼’는 제시된 프로젝트 방침 및 영어 POB의 Yahweh와 일치합니다. ‘앗수르’, ‘땅’, ‘황폐하게 하였습니다’도 원문의 지명과 군사적 황폐화의 의미를 적절히 전달합니다.
