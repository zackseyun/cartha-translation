translation:
  language: ko
  text: 진실로[a], 야훼여, 앗수르 왕들이 모든 땅과 그들의 땅[b]을 황폐하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로.’ 히브리어는 여기서 강한 확인 또는 인정의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 땅’으로 되어 있습니다. 문맥상 집합적으로 ‘그들의 땅’ 또는 ‘그들의 땅들’로 이해될 수 있습니다.
    reason: alternative_reading
