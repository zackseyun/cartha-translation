  naturalness: 초안의 ‘보았으니’와 문말 연결은 현대 한국어 성경 문체로 다소 부자연스럽습니다. 두 문장으로 나누어 ‘발견했습니다. 이는 … 들었기 때문입니다’로 하면 합쇼체로 자연스럽고 인과관계도 분명합니다.
  terminology: 라브사게는 서사에서 관직 칭호로 기능하므로 음역을 유지하는 것이 적절합니다. 각주 대안 ‘주관자’는 원어 title의 통상적 의미와 맞지 않으므로 ‘수석 술관원’으로 고쳐야 합니다. 지명은 ‘아시리아’, ‘리브나’, ‘라기스’로 유지합니다.
