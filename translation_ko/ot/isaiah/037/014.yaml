id: ISA.37.14
reference: Isaiah 37:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'from the hand of the messengers,' an idiom for receiving something from them.
    reason: cultural_note
  - marker: b
    text: Or 'read it' and 'spread it out'; the Hebrew uses a singular suffix, likely referring collectively to the written message contained in the letters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히스기야는 사신들의 손에서 그 편지들을 받아 읽었습니다[a][b]. 그리고 그는 야훼의 집으로 올라가 그것들을 야훼 앞에 펼쳐 놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사신들의 손에서’는 ‘사신들에게서’라는 뜻의 히브리어 관용구입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 단수 접미사를 쓰므로 ‘읽었습니다’와 ‘펼쳐 놓았습니다’의 대상은 집합적으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  english_pob_choice: the letters
  chosen_korean: 그 편지들
  alternatives_korean:
  - 그 문서들
  - 그 두루마리들
  - 그 글들
  lexicon: HALOT
  rationale: 본문의 סֵפֶר는 역사 서술에서 전달된 서면 통신문을 가리킬 수 있으므로, 여기서는 ‘편지들’이 문맥상 가장 자연스럽고 POB의 영어 선택과도 잘 맞습니다.
- source_word: מִיַּד הַמַּלְאָכִים
  english_pob_choice: from the hand of the messengers
  chosen_korean: 사신들의 손에서
  alternatives_korean:
  - 사신들에게서
  - 사신들의 손으로부터
  lexicon: HALOT
  rationale: ‘손에서’는 히브리어 관용구를 보존하면서도 수령의 행위를 분명히 드러내므로, 원문 결을 살린 표현으로 옮겼습니다.
- source_word: וַיִּקְרָאֵהוּ / וַיִּפְרְשֵׂהוּ
  english_pob_choice: read them / spread them
  chosen_korean: 받아 읽었습니다 / 그것들을 펼쳐 놓았습니다
  alternatives_korean:
  - 읽었습니다 / 펼쳤습니다
  - 읽어 보았습니다 / 펼쳐 두었습니다
  lexicon: HALOT
  rationale: 히브리어는 단수 접미사를 쓰지만, 문맥상 앞의 ‘편지들’을 집합적으로 가리키므로 한국어에서는 복수 대명사 ‘그것들’을 써서 자연스럽게 대응했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와라는 대체호칭이 아니라 신명기적 고유명사인 야훼를 사용했습니다.
theological_decisions:
- issue: 성전으로 올라가 편지들을 펼쳐 놓는 행위의 의미
  chosen_reading: 히스기야가 문제를 야훼의 임재 앞에 직접 가져가 의탁하는 행위로 읽었습니다.
  alternative_readings:
  - 단순한 의례적 행동으로만 읽는 해석
  - 감정적 상징행위로만 축소하는 해석
  rationale: ‘야훼 앞에 펼쳐 놓았다’는 표현은 위협을 정치적으로 처리하기보다 하나님께 정면으로 맡기는 신앙 행위라는 점을 드러냅니다.
  doctrine_reference: 기도와 신뢰의 행위에 대한 서술 이해
