id: ISA.37.36
reference: Isaiah 37:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'messenger' or 'angel'; here the context favors a heavenly agent of divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 나가서 앗수르 진영에서 십팔만 오천 명을 쳐서 쓰러뜨렸습니다. 아침 일찍 일어나 보니, 보라, 그들은 모두 시체가 되어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’. 히브리어 מַלְאַךְ는 ‘사자’와 ‘천사’ 모두를 뜻할 수 있으나, 여기서는 문맥상 하늘의 심판 집행자가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥에 따라 ‘사자/메신저’도 될 수 있지만, 이 구절은 신적 심판의 행위가 중심이어서 ‘천사’가 가장 자연스럽고, יְהוָה는 고유명 ‘야훼’로 옮기는 것이 일관됩니다.
- source_word: וַיַּכֶּה
  english_pob_choice: struck down
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 쳐서 죽이셨습니다
  - 쳤습니다
  - 내리쳤습니다
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다’이지만 여기서는 대량의 죽음이 결과이므로, 과도하게 설명하지 않으면서도 심판의 강도를 살리는 ‘치셨습니다’가 적절합니다.
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  english_pob_choice: 185,000
  chosen_korean: 십팔만 오천 명
  alternatives_korean:
  - 185,000명
  - 십만 팔만 오천 명
  lexicon: HALOT
  rationale: 히브리어 수사를 한국어로 자연스럽게 풀어 적되, 정확한 수량은 그대로 보존했습니다.
- source_word: וְהִנֵּה כֻלָּם פְּגָרִים מֵתִים
  english_pob_choice: behold, all of them were dead bodies
  chosen_korean: 보라, 그들 모두가 죽은 시체였습니다
  alternatives_korean:
  - 보십시오, 그들 모두가 시체였습니다
  - 그런데 모두 죽은 시체였습니다
  lexicon: HALOT
  rationale: וְהִנֵּה의 돌연한 장면 전환을 ‘보라’로 살리고, פְּגָרִים מֵתִים의 중복적 강조를 ‘죽은 시체’로 비교적 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 이름 יְהוָה를 직접 사용하므로, 제목적 대체어보다 고유명 ‘야훼’로 옮겨 원문이 가진 인칭성과 언약적 특성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: מַלְאַךְ의 의미
  chosen_reading: 천사
  alternative_readings:
  - 사자
  - 메신저
  rationale: 문맥이 야훼의 심판 집행을 서술하므로, 단순 전달자보다 하늘의 존재를 가리키는 ‘천사’로 읽는 것이 본문 의도에 부합합니다.
  doctrine_reference: 문맥상 신적 심판 집행자 이해
