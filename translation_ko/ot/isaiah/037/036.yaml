revisions:
- from: 그때 야훼의 천사가 나가서 아시리아 진영에서 십팔만 오천 명을 치셨습니다. 그들이 아침 일찍 일어나 보니, 보라, 그들 모두가 죽은 시체였습니다.[a]
  to: 그때 야훼의 천사가 나가서 앗수르 진영에서 십팔만 오천 명을 쳐서 쓰러뜨렸습니다. 아침 일찍 일어나 보니, 보라, 그들은 모두 시체가 되어 있었습니다.[a]
  rationale: 원문의 서술적 어조와 불특정 복수 주어의 모호성을 보존하고, 한국어에서 불필요한 높임과 어색한 중복 표현을 제거했습니다. 지명은 한국어 성서 관용에 맞게 ‘앗수르’로 조정했으며, 천사/사자에 관한 어휘적 대안은 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:44Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 수량, 야훼의 이름, 천사/사자라는 어휘적 가능성은 대체로 잘 보존했습니다. 다만 ‘치셨습니다’의 높임은 원문의 통상적 서술에 없는 요소이며, ‘죽은 시체’는 히브리어의 강조를 기계적으로 재현하여 한국어에서는 부자연스럽습니다. 또한 ‘그들이’는 일어난 주체를 특정하는 듯하여, 원문의 의도적으로 밝혀지지 않은 3인칭 복수 주어를 불필요하게 좁힐 수 있습니다.
  naturalness: ‘아침 일찍 일어나 보니’는 주어를 생략하면 자연스럽고 원문의 불특정 복수 주어도 유지합니다. ‘보라’는 히브리어 הִנֵּה의 돌발적 주목 표지를 살릴 수 있으나, 뒤의 서술은 ‘모두 시체가 되어 있었습니다’로 해야 현대 한국어에서 자연스럽습니다. ‘앗수르’는 성서 및 한국어 관용상 ‘Assyria’의 더 통상적인 명칭입니다.
  terminology: ‘야훼의 천사’ 및 각주의 ‘야훼의 사자’는 적절합니다. 신명은 야훼로 일관되게 유지했습니다. ‘앗수르 진영’은 지명과 군사 문맥에 자연스럽고, ‘쳐서 쓰러뜨렸습니다’는 נכה의 타격 행위와 본문의 치명적 결과를 모두 무리 없이 반영합니다.
  issues:
  - severity: medium
    issue: ‘치셨습니다’에 높임법이 사용됨
    rationale: 히브리어 동사는 단순 서술형이며 천사에게 한국어 높임법을 부여할 근거가 본문에 없습니다. 높임은 원문에 없는 경의의 뉘앙스를 더할 수 있으므로 중립적인 과거 서술형이 적절합니다.
  - severity: medium
    issue: ‘그들이’가 아침에 일어난 주체를 특정함
    rationale: וַיַּשְׁכִּימוּ는 복수 주어를 밝히지 않습니다. ‘그들이’는 뒤의 ‘그들 모두’와 동일 지시로도 읽혀, 죽은 자들이 일어난 것처럼 보이는 한국어상 혼선을 낳습니다. 주어를 생략하는 것이 원문의 모호성을 보존합니다.
  - severity: medium
    issue: ‘죽은 시체’가 한국어에서 중복적이고 부자연스러움
    rationale: פְּגָרִים מֵתִים의 강조는 ‘모두 시체가 되어 있었습니다’로 자연스럽게 옮길 수 있습니다. 이는 시신이라는 결과와 전원의 죽음을 함께 전달합니다.
  - severity: low
    issue: ‘아시리아’보다 ‘앗수르’가 한국어 성서 지명 관용에 더 적합함
    rationale: 현대 일반어에서 아시리아도 이해되지만, 이사야서의 성서 지명으로는 ‘앗수르’가 더 널리 정착되어 있으며 문체상 자연스럽습니다.
  revised_text: 그때 야훼의 천사가 나가서 앗수르 진영에서 십팔만 오천 명을 쳐서 쓰러뜨렸습니다. 아침 일찍 일어나 보니, 보라, 그들은 모두 시체가 되어 있었습니다.[a]
