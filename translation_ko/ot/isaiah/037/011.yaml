id: ISA.37.11
reference: Isaiah 37:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
  footnotes:
  - marker: a
    text: Or 'utterly destroying them' or 'putting them under the ban.' The Hebrew verb carries the idea of consigning something to total destruction.
    reason: lexical_alternative
  - marker: b
    text: Or 'and will you escape?' The line is a taunt and is best understood as a rhetorical question.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 당신은 앗수르의 왕들이 모든 땅을 진멸한 것을[a] 들었습니다. 그런데도 당신이 구출되겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망에 바치다’ 또는 ‘완전히 멸하다’. 히브리어 동사는 어떤 대상을 전적인 멸절에 넘기는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 피하겠습니까?’ 이 말은 조롱조의 수사 의문문입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 강하게 끌어 상대에게 직접 말하는 감탄/호소의 힘을 살리면서, 현대 한국어의 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: מַלְכֵי אַשּׁוּר
  english_pob_choice: the kings of Assyria
  chosen_korean: 앗수르의 왕들
  alternatives_korean:
  - 아시리아의 왕들
  - 앗시리아의 왕들
  lexicon: HALOT
  rationale: 성경 지명·민족명에서 널리 쓰이는 음역인 ‘앗수르’를 택해 역사적 표지를 살렸습니다.
- source_word: לְהַחֲרִימָם
  english_pob_choice: devoting them to destruction
  chosen_korean: 멸망으로 바친
  alternatives_korean:
  - 진멸한
  - 완전히 멸한
  - 진멸하도록 바친
  lexicon: HALOT
  rationale: חרם의 단순한 파괴보다 ‘거룩하게 바쳐 완전한 멸절에 넘기는’ 의미를 살리기 위해, 본문 의미를 직접 드러내는 ‘멸망으로 바친’을 선택했습니다.
- source_word: וְאַתָּה תִּנָּצֵל
  english_pob_choice: and will you be delivered?
  chosen_korean: 그런데도 당신이 구출되겠습니까?
  alternatives_korean:
  - 그런데도 당신이 구원받겠습니까?
  - 그런데도 당신이 벗어나겠습니까?
  lexicon: HALOT
  rationale: 니팔형 נצל의 수동적 의미를 살리면서도, 조롱조의 수사 의문문이라는 문맥을 자연스럽게 드러내기 위해 ‘구출되겠습니까?’로 옮겼습니다.
theological_decisions:
- issue: חרם(헤렘) 전쟁 ভাষ의 번역 강도
  chosen_reading: ‘멸망으로 바친’으로 옮겨, 단순한 ‘파괴’보다 더 강한 전적인 멸절의 뜻을 드러냈습니다.
  alternative_readings:
  - 진멸한
  - 완전히 멸한
  - 저주 아래 둔
  rationale: 본문은 앗수르의 정복이 단순한 군사적 파괴가 아니라, 완전한 멸절에 넘기는 חרם의 강도를 강조합니다. 한국어 본문에서도 그 무게가 약화되지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 마지막 절의 수사 의문문
  chosen_reading: ‘그런데도 당신이 구출되겠습니까?’
  alternative_readings:
  - 당신은 구출될 것입니다
  - 당신이 피할 수 있겠습니까?
  rationale: 문맥상 앗수르 왕의 조롱이 핵심이므로, 선언문처럼 평평하게 읽히지 않도록 수사 의문문으로 처리했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
