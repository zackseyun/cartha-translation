  text: וַ/יִּסַּ֣ע וַ/יֵּ֔לֶךְ וַ/יָּ֖שָׁב סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יֵּ֖שֶׁב בְּ/נִֽינְוֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
  footnotes:
  - marker: a
    text: Or 'dwelt in Nineveh.' The Hebrew verb can denote residing or dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 앗수르 왕 산헤립은 떠나서 가고, 돌아와서 니느웨에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  english_pob_choice: departed
  chosen_korean: 떠나서
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 여행 서술에서 נסע는 ‘떠나다/출발하다’의 의미로 쓰이므로, 이동의 시작을 자연스럽게 살리면서도 과도하게 군사적 ‘진을 걷다’ 이미지는 피했습니다.
- source_word: וַיֵּלֶךְ
  english_pob_choice: went away
  chosen_korean: 가고
  alternatives_korean:
  - 가서
  - 떠나
  lexicon: HALOT
  rationale: 연속된 서술 동사들을 한국어에서도 분리해 보여 주기 위해 ‘떠나서 가고’로 옮겨, 히브리어의 동사 연쇄를 보존했습니다.
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와서
  alternatives_korean:
  - 되돌아와
  - 되돌아가
  lexicon: HALOT
  rationale: שׁוב은 이동 문맥에서 ‘돌아오다’가 가장 직접적이므로, 앞의 이동 동사와의 시간적 진행을 드러내는 형태로 처리했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: dwelt
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 살게 되었습니다
  lexicon: HALOT
  rationale: ישׁב의 기본 범위는 ‘앉다/거주하다/머물다’이지만, 여기서는 돌아온 뒤의 지속적 체류를 뜻하되 한국어의 ‘거주하다’보다 덜 행정적이고 ‘살다’보다 더 서술적인 ‘머물렀습니다’가 적절합니다.
