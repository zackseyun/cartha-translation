revisions:
- from: 유다 집의 남은 생존자들이 다시 아래로 뿌리를 내리고 위로 열매를 맺을 것입니다[a].
  to: 유다 집안의 살아남은 자들이 다시 아래로 뿌리를 내리고 위로 열매를 맺을 것입니다[a].
  rationale: 본문은 원문의 회복 은유와 ‘다시’의 의미를 그대로 유지하면서, ‘유다 집’을 현대 한국어에 더 자연스러운 ‘유다 집안’으로 다듬었습니다. 또한 본문의 불필요한 중복과 각주의 어색한 반복을 줄였으나, פְּלֵיטָה의 ‘도피하여 살아남음’이라는 어휘적 뉘앙스는 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:43Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 וְיָסְפָה는 ‘다시’로, 뿌리를 아래로 내리고 열매를 위로 맺는 농경 은유는 충실히 보존되었습니다. 다만 בֵּית יְהוּדָה를 ‘유다 집’으로 하면 현대 한국어에서 실제 건물을 먼저 연상시킬 수 있으므로, 집단적·혈통적 표현을 드러내는 ‘유다 집안’이 더 적절합니다. פְּלֵיטָה와 הַנִּשְׁאָרָה의 겹친 생존·잔존 의미는 ‘살아남은 자들’로 자연스럽게 압축할 수 있습니다.
  naturalness: ‘유다 집의 남은 생존자들’은 ‘집’의 의미가 어색하고 ‘남은 생존자들’도 다소 번역투입니다. ‘유다 집안의 살아남은 자들’은 현대 표준 한국어에서 자연스럽고, 예언적 문맥의 집합 명사를 무리 없이 표현합니다. ‘아래로 뿌리를 내리고 위로 열매를 맺을 것입니다’는 자연스럽고 합쇼체에도 맞습니다.
  terminology: ‘유다 집안’은 ‘house of Judah’의 공동체적 표현을 보존합니다. ‘살아남은 자들’은 도피하여 생존하고 남은 사람들의 의미를 문맥상 충분히 전달합니다. 식물 은유인 ‘뿌리를 내리다’와 ‘열매를 맺다’는 유지해야 합니다.
  issues:
  - severity: low
    issue: ‘유다 집’의 현대 한국어 어감
    rationale: 국가·백성을 가리키는 히브리어 관용구가 한국어에서는 건물을 뜻하는 말처럼 들릴 수 있습니다. ‘유다 집안’이 집단적 의미를 더 명료하게 전달합니다.
  - severity: low
    issue: 각주의 ‘도망쳐 살아남은 남은 자들’이라는 중복
    rationale: ‘살아남은’과 ‘남은’이 부자연스럽게 반복됩니다. 원문의 대안적 표현은 ‘유다 집안에서 도피하여 남은 자들’처럼 제시하는 것이 자연스럽습니다.
  revised_text: 유다 집안의 살아남은 자들이 다시 아래로 뿌리를 내리고 위로 열매를 맺을 것입니다[a].
