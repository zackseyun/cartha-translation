lexical_decisions:
- source_word: וְ/יָסְפָה
  english_pob_choice: will again
  chosen_korean: 다시
  alternatives_korean:
  - 계속
  - 더하여
  lexicon: HALOT
  rationale: יסף의 ‘더하다/거듭하다’는 뜻을 문맥상 미래의 반복·재개로 풀어, 자연스러운 한국어 부사 ‘다시’로 옮겼습니다.
- source_word: פְּלֵיטַת ... הַ/נִּשְׁאָרָה
  english_pob_choice: the surviving remnant
  chosen_korean: 남은 생존자들
  alternatives_korean:
  - 살아남은 남은 자들
  - 도망쳐 남은 남은 자
  lexicon: HALOT
  rationale: פְּלֵיטָה와 שָׁאַר의 중첩된 생존/남음의 의미를 함께 살리되, 한국어에서는 중복을 피하면서 집합적 의미가 드러나도록 했습니다.
- source_word: בֵּית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다 집
  alternatives_korean:
  - 유다의 집
  - 유다 가문
  lexicon: HALOT
  rationale: 지파·왕국을 가리키는 관용구를 보존하되, 표준 한국어에서 간결하고 자연스러운 ‘유다 집’으로 옮겼습니다.
- source_word: שֹׁרֶשׁ לְ/מָטָּה ... פְרִי לְ/מָעְלָה
  english_pob_choice: take root downward and bear fruit upward
  chosen_korean: 아래로 뿌리를 내리고 위로 열매를 맺다
  alternatives_korean:
  - 아래로 뿌리를 내리고 위로 열매를 맺다
  - 아래로 뿌리내려 위로 열매를 맺다
  lexicon: HALOT
  rationale: 원문의 식물 이미지와 상하 대비를 그대로 살리기 위해 ‘take root/bear fruit’를 한국어 농경 이미지로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 회복의 농경 은유 보존
  chosen_reading: 유다가 다시 뿌리를 내리고 열매를 맺는 모습으로, 안정과 번성을 나타내는 구체적 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘견고히 서서 번성하다’처럼 추상화하여 옮김
  rationale: 원문은 추상적 설명보다 뿌리·열매의 대비를 통해 회복을 보여 주므로, 의미를 평평하게 만들지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
