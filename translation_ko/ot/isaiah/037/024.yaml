id: ISA.37.24
reference: Isaiah 37:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
  footnotes:
  - marker: a
    text: Or 'have reproached' or 'have taunted'; the Hebrew verb carries the sense of insulting or defying with contempt.
    reason: lexical_alternative
  - marker: b
    text: The tree named here (Hebrew berosh) is uncertain; it may refer to cypress, fir, or another conifer.
    reason: lexical_alternative
  - marker: c
    text: Or 'its luxuriant forest' or 'its fruitful forest'; the Hebrew combines the ideas of forest and fertile orchard-land.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 종들을 통해 주님을 모욕하였으며, 이렇게 말하였습니다. ‘내 많은 병거로 내가 산들의 높은 곳, 레바논의 가장 먼 곳에 올라갔노라. 나는 그 높은 백향목들을, 가장 좋은 측백나무들을 베어 내고, 그 가장 높은 곳, 그 열매 많은 숲에 들어가리라.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  english_pob_choice: By your servants
  chosen_korean: 왕의 종들을 통해
  alternatives_korean:
  - 종들의 손으로
  - 종들을 통해
  lexicon: HALOT
  rationale: בְּיַד는 문자적으로 ‘손으로’이지만, 문맥상 수단을 나타내므로 한국어에서는 자연스럽게 ‘통해’로 옮겼습니다. 왕을 향한 조롱의 말투를 살려 ‘왕의 종들’로 풀었습니다.
- source_word: חֵרַפְתָּ
  english_pob_choice: have mocked
  chosen_korean: 모욕하였으며
  alternatives_korean:
  - 조롱하였으며
  - 훼방하였으며
  - 능욕하였으며
  lexicon: HALOT
  rationale: חרף는 단순한 놀림보다 ‘모욕하다/조롱하다/능욕하다’의 강한 경멸을 담습니다. 주님을 직접 향한 도전의 뉘앙스를 살려 ‘모욕하였으며’로 옮겼습니다.
- source_word: בְּרֹב רִכְבִּי
  english_pob_choice: With my many chariots
  chosen_korean: 내 많은 병거로
  alternatives_korean:
  - 내 수많은 병거로
  - 내 풍성한 병거로
  lexicon: HALOT
  rationale: רֶכֶב은 여기서 전투 병거를 가리키므로 ‘병거’가 적절합니다. בְּרֹב의 다수성은 ‘많은’으로 간결하게 살렸습니다.
- source_word: מְרוֹם הָרִים / יַרְכְּתֵי לְבָנוֹן
  english_pob_choice: the heights of the mountains, to the remotest parts of Lebanon
  chosen_korean: 산들의 높은 곳, 레바논의 가장 먼 곳
  alternatives_korean:
  - 산들의 정상들, 레바논의 깊은 곳
  - 산의 높은 곳, 레바논의 가장 먼 끝
  lexicon: HALOT
  rationale: מְרוֹם과 יַרְכְּתֵי는 각각 높이와 먼 끝/가장자리의 이미지를 함께 줍니다. 두 겹의 공간적 과장을 한국어에서도 유지했습니다.
- source_word: יַעַר כַּרְמִלּוֹ
  english_pob_choice: its fruitful forest
  chosen_korean: 그 열매 많은 숲
  alternatives_korean:
  - 그 울창한 숲
  - 그 비옥한 숲
  lexicon: HALOT
  rationale: כַּרְמִל은 ‘비옥한 땅/과수원 같은 땅’의 느낌을 지니므로, POB의 ‘fruitful forest’를 따라 숲의 비옥함과 풍성함을 함께 드러냈습니다.
theological_decisions:
- issue: אֲדֹנָי의 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 여기서는 신적 호칭이므로 한국어 관용에 따라 ‘주님’으로 번역했습니다. 본문은 여호와 이름이 아니라 אדני를 가리키므로 ‘야훼’로 바꾸지 않았습니다.
  doctrine_reference: 'Contested terms: divine titles / YHWH vs. אֲדֹנָי'
