id: ISA.37.19
reference: Isaiah 37:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
  footnotes:
  - marker: a
    text: Or 'their idols.' The Hebrew says 'their gods,' then immediately explains that they were not truly gods but human-made objects.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 신들을 불에 던져 넣었습니다[a]. 그것들은 신들이 아니라 사람의 손이 만든 것, 곧 나무와 돌일 뿐이므로, 그들이 그것들을 멸망시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 우상들’. 히브리어는 먼저 ‘그들의 신들’이라고 한 뒤, 곧바로 그것들이 참으로 신이 아니라고 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתֹן
  english_pob_choice: and have put
  chosen_korean: “불에 던져 넣었습니다”
  alternatives_korean:
  - 불에 넣었습니다
  - 불속에 넣었습니다
  - 불에 던졌습니다
  lexicon: HALOT
  rationale: 동사 נתן의 기본값은 ‘주다/두다’이지만, ‘불’과 결합할 때는 물건을 불 속으로 던져 넣는 처분 행위를 자연스럽게 드러내는 표현이 필요합니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their gods
  chosen_korean: “그들의 신들”
  alternatives_korean:
  - 그들의 우상들
  - 그들의 신상들
  lexicon: HALOT
  rationale: 히브리어는 먼저 그 민족들이 실제로 부르던 명칭인 ‘신들’을 사용하고, 바로 뒤에서 그 신성 주장을 부정합니다. 첫 어구는 그 표면적 호칭을 그대로 살리는 편이 원문에 가깝습니다.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  english_pob_choice: the work of human hands
  chosen_korean: “사람의 손이 만든 것”
  alternatives_korean:
  - 인간의 손이 만든 것
  - 사람 손의 작품
  lexicon: HALOT
  rationale: 직역하면 ‘사람의 손들의 작품’이지만, 한국어에서는 ‘~이 만든 것’이 더 자연스럽고, 뒤의 ‘나무와 돌’과 함께 우상 제작물을 선명하게 보여 줍니다.
- source_word: וַיְאַבְּדוּם
  english_pob_choice: so they destroyed them
  chosen_korean: “그들이 그것들을 멸망시켰습니다”
  alternatives_korean:
  - 그들이 그것들을 파괴했습니다
  - 그래서 그것들을 없애 버렸습니다
  lexicon: HALOT
  rationale: אבד의 사역형은 단순 파손보다 ‘멸망시키다/파괴하다’에 가깝습니다. 결과를 나타내는 ‘그래서’는 원문의 논리적 귀결을 한국어로 분명히 해 줍니다.
theological_decisions:
- issue: ‘신들’이라고 부른 대상의 실재성
  chosen_reading: 첫 절반에서는 적의 호칭을 따라 ‘그들의 신들’로 옮기고, 곧바로 ‘신들이 아니라’로 그 실재적 무가치함을 밝혔습니다.
  alternative_readings:
  - 처음부터 ‘우상들’로 옮김
  - ‘신들’ 대신 ‘가짜 신들’로 설명
  rationale: 원문은 상대가 부르는 명칭을 유지한 뒤 그것을 논박하는 방식으로 풍자적 힘을 냅니다. 처음부터 해석어를 넣으면 그 수사적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
