- from: 그리고 그들의 신들을 불에 던져 넣었습니다[a]. 그것들은 신들이 아니라 사람의 손이 만든 것, 곧 나무와 돌일 뿐이므로, 그들이 그것들을 멸망시켰습니다.
  to: 그리고 그들의 신들을 불에 던져 넣었습니다[a]. 그것들은 신들이 아니라 사람의 손으로 만든 것, 곧 나무와 돌이었으므로, 그들이 그것들을 파괴했습니다.
  rationale: 원문의 ‘그들의 신들’이라는 명칭과 이어지는 신성 부정, 그리고 인간의 손으로 만든 나무와 돌이라는 설명을 유지했습니다. 마지막 동사만 무생물 제작물에 자연스럽고 원문의 처분 의미를 정확히 드러내도록 ‘멸망시켰습니다’에서 ‘파괴했습니다’로 고쳤습니다.
