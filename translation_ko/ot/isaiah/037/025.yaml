id: ISA.37.25
reference: Isaiah 37:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
  footnotes:
  - marker: a
    text: Or 'all the canals/branches of the Nile of Egypt.' The Hebrew expression is idiomatic and may preserve a more specific reference to Egypt's waterways.
    reason: lexical_alternative
  - marker: b
    text: Hebrew Mazor; here likely a poetic or alternate name for Egypt, not 'siege' or 'fortification.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 우물을 파고 물을 마셨으며, 발바닥으로 애굽의 모든 강들을 말려 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 강들’로 옮긴 히브리어 표현은 애굽의 나일 지류나 운하들을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 마초르(Mazor)는 여기서 ‘포위’나 ‘요새’보다 애굽의 별칭으로 이해하는 것이 문맥에 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I dug and drank water
  chosen_korean: 내가
  alternatives_korean:
  - 나
  - 내가 직접
  lexicon: HALOT
  rationale: 히브리어 독립대명사는 여기서 화자의 자랑스러운 자기과시를 드러내므로, 문장 앞에 두어 주체를 강조하는 형태로 옮겼습니다.
- source_word: קַרְתִּי
  english_pob_choice: dug
  chosen_korean: 우물을 파고
  alternatives_korean:
  - 파고
  - 파냈고
  - 굴착하고
  lexicon: HALOT
  rationale: 물과 연결된 문맥이므로 단순한 '파다'보다 한국어에서 더 자연스러운 '우물을 파다'로 구체화해 이미지의 방향을 살렸습니다.
- source_word: וְאַחְרִב בְּכַף פְּעָמַי
  english_pob_choice: with the sole of my feet I dried up
  chosen_korean: 발바닥으로 … 말려 버렸습니다
  alternatives_korean:
  - 발바닥으로 … 말렸습니다
  - 발바닥으로 … 마르게 했습니다
  - 발바닥으로 … 황폐하게 했습니다
  lexicon: HALOT
  rationale: 히필 동사 חרב는 여기서 강과 운하를 대상으로 하므로, 추상적인 '황폐하게 하다'보다 물길을 말려 버리는 구체적 그림을 살리는 것이 원문에 가깝습니다.
- source_word: יְאֹרֵי מָצוֹר
  english_pob_choice: the streams of Egypt
  chosen_korean: 애굽의 모든 강들
  alternatives_korean:
  - 애굽의 모든 나일 수로들
  - 애굽의 모든 운하들
  - 애굽의 모든 강줄기들
  lexicon: HALOT
  rationale: poetic/idiomatic 표현을 한국어에서 바로 이해되도록 '애굽'으로 옮기되, יְאֹר의 나일 수로 뉘앙스는 '강들'로 넓게 반영했습니다. '모든'은 전체성을 살리기 위한 보완입니다.
theological_decisions:
- issue: יְאֹרֵי מָצוֹר의 지시 대상
  chosen_reading: 문맥상 '마초르'는 '애굽'을 가리키는 시적/별칭적 표현으로 보고 본문에는 '애굽의 강들'로 풀어 옮겼습니다.
  alternative_readings:
  - '''포위/요새의 강들''로 직역'
  - 고유명사 '마초르'를 음역
  rationale: 영어 POB가 지적하듯 이 표현은 애굽의 수로를 가리키는 관용구로 이해하는 것이 본문의 의미 전달에 가장 적절합니다. 다만 보다 문자적인 가능성은 주석으로 보존해야 합니다.
  doctrine_reference: 사 37:25 주해 전통과 히브리어 관용구 해석
- issue: 자기과시적 화자의 어조
  chosen_reading: 1인칭 독백의 과장된 승리 선언이라는 수사적 톤을 살리기 위해 직설적이고 단호한 종결을 유지했습니다.
  alternative_readings:
  - 완화된 설명체
  - 겸손한 서술체
  rationale: 본절은 산헤립의 자만을 드러내는 말이므로, 한국어에서도 그 과장과 도발성을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 이사야 37장 문맥의 심판 선언
