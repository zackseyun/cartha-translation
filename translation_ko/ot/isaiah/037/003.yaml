id: ISA.37.3
reference: Isaiah 37:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
  footnotes:
  - marker: a
    text: Or “a day of distress, reproof, and contempt.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “children have come to the birthstool/breaking point.” The Hebrew is a metaphor of labor reaching delivery with no strength left for birth.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 그에게 말했습니다. “히스기야가 이렇게 말했습니다. ‘이 날은 고난과 책망과 모욕의 날입니다[a]. 아이들이 태어날 때가 되었으나[b], 해산할 힘이 없습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고난과 책망과 멸시의 날.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “아이들이 해산 자리(또는 해산의 고비)까지 왔다”입니다. 히브리어는 출산이 임박했지만 해산할 힘이 없는 상황을 비유적으로 표현합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  english_pob_choice: And they said to him
  chosen_korean: 그리고 그들이 그에게 말했습니다
  alternatives_korean:
  - 그들이 그에게 말했습니다
  - 그리고 그들이 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 서술형 연속 동작을 자연스럽게 살리면서도, 히브리어의 간결한 전달 동사를 한국어로 직역에 가깝게 옮겼습니다.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  english_pob_choice: Thus says Hezekiah
  chosen_korean: 히스기야가 이렇게 말씀하셨습니다
  alternatives_korean:
  - 히스기야가 이같이 말씀하셨습니다
  - 히스기야가 이렇게 말했습니다
  lexicon: HALOT
  rationale: 공식적인 전갈/선언 도입구로서 כֹה אָמַר의 기능을 살리되, 한국어에서는 현대적이고 격식 있는 전달 표현으로 옮겼습니다.
- source_word: יוֹם צָרָה וְתוֹכֵחָה וּנְאָצָה
  english_pob_choice: a day of distress, rebuke, and disgrace
  chosen_korean: 고난과 책망과 모욕의 날
  alternatives_korean:
  - 환난과 책망과 수치의 날
  - 고통과 책망과 멸시의 날
  lexicon: HALOT
  rationale: צָרָה는 여기서 단순한 불편이 아니라 국가적 위기이므로 ‘고난’으로 옮겼고, תוֹכֵחָה는 책망/책질의 뉘앙스를 살려 ‘책망’으로, נְאָצָה는 공개적 수치를 드러내는 말로 ‘모욕’으로 옮겼습니다.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  english_pob_choice: for children have come to the point of birth
  chosen_korean: 아이들이 해산할 자리까지 이르렀으나
  alternatives_korean:
  - 아이들이 출산점에 이르렀으나
  - 자녀들이 해산의 문턱까지 이르렀으나
  lexicon: HALOT
  rationale: 출산 은유를 유지하되, מַשְׁבֵּר의 난해한 직역보다 한국어로 이해 가능한 ‘해산할 자리’로 풀어 전달했습니다.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  english_pob_choice: and there is no strength to give birth
  chosen_korean: 낳을 힘이 없습니다
  alternatives_korean:
  - 출산할 힘이 없습니다
  - 해산할 힘이 없습니다
  lexicon: HALOT
  rationale: 문맥상 출산 은유의 결론이므로, 간결하고 자연스러운 한국어로 무력함을 분명히 드러냈습니다.
theological_decisions:
- issue: 출산 은유의 보존
  chosen_reading: 국가적 위기를 일반적 ‘절망’으로 바꾸지 않고, 출산 직전까지 왔으나 힘이 없는 이미지 자체를 유지했습니다.
  alternative_readings:
  - 위기와 무력함으로 의역
  - 마지막 단계의 위기라고만 표현
  rationale: 히브리어는 생생한 출산 은유로 유다의 절박함을 표현하므로, 이미지 보존이 원문의 수사적 힘을 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 6
