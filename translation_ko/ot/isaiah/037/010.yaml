  source_fidelity: 원문의 핵심 구조는 ‘그가 말할 때 너를 속이지 못하게 하라’입니다. 초안의 ‘너를 속여 …라고 말하게 하지 마십시오’는 하나님이 히스기야로 하여금 그 말을 하게 한다는 뜻으로 읽혀, לֵאמֹר의 발화 주체와 수식 관계를 바꿉니다. 또한 בְּיַד는 ‘손에/권세에’의 관용 표현으로 적절히 보존할 수 있습니다.
  naturalness: 합쇼체에서는 ‘당신이 신뢰하는 당신의 하나님이 … 당신을 속이지 못하게 하십시오’가 문법적으로 명확하고 자연스럽습니다. ‘말하여’는 히브리어 לֵאמֹר가 나타내는, 속임의 내용으로 제시된 발화를 자연스럽게 연결합니다.
  terminology: ‘히스기야’, ‘유다 왕’, ‘하나님’, ‘예루살렘’, ‘앗수르 왕’은 표준적인 성서 인명·지명 및 신학 용어입니다. ‘속이다’는 נשא(Hiphil)의 조롱 섞인 고발을 과도하게 완화하지 않고 전달합니다.
