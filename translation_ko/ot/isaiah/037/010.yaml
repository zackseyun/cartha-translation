source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
  footnotes:
  - marker: a
    text: Or “mislead you.” The Hebrew verb can mean “deceive” or “lead astray.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “into the hand of,” an idiom meaning “into the power of.”
    reason: lexical_alternative
translation:
  language: ko
  text: “유다 왕 히스기야에게 이렇게 말하십시오. ‘당신이 신뢰하는 당신의 하나님이 “예루살렘이 앗수르 왕의 손에[b] 넘겨지지 않을 것이다”라고 말하여 당신을 속이지[a] 못하게 하십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신을 미혹하지.” 히브리어 동사는 “속이다” 또는 “그릇되게 이끌다”를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “손에.” 이는 “권세 아래” 또는 “지배권에”라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן אֶל חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  english_pob_choice: Thus you shall say to Hezekiah king of Judah
  chosen_korean: “유다 왕 히스기야에게 이렇게 말하십시오
  alternatives_korean:
  - “히스기야 유다 왕에게 이렇게 말하십시오
  - “유다의 왕 히스기야에게 이렇게 말하십시오
  lexicon: WLC; HALOT
  rationale: פֿ('כֹּה')의 지시부사 성격을 ‘이렇게’로 살리고, 2인칭 복수 명령적 어조를 공문체 ‘말하십시오’로 옮겼습니다.
- source_word: יַּשִּׁאֲךָ
  english_pob_choice: deceive you
  chosen_korean: 속여
  alternatives_korean:
  - 미혹하여
  - 속이게 하여
  lexicon: HALOT
  rationale: 문맥상 앗수르의 조롱이므로 ‘속이다/속여’가 가장 مستقیم하며, POB의 ‘deceive’와 의미 긴장을 그대로 유지합니다.
- source_word: אֱלֹהֶיךָ אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  english_pob_choice: your God, in whom you trust
  chosen_korean: 네가 신뢰하는 네 하나님
  alternatives_korean:
  - 네가 믿는 네 하나님
  - 네가 의지하는 네 하나님
  lexicon: HALOT
  rationale: בּטח는 단순 지식 동의보다 의지·신뢰를 뜻하므로 ‘신뢰하는’이 가장 직접적입니다. 한국어에서는 관계절을 앞에 두어 자연스럽게 정리했습니다.
- source_word: לֵאמֹר לֹא תִנָּתֵן יְרוּשָׁלִַם בְּיַד מֶלֶךְ אַשּׁוּר
  english_pob_choice: saying, “Jerusalem will not be given into the hand of the king of Assyria.”
  chosen_korean: “예루살렘이 앗수르 왕의 손에 넘겨지지 않을 것이다”
  alternatives_korean:
  - “예루살렘이 앗수르 왕에게 넘어가지 않을 것이다”
  - “예루살렘이 앗수르 왕의 권세 아래 놓이지 않을 것이다”
  lexicon: HALOT
  rationale: נָתַן의 수동을 ‘넘겨지다’로 살리고, בְּיַד의 관용구는 직역을 유지하되 한국어에서 자연스럽게 읽히도록 ‘손에’로 옮겼습니다.
theological_decisions:
- issue: 앗수르 사신의 적대적 발언을 어떻게 처리할지
  chosen_reading: 직접 인용 안에 비난/기만의 뉘앙스를 그대로 두고, 신학적으로 중화하지 않았습니다.
  alternative_readings:
  - ‘미혹하다’로 완화할 수 있음
  - 설명적으로 풀어 중립화할 수 있음
  rationale: 본문은 야훼의 신실함을 부정하는 적대적 선전이므로, 독자가 그 조롱의 성격을 분명히 느끼도록 유지하는 것이 원문의 의도에 부합합니다.
  doctrine_reference: 역사서/예언서의 적대 발화 보존 원칙
- issue: ‘손에’ 관용구의 처리
  chosen_reading: ‘앗수르 왕의 손에 넘겨지지 않을 것이다’로 직역 계열을 유지했습니다.
  alternative_readings:
  - ‘앗수르 왕에게 넘어가지 않을 것이다’
  - ‘앗수르 왕의 권세에 들어가지 않을 것이다’
  rationale: 히브리어 관용구 bəyad는 권력·지배를 뜻하므로, 너무 해석적으로 풀기보다 관용구의 힘을 살리는 쪽이 더 स्रोत-가깝습니다.
  doctrine_reference: 원문 관용구 보존
