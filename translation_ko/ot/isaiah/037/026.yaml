  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֽוֹא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אוֹתָ֣/הּ עָשִׂ֔יתִי מִ֥/ימֵי קֶ֖דֶם וִ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵאתִ֔י/הָ וּ/תְהִ֗י לְ/הַשְׁא֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
  footnotes:
  - marker: a
    text: Literally, 'to make desolations, heaps, fortified cities.' The Hebrew near 'heaps' is difficult; the sense is that fortified cities are reduced to ruin-heaps.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 듣지 못하였느냐? 오래전에 내가 그것을 만들었고, 옛날부터 내가 그것을 지었느니라. 이제 내가 그것을 이루었으니[a], 견고한 성읍들이 무너진 더미가 되게 하였느니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너진 더미’는 히브리어의 어려운 결합을 풀어 옮긴 것입니다. 문자적으로는 ‘폐허, 더미, 견고한 성읍들’에 해당하는 표현이 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  english_pob_choice: Have you not heard?
  chosen_korean: 너는 듣지 못하였느냐?
  alternatives_korean:
  - 듣지 않았느냐?
  - 너는 들은 적이 없느냐?
  lexicon: HALOT
  rationale: 수사 의문문으로서 이미 알려진 사실을 상기시키며 책망하는 어조를 살리기 위해 ‘듣지 못하였느냐?’를 택했습니다.
- source_word: לְמֵרָחוֹק / מִימֵי קֶדֶם
  english_pob_choice: Long ago ... from days of old
  chosen_korean: 오래전에 ... 옛날부터
  alternatives_korean:
  - 먼 옛날에 ... 태초부터
  - 아주 오래전에 ... 옛적부터
  lexicon: HALOT
  rationale: 두 시간 표현 모두 먼 과거를 가리키므로, 한국어에서 중복을 피하면서도 고대적 뉘앙스를 유지하는 자연스러운 대응으로 옮겼습니다.
- source_word: עָשִׂיתִי / וִיצַרְתִּי
  english_pob_choice: I made it ... I formed it
  chosen_korean: 내가 그것을 만들었고 ... 내가 그것을 지었느니라
  alternatives_korean:
  - 내가 그것을 행하였고 ... 내가 그것을 형성하였느니라
  - 내가 그것을 만들었고 ... 내가 그것을 빚었느니라
  lexicon: HALOT
  rationale: 하나님의 선행 계획과 의도적 조성을 함께 드러내기 위해 ‘만들다’와 ‘짓다’를 병치했습니다. ‘지었다’는 시적이면서도 ‘형성하다’의 조성 의미를 보존합니다.
- source_word: לְהַשְׁאוֹת גַּלִּים ... עָרִים בְּצֻרוֹת
  english_pob_choice: you should lay waste fortified cities into heaps of ruins
  chosen_korean: 견고한 성읍들이 무너진 더미가 되게 하였느니라
  alternatives_korean:
  - 견고한 성읍들을 황폐한 더미로 만들게 하였느니라
  - 견고한 성읍들이 폐허의 무더기가 되게 하였느니라
  lexicon: HALOT
  rationale: 히브리어의 결과 구문을 따라 ‘되게 하였다’로 옮겨, ‘무너진 더미/무더기’라는 결과를 분명히 했습니다. ‘견고한 성읍들’은 בְּצֻרוֹת의 방어된 도시라는 뜻을 직접 반영합니다.
theological_decisions:
- issue: 하나님의 선행 의도와 역사적 실행
  chosen_reading: 하나님이 오래전에 계획하고 형성하신 것이 이제 역사 속에서 실제로 이루어졌다는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 예지로 약화하여 읽는 방식
  - 사건의 결과만 말하고 하나님의 주도성을 흐리는 방식
  rationale: ‘내가 만들었고 ... 내가 지었고 ... 내가 이루었다’의 연쇄는 단순한 예지를 넘어서 하나님의 주권적 실행을 말합니다. 번역은 이 신학적 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
