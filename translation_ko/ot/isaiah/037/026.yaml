  naturalness: 초안의 ‘-느냐’, ‘-느니라’는 요청된 현대 합쇼체가 아닙니다. ‘-습니까’, ‘-했습니다’로 고치면 현대 표준어의 격식 있는 성경 문체가 됩니다. ‘폐허의 무더기’는 난해한 히브리어 결합을 과도하게 해석하지 않으면서 자연스럽게 전달합니다.
  terminology: ‘견고한 성읍’은 방비된 도시라는 뜻을 충실히 반영합니다. ‘그것’은 하나님께서 오래전에 세우시고 이제 이루신 일을 가리키는 원문의 여성 단수 대명사의 한국어상 자연스러운 처리입니다.
