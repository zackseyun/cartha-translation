  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''when King Hezekiah heard''; the object is implicit from the preceding context and is supplied in English as ''it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야 왕이 그것을 듣자, 자기 옷을 찢고 굵은 베옷을 입고 야훼의 집으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞 문맥의 소식을 가리키는 목적어를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: …자
  alternatives_korean:
  - 그리고 …
  - 그 일이 일어나자
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 전개 표지로서, 한국어에서는 뒤따르는 상황절의 형태로 자연스럽게 살렸습니다.
- source_word: כִּשְׁמֹעַ הַמֶּלֶךְ חִזְקִיָּהוּ
  english_pob_choice: when King Hezekiah heard it
  chosen_korean: 히스기야 왕이 그것을 듣자
  alternatives_korean:
  - 히스기야 왕이 들었을 때
  - 왕 히스기야가 그것을 듣자
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 앞뒤 문맥상 그것이 앞서 전해진 소식을 가리키므로, 한국어에는 지시대명사로 보충해 의미를 분명히 했습니다.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 자기 옷을 찢고
  alternatives_korean:
  - 옷을 찢고
  - 자기 겉옷을 찢고
  lexicon: HALOT
  rationale: כּרע + בגדים는 애도와 큰 충격의 관용구이므로, 직역을 유지하되 현대 한국어에서 자연스러운 '옷'으로 옮겼습니다.
- source_word: וַיִּתְכַּס בַּשָּׂק
  english_pob_choice: covered himself with sackcloth
  chosen_korean: 굵은 베옷을 입고
  alternatives_korean:
  - 삼베옷을 두르고
  - 베옷으로 몸을 덮고
  lexicon: HALOT
  rationale: sackcloth는 애도의 거친 옷감을 가리키므로, 교회적 상투어를 피하면서도 한국어 독자가 이해하기 쉬운 '굵은 베옷'으로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: POB의 יְהוָה 처리 원칙에 따라 신명은 '야훼'로 옮기고, 'בית'은 성전 맥락을 암시하지만 원문 표현을 살려 '집'으로 유지했습니다.
theological_decisions:
- issue: 히브리어 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 직접 신명기를 사용하므로, 제목어로 대체하지 않고 고유명사성을 보존하는 '야훼'를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
