id: ISA.37.27
reference: Isaiah 37:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וָ/בֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵמָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
  footnotes:
  - marker: a
    text: Or 'were dismayed and ashamed.' The Hebrew verbs can emphasize inward dismay as well as being broken or shattered.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'short of hand,' an idiom meaning lacking power or ability.
    reason: lexical_alternative
  - marker: c
    text: The final phrase is difficult. It likely refers to vegetation or a field blighted before the crop stands mature; compare the parallel in 2 Kings 19:26.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 주민은 무력하여 겁에 질렸고 수치를 당했습니다. 그들은 들의 풀과 푸른 싹과 같고, 지붕 위의 풀과 같으며, 이삭이 서기 전의 밭과 같았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִצְרֵי יָד
  english_pob_choice: powerless
  chosen_korean: 무력하여
  alternatives_korean:
  - 손이 짧아
  - 힘이 없어
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘손이 짧다’의 직역보다, 문맥상 능력과 힘의 부재를 드러내는 ‘무력하다’가 POB의 의미를 자연스럽게 살립니다.
- source_word: חַתּוּ
  english_pob_choice: were shattered
  chosen_korean: 겁에 질렸고
  alternatives_korean:
  - 산산이 부서졌고
  - 낙담했고
  - 두려워했고
  lexicon: HALOT
  rationale: 이 동사는 내적 동요와 꺾임을 함께 가리킬 수 있으므로, POB의 주석처럼 ‘dismayed’ 쪽 의미를 살려 ‘겁에 질렸고’로 옮겼습니다.
- source_word: וָבֹשׁוּ
  english_pob_choice: and put to shame
  chosen_korean: 수치를 당했습니다
  alternatives_korean:
  - 부끄러움을 당했습니다
  - 망신당했습니다
  - 치욕을 당했습니다
  lexicon: HALOT
  rationale: בוש의 결과 상태를 한국어로 자연스럽게 드러내는 표현으로, 단순 감정인 ‘부끄러웠다’보다 ‘수치를 당했다’가 문맥의 패배·굴욕을 잘 보존합니다.
- source_word: עֵשֶׂב שָׂדֶה / וִירַק דֶּשֶׁא / חֲצִיר גַּגּוֹת / וּשְׁדֵמָה לִפְנֵי קָמָה
  english_pob_choice: the grass of the field and green growth, like grass on the housetops, and like a field before the standing grain
  chosen_korean: 들의 풀과 푸른 싹과 같고, 지붕 위의 풀과 같으며, 이삭이 서기 전의 밭과 같았습니다
  alternatives_korean:
  - 밭의 풀과 푸른 초목과 같고, 지붕 위의 풀과 같으며, 서 있는 곡식 앞의 밭과 같았습니다
  - 들의 풀, 푸른 초장, 지붕의 풀, 이삭이 서기 전의 밭과 같았습니다
  lexicon: HALOT
  rationale: 연속된 농경 비유를 한국어로 과도하게 풀지 않고 유지했습니다. 특히 ‘וּשְׁדֵמָה לִפְנֵי קָמָה’는 난해하므로, POB의 최종 판단에 맞춰 ‘이삭이 서기 전의 밭’으로 비교적 문자적으로 옮겼습니다.
theological_decisions:
- issue: 시어의 긴장과 반복적 비유 구조
  chosen_reading: 패배한 자들의 상태를 ‘무력함-굴욕-덧없음’의 연쇄로 드러내는 직선적 비유 구조를 유지했습니다.
  alternative_readings:
  - 비유를 한 번에 매끈하게 묶어 의역하는 방식
  - ‘겁에 질렸고’를 약화해 단순한 ‘무너졌고’로 정리하는 방식
  rationale: 본문은 네 개의 농경 이미지를 통해 인간 세력의 허약함을 누적적으로 강조하므로, 의미를 평탄화하지 않고 반복 구조를 살리는 것이 स्रोत의 힘을 보존합니다.
  doctrine_reference: 시 1:4-6, 사 40:6-8의 덧없음 이미지와 연결되는 심판적 비유
