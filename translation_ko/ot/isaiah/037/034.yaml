source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: ko
  text: 그가 왔던 바로 그 길로 돌아갈 것이며, 이 성읍으로는 들어오지 않을 것입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ ... בָּא בָּהּ ... יָשׁוּב
  english_pob_choice: By the way that he came, by it he will return
  chosen_korean: “그가 온 그 길로, 그 길로 돌아갈 것이며”
  alternatives_korean:
  - 그가 온 길로, 그 길로 돌아가겠습니다
  - 그가 왔던 그 길로, 그 길로 되돌아갈 것입니다
  lexicon: HALOT
  rationale: דֶּרֶךְ의 반복을 살려 같은 길로의 회귀를 자연스러운 한국어로 옮겼습니다. '그 길로, 그 길로'는 원문의 반복 강조를 보존합니다.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  english_pob_choice: and he will not come into this city
  chosen_korean: “이 성읍으로는 들어오지 못할 것입니다”
  alternatives_korean:
  - 이 성읍에 들어오지 않을 것입니다
  - 이 성읍 안으로 들어오지 못할 것입니다
  lexicon: HALOT
  rationale: בוא의 이동 종착점을 한국어 동사 '들어오다'로 옮겨 도시 내부 진입 금지를 분명히 했습니다. '성읍'은 히브리어 עִיר의 문맥상 어울리는 성경적 지칭입니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 공식을 한국어에서 흔히 쓰이는 '말씀입니다'로 간결하게 처리했고, 신성명 יְהוָה는 본 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 예언적 종결 공식 נְאֻם יְהוָה의 한국어 톤
  chosen_reading: 서술문 끝의 '야훼의 말씀입니다'로 마무리해 예언 선포의 공적·권위적 어조를 유지했습니다.
  alternative_readings:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  rationale: 직역형보다 한국어 공용 번역 관습에 맞는 선포형이 본문의 예언 공식 기능을 더 분명히 드러냅니다.
  doctrine_reference: 예언적 발화 공식과 신명 표기 원칙
- issue: 야훼의 직접 발화로서의 확정성
  chosen_reading: 문장 전체를 하나의 확정 선언으로 옮겨, 앗수르 왕의 진군이 야훼의 주권 아래 제한된다는 본문의 의미를 보존했습니다.
  alternative_readings:
  - 단순한 예언적 예고로 완화하는 읽기
  - 서술적 전망으로 중화하는 읽기
  rationale: 히브리어 마지막 공식은 단순 전망이 아니라 야훼의 권위 있는 판결을 표지하므로, 한국어에서도 단정적 종결을 유지하는 것이 적절합니다.
  doctrine_reference: 야훼의 주권과 예언 성취
