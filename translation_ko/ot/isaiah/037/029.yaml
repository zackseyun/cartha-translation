theological_decisions:
- issue: 하나님의 심판을 위한 신체-동물 제어 이미지의 보존
  chosen_reading: '''내 갈고리'',''내 재갈'',''네 코'',''네 입술''의 구체적 이미지를 그대로 유지했습니다.'
  alternative_readings:
  - '''너를 제어하겠다''처럼 추상화'
  - '''너를 굴복시키겠다''로 완화'
  rationale: 본문은 앗수르 왕의 오만에 대한 하나님의 주권을 매우 거칠고 물질적인 심판 이미지로 표현하므로, 이를 완화하지 않고 보존하는 것이 원문의 수사와 신학을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §6
