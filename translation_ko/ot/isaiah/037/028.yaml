language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בוֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
  footnotes:
  - marker: a
    text: Or 'your dwelling ... your departure ... your entrance.' The Hebrew uses a conventional sequence for a person's settled life and movements.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 네 앉아 있음과 네 나감과 네 들어옴, 그리고 네가 나를 향해 분노한 것을 알고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 사람의 정착된 삶과 모든 오가심을 가리키는 관용적 삼중 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  english_pob_choice: your sitting down
  chosen_korean: 네 앉아 있음
  alternatives_korean:
  - 네 거함
  - 네 앉음
  lexicon: HALOT
  rationale: 앉아 있음은 ‘앉다’의 상태를 살리면서도, 본문의 관용적 뜻인 정착된 삶의 자리와 일상적 거처를 지나치게 해석하지 않게 합니다.
- source_word: וְצֵאתְךָ
  english_pob_choice: your going out
  chosen_korean: 네 나감
  alternatives_korean:
  - 네 떠남
  - 네 출입
  lexicon: HALOT
  rationale: ‘going out’에 가장 직접적으로 대응하는 말로, ‘들어옴’과 짝을 이루는 움직임의 관용구를 유지합니다.
- source_word: וּבוֹאֲךָ
  english_pob_choice: your coming in
  chosen_korean: 네 들어옴
  alternatives_korean:
  - 네 입장
  - 네 진입
  lexicon: HALOT
  rationale: ‘coming in’의 짝구를 자연스러운 현대 한국어로 옮겨, 앞의 ‘나감’과 함께 생활 전반의 출입을 드러냅니다.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  english_pob_choice: your raging against me
  chosen_korean: 네가 나를 향해 분노한 것
  alternatives_korean:
  - 네가 나를 향해 격분한 것
  - 네가 나를 향해 격노한 것
  lexicon: HALOT
  rationale: 히트파엘 רגז의 격한 동요와 적대적 분노를 살리되, 한국어에서 ‘분노한 것’으로 처리해 동사의 상태성을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하나님의 전지와 현재시제 표현
  chosen_reading: ‘알고 있습니다’로 옮겨, 과거형이 아닌 현재의 지속적이고 완전한 인식을 드러냈습니다.
  alternative_readings:
  - 알았습니다
  - 알아 왔습니다
  rationale: 히브리어 완료형은 여기서 단순한 과거 사실보다 현재의 확정적 인식을 나타내므로, 합쇼체의 현재형이 문맥상 가장 자연스럽고 신학적으로도 적절합니다.
  doctrine_reference: 하나님의 전지
- issue: ‘전형적 열거’의 관용구 유지
  chosen_reading: ‘앉아 있음, 나감, 들어옴’의 삼중 표현을 유지했습니다.
  alternative_readings:
  - 거주와 출입
  - 일상의 모든 삶
  rationale: 이 구절은 사람의 정착된 삶과 모든 이동을 포괄하는 관용적 열거이므로, 의미를 풀어 쓰기보다 원문의 구체성을 보존했습니다.
  doctrine_reference: 문맥적 관용구 해석
