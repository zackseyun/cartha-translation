translation:
  language: ko
  text: “내가 이 성읍을 지켜[a] 구원하겠습니다[b]. 나 자신과 내 종 다윗을 위하여 그렇게 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지키다’는 ‘보호하다’ 또는 ‘방어하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원하다’는 ‘구출하다’ 또는 ‘건져 내다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  english_pob_choice: I will defend
  chosen_korean: 내가 이 도시를 지켜
  alternatives_korean:
  - 내가 이 도시를 보호하여
  - 내가 이 도시를 방어하여
  - 내가 이 도시를 감싸
  lexicon: HALOT
  rationale: גּנן의 보호/차단 의미를 군사적 문맥에 맞게 ‘지키다’로 자연스럽게 옮겼습니다. English POB의 ‘defend’에 대응하면서도 한국어에서 과도하게 기술적이지 않습니다.
- source_word: לְהוֹשִׁיעָהּ
  english_pob_choice: to save it
  chosen_korean: 구원하겠습니다
  alternatives_korean:
  - 구출하겠습니다
  - 건져내겠습니다
  - 살리겠습니다
  lexicon: HALOT
  rationale: ישע의 핵심 의미를 살려 ‘구원하다’로 옮겼습니다. ‘도시’를 가리키는 여성 단수 목적어도 한국어에서는 자연스럽게 풀어 쓸 수 있습니다.
- source_word: לְמַעֲנִי
  english_pob_choice: for my own sake
  chosen_korean: 이는 나 자신을 위함이며
  alternatives_korean:
  - 이는 나를 위함이며
  - 내 이름을 위함이며
  lexicon: HALOT
  rationale: 하나님의 자기-이해가 담긴 목적 표현이어서 ‘나 자신을 위함’으로 반사적 강조를 살렸습니다. 단순한 ‘나를 위하여’보다 원문의 초점을 더 분명히 드러냅니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종 다윗
  - 나의 종
  - 내 노예
  lexicon: HALOT
  rationale: 다윗에 대한 언약적 호칭으로서 עבד를 ‘종’으로 옮겼습니다. 여기서는 지위의 종속성을 드러내되, 노예적 속박을 뜻하는 ‘노예’는 문맥상 과도합니다.
theological_decisions:
- issue: 야훼의 구원 동기와 다윗 언약의 병렬
  chosen_reading: 구원은 하나님의 자기 영광과 다윗에 대한 언약적 신실함이라는 두 동기를 함께 제시합니다.
  alternative_readings:
  - 한 가지 동기만 강조하는 해석
  - 다윗 언약을 단순한 역사적 언급으로 축소하는 해석
  rationale: 본문은 ‘나 자신을 위함’과 ‘다윗을 위함’을 병렬로 두어 긴장을 유지합니다. 번역도 두 동기를 모두 드러내되 설명을 덧붙여 하나로 합치지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
