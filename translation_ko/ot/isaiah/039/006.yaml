  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
  footnotes:
  - marker: a
    text: Or 'your ancestors have stored up.' The Hebrew reads literally 'your fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 날들이 오고 있습니다. 당신의 집에 있는 모든 것과 당신의 조상들[a]이 오늘까지 쌓아 둔 것이 바빌론으로 옮겨질 것이며, 하나도 남지 않을 것입니다. 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오 이제
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄사로, 현대 한국어에서 자연스럽고 격식을 갖춘 호소인 ‘보십시오’를 택했습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있습니다
  alternatives_korean:
  - 날들이 옵니다
  - 그 날들이 오고 있습니다
  lexicon: HALOT
  rationale: 미래의 심판 선포를 나타내는 관용구를 현재진행형으로 살려, 임박성과 예언적 긴박감을 유지했습니다.
- source_word: וְנִשָּׂא
  english_pob_choice: will be carried
  chosen_korean: 옮겨질 것이며
  alternatives_korean:
  - 끌려갈 것이며
  - 가져가질 것이며
  lexicon: HALOT
  rationale: 전치사적 목적지 ‘바빌론’과 결합한 수동적 이동을 자연스럽게 드러내기 위해, 약탈·유배의 이동을 암시하는 ‘옮겨지다’를 선택했습니다.
- source_word: אֲבֹתֶיךָ
  english_pob_choice: your fathers
  chosen_korean: 당신의 조상들이
  alternatives_korean:
  - 당신의 아버지들이
  - 당신의 선조들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어에서는 가문·역대의 축적을 뜻하는 역사적 지칭으로 ‘조상들’이 더 자연스럽고 오해가 적습니다.
