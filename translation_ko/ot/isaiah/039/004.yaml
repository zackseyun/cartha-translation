revisions:
- from: 그가 말씀하셨습니다. 「네 집에서 그들이 무엇을 보았느냐?」 히스기야가 대답하였습니다. 「그들은 내 집에 있는 것을 모두 보았습니다. 내 보물고들 가운데 그들에게 보여 주지 않은 것은 하나도 없었습니다.」[a]
  to: 그가 말했습니다. 「왕의 집에서 그들이 무엇을 보았습니까?」 히스기야가 말했습니다. 「그들은 내 집에 있는 것을 모두 보았습니다. 내 보물고들에는 내가 그들에게 보여 주지 않은 것이 하나도 없었습니다.」[a]
  rationale: 합쇼체 요구에 맞추어 모든 발화를 공식 존댓말로 통일했습니다. 질문의 2인칭 소유 표현은 현대 한국어에서 왕에게 자연스러운 ‘왕의 집’으로 옮겼으며, 이는 원문의 소유 관계를 보존합니다. 마지막 문장은 ‘내가 그들에게’라는 원문의 인칭 정보를 밝혀, 히스기야가 사절들에게 보물고의 모든 것을 보여 주었다는 뜻을 명확히 했습니다. ‘집’과 ‘보물고들’은 유지하고, 궁궐이라는 문맥상 대안은 각주에만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:47Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 질문·응답 구조, ‘집’(בַּיִת)과 ‘보물고들’(אֹצָרוֹת)의 구별, 그리고 ‘하나도 없었다’라는 전면적 부정을 대체로 충실히 반영했습니다. 다만 히스기야의 마지막 진술에서 히브리어 동사 הִרְאִיתִים의 1인칭 주어와 3인칭 복수 목적어를 명시하는 편이 더 정확합니다.
  naturalness: 초안의 대화문 ‘보았느냐’는 지정된 현대 공식 존댓말(합쇼체)과 맞지 않습니다. 서술과 인용문을 모두 ‘-습니다/-습니까’ 체계로 통일하고, 왕에게 하는 질문은 ‘왕의 집’으로 자연스럽게 처리하는 것이 적절합니다.
  terminology: ‘집’과 ‘보물고들’은 원문의 어휘적 대비를 보존하는 적절한 선택입니다. ‘궁궐’ 가능성은 각주로 유지할 수 있습니다. ‘보물고들 가운데’보다 ‘보물고들에는’이 한국어에서 자연스럽고, 원문의 범위도 유지합니다.
