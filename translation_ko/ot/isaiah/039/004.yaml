    rationale: ‘무엇을 보았느냐?’는 현대 공식 존댓말 합쇼체라는 목표 변종에 부합하지 않습니다. ‘무엇을 보았습니까?’로 고쳐야 합니다.
  - severity: low
    issue: 마지막 절에서 ‘내가’와 ‘그들에게’가 생략되어 원문의 인칭 관계가 덜 분명합니다.
