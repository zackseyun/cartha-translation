source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֥ה רָא֖וּ בְּ/בֵיתֶ֑/ךָ וַ/יֹּ֣אמֶר חִזְקִיָּ֗הוּ אֵ֣ת כָּל אֲשֶׁ֤ר בְּ/בֵיתִ/י֙ רָא֔וּ לֹֽא הָיָ֥ה דָבָ֛ר אֲשֶׁ֥ר לֹֽא הִרְאִיתִ֖י/ם בְּ/אוֹצְרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
  footnotes:
  - marker: a
    text: Or “in your palace.” The Hebrew literally says “in your house,” which in a royal setting can refer to the palace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「왕의 집에서 그들이 무엇을 보았습니까?」 히스기야가 말했습니다. 「그들은 내 집에 있는 것을 모두 보았습니다. 내 보물고들에는 내가 그들에게 보여 주지 않은 것이 하나도 없었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 궁궐에서.” 히브리어는 문자적으로 “왕의 집에서”라고 하며, 왕실 맥락에서는 궁궐을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  english_pob_choice: What have they seen
  chosen_korean: 무엇을 보았느냐
  alternatives_korean:
  - 무엇을 보았습니까
  - 무슨 것을 보았느냐
  lexicon: HALOT
  rationale: 히브리어의 직접 질문을 자연스러운 현대 한국어로 옮기되, 왕에게 묻는 장면의 긴장감을 살려 반말형 질문문을 유지했습니다.
- source_word: בְּבֵיתֶךָ
  english_pob_choice: in your house
  chosen_korean: 네 집에서
  alternatives_korean:
  - 네 궁궐에서
  - 네 집 안에서
  lexicon: HALOT
  rationale: 기본 뜻인 ‘집’을 살려 원문의 표현을 유지했고, 왕궁 맥락의 ‘궁궐’로 과도하게 해석하지 않았습니다.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  english_pob_choice: everything that is in my house
  chosen_korean: 내 집에 있는 것을 모두
  alternatives_korean:
  - 내 집에 있는 모든 것
  - 내 집 안의 모든 것
  lexicon: HALOT
  rationale: 총체성을 나타내는 כָּל אֲשֶׁר를 한국어의 ‘모두’로 자연스럽게 풀어, 내용 전체를 빠짐없이 보여 주었다는 뜻을 분명히 했습니다.
- source_word: בְּאוֹצְרֹתָי
  english_pob_choice: in my treasuries
  chosen_korean: 내 보물고들
  alternatives_korean:
  - 내 창고들
  - 내 금고들
  lexicon: HALOT
  rationale: אוֹצָר의 왕실적 맥락을 반영해 ‘보물고’로 옮겼고, 단수보다 복수형이 히브리어 אָצְרֹת의 형태를 더 잘 드러냅니다.
theological_decisions:
- issue: 왕궁 맥락에서의 ‘집’과 ‘보물고’ 표현
  chosen_reading: ‘집’과 ‘보물고’를 직역에 가깝게 유지해, 왕궁을 암시하더라도 원문이 말하는 범위를 넘겨 ‘궁궐’로 확정하지 않았습니다.
  alternative_readings:
  - ‘궁궐’로 번역하여 왕궁 의미를 명시하기
  - ‘창고’로 일반화하기
  rationale: 본문은 בית와 אוצר를 대비시키며 왕실의 소유를 드러내지만, 히브리어 자체는 ‘집’이라고 말하므로 이를 보존하는 편이 주해적으로 더 안전합니다.
  doctrine_reference: 원문 우선 원칙, 역사서술의 직역성
