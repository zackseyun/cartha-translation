base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: ko
  text: 그때 히스기야가 이사야에게 말했습니다. “당신이 전한 야훼의 말씀은 좋습니다.” 그가 다시 말했습니다. “내 생전에는 평안과 안정이 있을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱמֶת는 여기서 ‘진리’보다 ‘안정/확실성’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 여호와의 말씀
  lexicon: יהוה
  rationale: 히브리어 본문이 언약명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 ‘말씀’으로 דָּבָר의 예언적 발화를 살렸습니다.
- source_word: טוֹב
  english_pob_choice: is good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 옳습니다
  - 선합니다
  lexicon: טוב
  rationale: 히스기야가 예언을 평가하는 문맥이므로 단순한 도덕적 ‘선함’보다 평가 표현인 ‘좋습니다’가 자연스럽습니다.
- source_word: שָׁלוֹם וֶאֱמֶת
  english_pob_choice: peace and stability
  chosen_korean: 평안과 안정
  alternatives_korean:
  - 평화와 진리
  - 평안과 진리
  - 평화와 안정
  lexicon: שלום / אמת
  rationale: 후반부는 히스기야의 자기 시대에 대한 안도감을 가리키므로, אֱמֶת를 직역한 ‘진리’보다 왕국의 안전·견고함을 드러내는 ‘안정’이 POB의 의미를 더 정확히 반영합니다.
theological_decisions:
- issue: אֱמֶת의 의미를 ‘진리’로 둘지 ‘안정’으로 둘지
  chosen_reading: ‘안정’은 אמת의 결과적 상태—확실함, 지속성, 흔들림 없음—를 가리키는 것으로 보아 번역했습니다.
  alternative_readings:
  - ‘진리’
  - ‘신실함’
  rationale: 문맥상 히스기야는 바벨론 포로가 아니라 자신의 생애에 닥칠 임시적 평안을 말하고 있으므로, 윤리적·교리적 ‘진리’보다 정치적 안정의 뉘앙스가 더 직접적입니다.
  doctrine_reference: ISA 39:8 문맥 주해
