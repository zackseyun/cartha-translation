id: ISA.39.1
reference: Isaiah 39:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡וא שָׁלַ֡ח מְרֹדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ וַ/יִּשְׁמַ֕ע כִּ֥י חָלָ֖ה וַֽ/יֶּחֱזָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
  footnotes:
  - marker: a
    text: Or, more literally, 'had become strong.' The Hebrew expression refers to recovery after illness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 바벨론 왕이며 발라단의 아들인 므로닥발라단이 히스기야에게 편지들과 예물을 보냈습니다. 그는 히스기야가 병들었다가 나았다는[a] 말을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘강해졌다’입니다. 여기서는 병에서 나은 회복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: HALOT
  rationale: 서사 도입의 시간 표현으로 자연스럽고, 문어체에서 장면 전환을 분명하게 보여 줍니다.
- source_word: שָׁלַח ... סְפָרִים וּמִנְחָה
  english_pob_choice: sent letters and a gift
  chosen_korean: 편지들과 예물을 보냈습니다
  alternatives_korean:
  - 서신들과 선물을 보냈습니다
  - 편지와 선물을 보냈습니다
  lexicon: HALOT
  rationale: סְפָרִים는 외교적 문맥의 ‘편지들’이 가장 직접적이며, מִנְחָה는 여기서 제의적 ‘제물’보다 외교적 ‘예물’이 문맥을 더 잘 살립니다.
- source_word: וַיֶּחֱזָק
  english_pob_choice: had recovered
  chosen_korean: 회복되었다
  alternatives_korean:
  - 강해졌다
  - 기력을 되찾았다
  lexicon: HALOT
  rationale: 직역하면 ‘강해지다’이지만 병후 회복을 가리키는 관용적 용법이므로, 본문 뜻을 분명히 하는 ‘회복되다’를 택했습니다.
theological_decisions:
- issue: אשורית/왕호 음역과 역사적 고유명사 처리
  chosen_reading: 므로닥발라단, 바벨론, 히스기야를 현대 한국어 음역으로 옮기되, 본문 의미를 바꾸는 종교적 의역은 피했습니다.
  alternative_readings:
  - 마르둑발아단
  - 느부갓네살식 전통 음역
  rationale: 이 절은 신학적 쟁점보다 역사 서술의 정확성이 중요하므로, 독자가 인물과 지명을 바로 알아볼 수 있는 표준 음역을 사용했습니다.
  doctrine_reference: 역사 서술 본문 번역 원칙
