revisions:
- from: 그리고 너에게서 나오는 네 아들들 가운데 일부, 곧 네가 낳을 자들이 잡혀 가서, 바빌론 왕의 궁에서 환관들이 될 것입니다.[a]
  to: 또 네게서 나올, 네가 낳을 네 아들들 가운데 일부는 잡혀가 바빌론 왕의 궁전에서 환관들이 될 것입니다.[a]
  rationale: 원문의 반복적인 혈통 관계절은 유지하되, 한국어에서 자연스러운 하나의 명사구로 재구성했습니다. ‘일부는’이 복수의 후속 서술을 자연스럽게 이끌도록 했고, ‘궁전’으로 왕궁 문맥을 분명히 했습니다. סָרִיסִים의 의미 범위는 본문 ‘환관들’과 각주 ‘궁정 관리들’로 계속 보존합니다.
