source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
  footnotes:
  - marker: a
    text: Or 'court officials'; the Hebrew term can refer either to literal eunuchs or, in some contexts, to royal officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너에게서 나오는 네 아들들 가운데 일부, 곧 네가 낳을 자들이 잡혀 가서, 바빌론 왕의 궁에서 환관들이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정 관리들’. 히브리어는 문자적 환관이나, 어떤 문맥에서는 왕실 관료를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  english_pob_choice: And some of your sons
  chosen_korean: 그리고 너에게서 나오는 네 아들들 가운데 일부
  alternatives_korean:
  - 그리고 네 아들들 가운데 일부
  - 그리고 네 자손들 가운데 일부
  lexicon: HALOT
  rationale: 부분을 나타내는 מן의 뜻을 살려 ‘아들들 가운데 일부’로 옮기고, 이어지는 출생 표현과 자연스럽게 이어지도록 했습니다.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ / אֲשֶׁר תּוֹלִיד
  english_pob_choice: who will come from you / whom you will father
  chosen_korean: 너에게서 나오는 … 네가 낳을 자들
  alternatives_korean:
  - 네게서 나올 … 네가 낳을 자들
  - 네게서 나올 … 네가 낳은 자들
  lexicon: HALOT
  rationale: ‘나오다’와 ‘낳다’를 함께 써서 혈통적 출처와 부친의 행위를 모두 살렸습니다. ‘낳을 자들’은 히브리어의 미래 지시를 반영합니다.
- source_word: סָרִיסִים
  english_pob_choice: eunuchs
  chosen_korean: 환관들이
  alternatives_korean:
  - 내시들이
  - 궁정 관리들이
  lexicon: HALOT
  rationale: 본문의 기본 뜻을 따라 ‘환관들’로 옮겼습니다. 다만 이 단어가 문맥에 따라 ‘궁정 관리들’을 뜻할 수 있으므로 그 해석 가능성은 각주로 남겼습니다.
- source_word: בְּהֵיכַל מֶלֶךְ בָּבֶל
  english_pob_choice: in the palace of the king of Babylon
  chosen_korean: 바빌론 왕의 궁에서
  alternatives_korean:
  - 바빌론 왕의 궁전에서
  - 바빌론 왕의 궁정에서
  lexicon: HALOT
  rationale: ‘היכל’은 여기서 성전이 아니라 왕궁을 가리키므로, 현대 한국어로 자연스럽게 ‘궁’으로 옮겼습니다.
theological_decisions:
- issue: סָרִיסִים의 의미 범위
  chosen_reading: 본문에는 ‘환관들’을 두되, 의미가 문맥상 궁정 관리까지 확장될 수 있음을 각주로 밝혀 긴장을 보존합니다.
  alternative_readings:
  - 궁정 관리들
  - 내시들
  rationale: 히브리어는 문자적 환관과 궁정 관료를 모두 가리킬 수 있으므로, 본문은 직역 성격을 살리고 각주에서 대안을 제시하는 편이 원문의 해석 여지를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (의미 긴장 보존)
