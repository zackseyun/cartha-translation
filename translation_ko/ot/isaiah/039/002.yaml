  naturalness: 합쇼체 문체는 적절하나, 원문의 단순한 접속을 ‘그래서’로 인과 관계화한 것은 불필요합니다. 나열된 목적어 뒤의 ‘—를’ 표기는 한국어 문장부호와 조사 결합상 어색하므로, 쉼표로 된 병렬 목적어로 정리했습니다. ‘곳간들’은 문맥상 자연스럽고 복수형도 살립니다.
