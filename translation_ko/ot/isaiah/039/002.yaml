  text: וַ/יִּשְׂמַ֣ח עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת בֵּ֣ית נכת/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת הַ/שֶּׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ כָּל בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֹֽצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
  footnotes:
  - marker: a
    text: Or 'rejoiced over them' or 'was pleased with them.' The Hebrew idiom can be understood either as joy because of the envoys/gifts or joy directed toward them.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of his precious things'; traditionally understood as his treasury or treasure house.
    reason: lexical_alternative
  - marker: c
    text: Or 'all his equipment house'; many understand this as 'all his armory' from the context and the parallel in 2 Kings 20:13.
    reason: alternative_reading
  - marker: d
    text: Or 'treasuries.'
    reason: lexical_alternative
  - marker: e
    text: Or 'realm' or 'kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 그들로 인해 기뻐했습니다[a]. 그는 그들에게 자기 보물창고[b], 곧 은과 금, 향품과 좋은 기름, 자기의 모든 무기고[c], 그리고 자기 곳간들[d]에 있는 모든 것을 보여 주었습니다. 그의 집 안이나 그의 온 통치 영역[e] 안에 있는 것 가운데 히스기야가 그들에게 보여 주지 않은 것은 하나도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 대하여 기뻐했습니다’, ‘그들을 기뻐했습니다’로 옮길 수 있습니다. 히브리어 표현은 사절들 또는 그들이 가져온 것 때문에 기뻐했다는 뜻으로도, 그들을 두고 기뻐했다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 귀중품의 집’이며, 전통적으로 보물창고 또는 보물집으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 모든 장비의 집’으로 옮길 수 있습니다. 문맥과 열왕기하 20:13의 평행 구절에 비추어 많은 이가 ‘무기고’로 이해합니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘저장고들’, ‘보물창고들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘영역’, ‘나라’, ‘왕국’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  english_pob_choice: was glad because of them
  chosen_korean: 그들을 보고 기뻐했습니다
  alternatives_korean:
  - 그들 때문에 기뻐했습니다
  - 그들에게 기뻐했습니다
  - 그들을 기뻐했습니다
  lexicon: HALOT
  rationale: עַל을 동반한 שׂמח는 ‘~때문에/보고 기뻐하다’의 뜻을 가질 수 있으므로, 대상에 대한 감정보다 방문과 선물에 대한 반응을 자연스럽게 살렸습니다.
- source_word: בֵּית נכתה
  english_pob_choice: his treasure house
  chosen_korean: 자기 보물창고
  alternatives_korean:
  - 그의 보물집
  - 자기 귀중품의 집
  - 자기 창고
  lexicon: HALOT
  rationale: 문맥상 귀중한 재물들을 보관한 장소이므로 ‘보물창고’가 가장 직접적이고 이해하기 쉽습니다.
- source_word: כָּל בֵּית כֵּלָיו
  english_pob_choice: all his armory
  chosen_korean: 자기의 무기고
  alternatives_korean:
  - 자기의 장비 창고
  - 자기의 기구의 집
  - 자기의 무구고
  lexicon: HALOT
  rationale: 문맥과 열왕기하 평행구를 따라 이 표현은 무기나 왕실 장비를 두는 곳으로 이해하는 것이 자연스러워 ‘무기고’로 옮겼습니다.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  english_pob_choice: all that was found in his storehouses
  chosen_korean: 자기의 곳간에 있는 모든 것
  alternatives_korean:
  - 자기의 저장고들에 있는 모든 것
  - 자기의 창고들에 있는 모든 것
  - 자기의 보관소에 있는 모든 것
  lexicon: HALOT
  rationale: אֹצָר는 보물창고/저장고의 뜻을 함께 가질 수 있어, 앞의 ‘보물창고’와 중복을 피하면서도 저장된 재물을 드러내는 ‘곳간’으로 옮겼습니다.
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  english_pob_choice: in all his dominion
  chosen_korean: 그의 온 통치 영역
  alternatives_korean:
  - 그의 온 나라
  - 그의 온 영토
  - 그의 온 나라와 통치
  lexicon: HALOT
  rationale: מֶמְשָׁלָה는 단순 영토보다 통치 범위와 권한을 가리킬 수 있어, ‘통치 영역’으로 넓게 살렸습니다.
theological_decisions:
- issue: 이 구절의 왕실 재물 목록을 어떻게 평이하게 옮길지
  chosen_reading: ‘은, 금, 향품, 좋은 기름’으로 직역성을 유지하되, 당시 왕실의 사치품 목록이라는 문맥이 드러나도록 했습니다.
  alternative_readings:
  - ‘은화, 금, 향유’처럼 현대화하기
  - ‘향료, 값진 기름’처럼 풀이하기
  rationale: 히브리어는 물질 목록을 나열하므로, 의미를 넓히지 않고 명사형으로 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: source-text fidelity / narrative description
