revisions:
- from: 히스기야는 그들을 보고 기뻐했습니다[a]. 그래서 그는 자기 보물창고—은, 금, 향품, 좋은 기름, 자기의 무기고와 자기의 곳간에 있는 모든 것—를 그들에게 보여 주었습니다[b][c][d][e]. 그의 집 안이나 그의 온 통치 영역 안에 있는 것 중에서, 히스기야가 그들에게 보여 주지 않은 것은 하나도 없었습니다.
  to: 히스기야는 그들로 인해 기뻐했습니다[a]. 그는 그들에게 자기 보물창고[b], 곧 은과 금, 향품과 좋은 기름, 자기의 모든 무기고[c], 그리고 자기 곳간들[d]에 있는 모든 것을 보여 주었습니다. 그의 집 안이나 그의 온 통치 영역[e] 안에 있는 것 가운데 히스기야가 그들에게 보여 주지 않은 것은 하나도 없었습니다.
  rationale: 원문에 없는 ‘보고’와 과도한 인과 접속을 제거하고, עַל의 의미 범위는 각주에서 보존했습니다. 재물 목록의 병렬 구조와 ‘모든 무기고’ 및 ‘곳간들에 있는 모든 것’의 수식 범위를 명확히 했으며, 각주 표지를 해당 원어 어구에 맞게 재배치했습니다.
