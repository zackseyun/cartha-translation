id: ISA.16.11
reference: Isaiah 16:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּן֙ מֵעַ֣/י לְ/מוֹאָ֔ב כַּ/כִּנּ֖וֹר יֶֽהֱמ֑וּ וְ/קִרְבִּ֖/י לְ/קִ֥יר חָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/011.yaml
  text: Therefore my inward parts moan like a harp for Moab[b][a], and my inner being for Kir-heres.
  footnotes:
  - marker: a
    text: Or 'like a lyre'; the Hebrew kinnor denotes a stringed instrument.
    reason: lexical_alternative
  - marker: b
    text: Kir-heres is a Moabite city; traditionally, 'Kir-hareseth.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 내 속은 모압을 위하여 수금처럼 신음하고, 내 깊은 곳은 기르-헤레스를 위하여 신음합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비파처럼’입니다. 히브리어 킨노르(kinnor)는 현악기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 기르-헤레스는 모압의 성읍입니다. 전통적으로는 ‘기르-하레셋’이라고도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  english_pob_choice: my inward parts
  chosen_korean: 내 속
  alternatives_korean:
  - 내 창자
  - 내 심장
  - 내 내면
  lexicon: HALOT
  rationale: 히브리어 מֵעַי는 문자적으로는 내장/속을 가리키지만, 애도와 깊은 감정의 관용적 표현이므로 현대 한국어에서는 직설적이면서도 자연한 ‘내 속’으로 옮겼습니다.
- source_word: כַּכִּנּוֹר
  english_pob_choice: like a harp
  chosen_korean: 수금처럼
  alternatives_korean:
  - 하프처럼
  - 비파처럼
  lexicon: HALOT
  rationale: כִּנּוֹר는 현악기를 가리키며, 한국어 성경 전통과 현대 가독성을 함께 고려해 ‘수금’을 선택했습니다. 비파는 가능하지만 장르적으로 더 협의적이고, 하프는 현대적이지만 전통적 대응이 약합니다.
- source_word: יֶהֱמוּ
  english_pob_choice: moan
  chosen_korean: 울리고
  alternatives_korean:
  - 신음하고
  - 웅성거리고
  - 울려 퍼지고
  lexicon: HALOT
  rationale: המה는 낮고 떨리는 소리, 혹은 신음/울림을 나타내므로, 애가의 정서와 음향적 이미지를 함께 살리기 위해 ‘울리고’로 옮겼습니다.
- source_word: לְקִיר חָרֶשׂ
  english_pob_choice: for Kir-heres
  chosen_korean: 기르-헤레스
  alternatives_korean:
  - 기르-하레스
  - 기르-하레셋
  - 기르-헤레스 성읍
  lexicon: HALOT
  rationale: 이 구절의 지명은 본문에서 철자 변이와 전통적 표기가 공존하므로, 영어 POB의 주요 본문형을 따라 ‘기르-헤레스’로 음역하고, 전통형 가능성은 주석으로 남겼습니다.
theological_decisions:
- issue: 애가의 감정 표현을 신체 중심 은유로 유지할지 여부
  chosen_reading: ‘내 속’과 ‘내 중심’으로 옮겨, 화자의 애통이 단순한 심리 묘사가 아니라 신체적 공명을 동반한 깊은 슬픔임을 드러냈습니다.
  alternative_readings:
  - ‘내 마음’으로 완화하는 번역
  - ‘내 내면’으로 추상화하는 번역
  rationale: 히브리어 본문은 감정의 강도를 내장/중심 이미지로 표현하므로, 이를 추상화하면 애가의 생생함이 약해집니다.
  doctrine_reference: 성서시가의 비유와 감정 어법
- issue: 지명 표기의 변이 보존 여부
  chosen_reading: 본문에는 POB 본문형인 ‘기르-헤레스’를 두고, 각주로 전통적 대안형을 알리도록 했습니다.
  alternative_readings:
  - 본문을 ‘기르-하레스셋’으로 표기하는 방식
  - 해설 없이 단일 표기만 사용하는 방식
  rationale: 지명은 동일 대상의 전승 변이를 드러내는 요소이므로, 본문과 주석을 분리해 독자가 본문 전승을 추적할 수 있게 했습니다.
  doctrine_reference: 본문 비평과 지명 전승
