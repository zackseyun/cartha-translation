source:
  edition: WLC
  text: וְ/עַתָּ֗ה דִּבֶּ֣ר יְהוָה֮ לֵ/אמֹר֒ בְּ/שָׁלֹ֤שׁ שָׁנִים֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/נִקְלָה֙ כְּב֣וֹד מוֹאָ֔ב בְּ/כֹ֖ל הֶ/הָמ֣וֹן הָ/רָ֑ב וּ/שְׁאָ֥ר מְעַ֛ט מִזְעָ֖ר ל֥וֹא כַבִּֽיר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
  footnotes:
  - marker: a
    text: Or “in three years, as the years of a hired worker,” emphasizing a fixed and exact term.
    reason: lexical_alternative
  - marker: b
    text: Or “the glory of Moab will be dishonored,” with the sense that Moab’s prestige will be humiliated.
    reason: lexical_alternative
  - marker: c
    text: Or “the remnant will be few, very small, not great/strong.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 야훼께서 말씀하셨습니다[a]. “삼 년 안에 — 품꾼의 해수처럼 — 모압의 영광이 낮아지고, 그 큰 무리와 함께 남은 자는 얼마 되지 않아 매우 적고, 강하지 못할 것이다[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “삼 년 안에, 품꾼의 해수처럼”으로도 옮길 수 있으며, 정해진 기한의 엄밀함을 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그 영광이 욕됨을 당할 것이다”로도 옮길 수 있으며, 모압의 위신이 수치를 당한다는 뜻입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “남은 자는 적고, 매우 작고, 강하지 못할 것이다”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 앞 문맥과의 전환·대조를 함께 살려 ‘But now’의 대비감을 자연스럽게 옮겼습니다.
- source_word: דִּבֶּר יְהוָה
  english_pob_choice: the LORD has spoken
  chosen_korean: 야훼께서 말씀하셨습니다
  alternatives_korean:
  - 주님께서 말씀하셨습니다
  - 야훼께서 말씀하셨다
  lexicon: HALOT
  rationale: 본문의 신명기적 표기를 따라 YHWH를 ‘야훼’로 옮기고, 예언 선언의 완료된 권위를 한국어 합쇼체로 표현했습니다.
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  english_pob_choice: Within three years, like the years of a hired worker
  chosen_korean: 삼 년 안에 — 품꾼의 해수처럼
  alternatives_korean:
  - 삼 년 안에 — 고용된 일꾼의 해수처럼
  - 삼 년 동안 — 품꾼의 해수처럼
  lexicon: HALOT
  rationale: ‘품꾼’은 שָׂכִיר의 자연스러운 현대 한국어 대응이며, ‘해수처럼’은 정해진 기한의 엄격함을 보존합니다.
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  english_pob_choice: the glory of Moab will be brought low
  chosen_korean: 모압의 영광이 낮아지고
  alternatives_korean:
  - 모압의 영광이 욕을 당하고
  - 모압의 영예가 낮아지고
  lexicon: HALOT
  rationale: נִקְלָה의 ‘낮아지다/천해지다’ 의미를 살려 ‘영광’과의 대구를 유지했습니다.
- source_word: בְּכֹל הֶהָמוֹן הָרָב וּשְׁאָר מְעַט מִזְעָר לֹא כַבִּיר
  english_pob_choice: with all its great multitude; and the remnant will be few, very small, not mighty
  chosen_korean: 그 큰 무리와 함께 남은 자는 얼마 되지 않아 매우 적고, 강하지 못할 것이다
  alternatives_korean:
  - 그 큰 무리와 함께 남은 자는 매우 적고, 강하지 못할 것이다
  - 남은 무리는 매우 적고, 강하지 못할 것이다
  lexicon: HALOT
  rationale: הֶהָמוֹן은 ‘무리/군중’의 집합적 의미를 살리고, שְׁאָר는 ‘남은 자’로, מְעַט מִזְעָר는 중복 강조를 반영해 ‘얼마 되지 않아 매우 적다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה를 직접 드러내는 표기로 ‘야훼’를 사용해 공적 번역 관례보다 원문 투명성을 우선했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘남은 자’의 뉘앙스
  chosen_reading: 중립적 감소 표현으로 유지
  alternative_readings:
  - 구원론적 ‘남은 자’
  - 그 남은 사람들
  rationale: 이 구절에서는 종말론적 ‘남은 자’ 신학을 덧씌우기보다, 심판으로 인해 수적으로 극소화된 잔여를 가리키는 뜻을 그대로 살렸습니다.
  doctrine_reference: Isaiah 16:14 source context
