    rationale: 초안의 b 주석은 ‘방황하다’라는 תָּעוּ의 의미를 설명하지만, 영어 감사 기록의 난해성 주석은 ‘퍼져/뻗어’로 옮긴 נִטְּשׁוּ에 관한 것입니다. 표지와 내용을 바로잡아야 합니다.
