  - 말라가기
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘약함’보다 생기가 사라져 축 처지는 상태를 드러내는 동사가 적절하여 ‘시들다’를 택했습니다.
- source_word: בַּעֲלֵי גוֹיִם
  english_pob_choice: the lords of the nations
  chosen_korean: 민족들의 주인들
  alternatives_korean:
  - 민족들의 통치자들
  - 민족들의 지배자들
  lexicon: HALOT
  rationale: בעלים의 소유자/주인 뉘앙스를 살리면서, 외국 지배 세력을 가리키는 시적 표현을 유지했습니다.
- source_word: שְׂרוּקֶיהָ
  english_pob_choice: its choice vines
  chosen_korean: 그 가지
  alternatives_korean:
  - 그 좋은 덩굴
  - 그 선택된 포도나무
  lexicon: HALOT
  rationale: 문맥상 포도나무의 뻗은 가지/덩굴을 가리키므로, 한국어에서는 반복되는 가지 이미지를 살려 간결하게 옮겼습니다.
- source_word: תָּעוּ מִדְבָּר
  english_pob_choice: they wandered into the wilderness
  chosen_korean: 광야로 떠돌아다녔습니다
  alternatives_korean:
  - 광야에서 길을 잃었습니다
  - 광야로 방황했습니다
  lexicon: HALOT
  rationale: ‘떠돌아다니다’가 תעה의 길잃음과, 포도나무 줄기가 멀리 퍼져 나가는 의인법을 함께 살려 줍니다.
- source_word: שְׁלֻחוֹתֶיהָ
  english_pob_choice: its shoots
  chosen_korean: 그 가지들
  alternatives_korean:
  - 그 새순들
  - 그 뻗은 가지들
  lexicon: HALOT
  rationale: ‘보내어진 것들/뻗어 나온 것들’이라는 어감을 한국어에서 자연스럽게 드러내기 위해 가지로 옮겼습니다.
- source_word: עָבְרוּ יָם
  english_pob_choice: crossed the sea
  chosen_korean: 바다를 건넜습니다
  alternatives_korean:
  - 바다를 지나갔습니다
  - 바다를 넘었습니다
  lexicon: HALOT
  rationale: 히브리어의 직설적인 공간 이동을 그대로 살리되, 한국어에서는 ‘건너다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 시브마의 포도나무가 민족들의 침공으로 훼손되는 시적 의인화
  chosen_reading: 포도나무의 가지와 새순이 먼 곳까지 뻗지만, 그 확장이 결국 꺾이고 흩어지는 심판의 그림으로 읽었습니다.
  alternative_readings:
  - 단순한 농업 묘사로만 읽는 것
  - 포도나무의 확장을 번영의 상징으로만 읽는 것
  rationale: 본문은 식물의 성장과 파괴를 겹쳐 보여 주는 시적 문장이라, 자연 묘사보다 심판과 몰락의 긴장을 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: 이사야의 모압 심판 예언 문맥
