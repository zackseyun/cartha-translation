  - severity: medium
    issue: שְׂרוּקֶיהָ의 ‘선별된/좋은 포도나무’ 의미가 본문에서 누락되었습니다.
    rationale: 단순히 ‘그 가지’라고 하면 선택된 포도나무 또는 고급 포도나무라는 가능한 어휘적 뉘앙스가 사라집니다.
  - severity: high
