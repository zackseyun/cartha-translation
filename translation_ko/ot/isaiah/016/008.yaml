revisions:
- from: 이는 헤스본의 밭들이 시들기 때문입니다[a], 시브마의 포도나무도 그러합니다. 민족들의 주인들이 그 가지를 꺾었으니, 그들은 야셀까지 이르렀고 광야로 떠돌아다녔습니다[b]; 그 가지들은 퍼져 바다를 건넜습니다[c].
  to: 이는 헤스본의 밭들이 시들고 시브마의 포도나무도 시들었기 때문입니다. 여러 민족의 통치자들이 그 좋은 포도나무들을 쳐서 꺾었습니다[a]. 그것들은 야셀까지 이르렀고 광야에서 헤맸습니다. 그 뻗은 가지들은 멀리 뻗어[b] 바다를 건넜습니다[c].
  rationale: 원문을 우선하여, 시들어 버린 헤스본의 밭과 시브마의 포도나무, 정복자들이 친 좋은 포도나무들, 그리고 야셀·광야·바다에 이르는 포도나무의 의인화된 확장을 보존했습니다. 수식 의미와 각주 표지를 바로잡았으며, נִטְּשׁוּ의 해석상 불확실성은 본문에서 단정하지 않고 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
