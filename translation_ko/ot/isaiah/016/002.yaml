  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
  footnotes:
  - marker: a
    text: Or 'a nest cast out' / 'a nest driven away.' The Hebrew image is compressed and may emphasize a nest disturbed and abandoned.
    reason: lexical_alternative
  - marker: b
    text: '''The daughters of Moab'' may refer literally to Moabite women or figuratively to the towns/settlements of Moab personified as daughters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 떠도는 새처럼, 버려진 둥지처럼[a] 모압의 딸들은[b] 아르논의 여울목들에 있게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버려진 둥지’는 히브리어의 압축된 표현을 자연스럽게 옮긴 것입니다. 문자적으로는 ‘내쫓겨 보내진 둥지’라는 뜻이며, 둥지가 어지럽혀져 버려진 모습을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모압의 딸들’은 문자적으로는 모압의 여자들을 가리킬 수 있고, 비유적으로는 모압의 성읍이나 공동체를 의인화한 표현일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְ/עוֹף נוֹדֵד
  english_pob_choice: like a wandering bird
