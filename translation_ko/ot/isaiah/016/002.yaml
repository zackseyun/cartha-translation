  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
  footnotes:
  - marker: a
    text: Or 'a nest cast out' / 'a nest driven away.' The Hebrew image is compressed and may emphasize a nest disturbed and abandoned.
    reason: lexical_alternative
  - marker: b
    text: '''The daughters of Moab'' may refer literally to Moabite women or figuratively to the towns/settlements of Moab personified as daughters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 떠도는 새처럼, 흩어진 둥지처럼, 모압의 딸들은 아르논의 나루터들에 있게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모압의 딸들’은 문자적으로는 모압의 여자들을 가리킬 수 있고, 비유적으로는 모압의 성읍이나 공동체를 의인화한 표현일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흩어진 둥지’는 히브리어의 압축된 표현을 자연스럽게 옮긴 것으로, 문자적으로는 ‘내쫓긴 둥지’ 또는 ‘버려진 둥지’의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְ/עוֹף נוֹדֵד
  english_pob_choice: like a wandering bird
  chosen_korean: 떠도는 새처럼
  alternatives_korean:
  - 방황하는 새처럼
  - 날아다니는 새처럼
  lexicon: HALOT
  rationale: עוֹף는 ‘새’로, נוֹדֵד는 떠돌며 옮겨 다니는 상태를 나타내므로 ‘떠도는’이 불안정한 이동의 이미지를 자연스럽게 살립니다.
- source_word: קֵן מְשֻׁלָּח
  english_pob_choice: like a scattered nest
  chosen_korean: 흩어진 둥지처럼
  alternatives_korean:
  - 내쫓긴 둥지처럼
  - 버려진 둥지처럼
  - 흩뿌려진 둥지처럼
  lexicon: HALOT
  rationale: מְשֻׁלָּח은 문자적으로는 ‘내쫓겨 보냄/던져짐’이지만, 압축된 시적 이미지를 한국어에서 과도하게 풀지 않고 ‘흩어진’으로 옮겨 둥지의 파괴·유실감을 살렸습니다.
- source_word: בְּנוֹת מוֹאָב
  english_pob_choice: the daughters of Moab
  chosen_korean: 모압의 딸들
  alternatives_korean:
  - 모압의 여자들
  - 모압의 성읍들
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 ‘딸들’로 옮겨, 문자적 여성 집단일 가능성과 의인화된 도시/공동체 가능성을 함께 열어 둡니다.
- source_word: מַעְבָּרוֹת
  english_pob_choice: the fords
  chosen_korean: 나루터들
  alternatives_korean:
  - 건넘목들
  - 도하 지점들
  - 여울목들
  lexicon: HALOT
  rationale: 강을 건너는 장소를 가리키므로 ‘나루터들’이 지형적 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘모압의 딸들’의 지시 대상
  chosen_reading: 직역을 유지해 여성 집단과 성읍/공동체 의인화의 양가성을 보존했습니다.
  alternative_readings:
  - ‘모압의 여자들’로 명시
  - ‘모압의 성읍들’로 해석
  rationale: 본문은 의도적으로 압축되어 있어 한쪽으로 단정하면 시적 중의성이 사라집니다.
  doctrine_reference: 시적 예언문의 은유와 집단 표상
