  naturalness: 기존 문장은 ‘앉을 사람이 있으리니’와 종결형 ‘것입니다’가 한 문장 안에서 어색하게 결합되어 있고, 수식 관계도 다소 불분명합니다. 병렬 분사구를 ‘앉아 재판하며 … 구하고 … 행할 것입니다’로 정리하여 현대 표준어 합쇼체로 자연스럽게 다듬었습니다.
