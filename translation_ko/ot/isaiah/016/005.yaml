id: ISA.16.5
reference: Isaiah 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
  footnotes:
  - marker: a
    text: Or 'he will sit on it'; the Hebrew leaves the subject implicit.
    reason: alternative_reading
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often denoting covenant loyalty or merciful love.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 왕좌가 변함없는 사랑으로 세워질 것이며[a], 다윗의 장막에서 그 위에 앉을 사람이 있으리니, 진실함으로 심판하고 공의를 구하며, 의를 행하는 데 빠를 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그 위에 앉을 것이다’. 히브리어는 주어를 명시하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘변함없는 사랑’은 히브리어 hesed의 언약적 사랑과 자비를 함께 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘진리로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  english_pob_choice: will be established
  chosen_korean: 세워질 것입니다
  alternatives_korean:
  - 설정될 것입니다
  - 확립될 것입니다
  - 견고히 될 것입니다
  lexicon: HALOT
  rationale: הוּכַן의 수동 완료형은 어떤 왕좌가 마련되어 굳게 세워지는 뜻을 가지므로, 문맥에 자연스럽고 결과 상태를 살리는 ‘세워질 것입니다’로 옮겼습니다.
- source_word: בַּחֶסֶד
  english_pob_choice: in steadfast love
  chosen_korean: 변함없는 사랑으로
  alternatives_korean:
  - 인자함으로
  - 언약적 사랑으로
  - 긍휼로
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 감정이 아니라 언약적 충성과 자비를 함께 띠므로, 그 신학적 밀도를 보존하면서도 읽기 자연스러운 ‘변함없는 사랑’으로 옮겼습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in faithfulness
  chosen_korean: 진실함으로
  alternatives_korean:
  - 신실함으로
  - 진리로
  - 충실함으로
  lexicon: HALOT
  rationale: 왕적·재판적 문맥에서 אֱמֶת은 사실 여부보다 신뢰할 수 있음과 성실함을 가리키므로, 문맥상 ‘진실함으로’가 가장 무난하게 그 충실성을 드러냅니다.
- source_word: שֹׁפֵט וְדֹרֵשׁ מִשְׁפָּט וּמְהִר צֶדֶק
  english_pob_choice: judging and seeking justice and swift to do righteousness
  chosen_korean: 심판하고 공의를 구하며, 의를 행하는 데 빠를 것입니다
  alternatives_korean:
  - 재판하며 정의를 찾고 의에 빠를 것입니다
  - 심판하며 공의를 추구하고 의를 재빨리 행할 것입니다
  lexicon: HALOT
  rationale: 세 개의 분사구를 한국어 동사구로 풀어 왕의 지속적 직무를 드러냈고, מִשְׁפָּט은 여기서 재판적 ‘공의’로, צֶדֶק은 행위적 ‘의’로 구분해 표현했습니다.
theological_decisions:
- issue: 다윗의 장막 표현과 메시아적 함의
  chosen_reading: 원문이 말하는 다윗 왕조의 복원 이미지를 그대로 살리고, 메시아적 성취는 본문 밖의 해석 여지로 남겨 두었습니다.
  alternative_readings:
  - 메시아의 직접 예언으로 명시
  - 역사적 다윗 계열 왕에 대한 예언
  rationale: 히브리어 본문은 ‘다윗의 장막’과 이상적 통치를 말하지만 메시아라는 호칭을 직접 쓰지 않으므로, 번역은 본문의 절제를 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
