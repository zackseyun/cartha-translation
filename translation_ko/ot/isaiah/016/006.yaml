  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
  footnotes:
  - marker: a
    text: Or 'his empty talk is not so,' or 'his lies are not so.' The Hebrew term can refer to boastful claims, empty talk, or falsehood.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 모압의 교만, 곧 그가 몹시 교만하다는 것과 그의 오만과 교만과 격분을 들었습니다. 그러나 그의 허풍은 사실이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
