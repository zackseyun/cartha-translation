    text: 또는 ‘그의 헛된 말은 사실이 아닙니다’, 혹은 ‘그의 거짓말은 사실이 아닙니다’. 히브리어는 허풍 섞인 주장, 헛된 말, 또는 거짓말을 가리킬 수 있습니다.
    reason: lexical_alternative
