source:
  edition: WLC
  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּ֣א מְאֹ֑ד גַּאֲוָת֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/עֶבְרָת֖/וֹ לֹא כֵ֥ן בַּדָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
  footnotes:
  - marker: a
    text: Or 'his empty talk is not so,' or 'his lies are not so.' The Hebrew term can refer to boastful claims, empty talk, or falsehood.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압의 교만을 우리가 들었습니다—그가 얼마나 매우 교만한지—그의 오만함과 그의 교만과 그의 격분을 들었습니다. 그의 자랑은 그렇지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 헛된 말은 그렇지 않습니다’, 혹은 ‘그의 거짓말은 그렇지 않습니다’. 히브리어는 자랑스러운 주장, 헛된 말, 거짓말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  english_pob_choice: We have heard
  chosen_korean: 우리가 들었습니다
  alternatives_korean:
  - 우리가 들었고
  - 들은 바 있습니다
  lexicon: HALOT
  rationale: 완료형의 보고적 뉘앙스를 살리되, 현재와 연결되는 전달된 소식을 한국어 자연문으로 옮겼습니다.
- source_word: גְאוֹן / גֵּא / גַּאֲוָתוֹ / וּגְאוֹנוֹ
  english_pob_choice: pride / how very proud he is / his arrogance / his pride
  chosen_korean: 교만 / 얼마나 매우 교만한지 / 오만함 / 교만
  alternatives_korean:
  - 자만 / 얼마나 자만한지 / 그의 거만함 / 그의 자만
  - 오만 / 얼마나 오만한지 / 그의 높아짐 / 그의 높임
  lexicon: HALOT
  rationale: 교만 어휘를 기본으로 두되, 연속된 네 개의 관련 명사를 한국어에서 약간씩 달리 옮겨 반복적 수사를 드러냈습니다.
- source_word: וְעֶבְרָתוֹ
  english_pob_choice: his fury
  chosen_korean: 그의 격분
  alternatives_korean:
  - 그의 분노
  - 그의 맹렬한 분노
  lexicon: HALOT
  rationale: עברה의 넘쳐나는 분노성을 살려 단순한 분노보다 강한 ‘격분’을 택했습니다.
- source_word: לֹא כֵן בַּדָּיו
  english_pob_choice: his boasts are not so
  chosen_korean: 그의 자랑은 그렇지 않습니다
  alternatives_korean:
  - 그의 헛된 말은 그렇지 않습니다
  - 그의 거짓말은 그렇지 않습니다
  lexicon: HALOT
  rationale: בַּדָּיו의 의미 범위(허풍/헛말/거짓말)를 살리면서, 본문 앞의 교만과 연결되는 수사로 ‘자랑’을 기본역으로 두었습니다.
theological_decisions:
- issue: 반복되는 교만 어휘의 수사적 강도
  chosen_reading: 같은 의미권의 단어를 반복하되, 한국어에서는 ‘교만/오만함/자랑’으로 약간 분화해 누적 효과를 살렸습니다.
  alternative_readings:
  - 모두 ‘교만’으로 통일
  - 모두 ‘자랑’으로 통일
  rationale: 히브리어의 어근 반복과 축적을 평평하게 만들지 않기 위해, 의미 중심은 유지하면서도 문체상 변주를 두었습니다.
  doctrine_reference: 성경 번역의 수사 보존 원칙
