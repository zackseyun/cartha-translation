id: ISA.16.12
reference: Isaiah 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֧ה כִֽי נִרְאָ֛ה כִּֽי נִלְאָ֥ה מוֹאָ֖ב עַל הַ/בָּמָ֑ה וּ/בָ֧א אֶל מִקְדָּשׁ֛/וֹ לְ/הִתְפַּלֵּ֖ל וְ/לֹ֥א יוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
  footnotes:
  - marker: a
    text: Or 'he is seen' / 'it appears that Moab is weary on the high place.' The Hebrew allows a more personal or more impersonal sense in the opening clause.
    reason: lexical_alternative
  - marker: b
    text: '''High place'' refers to an elevated cult site used for worship.'
    reason: cultural_note
  - marker: c
    text: Or 'he will not be able.' The translation 'he will not prevail' makes explicit the likely sense of unsuccessful prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압이 산당[a]에서 지쳐 있는 것이 드러나고, 그가 기도하려고 자기 성소로 와도, 그는 할 수 없을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당’은 예배에 사용된 높은 곳의 제의적 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그는 할 수 없을 것이다’라고 말하며, 그가 무엇을 할 수 없는지는 명시하지 않습니다. 문맥상 그의 기도가 성공하지 못함을 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי נִרְאָה
  english_pob_choice: And when it is seen
  chosen_korean: …것이 드러나고
  alternatives_korean:
  - …것이 보이고
  - …것이 알려지고
  lexicon: HALOT
  rationale: 히브리어의 상태 인식 표현을 자연스러운 현대 한국어로 옮기기 위해, 수동적·사실 확인적 뉘앙스를 살려 ‘드러나고’로 번역했습니다.
- source_word: נִלְאָה
  english_pob_choice: is worn out
  chosen_korean: 지친
  alternatives_korean:
  - 기진한
  - 탈진한
  lexicon: HALOT
  rationale: 문맥상 헛된 종교 행위로 인한 쇠진을 나타내므로, 현대 한국어에서 상태를 간명하게 드러내는 ‘지친’을 선택했습니다.
- source_word: הַבָּמָה
  english_pob_choice: the high place
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 고지의 제단
  lexicon: HALOT
  rationale: במה는 우상 숭배의 제의적 ‘high place’를 가리키므로, 한국어 성경에서 통용되는 문화·제의적 대응어인 ‘산당’을 사용했습니다.
- source_word: מִקְדָּשׁוֹ
  english_pob_choice: his sanctuary
  chosen_korean: 자기 성소
  alternatives_korean:
  - 자기 신전
  - 자기 성소
  lexicon: HALOT
  rationale: 사람화된 모압의 소유격을 살리면서도, 이교 제의 장소를 포괄할 수 있도록 ‘성소’로 옮겼습니다.
- source_word: לְהִתְפַּלֵּל
  english_pob_choice: to pray
  chosen_korean: 기도하러
  alternatives_korean:
  - 기도하려고
  - 간구하러
  lexicon: HALOT
  rationale: 히트파엘의 기본 의미를 따라 ‘기도하러’로 옮기되, 목적을 자연스럽게 드러내는 한국어 구문을 택했습니다.
- source_word: וְלֹא יוּכָל
  english_pob_choice: he will not be able
  chosen_korean: 감당하지 못할 것입니다
  alternatives_korean:
  - 할 수 없을 것입니다
  - 이겨내지 못할 것입니다
  lexicon: HALOT
  rationale: 단순 능력 부재보다, 앞절의 절박한 기도마저 이루지 못하는 실패를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘감당하지 못할 것입니다’를 선택했습니다.
theological_decisions:
- issue: 모압의 인칭과 의인화 유지
  chosen_reading: 모압을 단수 인칭으로 의인화해 ‘모압이 … 그가 …’로 옮겼습니다.
  alternative_readings:
  - 모압 백성이 … 그들이 …
  - 비인칭적으로 옮김
  rationale: 히브리어가 국가명 모압에 단수 동사를 쓰는 수사학을 보존해, 본문의 인격화 효과를 그대로 드러내기 위함입니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
