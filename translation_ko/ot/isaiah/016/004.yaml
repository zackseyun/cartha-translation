    rationale: מִפְּנֵי שׁוֹדֵד는 보호의 대상이 되는 위협자로부터라는 뜻입니다. 한국어 ‘~의 앞에서’는 위치 또는 대면의 뜻이 강하므로 ‘파괴하는 자에게서’가 더 충실합니다.
  - severity: medium
