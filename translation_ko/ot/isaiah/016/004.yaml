source:
  edition: WLC
  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
  footnotes:
  - marker: a
    text: 'Or, following another common construal: ''Let my outcasts dwell with you, O Moab; be a shelter to him from the destroyer.'' This reflects a different vocalization/division of the opening words.'
    reason: alternative_reading
translation:
  language: ko
  text: 모압의 쫓겨난 이들이 네게 머물게 하십시오. 그들을 파괴하는 자에게서 피할 곳이 되어 주십시오. 압제자가 끝났고 파괴가 그쳤으며, 짓밟는 자들이 땅에서 사라졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 흔한 구분/모음화에 따르면, ‘내 쫓겨난 이들이 네게 머물게 하라, 모압아. 그에게 파괴하는 자에게서 피할 곳이 되어라.’로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  english_pob_choice: stay with you
  chosen_korean: 너와 함께 머무르게 하십시오
  alternatives_korean:
  - 너에게 머물게 하십시오
  - 너와 함께 살게 하십시오
  - 너에게서 체류하게 하십시오
  lexicon: HALOT
  rationale: גור는 낯선 곳에서 잠시 머무는 뜻을 가지므로, 문맥상 보호를 전제한 ‘머무르게 하십시오’가 자연스럽고 원뜻도 살립니다.
- source_word: נִדָּחַי מוֹאָב
  english_pob_choice: the outcasts of Moab
  chosen_korean: 모압의 쫓겨난 자들
  alternatives_korean:
  - 모압의 유배된 자들
  - 모압의 흩어진 자들
  - 모압의 도망자들
  lexicon: HALOT
  rationale: נדח는 추방되거나 밀려난 사람들을 가리키므로, ‘쫓겨난 자들’이 수동적 상태를 분명히 드러냅니다.
- source_word: הֱוִי סֵתֶר
  english_pob_choice: be a shelter
  chosen_korean: 피할 수 있는 곳이 되어 주십시오
  alternatives_korean:
  - 피난처가 되어 주십시오
  - 숨을 곳이 되어 주십시오
  - 보호처가 되어 주십시오
  lexicon: HALOT
  rationale: סתר의 핵심은 숨거나 피할 수 있는 보호 공간이므로, 현대 한국어에서 자연스러운 기능적 표현으로 옮겼습니다.
- source_word: מִפְּנֵי שׁוֹדֵד
  english_pob_choice: from the destroyer
  chosen_korean: 멸망시키는 자의 앞에서
  alternatives_korean:
  - 파괴하는 자로부터
  - 노략하는 자로부터
  - 짓부수는 자로부터
  lexicon: HALOT
  rationale: שׁודד는 단순 약탈보다 더 넓은 파괴 행위를 포함하므로, ‘멸망시키는 자’가 문맥의 폭력을 잘 반영합니다.
- source_word: אָפֵס הַמֵּץ כָּלָה שֹׁד תַּמּוּ רֹמֵס
  english_pob_choice: the oppressor has come to an end, destruction has ceased, those who trample have vanished
  chosen_korean: 압제자가 끝나고 파괴가 그쳤으며 짓밟는 자들이 사라졌기 때문입니다
  alternatives_korean:
  - 강탈하는 자가 끝나고 황폐함이 그쳤으며 짓밟는 자들이 사라졌기 때문입니다
  - 학대하는 자가 끝나고 황폐가 멈추었으며 짓밟는 자들이 없어졌기 때문입니다
  lexicon: HALOT
  rationale: 연속된 완료형 진술을 한국어로 병렬해, 압제·파괴·짓밟음의 세 층위를 그대로 유지했습니다.
theological_decisions:
- issue: 4절 첫 행의 대상과 대명사 처리
  chosen_reading: 히브리어 본문대로 여성 단수 ‘너’에게 말하는 요청으로 읽고, 모압의 쫓겨난 자들을 그 ‘너’와 함께 머물게 하도록 청합니다.
  alternative_readings:
  - ‘내 쫓겨난 자들을 너와 함께 머물게 하라, 오 모압이여’로 읽는 대안적 분절/모음화
  rationale: 제시된 자음과 모음은 여성 단수 مخاطب과 ‘모압의 쫓겨난 자들’이라는 구성을 가장 직접적으로 지시하므로, 본문 읽기를 본문 안에 두고 대안은 각주로 보존하는 편이 좋습니다.
  doctrine_reference: 번역 철학 §3 — 해석적 긴장은 본문이 아닌 각주에 보존
