    rationale: 각주의 ‘너와 함께’와 ‘오 모압이여’가 함께 놓이면 지시 대상이 혼란스럽고, 후반부의 ‘되어 주십시오’는 인용된 명령문 안에서 높임 종결이 불균형합니다. 영어 감사 기록의 대안 구문을 따라 모압을 직접 호격하고 명령형을 일관되게 제시해야 합니다.
