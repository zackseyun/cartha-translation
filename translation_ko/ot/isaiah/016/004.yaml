revisions:
- from: 모압의 쫓겨난 자들이 너와 함께 머무르게 하십시오. 그들을 멸망시키는 자의 앞에서 피할 수 있는 곳이 되어 주십시오. 이는 압제자가 끝나고 파괴가 그쳤으며 짓밟는 자들이 땅에서 사라졌기 때문입니다.[a]
  to: 모압의 쫓겨난 이들이 네게 머물게 하십시오. 그들을 파괴하는 자에게서 피할 곳이 되어 주십시오. 압제자가 끝났고 파괴가 그쳤으며, 짓밟는 자들이 땅에서 사라졌기 때문입니다.[a]
  rationale: 본문은 마소라 본문의 가장 직접적인 읽기, 곧 모압의 쫓겨난 이들을 여성 단수 ‘너’가 받아 보호하라는 청원으로 유지했습니다. ‘네게’는 בָךְ의 장소·보호 관계를 자연스럽게 드러내며, ‘파괴하는 자에게서 피할 곳’은 מִפְּנֵי שׁוֹדֵד와 סֵתֶר의 관계를 충실히 반영합니다. 논쟁적인 첫 행의 다른 분절/모음화는 본문에 채택하지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:26Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 기본 구문과 세 병렬 진술은 대체로 잘 반영했습니다. 그러나 מִפְּנֵי는 여기서 위협하는 자에게서 보호받는다는 뜻이므로 ‘~의 앞에서’보다 ‘~에게서’가 정확하고 자연스럽습니다. 또한 שׁוֹדֵד는 ‘멸망시키는 자’보다 ‘파괴하는 자’가 원문의 폭력·황폐화 의미를 더 절제하여 옮깁니다.
  naturalness: 합쇼체의 청원문으로 전반적으로 자연스럽지만, ‘그들을 멸망시키는 자의 앞에서 피할 수 있는 곳’은 조사 결합이 다소 부자연스럽습니다. ‘그들을 파괴하는 자에게서 피할 곳’으로 고치면 의미 관계와 한국어 호응이 분명해집니다.
  terminology: ‘모압’, ‘압제자’, ‘짓밟는 자들’, ‘땅’은 적절합니다. סֵתֶר는 문맥상 ‘피할 곳’으로, שׁוֹדֵד는 ‘파괴하는 자’로 옮기는 것이 현대 한국어와 원문의 어휘 범위에 알맞습니다. 대안 읽기 각주는 본문과 달리 모압을 호격으로 명시하고, 명령 종결을 일관되게 해야 합니다.
