    rationale: '''키르하레셋''이 히브리어 지명 형태를 더 충실히 반영합니다.'
  revised_text: 그러므로 모압은 모압을 두고 울부짖을 것입니다. 모두가 울부짖을 것입니다. 키르하레셋의 건포도 떡[a]을 두고 너희는 참으로 짓눌린 채 신음할 것입니다.
