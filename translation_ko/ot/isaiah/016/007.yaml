review_pass:
  verdict: revise
  source_fidelity: 원문의 반복된 동사 יְיֵלִיל은 모압 전체의 큰 애곡을, 2인칭 복수 תֶּהְגּוּ는 이어지는 직접 호소를 나타냅니다. 초안의 '하지만'은 히브리어에 없는 역접을 더하므로 삭제해야 합니다. 또한 הָגָה의 애도 맥락상 '신음하다'가 앞선 '울부짖다'와 강도를 구별하며 더 충실합니다. אַךְ נְכָאִים은 '참으로 짓눌린 채'로 옮겨 강조와 피격 상태를 보존했습니다.
  naturalness: '''모압 때문에''보다 ''모압을 두고''가 자기 자신을 애도하는 לְמוֹאָב의 대상·계기 용법을 자연스럽게 드러냅니다. כֻּלֹּה에 ''온 땅''을 보태지 않고 ''모두가''로 옮겨 원문의 집합적 지시를 유지했습니다. ''당신들은''은 예언적 민족 호소에 다소 부자연스러워 ''너희는''으로 고쳤으며, 서술 종결은 현대 합쇼체로 유지했습니다.'
  terminology: 모압 및 키르하레셋은 음역했습니다. אֲשִׁישֵׁי는 마소라 본문을 따라 '건포도 떡'으로 유지하되, 어려운 어휘 및 가능한 대안을 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 역접 '하지만'이 들어가 있습니다.
    rationale: אַךְ는 여기서 역접 접속사라기보다 강조로 이해되며, '하지만'은 통곡과 피격 상태 사이에 원문에 없는 대조를 만듭니다.
  - severity: medium
    issue: '''통곡하겠지만''과 ''온전히 꺾인 자들입니다''는 각각 어휘 강도 및 문장 연결에서 부정확하거나 부자연스럽습니다.'
    rationale: תֶּהְגּוּ는 애가 문맥에서 낮은 신음·탄식에 가깝고, נְכָאִים은 '온전히'가 아니라 피격·짓눌린 상태를 뜻합니다. 한국어에서는 이를 '참으로 짓눌린 채'로 연결하는 편이 자연스럽습니다.
  - severity: low
    issue: '''그 온 땅이 다''는 כֻּלֹּה에 ''땅''을 명시적으로 첨가합니다.'
    rationale: 모압을 나라·백성으로 의인화한 집합 지시일 수 있으므로, '모두가'가 해석적 첨가를 피합니다.
