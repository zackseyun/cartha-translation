id: ISA.16.7
reference: Isaiah 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן יְיֵלִ֥יל מוֹאָ֛ב לְ/מוֹאָ֖ב כֻּלֹּ֣/ה יְיֵלִ֑יל לַ/אֲשִׁישֵׁ֧י קִיר חֲרֶ֛שֶׂת תֶּהְגּ֖וּ אַךְ נְכָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/007.yaml
  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
  footnotes:
  - marker: a
    text: Or possibly, 'for the foundations of Kir-hareseth'; the Hebrew אֲשִׁישֵׁי is difficult, but the Masoretic Text most naturally reads 'raisin-cakes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모압은 모압 때문에 울 것입니다. 그 온 땅이 다 울 것입니다. 키르-헤레스의 건포도 떡 때문에 당신들은 통곡하겠지만, 온전히 꺾인 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '키르-헤레스의 기초들'로도 볼 수 있습니다. 히브리어 אֲשִׁישֵׁי의 뜻은 난해하지만, 마소라 본문은 가장 자연스럽게 '건포도 떡'을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 이전 심판 선언에 따른 결과를 잇는 추론 접속사로 자연스럽고, 현대 한국어에서도 문맥의 결론성을 분명히 드러냅니다.
- source_word: לְמוֹאָב / כֻּלֹּה
  english_pob_choice: for Moab / all of it
  chosen_korean: 모압 때문에 / 그 온 땅이 다
  alternatives_korean:
  - 모압을 위하여 / 그 모두가
  - 모압에 대하여 / 온전히
  lexicon: HALOT
  rationale: 반복되는 모압은 자기 자신에 대한 통곡을 나타내며, כֻּלֹּה는 모압 전체를 가리키므로 '그 온 땅이 다'로 집합적·의인화된 의미를 살렸습니다.
- source_word: לַאֲשִׁישֵׁי
  english_pob_choice: for the raisin-cakes
  chosen_korean: 건포도 떡 때문에
  alternatives_korean:
  - 건포도 떡을 위해
  - 건포도 떡을 두고
  lexicon: HALOT
  rationale: אֲשִׁישֵׁי의 가장 자연스러운 뜻인 '건포도 떡'을 따르되, 문맥상 상실된 풍요를 애도하는 원인/대상으로 '때문에'를 사용했습니다.
- source_word: תֶּהְגּוּ
  english_pob_choice: You will moan
  chosen_korean: 당신들은 통곡하겠지만
  alternatives_korean:
  - 당신들은 신음하겠지만
  - 당신들은 신음하리니
  lexicon: HALOT
  rationale: 2인칭 복수형의 직접 호소를 살리면서, 애가 문맥에서 가장 강한 한국어 음성 표현인 '통곡하다'를 선택했습니다.
- source_word: נְכָאִים
  english_pob_choice: utterly stricken
  chosen_korean: 온전히 꺾인 자들입니다
  alternatives_korean:
  - 몹시 꺾인 자들입니다
  - 완전히 상한 자들입니다
  lexicon: HALOT
  rationale: נְכָאִים의 '짓눌려 꺾이다/상하다'는 뜻을 반영해, 단순 감정이 아니라 심판으로 완전히 무너진 상태를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 2인칭 복수 호소의 수신자와 문체
  chosen_reading: 예언적 질책으로서의 직접 호칭을 유지해 '당신들은'을 사용했습니다.
  alternative_readings:
  - 3인칭 서술로 완화
  - 주체를 명시하지 않고 수동적으로 번역
  rationale: 히브리어 תֶּהְגּוּ는 직접적인 2인칭 복수형이므로, 한국어도 호소성을 보존하는 것이 원문의 수사 효과를 살립니다.
  doctrine_reference: 예언서의 직접 화법 보존
