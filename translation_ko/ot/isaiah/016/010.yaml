  source_fidelity: 본문의 주요 의미는 대체로 충실합니다. 다만 각주 b는 히브리어 הֵידָד(포도 수확/포도 밟기 때의 외침)에 관한 것이어야 하는데, 현 초안에서는 포도틀을 설명하고 있어 원문 및 영어 POB 감사 기록과 맞지 않습니다. 또한 a 각주는 ‘열매 맺는 밭’(כַּרְמֶל)의 대안 독법에, b 각주는 ‘포도 수확의 외침’에 각각 직접 연결되어야 합니다.
  naturalness: ‘열매 맺는 밭’, ‘포도원’, ‘포도틀’ 및 축제의 노래·외침의 대조는 현대 표준 한국어로 자연스럽습니다. 마지막 절은 ‘저는’보다 원문의 1인칭을 불필요하게 공손한 자기지칭으로 만들지 않는 ‘내가’를 사용하고, 합쇼체 종결인 ‘하였습니다’를 유지하는 편이 성경 본문 문체와 원문의 직접 발화를 더 잘 보존합니다.
