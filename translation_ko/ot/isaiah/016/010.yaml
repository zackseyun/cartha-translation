  to: 기쁨과 즐거움이 열매 맺는 밭에서[a] 사라지고, 포도원에서는 아무도 기쁨으로 노래하지 않으며 아무도 외치지 않습니다. 포도틀에서는 포도를 밟는 이가 없으며, 내가 포도 수확의 외침을[b] 그치게 하였습니다.
