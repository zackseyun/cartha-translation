id: ISA.16.10
reference: Isaiah 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
  footnotes:
  - marker: a
    text: Or 'from Carmel,' taking כַּרְמֶל as the place name rather than 'the fruitful field.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the vintage shout' or 'harvest shout,' the cry associated with grape treading.
    reason: lexical_alternative
translation:
  language: ko
  text: 기쁨과 즐거움이 열매 맺는 밭에서 사라지고, 포도원에서는 아무도 기쁨으로 노래하지 않으며 아무도 외치지 않습니다. 포도틀에서 포도를 밟는 사람도 없고, 저는 포도 수확의 외침을 그치게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘카르멜에서’로도 읽을 수 있습니다. 이 경우 כַּרְמֶל을 지명으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 포도 짜는 틀이나 가마를 가리키며, 수확기의 포도 밟기를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף שִׂמְחָה וָגִיל
  english_pob_choice: Joy and gladness are taken away
  chosen_korean: 기쁨과 즐거움이 사라지고
  alternatives_korean:
  - 기쁨과 즐거움이 거두어지고
  - 기쁨과 환희가 사라지고
  lexicon: HALOT
  rationale: נֶאֱסַף의 수동적 제거 의미를 한국어에서는 자연스럽게 ‘사라지고’로 살렸고, שִׂמְחָה/גִיל의 평행을 ‘기쁨/즐거움’으로 구분해 반복을 보존했습니다.
- source_word: מִן הַכַּרְמֶל
  english_pob_choice: from the fruitful field
  chosen_korean: 열매 맺는 밭에서
  alternatives_korean:
  - 비옥한 들에서
  - 카르멜에서
  lexicon: HALOT
  rationale: 문맥상 포도원·포도틀과 평행을 이루는 일반 명사 용례로 보고, 지명화보다 농업적 의미를 드러내는 ‘열매 맺는 밭’을 택했습니다.
- source_word: יְרֻנָּן ... יְרֹעָע
  english_pob_choice: no one sings for joy, no one shouts
  chosen_korean: 아무도 기쁨으로 노래하지 않으며 아무도 외치지 않습니다
  alternatives_korean:
  - 아무도 환호하지 않으며 아무도 소리치지 않습니다
  - 아무도 즐겁게 노래하지 않으며 아무도 부르짖지 않습니다
  lexicon: HALOT
  rationale: 두 동사의 축제적·수확적 함의를 살리되, 한국어에서는 ‘노래하다/외치다’의 병렬로 자연스럽게 옮겨 포도 수확의 침묵을 드러냈습니다.
- source_word: יְקָבִים ... יִדְרֹךְ הַדֹּרֵךְ
  english_pob_choice: in the presses [b]; no treader treads out wine
  chosen_korean: 포도틀에서 포도를 밟는 사람도 없고
  alternatives_korean:
  - 포도틀에서 포도를 밟는 자도 없고
  - 포도주 틀에서 짓밟는 사람도 없고
  lexicon: HALOT
  rationale: יְקָבִים을 포도즙을 짜는 틀/가마로 이해해 ‘포도틀’로 옮겼고, 반복 구조를 한국어에서 ‘밟는 사람도 없고’로 간명하게 재현했습니다.
- source_word: הֵידָד הִשְׁבַּתִּי
  english_pob_choice: I have put an end to the vintage shout
  chosen_korean: 저는 포도 수확의 외침을 그치게 했습니다
  alternatives_korean:
  - 제가 포도 수확의 외침을 멈추게 했습니다
  - 포도 수확의 환호를 제가 끊었습니다
  lexicon: HALOT
  rationale: הֵידָד의 수확 환호를 ‘포도 수확의 외침’으로 풀어 뜻을 살리고, הִשְׁבַּתִּי의 사역적 의미를 ‘그치게 했습니다’로 옮겼습니다.
theological_decisions:
- issue: 1인칭 동사의 발화 주체
  chosen_reading: 본문의 1인칭 ‘저는’은 그대로 유지하고, 본문 안에 ‘여호와/주님’을 보충하지 않았습니다.
  alternative_readings:
  - ‘여호와께서 저는…’처럼 주어를 명시
  - ‘주님이 포도 수확의 외침을 그치게 하셨습니다’로 전환
  rationale: 히브리어는 마지막 절에서 1인칭 단수만 제시하며, 문맥상 발화 주체가 분명하지만 본문 자체를 넘어서 주어를 덧붙이지 않는 것이 원문 구조를 더 정확히 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 3
