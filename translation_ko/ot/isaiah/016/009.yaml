id: ISA.16.9
reference: Isaiah 16:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
  footnotes:
  - marker: a
    text: Or 'I water you with my tears.' The verb conveys saturating or drenching.
    reason: lexical_alternative
  - marker: b
    text: '''The shout has fallen'' may refer either to an invading battle cry falling upon the harvest or, by implication, to the joyful harvest shout having ceased.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 저는 야에셀의 울음으로 시브마의 포도나무[a]를 두고 울겠습니다. 저는 제 눈물을 흘려 헤스본과 엘르알레[b]를 적시겠습니다. 이는 너의 여름 열매와 너의 추수 위에 전쟁 함성이 떨어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘포도나무’는 지역명 시브마에 속한 포도 이미지를 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘헤스본과 엘르알레’는 본문상 울음의 대상이 되는 지명들입니다.
    reason: source_note
lexical_decisions:
- source_word: אֶבְכֶּה
  english_pob_choice: I weep
  chosen_korean: 저는 … 울겠습니다
  alternatives_korean:
  - 저는 … 웁니다
  - 저는 … 울고 있습니다
  lexicon: HALOT
  rationale: 예언적 탄식 문맥에서 미완료형의 의지·미래 뉘앙스를 살리면서, 현대 한국어에서는 ‘울겠습니다’가 가장 자연스럽습니다.
- source_word: בִּבְכִי יַעְזֵר
  english_pob_choice: with the weeping of Jazer
  chosen_korean: 야에셀의 울음으로
  alternatives_korean:
  - 야에셀의 울음과 함께
  - 야에셀의 울음을 따라
  lexicon: HALOT
  rationale: בְּ + 명사구의 동반/수단 감각을 살려, 단순한 원인을 넘는 애가의 결을 한국어 조사 ‘-으로’로 옮겼습니다.
- source_word: גֶּפֶן שִׂבְמָה
  english_pob_choice: the vine of Sibmah
  chosen_korean: 시브마의 포도나무
  alternatives_korean:
  - 시브마의 포도덩굴
  - 시브마의 포도원
  lexicon: HALOT
  rationale: גֶּפֶן의 핵심 이미지는 ‘포도나무’이므로, 과도하게 집단화한 ‘포도원’보다 원문 이미지를 직접 보존했습니다.
- source_word: אֲרַיָּוֶךְ
  english_pob_choice: I drench you
  chosen_korean: 저는 … 적시겠습니다
  alternatives_korean:
  - 저는 … 흠뻑 적시겠습니다
  - 저는 … 물들이겠습니다
  lexicon: HALOT
  rationale: 눈물로 상대를 적신다는 비유를 한국어에서 자연스럽게 전달하면서도, 과장 없이 원문의 ‘젖게 하다/적시다’ 의미를 살렸습니다.
- source_word: הֵידָד נָפָל
  english_pob_choice: the battle shout has fallen
  chosen_korean: 전쟁 함성이 떨어졌기 때문입니다
  alternatives_korean:
  - 전쟁 함성이 내려왔기 때문입니다
  - 추수의 함성이 사라졌기 때문입니다
  lexicon: HALOT
  rationale: הֵידָד와 נָפָל의 직역적 이미지를 살려 ‘떨어졌기 때문’으로 옮겼고, 문맥상 침공의 함성으로 읽히는 긴장을 유지했습니다.
theological_decisions:
- issue: 끝절의 הֵידָד 해석
  chosen_reading: 주된 본문은 ‘전쟁 함성’으로 옮기되, ‘떨어졌기 때문’이라는 직역 이미지를 유지했습니다.
  alternative_readings:
  - 기쁨의 추수 함성이 멎었습니다
  - 포도틀의 환호가 사라졌습니다
  rationale: 이 본문은 심판의 시적 언어로서 함성의 성격을 완전히 닫지 않으므로, 침공의 함성 가능성을 살리면서도 해석을 지나치게 단정하지 않았습니다.
  doctrine_reference: '번역 원칙 §3: 문맥이 허용하는 긴장을 보존합니다.'
