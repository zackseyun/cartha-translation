id: ISA.16.3
reference: Isaiah 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הביאו עֵצָה֙ עֲשׂ֣וּ פְלִילָ֔ה שִׁ֧יתִי כַ/לַּ֛יִל צִלֵּ֖/ךְ בְּ/ת֣וֹךְ צָהֳרָ֑יִם סַתְּרִי֙ נִדָּחִ֔ים נֹדֵ֖ד אַל תְּגַלִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
  footnotes:
  - marker: a
    text: Or 'make justice,' 'render judgment,' or 'give arbitration' for 'make a decision.' The Hebrew noun carries legal/judicial nuance.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not reveal' or 'do not expose' the fugitive.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'your shadow' may also be rendered 'your shade.'
    reason: lexical_alternative
translation:
  language: ko
  text: 조언을 가져오십시오[a]. 결정을 내리십시오. 당신의 그늘을 한낮 한가운데서 밤처럼 되게 하십시오[c]; 떠돌아다니는 자를 숨기고, 도망하는 자를 드러내지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판결을 내리십시오’, ‘정의를 행하십시오’, ‘중재를 하십시오’로 옮길 수 있습니다. 히브리어 명사는 사법적 판단의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘도망하는 자를 드러내지 마십시오’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘당신의 그늘’은 ‘당신의 그늘진 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  english_pob_choice: Bring counsel
  chosen_korean: 조언을 가져오십시오
  alternatives_korean:
  - 권고를 가져오십시오
  - 의논을 가져오십시오
  lexicon: HALOT
  rationale: 히브리어는 조언이나 정책적 자문을 요청하는 말이므로, 현대 한국어에서 자연스럽고 공적인 표현인 ‘조언을 가져오십시오’로 옮겼습니다.
- source_word: פְלִילָה
  english_pob_choice: make a decision
  chosen_korean: 결정을 내리십시오
  alternatives_korean:
  - 의로운 판결을 내리십시오
  - 판단을 내리십시오
  - 중재를 하십시오
  lexicon: HALOT
  rationale: 이 명사는 משפט적·사법적 판정을 가리킬 수 있어, 본문 의미를 살리면서도 현대 한국어로 분명한 ‘결정을 내리다’로 옮겼습니다.
- source_word: צִלֵּךְ
  english_pob_choice: your shadow
  chosen_korean: 당신의 그늘
  alternatives_korean:
  - 당신의 그림자
  - 당신의 그늘진 곳
  lexicon: HALOT
  rationale: 히브리어 צל은 ‘그늘’과 ‘그림자’가 모두 가능하지만, 밤과 대비되는 보호 이미지에는 ‘그늘’이 더 자연스럽고 한국어 관용에도 맞습니다.
- source_word: תְּגַלִּי
  english_pob_choice: do not betray / do not reveal
  chosen_korean: 드러내지 마십시오
  alternatives_korean:
  - 밝히지 마십시오
  - 폭로하지 마십시오
  - 배신하지 마십시오
  lexicon: HALOT
  rationale: 문맥상 도망하는 자를 보호하는 장면이므로, 단순한 ‘reveаl’의 의미를 살리되 노출·인도를 암시하는 ‘드러내다’로 옮겼습니다.
theological_decisions:
- issue: 직접 명령형의 화자-청자 관계를 어떻게 살릴지
  chosen_reading: 예언적 호소의 급박함을 살려 공손한 명령형으로 번역했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 더 전통적인 성경체 명령형
  rationale: 본문은 모압을 향한 직접적 요청이므로, 한국어 합쇼체 명령형이 원문의 촉구와 공적 어조를 가장 잘 전달합니다.
  doctrine_reference: 예언문맥의 수사적 직접화
