id: ISA.16.1
reference: Isaiah 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
  footnotes:
  - marker: a
    text: Or 'from the crag' or 'from the rock'; the Hebrew סלע can be read as a common noun, though it is likely the place-name Sela here.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'a lamb' likely refers to tribute sent to the ruler.
    reason: cultural_note
translation:
  language: ko
  text: '다음과 같이 보내십시오: 어린 양을 그 땅의 통치자에게, 사막의 셀라에서부터 딸 시온의 산으로.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סלע는 보통명사로는 '바위, 절벽'을 뜻할 수 있지만, 여기서는 지명 셀라로 읽는 것이 유력합니다.
    reason: lexical_alternative
  - marker: b
    text: '''어린 양''은 문맥상 그 통치자에게 보내는 조공을 가리킬 가능성이 큽니다.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  english_pob_choice: Send
  chosen_korean: 보내십시오
  alternatives_korean:
  - 보내라
  - 보내시오
  lexicon: HALOT
  rationale: 복수 명령형의 직접적 명령을 현대 표준어 합쇼체로 옮겼습니다. 예언적 호소의 긴박함을 살리면서도 문체를 현대적으로 유지합니다.
- source_word: כַר
  english_pob_choice: a lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양 한 마리
  - 숫양
  lexicon: HALOT
  rationale: 본문의 구체적 이미지인 어린 양을 유지했습니다. POB의 주석처럼 조공의 함의는 문맥에서 읽히도록 두고, 본문에는 동물 이미지를 그대로 보존했습니다.
- source_word: מֹשֵׁל אֶרֶץ
  english_pob_choice: the ruler of the land
  chosen_korean: 그 땅의 통치자
  alternatives_korean:
  - 그 땅의 지배자
  - 그 땅의 치자
  lexicon: HALOT
  rationale: מֹשֵׁל은 단순한 '왕'보다 넓은 '통치자'가 더 정확하고, אֶרֶץ는 여기서 우주적 '땅'보다 지역적 의미의 '그 땅'이 자연스럽습니다.
- source_word: מִסֶּלַע
  english_pob_choice: from Sela
  chosen_korean: 셀라에서부터
  alternatives_korean:
  - 바위에서부터
  - 절벽에서부터
  lexicon: HALOT
  rationale: 지명으로 읽는 POB의 판단을 따라 셀라를 음역했습니다. 다만 히브리어 형태 자체는 보통명사로도 읽힐 수 있어 그 가능성은 주석으로 보존됩니다.
- source_word: אֶל הַר בַּת צִיּוֹן
  english_pob_choice: to the mountain of daughter Zion
  chosen_korean: 딸 시온의 산으로
  alternatives_korean:
  - 시온의 딸의 산으로
  - 딸 시온 산으로
  - 딸 시온의 산으로
  lexicon: HALOT
  rationale: '''딸 시온''이라는 히브리 시적 의인화를 평평하게 ''예루살렘''으로 바꾸지 않고 유지했습니다. 한국어에서는 소유격 구조로 옮겨 원문의 은유를 최대한 드러냈습니다.'
theological_decisions:
- issue: 16:1의 조공/외교적 함의를 본문에 얼마나 드러낼지
  chosen_reading: 본문은 '어린 양을 보내라'로 유지하고, 조공의 의미는 문맥에서 읽히도록 했습니다.
  alternative_readings:
  - 조공으로 어린 양을 보내십시오
  - 어린 양 예물을 보내십시오
  rationale: 히브리어는 구체적으로 '어린 양'을 말하며, 조공의 정치적 함의는 강하지만 명시어가 아닙니다. 본문 이미지를 보존하는 것이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
