review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 어순은 대체로 충실합니다. 다만 יָדִיחַ는 씻어 내거나 헹구어 없애는 이미지를 지니므로 ‘제거하실’은 원문의 반복된 정결 의상을 약화합니다. 이를 ‘씻어 내실’로 고쳤습니다.
  naturalness: 원문의 절 구조상 ‘~하실 때’ 뒤에 ‘하실 것입니다’를 두는 것은 가능하지만, ‘그렇게’를 보충하면 지시 대상이 분명해져 더 자연스럽습니다. ‘불타게 하는 영’은 다소 우회적이므로 분사형의 능동적 의미를 살린 ‘불태우는 영’이 현대 한국어에 더 자연스럽습니다.
  terminology: ‘주’는 אֲדֹנָי에 적절하며, ‘시온 딸들’, ‘더러움’, ‘피 흘림’, ‘심판의 영’도 본문의 비유와 법정적 정결 문맥을 보존합니다. 각주 b의 ‘피에 대한 죄책’은 bloodguilt의 한국어 표현으로 어색하여 ‘유혈의 죄책’으로 바로잡았습니다. 각주 a에는 성령 및 바람/숨의 가능성을 함께 명시하여 רוּחַ의 모호성을 보존했습니다.
  issues:
  - severity: medium
    issue: ‘제거하실’이 יָדִיחַ의 씻어 냄/헹구어 냄의 이미지를 일반화합니다.
    rationale: 앞선 רָחַץ와 함께 정결을 위한 세척의 병행 표현이므로, 한국어에서도 ‘씻어 내실’로 유지하는 편이 원문에 가깝습니다.
  - severity: low
    issue: ‘불타게 하는 영’은 한국어에서 다소 설명적이며 분사 בָּעֵר의 직접성이 약합니다.
    rationale: ‘불태우는 영’이 불로 태워 정결하게 하는 힘이라는 이미지를 더 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 b의 ‘피에 대한 죄책’은 bloodguilt의 관용적이고 정확한 한국어 표현이 아닙니다.
    rationale: ‘유혈의 죄책’은 복수형 דְּמֵי의 유혈·혈죄 의미를 자연스럽게 보존합니다.
  - severity: low
