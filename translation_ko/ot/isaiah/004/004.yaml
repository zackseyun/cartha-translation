id: ISA.4.4
reference: Isaiah 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
  footnotes:
  - marker: a
    text: Or 'by the Spirit of judgment and by the Spirit of burning.' The Hebrew word can also mean 'wind' or 'breath.'
    reason: alternative_reading
  - marker: b
    text: '''Bloodshed'' could also be rendered ''bloodguilt.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 시온 딸들의 더러움을 씻어 내시고 예루살렘의 피 흘림을 그 가운데서 제거하실 때, 심판의 영과 불타게 하는 영으로 하실 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판의 바람과 불타는 바람’으로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘피 흘림’은 ‘피에 대한 죄책’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: when
  chosen_korean: ~할 때
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 문맥상 조건의 불확실성보다 이전 절의 약속이 실현되는 시점을 가리키므로, 한국어에서는 ‘~할 때’로 자연스럽게 옮겼습니다.
- source_word: צֹאַת
  english_pob_choice: the filth
  chosen_korean: 더러움
  alternatives_korean:
  - 오물
  - 부정
  lexicon: HALOT
  rationale: 강한 불결·오염의 이미지를 살리되, 한국어에서 지나치게 속되거나 제의적으로만 좁아지지 않도록 ‘더러움’으로 옮겼습니다.
- source_word: דְּמֵי יְרוּשָׁלַםִ
  english_pob_choice: the bloodshed of Jerusalem
  chosen_korean: 예루살렘의 피 흘림
  alternatives_korean:
  - 예루살렘의 피흘림
  - 예루살렘의 피의 죄
  lexicon: HALOT
  rationale: ‘피들’의 복수형이 가리키는 살육/유혈의 의미를 살리기 위해 ‘피 흘림’으로 번역했고, 도덕적·법적 함의는 주해 여지를 남겼습니다.
- source_word: בְּרוּחַ מִשְׁפָּט וּבְרוּחַ בָּעֵר
  english_pob_choice: by a spirit of justice and by a spirit of burning
  chosen_korean: 심판의 영과 불타게 하는 영
  alternatives_korean:
  - 판결의 영과 불타는 영
  - 재판의 영과 소멸의 영
  lexicon: HALOT
  rationale: רוּחַ의 의미 범위를 좁히지 않고, POB의 ‘spirit’ 선택을 따라 ‘영’으로 옮겼습니다. מִשְׁפָּט는 여기서 정당화보다 심판의 행위를 드러내므로 ‘심판’이 가장 직접적입니다.
theological_decisions:
- issue: רוּחַ의 정체성(성령 여부)
  chosen_reading: 본문은 ‘심판의 영’과 ‘불타게 하는 영’이라는 도구적 표현으로 유지하고, 성령으로 단정하지 않았습니다.
  alternative_readings:
  - 성령의 심판과 성령의 불
  - 하나님의 영의 심판과 불
  rationale: 히브리어는 영/바람/숨의 의미 범위를 가지며, 본문 자체는 인격적 성령을 명시하지 않습니다. 따라서 신학적 명시화보다 원문의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: '해석학적 유보: 본문이 명시하지 않은 성령 식별을 자제함.'
