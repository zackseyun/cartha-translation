source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/נִּשְׁאָ֣ר בְּ/צִיּ֗וֹן וְ/הַ/נּוֹתָר֙ בִּ/יר֣וּשָׁלִַ֔ם קָד֖וֹשׁ יֵאָ֣מֶר ל֑/וֹ כָּל הַ/כָּת֥וּב לַ/חַיִּ֖ים בִּ/ירוּשָׁלִָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
  footnotes:
  - marker: a
    text: Or 'everyone written among the living in Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'recorded for life' may refer to an official register of those spared to live, and it also echoes the broader biblical motif of people being written in God's book of life.
    reason: cross_reference
translation:
  language: ko
  text: 시온에 남아 있는 자와 예루살렘에 남아 있는 자는 거룩하다고 불릴 것입니다—곧 예루살렘에서 생명을 위하여 기록된 모든 사람입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에서 살아 있는 자들 가운데 기록된 모든 사람’.
    reason: alternative_reading
  - marker: b
    text: ‘생명을 위하여 기록된’은 생존하도록 남겨진 이들의 공식 명부를 가리킬 수 있으며, 더 넓게는 성경 전반에 나타나는 하나님의 생명책 모티프를 반향할 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַנִּשְׁאָר / הַנּוֹתָר
  english_pob_choice: whoever remains / whoever is left
  chosen_korean: 남아 있는 자
  alternatives_korean:
  - 남은 사람
  - 남게 된 자
  - 남아 있는 누구든지
  lexicon: HALOT
  rationale: 두 분사형이 시온과 예루살렘의 남은 자를 병렬로 가리키므로, 한국어에서는 두 곳 모두에 자연스러운 공통 표현인 ‘남아 있는 자’로 옮겨 원문의 잔존/남은 자 의미를 살렸습니다.
- source_word: קָדוֹשׁ יֵאָמֶר לֹו
  english_pob_choice: will be called holy
  chosen_korean: 거룩하다고 불릴 것입니다
  alternatives_korean:
  - 거룩하다고 불려질 것입니다
  - 거룩한 자로 불릴 것입니다
  lexicon: HALOT
  rationale: 예언적 수동형의 지정 의미를 살리기 위해 ‘거룩하다고 불리다’로 옮겼고, 형용사 자체의 선언적 효과를 유지했습니다.
- source_word: הַכָּתוּב לַחַיִּים
  english_pob_choice: recorded for life
  chosen_korean: 생명으로 기록된
  alternatives_korean:
  - 생명을 위해 기록된
  - 살아 있을 자로 기록된
  - 살아 있는 자 명부에 기록된
  lexicon: HALOT
  rationale: ‘기록된’은 공식적 장부/명부의 이미지를 살리고, ‘생명으로’는 פְּחַט한 표현을 너무 풀지 않으면서 생명과 관련된 등록이라는 긴장을 보존합니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: 마지막 위치 구문은 한국어에서 ‘예루살렘에서’가 가장 자연스럽고, 앞의 ‘기록된’과도 무리 없이 연결됩니다.
theological_decisions:
- issue: 남은 자의 역사적 생존과 거룩한 자로의 지정을 어떻게 함께 보존할지
  chosen_reading: 본문은 단순한 생존자 집합이 아니라, 남아 있는 자들이 ‘거룩하다’고 불리는 정체성 부여를 함께 말합니다.
  alternative_readings:
  - 역사적 심판 이후의 생존자만 가리키는 읽기
  - 더 후대적인 ‘생명책’ 교리만 전면화하는 읽기
  rationale: 히브리어는 잔존 언어와 거룩함, 그리고 기록된 명부를 함께 묶으므로, 번역도 어느 한쪽으로만 환원하지 않고 긴장을 유지해야 합니다.
  doctrine_reference: Remnant theology; divine naming and register motif
