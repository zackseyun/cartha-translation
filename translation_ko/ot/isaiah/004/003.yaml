  source_fidelity: ‘생명으로 기록된’은 한국어에서 기록의 기준·내용을 나타내는 표현으로 자연스럽지 않으며, 히브리어 לַחַיִּים의 ‘생명을 위하여/생명과 관련하여’라는 열린 관계를 충분히 전달하지 못합니다. 또한 본문의 כָּל(‘모든’)은 앞선 남은 자들을 설명하는 구절에 속하므로, 본문 구조가 드러나게 옮기는 것이 좋습니다.
  naturalness: ‘시온에 남아 있는 자’와 ‘예루살렘에 남아 있는 자’ 및 ‘거룩하다고 불릴 것입니다’는 현대의 격식 있는 성경 문체로 자연스럽습니다. ‘곧’을 사용하여 뒤의 ‘모든 사람’이 앞선 대상을 설명함을 명료하게 했습니다.
