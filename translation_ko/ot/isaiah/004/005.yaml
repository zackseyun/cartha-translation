id: ISA.4.5
reference: Isaiah 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
  footnotes:
  - marker: a
    text: Or 'her convocations.' The Hebrew term can refer to appointed assemblies or gatherings called together.
    reason: lexical_alternative
  - marker: b
    text: Or 'the glow of a blazing fire by night.'
    reason: lexical_alternative
  - marker: c
    text: The imagery recalls the LORD's cloud and fire in the wilderness (for example, Exodus 13:21–22).
    reason: cross_reference
  - marker: d
    text: Or 'a covering'; the Hebrew can also suggest a wedding canopy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 야훼께서 시온 산의 온 터와 그 모임들 위에 낮에는 구름[a]과 연기, 밤에는 불꽃의 밝은 빛[b][c][d]을 창조하실 것입니다. 이는 모든 영광 위에 덮는 천막이 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 소집된 회합들’이라는 뜻일 수 있습니다. 히브리어 용어는 임명된 집회나 불러 모은 모임을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘타오르는 불의 빛’입니다.
    reason: lexical_alternative
  - marker: c
    text: '이 이미지는 광야에서 야훼의 구름과 불을 떠올리게 합니다(예: 출애굽기 13:21–22).'
    reason: cross_reference
  - marker: d
    text: 또는 ‘덮개’이며, 히브리어는 혼인 천막을 암시할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  english_pob_choice: will create
  chosen_korean: 창조하실 것입니다
  alternatives_korean:
  - 만드실 것입니다
  - 지으실 것입니다
  lexicon: HALOT
  rationale: ברא의 강한 ‘창조하다’의 의미를 살리되, 예언적 미래로 자연스럽게 옮겼습니다.
- source_word: מְכוֹן הַר צִיּוֹן
  english_pob_choice: the whole site of Mount Zion
  chosen_korean: 시온 산의 온 터
  alternatives_korean:
  - 시온 산의 자리
  - 시온 산의 거처
  lexicon: HALOT
  rationale: מְכוֹן은 고정된 자리/장소를 가리키므로 ‘터’가 물리적 장소감을 가장 간결하게 살립니다.
- source_word: מִקְרָאֶיהָ
  english_pob_choice: her assemblies
  chosen_korean: 그 모임들
  alternatives_korean:
  - 그 집회들
  - 그 소집된 무리들
  lexicon: HALOT
  rationale: 핵심은 ‘불려 모인 회합’이므로 자연스러운 현대어인 ‘모임들’로 옮겼고, 3인칭 여성 접미사는 시온을 가리킵니다.
- source_word: עָנָן יוֹמָם וְעָשָׁן וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  english_pob_choice: a cloud by day, and smoke, and the brightness of a flaming fire by night
  chosen_korean: 낮에는 구름과 연기, 밤에는 불꽃의 밝은 빛
  alternatives_korean:
  - 낮에는 구름과 연기, 밤에는 타오르는 불의 빛
  - 낮에는 구름, 연기, 그리고 밤에는 타오르는 불꽃의 광명
  lexicon: HALOT
  rationale: 구름·연기·불빛의 병렬을 유지하면서 נֹגַהּ(밝은 빛/광휘)와 לֶהָבָה(불꽃)를 함께 반영했습니다.
- source_word: חֻפָּה
  english_pob_choice: a canopy
  chosen_korean: 덮는 천막
  alternatives_korean:
  - 차양
  - 휘장
  lexicon: HALOT
  rationale: 보호용 덮개라는 기본 뜻을 살리되, 혼인 천막의 뉘앙스를 본문에 과도하게 고정하지 않기 위해 중립적으로 옮겼습니다.
theological_decisions:
- issue: 예언적 העתיד과 하나님의 주도적 행위
  chosen_reading: 하나님이 미래에 새롭게 ‘창조하시는’ 행위로 읽고, 수동화하지 않았습니다.
  alternative_readings:
  - 단순한 장차의 보호를 뜻하는 표현으로 약화
  - 과거형 서술처럼 평면화
  rationale: 본문은 시온 위에 임할 새 보호를 하나님의 창조적 개입으로 제시하므로, 강한 동사와 미래성을 함께 살리는 것이 적절합니다.
  doctrine_reference: 하나님의 주권적 새 창조
- issue: 출애굽적 구름·불 기둥의 암시
  chosen_reading: 본문의 이미지를 살리되, 본문 안에서 해석을 과잉 확정하지 않았습니다.
  alternative_readings:
  - ‘구름 기둥’ ‘불 기둥’으로 명시
  - 교회론적/메시아적 성취를 본문에 직접 삽입
  rationale: 소스는 출애굽의 현현을 강하게 연상시키지만, 번역문은 어휘 자료를 보존하고 독자가 암시를 읽게 두는 편이 더 충실합니다.
  doctrine_reference: 예표를 보존하되 본문에서 과잉해석하지 않음
