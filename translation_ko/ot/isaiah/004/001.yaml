review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘당신의 이름이 우리 위에 불리게 하십시오’는 히브리어의 עָלֵינוּ를 기계적으로 옮긴 표현이라 현대 표준 한국어에서 부자연스럽습니다. ‘우리가 당신의 이름으로 불리게 해 주십시오’는 이름이 그들 위에 불린다는 관용적 의미를 자연스럽게 보존하며, 결혼을 본문에 명시적으로 보태지 않습니다.
  naturalness: 합쇼체와 서술은 전반적으로 적절합니다. 그러나 ‘우리 위에 불리게’는 한국어 관용에 맞지 않아 본문에서는 자연화하고, 직역은 주석으로 보존하는 것이 좋습니다. 각 주석 표지는 해당 어구 바로 뒤에 두는 편이 독자의 연결을 분명하게 합니다.
  terminology: ‘붙들고’, ‘빵’, ‘옷’, ‘수치’는 적절합니다. ‘수치’는 חֶרְפָּה의 사회적 불명예라는 넓은 의미를 유지합니다. ‘당신의 이름으로 불리게’는 사회적 소속의 함의를 유지하되 ‘아내로 삼다’처럼 해석을 확정하지 않습니다.
