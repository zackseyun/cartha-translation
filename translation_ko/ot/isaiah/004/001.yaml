    issue: ‘당신의 이름이 우리 위에 불리게 하십시오’가 현대 한국어에서 비관용적이고 의미가 즉시 전달되지 않습니다.
    rationale: 히브리어 ‘이름이 우리 위에 불리다’의 직역은 주석에서 보존할 수 있으나, 본문은 ‘우리가 당신의 이름으로 불리게 해 주십시오’로 옮겨야 자연스럽습니다. 이는 결혼·법적 귀속이라는 함의를 과도하게 명시하지 않습니다.
