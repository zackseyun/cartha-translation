id: ISA.4.1
reference: Isaiah 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
  footnotes:
  - marker: a
    text: Or, “let us be called by your name,” likely implying marriage or legal/social attachment to the man.
    reason: lexical_alternative
  - marker: b
    text: “Reproach” refers to social disgrace or shame; in context, likely the stigma of lacking a husband's name and status after the devastation described previously.
    reason: cultural_note
translation:
  language: ko
  text: 그날에 일곱 여자가 한 남자를 붙들고 말할 것입니다. “우리는 우리 빵을 먹고 우리 옷을 입겠습니다. 다만 우리가 당신의 이름으로 불리게 해 주십시오.[a] 우리의 수치를 거두어 주십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 이름이 우리 위에 불리게 하십시오’입니다. 문맥상 그 남자의 이름 아래 결혼하거나 법적·사회적으로 소속되는 것을 암시할 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘수치’는 단순한 내면 감정보다 사회적 불명예를 가리킵니다. 문맥상 황폐 뒤에 남편의 이름과 지위가 없는 데 따르는 낙인을 가리킬 가능성이 있으나, 본문은 그 원인을 명시적으로 한정하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  english_pob_choice: will take hold of
  chosen_korean: 붙들고
  alternatives_korean:
  - 잡고
  - 붙잡고
  lexicon: HALOT
  rationale: חזק의 히필은 단순 접촉보다 간절하고 단호한 붙잡음을 나타내므로, ‘붙들다’가 긴박한 행동을 잘 살립니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언서의 상투적 시간표현을 자연스러운 현대 한국어로 옮기되, 종말론적·심판적 뉘앙스를 유지했습니다.
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  english_pob_choice: let your name be called over us
  chosen_korean: 당신의 이름이 우리 위에 불리게 하십시오
  alternatives_korean:
  - 우리가 당신의 이름으로 불리게 하십시오
  - 당신의 이름이 우리에게 불리게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘이름이 … 위에 불리다’라는 관용구를 보존해, 결혼 또는 법적·사회적 귀속의 함의를 직접 단정하지 않도록 했습니다.
- source_word: אֱסֹף חֶרְפָּתֵנוּ
  english_pob_choice: Take away our reproach
  chosen_korean: 우리의 수치를 거두어 주십시오
  alternatives_korean:
  - 우리의 치욕을 거두어 주십시오
  - 우리의 수모를 없애 주십시오
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 내면 감정보다 사회적 수치와 불명예를 가리키므로, ‘수치’로 옮겨 공적 disgrace의 성격을 살렸습니다.
theological_decisions:
- issue: ‘당신의 이름이 우리 위에 불리게 하십시오’의 함의
  chosen_reading: 주요 본문에서는 히브리어 관용구를 그대로 살리고, 결혼을 명시적으로 덧붙이지 않았습니다.
  alternative_readings:
  - 우리를 당신의 이름으로 불러 주십시오
  - 우리를 아내로 삼아 주십시오
  rationale: 본문은 남자의 이름 아래로 들어가는 사회적 소속을 암시하지만, 표준 동사로 ‘결혼하다’를 쓰지는 않으므로 번역이 해석을 과도하게 앞서지 않도록 했습니다.
  doctrine_reference: 번역 원칙 §3, §5
- issue: ‘수치/치욕’의 의미 범위
  chosen_reading: 공적 불명예를 뜻하는 ‘수치’로 옮기되, 원인 자체는 본문보다 좁히지 않았습니다.
  alternative_readings:
  - 불명예
  - 치욕
  rationale: 문맥상 남편 부재와 사회적 붕괴에서 오는 낙인을 가리키지만, 본문은 그 사유를 하나로 한정하지 않으므로 넓은 의미를 유지했습니다.
  doctrine_reference: 번역 원칙 §3
