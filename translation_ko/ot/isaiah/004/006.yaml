base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
  footnotes:
  - marker: a
    text: Or 'booth' for 'shelter' (סֻכָּה), emphasizing a temporary covered structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'from scorching heat.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from torrent' or 'from downpour' for 'from storm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 낮에는 더위를 피할 그늘이, 폭풍과 비를 피할 피난처와 숨는 곳이 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초막’으로도 옮길 수 있는데, 이는 임시로 덮인 구조물을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더위’는 ‘뜨거운 열기’ 또는 ‘작열하는 더위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘폭풍’은 ‘소나기’나 ‘폭우’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  english_pob_choice: shelter
  chosen_korean: 그늘
  alternatives_korean:
  - 초막
  - 울타리형 쉼터
  - 피난처
  lexicon: HALOT
  rationale: 본문의 기능이 햇볕과 더위를 피하게 하는 임시 보호막이므로, 한국어에서는 자연스럽게 ‘그늘’로 옮기되, 뒤에 별도로 ‘피난처’와 ‘숨는 곳’을 두어 보호의 중복을 살렸습니다.
- source_word: תִּהְיֶה
  english_pob_choice: there will be
  chosen_korean: 있을 것입니다
  alternatives_korean:
  - 되겠습니다
  - 있겠습니다
  lexicon: HALOT
  rationale: 히브리어의 단순 미래 서술을 현대 한국어의 존재 표현으로 풀어, 예언적 진술의 자연스러운 문장성을 유지했습니다.
- source_word: לְצֵל / יוֹמָם
  english_pob_choice: for shade by day
  chosen_korean: 낮에는 더위를 피할 그늘
  alternatives_korean:
  - 낮 동안의 그늘
  - 낮에 드리운 그늘
  lexicon: HALOT
  rationale: ‘그늘’만으로는 기능이 덜 드러나므로, POB의 ‘from heat’ 취지를 살려 ‘더위를 피할’을 덧붙여 보호 목적을 분명히 했습니다.
- source_word: מֵחֹרֶב
  english_pob_choice: from heat
  chosen_korean: 더위를 피할
  alternatives_korean:
  - 뜨거운 열기를 피할
  - 폭염을 피할
  lexicon: HALOT
  rationale: 문맥상 농경적 ‘가뭄’보다 날씨의 열기/더위가 핵심이므로, POB처럼 ‘heat’로 이해하여 자연스러운 한국어로 옮겼습니다.
- source_word: מַחְסֶה / מִסְתּוֹר
  english_pob_choice: refuge / hiding place
  chosen_korean: 피난처와 숨는 곳
  alternatives_korean:
  - 피신처와 은신처
  - 보호처와 감추는 곳
  lexicon: HALOT
  rationale: 두 명사는 모두 보호를 뜻하지만 뉘앙스가 다르므로, ‘피난처’와 ‘숨는 곳’으로 구분해 POB의 중복 없는 이중 표현을 살렸습니다.
- source_word: זֶרֶם / מָטָר
  english_pob_choice: storm / rain
  chosen_korean: 폭풍과 비
  alternatives_korean:
  - 소나기와 비
  - 홍수와 비
  lexicon: HALOT
  rationale: POB가 ‘storm / rain’으로 구별한 폭력적 날씨 이미지를 유지하기 위해, 보다 일반적인 ‘비’와 짝지어 ‘폭풍’으로 번역했습니다.
theological_decisions:
- issue: 보호 이미지의 구체적 신학화 여부
  chosen_reading: 본문의 시적 보호 이미지를 그대로 살리고, 그 보호가 무엇을 가리키는지 본문 안에서 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 메시아적 보호
  - 시온의 피난처
  - 하나님의 임재에 대한 직접적 언급
  rationale: 히브리어는 날씨로부터 지켜 주는 구체적 피난의 이미지를 말할 뿐이므로, 번역에서는 해석을 앞서지 않고 본문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
