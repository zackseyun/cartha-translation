  rationale: 본문의 기능이 햇볕과 더위를 피하게 하는 임시 보호막이므로, 한국어에서는 자연스럽게 ‘그늘’로 옮기되, 뒤에 별도로 ‘피난처’와 ‘숨는 곳’을 두어 보호의 중복을 살렸습니다.
