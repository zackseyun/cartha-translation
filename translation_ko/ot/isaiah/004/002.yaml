  source_fidelity: 히브리어의 병렬 구조와 수여 대상(‘이스라엘의 살아남은 자들’)은 대체로 충실히 반영되었습니다. 다만 현행 ‘...자들에게 그러할 것입니다’의 ‘그러하다’는 원문에 없는 지시 내용을 덧붙이고, 무엇이 무엇이 되는지 불분명하게 만듭니다.
