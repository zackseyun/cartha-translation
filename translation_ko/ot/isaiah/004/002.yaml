- from: 그 날에 야훼의 싹은 아름다움과 영광이 되고, 땅의 열매는 위엄과 찬란함이 되어, 이스라엘의 살아남은 자들에게 그러할 것입니다.[a][b]
  to: 그 날에 야훼의 싹은 이스라엘의 살아남은 자들에게 아름다움과 영광이 되고, 땅의 열매는 그들에게 위엄과 찬란함이 될 것입니다.[a][b]
  rationale: 수혜자를 첫 병렬 항에 명시하고 둘째 항에서는 ‘그들에게’로 받아, 히브리어의 문장 끝 수여구가 두 항 모두에 걸리는 관계를 자연스러운 한국어로 재현했습니다. 원문에 없는 ‘그러하다’를 제거했습니다. 각주 a는 본문의 ‘싹’이 지닌 농경적 재생과 후대 ‘가지’ 모티프의 가능한 공명을 보존하되 어느 한 해석으로 고정하지 않도록 다듬었습니다.
