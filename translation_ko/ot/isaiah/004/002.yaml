id: ISA.4.2
reference: Isaiah 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
  footnotes:
  - marker: a
    text: Or 'the growth of the LORD' or 'what the LORD causes to sprout.' The Hebrew may evoke both renewed fertility in the land and the later prophetic image of the LORD's 'Branch.'
    reason: alternative_reading
  - marker: b
    text: Or 'the remnant of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 야훼의 싹은 아름다움과 영광이 되고, 땅의 열매는 위엄과 찬란함이 되어, 이스라엘의 살아남은 자들에게 그러할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 성장’ 또는 ‘여호와께서 돋게 하시는 것’. 히브리어는 새 생장과 후대의 예언적 ‘가지’ 이미지를 함께 떠올리게 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘이스라엘의 남은 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그때
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간 표현으로, 한국어에서도 자연스럽고 종말론적 울림을 유지하는 표현입니다.
- source_word: צֶמַח יְהוָה
  english_pob_choice: the branch of Yahweh
  chosen_korean: 야훼의 싹
  alternatives_korean:
  - 야훼의 가지
  - 야훼의 가지순
  lexicon: HALOT
  rationale: צֶמַח은 문자적으로 ‘싹/움돋음’이 기본 뜻이어서, 농경적 재생 이미지와 후대의 ‘가지’ 메시아 표상을 모두 열어 두도록 ‘싹’으로 옮겼습니다.
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  english_pob_choice: for the survivors of Israel
  chosen_korean: 이스라엘의 살아남은 자들
  alternatives_korean:
  - 이스라엘의 남은 자들
  - 이스라엘의 피한 자들
  lexicon: HALOT
  rationale: פְלֵיטָה는 ‘도망쳐 살아남은 자들/생존자들’의 뜻이 분명하므로, 전통적 신학어인 ‘남은 자들’을 보조 의미로 열어 두되 본문은 현대 독자에게 더 투명한 표현을 택했습니다.
theological_decisions:
- issue: צֶמַח יְהוָה의 메시아적 가능성과 농경적 회복 이미지를 어떻게 유지할 것인가
  chosen_reading: ‘야훼의 싹’으로 두어 식물 은유를 살리되, 고유명사식 메시아 해석으로 고정하지 않았습니다.
  alternative_readings:
  - 야훼의 가지
  - 야훼가 돋게 하시는 것
  rationale: 본문은 땅의 열매와 평행을 이루므로 우선은 회복의 생장 이미지를 전면에 두는 것이 자연스럽습니다. 동시에 이 표현은 후대 예언서의 ‘가지’ 모티프와도 연결될 수 있으므로, 해석을 단정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
