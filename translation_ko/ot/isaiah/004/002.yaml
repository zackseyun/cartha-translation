  terminology: ‘야훼’, ‘싹’, ‘아름다움’, ‘영광’, ‘위엄’, ‘찬란함’, ‘살아남은 자들’은 원문의 어휘 범위와 시적 병렬을 잘 살립니다. 각주 a에서는 본문의 신명 표기와 일치하도록 ‘여호와’를 ‘야훼’로 통일하고, ‘성장’보다 자연스러운 ‘돋아남/돋게 하시는 것’을 사용해야 합니다.
