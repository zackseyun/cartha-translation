    rationale: ‘주겠습니다’는 심판의 보응에 부적합한 수혜적 뉘앙스를 낼 수 있고, ‘도로 헤아리다’도 자연스러운 결합이 아닙니다. ‘그들의 옛 행위를 그들의 품에 재어 갚겠다’는 측량과 보응의 이미지를 보존합니다.
