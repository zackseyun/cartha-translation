revisions:
- from: 너희의 죄악들과 너희 조상들의 죄악들을 함께, 야훼께서 말씀하십니다. 그들이 산들 위에서 분향하고 언덕들 위에서 나를 모욕하였으니, 나는 그들의 이전 행위를 그들의 품에 도로 헤아려 주겠습니다.[a][b]
  to: “너희의 죄악과 너희 조상들의 죄악을 함께 갚겠다.” 야훼께서 말씀하십니다. “그들이 산들 위에서 분향하고 언덕들 위에서 나를 모욕하였으니, 내가 그들의 옛 행위[a]를 그들의 품에[b] 재어 갚겠다.”
  rationale: 앞 절에서 이어지는 히브리어의 생략을 한국어 문장으로 자연스럽게 보충하되, 현재 세대와 조상들의 죄악을 함께 심판한다는 본문의 긴장은 해소하거나 교리적으로 설명하지 않았습니다. 마지막 절은 ‘옛 행위’를 보응의 대상로 유지하고, ‘재어 갚겠다’로 מדד와 ‘품’의 보응 관용구를 함께 보존했습니다. 각주 표지도 해당 본문어 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:34Z'
