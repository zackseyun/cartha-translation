reference: Isaiah 65:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲ֠וֺנֹתֵי/כֶם וַ/עֲוֺנֹ֨ת אֲבוֹתֵי/כֶ֤ם יַחְדָּו֙ אָמַ֣ר יְהוָ֔ה אֲשֶׁ֤ר קִטְּרוּ֙ עַל הֶ֣/הָרִ֔ים וְ/עַל הַ/גְּבָע֖וֹת חֵרְפ֑וּ/נִי וּ/מַדֹּתִ֧י פְעֻלָּתָ֛/ם רִֽאשֹׁנָ֖ה על חֵיקָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
  footnotes:
  - marker: a
    text: Or 'their recompense' for 'their deed' (פְעֻלָּתָם); the Hebrew term can denote either an act/work or its due payment, though the surrounding idiom already expresses repayment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into their bosom'; this Hebrew idiom means to repay directly and personally.
    reason: cultural_note
translation:
  language: ko
  text: “너희의 죄악과 너희 조상들의 죄악을 함께 갚겠다.” 야훼께서 말씀하십니다. “그들이 산들 위에서 분향하고 언덕들 위에서 나를 모욕하였으니, 내가 그들의 옛 행위[a]를 그들의 품에[b] 재어 갚겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְעֻלָּה는 ‘행위/일’ 또는 그에 대한 ‘보응/삯’을 뜻할 수 있습니다. 여기서는 먼저 행한 일을 가리키는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 품에’입니다. 이 히브리어 관용구는 보응이 당사자에게 직접 돌아감을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם / וַעֲוֺנֹת אֲבוֹתֵיכֶם
  english_pob_choice: your iniquities / and the iniquities of your fathers
  chosen_korean: 너희의 죄악들 / 너희 조상들의 죄악들
  alternatives_korean:
  - 너희의 불의들 / 너희 아버지들의 불의들
  - 너희의 죄들 / 너희 조상들의 죄들
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 도덕적 그릇됨과 그 책임의 무게를 함께 지니므로, ‘죄악들’이 본문의 강도를 더 잘 살립니다. ‘조상들’은 혈통적 선조를 가리키는 히브리어의 역사적 뉘앙스를 유지합니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 다 함께
  - 같이
  lexicon: HALOT
  rationale: 현재 세대의 죄악과 조상들의 죄악을 한 묶음으로 두는 강조를 한국어에서는 문장 중간의 ‘함께’로 자연스럽게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신적 칭호가 아니라 언약의 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: קִטְּרוּ עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  english_pob_choice: they burned incense on the mountains and on the hills
  chosen_korean: 그들이 산들 위에서 분향하고 언덕들 위에서
  alternatives_korean:
  - 그들이 산 위에서 향을 피우고 언덕 위에서
  - 그들이 높은 곳에서 분향하고
  lexicon: HALOT
  rationale: קטר는 제의적 ‘분향’이 가장 직접적이며, 히브리어의 평행구조를 따라 ‘산들 위에서 … 언덕들 위에서’로 보존했습니다.
- source_word: חֵרְפוּנִי
  english_pob_choice: reproached me
  chosen_korean: 나를 모욕하였으니
  alternatives_korean:
  - 나를 꾸짖었으니
  - 나를 비방하였으니
  - 나를 욕되게 하였으니
  lexicon: HALOT
  rationale: חרף는 단순한 꾸짖음보다 강한 수치 부여와 조롱의 뜻을 가지므로, 관계적·언약적 모독을 드러내는 ‘모욕하다’가 적절합니다.
- source_word: עַל חֵיקָם
  english_pob_choice: into their lap
  chosen_korean: 그들의 품에 도로 헤아려 주겠습니다
  alternatives_korean:
  - 그들의 품에 갚겠습니다
  - 그들의 가슴에 돌려보내겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 직접적이고 개인적인 보응을 뜻하므로, POB의 ‘measure’의 이미지를 살리면서도 한국어에서 자연스럽게 이해되는 ‘품에 도로 헤아리다’로 옮겼습니다.
- source_word: פְעֻלָּתָם
  english_pob_choice: their former deed
  chosen_korean: 그들의 이전 행위
  alternatives_korean:
  - 그들의 옛 행위
  - 그들의 소행
  lexicon: HALOT
  rationale: פְעֻלָּה는 ‘일/행위’로도, 보응의 대상이 되는 ‘소행’으로도 쓰일 수 있으나, 본문에서는 이미 ‘그들의 품에’라는 보응 관용구가 있으므로 ‘이전 행위’로 절제해 옮겼습니다.
theological_decisions:
- issue: 조상들의 죄와 현재 세대의 죄를 함께 언급하는 방식
  chosen_reading: 본문의 긴장—현재 세대의 죄악과 조상들의 죄악이 함께 언급되며 심판의 근거가 된다는 점—을 그대로 보존했습니다.
  alternative_readings:
  - 조상들의 죄 때문에 후손이 단독으로 벌을 받는다는 식으로 완화하여 읽는 방법
  - 현재 세대만의 책임으로 제한하는 방법
  rationale: 히브리어는 두 죄악을 병렬로 놓고 있으므로, 번역도 그 병치를 유지해 본문이 말하는 책임의 무게를 흐리지 않도록 했습니다.
  doctrine_reference: 본문의 긴장 보존
- issue: ‘품에’라는 보응 관용구의 처리
  chosen_reading: 직접적이고 개인적인 보응을 뜻하는 관용구로 이해해, ‘그들의 품에 도로 헤아려 주겠습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘그들의 품에 갚겠습니다’처럼 보다 평이하게 처리하는 방법
  - 관용구를 풀어 ‘직접 갚겠습니다’로 의역하는 방법
  rationale: 헤아리다/측량하다의 이미지를 유지하면 원문의 ‘measure’와 ‘bosom/lap’의 이중성이 살아나므로, 단순한 ‘갚다’보다 본문의 감각이 더 잘 드러납니다.
  doctrine_reference: 원문 이미지 보존
