  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 첫 문장은 히브리어가 앞 절에서 이어 받는 보응의 목적어를 제시한다는 점을 한국어에서 충분히 드러내지 못해, ‘야훼께서 말씀하십니다’의 내용이 문법적으로 비어 있습니다. 문맥상 보충되는 ‘갚겠다’를 명시하는 것이 안전합니다. 또한 마지막의 ‘헤아려 주겠습니다’는 심판·보응 문맥에서 수혜를 암시할 수 있는 ‘주다’를 피하고, מדד의 ‘재다’와 보응의 뜻을 함께 나타내야 합니다.
  naturalness: ‘죄악들’, ‘이전 행위’, ‘품에 도로 헤아려 주겠습니다’는 현대 표준 한국어 성경 문체로 다소 부자연스럽습니다. 집합적으로 쓰이는 ‘죄악’, 더 자연스러운 ‘옛 행위’, 그리고 ‘재어 갚겠다’를 사용하면 합쇼체의 엄정한 문체를 유지하면서 뜻이 분명해집니다.
  terminology: ‘야훼’, ‘분향하다’, ‘모욕하다’, ‘품’은 적절합니다. עָוֹן의 책임 있는 악행이라는 무게는 ‘죄악’으로 유지할 수 있습니다. פְּעֻלָּתָם은 보응 자체로 단정하지 않고 ‘옛 행위’로 옮기되, 마지막 동사구에서 보응의 의미를 드러냅니다.
