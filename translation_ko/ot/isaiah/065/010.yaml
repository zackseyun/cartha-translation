  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 העתיד적 용법을 살려 단순 상태보다 변화의 의미를 드러냈습니다.
- source_word: הַשָּׁרוֹן
  english_pob_choice: Sharon
