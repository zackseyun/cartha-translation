  lexicon: HALOT
  rationale: 고유 지명은 음역을 따르되, 한국어 성경에서 널리 쓰이는 형태인 사론을 유지했습니다.
- source_word: לִנְוֵה צֹאן
  english_pob_choice: a pasture for flocks
  chosen_korean: 양 떼의 목장
  alternatives_korean:
  - 양 떼의 초지
  - 양 떼의 거처
  - 양 떼의 풀밭
  lexicon: HALOT
  rationale: נוה의 목초지/거처 의미를 살리면서 현대 한국어에서 자연스러운 ‘목장’으로 옮겨, 양 떼가 머무는 목양 공간을 분명히 했습니다.
- source_word: לְרֵבֶץ בָּקָר
  english_pob_choice: a resting place for cattle
  chosen_korean: 소의 눕는 곳
  alternatives_korean:
  - 소의 쉼터
  - 소의 쉬는 곳
  - 소의 안식처
  lexicon: HALOT
  rationale: רבץ의 ‘엎드리다/눕다’ 뉘앙스를 살려 단순한 초지보다 ‘눕는 곳’으로 옮겼습니다. ‘소’는 בָּקָר의 보통명사적 의미를 반영합니다.
theological_decisions:
- issue: ‘나를 찾은’의 신학적 범위
  chosen_reading: 하나님께서 자신을 찾은 백성을 자기 백성으로 인정하시는 표지로 유지했습니다.
  alternative_readings:
  - 이스라엘의 남은 자로 한정
  - 회복된 이스라엘 전체로 확장
  rationale: 본문은 회복의 대상이 ‘나를 찾은 내 백성’임을 말할 뿐, 더 좁은 교리 체계를 명시하지 않으므로 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문이 명시하지 않은 구속사적 세분화를 덧씌우지 않음
