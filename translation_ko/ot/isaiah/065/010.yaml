id: ISA.65.10
reference: Isaiah 65:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
  footnotes:
  - marker: a
    text: Or 'a habitation of sheep' / 'a grazing place for sheep.'
    reason: lexical_alternative
  - marker: b
    text: The Valley of Achor is associated with earlier judgment (Josh 7:24–26); here it is portrayed as a place of restoration and safety.
    reason: cross_reference
translation:
  language: ko
  text: 사론은 양 떼의 목장이 되고, 아골 골짜기는 소의 눕는 곳이 될 것입니다. 이는 나를 찾은 내 백성을 위한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아골 골짜기는 여호수아 7:24-26의 심판 기억과 연결되지만, 여기서는 회복과 안전의 장소로 제시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: will become
  chosen_korean: -이 될 것입니다
  alternatives_korean:
  - -이 됩니다
  - -이 되리라
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 העתיד적 용법을 살려 단순 상태보다 변화의 의미를 드러냈습니다.
- source_word: הַשָּׁרוֹן
  english_pob_choice: Sharon
  chosen_korean: 사론
  alternatives_korean:
  - 사론 평야
  - 사론 들
  lexicon: HALOT
  rationale: 고유 지명은 음역을 따르되, 한국어 성경에서 널리 쓰이는 형태인 사론을 유지했습니다.
- source_word: לִנְוֵה צֹאן
  english_pob_choice: a pasture for flocks
  chosen_korean: 양 떼의 목장
  alternatives_korean:
  - 양 떼의 초지
  - 양 떼의 거처
  - 양 떼의 풀밭
  lexicon: HALOT
  rationale: נוה의 목초지/거처 의미를 살리면서 현대 한국어에서 자연스러운 ‘목장’으로 옮겨, 양 떼가 머무는 목양 공간을 분명히 했습니다.
- source_word: לְרֵבֶץ בָּקָר
  english_pob_choice: a resting place for cattle
  chosen_korean: 소의 눕는 곳
  alternatives_korean:
  - 소의 쉼터
  - 소의 쉬는 곳
  - 소의 안식처
  lexicon: HALOT
  rationale: רבץ의 ‘엎드리다/눕다’ 뉘앙스를 살려 단순한 초지보다 ‘눕는 곳’으로 옮겼습니다. ‘소’는 בָּקָר의 보통명사적 의미를 반영합니다.
theological_decisions:
- issue: ‘나를 찾은’의 신학적 범위
  chosen_reading: 하나님께서 자신을 찾은 백성을 자기 백성으로 인정하시는 표지로 유지했습니다.
  alternative_readings:
  - 이스라엘의 남은 자로 한정
  - 회복된 이스라엘 전체로 확장
  rationale: 본문은 회복의 대상이 ‘나를 찾은 내 백성’임을 말할 뿐, 더 좁은 교리 체계를 명시하지 않으므로 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문이 명시하지 않은 구속사적 세분화를 덧씌우지 않음
