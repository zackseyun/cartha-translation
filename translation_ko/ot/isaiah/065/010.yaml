  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
  footnotes:
  - marker: a
    text: Or 'a habitation of sheep' / 'a grazing place for sheep.'
    reason: lexical_alternative
  - marker: b
    text: The Valley of Achor is associated with earlier judgment (Josh 7:24–26); here it is portrayed as a place of restoration and safety.
    reason: cross_reference
translation:
  language: ko
  text: 사론은 양 떼의 목초지가 되고[a], 아골 골짜기는 소가 눕는 곳이 될 것입니다[b]. 이 모든 것은 나를 찾은 내 백성을 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양 떼의 거처’, ‘양 떼가 풀을 뜯는 곳’.
    reason: lexical_alternative
  - marker: b
    text: 아골 골짜기는 여호수아 7:24–26에 나오는 심판과 관련되어 있으나, 여기서는 회복과 안전의 장소로 제시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: will become
  chosen_korean: -이 될 것입니다
