id: ISA.65.6
reference: Isaiah 65:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה כְתוּבָ֖ה לְ/פָנָ֑/י לֹ֤א אֶחֱשֶׂה֙ כִּ֣י אִם שִׁלַּ֔מְתִּי וְ/שִׁלַּמְתִּ֖י עַל חֵיקָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
  footnotes:
  - marker: a
    text: Or 'it stands written before me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'into their bosom.' The Hebrew image is of repayment returned directly to the person.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내 앞에 기록되어 있습니다. 나는 침묵하지 않을 것이며, 반드시 갚을 것입니다. 참으로, 그들의 품속에 갚을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에 기록된 상태로 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 품으로.’ 히브리어 이미지는 보응이 곧바로 그 사람에게 되돌아감을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 선언적 도입어로서 현대 한국어에서는 ‘보십시오’가 공손하면서도 직접적인 호소를 잘 살립니다.
- source_word: כְתוּבָה לְפָנַי
  english_pob_choice: it is written before me
  chosen_korean: 내 앞에 기록되어 있습니다
  alternatives_korean:
  - 내 앞에 적혀 있습니다
  - 내 앞에 기록된 것이 있습니다
  lexicon: HALOT
  rationale: ‘written before me’의 지속적이고 공식적인 기록 이미지를 살리되, 한국어에서는 ‘기록되어 있습니다’가 가장 자연스럽고 문어적입니다.
- source_word: לֹא אֶחֱשֶׂה
  english_pob_choice: I will not keep silent
  chosen_korean: 나는 침묵하지 않을 것이며
  alternatives_korean:
  - 나는 잠잠하지 않을 것이며
  - 나는 조용히 있지 않을 것이며
  lexicon: HALOT
  rationale: חשה의 핵심 의미인 ‘침묵하다/잠잠하다’를 직역하되, 예언적 선언의 단호함을 살려 ‘침묵하지 않을 것이며’로 옮겼습니다.
- source_word: שִׁלַּמְתִּי / וְשִׁלַּמְתִּי עַל חֵיקָם
  english_pob_choice: I will repay / indeed, I will repay into their lap
  chosen_korean: 반드시 갚을 것입니다. 참으로, 그들의 품속에 갚을 것입니다
  alternatives_korean:
  - 반드시 보상할 것입니다. 참으로, 그들의 품속에 보상할 것입니다
  - 반드시 갚아 주겠습니다. 참으로, 그들의 품에 갚을 것입니다
  lexicon: HALOT
  rationale: שׁלם은 단순한 ‘지불’보다 न्याय적 ‘갚음/보상’의 의미가 강하므로 ‘갚다’가 가장 직접적입니다. חֵיק은 ‘가슴/품’의 이미지인데, 보응이 곧바로 당사자에게 되돌아간다는 점을 살려 ‘품속’으로 옮겼습니다.
theological_decisions:
- issue: 두 번 반복된 보응 선언의 의미
  chosen_reading: 확정된 미래의 न्याय적 보응 선언으로 읽습니다.
  alternative_readings:
  - 이미 완료된 보응의 선언
  - 일반적인 원칙 진술
  rationale: 예언 문맥에서 완료형은 निश्चित적 미래를 나타낼 수 있으므로, 하나님이 장차 반드시 갚으신다는 선언으로 옮기는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘품속’ 이미지의 해석 범위
  chosen_reading: 보응이 당사자에게 직접 되돌아가는 न्याय적 비유로 유지합니다.
  alternative_readings:
  - 더 강한 ‘형벌’로 구체화
  - ‘보복’으로 좁혀 번역
  rationale: 히브리어는 보응의 방식은 분명히 하지만 그 내용을 과도하게 규정하지 않으므로, ‘갚다’와 ‘품속’의 이미지를 유지해 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
