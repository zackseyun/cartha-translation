  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
  footnotes:
  - marker: a
    text: Or, more literally, 'my chosen ones will wear out/use up the work of their hands,' that is, they will enjoy it for its full duration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 집을 지어도 다른 사람이 들어가 살지 못하고, 심을지라도 다른 사람이 먹지 못합니다. 내 백성의 날들은 나무의 날들과 같을 것이며, 내 택한 자들은 자기 손으로 한 일을 오래 누릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 택한 자들은 자기 손으로 한 일을 닳게/다 써 버릴 것입니다’입니다. 곧, 그것을 오래도록 온전히 누린다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִבְנוּ וְאַחֵר יֵשֵׁב
  english_pob_choice: They will not build and another inhabit
  chosen_korean: 그들은 집을 지어도 다른 사람이 들어가 살지 못하고
  alternatives_korean:
  - 그들은 집을 짓고 다른 사람이 거주하지 않으며
  - 그들은 집을 지어도 다른 사람이 거하지 못하고
  lexicon: HALOT
  rationale: בנה-ישב의 대조를 살리되, 한국어에서는 ‘들어가 살다’가 건축 후 점유를 가장 자연스럽게 드러냅니다.
- source_word: לֹא יִטְּעוּ וְאַחֵר יֹאכֵל
  english_pob_choice: they will not plant and another eat
  chosen_korean: 심을지라도 다른 사람이 먹지 못합니다
  alternatives_korean:
  - 심어도 다른 사람이 먹지 못하고
  - 심을지라도 다른 사람이 거두어 먹지 못합니다
  lexicon: HALOT
  rationale: נטע-אכל의 수확 역전을 유지하면서, 한국어에서는 ‘먹다’가 심은 것의 열매를 타인이 취하는 의미를 자연스럽게 전달합니다.
- source_word: כִּי כִימֵי הָעֵץ
  english_pob_choice: For the days of my people will be like the days of a tree
  chosen_korean: 내 백성의 날들은 나무의 날들과 같을 것이며
  alternatives_korean:
  - 내 백성의 날들은 나무처럼 길 것이며
  - 내 백성의 날들은 한 그루 나무의 날들과 같을 것이며
  lexicon: HALOT
  rationale: 직역적 비교를 살리되, ‘나무의 날들’이라는 히브리어 비유를 한국어에서 무리 없이 읽히도록 조정했습니다.
- source_word: יְבַלּוּ בְחִירָי
  english_pob_choice: my chosen ones will wear out the work of their hands
  chosen_korean: 내 택한 자들은 자기 손으로 한 일을 오래 누릴 것입니다
  alternatives_korean:
  - 내 택한 자들은 자기 손으로 한 일을 오래 사용할 것입니다
  - 내 택한 자들은 자기 손으로 한 일을 다 써 버릴 것입니다
  lexicon: HALOT
  rationale: יבלּוּ의 문자적 ‘닳게 하다/마모시키다’보다, 문맥상 장수와 안정 속에서 수고의 열매를 끝까지 누린다는 뜻을 살렸습니다. POB의 최종 영어도 같은 방향의 의미를 유지합니다.
theological_decisions:
- issue: יְבַלּוּ의 문맥상 의미
  chosen_reading: ‘오래 누릴 것입니다’로 옮겨, 소유가 빼앗기지 않고 온전히 향유된다는 축복의 의미를 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘닳게 할 것입니다’
  - ‘오래 사용할 것입니다’
  rationale: 이 절은 종말론적 회복의 약속이므로, 단순한 마모 이미지를 한국어에서 그대로 두면 의미가 오해될 수 있습니다. ‘오래 누리다’는 원문의 지속성·안전성을 전달합니다.
  doctrine_reference: 'Translation philosophy #1, #5, #6'
