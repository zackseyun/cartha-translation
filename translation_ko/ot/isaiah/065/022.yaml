revisions:
- from: 그들은 집을 지어도 다른 사람이 들어가 살지 못하고, 심을지라도 다른 사람이 먹지 못합니다. 내 백성의 날들은 나무의 날들과 같을 것이며, 내 택한 자들은 자기 손으로 한 일을 오래 누릴 것입니다.[a]
  to: 그들은 집을 지어 다른 사람이 살지 않으며, 심어 다른 사람이 먹지 않을 것입니다. 내 백성이 사는 날은 나무의 수명과 같을 것이며, 내가 택한 이들은 자기 손으로 한 일을 오래 누릴 것입니다.[a]
  rationale: 문맥상 미래의 안전과 소유 보장을 나타내는 두 부정절을 한국어의 자연스러운 병렬 부정 미래로 고쳤습니다. ‘나무의 날들’은 장수를 가리키는 비유를 명료하게 하는 ‘나무의 수명’으로 다듬었습니다. 마지막 절의 해석적 본문 번역은 유지하되, 각주에서 יְבַלּוּ의 문자적 ‘닳도록 사용하다’ 이미지를 더 정확하고 중립적으로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:36Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 축복의 의미는 대체로 충실합니다. 다만 ‘지어도/심을지라도 ... 못하고/못합니다’는 타인이 단지 능력이 없다는 뜻으로도 읽힐 수 있어, 원문의 ‘그런 일이 일어나지 않을 것’이라는 약속을 더 자연스럽고 정확하게 옮길 필요가 있습니다. יְבַלּוּ의 문맥상 의미를 ‘오래 누리다’로 풀어낸 것은 타당하며, 각주에서 문자적 이미지를 보완하는 방식도 적절합니다.
  naturalness: ‘내 백성의 날들은 나무의 날들과’은 직역투로 다소 부자연스럽지만 이해 가능합니다. ‘사는 날’과 ‘수명’을 사용하면 현대 표준어에서 더 자연스럽게 장수의 비유를 전달하면서도 원문의 비교를 유지할 수 있습니다. 또한 두 앞 절을 ‘지어 … 살지 않으며, 심어 … 먹지 않을 것입니다’로 병렬시키면 문장이 매끄럽습니다.
  terminology: ‘내 백성’, ‘내가 택한 이들’, ‘자기 손으로 한 일’은 מקור문의 소유 관계와 בְּחִירָי의 비신학적으로 과도하지 않은 의미를 적절히 반영합니다. ‘택한 자들’도 가능하나, ‘내가 택한 이들’이 현대 합쇼체 문맥에서 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: 앞의 두 부정 구절이 ‘다른 사람이 … 못하다’로 표현됨
    rationale: 원문은 다른 사람이 거주하거나 먹는 결과가 일어나지 않을 것이라는 약속입니다. ‘못하다’는 타인의 능력·허가 문제로 좁혀 들릴 수 있으므로, 단순 부정 미래로 옮기는 편이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: ‘나무의 날들’이라는 직역투 표현
    rationale: 원문의 장수 비유를 보존하되 ‘나무의 수명’이라고 하면 현대 한국어에서 뜻이 더 분명합니다.
  - severity: low
    issue: 각주의 문자적 대안 ‘닳게/다 써 버릴’
    rationale: ‘다 써 버리다’는 소진 또는 낭비의 뉘앙스를 줄 수 있습니다. ‘닳도록 사용할’은 בלה의 문자적 이미지를 더 중립적으로 드러내며 문맥상 향유의 뜻과도 잘 연결됩니다.
