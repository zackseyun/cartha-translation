language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֥ה טֶֽרֶם יִקְרָ֖אוּ וַ/אֲנִ֣י אֶעֱנֶ֑ה ע֛וֹד הֵ֥ם מְדַבְּרִ֖ים וַ/אֲנִ֥י אֶשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
  footnotes:
  - marker: a
    text: Or 'before they cry out, I will answer.' The verb can refer to calling out, including prayerful appeal.
    reason: lexical_alternative
  - marker: b
    text: Or 'while they are yet speaking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 부르기도 전에[a] 내가 대답할 것이며, 그들이 아직 말하고 있을 때[b] 내가 들을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 외치기 전에 내가 대답할 것입니다.’ 이 동사는 기도하는 호소를 포함하여 부르짖는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 아직 말하고 있는 동안에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: '...할 것입니다'
  alternatives_korean:
  - '...일 것입니다'
  - '...이 일어날 것입니다'
  lexicon: HALOT
  rationale: 예언적 미래를 자연스러운 현대 한국어로 옮기되, 완료·공식체를 과도하게 드러내는 표현은 피했습니다.
- source_word: טֶרֶם יִקְרָאוּ
  english_pob_choice: before they call
  chosen_korean: 그들이 아직 부르기 전에
  alternatives_korean:
  - 그들이 부르기 전에
  - 그들이 아직 외치기 전에
  lexicon: HALOT
  rationale: קרא는 여기서 부르다/호소하다의 넓은 뜻을 가지므로, 기도적 뉘앙스를 열어 두면서도 과도하게 좁히지 않는 ‘부르다’를 택했습니다.
- source_word: אֶעֱנֶה
  english_pob_choice: I will answer
  chosen_korean: 내가 대답하고
  alternatives_korean:
  - 내가 응답하고
  - 내가 대답할 것입니다
  lexicon: HALOT
  rationale: ‘답하다/대답하다’는 히브리어 ענה의 직접적인 대응이며, 하나님이 즉각 응답하신다는 약속을 자연스럽게 드러냅니다.
- source_word: אֶשְׁמָע
  english_pob_choice: I will hear
  chosen_korean: 내가 들을 것입니다
  alternatives_korean:
  - 내가 듣겠습니다
  - 내가 귀 기울일 것입니다
  lexicon: HALOT
  rationale: שמע의 기본 의미인 ‘듣다’를 살려, 하나님이 그 말을 분명히 들으신다는 뜻을 보존했습니다.
theological_decisions:
- issue: 부르다/대답하다/듣다의 기도 응답 문맥을 얼마나 명시할지
  chosen_reading: 본문의 일반 동사들을 유지하고 ‘기도하다/기도’를 덧붙이지 않았습니다.
  alternative_readings:
  - 그들이 기도하기 전에 내가 응답하고, 아직 기도하고 있을 때 내가 들을 것입니다.
  - 그들이 간구하기 전에 내가 대답하고...
  rationale: 문맥상 기도 응답을 가리키지만, 히브리어는 더 넓게 ‘부르다–대답하다–듣다’의 관계를 사용하므로 해석을 과하게 좁히지 않았습니다.
  doctrine_reference: 원문 우선 번역; 신학적 함의는 유지하되 번역에서 불필요한 설명을 추가하지 않음
