  text: וּ/מָנִ֨יתִי אֶתְ/כֶ֜ם לַ/חֶ֗רֶב וְ/כֻלְּ/כֶם֙ לַ/טֶּ֣בַח תִּכְרָ֔עוּ יַ֤עַן קָרָ֨אתִי֙ וְ/לֹ֣א עֲנִיתֶ֔ם דִּבַּ֖רְתִּי וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בְּחַרְתֶּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
  footnotes:
  - marker: a
    text: Or 'I will appoint you' or 'I will number you.' The Hebrew verb also allows a wordplay with the 'god of Destiny' in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'will kneel' or 'will crouch.' The Hebrew verb literally refers to bending the knee; here it depicts collapse under judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'you did not hear' or, by implication, 'you did not obey.'
    reason: lexical_alternative
  - marker: d
    text: Or 'chose what I did not desire' / 'what I took no pleasure in.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 칼에 넘기겠으며[a], 너희 모두가 도살을 향하여 무릎을 꿇을 것입니다.[b] 이는 내가 불렀으나 너희가 대답하지 않았고, 내가 말하였으나 너희가 듣지 않았기 때문입니다.[c] 그리고 너희는 내 눈에 악한 일을 하였으며, 내가 기뻐하지 않는 것을 택하였습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מנה는 ‘정하다’, ‘배정하다’, 또는 ‘세다’라는 뜻도 지닙니다. 또한 앞 절의 ‘운명/운명의 신’과 말놀이를 이룰 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무릎을 굽히다’, ‘웅크리다’로 옮길 수 있습니다. 히브리어는 글자 그대로 무릎을 굽히는 것을 뜻하며, 여기서는 심판 아래 무너지는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘듣지 않았다’ 또는 문맥상 ‘순종하지 않았다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 원하지 않는 것’ 또는 ‘내가 기뻐하지 아니한 것’을 택하였다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי אֶתְכֶם
  english_pob_choice: I will destine you
  chosen_korean: 내가 너희를 칼에게 맡기겠으며
  alternatives_korean:
  - 내가 너희를 칼로 정하겠으며
  - 내가 너희를 칼에 배정하겠으며
  - 내가 너희를 칼에 할당하겠으며
  lexicon: HALOT
  rationale: מנה의 ‘지정하다/배정하다’ 의미를 살리되, 심판 문맥에서 결과를 암시하는 한국어로는 ‘맡기다’가 가장 자연스럽고, 뒤의 ‘칼에게’와 결합해 정죄의 방향을 분명히 드러냅니다.
- source_word: לַחֶרֶב
  english_pob_choice: for the sword
  chosen_korean: 칼에게
  alternatives_korean:
  - 칼을 위하여
  - 칼에
  - 칼로
  lexicon: HALOT
  rationale: 히브리어 전치사의 목적/귀속 감각을 살리면서도 한국어에서는 ‘칼에게 맡기다’가 심판의 관용적 표현으로 읽혀 과도한 설명 없이 원문 효과를 전달합니다.
- source_word: תִּכְרָעוּ לַטֶּבַח
  english_pob_choice: will bow down for the slaughter
  chosen_korean: 도살에 굴복할 것입니다
  alternatives_korean:
  - 도살 앞에 무릎을 꿇을 것입니다
  - 도살을 향해 무릎을 꿇을 것입니다
  - 도살 앞에 쓰러질 것입니다
  lexicon: HALOT
  rationale: כרע의 ‘무릎을 굽히다/꿇다’와 문맥상 ‘심판 아래 무너짐’을 함께 담기 위해 ‘굴복하다’를 택했습니다. ‘도살’은 טבח의 직설적 의미를 살려 정서적 강도를 유지합니다.
- source_word: שְׁמַעְתֶּם
  english_pob_choice: you did not listen
  chosen_korean: 듣지 않았기 때문입니다
  alternatives_korean:
  - 순종하지 않았기 때문입니다
  - 들으려 하지 않았기 때문입니다
  - 귀 기울이지 않았기 때문입니다
  lexicon: HALOT
  rationale: שמע의 기본 청취 의미를 유지하면서, 바로 앞의 ‘내가 말하였다’와의 평행을 살려 ‘듣다’로 옮겼습니다. 여기서는 해석어 ‘순종하다’보다 원문의 직접성을 우선했습니다.
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  english_pob_choice: you did what was evil in my eyes
  chosen_korean: 내 눈에 악한 일을 하였으며
  alternatives_korean:
  - 내가 보기에는 악한 일을 하였으며
  - 내 눈앞에 악을 행하였으며
  - 내가 악하게 여긴 일을 하였으며
  lexicon: HALOT
  rationale: ‘내 눈에’라는 히브리어 관용을 보존해 하나님의 평가 기준이 드러나게 했습니다. ‘악한 일’은 단순한 추상보다 행위성을 살립니다.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  english_pob_choice: and chose what I did not delight in
  chosen_korean: 내가 기뻐하지 않는 것을 택하였습니다
  alternatives_korean:
  - 내가 좋아하지 않는 것을 택하였습니다
  - 내가 기뻐하지 않은 바를 택하였습니다
  - 내가 원하지 않는 것을 선택하였습니다
  lexicon: HALOT
  rationale: חפץ의 ‘기뻐하다/즐기다/마음에 두다’의 정서적-의지적 뉘앙스를 살려 ‘기뻐하지 않다’로 옮겼습니다. 상대절 구조는 한국어에서 자연스럽게 ‘것’을 보충해 처리했습니다.
theological_decisions:
- issue: ‘칼’과 ‘도살’의 심판 이미지를 완화할지 여부
  chosen_reading: 직설적 심판 언어를 그대로 유지하여, 하나님이 불순종에 대해 सक्रिय적으로 심판하시는 문맥을 보존했습니다.
  alternative_readings:
  - 완화하여 ‘전쟁’이나 ‘죽음’으로 풀기
  - 비유적으로 ‘멸망’으로 일반화하기
  rationale: 원문은 불순종에 대한 직접적 판결을 말하며, 영어 POB도 이를 약화하지 않습니다. 한국어에서도 충격을 줄이기보다 원문 강도를 유지하는 것이 source-directed입니다.
  doctrine_reference: 번역 원리 §1, §3
- issue: ‘듣다’와 ‘순종하다’의 선택
  chosen_reading: ‘듣지 않았기 때문입니다’로 두어 청취 불응의 형태를 보존했습니다.
  alternative_readings:
  - ‘순종하지 않았기 때문입니다’
  - ‘귀를 기울이지 않았기 때문입니다’
  rationale: שמע는 문맥상 순종을 함의할 수 있으나, 본문은 먼저 부르심과 발화에 대한 반응 실패를 고발합니다. 따라서 번역은 해석을 앞서지 않고, 순종의 함의는 독자가 읽어내도록 남겨 두었습니다.
  doctrine_reference: 번역 원리 §3
