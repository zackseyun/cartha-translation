  source_fidelity: 전반적인 절의 인과 구조와 심판의 직접성은 잘 보존되었습니다. 다만 וּמָנִיתִי의 ‘정하다/배정하다’라는 의미는 ‘칼에게 맡기다’보다 ‘칼에 넘기다’가 한국어에서 더 자연스럽고, תִּכְרָעוּ의 구체적인 ‘무릎을 굽히다’의 형상은 ‘굴복하다’보다 명시하는 편이 충실합니다.
  naturalness: ‘칼에게 맡기다’는 무생물인 칼을 수혜자처럼 취급하여 다소 부자연스럽습니다. ‘도살에 굴복하다’도 한국어에서 결합이 어색하고 원문의 신체 동작을 추상화합니다. 이를 각각 ‘칼에 넘기다’와 ‘도살을 향하여 무릎을 꿇다’로 고치면 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다.
  terminology: ‘칼’, ‘도살’, ‘악한 일’, ‘기뻐하지 않는 것’은 원문의 심판 및 평가 언어를 불필요하게 완화하지 않고 적절히 전달합니다. שמע는 ‘듣지 않았다’로 유지하여 ‘순종하다’라는 해석적 확정을 피하는 것이 적절합니다.
