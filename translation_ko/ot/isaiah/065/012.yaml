revisions:
- from: 내가 너희를 칼에게 맡기겠으며, 너희 모두가 도살에 굴복할 것입니다. 이는 내가 불렀으나 너희가 대답하지 않았고, 내가 말하였으나 너희가 듣지 않았기 때문입니다. 그리고 너희는 내 눈에 악한 일을 하였으며, 내가 기뻐하지 않는 것을 택하였습니다.[a][b][c][d]
  to: 내가 너희를 칼에 넘기겠으며[a], 너희 모두가 도살을 향하여 무릎을 꿇을 것입니다.[b] 이는 내가 불렀으나 너희가 대답하지 않았고, 내가 말하였으나 너희가 듣지 않았기 때문입니다.[c] 그리고 너희는 내 눈에 악한 일을 하였으며, 내가 기뻐하지 않는 것을 택하였습니다.[d]
  rationale: ‘칼에 넘기다’는 מנה와 לַחֶרֶב이 이루는 심판의 배정·인계 의미를 자연스러운 한국어로 전달합니다. ‘도살을 향하여 무릎을 꿇다’는 다소 엄숙한 문체이지만 원문의 병렬 구조와 כרע의 구체적 동작을 보존하며, 그것이 죽음 앞의 붕괴를 묘사한다는 해석은 각주에만 제한했습니다. 각주 표지는 해당 어휘 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:34Z'
