id: ISA.65.11
reference: Isaiah 65:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֹזְבֵ֣י יְהוָ֔ה הַ/שְּׁכֵחִ֖ים אֶת הַ֣ר קָדְשִׁ֑/י הַֽ/עֹרְכִ֤ים לַ/גַּד֙ שֻׁלְחָ֔ן וְ/הַֽ/מְמַלְאִ֖ים לַ/מְנִ֥י מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
  footnotes:
  - marker: a
    text: Gad was likely the name of a deity associated with fortune; alternatively, 'for Fortune.'
    reason: alternative_reading
  - marker: b
    text: Meni was likely the name of a deity associated with destiny; alternatively, 'for Destiny.'
    reason: alternative_reading
  - marker: c
    text: Or 'mixed drink'; the phrase refers to a prepared libation beverage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 야훼를 버리고 나의 거룩한 산을 잊으며, 갓을 위하여[a] 식탁을 차리고 메니를 위하여[b] 혼합주를[c] 따라 놓는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 갓은 아마 행운과 관련된 신의 이름으로 보입니다. 또는 ‘행운을 위하여’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 메니는 아마 운명과 관련된 신의 이름으로 보입니다. 또는 ‘운명을 위하여’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘혼합 음료’입니다. 이 말은 제의용으로 준비된 음료를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러나 너희는
  alternatives_korean:
  - 그리고 너희는
  - 하지만 너희는
  lexicon: HALOT
  rationale: 앞선 문맥과 대조되는 도입이므로 역접을 살려 ‘그러나’로 옮기고, 직접 호명되는 대상은 ‘너희는’으로 자연스럽게 처리했습니다.
- source_word: עֹזְבֵי יְהוָה
  english_pob_choice: those who forsake Yahweh
  chosen_korean: 야훼를 버리고
  alternatives_korean:
  - 야훼를 떠나고
  - 야훼를 버리는 자들
  lexicon: HALOT
  rationale: 분사구가 대상을 규정하므로 서술형으로 자연스럽게 풀되, 강한 언약적 배반의 뉘앙스를 위해 ‘버리다’를 선택했습니다.
- source_word: לַגַּד / לַמְנִי
  english_pob_choice: for Gad / for Meni
  chosen_korean: 갓을 위해 / 메니를 위해
  alternatives_korean:
  - 갓에게 / 메니에게
  - 운명에게 / 정해진 운명에게
  lexicon: HALOT
  rationale: 본문의 고유명사는 음역을 유지해 우상숭배 대상을 드러냈고, 목적격 조사 대신 ‘위해’로 제의적 헌납의 방향성을 살렸습니다.
- source_word: מִמְסָךְ
  english_pob_choice: mixed wine
  chosen_korean: 혼합한 포도주
  alternatives_korean:
  - 섞은 술
  - 혼합 술
  lexicon: HALOT
  rationale: 어근상 ‘섞다/혼합하다’의 의미를 반영하되, 제의적 음료라는 점을 드러내기 위해 ‘포도주’로 구체화했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 언약 სახელ을 직접 사용하므로, 본문 식별성을 위해 인명형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: גַּד / מְנִי의 처리
  chosen_reading: 고유명사로 음역해 우상적 대상성을 보존
  alternative_readings:
  - 운명
  - 행운
  rationale: 문맥은 이름의 뜻보다 예배 대상 자체를 비판하므로, 한국어 본문에서는 음역을 유지하는 편이 경멸적 예언의 초점을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2; §3
