  source_fidelity: 전반적으로 히브리어의 대조 도입, 야훼를 버림, 거룩한 산을 잊음, 갓과 메니를 위한 제의 행위를 충실히 반영합니다. 다만 מְמַלְאִים ... מִמְסָךְ의 ‘채우다’는 한국어에서 ‘포도주를 채우다’라고 하면 목적어 관계가 부자연스럽습니다. 문맥상 그릇에 혼합주를 따라 제의상 마련하는 행위를 가리키므로, 이를 자연스럽게 표현할 필요가 있습니다.
