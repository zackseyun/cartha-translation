id: ISA.65.25
reference: Isaiah 65:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
  footnotes:
  - marker: a
    text: Or 'young goat' for 'lamb'; the Hebrew טָלֶה can refer more broadly to a young small livestock animal.
    reason: lexical_alternative
  - marker: b
    text: The serpent’s eating dust likely echoes Genesis 3:14.
    reason: cross_reference
  - marker: c
    text: Or 'will not harm or destroy'; the first verb can emphasize harmful action as well as evil-doing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이리와 어린양이 함께 풀을 뜯고, 사자가 소처럼 짚을 먹을 것이며, 뱀은 흙을 먹이로 삼을 것입니다. 그들은 내 모든 거룩한 산에서 악을 행하지도, 파괴하지도 않을 것입니다.” 야훼께서 말씀하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린양’은 히브리어 טָלֶה가 가리킬 수 있는 더 넓은 의미의 ‘어린 작은 가축’까지 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뱀은 흙을 먹이로 삼을 것입니다’는 창세기 3:14을 떠올리게 하는 표현입니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 동사 לֹא יָרֵעוּ는 ‘악을 행하다’와 ‘해를 끼치다’의 두 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב
  english_pob_choice: wolf
  chosen_korean: 이리
  alternatives_korean:
  - 늑대
  lexicon: HALOT
  rationale: 현대 한국어에서 ‘늑대’가 더 일반적이지만, 예언적·시적 문맥의 짐승 이름으로는 ‘이리’가 더 문어적이고 간결해 대구를 살리기에 적절합니다.
- source_word: טָלֶה
  english_pob_choice: lamb
  chosen_korean: 어린양
  alternatives_korean:
  - 양
  - 어린 염소
  lexicon: HALOT
  rationale: 영문 POB가 이 구절의 평화 이미지에서 ‘lamb’를 택한 점을 반영하여, 한국어도 가장 자연스러운 ‘어린양’으로 옮겼습니다. 다만 히브리어는 더 넓게 어린 가축을 가리킬 수 있습니다.
- source_word: כַּבָּקָר
  english_pob_choice: like the cattle
  chosen_korean: 소처럼
  alternatives_korean:
  - 황소처럼
  - 가축처럼
  lexicon: HALOT
  rationale: בָּקָר는 집합적·일반적 의미의 소떼를 가리키므로, 단수적 비교를 살리되 자연스러운 한국어 관용으로 ‘소처럼’ 번역했습니다.
- source_word: עָפָר לַחְמוֹ
  english_pob_choice: dust will be the serpent’s food
  chosen_korean: 뱀은 흙을 먹이로 삼을 것입니다
  alternatives_korean:
  - 뱀의 음식은 흙일 것입니다
  - 흙이 뱀의 먹을 것입니다
  lexicon: HALOT
  rationale: לַחְם는 문자적으로 ‘빵’이지만 여기서는 일반적인 먹이를 뜻하므로, 한국어에서는 자연스럽게 ‘먹이로 삼다’로 옮겨 창세기 3장의 연상을 유지했습니다.
- source_word: לֹא יָרֵעוּ וְלֹא יַשְׁחִיתוּ
  english_pob_choice: They will do no evil or destroy
  chosen_korean: 악을 행하지도, 파괴하지도 않을 것입니다
  alternatives_korean:
  - 해치지도, 멸하지도 않을 것입니다
  - 악을 저지르지도, 파괴하지도 않을 것입니다
  lexicon: HALOT
  rationale: יָרֵעַ는 ‘악을 행하다/해를 끼치다’의 폭이 있고, יַשְׁחִית는 ‘파괴하다/멸하다’의 뜻이므로, 두 동사의 병렬을 한국어에서도 분명하게 살렸습니다.
theological_decisions:
- issue: 뱀-흙 구절의 창세기 3장 암시
  chosen_reading: 본문은 설명을 덧붙이지 않고 ‘뱀은 흙을 먹이로 삼을 것입니다’로 유지해 창세기 3:14의 울림을 보존했습니다.
  alternative_readings:
  - 뱀은 저주받아 흙을 먹을 것입니다
  - 뱀은 흙만 먹게 될 것입니다
  rationale: 본문 자체는 에덴의 저주를 해설하지 않고 그 이미지만 제시하므로, 주석적 확장을 피하고 상호본문적 긴장을 그대로 둡니다.
  doctrine_reference: 본문이 말하는 범위를 넘지 않도록 상호본문성을 보존합니다.
- issue: 거룩한 산 위/에서의 전치사
  chosen_reading: ‘내 모든 거룩한 산에서’ 대신 ‘내 모든 거룩한 산에서’라는 한국어 자연성을 취하되, 공간적 범위를 분명히 했습니다.
  alternative_readings:
  - 내 모든 거룩한 산 위에서
  - 내 거룩한 산 전체에서
  rationale: בְּכָל הַר קָדְשִׁי의 기본값은 장소 범위이므로, 한국어에서도 실제로 ‘산 전체에서’라는 의미가 드러나도록 했습니다.
  doctrine_reference: 지리적 표현을 과도하게 영해하지 않도록 합니다.
