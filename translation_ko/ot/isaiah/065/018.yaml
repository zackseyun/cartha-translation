id: ISA.65.18
reference: Isaiah 65:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
  footnotes:
  - marker: a
    text: Or, 'I am creating Jerusalem for rejoicing, and her people for gladness.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 내가 창조하는 일을 두고 영원히 기뻐하고 즐거워하십시오. 보십시오[a], 내가 예루살렘을 기쁨이 되게, 그 백성을 즐거움이 되게 창조하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 예루살렘을 기쁨이 되도록, 그 백성을 즐거움이 되도록 창조하고 있습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞절의 기억 금지와 대비되는 전환을 자연스럽게 살리면서, 문맥상 반전의 뉘앙스를 한국어 연결어로 가장 무난하게 드러냅니다.
- source_word: שִׂישׂוּ וְגִילוּ
  english_pob_choice: be glad and rejoice
  chosen_korean: 기뻐하고 즐거워하십시오
  alternatives_korean:
  - 기뻐하며 즐거워하십시오
  - 환호하고 기뻐하십시오
  lexicon: HALOT
  rationale: 두 동사의 시적 병렬을 살리되, 한국어에서는 의미를 약간 구분해 자연스럽게 옮겼습니다. 명령형으로 두어 선포적 권면의 힘을 유지했습니다.
- source_word: עֲדֵי עַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원토록
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 관용구로, 현대 표준어에서 가장 직접적이고 간결한 표현을 선택했습니다.
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  english_pob_choice: in what I am creating
  chosen_korean: 내가 창조하는 것 안에서
  alternatives_korean:
  - 내가 창조하는 일 안에서
  - 내가 창조하는 바 안에서
  lexicon: HALOT
  rationale: 기쁨의 대상/영역을 나타내는 관계절을 한국어에서 어색하지 않게 풀어, 진행 중인 창조 행위의 대상을 보존했습니다.
- source_word: גִּילָה
  english_pob_choice: as rejoicing
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 기뻐함으로
  lexicon: HALOT
  rationale: 보어적 결과를 나타내는 명사로 이해하여, 예루살렘이 '기쁨'의 성격으로 빚어진다는 점을 간결하게 살렸습니다.
- source_word: מָשׂוֹשׂ
  english_pob_choice: as joy
  chosen_korean: 즐거움으로
  alternatives_korean:
  - 기쁨으로
  - 환희로
  lexicon: HALOT
  rationale: 앞의 גִּילָה와 병행되는 명사이므로 동일한 계열의 감정어를 사용해 평행성을 살렸습니다.
theological_decisions:
- issue: 히브리어 명령형의 수신자와 어조
  chosen_reading: 예언적 선포 안에서 청중에게 직접 명령하는 형식으로 옮겼습니다.
  alternative_readings:
  - 서술문으로 완화해 옮기는 방식
  - 미래 권유형으로 옮기는 방식
  rationale: 본문은 위로의 선포 속에서도 직접적인 촉구를 유지하므로, 한국어에서도 명령형을 살려 원문의 수사적 힘을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
- issue: גִּילָה / מָשׂוֹשׂ의 predicative 가능성
  chosen_reading: 예루살렘을 '기쁨으로', 그 백성을 '즐거움으로' 창조한다는 결과적/서술적 읽기를 택했습니다.
  alternative_readings:
  - 예루살렘을 기쁨을 위하여, 그 백성을 즐거움을 위하여 창조한다는 목적적 읽기
  - 예루살렘을 기쁨 자체로, 그 백성을 즐거움 자체로 창조한다는 해석
  rationale: 히브리어는 목적과 서술 양쪽 모두 가능하지만, 한국어에서는 '—으로'를 써서 예루살렘과 백성의 새 정체성을 강조하는 그림을 유지했습니다. 의미의 긴장은 각주로 남깁니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
