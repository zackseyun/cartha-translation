  source_fidelity: 히브리어의 대조 접속, 복수 명령, 지속의 표현, 창조의 분사적 현재성, 그리고 예루살렘과 그 백성에 대한 병렬 구조를 대체로 충실히 반영합니다. 다만 ‘내가 창조하는 것 안에서’는 אֲשֶׁר אֲנִי בוֹרֵא가 나타내는 기쁨의 대상·계기를 한국어에서 부자연스럽고 다소 모호하게 전달하며, ‘기쁨으로 … 즐거움으로 창조하다’는 창조의 방식·수단으로 오해될 수 있습니다.
  naturalness: ‘내가 창조하는 일을 두고’가 현대 한국어에서 더 자연스럽게 기쁨의 대상/계기를 나타냅니다. 또한 ‘기쁨이 되게, … 즐거움이 되게 창조하고 있습니다’는 원문의 결과적·서술적 보어 관계를 자연스럽게 표현합니다. 합쇼체 명령형과 선포체도 유지됩니다.
  terminology: ‘예루살렘’, ‘백성’, ‘창조’는 적절합니다. גילָה와 מָשׂוֹשׂ의 어휘적 병렬을 ‘기쁨’과 ‘즐거움’으로 구별한 것도 적절합니다. 각주의 목적적 대안은 주절과 평행한 ‘기쁨이 되도록/즐거움이 되도록’으로 제시하는 편이 문법적으로 자연스럽고 의미도 명확합니다.
