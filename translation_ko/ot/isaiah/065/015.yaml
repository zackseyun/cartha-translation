id: ISA.65.15
reference: Isaiah 65:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
  footnotes:
  - marker: a
    text: Or 'for an oath'—that is, your name will be used in a spoken curse-formula.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will give his servants another name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내가 택한 자들에게 너희 이름을 저주로 남기겠지만[a], 주 야훼께서 너희를 죽이실 것이며, 그의 종들에게는 다른 이름을 주실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘맹세로’이지만, 여기서는 심판 맥락에서 저주 공식으로 쓰인 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 종들에게 다른 이름을 부르실 것입니다’입니다. 곧 그들에게 다른 이름을 부여하신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנַּחְתֶּם שִׁמְכֶם
  english_pob_choice: you will leave your name
  chosen_korean: 너희는 너희 이름을 남기겠지만
  alternatives_korean:
  - 너희는 너희 이름을 두겠지만
  - 너희는 너희 이름을 남겨 두겠지만
  lexicon: HALOT
  rationale: 이름을 ‘남기다’로 옮기면, 후대에 불려지는 불명예스러운 표지라는 뜻을 자연스럽게 살리면서도 원문의 ‘두다/남기다’ 뉘앙스를 유지할 수 있습니다.
- source_word: לִשְׁבוּעָה
  english_pob_choice: as a curse
  chosen_korean: 저주로
  alternatives_korean:
  - 맹세로
  - 맹세의 관용구로
  lexicon: HALOT
  rationale: 문맥이 심판 선언이므로, כאן ‘맹세’ 자체보다 ‘저주 공식’의 기능이 두드러집니다. 한국어에서는 ‘저주로’가 그 관용적 힘을 가장 분명하게 전달합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 주권 칭호 אֲדֹנָי와 고유신명 יְהוָה를 함께 살리되, 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다. 한국어에서는 ‘주 야훼’가 간결하면서도 두 요소를 구분해 줍니다.
- source_word: וְלַעֲבָדָיו
  english_pob_choice: to his servants
  chosen_korean: 그의 종들에게는
  alternatives_korean:
  - 그의 노예들에게는
  - 그의 섬기는 자들에게는
  lexicon: HALOT
  rationale: 여기서는 신분적 굴종보다 하나님께 속한 자라는 대비가 핵심이므로, 기본값 ‘종’을 유지했습니다. ‘노예’는 이 대조의 초점에 비해 지나치게 강합니다.
theological_decisions:
- issue: 심판 대상과 구원 대상의 대조 구조
  chosen_reading: ‘너희 이름을 저주로 남기겠지만’과 ‘그의 종들에게는 다른 이름을 부르실 것입니다’를 대비시켜, 불명예의 표지와 새 정체성 부여를 함께 드러냈습니다.
  alternative_readings:
  - ‘너희 이름을 맹세로 남기겠지만’처럼 보다 직역적으로 옮기는 방식
  - ‘그의 종들에게 다른 이름을 주실 것입니다’처럼 의미를 풀어 쓰는 방식
  rationale: 히브리어는 한쪽에는 դատյալ적 저주-공식을, մյուս쪽에는 새 이름 부여를 둡니다. 한국어에서도 그 대조가 선명해야 본문의 심판/회복 구조가 유지됩니다.
  doctrine_reference: Isaiah 65:15 source-level contrast between judgment and restoration
