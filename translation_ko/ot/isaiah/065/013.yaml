  rationale: 본문은 아도나이와 야훼가 함께 있는 직함-신명 조합이므로, 한국어 본문에서는 존칭 호칭과 신명 표지를 함께 보존하는 것이 원문 대비 가장 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
