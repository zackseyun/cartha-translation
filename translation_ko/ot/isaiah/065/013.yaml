base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''my servants.'' The term can also be rendered ''my slaves,'' but here ''servants'' better fits the context of those who belong to and serve God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be ashamed.' The Hebrew can denote either experiencing shame or being put to shame/disgraced; the latter was chosen to fit the judgment context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 「보십시오, 내 종들은 먹겠지만 너희는 굶주릴 것입니다. 보십시오, 내 종들은 마시겠지만 너희는 목마를 것입니다. 보십시오, 내 종들은 기뻐하겠지만 너희는 수치를 당할 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 종들’입니다. 문맥상 하나님의 소유와 섬김을 가리키므로, 여기서는 ‘내 종들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘부끄러워하다/수치를 당하다’의 뜻을 모두 가질 수 있습니다. 심판 문맥에서는 공개적 굴욕을 드러내는 ‘수치를 당하다’가 더 적절합니다.
    reason: lexical_alternative
