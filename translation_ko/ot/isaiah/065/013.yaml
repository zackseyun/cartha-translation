  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''my servants.'' The term can also be rendered ''my slaves,'' but here ''servants'' better fits the context of those who belong to and serve God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be ashamed.' The Hebrew can denote either experiencing shame or being put to shame/disgraced; the latter was chosen to fit the judgment context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보십시오, 내 종들[a]은 먹겠지만 너희는 굶주릴 것입니다. 보십시오, 내 종들은 마시겠지만 너희는 목마를 것입니다. 보십시오, 내 종들은 기뻐하겠지만 너희는 수치를 당할 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 종들’입니다. 이 말은 ‘내 노예들’로도 옮길 수 있지만, 여기서는 하나님께 속하여 그분을 섬기는 이들을 가리키므로 ‘내 종들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘부끄러워하다’ 또는 ‘수치를 당하다’로 옮길 수 있습니다. 여기서는 심판의 문맥에 맞추어 ‘수치를 당할 것입니다’로 옮겼습니다.
    reason: lexical_alternative
