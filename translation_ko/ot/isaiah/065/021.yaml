id: ISA.65.21
reference: Isaiah 65:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
  footnotes:
  - marker: a
    text: Or more formally, 'inhabit them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their fruit,' referring to the vineyards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 집들을 지어 그 안에 살 것이며[a], 포도원을 심고 그 열매[b]를 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그 안에 거주할 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 열매’인데, 여기서는 포도원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ בָתִּים
  english_pob_choice: They will build houses
  chosen_korean: 집들을 지어
  alternatives_korean:
  - 집을 짓고
  - 가옥들을 건축하고
  lexicon: HALOT
  rationale: בנה의 기본 의미를 살려 ‘짓다’로 옮기고, 복수 ‘houses’를 반영해 ‘집들을’로 표현했습니다. ‘건축하다’는 다소 문어적이고 기술적인 뉘앙스가 있어 덜 적절합니다.
- source_word: וְיָשָׁבוּ
  english_pob_choice: live in them
  chosen_korean: 그 안에 살 것이며
  alternatives_korean:
  - 그 안에 거할 것이며
  - 그 안에 거주할 것이며
  lexicon: HALOT
  rationale: ישב는 ‘살다/거하다’의 뜻이므로, 현대 한국어에서는 자연스러운 ‘살다’가 적절합니다. 문맥상 집에 들어가 실제로 거주하는 모습을 분명히 드러냅니다.
- source_word: וְנָטְעוּ כְרָמִים
  english_pob_choice: they will plant vineyards
  chosen_korean: 포도원을 심고
  alternatives_korean:
  - 포도밭을 심고
  - 포도원을 재배하고
  lexicon: HALOT
  rationale: נטע의 핵심은 ‘심다’이며, כְרָמִים는 단수 포도나무가 아니라 ‘포도원들’입니다. 한국어에서는 관용적으로 ‘포도원을 심다’가 가능해 농경적 이미지를 유지합니다.
- source_word: וְאָכְלוּ פִּרְיָם
  english_pob_choice: eat their fruit
  chosen_korean: 그 열매를 먹을 것입니다
  alternatives_korean:
  - 그것들의 열매를 먹을 것입니다
  - 그 생산물을 먹을 것입니다
  lexicon: HALOT
  rationale: פִּרְיָם의 3인칭 복수 소유격은 포도원을 가리키므로, POB의 주석 취지를 살려 ‘그 열매’로 자연스럽게 옮겼습니다. ‘생산물’은 의미는 넓지만 포도원 이미지가 약해집니다.
theological_decisions:
- issue: 예언적 완료형의 시제 처리
  chosen_reading: 히브리어 완료형들을 한국어 미래형 약속문으로 옮겼습니다.
  alternative_readings:
  - 과거형으로 옮김
  - 현재완료/상태로 옮김
  rationale: 본절은 회복의 미래를 약속하는 예언 문맥이므로, 한국어 독자가 약속의 성격을 즉시 이해하도록 미래형이 가장 적합합니다.
  doctrine_reference: 원문 우선 번역 원칙; 예언체의 기능적 시제 전환
