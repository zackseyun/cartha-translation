  source_fidelity: 히브리어의 예언적 완료형들을 미래의 약속으로 일관되게 옮겼습니다. ‘집들을 지어 그 안에 살 것이며’는 וּבָנוּ בָתִּים וְיָשָׁבוּ를, ‘포도원을 심고 그 열매를 먹을 것입니다’는 וְנָטְעוּ כְרָמִים וְאָכְלוּ פִּרְיָם를 충실히 반영합니다. פִּרְיָם의 복수 소유 접미사의 선행사가 포도원임도 주석에서 적절히 밝혔습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 병렬된 약속문의 흐름도 명료합니다. ‘포도원을 심다’는 직역적 농경 표현이지만 한국어 성경 문체와 일반적 용례에서 무리 없이 이해되며 원문의 구체성을 보존합니다.
  terminology: ‘집’, ‘살다’, ‘포도원’, ‘열매’는 모두 문맥과 원어 어휘에 적합합니다. ‘거주하다’라는 보다 격식적인 대안도 각주로 적절히 제시되었습니다.
