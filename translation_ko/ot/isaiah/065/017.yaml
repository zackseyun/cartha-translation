base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
  footnotes:
  - marker: a
    text: Or 'the former things will not be recalled.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'nor will they come up upon the heart,' an idiom meaning 'nor will they come to mind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면, 보십시오, 내가 새 하늘과 새 땅을 창조하고 있습니다. 이전의 것들은 기억되지 않을 것이며[a], 마음에 떠오르지도 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전의 것들은 기억나지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음에 올라오지 않을 것이다’라는 관용구로, ‘마음에 떠오르다’는 뜻입니다.
    reason: lexical_alternative
