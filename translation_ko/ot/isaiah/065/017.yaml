  lexicon: HALOT
  rationale: ‘마음 위로 올라가다’라는 히브리어 관용구를 한국어 관용 표현인 ‘마음에 떠오르다’로 옮겨 의미를 보존했습니다.
theological_decisions:
- issue: 새 하늘들과 새 땅의 범위
  chosen_reading: 이 구절은 정치적 회복에만 제한되지 않는 우주적 새 창조의 약속으로 읽되, 종말론 체계를 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 포로기 이후의 회복을 주로 가리키는 비유적 표현
  rationale: ‘하늘과 땅’의 창조 공식은 본문 자체가 제공하는 범위를 넓게 유지합니다. 번역은 그 폭을 보존하고 해석의 긴장은 열어 둡니다.
  doctrine_reference: 창조-새창조의 연속성과 종말론적 긴장 보존
