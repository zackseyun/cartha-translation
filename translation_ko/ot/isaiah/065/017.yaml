source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
  footnotes:
  - marker: a
    text: Or 'the former things will not be recalled.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'nor will they come up upon the heart,' an idiom meaning 'nor will they come to mind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 새 하늘들과 새 땅을 창조하고 있습니다. 이전의 것들은 기억되지 않을 것이며, 마음에 떠오르지도 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전의 것들은 다시 기억되지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음 위로 올라오지 않을 것이다’라는 관용구로, ‘마음에 떠오르다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 보십시오
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 전절과의 인과를 드러내는 접속어이지만, 바로 뒤의 הִנְנִי가 주의 환기 기능을 가지므로 한국어에서는 ‘보십시오’로 시작해 예언적 선포의 긴장을 살렸습니다.
- source_word: הִנְנִי
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가 있습니다
  lexicon: HALOT
  rationale: 직접적인 주의를 환기하는 표현으로, 현대 한국어 합쇼체에서 가장 자연스럽게 강세를 살릴 수 있는 명령형을 택했습니다.
- source_word: בוֹרֵא
  english_pob_choice: creating
  chosen_korean: 창조하고 있습니다
  alternatives_korean:
  - 창조하겠습니다
  - 창조합니다
  lexicon: HALOT
  rationale: 분사형의 현재적·진행적 뉘앙스를 살려, 미래형보다 ‘창조하고 있습니다’로 옮겨 여호와의 행위가 이미 선언된 현재적 확실성으로 들리게 했습니다.
- source_word: שָׁמַיִם חֲדָשִׁים וָאָרֶץ חֲדָשָׁה
  english_pob_choice: new heavens and a new earth
  chosen_korean: 새 하늘들과 새 땅
  alternatives_korean:
  - 새 하늘과 새 땅
  - 새로운 하늘들과 새로운 땅
  lexicon: HALOT
  rationale: 우주적 창조 공식의 폭을 유지하기 위해 ‘하늘/땅’을 문자적으로 보되, 복수형 שמים의 감각을 살려 ‘하늘들’로 번역했습니다.
- source_word: הָרִאשֹׁנוֹת
  english_pob_choice: the former things
  chosen_korean: 이전의 것들
  alternatives_korean:
  - 옛것들
  - 먼저의 것들
  lexicon: HALOT
  rationale: 특정 사물보다 앞선 질서 전체를 가리키는 substantival 용법이므로, 의미 범위를 넓게 담는 ‘이전의 것들’이 가장 적절합니다.
- source_word: תִזָּכַרְנָה
  english_pob_choice: will not be remembered
  chosen_korean: 기억되지 않을 것이며
  alternatives_korean:
  - 기억되지 않을 것이고
  - 다시 떠올려지지 않을 것이며
  lexicon: HALOT
  rationale: 수동적 의미를 자연스럽게 살려 직역적 과장 없이 한국어 수동형으로 옮겼습니다.
- source_word: תַעֲלֶינָה עַל לֵב
  english_pob_choice: will they come to mind
  chosen_korean: 마음에 떠오르지도 않을 것입니다
  alternatives_korean:
  - 마음에 올라오지도 않을 것입니다
  - 생각나지도 않을 것입니다
  lexicon: HALOT
  rationale: ‘마음 위로 올라가다’라는 히브리어 관용구를 한국어 관용 표현인 ‘마음에 떠오르다’로 옮겨 의미를 보존했습니다.
theological_decisions:
- issue: 새 하늘들과 새 땅의 범위
  chosen_reading: 이 구절은 정치적 회복에만 제한되지 않는 우주적 새 창조의 약속으로 읽되, 종말론 체계를 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 포로기 이후의 회복을 주로 가리키는 비유적 표현
  rationale: ‘하늘과 땅’의 창조 공식은 본문 자체가 제공하는 범위를 넓게 유지합니다. 번역은 그 폭을 보존하고 해석의 긴장은 열어 둡니다.
  doctrine_reference: 창조-새창조의 연속성과 종말론적 긴장 보존
