  lexicon: HALOT
  rationale: ‘chosen ones’의 선발된 신분을 한국어로 직접 드러내되, 교회 용어인 ‘택함 받은 자들’보다 원문 구조에 더 가까운 ‘내 택한 자들’을 택했습니다.
- source_word: וַעֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 섬기는 자들
  - 내 노예들
  lexicon: HALOT
  rationale: 여기서는 예언적·언약적 소속 관계가 중심이므로, 종속성을 드러내는 기본어 ‘종’을 사용했습니다.
theological_decisions:
- issue: ‘my mountains’와 상속 언어의 보존
  chosen_reading: 구체적인 산지·상속 이미지를 유지해, 약속의 땅을 가리키는 물리적 언어를 약화하지 않았습니다.
  alternative_readings:
  - ‘내 땅’으로 일반화
  - 상징적·영적 약속으로만 처리
  rationale: 히브리어는 분명히 ‘내 산들’과 ‘상속/소유’의 언어를 사용하므로, 이를 평이하게 재구성하기보다 원문의 약속 구조를 보존하는 것이 맞습니다.
  doctrine_reference: 언약-땅 약속의 구체성 보존
- issue: ‘씨’의 집합적 단수와 번역 선택
  chosen_reading: ‘씨’를 사용해 זֶרַע의 집합적 단수와 생명-계승 이미지를 살렸습니다.
  alternative_readings:
  - ‘후손’
  - ‘자손’
  rationale: 문맥상 후손/자손도 가능하지만, 원문이 지닌 씨-생산의 이미지를 약화시키지 않기 위해 보다 직설적인 ‘씨’를 선택했습니다.
  doctrine_reference: 문자적 이미지와 집합적 의미의 동시 보존
