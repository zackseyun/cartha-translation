  lexicon: HALOT
  rationale: יוֹרֵשׁ은 ‘상속자/유업자’로 옮길 수 있고, הָרָי는 복수형 ‘내 산들’이므로 지리적·상속적 이미지를 그대로 살려 옮겼습니다.
- source_word: בְחִירַי
  english_pob_choice: my chosen ones
  chosen_korean: 내 택한 자들
  alternatives_korean:
