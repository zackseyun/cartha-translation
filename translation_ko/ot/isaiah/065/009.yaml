id: ISA.65.9
reference: Isaiah 65:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י מִֽ/יַּעֲקֹב֙ זֶ֔רַע וּ/מִ/יהוּדָ֖ה יוֹרֵ֣שׁ הָרָ֑/י וִ/ירֵשׁ֣וּ/הָ בְחִירַ֔/י וַ/עֲבָדַ֖/י יִשְׁכְּנוּ שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
  footnotes:
  - marker: a
    text: Or 'seed from Jacob.' The Hebrew זֶרַע is a collective singular that can mean 'seed,' 'offspring,' or 'descendants.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will inherit them.' The same Hebrew root is used for both 'an heir' and 'will possess them,' emphasizing inheritance and possession together.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 야곱에게서 씨를 내고, 유다에게서 내 산들의 상속자를 내리라. 내 택한 자들이 그것을 차지할 것이고, 내 종들이 거기에 거주할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱에게서 난 씨.’ 히브리어 זֶרַע는 집합적 단수로 ‘씨’, ‘후손’, ‘자손’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 상속할 것이다.’ 같은 히브리어 어근이 ‘상속자’와 ‘차지할 것이다’에 함께 쓰여, 상속과 점유를 함께 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  english_pob_choice: And I will bring forth
  chosen_korean: 내가 … 내리라
  alternatives_korean:
  - 내가 … 가져오리라
  - 내가 … 내놓으리라
  lexicon: HALOT
  rationale: 히필형의 인과적 의미를 살리되, 자손이 ‘나오게 된다’는 이미지를 한국어에서 자연스럽게 전달하기 위해 ‘내다/내리다’ 계열을 택했습니다.
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 씨
  alternatives_korean:
  - 후손
  - 자손
  lexicon: HALOT
  rationale: 여기서 זֶרַע는 집합적 단수로 쓰여 씨앗/후손의 중의성을 지니므로, 보다 직설적인 ‘씨’를 택해 원문의 이미지와 신학적 긴장을 함께 보존했습니다.
- source_word: יוֹרֵשׁ הָרָי
  english_pob_choice: an heir of my mountains
  chosen_korean: 내 산들의 상속자
  alternatives_korean:
  - 내 산을 상속받는 자
  - 내 산들의 유업자
  lexicon: HALOT
  rationale: יוֹרֵשׁ은 ‘상속자/유업자’로 옮길 수 있고, הָרָי는 복수형 ‘내 산들’이므로 지리적·상속적 이미지를 그대로 살려 옮겼습니다.
- source_word: בְחִירַי
  english_pob_choice: my chosen ones
  chosen_korean: 내 택한 자들
  alternatives_korean:
  - 내 선택된 자들
  - 내 택하심을 입은 자들
  lexicon: HALOT
  rationale: ‘chosen ones’의 선발된 신분을 한국어로 직접 드러내되, 교회 용어인 ‘택함 받은 자들’보다 원문 구조에 더 가까운 ‘내 택한 자들’을 택했습니다.
- source_word: וַעֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 섬기는 자들
  - 내 노예들
  lexicon: HALOT
  rationale: 여기서는 예언적·언약적 소속 관계가 중심이므로, 종속성을 드러내는 기본어 ‘종’을 사용했습니다.
theological_decisions:
- issue: ‘my mountains’와 상속 언어의 보존
  chosen_reading: 구체적인 산지·상속 이미지를 유지해, 약속의 땅을 가리키는 물리적 언어를 약화하지 않았습니다.
  alternative_readings:
  - ‘내 땅’으로 일반화
  - 상징적·영적 약속으로만 처리
  rationale: 히브리어는 분명히 ‘내 산들’과 ‘상속/소유’의 언어를 사용하므로, 이를 평이하게 재구성하기보다 원문의 약속 구조를 보존하는 것이 맞습니다.
  doctrine_reference: 언약-땅 약속의 구체성 보존
- issue: ‘씨’의 집합적 단수와 번역 선택
  chosen_reading: ‘씨’를 사용해 זֶרַע의 집합적 단수와 생명-계승 이미지를 살렸습니다.
  alternative_readings:
  - ‘후손’
  - ‘자손’
  rationale: 문맥상 후손/자손도 가능하지만, 원문이 지닌 씨-생산의 이미지를 약화시키지 않기 위해 보다 직설적인 ‘씨’를 선택했습니다.
  doctrine_reference: 문자적 이미지와 집합적 의미의 동시 보존
