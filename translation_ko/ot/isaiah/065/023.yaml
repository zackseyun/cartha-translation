  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
  footnotes:
  - marker: a
    text: Or 'for terror' or 'for sudden disaster.' The Hebrew term can carry the sense of panic, terror, or calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 헛된 데서 수고하지 않고, 재앙을 위해 자녀를 낳지 않을 것입니다. 그들은 야훼께 복을 받은 자들의 씨이며, 그들의 자손도 그들과 함께할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공포를 위해’, 혹은 ‘갑작스런 재난을 위해’일 수 있습니다. 히브리어 이 단어는 당황, 공포, 재앙의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִיגְעוּ לָרִיק
  english_pob_choice: They will not labor for emptiness
  chosen_korean: 그들은 헛된 데서 수고하지 않고
  alternatives_korean:
  - 헛되이 수고하지 않고
  - 무익하게 애쓰지 않고
  lexicon: HALOT
  rationale: יָגַע은 ‘수고하다/애쓰다’의 강한 노동감을 가지므로 ‘수고하다’로 살리고, לָרִיק의 ‘empty/vain’은 관용적으로 ‘헛된 데서’로 옮겨 결과의 공허함을 드러냈습니다.
- source_word: וְלֹא יֵלְדוּ לַבֶּהָלָה
  english_pob_choice: nor bear children for calamity
  chosen_korean: 재앙을 위해 자녀를 낳지 않을 것입니다
  alternatives_korean:
  - 공포를 위해 자녀를 낳지 않을 것입니다
  - 갑작스런 재난을 위해 자녀를 낳지 않을 것입니다
  lexicon: HALOT
  rationale: בֶּהָלָה는 공포·당황·재앙의 범위를 가지지만 문맥상 자녀가 태어나자마자 파괴되는 운명을 가리키므로, 읽기 쉬우면서도 결과의 비극을 담는 ‘재앙’이 적절합니다.
- source_word: זֶרַע בְּרוּכֵי יְהוָה
  english_pob_choice: the offspring of those blessed by Yahweh
  chosen_korean: 야훼께 복을 받은 자들의 씨
  alternatives_korean:
  - 야훼께 복을 받은 자들의 후손
  - 야훼께 복을 받은 자들의 자손
  lexicon: HALOT
  rationale: זֶרַע는 문자적으로 ‘씨’이지만 출산·계보 약속에서 ‘후손/자손’도 가능하므로, 앞뒤의 ‘자손’과 구별되게 하면서도 원어의 생명-계승 이미지를 살리기 위해 ‘씨’를 유지했습니다.
- source_word: וְצֶאֱצָאֵיהֶם אִתָּם
  english_pob_choice: and their descendants with them
  chosen_korean: 그들의 자손도 그들과 함께할 것입니다
  alternatives_korean:
  - 그들의 후손도 그들과 함께 있을 것입니다
  - 그들의 자손이 그들과 함께 있을 것입니다
  lexicon: HALOT
  rationale: צֶאֱצָאִים은 이어지는 세대, 곧 ‘자손/후손’을 뜻하므로 앞의 זֶרַע와 구별하여 ‘자손’으로 옮겼고, אִתָּם은 단순 동행을 넘어 지속적 공존을 나타내어 ‘함께할 것입니다’로 자연스럽게 처리했습니다.
theological_decisions:
