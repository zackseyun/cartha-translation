source:
  edition: WLC
  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
  footnotes:
  - marker: a
    text: Or, “for I am too holy for you,” or “for I have kept myself holy from you.” The Hebrew clause is difficult and expresses a claim of ritual or moral superiority.
    reason: alternative_reading
translation:
  language: ko
  text: 「너는 따로 있으라. 내게 가까이 오지 말라. 나는 너보다 거룩하다[a]」라고 말하는 자들입니다. 이들은 내 콧구멍의 연기요, 온종일 타오르는 불입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이 절은 문법적으로 압축되어 있습니다. ‘나는 너에게 너무 거룩하다’ 또는 ‘나는 너에게서 나 자신을 거룩하게 지켰다’로도 옮길 수 있습니다. 문맥상 이는 의례적·도덕적 우월성을 주장하는 말입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  english_pob_choice: who say
  chosen_korean: 말하는 자들입니다
  alternatives_korean:
  - 말하는 사람들입니다
  - 이렇게 말합니다
  lexicon: HALOT
  rationale: 현재분사형이 명사적으로 쓰여 앞선 무리들을 가리키므로, 관계절보다 한국어에서는 ‘말하는 자들’로 받는 것이 자연스럽습니다.
- source_word: קְרַב אֵלֶיךָ / אַל תִּגַּשׁ בִּי
  english_pob_choice: Keep to yourself; do not come near me
  chosen_korean: 내게로 가까이 오지 말라
  alternatives_korean:
  - 가까이 오지 말라
  - 나에게 다가오지 말라
  - 나와 거리를 두라
  lexicon: HALOT
  rationale: 두 개의 금지 명령을 한국어에서는 하나의 핵심 명령으로 압축해, 배타적이고 쫓아내는 어조를 살렸습니다.
- source_word: כִּי קְדַשְׁתִּיךָ
  english_pob_choice: for I am holier than you
  chosen_korean: 나는 너보다 거룩하다
  alternatives_korean:
  - 나는 너보다 너무 거룩하다
  - 나는 너에게서 따로 거룩하다
  - 나는 너를 위해 거룩하게 되었다
  lexicon: HALOT
  rationale: 히브리어 표현이 압축적이고 어려우므로, 문맥상 드러나는 교만한 우월 주장으로 직역형의 비교 표현을 유지했습니다.
- source_word: עָשָׁן בְּאַפִּי
  english_pob_choice: are smoke in my nostrils
  chosen_korean: 내 콧구멍의 연기요
  alternatives_korean:
  - 내 코의 연기요
  - 내 콧구멍 속의 연기요
  - 내게는 코를 찌르는 연기요
  lexicon: HALOT
  rationale: אַף의 구체적 이미지인 ‘코/콧구멍’을 보존해, 추상적인 분노보다 하나님을 괴롭게 하는 자극적 장면을 살렸습니다.
- source_word: אֵשׁ יֹקֶדֶת כָּל הַיּוֹם
  english_pob_choice: a fire burning all day long
  chosen_korean: 온종일 타오르는 불입니다
  alternatives_korean:
  - 하루 종일 타는 불입니다
  - 늘 타오르는 불입니다
  - 온종일 계속 타는 불입니다
  lexicon: HALOT
  rationale: משך되는 분노의 이미지를 현재분사로 살리되, 현대 한국어에서는 ‘타오르는’이 가장 자연스럽습니다.
theological_decisions:
- issue: 화자들의 자기-거룩 주장과 그 평가
  chosen_reading: 그들은 자신을 하나님보다 우월하게 분리한 자들이 아니라, 실제로는 하나님께 불쾌함을 주는 교만한 자들로 제시합니다.
  alternative_readings:
  - 의례적 정결을 내세운 자기분리로 볼 수 있습니다
  - ‘나는 너를 위해 거룩하다’로 완화할 수 있습니다
  rationale: 본문은 그들의 발언을 인용하되 곧바로 하나님의 반응으로 심판적 평가를 붙입니다. 따라서 해석을 지나치게 완화하지 않고, 텍스트가 드러내는 교만과 배타성을 그대로 유지했습니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장 보존'
