source:
  edition: WLC
  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
  footnotes:
  - marker: a
    text: 'Hebrew: ''on the bricks.'' The phrase likely refers to brick-built cultic installations or altars used for illicit worship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 늘 내 면전에서 나를 노엽게 하며, 동산들에서 제물을 바치고 벽돌 위에서 분향하는 백성입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘벽돌 위에서.’ 이 표현은 제의용 벽돌 구조물이나 제단을 가리킬 가능성이 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם / הַמַּכְעִיסִים
  english_pob_choice: the people who continually provoke me
  chosen_korean: 계속해서 내 얼굴 앞에서 나를 노엽게 하는 백성
  alternatives_korean:
  - 계속해서 나를 격노하게 하는 백성
  - 끊임없이 내 앞에서 나를 분노하게 하는 백성
  lexicon: HALOT
  rationale: מכעיסים의 사역적 의미를 살려 ‘노엽게 하다’로 옮기고, הָעָם의 집합적 대상을 ‘백성’으로 자연스럽게 드러냈습니다.
- source_word: עַל פָּנַי תָּמִיד
  english_pob_choice: to my face ... continually
  chosen_korean: 내 얼굴 앞에서 ... 계속해서
  alternatives_korean:
  - 내 앞에서 ... 항상
  - 내 면전에서 ... 끊임없이
  lexicon: HALOT
  rationale: ‘얼굴 앞에서’는 히브리어 관용구의 도발성과 맞붙는 느낌을 살리고, תָּמִיד은 반복 지속성을 드러내는 ‘계속해서’로 옮겼습니다.
- source_word: זֹבְחִים בַּגַּנּוֹת
  english_pob_choice: sacrificing in the gardens
  chosen_korean: 동산들에서 제물을 바치고
  alternatives_korean:
  - 정원들에서 제사를 드리고
  - 동산에서 희생제사를 드리고
  lexicon: HALOT
  rationale: בַּגַּנּוֹת의 장소감을 유지하면서 우상숭배 맥락을 지나치게 풀어쓰지 않기 위해 ‘동산들’과 ‘제물을 바치고’를 택했습니다.
- source_word: וּמְקַטְּרִים עַל הַלְּבֵנִים
  english_pob_choice: burning incense on the bricks
  chosen_korean: 벽돌 위에서 분향합니다
  alternatives_korean:
  - 벽돌 위에 향을 피웁니다
  - 벽돌들 위에서 향을 사릅니다
  lexicon: HALOT
  rationale: לְבֵנִים은 문자적으로 ‘벽돌’이므로 본문의 물질적 표현을 살리되, 제의 행위를 한국어 관용에 맞게 ‘분향하다’로 옮겼습니다.
theological_decisions:
- issue: עַל הַלְּבֵנִים의 제의적 지시 대상
  chosen_reading: ‘벽돌 위에서’로 직역해, 벽돌로 된 제의적 구조물/제단 가능성은 주석 여지로 남겼습니다.
  alternative_readings:
  - 벽돌 제단에서
  - 벽돌 위의 제단에서
  rationale: 히브리어는 ‘벽돌’ 자체를 말할 뿐 구조물을 명시하지 않으므로, 본문에 없는 ‘제단’을 본문에 넣지 않고 모호성을 보존했습니다.
  doctrine_reference: '번역 철학: 원문이 허용하는 긴장과 모호성은 해소하지 않고 유지합니다.'
