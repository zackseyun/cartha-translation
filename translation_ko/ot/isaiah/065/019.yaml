id: ISA.65.19
reference: Isaiah 65:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַלְתִּ֥י בִ/ירוּשָׁלִַ֖ם וְ/שַׂשְׂתִּ֣י בְ/עַמִּ֑/י וְ/לֹֽא יִשָּׁמַ֥ע בָּ/הּ֙ ע֔וֹד ק֥וֹל בְּכִ֖י וְ/ק֥וֹל זְעָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
  footnotes:
  - marker: a
    text: Or 'over Jerusalem' and 'over my people.' The Hebrew preposition is literally 'in,' but some translations take it in a more relational sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in her,' referring to Jerusalem as a feminine city.
    reason: lexical_alternative
  - marker: c
    text: Or 'the sound of an outcry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘에서 나는 기뻐하며 내 백성 안에서 즐거워하겠습니다[a]. 다시는 그곳[b]에서 울음의 소리나 부르짖음의 소리가 들리지 않을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘 위에’와 ‘내 백성 위에’로도 옮길 수 있습니다. 히브리어 전치사는 문자적으로는 ‘안에서’입니다만, 일부 번역은 더 관계적인 의미로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 예루살렘을 가리키는 여성형 단수 대명사입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부르짖음의 소리’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  english_pob_choice: I will rejoice
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 기뻐하겠습니다
  - 환호하겠습니다
  - 즐거워하겠습니다
  lexicon: HALOT
  rationale: 기쁨의 동사 גיל을 자연스럽고 격식 있는 미래 표현으로 옮기되, 뒤의 שׂשׂ와 완전히 동일하게 만들지 않기 위해 ‘기뻐하며’로 시작했습니다.
- source_word: בִירוּשָׁלִַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘 위에
  - 예루살렘에 대해
  lexicon: HALOT
  rationale: 전치사 ב의 기본값을 살려 locative한 ‘~에서’로 옮겼습니다. EN POB의 각주가 제시한 관계적 뉘앙스는 본문보다 각주로 처리하는 것이 적절합니다.
- source_word: בְעַמִּי
  english_pob_choice: in my people
  chosen_korean: 내 백성 안에서
  alternatives_korean:
  - 내 백성을 향해
  - 내 백성 위에
  - 내 백성 가운데서
  lexicon: HALOT
  rationale: 예루살렘과 평행을 이루는 ב를 유지하면서도 한국어에서 자연스러운 친밀·기쁨의 대상을 드러내기 위해 ‘안에서’를 택했습니다.
- source_word: בָּהּ
  english_pob_choice: in her
  chosen_korean: 그곳[b]
  alternatives_korean:
  - 그녀 안에서
  - 그 안에서
  - 그 도시 안에서
  lexicon: HALOT
  rationale: 히브리어는 예루살렘을 여성형으로 가리키지만, 한국어에서는 도시를 ‘그녀’로 반복하면 어색해져서 인칭화는 각주로 알리고 본문은 ‘그곳’으로 옮겼습니다.
- source_word: קוֹל בְּכִי / וְק֥וֹל זְעָקָה
  english_pob_choice: the sound of weeping / the sound of crying
  chosen_korean: 울음의 소리나 부르짖음의 소리
  alternatives_korean:
  - 우는 소리나 외침의 소리
  - 통곡의 소리나 아우성의 소리
  - 울부짖는 소리나 외치는 소리
  lexicon: HALOT
  rationale: קוֹל의 ‘소리’와 두 명사 בְּכִי, זְעָקָה의 청각적 병렬을 살리기 위해 직역적 구조를 유지했습니다. זְעָקָה는 단순한 crying보다 더 강한 ‘부르짖음/외침’의 뉘앙스가 있어 구분했습니다.
theological_decisions:
- issue: 예루살렘에 대한 인칭화와 여성형 대명사 처리
  chosen_reading: 본문은 ‘그곳’으로 두고, 각주로 ‘그녀’에 해당하는 여성형 대명사를 설명합니다.
  alternative_readings:
  - 그녀 안에서
  - 그 안에서
  rationale: 히브리어의 여성형 도시 인칭화는 유지하되, 한국어 본문에서 비자연스러운 성별화 표현을 강제하지 않기 위해 의미는 보존하고 형태는 절제했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 두 개의 기쁨 동사의 병렬 유지
  chosen_reading: ‘기뻐하며 … 즐거워하겠습니다’로 두 동사의 대응을 살렸습니다.
  alternative_readings:
  - 기뻐하겠습니다 … 기뻐하겠습니다
  - 즐거워하겠습니다 … 즐거워하겠습니다
  rationale: גיל과 שׂושׂ의 근접하면서도 다른 어감을 한국어에서 너무 평평하게 합치지 않기 위해, 첫 동사는 ‘기뻐하다’, 둘째는 ‘즐거워하다’로 구분했습니다.
  doctrine_reference: Translation philosophy §5, §6
