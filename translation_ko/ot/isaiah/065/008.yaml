  to: 야훼께서 이렇게 말씀하십니다. “포도송이에서 새 포도주[a]가 발견될 때, 누군가 ‘그것을 파괴하지 마십시오. 그 안에 복이 있습니다’라고 말하는 것처럼, 나도 내 종들을 위하여 모든 것을 파괴하지 않도록 그렇게 하겠습니다.[b]”
  rationale: 현대 합쇼체를 일관되게 적용하고, 비교절의 불정 주어를 자연스럽게 표현했습니다. 마지막 절은 원문의 목적 관계와 목적어의 의도적 미표시를 유지했으며, 문맥상 ‘그들 모두’로 한정하지 않았습니다.
