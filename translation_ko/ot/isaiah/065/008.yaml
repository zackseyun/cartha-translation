id: ISA.65.8
reference: Isaiah 65:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כַּ/אֲשֶׁ֨ר יִמָּצֵ֤א הַ/תִּירוֹשׁ֙ בָּֽ/אֶשְׁכּ֔וֹל וְ/אָמַר֙ אַל תַּשְׁחִיתֵ֔/הוּ כִּ֥י בְרָכָ֖ה בּ֑/וֹ כֵּ֤ן אֶֽעֱשֶׂה֙ לְמַ֣עַן עֲבָדַ֔/י לְ/בִלְתִּ֖י הַֽשְׁחִ֥ית הַ/כֹּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
  footnotes:
  - marker: a
    text: Or 'wine' or 'fresh wine'; Hebrew תִּירוֹשׁ refers specifically to new wine.
    reason: lexical_alternative
  - marker: b
    text: Literally 'not to destroy all'; the Hebrew leaves the object implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "포도송이 가운데에서 새 포도주가 발견되면, 사람이 말하기를 ‘그것을 파괴하지 마라. 그 안에 복이 있다’ 하듯이, 나도 내 종들을 위하여 그렇게 하여 모든 것을 파괴하지 않겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새 포도주’는 히브리어 תִּירוֹשׁ의 어휘적 구분을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 목적어는 히브리어에서 직접 제시되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문이 여호와 대체어가 아니라 신명기적 고유명을 가리키므로, POB의 원칙에 따라 한국어에서도 야훼로 옮겨 이름의 직접성을 보존했습니다.
- source_word: תִּירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 포도주
  - 신 포도주
  - 포도즙
  lexicon: HALOT
  rationale: תִּירוֹשׁ의 어휘적 구분을 살려 일반적인 포도주보다 ‘새 포도주’로 옮겨, 아직 숙성되지 않은 포도주의 이미지를 드러냈습니다.
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 노예들
  - 내 하인들
  lexicon: HALOT
  rationale: 예언 문맥에서 본문의 초점은 신분의 노예성이 아니라 하나님께 속한 자들입니다. 따라서 POB 기본값에 따라 ‘종들’로 옮겼습니다.
- source_word: הַשְׁחִית
  english_pob_choice: destroy
  chosen_korean: 파괴하지 않겠습니다
  alternatives_korean:
  - 멸하지 않겠습니다
  - 망하게 하지 않겠습니다
  - 없애지 않겠습니다
  lexicon: HALOT
  rationale: 같은 어근의 반복을 살리기 위해 일관되게 ‘파괴하다’ 계열을 사용했습니다. 마지막 절의 ‘모든 것’을 함께 보존해, 전면적 파괴가 아니라 완전한 멸절의 거절이라는 강도를 유지했습니다.
theological_decisions:
- issue: 마지막 절의 ‘all’의 대상
  chosen_reading: ‘모든 것’을 그대로 살려, 하나님이 전면적 파괴를 거부하신다는 의미를 남겼습니다.
  alternative_readings:
  - 그들 모두
  - 그것 모두
  rationale: 히브리어는 목적어를 직접 말하지 않으므로, 한국어에서 대상을 과도하게 특정하지 않고 본문의 열린 표현을 유지하는 쪽이 더 원문에 가깝습니다.
  doctrine_reference: 문맥적 함의를 존중하되 불필요하게 해석을 고정하지 않는 원칙
