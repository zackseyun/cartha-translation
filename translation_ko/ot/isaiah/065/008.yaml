  source_fidelity: 야훼, 새 포도주, 복, 내 종들 및 마지막 목적어의 미표시를 대체로 충실히 반영합니다. 다만 ‘사람이 말하기를 … 하듯이’는 현대 한국어에서 부자연스럽고, 인용문 안의 반말 명령은 지정된 합쇼체 문체와 맞지 않습니다. 마지막 절은 원문의 목적절을 더 분명히 드러내도록 다듬을 수 있습니다.
  naturalness: ‘포도송이에서 새 포도주가 발견될 때, 누군가 … 말하는 것처럼’과 ‘…하지 않도록 그렇게 하겠습니다’가 현대적이고 자연스러운 합쇼체입니다. 각주 표지도 해당 어휘와 마지막 절 바로 뒤에 배치하는 편이 명확합니다.
  terminology: ‘야훼’, ‘새 포도주’, ‘내 종들’, ‘복’은 적절합니다. שׁחת의 반복은 ‘파괴하다’로 유지했습니다. ‘모든 것’은 히브리어 הַכֹּל의 목적어가 명시되지 않은 상태를 과도하게 인칭화하지 않고 보존합니다.
