source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
  footnotes:
  - marker: a
    text: Or 'will shout for joy' for 'will sing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from a glad heart'; the Hebrew idiom is literally 'from the goodness/gladness of heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from anguish of heart.'
    reason: lexical_alternative
  - marker: d
    text: Or 'you will howl.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내 종들은 마음의 기쁨으로 노래할 것이지만, 너희는 마음의 고통으로 부르짖고, 부서진 영으로 통곡할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 강조적 주의를 환기하는 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 강조적 주의를 환기하는 감탄사로, 현대 한국어에서 공적·문어체로 자연스러운 명령형을 택했습니다.
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 시종들
  - 내 노예들
  lexicon: HALOT
  rationale: 여기서는 하나님께 속한 자들을 가리키는 관계 표현이 핵심이므로, 본문의 언약적 대비를 살리면서도 과도하게 제도적 신분을 전면화하지 않는 ‘종들’을 택했습니다.
- source_word: מִטּוּב לֵב
  english_pob_choice: for gladness of heart
  chosen_korean: 마음의 기쁨으로
  alternatives_korean:
  - 마음의 좋음으로
  - 기쁜 마음에서
  lexicon: HALOT
  rationale: 히브리어 관용구는 도덕적 ‘선함’보다 내적 즐거움/기쁨을 뜻하므로, 문맥상 자연스럽고 병행을 살리는 표현으로 옮겼습니다.
- source_word: תְּיֵלִילוּ
  english_pob_choice: you will wail
  chosen_korean: 통곡할 것입니다
  alternatives_korean:
  - 울부짖을 것입니다
  - 곡할 것입니다
  lexicon: HALOT
  rationale: אַול/ילל 계열의 강한 애통을 한국어에서 가장 분명하게 드러내는 말은 ‘통곡하다’이므로, 단순한 울음보다 더 강한 소리를 살렸습니다.
theological_decisions:
- issue: ‘내 종들’과 ‘너희’의 대비를 어떻게 처리할지
  chosen_reading: 구체적 집단을 과도하게 해설하지 않고, 하나님 편의 기쁨과 विरोध대상의 고통이라는 본문의 선명한 대조를 그대로 유지했습니다.
  alternative_readings:
  - ‘내 종들’을 남은 자로 명시하기
  - ‘너희’를 배교한 이스라엘로 특정하기
  rationale: 본문 자체는 대비를 분명히 하지만, 번역이 해석을 선행해 범위를 좁힐 필요는 없습니다. POB의 기존 주해 방향처럼 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
