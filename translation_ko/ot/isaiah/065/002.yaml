    reason: lexical_alternative
  - marker: c
    text: Or 'following their own plans' or 'schemes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 온종일 손을 벌렸는데도 — 반역하는 백성에게, 곧 자기들의 생각을 따라 가는, 좋지 않은 길로 걷는 자들에게 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안 번역: ‘내가 온종일 손을 내밀었다.’'
    reason: lexical_alternative
  - marker: b
    text: '대안 번역: ‘반항하는 백성.’'
    reason: lexical_alternative
  - marker: c
    text: '대안 번역: ‘자기들의 계획’ 또는 ‘계략.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי יָדַי
  english_pob_choice: I spread out my hands
  chosen_korean: 손을 벌렸는데도
  alternatives_korean:
  - 두 손을 펼쳤는데도
  - 두 손을 내밀었는데도
  - 손을 펼쳐 보였는데도
  lexicon: HALOT
  rationale: 동작의 구체적 이미지를 살리면서 현대 한국어에서 자연스럽게 들리는 ‘손을 벌리다’로 옮겼습니다. 영어 POB의 ‘spread out’과 같은 몸짓의 개방성과 청원을 함께 드러냅니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 종일
  - 날마다
  lexicon: HALOT
  rationale: 지속적이고 끊임없는 행위를 나타내는 관용구이므로, 한국어의 자연스러운 대응인 ‘온종일’을 선택했습니다.
- source_word: עַם סוֹרֵר
  english_pob_choice: a rebellious people
  chosen_korean: 반역하는 백성
  alternatives_korean:
  - 반항하는 백성
  - 패역한 백성
  - 고집 센 백성
  lexicon: HALOT
  rationale: סוֹרֵר는 단순한 고집보다 언약에 대한 반역성과 도덕적 일탈을 함께 띠므로 ‘반역하는’이 가장 직접적입니다. ‘백성’은 이사야의 언약 공동체 문맥을 잘 반영합니다.
- source_word: הַהֹלְכִים הַדֶּרֶךְ לֹא טוֹב אַחַר מַחְשְׁבֹתֵיהֶם
  english_pob_choice: who walk in a way that is not good, following their own thoughts
  chosen_korean: 자기들의 생각을 따라 가는, 좋지 않은 길로 걷는 자들
  alternatives_korean:
  - 자기들의 생각을 좇아 좋지 않은 길을 걷는 자들
  - 자기들의 계획을 따라 나쁜 길로 걷는 자들
  - 좋지 않은 길을 걷고 자기들의 생각을 따르는 자들
  lexicon: HALOT
  rationale: ‘걷다’의 행위적 은유를 보존하면서 אַחַר를 ‘따라’로, מַחְשְׁבוֹתֵיהֶם을 ‘생각’으로 옮겼습니다. ‘plans/schemes’ 가능성은 있으나, 영어 POB가 택한 ‘thoughts’를 따라 자기주도적 사고를 드러내는 번역이 원문과 더 직접적입니다.
theological_decisions:
- issue: 하나님의 몸짓을 어떻게 보존할지
  chosen_reading: 하나님이 ‘손을 벌리셨다’는 신체적 은유를 그대로 살려, 지속적인 호소와 받아들이려는 태도를 드러냈습니다.
  alternative_readings:
  - ‘계속 손을 내미셨다’로 더 동적으로 풀기
  - 은유를 완화해 ‘부르셨다’로 옮기기
  rationale: 히브리어는 추상화된 진술이 아니라 몸짓의 이미지를 사용합니다. 이 이미지를 보존해야 하나님의 인내와 백성의 반역 사이의 긴장이 흐려지지 않습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: לֹא טוֹב의 평가를 어느 정도로 옮길지
  chosen_reading: ‘좋지 않은’으로 옮겨, 원문이 말하는 ‘좋음’의 부정이라는 더 넓은 평가를 유지했습니다.
  alternative_readings:
  - ‘악한’으로 강화하기
  - ‘옳지 않은’으로 도덕적 판단을 해석하기
  rationale: 원문은 ‘악’이라는 더 강한 용어가 아니라 ‘좋지 않다’고 말합니다. 이를 유지해야 본문의 평가 범위를 넘어서지 않습니다.
  doctrine_reference: Translation philosophy §1, §3
