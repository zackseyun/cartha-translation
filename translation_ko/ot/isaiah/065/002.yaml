  source_fidelity: 히브리어는 ‘내가 온종일 … 백성을 향하여 두 손을 펼쳤다’라는 완결된 선언이며, 그 백성은 ‘자기들의 생각을 따라 좋지 않은 길을 걷는’ 자들입니다. 초안의 ‘-는데도’는 원문에 없는 양보 관계를 더하고, 문말의 ‘그렇습니다’는 원문에 없는 서술을 삽입합니다. 이를 제거하고 관계절의 수식 범위를 분명히 해야 합니다.
  naturalness: 초안은 대시 뒤의 명사구와 ‘그렇습니다’가 문법적으로 자연스럽게 연결되지 않습니다. 수정문은 현대 표준어 합쇼체의 완결된 문장으로, 원문의 수식 관계와 강조를 자연스럽게 보존합니다.
  terminology: ‘두 손을 펼쳤습니다’는 יָדַי의 쌍수적 몸짓과 פֵּרַשְׂתִּי의 구체적 이미지를 잘 살립니다. ‘반역하는 백성’, ‘좋지 않은 길’, ‘자기들의 생각’은 각각 סוֹרֵר, לֹא טוֹב, מַחְשְׁבֹתֵיהֶם에 충실하며, ‘악한’이나 ‘계략’처럼 의미를 강화하지 않습니다.
