    issue: ‘날수로 된 갓난아기’
    rationale: עוּל יָמִים의 문자적 형태를 기계적으로 따른 표현으로, 한국어에서는 ‘날수로 된’이 무엇을 뜻하는지 자연스럽게 전달되지 않습니다. 본문의 관용적 의미를 ‘며칠밖에 살지 못하는’으로 옮기고 문자적 표현은 각주에 보존하는 것이 정확성과 가독성을 함께 살립니다.
