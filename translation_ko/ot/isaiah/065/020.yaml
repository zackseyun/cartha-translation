    rationale: 히브리어는 ‘젊은이 ... 죽을 것이며 / 죄인 ... 저주받을 것이다’라는 병렬 진술입니다. ‘...것이기 때문입니다’는 כי의 설명 기능은 살리지만 두 진술을 앞 문장의 이유로 과도하게 묶습니다. ‘이는’ 뒤에 병렬 미래절을 사용하면 설명 관계와 원문의 구조를 모두 유지합니다.
