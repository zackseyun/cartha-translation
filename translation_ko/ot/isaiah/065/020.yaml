id: ISA.65.20
reference: Isaiah 65:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
  footnotes:
  - marker: a
    text: Or, 'an infant who lives only a few days.' The Hebrew literally says 'an infant of days.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'an old man who does not live out his days.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'the sinner a hundred years old will be cursed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에는 더 이상 날수로 된 갓난아기[a]도 없고, 자기 날을 다 채우지 못하는 노인[b]도 없을 것입니다. 이는 백 살 된 젊은이도 죽고, 백 살 된 죄인도 저주를 받을 것이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘며칠밖에 살지 못하는 갓난아기’. 히브리어는 문자적으로 ‘날들의 갓난아기’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘자기 날을 다 살지 못하는 노인’.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘백 살 된 죄인은 저주를 받을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 그곳에는
  alternatives_korean:
  - 거기서부터
  - 그곳으로부터
  lexicon: HALOT
  rationale: 히브리어 מִן의 출발점을 살리면 ‘그곳에는/그곳으로부터’가 가능하지만, 한국어에서는 ‘그곳에는’이 문맥상 자연스러우면서도 장소 표지를 유지합니다.
- source_word: עוּל יָמִים
  english_pob_choice: an infant of days
  chosen_korean: 날수로 된 갓난아기
  alternatives_korean:
  - 며칠밖에 못 사는 갓난아기
  - 날들의 아기
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘of days’를 완전히 풀어 쓰지 않고, POB의 본문 뜻을 살리면서도 한국어로 읽히는 표현으로 옮겼습니다.
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  english_pob_choice: an old man who does not fill out his days
  chosen_korean: 자기 날을 다 채우지 못하는 노인
  alternatives_korean:
  - 자기 날을 다 채우지 못하는 늙은이
  - 자기 생애를 다 채우지 못하는 노인
  lexicon: HALOT
  rationale: ‘날을 채우다’는 ימים을 살리는 표현이므로 유지했고, ‘자기 날’을 넣어 소유격을 드러냈습니다.
- source_word: בֶּן מֵאָה שָׁנָה יָמוּת
  english_pob_choice: the youth will die a hundred years old
  chosen_korean: 백 살 된 젊은이도 죽고
  alternatives_korean:
  - 백 살 된 청년도 죽고
  - 백 살이 되어도 젊은이는 죽고
  lexicon: HALOT
  rationale: ‘בן־מאה שנה’는 나이 표현으로 한국어 관용에 맞게 ‘백 살 된’으로 옮기고, נַעַר는 성별을 과도하게 특정하지 않는 ‘젊은이’로 처리했습니다.
- source_word: הַחוֹטֵא ... יְקֻלָּל
  english_pob_choice: the sinner ... will be accursed
  chosen_korean: 백 살 된 죄인도 저주를 받을 것이기 때문입니다
  alternatives_korean:
  - 백 살 된 죄인도 저주를 받을 것입니다
  - 백 살 된 죄인도 저주받을 것입니다
  lexicon: HALOT
  rationale: Pual의 수동 의미를 살려 ‘저주를 받을’로 옮겼고, ‘accursed’의 강한 판정성을 한국어에서 과도하게 약화시키지 않았습니다.
theological_decisions:
- issue: 죽음과 저주에 관한 종말론적 긴장
  chosen_reading: 본문의 ‘죽다’와 ‘저주를 받다’를 그대로 살려, 새 창조의 질서 안에서도 죄의 결과가 여전히 드러난다는 긴장을 보존했습니다.
  alternative_readings:
  - 죽음을 상징적으로 풀어 쓰는 읽기
  - 신학적 조화를 위해 표현을 완화하는 읽기
  rationale: 히브리어 동사와 서술형 표현이 분명하므로, 해석을 미리 매끈하게 정리하기보다 원문의 긴장을 드러내는 것이 번역 원리에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
