  source_fidelity: 전반적으로 히브리어의 분사 연쇄와 핵심 어휘를 충실히 반영합니다. 다만 פֶּרֶק은 ‘국물/육수’에 가까운 액체 음식으로 이해되는 경우가 많으므로, 본문의 ‘국’보다 ‘국물’이 영어 POB의 ‘broth’ 및 원문의 용기 안에 있는 액체라는 이미지에 조금 더 정확합니다. 난해한 נְצוּרִים은 ‘숨은 곳’으로 두고 각주에서 대안을 보존하는 것이 적절합니다.
