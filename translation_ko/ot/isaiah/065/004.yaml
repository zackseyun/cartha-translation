id: ISA.65.4
reference: Isaiah 65:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
  footnotes:
  - marker: a
    text: Or 'in hidden places'; the Hebrew term is difficult and has also been understood as 'in guarded places' or, less likely in context, 'in besieged places.'
    reason: lexical_alternative
  - marker: b
    text: Or 'soup' or 'stew' of unclean/abominable things.
    reason: lexical_alternative
translation:
  language: ko
  text: 무덤들 사이에 앉아 있고 숨은 곳[a]에서 밤을 지내며, 돼지고기를 먹고 부정한 것들의 국물[b]이 그들의 그릇에 있는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 난해하며, ‘숨은 곳’ 외에 ‘지켜진 곳’ 또는 문맥상 덜 가능하지만 ‘포위된 곳’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수프’나 ‘스튜’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  english_pob_choice: who sit
  chosen_korean: 앉아 있고
  alternatives_korean:
  - 거하며
  - 머물며
  lexicon: WLC/HALOT
  rationale: 분사 구조를 살려 그들의 지속적인 상태를 나타내되, 한국어에서는 자연스럽게 ‘앉아 있고’로 옮겨 무덤과의 근접한 연루 이미지를 보존했습니다.
- source_word: בַּקְּבָרִים
  english_pob_choice: among the graves
  chosen_korean: 무덤들 가운데
  alternatives_korean:
  - 무덤들 안에
  - 묘들 가운데
  lexicon: WLC/HALOT
  rationale: קברים의 기본 의미를 현대 한국어의 ‘무덤들’로 옮기고, ב의 관계를 ‘가운데’로 처리해 단순한 위치가 아니라 무덤들과 뒤섞인 상태를 드러냈습니다.
- source_word: וּבַנְּצוּרִים
  english_pob_choice: in hidden places
  chosen_korean: 숨은 곳에서
  alternatives_korean:
  - 숨겨진 곳에서
  - 감추인 곳에서
  - 지켜진 곳에서
  lexicon: WLC/HALOT
  rationale: 어휘가 난해하므로 영어 POB의 판단대로 ‘hidden places’ 계열을 따르되, 한국어에서는 가장 자연스럽고 중립적인 ‘숨은 곳’으로 옮겨 lexical uncertainty를 과도하게 해소하지 않았습니다.
- source_word: פִּגֻּלִים
  english_pob_choice: unclean things
  chosen_korean: 부정한 것들
  alternatives_korean:
  - 가증한 것들
  - 더럽혀진 것들
  lexicon: WLC/HALOT
  rationale: 제의적 부정함을 현대 독자가 즉시 이해하도록 ‘부정한 것들’로 옮겼습니다. ‘가증한 것들’은 가능하지만 더 강한 평가를 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: 부정한 음식과 무덤 관련 행위의 직설적 표현
  chosen_reading: 전통적 완곡어법으로 약화하지 않고, 무덤·돼지고기·부정한 음식의 구체성을 그대로 드러냈습니다.
  alternative_readings:
  - ‘금지된 음식’으로 일반화
  - ‘시체와 관련된 부정’으로 풀이
  rationale: 본문은 우상숭배/제의적 부정의 구체적 장면을 묘사하므로, 의미를 넓게 풀기보다 원문의 충격과 질감을 유지하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 제의적 부정의 구체성 보존
- issue: ‘그들의 그릇에 있는’의 소유·잔존 관계
  chosen_reading: ‘부정한 것들의 국이 그들의 그릇에 있는’으로 옮겨, 그릇 안에 부정한 음식이 남아 있는 상태를 살렸습니다.
  alternative_readings:
  - ‘그릇들은 부정한 것들로 가득하다’
  - ‘그릇에 부정한 국을 담아 둔다’
  rationale: 히브리어는 소유격과 존재를 함께 암시하므로, ‘있는’으로 처리해 내용과 보유 상태를 동시에 드러냈습니다.
  doctrine_reference: 문법-의미 보존; 사소한 해석 과잉 억제
