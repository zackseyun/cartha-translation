source:
  edition: WLC
  text: אֲשֶׁ֨ר הַ/מִּתְבָּרֵ֜ךְ בָּ/אָ֗רֶץ יִתְבָּרֵךְ֙ בֵּ/אלֹהֵ֣י אָמֵ֔ן וְ/הַ/נִּשְׁבָּ֣ע בָּ/אָ֔רֶץ יִשָּׁבַ֖ע בֵּ/אלֹהֵ֣י אָמֵ֑ן כִּ֣י נִשְׁכְּח֗וּ הַ/צָּרוֹת֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/כִ֥י נִסְתְּר֖וּ מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
  footnotes:
  - marker: a
    text: Or 'pronounces himself blessed.' The Hebrew verb is reflexive.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the earth.' Hebrew אֶרֶץ can mean either 'land' or 'earth' depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'by the God of truth' or 'by the faithful God.' Hebrew 'Amen' carries the sense of firmness, faithfulness, and truth.
    reason: alternative_reading
translation:
  language: ko
  text: 땅에서 자신을 복되다고 하는 사람은 진리의 하나님으로 말미암아 자신을 복되다고 할 것이고, 땅에서 맹세하는 사람은 진리의 하나님으로 말미암아 맹세할 것입니다. 이는 이전의 재앙들이 잊혔고, 그것들이 내 눈에서 가려졌기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '땅에서.' 히브리어 אֶרֶץ는 문맥에 따라 '땅' 또는 '땅/세상'을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '진리의 하나님으로.' 히브리어 אָמֵן은 견고함, 신실함, 진리의 의미를 함께 담고 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '이전의 고난들이.' 히브리어 צָרוֹת는 '재앙들, 환난들, 고난들'의 넓은 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  english_pob_choice: blesses himself / will bless himself
  chosen_korean: 자신을 복되다고 하는 사람 / 자신을 복되다고 할 것입니다
  alternatives_korean:
  - 자신을 복되다고 축복하는 사람
  - 자신을 복되다고 선언하는 사람
  lexicon: HALOT
  rationale: 히트파엘의 반사적 용법을 살려 단순히 '축복하다'보다 자기 자신에게 복을 선언하는 뜻을 드러냈습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 땅 안에서
  lexicon: HALOT
  rationale: 문맥상 אַרֶץ의 범위를 과도하게 확장하지 않고, 현대 한국어에서 자연스러운 '땅에서'로 옮겼습니다.
- source_word: בֵּאלֹהֵי אָמֵן
  english_pob_choice: by the God of Amen / by the God of truth
  chosen_korean: 진리의 하나님으로 말미암아
  alternatives_korean:
  - 아멘의 하나님으로
  - 신실하신 하나님으로
  lexicon: HALOT
  rationale: אָמֵן의 함의를 한국어로 직역하기보다, 본문과 주석이 제시하는 '진리/신실함'의 의미를 살려 '진리의 하나님'으로 옮겼습니다. '말미암아'는 히브리어 전치사의 매개 의미를 자연스럽게 반영합니다.
- source_word: נִשְׁכְּחוּ הַצָּרוֹת הָרִאשֹׁנוֹת
  english_pob_choice: the former troubles are forgotten
  chosen_korean: 이전의 재앙들이 잊혔고
  alternatives_korean:
  - 옛 환난들이 잊혔고
  - 이전의 고난들이 잊혔고
  lexicon: HALOT
  rationale: צָרוֹת는 단순한 불편함보다 강한 재난·환난의 뉘앙스를 가지므로, 문맥의 무게를 살려 '재앙들'로 옮겼습니다.
- source_word: נִסְתְּרוּ מֵעֵינָי
  english_pob_choice: they are hidden from my eyes
  chosen_korean: 내 눈에서 가려졌기 때문입니다
  alternatives_korean:
  - 내 눈에 숨겨졌기 때문입니다
  - 내 눈에서 감추어졌기 때문입니다
  lexicon: HALOT
  rationale: 인간적 의인법을 유지하면서 한국어에서 자연스러운 수동 표현으로 옮겨, 하나님이 더 이상 그것들을 보지 않으시는 상태를 드러냈습니다.
theological_decisions:
- issue: בֵּאלֹהֵי אָמֵן의 핵심 표지
  chosen_reading: 진리의 하나님
  alternative_readings:
  - 아멘의 하나님
  - 신실하신 하나님
  rationale: 히브리어 אָמֵן의 뜻을 너무 낯설게 남기지 않되, 본문이 의도하는 견고함·진실함·신실함의 신학적 결을 살리기 위해 '진리의 하나님'을 본문에 채택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: נִסְתְּרוּ의 결과 상태
  chosen_reading: 내 눈에서 가려졌기 때문입니다
  alternative_readings:
  - 내 눈에서 숨겨졌기 때문입니다
  - 내 눈에서 감추어졌기 때문입니다
  rationale: 하나님이 이전의 재앙들을 더 이상 마주하지 않으신다는 종결적 상태를 한국어 문장 흐름 속에서 분명히 하되, 신적 의인화를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
