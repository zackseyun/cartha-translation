id: ISA.15.9
reference: Isaiah 15:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מֵ֤י דִימוֹן֙ מָ֣לְאוּ דָ֔ם כִּֽי אָשִׁ֥ית עַל דִּימ֖וֹן נוֹסָפ֑וֹת לִ/פְלֵיטַ֤ת מוֹאָב֙ אַרְיֵ֔ה וְ/לִ/שְׁאֵרִ֖ית אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
  footnotes:
  - marker: a
    text: Dimon may reflect a wordplay on 'blood' (dam). Some relate the place name to Dibon.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will set additional things upon Dimon.' The Hebrew leaves the added calamities implicit.
    reason: alternative_reading
  - marker: c
    text: The 'lion' may be a literal lion or a figurative image for further judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 디몬의 물이 피로 가득하기 때문입니다[a]. 이는 내가 디몬 위에 더욱 많은 것을 내리겠기 때문입니다[b]. 곧 모압의 도망자들 위에 사자요, 그 땅의 남은 자들 위에 사자입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 디몬은 ‘피’(dam)와의 말장난을 담는 지명일 수 있으며, 일부는 이를 디본과 연결합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘디몬 위에 추가적인 것들을 두겠다’는 뜻일 수 있습니다. 히브리어는 덧붙여질 재앙의 내용을 생략합니다.
    reason: alternative_reading
  - marker: c
    text: 사자는 문자적 사자일 수도 있고, 더 큰 심판을 가리키는 비유일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  english_pob_choice: the waters of Dimon
  chosen_korean: 디몬의 물
  alternatives_korean:
  - 디본의 물
  lexicon: HALOT
  rationale: 히브리어 본문은 지명 형태로 디몬을 보존하므로, 본문 표면형을 따라 ‘디몬’으로 옮기고 ‘물’의 소유격 구조를 유지했습니다.
- source_word: מָלְאוּ דָם
  english_pob_choice: are full of blood
  chosen_korean: 피로 가득하기 때문입니다
  alternatives_korean:
  - 피로 가득 차 있기 때문입니다
  - 피로 가득합니다
  lexicon: HALOT
  rationale: מלא의 상태 의미를 자연스러운 한국어로 살리되, 인과절 앞에서 선명하게 들리도록 ‘피로 가득하기 때문입니다’로 옮겼습니다.
- source_word: נוֹסָפוֹת
  english_pob_choice: still more / more
  chosen_korean: 더욱 많은 것
  alternatives_korean:
  - 추가된 것
  - 더 많은 재앙
  lexicon: HALOT
  rationale: 히브리어는 추가되는 대상이 생략되어 있으므로, 본문이 암시하는 ‘더함’을 살리되 특정 명사를 덧붙이지 않도록 ‘더욱 많은 것’으로 처리했습니다.
- source_word: לִפְלֵיטַת מוֹאָב
  english_pob_choice: upon the fugitives of Moab
  chosen_korean: 모압의 도망자들 위에
  alternatives_korean:
  - 모압의 피난자들 위에
  - 모압의 생존자들 위에
  lexicon: HALOT
  rationale: פְלֵיטָה는 도피·생존의 결과를 가리키지만, 전쟁 맥락에서는 ‘도망자들’이 장면의 긴박함을 가장 직접적으로 드러냅니다.
- source_word: אַרְיֵה
  english_pob_choice: a lion
  chosen_korean: 사자
  alternatives_korean:
  - 한 마리 사자
  - 사자의 형상
  lexicon: HALOT
  rationale: 단수 명사를 그대로 살려 구체적 이미지로 유지했습니다. 본문이 이 사자의 의미를 설명하지 않으므로 해석을 닫지 않았습니다.
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  english_pob_choice: and upon the remnant of the land
  chosen_korean: 그 땅의 남은 자들 위에
  alternatives_korean:
  - 그 땅의 남은 것들 위에
  - 땅의 남은 자들 위에
  lexicon: HALOT
  rationale: אֲדָמָה는 여기서 토양보다 영토적 의미의 ‘땅’이 자연스럽고, שְׁאֵרִית는 남아 있는 사람들을 가리키는 문맥상 ‘남은 자들’이 가장 분명합니다.
theological_decisions:
- issue: 디몬/피의 말장난과 지명 보존
  chosen_reading: 지명은 ‘디몬’으로 보존하고, 본문에 보이는 ‘피’와의 말장난은 주석 없이 드러나는 대로 둡니다.
  alternative_readings:
  - 디본으로 보정해 읽기
  - 말장난을 설명적으로 풀어 쓰기
  rationale: 히브리어 본문은 음성 유사성을 통해 심판의 이미지를 강화하지만, 지명 표면형 자체를 고치거나 설명을 본문에 삽입할 근거는 없습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장과 암시를 해설보다 우선 보존합니다.'
- issue: 사자의 정체성
  chosen_reading: ‘사자’라는 구체적 이미지만 유지하고, 문자적/비유적 의미를 본문에서 결론내리지 않습니다.
  alternative_readings:
  - 실제 사자
  - 침략 세력의 상징
  rationale: 히브리어는 심판의 도구를 제시하지만 그 참조 대상을 명시하지 않으므로, 번역은 모호성을 그대로 남겨야 합니다.
  doctrine_reference: '번역 원칙: 해석의 여지를 본문 수준에서 보존합니다.'
